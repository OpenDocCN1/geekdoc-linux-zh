  \n## 关于作者\n\nSreekrishnan Venkateswaran 拥有印度理工学院坎普尔分校（位于印度）的计算机科学硕士学位。在 IBM 工作的\
  \ 12 年里，他将 `Linux` 移植到了从手表、PDA、音乐播放器到 VoIP 电话、起搏器编程器和远程患者监测系统的各种设备。Sreekrishnan\
  \ 曾担任《Linux 杂志》 2 多年的特特约编辑和内核专栏作家。目前，他在 IBM 印度管理嵌入式解决方案小组。\n\n## 第 1 章 引言\n\n###\
  \ 本章内容\n\n* 演变\n* GNU 共享许可证\n* Kernel.org\n* 邮件列表与论坛\n* Linux 发行版\n* 查看源码\n* 构建内核\n\
  * 可加载模块\n* 开始之前\n\nLinux 极具吸引力。它散发出一种国际化项目的迷气息，来自不同国籍、信仰和性别的人在此共同协作。源代码的免费可用以及易于理解的\
  \ `UNIX-like` 编程环境促进了它的爆发性成功。来自互联网的、免费专家提供的高质量支持，对于构建起一个巨大的 `Linux` 社区也发挥了重要作用。\n\
  \n开发者对于在可以访问所有源码的技术工作感到非常兴奋，因为这让他们能够创建创新的解决方案。例如，你可以修改源码并定制 `Linux`，使其在你的设备上几秒钟内启动，这种\
  \ feat 在专有操作系统上很难实现的。\n\n### 演变\n\n`Linux` 起于 1991 年一个名为 `Linus Torvalds` 的芬兰大学学生的爱好，但很快演变成了一种全球风靡的先进操作系统。从为\
  \ `Intel 386` 处理器发布的首个版本开始，内核的复杂度逐渐增加，以支持多种架构、多处理器硬件和高性能集群。支持的 CPU 完整列表很长，但一些主要的支持架构包括\
  \ `x86`、`IA64`、`ARM`、`PowerPC`、`Alpha`、`s390`、`MIPS` 和 `SPARC`。`Linux` 已被移植到基于这些处理器的数百个硬件平台上。内核正在不断改进，演变正以疯狂的速度进行。\n\
  \n尽管最初是一个桌面操作系统，但它已经渗透到嵌入式和企业世界，并影响着我们的日常生活。当你按下手持设备上的按钮，翻动遥控器到天气频道，或者去医院体检时，极可能有某些\
  \ `Linux` 代码正在运行为你提供服务。`Linux` 的免费可用性与其技术优越性一样帮助了它的演变。无论是开发低于 100 美元的计算机以帮助世界贫困地区的计划，还是消费电子领域的价格压力，`Linux`\
  \ 都是今天的首选操作系统，因为专有操作系统的成本有时高于计算机本身的售价。\n\n### GNU 共享许可证\n\n`GNU` 项目（`GNU` 是 \"GNU's\
  \ Not Unix\" 的递归缩写）早于 `Linux`，其目标是开发一个自由的 `UNIX-like` 操作系统。一个完整的 `GNU` 操作系统由 `Linux`\
  \ 内核驱动，但也包含库、编译器和实用程序等组件。因此，基于 `Linux` 的计算机更准确地说是 `GNU/Linux` 系统。`GNU/Linux` 系统的所有组件都是使用自由软件构建的。\n\
  \n自由软件有不同的类型。其中一种被称为公有领域软件。在公有领域发布的软件不受版权保护，对其使用不施加任何限制。你可以免费使用它，对其进行修改，甚至可以限制你修改后的源码的分发。正如你所看到的，“无限制”条款引入了在下游施加限制的。\n\
  \n`GNU` 项目的主要赞助者自由软件基金会创建了 `GNU General 许可证`（`GPL`），也称为共享许可证（copyleft），以防止中间人将自由软件转换为专有软件的可能性。修改共享软件的人被要求对其衍生作品也进行共享。`Linux`\
  \ 内核和 `GNU` 系统的大多数组件（如 `GNU Compiler Collection` 即 `GCC`）都是根据 `GPL` 发布的。因此，如果你对内核进行了修改，你就必须将更改交回社区。本质上，你必须传递共享许可证赋予你的权利。\n\
  \n`Linux` 内核根据 `GPL` 第 2 版许可。内核社区目前正在讨论内核是否应该迁移到 `GPLv3`（`GPL` 的最新版本）。目前的趋势似乎反对将内核重新许可以采用\
  \ `GPLv3`。然而，通过系统调用访问内核服务的 Linux 应用并不被视为衍生作品，不受 `GPL` 的限制。同样，库受一种更宽松的许可证保护，即 `GNU\
  \ 通用许可证`（`LGPL`）。\n\n### Kernel.org\n\n`Linux` 内核的主要仓库是 [www.kernel.org](http://www.kernel.org)。该网站包含了所有发布的内核版本。全球许多网站都镜像了\
  \ `kernel.org` 的内容。\n\n除了发布的内核，`kernel.org` 还托管了由一线开发者维护的补丁集，作为未来稳定版本的测试。补丁（patch）是一个包含开发树与开发者开始工作的原始快照之间源代码差异的文件。kernel.org\
  \ 上流行的补丁集是由 Linux 内核首席维护者 `Andrew Morton` 定期发布的 `-mm` 补丁。你将在 `-mm` 补丁中发现尚未进入主树的实验性功能。另一个定期发布在\
  \ `kernel.org` 的补丁集是由 `Ingo Molnar` 维护的 `–rt`（实时）补丁。若干 `–rt` 功能已并入内核。\n\n### 邮件列表与论坛\n\
  \nLinux 内核邮件列表 (`LKML`) 是开发者讨论设计问题和决定未来功能的论坛。你可以在 [www.lkml.org](http://www.lkml.org)\
  \ 获取邮件列表的实时更新。内核现在包含了由全球数千名开发者贡献的数百万行代码。`LKML` 充当了将所有开发者联系在一起的纽带。\n\n`LKML` 并不是用于通用\
  \ Linux 问题。基本规则是仅发布那些在邮件列表或常用文档中未回答过的内核开发问题。如果 C 编译器在编译你的 Linux 应用时崩溃，你应该在其他地方提问。\n\
  \n\n\n\n\n内核中的大多数子项目都有自己特定的邮件列表。因此，如果你正在开发 Linux 闪存内存驱动程序，请订阅 `linux-mtd` 邮件列表；如果你认为在\
  \ USB 大容量存储驱动程序中发现了 bug，请在 `linux-usb-devel` 邮件列表中发起线程。我们会在几个章节的末尾提到相关的邮件列表。\n\n\
  在各种论坛中，来自全球的内核专家汇聚一堂。每年在加拿大渥太华举办的 Linux 研会议（Linux Symposium）就是此类会议之一。其他的包括在德国举行的\
  \ Linux Kongress 和在澳大利亚组织的 `linux.conf.au`。此外还有许多商业 Linux 论坛，行业领者会在那里聚会并分享见解，例如每年在北美举办的\
  \ LinuxWorld 会议和展览会。\n\n要获取开发者社区的最新动态，请查看 [`lwn.net/`](http://lwn.net/)。如果你想在没有过多关于内核内部晦涩引用的情况下了解最新内核版本的亮点，这里可能是一个很好的去处。你还可以在\
  \ [`kerneltrap.org/`](http://kerneltrap.org/) 找到另一个讨论当前内核话题的网络社区。\n\n随着每个主要内核版本的发布，你将看到巨大的改进，无论是内核抢占、无锁读取器、从中断处理程序中卸载工作的新服务，还是对新架构的支持。保持与邮件列表、网站和论坛的密切联系，让自己处于前沿。\n\
  \n### Linux 发行版\n\n由于一个 GNU/Linux 系统由许多实用程序、程序、库和工具组成，内核内核，获取并正确安装所有组件是一项艰巨的任务。Linux\
  \ 发行版通过对组件进行分类并有序将它们打包成包来解决这个问题。一个典型的发行版包含成千上万个现成的包。你不需要担心下载正确的程序版本或修复依赖问题。\n\n\
  由于打包是在 GNU 许可证范围内赚钱的一种方式，目前市场上存在多种 Linux 发行版。如 Red Hat/Fedora、Debian、SuSE、Slackware、Gentoo、Ubuntu\
  \ 和 Mandriva 等发行版主要面向桌面用户。MontaVista、TimeSys 和 Wind River 发行版则面向嵌入式开发。嵌入式 Linux\
  \ 发行版还包括一个动态配置的紧凑应用程序集，以调整系统的足迹以适应资源限制。\n\n除了打包，发行版还为内核开发提供了增值服务。许多项目是基于发行版提供的内核开始开发，而不是从\
  \ `kernel.org` 官方发布的内核。原因如下：\n\n*   符合你设备所属行业领域标准的 Linux 发行版通常是更好的开发起点。特殊兴趣小组（SIGs）已经形成，用以促进\
  \ Linux 在各个领域的应用。消费电子 Linux 论坛（CELF）托管在 [www.celinuxforum.org](http://www.celinuxforum.org)，专注于在消费电子设备上使用\
  \ Linux。CELF 规范定义了对可扩展足迹、快速启动、就地执行和电源管理等功能的支持，这些功能在消费电子设备上是非常受欢迎的。开源开发实验室（OSDL）托管在\
  \ [www.osdl.org](http://www.osdl.org)，其重点在于载波级设备的独特特性。OSDL 的载波级 Linux（CGL）规范规范了可靠性、高可用性、运行时补丁和增强错误恢复等增值功能，这些在电信领域非常重要。\n\
  \n*   即使控制器是基于内核支持的 CPU 核心构建的，主线内核可能也不包含对你选择的嵌入式控制器的完整支持。然而，Linux 发行版可能会为控制器内部的所有外围模块提供设备驱动。\n\
  \n*   你计划在内核开发期间使用的调试工具可能不是主线内核的一部分。例如，内核没有内置调试器支持。如果你想在开发期间使用内核调试器，必须单独下载并应用相应的补丁。如果你的内核版本没有现成的测试补丁，你将不得不忍受更多的麻烦。发行版预包了许多实用的调试功能，你可以立即开始使用它们。\n\
  \n*   某些发行版提供法律赔偿，使你的公司不会因内核 bug 引起的诉讼而承担责任。\n\n*   发行版倾向于对他们发布的内核进行大量的测试。\n\n*\
  \   你可以从发行版供应商处购买他们提供的内核的服务和支持包。\n\n### 查看源码\n\n在我们开始接触内核之前，让我们下载源码，学习应用补丁，并查看代码树的布局。\n\
  \n首先，访问 [www.kernel.org](http://www.kernel.org) 获取最新的稳定树。源码以 tar 文件形式存档，并采用 gzip\
  \ (.gz) 和 bzip2 (.bz2) 格式压缩。通过解压缩和提取压缩的 tar 包获取源码文件。在接下来的命令中，将 `X.Y.Z` 替换为最新的内核版本，例如\
  \ `2.6.24`：\n\n![image](img/p0007-01.jpg)\n\n现在你已经在系统的 `/usr/src/linux-X.Y.Z/` 下有了解出的源码树，让我们通过获取相应的\
  \ `-mm` (Andrew Morton) 补丁在树中启用一些实验性功能：\n\n![image](img/p0007-02.jpg)\n\n应用补丁：\n\
  \n![image](img/p0007-03.jpg)\n\n`-dc` 选项要求 `bzip2` 将指定的文件解压缩到标准输出。这被传递给 `patch`\
  \ 工具，该工具会对代码树中的每个修改文件应用更改。\n\n如果你需要应用多个补丁，请按正确的顺序进行。要生成启用了 `X.Y.Z-aa-bb` 补丁的内核，首先下载\
  \ `X.Y.Z` 内核源码，应用 `X.Y.Z-aa` 补丁，然后应用 `X.Y.Z-aa-bb` 补丁。\n\n#### 提交补丁\n\n根据你的更改生成内核补丁，使用\
  \ `diff` 命令：\n\n![image](img/p0007-04.jpg)\n\n注意，在 `diff` 输出中，原始内核位于更改版本之前。根据 2.6\
  \ 补丁提交规范，你还需要在补丁末尾添加如下行：\n\n```\nSigned-off-by: Name <Email>\n```\n\n通过此，你证明代码是你自己写的，并且你有权贡献它。你现在已经准备好将补丁发布到相关的邮件列表（例如\
  \ LKML）。\n\n查看 `Documentation/SubmittingPatches` 以获取创建提交补丁的指南，查看 `Documentation/applying-patches.txt`\
  \ 获取应用补丁的教程。\n\n现在你已补丁的 `/usr/src/linux-X.Y.Z/` 树已就绪，让我们花点观察源码布局是如何组织的。进入源码树根目录并列出内容。代码树分支出的目录如下：\n\
  \n1.  `arch`。此目录包含特定架构的文件。在 `arch/` 下，你会看到针对 `ARM`、`Motorola 68K`、`s390`、`MIPS`、`Alpha`、`SPARC`\
  \ 和 `IA64` 等处理器的独立子目录。\n\n2.  `block`。这主要包含块存储设备 I/O 调度算法的实现。\n\n3.  `crypto`。此目录实现了密码操作和加密\
  \ API，例如某些 WiFi 设备驱动程序使用它来实现加密算法。\n\n4.  `Documentation`。此目录对各种内核子系统进行了简要描述。这是你挖掘内核相关问题答案的第一个站站。\n\
  \n\n\n\n\n## 5. `drivers`。此目录下包含许多设备类和外设控制器的设备驱动程序。设备类包括字符设备、串口、集成电路（I²C）、个人电脑内存卡国际协会（PCMCIA）、外域部件部件（PCI）、通用串行总线（USB）、视频、音频、块、集成驱动电子（IDE）、小型计算机系统接口（SCSI）、CD-ROM、网络适配器、异步传输模式（ATM）、蓝牙和内存技术设备（MTD）。这些每一类都存在于\
  \ `drivers/` 下的独立子目录下。例如，你会在 `drivers/pcmcia/` 目录下找到 PCMCIA 驱动源码，在 `drivers/mtd/`\
  \ 目录下找到 MTD 驱动。`drivers/` 下的子目录构成了本书的主体。\n\n## 6. `fs`。此目录包含文件系统的实现，如 `EXT3`、`EXT4`、`reiserfs`、`FAT`、`VFAT`、`sysfs`、`procfs`、`isofs`、`JFFS2`、`XFS`、`NTFS`\
  \ 和 `NFS`。\n\n## 7. `include`。内核头文件位于此处。以 `asm` 前缀的子目录包含特定架构的头文件。因此，`include/asm-x86/`\
  \ 目录包含 x86 架构相关的头文件，而 `include/asm-arm/` 则持有 ARM 架构的头文件。\n\n## 8. `init`。此目录包含高层初始化和启动代码。\n\
  \n## 9. `ipc`。这包含进程间通信（IPC）机制的支持，如消息队列、信号量和共享内存。\n\n## 10. `kernel`。基础内核中与架构无关的部分可以在此处。\n\
  \n## 11. `lib`。库例程，如通用内核对象（kobject）处理器和循环冗余校验（CRC）计算函数位于此处。\n\n## 12. `mm`。内存管理实现位于此处。\n\
  \n## 13. `net`。网络协议位于此目录下。实现的协议包括互联网协议版本 4 (IPv4)、`IPv6`、网际协议交换（IPX）、蓝牙、`ATM`、红外、平衡链路接入程序（LAPB）和逻辑链路控制（LLC）。\n\
  \n## 14. `scripts`。内核构建期间使用的脚本位于此处。\n\n## 15. `security`。此目录包含安全框架。\n\n## 16. `sound`。Linux\
  \ 音频子系统基于此目录。\n\n## 17. `usr`。目前包含 initramfs 的实现。\n\n***\n\n##### 统一 x86 架构树\n\n\
  从 2.6.24 内发布开始，i386 和 `x86_64`（32 位 i386 的 64 位版本）特定架构树已统一到共同的 `arch/x86/` 目录。如果你使用的是\
  \ 2.6.24 之前的内核，请将书中的 `arch/x86/` 引用替换为 `arch/i386/`。同样，将任何出现 `include/asm-x86/`\
  \ 的地方更改为 `include/asm-i386/`。这些目录中的某些文件名也发生了变化。\n\n***\n\n在这些巨大的目录中寻找符号和其他代码元素是一项艰巨的任务。在导航内核源码树时，表\
  \ 1.1 中的工具是非常得力的助手。\n\n表 1.1. 辅助源码树导航的工具\n\n![image](img/009tab01.jpg)\n\n### 构建内核\n\
  \n现在你已经对源码树布局有了了解，让我们来做一个细微的代码更改、编译并运行它。进入顶层 `init/` 目录，对初始化文件 `main.c` 进行细小的代码更改。在函数\
  \ `start_kernel()` 的开头添加一个打印语句，宣布你对极熊的热爱：\n\n![image](img/p0010-03.jpg)\n\n你现在准备好启动构建过程了。进入源码树根目录并从干净的状态开始：\n\
  \n![image](img/p0011-01.jpg)\n\n配置内核。此时你正在选择组成操作系统的部分。你可以指定每个所需的组件是静态链接还是动态链接到内核中：\n\
  \n```bash\nmake menuconfig\n```\n\n`menuconfig` 是内核配置菜单的文本界面。使用 `make xconfig` 获取图形界面。你选择的配置信息将保存在源码树根目录下名为\
  \ `.config` 的文件中。如果你不想从头开始编写配置，可以使用文件 `arch/your-arch/defconfig`（如果你的架构有多个支持平台，则使用\
  \ `arch/your-arch/configs/your-machine_defconfig`）作为起点。因此，如果你正在为 32 位 x86 架构编译内核，请执行此：\n\
  \n```bash\ncp arch/x86/configs/i386_defconfig .config\n```\n\n编译内核并生成压缩启动镜像：\n\n\
  ```bash\nmake bzImage\n```\n\n内核镜像生成在 `arch/x86/boot/bzImage`。更新你的启动分区：\n\n```bash\n\
  cp arch/x86/boot/bzImage /boot/vmlinuz\n```\n\n你可能需要通知引导加载程序新启动镜像已到达。如果你使用 GRUB\
  \ 引导加载程序，它会自动处理；但如果你使用的是 LILO，请运行标记命令：\n\n```bash\n/sbin/lilo\n```\n\n添加 `linux`\
  \ *\n\n最后，重启机器并进入你的新内核：\n\n```bash\nreboot\n```\n\n启动序列中的第一个消息将开启你的保护极熊行动。\n\n###\
  \ 可加载模块\n\n由于 Linux 运行在各种架构上并支持数以计的 I/O 设备，将所有可能的设备支持永久编译到基础内核中是不行的。发行版通常封装一个最小内核镜像，并以内核模块的形式提供其余功能。在运行时，必要的模块根据需要动态加载。\n\
  \n要生成模块，进入内核源码树根目录并构建：\n\n![image](img/p0012-01.jpg)\n\n要安装生成的模块，请执行操作：\n\n```bash\n\
  make modules_install\n```\n\n这会在 `/lib/modules/X.Y.Z/kernel/` 下创建一个内核源码目录结构并填充可加载模块对象。这还会调用\
  \ `depmod` 工具，该工具会在 `/lib/modules/X.Y.Z/modules.dep` 文件中生成模块依赖。\n\n可以使用以下工具操作模块：`insmod`、`rmmod`、`lsmod`、`modprobe`、`modinfo`\
  \ 和 `depmod`。前两个是插入和删除模块的工具，而 `lsmod` 列出当前加载的模块。`modprobe` 是 `insmod` 的更智能的版本，它在检查\
  \ `/lib/modules/X.Y.Z/modules.dep` 内容后还会插入依赖模块。\n\n例如，假设你需要挂载位于 USB 驱动器上的虚拟分配表 (VFAT)\
  \ 分区。使用 `modprobe` 加载 VFAT 文件系统驱动程序：^2\n\n![image](img/012tab01.jpg)\n\n如你在 `lsmod`\
  \ 输出所示，`modprobe` 插入了三个模块而不是一个。`modprobe` 首先确定必须插入 `/lib/modules/X.Y.Z/kernel/fs/vfat/vfat.ko`。但当它查看依赖文件\
  \ `/lib/modules/X.Y.Z/modules.dep` 时，它发现了以下行，并意识到必须先加载两个依赖模块：\n\n![image](img/p0013-01.jpg)\n\
  \n随后它继续加载 `fat.ko` 和 `nls_base.ko`，然后尝试插入 `vfat.ko`，从而自动加载挂载 VFAT 分区所需的所有模块。\n\n\
  使用 `modinfo` 工具提取关于你加载模块的详细信息：\n\n![image](img/p0013-02.jpg)\n\n要将内核驱动程序编译为模块，在配置内核时将相应的菜单选项切换到\
  \ `<M>`。本书中的大多数设备驱动示例都实现为内核模块。要从源文件 `mymodule.c` 编译模块 `mymodule.ko`，创建一个单行的 Makefile\
  \ 并如下如下执行：\n\n![image](img/p0013-03.jpg)\n\n内核模块使得内核占用更小，并缩短了开发-构建-测试的周期。你只需要重新编译特定模块并重新插入即可生效更改。我们在第\
  \ 21 章介绍模块调试技术。\n\n\n\n\n如果你选择将驱动程序设计为内核模块，也会存在一些缺点。与内置驱动程序不同，模块在启动期间保留资源，而在启动期间，成功在很大程度上是有保障的。\n\
  \n### 开始之前\n\nLinux 已经跨越了许多领域，现在处于顶尖水平，因此你可以将其作为一个工具来理解操作系统的概念、处理器架构，甚至是行业领域。当你学习设备驱动程序子系统使用的某种技术时，请再深一层，探究该设计选择背后的底层原因。\n\
  \n除非另有说明，本文假设使用 32 位 `x86` 架构。然而，本书考虑了你更有可能为嵌入式设备编写设备驱动程序，而不是为传统的 PC 兼容系统。例如，关于串口驱动程序的章节检查了两个设备：PC\
  \ 衍生设备上的触控控制器和手机上的 `UART`。或者关于 `I²C` 设备驱动程序的章节查看了 PC 系统上的 `EEPROM` 和嵌入式设备上的实时时钟。本书还教了你内核为大多数驱动程序类提供的核心基础设施，这些基础设施为设备驱动程序隐藏了体系依赖。\n\
  \n设备驱动程序的调试技术将在书的末尾第 21 章中讨论，因此在你阅读本书开发驱动程序时，可能会跳转到该章节是值得的。\n\n本书基于 `2.6` 内核，它与\
  \ `2.4` 相比发生了巨大的变化，涉及了所有主要的子系统。希望你现在已经在系统上安装了基于 `2.6` 的 Linux，并开始对内核源码进行实验。每一章都特意向你指向了相关的内核源文件，主要基于以下两个原因：\n\
  \n1.  因为内核中的每个驱动程序子系统都有数万行代码，在书中只能采取一个相对简单的视角。查看源码中的真实驱动程序以及本书中的示例代码将让你获得更宏观的。\n\
  2.  在开发驱动程序之前，在 `drivers/` 目录中找到一个与你的需求相似的现有驱动程序并将其作为起点是一个好主意。\n\n因此，为了从书中获得最大的收益，请通过频繁浏览源码树并仔细研究代码来熟悉内核。并且在进行代码探索的同时，请关注内核邮件列表的动态。\n\
  \n## 第 2 章 深入内核内部\n\n### 本章内容\n\n* 启动\n* 内核态与用户态\n* 进程上下文与中断上下文\n* 内核定时器\n* 内核中的并发\n\
  * 进程文件系统\n* 分配内存\n* 查看源码\n\n* *\n\n在我们开始进入 Linux 设备驱动程序的神秘世界之旅之前，让我们通过从驱动程序开发者的视角查看几个内核区域，来熟悉一些基本的内核概念。我们学习了内核定时器、同步机制机制和内存分配。但让我们从顶端开始我们的探险吧；浏览一下内核发出的启动信息，并在任何看起来有趣的地方停下来。\n\
  \n* *\n\n### 启动\n\n图 2.1 显示了基于 `x86` 的计算机上的 Linux 启动序列。基于 `x86` 硬件的 Linux 启动在 `BIOS`\
  \ 从启动设备加载主引导记录 (`MBR`) 时开始。驻留于 `MBR` 中的代码查看分区表，并从活动分区读取如 `GRUB`、`LILO` 或 `SYSLINUX`\
  \ 等 Linux 启动加载程序。加载程序的最后阶段加载压缩的内核镜像并将控制权交给它。内核将解压自己并点火。\n\n图 2.1. 基于 `x86` 硬件的 Linux\
  \ 启动序列。\n\n![image](img/02fig01.gif)\n\n基于 `x86` 的处理器有两种工作模式：实模式模式和保护模式。在实模式下，你只能访问前\
  \ `1MB` 内存，而且没有任何保护。保护模式是复杂的，它让能够能够利用处理器的许多高级功能，例如`分页`。CPU 在进入保护模式的过程中必须经过实模式。\n\
  \n第一级内核初始化是在实模式汇编中完成的。随后的启动由 `init/main.c` 中定义的函数 `start_kernel()` 在保护模式下执行，该文件是你上一章中修改过的。`start_kernel()`\
  \ 从初始化 CPU 子系统开始。不久后建立了内存和进程管理。接下来启动外设总线和 I/O 设备。作为启动序列的最后一步，所有 Linux 进程的父进程 `init`\
  \ 程序被调用。`init` 执行用户空间脚本以启动必要的内核服务。它最后在最终在控制台上派生终端并显示登录提示符。\n\n接后的每个节标题都是图 2.2 在基于\
  \ `x86` 的笔记本电脑启动过程中生成的。。如果你在其他架构上启动内核，其语义和信息可能会发生。如果本节中的某些解释听起来相当晦涩，不要担心；这里的意图只是让你从高处俯瞰并初步尝试内核。\n\
  \n图 2.2. 内核启动信息。\n\n![image](img/02tab01.jpg)\n\n#### BIOS 提供的物理内存映射\n\n内核从 `BIOS`\
  \ 装配内存映射，这是你看到的第一个启动信息之一：\n\n![image](img/p0019-01.jpg)\n\n实模式初始化代码使用 `BIOS` `int\
  \ 0x15` 服务功能号 `0xe820`（因此前面的信息中出现了 `BIOS-e820` 字符串）来获取内存映射。内存映射指示了预留和可用内存范围，内核随后使用其创建空闲内存池。我们将在附录\
  \ B 中的“实模式调用”部分详细讨论 BIOS 映射。\n\n#### 758MB LOWMEM 可\n\n通常寻址的内核内存区域（`<896MB`）被称为低内存。内核内存分配器\
  \ `kmalloc()` 从该区域返回内存。`896MB` 以上的内存（称为高内存）只能通过特殊映射访问。\n\n在启动期间，内核计算并显示了这些内存区域中的总页。我们在本章稍后的部分深入探讨内存区域。\n\
  \n#### 内核命令行：ro root=/dev/hda1\n\nLinux 启动加载程序通常向内核传递一个命令行。命令行中的参数与传递给 C 程序 `main()`\
  \ 函数的 `argv[]` 列表相似，只是它们是传递给内核的。你可以在启动加载器配置文件添加命令行参数，也可以在运行时从启动加载程序提示符提供它们。([[1]](#footnote.html_ch02fn01))如果你使用\
  \ `GRUB` 启动加载程序，配置文件为 `/boot/grub/grub.conf` 或 `/boot/grub/menu.lst`，取决于你的发行版。如果你是\
  \ `LILO` 用户，配置文件为 `/etc/lilo.conf`。这里列出了 `grub.conf` （添加了注释）。如果你查看 `title kernel\
  \ 2.6.23` 之后的一行，你就可以看出前面启动信息的起源：\n\n![image](img/p0021-01.jpg)\n\n\n\n命令行参数会影响启动期间遍历的代码执行路径。举个简单的例子，假设我们感兴趣的命令行参数名为\
  \ `bootmode`。如果此参数设置为 `1`，你可能希望在启动期间打印一些调试信息，并在启动结束时切换到运行级别（runlevel）`3`。（等待 `init`\
  \ 进程打印出启动消息后即可了解运行级别的语义。）如果 `bootmode` 被设置为 `0`，你可能更希望启动过程尽可能简洁，并将运行级别设置为 `2`。由于你已经熟悉了\
  \ `init/main.c`，让我们对其添加以下修改：\n\n![image](img/p0022-01.jpg)\n\n像之前一样重新编译内核并尝试该更改。我们将在第\
  \ 18 章中的“内存布局（Memory Layout）ch18.html_ch18lev1sec5)”部分中讨论更多内核命令行参数。\n\n### 校准延迟...1197.46\
  \ BogoMIPS (lpj=2394935)\n\n在启动过程中，内核会计算处理器在一个 jiffy（系统计时器两次连续中断之间的时间间隔）内执行内部延迟循环的次数。正如你所期的，该计算必须根据\
  \ CPU 的处理速度进行校准。校准结果存储在一个名为 `loops_per_jiffy` 的内核变量中。内核使用 `loops_per_jiffy` 的一个场景是设备驱动程序需要微秒级的短时间延迟。\n\
  \n为了理解延迟循环校准代码，让我们查看定义在 `init/calibrate.c` 中的 `calibrate_delay()` 函数。该函数巧妙地利用整数内核推导出浮点数精度。以下代码段（添加了一些注释）显示了函数的初始部分，它为\
  \ `loops_per_jiffy` 刻画出一个粗略值：\n\n![image 前面的代码首先假设 `loops_per_jiffy` 大于 `4096`，这相当于每秒大约一百万次指令的处理器速度（MIPS）。然后它等待一个新的\
  \ jiffy 开始并执行延迟循环 `__delay(loops_per_jiffy)`。如果延迟循环持续的时间超过了 jiffy，则使用 `loops_per_jiffy`\
  \ 的上一个值（通过位右移一位获得）来固定其最高位（MSB）。否则，该函数继续检查是否可以通过位左移 `loops_per_jiffy` 来获得 MSB。在内核借此算出\
  \ `loops_per_jiffy` 的 MSB 后，它会处理低位，并按如下方式精调其精度：![image](img/p0024-01.jpg)\n\n前面的代码段计算了当延迟循环跨越\
  \ jiffy 边界时，`loops_per_jiffy` 低位的精确组合。这个校准后的值被用于推导出一个非科学的处理器速度测量，称为 BogoMIPS。你可以将\
  \ BogoMIPS 评分作为 CPU 运行速度的相对衡量标准。在一台基于 1.6GHz Pentium M 的笔记本电脑上，延迟循环校准得出的 `loops_per_jiffy`\
  \ 值为 `2394935`，如前面的启动消息所示。BogoMIPS 值的获取方式如下：\n\n```\nBogoMIPS = `loops_per_jiffy`\
  \ * 每秒 jiffy 的数量 * 内部延迟循环消耗的指令数（以百万为单位）\n\n= (2394935 * HZ * 2) / (1 million)\n\n\
  = (2394935 * 250 * 2) / (1000000)\n\n= 1197.46 (如前面的启动消息所示)\n```\n\n我们将在本章稍后的“[内核计时器（Kernel\
  \ Timers）ch02.html_ch02lev1sec4”部分进一步讨论 `jiffies`、`HZ` 和 `loops_per_jiffy`。\n\n\
  ### 检查 HLT 指令\n\n由于 Linux 内核支持多种硬件平台，启动代码会检查与架构相关的 Bug。验证停止（HLT）指令的正确性就是此类检查之一。\n\
  \nx86 处理器支持的让 CPU 进入低功耗睡眠模式，直到下一次硬件中断发生。当内核想要将 CPU 置于空闲状态时会使用 HLT 指令（见定义在 `arch/x86/kernel/process_32.c`\
  \ 中的 `cpu_idle()` 函数）。\n\n对于有问题的 CPU，可以使用 `no-hlt` 命令行参数来禁用 HLT 指令。如果开启了 `no-hlt`，内核在空闲时将进行忙等待，而不是通过将\
  \ CPU 置于 HLT 状态来保持冷却。\n\n前面的启动消息是在 `init/main.c` 中的启动代码调用定义在 `include/asm-your-arch/bugs.h`\
  \ 中的 `check_bugs()` 时生成的。\n\n### NET: 已注册协议族 2\n\nLinux socket 层是一个统一接口，用户应用程序通过它访问各种网络协议。每个协议都使用分配给它的唯一族号（定义在\
  \ `include/linux/socket.h` 中）向 socket 层注册自己。前面消息中的族 2 代表 `AF_INET`（网协议）。\n\n启动过程中经常发现的另一个协议族是\
  \ `AF_NETLINK`（族 16）。Netlink socket 提供了用户进程与内核之间通信的方法（见 `include/linux/netlink.h`）。内核中常见的启用的另一个协议族是\
  \ `AF_UNIX` 或 UNIX 域 socket。X Windows 等程序使用它们在同一系统上进行进程间通信。\n\n### 释放 Initrd 内存：387k\n\
  \nInitrd 是由引导加载程序加载的内存驻磁盘镜像。它在内核启动后被挂载为初始根文件系统，用于挂载磁盘分区所需的额外模块。由于内核运行在使用不同存储控制器的不同硬件平台上，发行版无法在基础内核中启用所有设备驱动。针对你系统存储设备的特定驱动被封装在\
  \ initrd 中，并在内核加载之后、根文件系统挂载之前加载。要创建 initrd 镜像，使用 `mkinitrd` 命令。\n\n2.6 内核包含一种名为\
  \ initramfs 的功能，它相比 initrd 具有若干优势。后者模拟了一个磁盘（因此称为 initdisk 或 initrd）并承受与 Linux 块\
  \ I/O 子系统相关的开销（如缓存），而前者本质上是将缓存本身挂载为文件系统（因此称为 initramfs）。\n\ninitramfs 像构建其基础的页缓存一样，会动态增长和缩小，不像\
  \ initrd 那样，因此减少了内存浪费。此外，与 initrd 需要包含关联的文件系统驱动不同（例如，如果 initrd 上有 EXT2 文件系统，则需要\
  \ EXT2 驱动），initramfs 不需要文件系统支持。initramfs 代码非常小，因为它只是页缓存之上的一小层。\n\n你可以将初始根文件系统打包进压缩的\
  \ cpio 归档 footnote.html_ch02fn02)，并通过 `initrd=` 参数将其传递给内核命令行，或者在内核配置期间使用 `INITRAMFS_SOURCE`\
  \ 选项将其作为内核镜像的一部分构建。对于后者，你可以提供 cpio 归档的文件名，或包含 initramfs 布局的目录树路径。在启动期间，内核会将文件提取到\
  \ initramfs 根文件系统（也称为 rootfs）中，如果找到顶层 `/init` 程序，则执行它。这种获取初始根文件系统的方法对于系统资源极其有限的嵌入式平台特别有用。要创建\
  \ initramfs 镜像，使用 `mkinitramfs`。更多文档请参阅 Documentation/filesystems/ramfs-rootfs-initramfs.txt。\n\
  \n\n\n\n在这种情况下，我们通过使用 `initrd=` 命令行参数向内核提供压缩的初始根文件系统的 `cpio` 归来使用 `initramfs`。在将包的内容解压到\
  \ rootfs 后，内核会释放归包所在的内存（在本例中为 387K）并发布上述启动消息。释放的页面随后会被分配给请求内存的内核其他部分。\n\n正如我们在第\
  \ 18 章中将讨论的，`initrd` 和 `initramfs` 有时用于在开发期间嵌入式设备上持有实际根文件系统。\n\n## IO 调度器等待型（默认）\n\
  \nI/O 调度器的主要目标是通过最小化磁盘寻道时间增加系统吞吐量，寻道是将磁盘头从当前位置移动到感兴趣磁盘扇区的延迟。2.6 内核提供了四种不同的 I/O 调度器：`Deadline`、`Anticipatory`、`Complete\
  \ Fair Queuing` 和 `Noop`。如之前的内核消息所示，内核将 `Anticipatory` 设置为默认 I/O 调度器。我们在第 14 章的“块驱动”中介绍\
  \ I/O 调度。\n\n## 设置标准 PCI 资源\n\n启动过程的下一阶段探测并初始化 I/O 总线和外控制器。内核通过遍历 `PCI` 总线探测 `PCI`\
  \ 硬件，然后初始化其他 I/O 子系统。查看图 2.3 中的启动消息，查看有关 SCSI 子系统初始化、USB 控制器、视频芯片（下方消息中 855 北桥芯片组的一部分）、串口（在本例中为\
  \ 8250 UART）、PS/2 键盘和鼠标、软驱驱动器、`ramdisk`、回环设备、`IDE` 控制器（在本例中 ICH4 南桥芯片组的一部分）、触控板、以太网控制器（在本例中为\
  \ `e1000`）以及 `PCMCIA` 控制器的公告。相应的 I/O 设备标识标记在 `→` 之后。\n\n图 2.3 启动期间初始化总线和外控制器。\n\n\
  ![image](img/028tab01.jpg)\n\n本书在单独的章节中讨论了许多驱动子系统。注意，如果驱动程序作为可加载模块动态链接到内核，其中某些消息可能在启动过程的后期出现。\n\
  \n## EXT3-fs: 已挂载的文件系统\n\n`EXT3` 文件系统已成为 Linux 上的事实文件系统。它在老牌 `EXT2` 文件系统之上添加了日志层，以便在崩溃后进行快速恢复。其目标是恢复一致的文件系统状态，而无需经过耗时的文件系统检查\
  \ (`fsck`) 操作。`EXT2` 仍然是工作引擎，而 `EXT3` 层在将实际更改提交磁盘之前，会在名为 `journal` 的内存区域额外记录文件事务。`EXT3`\
  \ 与 `EXT2` 兼容，因此你可以为现有 `EXT2` 文件系统添加 `EXT3` 封装，或者剥离 `EXT3` 回到原始的 `EXT2` 文件系统。\n\n\
  ***\n\n### EXT4\n\n`EXT` 文件系统系列的最新版本是 `EXT4`，它从 2.6.19 版本开始包含在主内核中，标记为“实验性”，名称为\
  \ `ext4dev`。`EXT4` 在很大程度上与 `EXT3` 兼容。`EXT4` 项目的主页位于 [www.bullopensource.org/ext4](http://www.bullopensource.org/ext4)。\n\
  \n***\n\n`EXT3` 会启动一个内核辅助线程（我们将在下一章深入讨论内核线程）称为 `kjournald` 以辅助日志记录。当 `EXT3` 运行时，内核挂载根文件系统并准备好工作：\n\
  \n![image](img/p0028-01.jpg)\n\n## INIT: 版本 2.85 启动\n\n`Init` 是所有 Linux 进程的父进程，是内核完成启动序列后运行的程序。在\
  \ `init/main.c` 的最后几行中，内核在不同的位置查找 `init`：\n\n![image](img/p0029-01.jpg)\n\n`Init`\
  \ 接收来自 `/etc/inittab` 的指令。它首先执行存在 `/etc/rc.sysinit` 中的系统初始化脚本。该脚本的重要职责之一是激活交换分区，这将触发如下启动消息：\n\
  \n在 /dev/hda6 上添加 1552384k 交换\n\n让我们仔细看看这意味着什么。Linux 用户进程拥有 3GB 的虚拟地址空间（见节“分配内存””）。其中，构成了“工作集”的页面保留在\
  \ RAM 中。然而，当有太多程序请求内存资源时，内核通过将一些已使用的 RAM 页面存储在名为 `swap space` 的磁盘分区中来释放这些页面。根据经验法则，交换分区的大小应该是\
  \ RAM 数量的两倍。在这种情况下，交换空间位于磁盘分区 `/dev/hda6` 中，大小为 `1552384K` 字节。\n\n`Init` 接着运行位于\
  \ `/etc/rc.d/rcX.d/` 目录下的脚本，其中 `X` 是 `inittab` 中指定的运行级别（runlevel）。运行级别是对应所需启动模式的执行状态。例如，多用户文本模式对应运行级别\
  \ 3，而 `X Windows` 关联运行级别 5。因此，如果你看到消息 `INIT: Entering runlevel 3`，init 已开始执行 `/etc/rc.d/rc3.d/`\
  \ 中的脚本。这些脚本启动了设备命名子系统 `udev`（我们在第 4 章的“打基础”中讨论过）并加载了负责网络、音频、存储等的内核模块：\n\n![image](img/p0030-01.jpg)\n\
  \n`Init` 最后在虚拟控制台上创建终端。你现在可以登录了。\n\n## 内核模式和用户模式\n\n某些操作系统总是单 CPU 模式执行，但类 UNIX 操作系统使用双模式来有效实现共享。在\
  \ Linux 机器上，CPU 要么处于信任内核模式，要么处于限制的用户模式。所有用户进程都在用户模式下执行，而内核本身在内核模式下执行。\n\n内核模式代码不受限制访问整个指令集以及内存和\
  \ I/O 空间。如果用户模式进程需要这些权限，它必须通过系统调用通过驱动程序或其他内核代码通道请求。然而，用户模式代码允许缺页，而内核模式代码不允许。\n\n\
  在 2.4 及更早内核中，只有用户模式进程可以切换上下文并被替换。内核模式代码可以一直独占处理器，直到：\n\n- 它自愿放弃 CPU。\n\n或\n\n- 发生中断或异常。\n\
  \n随着 2.6 版本引入内核抢占，大多数内核模式代码也可以切换上下文。\n\n## 进程上下文和中断上下文\n\n内核结合进程上下文和中断上下文来完成有用工作。为应用程序发出的系统服务的内核代码代表相应的应用程序进程运行，被称为在进程文中执行。另一方面，中断处理程序在中断文中异步运行。进程上下文与任何上下文都没有绑定，反之亦然。\n\
  \n运行在进程上下文中的内核代码是可以抢占的。然而，中断上下文始终运行完成且不可抢占。由于由于，从中断文中执行的操作有限制。从中断文中执行的代码不能执行以下操作：\n\
  \n- 睡眠或放弃处理器\n\n- 获取互斥锁（mutex）\n\n- 执行耗时任务\n\n- 访问用户空间虚拟内存\n\n查看第 4 章中的“中断处理”节，以对中断上下文进行完整讨论。\n\
  \n### 内核定时器\n\n\n\n\n内核许多部分的工作关键地依赖于时间的流逝。Linux 内核利用硬件支持的不同定时器来提供与时间相关的服务，例如忙等（busy-waiting）和睡眠等待（sleep-waiting）。处理器在忙等时会浪费周期，但在睡眠等待时则会释放\
  \ CPU。自然地，前者仅在后者不可行时才使用。内核还促进了对希望在指定时间间隔过去后运行的函数进行调度。\n\n首先，我们来讨论一些重要的内核定时器变量的语义，例如\
  \ `jiffies`、`HZ` 和 `xtime`。接下来，让我们使用 Pentium 时间戳计数器 (TSC) 在基于 Pentium 的系统上测量执行时间。我们还来看看\
  \ Linux 如何使用实时时钟 (RTC)。\n\n### HZ 和 Jiffies\n\n系统定时器以可编程的频率中断处理器。该频率或每秒滴答次数包含在内核变量\
  \ `HZ` 中。选择 `HZ` 的值是一个权衡。较大的 `HZ` 会导致更细的定时器粒度，从而提供更好的调度分辨率。然而，更大的 `HZ` 值也会导致更大的开销和更高的功耗，因为在定时器中断上下文中消耗了更多的周期。\n\
  \n`HZ` 的值取决于架构。在 x86 系统上，2.4 内核中 `HZ` 默认设置为 100。在 2.6 版本中，该值变为 1000，但在 2.6.13 中，它被降低到了\
  \ 250。在 ARM 平台上，2.6 内核将 `HZ` 设置为 100。在当前的内核中，你可以在编译时通过配置菜单选择 `HZ` 的值。该选项的默认设置取决于你的发行版。\n\
  \n2.6.21 内核引入了无滴答内核（`CONFIG_NO_HZ`）的支持，它可以根据系统负载动态触发定时器中断。无滴答系统的实现不在本章的范围内。\n\n\
  `jiffies` 存储了自系统启动以来系统定时器触发的次数。内核每秒增加 `HZ` 次 `jiffies` 变量。因此，在 `HZ` 值为 100 的内核上，一个\
  \ jiffy 是 10 毫秒的持续时间；而在 `HZ` 设置为 1000 的内核上，一个 jiffy 仅持续 1 毫秒。\n\n为了更好地理解 `HZ` 和\
  \ `jiffies`，请考虑来自 IDE 驱动（`drivers/ide/ide.c`）的以下代码片段，它轮询磁盘驱动器的忙状态：\n\n![image](img/p0032-01.jpg)\n\
  \n如果忙状态在 3 秒内清除，上述代码返回 `SUCCESS`，否则返回 `-EBUSY`。`3*HZ` 是 3 秒内 `jiffies` 的数量。因此，计算出的超时时间（`jiffies\
  \ + 3*HZ`）就是 3 秒超时过去后 `jiffies` 的新值。`time_after()` 宏比较 `jiffies` 的当前值与请求的超时时间，并考虑了由于溢出导致的回绕。可用于类似比较的可用函数还有\
  \ `time_before()`、`time_before_eq()` 和 `time_after_eq()`。\n\n`jiffies` 被定义为 `volatile`，这要求编译器不要优化对变量的访问。这确保了在每次滴答期间由定时器中断处理程序更新的\
  \ `jiffies` 在每次循环循环中都会被重新读取。\n\n对于从 `jiffies` 到秒的反向转换，请查看来自 USB 主机驱动程序 `drivers/usb/host/ehci-sched.c`\
  \ 的此代码片段：\n\n![image](img/p0033-01.jpg)\n\n上述调试语句计算了该 USB 端点流（我们在第 11 章中讨论 USB，“通用串总总](#ch11.html_ch11)”）被重新调度\
  \ `stream->rescheduled` 次所需的秒数。（`jiffies-stream->start`）是自重新调度开始以来经过的 `jiffies`\
  \ 数量。除以 `HZ` 将该值转换为秒。\n\n假设 `HZ` 值为 1000，32 位的 `jiffies` 变量在大约 50 天后溢出。由于系统运行时间可能是该时间的许多倍，内核提供了一个名为\
  \ `jiffies_64` 的变量来存储 64 位（`u64`）`jiffies`。链接器对 `jiffies_64` 的位置，使其低 32 位与 `jiffies`\
  \ 对齐。在 32 位机器上，编译器需要两条指令将一个 `u64` 变量赋值给另一个，因此读取 `jiffies_64` 不是原子的。为了解决这个问题，内核提供了一个函数\
  \ `get_jiffies_64()`。查看在 `drivers/cpufreq/cpufreq_stats.c` 中定义的 `cpufreq_stats_update()`\
  \ 以获取用法示例。\n\n### 长延迟\n\n在内核术语中，`jiffies` 级别的延迟被认为是很长时间。实现长延迟的一种可能但非优的方法是忙循环（busy-looping）。忙等函数采取的是“守株不达”的态度。它既不利用处理器做有用的工作，也不让别人使用它。以下代码占据处理器\
  \ 1 秒钟：\n\n![image](img/p0033-02.jpg)\n\n更好的方法是睡眠等待，而不是忙等。这种方法让其他可以使用处理器。以下代码使用了\
  \ `schedule_timeout()`：\n\n```\nschedule_timeout(1000);\n```\n\n内核还提供了定时器 API 在未来的某个时间点执行函数。你可以使用\
  \ `init_timer()` 动态定义定时器，或使用 `DEFINE_TIMER()` 静态创建一个。完成后，用处理函数的地址和参数填充 `timer_list`，并使用\
  \ `add_timer()` 注册它：\n\n![image](img/p034-01.jpg)\n\n注意，这是一个单次定时器。如果你想定期运行 `timer_func()`，你还需要\
  \ `timer_func()` 内部添加上述代码以便在下次超时后调度自己：\n\n![image](img/p0035-02.jpg)\n\n你可以使用 `mod_timer()`\
  \ 修改 `my_timer` 的过期时间，使用 `del_timer()` 取消 `my_timer`，并使用 `timer_pending()` 查看 `my_timer`\
  \ 是否挂起。如果你查看 `kernel/timer.c`，你会发现 `schedule_timeout()` 内部同样使用了这些 API。\n\n另外两个有助于睡眠等待的函数是\
  \ `wait_event_timeout()` 和 `msleep()`。它们都是帮助实现的。`wait_event_timeout()` 用于你的代码在指定条件变为真或发生超时时恢复。`msleep()`\
  \ 睡眠指定的毫秒数。\n\n此类延迟技术仅适用于进程上下文。在中断上下文中无法睡眠等待，因为中断处理程序不允许调用 `schedule()`。（请参见第 4\
  \ 章中的“中断处理”获取中断上下文中执行的代码准则。）在中断上下文中进行短时间的忙等是可能的，但在该文中进行长时间忙等被认为是大忌。在禁用中断的情况下进行长时间忙等同样禁忌。\n\
  \n### 短延迟\n\n在内核术语中，小于 `jiffies` 的延迟被归为短时间。此类延迟通常从进程和中断上下文中请求。由于无法使用基于 `jiffies`\
  \ 方法来实现小于 `jiffies` 的延迟，因此上一节讨论的睡眠等待方法无法用于小型超时。唯一的解决方案是忙等。\n\n\n\n\n实现短延迟的内核 API\
  \ 有 `mdelay()`、`udelay()` 和 `ndelay()`，它们分别支持毫秒、微秒和纳秒级延迟。这些函数的具体实现取决于特定的架构，并且可能在所有平台上都不可用。\n\
  \n短时间的忙等待（Busy-waiting）是通过测量处理器执行一条指令所需的时间，并按照必要的迭代次数进行循环来实现的。正如本章早些讨论的，内核在启动期间会执行此测量，并将结果存储在一个名为\
  \ `loops_per_jiffy` 的变量中。短延迟 API 使用 `loops_per_jiffy` 来决定它们需要忙循环的次数。为了在握手过程中实现 1\
  \ 微秒的延迟，USB 主机控制器驱动 `drivers/usb/host/ehci-hcd.c` 调用了 `udelay()`，该函数在内部使用了 `loops_per_jiffy`：\n\
  \n![image](img/p0036-01.jpg)\n\n## 奔腾处理器时间戳计数器\n\n时间戳计数器（TSC）是奔腾兼容处理器中存在的一个 64 位寄存器，用于计算处理器自启动以来消耗的时钟周期数。由于\
  \ TSC 以处理器周期频率的速度递增，因此它提供了一个高分辨率定时器。TSC 常用于代码分析和插桩（Instrumentation）。它通过 `rdtsc`\
  \ 指令进行访问，以微秒级精度测量中间代码的执行时间。TSC 滴答可以通过除以 CPU 时钟频率转换为秒，该频率可以从内核变量 `cpu_khz` 读取。\n\n\
  在下面的代码段中，`low_tsc_ticks` 包含 TSC 的低 32 位，而 `high_tsc_ticks` 包含高 32 位。低 32 位会根据处理器速度在几秒内溢出，但如所示，对于许多代码插桩目的已经足够：\n\
  \n![image](img/p0037-01.jpg)\n\n在 1.8GHz 的奔腾机器上，测得的 `exec_time` 为 871（或半微秒）。\n\n\
  对高分辨率定时器的支持（`CONFIG_HIGH_RES_TIMERS`）已合并到 2.6.21 内核中。它利用特定硬件的高速定时器为 `nanosleep()`\
  \ 等 API 提供高精度能力。在奔腾级机器上，内核利用 TSC 来提供这种能力。\n\n## 实时时钟\n\nRTC 在非易失性内存中跟踪绝对时间。在 x86\
  \ PC 上，RTC 寄存器构成了小型电池供电互补金属氧化半导体（CMOS）内存顶部的几个位置。查看第 5 章“字符驱动程序”中的图 5.1 了解位置。在嵌入式系统中，RTC\
  \ 可能是处理器内部，或者通过第 8 章“集成电路协议”讨论的 I²C 或 SPI 总线外部连接。\n\n你可以使用 RTC 执行以下操作：\n\n* 读取并设置绝对时间，并在时钟更新期间产生中断。\n\
  * 生成频率从 2HZ 到 8192HZ 的周期性中断。\n* 设置闹钟\n\n许多应用需要绝对时间或墙时间（Wall time）的概念。因为 `jiffies`\
  \ 相对于系统启动的时间，所以它不包含墙时间。内核在一个名为 `xtime` 的变量中维护墙时间。在启动期间，通过读取 RTC 将 `xtime` 初始化为当前墙时间。当系统停止时，墙时间会被写回\
  \ RTC。你可以使用 `do_gettimeofday()` 以硬件支持的最高分辨率读取墙时间：\n\n![image](img/p0038-01.jpg)\n\
  \n还有许多函数可供用户空间代码访问墙时间。它们包括：\n\n* `time()`：返回日历时间，或自 纪元（1970 年 1 月 1 日 00:00:00）以来的秒数\n\
  * `localtime()`：返回分解格式的日历时间\n* `mktime()`：是 `localtime()` 的反向操作\n* `gettimeofday()`：如果你的平台支持，它返回返回微秒级精度的日历时间\n\
  \n从用户空间使用 RTC 的另一种方法是通过字符设备 `/dev/rtc`。同一时间只允许一个进程访问该设备。\n\n我们将在第 5 章和第 8 章中更多地讨论\
  \ RTC 驱动。在第 19 章中，我们将开发一个示例用户程序，使用 `/dev/rtc` 以微秒级精度执行周期性工作。\n\n## 内核中的并发\n\n随着多核笔记本电脑的出现，对称多处理（SMP）不再局限于高科技用户领域。SMP\
  \ 和内核抢占是产生多个执行线程的场景。这些线程可以同时操作共享的内核数据结构。由于由于，对此类数据结构的访问必须是序列化的。\n\n让我们讨论保护共享内核资源免受并发访问的基础知识。我们从一个简单的示例开始，逐渐引入中断、内核抢占和\
  \ SMP 等复杂性。\n\n### 旋锁和互斥锁\n\n访问共享资源的区域称为临界区。旋锁（Spinlocks）和互斥锁（Mutexes，mutual exclusion\
  \ 的缩写）是保护临界区的两种基本机制。让我们依次查看。\n\n旋锁确保一次只有一个线程进入临界区。任何想要进入临界区的线程必须在门口自旋，直到第一个线程退出。注意我们使用“线程”一词是指执行线程，而不是内核线程。\n\
  \n旋锁的基本用法如下：\n\n![image](img/p0039-01.jpg)\n\n与旋锁在尝试进入忙临界区时让线程进入自旋相反，互斥锁会将竞争线程睡眠，直到轮到它们。因为消耗处理器周期是非常糟糕的，当估计等待时间较时，互斥锁比旋锁更适合保护临界区。在互斥锁术语中，超过两次上下文切换就被认为是长时间的。\n\
  \n因此，在许多情况下，决定使用旋锁还是互斥锁是很的：\n\n* 如果临界区需要睡眠，你只能选择使用互斥锁。在获取旋锁后调度、抢占或在队列上睡眠是非的。\n*\
  \ 因为互斥锁在面对竞争时会让调用线程睡眠，在中断处理程序内部你只能选择使用旋锁（有关中断上下文的更多信息请参见第 4 章）。\n\n互斥锁的基本用法如下：\n\
  \n![image](img/p0040-01.jpg)\n\n### 旧信号量接口\n\n取代旧信号量接口的互斥锁接口源于 `–rt` 树，并在 2.6.16\
  \ 内核发布时合并到主线。然而，信号量接口仍然存在。信号量接口的基本用法如下：\n\n![image](img/p0041-01.jpg)\n\n\n\n\n\n\
  信号量可以配置为允许一定数量的线程同时进入临界区。然而，允许同时有多个持有者的信号量很少被使用。\n\n### 案例 1：进程上下文、UP 机器、无抢占\n\n\
  这是最简单的情况，不需要锁，因此我们不再对此进行讨论。\n\n### 案例 2：进程上下文和中断上下文、UP 机器、无抢占\n\n在这种情况下，你只需要禁用中断来保护临界区域。为了理解原因，假设\
  \ `A` 和 `B` 是进程上下文线程，而 `C` 是中断上下文线程，它们都在争夺进入同一个临界区，如图图 2.4\n\n由于 `Thread C` 在中断上下文中执行，并且在让出\
  \ `Thread A` 或 `Thread B` 之前总是会运行完成，因此它不需要担心保护问题。另一方面，`Thread A` 不需要担心 `Thread B`（反之亦然），因为内核是不可抢占的。因此，`Thread\
  \ A` 和 `Thread B` 只需要防止在它们处于同一区域时，`Thread C` 穿过临界区即可。它们通过在进入临界区之前禁用中断来实现这一点：\n\n\
  ![image](img/p0042-01.jpg)\n\n然而，如果执行流到达点 A 时中断已经被禁用了，`local_irq_enable()` 会产生重新启用中断的这种不良副作用，而不是恢复中断状态。这可以通过以下方式修复：\n\
  \n![image](img/p0042-02.jpg)\n\n无论点 A 处的中断状态如何，这种方法都能正常工作。\n\n### 案例 3：进程上下文和中断上下文、UP\
  \ 机器、抢占\n\n如果启用了抢占，仅禁用中断无法保护你的临界区域不被践踏。存在多个线程在进程上下文中同时进入临界区的可能性。回到这种场景下的图 2.4，`Thread\
  \ A` 和 `Thread B` 现在除了需要防止 `Thread C` 之外，还需要相互保护。显然，解决方案是在进入临界区之前禁用内核抢占，并在结束时重新启用，此外禁用/重新启用中断。为此，`Thread\
  \ A` 和 `Thread B` 使用自旋锁的 `irq` 变体：\n\n![image](img/p0043-01.jpg)\n\n抢占状态不需要显式恢复到点\
  \ A 处的状态，因为内核内部通过一个名为抢占计数器的变量为你执行了操作。每当禁用抢占（使用 `preempt_disable()`）时，计数器加 1；每当启用抢占（使用\
  \ `preempt_enable()`）时，计数器减 1。只有当计数器值为 0 时，才会触发抢占。\n\n### 案例 4：进程上下文和中断上下文、SMP 机器、抢占\n\
  \n现在让我们假设临界区在 SMP 机器上执行。你的内核已配置了 `CONFIG_SMP` 和 `CONFIG_PREEMPT`。\n\n在目前讨论的场景中，自旋锁原语仅仅是启用/禁用抢占和中断。实际的锁定功能被编译掉了。在存在\
  \ SMP 的情况下，锁定逻辑被编译进来，自旋锁原语变得对 SMP 安全。启用 SMP 的语义如下：\n\n![image](img/p0044-01.jpg)\n\
  \n在 SMP 系统上，获取自旋锁时仅禁用本地 CPU 的中断。因此，进程上下文线程（例如图 2.4 中的 `Thread A`）可能运行在一个 CPU 上，而另一个中断处理程序（例如图\
  \ 2.4 中的 `Thread C`）在另一个 CPU 上执行。因此，非本地处理器上的中断处理程序需要旋转等待，直到本地处理器上的进程上下文代码退出临界区。中断上下文代码调用\
  \ `spin_lock()`/`spin_unlock()`来实现：\n\n![image](img/p0044-02.jpg)\n\n与 `irq` 变体类似，自旋锁也有下半部分（BH）版本。`spin_lock_bh()`\
  \ 在获取锁时禁用下半部分，而 `spin_unlock_bh()` 在释放锁时重新启用下半部分。我们在第 4 章中讨论下半部分。\n\n### `-rt` 树\n\
  \n实时 `(-rt)` 树，也称为 `CONFIG_PREEMPT_RT` 补丁集，实现了对内核的低延迟修改。该补丁集可以从 [www.kernel.org/pub/linux/kernel/projects/rt](http://www.kernel.org/pub/linux/kernel/projects/rt)\
  \ 下载，允许大部分内核被抢占，部分通过将许多自旋锁替换为互斥锁。它还包含了高分辨率定时器。若干 `-rt` 特性已集成到主内核。你可以在项目的 wiki 上找到详细文档，地址为\
  \ [`rt.wiki.kernel.org/`](http://rt.wiki.kernel.org/)。\n\n内核在其库中具有特殊的锁定原语，有助于在特定条件下提高性能。使用针对你的需求定制的互斥方案可以让你的代码更强大。让我们来看一些特殊的互斥机制。\n\
  \n#### 原子操作\n\n原子操作用于执行轻量级操作，如计数器增加、条件增加和位设置。原子操作保证是序列化的，不需要锁。原子操作的实现取决于架构。\n\n\
  为了在释放内核缓冲区（称为 `skbuff`）之前检查是否有数据引用，`net/core/skbuff.c` 中定义的 `skb_release_data()`\
  \ 程序执行如下：\n\n![image](img/p0045-01.jpg)\n\n因此，当 `skb_release_data()` 执行时，同一文件的另一个线程\
  \ `skbuff_clone()` 可能会同时增加引用计数器：\n\n![image](img/p0045-02.jpg)\n\n原子操作保护引用计数器不被这两个线程践踏。它还消除了为了保护单个变量使用锁的麻烦。内核还支持\
  \ `set_bit()`、`clear_bit()` 和 `test_and_set_bit()` 等位操作。查看 `include/asmarch/atomic.h`\
  \ 获取你架构支持的原子操作。\n\n#### 读写锁\n\n另一种并发调节机制是自旋锁的读写变体。如果临界区的使用方式是分开线程对共享数据结构进行读取或写入，但不同时进行，那么这些锁非常适合。多个读取线程允许同时进入临界区域。读取自旋锁定义如下：\n\
  \n![image](img/p0046-01.jpg)\n\n然而，如果写入线程进入临界区，则不允许其他读取或写入线程进入。要使用写入自旋锁，你可以这样写：\n\
  \n![image](img/p0046-02.jpg)\n\n查看 `net/ipx/ipx_route.c` 中存在的 IPX 路由代码，这是一个读写自旋锁的真实示例。名为\
  \ `ipx_routes_lock` 的读写锁保护 IPX 路由表免并发访问。需要查找路由表以转发数据包的线程请求读取锁。需要在路由表中添加或删除条目的线程获取写入锁。这提高了性能，因为路由表查找的实例远多于路由表更新。\n\
  \n与普通自旋锁一样，读写锁也有对应的 irq 变体——`read_lock_irqsave()`、`read_lock_irqrestore()`、`write_lock_irqsave()`\
  \ 和 `write_lock_irqrestore()`。这些函数的语义与普通自旋锁相似。\n\n\n\n\n序列锁（Sequence locks，或 `seqlocks`）在\
  \ 2.6 内核中引入，它们是一种读写锁，其中写入者优于读者。如果对一个变量的写操作远多于读访问，这种锁非常有用。本章之前讨论的 `jiffies_64` 变量就是一个例子。写入线程不会等待可能正处于临界区内的读者。正如此，读取线程可能会发现其进入临界区的操作失败了，并可能需要重试：\n\
  \n![image](img/p0047-01.jpg)\n\n写入者使用 `write_seqlock()` 和 `write_sequnlock()` 来保护临界区域。\n\
  \n2.6 内核引入了另一种名为“读复制更新”（Read-Copy Update, RCU）的机制，当读取者远多于写入者时，它能提高性能。其基本思想是读取线程可以在不锁的情况下执行。写入线程则更为复杂：它们在数据结构的副本上执行更新操作，并替换读取器看到的指针。原始副本将一直保持到所有\
  \ CPU 上下一次上下文切换，以确保所有正在进行的读取操作完成。请注意，使用 RCU 比使用目前为止讨论的原语要复杂得多，只有在你确定它是处理工作的正确工具时才使用。RCU\
  \ 数据结构和接口函数定义在 `include/linux/rcupdate.h` 中。在 `Documentation/RCU/*` 中有大量的文档。\n\n\
  关于 RCU 使用示例，请查看 `fs/dcache.c`。在 Linux 上，每个文件都关联目录条目信息（存储在 `dentry` 结构中）、元数据信息（存储在\
  \ `inode` 中）和实际数据（存储在数据块中）。每当你对文件进行操作时，文件路径中的组件会被解析，并获取相应的 dentry。这些 dentry 被缓存在一个名为\
  \ `dcache` 的数据结构中，以加速未来的操作。在任何时候，`dcache` 的查找次数都远于 `dcache` 的更新，因此对 `dcache` 的引用使用\
  \ RCU 原语进行保护。\n\n### 调试\n\n并发问题通常很难调试，因为它们通常难以重现。在编译和测试代码时，开启 SMP（`CONFIG_SMP`）和抢占（`CONFIG_PREEMPT`）是一个好主意，即使你的生产内核将运行在禁用抢占的\
  \ UP 机器上。内核配置选项中有一个名为“自旋锁和读写锁调试”（`CONFIG_DEBUG_SPINLOCK`）的选项，它可以帮助你发现一些常见的自旋锁错误。此外还有如\
  \ `lockmeter`（[http://oss.sgi.com/projects/lockmeter/]）等工具可以收集与锁相关的统计信息。\n\n一种常见的并发问题发生在你忘记锁定对共享资源的访问时。这导致不同线程以一种无规则的方式通过该访问进行“竞态”（racing）。这种问题被称为“竞态条件”（race\
  \ condition），可能表现为偶尔出现的奇怪代码行为。\n\n另一个潜在问题发生在你在某些代码路径中漏掉释放已持锁的情况下，导致死锁。为了理解这一点，请考虑以下示例：\n\
  \n![image](img/p0048-01.jpg)\n\n在错误条件发生后，任何尝试获取 `mylock` 的线程都会死锁，内核可能会冻结。\n\n如果问题在写编写代码几个月或几年后才出现，那么回回去调试它将更加困难。（在\
  \ 第 21 章 中的“Kdump”节和“调试设备驱动程序”中有一个相关的调试示例。）为了避免这种不愉快的遭遇，在设计软件时就应该设计并发逻辑。\n\n###\
  \ 进程文件系统\n\n进程文件系统（procfs）是一个虚拟文件系统，为查看内核内部提供了窗口。当你浏览 procfs 时看到的数据是内核动态生成的。procfs\
  \ 中的文件用于配置内核参数、查看内核结构、从设备驱动程序中搜集统计信息以及获取通用系统信息。\n\nProcfs 是一个伪文件系统。这意味着存在于 procfs\
  \ 中的文件与硬盘等物理存储设备关联。相反，这些文件中的数据是由内核中相应的入口点按需动态创建的。由于由于原因，procfs 中的文件大小显示为 0。procfs\
  \ 通常在内核启动期间挂载在 `/proc` 目录下；你可以通过调用 `mount` 命令看到这一点。\n\n为了初步了解 procfs 的功能，请检查 `/proc/cpuinfo`、`/proc/meminfo`、`/proc/interrupts`、`/proc/tty/driver/serial`、`/proc/bus/usb/devices`\
  \ 和 `/proc/stat` 的内容。某些内核参数可以通过向 `/proc/sys/` 下的文件写入在运行时更改。例如，你可以通过向 `/proc/sys/kernel/printk`\
  \ echo 一组新值来更改内核 `printk` 日志级别。许多实用程序（如 `ps`）和系统性能监控工具（如 `sysstat`）内部从存在于 `/proc`\
  \ 下的文件派生信息。\n\n在 2.6 内核中引入的 Seq files 简化了大型 procfs 操作。它们在 附录 C “Seq Files”中有描述。\n\
  \n### 分配内存\n\n某些设备驱动必须意识到内存区域的存在。此外，许多驱动需要内存分配函数的服务。在本节中，让我们简要讨论这两者。\n\n内核将物理内存组织成页。页的大小取决于架构。在基于\
  \ x86 的机器上，它是 4096 字节。物理内存中的每个页都有一个关联的 `struct page`（定义在 `include/linux/mm_types.h`\
  \ 中）：\n\n![image](img/p0049-01.jpg)\n\n在 32 位 x86 系统上，默认内核配置将 4GB 地址空间划分为用户进程的 3GB\
  \ 空间和内核的 1GB 空间，如图 2.5（ch02.html_ch03）所示。这对内核可以处理的内存量造成了 1GB 的限制。实际上，限制是 896MB，因为地址空间的\
  \ 128MB 被内核数据占据。可以通过在内核配置期间更改 3GB/1GB 划分来增加此限制，但给内存密集型应用程序带来不便。\n\n图 2.5。地址空间划分。\n\
  \n![image](img/02fig05)\n\n映射低 896MB 的内核地址与物理地址相差一个偏移，被称为逻辑地址。通过“高内存”支持，内核可以通过为这些区域生成特殊映射来访问\
  \ 896MB 以上的内存。所有的逻辑地址都是内核虚拟地址，但反之不然。\n\n这产生了以下内核区域：\n\n1.  `ZONE_DMA` (<16MB)，用于直接内存访问（DMA）的区域。由于遗留\
  \ ISA 设备具有 24 条地址线且只能访问前 16MB，内核尝试将该区域留给此类设备。\n2.  `ZONE_NORMAL` (16MB 到 896MB)，通常可访问的区域，称为低内存。低内存页的\
  \ `struct page` 中的“virtual”字段包含相应的逻辑地址。\n3.  `ZONE_HIGH` (>896MB)，内核只有在将驻页映射到 `ZONE_NORMAL`\
  \ 区域（使用 `kmap()` 和 `kunmap()`）后才能访问的空间。相应的内核地址是虚拟的而非逻辑的。高内存页 `struct page` 中的“virtual”字段在未映射时指向\
  \ `NULL`。\n\n`kmalloc()` 是一个从 `ZONE_NORMAL` 返回连续内存的内存分配函数。其原型如下：\n\n```\nvoid *kmalloc(int\
  \ count, int flags);\n```\n\n其中 `count` 是要分配的字节数，`flags` 是模式指定符。所有支持的标志都列在 `include/linux/gfp.h`\
  \ 中（gfp 代表 get free pages），但这些是常用的：\n\n\n\n\n\n1. `GFP_KERNEL:`: 用于进程上下文代码来分配内存。如果指定此标志位，`kmalloc()`\
  \ 允许进入睡眠并等待页面释放。\n\n2. `GFP_ATOMIC:`: 用于中断上下文代码来获取内存。在这种模式下，`kmalloc()` 不允许睡眠等待空闲页面，因此使用\
  \ `GFP_ATOMIC` 分配成功的概率低于 `GFP_KERNEL`。\n\n由于 `kmalloc()` 返回的内存保留了其前一个化身的内容，如果将其暴露给用户空间，可能会存在安全风险。要获取清零的\
  \ `kmalloc` 内存，请使用 `kzalloc()`。\n\n如果你需要分配大型内存缓冲区，且不需要内在物理上连续，请使用 `vmalloc()` 而不是\
  \ `kmalloc()`：\n\n```c\nvoid *vmalloc(unsigned long count);\n```\n\n这里 `count` 是请求的分配大小。该函数返回内核虚拟地址。\n\
  \n`vmalloc()` 拥有比 `kmalloc()` 更大的分配大小限制，但速度较慢，且不能在中断上下调用。此外，你不能使用 `vmalloc()` 返回的物理非连续内存来执行直接内存访问（DMA）。高性能网络驱动程序通常在设备打开时使用\
  \ `vmalloc()` 分配大型描述符环。\n\n内核提供了更复杂的内存分配技术。这些包括旁路缓冲区（look aside buffers）、slab 和内存池（mempools），这些超出了本章的范围。\n\
  \n### 查看源码\n\n内核启动于位于 `arch/x86/boot/` 目录下的实模式汇编代码。查看 `arch/x86/kernel/setup_32.c`\
  \ 可以了解保护模式内核如何获取由实模式内核收集的信息。\n\n第一条启动消息由位于 `init/main.c` 的代码打印。深入研究 `init/calibrate.c`\
  \ 以了解更多关于 BogoMIPS 标定的知识，并查看 `include/asm-your-arch/bugs.h` 以了解架构相关的检查。\n\n内核中的定时器服务由依赖架构的部分组成，这些存在于\
  \ `arch/your-arch/kernel/` 中，以及在 `kernel/timer.c` 中实现的通用部分。有关的定义，请查看头文件 `include/linux/time*.h`。\n\
  \n`jiffies` 定义在 `linux/jiffies.h` 中。`HZ` 的值取决于处理器，可以在 `include/asm-your-arch/param.h`\
  \ 中找到。\n\n内存管理源码位于顶层 `mm/` 目录中。\n\n表 2.1 汇总了本章使用的主要数据结构以及它们在源码树中的定义位置。表 2.2 列出了你在本章中使用的主要内核编程接口以及它们的定义位置。\n\
  \n表 2.1. 数据结构摘要\n\n![image](img/052tab01.jpg)\n\n表 2.2. 内核编程接口摘要\n\n![image](img/053tab01.jpg)\n\
  \n![image](img/053tab01a.jpg)\n\n![image](img/054tab01.jpg)\n\n![image](img/054tab01a.jpg)\n\
  \n### 第 3 章 内核设施\n\n### 本章内容\n\n* 内核线程\n* 辅助接口\n* 查看源码\n\n在本章中，让我们来看看一些对驱动程序开发人员工具箱非常有用的内核设施。我们从一种与用户进程相似的内核设施开始本章：内核线程；它们是面向并发处理的编程抽象。\n\
  \n内核提供了若干辅助接口，可以简化你的代码、消除冗余、提高代码可读性并有助于长期维护。我们将查看链表、哈希列表、工作队列、通知链、完成队列函数和错误处理工具。这些辅助工具是无\
  \ Bug 且经过优化的，因此你的驱动程序也可以免费继承这些好处。\n\n### 内核线程\n\n内核线程是在内核内部实现后台任务的一种方式。任务可以忙于处理异步事件，也可以睡眠等待事件发生。内核线程与用户进程相似，区别在于它们存在于内核空间，并且可以访问内核函数和数据结构。像用户进程一样，由于抢占式调度，内核线程具有独占处理器的幻。许多设备驱动程序利用内核线程的服务来实现助手或辅助任务。例如，作为\
  \ Linux USB 驱动核心部分的 `khubd` 内核线程（在 第 11 章 “通用串行总”中介绍），会监控 USB 集线器并在 USB 设备热插到系统时对其进行配置。\n\
  \n# 创建内核线程\n\n让我们通过示例来学习内核线程。在开发该示例线程的过程中，你还将学习如进程状态、等待队列和用户模式辅助程序等内核概念。当你熟悉内核线程后，可以利用它们作为在内核中进行各种实验的测试工具。\n\
  \n假设你希望内核在感应到某些关键内核数据结构的健康状况恶化时，异步调用一个用户模式程序向你发送电子邮件或传寻机告警。（例如，网络接收缓冲区中的空闲空间降到了低水位以下。）\n\
  \n这是一个实现为内核线程的候选方案，原因如下：\n\n* 它是一个后台任务，因为它需要等待事件。\n* 它需要访问内核数据结构，因为事件的检测是由内核的其他部分完成的。\n\
  * 它是一个耗时操作，因为它需要调用程序。\n\n##### 内置内核线程\n\n查看系统中运行的内核线程（也称为内核进程），请运行 `ps` 命令。内核线程的名称被方括号括起来：\n\
  \n![image](img/057tab01.jpg)\n\n`ksoftirqd/0` 内核线程是实现软中断（softirqs）的辅助。软中断由中断处理程序引发，用于请求对底半部分的处理。我们将在\
  \ 第 4 章 “准备工作”中详细查看底半部分和软中断，但这里的基本思想是尽可能减少中断处理程序中的代码。小的中断处理程序减少了系统的中断关闭时间，从而降低了延迟。Softirqd\
  \ 的工作是确保高负载的软中断既不会饥饿也不会淹没系统。在对称多处理（SMP）机器上，由于线程实例可以在不同的处理器上并行，每个 CPU 会创建一个 ksoftirqd\
  \ 实例以提高吞吐量（`ksoftirqd/n`，`n` 是 CPU 编号）。\n\n`events/n` 线程（`n` 是 CPU 编号）帮助实现工作队列，这是内核推迟工作的另一种方式。想要延迟执行工作的内核部分可以创建自己的工作队列，也可以使用默认的\
  \ `events/n` 工作线程。工作队列在 第 4 章 中也进行了剖析。\n\n`pdflush` 内核线程的任务是从页面缓存中刷新脏页面。页面缓存了对磁盘的访问。为了提高性能，实际的磁盘写入会被延迟，直到\
  \ pdflush 进程将脏数据写入磁盘。当可用空内存低于阈值或页面处于脏状态足够长，就会执行此操作。在 2.4 内内核中，这两个任务分别由两个独立的内核线程\
  \ `bdflush` 和 `kupdated` 执行。\n\n\n\n\n正如你在前一节看到的，`kjournald` 是通用的内核日志记录线程，被 `EXT3`\
  \ 等文件系统使用。\n\nLinux 网络文件系统 (NFS) 服务器是使用一组名为 `nfsd` 的内核线程实现的。\n\n我们的示例内核线程在被负责监控感兴趣数据结构的内核部分唤醒之前，会一直释放处理器控制权。当它处于唤醒状态时，它会调用一个用户态辅助程序，并在其环境中传递适当的身份代码。\n\
  \n要创建一个内核线程，请使用 `kernel_thread()`：\n\n```bash\n![image](img/p0058-01.jpg)\n```\n\
  \n标志指定了父线程和子线程之间共享的资源。`CLONE_FILES` 指定要共享打开的文件，而 `CLONE_SIGHAND` 请求共享信号处理程序。\n\n\
  Listing 3.1 显示了示例实现。由于内核线程通常作为设备驱动程序的辅助工作，因此它们在驱动程序初始化时被创建。然而，在这种情况下，示例线程可以从任何合适的地方（例如\
  \ `init/main.c`）创建。\n\n该线程通过调用 `daemonize()` 开始，该函数执行初始清理工作并将调用线程的父进程改为名为 `kthreadd`\
  \ 的内核线程。每个 Linux 线程只有一个父进程。如果父进程在没有等待子进程退出的情况下死亡，子进程将变成僵尸进程并浪费资源。将子进程重新挂载到 `kthreadd`\
  \ 可以避免这种情况，并确保在线程退出时进行适当清理。\n\n由于 `daemonize()` 默认阻塞所有信号，如果你的线程希望处理特定信号，请使用 `allow_signal()`\
  \ 来启用递送。内核内部没有信号处理程序，因此使用 `signal_pending()` 来检查信号并采取适当行动。出于调试目的，Listing 3.1 中的代码请求递送\
  \ `SIGKILL` 并在接收后退出。\n\n`kernel_thread()` 已被弃用，取而代之的是构建在前者之上的更高级 `kthread` API。我们将在稍后介绍\
  \ `kthreads`。\n\nListing 3.1. 实现内核线程\n\n```bash\n![image](img/p0059-01.jpg)\n![image](img/p0060-01.jpg)\n\
  ```\n\n如果你将其作为内核的一部分编译并运行，你可以在 `ps` 输出中看到新创建的线程 `mykthread`：\n\n```bash\n![image](img/060tab01.jpg)\n\
