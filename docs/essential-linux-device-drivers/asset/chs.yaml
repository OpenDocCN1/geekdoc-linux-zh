  \ 19 章“用户空间驱动”中讨论。\n\n### 第 3 章\n^[[1]](#ch03.html_ch03_01)) 在 2.6.21 及之前的内核中，`daemonize()`\
  \ 通过调用 `reparent_to_init()` 将调用线程重新父化为 init 任务。\n\n\n\n\n\nSoftirqs 和 tasklets 是内核内部用于延迟执行工作的两种其他机制。第\
  \ 4 章中的表 4.1 对比了 softirqs、tasklets 和工作队列。\n\n### 第 4 章\n\n稍后，网络应用程序使用不同的机制将请求路由到底层驱动程序。\n\
  \n`usb_alloc_urb()` 接口调用 `kref_init()`，`usb_submit_urb()` 调用 `kref_get()`，而 `usb_free_urb()`\
  \ 调用 `kref_put()`。\n\n### 第 5 章\n\n在加载 cmos 驱动之前，确保你已经卸载了如 `rtc.ko` 等内核模块，这些模块可能已经占用了相关的\
  \ I/O 地址范围。\n\n在第 15 章的侧边栏“TUN/TAP 驱动”以及“网络接口卡”中进行了相关讨论。\n\n完整的返回代码列表定义在 `include/asm-generic/poll.h`\
  \ 中。其中某些仅供网络栈使用。\n\n如果你的信号处理程序处理来自多个设备的异步事件，你将需要额外的机制（例如在处理程序内部调用 `select()`）来确定负责事件的设备身份。\n\
  \n看门狗可能会发出听性报警而不是触发系统重位。一个示例场景是由于电源问题导致超时，假设看门狗电路使用了电池或超级电容器进行备份。\n\n如果你需要监控多个应用程序的健康状况，可以在看门狗设备驱动程序中实现一个复用器。如果打开驱动器的进程中任何一个变得无响应，看门狗将尝试对系统进行自。\n\
  \n### 第 6 章\n\n此类平台设备通常不支持热插拔。`probe()` 方法的这种调用语义与稍后章节中将学的 PCMCIA、PCI 和 USB 等热插拔设备的语义不同，但驱动程序入口点的相似结构有助于\
  \ Linux 设备模型对所有设备拥有统一且一致的视图。\n\n### 第 11 章\n\n在 PCI 术语中，`disconnect()` 被称为 `remove()`。\n\
  \n在 PCI 和 PCMCIA 术语中，`disconnect()` 被称为 `remove()`。\n\n一种用于将内核调试数据导出到用户空间的内存文件系统。\n\
  \n在 2.6.22 内核发布之前，USB 输入设备驱动通常位于 `drivers/usb/input/`。\n\n在 2.6.22 内核发布之前，USB 网络设备驱动通常位于\
  \ `drivers/usb/net/`。\n\n### 第 13 章\n\n这种对混音器的定义是从软件角度给出的。声音混音或数据混合是指某些解码器混合多个音频流并生成单个流的能力。例如，如果你想在\
  \ IP 电话进行语音通话的同时叠加一条公告通知，就需要这种功能。本章后半部分讨论的 `alsa-lib` 库支持一种名为 `dmix` 的插件功能，如果你的解码器不具备硬件执行此操作的能力，它可以在软件中执行数据混合。\n\
  \n### 第 14 章\n\nATAPI 协议更接近 SCSI 而不是 IDE。\n\nSCSI 的支持在本书的其他部分也有讨论。第 19 章中的章节“用户态\
  \ SCSI”以及“用户空间中的驱动程序”讨论了 SCSI Generic (sg) 接口，该接口允许你直接从用户空间将命令调度到 SCSI 设备。第 20 章中的章节“iSCSI”以及“更多设备和驱动程序中的侧边栏“SDIO\
  \ 上的 WiFi”以及“无线的 Linux”，以了解 SD 尺寸中可用的非存储技术。\n\n我们示例设备中的存储介质具有平坦扇区几何结构。相比之下，IDE 控制器支持由设备头寄存器、低磁柱寄存器和高磁柱寄存器指定的磁道头头扇区（CHS）几何结构。\n\
  \n### 第 15 章\n\n请求稿（RFC）是规范网络标准的文档。\n\n### 第 16 章\n\nSuper I/O 芯片组通常支持 IrDA 之外的几种外设，如串口、并行口、数字乐器接口（MIDI）和软盘控制器。\n\
  \n关于 IrDA 之上的网络学术讨论，请阅读 `www.hpl.com/personal/Tourdev/IrDA`。\n\n此文件的位置取决于发行版。\n\n\
  路径名称可能随发行版而异。\n\n### 第 17 章\n\n正如你在“NAND 芯片驱动程序”节中学学的，NAND 闪存中分布着坏块是正常现象。\n\n`fdisk`\
  \ 和 `cfdisk` 用于操作 PC 系统上第一块磁盘上的分区表。\n\n如果你在内核配置期间启用了 `CONFIG_MTD_CMDLINE_PARTS`，可以通过内核命令行参数\
  \ `mtdpart=` 向 MTD 传递分区信息。查看 `drivers/mtd/cmdlinepart.c` 的用法语法。\n\n某些设备具有用于引导加载程序、额外文件系统和恢复内核的附加分区。\n\
  \n除非你为存储介质本身编写驱动程序。如果你将 Linux 嵌入会将部分 NAND 作为大容量设备导出到外部的设备上，那么你确实必须处理 NAND 驱动程序。\n\
  \n### 第 18 章\n\n在嵌入式引导加载程序术语中，两阶段引导加载器的第一阶段称为初始程序加载器（IPL），第二阶段称为辅助加载器（SPL）。\n\n\
  在如今物料清单（BOM）成本至关重要的嵌入式市场上，设备仅包含 NAND 存储并不罕见。此类设备从 NAND 闪存启动，其文件系统也驻留在 NAND 内存中。NAND\
  \ 启动需要处理器和引导加载程序的支持。\n\n欠电压（Brownout）是指输入电压跌到允许水平以下的情况（而，Blackout 指的是完全断电）。如果你的设备是通过以太网供电（PoE）等技术而非传统的插座供电，欠电压检测尤为相关。\n\
  \n表 18.2 中使用的文件名和目录路径取决于发行版。\n\n### 第 20 章\n\n在 2.6.22 之前，此驱动程序位于 `drivers/acpi/ibm_acpi.c`。\n\
  \n我们在第 11 章“通用总线”中为一个示例遥测卡开发了驱动程序。\n\n### 第 21 章\n\n你还可以通过以太网启动 kgdb 调试会话。\n\n\n\
  \n\n\n## 如果你仍在使用 2.4 版本的内核，请使用 `-m` 选项为 `insmod` 获取段地址：\n\n![image](img/602tab01.jpg)\n\
  \n## 某些 JTAG 调试器通过恰适地更换连接调试器与目标板的探头，可以适用于多种处理器架构。\n\n## 取决于你的调试场景，可能有更多此类终端。例如，如果你正在使用具有远程显示功能的示波器，你可以通过另一个终端上的\
  \ Web 浏览器对其进行操作。\n\n## 虽然 JTAG 硬件独立于目标操作系统，但前端接口可能具有对操作系统的依赖性。\n\n## 你必须在内核配置期间启用\
  \ `CONFIG_KALLSYMS` 才能获得此函数的服务。\n\n## 如果你仍在使用 2.4 版本的内核，你必须为内核源码打上支持 OProfile 的补丁。\n\
  \n## LTT 作为发布候选包含在 2.6.11-rc1-mm1 丁中，可以从 [www.kernel.org](http://www.kernel.org)\
  \ 下载。\n\n## 某些内核破解选项取决于架构。\n\n## 附录 B\n\n## 在无 BIOS 的嵌入式架构上，类似的职责（例如，在 ARM Linux\
  \ 上从挂起状态唤醒内核）由引导程序承担。\n\n"
