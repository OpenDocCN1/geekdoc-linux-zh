  \ 14.5 列出了你在本章中使用的主要内核编程接口以及它们定义的位置。\n\n表 14.4. 数据结构摘要\n\n![image](img/437tab01.jpg)\n\
  \n表 14.5. 内核编程接口摘要\n\n![image](img/438tab01.jpg)\n\n## 第 15 章.网络接口卡\n\n本章内容\n\n\
  *   驱动程序数据结构\n*   与协议层交互\n*   缓冲区管理与并发控制\n*   设备示例：以太网 NIC\n*   ISA 网络驱动程序\n*  \
  \ 异步传输模式\n*   网络吞吐量\n*   查看源码\n\n* * *\n\n连接赋予了智能。在今天，你很少遇到不支持某种形式网络的计算机系统。在本章中，让我们关注用于在局域网（LAN）上承载网协议（IP）流量的网络接口卡（NIC）驱动程序。本章的大部分内容与总线无关，但任何需要总线特定细节的地方都假设使用\
  \ PCI。为了让你了解其他网络技术，我们还涉及了异步传输模式（ATM）。我们通过对性能和吞吐思考来结束本书。\n\nNIC 驱动程序与其他驱动类不同之处在于，它们不依赖\
  \ `/dev` 或 `/sys` 与用户空间通信。相反，应用程序通过网络接口（例如，第一个以太网接口的 `eth0`）与 NIC 驱动程序交互，该接口抽象了底层协议栈。\n\
  \n* * *\n\n### 驱动程序数据结构\n\n当你为 NIC 编写驱动程序时，你需要对三类数据结构进行操作：\n\n1.  构成网络协议栈构建组件的结构。定义在\
  \ `include/linux/sk_buff.h` 中的套接字缓冲区或 `struct sk_buff` 是内核 TCP/IP 栈使用的关键结构。\n2.\
  \  定义 NIC 驱动程序与协议栈之间接口的结构。定义在 `include/linux/netdevice.h` 中的 `struct net_device`\
  \ 是构成此接口的核心结构。\n3.  与 I/O 总线相关的结构。我们将在接下来的节中详细查看套接字缓冲区和 `net_device`。我们在第 10 章涵盖了\
  \ PCI 数据结构。\n\n#### 套接字缓冲区\n\n提供高效缓冲区管理的 `sk_buff` 是拥有几十个元素的巨大结构，但在本章中，我们专注于网络设备编写者感兴趣的部分。`sk_buff`\
  \ 使用五个主要字段与其关联的数据缓冲区链接：\n\n*   `head`，指向数据包起始\n*   `data`，指向数据载荷的起始\n*   `tail`，指向数据载荷的结束\n\
  *   `end`，指向数据包结束\n*   `len`，数据包包含的数据量\n\n图 15.1. `sk_buff` 操作。\n\n![image](img/15fig01.gif)\n\
  \n假设 `skb` 指向一个 `sk_buff`，随着数据包遍历协议栈，`skb->head`、`skb->data`、`skb->tail` 和 `skb->end`\
  \ 会在关联的数据缓冲区上滑动。例如，`skb->data` 指向当前处理数据包的协议头部。当数据包通过接收路径到达 IP 层时，`skb->data` 指向\
  \ IP 头部；然而，当数据包传递给 TCP 时，`skb->data` 移动到 TCP 头部起始处。当数据包通过各种协议并添加或丢弃头部数据时，`skb->len`\
  \ 也会更新。`sk_buff` 还包含除上述四个之外的指针。例如，`skb->nh` 无论 `skb->data` 的当前位置如何，都会记住网络协议头部的位置。\n\
  \n\n\n\n为了创建一个用于接收数据包的 `sk_buff`，图 15.1 使用了 `dev_alloc_skb()`。这是一个中断安全的例程，它为 `sk_buff`\
  \ 分配内存并将其与数据包负载缓冲区关联。`dev_kfree_skb()` 完成了 `dev_alloc_skb()` 的相反操作。图 15.1 接着调用 `skb_reserve()`\
  \ 在数据包缓冲区起始和负载开始之间添加 2 字节的填充。这使得 IP 头部从一个性能友好的 16 字节边界开始，因为之前的以太网头部长度为 14 字节。图 15.1\
  \ 中的其余代码语句用接收到的数据包填充负载缓冲区，并移动 `skb->data`、`skb->tail` 和 `skb->len` 以反映这一操作。\n\n\
  还有更多与某些 NIC 驱动程序相关的 `sk_buff` 访问例程。例如，`skb_clone()` 会创建一个提供的 `skb_buff` 副本，而不复制关联数据包缓冲区的内容。查看\
  \ `net/core/skbuff.c` 可获取完整的 `sk_buff` 库函数列表。\n\n### 网络设备接口 (Net Device Interface)\n\
  \nNIC 驱动程序使用标准接口与 TCP/IP 栈交互。`net_device` 结构比 `sk_buff` 结构还要庞大，它定义了这种通信接口。为了准备探索\
  \ `net_device` 结构的内部，让我们首先遵循 NIC 驱动程序在初始化期间追踪的步骤。在我们移动的过程中，请参考列表 15.1 中的 `init_mycard()`：\n\
  \n*   驱动程序使用 `alloc_netdev()` 分配 `net_device` 结构。更常见的是，它使用 `alloc_netdev()` 的一个合适封装器。例如，以太网\
  \ NIC 驱动程序调用 `alloc_etherdev()`。WiFi 驱动程序（在下一章讨论）调用 `alloc_ieee80211()`，而红外（IrDa）驱动程序调用\
  \ `alloc_irdadev()`。所有这些函数都将私有区域的大小作为参数，并在创建 `net_device` 本身的同时创建该区域：\n\n    ![image](img/p0443-01.jpg)\n\
  \n*   接下来，驱动程序填充分配的 `net_device` 中的各种字段，并使用 `register_netdev(netdev)` 将填充后的 `net_device`\
  \ 注册到网络层。\n\n*   驱动程序从附带的 EEPROM 中读取 NIC 的介质访问控制 (MAC) 地址，并根据需要配置唤醒网络包 (WOL)。以太网控制器通常有一个伴随非易失性\
  \ EEPROM，用于存储 MAC 地址和 WOL 模式等信息，如图 15.2 所示。前者是一个全局分配的唯一 48 位地址。后者是一个魔法序列；如果在接收到的数据中找到它，如果\
  \ NIC 处于挂起模式，将会被唤醒。\n\n*   如果 NIC 需要板载固件才能运行，驱动程序将使用 `request_firmware()` 下载它，如第\
  \ 4 章中“微代码下载”节和“打基础”节所述。\n\n现在让我们来看定义 `net_device` 接口的方法。为了简单起见，我们将它们分为六类。在相关之处，本节将引导你参考“设备示例：以太网\
  \ NIC”节中列表 15.1 中开发的示例 NIC 驱动程序。\n\n### 激活 (Activation)\n\n`net_device` 接口需要常规方法，如\
  \ `open()`、`close()` 和 `ioctl()`。当你使用 `ifconfig` 等工具激活接口时，内核会打开该接口：\n\n```bash\n\
  ifconfig eth0 up\n```\n\n`open()` 设置接收和发送 DMA 描述符以及驱动数据结构。它还通过调用 `request_irq()`\
  \ 注册 NIC 的中断处理程序。`net_device` 结构作为 `devid` 参数传递给 `request_irq()`，以便中断处理程序可以直接访问关联的\
  \ `net_device`。（查看列表 15.1 中的 `mycard_open()` 和 `mycard_interrupt()` 以了解如何实现。）\n\n\
  当你关闭一个激活的网络接口时，内核会调用 `close()`。这完成了 `open()` 的相反操作。\n\n### 数据传输 (Data Transfer)\n\
  \n数据传输方法构成了 `net_device` 接口的核心。在发送路径中，驱动程序提供一个名为 `hard_start_xmit` 方法，协议层调用该方法将数据包向下传递以后续传输：\n\
  \n![image](img/p0444-01.jpg)\n\n直到最近，网络驱动程序还没有提供用于收集接收数据的 `net_device` 方法。相反，它们通过数据包负载异步地中断协议层。然而，这种旧接口已让位给新\
  \ API (NAPI)，NAPI 是中断驱动推模式和轮询驱动协议拉取的混合体。因此，感知 NAPI 的驱动程序需要提供一个 `poll()` 方法和一个权重\
  \ (weight)。\n\n![image](img/p0444-02.jpg)\n\n### 看门狗 (Watchdog)\n\n`net_device`\
  \ 接口提供了一个重置 NIC 的钩子。如果协议层在预定时间内没有感知到发送，它假设 NIC 已挂起并调用驱动程序提供的恢复函数。\n\n![image](img/p0445-01.jpg)\n\
  \n### 统计 (Statistics)\n\n为了允许用户态收集统计信息，NIC 填充 `net_device_stats` 结构并提供 `get_stats()`\
