  md: '# Get to grips with GRUB bootloader


    A boot loader controls the workstation after power-up — if an error occurs here,
    the operating system can do nothing!


    After power-up, the BIOS of the workstation performs a quick self-test and passes
    control to a special bit of code called a bootloader. This is what is responsible
    for passing execution to one or more operating system Byte&Streams that actually
    bring the station up.


    While Linux initially started via a bootloader called LILO, the GNU Project''s
    GRUB has since become the standard for most distributions. It was initially intended
    to boot GNU''s Hurd operating system — while that platform competes with Duke
    Nakum for the vapro-ware throne, components of it have since been reused in various
    other Unix operating systems.


    # Why GRUB?


    GRUB compares favourably to LILO for a variety of reasons. First of all, the loader
    is not limited to residing in the traditional MBR — in fact, it completely foregoes
    the traditional MBR for more modern ways of system initialisation. Furthermore,
    GRUB differs from LILO in that it understands the concept of file systems. This
    means that the bootloader can analyse the content of the partition being booted
    — LILO simply worked with fixed offsets and failed if one of them changed.


    ![](img/628186dda7facdc011bf39c938de3975_17_0.png)


    Another interesting benefit is the ability to start from the network: in theory,
    a Unix workstation can obtain its operating system from a server accessible via
    a LAN peripheral supported by GRUB. Finally, GRUB offers a significantly better
    user experience. The program can be skinned to display custom start-up screens
    and boot options. Even the basic version, however, is more flexible than LILO
    — the two screenshots accompanying this boxout show some of what the default installation
    of the program can do for you on a triple-boot workstation.


    # Style GRUB


    While power users will probably want to stick to the instructions for manual customisation,
    average owners of GRUB installations are better served with an automatic installer.
    Sadly, the GRUB Customizer is not part of the official Ubuntu distribution at
    the time of writing. Instead, it must be downloaded from a third-party PPA, which
    must be added to the apt-get repository list. Simply feed a terminal with the
    following commands one by one, and follow the instructions on the screen:


    ```

    sudo add-apt-repository ppa:danielrichter2007/grub-customizer

    sudo apt-get update

    sudo apt-get install grub-customizer

    ```


    Next, open the Dash and look for the search string "GRUB Customizer". Starting
    the program yields a three-item menu:


    ![](img/628186dda7facdc011bf39c938de3975_17_1.png)'
