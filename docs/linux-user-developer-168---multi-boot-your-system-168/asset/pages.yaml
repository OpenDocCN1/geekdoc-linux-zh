- pgno: 67
  md: '# Hack a toy with the Raspberry Pi : Part 1


    > Learn how to master four simple hacks and embed them into a toy


    ![](img/628186dda7facdc011bf39c938de3975_67_0.png)


    Dan Aldred

    Dan is a Raspberry Pi Certified Educator and a lead school teacher for CAS. He
    is passionate about creating projects and uses projects like this to engage the
    students that he teaches. He led the winning team of the Astro Pi Secondary School
    Contest and his students'' code is currently being run aboard the ISS. Recently
    the appeared in the QFC''s ''inspiring teacher'' TV advert.


    Combining an old toy and a Raspberry Pi, you can embed a selection of components
    to create your own augmented toy that responds to user input. For example, take
    a R2-D2 sweet dispenser, light it up, play music and stream a live web feed to
    your mobile device.


    Part one of this two-part tutorial covers setting up four basic features: an LED
    for the eye, a haptic motor to simulate an electric shock, a webcam stream from
    a hidden camera and the Star Wars theme tune broadcast to a radio. You may choose
    to combine these with your own hacks or use them as standalone features in other
    projects. Don''t feel limited to just using a Star Wars toy either – we used the
    R2D2 figure because it was cheap, available and popular, but there''s no limit
    to the toys that you can experiment with. Action figures (provided that they can
    be disassembled and/or have a stand or cavity that can be used to hold the electronics)
    and plushy or cuddly toys both lend themselves well to this kind of maker project,
    especially if they accompany a movie or TV show that has recognisable music or
    sound effects that you can make them broadcast. Part two next issue covers how
    to set up the toy and set up triggers to start features.


    # **01** Set up an LED


    LEDs are really easy to set up and control. They make a nice addition to your
    toy and can be used as eyes, flashing buttons or, in this example, R2-D2''s radar
    eye. Take your LED and hold the longest leg; this is the positive arm and connects
    to the input. Wrap the resistor around the leg and attach to a female jumper jerky
    wire. Now take the negative arm and attach this to another jumper wire.


    # **02** Attach the LED


    Take the positive wire, the one with the resistor, to GPIO 17, which is physical
    pin number 11 (look at the far-left top pin and count down six pins). This pin
    will provide the current that powers the LED. Connect the other wire to any of
    the ground pins, (GND) 6, 9, 14, 20, 39; you may need to move this around later
    as you add more wires for the other components.


    # **03** Light up the LED


    To turn the LED on and off, use the gpiozero library, which was developed to simplify
    the interaction between code and a physical computer. Open the LX Terminal and
    type


    ```

    sudo apt-get install python3-gpiozero

    ```


    to install the library (Remove the ''3'' if you want to use it with Python 2).
    Once installation is completed, open a new Python window and import the LED module
    (line 2 of the following code). Assign the pin number of the LED (line 3) and
    finally turn it on and off (lines 6 and 8). Save your code and run it to make
    the LED flash. Change the timings to suit your own project.


    # What you''ll need


    +   - An old/new toy

    +   - Resistors

    +   - Small disc motor

    +   - LED

