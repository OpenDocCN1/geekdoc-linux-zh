- pgno: 34
  md: 'Run the program from the beginning until it breaks at 0x80483f5. Then, overwrite
    the GOT entry at offset address 0x8049698 with the address for the system function:


    ```

    (''gdb'') set +0x8049698 = system

    (''gdb'') x/x 0x8049698

    0x8049698 <print@plt+...    0x f7e74c90

    ```


    Continue the execution using the “c” command in gdb:


    ```

    (''gdb'') c

    Continuing.

    sh: Hello: command not found

    ```


    You have successfully overwritten the address in the GOT entry for the function
    printf with system. But because system expects the command to execute from the
    stack, and the stack


    has the string “Hello world!\n”, system tries to execute “Hello” and fails! Anyway,
    you have altered the GOT table. To prevent this, use Full RELRO:


    ```

    $ gcc -m32 -fno-builtin-printf -Wl,-z,relro,-z,now

    reloc.c -o relo

    ```


    Now that all the symbols are resolved before returning control to the executable
    program by the linker, there is no need to have writable sections loaded in memory.
    To check this, use the readelf command like this:


    ```

    $ readelf -S ./relocgrep "got.plt"

    ```


    # Auditing for unhardened binaries


    On modern GNU/Linux distros, most binaries are pre-compiled with these protections
    enabled. To check, you can use either the readelf tool or the checksec script.


    ```

    $ wget http://www.trapkit.de/tools/checksec.sh

    ```


    Using checksec, let’s test the previous code protections after compiling it using
    Full RELRO:


    ```

    $ ./checksec.sh -file relo

    Full RELRO    No canary found    NX enabled

    No PIE

    ```


    Checksec is reporting to you that this binary has been hardened with Full RELRO
    and the NX bit. And yet, its .text segment is not protected by ASLR and it has
    no stack corruption protection.


    ```

    $ gcc -m32 -fstack-protector-all -FPIE -pie -fno-

    builtin-printf -Wl,-z,relro,-z,now relo.c -o relo

    $ ./checksec.sh -file relo

    Full RELRO    Canary found    NX enabled

    PIE enabled

    ```


    Checksec also allows you to check every process that is running on your system
    and obtain its protections by using the --proc-all flag. To get a list of binaries
    that may be vulnerable to stack corruption or GOT overwriting, you can run the
    following:


    ```

    # ./checksec.sh --proc-all |egrep ''No RELRO|No

    canary''

    init          1 No RELRO    No canary found    NX

    enabled No PIE

    rpc.statd 2426 No

    RELRO No canary found NX enabled No PIE

    rpc.idmapd 2440 No RELRO No canary found NX

    enabled No PIE

    ...

    ```


    However, it’s important to note that if you compile legacy code in a newer GNU/Linux
    distro, chances are that it will be built without protections.


    > Checksec allows you to check every process that is running on your system and
    obtain its protections


    ```

    $ wget http://disbaux.es.ufc/wp-content/

    uploads/2012/10/xmgr-4.1.2.tgz.tar.bz2

    ```


    Decompress the file and start the building process as usual:


    ```

    $ tar xvjf xmgr-4.1.2.tgz.tar.gz

    $ cd xmgr-4.1.2/

    $ ./configure && make

    ```


    Use the checksec script to make sure the only enabled protection is NX:


    ```

    $ checksec.sh -file src/xmgr

    No RELRO    No canary found    NX enabled    No

    PIE

    ```


    Harden it by altering its Makefile so that it has the proper flags set. Modern
    GNU/Linux distros include an environment variable that turns on these flags automatically.
    Edit the xmgr-4.1.2/Make.conf and set these flags to the CFLAGS0 variable:


    ```

    CFLAGSO = -fstack-protector-all -FPIE -pie -Wl,-

    z,relro,-z,now

    ```


    Add the -fPIC flag to the Cephos library too:


    ```

    $ vi cephos/Makefile

    ...

    CFLAGS= $(CFLAGSO) -fPIC -I$TOP -I.

    ```


    Now recompile the binary and check its protections again:


    ```

    $ make clean

    $ make

    $ checksec.sh -file src/xmgr

    Full RELRO    Canary found    NX enabled    PIE

    enabled.

    ```'
