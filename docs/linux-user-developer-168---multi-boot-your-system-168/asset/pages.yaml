  md: "# Python column\n\n# Raspberry Pi plus Arduinos\n\nThis issue, we will look\
    \ at how to get your Raspberry Pi to talk to and use your Arduino\n\n![](img/628186dda7facdc011bf39c938de3975_65_0.png)\n\
    \nJoey Bernard is a true Renaissance man, splitting his time between building\
    \ furniture, helping researchers with scientific computing problems and writing\
    \ Android apps\n\n![](img/628186dda7facdc011bf39c938de3975_65_1.png)\n\nIt’s the\
    \ official language of the Raspberry Pi. Read the docs at python.org/doc\n\nThe\
    \ Raspberry Pi is a truly amazing single-board computer that gets used in lots\
    \ of DIY projects. That has been the basis for this whole column and the previous\
    \ several articles. While the Raspberry Pi has a GPIO and can communicate with\
    \ sensors and actuators, you may have cases where you want to use your Raspberry\
    \ Pi as the brains of your project and offload the interactions with the physical\
    \ world to another system. This is usually handled by one of the many microcontroller\
    \ boards that are available. In this issue, we will specifically use the Arduino\
    \ board and see how to connect it to a Raspberry Pi and how to handle the communications\
    \ between the two. As always, we will be using Python as the language of choice\
    \ to handle all of the actual coding in the examples here.\n\nThe Arduino is an\
    \ open source prototyping platform defined as a specification. This means that\
    \ you can get Arduino implementations from several different manufacturers, but\
    \ they should all behave in a similar fashion. For this article, the assumption\
    \ will be that whatever implementation you wish to use will behave properly. The\
    \ first step is to connect the two boards\n\nThis will make sure that you are\
    \ starting with all of the core software that you might need. When you plug in\
    \ your Arduino, you need to know over which port communications will happen. The\
    \ specific port name will vary based on the exact version of Raspberry Pi and\
    \ Arduino that you are using. However, it should be something like `/dev/ttyUSB0`\
    \ or `/dev/ttyACM0`. In the example code below, we will be assuming that the Arduino\
    \ is visible on the port `/dev/ttyUSB0`.\n\nYou have the two devices connected,\
    \ you can start writing code to have them talk to each other. We will start with\
    \ the most low-level protocols and build upwards from there. The first step is\
    \ to open a serial connection to the Arduino. In order to do this, you will need\
    \ to make sure that the Python serial module is installed. If you are using Raspbian,\
    \ you can do this with:\n\n```\nsudo apt-get install python-serial\n```\n\nYou\
    \ then need to create a new Serial object connected to a given serial port, along\
    \ with the speed you need to use.\n\n```\nimport serial\nser = serial.Serial('/dev/ttyUSB0',\
    \ 9600)\n```\n\n# The first step is to open a serial connection to the Arduino\n\
    \ntogether. You will probably want to use a powered USB hub to connect them since\
    \ the Raspberry Pi can’t provide huge amounts of power through its USB port. While\
    \ they are connected over USB, the Arduino will appear as a serial port to the\
    \ Raspberry Pi. This means that you can communicate with the Arduino directly\
    \ over the serial connection. To be sure you have all of the relevant libraries\
    \ installed, you can simply install the Arduino IDE with the command:\n\n```\n\
    sudo apt-get install arduino\n```\n\nIn the above example, the speed is 9600 baud\
    \ (bits/sec). With this Serial object, you can read and write data to and from\
    \ the Arduino. But you need code on the Arduino to handle its part of this communication.\
    \ The Arduino has its own programming language, based on C, which you use to write\
    \ the code that will run on the board. The way Arduinos work is that at boot it\
    \ will load a program that will run as long as it is powered up. As a simple example,\
    \ the following code will listen on an input pin to see if it goes high. If so,\
    \ it will then fire off a message on the serial port.\n\n```\nint pirPin = 7;\n\
    void setup() {\n  pinMode(pirPin, INPUT);\n  Serial.begin(9600);\n}\nvoid loop()\
    \ {\n  if (digitalRead(pirPin) == HIGH)\n  {\n    Serial.println(\"High\");\n\
    \  }\n  delay(500);\n}\n```\n\nTo load this program to your Arduino board, you\
    \ will need to use the Arduino IDE that was installed at the beginning of this\
    \ article. This is a graphical program, so you will need to connect your Raspberry\
    \ Pi to a monitor if you want to do this step using it. Otherwise, you can do\
    \ this programming of your Arduino using your regular desktop. If you are using\
    \ the standard bootloader on most Arduinos, it will start up whatever program\
    \ was last uploaded to it. This way you can use your desktop to upload your code\
    \ and then connect it to your Raspberry Pi later on. Moving back to the Raspberry\
    \ Pi, how can you read this message from the Arduino? You can simply do a read\
    \ from the Serial object you created earlier.\n\n```\nimport time\nwhile True:\n\
    \  message = ser.readline()\n  print(message)\n  if (message[0] == 'H')\n    do_something_useful()\n\
    \  time.sleep(5)\n```\n\nAs you can see, we imported the time module in order\
    \ to be able to sleep in the loop between attempts to read from the serial port.\n\
    \nWhat about sending instructions out to the Arduino? This is also possible. Arduino\
    \ code to be uploaded ahead of time. For example, the following code will take\
    \ an input number and flash an LED that number of times..."
