- pgno: 64
  md: "# # My Pi project\n\n![](img/628186dda7facdc011bf39c938de3975_64_0.png)\n\n\
    # # Gesture-based TV remote control\n\nMake controlling your TV even easier with\
    \ the help of Frederick’s amazing gesture-controlled remote\n\n# ## Where did\
    \ the idea for the remote control stem from?\n\nWhen I came across interesting\
    \ parts online, I tend to buy them, even if I don’t have a specific project in\
    \ mind yet. That was the case with Pimoroni’s Skywriter HAT. I knew I’d be using\
    \ it in a project at some point in time, but didn’t know what at the time.\n\n\
    Later on, my children were asking to see a certain show. My daughter, five years\
    \ old, started swiping on the tablet looking for the show. It was a TV show, however,\
    \ and wasn’t available on the tablet. Using the remote was too difficult for her:\
    \ you have to turn on the TV, then the decoder using a separate remote, change\
    \ the channel and the volume.\n\nThat’s when I had the idea of simplifying the\
    \ remote into something more intuitive like the swiping gestures from the tablet.\
    \ As a first prototype, I kept the number of commands to a minimum: on/off, change\
    \ channel and change volume.\n\n# ## How long have you been working on the project?\
    \ Could you give us an insight into the development process?\n\nThe project really\
    \ didn’t take that long once I knew what I wanted to achieve. I believe the project\
    \ took about ten hours to prototype, build and program, spread across a few evenings.\n\
    \nThe first thing I typically do is break down the project into smaller, easier\
    \ to manage ‘problems’. In this case, I wanted to be able to detect gestures and\
    \ receive/ transmit IR signals.\n\nThe second step is to find a solution for each\
    \ problem identified in the previous step. Detecting gestures can be done with\
    \ the Skywriter HAT, using the accompanying Python library. Receiving and sending\
    \ IR signals can be done using software called LIRC and a simple circuit with\
    \ IR LED and receiver.\n\nOnce both worked individually, they had to be combined,\
    \ so that a gesture would trigger the corresponding IR signals. This was achieved\
    \ by editing and\n\nincorporating the LIRC functionality in one of the Skywriter\
    \ HAT example scripts. Once the script was finished and tested, I ensured it would\
    \ be started at boot time.\n\nFinally, with the hardware and software sorted,\
    \ I moved on to the creation of a wooden enclosure. I chose wood because it is\
    \ not conductive and does not affect the gesture detection of the Skywriter HAT.\
    \ The enclosure consists of two parts, with the components sandwiched in between.\n\
    \n# ## Wood does not affect the gesture detection of the Skywriter HAT\n\nSome\
    \ holes have been made to expose the IR LED and receiver to allow the IR signals\
    \ to pass through.\n\nThe device is currently powered externally, as this would\
    \ have made the project more complex. It is something I would like to tackle in\
    \ a future version though, by having a rechargeable battery incorporated in the\
    \ enclosure.\n\n# ## Did you face any problems developing the remote?\n\nProblems\
    \ typically arise when combining different features to have them interact with\
    \ each other, even though they function properly individually. In this project,\
    \ nothing has to function simultaneously, but rather sequentially, thus avoiding\
    \ this type of problem. When a gesture is detected, then the IR signals are triggered.\n\
    \nThe most difficult part of the project was probably fitting everything into\
    \ as small a package as possible. Using a piece of prototyping board with the\
    \ IR components and soldering it directly to the underside of the Pi saved a lot\
    \ of space compared to using stacking headers, for example.\n\n# ## What sort\
    \ of role does the Raspberry Pi play in this project?\n\nAs can be expected, the\
    \ Raspberry Pi is the brain of the project. It was used to record and store the\
    \ IR signals\n\nfrom the TV’s remote using LIRC and it processes the gestures\
    \ received by the Skywriter HAT.\n\nIn the current application, the Pi can seem\
    \ like overkill, especially for sending IR signals. The idea, however, is to extend\
    \ the functionality of this project and give the user the ability to record the\
    \ IR signals and map them to gestures via some kind of web-based wizard. This\
    \ is to avoid forcing users to need to initially have to use the command-line\
    \ interface to record the signals. The web server can be added to the Pi, without\
    \ having to modify the hardware or enclosure.\n\n# ## Was it difficult to implement\
    \ IR signals into the remote?\n\nNot really! The fact that LIRC allows the recording\
    \ of signals from the original remote(s) facilitates the entire process greatly.\
    \ Once all the signals have been recorded, it is possible to send them individually\
    \ or even have multiple signals combined. This is particularly useful when needing\
    \ to control multiple devices at once with the same trigger. For example, to watch\
    \ TV, both the TV and decoder need to be turned on. Changing the channels is done\
    \ by controlling the decoder; changing the volume is done via the TV.\n\n# ##\
    \ Do you have any advice for anyone interested in recreating your project?\n\n\
    The project is not that complex and is a fun introduction to control via gestures.\
    \ Try to make it your own by giving it a twist. You don’t necessarily have to\
    \ control a TV, as the proposed setup with IR transmitter could control any IR-enabled\
    \ device. Or you could even swap the IR transmitter for another type of trigger\
    \ and control something entirely different.\n\nThe project shows one example of\
    \ what can be achieved, but could be used for many different applications. \n\n\
    ![](img/628186dda7facdc011bf39c938de3975_64_1.png)\n\n# ### Frederick Vandenbosch\n\
    \nWhile nowhere as big as Frederick’s projects ever to do with, he likes to build\
    \ things about a subject and have fun while doing so.\n\n# ### Like it?\n\nPi\
    \ Hut has its own Raspberry Pi-based controller worth checking out. It works as\
    \ the perfect companion for your FURC module, or perhaps even for improved XBMC/Kodi\
    \ control.\n\n# ### Further reading\n\nFor those interested in recreating this\
    \ gesture TV remote control, Frederck has uploaded a full tutorial on his website:\
    \ frederickvanden bosch.be. On his site, you’ll also be able to take a look at\
    \ his other Pi projects, including an IoT light, Amazon Echo controller and a\
    \ panic button.\n\nwww.linuxuser.co.uk    65"
