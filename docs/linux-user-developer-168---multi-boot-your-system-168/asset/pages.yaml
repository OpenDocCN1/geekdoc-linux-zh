    \ Copy (cp -r) the files across to your new image and finally, create a root/init.sh\
    \ script. This is used by the Complete Linux Installer app on startup – you should\
    \ copy the script from an existing image and tweak to suit your uploaded OS.\n\
    \nAfter completing the OS installation, the Linux Deploy app allows you to start\
    \ and stop services of the new Operating System through the UI. The app can also\
    \ manage SSH and VNC settings.\n\nInstalling a new operating system takes about\
    \ 30 minutes. The recommended minimum size of a disk image is 1024MB (with LXDE),\
    \ and 512MB without a GUI – bear in mind that when you install Linux on a microSD\
