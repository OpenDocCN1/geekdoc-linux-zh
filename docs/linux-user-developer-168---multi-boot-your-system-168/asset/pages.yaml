- pgno: 23
  md: '# Feature


    Multi boot your machine


    # Recover GRUB


    Some installation processes – CentOS being a prime example – kill GRUB. Solving
    this problem is easy


    One of the disadvantages of open operating systems is the emergence of multiple
    solutions for one problem: for example, CentOS and Ubuntu use widely varying bootloaders.
    If a Windows machine forces an update (hello, Windows 10) that you hadn''t planned
    for, this can sometimes hide your bootloader at startup, although fortunately
    it doesn''t delete the data itself. Happily, restoring the venerable GRUB is not
    particularly difficult if you have not overwritten the actual partitions.


    # **01** Fire up Ubuntu


    The aforementioned USB stick or this issue''s disc containing Ubuntu''s installation
    media comes in really handy at this point – run it into your workstation and boot
    from it. Next, select the option "Try Ubuntu" when prompted. After a few seconds,
    make yourself at home in a version of the Ubuntu desktop hosted on the installation
    media.


    ![](img/628186dda7facdc011bf39c938de3975_23_0.png)


    ![](img/628186dda7facdc011bf39c938de3975_23_1.png)


    # **02** Download boot-repair


    Even though GRUB can also be installed by hand, a graphical utility called boot-repair
    tends to be a faster and safer alternative for the average user. Sadly, it is
    not included by default – instead, download it by entering the following commands
    into a terminal window:


    ```

    ```

    sudo add-apt-repository ppa:yannubuntu/boot-repair

    sudo apt-get update

    sudo apt-get install -y boot-repair && boot-repair

    ```

    ```


    When done, the utility will automatically start to scan your hard disk for all
    potential operating systems.available.


    ![](img/628186dda7facdc011bf39c938de3975_23_2.png)


    # **03** Use recommended repair


    At this point of the proceedings, simply click Use Recommended Repair. This will
    make boot-repair try and create a boot parameter set of its own – a process that
    can take some time and must not be interrupted at any means.


    ![](img/628186dda7facdc011bf39c938de3975_23_3.png)


    # **04** Obey the orders!


    boot-repair cannot run all commands directly. In some cases, a window similar
    to the one shown in the figure accompanying this step will pop up. Should this
    be the case, follow the on-screen instructions carefully, using a second terminal
    which can be opened from the Dash. Be aware that some of the commands download
    between 20 and 50MB worth of data from the internet.


    ![](img/628186dda7facdc011bf39c938de3975_23_4.png)


    # **05** Reboot your workstation


    When done, boot-repair will open a text editor window containing a detailed log
    of the changes made – it is important if you ever seek help online, and should
    be saved onto a USB stick or to an online service like PasteBin. Next, reboot
    your workstation and remove the installation media – all should be just the way
    it used to be before that pesky installer went wild!'
  merge: -1
  img_proc: true
