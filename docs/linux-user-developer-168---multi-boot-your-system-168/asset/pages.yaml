    The top menu bar. You can enter first name, last name and email address for the
    project members here. Once done, select and invite them as member, leader or manager.
    Ganib allows role-specific information access. For example, data that a manager
    can access need not be disclosed to all project members. Multiple roles can be
    added to a single user. Typically, users are added at the beginning of the project
    but you can add them during the project too.


    Ganib provides a user-friendly interface for timesheets where project members
    can easily update their current tasks or view tasks for any data, week or month.

    Monthly views allow you to keep track of what an employee has worked on and for
    how many hours in that month. You can easily navigate to a certain date of a month
    to view the task details and also select a different month or year. There are
    few filters available in the page to view the desired data for particular account
    and project.

    Ganib timesheet also provides you with weekly views where you can see tasks assigned
    to logged-in users and meetings scheduled in that week. You can easily navigate
    between weeks and select the date range from the filters to view data for a particular
    week. You can further filter out data based on name and assignment types.


    ![](img/628186dda7facdc011bf39c938de3975_41_2.png)


    ![](img/628186dda7facdc011bf39c938de3975_41_3.png)


    # ## 04 Create a project


    Now we have an account and project members allocated to that account. Next we
    create a project in Ganib. On the Account page, you’ll see the icon for creating
    a new project. Click on the icon and enter the project name and description to
    create the project.

    When the project is created, the next thing is to create a task plan to help manage
    the project easily. Ganib provides a plan module where you can easily create a
    task and change its dates, dependencies, deadlines and assignments to anyone for
    specific hours/day. As you start working on the task you can update the number
    of hours spent per day on the task along with any comments you want to specify.


    # ## 06 Generating reports


    Project progress can be monitored using reports. Reports are also very effective
    tools for managers for purposes like budgeting and estimations, where developers
    can view statistics based on task status, and monitor if they are behind deadline
    or on track. There are several detailed reports available in Ganib. To access
    reports click on the Reports button on the top menu bar.


    > “During almost all the phases of a project’s life cycle, documents play a very
    important role. File management is often a burden for a project manager”


    When a complex task is created it is very difficult to manage it between the team
    due to confusion that arises when multiple people are working on it. Using Ganib
    you can easily manage complex tasks by turning them into simple sub-tasks, which
    will help each team member to concentrate on one thing at a time.


    # ## 05 Time management


    Time management is the most crucial part for effectively managing a project. Click
    on the Timesheet button on the top menu bar to access timesheets.


    There are two major bar graphs available. First is the work-based bar graph, depicting
    the percentage of work completed on a particular task. It classifies the tasks
    into categories: percentage-of-completion, late and unsignied tasks. Second is
    the members-based bar graph. This bar graph gives details on all of the resources
    in the project. It even classifies the users according to their availability status
    as online, active and inactive (resources who are offline for more than eight
    hours).

    Apart from these there are also four more graphs available – Billed Hours showing
    the hours calculated for each user on each...'
