  md: '# ## DISTRIBUTED KEY-VALUE STORE


    # # etcd 3.0


    An improved API for the distributed, consistent key-value store


    etcd is a “distributed, consistent key-value store for shared configuration and
    service discovery,” whose stored data is automatically distributed and replicated.


    The Raft consensus algorithm, which is very efficient for small clusters, provides
    automated master election and consensus establishment. The new release’s API brings
    improved scalability, thanks to a new storage engine, and supports Multi-Version
    Concurrency Control (MVCC).


    Installation for most will be a matter of unpacking the pre-built binary and running
    it — or following the Docker instructions. etcd is written in Go – the language
    that seems, ironically, to be designed to be difficult to Google for – and is
    rigorously tested, as well as proven in some very large scale deployments. The
    included etcdctl is a command line interface for exploring your cluster or running
    scripts, but most of your interaction will be through the REST interface via gRPC
    and HTTP/2.


    Originating in the distributed CoreOS, which received a funding boost from Google
    last year, etcd has been used with Google’s own Kubernetes orchestration system
    for cluster management, and with many applications in a number of interesting
    companies, many of which are listed on the project’s website. Trailing the development
    versions in the run-up to the latest release, if you were impressed with the speed
    and efficiency of 3.0. If your project is moving towards disposable clusters and
    microservice architectures, take a look at etcd.


    ### Pros

    Extremely efficient. Asynchronous DRAM (ADR) gives stable storage without the
    bottlenecks.


    ### Cons

    While it works out of the box for well established use cases, others will need
    some work.


    # Great for…


    Managing clusters, or apps running, cross tool chains: github.com/coreos/etcd


    # ## EPHEMERIS


    # # wxEphe 1.4


    It''s easy to find the planets with this handy tool


    Major Tim’s months on the ISS have seen an increase in interest in all things
    space-related. If you’ve got that old telescope or binoculars out, dusted them
    down, and started searching the heavens, you’ll know the real difficulty is finding
    anything, and knowing when to look. An ephemeris – from the Greek word ἐφημερίς,
    a diary – gives the position of heavenly objects (natural and artificial) at a
    given time, and given the calculations involved to project the positions of astronomical
    objects, it’s no surprise that they’ve been compartmentised from the very earliest
    days. Nowadays there are online services, but having an ephemeris on your laptop
    frees you from data connectivity worries when out with your telescope.


    wxEphe is a wxWidgets-based application – easy to install, given a few basic packages
    – displaying ephemerides for the Sun, the Moon and the planets, given a date and
    the observer’s location. The default location is Lyon, and changing this currently
    means editing a config file, armed with your co-ordinates. Although only the planets
    (except Pluto, you’re not going to see that through your telescope!) and the Moon
    are covered, the data given is extensive, from coordinates to phase.


    ![](img/628186dda7facdc011bf39c938de3975_90_0.png)


    Above Got a telescope and a basic guide to use? Now all you need to view the planets
    is to run wxEphe


    ### Pros

    All the data you need to find and observe the major bodies of our solar system,
    all very neatly presented.


    ### Cons

    Is it not quite yet finished – adding your location placement to a config file
    is not ideal in a GUI application.


    # Great for…


    Anyone who needs a little help finding the planets

    www.jpm.org/'
