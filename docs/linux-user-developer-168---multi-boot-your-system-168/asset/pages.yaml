  md: '# # Set up a virtualisation host and virtual machines


    Take a closer look at setting up virtualisation hosts and virtual machines on
    Ubuntu


    ![](img/628186dda7facdc011bf39c938de3975_43_0.png)


    **Swayam Prakasha**

    has a Masters degree in computer engineering. Swayam has been working in information
    technology for several years, concentrating on areas such as operating systems,
    networking, network security, electronic commerce, internet services, LDAP, and
    web servers. Swayam has authored a number of articles for trade publications,
    and he presents his own papers at industry conferences. He can be reached at swayam.prakasha@gmail.com


    **Using the Ubuntu system as a virtualisation host, you can run multiple operating
    systems on a single computer.** The systems you create on the host are referred
    to as virtual machines (VMs). A VM can be running MS Windows, Fedora, another
    Linux system or just about any other operating system that can run directly on
    the computer architecture of the host. Once a VM is installed, you can work with
    it in the same way as you would work with the operating systems installed directly
    on computer hardware. It can be noted here that with VMs, it is much easier to
    duplicate them, migrate them to other virtual hosts to improve performance or
    configure them to failover to another host when a host becomes inoperable. That
    is, with VMs, you can make more efficient use of your computer infrastructure.

    Using your Ubuntu system as a virtualisation host, you can start building a computer
    infrastructure that can scale up as you need more computing power. By having


