    So what is the most critical requirement for running Ubuntu as a virtualisation
    host? You need to ensure that you have a CPU that supports virtualisation. You
    also need to make sure that the computer has enough resources to effectively run
    the virtual machines. Let’s take a look at how we can check our computer to ensure
