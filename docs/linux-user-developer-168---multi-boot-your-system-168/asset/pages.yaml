    # **10** Configure the software – part 1


    There are now seven configurations to change in order to get the most suitable
    output from the camera. You can experiment with these to see which produces the
    best results. In the LX Terminal, type:


    ```

    `sudo nano /etc/motion/motion.conf`

    ```


    ...to load the configuration file. Locate the *daemon* line you can find the lines
    by pressing CTRL+W, which loads a keyword search) and ensure that it is set to
    ON; this will start Motion as a service when you boot your Pi. Next, find the
    *webcam_localhost* and set this to OFF so that you can access motion from other
    computers and devices.


    ![](img/628186dda7facdc011bf39c938de3975_69_1.png)


    # **11** Configure the software – part 2


    Next, find the *stream_port*, which is set to 8080. This is the port for the video
    and you can change it if you are having issues viewing the feed; 8081 provides
    a stable feed. Then, find the *control_localhost* line and set it to OFF. The
    port that you will access the web config interface is on the *control_port* line
    and the default is 8080; again, you can change it if you have any streaming issues.
    The frame rate is the number of frames per second that are captured by the webcam.
    The higher the frame rate, the better the quality, but setting it higher than
    6fps will slow the Pi’s performance and produce lag. Finally, set the *poct_capture*
    and specify the number of frames to be captured after motion has been detected.


    # **12** Running Motion as a daemon


    A daemon is a program that runs in the background providing a service; in this
    project you want to run Motion. You do not want to manually have to start it every
    time you load


    the Pi; it’s better that it automatically starts at bootup. In the LX Terminal,
    type **sudo nano /etc/default/motion** to edit the file. To set Motion to run
    as a service from bootup, you need to change the *start_motion_daemon* to Yes:


    ```

    `start_motion_daemon=yes`

    ```


    Save and exit the file using CTRL+X and restart your Pi.


    ![](img/628186dda7facdc011bf39c938de3975_69_2.png)


    # **13** Starting the web feed


    Before viewing the feed, type a note of your IP address. In the LX Terminal, type
    **sudo ifconfig**, although you will have set this in step 8. Then start Motion
    by typing **sudo service motion start**. Wait for few seconds for it to initiate,
    then open a browser window on your device. Enter the IP address of your Pi, including
    the port number that you set in step 11. If you are using VLC player, go to *File/Open
    Network* and enter the IP address of your Pi followed by the *stream_port* – for
    example, 192.168.1.50:8080. The port number in this example is 8080, but you set
    this in step 11 to 8081 or another value of your choice.


    # **14** Install the PiRadio software


    PiFM is a neat little library which enables your Raspberry Pi to broadcast to
    a radio. Note that this is only for experimentation and should you want to make
    a public broadcast you must obtain a suitable licence. Getting set up is simple:
    load the LX Terminal and make a new directory to extract the files into:


    ```

    `mkdir PiFM

    cd PiFM`

    ```


    Then download the required Python files:


    ```

    `sudo apt-get update,

    sudo apt-get upgrade,

    wget http://www.omatots.com/pifm.tar.gz`

    ```


    Finally, extract the files using the code:


    ```

    `sudo tar xvfz pifm.tar.gz`

    ```


