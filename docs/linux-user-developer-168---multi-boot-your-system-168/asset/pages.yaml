    # Partitions


    # Back up before you start


    Even though repartitioning tends to be a very safe operation, it’s important to
    perform a backup before following any of the steps shown in this guide. Power
    outages, typing mistakes or the infamous lab aide tripping over a power cable
    can all cause problems that are almost impossible to fix without the (pricey)
    services of a data repair lab.

    The safest way to get into the fray involves the use of an external hard disk.
    Replicate a hard disk image, or copy a selection of important files and – this
    is crucial – disconnect the external HDD from your workstation. Some IT security
    professionals even go so far as to recommend the purchase of multiple external
    hard disks, one or more of which are stored off-site and which are updated in
    a round-robin fashion. On the disc and on FileSilio this issue you can install
    BackupPcto ensure you’ve backed up all data.

    Be aware that the usage of dual or triple boot with at least one Windows partition
    does not provide complete protection against ransomware. Viruses like Petya have
    already shown the ability to work outside of Windows – it’s only a question of
    time until a miscreant extends his reach to EXTl4 systems.


    # Graphical disk overview


    GParted provides a diagram of the partitions as they appear on the hard disk.
    This is interesting, as partitions usually can only grow “backwards” – if a partition
    structure looks irrecoverable, starting over can be the best choice


    ![](img/628186dda7facdc011bf39c938de3975_16_1.png)


    > **Choose your file system wisely**

    > Partitions can be formatted in a variety of file systems. If a partition is
    intended to be used by different operating systems, the primitive FAT32 tends
    to be the best choice


    > **This space is empty**

    > The partition of the example workstation is not used fully. Unallocated space
    is not used by anything, and should be allocated to a partition to make it accessible
    for file storage


    # How partitions work


    The most basic installation – well known from Windows – consists of one partition
    per disk. Operating systems with a server tradition expect multi-disk systems:
    dedicating disks to tasks is effective as it reduces latency impact and actually
    provides for a greater transfer speed.

    Hard disks can be divided into up to four partitions using the traditional MBR
    scheme. One of them can be a logical partition that contains additional logical
    partitions.


    # How to handle partitions


    Administrators can choose between a large selection of utilities for partition
    management: Windows comes with the Storage Snap-In described later in the feature,
    while Ubuntu and Debian tend to use GParted on the disc and File5iloinstead.

    All of the programs behave in a similar fashion. The most important warning is
    that meddling with partition structures can be dangerous – leaving an inexperienced
    user alone with a partition manager is a sure-fire way to provoke data loss.'
