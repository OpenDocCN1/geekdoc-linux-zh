- pgno: 76
  md: '# # Explorer robot


    # 02 The chassis kit


    The chassis is made up of three main parts – the largest piece is where we attach
    the wheels and tracks, but also holds the 4xAA batteries. It has a battery lid
    which if lost or damaged will mean the batteries may drop out, so take good care
    of it. There is an acrylic cut-out which mounts on the top with bolts – peel off
    the brown protection paper.


