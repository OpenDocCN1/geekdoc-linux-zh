    ![](img/628186dda7facdc011bf39c938de3975_42_0.png)


    # 07 Real Time Tracker


    Though time tracking is crucial for a project it is also very time consuming to
    enter data manually after each task, and developers forgetting to log their working
    hours is a common scenario! gRac1 within Ganib is a desktop application that provides
    automated time tracking. It can capture work hours, screenshots, count keyboard
    or mouse activity, and then update Ganib with work progress in real time. To install
    gRac1, download the jar file for your OS from the gRac1 tab and execute it. Post-installation
    you will be asked to log in with your Ganib account credentials; it will auto-sync
    your tasks from Ganib. To work on a particular task, double-click it and click
    Work. To pause the timer, click the Relax button. If there is no interaction with
    gRac1, a warning is issued every five minutes. Click Done to see your progress.
    If there are some technical issues in the project, the responsible member can
    write a post in gRac1 by clicking Scrum, which will be visible to all project
    members.


    ![](img/628186dda7facdc011bf39c938de3975_42_1.png)


    # 08 File management


    During almost all the phases of a project''s life cycle, documents play a very
    important role. File management is often a burden for a project manager. Ganib
    provides options to retain the important documents in the project itself, where
    you can not only store the file but also optimize it, incorporate version control
    and hierarchy structure. To access documents, click on the Documents button on
    the top menu bar under Projects.


    Create the respective folders and upload documents to them. You can add documents
    in the Documents module individually or as a group in different folders. Now you
    can check in these documents for version control or check them out to edit. To
    update the file properties, select the specific file using the radio button. You
    can share the documents by uploading the file in the project Documents for your
    team''s project. To move the documents from one folder to another, select the
    document and click the Move button. You can also link the document to particular
    tasks, deliverables, post, calendar, and so on. You can delete the documents if
    you want and restore them back from the trashcan.


    # 09 Specifications management


    The Page module lets you create wiki pages for your project. To create a new page,
    click on the Page button on top menu bar and click new page. You will get a form
    to enter content. Submit the form after you add all your content. You will be
    able to see a new page with content you just entered. To edit a page, go to the
    Edit Page link. It is good practice to add a descriptive edit summary along with
    the update. This way, members of the team can understand the reason behind any
    change in the content of the wiki page. You can view and control all the changes
    made to the wiki pages via the Changes option. Just click on the Changes link
    on the left side bar. Here you can see the changes made on the page in chronological
    descending order along with the change description that was provided in the Edit
    Summary option.


    ![](img/628186dda7facdc011bf39c938de3975_42_2.png)


    # 10 Lists, blogging and more


    We have covered most of the important features of Ganib, but there are a few more
    features that will definitely make your life easier. The first is dynamic forms
    called Lists. You can create a custom list and add different fields to it as you
    need. To create a list, first go to your project and click on Lists-Design. On
    the next page, click New List on the left side bar. Another interesting feature
    is blogging. You can create blogs on certain topics. To create a blog, click on
    Blog on the top menu bar. On the next page, you can add Facebook-style status
    updates.


    Ganib also provides discussion boards. This lets members related to a project
    join the discussion and share their views and suggestions. Discussions are segregated
    into various groups, with access control available for each group. Discussions
    also allow voting. You can create or access a discussion using the Discuss button
    on the top menu bar. Ganib also provides an iterations module to specify a block
    of time on a project. Different software cycles use this mode differently. Iterations
    can have predecessor iterations, meaning until the predecessor iteration is complete,
    the successor iteration shouldn''t start.


    ![](img/628186dda7facdc011bf39c938de3975_42_3.png)'
