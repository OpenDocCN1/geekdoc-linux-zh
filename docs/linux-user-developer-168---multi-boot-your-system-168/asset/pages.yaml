  md: "![](img/628186dda7facdc011bf39c938de3975_8_0.png)\n\n# HARDWARE\n\n# Sony to\
    \ compensate users for Linux on PS3 debacle\n\nSony will pay out millions to those\
    \ affected by the OtherOS issue\n\nOne of the gleaming features of the PS3 when\
    \ it first launched was the introduction of the “OtherOS” feature. At the time,\
    \ it caused quite a stir in the open source community. This monumental feature\
    \ would allow users to install Linux on their machine and access all the extra\
    \ functionality that it brings with it. Unfortunately the feature was relatively\
    \ short-lived, with a software update essentially killing off the feature back\
    \ in 2009. While the update wasn’t mandatory, it all but disabled several of the\
    \ PS3’s key features until it was applied, preventing Linux users from connecting\
    \ to the PlayStation Network or playing games online.\n\nA lawsuit was soon raised,\
    \ stemming from Sony’s claims for third-party OS capabilities on their console.\
    \ Lawyers representing as many as 10 million console owners on one side and Sony\
    \ on the other, have now reached a deal which would see Sony make a mandatory\
    \ multi-million dollar payout to consumers. The proposed settlement will see gamers\
    \ eligible to receive $55 if they ever used Linux on their console, while users\
    \ who\n\nbought a PS3 for the “OtherOS” functionality will be able to claim $9.\
    \ The current settlement, which still needs to be approved by a federal judge\
    \ in the US, is currently only available for those residing in the United States\
    \ who bought a fat PS3 between November 1st 2006 and April 1st 2010; but it’s\
    \ likely that the ruling could go much further than that.\n\nDuring the litigation,\
    \ it was alleged that piracy was one of the key decisions behind the removal of\
    \ the feature. Sony also added that its terms of service, which gamers agree to\
    \ when initially setting up their console, allowed it to remove the OtherOS feature,\
    \ and that it wasn’t as widely-used as the company initially thought it would\
    \ be.\n\nFor gamers to claim their $55 and subsequent payout if the case is more\
    \ widespread, they must provide proof of their purchase, PlayStation Sign-In ID\
    \ and submit proof of their use of the OtherOS functionality. Sony has also agreed\
    \ to use its PlayStation Network database to notify everyone potentially affected,\
    \ with the steps they need to take to make their claim and seek compensation from\
    \ the console giant.\n\n# Distro Feed\n\n# Top 10\n\n+   Average hits per day,\
