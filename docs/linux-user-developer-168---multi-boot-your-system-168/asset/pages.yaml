  md: "# Tutorial\n\n# Compile new software\n\n■ Protections and performance\n\nSome\
    \ of these protections can affect the program's throughput. For example, `relro`/`full\
    \ relro` means that the `I-x` will resolve every library function's binary function\
    \ to load immediately `reloc_1s` control. To more loading, some before-to-binary\
    \ is responsive. Take this into account and always run performance tests.\n\n\
    Try to overflow the buffer now as you did before:\n\n```\n$ ./vuln `perl -e 'print\
    \ \"A\"x18'`\n*** stack smashing detected ***: ./vuln\nterminated\n```\n\n# Full\
    \ RELRO\n\nWhenever running a new binary that makes use of shared libraries, the\
    \ addresses of these libraries are resolved at execution time when a first call\
    \ is made to any one of these libraries; this is called Lazy Binding. Because\
    \ some addresses have to be figured out later on in the life of a binary loaded\
    \ in memory, some ELF segments must be writable. This can lead to a well-known\
    \ attack that overwrites the Global Offset Table (GOT) so that instead of making\
    \ a call to, say, `printf`, once the attacker has been able to overwrite the address\
    \ for `printf`, the program will end up calling some malicious injected code.\n\
    \n```\n#include <stdio.h>\nint main(int argc, char **argv){\n    printf(\"Hello\
    \ there!\\n\");\n    return 0;\n}\n```\n\nSave it and compile it this way:\n\n\
    ```\n$ gcc -m32 -no-builtin-printf relro.c -o relro\n```\n\nDisassemble the binary\
    \ by running the `objdump` utility:\n\n```\n$ objdump -d relro > relro.S\n```\n\
    \nOpen the resulting disassembled file and look for the main function. Instead\
    \ of calling `printf`'s address directly, there is a call to a symbol named `printf@plt`:\n\
    \n```\n00048348 <main>:\n...\n80483f5: e8 06 ff ff ff    call\n8048306 <HYPERLINK\
    \ \"mailto:printf@plt\" printf@plt>\n80483fa: 68 00 00 00 00    mov $0x0, %eax\n\
    ```\n\nGo to that offset, ie. `0048300`. You can clearly see that there is a jump\
    \ into the GOT. The push `$0x0` is going to set the actual address for `printf`\
    \ in the first GOT entry available for shared symbols, ie. `GOT[3]`:\n\n![](img/628186dda7facdc011bf39c938de3975_33_0.png)\n\
    \n```\n00048300 <printf@plt>:\n8048300: ff 25 98 94 04 08  jmp\n*<0x0894958>\n\
    8048306: 68 00 00 00 00    push $0x0\n804830b: e9 e0 ff ff ff    jmp\n80482f0\
    \ <.init+0x34>\n```\n\nRun the executable inside a `gdb` session to analyze the\
    \ GOT. Because the `_got.plt` table is a section inside this ELF binary, you can\
    \ ask `gdb` for its exact address:\n\n```\n$ gdb ./relro\n(gdb) info sections\
    \ _got.plt\n0x089495c >0x0894964  0x0000068 _got.plt\nALLOC LOAD DATA HAS CONTENTS\n\
    ```\n\nSet a breakpoint right after the call to the `printf@plt` function and\
    \ run the program:\n\n```\n(gdb) b *0x00483fa\nBreakpoint 1 at 0x00483fa\n(gdb)\
    \ r\nHello there!\nBreakpoint 1, 0x00483fa in main ()\n```\n\nLet's find out where\
    \ the `printf` function is located:\n\n```\n(gdb) printf printf\n$3 = <text variable,\
    \ no debug info> 0x7f7e82c80\n<\"printf\">\n```\n\nSo `GOT[3]` must have the address\
    \ `0x7f7e82c80`, which is the address for `printf`. To make sure this is so, dump\
    \ the first 4 bytes for the `_got.plt` table:\n\n```\n(gdb) x/4 0x089495c\n0x089495c\
    \ <_GLOBAL_OFFSET_TABLE_> 0x0894958\n0x7fff0598\n0x7fff3598     0x7feac80\n```\n\
    \nBecause this is a writable address in the ELF binary, you can put whatever address\
    \ you want in `GOT[3]`. You can find out which address equals to `GOT[3]` by doing\
    \ pointer arithmetic:\n\n```\n(gdb) x/4 0x089495c+12\n(0x0894968 <printf@.plt>\
    \          0x7feac80\n```\n\nSo `GOT[3]` is located at `0x0894968`! Let's toy\
    \ with the GOT, your goal will be to execute the system function instead of the\
    \ \"Hello world!\" message. To do this, first find out where the address of `system`\
    \ is:\n\n```\n(gdb) x system\n$8 = <text variable, no debug info> 0x7f74c90\n\
    <\"system\">\n```\n\nSet a breakpoint before calling the `printf@plt` symbol:\n\
    \n```\n(gdb) b *0x00483f5\nBreakpoint 2 at 0x00483f5\n```"
