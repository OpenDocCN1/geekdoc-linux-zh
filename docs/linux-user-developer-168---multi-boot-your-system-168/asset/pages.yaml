- pgno: 81
  md: '# Review Office suites


    # OpenOffice


    An office suite with a bunch of extras to keep its user base hooked


    ![](img/628186dda7facdc011bf39c938de3975_81_0.png)


    Tools are listed around the entire Writer program, which can be a lot to take
    in for new users who are accustomed to Word


    # Document creation


    The sheer volume of tools available in OpenOffice''s Writer program has to be
    applauded, as there''s really everything you could need here. A particular favourite
    of ours is the Wizards feature, a handy tool that takes the hassle out of creating
    your own templated documents such as letters and agendas. Options are crowded,
    but the layout can be altered if needed.


    # Spreadsheet tools


    While Calc can also boast an impressive suite of features, it''s much harder to
    navigate than many of the spreadsheet-based programs in this group test. For advanced
    users, however, the DataPilot feature is an invaluable tool for pulling in raw
    data from different databases. New users can find all the data entry tools they
    need, if they manage to navigate between the menus.


    # Presentation options


    There''s a lot to like in the Impress program, so much so that it closely rivals
    Microsoft PowerPoint. Creating and customising slides can be as easy or as convoluted
    as you like, with additional support for multiple monitors a real benefit. Without
    doubt its killer feature is being able to create Flash versions of your presentations,
    which works well in practice.


    # Extra features


    As well as the core programs you''d expect from an office suite, Apache OpenOffice
    piles on the extras. Base is a workable, if not complicated, database management
    program, while the Math program is on hand for working out complex equations.
    For many, these programs will be fairly superfluous, but they could be helpful
    for some.


    # Overall


    > If you need an office suite that packs in the features, then OpenOffice may
    very well be worth downloading and checking out. But for what it packs in, its
    poor layout does hinder it


    7


    # LibreOffice


    Frequent updates helped LibreOffice become a premier office suite


    ![](img/628186dda7facdc011bf39c938de3975_81_1.png)


    Cut-out the mundane task of creating templates and let LibreOffice do the work
    with the built-in Wizards tool


    # Document creation


    Everything about LibreOffice''s Writer app ticks the part and in its most recent
    updates, there''s been some noticeable enhancements in its overall layout. Navigating
    between menus is a breeze, with all tools easily accessible. There''s a lot of
    help at hand if you get stuck, through the Wizards and AutoComplete features,
    but these are more tailored for new users.


    # Spreadsheet tools


    There''s some great behind-the-scenes algorithms in place within Libre''s Calc
    program, which make it the best of the bunch for formula creation. It does lack
    in its formatting options however, which can make sifting through large portions
    of data a little laborious. If you can look past the design faults, this is definitely
    one of the better spreadsheet programs around.


    # Presentation options


    Versatility is key when it comes to the presentation tools found within the Impress
    program. The choices of editing and view modes are particularly helpful when at
    different stages of creating your presentation, even if the switching process
    is a little slow. Transitions are another highlight here, with some options we''d
    love to see appear in PowerPoint.


    # Extra features


    There''s an extensive community behind LibreOffice and updates come in thick and
    fast, making it the perfect choice for those wanting the latest features. One
    of the biggest updates recently is the introduction of OpenGL, which has transformed
    the way transitions and menus work within your presentations. It''s certainly
    worth checking out.


    # Overall


    > While many competitors can keep up with LibreOffice''s suite of programs and
    features, it''s the community that has made it a real winner. Continuous updates
    and community discussion has forged a fantastic product


    9'
