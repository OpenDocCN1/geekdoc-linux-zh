  md: '# # Create an explorer pHAT robot


    # ## Part two: the build


    Build your explorer robot, soldering wires, connecting the tracks and setting
    up the Pi


    ![](img/628186dda7facdc011bf39c938de3975_75_0.png)


    **Alex Ellis**

    @alexellisuk is a senior software engineer at ADP, a Docker Captain and an enthusiast
    for all things Linux. He is never far from a Raspberry Pi and regularly posts
    tutorials on his blog.


    ![](img/628186dda7facdc011bf39c938de3975_75_1.png)


    In part one in the previous issue we read Wikipedia''s definition of a robot as
    a machine capable of carrying out a series of actions automatically (paraphrased).
    We then gave an overview of all the considerations you may have for your build:
    from the chassis to the motors to the sensors you may want to add for autonomous
    tasks. In this issue we invite you to join us as we build our own model robot.
    If you follow along, you should have everything to get you started especially
    if this is new territory for you.


    We are going to build your explorer robot from scratch running through each step
    needed including soldering and putting all the pieces in place. We start with
    looking at the full parts list, the chassis kit and the other non-robotic parts.
    We will solder header pins onto our explorer pHAT from Pimoroni, flash our SD
    card and run the initial setup to enable the pHAT.


    # **01** The full parts list


    In addition to the Pi Zero you will need:


    +   *   A Pimoroni explorer pHAT

    +   *   A Pololu Zumro Chassis kit (available at Pimoroni)

    +   *   2× micro-metal gear motors (available at Pimoroni)

    +   *   Cross-head screw driver

    +   *   Soldering iron, flux & solder

    +   *   3A 5~6V UBEC (from HobbyKing or eBay)


    If you are struggling to find a Pi Zero Head over to http://stockalert.alexellis.io/
    for a live stock count at three major outlets.


    # What you''ll need


    +   *   Article''s Github repository (https://github.com/alexellis/zumopii)

    +   *   Raspberry Pi Zero

    +   *   microSD Card

    +   *   All other kit is listed in step 1'
