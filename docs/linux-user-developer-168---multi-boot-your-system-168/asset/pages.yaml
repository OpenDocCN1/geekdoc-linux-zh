- pgno: 52
  md: '![](img/628186dda7facdc011bf39c938de3975_52_0.png)


    ![](img/628186dda7facdc011bf39c938de3975_52_1.png)


    The Go rule is that functions, variables, types etc that begin with an upper-case
    letter are public, whereas functions, variables, types that begin with with a
    lower-case letter are private – this is a simple rule that illustrates the simplicity
    that governs Go. This rule does not affect package names. So, you should understand
    now why the function for printing is called fmt.Printf() instead of fmt.printf().


    Please have in mind that the same rule applies to the various fields of a structure
    – lower-case fields are considered private; therefore they can only be used by
    the other members of the package.


    So, if you change the name of the Foo function of the simple package to foo and
    do the same in useSimple.go, then the go tool will generate the following error
    message:


    ```

    $ go build useSimple

    # useSimple

    srcUseSimple/useSimple.go:11: cannot refer to unexported name simple.foo

    srcUseSimple/useSimple.go:11: undefined: simple.foo

    ```


    It is now easy to understand that you cannot directly call the init() function
    of a package because it is private!


    # Making a package available to all users


    So far, you have seen how to make a package available to a single user. This section
    will show you how to install a package in a place where everyone on your Linux
    system can see and use it.


    The solution is simple and includes the use of the GOPATH environment variable.
    As long as you can use the path of a package in GOPATH, you''ll be able to use
    that package system-wide. The following commands show you a simple example using
    simple.go:


    ```

    $ echo $GOPATH

    /home/mitsouk/myGo:/home/mitsouk/docs/article/

    working/goPack_LU0168/code

    $ go run src/multiple/multiple.go

    # cwd: /home/mitsouk/myGo

    Calling simple.Bar: 8

    ```


    If you use a different GOPATH then the go tool will not be able to find the desired
    package for you, which means that it will generate a familiar error message:


    Across The ''go clean'' command lets you clean up your Go projects by removing
    unnecessary executable and object files


    Left As Go is an open source programming language, you can find the Go code of
    all Go standard packages on the internet


    # Where are standard Go packages stored?


    As Go is an open source programming language, you can find the source code of
    all standard Go packages on the internet. It is considered good practice to read
    good code, and the code of standard Go packages is no exception. Even if you are
    not considering writing something similar, you will get many ideas from reading
    the code of a standard Go package. You can find the Go code at: golang.org/ref
    or github.com/golang/go.


    Figure 8 shows a small part from the Go code of the fmt package.


    Additionally, you can find the code of the standard packages at /usr/lib/go/src/pkg.


    ```

    $ echo $GOPATH

    /home/mitsouk/myGo

    $ go build multiple

    src/multiple/multiple.go:5:2: cannot find package "simple" in any of:

    /usr/lib/go/src/pkg/simple (from $GOROOT)

    /home/mitsouk/myGo/src/simple (from $GOPATH)

    ```


    The contents of the multiple.go file can be seen in Figure 5.


    The order in which you put the various paths in GOPATH is significant because
    only the first match will be used. Therefore, if you have multiple Go packages
    with the same name, which is not recommended, only the first match of the package
    will be used. Please bear in mind that this can be the root of nasty bugs!


    So, this way you can let the users of a Linux machine use the same Go packages
    while each developer is allowed to develop their own packages.'
