    # **04**


    **Launch Linux for the first time**


    After you have extracted your image and installed the Terminal and optionally
    the VNC companion app, you are ready to launch!


    There are a couple of options for launching Linux \- you can either use the Complete
    Linux Installer app (see the Launch option on the side menu), or you can add a
    widget to your homescreen. Note that depending on the performance of your device,
    it can take a couple of minutes for the image to complete the first boot, so be
    patient!


    After your distribution is booted, you’ll be prompted to set the root password,
    and then you will be able to do as you wish with the chroot! Type `exit` to shut
    down (you should try to remember to do this, both for battery life reasons and
    to protect the integrity of your files).


    ![](img/628186dda7facdc011bf39c938de3975_36_1.png)


    The Complete Linux Installer app allows you to configure the resolution options
    for the VNC session \- you should ensure that they match the resolution of your
    device.


    # **05**


    **Installing additional apps in your chroot**


    Once you have your Linux chroot up and running, you’ll probably want to install
    additional apps (especially if you installed a small or core system image). As
    you will be logged in via the Terminal as root, you can do this in the normal
    way \- using your distribution’s package manager. Binaries will automatically
    be downloaded for your current architecture (ARM or x86), so everything should
    work exactly as it does on a ‘real’ Linux machine.


    > The Terminal application is used to connect to your chroot in a shell, while
    the VNC Viewer will allow you to connect to a GUI


    # **03**


    **Install the Linux image and companion apps**


    When you start the Linux distribution image download, you will be offered a number
    of options. ‘Large’, ‘Small’ and ‘Core’ image versions are available. The Large
    images include the core OS and a range of additional apps


    such as OpenOffice; the Small images include only basic additions such as a web
    browser and Java; the Core, as the name suggests, is just the OS itself.


    While the main image itself is downloading, it’s a good idea to download the suggested
    companion apps, too. The Terminal application is used to connect to your chroot
    in a shell, while the VNC Viewer will allow you to connect to a GUI.


    ![](img/628186dda7facdc011bf39c938de3975_36_2.png)


    ![](img/628186dda7facdc011bf39c938de3975_36_3.png)


    The distribution image is downloaded as a ZIP file, which needs to be extracted
    to the root of your internal or external SD card before Linux can be launched.
    When the download is complete, use an


    What you should avoid is updating your distribution using the built-in update
    tools \- this will almost certainly cause issues and prevent your system booting.
    Instead, if you want to be on the latest version, you will need to build your
    own custom image.


    If you install a lot of additional applications, you might encounter space issues.
    The easiest way to increase the space available is to make a new, larger, empty
    image and to copy the contents across from the old image (using `cp -rp` to preserve
    permissions).


    # **06**


    **Preparing your own image**


    Since you can’t update the Linux image that you are using on your Android device
    in the conventional way, if you want to be on the latest version of your chosen
    distribution,


    # **Integrating with Tasker**


    As well as manually launching your chroot from an OSK store, `linux-installer-app`
    or using the provided widget, you can automate your Linux install using Tasker.
    When you launch the chroot manually, take note of a command: it’s used and you
    can call this from a Tasker script. You could even then send additional commands:
    `cd /path/mydir` and `speed = useful_task`.'
