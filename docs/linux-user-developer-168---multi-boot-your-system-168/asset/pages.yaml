    \ which many boards simply don't offer. The IR receiver and ADC capabilities are\
    \ ideal for experimenting with new projects, while the 40- pin GPIO header enables\
    \ seamless connection between the board and other physical devices. It also bills\
    \ itself as the most effective 64-bit development board out there. The clue's\
    \ in the terminology – it can't compete with the $9 price tag of the CHIP, but\
    \ then the CHIP has half the processing power. However, the ODROID-C2's horsepower\
    \ is all on the performance side – to install a distro that isn't the out-of-the-box\
    \ Ubuntu 16.04 or Android 5.1 Lollipop, you'll need a microSD card or eMMC module.\n\
    \n# BEAGLEBONE BLACK\n\n£37/$55 · Beagleboard.org\n\n![](img/628186dda7facdc011bf39c938de3975_61_1.png)\n\
    \n> BEST FOR\n> \n> beginners\n\nSimplicity is key when it comes to the BeagleBone\
    \ Black, and everything from the initial setup process to attaching external devices\
    \ is all made as pain-free as possible. It boasts that you can go from zero to\
    \ Linux in under ten seconds and be developing on the board within five minutes.\
    \ Like the MinnowBoard MAX, the BeagleBone Black is a successor to the previous\
    \ model, and it has eschewed some features of the original while adding new ones\
    \ – notably HDMI video out, double the RAM and an improved processor that takes\
    \ it over the all-important 1GHz bar. It's also one of the better choices when\
    \ it comes to project creation, with a total of 92 connection points on hand for\
    \ your projects, which will appeal to both new and seasoned users. But if you're\
    \ stuck for ideas, there's a thriving development community behind BeagleBone,\
    \ which lists a wide number of beginner projects you can attempt."
