  md: '# Reviews


    +   81 Grouptest | 86 Dell XPS 13 9350 | 88 deepin 15.2 | 90 Free software


    ![](img/628186dda7facdc011bf39c938de3975_80_0.png)


    # GROUP TEST


    # Office suites


    With the latest Microsoft Office suite costing £59.99, how do these free alternatives
    stack up in terms of features and overall usability?


    ### OpenOffice

    It''s surprising Apache OpenOffice goes back a staggering 20 years, but in that
    time it''s managed to turn itself into one of the premier alternatives to the
    Microsoft Office suite. As well as the fairly standard Writer and Calc programs,
    it includes some impressive extras to boot. [http://bit.ly/297m8En](http://bit.ly/297m8En)


    ### LibreOffice

    When you think of free office suites, chances are that LibreOffice will be one
    of the first to spring to mind. Frequent updates and bug fixes have gained it
    a massive user base, but with so much stiff competition, is it still the premier
    office suite that users can download for free? [www.libreoffice.org/](www.libreoffice.org/)


    ### WPS Office

    WPS Office claims to have over 1.25 billion installs around the world and it''s
    by far the best office suite for mobile users. But how does it perform on desktops?
    All the basic functions and programs are present and it''s got one of the best
    behind-the-scenes communities around. [www.wps.com/](www.wps.com/)


    ### FreeOffice

    FreeOffice has undergone a big transformation in the past few years, and what
    was once quite a buggy suite of programs now keeps up with the best of them. It''s
    designed in a very similar way to Microsoft Office, so those moving from the MS
    suite will feel right at home with FreeOffice. [www.freeoffice.com/en/](www.freeoffice.com/en/)'
