- pgno: 63
  md: '# Adding gestures


    Adding gestures is done through the Skywriter HAT add-on board. The size of the
    device fits on the top of the Raspberry Pi via the 40-pin GPIO header, with the
    software then being installed with one command


    # Building the circuit


    The crux of the circuit built into the remote control consists of both a transmitter
    and receiver. The transmitter is built from an IR LED, which is controlled via
    a transistor and a GPIO pin


    # Crafting the enclosure


    Two wooden panels make up the enclosure for the gesture controller. Slots have
    been carved into various sections of the unit for power, USB and the IR LEDs.
    The two pieces are then joined with four small screws, before being finished with
    a thorough sanding


    # Preparing the Pi


    A Raspberry Pi 4+ model was used by Frederick, as it’s largely the same size as
    the Skywriter HAT. The Pi was then given a Raspbian Jessie image flashed onto
    a 8GB microSD card using ‘dd’


    ![](img/628186dda7facdc011bf39c938de3975_63_0.png)


    # Components list


    +   - Raspberry Pi+

    +   - Skywriter HAT

    +   - IR LED

    +   - Oscilloscope

    +   - Wooden enclosure

    +   - Transmitter

    +   - Receiver


    Right Before soldering the circuit on to the board, Frederick made a breadboard
    prototype and used an oscilloscope to verify the basic functionality


    Below Two carved wooden panels were used to build the enclosure of the remote,
    with four screws in place to help keep it together


    ![](img/628186dda7facdc011bf39c938de3975_63_1.png)


    ![](img/628186dda7facdc011bf39c938de3975_63_2.png)'
