    # SMART SOLDERING


    Good solder joints use the smallest amount of material possible to make a clean
    joint. A flux pen can be a good way to help solder take to two wires or metal
    tin faces. If you add too much solder then a ''solder sucker'' or desoldering
    braid can be used to remove excess material. We would also highly recommend you
    purchase a fire retardant mat.


    # 14 Connect the motors


    At this point our motors can be plugged into the explorer pHAT into the motor
    1 and motor 2 connections on the front of the explorer pHAT. You may find that
    some of your wires are too long; there should be no harm in cutting them down
    to the size and re-soldering them. We think that the best way to do this is through
    trial and error.


    # 15 Fire it up and set up Python


    Our robot will be programmed in Python, so flash Raspbian or Raspbian Lite to
    your SD card and boot up the Pi. Providing everything starts up correctly, configure
    the internet and then run PiMironi''s installation script for the explorer pHAT
    Python library.


    ```

    $\texttt{\$ curl -sS get.piimironi.com/explorerhat \| bash}

    \$\texttt{\$}

    ```


    Now check that the library can control the motors by running this Python code:


    ```

    ```

    import explororhat

    import time


    explorerhat.motor.one.forward()

    explorerhat.motor.two.forward()

    time.sleep(2)

    explorerhat.motor.one.stop()

    explorerhat.motor.two.stop()

    ```


    ```


    # 16 Ready for more?


    If you''re ready for more, then you should squeeze an eye out for part three,
    where we will install Bluetooth tooling and start to use a gamepad for manual
    control of our robot. We''ll be able to drive it around the living room or kitchen
    or even outdoors. If you''ve run into any issues with the Zumo chassis itself
    then head over to the PiMironi or Pololu support forum to ask questions.


    # 11 Check and tighten everything


    We have now installed the drive motors, both sets of wheels and tracks. We took
    the cover off the acrylic top plate and secured it with two sets of nuts and bolts.
    We have installed the battery contacts and cover. There are three pairs of wires:
    two sets for the left and right motors and two for the batteries.


    Install 4xAA batteries and touch together the battery wires with each of the motors,
    you should see each side turn. If not then go back and check all the solder joints.


    # 12 Preparing the explorer pHAT and zero


    If you have a Pi Zero without a header attached, then go ahead and solder a 40-pin
    male header making sure to use as little solder and flux as possible. Next mount
    the 40-pin female header that came with your explorer pHAT and solder each joint
    – we find that a peg or a piece of Blu-Tack can help make sure the header is attached
    squarely without pointing off at an angle. Now solder the single-row female pin
    header on the opposite side.


    # 13 Adding the UBEC


    The UBEC is a battery elimination circuit, it will make sure that 5v is supplied
    to the Raspberry Pi. The component comes with a female header for the output,
    you can plug this straight into the +ve and -ve connectors on the explorer pHAT.
    The input side is two wires which will need to be attached to the battery contacts
    with solder, twisting or non-conductive tape.


