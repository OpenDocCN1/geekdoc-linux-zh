  md: '# AT A GLANCE


    ![](img/628186dda7facdc011bf39c938de3975_62_0.png)


    | | CHIP | PANDA BOARD ES | micro: bit | UDOO NEO | SOLIDPC Q4 | MINNOW BOARD
    MAX | OMEGA | JAGUAR BOARD | OROID C2 | BEAGLEBONE BLACK |

    |---|---|---|---|---|---|---|---|---|---|---|

    | PROCESSOR | 1GHz | 1.2GHz | 18MHz | 1GHz + 200MHz | 1.04GHz | 1.33GHz | 400MHz
    | 1.83GHz | 2GHz | 1GHz |

    | RAM | 512MB | 1GB | 16kB | 512MB | Sold separately | 2GB | 64MB | 1GB | 2GB
    | 512MB |

    | STORAGE | 4GB | Via memory card | 256kB | Via memory card | Via memory card
    | 8MB | 16MB | 16GB | Via memory card | 4GB |

    | CONNECTIVITY | Micro-USB, USB 2.0, Bluetooth, Wi-Fi, composite video, mic in,
    audio out | Ethernet, Wi-Fi, Bluetooth 2.1, audio in/out, HDMI, DVI-D, USB 2.0
    | Bluetooth LE, Micro-USB | Micro-HDMI, LVDS, NTSC, PAL, USB 2.0, Micro-USB, USB,
    audio out | HDMI, USB 3.0, Ethernet, Wi-Fi, Bluetooth 4.0, DisplayPort | HDMI,
    USB 3.0, USB 2.0, SATA2, Ethernet, digital audio out | USB 2.0, Ethernet, Wi-Fi
    | USB 2.0, Ethernet, HDMI, audio out, mic in | USB 2.0, Ethernet, HDMI, IR receiver
    | USB 2.0, HDMI, Ethernet, McASP0 |

    | BEST FOR | Value | Developers | Kids | Large-scale projects | Quick deployment
    | Breakout boards | Internet of Things | x86 architecture | Raw power | Beginners
    |


    # VERDICT


    All of these boards have clear strengths that make each of them ideal for different
    kinds of maker projects. For getting kids involved in making and coding, the Micro:bit
    is perfect (especially considering that they''re likely to get their hands on
    one at school). For those moving their projects up a gear from the Raspberry Pi
    and the Micro:bit, the BeagleBone Black is simple to use but packed with GPIO
    pins, so it can power all kinds of projects. If it''s sheer power you''re looking
    for, though, consider the OROID-C2 for your best bet. The JaguarBoard, UDOO Neo,
    SolidPC Q4, MinnowBoard MAX and PandaBoard ES are all more specialist units, ideal
    for the development, prototyping and deployment of advanced projects – they''re
    great for those who have moved beyond the capabilities of the Raspberry Pi. But
    the big story here has to be the CHIP: it has great specs, great connectivity
    and an unbeatable price. It''s the best board for makers we''ve come across so
    far – but can it challenge the ever-popular Pi for market dominance?'
