- pgno: 32
  md: "let's do something more interesting: let's find out how many binaries in the\
    \ `/usr/bin` directory have the NX bit cleared. Thanks to the `execkstack` utility\
    \ and its `-q` flag, you can query an ELF binary for the presence of the NX bit.\n\
    \n```\n```\n$ find /usr/bin -exec execkstack -q {} \";\" 2>dev/\nnull|egrep --color=auto\
    \ \t'X'\nX \t/usr/bin/grub-mklayout\nX \t/usr/bin/grub-mkrelpath\nX \t/usr/bin/grub-mkimage\n\
    ...\n```\n\n```\n\n# ASLR and PIE\n\nAddress Space Layourt Randomization (ASLR)\
    \ is a protection mechanism introduced in Linux and other operating systems that\
    \ randomises the process memory space so that it is extremely difficult to find\
    \ the address of functions or gadgets that an attacker could use in order to exploit\
    \ a binary. Shared libraries are compiled with the `-fPIE` flag, allowing them\
    \ to make use of the ASLR protection automatically. However, binary `.text` segments\
    \ are not compiled with this protection unless they are built as Position Independent\
    \ Executable (PIE). Grab your favourite text editor once again and write this\
    \ code down:\n\n```\n```\n#include <stdio.h>\nvoid *getEIP () {\n\treturn __builtin_return_address(0)-0x5;\n\
    }\nint main(int argc, char** argv){\n\tprintf(\"EIP located at: %p\\n\",getEIP());\n\
    \treturn 0;\n}\n```\n\n```\n\nCompile the code and then start to execute it a\
    \ minimum of ten times (or more). You will get the same exact memory address for\
    \ EIPB each time.\n\n```\n```\n$ gcc -m32 aslr.c -o aslr\n$ . ./aslrr\nEIP located\
    \ at: 0x80483f8\n$ . ./aslrr\nEIP located at: 0x80483f8\n```\n\n```\n\nNow, let's\
    \ give it another try but this time setting the PIE protection on the `.text`\
    \ segment.\n\n```\n```\n$ gcc -m32 -fPIE -pie aslr.c -o aslr\n$ . ./aslrr\nEIP\
    \ located at: 0xff770d5c\n$ . ./aslrr\nEIP located at: 0xff77635c\n```\n\n```\n\
    \nOf course, if you do this with an ELF64 binary, the entropy will be greater\
    \ and therefore the ASLR will become more reliable. There are plenty of papers\
    \ exposing a way to bypass ASLR on 32 bit architectures using brute-force.\n\n\
    # Stack Canaries\n\nOne well-known method to inject alien code into an executable\
    \ is by means of corrupting its stack. Open your favourite ASCII editor and write\
    \ this code down:\n\n```\n```\n#include <stdio.h>\n#include <string.h>\nvoid vuln(char\
    \ *);\nint main (int argc, char **argv){\n\tprintf(\"Arg is: %s\\n\", *(argv+1));\n\
    \tvuln(*(argv+1));\n}\n\nvoid vuln(char *arg){\n\tchar buffer[10];\n\tstrcpy(buffer,\
    \ arg);\n}\n```\n\n```\n\nThis is a classic buffer-overflow vulnerable code. Compile\
    \ it the usual way and run it passing as many bytes as you need until you overflow\
    \ the buffer:\n\n```\n```\n$ gcc -m32 vuln.c -o vuln\n$ ./vuln AAAAAAAAAAAAAAAAAAAAAAA\n\
    Arg is: AAAAAAAAAAAAAAAA\nSegmentation fault\n```\n\n```\n\nNow, execute it inside\
    \ a `gdb` session until you get the `0x41414141` value for the EIP register. To\
    \ achieve this, just increase the total number of \"As\" passed to the vulnerable\
    \ program at each execution until you reach the desired value:\n\n```\n```\n$\
    \ gdb ./vuln\n(gdb) r AAAAAAAAAAAAAAAAAAAAAAA\nProgram received signal SIGSEGV,\
    \ Segmentation fault.\n0x41414141 in ?? ()\n```\n\n```\n\nIt is obvious that you\
    \ can control the return address by corrupting the stack. If you want to overwrite\
    \ the EIP register with, say, `0x54544432`, you can do it easily by altering the\
    \ last 4 bytes passed as an argument like this:\n\n```\n```\n(gdb) r \"perl -e\
    \ 'print \\\\x22 . \\\\x41\"\"\"\"\nProgram received signal SIGSEGV, Segmentation\
    \ fault.\n0x54544342 in ?? ()\n```\n\n```\n\nThe stack has been corrupted, that\
    \ is undeniable. Now, compile the previous code with the stack guard protector\
    \ to detect the corruption. The GNU C compiler offers this feature:\n\n```\n```\n\
    $ gcc -m32 -fstack-protector-all vuln.c -o vuln\n```\n\n```\n\n![](img/628186dda7facdc011bf39c938de3975_32_0.png)\n\
    \n> \"If you compile legacy code in a newer GNU/Linux distro, chances are that\
    \ it will be built without protections\""
