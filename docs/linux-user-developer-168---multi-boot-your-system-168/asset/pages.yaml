    The first thing is to check for CPU virtualisation support. Note that the processor
    on your system must support either Intel VT technology or AMD-V virtualisation
    support. The good thing with Ubuntu is that it has a command (namely **kvm-ok**)
    that you can use to test your CPU for virtualisation support. You can install
    and use this command in the following way.


