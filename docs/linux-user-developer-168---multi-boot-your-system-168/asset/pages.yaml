- pgno: 66
  md: "```\n```\nint ledPin = 13;\nvoid setup() {\n  pinMode(ledPin, OUTPUT);\n  Serial.begin(9600);\n\
    }\nvoid loop() {\n  if (Serial.available()) {\n    flash(Serial.read() - '0');\n\
    \  }\n  delay(1000);\n}\nvoid flash(int n) {\n  for (int i = 0; i < n; i++) {\n\
    \    digitalWrite(ledPin, HIGH);\n    delay(100);\n    digitalWrite(ledPin, LOW);\n\
    \    delay(100);\n  }\n}\n```\n```\n\nThen, you can send a count from your Python\
    \ code with something like:\n\n```\n```\nser.write('5')\n```\n```\n\nThis will\
    \ flash the LED 5 connected to pin 13 on your Arduino five times.\n\nOne missing\
    \ element on the Raspberry Pi is an analogue-to-digital (ADC) converter to take\
    \ a given voltage and turn it into a number that can be used in some piece of\
    \ control software. This is where attaching an Arduino can be extremely helpful,\
    \ as it has a 10-bit ADC converter included. The following code will read the\
    \ voltage on pin 3 and then send it out over the serial connection to the Raspberry\
    \ Pi.\n\n```\n```\nint analogPin = 3;\nint val = 0;\nvoid setup() {\n  Serial.begin(9600);\n\
    }\nvoid loop() {\n  val = analogRead(analogPin);\n  Serial.println(val);\n}\n\
    ```\n```\n\nThis maps the measured voltage to an integer between 0 and 1,023.\
    \ The minimum voltage is zero, while the maximum voltage can be set with the function\
    \ analogReference(). By default, the maximum is the power supplied to the board\
    \ (5 volts for 5V boards, or 3.3 volts for 3.3V boards). You can also use two\
    \ internally supplied reference voltages, one at 1.1 volts and a second at 2.56\
    \ volts. For special cases, you can supply an external reference voltage to the\
    \ AREF pin. You need to be sure that it is only between 0 volts and 5 volts.\n\
    \nGoing in the opposite direction, you can use the Arduino to supply an output\
    \ voltage. This is done by actually using a PWM (pulse width modulation) output\
    \ signal. The idea here is to actually send out a number of pulses with some duty\
    \ cycle that is on for some percentage of the time and off for the remainder of\
    \ the time. For example, if you have an LED connected to one of the pins, you\
    \ can light it at half brightness with the following code.\n\n```\n```\nint ledPin\
    \ = 9;\nvoid setup() {\n  pinMode(ledPin, OUTPUT);\n}\nvoid loop() {\n  analogWrite(ledPin,\
    \ 127);\n}\n```\n```\n\nThe second parameter to the analogWrite() function is\
    \ a value between 0 and 255, which defines the duty cycle (between 0% or fully\
    \ off to 100% (or fully on). This analog output signal stays on at the given duty\
    \ cycle until a new call to the analogWrite() function. By having your Raspberry\
    \ Pi write out values over the serial connection, it can then control the output\
    \ duty cycle by sending a simple integer.\n\nHopefully, this short article will\
    \ spark some ideas on how you can start combining multiple computing platforms\
    \ to expand the capabilities of your own projects. There is no reason to try to\
    \ find the one silver-bullet platform for your project when you can pick the sub-modules\
    \ that actually do their own individual jobs best and build up the complex behaviour\
    \ you need from these simpler parts.\n\n# # PyFirmata can help even more\n\nWhile\
    \ you can write your own code to run on the Arduino, there are several projects\
    \ that can be uploaded to it to make interacting a bit easier. One of these is\
    \ the Firmata project, which includes a Python module to help you talk to the\
    \ Arduino. The first step will be downloading the Firmata Arduino code and uploading\
    \ it to your Arduino, most easily done with a desktop computer. The code is available\
    \ at github.com/firmata/arduino. There are a few different versions available,\
    \ but for these examples you should upload the StandardFirmata sketch with the\
    \ Arduino IDE. There are client libraries available for many different programming\
    \ languages, including several for Python. The one we’ll look at using is pyFirmata.\
    \ You can install it from your Raspberry Pi with:\n\n```\n```\nsudo pip install\
    \ pyfirmata\n```\n```\n\nYou can now use Firmata to act as a sort of remote control\
    \ for the Arduino, where your Python code can get almost direct access to all\
    \ of the functionality available. To get started, import the pyFirmata module\
    \ and create a new Arduino object connected to the relevant serial port:\n\n```\n\
    ```\nimport pyfirmata\nboard = pyfirmata.Arduino('/dev/ttyUSB0')\n```\n```\n\n\
    You can now access digital I/O pins directly. For example, the following code\
    \ would write 1 to pin 10.\n\n```\n```\nboard.digital[10].write(1)\n```\n```\n\
    \nWhen you want to read from a pin, you have the possibility of overflowing input\
    \ buffers. To deal with this issue, you can create an iterator object and start\
    \ it before doing any reads, using code like that below.\n\n```\n```\nit = pyfirmata.util.Iterator(board)\n\
    it.start()\n```\n```\n\nYou can now get selected pins for either input or output.\
    \ The following code will get pin 4 for digital input and pin 12 for analogue\
    \ PWM output.\n\n```\n```\npin4 = board.get_pin('d:4:i')\npin12 = board.get_pin('a:12:p')\n\
    ```\n```\n\nYou can then read and write with these new pin objects with the related\
    \ methods:\n\n```\n```\nval = pin4.read()\npin12.write(100)\n```\n```\n\nWhen\
    \ you are done, don’t forget to reset any output pins back to 0 volts, and then\
    \ you can close down the connection with:\n\n```\n```\nboard.exit()\n```\n```"
  merge: -1
