  md: '![](img/628186dda7facdc011bf39c938de3975_27_0.png)


    # Tam Hanna

    Has been benevolently likened to the James Bond villain Dr Zorin. Said man’s handsomeness
    spawned a real-life contro systems company – a passion shared with yours truly.
    Let Tam be your guide to discipline in the Bash space.


    # Resources

    Workstation with Bash shell


    # Bash masterclass

    Take control

    of your Bash

    script''s execution

    Running scripts linearly is boring.

    Fortunately, Bash provides a set

    of structures that modify the

    execution sequence


    DOS-based Bash files have resulted in a spoilt generation of programmers: their
    largely linear execution entombed the perception of shell scripts as uninteresting
    simpletons.


    This could not be further from the truth: Bash provides script coders with a set
    of control structures that justly deserve a comparison with the ones found in
    programming languages such as JavaScript or C. When using them intelligently,
    scripts can be customised on the fly; manual rewrites are replaced by the analysis
    of the execution environment.


    Even more advanced possibilities are opened up by the usage of the input handling
    features of Bash. After having worked through the entirety of this tutorial, your
    scripts will be able to poll your user in order to get input from them. This allows
    you to increase the user-friendliness of your scripts even more – when done right,
    your scripts will even be able to reject invalid input on the fly, thereby keeping
    clumsy or technically uninitiated users safe.


    In short: it always pays out to learn more about Bash scripting. So – feel free
    to follow us down the rabbit hole of advanced Bashery – don’t worry, we’ve got
    your back...


    # Tutorial files

    available

    filesilo.co.uk'
