  md: '# Run a Linux chroot on Android


    Android is Linux-based and uses a Linux kernel, making it ideal for a chroot


    ![](img/628186dda7facdc011bf39c938de3975_35_0.png)


    +   **Paul O''Brien**

    +   Paul is a professional cross-platform software developer, with extensive experience
    of deploying and maintaining Linux systems. Android, built on top of Linux, is
    also one of Paul''s specialist topics.


    **Why would you want to run full Linux on your Android device?**

    That''s the question we''re often asked when we mention that we have a full Debian
    install accessible on our phone. Actually, it''s more useful than most might think
    (although, as a Linux user, you know better anyway). Being able to run up a full
    LAMP stack is handy, we can get quick and easy access to all our favourite Linux
    tools and even use the Linux build as an option for syncing content to and from
    the device with good old rsync.


    In order to be able to run Linux in a chroot environment on your Android device,
    there are a couple of prerequisites. First of all, you need to have root access
    on your device. This is no great surprise, as we''ll be integrating with the Android
    system at the lowest level. Second, you''ll need to be running a kernel with support
    for loop devices. If your kernel doesn''t have support, you have the option of
    compiling your own, provided your manufacturer has made source available. Finally,
    you''ll want plenty of storage and RAM. A microSD card will give you additional
    storage for your Linux chroot, but bear in mind that it is usually quite a lot
    slower than the internal memory, so you''ll be better served if you have a device
    with lots of space.


    **01 Ensure you have root access**

    The most important thing you need before you install a Linux chroot on your Android
    device is root access. Root gives you full access to your device''s system, and
    allows you to carry out fundamental functions needed to set up the chroot. Android
    devices don''t ship pre-rooted, so you''ll need to root your device before you
    can continue.


    The actual process varies per device, but it will typically involve unlocking
    the bootloader (via your device manufacturer''s website), flashing a custom recovery
    and finally flashing a rooting ZIP file known as SuperSU. Bear in mind that unlocking
    your bootloader will likely affect your warranty and having root access, just
    like on ''proper'' Linux, gives you a lot more potential to do bad things to your
    device. Proceed with caution!


    ![](img/628186dda7facdc011bf39c938de3975_35_1.png)


    After you have installed the SuperSU root binaries, install an application such
    as Root Checker from the Google Play Store to confirm everything is working correctly.
    When an application requests root access on Android, a dialog is displayed requesting
    confirmation — this ensures that applications on your system can''t use root access
    for nefarious purposes without your knowledge.


    **02 Download the Complete Linux Installer**

    The quickest and easiest way to get a Linux distribution onto your device is by
    using Complete Linux Installer from the Play Store. On first launch, the application
    will install the scripts and Busybox binary required to boot Linux. The application
    includes support for a range of distributions including Ubuntu,


    # Resources


    +   * SuperSU

    +     bit.ly/1fpnTbt

    +   * Root Checker

    +     bit.ly/192WqN

    +   * Complete Linux Installer

    +     bit.ly/282jnRw

    +   * Linux Deploy

    +     bit.ly/297WGf4

    +   * Ubuntu Touch

    +     wiki.ubuntu.com/

    +     /Touch/Devices


    ![](img/628186dda7facdc011bf39c938de3975_35_2.png)


    **Right** As well as terminal mode, you can even run a full Linux desktop on your
    Android device!'
