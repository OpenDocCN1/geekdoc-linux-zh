    # **Tutorial**  **Virtualisation**


    There are three software components that you need to add so that you can perform
    KVM virtualisation. They are:


    +   - **libvirt** – This provides an interface for the virtualisation software

    +   - **qemu** – This emulates PC hardware for the virtual machines

    +   - **bridge-utils** – This offers a way to bridge your networking from the
    virtual machines through the host


    You can then run the following **apt-get** commands so that the basic software
    that is needed for KVM virtualisation will be installed:


    > All you need to do to create a virtual machine is to pass the required options
    to the **virt-install** command


    ```

    `$ sudo apt-get install libvirt-bin kvm bridge-utils qemu-common qemu-kvm qemu-tui`

    ```


    In addition to the basic software needed for KVM virtualisation, you can also
    add a graphical interface for managing virtual machines. Use the following command
