    \nLinux 通过 lm-sensors 监控和报告工具，提供了对 PC 总线上众多传感器的便捷访问——许多通用监控工具都利用这些数据。Psensor 不仅显示数值，还提供了一个覆盖所选监控温度的非常实用的图表。\n\
