    # WPS Office


    Can a stellar design compensate for a minimal selection of features?


    ![](img/628186dda7facdc011bf39c938de3975_82_0.png)


    A unique Tabs feature is a helpful tool for managing multiple presentations simultaneously
    without too much fuss


    # Document creation


    At the heart of WPS'' Writer program are some great formatting features, enabling
    users to easily adjust the various elements on the page. However, the program
    as a whole is on the basic side, with it missing a number of key features that
    are pretty commonplace in most office suites. But it at least nails all the core
    features you''d expect.


    # Spreadsheet tools


    Out of all the office suites here, WPS'' Spreadsheets program is arguably the
    closest to Excel. It''s laid out very well, making it easy to find and use the
    various tools provided, with help on hand for some of its more advanced inclusions.
    We''d also say it''s one of the best programs around for chart creation, with
    some great editing tools on hand to help make them as precise as possible.


    # Presentation options


    It''s very much the same situation in the Presentation program as it is with Writer.
    While it''s cleverly designed to make it easy for users to find what they need,
    the program itself does the absolute basics. One handy extra is being able to
    use the Tabs feature to manage multiple presentations simultaneously, which in
    practice works wonders.


    # Extra features


    One of the key reasons that WPS Office has carved out a positive reputation is
    the compatibility it has with a wide range of distributions. No matter if you''re
    using Ubuntu, Fedora, CentOS, Mint or even Knoppix, you won''t find any slowdown
    or noticeable differences here.


    # Overall


    We''d go as far to say that WPS Office is the best looking of the bunch, but it
    lacks the spread of features we''ve seen in the competition. Only worth considering
    if you just need the absolute basics from your office suite


    6


    # FreeOffice


    An office built by the community, for the community


    ![](img/628186dda7facdc011bf39c938de3975_82_1.png)


    In each of FreeOffice''s programs options tend to be split well, as a helpful
    way to avoid overcrowding


    # Document creation


    Options are split well between two panels, which helps stops the overcrowding
    of many of the key tools. While there''s some helpful spacing tools provided,
    they''re poorly listed within the TextMaker program and new users may initially
    struggle to find the great benefits that they can bring to finished documents.


    # Spreadsheet tools


    Similar to the TextMaker program, the PlanMaker spreadsheet tool has a plethora
    of options, which are cleverly spread out. Basic formatting options are on hand
    to help stylist spreadsheets, but there''s little help when curating formulas,
    something that many of its competitors manage to do with success.


    # Presentation options


    Arguably the weakest program in the FreeOffice arsenal is its presentation program.
    Presentations, it does all the basics well enough, but it lacks the advanced features
    found in both LibreOffice and OpenOffice. Animations are available to help liven
    up slides, but do cause some noticeable stuttering in finished presentations.


    # Extra features


    While it may lack the extra programs that some of the competition offer, there''s
    some great expansions available through the FreeOffice site. Extensions to the
    TextMaker program are particularly good, giving users the options to expand on
    various chart and table creation options. Extensions can be enabled and disabled
    through each program with great ease, which is a benefit for new users.


    # Overall


    There''s nothing that really stands out within FreeOffice''s suite of programs,
    but it does boast an impressive expansion system that certainly adds some value
    to it


    7'
