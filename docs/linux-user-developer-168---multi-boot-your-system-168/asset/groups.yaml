    ## 制作一个探索者 pHAT 机器人

    ### 第二部分：构建

    搭建你的探索机器人，焊接导线，连接履带并为 Pi 设置环境


    ![](img/628186dda7facdc011bf39c938de3975_75_0.png)


    **Alex Ellis**

    @alexellisuk 是 ADP 的高级软件工程师，Docker 队长（Docker Captain），也是 Linux 各项事务的热情爱好者。他从不远离树莓派，并经常在他的博客上发布教程。


    ![](img/628186dda7facdc011bf39c938de3975_75_1.png)

    在上一期的第一部分中，我们阅读了维基百科对机器人的定义：一种能够自动执行一系列动作的机器（ paraphrased/意译）。随后我们概述了你在构建过程中可能需要考虑的所有事项：从底盘到电机，再到你可能为自主任务添加的传感器。在本期中，我们邀请你加入我们，一起构建我们自己的模型机器人。如果你跟着做，应该就能获得让你入门所需的一切，尤其是如果这是你的新领域的话。


    我们将从零开始构建你的探索机器人，逐步完成包括焊接和将所有部件就位在内的每个步骤。我们将首先查看完整的零件清单、底盘套件以及其他非机器人部件。我们将为来自
    Pimoroni 的探索者 pHAT 焊接排针，烧录 SD 卡并运行初始设置以启用 pHAT。


    ### **01** 完整零件清单

    除了 Pi Zero 之外，你还需要：

    - 一个 Pimoroni 探索者 pHAT

    - 一个 Pololu Zumro 底盘套件（可在 Pimoroni 购买）

    - 2 个微型金属齿轮电机（可在 Pimoroni 购买）

    - 十字螺丝刀

    - 电烙铁、助焊剂与焊锡

    - 3A 5~6V UBEC（来自 HobbyKing 或 eBay）


    如果你难以找到 Pi Zero，请访问 http://stockalert.alexellis.io/ 查看三家主要零售商的实时库存数量。


    ### 你需要什么

    - 文章的 Github 存储库 (https://github.com/alexellis/zumopii)

    - 树莓派 Zero

    - microSD 卡

    - 所有其他套件已在步骤 1 中列出


    ### 02 底盘套件

    底盘由三个主要部分组成——最大的部件是我们安装轮子和履带的位置，但它也容纳 4 节 AA 电池。它有一个电池盖，如果丢失或损坏，电池可能会掉落，因此请妥善保管。顶部有一个亚克力切割件，通过螺栓安装——请撕掉棕色的保护纸。


    ![](img/628186dda7facdc011bf39c938de3975_76_0.png)

    ![](img/628186dda7facdc011bf39c938de3975_76_1.png)

    ![](img/628186dda7facdc011bf39c938de3975_76_2.png)


    ### 03 轴和自由轮

    机器人有两个自由运行的轮子和两个由齿轮电机直接驱动的轮子。将两个金属轮毂插入塑料轮子中，然后安装到底盘上，拧紧两侧的螺栓。你可能会发现使用小型内六角或六方扳手在这里会有帮助，但不要将螺栓拧得过紧。两个轮子都应该能自由旋转，现在我们进入电机环节。


    [原文此处有断句或排版问题，根据上下文推断为] 安装后会变紧，当顶板拧紧时会更加牢固。你可以暂时将顶板放在电机上来帮助决定如何布线。我们使用了左右两侧的凹槽。


    ![](img/628186dda7facdc011bf39c938de3975_76_3.png)

    ![](img/628186dda7facdc011bf39c938de3975_76_4.png)


    ### 04 准备电机

    目前电机带有两个小的焊接焊盘——一个用于正极，一个用于负极。我们建议剪断两组白色和黑色（或红色和黑色）跳线的末端，使每根线留有一个公头杜邦（跳线式）端头。接下来，小心地从裸端剥去
    2–3mm 的线皮，并将其焊接到电机上的焊盘。一点助焊剂真的会有帮助，之后剪掉多余的导线。


    ### 06 固定顶板

    固定顶板可能有点繁琐。将机器人底盘放置好，使电池仓朝上。找到前两个螺栓和螺母，然后将螺母小心地放入电机旁边的插槽中，旋转直至其就位。现在你可以使用小型十字螺丝刀将其拧紧。


    ### 05 安装电机

    焊点冷却后，关闭电烙铁，将电机放置在底盘另一端的插槽中，使轴对准。它们具有摩擦...


    ### 07 焊接电池触点

    现在让我们开始查看电池触点。它们由五个独立部件组成，当我们第一次试图将它们组装在一起时，需要大量的试错。有一点...


    ### 08 插入电池触点

    我们发现正极和负极端子可能会移动，尤其是在没有插入电池时。你可能想在正极和负极端子后面放一点热熔胶或曲棍球杆胶带，以便它们在通过颠簸路段或插入新电池时保持原位。你会发现导线穿过仓室底部，现在我们总共有六组导线。


    ### 09 安装前轮

    我们现在将安装驱动履带的前轮组。找到轮子的浅侧并使其朝外，然后缓慢但坚定地按压塑料轮子，使其套在电机的轴上。尽量确保它们与我们在步骤 3 中安装的自由轮对齐。你可以用手转动电机，但不建议这样做——只需检查它们是否能自由转动而不摩擦塑料轮拱。


    ![](img/628186dda7facdc011bf39c938de3975_77_3.png)

    ![](img/628186dda7facdc011bf39c938de3975_77_4.png)


    ### 10 安装履带

    我们的机器人运行在两组橡胶履带上，其弹性足以拉伸覆盖前后两组轮子。将履带齿面向内，先将履带放在一个轮子上，然后非常小心地将其拉伸覆盖到另一侧。在继续之前，再找两个螺母和螺栓，将底盘的另一端（靠近电池端子处）固定好。你再次需要十字螺丝刀。


    ![](img/628186dda7facdc011bf39c938de3975_77_5.png)


    **零尺寸电机控制器**

    探索者 pHAT 是我们为 Pi Zero 最喜欢的电机控制器之一。拥有模拟输入和输出以及电机控制意味着它可以用于许多不同的目的。还有其他专为 Zero 设计的电机控制器板，来自
    4tronix、PiHut 和 PiBorg。PiBorg 的 ZeroBorg 曾是一个 Kickstarter 项目，现已向支持者发货。


    [/content]

