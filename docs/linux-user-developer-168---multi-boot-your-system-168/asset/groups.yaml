    \ `virsh` 命令的手册页。\n\n## Go 函数教程\n\n![](img/628186dda7facdc011bf39c938de3975_47_0.png)\n\
    \n**Mihalis Tsoukalos**\nMihalis Tsoukalos 是一名 UNIX 系统管理员、程序员（UNIX 和 iOS）、DBA（数据库管理员）以及数学家。他自\
    \ 1993 年以来一直在使用 Linux。你可以通过 @macteosouk（Twitter）以及他的网站 mtsoukalos.eu 联系他。\n\n\
    **资源**\n- 如 Emacs 或 vi 这样的文本编辑器\n- Go 编译器\n\n### 探索、创建和使用 Go 包\n\n学习如何开发和使用 Go\
    \ 包\n\n**本教程将讨论创建和使用 Go 包。**\n包为分组相关的函数和变量并将它们作为一组使用（而不是单个组件）提供了一种非常方便的方式。其他编程语言将包称为模块或库。包的主要目的是使软件的设计和实现更容易理解和维护。\n\
    \n请特别关注本教程，因为迟早你会需要创建和分发你自己的 Go 包。此外，确保你彻底理解关于 Go 环境变量的部分，因为正确使用它们会让你的生活更轻松。\n\
    \nGo 系列的下一个教程将讨论 Go 中的文件 I/O，所以请保持关注！\n\n### 关于 Go 包\n\n以下代码是经典的 \"Hello World!\"\
    \ 程序的 Go 版本：\n\n```go\npackage main\nimport \"fmt\"\nfunc main() {\n\tfmt.Println(\"\
    Hello, world!\")\n}\n```\n\n如你所见，它的第一行是 **package main**。简而言之，所有 Go 代码都必须以包的形式交付——如果你在一个名为\
    \ main 的包中发现了一个名为 main() 的函数，那么你就在处理一个可执行程序；否则，你就有了一个共享库。换句话说，自主 Go 程序和 Go 库的区别在于\
    \ main 包中是否存在 main() 函数，这也是可执行程序的入口点，就像 C 中的 main() 函数一样。\n\n被称为导入路径的单个字符串标识每个\
    \ Go 包。如你所见，导入路径也可以是指向互联网地址的 URL。记住这一点很重要：Go 语言的规范与导入路径的解释无关——这项工作留给 **go 工具**。\n\
    \nGo 包的源代码（可以包含多个文件）可以在一个以包名称命名的目录中找到，唯一的例外是 main 包，它可以有任何名称。\n\n### 标准 Go 包\n\
    \nGo 附带了大量的标准包，因此在创建你自己的包之前，请确保 Go 没有现有的包来执行你任务的全部或大部分。**图 1** 显示了标准 Go 包列表的一小部分，可在\
    \ **golang.org/pkg** 找到。\n两个非常流行的 Go 包是 **fmt** 和 **io**。标准 Go 库还包括 **math**，它提供\n\
    \n![](img/628186dda7facdc011bf39c938de3975_47_1.png)\n\n# The Go Programming Language\n\
    \n# The Go Programming Language\n\n- Packages\n  - Test\n  - Import\n  - Export\n\
    \  - Interface\n  - Documentation\n  - Build Tags\n  - Packages and other information\n\
    \n- Packages Go's Package\n  - Access\n  - Build\n  - Cgo\n  - Go\n  - Imports\n\
    \  - Interfaces\n  - Lint\n  - Names\n  - Package\n  - Versioning\n\n![](img/628186dda7facdc011bf39c938de3975_48_0.png)\n\
    \n左 你可以访问 [golang.org/pkg](https://golang.org/pkg) 查看标准 Go 包列表\n\n数学函数和常量；**net**，支持可移植的\
    \ TCP 和 UDP 连接；**http**，提供 HTTP 服务器和客户端实现；**url**，允许你轻松解析 URL；**os** 包，系统操作的可移植接口，以及\
    \ **syscall**，低级系统调用的接口。最后，**time** 包支持时间和日期操作，**crypto** 包用于加密操作，**compress**\
    \ 包实现常见的压缩算法。\n\n为了使用 **fmt** 包，你应该在程序中包含以下代码：\n\n```go\nimport \"fmt\"\n```\n\
