    \ 和 GPU 的费用会迅速累积。而且，大多数工作站仅仅添加几块硬盘并不难——本文是在一台拥有 16GB 内存的八核 AMD 怪兽机器上编写的，它托管着五块硬盘。\n\
    \n然而，多系统引导并不需要访问多块硬盘。本指南将带你完成一个称为分区的过程——它允许你将一个大硬盘分割成多个较小的分区，专门用于不同的操作系统。\n\n\
    ### 为什么要选择多系统引导？\n\n正如上文所述，想要进行双系统引导或三系统引导的原因有很多，这完全取决于你如何使用计算机以及你有多频繁地为不同任务使用不同环境。\n\
    \n一个常见原因是 Windows——无论我们对此感觉如何，我们中的许多人在日常生活中都需要它。这可能只是喜欢玩新游戏（并不总是支持 Linux），或者你是设计师，需要使用行业标准工具如\
    \ Photoshop 或 InDesign。如果你更喜欢，甚至可以安装 OS X 用于 Hackintosh 构建。\n\n进一步扩展双系统引导设置的一个关键原因是保护你的主发行版——那个包含大部分（如果不是全部）个人数据和媒体的发行版。有无数原因说明你可能想或需要定期使用不同的发行版，有时现场引导或虚拟化并不够用——在这种情况下，拥有一个第三个分区来安装你临时需要使用的发行版会非常方便。除了非\
    \ Linux 系统外，这可能类似于在主 Debian 发行版旁边拥有一个用于测试的 Mintoo 分区，以及一个用于尝试不同发行版的第三空间；这真的取决于你！\n\
    \n![](img/628186dda7facdc011bf39c938de3975_16_0.png)\n\n## 分区\n\n### 开始之前请备份\n\
    \n尽管重新分区通常是一个非常安全的操作，但在按照本指南中的任何步骤操作之前，进行备份很重要。电源故障、输入错误或臭名昭著的实验室助手绊到电源线等都可能导致几乎无法修复的问题，除非使用（昂贵的）数据修复实验室服务。\n\
    \n最安全的参与方式涉及使用外部硬盘。复制硬盘镜像，或复制重要文件的选择集，并且——这是至关重要的——将外部 HDD 从工作站断开连接。一些 IT 安全专业人士甚至建议购买多个外部硬盘，其中一个或多个存储在现场之外，并以轮询方式更新。在这张光盘和\
    \ FileSilo 这期中，你可以安装 BackupPC 以确保已备份所有数据。\n\n请注意，使用双系统或三系统引导（至少包含一个 Windows 分区）并不能完全防止勒索软件。像\
    \ Petya 这样的病毒已经展示了在 Windows 之外工作的能力——只是时间问题，恶意分子就会将其触角延伸到 EXT4 系统。\n\n### 图形化磁盘概览\n\
    \nGParted 提供了硬盘上分区分布的示意图。这很有趣，因为分区通常只能“向后”扩展——如果分区结构看起来无法恢复，重新开始可能是最佳选择。\n\n![](img/628186dda7facdc011bf39c938de3975_16_1.png)\n\
    \n-   **明智地选择文件系统**  \n    分区可以格式化为多种文件系统。如果分区打算用于不同的操作系统，原始 FAT32 通常是最佳选择。\n\n\
    -   **此空间为空**  \n    示例工作站的分区未完全使用。未分配的空间未被任何使用，应将其分配给分区以使其可用于文件存储。\n\n### 分区是如何工作的\n\
    \n最基本的安装——从 Windows 中众所周知——每块磁盘包含一个分区。具有服务器传统的操作系统期望多磁盘系统：将磁盘分配给特定任务是有效的，因为它减少了延迟影响并实际提供了更高的传输速度。\n\
    \n使用传统的 MBR 方案，硬盘最多可以划分为四个分区。其中一个是逻辑分区，包含额外的逻辑分区。\n\n### 如何处理分区\n\n管理员可以从大量的分区管理工具中进行选择：Windows\
    \ 附带了本专题后面描述的存储管理单元，而 Ubuntu 和 Debian 倾向于在光盘和 FileSilo 上使用 GParted。\n\n所有这些程序的行为相似。最重要的警告是，干扰分区结构可能是危险的——让经验不足的用户独自使用分区管理器是引发数据丢失的可靠方式。\n\
    \n## 掌握 GRUB 引导加载程序\n\n引导加载程序控制电源开启后的工作站——如果此处发生错误，操作系统将无能为力！\n\n电源开启后，工作站的 BIOS\
    \ 执行快速自检，并将控制权传递给一段称为引导加载程序的特殊代码。这就是负责将执行权传递给一个或多个实际上使工作站启动的操作系统字节流的部分。\n\n虽然\
    \ Linux 最初通过称为 LILO 的引导加载程序启动，但 GNU 项目的 GRUB 已成为大多数发行版的标准。它最初旨在引导 GNU 的 Hurd 操作系统——虽然该平台与\
    \ Duke Nukem 争夺“雾件”王座，但其组件此后已在其他各种 Unix 操作系统中重新使用。\n\n### 为什么选择 GRUB？\n\nGRUB\
    \ 与 LILO 相比有多种优势。首先，该加载程序不限于位于传统的 MBR 中——事实上，它完全放弃了传统的 MBR，转向更现代的系统初始化方式。此外，GRUB\
    \ 与 LILO 不同之处在于它理解文件系统的概念。这意味着引导加载程序可以分析被引导分区的内容——LILO 只是使用固定偏移量，如果其中一个偏移量发生变化就会失败。\n\
    \n![](img/628186dda7facdc011bf39c938de3975_17_0.png)\n\n另一个有趣的好处是可以从网络启动：理论上，Unix\
    \ 工作站可以通过 GRUB 支持的可访问局域网外围设备从服务器获取其操作系统。最后，GRUB 提供了显著更好的用户体验。该程序可以定制以显示自定义启动屏幕和启动选项。然而，即使是基本版本也比\
    \ LILO 更灵活——伴随此方框的两个屏幕截图展示了该程序的默认安装在三系统引导工作站上能为你做什么。\n\n### 美化 GRUB\n\n高级用户可能希望坚持手动自定义的说明，而平均的\
    \ GRUB 安装所有者则更适合使用自动安装程序。不幸的是，在撰写本文时，GRUB Customizer 并不是官方 Ubuntu 发行版的一部分。相反，必须从第三方\
    \ PPA 下载，而该 PPA 必须添加到 apt-get 仓库列表中。只需向终端逐条输入以下命令，并遵循屏幕上的说明：\n\n```bash\nsudo\
    \ add-apt-repository ppa:danielrichter2007/grub-customizer\nsudo apt-get update\n\
    sudo apt-get install grub-customizer\n```\n\n接下来，打开 Dash 并查找搜索字符串 \"GRUB Customizer\"\
    。启动程序会显示一个三项菜单：\n\n![](img/628186dda7facdc011bf39c938de3975_17_1.png)\n\n"
