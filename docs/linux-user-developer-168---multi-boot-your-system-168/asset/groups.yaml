    ## 功能


    ### 为你的机器实现多重启动


    #### Ubuntu 来救场


    出于各种原因，不建议将 Windows 作为日常生产力操作系统使用，其中之一就是加密勒索病毒。


    ![](img/628186dda7facdc011bf39c938de3975_21_0.png)


    Ubuntu 是一个极佳的日常操作系统。它通常是被用来向新用户介绍 Linux 的默认发行版。许多开发和企业产品最近都开始支持 Ubuntu，使其成为一个非常全面的发行版，而且安装起来也相对轻松。与
    Windows 相比，Linux 安装系统遭受勒索病毒的风险稍低（因为恶意软件作者倾向于专注于运行同质代码的大用户群），因此在日常 Linux 发行版上执行常规任务（如浏览网页、社交媒体等）可以增加一层薄但实用的额外安全保障。


    是否安装更新和第三方软件。启用图中显示的两个复选框——不下载第三方软件可能会在访问各种专有硬件时带来巨大的麻烦。此外，不部署更新会使获得支持变得更加困难，因为
    Ubuntu 不愿意协助使用未升级工作站的 用户。


    助手，并继续构建一个新的逻辑 EXT4 分区，挂载点为 /。如果你希望使用休眠功能或担心 RAM 不足，你还可以创建一个额外的交换分区，其大小至少要比工作站中安装的
    RAM 量大一点。最后，点击“现在安装”以开始实际的部署过程。


    ![](img/628186dda7facdc011bf39c938de3975_21_1.png)


    ![](img/628186dda7facdc011bf39c938de3975_21_2.png)


    ### 01 开始


    与 Windows 类似，Ubuntu 以 ISO 文件的形式提供，必须将其刻录到 USB 驱动器或 DVD 上（这也在本期杂志的光盘和 FileSilo
    上）。手头保留此安装介质是明智的，因为它可以用来进入 Ubuntu 的恢复模式，这一点将在教程稍后提到。


    下一步，从新创建的安装介质启动你的计算机。Ubuntu 在启动过程中会抛出一些错误信息——图中显示的对话框会让这一步变得复杂，可以花两分钟时间稍作休息。


    ### 02 承诺使用 Ubuntu


    Ubuntu 的安装介质允许你在不安装的情况下试用操作系统。通过点击“安装 Ubuntu”按钮可以开始安装过程，此后操作系统将要求你决定


    ### 03 选择你的毒


    Ubuntu 的安装过程包含一个专门用于创建包含 Windows 和 Ubuntu 的双重启动机器的选项。使用它会导致一个即插即用的系统，使用上述提到的 GRUB
    让你每次重启时都能选择操作系统。由于我们还希望为企业应用添加 CentOS，因此请选择最后一个选项，“其他”。接下来，点击“继续”按钮开始分析你的硬盘——完成后，下一步中显示的对话框将出现。


    ### 04 创建一些分区


    ![](img/628186dda7facdc011bf39c938de3975_21_3.png)


    NTFS 分区下方显示的免费空间正等待被你的 Ubuntu 系统的工作区域填充。点击加号以打开分区创建


    ### 05 执行表面设置


    点击“现在安装”命令后，Ubuntu 将自动开始将文件复制到目标分区。在此过程中，安装程序会询问你的位置、键盘设置以及你的密码和用户名组合。由于输入这些值通常可以很快完成，安装程序随后将带你参观
    Ubuntu 生态系统的各种有趣方面。在此期间，任何更新也将被下载。


    ![](img/628186dda7facdc011bf39c938de3975_21_4.png)


    ### 06 重启！


    从那一刻起，Ubuntu 原则上就准备就绪可以使用了。当显示重启提示时，请移除安装介质，因为如果带着安装介质，操作系统可能会让计算机重新开始。正确的重启序列将由出现接下来这一步旁边显示的
    GRUB 提示来指示。选择 Ubuntu 以进入你新安装的 Shuttleworth OS 版本。


    ## 缩小分区


    有笔记本电脑吗？没有额外的硬盘位？我们仍然为你提供了方案！


    为每个操作系统 dedicated 一块硬盘是最有效的方法。遗憾的是，工作站和笔记本电脑都可能打乱你的计划——大多数小于 17 英寸的笔记本电脑只有一个硬盘位，而对工作站进行修改可能变成一项烦人的工作。


    由于完全重新安装操作系统也很乏味，缩小分区大小成为一种有吸引力的替代方案。这一步是所有教程中风险最大的一步——请确保在此阶段执行备份。


    ### 为我排列


    移动分区往往会破坏引导加载程序。因此，我们通常通过从其后端切割部分来缩小它们——这个过程要求所有相关信息必须位于分区的开头。如果你的系统不是这种情况，请运行你选择的碎片整理实用工具。Windows
    10 自带图中所示的工具——可以通过在开始菜单中输入 Defrag 来打开它，并点击“优化”按钮使其进行清理。当然，在碎片整理过程之前删除（大型）文件是一种确保顺利方法，因为它为
    Defrag 提供了更多的操作空间。


    ### 缩小它！


    至此，是时候缩小问题分区的大小了。由于 NTFS 是微软的事务，使用来自红mond 的人提供的工具很可能是最佳解决方案。通过右键点击开始菜单，打开传统的控制面板，并将其更改为传统视图。接下来，点击“管理工具”并进入“计算机管理”实用工具。最后，打开存储/磁盘管理组件，右键点击当前用作
    Windows 主机的分区。然后，选择“压缩卷”以将其大小减少到更可管理的版本。


    ![](img/628186dda7facdc011bf39c938de3975_22_0.png)


    ## 安装 CentOS


    想部署企业软件？通过 CentOS 免费获得 Red Hat


    ### 01 安装介质


    与其他所有操作系统一样，CentOS 安装的生命始于下载 ISO 文件。然后必须将其刻录到 DVD 或 USB 驱动器上（你可以通过本期杂志的光盘获取最小版本），它最终将作为你选定的工作站启动介质。当提示时，使用上下键选择“安装
    CentOS 7”——安装介质的实时模式功能对本教程特别没有用。


    ### 02 选择语言和键盘


    CentOS 的安装过程明确面向专业人士。尽管用户界面在选择语言和键盘布局后倾向于快速更新，但访客最好等到“安装源”和“软件选择”旁边的彩色符号消失后再继续。解决了这个问题后，需要点击“安装目标”以进入下一步讨论的磁盘配置小部件。


    ### 03 对你的磁盘进行分区


    首先在“本地标准磁盘”选项卡中选择你希望使用的硬盘——在正常多重启动机器的设置过程中，网络驱动器不起作用。接下来，在“分区”选项卡中选择“我将配置分区”单选按钮——忘记这样做会导致问题和潜在的数据丢失。最后，点击屏幕左上角的大蓝色“完成”按钮以进入下一步。


    ### 04 设置目录结构


    将分区方案设置为标准分区。接下来，点击屏幕左侧列表中底部的加号按钮以创建新的挂载点。创建一个大小至少为 50 GB 的 `/` 挂载点——弹出对话框会接受诸如“50GB”之类的值，并自动将其转换为正确的字节长度。最后，点击两次“完成”以忽略由缺少交换分区产生的警告。按照屏幕上的指示操作，直到
    CentOS 成功安装。


    > 尽管 GParted 也可以处理 NTFS，但这最好是一个应避免的选项。Unix 中的所有 NTFS 驱动程序原则上都应始终被视为实验性的，并且永远不应允许写入包含重要数据的文件。


