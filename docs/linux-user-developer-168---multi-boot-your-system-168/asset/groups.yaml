    recovery-turbo.img |


    Note that production devices need an adb enabled recovery to work with ubuntu-device-flash,
    as discussed on askubuntu here.


    One of our favourite tricks in Linux Deploy is the ability to install Linux into
    RAM. Modern mobile devices have an ever-growing amount of memory, with the OnePlus
    3 recently shipping with an impressive 6GB of RAM. The downside of an install
    to RAM is that as all data is stored in memory, it is lost when the device is
    reset.


    Compared to installation on a microSD or internal storage, performance on a RAM
    install is predictably very good. The application starts quickly and the interface
    responds instantly. Installation is much faster too, taking only a few minutes.


    such as cellular connectivity; also, as a test-quality image, you should expect
    a lot of bugs!


    # 10  A no-root Linux alternative

    Throughout this guide we’ve talked about installing on your rooted device... but
    if you’re not rooted, there is an option, in the form of the ‘nroot’ builds downloadable
    from the Play Store. We’ve checked out ‘debian nroot’ by pelya and, as the name
    suggests, you can use it to boot a minimal Debian install, on a stock Android
    device.


    > The nroot implementation is made possible by the ‘proot’ project, which implements
    chroot, mount -bind and binfmt_misc in userspace


    # 09  Replacing Android completely with Linux

    Having Linux running alongside Android works surprisingly well, but it always
    feels like a bolted on additional operating system. If you want to run truly native
    Linux you have two options. The first is to buy a real Ubuntu phone or tablet
    (such as the BQ M10). However, if you happen to own a device that is used by Ubuntu
    for testing its ‘Touch’ images (such as the Nexus 4), then you can also flash
    Linux to it.


    Details can be found here on the Ubuntu website – wiki.ubuntu.com/Touch/Install.
    The process involves unlocking the bootloader on your device, downloading the
    Ubuntu images for your device and manually flashing them using Fastboot.


    Of course, the process will wipe your data and – if you want to return to Android
    in the future, you’ll need to download the stock factory images for your device
    and flash those. Note that if you do flash to native Linux, you may lose features


    Although it will work on a wider range of devices than the root option, there
    are some caveats. Right now, the app doesn’t play nicely with devices running
    Android Marshmallow. The other big thing to note is that the app can’t be installed
    to the SD card – you’ll need to have a device with a decent amount of internal
    storage.


    Those quibbles aside, though, the nroot implementation works well and, like the
    best Linux projects, is open source. The app is made possible by the ‘proot’ project,
    which implements chroot, mount -bind and binfmt_misc in userspace. You can read
    more details at github.com/proot-me/.


