    安装 4xAA 电池并让电池导线与每个电机接触，你应该看到每一侧转动。如果没有，请返回检查所有焊接点。


    ## 12 准备 explorer pHAT 和 Zero


    如果你的 Pi Zero 没有安装针座，请继续焊接 40 针公针座，并尽量使用最少的焊锡和助焊剂。接下来安装随你的 explorer pHAT 附带的 40
