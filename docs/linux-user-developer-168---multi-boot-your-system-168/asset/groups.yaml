    2GB 内存。为了检查你的电脑是 32 位还是 64 位，你可以检查 CPU 标志。


    $ sudo egrep lm /proc/cpuinfo


    ![](img/628186dda7facdc011bf39c938de3975_44_0.png)


    `lm` 标志代表长模式 (long mode)。如果存在此标志，则可以肯定该处理器是 64 位处理器。


    检查可用的 RAM 和磁盘空间。由于你将在一台物理计算机上运行多个操作系统，所需的 RAM 和磁盘空间量可能需要成倍增加。确保你有足够的内存来支持宿主机和你计划同时运行的所有虚拟机。你可以使用
