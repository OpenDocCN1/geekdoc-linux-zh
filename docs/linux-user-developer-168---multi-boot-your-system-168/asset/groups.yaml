    # 欢迎来到 *Linux 用户与开发者* 第 168 期


    ### 本期内容


    - 多启动你的系统

    - 精通虚拟化

    - 10 款创客最佳板卡

    - 在 Android 设备上运行 Linux


    ![](img/628186dda7facdc011bf39c938de3975_2_0.png)


    欢迎来到 *Linux 用户与开发者* 最新一期，这是英国和美国最喜爱的 Linux 和开源杂志。如果能运行你喜欢的任何操作系统或发行版，那不是很好吗？问题在于，承担相应硬件的费用可能有点困难——当然，除非你多启动你的机器。


    对硬盘进行分区允许你在同一台计算机上运行两个或更多发行版或操作系统。每一个都能充分利用系统资源，你只需重启开关即可在它们之间切换。在本期中，我们提供了多启动的完整指南，从备份数据和硬盘分区，到如何在同一机器上运行
    Windows 和 Linux，如何运行多个 Linux 发行版，以及如何配置、编辑甚至美化控制整个过程的 GRUB 引导加载器。请参阅第 16 页。


    本期我们还超越了树莓派，汇总了创客的十款最佳板卡。无论你是寻找让孩子对制作和编码感兴趣的最佳选择，还是寻找物联网项目、快速部署或 x86 架构的终极板卡，我们都有涵盖。请参阅第
    56 页，如果我们没有介绍你最喜欢的板卡，请务必通过下方的链接联系我们！


    April Madden, 编辑


