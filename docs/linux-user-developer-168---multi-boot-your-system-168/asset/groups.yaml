    \n# Tam Hanna\n曾被善意地比作詹姆斯·邦德反派佐林博士。这位先生的英俊外表催生了一家现实中的控制系统公司——这是作者你也曾分享的热情。让 Tam\
    \ 成为你在 Bash 领域追求纪律性的向导。\n\n### 资源\n- 装有 Bash  shell 的工作站\n\n## Bash 大师课\n\n掌控你的\
    \ Bash 脚本执行\n\n线性执行脚本很无聊。幸运的是，Bash 提供了一组可以修改执行序列的结构。\n\n基于 DOS 的 Bash 文件造就了一代被宠坏的程序员：他们线性为主的执行方式使\
    \ shell 脚本被视为无趣的简单程序。\n\n事实并非如此：Bash 为脚本编写者提供了一组控制结构，这些结构理应可与 JavaScript 或 C 等编程语言中的控制结构相提并论。当智能地使用这些结构时，脚本可以实时定制；通过分析执行环境，可以取代手动重写。\n\
    \n使用 Bash 的输入处理功能还开启了更高级的可能性。在完成本教程的全部内容后，你的脚本将能够轮询用户以获取输入。这可以进一步提高脚本的易用性——如果操作得当，你的脚本甚至能够实时拒绝无效输入，从而保护那些笨拙或对技术一无所知的用户安全。\n\
    \n简而言之：学习更多 Bash 脚本知识总是值得的。所以——请跟随我们深入高级 Bash 程序的兔子洞吧——别担心，我们会支持你...\n\n### 教程文件可下载\n\
    filesilo.co.uk\n\n![](img/628186dda7facdc011bf39c938de3975_28_0.png)\n\n![](img/628186dda7facdc011bf39c938de3975_28_1.png)\n\
    \n在上一个教程（第 166 期）结束时，我们的脚本已经能够询问用户要发送的邮件主题。让我们通过查看一个小例子来回顾一下：\n\n```bash\n#!/bin/bash\n\
    \necho \"Enter title!\"\n\nread emailTitle\necho $emailTitle\n```\n\n```bash\n\
    if [ $emailShorty == \"a\" ]; then\n\techo \"Alert, electronics head detected!\"\
    \n\temailTitle=\"Analogue electronics tutorial!\"\n\nelif [ $emailShorty == \"\
    g\" ]; then\n\temailTitle=\"Review of gadget\"\n\nelif [ $emailShorty == \"r\"\
    \ ]; then\n\temailTitle=\"Review of book\"\n\nelse\n\techo \"Error\"\n\texit\n\
    fi\n```\n\n在指定该文件为 Bash 脚本的 shebang（`#!/bin/bash`）之后，我们现在可以调用 `read` 命令从命令行获取数据。然后，它通过\
    \ `echo` 函数再次被输出。\n\nBash 要求必须存在 `if` 子句；`elif` 和 `else` 子句是可选的，但保持 shell 脚本更紧凑时很有用。\n\
    \n强制用户输入长文本是移动端的一个经典缺陷：在使用桌面应用程序时，为了可用性，仍应避免这种做法。改善程序行为的一种有效方法是引导用户达到他们的目标。\n\n\
    `if` 子句的实际语法非常实用。选择器用花括号括起来，并以分号终止；`then` 子句开始要执行的命令列表（如果匹配器命中）。\n\n> “脚本将能够实时拒绝无效输入，保护笨拙或对技术一无所知的用户安全”\n\
    \n```bash\n#!/bin/bash\n\necho \"Choose the material!\"\necho \"a...Analogue electronics\
    \ tutorial!\"\necho \"g...Review of gadget\"\necho \"r...Review of book!\"\n\n\
    read -n 1 emailShorty\n```\n\n然而，对于 unsuspecting 用户来说，还有一个小问题潜伏着。请注意，`[` 必须有一个尾部空格，而\
    \ `]` 需要一个头部空格——如果缺失，就会出现类似图中所示的错误。此外，`==` 运算符的左侧和右侧也需要空格。\n\n`read` 可以提供一个或多个参数来修改其行为。传入\
    \ `-n 1` 告知命令我们正在寻找单个字符——用户无需按回车键。请注意，这可能会导致控制台输出看起来很别扭——在 `read` 之后添加一个空的 `echo\
    \ \"\"` 可以修复此问题。\n\n### 简写表达式\n\n由于从特定集合收集输入是一个极其常见的操作，Bash 为其提供了一个简写表达式。它的使用可以简化我们的程序，如下所示：\n\
    \n```bash\necho \"Choose the material!\"\n\nselect emailTitle in \"a...Analogue\
    \ electronics tutorial!\" \"g...Review of gadget\" \"r...Review of book\"; do\n\
    \techo $emailTitle\n\tbreak\ndone\n```\n\n### 如果这样，那就那样！\n\n运行上述代码片段后，你会得到一个变量，其中——理想情况下——包含单个字符的输入。将其转换为可用的电子邮件标题需要使用一种通常被称为选择（selection）的结构。它的名字源于其根据变量改变程序执行的习惯。最原始的形式是\
    \ `if` 选择，可以这样部署：\n\n```bash\n...\nread -n 1 emailShorty\necho \"\"\n```\n\n你应该意识到\
    \ `break` 命令是强制性的；如果你忘记包含它，脚本将无限循环，这完全不是你想要的。通过 Ctrl + C 序列跳出此循环效果最佳，这将导致图中所示的结果。\n\
    \n"
