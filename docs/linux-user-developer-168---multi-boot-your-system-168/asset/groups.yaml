    # DISTRO

    ## Fedora 24 shows off three new editions

    The latest Fedora release is available for server, workstation and the cloud


    Despite not receiving the mainstream attention that Ubuntu gets, Fedora remains
    one of the most popular open source distributions out there for both developers
    and users. So it''s with much fanfare that Red Hat’s distribution has finally
    hit its 24th release. Fedora 24 predominantly keeps up the patterns of its previous
    releases, consisting of three base packages that combine to form three separate
    editions: Fedora 24 Server, Fedora 24 Workstation and Fedora 24 Cloud. Users can
    choose to download whichever one caters to their needs the best.


    One of the most pleasing aspects of Fedora 24 is that it''s based on the 4.5.7
    Linux kernel, with an emphasis on new tools for developers to get more from their
    Linux containers. Of course, you can expect a wave of enhancements and a couple
    of critical fixes to boot. The team has been quick to point out that isn’t the
    finished article and to expect incremental update to hit soon.


    > > “Fedora 24 Cloud has OpenShift Origin, an on-board cloud distribution, which
    has been heavily optimised for developing applications and managing containers”


    ![](img/628186dda7facdc011bf39c938de3975_7_0.png)


    There''s also a marked improvement for transitioning Linux into the cloud. Fedora
    24 Cloud now includes OpenShift Origin, an on-board cloud distribution, which
    has been heavily optimised for developing applications and managing containers.
    The Cloud edition has also been revamped to improve Docker integration, a problem
    that many were facing in previous updates.


    Server roles have consistently played a big part in the Server edition of Fedora,
    so we''re excited to see a deeper implementation of rolekit introduced into Fedora
    24 Server. For end users, this should make it considerably easier to set up server
    roles. Also included is a new identity management program, called FreeIPA 4.3.
    While for many it won''t be a household name, it’s a great tool for overall domain
    control, but certainly requires some advanced knowledge to use.


    Where the bulk of the changes have come into place, however, is through Fedora
    24 Workstation. The biggest of the bunch is the preview of Wayland, a unique X
    display server. Although it’s very much an early preview, it’s an exciting addition
    and one that Fedora plans to implement as its default graphics server in the future.
    GNOME users will also want to pay close attention to the inclusion of GNOME 3.20
    Delhi. Again, this is another preview, but the overall desktop environment has
    some noticeable tweaks and still boasts that ease-of-use we''ve come to expect.
    If GNOME isn''t for you, then there’s still a myriad of desktops to enjoy, including
    Cinnamon 2.6, MATE 1.14, KDE Plasma 5 and Xfce 4.12. On a smaller scale, eagle-eyed
    users will also notice some upgrades to Fedora’s Software app. There''s now the
    capability to perform a full system upgrade from the comfort of your desktop,
    as well as leave reviews on available software. It’s these little touches that
    make Fedora 24 one of the biggest updates yet.'
