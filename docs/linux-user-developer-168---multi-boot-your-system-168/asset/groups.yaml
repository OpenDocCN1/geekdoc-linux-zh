  - '[PAGE 5]


    # # On your free DVD this issue


    # ## Find a out what’s on your free disc


    Welcome to the **Linux User & Developer DVD.** This issue we’ll help you moblin
    boot your machine. Whether you want to combine Windows and Linux or several distros,
    we’ve got everything you need, including essential backup software, the best open
    source partitioning utility and a choice of distros. Follow the instructions to
    live boot or install your software and distros from the disc.


    # ## Featured software:


    ![](img/628186dda7facdc011bf39c938de3975_5_0.png)


    # ### Ubutntu 16.04


    The perfect everyday distro for all-round use, the latest version of Ubuntu offers
    unsuralled convergence across your desktop and mobile devices. This distro live
    boots from the disc.


    ![](img/628186dda7facdc011bf39c938de3975_5_1.png)


    # ### Arch Linux


    Want to explore a command-line interface on your Linux PC? Arch Linux offers you
    exactly that. It’s the perfect introduction to command-line computing as it aims
    to offer a lightweight and flexible distro that keeps things simple. This distro
    live boots from the disc.


    ![](img/628186dda7facdc011bf39c938de3975_5_2.png)


    # ### BackupPC


    It’s essential that you back up all data on your computer (including images of
    your current operating system) to optical media, network-attached storage or to
    an external HDD or SSD before you begin in the process of partitioning your PC’s
    hard drive and installing one or more distros. This highly-rated open source backup
    utility provides everything you need to ensure that your data is secure before
    you get started.


    ![](img/628186dda7facdc011bf39c938de3975_5_3.png)


    # ### GParted


    GParted is the ultimate partitioning utility for your Linux PC. Whether you want
    to combine Linux with Windows or max it up with an everyday Linux install plus
    a specialist distro, GParted allows you to partition your hard drive into sections.
    It also live boots from the disc so that you can easily partition your PC at any
    time.


    ![](img/628186dda7facdc011bf39c938de3975_5_4.png)


    # ### CentOS 7


    Get all the benefits of Red Hat for free with this community-driven open source
    ecosystem. Please note that due to CentOS’s ISO structure this distro does not
    live boot from the disc - follow the instructions for installation from the disc
    interface.


    ![](img/628186dda7facdc011bf39c938de3975_5_5.png)


    # ## Load DVD


    To access software and tutorial files, simply insert the disc into your computer
    and double-click the icon.


    # ## Live boot


    To live-boot into the distros supplied on this disc, insert the disc into your
    disc drive and reboot your computer.


    # ## Please note:


    +   - You will need to ensure that your computer is set up to boot from disc (press
    F9 on your computer’s BIOS screen to change Boot Options).

    +   - Some computers require you to press a key to enable booting from disc -
    check your manual or the manufacturer’s website to find out if this is the case
    on your PC.

    +   - Live-booting distros are read from the disc: they will not be installed
    permanently on your computer unless you choose to do so.


    # ## For best results:


    This disc has been optimised for modern browsers capable of rendering recent updates
    to the HTML and CSS standards. So to get the best experience we recommend you
    use:

    - Internet Explorer 8 or higher

    - Firefox 3 or higher

    - Safari 4 or higher

    - Chrome 5 or higher


    # ## Problems with the disc?


    Send us an email at **linuxuser@imagine-publishing.co.uk** Please note however
    that if you have had problems using the programs or resources provided, please
    contact the relevant software companies.'
