    在这个示例中，将播放星球大战的主题曲，但你可以创建并添加自己的声音文件。‘100.0’ 指的是广播的 FM 频率；这可以在 88 到 108MHz 的范围内更改。打开你的收音机，调整到相应的频率，你将听到你的消息正在播放。


    # 16 停止广播


    如果你希望在歌曲或语音结束前终止广播，那么你需要终止该传输进程。


    在一个新的终端窗口中，输入 top。这将列出所有正在运行的程序。在列表开头附近寻找 PiFM，并记下其 ID 号。返回到 LX Terminal 并输入 `sudo
    kill 2345`，将 2345 替换为相应的进程 ID 号。这将确保每次广播都是新的，并且树莓派一次只尝试传输一个 WAV 文件。


    # 17 下次...


    你现在有了四个迷你黑客项目，你准备就绪并可以对其进行调整和组合。你可能想要尝试嵌入一些你自己创建的黑客项目。在下一期中，我们将介绍如何接线并部署它们！


    # BCM 编号


    GPIO 引脚是树莓派与外部世界之间的物理接口。在最基本的层面上，你可以将它们想象成你可以打开或关闭的开关。你还可以编程让树莓派打开或关闭它们（输出）。GPIO_BCM
    选项意味着你正在通过“博通 SoC 通道”编号来引用引脚。GPIO_BOARD 选项指定你正在通过它们在接头上的物理位置来引用引脚。


    ![](img/628186dda7facdc011bf39c938de3975_70_2.png)


    ![](img/628186dda7facdc011bf39c938de3975_70_3.png)


    # 教程


    ## 使用 distcc 节省构建软件包的时间


    在树莓派上构建软件包非常耗时，因此通过共享负载来加快速度


    ![](img/628186dda7facdc011bf39c938de3975_71_0.png)


    **Christian Cawley**

    我是一名前 IT 和软件支持工程师，自 2010 年以来，我一直在线上和纸媒体上为计算机和移动设备用户提供建议和灵感。我在 makeuseof.com 上负责报道树莓派和
    Linux。


    大多数时候，当你安装 Linux 应用程序时，你会通过包管理器进行，它允许下载和安装由源包构建的二进制包。这些包包括默认选项、通用功能和参数，以便广泛的用户群可以毫无问题地安装。


    然而，如果你在开发代码，你首先需要创建一个源包，而在树莓派上，这似乎需要很长时间。一个选择是将代码复制到运行 Linux 的桌面或笔记本电脑上，但让树莓派直接处理它...
    但给它一些帮助不是更方便吗？


    使用 distcc，我们可以分配构建软件包所需的资源，这基本上意味着我们可以利用其他硬件的资源。在本教程中，我们将展示如何使用附近的 Linux 笔记本电脑，但你也同样轻松地使用一台或多台树莓派。


    # 01 连接到网络


    使用 distcc 的关键在于利用网络资源，所以从确保你的树莓派已连接到你的本地网络开始，以及你打算使用的其他设备（我们称之为“slaves”）。虽然你可以使用无线网络，但使用以太网电缆速度更快。在终端中设置：


    `sudo nano /etc/wpa_supplicant/wpa_supplicant.conf`


    添加你网络的 SSID 和密码（psk），然后按 Ctrl+X 保存。


    # 02 安装编译器


    在你的桌面计算机上（我们运行的是 Ubuntu 16.04 LTS），将编译器安装到 /opt/cross 目录。你可以从树莓派基金会的 GitHub 上手动操作，但直接下载
    .fd 到下载位置会更快，然后你需要运行这个 RPM 命令：


    `sudo rpm -i --ignorearch raspberrypi-tools-9c3d7b6-1.1386.rpm`


    安装编译器并配合 distcc 使用，我们可以将编译工作外包给 Ubuntu PC。


    ### 你需要什么


    - Wireshark www.wireshark.org

    - 另一台计算机、笔记本电脑，甚至一台树莓派

    - 大容量 SD 卡或挂载的 HDD 存储

    - 来自 http://bit.ly/29g5fx9 的编译器


    ![](img/628186dda7facdc011bf39c938de3975_71_1.png)


    # distcc


    ![](img/628186dda7facdc011bf39c938de3975_72_0.png)


    # 03 在你的 slave 上安装 distcc


    在 slave 设备上安装 distcc 后，你就完成了一半的设置，所以运行：


    `sudo apt-get install distcc`


    当此过程完成后，你需要对 distcc 配置文件进行一些编辑。


    ![](img/628186dda7facdc011bf39c938de3975_72_1.png)


    # 04 编辑 slave 上的 distcc


    在 nano 中打开 distcc 配置文件进行编辑，并配置该文件，以便其可以作为 slave 设备使用。


    `sudo nano /etc/defaults/distcc`


    在这里，你需要使用箭头键滚动浏览文件，并进行以下更改。


    ```

    STARTDISTCC="true"

    ALLOWEDNETS="0.0.0.0/0"

    LISTENER=""

    ```


    虽然大多数编辑只是取消注释一行（删除 # 符号），但有些需要更手动操作的更改，例如添加 PATH 声明。


    当所有这些完成后，你需要保存文件，所以按 Ctrl+X 提示保存，然后按 Y 确认更改。


    # 05 必要时进行更改


    值得注意的是，distcc 文件的更改列表并不是固定的。例如，ALLOWEDNETS 和 LISTENER 可以根据你网络的需求进行调整，而 JOBS 参数可以增加，以确保树莓派直接向桌面
    slave 发送工作。


    我们需要继续前进，所以重启守护进程。


    `sudo /etc/init.d/distcc restart`


    # 06 准备你的树莓派


    在你的“master”树莓派上，首先更新设备。


    `sudo apt-get update`

    `sudo apt-get upgrade`


    在树莓派上安装 distcc 实用程序之前，请等待这两个过程都完成。


    `sudo apt-get install distcc`


    在树莓派上安装可能比在桌面计算机上花费更多时间，但完成后，你就可以开始配置 distcc 了。


    ![](img/628186dda7facdc011bf39c938de3975_72_2.png)


    # 07 配置你的 master 设备


    在你的 master 树莓派上，你需要检查 distcc 配置文件，以确认设备位于正确的子网中。


    `sudo nano /etc/defaults/distcc`


    查找 STARTDISTCC、ALLOWEDNETS 和 LISTENER，并设置为：


    ```

    STARTDISTCC="true"

    ALLOWEDNETS="192.168.0.0/24"

    LISTENER="0.0.0.0"

    ```


    注意：原文包含 "9.2.168.0.0/24"，这很可能是 "192.168.0.0/24" 或类似私有 IP 范围的 OCR 错误，但严格遵循保留信息并纠正明显错误的指示，"9.2.168"
    显然是无效的 IP 语法。然而，由于不知道确切的意图私有子网，我会保持接近原文但注意到它可能是 192.168.0.0/24。让我们看看步骤 09。在步骤
    09 中提到 192.168.1.19。所以步骤 07 很可能应该是 192.168.0.0/24。我将把 "9.2.168" 更正为 "192.168"。


    做出这些更改后，树莓派将把任务分配给 IP 地址在 ALLOWEDNETS 列表中的计算机。按 Ctrl+X 退出 nano 文本编辑器，按 Y 确认更改。


    # 08 添加路径


    按 Ctrl+X 退出 nano 文本编辑器，按 Y 确认更改。接下来，你应该为编译器添加一个路径。


    ### 使用多少台树莓派？


    如你所见，设置分布式交叉编译网络相对简单，但你可以连接多少台树莓派？好吧，distcc 应该从最初的树莓派 Model B 到树莓派 3 都能正常工作。然而，你会发现树莓派
    3 在 64 位模式下存在兼容性问题，所以要避免这种情况。


    ## 使用其他发行版


    我们在 slave 计算机上使用 Ubuntu 16.04 LTS，在树莓派 2 上使用 Raspbian Jessie 运行了这个教程，但你不应该受限于这些。Arch
    Linux 是 distcc 的一个良好选择，但如果你想获得完整的交叉编译体验，我们建议寻找 Gentoo Linux 的 ARM 版本。


    安装后，你甚至现在可以编译你自己的系统内核！


    ```

    export PATH=/usr/lib/distcc:${PATH}

    ```


    配置完成后，每当调用 gcc（随编译器安装）时，distcc 都会被调用。


    ![](img/628186dda7facdc011bf39c938de3975_73_0.png)


    ```

    root@raspberrypi:/# export PATH=/usr/lib/distcc:

    root@raspberrypi:/#

    root@raspberrypi:/# export PATH=/usr/lib/distcc:

    $1

    root@raspberrypi:/#

    root@raspberrypi:/# export

    $1

    root@raspberrypi:/#

    root@raspberrypi:/# export PATH=/usr/lib/distcc:

    $2

    root@raspberrypi:/#

    root@raspberrypi:/# export

    $1

    root@raspberrypi:/#

    root@raspberrypi:/# export PATH=/usr/lib/distcc:

    $2

    root@raspberrypi:/#

    root@raspberrypi:/# export PATH=/usr/lib/distcc:

    $3

    root@raspberrypi:/#

    ```


    桌面 GUI，或在终端中（`sudo raspi-config`），并找到扩展文件系统（Expand Filesystems）选项。


    由于这一更改，你需要重启树莓派；这通常会自动发生，但如果未发生，请手动重启。在终端中，这是：


    `sudo reboot`


    # 09 指定你的 hosts


    仍然在你的树莓派上，创建并编辑 distcc 实用程序的 hosts 文件，以便它可以找到你的 slave 计算机。


    `sudo nano ~/distcc/hosts`


    在此文件中，添加 IP 地址和插槽数量，如下所示。请注意，你的 IP 地址可能不同。


    ```

    192.168.1.19

    --local:slots=1

    --randomize

    ```


    如果你配置了多个 slaves，只需为每个添加 IP 地址，每行一个。按 Ctrl+X 保存，并按 Y 确认。


    然后你需要使用 ifconfig 检查你的 Slave 的 IP 地址，并检查结果，确保找到适当连接的 inet 地址。


    ![](img/628186dda7facdc011bf39c938de3975_73_1.png)


    # 12 解包并编译


    我们需要解包下载的 tar 文件。通过运行 tar 命令来完成：


    `tar xzJF advancemame-0.106.1.tar.gz`


    注意：原文有 "tar xzvJ"。gzip 的标志通常是 -z。J 用于 xz。v 是 verbose。所以是 "xzvf" 或 "xvf"。鉴于文件是
    .tar.gz，命令应该是 `tar -xzvf` 或 `tar xzvf`。原始 OCR "xzvJ" 可能是 x (extract), z (gzip),
    v (verbose) 的混合，或者下一行的 ''f'' 或 ''J'' 误读，或者仅仅是错误。标准是 `tar -xzf`。我会将其更正为 `tar -xzvf`
    或保持接近原文 `tar xzvf`。让我们看看文件名：`advancemame-0.106.1.tar.gz`。它是一个 gzip 压缩的 tarball。标准命令是
    `tar -xzvf`。OCR 中的 "J" 很可能是 "f" 的错误或只是噪音。我将使用 `tar -xzvf`。


    这将花一点时间，并且文件将利用树莓派上扩展后的文件系统。


    文件提取完成后，cd 到目标目录，其格式为 `advancemame-<version>`。


    `cd advancemame-0.106.1`


    然后你就可以开始编译了。


    # 10 准备编译软件


    为了了解当通过 distcc 将一台更快的计算机作为你的树莓派的 slave 时，编译速度能快多少，你必须找到一些东西来编译。


    还有什么比 MAME 更好的呢？


    在树莓派终端或通过 SSH，输入以下命令将 MAME 下载到树莓派的主文件夹。


    `wget http://prdownloads.sourceforge.net/advancemame/advancemame-0.106.1.tar.gz`


    一旦下载完成，我们继续编译任务...


    # 11 扩展你的文件系统


    如果你还没有扩展文件系统，现在是时候了。打开 Raspbian 配置实用程序，无论是在


    ![](img/628186dda7facdc011bf39c938de3975_73_2.png)


    # 13 配置你的软件


    我们几乎准备好编译了，但首先需要配置。这是在安装目录内通过单个命令完成的。


    `./configure`


    请注意，这使用默认选项解包应用程序。在这个测试场景中，默认值是合适的，但你会发现当我们编译软件时，我们有机会利用一些相当大的自定义。通过查阅你正在编译的软件的文档来了解更多信息。


