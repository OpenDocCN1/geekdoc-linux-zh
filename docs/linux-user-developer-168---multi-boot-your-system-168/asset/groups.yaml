  md: "\n+   * Qcow2 – The interesting thing with this format is that it does not\
    \ immediately consume all space that is allocated, but instead grows as space\
    \ is needed\n+   * Other formats – The other formats supported by `qemu-img` include\
    \ `vdi`, `vmdk`, `vpc` etc. You can type `man qemu-img` at the command prompt\
    \ to learn more details about these image types:\n\n```\n$ sudo qemu-img create\
    \ -f qcow2 \\\n    -o preallocation=metadata /var/stuff/mine.qcow2 8G\n```\n\n\
    In the above example, note that `qemu-img` is creating a qcow2 image at `/var/stuff/mine.qcow2`.\
    \ We have allocated 8GB disk space for the image. The `preallocation=metadata`\
    \ option can be used to improve the performance of the image as it grows.\n\n\
    Once the qcow2 image is created, you can perform a consistency check on it by\
    \ using `qemu-img` with the check option as shown below:\n\n```\n$ sudo qemu-img\
    \ check /var/stuff/mine.qcow2\n```\n\nAt some point you may want to check the\
    \ amount of space being consumed by your virtual machine. This can be done by\
    \ using the `info` option with `qemu-img`. This is shown in the following command:\n\
    \n```\n$ sudo qemu-img info mine.qcow2\n```\n\n## virt-install\n\n`virt-install`\
    \ is a very powerful tool for creating new virtual machines. On the command line\
    \ you will be able to identify the various attributes of the virtual machine’s\
    \ environment. Take a close look at the manual page of this command.\n\n![](img/628186dda7facdc011bf39c938de3975_46_0.png)\n\
    \nThese are the various other options that you can use with the `virt-install`\
    \ command:\n\n| Option | Function |\n| :--- | :--- |\n| `--connect` | This option\
    \ identifies the location of the virtualisation service on the hypervisor. |\n\
    | `--name` | This represents the name of the virtual machine |\n| `--disk_path`\
    \ | This gives the details about the location of the disk image and its format\
    \ |\n| `--noautoclose` | This option prevents a console to the virtual machine\
    \ from being opened automatically |\n| `--keymap=en-us` | This sets the keyboard\
    \ language to US English |\n\nYou can also see the details about the other options\
    \ you can use with the `virt-install` command by referring to its man page. Once\
    \ the `virt-install` command starts, you will be able to open an application from\
    \ the desktop to see the progress of your installation. You can use the `virt-manager`\
    \ and `virt-viewer` commands to view your virtual machine console.\n\nOnce the\
    \ virtual machine is successfully installed, the next step is for you to use the\
    \ `virsh` command to manage the virtual machines.\n\nThe `virsh` command provides\
    \ a good way to manage your virtual machines. You can use the `virsh` command\
    \ to see what virtual machines are running and to start, stop and pause the virtual\
    \ machines.\n\n```\n$ virsh help\n```\n\nWith this, we can view the list of sub\
    \ commands to `virsh`.\n\n```\n$ virsh list\n```\n\nThis shows the currently running\
    \ virtual machines.\n\n```\n$ virsh version\n```\n\nThis gives the current version\
    \ information.\n\n```\n$ virsh hostname\n```\n\nThis displays the hostname of\
    \ the hypervisor.\n\n```\n$ virsh shutdown vm1\n```\n\nShutdown the virtual machine\
    \ `vm1`.\n\n```\n$ virsh destroy vm1\n```\n\nYou will then need to immediately\
    \ stop the specified virtual machines.\n\nPlease note that there are many more\
    \ options you can use with the `virsh` command so that you can effectively manage\
    \ your virtual machines. If you want to see more details on the other options,\
    \ please refer to the man page of the `virsh` command.\n\n## Tutorial Go functions\n\
