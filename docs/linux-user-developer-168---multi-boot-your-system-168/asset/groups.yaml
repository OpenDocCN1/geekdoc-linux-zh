    > “Fedora 24 Cloud 包含 OpenShift Origin，一个板载云发行版，针对应用程序开发和容器管理进行了深度优化”


    ![](img/628186dda7facdc011bf39c938de3975_7_0.png)


    Linux 向云端的过渡也有了显著改进。Fedora 24 Cloud 现在包含了 OpenShift Origin，一个板载云发行版，针对应用程序开发和容器管理进行了深度优化。云平台版本也已进行了翻新，以改善
    Docker 集成，这是许多用户在以前的更新中遇到的问题。


    服务器角色在 Fedora 的服务器版中一直占据重要地位，因此我们很高兴看到 rolekit 在 Fedora 24 服务器版中得到了更深入的实现。对于最终用户来说，这将使设置服务器角色变得更加容易。此外，还包含了一个新的身份管理程序，名为
    FreeIPA 4.3。虽然对很多人来说它可能不是一个家喻户晓的名字，但它是一个用于整体域控制的优秀工具，但使用它肯定需要一些高级知识。


    然而，大部分变更的发生地在于 Fedora 24 工作站版。其中最显著的是 Wayland 预览版，这是一种独特的 X 显示服务器。虽然它仍是一个早期预览版，但这是一个令人兴奋的添加，Fedora
    计划在未来将其实施为默认的图形服务器。GNOME 用户也将希望密切关注 GNOME 3.20 Delhi 的引入。同样，这也是另一个预览版，但整体桌面环境有一些明显的调整，并且仍然保持着我们习惯了的易用性。如果
    GNOME 不适合你，仍然有许多桌面环境可供选择，包括 Cinnamon 2.6、MATE 1.14、KDE Plasma 5 和 Xfce 4.12。在较小规模上，敏锐的用户还会注意到
    Fedora 软件应用的一些升级。现在你可以从桌面的舒适环境中执行完整的系统升级，并可在可用软件上留下评论。正是这些细节让 Fedora 24 成为迄今为止最大的更新之一。


    # 硬件


    # 索尼将因 Linux on PS3 风波向用户赔偿


    索尼将向受“其他操作系统”问题影响的数百万人支付赔偿


    PS3 最初发布时，其引人注目的功能之一是引入了“其他操作系统”（OtherOS）功能。当时，这在开源社区引起了不小的轰动。这一重大功能允许用户在机器上安装
    Linux，并访问其带来的所有额外功能。不幸的是，这个功能的生命周期相对较短，2009 年的一次软件更新实际上终止了该功能。虽然该更新并非强制性的，但在应用之前，它几乎禁用了
    PS3 的几个关键功能，阻止了 Linux 用户连接到 PlayStation Network 或在线玩游戏。


    很快提起了诉讼，起因是索尼对其游戏机上的第三方操作系统能力的声称。代表多达 1000 万名游戏机所有者的律师与索尼现在达成了一项协议，该协议将使索尼向消费者强制支付数百万美元的赔偿金。拟议的和解方案将允许曾使用
    Linux 的游戏玩家获得 55 美元，而购买 PS3 是为了使用“其他操作系统”功能，用户将获得 9 美元的赔偿。目前仍需美国联邦法官批准的和解方案，目前仅适用于
    2006 年 11 月 1 日至 2010 年 4 月 1 日期间购买了厚型 PS3 的美国居民；但裁决的影响范围可能会远远超出此范围。


    在诉讼期间，有人声称盗版是移除该功能的关键决策因素之一。索尼还补充说，其服务条款（游戏玩家在初始设置游戏机时同意）允许其移除其他操作系统功能，而且该功能并没有像公司最初想象的那样广泛使用。


    游戏玩家若要领取这 55 美元以及案件范围更广泛时的后续赔偿，必须提供购买证明、PlayStation 登录 ID，并提交使用“其他操作系统”功能的证明。索尼也同意使用其
    PlayStation Network 数据库通知所有可能受影响的人，并告知他们索赔和向该游戏机巨头寻求赔偿所需的步骤。


