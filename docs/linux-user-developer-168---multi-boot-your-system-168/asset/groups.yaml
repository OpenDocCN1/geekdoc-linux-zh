    \ `qemu-img` 配合 check 选项对其进行一致性检查，如下所示：\n\n```\n$ sudo qemu-img check /var/stuff/mine.qcow2\n\
    ```\n\n在某个时刻，你可能想检查一下你的虚拟机正在消耗多少空间。这可以通过使用 `qemu-img` 的 `info` 选项来完成。这在下述命令中显示：\n\
    \n```\n$ sudo qemu-img info mine.qcow2\n```\n\n## virt-install\n\n`virt-install`\
    \ 是一个功能非常强大的创建新虚拟机的工具。在命令行中，你可以识别虚拟机环境的各种属性。请仔细查看该命令的手册页。\n\n![](img/628186dda7facdc011bf39c938de3975_46_0.png)\n\
    \n这些是你可以使用 `virt-install` 命令的其他各种选项：\n\n| 选项 | 功能 |\n| :--- | :--- |\n| `--connect`\
    \ | 该选项识别虚拟化服务在 hypervisor（管理程序）上的位置。 |\n| `--name` | 这代表虚拟机的名称 |\n| `--disk_path`\
    \ | 这提供磁盘映像位置及其格式的详细信息 |\n| `--noautoclose` | 该选项防止自动打开到虚拟机的控制台 |\n| `--keymap=en-us`\
    \ | 这将键盘语言设置为美式英语 |\n\n你还可以通过参考其手册页来查看 `virt-install` 命令可用的其他选项的详细信息。一旦 `virt-install`\
    \ 命令启动，你就可以从桌面打开一个应用程序来查看安装进度。你可以使用 `virt-manager` 和 `virt-viewer` 命令来查看你的虚拟机控制台。\n\
    \n一旦虚拟机成功安装，下一步就是你使用 `virsh` 命令来管理虚拟机。\n\n`virsh` 命令提供了一种管理虚拟机的好方法。你可以使用 `virsh`\
    \ 命令查看哪些虚拟机正在运行，并启动、停止和暂停虚拟机。\n\n```\n$ virsh help\n```\n\n通过这，我们可以查看 `virsh`\
    \ 的子命令列表。\n\n```\n$ virsh list\n```\n\n这显示当前正在运行的虚拟机。\n\n```\n$ virsh version\n\
    ```\n\n这提供当前的版本信息。\n\n```\n$ virsh hostname\n```\n\n这显示 hypervisor 的主机名。\n\n```\n\
