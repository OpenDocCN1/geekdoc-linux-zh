    目录，如下所示：


    $ df -h /var/lib


    ## 虚拟机概览


    虚拟机可以被认为是一种创建虚拟计算机系统的计算机程序。这个虚拟计算机作为一个进程运行在你当前操作系统的一个窗口中。你可以在虚拟机内启动一个操作系统安装光盘（或
    Live CD），操作系统会被欺骗，以为它正在一台真实计算机上运行。它将像在真实的物理机器上一样进行安装和运行。每当你要使用该操作系统时，你可以打开虚拟机程序，并在当前桌面上的一个窗口中使用它。这里需要注意的是，虚拟机会带来一些开销，因此它们不会像将操作系统安装在真实硬件上那样快。


    > “虚拟机可以运行 Windows、Fedora、另一个 Linux 系统或几乎你想要的任何其他操作系统”


    ### 教程：虚拟化


    为了能够执行 KVM 虚拟化，你需要添加三个软件组件。它们是：


    - **libvirt** – 这为虚拟化软件提供接口

    - **qemu** – 这为虚拟机模拟 PC 硬件

    - **bridge-utils** – 这提供了一种通过宿主将虚拟机的网络进行网桥连接的方式


    然后你可以运行以下 **apt-get** 命令，这样 KVM 虚拟化所需的基本软件就会被安装：


    `$ sudo apt-get install libvirt-bin kvm bridge-utils qemu-common qemu-kvm qemu-tui`


    除了 KVM 虚拟化所需的基本软件外，你还可以添加一个用于管理虚拟机的图形界面。使用以下命令安装用于管理虚拟机的 **virt-manager** 图形软件：


    `$ sudo apt-get install virt-manager`


    当 virt-manager 安装完成后，我们可以选择从图形界面或命令行来管理我们的虚拟机。在下一步中，我们需要确保我们要用来管理虚拟化的用户账户已配置好相应权限。


    ![](img/628186dda7facdc011bf39c938de3975_45_0.png)


    如果你用来管理 KVM 的用户账户不是 libvirtd 组的成员，那么需要将该用户添加到该组中。例如，如果你想要用户账户 **james** 来管理虚拟化，那么你可以如下图所示将该用户添加到
    libvirtd 组：


    `$ sudo adduser james libvirtd`


    你可能需要重启系统，以确保所有必要的服务都在运行，并且你添加到 libvirt 组的用户账户已登录并准备就绪。


    虚拟机管理器 (**virt-manager**) 图形界面是一个管理 KVM 虚拟机的非常流行的工具。在使用诸如 **virt-install**（安装新的虚拟机）或
    **virt**（虚拟机）等任何命令之前，尝试一下 virt-manager 是个好主意。它可以用直观的方式引导你创建第一个虚拟机。开始使用 virt-manager
    之前需要关注的几件事是 ISO 镜像 – 你需要下载你想要安装或作为虚拟机运行的操作系统的 ISO 镜像，以及启动 **virt-manager** – 你可以作为已添加到
    KVM 组的用户从命令行运行 **virt-manager**。你应该能够看到虚拟机管理器窗口。


    管理虚拟机的另一种有用方式是通过命令。你可能需要命令来管理虚拟机的原因有很多种 – 最重要的原因可能是你想运行命令从 shell 脚本中与虚拟机交互。要开始，你可以使用
    **virt-manager** 命令来安装虚拟机。使用 **virt-clone**，你可以克隆现有的虚拟镜像。对于管理虚拟机，你可以使用 **virsh**
    命令。virsh 命令将列出关于虚拟机的信息，并有助于虚拟机的启动、停止和重启。


    创建虚拟机你所需要做的就是把所需的选项传递给 **virt-install** 命令。注意，在你使用 **virt-install** 之前，你需要创建一个存储镜像，这可以通过使用
    **qemu-img** 命令来完成。使用 **qemu-img** 命令，你可以创建虚拟机可作为其存储介质使用的镜像文件。注意，对于安装器来说，这些镜像看起来像普通的硬盘。让我们快速看一下支持的镜像格式。


    - **Raw** – 这是 **qemu-img** 的默认镜像类型。它是最简单的镜像类型，通常用于我们需要将镜像导出到其他虚拟环境时


    ### 虚拟机程序


    有多种虚拟机程序供你选择。最流行的是 VirtualBox 和 VMware Player。**VirtualBox** 被广泛使用，因为它是开源且完全免费的。你也可以在
    Linux 上使用 **VMware Player** 作为免费且基础的虚拟机工具。最佳实践是先尝试 **VirtualBox**，如果它没有正常工作，你可以尝试
    VMware Player。


