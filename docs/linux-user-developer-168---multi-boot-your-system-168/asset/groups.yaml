  mdcn: "\n\n# 树莓派改装玩具：第一部分\n\n> 学习如何掌握四个简单的改装技巧，并将它们嵌入到玩具中\n\n![](img/628186dda7facdc011bf39c938de3975_67_0.png)\n\
    \n### 关于作者\n\n**Dan Aldred**\n\nDan 是树莓派认证教育者，也是 CAS 的校级指导教师。他对制作项目充满热情，并利用像这样的项目来激发他所教授学生的兴趣。他带领的团队赢得了\
    \ Astro Pi 中学竞赛，他的学生的代码目前正在国际空间站上运行。最近，他出现在 QFC 的“启发式教师”电视广告中。\n\n结合旧玩具和树莓派，你可以嵌入一组组件，创建一个能响应用户输入增强型玩具。例如，取一个\
    \ R2-D2 糖果分发器，点亮它，播放音乐，并将实时网络馈送流式传输到你的移动设备。\n\n这个两部分教程的第一部分介绍了四个基本功能的设置：一个作为眼睛的\
    \ LED，一个模拟电击的触觉电机，一个隐藏摄像头的网络摄像头流，以及广播到收音机的星球大战主题曲。你可以选择将这些功能与你自己的改装相结合，或者将它们作为独立功能用于其他项目中。不要觉得只能使用星球大战玩具——我们选择\
    \ R2D2 模型是因为它便宜、易得且受欢迎，但你可以尝试的玩具没有上限。可拆卸的和/或具有支架或空腔以容纳电子元件的动作人偶，以及毛绒或抱枕玩具，都非常适合这类创客项目，特别是如果它们配有可识别的音乐或你让它们广播的影视音效。下一期的第二部分将介绍如何设置玩具并配置触发器以启动功能。\n\
    \n## 01 设置 LED\n\nLED 的设置和控制非常简单。它们是你玩具的一个很好的补充，可以用作眼睛、闪烁按钮或，在这个例子中，R2-D2 的雷达眼睛。拿起你的\
    \ LED，握住最长的腿；这是正极臂，连接到输入端。将电阻器绕在腿上并连接到一个母对母跳线杜邦线上。现在拿起负极臂并将它连接到另一根跳线上。\n\n## 02\
    \ 连接 LED\n\n将带电阻的正极线连接到 GPIO 17，这是物理引脚编号 11（看最左上角的引脚，向下数六个引脚）。此引脚将提供为 LED 供电的电流。将另一根线连接到任意接地引脚，(GND)\
    \ 6, 9, 14, 20, 39；当你为其他组件添加更多线缆时，可能需要稍后调整此位置。\n\n## 03 点亮 LED\n\n要打开和关闭 LED，请使用\
    \ gpiozero 库，该库旨在简化代码与物理计算机之间的交互。打开 LX 终端并输入\n\n```bash\nsudo apt-get install\
    \ python3-gpiozero\n```\n\n以安装该库（如果你想使用 Python 2，请去掉“3”）。安装完成后，打开一个新的 Python 窗口并导入\
    \ LED 模块（以下代码的第 2 行）。分配 LED 的引脚号（第 3 行），最后打开和关闭它（第 6 和 8 行）。保存你的代码并运行它以使 LED 闪烁。根据你的项目调整计时。\n\
    \n```python\nimport time\nfrom gpiozero import LED\nled = LED(17)\nled.off()\n\
    ```\n\n```python\nwhile True:\n    led.on()\n    time.sleep(0.5)\n    led.off()\n\
    \    time.sleep(0.5)\n```\n\n### 你需要什么\n\n- 一个旧/新玩具\n- 电阻器\n- 小型盘形电机\n- LED\n\
    - 收音机\n- 小型网络摄像头\n- 母对母跳线杜邦线\n\n![](img/628186dda7facdc011bf39c938de3975_67_1.png)\n\
    \n## 04 添加振动\n\n你可能希望玩具在被触碰时振动或摇晃。R2-D2 以发出电击而闻名，模拟这种效果的.safe方法是添加触觉反馈，类似于你在手机屏幕上按键时的那种。Pimoroni\
    \ 有合适的盘形电机库存（bit.ly/29hEla），它可以提供短促的振动。拿起每根线并将它们分别连接到一个母对母跳线上。\n\n![](img/628186dda7facdc011bf39c938de3975_68_0.png)\n\
    \n## 05 连接盘形电机\n\n从电机中取出正极线（通常为红色）并将其连接到 GPIO 引脚 9；这是物理引脚编号 21。黑线连接到接地引脚 - 最近的是物理引脚\
    \ 25，从引脚 21，在左侧向下两个引脚，这就是编号 25。开始一个新程序或将代码添加到你的现有程序中。导入 RPi.GPIO 库（第 1 行）并将主板设置为\
    \ BCM 设置。这确保了使用 GPIO 编号系统。\n\n```python\nimport RPi.GPIO as GPIO\nGPIO.setmode(GPIO.BCM)\n\
    import time\n```\n\n## 06 打开电机\n\n要启用电机，首先设置输出引脚，编号 9。这告诉程序 GPIO 引脚 9 是输出。接下来，将\
    \ GPIO 引脚设置为“HIGH”（高电平）（第 2 行），这等同于打开。电流流过，你的电机将打开。在将输出设置为 LOW（低电平）以关闭电机之前，添加一个短暂的暂停（第\
    \ 3 行）。调整计时以找到适合你需求的完美暂停时间。\n\n```python\nGPIO.setup(9, GPIO.OUT)\nGPIO.output(9,\
    \ GPIO.HIGH)\ntime.sleep(5)\nGPIO.output(9, GPIO.LOW)\n```\n\n## 07 改装网络摄像头\n\n\
    小型网络摄像头可以隐藏在玩具内部作为眼睛，或者更隐蔽地隐藏在玩具机身内。这可以用于拍照或将实时馈送流式传输到笔记本电脑或移动设备。拿起你的网络摄像头，小心地剥去塑料外壳，直到只剩下主板和镜头。根据你的玩具大小，调整外壳使其合适并可隐藏。\n\
    \n![](img/628186dda7facdc011bf39c938de3975_68_1.png)\n\n### R2-D2 在行动\n\n查看完成的\
    \ R2-D2 玩具改装视频，观看功能演示。这可能会给你带来一些关于你自己玩具改装的想法。youtube.br/VroUsAjSsy\n\n![](img/628186dda7facdc011bf39c938de3975_68_2.png)\n\
    \n![](img/628186dda7facdc011bf39c938de3975_68_3.png)\n\n## 08 设置静态 IP 地址\n\n每次你连接到互联网时，你的树莓派都会被分配一个新的\
    \ IP 地址；这被称为动态 IP 地址。这可能会引起问题，因为当它改变时，其他设备将无法再找到你的树莓派。为了创建一个保持不变的（静态 IP 地址），加载\
    \ LX 终端，输入 `ifconfig` 并记下 `inet addr`、`Broadcast` 和 `Mask` 数字。然后输入 `route -n`\
    \ 并记下 `Gateway` 地址。现在输入 `sudo nano /etc/network/interfaces`，找到 `iface wlan0 inet\
    \ dhcp` 行并将其更改为：\n\n```bash\niface wlan0 inet static\naddress 192.168.1.5\nnetmask\
    \ 255.255.255.0\ngateway 192.168.1.1\nnetwork 192.168.1.0\nbroadcast 192.168.1.255\n\
    ```\n\n用你记下的数字替换这些数字。同时按 CTRL+X 保存并退出 nano 文本编辑器。当你重启树莓派时，它将拥有一个静态 IP 地址，在重启或重新连接时不会改变。\n\
    \n## 09 安装 Web 服务器\n\n要设置 Web 服务器，打开 LX 终端并通过输入 `sudo apt-get update`、`sudo apt-get\
    \ upgrade` 来更新你的树莓派。接下来，安装控制网络摄像头的 Motion 软件：输入 `sudo apt-get install motion`。完成后，连接你的\
    \ USB 网络摄像头并输入 `lsusb`，你将看到你的网络摄像头已被识别。\n\n![](img/628186dda7facdc011bf39c938de3975_68_4.png)\n\
    \n![](img/628186dda7facdc011bf39c938de3975_69_0.png)\n\n## 10 配置软件 – 第 1 部分\n\n\
    现在有七种配置需要更改，以获得最合适的摄像头输出。你可以尝试这些设置，看看哪种产生最好的结果。在 LX 终端中，输入：\n\n```bash\nsudo nano\
    \ /etc/motion/motion.conf\n```\n\n...以加载配置文件。找到 *daemon* 行（你可以通过按 CTRL+W 来查找行，这会加载关键字搜索）并确保设置为\
    \ ON；这将在你启动树莓派时作为服务启动 Motion。接下来，找到 *webcam_localhost* 并将其设置为 OFF，这样你就可以从其他计算机和设备访问\
    \ motion。\n\n![](img/628186dda7facdc011bf39c938de3975_69_1.png)\n\n## 11 配置软件\
    \ – 第 2 部分\n\n接下来，找到 *stream_port*，它被设置为 8080。这是视频的端口，如果你在查看馈送时遇到问题，可以更改它；8081\
    \ 提供稳定的馈送。然后，找到 *control_localhost* 行并将其设置为 OFF。你访问 Web 配置界面的端口位于 *control_port*\
    \ 行，默认值是 8080；同样，如果你有任何流媒体问题，可以更改它。帧率是网络摄像头每秒捕获的帧数。帧率越高，质量越好，但将其设置为高于 6fps 会降低树莓派的性能并产生延迟。最后，设置\
    \ *photo_capture* 并指定在检测到运动后要捕获的帧数。\n\n## 12 将 Motion 作为守护进程运行\n\n守护进程是在后台运行并提供服务的程序；在这个项目中，你想运行\
    \ Motion。你不想每次加载树莓派时都手动启动它；最好在启动时自动启动。在 LX 终端中，输入 `sudo nano /etc/default/motion`\
    \ 以编辑该文件。要将 Motion 设置为从启动时作为服务运行，你需要将 *start_motion_daemon* 更改为 Yes：\n\n```bash\n\
    start_motion_daemon=yes\n```\n\n使用 CTRL+X 保存并退出文件，然后重启你的树莓派。\n\n![](img/628186dda7facdc011bf39c938de3975_69_2.png)\n\
    \n## 13 启动 Web 馈送\n\n在查看馈送之前，记下你的 IP 地址。在 LX 终端中，输入 `sudo ifconfig`，尽管你已经在第 8\
    \ 步中设置了它。然后通过输入 `sudo service motion start` 来启动 Motion。等待几秒钟让它初始化，然后在你的设备上打开一个浏览器窗口。输入你树莓派的\
    \ IP 地址，包括你在第 11 步中设置的端口号。如果你使用的是 VLC 播放器，转到 *File/Open Network* 并输入你的树莓派 IP 地址，后跟\
    \ *stream_port* – 例如，192.168.1.50:8080。此示例中的端口号是 8080，但你在第 11 步中将其设置为 8081 或你选择的另一个值。\n\
    \n## 14 安装 PiRadio 软件\n\nPiFM 是一个很好的小库，它可以使你的树莓派向收音机广播。请注意，这仅用于实验，如果你想要公开广播，你必须获得适当的许可证。设置很简单：加载\
    \ LX 终端并创建一个新目录以将文件提取到其中：\n\n```bash\nmkdir PiFM\ncd PiFM\n```\n\n然后下载所需的 Python\
    \ 文件：\n\n```bash\nsudo apt-get update\nsudo apt-get upgrade\nwget http://www.omatots.com/pifm.tar.gz\n\
    ```\n\n最后，使用以下代码提取文件：\n\n```bash\nsudo tar xvfz pifm.tar.gz\n```\n\n## 15 添加简单天线然后广播\n\
    \n硬件设置非常简单。事实上，你甚至不需要连接任何东西，因为树莓派可以直接从物理引脚 7 传输，无需更改任何东西。但是，你可能会想通过向 GPIO 4（引脚编号\
    \ 7）添加导线来扩展广播范围。令人难以置信的是，这可以将广播范围扩展到多达 100 米！确保你在 PiFM 文件夹中，然后使用代码行广播 WAV 文件：\n\
    \n"
