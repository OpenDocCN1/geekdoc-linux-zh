    ![](img/628186dda7facdc011bf39c938de3975_86_0.png)


    Below Be aware that the RAM is soldered to the motherboard on the XPS and therefore
    the laptop''s memory is not upgradable!


    ![](img/628186dda7facdc011bf39c938de3975_86_1.png)


    ![](img/628186dda7facdc011bf39c938de3975_86_2.png)


    ![](img/628186dda7facdc011bf39c938de3975_86_3.png)


    Below The Thunderbolt 3 port can be used to enable VGA, HDMI, Ethernet and USB-A
    via a Dell Adapter


    ![](img/628186dda7facdc011bf39c938de3975_86_4.png)


    ![](img/628186dda7facdc011bf39c938de3975_86_5.png)


    # Pros


    A fully working Ubuntu build together with very powerful hardware make the XPS
    13 Developer Edition a developer''s dream


    # Cons


    If you prefer screens larger than 15.2", your options are limited. The XPS 15
    9550 doesn''t have official Dell support for Linux


    # “ The XPS 13 Developer Edition offers top-end consumer hardware, pre-loaded
    with Ubuntu ”


    As an Ultrabook, the XPS does dispense with some ports — HDMI isn''t on board,
    nor Ethernet, and only 2 USB A ports are available. You do however get a Thunderbolt
    3 (aka USB C) port, which can be used with an adapter to offer HDMI and network
    connectivity.


    The preloaded Linux distribution on the XPS is Ubuntu 14.04 LTS. As you''d expect,
    everything works perfectly. Even the touchscreen is surprisingly well supported
    in applications. The installation is very clean, with minimal additional Dell
    repositories delivering just enough tuning of the build for everything to work
    perfectly. If you''ve ever set a Linux laptop up from scratch, you''ll know that
    this really is a breath of fresh air.


    Since the release of the machine, Canonical has updated the LTS Ubuntu release
    to 16.04 Xenial Xerus. In the interest of research, we updated the laptop. At
    the time of writing, which admittedly is very early in the


    release''s life cycle, there are a few teething troubles. Chromium glitches occasionally,
    the mouse pointer can freeze and Wi-Fi can fail to turn on when resuming. These
    aren''t uncommon Linux issues and will likely be resolved pretty quickly as usage
    of the new release increases. With that said, we have no official line from Dell
    on Xenial support at this time, so if you pick up a Developer Edition, you''re
    likely best sticking with 14.04 for now.


    The XPS 13 includes a 56Whr battery, which typically has given us around six hours
    of battery life. This is less than the quoted eight hours when the machine is
    running Windows, but isn''t terrible (and we suspect that a bit of tuning, this
    could be improved a little too). Note that if you opt for the Full HD, non-touch
    version, you should expect a least a couple of additional hours of use.


    Paul O''Brien


    # Summary


    The best thing about the XPS 13 Developer Edition is that you can''t actually
    show your new laptop to friends and colleagues without feeling like a second-class
