    # Tutorial


    # # Save time building packages with distcc


    Building packages takes ages on the Pi, so speed things up by sharing the load


    ![](img/628186dda7facdc011bf39c938de3975_71_0.png)


    **Christian Cawley**

    I am a former IT and software support engineer and since 2010 have I have been
    providing advice and inspiration to computer and mobile users both online and
    in print. I cover the Raspberry Pi and Linux at makeuseof.com.


    Most of the time when you install an application in Linux, you do so via a package
    manager, which enables the download and installation of binary packages, built
    from source packages. These include the default options, general features and
    parameters so that a wide portion of users can install without any problems.


    However, if you''re developing code, you first need to create a source package,
    and on a Raspberry Pi this can seem to take forever. One option is to copy the
    code to a desktop or notebook computer running Linux, but wouldn''t it be far
    more convenient to just let the Raspberry Pi deal with it... but give it a helping
    hand?


    Using distcc, we can distribute the resources needed to build the package, which
    basically means we can draw on the hardware of other devices. In this tutorial,
    we show how to use a nearby Linux laptop, but you could just as easily use one
    or more Raspberry Pis.


    # 01 Connect to the network


    Using distcc is all about making use of network resources, so begin by ensuring
    your Raspberry Pi is connected to your local network, along with the other devices
    (which we''ll call "slaves") that you intend to use. While you can use wireless
    networking, it''s faster with Ethernet cables. Set this up in the Terminal with:


    ```

    sudo nano /etc/wpa_supplicant/wpa_supplicant.conf

    ```


    Add your network''s SSID and passphrase (psk), then Ctrl+X to save.


    # 02 Install compilers


    On your desktop computer (ours is running Ubuntu 16.04 LTS) install the compilers
    to the /opt/cross


    # What you''ll need


    +   - Wireshark www.wireshark.org

    +   - Another computer, laptop, or even a Raspberry Pi

    +   - Large SD Card or mounted HDD storage

    +   - Compilers from http://bit.ly/29g5fx9


    ![](img/628186dda7facdc011bf39c938de3975_71_1.png)'
  - '[PAGE 72]


    # distcc


    ![](img/628186dda7facdc011bf39c938de3975_72_0.png)


    directory. You can do this manually from the Raspberry Pi Foundation''s GitHub,
    but it''s quicker to directly download the .fd to the download location, and then
    you will need to run this RPM command:


    ```

    sudo rpm -i --ignorearch raspberrypi-tools-9c3d7b6-1.1386.rpm

    ```


    With the compilers installed, and used with distcc, we can outsource compiling
    to the Ubuntu PC.


    # 03 Install distcc on your slave


    With distcc installed on the slave device, you''re halfway done with the set up,
    so run


    ```

    sudo apt-get install distcc

    ```


    When this is complete, you''ll need to make some edits to the distcc configuration
    file.


    ![](img/628186dda7facdc011bf39c938de3975_72_1.png)


    # 04 Edit distcc on slave


    Open the distcc configuration file in nano in order to edit, and configure the
    file so that it can then be used as a slave device.


    ```

    sudo nano /etc/defaults/distcc

    ```


    Here, you''ll need to use the arrow keys to scroll through the file, making the
    changes below.


    ```

    STARTDISTCC="true"

    ALLOWEDNETS="0.0.0.0/0"

    LISTENER=""

    ```


    While most of the edits will be a case of uncommenting a line (deleting the #
    symbol) some will require more hands-on alterations, such as adding the PATH declaration.


    When this is all done, you''ll need to save the file, so press Ctrl+X to prompt
    this, and Y to commit the changes.


    # 05 Make alterations if necessary


    It''s worth noting that the list of changes to the distcc file is not set in stone.
    For instance, ALLOWEDNETS and LISTENER can be adjusted to suit the needs of your
    network, while the JOBS parameter can be increased to ensure that the Pi will
    send work direct to the desktop slave.


    We need to move on, so restart the daemon.


    ```

    sudo /etc/init.d/distcc restart

    ```


    # 06 Prepare your Raspberry Pi


    On your "master" Raspberry Pi, begin by updating the device.


    ```

    sudo apt-get update

    sudo apt-get upgrade

    ```


    Wait until both of these processes have completed before installing the distcc
    utility on your Pi.


    ```

    sudo apt-get install distcc

    ```


    Installation on your Raspberry Pi may take a little longer than on your desktop
    computer, but when done, you''ll be ready to start configuration of distcc.


    ![](img/628186dda7facdc011bf39c938de3975_72_2.png)


    # 07 Configure your master device


    On your master Raspberry Pi, you will need to check the distcc config file to
    confirm that the device is on the correct subnet.


    ```

    sudo nano /etc/defaults/distcc

    ```


    Look for STARTDISTCC, ALLOWEDNETS and LISTENER, and set as follows:


    ```

    STARTDISTCC="true"

    ALLOWEDNETS="9.2.168.0.0/24"

    LISTENER="0.0.0.0"

    ```


    With these changes made, the Pi will associate jobs to computers with IP addresses
    within the ALLOWEDNETS list. Press Ctrl+X to exit the nano text editor, hitting
    Y to confirm the changes.


    # 08 Add a path


    Press Ctrl+X to exit the nano text editor, hitting Y to confirm the changes. Next,
    you should add a path to the compiler.


    # How many Pis to use?


    Setting up a distributed cross compiling network has, as you''ve seen, relatively
    straightforward, but how many Raspberry Pis can you connect? Well, distcc should
    work with the original Raspberry Pi Model B all the way through to the Raspberry
    Pi 3. However, you''ll find that there are compatibility issues with the Raspberry
    Pi 3 in 64-bit mode, so avoid this.'
