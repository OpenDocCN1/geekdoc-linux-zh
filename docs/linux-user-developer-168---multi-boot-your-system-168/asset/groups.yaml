    \ must be delivered in packages – if you find a function called main() in a package\
    \ named main, then you are dealing with an executable program; otherwise, you\
    \ have a shared library. In other words, what differentiates an autonomous Go\
    \ program from a Go library is the presence of the main() function in the main\
    \ package, which is also the entry point of an executable program just like the\
    \ main() function in C.\n\nA single string that is called the import path identifies\
