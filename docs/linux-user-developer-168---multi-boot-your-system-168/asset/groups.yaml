    ## 图灵测试


    **LUL** 团队，你们好，


    每当跟随你们杂志中的教程时，我偶尔会遇到“图灵完备”（Turing-complete）这个短语。如果我错了请指正，但艾伦·图灵（Alan Turing）在世时，Linux
    还没被发明，那么他与今天的计算机有什么关系？


    **Ray Gerrard**


    Ray，这是一个非常好的问题！正如大多数人所知，*密码破译员兼科学家艾伦·图灵*常被称为“计算之父”，而这就是“图灵完备”这一短语的由来，因为他提出的理论至今仍支配着所有计算机和编程语言底层的数学基础。


    虽然图灵设计和制造了早期的计算机，但图灵机是一个思想实验：*图灵机*具有无限长的磁带（当时使用的 I/O 和存储方法），磁带上写有符号。在思想实验中，图灵机读取磁带上的一个符号，然后根据一组预定义规则来决定是写入符号、向左或向右移动、执行另一条指令还是停止。听起来很简单，但其核心是计算机行为模式的数学模型。因此，“图灵完备”的事物是指其行为与图灵机完全相同的事物。任何可由算法计算的功能都可由图灵机计算——由于当今计算机就是这样工作的，可以说它们与图灵机等价，即图灵完备。图灵完备的编程语言可以利用分支——程序中的指令，告知计算机执行其他操作，而不是按顺序继续执行给定的程序。这意味着可以告知计算机仅当满足特定条件时才执行某些操作。命令是此概念的主要示例——如果这个，那么执行那个。并非今天使用的所有编程语言都是图灵完备的，但大多数都是。因此，当我们的教程解释某事物是图灵完备时，意味着它使用了图灵完备的编程语言，或者使用的代码指令可以由图灵机运行。


    ## 获取驱动


    大家好，


    我刚刚为我的双启动机器购买了一块*崭新的显卡*。Windows 驱动从包装内的光盘上安装得很好，但光盘里没有 Linux 驱动——我如何让它在我的 Linux
    分区上正常运行？


    **Dave Nairn**


    Dave，好消息是，你的显卡在 Linux 下很可能会原生工作，特别是鉴于你已经安装了它的 Windows 驱动。要弄清楚，首先打开终端并输入：


    ```

    grep VGA

    ```


    Linux 应该会告诉你显卡的名称和型号。现在检查驱动的版本号：


    ```

    grep OpenGL

    ```


    这应该会给你一个结果，显示“OpenGL


    ![](img/628186dda7facdc011bf39c938de3975_93_0.png)


    *上文：在哈佛历史科学仪器收藏中看到的图灵机模型*


    ![](img/628186dda7facdc011bf39c938de3975_94_0.png)


    上文：Mesa 3D 图形库是 Linux 显卡驱动的良好来源


    版本字符串”，然后指定一个数字，即 Linux 用于你显卡的驱动版本号。然而，如果返回的结果显示“OpenGL 渲染器字符串：Mesa X11”或“软件光栅化器”，则说明
    Linux 下未安装你的显卡驱动。但不要绝望！


    我们猜测你的“崭新”显卡很可能是 AMD 或 nVIDIA 卡，在这种情况下，制造商也有闭源专有驱动可供启用（除非你运行的是 Fedora，它对这类驱动会“闹别扭”）。基于
    Ubuntu 的发行版（使用 Dash 搜索“附加驱动”并启动它——它会检测你的硬件并查找可用的驱动）。


    还是不行？开源驱动的一个好来源是 http://www.mesa3d.org，/但你必须遵循每个驱动和你特定发行版的说明，因为安装方法因你使用的硬件和软件而异。


    另一件值得做的是更新你的发行版，特别是如果你使用的是较旧版本的 Linux 且使用了较新的显卡。某些热心的开发人员很可能在发行版的最新版本中为你的显卡创建了驱动。


    ## 不错的 NAS


    亲爱的 Linux User 和 Developer，


    非常感谢你们关于如何构建 NAS（网络附属存储）的文章（第 167 期，第 36 页——编者按）。我按照你们的指南组装了一台运行 FreeNAS 的机器，用于存储照片、媒体文件和家庭计算机的备份。实际上，我用一台旧
    PC 制作了我的机器，因为我不想在 HP Microserver 上花费 150 英镑，但它工作得同样好，并且非常有用。例如，我的长子经常使用 MacBook
    上的 iMovie 制作游戏视频，因此他的硬盘空间很快就会用完——现在他可以将文件备份到 NAS（在爸爸的帮助下），并从笔记本电脑中移除较旧的工作文件，因此他不再抱怨空间不足了。我们还可以在房子周围提供音乐或视频，当我和妻子厌倦了足球/网球/板球（我们有两个十几岁的儿子）时，这是很好的选择，我们现在可以在餐厅播放我们的整个数字音乐收藏，而无需依赖客厅里的
    PC。


    **Alan Philan**


    Alan，很高兴你喜欢这篇文章并且它对你是有用的！我们是网络附属存储（NAS）的忠实粉丝，因为它使得备份或访问否则


    ![](img/628186dda7facdc011bf39c938de3975_94_1.png)


    上文：FreeNAS 是构建自己的网络附属存储的绝佳开源资源


    占用单个设备大量空间的大文件变得容易。不过，有一点我们要说的是，请务必定期备份 NAS 上的数据，特别是如果它是 JPEG 等无损格式的照片，因为频繁打开和关闭可能会导致质量下降。此外，NAS
    盒子和其他设备一样也会发生事故（问问我们的猫就知道了），所以我们专家建议的异地备份，无论是付费计划还是与朋友互相存储数据，都绝对值得遵循。


