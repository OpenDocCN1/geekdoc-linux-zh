    -   Apache Mesos


    独立模式是最简单的设置方式，许多 Spark 用户从这个模式开始。根据 Databricks 在 2015 年进行的一项调查，48% 的用户在独立模式下运行
    Spark，40% 在 YARN 上，11% 在 Mesos 上。我们意识到我们的用户群体在技能设置方面非常多样化，因此我们必须为他们适应这些不同的资源管理器。当然，我们一直有兴趣探索如何扩展这些资源管理器，但这需要大量的努力和人力。


    在集群模式下运行时，Spark 集群包含一个驱动进程（driver process）和多个执行器（executors）。驱动进程负责协调，例如跟踪元数据和执行任务调度。


    ![](img/628186dda7facdc011bf39c938de3975_10_1.png)


    ## 探索 Spark 峰会


    由于其巨大的受欢迎程度，Apache Spark 还举办了 Spark 峰会，这是一个汇聚全球顶尖科学家、工程师、分析师和高管分享和获取 Apache Spark
    知识的活动。


    在以往的活动上，关于 Apache Spark 的未来有一些关键进展，还有深入的用户问答环节，用户可以在其中讨论他们的问题和不满。每个 Spark 峰会还包括由
    Databricks 主持的一系列培训课程。虽然它们的唯一目标是教育，但这也是将 Apache Spark 扩展到其他市场和受众的基石。说开源社区正在关注这一点简直是轻描淡写。在过去
    24 个月中，Spark 峰会的参会人数急剧增加，对 Spark 团队所提供内容的需求比以往任何时候都更加强烈。在早些时候在纽约市举行的最新 Spark 峰会东部区，一些领先的业务专业人士和分析师走上了舞台。其中包括
    Capital One 的技术副总裁 Chris DiAgnostino 和 eBay 分析基础设施负责人 Seshu Adututhothula，他们的信息强调了数据科学的重要性，以及
    Apache Spark 如何成为解决行业问题的答案。


    # 过去 5 年 Spark 贡献者的增长


    ![](img/628186dda7facdc011bf39c938de3975_11_0.png)


    执行器进程执行数据处理的重任，它们彼此通信以交换数据，从而执行用户指定的数据流。


    **是否有安全协议来确保 Apache Spark 在使用时的安全性？**


    是的，绝对有。Apache Spark 本身具有许多内置的安全功能。例如，它可以加密传输中的数据，并与 Kerberos 和 SASL 集成。


    通常，Spark 也被用于提供超出处理引擎本身额外安全功能的环境中。例如，它可以与 Amazon S3 的服务端加密一起使用。另一个例子是 Databricks
    企业安全，它提供端到端加密、基于角色的访问控制以及审计功能。我们极其重视安全，特别是考虑到每天通过 Apache Spark 传递的敏感数据量。我们实施的协议受到持续监控，以确保它们尽可能有效，但始终还有成长的空间。


    **能否告诉我们关于 MLlib（机器学习库）的情况？它实际使用起来有多方便？**


    Apache Spark 提供了一个通用的机器学习库——MLlib——旨在简洁、可扩展且易于与其他工具集成。凭借 Spark 的可扩展性、语言兼容性和速度，数据科学家可以更快地解决和迭代他们的数据问题。


    > “我们极其重视安全，特别是考虑到通过 Apache Spark 传递的敏感数据级别”


    # Apache 软件基金会


    就 Apache 社区而言，Spark 只是在宏大格局中扮演了一小部分角色。


    ![](img/628186dda7facdc011bf39c938de3975_11_1.png)


    **Apache 软件基金会（ASF）**提供了一系列开源软件项目，旨在提供在其领域引领潮流的高质量软件。但最引起共鸣的是社区部分，因为许多项目纯粹是社区驱动的，许多项目共享相同的开发人员和最终用户。


    ASF 目前拥有大量志愿者，他们帮助开发和监管覆盖广泛技术领域的 350 多个开源项目。选择如此之多，每个人都能找到适合自己的东西。比如 Jena，一个用于构建语义网和链接数据应用程序的
    Java 框架？或者也许是 SpamAssassin，它为管理员提供了一种快速过滤和阻止潜在垃圾邮件的方法？贡献在 Apache 及其众多项目的开发中起着重要作用。贡献的最好方式是简单地参与其中一个项目社区，甚至提交自己的项目以供考虑。


    # 五. 高薪科技岗位


    ![](img/628186dda7facdc011bf39c938de3975_12_0.png)


    自 Apache Spark 项目成立以来，MLlib 一直被视为 Spark 成功的基础。MLlib 的主要好处在于，它允许数据科学家专注于他们的数据问题和模型，而不是解决围绕分布式数据（如基础设施、配置等）的复杂性。自成立以来，一些关键问题已经得到解决，而另一些则接近完成。数据工程师可以使用
    Spark 易于使用的 API 专注于分布式系统工程，而数据科学家可以利用 Spark 核心的规模和速度。同样重要的是，Spark MLlib 是一个通用库，它为大多数用例提供算法，同时允许社区在此基础上构建和扩展以用于特定用例。


    > "MLlib 实现了大量的分布式机器学习算法"


    **MLlib 实现了大量的分布式机器学习算法，以及特征转换器。用例包括推荐系统（协同过滤）、垃圾邮件检测、欺诈检测、流失分析和物联网设备故障预测。根据我们
    2015 年的调查，84% 的用户使用 Spark 进行高级分析，主要使用的是 MLlib 提供的功能。**


    **对于特别感兴趣的人来说，是否有机会帮助贡献 Spark 的开发？用户需要满足任何标准吗？**


    Apache Spark 是数据领域开发最活跃、最大的开源项目，拥有超过 1,000 名贡献者，平均每月解决 400-500 个问题。Spark 的成功归功于这些贡献者。


    实际上，成为新的贡献者非常容易，因为 Spark 有很多方面是新用户可以提供帮助的，从文档到错误修复再到引擎内部。我们相信社区是 Apache Spark
    的核心，事实证明它在开发中提供了巨大的帮助。我们需要继续扩大我们的用户基础和社区，以帮助塑造未来多年的 Apache Spark。


    该项目有一个相当活跃的用户邮件列表，用户可以在 **spark.apache.org/community.html** 加入。该项目接受通过 GitHub
    上的拉取请求进行代码贡献。**github.com/apache/spark**。并且在 Spark 的 wiki 上有一份相当详细的指南：**bit.ly/29DoaBg**


