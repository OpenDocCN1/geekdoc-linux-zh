    \n# It's a Merry-Go-Round!\n\nSending out multiple files required us to get acquainted\
    \ with the for loop; it executed its command body until the list of parameters\
    \ passed in was exhausted:\n\n```\n```bash\nfor file in `ls *.mp3` ; do\n    echo\
    \ \"\\$emailTitle File \\$fileNow of \\$fileCount\"\n    echo \"\\$file\"\n  \
    \  fileNow=$((fileNow+1))\ndone\n```\n```\n\nfor can also be used to work on numbers\
    \ and/or numeric ranges. This is accomplished via a modification of the $ operator\
    \ or the passing in of a complete list or declaration – the following script outputs\
    \ two sequences of numbers:\n\n```\n```bash\nfor ((a=1; a<=10; a++)); do\n   \
    \ echo \\$a;\ndone\n\nfor a in {1..10}; do\n    echo \\$a;\ndone\n```\n```\n\n\
    for loops are ideally suited to all cases where a shell script is to process a\
    \ set of predefined commands. In practice, few programs enjoy the luxury of operating\
    \ on a set of tasks known at invocation – in most cases, iterations must take\
    \ place until a job is accomplished.\n\nSadly, using hardware-based examples for\
    \ loops is unattractive as reusing them is difficult. Due to that, we will stick\
    \ to hybrid examples – the first one computes the sum of a group of numbers entered:\n\
    \n```\n```bash\nmyval=22\naccu=0\nwhile [ \\$myval != \"q\" ]; do\n    read myval\n\
    \    if [ \\$myval != \"q\" ]; then\n        let accu=accu+myval\n    fi\ndone\n\
    ```\n```\n\n```\n```bash\necho \\$accu\n```\n```\n\nWhile is an implementation\
    \ of the head-controlled loop: if such a loop is to be executed at least once,\
    \ the developer must set up the parameters accordingly. Tail-controlled loops\
    \ provide an attractive alternative in such situations – another implementation\
    \ of the program could look like this:\n\n```\n```bash\naccu=0\nuntil [ [ \\$myval\
    \ == \"q\" ] ]; do\n    read myval\n    if [ \\$myval != \"q\" ]; then\n     \
    \   let accu=accu+myval\n    fi\ndone\n```\n```\n\n```\n```bash\necho \\$accu\n\
    ```\n```\n\nThis code may look a little upsetting to developers who grew up on\
    \ C or BASIC: in Bash, tail-controlled loops also start out with the loop control\
    \ expression. Be aware that this is but a syntactic difference – loop behaviour\
    \ would better be described by the following snippet taken from the C standard:\n\
    \n```\n```c\ndo { statement(s); } while( condition );\n```\n```\n\n# Don't repeat\
    \ yourself\n\nSaying the same thing over and over again is boring; it is not without\
    \ reason that many, if not most, pirate captains had a parrot on their shoulder\
    \ to repeat commands to thick or drunk undertakings.\n\nJokes aside: repeated\
    \ code is an antipattern of the first order. It is responsible for difficult-to-maintain\
    \ programs that develop errors during maintenance.\n\nThis problem is best solved\
    \ via functions. Let us start out by taking a look at lineMaker – it generates\
    \ a line containing some ASCII art:\n\n```\n```bash\n#!/bin/bash\n\nanotherF()\
    \ {\n    echo \"- - - - - - - - - - - - - - - - - -\"\n}\n\nfunction drawline\
    \ {\n    anotherF\n    anotherF\n}\n\ndrawline\n```\n```\n\nBash makes handling\
    \ functions interesting in that it provides two syntax variants; our snippet uses\
    \ the one for anotherF, while the other one is demonstrated in drawline. Actually\
    \ running the code can then be accomplished just as if drawline was part of the\
    \ Bash shell's command set.\n\nFunctions can, of course, be modified by the code\
    \ responsible for invoking them. This is accomplished by parameters – let us demonstrate\
    \ its usage by modifying the line drawer a little bit:\n\n```\n```bash\nfunction\
    \ drawline {\n    anotherF\n    anotherF\n    echo \\$1\n    echo \\$1\n}\n```\n\
    ```"
  - "[PAGE 30]\n\n```\ndrawline a b c d\n```\n\nInvoking this new version of the code\
    \ will lead to the following result:\n\n```\ntamhan@TAMHAN14:~/Desktop/bashspace$\
    \ ./runner.sh\n-----------------------------------------\n4\na\n```\n\nRunning\
    \ functions have access to a variable called `#` — it contains the number of parameters\
    \ passed in. The actual parameters can then be accessed via variables called 1,\
    \ 2, 3 and so on. Accessing their content involves the use of the $4 operator\
    \ discussed in the last installment.\n\nBash's return command is misleading in\
    \ that it can not be used to return actual values to the caller — it is, instead,\
    \ limited to the handling of numeric status codes. One interesting way to return\
    \ values involves the use of “parametric variables”:\n\n```\nfunction myfunc()\
    \ {\n    local _res=$1\n    local myresult='Hello World'\n    eval $_res=\"\"\
    $myresult\"\"\n}\n\nmyfunc result\necho $result\n```\n\n> “ Be aware that a function\
    \ must be placed above its first invocation – if that is not the case, Bash will\
    \ throw an error on execution ”\n\nThe code above is quite tricky in that it uses\
    \ the eval command: it instructs Bash to first parse the string passed in, and\
    \ to proceed to running the result in the second step. `$_res` is thus transformed\
    \ into the variable name, while the string containing `&myresult` remains untouched.\n\
    \nBe aware that a function must be placed above its first invocation – if that\
    \ is not the case for some reason, Bash will throw an error on execution. Furthermore,\
    \ keep in mind that functions can be overwritten at will – the following product\
    \ will yield very odd output (see figure):\n\n```\n. . .\nfunction drawline {\n\
    \   anotherF\n}\n. . .\n\nfunction drawline {\n   echo \"Ouch\"!\n}\n```\n\n![](img/628186dda7facdc011bf39c938de3975_30_0.png)\n\
    \n```\ndrawline a b c d\n```\n\nFurthermore, you should always keep in mind that\
    \ function invocations are not particularly fast. While Bash does allow the creation\
    \ of recursive functions, doing so is not recommended – tasks like the computation\
    \ of a factorial are better handled by C or Fortran.\n\n# ShellCheck\n\nBash's\
    \ syntax is complex enough to give experienced programmers pause: as the language\
    \ is interpreted at runtime, errors are usually found only when it is too late.\n\
    \nStatic analysis provides a workaround for this problem. ShellCheck is a conveniently\
    \ packaged program which checks your shell scripts for a selection of well-known\
    \ sources of trouble.\n\nCasual users can access the product via the internet:\
    \ open https://www.shellcheck.net in a browser of choice, and paste your shell\
    \ script into the file. Should you feel like using the product more often, install\
    \ it locally via apt-get:\n\n```\ntamhan@TAMHAN14:~$ sudo apt-get install shellcheck\n\
    [Sudo] password for tamhan:\n```\n\nShellCheck can then be deployed from the command\
    \ line – very savvy developers even go so far as to invoke it automatically after\
    \ each file save.\n\n# Conclusion and outlook\n\nEven though Bash scripts – admittedly\
    \ – look quite odd at first glance, the scripting language does nevertheless provide\
    \ a complete set of loop and selection commands. This means that Bash script is\
    \ a more-or-less Turing complete language which, in theory, could be used to tackle\
    \ all kinds of advanced problems.\n\nIn practice, this is not recommended due\
    \ to a variety of issues. First of all, the syntax is unforgiving. Second, Bash\
    \ misses a variety of advanced structures like pointers and associative arrays:\
    \ their makes solving advanced tasks needlessly complex.\n\nFortunately, Bash\
    \ treats programs written in other languages as first-class citizens. The next\
    \ part of this tutorial will introduce you to a variety of ways to chain commands\
    \ and applications – stay tuned, as awesome power awaits!"
  - "[PAGE 31]\n\n# # Compile software using modern protections\n\n![](img/628186dda7facdc011bf39c938de3975_31_0.png)\n\
    \n**Toni Castillo Girona**\n\nholds a bachelor’s degree in Software Engineering\
    \ and works as an ICT research support expert in a public university sited in\
    \ Catalonia (Spain). He writes regularly about GNU/Linux in his blog: [disbaues.ups.es](http://disbaues.ups.es)\n\
    \n# ## Resources\n\n+   Smashing the Stack for fun and profit\n+   http://tbit.ly/29pZpIF\n\
    +   \n+   Debian Hardening\n+   https://wiki.debian.org/\"Hardening\"\n+   \n\
    +   GDB Quick Reference\n+   http://tbit.ly/29o6CIn\n+   \n+   Running Shell-Code\n\
    +   http://tbit.ly/29gYJ3a\n+   \n+   Relocation Read-Only\n+   http://tbit.ly/29a7Ov7\n\
    \nHardening GNU/Linux ELF binaries can prevent corruption-memory-based exploits\
    \ from taking over an entire system\n\n**Software security is a complex area of\
    \ expertise.** We’ve left behind the heyday when smashing the stack for fun and\
    \ profit was, so to speak, a piece of cake. Nowadays GNU/Linux distros ship with\
    \ modern protections against memory corruption out-of-the-box, rendering these\
    \ sorts of attack more improbable. And yet, security researchers are always finding\
    \ obscure ways to exploit software flaws even with these protections on. Hardening\
    \ your binaries can help you prevent most of these attacks. The GNU C library\
    \ and the compiler offer some of these protections, whereas the kernel itself\
    \ implements others. These protections are: DEP/NX, ASLR, Stack-Canaries, PIE\
    \ and Full RELRO. Modern gcc versions also include some useful protections, like\
    \ replacing any call to the *strcpy* family functions with their length-limited\
    \ counterparts (*strncpy*).\n\n# ### The NX bit\n\nThe Non-Execute bit (NX) makes\
    \ sure that alien code that could have been injected into non-executable segments\
    \ of the ELF binary won’t be executed. Modern 64-bit processors include this protection\
    \ out-of-the-box and the Linux Kernel supports it. Open a new terminal and run\
    \ this command to find out if your processor supports NX:\n\n```\n```\ncat /proc/cpuinfo\
    \ |grep 'flags:head -1|grep --color=auto '(nx)'\n```\n```\n\nThis bit can be cleared\
    \ at compile time by passing the `-z execstack` flag to the compiler. Otherwise,\
    \ it is set by default.\n\nGrab your favourite text editor and write this code\
    \ down:\n\n```\n```\n#include <stdio.h>\nchar shellcode[] =\n\"\\x31\\xc8\\x31\\\
    xc9\\x89\\xc6\\x31\\xcd\\xc8\\x89\"\n\"\\x89\\xf1\\x5e\\x89\\xf6\\x89\\x89\\xcb\\\
    x89\"\n\"\\xcb\\x89\\x89\\x89\\x88\\x88\\x88\\x88\\x89\"\n\"\\xc6\\x88\\xf7\\\
    xb8\\xc7\\xe8\\x89\\xc6\\x89\"\n\"\\xcd\\x89\\xf1\\xd6\\x89\\x89\\x9d\\x88\\xc6\"\
    \n\"\\x88\\xe8\\xc6\\x88\\xf1\\xff\\x1f\\xff\\x0b\\x1f\";\nint main(int argc,\
    \ char **argv) {\nint *ret;\n\nret = (int *)ret + 2;\n*(ret) = (int)shellcode;\n\
    }\n```\n```\n\nThis code is a pretty well-known technique to execute shell-\n\n\
    code. The shell-code is stored in the address pointed to by *shellcode[]. This\
    \ address belongs to the .data segment. First, compile it like this:\n\n```\n\
    ```\n$ gcc -m32 nx.c -o nx\n```\n```\n\nIf you execute the binary, you get a segmentation\
    \ fault:\n\n```\n```\n./nx\nSegmentation fault\n```\n```\n\nCompile it again but\
    \ this time clearing the NX bit:\n\n```\n```\ngcc -m32 -z execstack nx.c -o nx\n\
    ./nx\nsh-4.2$\nsh-4.2$\n```\n```\n\nThe shell-code gets executed and you obtain\
    \ a shell. Apart from being able to clear the NX bit at compile time, you can\
    \ do so on an existing ELF binary by means of the *execstack* utility. Install\
    \ it in your distro:\n\n```\n```\n#apt-get install execstack\n```\n```\n\nCompile\
    \ our example without clearing the NX bit and run it: you get the segmentation\
    \ fault as before. But hey, you have *execstack* now, so you can do some magic:\n\
    \n```\n```\n# execstack -s nx\n# ./nx\nsh-4.2$\n```\n```\n\nCool: you can set\
    \ or clear the NX bit at will with *execstack*. Now\n\n![](img/628186dda7facdc011bf39c938de3975_31_1.png)"
