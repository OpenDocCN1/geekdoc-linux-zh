    \ Catalyst 驱动程序，监控 ATI/AMD GPU 需要重新编译；否则，这些和 nVidia GPU 即可开箱即用。独立的 Psensor 服务器提供\
    \ JSON Web 服务，用于通过 Psensor 或您的 Web 浏览器监控远程服务器。\n\n![](img/628186dda7facdc011bf39c938de3975_89_0.png)\n\
    \n*上方：通过为每个传感器提供可选的图表选项，Psensor 让您能够快速直观地检查热点区域*\n\n**优点**\n- 为系统中所有温度监控器提供了便捷的接口。简单且可配置的图表视图。\n\
    \n**缺点**\n- 它不会告诉你 I/O 传感器的位置，因此你不得不去翻阅主板文档！\n\n**非常适合…**\n- 在编译或视频处理期间进行监控\n\
    - psensor.net/psensor/\n\n## 命令行媒体播放器\n### PlayShell 0.2.3\n一个使用 shell 自身语言的命令行媒体播放器\n\
    \n这是个挺有趣的东西：一个用 Bash 编写的媒体播放器框架，它会使用各种播放器作为后端。它在嵌入式系统中也有严肃的用途，那里的资源很稀缺；但对于那些大部分时间都在使用虚拟终端的人来说，吸引力在于这是一个拥有一些实用功能，却用最朴素的脚本语言\
