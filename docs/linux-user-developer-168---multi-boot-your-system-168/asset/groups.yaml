  - "[PAGE 65]\n\n# Python column\n\n# Raspberry Pi plus Arduinos\n\nThis issue, we\
    \ will look at how to get your Raspberry Pi to talk to and use your Arduino\n\n\
    ![](img/628186dda7facdc011bf39c938de3975_65_0.png)\n\nJoey Bernard is a true Renaissance\
    \ man, splitting his time between building furniture, helping researchers with\
    \ scientific computing problems and writing Android apps\n\n![](img/628186dda7facdc011bf39c938de3975_65_1.png)\n\
    \nIt’s the official language of the Raspberry Pi. Read the docs at python.org/doc\n\
    \nThe Raspberry Pi is a truly amazing single-board computer that gets used in\
    \ lots of DIY projects. That has been the basis for this whole column and the\
    \ previous several articles. While the Raspberry Pi has a GPIO and can communicate\
    \ with sensors and actuators, you may have cases where you want to use your Raspberry\
    \ Pi as the brains of your project and offload the interactions with the physical\
    \ world to another system. This is usually handled by one of the many microcontroller\
    \ boards that are available. In this issue, we will specifically use the Arduino\
    \ board and see how to connect it to a Raspberry Pi and how to handle the communications\
    \ between the two. As always, we will be using Python as the language of choice\
    \ to handle all of the actual coding in the examples here.\n\nThe Arduino is an\
    \ open source prototyping platform defined as a specification. This means that\
    \ you can get Arduino implementations from several different manufacturers, but\
    \ they should all behave in a similar fashion. For this article, the assumption\
    \ will be that whatever implementation you wish to use will behave properly. The\
    \ first step is to connect the two boards\n\nThis will make sure that you are\
    \ starting with all of the core software that you might need. When you plug in\
    \ your Arduino, you need to know over which port communications will happen. The\
    \ specific port name will vary based on the exact version of Raspberry Pi and\
    \ Arduino that you are using. However, it should be something like `/dev/ttyUSB0`\
    \ or `/dev/ttyACM0`. In the example code below, we will be assuming that the Arduino\
    \ is visible on the port `/dev/ttyUSB0`.\n\nYou have the two devices connected,\
    \ you can start writing code to have them talk to each other. We will start with\
    \ the most low-level protocols and build upwards from there. The first step is\
    \ to open a serial connection to the Arduino. In order to do this, you will need\
    \ to make sure that the Python serial module is installed. If you are using Raspbian,\
    \ you can do this with:\n\n```\nsudo apt-get install python-serial\n```\n\nYou\
    \ then need to create a new Serial object connected to a given serial port, along\
    \ with the speed you need to use.\n\n```\nimport serial\nser = serial.Serial('/dev/ttyUSB0',\
    \ 9600)\n```\n\n# The first step is to open a serial connection to the Arduino\n\
    \ntogether. You will probably want to use a powered USB hub to connect them since\
    \ the Raspberry Pi can’t provide huge amounts of power through its USB port. While\
    \ they are connected over USB, the Arduino will appear as a serial port to the\
    \ Raspberry Pi. This means that you can communicate with the Arduino directly\
    \ over the serial connection. To be sure you have all of the relevant libraries\
    \ installed, you can simply install the Arduino IDE with the command:\n\n```\n\
    sudo apt-get install arduino\n```\n\nIn the above example, the speed is 9600 baud\
    \ (bits/sec). With this Serial object, you can read and write data to and from\
    \ the Arduino. But you need code on the Arduino to handle its part of this communication.\
    \ The Arduino has its own programming language, based on C, which you use to write\
    \ the code that will run on the board. The way Arduinos work is that at boot it\
    \ will load a program that will run as long as it is powered up. As a simple example,\
    \ the following code will listen on an input pin to see if it goes high. If so,\
    \ it will then fire off a message on the serial port.\n\n```\nint pirPin = 7;\n\
    void setup() {\n  pinMode(pirPin, INPUT);\n  Serial.begin(9600);\n}\nvoid loop()\
    \ {\n  if (digitalRead(pirPin) == HIGH)\n  {\n    Serial.println(\"High\");\n\
    \  }\n  delay(500);\n}\n```\n\nTo load this program to your Arduino board, you\
    \ will need to use the Arduino IDE that was installed at the beginning of this\
    \ article. This is a graphical program, so you will need to connect your Raspberry\
    \ Pi to a monitor if you want to do this step using it. Otherwise, you can do\
    \ this programming of your Arduino using your regular desktop. If you are using\
    \ the standard bootloader on most Arduinos, it will start up whatever program\
    \ was last uploaded to it. This way you can use your desktop to upload your code\
    \ and then connect it to your Raspberry Pi later on. Moving back to the Raspberry\
    \ Pi, how can you read this message from the Arduino? You can simply do a read\
    \ from the Serial object you created earlier.\n\n```\nimport time\nwhile True:\n\
    \  message = ser.readline()\n  print(message)\n  if (message[0] == 'H')\n    do_something_useful()\n\
    \  time.sleep(5)\n```\n\nAs you can see, we imported the time module in order\
    \ to be able to sleep in the loop between attempts to read from the serial port.\n\
    \nWhat about sending instructions out to the Arduino? This is also possible. Arduino\
    \ code to be uploaded ahead of time. For example, the following code will take\
    \ an input number and flash an LED that number of times..."
  - "[PAGE 66]\n\n```\n```\nint ledPin = 13;\nvoid setup() {\n  pinMode(ledPin, OUTPUT);\n\
    \  Serial.begin(9600);\n}\nvoid loop() {\n  if (Serial.available()) {\n    flash(Serial.read()\
    \ - '0');\n  }\n  delay(1000);\n}\nvoid flash(int n) {\n  for (int i = 0; i <\
    \ n; i++) {\n    digitalWrite(ledPin, HIGH);\n    delay(100);\n    digitalWrite(ledPin,\
    \ LOW);\n    delay(100);\n  }\n}\n```\n```\n\nThen, you can send a count from\
    \ your Python code with something like:\n\n```\n```\nser.write('5')\n```\n```\n\
    \nThis will flash the LED 5 connected to pin 13 on your Arduino five times.\n\n\
    One missing element on the Raspberry Pi is an analogue-to-digital (ADC) converter\
    \ to take a given voltage and turn it into a number that can be used in some piece\
    \ of control software. This is where attaching an Arduino can be extremely helpful,\
    \ as it has a 10-bit ADC converter included. The following code will read the\
    \ voltage on pin 3 and then send it out over the serial connection to the Raspberry\
    \ Pi.\n\n```\n```\nint analogPin = 3;\nint val = 0;\nvoid setup() {\n  Serial.begin(9600);\n\
    }\nvoid loop() {\n  val = analogRead(analogPin);\n  Serial.println(val);\n}\n\
    ```\n```\n\nThis maps the measured voltage to an integer between 0 and 1,023.\
    \ The minimum voltage is zero, while the maximum voltage can be set with the function\
    \ analogReference(). By default, the maximum is the power supplied to the board\
    \ (5 volts for 5V boards, or 3.3 volts for 3.3V boards). You can also use two\
    \ internally supplied reference voltages, one at 1.1 volts and a second at 2.56\
    \ volts. For special cases, you can supply an external reference voltage to the\
    \ AREF pin. You need to be sure that it is only between 0 volts and 5 volts.\n\
    \nGoing in the opposite direction, you can use the Arduino to supply an output\
    \ voltage. This is done by actually using a PWM (pulse width modulation) output\
    \ signal. The idea here is to actually send out a number of pulses with some duty\
    \ cycle that is on for some percentage of the time and off for the remainder of\
    \ the time. For example, if you have an LED connected to one of the pins, you\
    \ can light it at half brightness with the following code.\n\n```\n```\nint ledPin\
    \ = 9;\nvoid setup() {\n  pinMode(ledPin, OUTPUT);\n}\nvoid loop() {\n  analogWrite(ledPin,\
    \ 127);\n}\n```\n```\n\nThe second parameter to the analogWrite() function is\
    \ a value between 0 and 255, which defines the duty cycle (between 0% or fully\
    \ off to 100% (or fully on). This analog output signal stays on at the given duty\
    \ cycle until a new call to the analogWrite() function. By having your Raspberry\
    \ Pi write out values over the serial connection, it can then control the output\
    \ duty cycle by sending a simple integer.\n\nHopefully, this short article will\
    \ spark some ideas on how you can start combining multiple computing platforms\
    \ to expand the capabilities of your own projects. There is no reason to try to\
    \ find the one silver-bullet platform for your project when you can pick the sub-modules\
    \ that actually do their own individual jobs best and build up the complex behaviour\
    \ you need from these simpler parts.\n\n# # PyFirmata can help even more\n\nWhile\
    \ you can write your own code to run on the Arduino, there are several projects\
    \ that can be uploaded to it to make interacting a bit easier. One of these is\
    \ the Firmata project, which includes a Python module to help you talk to the\
    \ Arduino. The first step will be downloading the Firmata Arduino code and uploading\
    \ it to your Arduino, most easily done with a desktop computer. The code is available\
    \ at github.com/firmata/arduino. There are a few different versions available,\
    \ but for these examples you should upload the StandardFirmata sketch with the\
    \ Arduino IDE. There are client libraries available for many different programming\
    \ languages, including several for Python. The one we’ll look at using is pyFirmata.\
    \ You can install it from your Raspberry Pi with:\n\n```\n```\nsudo pip install\
    \ pyfirmata\n```\n```\n\nYou can now use Firmata to act as a sort of remote control\
    \ for the Arduino, where your Python code can get almost direct access to all\
    \ of the functionality available. To get started, import the pyFirmata module\
    \ and create a new Arduino object connected to the relevant serial port:\n\n```\n\
    ```\nimport pyfirmata\nboard = pyfirmata.Arduino('/dev/ttyUSB0')\n```\n```\n\n\
    You can now access digital I/O pins directly. For example, the following code\
    \ would write 1 to pin 10.\n\n```\n```\nboard.digital[10].write(1)\n```\n```\n\
    \nWhen you want to read from a pin, you have the possibility of overflowing input\
    \ buffers. To deal with this issue, you can create an iterator object and start\
    \ it before doing any reads, using code like that below.\n\n```\n```\nit = pyfirmata.util.Iterator(board)\n\
    it.start()\n```\n```\n\nYou can now get selected pins for either input or output.\
    \ The following code will get pin 4 for digital input and pin 12 for analogue\
    \ PWM output.\n\n```\n```\npin4 = board.get_pin('d:4:i')\npin12 = board.get_pin('a:12:p')\n\
    ```\n```\n\nYou can then read and write with these new pin objects with the related\
    \ methods:\n\n```\n```\nval = pin4.read()\npin12.write(100)\n```\n```\n\nWhen\
    \ you are done, don’t forget to reset any output pins back to 0 volts, and then\
    \ you can close down the connection with:\n\n```\n```\nboard.exit()\n```\n```"
  md: "\n# Python column\n\n## Raspberry Pi plus Arduinos\n\nThis issue, we will look\
    \ at how to get your Raspberry Pi to talk to and use your Arduino.\n\n![](img/628186dda7facdc011bf39c938de3975_65_0.png)\n\
    \nJoey Bernard is a true Renaissance man, splitting his time between building\
    \ furniture, helping researchers with scientific computing problems and writing\
    \ Android apps.\n\n![](img/628186dda7facdc011bf39c938de3975_65_1.png)\n\nIt’s\
    \ the official language of the Raspberry Pi. Read the docs at python.org/doc.\n\
    \nThe Raspberry Pi is a truly amazing single-board computer that gets used in\
    \ lots of DIY projects. That has been the basis for this whole column and the\
    \ previous several articles. While the Raspberry Pi has a GPIO and can communicate\
    \ with sensors and actuators, you may have cases where you want to use your Raspberry\
    \ Pi as the brains of your project and offload the interactions with the physical\
    \ world to another system. This is usually handled by one of the many microcontroller\
    \ boards that are available. In this issue, we will specifically use the Arduino\
    \ board and see how to connect it to a Raspberry Pi and how to handle the communications\
    \ between the two. As always, we will be using Python as the language of choice\
    \ to handle all of the actual coding in the examples here.\n\nThe Arduino is an\
    \ open source prototyping platform defined as a specification. This means that\
    \ you can get Arduino implementations from several different manufacturers, but\
    \ they should all behave in a similar fashion. For this article, the assumption\
    \ will be that whatever implementation you wish to use will behave properly. The\
    \ first step is to connect the two boards together. You will probably want to\
    \ use a powered USB hub to connect them since the Raspberry Pi can’t provide huge\
    \ amounts of power through its USB port. While they are connected over USB, the\
    \ Arduino will appear as a serial port to the Raspberry Pi. This means that you\
    \ can communicate with the Arduino directly over the serial connection. To be\
    \ sure you have all of the relevant libraries installed, you can simply install\
    \ the Arduino IDE with the command:\n\n```bash\nsudo apt-get install arduino\n\
    ```\n\nThis will make sure that you are starting with all of the core software\
    \ that you might need. When you plug in your Arduino, you need to know over which\
    \ port communications will happen. The specific port name will vary based on the\
    \ exact version of Raspberry Pi and Arduino that you are using. However, it should\
    \ be something like `/dev/ttyUSB0` or `/dev/ttyACM0`. In the example code below,\
    \ we will be assuming that the Arduino is visible on the port `/dev/ttyUSB0`.\n\
    \n### The first step is to open a serial connection to the Arduino\n\nYou have\
    \ the two devices connected, you can start writing code to have them talk to each\
    \ other. We will start with the most low-level protocols and build upwards from\
    \ there. The first step is to open a serial connection to the Arduino. In order\
    \ to do this, you will need to make sure that the Python serial module is installed.\
    \ If you are using Raspbian, you can do this with:\n\n```bash\nsudo apt-get install\
    \ python-serial\n```\n\nYou then need to create a new Serial object connected\
    \ to a given serial port, along with the speed you need to use.\n\n```python\n\
    import serial\nser = serial.Serial('/dev/ttyUSB0', 9600)\n```\n\nIn the above\
    \ example, the speed is 9600 baud (bits/sec). With this Serial object, you can\
    \ read and write data to and from the Arduino. But you need code on the Arduino\
    \ to handle its part of this communication. The Arduino has its own programming\
    \ language, based on C, which you use to write the code that will run on the board.\
    \ The way Arduinos work is that at boot it will load a program that will run as\
    \ long as it is powered up. As a simple example, the following code will listen\
    \ on an input pin to see if it goes high. If so, it will then fire off a message\
    \ on the serial port.\n\n```cpp\nint pirPin = 7;\nvoid setup() {\n  pinMode(pirPin,\
    \ INPUT);\n  Serial.begin(9600);\n}\nvoid loop() {\n  if (digitalRead(pirPin)\
    \ == HIGH) {\n    Serial.println(\"High\");\n  }\n  delay(500);\n}\n```\n\nTo\
    \ load this program to your Arduino board, you will need to use the Arduino IDE\
    \ that was installed at the beginning of this article. This is a graphical program,\
    \ so you will need to connect your Raspberry Pi to a monitor if you want to do\
    \ this step using it. Otherwise, you can do this programming of your Arduino using\
    \ your regular desktop. If you are using the standard bootloader on most Arduinos,\
    \ it will start up whatever program was last uploaded to it. This way you can\
    \ use your desktop to upload your code and then connect it to your Raspberry Pi\
    \ later on. Moving back to the Raspberry Pi, how can you read this message from\
    \ the Arduino? You can simply do a read from the Serial object you created earlier.\n\
    \n```python\nimport time\nwhile True:\n  message = ser.readline()\n  print(message)\n\
    \  if (message[0] == 'H'):\n    do_something_useful()\n  time.sleep(5)\n```\n\n\
    As you can see, we imported the time module in order to be able to sleep in the\
    \ loop between attempts to read from the serial port.\n\nWhat about sending instructions\
    \ out to the Arduino? This is also possible. Arduino code to be uploaded ahead\
    \ of time. For example, the following code will take an input number and flash\
    \ an LED that number of times:\n\n```cpp\nint ledPin = 13;\nvoid setup() {\n \
    \ pinMode(ledPin, OUTPUT);\n  Serial.begin(9600);\n}\nvoid loop() {\n  if (Serial.available())\
    \ {\n    flash(Serial.read() - '0');\n  }\n  delay(1000);\n}\nvoid flash(int n)\
    \ {\n  for (int i = 0; i < n; i++) {\n    digitalWrite(ledPin, HIGH);\n    delay(100);\n\
    \    digitalWrite(ledPin, LOW);\n    delay(100);\n  }\n}\n```\n\nThen, you can\
    \ send a count from your Python code with something like:\n\n```python\nser.write('5')\n\
    ```\n\nThis will flash the LED connected to pin 13 on your Arduino five times.\n\
    \nOne missing element on the Raspberry Pi is an analogue-to-digital (ADC) converter\
    \ to take a given voltage and turn it into a number that can be used in some piece\
    \ of control software. This is where attaching an Arduino can be extremely helpful,\
    \ as it has a 10-bit ADC converter included. The following code will read the\
    \ voltage on pin 3 and then send it out over the serial connection to the Raspberry\
    \ Pi.\n\n```cpp\nint analogPin = 3;\nint val = 0;\nvoid setup() {\n  Serial.begin(9600);\n\
    }\nvoid loop() {\n  val = analogRead(analogPin);\n  Serial.println(val);\n}\n\
    ```\n\nThis maps the measured voltage to an integer between 0 and 1,023. The minimum\
    \ voltage is zero, while the maximum voltage can be set with the function analogReference().\
    \ By default, the maximum is the power supplied to the board (5 volts for 5V boards,\
    \ or 3.3 volts for 3.3V boards). You can also use two internally supplied reference\
    \ voltages, one at 1.1 volts and a second at 2.56 volts. For special cases, you\
    \ can supply an external reference voltage to the AREF pin. You need to be sure\
    \ that it is only between 0 volts and 5 volts.\n\nGoing in the opposite direction,\
    \ you can use the Arduino to supply an output voltage. This is done by actually\
    \ using a PWM (pulse width modulation) output signal. The idea here is to actually\
    \ send out a number of pulses with some duty cycle that is on for some percentage\
    \ of the time and off for the remainder of the time. For example, if you have\
    \ an LED connected to one of the pins, you can light it at half brightness with\
    \ the following code.\n\n```cpp\nint ledPin = 9;\nvoid setup() {\n  pinMode(ledPin,\
    \ OUTPUT);\n}\nvoid loop() {\n  analogWrite(ledPin, 127);\n}\n```\n\nThe second\
    \ parameter to the analogWrite() function is a value between 0 and 255, which\
    \ defines the duty cycle (between 0% or fully off to 100% or fully on). This analog\
    \ output signal stays on at the given duty cycle until a new call to the analogWrite()\
    \ function. By having your Raspberry Pi write out values over the serial connection,\
    \ it can then control the output duty cycle by sending a simple integer.\n\nHopefully,\
    \ this short article will spark some ideas on how you can start combining multiple\
    \ computing platforms to expand the capabilities of your own projects. There is\
    \ no reason to try to find the one silver-bullet platform for your project when\
    \ you can pick the sub-modules that actually do their own individual jobs best\
    \ and build up the complex behaviour you need from these simpler parts.\n\n###\
    \ PyFirmata can help even more\n\nWhile you can write your own code to run on\
    \ the Arduino, there are several projects that can be uploaded to it to make interacting\
    \ a bit easier. One of these is the Firmata project, which includes a Python module\
    \ to help you talk to the Arduino. The first step will be downloading the Firmata\
    \ Arduino code and uploading it to your Arduino, most easily done with a desktop\
    \ computer. The code is available at github.com/firmata/arduino. There are a few\
    \ different versions available, but for these examples you should upload the StandardFirmata\
    \ sketch with the Arduino IDE. There are client libraries available for many different\
    \ programming languages, including several for Python. The one we’ll look at using\
    \ is pyFirmata. You can install it from your Raspberry Pi with:\n\n```bash\nsudo\
    \ pip install pyfirmata\n```\n\nYou can now use Firmata to act as a sort of remote\
    \ control for the Arduino, where your Python code can get almost direct access\
    \ to all of the functionality available. To get started, import the pyFirmata\
    \ module and create a new Arduino object connected to the relevant serial port:\n\
    \n```python\nimport pyfirmata\nboard = pyfirmata.Arduino('/dev/ttyUSB0')\n```\n\
    \nYou can now access digital I/O pins directly. For example, the following code\
    \ would write 1 to pin 10.\n\n```python\nboard.digital[10].write(1)\n```\n\nWhen\
    \ you want to read from a pin, you have the possibility of overflowing input buffers.\
    \ To deal with this issue, you can create an iterator object and start it before\
    \ doing any reads, using code like that below.\n\n```python\nit = pyfirmata.util.Iterator(board)\n\
    it.start()\n```\n\nYou can now get selected pins for either input or output. The\
    \ following code will get pin 4 for digital input and pin 12 for analogue PWM\
    \ output.\n\n```python\npin4 = board.get_pin('d:4:i')\npin12 = board.get_pin('a:12:p')\n\
    ```\n\nYou can then read and write with these new pin objects with the related\
    \ methods:\n\n```python\nval = pin4.read()\npin12.write(100)\n```\n\nWhen you\
    \ are done, don’t forget to reset any output pins back to 0 volts, and then you\
    \ can close down the connection with:\n\n```python\nboard.exit()\n```\n"
  mdcn: "\n\n# Python 专栏\n\n## 树莓派加Arduino\n\n本期，我们将探讨如何让树莓派与你的Arduino进行通信并使用它。\n\n\
    ![](img/628186dda7facdc011bf39c938de3975_65_0.png)\n\n乔伊·伯纳德是一位真正的通才，他的时间分配于制作家具、帮助研究人员解决科学计算问题以及编写Android应用程序之间。\n\
    \n![](img/628186dda7facdc011bf39c938de3975_65_1.png)\n\n它是树莓派的官方语言。在 python.org/doc\
    \ 阅读文档。\n\n树莓派是一款真正令人惊叹的单板计算机，被广泛用于许多DIY项目中。这也是本专栏及之前几篇文章的基础。虽然树莓派拥有GPIO，可以与传感器和执行器通信，但在某些情况下，你可能希望将树莓派用作项目的“大脑”，并将与物理世界的交互任务卸载到另一个系统。这通常由市面上可用的众多微控制器板之一来处理。在本期中，我们将具体使用Arduino板，并查看如何将其连接到树莓派，以及如何处理两者之间的通信。一如既往地，我们将使用Python作为首选语言来处理此处示例中的所有实际编码。\n\
    \nArduino是一个开源的原型平台，定义为一项规范。这意味着你可以从几个不同的制造商那里获得Arduino实现，但它们的行为应该都类似。对于本文，假设你要使用的任何实现都能正常工作。第一步是将两块板连接在一起。由于树莓派无法通过其USB端口提供大量电力，你可能需要使用带电源的USB集线器来连接它们。虽然它们通过USB连接，但Arduino对树莓派会显示为一个串行端口。这意味着你可以直接通过串行连接与Arduino通信。为了确保安装所有相关的库，你可以简单地使用以下命令安装Arduino\
    \ IDE：\n\n```bash\nsudo apt-get install arduino\n```\n\n这将确保你拥有可能需要的所有核心软件。当你插入Arduino时，你需要知道通信将在哪个端口上进行。具体的端口名称将根据你使用的树莓派和Arduino的确切版本而异。然而，它应该类似于\
    \ `/dev/ttyUSB0` 或 `/dev/ttyACM0`。在下方的示例代码中，我们将假设Arduino在端口 `/dev/ttyUSB0` 上可见。\n\
    \n### 第一步是打开到Arduino的串行连接\n\n两个设备已连接，你可以开始编写代码让它们互相通信。我们将从最低层的协议开始，并由此向上构建。第一步是打开到Arduino的串行连接。为了做到这一点，你需要确保安装了Python\
    \ serial模块。如果你使用的是Raspbian，你可以这样做：\n\n```bash\nsudo apt-get install python-serial\n\
    ```\n\n然后，你需要创建一个连接到给定串行端口的新的Serial对象，以及你需要使用的速度。\n\n```python\nimport serial\n\
    ser = serial.Serial('/dev/ttyUSB0', 9600)\n```\n\n在上面的例子中，速度是9600波特率（位/秒）。使用这个Serial对象，你可以读写Arduino的数据。但你需要在Arduino上编写代码来处理其部分的通信。Arduino有自己的基于C的编程语言，你使用它来编写将在板上运行的代码。Arduino的工作方式是，在启动时加载一个程序，只要通电，该程序就会一直运行。作为一个简单的例子，以下代码将监听一个输入引脚，看它是否变高。如果是，它将在串行端口上发送一条消息。\n\
    \n```cpp\nint pirPin = 7;\nvoid setup() {\n  pinMode(pirPin, INPUT);\n  Serial.begin(9600);\n\
    }\nvoid loop() {\n  if (digitalRead(pirPin) == HIGH) {\n    Serial.println(\"\
    High\");\n  }\n  delay(500);\n}\n```\n\n要将此程序加载到Arduino板中，你需要使用在本文开头安装的Arduino\
    \ IDE。这是一个图形化程序，如果你想用它来执行这一步，你需要将树莓派连接到显示器。否则，你可以使用常规桌面计算机来编程你的Arduino。如果你使用的是大多数Arduino上的标准引导加载程序，它将在启动时运行最后上传的任何程序。这样，你可以使用桌面计算机上传代码，然后再将其连接到树莓派。回到树莓派，你如何从Arduino读取这条消息？你可以简单地从之前创建的Serial对象进行读取。\n\
    \n```python\nimport time\nwhile True:\n  message = ser.readline()\n  print(message)\n\
    \  if (message[0] == 'H'):\n    do_something_useful()\n  time.sleep(5)\n```\n\n\
    如你所见，我们导入了time模块，以便能够在尝试从串行端口读取之间的循环中休眠。\n\n那如何向Arduino发送指令呢？这也是可能的。Arduino代码需要预先上传。例如，以下代码将获取一个输入数字，并使LED闪烁该次数：\n\
    \n```cpp\nint ledPin = 13;\nvoid setup() {\n  pinMode(ledPin, OUTPUT);\n  Serial.begin(9600);\n\
    }\nvoid loop() {\n  if (Serial.available()) {\n    flash(Serial.read() - '0');\n\
    \  }\n  delay(1000);\n}\nvoid flash(int n) {\n  for (int i = 0; i < n; i++) {\n\
    \    digitalWrite(ledPin, HIGH);\n    delay(100);\n    digitalWrite(ledPin, LOW);\n\
    \    delay(100);\n  }\n}\n```\n\n然后，你可以使用类似于以下的Python代码发送一个计数：\n\n```python\n\
    ser.write('5')\n```\n\n这将使连接到你Arduino引脚13的LED闪烁五次。\n\n树莓派上缺少的一个元素是模数转换器（ADC），用于将给定的电压转换为可在某些控制软件中使用的数字。这就是连接Arduino极其有帮助的地方，因为它内置了10位ADC转换器。以下代码将读取引脚3上的电压，然后通过串行连接将其发送到树莓派。\n\
    \n```cpp\nint analogPin = 3;\nint val = 0;\nvoid setup() {\n  Serial.begin(9600);\n\
    }\nvoid loop() {\n  val = analogRead(analogPin);\n  Serial.println(val);\n}\n\
    ```\n\n这将测量的电压映射为0到1,023之间的整数。最小电压为零，而最大电压可以通过函数analogReference()设置。默认情况下，最大电压是提供给板子的电源（5V板为5伏特，3.3V板为3.3伏特）。你还可以使用两个内部提供的参考电压，一个是1.1伏特，另一个是2.56伏特。在特殊情况下，你可以向AREF引脚提供外部参考电压。你需要确保它仅在0伏特和5伏特之间。\n\
    \n反过来说，你可以使用Arduino提供输出电压。这是通过使用PWM（脉冲宽度调制）输出信号来实现的。这里的想法实际上是发送一定数量的脉冲，其占空比在部分时间内为高，在剩余时间内为低。例如，如果你有一个LED连接在其中一个引脚上，你可以用以下代码以半亮度点亮它。\n\
    \n```cpp\nint ledPin = 9;\nvoid setup() {\n  pinMode(ledPin, OUTPUT);\n}\nvoid\
    \ loop() {\n  analogWrite(ledPin, 127);\n}\n```\n\nanalogWrite()函数的第二个参数是一个介于0和255之间的值，它定义了占空比（从0%即完全关断到100%即完全开启）。此模拟输出信号在给定占空比下保持开启，直到对analogWrite()函数的新调用。通过让树莓派通过串行连接输出数值，它可以发送一个简单的整数来控制输出占空比。\n\
    \n希望这篇短文能激发一些关于如何开始结合多个计算平台以扩展你自己项目能力的想法。当你可以选择那些实际上最能完成各自任务的子模块，并从这些简单部件构建出所需的复杂行为时，没有理由去尝试为你的项目寻找唯一的一揽子解决方案平台。\n\
    \n### PyFirmata 可以提供更多帮助\n\n虽然你可以编写自己的代码在Arduino上运行，但有几个项目可以上传到其中，使交互变得更轻松。其中之一是Firmata项目，它包含一个Python模块，帮助你与Arduino通信。第一步将是下载Firmata\
    \ Arduino代码并将其上传到你的Arduino，使用桌面计算机完成这一点最容易。代码可在 github.com/firmata/arduino 获取。有几个不同的版本可用，但对于这些示例，你应该使用Arduino\
    \ IDE上传StandardFirmata草图。许多不同的编程语言都有可用的客户端库，包括几个Python库。我们将查看使用的那个是pyFirmata。你可以从你的树莓派上安装它：\n\
    \n```bash\nsudo pip install pyfirmata\n```\n\n现在你可以使用Firmata作为Arduino的一种远程控制器，你的Python代码可以几乎直接访问所有可用的功能。要开始，导入pyFirmata模块并创建一个连接到相关串行端口的新的Arduino对象：\n\
    \n```python\nimport pyfirmata\nboard = pyfirmata.Arduino('/dev/ttyUSB0')\n```\n\
    \n现在你可以直接访问数字I/O引脚。例如，以下代码会将1写入引脚10。\n\n```python\nboard.digital[10].write(1)\n\
    ```\n\n当你想从引脚读取时，你有可能溢出输入缓冲区。为了解决这个问题，你可以在进行任何读取之前创建并启动一个迭代器对象，使用如下代码。\n\n```python\n\
    it = pyfirmata.util.Iterator(board)\nit.start()\n```\n\n现在你可以为输入或输出获取选定的引脚。以下代码将获取用于数字输入的引脚4和用于模拟PWM输出的引脚12。\n\
    \n```python\npin4 = board.get_pin('d:4:i')\npin12 = board.get_pin('a:12:p')\n\
    ```\n\n然后你可以使用相关方法对这些新的引脚对象进行读写：\n\n```python\nval = pin4.read()\npin12.write(100)\n\
    ```\n\n完成后，别忘了将任何输出引脚重置回0伏特，然后你可以使用以下命令关闭连接：\n\n```python\nboard.exit()\n```\n\
    \n"
