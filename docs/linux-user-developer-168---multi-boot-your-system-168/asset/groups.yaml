  - '[PAGE 2]


    # # Welcome


    # ## to issue 168 of *Linux User & Developer*


    # # This issue


    +   - Multi boot your system

    +   - Master virtualisation

    +   - 10 best boards for makers

    +   - Run Linux on an Android device


    ![](img/628186dda7facdc011bf39c938de3975_2_0.png)


    Welcome to the latest issue of *Linux User & Developer*, the UK and America''s
    favourite Linux and open source magazine. Wouldn''t it be nice to be able to run
    every operating system or distro you fancied? The trouble is, affording the hardware
    to do so might be a bit of a problem – unless, of course, you multi boot your
    machine.


    Partitioning your hard drive allows you to run two or more distros or operating
    systems on one computer. Each one gets to take full advantage of the system''s
    resources, and you can flip in and out of them with the flick of a restart switch.
    In this issue, we''ve got the complete guide to multi booting, from backing up
    your data and partitioning your hard drive to how to run Windows and Linux on
    the same machine, how to run multiple Linux distros and how to configure, edit
    and even prettify the GRUB boot loader that controls the whole thing. Check it
    out on p16.


    Also in this issue we take a look beyond the Raspberry Pi and round up the ten
    best boards for makers. Whether you''re looking at the best option for getting
    kids interested in making and coding or whether you''re after the ultimate board
    for Internet of Things projects, quick deployment or x86 architecture, we''ve
    got you covered. Take a look on p56, and if we haven''t featured your favourite
    board, be sure to give us a shout on the links below!


    April Madden, Editor


