  mdcn: '


    # OMEGA（欧米伽开发板）


    £15/$19.99 • Onion.io


    ![](img/628186dda7facdc011bf39c938de3975_60_0.png)


    尽管 **OMEGA** 的尺寸只有树莓派的四分之一，但在物联网开发方面，它的表现却优于树莓派。得益于其制造商自家的云服务系统 Onion Cloud 的支持，将开发板连接到互联网并创建物联网应用程序变得轻而易举。当然，其开源的特性也让你能够探索其他用户的项目。虽然
    Atheros AR9331 处理器并非家喻户晓的名字，但它提供了足够的算力来运行完整的 Linux 操作系统，同时也支持众多主流编程语言，如 Python、PHP
    和 Ruby。


    ### 最适合


    物联网


    # JAGUARBOARD


    £61/$79 • Jaguarboard.org


    ![](img/628186dda7facdc011bf39c938de3975_60_1.png)


    树莓派与 JaguarBoard 之间最大的区别在于，后者基于 x86 架构，通常能带来更好的性能。对于习惯于 x86 架构的用户来说，它还提供了一块可扩展性强的小型开发板，且无需了解
    ARM 等嵌入式系统知识。Intel Atom Z3735 处理器让这种性能提升更加明显，它能够轻松运行大多数桌面程序，并支持许多流行的 Linux 发行版。


    ### 最适合


    x86 架构


    # 创客最佳的 10 块开发板


    # ODROID C2


    £31/$40 · Hardkernel.com


    ![](img/628186dda7facdc011bf39c938de3975_61_0.png)


    ### 最适合


    原始算力


    ODROID-C2 的核心在于强大的原始算力，这也是为何它已经拥有一个活跃的社区，并开发出了一些令人惊叹的项目。其主频为 2GHz 的 ARM Cortex-A53
    处理器搭配 2GB 内存，性能堪比许多小型笔记本电脑。它还提供了许多其他开发板不具备的额外功能。红外接收器和 ADC（模数转换）功能非常适合用于新项目的实验，而
    40 针 GPIO 接口则实现了开发板与其他物理设备之间的无缝连接。它甚至自诩为市面上最高效的 64 位开发板。术语里就藏着答案——它的价格无法与 $9 的
    CHIP 竞争，但 CHIP 的处理能力只有一半。然而，ODROID-C2 的“马力”完全体现在性能上——若要安装非预装的 Ubuntu 16.04 或 Android
    5.1 Lollipop 发行版，你需要一个 microSD 卡或 eMMC 模块。


    # BEAGLEBONE BLACK


    £37/$55 · Beagleboard.org


    ![](img/628186dda7facdc011bf39c938de3975_61_1.png)


    ### 最适合


    初学者


    对于 BeagleBone Black 而言，简洁是关键，从初始设置过程到连接外部设备，一切都尽可能做到无痛。它宣称你可以从零开始在十秒内进入 Linux
    系统，并在五分钟内开始在该开发板上进行开发。与 MinnowBoard MAX 类似，BeagleBone Black 是前代产品的继任者，它摒弃了原版的一些功能并新增了更多功能——值得注意的是增加了
    HDMI 视频输出、加倍的 RAM 以及超越关键 1GHz 门槛的改进型处理器。在创意项目开发方面，它也是不错的选择，拥有总共 92 个连接点供你用于项目，这既吸引新手也吸引资深用户。但如果你缺少灵感，BeagleBone
    背后有一个活跃的开发者社区，其中列举了大量你可以尝试的初学者项目。


    # 速览


    ![](img/628186dda7facdc011bf39c938de3975_62_0.png)


    | | CHIP | PANDA BOARD ES | micro: bit | UDOO NEO | SOLIDPC Q4 | MINNOW BOARD
    MAX | OMEGA | JAGUAR BOARD | ODROID C2 | BEAGLEBONE BLACK |

    |---|---|---|---|---|---|---|---|---|---|---|

    | 处理器 | 1GHz | 1.2GHz | 18MHz | 1GHz + 200MHz | 1.04GHz | 1.33GHz | 400MHz | 1.83GHz
    | 2GHz | 1GHz |

    | 内存 | 512MB | 1GB | 16kB | 512MB | 需单独购买 | 2GB | 64MB | 1GB | 2GB | 512MB |

    | 存储 | 4GB | 通过存储卡 | 256kB | 通过存储卡 | 通过存储卡 | 8MB | 16MB | 16GB | 通过存储卡 | 4GB |

    | 连接性 | Micro-USB, USB 2.0, 蓝牙, Wi-Fi, 复合视频, 麦克风输入, 音频输出 | 以太网, Wi-Fi, 蓝牙 2.1,
    音频输入/输出, HDMI, DVI-D, USB 2.0 | 低功耗蓝牙, Micro-USB | Micro-HDMI, LVDS, NTSC, PAL,
    USB 2.0, Micro-USB, USB, 音频输出 | HDMI, USB 3.0, 以太网, Wi-Fi, 蓝牙 4.0, DisplayPort
    | HDMI, USB 3.0, USB 2.0, SATA2, 以太网, 数字音频输出 | USB 2.0, 以太网, Wi-Fi | USB 2.0,
    以太网, HDMI, 音频输出, 麦克风输入 | USB 2.0, 以太网, HDMI, 红外接收器 | USB 2.0, HDMI, 以太网, McASP0
    |

    | 最适合 | 性价比 | 开发者 | 儿童 | 大型项目 | 快速部署 | 扩展板 | 物联网 | x86 架构 | 原始算力 | 初学者 |


    # 裁决


    所有这些开发板都有明确的优点，使它们各自适合不同类型的创客项目。对于让孩子们参与制作和编程来说，Micro:bit 是完美的选择（尤其是考虑到他们很可能在学校就能拿到一块）。对于那些想要将项目从树莓派和
    Micro:bit 提升一个档次的人来说，BeagleBone Black 使用简单但配备了大量的 GPIO 引脚，因此可以驱动各种类型的项目。然而，如果你寻找的是纯粹的算力，不妨将
    ODROID-C2 作为最佳选择。JaguarBoard、UDOO Neo、SolidPC Q4、MinnowBoard MAX 和 PandaBoard
    ES 都是更专业的设备，非常适合高级项目的开发、原型制作和部署——它们对于已经超越树莓派能力范围的用户来说是很棒的选择。但这里最大的亮点无疑是 CHIP：它拥有出色的规格、强大的连接性和无可匹敌的价格。它是迄今为止我们遇到的最适合创客的开发板——但它能否挑战一直备受欢迎的树莓派的市场主导地位？


    # 添加手势


    添加手势是通过 Skywriter HAT 扩展板实现的。该设备的尺寸正好可以放置在树莓派顶部，通过 40 针 GPIO 接口连接，然后通过一条命令安装软件。


    # 构建电路


    构建在遥控器中的电路核心由发射器和接收器组成。发射器由一个红外 LED 构成，通过一个晶体管和一个 GPIO 引脚进行控制。


    # 制作外壳


    两个木制面板构成了手势控制器的外壳。设备的各个部分都雕刻有插槽，用于连接电源、USB 和红外 LED。然后，两个部件通过四个小螺丝固定在一起，最后经过彻底的打磨完成。


    # 准备树莓派


    Frederick 使用的是树莓派 4+ 型号，因为它的大小与 Skywriter HAT 基本一致。随后，使用 `dd` 命令将 Raspbian Jessie
    镜像写入一张 8GB 的 microSD 卡中，并刷入树莓派。


    ![](img/628186dda7facdc011bf39c938de3975_63_0.png)


    # 组件清单


    - 树莓派

    - Skywriter HAT

    - 红外 LED

    - 示波器

    - 木制外壳

    - 发射器

    - 接收器


    在将电路焊接到主板之前，Frederick 制作了一个面包板原型，并使用示波器验证了基本功能。


    下方 两个雕刻好的木制面板被用来构建遥控器的外壳，通过四颗螺丝固定以帮助其保持稳固。


    ![](img/628186dda7facdc011bf39c938de3975_63_1.png)


    ![](img/628186dda7facdc011bf39c938de3975_63_2.png)


    # 我的树莓派项目


    ![](img/628186dda7facdc011bf39c938de3975_64_0.png)


    # 基于手势的电视遥控器


    借助 Frederick 令人惊叹的手势控制遥控器，让控制电视变得更容易


    ### 遥控器的想法是从哪里来的？


    当我在网上发现有趣的部件时，我往往会购买它们，即使我还没有具体的项目计划。Pimoroni 的 Skywriter HAT 就是这种情况。我知道我迟早会在某个项目中使用它，但当时并不知道具体是什么项目。


    后来，我的孩子们想看某个节目。我五岁的女儿开始在平板电脑上滑动寻找该节目。但这是一部电视剧，在平板上无法观看。对她来说，使用遥控器太难了：你得先打开电视，然后用另一个遥控器打开机顶盒，再切换频道和音量。


    就在那时，我有了简化遥控器的想法，将其变成更像平板电脑滑动手势那样直观的东西。作为第一个原型，我将指令数量保持最少：开/关、换频道和调音量。


    ### 你在这个项目上花了多长时间？能否给我们介绍一下开发过程？


    一旦我清楚自己想要实现什么，这个项目并没有花太长时间。我认为原型的构建、制作和编程大约花了十个小时，分散在几个晚上完成。


    我通常会做的第一件事是将项目分解成更小、更容易管理的“问题”。在这种情况下，我希望能够检测手势并接收/发送红外信号。


    第二步是为上一步确定的每个问题寻找解决方案。使用 Skywriter HAT 和随附的 Python 库可以检测手势。使用名为 LIRC 的软件以及带有红外
    LED 和接收器的简单电路可以接收和发送红外信号。


    当两者单独工作正常后，必须将它们结合起来，以便手势触发相应的红外信号。这是通过编辑并将 LIRC 功能整合到 Skywriter HAT 的一个示例脚本中来实现的。脚本完成并测试通过后，我确保它会在启动时自动运行。


    最后，在硬件和软件就绪后，我开始制作木制外壳。我选择木材是因为它不导电，不会影响 Skywriter HAT 的手势检测。外壳由两部分组成，组件夹在中间。


    ### 木材不会影响 Skywriter HAT 的手势检测


    开了一些孔，以暴露红外 LED 和接收器，允许红外信号通过。


    该设备目前由外部电源供电，因为内置电池会增加项目的复杂性。不过，我未来希望能在外壳中集成可充电电池，以解决这一问题。


    ### 开发遥控器时是否遇到了任何问题？


    当结合不同功能让它们相互交互时，问题通常会出现，尽管它们在单独工作时表现良好。在这个项目中，不需要任何功能同时运行，而是按顺序运行，从而避免了这类问题。当检测到手势时，然后触发红外信号。


    项目中最困难的部分可能是将所有东西装入尽可能小的包装中。使用一块带有红外元件的原型板并将其直接焊接到树莓派底部，与使用堆叠式针脚相比，节省了大量空间。


    ### 树莓派在这个项目中扮演什么角色？


    不出所料，树莓派是这个项目的大脑。它使用 LIRC 记录和存储来自电视遥控器的红外信号，并处理 Skywriter HAT 接收到的手势。


    在当前应用中，使用树莓派似乎有点大材小用，特别是用于发送红外信号。然而，想法是扩展这个项目的功能，让用户能够通过某种基于网页的向导记录红外信号并将它们映射到手势。这样可以避免用户必须最初使用命令行界面来记录信号。可以在不修改硬件或外壳的情况下，将
    Web 服务器添加到树莓派中。


    ### 将红外信号集成到遥控器中很难吗？


    并不真的！LIRC 允许从原始遥控器中记录信号，这极大地简化了整个过程。一旦记录了所有信号，就可以单独发送它们，甚至可以将多个信号组合在一起。这在需要同时通过同一触发器控制多个设备时特别有用。例如，要看电视，需要同时打开电视和机顶盒。通过控制机顶盒来换台，通过电视来调节音量。


    ### 你对有兴趣重现你项目的人有什么建议？


    这个项目并不复杂，是手势控制的有趣入门。试着让它成为你自己的作品，给它加一点特色。你并不一定要控制电视，因为建议的带有红外发射器的设置可以控制任何支持红外线的设备。或者你甚至可以将红外发射器换成其他类型的触发器，控制完全不同的东西。


    该项目展示了可以实现的一个示例，但可用于许多不同的应用。


    ![](img/628186dda7facdc011bf39c938de3975_64_1.png)


    ### Frederick Vandenbosch


    虽然他的项目规模远不及以往宏大的作品，但他喜欢围绕某个主题构建东西，并在此过程中享受乐趣。


    ### 喜欢它？


    Pi Hut 拥有自己基于树莓派的控制器，值得查看。它可以作为你的 FURC 模块的完美伴侣，或者甚至用于改进 XBMC/Kodi 的控制。


    ### 延伸阅读


    对于那些有兴趣重现这个手势电视遥控器的人，Frederick 在他的网站 frederickvandenbosch.be 上上传了完整的教程。在他的网站上，你还可以浏览他的其他树莓派项目，包括一个物联网灯、Amazon
    Echo 控制器和一个紧急按钮。


    www.linuxuser.co.uk 65


