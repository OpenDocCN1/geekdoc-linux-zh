    \ taking only a few minutes.\n\nSuch as cellular connectivity; also, as a test-quality\
    \ image, you should expect a lot of bugs!\n\n### 10 A no-root Linux alternative\n\
    \nThroughout this guide we’ve talked about installing on your rooted device...\
    \ but if you’re not rooted, there is an option, in the form of the ‘nroot’ builds\
    \ downloadable from the Play Store. We’ve checked out ‘debian nroot’ by pelya\
    \ and, as the name suggests, you can use it to boot a minimal Debian install,\
    \ on a stock Android device.\n\n> The nroot implementation is made possible by\
    \ the ‘proot’ project, which implements chroot, mount -bind and binfmt_misc in\
    \ userspace\n\n### 09 Replacing Android completely with Linux\n\nHaving Linux\
    \ running alongside Android works surprisingly well, but it always feels like\
    \ a bolted on additional operating system. If you want to run truly native Linux\
    \ you have two options. The first is to buy a real Ubuntu phone or tablet (such\
    \ as the BQ M10). However, if you happen to own a device that is used by Ubuntu\
    \ for testing its ‘Touch’ images (such as the Nexus 4), then you can also flash\
    \ Linux to it.\n\nDetails can be found here on the Ubuntu website – wiki.ubuntu.com/Touch/Install.\
    \ The process involves unlocking the bootloader on your device, downloading the\
    \ Ubuntu images for your device and manually flashing them using Fastboot.\n\n\
    Of course, the process will wipe your data and – if you want to return to Android\
    \ in the future, you’ll need to download the stock factory images for your device\
    \ and flash those. Note that if you do flash to native Linux, you may lose features\n\
    \nAlthough it will work on a wider range of devices than the root option, there\
    \ are some caveats. Right now, the app doesn’t play nicely with devices running\
    \ Android Marshmallow. The other big thing to note is that the app can’t be installed\
    \ to the SD card – you’ll need to have a device with a decent amount of internal\
    \ storage.\n\nThose quibbles aside, though, the nroot implementation works well\
    \ and, like the best Linux projects, is open source. The app is made possible\
    \ by the ‘proot’ project, which implements chroot, mount -bind and binfmt_misc\
    \ in userspace. You can read more details at github.com/proot-me/.\n\n![](img/628186dda7facdc011bf39c938de3975_38_0.png)\n"
  mdcn: "\n\n## 教程\n\n### 在 Android 上运行 Linux\n\n```\npaul@xps13-ubuntu:~$ dd if=/dev/zero\
    \ of=ubuntu.img bs=1MB count=0 seek=4096\n0+0 records in\n0+0 records out\n0 bytes\
    \ copied, 0.000132431 s, 0.0 kB/s\npaul@xps13-ubuntu:~$ mke2fs -F / ubuntu.img\n\
    mke2fs 1.42.13 (17-May-2015)\nDiscarding device blocks: done\nCreating filesystem\
    \ with 1000000 4k blocks and 250480 inodes\nFilesystem UUID: 14742810-5fca-4535-8a56-062a7304f2c6\n\
    Superblock backups stored on blocks:\n\t32768, 98304, 163840, 229376, 294912,\
    \ 819200, 884736\n\nAllocating group tables: done\nWriting inode tables: done\n\
    Writing superblocks and filesystem accounting information: done\n\npaul@xps13-ubuntu:~$\
    \ sudo mount -o loop ubuntu.img / /cli\n[sudo] password for paul:\npaul@xps13-ubuntu:~$\
    \ \n```\n\n你需要准备自己的镜像。幸运的是，这其实相当简单。\n\n为了创建你自己的镜像，你首先需要创建 IMG 文件本身（适当的大小，4GB 是个好的起点），方法是将\
    \ `/dev/zero` 写入一个文件，然后使用 `mke2fs` 创建文件系统本身。挂载你的新镜像后，你就准备好将实际的 Linux 文件复制到它上面了。\n\
    \n你需要获取适用于你的发行版的 RootFS（根文件系统）镜像，该镜像需为你的设备架构构建（很可能是 ARM）。Ubuntu 镜像可以在 cdimage.ubuntu.com/ubuntu-core/xenial/daily-preinstalled/\
    \ 找到。将文件复制（`cp -r`）到你的新镜像中，最后，创建一个 `root/init.sh` 脚本。这由“Complete Linux Installer”应用在启动时使用——你应该从现有镜像中复制该脚本，并根据你上传的操作系统进行适当修改。\n\
    \n完成操作系统安装后，Linux Deploy 应用允许你通过 UI 启动和停止新操作系统中的服务。该应用还可以管理 SSH 和 VNC 设置。\n\n\
    安装新操作系统大约需要 30 分钟。建议的磁盘镜像最小尺寸为 1024MB（带 LXDE），不带 GUI 则为 512MB – 请记住，当你在具有 FAT32\
    \ 文件系统的 microSD 卡上安装 Linux 时，镜像大小不得超过 4095MB！\n\n### 08 Linux Deploy 的特殊功能\n\n\
    ![](img/628186dda7facdc011bf39c938de3975_37_0.png)\n\nLinux Deploy 支持多种架构上的大量发行版。它目前支持在\
    \ ARM 和 x86 32 位及 64 位上安装 Debian、Ubuntu、Kali Linux、Arch Linux、Fedora、CentOS、Gentoo、openSUSE、Slackware\
    \ 或 RootFS。如果你更喜欢使用图形界面而不是终端来使用你的发行版，Linux Deploy 允许你使用 xterm、LXDE、Xfce、GNOME\
    \ 或 KDE。令人印象深刻！\n\n### 07 另一种选择 – Linux Deploy\n\n![](img/628186dda7facdc011bf39c938de3975_37_1.png)\n\
    \nComplete Linux Installer 通过在设备上启动预制镜像来工作，你需要手动下载和提取这些镜像才能让操作系统运行起来。另一种应用（也可在\
    \ Google Play 商店获取）是 Linux Deploy，它采取了略有不同的方法。\n\nLinux Deploy 本身是开源的，它在 microSD\
    \ 卡上创建磁盘镜像，挂载它并安装操作系统发行版。发行版的安装是通过从互联网上的官方镜像下载文件来完成的。与 Complete Linux Installer\
    \ 一样，该应用需要 root 权限。\n\n### ■ 运行自动化任务\n\n在通过 Tasker 启动你的 chroot 后，你可以轻松地发出额外的命令。我们使用我们的\
    \ chroot 轻松地将照片按需 rsync 到远程服务器 – 过程完成后，可以调用 'exit' 来关闭 chroot。使用 Tasker 的新文件触发器效果很好，你还可以添加一个“已连接\
    \ WiFi”的条件，以节省你的移动数据流量。\n\n## 使用 ubuntu-device-flash 工具\n\n以下设备均可以按照这里解释的 [安装说明](https://wiki.ubuntu.com/Touch/Install)\
    \ 配合 ubuntu-device-flash 正常工作。关于哪些功能正在正常工作的最新状态请参考这里。它们使用 system-image 系统进行安装并支持\
    \ OTA 更新。它们托管在 https://system-image.ubuntu.com\n\n| 设备 | 板卡名称 | 生产状态 | 来源 | 支持截止日\
    \ (EOL) | adb Recovery |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| Nexus\
    \ 4 | mako | 否 | Ubuntu 归档 | 未知 | 不适用 |\n| Nexus 7 2013 (仅 WiFi) | flo | 否 | Ubuntu\
    \ 归档 | 未知 | 不适用 |\n| 模拟器 (ARM) | generic | 否 | Ubuntu 归档 | 可能长期支持 | 不适用 |\n| 模拟器\
    \ (x86) | generic_x86 | 否 | Ubuntu 归档 | 可能长期支持 | 不适用 |\n| BQ Aquaris E4.5 Ubuntu\
    \ Edition | krillin | 是 | github.com/bq/aquaris-E4.5 (Ubuntu 分支) | 未知 | recovery-krillin.img\
    \ |\n| BQ Aquaris E5 Ubuntu Edition | vegetablehd | 是 | github.com/bq/aquaris-E5\
    \ (Ubuntu 分支) | 未知 | recovery-vegetablehd.img |\n| BQ Aquaris M10 HD Ubuntu Edition\
    \ | cooler | 是 | code.launchpad.net/~phablet-team/awila/+git/kernel3.10 | 未知 |\
    \ recovery-cooler.img |\n| BQ Aquaris M10 FHD Ubuntu Edition | frieza | 是 | code.launchpad.net/~phablet-team/awila/+git/kernel3.10\
    \ | 未知 | recovery-frieza.img |\n| Meizu MX4 Ubuntu Edition | m75 (arale) | 是 |\
    \ github.com/meizu/m75 | 未知 | recovery.img |\n| Meizu PRO 5 Ubuntu Edition | turbo\
    \ | 是 | github.com/meizu/m75 | 未知 | recovery-turbo.img |\n\n请注意，生产设备需要启用 adb 的\
    \ recovery 才能与 ubuntu-device-flash 配合工作，如 [askubuntu](https://askubuntu.com) 上所述。\n\
    \n我们在 Linux Deploy 中最喜欢的技巧之一是将 Linux 安装到 RAM 中。现代移动设备拥有不断增长的内存，例如 OnePlus 3 最近配备了令人印象深刻的\
    \ 6GB RAM。安装到 RAM 的缺点是，由于所有数据都存储在内存中，当设备重置时数据会丢失。\n\n与安装在 microSD 或内部存储上相比，RAM\
    \ 安装的性能预计非常良好。应用启动迅速，界面响应即时。安装也更快，只需几分钟。\n\n例如蜂窝网络连接；此外，作为一个测试质量的镜像，你应该预期会有大量的\
    \ bug！\n\n### 10 无需 Root 的 Linux 替代方案\n\n在整个指南中，我们谈论了在已 root 的设备上进行安装……但如果你没有\
    \ root，还有一个选择，即从 Play Store 下载的非 root（'nroot'）构建版本。我们检查了 pelya 制作的 'debian nroot'，顾名思义，你可以使用它在标准的\
    \ Android 设备上引导一个最小化的 Debian 安装。\n\n> nroot 的实现由 'proot' 项目促成，该项目在用户空间实现了 chroot、mount\
    \ -bind 和 binfmt_misc\n\n### 09 用 Linux 完全替换 Android\n\n让 Linux 与 Android 并行运行效果出奇地好，但它总给人一种额外操作系统硬塞上去的感觉。如果你想运行真正的原生\
    \ Linux，你有两个选择。第一个是购买真正的 Ubuntu 手机或平板电脑（如 BQ M10）。然而，如果你恰好拥有一台被 Ubuntu 用于测试其 “Touch”\
    \ 镜像的设备（如 Nexus 4），那么你也可以将 Linux 刷入它。\n\n详细信息可以在 Ubuntu 网站上找到 – wiki.ubuntu.com/Touch/Install。该过程涉及解锁你设备上的引导加载程序，下载适用于你设备的\
    \ Ubuntu 镜像，并使用 Fastboot 手动刷入它们。\n\n当然，该过程会擦除你的数据 – 如果将来你想回到 Android，你需要下载你设备的官方工厂镜像并刷入它们。请注意，如果你刷入原生\
    \ Linux，可能会失去一些功能\n\n虽然它比 root 选项在更广泛的设备范围内有效，但有一些注意事项。目前，该应用与运行 Android Marshmallow\
