  mdcn: "\n\n+   * Qcow2 – 这种格式的一个有趣之处在于，它不会立即消耗所有分配的空间，而是根据需求逐渐增长。\n+   * 其他格式 –\
    \ `qemu-img` 支持的其他格式包括 `vdi`、`vmdk`、`vpc` 等。你可以在命令提示符下输入 `man qemu-img` 以了解这些映像类型的更多详细信息：\n\
    \n```\n$ sudo qemu-img create -f qcow2 \\\n    -o preallocation=metadata /var/stuff/mine.qcow2\
    \ 8G\n```\n\n在上面的示例中，请注意 `qemu-img` 正在 `/var/stuff/mine.qcow2` 创建一个 qcow2 映像。我们为映像分配了\
