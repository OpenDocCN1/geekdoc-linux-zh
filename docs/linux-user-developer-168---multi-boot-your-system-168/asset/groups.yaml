    # ## deepin 15.2


    # **DISTRO**


    ![](img/628186dda7facdc011bf39c938de3975_87_1.png)


    > The Debian-based distribution''s latest update promises big things, but can
    it back them up?


    When it comes to standing the test of time, **deepin can claim to be one of the
    few that''s managed to stay current and continuously grow a user base**. While
    others have come and gone, deepin has grown into one of the most popular Debian-based
    distributions out there, with a thriving community that''s consistently looking
    to better the product. In its latest update, 15.2, a whole host of new options
    have been included, making it an even more attractive project for potential users
    to check out.


    While installation hasn''t changed, it''s still one of the more user-friendly
    processes around. From start to finish, the whole process only takes a few minutes
    and there''s nothing overly complicated that will stump new users. Both the 32-bit
    and 64-bit versions are now available for free from the official deepin site,
    depending on your desktop requirements. Of course, it''s when the installation
    of deepin has finished that the real fun can actually begin.


    +   - **RAM** 512mb

    +   - **Storage** 2GB

    +   - **Specs** Debian-based 64-bit and 32-bit versions'
  - '[PAGE 88]


    ![](img/628186dda7facdc011bf39c938de3975_88_0.png)


    ![](img/628186dda7facdc011bf39c938de3975_88_1.png)


    ![](img/628186dda7facdc011bf39c938de3975_88_2.png)


    ![](img/628186dda7facdc011bf39c938de3975_88_3.png)


    > > One of the more pleasing things about deepin has been the emergence of its
    own curated applications


    The deepin desktop is gorgeous throughout and has some nice nuances from both
    traditional Windows and Mac desktops, including docks, folder management and search
    systems. One of the biggest additions in the 15.2 update is the launcher interface,
    a fantastic way to segregate apps into different categories, without clogging
    your primary desktop screen. For end users, there''s also some noticeable speed
    improvements and while deepin has never really been touted as a CPU-intensive
    distribution, the amount of small bug fixes and optimisations have really helped
    here. It makes it a pleasure to use, with no task feeling like it''s too much
    for deepin to handle, with the only real limitations being your own hardware.


    Dig a little deeper into the desktop and you''ll find numerous changes to the
    Control Center, which has now been opened up to a series of potential customisations;
    including the implementation of different times zones and support for multi-monitor
    setups. While deepin does claim that its Control Center should be used as a hub
    for all actions users undertake on their desktop, it''s yet to really offer enough
    variety for users to properly get their teeth stuck into. It is, however, something
    that''s already been noted by the community, so expect to see further improvements
    in a later update.


    One of the more pleasing things about deepin has been the emergence of its own
    curated applications. The likes of Deepin Store, Deepin Music and Deepin Movie
    have all been tailored with the deepin design in mind, and as a package, it''s
    second to none. While the apps aren''t as powerful as some of their third-party
    counterparts, they''re heavily optimised for the deepin desktop, so performance
    is very good. Loading times are kept to a minimum and there''s a certain amount
    of cross-sync throughout, allowing users to connect the apps and share certain
    features. A new addition to the app selection in 15.2 comes in the form of RemoteAssistance,
    a handy tool where you can invite others to connect to your desktop. It provides
    the tools to diagnose problems with your desktop and the connection process takes
    just a few seconds to establish. Away from that, the app dock has been further
    optimised with new animations and bug fixes. Similar to other areas of deepin,
    there''s plenty of extra options regarding the dock that can help make it your
    own, but if you''re not too bothered about fancy animations and sounds, then there''s
    little here that will really pique your interest.


    Debian-based distributions are plentiful, but where many are marred by complicated
    setups and performance issues, deepin stands out in a league of its own. The latest
    15.2 update has helped to eradicate many of the smaller issues users were finding
    with it, but it''s also helped introduce a series of intuitive, new menus. If
    you''re more accustomed to Ubuntu, then this is arguably the best alternative,
    especially on Debian, that you''re going to find. And with an ever increasing
    user base, deepin will continue to grow.


    Oliver Hill


    # Pros


    Every part of this latest update works flawlessly and with plenty of customisation
    available, you can really make it your own


    # Cons


    Core apps are optimised well, but desktop lack the features found in many third-party
    alternatives


    # Summary


    If you''ve consciously stayed away from entering the world of Debian distro, deepin
    could very well be the distribution to help you finally make the transition. In
    terms of looks and functionality, there''s a lot of familiar ties to Ubuntu, but
    there''s also enough here to please new and seasoned users alike. Truly a great
    distribution that certainly demands your attention now.


