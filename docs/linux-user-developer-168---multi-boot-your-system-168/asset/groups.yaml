    way to smooth things out by giving Defrag more space to work with.


    ### Shrink it!


    With that, it''s time to reduce the size of the offending partition. As NTFS is
    a Microsoft affair, using the tools provided by the guys in Redmond is likely
    to be the best solution. Open the traditional control panel accessible via a right-click
    on the start menu, and proceed to changing it to traditional view. Next, click
    Administrative Tools and proceed to the Computer Management utility. Finally,
    open the Storage/Disk Management snap-in, and right click the partition currently
    used as Windows host. Then, select Shrink Volume in order to reduce its size to
    a more manageable version.


    ![](img/628186dda7facdc011bf39c938de3975_22_0.png)


    ## Install CentOS


    Feel like deploying enterprise software? Get Red Hat for free with CentOS


    ### 01 Install media


    Just like all other operating systems, the life of a CentOS installation starts
    out with the downloading of an ISO file. It must then be burnt onto a DVD or a
    USB stick (you can get the Minimal version via our disc this issue), which finally
    serves as boot-up media for your workstation of choice. Use the up and down keys
    to select Install CentOS 7 when prompted – the live mode feature of the installation
    medium is not particularly useful for this tutorial.


    ### 02 Pick language and keyboard


    CentOS''s installation process is squarely aimed at professionals. Even though
    the user interface tends to update quite quickly after selecting language and
    keyboard layout, visitors are well advised to wait until the colour symbols next
    to Installation Source and Software selection have disappeared. With that out
    of the way, a click on the Installation Destination callout is required to bring
    you into the disk configuration applet discussed in the next step.


    ### 03 Partition your disks


    Start out by selecting the hard disk you wish to use in the Local Standard Disks
    tab – network drives don''t play a role during the setup of a normal multiboot
    machine. Next, select the ''I will configure partitioning'' radio button in the
    Partitioning tab – forgetting to do so will lead to problems and potential data
    loss. Finally, click the big blue Done button on the top left side of the screen
    to get to the next step.


    ### 04 Set up the directory structure


    Set the partitioning scheme to Standard Partition. Next, click the Plus button
    at the bottom of the list shown on the left-hand side of the screen to create
    new mountpoints. Create a mountpoint for `/` with a size of at least 50 GB – the
    popup dialog takes values like “50GB” and converts them to the correct byte lengths
    automatically. Finally, click done twice to ignore the warning generated by the
    missing swap partition. Follow the instructions on-screen until CentOS is installed
    successfully.


    > Even though GParted can also handle NTFS, this is an option best avoided. All
    of the NTFS drivers in Unix, should, as a matter of principle, always be considered
    experimental and should never be allowed to write on files containing important
    data.

