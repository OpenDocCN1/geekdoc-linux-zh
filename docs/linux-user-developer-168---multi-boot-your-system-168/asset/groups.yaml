    \ 并不特别困难。\n\n#### 01 启动 Ubuntu\n\n前面提到的 USB 闪存盘或包含 Ubuntu 安装介质的本期光盘此时真的派上用场了——将其插入你的工作站并从中启动。接下来，在提示时选择“试用\
