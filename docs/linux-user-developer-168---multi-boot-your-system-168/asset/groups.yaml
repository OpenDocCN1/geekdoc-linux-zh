    \n**Mihalis Tsoukalos**\nMihalis Tsoukalos is a UNIX administrator, a programmer\
    \ (UNIX & iOS), a DBA, and a mathematician. He has been using Linux since 1993.\
    \ You can reach him at @macteosouk (Twitter) and his website: mtsoukalos.eu\n\n\
    **Resources**\nA text editor such as Emacs or vi\nThe Go compiler\n\n# # Explore,\
    \ create and use Go packages\n## Learn how to develop and use Go packages\n\n\
    **This tutorial will talk about creating and using Go packages.**\nPackages offer\
    \ a very convenient way of grouping related functions and variables and using\
    \ them as a set instead of individual components. Other programming languages\
    \ call packages modules or libraries. The main purpose of packages is to make\
    \ the design and implementation of software easier to understand and maintain.\n\
    \nPay special attention to this tutorial because, sooner rather than later you\
    \ will need to create and distribute your own Go packages. Additionally, make\
    \ sure that you thoroughly understand the part that talks about Go environment\
    \ variables, because using them correctly will make your life easier.\n\nThe next\
    \ tutorial in the Go series will talk about File I/O in Go, so stay tuned!\n\n\
    # ### About Go packages\n\nThe following code is the Go version of the classic\
    \ 'Hello World!' program:\n\n```\n```go\npackage main\nimport \"fmt\"\nfunc main()\
    \ {\n\tfmt.Println(\"Hello, world!\")\n}\n```\n```\n\nAs you can see, its first\
    \ line is **package main**. Put simply, all Go code must be delivered in packages\
    \ – if you find a function called main() in a package named main, then you are\
    \ dealing with an executable program; otherwise, you have a shared library. In\
    \ other words, what differentiates an autonomous Go program from a Go library\
