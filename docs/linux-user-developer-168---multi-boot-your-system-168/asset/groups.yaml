    上述命令的输出指示 CPU 是否支持 KVM 所需的相应 CPU 扩展。


    请注意，实际上还有一种更手动的方法来检查虚拟化支持。你可以检查 `/proc/cpuinfo` 文件中设置的 CPU 标志。使用常用的 `grep` 命令，你可以在该文件中搜索
    Intel-VT 支持 (vmx) 或 AMD-V 支持 (svm)。可以按以下方式操作：


