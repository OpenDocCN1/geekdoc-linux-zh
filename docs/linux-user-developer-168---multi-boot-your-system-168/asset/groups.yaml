    \n# Tam Hanna\nHas been benevolently likened to the James Bond villain Dr Zorin.\
    \ Said man’s handsomeness spawned a real-life contro systems company – a passion\
    \ shared with yours truly. Let Tam be your guide to discipline in the Bash space.\n\
    \n### Resources\n- Workstation with Bash shell\n\n## Bash masterclass\n\nTake\
    \ control of your Bash script's execution\n\nRunning scripts linearly is boring.\
    \ Fortunately, Bash provides a set of structures that modify the execution sequence.\n\
    \nDOS-based Bash files have resulted in a spoilt generation of programmers: their\
    \ largely linear execution entombed the perception of shell scripts as uninteresting\
    \ simpletons.\n\nThis could not be further from the truth: Bash provides script\
    \ coders with a set of control structures that justly deserve a comparison with\
    \ the ones found in programming languages such as JavaScript or C. When using\
    \ them intelligently, scripts can be customised on the fly; manual rewrites are\
    \ replaced by the analysis of the execution environment.\n\nEven more advanced\
    \ possibilities are opened up by the usage of the input handling features of Bash.\
    \ After having worked through the entirety of this tutorial, your scripts will\
    \ be able to poll your user in order to get input from them. This allows you to\
    \ increase the user-friendliness of your scripts even more – when done right,\
    \ your scripts will even be able to reject invalid input on the fly, thereby keeping\
    \ clumsy or technically uninitiated users safe.\n\nIn short: it always pays out\
    \ to learn more about Bash scripting. So – feel free to follow us down the rabbit\
    \ hole of advanced Bashery – don’t worry, we’ve got your back...\n\n### Tutorial\
    \ files available\nfilesilo.co.uk\n\n![](img/628186dda7facdc011bf39c938de3975_28_0.png)\n\
    \n![](img/628186dda7facdc011bf39c938de3975_28_1.png)\n\nAt the end of the last\
    \ tutorial (issue 166), our script was able to ask the user for the subject of\
    \ the emails to be sent. Let’s recapitulate by taking a look at a small example:\n\
    \n```bash\n#!/bin/bash\n\necho \"Enter title!\"\n\nread emailTitle\necho $emailTitle\n\
    ```\n\n```bash\nif [ $emailShorty == \"a\" ]; then\n\techo \"Alert, electronics\
    \ head detected!\"\n\temailTitle=\"Analogue electronics tutorial!\"\n\nelif [\
    \ $emailShorty == \"g\" ]; then\n\temailTitle=\"Review of gadget\"\n\nelif [ $emailShorty\
    \ == \"r\" ]; then\n\temailTitle=\"Review of book\"\n\nelse\n\techo \"Error\"\n\
    \texit\nfi\n```\n\nAfter the hashbang designating the file to be a Bash script,\
    \ we can now invoke the read command in order to get data from the command line.\
    \ It is then written out once again via the echo function.\n\nBash requires the\
    \ presence of the if clause; elif and else clauses are optional, but handy to\
    \ keep your shell script more compact.\n\nForcing users to enter long texts is\
    \ a classic dealbreaker in mobile: when working with desktop apps, it still should\
    \ be avoided in the interest of usability. One effective way to improve your program’s\
    \ behaviour involves guiding the user to their result.\n\nThe actual syntax of\
    \ the if clause is quite useful. Selectors come in curly brackets and are terminated\
    \ with a semicolon; the then clause starts the command list to be executed if\
    \ the matcher hits.\n\n> “Scripts will be able to reject invalid input on the\
    \ fly, keeping clumsy or technically uninitiated users safe”\n\n```bash\n#!/bin/bash\n\
    \necho \"Choose the material!\"\necho \"a...Analogue electronics tutorial!\"\n\
    echo \"g...Review of gadget\"\necho \"r...Review of book!\"\n\nread -n 1 emailShorty\n\
    ```\n\nHowever, there is one small niggle lurking for unsuspecting users. Be aware\
    \ that the `[` must have a trailing space, while the `]` needs a leading one –\
    \ if they are missing, errors similar to the ones shown in the figure will occur.\
    \ Furthermore, spaces are also needed on the left-hand and the right-hand side\
    \ of the `==` operator.\n\n`read` can be provided with one or more parameters\
    \ which modify the behaviour. Passing `-n 1` informs the command that we are looking\
    \ for just one character – the user does not need to press return. Be aware that\
    \ this can lead to awkward-looking console output – adding an empty `echo \"\"\
    ` after the `read` fixes the problem.\n\n### Short hand expressions\n\nAs the\
    \ collection of input from a specific set is an extremely common operation, Bash\
    \ provides a shorthand expression for it. Its use would simplify our program as\
    \ in the following:\n\n```bash\necho \"Choose the material!\"\n\nselect emailTitle\
    \ in \"a...Analogue electronics tutorial!\" \"g...Review of gadget\" \"r...Review\
    \ of book\"; do\n\techo $emailTitle\n\tbreak\ndone\n```\n\n### If this, then that!\n\
    \nRunning the code snippet above leaves you with a variable containing – ideally\
    \ – a single character’s worth of input. Transforming this into a usable e-mail\
    \ title requires the usage of a structure commonly known as a selection. It takes\
    \ its name from its habit of changing program execution in relationship to a variable.\
    \ The most primitive form is the if selection, which can be deployed like this:\n\
    \n```bash\n...\nread -n 1 emailShorty\necho \"\"\n```\n\nYou should be aware that\
    \ the break command is mandatory; the script will loop endlessly if you forget\
    \ to include it, which isn’t what you want at all. Breaking out of this is best\
    \ accomplished via the Ctrl + C sequence, which will lead you to the results shown\
    \ in the figure.\n"
