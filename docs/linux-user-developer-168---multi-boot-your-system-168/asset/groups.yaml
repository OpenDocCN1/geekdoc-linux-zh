    \ dd if=/dev/zero of=ubuntu.img bs=1MB count=0 seek=4096\n0+0 records in\n0+0\
    \ records out\n0 bytes copied, 0.000132431 s, 0.0 kB/s\npaul@xps13-ubuntu:~$ mke2fs\
    \ -F / ubuntu.img\nmke2fs 1.42.13 (17-May-2015)\nDiscarding device blocks: done\n\
    Creating filesystem with 1000000 4k blocks and 250480 inodes\nFilesystem UUID:\
    \ 14742810-5fca-4535-8a56-062a7304f2c6\nSuperblock backups stored on blocks:\n\
    \t32768, 98304, 163840, 229376, 294912, 819200, 884736\n\nAllocating group tables:\
    \ done\nWriting inode tables: done\nWriting superblocks and filesystem accounting\
    \ information: done\n\npaul@xps13-ubuntu:~$ sudo mount -o loop ubuntu.img / /cli\n\
    [sudo] password for paul:\npaul@xps13-ubuntu:~$ \n```\n```\n\nyou'll need to prepare\
    \ your own image. Fortunately, it's actually pretty straightforward.\n\nIn order\
    \ to create your own image, you first need to create the IMG file itself (an appropriate\
    \ size (4GB is a good place to start), by doing /dev/zero to a file and then using\
    \ mke2fs to create the file system itself. After mounting your new image, you're\
    \ ready to copy the actual Linux files to it.\n\nYou will need to obtain the RootFS\
    \ (Root File System) image for your distribution, built for the architecture of\
    \ your device (more than likely ARM). The Ubuntu image can be found at cdimage.ubuntu.com/ubuntu-core/xenial/daily-preinstalled/.\
    \ Copy (cp -r) the files across to your new image and finally, create a root/init.sh\
    \ script. This is used by the Complete Linux Installer app on startup – you should\
    \ copy the script from an existing image and tweak to suit your uploaded OS.\n\
    \nAfter completing the OS installation, the Linux Deploy app allows you to start\
    \ and stop services of the new Operating System through the UI. The app can also\
    \ manage SSH and VNC settings.\n\nInstalling a new operating system takes about\
    \ 30 minutes. The recommended minimum size of a disk image is 1024MB (with LXDE),\
    \ and 512MB without a GUI – bear in mind that when you install Linux on a microSD\
    \ card with the FAT32 file system, the image size must not exceed 4095MB!\n\n\
    # 08 Special features of Linux Deploy\n\n![](img/628186dda7facdc011bf39c938de3975_37_0.png)\n\
    \nLinux Deploy supports a large number of distributions on a variety of architectures.\
    \ It currently enables installation of Debian, Ubuntu, Kali Linux, Arch Linux,\
    \ Fedora, CentOS, Gentoo, openSUSE, Slackware or RootFS on both ARM and x86 32-\
    \ and 64-bit. If you prefer a Linux GUI to terminal use of your distribution,\
    \ Linux Deploy allows you to use xtrem, LXDE, Xfce, GNOME or KDE. Impressive!\n\
    \n# 07 An alternative option – Linux Deploy\n\n![](img/628186dda7facdc011bf39c938de3975_37_1.png)\n\
    \nComplete Linux Installer works by launching pre-made images on your device,\
    \ which you need to manually download and extract in order to get the operating\
    \ system up and running. An alternative app (also available in the Google Play\
    \ Store) is Linux Deploy, which takes a slightly different approach.\n\nLinux\
    \ Deploy, which is open source itself, creates a disk image on a microSD card,\
    \ mounts it and installs an OS distribution. Installation of the distribution\
    \ is carried out by downloading files from official mirrors over the internet.\
    \ As with Complete Linux Installer, the application requires root access.\n\n\
    # ■ Running automated jobs\n\nAfter launching your chroot using Tasker, you can\
    \ then easily issue additional commands. We’ve used our chroot to easily rsync\
    \ photos on demand to a remote server – after the process completes, ‘exit’ can\
    \ then be called to shut down the chroot. Using the Tasker new file trigger works\
    \ well, you can also add a ‘WiFi Connected’ condition to save your mobile data\
    \ allowance."
