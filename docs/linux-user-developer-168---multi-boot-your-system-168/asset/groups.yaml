    \ 实现运行良好，并且像最好的 Linux 项目一样是开源的。该应用由 'proot' 项目促成，该项目在用户空间实现了 chroot、mount -bind\
    \ 和 binfmt_misc。你可以在 github.com/proot-me/ 阅读更多详情。\n\n![](img/628186dda7facdc011bf39c938de3975_38_0.png)\n\
