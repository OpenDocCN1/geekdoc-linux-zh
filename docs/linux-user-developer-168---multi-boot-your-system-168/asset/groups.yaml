    # WPS 办公软件


    一款出色的设计能否弥补功能选择范围有限的缺陷？


    ![](img/628186dda7facdc011bf39c938de3975_82_0.png)


    独特的标签页（Tabs）功能是一个实用工具，可以轻松地同时管理多个演示文稿，而不会感到繁琐。


    ## 文档创建


    WPS 文字程序的核心在于一些优秀的格式化功能，使用户能够轻松调整页面上的各种元素。然而，该程序整体上较为基础，缺乏许多在大多数办公套件中相当常见的关键功能。但至少，它准确实现了你期望的所有核心功能。


    ## 电子表格工具


    在所有这里提到的办公套件中，WPS 表格程序可以说是最接近 Excel 的。它的布局非常好，使得查找和使用所提供的各种工具变得很容易，并且对于其中一些更高级的内容，还有助于提供支持。我们还会说，它是市面上最好的图表创建程序之一，拥有一些出色的编辑工具，以帮助尽可能精确地制作图表。


    ## 演示选项


    演示程序的情况与文字程序非常相似。虽然它设计巧妙，使用户容易找到所需的内容，但该程序本身仅具备最基本的功能。一个便捷的额外功能是能够使用标签页功能同时管理多个演示文稿，这在实践中效果显著。


    ## 额外功能


    WPS 办公软件能够建立良好声誉的关键原因之一，是它与广泛发行版的兼容性。无论你使用的是 Ubuntu、Fedora、CentOS、Mint 甚至是 Knoppix，都不会发现任何减速或明显的差异。


    ## 总体评价


    我们可以断言，WPS 办公软件是这一组产品中外观最美观的，但它缺乏我们在竞争对手中看到的广泛功能。只有当你只需要办公套件的最基本功能时，才值得考虑。


    ## FreeOffice


    一款由社区构建、服务于社区的办公软件


    ![](img/628186dda7facdc011bf39c938de3975_82_1.png)


    在 FreeOffice 的各个程序中，选项通常划分得当，这是一种避免界面过于拥挤的实用方式。


    ### 文档创建


    选项在两个面板之间划分得当，这有助于防止许多关键工具过于拥挤。虽然提供了一些有用的间距工具，但它们在 TextMaker 程序中的列表展示不佳，新用户最初可能很难找到这些工具可以为最终文档带来的巨大好处。


    ### 电子表格工具


    与 TextMaker 程序类似，PlanMaker 电子表格工具拥有大量选项，这些选项被巧妙地分散开来。基本的格式化选项可用于帮助美化电子表格，但在公式编辑方面帮助较少，而这正是许多竞争对手成功做到的地方。


    ### 演示选项


    可以说，FreeOffice 工具套件中最薄弱的程序是其演示程序。演示程序能很好地完成所有基本功能，但缺乏 LibreOffice 和 OpenOffice
    中的高级功能。动画功能可用于让幻灯片更生动，但在最终演示中会导致明显的卡顿。


    ### 额外功能


    虽然它可能缺乏一些竞争对手提供的额外程序，但通过 FreeOffice 网站可以获得一些出色的扩展。TextMaker 程序的扩展特别好，为用户提供扩展各种图表和表格创建选项的选择。扩展可以在每个程序中轻松启用和禁用，这对新用户是一个优势。


    ### 总体评价


    FreeOffice 的程序套件中没有真正突出的亮点，但它确实拥有令人印象深刻的扩展系统，这确实为其增添了一些价值。


    # 办公套件


    ## 简要概览：对比我们的评价


    | | OpenOffice | LibreOffice | WPS 办公软件 | FreeOffice |

    | :--- | :--- | :--- | :--- | :--- |

    | **文档创建** | 大量的选项选择因设计杂乱无章而受损 | 6 | 布局针对新用户进行了调整，增加了有洞察力的帮助章节 | 8 | 格式化工具充足，但其他领域感觉被忽视且过于基础
    | 6 | 选项分布在两个面板中，这是一种避免拥挤的好方法 | 7 |

    | **电子表格工具** | 便捷的数据透视表（DataPilot）工具对于批量导入原始数据特别有帮助 | 8 | 创建公式是特别亮点，在许多方面可与 Office
    的 Excel 媲美 | 8 | 创建图表是特别亮点，适合新用户和高级用户 | 8 | 数据输入良好，但在处理公式方面几乎没有功能，这是一个重大缺失 | 7
    |

    | **演示选项** | 这里有很多内容可以真正制作独特的演示文稿，而不会使其过于复杂 | 8 | 多用途是关键，手头有多种编辑选项可供操作 | 9 | 又是另一个过于简陋的案例，令我们不满意。编辑工具非常有限
    | 5 | 选项过于基础，在某种程度上落后于强大的竞争对手 | 6 |

    | **额外功能** | 额外程序是好东西，但对大多数普通用户用处不大 | 7 | 与社区保持联系有助于保持更新的快速和相关性 | 9 | 对多个发行版的支持帮助其在社区中保持流行
    | 7 | 独特的扩展套件使用户可以按照喜好定制核心程序 | 8 |

    | **总体评价** | 一个拥有大量选项和工具的软件套件，但糟糕的设计使其逊色 | 7 | LibreOffice 感觉是一个完整的软件包，对于需要免费办公套件的人来说是最佳选择
    | 9 | 虽然 Calc 是一个亮点，但其他领域对我们来说过于简陋 | 6 | 某些功能存在重大缺失，使得 FreeOffice 落后于其他产品 | 7
    |


    *注：原始 OCR 表格标题“CyberGhost”根据上下文和前文部分被识别为“FreeOffice”的拼写错误。*


    ## 获胜者是……


    ### LibreOffice


    在选择办公套件时，许多人会立即转向 Microsoft 套件。但除非你手头有 50 英镑的闲置资金，否则你很可能不愿花费辛苦赚来的钱。如果这次团体测试能证明什么，那就是有一些极好的替代方案，下载到你桌面上一分钱都不用花。在我们测试的四款产品中，LibreOffice
    被证明是一个完整的软件包。


    在其许多关键领域，它步步紧追 Microsoft 套件，在某些领域甚至超越了它。虽然它的功能集没有什么革命性的，但它确实拥有既能满足新用户又能满足资深用户的工具。特别是新用户，在这里会感到非常亲切，因为程序和社区中随时都有大量的帮助支持当他们遇到困难时。


    但虽然社区在需要技术支持时很棒，它们也是推动 LibreOffice 持续发展的力量。更新频繁，开发人员不断与社区联系，以了解下一个更新需要包含和修复的内容——但愿更多程序能效仿这种做法。


    ![](img/628186dda7facdc011bf39c938de3975_83_0.png)


    如果你下载了 LibreOffice 但似乎无法掌握它，不用担心，因为 OpenOffice 和 WPS 办公软件都是可行的替代方案。它们各自与 LibreOffice
    的做法略有不同，但请做好在某些功能上做出牺牲的准备。特别是 WPS 办公软件，可以在某些领域进行自定义，因此对于特别挑剔的人来说是一个合适的选择。但毫无疑问，LibreOffice
    是想要尝试新办公套件的 Linux 用户的首选。


    **奥利弗·希尔（Oliver Hill）**


    ![](img/628186dda7facdc011bf39c938de3975_84_0.png)


