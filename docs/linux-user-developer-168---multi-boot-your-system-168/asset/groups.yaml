    tab interface — the List Configuration tab lists the various operating systems
    configured, while the General settings tab allows you to customise the waiting
    time and the default entry selected after machine power-up.


    # Change its looks


    Most of the action takes place in the "Appearance settings" tab. Peruse its various
    options to adjust background colours, set wallpaper and/or change the font used
    to display GRUB’s menus. Finally, increase the display resolution if you feel
    like it — but be aware that this operation can be a little risky.


    When done, click the Save button in the toolbar in order to commit the settings
    to GRUB’s configuration. GRUB Customizer will run the process for you — simply
    reboot and enjoy the results.


    ![](img/628186dda7facdc011bf39c938de3975_18_0.png)


    # Configure GRUB


    GRUB’s settings can also be changed from the command line. Here’s the nitty gritty


    # 01 What’s what?


    GRUB finds its settings at runtime by parsing the file **/boot/GRUB/GRUB.cfg**.
    Editing it directly, however, is considered an antipattern — instead, the settings
    found in **/etc/default/GRUB** are to be transpiled into a .cfg file using the
    `sudo update-GRUB` command. While not adhering to these rules does not usually
    lead to a non-working system, be aware that GRUB and kernel updates sometimes
    cause a complete recompilation of the GRUB config. In that case, any changes applied
    by hand will be lost and cannot be recovered easily.


    # 02 Get editing


    The user-facing settings — think waiting times, backgrounds and the like — are
    stored in the file **/etc/default/GRUB**. It can be opened by entering `sudo gedit
    /etc/default/GRUB` into a terminal, *without* a colon — the editor will then pop
    up automatically.


    Windows 3.x diehards will recognise the syntax immediately — it is derived from
    the traditional .ini files. Parameters take the form NAME = VALUE, while lines
    beginning with a # are considered comments. GRUB’s developers provide a bit of
    documentation in the file — some minor edits can be handled without getting further
    information from the Internet.


    ![](img/628186dda7facdc011bf39c938de3975_18_1.png)


    # 03 Make your changes


    The parameters and their syntax differ from GRUB release to GRUB release. Consulting
    the documentation of the GRUB version used on your machine is the most sensible
    approach — Google really is your friend here.


    # 04 Apply the changes


    As discussed in step 1, changes to the configuration file are not committed to
    storage automatically. Instead, the `update-GRUB` command must be invoked from
    a terminal.


    Running the command is interesting as it emits a list of all bootable volumes
    used in the current active configuration — if you miss an important operating
    system, rebuilding GRUB and checking the presence of its loader in the output
    of the utility makes great sense.


    ![](img/628186dda7facdc011bf39c938de3975_18_2.png)


    Above GRUB can also be used via the command line'
  - '[PAGE 19]


    # Feature


    # Multi boot your machine


    # Start with Windows


    Be it CAD, EDA or Visual Studio – running Windows is required at times


    The following tutorial assumes that a newly commissioned single-disk workstation
    is to be populated with a variety of operating systems. Our first candidate is
    a preview version of Windows 10, which can be downloaded from the Windows Insider
    program (https://insider.windows.com/) after signing up and agreeing to the terms
    and conditions. Next, proceed to burn it onto a DVD or an USB stick. Finally,
    insert it into your workstation and set it as the start-up medium.


    ![](img/628186dda7facdc011bf39c938de3975_19_0.png)


    ![](img/628186dda7facdc011bf39c938de3975_19_1.png)


    # 01 Set up language and more


    Windows 10’s setup process starts out by asking you to specify the language and
    keyboard settings; this is important as it makes sure that the keyboard behaves
    correctly during the setup process. Next, click “Install Now” to start the actual
    deployment process. At the current stage of the proceedings, the entering of the
    serial number can be skipped via the “I don’t have a product key” label at the
    bottom of the third screen of the setup wizard.


    ![](img/628186dda7facdc011bf39c938de3975_19_2.png)


    # 03 Go custom!


    Selecting the default installation process makes Windows occupy the entire partition
    of the workstation. People working on a multi-boot workstation must instead select
    the option “Custom: Install Windows only (advanced)”, after which the Windows
    setup process will proceed to display an overview of the hard disks currently
    installed in the workstation. The setup routine will display both populated and
    unpopulated space – for us, only those parts described as “Unallocated Space”
    are interesting as they can be filled with new partitions without data loss.


    ![](img/628186dda7facdc011bf39c938de3975_19_3.png)


    # 05 Stand by for action


    When the setup partition is identified, the actual setup process can be kicked
    off. Even though Microsoft has made significant optimisations to improve the deployment
    speed, installing Windows 10 can still take half an hour or more. Be aware that
    the operating system will download a lot of updates during the process – it should
    not be done when your PC is connected to a metered network. Finally, don’t worry
    if the machine reboots a few times during the installation process.


    ![](img/628186dda7facdc011bf39c938de3975_19_4.png)


    # 02 Fix technicalities!


    Microsoft bundles the Home and Pro versions of Windows 10 in one ISO file. Select
    the version that you want to use – consult your licensing agreement with Microsoft
    to find out which one you are entitled to use. In the next step, the EULA must
    be accepted; not agreeing to Microsoft’s terms and conditions ultimately means
    that you will not be allowed to install Windows on your machine.


    ![](img/628186dda7facdc011bf39c938de3975_19_5.png)


    # 04 Set-up partition structure


    Windows 10 can be productively used with about 60GB worth of hard drive space;
    developers seeking to deploy Visual Studio should allocate at least 80GB. Sadly,
    Microsoft’s installation routine will grab the whole disk space by default – enter
    a smaller value in the input window. Furthermore, confirm the dialog box informing
    you about the creation of an additional, 500MB partition needed for running and
    maintaining the NTFS file system.


    ![](img/628186dda7facdc011bf39c938de3975_19_6.png)


    # 06 Complete userland settings


    The final configuration of Windows is handled via a set of apps running inside
    the completed operating system. Each user has his own personal preferences here
    – some want to connect their local user account to Windows, while other users
    are not interested in that particular luxury. In principle, select as you see
    fit – most of the decisions can be changed afterwards if you find out that they
    are completely unsuitable to you.'
  - '[PAGE 20]


    # # Installation order


    # ## Windows, then Linux


    Recent Linux distributions come fully equipped for coexistence scenarios: if the
    deployment process detects the presence of a Windows-based operating system, it
    will usually be added to the GRUB bootloader automatically. This means that no
    further manual intervention is needed: everything works out of the box.


    When a fresh workstation is being commissioned from scratch, time can be saved
    by instructing the Windows installer to leave part of the hard disk untouched.
    It can then be formatted during the Linux installation process without having
    to resort to partition messing.


    # ## Linux, then Windows


    Installing Windows last causes trouble. The first issue tends to be the shrinking
    of the partitions - if a second hard disk can be installed doing so is often the
    better choice, as the Windows installer sometimes messes up partitions. Be careful
    to have a bootable USB stick or rescue DVD on hand in order to restore the bootloader.
    Finally, be aware that virtual machines can be a nice alternative: if you aren''t
    into gaming and can live without UWP emulators, VirtualBox provides more than
    decent performance on recent hardware.


    ![](img/628186dda7facdc011bf39c938de3975_20_0.png)


    # # Types of distro

    Get to know the variations


    ![](img/628186dda7facdc011bf39c938de3975_20_1.png)


    **Everyday**

    # Ubuntu


    You might not love Mark Shuttleworth''s operating system. It, however, has done
    more for desktop Linux than most other distros and is excellent for everyday use.
    It''s also great for beginners.


    ![](img/628186dda7facdc011bf39c938de3975_20_2.png)


    **Enterprise**

    # CentOS


    Take Red Hat''s legendary reliability and remove the commercial support to end
    up with CentOS. If you ever felt a need to self-host a data centre, advanced enterprise
    software, this might save you a lot of money!


    ![](img/628186dda7facdc011bf39c938de3975_20_3.png)


    **Everyday**

    # Debian


    Being the distribution that brought the world the apt package manager definitely
    earns Debian a place in this list. It is a decent everyday Linux for all who dislike
    Mark Shuttleworth...


    ![](img/628186dda7facdc011bf39c938de3975_20_4.png)


    **Security**

    # Kali Linux


    Reach out and touch a computer system in true Hacking Style. This Debian-derived
    distribution comes with a set of utilities useful for penetration testing and
    forensic analysis.


    ![](img/628186dda7facdc011bf39c938de3975_20_5.png)


    **Oddball**

    # Chromium


    The operating system powering Google''s feature-reduced micro notebooks can also
    run on your workstation of choice - but be aware that this distro limits you to
    web apps!


    ![](img/628186dda7facdc011bf39c938de3975_20_6.png)


    **Traditional**

    # Slackware


    Slackware can best be described as a living fossil. The oldest still-updated distro
    allows you to get close to the bone - any true Linux head should take it for a
    spin!'
