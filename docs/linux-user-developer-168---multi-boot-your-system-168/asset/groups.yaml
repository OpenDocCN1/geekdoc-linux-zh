  mdcn: "\n\n# 在 Android 上运行 Linux chroot\n\nAndroid 基于 Linux 并使用 Linux 内核，这使其成为运行\
    \ chroot 的理想环境\n\n![](img/628186dda7facdc011bf39c938de3975_35_0.png)\n\n- **保罗·奥布莱恩**\n\
    \  保罗是一位专业的跨平台软件开发者，在部署和维护 Linux 系统方面拥有丰富经验。基于 Linux 构建的 Android 也是保罗的专长领域之一。\n\
    \n**为什么你要想在 Android 设备上运行完整的 Linux？**\n这是我们在提到手机上可以访问完整的 Debian 安装时经常被问到的问题。实际上，它的用途比大多数人想象的要多（当然，作为一名\
    \ Linux 用户，你本来就比大家更了解这一点）。能够搭建完整的 LAMP 栈非常实用，我们可以快速且轻松地访问所有喜爱的 Linux 工具，甚至可以使用\
    \ Linux 构建作为选项，通过经典的 rsync 与设备进行内容同步。\n\n为了能够在 Android 设备上的 chroot 环境中运行 Linux，有几个前提条件。首先，你需要获得设备的\
    \ root 权限。这并不令人惊讶，因为我们将在最低层与 Android 系统集成。其次，你需要运行支持环回设备（loop devices）的内核。如果你的内核不支持，你可以选择自己编译内核，前提是制造商已提供源代码。最后，你需要充足的存储空间和\
    \ RAM。microSD 卡可以为你的 Linux chroot 提供额外的存储空间，但请记住，它通常比内部存储慢得多，因此如果你的设备空间充足，使用内部存储效果会更好。\n\
    \n## 01 确保拥有 root 权限\n\n在 Android 设备上安装 Linux chroot 之前，你最重要的需求是 root 权限。Root\
    \ 赋予你对设备系统的完全访问权限，并允许你执行设置 chroot 所需的基本功能。Android 设备出厂时并未预置 root，因此你需要在给设备获取 root\
    \ 权限后才能继续。\n\n具体流程因设备而异，但通常包括解锁 bootloader（通过你的设备制造商网站）、刷入自定义恢复模式以及最后刷入名为 SuperSU\
    \ 的 root ZIP 文件。请注意，解锁 bootloader 可能会影响你的保修，并且拥有 root 权限，就像在“正规”的 Linux 系统中一样，赋予了你更多对设备造成破坏的潜在可能。请谨慎操作！\n\
    \n![](img/628186dda7facdc011bf39c938de3975_35_1.png)\n\n在安装 SuperSU root 二进制文件后，安装一款如\
    \ Google Play 商店中的 Root Checker 等应用，以确认一切运行正常。当 Android 上的应用请求 root 权限时，会显示一个确认对话框——这确保了系统中的应用无法在不知情的情况下使用\
    \ root 权限进行恶意操作。\n\n## 02 下载完整的 Linux 安装程序\n\n在设备上获取 Linux 发行版最快且最简单的方法是使用来自 Play\
    \ Store 的 Complete Linux Installer。首次启动时，该应用将安装启动 Linux 所需的脚本和 Busybox 二进制文件。该应用支持多种发行版，包括\
    \ Ubuntu、Debian、Arch、Kali、Fedora 和 openSUSE。系统将检查你的架构类型，应用中的“安装指南”部分将指示哪些发行版与你的手机或平板电脑兼容。在开始安装之前，请确保已启用\
    \ USB 调试并有充足的存储空间。\n\n要启用 USB 调试，请打开“设置 > 关于”菜单，轻点“版本号”五次以显示“开发者选项”菜单，然后从“开发者选项”菜单中勾选“USB\
    \ 调试”选项。\n\n![](img/628186dda7facdc011bf39c938de3975_36_0.png)\n\nComplete Linux\
    \ Installer 应用本身只是一个 2.4MB 的下载。为了效率，发行版镜像是根据需求下载的——你可以从安装指南的第二页开始下载。\n\n使用 Explorer\
    \ 或 File Commander 等应用解压镜像和 MDS 文件（完成后你可以删除 download.zip）。\n\n## 04 首次启动 Linux\n\
    \n在你解压镜像并安装 Terminal 以及可选的 VNC 伴侣应用后，你就准备好启动了！\n\n启动 Linux 有几种选择——你可以使用 Complete\
    \ Linux Installer 应用（参见侧边菜单中的“启动”选项），或者你可以将小部件添加到主屏幕。请注意，根据你设备的性能不同，镜像完成首次启动可能需要几分钟时间，所以请耐心等待！\n\
    \n在你的发行版启动后，系统将提示你设置 root 密码，然后你就可以随心所欲地使用这个 chroot 了！输入 `exit` 以关闭（你应该尽量记住这样做，这既是为了电池续航，也是为了保护文件的完整性）。\n\
    \n![](img/628186dda7facdc011bf39c938de3975_36_1.png)\n\nComplete Linux Installer\
    \ 应用允许你配置 VNC 会话的分辨率选项——你应该确保它们与你设备的分辨率匹配。\n\n## 05 在 chroot 中安装额外的应用\n\n一旦你的\
    \ Linux chroot 运行起来，你可能会想要安装额外的应用（特别是如果你安装了一个小型或核心系统镜像）。由于你将通过 Terminal 以 root\
    \ 身份登录，你可以以常规方式进行操作——使用你的发行版的包管理器。二进制文件将自动为你的当前架构（ARM 或 x86）下载，因此一切都应该像在“真正的”Linux\
    \ 机器上那样工作。\n\n> Terminal 应用用于通过 shell 连接到你的 chroot，而 VNC Viewer 允许你连接到图形用户界面（GUI）\n\
    \n## 03 安装 Linux 镜像和伴侣应用\n\n当你开始下载 Linux 发行版镜像时，系统会提供几个选项。有“大型”、“小型”和“核心”版本的镜像可用。大型镜像包含核心操作系统和一系列额外的应用，如\
    \ OpenOffice；小型镜像仅包含基本的附加组件，如网络浏览器和 Java；而核心（Core），顾名思义，仅包含操作系统本身。\n\n在主镜像下载的同时，下载建议的伴侣应用是个好主意。Terminal\
    \ 应用用于通过 shell 连接到你的 chroot，而 VNC Viewer 允许你连接到图形用户界面（GUI）。\n\n![](img/628186dda7facdc011bf39c938de3975_36_2.png)\n\
    ![](img/628186dda7facdc011bf39c938de3975_36_3.png)\n\n发行版镜像以 ZIP 文件形式下载，在启动 Linux\
    \ 之前，需要将其解压到内部或外部 SD 卡的根目录。下载完成后，使用\n\n你应该避免使用内置的更新工具来更新你的发行版——这几乎肯定会引发问题并阻止系统启动。相反，如果你希望使用最新版本，你需要构建自己的定制镜像。\n\
    \n如果你安装了许多额外应用，可能会遇到空间问题。增加可用空间最简单的方法是制作一个新的、更大的、空的镜像，并将内容从旧镜像复制过来（使用 `cp -rp`\
    \ 以保留权限）。\n\n## 06 准备你自己的镜像\n\n由于你无法以常规方式更新 Android 设备上正在使用的 Linux 镜像，如果你希望使用所选发行版的最新版本，\n\
    \n## 与 Tasker 集成\n\n除了从 OSK 商店、`linux-installer-app` 或使用提供的小部件手动启动你的 chroot 外，你还可以使用\
    \ Tasker 自动化你的 Linux 安装。当你手动启动 chroot 时，请留意一条命令：它是被使用的，你可以从 Tasker 脚本中调用它。你甚至可以发送额外的命令：`cd\
    \ /path/mydir` 和 `speed = useful_task`。\n\n### 资源\n\n- SuperSU\n  bit.ly/1fpnTbt\n\
    - Root Checker\n  bit.ly/192WqN\n- Complete Linux Installer\n  bit.ly/282jnRw\n\
    - Linux Deploy\n  bit.ly/297WGf4\n- Ubuntu Touch\n  wiki.ubuntu.com/\n  /Touch/Devices\n\
    \n![](img/628186dda7facdc011bf39c938de3975_35_2.png)\n\n**右** 除了终端模式，你甚至可以在 Android\
    \ 设备上运行完整的 Linux 桌面！\n\n"
