    # 亮点


    **Mint**

    Linux Mint 18 “Sarah” 的测试版发布时引起了轰动，承诺在设计上和整体易用性上进行广泛改变。对于新用户来说，它仍然是最容易上手的发行版之一。


    **Fedora**

    随着 Fedora 26 的发布，预计 Fedora 在未来几个月排名将大幅上升。一如既往地，有三个不同的附加组件可供测试，每个都带来独特的功能集。


    **elementaryOS**

    时尚的 elementaryOS 本月也发布了重大更新，其 Loki 测试版提供了大量主要修复，团队声称已解决了 600 多个问题。


    # 最新可用发行版：


    fileso.co.uk


    # 采访 Reynold Xin


    ## 让数据处理变得简单


    Apache Spark 是市场上最受推崇的数据处理引擎之一，但它为什么如此出色？Reynold Xin 将作出全面解释。


    ![](img/628186dda7facdc011bf39c938de3975_9_0.png)


    **Reynold Xin**

    Reynold Xin 是 Apache Spark 项目管理委员会成员，Databricks 的首席架构师和联合创始人。他创下了 100TB 排序的 2014
    年世界纪录，以比 Apache Hadoop 高 30% 的单节点效率打破了前纪录。


    ![](img/628186dda7facdc011bf39c938de3975_9_1.png)


    > Apache Spark 是一个快速且通用的数据处理引擎，主要被数据工程师、数据科学家和业务分析师使用。它提供了 Scala、Java、Python、R
    和 SQL 的高级 API。它还支持一系列丰富的高级工具，使其对机器学习、图计算、流数据处理、ETL 和商业智能具有吸引力。从某种程度上说，它是数据处理的瑞士军刀。


    Spark 最初由 Matei Zaharia 于 2009 年在加州大学伯克利分校启动，并于 2013 年 6 月捐赠给 Apache 软件基金会。Spark
    在 2014 年 2 月成为 Apache 顶级项目（TLP）。


    Apache Spark 在广泛的行业中被企业快速采用。像 Netflix、Yahoo 和腾讯这样的互联网巨头已大规模部署 Spark，共同处理数 PB 的数据。当你考虑到世界上一些最大的公司已经采用了
    Apache Spark 时，它仅表明了有多少人相信它。它迅速成为大数据领域最大的开源社区，拥有超过 1,000 名代码贡献者，以及 420 个 Apache
    Spark 聚会小组中的超过 187,000 名成员。


    然而，我们一直在寻找持续扩大社区的方法，并且有很多方法可以让感兴趣的人参与到 Apache Spark 的未来发展中。


    一个有趣的细节是，根据 StackOverflow 的 2016 年调查，Apache Spark 已成为美国薪酬最高的技术技能（了解 Spark 的开发者更有可能获得最高收入）。如果问我的话，这是一个相当惊人的事实。


    用户将 Apache Spark 集成到其系统中的难度如何？


    使用 Spark 主要有两种方式。第一种是交互式地使用引擎本身。第二种是将 Spark 作为库嵌入到数据应用中。两者需要非常不同的工具和属性。


    尽管 Spark 过去主要用作大数据处理引擎，但该引擎也能在单台机器上顺利运行。许多用户在笔记本电脑上使用 Spark，要么对数据应用进行单元测试，要么直接交互式地分析少量数据。为此，用户只需下载来自


