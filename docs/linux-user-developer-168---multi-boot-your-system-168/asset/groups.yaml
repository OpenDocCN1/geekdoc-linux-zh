    ![](img/628186dda7facdc011bf39c938de3975_77_1.png)


    ![](img/628186dda7facdc011bf39c938de3975_77_2.png)


    # **08**  Inserting the battery contacts


    We found that the positive and negative terminals could move around, especially
    when no batteries were inserted. You may want to put a dollop of hot glue or hockey-stick
    tape behind the positive and negative terminals so that they remain in place when
    going over bumps or when inserting new batteries. You will find that the wires
    thread through the bottom of the compartment and we now have six sets of wires
    in total.


    # **09**  Mounting the front wheels


    We will now mount the front set of wheels that drive the tracks. Find the shallow
    side of the wheel and let it point out, then slowly but firmly push the plastic
    wheels down onto the shaft of the motor. Try to make sure these line up with the
    free-running wheels we installed in step 3. You will be able to turn the motors
    by hand but it is not recommanded – just check that they are able to turn freely
    without rubbing on the plastic wheel arches.


    ![](img/628186dda7facdc011bf39c938de3975_77_3.png)


    ![](img/628186dda7facdc011bf39c938de3975_77_4.png)


    # **10**  Getting the tracks on


    Our robot runs on two sets of rubber tracks which are elastic enough to stretch
    over the two sets of front and rear wheels. With the teeth of the track facing
    in, place the track on one wheel then stretch it very carefully over the other
    side. Before going any further find two more nuts and bolts and secure the opposite
    end of the chassis next to the battery terminals. You will need your cross-head
    screw-driver again.


