    ![](img/628186dda7facdc011bf39c938de3975_14_0.png)


    and so let us begin by way of explanation. A stack is simply a region of memory
    used by running functions within a larger program for their local variable storage.
    When you as a programmer declare a local variable in the source code of a software
    function, that local variable lives on the (thread) stack. The variable is automatically
    allocated; you as a programmer do nothing further to cause actual memory to be
    found for this data.


    Contrast this with the more general notion of a ''heap'' – broadly speaking, the
    rest of memory other than that used to store program code or the content of files
    – which is specifically managed through calls to ''malloc'' and ''free'' functions
    in C-based user programs (or by a language runtime). Within the kernel, these
    functions have the counterparts ''kmalloc'', ''vmalloc'', ''vfree'' and ''kfree''
    (''v'' prefix for virtual memory allocation, ''k'' for the low level kernel physical
    memory allocator). User programs don''t worry about allocating space on their
    local thread stacks, because the kernel (silently) does it for them. When programs
    try to access stack space beyond (beneath for common downward growth stacks) the
    current stack, the kernel allocates space during a resulting page fault – the
    application doesn''t even notice.


    Within the kernel, things are a little more complicated. The kernel can''t rely
    upon software beneath it magically allocating its stacks, so it does this through
    explicit management. One side effect is that the kernel has a fixed size stack.
    This means no large allocations (of data structures) are allowed on the stack
    within kernel code – lest the kernel exceed (or overflow) its stack. Such an event
    is typically catastrophic: It can be detected, and will minimally result in an
    oops and the destruction of whatever program is currently running, if not a full
    system crash. Thus great pains are taken to reduce the maximum ''stack depth''
    of the kernel: that is the maximum stack utilisation caused by certain code paths,
    often in complex filesystem code involving network based volumes.


    Every Linux desktop could experience a stack overflow. Over the years, the kernel
    stack has been split out into one stack per running thread (this is just the stack
    used by the kernel itself in servicing a thread, not the threads'' user visible
    stack), and a separate interrupt stack for use while servicing hardware interrupts
    from external devices. Just for good measure, the stack is periodically increased
    in size (typically it''s a couple of pages (8-16K on x86 and other architectures)
    and is traditionally allocated from the low-level kernel allocator using physically
    contiguous memory. Andy''s patchset changes this to using the virtual memory (vmalloc)
    interface for kernel stack allocation, amongst several other nice changes and
    benefits that result.


    The use of virtual memory for kernel stacks cleverly avoids the need for physically
    contiguous memory page allocations. This has potential to greatly reduce pressure
    upon the virtual memory system, especially when extremely large numbers of tasks
    (programs, or threads) are running on a given system. As an added benefit, Andy
    is able to introduce special guard pages either side of the now much more manageable
    kernel stack that serve as proverbial canaries, taking the impact of a stack overflow
    rather than whatever random memory happened to be below the stack before. Existing
    systems typically store a special ''thread_info'' structure at the base of the
    kernel stack, with vital information about a running program (such as where all
    of its associated data structures are stored in memory) and so this would often
    be the target corruption of a kernel stack overflow. The resulting outcome was
    seldom good for system stability, but will be much cleaner.


    Virtually mapped stacks won''t likely make it into Linux for at least several
    kernel development cycles. Even if they can be contained to a CONFIG_VMAP_STACK
    configuration option (that is initially only enabled on certain architectures
    (x86) and gradually bleeds into the rest, such a change is disruptive enough to
    find itself further corner cases. But we should still look forward to this and
    similar exciting work over the coming months.■'
