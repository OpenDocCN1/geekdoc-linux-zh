    对于读者来说，Linux 4.7 中最有趣的功能可能是并行目录查找。Linux 提供的各种文件系统（如 xfs、btrfs 和 ext4）使用一种称为虚拟文件系统（VFS）的通用基础设施。VFS
    提供了一种抽象的目录层级概念，各个底层文件系统可能以不同方式实现它。目录层级从 /（根目录）开始，向下延伸到 /usr/bin 和 /home/your_name
    等目录。每当应用程序需要查找文件（例如用户登录 shell 程序所需的 /bin/bash）时，它需要从 / 开始遍历文件系统。


    执行目录遍历（即所谓的 directory walk）是一项相当昂贵的操作，因为内核首先查找 /，然后在名为 / 的目录中查找 /bin/，最后在 “/bin/bash”
    中查找 “bash”。对于一个相对较短的路径，这需要三次查找（但读者们都知道，随着更多的 / 出现，路径往往要长得多），如果系统繁忙且读取中间目录数据的 IO
    操作必须等待（阻塞）其他 IO，情况会更糟。出于这些原因，Linux 实现了目录缓存（dcache），它存储最近使用的目录信息，使系统能够立即通过单次查找操作解析
    /bin/bash 在磁盘上的位置。


    由于使用频率极高，dcache 是内核中性能最敏感的区域之一，然而直到现在，它一直遭受一个相当不幸的瓶颈困扰：对同一目录内条目的并行查找会被串行化（一个接一个地进行）。因此（例如），查找
    /bin/bash 和 /bin/ls 将是一个串行操作。将这个逻辑乘以一个繁忙系统上的成千上万个进程（任务），这会严重削弱性能。这是应用程序存储在磁盘上的某些数据被优化为使用大量较小目录（如
    web 缓存、邮件软件等）的原因之一。Linux 4.7 最终将引入并行目录查找并消除这一瓶颈。


    我们将在下一期中对 Linux 4.7 的发布进行全面总结，并介绍为纳入 Linux 4.8 而准备的功能。


    ### 虚拟映射的内核堆栈


    Linux 内核社区是一个庞大且蓬勃发展的社区，由一千多名个人贡献者组成。然而，社区中的许多核心工作是由一个规模小得多的“惯犯”群体完成的，他们大多由大型企业资助。因此，看到新鲜的新血液涌入核心开发社区总是令人耳目一新。在过去几天里，AMAP
    Capital（一家由 Andy Lutomirski 共同创立的对冲基金和自动外汇交易机构）的 Andy Lutomirski 越来越积极地作为推动 Linux
    内核中新颖且巧妙新技术的驱动力。


    确实，这些优化中的许多都集中在性能关键领域——因此对 Andy 和他的公司都有商业价值，因为它们受益于低延迟的交易操作——但今天大多数内核开发者的许多其他内核贡献也可以说是出于同样的企业动机。Andy
    最新的此类贡献是一组用于虚拟映射内核堆栈的概念验证补丁。这些补丁引入了一个新的内核配置选项 CONFIG_VMAP_STACK，并进行了许多相关变更，以纠正多年来其他内核核心代码和驱动程序对内核堆栈性质所做的假设。要了解这一切的含义，让我们更详细地看看内核堆栈。


    在一个更高级脚本语言日益普及的世界里，许多今天的程序员不必直接处理底层架构细节，例如内存中的堆栈。在现代世界中，这些通常由底层语言运行时自动管理。但它们仍然存在，尤其是在
    Linux 内核中，因此让我们开始进行解释。堆栈只是运行中的较大程序内的函数用于局部变量存储的内存区域。当你作为程序员在软件函数的源代码中声明一个局部变量时，该局部变量存在于（线程）堆栈上。变量是自动分配的；你作为程序员不需要做其他任何事情来为这些数据找到实际的内存。


    将其与更通用的“堆”概念进行对比——广义上讲，除了用于存储程序代码或文件内容的内存之外的其余部分内存——它通过 C 语言用户程序中对 ''malloc''
    和 ''free'' 函数的调用（或由语言运行时）专门管理。在内核中，这些函数有对应的 ''kmalloc''、''vmalloc''、''vfree''
    和 ''kfree''（''v'' 前缀代表虚拟内存分配，''k'' 代表底层内核物理内存分配器）。用户程序不必担心在本地线程堆栈上分配空间，因为内核（默默地）替它们做了这件事。当程序试图访问超出（对于常见的向下增长堆栈则是下方）当前堆栈的空间时，内核会在由此引发的缺页中断期间分配空间——应用程序甚至不会察觉到。


    在内核中，事情稍微复杂一些。内核不能依赖其下方的软件神奇地分配其堆栈，因此通过显式管理来实现。一个副作用是内核具有固定大小的堆栈。这意味着内核代码中不允许在堆栈上进行大型分配（数据结构）——以免内核超出（或溢出）其堆栈。这种事件通常是灾难性的：它可以被检测到，至少会导致
    oops 和当前正在运行的程序的销毁，甚至整个系统崩溃。因此，人们不遗余力地减少内核的最大“堆栈深度”：即由某些代码路径（通常涉及基于网络卷的复杂文件系统代码）引起的最大堆栈使用量。


    每个 Linux 桌面都可能经历堆栈溢出。多年来，内核堆栈已分裂为每个运行线程一个堆栈（这只是内核本身在服务线程时使用的堆栈，不是线程可见的用户堆栈），以及一个单独的中断堆栈，用于在处理来自外部设备的硬件中断时使用。为了保险起见，堆栈的大小定期增加（通常它是几页（在
    x86 和其他架构上为 8-16K）），传统上使用物理连续内存从底层内核分配器分配。Andy 的补丁集将此更改为使用虚拟内存（vmalloc）接口进行内核堆栈分配，并带来其他几个良好的变更和好处。


    使用虚拟内存进行内核堆栈巧妙地避免了对物理连续内存页分配的需求。这有可能极大地减轻虚拟内存系统的压力，特别是在给定系统上运行极大量任务（程序或线程）时。作为一个额外的好处，Andy
    能够在现在更容易管理的内核堆栈两侧引入特殊的保护页，作为传统的金丝雀，承受堆栈溢出的影响，而不是之前位于堆栈下方的随机内存。现有系统通常在内核堆栈的底部存储一个特殊的
    ''thread_info'' 结构，其中包含关于运行程序的重要信息（如其所有关联数据结构在内存中的存储位置），因此这通常会是内核堆栈溢出的破坏目标。由此产生的结果对系统稳定性通常不佳，但将会变得更加整洁。


    虚拟映射的堆栈可能不会在至少几个内核开发周期内进入 Linux。即使它们可以被限制在 CONFIG_VMAP_STACK 配置选项中（该选项最初仅在特定架构（x86）上启用，并逐渐渗透到其余架构中），这种变更具有足够的破坏性，以至于会遇到更多边缘情况。但我们仍应期待这项类似的工作在未来几个月内的进展。■


    ![](img/628186dda7facdc011bf39c938de3975_13_0.png)

    ![](img/628186dda7facdc011bf39c938de3975_14_0.png)


