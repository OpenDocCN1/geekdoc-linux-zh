    # Your letters


    Questions and opinions about the mag, Linux, and open source


    ## Turing test


    Hello **LUL**,


    Every so often, when following tutorials in your magazine, I come across the phrase
    “Turing-complete”. Correct me if I’m wrong but Alan Turing was around a long time
    before Linux was invented, so what does he have to do with computers today?


    **Ray Gerrard**


    That’s a very good question Ray! As most people know, *Will codebreaker and scientist
    Alan Turing* is often called ‘the father of computing’ and the reason for this,
    and for the phrase ‘Turing-complete’ is because the theories that he posited still
    govern the mathematics under the hood of all computers and programming languages.


    While Turing did design and build early computers, a Turing machine is a thought
    experiment: the *Turing machine* is a thought that has an infinite tape (the I/O
    and storage method used at the time), that has symbols written on it. In the thought
    experiment, the Turing machine reads a symbol on the tape and then follows a set
    of pre-defined rules to decide whether it writes a symbol, moves left or right,
    follows another instruction, or stops. It sounds simple, but at its heart it’s
    the mathematical model for how computers behave. Something that’s ‘Turing-complete’,
    then, is something that can behave exactly as a Turing-machine would. Any function
    that can be computed by an algorithm can be computed by a Turing machine – as
    this is how today’s computer’s work, they can be said to be equivalent to a Turing
    machine, or Turing-complete. A programming language that’s Turing-complete can
    make use of branches – instructions in a program that tell the computer to do
    something else rather than continue to execute the program it’s been given in
    order. This means that the computer can be told to do something only if the right
    conditions have been met. If commands are a primary example of this – if this,
    then do that. Not all programming languages in use today are Turing-complete,
    but the majority are. So when one of our tutorials explains that something is
    Turing-complete, it means that either it uses a programming language that’s Turing-complete,
    or that the code instructions used could be run by a Turing machine.


    ## Getting drivers


    Hi guys,


    I’ve just bought a *spanky new graphics card* for my dual-boot machine. The Windows
    drivers have installed fine from the disc in the box, but there are no Linux drivers
    on there – how can I get it up and running properly on my Linux partition?


    **Dave Nairn**


    The good news, Dave, is that your graphics card will more than likely just work
    natively under Linux, especially seeing as you’ve already installed its Windows
    drivers. To find out, start by opening the Terminal and then type:


    ```

    grep VGA

    ```


    and Linux should tell you the name and model of your graphics card. Now check
    the version number of the drivers with


    ```

    grep OpenGL

    ```


    This should give you a result that says ‘OpenGL


    ![](img/628186dda7facdc011bf39c938de3975_93_0.png)


    *Above A model of a Turing machine seen at the Harvard Collection of Historical
    Scientific Instruments*


    ![](img/628186dda7facdc011bf39c938de3975_94_0.png)


    Above The Mesa 3D Graphics Library is a good source for graphics card drivers
    for Linux


    version string’ and then specifies a number, which will be the version number
    of the graphics card drivers Linux is using for your card. If, however, this returns
    a result that says ‘OpenGL renderer string: Mesa X11’ or ‘Software Rasterizer’
    then there are no drivers installed for your graphics card under Linux. But don’t
    despair!


    We’re guessing that your ‘spanky new’ graphics card is likely to be an AMD or
    nVIDIA card, in which case there will also be closed-source, proprietary drivers
    from the manufacturers that you can enable (unless you’re running Fedora, which
    sulks about them). On an Ubuntu-based distro (with the Dash, search for ‘Additional
    Drivers’ and launch it – it will detect your hardware and look for drivers you
    can use.


    Still no luck? A good source for open source drivers is http://www.mesa3d.org,
    /but you will need to follow the instructions for each driver and for your particular
    distro as installation methods vary depending on the hardware and software you’re
    using.


    Another thing that’s worth doing is updating your distro, especially if you’re
    on an older version of Linux and you’re using a newer card. Some kind-hearted
    dev may well have created drivers for your card in the latest version of your
    distro.


    ## Nice NAS


    Dear Linux User and Developer,


    Thank you so much for your article on how to build a NAS (issue 167, p36 – Ed.).
    I followed your guide and put together a box running FreeNAS to store photos,
    media files, and backups from the family’s computers. I actually made mine out
    of an old PC as I didn’t fancy shelling out £150 for the HP Microserver that was
    mentioned, but it works just as well and has come in very useful. For example,
    my eldest son uses iMovie on his MacBook a lot to make gaming videos and so he
    rapidly runs out of hard drive space – now he can back up his files to the NAS
    (with a bit of help from Dad) and take the older working files off his laptop,
    so he’s not moaning about running out of room all the time. We can also serve
    up music or video around the house, which is great when the wife and I are sick
    of the football/tennis/cricket (we have two teenage boys) as we can now play our
    entire digital music collection in the dining room rather than relying on the
    PC in the living room.


    **Alan Philan**


    We’re glad you enjoyed the article and that it’s been useful to you Alan! We’ve
    big fans of network-attached storage as it makes it easy to back up or access
    big files that would otherwise


    ![](img/628186dda7facdc011bf39c938de3975_94_1.png)


    Above FreeNAS is a great open source resource for building your own network-attached
    storage


    take up a lot of room on individual devices. One thing we will say though is do
    make sure that you back up the data on your NAS regularly, especially if it’s
    photos in non-lossless formats like JPEG, which can degrade the more often they’re
    opened and closed. Also, accidents can happen to a NAS box just like to any other
    device (just ask our cat), so our expert’s advice about closed backup, whether
    you pay for a plan or buddy up with a friend to store each other’s data, is very
    definitely worth following.

