    # # Your letters


    Questions and opinions about the mag, Linux, and open source


    # ## Turing test


    Hello **LUL**,


    Every so often, when following tutorials in your magazine, I come across the phrase
    “Turing-complete”. Correct me if I’m wrong but Alan Turing was around a long time
    before Linux was invented, so what does he have to do with computers today?


    **Ray Gerrard**


    That’s a very good question Ray! As most people know, *Will codebreaker and scientist
    Alan Turing* is often called ‘the father of computing’ and the reason for this,
    and for the phrase ‘Turing-complete’ is because the theories that he posited still
    govern the mathematics under the hood of all computers and programming languages.


    While Turing did design and build early computers, a Turing machine is a thought
    experiment: the *Turing machine* is a thought that has an infinite tape (the I/O
    and storage method used at the time), that has symbols written on it. In the thought
    experiment, the Turing machine reads a symbol on the tape and then follows a set
    of pre-defined rules to decide whether it writes a symbol, moves left or right,
    follows another instruction, or stops. It sounds simple, but at its heart it’s
    the mathematical model for how computers behave. Something that’s ‘Turing-complete’,
    then, is something that can behave exactly as a Turing-machine would. Any function
    that can be computed by an algorithm can be computed by a Turing machine – as
    this is how today’s computer’s work, they can be said to be equivalent to a Turing
    machine, or Turing-complete. A programming language that’s Turing-complete can
    make use of branches – instructions in a program that tell the computer to do
    something else rather than continue to execute the program it’s been given in
    order. This means that the computer can be told to do something only if the right
    conditions have been met. If commands are a primary example of this – if this,
    then do that. Not all programming languages in use today are Turing-complete,
    but the majority are. So when one of our tutorials explains that something is
    Turing-complete, it means that either it uses a programming language that’s Turing-complete,
    or that the code instructions used could be run by a Turing machine.


    # ## Getting drivers


    Hi guys,


    I’ve just bought a *spanky new graphics card* for my dual-boot machine. The Windows
    drivers have installed fine from the disc in the box, but there are no Linux drivers
    on there – how can I get it up and running properly on my Linux partition?


    **Dave Nairn**


    The good news, Dave, is that your graphics card will more than likely just work
    natively under Linux, especially seeing as you’ve already installed its Windows
    drivers. To find out, start by opening the Terminal and then type:


    ```

    `grep VGA`

    ```


    and Linux should tell you the name and model of your graphics card. Now check
    the version number of the drivers with


    ```

    `grep OpenGL`

    ```


    This should give you a result that says ‘OpenGL''


    ![](img/628186dda7facdc011bf39c938de3975_93_0.png)


    *Above A model of a Turing machine seen at the Harvard Collection of Historical
    Scientific Instruments*'
