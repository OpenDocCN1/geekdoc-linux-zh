    Ganib，这种情况将发生改变。Ganib 是一个开源项目管理工具，支持敏捷 Scrum、实时跟踪、错误跟踪以及各种其他功能。它还支持与 Microsoft
    Project、LDAP 等第三方工具集成，以促进无缝协作。在本教程中，我们将更详细地查看 Ganib 及其功能。但在开始之前，让我们先从安装过程讲起。我们使用
