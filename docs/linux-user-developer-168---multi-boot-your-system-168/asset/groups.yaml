  - "[PAGE 15]\n\n# # MULTI BOOT YOUR MACHINE\n\nPutting multiple operating systems\
    \ onto your workstation increases efficiency and gives you almost limitless choice\n\
    \n![](img/628186dda7facdc011bf39c938de3975_15_0.png)\n\nOne operating system doesn’t\
    \ always cut it, especially when a computer is used **professionally**. Some applications\
    \ are available only for Red Hat, while other developers choose to support only\
    \ Ubuntu. In addition to that, CAD, EDA and the infamous Visual Studio product\
    \ families are available for Windows only – let’s not even get started on games.\n\
    \nInstalling all of these operating systems on one workstation is both cost- and\
    \ space-effective: having to purchase motherboard, RAM, CPU and GPU multiple times\
    \ tends to add up quite quickly. Furthermore, simply adding a few hard drives\
    \ is not a problem with most workstations – this text was written on a 16GB RAM\
    \ octacore AMD behemoth hosting five HDDs.\n\nHowever, having access to multiple\
    \ hard drives is not necessary for multi-boot systems. This guide will walk you\
    \ through a process called partitioning – it allows you to divide one large HDD\
    \ into multiple smaller compartments dedicated to the individual operating systems.\n\
    \n> ### Why go for multi boot?\n> \n> As we noted above, there are many reasons\
    \ why you would want to both dual, boot and triple boot, and they depend entirely\
    \ on how you use your computer and how often you need to use different environments\
    \ for different tasks.\n> \n> One reason is often Windows – however we feel about\
    \ it, many of us need it in our day-to-day lives. It could be something as simple\
    \ as enjoying playing new games, which aren’t always supported on Linux, or it\
    \ could be the case that you are a designer who needs to use the industry standard\
    \ Photoshop or InDesign. You can even install OS X for a Hackintosh build if that’s\
    \ more to your taste.\n> \n> A key reason to further extend a dual boot setup\
    \ is to preserve your main distro – the one containing the bulk, if not all, of\
    \ your personal data and media. There are innumerable reasons as to why you may\
    \ want or need to use different distros on a regular basis, and sometimes live-booting\
    \ or virtualising just doesn’t cut it – in such cases, it is incredibly convenient\
    \ to have a third partition onto which you can install the distro you temporarily\
    \ need to use. Non-Linux OSs aside, it could be something like wanting to have,\
    \ for example, a Mintoo partition for testing alongside your main Debian distro,\
    \ with a third slot for distro-hopping; it really is down to you!"
  - '[PAGE 16]


    ![](img/628186dda7facdc011bf39c938de3975_16_0.png)


    # Partitions


    # Back up before you start


    Even though repartitioning tends to be a very safe operation, it’s important to
    perform a backup before following any of the steps shown in this guide. Power
    outages, typing mistakes or the infamous lab aide tripping over a power cable
    can all cause problems that are almost impossible to fix without the (pricey)
    services of a data repair lab.

    The safest way to get into the fray involves the use of an external hard disk.
    Replicate a hard disk image, or copy a selection of important files and – this
    is crucial – disconnect the external HDD from your workstation. Some IT security
    professionals even go so far as to recommend the purchase of multiple external
    hard disks, one or more of which are stored off-site and which are updated in
    a round-robin fashion. On the disc and on FileSilio this issue you can install
    BackupPcto ensure you’ve backed up all data.

    Be aware that the usage of dual or triple boot with at least one Windows partition
    does not provide complete protection against ransomware. Viruses like Petya have
    already shown the ability to work outside of Windows – it’s only a question of
    time until a miscreant extends his reach to EXTl4 systems.


    # Graphical disk overview


    GParted provides a diagram of the partitions as they appear on the hard disk.
    This is interesting, as partitions usually can only grow “backwards” – if a partition
    structure looks irrecoverable, starting over can be the best choice


    ![](img/628186dda7facdc011bf39c938de3975_16_1.png)


    > **Choose your file system wisely**

    > Partitions can be formatted in a variety of file systems. If a partition is
    intended to be used by different operating systems, the primitive FAT32 tends
    to be the best choice


    > **This space is empty**

    > The partition of the example workstation is not used fully. Unallocated space
    is not used by anything, and should be allocated to a partition to make it accessible
    for file storage


    # How partitions work


    The most basic installation – well known from Windows – consists of one partition
    per disk. Operating systems with a server tradition expect multi-disk systems:
    dedicating disks to tasks is effective as it reduces latency impact and actually
    provides for a greater transfer speed.

    Hard disks can be divided into up to four partitions using the traditional MBR
    scheme. One of them can be a logical partition that contains additional logical
    partitions.


    # How to handle partitions


    Administrators can choose between a large selection of utilities for partition
    management: Windows comes with the Storage Snap-In described later in the feature,
    while Ubuntu and Debian tend to use GParted on the disc and File5iloinstead.

    All of the programs behave in a similar fashion. The most important warning is
    that meddling with partition structures can be dangerous – leaving an inexperienced
    user alone with a partition manager is a sure-fire way to provoke data loss.'
  - '[PAGE 17]


    # Get to grips with GRUB bootloader


    A boot loader controls the workstation after power-up — if an error occurs here,
    the operating system can do nothing!


    After power-up, the BIOS of the workstation performs a quick self-test and passes
    control to a special bit of code called a bootloader. This is what is responsible
    for passing execution to one or more operating system Byte&Streams that actually
    bring the station up.


    While Linux initially started via a bootloader called LILO, the GNU Project''s
    GRUB has since become the standard for most distributions. It was initially intended
    to boot GNU''s Hurd operating system — while that platform competes with Duke
    Nakum for the vapro-ware throne, components of it have since been reused in various
    other Unix operating systems.


    # Why GRUB?


    GRUB compares favourably to LILO for a variety of reasons. First of all, the loader
    is not limited to residing in the traditional MBR — in fact, it completely foregoes
    the traditional MBR for more modern ways of system initialisation. Furthermore,
    GRUB differs from LILO in that it understands the concept of file systems. This
    means that the bootloader can analyse the content of the partition being booted
    — LILO simply worked with fixed offsets and failed if one of them changed.


    ![](img/628186dda7facdc011bf39c938de3975_17_0.png)


    Another interesting benefit is the ability to start from the network: in theory,
    a Unix workstation can obtain its operating system from a server accessible via
    a LAN peripheral supported by GRUB. Finally, GRUB offers a significantly better
    user experience. The program can be skinned to display custom start-up screens
    and boot options. Even the basic version, however, is more flexible than LILO
    — the two screenshots accompanying this boxout show some of what the default installation
    of the program can do for you on a triple-boot workstation.


    # Style GRUB


    While power users will probably want to stick to the instructions for manual customisation,
    average owners of GRUB installations are better served with an automatic installer.
    Sadly, the GRUB Customizer is not part of the official Ubuntu distribution at
    the time of writing. Instead, it must be downloaded from a third-party PPA, which
    must be added to the apt-get repository list. Simply feed a terminal with the
    following commands one by one, and follow the instructions on the screen:


    ```

    sudo add-apt-repository ppa:danielrichter2007/grub-customizer

    sudo apt-get update

    sudo apt-get install grub-customizer

    ```


    Next, open the Dash and look for the search string "GRUB Customizer". Starting
    the program yields a three-item menu:


    ![](img/628186dda7facdc011bf39c938de3975_17_1.png)'
