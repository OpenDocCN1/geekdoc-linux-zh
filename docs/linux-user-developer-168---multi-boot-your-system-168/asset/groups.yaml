    # OPINION

    # The kernel column

    Jon Masters summarises the closing of the Linux 4.7 development merge window and
    ongoing work toward new features for future kernels


    **Jon Masters**

    is a Linux-kernel hacker who has

    been working on Linux for some

    18 years, since he first attended

    university at the age of 13. Jon lives

    in Cambridge, Massachusetts, and

    works for a large enterprise Linux

    vendor, where he is driving the

    creation of standards for energy

    efficient ARM-powered servers


    “ Linus Torvalds announced **Linux 4.7-rc6, traditionally the penultimate candidate
    prior to final release of a new kernel.** Not too much stood out, other than that
    Linus was a little concerned by the growth in size of RGl vs prior RGCs. Generally,
    each release candidate should get smaller as the bar to pulling in fixes grows
    higher and higher toward the tail end of a cycle. Disruptive changes should instead
    come in via the next merge window, the couple of weeks during which well-tested
    changes are incorporated at the beginning of a cycle. Linus asked aloud, “one-time
    fluke or bad pattern emerging?” We’ll find out next cycle.


    Perhaps the most interesting feature that will be available to readers in Linux
    4.7 is that of parallel directory lookups. The various filesystems (such as xfs,
    btrfs, and ext4) provided by Linux use a common infrastructure known as the Virtual
    Filesystem (VFS). This provides an abstracted concept of a directory hierarchy
    that may be implemented differently by the various underlying filesystems. The
    directory hierarchy begins at / (the root), and works down through directories
    such as /usr/bin and /home//your_name. Whenever an application needs to find a
    file, such as /bin/bash for a user login shell program, it needs to walk through
    the filesystem, beginning at /.


    Performing a directory walk (as it is known) is a rather expensive operation,
    as the kernel first looks up /, then /bin/ within the directory known as /, and
    finally ‘bash’ within ‘/bin/bash. That’s three lookups for a pretty short path
    (but as readers will be aware, paths are often much longer within more /s), made
    worse if the system is busy and IO operations to read data from any of the intermediate
    directories must wait (block) on other IO. For these reasons, Linux implements
    a directory cache (dcache), which stores information about recently used directories,
    so that the system can then immediately resolve the whereabouts of /‘bin/bash’
    on disk in a single lookup operation.


    As a function of its frequency of use, the dcache is one of the most performance-sensitive
    areas of the kernel, yet until now it has suffered from a rather unfortunate bottleneck:
    parallel lookups of entries within the same directory would be serialised (one
    after the other). So (for example), looking up /bin/bash’ and /bin/ls’ would be
    a


    serial operation. Multiply this out over a busy system with thousands of processes
    (tasks), and this can significantly undermine performance. This is one reason
    why certain data stored on disk by applications has been optimised to use large
    numbers of smaller directories (web caches, mail software, and the like). Linux
    4.7 will finally introduce parallel directory lookups and remove this bottleneck.


    We will have a full wrap up of the Linux 4.7 release, as well as the features
    lined up for Linux 4.8 inclusion in the next issue.


    **Virtually mapped kernel stacks**

    The Linux kernel community is a large and thriving community formed from over
    one thousand individual contributors. Yet much of the core work within the community
    is undertaken by a dramatically smaller group of “usual suspects”, mostly funded
    by large corporations. It is, then, always refreshing to see an influx of fresh
    new talent into the core development community. Over the past few days, Andy Lutomirski
    of AMAP Capital (a hedge fund and automated foreign currency trading outfit which
    he cofounded) has become increasingly engaged as a driver of novel and ingenious
    new technology within the Linux kernel.


    It’s true that many of these optimisations are focused in areas that are performance
    critical – and thus commercially useful to both Andy, and to his company, benefitting
    from lower latency trading operations – but the same corporate motivation can
    be said of many other kernel contributions from a majority of kernel developers
    today. Andy’s latest such contribution is a set of proof-of-concept patches for
    virtually mapping the kernel stack. The patches introduce a new kernel configuration
    option called CONFIG VMAP_STACK, and make many associated changes to correct for
    years of assumptions made by other core kernel code and drivers about the nature
    of kernel stacks. To understand what all this means, let’s look at kernel stacks
    more closely.


    In a world of increasingly higher level scripting languages, many of today’s programmers
    don’t have to work directly with low-level architectural details, such as stacks
    in memory. These are, in the modern world, often automatically managed by underlying
    language runtimes. But they are still there, especially within the Linux kernel,


    ![](img/628186dda7facdc011bf39c938de3975_13_0.png)'
