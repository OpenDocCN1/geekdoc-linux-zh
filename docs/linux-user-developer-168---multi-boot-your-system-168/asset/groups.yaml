    在上述命令的输出中，你应该只看到 vmx 或 svm 标志，而不应两者同时出现。如果你没有从 grep 命令中得到任何输出，这意味着你的电脑 CPU 不支持
    KVM 虚拟化。


    接下来，你需要在 BIOS 中启用虚拟化支持。如果你认为你的电脑支持虚拟化，但相应的标志未设置，那么你可能需要在 BIOS 中打开虚拟化支持。为了做到这一点，首先重启你的电脑，并在看到第一个
