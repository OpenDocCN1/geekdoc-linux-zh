  md: "\nlet's do something more interesting: let's find out how many binaries in\
    \ the `/usr/bin` directory have the NX bit cleared. Thanks to the `execkstack`\
    \ utility and its `-q` flag, you can query an ELF binary for the presence of the\
    \ NX bit.\n\n```bash\n$ find /usr/bin -exec execkstack -q {} \";\" 2>/dev/null\
    \ | egrep --color=auto 'X'\nX /usr/bin/grub-mklayout\nX /usr/bin/grub-mkrelpath\n\
    X /usr/bin/grub-mkimage\n...\n```\n\n## ASLR and PIE\n\nAddress Space Layout Randomization\
    \ (ASLR) is a protection mechanism introduced in Linux and other operating systems\
    \ that randomises the process memory space so that it is extremely difficult to\
    \ find the address of functions or gadgets that an attacker could use in order\
    \ to exploit a binary. Shared libraries are compiled with the `-fPIE` flag, allowing\
    \ them to make use of the ASLR protection automatically. However, binary `.text`\
    \ segments are not compiled with this protection unless they are built as Position\
    \ Independent Executable (PIE). Grab your favourite text editor once again and\
    \ write this code down:\n\n```c\n#include <stdio.h>\nvoid *getEIP () {\n\treturn\
    \ __builtin_return_address(0)-0x5;\n}\nint main(int argc, char** argv){\n\tprintf(\"\
    EIP located at: %p\\n\",getEIP());\n\treturn 0;\n}\n```\n\nCompile the code and\
    \ then start to execute it a minimum of ten times (or more). You will get the\
    \ same exact memory address for EIP each time.\n\n```bash\n$ gcc -m32 aslr.c -o\
    \ aslr\n$ ./aslr\nEIP located at: 0x80483f8\n$ ./aslr\nEIP located at: 0x80483f8\n\
    ```\n\nNow, let's give it another try but this time setting the PIE protection\
    \ on the `.text` segment.\n\n```bash\n$ gcc -m32 -fPIE -pie aslr.c -o aslr\n$\
    \ ./aslr\nEIP located at: 0xff770d5c\n$ ./aslr\nEIP located at: 0xff77635c\n```\n\
    \nOf course, if you do this with an ELF64 binary, the entropy will be greater\
    \ and therefore the ASLR will become more reliable. There are plenty of papers\
    \ exposing a way to bypass ASLR on 32 bit architectures using brute-force.\n\n\
    ## Stack Canaries\n\nOne well-known method to inject alien code into an executable\
    \ is by means of corrupting its stack. Open your favourite ASCII editor and write\
    \ this code down:\n\n```c\n#include <stdio.h>\n#include <string.h>\nvoid vuln(char\
    \ *);\nint main (int argc, char **argv){\n\tprintf(\"Arg is: %s\\n\", *(argv+1));\n\
    \tvuln(*(argv+1));\n}\n\nvoid vuln(char *arg){\n\tchar buffer[10];\n\tstrcpy(buffer,\
    \ arg);\n}\n```\n\nThis is a classic buffer-overflow vulnerable code. Compile\
    \ it the usual way and run it passing as many bytes as you need until you overflow\
    \ the buffer:\n\n```bash\n$ gcc -m32 vuln.c -o vuln\n$ ./vuln AAAAAAAAAAAAAAAAAAAAAAA\n\
    Arg is: AAAAAAAAAAAAAAAA\nSegmentation fault\n```\n\nNow, execute it inside a\
    \ `gdb` session until you get the `0x41414141` value for the EIP register. To\
    \ achieve this, just increase the total number of \"As\" passed to the vulnerable\
    \ program at each execution until you reach the desired value:\n\n```bash\n$ gdb\
    \ ./vuln\n(gdb) r AAAAAAAAAAAAAAAAAAAAAAA\nProgram received signal SIGSEGV, Segmentation\
    \ fault.\n0x41414141 in ?? ()\n```\n\nIt is obvious that you can control the return\
    \ address by corrupting the stack. If you want to overwrite the EIP register with,\
    \ say, `0x54544432`, you can do it easily by altering the last 4 bytes passed\
    \ as an argument like this:\n\n```bash\n(gdb) r \"$(perl -e 'print \"\\x41\" x\
    \ 20 . \"\\x32\\x44\\x54\\x54\"')\"\nProgram received signal SIGSEGV, Segmentation\
    \ fault.\n0x54544432 in ?? ()\n```\n\nThe stack has been corrupted, that is undeniable.\
    \ Now, compile the previous code with the stack guard protector to detect the\
    \ corruption. The GNU C compiler offers this feature:\n\n```bash\n$ gcc -m32 -fstack-protector-all\
    \ vuln.c -o vuln\n```\n\n![](img/628186dda7facdc011bf39c938de3975_32_0.png)\n\n\
    > \"If you compile legacy code in a newer GNU/Linux distro, chances are that it\
    \ will be built without protections\"\n\n## Tutorial\n\n### Compile new software\n\
    \n- Protections and performance\n\nSome of these protections can affect the program's\
    \ throughput. For example, `relro`/`full relro` means that the loader will resolve\
    \ every library function's binary function to load immediately. To do this, some\
    \ loading is performed before the binary is responsive. Take this into account\
    \ and always run performance tests.\n\nTry to overflow the buffer now as you did\
    \ before:\n\n```bash\n$ ./vuln `perl -e 'print \"A\"x18'`\n*** stack smashing\
    \ detected ***: ./vuln\nterminated\n```\n\n### Full RELRO\n\nWhenever running\
    \ a new binary that makes use of shared libraries, the addresses of these libraries\
    \ are resolved at execution time when a first call is made to any one of these\
    \ libraries; this is called Lazy Binding. Because some addresses have to be figured\
    \ out later on in the life of a binary loaded in memory, some ELF segments must\
    \ be writable. This can lead to a well-known attack that overwrites the Global\
    \ Offset Table (GOT) so that instead of making a call to, say, `printf`, once\
    \ the attacker has been able to overwrite the address for `printf`, the program\
    \ will end up calling some malicious injected code.\n\n```c\n#include <stdio.h>\n\
    int main(int argc, char **argv){\n    printf(\"Hello there!\\n\");\n    return\
    \ 0;\n}\n```\n\nSave it and compile it this way:\n\n```bash\n$ gcc -m32 -no-builtin-printf\
    \ relro.c -o relro\n```\n\nDisassemble the binary by running the `objdump` utility:\n\
    \n```bash\n$ objdump -d relro > relro.S\n```\n\nOpen the resulting disassembled\
    \ file and look for the main function. Instead of calling `printf`'s address directly,\
    \ there is a call to a symbol named `printf@plt`:\n\n```asm\n00048348 <main>:\n\
    ...\n80483f5: e8 06 ff ff ff    call  8048306 <printf@plt>\n80483fa: 68 00 00\
    \ 00 00    mov $0x0, %eax\n```\n\nGo to that offset, i.e. `0048300`. You can clearly\
    \ see that there is a jump into the GOT. The push `$0x0` is going to set the actual\
    \ address for `printf` in the first GOT entry available for shared symbols, i.e.\
    \ `GOT[3]`:\n\n![](img/628186dda7facdc011bf39c938de3975_33_0.png)\n\n```asm\n\
    00048300 <printf@plt>:\n8048300: ff 25 98 94 04 08  jmp    *0x0894998\n8048306:\
    \ 68 00 00 00 00    push $0x0\n804830b: e9 e0 ff ff ff    jmp    80482f0 <.init+0x34>\n\
    ```\n\nRun the executable inside a `gdb` session to analyze the GOT. Because the\
    \ `_got.plt` table is a section inside this ELF binary, you can ask `gdb` for\
    \ its exact address:\n\n```bash\n$ gdb ./relro\n(gdb) info sections _got.plt\n\
    0x089495c >0x0894964  0x0000068 _got.plt\nALLOC LOAD DATA HAS CONTENTS\n```\n\n\
    Set a breakpoint right after the call to the `printf@plt` function and run the\
    \ program:\n\n```bash\n(gdb) b *0x00483fa\nBreakpoint 1 at 0x00483fa\n(gdb) r\n\
    Hello there!\nBreakpoint 1, 0x00483fa in main ()\n```\n\nLet's find out where\
    \ the `printf` function is located:\n\n```bash\n(gdb) p system\n$3 = <text variable,\
    \ no debug info> 0x7f7e82c80\n```\n\nSo `GOT[3]` must have the address `0x7f7e82c80`,\
    \ which is the address for `printf`. To make sure this is so, dump the first 4\
    \ bytes for the `_got.plt` table:\n\n```bash\n(gdb) x/4w 0x089495c\n0x089495c\
    \ <_GLOBAL_OFFSET_TABLE_>   0x0894958\n0x7fff0598      0x7fff3598\n```\n\nBecause\
    \ this is a writable address in the ELF binary, you can put whatever address you\
    \ want in `GOT[3]`. You can find out which address equals to `GOT[3]` by doing\
    \ pointer arithmetic:\n\n```bash\n(gdb) x/4w 0x089495c+12\n0x0894968 <printf@plt>\
    \          0x7f7e82c80\n```\n\nSo `GOT[3]` is located at `0x0894968`! Let's toy\
    \ with the GOT, your goal will be to execute the system function instead of the\
    \ \"Hello world!\" message. To do this, first find out where the address of `system`\
    \ is:\n\n```bash\n(gdb) p system\n$8 = <text variable, no debug info> 0x7f74c90\n\
    ```\n\nSet a breakpoint before calling the `printf@plt` symbol:\n\n```bash\n(gdb)\
    \ b *0x00483f5\nBreakpoint 2 at 0x00483f5\n```\n\nRun the program from the beginning\
    \ until it breaks at 0x80483f5. Then, overwrite the GOT entry at offset address\
    \ 0x804968 (correcting OCR typo 0x8049698) with the address for the system function:\n\
    \n```bash\n(gdb) set *0x804968 = system\n(gdb) x/wx 0x804968\n0x804968 <printf@plt+...>\
    \    0x7f74c90\n```\n\nContinue the execution using the “c” command in gdb:\n\n\
    ```bash\n(gdb) c\nContinuing.\nsh: Hello: command not found\n```\n\nYou have successfully\
    \ overwritten the address in the GOT entry for the function printf with system.\
    \ But because system expects the command to execute from the stack, and the stack\
    \ has the string “Hello world!\\n”, system tries to execute “Hello” and fails!\
    \ Anyway, you have altered the GOT table. To prevent this, use Full RELRO:\n\n\
    ```bash\n$ gcc -m32 -fno-builtin-printf -Wl,-z,relro,-z,now relro.c -o relro\n\
    ```\n\nNow that all the symbols are resolved before returning control to the executable\
    \ program by the linker, there is no need to have writable sections loaded in\
    \ memory. To check this, use the readelf command like this:\n\n```bash\n$ readelf\
    \ -S ./relro | grep \"got.plt\"\n```\n\n## Auditing for unhardened binaries\n\n\
    On modern GNU/Linux distros, most binaries are pre-compiled with these protections\
    \ enabled. To check, you can use either the readelf tool or the checksec script.\n\
    \n```bash\n$ wget http://www.trapkit.de/tools/checksec.sh\n```\n\nUsing checksec,\
    \ let’s test the previous code protections after compiling it using Full RELRO:\n\
    \n```bash\n$ ./checksec.sh -file relro\nFull RELRO    No canary found    NX enabled\n\
    No PIE\n```\n\nChecksec is reporting to you that this binary has been hardened\
    \ with Full RELRO and the NX bit. And yet, its .text segment is not protected\
    \ by ASLR and it has no stack corruption protection.\n\n```bash\n$ gcc -m32 -fstack-protector-all\
    \ -fPIE -pie -fno-builtin-printf -Wl,-z,relro,-z,now relro.c -o relro\n$ ./checksec.sh\
    \ -file relro\nFull RELRO    Canary found    NX enabled\nPIE enabled\n```\n\n\
    Checksec also allows you to check every process that is running on your system\
    \ and obtain its protections by using the --proc-all flag. To get a list of binaries\
    \ that may be vulnerable to stack corruption or GOT overwriting, you can run the\
    \ following:\n\n```bash\n# ./checksec.sh --proc-all | egrep 'No RELRO|No canary'\n\
    init          1 No RELRO    No canary found    NX enabled No PIE\nrpc.statd 2426\
    \ No RELRO No canary found NX enabled No PIE\nrpc.idmapd 2440 No RELRO No canary\
    \ found NX enabled No PIE\n...\n```\n\nHowever, it’s important to note that if\
    \ you compile legacy code in a newer GNU/Linux distro, chances are that it will\
    \ be built without protections.\n\n> Checksec allows you to check every process\
    \ that is running on your system and obtain its protections\n\n```bash\n$ wget\
    \ http://disbaux.es/wp-content/uploads/2012/10/xmgr-4.1.2.tar.bz2\n```\n\nDecompress\
    \ the file and start the building process as usual:\n\n```bash\n$ tar xvjf xmgr-4.1.2.tar.bz2\n\
    $ cd xmgr-4.1.2/\n$ ./configure && make\n```\n\nUse the checksec script to make\
    \ sure the only enabled protection is NX:\n\n```bash\n$ checksec.sh -file src/xmgr\n\
    No RELRO    No canary found    NX enabled    No PIE\n```\n\nHarden it by altering\
    \ its Makefile so that it has the proper flags set. Modern GNU/Linux distros include\
    \ an environment variable that turns on these flags automatically. Edit the xmgr-4.1.2/Make.conf\
    \ and set these flags to the CFLAGS0 variable:\n\n```makefile\nCFLAGS0 = -fstack-protector-all\
    \ -fPIE -pie -Wl,-z,relro,-z,now\n```\n\nAdd the -fPIC flag to the cephos library\
    \ too:\n\n```makefile\n# vi cephos/Makefile\n...\nCFLAGS= $(CFLAGS0) -fPIC -I$TOP\
    \ -I.\n```\n\nNow recompile the binary and check its protections again:\n\n```bash\n\
    $ make clean\n$ make\n$ checksec.sh -file src/xmgr\nFull RELRO    Canary found\
    \    NX enabled    PIE enabled.\n```\n"
  mdcn: "\n\n让我们来点更有趣的事情：让我们找出 `/usr/bin` 目录下有多少个二进制文件的 NX 位被清除了。借助 `execkstack` 工具及其\
    \ `-q` 标志，你可以查询 ELF 二进制文件中是否存在 NX 位。\n\n```bash\n$ find /usr/bin -exec execkstack\
    \ -q {} \";\" 2>/dev/null | egrep --color=auto 'X'\nX /usr/bin/grub-mklayout\n\
    X /usr/bin/grub-mkrelpath\nX /usr/bin/grub-mkimage\n...\n```\n\n## ASLR 和 PIE\n\
    \n地址空间布局随机化（ASLR）是一种在 Linux 和其他操作系统中引入的防护机制，它使进程内存空间随机化，从而让攻击者极难找到可利用二进制文件中函数或\
    \ gadget 的地址。共享库是使用 `-fPIE` 标志编译的，这使得它们能够自动利用 ASLR 保护。然而，除非二进制文件被构建为位置无关可执行文件（PIE），否则其\
    \ `.text` 段不会以这种防护方式编译。再次打开你喜欢的文本编辑器，写下这段代码：\n\n```c\n#include <stdio.h>\nvoid\
    \ *getEIP () {\n\treturn __builtin_return_address(0)-0x5;\n}\nint main(int argc,\
    \ char** argv){\n\tprintf(\"EIP located at: %p\\n\",getEIP());\n\treturn 0;\n\
    }\n```\n\n编译代码，然后至少运行十次（或更多）。每次你都会得到完全相同的 EIP 内存地址。\n\n```bash\n$ gcc -m32 aslr.c\
    \ -o aslr\n$ ./aslr\nEIP located at: 0x80483f8\n$ ./aslr\nEIP located at: 0x80483f8\n\
    ```\n\n现在，让我们再试一次，但这次在 `.text` 段上启用 PIE 保护。\n\n```bash\n$ gcc -m32 -fPIE -pie\
    \ aslr.c -o aslr\n$ ./aslr\nEIP located at: 0xff770d5c\n$ ./aslr\nEIP located\
    \ at: 0xff77635c\n```\n\n当然，如果你对一个 ELF64 二进制文件这样做，熵会更大，因此 ASLR 将变得更加可靠。有很多论文揭示了在\
    \ 32 位架构上使用暴力破解绕过 ASLR 的方法。\n\n## 堆栈金丝雀（Stack Canaries）\n\n向可执行文件中注入外来代码的一种众所周知的方法是破坏其堆栈。打开你喜欢的\
    \ ASCII 编辑器，写下这段代码：\n\n```c\n#include <stdio.h>\n#include <string.h>\nvoid vuln(char\
    \ *);\nint main (int argc, char **argv){\n\tprintf(\"Arg is: %s\\n\", *(argv+1));\n\
    \tvuln(*(argv+1));\n}\n\nvoid vuln(char *arg){\n\tchar buffer[10];\n\tstrcpy(buffer,\
    \ arg);\n}\n```\n\n这是一个典型的具有缓冲区溢出漏洞的代码。以通常的方式编译它并运行它，传递尽可能多的字节，直到你溢出缓冲区：\n\n```bash\n\
    $ gcc -m32 vuln.c -o vuln\n$ ./vuln AAAAAAAAAAAAAAAAAAAAAAA\nArg is: AAAAAAAAAAAAAAAA\n\
    Segmentation fault\n```\n\n现在，在 `gdb` 会话中执行它，直到 EIP 寄存器得到 `0x41414141` 值。要做到这一点，只需在每次执行时增加传递给易受攻击程序的\
    \ \"A\" 的总数，直到你达到所需的值：\n\n```bash\n$ gdb ./vuln\n(gdb) r AAAAAAAAAAAAAAAAAAAAAAA\n\
    Program received signal SIGSEGV, Segmentation fault.\n0x41414141 in ?? ()\n```\n\
    \n很明显，你可以通过破坏堆栈来控制返回地址。如果你想用例如 `0x54544432` 覆盖 EIP 寄存器，你只需更改作为参数传递的最后 4 个字节就可以轻松做到这一点，例如：\n\
    \n```bash\n(gdb) r \"$(perl -e 'print \"\\x41\" x 20 . \"\\x32\\x44\\x54\\x54\"\
    ')\"\nProgram received signal SIGSEGV, Segmentation fault.\n0x54544432 in ?? ()\n\
    ```\n\n堆栈已被破坏，这是不可否认的。现在，使用堆栈保护程序编译前面的代码以检测这种破坏。GNU C 编译器提供了这个功能：\n\n```bash\n\
    $ gcc -m32 -fstack-protector-all vuln.c -o vuln\n```\n\n![](img/628186dda7facdc011bf39c938de3975_32_0.png)\n\
    \n> \"如果你在新的 GNU/Linux 发行版中编译遗留代码，很有可能它会在没有防护的情况下被构建\"\n\n## 教程\n\n### 编译新软件\n\
    \n- 防护与性能\n\n其中一些防护可能会影响程序的吞吐量。例如，`relro`/`full relro` 意味着加载器会立即解析每个库函数的二进制函数以进行加载。为此，在二进制文件响应之前会进行一些加载。请考虑这一点，并始终运行性能测试。\n\
    \n现在尝试像之前那样溢出缓冲区：\n\n```bash\n$ ./vuln `perl -e 'print \"A\"x18'`\n*** stack smashing\
    \ detected ***: ./vuln\nterminated\n```\n\n### 完整 RELRO\n\n每当运行使用共享库的新二进制文件时，这些库的地址在执行时会解析，当第一次调用这些库中的任何一个时，这被称为延迟绑定。因为一些地址必须在加载到内存中的二进制文件的后续生命周期中确定，所以某些\
    \ ELF 段必须是可写的。这可能导致一种众所周知的攻击，该攻击覆盖全局偏移表（GOT），以便在攻击者能够覆盖 `printf` 的地址后，程序最终会调用一些恶意注入的代码，而不是调用例如\
    \ `printf`。\n\n```c\n#include <stdio.h>\nint main(int argc, char **argv){\n  \
    \  printf(\"Hello there!\\n\");\n    return 0;\n}\n```\n\n保存它并以这种方式编译：\n\n```bash\n\
    $ gcc -m32 -no-builtin-printf relro.c -o relro\n```\n\n通过运行 `objdump` 工具来反汇编二进制文件：\n\
    \n```bash\n$ objdump -d relro > relro.S\n```\n\n打开生成的反汇编文件，查找 main 函数。而不是直接调用\
    \ `printf` 的地址，有一个调用名为 `printf@plt` 符号的调用：\n\n```asm\n00048348 <main>:\n...\n\
    80483f5: e8 06 ff ff ff    call  8048306 <printf@plt>\n80483fa: 68 00 00 00 00\
    \    mov $0x0, %eax\n```\n\n转到该偏移量，即 `0048300`。你可以清楚地看到有一个跳入 GOT。`push $0x0` 将设置\
    \ `printf` 的实际地址，进入第一个可用于共享符号的 GOT 条目，即 `GOT[3]`：\n\n![](img/628186dda7facdc011bf39c938de3975_33_0.png)\n\
    \n```asm\n00048300 <printf@plt>:\n8048300: ff 25 98 94 04 08  jmp    *0x0894998\n\
    8048306: 68 00 00 00 00    push $0x0\n804830b: e9 e0 ff ff ff    jmp    80482f0\
    \ <.init+0x34>\n```\n\n在 `gdb` 会话中运行可执行文件以分析 GOT。因为 `_got.plt` 表是这个 ELF 二进制文件中的一个段，你可以向\
    \ `gdb` 询问其确切地址：\n\n```bash\n$ gdb ./relro\n(gdb) info sections _got.plt\n0x089495c\
    \ >0x0894964  0x0000068 _got.plt\nALLOC LOAD DATA HAS CONTENTS\n```\n\n在调用 `printf@plt`\
    \ 函数后立即设置断点并运行程序：\n\n```bash\n(gdb) b *0x00483fa\nBreakpoint 1 at 0x00483fa\n\
    (gdb) r\nHello there!\nBreakpoint 1, 0x00483fa in main ()\n```\n\n让我们找出 `printf`\
    \ 函数位于何处：\n\n```bash\n(gdb) p system\n$3 = <text variable, no debug info> 0x7f7e82c80\n\
    ```\n\n因此 `GOT[3]` 必须有地址 `0x7f7e82c80`，这是 `printf` 的地址。为了确定这是真的，转储 `_got.plt`\
    \ 表的前 4 个字节：\n\n```bash\n(gdb) x/4w 0x089495c\n0x089495c <_GLOBAL_OFFSET_TABLE_>\
    \   0x0894958\n0x7fff0598      0x7fff3598\n```\n\n因为这是 ELF 二进制文件中的可写地址，你可以在 `GOT[3]`\
    \ 中放入任何你想要的地址。你可以通过进行指针算术来找出哪个地址等于 `GOT[3]`：\n\n```bash\n(gdb) x/4w 0x089495c+12\n\
    0x0894968 <printf@plt>          0x7f7e82c80\n```\n\n因此 `GOT[3]` 位于 `0x0894968`！让我们玩玩\
    \ GOT，你的目标将是执行 system 函数，而不是 \"Hello world!\" 消息。为此，首先找出 `system` 的地址在哪里：\n\n\
    ```bash\n(gdb) p system\n$8 = <text variable, no debug info> 0x7f74c90\n```\n\n\
    在调用 `printf@plt` 符号之前设置断点：\n\n```bash\n(gdb) b *0x00483f5\nBreakpoint 2 at 0x00483f5\n\
    ```\n\n从头开始运行程序，直到它在 0x80483f5 处中断。然后，用 system 函数的地址覆盖偏移地址 0x804968 处的 GOT 条目（更正\
    \ OCR 错误 0x8049698）：\n\n```bash\n(gdb) set *0x804968 = system\n(gdb) x/wx 0x804968\n\
    0x804968 <printf@plt+...>    0x7f74c90\n```\n\n在 gdb 中使用“c”命令继续执行：\n\n```bash\n\
    (gdb) c\nContinuing.\nsh: Hello: command not found\n```\n\n你已成功将 GOT 条目中 printf\
    \ 函数的地址覆盖为 system。但由于 system 期望从堆栈中获取要执行的命令，而堆栈中有字符串 \"Hello world!\\n\"，system\
    \ 试图执行 \"Hello\" 并失败！无论如何，你已修改了 GOT 表。为了防止这种情况，请使用完整 RELRO：\n\n```bash\n$ gcc\
    \ -m32 -fno-builtin-printf -Wl,-z,relro,-z,now relro.c -o relro\n```\n\n现在，由于所有符号在链接器将控制权返回给可执行程序之前都已解析，因此不再需要将可写段加载到内存中。要检查这一点，使用\
    \ readelf 命令如下：\n\n```bash\n$ readelf -S ./relro | grep \"got.plt\"\n```\n\n##\
    \ 审计未加强的二进制文件\n\n在现代 GNU/Linux 发行版中，大多数二进制文件都预先编译启用了这些防护。要检查，你可以使用 readelf 工具或\
    \ checksec 脚本。\n\n```bash\n$ wget http://www.trapkit.de/tools/checksec.sh\n```\n\
    \n使用 checksec，让我们测试之前编译代码在启用完整 RELRO 后的防护：\n\n```bash\n$ ./checksec.sh -file relro\n\
    Full RELRO    No canary found    NX enabled\nNo PIE\n```\n\nChecksec 向你报告该二进制文件已使用完整\
    \ RELRO 和 NX 位进行强化。然而，其 .text 段未受 ASLR 保护，且没有堆栈破坏保护。\n\n```bash\n$ gcc -m32 -fstack-protector-all\
    \ -fPIE -pie -fno-builtin-printf -Wl,-z,relro,-z,now relro.c -o relro\n$ ./checksec.sh\
    \ -file relro\nFull RELRO    Canary found    NX enabled\nPIE enabled\n```\n\n\
    Checksec 还允许你使用 `--proc-all` 标志检查系统中运行的每个进程并获取其防护。要获取可能容易受到堆栈破坏或 GOT 覆盖攻击影响的二进制文件列表，你可以运行以下内容：\n\
    \n```bash\n# ./checksec.sh --proc-all | egrep 'No RELRO|No canary'\ninit     \
    \     1 No RELRO    No canary found    NX enabled No PIE\nrpc.statd 2426 No RELRO\
    \ No canary found NX enabled No PIE\nrpc.idmapd 2440 No RELRO No canary found\
    \ NX enabled No PIE\n...\n```\n\n然而，重要的是要注意，如果你在新的 GNU/Linux 发行版中编译遗留代码，很有可能它会在没有防护的情况下被构建。\n\
    \n> Checksec 允许你检查系统中运行的每个进程并获取其防护\n\n```bash\n$ wget http://disbaux.es/wp-content/uploads/2012/10/xmgr-4.1.2.tar.bz2\n\
    ```\n\n解压缩文件并按常规启动构建过程：\n\n```bash\n$ tar xvjf xmgr-4.1.2.tar.bz2\n$ cd xmgr-4.1.2/\n\
    $ ./configure && make\n```\n\n使用 checksec 脚本确保唯一启用的防护是 NX：\n\n```bash\n$ checksec.sh\
    \ -file src/xmgr\nNo RELRO    No canary found    NX enabled    No PIE\n```\n\n\
    通过修改其 Makefile 以设置适当的标志来强化它。现代 GNU/Linux 发行版包含一个自动开启这些标志的环境变量。编辑 xmgr-4.1.2/Make.conf\
    \ 并将这些标志设置为 CFLAGS0 变量：\n\n```makefile\nCFLAGS0 = -fstack-protector-all -fPIE\
    \ -pie -Wl,-z,relro,-z,now\n```\n\n也将 -fPIC 标志添加到 cephos 库中：\n\n```makefile\n\
    # vi cephos/Makefile\n...\nCFLAGS= $(CFLAGS0) -fPIC -I$TOP -I.\n```\n\n现在重新编译二进制文件并再次检查其防护：\n\
    \n```bash\n$ make clean\n$ make\n$ checksec.sh -file src/xmgr\nFull RELRO    Canary\
    \ found    NX enabled    PIE enabled.\n```\n\n"
