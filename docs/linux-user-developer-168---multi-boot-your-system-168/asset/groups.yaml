  - "[PAGE 89]\n\n# ### GRAPHICAL TEMPERATURE MONITOR\n# Psensor 1.2.0\nAlerts, graphs\
    \ and charts\nof your PC's hot spots\n\nWhile the Raspberry Pi 3 may herald a\
    \ future where our PCs use low power-consumption ARM processors, for now most\
    \ of us use much more power-hungry devices — and where there is substantial power\
    \ consumption, there is as much heat as light. Add in powerful GPUs, and a processor-intensive\
    \ task, such as transcoding video, and the temperature rises.\n\nLinux provides\
    \ ready access to the many sensors on the PC bus, through the lm-sensors monitoring\
    \ and reporting tool — and many general monitor tools make use of this data. Psensor\
    \ presents you with not just the figures, but also a very useful graph covering\
    \ a selection of those monitored temperatures.\n\nDisk drive temperature, fan\
    \ speed, and free memory also feature in Psensor's chart. As well as choosing\
    \ which temperature monitors to view in the graph, config options range from measurement\
    \ interval through alarm threshold (alerts can be delivered through desktop notifications)\
    \ to naming the sensors. ATI/AMD GPU monitoring needs a recompile if you're using\
    \ the proprietary Catalyst drivers; otherwise these and nVidia GPUs work out of\
    \ the box. The separate Psensor server provides a JSON web service for monitoring\
    \ remote servers via Psensor or your web browser.\n\n![](img/628186dda7facdc011bf39c938de3975_89_0.png)\n\
    \nAbove With selectable graph options for each sensor, Psensor gives you a quick\
    \ visual check on hot spots\n\n+   **Pros**\n+   Handy interface to all the temperature\
    \ monitors on your system. Simple and configurable graph view.\n+   \n+   **Cons**\n\
    +   It won't tell you where the I/O sensors are, so you'll have to crawl through\
    \ motherboard docs for that!\n+   \n+   **Great for…**\n+   Monitoring during\
    \ compilation or video processing\n+   **wpichoune.net/psensor/**\n\n# ### COMMAND\
    \ LINE MEDIA PLAYER\n# PlayShell 0.2.3\nA command line media player using the\
    \ shell's own language\n\nThis is a bit of fun: a media player framework, written\
    \ in Bash, that will use various players as a back-end. It also has a serious\
    \ use in embedded systems, where resources are scarce, but for those who spend\
    \ most of their time using a virtual terminal, the appeal will be a player with\
    \ some useful features, yet written in that most humble of scripting languages.\
    \ Bash.\n\nPlayShell, when first started, will search your system for media players.\
    \ It works with VLC, MPlayer, Sox and FFPlay, and is capable of using some more\
    \ minimal players like aplay, gst123, madplay, mpg123, mpg123 and aplay. A Bash\
    \ script it can be run directly where it's unpacked, but it also comes with an\
    \ install script, which gives you configuration files and a man page.\n\nDocumentation\
    \ on the website, or the man page, will get you started, but all that you really\
    \ need to do once you've typed in playshell is hit E to add a folder of media\
    \ files to the library, and then A, which adds a file to the playlist and then\
    \ starts it playing. Unless you've started playshell with the -e editor option,\
    \ or edited the sample playshell.conf example file, then you are likely to find\
    \ E drops you into vi, which won't be to everyone's taste. As well as general\
    \ media player features, terminal-friendily features include video disabling,\
    \ to save opening of unnecessary windows while listening to audio from video files.\n\
    \n+   **Pros**\n+   Written in Bash, so naturally it's fairly lightweight — yet\
    \ surprisingly feature-packed.\n+   \n+   **Cons**\n+   Defaults to vi for some\
    \ operations; still at a relatively early stage of its development.\n+   \n+ \
    \  **Great for…**\n+   Low resource computers, and for all command line fans\n\
    +   **playshell.sf.net**"
