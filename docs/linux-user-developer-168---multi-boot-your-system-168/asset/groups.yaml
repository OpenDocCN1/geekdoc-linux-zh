    feel overlooked and too basic | 6 | Options are split between two panels, a helpful
    way of avoiding overcrowding | 7 |

    | **Spreadsheet tools** | The handy DataPilot tool is particularly helpful for
    pulling in batches of raw data | 8 | Creating formulas is a particular highlight,
    rivaling Office’s Excel in many areas | 8 | Creating charts is a particular highlight,
    catering for both new and advanced users | 8 | Data entry is good, but there’s
    little for dealing with formulas, which is a big omission | 7 |

    | **Presentation options** | There’s plenty here to really make a unique presentation
    without overcomplicating it | 8 | Versatility is the key word, with a range of
    editing options on hand to play with | 9 | Another case of being too barebones
    for our liking. Editing tools are very minimal | 5 | Far too basic in its options
    and left behind the strong competition to some degree | 6 |

    | **Extra features** | Extra programs are nice to have, but will be of little
    use to most general users | 7 | Liaising with the community helps keep updates
    quick as well as relevant | 9 | Support for multiple distributions has helped
    it stay popular in the community | 7 | A unique extensions suite enables users
    to customise the core programs to their liking | 8 |

    | **Overall** | A suite with an abundance of options and tools, but poor design
    lets it down | 7 | LibreOffice feels like a complete package, the best for those
    needing a free office suite | 9 | While Calc is a highlight, other areas feel
    too barebones for our liking | 6 | Some big omissions with certain features leave
    FreeOffice lagging behind the rest | 7 |


    *Note: The original OCR table header "CyberGhost" was identified as a typo for
    "FreeOffice" based on context and the preceding section.*


    ## AND THE WINNER IS...


    ### LibreOffice


    When it comes to choosing an office suite, many will instantly turn to the Microsoft
    suite. But unless you’ve got a spare £50 handy, chances are you won’t want to
    part with your hard-earned cash. If we can prove anything with this group test,
    it’s that there are some fantastic alternatives that won’t cost you a penny to
    download on to your desktop. Out of the four we tested here, LibreOffice proved
    to be the complete package.


    In many of its key areas, it closely matches the Microsoft suite stride for stride,
    and in a couple of areas, it even surpassed it. While it doesn’t do anything out
    of the world with its feature set, it does have tools that can both cater for
    new and seasoned users alike. New users in particular will feel right at home
    here, with an array of help on hand through the programs and community whenever
    they’re stuck.


    But while the community is great for a spot of tech support when needed, they’re
    also the driving force behind the continued development of LibreOffice. Updates
    are frequent, with the developers constantly liaising with the community to find
    out what they want included and fixed in the next update – if only more programs
    would follow suit.


    ![](img/628186dda7facdc011bf39c938de3975_83_0.png)


    If you go ahead and download LibreOffice and can’t seem to get to grips with it,
    then no worries, as OpenOffice and WPS Office are both viable alternatives. Each
    do things a little differently to LibreOffice, but be prepared to sacrifice on
    some certain features. WPS Office in particular can be customised in certain areas,
    so it’s a suitable choice for those who are particularly fussy. But without doubt,
    LibreOffice is the number one choice for Linux users wanting to try out a new
    office suite.


    **Oliver Hill**


