    \n#### 02 Download boot-repair\n\nEven though GRUB can also be installed by hand,\
    \ a graphical utility called boot-repair tends to be a faster and safer alternative\
    \ for the average user. Sadly, it is not included by default – instead, download\
    \ it by entering the following commands into a terminal window:\n\n```bash\nsudo\
    \ add-apt-repository ppa:yannubuntu/boot-repair\nsudo apt-get update\nsudo apt-get\
    \ install -y boot-repair && boot-repair\n```\n\nWhen done, the utility will automatically\
    \ start to scan your hard disk for all potential operating systems available.\n\
    \n![](img/628186dda7facdc011bf39c938de3975_23_2.png)\n\n#### 03 Use recommended\
    \ repair\n\nAt this point of the proceedings, simply click Use Recommended Repair.\
    \ This will make boot-repair try and create a boot parameter set of its own –\
    \ a process that can take some time and must not be interrupted at any means.\n\
    \n![](img/628186dda7facdc011bf39c938de3975_23_3.png)\n\n#### 04 Obey the orders!\n\
