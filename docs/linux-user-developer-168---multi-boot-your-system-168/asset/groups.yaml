    # # Apache Spark Components


    ![](img/628186dda7facdc011bf39c938de3975_10_0.png)


    the project’s website, until it and launch the system without any configuration.
    We’ve looked to make the process as simple as possible, and we provide help throughout
    our site for those who are still struggling to get to grips with it.


    Spark can also run on a cluster of machines. Many vendors offer support for running
    Spark in private data centres, and many cloud providers offer Spark support.


    One way to learn Spark is through the Databricks Community Edition, which features
    award-winning MOOC classes offered by a collaboration of UC Berkeley, UCLA, edX
    and Databricks. We implore users to read up on this over at bit.ly/29G9BLJ and
    bit.ly/1WIYIPx6.


    # ### How exactly does Apache Spark run on clusters?


    Apache Spark can run on a cluster via a cluster resource manager. There are three
    cluster resource managers available: 1) standalone, 2) Apache Hadoop YARN, and
    3) Apache Mesos.


    The standalone mode is the easiest way to set up, and many Spark users start with
    this mode. According to a survey conducted by Databricks in 2015, 48 per cent
    of users run Spark on standalone mode, 40 per cent on YARN, and 11 per cent on
    Mesos. We appreciate that our user base is particularly diverse with their skill
    set, so we’ve had to cater these different resource managers for them. Of course,
    we’re always interested in exploring ways that we can expand on these managers,
    but it requires a lot of hard work and manpower.


    When running in cluster mode, a Spark cluster includes a single driver process
    and a number of executors. The driver process is responsible for coordination,
    eg tracking metadata and performing task


    ![](img/628186dda7facdc011bf39c938de3975_10_1.png)


    # ## Exploring the Spark Summit


    Due to its immense popularity, Apache Spark also hosts the Spark Summit, an event
    that brings together the world’s best scientists, engineers, analysts and executives
    to share and receive knowledge on Apache Spark.


    In previous events, there have been some key developments made towards the future
    of Apache Spark, as well as in-depth Q&A sessions where users can discuss their
    issues and grievances. Each Spark Summit also includes a series of training sessions
    hosted by Databricks. While their sole aim is to educate, they also form the building
    blocks for the expansion of Apache Spark to other markets and audiences. And to
    say the open source community is taking notice would be a massive understatement.
    Attendance at the Spark Summit events has increased dramatically over the past
    24 months, with more demand than ever before for what the Spark team has to offer.
    In the latest Spark Summit East, held in New York City earlier this year, some
    of the leading business professionals and analysts took to the stage. These included
    Chris DiAgnostino, VP of technology at Capital One, and Seshu Adututhothula, head
    of analytics infrastructure at eBay, with the message being how important data
    science is, and how Apache Spark could be the answer to issues within the industry.'
  - '[PAGE 11]


    # Growth of Spark contributors in the past 5 years


    ![](img/628186dda7facdc011bf39c938de3975_11_0.png)


    scheduling. The executor processes do the actual heavy lifting of data processing,
    and they talk to each others to exchange data in order to execute the data flows
    specified by the users.


    **Are the security protocols in place to keep Apache Spark safe when in use?**


    Yes, absolutely. Apache Spark itself has a lot of built-in security features.
    For example, it can encrypt data on-the-wire and integrate with Kerberos and SASL.


    Often, Spark is also used in environments that provide additional security features
    beyond the processing engine itself. For example, it can be used with server-side
    encryption with Amazon’s S3. Another example is Databricks Enterprise Security,
    which offers end-to-end encryption and role-based access control as well as auditing.
    We take security incredibly seriously, especially considering the level of sensitive
    data that is passed through Apache Spark on a daily basis. The protocols we implement
    are constantly monitored to make sure they’re as effective as they possibly could
    be, but there’s always room to grow.


    **Could you tell us about MLlib (Machine Learning Library)? How practical is it
    to use?**


    Apache Spark provides a general machine-learning library – MLlib – that is designed
    for simplicity, scalability and easy integration with other tools. With the scalability,
    language compatibility and speed of Spark, data scientists can solve and iterate
    through their data problems faster.


    > “ We take security incredibly seriously, especially considering the level of
    sensitive data passed through Apache Spark”


    # The Apache Software Foundation


    Spark plays just a small part in the grand schema of things when it comes to the
    Apache community.


    ![](img/628186dda7facdc011bf39c938de3975_11_1.png)


    **The Apache Software Foundation (ASF)** provides a series of open source software
    projects, aimed at providing high-quality software that leads the way in its field.
    But it’s the community part that resonates the most, as many of these projects
    are purely community-driven, with many sharing the same developers and end users.


    The ASF currently has a high number of volunteers who help develop and steward
    over 350 open source projects that cover a wide range of technologies. The choice
    is so vast, there’s something there for everyone. How about Jena, a Java framework
    for building semantic web and linked data applications? Or maybe SpamAssassin,
    providing a quick way for administrators to filter and block potential email spam?
    Contributing plays a big role in the development of Apache and its myriad projects.
    The best way to contribute is to simply get involved with one of the project communities,
    or even submit your own for consideration.'
  - '[PAGE 12]


    # V. Top Paying Tech


    ![](img/628186dda7facdc011bf39c938de3975_12_0.png)


    From the inception of the Apache Spark project, MLlib was considered foundational
    for Spark''s success. The key benefit of MLlib is that it allows data scientists
    to focus on their data problems and models instead of solving the complexities
    surrounding distributed data (such as infrastructure, configurations and so on).
    Since its inception, some key problems have been fixed, while others are close
    to completion. The data engineers can focus on distributed systems engineering
    using Spark''s easy-to-use APIs, while the data scientists can leverage the scale
    and speed of Spark core. Just as importantly, Spark MLlib is a general-purpose
    library, providing algorithms for most use cases while at the same time allowing
    the community to build upon and extend it for specialised use cases.


    > "> MLlib implements a large collection of distributed machine learning algorithms"


    **MLlib implements a large collection of distributed machine learning algorithms,
    as well as feature transformers. Use cases include recommendation systems (collaborative
    filtering), spam detection, fraud detection, churn analysis and IoT device failure
    prediction. According to our 2015 survey, 84 per cent of users use Spark for advanced
    analytics, mostly features provided by MLlib.**


    **For those particularly interested, is there scope to help contribute to the
    development of Spark? Are there any criteria that users need to meet?**


    Apache Spark is the most actively developed and largest open source project in
    the data space, with over 1,000 contributors and on average 400-500 issues resolved
    each month. Spark owes its success to these contributors.


    It is actually really easy to become a new contributor, because there are many
    aspects of Spark that new users can help out with, from documentation to bug fixes
    to engine internals. We believe that the community is at the heart of Apache Spark
    and it has proved to be a massive help in the development of it. We need to continue
    growing our user base and community to help shape Apache Spark for years to come.


    The project has a pretty active mailing list that users can join at **spark.apache.org/community.html**.
    The project accepts code contributions via pull requests on GitHub. **github.com/apache/spark**.
    And there is a pretty detailed guide available on Spark''s wiki: **bit.ly/29DoaBg**'
