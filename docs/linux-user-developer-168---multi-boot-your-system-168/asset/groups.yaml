  - "[PAGE 32]\n\nlet's do something more interesting: let's find out how many binaries\
    \ in the `/usr/bin` directory have the NX bit cleared. Thanks to the `execkstack`\
    \ utility and its `-q` flag, you can query an ELF binary for the presence of the\
    \ NX bit.\n\n```\n```\n$ find /usr/bin -exec execkstack -q {} \";\" 2>dev/\nnull|egrep\
    \ --color=auto \t'X'\nX \t/usr/bin/grub-mklayout\nX \t/usr/bin/grub-mkrelpath\n\
    X \t/usr/bin/grub-mkimage\n...\n```\n\n```\n\n# ASLR and PIE\n\nAddress Space\
    \ Layourt Randomization (ASLR) is a protection mechanism introduced in Linux and\
    \ other operating systems that randomises the process memory space so that it\
    \ is extremely difficult to find the address of functions or gadgets that an attacker\
    \ could use in order to exploit a binary. Shared libraries are compiled with the\
    \ `-fPIE` flag, allowing them to make use of the ASLR protection automatically.\
    \ However, binary `.text` segments are not compiled with this protection unless\
    \ they are built as Position Independent Executable (PIE). Grab your favourite\
    \ text editor once again and write this code down:\n\n```\n```\n#include <stdio.h>\n\
    void *getEIP () {\n\treturn __builtin_return_address(0)-0x5;\n}\nint main(int\
    \ argc, char** argv){\n\tprintf(\"EIP located at: %p\\n\",getEIP());\n\treturn\
    \ 0;\n}\n```\n\n```\n\nCompile the code and then start to execute it a minimum\
    \ of ten times (or more). You will get the same exact memory address for EIPB\
    \ each time.\n\n```\n```\n$ gcc -m32 aslr.c -o aslr\n$ . ./aslrr\nEIP located\
    \ at: 0x80483f8\n$ . ./aslrr\nEIP located at: 0x80483f8\n```\n\n```\n\nNow, let's\
    \ give it another try but this time setting the PIE protection on the `.text`\
    \ segment.\n\n```\n```\n$ gcc -m32 -fPIE -pie aslr.c -o aslr\n$ . ./aslrr\nEIP\
    \ located at: 0xff770d5c\n$ . ./aslrr\nEIP located at: 0xff77635c\n```\n\n```\n\
    \nOf course, if you do this with an ELF64 binary, the entropy will be greater\
    \ and therefore the ASLR will become more reliable. There are plenty of papers\
    \ exposing a way to bypass ASLR on 32 bit architectures using brute-force.\n\n\
    # Stack Canaries\n\nOne well-known method to inject alien code into an executable\
    \ is by means of corrupting its stack. Open your favourite ASCII editor and write\
    \ this code down:\n\n```\n```\n#include <stdio.h>\n#include <string.h>\nvoid vuln(char\
    \ *);\nint main (int argc, char **argv){\n\tprintf(\"Arg is: %s\\n\", *(argv+1));\n\
    \tvuln(*(argv+1));\n}\n\nvoid vuln(char *arg){\n\tchar buffer[10];\n\tstrcpy(buffer,\
    \ arg);\n}\n```\n\n```\n\nThis is a classic buffer-overflow vulnerable code. Compile\
    \ it the usual way and run it passing as many bytes as you need until you overflow\
    \ the buffer:\n\n```\n```\n$ gcc -m32 vuln.c -o vuln\n$ ./vuln AAAAAAAAAAAAAAAAAAAAAAA\n\
    Arg is: AAAAAAAAAAAAAAAA\nSegmentation fault\n```\n\n```\n\nNow, execute it inside\
    \ a `gdb` session until you get the `0x41414141` value for the EIP register. To\
    \ achieve this, just increase the total number of \"As\" passed to the vulnerable\
    \ program at each execution until you reach the desired value:\n\n```\n```\n$\
    \ gdb ./vuln\n(gdb) r AAAAAAAAAAAAAAAAAAAAAAA\nProgram received signal SIGSEGV,\
    \ Segmentation fault.\n0x41414141 in ?? ()\n```\n\n```\n\nIt is obvious that you\
    \ can control the return address by corrupting the stack. If you want to overwrite\
    \ the EIP register with, say, `0x54544432`, you can do it easily by altering the\
    \ last 4 bytes passed as an argument like this:\n\n```\n```\n(gdb) r \"perl -e\
    \ 'print \\\\x22 . \\\\x41\"\"\"\"\nProgram received signal SIGSEGV, Segmentation\
    \ fault.\n0x54544342 in ?? ()\n```\n\n```\n\nThe stack has been corrupted, that\
    \ is undeniable. Now, compile the previous code with the stack guard protector\
    \ to detect the corruption. The GNU C compiler offers this feature:\n\n```\n```\n\
    $ gcc -m32 -fstack-protector-all vuln.c -o vuln\n```\n\n```\n\n![](img/628186dda7facdc011bf39c938de3975_32_0.png)\n\
    \n> \"If you compile legacy code in a newer GNU/Linux distro, chances are that\
    \ it will be built without protections\""
  - "[PAGE 33]\n\n# Tutorial\n\n# Compile new software\n\n■ Protections and performance\n\
    \nSome of these protections can affect the program's throughput. For example,\
    \ `relro`/`full relro` means that the `I-x` will resolve every library function's\
    \ binary function to load immediately `reloc_1s` control. To more loading, some\
    \ before-to-binary is responsive. Take this into account and always run performance\
    \ tests.\n\nTry to overflow the buffer now as you did before:\n\n```\n$ ./vuln\
    \ `perl -e 'print \"A\"x18'`\n*** stack smashing detected ***: ./vuln\nterminated\n\
    ```\n\n# Full RELRO\n\nWhenever running a new binary that makes use of shared\
    \ libraries, the addresses of these libraries are resolved at execution time when\
    \ a first call is made to any one of these libraries; this is called Lazy Binding.\
    \ Because some addresses have to be figured out later on in the life of a binary\
    \ loaded in memory, some ELF segments must be writable. This can lead to a well-known\
    \ attack that overwrites the Global Offset Table (GOT) so that instead of making\
    \ a call to, say, `printf`, once the attacker has been able to overwrite the address\
    \ for `printf`, the program will end up calling some malicious injected code.\n\
    \n```\n#include <stdio.h>\nint main(int argc, char **argv){\n    printf(\"Hello\
    \ there!\\n\");\n    return 0;\n}\n```\n\nSave it and compile it this way:\n\n\
    ```\n$ gcc -m32 -no-builtin-printf relro.c -o relro\n```\n\nDisassemble the binary\
    \ by running the `objdump` utility:\n\n```\n$ objdump -d relro > relro.S\n```\n\
    \nOpen the resulting disassembled file and look for the main function. Instead\
    \ of calling `printf`'s address directly, there is a call to a symbol named `printf@plt`:\n\
    \n```\n00048348 <main>:\n...\n80483f5: e8 06 ff ff ff    call\n8048306 <HYPERLINK\
    \ \"mailto:printf@plt\" printf@plt>\n80483fa: 68 00 00 00 00    mov $0x0, %eax\n\
    ```\n\nGo to that offset, ie. `0048300`. You can clearly see that there is a jump\
    \ into the GOT. The push `$0x0` is going to set the actual address for `printf`\
    \ in the first GOT entry available for shared symbols, ie. `GOT[3]`:\n\n![](img/628186dda7facdc011bf39c938de3975_33_0.png)\n\
    \n```\n00048300 <printf@plt>:\n8048300: ff 25 98 94 04 08  jmp\n*<0x0894958>\n\
    8048306: 68 00 00 00 00    push $0x0\n804830b: e9 e0 ff ff ff    jmp\n80482f0\
    \ <.init+0x34>\n```\n\nRun the executable inside a `gdb` session to analyze the\
    \ GOT. Because the `_got.plt` table is a section inside this ELF binary, you can\
    \ ask `gdb` for its exact address:\n\n```\n$ gdb ./relro\n(gdb) info sections\
    \ _got.plt\n0x089495c >0x0894964  0x0000068 _got.plt\nALLOC LOAD DATA HAS CONTENTS\n\
    ```\n\nSet a breakpoint right after the call to the `printf@plt` function and\
    \ run the program:\n\n```\n(gdb) b *0x00483fa\nBreakpoint 1 at 0x00483fa\n(gdb)\
    \ r\nHello there!\nBreakpoint 1, 0x00483fa in main ()\n```\n\nLet's find out where\
    \ the `printf` function is located:\n\n```\n(gdb) printf printf\n$3 = <text variable,\
    \ no debug info> 0x7f7e82c80\n<\"printf\">\n```\n\nSo `GOT[3]` must have the address\
    \ `0x7f7e82c80`, which is the address for `printf`. To make sure this is so, dump\
    \ the first 4 bytes for the `_got.plt` table:\n\n```\n(gdb) x/4 0x089495c\n0x089495c\
    \ <_GLOBAL_OFFSET_TABLE_> 0x0894958\n0x7fff0598\n0x7fff3598     0x7feac80\n```\n\
    \nBecause this is a writable address in the ELF binary, you can put whatever address\
    \ you want in `GOT[3]`. You can find out which address equals to `GOT[3]` by doing\
