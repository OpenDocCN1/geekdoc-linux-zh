    \ easier to understand and maintain.\n\nPay special attention to this tutorial\
    \ because, sooner rather than later you will need to create and distribute your\
    \ own Go packages. Additionally, make sure that you thoroughly understand the\
    \ part that talks about Go environment variables, because using them correctly\
    \ will make your life easier.\n\nThe next tutorial in the Go series will talk\
    \ about File I/O in Go, so stay tuned!\n\n### About Go packages\n\nThe following\
    \ code is the Go version of the classic 'Hello World!' program:\n\n```go\npackage\
    \ main\nimport \"fmt\"\nfunc main() {\n\tfmt.Println(\"Hello, world!\")\n}\n```\n\
