    Once done, let’s check if you have JRE installed already. Type


    ```

    ```

    $ java -version

    ```

    ```


    If you get an error saying “the program ‘Java’ can be found in following packages”,
    it means you don’t have JRE installed yet. To install JRE, first update the package
    index


    ```

    ```

    $ sudo apt-get update

    ```

    ```


    Then install JRE.


    ```

    ```

    $ sudo apt-get install default-jre

    ```

    ```


    Once this is done, it is a good idea to install JDK as well.


    ```

    ```

    $ sudo apt-get install default-jdk

    ```

    ```


    # 02 Ganib installation


    Now download the latest Ganib installation package from SourceForge. Here is the
    link http://sourceforge.net/projects/ganib/files/latest/download/latest.zip.


    Unzip the downloaded file to the location where you’d like to install Ganib. You
    can do this using the commands below:


    ```

    ```

    $ cd <Target Directory>

    $ unzip Ganib-5.3_with_jre.zip

    $ cd Ganib-5.3_with_jre

    ```

    ```


    Then, import the database script files to your MySQL installation. But first,
    create a database for Ganib. Here is how to do it:


    ```

    ```

    $ mysql -u root -p

    mysql> CREATE DATABASE ganib CHARACTER SET utf8

    COLLATE utf8_general_ci;

    mysql> exit;

    $ mysql -h localhost -u root -p ganib < database/

    ganib.sql

    ```

    ```


    ![](img/628186dda7facdc011bf39c938de3975_40_0.png)


    # Import/Export MSP


    > If you switched to Ganib recently and your project plan is saved in Microsoft
    Project, you can easily import your MS Project files into Ganib. To do this go
    to the Plan module, and hover over the MSP link. You’ll see options to Import
    and Export MSP. You can also share your plans with customers/partners in MSP file
    format by exporting it to MSP.


    Next edit the Tomcat/conf/context.xml file to change the database connection properties.


    ```

    ```

    <Resource name="jdbc/GanibDB" auth="Container"

    type="java.sql.DataSource" username="root"

    password="" driverClassName="com.mysql.jdbc.Driver"

    url="jdbc:mysql://localhost:3306/ganib?"

    &amp;autoReconnect=true&amp;useUnicode=true&amp;characte

    rEncoding=utf-8" maxActive="125" maxIdle="25" />

    ```

    ```


    Don’t forget to change the username, password and the database name as per your
    setup. We’re assuming you’re installing Ganib on localhost, so we’ll also need
    to change the SMTP settings. So, edit the same file as above and also update the
    following:


    > “Though time tracking is crucial for a project it is also very time consuming
    to enter data manually after each task”


    ```

    ```

    <Resource

    name="mail.GanibSession"

    type="javax.mail.Session"

    auth="Container"

    mail.smtp.host="localhost"

    mail.smtp.auth="false"

    mail.smtp.user="username"

    password="password"

    mail.smtp.port="25"

    mail.transport.protocol="smtp"

    />

    ```

    ```


    Now, to start Ganib, run


    ```

    ```

    $ chmod +x Start_Ganib.sh

    $ ./Start_Ganib.sh

    ```

    ```


    If everything is fine, you’ll be able to access Ganib at localhost:8080 on your
    browser.


    # 03 Getting started


    Now that Ganib is successfully installed and you can access the homepage on your
    browser, let’s get started with its basic usage. First, we will create an account.
    Once logged in to the Ganib application, you will be asked to provide an account
    name and account description in the home page. Provide the relevant information
    and on submitting the required data, you will see an account dashboard page for
    the new account. Next we create user accounts for the members of the project.
    Once you are inside an account, select the Resources button on'
