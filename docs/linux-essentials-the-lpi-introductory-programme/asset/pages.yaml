    \ lines in $f\ndone | sort -n\n$ ./sort-wc /etc/passwd /etc/fstab /etc/motd\n\
    ```\n\n(The \"wc -l\" command counts the lines of its standard input or the file(s)\
    \ passed on the command line.) Do note that you can redirect the standard output\
    \ of a loop to sort using a pipe line!\n\nAlternatives You can use the aforementioned\
    \ && and || operators to execute certain commands only under specific circumstances.\
    \ The\n\n```\n#!/bin/bash\n# grepqp REGEX\nrm -rf backup; mkdir backup\nfor f\
    \ in *.txt\ndo\n    grep $1 \"$f\" && cp \"$f\" backup\ndone\n```\n\nscript, for\
    \ example, copies a file to the backup directory only if its name ends with .txt\
    \ (the for loop ensures this) and which contain at least one line matching the\
    \ regular expression that is passed as a parameter.\n\nA useful tool for alternatives\
    \ is the test command, which can check a large variety of conditions. It returns\
    \ an exit code of 0 (success), if the condition holds, else a non-zero exit code\
    \ (failure). For example, consider\n\n```\n#!/bin/bash\n# filetest NAME1 NAME2\
    \ ...\nfor name\ndo\n    test -d \"$name\" && echo $name: directory\n    test\
    \ -f \"$name\" && echo $name: file\n    test -L \"$name\" && echo $name: symbolic\
    \ link\ndone\n```\n\nThis script looks at a number of file names passed as parameters\
    \ and outputs for each one whether it refers to a directory, a (plain) file, or\
    \ a symbolic link.\n\n> ⚠ The test command exists both as a free-standing program\
    \ in /bin/test and as a built-in command in bash and other shells. These variants\
    \ can differ subtly especially as far as more outlandish tests are concerned.\
    \ If in doubt, read the documentation."
