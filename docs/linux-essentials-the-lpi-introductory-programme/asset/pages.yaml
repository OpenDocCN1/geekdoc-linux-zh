  md: '![](img/44bdd771e9c9b1353d2401c2892b2459_222_0.png)


    # B


    # Example Files


    In various places, the fairy tale *The Frog King*, more exactly *The Frog King,
    or Iron Henry*, from *German Children''s and Domestic Fairy Tales* by the brothers
    Grimm, is used as an example.  The fairy tale is presented here in its entirety
    to allow for comparisons with the examples.


    # The Frog King, or Iron Henry


    In olden times when wishing still helped one, there lived a king whose daughters
    were all beautiful, but the youngest was so beautiful that the sun *itself*, which
    has seen so much, was astonished whenever it shone in her face.


    Close by the king''s castle lay a great dark forest, and under an old lime-tree
    in the forest was a well, and when the day was very warm, the king''s child went
    out into the forest and sat down by the side of the cool fountain, and when she
    was bored she took a golden ball, and threw it up on high and caught it, and this
    ball was her favorite playingth.


    Now it so happened that on one occasion the princess''s golden ball did not fall
    into the little hand which she was holding up for it, but on to the ground beyond,
    and rolled straight into the water.  The king''s daughter followed it with her
    eyes, but it vanished, and the well was deep, so deep that the bottom could not
    be seen.  At this she began to cry, and cried louder and louder, and could not
    be comforted.


    And as she thus lamented someone said to her, *„What ails you, king''s daughter?  You
    weep so that even a stone would show pity.“


    She looked round to the side from whence the voice came, and saw a frog stretching
    forth its big, ugly head from the water.  *„Ah, old water-splasher, is it you,“*
    she said, *„I am weeping for my golden ball, which has fallen into the well.“


    *„Be quiet, and do not weep,“* answered the frog, *„I can help you, but what will
    you give me if I bring your playingth up again?*


    *„Whatever you will have, dear frog,“* said she, *„My clothes, my pearls and jewels,
    and even the golden crown which I am wearing.“'
