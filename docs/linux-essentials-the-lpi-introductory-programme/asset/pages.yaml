  img_proc: true
- pgno: 29
  md: 'This means that it is, in principle, illegal to copy a program or a complete
    software package without the explicit consent of the copyright holder (the programmer
    or their employer).


    ![](img/44bdd771e9c9b1353d2401c2892b2459_29_0.png)


    In the early days of the computer it was not common for software to be sold. You
    were either given it together with your computer (which used to be expensive enough—millions
    of dollars) or would write it yourself. On the university scene in the 1960s and
    1970s it was utterly normal to swap or copy programs, and in 1976 a certain Bill
    Gates was horrified to find out that his BASIC interpreter for the MITS Altair
    8800 proved very popular indeed and he got lots of kudos for it, but almost nobody
    found it necessary to pay his asking price! Of course that wasn''t proper on the
    users'' part, but even the *idea* that software should be paid for was so outlandish
    at the time that few people actually entertained the thought.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_29_1.png)


    As computers spread through offices during the late 1970s and 1980s, it be-came
    more and more common to sell software instead of giving it away. Not only that—the
    software companies sold only the executable machine code, not the source code
    that people would be able to examine to find out how the software worked, or even
    to modify. At some point, Richard M. Stall-man, who used to be an MIT researcher,
    decided to try and reverse this trend by working on a system that would emphasise
    the culture of sharing that was the norm during the 1960s and 1970s. This “GNU”
    system$^3$ remains unfinished, but many of its components are now in use on Linux
    systems.


    Richard M. Stallman (often called “RMS” for short) can be thought of as the father
    of the idea of *free software*. In this context “free” does not mean “free of
    charge”, but that the user is “free” to do various things they would not be able
    or allowed to do with proprietary software$^4$. RMS calls a software package “free”
    if four conditions, the “Four Freedoms”, are met:


    +   -   The freedom to run the program for any purpose (Freedom 0).

    +   -   The freedom to study how the program works, and change it to make it do
    what you wish (Freedom 1).

    +   -   The freedom to redistribute copies so you can help your neighbor (Fre-dom
    2).

    +   -   The freedom to improve the program, and release your improvements (and
    modified versions in general) to the public, so that the whole community benefits
    (Freedom 3).


    Access to the program''s source code is a prerequisite for freedoms 1 and 3. The
    idea of free software was favourably received in general, but even so the goals
    of RMS and the *Free Software Foundation* (FSF) were often misunderstood. In particular,
    companies took exception to the word “free”, which in spite of appro-priate clarifications
    was often confused with “cost-free”. At the end of the 1990s, Eric S. Raymond,
    Bruce Perens and Tim O’Reilly created the *Open Source Initiative* (OSI), whose
    goal it was to provide better and less ideological marketing for free software.
    The FSF wasn''t enthusiastic about this “watering down” of its ideas, and in spite
    of the very similar goals of the FSF and OSI the controversy has not died down
    completely even now (which to a certain degree may be due to the considerable
    egos of some of the main people involved).


    ![](img/44bdd771e9c9b1353d2401c2892b2459_29_2.png)


    While the “free” in “free software” encourages the confusion with “no charge”,
    the “open source” in “open-source software” can be interpreted such that the source
    code may be inspected but not modified or passed on—both of which are basic tenets
    of the OSI. In this sense, neither of the terms is 100% unambiguous. The community
    often refers to “FOSS” (for free


    $^3$“GNU” is a “recursive acronym” for “GNU''s Not Unix”.

    $^4$The “Free Software Foundation”, Stallman''s organisation, calls this “free
    as in speech, not as in beer”.'
