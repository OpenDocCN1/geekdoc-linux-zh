- pgno: 39
  md: 'Linux is also useful as a development environment for "embedded systems", namely
    computers running inside consumer appliances that are either based on Linux itself
    or use specialised operating systems. On a Linux PC, it is straightforward to
    install a compiler environment that will generate machine code for, say, ARM processors.
    Linux also serves to develop software for Android smartphones, and professional
    tools for this purpose are supplied for free by Google.


    # Exercises


    +   **2.5 [!]** Which FOSS programs have you heard about? Which ones have you
    used yourself? Do you find them better or worse than proprietary alternatives?
    If so, why? If not, why not?


    # **2.4** Important Linux Distributions


    # **2.4.1** Overview


    If someone says something like "My PC runs Linux", they usually mean not (just)
    Linux, the operating system kernel, but a complete software environment based
    on Linux. This normally includes the shell (bash) and command-line tools from
    the GNU project, the X.org graphics server and a graphical desktop environment
    such as KDE or GNOME, productivity tools like LibreOffice, Firefox or The GIMP
    and lots of other useful software from the previous section. Of course it is possible
    to assemble all these tools from their original sources on the Internet, but most
    Linux users prefer a pre-made software collection or "Linux distribution".


    The first Linux distributions appeared in early 1992\—however, none of those is
    still being developed, and they are mostly forgotten. The oldest distribution
    that is still being worked on is Slackware, which first appeared in July, 1993.


    There is a multitude of Linux distributions with different goals and approaches
    and different organisational structure. Some distributions are published by companies
    and possibly only sold for money, while other distributions are put together by
    teams of volunteers or even individuals. In this section we shall be discussing
    the most important general-purpose distributions.


    If we do not mention your favourite distribution here this isn''t due to the fact
    that we can''t abide it, but really due to the fact that our space and time is
    limited and we must (unfortunately!) restrict ourselves to essentials (no pun
    intended). If a distribution isn''t on our list that doesn''t imply that it is
    bad or useless, but only that it isn''t on our list.


    The "DistroWatch" web site (http://distrowatch.com/) lists the most important
    Linux distributions and serves as a focal point for distribution-oriented news.
    Right now it contains 317 distributions (that is three hundred and seventeen!),
    but by the time you''re reading this, this number is probably no longer correct.


    # **2.4.2** Red Hat


    Red Hat (http://www.redhat.com/) was established in 1993 as "ACC Corporation",
    a distribution company for Linux and Unix accessories. In 1995, the company founder,
    Bob Young, bought the business of Marc Ewing, who in 1994 had published a Linux
    distribution called "Red Hat Linux", and changed the name of his corporation to
    "Red Hat Software". In 1999, Red Hat went public and is by now probably the largest
    corporation solely based on Linux and open-source software. It is part of the
    "Standard & Poor''s 500", a stock index which serves as an indicator for the US
    economy.'
