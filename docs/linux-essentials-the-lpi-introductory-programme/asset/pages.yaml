    # 8.2 Filter Commands


    One of the basic ideas of Unix—and, consequently, Linux—is the “toolkit principle”.
    The system comes with a great number of system programs, each of which performs
    a (conceptually) simple task. These programs can be used as “building blocks”
    to construct other programs, to save the authors of those programs from having
    to develop the requisite functions themselves. For example, not every program
    contains its own sorting routines, but many programs avail themselves of the `sort`
    command provided by Linux. This modular structure has several advantages:


    +   It makes life easier for programmers, who do not need to develop (or incorporate)
    new sorting routines all the time.


    +   If `sort` receives a big fix or performance improvement, all programs using
    `sort` benefit from it, too—and in most cases do not even need to be changed.


    Tools that take their input from standard input and write their output to standard
    output are called “filter commands” or “filters” for short. Without input redirection,
    a filter will read its input from the keyboard. To finish off keyboard input for
    such a program, you must enter the key sequence `Ctrl` + `d`, which is interpreted
    as “end of file” by the terminal driver.


    > Note that the last applies to keyboard input *only*. Files on the disk may of
    course contain the `Ctrl` + `d` character (ASCII 4), without the system believing
    that the file ended at that point. This as opposed to a certain very popular operating
    system, which traditionally has a somewhat quaint notion of the meaning of the
    Control-Z (ASCII 26) character even in text files . . .


    Many “normal” commands, such as the aforementioned `grep`, operate like filters
    if you do not specify input file names for them to work on.


    In the reminder of the chapter you will become familiar with a selection of the
    most important such commands. Some commands have crept in that are not technically
    genuine filter commands, but all of them form important building blocks for pipelines.'
  merge: -1
  img_proc: true
