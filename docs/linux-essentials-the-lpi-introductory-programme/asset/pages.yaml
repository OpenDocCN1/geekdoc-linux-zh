- pgno: 197
  md: '# 15.1 Networking Basics


    # 15.1.1 Introduction and Protocols


    In the 21st century, computers are only really fun when they are connected to
    the Internet—via a company-wide "local area network", a home DSL router, or, on
    the go, a wireless connection (WiFi or cellular). There are various methods of
    getting on the net—but whichever way you''re using, the Internet itself works
    pretty much the same.


    The Internet is based on a "protocol family" called "TCP/IP". A protocol is an
    agreement about how computers should talk to one another, and can cover anything
    from particular electrical, optical or radio signals up to requests and responses
    from and to, e. g., a web server (but not all at the same time). Without cutting
    things too finely, it is possible to distinguish three different types of protocol:


    **Medium access protocols** govern data transmission (casually speaking) at the
    level of network cards and cables. They include, for example, Ethernet (for LANs)
    or WLAN protocols such as IEEE 802.11.


    **Communication protocols** govern the communication between stations on different
    networks. If you want to access a web site in Australia from Britain, the communication
    protocols IP and TCP arrange for the data bytes you''re sending to actually arrive
    "down under" and vice-versa.


    **Application protocols** make sure that the recipient of your data bytes in Australia
    can actually do something with them. The web application protocol, HTTP, for example,
    allows you to retrieve a picture of a koala; the server in Australia interprets
    your request and sends you the koala picture (instead of the kangaroo picture),
    while your web browser in Britain can figure out that you have actually been sent
    a picture and not a (textual) error message.


    That multi-tier setup has the considerable advantage that each layer must only
    communicate with the layer immediately above and the layer immediately below.
    The application protocol, HTTP, does not need to know how bytes are moved from
    Britain to Australia (fortunately!), because it delegates that job to the communication
    protocol. The communication protocol in turn leaves the actual transmission of
    the bytes to the medium access protocol.


    At this point it is customary to refer to the "ISO/OSI reference model", which
    stipulates no less than seven (!) layers for the organisation of a computer network.
    We will spare you the details in the interest of brevity.


    The TCP/IP application protocols—besides HTTP, these include SMTP (for e-mail),
    SSH (for interactive sessions on remote machines), DNS (for resolving host names)
    or SIP (for Internet-based telephony), among many others—are usually based on
    either of two communication protocols, UDP or TCP. While UDP provides a connectionless,
    unreliable service (in plain language: data can get lost during transmission or
    arrive at the destination in a different order from that in which they were sent),
    TCP offers a connection-oriented, reliable service (which means all data will
    arrive at the other end in the proper sequence).


    The application determines which communication protocol is more appropriate. On
    the Web, you normally do not want data to go missing during transmission (a piece
    of text, image, or downloaded software might get lost, with annoying to catastrophic
    results), hence TCP is the correct choice. For television or voice chat, it is
    usually preferable to live with small breaks in the service (a pixellated picture
    or a brief burst of static) than for everything to grind to a halt while the system
    arranges for a missing datagram to be'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'retransmitted. At this point, UDP makes more sense. UDP is also better for
    services like DNS, where small requests should result in very quick and brief
    answers.


    The third TCP/IP communication protocol, ICMP, is used for control and troubleshooting
    purposes and is normally not used directly by user-level applications.


    # ### 15.1.2 Addressing and Routing


    In order to allow direct access via the Internet—your computer sends a request
    to a specific server, and the response to that request must somehow find its way
    back to your computer—, every computer uses a unique address, its “IP address”.
    In the (still) most popular scheme, “IPv4”, this is a sequence of four “octets”,
    i.e., numbers from 0 to 255, such as 192.168.178.10.


    You cannot simply pick any arbitrary IP address for your computer. Instead, it
    is assigned one. In a company, this will be done by the systems or network administrator,
    while your ISP will take care of it for your home connection.


    In the company you are likely to use the same IP address all of the time. Your
    ISP, on the other hand, will only “lend” you an address for a certain limited
    time; the next time you will get a different one. On the one hand this enables
    your ISP to use fewer addresses than the number of its customers (since not every
    customer is online all the time), and on the other hand this is supposed to discourage
    you from offering services for which a constantly changing IP address would be
    a nuisance.


    The IP addresses themselves do not fall from the sky, but are—as far as possible—assigned
    with forethought, in order to keep the exchange of data between different networks,
    or “routing”, straightforward. We will look at this in more detail later on.


    Computers usually have more than one IP address. The “loopback address” 127.0.0.1
    is available on every computer and refers to that computer itself; it is not accessible
    from the outside. A service that is bound to the 127.0.0.1 address can only be
    accessed by clients that are running on the same machine. loopback address


    That sounds absurd and useless, but does in fact make eminent sense: For example,
    you might be developing a web site that must be able to send mail to users (say,
    containing activation links for user accounts). To test this on your development
    machine, you could install a local mail server that only accepts mail on the loopback
    address—which will be perfectly adequate for your project while keeping you safe
    from being inundated with spam from elsewhere on the Internet.


    On computers featuring Ethernet or WiFi, the corresponding interfaces also have
    IP addresses—at least if the computer is currently connected to the network. In
    addition, nothing prevents you from assigning additional addresses to the network
    interfaces for testing or specialised configurations.


    The challenge consists of arranging for an arbitrary computer X on the Internet
    to be able to communicate with another arbitrary computer Y, as long as it knows
    Y’s IP address. (If X is located in Britain and Y in Australia, it is not 100%
    obvious how X’s bytes should reach Y.) The magic word which makes this possible
    is “routing”. And it works approximately like this: routing


    +   - Your computer X can find out Y’s IP address (this is what the DNS is for).
    Let’s assume it is 10.11.12.13.


    +   - Computer X can figure out that the IP address 10.11.12.13 is not on the
    same local area network as its own (which is no wonder considering that Y is in
    Australia). This means that computer X cannot send data directly to computer Y
    (big surprise).'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'default route


    +   • Computer X’s network configuration contains a “default route”, otherwise
    known as a recipe for what to do with data that cannot be sent to their destination
    directly. This might look like “Send anything you can’t immediately deliver on
    to computer Z”. The computer Z is also called a “default gateway”.


    +   • Computer Z—possibly your DSL router—cannot deliver the data to computer
    Y directly, either. However, it knows what to do with data that is not addressed
    to computers like X that are directly connected to itself, namely to send it on
    to your ISP.


    +   • This game continues across a few more levels until your data arrives at
    a computer which knows that data addressed to 10.11.x.y must be sent to the Australian
    ISP (let’s call it “Billabong-Net”), so it is sent there.


    +   • Billabong-Net knows (hopefully), how incoming data to 10.11.12.13 must be
    forwarded to their ultimate destination. The particular computer Y may be located
    at one of Billabong-Net’s customer’s, or one of that customer’s customer’s, but
    if everything is configured correctly it will work out right.


    +   • Any responses from Y to X take a similar route back.


    The important observation here is that the actual route that data take from computer
    X to computer Y is determined while the data is being transmitted. Computer X
    does not need to specify a complete list of intermediate destinations, but relies
    on every intermediate destination doing the Right Thing. Conversely, every computer
    only needs “local” knowledge and does not need to know what is where on the whole
    Internet—which would be quite impossible.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_199_0.png)


    One of the properties of IP as a communication protocol is that the routing can,
    in principle, change from one packet to the next (even if this usually does not
    happen). This enables the Internet to react to congestion or connection outages
    in a flexible manner.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_199_1.png)


    This is essentially similar to “snail mail”. You don’t need to know the exact
    route your birthday card takes to reach Auntie Fran in Sydney; you simply put
    the correctly stamped envelope into your friendly neighbourhood postbox.


    At the end of the day this means that your Linux computer needs to know three
    things: its own IP address, the set of addresses it can reach directly, and a
    default gateway for the rest. The set of addresses that your computer can reach
    directly is described by the IP address of your local network together with a
    “subnet mask”, which today is most commonly specified as a number.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_199_2.png)


    Imagine your computer has the IP address 192.168.178.111 within the local network
    192.168.178.0/24. Here, 24 is the subnet mask—it specifies that the first 24 bits
    of your address (the first three octets, namely 192.168.178) address the network
    itself. The final octet (or the last 8 bits to make up 32) is available for local
    addresses. This means that all computers with addresses from 192.168.178.0 to
    192.168.178.255—if they exist at all—can be reached directly; the default gateway
    (which must have an address within the local network) must be used to reach any
    other IP address.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_199_3.png)


    Actually, in our example the addresses 192.168.178.0 and 192.168.178.255 would
    not be available for computers since they have a special meaning, but we only
    mention this for completeness.


    You can in principle set these essential networking parameters—IP address, subnet
    (mask), and default gateway—manually as part of your computer’s network configuration.
    (The details depend on your distribution.) However, it is very'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'probable that your network provides a “DHCP server” which will make these parameters
    available to your computer without you having to worry about them.


    Hence, if you want to add a Linux computer as a LAN client, it should normally
    suffice to switch it on and to plug an Ethernet cable into the appropriate socket
    or to select a WiFi network from the appropriate menu and possibly enter the corresponding
    password. If there are any problems whatsoever, then call loudly and persistently
    for your system or network administrator.


    # 15.1.3 Names and the DNS


    IP addresses are nice and important, but somewhat inconvenient to use. It would
    be very aggravating if you had to enter (much less remember) the address 213.157.7.75
    to access the server offering the latest version of this manual. shop.linupfront.com
    is that much harder.


    The way to get to inconvenient IP addresses given convenient names (and vice versa)
    is via the Domain Name System, or DNS. DNS is a globally distributed database
    for host names, IP addresses, and various other items, and it can be accessed
    via DNS servers (a. k. a. “name servers”). Your company or ISP should be running
    one (or, even better, two for redundancy) DNS server on your behalf.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_200_0.png)


    You can do it yourself if you want—based on Linux, of course—and, by the time
    you''re running a reasonably-sized LAN for your company, with a web and mail server,
    this is usually a good idea. However, that places us dangerously close to LPI/C-2
    territory.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_200_1.png)


    The address of the DNS server(s) goes together with the other “essential network
    parameters” from the previous section—IP address, subnet(mask), default gateway—that
    every Linux machine ought to have.


    As with IP addresses and routes, no single DNS server must have complete knowledge
    of all existing names (there are much too many of those by now, anyway). In fact,
    there is a hierarchy:


    +   The “root-level name servers” know about the part of a name on the very right—like
    .de, .com, .tv, whatever—and know which name servers are in charge of the content
    of these zones.


    +   The name servers for .de (by way of an example) know all the names of the
    form something.de and can tell which name servers know about names below those
    names.


    +   The name servers for a name like something.de (which are usually situated
    at the company in question or their ISP) know the IP address for a name like www.something.de
    and can supply it if required.


    This means that to “resolve” a name like shop.linupfront.de, your computer first
    asks a root-level name server for the name servers in charge of de. Then it asks
    one of those name servers for the name servers in charge of linupfront.de. Finally
    it asks a linupfront.de nameserver for the address of shop.linupfront.de.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_200_2.png)


    Actually it''s not “your computer” doing the work, it''s the DNS server your computer
    is using. But that doesn''t detract from the principle.


    Of course this is a fairly involved scheme, and this is why your system keeps
    any answers around for a while. If you have found out that shop.linupfront.de
    corresponds to the IP address 213.157.7.75, the assumption is that this will stay
    the same for a while, so the resolution process is only repeated after that time
    has expired.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_200_3.png)


    The advantage of this scheme is that we at Linup Front are free to dispose of
    names “below” linupfront.de and can add them to our DNS server as we wish. Other
    people get them directly from there. It would be much more of a hassle to have
    to petition the “Internet office” for a new name, and to have to wait for it to
    be added to the official list. (Think of changes to the land register and how
    long these usually take.)'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# ### 15.1.4 IPv6


    IP as a communications protocol has been around for something like 30 years, and
    we have found out in the meantime that some assumptions that were made back then
    must have been somewhat naive. For example, IPv4 (the current version of the protocol)
    allows, in principle, $2^{32}$, or approximately 4 billion, addresses. Due to
    limitations in the protocol as well as various awkwardnesses with their distribution,
    there are very few if any unused IPv4 addresses left—and in an age where nearly
    everybody carries an Internet-enabled smartphone and even more people would like
    to have one, this is a definite problem.


    +   There are ways of alleviating this problem—for example, not every single Internet-enabled
    cellphone gets an IP address that is visible from everywhere on the Internet.
    Instead, the operators wall off their networks from the actual Internet in order
    to be able to distribute more addresses (cue “network address translation”, NAT).
    These methods are fairly disgusting and do imply other problems.


    IPv6, the designated successor to IPv4¹, has been available since the late 1990s.
    IPv6 does away with various restrictions of IPv4, but ISPs are still somewhat
    reluctant to roll IPv6 out comprehensively. Linux does deal very well with IPv6,
    and since you can quite happily run IPv4 and IPv6 in parallel, there is nothing
    preventing you from setting up an IPv6-based infrastructure in your company (or
    even your domestic LAN—many DSL routers support IPv6 by now). Here are some of
    the more important properties of IPv6:


    +   **Extended address space** Instead of 32-bit addresses, IPv6 uses 128-bit
    addresses, in the expectation that this will suffice for the foreseeable future
    (chances are fairly good). IPv6 addresses are notated by writing down chunks of
    two bytes in hexadecimal (base 16), using a colon as the separator:


    ```

    fe80:0000:0000:0000:025a:b6ff:fe9c:406a

    ```


    Leading zeroes may be removed from every block of four digits:


    ```

    fe80:0:0:0:25a:b6ff:fe9c:406a

    ```


    Furthermore, at most one sequence of blocks of zeroes may be replaced by “::”:


    ```

    fe80::25a:b6ff:fe9c:406a

    ```


    The loopback address, i. e., the moral equivalent to IPv4''s 127.0.0.1, is ::1.


    +   **Address assignment** With IPv4, your ISP assigns you one IPv4 address or
    at most a few (unless you are a really big company or another ISP—and even for
    those, addresses are by now fairly scarce). If you need more addresses for your
    computers you need to become devious. With IPv6, you are instead assigned a complete
    *network*, namely a “subnet prefix” that fixes only 48 or 56 of the possible 128
    address bits. You are then free to assign $2^{64}$ addresses in each of a number
    of subnets, and this is probably more than you will be able to use (according
    to IPv4, the *whole Internet* only uses $2^{32}$ addresses—a small fraction of
    this).


    +   **Simple configuration** While with IPv4 a computer must be assigned a local
    IP address—possibly with the aid of a DHCP server—, using IPv6 a computer can
    assign itself an address that is suitable to communicate with other computers
    in the immediate vicinity. With IPv6, a computer can also, without DHCP, locate
    routers in the neighbourhood which are prepared to forward'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'data to the Internet. This avoids various problems with DHCP on IPv4. Incidentally,
    IPv6 does not use a “default route”.


    **Other improvements** The format of IP datagrams was changed to enable more efficient
    routing. In addition, IPv6 defines methods to change a network’s subnet prefix
    much more easily than a network’s address could be changed in IPv6—this is also
    an attempt to simplify routing. Furthermore, IPv6 supports encrypted networks
    (IPsec) and mobility where computers—think of cell phones—can migrate from one
    network to another without changing addresses or interrupting existing connections
    (“mobile IPv6”).


    **Compatibility** The introduction of IPv6 only impacts IP—protocols like TCP
    and UDP or the application protocols on top of those remain unchanged. As we have
    mentioned, it is also possible to run IPv4 and IPv6 in parallel.


    # Exercises


    +   *   **15.1** [!] Which medium access protocols (except Ethernet or IEEE-802.11)
    do you know? Which communication protocols (except IP, TCP, and UDP)? Which application
    protocols except those mentioned above?


    +   *   **15.2** [!] How many usable IP addresses does the network 10.11.12.0/22
    contain? (Subtract the first and last addresses because of their special meaning.)


    # # 15.2 Linux As A Networking Client


    # ## 15.2.1 Requirements


    We have already outlined the essentials necessary to add a Linux-based computer
    to an existing network as an (IPv4) client (the only use case pertinent to *Linux
    Essentials*):


    +   * An IP address for the computer itself

    +   * A network address and subnet mask for the computer (so it can tell which
    IP addresses are “local”)

    +   * The address of a default gateway on the local network

    +   * The address(es) of one (better two) DNS server(s).


    In the ideal case your computer will obtain these settings automatically via DHCP
    when it is booted, when the LAN cable is plugged in, or when you log into a wireless
    network from a mobile system. If this is not the case, you must configure these
    parameters yourself. The details depend on your distribution:


    +   *   On Debian GNU/Linux and its derivative distributions, the network configuration
    is stored in a file called `/etc/network/interfaces`. The format is largely self-explanatory,
    and there is a commented example in `/usr/share/doc/ifupdown/examples/network-interfaces.gz`.
    In a pinch, there is documentation in `interfaces(5)`.


    +   *   On the SUSE distributions, you configure networking parameters most straightforwardly
    via YaST (see “Network Devices/Network Cards”). Otherwise there are configuration
    files below `/etc/sysconfig/network`.


    +   *   On Red Hat distributions and their derivatives, there are configuration
    files in the `/etc/sysconfig/network-scripts` directory.'
  merge: -1
  img_proc: true
