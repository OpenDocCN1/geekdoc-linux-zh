    Some brief remarks concerning password encryption are in order. You might think
    that if passwords are encrypted they can also be decrypted again. This would open
    all of the system''s accounts to a clever cracker who manages to obtain a copy
    of /etc/shadow. However, in reality this is not the case, since password "encryption"
    is a one-way street. It is impossible to recover the decrypted representation
    of a Linux password from the "encrypted" form because the method used for encryption
    prevents this. The only way to "crack" the encryption is by encrypting likely
    passwords and checking whether they match what is in /etc/shadow.


    Let''s assume you select the characters of your password from the 95 visible ASCII
    characters (uppercase and lowercase letters are distinguished). This means that
    there are 95 different one-character passwords, $95^{2}=9025$ two-character passwords,
    and so on. With eight characters you are already up to 6.6 quadrillion ($6.6 \cdot
    10^{15}$) possibilities. Stipulating that you can trial-encrypt 250,000 passwords
    per second (not entirely unrealistic on current hardware), this means you would
    require approximately 841 years to work through all possible passwords.


    But do not feel too safe yet. The traditional method (usually called "crypt" or
    "DES"—the latter because it is based on, but not identical to, the eponymous encryption
    method^{3}) should no longer be used if you can avoid it. It has the unpleasant
    property of only looking at the first eight characters of the entered password,
