    \ IBM’s first computer, the *Harvard Mark IV*. The first computers in a modern\
    \ sense were built during World War II to assist with decrypting secret messages\
    \ or doing difficult calculations, and they were big, complicated and error-prone\
    \ devices – the electronic components such as transistors or integrated circuits\
    \ which today’s computers consist of hadn’t been invented yet. What did come to\
    \ light during this time and the years immediately after the war were a number\
    \ of basic assumptions that had to hold for a device to be considered a “computer”:\n\
    \n+   * A computer processes *data* according to a sequence of *automatically*\
    \ executed instructions, a *program*.\n+   * Programs must allow for *conditional\
    \ execution* and *loops*.\n+   * It must be possible to change or replace the\
    \ program that a computer executes.\n\nFor example, many technical devices – from\
    \ television sets and digital cameras to washing machines or cars – today contain\
    \ programmed control units, almost small computers. Even so, we don’t consider\
    \ these devices “computers”, because they only execute fixed, unchangeable programs.\
    \ Conversely, a pocket calculator can be used to “process data”, but – at least\
    \ as long as it isn’t a more expensive “programmable calculator” that doesn’t\
    \ happen automatically; a human being must tap the keys.\n\nIn the early 1950s,\
    \ computers were highly specialised devices that one would – exactly as Aiken\
    \ stipulated – expect to see mostly within research institutions. Science-fiction\
    \ films of the time display the halls, replete with rows of cupboards containing\
    \ mysterious spinning reels. Within the space of not quite 70 years, this image\
    \ has changed dramatically¹.\n\n> “There is no reason for anyone to have a computer\
