  md: 'interface and thus determines how the computer "looks and feels" to its users.


    When you buy a new computer it is usually delivered with a pre-installed operating
    system: PCs with Microsoft Windows, Macs with OS X, smartphones often with Android
    (a Linux derivative). The operating system, though, is not tied as closely to
    a computer as the firmware, but can in many cases be replaced by a different one—for
    example, you can install Linux on most PCs and Macs.


    Or you install Linux *in addition* to an existing operating system—usually not
    a problem either.


    * **User-level programs** allow you to do something useful, such as write documents,
    draw or manipulate pictures, compose music, play games, surf the Internet or develop
    new software. Such programs are also called *applications*. Additionally, there
    are often *utilities* that the operating system provides in order to allow you—or
    a designated “system administrator”—to make changes to the computer’s configuration
    and so on. Servers, in turn, often support software that provides services to
    other computers, such as web, mail or database servers.


    # 1.4 The Most Important Operating Systems


    # 1.4.1 Windows And OS X


    When talking about computer operating systems, most people will automatically
    think of Microsoft Windows${}^{2}$. This is due to the fact that nowadays most
    PCs are sold with Windows preinstalled—really not a bad thing in itself, since
    their owners can get them up and running without having to take the trouble to
    install an operating system first, but, on the other hand, a problem because it
    makes life hard for alternative operating systems such as Linux.


    In fact it is not at all straightforward to buy a computer without a pre-installed
    copy of Windows—for example, because you want to use it exclusively with Linux—,
    except when building one from scratch. Theoretically you are supposed to be able
    to get a refund for an unused preinstalled copy of Windows from the computer’s
    manufacturer, but we know of nobody who actually managed to obtain any money.


    Today’s Windows is a descendant of “Windows NT”, which was Microsoft’s attempt
    to establish an operating system that was up to the standards of the time in the
    1990s (earlier versions such as “Windows 95” were graphical extensions to the
    then-current Microsoft operating system, MS-DOS, and fairly primitive even by
    the standards of the day). Decency forbids us a critical appreciation of Windows
    here; let it suffice to say that it does approximately what one would expect from
    an operating system, provides a graphical user interface and supports most peripheral
    devices (support for more is provided by the individual device manufacturers).


    Apple’s “Macintosh” was launched in 1984 and has since been using an operating
    system called “Mac OS”. Over the years, Apple made various changes to the platform
    (today’s Macs are technically about the same as Windows PCs) and operating system,
    some of them quite radical. Up to and including version 9, Mac OS was a fairly
    flimsy artifact which, for example, only provided rudimentary support for running
    several programs at the same time. The current “Mac OS X”—the “X” is a Roman 10,
    not the letter “X”—is based on an infrastructure related to BSD Unix and is not
    unlike Linux in many ways.


    ${}^{2}$ Many people will not even be aware that there are other operating systems
    at all.'
