  md: '13 User Administration


    # ## 13.1 Basics


    # ### 13.1.1 Why Users?


    Computers used to be large and expensive, but today an office workplace without
    its own PC (“personal computer”) is nearly inconceivable, and a computer is likely
    to be encountered in most domestic “dens” as well. And while it may be sufficient
    for a family to agree that Dad, Mom and the kids will put their files into different
    directories, this will no longer do in companies or universities—once shared disk
    space or other facilities are provided by central servers accessible to many users,
    the computer system must be able to distinguish between different users and to
    assign different access rights to them. After all, Ms Jones from the Development
    Division has as little business looking at the company’s payroll data as Mr Smith
    from Human Resources has accessing the detailed plans for next year’s products.
    And a measure of privacy may be desired even at home—the Christmas present list
    or teenage daughter’s diary (erstwhile fitted with a lock) should not be open
    to prying eyes as a matter of course.


    We shall be discounting the fact that teenage daughter’s diary may be visible
    to the entire world on Facebook (or some such); and even if that is the case,
    the entire world should surely not be allowed to *write* to teenage daughter’s
    diary. (Which is why even Facebook supports the notion of different users.)


    The second reason for distinguishing between different users follows from the
    fact that various aspects of the system should not be visible, much less changeable,
    without special privileges. Therefore Linux manages a separate user identity (*root*)
    for the system administrator, which makes it possible to keep information such
    as users’ passwords hidden from “common” users. The bane of older Windows systems—programs
    obtained by e-mail or indiscriminate web surfing that then wreak havoc on the
    entire system—will not plague you on Linux, since anything you can execute as
    a common user will not be in a position to wreak system-wide havoc.


    Unfortunately this is not entirely correct: Every now and then a bug comes to
    light that enables a “normal user” to do things otherwise restricted to administrators.
    This sort of error is extremely nasty and usually corrected very quickly after
    having been found, but there is a considerable chance that such a bug has *remained
    undetected* in the system for an extended period of time. Therefore, on Linux
    (as on all other operating systems) you should strive to run the most current
    version of critical system parts like the kernel that your distributor supports.


    Even the fact that Linux safeguards the system configuration from unauthorised
    access by normal users should not entice you to shut down your brain. We do give
    you some advice (such as not to log in to the graphical user interface as *root*),
    but you should keep thinking along. E-mail messages asking you to view web site
    X and enter your credit card number and PIN there can reach you even on Linux,
    and you should disregard them in the same way as everywhere else.


    Linux distinguishes between different users by means of different **user accounts**.
    The common distributions typically create two user accounts during installation,
    namely *root* for administrative tasks and another account for a “normal” user.
    You (as the administrator) may add more accounts later, or, on a client PC in
    a larger network, they may show up automatically from a user account database
    stored elsewhere.


    Linux distinguishes between *user accounts*, not users. For example, no one keeps
    you from using a separate user account for reading e-mail and surfing the web,
    if you want to be 100% sure that things you download from the


