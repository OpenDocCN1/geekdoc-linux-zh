- pgno: 78
  md: '—the shell replaces this parameter in the actual program invocation by a sorted
    list of all file names that “match” the parameter. “Match” means that in the actual
    file name there may be an arbitrary-length sequence of arbitrary characters in
    place of the asterisk. For example, names like


    ```

    prog1/p1.c

    prog1/polly.c

    prog1/pop-rock.c

    prog1/p.c

    ```


    are eligible (note in particular the last name in the example—“arbitrary length”
    does include “length zero”). The only character the asterisk will not match is—can
    you guess it?—the slash; it is usually better to restrict a search pattern like
    the asterisk to the current directory.


    💡 You can test these search patterns conveniently using echo. The


    ```

    $ echo prog1/p*.c

    ```


    command will output the matching file names without any obligation or consequence
    of any kind.


    💡 If you really want to apply a command to all files in the directory tree starting
    with a particular directory, there are ways to do that, too. We will discuss this
    in Section 6.4.4.


    The search pattern “*” describes “all files in the current directory” —excepting
    All files hidden files whose name starts with a dot. To avert possibly inconvenient
    surprises, search patterns diligently ignore hidden files unless you explicitly
    ask for them to be included by means of something like “.*”.


    ⚠️ You may have encountered the asterisk at the command line of operating systems
    like DOS or Windows¹ and may be used to specifying the “*.” pattern to refer to
    all files in a directory. On Linux, this is not correct—the “*.*” pattern matches
    “all files whose name contains a dot”, but the dot isn’t mandatory. The Linux
    equivalent, as we said, is “*”.


    A question mark as a search pattern stands for exactly one arbitrary character
    question mark (again excluding the slash). A pattern like


    ```

    p?.c

    ```


    thus matches the names


    ```

    p1.c

    p?.c

    p?.c

    p..c

    ```


    (among others). Note that there must be one character—the “nothing” option does
    not exist here.


    > You should take particular care to remember a very important fact: The expansion
    of search pattern is the responsibility of the shell! The commands that you execute
    usually know nothing about search patterns and don’t care about them, either.
    All they get to see are lists of path names, and not where they come from—i.e.,
    whether they have been typed in directly or resulted from the expansion of search
    patterns.


    ¹ You’re probably too young for CP/M.'
