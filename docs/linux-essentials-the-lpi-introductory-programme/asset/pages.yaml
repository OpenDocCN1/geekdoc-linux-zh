  md: 'freedom in absolute terms. The GPL proponents on the other hand say that it
    is more important for code to stay free for everybody to use rather than disappear
    within proprietary systems, and that an indication of the greater freedom of the
    GPL is that those who obtain code from the pool of GPL software are also forced
    to give something back.


    **Apache licence** The Apache licence is like the BSD licence in that it allows
    the use and adoption of licensed code without requiring (like the GPL) that modified
    Apache-licensed code must be made available to the public. It is more complex
    than the BSD licence, but also contains clauses governing use of patents and trademarks
    and other details.


    **Mozilla Public License (MPL)** The Mozilla licence (which applies to the Firefox
    browser, among other software package) is a mixture of the BSD licence and the
    GPL. It is a “weak copyleft licence”, since on the one hand it requires that code
    obtained under the MPL must be distributed under the MPL if at all (like the GPL),
    but also allows adding code under other licences which does not need to be distributed
    under the MPL.


    The success of the FOSS community encouraged the law professor, Lawrence (Larry)
    Lessig to apply the concept to other works in addition to software. The goal was
    to increase the pool of cultural assets like books, images, music, films, etc
    that would be available to others for free use, modification and distribution.
    Since the common FOSS licences are mostly geared towards software, a set of *creative-commons*
    licences was developed to enable creators to donate their works to the public
    in a controlled fashion. They can stipulate various restrictions like “verbatim
    reproduction of the work only”, “modifications are allowed but (GPL-like) recipients
    of the modified work must be allowed to make further modifications” or an exclusion
    of commercial use of the work.


    The “public domain” applies to cultural works that no longer fall under copyright.
    While in the Anglo-Saxon legal tradition a creator may explicitly place a work
    (such as a piece of software) in the public domain by disclaiming all rights to
    it, this is not possible in other legal environments. For example, in Germany,
    works enter the public domain automatically 70 years after the last person involved
    in their creation has died. We shall have to wait a bit for the first computer
    program to become available to everyone in this way.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_35_0.png)


    There is a fair chance that no copyrighted works created after approximately 1930
    will ever enter the public domain. In the United States, Congress extends the
    copyright term whenever the copyright on a certain cartoon mouse is in danger
    of expiry, and the rest of the world is generally happy to follow suit. It is
    not entirely clear why Walt Disney’s *great-grandchildren* ought to be able to
    rake in money like Scrooge McDuck based on the great artist’s creativity, but
    as usual this mostly depends on who has the most influential lobbyists.


    In principle, the copyright holder of a software package can also distribute the
    package under several licences simultaneously—for example, the GPL for FOSS developers
    and a proprietary licence for companies which would rather not make their own
    source code available. Of course this makes most sense for libraries that other
    programmers can integrate in their own programs. Whoever wants to develop proprietary
    software can then “buy themselves out of” the GPL’s restrictions.


