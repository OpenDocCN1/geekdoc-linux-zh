    ```

    ```


    In this example, the `wc` filter command counts the words in file *frog.txt*.


    There is no `<<` redirection operator to concatenate multiple input files; to
    pass the content of several files as a command’s input you need to use `cat`:


    ```

    ```

    $ cat file1 file2 file3 | wc -w

    ```

    ```


    (We shall find out more about the `"|"` operator in the next section.) Most programs,
    however, do accept one or more file names as command line arguments.


    Of course, standard input and standard output may be redirected at the same time.
    The output of the word-count example is written to a file called *wordcount* here:


    ```

    ```

    $ wc -w <frog.txt >wordcount

    $ cat wordcount

    1397

    ```

    ```


    Besides the standard input and standard output channels, there is also the standard
    error output channel. If errors occur during a program’s operation, the corresponding
    messages will be written to that channel. That way you will see them even if standard
    output has been redirected to a file. If you want to redirect standard error output
    to a file as well, you must state the channel number for the redirection operator—this
    is optional for *stdin* (`0<&`) and *stdout* (`1>`) but mandatory for *stderr*
    (`2>`) .


    You can use the `>&` operator to redirect a channel to a different one:


    ```

    ```

    make >make.log 2>&1

    ```

    ```


    redirects standard output *and* standard error output of the `make` command to
    *make.log*.


    Watch out: Order is important here! The two commands


    ```

    ```

    make >make.log 2>&1

    make 2>&1 >make.log

    ```

    ```


    lead to completely different results. In the second case, standard error output
    will be redirected to wherever standard output goes (*//dev/tty*, where standard
    error output would go anyway), and then standard output will be sent to *make.log*,
    which, however, does not change the target for standard error output.


