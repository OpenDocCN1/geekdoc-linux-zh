  md: "+   • In the top part of the output, the first line shows the current wallclock\
    \ time and the “uptime”, i. e., the amount of time elapsed since the system was\
    \ booted (here, four days, fourteen hours, and change) and the number of logged-in\
    \ users (the “11” here shouldn’t be taken too seriously; every session in a terminal\
    \ window counts as a user). On the right there are three numbers, the so-called\
    \ load averages, which describe the system load.\n\n\U0001F4A1 The load averages\
    \ specify the number of runnable processes (state R), averaged over the last minute,\
    \ the last five minutes, and the last fifteen minutes respectively. The utility\
    \ of these values should not be overestimated ({}); they don’t really tell you\
    \ all that much. If the value for the last minute is high and the one for the\
    \ last 15 minutes low, then your system has suddenly got a lot more to do; if\
    \ the value for the last minute is low but that for the last 15 minutes is high,\
    \ your system used to have a lot to do but that is over now.\n\n\U0001F4A1 If\
    \ the load averages are constantly lower than the number of processor cores in\
    \ your system, this means that you have unnecessarily overspent on an expensive\
    \ processor. On an eight-core system, for example, values around 8 (which traditionally\
    \ would have sent cold shivers down a system administrator’s spine) are completely\
    \ unremarkable; values that are a lot smaller than 8 over prolonged periods of\
    \ time are pathetic.\n\n+   • The second line gives the number of processes and\
    \ how they are distributed over the various process states.\n+   \n+   • The third\
    \ line contains percentages according to the type of CPU utilisation: “us” is\
    \ the execution of code outside and “sy” that of code inside the operating system\
    \ kernel. “ni” is code outside the operating system kernel whose priority was\
    \ deliberately reduced by a user, and “id” is doing nothing, “wa” is waiting for\
    \ I/O, and the other three columns are not that interesting.\n+   \n+   • The\
    \ two following lines basically correspond to the output of free.\n+   \n+   •\
    \ The lower part of the screen is a process list similar to that of “ps 1”. Like\
