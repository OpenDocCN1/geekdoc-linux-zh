    6.1 In Linux, the current directory is a process attribute, i.e., every process
    has its own current directory (with DOS, the current directory is a feature of
    the drive, which of course is inappropriate in a multi-user system). Therefore
    cd must be an internal command. If it was an external command, it would be executed
    in a new process, change that process’s current directory and quit, while the
    invoking shell’s current directory would remain unchanged throughout the process.


