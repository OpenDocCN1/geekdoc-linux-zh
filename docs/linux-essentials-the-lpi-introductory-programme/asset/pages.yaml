- pgno: 206
  md: '**dig** The `dig` command is used to test DNS name resolution. Unless you specify
    otherwise, it tries to find an IP address corresponding to a name given on the
    command line:


    ```

    $ dig www.linupfront.de

    ; <<> DiG 9.8.1-P1 <<> www.linupfront.de

    ; global options: +cmd

    ; Got answer:

    ;->HEADER<- opcode: QUERY, status: NOERROR, id: 34301

    ; flags: qr rd ra; QUERY: 1, ANSWER: 2, AUTHORITY: 0, ADDITIONAL: 0

    ; QUESTION SECTION:

    ;www.linupfront.de.          IN  A

    ; ANSWER SECTION:

    www.linupfront.de.    3600 IN CNAME  s0a.linupfront.de.

    s0a.linupfront.de.    3600 IN A      31.24.175.68

    ; Query time: 112 msec

    ; SERVER: 127.0.0.1#53(127.0.0.1)

    ; WHEN: Thu Mar 1 16:06:06 2012

    ; MSG SIZE  rcvd: 69

    ```


    This (very verbose) output tells us in the “QUESTION SECTION” that we were looking
    for `www.linupfront.de` (not that we didn’t know that already). The “ANSWER SECTION”
    lets on that actually no IP address corresponds to `www.linupfront.de`, but that
    `www.linupfront.de` is in fact a “nickname” for the computer called `s0a.linupfront.de`
    (a popular approach). `s0a.linupfront.de`, however, has the address 31.24.175.68.
    Finally, the last block tells us that this response came from the DNS server running
    on 127.0.0.1.


    If there is no answer for some time and then something like


    ```

    ; <<> DiG 9.8.1-P1 <<> www.linupfront.de

    ; global options: +cmd

    ; connection timed out; no servers could be reached

    ```


    appears, then there is something rotten in the state of Denmark. Either your settings
    in `/etc/resolv.conf` are incorrect, or the name server doesn’t do what it should.


    You can ask a specific name server by mentioning it on the command line:


    ```

    $ dig www.linupfront.de @fritz.box          * Frage fritz.box*

    ```


    Of course resolving this name should not entail an expensive DNS query (or else
    you might have a chicken-egg problem); when in doubt, you can always specify an
    IP address directly:


    ```

    $ dig www.linupfront.de @192.168.178.1

    ```


    If you know your way around DNS, you can use `dig` to look for RR types other
    than A records. Just tell `dig` on the command line what you want:


    ```

    $ dig linupfront.de mx

    ```


    To find the name belonging to a given IP address (if any), you must specify the
    `-x` option:'
