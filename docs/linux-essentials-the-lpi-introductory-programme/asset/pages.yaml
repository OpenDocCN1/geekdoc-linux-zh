    # 9.2  Shell Variables and The Environment


    Like most common shells, bash has features otherwise found in programming languages.
    For example, it is possible to store pieces of text or numbers in variables and
    retrieve them later. Variables also control various aspects of the operation of
    the shell itself.


    Within the shell, a variable is set by means of a command like "foo=bar" (this
    command sets the foo variable to the textual value bar). Take care **not** to
    insert spaces in front of or behind the equals sign! You can retrieve the value
    of the variable by using the variable name with a dollar sign in front:


    ```

    $ foo=bar

    $ echo foo

    foo

    $ echo $foo

    bar

    ```


    (note the difference).


    We distinguish environment variables from shell variables. Shell variables are
    only visible in the shell in which they have been defined. On the other hand,
    environment variables are passed to the child process when an external command
    is started and can be used there. (The child process does not have to be a shell;
    every Linux process has environment variables). All the environment variables
    of a shell are also shell variables but not vice versa.


    Using the export command, you can declare an existing shell variable an environment
    variable:


    ```

    $ foo=bar            foo is now a shell variable

    $ export foo         foo is now an environment variable

    ```


    Or you define a new variable as a shell and environment variable at the same time:'
