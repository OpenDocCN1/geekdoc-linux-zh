    Note that as an administrator you should not really be editing `/etc/passwd` by
    hand. There is a number of programs that will help you create and maintain user
    accounts.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_175_0.png)


    In principle it is also possible to store the user database elsewhere than in
    `/etc/passwd`. On systems with very many users (thousands), storing user data
    in a relational database is preferable, while in heterogeneous networks a shared
    multi-platform user database, e. g., based on an LDAP directory, might recommend
    itself. The details of this, however, are beyond the scope of this course.


    # 13.2.2 The `/etc/shadow` File


    For security, nearly all current Linux distributions store encrypted user passwords
    in the `/etc/shadow` file ("shadow passwords"). This file is unreadable for normal
    users; only `root` may write to it, while members of the `shadow` group may read
    it in addition to `root`. If you try to display the file as a normal user an error
    occurs.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_175_1.png)


    Use of `/etc/shadow` is not mandatory but highly recommended. However there may
    be system configurations where the additional security afforded by shadow passwords
    is nullified, for example if NIS is used to export user data to other hosts (especially
    in heterogeneous Unix environments).


    Again, this file contains one line for each user, with the following format:


    ```

    <user name>::<password>::<change>::<min>::<max>::

    <j::warn>::<grace>::<lock>::<reserved>

    ```


    For example:


    ```

    root:GaY2L19jxHj5:10816:0:10000:::

    daemon:0*:8902:0:10000:::

