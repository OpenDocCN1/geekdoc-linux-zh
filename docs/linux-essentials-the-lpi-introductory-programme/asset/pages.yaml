    +   2.1 [2] Search the Internet for the notorious discussion between Andrew S.
    Tanenbaum and Linus Torvalds, in which Tanenbaum says he would have failed Linus
    for producing something like Linux. What do you think?

    +   2.2 [1] What is the version number of the oldest set of Linux kernel sources
    that you can locate?


    # 2.2 Free Or Open Source?


    # 2.2.1 Copyright And “Free Software”


    During the Middle Ages, duplication of books and other writings was an expensive
    matter. One needed to find somebody who was able to write and had the required
    time on their hands — which made larger projects like the copying of bibles the
    domain of monasteries (the monks there did know how to write and had loads of
    time available). The invention of the movable-type printing press in the 16th
    century created a previously-unknown problem: Suddenly copying'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'became considerably simpler and cheaper (at least as long as one had a printing
    press to hand), and industrious publishers used this to copy everything they considered
    worth selling. Authors had nearly no rights at the time; they could be glad if
    publishers paid them anything at all for printing their works. Widespread reprinting
    also caused the original printers of a work to feel cheated when others took over
    their publications without compensation. This led many of them to ask the government
    for special privileges in order to obtain the exclusive right to publish certain
    works. Government didn’t object to this, since the rulers tried to keep some control
    on what was being printed within their spheres of authority. With time, these
    “privileges” together with other developments like the (laudable) idea to bestow
    on authors the right for remuneration, mutated into the modern concept of “copyright”
    (or, more generally, “author’s rights”).


    Copyright essentially means that the creator of a work, i.e., the author of a
    book, painter of a picture, ..., has the right of determining what happens to
    the work. As the author, they can bestow on (or, in practice, sell for money)
    to a publisher the right to print a book and put it into circulation; the publisher
    gets to earn money while the author does not have to bother with printing, publicity,
    shipment, etc., which serves both sides.


    In addition to these “copyrights” there are also “moral rights” like the right
    to be identified as the creator of a work. It is often impossible to give these
    moral rights away.


    During the 20th century (roughly), the concepts of copyright were put on an internationally
    accepted basis and extended to other types of work such as sound recordings and
    motion pictures.


    The advent of computers and the Internet towards the end of the 20th century gravely
    changed the situation once more: While the purpose of copyright used to be to
    protect publishers from other publishers (private people were seldom in a position
    to duplicate books, records, or films on a commercially relevant scale), suddenly
    everybody who owned a computer was able to duplicate digital content (like software
    or books, music or movies in digital form) as often as desired and without loss
    of quality—a disaster for publishers, music, film or software companies, since
    their existing business models, which were based on the sale of physical artefacts
    such as books or CDs, were endangered. Since then the “content industry” has been
    lobbying for tougher copyright laws and higher penalties for “pirate copiers”,
    as well as trying to hold copyright infringers liable for their infringements
    (with varying success).


    The current term is “intellectual property”, which includes not just copyrights,
    but also trademarks and patents. Patents are supposed to compensate the inventors
    of technical processes for documenting and publishing their inventions by giving
    them a time-limited exclusive right to exploit these inventions (e.g., by allowing
    others to make use of them for money). Trademarks ensure that nobody gets to exploit,
    without permission, the popularity of a brand by selling their own products under
    that name. For example, a trademark on “Coca-Cola” ensures that nobody who is
    able to concoct a brownish sugar brew gets to sell this as “Coca-Cola”. The three
    types of “intellectual property” are related but distinct—patents are about ideas,
    copyright is about the concrete expression of ideas in the shape of actual works,
    and trademarks are about stopping sleazy business practices.


    You obtain copyright for a work automatically by producing the work—at least if
    the work exhibits a certain minimal creativity. Patents must be registered with
    the patent office and be examined for novelty. Trademarks can also be registered
    or else obtained by using a mark for a certain time in commerce and becoming identified
    with it by the public as the provider of a product or service.


    Computer software (which can be thought of as a type of written work, and which
    incorporates possibly considerable creativity) is protected by copyright.'
