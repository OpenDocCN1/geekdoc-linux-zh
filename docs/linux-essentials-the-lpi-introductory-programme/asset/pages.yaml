    # ## Summary


    +   - Computers are devices that process data according to an automatically executed,
    changeable program allowing conditional execution and loops.

    +   - The most important components of a PC include the processor, RAM, graphics
    card, motherboard, hard disks et cetera.

    +   - The software on a computer can be divided into firmware, the operating system,
    and user-level programs.

    +   - The most popular PC operating system is Microsoft’s Windows. Apple computers
    use a different operating system called OS X.

    +   - Linux is an alternative operating system for PCs (and many other types of
    computer) which is not developed by a single company, but by a large number of
    volunteers.

    +   - Linux distributions extend the Linux operating system kernel with applications
    and documentation to result in a system that is actually usable.'
