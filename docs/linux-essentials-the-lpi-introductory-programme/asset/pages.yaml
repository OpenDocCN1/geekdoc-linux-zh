  md: '“Inode” is short for “indirection node”. Inodes store all the information that
    the system has about a file, except for the name. There is exactly one inode per
    file.


    If you change the content of one of the files, the other’s content changes as
    well, since in fact there is only one file (with the unique inode number 876543).
    We only gave that file another name.


    Directories are simply tables mapping file names to inode numbers. Obvi-ously
    there can be several entries in a table that contain different names but the same
    inode number. A directory entry with a name and inode number is called a “link”.


    You should realise that, for a file with two links, it is quite impossible to
    find out which name is “the original”, i. e., the first parameter within the ln
    command. From the system’s point of view both names are completely equivalent
    and indis-tinguishable.


    > Incidentally, links to directories are not allowed on Linux. The only excep-tions
    are "." and "..", which the system maintains for each directory. Since directories
    are also files and have their own inode numbers, you can keep track of how the
    file system fits together internally. (See also Exercise 6.19)


    Deleting one of the two files decrements the number of names for file no. 876543
    (the reference counter is adjusted accordingly). Not until the reference counter
    reaches the value of 0 will the file’s content actually be removed.


    ```

    $ rm list2

    $ ls -li

    876543 -rw-r--r-- 1 joe users 2500 Oct 4 11:11 list2

    ```


    Since inode numbers are only unique within the same physical file system (disk
    partition, USB key, ...), such links are only possible within the same file system
    where the file resides.


    The explanation about deleting a file’s content was not exactly correct: If the
    last file name is removed, a file can no longer be opened, but if a process is
    still using the file it can go on to do so until it explicitly closes the file
    or ter-minates. In Unix software this is a common idiom for handling temporary
    files that are supposed to disappear when the program exits: You create them for
    reading and writing and “delete” them immediately afterwards without closing them
    within your program. You can then write data to the file and later jump back to
    the beginning to reread them.


    You can invoke ln not just with two file name arguments but also with one or with
    many. In the first case, a link with the same name as the original will be created
    in the current directory (which should really be different from the one where
    the file is located); in the second case all named files will be “linked” under
    their original names into the directory given as the last argument (think mv).


    This is not all, however: There are two different kinds of links in Linux systems.
    The type explained above is the default case for the ln command and is called
    a “hard link”. It always uses a file’s inode number for identification. In addition,
    there are symbolic links (also called “soft links” in contrast to “hard links”).
    Sym-bolic links are really files containing the name of the link’s “target file”,
    together with a flag signifying that the file is a symbolic link and that accesses
    should be redirected to the target file. Unlike with hard links, the target file
    does not “know” about the symbolic link. Creating or deleting a symbolic link
    does not impact the'
