    > If you must know exactly: The clear-text password is used as the key (k) to
    crypt a constant string (typically a sequence of zero bytes). A DES key is 56
    bits, which just happens to be 8 characters of 7 bits each (as the leftmost bit
    in each character is ignored). This process is repeated for a total of 25 rounds,
    with the previous round''s output serving as the new input. Strictly speaking
    the encryption scheme used isn''t quite DES but changed in a few places, to make
    it less feasibly to construct a special password-cracking computer from commercially
