  md: 'the disk drive manufacturer only uses (quite correctly) “gigabytes”, i. e.,
    billions of bytes, while your computer probably (if inaccurately) calculates the
    free space in units of “gigabytes” or $2^{30}$ bytes.


    **Optical drives** Besides hard drives, PCs usually support optical drives that
    can read, and often also write, media such as CD-ROMs, DVDs or Blu-ray disks.
    (Mobile devices sometimes have no room physically for an optical drive, which
    does not mean such drives can’t be connected externally.) Optical media—the name
    derives from the fact that the information on there is accessed by means of a
    laser—are mostly used for the distribution of software and “content” (music or
    films), and their importance is waning as more and more companies rely on the
    Internet as a distribution medium.


    In former times one also considered optical media for backup copies, but today
    this is no longer realistic—a CD-ROM can hold up to approximately $900\ \text{MiB}$
    of data and a DVD up to $9\ \text{GB}$ or so, thus for a full backup of a $1\
    \text{TiB}$ hard disk you would require $1000$ CD-size or $100$ DVD-size media,
    and constantly swapping them in and out would also be a hassle. (Even Blu-ray
    discs can only fit $50\ \text{GB}$ or so, and drives that can *write* to Blu-ray
    discs are still fairly expensive.)


    **Display** You can still see it in old movies: the green sheen of the computer
    screen. In reality, green displays have all but disappeared, colour is in fashion,
    and new displays are no longer massive hulks like the CRTs (cathode-ray tubes)
    we used to have, but are slim, elegant monitors based on liquid crystals (LCD,
    “liquid-crystal display”). LCDs don’t confine themselves to the advantage of taking
    up less space on a desk, but also neither flicker nor bother the user with possibly
    harmful radiation—a win-win situation. There are a few disadvantages such as colour
    changes when you look at the screen at a too-acute angle, and cheaper devices
    may deliver a blotchy picture because the backlight is not uniform.


    With CRTs one used to take care to not let them stand around unused showing the
    same picture for long periods of time, because the picture could “burn in” and
    appear as a permanent blurry backdrop. Accordingly one used a “screen saver”,
    which after a certain amount of idle time would replace the content of the screen
    by a more or less cute animation to avoid burn-in (the classic was an aquarium
    with fish and other aquatic fauna). LCDs no longer suffer from the burn-in problem,
    but screen savers are still sticking around for decorative value.


    LCDs are available in all sizes from “smartphone” to wall-size large screens;
    their most important property is “resolution, which for PC displays usually ranges
    between $1366 \times 768$ (horizontally $\times$ vertically) and $1920 \times
    1080$ “pixels”. (Lower and higher resolutions are possible, but do not necessarily
    make economic or visual sense.) Many computers support more than one screen in
    order to enlarge the working space.


    Also usual today is an aspect ratio of $16:9$, which corresponds to high-definition
    television—actually a silly development, since most computers aren’t even used
    for watching television, and a taller but narrower display (such as the formerly-common
    $4:3$ format) is better suited most of the more frequently-used applications like
    word processing or spreadsheet calculations.


    **Other peripherals** Of course you can connect many more devices to a computer
    besides the ones we mentioned: printers, scanners, cameras, television receivers,
    modems, robotic arms, small missile launchers to annoy your gregarious neighbours,
    and so on. The list is virtually endless, and we cannot discuss every class of
    device separately here. But we can still make a few observations:'
