    # 1.1 Linux Evolution and Popular Operating Systems


    **Weight** 2

    **Description** Knowledge of Linux development and major distributions.


    +   **Key Knowledge Areas**

    +   * Open Source Philosophy

    +   * Distributions

    +   * Embedded Systems


