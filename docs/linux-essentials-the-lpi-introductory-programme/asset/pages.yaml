    +   1.  **6.1** [2] In the shell, is `cd` an internal or an external command?
    Why?


    +   2.  **6.2** [3] Read about the `pushd`, `popd`, and `dirs` commands in the
    `bash` man page. Convince yourself that these commands work as described there.'
