    # # C


    # ## Linux Essentials Certification


    The *Linux Professional Institute* (LPI) is a vendor-independent non-profit organization
    dedicated to furthering the professional use of Linux. One aspect of the LPI’s
    work concerns the creation and delivery of distribution-independent certification
    exams, for example for Linux professionals. These exams are available world-wide
    and enjoy considerable respect among Linux professionals and employers.


    This training manual serves as an aid in preparing for the *Linux Essentials*
    exam. On its web site, the LPI explains:


    > > The purpose of the Linux Essentials Certificate is to define the basic knowledge
    required to competently use a desktop or mobile device using a Linux Operating
    System. The associated Linux Essentials Program will guide and encourage youth
    (and those new to Linux and Open Source) to understand the place of Linux and
    Open Source in the context of the broader IT industry.


    The LPI has compiled the knowledge necessary to pass the exam in the form of a
    list of **exam objectives** which are published on its web site at `http://www.lpi.org/`.


    The following table shows which chapters in the manual cover the content of which
    exam objectives. The exam objectives themselves are listed later in this appendix.
    Do note that the *Linux Essentials* objectives are not suitable or intended as
    a guideline for the didactic delivery of an introductory class to Linux. For this
    reason, this manual does not follow the order of objectives in the LPI list, but
    deviates from them in the interest of a logical sequence of topics aimed at making
    the material more understandable.


    ⚠️ Be aware that the exam objectives on the LPI web site may be modified occasionally,
    and that, e.g., supplementary information may appear there that has not yet been
    incorporated into this training manual. For safety, refer to the LPI’s version
    of the exam objectives.


    # ### C.1 Exam Objective Overview


    The following table shows the objectives for the *Linux Essentials* exam and the
    chapters covering these objectives. The numbers in the right-hand column refer
    to the chapters containing the material in question.'
