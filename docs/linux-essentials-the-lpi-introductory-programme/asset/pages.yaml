    Join files serially With -s ("serial"), the given files are processed in sequence.
    First, all the lines of the first file are joined into one single line (using
    the separator character), then all lines from the second file make up the second
    line of the output etc.


    ```

    $ cat list1

    Wood

    Bell

    Potter

    $ cat list2

    Keeper

    Chaser

    Seeker

    $ paste -s list*

    Wood Bell Potter

    Keeper Chaser Seeker

    ```


    All files matching the list* wildcard pattern—in this case, list1 and list2—are
    joined using paste. The -s option causes every line of these files to make up
    one column of the output.


