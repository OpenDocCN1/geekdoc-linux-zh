    # ## 6.3 File Search Patterns


    # ### 6.3.1 Simple Search Patterns


    You will often want to apply a command to several files at the same time. For
    example, if you want to copy all files whose names start with “p” and end with
    “.c” from the `prog1` directory to the `prog2` directory, it would be quite tedious
    to have to name every single file explicitly—at least if you need to deal with
    more than a couple of files! It is much more convenient to use the shell’s search
    patterns.

