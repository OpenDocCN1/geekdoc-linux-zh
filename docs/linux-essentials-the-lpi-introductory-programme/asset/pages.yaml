    If all .tex files are to be compressed in a file `tex-all.tar.gz`, the command
    is


    ```

    $ tar -cvzf tex-all.tar.gz *.tex

    ```


    Remember that `tar` does not delete the original files! This can be unpacked using


    ```

    $ tar -xvzf tex-all.tar.gz

    ```


    # Exercises


    +   * 11.7 [2] Compress the `tar` archive from Exercise 11.3 using maximum compression.


    +   * 11.8 [3] Inspect the content of the compressed archive. Restore the original
    `tar` archive.


    +   * 11.9 [2] How would you go about packing all of the contents of your home
    directory into a `gzip`-compressed file?


    # 11.4 Compressing Files with `bzip2`


    `bzip2` by Julian Seward is a compression program which is largely compatible
    to `gzip`. However, it uses a different method which leads to higher compression
    ratios but requires more time and memory to compress (to decompress, the difference
    is not as significant).


    > If you are desperate to know: `bzip2` uses a "Burrows-Wheeler transformation"
    to encode frequently-occurring substrings in the input to sequences of single
    characters. This intermediate result is sorted according to the "local frequency"
    of individual characters and the sorted result, after being run-length encoded,
    is encoded using the Huffman scheme. The Huffman code is then written to a file
    in a very compact manner.


    > What about `bzip2`? `bzip` was a predecessor of `bzip2` which used arithmetic
    encoding rather than Huffman encoding after the block transformation. However,
    the author decided to give arithmetic coding a wide berth due to the various software
    patent issues that surround it.


    Like `gzip`, `bzip2` accepts one or more file names as parameters for compression.
    The files are replaced by compressed versions, whose names end in `.b22`.


    The -c and -d options correspond to the eponymous options to `gzip`. However,
    the "quality options" -1 to -9 work differently: They determine the block size
    used during compression. The default value is -9, while -1 does not offer a significant
    speed gain.'
