- pgno: 181
  md: '# **13.3.2   The passwd Command**


    The *passwd* command is used to set up passwords for users. If you are logged
    in as root, then


    ```

    ```

    # passwd joe

    ```

    ```


    asks for a new password for user *joe* (You must enter it *twice* as it will not
    be echoed to the screen).


    The *passwd* command is also available to normal users, to let them change their
    own passwords (changing other users’ passwords is root’s prerogative):


    ```

    ```

    $ passwd

    Changing password for joe.

    (current) UNIX password: secret123

    Enter new UNIX password: 321terces

    Retype new UNIX password: 321terces

    passwd:  password  updated  successfully

    ```

    ```


    Normal users must enter their own password correctly once before being allowed
    to set a new one. This is supposed to make life difficult for practical jokers
    that play around on your computer if you had to step out very urgently and didn’t
    have time to engage the screen lock.


    On the side, *passwd* serves to manage various settings in */etc/shadow*. For
    example, you can look at a user’s “password state” by calling the *passwd* command
    with the *-S* option:


    ```

    ```

    # passwd -S bob

    bob LK 10/15/99 0 99999 7 0

    ```

    ```


    The first field in the output is (once more) the user name, followed by the password
    state: “*PS*” or “*P*” if a password is set, “*LK*” or “*L*” for a locked account,
    and “*NP*” for an account with no password at all. The other fields are, respectively,
    the date of the last password change, the minimum and maximum interval for changing
    the password, the expiry warning interval and the “grace period” before the account
    is locked completely after the password has expired. (See also Section 13.2.2.)


    You can change some of these settings by means of *passwd* options. Here are a
    few examples:


    ```

    ```

    # passwd -l joe    Lock the account

    # passwd -u joe    Unlock the account

    # passwd -m 7 joe  Password change at most every 7 days

    # passwd -x 30 joe Password change at least every 30 days

    # passwd -w 3 joe  3 days grace period before password expires

    ```

    ```


    ![](img/44bdd771e9c9b1353d2401c2892b2459_181_0.png)


    Locking and unlocking accounts by means of *-l* and *-u* works by putting a “*!*”
    in front of the encrypted password in */etc/shadow*. Since “*!*” cannot result
    from password encryption, it is impossible to enter something upon login that
    matches the “encrypted password” in the user database—hence access via the usual
    login procedure is prevented. Once the “*!*” is removed, the original password
    is back in force. (Astute, innit?) However, you should keep in mind that users
    may be able to gain access to the system by other means that do not refer to the
    encrypted password in the user database, such as the secure shell with *public-key*
    authentication.


    Changing the remaining settings in */etc/shadow* requires the *chage* command:


    ```

    ```

    # chage -E 2009-12-01 joe    Lock account from 1 Dec 2009

    # chage -E -1  joe    Cancel expiry date

    ```

    ```'
