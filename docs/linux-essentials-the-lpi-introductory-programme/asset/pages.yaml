    # 2.4.4 Debian


    Unlike the two big Linux distribution companies Red Hat and Novell/SUSE, the Debian
    project (http://www.debian.org/) is a collaboration of volunteers whose goal is
    to make available a high-quality Linux distribution called “Debian GNU/Linux”.
    The Debian project was announced on 16 August 1993 by Ian Murdock; the name is
    a contraction of his first name with that of his then-girlfriend (now ex-wife)
    Debra (and is hence pronounced “debb-ian”). By now the project includes more than
    1000 volunteers.


    +   - The Debian Free Software Guidelines (DFSG) define which software the project
    considers “free”. This is important, since only DFSG-free software can be part
    of the Debian GNU/Linux distribution proper. The project also distributes non-free
    software, which is strictly separated from the DFSG-free'
