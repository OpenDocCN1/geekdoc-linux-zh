- pgno: 63
  md: "# ## 5.1 Self-Help\n\nLinux is a powerful and intricate system, and powerful\
    \ and intricate systems are, as a rule, complex. Documentation is an important\
    \ tool to manage this complexity, and many (unfortunately not all) aspects of\
    \ Linux are documented very extensively. This chapter describes some methods to\
    \ access this documentation.\n\n“Help” on Linux in many cases means “self-help”.\
    \ The culture of free software implies not unnecessarily imposing on the time\
    \ and goodwill of other people who are spending their free time in the community\
    \ by asking things that are obviously explained in the first few paragraphs of\
    \ the manual. As a Linux user, you do well to have at least an overview of the\
    \ available documentation and the ways of obtaining help in cases of emergency.\
    \ If you do your homework, you will usually experience that people will help you\
    \ out of your predicament, but any tolerance towards lazy individuals who expect\
    \ others to tie themselves in knots on their behalf, on their own time, is not\
    \ necessarily very pronounced.\n\nIf you would like to have somebody listen around\
    \ the clock, seven days a week, to your not-so-well-researched questions and problems,\
    \ you will have to take advantage of one of the numerous “commercial” support\
    \ offerings. These are available for all common distributions and are offered\
    \ either by the distribution vendor themselves or else by third parties. Compare\
    \ the different service vendors and pick one whose service level agreements and\
    \ pricing suit you.\n\n# ## 5.2 The help Command and the --help Option\n\nIn bash,\
    \ internal commands are described in more detail by the help command, giving the\
    \ command name in question as an argument:\n\n```\n```\n$ help exit\n\nexit: exit\
    \ [n]\n    Exit the shell with a status of N.\n    If N is omitted, the exit status\n\
    \    is that of the last command executed.\n$ _\n```\n```\n\nMore detailed explanations\
    \ are available from the shell’s manual page and info documentation. These information\
    \ sources will be covered later in this chapter.\n\nMany external commands (programs)\
    \ support a --help option instead. Most commands display a brief listing of their\
    \ parameters and syntax.\n\nNot every command reacts to --help; frequently the\
    \ option is called -h or -?, or help will be output if you specify any invalid\
    \ option or otherwise illegal command line. Unfortunately there is no universal\
    \ convention.\n\n# ## 5.3 The On-Line Manual\n\n# ### 5.3.1 Overview\n\nNearly\
    \ every command-line program comes with a “manual page” (or “man page”), as do\
    \ many configuration files, system calls etc. These texts are generally installed\
    \ with the software, and can be perused with the “man (name)” command."
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Table 5.1: Manual page sections


    | Section | Content |

    |:---|:---|

    | NAME | Command name and brief description |

    | SYNOPSIS | Description of the command syntax |

    | DESCRIPTION | Verbose description of the command’s effects |

    | OPTIONS | Available options |

    | ARGUMENTS | Available Arguments |

    | FILES | Auxiliary files |

    | EXAMPLES | Sample command lines |

    | SEE ALSO | Cross-references to related topics |

    | DIAGNOSTICS | Error and warning messages |

    | COPYRIGHT | Authors of the command |

    | BUGS | Known limitations of the command |


    Here, (*name*) is the command or file name that you would like explained. “*man
    bash*”, for *example*, produces a list of the abovementioned internal shell commands.


    However, the manual pages have some disadvantages: Many of them are only available
    in English; there are sets of translations for different languages which are often
    incomplete. Besides, the explanations are frequently very complex. Every single
    word can be important, which does not make the documentation accessible to beginners.
    In addition, especially with longer documents the structure can be obscure. Even
    so, the value of this documentation cannot be underestimated. Instead of deluging
    the user with a large amount of paper, the on-line manual is always available
    with the system.


    > Many Linux distributions pursue the philosophy that there should be a manual
    page for every command that can be invoked on the command line. This does not
    apply to the same extent to programs belonging to the graphical desktop environments
    KDE and GNOME, many of which not only do not come with a manual page at all, but
    which are also very badly documented even inside the graphical environment itself.
    The fact that many of these programs have been contributed by volunteers is only
    a weak excuse.


    # ### 5.3.2 Structure


    The structure of the man pages loosely follows the outline given in Table 5.1,
    even though not every manual page contains every section mentioned there. In particular,
    the EXAMPLES are frequently given short shrift.


    > The BUGS heading is often misunderstood: Read bugs within the implementation
    get fixed, of course; what is documented here are usually restrictions which follow
    from the *approach* the command takes, which are not able to be lifted with reasonable
    effort, and which you as a user ought to know about. For example, the documentation
    for the *grep* command points out that various constructs in the regular expression
    to be located may lead to the *grep* process using very much memory. This is a
    consequence of the way *grep* implements searching and not a trivial, easily fixed
    error.


    Man pages are written in a special input format which can be processed for text
    display or printing by a program called *groff*. Source code for the manual pages
    is stored in the */usr/share/man* directory in subdirectories called *man$n*,
    where *n* is one of the chapter numbers from Table 5.2.


    > You can integrate man pages from additional directories by setting the *MANPATH*
    environment variable, which contains the directories which will be searched by
    *man*, in order. The *manpath* command gives hints for setting up *MANPATH*.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '**Table 5.2: Manual Page Topics**

    | No. | Topic |

    | :-- | :-- |

    | 1 | User commands |

    | 2 | System calls |

    | 3 | C language library functions |

    | 4 | Device files and drivers |

    | 5 | Configuration files and file formats |

    | 6 | Games |

    | 7 | Miscellaneous (e.g. groff macros, ASCII tables, ...) |

    | 8 | Administrator commands |

    | 9 | Kernel functions |

    | n | "New" commands |


    # 5.3.3   Chapters


    Every manual page belongs to a "chapter" of the conceptual "manual" (Table 5.2).
    Chapters 1, 5 and 8 are most important. You can give a chapter number on the man
    command line to narrow the search. For example, "man 1 crontab" displays the man
    page for the crontab command, while "man 5 crontab" explains the format of crontab
    files. When referring to man pages, it is customary to append the chapter number
    in parentheses; we differentiate accordingly between crontab(1), the crontab command
    manual, and crontab(5), the description of the file format.


    With the -a option, man displays all man pages matching the given name; without
    this option, only the first page found (generally from chapter 1) will be displayed.


    # 5.3.4   Displaying Manual Pages


    The program actually used to display man pages on a text terminal is usually less,
    which will be discussed in more detail later on. At this stage it is important
    to know that you can use the cursor keys ← and ↑ to navigate within a man page.
    You can search for keywords inside the text by pressing /—after entering the word
    and pressing the return key, the cursor jumps to the next occurrence of the word
    (if it does occur at all). Once you are happy, you can quit the display using
    q to return to the shell.


    Using the KDE web browser, Konqueror, it is convenient to obtain nicely formatted
    man pages. Simply enter the URL "man:⟨name⟩" (or even "#⟨name⟩")


    ![](img/44bdd771e9c9b1353d2401c2892b2459_65_0.png)


    ![](img/44bdd771e9c9b1353d2401c2892b2459_65_1.png)


    **Figure 5.1:** A manual page in a text terminal (left) and in Konqueror (right)'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'in the browser’s address line. This also works on the KDE command line


    Before rummaging aimlessly through innumerable man pages, it is often sen-Keyword
    search sible to try to access general information about a topic via *apropos*.
    This command works just like “man -k”, both search the “NAME” sections of all
    man pages for a keyword given on the command line. The output is a list of all
    manual pages containing the keyword in their name or description.


    A related command is *whatis*. This also searches all manual pages, but for a
    whatis command (*file*, ...,) *name* rather than a keyword—in other words, the
    part of the “NAME” section to the left of the dash. This displays a brief description
    of the desired command, system call, etc.; in particular the second part of the
    “NAME” section of the manual page(s) in question. *whatis* is equivalent to “man
    -t”.


    # Exercises


    +   5.1 [!1] View the manual page for the `ls` command. Use the text-based `man`
    command and—if available—the Konqueror browser.


    +   5.2 [2] Which manual pages on your system deal (at least according to their
    “NAME” sections) with processes?


    +   5.3 [5] (Advanced.) Use a text editor to write a manual page for a hypothetical
    `man(?)` man page beforehand. Check the appearance of the man page on the screen
    (using “`groff -tasciI -man <file> | less`”) and as printed output (using something
    like “`groff -tfs -man <file> | gv -`”).


    # 5.4 Info Pages


    For some commands—often more complicated ones—there are so-called “info Hypertext
    pages” instead of (or in addition to) the more usual man pages. These are usually
    more extensive and based on the principles of hypertext, similar to the World
    Wide Web.


    The idea of info pages originated with the GNU project; they are therefore most
    frequently found with software published by the FSF or otherwise belonging to
    the GNU project. Originally there was supposed to be *only* info documentation
    for the “GNU system”; however, since GNU also takes on board lots of software
    not created under the auspices of the FSF, and GNU tools are being used on systems
    pursuing a more conservative approach, the FSF has relented in many cases.


    Analogously to man pages, info pages are displayed using the “`info <command>`”
    command (the package containing the *info* program may have to be installed explicitly).
    Furthermore, info pages can be viewed using the *emacs* editor or displayed in
    the KDE web browser, Konqueror, via URLs like “`info:/<command>`”.


    One advantage of info pages is that, like man pages, they are written in a source
    format which can conveniently be processed either for on-screen display or for
    printing manuals using PostScript or PDF. Instead of `groff`, the `tex` typesetting
    program is used to prepare output for printing.


    # Exercises


    +   5.4 [!1] Look at the *info* page for the `ls` program. Try the text-based
    *info* browser and, if available, the Konqueror browser.


    +   5.5 [2] Info files use a crude (?) form of hypertext, similar to HTML files
    on the World Wide Web. Why aren’t info files written in HTML to begin with?'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# 5.5 HOWTOs


    Both manual and info pages share the problem that the user must basically know
    the name of the program to use. Even searching with apropos is frequently nothing
    but a game of chance. Besides, not every problem can be solved using one single
    command. Accordingly, there is “problem-oriented” rather than “command-oriented”
    documentation is often called for. The HOWTOs are designed to help with this.


    HOWTOs are more extensive documents that do not restrict themselves to single
    commands in isolation, but try to explain complete approaches to solving problems.
    For example, there is a “DSL HOWTO” detailing ways to connect a Linux system to
    the Internet via DSL, or an “Astronomy HOWTO” discussing astronomy software for
    Linux. Many HOWTOs are available in languages other than English, even though
    the translations often lag behind the English-language originals.


    Most Linux distributions furnish the HOWTOs (or significant subsets) as packages
    to be installed locally. They end up in a distribution-specific directory—`/usr/share/doc/howto`
    for SUSE distributions, `/usr/share/doc/HOWTO` for Debian GNU/Linux, typically
    either as plain text or else HTML files. Current versions of all HOWTOs and other
    formats such as PostScript or PDF can be found on the Web on the site of the “Linux
    Documentation Project” (`http://www.tldp.org`) which also offers other Linux documentation.


    # 5.6 Further Information Sources


    You will find additional documentation and example files for (nearly) every installed
    software package under `/usr/share/doc` or `/usr/share/doc/packages` (depending
    on your distribution). Many GUI applications (such as those from the KDE or GNOME
    packages) offer “help” menus. Besides, many distributions offer specialized “help
    centers” that make it convenient to access much of the documentation on the system.


    Independently of the local system, there is a lot of documentation available on
    the Internet, among other places on the WWW and in USENET archives.


    Some of the more interesting web sites for Linux include:


    +   *   `http://www.tldp.org/` The “Linux Documentation Project”, which is in
    charge of man pages and HOWTOs (among other things).

    +   *   `http://www.linux.org/` A general “portal” for Linux enthusiasts.

    +   *   `http://www.linuxwiki.de/` A free-form text information database for everything
    pertaining to Linux” (in German).

    +   *   `http://lwn.net/` *Linux Weekly News*—probably the best web site for Linux
    news of all sorts. Besides a daily overview of the newest developments, products,
    security holes, Linux advocacy in the press, etc., on Thursdays there is an extensive
    on-line magazine with well-researched background reports about the preceding week’s
    events. The daily news are freely available, while the weekly issues must be paid
    for (various pricing levels starting at US-$5 per month). One week after their
    first appearance, the weekly issues are made available for free as well.

    +   *   `http://freesco.com/` This site publishes announcements of new (predominantly
    free) software packages, which are often available for Linux. In addition to this
    there is a database allowing queries for interesting projects or software packages.

    +   *   `http://www.linux-knowledge-portal.de/` A site collecting “headlines”
    from other interesting Linux sites, including LWN and Freshmeat.'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'If there is nothing to be found on the Web or in Usenet archives, it is possible
    to ask questions in mailing lists or Usenet groups. In this case you should note
    that many users of these forums consider it very bad form to ask questions answered
    already in the documentation or in a “FAQ” (frequently answered questions) resource.
    Try to prepare a detailed description of your problem, giving relevant excerpts
    of log files, since a complex problem like yours is difficult to diagnose at a
    distance (and you will surely be able to solve non-complex problems by yourself).


    A news archive is accessible on http://groups.google.com/ (formerly DejaNews).


    Interesting news groups for Linux can be found in the English-language comp.os.linux.*
    or the German-language de.comp.os.unix.linux.* hierarchies. Many Unix groups are
    appropriate for Linux topics; a question about the shell should be asked in a
    group dedicated to shell programming rather than a Linux group, since shells are
    usually not specific to Linux.


    Linux-orientedd mailing lists can be found, for example, at major-domo@vger.kernel.org.
    You should send an e-mail message including "subscribe LIST" to this address in
    order to subscribe to a list called LIST. A commented list of all available mailing
    lists on the system may be found at http://vger.kernel.org/vger-lists.html.


    An established strategy for dealing with seemingly inexplicable problems is to
    search for the error message in question using Google (or another search engine
    you trust). If you do not obtain a helpful result outright, leave out those parts
    of your query that depend on your specific situation (such as domain names that
    only exist on your system). The advantage that Google indexes not just the common
    web pages, but also many mailing list archives, and chances are that you will
    encounter a dialogue where somebody else had a problem very like yours.


    Incidentally, the great advantage of open-source software is not only the large
    amount of documentation, but also the fact that most documentation is restricted
    as little as the software itself. This facilitates collaboration between software
    developers and documentation authors, and the translation of documentation into
    different languages is easier. In fact, there is ample opportunity for non-programmers
    to help with free software projects, e.g., by writing good documentation. The
    free-software scene should try to give the same respect to documentation authors
    that it does to programmers—a paradigm shift that has begun but is by no means
    finished yet.


    # Commands in this Chapter


    +   - **apropos**: Shows all manual pages whose NAME sections contain a given
    keyword

    +   - **groff**: Sophisticated typesetting program

    +   - **help**: Displays on-line help for bash commands

    +   - **info**: Displays GNU Info pages on a character-based terminal

    +   - **less**: Displays texts (such as manual pages) by page

    +   - **man**: Displays system manual pages

    +   - **manpath**: Determines the search path for system manual pages

    +   - **whatis**: Locates manual pages with a given keyword in its description


    +   apropos(1) 67

    +   groff(1) 65, 67

    +   bash(1) 64

    +   info(1) 67

    +   less(1) 66

    +   man(1) 64

    +   manpath(1) 65

    +   whatis(1) 67'
