  md: "(`$$` denotes the `current process`, the shell).\n\nUID is the numerical ID\
    \ of the owner of the process (see Chapter 13), PPID the process ID of the process’s\
    \ “parent”. PRI is its priority—the higher the number, the lower the priority\
    \ ()—, VSZ its size in working memory (in KiB), and RSS its current size in RAM\
    \ (also in KiB).\n\nVSZ and RSS are not identical, since part of the process may\
    \ have been moved to disk. After all, you can enlarge the available working memory\
    \ on a Linux computer by adding swap space on a disk partition or file.\n\nThe\
    \ ps command supports a multitude of options controlling the selection of processes\
    \ considered and the type and volume of information output for each process. Read\
    \ `ps(1)`.\n\nps and similar programs obtain their information from the proc file\
    \ system, which is usually mounted on /proc and is made available by the operating\
    \ system kernel. The “files” within this directory contain up-to-date information\
    \ about processes and other properties of the system. (See also Section 10.3.)\n\
    \nfree The free command provides information about system memory:\n\n```\n$ free\n\
    Mem:      total    used    free    shared    buffers    cached\n            3921956\
    \   1932696   1989260      0        84964    694640\n-/+ buffers/cache:   1153092\
    \   2768864\nSwap:       8388604       0   8388604\n```\n\nThe “Mem:” line tells\
    \ you that this computer has about 4 GiB of RAM (under “total”; the operating\
    \ system kernel takes up some memory that does not appear here) which is about\
    \ half full (see “used” and “free”). The operating system uses about 700 MiB to\
    \ store disk data (the “buffers” and “cached” columns), and the second line tells\
