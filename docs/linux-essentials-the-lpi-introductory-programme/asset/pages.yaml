    # 8.1 I/O Redirection and Command Pipelines


    # 8.1.1 Standard Channels


    Many Linux commands—like grep and friends from Chapter 7— are designed to read
    input data, manipulate it in some way, and output the result of these manipulations.
    For example, if you enter


    ```

    `$ grep xyz`

    ```


    you can type lines of text on the keyboard, and grep will only let those pass
    that contain the character sequence, “xyz”:


    ```

    ```

    $ grep xyz

    abc def

    xyz 123

    xyz 123

    aaa bbb

    YYxyzZZZ

    YYxyzZZ

    Ctrl]+d

    ```

    ```


    (The key combination at the end lets grep know that the input is at an end.)


    We say that grep reads data from “standard input”—in this case, the keyboard—and
    writes to “standard output”—in this case, the console screen or, more likely,
    a terminal program in a graphical desktop environment. The third of these “standard
    channels” is “standard error output”; while the “payload data” grep produces are
    written to standard output, standard error output takes any error messages (e.
    g., about a non-existent input file or a syntax error in the regular expression).


    In this chapter you will learn how to redirect a program’s standard output to
    a file or take a program’s standard input from a file. Even more importantly,
    you will learn how to feed one program’s output directly (without the detour via
    a file) into another program as that program’s input. This opens the door to using
    the Linux commands, which taken on their own are all fairly simple, as building
    blocks to construct very complex applications. (Think of a Lego set.)


    We will not be able to exhaust this topic in this chapter. Do look forward to
    the manual, Advanced Linux, where constructing shell scripts with the commands
    from the Unix “toolchest” plays a very important role! Here is where you learn
    the very important fundamentals of cleverly combining Linux commands even on the
    command line.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_101_1.png)'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'Table 8.1: Standard channels on Linux

    | Channel | Name | Abbreviation | Device | Use |

    |---|---|---|---|---|

    | 0 | standard input | stdin | keyboard | Input for programs |

    | 1 | standard output | stdout | screen | Output of programs |

    | 2 | standard error output | stderr | screen | Programs'' error messages |


    The **standard channels** are summarised once more in Table 8.1. In the paragraph,
    they are normally referred to using their abbreviated names—`stdin`, `stdout`
    and `stderr` for standard input, standard output, and standard error output. These
    channels are respectively assigned the numbers 0, 1, and 2, which we are going
    to use later on.


    The shell can redirect these standard channels for individual commands, without
    the programs in question noticing anything. These always use the standard channels,
    even though the output might no longer be written to the screen or terminal window
    but some arbitrary other file. That file could be a different device, like a printer—but
    it is also possible to specify a text file which will receive the output. That
    file does not even have to exist but will be created if required.


    The standard input channel can be redirected in the same way. A program no longer
    receives its input from the keyboard, but takes it from the specified file, which
    can refer to another device or a file in the proper sense.


    > The keyboard and screen of the “terminal” you are working on (no matter whether
    this is a Linux text console, a “genuine” terminal on a serial port, a terminal
    window in a graphical environment, or a network session using, say, the secure
    shell) can be accessed by means of the `/dev/tty` file—if you want to read data
    this means the keyboard, for output the screen (the other way round would be quite
    silly). The


    ```

    ```

    $ grep xyz /dev/tty

    ```


    ```


    would be equivalent to our example earlier on in this section. You can find out
    more about such “special files” from Chapter 10).


    # 8.1.2 Redirecting Standard Channels


    You can redirect the standard output channel using the shell operator “>” (the
    “greater-than” sign). In the following example, the output of `ls -laF` is redirected
    to a file called *filelist*; the screen output consists merely of


    ```

    ```

    $ ls -laF >filelist

    $ _

    ```


    ```


    If the *filelist* file does not exist it is created. Should a file by that name
    exist, however, its content will be overwritten. The shell arranges for this even
    before the program in question is invoked—the output file will thus be created
    even if the actual command invocation contained typos, or if the program did not
    indeed write any output at all (in which case the *filelist* file will remain
    empty).


    > If you want to avoid overwriting existing files using shell output redirection,
    you can give the bash command “`set -o noclobber`”. In this case, if output is
    redirected to an existing file, an error occurs.


    You can look at the *filelist* file in the usual way, e.g., using `less`:


    ```

    ```

    $ less inall

    total 7

    ```


    ```'
