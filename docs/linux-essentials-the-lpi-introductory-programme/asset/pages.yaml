  md: '```

    $ unzip -d dir test

    Archive:  test.zip

    creating: dir/ziptest/

    inflating: dir/ziptest/testfile

    inflating: dir/ziptest/file2

    inflating: dir/ziptest/file1

    ```


    If you name particular files on the command line, then only these files will be
    unpacked:


    ```

    $ rm -rf ziptest

    $ unzip test ziptest/file1

    Archive:  test.zip

    inflating: ziptest/file1

    ```


    (In this case, the ziptest directory will also be created.)


    Alternatively, you can use the -x option to selectively exclude certain files
    from being unpacked:


    ```

    $ rm -rf ziptest

    $ unzip test -x ziptest/file1

    Archive:  test.zip

    creating: ziptest/

    inflating: ziptest/testfile

    inflating: ziptest/file2

    ```


    You can also use shell search patterns to unpack certain files (or prevent them
    from being unpacked):


    ```

    $ rm -rf ziptest

    $ unzip test "ziptest/f*"

    Archive:  test.zip

    inflating: ziptest/file2

    inflating: ziptest/file1

    $ rm -rf ziptest

    $ unzip test -x "*/*"

    Archive:  test.zip

    creating: ziptest/

    inflating: ziptest/file2

    inflating: ziptest/file1

    ```


    (Note the quotes, which are used to hide the search patterns from the actual shell
    so unzip gets to see them.) Unlike in the shell, the search patterns refer to
    the *complete* file names (including any “/”).


    As is to be expected, unzip also supports various other options. Look at the program’s
    help information using “unzip -h” or “unzip -hh”, or read unzip(1).


