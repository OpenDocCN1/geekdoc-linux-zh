  md: '6.15  If you edit the file via one link, the new content should also be visible
    via the other link. However, there are “clever” editors which do not overwrite
    your file when saving, but save a new file and rename it afterwards. In this case
    you will have two different files again.


    6.16  If the target of a symbolic link does not exist (any longer), accessing
    that “dangling” link will lead to an error message.


    6.17  To itself. You can recognise the file system root directory by this.


    6.18  On this system, the /home directory is on a separate partition and has inode
    number 2 on that partition, while the / directory is inode number 2 on its own
    file system. Since inode numbers are only unique within the same physical file
    system, the same number can show up for different files in “ls -i” output; this
    is no cause for concern.


    6.19  Hard links are indistinguishable, equivalent names for the same file (or,
    hypothetically, directory). But every directory has a “link” called “..” referring
    to the directory “above”. There can be just one such link per directory, which
    does not agree with the idea of several equivalent names for that directory. Another
    argument against hard links on directories is that for every name in the file
    system tree there must be a unique path leading to the root directory (/) in a
    finite number of steps. If hard links to directories were allowed, a command sequence
    such as


    ```

    ```

    $ mkdir -p a/b

    $ cd a/b

    $ ln .. c

    ```

    ```


    could lead to a loop.


    6.20  The reference counter for the subdirectory has the value 2 (one link results
    from the name of the subdirectory in ~, one from the “..” link in the subdirectory
    itself). If there were additional subdirectories within the directory, their “..”
    links would increment the reference counter beyond its minimum value of 2.


    6.21  Hard links need hardly any space, since they are only additional directory
    entries. Symbolic links are separate files and need one inode at least (every
    file has its own inode). Also, some space is required to store the name of the
    target file. In theory, disk space is assigned to files in units of the file system’s
    block size (1 KiB or more), but there is a special exception in the ext2 and ext3
    file systems for “short” symbolic links (smaller than approximately 60 bytes),
    which can be stored within the inode itself and do not require a full data block.
    More advanced file systems such as the Reiser file system can handle short files
    of any type very efficiently, thus the space required for symbolic links ought
    to be negligible.


    6.22  One possible command could be “find / -size +1024k -print”.


    6.23  The basic approach is something like


    ```

    ```

    find . -maxdepth 1 (\{fs\) -ok rm \f \;

    ```

    ```


    (the \(fs\) should match the file as closely as possible. The “-maxdepth 1” option
    restricts the search to the current directory (no subdirectories). In the simplest
    case, use “ls -i” to determine the file’s inode number (e.g., 4711) and then use


    ```

    ```

    find . -maxdepth 1 -inum 4711 -exec rm -f \f \;

    ```

    ```


    to delete the file.'
