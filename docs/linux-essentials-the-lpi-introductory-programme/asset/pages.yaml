  md: '# **Table 10.2:** Directory division according to the FHS


    | static | dynamic |

    | :--- | :--- |

    | local | /etc, /bin, /sbin, /lib | /dev, /var/log |

    | remote | /usr, /opt | /home, /var/mail |


    **Administrator’s Home Directory**—/root The system administrator’s home directory
    is located in /root. This is a completely normal home directory similar to that
    of the other users, with the marked difference that it is not located below /home
    but immediately below the root directory (//).


    The reason for this is that /home is often located on a file system on a separate
    partition or hard disk. However, root must be able to access their own user environment
    even if the separate /home file system is not accessible for some reason.


    **Lost property**—lost+found (ext file systems only; not mandated by FHS). This
    directory is used for files that look reasonable but do not seem to belong to
    any directory. The file system consistency checker creates links to such files
    in the lost+found directory on the same file system, so the system administrator
    can figure out where the file really belongs; lost+found is created “on the off-chance”
    for the file system consistency checker to find in a fixed place (do by convention,
    on ext file systems, it always uses inode number 11).


    Another motivation for the directory arrangement is as follows: The FHS divides
    files and directories roughly according to two criteria—do they need to be available
    locally or can they reside on another computer and be accessed via the network,
    and are their contents static (do files only change by explicit administrator
    action) or do they change while the system is running? (Table 10.2)


    The idea behind this division is to simplify system administration: Directories
    can be moved to file servers and maintained centrally. Directories that do not
    contain dynamic data can be mounted read-only and are more resilient to crashes.


    # Exercises


    +   **10.2** [1] How many programs does your system contain in the “usual” places?


    +   **10.3** [If grep is called with more than one file name on the command line,
    it outputs the name of the file in question in front of every matching line. This
    is possibly a problem if you invoke grep with a shell wildcard pattern (such as
    “*.txt”), since the exact format of the grep output cannot be foreseen, which
    may mess up programs further down the pipeline. How can you enforce output of
    the file name, even if the search pattern expands to a single file name only?
    (Hint: There is a very useful “file” in /dev.)


    +   **10.4** [The cp foo.txt /dev/null” command does basically nothing, but the
    “mv foo.txt /dev/null”—assuming suitable access permissions—replaces /dev/null
    by foo.txt. Why?


    +   **10.5** [2] On your system, which (if any) software packages are installed
    below /opt? Which ones are supplied by the distribution and which ones are third-party
    products? Should a distribution install a “teaser version” of a third-party product
    below /opt or elsewhere? What do you think?


    +   **10.6** [1] Why is it inadvisable to make backup copies of the directory
    tree rooted at /proc?'
