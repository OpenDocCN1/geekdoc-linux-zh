  md: 'As a further convenience, you can specify negated character classes, which
    are interpreted as “all characters except these”: Something like


    ```

    prog[^A-Za-z].c

    ```


    matches all names where the character between “g” and “.” is not a letter. As
    usual, the slash is excepted.


    # 6.3.3 Braces


    The expansion of braces in expressions like


    ```

    {red,yellow,blue}.txt

    ```


    is often mentioned in conjunction with shell search patterns, even though it is
    really just a distant relative. The shell replaces this by


    ```

    red.txt yellow.txt blue.txt

    ```


    In general, a word on the command line that contains several comma-separated pieces
    of text within braces is replaced by as many words as there are pieces of text
    between the braces, where in each of these words the whole brace expression is
    replaced by one of the pieces. This replacement is purely based on the command
    line text and is completely independent of the existence or non-existence of any
    files or directories—unlike search patterns, which always produce only those names
    that actually exist as path names on the system.


    You can have more than one brace expression in a word, which will result in the
    cartesian product, in other words all possible combinations:


    ```

    {a,b,c}{1,2,3}.dat

    ```


    produces


    ```

    a1.dat a2.dat a3.dat b1.dat b2.dat b3.dat c1.dat c2.dat c3.dat

    ```


    This is useful, for example, to create new directories systematically; the usual
    search patterns cannot help there, since they can only find things that already
