- pgno: 223
  md: 'The frog answered, "I do not care for your clothes, your pearls and jewels,
    nor for your golden crown, but if you will love me and let me be your companion
    and play-fellow, and sit by you at your little table, and eat off your little
    golden plate, and drink out of your little cup, and sleep in your little bed -
    if you will promise me this I will go down below, and bring you your golden ball
    up again."


    "Oh yes," said she, "I promise you all you wish, if you will but bring me my ball
    back again." But she thought, "How the silly frog does talk. All he does is to
    sit in the water with the other frogs, and croak. He can be no companion to any
    human being."


    But the frog when he had received this promise, put his head into the water and
    sank down; and in a short while came swimming up again with the ball in his mouth,
    and threw it on the grass. The king''s daughter was delighted to see her pretty
    plaything once more, and picked it up, and ran away with it.


    "Wait, wait," said the frog. "Take me with you. I can''t run as you can." But
    what did it avail him to scream his croak, after her, as loudly as he could. She
    did not listen to it, but ran home and soon forgot the poor frog, who was forced
    to go back into his well again.


    The next day when she had seated herself at table with the king and all the courtiers,
    and was eating from her little golden plate, something came creeping splash splash,
    slish splash, up the marble staircase, and when it had got to the top, it knocked
    at the door and cried, "Princess, youngest princess, open the door for me."


    She ran to see who was outside, but when she opened the door, there sat the frog
    in front of it. Then she slammed the door to, in great haste, sat down to dinner
    again, and was quite frightened.


    The king saw plainly that her heart was beating violently, and said, "My child,
    what are you so afraid of? Is there perchance a giant outside who wants to carry
    you away?"


    "Ah, no," replied she. "It is no giant but a disgusting frog."


    "What does that frog want from you?"


    "Yesterday as I was in the forest sitting by the well, playing, my golden ball
    fell into the water. And because I cried so, the frog brought it out again for
    me, and because he so insisted, I promised him he should be my companion, but
    I never thought he would be able to come out of his water. And now he is outside
    there, and wants to come in to me."


    In the meantime it knocked a second time, and cried, "Princess, youngest princess,
    open the door for me, do you not know what you said to me yesterday by the cool
    waters of the well. Princess, youngest princess, open the door for me."


    Then said the king, "That which you have promised must you perform. Go and let
