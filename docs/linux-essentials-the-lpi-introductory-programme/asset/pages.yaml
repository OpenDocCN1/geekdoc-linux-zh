- pgno: 136
  md: 'configuration tools that can really be used only by root. “Normal” users can
    use some of these programs to query the system, but can’t change anything. As
    with /bin, there is a directory called /usr/sbin containing more system programs.


    **System Libraries**—/lib This is where the “shared libraries” used by programs
    in /bin and /sbin reside, as files and (symbolic) links. Shared libraries are
    pieces of code that are used by various programs. Such libraries save a lot of
    resources, since many processes use the same basic parts, and these basic parts
    must then be loaded into memory only once; in addition, it is easier to fix bugs
    in such libraries when they are in the system just once and all programs fetch
    the code in question from one central file. Incidentally, below /lib/modules there
    are **kernel modules**, i.e., kernel code which is not necessarily in use—device
    drivers, file systems, or network protocols. These modules can be loaded by the
    kernel when they are needed, and in many cases also be removed after use.


    **Device Files**—/dev This directory and its subdirectories contain a plethora
    of entries for device files. **Device files** form the interface between the shell
    (or, generally, the part of the system that is accessible to command-line users
    or program-mers) to the device drivers inside the kernel. They have no “content”
    like other files, but refer to a driver within the kernel via “device numbers”.


    In former times it was common for Linux distributions to include an entry in /dev
    for every conceivable device. So even a laptop Linux system included the device
    files required for ten hard disks with 63 partitions each, eight ISDN adapters,
    sixteen serial and four parallel interfaces, and so on. Today the trend is away
    from overfull /dev directories with one entry for every imaginable device and
    towards systems more closely tied to the running kernel, which only contain entries
    for devices that actually exist. The magic word in this context is udev (short
    for userspace /dev) and will be discussed in more detail in *Linux Administration
    I*.


    Linux distinguishes between **character devices** and **block devices**. A character
    device is, for instance, a terminal, a mouse or a modem—a device that provides
    or processes single characters. A block device treats data in blocks—this includes
    hard disks or floppy disks, where bytes cannot be read singly but only in groups
    of 512 (or some such). Depending on their flavour, device files are labelled in
    “ls -l” output with a “c” or “b”:


    ```

    ```

    crw-rw- -   1 root root  10,   4 Oct 16 11:11 amigamous

    brw-rw- ---   1 root disk   8,   1 Oct 16 11:11 sda1

    brw-rw- ---   1 root disk   8,   2 Oct 16 11:11 sda2

    crw-rw- -   1 root root   1,   3 Oct 16 11:11 null

    ```

    ```


    Instead of the file length, the list contains two numbers. The first is the “major
    device number” specifying the device’s type and governing which kernel driver
    is in charge of this device. For example, all SCSI hard disks have major device
    number 8. The second number is the “minor device number”. This is used by the
    driver to distinguish between different similar or related devices or to denote
    the various partitions of a disk.


    There are several notable **pseudo devices**. The **null device**, /dev/null,
    is like a “dust bin” for program output that is not actually required, but must
    be directed somewhere. With a command like


    ```

    ```

    $ program >/dev/null

    ```

    ```


    the program’s standard output, which would otherwise be displayed on the terminal,
    is discarded. If /dev/null is read, it pretends to be an empty file and returns
    end-of-file at once. /dev/null must be accessible to all users for reading and
    writing.'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'The “devices” /dev/random and /dev/urandom return random bytes of “crypto-graphic
    quality” that are created from “noise” in the system—such as intervals between
    unpredictable events like key presses. Data from /dev/random is suitable for creating
    keys for common cryptographic algorithms. The /dev/zero file returns an unlimited
    supply of null bytes; you can use these, for example, to create or overwrite files
    with the dd command.


    # The /etc directory is very important; it contains the configuration files for
    most programs. Files /etc/initab and /etc/init.d/", for example, contain most
    of the system-specific data required to start system services. Here is a more
    detailed description of the most important files—except for a few of them, only
    user root has write permission but everyone may read them.


    /etc/fstab  This describes all mountable file systems and their properties (type,
    access method, “mount point”).


    /etc/hosts  This file is one of the configuration files of the TCP/IP network.
    It maps the names of network hosts to their IP addresses. In small networks and
    on freestanding hosts this can replace a name server.


    /etc/inittab  The /etc/inittab file is the configuration file for the init program
    and thus for the system start.


    /etc/init.d/*  This directory contains the “init scripts” for various system services.
    These are used to start up or shut down system services when the system is booted
    or switched off.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_137_0.png)


    /etc/issue  This file contains the greeting that is output before a user is asked
    to log in. After the installation of a new system this frequently contains the
    name of the vendor.


    /etc/motd  This file contains the “message of the day” that appears after a user
    has successfully logged in. The system administrator can use this file to notify
    users of important facts and events1.


    /etc/mtab  This is a list of all mounted file systems including their mount points.
    /etc/mtab differs from /etc/fstab in that it contains all currently mounted file
    systems, while /etc/fstab contains only settings and options for file systems
    that might be mounted—typically on system boot but also later. Even that list
    is not exhaustive, since you can mount file systems via the command line where
    and how you like.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_137_1.png)


    /etc/passwd  In /etc/passwd there is a list of all users that are known to the
    system, together with various items of user-specific information. In spite of
    the name of the file, on modern systems the passwords are not stored in this file
    but in another one called /etc/shadow. Unlike /etc/passwd, that file is not readable
    by normal users.


    # This directory is really intended for third-party software— complete packages
    prepared by vendors that are supposed to be installable without conflicting with
    distribution files or locally-installed files. Such software packages occupy a
    subdirectory /opt/(package). By rights, the /opt directory should be completely
    empty after a distribution has been installed on an empty disk.


    1 There is a well-known claim that the only thing all Unix systems in the world
    have in common is the “message of the day” asking users to remove unwanted files
    since all the disks are 98% full.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '*"Unchanging Files"—/usr*  In /usr there are various subdirectories containing
    programs and data files that are not essential for booting or repairing the system
    or otherwise indispensable. The most important directories include:


    +   * /usr/bin System programs that are not essential for booting or otherwise
    important

    +   * /usr/sbin More system programs for root

    +   * /usr/lib Further libraries (not used for programs in /bin or /sbin)

    +   * /usr/local  Directory for files installed by the local system administrator.
    Corresponds to the /opt directory—the distribution may not put anything here

    +   * /usr/share  Architecture-independent data. In principle, a Linux network
    consisting, e.g., of Intel, SPARC and PowerPC hosts could share a single copy
    of /usr/share on a central server. However, today disk space is so cheap that
    no distribution takes the trouble of actually implementing this.

    +   * /usr/share/doc Documentation, e.g., HOWTOs

    +   * /usr/share/info Info pages

    +   * /usr/share/man Manual pages (in subdirectories)

    +   * /usr/src Source code for the kernel and other programs (if available)


    > The name /usr is often erroneously considered an acronym of "Unix system resources".
    Originally this directory derives from the time when computers often had a small,
    fast hard disk and another one that was bigger but slower. All the frequently-used
    programs and files went to the small disk, while the big disk (mounted as /usr)
    served as a repository for files and programs that were either less frequently
    used or too big. Today this separation can be exploited in another way: With care,
    you can put /usr on its own partition and mount that partition "read-only". It
    is even possible to import /usr from a remote server, even though the falling
    prices for disk storage no longer make this necessary (the common Linux distributions
    do not support this, anyway).


    **A Window into the Kernel—/proc**  This is one of the most interesting and important
    directories. /proc is really a "pseudo file system": It does not occupy space
    on disk, but its subdirectories and files are created by the kernel if and when
    someone is interested in their content. You will find lots of data about running
    processes as well as other information the kernel possesses about the computer''s
    hardware. For instance, in some files you will find a complete hardware analysis.
    The most important files include:


    +   * /proc/cpuinfo This contains information about the CPU''s type and clock
    frequency.

    +   * /proc/devices This is a complete list of devices supported by the kernel
    including their major device numbers. This list is consulted when device files
    are created.

    +   * /proc/dma A list of DMA channels in use. On today''s PCI-based systems this
    is neither very interesting nor important.

    +   * /proc/interrupts A list of all hardware interrupts in use. This contains
    the interrupt number, number of interrupts triggered and the drivers handling
    that particular interrupt. (An interrupt occurs in this list only if there is
    a driver in the kernel claiming it.)

    +   * /proc/ioports Like /proc/interrupts, but for I/O ports.'
