- pgno: 209
  md: '# ## Summary


    +   - There are three kinds of network protocols: medium access protocols, communication
    protocols, and application protocols.

    +   - In a “protocol stack”, each protocol only interacts with the protocols immediately
    above and below.

    +   - TCP/IP contains the communication protocols IP, TCP (reliable and connection-oriented),
    and UDP (unreliable and connectionless), the control protocol ICMP, and a multitude
    of application protocols based on TCP or UDP.

    +   - Computers on the Internet have unique IP addresses.

    +   - Routing allows communication between computers that are not directly connected
    to each other.

    +   - To connect to a network, a Linux computer requires an IP address, a subnet
    address with a mask, a default gateway, and the address of at least one DNS server.

    +   - The DNS is a distributed database that maps host names to IP addresses and
    vice versa (among other things).

    +   - IPv6 is the successor standard to IPv4, which removes various limitations
    and incorporates improvements.

    +   - ifconfig and route are used for the manual configuration of networking.
    Distributions use various schemes for persistent networking configuration.

    +   - The ifconfig, ping, dig, and netstat programmes are used for network troubleshooting.'
  merge: -1
  img_proc: true
