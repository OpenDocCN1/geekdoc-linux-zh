  md: '# # 11.2 Archiving Files Using tar


    The name tar derives from “tape archive”. The program writes individual files
    to the archival file one after the other and annotates them with additional information
    (like the date, access permissions, owner, …). Even though tar was originally
    meant to be used with magnetic tape drives, tar archives can be written directly
    on various media. Among other uses, tar files are the standard format for disseminating
    the source code for Linux and other free software packages.


    The GNU implementation of tar commonly used on Linux includes various extensions
    not found in the tar implementations of other Unix variants. For example, GNU
    tar supports creating multi-volume archives spanning several media. This even
    allows backup copies to floppy disk, which of course is only worthwhile for small
    archives.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_146_0.png)


    A small remark on the side: The split command lets you cut large files like archives
    into convenient pieces that can be copied to floppy disks or sent via e-mail,
    and can be re-joined at their destination using cat.


    The advantages of tar include: It is straightforward to use, it is reliable and
    works well, it can be used universally on all Unix and Linux systems. Its disadvantages
    are that faults on the medium may lead to problems, and not all versions of tar
    can store device files (which is only an issue if you want to perform a full backup
    of your system).


    tar archives can contain files and whole directory hierarchies. If Windows media
    have been mounted into the directory tree across the network, even their content
    can be archived using tar. Archives created using tar are normally uncompressed,
    but can be compressed using external compression software (nowadays usually gzip
    or bzip2). This is not a good idea as far as backup copies are concerned, since
    bit errors in the compressed data usually lead to the loss of the remainder of
    the archive.


    Typical suffixes for tar archives include .tar, .tar.bz2, or .tar.gz, depending
    on whether they have been compressed not at all, using bzip2, or using gzip. The
    .tgz suffix is also common when zipped tar-formatted data need to be stored on
    a DOS file system. tar’s syntax is


    ```

    tar (options) (file)\|(directory) _

    ```


    and the most important include:


    +   - c (“create”) creates a new archive

    +   - f file creates the new archive on (or reads an existing archive from) (file),
    where (file) can be a plain file or a device file (among others)


    +   - M handles multi-volume archives


    +   - r appends files to the archive (not for magnetic tape)


    +   - t displays the “table of contents” of the archive


    +   - u replaces files which are newer than their version inside the archive.
    If a file is not archived at all, it is inserted (not for magnetic tape)


    +   - v Verbose mode—displays what tar is doing at the moment


    +   - x extracts files and directories from an archive


    +   - z compresses or decompresses the archive using gzip


    +   - Z compresses or decompresses the archive using compress (not normally available
    on Linux)


    +   - j compresses or decompresses the archive using bzip2'
