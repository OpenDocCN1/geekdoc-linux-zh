  md: '# 2.3.4 Internet Services


    Without Linux, the Internet would not be recognisable: Google’s hundreds of thousands
    of servers run Linux just as the trading systems of most of the world’s big stock
    exchanges (the German exchange as well as the London and New York stock exchanges),
    since the required performance can only be made available with Linux. In point
    of fact, most Internet software is developed on Linux first, and most university
    research in these areas takes place on the open-source Linux platform.


    **Apache** is by far the most popular web server on the Internet—more than half
    of all web sites run on an Apache server.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_38_0.png)


    There are of course other good web servers for Linux—for example, Nginx or Lighttpd—,
    but Apache remains the most common.


    **MySQL and PostgreSQL** are freely available relational database servers. MySQL
    is best used for web sites, while PostgreSQL is an innovative and high-performance
    database server for all kinds of purposes.


    **Postfix** is a secure and extremely powerful mail server which is useful for
    any environment from the “home office” to large ISPs or Fortune 500 enterprises.


    # 2.3.5 Infrastructure Software


    A Linux server can prove very useful within a local-area network: It is so reliable,
    fast, and low-maintenance that it can be installed and forgotten (except for regular
    backups, of course!).


    **Samba** turns a Linux machine into a server for Windows clients which makes
    disk space and printers available to all Windows machines on the network (Linux
    machines, too). With the new Samba 4, a Linux server can even serve as an Active
    Directory domain controller, making a Windows server extraneous. Reliability,
    efficiency and saved licence fees are very convincing arguments.


    **NFS** is the Unix environment to Samba and allows other Linux and Unix machines
    on the network access to a Linux server’s disks. Linux supports the modern NFSv4
    with enhanced performance and security.


    **OpenLDAP** serves as a directory service for medium and large networks and offers
    a large degree of redundancy and performance for queries and updates through its
    powerful features for the distribution and replication of data.


    **DNS and DHCP** form part of the basic network infrastructure. With BIND, Linux
    supports the reference DNS server, and the ISC DHCP server can cooperate with
    BIND to provide clients with network parameters such as IP addresses even in very
    large networks. Dnsmasq is an easy-to-operate DNS and DHCP server for small networks.


    # 2.3.6 Programming Languages and Development


    From its beginnings, Linux has always been a system by developers for developers.
    Accordingly, compilers and interpreters for all important programming languages
    are available—the GNU Compiler family, for example, supports C, C++, Objective
    C, Java, Fortran and Ada. Of course the popular scripting languages such as Perl,
    Python, Tcl/Tk, Ruby, Lua, or PHP are supported, and less common languages such
    as Lisp, Scheme, Haskell, Prolog, or Ocaml, are also part of many Linux distributions.


    A very rich set of editors and auxiliary tools makes software development a pleasure.
    The standard editor, vi is available as are professional development environments
    such as GNU Emacs or Eclipse.'
