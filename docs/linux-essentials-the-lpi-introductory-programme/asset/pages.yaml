    \ loss, time 4006ms\nrtt min/avg/max/mdev = 3.543/3.967/5.095/0.575 ms\n```\n\n\
    Everything is in order here: All five transmitted packets have arrived back, the\
    \ sequence is correct, and the transmission times make sense for a local network.\
