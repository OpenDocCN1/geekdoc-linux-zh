    # ### 8.4.2 Columns and Fields—*cut*, paste etc.


    While you can locate and “cut out” lines of a text file using `grep`, the `cut`
    command works through a text file “by column”. This works in one of two ways:


    One possibility is the absolute treatment of columns. These columns correspond
    to single characters in a line. To cut out such columns, the column number must
    be given after the `-c` option ("column"). To cut several columns in one step,
    these can be specified as a comma-separated list. Even column ranges may be specified.


    ```

    $ cut -c 12,1-5 participants.dat

    Smith

    ProwlD

    FleetF

    Jumpa®

    de LeG

    <<<<<<<

    ```'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'In this example, the first letter of the first name and the first five letters
    of the last name are extracted. It also illustrates the notable fact that the
    output always contains the columns in the same order as in input. Even if the
    selected column ranges overlap, every input character is output at most once:


    ```

    ```

    $ cut -c 1-5,2-6,3-7 participants.dat

    Smith

    Prowler

    Fleetma

    Jumpabo

    de Leap

    <3333

    ```

    ```


    The second method is to cut relative fields, which are delimited by separator
    characters. If you want to cut delimited fields, cut needs the -f ("field") option
    and the desired field number. The same rules as for columns apply. The -c and
    -f options are mutually exclusive.


    The default separator is the tab character; other separators may be specified
    with the -d option ("delimiter"):


    ```

    ```

    $ cut -d: -f 1,4 participants0.dat

    Smith:123

    Prowler:13

    Fleetman:217

    Jumpabout:154

    de Leaping:26

    <3333

    ```

    ```


    In this way, the participants'' last names (column 1) and numbers (column 4) are
    taken from the list. For readability, only the first few lines are displayed.


    Incidentally, using the --output-delimiter option you can specify a different
    separator character for the output fields than is used for the input fields:


    ```

    ```

    $ cut -d: --output-delimiter='' '' -f 1,4 participants0.dat

    Smith: 123

    Prowler: 13

    Fleetman: 217

    Jumpabout: 154

    de Leaping: 26

    ```

    ```


    If you really want to change the order of columns and fields, you have to bring
    in the big guns, such as awk or perl; you could do it using the paste command,
    which will be introduced presently, but that is rather tedious.


    When files are treated by fields (rather than columns), the -s option ("separator")
    is helpful. If "cut -f" encounters lines that do not contain the separator character,
    these are normally output in their entirety; -s suppresses these lines.


    The paste command joins the lines of the specified files. It is thus frequently
    used together with cut. As you will have noticed immediately, paste is not a filter
    command. You may however give a minus sign in place of one of the input file-names
    for paste to read its standard input at that point. Its output always goes to
    standard output.


    As we said, paste works by lines. If two file names are specified, the first line
    of the first file and the first of the second are joined (using a tab character
    as the separator) to form the first line of the output. The same is done with
    all other lines in the files. To specify a different separator, use the -d option.


    By way of an example, we can construct a version of the list of marathon runners
    with the participants'' numbers in front:




