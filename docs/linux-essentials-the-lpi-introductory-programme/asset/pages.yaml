    # 6.4.2 Linking Files—ln and ln -s


    Linux allows you to create references to files, so-called "links", and thus to
    assign several names to the same file. But what purpose does this serve? The applications
    range from shortcuts for file and directory names to a "safety net" against unwanted
    file deletions, to convenience for programmers, to space savings for large directory
    trees that should be available in several versions with only small differences.


    The ln ("link") command assigns a new name (second argument) to a file in addition
    to its existing one (first argument):


    ```

    $ ln list list2

    $ ls -l

    -rw-r--f-    2 joe users    2500 Oct 4 11:11 list

    -rw-r--f-    2 joe users    2500 Oct 4 11:11 list2

    ```


    The directory now appears to contain a new file called list2. Actually, there
    are just two references to the same file. This is hinted at by the reference counter
    in the second column of the "ls -l" output. Its value is 2, denoting that the
    file really has two names. Whether the two file names really refer to the same
    file can only be decided using the "ls -i" command. If this is the case, the file
    number in the first column must be identical for both files. File numbers, also
    called inode numbers, identify files uniquely within their file system:


    ```

    $ ls -i

    876543 list     876543 list2

    ```'
