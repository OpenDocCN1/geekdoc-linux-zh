    # Access to Other Storage Media---/mnt This directory (also empty) serves as a
    mount point for short-term mounting of additional storage media. With some distributions,
    such as those by Red Hat, media mountpoints for CD-ROM, floppy, ... might show
    up here instead of below /media.


    # User Home Directories---/home This directory contains the home directories of
    all users except root (whose home directory is located elsewhere).


    ![](img/44bdd771e9c9b1353d2401c2892b2459_140_3.png)


    If you have more than a few hundred users, it is sensible, for privacy protection
    and efficiency, not to keep all home directories as immediate children of /home.
    You could, for example, use the users'' primary group as a criterion for further
    subdivision:


    ```

    ``/home/support/jim /home/develop/bob <333333``

