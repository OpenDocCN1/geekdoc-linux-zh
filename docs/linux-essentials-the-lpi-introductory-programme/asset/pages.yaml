  md: 'Table B.3: Options for sort (selection)


    | Option | Result |

    | -b (blank) | Ignores leading blanks in field contents |

    | -d (dictionary) | Sorts in “dictionary order”, i.e., only letters, digits and
    spaces are taken into account |

    | -f (fold) | Makes uppercase and lowercase letters equivalent |

    | -i (ignore) | Ignores non-printing characters |

    | -k ⟨field⟩, ⟨field⟩ (key) | Sort according to ⟨field⟩ (up to and including ⟨field⟩)
    |

    | -n (numeric) | Considers field value as a number and sorts according to its
    numeric value; leading blanks will be ignored |

    | -o ⟨file⟩ (output) | Writes results to a file, whose name may match the original
    input file |

    | -r (reverse) | Sorts in descending order, i.e., Z to A |

    | -t ⟨char⟩ (terminate) | The ⟨char⟩ character is used as the field separator
    |

    | -u (unique) | Writes only the first of a sequence of equal output lines |


    Sweat Susan Rundale Sportsters 93 Ladies

    Runntington Vivian Lameborough TFC 117 Ladies


    This sorted list still has a little blemish; see Exercise 8.14.


    The sort field can be specified in even more detail, as the following example
    shows:


    $ sort -br -k 2.2 participants.dat

    Sweat Susan Rundale Sportsters 93 Ladies

    Fleetman Fred Rundale Sportsters 217 Men

    Longshanks Loretta Pantington AC 55 Ladies

    Runntington Vivian Lameborough TFC 117 Ladies

    Jumpabout Mike Failing Track Society 154 Men

    Prowler Desmond Lameborough TFC 13 Men

    Smith Herbert Pantington AC 123 Men

    de Leaping Gwen Failing Track Society 26 Ladies

    Oblomovsky Katie Rundale Sportsters 57 Ladies

    Runntington Kathleen Lameborough TFC 119 Ladies

    O’Finnnan Jack Failing Track Society 45 Men


    Here, the participants.dat file is sorted in descending order (-r) according to
    the second character of the second table field, i.e., the second character of
    the first name (very meaningful). In this case as well it is necessary to ignore
    leading spaces using the -b option. (The blemish from Exercise 8.14 still manifests
    itself here.)


    With the -t (terminate) option you can select an arbitrary character in place
    of the field separator. This is a good idea in principle, since the fields then
    may contain spaces. Here is a more usable (if less readable) version of our example
    file:


    Smith:Herbert:Pantington AC:123:Men

    Prowler:Desmond:Lameborough TFC:13:Men

    Fleetman:Fred:Rundale Sportsters:217:Men

    Jumpabout:Mike:Failing Track Society:154:Men

    de Leaping:Gwen:Failing Track Society:26:Ladies

    Runntington:Vivian:Lameborough TFC:117:Ladies

    Sweat:Susan:Rundale Sportsters:93:Ladies

    Runntington:Kathleen:Lameborough TFC:119:Ladies

    Longshanks:Loretta: Pantington AC:55:Ladies

    O’Finnnan:Jack:Failing Track Society:45:Men

    Oblomovsky:Katie:Rundale Sportsters:57:Ladies'
