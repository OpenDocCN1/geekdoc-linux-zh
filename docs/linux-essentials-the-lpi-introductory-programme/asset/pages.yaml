    **12.1** A simple `su` (without `/bin/` in front) would in principle work just
    as well. However, it makes sense to get used to `/bin/su` because it protects
    you better against “Trojan horses”: A devious user could place a program called
    `su` in their `PATH` such that it is found before `/bin/su`. Then they call you
    to their machine because of some feigned problem. You say to yourself “I''ll have
    this fixed in no time, I''ll just borrow this terminal session for a moment to
    become `root`”, innocuously call “`su`”, and your devious user''s program asks
    you for the `root` password just like the genuine `su` would. Except that it saves
    the password to some file, outputs an error message, and removes itself. You are
    likely to assume that you made a typo, call “`su`” again, get the genuine program,
    and everything is fine from here—except that your devious user now knows the `root`
    password. If you use “/bin/su” in the first place, this attack isn''t so straightforward.


    **12.2** Using `su`, any arbitrary user can obtain administrator privileges simply
    by virtue of knowing the root password. With `sudo`, however, you will only be
    successful if you are on `sudo`''s list of authorised users. Hence, `sudo` does
    not ask you for the password to figure out whether you are allowed to be `root`,
    but to establish that you are *yourself*. (Someone else might have taken over
    your computer while you have stepped out for a moment.) Your own password works
    for this just as well (or even better) than `root`''s. `sudo` is particularly
    useful if you share the system administrator job with several colleagues, because
    then *nobody* needs to know the actual *root* password—you can assign something
    very long and complicated and place it in a sealed envelope in the safe after
    the computer has been installed (for emergencies). With `su`, *all* administrators
    need to know the password, which makes changing it difficult. (The SUSE distributions
    use the `root` password with `sudo`, by default, and they even seem to be proud
    of that type of brain damage.)


    **12.7** Here is the RPM variant:


    ```

    $ rpm --query --all | wc -l

    ```


    And on a Debian-like system you should use something like


    ```

    $ dpkg --list | grep ^ii | wc -l

    ```


