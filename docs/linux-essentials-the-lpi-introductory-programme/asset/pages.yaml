  md: 'editor.


    Text editors for Linux come in all sizes, shapes, and colours. We’re taking the
    easy way out by explaining the most important features of “GNU Nano”, a simple,
    beginner-proof text editor that runs inside a terminal session.


    Of course the common graphical interfaces also support graphical text editors
    with menus, tool bars, and all sorts of useful goodies—comparable to programs
    like “Notepad” on Windows (or even better). For example, look for “Kate” on KDE
    or “gedit” on GNOME. We shall not be looking at these editors in detail here,
    for two reasons:


    +   - They tend to explain themselves for the most part, and we do not want to
    insult your intelligence more than necessary.

    +   - You will not always be in a position to use a graphical interface. You may
    be working on a remote computer using the “secure shell”, or standing in front
    of a server console in the basement machine hall, and chances are that you will
    only have a text screen at your disposal.


    In any case, you don’t have to decide right now which *one* editor you will be
    using for the rest of your life. Nobody prevents you from using a graphical editor
    on your graphical desktop PC and hauling out something like Nano only if there
    is no other option.


    Old-school Linux aficionados will scoff at something like Nano: The editor of
    choice for the true Linux professional is *vi* (pronounced “vee aye”), which like
    a living fossil has survived from a time when the greenish light of text terminals
    filled the machine rooms and one couldn’t rely on a keyboard featuring arrow keys
    (!). If you are about to embark on a career in system administration, you should
    sooner or later become familiar with *vi* (at least on an elementary level), since
    *vi* is the only editor worth using that is available in largely identical form
    on practically every Linux or Unix variant. But that moment isn’t now.


    GNU Nano is a “clone” of a simple editor called *pico* which was part of the PINE
    e-mail package. (PINE wasn’t free software according to the generally accepted
    definitions, so the GNU project wrote the new editor from scratch. In the meantime,
    PINE’s successor is freely available under the name of “alpine”, and it contains
    a free version of *pico*, too.) Most distributions should offer either GNU Nano
    or *pico*; for simplicity we will spend the rest of this section talking about
    GNU Nano. Practically anything we say here also applies to *pico*.


    Compared to the original *pico*, GNU Nano features some extensions (which shouldn’t
    come as a surprise considering that already according to the name it is three
    orders of magnitude better), but most of these do not concern us directly. There
    is really only one extension that is very obvious: GNU Nano is “internationalised”,
    so, for example, on a system that is otherwise set up to use the German language
    it should delight you with messages and help texts in German.


    # Starting GNU Nano


    GNU Nano is most conveniently started inside a terminal window (Section 3.2.3)
    using a command like


    ```

    `$ nano myfile`

    ```


    (the “$ ” here is just a stylised abbreviation of the command prompt—which may
    look somewhat more baroque on your system—and you do not need to enter this. Don’t
    forget to finish the command using [↵], thought!) Subsequently you should see
    something resembing Figure 3.1—that is, a mostly empty window with one highlighted
    line at the top and two “help lines” at the bottom, which list important commands
    with brief explanations. The line immediately above the help lines is the “status
    line”, where messages from Nano will appear and where you will be able to enter,
    e. g., file names when saving data to disk.'
