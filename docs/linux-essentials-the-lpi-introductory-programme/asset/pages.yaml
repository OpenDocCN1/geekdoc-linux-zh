    There is considerable consensus about the FHS, but it is just as “binding” as
    anything on Linux, i.e., not that much. On the one hand, those certainly are Linux
    systems (for example the one on your broadband router or PVR) that are mostly
    touched only by the manufacturer and where conforming to every nook and cranny
    of the FHS does not gain anything. On the other hand, you may do whatever you
    like on your own system, but must be prepared to bear the consequences—your distributor
    assures you to keep to his side of the FHS bargain, but also expects you not to
    complain if you are not playing completely by the rules and problems do occur.
    For example, if you install a program in /usr/bin and the file in question gets
    overwritten during the next system upgrade, this is your own fault since, according
    to the FHS, you are not supposed to put your own programs into /usr/bin (/usr/local/bin
    would have been correct).


    The Operating System Kernel—/boot  The /boot directory contains the actual operating
    system: vmlinuz is the Linux kernel. In the /boot directory there are also other
    files required for the boot loader (LILO or GRUB).


    General Utilities—/bin  In /bin there are the most important executable programs
    (mostly system programs) which are necessary for the system to boot. This includes,
    for example, mount and mkdir. Many of these programs are so essential that they
    are needed not just during system startup, but also when the system is running—like
    ls and grep. /bin also contains programs that are necessary to get a damaged system
    running again if only the file system containing the root directory is available.
    Additional programs that are not required on boot or for system repair can be
    found in /usr/bin.


    Special System Programs—/sbin  Like /bin, /sbin contains programs that are necessary
    to boot or repair the system. However, for the most part these are system'
