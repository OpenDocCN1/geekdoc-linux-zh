- pgno: 43
  md: '# ## 2.4.6 Others


    In addition to the distributions we mentioned there are many more, such as Mandriva
    Linux (http://www.mandriva.com/linux/) or Turbolinux (http://www.turbolinux.com/)
    as smaller competitors of Red Hat and SUSE, Gentoo Linux (http://www.gentoo.org/)
    as a distribution focused on source code, various “live systems” for different
    purposes ranging from firewalls to gaming or multimedia platforms, or very compact
    systems usable as routers, firewalls or rescue systems. Also worth mentioning
    if only because of the number of “installed systems” is Android, which with a
    grain of salt can be considered as a “Linux distribution”. Android consists of
    a Linux operating system kernel with a user space environment maintained by Google
    and based on Google’s version of Java (“Dalvik”) instead of the usual environment
    based on GNU, X, KDE, etc. that forms the basis of most “normal” distributions.
    An Android smartphone or tablet presents itself to the user completely unlike
    a typical Linux PC running openSUSE or Debian GNU/Linux, but is still arguably
    a Linux system.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_43_0.png)


    While most Android users buy their system preinstalled on their phone or tablet
    and then never change it, most Android-based devices make it possible (sometimes
    with hacks) to install an alternative Android “distribution”, of which there are
    several. For many devices this is the only way of obtaining up-to-date Android
    versions, if the device manufacturer and/or telephone service provider do not
    deem it necessary to publish an official new version.


    # ## 2.4.7 Differences and Similarities


    Even though there is a vast number of Linux distributions, at least the major
    distributions turn out to be fairly similar in daily life. This is partly due
    to their use of the same basic programs—for example, the command-line interpreter
    is almost always bash. On the other hand there are standards that try to curb
    rank growth. These include the *Filesystem Hierarchy Standard* (FHS) or the *Linux
    Standard Base* (LSB), which attempts to codify a unified “base version” of Linux
    to make it easier for third-party software suppliers to distribute their software
    for as many Linux distributions as possible.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_43_1.png)


    Unfortunately, LSB did not turn out to be the unmitigated success that it was
    supposed to be—it was often misunderstood as a method for slowing down or stopping
    innovation in Linux and reducing diversity (even though most distributions make
    it possible to provide an LSB environment in parallel to, and independently of,
    the actual environment for software furnished by the distribution), while the
    third-party suppliers who were supposed to be targeted in the first place generally
    preferred to “certify” their software packages for the main “enterprise distributions”
    like RHEL and SLES, and supporting only these platforms. While it is definitely
    not unlikely that it will be possible to run (or get to run) SAP or Oracle on,
    say, Debian GNU/Linux, the cost involved in licensing large commercial software
    packages like these are such that the licence fees for RHEL and SLES do not make
    a noticeable difference in the bottom line.


    One noticeable area where distributions differ is the method used to administer
    (install and remove) software packages, and following on from that the file format
    of pre-made software packages within the distribution. There are currently two
    main approaches, namely the one by Debian GNU/Linux (“deb”) and the one originally
    developed by Red Hat (“rpm”). As usual, neither of the two is clearly superior
    to the other, but either has enough strong points to keep its proponents from
    changing over. The deb approach is used by Debian GNU/Linux, Ubuntu, and other
    Debian derivatives, while Red Hat, SUSE, and various distributions derived from
    those rely on *rpm*.'
