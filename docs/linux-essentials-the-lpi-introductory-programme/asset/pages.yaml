  md: '![](img/44bdd771e9c9b1353d2401c2892b2459_20_0.png)


    Since February, 2012, the official name for the Macintosh operating system is
    "OS X" rather than "Mac OS X". If we let slip a "Mac OS" every so often, you know
    what we really mean.


    The big difference between Windows and OS X is that OS X is sold exclusively with
    Apple computers and will not run on "normal" PCs. This makes it much more straightforward
    for Apple to provide a system that is obviously very homogeneous. Windows, on
    the other hand, must run on all sorts of PCs and support a much wider array of
    hardware components that can occur in completely unforeseen combinations. Hence,
    Windows users have to contend with incompatibilities that are sometimes difficult
    or even impossible to sort out. On the other hand, there is a much greater selection
    of hardware for Windows-based computers, and prices are, on the whole, less exorbitant.


    Windows and OS X are similar in that they are both *proprietary* software: Users
    are forced to accept what Microsoft or Apple put in front of them, and they cannot
    examine the actual implementation of the system, let alone make changes to it.
    They are bound to the upgrade schedule of the system, and if the manufacturer
    removes something or replaces it by something else, they need to adapt to that.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_20_1.png)


    There is one difference here, though: Apple is essentially a hardware manufacturer
    and only provides OS X to give people an incentive to buy Macs (this is why OS
    X isn''t available for non-Macs). Microsoft, on the other hand, does not build
    computers, and instead makes its money selling software such as Windows which
    runs on arbitrary PCs. Therefore, an operating system like Linux is much more
    of a threat to Microsoft than to Apple—most of the people who buy an Apple computer
    do this because they want an Apple computer (the complete package), not because
    they are especially interested in OS X. The PC as a platform, however, is being
    encroached upon by tablets and other new-fangled types of computer that don''t
    run Windows, and that puts Microsoft under extreme pressure. Apple could easily
    survive selling just iPhones and iPads instead of Macs—Microsoft without Windows
    would probably go bankrupt fairly soon in spite of having loads of money in their
    bank account.\<sup>8\</sup>


    # 1.4.2 Linux


    Linux is an operating system that was first started out of curiosity by Linus
    Torvalds, but then took on a life of its own—in the meantime, hundreds of developers
    (not just students and hobbyists, but also professionals at companies such as
    IBM, Red Hat, or Oracle) are developing it further.


    Linux was inspired by Unix, an operating system developed in the 1970s at AT&T
    Bell Laboratories and geared towards "small" computers (see above for the meaning
    of "small" in this context). Unix soon became the preferred system for research
    and technology. For the most part, Linux uses the same concepts and basic ideas
    as Unix, and it is easy to get Unix software to run on Linux, but Linux itself
    does not contain Unix code, but is an independent project.


    Unlike Windows and OS X, Linux isn''t backed by an individual company whose economic
    success hinges on the success of Linux. Linux is "freely available" and can be
    used by anyone—even commercially—who subscribes to the rules of the game (as outlined
    in the next chapter). This together with the fact that by now Linux no longer
    runs just on PCs, but in substantially identical form on platforms ranging from
    telephones (the most popular smartphone operating'
