    # GPL and money


    The GPL does not stipulate anything concerning the possible price of the product.
    It is completely legal to give away copies of GPL software or to ask for money,
    as long as you furnish source code or make it available on request and as long
    as the receiver also gets the GPL rights. This means that GPL software is not
    necessarily “freeware”.


    You can find out more by studying the GPL [GPL91], which must be distributed with
    each GPL-ed product (including Linux).


    The GPL is considered the most consistent of free licences in the sense that—as
    we said—it tries to ensure that, once published under the GPL, code must *remain*
    free. On various occasions companies tried to incorporate GPL code into their
    own products that they were not about to release under the GPL. However, after
    being sternly reprimanded by (most often) the FSF as the copyright holder, these
    companies have come into compliance with the GPL. At least in Germany, the GPL
    has also been validated in court—a Linux kernel programmer could obtain judgement
    in the Frankfurt district court against D-Link (a manufacturer of networking components,
    in this case a Linux-based NAS device), which he had sued for not complying with
    the GPL when distributing their device [GPL-Urltd06].


    Why does the GPL work? Some companies which considered the GPL restrictions onerous
    have tried to declare, or get it declared, invalid. For example, in the United
    States it was termed “un-American” or “unconstitutional”, and in Germany a company
    tried to use antitrust law to invalidate the GPL since it supposedly implied illegal
    price fixing. The idea seems to be that GPL software can be used by anyone for
    anything if something is demonstrably wrong with the GPL. All of these attacks
    ignore one important fact: Without the GPL, nobody except the original author
    would have the right to do anything with the code, since actions such as distributing
    or, in fact, selling the software are reserved by copyright law. So if the GPL
    disappears, all other parties interested in the code are a lot worse off than
    before.


    A lawsuit where a software author sues a company that distributes his GPL code
    without complying with the GPL would approximately look like this:


    **Judge** What seems to be the problem?


    **Software Author** Your Lordship, the defendant has distributed my software without
    a licence.


    **Judge** (to the defendant’s counsel) Is that so?


    At this point the defendant can say “yes”, and the lawsuit is essentially over
    (except for the verdict). They can also say “no” but then it is up to them'
