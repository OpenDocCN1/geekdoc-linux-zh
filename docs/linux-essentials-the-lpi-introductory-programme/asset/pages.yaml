    and thus dispense with various expensive services like semantic search.

    +   • If you would rather not use a complete desktop environment, you may install
    any of a number of “window managers”. This implies certain tradeoffs regarding
    the optical consistency and cooperation of programs, which result from the fact
    that, historically, there used to be few guidelines for the look and feel of graphical
    programs on Unix and Linux. Formerly—before KDE etc., which did establish a degree
    of standardisation in this respect—this used to be the usual way of doing things,
    but today a majority of Linux users relies on one of the preassembled graphical
    environments.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_49_0.png)


    Even if two distributions use the same graphical environment (say, KDE) this doesn’t
    mean that they will look the same on screen. Usually, the graphical environments
    allow a large degree of customisation of their “look” based on “themes”, and distributions
    use this to set themselves apart from others. Consider cars; almost all cars have
    four wheels and a windscreen, but you would still never confuse a BMW with a Citroën
    or Ferrari.


    In any event, you are likely to find a **control bar** (dock, panel, what have
    you) either at the top or at the bottom of the screen, which allows you to access
    the most important application programs by means of menu entries, or to log out
    or shut down the computer. KDE relies on a “panel” that roughly resembles that
    of Windows, where a “start button” (not actually called that) opens a menu of
    programs, while the rest of the bar shows icons for the currently running applications
    alongside little useful helpers like a clock, the network state, and so on. GNOME
    does not use a “start button”, but moves the menu bar to the top of the screen;
    the most important programs are accessible through pull-down menus on the left-hand
    side of the screen, while the right-hand part is reserved for system status icons
    and the like.


    The graphical environments usually provide a **file manager**, which lets you
    access directories (“folders”) on disk and manipulate the files and subdirectories
    they contain. The procedures here do not differ a lot from those on other graphical
    systems: You can copy or move files by dragging them from one directory window
    into another, and if you use the rightmost mouse button to click on the icon for
    a file, a “context menu” opens to offer additional actions that you can apply
    to the file. Do experiment.


    Frequently-used files or programs can often be deposited on the screen backdrop
    or placed in a certain area on screen (a “**dock**”) for quick and convenient
    access.


    A useful feature of most Linux-based graphical environments which OS X and Windows
    do not offer (by default, anyway) are “**virtual desktops**”. These multiply the
    available space on screen by making it convenient to switch back and forth between
    several simulated “desktops”—each with its own selection of program windows. This
    allows you to place everything you need to work on a program or document on one
    desktop, reserve another for your e-mail reader and yet another for the games
    and music players.


    ¹ Microsoft promised that particular feature a few times, but it has always conspicuously
    disappeared from the novelty list before the next Windows version was released.'
