    | Sweat | Susan | Rundle Sportsters | 93 | Ladies |

    | de Leaping | Gwen | Fairing Track Society | 26 | Ladies |


    You will surely notice the two small problems with this list: “Oblomovsky” should
    really be in front of “O’Finnan”, and “de Leaping” should end up at the front
    of the list, not the end. These will disappear if we specify “English” sorting
    rules:


    ```

    $ LC_COLLATE=en_GB sort participants.dat

    de Leaping Gwen Fairing Track Society 26 Ladies

    Fleetman Fred Rundle Sportsters 217 Men

    Jumbabout Mike Fairing Track Society 154 Men

    Longshanks Loretta Pantington AC 55 Ladies

    Oblomovsky Katie Rundle Sportsters 57 Ladies

    O’Finnan Jack Fairing Track Society 45 Men

    Prowler Desmond Lameborough TFC 13 Men

    Runnigton Kathleen Lameborough TFC 119 Ladies

    Runnigton Vivian Lameborough TFC 117 Ladies

    Smith Herbert Pantington AC 123 Men

    Sweat Susan Rundle Sportsters 93 Ladies

    ```


    (en_GB is short for “British English”; en_US, for “American English”, would also
    work here.) Let’s sort according to the first name next:


    ```

    $ sort -k 2,2 participants.dat

    Smith Herbert Pantington AC 123 Men

    Sweat Susan Rundle Sportsters 93 Ladies

    Prowler Desmond Lameborough TFC 13 Men

    Fleetman Fred Rundle Sportsters 217 Men

    O’Finnan Jack Fairing Track Society 45 Men

    Jumbabout Mike Fairing Track Society 154 Men

    Runnigton Kathleen Lameborough TFC 119 Ladies

    Oblomovsky Katie Rundle Sportsters 57 Ladies

    de Leaping Gwen Fairing Track Society 26 Ladies

    Longshanks Loretta Pantington AC 55 Ladies

    Runnigton Vivian Lameborough TFC 117 Ladies

    ```


    This illustrates the property of sort mentioned above: The first of a sequence
    of spaces is considered the separator, the others are made part of the following
    field’s value. As you can see, the first names are listed alphabetically but only
    within the same length of last name. This can be fixed using the -b option, which
    treats runs of space characters like a single space:


    ```

    $ sort -b -k 2,2 participants.dat

    Prowler Desmond Lameborough TFC 13 Men

    Fleetman Fred Rundle Sportsters 217 Men

    Smith Herbert Pantington AC 123 Men

    O’Finnan Jack Fairing Track Society 45 Men

    Runnigton Kathleen Lameborough TFC 119 Ladies

    Oblomovsky Katie Rundle Sportsters 57 Ladies

    de Leaping Gwen Fairing Track Society 26 Ladies

    Longshanks Loretta Pantington AC 55 Ladies

    Jumbabout Mike Fairing Track Society 154 Men

    ```'
