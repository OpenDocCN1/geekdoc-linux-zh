    assigns the IP address 192.168.178.111 to the network interface eth0 (Ethernet).\
    \ The local network is 192.168.178.0/24—the 255.255.255.0 is a roundabout method\
    \ of writing down the subnet mask (24). The default gateway (e.g., 192.168.178.1)\
    \ is configured using the route command:\n\n```\n# route add -net default gw 192.168.178.1\n\
    ```\n\nThese settings only persist until the next reboot! The addresses of DNS\
    \ servers are usually stored in the /etc/resolv.conf file, which might look approximately\
    \ like\n\n```\n# /etc/resolv.conf\nsearch example.com\nnameserver 192.168.178.1\n\
    nameserver 192.168.178.2\n```\n\n(the “search example.com” will append “example.com”\
    \ to any names specified without a period—so if you use www, the name being actually\
    \ looked up will instead be “www.example.com”).\n\nIf your system configures networking\
    \ automatically—for instance when using WiFi—the content of /etc/resolv.conf is\
