  md: '# 14.5 Special Permissions for Directories


    to create new files. This means that you need to put all users collaborating on
    the project into a project group (a secondary group will suffice):


    ```

    # groupadd project # usermod -a -G project joe # usermod -a -G project sue Create
    new group joe into the group sue too <33333>

    ```


    Now you can create the directory and assign it to the new group. The owner and
    group are given all permissions, the others none; you also set the SGID bit:


    ```

    # cd /home/project # chgrp project /home/project # chmod u=rwx,g=srwx /home/project

    ```


    Now, if user hugo creates a file in /home/project, that file should be assigned
    to group project:


    ```

    $ id uid=1000(joe) gid=1000(joe) groups=101(project),1000(joe) $ touch /tmp/joe.txt
    Test: standard directory $ ls -l /tmp/joe.txt -rw-r--r-- 1 joe joe 0 Jan 6 17:23
    /tmp/joe.txt $ touch /home/project/joe.txt project directory $ ls -l /home/project/joe.txt
    -rw-r--r-- 1 joe project 0 Jan 6 17:24 /home/project/joe.txt

    ```


    There is just a little fly in the lointment, which you will be able to discern
    by looking closely at the final line in the example: The file does belong to the
    correct group, but other members of group project may nevertheless only read it.
    If you want all members of group project to be able to write to it as well, you
    must either apply chmod after the fact (a nuisance) or else set the umask such
    that group write permission is retained (see Exercise 14.4).


    The SGID mode only changes the system''s behaviour when new files are created.
    Existing files work just the same as everywhere else. This means, for instance,
    that a file created outside the SGID directory keeps its existing group assignment
    when moved into it (whereas on copying, the new copy would be put into the directory''s
    group).


    The chgrp program works as always in SGID directories, too: the owner of a file
    can assign it to any group he is a member of. Is the owner not a member of the
    directory''s group, he cannot put the file into that group using chgrp—he must
    create it afresh within the directory.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_192_0.png)


    Linux supports another special mode for directories, where only a file''s owner
    may delete or remove files within that directory:


    ```

    drwxrwxrwt 7 root root 1024 Apr 7 10:07 /tmp

    ```


    This t mode, the “sticky bit”, can be used to counter a problem which arises when
    public directories are in shared use: Write permission to a directory lets a user
    delete other users'' files, regardless of their access mode and owner! For example,
    the /tmp directories are common ground, and many programs create their temporary
    files there. To do so, all users have write permission to that directory. This
    implies that any user has permission to delete files there.'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'Usually, when deleting or renaming a file, the system does not consider that
    file''s access permissions. If the “sticky bit” is set on a directory, a file
    in that directory can subsequently be deleted only by its owner, the directory''s
    owner, or root. The “sticky bit” can be set or removed by specifying the symbolic
    +t and -t modes; in the octal representation it has value 1 in the same digit
    as SUID and SGID.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_193_0.png)


