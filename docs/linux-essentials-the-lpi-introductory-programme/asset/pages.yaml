- pgno: 42
  md: 'software on the distribution''s servers: The latter is in a subdirectory called
    **main**, the former in *non-free*. (There is an intermediate area called *contrib*;
    this contains software that by itself would be DFSG-free but does not work without
    other, non-free, components.)


    +   • The *Social Contract* describes the project''s goals.

    +   • The *Debian Constitution* describes the project''s organisation (see Figure
    2.2.


    At any given time there are at least three versions of Debian GNU/Linux: New or
    corrected versions of packages are put into the *unstable* branch. If, for a certain
    period of time, no grave errors have appeared in a package, it is copied to the
    *testing* branch. Every so often the content of testing is “frozen”, tested very
    thoroughly, and finally released as *stable*. A frequently-voiced criticism of
    Debian GNU/Linux is the long timespan between *stable* releases; many, however,
    consider this an advantage. The Debian project makes Debian GNU/Linux available
    for download only; media are available from third-party vendors.


    By *virtue* of its organisation, its freedom from commercial interests, and its
    clean separation of free and non-free software, Debian GNU/Linux is a sound basis
    for derivative projects. Some of the more popular ones include Knoppix (a “live
    CD” which makes it possible to test Linux on a PC without having to install it
    first), SkoleLinux (a version of Linux especially adapted to the requirements
    of schools), or commercial distributions such as Xandros. Linux, the desktop Linux
    variant used in the Munich city administration, is also based on Debian GNU/Linux.


    # 2.4.5 Ubuntu


    One of the most popular Debian derivatives is Ubuntu, which is provided by the
    British company, Canonical Ltd., founded by the South African entrepreneur Mark
    Shuttleworth. (“Ubuntu” is a word from the Zulu language and roughly means “humanity
    towards others”.) The Ubuntu goals of Ubuntu is to offer, based on Debian GNU/Linux,
    a current, capable, and easy-to-understand Linux which is updated at regular intervals.
    This is facilitated, for example, by Ubuntu being offered on only three computer
    architectures as opposed to Debian''s ten or so, and by restricting itself to
    a subset of the software offered by Debian GNU/Linux.


    Ubuntu is based on the *unstable* branch of Debian GNU/Linux and uses, for the
    most part, the same tools for software distribution, but Debian and Ubuntu software
    packages are not necessarily mutually compatible. Ubuntu is published on a fairly
    reliable six-month cycle, and every two years there is an “LTS” or “long-term
    support” version for which Canonical promises five years'' worth of updates.


    Some Ubuntu developers are also active participants in the Debian project, which
    ensures a certain degree of exchange. On the other hand, not all Debian developers
    are enthusiastic about the shortcuts Ubuntu takes every so often in the interest
    of pragmatism, where Debian might look for more comprehensive solutions even if
    these require more effort. In addition, Ubuntu does not appear to feel as indebted
    to the idea of free software as does Debian; while all of Debian''s infrastructure
    tools (such as the bug management system) are available as free software, this
    is not always the case for those of Ubuntu.


    Ubuntu not only wants to provide an attractive desktop system, but also to take
    on the more established systems like RHEL or SLES in the server space, by offering
    stable distributions with a long life cycle and good support. It is unclear how
    Canonical Ltd. intends to make money in the long run; for the time being the project
    is mostly supported out of Mark Shuttleworth''s private coffers, which are fairly
    well-filled since he sold his Internet certificate authority, Thawte, to Verisign

    …'
