- pgno: 25
  md: '# 2.1 Linux: A Success Story


    In the summer of 1991, Linus Torvalds, who was 21 years old at the time, studied
    computer science at the technical university of Helsinki, Finland.1 At the time
    he owned a new 386 PC that he wanted to experiment with, and amused himself by
    writing a terminal emulator which ran on the raw hardware without an operating
    system, and which allowed him to access the university''s Unix system. This program
    grew into the first Linux operating system kernel.


    +   Unix was already about 20 years old at that point, but was the operating system
    of choice at universities and wherever research or development were done—the scientific
    “workstations” of the time almost exclusively ran on various versions of Unix.


    +   Unix itself had started—almost like Linux—as a hobby-type project of Ken Thompson
    and Dennis Ritchie at Bell Laboratories, the American telecommunications giant
    AT&T''s research arm. It very quickly mutated into quite a useful system, and
    since it was written, for the most part, in a high-level language (C), it could
    be ported reasonably quickly to other computing platforms than the original PDP-11.
    In addition, during the 1970s AT&T was forced by a consent decree to refrain from
    selling software, so Unix was “given away” at cost, without support—and since
    the system was small and fairly straightforward, it became a popular case study
    in the operating system seminars of most universities.


    +   Towards the end of the 1970s, students of the University of California in
    Berkeley ported Unix to the VAX, the successor of the PDP-11, and introduced various
    improvements that began to be circulated as “BSD” (short for “Berkeley Software
    Distribution”). Various offshoots of BSD are still current today.


    +   To develop the first versions of Linux, Linus made use of “Minix”, a Unix-like
    operating system written for teaching purposes by Andrew S. Tanenbaum of the Free
    University of Amsterdam. Minix was deliberately kept simple, and it wasn''t freely
    available, so did not represent a serious operating system—help was obviously
    needed!2


    On 25 August 1991, Linus announced his project to the public and invited the rest
    of the world to join in. At this point the system functioned as an alternative
    operating system kernel for Minix.


    +   At that time the system didn''t yet have a proper name. Linux called it “Freax”
    (as a portmanteau word from “freak” and “Unix”); he did briefly consider “Linux”
    but rejected this as too egotistical. When Linus'' system was uploaded to the
    university''s FTP server, Linus'' colleague Ari Lemmke, who didn''t like the name
    “Freax”, took the liberty of renaming it to “Linux”. Linus later approved of the
    change.


    Linux generated considerable interest and many volunteers decided to collaborate.
    Linux 0.99, the first version licensed under the GPL (Section 2.2.3), appeared
    in December, 1992, and represented quite a grown-up operating system with complete,
    if simple, Unix functionality.


    Linux 2.0 appeared in early 1996 and introduced some important new features such
    as support for multiprocessors and the ability to load kernel modules at runtime—an
    important innovation along the road to user-friendly Linux distributions.


    +   Another new feature in Linux 2.0 was “Tux”, the penguin, as the official


    1 Linus Torvalds is an ethnic Finn (he became an American citizen in September,
    2010), but a member of the Swedish-speaking minority. This is why he has a reasonably
    pronounceable name.


    2 BSD wasn''t freely available at the time, either; Linus once said that, had
    BSD been usable at the time, he would never have started Linux.'
