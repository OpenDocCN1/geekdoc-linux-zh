- pgno: 145
  md: '# **11.1 Archival and Compression**


    “Archival” is the process of collecting many files into a single on. The typical
    application is storing a directory tree on magnetic tape—the magnetic tape drive
    appears within Linux as a device file onto which the output of the archival program
    can be written. Conversely, you can read the tape drive’s device file using a
    de-archiver and reconstruct the directory tree from the archived data. Since most
    of the relevant programs can both create and unravel archives, we discuss both
    operations under the heading of “archival”.


    “Compression” is the rewriting of data into a representation that saves space
    compared to the original. Here we are only interested in “lossless” compression,
    where it is possible to reconstruct the original in identical form from the compressed
    data.


    The alternative is to achieve a higher degree of compression by abandoning the
    requirement of being able to recreate the original perfectly. This “lossy” approach
    is taken by compression schemes like JPEG for photographs and “MPEG-1 Audio Layer
    3” (better known as “MP3”) for audio data. The secret here is to get rid of extraneous
    data; with MP3, for example, we throw out those parts of the signal that, based
    on a “psycho-acoustic model” of human hearing, the listener will not be able to
    make out, anyway, and encode the rest as efficiently as possible. JPEG works along
    similar lines.


    run-length encoding As a simple illustration, you might represent a character
    string like


    ![](img/44bdd771e9c9b1353d2401c2892b2459_145_0.png)


    more compactly as


    ![](img/44bdd771e9c9b1353d2401c2892b2459_145_1.png)


    Here, “*4B” stands for a sequence of four “B” characters. This simple approach
    is called “run-length encoding” and is found even today, for example, in fax machines
    (with refinements). “Real” compression programs like gzip or bzip2 use more sophisticated
    methods.


    While programs that combine archival and compression are used widely in the Windows
    world (PKZIP, WinZIP and so on), both steps are commonly handled separately on
    Linux and Unix. A popular approach is to archive a set of files first using tar
    before compressing the output of tar using, say, gzip—PKZIP and friends compress
    each file on its own and then collect the compressed files into a single big one.


    The advantage of this approach compared to that of PKZIP and its relatives is
    that compression can take place across several original files, which yields higher
    compression rates. However, this also counts as a disadvantage: If the compressed
    archive is damaged (e. g, due to a faulty medium or flipped bits during transmission),
    the whole archive can become unusable starting at that point.


    Naturally even on Linux nobody keeps you from first compressing your files and
    then archiving them. Unfortunately this is not as convenient as the other approach.


    Of course there are Linux implementations of compression and archival programs
    popular in the Windows world, like zip and rar.


    # **Exercises**


    +   11.1 [1] Why does the run-length encoding example use AA instead of *2A?


    +   11.2 [2] How would your represent the string “A*2B***A” using the run-length
    encoding method shown above?'
