    Another way to redirect the standard output of a command is by using “backticks”
    (`` ` ... ` ``). This is also called command substitution: The standard output
    of a command in backticks will be inserted into the command line instead of the
    command (and backticks); whatever results from the replacement will be executed.
    For example:


    ```

    ```

    $ cat dates                    Our little diary

    22/12 Get presents

    23/12 Get Christmas tree

    24/12 Christmas Eve

    $ date +%d/%m                 What’s the date?

    23/12

    $ grepdés */sm: date           What’s up?

    23/12 Get Christmas tree

    ```

    ```


    💡 A possibly more convenient syntax for “date” is "$(date)". This makes it easier
    to nest such calls. However, this syntax is only supported by modern shells such
    as bash.


    You can use <, the “less-than” sign, to redirect the standard input channel. This
    will read the content of the specified file instead of keyboard input:'
