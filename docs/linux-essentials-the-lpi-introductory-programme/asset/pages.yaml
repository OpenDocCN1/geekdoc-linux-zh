  md: '**Table 9.2: Key Strokes within bash**

    | Key Stroke | Function |

    | :--- | :--- |

    | ↑ or ↓ | Scroll through most recent commands |

    | Ctrl + r | Search command history |

    | ← or → bzw. | Move cursor within current command line |

    | Home oder Ctrl + a | Jump to the beginning of the command line |

    | End oder Ctrl + e | Jump to the end of the command line |

    | ← bzw. Del | Delete character in front of/under the cursor, respectively |

    | Ctrl + u | Swap the two characters in front of and under the cursor |

    | Ctrl + l | Clear the screen |

    | Ctrl + c | Interrupt a command |

    | Ctrl + d | End the input (for login shells: log off) |


    Conditional Execution Sometimes it is useful to make the execution of the second
    command depend on whether the first was executed correctly or not. Every Unix
    process yields a return value which states whether it was executed correctly or
    whether errors of whatever kind have occurred. In the former case, the return
    value is 0; in the latter, it is different from 0.


    You can find the return value of a child process of your shell by looking at the
    $ ? variable:


    ```

    $ bash

    $ exit 33

    exit

    $ echo $?

    33

    $ _

    Start a child shell ...

    ... and exit again immediately

    The value from our exit above

    ```


    But this really has no bearing on the following.


    With && as the “separator” between two commands (where there would otherwise be
    the semicolon), the second command is only executed when the first has exited
    successfully. To demonstrate this, we use the shell’s -c option, with which you
    can pass a command to the child shell on the command line (impressive, isn’t it?):


    ```

    $ bash -c "exit 0" && echo "Successful"

    Successful

    $ bash -c "exit 33" && echo "Successful"

    Nothing — 33 isn’t success!

    ```


    Conversely, with || as the “separator”, the second command is only executed if
    the first did not finish successfully:


    ```

    $ bash -c "exit 0" || echo "Unsuccessful"

    $ bash -c "exit 33" || echo "Unsuccessful"

    Unsuccessful

    ```


