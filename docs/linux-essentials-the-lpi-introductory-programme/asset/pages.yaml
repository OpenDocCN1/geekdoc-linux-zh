  md: '# **6.7** The matching names are, respectively


    +       (a) prog.c, prog1.c, prog2.c, progabc.c


    +       (b) prog1.c, prog2.c


    +       (c) p1.txt, p2.txt, p21.txt, p22.txt


    +       (d) p1.txt, p21.txt, p22.txt, p22.dat


    +       (e) all names


    +       (f) all names except prog (does not contain a period)


    **6.8** `"ls"` without arguments lists the content of the current directory. Directories
    in the current directory are only mentioned by name. `"ls"` with arguments, on
    the other hand (and in particular `"ls *"`—`ls` does not get to see the search
    pattern, after all) lists information about the given arguments. For directories
    this means that the *content* of the directories is listed as well.


    **6.9** The `"-i"` file (visible in the output of the first command) is interpreted
    as an option by the `ls` command. Thus it does not show up in the output of the
    second command, since `ls` with path name arguments only outputs information about
    the files specified as arguments.


    **6.10** If the asterisk matched file names starting with a dot, the recursive
    deletion command `"rm -r *"` would also apply to the `"."` entry of a directory.
    This would delete not just subdirectories of the current directory, but also the
    enclosing directory and so on.


    # **6.11** Here are the commands:


    ```

    $ cd

    $ cp /etc/services myservices

    $ mv myservices src.dat

    $ cp src.dat /tmp

    $ rm src.dat /tmp/src.dat

    ```


    **6.12** When you rename a directory, all its files and subdirectories will automatically
    be “moved” so as to be within the directory with its new name. An `-R` to `mv`
    is therefore completely unnecessary.


    **6.13** The simple-minded approach—something like `"rm -file"`—fails because
    `rm` misinterprets the file name as a sequence of options. The same goes for commands
    like `"rm .file"` or `"rm .file"`. The following methods work better:


    +   1. With `"rm ./file"`, the dash is no longer at the start of the parameter
    and thus no longer introduces an option.


    +   2. With `"rm -- .file"`, you tell `rm` that there are definitely no options
    after the `"--"` but only path names. This also works with many other programs.


    **6.14** During the replacement of the `"*"`, the `"-i"` file is picked up as
    well. Since the file names are inserted into the command line in ASCII order,
    `rm` sees a parameter list like


    $-i$ a.txt b.jpg c.dat *or whatever*


    and considers the `"-i"` the *option* `-i`, which makes it remove files only with
    confirmation. We hope that this is sufficient to get you to think things over.'
