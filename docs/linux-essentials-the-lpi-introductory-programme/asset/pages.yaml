    # ### 8.3 Reading and Writing Files


    # #### 8.3.1 Outputting and Concatenating Text Files—cat


    The cat (“concatenate”) command is really intended to join several files named
    on the command line into one. If you pass just a single file name, the content
    of that file will be written to standard output. If you do not pass a file name
    at all, cat reads its standard input—this may seem useless, but cat offers options
    to number lines, make line ends and special characters visible or compress runs
    of blank lines into one (Table 8.2).


    ![](img/44bdd771e9c9b1353d2401c2892b2459_107_0.png)


    It goes without saying that only text files lead to sensible screen output with
    cat. If you apply the command to other types of files (such as the binary file
    /bin/cat), it is more than probable—on a text terminal at least—that the shell
    prompt will consist of unreadable characters once the output is done. In this
    case you can restore the normal character set by (blindly) typing reset. If you
    redirect cat output to a file this is of course not a problem.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_107_1.png)


    The “Useless Use of cat Award” goes to people using cat where it is extraneous.
    In most cases, commands do accept filenames and don’t just read their standard
    input, so cat is not required to pass a single file to them on standard input.
    A command like “cat data.txt | grep foo” is unnecessary if you can just as well
    write “grep foo data.txt”. Even if grep could only read its standard input, “grep
    foo < data.txt” would be shorter and would not involve an additional cat process.


    # ### Exercises


    +   **8.7 [2]** How can you check whether a directory contains files with “weird”
    names (e. g., ones with spaces at the end or invisible control characters in the
    middle)?


    # #### 8.3.2 Beginning and End—head and tail


    Sometimes you are only interested in part of a file: The first few lines to check
    whether it is the right file, or, in particular with log files, the last few entries.
    The head and tail commands deliver exactly that—by default, the first ten and
    the last ten lines of every file passed as an argument, respectively (or else
    as usual the first or last ten lines of their standard input). The -n option lets
    you specify a different number of lines: “head -n 20” returns the first 20 lines
    of its standard input, “tail -n 5 data.txt” the last 5 lines of file data.txt.'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'Tradition dictates that you can specify the number *n* of desired lines directly
    as `-n`. Officially this is no longer allowed, but the Linux versions of `head`
    and `tail` still support it.


    You can use the `-c` option to specify that the count should be in bytes, not
    lines: `"head -c 20"` displays the first 20 bytes of standard input, no matter
    how many lines they occupy. If you append a `"b"`, `"k"`, or `"m"` (for `"blocks"`,
    `"kibibytes"`, and `"mebibytes"`, respectively) to the count, the count will be
    multiplied by 512, 1024, or 1048576, respectively.


    head also lets you use a minus sign: `"head -c -20"` displays all of its standard
    input but the last 20 bytes.


    By way of revenge, *tail* can do something that *head* does not support: If the
    number of lines starts with `"+"`, it displays everything *starting with* the
    given line:


    ```

    $ tail -n +3 file

    Everything from line 3

    ```


    The `tail` command also supports the important `-f` option. This makes `tail`
    wait after outputting the current end of file, to also output data that is appended
    later on. This is very useful if you want to keep an eye on some log files. If
    you pass several file names to `tail -f`, it puts a header line in front of each
    block of output lines telling what file the new data was written to.


    # Exercises


    +   8.8 [2] How would you output just the 13th line of the standard input?


    +   8.9 [3] Check out `tail -f`: Create a file and invoke `tail -f` on it. Then,
    from another window or virtual console, append something to the file using, e.g.,
    `echo >>...`, and observe the output of tail. What does it look like when tail
    is watching several files simultaneously?


    +   8.10 [3] What happens to `tail -f` if the file being observed shrinks?


    +   8.11 [3] Explain the output of the following commands:


    ```

    $ echo Hello >/tmp/hello

    $ echo "Hiya World" >/tmp/hello

    ```


    when you have started the command


    ```

    $ tail -f /tmp/hello

    ```


    in a different window after the first echo above.


    # 8.4 Data Management


    # 8.4.1 Sorted Files—*sort* and *uniq*


    The sort command lets you sort the lines of text files according to predetermined
    criteria. The default setting is ascending (from A to Z) according to the ASCII
    values¹ of the first few characters of each line. This is why special characters
    such as German umlauts are frequently sorted incorrectly. For example, the character
    code of `"Ä"` is 143, so that character ends up far beyond `"Z"` with its character
    code of 91. Even the lowercase latter `"a"` is considered `"greater than"` the
    uppercase letter `"Z"`.


    > ¹Of course ASCII only goes up to 127. What is really meant here is ASCII together
    with whatever extension for the characters with codes from 128 up is currently
    used, for example ISO-8859-1, also known as ISO-Latin-1.'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'Of course, sort can adjust itself to different languages and cultures. To sort
    according to German conventions, set one of the environment variables LANG, LC_ALL,
    or LC_COLLATE to a value such as "de", "de_DE", or "de_DE@UTF-8" (the actual value
    depends on your distribution). If you want to set this up for a single sort invocation
    only, do


    ```

    $ _ | LC_COLLATE=de_DE.UTF-8 sort

    ```


    The value of LC_ALL has precedence over the value of LC_COLLATE and that, again,
    has precedence over the value of LANG. As a side effect, German sort order causes
    the case of letters to be ignored when sorting.


    Unless you specify otherwise, the sort proceeds “lexicographically” considering
    all of the input line. That is, if the initial characters of two lines compare
    equal, the first differing character within the line governs their relative positioning.
    Of course sort can sort not just according to the whole line, but more specifically
    according to the values of certain “columns” or fields of a (conceptual) table.
    Fields are numbered starting at 1; with the “-k 2” option, the first field would
    be ignored and the second field of each line considered for sorting. If the values
    of two lines are equal in the second field, the rest of the line will be looked
    at, unless you specify the last field to be considered using something like “-k
    2,3”. Incidentally, it is permissible to specify several -k options with the same
    sort command.


    In addition, sort supports an obsolete form of position specification: Here fields
    are numbered starting at 0, the initial field is specified as “+m” and the final
    field as “-n”. To complete the differences to the modern form, the final field
    is specified “exclusively”—you give the first field that should not be taken into
    account for sorting. The examples above would, respectively, be “+1”, “+1 -3”,
    and “+1 2”.


    The space character serves as the separator between fields. If several spaces
    occur in sequence, only the first is considered a separator; the others are considered
    part of the value of the following field. Here is a little example, namely the
    list of participants for the annual marathon run of the Lameborough Track & Field
    Club. To start, we ensure that we use the system''s standard language environment
    (“POSIX”) by resetting the corresponding environment variables. (Incidentally,
    the fourth column gives a runner’s bib number.)


    ```

    $ unset LANG LC_ALL LC_COLLATE

    $ cat participants.dat

    Smith Herbert Pantington AC 123 Men

    Prowler Desmond Lameborough TFC 13 Men

    Fleetman Fred Rundale Sportsters 217 Men

    Jumpabout Mike Fairing Track Society 154 Men

    de Leaping Gwen Rundale Society 26 Ladies

    Runninton Vivian Lameborough TFC 117 Ladies

    Sweat Susan Rundale Sportsters 93 Ladies

    Runninton Kathleen Lameborough TFC 119 Ladies

    Longshanks Loretta Pantington AC 55 Ladies

    O''Finnar Jack Fairing Track Society 45 Men

    Oblomovsky Katie Rundale Sportsters 57 Ladies

    ```


    Let’s try a list sorted by last name first. This is easy in principle, since the
    last names are at the front of each line:


    ```

    $ sort participants.dat

    Fleetman Fred Rundale Sportsters 217 Men

    Jumpabout Mike Fairing Track Society 154 Men

    Longshanks Loretta Pantington AC 55 Ladies

    ```'
