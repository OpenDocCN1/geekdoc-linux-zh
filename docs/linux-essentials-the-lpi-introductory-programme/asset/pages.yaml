    **Entering and changing text** To enter new text, simply start to type inside
    the Nano window. If you make a mistake, the “backspace” key `<backspace>` will
    delete the character to the left of the cursor. Use the arrow keys to navigate
    around the text, for example to change something nearer the beginning. If you
    type something new, it will appear exactly where the cursor is positioned. The
    `Del` key removes the character under the cursor and will cause the remainder
    of the line (if there is one) to move one position to the left. Everything is
    really fairly obvious.


    Some Nano versions even support a mouse, so—given that you are running Nano on
    a graphical screen, or your textual environment can handle a mouse—you can click
    somewhere in your text to place the cursor at that point. You may have to enable
    the mouse support by pressing `Alt` + `m`.


    Nano and the mouse


    **Saving text** When you are done entering or editing your text, you can save
    it using `Ctrl` + `o` (hold down `Ctrl` while pressing `o`). Nano asks you for
    a name for the file (on the status line), which you can then enter and finish
    off with `Enter`. (You will find out more about file names in Chapter 6 at the
