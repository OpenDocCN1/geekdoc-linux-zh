  md: "# \"Escaping\" characters\n\n```\n$&;(){}[]*?!<=>\"'\n```\n\nIf you want to\
    \ use any of these characters without the shell interpreting according to its\
    \ the special meaning, you need to “escape” it. You can use the backslash \"`\\\
    `\" to escape a single special character or else single or double quotes ( \"\
    \ . . . \" , ' . . . ' ) to escape several special characters. For example:\n\n\
    ```\n$ touch 'New File'\n```\n\nDue to the quotes this command applies to a single\
    \ file called `New File`. Without quotes, two files called `New` and `File` would\
    \ have been involved.\n\n> We can't explain all the other special characters here.\
    \ Most of them will show up elsewhere in this manual – or else check the Bash\
    \ documentation.\n\n# Commands in this Chapter\n\nbash The \"Bourne-Again-Shell\"\
    , an interactive command interpreter `bash(1) 58`\n\ndate Displays the date and\
    \ time `date(1) 61`\n\necho Writes all its parameters to standard output, separated\
