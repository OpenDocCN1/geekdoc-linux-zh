  md: '# ## 13.3 Managing User Accounts and Group Information


    After a new Linux distribution has been installed, there is often just the *root*
    account for the system administrator and the pseudo-users'' accounts. Any other
    user accounts must be created first (and most distributions today will gently
    but firmly nudge the installing person to create at least one “normal” user account).
    As the administrator, it is your job to create and manage the accounts for all
    required users (real and pseudo). To facilitate this, Linux comes with several
    tools for user management. With them, this is mostly a straightforward task, but
    it is important that you understand the background.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_179_0.png)


    # ### 13.3.1 Creating User Accounts


    The procedure for creating a new user account is always the same (in principle)
    and consists of the following steps:


    +   1. You must create entries in the `/etc/passwd` (and possibly `/etc/shadow`)
    files.

    +   2. If necessary, an entry (or several) in the `/etc/group` file is necessary.

    +   3. You must create the home directory, copy a basic set of files into it,
    and transfer ownership of the lot to the new user.

    +   4. If necessary, you must enter the user in further databases, e.g., for disk
    quotas, database access privilege tables and special applications.


    All files involved in adding a new account are plain text files. You can perform
    each step manually using a text editor. However, as this is a job that is as tedious
    as it is elaborate, it behooves you to let the system help you, by means of the
    `useradd` program.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_179_1.png)


    In the simplest case, you pass useradd merely the new user''s user name. Optionally,
    you can enter various other user parameters; for unspecified parameters (typically
    the UID, “reasonable” default values will be chosen automatically. On request,
    the user''s home directory will be created and endowed with a basic set of files
    that the program takes from the `/etc/skel` directory. The useradd command''s
    syntax is:


    ```

    ```

    useradd [ {options} ] (user name)

    ```

    ```


    The following options (among others) are available:


    +   - `-c comment` GECOS field entry

    +   - `-d home directory` If this option is missing, `/home/(user name)` is assumed

    +   - `-e date` On this date the account will be deactivated automatically (format
    “YYYY-MM-DD”)

    +   - `-g group` The new user''s primary group (name or GID). This group must
    exist.

    +   - `-G group[,group]...` Supplementary groups (names or GIDs). These groups
    must also exist.

    +   - `-s shell` The new user''s login shell

    +   - `-u UID` The new user''s numerical UID. This UID must not be already in
    use, unless the “-o” option is given

    +   - `-m` Creates the home directory and copies the basic set of files to it.
    These files come from `/etc/skel`, unless a different directory was named using
    “-k (directory)”.


    For instance, the'
