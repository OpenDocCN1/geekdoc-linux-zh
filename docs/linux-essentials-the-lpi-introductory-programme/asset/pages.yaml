    **Table 6.2:** Some `ls` options

    | Option | Result |

    | --- | --- |

    | -a or --all | Displays hidden files as well |

    | -i or --inode | Displays the unique file number (inode number) |

    | -l or --format=long | Displays extra information |

    | -o or --no-color | Omits color-coding the output |

    | -p or -F | Marks file type by adding a special character |

    | -r or --reverse | Reverses sort order |

    | -R or --recursive | Recurses into subdirectories (DOS: DIR/S) |

    | -S or --sort=size | Sorts files by size (longest first) |

    | -t or --sort=time | Sorts files by modification time (newest first) |

    | -X or --sort=extension | Sorts files by extension ("file type") |


    # **6.2.2 Listing Files and Directories—ls**


    To find one’s way around the directory tree, it is important to be able to find
    out which files and directories are located within a directory. The `ls` ("list")
    command does this.


    Without options, this information is output as a multi-column table sorted by
    file name. With color screens being the norm rather than the exception today,
    it has become customary to display the names of files of different types in various
    colours. (We have not talked about file types yet; this topic will be mentioned
    in Chapter 10).


    Thankfully, by now most distributions have agreed about the colours to use. Table
    6.1 shows the most common assignment.


    On monochrome monitors—which can still be found—the options -F or -p recommend
    themselves. These will cause special characters to be appended to the file names
    according to the file’s type. A subset of these characters is given in Table 6.1.


    You can display hidden files (whose names begin with a dot) by giving the -a ("all")
    option. Another very useful option is -l (a lowercase "L", for "long", rather
    than the digit "1"). This displays not only the file names, but also some additional
    information about each file.


    Some Linux distributions pre-set abbreviations for some combinations of helpful
    options; the SUSE distributions, for example, use a simple l as an abbreviation
    of `ls -aF`. `11` and `la` are also abbreviations for `ls` variants.


    Here is an example of `ls` without and with `-l`:


    ```

    ```

    $ ls

    file.txt

    file2.dat

    $ ls -l

    ```

    ```'
