- pgno: 40
  md: 'Red Hat has withdrawn from its original individual-customer business (the last
    “Red Hat Linux” was published in April, 2004) and now markets a distribution for
    the professional use by companies under the name of “Red Hat Enterprise Linux”
    (RHEL). RHEL is licensed per server, although you do not pay for the software—which
    is furnished under the GPL and similar FOSS licences—but for access to timely
    updates and support in the case of problems. RHEL is mostly geared towards data
    centres and, among other things, supports (with appropriate additional tools)
    the construction of fault-tolerant “clusters”.


    “Fedora” ([http://www.fedoraproject.org](http://www.fedoraproject.org)) is a distribution,
    mostly controlled by Red Hat, which serves as a “test bed” for RHEL. New software
    and ideas are trialled in Fedora first, and whatever proves useful may show up
    in RHEL sooner or later. Unlike RHEL, Fedora is not sold but made available for
    free download instead; the project is governed by a committee whose members are
    partly elected by the developer community and partly nominated by Red Hat. (The
    committee chair is nominated by Red Hat and has veto powers.) For many Fedora
    users, the focus on current software and new ideas is part of the attraction of
    the distribution, even though this implies frequent updates. Fedora is less suitable
    for beginners and the use on servers which are supposed to be reliable.


    Since Red Hat distributes its software strictly under FOSS licences like the GPL,
    it is possible in principle to operate a system that corresponds to the current
    RHEL without paying licence fees to Red Hat. There are distributions like CentOS
    ([http://www.centos.org](http://www.centos.org)) or Scientific Linux ([http://www.scientificlinux.org](http://www.scientificlinux.org))
    which are essentially based on RHEL but remove all Red Hat branding. This means
    that you get essentially the same software but without Red Hat support.


    CentOS in particular is so close to RHEL that Red Hat is happy to sell you support
    for your CentOS machines. You don’t even need to install RHEL first.


    # ### 2.4.3 SUSE


    The German company SUSE was first incorporated 1992 as a Unix consultancy under
    the name of “Gesellschaft für Software- und System-Entwicklung” and accordingly
    spelled itself “S.u.S.E.”. One of its products was a German version of Patrick
    Volkerding’s Linux distribution, Slackware, which in turn was derived from the
    first complete Linux distribution, Softlanding Linux System or SLS. S.u.S.E. Linux
    1.0 appeared 1994 and slowly diverged from Slackware by taking on features from
    Red Hat Linux, like RPM package management or the */etc/sysconfig* file. The first
    version of S.u.S.E. Linux that no longer looked like Slackware was version 4.2
    of 1996. SUSE (the dots had disappeared at some point) soon became the leading
    German-language Linux distribution and published SUSE Linux as a “boxed set” in
    two flavours, “Personal” and “Professional”—the latter was noticeably more expensive
    and contained, among other things, more server-oriented software.


    In November, 2003, the US software company, Novell, announced its takeover of
    SuSE for 210 million dollars; the deal was concluded in January, 2004. (At this
    point the “U” was capitalised, too.) In April, 2011, Novell, including SUSE, was
    acquired by Attachmate, a company selling terminal emulation, system monitoring,
    and application integration tools and services that so far had not been notable
    within the Linux and open-source communities. Since then, Novell has continued
    to operate as two separate business units, one of which is BUSE.


    Like Red Hat, SUSE offers an “enterprise Linux”, the SUSE Linux Enterprise Server
    (SLES, [http://www.suse.com/products/server/](http://www.suse.com/products/server/)),
    which resembles RHEL in that it is published fairly infrequently and promises
    a long life cycle of'
