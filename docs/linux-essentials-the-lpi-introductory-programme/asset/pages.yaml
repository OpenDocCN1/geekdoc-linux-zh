- pgno: 189
  md: "```\nchmod [⟨options⟩] ⟨permissions⟩ ⟨name⟩ ..\n```\n\nYou can give as many\
    \ file or directory names as desired. The most important options include:\n\n\
    +   -R If a directory name is given, the permissions of files and directories\
    \ inside this directory will also be changed (and so on all the way down the tree).\n\
    \n+   **--reference=⟨name⟩** Uses the access permissions of file ⟨name⟩. In this\
    \ case no ⟨permissions⟩ must be given with the command.\n\n\U0001F4A1 You may\
    \ also specify a file's access mode “numerically” instead of “symbolically” (what\
    \ we just discussed). In practice this is very common for setting all permissions\
    \ of a file or directory at once, and works like this: The three permission triples\
    \ are represented as a three-digit octal number—the first digit describes the\
    \ owner's rights, the second those of the file's group, and the third those that\
    \ apply to “others”. Each of these digits derives from the sum of the individual\
    \ permissions, where read permission has value 4, write permission 2, and execute\
    \ permission 1. Here are a few examples for common access modes in “`ls -l`” and\
    \ octal form:\n\n```\n```rwxr-xr-x    644\n  r-x------    400\n  rwxr-xr-x   \
    \ 755```\n```\n\n\U0001F4A1 Using numerical access modes, you can only set all\
    \ permissions at once—there is no way of setting or removing individual rights\
    \ while leaving the others alone, like you can do with the “`+`” and “`-`” operators\
    \ of the symbolic representation. Hence, the command\n\n```\n```\n$ chmod 644\
    \ file\n```\n```\n\nis equivalent to the symbolic\n\n```\n```\n$ chmod u=rw,go=r\
    \ file\n```\n```\n\n# 14.2.3 Specifying File Owners and Groups—`chown` and `chgrp`\n\
    \nThe `chown` command lets you set the owner and group of a file or directory.\
    \ This command takes the desired owner's user name and/or group name and the file\
    \ or directory name the change should apply to. It is called like\n\n```\n```\n\
    chown ⟨user name⟩[:⟨group name⟩] ⟨name⟩ ..\nchown ·⟨group name⟩ ⟨name⟩ ·.\n```\n\
    ```\n\nIf both a user and group name are given, both are changed; if just a user\
    \ name is given, the group remains as it was; if a user name followed by a colon\
    \ is given, then the file is assigned to the user's primary group. If just a group\
    \ name is given (with the colon in front), the owner remains unchanged. For example:\n\
    \n```\n```\n# chown joe:devel letter.txt\n# chown www-data foo.html          \
    \    new user www-data\n# chown :devel /home/devel              new group devel\n\
    ```\n```\n\n\U0001F4A1 `chown` also supports an obsolete syntax where a dot is\
    \ used in place of the colon."
  merge: -1
