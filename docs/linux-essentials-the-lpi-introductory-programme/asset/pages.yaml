  md: 'Sorting by first name now leads to correct results using “LC_COLLATE=en GB
    sort -t: -k2,2”. It is also a lot easier to sort, e. g., by a participant’s number
    (now field 4, no matter how many spaces occur in their club’s name:


    ```

    $ sort -t: -k4 participants0.dat

    Runnington:Vivian:Lameborough TFC:117:Ladies

    Runnington:Kathleen:Lameborough TFC:119:Ladies

    Smith:Herbert:Pantington AC:123:Men

    Prowler:Desmond:Lameborough TFC:13:Men

    Jumpabout:Mike:Fairing Track Society:154:Men

    Fleetman:Fred:Rundale Sportsters:217:Men

    de Leaping:Gwen:Fairing Track Society:26:Ladies

    O’Finnam:Jack:Fairing Track Society:45:Men

    Longshanks:Loretta: Pantington AC:55:Ladies

    Oblomovsky:Katie:Rundale Sportsters:57:Ladies

    Sweat:Susan:Rundale Sportsters:93:Ladies

    ```


    Of course the “number” sort is done lexicographically, unless otherwise specified—“117”
    and “123” are put before “13”, and that in turn before “154”. This can be fixed
    by giving the -n option to force a numeric comparison:


    ```

    $ sort -t: -k4 -n participants0.dat

    de Leaping:Desmond:Lameborough TFC:13:Men

    de Leaping:Gwen:Fairing Track Society:26:Ladies

    O’Finnam:Jack:Fairing Track Society:45:Men

    Longshanks:Loretta: Pantington AC:55:Ladies

    Oblomovsky:Katie:Rundale Sportsters:57:Ladies

    Sweat:Susan:Rundale Sportsters:93:Ladies

    Runnington:Vivian:Lameborough TFC:117:Ladies

    Runnington:Kathleen:Lameborough TFC:119:Ladies

    Smith:Herbert:Pantington AC:123:Men

    Jumpabout:Mike:Fairing Track Society:154:Men

    Fleetman:Fred:Rundale Sportsters:217:Men

    ```


    These and some more important options for sort are shown in Table 8.3; studying
    the program’s documentation is well worthwhile. sort is a versatile and powerful
    command which will save you a lot of work.


    The uniq command does the important job of letting through only the first of a
    sequence of equal lines in the input (or the last, just as you prefer). What is
    considered “equal” can, as usual, be specified using options. uniq differs from
    most of the programs we have seen so far in that it does not accept an arbitrary
    number of named input files but just one; a second file name, if it is given,
    is considered the name of the desired output file (if not, standard output is
    assumed). If no file is named in the uniq call, uniq reads standard input (as
    it ought).


    uniq works best if the input lines are sorted such that all equal lines occur
    one after another. If that is not the case, it is not guaranteed that each line
    occurs only once in the output:


    ```

    $ cat uniq-test

    Hipp

    Hopp

    Hopp

    Hipp

    Hipp

    Hopp

    $ uniq uniq-test

    Hipp

    Hopp

    ```'
