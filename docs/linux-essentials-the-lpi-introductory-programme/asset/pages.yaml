  md: 'You might be bothered (and rightfully so!) by the fact that this somewhat sensitive
    information is apparently made available on a casual basis to arbitrary system
    users. If you (as the administrator) want to protect your users'' privacy somewhat
    better than you Linux distribution does by default, you can use the


    ```

    # chmod o-r /var/log/wtmp

    ```


    command to remove general read permissions from the file that last consults for
    the telltale data. Users without administrator privileges then get to see something
    like


    ```

    $ last

    last: /var/log/wtmp: Permission denied

    ```


    # 13.1.3 People and Pseudo-Users


    Besides “natural” persons—the system’s human users—the user and group concept
    is also used to allocate access rights to certain parts of the system. This means
    that, in addition to the personal accounts of the “real” users like you, there
    are further accounts that do not correspond to actual human users but are assigned
    to administrative functions internally. They define functional “roles” with their
    own accounts and groups.


    After installing Linux, you will find several such pseudo-users and groups in
    the /etc/passwd and /etc/group files. The most important role is that of the root
    user (which you know) and its eponymous group. The UID and GID of root are 0 (zero).


    root’s privileges are tied to UID 0; GID 0 does not confer any additional access
    privileges.


    Further pseudo-users belong to certain software systems (e.g., news for Usenet
    news using INN, or postfix for the Postfix mail server) or certain components
    or devices (such as printers, tape or floppy drives). You can access these accounts,
    if necessary, like other user accounts via the su command. These pseudo-users
    are helpful as file or directory owners, in order to fit the access rights tied
    to file ownership to special requirements without having to use the root account.
    The same applies to groups; the members of the disk group, for example, have block-level
    access to the system’s disks.


    # Exercises


    +   13.1 [1] How does the operating system kernel differentiate between various
    users and groups?


    +   13.2 [2] What happens if a UID is assigned to two different user names? Is
    that allowed?


    +   13.3 [1] What is a pseudo-user? Give examples!


    +   13.4 [2] (On the second reading.) Is it acceptable to assign a user to group
    disk who you would not want to trust with the root password? Why (not)?


