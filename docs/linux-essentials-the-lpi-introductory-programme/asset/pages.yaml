    How to make money with free software if anyone is allowed to change and copy the
    software? A very legitimate question. Here are a few ideas for “open-source business
    models”:


    +   * You could provide additional services such as support, documentation, or
    training for free software and get paid for that (this works very well for your
    author’s company, Linup Front GmbH, and the LPI seems to be able to make a living
    from selling Linux certification).


    +   * You could create bespoke improvements or extensions for specific customers
    and be paid for your time (even if the result of your development then becomes
    part of the generally available version. This works even for free software that
    you didn’t originally write yourself.


    Within the “traditional” model of proprietary software development, the original
    manufacturer of the software has a monopoly on changes and further development.
    As the customer of such a company, you could be in trouble if the manufacturer
    discontinues the product or disappears outright (by going bankrupt or getting
    acquired and dissolved by a competitor), because you will have gone to great trouble
    and expense to adopt a piece of software with no future. With free software, you
    can always try to find somebody to take on support in place of the original manufacturer—if
    necessary, you can get together with other users of the software who don’t want
    to be left alone, either.


    +   * If you distribute a software package, you could provide a basic version
    as FOSS and hope that this will entice enough people to buy the proprietary “full
    version” to really get things done. (The jargon expression for this is “open core”.)


    This is a two-edged sword: On the one hand, it is of course nice if there is more
    free software, but on the other hand the result is often that you need the proprietary
    version because important functionality is not available in the free version and
    it would be too much work to add that functionality independently. In this case,
    the “free” version mostly serves as a PR engine if the manufacturer wants to appear
    modern and “open-source friendly”—to “talk the talk” without “walking the walk”.


    # 2.2.2 Licences


    How does a piece of software become “free” or “open source”? We mentioned that
    certain rights—for example, the right to copy or modify a work—are reserved for
    the author of the work, but that these rights can also be passed on to others.
    This happens (if it happens) by way of a “licence”, a legal document which specifies
    the rights that the receiver of the software obtains by buying, downloading, …
    it. Copyright as such allows the buyer (or lawful downloader) of a software package
    to install that software on a computer and to start and run it. This results simply
    from the fact that the software was made available to them by the author—there
    is evidently no point in selling somebody a program that the buyer isn’t allowed
    to use¹. (Conversely, whoever gave the author money for the program has a right
    to use the program in exchange for their payment.) Other actions such as uncontrolled
    copying and distribution, or modifying the program, are explicitly forbidden by
    copyright, and if the original author wants people to be allowed to do these things
    they must be written into the licence.'
