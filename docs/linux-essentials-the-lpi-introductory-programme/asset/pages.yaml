- pgno: 133
  md: "# **Table 10.1: Linux file types**\n\n| Type             | `ls -l` | `ls -F`\
    \ | Create using ... |\n|----------------|---------|---------|----------------|\n\
    | plain file     | -       | name    | diverse programs |\n| directory      |\
    \ d       | name/   | mkdir          |\n| symbolic link  | l       | name@   |\
    \ ln -s          |\n| device file    | b or c  | name    | mknod          |\n\
    | FIFO (*named pipe*) | p | name| | mkfifo         |\n| Unix-domain socket | s\
    \   | name=   | no command       |\n\n# ## 10.1 Terms\n\nGenerally speaking, a\
    \ **file** is a self-contained collection of data. There is no restriction on\
    \ the type of the data within the file; a file can be a text of a few letters\
    \ or a multi-megabyte archive containing a user's complete life works. Files do\
    \ not need to contain plain text. Images, sounds, executable programs and lots\
    \ of other things can be placed on a storage medium as files. To guess at the\
    \ type of data contained in a file you can use the `file` command:\n\n```\n```\n\
    $ file /bin/ls /usr/bin/groups /etc/passwd\n/bin/ls:\t\t\tELF 32-bit LSB executable,\
    \ Intel 80386,>\n\t\t\t< version 1 (SYSV), for GNU/Linux 2.4.1,>\n\t\t\t< dynamically\
    \ linked (uses shared libs), for GNU/Linux 2.4.1, stripped\n/usr/bin/groups:\t\
    Bourne shell script text executable\n/etc/passwd:\t\tASCII text\n```\n```\n\n\
    `file` guesses the type of a file based on rules in the `/usr/share/file` directory.\
    \ `/usr/share/file/magic` contains a clear-text version of the rules. You can\
    \ define your own rules by putting them into the `/etc/Magic` file. Check `magic(5)`\
    \ for details.\n\nTo function properly, a Linux system normally requires several\
    \ thousand different files. Added to that are the many files created and owned\
    \ by the system's various users.\n\nA **file system** determines the method of\
    \ arranging and managing data on a storage medium. A hard disk basically stores\
    \ bytes that the system must be able to find again somehow—and as efficiently\
    \ and flexibly as possible at that, even for very huge files. The details of file\
    \ system operation may differ (Linux knows lots of different file systems, such\
    \ as ext2, ext3, ext4, ReiserFS, XFS, JFS, btrfs, ...) but what is presented to\
    \ the user is largely the same: a tree-structured hierarchy of file and directory\
    \ names with files of different types. (See also Chapter 6.)\n\nIn the Linux community,\
    \ the term “file system” carries several meanings. In addition to the meaning\
    \ presented here—“method of arranging bytes on a medium”—, a file system is often\
    \ considered what we have been calling a “directory tree”. In addition, a specific\
    \ medium (hard disk partition, USB key, ...) together with the data on it is often\
    \ called a “file system”—in the sense that we say, for example, that hard links\
    \ (Section 6.4.2) do not work “across file system boundaries”, that is, between\
    \ two different partitions on hard disk or between the hard disk and a USB key.\n\
    \n# ## 10.2 File Types\n\nLinux systems subscribe to the basic premise “Everything\
    \ is a file”. This may seem confusing at first, but is a very useful concept.\
    \ Six file types may be distinguished in principle:"
