  md: 'RPM-based system such as RHEL, Fedora, or openSUSE you can display a list of
    all installed packages using the


    ```

    $ rpm --query --all

    "...qa" would do

    ```


    command, while a Debian-based system would require the


    ```

    $ dpkg --list

    "...l" would do

    ```


    command instead.


    The package databases themselves are usually found below /var/lib; on Debian-like
    systems within /var/lib/dpkg (/var/cache/apt contains the tables of contents of
    repository servers as well as any downloaded package files), and within /var/lib/rpm
    on RPM-based systems.


    Today, programs such as *dpkg* and *rpm* form the “foundation” of a package management
    system. Administrators prefer more convenient tools that build on these base programs
    and include, for example, easy access to package repositories and the automatic
    resolution of dependencies between packages. In the Debian world, these include
    “Aptitude” and “Synaptic”, while, on the RPM side of things, Red Hat relies on
    a program called YUM and SUSE on one called “Zypper” (even though package management
    has also been integrated into the general administration tool, YaST).


    Some of these tools are even independent of the underlying package management
    system. “PackageKit”, for example, can not only use either Debian or RPM package
    management, but also, under controlled circumstances, allow normal users without
    administrator privileges to install or update packages.


