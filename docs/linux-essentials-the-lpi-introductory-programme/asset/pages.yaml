    ).*\\<\\1\\>' frog.txt\n```\n\nWe need egrep for the back reference. The word\
    \ brackets are also required (try it without them!.)\n\n8.1 A (probable) explanation\
    \ is that the ls program works roughly like this:\n\n```\nRead directory information\
    \ to list l;\nif (option -u not specified) {\n    Sort the entries of l;\n}\n\
    Write l to standard output;\n```\n\nThat is, everything is being read, then sorted\
    \ (or not), and then output.\n\nThe other explanation is that, at the time the\
    \ file list entry is being read, there has not in fact been anything written to\
    \ the file to begin with. For efficiency, most file-writing programs buffer their\
    \ output internally and only call upon the operating system to write to the file\
    \ if a substantial amount of data has been collected (e. g. 8192 bytes). This\
    \ can be observed with commands that produce very much output relatively slowly;\
    \ the output file will grow by 8192 bytes at a time.\n\n8.2 When ls writes to\
    \ the screen (or, generally, a “screen-like” device), it formats the output differently\
    \ from when it writes to a “real” file: It tries to display several file names\
    \ on the same line if the file names' length permits, and can also colour the\
    \ file names according to their type. When output is redirected to a “real” file,\
    \ just the names will be output one per line, with no formatting.\n\nAt first\
    \ glance this seems to contradict the claim that programs do not know whether\
    \ their output goes to the screen or elsewhere. This claim is correct in the normal\
    \ case, but if a program is seriously interested in whether its output goes to\
    \ a screen-like device (a “terminal”) it can ask the system. In the case of ls,\
    \ the reasoning behind this is that terminal output is usually looked at by people\
    \ who deserve as much information as possible. Redirected output, on the other\
    \ hand, is processed by other programs and should therefore be simple; hence the\
    \ limitation to one file name per line and the omission of colors, which must\
    \ be set up using terminal control characters which would “pollute” the output.\n\
    \n8.3 The shell arranges for the output redirection before the command is invoked.\
    \ Therefore the command sees only an empty input file, which usually does not\
    \ lead to the desired result.\n\n8.4 The file is read from the beginning, and\
    \ all that is read is appended to the file at the same time, so that it grows\
    \ until it takes up all the free space on the disk."
