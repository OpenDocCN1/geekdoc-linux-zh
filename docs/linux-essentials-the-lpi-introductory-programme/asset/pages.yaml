    # 3.2.2 Browsers


    One of the most important programs on contemporary computers is the web browser.
    Fortunately, the most popular browsers are open-source programs, and Firefox or
    Google Chrome are available for Linux just as well as for Windows or OS X. (Your
    distribution probably doesn’t offer Google Chrome but the true open-source variant,
    Chromium, but that isn’t a big difference.) Look in your application menu for
    an entry like “Internet”, where you ought to find a browser (among other things).


    Due to trademark concerns, on Debian GNU/Linux systems and various derivatives
    the Firefox browser is called “Iceweasel” instead (clever pun, eh?). This is because
    the Mozilla Foundation, the producer of Firefox, allows the distribution of precompiled
    versions of the browser under the name of “Firefox” only if the code corresponds
    to the ‘official’ version. Since the Debian project on the one hand reserves the
    right to repair security problems on its own authority, and on the other hand
    takes copyright and trademarks very seriously, the name had to be changed. (Other
    distributions stay with the official version or don’t look as closely at the naming
    issue.)


    # 3.2.3 Terminals and Shells


    Even within a graphical Linux environment it is often convenient to access a “terminal
    window” where you can enter textual commands in a “shell” (the remainder of this
    manual mostly talks about shell commands, so you are likely to need this).


    Fortunately, on most Linux desktop environments a terminal window is only a few
    mouse clicks away. In KDE on Debian GNU/Linux, for example, there is an entry
    called “Konsole (Terminal)” within the start menu under “System”, which will open
    a convenient program running a shell that will accept and execute textual commands.
    Similar methods are available on other desktop environments and distributions.


    # Exercises


    +   3.3 [12] Which graphical environment (if any) is installed on your computer?
    Look around. Open a file manager and figure out what happens if you right-click
    on a file or directory icon. What happens if you right-click on the empty window
    background (between icons)? How do you move a file from one directory to another?
    How do you create a new file or directory? How do you rename a file?


    +   3.4 [2] Which web browser is installed on your computer? Are there several?
    Try starting the browser (or browsers) and make sure they are working.


    +   3.5 [12] Open a terminal window and close it again. Does your terminal window
    program support several sessions within the same window (possibly using subwindows
    with “tabs”)?


    # 3.3 Creating and Modifying Text Files


    No matter whether you are writing scripts or programs, editing configuration files
    as the system administrator, or simply jot down a shopping list: Linux is at its
    best when modifying text files. Hence, one of your first acts as a new Linux user
    ought to be learning how to create and edit text files. The tool of choice for
    this is a text'
