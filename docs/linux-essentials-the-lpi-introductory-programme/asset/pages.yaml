    older members of our audience) and started appearing in offices, too. The first
    IBM PC was introduced in 1981, and Apple marketed the first “Mac-intosh” in 1984.
    The rest, as they say, is history – but one should not forget that the world of
    computers does not consist of PCs and Macs only. The giant, hall- filling computers
    of yore are still around – even though they tend to get rarer and often really
    consist of large groups of PCs that are quite closely related to the PCs on our
    tables and which cooperate. However, the principle hasn’t changed from Howard
    Aiken’s time: Computers are still devices that automatically process data according
    to changeable programs which may contain conditions and loops. And things are
    likely to stay that way.


