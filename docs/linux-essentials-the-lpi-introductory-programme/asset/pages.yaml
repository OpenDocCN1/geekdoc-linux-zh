    \ `bash(1) 61`\n\n# Summary\n\n+   • The shell reads user commands and executes\
    \ them.\n+   \n+   • Most shells have programming language features and support\
    \ shell scripts containing pre-cooked command sequences.\n+   \n+   • Commands\
    \ may have options and arguments. Options determine *how* the command operates,\
    \ and arguments determine what it operates *on*.\n+   \n+   • Shells differentiate\
