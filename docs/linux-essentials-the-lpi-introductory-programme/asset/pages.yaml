- pgno: 124
  md: '**Command Editor** You can edit command lines like in a simple text editor.
    Hence, you can move the cursor around in the input line or delete or add characters
    arbitrarily before finishing the input using the return key. The behaviour of
    this editor can be adapted to that of the most popular editors on Linux (Chapter
    3) using the `set -o vi` and `set -o emacs` commands.


    **Aborting Commands** With so many Linux commands around, it is easy to conf-use
    a name or pass a wrong parameter. Therefore you can abort a command while it is
    being executed. You simply need to press the <kbd>Ctrl</kbd>+<kbd>C</kbd> keys
    at the same time.


    **The History** The shell remembers ever so many of your most recent commands
    as part of the “history”, and you can move through this list using the <kbd>↑</kbd>
    and <kbd>↓</kbd> cursor keys. If you find a previous command that you like you
    can either re-execute it unchanged using <kbd>↵</kbd>, or else edit it as described
    above. You can search the list “incrementally” using <kbd>Ctrl</kbd>+<kbd>R</kbd>
    – simply type a sequence of characters, and the shell shows you the most recently
    executed command containing this sequence. The longer your sequence, the more
    precise the search.


    > 💡 When you log out of the system, the shell stores the history in the hidden
    file `~/.bash_history` and makes it available again after your next login. (You
    may use a different file name by setting the HISTFILE variable to the name in
    question.)


    > 💡 A consequence of the fact that the history is stored in a “plain” file is
    that you can edit it using a text editor (Chapter 3 tells you how). So in case
    you accidentally enter your password on the command line, you can (and should!)
    remove it from the history manually—in particular, if your system is one of the
    more freewheeling ones where home directories are visible to anybody.


    **Autocompletion** A massive convenience is bash’s ability to automatically com-plete
    command and file names. If you hit the <kbd>Tab</kbd> key, the shell completes
    an incomplete input if the continuation can be identified uniquely. For the first
    word of a command, bash considers all executable programs, within the rest of
    the com-mand line all the files in the current or specified directory. If several
    commands or files exist whose names start out equal, the shell completes the name
    as far as possible and then signals acoustically that the command or file name
    may still be incomplete. Another <kbd>Tab</kbd> press then lists the remaining
    possibilities.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_124_0.png)


    > 💡 It is possible to adapt the shell’s completion mechanism to specific pro-grams.
    For example, on the command line of a FTP client it might offer the names of recently
    visited FTP servers in place of file names. Check the bash documentation for details.


    Table 9.2 gives an overview of the most important key strokes within bash.


    **Multiple Commands On One Line** You are perfectly free to enter several com-mands
    on the same input line. You merely need to separate them using a semi-colon:


    ```

    ```

    $ echo Today is; date

    Today is

    Fri  5 Dec 12:12:47 CET 2008

    ```

    ```


    In this instance the second command will be executed once the first is done.'
