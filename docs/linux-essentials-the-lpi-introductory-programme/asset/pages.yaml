- pgno: 98
  md: 'Finally some examples for `grep`. The `frog.txt` file contains the Brothers
    Grimm fairytale of the Frog King (see appendix B). All lines containing the character
    sequence `frog` can be easily found as follows:


    ```

    ```

    $ grep frog frog.txt

    frog stretching forth its big, ugly head from the water. »Ah, old

    »Be quiet, and do not weep,« answered the frog, »I can help you, but

    «Whatever you will have, dear frog,« said she, »My clothes, my pearls

    <<<<<<

    ```

    ```


    To find all lines containing exactly the word "*frog*" (and not combinations like
    "*bullfrog*" or "*frogs*pawn*"), you need the word bracket extension:


    ```

    ```

    $ grep \<frog\> frog.txt

    frog stretching forth its big, ugly head from the water. »Ah, old

    <<<<<

    ```

    ```


    (it turns out that this does not in fact make a difference in the English translation).
    It is as simple to find all lines *beginning* with "*frog*":


    ```

    ```

    $ grep ^frog frog.txt

    frog stretching forth its big, ugly head from the water. »Ah, old

    frog, that he had caused three iron bands to be laid round his heart,

    ```

    ```


    A different example: The file `/usr/share/dict/words` contains a list of English
    words (frequently called the "dictionary")². We''re interested in all words containing
    three or more "*a*"s:


    ```

    ```

    $ grep -n "a.*a.*a" /usr/share/dict/words

    8:aardvark

    21:abaca

    22:abacate

    <<<<<< .... 7030 more words ...

    234831:zygomatacauricularis

    234832:zygomatocofacial

    234834:zygomatoaxillary

    ```

    ```


    (in order: an African animal (*Orycteropus afer*), a banana plant used for fibre
    (*Musa textilis*), the Brazilian name for the avocado (*Persea sp.*), a facial
    muscle and two adjectives from the same—medical—area of interest.)


    With more complicated regular expressions, it can quickly become unclear why `grep`
    outputs one line but not another. This can be mitigated to a certain extent by
    using the `--color` option, which displays the matching part(s) in a file in a
    particular colour:


    ```

    ```

    $ grep --color root /etc/passwd

    root:x:0:0:root:/root:/bin/bash

    ```

    ```


    A command like `export GREP_OPTIONS=''--color=auto''` (for example, in `~/.profile`)
    enables this option on a permanent basis; the `auto` argument suppresses colour
    output if the output is sent to a pipe or file.


    # Exercises


    +   * 7.1 [2] Are the `?` and `+` regular expressions operators really necessary?


    ²The size of the dictionary may vary wildly depending on the distribution.'
