    # 6.4 Handling Files


    # 6.4.1 Copying, Moving and Deleting—cp and Friends


    Copying files  You can copy arbitrary files using the cp (“copy”) command. There
    are two basic approaches:

    1: 1 copy If you tell cp the source and target file names (two arguments), then
    a 1:1 copy of the content of the source file will be placed in the target file.
    Normally cp does not ask whether it should overwrite the target file if it already
    exists, but just does it—caution (or the -i option) is called for here.

    You can also give a target directory name instead of a target file name. The source
    file will then be copied to that directory, keeping its old name.


    ```

    $ cp list list2

    $ cp /etc/passwd .

    $ ls -l

    -rw-r-r-- 1 joe users 2500 Oct 4 11:11 list

    -rw-r-r-r-- 1 joe users 2500 Oct 4 11:25 list2

    -rw-r-r-r-- 1 joe users 8765 Oct 4 11:26 passwd

    ```


    In this example, we first created an exact copy of file list under the name list2.
    After that, we copied the /etc/passwd file to the current directory (represented
    by the dot as a target directory name). The most important cp options are listed
    in Table 6.3.


    List of source files Instead of a single source file, a longer list of source
    files (or a shell wildcard pattern) is allowed. However, this way it is not possible
    to copy a file to a different name, but only to a different directory. While in
    DOS it is possible to use “COPY *.TXT *.BAK” to make a backup copy of every TXT
    file to a file with the same name and a BAK suffix, the Linux command “cp *.txt
    *.bak” usually fails with an error message.'
