    # Summary


    +   Files are self-contained collections of data stored under a name. Linux uses
    the “file” abstraction also for devices and other objects. The method of arranging
    data and administrative information on a disk is called a file system. The same
    term covers the complete tree-structured hierarchy of directories and files in
    the system or a specific storage medium together with the data on it. Linux file
    systems contain plain files, directories, symbolic links, device files (two kinds),
    FIFOs, and Unix-domain sockets. The Filesystem Hierarchy Standard (FHS) describes
    the meaning of the most important directories in a Linux system and is adhered
    to by most Linux distributions.'
