- pgno: 122
  md: "# **9.3  Command Types – Reloaded**\n\nOne application of shell variables is\
    \ controlling the shell itself. Here’s another example: As we discussed in Chapter\
    \ 4, the shell distinguishes internal and external commands. External commands\
    \ correspond to executable programs, which the shell looks for in the directories\
    \ that make up the value of the *PATH* environment variable. Here is a typical\
    \ value for *PATH*:\n\n```\n$ echo $PATH\n/home/joe/bin:/usr/local/bin:/usr/bin:/bin:/usr/games\n\
    ```\n\nIndividual directories are separated in the list by colons, therefore the\
    \ list in the example consists of five directories. If you enter a command like\n\
    \n```\n$ ls\n```\n\nthe shell knows that this isn’t an internal command (it knows\
    \ its internal commands) and thus begins to search the directories in *PATH*,\
    \ starting with the leftmost directory. In particular, it checks whether the following\
    \ files exist:\n\n```\n/home/joe/bin/ls\n    None ...\n/usr/local/bin/ls\n   \
    \ Still no luck ...\n/usr/bin/ls\n    Again no luck ...\n/bin/ls\n    Gotcha!\n\
    The directory /usr/games is not checked.\n```\n\nThis implies that the */bin/ls*\
    \ file will be used to execute the *ls* command.\n\n![](img/44bdd771e9c9b1353d2401c2892b2459_122_0.png)\n\
    \nOf course this search is a fairly involved process, which is why the shell prepares\
    \ for the future: If it has once identified the */bin/ls* file as the implementation\
    \ of the *ls* command, it remembers this correspondence for the time being. This\
    \ process is called “hashing”, and you can see that it did take place by applying\
    \ *type* to the *ls* command.\n\n```\n$ type ls\nls is hashed (/bin/ls)\n```\n\
    \n![](img/44bdd771e9c9b1353d2401c2892b2459_122_1.png)\n\nThe *hash* command tells\
    \ you which commands your bash has “hashed” and how often they have been invoked\
    \ in the meantime. With “*hash -r*” you can delete the shell’s complete hashing\
    \ memory. There are a few other options which you can look up in the bash manual\
    \ or find out about using “*help hash*”.\n\n![](img/44bdd771e9c9b1353d2401c2892b2459_122_2.png)\n\
    \nStrictly speaking, the *PATH* variable does not even need to be an environment\
    \ variable—for the current shell a shell variable would do just fine (see Exercise\
    \ 9.5). However it is convenient to define it as an environment variable so the\
    \ shell’s child processes (often also shells) use the desired value.\n\nIf you\
    \ want to find out exactly which program the shell uses for a given external command,\
    \ you can use the *which* command:\n\n```\n$ which grep\n/bin/grep\n```\n\nwhich\
    \ uses the same method as the shell—it starts at the first directory in *PATH*\
    \ and checks whether the directory in question contains an executable file with\
    \ the same name as the desired command."
