- pgno: 27
  md: 'In July, 2011, Linus summarily declared the version being prepared, 2.6.40,
    “Linux 3.0” — purportedly to simplify the numbering, since there were no particularly
    notable improvements.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_27_0.png)


    Nowadays release candidates are called 3.2-rc1 and so on, and the versions with
    fixes after the original release are called 3.1.1, 3.1.2, ...


    The “Linux” project is by no means finished today. Linux is constantly being extended
    and improved by hundreds of programmers throughout the world, who serve several
    millions of satisfied private and commercial users. Neither can it be said that
    the system is “only” being developed by students and other amateurs — many people
    working on the Linux kernel have important positions within the computer industry
    and number among the most respected professional developers around. It can be
    claimed with some justification that Linux is the operating system with the most
    versatile hardware support in existence, not only judging by the variety of platforms
    it runs on (including smartphones and giant mainframes), but also by the availability
    of hardware drivers for, e.g., the Intel PC platform. Linux also serves as a research
    and development vehicle for new operating system ideas in industry and academia;
    it is without doubt one of the most innovative operating systems available today.


    +   * Virtualisation

    +   * cloud computing


    The versatility of Linux also makes it the operating system of choice for applications
    like virtualisation and “cloud computing”. Virtualisation makes it possible to
    simulate, on a single actual (“physical”) computer, several to many “virtual”
    computers which use their own operating system and look like real computers to
    programs running on them. This leads to a more efficient use of resources and
    to greater flexibility: The common virtualisation infrastructures make it possible
    to “migrate” virtual machines very quickly from one physical machine to another,
    and this lets you as the operator of such an infrastructure react very conveniently
    to load situations or malfunctions. Based on this, cloud computing is the idea
    of providing computing power “on demand” in order to allow companies to forgo
    running large computing centres that are only used to a full extent during short
    periods of peak demand while mostly costing money otherwise. Cloud computing providers
    allow their customers to use virtual machines through the Internet, charging them
    based on actual use, and that can lead to sizeable savings compared to maintaining
    a “real” computing centre, especially when one considers that you as a customer
    would otherwise have to bear not just the initial construction outlay, but also
    the personnel, materiel and energy expenses involved in running a computing centre
    24/7.


