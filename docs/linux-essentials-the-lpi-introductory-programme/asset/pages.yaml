    \ such as\n\n```\n```\n$ type echo\necho is a shell builtin\n$ type date\ndate\
    \ is /bin/date\n```\n```\n\n(`echo` is an interesting command which simply outputs\
    \ its parameters:\n\n```\n```\n$ echo Thou hast it now, king, Cawdor, Glamis,\
