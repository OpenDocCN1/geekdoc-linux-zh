    # # Preface


    Linux Essentials is a new certification by the Linux Professional Institute (LPI)
    which is aimed especially at schools and universities in order to introduce children
    and young adults to Linux. The Linux Essentials certificate is slated to define
    the basic knowledge necessary to use a Linux computer productively, and through
    a corresponding education programme aid young people and adults new to the open
    source community in understanding Linux and open-source software in the context
    of the ITC industry. See appendix C for more information about the Linux Essentials
    certificate.


    With this training manual, Linup Front GmbH introduces the first comprehensive
    documentation for Linux Essentials exam preparation. The manual presents the requisite
    knowledge extensively and with many practical examples and thus provides candidates,
    but also Linux newcomers in general, with a solid foundation for using and understanding
    the free Linux operating system as well as for attaining in-depth knowledge about
    running and administering Linux. In addition to a detailed introduction to the
    background of Linux and free/open-source software, we explain the most important
    Linux concepts and tools such as the shell, how to handle files and scripts, and
    the file system structure. Insights into system administration, user and permission
    management and Linux as a networking client round off the presentation.


