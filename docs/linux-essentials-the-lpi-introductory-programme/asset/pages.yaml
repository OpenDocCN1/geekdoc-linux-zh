  md: 'This example lists all names that either refer to directories or that begin
    with "A" or both.


    # Actions


    As mentioned before, the search results can be displayed on the screen using the
    *-print* option. In addition to this, there are two options, *-exec* and *-ok*,
    which execute commands incorporating the file names. The single difference between
    *-ok* and *-exec* is that *-ok* asks the user for confirmation before actually
    executing the command; with *-exec*, this is tacitly assumed. We will restrict
    ourselves to discussing *-exec*.


    There are some general rules governing the *-exec* option:


    +   • The command following *-exec* must be terminated with a semicolon (";").
    Since the semicolon is a special character in most shells, it must be escaped
    (e.g., as "\;" or using quotes) in order to make it visible to *find*.

    +   • Two braces ("{}") within the command are replaced by the file name that
    was found. It is best to enclose the braces in quotes to avoid problems with spaces
    in file names.


    For example:


    ```

    $ find .. -user joe -exec ls -l ''{}'' \;

    -rw-r--r-- 1 joe users 4711 Oct 4 11:11 file.txt

    $ _

    ```


    This example searches for all files within the current directory (and below) belonging
    to user test, and executes the "ls -l" command for each of them. The following
    makes more sense:


    ```

    $ find .. -atime +13 -exec rm -i ''{}'' \;

    ```


    This interactively deletes all files within the current directory (and below)
    that have not been accessed for two weeks.


    Sometimes—say, in the last example above—it is very inefficient to use *-exec*
    to start a new process for every single file name found. In this case, the *xargs*
    command, which collects as many file names as possible before actually executing
    a command, can come in useful:


    ```

    $ find .. -atime +13 | xargs -r rm -i

    ```


    *xargs* reads its standard input up to a (configurable) maximum of characters
    or lines and uses this material as arguments for the specified command (here *rm*).
    On input, arguments are separated by space characters (which can be escaped using
    quotes or "\") or newlines. The command is invoked as often as necessary to exhaust
    the input. The *-r* option ensures that *rm* is executed only if *find* actually
    sends a file name; otherwise it would be executed at least once.


    Weird filenames can get the *find*/*xargs* combination in trouble, for example
    ones that contain spaces or, indeed, newlines which may be mistaken as separators.
    The silver bullet consists of using the "*-print0*" option to *find*, which outputs
    the file names just as "*-print*" does, but uses null bytes to separate them instead
    of newlines. Since the null byte is not a valid character in path names, confusion
    is no longer possible. *xargs* must be invoked using the "*-0*" option to understand
    this kind of input:


    ```

    $ find .. -atime +13 -print0 | xargs -0r rm -i

    ```'
