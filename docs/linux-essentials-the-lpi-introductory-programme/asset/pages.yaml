    # netstat


    The netstat command is a kind of Swiss army knife which provides all sorts of
    information about your computer and its network connection. If you just execute


    ```

    $ netstat

    ```


    you get a list of all active connections. This includes not only TCP connection,
    but also local connections via Unix domain sockets, which are as stilingly voluminous
    as they are utterly boring. It is more interesting to use something like


    ```

    $ netstat -tl

    Active Internet connections (only servers)

    Proto Recv-Q Send-Q Local Address  Foreign Address  State

    tcp        0      0 ceol:domain       *:*               LISTEN

    tcp        0      0 ceol-eth.fri:domain *:*             LISTEN

    tcp        0      0 *:::ssh           *:*               LISTEN

    tcp        0      0 *:::ipp           *:*               LISTEN

    tcp        0      0 *:::postgresql    *:*               LISTEN

    tcp        0      0 ceol:smtp         *:*               LISTEN

    ```


    to obtain a list of TCP ports where services are listening for incoming connections
    on this computer.


    TCP and UDP use "ports" to allow the same computer to offer or access several
    services at the same time. Many protocols use fixed port numbers—a list is in
    the /etc/services file.


    This example output tells you that, on the address ceol, the computer provides
    a DNS server (service domain), a CUPS server for printing (service ipp) and a
    mail server (service smtp). It even offers the ssh service (secure shell) on all
    configured addresses.


    "netstat -tl" is an important troubleshooting tool in connection with network
    services. If a service does not appear here but you think it actually ought to,
    that indicates that something is wrong with its configuration—possibly it does
    not use the correct address/port, or something went catastrophically wrong when
    the service was started so it is not running at all.


    The "-u" option in place of "-t" displays the UDP-based services, and "-p" will
    also display the name and PID of the process providing the service. The latter
    feature is only available if you invoke the command as the root user.


    The "-n" option will display everything with IP addresses and port numbers instead
    of names. This is sometimes more revealing, at least as long as you have a working
    knowledge of the port numbers.


    ```

    $ netstat -tln

    Active Internet connections (only servers)

    Proto Recv-Q Send-Q Local Address  Foreign Address  State

    ```'
