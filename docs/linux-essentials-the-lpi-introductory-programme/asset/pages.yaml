  md: '# 9.1  Simple Commands: `sleep`, `echo`, and `date`


    To give you some tools for experiments, we shall now explain some very simple
    commands:


    **sleep** This command does nothing for the number of seconds specified as the
    argument. You can use it if you want your shell to take a little break:


    ```

    ```

    $ sleep 10

    Nothing happens for approximately 10 seconds

    $ _

    ```

    ```


    **echo** The command `echo` outputs its arguments (and nothing else), separated
    by spaces. It is still interesting and useful, since the shell replaces variable
    references (see Section 9.2) and similar things first:


    ```

    ```

    $ p=Planet

    $ echo Hello $p

    Hello Planet

    $ echo Hello ${p}oid

    Hello Planetoid

    ```

    ```


    (The second `echo` illustrates what to do if you want to append something directly
    to the value of a variable.)


    > If `echo` is called with the `-n` option, it does not write a line terminator
    at the end of its output:


    ```

    ```

    $ echo -n Hello

    Hello_

    ```

    ```


    **date** The `date` command displays the current date and time. You have considerable
    leeway in determining the format of the output—call “`date --help`”, or read the
    online documentation using “`man date`”.


    > (When reading through this manual for the second time:) In particular, `date`
    serves as a world clock, if you first set the `TZ` environment variable to the
    name of a time zone or important city (usually capital):


    ```

    ```

    $ date

    Thu Oct  5 14:26:07 CEST 2006

    $ export TZ=Asia/Tokyo

    $ date

    Tue Oct  5 21:26:19 JST 2006

    $ unset TZ

    ```

    ```


    You can find out about valid time zone and city names by rooting around in `/usr/share/zoneinfo`.


    While every user is allowed to read the system time, only the system administrator
    or root may change the system time using the `date` command and an argument of
    the form `MMDDhhmm`, where *MM* is the calendar month, *DD* the calendar day,
    *hh* the hour, and *mm* the minute. You can optionally add two digits the year
    (plus possibly another two for the century) and the seconds (separated with a
    dot), which should, however, prove necessary only in very rare cases.'
  merge: -1
  img_proc: true
