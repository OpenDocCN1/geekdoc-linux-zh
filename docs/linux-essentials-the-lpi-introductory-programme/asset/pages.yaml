  md: '![](img/44bdd771e9c9b1353d2401c2892b2459_26_0.png)


    Linux mascot. Linus Torvalds had been set upon by a penguin in Australia, which
    had greatly impressed him. The iconic sitting penguin with its yellow feet and
    beak was drawn by Larry Ewing and made available to the community at large.


    Linux 2.6 saw a reorganisation of the development process. While, earlier on,
    version numbers with an odd second component (such as "2.3") had been considered
    developer versions and those with an even second component (like "2.0") stable
    versions suitable for end users, the Linux developers resolved to keep developer
    and stable versions from diverging to the larger extent previously seen. Starting
    with Linux 2.6, there is no longer a separate line of development kernels, but
    improvements are being introduced into the next version and are tested as extensively
    as possible before that version is officially released.


    This works approximately as follows: After Linux 2.6.37 is released, Linux collects
    proposed changes and improvements for the next kernel, includes them into his
    official version and publishes that as Linux 2.6.38-rc1 (for "release candidate
    1"). This version is tested by various people, and any fixes or improvements are
    collected in Linux 2.6.38-rc2 and so on. Eventually the code looks stable enough
    to be officially released as "Linux 2.6.38", and the process then repeats with
    version 2.6.39.


    In addition to Linus’ official version there are Linux versions that are maintained
    by other developers. For example, there is the "staging tree" where new device
    drivers can "mature" until (after several rounds of improvements) they are considered
    good enough to be submitted to Linus for inclusion into his version. Once released,
    many Linux kernels receive fixes for a certain period of time, so there can be
    versions like 2.6.38.1, 2.6.38.2, …'
