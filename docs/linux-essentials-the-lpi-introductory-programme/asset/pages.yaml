- pgno: 71
  md: '# ## 6.1 File and Path Names


    # ### 6.1.1 File Names


    One of the most important services of an operating system like Linux consists
    of storing data on permanent storage media like hard disks or USB keys and re-trieving
    them later. To make this bearable for humans, similar data are usually collected
    into “files” that are stored on the medium under a name.


    > Even if this seems trivial to you, it is by no means a given. In former times,
    some operating systems made it necessary to know abominations like track numbers
    on a disk in order to retrieve one’s data.


    Thus, before we can explain to you how to handle files, we need to explain to
    you how *Linux* *names* files.


    In Linux file names, you are essentially allowed to use any character that your
    computer can display (and then some). However, since some of the characters have
    a special meaning, we would recommend against their use in file names. Only two
    characters are completely disallowed, the slash and the zero byte (the character
    with ASCII value 0). Other characters like spaces, umlauts, or dollar signs may
    be used freely, but must usually be escaped on the command line by means of a
    backslash or quotes in order to avoid misinterpretations by the shell.


    > An easy trap for beginners to fall into is the fact that Linux distinguishes
    *uppercase* and *lowercase* letters in file names. Unlike Windows, where uppercase
    and lowercase letters in file names are displayed but treated the same, Linux
    considers *x*-files and *X*-files two different file names.


    Under Linux, file names may be “quite long”—there is no definite upper bound,
    since the maximum depends on the “file system”, which is to say the specific way
    bytes are arranged on the medium (there are several methods on Linux). A typical
    upper limit is 255 characters—but since such a name wouldn’t take somewhat more
    than three lines on a standard text terminal this shouldn’t really cramp your
    style.


    A further difference from DOS and Windows computers is that Linux does not use
    suffixes to characterise a file’s “type”. Hence, the dot is a completely ordinary
    character within a file name. You are free to store a text as *mumble*.txt, but
    *mumble* would be just as acceptable in principle. This should of course not turn
    you off using suffixes completely—you do after all make it easier to identify
    the file content.


    > Some programs insist on their input files having specific suffixes. The C compiler,
    *gcc*, for example, considers files with names ending in “*.c*” as source code,
    those ending in “*.s*” assembly language source code, and those ending in “*.o*”
    precompiled object files.


    You may freely use umlauts and other special characters in file names. However,
    if files are to be used on other systems it is best to stay away from special
    characters in file names, as it is not guaranteed that they will show up as the
    same characters elsewhere.


    > What happens to special characters also depends on your locale settings, since
    there is no general standard for representing characters exceeding the ASCII character
    set (128 characters covering mostly the English language, digits and the most
    common special characters). Widely used encodings are, for example, ISO 8859-1
    and ISO 8859-15 (popularly know as ISO-Latin-1 and ISO-Latin-9, respectively …
    don’t ask) as well as ISO 10646, casually and not quite correctly called “Unicode”
    and usually encoded as “UTF-8”. File names you created while encoding *X* was
    active may look completely different when you look at the directory while encoding
    *Y* is in force. The whole topic is nothing you want to think about during meals.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# 6.1 File and Path Names


    Should you ever find yourself facing a pile of files whose names are encoded according
    to the wrong character set, the `convmv` program, which can convert file names
    between various character encodings, may be able to help you. (You will probably
    have to install it yourself since it is not part of the standard installation
    of most distributions.) However, you should not really get down to this only after
    working through the rest of this chapter, as we haven’t even explained the regular
    #w yet...


    All characters from the following set may be used freely in file names: Portable
    file names


    ```

    ```

    ABCDEFGHIJKLMNOpqrstuvwxyz

    abcdefghijklmnopqrstuvwxyz

    0123456789+-._

    ```

    ```


    However, you should pay attention to the following hints:


    +   - To allow moving files between Linux and older Unix systems, the length of
    a file name should be at most 14 characters. (Make that “ancient”, really.)

    +   - File names should always start with one of the letters or a digit; the other
    four characters can be used without problems only inside a file name.


    These conventions are easiest to understand by looking at some examples. Allowable
    file names would be, for instance:


    ```

    ```

    x-files

    foo.txt.bak

    50.something

    7_of_9

    ```

    ```


    On the contrary, problems would be possible (if not likely or even assured) with:


    | File Name | Comment |

    | :--- | :--- |

    | `-10`f | Starts with “-”, includes special character |

    | `.profile` | Will be hidden |

    | `3/4-metre` | Contains illegal character |

    | `Smörrebröd` | Contains umlauts |


    As another peculiarity, file names starting with a dot (".") will be skipped in
    some places, for example when the files within a directory are listed—files with
    such names are considered “hidden”. This feature is often used for files containing
    settings for programs and which should not distract users from more important
    files in directory listings. Hidden files


    For DOS and Windows experts: These systems allow “hiding” files by means of a
    “file attribute” which can be set independently of the file’s name. Linux and
    Unix do not support such a thing.


    # 6.1.2 Directories


    Since potentially many users may work on the same Linux system, it would be problematic
    if each file name could occur just once. It would be difficult to make clear to
    user Joe that he cannot create a file called letter.txt since user Sue already
    has a file by that name. In addition, there must be a (convenient) way of ensuring
    that Joe cannot read all of Sue’s files and the other way round.


    For this reason, Linux supports the idea of hierarchical “directories” which are
    used to group files. File names do not need to be unique within the whole system,
    but only within the same directory. This means in particular that the system can
    assign different directories to Joe and Sue, and that within those they may call
    their files whatever they please without having to worry about each other’s files.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'In addition, we can forbid Joe from accessing Sue''s *directory* (and vice
    versa) and no longer need to worry about the individual files within them.


    On Linux, directories are simply files, even though you cannot access them using
    the same methods you would use for "plain" files. However, this implies that the
    rules we discussed for file names (see the previous section) also apply to the
    names of directories. We merely need to learn that the slash ("/") serves to separate
    file names from directory names and directory names from one another. *joe/letter.txt*
    would be the file *letter.txt* in the directory *joe*.


    Directories may contain other directories (this is the term "hierarchical" we
    mentioned earlier), which results in a tree-like structure (inventively called
    a "directory tree"1). A Linux system has a special directory which forms the root
    of the tree and is therefore called the "root directory"1. Its name is "/"1 (slash).


    In spite of its name, the root directory has nothing to do with the system administrator,
    root. It’s just that their names are similar.


    The slash does double duty here—it serves both as the name of the root directory
    and as the separator between other directory names. We’ll come back to this presently.


    The basic installation of common Linux distributions usually contains tens of
    thousands of files in a directory hierarchy that is mostly structured according
    to certain conventions. We shall tell you more about this directory hierarchy
    in Chapter 10.


    # 6.1.3  Absolute and Relative Path Names


    Every file in a Linux system is described by a name which is constructed by starting
    at the root directory and mentioning every directory down along the path to the
    one containing the file, followed by the name of the file itself. For example,
    *joe/letter.txt* names the file *letter.txt*, which is located within the *joe*
    directory, which in turn is located within the *home* directory, which in turn
    is a direct descendant of the root directory. A name that starts with the root
    directory is called an “absolute path name”1—we talk about “path names” since
    the name describes a “path” through the directory tree, which may contain directory
    and file names (i.e., it is a collective term).


    Each process within a Linux system has a “current directory”1 (often also called
    “working directory”1). File names are searched within this directory; *letter.txt*
    is thus a convenient abbreviation for “the file called *letter.txt* in the current
    directory”1, and *sue/letter.txt* stands for “the file *letter.txt* within the
    *sue* directory within the current directory”1. Such names, which start from the
    current directory, are called “relative path names”1.


    It is trivial to tell absolute from relative path names: A path name starting
    with a “/”1 is absolute; all others are relative.


    The current directory is “inherited”1 between parent and child processes. So if
    you start a new shell (or any program) from a shell, that new shell uses the same
    current directory as the shell you used to start it. In our new shell, you can
    change into another directory using the *cd* command, but the current directory
    of the old shell does not change—if you leave the new shell, you are back to the
    (unchanged) current directory of the old shell.


    There are two convenient shortcuts in relative path names (and even absolute ones):
    The name “..”1 always refers to the directory *above* the directory in question
    in the directory tree—for example, in the case of *home/joe*, */home*. This frequently
    allows you to refer conveniently to files in a “side branch”1 of the directory
    tree as viewed from the current directory, without having to resort to absolute
    path names. Assume *home/joe* has the subdirectories *letters* and *novels*. With
    *letters* as the current directory, you could refer to the *ivanhoe.txt* file
    within the *novels*'
