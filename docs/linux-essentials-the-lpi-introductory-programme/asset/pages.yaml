  md: 'One commendable trend, for example, is the simplification of connections. While
    almost every class of device used to have their own interface (parallel interfaces
    for printers, serial interfaces for modems, “PS/2” interfaces for keyboards and
    mice, SCSI for scanners, …), today most devices use USB (universal serial bus),
    a relatively foolproof and reasonably fast method which also supports “hot-plugging”
    connections while the computer is running.


    Another trend is that towards more “intelligence” in the peripherals themselves:
    Formerly, even expensive printers were fairly stupid devices at an IQ level of
    electric typewriters, and programmers had to very carefully send exactly the right
    control codes to the printer to produce the desired output. Today, printers (at
    least good printers) are really computers in their own right supporting their
    own programming languages that make printing much less of a hassle for programmers.
    The same applies in a similar fashion to many other peripherals.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_18_0.png)


    Of course there are still very stupid printers (especially at lower price points)
    which leave preparing the output to the computer itself. However, these still
    make a programmer’s life as easy as their more expensive relations.


