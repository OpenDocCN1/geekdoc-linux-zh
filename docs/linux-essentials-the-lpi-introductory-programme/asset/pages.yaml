    though there are three other entries above that of filelist. This is because ls
    first reads all directory entries, then sorts them by file name, and only then
    starts writing to the file. Thus ls sees the newly created (or emptied) file filelist,
    with no content so far.


    If you want to append a command’s output to an existing file without replacing
    its previous content, use the >> operator. If that file does not exist, it will
    be created in this case, too.


    ```

    ```

    $ date >> filelist

