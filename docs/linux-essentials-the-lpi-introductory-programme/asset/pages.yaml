  img_proc: true
- pgno: 121
  md: '# Table 9.1: Important Shell Variables


    | Variable | Meaning |

    | PWD | Name of the current directory |

    | EDITOR | Name of the user’s favourite editor |

    | PS1 | Shell command prompt template |

    | UID | Current user’s user name |

    | HOME | Current user’s home directory |

    | PATH | List of directories containing executable programs that are eligible
    as external commands |

    | LOGNAME | Current user’s user name (again) |


    ```

    $ export foo=bar

    ```


    The same works for several variables simultaneously:


    ```

    $ export foo baz

    $ export foo=bar baz=quux

    ```


    You can display all environment variables using the export command (with no parameters).
    The env command (also with no parameters) also displays the current environment.
    All shell variables (including those which are also environment variables) can
    be displayed using the set command. The most common variables and their meanings
    are shown in Table 9.1.


    The set command also does many other strange and wonderful things. You will encounter
    it again in the Linup Front training manual Advanced Linux, which covers shell
    programming.


    env, too, is actually intended to manipulate the process environment rather than
    just display it. Consider the following example:


    ```

    $ env foo=bar bash

    $ echo $foo

    bar

    $ exit

    $ echo $foo

    $ _

    ```


    At least with bash (and relations) you don’t really need env to execute commands
    with an extended environment – a simple


    ```

    $ foo=bar bash

    ```


    does the same thing. However, env also allows you to remove variables from the
    environment temporarily (how?).


    Delete a variable If you have had enough of a shell variable, you can delete it
    using the unset command. This also removes it from the environment. If you want
    to remove a variable from the environment but keep it on as a shell variable,
    use “export -n”:


    ```

    $ export foo=bar

    $ export -n foo

    $ unset foo

    ```'
