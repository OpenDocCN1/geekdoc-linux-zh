    # 8.1.3 Command Pipelines


    Output redirection is frequently used to store the result of a program in order
    to continue processing it with a different command. However, this type of intermediate
    storage is not only quite tedious, but you must also remember to get rid of the
    intermediate files once they are no longer required. Therefore, Linux offers a
    way of linking commands directly via pipes: A program’s output automatically becomes
    another program’s input.


    This direct connection of several commands into a pipeline is done using the |
    operator. Instead of first redirecting the output of “ls -laR” to a file and then
    looking at that file using less, you can do the same thing in one step without
    an intermediate file:


    ```

    $ ls -laR | less

    total 7

    drwxr-xr-x   12 joe   users        1024 Aug 26 18:55   ./

    drwxr-xr-x    5 root  root         1024 Aug 13 12:52   ../

    drwxr-xr-x    3 joe   users        1024 Aug 20 12:30   photos/

    -rw-r--r--    1 joe   users          449 Sep  6 13:50   filelist

    -rw-r--r--    1 joe   users        15811 Aug 13 12:33   pingu.gif

    -rw-r--r--    1 joe   users        14373 Aug 13 12:33   hobby.txt

    -rw-r--r--    2 joe   users         3316 Aug 20 15:14   chemistry.txt

    ```


    These command pipelines can be almost any length. Besides, the final result can
    be redirected to a file:


    ```

    $ cut -d: -f1 /etc/passwd | sort | pr -2 >userlst

    ```


    This command pipeline takes all user names from the first comma-separated column
    of /etc/passwd file, sorts them alphabetically and writes them to the userlst
    file in two columns. The commands used here will be described in the remainder
    of this chapter.


    Sometimes it is helpful to store the data stream inside a command pipeline at
    a certain point, for example because the intermediate result at that stage is
    useful for different tasks. The tee command copies the data stream and sends one
    copy to standard output and another copy to a file. The command name should be
    obvious if you know anything about plumbing (see Figure 8.2).


    The tee command with no options creates the specified file or overwrites it if
    it exists; with -a ("append"), the output can be appended to an existing file.'
