  md: "62%\", for example, means that, inside the archive, the file is only 38% of\
    \ its original size). `zip` automatically chooses the more sensible approach,\
    \ unless you disable compression completely using the `-0` option.\n\nIf you invoke\
    \ `zip` with an existing ZIP archive as its first parameter and do not specify\
    \ anything else, the files to be archived are *added* to the archive on top of\
    \ its existing content (existing files with the same names are overwritten). In\
    \ this case `zip` behaves differently from `tar` and `cpio` (just so you know).\
    \ If you want a \"clean\" archive, you must remove the file first.\n\nBesides\
    \ stupidly adding of files, `zip` supports several other modes of operation: The\
    \ `-u` option \"updates\" the archive by adding files to the archive only if the\
    \ file mentioned on the command line is newer than a pre-existing file of the\
    \ same name in the archive (named files that are not in the archive yet are added\
    \ in any case). The `-f` option \"refreshes\" the archive---files inside the archive\
    \ are overwritten with newer versions from the command line, but only if they\
    \ actually exist in the archive already (no completely new files are added to\
    \ the archive). The `-d` option considers the file names on the command line as\
    \ the names of files within the archive and deletes those.\n\nNewer versions of\
    \ `zip` also support the `-F5` (\"filesystem sync\") mode: This mode \"synchronises\"\
    \ an archive with the file system by doing essentially what `-u` does, but also\
    \ deleting files from the archive that have not been named on the command line\
    \ (or, in case of `-r, are part of a directory being searched). The advantage\
    \ of this method compared to a full reconstruction of the archive is that any\
    \ preexisting unchanged files in the archive do not need to be compressed again.\n\
    \n`zip` supports all sorts of options, and you can use `-\"zip -h\"` to look at\
    \ a list (or `-h2` to look at a more verbose list). The man page, `zip(1)`, is\
    \ also very informative.\nYou can unpack a ZIP archive again using `unzip` (this\
    \ can also be a ZIP archive from a Windows machine). It is best to take a peek\
    \ inside the archive first, using the `-v` option, to see what is in there---this\
    \ may save you some hassle with subdirectories (or their absence).\n\n```\n$ unzip\
