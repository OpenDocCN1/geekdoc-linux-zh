  md: '+   - GPL software must be available in source form and may be used for arbitrary
    purposes.


    +   - It is expressly allowed to modify the source and to distribute it in unmodified
    or modified form, as long as the receiver is given the same rights under the GPL.


    +   - It is also expressly allowed to distribute (or even sell) GPL software in
    executable form. In this case, the source code (including the *GPL rights*) must
    be furnished alongside the executables, or must, during a certain period of time,
    be made available upon request.


    “Source code” in this context means “everything necessary to get the software
    to run on a computer”. What that means in a particular case—for example, if it
    includes the cryptographic keys necessary to start a modified Linux kernel on
    an appropriately “locked-down” computer—is the subject of heated discussion.


    If somebody buys GPL software for money, they naturally obtain the right not just
    to install that software on all their computers, but also to copy and resell it
    (under the GPL). One consequence of this is that it does not make a lot of sense
    to sell GPL software “per seat”, but one important side benefit is that prices
    for, e.g., Linux distributions stay reasonable.


    +   - If you write a new program incorporating (parts of) a GPL program, the new
    program (a “derived work”) must also be placed under the GPL.


    Here, too, there is heated debate as to how much and which parts of a GPL program
    must be incorporated into another program to make that program a “derived work”.
    According to the FSF, using a dynamically loadable GPL library within a program
    forces that program under the GPL, even if it does not by itself contain any GPL
    code and therefore cannot be considered a “derived work” in the legal sense. How
    much of this is wishful thinking and how much is actually legally tenable must,
    in principle, be determined in a court of law.


    The GPL stipulates rules for modifying and distributing software, not its actual
    use.


    Right now two versions of the GPL are in widespread use. The newer version 3 (also
    called “GPLv3”) was released at the end of June, 2007, and differs from the older
    version 2 (also “GPLv2”) by clarifications in areas such as software patents,
    the compatibility with other free licences, and the introduction of restrictions
    on trying to make changes to theoretically “free” software within devices impossible
    through special hardware (“tivoisation”, after a Linux-based digital PVR whose
    kernel cannot be modified or replaced). The GPLv3 allows its users to add further
    terms.——The GPLv3 did not meet with universal approval within the community, hence
    many projects (most prominently, the Linux kernel) have deliberately stayed with
    the simpler GPLv2. In addition, many projects distribute their code under “the
    GPLv2 or any later version”, so you can decide which version of the GPL to follow
    when distributing or modifying such software.


    It is considered good style among the developers of free software to make contributions
    to a project under the same licence that the project is already using, and most
    projects insist on this at least for code to be incorporated in the “official”
    version of the software. Some projects even insist on *copyright assignments*,
    where the author of code gives their rights to the project (or a suitable organisation).
    The advantage of this step is that copyright in the'
