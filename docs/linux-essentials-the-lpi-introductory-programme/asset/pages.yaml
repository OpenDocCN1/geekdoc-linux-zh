    # 1.3 Software


    Just as important as a computer’s “hardware”, i.e., the technical components it
    consists of⁶, is its “software”—the programs it is running. This can very roughly
    be divided into three categories:


    +   the **firmware** is stored on the computer’s motherboard and can only be changed
    or replaced inconveniently if at all. It is used to put the computer into a defined
    state after switching it on. Often there is a way of invoking a setup mode that
    allows you to set the clock and enable or disable certain properties of the motherboard.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_18_2.png)


    On PCs, the firmware is called “BIOS” (Basic Input/Output System) or, on newer
    systems, “EFI” (Extensible Firmware Interface).


    ![](img/44bdd771e9c9b1353d2401c2892b2459_18_3.png)


    Some motherboards include a small Linux system that purportedly boots more quickly
    than Linux and which is supposed to be used to surf the Internet or watch a DVD
    without having to boot into Windows. Whether this is actually worth the trouble
    is up to debate.


    +   the **operating system** makes the computer into a usable device: It manages
    the computer’s resources such as the RAM, the hard disks, the processing time
    on the CPU(s) available to individual programs, and the access to other peripherals.
    It allows starting and stopping programs and enforces a separation between several
    users of the computer. Besides, it enables—on an elementary level—the participation
    of the computer in a local area network or the Internet. The operating system
    frequently furnishes a graphical user


