- pgno: 157
  md: '# 12.1 System Administration Basics


    What does a system administrator do? Configure computers, install software (and
    occasionally remove it), connect peripherals and make them usable, make back-ups
    (and occasionally restore them), add and remove user accounts, help users with
    problems, … it is an impressive list of tasks. In the old days of home computers,
    the user of a computer was also the administrator, and this idea has been kept
    going for a long time in systems like Windows (even once Windows had acquired
    the notion of different users, it was common to have to use the “Administrator”
    account, simply because various important programs assumed the corresponding privileges
    were available). Unix—the system that inspired Linux—was set up from its very
    beginnings to support several users, and hence the separation between an “administrator”
    with special privileges and “normal” users is rooted far more deeply in the system
    than with operating systems from the home computer tradition.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_157_0.png)


    The LPI''s *Linux Essentials* exam does not emphasise system administration, but
    you should have at least a general overview—perhaps not to *be* the system administrator,
    but to achieve a better understanding of what your system administrator does for
    you, or at some point *become* a system administrator. Knowledge important for
    system administrators is part of the LPI''s LPIC certification track, particularly
    LPIC-2 and LPIC-3.


    In this chapter we shall mention several topics that have less to do with the
    immediate use of a Linux computer, but include, for example, how to get a picture
    of what is running on the computer (cue “Why is my computer so slow??”), and how
    software is managed on the computer. We’re really after the big picture here,
    not details.


    On a Linux system, the system administrator has access to a special user account,
    *root*. This account is exempt from the access checks (Chapter 14) which are otherwise
    performed, and can therefore access all files on the system. This is necessary,
    for example, to install new software—“normal” users may read and execute program
    files from system directories but, in order to prevent manipulations to the detriment
    of other users, not write them. The administrator must also be able to read *any*
    user''s files in order to create backup copies (and to write them back if a backup
    needs to be restored).


    ![](img/44bdd771e9c9b1353d2401c2892b2459_157_1.png)


    It is obvious that the ability to write all files on the system includes the opportunity
    to damage the system seriously. If you are logged in as *root*, Linux does not
    prevent you from using a command like


    ```

    ```

    # rm -rf /

    ```

    ```


    to destroy the whole file system (and there are lots of more subtle ways to do
    damage). Hence you should avail yourself of *root* privileges only if you actually
    need them. Surfing the web or reading mail while logged in as *root* is RIGHT
    OUT.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_157_2.png)


    If you can read all files on the system as *root*, you might succumb to the temptation
    of, say, regularly inspecting your boss''s (or spouse''s) e-mail. DON’T DO IT.
    It may be destructive (at least in the case of your spouse) and /or illegal (at
    least in the case of your boss) and it can get you into all sorts of trouble that
    are liable to spoil your fun with Linux and system administration, to say nothing
    of domestic or workplace peace. There is nothing wrong with taking an isolated
    brief peek, in consultation with the people involved, into a mailbox file in order
    to diagnose or repair a problem—but do not let it become a habit.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_157_3.png)


    When in doubt, think of Peter Parker, a. k. a. Spider-Man: “With great power comes
    great responsibility.”'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'You should avoid logging in as root directly (especially on a graphical screen).
    Instead, use the *su* program, in a terminal session started as a normal user,
    to obtain a shell running as *root*:


    ```

    $ /bin/su -

    Password: secret                             Password for root

    # _

    ```


    After exiting the root shell (using *exit* or <kbd>Ctrl</kbd>+<kbd>d</kbd>) you
    end up back in the shell where you originally invoked *su*.


    Some distributions try to get by without a separate root account. Ubuntu, for
    example, allows the first user created during the system’s installation to execute
    single commands with root privileges by putting *sudo* in front, as in


    ```

    $ sudo less /var/log/syslog            Peruse system log

    ```


    (that user can extend this privilege to other users if required). For larger tasks,
    it is possible to use “*sudo -i*” to obtain a shell running with administrator
    privileges.


    > Most Linux distributions signal that a shell is running with *root* privileges
    by outputting a prompt ending in *“#”*. If something else appears—typically *“$”*
    or *“$”*—, the shell is unprivileged.


    # Exercises


    +   * **12.1 [2]** Try *su*. Why does the example use an absolute path name to
    invoke the program?


    +   * **12.2 [2]** You need to know the *root* password for *su*. *sudo* usually
    asks you for your own password. Which is better?


    # 12.2 System Configuration


    While other systems bury their configuration details in databases that can only
    be modified through special tools and are susceptible to “*bit rot*” (cue *Windows*
    registry), system-wide configuration entries on *Linux* are usually contained
    in text files within the */etc* directory (a few examples can be seen in Section
    10.3), where the system administrator can use a text editor of their choice to
    modify or extend them. For example, a new user can be added by adding the relevant
    parameters like the user name, numerical user ID, or home directory name to the
    */etc/passwd* file. A new hard disk may be configured by appending a line to */etc/fstab*
    specifying the name of the device file and the directory where the disk is supposed
    to appear.


    > A *Linux* system is a complex system of software components of widely differing
    provenance (some of which are older than *Linux* itself). From this historically
    grown setup it follows that the different configuration files within */etc* are
    structured in a very non-uniform fashion—some are organised by lines, others contain
    sections delimited by braces, even others are *XML* files or even executable shell
    scripts. This is certainly a nuisance to administrators who need to deal with
    all these different formats, but it is also not straightforward to change, since
    all sorts of software packages would need to be modified.


    > However, there are some very widespread conventions: For example, most configuration
    files allow comments in lines starting with *“#”*.


    While the idea of managing the system configuration in separate text files may
    seem *antediluvian* at first, it does have some tangible advantages:'
  merge: -1
  img_proc: true
- pgno: 159
  md: '+   * It is usually not possible to damage the system as a whole through mistakes
    in the configuration of a single software package or service. (Of course there
    are a few configuration files which are so essential for the system’s functionality
    that errors in them could, for example, render the system unbootable. But these
    are a small minority at best.)


    +   * Most configuration files allow comments. This makes it possible to document
    the details of individual configuration settings directly where they occur, and
    thus makes collaboration in a team easier or avoids accidents due to one’s own
    forgetfulness. It is certainly a lot better than having to remember that there
    is an entry X in menu Y that lets you open a dialog where on tab Z there is a
    box that absolutely needs to be checked because otherwise nothing is going to
    work. (Pieces of paper containing this type of wisdom have the unfortunate tendency
    of disappearing when they are needed most urgently.)


    +   * You can “check in” text files to a revision control system such as Git or
    Mercurial and thereby not just document big changes spanning various files, but
    also undo them in an orderly manner if required. This also makes it convenient
    to store the complete configuration of a computer on a central server, such that
    it is immediately available if the computer needs to be reinstalled for whatever
    reason—say, after a catastrophic hardware fault. In data centers this is a very
    decisive advantage, especially if a detailed “auditing” of all configuration changes
    is desired.


    +   * Text files allow the convenient configuration of whole computer networks
    by distributing configuration files from a central server to the computers to
    be managed. Systems such as “Puppet” or “Salt” make it possible to use “templates”
    for configuration files that are instantiated using suitable details for the target
    computer when they are distributed, which can totally obviate the manual configuration
    of individual computers (the “sneaker net”). This, too, makes the management of
    big networks easier but is also a definite help with smaller installations.


    # ## Exercises


    +   12.3 [3] Snoop around in /etc. Many files there have manual pages—try something
    like "man fstab". Are there files in /etc that you cannot read as a normal user,
    and why?


    # ### 12.3 Processes


    A program that is being executed is called a “process”. Besides the program code
    itself (in the machine language of the processor in question), a process includes
    working storage for the data as well as administrative information like the files
    currently in use, an environment (for the environment variables), a current directory,
    and a process number or “PID” identifying the process uniquely within the system.
    The operating system kernel is in charge of creating processes, assigning them
    CPU time and storage, and cleaning up after them when they have exited. Processes
    can call into the operating system kernel to access files, devices, or the network.


    New processes come into being when existing processes—not unlike bacteria or other
    low forms of life—split up into two almost identical copies (“almost identical”,
    because one process is considered the “parent” and the other the “child”). In
    addition, a process can arrange to execute a different program: For example, if
    you invoke the ls command in the shell, the shell creates a child process which
    is at first also executing the shell’s program'
  merge: -1
  img_proc: true
