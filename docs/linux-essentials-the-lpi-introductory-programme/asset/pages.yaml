  md: "if You can use the if command to make more than one command depend on a condition\
    \ (in a convenient and readable fashion). You may write `[...]` instead of `\"\
    test ...\"`:\n\n```\n#!/bin/bash\n# filetest2 NAME1 NAME2 ...\nfor name\ndo\n\
    \    if [ -L \"$name\" ]\n    then\n        echo $name: symbolic link\n    elif\
    \ [ -d \"$name\" ]\n        echo $name: directory\n    elif [ -f \"$name\" ]\n\
    \        echo $name: file\n    else\n        echo $name: no idea\n    fi\ndone\n\
    ```\n\nIf the command after the if signals “success” (exit code 0), the commands\
    \ after then will be executed, up to the next elif, else, or fi. If on the other\
    \ hand it signals “failure”, the command after the next elif will be evaluated\
    \ next and its exit code will be considered. The shell continues the pattern until\
    \ the matching fi is reached. Commands after the else are executed if none of\
    \ the if or elif commands resulted in “success”. The elif and else branches may\
    \ be omitted if they are not required.\n\n**More loops** With the for loop, the\
    \ number of trips through the loop is fixed at the beginning (the number of words\
    \ in the list). However, we often need to deal with situations where it is not\
    \ clear at the beginning how often a loop should be executed. To handle this,\
    \ the shell offers the while loop, which (like if) executes a command whose success\
    \ or failure determines what to do about the loop: On success, the “dependent”\
    \ commands will be executed, on failure execution will continue after the loop.\n\
    \nThe following script reads a file like\n\n```\nAunt Maggie:maggie@example.net:the\
    \ delightful tea cosy\nUncle Bob:bob@example.com:the great football\n```\n\n(whose\
    \ name is passed on the command line) and constructs a thank-you e-mail message\
    \ from each line (Linux is very useful in daily life):\n\n```\n#!/bin/bash\n#\
    \ birthday FILE\nIFS=:\nwhile read name email present\ndo\n\n    (echo $name\n\
    \    echo \"\"\n    echo \"Thank you very much for $present!\"\n    echo \"I enjoyed\
    \ it very much.\"\n    echo \"\"\n    echo \"Best wishes\"\n    echo \"Tim\")\
    \ | mail -s \"Many thanks!\" $email\ndone <$1\n```\n\nread The read command reads\
    \ the input file line by line and splits each line at the colons"
