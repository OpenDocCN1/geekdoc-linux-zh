- pgno: 184
  md: 'Incidentally, there is nothing wrong with creating directories for groups.
    Group members can place the fruits of their collective labour there. The approach
    is similar to creating user home directories, although no basic set of configuration
    files needs to be copied.


    For group management, there are, by analogy to useradd, usermod, and userdel,
    the groupadd, groupmod, and groupdel programs that you should use in favour of
    editing /etc/group and /etc/gshadow directly. With groupadd you can create new
    groups simply by giving the correct command parameters:


    groupadd [-g ⟨GID⟩] ⟨group_name⟩


    The -g option allows you to specify a given group number. As mentioned before,
    this is a positive integer. The values up to 99 are usually reserved for system
    groups. If -g is not specified, the next free GID is used.


    You can edit existing groups with groupmod without having to write to /etc/group
    directly:


    groupmod [-g ⟨GID⟩] [-n ⟨name⟩] ⟨group_name⟩


    The “-g ⟨GID⟩” option changes the group’s GID. Unresolved file group assignments
    must be adjusted manually. The “-n ⟨name⟩” option sets a new name for the group
    without changing the GID; manual adjustments are not necessary.


    There is also a tool to remove group entries. This is unsurprisingly called groupdel:


    groupdel ⟨group_name⟩


    Here, too, it makes sense to check the file system and adjust “orphaned” group
    assignments for files with the chgrp command. Users’ primary groups may not be
    removed—the users in question must either be removed beforehand, or they must
    be reassigned to a different primary group.


    The gpasswd command is mainly used to manipulate group passwords in a way similar
    to the passwd command. The system administrator can, however, delegate the administration
    of a group’s membership list to one or more group administrators. Group administrators
    also use the gpasswd command:


    gpasswd -a ⟨user⟩ ⟨group⟩


    adds the ⟨user⟩ to the ⟨group⟩, and


    gpasswd -d ⟨user⟩ ⟨group⟩


    removes him again. With


    gpasswd -A ⟨user⟩,… ⟨group⟩


    the system administrator can nominate users who are to serve as group administrators.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_184_0.png)


    The SUSE distributions haven’t included gpasswd for some time. Instead there are
    modified versions of the user and group administration tools that can handle an
    LDAP directory.


    As the system administrator, you can change the group database directly using
    the vigr command. It works like vipw, by invoking an editor for “exclusive” access
    to /etc/group. Similarly, “vigr -s” gives you access to /etc/gshadow.'
