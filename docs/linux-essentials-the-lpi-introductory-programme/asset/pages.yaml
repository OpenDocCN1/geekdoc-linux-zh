- pgno: 190
  md: 'To “give away” files to other users or arbitrary groups you need to be **root**.
    The main reason for this is that normal users could otherwise annoy one another
    if the system uses quotas (i.e., every user can only use a certain amount of storage
    space).


    Using the `chgrp` command, you can change a file’s group even as a normal user—as
    long as you own the file and are a member of the *new group*:


    ```

    ```

    chgrp ⟨group name⟩ ⟨name⟩

    ```

    ```


    💡 Changing a file’s owner or group does not change the access permissions for
    the various categories.


    `chown` and `chgrp` also support the `-R` option to apply changes recursively
    to part of the directory hierarchy.


    💡 Of course you can also change a file’s permissions, group, and owner using most
    of the popular file browsers (such as Konqueror or Nautilus).


    # **Exercises**


    +   - **14.1 [2]** Create a new file. What is that file’s group? Use `chgrp` to
    assign the file to one of your secondary groups. What happens if you try to assign
    the file to a group that you are not a member of?


    +   - **14.2 [4]** Compare the mechanisms that various file browsers (like Konqueror,
    Nautilus, ...) offer for setting a file’s permissions, owner, group, ... Are there
    notable differences?


    # ## 14.3 Process Ownership


    Linux considers not only the data on a storage medium as objects that can be owned.
    The processes on the system have owners, too.


    Many commands create a process in the system’s memory. During normal use, there
    are always several processes that the system protects from each other. Every process
    together with all data within its virtual address space is assigned to a user,
    its owner. This is most often the user who started the process—but processes created
    using administrator privileges may change their ownership, and the SUID mechanism
    (Section 14.4) can also have a hand in this.


    The owners of processes are displayed by the `ps` program if it is invoked using
    the `-u` option.


    ```

    ```

    # ps -u

    USER  PID %CPU %MEM SIZE    RSS TTY STAT START TIME COMMAND

    bin   89  0.0  1.0 788     328 ?   S    13:27  0:00 rpc.portmap

    test1 190 0.0  2.0 1100    28  3   S    13:27  0:00 bash

    test1 613 0.0  1.3 968     24  3   S    15:05  0:00 vi XF86.tex

    nobody 167 0.0  1.4 932    44  ?   S    13:27  0:00 httpd

    root  1   0.0  1.0 776     16  ?   S    13:27  0:03 init [3]

    root  2   0.0  0.0 0       0   ?   SW   13:27  0:00 (kflushd)

    ```

    ```


    # ## 14.4 Special Permissions for Executable Files


    When listing files using the “`ls -l`” command, you may sometimes encounter permission
    sets that differ from the usual `rwx`, such as


    ```

    ```

    -rwsr-xr-x  1 root shadow  32916 Dec 11  20:47 /usr/bin/passwd

    ```

    ```'
