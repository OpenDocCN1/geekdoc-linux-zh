- pgno: 31
  md: 'Proprietary programs often come with an "end-user licence agreement" (EULA)
    that the buyer must accept before actually being able to use the software. The
    software vendor uses the EULA to forbid the buyer to do things the buyer would
    in fact be allowed to do by copyright law—such as selling the software "used"
    to someone else, or to say bad things (or indeed anything at all) about the software
    in public. Such an EULA is a contract that needs to be accepted by both sides,
    and the legal hurdles (at least in Germany) are fairly high. For example, a software
    buyer must be able to inspect the EULA conditions before buying the software,
    or it must at least be possible to return the software unused for a full refund
    if the buyer does not agree with the EULA.


    On the other hand, the open-source licences for FLOSS are used to let the receiver
    of the software perform actions that would otherwise be forbidden by copyright.
    They generally do not try to restrict use of the software, but for the most part
    govern questions of modifying and distributing the software. In that sense they
    do not leave the software receiver worse off than they would have to expect from
    the sale of any other good. Hence, unlike EULAs, free-software licenses are usually
    not contracts that the receiver must explicitly accept, but one-sided declarations
    on the part of the software author, and the rights conferred by them constitute
    extra benefits on top of the simple usage rights inherent in the law.


    By now there is a whole zoo of licences fulfilling the basic requirements for
    free or open-source software. The best-known free-software licence is the General
    Public License (GPL) promulgated by Richard M. Stallman, but there are several
    others. The OSI “certifies” licences that according to its opinion embody the
    spirit of open source, just as the FSF approves licences that safeguard the “four
    freedoms”. Lists of approved licences are available from those organisations’
    web pages.


    If you consider starting a free or open-source software project, you are certainly
    free to come up with your own licence fulfilling the requirements of the FSF or
    OSI. However, it is usually better to adopt an existing licence that has already
    been approved. This means that you do not need to obtain approval for your licence
    from the FSF or OSI, and the existing licences have usually been examined by legal
    professionals and can be considered reasonably water-tight—as an amateur in contract
    or intellectual property law you might overlook important details that could get
    you in trouble later on.


    It is important to observe that the proponents of free or open-source software
    in no way intend to completely abolish copyright for software. In fact, free software
    as we know it can only work because copyright gives software authors the legal
    right to make the modification and distribution of their software contingent upon
    conditions such that the receiver of the software must also be given the right
    to modify and distribute it. Without copyright, everybody could help themselves
    to any available piece of software, and central tenets such as the “four freedoms”
    would be endangered because it would be possible for people to hoard without any
    sharing at all.


    # 2.2.3 The GPL


    The Linux kernel and large parts of what one would otherwise consider “Linux”
    is distributed under the General Public License (GPL). The GPL was developed by
    RMS for the GNU project and is supposed to ensure that software that was originally
    distributed under the GPL remains under the GPL (this type of licence is also
    referred to as a copyleft licence). This works approximately like this:


    > 5 In fact, the copyright laws of many countries contain explicit clarifications
    stating that the process of copying a program from disk into RAM in order to run
    it on the computer is not subject to copyright.'
