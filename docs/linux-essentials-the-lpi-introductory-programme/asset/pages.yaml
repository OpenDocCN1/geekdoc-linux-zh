    without having to enter an absolute path name.


    > As a Linux user you have a “home directory” which you enter immediately after
    logging in to the system. The system administrator determines that `directory`’s
    name when they create your user account, but it is usually called the same as
    your user name and located below `/home`—something like `/home/joe` for the user
    *joe*.


    # 6.2 Directory Commands


    # 6.2.1 The Current Directory: cd & Co.


    You can use the `cd` shell command to change the current directory: Simply give
    the desired directory as a parameter:


    ```

    ```

    $ cd letters    Change to the letters directory

    $ cd ..        Change to the directory above

    ```

    ```


    If you do not give a parameter you will end up in your home directory:


    ```

    ```

    $ cd

    $ pwd

    /home/joe

    ```

    ```


    You can output the absolute path name of the current directory using the `pwd`
    ("print working directory") command.


    Possibly you can also see the current directory as part of your prompt: Depending
    on your system settings there might be something like


    ```

    ```

    joe@red:~/letters> _

    ```

    ```


    where `~/letters` is short for `/home/joe/letters`; the tilde (`"~"`) stands for
    the current user’s home directory.


    > The `"cd ."` command changes to the directory that used to be current before
    the most recent `cd` command. This makes it convenient to alternate between two
    directories.


