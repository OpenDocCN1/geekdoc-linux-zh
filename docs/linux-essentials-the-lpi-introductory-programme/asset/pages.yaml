    # 1.2 Components Of A Computer


    Let’s take the opportunity of casting a glance at the “innards” of a computer
    (or, more precisely, an “IBM-compatible” PC) and the components we are likely
    to find there:


    **Processor** The processor (or “CPU”, for “central processing unit”) is the core
    of the computer: Here is where the automatic program-controlled data processing
    takes place that actually makes it a computer. Today’s processors usually contain
    several “cores”, which means that the major components of the processor exist
    multiple times and can operate independently, which in principle increases the
    computer’s processing speed and thereby its performance – and particularly fast
    computers often have more than one processor. PCs normally contain processors
    by Intel or AMD (which may differ in detail but can execute the same programs).
    Tablets and smartphones generally use ARM processors, which aren’t quite as powerful
    but much more energy-efficient. Intel and AMD processors cannot directly execute
    programs prepared for ARM processors and vice-versa.


    **RAM** A computer’s working memory is called “RAM” (or “random-access memory”,
    where “random” means “arbitrary” rather than “haphazard”). This stores not only
    the data being processed, but also the program code being executed.


    > This is an ingenious trick going back to the computing pioneer John von Neumann,
    a contemporary of Howard Aiken. It implies that there is no longer a difference
    between code and data – this means programs'
