  md: 'system, Android, is a Linux offshoot to the largest mainframes (the ten fastest
    computers in the world are all running Linux) makes Linux the most versatile operating
    system in the history of modern computing.


    Strictly speaking, “Linux” is just the operating system *kernel*, i. e., the program
    that handles the allocation of resources to applications and utilities. Since
    an operating system without applications isn’t all that useful, one usually installs
    a Linux distribution, which is to say a package consisting of “Linux” proper and
    a selection of applications, utilities, documentation and other useful stuff.
    The nice thing is that, like Linux itself, most Linux distributions are “*freely
    available*” and hence available free of charge or at very low cost. This makes
    it possible to equip a computer with software whose equivalents for Windows or
    OS X would run into thousands of dollars, and you do not run the risk of falling
    foul of licensing restrictions just because you installed your Linux distribution
    on all your computers as well as Aunt Millie’s and those of your buddies Susan
    and Bob.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_21_0.png)


    There is more information on Linux and Linux distributions in Chapter 2.


    # ### 1.4.3 More Differences And Similarities


    Actually, the three big operating systems—Linux, Windows, and OS X—differ only
    in detail in what they present to the users. All three offer a graphical user
    interface (GUI) which allows even casual users to manage their files through simple
    gestures like “drag and drop”. Many popular applications are available for all
    three operating systems, so which one you are using at the end of the day becomes
    almost immaterial as long as you are spending most of your time inside the web
    browser, office package, or e-mail program. This is an advantage because it enables
    a “gradual” migration from one system to the other.


    Besides the graphical interface, all three systems also offer a way to use a “command
    line” to input textual commands which the system then executes. With Windows and
    OS X, this feature is mostly used by system administrators, while “normal” users
    tend to shun it—a question of culture. With Linux, on the other hand, the command
    line is much less ostracised, which may have to do with its descent from the scientific/technical
    Unix philosophy. As a matter of fact, many tasks are performed more conveniently
    and efficiently from the command line, especially with the powerful tools that
    Linux (and really also OS X) provide. As a budding Linux user, you do well to
    open up to the command line and learn about its strengths and weaknesses, just
    as you should learn about the strengths and weaknesses of the GUI. A combination
    of both will give you the greatest versatility.


    # ## Exercises


    +   1.3 [1] If you have experience with a proprietary operating system like Windows
    or OS X: Which applications do you use most frequently? Which of them are “free
    software”?


    # ## 1.5 Summary


    Today’s PCs, whether based on Linux, Windows, or OS X, have more similarities
    than differences—as far as their hardware, their basic concepts, and their use
    is concerned. Without doubt you can use any of the three to get about your daily
    work, and none of them is obviously and uncontestedly “the best”.


    However, this manual talks mostly about Linux, and we will use the rest of these
    pages to provide an introduction to that system that is as extensive as possible—explain
    its use, highlight its strengths and, where necessary, point out its weaknesses.
    By now, Linux is a serious alternative to the other two systems and surpasses
    them in various aspects, in some of them widely. We are glad to'
