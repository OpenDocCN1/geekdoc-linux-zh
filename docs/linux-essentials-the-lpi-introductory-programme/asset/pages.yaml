- pgno: 16
  md: '# 1.2 Components Of A Computer




    Most of the electricity that the power supply pumps into the computer will sooner
    or later end up as heat, which is why good cooling is very important. For simplicity,
    most computers contain one or more fans to blow fresh air onto the expensive electronics,
    or to remove hot air from the case. With appropriate care it is possible to build
    computers that do not require fans, which makes them very quiet, but such computers
    are comparatively expensive and usually not quite as fast (since, with processors
    and graphics cards, “fast” usually means “hot”).


    Hard disks While a computer’s RAM is used for the data currently being processed
    (documents, spreadsheets, web pages, programs being developed, music, videos,
    . . . —and of course the programs working on the data), data not currently in
    use are stored on a hard disk. The main reason for this is that hard disks can
    store much more data than common computers’ RAM—the capacity of modern hard disks
    is measured in terabytes (1 TiB = 240 Byte), so they exceed typical RAM capacities
    by a factor of 100–1000.


    We pay for this increase in space with a decrease in retrieval times—RAM access
    times are measured in nanoseconds while those to data on (magnetic) hard disks
    are measured in milliseconds. This is a mere 6 orders of magnitude—the difference
    between a metre and 1,000 kilometres.


    Traditionally, hard disks consist of rotating platters coated with a magnetisable
    material. Read/write heads can magnetise this material in different places and
    re-read the data thus stored later on. The platters rotate at 4,500 to 15,000
    RPM, and the difference between the read/write head and the platter is extremely
    minute (up to 3 nm). This means that hard disks are quite sensitive to disruption
    and falls, because if the read/write head comes into contact with the platter
    while the disk is running—the dreaded “head crash”—the disk is destroyed.


    Newfangled hard disks for mobile computers have acceleration sensors which can
    figure out that the computer is falling, and to try and shut down the hard disk
    in order to prevent damage.


    The newest fashion is SSDs or “solid-state disks”, which instead of magnetised
    platters use “flash memory” for storage—a type of RAM which can maintain its content
    even without electricity. SSDs are faster than magnetic hard disks, but also considerably
    more expensive per gigabyte of storage. However, they contain no moving parts,
    are impervious to being shoved or dropped, and save energy compared to conventional
    hard disks, which makes them interesting for portable computers.


    SSDs are also reputed to “wear out” since the flash storage spaces (called “cells”)
    are only rated for a certain number of write operations. Measurements have shown
    that this does not lead to problems in practice.


    There are various methods of connecting a hard disk (magnetic or SSD) to a computer.
    Currently most common is “serial ATA” (SATA), older computers use “parallel ATA”,
    also called “IDE”. Servers also use SCSI or SAS (“serially attached SCSI”) disks.
    For external disks, one uses USB or eSATA (a variant of SATA with sturdier connectors).


    Incidentally: The difference between gigabytes and gibibytes (or terabytes and
    tebibytes) is most notable with hard disks. For example, you buy a “100 GB drive”,
    connect it to your computer and, shock horror, realise that your computer only
    shows you 93 “GB” of free space on the new disk! However, your drive is not damaged
    (lucky you)—'
