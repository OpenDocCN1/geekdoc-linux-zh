  md: '```

    # useradd -c "Joe Smith" -m -d /home/joe -g devel -k /etc/skel.devel

    ```


    command creates an account by the name of `joe` for a user called Joe Smith, and
    assigns it to the `devel` group. Joe''s home directory is created as `/home/joe`,
    and the files from `/etc/skel.devel` are being copied into it.


    With the `-D` option (on SUSE distributions, `--show-defaults`) you may set default
    values for some of the properties of new user accounts. Without additional options,
    the default values are displayed:


    ```

    # useradd -D

    GROUP=100

    HOME=/home

    INACTIVE=-1

    EXPIRE=

    SHELL=/bin/sh

    SKEl=/etc/skel

    CREATE_MAIL_SPOOL=no

    ```


    You can change these values using the `-g`, `-b`, `-f`, `-e`, and `-s` options,
    respectively:


    ```

    # useradd -D -s /usr/bin/zsh

    zsh as the default shell

    ```


    The final two values in the list cannot be changed.


    useradd is a fairly low-level tool. In real life, you as an experienced administrator
    will likely not be adding new user accounts by means of useradd, but through a
    shell script that incorporates your local policies (just so you don''t have to
    remember them all the time). Unfortunately you will have to come up with this
    shell script by yourself—at least unless you are using Debian GNU/Linux or one
    of its derivatives (see below).


    *Watch out:* Even though every serious Linux distribution comes with a program
    called `useradd`, the implementations differ in their details.


    The Red Hat distributions include a fairly run-of-the-mill version of `useradd`,
    without bells and whistles, which provides the features discussed above.


    The SUSE distributions’ `useradd` is geared towards optionally adding users to
    a LDAP directory rather than the `/etc/passwd` file. (This is why the `-D` option
    cannot be used to query or set default values like it was elsewhere—it is already
    spoken for to do LDAPy things.) The details are beyond the scope of this manual.


    On Debian GNU/Linux and Ubuntu, `useradd` does exist but the recommended method
    to create new user accounts is a program called `adduser` (thankfully this is
    not confusing). The advantage of `adduser` is that it plays according to Debian
    GNU Linux''s rules, and furthermore makes it possible to execute arbitrary other
    actions for a new account besides creating the actual account. For example, one
    might create a directory in a web server''s document tree so that the new user
    (and nobody else) can publish files there, or the user could automatically be
    authorised to access a database server. You can find the details in `adduser(8)`
    and `adduser.conf(5)`.


    After it has been created using `useradd`, the new account is not yet accessible;
    the system administrator must first set up a password. We shall be explaining
    this password presently.'
