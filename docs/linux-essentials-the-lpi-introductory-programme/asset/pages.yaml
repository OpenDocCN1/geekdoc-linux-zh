- pgno: 47
  md: '# 3.1  Logging In and Out


    The Linux system distinguishes between different users. As a consequence, you
    may not be able to start using the computer immediately after it has been switched
    on. First you must tell the computer who you are—you need to “log in” (or “on”).

    Based on the information you provide, the system can then decide what you may
    do (or not do). Of course you need access rights to the system (an ‘account’)—the
    system administrator must have entered you as a valid user and assigned you a
    user name (*e.g.*, *joe*) and a password (*e.g.*, *secret*). The password is supposed
    to ensure that only you can use the system; you must keep it secret and should
    not make it known to anybody else. Whoever knows your user name and password can
    pretend to be you on the system, read (or delete) all your files, send electronic
    mail in your name and generally get up to all kinds of shenanigans.


    > Some modern Linux distributions try to make it easy on you and allow you to
    skip the login process on a computer that only you will be using anyway.

    > If you use such a system, you will not have to log in explicitly, but the computer
    boots straight into your session. You should of course take advantage of this
    only if you do not foresee that third parties have access to your computer; refrain
    from this in particular on laptop computers or other mobile systems that tend
    to get lost or stolen.


    **Logging in in a graphical environment** These days it is common for Linux workstations
    to present a graphical environment (as they should), and the login process takes
    place on the graphics screen, too. Your computer displays a form that lets you
    enter your user name and password.


    > Don’t wonder if you only see asterisks when you’re entering your password. This
    does not mean that your computer misunderstands your input, but that it wants
    to make life more difficult for people who are watching you over your shoulder
    in order to find out your password.


    After you have logged in, the computer starts a graphical session for you, in
    which you have convenient access to your application programs by means of menus
    and icons (small pictures on the “desktop” background). Most graphical environments
    for Linux support “session management” in order to restore your session the way
    it was when you finished it the time before (as far as possible, anyway). That
    way you do not need to remember which programs you were running, where their windows
    were placed on the screen, and which files you had been using.


    **Logging out in a graphical environment** If you are done with your work or want
    to free the computer for another user, you need to log out. This is also important
    because the session manager needs to save your current session for the next time.
    How logging out works in detail depends on your graphical environment, but as
    a rule there is a menu item somewhere that does everything for you. If in doubt,
    consult the documentation or ask your system administrator (or knowledgeable buddy).


    **Logging in on a text console** Unlike workstations, server systems often support
    only a text console or are installed in draughty, noisy machine halls, where you
    don’t want to spend more time than absolutely necessary. So you will prefer to
    log into such a computer via the network. In both cases you will not see a graphical
    login screen, but the computer asks you for your user name and password directly.
    For example, you might simply see something like


    ```

    computer login: _

    ```'
  merge: -1
  img_proc: true
- pgno: 48
  md: '(if we stipulate that the computer in question is called “computer”). Here
    you must enter your user name and finish it off with the `Enter` key. The computer
    will continue by asking you for your password:


    ```

    Password: _

    ```


    Enter your password here. (This time you won’t even see asterisks—simply nothing
    at all.) If you entered both the user name and password correctly, the system
    will accept your login. It starts the command line interpreter (the shell), and
    you may use the keyboard to enter commands and invoke programs. After logging
    in, you will be placed in your “home directory”, where you will be able to find
    your files.


    > If you use the “secure shell”, for example, to log in to another machine via
    the network, the user name question is usually skipped, since unless you specify
    otherwise the system will assume that your user name on the remote computer will
    be the same as on the computer you are initiating the session from. The details
    are beyond the scope of this manual; the secure shell is discussed in detail in
    the Linup Front training manual *Linux Administration II*.


    **Logging out on a text console** On the text console, you can log out using,
    for example, the `logout` command:


    ```

    $ logout

    ```


    Once you have logged out, on a text console the system once more displays the
    start message and a login prompt for the next user. With a secure shell session,
    you simply get another command prompt from your local computer.


    # Exercises


    +   3.1 [!1] Try logging into the system. After that, log out again. (You will
    find a user name and password in your system documentation, or—in a training centre
    / school—your instructor / teacher will tell you what to use.)


    +   3.2 [!2] What happens if you enter (a) a non-existing user name, (b) a wrong
    password? Do you notice anything unusual? What reasons could there be for the
    system to behave as it does?


    # 3.2 Desktop Environment and Browser


    # 3.2.1 Graphical Desktop Environments


    If you logged into a graphical environment, your Linux computer presents a desktop
    that does not differ much from what you would get to see on other modern computers.


    > Unfortunately it is impossible for us to be more specific, since no two “Lin-uxes”
    are the same here. Unlike systems like Windows or the Macintosh operating system,
    which come with an “official” graphical environment, Linux lets you choose—when
    the system is installed, most major distributions offer you a choice between several
    graphical environments:


