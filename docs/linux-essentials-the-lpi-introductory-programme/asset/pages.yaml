  md: '# **Exercises**


    +   6.22 [2] Find all files on your system which are longer than 1 MiB, and output
    their names.


    +   6.23 [2] How could you use find to delete a file with an unusual name (e.
    g., containing invisible control characters or umlauts that older shells cannot
    deal with)?


    +   6.24 [3] (Second time through the book.) How would you ensure that files in
    /tmp which belong to you are deleted once you log out?


    # 6.4.5 Finding Files Quickly—locate and slocate


    The find command searches files according to many different criteria but needs
    to walk the complete directory tree below the starting directory. Depending on
    the tree size, this may take considerable time. For the typical application—searching
    files with particular names—there is an accelerated method.


    The locate command lists all files whose names match a given shell wildcard pattern.
    In the most trivial case, this is a simple string of characters:


    ```

    $ locate letter.txt

    /home/joe/Letters/letter.txt

    /home/joe/Letters/granny/letter.txt

    /home/joe/Letters/granny/letter.txt-\<3<3<

    ```


    Although locate is a fairly important service (as emphasised by the fact that
    it is part of the LPI C1 curriculum), not all Linux distributions include it as
    part of the default installation.


    For example, if you are using a SUSE distribution, you must explicitly install
    the findutils - locate package before being able to use locate.


    The “ *”, “ ?”, and “ […]” characters mean the same thing to locate as they do
    to the shell. But while a query without wildcard characters locates all file names
    that contain the pattern anywhere, a query with wildcard characters returns only
    those names which the pattern describes completely—from beginning to end. Therefore
    pattern queries to locate usually start with “ *”:


    ```

    $ locate "*/letter.*"

    /home/joe/Letters/letter.txt

    /home/joe/Letters/letter.tab

    \<3<3<

    ```


    Be sure to put quotes around locate queries including shell wildcard characters,
    to keep the shell from trying to expand them.


    The slash (“/”) is not handled specially:


    ```

    $ locate Letters/granny

    /home/joe/Letters/granny/letter.txt

    /home/joe/Letters/granny/letter.txt-

    ```


    locate is so fast because it does not walk the file system tree, but checks a
    “database” of file names that must have been previously created using the updatedb
    program. This means that locate does not catch files that have been added to the
    system since the last database update, and conversely may output the names of
    files that have been deleted in the meantime.'
