- pgno: 188
  md: "Unix-like system, Linux has no way of “deleting” a file outright; you can only\
    \ remove all references to a file, in which case the Linux kernel decides on its\
    \ own that no one will be able to access the file any longer, and gets rid of\
    \ its content.\n\nIf you do have write permission to the file but not its directory,\
    \ you cannot remove the file completely. You can, however, truncate it down to\
    \ 0 bytes and thereby remove its content, even though the file itself still exists\
    \ in principle.\n\nFor each user, Linux determines the “most appropriate” access\
    \ rights. For example, if the members of a file’s group do not have read permission\
    \ for the file but “others” do, then the group members may not read the file.\
    \ The (admittedly enticing) rationale that, if all others may look at the file,\
    \ then the group members, who are in some sense also part of “all others”, should\
    \ be allowed to read it as well, does not apply.\n\n# 14.2.2 Inspecting and Changing\
    \ Access Permissions\n\nYou can obtain information about the rights, user and\
    \ group assignment that apply to a file using “ls -l”:\n\n```\n```\n$ ls -l\n\
    -rw-r--- 1 joe users 4711 Oct 4 11:11 datei.txt\n drwx-r-x-- 2 joe group2 4096\
    \ Oct 4 11:12 testdir\n```\n```\n\nThe string of characters in the first column\
    \ of the table details the access permissions for the owner, the file’s group,\
    \ and others (the very first character is just the file type and has nothing to\
    \ do with permissions). The third column gives the owner’s user name, and the\
    \ fourth that of the file’s group.\n\nIn the permissions string, “r”, “w”, and\
    \ “x” signify existing read, write, and execute permission, respectively. If there\
    \ is just a “-” in the list, then the corresponding category does not enjoy the\
    \ corresponding privilege. Thus, “rw-r--r--” stands for “read and write permission\
    \ for the owner, but read permission only for group members and others”.\n\nAs\
    \ the file owner, you may set access permissions for a file using the chmod command\
    \ (from “change mode”). You can specify the three categories by means of the abbreviations\
    \ “u” (user for the owner (yourself), “g” (group for the file’s group’s members,\
    \ and “o” (others) for everyone else. The permissions themselves are given by\
    \ the already-mentioned abbreviations “r”, “w”, and “x”. Using “+” and “-”, you\
    \ can specify whether the permissions in question should be added to any existing\
    \ permissions, “subtracted” from the existing permissions, or used to replace\
    \ whatever was set before. For example:\n\n```\n```\n$ chmod u+x file        \
    \   Execute permission for owner\n$ chmod go+w file          Sets write permission\
    \ for group and others\n$ chmod g+rw file          Sets read and write permission\
    \ for group\n$ chmod g-rw,o-r file\n                           Removes group execute\
    \ permission;\n                           sets just read permission for others\n\
    $ chmod a-w file           Equivalent to ug-s\n```\n```\n\nIn fact, permission\
    \ specifications can be considerably more complex. Consult the man page for chmod\
    \ to find out all the details.\n\nA file’s owner is the single user (apart from\
    \ root) who is allowed to change a file’s or directory’s access permissions. This\
    \ privilege is independent of the actual permissions; the owner may take away\
    \ all their own permissions, but that does not keep them from giving them back\
    \ later.\n\nThe general syntax of the chmod command is"
  merge: -1
