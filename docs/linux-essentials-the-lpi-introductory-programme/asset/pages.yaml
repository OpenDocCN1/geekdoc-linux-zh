    # Summary


    +   - Every Linux program supports the standard I/O channels **stdin**, **stdout**,
    and **stderr**.

    +   - Standard output and standard error output can be redirected using operators
    `>` and `>>`, standard input using operator `<`.

    +   - Pipelines can be used to connect the standard output and input of programs
    directly (without intermediate files).

    +   - Using the **tee** command, intermediate results of a pipeline can be stored
    to files.

    +   - Filter commands (or “**filters**”) read their standard input, manipulate
    it, and write the results to standard output.

    +   - **sort** is a versatile program for sorting.

    +   - The **cut** command cuts specified ranges of columns or fields from every
    line of its input.

    +   - With **paste**, the lines of files can be joined.'
