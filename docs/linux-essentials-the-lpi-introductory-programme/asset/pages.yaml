- pgno: 171
  md: 'For the purposes of access control, all groups carry equivalent weight—every
    user always enjoys all rights deriving from all the groups that he is a member
    of. The only difference between the primary and secondary groups is that files
    newly created by a user are usually² assigned to his primary group.


    Up to (and including) version 2.4 of the Linux kernel, a user could be a member
    of at most 32 additional groups; since Linux 2.6 the number of secondary groups
    is unlimited.


    You can find out a user account’s UID, the primary and secondary groups and the
    corresponding GIDs by means of the *id* program:


    ```

    $ id

    uid=1000(joe) gid=1000(joe) groups=24(cdrom),29(audio),44(video),> <- 1000(joe)

    $ id root

    uid=0(root) gid=0(root) groups=0(root)

    ```


    With the options *-u*, *-g*, *-G*, *id* lets itself be persuaded to output just
    the account’s UID, the GID of the primary group, or the GIDs of the secondary
    groups. (These options cannot be combined.) With the additional option *-n* you
    get names instead of numbers:


    ```

    $ id -G

    1000 24 29 44

    $ id -Gn

    joe cdrom audio video

    ```


    The *groups* command yields the same result as the “`id -Gn`” command.


    You can use the *last* command to find who logged into your computer and when
    (and, in the case of logins via the network, from where):


    ```

    $ last

    joe     pts/1      pcjoe.example.c  Wed Feb 29 10:51   still logged in

    bigboss pts/0      pc01.example.c   Wed Feb 29 08:44   still logged in

    joe     pts/2      pcjoe.example.c  Wed Feb 29 01:17 - 08:44 (07:27)

    sue     pts/0      :0               Tue Feb 28 17:28 - 18:11 (00:43)

    <reboot>

    reboot  system boot 3.2.0-1-amd64      Fri Feb   3 17:43 - 13:25 (4+19:42)

    <xxxxxx>

    ```


    For network-based sessions, the third column specifies the name of the *ssh* client
    computer. “`:0`” denotes the graphical screen (the first X server, to be exact—there
    might be more than one).


    Do also note the *reboot* entry, which tells you that the computer was started.
    The third column contains the version number of the Linux operating system kernel
    as provided by `uname -r`.


    With a user name, *last* provides information about a particular user:


    ```

    $ last

    joe     pts/1      pcjoe.example.c  Wed Feb 29 10:51   still logged in

    joe     pts/2      pcjoe.example.c  Wed Feb 29 01:17 - 08:44 (07:27)

    <xxxxxx>

    ```


    ²The exception occurs where the owner of a directory has decreed that new files
    and subdirectories within this directory are to be assigned to the same group
    as the directory itself. We mention this strictly for completeness.'
