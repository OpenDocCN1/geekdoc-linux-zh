    \ computer for “signs of life”. If these indications arrive back at your computer,\
    \ you know that (a) your computer can send data to the other computer, and (b)\
    \ the other computer can send data to your computer (the one does not necessarily\
    \ imply the other).\n\nIn the simplest case, you invoke ping with the name of\
