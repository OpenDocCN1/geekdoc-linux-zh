- pgno: 82
  md: '# 6.4 Handling Files




    To understand this, you have to visualise how the shell executes this command.
    It tries first to replace all wildcard patterns with the corresponding file names,
    for example `*.txt` by `letter1.txt` and `letter2.txt`. What happens to `*.bak`
    depends on the expansion of `*.txt` and on whether there are matching file names
    for `*.bak` in the current directory—But the outcome will almost never be what
    a DOS user would expect! Usually the shell will pass the `cp` command the unexpanded
    `*.bak` wildcard pattern as the final argument, which fails from the point of
    view of `cp` since this is (unlikely to be) an existing directory name.


    While the `cp` command makes an exact copy of a file, physically duplicating the
    file on the storage medium or creating a new, identical copy on a different storage
    medium, the `mv` (“move”) command serves to move a file to a different place or
    change its name. This is strictly an operation on directory contents, unless the
    file is moved to a different file system—for example from a hard disk partition
    to a USB key. In this case it is necessary to move the file around physically,
    by copying it to the new place and removing it from the old.


    The syntax and rules of `mv` are identical to those of `cp`—you can again specify
    a list of source files instead of merely one, and in this case the command expects
    a directory name as the final argument. The main difference is that `mv` lets
    you rename directories as well as files.


    The `-b`, `-f`, `-i`, `-u`, and `-v` options of `mv` correspond to the eponymous
    ones described with `cp`.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_82_0.png)


    ```

    ```

    $ mv passwd list2

    $ ls -l

    -rw-r--r-- 1 joe users 2500 Oct 4 11:11 list

    -rw-r--r-- 1 joe users 8765 Oct 4 11:26 list2

    ```

    ```


    In this example, the original file `list2` is replaced by the renamed file `passwd`.
    Like `cp`, `mv` does not ask for confirmation if the target file name exists,
    but overwrites the file mercilessly.


    The command to delete files is called `rm` (“remove”). To delete a file, you must
    have write permission in the corresponding directory. Therefore you are “lord
    of the Manor” in your own home directory, where you can remove even files that
    do not properly belong to you.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_82_1.png)


    > > Write permission on a file, on the other hand, is completely irrelevant as
    far as deleting that file is concerned, as is the question to which user or group
    the file belongs.


    `rm` goes about its work just as ruthlessly as `cp` or `mv`—the files in question
    are obliterated from the file system without confirmation. You should be especially
    careful, in particular when shell wildcard patterns are used. Unlike in DOS, the
    dot in a Linux file name is a character without special significance. For this
    reason, the `rm "*"` command deletes all non-hidden files from the current directory.
    Subdirectories will remain unscathed; with `rm -r *"` they can also be removed.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_82_2.png)


    > > As the system administrator, you can trash the whole system with a command
    such as `rm -rf /`; utmost care is required! It is easy to type `rm -rf foo *"`
    instead of `rm -rf foo*"`.


    Where `rm` removes all files whose names are passed to it, `rm -i"` proceeds a
    little more carefully:


    ```

    ```

    $ rm -i lis*

    rm: remove ''list''? n

    rm: remove ''list2''? y

    $ ls -l

    -rw-r--r-- 1 joe users 2500 Oct 4 11:11 list

    ```

    ```'
