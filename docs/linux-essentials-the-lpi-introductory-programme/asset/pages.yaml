- pgno: 224
  md: 'you. «She delayed, until at last the king commanded her to do it. Once the
    frog was on the chair he wanted to be on the table, and when he was on the table
    he said, «Now, push your little golden plate nearer to me that we may eat together.»
    The frog enjoyed what he ate, but almost every mouthful she took choked her.


    At length he said, «I have eaten and am satisfied, now I am tired, carry me into
    your little room and make your little silken bed ready, and we will both lie down
    and go to sleep.» The king’s daughter began to cry, for she was afraid of the
    cold frog which she did not like to touch, and which was now to sleep in her pretty,
    clean little bed.


    But the king grew angry and said, «He who helped you when you were in trouble
    ought not afterwards to be despised by you.»


    So she took hold of the frog with two fingers, carried him upstairs, and put him
    in a corner, but when she was in bed he crept to her and said, «I am tired, I
    want to sleep as well as you, lift me up or I will tell your father.»


    At this she was terribly angry, and took him up and threw him with all her might
    against the wall. «Now, will you be quiet, odious frog,» said she. But when he
    fell down he was no frog but a king’s son with kind and beautiful eyes. He by
    her father’s will was now her dear companion and husband. Then he told her how
    he had been bewitched by a wicked witch, and how no one could have delivered him
    from the well but herself, and that to-morrow they would go together into his
    kingdom.


    And indeed, the next morning a carriage came driving up with eight white horses,
    which had white ostrich feathers on their heads, and were harnessed with golden
    chains, and behind stood the young king’s servant Faithful Henry.


    Faithful Henry had been so unhappy when his master was changed into a frog, that
    he had caused three iron bands to be laid round his heart, lest it should burst
    with grief and sadness. The carriage was to conduct the young king into his kingdom.
    Faithful Henry helped them both in, and placed himself behind again, and was full
    of joy because of this deliverance.


    And when they had driven a part of the way the king’s son heard a crackling behind
    him as if something had broken. So he turned round and cried, «Henry, the carriage
    is breaking.» «No, master, it is not the carriage. It is a band from my heart,
    which was put there in my great pain when you were a frog and imprisoned in the
    well.»


    Again and once again while they were on their way something cracked, and each
    time the king’s son thought the carriage was breaking, but it was only the bands
    which were springing from the heart of Faithful Henry because his master was set
    free and was happy.


    (Linup Front GmbH would like to point out that the authors strongly disapprove
    of any cruelty to animals.)'
