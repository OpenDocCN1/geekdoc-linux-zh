- pgno: 134
  md: '**Plain files** This group includes texts, graphics, sound files, etc., but
    also executable programs. Plain files can be generated using the usual tools like
    editors, cat, shell output redirection, and so on.


    **Directories** Also called “folders”; their function, as we have mentioned, is
    to help structure storage. A directory is basically a table giving file names
    and associated inode numbers. Directories are created using the `mkdir` command.


    **Symbolic links** Contain a path specification redirecting accesses to the link
    to a different file (similar to “shortcuts” in Windows). See also Section 6.4.2.
    Symbolic links are created using `ln -s`.


    **Device files** These files serve as interfaces to arbitrary devices such as
    disk drives. For example, the file `/dev/fd0` represents the first floppy drive.
    Every write or read access to such a file is redirected to the corresponding device.
    Device files are created using the `mknod` command; this is usually the system
    administrator’s prerogative and is thus not explained in more detail in this manual.


    **FIFOs** Often called “named pipes”. Like the shell’s pipes, they allow the direct
    communication between processes without using intermediate files. A process opens
    the FIFO for writing and another one for reading. Unlike the pipes that the shell
    uses for its pipelines, which behave like files from a program’s point of view
    but are “anonymous”—they do not exist within the file system but only between
    processes—, FIFOs have file names and can thus be opened like files by arbitrary
    programs. Besides, FIFOs may have access rights (pipes may not). FIFOs are created
    using the `mkfifo` command.


    **Unix-domain sockets** Like FIFOs, Unix-domain sockets are a method of inter-process
    communication. They use essentially the same programming interface as “real” network
    communications across TCP/IP, but only work for communication peers on the same
    computer. On the other hand, Unix-domain sockets are considerably more efficient
    than TCP/IP. Unlike FIFOs, Unix-domain sockets allow bi-directional communications—both
    participating processes can send as well as receive data. Unix-domain sockets
    are used, e.g., by the X11 graphic system, if the X server and clients run on
    the same computer. There is no special program to create Unix-domain sockets.


    # Exercises


    +   * **10.1** [3] Check your system for examples of the various file types. (Table
    10.1 shows you how to recognise the files in question.)


    # 10.3  The Linux Directory Tree


    A Linux system consists of hundreds of thousands of files. In order to keep track,
    there are certain conventions for the directory structure and the files comprising
    a Linux system, the *Filesystem Hierarchy Standard* (**FHS**). Most distributions
    adhere to this standard (possibly with small deviations). The FHS describes all
    directories immediately below the file system’s root as well as a second level
    below `/usr`.


    The file system tree starts at the **root directory**, “/” (not to be confused
    with `/root`, the home directory of user root). The root directory contains either
    just sub-directories or else additionally, if no `/boot` directory exists, the
    operating system kernel.


    You can use the “`ls -la /`” command to list the root directory’s subdirectories.
    The result should look similar to Figure 10.1. The individual subdirectories follow
    FHS and therefore contain approximately the same files on every distribution.
    We shall now take a closer look at some of the directories:'
