- pgno: 139
  md: '**/proc/kcore** This file is conspicuous for its size. It makes available the
    computer''s complete RAM and is required for debugging the kernel. This file requires
    root privileges for reading. You do well to stay away from it!


    **/proc/loadavg** This file contains three numbers measuring the CPU load during
    the last 1, 5 and 15 minutes. These values are usually output by the *uptime*
    program


    **/proc/meminfo** Displays the memory and swap usage. This file is used by the
    *free* program


    **/proc/mounts** Another list of all currently mounted file systems, mostly identical
    to */etc/mtab*


    **/proc/scsi** In this directory there is a file called *scsi* listing the available
    SCSI devices. There is another subdirectory for every type of SCSI host adapter
    in the system containing a file 0 (1, 2, ... for multiple adapters of the same
    type) giving information about the SCSI adapter.


    **/proc/version** Contains the version number and compilation date of the current
    kernel.


    Back when */proc* had not been invented, programs like the process status display
    tool, *ps*, which had to access kernel information, needed to include considerable
    knowledge about internal kernel structures as well as the appropriate access rights
    to read the data in question from the running kernel. Since these data structures
    used to change fairly rapidly, it was often necessary to install a new version
    of these programs along with a new version of the kernel. The */proc* file system
    serves as an abstraction layer between these internal data structures and the
    utilities: Today you just need to ensure that after an internal change the data
    formats in */proc* remain the same—and *ps* and friends continue working as usual.


    **Hardware Control—/sys** The Linux kernel has featured this directory since version
    2.6. Like */proc*, it is made available on demand by the kernel itself and allows,
    in an extensive hierarchy of subdirectories, a consistent view on the available
    hardware. It also supports management operations on the hardware via various special
    files.


    Theoretically, all entries in */proc* that have nothing to do with individual
    processes should slowly migrate to */sys*. When this strategic goal is going to
    be achieved, however, is anybody''s guess.


    **Dynamically Changing Files—/var** This directory contains dynamically changing
    files, distributed across different directories. When executing various programs,
    the user often creates data (frequently without being aware of the fact). For
    example, the *man* command causes compressed manual page sources to be uncompressed,
    while formatted man pages may be kept around for a while in case they are required
    again soon. Similarly, when a document is printed, the print data must be stored
    before being sent to the printer, e.g., in */var/spool/cups*. Files in */var/log*
    record login and logout times and other system events (the “log files”), */var/spool/cron*
    contains information about regular automatic command invocations, and users’ unread
    electronic mail is kept in */var/mail*.


    Just so you heard about it once (it might be on the exam): On Linux, the system
    log files are generally handled by the “syslog” service. A program called *syslogd*
    accepts messages from other programs and sorts these according to their origin
    and priority (from “debugging help” to “error” and “emergency, system is crashing
    right now”) into files below */var/log*, where you can find them later on. Other
    than to files, the syslog service can also'
