  md: 'Whenever several users have access to the same computer system there must be
    an access control system for processes, files and directories in order to ensure
    that user *A* cannot access user *B*’s private files just like that. To this end,
    Linux implements the standard system of Unix privileges.


    In the Unix tradition, every file and directory is assigned to exactly one user
    (its owner) and one group. Every file supports separate privileges for its owner,
    the members of the group it is assigned to (“the group”, for short), and all other
    users (“others”). Read, write and execute privileges can be enabled individually
    for these three sets of users. The owner may determine a file’s access privileges.
    The group and others may only access a file if the owner confers suitable privileges
    to them. The sum total of a file’s access permissions is also called its **access
    mode**.


    In a multi-user system which stores private or group-internal data on a generally
    accessible medium, the owner of a file can keep others from reading or modifying
    his files by instituting suitable access control. The rights to a file can be
    determined separately and independently for its owner, its group and the others.
    Access permissions allow users to map the responsibilities of a group collaborative
    process to the files that the group is working with.


    # ### 14.2 Access Control For Files And Directories


    # #### 14.2.1 The Basics


    For each file and each directory in the system, Linux allows separate access rights
    for each of the three classes of users—owner, members of the file’s group, others.
    These rights include read permission, write permission, and execute permission.


    As far as files are concerned, these permissions control approximately what their
    names suggest: Whoever has read permission may look at the file’s content, whoever
    has write permission is allowed to change its content. Execute permission is necessary
    to launch the file as a process.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_187_0.png)


    Executing a binary “machine-language program” requires only execute permission.
    For files containing shell scripts or other types of “interpreted” programs, you
    also need read permission.


    For directories, things look somewhat different: Read permission is required to
    look at a directory’s content—for example, by executing the `ls` command. You
    need write permission to create, delete, or rename files in the directory. “Execute”
    permission stands for the possibility to “use” the directory in the sense that
    you can change into it using `cd`, or use its name in path names referring to
    files farther down in the directory tree.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_187_1.png)


    In directories where you have only read permission, you may read the file names
    but cannot find out anything else about the files. If you have only “execute permission”
    for a directory, you can access files as long as you know their names.


    Usually it makes little sense to assign write and execute permission to a directory
    separately; however, it may be useful in certain special cases.


    ![](img/44bdd771e9c9b1353d2401c2892b2459_187_2.png)


    It is important to emphasise that write permission on *a file* is completely immaterial
    if the file is to be **deleted**—you need write permission to the *directory*
    that the file is in and nothing else! Since “deleting” a file only removes a reference
    to the actual file information (the inode) from the directory, this is purely
    a directory operation. The `rm` command does warn you if you’re trying to delete
    a file that you do not have write permission for, but if you confirm the operation
    and have write permission to the directory involved, nothing will stand in the
    way of the operation’s success. (Like any other'
  merge: -1
