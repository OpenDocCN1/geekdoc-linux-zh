  md: 'can manipulate code just as well as addresses or kitchen recipes. (In the old
    days, one would “program” by plugging and unplugging leads on the outside of the
    computer, or programs were punched onto paper tape or cards and could not be changed
    straightforwardly.)


    Today’s computers normally feature 1 gigabyte of RAM or more. 1 gigabyte is $2^{30}$,
    or 1,073,741,824 bytes³ – really an inconceivably large number. By way of comparison:
    Harry Potter and the Deathly Hallows contains approximately 600 pages of up to
    1,700 letters, spaces, and punctuation characters – perhaps a million characters.
    Hence, one gigabyte corresponds to about 1,000 Harry Potter tomes, at somewhat
    more than a pound per book that is already a van full of them, and if you’re not
    just interested in the exploits of the young wizard, 1,000 books is an impressive
    library.


    **Graphics card** Not so long ago people were happy if their computer could control
    an electric typewriter to produce its output. The old home computers were connected
    to television sets, producing images that could often only be called atrocious.
    Today, on the other hand, even simple “smartphones” feature quite impressive graphics,
    and common PCs contain graphics hardware that would have cost the equivalent of
    an expensive sports car or small house in the 1990s. Today’s watchword is “3D
    acceleration”, which doesn’t mean that the display actually works in 3D (although
    even that is slowly getting fashionable) but that *processing* the graphics inside
    the computer does not just involve left, right, top and bottom – the directions
    visible on a computer monitor – but also front and back, and that in quite a literal
    sense: For photorealistic games it is quite essential whether a monster lurks
    in front of or behind a wall, hence whether it is visible or not, and one of the
    goals of modern graphics cards is to relieve the computer’s CPU of such decisions
    in order to free it up for other things. Contemporary graphics cards contain their
    own processors, which can often perform calculations much faster than the computer’s
    own CPU but are not as generally useful.


    > Many computers don’t even contain a separate graphics card because their graphics
    hardware is part of the CPU. This makes the computer smaller, cheaper, quieter
    and more energy-efficient, but its graphics performance will also take somewhat
    of a hit – which may not be an actual problem unless you are keen on playing the
    newest games.


    **Motherboard** The motherboard is the (usually) rectangular, laminated piece
    of plastic that the computer’s CPU, RAM, and graphics card are affixed to – together
    with many other components that a computer requires, such as connectors for hard
    disks, printers, a keyboard and mouse, or network cables, and the electronics
    necessary to control these connectors. Motherboards for computers come in all
    sorts of sizes and colours⁵ – for small, quiet computers that can act as video
    recorders in the living room or big servers that need a lot of space for RAM and
    several processors.


    **Power supply** A computer needs electricity to work – how much electricity depends
    on exactly which components it contains. The power supply is used to convert the
    240 V AC mains supply into the various low DC voltages that the electronics inside
    the computer require. It must be selected such that it can furnish enough power
    for all the components (fast graphics cards are usually the number-one guzzlers)
    while not being overdimensioned so that it can still operate efficiently.


    ³People will commonly call this a “gigabyte”, but a “gigabyte” is really 10⁹ bytes,
    *i.*e., nearly 7 per-cent less.


    ⁴All thanks, incidentally, to the unflagging popularity of awesome computer games.
    Whoever believes that video games are of no earthly use should take a minute to
    consider this.


    ⁵Really! Even though one shouldn’t select one’s motherboard according to colour.'
