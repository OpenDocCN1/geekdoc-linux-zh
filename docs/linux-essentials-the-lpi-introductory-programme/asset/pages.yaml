  md: '**13.15** Groups make it possible to give specific privileges to groups [sic!]
    of users. You could, for example, add all HR employees to a single group and assign
    that group a working directory on a file server. Besides, groups can help organise
    access rights to certain peripherals (e. g., by means of the groups *disk*, *audio*,
    or *video*.)


    **13.16** Use the `“mkdir <directory>”` command to create the directory and `“chgrp
    <groupname> <directory>”` to assign that directory to the group. You should also
    set the SGID bit to ensure that newly created files belong to the group as well.


    **13.17** Use the following commands:


    ```

    # groupadd test

    # gpasswd -a test1 test

    Adding user test1 to group test

    # gpasswd -a test2 test

    Adding user test2 to group test

    # gpasswd test

    Changing the password for group test

    New Password:x9q.Rt/y

    Re-enter new password:x9q.Rt/y

    ```


    To change groups, use the `“newgrp test”` command. You will be asked for the password
    only if you are not a member of the group in question.


    **14.1** A new file is assigned to your current primary group. You can''t assign
    a file to a group that you are not a member of—unless you are *root*.


    **14.3** This is the SUID or SGID bit. The bits cause a process to assume the
    UID/GID of the executable file rather than that of the executing user. You can
    see the bits using `“ls -1”`. Of course you may change all the permissions on
    your own files. However, at least the SUID bit only makes sense on binary executable
    files, not shell scripts and the like.


    **14.4** One of the two following (equivalent) commands will serve:


    ```

    $ umask 007

    $ umask -S u=rwx,g=rwx

    ```


    You may perhaps ask yourself why this umask contains x bits. They are indeed irrelevant
    for files, as files are not created executable by default. However it might be
    the case that subdirectories are desired in the project directory, and it makes
    sense to endow these with permissions that allow them to be used reasonably.


    **14.5** The so-called ‘‘sticky bit’’ on a directory implies that only the owner
    of a file (or the owner of the directory) may delete or rename it. You will find
    it, e. g., on the /tmp directory.


