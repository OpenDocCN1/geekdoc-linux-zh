- pgno: 95
  md: '# # 7.1  Regular Expressions: The Basics


    Many Linux commands are used for text processing—patterns of the form “do xyz
    for all lines that look like this” appear over and over again. A very powerful
    tool to describe bits of text, most commonly lines of files, is called “regular
    expressions” $ ^{1} $ .


    At first glance, regular expressions resemble the shell’s file name search patterns
    (Section 6.3), but they work differently and offer more possibilities.


    +   characters


    Regular expressions are often constructed “recursively” from primitives that are
    themselves considered regular expressions. The simplest regular expressions are
    letters, digits and many other characters from the usual character set, which
    stand for themselves. “ $ a $ ”, for example, is a regular expression matching
    the “ $ a $ ” character; the regular expression “abc” matches the string “abc”.
    Character classes can be defined in a manner similar to shell search patterns;
    therefore, the regular expression “ $ \[a-e\] $ ” matches exactly one character
    out of “a” to “e”, and “ $ a\{xy\}b $ ” matches either “axb” or “ayb”. As in the
    shell, ranges can be concatenated— “ $ \{A-Za-z1\} $ ” matches all uppercase and
    lowercase letters—but the complement of a range is constructed slightly differently:
    “ $ \[^abc\] $ ” matches all characters except “a”, “b”, and “c”. (In the shell,
    that was “ $ \[\!abc\] $ $ ^{*} $ .” The dot, “.”, corresponds to the question
    mark in shell search patterns, in that it will match a single arbitrary character—the
    only exception is the newline character, “ $ \backslash n $ ”. Thus, “ $ a.b $
    ” matches “abc”, “ab/c” and so on, but not the multi-line construction


    +   Character classes


    +   complement


    ![](img/44bdd771e9c9b1353d2401c2892b2459_95_0.png)


    This is due to the fact that most programs operate on a per-line basis, and multi-line
    constructions would be more difficult to process. (Which is not to say that it
    wouldn’t sometimes be nice to be able to do it.)


    While shell search patterns must always match beginning at the start of a file
    name, in programs selecting lines based on regular expressions it usually suffices
    if the regular expression matches anywhere in a line. You can restrict this, however:
    A regular expression starting with a caret (“^”) matches only at the beginning
    of a line, and a regular expression finishing with a dollar sign (“$”) matches
    only at the end. The newline character at the end of each line is ignored, so
    you can use “xyz$” to select all lines ending in “xyz”, instead of having to write
    “xyz\n$”.


    +   Line start


    +   Line end


    > Strictly speaking, “^” and “$” match conceptual “invisible” characters at the
    beginning of a line and immediately to the left of the newline character at the
    end of a line, respectively.


    +   Repetition


    Finally, you can use the asterisk (“*”) to denote that the preceding regular expression
    may be repeated arbitrarily many times (including not at all). The asterisk itself
    does not stand for any characters in the input, but only modifies the preceding
    expression—consequently, the shell search pattern “a*.txt” corresponds to the
    regular expression “ $ a*\\.txt $ ” (remember the “anchoring” of the expression
    to the beginning and end of the input line and that an unescaped dot matches any
    character). Repetition has precedence over concatenation; “ab*” is a single “a”
    followed by arbitrarily many “b” (including none at all), not an arbitrary number
    of repetitions of “ab”.


    +   precedence


    # ### 7.1.1  Regular Expressions: Extras


    +   extensions


    The previous section’s explanations apply to nearly all Linux programs that deal
    with regular expressions. Various programs support different extensions provided:


    > $^{1}$ This is originally a term from computer science and describes a method
    of characterization of sets of strings that result from the concatenation of “letters”,
    choices, and repetitions, and their potentially unbounded repetition. Routines
    to recognize regular expressions are elementary building blocks of many programs
    such as programming language compilers. Regular expressions appeared very early
    in the history of Unix; most of the early Unix developers had a computer science
    background, so the idea was well-known to them.'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'ing either notational convenience or additional functionality. The most advanced
    implementations today are found in modern scripting languages like Tcl, Perl or
    Python, whose implementations by now far exceed the power of regular expressions
    in their original computer science sense.


    Some common extensions are:


    Word brackets  The “^” matches the beginning of a word (a place where a non- letter
    precedes a letter). Analogously, “$” matches the end of a word (where a letter
    is followed by a non-letter).


    Grouping  Parentheses (“(... )”) allow for the repetition of concatenations of
    regular expressions: “a(bc)*” matches a “a” followed by arbitrarily many repetitions
    of “bc”.


    Alternative  With the vertical bar (“|”) you can select between several regular
    expressions. The expression “motor (bike | cycle | boat)” matches “motor bike”,
    “motor cycle”, and “motor boat” but nothing else.


    Optional Expression  The question mark (“?”) makes the preceding regular expression
    optional, i. e., it must occur either once or not at all. “ferr??(man)?” matches
    either “ferry” or “ferryman”.


    At-Least-Once Repetition  The plus sign (“ +”) corresponds to the repetition operator
    “*”, except that the preceding regular expression must occur at least once.


    Given Number of Repetitions  You can specify a minimum and maximum number of repetitions
    in braces: “ab{2,4}” matches “abb”, “abbb”, and “abbbb”, but not “ab” or “abbbbb”.
    You may omit the minimum as well as the maximum number; if there is no minimum
    number, 0 is assumed, if there is no maximum number, “infinity” is assumed.


    Back-Reference  With an expression like “\n” you may call for a repetition of
    that part of the input that matched the parenthetical expression no. n in the
    regular expression. “(ab)\1”, for example, matches “abab”, and if, when processing
    “(ab*a)\1”, the parentheses matched aba, then the whole expression matches ababaaba
    (and nothing else). More detail is available in the documentation of GNU grep.


    Non-Greedy Matching  The “*”, “ +”, and “?” operators are usually “greedy”, i.
    e., they try to match as much of the input as possible: “a.*a” applied to the
    input string “abacada” matches “abacada” or “abaca”. However, there are corresponding
    “non-greedy” versions “*?”, “ +?”, and “??”, which try to match as little of the
    input as possible. In our example, “a.*?a” would match “aba”. The braces operator
    may also offer a non-greedy version.


    Not every program supports every extension. Table 7.1 shows an overview of the
    most important programs. Emacs, Perl and Tcl in particular support lots of extensions
    that have not been discussed here.


    # ## 7.2  Searching Files for Text—grep


    Possibly one of the most important Linux programs using regular expressions is
    grep. It searches one or more files for lines matching a given regular expression.
    Matching lines are output, non-matching lines are discarded.


    There are two varieties of grep. Traditionally, the stripped-down *fgrep* (“fixed”)
    does not allow regular expressions—it is restricted to character strings—but is
    very fast. *egrep* (“extended”) offers additional regular expression operators,
    but is a bit slower and needs more memory.'
