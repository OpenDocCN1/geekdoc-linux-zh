    \ find out more about `echo` and `date` in Chapter 9.)\n\nYou can obtain help\
    \ for internal Bash commands via the `help` command:\n\n```\n```\n$ help type\n\
    type: type [-afpt] name [name ...]\n        For each NAME, indicate how it would\
