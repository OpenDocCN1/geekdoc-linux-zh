    # 14.4 Positional variable parameters


    At the beginning of this chapter, I said that there were four types of variables,
    local and environment, plus two other types considered special because they are
    read-only. These are positional and special variable parameters. Let''s look at
    the positional variables.


    When you want to pass information to a shell script, you can access this information
    using positional parameters. A number references each parameter passed to a script.
    You can pass as many arguments as you like but you can only access the first nine
    parameters, though you can get around this limitation using the command shift.
    We will shift in action later on in the book. The parameters start at one and
    finish at each; each parameter you wish to access should be prefixed by a dollar
    ''$''. The first parameter which is zero is reserved to hold the actual script
    name; this value can be used whether there are parameters to the script or not.


    If you want to pass the following string ‘Did You See The Full Moon’, to a script,
    the following table demonstrates how each parameter would be accessed.'
