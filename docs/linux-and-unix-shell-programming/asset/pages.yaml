  md: "```\nelse\necho \"Staff Number: No Input Detected, This Field Requires a Number\"\
    \n  continue_prompt\nfi\ndone\n```\n\nWe keep everything enclosed inside a while\
    \ loop (in fact each data entry field is enclosed inside a separate while loop),\
    \ so if there is an invalid entry, the prompt will return to its original read\
    \ place.\n\nAfter reading the staff number, we check that there is actually some\
