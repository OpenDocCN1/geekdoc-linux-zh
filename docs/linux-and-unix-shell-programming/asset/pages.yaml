  md: '# 138 Using sed


    To be able to edit after an append, you must first save the file then run another
    sed command to edit it, so the file''s contents are moved to the buffer area.

    The format for the append is:


    ```

    [address]a\ntext\ntext\ntext

    ```


    The address can specify either a pattern or line number to which the new text
    should be appended. The \a tells sed to actually append the text following the
    ''\a\'' sign. Looking at the format, please note that there is a backslash after
    each text line. This backslash preserves the new line, and when sed sees the backslash,
    it will create a new line then insert the next line of text. The last line does
    not need a backslash, since sed will assume that is the end of the append commands.

    When appending or inserting text or keying in a few sed commands you can take
    advantage of the secondary prompt that lets you enter multi-line commands from
    the shell. We won''t do that here, since it leaves users open for typos, and it
    is better to do it in a script file. That''s what we do now. Beside, scripts you
    have blank lines in them and comment lines that make for better readability of
    the script.


    # 10.4.12 Creating a sed script file


    Create a new file append.sed and stick the following commands in it:


    ```

    $ pg append.sed

