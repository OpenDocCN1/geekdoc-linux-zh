    \ bit of code left is the actual conversion process, which is the tr command.\
    \ This will be put at the end of the script again using a case statement with\
    \ the for loop to read in the filenames to process.\nHere's the full script:\n\
    \n```\n$ pg tr_case\n!/bin/sh\n# tr_case\n# convert files to either upper or lower\
    \ case\n```"
