    # 20.2 getopts


    getopts allows you to write code that can easily handle multiple command line
    arguments. Getopts is used to bring some form of standard in command line processing.
    After all, scripts should have the ability to conform to the standard format of
    command options files.


    # 20.2.1 An example getopts script


    getopts is better understood with an example. Here is a simple getopts script
    that will take the following options or arguments.


    +   -a Set the variable ALL to true

