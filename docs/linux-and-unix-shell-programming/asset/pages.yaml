    # 14.4.4 Last exit status


    Notice the $ returns 0. You can use this on any command or script to tell you
    if the last command was successful. Based on this information you can take further
    action in your scripts. 0 returned means ok; 1 returned errors. Here''s an example.
    We first copy a file to /tmp and check the result, using $?


    ```

    $ cp ok.txt /tmp

    echo $?

    0

    ```


    We now try to copy a file to a non-existent directory:


    ```

    $ cp ok.txt /usr/local/apps/dsf

    cp: cannot create regular file ''/usr/local/apps/dsf'': No such file or directory

    ```


    ```

    $ echo $?

    1

    ```


    Using $? to check the return status we can see this is 1, so we know we have a
    problem. But you can see the system ''cp:cannot...'' error so there is no need
    to check the exit status. In your scripts you will do some form of processing
    using system commands, and you do not want the output from the commands messing
    up your screen, so you will probably redirect the all output to /dev/null, the
    system''s bin. Now how are you going to tell if the last command was successful?
    That''s right, using the last command. Let''s see all that action using our last
    example.


    ```

    $ cp ok.txt /usr/local/apps/dsf >dev/null 2>&1

    echo $?

    1

    ```


    By redirecting all output including errors into the system''s bin, we cannot tell
    if the last command worked. But by using $?, which returns 1, we now know that
    it failed.'
