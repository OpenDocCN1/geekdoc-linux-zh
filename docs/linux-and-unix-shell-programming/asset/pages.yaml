  md: '# 19.6 Using functions in the shell


    When you have collected a few functions that you use regularly you can put them
    in a function file and load the file into the shell. This method is called sourcing
    or using the dot command.


    The file should contain the #!bin/sh at the top of the file. The file can be anything
    you like, but before you call it something meaningful to its task, for example
    `functions.main`.


    Once the file is loaded into the shell, you can call the functions from the command
    line or your script. To see all your defined functions use the set command. The
    output will contain all the functions that have been loaded into the shell.


    To make changes to any of your functions first use the unset command to delete
    the function from the shell. Unset deletes the function so that it is no longer
    available to call from your scripts or the shell – the actual function is not
    physically deleted. By making your changes to the function then reload the file.
    Some shells will recognize the change and you may not need to use unset, but to
    be safe always use the unset command when you want to make changes to shell functions.


    # 19.7 Creating a function file


    Let''s create a function file that holds one function. We will load it into the
    shell, test it, make a change then reload it.


    Create a file called functions.main and type in the following:


    ```

    $ pg functions.main

    #!/bin/sh

    # functions.main

    #

    # findit: this is front end for the basic find command

    findit() {

    if [ $ -lt 1 ]; then

    echo "usage :findit file"

    return 1

    fi

    find / -name $1 -print

    ```


    The above is a script used previously in the book, but now it has been turned
    into a function. It''s a front end to a basic find command. If no argument is
    passed to it, a return with a value of 1 is executed meaning errors have occurred.
    Notice on the error statement that the actual function name is shown, because
    if we used $0, the shell would simply return a sh- message. The reason you get
    this message is because the file is not a script file. Either way this type of
    message is not very helpful to the user.'
