  md: "You may think that the script above will process until there are no more arguments\
    \ left on the command line. Wrong. I'm afraid. Because there is no way to shift\
    \ to the next parameter inside the script, it will just keep echoing out the first\
    \ argument. Here's how it looks when executed:\n\n```\n$ opt2 file1 file2 file3\n\
    file1\nfile1\nfile1\n...\n```\n\n# 20.1.1 Simple use of shift\n\nTo be able to\
    \ process each argument passed we need to use the shift command. Here's the modified\
    \ script:\n\n```\n$ pg opt2\n!/bin/sh\n# opt2\nloop=0\nwhile [ $$ -ne 0 ]   #\
    \ while there are still arguments\nd\n  echo $1\n  shift\ndone\n```\n\nWhen we\
    \ execute it, we get a better result:\n\n```\n$ opt2 file1 file2 file3\nfile1\n\
    file2\nfile3\n```\n\n# 20.1.2 Last parameter supplied on the command line\n\n\
    Though we haven't covered the eval command yet, if your script needs to know the\
    \ last parameter supplied on the command line (which is generally a filename)\
    \ you have two choices. Using eval you can use eval echo \\$$; using shift you\
    \ can use: shift `expr $$ - 2`.\n\n# 20.1.3 Using shift to process file conversions\n\
    \nSeeing how shift works the job of handling command line options easier. Let's\
    \ construct a case conversion script, that will use tr to convert files to either\
    \ upper case or lower case."
