  md: '# 66 Command execution order


    You don''t always have to use system commands; here I run the script comet on
    a file called month_end.txt. If the script bombs out, the shell should terminate
    (exit).


    ```

    $ comet month_end.txt || exit.

    ```


    # 6.3 Grouping commands using () and {}


    To run several commands as a group effort all at once, the shell provides two
    methods. You can either run the group in the current shell or in a subshell.


    +   - To run a list of commands in the current shell, separate each command with
    a command separator, and enclose the list with round brackets.

    The general format is:


    ```

    (command1;command2;...)

    ```


    To run a command in the subshell exactly the same but use {} instead of (). The
    general format is:


    ```

    {command1,command2;..}

    ```


    I do not use these methods by themselves very often. The only time I use grouping
    operators is in conjunction with the && or ||.

    Going back to our comet script example, if the script failed I would probably
    want to execute two or more commands, not just one. Using the grouping method
    I can do this. Here''s the original example:


    ```

    $ comet month_end.txt || exit

    ```


    Now if the comet script failed, and I wanted to mail myself, and then exit, all
    I need to do:


    ```

    $ comet month_end.txt || (echo "Hello, guess what! Comet did not work"|mail dave;
    exit)

    ```


    If I had just used command separators without the grouping the shell would automatically
    go to the last statement, which is exit.

    Going back to the sort example using the && operator, here it is below:


    ```

    $ sort quarter_end.txt > quarter.sorted && lp quarter.sorted

    ```


    Using the grouping method, if the sort command worked, copy the output to a log
    area and then print the file.


    ```

    $ sort quarter_end.txt > quarter.sorted && ( cp quarter.sorted /logs/quarter.sorted;
    lp quarter.sorted )

    ```'
