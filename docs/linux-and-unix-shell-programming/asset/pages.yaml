  md: '# 180 Using tr


    where ''file-to-translate'' holds the file you want translated and ''new-file-name''
    is what you want the new file to be called. For example:


    ```

    cat myfile | tr "[A-Z]" "[a-z]" > lower_myfile

    ```


    # 12.1.6 Lower to upper case


    Converting lower to upper case is just the reverse of the previous section. Here
    are a couple of examples.


    ```

    echo "Look for the route, or make the route" | tr "[a-z]" "[A-Z"

    LOOK FOR THE ROUTE, OR MAKE THE ROUTE

    ```


    ```

    echo "May Day, May Day, Going Down.." | tr "[:upper:]" "[:lower:]"

    may day, may day, going day...

    ```


    To translate a file from lower to upper case and place it in a new file using
    this format:


    ```

    cat file-to-translate | tr "[A-Z]" > new-file-name

    ```


    where ''file-to-translate'' holds the file you want translated and ''new-file-name''
    is what you want the new file to be called. For example:


    ```

    cat myfile | tr "[a-z]" "[A-Z]" > upper_myfile

    ```


    # 12.1.7 Deleting certain characters


    Occasionally, you may need to delete columns from a downloaded file that may contain
    only letters or numbers. To do this you need to use the ''-c'' and ''-s'' options
    together.


    The file below contains part of a diary for a week. The task is to get rid of
    all the numbers and just leave the days of the week. You''ll see the days are
    in both lower and upper case format, so we use both character ranges, [a-z] and
    [A-Z]. The command tr -cs "[a-z] "[A-Z]" "[[:digit:]]", will take all the file
    contents that are not in [a-z] or [A-Z] (all alpha characters) held in string,
    and convert them to new lines. Using the ''-s'' option tells tr to ''squeeze''
    all the new lines. This keeps all the alpha characters intact. Here''s the file
    holding the diary info, followed by the tr command.


    ```

    $ pg diary.txt

    monday 10:50

    tuesday 15:30

    wednesday 15:30

    thursday 10:30

    friday 09.20

    ```'
