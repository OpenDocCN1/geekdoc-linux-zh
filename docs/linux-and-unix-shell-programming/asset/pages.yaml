- img_proc: true
  md: '# 84 The grep family


    # 8.1.2 grep options


    The most useful options are:


    +   - c print only the count of matching lines.

    - i ignore upper/lower case, treat upper and lower case as the same (this only
    works for single characters).

    - h do not display the names of the files when searching through multiple files.

    - l print only the names of the files containing matches when searching through
    multiple files.

    - n display all matching lines with their line number.

    - s please not display error messages on non-existent or non-text files.

    - v print all lines except those that contain a match.


    # 8.1.3 Searching more than one file


    If I wanted to search for the string "sort" in all my .doc files in my directory
    I would do this:


    ```

    $ grep "sort" * .doc

    ```


    Or I could search through all the files that have the word "sort it".


    ```

    $ grep "sort it" *

    ```


    Let’s see how some of these grep options work against our text file.


    # 8.1.4 Line matches


    ```

    $ grep -c "48" data.f

    $ 4

    ```


    Grep has returned the number 4; it’s saying it has found four lines that contain
    the string 48.


    Let’s see what those lines are, using the 48 as the string:


    ```

    $ grep "48" data.f

    48 Dec 3BC1997 LPS 68.00 LVX2A 138

    483 Sept 5AP1996 USP 65.00 LVX2C 189

    484 nov 7PL1996 CAD 49.00 PLV2C 234

    483 may 5PA1998 USP 37.00 KVM9D 644

    ```


    # 8.1.5 Line numbers


    We can see what line numbers match our pattern with:'
  merge: -1
  pgno: 109
- img_proc: true
