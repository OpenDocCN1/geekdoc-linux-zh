  md: '# 26.5 logger command


    The system maintains quite a few log files. One of these log files is called messages,
    usually located in /var/adm or /var/log. Messages that are logged into this file
    are carried out via a configuration file called syslog; the messages are in a
    strict format. To see how your system is configured for generating messages from
    checks out the /etc/syslog.conf. This file holds all the different priorities
    and facilities that a program can use to send different message types.


    We will not go into how UNIX or LINUX logs messages to the file. All we really
    need to know for now is that there are different levels of messages ranging from
    informational to critical.


    You can send messages to the message file using the logger command. You need to
    check with your man page on the logger command, because this command syntax is
    varied between vendors.


    However, as we will be covering informational messages you should be safe with
    commands we are going to cover.


    You may want to send messages to the message file for any of the reasons:


    +   Accessing/Logins over a certain period;

    Critical processing of one of your scripts failed; or

    Monitoring reports.


    Here''s what my /var/adm/messages file looks like. Yours will be slightly different:


    ```

    $ tail /var/adm/messages

    Jun 16 20:59:03 localhost login[281]: DIALUP AT ttyS1 BY root

    Jun 16 20:59:03 localhost login[281]: ROOT LOGIN ON ttyS1

    Jun 16 20:59:04 localhost PAM_pwdb[281]: (login) session closed for user

    root

    Jun 16 20:58:38 localhost named[211]: Cleaned cache of 0 RRs

    Jun 16 20:58:39 localhost named[211]: USAGE 929570318 929566719

    Jun 16 20:58:39 localhost named[211]: NSTATS 929570318 929566719

    ```


    The general format of the logger command for our purposes is:


    where:


    +   -p Means the priority; we are only concerned with user.notice which is the
    default anyway

    -i Log the process ID with each message'
