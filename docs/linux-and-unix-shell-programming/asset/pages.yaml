    this makes the script more readable.


    ```

    $ cp ok.txt /usr/local/apps/dsb >/dev/null 2>&1

    $ cp_status=$?

    $ echo $cp_status

    ```


    # # 14.5 Conclusion


    Variables can make your life easier in the shell; they can save you typing and
    improve your productivity. A shell variable can contain almost any value. Special
    variables give your scripts better functionality and more information about which
    parameters are passed to the scripts.'
