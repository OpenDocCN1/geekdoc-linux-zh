    L.Tsey 05/99 4712 Brown-2 12 30 28

    ```


    We have seven fields in this test file, containing (1) name, (2) date of grade,
    (3) student number, (4) belt awarded, (5) age of person, (6) points gained so
    far in competition, and (7) maximum points available from competitions.


    Because each field is separated by spaces we do not have to use the -F option
    to specify a different field separator or delimiter. Let''s now see the file and
    get some data out.


    For clarity of display in the examples I have expanded the spaces so the individual
    fields can be viewed more easily.


