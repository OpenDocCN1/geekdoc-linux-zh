    \n# 18.6.3 Monitoring disk space\n\nThe until loop is also very useful for monitoring\
    \ conditions. Suppose we wanted to monitor a filesystem capacity, and to mail\
    \ root when it hits a certain level.\nThe next script monitors the filesystem\
    \ /logs. It continuously pulls information from the variable $LOOK_OUT, which\
    \ holds the capacity of /logs, using awk and grep.\nIf the capacity goes above\
    \ 90%, the command part is triggered, root would mailed, and the script exits.\
    \ The exit is needed because if we did not exit and the condition remained true\
    \ (for example, it always remained 90%), root would be continuously.\n\n```\n\
    $ pg until_mon\n!/bin/sh\n# until_mon\n# get percent column and strip off header\
    \ row from df\nLOOK_OUT=`df | grep /logs | awk '{print $5}' | sed 's/%//g'\necho\
    \ $LOOK_OUT\nuntil [ \"$LOOK_OUT\" -gt 90 ]\ndo\necho \"Filesystem..logs is nearly\
    \ full\" | mail root\nexit 0\ndone\n```\n\n# 18.7 while loop\n\nThe while loop\
    \ is used conditionally to execute a series of commands. It is also used to read\
    \ data from a input file. The format of the while loop is:\n\n```\nwhile command\n\
    do\n  commands1\n  commands2\n  ...\ndone\n```\n\nSeveral commands can be placed\
    \ between the while and do, though generally one is used, and the command is usually\
    \ a test condition.\nThe commands after the do and up to the done will be executed\
    \ only if the exit status of the command is zero; if the exit status is anything\
    \ else, the loop will terminate."
