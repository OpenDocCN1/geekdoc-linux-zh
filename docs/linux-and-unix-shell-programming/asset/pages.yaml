    $ find -size +10 -print

    ```


    # 2.1.10 Find files by depth


    When you use find, you probably want to find go look at all the files before hitting
    any of the directories or sub-directories. Force to do this by using the ''depth''
    option. One of the reasons for using depth is when you are using find to back
    up a system to tape, and you want it to go through all the files before going
    down all sub-directories it finds.


    Find starts at the root file system searching for a file called ''CON.FILE''.
    It will look at each file starting on any of the directories and sub-directories.


    ```

    $ find -name "CON.FILE" -depth -print

    ```


    # 2.1.11 Find files by mount


    To find files only on the current filesystem and not on other (mounted) filesystems
    use the following find option. Here we use find to search only on the current
    filesystems for all files that end with ''.XC'':


    ```

    $ find -name "*.XC" -mount -print

    ```


    # 2.1.12 Find files using cpio


    Cpio is used for archiving and from tape. You can use find to search all, but
    more probably some of, the system''s directory structure, and pipe it through
    to cpio straight on tape.


    To use find to backup the /etc. /home and /apps directory path to tape using cpio,
    make sure that you are in the root directory:


    ```

