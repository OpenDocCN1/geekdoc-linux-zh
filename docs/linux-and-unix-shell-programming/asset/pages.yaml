    # 10.4.16 Substituting text


    The substitute command substitutes the addresses pattern with a replacement pattern.
    The format is:


    ```

    [address,address] s/pattern-to-find/replacement-pattern/[ g p w n]

    ```


    The s sed that a replacement command is coming and should search for ''pattern-to-find''
    and if successful replace it with ''replacement-pattern''.

    The substitute options are as follows:


    +   g By default only the first occurrence of the pattern is substituted. Using
    the ''g'' option will make it global and all occurrences substituted.

    p By default sed writes all lines substituted to standard output. Use the ''p''
    option which will override the ''-n'' option, which prints no results out.

    w Use this option to append to a filename.


    Let''s look at some examples using the substitute command. To change night into
    NIGHT, we can do the following. What the following command is saying is find the
    pattern ''night'' then replace it with the text ''NIGHT''.


    ```

    $ sed ''s/night/NIGHT/'' quote.txt

    The honeysuckle band played all NIGHT long for $90.

    ```'
