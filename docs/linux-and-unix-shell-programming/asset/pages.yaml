- img_proc: true
  md: '# 11.1.1 A word to the wise


    The sort utility in UNIX is very powerful, though care has to be taken when using
    different combinations of the sort options as they can lead to unexpected results.
    The options for sort are very long, and even I have trouble sometimes working
    out what the different switches actually do compared to the results I get. I reckon
    that there is definitely some ambiguity when combining the different options in
    sort.


    I will not go into the discussions on the different sort methods (but you can''t
    beat a good bubble sort; it''s slow, very slow, but by watching the numbers interchange)
    or what the different combination of switches do. This chapter will deal with
    the main sort options, using lots of examples. Other commands that work seamlessly
    with sort uniq, join and paste, which will also be covered, along with split.


    As mentioned above, the options of the sort command are very long. Here are the
    options we''ll be using in this chapter.


    # 11.1.2 sort options


    This is the general format of the sort command:


    ```

    Sort -cmu -o output-file [other options] +pos1 +pos2 input-files

    ```


    Lets now go over the sort parameters:


    +   -c Test to see if the file is already sorted

    -m Merge two sorted lines

    -u Delete all duplicate lines

    -o Name of an output file, for the sort results


    Other options:


    +   -b Ignore any leading blanks, when using fields to sort on

    -n Specify that this sort is to be a numerical sort on this field(s)

    -t Field separator; the fields are separated by non-blanks or a tab

    -r Reverse the sort order or comparisons

    +n Where n is a field number, start sorting using this field number

    -n Where n is a field number, ignore this field for sorting comparisons, usually
    used in conjunction with +n

    Pos Transforms to m.n where m is the field number and n is how many characters
    in start to start the sort on, for example, 4.6 means the start on field 5, starting
    seven characters in'
  merge: -1
  pgno: 180
- img_proc: true
  md: '# 11.1.3 Saving output


    The ''-o'' option to save the results from your sort. However, you can use the
    redirection method to save the output. The following example saves the results
    to a file called `results.out:`


    ```

    $ sort video.txt >results.out

    ```


    # 11.1.4 How sort starts


    By default, `sort` expects the separator to be a blank space, or series of blank
    spaces. If you have fields separated by other means, use the -t option to set
    it.


    When sort is invoked to look to see if the ''-t'' option has been set for the
    field separator; if so it will use this to divide the fields into field 0, etc.
    If ''-t'' has not been set, sort uses the blank() as field separators. By default,
    sort will order the whole line unless you specify field numbers.


    Below is a listing of a file called `video.txt`, which contains ''top video rentals''
    of the local video shop for the last quarter. The fields are (1) video title,
    (2) supplier area code, (3) rentals this quarter, and (4) rentals this year. The
    field separator is the colon. Because it''s a colon we use the ''-t:'' option
    on all sort examples for the video file. Here''s the file:


    ```

    $ pg video.txt

    Boys in Company C:HK:192:2192

    Alien:HK:119:1982

    The Hill:KL:63:2972

    Aliens:HK:532:4892

    Star Wars:HK:301:4102

    A Few Good Men:KL:445:5851

    Toy Star:HK:239:3972

    ```


    # 11.1.5 How sort references fields


    One other thing to remember about `sort` is that it references the first field
    as field 0, then uses field 1 for the second field and so on. `sort` can also
    use the whole line to sort. Confusing — you bet it. By using our video file, the
    fields should be referenced by the user and sort as:


    | Field 0 | Field 1 | Field 2 | Field 3 |

    |--- | --- | --- | --- |

    | Star Wars | HK | 301 | 4102 |

    | A Few Good Men | KL | 445 | 5851 |


    `sort` will address the fields, and so should we really, as field 0 as sort key
    0, field 1 as sort key 1 and so on.'
