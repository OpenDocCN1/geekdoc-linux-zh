  md: 'To enable SSI that the server knows to look for SSI commands inside documents,
    you have to uncomment lines that have server-passed in the configuration files.
    In apache this is:


    ```

    Addhandler server-passed.shtml

    Addtype text/html html

    ```


    You will need to restart your server; use -1 to make the server reread its config
    files. The documents that are going to have SSI in them need the file extension
    of .shtml instead of .html.


    # 29.4.4 Access counter


    Let''s create a document that displays an access counter. You know the type: ''you
    are the nth vistor to this site''. We will also display the date when the page
    was last modified.


    Don''t forget to place this script in your cgi-bin directory; call it hitcount.cgi.


    ```

    $ pg hitcount.cgi

    #!/bin/sh

    # hitcount.cgi

    # hit page counter for html <cgi>

    # counter file must be chmod 666

    counter=../cgi-bin/counter

    echo "Content-Type: text/html"

    echo ""

    read access <$counter

    access=`expr $access + 1''

    echo $access

    echo $access>$counter

    ```


    As you can see, the script reads the file ../cgi-bin/counter, assigns the value
    that it reads to the variable access, adds one to it, then echoes the result back
    into the file /cgi-bin/counter.


    Let''s create a file counter. All we need to do is create a file called counter
    and insert ''1'' (do not insert the quotes), then save and exit.


    As everyone will need to use this file, the permissions need to be read and write
    for user, group and other.


    ```

    $ chmod 666 counter

    ```


    All that''s left to do now is create the .shml file and place this file in your
    root Web directory, usually where all your other HTML documents are located, either
    in htdocs or html directory. Here''s the file; do not forget to have an extension
    of .shtml:'
