    # 29.5.3 Populating a list


    For your HTML pages to be really dynamic, you will probably want to populate

    your lists or tables with current information from an existing file, instead of
    hard

    coding them in your c scripts.


    In the following script, a pull down list is populated with information from a

    text file called, which is situated in the temp directory, off the root web server.
    A

    while loop is used to read in the contents (one line at a time) from the file
    to

    populate the list options. The code assignment to populate is:


    ```

    echo "<OPTION>SLINE"

    ```


    The selected option is assigned to the variable menu_selection.

    Here''s the script that will populate a menu, no form action is specified.


    ```

    $ pg populat.cgi

    #!/bin/sh

    # populat.cgi

    # populate a pull down list from a text file

    echo "Content-type: text/html"

    echo ""

    echo "<HTML>

    echo "<BODY>

    echo "<H4> CGI FORM...cgi..populat.populate pull-down list from a text

    file</H4>

    echo "<SELECT NAME=menu_selection>

    echo "<OPTION>-- PICK AN OPTION --"

    # read in the file to populate into the list options

    while read LINE

    do

    echo "<OPTION>$SLINE"

    done ../temp/list

    echo "</SELECT>

    echo "</FORM>"

    echo "</BODY>

    echo "</HTML>"

    ```'
