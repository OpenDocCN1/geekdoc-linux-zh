  md: '# 58 Shell input output


    # 5.1 Common file redirection commands


    | Command > filename | Send standard output to a new filename |

    | Command >> filename | Send standard output to filename (appended) |

    | Command l > filename | Send standard output to filename |

    | Command > filename 2&1 | Send all output (including errors) to filename |

    | Command 2 > filename | Send standard error to filename |

    | Command 2 >> filename | Send standard error to filename (appended) |

    | Command > filename 2&1 | Send all output (including errors) to filename (appended)
    |

    | Command < filename > filename2 | Command gets its input from filename and sends
    command output to filename2 |

    | Command < filename | Command gets its input from filename |

    | Command << delimiter | Read standard input until delimiter encountered |

    | Command &m | Read standard input from descriptor m |

    | Command >&m | Write standard output to descriptor m |

    | Command <&- | Close standard input |


