  md: '# 29.5.4 Automatically refreshing a Web page


    When using cgi for monitoring or watchdog tasks, it is sometimes convenient to
    have your page continuously refreshed. To do this you call your own script or
    page. Here is a command that will refresh the script dfspace.cgi every 60 seconds.


    ```

    < meta http-equiv="Refresh" content="60;URL=http://linux.pe/cgi-bin/dfspace.cgi">
    >

    ```


    The word here is Refresh. This lets the Web server know that this page is to be
    reloaded, and ''content=60'' is the number of seconds between each reload. To
    refresh your own script add your script name as part of the address.


    I have a few monitoring scripts that poll all major hosts on the network. I can
    tell at all if a host is up or down. To make it prettier I use green and red balls,
    instead of displaying on and off in text.


    Below is a script that uses part of the df output, and displays the system and
    capacity fields in a table.


    The following segment code is just a table header to put the table headings in.
    When using tables with row output it is a case of hit and miss until you get the
    desired effect.


    ```

    echo

    ```


    Cellspacing sets the distance between the inner and outer borders of the table.
    Border holds a number that controls the thickness of the table border. Cols determines
    how many columns there are going to be in the table.


    Here''s the meat of the script.


    ```

    df | sed 1d | awk ''{print $5\t$6}'' | while read percent mount

    do

    echo "<TR><TD align="center">B$percent</TD><TD align="center">

    $mount</TD></TR"

    done

    ```


    Using df we pipe through to delete the heading, then pipe through awk and read
    in the fifth and sixth columns, assigning the output to the variables percent
    and mount.


    TR stands for table row and TD for table data. This is where the items of information
    go.'
  merge: -1
  pgno: 505
- img_proc: true
  md: 'Here''s the script. Admittedly 60 seconds is overdoing a bit to monitor file
    systems, but if you are doing massive file migrations across file systems, it
    can keep you informed right up to the minute!


    ```

    $ pg dfspace.cgi

    !/bin/sh

    # dfspace.cgi

    echo "Content-type: text/html"

    echo ""

    # auto refresh every 60 secs

    echo "<meta http-equiv="Refresh" content="60;URL=http://linux.pc/cgi-bin/dfspace.cgi">

    necho "<HTML>

    echo "<HR>"

    echo "<A NAME=LINUX.PC Filesystems>LINUX.PC Filesystems</A>"


    echo "<TABLE align="center" cellspacing="20" border=9 width="40%" cols="2">

    necho "<TH align="center">- Capacity % -</TH>"

    echo "<TH align="center">- File System -</TH>"

    # get the output from df, but first filter what we only need!

    df | sed 1| awk ''{print $5"\t""$6"}'' | while read percent mount

    ```


    ![](img/2e76db7c3055a9c7e42ddd582e8a9059_506_0.png)


    Figure 29.15 Using output from the df command to generate tables'
