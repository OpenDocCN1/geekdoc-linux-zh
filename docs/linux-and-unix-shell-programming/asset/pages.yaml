  md: '```

    $ grep "Davey Wire" /etc/passwd

    grep: Wire: No such file or directory

    ```


    To fix this, just double quote the string, which informs the shell to ignore the
    spaces. You should always use double quotes when using strings, whether they are
    single or multi-words.


    ```

    $ grep "Davey Wire" /etc/passwd

    davyboy:9dDJUK2:106:Davey Wire:/home/ap

    ```


    You can use double quotes to include a variable inside an echoed line of text.
    In the next example the shell echoes the line of text, but sees the ''$'' and
    acknowledges it as a variable, then substitutes the variable $BOY with the value
    boy.


    +   - BOY="boy"

    $ echo The $BOY did well

    The boy did well


    ```

    $ echo "$BOY" did well

    The boy did well

    ```


    # 15.3 Single quote


    The single quote is very similar to the double quote except it tells the shell
    to ignore any type of value evaluation; in other words, to treat everything inside
    the quotes as it was disabling its special meaning – a case of what you type between
    the single quotes is what you get. Using the sample example as in the double quote:


    ```

    $ GIRL=''girl''

    $ echo ''The $GIRL'' did well

    The ''girl'' did well

    ```


    # 15.4 Back quote


    The back quote is the one to use when you want to assign output from system commands
    to variables. It tells the shell to take whatever is between the back quotes as
    a system command and execute its output. Using these methods you can then substitute
    the output into a variable. You can also combine quotes, as we shall see in a
    moment.


    In the following example, the shell has tried to evaluate and substitute the word
    hello; because there is no command or script called hello, it responds with an
    error.


    ```

    $ echo ''hello''

    sh: hello: command not found

    ```'
