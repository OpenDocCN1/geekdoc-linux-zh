  md: '# 7.8 Conclusion


    Knowing regular expressions and how to use them is an important part of shell
    programming, making the difference between an OK script and a good script. It
    saves you time in coding if you know what text to extract in one command, instead
    of using three or four different commands to get the same result.


    Now that we have gone over the basic special characters used for regular expressions,
