    29.10 The data in the form is fully decoded


    # 29.5.2 post method


    The post method is the same as the get method with regards to how the string is
    encoded. The difference is how the post method gets the data; it reads it in from
    standard input. To send data using the post method, simply replace the get with
    post in the FORM action statement of your script.


    ```

    < FORM action="cgi-bin/conv.cgi" METHOD= POST>

    ```


    The variable CONTENT_LENGTH will hold the total bytes sent when using the post
    method. We read the string from standard input, and do the same conversion as
    we did with the get method. The read stops after the amount of bytes equals the
    amount contained in CONTENT_LENGTH.


    All we need to do is to make a small change to the form action statement then
    we will have a generic form decoder. To read from standard input we can use the
    cat command. Here is the statement we need to add to our script conv.cgi, so it
    can handle both get and post methods.


    ```

    if [ "REQUEST_METHOD" = "POST" ]; then

    QUERYSTRING=`cat -`

    fi

    ```


    Notice the hyphen in the cat command, this allows cat to read from standard input.'
