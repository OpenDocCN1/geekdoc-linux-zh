    \ for this. All sides of the equation must be true, if the part is to be executed.\n\
    \nIf the test passes, we now have a validated field. Because we are in a continuous\
    \ while loop all we need to break out of with the command break.\n\n```\nif |\
    \ \"LEN_PASS\" = \"0\" -a \"SNUM_PASS\" = \"0\" -a \"DUPLICATE\" = \"0\"\n; then\n\
    break\n```\n\nIf any part of the validation fails either on the length or numeric\
