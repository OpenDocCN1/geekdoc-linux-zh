    \ does not tie up your terminal. Use the & command.\nThe general format is:\n\n\
    ```\ncommand &\n```\n\nWhy would you run a command in the background? Well, running\
    \ it in the background it now at that instant without tying up your terminal.\
    \ Tasks ideal for this are find, big print jobs, big sorts, and scripts. Please\
    \ be careful with background processing: do not use commands that require user-input,\
    \ or your process will sit there nothing.\n\nHowever, because jobs are running\
    \ in the background all output would still hit your terminal. If you are running\
    \ a command that puts a lot of output to the screen it's best to redirect it to\
    \ a file, using this format:\n\n```\ncommand >out.file 2>&&\n```\n\nThe above\
    \ format sends all standard output and errors to the file out.file. When you submit\
    \ a job in the background its process number is displayed, which can be used to\
    \ kill or monitor the process if we want.\n\n# 3.3.1 Submitting a command to the\
    \ background\n\nLet us run a find that starts from the root filesystem, and we'll\
    \ send any output to a file called find.dt. Find will look for a file called srm.conf.\n\
    \n```\n$ find /etc -name \"srm.conf\" -print >find.dt 2>&1\n[1] 27015\n```\n\n\
    In the above example, after we have submitted the find command to the background,\
    \ its process number, which is 27015, is displayed. \n\nWhen the job has finished,\
    \ a message is displayed when you hit any key, which is generally the <return>\
    \ key."
