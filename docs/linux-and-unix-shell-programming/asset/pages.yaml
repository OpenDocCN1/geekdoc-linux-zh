- img_proc: true
  md: "# 18.4.1 Simple case statement\n\nThe following script prompts for a number\
    \ 1 to 5. The number is passed down to the case statement, the variable ANS is\
    \ assigned to the case value ANS, and ANS is compared against each pattern.\n\n\
    If a match is found, the commands inside the pattern part are executed until it\
    \ sees the;; In this case, it will just echo a command informing the user what\
    \ selection was made. The execution of the case will terminate, because a match\
    \ has been found.\n\nProcessing can continue after the case statement. If a match\
    \ is not found, it will be trapped using the *, pattern, which traps anything.\
    \ The error message is then executed.\n\n```\n$ caseselect\n!/bin/sh\ncaseselect\n\
    echo -n\"enter a number from 1 to 5 :\"\nread ANS\ncase $ANS in\n1) echo \"select\
    \ 1\"\n  ;\n2) echo \"select 2\"\n  ;\n3) echo \"select 3\"\n  ;\n4) echo \"select\
    \ 4\"\n  ;\n5) echo \"select 5\"\n  ;\n*) echo \"`basename $0`: This is not between\
    \ 1 and 5\" >&2\n  exit 1\n  ;\nesac\n```\n\nWhen we run this script with different\
    \ input we get.:\n\n```\n$ caseselect\nenter a number from 1 to 5 : 4\nyou select\
    \ 4\n```\n\nUsing the pattern * traps anything else that does not match:\n\n```\n\
    $ caseselect\nenter a number from 1 to 5 :pen\ncaseselect: This is not between\
    \ 1 and 5\n```"
  merge: -1
  pgno: 283
- img_proc: true
  md: "# 18.4.2 Using with pattern matching\n\nWhen using case you can also specify\
    \ the | symbol as an or command. For example, vt100|vt102) will match the patterns\
    \ vt100 or vt102.\n\nIn this example, the user is asked for his or her pattern,\
    \ a match will occur with the pattern 'vt100|vt102)'. The command to execute is\
    \ the setting of the TERM variable to vt100. If the user puts in a terminal type\
    \ that is not matched against the pattern, the * will trap it and set it to vt100\
    \ anyway. Finally, outside of the case statement, the TERM is exported. No matter\
    \ what the user enters, TERM will hold a valid terminal type because we used the\
    \ * pattern match.\n\n```\n$ caseterm\n!/bin/sh\n$ caseterm\necho choices are..\
    \ vt100, vt102, vt220\necho -n\"enter your terminal type :\nread TERMINAL\ncase\
    \ $TERMINAL in\nvt100|vt102) TERM=vt100\n  ;\nvt220) TERM=vt220\n  ;\\*) echo\
    \ `basename $`: Unknown response >&2\necho \"setting it to vt100 anyway, so there\"\
    \nTERM=vt100\n  ;\nesac\nexport TERM\necho Your terminal is set to $TERM\n```\n\
    \nWhen the script runs and we input an invalid terminal type we we get\n\n```\n\
    $ caseterm\nchoices are.. vt100, vt102, vt220\nenter your terminal type :vt900\n\
    caseterm : Unknown response\nsetting it to vt100 anyway, so there\nYour terminal\
    \ is set to vt100\n```\n\nFor a correct terminal type we get\n\n```\n$ case2\n\
    choices are.. vt100, vt102, vt220\nenter your terminal type :vt220\nYour terminal\
    \ is set to vt220\n```\n\nEither way, the user is set up with a terminal type."
  merge: -1
