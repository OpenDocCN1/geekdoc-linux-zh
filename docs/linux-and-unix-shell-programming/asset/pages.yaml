    \ I first started putting a file update or database system together, one of the\
    \ most frustrating things was the lack of clear documentation on\n\nA live running\
    \ script would have a menu connecting the different tasks or module, or most probably\
    \ a suite of functions contained in a file with one menu script. Each script contains\
    \ the trap command; signals 2, 3 and 15 are ignored.\n\n# 22.1 Adding records\n\
    \nThe tasks involved in adding a record to a file are the following:\n\n+   1.\
    \ Validate the input.\n2. Write the record(s) to a file.\n\nThe first task we\
    \ need to do some functions together that can tell us whether the fields are numeric\
    \ or character based and the length of the fields. This will be our data input\
    \ validation, which will be used with records that are added as amended. Luckily\
    \ we already have some of these functions at hand.\nFunction to check the length\
    \ of a string:\n\n```\nlength_check()\n{\n# length_string\n# $1=$2 length of string\
    \ not to exceed this number\n_STR_MAX=$2\n_LENGTH=`echo $STR |awk '{print length($0)}`\n\
    if [ \"$LENGTH\" -gt \"$MAX\" ]; then\n  return 1\nelse\n  return 0\nfi\n}\n```\n\
    \nFunction to check whether a string contains all numeric data:\n\n```\na_number()\n\
    #a_number\n# $1= string\n{\n_NUM=$1\n_NUM=`echo $1|awk '{if($0~/[^0-9]/) print\
    \ \"1\"}'`\n```"
