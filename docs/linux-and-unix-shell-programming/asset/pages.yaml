    # 29.4.2 Displaying the output of a shell command


    Let us now put a shell command in the script so the output of the command is displayed
    in an HTML document.

    We will see how many users are logged on. Using the who we will filter it through
    the wc command to get the number of users. We will also print the date. Here''s
    the script.


    ```

    $ pg pagetwo.cgi

    !/bin/sh

    # pagetwo.cgi

    # display a page using the output from a unix command

    MYDATE=date +%A "%d" "%B" "%Y"

    USERS=wc -l

    echo "Content-type: text/html"

    echo ""

    echo "<H1><CENTER>THIS IS MY SECOND CGI PAGE</CENTER></H1>"

    echo "<HR>"

    echo "<H2><CENTER>$MYDATE</CENTER></H2>"

    echo "Total amount of users on to-day is :USERS"

    echo "<PRE>"

    if [ "$USERS" -lt 10 ]; then

    echo      "It must be early or it''s dinner time"

    echo      "because there ain''t many users logged on"

    echo "</PRE>"

    echo "</HTML>"

    ```


    At the start of the script, we get the date and current connections. The date
    is echoed on the centre of the page. The variable USERS is also displayed. A small
    statement is used to determine if the number of users is less than then; if is,
    type the message "It must be early or it''s dinner time".

    The tag <PRE> is used to preserve all formatting of white spaces and tabs. You
    should as a rule use <PRE> when you want to display the output of'
