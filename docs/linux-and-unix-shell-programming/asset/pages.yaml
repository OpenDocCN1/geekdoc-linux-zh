    # 9.2 awk built-in variables


    Awk has a number of built-in variables that allow you to get more information
    about your environment. You can also change some of the variable values. Table
    9.3 shows the most useful ones, and a brief explanation of each variable follows.


    # 9.3 Awk''s built-in variables


    +   - ARGC The number of command-line arguments

    - ARGV The array of command-line arguments

    - ENV Holds the current system environment variables in the array

    - FILENAME The name of the current file awk is scanning

    - FNR The record number in the current file

    - FS Sets the input field separator; same as the command -F option

    - NF Number of fields in the current record

    - NR The number of records read so far

    - OFS Output field separator

    - ORS Output record separator

    - RS Controls the record separator


    The ARGC holds the number of command-line arguments that are passed to the awk
    script. ARGV are the elements of the array ARGC. Referencing ARGV[n], where n
    is the command-line argument you wish to access.


    ENVIRONMENT holds all the environment variables that are. To access the individual
    variables you use the actual variable name, for example ENVIRONMENT("EDITOR")
    = "vi".


    FILENAME holds the current input-file the script is actually working on. Because
    awk can process many files this variable, if accessed, will tell which file is
    being scanned at that time.


    FNR holds the current record awk is working on; its value when accessed is less
    or equal to NR. If you are accessing many files in a script this variable will
    be reset for each new input-file.'
