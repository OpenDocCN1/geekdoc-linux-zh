  md: '# 10.10 Using sed on the system


    We have now gone over the basics of sed, but what you really use for in your scripts
    or on the shell line is changing or deleting text from strings or files. That''s
    what we will look at next, using what we have learnt in the previous section.


    # 10.10.1 Dealing with control characters


    One task for which you''ll use a sed lot is stripping off control characters from
    files that have been downloaded from another system.

    Here''s a part of a file (dos.txt) that has been transferred. We''ve got to get
    rid of all the suspect characters that the accounts department can use the file.


    ```

    $ dos.txt

    12332##DISO#45.12*M

    00332##LPSO#23.11*M

    01299##USPD#34.46*M

    ...

    ```


    +   - Replace all the hash symbols (##) with a single space.

    - Delete all leading zeros (00) from the first field.

    - Delete all the carriage returns (`M) from the end-of-lines.


    On some systems that I have to convert, I have seen ^ and ^L carriage returns,
    so don''t worry if you see weird characters as they are all the same and on the
    end of each line.

    We''ll carry out each task to make sure we get the required results before moving
    to the next task. We will keep using the original dos.txt file as input.


    Task 1. To delete all the hash symbols is easy; just do a global substitute, stating
    that two or more hash symbols must be replaced with a space.


    ```

    $ sed ''s/#//# /g'' dos.txt

    12332 DISO 45.12*M

    00332 LPSO 23.11*M

    01299 USPD 34.46*M

    ```


    Task 2. To delete all leading zeros, we use the ^ sign to the pattern must start
    at the beginning of the line. We''ll use ^* to trap any number of leading zeros.
    The pattern: ''s/^0*/g''. Here''s use nothing in the replacement part of the substitution,
    because this will in effect delete the pattern, which is what we want.'
  merge: -1
  pgno: 172
- img_proc: true
  md: '$ sed ''s/^//g'' dos.txt

    12332##DISO##45.12M

    332##LPSO##23.11M

    1299##USPD##34.46M


    Task 3. OK, then to get rid of the ''M'' at the end of the lines we''ll need to
    do a global substitution. We will not put anything in the replacement pattern
    part. Here''s the pattern: ''s/''M//g''. Be careful now on the ''M'', since it''s
    a character.


    To generate the character control (^M) we need to follow the same process as we
    generated the F1 key sequences earlier on. So, to get the ''M'', do the following:
    type sed ''s//''; hold down the <Ctrl> key then the v key, release the v key and
    hit the ^ key whilst holding down the <Ctrl> key; now release both keys, and finally
    hit the <return> key. This command will now get rid of the ^M at the end of the
    lines.


    $ sed ''s/"//g'' dos.txt


    Showing each task on how to get rid of all the unwanted characters helps you to
    understand the whole picture. It is important that you test each step before on
    to the next one when dealing with sed, because if not you''ll leave yourself to
    owe some weird and unexpected results.


    Now we have tested each task we can put all these commands together using pipes.
    The sed commands are exactly the same ones we have been doing in each of the steps
    to filter out the characters.


    ```

    $ cat dos.txt | sed ''s/^//g'' | sed ''s/^M//g'' | sed ''s/##*/ | /g''

    12332 DISO 45.12

    332 LPSO 23.11

    1299 USPD 34.46

    ```


    Now the file is ready for the accounts department.

    We could stuck the commands in one file and then run it. Here''s the one-liner
    converted into a script.


    ```

    $ pg dos.sed

    !/bin/sed -f

    # name: dos.sed

    # to call: dos.sed dos.txt

    ```


    ```

    # get rid of the hash marks

    s///##g

    ```


    ```

    # get rid of the leading zeros

    s/^//g

    ```'
