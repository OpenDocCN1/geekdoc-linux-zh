- img_proc: true
  md: "# 28.2 Finding your current run level\n\nThis chapter is not about system administration,\
    \ as a shell programmer you should be aware what rc.scripts are and how they fit\
    \ into run level configuration directories. By the way, if you need to know what\
    \ your current run level is:\n\n```\n$ -r\n  run-level 4 Apr 22 13:26 4 0\n```\n\
    \nThe number after the 'run level' is the current run level. The date following\
    \ that is the last time the system was rebooted.\n\n> If it's LINUX then...\n\
    \  $ runlevel\n  2 3\nnThe first column is the level the system was previously\
    \ on, and the current one is the second column, which is run level 3.\n\n# 28.3\
    \ Bringing you up to speed on initab\n\nA run level directory consists of a collection\
    \ of scripts that start off services. The word 'services' in this context means\
    \ a demon, application, servers, subsystems or script process. A process called\
    \ init (init is the father of all processes) is invoked during the boot process\
    \ of the system. Part of its job is to see what services it should start, and\
    \ what run level it should default to. It gets this information by looking at\
    \ a text configuration file called initab, located in /etc. Init also consults\
    \ this file for loading special processes. If you ever need to edit this file,\
    \ make a backup first. If this file gets corrupted or there are 'degrading' errors\
    \ the system will not boot normally; you will have to boot to single user mode\
    \ and fix the.\n\nThe initab contains fields that have a very strict format. The\
    \ format of is:\n\n```\nid:restart:action:process\n```\n\nThe id field is a unique\
    \ name that identifies the process entry.\nThe restart contains a number which\
    \ specifies at what run level the process should be started.\nThe action field\
    \ tells init how to treat this process. There are many action names, but the most\
    \ common ones are wait and respawn. To wait when the process has been started\
    \ waited for to terminate. To respawn means to start the process even if it does\
    \ not yet exist, and if it does exist to restart it as soon as the process dies."
  merge: -1
  pgno: 468
- img_proc: true
  md: '# 444 Run level scripts


    The process field contains the actual command to execute. Here’s part of an inittab
    file.


    ```

    $ pg /etc/inittab

    id:3:initdefault:


    # System initialization.

    sii:sysinit:/etc/rc.d/rc.sysinit

    # run run level 0

    # 10:0:wait:/etc/rc.d/rc 0

    # run level 1

    # 11:1:wait:/etc/rc.d/rc 1

    # run level 2

    # 12:2:wait:/etc/rc.d/rc 2

    # run level 3

    # 13:3:wait:/etc/rc.d/rc 3

    # run level 4

    # 14:4:wait:/etc/rc.d/rc 4

    # run level 5

    # 15:5:wait:/etc/rc.d/rc 5

    # runlevel 6

    # 16:6:wait:/etc/rc.d/rc 6

    #Run getys in start runlevels

    1:2345:respawn:/sbin/mingget tty1

    2:2345:respawn:/sbin/mingget tty2

    3:2345:respawn:/sbin/mingget tty3

    4:2345:respawn:/sbin/mingget tty4

    5:2345:respawn:/sbin/mingget tty5

    6:2345:respawn:/sbin/mingget tty5vt100

    ```


    The first line of the file is the run level the system should default to; here
    it’s run level 3 which is no surprise.


    The lines that start with the numbers 10 to 16 to stop or all the run level scripts
    for that particular run level. For instance, the following line


    ```

    15:5:wait:/etc/rc.d/rc 5

    ```


    states that we are in run level 5 the script /etc/rc.d/rc should be run with its
    parameter being 5, which means /etc/rc.d/rc will run all scripts in /etc/rc.d/rc5.d.


    Looking at the last line of the file, at run levels 2, 3 and 4 the process is
    to be spawned, which means it never dies; well, not for more than a second probably.
    The process being kicked off is mingetting on the serial port tty1. A parameter
    to this is the terminal ID, which is vt100.


    # 28.4 Now for the run levels


    One of the last tasks init before the system ‘comes up’ is to run all the scripts
    for the default run level. The file that calling this is either /etc/rc.d/rc or'
