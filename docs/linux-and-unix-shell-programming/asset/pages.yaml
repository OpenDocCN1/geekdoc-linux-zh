- img_proc: true
  md: '# Your $HOME .profile 19


    Set the umask value, which enables file creation, with certain permission bits
    set by default


    Initialize environment variables. Set the path and export it so they are available
    to everyone.


    Reset the trap to catch signals, <CTRL-C> and QUIT.


    Save the default stty setting now, so that we can reinitialize the terminal settings
    when the users come out of the audit system.


    Log all connections to /var/adm/messages, which is my default syslog file.


    Using the ulimit command, you can limit the number of core dumps or hex dumps.
    A little code segment allows users to log in twice concurrently, from three people
    (idink, psalm, dave). Kick the others out if they try to log in more than twice.


    Finally set the command prompt to your login name. Your environment is now set
    for global use. Now let''s customize it a bit with our profile.


    # 13.2 Your $HOME .profile


    When the /etc/profile has been executed, you are then put into your own $HOME
    directory. Looking back at the passwd file, this location is the second from the
    last stuff.


    You may regard this as your home, as this is where you keep all your private


    If there is a .profile the system will source this file. Source means not to create
    another shell for this process, thus keeping all your existing environments (/etc/profile)
    intact from any changes the file (.profile) would make otherwise. When you create
    another process, your local shell variables, for all intents and purposes, are
    overwritten.


    Back to the .profile. Generally when an account is set up, a skeleton file is
    always present. One important to remember is that you can override the settings
    made in the /etc/profile by making a new entry in your .profile with a different
    value or by using the unset command. It''s up to you if you want to customize
    the file, so let''s look at a standard .profile file.


    ```

    $ pg _profile

    #.profile

    set -a

    MAIL=/usr/mail/${LOGIN:}

    PATH=$PATH

    export PATH

    #

    ```


    Let''s now tailor the file.'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# 192 The login environment


    We want to set up a couple of environment variables, like EDITOR, cron and other
    applications know about the editor we are using. I do not like using vt20, so
    I''ll stick to vt100. We''ll use that for our TERM variable.


    We can also create a bin directory and add it to our path. It''s always a good
    idea to have a binary directory, as this is where you can keep all your scripts,
    and adding it to your PATH, you do not have to type the full path of the script
    to execute it, just type the script name.


    Who wants a command prompt showing their own login name? You''d be surprised.
    I don''t. I would rather have the current directory path as my prompt, or maybe
    the hostname of the system that I am using. Here''s how to set the hostname.


    ```

    $ PS1=''hostname\''

    dns-server>>

    ```


    Or for the current directory you are in:


    ```

    $ PS1="\pwd\''"

    home/dave>

    ```


    If the above prompt returns ''pwd'', use this instead:


    ```

    PS1=''$PWD >;

    ```


    For my secondary prompt (this gets used when you are doing a multi-line command
    at the command prompt) I like to have the copyright sign ©. The ASCII character
    value for that is the octal number 251; in decimal it is 169.


    ```

    $ PS2="echo \"251\":nhome/dave> while read line

    C:do

    C:echo $line

    C:done

    ```


    ```

    If it''s LINUX, then...


    To use an octal value in an echo command use


    PS2=''echo -e "251\":''

    ```


    I also have access to our admin area, located in /usr/admin, so let''s add that
    as an environment variable, so I can easily cd to the directory.


    ADMIN=/usr/admin'
  merge: -1
  pgno: 217
- img_proc: true
  md: 'I also like to know how many users are on the system as soon as I log in. You
    can use the who and wc command to do this.


    ```

    $ ''who wc -l'' users are on today

    ```


    19 users are on today.


    Let''s add the above to our .profile file. For any changes in the .profile or
    /etc/profile to take effect, you either have to log out then back in again or
    source the file. To source a file format is:


    ```

    . /pathname/filename

    ```


    To source the .profile file just type


    ```

    $ .profile

    ```


    and if the above does not work, try


    ```

    $ ./profile

    ```


    Here''s our newly amended .profile file.


    ```

    $ pg .profile

    #.profile

    MAIL=/usr/mail/${LOGNAME?}

    PATH=$PATH:$HOME:bin

    #

    EDITOR=vi

    TERM vt100

    ADMIN=/usr/adm

    PS1="hostname"

    PS2="echo "\0251""

    export EDITOR TERM ADMIN PATH PS1

    echo "who|wc -1 users are on to-day"

    ```


    # 13.3 Using stty


    Stty is a command that lets you set up your terminal characteristics. To find
    out your current stty options, use stty -a.


    ```

    $ stty -a

    speed 9600 baud; rows 24; columns 80; line = 0;

    intr ^C; quit =^; erase =^; kill ^U; eof =D; eol =undef>

    line2=<undef; start =^; stop =^Z; susp ^Z; rprnt ^R; werase = ^W;

    next =^V; flush =O; min =1; time =0;

    ```'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# 194 The login environment


    -parenb -parodd cs8 -hupcl -cstop cread -clocal -crtscts

    -ignbrk -brint -ignpar -parmk -inpck -istrip -lncr -igncr icnl ixnl

    -ixoff -iucl -ixany -imaxbel

    opost -olcut -ocrnl -oloncr -olret -ofill -ofdel nl0 cr0 tab0 bs0

    vt0 ff0 isig ican ienon echo echok -echonal -noflsh -xcase

    -topstop -echoprt echoctl echoke


    One of the most common problems when setting up a terminal is that the backspace
    key does not work. i.e. it is destructive. My stty command reports that it is
    using ^ for the backspace key; well it isn''t working. Using CTRL-H will probably
    backspace and destroy any previous characters so let''s use stty to sort that
    out. The general format to set an stty option on the command line is:


    stty name character.


    Here’s how to set the backspace to `H`:


    ```

    $ stty erase ''\^H''

    ```


    You may have problems using the above stty command to work in the .profile file,
    because stty may expect an actual `control H` sequence. To fix that use the following
    format when you are in vi.


    Hold the control key down with the v key, then release the v key, and then hit
    the H key.


    The most common stty names you will come into contact with are:


    | Name | Key | Meaning |

    | intr | ^C | terminate a process |

    | echo | | turn echo on |

    | -echo | | turn echo off |

    | eof | ^D | end-of-file, log out |

    | kill | ^Y | delete a line |

    | start | ^Q | scroll text of screen |

    | stop | ^S | stop scrolling text on screen |


    A very useful stty option is:


    stty -g


    This option allows you to save the current contents of stty in a readable format,
    so that it can be assigned back to stty later on, just like we saw in the /etc/profile
    earlier. All you have to do is put the contents of stty -g into a variable, do
    any stty changes you require then read it back to stty when you have finished.'
  merge: -1
  pgno: 219
- img_proc: true
  md: 'A good case for using this is when you are changing stty values and you accidentally
    mess up your terminal: you then easily restore the original setting. Below is
    an example of saving then restoring the current settings of stty. stty -g to turn
    the echo off restore the original setting at the end of the script.


    ```

    $ pg password

    !/bin/sh

    # password

    # show use of the restoring stty environment

    SAVEDSTTY=''stty -g''

    stty -echo

    echo "\nGive me that password \c"

    read PASSWD

    echo "\nyour password is $PASSWD"

    stty $SAVEDSTTY

    ```


    ```

    $ stttypass

    Give me that password :

    your password is bong

    ```


    If it''s LINUX, then...

    To let LINUX know you are going to use escape characters in strings, the echo
    command should start ''echo -e''


    SAVEDSTTY=''stty -g''

    stty -echo

    echo "\nGive me that password \c"

    read PASSWD

    echo "\nyour password is $PASSWD"

    stty $SAVEDSTTY


    The stty command allows you to tweak your terminal, printers or modems; it is
    very versatile. Be careful though when using stty; do not use a key that is already
    in use, or it will not work.


    # 13.4 Creating a .logout file


    One of the drawbacks of using the Bourne shell is that unlike other shells, it
    does not have a .logout file. This file holds commands that you executed just
    before your session is terminated when you issue an exit command.


