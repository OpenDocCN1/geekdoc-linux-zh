    # Selective joins


    To select the fields that you want joined, use the ''-o'' option. Suppose you
    wanted to create a file that had just the names and towns of the people. Join
    would still do the matching, but would display only the fields you specify. Here''s
    how it''s done.

    To display only the first file and first field in that file, use 1.1; to display
    only the second field in the second file, use 2.2. Both options are separated
    by commas. The command is:


