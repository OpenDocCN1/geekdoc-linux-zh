  md: "# 324 Passing parameters to scripts\n\n```\n$ tr_case -u -l -k\n-u option specified\n\
    -l option specified\nusage:tr_case [-1lu] file [files]\n```\n\nThe next step is\
    \ to handle the files that come in after the options have been trapped in the\
    \ case statement. To do this, a slight change is required in the case statement.\
    \ The catch pattern '*' of the case statement should be changed to '-*', to allow\
    \ for invalid options being passed, for example -p or -q.\nThe '*' pattern will\
    \ be where we collect all the filenames that are passed so we can process each\
    \ file later on with a for loop. We will also check that the filenames are present\
    \ are, using the -f option.\nSo our amended case statement will now look like\
    \ this:\n\n```\ncase\n...\n-**) usage\n  ;\n*) if [-f $1 ]; then\n    FILES=$FILES\"\
    \ $1  # assign the filenames to a variable\n  else\n    echo \"basename $0 cannot\
    \ find the file $1\"\n  fi\n  shift # get next one!\n  ;\nesac\n```\n\nWe also\
