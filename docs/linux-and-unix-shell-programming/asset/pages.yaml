  md: '# CHAPTER 23


    # Debugging scripts


    One of the most annoying tasks of shell scripting is debugging problems. There
    are aids to help you but, to prevent most errors before they happen, follow this
    rule:


    Break your proposed script down into tasks or procedures, then code and test each
    procedure before continuing with the next step.


    In this chapter we will cover:


    +   - common errors; and


    +   - introducing the set command.


    There is really nothing more irritating than trying to discover an elusive error
    in your script. However, as you get more experienced in scripting you''ll know
    what to look for.


    The most common problems are missing quotes or not having a fi on the end of an
    statement.


    One important thing to remember is that when the shell reports an error from your
    script, do not look only at the suspect line but also at the block of code in
    which it is contained. The shell does not always report the exact location of
    the error; rather it reports when it is trying to close off a statement.


    # 23.1 Common errors


    # 23.1.1 The loop error


    Errors that are reported on the for.while, until or case statements mean the actual
    statement block is incorrect. You have missed out a reserved word for that construct.'
  merge: -1
  pgno: 408
- img_proc: true
  md: '# 384 Debugging scripts


    The following error below reports the word ''done'', which is a good clue, since
    you know it is something to do with a statement. Looking back through your code
    check out the while statement for any missing words, like ''do'', or the conditional
    statement you are using.


    # 2.3.1.2 The classic missing quote


    The second error is the classic missing quote error. Learn to like this one, because
    you will see a lot of these. The only solution I offer on this type of error is
    to go through your script making sure that all quotes are paired off.


    ```

    unexpected EOF while looking for"

    line 36: syntax error

    ```


    When the shell reports the line number with the error, it is usually in tune with
    vi set nu option, so use that when looking at a file in vi. Load vi up, hit <ESC>
    followed by a colon, then type set nu <return>. Your lines will be numbered, so
    go to the line that reported the error on.


    # 2.3.1.3 The test error


    Another common error is using the -eq statement you forget to use a number value
    either side of the test condition.


    If you get the following error, then it is most certainly due to one of two things;
    either you need a space between your variables and the square bracket, or you
    have a missing operator inside the square bracket. I bet it''s the first one I
    mentioned.


    ```

    : missing '' '']

    ```


    # 2.3.1.4 Character case


    From my experience most errors are due to not keeping the same (character) case
    when using variables. For instance I will almost certainly start using upper case,
    then I may reference the variable using lower case, and I wonder why I get no
    values.


    # 2.3.1.5 for loops


    The for loop I will sometimes forget to put the dollar sign on the list part of
    the loop, if I am reading it in from a string.'
  merge: -1
