  md: "# 21.2.8 Using function keys with your scripts\n\nYou can see what control\
    \ sequence any of the special keys (F1, up arrow etc.) are sending by using the\
    \ cat command. Type cat -v then press any control key to make your terminal is\
    \ sending down the line. When you have finished just press <CTRL-> to quit.\n\n\
    In this example cat is invoked. The keys pressed are F1 ([OP]) and the up arrow\
    \ key (^[A]).\n\nOnce you have this information you can then insert these characters\
    \ into your scripts as additional methods of user selection.\nThe following script\
    \ recognizes keys F1, F2 and the arrow keys. Your values may be different so use\
    \ the cat command to see what values your terminal control keys first.\n\n```\n\
    $ cat -v\n^[OP]^[^[[A\n<CTRL-C>\n```\n\n```\n$ pg control_keys\n#!/bin/sh\n# control_keys\n\
    # to insert use '<CTRL-V>ESCAPE>sequence'\nuuparrow='^[[A'\ndnarrowkey='^[[B'\n\
    leftarrow='^[[D'\nrightarrow='^[[C'\nf1key='^[[OP'\nf2key='^[[OQ'\n```\n\n```\n\
    echo -\" Press a control key then hit return\"\nread KEY\n\nCase $KEY in\n$uparrow)\
    \ echo \"UP Arrow\"\n  ;\n$downarrow) echo \"DOWN arrow\"\n  ;\n$leftarrow) echo\
    \ \"LEFT arrow\"\n  ;\n$rightarrow) echo \"RIGHT arrow\"\n  ;\n$f1key) echo \"\
    F1 key\"\n  ;\n$f2key) echo \"F2 key\"\n  ;\n*) echo \"unknown key $KEY\"\n  ;\n\
    esac\n```"
