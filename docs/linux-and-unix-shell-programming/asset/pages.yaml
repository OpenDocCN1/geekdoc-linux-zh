  md: '# 7.5 Escaping the meaning of a special character using \


    We may want to search for characters or they may contain a character that is considered
    a special character. What is a special character? For general purposes you may
    consider any of the following characters to be special characters


    S . '' * | 1 | 0 \ + ?


    Suppose we wanted to match any lines that had a period `.` in them. We know `.`
    is a special character that lets you match any single character, so we need to
    disable this meaning. Here''s how we would do it:


    \


    The above says do not treat the character after the backslash as a special character,
    but treat it literally; in this case, treat it as a period.


    Suppose we wanted to match any lines containing a caret in them. We put the backslash
    in to turn off the special meaning of the character ^, as follows:


    ^


    If you wanted to match all files that ended with *.pas within a regular expression
    we could do this as follows:


    ```

    \*\.pas

    ```


    which means disable the special meaning of the character *.


    # 7.6 Matching ranges or sets using []


    To match certain specific characters or ranges of characters use []. You can separate
    the different characters that you want to match inside the brackets with commas;
    this is not mandatory (some systems do moan if you don''t use commas on complex
    expressions) but it does make the pattern more readable.


    To specify a range of characters use the dash (-). This specifies a set or range
    where the range starts on the left-hand side of the dash and finishes on the right-hand
    side of the dash.


    You should always use the [] when you want to home in on a string match. Suppose
    we wanted to match any single number, we could use:


    ```

    [0123456789]

    ```'
