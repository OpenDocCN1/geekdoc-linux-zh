    # 26.2.1 Killing a process


    Sending a signal 1 allows a process to re-read its configuration file. For instance,
    if you are running the process named the DNS demon, and you make changes to the
    database files, you do not have to kill the demon and restart it, just send it
    a kill -1. Named will just re-read its configuration files.


    Here''s an example of sending a signal 9 (sure kill) to kill a process called
    mon_web running on your system. First use ps to get the process.


    ```

    $ ps -ef | grep mon_web |grep -v root

    157 ? S 0:00 mon_web

    ```


    If your system does not use ps -ef use xa instead. To kill it I can use either:


    kill -9 157


    or


    kill -s SIGKILL 157


    On some systems you don''t have to supply the -s, for example: kill SIGKILL 157)


    The following script will kill a process based on a process name. The name of
    the process to be killed is supplied as a parameter. A check is performed that
    there is actually a process to be killed. Grep the job of finding any matched
    process names. If successful you are prompted with the processes found and asked
    if you want to kill them. A kill -9 is used to kill the process.


    Here''s the script.


    ```

    $ pgskill

    !/bin/sh

    # pskill

    HOLD1=/tmp/hold1.$$

    PROCESS=$1

    usage()

    {


    # usage

    echo "Usage: `basename $0` process_name"

    exit 1

    }

    ```'
