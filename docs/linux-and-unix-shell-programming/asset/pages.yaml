    \ risk !!!!\n# format is user AMEND/DELETE records\n# example root yes means root\
    \ can amend or delete recs\n#\ndave no means dave cannot amend or delete recs\n\
    root no\ndave no\npeter yes\nlouise yes\nmatty no\n```\n\nTo check user accesses\
    \ we first read the file in, ignoring comment lines and redirecting any other\
    \ lines to a temp file.\n\n```\nuser_level()\n{\nwhile read LINE\ndo\n  case $LINE\
    \ in\n    \\*);\n      echo $LINE >>$HOLD1\n      ;;\n  esac\ndone < $USER_LEVELS\n\
    ```\n\n```\nFOUND=false\nwhile read MENU_USER_PRIV\ndo\n  if [ \"$MENU_USER\"\
    \ = \"$USER\" ];\n  then\n    FOUND=true\n    case $PRIV in\n      yes|YES)\n\
    \        return 0\n        ;;\n    no|NO)\n        return 1\n        ;;\n  esac\n\
    ```"
