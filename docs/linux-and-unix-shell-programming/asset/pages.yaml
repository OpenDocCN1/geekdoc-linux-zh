  md: '# 208 Environment and shell variables


    # SHELL


    The SHELL contains your default shell, usually picked up from /etc/passwd, but
    you can override it you feel you need to use another shell.


    ```

    $ echo $SHELL

    /bin/sh

    ```


    # TERMINFO


    The terminal initialization variable holds the location of your terminal configuration
    files. Usually this is in either /usr/lib/terminfo or /usr/share/terminfo.


    ```

    $ TERMINFO=/usr/lib/terminfo; export TERMINFO

    ```


    # TERM


    The TERM variable holds the name of your terminal type. This is used so that applications
    know what type of control sequences your terminal understands for the screen and
    keyboard. The most common terminal types are vt100, vt220, vt220-8, wysec


    ```

    $ TERM=vt100; export TERM

    ```


    # TZ


    The time zone variable holds the time zone value. It is the system administrator''s
    job to do this. But as you may wish to change it for your shell, here are a couple
    of examples:


    ```

    $ echo $TZ

    GMT2EDT

    ```


    The value returned means that we are using Greenwich Mean Time, with 0 local time
    difference from GMT, and Eastern Daylight Saving is in operation.


    # 14.3.5 Other environment variables


    There are other environment variable names that are reserved; other system or
    commands applications will pick these up. Here are the most common ones. Remember
    the values may not have been set; it''s up to you to set them.


    # EDITOR


    Set this variable to the editor you like using the most.


    ```

    $ EDITOR=vi; export EDITOR

    ```'
