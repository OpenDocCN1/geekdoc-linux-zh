  md: '# CHAPTER 16


    # Introduction to shell scripts


    A shell script may contain one or contain several commands; there is no rule.
    Then why use a script for a couple of commands? You don''t have to if you don''t
    want to.


    In this chapter we will cover:


    +   - reasons for using a shell script;

    - basic components of a shell script; and

    - how to run a shell script.


    # 16.1 Reasons for using a shell script


    Shell scripts can save you time in automating repetitive or long tasks and are
    very powerful. After all, why have a list of commands that does a certain task,
    where you have to enter the commands manually then look at the output, then decide
    if it''s the right output expected? If it is, great, carry on with the next task.
    If it isn''t, look back to the list to see what to do. A task can be anything
    including sorting a file, inserting text into it, migrating files, deleting lines
    from a file, cleaning up old files around the system, doing general administrative
    work on the system. Creating a script using variables, conditional, arithmetic
    and iteration constructs, with a touch of system commands, enables to rapidly
    create a script that does the job saving yourself hours of work compared to if
    you had carried it out manually. The shell can take information from one command
    and use it for input another command. Even with the different UNIXs and LINUXs
    around, using a script will require little altering to run on all of them. In
    fact shell portability is not the problem but rather system command portability
    is.'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# 226 Introduction to shell scripts


    # 16.1.1 Try out new ideas


    When you create a script, do not be afraid if it doesn''t exactly as you thought
    it would; just remember that no matter what unexpected damage the script does
    you can restore it. Now do you have backups don''t you? The point I''m trying
    to make is not be afraid to try out new things. If you don''t you will not be
    doing yourself justice and most importantly you will not learn.


    # 16.2 What a script contains


    This book is not about good scripting design techniques, but good reusable code.
    You do not have to make the script complicated when it can achieve the same results
    through solid understandable code. If I wrote a book that way, I might impress
    you, but it would take a lot longer for you to get to grips with the code. This
    is not my goal; my code works and it works using basic scripting techniques, which
    you will learn more quickly. You will then be able to impress your friends more
    quickly!


    A script is not a compiled program: it is interpreted, line by line. The first
    line of the script should always start with


    ```

    #!/bin/sh

    ```


    This lets the shell know where the Bourne interpreter is to be found on the system.


    Any script can have comments: to put comments into your script, the first character
    of the line should be a hash (#), and the interpreter will ignore these lines.
    It is good practice to include the name of the script as the second line down
    as a comment.


    A script is read from top to bottom. To be able to run a script, it must first
    be executable. Make sure your path is set up properly, so your scripts can be
    run by supplying only the file name.


    # 16.3 Running a script


    Here''s an example of what we have just discussed. Here is a file called cleanup.


    ```

    $ pg cleanup

    !/bin/sh

    # name: cleanup

    # this is a general cleanup...wait

    echo "starting cleanup"

    rm /usr/local/apps/log/*.log

    tail -40 /var/adm/mesages >/tmp/messages

    ```'
  merge: -1
  pgno: 251
- img_proc: true
  md: 'rm /var/adm/messages

    mv /tmp/messages /var/adm/messages

    echo "finished cleanup"


    The above script cleans up var/adm/ messages by truncating the file, and deletes
    all log files in /usr/local/apps/log.

    To make the script executable we use the chmod command:


    ```

    $ chmod u+x cleanup.

    ```


    Now to run the script, just type the script name


    ```

    $ cleanup

    ```


    If you get an error back like this:


    ```

    $ cleanup

    sh: cleanup: command not found

    ```


    try this:


    ```

    $ ./cleanup

    ```


    If you have to type a pathname before your script will run, or the shell reports
    that it cannot find the command you really need to include your bin directory
    in your .profile PATH. Make sure that you are in your $HOME bin directory by typing


    ```

    $ pwd

    $ /home/dave/bin

    ```


    If the last part of the pw command is bin, then you need to add this to your path.
    Edit your .profile and add the bin directory $HOME/bin to your .profile, as follows:


    ```

    PATH=$PATH:HOME/bin

    ```


    If you have no bin directory, create one; first make sure you are in your directory.


    ```

    $ cd $HOME

    $ mkdir bin

    ```


    Now add the bin directory to your PATH variable in your .profile, then reinitialize
    the .profile


    ```

    $ ./profile

    ```


    This should now work.'
