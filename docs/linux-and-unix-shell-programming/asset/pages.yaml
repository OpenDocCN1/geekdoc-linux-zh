    \  echo \"Sorry USER you have not been authorised to use this menu\"\n  exit 1\n\
    fi\n```\n\nThe next step is to read the newly formatted file. The variable FOUND\
    \ is set to false. The temp file now holds the names and privilege levels; variables\
    \ are assigned to the user and privilege level. A test is carried out to see if\
    \ the name in the file matches the USER; the value of USER is taken from the command\
    \ whoami at the beginning of the script. If no match is found, the else comes\
    \ into play and we continue with the next iteration of processing, using the command\
    \ continue.\n\nThis process carries on until all names have been read and compared.\
    \ After reading in the file no matches have been found, the test statement at\
    \ the end of the code checks the variable FOUND. If it is set to false the user\
    \ is kicked out.\n\nIf a match is found during the while loop, the variable FOUND\
    \ is set to true. The case statement traps the privilege levels and will either\
    \ return 1 for normal level access or 0 for high level access.\n\nWhen a user\
    \ selects to change or delete a record, the test is carried out based on the return\
