    To see all your registered file systems, use pipe to pass the output from df to
    awk, where awk then prints the first column. Use pipe again to take this output
    and pass it through grep to get rid of the ''filesystem'' header information.


    ```

    $ df -k | awk ''{print $1}''| grep -v "Filesystem"

    /dev/hda5

    /dev/hda8

    ```'
