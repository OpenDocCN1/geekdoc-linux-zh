  md: '# CHAPTER 17


    # Conditional testing


    When scripting, you will probably want to be able to test whether a string is
    equal to another, or maybe check on a file status or even a numeric test. Based
    on the results of the test you can take further action. The test command can be
    used to test for strings, file status and numbers. It also fits in very well with
    the conditional if, then, else construct, as you''ll see in the next chapter.

    In this chapter we will cover:


    +   - using the test command on files, strings and numbers; and

    - using the expr command on numbers and strings.


    The expr tests and performs numeric output. Both test and expr will return 0 for
    true and 1 for false using the last exit status command $?


    # 17.1 Testing for a file status


    There are two general formats of the test and you can use either:


    ```

    test condition

    ```


    or


    ```

    | condition |

    ```


    Please note the use of a space each side of the condition when using square brackets.

    The conditions to which you can test the file''s status are quite long, but

    Table 17.1 lists the most common ones.'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# 230 Conditional testing


    | Table 17.1 File status tests |

    |---|---|

    | -d | This is a directory |

    | -f | This is a regular file |

    | -L | This is a symbolic link |

    | -r | This file is readable |

    | -s | This file has a size greater than zero, not empty |

    | -w | This file is writeable |

    | -u | This file has the suid bit set |

    | -x | This is executable |


    We will use both methods to test if the file scores.txt is writable. We will use
    the last status command to test it. Remember a zero status is OK, anything else
    is an error.


    ```

    $ ls -1 scores.txt

    -rw-rw-r-- 1 dave admin 0 May 15 11:29 scores.txt

    $ [ -w scores.txt ]

    $ echo $?


    ```


    ```

    $ test -w scores.txt

    $ echo $?

    0

    ```


    Both statues returned zero, so we know it is writable. Now let''s see if it''s
    executable.


    ```

    $ [ -x scores.txt ]

    $ echo $?

    0

    ```


    No, this is what we would expect, by looking at the permission listing of the
    file scores.txt.

    The next example tests for the presence of a directory called appsbin.


    ```

    drwxr-xr-x 2 dave admin 1024 May 15 15:53 appsbin

    $ [ -d appsbin ]

    $ echo $?

    0

    ```


    Yes, the directory appsbin is present.

    To test if a file has the suid bit set.


    ```

    rwsr-xr-- 1 root 28 Apr 30 13:12 xab

    ```'
