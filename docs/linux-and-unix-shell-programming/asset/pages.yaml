    back from the function


    In the above example, the function is declared at the top of the script. To reference
    the function we called by its name which was ''hello''. When the function has
    finished, control returns to the next statement following the function call, which
    is the echo statement ''back from the function''.


    # 19.3 Passing parameters to a function


    Variables are passed to function just like in a normal script using the special
    variables $1, $2 ... $9. When the function gets arguments passed to it, it will
    replace the arguments originally passed to the shell script, if any, so it''s
    always a good idea to reassign the variables when the function gets them. This
    is a good idea anyway; if there are any bugs in the function, they can quickly
    be tracked down by the localized variable names. The convention for calling arguments
    (variables) inside a function is to start each variable name with an underscore
    (_), like this: _FILENAME


    # 19.4 Returning from a called function


    When a function has finished processing or you wish the function to finish based
    a conditional statement, you can do one of two things:


    +   - Let the function fall through naturally to the end of the function, thus
    returning control back to the part of the script that called it.'
