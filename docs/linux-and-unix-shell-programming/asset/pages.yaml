    # 18.7.6 Running totals


    A fairly common task is to read in a file and keep a running total of some columns
    containing numbers. A file below contains the number of items sold by the departments
    STAT and GIFT.


    ```

    $ pg total txt

    STAT 3444

    GIFT 233

    GIFT 252

    GIFT 932

    STAT 212

    STAT 923

    GIFT 129

    ```


    Our task is to provide a total for all items sold for the department GIFT. To
    keep running totals we use expr. Looking at the following expr statement below,
    the variables LOOP and TOTAL are initially assigned a zero value outside of the
    loop. As the script loops the ITEMS are added to the TOTAL. The first iteration
    of the loop will contain only the first item, but as the process continues, the
    ITEMS will be added to the cumulating TOTAL.


    The next expr statement increments the counter.


    ```

    LOOP=0

    TOTAL=0


    while...

    TOTAL=`expr TOTAL + ITEMS`

    ITEMS=`expr ITEMS + 1`

    done

    ```


    A common mistake to make when using expr is forgetting to initialize variables
    first.


    ```

    LOOP=0

    TOTAL=0

    ```


    If you forget to initialize you will get expr errors creeping up your screen.

    You can initialize the variable inside the loop if you wish:


    ```

    TOTAL=`expr ${TOTAL:} + ${ITEMS}`

    ```'
