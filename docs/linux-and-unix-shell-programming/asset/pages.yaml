    # A useful cgi script


    We will now create a script that actually does some useful processing (depending
    on your view). We will create a report for a fictitious company Wonder Gifts.
    An accounts file holds the number of items sold for each quarter of the year 1998.
    The file holds the items for the following departments: Stationery, Books and
    Gifts.


    Our task is to generate a report based on the user''s selection. The user can
    select by quarter, or by department. The processing required is to add together
    the monthly items sold in that quarter. The output can go to the screen, printer
    or both. Our form will have drop-down menus, one for the quarter period and one
    for the department. A radio box will hold where the output is go. Using radio
    boxes, the user can select only one button. Actually the report will only go to
    the screen; the radio buttons are for demonstration purposes only.


