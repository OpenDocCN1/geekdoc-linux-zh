    # 26.1.2 Creating unique temporary files


    When we covered special variables earlier on in the book, we came across the variable
    $$ which holds the process ID or number of the current process you are running.
    We can use this to create temporary files within the current script we are running,
    because the process ID will be unique to that script. All we really need to do
    is create a file and append the $$ on it. When we are finished we just delete
    all files that have an extension of $$$. The shell will evaluate the $$ to your
    current process ID and delete these files but no other process ID appended files.
    At the command line type the following.


    ```

    $ echo $$

    281

    ```


    This is my process ID, yours will return a different number. Now if I create another
    log session and type the same command again, I will get a different number, because
    I have started a new process.


    ```

    $ echo $$

    382

    ```


    Here''s a script that creates a couple of temporary files, does some processing
    and then deletes the files at the end.


    ```

    $ pg tempfiles

    #!/bin/sh

    # tempfiles

    # name the temp files

    HOLD1=/tmp/hold1.$\$

    HOLD2=/tmp/hold2.$\$


    # do some processing using the files

    df -tk $HOLD1

    cat $HOLD1 >$HOLD2

    # now delete them

    rm /tmp/*.$\$

    ```


    When the above script is run, it will create the following two files.


    ```

    hold1.408

    hold2.408

    ```'
