  md: '# CHAPTER 3


    # Running commands unattended


    When you are at the terminal or console, you do not want to run jobs that tie
    up your screen: you want to be getting on with other important tasks like reading
    your e-mail. It also makes sense to run jobs that are process or disk-intensive
    during off-peak hours. To enable you to run these types of tasks in the background,
    i.e. not on your terminal screen, there are certain commands and tools at your
    disposal.

    In this chapter we will cover:


    +   * setting up and submitting jobs using your own crontab file;

    * submitting jobs using at;

    * running jobs in the background; and

    * running jobs using nohup.


    Technical terms


    | Cron | The system scheduler. Use this for jobs that are frequently run during
    off-peak hours and/or during different time periods throughout the week or month(s).
    |

    | At | The at command. Use this for ad hoc jobs to run at a specific time or for
    later during off-peak or during peak hours. |

    | & Nohup | Use this to run a quick job now in the background. Use this to run
    commands in the background, and log off, without affecting the process. |'
  merge: -1
  pgno: 57
- img_proc: true
  md: '# 3.1 Cron and crontab


    Cron is the system''s main scheduler for running jobs or tasks unattended. A command
    called crontab allows the user to submit, edit or delete entries to cron. A crontab
    file is a user file that holds the scheduling information. You can use crontab
    to run any of your scripts or one-liners every hour, or may just three days a
    week, it''s up to you. Each user can have their own crontab file if they wish,
    but on large systems root usuallyallows this and just uses one main crontab file
    for the whole system. Root is able to do this because of a file called ''cron.deny''
    and ''cron.allow'' where root can specify who and cannot have their own crontabs.


    # 3.1.1 crontab fields


    To be able to run tasks at certain times you need to know the format for the entries
    or fields in a crontab file. These are as follows:


    +   1st column 1–59

    2nd column 1–23 (0 is midnight)

    3rd column Day_of_month 1–31

    4th column 1–12

    5th column Weekday 0–6 (0 is Sunday)

    6th column Command to run


    The format of the crontab file is:


    Minutes < Hour > Day_of_Month < Month < Weekday < Command


    '' means a space.

    A cron entry is read left to right with Minutes being the first column. The command
    or task is to run is the last field and goes after the Weekday entry. Within these
    fields you can specify ranges with a hyphen (-). For example, to run a job Monday
    to Friday using 1–5. You can also specify using commas. For example to run a job
    Monday and Thursday only, use 1,4. Continuous periods are specified with the asterisk
    (*). If no specific entry is required for a period then you must still use an
    asterisk in its place, as there must be five columns of time periods, and every
    column should be space-separated. All comments in a crontab file need a hash mark
    (#) at the beginning of the line.


    # 3.1.2 crontab entry examples


    Here are some examples of crontab entries:


    ```

    30 21 * * * /apps/bin/cleanup.sh

    ```


    runs a script called cleanup.sh in /apps/bin at 9:30 every night.'
