  md: '# 10.12 Conclusion


    Sed is a powerful tool in text filtering; using sed allows you to pick apart a
    string or file and keep the bits you want. You don''t have to write big scripts
    to get the required information from a file, as we have found out. We have just
    touched on the basics of sed in this chapter, but from what we have learnt we
    can carry out many tasks using sed.


    If you have to carry out filtering on a file using sed, break the problem down
    into small steps, assign each step a task and test the results as you go along.
    From experience, this is the most productive way of carrying out tasks.'
