  md: '# CHAPTER 24


    # Shell built-in commands


    We have actually met most of the shell built-ins already. You may be wondering
    what a shell built-in is; these are commands that are built into the actual shell
    instead of residing in the /bin or usr/bin directory. Built-in commands run faster
    than their equivalent (if any) in the system.

    In this chapter we will cover:


    +   - the list of the standard Bourne shell built-in commands.


    For instance, we have used cd and pwd, which can be found both in the system and
    as a shell built-in. To run the system version simply supply the path to the command:


    ```

    /bin/pwd

    ```


    # 24.1 Complete list of shell built-in commands


    Table 24.1 shows a complete list of the standard built-ins.


    **Table 24.1** Standard built-in commands


    | Null, will always return true |

    | Read files from the current shell |

    | break | Exists from a for, until or case statement |

    | cd | Change the current directory |

    | continue | Carry on with the next iteration of the loop |

    | echo | Write output to the standard output |

    | eval | Read the argument and execute the resulting command |'
  merge: -1
  pgno: 412
- img_proc: true
  md: '# Shell built-in commands


    Table 24.1 Standard built-in commands (cont.)

    | | |

    |---||

    | exec | Execute the command but not in this shell |

    | exit | Exit the shell |

    | export | Export the variables so that they are available to the current shell
    |

    | pwd | Display the current directory |

    | read | Read a line of text from standard input |

    | readonly | Make this variable read-only |

    | return | Exit the function with a return value |

    | set | Control the display of various parameters to standard input |

    | shift | Shifts the command line arguments one to the left |

    | test | Evaluate a conditional expression |

    | times | Display the user and system times for processes run from the shell |

    | trap | Run a specified command when a signal is received |

    | type | Interpret how the shell will use a name as a command |

    | ulimit | Displays or sets shell resources |

    | umask | Display or set default file creation modes |

    | unset | Remove a variable or function from the shell |

    | wait | Wait until the child process has finished and report its termination
    |


    Let''s look at some of the commands that we have either not yet covered or, or
    if we have, not in any detail.


    # 24.1.1 pwd


    Display the current directory


    ```

    $ pwm

    /tmp

    ```


    # 24.1.2 set


    We met the set command when we looked at debugging to turn shell options on and
    off. Set can also be used to give arguments to a script internally. Here''s how
    it is done. Suppose we wanted a script to handle two parameters, but instead of
    passing these to the script we set them up in the script. To do this we use the
    set command.


    The format is:


    ```

    set param1 param2..

    ```'
