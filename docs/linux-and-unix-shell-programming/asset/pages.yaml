  md: 'file. Instead of copying the file to their $HOME areas you can create a file
    from their $HOME area that points to the actual file in /usr/local/admin/sales.
    When you need to update the sales file, you just update that one file, in /usr/local/admin/sales.
    The files from the sales home directory that users are pointing to can have any
    name they want, it does not have to be the same as the original filename.


    Links also come in handy if you have lots of sub-directories and it takes time
    to cd down. You can create a link that points to a sub-directory buried deep down
    in a directory from your $HOME directory. Another instance is if, say, you installed
    an application and its logs go to /usr/opt/app/log and you want it to go to somewhere
    else, you can point it to a more convenient location. The general format is:


    ```

    ln [-s] source_path target_path

    ```


    where the path that can be a directory name or filename. Let''s look at an example.


    # 1.9.2 Example of using a soft link


    Suppose I have about 40 sales and admin users who log in to the system, and sales
    users use a sales application and admin users use an admin application. Here''s
    what I''m going to do. First I''ll delete all profiles in their $HOME directories.
    I''ll create two profiles – let''s call them sales.profile and admin.profile in
    the environment that launches them into their respective application. I''ll put
    these profiles in /usr/local/menus/. Now I''m going to create a pointer in all
    the sales users'' $HOME directory to sales.profile, and the same for the admin
    team. Notice I do not have to create a file at the source_path end, the ln command
    takes care of that. Here''s how I''d do it for user patty who is part of the sales
    team.


    ```

    $ cd /home/sales/matty

    $ rm.profile

    $ ln -s /usr/local/menus/sales.profile profile

    $ ls -al .profile

    $ 1 rwx rwx 1 sales 5567 Oct 3 05:40.profile-

    /usr/local/menus/sales.profile

    ```


    (Your listing may look slightly different)

    And that''s all to it; now I can do the same to the admin team''s profile. And
    if I need to alter any of the profiles, I just need change the sales and admin
    instead of looking after 40 different profiles.


    Here''s another example. One of my network monitors puts its logs in /usr/monitor/regstar,
    but I have all my logs point to the directory /var/adm/logs/. so that I can look
    at all my logs in place, instead of cd-ing everywhere first thing in the morning.
    I''ll just create a link, and here''s how I would do it.


    ```

    $ ln -s /usr/opt/monitor/regstar/reg.log /var/adm/logs/monitor

    ```'
