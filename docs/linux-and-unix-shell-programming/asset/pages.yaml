  md: '# APPENDIX B


    # Useful shell commands


    This appendix lists and describes some useful shell commands. The options in the
    commands are not exhaustive, but should be enough for you to understand what the
    command does.

    You may find further examples of these commands scattered throughout the book.


    basename


    Format:


    basename path


    Basename will strip the path from a supplied pathname and return just the filename.
    Commonly used in usage statements in scripts, in this case substitution is used
    when echoing out the filename.


    ```

    $ basename /home/dave/myscript

    myscript

    echo "Usage: `basename $0` give me a file"

    exit 1

    ...

    ```


    If the above was part of a script called myscript, the output would be,

    myscript: give me a file


    The $0 is a special variable that holds the current full pathname of the script.'
  merge: -1
  pgno: 512
