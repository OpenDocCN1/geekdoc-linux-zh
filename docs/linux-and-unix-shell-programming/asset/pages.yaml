  md: 'The dd command is used mostly for conversions and interrogating problems with
    data on tapes or normal tape archiving tasks, but it can also be used to create
    fixed length files. A 1-megabyte file is created with the filename myfile.


    ```

    dd if=/dev/zero of=myfile count=52 bs=2048

    ```


    The dd command can interpret what is coming from your keyboard, and can be used
    to accept so many characters. In this case we only want one character. The command
    dd needs to chop off the new line; this control character gets attached when the
    user hits return. dd will also send out only one character. Before any of that
    can happen the terminal must be set into raw mode using the stty command. We save
    the settings before dd is invoked and then restore them after dd finished.


    Here''s the function:


    ```

    read_a_char()

    # read_a_char

    {

    # save the settings

    SAVEDTTY=`stty -g

    # set terminal raw please

    stty cbreak

    # read and output only one character

    dd if=/dev/tty bs=1 count=1 > /dev/null

    # restore terminal and restore stty

    stty -cbreak

    stty $SAVEDTTY

    }

    ```


    To call the function and return the character typed in, use command substitution.
    Here''s an example.


    ```

    echo -n "Hit Any Key To Continue"

    character=`read_a_char`

    echo "In case you are wondering pressed $character"

    ```


