- img_proc: true
  md: "# 264 Control flow structures\n\nFor a correct input we get:\n\n```\n$ caserep\n\
    Weekly Report\nWhat day do you want to run report [Saturday]\nvalidating..Saturday\n\
    Report to run on Saturday\n```\n\nFor an incorrect input we could get:\n\n```\n\
    $ caserep\nWeekly Report\nWhat day do you want to run report [Saturday]:Tuesday\n\
    validating..Tuesday\nAre you nuts!, this report can only be run\non a Saturday,\
    \ Sunday or Monday\n```\n\nYou may have concluded that the case statement can\
    \ do the same task as several if then else statements. You would be correct in\
    \ this assumption.\n\n# 18.5 for loop\n\nThe general format of the for loop is:\n\
    \n```\nfor variable_name in list\ndo\n  command1\n  command...\nd\n```\n\nThe\
    \ for loop processes all the information once for each value contained in list.\
    \ To access each value in list use variable_name. The commands can be any valid\
    \ shell command or statement. Variable_name can be any word you want.\nThe use\
    \ of list is optional; if you do not include it, the for loop uses the positional\
