    If a user downloads the same file from the same host every day, maybe containing
    sales data from the previous day, the user should not really have to keep typing
    in the same host or filename all the time. You can get on the good side of the
    user by setting default values of the DEST_HOST and FILENAME. Setting default
    values saves the user having to keep typing in the same information into the field.


    Below is a piece of the ftppout script for the remote hostname, but now it sets
    a default value for DEST_HOST, which is set to ''my_favouritehost''. The user
    can type in a different remote host or hit return at the prompt to load the default
    value into the variable DEST_HOST.


    Notice that you do not need to check if the user has entered a value, because
    the default value will now be loaded into the variable DEST_HOST.


    ```

    echo -n "Enter the host you wish to access :"

    read DEST_HOST

    :${DEST_HOST:=my_favourite_host}

    echo "Wait...seeing if $DEST_HOST is out there.."

    taceroute $DEST_HOST >tracelog 2>&1

    ```


    # 25.5 Accessing databases


    A common task among scripts is to access database systems to retrieve information.
    This type of process is ideal for here documents. You can do practically anything
    that you would normally do at the database prompt. This is not an exercise in
    databases, but to show you how documents can be used to connect to other applications,
    and carry out tasks.


    On one of our database systems the ''select into'' gets turned off when the database
    is accessed from third party products. This means that certain databases cannot
    be used for any insertion of data or the creation of temporary tables.


    To fix this problem here document is used to connect into the database system,
    and for a loop will fill the here document with the database names to change.
    Once connected the document is used to supply the sql commands to set the options.


    Here is the script that sets the options on each database:


    ```

    $ pg set.select

    !/bin/sh

    # set.select

    # fixes known bug. Sets the select into db option on

    ```'
