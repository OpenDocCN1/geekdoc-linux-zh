  md: '# CHAPTER 21


    # Creating screen output


    Creating professional-looking screens for interactive use can be accomplished
    using shell scripts. All you need is a colour monitor and the tput command on
    your system.


    In this chapter we will cover:


    +   - the tput command;

    - using escape sequences and generating control codes; and

    - using colour.


    Whilst writing this book I came across three different variants of tput. By far
    the best was GNU tput. If you haven''t got this version, download it and install
    it on your system. Tput uses your /etc/terminfo or /etc/termcap file so you can
    use most commands that your terminal supports in your shell scripts.


    Tput does not recognize colour settings, but we can take care of that control
    characters.


    # 21.1 tput


    Before using tput you need to initialize your terminal using the tput command
    either inside your scripts or on the command line.


    ```

    $ tput init

    ```


    Tput can produce three different kinds of output: string, numeric and Boolean
    (true/false). We will cover the most useful capabilities of each.'
  merge: -1
  pgno: 360
- img_proc: true
  md: '# 21.1.1 String output


    Here are the most common strings:


    | Name | Meaning |

    | --- | --- |

    | bel | Ring the bell |

    | blink | Blinking mode |

    | bold | Double intensity |

    | civis | Hide the cursor |

    | clear | Clear the screen |

    | cnorm | Unhide the cursor |

    | cup | Move cursor to x,y position on screen |

    | el | Clear to the end of line |

    | ell | Clear to the beginning of line |

    | smso | Start stand out mode |

    | rmso | End stand out mode |

    | smul | Start underline mode |

    | rmul | End underline mode |

    | sc | Save current cursor position |

    | rc | Restore cursor to last saved position |

    | sgr0 | Normal screen |

    | rev | Reverse video |


    # 21.1.2 Numeric output


    Here is the most common numeric output:


    | Name | Meaning |

    | --- | --- |

    | cols | Number of columns |

    | it | Width of tab settings |

    | lines | Number of lines on screen |


    # 21.1.3 Boolean output


    There are not many Boolean operators in tput.


    | Name | Meaning |

    | --- | --- |

    | cs | Cursor is hard to see |

    | hs | Has a status line |'
