  md: '# File security permissions


    When you have enough of a link, you just delete it, remember not to delete the
    actual source_path part.


    You can link to a file or directory, be it on the same or a different filesystem.
    When you create a link, remember to have ''execute'' on the directories that lead
    to the target_path or filename. When a link is created your source filename will
    use permissions of 777, or rwx rwx rwx, which you probably know by now, but the
    actual permissions of the target filename do not change.


    One of the common tasks I do on a new system is to create a link from /tmp to
    /var/tmp I do this because some applications /var/tmp to be present (when it generally
    isn''t), and some applications use this directory to stick their temp and locking
    files in one place To be able to keep my tmp directories together in use the ln
    command to create a pointer from /tmp to /var/tmp.


    ```

    $ pwd /var

    $ ln -s /tmp /var/tmp

    ```


    Now when I do an ls -1 on /var/tmp I can see the pointer from /var/tmp to /tmp


    ```

    $ ls -1

    $ lrwx rwx rwx 1 root root 5567 Sep 9 10:40 tmp-> -> /tmp

    ```


    # 1.10 Conclusion


    This chapter has introduced you to the basic concepts of file security. If used
    correctly and with a pause for thought you will have no problems. A slight slip
    of the fingers when typing a chmod -R command from the root directory can take
    ages to get the system back to its correct access permission mode, so please don''t
    wear plasters on your fingers when you type that command!


    The use ofid scripts is down to you. Use them but make sure you control and monitor
    their use, and please do not use ''root'' enabled suid scripts.'
