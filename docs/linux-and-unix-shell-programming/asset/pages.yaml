    #  8.2.5 Date searching


    A common search pattern is finding dates. Here we''ll find all the records where
    the store codes start with a 5 and end in 1996 or 1998. We''ll use this pattern
    ''5..199[68]'', which means the first character should be a 5, followed by any
    two digits, and 199, and the remaining numbers can be either a 6 or an 8.


    ```

    $ grep ''5..199[6,8]'' data.f

    483 Sept 5AP1996 USP 65.00 LVX2C 189

    483 may 5AP1996 USP 37.00 KVM9D 644

    ```


    Another method we could use to get all codes that have ''1998'' in is by using
    the expression [0-9]\{3\}, which allows any single number repeated three times
    followed by 8, although this method is not as effective as the last example:


    ```

    $ grep ''[0-9]\\{3\}[8]'' data.f

    47 Oct 3ZLL998 LPS 43.00 KVM9D 512

    483 may 5AP1996 USP 37.00 KVM9D 644

    216 sept 3ZLL198 USP 86.00 KVM9E 234

    ```


    *'
