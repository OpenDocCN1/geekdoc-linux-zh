  md: '# CHAPTER 4


    # Filename substitution


    When working on the command line, quite a bit of your time will be spent locating
    files that you want to work with. The shell offers a neat set of pattern matching
    or metacharacters enables you to match filenames based on the pattern you supply.
    You can also use character classes to match filenames. But as it''s quicker using
    the metacharacters on the command line, we will stick with these in this chapter.


    In this chapter we will cover:


    +   * pattern matching using any character string;

    * pattern matching using single characters; and

    * pattern matching using alpha or numeric characters.


    Here are these special characters.


    +   * Matches any string including a null string.

    ? Matches any one character.

    * [...] Matches any characters enclosed in the square brackets.

    * [!] Matches any characters other than the characters following the explanation
    mark ''!'' inside the square brackets.


    When the shell sees the above characters it knows that they are special and not
    as ordinary characters, which enables the user to match certain filenames only.


    # 4.1 Using the *


    Use the asterisk to match any part of a filename. Here we specify app*, which
    means list all filenames that have ''app'' at the beginning of the filename and
    anything else after that:'
