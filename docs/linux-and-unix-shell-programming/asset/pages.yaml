  md: "The options to the script will be:\n\n+   -l for lower case\n-u for upper case\n\
    \nUsing the shift command we can now start to put together a script that will\
    \ handle the options -l and -u. Here's the first draft of the script.\n\n```\n\
    $ pg tr_case\n!/bin/sh\n# tr_case\n# case conversion\nusage()\n{\n# usage\necho\
    \ \"usage:basename $0 -[l|u] file [files]\" >&2\nexit 1\n}\n```\n\n```\nif [ $#\
    \ -eq 0 ]; then\n  # no parameters passed !\n  usage\nwhile [ $# -gt 0 ]\nd\n\
    \  case $1 in\n    -u|-U) echo \"-u option specified\"\n      # do any settings\
    \ of variables here for lowercase shift\n      shift\n      ;;\n    -l|-L) echo\
    \ \"-l option specified\"\n      # do any settings of variables here for uppercase\
    \ shift\n      shift\n      ;;\n    *) usage\n      ;;\n  esac\ndn\n```\n\nWe\
    \ first check that there are arguments to the script. If not, a usage statement\
    \ is printed. While there are arguments to be processed, using a case statement\
    \ trap each option passed, and when we have finished with each option use shift\
    \ to collect the next option on the command line. If any non-matching options\
    \ are found, print a usage statement.\n\nHere's how the output looks from the\
    \ script, when a invalid arguments are passed to the script."
