  md: "# 418 Shell utilities\n\nHere is a script that does some critical processing,\
    \ a while loop actually, but it puts the point across very nicely. Trap is set\
    \ to ignore signals 2, 3 and 15. When this while loop has finished, another while\
    \ loop kicks off, but this time the trap has been reset to allow interrupts.\n\
    \nBoth while loops count up to six, then there is a sleep command inside the loop,\
    \ so it should give you plenty of time trying to break out of the script.\n\n\
    Here's the script.\n\n```\n$ pg trap_ignore\n#!/bin/sh\n# trap_ignore\n# ignore\
    \ the signals\ntrap \"\" 1 2 3 15\n\nLOOP=0\nmy_exit()\n# my_exit\n{\n  echo \"\
    Received interrupt on count $LOOP\"\n  echo \"Now exiting...\"\n  exit 1\n}\n\n\
