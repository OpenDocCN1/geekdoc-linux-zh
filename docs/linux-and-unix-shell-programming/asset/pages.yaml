    # 20.2.5 Using getsops to process file conversions


    Let''s now the tr_case script and turn it into a getsops version with what we

    have learned. The only difference in the command line options using the getsops

    method to the shift method is a VERBOSE option.


    The variable VERBOSE by default holds a ''no'', but when selected with the

    command line option case statement traps it and assigns ''yes'' to VERBOSE. The

    echoing of the commands is a simple statement.


    ```

    if [ "VERBOSE" = "on" ]; then

    echo "doing upper on $LOOP..newfile called $LOOP$EXT"

