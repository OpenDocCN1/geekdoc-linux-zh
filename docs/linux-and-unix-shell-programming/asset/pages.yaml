  md: '# CHAPTER 29


    # cgi scripts


    Now that nearly everyone has a Web server installed on their PCs, it seemed appropriate
    that a chapter on cgi scripts should be included as part of this shell programming
    book.


    In this chapter we will cover:


    +   - basic cgi scripts;

    - using Server Side Includes;

    - the get method;

    - the post method;

    - creating an interactive script; and

    - a cgi script that automatically reloads a Web page.


    You do not need to be on a network to run a Web server; you can run it from your
    local host. However, here I will assume you have a Web server installed (apache
    CERN etc.) and a browser to display the Web pages (Netscape, Internet Explorer,
    etc.). In addition, the server has been cgi-enabled. By default this is disabled;
    just comment out the required lines. See later for more information.


    It''s beyond the scope of this book to tell you how to install and configure a
    Web server, but it only takes about 20 minutes to get one up and running. The
    examples used in this chapter were run under the apache server, and the browser
    used is Netscape.


    This chapter will not go into detail about HTML or Web issues, since there are
    plenty of books on the market about these subjects already. Besides it would take
    several chapters to discuss HTML.'
  merge: -1
  pgno: 476
- img_proc: true
  md: '# 29.1 What is a Web page?


    A Web page or document consists of HTML tags. When a browser connects to your
    Web page, the document lets the browser know how to display the page. The page
    can consist of many things including links that allow your pages to connect to
    other pages, colour, highlighting, character sizes, lines and tables. A page also
    consist of pictures and sounds.


    There are two types of Web pages: dynamic and static. Static pages are used to
    display information or to download files. Dynamic pages are interactive; they
    can generate reports for you using information that you give. Dynamic pages are
    also used to display changing information in real time, such as stock prices,
    scripts or monitoring tasks. To be able to carry out these types of dynamic processes,
    scripts are required.


    # 29.2 cgi


    Cgi is the specification that tells the scripts getting information how to transfer
    the data to and from the server. These scripts or cgi scripts can be written in
    any scripting language. Perl is the most popular, but it can be done using normal
    shell scripts, as you will discover.


    Figure 29.1 Browser and server using cgi to exchange information


    # 29.3 Connecting to a Web server


    To connect to a Web server you use a Uniform Resource Locator (URL). The URL contains
    two pieces of information:


    +   - The protocol

    - The address and data


    The protocol can consist of http, ftp, mailto, file, telnet and news. We will
    only be concerned with http, which stands for hypertext transfer protocol.'
  merge: -1
  pgno: 477
- img_proc: true
  md: 'The address is usually the DNS name or hostname of the server, but can be the
    IP address. Other data can also be the actual pathname to the file that you wish
    to access.


    All connections are carried out using the TCP protocol, which defaults to port
    80 on your machine.


    If you have a Web server set up on your local host, with a main HTML page called
    index.html, then you would type:


    ```

    http://localhost/index.html

    ```


    Generally speaking, the index.html is the file to be loaded by default, which
    means as far as your Web server is concerned it''s the default page, though this
    can be changed using the configuration files. Therefore, you could just type:


    ```

    http://localhost/

    ```


    # 29.4 cgi and HTM script


    When a browser makes a request to load a page, the Web server looks at the incoming
    URL. If there is cgi as part of the URL path, the server opens a connection, which
    is usually a pipe to the requested cgi script. All input and output from the cgi
    script is sent through this pipe. Now, if the cgi script is to display a formatted
    Web page it has HTML tags within the script so that a page can be displayed in
    a recognized format to the Web server, hence knowledge of some HTML is necessary.
    The Web server will send this document page to the browser to be displayed for
    the calling user. Table 29.1 shows some useful HTML tags.


    # 29.4.1 Basic cgi script


    All scripts should reside in the cgi-bin directory of your Web server, although
    this location can be changed; check out your config files, srm.conf and the section
    ScriptAlias to change directory locations and make the server cgi enabled. All
    scripts should have a file extension of .cgi. All documents usually reside in
    html or htdocs directory with extensions of .html. All scripts should have the
    following permissions.


    ```

    chmod 755 script.cgi

    ```


    By default all connections to a Web page are generally as the user nobody, although
    this can be changed via the config file httpd.conf. Although I said that this
    chapter was not about Web configuration, now is a good time to check that the
    password field of ''nobody'' is disabled. This stops anybody trying to connect
    as user nobody on a physical login connection. To disable the password of user
    nobody, simply insert an asterisk as the first character in their password field,
    /etc/passwd.'
  merge: -1
  pgno: 478
