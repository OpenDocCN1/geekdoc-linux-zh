    ```

    $ isql -Udavet -Pabcd -Smethys

    ```


    where the -S is the server name I''m connecting to. Now I have a variable that
    holds the server name DSQUERY. I assign the server name to DSQUERY; now I log
    in if I do not supply a server name with ''-S'', the application looks for the
    DSQUERY variable, and uses that value as the server name. All I need to do now
    to log in is type


    ```

    $ isql -Udavet -Pabcd

    ```


    This is how most applications work


    # 14.2 Local variables


    Local variables are what you would use in a script for your current lifetime,
    then discard. For instance, a local variable called file_name may have the value
    loops.doc. This value is important to you only for the lifetime of your current
    shell; you do not keep that value if you start another process in your shell or
    out. This is good news because you cannot make this type of variable available
    to other shells or processes.


    Table 14.1 contains various variable modes of action. When using some users like
    to enclose them in curly brackets, which stops the shell from misinterpreting
    the value of the variable. You do not have to, but this can be useful.


    To assign a local variable the format is:


    ```

    $variable_name=value or ${variable_name = value}

    ```


    Notice that there are spaces either side of the = sign. If the value contains
    a space then enclose the whole value with double quotes. You can use lower or
    upper case letters for shell variables.'
