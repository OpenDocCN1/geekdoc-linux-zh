  pgno: 206
- img_proc: true
  md: '# 12.1.9 Quick conversions


    If you have a file that needs the ^Ms removed and replaced with new linefeeds

    use this command:


    ```

    $ tr -s "[015]" "\n" < input_file

    ```


    Alternatively, you can use this command - it will do the same translation:


    ```

    $ tr -s "[\r]" "\n" < input_file

    ```


    Alternatively, this command will do the same translation again:


    ```

    $ tr -s "\r" "\n" < input_file

    ```


    Another DOS to UNIX converter is this command:


    ```

    $ tr -s "[015032]" "[02*]" < input_file

    ```


    which deletes all ^Ms and ^ replaces them with linefeeds.


    This command will delete all tabs and replace them with spaces:


    ```

    $ tr -s "[011]" "[040*]" < input_file

    ```


    To replace the colons in the passwd file first, enclose the colon in quotes and
    specify the octal tab value which is ''011'' in

    replacement string. Here''s the passwd file first, then the tr command to do the
    job.


    ```

    $ pg passwd

    halt:*7:0halt:/sbin:/sbin/halt

    mail:*8:12mail:/var/spool/mail:

    news*:9:13news:/var/spool/news:

    uucp:*10:14uucp:/var/spool/uucp:

    ```


    ```

    $ tr -s "[::]" "[\t]" < passwd

    halt 7 0 halt /sbin /sbin/halt

    mail 8 12 mail /var/spool/mail

    news 9 13 news /var/spool/news

    uucp 10 14 uucp /var/spool/uucp

    ```


    Alternatively, the following will get the same results; we specify the shorthand

    notation of the tab key:


    ```

    $ tr "[::]" "[\t]" < passwd

    ```'
  merge: -1
