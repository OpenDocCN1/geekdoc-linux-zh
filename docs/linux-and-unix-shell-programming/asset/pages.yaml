  md: '# 34 Running commands unattended

    45 4 1,10,22 * * /apps/bin/backup.sh


    runs a script called backup.sh in /apps/bin at 4:45 a.m., on the 10th and 22nd
    of each month.


    ```

    10 1 * * 6,0 /bin/find -name "core" -exec rm \;

    ```


    runs a find command at 1:10 a.m. only on Saturday and Sunday.


    ```

    0,30 18-23 * * /apps/bin/dbcheck.sh

    ```


    runs a script called dbcheck.sh in /apps/bin every 30 minutes past the hour, between
    18:00 and 23:00.


    ```

    0 23 * * 6 /apps/bin/qtrend.sh

    ```


    runs a script called trend.sh in /apps/bin at 11:00 p.m. every Saturday.

    Notice the full pathname is given for all the scripts or one-liners in the crontab
    file. When you run scripts from crontab it''s up to the user who supplies the
    script to make sure that all the scripts'' full pathnames and environment variables
    are set correctly. Remember, though, that the job is submitted by you, cron needs
    to know everything. Do not assume cron will know about any special environments
    that you have set up, because it won''t. So make your scripts have all the paths
    and any environments defined, apart from the global environments that are set
    automatically.

    If cron cannot run the script, the user will be mailed telling him or her why.


    # 3.1.3 crontab options


    The general format of the crontab is:


    Crontab [-u user] -e -l -r


    where:


    +   -u is the user login name

    -e edits the crontab file

    -l lists the crontab file

    -r deletes the crontab file


    If you log in under your own userid, you do not need to specify the -u option.
    because cron will pick that up when you run any of the crontab commands.'
