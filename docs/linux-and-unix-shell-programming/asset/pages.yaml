  md: '# Appendix B


    script


    Format:


    +   - script option file


    Option:


    +   - a Append the output to a file


    You can create a complete history of your session by using script. Simply invoke
    it at the command line. Script will terminate when you exit your session. Script
    copies whatever you type and appends it to a file.


    ```

    $ script login

    ```


    will start the script session and log everything to the file login.


    # shutdown


    Format:


    +   - shutdown


    This will shut down the system. Many vendors have their own specific command variation.


    ```

    $ shutdown now

    ```


    will shut down the system now, and


    ```

    $ shutdown -g60 -I6 -y

    ```


    will shut down the system in 60 seconds, then reboot the system.


    # sleep


    Format:


    +   - sleep number


    This command makes the system wait a specified number of seconds. For example.


    ```

    $ sleep 10

    ```


    means the system will do nothing for 10 seconds.'
