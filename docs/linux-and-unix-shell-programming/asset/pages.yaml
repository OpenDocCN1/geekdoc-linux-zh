    # 21.2.4 Generating escape sequences


    Note that if you are using an emulator, you may have problems making the cursor
    invisible. This could be because:


    +   1. Some emulators do not control the character that makes the cursor invisible.
    I had to ask the author of the software emulator that I am using to make amendments
    to his source code so the cursor could be turned off.

    2. Older versions of the tput civis command in my opinion do not seem to work
    properly.


    The control character for turning the cursor is ?251 (that''s the letter 1). The
    character for turning it back on is ?25h.


    All characters start with an escape sequence, usually the escape key followed
    by [, then the actual sequence to turn some terminal attribute on or off.

    You can use two different methods to generate escape sequences depending on what
    system you have. The following table lists both methods work no matter what UNIX
    or LINUX variation you have got because the sequence is embedded in the echo statement.
    This third method is the one we will use in the book.


    To send an escape sequence to turn the cursor off:


    | LINUX/BSD | echo -e "\033[?251" |

    | System V | echo "\033[?251" |

    | Generic method | echo "<CTRL-V><ESCAPE>[?251" |


    The \033 is the value for the escape. The \@ tells the echo command an octal value
    next. For instance to echo out the @ character, I could just use


    ```

    echo "@"

    ```


    Or I could instead use the octal value of that character which is 100 to echo
    out the character.


    ```

    echo -e "\100"

    ```'
