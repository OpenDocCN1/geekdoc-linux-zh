  md: '# 10.9 Displaying control characters in a file


    When downloading files from other systems, you sometimes get control characters
    (non-printable characters) spread all over the file. Capturing an application
    screen output from a menu sometimes causes control characters to be in a file.
    How can you tell if there are any in a file? If you do ‘cat -v filename’, and
    the screen bleeps and spurts rubbish everywhere, be assured you’ve got control
    characters in that file. If you get funny looking characters displayed then be
    pretty sure that they are control characters as well.


    On some systems you can just do a ‘cat filename’ instead of ‘cat -v to see all
    those non-printable characters.


    The sed format is:


    ```

    [[address],[address]]

    ```


    where the ‘l’ means list.


    Generally you’ll want to list the whole file. instead of pattern matching, so
    use ‘l’ for line and the $ for the last line. The pattern range ‘1,$’ means the
    first line to the line of the file.


    If a cat file we get an indication that there are in fact control characters in
    the file.


    ```

    $ cat -v func.txt

    This is the F1 key:OP

    This is the F2 key:OQ

    ```


    Now let’s run sed over the file and see what it says.


    ```

    $ sed -n ''1,$'' func.txt

    This is the F1 key:\0330$P$

    This is the F2 key:\0330$Q$

    ```


    Sed has found and displayed a couple of control characters. The \033 is the escape
    key. OP is the value of the F1 key, after the escape sequence, and so on for the
    second line.


    Your values may be different if you use your function key: it depends on how it’s
    mapped (i.e. using terminfo or termcap). If you want to insert the control character
    of the F1 key into a text file using vi to see what sequence it returns the following:


    ```

    Li vi up.

    Go into insert mode.

    Hold down the <Ctrl> and then the <v> key.      (a ^ will appear)

    Now release bet keys.

    Hit the F1 key.                                     (OP will appear)

    Hit the <Esc> key.                               (the value F1 sends will now
    be displayed)

    ```'
