    # 3.3.2 Checking the process using ps


    When a job is running in the background you can use the process number it displayed
    when you submitted it to monitor its process. Using our last example for the script
    ps1, we simply run the ps command with a grep for our process number:


    ```

    $ ps |grep 28305

    28305 ps1 S  0:00 sh /root/ps1

    28350 ps1 S  0:00 grep 28305

    ```


    If your system does not support ps x use:


    ```

    $ ps -ef |grep 28305

    root 28305 21808 0 10:24:39 pts/2 0:00 sh ps1

    root 21356 21808 1 10:24:46 pts/2 0:00 grep 28305

    ```


    Remember that when using ps to locate running processes, ps cannot determine whether
    a job is running in the foreground or the background.


    # 3.3.3 Killing a background job


    To kill a process we use the kill command. When we submitted a job to run in the
    background, the shell issued the process number that is associated with it. We
    can use this process number to kill it, using the kill command. The basic format
    is:


    ```

    kill -signal [process_number]

    ```


    Don''t worry about the different kill signals at the moment; we will cover them
    later in the book.


    To kill a job, issue the following command (your process number will be different)
    and hit a couple of times. A message should be displayed informing the user that
    the job has been killed.


    ```

    $ kill 28305

    [1]+ Terminated         ps1

    ```'
