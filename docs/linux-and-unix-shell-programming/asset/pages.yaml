    # 8.2.8 Using grep to match either or all patterns


    A nice little to the grep command is the -E parameter, which allows you to use
    extended pattern matching. For example, let''s say we want to extract all city
    codes with a 219 or 216 prefix. We can use this:


    ```

    $ grep -E ''219|216'' data.f

