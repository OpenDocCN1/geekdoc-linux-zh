    # 29.4.3 Using SSI


    Using cgi scripts to open up a Web page to display a little information can sometimes
    be regarded as overdoing it by a bit. For example, we displayed the date but we
    generated a cgi script to do that. Wouldn''t it be great if we embed a cgi script
    inside an HTML document so that the output of the script is displayed within a
    normal page? Well you can do this, and that''s what we are going to next.


    To embed cgi scripts into documents we have to enable Server Side Includes (SSI).
    When a document is displayed, it replaces the SSI command with the result of that
    command or script. Extra environment variables are also exported, containing additional
    information about your server and commands.'
