    # 26.3.4 Ignoring signals


    When a user logs into a system, the /etc/profile is read; root will not want the
    users to break out of this process; he or she will usually set the trap to ignore
    signals 1, 2, 3 and 15, but then turn them again (reset) when the motd (message
    of the day) gets read. The trap will then be set again to ignore signals 1, 2,
    and 15.

    The same approach can be adopted for scripts. In your script where it opens many
    files, and during this process you may not want the script to be interrupted in
    case damage is caused to the files. Setting trap to ignore certain signals will
    solve this problem. When the critical processing has finished use trap trap again
    to allow signals to be caught.

    The format to ignore incoming signals is (apart from signal 9):


    ```

    trap "" signal no:(s)

    ```


    Notice that there is nothing between the double quotes. To reset the trap back
    to allow signals to be caught:


    ```

    trap "do something" signal no:(s)

    ```


    To summarize the process of ignoring then not ignoring signals.


    ```

    trap "" 1 2 3 15

    code that does really critical stuff

    trap "my_exit" 1 2 3 15

    ```


    # ignore signals


    # let''s catch the signals again! with a function called my_exit.'
