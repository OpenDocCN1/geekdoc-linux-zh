    # 11.6 Using paste


    cut you extract columns or fields of data from a text file or standard input.
    With paste you can use this to paste the contents of the file together. When pasting
    data from two different sources, it pays to sort them first; you should also make
    sure that the two files have an equal number of lines.


    Paste puts the text together in a row by method. By default, paste joins, it converts
    all the new lines into tabs or spaces unless the ''-d'' option is specified, then
    this will become the field separator.

    The format for paste is:


    ```

    paste -d -s file1 file2

