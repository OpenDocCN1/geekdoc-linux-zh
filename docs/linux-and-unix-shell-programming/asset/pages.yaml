  md: '# 14.3.4 Built-in shell variables


    The Bourne shell has some names reserved for environment variables. You cannot
    use these variable names for anything else. They are generally set up in your
    //etc/profile, but not always, so it''s up to you to set a value to them. Here
    is a list of the built-in shell variables.


    CDPATH


    The change directory path variable holds a series of pathnames separated by a
    colon. It is used in conjunction with the cd command. If CDPATH is set, when cd,
    the CDPATH is searched first. If the directory is located within CDPATH, this
    becomes the new working directory. Here''s an example.


    ```

    $ CDPATH=:home/dave/usr/local/apps; export CDPATH

    ```


    If you wanted to


    ```

    $ cd apps

    ```


    the cd command would search through the directory listings given in CDPATH. If
    it is found, this would become your current working directory.


    # EXINIT


    The EXINIT variable holds initialization options when using the vi editor. For
    example, to have all the lines numbered and set the tab to 10 spaces when using
    vi,


    ```

    $ EXINIT=''set nu tab=10''; export EXINIT

    ```


    # HOME


    The HOME directory, usually located in the second from last field in the passwd
    file, where you keep all your personal files. When set, you can use the shortcut
    to cd back


    ```

    $ HOME=/home/dave; export HOME

    $ pwd

    $ /usr/local

    $ cd

    $ pwd

    $ /home/dave

    ```


    You can also use


    ```

    $ cd $HOME

    ```'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# 206 Environment shell variables


    IFS

    IFS is used by the shell as the default field separator. The internal field separator
    can be set to anything, but by default is generally set to a space, new line or
    tab. IFS is quite useful in separating fields in files or variables. Setting IFS
    to a colon and then the PATH variable will give a more readable directory-separated
    path.


    ```

    $ export IFS=

    $ echo $PATH

    /sbin /bin /usr/sbin /usr/bin /X11R6 /root/bin

    ```


    To set it back to its original setting use:


    ```

    $ IFS=<space><tab> export IFS

    ```


    where <space><tab> means hit the space and tab key.


    # LOGNAME


    This variable holds your login name. This should really be set by default, but
    if you can''t set it with this command.


    ```

    $ LOGNAME=whoami; export LOGNAME

    $ echo $LOGNAME

    dave

    ```


    # MAIL


    The MAIL variable holds the pathname and file of your mailbox. By default this
    is /var/spool/mail/<login name>. The shell will check periodically for new mail.
    If you have a mail message will be displayed on your command line. If you have
    a different route to your mail box, set it with MAIL:


    ```

    $ MAIL=/usr/mail/ave; export MAIL

    ```


    # MAILCHECK


    The MAILCHECK default for checking for new mail is 60 seconds. But if you like
    your mail checked less often, say every 2 minutes, use this command:


    ```

    $ MAILCHECK=120; export MAILCHECK

    ```


    # MAILPATH


    Use MAILPATH if you have more than one mailbox. This variable will set override
    the variable MAIL:


    ```

    $ MAILPATH=/var/spool/ave:/var/spool/admin; export MAILPATH

    ```


    In the above example, MAIL will now check the two mailboxes dave and admin.'
