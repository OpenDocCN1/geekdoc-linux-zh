    | <B></B> | Bold characters |

    | <I></I> | Italic characters |

    | <OL></OL> | Ordered lists |

    | <A HREF=url>link</A> | Hypertext or link to page or URL |

    | <FORM></FORM> | Enclose the form |

    | METHOD | Post or get |

    | ACTION | Address |

    | <INPUT...> | Data entry |

    | NAME | Name of variable |

    | SIZE | Width of text box characters |

    | TYPE | Checkbox, radio, submit |

    | <SELECT...> | Drop down menu |

    | NAME | Name of variable |

    | SIZE | Number of items of the list to display |

    | <OPTION VALUE> | Return selected option to NAME variable |

    | </SELECT> | Close select list


    If any of your scripts do not work, your first port of call should be the error
    logs as they are explicit in any errors that are generated. If you are using apache
