    # 9.2.2 Fields and records


    When awk is executed the fields that it scans are referenced by $1, $2 ... $n.
    This method is called field identity. Using these field identities is it easy
    to work on each field for further processing.


    To reference the first and third fields we would only use $1, $3 – note the use
    of the comma separating them. If we wish to print all the fields in a record that
    had five fields we do not have to specify $1, $2, $3, $4, $5; we can use $0, which
    means all fields. When awk scans and reaches a new line it assumes that it has
    reached the end of the record for these fields, and then will carry on starting
    at the next line reading in the new record and assigning the fields. Before we
    carry on, do not confuse this $ sign with the shell''s $ sign: they are different!


    To print individual fields or all fields we use the ‘print’ command, which is
    an action (action statements are enclosed within curly brackets).


    # Extracting fields


    Let''s look at a couple of examples before we carry on. We''ll use this test file
    called grade.txt which contains some entries from a local karate database.


    ```

