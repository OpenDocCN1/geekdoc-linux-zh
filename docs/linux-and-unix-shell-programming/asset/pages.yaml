- img_proc: true
  md: "# Run level scripts\n\n| Run level | Description |\n|---|---|\n| Run 0 | Stops\
    \ and halts the entire system |\n| Run level 1 | Single-user or admin mode |\n\
    | Run level 2 | Multi-user mode: some networking services are started. Some systems\
    \ use this as the normal operating mode level, instead of run level 3 |\n| Run\
    \ level 3 | Normal operating mode, all network services up |\n| Run level 4 |\
    \ User-defined level; use this level to customize what you want running |\n| Run\
    \ level 5 | Some variants have this level as the default X-windows mode, others\
    \ use it to bring the system down to maintenance mode |\n| Run level 6 | Reboot\
    \ |\n\n# 28.4.2 Format of a run level script\n\nThe scripts in the `rcN.d` directories\
    \ are all symbolic links, which is to keep duplication of the scripts to a zero\
    \ level. The format of these links are:\n\nSnnn.script_name\n\nor\n\nKnnn.script_name\n\
    \nwhere,\n\n+   - S means to start a process\n- K to kill a process\n- nn is a\
    \ two digit number from 00 to 99, though some systems have three digits 000 to\
    \ 999. When linking in different directories, keep the same number. For example,\
    \ if a service is to be started in `rc3.d` and is called `S45.myscript` and you\
    \ wanted it in `rc2.d`, make sure the script is called `S45.myscript` as well.\n\
    - script_name is the name of the script, depending on your type of system. It\
    \ could be in:\n  - `/usr/sbin/init.d`n  - `/etc/rc.d`n  - `/etc/init.d`"
  merge: -1
  pgno: 471
- img_proc: true
  md: 'When init needs to call the rc.scripts, the kills will start going from highest
    to lowest K numbers, i.e. K23.myscript K12.named. The starts are called from the
    lowest to the highest. If you have LINUX, the K numbers will be executed from
    the highest to the lowest.


    # 28.4.3 Installing a run level script


    To install your own rc.script you must:


    +   - write the rc.script, ensuring it actually conforms to the calling standard;

    - make sure it can actually stop and start your desired service;

    - place the script (depending on your system) into /etc/init.d or /usr/sbin/init.d
    or /etc/rc.d and

    - create the links in the appropriate rc.d directories using the proper naming
    convention.


    Below is a script that will start or stop an audit application, called rc.audit.
    The service will be started on run levels 3, 5 and 4 and be killed on run levels
    6, 2 and 1. Looking at some of the entries in rc.d directories the number 35 is
    sparse, so we will use this. Actually, there is nothing from stopping you using
    a number that is already use.


    Here''s the script. As can be seen a simple case statement does the job of trapping
    the stop and start parameters.


    ```

    $ pg rc.audit

    #!/bin/sh

    # rc.audit| stop

    # script to start or stop zeega''s audit application

    #

    case "$1" in

    start)

    echo -n "Starting the audit system..."

    /apps/audit/auditcp -p 12

    echo

    touch /var/lock/subsys/rc.audit

    ;;

    stop)

    echo -n "Stopping the audit system..."

    /apps/audit/auditown -k0

    echo

    rm -f /var/lock/subsys/rc.audit

    ;;

    restart)

    $0 stop

    $0 start

    ;;

    ```'
  merge: -1
  pgno: 472
- img_proc: true
  md: '# Run level scripts


    ```

    *)

    echo "To call properly..Usage: $0 {start|stop|restart}"

    exit 1

    ;;

    esac

    exit 0

    ```


    If it''s LINUX then...


    Some LINUX variants expect a lock file to be created when you start a service.
    If there is not a lock file present then you might have problems with your kill
    scripts writing.


    The ''start'' option calls the audit process that launches the actual audit system,
    and the ''stop'' option calls a script that kills the audit system. Of course,
    you should test your script before installing it in the init.d directory.


    ```

    $ rc.audit

    To call properly..Usage:/rc.audit {start|stop|restart}

    $ rc.audit start

    Starting the audit system...

    ```


    Let''s assume the script has been tested. It stops and starts the audit service
    with no problems. So let''s link the script into the required run directories.

    On the system I''m using, rcN.d directories are held in /etc/rc.d and my rc.scripts
    are held in /etc/rc.d/init.d. Change your paths accordingly if yours are different.

    We''ll do the script first – remember the start scripts begin with an S.


    ```

    $ pwd

    /etc/rc.d/rc3.d

    $ ln -s..//init.d/rc.audit S35rc.audit


    $ ls -l

    lrwxrxr-x 1 root root 27 May 8 14:37 S35rc.audit -> ../init.d/rc.audit

    ```


    The link has now been created. The output from ls -1 command shows that the link
    goes to /etc/init.d/rc.audit. I could have supplied the whole directory path as
    my link command, but this is not necessary. Now all I need to do is cd into the
    rest of the directories where I want the service to start (that rc4.d and rc5.d)
    and just type the same command in.

    To do the kill scripts:


    ```

    $ pwd

    /etc/rc.d/rc6.d

    $ ln -s../init.d/rc.audit K35rc.audit

    ```'
