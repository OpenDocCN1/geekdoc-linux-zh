  md: "# Appendix B 499\n\nWC\n\nFormat:\n\nwc options files\n\nOptions:\n\n+   -c\
    \ Print character count\n-l Print line count\n-w Print word count\n\nThis counts\
    \ the number of characters or words.\n\n```\n$ who|wc\n  1  6  46\n$ who wc -1\n\
    \  1\n```\n\nIn the first example output the who command is piped through to wc,\
    \ and the following columns are displayed:\n\nnumber of lines, number of words,\
    \ number of characters\n\nIn the second example, wc just prints the number of\
    \ lines.\n\n```\n$ VAR=\"tapedrive\"\necho $VAR | wc -c\n10\n```\n\nThe number\
    \ of characters in the string VAR is output.\n\nwhereis\n\nFormat:\n\nwhereis\
    \ command_name\n\nThe whereis command to locate the binary and manual page locations\
    \ of a command.\n\n```\n$ whereis fuser\nfuser: /usr/sbin/fuser /usr/man/man1/fuser.1\n\
    ```\n\n```\n$ whereis sort\nsort: /bin/sort /usr/man/man1/sort.1\n```"
  merge: -1
  pgno: 524
- img_proc: true
  md: 'Notice the binary is not displayed in the next two examples, because it is
    a shell built-in. but we have manual pages for the commands.


    ```

    $ whereis times

    times: /usr/man/man2/times.2

    ```


    ```

    $ whereis set

    set: /usr/man/mann/set.n

    ```


    # who


    Format:


    who options


    Options:


    +   -a Display all output

    -r Report current run level (for LINUX use the command runlevel)

    -s List names and time fields


    whoami Display the name of the user running the command. This is not an option
    to the who command, and can be called by itself.


    The who command reports who is logged on to to the system. To show users logged
    on:


    ```

    $ who console Apr 22 13:27

    root pts/3 Jun 14 15:29

    pgd pts/4 Jun 14 12:08

    peter pts/5 Jun 14 16:10

    dave

    ```


    ```

    $ whoami

    dave

    ```'
