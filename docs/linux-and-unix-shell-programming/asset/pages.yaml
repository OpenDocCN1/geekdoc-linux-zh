- img_proc: true
  md: 'Here are the file descriptors and their more common names.


    | Files | File descriptor |

    | --- | --- |

    | Input file – standard input | 0 |

    | Output file – standard output | 1 |

    | Error file – standard error | 2 |


    There are actually 12 file descriptors, but as can be seen from the above table,
    0, 1, and 2 are reserved for the ''standard'' input, output and errors. You are
    free to use descriptors 3 to 9.


    # 5.6.1 Standard input


    Standard input is file descriptor ''0''. This is where input goes into commands,
    either via the keyboard which is the default, or from the output of other commands.


    # 5.6.2 Standard output


    Standard output is file descriptor ''1''. This is where all the output from your
    commands goes; the default is the screen, but you can send it to a file.


    # 5.6.3 Standard error


    Standard error is file descriptor ''2''. This is where all errors from your commands
    go; the default is the screen, but again you can send it to a file. You may be
    wondering why there is a special file for errors; well, some people like to keep
    their errors in a separate file, especially when processing large files, where
    a lot of errors might be raised.


    If you do not specify a file descriptor, then the default (your screen, or to
    be more accurate, your terminal) is assumed.


    # 5.7 File redirection


    When issuing commands, you can specify where you want the standard input, output
    and errors to go. and to be able to do this you need to do a bit of redirection.
    A combination of the most useful redirections with corresponding file descriptors
    is shown in Table 5.1.


    When using standard error in redirection, you must use a file descriptor, but
    for standard input and output this is optional. Table 5.1 shows both methods for
    completeness.'
