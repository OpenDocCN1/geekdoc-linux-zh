  md: "# CHAPTER 20\n\n# Passing parameters to scripts\n\nWe have already seen how\
    \ to pass parameters to scripts by using the special variables $1..$9. $@ can\
    \ tell us how many parameters have been passed. We also know how to construct\
    \ a usage statement, which is when we need to inform the user on how to call a\
    \ script or function with its proper calling parameters.\nIn this chapter we will\
    \ cover:\n\n+   - shift;\n- getopts; and\n- shift and getopts examples.\n\nTo\
    \ recap, there's a framework of a script that handles the parameters start and\
    \ stop. The script requires two parameters. If it does not get two parameters\
    \ then a usage statement is produced. Notice we use the case statement to process\
    \ the different parameters coming into the script.\n\n```\n$ pg opt\n!/bin/sh\n\
    # opt\n\nuusage()\n{\n  echo \"usage:basename $0 start|stop process name\"\n}\n\
    \nOPT=$1\nPROCESSID=$1\nif [ $$ -ne 2 ]\nthen\n  usage\n  exit 1\nfi\n```"
