  md: '# PWD Environment variables 209


    Contains the pathname of your current directory. Generally set using the cd command.


    # PAGER


    Holds the screen pager command, for instance pg, more. The system uses this variable
    if set when you view man pages.


    ```

    $ PAGER=''pg -f -p&d''; export PAGER

    ```


    # MANPATH


    Holds the directories that contain man pages on the system. Each directory should
    be separated by a colon.


    ```

    $ MANPATH=/usr/apps/man:/usr/local/man; export MANPATH

    ```


    # LPDEST or PRINTER


    Holds the name of your default printer. It saves you specifying the printer name
    when you print jobs.


    ```

    $ LPDEST=hp3si_systems

    ```


    # 14.3.6 Using the set command


    When setting environment variables in your $HOME .profile, there is another method
    for exporting them. Use the set command with the ''-a'' option. Using ''set -a''
    says that all variables should be exported straightaway. Do not use this method
    in /etc/profile, only in your $HOME .profile file.


    ```

    $ pg .profile

    #.profile

    set -a

    MAIL=/usr/mail/${LOGNAME?:}

    PATH=$PATH:$HOME:bin

    #nEDITOR=vi

    TERM vt220

    ADMIN=/usr/adm

    PS1="hostname`

    ```'
