- img_proc: true
  md: "# 18.4.3 Prompting for a y or n\n\nA good use of the case is prompting for\
    \ a response on whether to continue processing. Here the user is prompted to answer\
    \ either y to continue processing or n to exit. If the user enters either y, Y\
    \ or Yes then processing will continue as the execution of the script will continue\
    \ after the case statement. If the user enters n, N or no other response the user\
    \ is exited from the script.\n\n```\n$ caseans\n#!/bin/sh\n# caseans\necho -n\
    \ \"Do you wish to proceed [y..n]\"\nread ANS\ncase $ANS in\ny|Y|yes|Yes) echo\
    \ \"yes is selected\"\n  \nn|N) echo \"no is selected\"\n  exit 0 # no error so\
    \ only exit 0 to terminate\n  \n*) echo \"basename $0` Unknown response\"&2\n\
    \  exit 1\nesac\n# if we are then a y|Y|yes|Yes selected only.\n```\n\nHere's\
    \ the output if we run the script with an invalid response:\n\n```\n$ caseans\n\
    Do you wish to proceed [y..n] :df\ncaseans : Unknown response\n```\n\nAnd with\
    \ a good response.\n\n```\n$ caseans\nDo you wish to proceed [y..n] :y\nyes is\
    \ selected\n```\n\n# 18.4.4 Case and passing command parameters\n\nYou can also\
    \ use case to handle passing parameters to scripts.\nIn the next script, a test\
    \ is carried out on the special variable #$, which holds the number of arguments\
    \ passed. If it is not equal to 1 then it will exit with a usage message.\nA case\
    \ statement traps the following parameters: passwd, start, stop or help. Further\
    \ coding can be undertaken for each of these matched patterns. If an unknown value\
    \ is passed then a usage message is echoed out to standard error."
  merge: -1
  pgno: 285
- img_proc: true
  md: "```\n$ caseparam\n!/bin/sh\n# caseparam\nif [ $# != 1 ]; then\n  echo \"Usage:\
    \ `basename $0[start|stop|help]`\" >&2\n  exit 1\nfi\n# assign the parameter to\
    \ the variable OPT\nOPT=$1\ncase $OPT in\n  start) echo \"starting..`basename\
    \ $0\"\n    # code here to start a process\n    ;\n  stop) echo \"stopping..`basename\
    \ $0\"\n    # code here to stop a process\n    ;\n  help)\n    # code here to\
    \ display a help page\n    ;\n  *) echo \"Usage: `basename $0[start|stop|help]`\"\
    \n    ;\\nesac\n```\n\nWhen the script runs with an invalid parameter passed we\
    \ get\n\n```\n$ caseparam what\nUsage:caseparam [start|stop|help]\n```\n\nAnd\
    \ with a valid parameter passed:\n\n```\n$ caseparam stop\nststopping..caseparam\n\
    ```\n\n# 18.4.5 Trapping input with no pattern commands\n\nYou do not have to\
    \ put commands after the pattern match part if you do not want to; not doing this\
    \ is generally a good way of filtering out unwanted responses before carrying\
    \ out further processing.\n\nIf we wanted to run an account report for an accounts\
