- img_proc: true
  md: '# CHAPTER 8


    # The grep family


    Grep, I believe, is one of the most widely used tools in UNIX or LINUX. Grep (global
    regular expression print) allows you to search through a text file or text files
    for a pattern. If the pattern is found, grep will print out all the lines that
    contain that pattern. Grep supports the regular expressions (basic) as well as
    the extended set. Grep comes in three variations, which are:


    Grep: This is the standard grep. It has been around the longest and is the one
    we''ll focus on.


    Egrep: Extended grep. This supports the basic and extended regular expression
    range except for the use of the \ pattern range. There are a couple of other patterns
    grep gets picky on, but we won''t discuss them here.


    Fgrep: Fast grep. Allows you to search for a string instead of a pattern. Don''t
    get confused by the word ''fast'', it isn''t really, it''s just the same speed
    as grep. In this chapter we will cover:


    +   - grep options;

    - general pattern matching with grep;

    - matching only alpha or numeric or both;

    - matching character ranges.


    There should really be only one grep command, but unfortunately there is not a
    single pattern procedure that can cope with all three grep parameters rolled into
    one, and still retain the speed of the separate variations of grep. The GNU grep
    though has come a long way towards harnessing the three greps, and it does not
    distinguish between the basic and extended set of metacharacters.


    I said in the last chapter that we would be dealing only with the basic regular
    expression set, but we will also look at some extended pattern matching when we'
  merge: -1
