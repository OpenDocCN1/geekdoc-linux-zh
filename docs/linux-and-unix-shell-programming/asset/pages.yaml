    to specify the left curly bracket ({}) you must type \{ to disable the curly bracket''s
    special meaning.


    # 12.1.2 Saving output


    If you wish to save the output of your results, you have to redirect them to a
    file. The example below redirects output to a file called results.txt. The input
    file is oops.txt.


    ```

    $ tr -s "[a-z]" oops.txt >results.txt

    ```


    Let''s look at some examples.


    # 12.1.3 Getting rid of repeated characters


    Looking at the file below, it contains some typing errors. This is easily done,
    of course— how many times have you been in the vi editor and accidentally kept
    a key depressed?


    ```

    $ pg oops.txt

    And the cowwws went homeeeeeee

    Or did theyyyyy

    ```


    If we want to get rid of the recurring letters or squeeze the duplicated letters
    together, we can use the ''-s'' option. We''ll use [a-z] as they are all alpha
    characters. The input file is redirected into tr.


    ```

    $ tr -s "[a-z]" oops.txt

    And the cows went home

    Or did they

    ```


    All the duplicate characters have now been ''squeezed'' into one, to speak. I
    could have piped the file oops.txt using cat if I wanted to; the results are still
    the same.


    ```

    $ oops.txt | tr -s "[a-z]"

    And the cows went home

    Or did they

    ```


    # 12.1.4 Deleting blank lines


    To delete blank lines, we ''squeeze'' them out of a file. Here’s a file called
    plane.txt containing some blank lines between text.'
  merge: -1
  pgno: 203
- img_proc: true
  md: '$ pg plane.txt

    987932 Spitfire


    190992 Lancaster

    238991 Typhoon


    ```

    $ tr -s "[012]" < plane.txt

    987932 Spitfire

    190992 Lancaster

    238991 Typhoon

    ```


    Alternatively we could have used the shorthand notion for the new line which is
    `\n`. We can use single or double quotes (double quotes is usual though).


    ```

    $ tr -s "\n" < plane.txt

    987932 Spitfire

    190992 Lancaster

    238991 Typhoon

    ```


    # 2.1.5 Upper to lower case


    Using tr to change character cases must be one of its widely used options. after
    control character deletes. To convert, all we need to do is specify lower case
    `[a-z]` in what we''re translating from and upper case `[A-Z]` in what we are
    translating.


    In the first example a string is echoed into tr containing a mixed set of characters.


    ```

    $ echo "May Day, May Day, May, Going Down." | tr "[a-z]" "[A-Z"

    MAY DAY, MAY DAY, GOING DOWN..

    ```


    Alternatively, I could have used the character classes `[:lower:]` and `[:upper:]`.


    ```

    $ echo "May Day, May Day, May, Going Down." | tr "[:lower:]" "[:upper:]"

    MAY DAY, MAY DAY, GOING DOWN..

    ```


    To translate a text file from upper to lower case and place it in a new file using
    this format:


    ```

    cat file-to-translate | tr "[A-Z]" "[a-z]" > new-file-name

    ```'
