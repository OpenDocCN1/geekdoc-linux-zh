    # 19.10.4 Putting it all together


    The functions we have covered so far in this chapter were in no particular order.
    The aim of the example functions was to show you that a function does not have
    to be lengthy or reserved for complicated coding.


    Many of my functions do pretty stuff – they do not break any new ground in scripting,
    they just save you from retyping the same bits of code and that''s really what
    a function should do; anything else is a benefit.


    At the beginning of the chapter, we looked at how functions were used in the shell.
    When I first got into using functions, it took a while to get my head around the
    values returned by a function.


    The examples we have seen incorporate different methods of calling and testing
    the returned functions so, if you have any problems, just check out the examples
    to see how the functions can be returned and the values tested.


    Here is a tip for you. When testing a function, test it as a script first; when
    you are happy with the results then turn it into a function. You will save a lot
    of time by doing that way.


