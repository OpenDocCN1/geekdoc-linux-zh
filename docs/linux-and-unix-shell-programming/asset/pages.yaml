    # Decoding an encoded string


    When the user clicks on ''submit'' the information is assigned to the variable
    QUERY_STRING, and the string gets encoded in the following way:


    +   * All spaces are replaced by +

    * All value fields are separated by &

    * All values and their corresponding fields are separated by ='
