    Assign this name to the EDITOR variable, and that''s what you''ll use all the
    time if you use cron other applications that require you to use an editor. The
    system looks for the value held in the variable EDITOR, and will use that as your
    default editor.


    Here''s an example. Our audit system logs that need to be edited. When I select
    this option from the menu, the application looks for my EDITOR variable; it sees
    the value is vi, and then knows to use this editor.


    Here''s another example; to log in to my sybase system, I would have to type this
