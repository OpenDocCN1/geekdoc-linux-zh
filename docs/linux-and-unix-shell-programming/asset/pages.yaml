  md: '# CHAPTER 25


    # Going further with here documents


    We have already met here (redirection) documents a few times when we dealt with
    standard input and output and while loops. We learnt how to send mail and how
    to construct a menu screen, but there are also other uses for here documents.


    In this chapter we will cover:


    +   - creating a quick file;

    - automatically navigating menus;

    - ftp transfers; and

    - connecting to other application systems.


    The format for a here document is:


    ```

    command < <word

    text

    word

    ```


    To recap on here documents, this is how they work. When the shell sees the <<,
    it knows the next word is a delimiter (word). Anything after the word it treats
    as input until it sees the word again on a line by itself. The delimiter word
    can be any word you like.


    You can use here documents to create a file, print a list of files or maybe to
    sort a list of files or create screens.'
  merge: -1
  pgno: 420
- img_proc: true
  md: '# 25.1 Creating a quick file


    Here’s a quick way to create a file with some text in it:


    ```

    $ cat >> myfile <<NEWFILE

    ```


    Now you some text, and when you have finished simply type NEWFILE on a new line
    and you have got yourself a file called myfile, containing some text.

    If you supply a filename that already has some text in it, the contents you type
    in will append to the original file.

    If you use the tab key, please note that some older shell versions do not preserve
    the meaning of tabs. To overcome this simply use a hyphen after the two left angled
    brackets, like this.


    ```

    cat > myfile <<- NEWFILE

    ...

    ```


    # 25.2 Creating a quick print document


    Suppose you wanted to create and print a little message document. You do not have
    to run vi; you can use this method instead. As soon you hit return after typing
    QUICKDOC using this example, the document will be sent to the printer.


    ```

    $ lpr <<QUICKDOC

    **** INVITATION****

    The Star Trek convention is in town next week. Be there.

    ```


    ```

    Ticket prices: (please phone)

    -----------------------------

    QUICKDOC

    ```


