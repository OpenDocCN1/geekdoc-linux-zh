    echo "Hello world this is `basename $0` calling

    ```


    $ param2

    Hello world this is param2 calling


    # 14.4.2 Passing parameters to system commands


    You can pass parameters to a system command within a script. In the following
    example we use the find command, using the parameter $1 to specify the filename
    we wish to find.


    ```

    $ pg findfile

    !/bin/sh

    # findfile

    find / -name $1 -print

    ```


    ```

    $ datafile passwd

    /etc/passwd

    /etc/uucp/passwd

    /usr/bin/passwd

    ```


    Here''s another example, passing a user-id to grep in the form of $1; grep uses
    this to search the seany passwd file for the user''s full name.


    ```

    $ pg who_is

    !/bin/sh

    # who_is

    grep $1 passwd | awk -F: {print $4}

    ```


    ```

    $ who_is seany

    Seany Post

    ```


    # 14.4.3 Special variable parameters


    Now that we know how to access and use parameters to shell scripts, it would be
    useful to have a bit more information about them. You really need to have a bit
    more control in what the script is going to do with them. There are special variables
    that come in all. Let''s look at them (see Table 14.2).'
