    # 10.4.10 Printing line numbers


    To print line numbers we use the equals sign ''=''. To be able to print the line
    number of a pattern match, use this format: ''/pattern/=''.


    ```

    $ sed -e ''/music/'' quote.txt

    The honeysuckle band played all night long for $90.

    2

    It was an evening of splendid music and company.

    Too bad the disco floor fell through at 23:10.

    The local nurse Miss P.Neave was in attendance.

    ```


    The whole file has been printed out with the line number above the matched line.
    If you are concerned only about the actual line number, use the -e include like
    this:


    ```

    $ sed -n ''/music/='' quote.txt

    2

    ```


    If you want to print the line number and then only the matched line, you must
    use two sed commands, using the ''-e'' option. The first command prints the pattern
    match, the second will print the line number using the = option. The format now
    becomes sed -n -e ''/pattern/p'' -e ''/pattern/=''.


    ```

    $ sed -n ''/music/p'' -e ''/music/='' quote.txt

    It was an evening of splendid music and company.

    2

    ```


    # 10.4.11 Appending text


    To append text we use the a\ symbol, which will append one or more lines of given
    text to the addressed line. If you do not supply an address on where to put the
    text, sed will default it on each line. When appending you cannot specify a range.
    You are allowed only one address pattern. When text is appended, it goes to the
    standard output (screen.), so be aware that it cannot be edited. This is because
    when sed is first invoked it copies text from the file into a buffer area. This
    area is where all the sed edits are carried out — remember sed never works on
    the original file, because the text goes straight to the standard output, and
    sed has no copy of it.'
