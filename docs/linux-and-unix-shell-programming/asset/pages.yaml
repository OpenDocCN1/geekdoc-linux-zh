    # 27.5 logroll


    A few of the logs on my system grow quite quickly. Having to manually check the
    size of these logs for file sizes and then roll over the log (usually with a data
    stamp) was tedious. Therefore I decided I set a script to do this automatically.
    The script would run from cron, and if any of the logs reached a certain size,
    the guilty log rolled over and a new file created.


    The script can easily be amended to use other logs. For my system logs, I use
    another script, which is run once a week and truncates the log files. If I need
    to go back over any period I just check my backup; as I run a 16-week cycle this
    is is no problem.


    A size limit is defined in the variable BLOCK_LIMIT. This figure is the block
    size, which I have to set which is 4K. You can set higher if need be. All the
    logs I want to be checked are in the variable LOGS.


    A for loop then through this variable checking each log file, using the command,
    and the size of the log is obtained. If the size is greater than BLOCK_LIMIT,
    it will be copied with a date stamp appended to the file. The original log file
    is then zeroed, and the files group ownership is changed.


    The script is run from cron a couple of times per week, creating a backup of the
    file with a date stamp, which ensures I can back track quickly if there are any
    problems I need to check out.


    ```

    # pg logroll

    !/bin/sh

    # logroll

    # roll over the log files if sizes have reached the MARK

    # could also be used for mail boxes ?

    ```'
