    # 26.4.2 Making a value a variable name


    You can also assign a field of data a variable name. Here''s what I mean. Suppose
    you have a file like this:


    ```

    $ pg data

    PC 486

    MONITOR svga

    NETWORK yes

    ```


    You want to make all the first column of text become variable names, and the second
    column of text to become the first column''s value. So you get this:


    ```

    echo SPC

    486

    ```


    See what I mean? Here''s how we can do it, using eval of course.


    ```

    $ pg eval_it

    #!/bin/sh

    #eval_it

    while read NAME TYPE

    do

    eval `${NAME}=\${TYPE}`

    done < data

    echo `You have a $PC pc, with a $MONITOR monitor`

    echo `and are you network ? $NETWORK`

    ```


    Taking the first piece of data to see how this works, the script reads in PC and
    486, which are assigned to the variables NAME and TYPE respectively. The first
    pass of eval chooses two values of the variables PC and 486, while the second
    pass replaces the NAME with PC and the TYPE with 486.


    When we run the above script we get:


    ```

    $ eval_it

    You have a 486 pc, with a svga monitor

    and are you network ? yes

    ```


    Eval is not a command you will see a lot of in scripts, but it''s the one to use
    when you need to evaluate variables more than once.'
