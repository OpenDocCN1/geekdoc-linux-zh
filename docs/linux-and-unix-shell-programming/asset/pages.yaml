    ```


    The ownership of the file project has now changed hands from louise to pauline.


    # 1.7.2 chgrp examples


    The format of the command chgrp is the same as chown, as shown in the example
    below.


    ```

    -rw-rw-rw 1 pauline admin 345 Sep 20 14:33 project

    $ chgrp sybadmin project

    $ ls -l

    -rw-rw-rw 1 pauline sybadmin 345 Sep 20 14:33 project

    ```


    Pauline has now changed the default group for the file project from admin to sybadmin
    (another group on the system).


    # 1.7.3 Finding out what groups you belong to


    If you want to see what groups you belong to, type:


