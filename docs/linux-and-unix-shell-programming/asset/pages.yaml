    # 11.3 Using uniqiq


    The purpose of uniq is to strip or suppress duplicate lines from a text file.
    Uniq assumes the file has been sorted to get the correct results, though this
    is not set in stone: you can use any type of unordered text and you can even compare
    ordinary lines of text if you wish.


    You may think that this is a bit like the unique option in the sort command. Well
    it is in a way, but with one important difference. The sort''s uniq option gets
    rid of all duplicates, whereas the uniq command does not get rid of all. What
    is a repeated line then? In uniq''s case it means any line that is continuously
    repeated without a break. Here''s an example.


    ```

    $ pg myfile.txt

    May Day

    May Day

    May Day

    Going Down

    May Day.

    ```


    Uniq sees the first three ''May Day'' lines as duplicates, but because there is
    a break in the fourth line with different text it does not acknowledge that the
    fifth line is a duplicate continuation of ''May Day''. Uniq will leave that line
    in.'
  merge: -1
  pgno: 189
- img_proc: true
  md: 'Here’s the general `uniq` format for the command:


    uniq -u d c -f input-file output-file


    Let’s go over the options.


    +   - -u Display only the lines that are not repeated

    - -d Display only the repeated lines and one copy of each of those lines

    - -c Print only a count of each line occurrence

    - -f Where n is a number, the first n fields are ignored


    On some systems the `-f` option is not recognised, so if the `-f` does not work
    on your system use `-n`.\nUsing the text at the beginning of this section, we’ll
    create a file containing text for the examples, and start off by running `uniq`
    against the file.


    ```

    $ uniq myfile.txt

    May Day

    Going Down

    May Day

    ```


    Note that the fifth line stays in which is the last `May Day`. If we had run `sort
    -u` on the file it would have only returned `May Day` and `Going Down`.


    # 11.3.1 Occurrences


    The `-c` option displays the line numbers, the number of hits per repeated line
    found. `uniq` has found that there were three occurrences of the line `May Day`.


    ```

    $ uniq -c myfile.txt

    3 May Day

    1 Going Down

    1 May Day

    ```


    # Not unique


    To see the lines that were not unique use the `-d` option:


    ```

    $ uniq -d myfile.txt

    May Day

    ```


    # Testing on specific fields


    To test uniqueness on only part of a line, use `-n`. For example, `-5` means please
    ignore until after the fifth field; the fields start at number one.'
