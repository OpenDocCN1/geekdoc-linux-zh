  md: "# CHAPTER 19\n\n# Shell functions\n\nAll the code in the scripts so far in\
    \ this book has been executed from top to bottom. This approach is OK, but you\
    \ may have noticed that some segments of the code we have covered in our examples\
    \ has been duplicated further on in the same script.\nnThe shell allows you to\
    \ group a set of commands or statements into a reusable block. These blocks are\
    \ called shell functions.\nIn this chapter we will cover:\n\n+   - defining functions;\n\
    - using functions from within a script;\n- using functions from a functions file;\
    \ and\n- function examples.\n\nA function is made up of two parts:\n\nThe function\
    \ label\nThe function body\n\nThe label is the function name and the body is the\
    \ set of commands inside the function. The label name should really be unique;\
    \ if not you will get confusing results, as the script will first hunt around\
    \ the shell for the function before looking at your calling script.\nHere is the\
    \ format for defining functions:\n\n```\nfunction_name()\n{\n  command1\n  ...\n\
    }\n```"
  merge: -1
  pgno: 316
- img_proc: true
  md: "# 292 Shell functions\n\nor\n\n```\nfunction_name() {\n  command1\n  ...\n\
    }\n```\n\nBoth ways are acceptable. You can also include the scripts, the function\
    \ before the function_name if you wish, this is up to you.\n\n```\nfunction function_name()\
    \ {\n  ... \n}\n```\n\nYou can think of functions as a sort of script within a\
    \ script, but there is one main difference. When you execute a function, it stays\
    \ in the current shell and stays in memory. On the other hand if you execute or\
    \ call a script from within a script then a separate shell is created, wiping\
    \ out all your existing variables that were declared in your previous script.\n\
    \nFunctions can be placed in the same file as your script, or in a separate file\
    \ containing only functions. A function does not have to contain many statements\
    \ or commands – it could just contain a single echo statement, it's up to you.\n\
    \n# 19.1 Declaring functions in a script\n\nHere is a simple function:\n\n```\n\
    hello ()\n  echo \"Hello there today's date is `date\"\n}\n```\n\nAll functions\
    \ have to be declared before you use them. What this means that you must put all\
    \ your functions at the top of the script. You cannot reference a function until\
    \ the shell interpreter has seen it first. To call a function you simply call\
    \ it by its name. In the above example, the function name is 'hello'; the function's\
    \ body contains a echo statement containing today's date.\n\n# 19.2 Using functions\
    \ in a script\n\nNow we have created function let's see it being used in a script."
