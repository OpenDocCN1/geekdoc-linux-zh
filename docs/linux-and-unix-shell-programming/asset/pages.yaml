    # 18.8 Controlling loops using break and continue


    Occasionally when processing you may need to break out or skip certain iterations
    based on some form of criteria. To help you achieve this the shells provides two
    commands:


    +   * break

    * continue.


    # 18.8.1 break


    The break command allows you to break out of loops. Breaks are usually used to
    quit a loop or case statement after some form of processing. If you are inside
    a nested loop, you can specify how many loops you should break out of: for instance
    if you are in a loop within a loop (that''s two loops down), then issue break
    2 to come right out.


    # 18.8.2 Breaking out of a case statement


    Here''s an example. This script will loop forever until the user inputs a number
    above the number 5. To break out of this loop and come back to the shell prompt.


    ```

    $ pg breakout

    #!/bin/sh

    # breakout

    # while : means loop forever

    while:

    echo -n "Enter any number [1..5] :"

    read ANS

    case $ANS in

    1|2|3|4|5) echo "great you entered a number between 1 and 5"

    ;;

    *) echo "Wrong number..bye"

    break

    ;;

    esac

    done

    ```'
  merge: -1
  pgno: 310
