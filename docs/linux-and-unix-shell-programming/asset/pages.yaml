  md: '# CHAPTER 13


    # The login environment


    When you log in to the system, before you are even presented with the command
    prompt, a couple of tasks happen. After you have typed in your login name and
    password, the system checks that you are indeed a valid user. It does this by
    checking the /etc/passwd file. If your login name is OK and the password entered
    is valid, the next process can begin, which is your login environment. In this
    chapter we will cover:


    +   - the process of logging in;

    - the /etc/profile;

    - the $HOME.profile;

    - customizing your $HOME.profile.


    Before we look at the next process let''s first look at the /etc/passwd file,
    which is a text file. You can alter any of the text fields including the password
    fields, so be careful. The passwd file contains seven fields, each of which is
    separated by a colon. Below is a partial listing of a passwd file. I have put
    column numbers at the top, so you can easily identify each field.


    ```

    [ 1 ] 2 [ 3 ] [ 4 ] [ 5 ] [ 6 ] [ 7 ]

    kvp:JFqMmk9,uRioA:B/0J:4013:K.V.Pally:/home/sysdev/kvp:/bin/sh

    dwh:hi/G4U1CD9al9,B/0J:4071:D.Whitely:/home/dept47/dwh:/bin/sh

    aec:IlGHtjx9XtSc,B/GI:408:401:A.E.Cloody:/b_user/dept47/aec:/bin/sh

    gdw:IlFu99BB8RNjpc,B/MK:409:401:G.D.Wilcox:/b_user/dept47/gdw:/bin/sh

    ```


    Let''s look at some of the fields. The first field is the login name. The second
    field is encrypted. The fifth field is the user''s name. The sixth field'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# 188 The login environment


    is the user''s home directory. The seventh field is the shell that is to be used
    by the user. In this case ''//bin/sh'' means the default shell which is by convention
    the Bourne shell.


    There are other types of passwd around: one version is where the actual passwd
    field is held in another file. The above is the most common format.


    After a successful login, two environment files are then executed. The first is
    a file called /etc/profile and the second is a file called .profile, located in
    your $HOME (home) directory.


    There are other initializing files that are processed, but we are only concerned
    with the profile files.


    # 13.1 The /etc/profile


    The profile file located in /etc is read automatically by everyone when they log
    in. This file will generally contain:


    +   - global or local environment variables;

    - PATH information;

    - terminal settings;

    - security commands; and

    - message of the day or disclaimer information.


    Here''s a brief explanation of the above points.

    Certain global environment variables are set so that users and their applications
    can have access to them.

    PATH holds the location of directories containing executable, library, or just
    plain files that you locate them quickly.

    Terminal settings lets the system know about the more general characteristics
    of your terminal.

    Security commands will include file creation modes, or double login prompts for
    sensitive areas.

    Message of the day is a text file holding any forthcoming events for users to
    see when they log in, or any disclaimer messages.


    Here is an /etc/profile, which will be discussed after the listing.


    ```

    $ pg /etc/profile

    !/bin/sh

    #

    trap "" 2 3

    ```'
