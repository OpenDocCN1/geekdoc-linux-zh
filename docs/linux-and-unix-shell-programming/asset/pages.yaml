    Connected=`who | awk '{print $1}' | grep -xc ${LOGNAME}`\nif [ \"Connected\" -gt\
    \ 2 ]\nthen\necho\necho 'You are logged in more than twice.'\necho\nwho -u | grep\
    \ $LOGNAME\necho\necho 'Enter <CR> to exit \\c'\nread FRED\nkill -15 $PID\nfi\n\
    \  ;\nesac\n# set the prompt to hold the user id\nPS1=\"$LOGNAME >\"\n```\n\n\
    Do not worry if you do not understand some of the commands; they are\nall covered\
    \ later in the book. You can then refer to this listing and when you\nlike.\n\n\
    The first line traps a couple of signals, which stop users using the QUIT\nor\
    \ <CTRL-C> key to break out of the file execution.\nNext we export the LOGNAME.\
    \ I have added extra man pages in the system.\nMANPATH will add on to the existing\
    \ man pages search list.\n\nCheck the time zone file and source if it is present.\
    \ Set the emulation to\nt220.\n\nReset the trap so that users can break out of\
    \ the message of the day file, but\nreset it after updates.\nSet up the mail message\
    \ (that's the message you get when you have new\nmail)."
