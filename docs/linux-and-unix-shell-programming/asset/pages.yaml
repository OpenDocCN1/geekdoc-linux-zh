  md: 'Other methods of starting and shutting down 449

    $ ls -1

    lrwxr-xr-x 1 root root 27 May 8 14:43 K35rc.audit -> ../init.d/


    I can now do the same for the other directories where I want the audit service
    stopped. Now when the system reboots, it will be stopped; or when the run level
    to 2 or 1, it will also be started if the run level changes to 4 or 5.


    # 28.5 Using inittab to launch applications


    There are other ways to start up applications; indeed, you can do this by placing
    an entry in inittab. On a couple of systems I look after, I have entries in inittab
    not because these systems do not have run level directories, but because I have
    a few system checker scripts that I want to be run as soon as the system has finished
    up. Inittab is an ideal place to put these.

    For this example we''ll use one of my disk mirror check scripts that is run as
    soon as we are in run level 3. First I make sure the script runs properly, then
    make a backup copy of inittab.


    ```

    $ cp /etc/inittab /etc/inittab.bak

    ```


    Next edit inittab. I make the following entry at the end of the file.


    ```

    # disk checker script, let''s see if any of the mirrors are broken.

    rc.diskchecker:3:once:/usr/local/etc/rc.diskchecker > /dev/console 2>&1

    ```


    Now save and exit.

    The above entry says:


    ```

    Rc.diskchecker is the unique ID at run level 3. Run this process once. The script
    is /usr/local/etc/rc.diskchecker: put all its output to the console.

    ```


    # 28.6 Other methods of starting and shutting down services


    If you do not want to mess with the /etc/inittab file, there is another method
    open to you. Most systems have an rc.local file, located in or around /etc. This
    is a script file that kicks off after all the inittab and rc.scripts have been
    started. You can enter any commands in this file if you wish, or add an entry
    to call your favourite start-up script.'
  merge: -1
  pgno: 474
- img_proc: true
  md: 'Some systems also ship a script file called shutdown in /bin though more generally
    in /usr/sbin. Use this to shut down your favourite services when the shutdown
    command is issued.


    # 28.7 Conclusion


    Run levels are really a system administration area. The objective of this chapter
    has been to make you aware of the control and flexibility you can have in deciding
    and implementing the different services or scripts you may want to have started
    when the system comes up.


    It also means you do not have to worry about starting up or stopping a service
    manually when the system is rebooted.'
  merge: -1
