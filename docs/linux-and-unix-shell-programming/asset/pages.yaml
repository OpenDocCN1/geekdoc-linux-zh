  md: '# Appendix B


    printf


    Format:


    printf format arguments


    This command prints formatted text to the standard output, and is similar to awk
    printf function.


    Format:

    Format can contain three different types of items; we will only look at formatting.

    The sequence to format is:


    ```

    %%-[ +j].mn

    ```


    where the hyphen will left-justify a field. Generally speaking the m is used to
    represent the length of a field and n is the maximum length of the field.

    The % sign is preceded by any of the following to format characters:


    +   - s string

    - c character

    - d decimal

    - x hexadecimal number

    - o octal number


    Printf by itself does not generate a new line; you have to use the escape sequence
    for that. Here is a list of the most common escape sequences.


    +   - \a sound bell

    -\b backspace

    -\r carriage return

    -\f form feed

    -\n new line

    -\t tab


    ```

    $ printf "Howzat!\n"

    Howzat!

    ```


    prints a string to standard output; use `''\n` to force a new line, while


    ```

    $ printf "\x2B\n"

    +

    ```


    converts the hex number 2B to its decimal ASCII character, which is a ‘+’.


    ```

    $ printf "%-10sStand-by\n"

    Stand-by

    ```


    prints a string left justified, starting 10 characters out from the left margin.'
