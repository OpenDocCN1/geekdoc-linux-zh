  md: '# 21.2.6 Centring text on the screen


    It would not be too much trouble to centre text on the screen. All we need to
    do get the columns from tput and then work out the length of the string, take
    that value away from tput columns and divide the answer by two. All that is left
    to supply the row number where we want the string to be displayed.


    Here''s the piece of code that does the job. Only a slight change would be needed
    to read lines from a file and centre all the text on the screen.


    Enter some characters, hit return and the text is displayed in the middle of row
    at 10.


    ```

    echo -n "input string "

    read STR

    # quick way of getting length of string

    LEN=`echo $STR | wc -c`nCOLS=`tput cols`nNEW_COL=expr \`COLS - $LEN \) / 2

    xy 10 $STR

    ```


    For the above function to be more flexible you will probably want to call it with
    some text and a row number as well. This function will do that.


    ```

    centertxt(

    _ROW=$1

    STR=$2

    # quick way of getting length of string

    LEN=`echo $STR | wc -c`

    COLS=`tput cols`

    NEW_COL=expr \`COLS -- $LEN \) / 2

    xy $_ROW $_NEW_COL

    echo $_STR

    )

    ```


    You could call the above function like this:


    ```

    centertxt 15 "THE MAIN EVENT"

    ```


    or like this, with the string as an argument:


    ```

    centertxt 15 $1

    ```


