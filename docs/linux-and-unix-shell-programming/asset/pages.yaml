    Table 9.4 Awk''s built-in string functions


    | gsub(r,s) | Substitute s for r globally in S0 |

    | gsub(r,s,t) | Substitute s for r globally in t |

    | index(s,t) | Return the first position of string t in s |

    | length(s) | Return length of s |

    | match(s,r) | Test if s contains a substring match by r |

    | split(s,a,fs) | Split s into array a on fs |

    | sprint(fmt,exp) | Return the exp formatted according to fmt |

    | sub(r,s) | Substitute s for the leftmost longest substring of S0 |

    | substr(s,p) | Return suffix of s starting at p |

    | substr(s,n) | Return substring of s of length n starting at p |'
