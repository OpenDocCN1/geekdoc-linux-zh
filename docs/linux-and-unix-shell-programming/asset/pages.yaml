  md: '# Introducing the get and post methods 469


    All symbols and some special characters are represented by %xy, where xy is the
    lot of those that character. Looking at our QUERY_STRING we have a the textarea
    variable.


    The cgi protocol allows that characters that are in the form of %xy (where xy
    is a hex number) should be converted to the ASCII character equivalent. These
    characters consist of the special characters &, %, +, =, (.) and all other symbols
    above the ASCII decimal range of 127. For instance the other ( would characters
    in be %29.


    Hex characters are generated when the user enters these symbols or characters
    in free text boxes. However, they can also be part of a menu text selection.


    To break down the encoded string we have to:


    +   - change all occurrences of & to line feeds

    - change all occurrences of + to spaces

    - convert all occurrences of = to spaces

    - convert %xy values to their ASCII character equivalents.


    Once we have done all, we need to be able to query or access each variable, so
    we can do something with the information sent. Decoding is only half the job,
    albeit the most task-intensive part. To be able to access the variables we can
    use the eval command.


    The following script will carry out all the conversions needed and be able to
    access the variables. The script is heavily commented so you can understand what
    is happening.


    ```

    $ pg conv.cgi

    !/bin/sh

    # conv.cgi

    # decode URL string

    echo "Content-type: text/html"

    echo "<HTML><PRE>

    # display the method and the coded string

    echo "Method : $REQUEST_METHOD"

    echo "Query String : $QUERY_STRING"

    echo "<HR>"

    # use sed to replace all & with tabs

    LINE=$QUERY_STRING | sed ''s/&/g''


    for LOOP in $LINE

    do

    # split the fields into NAME and TYPE

    NAME=$(echo $LOOP | sed ''s=/ //'' | awk ''{print $1}'')

    # get the TYPE replace all = with spaces and %hex_num with \hex_num

    # replace all + with spaces

    ```'
