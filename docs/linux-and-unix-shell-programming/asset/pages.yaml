    To be able to split the fields so we can assign variables to each field (remember
    they are colon-separated), we have to change the IFS setting to the colon. If
    we do not, we would not be able to read the record. When changing the IFS it is
    always a good idea to save the settings first so you can restore them again when
    the script has finished.


    To save IFS:


    ```

    SAVEDIFS=$SIFS

    ```


    To change it to a colon:


    ```

    IFS=:

    ```


    When we have finished with the IFS we can then simply restore it:


    ```

    IFS=$SAVEDIFS

    ```


