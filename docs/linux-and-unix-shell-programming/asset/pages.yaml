    # 29.5 Introducing the get and post methods


    So far we have only displayed output to the screen. To be able to get information
    from the user we need to use forms, which is why cgi scripting has become so popular.
    You need the ability to process the user''s input. With forms you can display
    text boxes, pull down menus and radio buttons.

    Once the user has input or selected some information into the form, the user then
    clicks on send to send the information to a script, a cgi script in our case.
    How this information is collected is where get and post come into play.


    # 29.5.1 get method


    The default action by any form is the get method. The get method is the one used
    to retrieve files from static HTML pages.

    When a user clicks on submit, the information that was selected or chosen by the
    user is appended to the server''s URL as an encoded string. The server''s environment
    variable QUERY_STRING picks up this encoded string. The variable REQUEST_METHOD
    will also hold the form used.


    # Creating a simple form


    Let''s create a simple form, creating a link from our main.shtml document to a
    script called booka.cgi.

    Insert the following two lines after the last link entry we created in main.shtml:


    ```

    <BR>

    Basic form using GET method <A HREF="cgi-bin/booka.cgi">Form1</A>

    ```


    Now type the following in and save it as booka.cgi; don''t forget to put it in
    your cgi-bin directory.'
