    # 8.5 egrep


    egrep stands for expression or extended grep depending on who you listen to. Egrep
    accepts the full range of regular expressions. One of the nice features of egrep
    is that you can store your strings in a file and pass them into egrep. We do this
    with the -f switch. If we create a file called grepstrings and then type 484 and
    47 into:


    ```

    $ pg grepstrings

    484

    47

    $ egrep -f grepstrings data.f

    ```


    this would match all records with 484 or 47 in them. The -f switch becomes useful
    if you want to match a lot of patterns, and typing them in the command line becomes
    awkward.


    If we want to search for store codes 32L or 2CC we can use the bar sign (), which
    means one of the other or the both (all), separated by the bar sign.


    ```

    $ egrep ''(32L|2CC)'' data.f

    47 Oct 3ZL1998 LPSX 43.00 KVM9D 512

    219 dec 3ZL1999 CAD 23.00 PLV2C 68

    216 sept 3ZL1998 USP 86.00 KVM9E 234

    ```


    You can use many bars as you want. If we want to see if users louise, matty or
    pauline were logged into the system we could use the who command and pipe the
    output through egrep.


    ```

    $ who | egrep (louise|matty|paoline)

    louise pty8

    matty tty02

    pauline pty2

    ```


    You can also exclude certain strings using the caret (^). If I wanted to see who
    was on the system, but I did not want to know if users matty and pauline were
    on I could this:


    ```

    $ who | egrep -v ''^(matty|paoline)''

    ```


    If you want to search a directory listing for files that were called shutdown,
    shutdowns, reboot or reboots, this is easily accomplished with egrep.


    ```

    $ egrep ''(shutdown | reboot) (s)?'' *

    ```'
