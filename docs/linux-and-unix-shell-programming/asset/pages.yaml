  md: '# 220 Quoting


    Now let''s try again with the date command.


    ```

    $ echo ''date''

    Sun May 16 16:40:19 GMT 1999

    ```


    This time the command is valid, and the shell can evaluate it correctly.

    Let''s now assign the output of the date command to a variable called mydate.

    Here''s the format of the date:


    ```

    $ date +%A "%e" of "%B" "%Y"

    Sunday the 16 of May 1999

    ```


    Now assign it to mydate, and display it.


    ```

    $ mydate=''date'' +%A the "%e" of "%B" "%Y"

    $ echo $mydate

    Sunday the 16 of May 1999

    ```


    Of course I have just assigned the whole output of date to mydate:


    ```

    $ mydate=''date''

    $ echo $mydate

    Sun May 16 16:48:16 GMT 1999

    ```


    Here''s another example, but here we embed back quotes within double quotes:


    ```

    $ echo "The date today is ''date''"

    The date today is Sun May 16 16:56:53 GMT 1999

    ```


    Let''s print a little message showing how many users are on the system.


    ```

    $ echo "There are '' | wc -l '' users on the system"

    There are 13 users on the system

    ```


    In the example above, the string is printed, and the shell sees the back quote
    and knows to take everything inside the back quotes and evaluate it, which means
    to execute it.


    # 15.5 Backslash


    The backslash stops the shell from misinterpreting the next character if it has
    special meaning to the shell. The following characters may have special meaning:
    & * = ^ $

    "" | ?


    Issuing the echo command with an * causes a listing of the whole current directory
    in a squashed format, instead of echoing just the asterisk.'
