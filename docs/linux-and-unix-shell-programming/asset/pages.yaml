  md: '2. Use the word ‘return’, which will return from the function to the next statement
    of your script from whence it was called. A value can be used with the return:
    this is optional, and is 0 for non-errors and 1 for errors, pretty much the same
    as the last status command reports. The format is:


    +   - return from the function, use the last status command to determine status

    - return 0 for non-errors

    - return 1 for errors


    # 19.5 Testing the values returned by a function


    To test a value returned by a called function you can use the last status command
    directly after the function is called from your script. For example:


    ```

    check_it_is_a_directory $FILENAME # this is the function call and check

    if [ $? = 0 ] # use the last status command now to test

    then

    echo "All is OK"

    else

    echo "Something went wrong!"

    fi

    ```


    A much better way is to use an if statement when testing on either a 0 or 1 value
    like. Enclosing the function call with an if statement makes better logical reading.
    For example:


    ```

    check_it_is_a_directory $FILENAME; then

    echo "All is OK"

    # do something ??

    else

    echo "Something went wrong !"

    # do something ?

    fi

    ```


    The function is going to echo output from a result of some test then use substitution
    to grab the result. The format for using substitution with function calls is:


    ```

    variable_name = `function_name`

    ```


    The output from the function function_name is assigned to the variable variable_name.


    Shortly we will see lots of different functions and different ways of using the
    return values and output from a function.'
