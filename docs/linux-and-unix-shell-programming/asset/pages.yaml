    ```

    $ file data.f

    data.f: ASCII text

    ```


    ```

    $ file month_end.sh

    month_end.sh: Bourne shell script text

    ```


    fuser


    Format:


    fuser options file


    Options:


    +   -k kill all processes on file or file system

    -u show all processes on file or file system


    The fuser command is used to show processes that are running on a file system
    or files that are being accessed. Some systems use -u and -m interchangeably.
    You can use the if command statement with the fuser command. To lists processes
    active on the device /dev/hda5:


    ```

    $ fuser -m /dev/hda5

    /dev/hda5:1 1r 1c 1e 37 37r 37c 37e 144

    144r 144c 144e 158r 158c 158e 167r 167c

    167e 178r 178 178c 178e 189 189r 189c

    ```


    To kill all processes on the device /dev/hda5:


    ```

    $ fuser -k /dev/hda5

    ```


    To see if the file doc_part is open and what processes are running on it:


    ```

    $ fuser -m /root/doc_part

    /root/doc: 1 1r 1c 1e 37 37r 37c 37e 144

    144r 144c 144e 158r 158c 158e 167r 167c

    167e 178r 178 178c 178e 189 189r 189c 189e 201

    201r 201c 201e 212 212r 212c 212e 223 223r

    ```'
