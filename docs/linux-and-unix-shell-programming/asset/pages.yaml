  md: "What is your surname :Tansleyl\nTansley contains errors, it must contain only\
    \ letters\nWhat is your surname :Tansley\n\n# The echo problem\n\nThere have been\
    \ references to which type of echo statement to use depending on whether you are\
    \ using LINUX, BSD or System V throughout this book. We will create a function\
    \ that will determine what type of echo statement to use.\nWhen an echo is used\
    \ the prompt can be kept at the end of the echo,\nawaiting further input from\
    \ a read command.\nLINUX and BSD use the -n option of the echo command to do this.\n\
    Here's an example of a LINUX (BSD) echo, where the prompt is kept at the end:\n\
    \n```\n$ echo -n \"Your name :\"\"\nYour name : {{}}\n```\n\nSystem V uses \\\
    c to keep its prompts at the end:\n\n```\n$ echo \"Your name :\\c\"\nYour name\
    \ : ⊔\n```\n\nTo control characters LINUX also requires the -e option at the beginning\
    \ of the echo statement. Other systems can just use the backslash to let the shell\
    \ know about the presence of a control character.\nThere are two ways to test\
    \ which type of echo statement to use. We will look at both methods, and then\
    \ you can choose which one to use.\n\nThe first method involves testing the control\
    \ character inside the echo statement. If we type echo \\007 and a bell sounds,\
    \ it's a System V. If just the string \\007 is displayed then it's LINUX.\nHere\
    \ is the first function that tests for control characters:\n\n```\nuni_prompt\
    \ ()\n# uni_prompt\n# universal echo\n{\nif ` echo \"\\007\"` = \"\\007\" ] >/dev/null\
    \ 2&1\n# does a bell sound or are the characters just echoed?\nthen\n  # characters\
    \ echoed, it's LINUX /BSD\necho echo -n \"$@\"\nelse\n  # it's System V\necho\
    \ \"$@\\c\"\nfi\n}\n```"
