    To change to another setting, just put your new value after the umask command:


    ```

    $ umask 002

    ```


    Make sure the system has the new value.


    ```

    $ umask

    $ 002

    $ touch file2

    $ ls -l file2

    $ -rw-r--r-- 1 dave admin 0 Feb 18 45:07 file2

    ```


    Always work out what you want the permissions to be before you issue the umask
    command. If you don''t you could get some weird results; for example, if I issue
    a umask command with a value of 600, it will give me a creation mask of 066!


    # 1.9 Symbolic (soft) links


    There are two different types of links, soft and hard, but we''ll only be looking
    at the soft link. A soft link is really a pointer to a file. You''ll find that
    soft links come in very handy.


    # 1.9.1 Using soft links saves multiple copies of files


    Here''s how it works. Say you have a file that contains sales information that
    is stored in /usr/local/admin/sales, and everybody in sales wants to look at that'
  merge: -1
  pgno: 43
