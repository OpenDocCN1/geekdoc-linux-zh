    # 11.1 Using sort


    The sort command enables you to sort on many different fields (sort keys) in different
    column orders. You’ll find sort will come in very handy when going over log files,
    or rearranging the text columns for downloaded files for another user. In fact,
    when you use other UNIX tools it assumes the files to be worked on have been previously
    sorted. Anyway, it makes more sense to have a file sorted unsorted.'
  merge: -1
