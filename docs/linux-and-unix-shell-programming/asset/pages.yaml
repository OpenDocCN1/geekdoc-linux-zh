  md: '# 8.2.6 Combining ranges


    Staying with the use of the [] brackets to extract information, suppose we want
    to get city codes where the first character can be any number, the second character
    between 0 and 5 and the third between 0 and 6. If we use this pattern we''ll get
    the following output:


    ```

    $ grep ''[0-9] [0-5] [0-6]'' data.f

    48 Dec 3BC197 LPSX 68.00 LVX2A 138

    483 Sept USP 65.00 LVX2C 189

    47 Oct 3ZL1998 LPSX 43.00 KVM9D 512

    219 dec 2CC1999 CAD 23.00 PLV2C 68

    484 nov 7PL1996 CAD 49.00 PLV2C 234

    483 may 5PA1998 USP 37.00 KVM9D 644

    216 sept 3ZL1998 USP 86.00 KVM9E 234

    ```


    Well, we certainly got a lot of information back. What we wanted but we also got
    other records we didn''t want. However, looking at our pattern, all records that
    have been returned are the correct ones according to our rules. We need to specify
    that the pattern must start at the beginning of each line. We can use the ^ for
    that.


    ```

    $ grep ''[0-9] [0-5] [0-6]'' data.f

    216 sept 3ZL1998 USP 86.00 KVM9E 234

    ```


    > Now''s what I call a good return!


    # 8.2.7 Occurrences in a pattern


    If we want to extract any row that has a number 4 repeated at least twice, we
    could use this:


    ```

    $ grep ''4\{2,\}'' data.f

    483 may 5PA1998 USP 37.00 KVM9D 644

    ```


    Using the comma that that the occurrence should be at least twice. Along the same
    lines, if we wanted to get all records that contained at least 999 (three 9s)
    we could use this:


    ```

    $ grep ''9\{3,\}'' data.f

    219 dec 2CC1999 CAD 23.00 PLV2C 68

    ```


    If you want to search for only so many occurrences then take the comma. This will
    search for two occurrences of the number 9.


    ```

    $ grep ''9\{2,\}'' data.f

    ```'
