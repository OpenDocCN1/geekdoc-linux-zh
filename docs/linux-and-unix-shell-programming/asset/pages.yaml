    # 5.10 exec


    The exec command is used to replace the current shell; in other words a subshell
    is not started. When using this command existing environments are cleared to start
    afresh.


    ```

    exec command

    ```


    where command is generally a script.

    The best description I can think of in explaining exec is to think of it as trampling
    over your current shell.

    When the script has finished the session can be terminated. One of the many uses
    of exec is to run added security scripts, usually put at the end of the user''s
    profile file. If the user inputs an invalid response, the shell is closed and
    they are back at the login prompt. Exec is also popular when opening files with
    descriptors.


    Be aware when exec with file descriptors that it will not overwrite your current
    shell; this is the only occasion it will not.


    # 5.11 Using file descriptors


    To open and close files using file descriptors exec. In the following example,
    I have chosen file descriptor 4, but I could have chosen any number from 4 to
    9. This little script does nothing but reads two lines of a stock file and echoes
    the lines back.


    The first line saves the standard input using file descriptor 4 and opens the
    file for reading. The next two read in two lines of text. The last line closes
    the standard input using file descriptor 4. The rest of the script echoes the
    contents that were read in the variables line1 and line2.


    ```

    $ pg f_desc

    !/bin/sh

    # f_desc

    exec 4<&0 stock.txt

    read line1

    read line2

    exec 0<&4

    ```'
