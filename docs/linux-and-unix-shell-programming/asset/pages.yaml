  md: '# CHAPTER 6


    # Command execution order


    When executing commands, you occasionally need to know that one command has completed
    successfully or failed before carrying on with another command. For example, suppose
    you wanted to copy all the files from one directory to another directory, then
    delete the source directory. You''ll want to know for sure that the copy went
    OK first before you blitz the original directory, otherwise you could lose all
    your source directory contents.


    In this chapter we will cover:


    +   - command execution control; and


    +   - command grouping.


    The shell has a couple of commands that will not execute the second commands unless
    the first went OK or execute the second command if the first one failed. The operators
    that can take care of these types of situations are the command operators && and
    |. The commands can be scripts or system commands. The shell also offers commands
    where you can execute a group of commands in the current shell or subshell, which
    are () and {}.


    # 6.1 Using &&


    Here''s the general format of &&:


    ```

    command1 && command2

    ```


    The operation of these commands is fairly straightforward. The command on the
    left of the && (command1) must be returned true (successfully executed) if the
    command on the right (command2) is to be executed; or to put it another way, ''If
    this command works'' && ''then execute this command\''.'
