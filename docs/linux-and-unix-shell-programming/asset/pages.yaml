    # 18.3.21 Simple security to add login script


    Here is a framework to add extra security before you launch your applications
    when a user logs in. It prompts for a username and password; if the username and
    password match the strings contained in the script then the user is in. If not
    then the user is exited.


    The script works by setting the variables to a false value first – always sure
    that the user input will be wrong. The current settings of stty are saved, so
    we can hide the characters being typed into the password. The stty settings are
    restored.


    If the user enters a correct user ID and password (the password is mayday) the
    variables INVALID_USER and INVALID_PASSWD are set to ''no'' for an invalid user
    or password. A test is then carried out, and if either of the variables is set
    to yes, the default, the script will exit the user.


    Users with valid IDs and passwords are then let in. This is a pretty basic framework
    for a type of login script. In this example valid user IDs are dave and pauline.


    ```

    $ pg ifpass

    #!/bin/sh

    # ifpass

    # set the variables to false

    INVALID_USER=yes

    INVALID_PASSWD=yes

    # save the current stty settings

    SAVEDSTTY=`stty -g`

    echo "You are logging into a sensitive area"

    echo -n "Enter your ID name :"

    read NAME

    # hide the characters typed in

    stty -echo

    echo "Enter your password :"

    read PASSWORD

    # back on again

    stty `$SAVEDSTTY`

    if [ "$NAME" = "dave" ] || [ "$NAME" = "pauline" ]; then

    # if a valid then set variable

    INVALID_USER=no

    fi


    if [ "$PASSWORD" = "mayday" ]; then

    # if valid password then set variable

    INVALID_PASSWD=no

    fi

    if [ "$INVALID_USER" = "yes" -o "$INVALID_PASSWD" = "yes" ]; then

    echo "$(basename $0) : Sorry wrong password or userid"

    exit 1

    fi


    # if we get here then their ID and password are OK.

    echo "correct user id and password given"

    ```'
