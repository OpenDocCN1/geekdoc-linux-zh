  md: '# CHAPTER 9


    # Introducing awk


    If you want to format reports or extract chunks of data from large text files
    then awk will do the job. It is perfect for text scanning and manipulating data.

    From my experience of all the shell filtering tools awk is the most difficult
    to master in its entirety. I do not know why, maybe it''s to do with its syntax,
    or its not very meaningful error messages. You''ll get to know the ''Bailing out''
    and ''awk: cmd. line:'' error messages quite well as you progress through the
    awk language. That''s right, awk language: awk is a programming language all on
    its own. You may be wondering why I have included awk in a shell book. Good question,
    here''s the good answer. Awk by itself may be a demon to learn, but using awk
    in conjunction with other tools such as grep and sed makes your job as a shell
    programmer a lot easier.


    This chapter will not cover all of awk''s many features, nor will it teach you
    how to write advanced awk scripts, that would take practically a book by itself.
    This chapter aims to show you the power of awk one-liners, and how to extract
    information from text files and strings.

    In this chapter we will cover:


    +   - extracting fields;

    - matching with regular expressions;

    - comparing fields;

    - passing values to awk; and

    - basic awk one-liners and scripts.


    Nearly all my scripts have awk commands in them, usually combined with sed or
    grep, to get information out of a text file or a string. To get the information
    you want, the text must have a structured format, and by this I mean the fields
    must'
  merge: -1
  pgno: 121
- img_proc: true
  md: 'be separated by a field delimiter. This can be anything, and can be specified
    when you invoke awk, as we will see later.


    Aw is named after the people who developed the language. Aho, Wenberger and Kernigham.
    There are also nawk and gawk, which have extended text processing features, but
    we will not cover in this chapter.


    At its most basic function, awk''s task is to scan and extract information from
    a text file or string, based on the criteria given to it. When awk has got this
    information, you can then do other text manipulating functions. Full blown awk
    scripts are generally used to format reports from text files.


    # 9.1 Calling awk


    There are three ways awk can be invoked. You can either specify awk on the command
    line like this:


    ```

    awk [-F field-separator] ''commands'' input-file(s)

    ```


    where ''commands'' are the actual awk commands. This method is the one that we
    will use most in this chapter.


    In the above example the use of the -F field separator is optional, as awk uses
    the <space> as a default field separator. So if you are scanning text which has
    spaces between fields you do not have to specify this option; however if you''re
    scanning the passwd file, for example, then those fields are separated by a colon:
    you''ll have to state this with the -F option, like this:


    ```

    awk -F: ''commands'' input-file

    ```


    The second method is to insert all the awk commands in a file then make the awk
    program executable and have the awk interpreter as the first line of the script,
    so it can be called by just typing the script name.


    In the above examples of calling awk, please note the use of single quotes that
    enclose the awk commands.


    The third method is to insert all the awk commands in a separate file and then
    call it:


    ```

    awk -f awk-script-file input-files(s)

    ```


    The -f option states that the awk script is held in the file awk-script-file.
    The input-file(s) are the files you want awk to scan.'
  merge: -1
