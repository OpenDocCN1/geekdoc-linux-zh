    stamp on it. The time you should be the time you want to test up to. You can do
    this with the touch command.


    To find files that have been created within the last two hours, and the time is
    now 23:40 do the following:


    ```

    $ touch -t 0502140 dstamp

    $ ls -1 dstamp

    -rw-r--r-- 1 dave admin 0 May 4 21:40 dstamp

    ```


    A file has been created: we will assume the date May 4 is today for this example.
    The time of creation is exactly two hours before 23:40, which is 21:40.

    Now we can use find with the newer option to display all files that have been
    modified within the last two hours.


    ```

    $ find . -newer dstamp -print

    ```


    # 2.1.8 Find files by type


    UNIX or LINUX has different file types, and as we have already discussed what
    they are, there is no need to go over old ground here. To find all directories
    in /etc:


    ```

    $ find /etc -type d -print

    ```


    To find all files but not directories:


    ```

    $ find . -type d -print

    ```


    To find all symbolic linked files in /etc:


    ```

    $ find /etc -type 1 -print

    ```


    # 2.1.9 Find files by size


    You can specify the size of a file in either characters or blocks. To find files
    that are in character format use Nc, where N is the length in characters, but
    really in bytes. For block length just use the number of blocks.'
