  md: "# CHAPTER 22\n\n# Creating screen input\n\nScreen input or data input is the\
    \ ability to take input (from the keyboard in our case) then validate the input.\
    \ If it's OK accept it, if not throw it back out.\n have seen functions that test\
    \ for certain conditions; for example the length of a string; whether a string\
    \ is either numeric or character based. We will be using these functions amongst\
    \ others in this chapter.\nIn this chapter we will cover:\n\n+   * validating\
    \ input;\n* adding, deleting, amending and viewing records; and\n* working file\
    \ update scripts.\n\nThis chapter may be a bit heavy going at the first read,\
    \ so you may want to scan it first, then come back later. Validation can be fairly\
    \ code-intensive, but to catch all possible errors, the code has to test for at\
    \ least the most probable errors.\nLet's go through each task that is involved\
    \ in creating a general file update system; naming adding, deleting, and viewing\
    \ records. We will create a personal file update system. The records in the file\
    \ called DBFILE will hold the following information.\n\n| Field | Length | Allow\
    \ only | Description |\n| --- | --- | --- | --- |\n| Staff number | 10 | Numeric\
    \ | Employee staff number |\n| First name | 20 | Character | Employee's first\
    \ name |\n| Second name | 20 | Character | Employee's second name |\n| Department\
    \ | | Accounts IT Services Sales Claims | Employee's department |\n\nEach field\
    \ is separated by a colon ':'. For example:\n<Staff number>:< <First name>:< <Second\
    \ name>:< <Department >"
