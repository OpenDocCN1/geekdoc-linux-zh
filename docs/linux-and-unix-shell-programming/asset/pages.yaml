  md: "Or for an invalid report type we get:\n\n```\n$ casevalid\nenter the account\
    \ dept No: :655\n1. post\n2. prior\nenter the type of report:4\ncasevalid: Unknown\
    \ account type.\n```\n\n# 18.4.6 Default variable values\n\nIf the user just hits\
    \ return on a read variable, the script does not always have to exit. A test can\
    \ determine if the variable is set, and if it isn't then a value can be assigned.\n\
    \nIn the following script, a user is asked to input a day to run a report. If\
    \ the user hits return, the default day is used, which is Saturday. That day is\
    \ assigned to the variable WHEN.\n\nIf the user inputs another day, this is validated\
    \ with a case statement for valid days to run, which are Saturday, Sunday and\
    \ Monday. Notice that different abbreviations of the days have been included to\
    \ trap all 'most probable' combinations of the days.\n\nHere's the script:\n\n\
    ```\n$ pg caserep\n!/bin/sh\n# caserep\necho \"Weekly Report\"\necho -n \"What\
    \ day do you want to run report [Saturday]\" :\"\n\n# if just a return is hit\
    \ then except default which is Saturday\nread WHEN\necho \"validating.${WHEN}=\"\
    Saturday\"}\"\ncase WHEN in\nMonday|MONDAY|mon\n  ;\nSunday|SUNDAY|sun\n  ;\n\
    Saturday|SATURDAY|sat\n  ;\n*) echo \"Are you nuts!, this report can only be run\
    \ on \" >&2\n  echo \" on a Saturday, Sunday or Monday\" >&2\n  exit 1\n  ;\n\
    esac\necho \"Report to run on $WHEN\"\n# command here to submitted actual report\
    \ run\n```"
