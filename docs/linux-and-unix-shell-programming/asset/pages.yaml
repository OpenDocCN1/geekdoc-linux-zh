    name is known. It does not matter that the user cannot cd into it.

    Permissions you have set on a directory will override whatever permissions you
    have on that directory. For example, if you have the:


    ```

    drwx-- r-- 1 louise admin 2390 Jul 23 09:44 docs

    ```


    and within the directory, you have the following file:


    ```

    -rwx rwx rwx 1 louise admin 5567 Oct 3 05:40 pay if a user who is a member of
    group admin wants to edit the file doc, they will not be able to access of the
    directory permissions.\

    It is readable by everyone, but because the execute bit for the group is not set
    on the directory, nobody in Louise''s group can access the directory, and all
    they''ll get is a message saying ''access denied''.

    ```


    # 1.6 Set-uid


    In Table 1.1 (see p. 6) there was an entry for user or group set-ID (suid and
    guid). This permission has been a hot potato for the last few years. Some vendors
    do not allow the implementation of this bit or completely ignore it if it has
    been set, because of the security risk it allows. So what''s all the fuss about?

    The idea behind suid is that the person who is running a script where the owner
    has set the suid inherits the permissions of the owner of the script. So if root'
  merge: -1
  pgno: 37
- img_proc: true
  md: 'has a script that has a suid bit and an ordinary user runs this script, he
    assumes root privileges for the script''s run time. The same principle applies
    to guid, which he assumes the privileges of the group that owns the script.


    # 1.6.1 Why use set-uid


    Why use this type of script? Well here''s a good case. I look after a few large
    database systems, to back-up these databases requires a special system profile.
    I have created a few scripts and made them guid, so that certain users who I allow
    to run these scripts do not have to log in as the database administrator and possibly
    cause accidental damage to the servers. By running these scripts they get all
    the rights to the database dumps and other admin stuff, but when the script ends
    they are back to their normal user privileges.

    Quite a few UNIX commands are also suid and guid. To find out what they are, cd
    in the /bin or /sbin directory and:


    ```

    $ ls -l | grep ''^...''

    ```


    The above lists suid files.


    ```

    $ ls -l | grep ''^...s...''

    ```


    The above lists suid and guid files.

    Now we understand what setuid how do we set them? Here''s how. For a suid you
    put 4 in front of the permission bits that you are going to set. For a guid you
    put 2 in front of the permission bits that you are going to set. To have both
    suid and guid add 4 and 2 together.

    With the bits, an ''s'' is placed over the position of the ''x''. Please note:
    an execute bit must be set as well; for example, if I wanted to set a guid, I
    would make sure group had executed permission.

    If I wanted to change my file login to be suid, and it currently has permissions
    rwx rw- r-- (741), I need to put a 4 in front of my chmod permissions, so I type
    chmod 4741, which changes it to rwx rw- r--.


    ```

    $ chmod 4741 logit

    ```


    # 1.6.2 Adding set-uid permission examples


    Here are a couple of examples:


    Table 1.7 Adding set-uid permissions


    | Doing this | Sets it to this | Which means |

    | chmod 4755 | rwx-x r-x | File has suid, owner has read write and executes, group
    and others have read and execute. |'
