  md: "```\ncase $OPT in\nstart|Start) echo \"Starting..$PROCESSID\"\n  # some process\
    \ to go here\n  ;;\nstop|Stop) echo \"Stopping..$PROCESSID\"\n  # some process\
    \ to go here\n  ;;\n*) usage\n  ;;\nsesac\n```\n\nWhen executed, with the following\
    \ input, we get:\n\n```\n$ opt start named\nStarting..named\n\n$ opt start\nusage:opt\
    \ start|stop process name\n```\n\nAny UNIX or LINUX command takes the general\
    \ format:\n\ncommand options files\n\nThe options part can contain up to 12 different\
    \ values. Looking at our example script opt, a lot of coding is going to be put\
    \ in place if we had to handle different command options. At the moment it handles\
    \ only two options, shift and stop.\n\nFortunately the shell provides the shift\
    \ command, to help us shift through the different options. Using shift takes away\
    \ the limitation of using only the special variables $1 to $9 for passing parameters.\n\
    \n# 20.1 The shift command\n\nWhen parameters are passed to a script a method\
    \ is required that will help us shift through each parameter so that we can process\
    \ the options. This is what the shift command does. It shifts positional arguments\
    \ one place to the left. To explain how this works first look at a simple script\
    \ using a while loop to echo out all the arguments passed to a script.\n\n```\n\
    $ pg opt2\n!/bin/sh\n# opt2\nloop=0\nwhile [ $# -ne 0 ]\n  # while there are still\
    \ arguments\ndo\n  echo $1\ndone\n```"
