- img_proc: true
  md: '# CHAPTER 28


    # # Run level scripts


    If you want an application, service or script process to start automatically when
    the system comes up, or to close down properly when the system is rebooted, you
    need to create a run level script. All but one of the LINUX variants now have
    the System V-based run level configuration directories, as do other kinds of UNIX.


    As most systems have this type of configuration, this is what we will cover, but
    if you do not have run level directories, do not worry. You can still start up
    applications automatically; we will discuss this method later on in this chapter.


    In this chapter we will cover:


    +   - run levels;

    - how to create rc.scripts;

    - how to implement rc.scripts with different run levels; and

    - how to start applications from inittab.


    Being able to create run level scripts allows you to have more control and flexibility
    over your system. You need to install a run level script (or more often called
    an rc.script) when you want to start or stop applications at a certain run level.


    Any script that can start and stop an application and is called using the keywords
    ''start'' or ''stop'' is generally regarded as an rc.script. Please note that
    it''s up to the user to ensure that the script he or she is submitting is an rc.script
    that works, ensuring it can stop and start a service properly.


    The mechanism behind the run level configuration directories allows the automation
    of the rc.scripts only during a run level change. It does not check to see if
    all the particular services in a run level have started or been stopped. That''s
    down to you, the shell programmer.


    You can customize run levels to the services you actually need running, but that
    is beyond the scope of this book.'
  merge: -1
  pgno: 466
- img_proc: true
  md: '# 442 Run level scripts


    # 28.1 How can you tell if you have run level directories?


    The directories where the rc.scripts are kept (actually they are links, we''ll
    discuss this later) live in either:


    ```

    /etc/rcN.d

    ```


    or


    ```

    /etc/rc.d/rcN.d

    ```


    where N is a number. There are usually seven, since the rcN.d directories are
    numbered 0 to 6, but you might have a couple more on your system as rcS.d. This
    does not matter; all we are concerned about the numbered ones.


    ```

    $ pwd

    /etc

    dwxr-xr-x 2 root sys 1024 Dec 22 1996 rc0.d

    dwxr-xr-x 2 root sys 1024 Dec 22 1996 rc1.d

    dwxr-xr-x 2 root sys 1024 Dec 22 1996 rc2.d

    dwxr-xr-x 2 root sys 1024 Dec 22 1996 rc3.d

    dwxr-xr-x 2 root sys 1024 Dec 22 1996 rc4.d

    dwxr-xr-x 2 root sys 1024 Dec 22 1996 rc5.d

    dwxr-xr-x 2 root sys 1024 Dec 22 1996 rc6.d

    dwxr-xr-x 2 root sys 1024 Dec 22 1996 rc7.d

    ```


    > If''s LINUX then...


    $ pwd

    /etc/rc.d

    $ ls

    init.d rc.local rc0.d rc2.d rc4.d rc6.d

    rc rc.sysinit rc1.d rc3.d rc5.d


    If we cd into one of these rcN.d directories, you can see other rc.scripts already
    linked.


    ```

    $ pwd

    /etc/rc.d/rc2.d

    $ ls -1

    lrwxxrwxrwx 1 root root 16 Dec 3 15:16 K87ypbind -> ../init.d/yd

    lrwxxrwxrwx 1 root root 17 Dec 3 15:10 K89portmap -> ../init.d/p

    lrwxxrwxrwx 1 root root 17 Dec 3 15:07 S01kernel -> ../init.d/d

    n...

    ```'
