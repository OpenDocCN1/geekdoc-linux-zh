  md: '# 5.2 read


    read to take information from the keyboard or from a line of text from a file
    and assign it to a variable. If you specify only one variable then the read will
    assign all input to that variable until it sees an end-of-file marker or the shell
    sees a carriage return.


    The general format is:


    ```

    read variable1 variable2...

    ```


    One variable has been specified, which holds all text until the return key has
    been hit:


    ```

    $ read name

    Hello I am superman

    echo $name

    Hello I am superman

    ```


    Here, we assign two variables to hold a first and a second name. The shell will
    use the space bar as the separator for each variable.


    ```

    $ read name surname

    John Doe

    echo $name $surname

    John Doe

    ```


    If you type in many fields of text, the shell will assign all the leftover text
    to the end variable. Here is an example; suppose we have the variable''s name
    and surname again, but this time in three names to see what happens:


    ```

    $ read name surname

    John Lemon Doe

    echo $name

    John

    echo $surname

    Lemon Doe

    ```


    We typed in the string ''John Lemon Doe'', and the first variable was assigned,
    as the shell ran out of variables for assignment, it stuck all the text we entered
    into the last variable.


    One way to avoid possible confusion from the user is to use each read for each
    variable only, like this:


    ```

    $ pg var_test

    #!/bin/sh

    # var_test

    echo "First Name: \c"

    ```'
