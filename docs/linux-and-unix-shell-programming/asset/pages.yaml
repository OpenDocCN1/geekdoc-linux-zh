  md: '# CHAPTER 10


    # Using sed


    Sed is a non-interactive text stream editor for editing a copy of text from a
    file or from standard input. Standard input can be text entered from the keyboard,
    a file redirection, a string or a variable, or by a pipe. So what would you use
    sed for? After all, vi is also a text editor. Well, sed allows you to edit small
    or large files on the fly; you can supply a series of sed commands to edit or
    delete off it goes and does the job. Sed does all the changes in one pass, thus
    making it efficient and, most importantly to the user, fast.

    In this chapter we will cover:


    +   * extracting fields;

    * matching with regular expressions;

    * comparing fields;

    * adding, appending and substitution; and

    * basic sed one-liners and scripts.


    You supply sed commands on the command line or put the commands in a file and
    then call sed, much as you do with awk. One important thing to remember when using
    sed is that it will not touch your original file, no matter what you give it.
    Sed takes a copy of it, and all changes are then directed to the screen, unless
    you redirect the output to a file.

    Because sed is a non-interactive editor, you specify the lines of text you want
    changed by using line numbers or regular expressions.

    This chapter will introduce you to sed and its capabilities. We''ll be doing mostly
    one-liners and small scripts, because that''s how you''ll use sed to begin until
    you get better experience with it and venture out to create cryptic sed scripts
    yourself.


    Like grep and awk, sed is an invaluable text-filtering tool, either by using one-liners
    or with combinations of grep and awk using pipes.'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# 10.1 How sed reads data


    sed will read a line of text from a file or from other forms of standard input,
    and copy it into an editing buffer area. It will then read the first command from
    either the command line or a script, and using these commands, will find the pattern
    or address line and edit it. It will then repeat this procedure until there are
    no more commands left.


    # 10.2 Calling sed


    You can invoke sed in three ways: by typing the commands on the command line;
    by inserting sed commands in a script file then calling sed; or by inserting sed
    commands in a script file and making the script executable.

    To use sed from the command line for one-liners use:


    ```

    sed [options]-sed-commands input-file(s)

    ```


    Remember when using sed commands on the command line to surround the actual commands
    with single quotes, although sed will tolerate double quotes.


    To use a sed script file use this format:


    ```

    sed [options]-f sed-script-file input-file(s)

    ```


    To use a sed script file that has the sed command interpreter as the first line
    of the script file use this format:


    ```

    sed-script-file [options] input-file(s)

    ```


    Whether you are running a sed script file or sed commands from the shell, if you
    do not specify an input file sed will take its input from the standard input.
    This is generally either from the keyboard or from a redirection.

    The sed options are as follows:


    +   - No print please; sed will not write the edited lines to the standard output.
    The default is to print ''all'' (edited and non-edited) lines. The p command (on
    this or later) can be used to print the edited lines.

    - The next command is an editing command. This option is used if you are using
    multiple edits. If you are using only one sed command is not necessary, but if
    you specify it will not complain.

