  md: '# 1.1.6 Is the file already sorted?


    How can you tell if a file is already sorted? Just looking at it is fine if it''s
    only 30 lines or so, but what if it''s, say, 400 lines? Use `sort -c` to tell
    you if you sort thinks the file is sorted in some order.


    ```

    $ sort -c video.txt

    sort: disorder on video.txt

    ```


    According to sort it''s not sorted, so let''s get sorted and try again.


    ```

    $ sort -c video.txt

    $

    ```


    It''s returned to the prompt, so it''s sorted. However, it would be even better
    if sort could return an informative message line when the test is successful.


    # 11.1.7 Basic sort


    The most basic sort on any file is `sort filename`. This sorts on the first field
    (sort key 0), and in reality it is comparing each field along the line as it returns
    the file. It returns the sort based on the first field, which is what you''d expect.


    ```

    $ sort -t: video.txt

    Alien:HK:119:1982

    Aliens:HK:532:4892

    Boys in Company C:HK:192:2192

    A Few Good Men:KL:445:5851

    Star Wars:HK:301:4102

    The Hill:KL:63:2972

    Toy Story:HK:239:3192

    ```


    # 11.1.8 Reverse sort


    If you wish to sort in reverse, use the `-r` option. Using the reverse sort is
    handy when you''re hacking through large log files. Here the reverse is again
    sorted on file 0.


    ```

    $ sort -t:-r video.txt

    Toy Story:HK:239:3192

    The Hill:KL:63:2972

    Star Wars:HK:301:4102

    A Few Good Men:KL:445:5851

    Boys in Company C:HK:192:2192

    Aliens:HK:532:4892

    Alien:HK:119:1982

    ```'
  merge: -1
