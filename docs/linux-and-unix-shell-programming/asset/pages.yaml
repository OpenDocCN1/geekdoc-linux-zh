  md: "/etc/rc.init The role of this script is to first kill processes for that level\
    \ then start\nprocesses for that level.\n\nBut how does it know what services\
    \ to start or stop? The rc or rc.init file willna kind of loop executing each\
    \ rc.script that starts with a K in the rc3.d\ndirectory and passing it a parameter\
    \ of 'stop'. It will then carry out the same process\n all rc.scripts starting\
    \ with an S and passing a parameter of 'start'. Indeed the\nsame process is carried\
    \ out when a run level is invoked, instead of rc3.d,\nit will process the directory\
    \ rcNd according to which run level N is changing.\n\nThe scripts that are in\
    \ the rcN.d directory are only links – the real scripts\nwhere else. They are\
    \ located in a directory called usr/sbin/init.d or\n/etc/init.d.\n\n# If it's\
    \ LINUX then...\n\n```\n/etc/rc.d/init.d\n```\n\nIn this directory there are several\
    \ scripts that can stop or start a service. It is\nconsidered good form to name\
    \ these scripts rc.<what it does>, rc meaning\nrun command or run control or,\
    \ as some system admins call them, 'really crucial'.\nHere's a listing of some\
    \ of these files.\n\n```\n$ ls\nrc.localfs  rc.halt rc.reboot rc.syslogd rc.daemon\n\
    ...\n```\n\nThe general format of these rc.scripts must be able to handle being\
    \ called by the\nfollowing ways:\n\n```\nrc.name stop  to stop the service\nrc.name\
    \ start  to start the service\n```\n\nOptional calls are restart and status calls.\
    \ Any other should be responded\nwith a usage message on how the rc.script should\
    \ be called. It should be noted\nt you can invoke these scripts manually.\n\n\
    Now we know what script should be able to do upon calling, the next\nstep is to\
    \ place these scripts in the corresponding rcN.d directories. But before that\n\
    let's look at the system run levels.\n\n# 28.4.1 The different run levels\n\n\
    There are seven run levels (see Table 28.1). Different systems have a slight variation\n\
    on some of the levels.\n\nBefore you placing a script in the different run levels,\
    \ ask yourself at\nwhat levels do I want this service (that my script is going\
    \ to start or stop) started\nkilled? Once you have decided on this you can then\
    \ proceed."
