  md: '# CHAPTER 2


    # Using find and xargs


    Occasionally you will need to find files with certain characteristics (such as
    permissions, ownership, size, different file types etc.) on your system. There
    could be many reasons for this. It could be for security reasons, general admin
    or maybe you''ve just lost a file somewhere. Find is a very powerful tool, which
    can drill down through the system or just the current directory looking for the
    files or directories that you want to locate.

    In this chapter we will cover:


    +   - find options:

    - examples using the different find options; and

    - examples using xargs with find.


    Because of the powerful features that come with find its options list is large,
    but it''s well worth going over most of them. Even if you have a NFS system, find
    can drill through those too, providing the permissions are OK for it to do so.

    When running a big find some people prefer to run find in the background, because
    it can take a long time to drill right through the system (I am talking about
    30+ gigabytes of filesystem here).

    The general format of the find command is:


    ```

    find pathname [-options] [-print -exec -ok]

    ```


    Let''s look at parameters.


    +   - pathname The actual path or directory where you want to find start drilling.
    For example `.` for the current directory or `/` for the system''s root directory.

    - print When find finds the files, this prints them to standard output.'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# Using find and xargs


    -exec

    When find gets the files, it executes a shell command with all the found files.
    The command is in the format ''command'' {} \;

    note the space between the {} and \;


    -ok

    Really the same as -exec, but operating in safe mode, so you are prompted before
    the next command is executed.


    # 2.1 find options


    There are many options or expressions you can use with find, and each option is
    prefixed with a hyphen ''-''. Let''s first go over the main options before we
    do any examples.


    +   -name

    Find files by filename.

    -perm

    Find files with different access or permission bits on a file.

    -prune

    Use this option to stop finding the current directory name specified; however,
    if you use the -depth option, prune is ignored.

    -user

    Find files by user ownership.

    -group

    Find files that are a member of a certain group.

    -mtime -n +n

    Find files that were accessed or modified less than ''-n'' or more ''+n'' x days
    ago. There is also an atime and ctime option with find, but they all do practically
    the same thing, so we''ll just look at mtime.

    -nogroup

    Find files that have no valid group membership, that is no entry in /etc/groups.

    -nouser

    Find files that have no owner, that is no entry in /etc/passwd.

    -newer file file2

    Find files that are a certain type, such as

    b - a block file

    d - a directory file

    c - a character file

    np - a pipe file

    l - a symbolic linked file

    f - an ordinary file.

    -size c n

    Find files by block ''n'' size or by character length ''c'', which is taken as
    bytes.

    -depth

    When finding files, look at each file before going down the directories and its
    sub-directories.

    -fst

    Find files on only a certain file system type, usually found in the config file
    /etc/fstab, which contains information about file systems on the local machine.'
