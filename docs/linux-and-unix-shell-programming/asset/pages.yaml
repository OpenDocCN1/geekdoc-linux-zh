  md: '# 3.4.2 Submitting several jobs at once


    If you want to run several commands at once, it''s best to stick them together
    in a script file then execute it using nohup. For example the following commands
    have all been piped together; stick all these commands into a file, and make it
    executable.


    ```

    cat /home/accounts/qtr_0499 | /apps/bin/trials.awk |sort|lp


    cat > quarterend

    cat /home/accounts/qtr_0499 | /apps/bin/trials.awk |sort|lp

    <CTRL-D>

    ```


    Now make it executable:


    +   $ chmod 744 quarterend


    We''ll also stick the output into a file called qtr.out:


    ```

    $ nohup ./quarterend > qtr.out 2>&61 &

    [5] 182

    ```


    # 3.5 Conclusion


    The tools that we have discussed in this chapter are primarily for running jobs
    unattended. There are times when you may have to run intensive updates against
    large files, or carry out complex finds, which are best done out of peak work
    hours when the system is not so busy.


    Creating scripts that clean up logs or do specific application work every night
    can be submitted then forgotten about; all you have to do is check the script
    logs. If you look after a system, cron and the other tools can make your life
    a lot easier in the administration role.'
