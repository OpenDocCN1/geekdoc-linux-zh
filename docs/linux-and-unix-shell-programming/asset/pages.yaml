  md: 'If you still have problems, see Chapters 2 and 13. There is plenty of information
    there that should get you up and running.


    Throughout this book you will find listings of scripts. The listings are all complete.
    To run these scripts type the commands into a file, save and exit, then use the
    chmod command to set execute permission. You are then in business.


    # # 16.4 Conclusion


    This chapter has been a very quick primer in the introduction of shell scripts.
    I am sure you do not want me to go on about the theory of scripts'' functionality,
    I/O etc. You will pick these up quickly as you read the chapters throughout this
