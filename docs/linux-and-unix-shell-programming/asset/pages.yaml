  md: '# Using tput 39


    For System V

    echo "100"


    The results are the same.

    The command clear clears the screen and sends the cursor to the top lefthand side
    of the screen, more commonly called home. The sequence it sends to do this on
    a VT terminal is ESC[2J - you can send this sequence using an echo statement.


    System V

    echo "\033[2J"

    LINUX/BSD

    echo -e "\033[2J"


    As with any control characters that are embedded in text files, do not try to
    cut and paste, as you lose the characters'' special meaning. To insert characters,
    for example, to turn on the cursor do this:


    `CTRL-V> hit the ESCAPE> key then |25h''


    That''s CTRL-V>, then hit the escape key, then the characters [251]

    If your cursor does not go off when you issue a tput civis and you are sure it''s
    not the emulator, use this little script to turn it on and off. It will leave
    it to turn it into a function, or you could turn a couple of pages and find it
    already done.


    ```

    $ pg cursor

    !/bin/sh


    # cursor on|off

    # turns the cursor on or off for the vty100, 200, 220, meth220

    # note : will work on normal tty connec.. if''ie on some win emulations

    # check TERM env for your type !

    $OPT=$1

    if [ $# -ne 1 ]; then

    echo "Usage: basename $0 cursor [on|off]"

    exit 1

    fi

    case "$OPT" in

    on|On)

    # turn it on (cursor)

    ON=`echo ^[[25h`

    echo $ON

    ;;

    off|Off)

    # turn it off (cursor)

    OFF=`echo ^[[251`

    echo $OFF

    ;;

    esac

    ```'
