    #  2.0.2 How getopts works


    Getopts reads the option_string, and knows that these are valid options to be
    used in the script.

    Getopts will look for all arguments starting with a hyphen. It knows that these
    are the options. When it gets an option it compares this against the option_string.
    If a match is found then the variable is set to OPTARG; if no match is found the
    variable is set to ''?''. This process is repeated until there are no options
    left.

    When getopts has finished all the arguments it returns a non-zero status, which
    means all is OK with the arguments passed. A variable called OPTIND holds the
    last argument processed. We shall see in a minute how this can help in processing.


    # 2.0.3 Specifying values using getopts


    Sometimes it may be appropriate for your scripts to include an actual value with
    one of the command line options. Getopts provides a way to do this. All you need
    to do is put a colon after the option letter in the option_string. For example:


    ```

    getopts atofvc: OPTION

    ```


    The above states that a, h, f, v can be passed with no values, but option c must
    have a value. When you use a value you must use the variable OPTARG to hold the
    values. If you try and pass it without a value, you will get an error message.
    The error message is an unfriendly one, so to suppress this error and use your
    own, do the following:


    Put a colon at the start of the option_string.


    ```

    while getopts :ahfvc: OPTION

    ```


    Create a usage statement within the case statement using ''?'' to trap the error.'
