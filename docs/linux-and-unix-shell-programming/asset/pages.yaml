  md: '# 3.1.4 Creating a new crontab entry


    The first thing to do before we even think about submitting a crontab file into
    cron is to set up the EDITOR environment variable. This tells cron what editor
    to use when editing crontabs. If you''re like 99 cent of the UNIX and LINUX community,
    you will use vi. So edit your .profile that is located in your $HOME directory
    and put the following commands in:


    ```

    EDITOR=vi; export EDITOR

    ```


    Now save and exit.

    Create a file named <user>cron, where <user> is your login name. For example,
    dave. Now type the following.


    ```

    # (put your own initials here) echo the date to the console every

    # 15 minutes between 6pm and 6am

    0,15,30,45 18-06 * * * /bin/echo ''date'' > /dev/console

    ```


    Now save and exit. Make sure each of the first five fields is space-separated.

    The above entry will echo the date to the console every 30 minutes. If the system
    crashes or hangs, you get a good idea straight away by looking at the last date
    echoed. On some systems tty1 is the same as console, so change the device according
    to your needs.

    Now to place our crontab file in cron, type cron followed by the newly created
    filename:


    ```

    $ crontab davecron

    ```


    The crontab has now been submitted, and your entry will kick off every 30 minutes.

    A copy of the file has now been placed in /var/spool/cron, and the filename of
    your crontab is the same as your login name (i.e. dave).


    # 3.1.5 Listing your crontab


    To list the crontab file:


    ```

    $ crontab -l

    # (crondave installed on Tue May 4 13:07:43 1999)

    # DT: echo the date to the console every 30 minutes

    0,15,30,45 18-06 * * * /bin/echo ''date'' > /dev/tty1

    ```


    A file similar to above will be displayed. Using this listing method, it''s a
    good idea to create a backup copy of the file in your $HOME directory:


    ```

    $ crontab -l >$HOME/mycron

    ```'
