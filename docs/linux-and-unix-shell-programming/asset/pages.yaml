  md: "# 18.7.8 Ignoring the # character\n\nWhile reading text files you may want\
    \ to ignore or disregard any comment lines you come across. Here's a typical example.\n\
    \nSuppose you wish to read in a configuration file using a normal loop. You would\
    \ pick up every line, which is what you want in most cases.\n\nHowever, to ignore\
    \ certain lines that start with a certain character you need to use the case statement.\
    \ As the # sign is a special character, it's best to escape it with a backslash\
    \ first;\\; we then put an asterisk after the hash sign, to include any characters\
    \ after the hash.\n\nHere's a typical configuration file.\n\n```\n$ pg config\n\
    # THIS IS THE SUB SYSTEM AUDIT CONFIG FILE\n# DO NOT EDIT!!. IT WORKS\n#\n# type\
    \ of admin access\nAUDITSCM=full\n# launch place of sub-systems\nAUDITSUB=/usr/opt/audit/sub\n\
    # serial hash number of productnHHASHSER=12890AB3\n# END OF CONFIG FILE!!!\n```\n\
    \nAnd here's the script that ignores the hash signs:\n\n```\n$ pg ignore_hash\n\
    #!/bin/sh\n# ignore_hash\nINPUT_FILE=config\nif [-s $INPUT_FILE ]; then\n  while\
    \ read LINE\n  do\n    case $LINE in\n      \\*) ;; # ignore any hash signs\n\
    \      *) echo $LINE\n    esac\n  done <$INPUT_FILE\nelse\n  echo \"basename $0\
    \ : Sorry $INPUT_FILE does not exist or is empty\"\n  exit 1\nfi\n```\n\nWhen\
    \ it runs we get:\n\n```\n$ ignore_hash\nAUDITSCM=full\nAUDITSUB=/usr/opt/audit/sub\n\
    HASHSER=12890AB3\n```"
  merge: -1
  pgno: 306
