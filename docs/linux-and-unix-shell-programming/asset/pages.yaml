    # 11.4 Using join


    Join lets you join lines from two sorted files. The join command may be familiar
    to you if you are into SQL.

    Here''s how join works. You have two files, file1 and file2, sorted of course.
    Both files have a common element in that that relates to the other file. Using
    this relationship, the join ‘folds’ the two files. It''s a bit like updating a
    master file, or updating any file that holds elements that are common to both
    files.


    The fields within the text are normally separated by tabs or spaces, but you can
    specify another field separator if you like. Some systems say you should not have
    more than 20 fields in a file when using join: to be honest, if you''ve got more
    than 20 fields anyway you should be using a DBMS system.


    To use join effectively, you first need to pre-sort any input files.

    Here''s the general format:


    ```

    join [options] input-file1 input-file2.

    ```'
  merge: -1
  pgno: 191
- img_proc: true
  md: 'Let''s go over some of the more useful options.


    -an ''n'' is a number. Use this to display unmatched pairs when joining. For example,
    -a1 means show unmatched pairs from the first file. -a2 means from the second
    file.


    -o n.m Where means the file number and m means the field number. To display only
    the third field file use 1.3. Each of these ''n.m'' options must be separated
    by a comma, for example 1.3, 2.1.


    -jn m Where means the file number and m is the field number. Use this if you wish
    to use other fields as join field.


    -t Field separator. Use this if the fields are not separated by a tab or space.
    For example, to specify a colon as the field separator use -t


    Let create two text files, one containing names and street addresses names.txt,
    the other containing the names and towns called town.txt.


    ```

    $ pg names.txt

    M.Golls 12 Hid Rd

    P.Heller The Acre

    P.Willey 132 The Grove

    T.Norms 84 Connaught Rd

    K.Fletch 12 Woodlea

    ```


    ```

    $ pg town.txt

    M.Golls Norwich NRD

    P.Willey Galashiels GDD

    T.Norms Brandon BSL

    K.Fletch Mildenhall MAF

    ```


    # 11.4.1 Joining two files


    The task is to join the two files together, so that the names hold the right addresses;
    for example, M.Golls'' record states that the address is 12 Hid Rd. The join key
    that will make this work is the names field which is field 0. As they are both
    the same, join will assume that''s the field to use:


    ```

    $ join names.txt town.txt

    M.Golls 12 Hid Rd Norwich

    P.Willey 132 The Grove Galashiels GDD

    T.Norms 84 Connaught Rd Brandon BSL

    K.Fletch 12 Woodlea Mildenhall MAF

    ```


    Excellent, it worked. By default join will delete or suppress the second occurrence
    of the join key, which in our case are the names field.'
