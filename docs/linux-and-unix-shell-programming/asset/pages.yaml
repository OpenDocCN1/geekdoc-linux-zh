    # 29.6 Conclusion


    Creating cgi scripts enables you to create a much more interesting user interface.
    HTML pages could be the front end to all the common processing tasks that you
    run.


    Scripts can be generated to carry out monitoring, front-ends, database queries,
    etc. HTML is now one of the standards for documentation that is shipped with application
    software.'
