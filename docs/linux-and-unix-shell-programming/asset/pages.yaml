  md: '24 Using find and xargs


    # 2.1.2 Find files by perm mode


    To find files on the system that have different file permissions use this option.
    You may want to locate files that are executable by everyone (world), or check
    someone''s directory to see what type of permissions they have. When using this
    option it''s a good idea to use the octal method for permissions.


    To find files with a permission of 755 which is read, write and executable by
    owner and execute by everyone else,


    ```

    $ find -perm 755 -print

    ```


    To find files that are read, write and executable for everyone (watch out for
    these) use this find command. A dash in front of the octal number. The perm stands
    for permissions and 007 is based on the notation you use for the chmod (absolute)
    mode.


    ```

    $ find -perm -007 -print

    ```


    # 2.1.3 Ignoring directories


    When you want to search for files, but you don''t want to search in a certain
    directory because you know the files will not be there, use prune to specify the
    directory to ignore. Be careful when using prune though, because if you specify
    ''-depth'' the prune option is ignored.


    To display the files in the apps directory when you do not want find to search
    in /apps/bin:


    ```

    $ find /apps -name "/apps/bin" -prune -o -print

    ```


    # 2.1.4 Find files by user and nouser


    To find files by owner, you supply the actual login name of that user. To find
    files owned by user dave in your $HOME directory:


    ```

    $ find ~ -user dave -print

    ```


    To find files owned by uuc in /etc:


    ```

    $ find /etc -user uucp -print

    ```


    To find files of a user that has been deleted, use the -ouser option. This finds
    files that have no valid userid in the /etc/passwd file. You do not have to supply
    a user name with this option; find will go off and do all the work. To find all
    files not owned by a current user in the /home directory tree:


    ```

    $ find /home -nouser -print

    ```'
