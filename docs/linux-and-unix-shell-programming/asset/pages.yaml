    # 26.2.2 Detecting a signal


    Some signals can be caught and appropriate action taken. Other signals cannot
    be caught. For instance, if a command receives a signal 9, you cannot do anything
    about it.

    As as scripting is concerned we only need to worry about signals 1, 2, 3 and 15.
    When a script receives a signal, it can do one of three things:


    +   1. Do absolutely nothing, and let the system take its course.

    2. Catch the signal, but ignore it.

    3. Catch the signal and take some form of action.


    Most scripts use number 1. This is the method we have used in all the scripts
    in the book so far.

    To be able to use the other two methods, we must use the trap command.


    # 26.3 trap


    The trap command allows you to trap incoming signals to your scripts. The format
    of the trap command is:


    trap name signal(s)


    The name is a list of instructions to be performed when the signal is caught.
    In reality a function should be called that deals specifically with trapped signals.
    The name should be surrounded by double quotes "". The signal(s) are the incoming
    signals.

    When a signal is trapped a script will generally be in the middle of some processing.
    The most common form of action to take is:


    +   1. Clean up temporary files.

    2. Ignore the signals.

    3. Ask the user if the script is really to be terminated.


    Here''s a table of the most common trap usages:'
