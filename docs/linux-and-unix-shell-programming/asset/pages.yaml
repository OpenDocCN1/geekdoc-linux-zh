  md: '# 21.2.9 Using colours


    Using colours on fields can make your data input look more professional. The colours
    we are going to use are ANSI standard. Not all colours work on all systems so
    here are the most common colours.


    Foreground colours


    | Number | Colour |

    | --- | --- |

    | 30 | black foreground |

    | 31 | red foreground |

    | 32 | green foreground |

    | 33 | yellow (or brown) foreground |

    | 34 | blue foreground |

    | 35 | purple foreground |

    | 36 | cyan foreground |

    | 37 | white (or grey) foreground |


    Background colours


    | Number | Colour |

    | --- | --- |

    | 40 | black background |

    | 41 | red background |

    | 42 | green background |

