  md: "# 282 Control flow structures\n\n# 18.7.9 Processing formatted reports\n\n\
    Getting unwanted lines out of the way is a common task when you want to read report\
    \ files. Below is part of a report from a stationery stock level listing. The\
    \ items of interest here are the columns containing the item reorder level and\
    \ the current level.\nHere's the report.\n\n$ pg order\n###### RE-ORDER REPORT\
    \ ######\nITEM ORDERLEVEL LEVEL\n####################################\nPens 14\
    \ 12\nPencils 15 15\nPads 7 3\nDisks 3 2\nSharpeners 5 1\n####################################\n\
    \nOur task is to read in the values and determine what items need reordering.\
    \ If a reorder is necessary then the reorder should be twice the reorder level\
    \ for that item. The output should also report how many items need reordering,\
    \ and the total of all orders taking place.\nWe already know how to ignore the\
    \ lines beginning with certain characters, so there is no problem. We need first\
    \ to read in the file, ignoring all the lines that begin with # and the header\
    \ line that starts with `ITEM`: as we read in the file it gets echoed out to a\
    \ temporary file. To make sure that we do not have any empty lines then deletes\
    \ all empty lines. What we are actually doing is filtering the text file. Here's\
    \ the code that does that part.\n\n```\n$ pg whileorder\n#!/bin/sh\n# whileorder\n\
    INPUT_FILE=order\nHOLD=order.tmp\n\nif [ -s $INPUT_FILE ]; then\n  # zero the\
    \ output file, we do not want to append!\n  >$SHOLD\n  while read LINE\n  do\n\
    \    case $LINE in\n      \\*|*ITEM*) ;; # ignore any # or the line with ITEM\n\
    \      *)\n        # redirect the output to a temp file\n        echo $LINE >>$SHOLD\n\
    \    esac\n  done <$INPUT_FILE\n```"
