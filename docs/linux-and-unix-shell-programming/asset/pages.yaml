  md: '# 436 A small collection of scripts


    The script works like this. First, a trap is set to ignore signals the user cannot
    break out of the execution of the script. If the file lock.users then the script
    will continue executing. The first thing it checks is for the word ''all''. If
    this is present then it will override all usernames you have in this file. Do
    not use a comment line to comment out the word ''all'', it will still pick it
    up. You may comment out usernames.


    If the entry ''all'' is found then all users are locked out apart from root. To
    make sure an exact match is found the grep pattern ''all>'' is used. A message
    is echoed to the screen telling the users the system is unavailable at the moment.


    The main function is get_users. This reads the file lockout.users. ignoring all
    lines beginning with the hash sign. It compares names to make sure no one has
    the username in the file, so root is locked out; we cannot have this we?


    The name of the current user logging in is pulled from the variable NAMES which
    holds the current username from the lockout.users file it is reading. If a match
    is found the LOGNAME is displayed with a message. The user is exited.


    I have this script running on a couple of systems that have up to 40 users, and
    there is no lack of speed in their logging process. I use this script to temporarily
    lock out users who are away for more than a week, and also to lock certain users
    during lunch times when we have to update systems.


    You need to put the following line in your /etc/profile. I''ve got mine at the
    end of the file, so the users can view the message of the day first for added
    information.


    ```

    /apps/bin/deny.access

    ```


    The directory /apps/bin is one of the areas where I keep all my global scripts
    - yours will probably be different, but make sure everyone execute on this script
    and the directory that scripts live in.


    If you get a ''permission denied'' error, then you have not given enough permission
    on the script or directory.


    My lockout.users file is in /apps/etc. You will have to change that directory
    if your structure is different, which probably is. Because the file is sourced
    you will be able to see the functions if you use the set command (but not the
    actual lockout.users file). If this worries you simply use the unset command to
    delete the function after it has been executed. The unset command directly after
    the call to the script in the /etc/profile. Like this:


    ```

    unset getusers

    ```'
