    | chmod 6711 | rws --s | File has suid and guid set, owner has read, write and
    execute. |

    | chmod 4764 | rws rw- r-- | File has said set, owner has read, write and execute.
    Group has read, and other has read. |


    I could use the symbolic method to add the suid if I wanted. If my file had the
    set of permissions rwx r-x r-x, then by giving it suid:


    ```

    chmod u+s <filename>

    ```


    The permissions of the file would then look like: rws r-x r-x.

    You may see an S when looking for suid files similar to rwS r-x r-x. What means
    is that the execute has not been set under the s, the chmod gives it an upper
    case S. It is a useless suid permission state: ignore it.

    Note that chown does no sanity checks, and by this mean I can give a file any
    permission you like, and chown will not check it. Just because a file has an execute
    bit set, do not assume it is a program or script.


    # 1.7 chown and chgrp


    When you create a file it is owned by the creator. Once you own a file, you can
    then change the ownership and give it to another user, so long as a valid user
    who has an entry in /etc/passwd. This can be in the form of the actual login name
    of the user or the user ID, which is a number. When you change ownership of a
    file, the suid bit is cleared for security reasons. Only the system administrator
    or the actual owner of the file may give the file away to another user. If you
    change the owner of the file you cannot claim it back. If you want it back, go
    and talk to your system admin.


    Here''s the general format:


    ```

    chown -R -h owner file

    ```


    The -R means you can do a recursive change on your files throughout your sub-directories
    to the new owner. The -h means if you are changing a file that is a symbolic link
    then change the owner of the file as well.


    # 1.7.1 chown examples


    Here are a couple of examples:'
