    # 14.3 Environment variables


    Environment variable is made available to all your processes (which are often

    called child processes). When you log in this is called the father process, and
    other

    processes that invoke from your shell are called child processes. Unlike

    variables, which can be accessed only by your current shell, environment variables

    are available to all your child processes. This may include, amongst others, editors,

    scripts and applications.


    Environment variables can be set on the command line, but these values

    will be lost when you log out, so it''s best to put them in your .profile.

    The system will probably have some environments already ready in your

    /etc/profile. Putting them in the profile files means that they will be initialized

    every time you log in.


    By convention all environment variables are in upper case. To make the

    variable available to all your processes you must use the export command. The

    assing of the environment variables is done in the same way as with the local

    shell variables.'
