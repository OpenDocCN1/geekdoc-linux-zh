  md: '# 8.2 grep and regular expressions


    Using regular expressions we can now apply some rules to our pattern matching
    and be more selective about the information we extracted. When we are using regular
    expressions it''s always a good idea to use single quotes, as this stops any special
    pattern you use in grep from being interpreted in strange ways by the command
    shell.


    # 8.2.1 Pattern ranges


    Suppose we wanted to get all the city locations that were either a 483 or 484
    code. From the last chapter we know by using the [] brackets that we can specify
    a range of characters; here we specify that this will start with 48 and end with
    3 or 4, thus extracting 483 and 484.


    ```

    $ grep ''48[34]'' data.f

    483 Sept 5AP1996 USP 65.00 LVX2C 189

    484 nov 7PL1999 CAD 49.00 PLV2C 234

    483 may 5PA1998 USP 37.00 KVM9D 644

    ```


    # 8.2.2 Don''t match at the beginning of a line


    If we wanted to extract all records that do not have a ''48'' at the beginning
    of the line, we can use the ^ sign inside the square brackets. Using the ^ at
    the beginning of the pattern states that the search should begin at the beginning
    of each line.


    ```

    $ grep ''^[^48]'' data.f

    219 dec 2CC1999 CAD 23.00 PLV2C 68

    216 sept 3LZ1998 USP 86.00 KVM9E 234

    ```


    # 8.2.3 Trapping upper and lower cases


    If we used the -i switch disabled case sensitivity for the month Sept; here is
    another way of doing the same filter. Using the [] range pattern let''s extract
    all information that has sept or Sept in the line:


    ```

    $ grep ''[Ss]ept'' data.f

    483 Sept 5AP1996 USP 65.00 LVX2C 189

    216 sept 3LZ1998 USP 86.00 KVM9E 234

    ```


    If we wanted to extract all months that had Sept, no matter if it was upper or
    lower case, and all locations that were 483, we could use a command called pipe
    takes the output from the command on the left of the bar () and uses it as input
    for the command on the right of the bar. Here''s an example:'
  merge: -1
  pgno: 111
- img_proc: true
  md: '```

    $ grep ''[Ss]ept'' data.f | grep 483

    483 Sept 5AP1996 USP 65.00 LVX2C 189

    ```


    We do not have to put the filename on the grep command, because the input for
    that comes from the output of the first grep result.


    #  8.2.4 Matching characters


    If we wanted to extract all identity codes that started with an L and ended with
    a D, we could use the following, because we know the codes are five characters
    in length:


    ```

    $ grep ''K..D'' data.f

    47 Oct 3ZLL998 LPS 43.00 KVM9D 512

    483 may 5AP1996 USP 37.00 KVM9D 644

