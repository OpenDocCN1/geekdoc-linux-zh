    # 8.2.9 Blank lines


    If you want to search for blank lines in a file you can combine the ^ and S, and
    perhaps use the -n to display the actual line numbers.


    ```

    $ grep ''^\$\'' myfile

    ```


    # 8.2.10 Matching special characters


    If you wish to search for characters that have special meanings, like one of the
    following, $."\*[]()\| ?, you must place a \ in front of them. Suppose you want
    to search for all lines that contain a period (.), you would do this:


    ```

    $ grep ''\.'' myfile

    ```


    Or maybe for a double quote


    ```

    $ grep ''\"'' myfile

    ```


    In the same instance if you are searching for, say, a filename called conftroll.conf
    that is in a file, you should use:


    ```

    $ grep ''conftroll\.conf'' myfile

