- img_proc: true
  md: '# 12.1.10 Matching more than one character


    To match more than one character use the [character*n] format. Below is a listing
    from the hard disks on one of my systems. The file contains disks that have been
    registered or have not been recognized by the system. The first column does not
    contain all zeros, then the corresponding disk in column 2 has been registered.


    Looking at all zeros getting boring sometimes, so I like to replace them with
    a character that catches the eye, so I know instantly which disks are ''in'' and
    which disks are ''out''. Here''s part of the file.


    ```

    $ pg hdisk.txt

    1293 hdisk3

    4512 hdisk12

    0000 hdisk5

    4993 hdisk12

    2994 hdisk7

    ```


    By looking at the file I can see that I have one disk that is not registered,
    to change all the zeros to, say, an asterisk, we can use the pattern [0*], which
    matches at least four zeros. The replacement string just contains the asterisk.
    Here''s the command and result of the filter:


    ```

    $ tr "[0*4]" "*" <disk.txt

    1293 hdisk3

    4512 hdisk12

    **** hdisk5

    4993 hdisk12

    2994 hdisk7

    ```


    Now from looking at the file, I can tell straightaway which disk is not registered.


    # 12.2 Conclusion


    tr is used mainly for character conversions, or stripping out control characters.
    All of the functions used in this chapter can be accomplished using sed, but some
    people prefer to use tr. Tr is quick and easy, and does the job.'
