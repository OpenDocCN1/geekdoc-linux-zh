    | Variable_name= value | Assign a value to variable_name |

    | Variable_name + value | If variable_name is set, assign value to variable_name
    |

    | Variable_name?:value | If variable_name is not set, display defined user error
    message |

    | Variable_name?value | If variable_name is not set, display a system error message
    |

    | Variable_name = value | If variable_name is not set, assign value to variable_name
    |

    | Variable_name:-value | As above, but value is not assigned to variable_name
    – it can be substituted |


    # 14.2.1 Displaying a variable


    To display a value of a single variable use the echo command and prefix the variable
    name with a $. Here are some examples.


    ```

    $ GREAT_PICTURE="die hard"

    $ echo $(GREAT_PICTURE)

    die hard


    $ DOLLAR=99

    $ echo ${DOLLAR}

    99


    $ LAST_FILE=ZLPSO.txt

    $ echo ${LAST_FILE}

    ZLPSO.txt

    ```


    You can also combine variables. Here we assign an error message and the environment
    variable LOGNAME to the variable error_msg.


    ```

    $ ERROR_MSG=" Sorry this file does not exist $LOGNAME

    $ echo ${ERROR_MSG}

    Sorry this file does not exist user dave

    ```


    In the above example, the shell first displays the text, then sees the variable
    $LOGNAME; then it expands the variable to display the value of the variable.


    # 14.2.2 Clearing a variable


    To take a value away from a variable, use the unset command:


    ```

    unset variable_name

    ```'
