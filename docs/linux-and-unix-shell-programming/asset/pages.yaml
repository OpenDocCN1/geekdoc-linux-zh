  md: '# cp


    Format:


    cp options file file2


    Options:


    +   -i Prompt for confirmation for overwriting files

    -p Preserve the permission modes and modification times

    -r Recursively copy a directory


    To copy the file myfile to myfile.bak


    ```

    $ cp myfile 1 myfile.bak

    ```


    To copy the file get.prd from /usr/local/sybin to /usr/local/bin


    ```

    $ pwd

    usr/local/sybin

    $ cp get.prd../bin

    ```


    To recursively copy all files and directories from /logs (downwards) to /hold/logs


    ```

    $ cp -r /logs/ /hold/logs

    ```


    # diff


    Format:


    diff options file file2


    Options:


    +   -c Produce a different output from the standard format (see below)

    -I Ignore character cases


    Using the files file1 and file2 from our comm example, diff will output lines
    that are different between two files.


    ```

    $ diff file1 file2

    2,3c2,3

    < The game

    < Boys in company C

    ---

    > The games

    > The boys in company C

    ```


    Diff has reported that lines 2 and 3 are different, with the second column in
    line 3 not matching.'
