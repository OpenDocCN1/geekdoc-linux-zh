    # 10.10.2 Dealing with report


    When you are dealing with statement outputs from databases and you are grabbing
    the results of the statement so your script can do further processing, you generally
    need to do some tidying up first. Here''s a statement from an sql query.


    | Database | Size (MB) | Date Created |

    |---|---|---|

    | GOSOUTH | 2244 | 12/11/97 |

    | TRISUD | 5632 | 8/9/99 |


    (2 rows affected)


    In order to use the information on this output for further automatic script processing,
    we need all the database names, and so we need to do the following tasks:


    +   1. Delete the dotted line using ''s/-*/g''.

    2. Delete all blank lines using ''^$/$''.

    3. Delete the last line using ''$d''.

    4. Delete the first line ''1d''.

    5. Print out the first column using awk ''{print $1}''.


    Here are the commands. Again we use cat and pipes to get the desired result.


    ```

    $ cat sql.txt | sed ''s--*/g'' | sed ''^$/d'' | sed ''$1d'' | awk

    ''{print $1}''

    GOSOUTH

    TRISUD

    ```


    Now the script has the database names, it can be used for other processing.


