  md: '# CHAPTER 12


    # Using tr


    # 12.1 About tr


    Tr is a utility that lets you translate characters by substitution or deletion
    from standard input. Tr is used mainly for stripping off control characters from
    files or doing character case conversions. When you use tr generally pass it two
    strings: string1 is what you are searching for and string2 is what you want done
    with the translation. When tr is initially invoked, the characters in string1
    are mapped across the characters of string2; the conversion will then begin.


    In this chapter we will cover:


    +   - converting lower to upper case;

    - stripping files of control characters; and

    - deleting blank lines.


    The formats of the tr command with its most used options are:


    ```

    tr -c -d -s ["string1_to_translate_from"] ["string2_to_translate_to"] input_file

    ```


    where


    +   - c replaces the set of characters in string1 with a complement of itself,
    so long as the characters are in the ASCII range

    - d deletes all input characters of string1

    - s removes all but the first in a sequence of repeated characters; it squeezes
    the repeating characters into one.'
  merge: -1
  pgno: 201
- img_proc: true
  md: 'Input_file is the name of the file you want translated. Although you can take
    the input from other forms, this is the most widely used method.


    # 12.1.1 Character ranges


    When using tr you can specify ranges or lists of characters patterns that make
    up your strings. These look like regular expressions, but in fact they are not.
    With tr you can only use ranges and lists or individual characters when specifying
    string1 or string2.


    +   [a-z] A string of characters within a-z.

    [A-Z] A string of characters within A-Z.

    [0-9] A string of numbers.

    [/oct] A three-digit octal number representing any valid ASCII character.

    [O*n] Means the character ‘O’ occurring many times as specified by ‘n’. So [O*2]
    would mean OO. Any string to and including 00.


    Most tr variants support character classes and shorthand control character notion.
    The char class format of [class], includes others, alpha, blank, upper, lower,
    cntrl, space, digit, graph etc. Table 12.1 contains the instead of using the three-digit
    octal notation, which is also listed.


    When replacing a string or range of characters with a single character, note that
    the character does not go inside the square brackets ([]). Some systems are tolerant
    of using the square brackets; for instance you can get away with either "\012"
    or "\x012". Tr is quite forgiving in the use of quotes as well, so don’t be surprised
    if it still works when you use single instead of double quotes.


    Like most system tools, tr is not immune to special characters, so if you want
    to match one of them you should first escape it with a backslash. For example,


    Table 12.1 Different ways of specifying control characters using tr


    | Shorthand | Meaning | Octal |

    | \a | Control-G the bell sound | \007 |

    | \b | Control-H the backspace key | \010 |

    | \f | Control-L the formfeed | \014 |

    | \n | Control-J the new line | \012 |

    | \r | Control-M the carriage return key | \015 |

    | \t | Control-I the tab key | \011 |

    | \v | Control-X | \030 |'
