    $ grep -n "48" data.f

    1:48 Dec 3BC1997 LPS 68.00 LVX2A 138

    2:483 Sept 5AP1996 USP 65.00 LVX2C 189

    5:484 Nov 7PL1996 CAD 49.00 PLV2C 234

    6:483 May 5PA1998 USP 37.00 KVM9D 644

    ```


    The numbers are output on the first column, followed by each matching line that
    contains 48.


    # 8.1.6 Do not match


    Let’s now see all the lines that don’t match the text string 48:


    ```

    $ grep -v "48" data.f

    47 Oct 3ZL1998 LPS 43.00 KVM9D 512

    219 Dec 2CC1999 CAD 23.00 PLV2C 68

    216 Sept 3ZL1998 USP 86.00 KVM9E 234

    ```


    # 8.1.7 Get an exact match


    You probably noticed that when we tried to extract the string "48" in earlier
    examples, it returned other strings that contained "48" in them like 483 and 484.
    We can be more specific if we want 48 from our file; notice that there is a <table>
    after each field, which we can put in our search pattern, like this:


    ```

    $ grep "48<tab>" data.f

    48 Dec 3BC1997 LPS 68.00 LVX2A 138

    ```


    The <table> sign means the hit key.


    A more efficient way of getting an exact match using grep is to append the string
    you extracted with \>\. Suppose I now only want to extract 48, here’s how to do
    it:


    ```

    $ grep ''48\>'' data.f

    48 Dec 3BC1997 LPS 68.00 LVX2A 138

    ```


    # 8.1.8 Being case-sensitive


    By default grep is case-sensitive. If you want to search for non-case-sensitive
    strings you’ll have to use the -i switch. We have the month Sept both in upper
    and lower case in our data.f file, to get both versions of the month we would
    use:


    ```

    $ grep -i "sept" data.f

    483 Sept 5AP1996 USP 65.00 LVX2C 189

    216 sept 3ZL1998 USP 86.00 KVM9E 234

    ```


