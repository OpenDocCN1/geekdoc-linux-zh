  md: "# 19.10.1 Deleting shell functions\n\nLet's now make a small change to the\
    \ function. First delete the function, so it is no longer available to the shell.\
    \ Do this using the unset command. The format for using the unset command when\
    \ removing functions is:\n\n```\nunset function_name\n\nunset findit\n```\n\n\
    If you type set now, you will find that the function is no longer displayed.\n\
    \n# 19.10.2 Editing shell functions\n\nNow edit the file functions.main and add\
    \ a loop to the function, so the script can read in more than one parameter from\
    \ the command line. The function will now look like this:\n\n```\n$ pg functions.main\n\
    !/bin/sh\nfindit()\n{\n  # findit\n  if [ $# -lt 1 ]; then\n    echo \"usage :findit\
    \ file\"\n    return 1\n  fi\nfor loop\ndo\n    find -name $loop -print\ndone\n\
    }\n```\n\nNow source the file again:\n\n```\n$ ./functions.main\n```\n\nUsing\
    \ the set command to see that it is indeed loaded, you will notice that the shell\
    \ has correctly interpreted the for loop to take in all parameters.\n\n```\n$\
    \ set\nfindit=()\n{\n  if [ $# -lt 1 ]; then\n    echo \"usage :`basename $0`\
    \ file\"\n    return 1;\n  fi;\n```"
