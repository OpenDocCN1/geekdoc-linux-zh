  md: "# 18.6.1 Simple until loop\n\nThis script continuously greps the who command\
    \ for the user root. The variable IS_ROOT holds the result of the grep.\nIf root\
    \ is found, the loop finishes processing. A mail message is sent to user sim telling\
    \ him that root has logged in. Notice the use of the sleep command, which gets\
    \ quite a lot with the until loop, because you have to have some command in place,\
    \ and what better than sleeping for a few seconds.\n\n```\n$ pg until_who\n!/bin/sh\n\
    until IS_ROOT=`who | grep root`\nuntil [ \"$IS_ROOT\" ]\ndo\n  sleep 5\ndone\n\
    echo \"Watch it. roots in \" | mail simon\n```\n\n# 18.6.2 Monitoring for a file\
    \ presence\n\nIn this example, the until loop hangs around doing 'sleep 1' until\
    \ a file called /tmp/monitor.LCK is deleted. When the script carries on with normal\
    \ processing.\n\n```\n$ pg until_lck\n!/bin/sh\n# until_lck\nLOCK_FILE=/tmp/process.LCK\n\
    until [ ! -f $LOCK_FILE ]\ndo\n  sleep 1\ndone\necho \"file deleted\"\n# normal\
    \ processing now, file is present\n```\n\nThe above is one method on how scripts\
    \ can work together when processing.\nHeres one way how scripts can communicate.\
    \ Suppose another script, let's call process_main, is used to collect information\
    \ from all the machines on the local network and put the information into a report\
    \ file.\nWhen the script process_main runs it creates a LCK file (lock file).\
    \ The above script has the information that process_main has gathered, and it\
    \ is no good trying to process a file if the script process_main is still updating\
    \ the report file.\nTo overcome these problems the script process_main will create\
    \ a LCK file when it starts and delete it when it finishes."
