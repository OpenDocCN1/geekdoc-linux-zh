  md: '210 Environment and shell variables


    # 14.3.7 Exporting variables to child processes


    One of the problems new users to shell have is with the concept of exporting variables
    to child processes. As we have already discussed how environment variables work,
    let''s now put that into practice with a script that calls another script, which
    in effect creates a child process.


    Below is a list of two short scripts. The father script sets a variable called
    ''film'' with the value ''A Few Good Men''. It echoes out variable, then calls
    another script called ''child''. This script displays the variable film from the
    first script. The variable film then has its value changed to ''Die Hard'', before
    being displayed on the screen. Control is then returned to the father script,
    and the variable is then displayed again.


    ```

    $ pg father

    #!/bin/sh

    # father script.

    echo "this is the father"

    FILM="A Few Good Men"

    echo "I like the film $FILM"

    # call the child script

    child

    echo "back to father"

    echo "and the film is :$FILM"

    ```


    ```

    $ pg child

    #!/bin/sh

    # child

    echo "called from father..i am the child"

    echo "film name is :$FILM"

    FILM="Die Hard"

    echo "changing film to :$FILM"

    ```


    Let''s see what the script displays.


    ```

    $ father

    this is the father

    I like the film :A Few Good Men

    called from father..i am the child

    film name is :

    changing film to :Die Hard

    back to father

    and the film is :A Few Good Men

    ```


    Because we did not export the variable film in the father script, the child script
    could not give back the variable film.

    Now, if we add an export command to the father script, so that the child script
    knows all about the film variable, this should work.'
