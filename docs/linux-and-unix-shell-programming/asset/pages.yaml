    # 11.1.9 Sorting on a specific field


    Sometimes it makes sense to sort purely on the second field (sort key). If we
    wanted to arrange our supplier codes in preparation for a report, we would use
    ''+1'', which means sort on the first sort key field. In the following example
    all the supplier codes have been sorted by sort key l: notice the second and third
    sort fields have also been sorted.


    ```

    $ sort -t: +1 video.txt

    Alien:HK:119:1982

    Boys in Company C:HK:192:2192

    Toy Story:HK:239:3972

    Star Wars:HK:301:4102

    Aliens:HK:532:4892

    A Few Good Men:KL:445:5851

    The Hill:KL:63:2972

    ```


    # 11.1.10 Numeric field sorting


    No surprise here; to sort on the third sort key use ''+3''. But because we are
    dealing with numbers, and we want a numerical sort, use the ''-n'' option. Here''s
    the command to sort all the yearly fields sorted:


    ```

    $ sort -t: +3n video.txt

    Alien:HK:119:1982

    Boys in Company C:HK:192:2192

    The Hill:KL:63:2972

    Toy Story:HK:239:3972

    Star Wars:HK:301:4102

    Aliens:HK:532:4892

    A Few Good Men:KL:445:5851

    ```


    Let''s see what happens if you do not specify the ''-n''. We''ll sort on the third
    field to see who''s got the best quarter figures, and because it''s sort key we
    refer to it as ''+2:


    ```

    $ sort -t: +2 video.txt

    Alien:HK:119:1982

    Boys in Company C:HK:192:2192

    Toy Story:HK:239:3972

    Star Wars:HK:301:4102

    A Few Good Men:KL:445:5851

    Aliens:HK:532:4892

    The Hill:KL:63:2972

    ```


    Look, it''s been sorted but not as we expected, since the third field contains
    numbers. Surely they would be in some type of order. The video The Hill should
    be at the top. Here''s what''s happened: the sort has looked at the first digit
    of each number for each field containing the quarter figures and sorted that first.
    It has then looked at the second digit of each number and sorted that.'
