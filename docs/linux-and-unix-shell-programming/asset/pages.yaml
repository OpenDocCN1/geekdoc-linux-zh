    thursday

    Friday

    ```


    # 12.1.8 Translating control characters


    Tr''s no.1 use is translating control characters, especially during DOS to UNIX
    downloads, when you have forgotten to set the ftp option on carriage returns to
    linefeed conversions.


    Below is a text file that''s been deliberately transferred with no transfer options
    set. It''s part of a stationery request. Here are the control characters displayed
    using cat -v.


    ```

    $ cat -v stat.tr

    Boxes paper^^^^^12M

    Clips metal^^^^^50M

    Pencils-medium^^^^^10M

    ^Z

    ```


    We have suspect tabs each line is terminated with control-M and control at the
    end-of-file. Here is how to remedy this.

    We are going to use the ''s'' squeeze option. Looking at the ASCII chart, the
    octal for *** is 136. The value for M is ''015'', the value for a tab is ''011'',
    and the Z is ''032''. We''ll complete this task in steps.


    To replace *** with tabs the command is "\011+". The results are redirected to
    a temporary work file called stat.tmp.


    ```

    $ tr -s "[0136]" "[011*]" < stat.tr >stat.tmp

    Boxes paper 12M

    Clips metal 50M

    Pencils-medium 10M

    ^Z

    ```


    To replace all ^Ms at the end of each line with new lines, and get rid of that
    ^Z use \n. Remember we are now taking the input from our temporary file stat.tmp.


    ```

    $ tr -s "[015\032]" "\n" < stat.tr

    Boxes paper 12

    Clips metal 50

    Pencils-medium 10

    ```


    All control characters have now gone, and the file is now ready for use.'
