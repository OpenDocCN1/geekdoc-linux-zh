  md: '# File security permissions


    # 1.8 umask


    When you initially log in the system a command called umask sets your default
    file creation mode. This command is actually the opposite of the chmod command!
    Your system administrator should have set this to reasonable value when you create
    file users who are not members of your group will not be able to write to them.


    When you are in the shell you can use umask to alter the creation mode of files
    to your personal preference. This change is effective until you log out or manually
    use another umask command.


    Generally, the umask is set in the /etc/profile file, which is the file everybody
    gets, so if you want to change the umask for everyone put an entry in that file.
    If you want to set it permanently for your own needs put it in your .profile or
    .bash_profile in your HOME directory.


    # 1.8.1 How to work out umask values


    The umask allows you to mask out permission bits when a new file is created, and
    there is a umask number for each of the permission sets (owner, group, other).
    The maximum for a file creation is six for user, six for group and six for other.
    The system will not let you create a file with executable bits, so it''s up to
    you to add that on with the chmod command. A directory can have execute bits set,
    thus its number can be 7 for each of the permission sets.


    The general format is


    ```

    umask nnn

    ```


    where nnn is the umask number 000–777.

    Let''s look at some examples of how this works.


    # Working out umask value


    There are a number of ways to work out the umask value to get the required permission
    bits set on newly created files and directories. Table 1.8 shows the corresponding
    umask number to the permission bits.


    To work out what you require for the umask value, use the table using each value
    for the corresponding user, group and other permission sets.


    To find out the umask value of 002, looking at the table, this would give a file
    creation mask of 664 and a directory mask of 775.


    Here''s another method that shows how umask values are arrived at. All we need
    to remember that umask is taking away bits.


    Suppose we wanted a umask of 002.


    Step 1. We first write down the full file mask mode, which is 777 (read, write,
    execute for owner, group and everybody else).'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# Table 1.8 umask permissions table


    | umask | File | Directory |

    |---|---|--|

    | 0 | 6 | 7 |

    | 1 | 6 | 6 |

    | 2 | 4 | 5 |

    | 3 | 4 | 4 |

    | 4 | 2 | 3 |

    | 5 | 2 | 2 |

    | 6 | 0 | 1 |

    | 7 | 0 | 0 |


    Step 2. In the next row down the corresponding columns of the bits of the umask
    value you want. In this case it is 002.


    Step 3. The next row is the result of any non-matching bits between the first
    and second row. This row is the directory permissions. After a bit of practice
    this can be done in your head.


    Step 4. As files cannot be created with execute bits set, we simply strip these
    off.


    Here''s an example of the above steps, using a umask of 002.


    +   1. Full file mask rwx rwx rwx (777)

    2. umask of 002 --- --- -W-

    3. Directory permissions rwx rwx r-x (775) These are the directory permissions

    4. File permissions rw- rw- r-- (644) These are the file permissions


    Here''s another example, suppose we want a umask value of 022:


    +   1. Full file mask rwx rwx rwx (777)

    2. umask of 022 --- -W- -W-

    3. Directory permissions rwx r-x r-x (755) These are the directory permissions

    4. File permissions rw- r-- r-- (644) These are the file permissions


    # 1.8.2 Common umask values


    Table 1.9 shows some common umask values and their corresponding directory and
    file creation bits.'
