- img_proc: true
  md: "else\n# not in any of the directories...\necho \"basename $0'\\: Sorry the\
    \ audit file is not readable or cannot be\n  exit 1\nfi\n\nWhen we run the script,\
    \ if the file is in either of the two directories and the file is readable then\
    \ you can case it. If not, echo an error and exit. This example fails because\
    \ our imaginary file is not present.\n\n```\n$ ifcataudit\nifcataudit: Sorry the\
    \ audit file is not readable or cannot be located.\n```\n\n# 18.4 Case statement\n\
    \nThe case statement is a multiple-choice statement. You use case statements to\
    \ match a value against a pattern. If the match is successful, you can execute\
    \ commands based purely on this match. Here's the format of the 'case' statement:\n\
    \n```\ncase value in\npattern1)\ncommands1\n...\n;\npattern2)\ncommands2\n...\n\
    esac\n```\n\nHere how case works. The word after the value must be 'in', and each\
    \ pattern must be terminated with a right bracket. The value can be a variable\
    \ or a constant. When a match is found against a pattern all commands are then\
    \ executed for the pattern up to the ;;\\.\nThe value will check each pattern\
    \ for a match. Once a pattern is matched, it will not continue with the other\
    \ patterns even after it has executed the matched pattern. If no match is found\
    \ against the patterns, you can then trap the value by using an asterisk, which\
    \ will catch any other input.\nThe pattern part can include metacharacters, the\
    \ same type of pattern matching in filename expansions on the command line, which\
    \ are as follows:\n\n+   * any characters\n? any single character\n[..] any character\
    \ from a class or range.\n\nLet's do some examples."
  merge: -1
