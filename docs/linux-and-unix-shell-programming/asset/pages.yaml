    The first line, as you probably know now, is where the shell interpreter is located.
    The first echo tells the server this is a MIME header; the second echo is a new
    line. The output of cgi scripts will not work unless there is a new line after
    the MIME header.


    Next, we echo out a start <HTML> tag, which informs the browser that the whole
    document now being displayed is in HTML format. Different character fonts can
    be displayed, graded from largest <H1> downwards to <H>. Usually <h6> is accepted
    as the smallest size to view with each eyes. We centre the text on the page, so
    it appears pleasant to the eye. We now use <h2> as the font size and use the <CENTER>
    tag to center the line on the page ‘Stand-By To Stand-To’. The last line encloses
    the <HTML> tag.


    If you forget to close off any tags, do not worry – you will soon spot them, when
    you try to load the document.


