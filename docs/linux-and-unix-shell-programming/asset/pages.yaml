  md: '# # LINUX & UNIX SHELL PROGRAMMING


    David Tansley


    With more and more systems being run under UNIX and Linux, the ability to program
    and customize the shell quickly and reliably to get the best out of any individual
    system is becoming an increasingly important skill for anyone operating and maintaining
    these systems.


    This comprehensive book is a practical, easy-to-use guide to programming and using
    the Bourne shell for beginners and experienced users – the Bourne shell is the
    standard shell for UNIX, and is also fully backward compatible with the Linux
    BASH shell. This book illustrates the ability of the shell to unlock real potential
    of UNIX and Linux, and aims to get the reader up, running and creating robust
    shell scripts for real tasks and situations as quickly as possible – shell scripts
    that work on any mainstream UNIX or Linux machine.


    If you are new to UNIX and Linux or if you are a power user waiting then this
    book is for you. Shell programming books merely annotate manual pages and syntax,
    but in this book users of all abilities will find plenty of practical working
    examples – all of which are available as full code script via an ftp site as well
    as a host of tips, tricks and code liners, that will save you time on a day-to-day
    basis. The book is organized into self-contained chapters on individual topics
    for ease of reference.


    Linux and UNIX Shell Programming is structured in 5 parts:


    +   - Part 1 deals with the Shell itself, introducing the various commands and
    syntax


    +   - Part 2 introduces all the major text filtering tools available to the shell


    +   - Part 3 explains the login environment and customization


    +   - Part 4 covers basic shell programming


    +   - Part 5 introduces more advanced shell programming techniques.


    Features:


    +   - Practical advice and guidance for beginners and advanced programmers alike


    +   - Easy access to specific topics through self-contained chapters for day-to-day
    reference


    +   - Every chapter backed up with real, practical examples


    +   - Full of tested time-saving code one-liners and All programming examples
    and code available in electronic format.


    About the Author


    David Tansley has many years'' experience in UNIX, and most recently Linux, as
    a system administrator on a variety of platforms, and is currently a Systems and
    Database Administrator at Ace Global Markets, a Lloyds of London Underwriting
    Agency.


    Visit us on the World Wide Web at: www.awl.com/cseng/


    UNIX / Linux


    ISBN 0-201-67472-6


