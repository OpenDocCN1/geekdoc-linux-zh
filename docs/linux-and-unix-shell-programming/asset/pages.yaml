  md: '# CHAPTER 7


    # Introducing regular expressions


    As you become more familiar with UNIX or LINUX, there is one subject you will
    bump into repeatedly, and that is regular expressions. As you use the shell, the
    need to extract more than just a basic string from a file soon outweighs it. For
    example, you may want to extract a word where the first two characters are, say,
    upper case followed by four numbers. You cannot do this in the shell unless you
    use some form of regular expression.


    In this chapter we will cover:


    +   - matching at the beginning and end of line;

    - matching sets of data;

    - matching only alpha or numeric or both;

    - matching character ranges.


    When we want to extract or filter text from a file or an output of a command we
    can use what is called regular expressions (RE). Regular expressions are a collection
    of special, and sometimes not so special, character patterns.


    To extract or catch certain information, we give it a pattern of rules to which
    the extraction should adhere. These rules come in the form of special characters
    or metacharacters, which characters we use for pattern matching. We can also use
    normal characters to search as part of our pattern; for example, A search for
    A, and x search for the letter x.


    All of the big filtering text tools that come with the system allow the use of
    regular expressions in some form, but there is also an extended set of metacharacters.
    We will cover only one of these and that is the occurrence expression. The reason
    that this is that some systems group the occurrence pattern into the'
