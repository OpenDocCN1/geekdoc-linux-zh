  md: '# 8.2.11 Searching for formatted filenames


    Using regular expressions we can match any filename we want. On our systems we
    have a standard file naming format for document files. Up to the first six characters
    are lower case, followed by a dot, followed by two characters which are upper
    case. If I wanted to locate these type of filenames from a file filename.deposit
    which contains all our document files I would do this:


    ```

    $ grep ''[^a-z]\]{1,6}\.[A-Z]\]{1,2}/'' filename.deposit

    yrend.AS - match

    mothdf - nomatch

    soa.PP - match

    qp.RR - match

    ```


    # 8.2.12 Searching for ip addresses


    Part of my job is looking over our DNS servers, which means maintaining a lot
    of ip addresses that cover different networks. Our address ip file can contain
    over 200 addresses. Sometimes I want to look at just, the ''nnn.nnn'' network
    addresses, and forget about the rest that have only two digits in the period i.e.
    nnn.nn.. To extract all these nnn.nnn. addresses, use [0-9]\]{3}\.\\[0-0]\[[3\\].
    This expression is saying any number repeated three times followed by a period,
    any number repeated three followed by a period.


    ```

    $ grep ''[0-9]\]{3}\.\\[0-0]\[[3\\].'' ipfile

    ```


    # 8.3 Class names


    Grep also allows the use of international character pattern matching or class
    name form of pattern matching.


    Table 8.1 Class names and their regular expression equivalent

    | Class | Regular expression equivalent |

    |---||

    | [[:upper:]] | [A-Z] |

    | [[:lower:]] | [a-z] |

    | [[:digit:]] | [0-9] |

    | [[:alnum:]] | [0-9a-zA-Z] |

    | [[:space:]] | same as a space or a tab |

    | [[:alpha:]] | [a-zA-Z] |'
