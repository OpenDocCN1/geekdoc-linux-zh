  md: "# 18.8.3 continue\n\nThe continue command is quite similar to the break command\
    \ except for one important difference; it will not exit the loop, but will only\
    \ skip the current iteration of the loop.\n\n# 18.8.4 Skipping lines of files\n\
    \nHere is a listing of the personnel file we used previously, but now the file\
    \ has some header information.\n\n```\n$ pg names2.txt\n------LISTING OF PERSONNEL\
    \ FILE-----\n------TAKEN AS AT 06/1999 -----\nLouise Conrad:Accounts:ACC8987\n\
    Peter James:Payroll:PR489\nFred Terms:Customer:CUS012\nJames Lenoc:Accounts:ACC8887\n\
    Frank Pavely:Payroll:PR489\n```\n\nWe need to process the above file, and we know\
    \ by looking at the file that the first lines hold no personnel information. We\
    \ should therefore skip those lines.\nAlso we should not process the employer\
    \ Peter James. This person has left the company, but has not yet been taken off\
    \ the employee file.\nTo take care of the header information, we simply count\
    \ how many lines we are reading; we will only process when the line count is greater\
    \ than two. If the name we are about to process Peter James, we should skip this\
    \ record.\nHere is the script that does this task.\n\n```\n$ whilecontinue\n!/bin/sh\n\
    # whilecontinue\nSAVEDIFS=$IFS\nIFS=\nINPUT_FILE=names2.txt\nNAME_HOLD=\"Peter\
    \ James\"\nLINE_NO=0\n\nif [ -s $INPUT_FILE ]; then\n  while read NAME DEPT ID\n\
    \  do\n    LINE_NO=`expr $LINE_NO + 1`\n    if [ \"$LINE_NO\" -le 2 ]; then\n\
    \      # skip if the count is less than 2\n      continue\n    fi\n  end\n```"
  merge: -1
  pgno: 311
