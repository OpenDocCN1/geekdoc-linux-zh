    # chop


    The chop function chops off characters from the beginning of a string. The function
    chop chops a string; you specify how many characters to chop off the string starting
    from the first character. Suppose you had the string MYDOCUMENT.DOC and you wanted
    the MYDOCUMENT part chopped, so that the function returned only .DOC. You would
    pass the following to the chop function:


    ```

    MYDOCUMENT.DOC 10

    ```


    Here''s the chop function:


    ```

    chop()

    # chop

    # to call:chop string how_many_chars_to_chop

    {

    _STR=$1

    CHOP=$2

    # awk ''s substr starts at 0, we need to increment by one

    # to reflect when the user says (ie) 2 chars to be chopped it will be 2

    chars off

    # and not 1

    CHOP= expr $_CHOP + 1`

    n

    # check we have the right parameters

    if [ $#-ne 2 ]; then

    echo "chop_length: I need a string and how many characters to chop"

    return 1

    fi

    # check the length of the string first

    # we can''t chop more what''s in the string !!

    _LENGTH=`echo $_STR | awk ''{print length($0)}''

    if [ "$_LENGTH" -lt "$_CHOP" ]; then

    echo "Sorry you have asked to chop more characters than there are in

    the string"

    return 1

    fi

    ```'
