    # 2.1.6 Find files by modification times


    To find files that were last accessed x days ago use this option. If your system
    has suddenly lost all its free space, there''s probably a file out there that
    has grown very big in that time, and you can locate it using mtime. Use the ''-''
    to specify files that have not been accessed in x number of days. Use ''+'' for
    files that have been accessed in the last x number of days.


