    # 21.2.11 Creating better menus


    Remember the menu we created when we covered while loops? Let''s now improve on
    the menu script. The menu will now have the following options:


    +   1 : ADD A RECORD

    2 : VIEW A RECORD

    3 : PAGE ALL RECORDS

    4 : CHANGE A RECORD

    5 : DELETE A RECORD

    P : PRINT ALL RECORDS

    H : Help screen

    Q : Exit Menu


    We use our read_char function, so that the user does not have to return when selecting
    menu options. The trap command (on traps later in the book) will also be used
    to ignore signals 2, 3 and 15. This will stop the user from trying to break out
    of the menu.

    The menu will also have some form of control access. Certain privileged users
    will be able to change or delete records. The rest of the defined users will only
    be able to add, view or print records. A list of valid users with their access
    levels is held in a file called priv.user.'
