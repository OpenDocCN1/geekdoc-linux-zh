  md: '# 9.2 awk script


    When specifying awk on the command line, an awk script consists of various actions
    and patterns.


    When awk reads the records or lines one at a time it looks to see if the -F or
    the FS option (more on FS later) has been set. If it has it will use this to separate
    the fields, but if the -F option has not been set then awk will assume that <space>
    is the field separator, and it will continue to do this until it hits a new line.
    When a new line has been reached it knows it has read in a whole record, and will
    then start on the new line reading in the next record. This reading process each
    record continues until the end-of-file has been reached, or no more text exists.


    Using Table 9.1 as a guide, awk reads in the file one line at a time, finds a
    separator (in this case a hash symbol ''#'') and assigns it as field-n, until
    it reaches a new line (which is the default record separator). Then it classes
    this line as a record. Awk starts all over again reading in the next line.


    How awk reads records from a file


    | <Field-1> | <sep> | <Field-2> | <sep> | <Field-3> | <sep> | <Field-4 and new
    line> |

    |---|---|---|---|---|---||}{

    | P.Bunny (Record 1) | # | 02/99 | # | 48 | # | Yellow \n |

    | J.Troll (Record 2) | # | 07/99 | # | 4842 | # | Brown-3 \n |


    # 9.2.1 Patterns and actions


    Any awk statement can consist of a pattern or action, and the pattern part decides
    when an action statement should be triggered or what should trigger it. The action
    is what we want to do with the data. If you omit the pattern part, the action
    will always be carried out.


    Patterns can be conditional


    An action is specified by enclosing the statements within curly brackets {}. Actions
    are mostly used for printing, but for longer scripts generally include if and
    iteration (looping) statements as well as iteration exit constructs. If you do
    not'
