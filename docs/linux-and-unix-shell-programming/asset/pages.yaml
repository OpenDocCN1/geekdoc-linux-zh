  md: "# 23.1.6 echo\n\nOne of your most useful tools as an aid to debugging scripts\
    \ is the echo command. Add the echo command at important points in your script\
    \ where you think you may have problems. For instance, use the echo command before\
    \ and after a variable is read or changed.\n\nUse the last status command to determine\
    \ if the command was successful. Note of caution here; do not use echo followed\
    \ by the last status, since the command will always return true.\n\n# 23.2 The\
    \ set command\n\nThe set command can be used as an aid to debugging. Here are\
    \ set's most debugging options.\n\n+   - set -n Read commands but do not execute\
    \ them\n- set -v Display all lines as they are read\n- set -x Display all commands\
    \ and their arguments\n\nTo turn a set option off simply substitute the - sign\
    \ with the +. always think that it should be the other way round, + to turn it\
    \ off and - to turn it on, but that's just me.\n\nYou can use set at the top of\
    \ your script to enable it and disable it when the script finishes, or you can\
    \ stick set in a particular block statement that is giving you problems.\n\nLet's\
    \ see set in action. Here's a little script that holds names in a variable list.\
    \ The user inputs a name, for loop then loops through the list to see if there\
    \ is a match. Notice I have used set -x at the top of the script and then disabled\
    \ it at the bottom.\n\n```\n$ pg error\n!/bin/sh\n# error\n# set set -x\nset -x\n\
    LIST=Peter Susan John Barry Lucy Norman Bill Leslie\necho -n \"Enter your Name\
    \ :\"\n```\n\n```\nfor LOOP in $LIST\ndo\nif [ \"$LOOP\" = \"$NAME\" ]; then\n\
    \  echo \"you're on the list, you're in\"\n  break\nfi\n```"
