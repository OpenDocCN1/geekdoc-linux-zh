    # 2.2 Xargs


    When using the -exec option in find to process files, find passes all the located
    files to exec to be worked on in one go. Unfortunately on some systems there is
    only a limited command line length that can be passed to exec before it bombs
    out after running for a few minutes with an error message. The error usually says
    ''Too long on Args list'' or ''Args list exceeded''. This is where xargs comes
    in, especially when using find. Passes on the located files to xargs and xargs
    grabs the files in portion and not in all in one go, unlike exec. Thus it can
    process the first portion of files, do its stuff, then request the next batch
    of the files and so on.


    Let''s see how xargs fits in find with some examples.


    The following example goes through the system looking at each ordinary file, then
    uses xargs to test what type of file it:


    ```

    $ find -type f -print | xargs file\n/etc/protocols: English text\n/etc/security:
    ASCII text\n..

    ```


    The following example goes through the entire system looking for core dumps and
    echos the result to /tmp/core.log file:


    ```

    $ find -name "core" -print | xargs echo "/tmp/core.log

    ```


    The following example locates all files in /apps/audit that are read, write and
    executable by everyone, and takes away the write permission:


    ```

    $ find /apps/audit -perm -7 -print| xargs chmod o-w

    ```'
