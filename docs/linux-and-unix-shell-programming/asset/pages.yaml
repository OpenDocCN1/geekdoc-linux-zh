    | umask number | Directory | Files |

    | 022 | 755 | 644 |

    | 027 | 750 | 640 |

    | 002 | 775 | 664 |

    | 006 | 771 | 660 |

    | 007 | 770 | 660 |


    To see your current settings for umask, just type umask.


    ```

    $ umask

    $ 022

    $ touch file1

    $ ls -l file1

    $ -rw-r--r-- 1 dave admin 0 Feb 18 42:05 file1

