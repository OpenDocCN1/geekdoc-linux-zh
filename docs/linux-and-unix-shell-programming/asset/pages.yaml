  md: '# CHAPTER 14


    # Environment and shell variables


    To make your time in the shell more productive, you have shell variables at your
    disposal. Shell variables are names that hold values. A value can be a path name,
    a filename, or maybe a number, the shell treats any assignment as a string of
    text.

    There are two types of variables, local and environment. Strictly speaking there
    are four, but the other are read-only and are considered special variables used
    in passing parameters to shell scripts.

    In this chapter we will cover:


    +   - shell variables;

    - environment variables;

    - variable substitution;

    - exporting variables;

    - special variables;

    - passing information to scripts; and

    - using positional parameters on system commands.


    # 14.1 What is a shell variable?


    Variables let you customize your working environment. You use variables to hold
    information that you want to use yourself, to let the system know more about you.
    Variables are also used to hold constant information. For instance, there is a'
