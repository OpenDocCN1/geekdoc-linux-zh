  md: '# CHAPTER 1


    # File security and permissions


    To stop unwanted users accessing your files, you can set permission bits on them,
    and on your directories. You can also specify what type of permissions the files
    get when they are created: this is just a small part of system security. We will
    not concern ourselves with the big security picture, just the files and directory
    part.

    This chapter will cover:


    +   - permissions on files and directories;

    - the setuid;

    - chown and chgrp;

    - ummask; and

    - symbolic links.


    A file is owned by the user who created it and the group user belongs to. That
    user alone can then specify who can read, write and execute that file. Of course,
    root or the system administrator can override anything that a mere mortal user
    does. A file when created can be accessed in three ways:


    +   1. By reading, so you can cat/display the file.

    2. By writing, so you can edit or delete it.

    3. By executing, if the file contains a script or is a program.


    Permissions of a file are grouped into three different types:


    +   1. Owner, who actually owns the file

    2. Group, who is any user who belongs to that group.

    3. Other, i.e. someone outside the group.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# 1.1 Files


    When you create a file the system stores all the information you could ever want
    to know about it, including:


    +   - The location of the file;

    - File type;

    - File size;

    - Who owns it and can access it;

    - The inode;

    - Time last modified; and

    - The permission bits of the file.


    Let''s look at a typical file listing, using the ls -l command:


    ```

    $ ls -l

    total 4232

    -rwxr-xr-x root root 3756 Oct 14 04:44 dmes

    -rwxr-xr-x root root 12708 Oct 3 05:40 ps

    -rwxr-xr-x root root 5388 Aug 5 1998 pwd

    ```


    If we go through the output of the first two lines a step at a time, we can break
    down the information ls -l gives us.


    total 4232 This field tells us how much space the files have taken up in the directory.


    -rwxr-xr-x This is the permission bits on the file. If you count all the characters
    excluding the first ''-'', you''ll see that there are in fact nine of them. There
    is a good reason for this, as I mentioned earlier, you can specify who can access
    the files. These are put into the following categories (or sets):


    | rwx user these are the first three bits |

    | r-x group these are the second three bits |

    | r-x other or the rest of these are the last three bits world |


    We''ll go over these permission bits in more detail later on. A. A dash ''-''
    (in place of r, w, x) within these sets means those rights have been taken away
    or revoked.


    1 This is the number of hard links the file has.

    This is who owns the actual file.'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'This is the default group that root belongs to (also called root!).


    This is the date of the last time the file was modified.


    The actual file name.


    # 1.2 Types of files


    Remember I to exclude the first dash when looking at the file permissions? Well,
    here''s what the first dash means. A file can be one of seven types, designated
    by the first character when you do a `ls -l` command. The types are as follows:


    +   - d is a directory.

    - l is a symbolic link (a pointer to another file).

    - s is a domain socket.

    - b is a special block file.

    - c is a character special file.

    - p is a named pipe file.

    - - is a normal file or, more accurately, none of the above.


    # 1.3 Permissions


    Let''s create a file using the touch command


    ```

    $ touch myfile

    ```


    Do now an ls -1 on the directory


    ```

    $ ls -1

    -rw-r--  1 dave  admin  0 Feb 19 22:05 myfile

    ```


    We have created an empty file, and as expected the first dash tells us that we
    have an ordinary file. You''ll find that most of your file creations will be for
    ordinary files and symbolic links (more on symbolic links later).


    +   - User permissions Group permissions Other permissions

    - r --  r --  r --


    The next three permission bits (rw-) are your permissions, the owner of the file.
    The following (r--) are the group permissions that you belong to, in this case'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'the group admin. The last three (r--) are the rest of the world, or anybody
    else. My default group admin, of which I am a member, is also displayed. Let''s
    now look more closely at the file myfile, to see the actual permissions mean.


    # Table 1.1 Breakdown of the example listing


    | (first character) - | Ordinary file. |

    | --- | --- |

    | (next three characters) r w - | These are the owner permissions. |

    | (next three characters) r -- | These are the groups. |

    | (the last three characters) r -- | These are for anybody else. |


    Each set of three characters (excluding the first) defines:


    +   1. Permissions for the owner of the file.

    2. Permissions of the default group you belong to (a user can belong to many groups).

    3. Permissions for anybody else on the system.


    For each of these sets we have the following set permissions.


    +   r You read this file.

    w You can write/amend this file.

    x You can execute this script or program.


    Or to display the permissions in another form for the myfile:


    | Type of file r w- | r-- | r - |

    | is ordinary Owner | Group | Other |

    | read and write | can read | can read |


    You may have noticed that the myfile wasn''t created with the execute permission
    for the owner, the system will not let you create any file with this permission
    bit set. This is due to the security enforced by the system. You have to change
    this manually: you''ll see why you don''t execute permission when we deal with
    the umask command. However, you can set the execute bit on directories, but these
    have a slightly different meaning, which we will discuss later as well.


    Understanding all these permission bits can be a bit confusing, so let''s look
    at some examples (see Table 1.2).


    To confuse you more, if the owner has only a read bit set, he can still write
    to it using file re-direction. Deleting a file is also dependent on the directory
    bits, as we shall see in a moment.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Table 1.2 File permissions and what they mean


    | Permission | What it means |

    | --- | --- |

    | r-- --- | The owner can read this, but cannot write or execute. |

    | r--r --- | The owner and the group (generally speaking the default group belong
    to) can read it. |

    | r --r-- | Anybody can read this, but not write or execute. |

    | rwx r-- | The owner can read, write and execute, anybody else can only read
    it. |

    | rwx r-x--- | The owner can read, write and execute, the group can read and execute.
    |

    | rwx r-X | The owner can read, write and execute; both the group and anybody
    else can read and execute. |

    | rw- rw-- | The owner and group can read and write. |

    | rw- rw- r-- | The owner and group can read and write, and anybody else can read.
    |

    | rw- rw- rw- | The owner and anybody else can read and write. Caution should
    be used with this type of permission, as anybody can write to the file. |


    # # 1.4 Changing permission bits


    You can change the permission bits of files you own to whatever you feel comfortable
    with. You have to ask yourself which users need access to your files (and this
    also includes directories that you own). You can change the permission bits using
    the command `chmod`. This command can be used in a short way using the absolute
    mode or a long way using the symbolic mode. We''ll look at the symbolic mode first.


    # ## 1.4.1 Symbolic mode


    The general format of the chmod command is


    ```

    chmod [who] operator [permissions] filename

    ```


    who means:


    +   - u The user permissions

    - g The group permissions

    - o The other permissions

    - a Means all (user, group and other)'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'operator means:


    +   + Add a permission

    - Take away a permission

    = Set permissions


    permission means:


    +   r Read permission

    w Write permission

    x Execute permission

    s User or group set-ID

    t Sticky bit*

    t Lock the file, other users cannot access it


    * Occasionally you may see the t when you are listing on a file or directory.
    The t stands for the ''sticky bit''. If you see a ''t'' on a directory then only
    the owner of the files in that directory can delete them, even if a member of
    a group has the same rights as the owner. But some systems are quite forgiving
    on this rule.


    If you see a ''t'' on a file listing, this means that once the script or program
    has been run it is to be kept in swap (virtual memory). As memory is so cheap
    nowadays you can pretty ignore the use of ''t'' on files.


    # 1.4.2 chmod examples


    Let''s know some examples of using the chmod command. Assuming we start off with
    a file with the following permissions, rwx rwx rwx


    | This command | Produces this | Which means |

    |---|---|---|

    | chmod a-x myfile | rw- rw- | Take away all execute permissions |

    | chmod o-w myfile | rw- r-- | Take away write from group and other |

    | chmod g+w myfile | rw- r-- | Add write to group |

    | chmod u+x myfile | rwx r-- | | execute to owner |

    | chmod go+x myfile | rwx rwx r-x | Add execute to group and other |


    When I created the file it had the following permissions:


    -rw-r-- 1 dave admin 0 Feb 19 22:05 myfile


    If I now create a script within that file, and I want to make it executable to
    myself, and also take away read rights from the other (the rest of the world),
    I could type:


    ```

    $ chmod u+x o-w myfile

    ```'
