    # 26.2 Signals


    A signal is a type of message sent from the system to inform a command or script

    that an event has occurred somewhere. The events are usually to do with memory

    error, access problems or some user trying to stop your process. The signals are

    actually numbers. Below is a table listing the most used signals and their meaning.


    | Signal no. | Signal name | Meaning |

    | 1 | SIGHUP | Hangup or parent process killed |

    | 2 | SIGINT | Interrupt from keyboard, usually <CTRL-C> |

    | 3 | SIGQUIT | Quit from the keyboard |

    | 9 | SIGKILL | Default kill |

    | 11 | SIGSEGV | Segmentation (memory) violation |

    | 15 | SIGTERM | Software termination (default kill) |


    There is a signal 0, which we have already met when we created a .logout file

    erlier in the book. This signal is the ''exit from shell'' signal. To send a signal
    0, just

    type exit from the command line or use <CTRL-D> on a process or on

    command line.


    To send a signal [- signal name|] process 1D


    Using the kill command with no signal number or name means that the

    kill command will default to signal 15.

    To see a list of all the signals:


    ```

    $ kill -1

    1) SIGHUP 2) SIGINT 3) SIGQUIT 4) SIGILL

    5) SIGTRAP 6) SIGIOT 7) SIGBUS 8) SIGFPE

    9) SIGKILL 10) SIGUSR1 11) SIGSEGV 12) SIGUSR2

    13) SIGPIPE 14) SIGALRM 15) SIGTERM 17) SIGCHLD

    ```'
