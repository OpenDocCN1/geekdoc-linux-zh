    # 9.2.10 String escape sequences


    When using strings or regular expressions, you may want to include a new line
    in the output or search for a metachar.

    When printing a new line (a new line is the character \n) we give it an escape
    sequence, so awk does not misinterpret the meaning. We can escape it by giving
    it a special meaning by putting a backslash before the character. For instance
    to force awk to print a new line we use \n.


    If you are using regular expressions and want to search for the curly bracket
    (!), just put a backslash before the character, like \/{\/. This will disable
    the special meaning that the bracket has in awk.

