- img_proc: true
  md: "```\n$ [ -u xab ]\n$ echo $? \n0\n```\n\nWe can see from the above that the\
    \ suid bit is set.\n\n# 17.2 Using logical operators with tests\n\nTesting for\
    \ a file's status is OK, but in some instances you'll want to compare one file's\
    \ status against another. The shell offers three types of logical operators for\
    \ you to accomplish this:\n\n+   - Logical AND, true, if both sides of the operator\
    \ are true\n- Logical OR, true, if either sides of the operator can be true\n\
    - Logical NOT, true, if the condition is false\n\nLet's now compare these files.\n\
    \n| -rw-r--r-- | 1 root root | 0 May 15 11:29 scores.txt |\n| -rw-xr-xr- | 1 root\
    \ root | 0 May 15 11:49 results.txt |\n\nThe following example tests whether both\
    \ files are readable.\n\n```\n$ [ -w results.txt -a -w scores.txt ]\n$ echo $?\
    \ \n0\n```\n\nIt finds out that they are.\n\nTo test if either of the files is\
    \ executable use the logical OR operator.\n\n```\n$ [ -x results.txt -o -x scores.txt\
    \ ]\n$ echo $? \n0\n```\n\nScores.txt is not, but results.txt is.\n\nTo test if\
    \ the file results.txt is both writeable and executable.\n\n```\n$ [ -w results.txt\
    \ -a -x results.txt ]\n$ echo $? \n0\n```\n\nYes, it is."
  merge: -1
  pgno: 256
- img_proc: true
  md: '# 17.3 Testing strings


    Testing strings is an important part of error trapping, especially when you need
    to test users input, or compare any variables. To test strings you have the choice
    of five formats.


    ```

    test "string"

    test string_operator "string"

    test "string" string_operator "string"

    [ string_operator string |

    [ string string_operator string |

    ```


    where the string_operator can be:


    ```

    = The two strings are equal

    != The two strings are not equal

    -z This string is null

    -n This string is not null

    ```


    To test the environment variable EDITOR is empty:


    ```

    $ [ -z $EDITOR ]

    $ echo $?

    1

    ```


    No, it isn''t. Is it set to vi?


    ```

    $ [ $EDITOR = "vi" ]

    $ echo $?

    0

    ```


    Yes it is. Let''s verify that with an echo.


    ```

    $ echo $EDITOR

    vi

    ```


    To test if the variable is equal to the variable tape2:


    ```

    $ TAPE="/dev/rmt0"

    $ TAPE2="/dev/rmt1"

    $ [ "$TAPE" = "$TAPE2" ]

    $ echo $?


    ```


    No, it isn''t. There is no rule stating you have to use the double quotes when
    assigning variables, but you must do so when comparing strings.'
  merge: -1
  pgno: 257
- img_proc: true
  md: 'To test if the variable `tape is ''not'' equal to tape2.


    ```

    $ [ "TAPE" != "TAPE2" ]

    $ echo $?

    0

    ```


    They are not equal.


    # 17.4 Testing numbers


    To test for numbers a different sort of operators are at our disposal. The general
    format is:


    ```

    "number" numeric_operator "number"

    ```


    or


    ```

    [ "number" numeric_operator "number" ]

