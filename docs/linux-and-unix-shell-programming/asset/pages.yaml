    # 18.3.20 Adding and checking integer values


    In this next example we look at numeric testing. The script holds a counter value,
    which the user can change simply by inputting a new number. The script then adds
    the new value to the constant value of 100. Here''s how it works.


    The user can change the value by entering a new value, or if she hits return nothing
    is changed. The current value is echoed, and the script exits.


    If the user replies Y or n, the user is prompted for the new value to add to the
    counter. If the user hits return, the script echoes that the counter will stay
    the same value. When the user enters a value, a numeric test is carried out to
    see if it is a number. If it is then it is added to the value of COUNTER and the
    new value is then displayed.'
