    \ conv for, display the variables\nprintf \"${NAME}=${TYPE}\"\n# now assign the\
    \ fields to VAR ready to eval, so\n# we can then assign individual fields, double\
    \ backslash needed\n# in case the fields have spaces in them\nVARS=$(printf \"\
