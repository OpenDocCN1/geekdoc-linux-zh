    # 21.2.5 Cursor position


    We can also use tput to place the cursor anywhere on the screen. The format for
    this is:


    ```

    cup r c

    ```


    where r is the row (line) number down the screen and c is the column number across
    the screen.

    It''s best to use this as a function, then you can pass it the row and column
    values.


    ```

    xy()

    {

    #R= row, _C=column

    R=$1

    _C=$2

    tput cup $_R $_C

    }


    clear

    xy 1 5

    echo -n "Enter your name :"

    read NAME

    xy 2 5

    echo -n "Enter your age :"

    read AGE

    ```


    Of course it would be just as appropriate to pass it a string to display as well;
    the slightly amended function that will do this.


    ```

    xy()

    {

    #R= row, _C=column

    R=$1

    C=$2

    _TEXT=$3

    tput cup $_R $_C

    echo -n $$_TEXT

    }

    ```


    This could be veiled like this:


    ```

    xy 5 10 "Enter your password :"

    read CODE

    ```'
