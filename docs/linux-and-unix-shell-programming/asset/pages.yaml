  md: '# CHAPTER 15


    # Quoting


    In Chapter 14 we learned how to do variable and substitution operations. carrying
    out variable substitutions in your scripts one of the most irritating errors you
    will come come across will be due to misquotingoting. Quoting is also important
    on the command line.


    In this chapter we''ll cover:


    +   - why there is a need to quote;

    - double, single and back quotes; and

    - escaping using the backslash.


    #  15.1 The need for quoting


    We will cover only the basic rules of quoting here, because there are plenty of
    examples of when to use quoting and what it achieves in the next two parts of
    the book.


    When the shell reads the lines in your scripts, it will try to do its own evaluation
    of the assignments you have made. You need a way to stop the shell from doing
    this. The methods available are by using quotes, different kinds of quotes, and
    using a backslash.


    Some users do not bother use double quotes when echoing strings of text. If they
    did half their quoting problems would go away. I recommend you always to use double
    quotes when echoing strings of text. Here''s an example before we begin in the
    different quotes.


    ```

    $ echo Hit the star button to exit *

    ```


    ```

    Hit the star button to exit DIR_COLORS HOSTNAME Muttr X11 adjtime aliases alias

    ...

    ```'
  merge: -1
  pgno: 242
- img_proc: true
  md: 'The text is echoed, but because we have not used double quotes, the * is evaluated
    by the shell, and it thinks you want to do a wildcard listing. Enclosing it with
    double quotes gives:


    ```

    $ echo "Hit the star button to exit *"

    Hit the star button to exit *

    ```


    so there is no misinterpretation on the quotes. Table 15.1 shows the different
    types of quotes.


    # Table 15.1 Quotes of the shell


    +   - Double quotes

    - Single quotes

    "- Grave or back quote

    - Backslash"


    # 15.2 Double quotes


    Use the double quotes to take literally everything except the following characters:
    $, \, ''. That''s a dollar, back quote and backslash; these characters keep their
    special meanings to the shell. If we assigned a string to a variable using double
    quotes to echo it, we see there is no difference in echoing the variable.


    ```

    $ STRING="MAY DAY, MAY DAY, GOING DOWN"

    $ echo "$STRING"

    MAY DAY, MAY DAY, GOING DOWN

    ```


    ```

    $ echo $STRING

    MAY DAY, MAY DAY, GOING DOWN

    ```


    Now suppose we want to assign the system''s date output to a variable called mydate:


    ```

    $ MYDATE="date"

    $ echo $MYDATE

    date

    ```


    Because the shell is taking everything ''as is'' inside the string, the date has
    no special significance, therefore will hold just the word date.


    When you want to search for a string of text that contains spaces, always use
    double quotes. Here we use `grep` to extract the name "Davey Wire". Because we
    have not used quotes, `grep` thinks that "Davey" is the string to search and the
    file is "Wire".'
