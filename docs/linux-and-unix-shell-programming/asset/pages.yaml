  md: "If a user tries to run the menu and their name is not present in the file,\
    \ they will be informed that they cannot run this application and be exited.\n\
    For display purposes only, system commands will replace the actual behind the\
    \ scenes options. Have a look at Chapter 22 if you want to see data validation\
    \ on file updates.\n\nHere's the priv.user file that contains usernames of who\
    \ and can delete or change records. At a glance we can see that root, dave and\
    \ matty cannot make changes to the database files, but peter and louise.\n\n```\n\
