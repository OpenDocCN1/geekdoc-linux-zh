    # 29.4.5 Printing out current Web environment settings using a link


    When a cgi script is executed, a number of environment variables become available.
    You can use the env or set command to see most of the variables. Let’s create
    a link from our main.html file to execute a script that displays these variables.


    Here’s the link entry we use:


    ```

    < A HREF="/cgi-bin/printenv.cgi"> Environment </A>

    ```


    A HREF marks the start of the link tag. The address or destination comes next
    double quotes. The word ‘Environment’ is what will be displayed on the screen;
    this is what the user will ‘click on’ to send the form’s contents. </A> marks
    the end of the link tag.


    * Note*'
