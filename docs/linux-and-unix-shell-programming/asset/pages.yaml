  md: '# CHAPTER 5


    # Shell input and output


    To be able to read data into your scripts you have a few different methods available
    to you: use the standard input which is your keyboard, or assign a file as the
    input. The same goes for the output: unless you specify a file as the output,
    the standard output will always go to your terminal screen. If you have errors
    that are generated from the commands that you use, you probably do not want these
    messages up your screen, so you can redirect these messages to another output,
    generally a file.

    Most of the commands that use standard input usually specify files as their standard
    input – why key in a load of data, when it can be read via a file? In this chapter
    we will cover:


    +   * using standard input, output and errors; and

    * redirection of input and output.


    This chapter is all about using the shell for input and output for all your data
    and information, with a bit of redirection.


    # 5.1 echo


    Use echo to display lines of text or variables or to direct strings into files.
    The general format is:


    ```

