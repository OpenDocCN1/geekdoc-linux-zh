  md: '# 42 Running commands unattended


    If no message is displayed indicating the job has been terminated, it''s a good
    idea to wait for a minute in case the process is in the middle of terminating,
    then issue another kill command, this time with a signal option:


    ```

    $ kill -9 28305

    [1] + Killed    ps1 &

    ```


    When sending jobs to the background, these will be terminated the moment you log
    out of the system. To keep a job running after you log out nohup which is explained
    below.


    # 3.4 The nohup command


    If you are running a process and you don''t think it will be completed by the
    time you log out for the day, use the nohup command. Nohup will continue processing
    when you exit your account. Nohup means no hang up.

    The general format of the command is:


    ```

    nohup command &

    ```


    # 3.4.1 Submitting a job using nohup


    Any output from your job will be redirected to a file called `nohup.out`, unless
    you specify otherwise with


    ```

    nohup command > myout.file 2 > &

    ```


    which sends all output to the file myout.file.

    Let''s do an example and test that it actually does continue working after you
    have logged out. We''ll kick off a cleanup script called ps1.


    ```

    $ nohup ps1 &\n[1] 179

    $ nohup: appending output to `nohup.out`

    ```


    Now exit the shell, log back again, and run the following command:


    ```

    $ ps x |grep ps1

    179 ? S N 0:01 sh /root/ps1

    506 p2 S 0:00 grep ps1

    ```


    The script is still working. Use ps -ef |grep ps1 if your system does not support
    ps x.'
