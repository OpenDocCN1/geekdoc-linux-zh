  md: '# Difference (diff) command


    The diff command shows the line-by-line difference between two files. The first
    file is compared to the second file. The differences are identified or that the
    first file could be modified to make it match the second file.


    # Syntax


    ```

    diff -optionfiles (or) directories

    ```


    The diff command always works on files. The arguments can be two files, a directory
    or two directories. When one file and one directory are specified, the utility
    looks for a file with the same name in the specified directory.


    If the two directories are provided, all files with matching names in each directory
    are used. Each difference is displayed using the following format:


    ```

    range1 action range2

    < text from file1

    ----------------

    >text from file2

    ```


    The first line defines what should be done at range1 in file1 to make match the
    lines at range2 in file2.


    If the range spans multiple lines, there will be a text entry for each line in
    the specified range.


    The action can change ( c ), append ( a ), delete ( d )


    Change ( c ) indicates what action should be taken to make file1 the same as file2.


    Append ( a ) indicates what lines need to be added to file1 to make the same as
    file2. Appends can take place only at the end of file1; they occur only when file1
    is shorter than file2.'
  merge: -1
  pgno: 256
- img_proc: true
  md: 'Delete ( d ) indicates what lines must be deleted from file1 to make it the
    same as file2. Delete can occur only if file1 is longer than file2.


    | Example | Interpretation |

    |---|---|n| 5c5 | Change: Replace line 5 in file1 with line 5 in file2 |

    | 10 a 16,17 | Append: at the end of file1 ( after line10), insert lines 16,17
