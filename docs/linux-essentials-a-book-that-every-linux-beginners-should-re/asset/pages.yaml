  md: '# Permission Set


    +   - Each permission group acquires three permissions, read, write and execute
    which together called a permission set.


    +   - Each file or directory has a permission set specified for each permission
    group. Since we have 3 type of permission group, totally each file or directory
    contains 3 permission set corresponding to each group.


    +   - The first permission set represents the owner permissionsthe second set
    represents the group permissions, and the last set represents the other permissions.


    +   - The read,writeand executepermissions are represented by the characters r,w,andxrespectively.


    +   - The presence of any of these characters (rorw or x),indicates that the particular
    permission is granted.


    +   - A dash (-) symbol in place of a character in a permission set indicates
    that a particular permission is denied.


    +   - Linux assigns initial permissions automatically when a new file or directory
    is created.'
