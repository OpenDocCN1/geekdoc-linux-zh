    101,kumar,sales,pune,1000

    432,vijay,sales,chennai,3500

    456,ram,sales,pune,8905

    [student@krosum~]$

    [student@krosum~]$ grep admin emp.csv

    [student@krosum~]$

    ```


    Examples :


    See the above examples. Here initially we are searching keyword sales from emp.csv
    file, recap the above 3 steps on how grep is working.


    +   * Step 1: grepwill read input (emp.csv) data by line by line , placed to pattern
    space

    * Step 2: search the sales keyword on the pattern space

    * Step 3: if keyword is matched, display the matched pattern lines to monitor
    (STDOUT).


    If pattern is not matched, grep does not return any result to monitor. In the
    above example admin grep is not matched in emp.csv file.


    As we walk through the flow, look for how grephandles the following situations:


    +   * 1. grep is a search utility; it can search only for the existence of a line
    that matches a pattern.'
