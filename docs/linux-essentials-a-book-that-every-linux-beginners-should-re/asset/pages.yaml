    # 2. Symbolic Links


    +   - When the link (ln) is executed with no option, the result is a hard link.
    If we try to create a hard link to a different file system, it is rejected because
    hard links must bemade within the current directorystructure.


    +   - To link to a different file system, therefore, we must use symbolic links.
    We must also use symbolic links when we are linking to directories.


    +   - There is a danger with symbolic links because, although they behave like
    files and directories, do not physically exist. They only point to real directory
    or file.


    +   - If the physical file is deleted, the file will no longer appear on a listing
    under its original name. It will still be available under its symbolic link name,
    but it is not accessible.


    +   - If a physical directory is deleted, the symbolic link to the directory still
    exists. In that case if we try to list the symbolic directory, it lists with no
    files. However, if we try to move to it, we receive a message that it doesn''t
    exist.'
