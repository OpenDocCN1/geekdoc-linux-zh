  md: '# grep command


    +   - grep stands for global regular expression print.


    +   - grep is used to search the input file for all lines that match a specified
    regular expression and write them to the standard output file (monitor).


    # Syntax


    ```

    grep–option pattern inputfile(s)

    ```


    grep performs the following operations:


    +   - step 1 : greputility read the input data, line by line from file (or) pipe
    into pattern space. The pattern space is a buffer that can hold only one text
    line.


    +   - step 2: search the pattern to the pattern space


    +   - step 3: If there is a match, the line is copied from the pattern space to
    the standard output.


    The grep utilities repeat these three operations on each line in the input.'
  merge: -1
  pgno: 274
