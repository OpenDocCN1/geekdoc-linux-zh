    \ apply.\n* If the GIDs do not match, the permission set for other is used to\
    \ determine file and directory access.\n\n+   * Referring to the above image,\n\
    \    * If the UID equals the UID, then use the owner permissions.\n    * If not,\
    \ checks whether GID equal the GID? If yes, use group permissions. If not, use\
    \ other permissions."
