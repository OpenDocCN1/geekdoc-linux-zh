    # # CHAPTER 2 - LINUX BOOT

    PROCESS


    # ## Step 1- BIOS (Basic Input Output System)


    Once the Personal Computer (PC) is switched on, BIOS instruction will start its
    part. The BIOS is used to perform hardware initialization during the booting process.
    The main job assigned to BIOS is POST (Power On Self-Test). It is hardware self-testing
    and checking.


    The two main errors that occur during POST are:


    +   1. Fatal error - This occurs due to hardware problems.

    2. Non-fatal error - This occurs due to software problems.


    Main responsibilities of BIOS during POST are listed below:


    +   1. Verify CPU registers.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '+   2. Verify the integrity of the BIOS code itself.

    3. Verify some basic components like DMA, timer, and interrupt controller.

    4. Find, size, and verify the system main memory.

    5. Initialize BIOS

    6. Identify, organize, and select which devices are available for booting.


    The beep sound after the POST indicates its result. A single short beep restart/start
    indicates normal POST i.e. the system is OK. Two short beeps indicate a POST error
    and the error code is shown on screen.


    BIOS act as an intermediary between computer CPU and Input/output devices. This
    eliminates the intervention of the operating system and software. The system/server
    is always aware of the details of hardware and other I/O devices. If any hard
    disks or I/O devices are changed, the BIOS also needs to be updated.


    BIOS is stored in EEPROM (Electrically Erasable Programmable ROM) / Flash memory.
    BIOS cannot be stored on a hard disk or other devices because it is the one which
    manages those devices.


    BIOS is written in assembly language. After testing the system hardware and its
    components, it loads a Master Boot Record. It is also called as Master Boot Loader.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# # Step 2 - (MBR) Master Boot Record


    ## What is Master Boot Record (MBR)?

    Master Boot Record is the first place where boot loader begins to start. MBR is
    a 512 byte sector located in the first sector of hard disk. MBR contains both
    program code and partition table details.


    ![](img/39c8fbde7fc51cbef611f658dfbb1fe2_25_0.png)


    # ## MASTER BOOT RECORD (MBR)


    On a computer with x86 architecture, the Master Boot Record (MBR) is the first
    512 bytes of the boot drive that is read into memory by the BIOS.


    The first 446 bytes out of 512 bytes contain low-level boot code. For some boot
    loaders, the code in the MBR points to further boot loader stored somewhere else
    on the disk or on another disk.'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'The next 64 bytes contain the partition table for the disk where file system
    utilities like fdisk, cfdisk, partedetc., are placed and using these utilities,
    we can get partition table information.


    The last two bytes are the boot signature, which is used for error detection.


    # Step 3 - Boot Loader


    So far we are aware that when POST is done successfully, the BIOS will execute
    MBR code. MBR code contains information about boot loader and this MBR executes
    the boot loader. So let us now see what this boot loader is?


    The boot loader software runs when a computer starts. It is responsible for loading
    and transferring cctl to the kernel.


    It is located in the 1st sector of the bootable disk. ( /dev/sda(or) /dev/had(or)
    /dev/xvda )


    Boot loader is kept in separate partition under file system; it will mount from
    /boot partition.'
  merge: -1
