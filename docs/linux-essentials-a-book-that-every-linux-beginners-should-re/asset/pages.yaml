  md: '# Link (ln) command


    +   * The link command receives either a file or directory as input and its output
    is an updated directory.

    * Two types of link in Linux


    +   1. Hard link

    2. Soft link (or Symbolic link)


    # ## Hard links to Files


    +   * To create a hard link to a file, we specify the source file and destination
    file.

    * If the destination file doesn''t exist, it is created.


    ```

    student@krosum Demo]$ ls -li pl1.txt

    student@krosum Demo]$ ls -li pl1.txt

    2097307 -rw-rw-r-- 1 student student 40 Mar 21 19:45 pl1.txt

    student@krosum Demo]$ ln pl1.txt p2.txt # creating hardlink

    student@krosum Demo]$ ls -li pl1.txt

    2097307 -rw-rw-r-- 2 student student 40 Mar 21 19:45 pl1.txt

    2097307 -rw-rw-r-- 2 student student 40 Mar 21 19:45 p2.txt

    student@krosum Demo]$ cat -n pl1.txt

    1 echo "test1"

    2 echo "test2"

    1 echo "test1"

    2 echo "test2"

    ```


    +   * If it exists, it is first removed and then re-created as a linked file.

    * Note in both file (p1.txt p2.txt) inode (index number) is same.

    * See the below snap where we have appended TEST REPORT TEST4 REPORT content to
    p1.txt file and this is'
