- img_proc: true
  md: 'The shell meta-characters are listed as follows:


    | META-CHARACTERS | DESCRIPTION |

    | --- | --- |

    | | | Sends the output of the command placed at the left of the pipe symbol as
    an input to the command on the right of the symbol. |

    | & | Runs the process in the background, allowing you to continue working on
    the command line. |

    | ; | Allows you to list multiple commands on a single line, separated by this
    character. |

    | () | Groups commands and sends their output to the same place. |

    | < | The command placed at the left of the symbol, gets its input from the right
    of the symbol |

    | > | Sends the output of the command placed on the left of the symbol, into the
    file named on the right of the symbol. |


    **Caution:** Do not include these meta-characters in filename/ directory name
    during their creation.'
  merge: -1
