  md: "# Applying the umask Value\n\n+   The default permissions assigned to the new\
    \ files and directories are based on the initial value of umaskwhich varies with\
    \ the user login (whether root or non-root).\n\n+   The table displays the results\
    \ in the symbolic mode. For example, the initial permissions for a new file in\
    \ the symbolic mode isr-rw-.\n\n+   This set of permissions corresponds to read/write\
    \ access for the owner, group, and other.\n\n+   This value is represented in\
    \ the octal mode as 42020420 or 666.\n    To mask out the write permission for\
    \ the group and other, use 022, the default umask value.\n    The result in the\
    \ octal mode is 420400400, 644, and rw-r-r in the symbolic mode.\n\n+   We can\
    \ apply this same process to determine the default permissions for directories.\n\
    \n+   For directories, the initial value specified by the system is rwxrxrwx.\
    \ This corresponds to read, write, and execute access for the owner, group, and\
    \ other.\n\n+   This value is represented in the octal mode as 421421421 or 777.\n\
    \n| PERMISSION FIELD | DESCRIPTION |\n| rw-rw-rw- | Initial Value specified by\
    \ the system for a new file |\n| ---W- -W- | Default umask utility value to be\
    \ removed |\n| rw-r -r- | Default permissions assigned to newly created files\
    \ |\n| rwxrxrwx | Initial values specified by the system for a new directory |\n\
    | ---W- -W- | Default umask utility value to be removed |\n| rxr-xr-x | Default\
    \ permissions set for newly created |"
