    \ (or) the root user can use the **chmod** command to change the permissions.\n\
    - The **chmod** command can be used in either symbolic or octal mode.\n  - Symbolic\
    \ mode uses a combination of letters and symbols to add or remove permissions\
    \ for each permission group.\n  - Octal mode, also called the absolute mode, uses\
    \ octal numbers to represent each permission group.\n\n**Note :\n\nWe can assign\
