    # CHAPTER 14 - FILTERS


    In Unix/Linux, a filter is any command that gets its input from the standard input
    stream, manipulates the input, and then sends the result to the standard output
    stream. Some filters can receive data directly from a file.'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# Common Filters


    | | |

    |---|---|

    | cut | Passes only specified columns |

    | paste | Combines columns |

    | cmp | Compares two files |

    | comm | Identifies common lines in two files |

    | diff | Identifies differences between two files or between common files in two
    directories |

    | head | Passes the number of specified lines at the beginning of the data |

    | tail | Passes the number of specified lines at the end of the data |

    | sort | Arranges the data in sequence |

    | tr | Translate one or more characters as specified |

    | uniq | Delete duplicate (continues repeated) lines |

    | grep | Print matched pattern lines |

    | Find | Search file and directories |'
  merge: -1
  pgno: 224
- img_proc: true
  md: '# Filters and pipes


    Unix/Linux filters depend on the input file or input pipe. All the filter command
    will read data from input file (or) pipe, stores it to buffer. From the buffer,
    filter command will execute and display command result to monitor.'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# cut command


    The basic purpose of the cut command is to extract one or more columns of data
    from standard input or from the input files.


    The syntax of the cut command


    ```

    cut -optionfilter_rangeinputfile (or) commandresult| cut-option filter_range

    ```


    Here filter_range are numbers. We can perform character based filtering or filtering
    based on input field delimiter.


    For character filter, use -c option. See the below example that shows filtering
    2nd character from input file (emp.csv). Character positions work when the data
    is aligned in fixed columns.


    ```

    [student@krosum~$ cat -n emp.csv # This is sample input file

    1 101,kumar,sales,pune,1000

    2 203,arun,prod,bglore,1245

    3 432,vijaj,sales,chennai,3500

    4 523,xerox,HR,mumbai,5490

    5 594,vijaj,prod,delhi,4590

    6 645,theeba,hr,hyd,9000

    7 755,ram,sales,pune,8905

    8 899,karthik,prod,bglore,5904

    [student@krosum~$ cut -c 2 emp.csv


    [student@krosum~$ ]

    ```'
  merge: -1
  pgno: 226
- img_proc: true
  md: '```

    $student@krum-$ cat -n emp.csv

    1 101,kumar,sales,pune,1000

    2 203,arun,prod,bglore,1245

    3 432,vijay,sales,chennai,3500

    4 323,xeroc,HR,mumbai,5490

    5 894,vijay,prod,delhi,4590

    6 245,theeba,hr,hyd,9000

    7 456,ram,sales,pune,8905

    8 399,karthik,prod,bglore,5904

    $student@krum-$

    ```


    So the command will display the removed result to monitor. This action takes on
    the buffer space and not in input file (emp.csv). So there are no changes in input
    file (emp.csv) after removing the `2nd` character from emp.csv file.


    # Specifying character positions


    ```

    $student@krum-$ cat -n IP1

    1 root:bin:bash

    2 as:usr:bin:ksh

    3 usr:bin:csh

    $student@krum-$ cat -c 2 IP1 # removed 2nd character from IP1 file.

    $student@krum-$ cat -c 5 IP1 # removed 5th character from IP1 file.

    $student@krum-$ cat -c 2,5 IP1 # removed 2nd and 5th characters from IP1

    $student@krum-$

    ```


    To specify that the file is formatted with fixed columns, we use the character
    option, `-c` followed by one or more column specifications. A column specification
    can be one column or a range of columns in the format N-M,'
  merge: -1
  pgno: 227
- img_proc: true
  md: 'where N is the start column and M is the end column, inclusively. Multiple
    columns are separated by commas.


    Note: here comma (,) is used as a separator.'
  merge: -1
  pgno: 228
- img_proc: true
  md: "```\nstudent@krosum~$ cat -n IP1\n1 root:bin:bash\n2 userA:usr:bin:ksh\n3 userB:bin:csh\n\
    ```\n\n```\nstudent@krosum~$ cut -c 2,5 IP1 # 2nd character and 5th character\n\
    o:\nsA\nsB\n```\n\n```\nstudent@krosum~$ cut -c 2-5 IP1 # 2nd chars to 5th chars\n\
    bot:\nserA\nserB\nstudent@krosum~$ $ \n```\n\nNote the difference between comma\
    \ (,) and hyphen (-) symbol in command where comma (,) is a separator and hyphen\
    \ (-) is a range.\n\n```\nstudent@krosum~$ cat -n IP1\n1 root:bin:bash\n2 userA:usr:bin:ksh\n\
    3 userB:bin:csh\n```\n\n```\nstudent@krosum~$ cut -c 1-3,6-8,10-13 IP1\nroobinbash\n\
    use:us:bin\nuse:bi:csh\nstudent@krosum~$ \n```\n\n![](img/39c8fbde7fc51cbef611f658dfbb1fe2_229_0.png)\n\
    \nNote in the above example, both (,) and (--) special characters are used and\
    \ from IP1 file we filtered multiple range of characters.\n\n1-3 means from 1st\
    \ to 3rd characters\n\n6-8 means from 6th to 8th characters\n\n10-13 means from\
    \ 10th to 13th characters\n\nUsing comma (,) we filtered different range of characters\
    \ from IP1.\n\nThe previous example cuts the columns from a file.\n\nBut if the\
