  md: "![](img/39c8fbde7fc51cbef611f658dfbb1fe2_172_0.png)\n\n# # Determining Permissions\n\
    \n+   * When a user attempts to access a file or directory, the UID of the user\
    \ is compared with the UID of the file or directory.\n* If the UIDs match, the\
    \ permission set for the owner determines whether the owner has access to the\
    \ file or directory.\n* If the UIDs do not match, the user's GID is compared with\
