  md: "# Terminating a Process\n\n+   - There might be times when we need to terminate\
    \ an unwanted process.\n\n+   - A process might have got into an endless loop,\
    \ or it might have hung.\n\n+   - We can kill or stop any process that we own.\n\
    \n+   - We can use the following two commands to terminate one or more processes:\n\
    \  - kill\n  - pkill\n\n+   - The kill and pkill commands send signals to processes\
    \ directing them to terminate.\n\n+   - Each signal has a number, name, and an\
    \ associated event.\n\nHowever, there are processes that should not be terminated,\
    \ such as the init process. Killing such processes can result in a system crash.\n\
    \n**Note:** A super-user can kill any process in the system."
  merge: -1
  pgno: 210
- img_proc: true
  md: '# # Terminating a Process: kill Command


    +   * We can terminate any process by issuing the appropriate signal to the process
    concerned.

    * The kill command sends a termination signal to one or more processes.


    **Note:** The kill command terminates only those processes that we own.


    The kill command sends *signal 15*, the terminate signal, by default. This signal
    causes the process to terminate in an orderly manner.


    All we need to know the PID of the *process before to terminate* it. We can use
    either the `psor pgrep`command to locate the PID of the process.


    Also, we can terminate several processes at the same time by entering multiple
    PIDs on a single command line.


    **Note:** The root user can use the kill command on any process.


    Other way of terminating a Process: using `kill`


    Use the kill command to terminate the mail process.


    ```

    [root@krosum Temp]# pgrep -l mail

    442 sendmail

    519 sendmail

    [root@krosum Temp]#

    [root@krosum Temp]# pgrep -l bash

    1195 bash

    [root@krosum Temp]#

    ```'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# Terminating a Process: pkkill Command


    Alternatively, we can use the pkkillcommand to send termination signal to processes.


    ```

    pkill[-options]pattern

    ```


    The pkillcommand requires us to specify the name instead of the PID of the process.'
  merge: -1
  pgno: 212
