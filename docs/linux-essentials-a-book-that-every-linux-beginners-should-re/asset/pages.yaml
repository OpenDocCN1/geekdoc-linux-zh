  md: "# Paste command\n\nThe paste command combines lines together. It gets its input\
    \ from two or more files.\n\n# Syntax\n\n```\npastefilename1 filename2 .. filename\n\
    [student@krosum ~]$ cat -n p1.log [student@krosum ~]$ cat -n p2.log\n  1 data1\
    \                 1 DATA1\n  2 data2                 2 DATA2\n  3 data3      \
    \           3\n  4                       4\n  5 data5                 5\n  6 \
    \                      6\n  7 data7                 7 DATA-END\n[student@krosum\
    \ ~]$ paste p1.log p2.log\ndata1                   DATA1\ndata2              \
    \     DATA2\ndata3\n\ndata5\n\ndata7                 DATA-END\n[student@krosum\
    \ ~]$ _\n```\n\nUsing pastecommand we can combine multiple files.\n\npaste command\
    \ treats each file as a column. If there are more than two files, the corresponding\
    \ lines from each file, separated by tabs, are written to the output stream. The\
    \ above input file p1.log file contains 7lines including 2 empty lines (line 4\
    \ and line 6). The input file p1.log p2.log file contains 7lines including 5 empty\
    \ lines. So when we combine p1.log and p2.log together, the input file p1.log\
    \ becomes 1st column and file p2.log becomes 2nd column.\n\nNote : the cat and\
    \ paste commands are similar for combining multiple files. However the cat command\
    \ combines files vertically ( by lines) whereas the paste command combines files\
    \ horizontally (by columns)."
