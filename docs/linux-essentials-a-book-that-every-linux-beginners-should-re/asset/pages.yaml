  md: '# Viewing Files


    There are several commands that display information about a file in the read-only
    format.


    The file-viewing commands include the following:


    +   - cat

    - more

    - tail

    - head

    - wc


    we have already discussed how to use cat command, recap command syntax: cat-option
    inputfile. The cat command displays the content of one or more files.


    # Viewing Files: more Command


    The more command displays the content of a text file one screen at a time.


    Syntax:-


    ```

    morefilename

    ```


    The --More--(n%) message appears at the bottom of each screen, where n% is the
    percentage of the file that has been displayed. When the entire file has been
    displayed, the shell prompt appears.


    When the --More--(n%)prompt appears at the bottom of the screen, we can use the
    keys described in the table to scroll through the file.


    | Keyboard | Action |

    | Spacebar | Moves forward one screen |

    | Return | Scrolls one line at a time |

    | B | Moves back one screen |

    | H | Displays a help menu of features |'
