  md: '# Kernel Exploration


    The Linux kernel is a modular designed kernel.


    At the architecture level, the Linux kernel interacts with the hardware, controls
    and schedules the access to resources (CPU, memory, storage, network and so on)
    behalf of the applications.


    Applications run in what is called the user space and a call is made to a stable
    set of system libraries to ask for kernel service.


    This modular designed kernel allows components of Linux to originate from different
    developers, each of which had their own specific design goals in mind.


    A modular design also means that the Linux kernel is independent of applications
    and interfaces.


    The result is that even when application crashes, all security vulnerabilities
    in applications tend to remain isolated, rather than affecting the system as a
    whole.


    In Linux, each component is configured separately, typically by using text-based
    configuration files.


    Reading and writing configuration information can be done by scripts or applications
    by using simple text parsing engines.


    No special application programming interface (API) is required to interface with
    the system configuration data.'
  merge: -1
