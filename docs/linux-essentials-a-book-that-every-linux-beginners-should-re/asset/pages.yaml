  md: '![](img/39c8fbde7fc51cbef611f658dfbb1fe2_201_0.png)


    # CHAPTER 13 - LINUX

    PROCESS


    As we discussed, Linux abstractions are file and process. We discussed what is
    file? What is Linux file structure? What are file types? and what are file manipulation
    commands?


    Now let''s discuss about process.


    A process,also known as a task, is the running form of a program. It means when
    the file enters the execution state, the execution instance of a file (or) program
    (or) command called process is created.


    In simpler form, the execution of a Linux command is called process.


    Whenever a new process is created, kernel will create a unique ID and this ID
    is called process ID (PID).


    +   - Processes have a parent/child relationship.

    - A process can spawn one or more children.'
  merge: -1
  pgno: 201
- img_proc: true
  md: '+   * Multiple processes can run in parallel.

    * Linux command line is an active process (Running process).


    Whenever a new command is executed on the command line, execution of new command
    is called that child process is created.


    By the time, the shell command line process will enter in to waiting state and
    once child execution is done. i.e., reached to exit state, the parent process
    (shell command line) will resume to the active (Running)state.'
  merge: -1
  pgno: 202
- img_proc: true
  md: "# Attributes of a Process\n\n+   * The kernel assigns a unique identification\
    \ number to each process called a process ID or **PID**.\n* The Kernel uses the\
    \ PID to track, control and manage the process.\n  * Each process is further associated\
    \ with a **UID** and a **GID**.\n* UIDs and GIDs indicate the process owner.\n\
    * Generally, the UID and GID values associated with a process are the same as\
    \ the UID and GID of the user who has started the process.\n\nA process consists\
    \ of an *address space* and a *metadata* object. The process space is related\
    \ to all the *memory and swap space* that a process consumes. The process metadata\
    \ is just an entry in the kernel's process table and stores all other information\
    \ about a process."
  merge: -1
  pgno: 203
- img_proc: true
  md: "# Process States\n\n+   - A process may be in any one of the following states:\n\
    \  - D:Uninterruptible sleep (usually IO)\n  - R:Running or runnable (on run queue)\n\
    \  - S:Interruptible sleep (waiting for an event to complete)\n  - T: Stopped,\
    \ either by a job control signal or because it is being traced\n  - Z:Defunct(\"\
    zombie\") process, terminated but not reaped by its parent\n\nThe process state\
    \ can be displayed using the ps command. For BSD formats and when the stat keyword\
    \ is used, additional state information is displayed such as the following:\n\n\
    +   - <:High-priority (not nice to other users)\n- N:Low-priority (nice to other\
    \ users)\n- L:Has pages locked into memory (for real time and custom IO)\n- s:\
    \ Is a session leader\n- I:Is multithreaded\n-+: Is in the foreground process\
    \ group\n\nNote: nice is a useful program that is used to lower or increase the\
    \ scheduling priority of a process or batch processes. Users can assign nice values\
    \ between 0 (no effect) and 19(greatest effect). The higher the nice value, the\
    \ lower the scheduling priority."
  merge: -1
  pgno: 204
- img_proc: true
  md: "# Process Subsystems\n\nEach time we boot a system, execute a command, or start\
    \ an application, the system activates one or more processes.\n\n+   A process\
    \ as it runs the resources of the various subsystems:\n  * Disk I/O\n  * Network\n\
    \  * Memory\n  * CPU\n\nA process, as it runs, uses the resources of the various\
    \ subsystems:\n\n> **The disk I/O subsystem**:Controls disk utilization and resourcing\
    \ as well as file system performance.\n\n> **The network subsystem**:Controls\
    \ the throughput and directional flow of data between systems over a network connection.\n\
    \n> **The memory subsystem**:Controls the utilization and allocation of physical,\
    \ virtual, and shared memory.\n\n> **The CPU subsystem**:Controls CPU resources,\
    \ loading, and scheduling.\n\nIf not monitored and controlled, processes can consume\
    \ our system resources, causing the system to run slowly and in some cases even\
    \ halt. The Linux kernel collects performance-relevant statistics on each of these\
    \ subsystems, to include process information. We can view and use this information\
    \ to assess the impact that the processes have on the subsystem resources."
  merge: -1
  pgno: 205
- img_proc: true
  md: '# Listing System Processes


    +   * The process status (ps) command lists the processes that are associated
    with the shell.

    * For each process, the pscommand displays the PID, the terminal identifier (TTY),
    the cumulative execution time (TIME), and the command name (CMD).

    * For example, to list the currently running processes on the system using the
    ps command.


    ```

    root@krosum Temp]# ps

    PID TTY TIME CMD

    1195 pts/0 00:00:00 bash

    25269 pts/0 00:00:00 ps

    root@krosum Temp]#

    ```


    The ps command has several options that you can use to display additional process
    information.


    +   * -a: Prints information about all processes most frequently requested, except
    process group leaders and processes not associated with a terminal.

    * -e: Prints information about all the processes that currently running.

    * -f:Generates a full listing.

    * -l: Generates a long listing

    * -o format: Writes information according to the format specification given in
    a format.


    Examples required for -o option:'
  merge: -1
  pgno: 206
