    # Linux Command


    Linux is command based operating system. The basis of all Linux interaction is
    the command.

    Linux commands are binary files, it''s placed on /bin(or) /usr/bin/directory.
    Recap file structures discussed in previous topics.


    +   * All the Linux Commands are single line entered at a console.

    * A Linux Command is an action request given to the shell for execution.

    * Linux commands are entered at the command line prompt. Command line prompt is
    known as shell prompt.


    Recap shell definition that shell is an interpreter; all the user input commands
    are interpreted by shell.


    ```

    root@krosum~# this is shell command line prompt

    ```


    Every command execution displays some result to monitor. This result can be either
    STDOUT or STDERR.


    STDOUT - when a program needs to print output, it normally prints to "standard
    out".

    STDERR - when a program needs to print error information, it normally prints to
    "standard error".

    STDOUT, STDERR -Both are associated with monitor.


    Although we do not need to worry about how the command does its job, we must understand
    exactly what it does. We must know where to find the input and where we want the
    output to be placed.


    In general input comes from keyboard (STDIN) and the output is'
