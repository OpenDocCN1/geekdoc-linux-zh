    \n| UID PID PPID | STIME TTY TIME CMD |\n| :--- | :--- | :--- | :--- | :--- |\
    \ :--- | :--- | :--- |\n| Root | 216 | 1 | Oct 23 | ? | 0:18 | /usr/lib/power/powerd\
    \ |\n\n![](img/39c8fbde7fc51cbef611f658dfbb1fe2_208_0.png)\n![](img/39c8fbde7fc51cbef611f658dfbb1fe2_208_1.png)\n\
    ![](img/39c8fbde7fc51cbef611f658dfbb1fe2_208_2.png)\n![](img/39c8fbde7fc51cbef611f658dfbb1fe2_208_3.png)\n\
    \n截图中的图解释了 `ps -ef` 命令的输出。\n\n- 第一列是 UID，进程所有者的用户名。\n- 第二列是 PID，进程的唯一标识号。\n- 第三列是\
    \ PPID，进程的父进程标识号。\n- 第四列是 STIME，进程启动的时间。\n- 第五列是 TTY，进程的控制终端。注意，系统进程（守护进程）显示问号（?）。\n\
    - 第六列是 TIME，进程的累计执行时间。\n- 第七列是 CMD，命令名、选项和参数。\n\n# 终止进程\n\n- 有时我们可能需要终止一个不需要的进程。\n\
    - 进程可能进入了死循环，或者可能挂起了。\n- 我们可以杀死或停止任何我们拥有的进程。\n- 我们可以使用以下两个命令来终止一个或多个进程：\n  - kill\n\
    \  - pkill\n\n- `kill` 和 `pkill` 命令向进程发送信号，引导它们终止。\n- 每个信号都有一个数字、名称和一个相关的事件。\n\
    \n然而，某些进程是不应该被终止的，例如 `init` 进程。杀死此类进程可能导致系统崩溃。\n\n**注意：** 超级用户可以杀死系统的任何进程。\n\n\
    ## 终止进程：kill 命令\n\n- 我们可以通过向相关进程发送适当的信号来终止任何进程。\n- `kill` 命令向一个或多个进程发送终止信号。\n\n\
    **注意：** `kill` 命令只终止我们拥有的进程。\n\n`kill` 命令默认发送*信号 15*，即终止信号（SIGTERM）。该信号会导致进程以有序的方式终止。\n\
    \n我们只需要知道*待终止进程*的 PID。我们可以使用 `ps` 或 `pgrep` 命令来定位进程的 PID。\n\n此外，我们还可以通过在单条命令行上输入多个\
    \ PID 来同时终止几个进程。\n\n**注意：** root 用户可以使用 `kill` 命令处理任何进程。\n\n终止进程的另一种方法：使用 `kill`\n\
    \n使用 `kill` 命令终止 mail 邮件进程。\n\n```\n[root@krosum Temp]# pgrep -l mail\n442 sendmail\n\
    519 sendmail\n[root@krosum Temp]#\n[root@krosum Temp]# pgrep -l bash\n1195 bash\n\
    [root@krosum Temp]#\n```\n\n## 终止进程：pkill 命令\n\n另一种方法，我们可以使用 `pkill` 命令向进程发送终止信号。\n\
    \n```\npkill [-options]pattern\n```\n\n`pkill` 命令要求我们指定进程的名字而不是 PID。\n\n## 强制终止进程：\n\
    \n```\nroot@krosum Temp# kill -l\n1) SIGHUP 2) SIGINT 3) SIGQUIT 4) SIGILL 5)\
    \ SIGTRAP\n6) SIGABRT 7) SIGBUS 8) SIGFPE 9) SIGKILL 10) SIGUSR1\n11) SIGSEV 12)\
    \ SIGUSR2 13) SIGURG 14) SIGALRM 15) SIGTERM\n16) SIGFLRT 17) SIGUSR 18) SIGSTOP\
    \ 19) SIGPWR 20) SIGFSZ\n21) SIGTTIN 22) SIGTOU 23) SIGURG 24) SIGCPU 25) SIGFZP\n\
    26) SIGVTAL 27) SIGROOP 28) SIGWINCH 29) SIGIO 30) SIGWHR\n31) SIGSYS 32) SIGMAX\
    \ 33) SIGMIN+1 34) SIGTRMIN+2 35) SIGTRMIN+3\n36) SIGTRMIN+4 37) SIGTRMIN+5 38)\
    \ SIGTRMIN+6 39) SIGTRMIN+7 40) SIGTRMIN+8\n41) SIGTRMIN+9 42) SIGTRMIN+10 43)\
    \ SIGTRMIN+11 44) SIGTRMIN+12 45) SIGTRMIN+13\n46) SIGTRMIN+14 47) SIGTRMIN+15\
    \ 48) SIGMAX-16 49) SIGMAX-17 50) SIGMAX-18 51) SIGMAX-19\n52) SIGMAX-20 53) SIGMAX-21\
    \ 54) SIGMAX-22 55) SIGMAX-23 56) SIGMAX-24 57) SIGMAX-25\n58) SIGMAX-26 59) SIGMAX-27\
    \ 60) SIGMAX-28 61) SIGMAX-29 62) SIGMAX-30\n63) SIGMAX-31 64) SIGMAX\nroot@krosum\
    \ Temp#\n```\n\n某些进程忽略默认信号 15。如果进程对信号 15 没有响应，你可以使用 `kill -9` 或 `pkill` 强制终止它。\n\
    \n```\nroot@krosum Temp# ps\nPID TTY TIME\n1195 pts/0 00:00:00 bash\n25312 pts/0\
    \ 00:00:00 python\n25314 pts/0 00:00:00 ps\nroot@krosum Temp# To kill a process\n\
    root@krosum Temp]# kill -9 25312\nKilled\nroot@krosum Temp]# ps\nPID TTY TIME\n\
    1195 pts/0 00:00:00 bash\n25315 pts/0 00:00:00 ps\nroot@krosum Temp]# ps\nPID\
    \ TTY TIME\n1195 pts/0 00:00:00 bash\n25316 pts/0 00:00:00 python\n25320 pts/0\
    \ 00:00:00 ps\nroot@krosum Temp]# pkill -9 python\nKilled\nroot@krosum Temp]#\
    \ ps\nPID TTY TIME\n1195 pts/0 00:00:00 bash\n25322 pts/0 00:00:00 ps\n```\n\n\
    **注意：** 发送信号 15 不一定能优雅地终止进程。如果信号被进程捕获，它会清理并退出；如果没有，它会直接死亡。\n\n## 注意\n\n只有在必要时才使用\
    \ **kill -9 命令**。当对活动进程或更新数据库的进程使用信号 9 时，可能会数据损坏。\n\n## 执行基础进程控制\n\n进程控制块 (PCB)\
    \ 或任务控制块是一个结构，包含了进程寄存器、状态、程序计数器、优先级、内存限制、打开的文件列表等信息。在 Linux 中，该表逻辑上包含了系统中所有当前进程的\
    \ PCB。\n\n```\n[root@krosum Temp]# Listing Current Process:\nroot@krosum Temp]#\
    \ ----------------------------\nroot@krosum Temp]# ps\nPID TTY             TIME\
    \ CMD\n1195 pts/0      00:00:00 bash\n25339 pts/0      00:00:00 ps\nroot@krosum\
    \ Temp]#\n```\n\n本练习涵盖以下主题：\n\n1. 显示当前进程\n\n2. 显示所有进程列表\n\n```\n[root@krosum Temp]#\
    \ ps -e\nPID TTY      TIME CMD\n1 ?         00:00:01 systemd\n2 ?         00:00:00\
    \ kthreadadd\n3 ?         00:00:00 ksoftirqd/0\n5 ?         00:00:00 kworker/0:OH\n\
    6 ?         00:00:00 kworker/u:0\n7 ?         00:00:00 kworker/u:OH\n8 ?     \
    \    00:00:00 migration/0\n9 ?         00:00:00 rcu_bh\n10 ?         00:00:00\
    \ rcu_sched\n11 ?         00:00:00 watchdog/0\n12 ?         00:00:00 khelper\n\
    13 ?         00:00:00 kdevtmpfs\n14 ?         00:00:00 netns\n15 ?         00:00:00\
    \ bdi-default\n16 ?         00:00:00 kintegrityd\n17 ?         00:00:00 ata_sff\n\
    ```\n\n| USER | PID | %CPU | %MEM | VSZ | RSS | TTY | STAT TIME | COMMAND |\n\
    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| root | 1 |\
    \ 0.0 | 0.4 | 7964 | 5116 | ? | S | 12:46:01 | /usr/lib/systemd/systemd |\n| root\
