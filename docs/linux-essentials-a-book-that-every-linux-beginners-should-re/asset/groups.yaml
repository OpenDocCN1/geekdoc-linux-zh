    \ for the file/directory.\n\n| OCTAL VALUE | PERMISSION |\n|---|---|\n| 4 | Read\
    \ |\n| 2 | Write |\n| 1 | Execute |\n\n- The above image shows the octal number\
    \ corresponding to permission.\n- For each permission set, these numbers are combined\
    \ to form a single number.\n\n| OCTAL VALUE | PERMISSION | BINARY |\n|---|---|---|\n\
    | 7 | rwx | 111(4+2+1) |\n| 6 | rw- | 110(4+2+0) |\n| 5 | r-x | 101(4+0+1) |\n\
    | 4 | r-- | 100(4+0+0) |\n| 3 | -wx | 011(0+2+1) |\n| 2 | -w- | 010(0+2+0) |\n\
    | 1 | --x | 001(0+0+1) |\n| 0 | --- | 000(0+0+0) |\n\n## Changing Permissions:\
    \ Octal Mode\n\n- The table shows the octal numbers that represent a combined\
    \ set of permissions.\n- We can modify the permissions for each category of the\
    \ users by combining the octal numbers.\n- The first set of octal number defines\
    \ owner permissions, the second set defines group permissions, and the third defines\
    \ other permissions.\n\n| OCTAL MODE | PERMISSION |\n|---|---|\n| 644 | rw-r--r--\
    \ |\n| 751 | rwxr-x--x |\n| 775 | rwxrxr-x |\n| 777 | rwxrwxrwx |\n\n```\nstudent@krosum~$\
    \ ls -l pl.txt\n-rw-r--. 1 student 47 Mar 20 20:59 pl.txt\nstudent@krosum~$ chmod\
    \ 755 pl.txt\nstudent@krosum~\nstudent@krosum~$ ls -l pl.txt\n-rwxr-xr-x 1 student\
    \ 47 Mar 20 20:59 pl.txt\n```\n\n- The first character represents the UID of the\
    \ owner.\n- The fifth character represents the GID of the group.\n- The sixth\
    \ set represents the size.\n- The seventh set of characters represents the time\
    \ and date of the file or directory that was last modified.\n- The last set of\
    \ characters represents the name of the file or directory.\n\n## CHAPTER 12 -\
    \ THE UMASK COMMAND\n\n- When files and directories are created, initial permissions\
    \ are automatically assigned.\n- The initial permission for a file is 666 (rw-rw-)\
    \ and it is 777 (rwxrwx) for a directory.\n- The user mask affects the default\
    \ permissions for files and directories.\n- We can set the user mask by umask\
    \ in a user file.\n- To view the umask value, run the umask command.\n\n```\n\
    student@krosum~$ umask\nroot@krosum]# umask\n002 022\n```\n\n**Note:**\n\n- The\
    \ default umask value for non-root user is 002.\n- The default umask value for\
    \ root user is 022.\n- The umask utility affects the initial permissions for files\
    \ and directories.\n- The umask utility is a three-digit octal value that is associated\
    \ with the read, write and execute permissions.\n- The first digit determines\
    \ the default permissions for the owner, the second digit determines the default\
    \ permissions for the group and the third digit determines the default permissions\
    \ for other.\n- For example, to set the default file permissions in a user file\
