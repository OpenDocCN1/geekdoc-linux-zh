    8206 pts/0 00:00:01 bash

    9784 pts/0 00:00:00 ps

    student@krosum ~]$

    ```


    +   When you use a single greater-than (>) meta-character and if the file already
    exists, the command overwrites the original contents of the file whereas when
    you use double greater-than (>>) characters, the command appends the output to
