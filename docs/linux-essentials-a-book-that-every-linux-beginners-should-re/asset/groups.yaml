  - "[PAGE 262]\n\n# tr command\n\nThe tr (translate) command replaces each character\
    \ in a first set of characters with a corresponding character in the second specified\
    \ set. Each set is specified as a string.\n\nThe first character in the first\
    \ set is replaced by the first character in the second set, the second character\
    \ in the first set is replaced by the second character in the second set,and so\
    \ forth until all matching characters have been replaced.\n\nSyntax :\n\n```\n\
    tr option oldstring newstring\n```\n\n```\n-delete characters\n```\n\n```\n-squeeze\
    \ duplicates\n```\n\n```\n-cplement set\n```\n\nTranslate its input from standard\
    \ input and writes its output to standard output.\n\n```\n[student@krosum ~]$\
    \ tr 'abc' 'ABC'\ntest line abc code\ntest line ABC Code\nabcdcode\nABcdCode\n\
    [student@krosum ~]$ \n```\n\nIf no options are specified, the text is matched\
    \ against the oldstring set, and any matching characters are replaced with the\
    \ corresponding characters in the newstring set. Unmatched characters are unchanged.\n\
    \nrange of characters are denoted by – symbol. For example a-z means match all\
    \ lowercase characters."
