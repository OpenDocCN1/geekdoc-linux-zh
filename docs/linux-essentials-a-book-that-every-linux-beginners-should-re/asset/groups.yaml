    \ 11:11:04 PM） |\n| %R | 24 小时制的小分；等同于 %H:%M:%S |\n| %s | 自 1970-01-01 00:00:00\
    \ 以来的秒数 |\n| %S | 秒（00..60） |\n| %t | 制表符 |\n| %T | 时间；等同于 %H:%M:%S |\n| %u |\
    \ 星期（1..7）；1 是星期一 |\n| %U | 以星期日为第一天的周数（00..53） |\n| %V | ISO 周，以星期一为第一天（01..53）\
    \ |\n| %w | 星期（0..6）；0 是星期日 |\n| %x | 区域的日期表示 |\n| %X | 区域的时间表示 |\n| %Y | 四位年份\
