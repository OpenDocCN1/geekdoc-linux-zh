    # LINUX ESSENTIALS


    A BOOK THAT EVERY LINUX BEGINNER SHOULD READ


    ![](img/39c8fbde7fc51cbef611f658dfbb1fe2_0_1.png)


    PALANI KARTHIKEYAN


    www.krosum.com


    # CONTENTS


    - Preface

    - Dedication

    - Acknowledgement

    - CHAPTER 1 - Linux Introduction

    - CHAPTER 2 - Linux Boot Process

    - CHAPTER 3 - About Shell

    - CHAPTER 4 - File structure

    - CHAPTER 5 - Common Linux commands

    - CHAPTER 6 - Linux Command line structure

    - CHAPTER 7 - The vi editor

    - CHAPTER 8 - Displaying the Directory Content

    - CHAPTER 9 - Regular file manipulation commands

    - CHAPTER 10 - Shell meta-character

    - CHAPTER 11 - File Permission

    - CHAPTER 12 - The umask Command

    - CHAPTER 13 - Linux Process

    - CHAPTER 14 - Filters

    - About the Author


    # PREFACE


    During my college days, as a young aspiring graduate from computer science department,
    I used to practice certain programming languages, all on the top of either UNIX
    or Linux.


    At that time my focus was fully on languages and I never wanted to see how my
    code runs or even who works it. Later, when I joined an organization all my applications
    written in fabulous languages stared at me for automation. It triggered me to
    work on a few command line tasks. Though I am good in C and C++, I found it a
    bit difficult to write shell scripts especially for searching and filtering kind
    of task.


    Then I realized the fact that Linux Commands are the core part of Shell scripts
    and that it is impossible to write an optimized automation code without knowledge.
    That is where I started learning Linux system programming, followed by shell,
    Perl, python and ruby, all on the top of Linux.


    Now with my experience as a corporate trainer for above 16+ years I wanted to
    share my knowledge on Linux Commands in a book. This Book will give you a clear
    start on Linux and you can keep up with further steps in learning sed, awk and
    bash scripts to enhance your career.


    If you are a beginner or if you want to master the fundamentals of Linux, this
    book is for YOU.


    # DEDICATION


    To my beloved **LORD**


    # ACKNOWLEDGEMENT


    My heartfelt gratitude to my uncle Mr.Rajaram for his dedicated support to complete
    this book.


    My sincere thanks to Mr.Aravind, Mr.JohnPaul, Mr.Kamal, Mr.Yuvraj and Mr.Richard
    for the able support and acknowledgement given for the perfection of this book.


    My Love and gratitude to my beloved wife Theeba Karthikeyan for her motivation,
    effort and encouragement for this book.


    ![](img/39c8fbde7fc51cbef611f658dfbb1fe2_6_0.png)


    # CHAPTER 1 - LINUX INTRODUCTION


    ## What is Linux?


    Linux is an operating system developed by Linus Torvalds in the year 1991.


    Generally operating system is defined as a program, an interface between user
    applications to the hardware. This Operating system is responsible to connect
    system resources to the user. So which part of OS does this task? The Kernel,
    the core component of operating system does this task.


    Whenever a system starts, once the boot loader stage is done successfully, the
    Kernel is the first program that is loaded. If boot loader gets failed, then kernel
    loading is also also failed and hence we have to troubleshoot the boot loader
    issues. Only then the kernel will be loaded.


    Once kernel is loaded, it remains in the memory until the Operating System shut-downs
    because the Kernel should handle the rest of the thing of the system for the Operating
    System. We will discuss about boot loader sequence in our following topics.


    # GNU Project


    GNU/Linux – (GNUs Not UNIX ) is a term promoted by the Free Software Foundation
    (FSF) and it is founded by Richard Stallman.


    This project had begun in 1984 to develop a free operating system.


    The motto of the project was to develop a free Unix-Compatible operating system.
    The Linux kernel was added in 1992, achieving the GNU Project''s goal of developing
    a free operating system.


    # GPL


    Linux and GNU software are distributed under the terms of the GNU General Public
    License (GPL, www.gnu.org/licenses/licenses.html).


    The GPL says we have the right to copy, modify, and redistribute the code covered
    by the agreement.


    The GPL provides some basic software freedoms:


    - To use the software for any purpose

    - To share the software

    - To change the software to suit your needs

    - To share the changes that you make.


    # Why do we use Linux?


    Linux has evolved into one of the most promising platform in today’s world.


    Linux is also distributed as an open source.


    Here we have two terms- Open Source and Distributed. Let’s see what these actually
    mean here.


    Open source follows these key features:


    - The freedom to run the program, for any purpose.

    - The freedom to study how the program works, and change it in order to make it
    do what you wish.

    - The freedom to redistribute copies so you can help your neighbor.

    - The freedom to distribute copies of your modified versions to others.


    ## What is distribution?


    A Linux distribution is also referred to as distro. Actually, Linux isn’t a complete
    operating system — it’s just a kernel. Linux distributions take the Linux kernel
    and combine it with other free software to create complete packages like some
    proprietary software. There are many different Linux distributions available.


    ![](img/39c8fbde7fc51cbef611f658dfbb1fe2_9_0.png)


    If we want to “install Linux,” we need to choose a distribution. For example:
    Linux mint, Ubuntu, redhat, openSUSE etc.


    Some popular Linux distributions include:


    - Debian

    - Fedora

    - Mandriva Linux

    - OpenSUSE

    - Gentoo

    - Slackware


    Each distribution has a different take on the desktop, the software package management
    repository and the software package management utility commands.


    For example, to install or update a package in RHL (Red-Hat Linux) distribution,
    we use the following command: `yum install <package name>`


    Ex 1: To install Python3 in RHL based distribution,


    ```

    yum install python3

    ```


    If we want to install the same package in Debian distribution Linux, we can use
    `apt-get install <packagename>` command


    Ex 2: To install Python3 in Debian based distribution,


    ```

    apt-get install python3

    ```


    Note that, in both the examples, package name is python3 and working kernel is
    Linux but distributors are different. The Complete Linux OS means the combination
    of Linux kernel and distribution utilities.


    Hope you now understand that the Linux distributions differ by its distribution
    utilities. Now let''s see what this Linux Kernel is.


    # Linux Kernel


    Operating system (OS) is a theoretical term,


    ```

    root@krosumlabs:~ # uname # Working kernel

    Linux

    root@krosumlabs:~ # uname -r # Version

    3.13.0-170-generic

    root@krosumlabs:~ # cat /etc/issue # distribution

    Ubuntu 14.04.6 LTS # \

    root@krosumlabs:~ # # install any package

    root@krosumlabs:~ # apt-get install python3

    root@krosumlabs:~ #

    ```


    ![](img/39c8fbde7fc51cbef611f658dfbb1fe2_12_0.png)


    ```

    root@krosumlabs:~ # uname # Working kernel

    Linux

    root@krosumlabs:~ # uname -r # Version

    4.12.0-94.el7.x86_64

    root@krosumlabs:~ # cat /etc/os-release # distribution

    Oracle Linux Server release 7.4

    root@krosumlabs:~ # # install any package

    root@krosumlabs:~ # yum install python3

    root@krosumlabs:~ #

    ```


    Kernel is an implementation structured program; the kernel also has control over
    everything in the system.


    Note that in the above snap, uname is a command to display our working kernel
    name. Both the above pictures show terminal display of Linux but just compare
    its distribution- Left snap shows Ubuntu. The other one is oracle Linux in RHL
    standard distribution.


    In Ubuntu software package management, command line utility is called apt-get
    whereas in RHL based Linux package management is yum. Thus both Linux will install
    python3 in their own way.


    My Ubuntu version is 14.04.6 (which is the distribution version and not kernel
    version) whereas my Oracle Linux version is 7.4.


    In both the OS, to get working kernel name, type uname and uname -r commands in
    command line. This helps us to know which distribution of Linux we are using.
    To get distribution details, read configuration file /etc/redhat-release, /etc/fedora-release
    and for Debian distribution: linux /etc/issue file.


    So now we are clear with Linux terms such as kernel, distribution etc. We will
    discuss Linux commands and other details in command topics.

