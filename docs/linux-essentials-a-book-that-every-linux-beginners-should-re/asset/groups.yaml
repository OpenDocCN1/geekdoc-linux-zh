- md: "\n## Asterisk (*) Character\n\n- The asterisk (*) character is also called\
    \ the wildcard character and represents zero or more characters, except the leading\
    \ period (.) of a hidden file.\n\n- For example, in order to list all files and\
    \ directories that start with the letter p followed by zero or more characters\
    \ and to list all files and directories that end with the .log, preceded by zero\
    \ or more characters, refer to following snap.\n\n```\nstudent@krosum ~$ ls\n\
    ab.log D2 Documents F2.txt IP2 pl1.c process Templates\nab.sh Demo Downloads F3.txt\
    \ Music pl1.txt process.log typescript\nchatat Desktop emp.csv IP names1.txt p2.c\
    \ ptr.txt Videos\nd1 digits Fl1.txt IP1 names.txt Pictures Public\n[student@krosum\
    \ ~]$ ls p*\n[student@krosum ~]$\npl1.c pl.txt p2.c process.log ptr.txt\n[student@krosum\
    \ ~]$ ls -l *.log\n-rw-rw-r--. 1 student student 107 Mar 23 18:32 ab.log\n-rw-rw-r--.\
    \ 1 student 84 Mar 20 18:31 process.log\n[student@krosum ~]$ \n```\n\n## Question\
    \ Mark (?) Character\n\n- The question mark (?) character is also called a wildcard\
    \ character that represents any single character.\n\n```\n$student@krosum-$ ls\n\
    ab.c D2 Documents F2.txt IP2 pl.c process Templates\nab.log Demo Downloads F3.txt\
    \ Music pl1.txt process.log typescript\nschat Desktop emp.csv IP names1.txt p2.c\
    \ ptr.txt Videos\nd1 digits Fl1.txt IP1 names.txt Pictures Public\n$student@krosum-$\
    \ ls ?.c filename contains any two chars\nab.c pl1.c p2.c\n$student@krosum-$ ls\
    \ ?*.c filename starts with p followed by any single character\n$student@krosum-$\
    \ ls ls\n```\n\nFor example, to list all files and directories where each name\
    \ contains exactly two characters that end with extension .c.\n\n```\n$student@krosum-$\
    \ ls\nab.c D2 Documents F2.txt IP2 pl.c process Templates\nab.log Demo Downloads\
    \ F3.txt Music pl1.txt process.log typescript\nschat Desktop emp.csv IP names1.txt\
    \ p2.c ptr.txt Videos\nd1 digits Fl1.txt IP1 names.txt Pictures Public\n$student@krosum-$\
    \ ls\n$student@krosum-$ ls ???\nIP1 IP2 list a file name which contains any 3\
    \ chr\n$student@krosum-$ ls ????\nlist a file name which contains any 4 characters\
    \ (including .character)\nab.c chat pl1.c p2.c\n```\n\n```\nDemo:\n$student@krosum-$\
    \ ls test??\nls: cannot access test?? No such file or directory\n$student@krosum-$\n\
    ```\n\nNote: If no file matches with an entry using the question mark (?) character,\
    \ an error message appears.\n\n## Square Bracket ([]) Characters\n\n- The square\
    \ bracket ([]) characters represent a set or range of characters for a single\
    \ character position.\n- A set of characters is any number of specific characters,\
    \ for example, [acb].\n- The characters in the set do not necessarily have to\
    \ be in any order. For example, [abc] is the same as [cab]. Whereas a range of\
    \ characters is a series of ordered characters.\n- A range lists the first character\
    \ followed by a hyphen (-) and then the last character, for example, [a–z] or\
    \ [0–9].\n- When specifying a range, arrange the characters in the order that\
    \ you want to appear in the output. For example, use [A–Z] or [a-z] to search\
    \ for any uppercase or lowercase alphabetical characters, respectively.\n\n```\n\
    [root@krosum~# ls p[0-9].py] # file name p<followed by any single digit.py\np1.py\
    \ p2.py\n[root@krosum~#]\n[root@krosum~#] ls -l p[0-9].py # file name p<followed\
    \ by any single digit.py\n-rw-r--.1 root 29 May 25 7.2G 2019 p1.py\n-rw-r--.2\
    \ root 146 May 25 2019 p2.py\n[root@krosum~#]\n[root@krosum~#] df -Th | grep \"\
    /dev/sda[1-4]\" Filter only the storage device of mounted file system\n/dev/sda2\
    \ 9.8G 2.6G 7.2G 27% /\n/dev/sda1 ext4 488M 73M 390M 16% /boot\n[root@krosum~#]\n\
    ```\n\n- Or ls p[abc].java # file name p<followed by character a or b or c> java\
    \ extension\n\n## The Brace Expansion\n\n- The brace {} expansion is a mechanism\
    \ by which arbitrary strings may be generated.\n- The preamble \"a\" is prefixed\
    \ to each string contained within the braces, and the postscript \"e\" is then\
    \ appended to each resulting string, expanding left to right.\n\n```\n[root@krosum\
    \ ~]# echo a{b,c,d}\nace ade abe\n```\n\n- The shell de-facto meta-characters\
    \ are specific characters that have meaning within the shell.\n\n| FILE DESCRIPTOR\
    \ | DESCRIPTION | ABVIATION |\n| :--- | :--- | :--- |\n| 0 | Standard input |\
    \ STDIN |\n| 1 | Standard output | STDOUT |\n| 2 | Standard error | STDERR |\n\
    \n- Output redirection sends the output from a command into a file instead of\
    \ printing it to the screen.\n"
