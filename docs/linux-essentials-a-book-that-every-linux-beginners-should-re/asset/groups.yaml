    The online man page entries are organized into sections based on the type or usage
    of the command or file.


    For example, Section 1 contains user commands, and Section 5 contains information
    about various file formats.


    To look up a specific section of the man page, use the man command with the -s
    option, followed by the section number, and the command or file name.


    ```

    man-s number command

    ```


    (or)


    ```

    man-s number filename

    ```'
