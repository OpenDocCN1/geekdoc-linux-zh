    # CHAPTER 3 - ABOUT SHELL


    ## What is shell?


    Shell is a **command line interpreter**.

    So what is an interpreter? Interpreter is a translator which translates our user
    instruction into an intermediate format.


    So here shell is **translating our user input (command) to kernel**.

    This means that all the Linux commands which we are typing in command line will
    be interpreted (translated) by shell into kernel understanding format. Then kernel
    will interact with hardware unit. So shell has **no connection with the hardware**.


    Hence we say Shell is an interface between user and kernel.


    ```

    root@krosumlabs:~\#

    ```


    # Primary prompt


    # Shell command line interface


    All the user inputs are typed on command line interface and this interface is
    called shell primary prompt (or) user interface prompt.


    Linux abstractions are FILE and PROCESS. The execution of command (or) interpretation
    of command is called a process and this process is created by user; so we can
    say that this is his user process.


    In Linux every process creates another process, that the newly created process
    is called child process and the creator process is called Parent process. This
    is termed as Linux process model.


    Here will interpret our user input command; so shell becomes the parent process
    and the newly created (execution of command result) process is called child process.


    Shell is a parent process of our running commands.


    ```

    root@krosumLabs:~\#

    root@krosumLabs:~\# uname

    Linux

    root@krosumLabs:~\#

    ```


    > Working shell (Parent)

    Execution of a command (Child) )


    The above snapshot shows the parent–child relationship. See the picture where
    the active (Running) shell primary prompt is marked in red, over which the command
    uname is present.


    Note the place where I am typing the command. On the top of the shell interface,
    the uname command is interpreted by the working shell. So shell is called the
    parent of uname command. Execution of a command becomes a process and here that
    process is called a child process to shell. Whenever child process is in active
    (running) state, parent process will be in waiting state. Once child execution
    is done, child process will reach to exit state and the parent process will resume
    from waiting state to running state.


    # Types of shell


    - 1. Bourne Shell (SH)

    2. KornShell(KSH)

    3. BourneAgainShell(BASH)

    4. C shell(CSH)

    5. TurboCshell(TCSH) - Tcsh is enhanced C shell

    6. ZSH


    # How to find current working shell?


    - 1. Type the following special variable in command line

    echo $ will display current working shell name.


    ```

    [student@krosum ~]$ echo $

    bash

    [student@krosum ~]$ ps

    PID TTY TIME CMD

    8206 pts/0 00:00:00 bash

    8982 pts/0 00:00:00 ps

    [student@krosum ~]$

    ```


    - 2. Another way is to use ps command.


    We will discuss about ps command and command attributes in next chapter.


    Do you know how shell is initialized?


    Recap our system boot process. Once POST is done successfully, BIOS will execute
    MBR(Master Boot Record). Then MBR will execute boot loader and the boot loader
    executes the kernel. Then kernel will pass the control to process (init or systemD).
    Now see the process execution where init or systemD will be responsible to start
    all our Linux services (system process) and these services are called daemon process,
    which are not created by user. It is all created by systemD or init. Type pstree
    command in Linux command line to see the process creation hierarchy.


    One of the daemons, called getty(get teletype terminal) is our login screen interface.
    Once login is done successfully, shell will be started.


    So shell is created by getty. If login credentials are invalid, getty won''t execute
    shell.


    Now in user perspective, let''s have a look in our graphical desktop system. Once
    we switch on the PC, both boot process and kernel execution all are done automatically
    and we get our login window.


    Once login (user name and password) is success, desktop will open. Desktop is
    a graphical user interface (GUI) and on the top of the desktop, all our applications
    (user process) will start. Similarly once Linux command line interface (CLI) will
    get initialized. So on the top of the shell; we will execute our Linux commands
    (user process). Hope now you have answers for the following questions - what is
    shell? How is shell started? Who is the parent of shell? Who is the child of shell?


    Once login is done successfully shell will get started but internally shell will
    read and execute /etc/profile file. This shell script file which is located under
    /etc/configuration directory. The /etc/profile, referred as system profile file
    contains all global setting parameters like permission, umask, user ID etc.,


    ![](img/39c8fbde7fc51cbef611f658dfbb1fe2_40_0.png)


    # Shell start up process


    This system file (etc/profile) provides personal profile file (~/.profile), ~/.bashrc
    that contains commands that are used to customize the startup shell. It is an
    optional file that runs immediately after the system profile. This ~/.profile
    and ~/.bashrc files are called as user file. If you want to make any changes in
    personal login environment use personal profile file.


    The shell also provides environment for user to execute commands that can be customized
    using initialization files (or) personal profile files.


    These files contain settings for user environment characteristics, such as:


    - Create alias of commands

    - Search paths for finding commands.

    - Default permissions on new files.

    - Exporting Values for variables that other programs use.


    ![](img/39c8fbde7fc51cbef611f658dfbb1fe2_42_0.png)


