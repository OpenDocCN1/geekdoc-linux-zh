    ## File structure


    **Linux File structure** is tree structure (hierarchical structure). All the files
    will map from root directory (/). There is a chance to get confused between login
    root and root directory. Both login root (/root) and the root directory (/) are
    not same.


    Linux / symbol is called root directory this is like MyComputer in other operating
    system.


    / is the entry point to map any files in Linux.


    In Linux, however, the root of the file system doesn''t correspond with any physical
    device. It is a logical location simply denoted as “/”.


    In Linux everything is a file/process. It means that all peripherals devices attached
    with system are considered as a file. Example, consider the hard drive. Hard disk
    is a storage device. Once it is mounted to the kernel, the kernel will treat them
    as a file. Such a file is called *device file* represented as `/dev/sda`(device
    file).


    Linux uses a hierarchical file system structure, much like an upside-down tree,
    with root (/) at the top of the file system and all other directories spreading
    from the root(/). The root (/) is the parent directory and all other directories
    becomes its sub directories.


    Once logged in, the current working directory can be found through `pwd` command.


    ```

