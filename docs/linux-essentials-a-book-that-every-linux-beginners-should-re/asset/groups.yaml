- md: "\nArguments (i.e. month, year) are still optional. If there is no argument,\
    \ the calendar for current month is displayed.\n\n![](img/39c8fbde7fc51cbef611f658dfbb1fe2_67_0.png)\n\
    \n```\n[student@rosum ~]$ cal 2020\n```\n\nIf only one argument is entered, it\
    \ is assumed to be a year and not month. Hence the calendar for the year is displayed.\n\
    \n## Fig.cal command with 1 argument as year\n\nIf both month and year are entered,\
    \ then just one of them particular year is displayed. Note: The arguments are\
    \ separated with whitespace.\n\n## 3. Who command\n\nThe who command displays\
    \ all the users currently logged into the system.\n\nSyntax:-\n\n```\n[student@krosum\
    \ ~]$ who\nstudent tty1 2020-03-19 20:22 (::0)\nstudent pts/0 2020-03-24 13:45\
    \ (:0.0)\nstudent pts/1 2020-03-24 14:47 (:0.0)\n[student@krosum ~]$\n```\n\n\
    The who command returns the user's name (ID), corresponding terminal and time\
    \ he/she logged in.\n\n### with option -u\n\n```\n[student@krosum ~]$ who -u\n\
    student tty1 2020-03-19 20:22 old 882 (::0)\nstudent pts/0 2020-03-24 13:45 .\
    \ 8202 (:0.0)\nstudent pts/1 2020-03-24 14:47 00:24 8202 (:0.0)\n[student@krosum\
    \ ~]$\n```\n\nTo display the duration how long the system was idle (idle time),\
    \ -u option is used.\n\n### with option -H\n\nThis option is used to get header\
    \ information.\n\n```\n$student@krosum-$ who -H\nNAME LINE TIME COMMENT\nstudent\
    \ tty1 2020-03-19 20:22 (:0)\nstudent pts/0 2020-03-24 13:45 (::0)\nstudent pts/1\
    \ 2020-03-24 14:47 (:0.0)\n```\n\n## Who am i\n\n```\n$student@krosum-$ who am\
    \ i\nstudent pts/0 2020-03-24 13:45 (:0.0)\n```\n\nIf you want to display only\
    \ your individual system information, enter who am i. (note the space entered\
    \ between each word).\n\n## Whoami\n\n- The whoami command returns the user ID(Login\
    \ name).\n- If you logged in as root user, whoami displays root.\n- If you logged\
    \ in as Student user, whoami displays student.\n\nThis is equivalent to the result\
    \ of the following command:\n\n```\n$student@krosum-$ whoami\nstudent\n$student@krosum-$\
    \ id -un\nstudent\n$student@krosum-$ id -u\nstudent\n1000\n$student@krosum-$ \n\
    ```\n\nid -un\n\n-u displays only the login ID(Integer). This is always zero(0)\
    \ for root user.\n\n## 4. System name (uname) command\n\nThe uname utility is\
    \ most commonly used to determine the processor architecture, the system hostname\
    \ and the version of the kernel running on the system.\n\nSyntax:- uname--option\n\
    \n| Option | Description |\n|---|---|\n| -r(kernel release) | Prints the kernel\
    \ release |\n| -v | Prints the kernel version |\n| -m | Prints the name of the\
    \ machine’s hardware name |\n| -p | Prints the architecture of the processor |\n\
    | -i | Prints the hardware platform |\n| -o | Print the name of the operating\
    \ system. On Linux systems that is “GNU/Linux” |\n| -a(all) | When the -a option\
    \ is used, uname behaves the same as if the -snrvmo options have been given. |\n\
    \n```\n[student@krosum ~]$ uname\nLinux\n[student@krosum ~]$ uname -r\n3.9.5-301.fc19.i686\n\
    [student@krosum ~]$ uname -s\nLinux\n[student@krosum ~]$ uname -i\n1386\n[student@krosum\
    \ ~]$ uname -p\n1686\n[student@krosum ~]$ uname -m\n1686\n[student@krosum ~]$\
    \ uname -o\nGNU/Linux\n```\n\nFig. uname command with options\n\n## 5. Terminal\
    \ (tty ) command\n\nThe tty utility is used to show the name of the terminal we\
    \ are using.\n\n```\n[student@krosum ~]$ ps [student@krosum ~]$ ps\n/dev/pts/0\
    \ PID TTY TIME CMD\n[student@krosum ~]$ ps 8514 pts/1 00:00:00 bash\nPID TTY TIME\
    \ CMD 8701 pts/1 00:00:00 ps\n[student@krosum ~]$ 8206 pts/0 00:00:00 bash [student@krosum\
    \ ~]$\n8700 pts/0 00:00:00 ps /dev/pts/1\n[student@krosum ~]\n```\n\nWe already\
