- md: "\ncontent of the file.\n\n# Redirecting Standard Error\n\n- A command using\
    \ the file descriptor number (2) and the greater-than (>) sign redirects any standard\
    \ error messages to the /dev/null file.\n\n```bash\nstudent@krosum ~$ cat r1.log\n\
    12:45:51 up 1 day, 11:12, 3 users, load average: 0.10, 0.08, 0.06\nstudent@krosum\
    \ ~$\nstudent@krosum ~$ uptime r1.log # same as uptime r1.log\nstudent@krosum\
    \ ~$\nstudent@krosum ~$\nDOUT - create a new file write command\nstudent@krosum\
    \ ~$ cat r1.log\n12:46:11 up 1 day, 11:12, 3 users, load average: 0.20, 0.11,\
    \ 0.06\nstudent@krosum ~~$\n```\n\nThe following example shows the standard error\
    \ redirected to the error.logfile.\n\n```bash\nstudent@krosum ~$ uptimeee\nbash:\
    \ uptimeee: command not found\nstudent@krosum ~$\nstudent@krosum ~$ uptimeee >error.log\n\
    bash: uptimeee: command not found\nstudent@krosum ~$\nstudent@krosum ~$ uptimeee\
    \ 2>error.log\nstudent@krosum ~$ cat error.log\nbash: uptimeee: command not found\n\
    student@krosum ~$ mkdir /D1 2>>error.log # appending command error\nerror.log\
    \ file\nstudent@krosum ~$ cat error.log\nbash: uptimeee: command not found\nmkdir:\
    \ cannot create directory '/D1': Permission denied\nstudent@krosum ~$\n```\n\n\
    For redirecting both stdout and stderr message to the same file, use following\
    \ syntax\n\n```bash\n2>&1\n```\n\n```bash\n[student@krosum]~$ uptime 1>r1.log\
    \ 2>error.log\n[student@krosum]~$ ###### ###### valid command result(STDOUT)\n\
    [student@krosum]~$ #### redirecting to r1.log file.\n[student@krosum]~$$\n[student@krosum]~$\
    \ uptimeee 1>r1.log 2>error.log\n[student@krosum]~$ #\n[student@krosum]~$ # invalid\
    \ command - error message(STDERR)\n[student@krosum]~$ # redirecting to error.log\
    \ file.\n[student@krosum]~$$\n[student@krosum]~$ uptime >result.log 2>&1 both\
    \ STDOUT/STDERR writing to result.log file\n[student@krosum]~$ uptimeee >>result.log\
    \ 2>&1\n[student@krosum]~$ cat result.log\n13:06:23 up 1 day, 11:33, 3 users,\
    \ load average: 0.17, 0.11, 0.06\nbash: uptimeee: command not found\n[student@krosum]~$\n\
    ```\n\nNote: The syntax 2>&1 instructs the shell to redirect stderr (2) to the\
    \ same file that receives stdout (1).\n\n# Using the Pipe Character\n\n- The pipe\
    \ character redirects the standard output of one command to the standard input\
    \ of another command.\n\nCommand1 | Command2\n\n- For example, use the standard\
    \ output from the who command as the standard input for the wc -l command\n\n\
    ```bash\nwho | wc -l\ncat /etc/passwd|grep|wc -l\n```\n\n```bash\n[student@krosum\
    \ ~]$\n[student@krosum ~]$ who|wc -l\n[student@krosum ~]$ cat /etc/passwd|grep\
    \ bash\nroot:x:0:0:root:/root:/bin/bash\nstudent:x:1000:1000:appelix student:/home/student:/bin/bash\n\
    [student@krosum ~]$ cat /etc/passwd|grep bash|wc -l\n[student@krosum ~]\n```\n\
    \nLike this we can use pipes to connect numerous commands.\n\n# Quoting Characters\n\
    \n- Quoting is a process that instructs the shell to mask or ignore the special\
    \ meaning of shell meta characters.\n- The quoting characters are:\n\n    - Single\
    \ forward quotation marks (''): Instruct the shell to ignore all enclosed meta-characters.\n\
    \n```bash\n$student@krosum ~$ echo '$0'\n$student@krosum ~$ echo $0 This is special\
    \ variable bash\n$student@krosum ~$ echo '$#!@#$&'\n$!@#$%\\&\n$student@krosum\
    \ ~$ echo $@@#$%\nbash: !@#$%: event not found\n$student@krosum ~$\n```\n\n  \
    \  - Backslash (\\): Prevents the shell from interpreting the next character after\
    \ the (\\) as a meta-character.\n\n```bash\n$student@krosum ~$ echo \"Hello\"\n\
    Hello\n$student@krosum ~$ echo \\\"Hello\"\n'Hello'\n```\n\n    - Single backward\
    \ quotation marks (''): Instruct the shell to execute and display the output for\
    \ a UNIX system command.\n\n    - Parentheses ($ (command)): Instruct the shell\
    \ to execute and display the output of the command enclosed within parentheses.\n\
    \n![](img/39c8fbde7fc51cbef611f658dfbb1fe2_164_0.png)\n\n# CHAPTER 11 - FILE PERMISSION\n\
    \n- All files and directories in Linux have a standard set of access permission.\n\
    - This access permission controls the access to all the files available and can\
    \ provide a fundamental level of security to the files and directories in a system.\n\
    \n# How to view file permission?\n\n- To view the permissions for files and directories,\n\
    \n```bash\nls -l\nor\nls -n\n```\n\n```bash\nstudent@krosum~$ ls -l pl1.txt\n\
    -rw-rw-r-- 1 student student 47 Mar 20 20:59 pl1.txt\nstudent@krosum~$\\\n```\n\
    \n```bash\nstudent@krosum~$ ls -l pl1.txt\n-rw-rw-r-- 1 student student 47 Mar\
    \ 20 20:59 pl1.txt\nstudent@krosum~$\\\n```\n\n![](img/39c8fbde7fc51cbef611f658dfbb1fe2_164_0.png)\n\
    \n    - The first field of ls specifies whether it is a file or directory.\n \
    \   - A directory is represented by d.\n    - The remaining permissions are for\
    \ owner, group, and other.\n\n# Permission Groups\n\nThere are three categories:\n\
    - Owner\n- Group\n- Other\n\n| Permission | Description |\n| :--- | :--- |\n|\
    \ Read (r) | We can display and copy the file. |\n| Write (w) | We can modify\
    \ the file. |\n| Execute (x) | If our file has execute, we can execute it. For\
    \ a directory, we can use cd to access it. |\n\n# Permission Set\n\nThe following\
    \ table describes the permissions:\n\n| Permission | Owner | Group | Other |\n\
    | :--- | :--- | :--- | :--- |\n| Read (r) | We can display and copy the file.\
    \ | We can display and copy the file. | We can display and copy the file. |\n\
    | Write (w) | We can modify the file. | We can modify the file. | We can modify\
    \ the file. |\n| Execute (x) | If our file has execute, we can execute it. | If\
    \ our file has execute, we can execute it. | If our file has execute, we can execute\
    \ it. |\n\nThe read, write, and execute permissions are interpreted differently\
    \ upon whether it is a file or directory. For a directory to be of general use,\
    \ it must at least have read and execute permissions.\n\n# Determining or Directory\
    \ Access\n\nThe ls -n command determines the ownership of files and directories.\n\
    \n- All files and directories have an associated user number (UID) and a group\
    \ identification number (GID).\nTo view the UIDs and GIDs, run ls-n on the /var/adm.\n\
    The UID identifies the user who owns the file or directory.\nThe GID identifies\
    \ the group of users who owns the file or directory.\n\n```bash\nls -np1.txt\n\
    ```\n\n# Interpreting the ls - n Command\n\n```bash\n$ls -n /var/adm\ntotal 244\n\
    drwxrxr-x 544 512 Nov 15 14:55 acct\n-rw----r-- 125 0 Jun 7 12:28 aulog\ndrwxr-xr-x\
    \ 244 512 Jun 7 12:28 exactct\n-r--r--r-- 100 308056 Nov 19 14:35 lastlog\ndrwxr-xr-x\
    \ 244 512 Jun 7 12:28 log\n|-rw-r--r-- 100 65166 Nov 18 07:48 ||messages|\n```\n\
    \n![](img/39c8fbde7fc51cbef611f658dfbb1fe2_170_0.png)\n\n- The above image illustrates\
    \ the parts of the output of the ls-n command\n\n- The first character is the\
    \ file/directory type.\n- The second set of nine characters represents the permission\
    \ set.\n- The third character represents number of hard links to the file or directory.\n\
    \n- A hard link is a pointer that shows the number of files or directories that\
    \ are linked with a particular file in the same file system.\n"
