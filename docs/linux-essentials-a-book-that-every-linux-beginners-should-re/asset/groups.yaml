    # Copy (cp) command


    +   • The copy (cp) utility creates a duplicate of a file, a set of files, or
    a directory.

    • If the source is a file, the new file (target file) contains exact copy of the
    data in the source file.


    Syntax cp-option SourcefileTargetfile


    ![](img/39c8fbde7fc51cbef611f658dfbb1fe2_130_0.png)


    +   • If source file doesn''t exist (or) proper path is not specified (or) case
    mismatch happens (upper/lower), cp action is failed. Refer to the below snap for
    error messages.'
- md: "\n```bash\nstudent@krosum Demo$ cp ab.txt T1.c ## source ab.txt file is not\
    \ exists\ncp: cannot stat 'ab.txt': No such file or directory\nstudent@krosum\
    \ Demo$\nstudent@krosum Demo$ cp p1.log T2.log # source file P1.log (uppercase)\n\
    cp: cannot stat 'p1.log': No such file or directory\nstudent@krosum Demo$\nstudent@krosum\
    \ Demo$ cp passwd T3.log # passwd file is not exists\ncp: cannot stat 'passwd':\
    \ No such file or directory\nstudent@krosum Demo$\nstudent@krosum Demo$ cp /etc/passwd\
    \ backup.conf ## this is valid\n```\n\n```bash\nstudent@krosum Demo$ ls\np1.log\
    \ p2.log test.c\nstudent@krosum Demo$ cat -n p1.log\n1 log1\n2 log2\nstudent@krosum\
    \ Demo$ cat -n test.c\n1 #include<stdio.h>\n2 int main() {\n3 printf(\"Hello Linux\\\
    n\");\n4 return 0;\n5 }\nstudent@krosum Demo$ cp p1.log test.c # Note: target\
    \ file(test1.c) is already\n# exists(overwrite)\nstudent@krosum Demo$ cat -n test.c\n\
    1 test1\n2 test2\n2\n```\n\nIf target file exists, the existing file content will\
    \ be overwritten. See the below example\n\n- The test1.c file is already exists\
    \ and its contents are replaced by the source file (p1.log) contents.\n- The cp\
    \ command copies both text and binary files.\n\n```bash\n[student@krosum Demo]$\
    \ ls\np1.log p2.log repo test1.c\n[student@krosum Demo]$ file repo # determine\
    \ file type\nrepo: directory\n[student@krosum Demo]$\n[student@krosum Demo]$ cp\
    \ p1.log repo # cp source(file) target(directory)\n[student@krosum Demo]$\n[student@krosum\
    \ Demo]$ ls repo # under repo directory\np1.log\n[student@krosum Demo]$|\n```\n\
    \nIf the target is directory, the source file is copied to the directory. See\
    \ the below snap where p1.log file is copied to repo directory.\n\nUnder the repo\
    \ directory we can duplicate new name called test1.log\n\n```bash\n[student@krosum\
    \ Demo]$ ls\np1.log p2.log repo test1.c\n[student@krosum Demo]$ ls repo\np1.log\n\
    [student@krosum Demo]$ cp p1.log repo/test1.log\n[student@krosum Demo]$\n[student@krosum\
    \ Demo]$ ls repo\np1.log test1.log\n[student@krosum Demo]$|\n```\n\nWe can use\
    \ wild card to copy more than one file into subdirectory or remote directory.\n\
    \n```bash\n[student@krosum Demo]$ ls\np1.log p2.log process.log repo test1.c vmreport.log\n\
    [student@krosum Demo]$ # copy list of log files into /tmp\n[student@krosum Demo]$\
    \ # -ls /tmp\n=========\n[student@krosum Demo]$ ls -l /tmp\nD1 Parent2 ssh-atHnIDQ032LF\
    \ systemd-farl1O7 vmware-root\nModule8 ProjectA system-private-BLYHK6 system-private-NIC0fQ\n\
    [student@krosum Demo]$ cp \"*.log\" /tmp\n[student@krosum Demo]$ # after copied\n\
    D1 Parent2 system-private-BLYHK6 systemd-farl1O7\np1.log ProjectA\np2.log ssh-atHnNIDQ032LF\
    \ vmreport.log\n[student@krosum Demo]$\n```\n\n# Rules in file copy:\n\nTo copy\
    \ a file successfully, several rules must be followed:\n\n- Rule 1 : The source\
    \ must exist. Otherwise, Linux prints the following error message:\n\n```bash\n\
    [student@krosum Demo]$ ls\np1.log p2.log process.log repo test1.c vmreport.log\n\
    [student@krosum Demo]$\n[student@krosum Demo]$ cp result.log out.log # There is\
    \ no result\ncp: cannot stat 'result.log': No such file or directory\n[student@krosum\
    \ Demo]$\n```\n\n- No such file (or) directory.\n\n- Rule 2 : If no destination\
    \ path is specified, Linux assumes the destination as the current working directory.\n\
    \n```bash\n[student@krosum Demo]$ ls\np1.log p2.log process.log repo test1.c vmreport.log\n\
    [student@krosum Demo]$\n[student@krosum Demo]$ cp test1.c test2.c # test2.c file\
    \ will create\ncurrent directory\n[student@krosum Demo]$ ls\np1.log p2.log process.log\
    \ repo test2.c vmreport.log\n[student@krosum Demo]$\n```\n\n```bash\n[student@krosum\
    \ Demo]$ ls\np1.log p2.log process.log repo test1.c vmreport.log\n[student@krosum\
    \ Demo]$\n[student@krosum Demo]$ cp -r updated_repo source file is repo directory\n\
    directory copy\n[student@krosum Demo]$\np1.log p2.log process.log repo test1.c\
    \ test2.c updated_repo vmreport.log\n[student@krosum Demo]$\n[student@krosum Demo]$\
    \ cp p1* repo # more than one source files are copied to\nrepo directory.\n[student@krosum\
    \ Demo]$\n```\n\n- Rule 3: If the source happens to be multiple files or a directory,\
    \ then the destination file must be a directory.\n\n- Rule 4: To prevent an automatic\
    \ replacement (overwrite) of the destination file, use the interactive (-i) option.\
    \ When interactive is specified, Linux issues a warning message and waits for\
    \ a reply. Any reply other than \"yes\" will cancel the copy of the specified\
    \ file.\n\n```bash\n[student@krosum Demo]$ cat -n test1.c\n1 #include<stdio.h>\n\
    2 int main(){\n3     printf(\"Hello\\n\");\n4     return 0;\n5 }\n[student@krosum\
    \ Demo]$ cat -n p1.log\n1 log1\n2 log2\n[student@krosum Demo]$ cp p1.log test1.c\
    \ -i\ncp: overwrite 'test1.c'? \n[student@krosum Demo]$ cat -n test1.c\n1 #include<stdio.h>\n\
    2 int main(){\n3     printf(\"Hello\\n\");\n4     return 0;\n5 }\n```\n\n- Rule\
    \ 5: To preserve the modification times and access permissions, use the -p option.\
    \ In the absence of the -p option, the time will be the defaults.\n"
