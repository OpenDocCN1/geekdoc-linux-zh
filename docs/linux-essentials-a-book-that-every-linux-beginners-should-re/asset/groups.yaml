    # Moving the Cursor within the vi Editor


    The tables shows the key sequences that move the cursor.


    | KEY | SEQUENCE CURSOR MOVEMENT |

    |---|---|

    | h | left arrow, or Backspace - shifts one character left |

    | j | down arrow - Down one line |

    | K | up arrow - Up one line |

    | l | right arrow, or space bar - Right (forward) one character |

    | w | Forward one word |

    | b | Back one word |

    | e | To the end of the current word |

    | $ | To the end of the line |

    | 0 (zero) | To the beginning of the line |

    | ^ | To the first non-white space character on the line |


    | KEY | SEQUENCE CURSOR MOVEMENT |

    | --- | --- |

    | G | Goes to the first line of the file |

    | :n | Goes to Line n |

    | nG | Goes to Line n |

    | Control + F | Pages moves forward one screen |

    | Control + D | Scrolls down one–half screen |

    | Control + B | Pages moves backward one screen |

    | Control + U | Scrolls up one-half screen |

    | Control + L | Refreshes the screen |

    | Control + G | Displays current buffer information |


    # Inserting and Appending Text


    | KEY | SEQUENCE CURSOR MOVEMENT |

    |---|--|

    | a | new or existing file by using the vi editor |

    | A | Appends text after the cursor |

    | i | Inserts text before the cursor |

    | I | Inserts text at the beginning of the line |

    | o | Opens a new line below the cursor |

    | O | Opens a new line above the cursor |

    | :r | File name inserts text from another file into the current file |


    # Text-Deletion Commands


    | KEY | SEQUENCE CURSOR MOVEMENT |

    | R | Overwrites or replaces character on the line and the cursor position is
    moved pointing to next character. To terminate the operation, press Escape. |

    | C | Changes or overwrites sequence of characters from the cursor to the end
    of the line. |

    | s | Substitutes a string for a character at the cursor position. |

    | x | Deletes a character at the cursor position. |

    | dw | Deletes a word or part of the word to the right of the cursor position.
    |

    | dd | Deletes the line containing the cursor position. |

    | D | Deletes the line from the cursor to the right end of the line. |

    | :n,md | Delete from $n^{th}$ line to $m^{th}$ line (For example, :5,10d deletes
    lines 5–10.) |


    We can use numerous commands to edit files by using the vi editor.


    The following sections will describe the basic operations for deleting, changing,
    replacing, copying, and pasting. Remember that the vi editor is case-sensitive.


    **Note:**- Output from the delete command writes to a buffer from which text can
    be retrieved.


    # Edit Commands


    The table describes the commands to change text, undo a change, and repeat an
    edit function in the vieditor.


    | COMMAND | FUNCTION |

    |---|---|

    | cw | Changes overwrites sequence of characters from the cursor position to the
    end of that word. |

    | R | Replaces the character at the cursor position with another character. |

    | J | Joins the current line and the line below |

    | Xp | Transposes the character at the cursor position and the character to the
    right of the cursor position. |

    | ~ | Changes the case of character placed at cursor position from uppercase to
    lowercase |

    | u | Undo the previous command |

    | U | Undo all changes to the current line |

    | . | Repeats the previous command |


    Note:- Many of these commands change the vi editor into the input mode. To return
    to the command mode, press the Esc key.


    # Search and Replace Commands


    The table shows the commands that search for and replace text in the vi editor.


    | COMMAND | FUNCTION |

    | /string | Searches forward for the string |

    | ?string | Searches backward for the string |

    | n | Searches for the next occurrence of the string. Use this command after searching
    for a string. |

    | N | Searches for the previous occurrence of the string. |

    | %s/old/new/g | Searches for the old string and replaces it with the new string
    globally. |


    # Copy and Paste Commands


    The table shows the commands that cut, copy, and paste text in the vi editor.


    | COMMAND | FUNCTION |

    | --- | --- |

    | **Yy** | Yanks a copy of a line |

    | **P** | Puts yanked or deleted text under the line containing the cursor |

    | **P** | Puts yanked or deleted text before the line containing the cursor |

    | :x,yco n | Copies lines from x to y and puts them after line n (For example,
    :1,3 co 5 copies lines 1–3 and puts them after line 5.) |

    | :x,y m n | Moves lines in range between x and y to line after n. For example,
    :4,6 m 8 |


    # Save and Quit Commands


    The table describes the commands that save the text file, quit the vi editor,
    and return to the shell prompt.


    | COMMAND | FUNCTION |

    | :w | Saves the file with changes by writing to the disk |

    | :w new_filename | Writes the contents of the buffer to new_filename. |

    | :wq | Saves the file with changes and quits the vi editor |

    | :x | Saves the file with changes and quits the vi editor |

    | ZZ | Saves the file with changes and quits the vi editor |

    | :q! | Quits without saving changes |

    | ZQ | Quits without saving changes |

