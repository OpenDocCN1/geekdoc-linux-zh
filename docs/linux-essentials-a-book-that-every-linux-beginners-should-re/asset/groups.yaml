    # Square Bracket ([]) Characters


    +   - The square bracket ([|]) characters represent a set or range of characters
    for a single character position.

    - A set of characters is any number of specific characters,

    - For example, [acb].


    +   - The characters in the set do not necessarily have to be in any order.

    - For example, [abc] is the same as [cab].Whereas a range of characters is a series
    of ordered characters.


    +   - A range lists the first character followed by a hyphen (-) and then the
    last character, for example, [a–z] or [0–9].


    +   When specifying a range, arrange the characters in the order that you want
    to appear in the output.

    - For example, use [A–Z] or [a-z] to search for any uppercase or lowercase alphabetical
    characters, respectively.


