    \ load average: 0.20, 0.11, 0.06\nstudent@krosum ~~$\n```\n\n以下示例显示了将标准错误重定向到\
    \ `error.logfile`。\n\n```bash\nstudent@krosum ~$ uptimeee\nbash: uptimeee: command\
    \ not found\nstudent@krosum ~$\nstudent@krosum ~$ uptimeee >error.log\nbash: uptimeee:\
    \ command not found\nstudent@krosum ~$\nstudent@krosum ~$ uptimeee 2>error.log\n\
    student@krosum ~$ cat error.log\nbash: uptimeee: command not found\nstudent@krosum\
    \ ~$ mkdir /D1 2>>error.log # appending command error\nerror.log file\nstudent@krosum\
    \ ~$ cat error.log\nbash: uptimeee: command not found\nmkdir: cannot create directory\
    \ '/D1': Permission denied\nstudent@krosum ~$\n```\n\n要将标准输出 (stdout) 和标准错误 (stderr)\
    \ 都重定向到同一个文件，请使用以下语法\n\n```bash\n2>&1\n```\n\n```bash\n[student@krosum]~$ uptime\
    \ 1>r1.log 2>error.log\n[student@krosum]~$ ###### ###### 有效命令结果(STDOUT)\n[student@krosum]~$\
    \ #### 重定向到 r1.log 文件。\n[student@krosum]~$$\n[student@krosum]~$ uptimeee 1>r1.log\
    \ 2>error.log\n[student@krosum]~$ #\n[student@krosum]~$ # 无效命令 - 错误消息(STDERR)\n\
    [student@krosum]~$ # 重定向到 error.log 文件。\n[student@krosum]~$$\n[student@krosum]~$\
    \ uptime >result.log 2>&1 将 STDOUT/STDERR 写入 result.log 文件\n[student@krosum]~$\
