    \n`tr`（翻译）命令将第一组字符中的每个字符替换为第二个指定字符集中对应的字符。每个字符集都指定为一个字符串。\n\n第一组中的第一个字符被替换为第二组中的第一个字符，第一组中的第二个字符被替换为第二组中的第二个字符，依此类推，直到所有匹配的字符都已替换。\n\
    \n语法：\n\n```\ntr option oldstring newstring\n```\n\n```\n-delete 删除字符\n```\n\n\
    ```\n-squeeze 压缩重复项\n```\n\n```\n-complement set 补集\n```\n\n它从标准输入翻译输入，并将输出写入到标准输出。\n\
