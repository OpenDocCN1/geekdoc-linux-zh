    # Linux File Types


    Linux File types are classified as follows.


    1. Regular (or) Ordinary file

    2. directory file

    3. Link file (or) symbolic file (or) soft link file (or) symlink file

    4. Device files

    5. named pipe or fifo file

    6. Socket file


    # 1. Regular (or) Ordinary file


    The Regular file or Ordinary file will be classified as following two types


    - ASCII or TEXT

    - Binary (or) ELF (or Object


    # What is ASCII or TEXT type file?


    - The format in which the file contents can be read or understandable by the user
    (plain text) is referred as ASCII or TEXT type file.

    - Linux file type can be determined by the file command.


    # How to use file command?


    Syntax : `filename # determine the file type. root@hostname~]#cat ab.c`


    ```c

    #include<stdio.h>

    int main() {

    printf("Hello\n");

    return 0;

    }

    ```


    The above file contents are C program content. Even if we are not aware of C programming
    language, we can read the content. So this type of file (i.e.,


    Understandable format) is called ASCII or TEXT file.


    ```bash

    root@hostname~]# file ab.c

    ```


    ASCII or TEXT


    ```bash

    root@hostname~]# file/etc/passwd

    ```


    ASCII or TEXT


    ```bash

    root@hostname~]# file/var/log/boot.log

    ```


    ASCII or TEXT


    So in Linux, file types are not determined by their file extension.


    # Binary file (or) object file (or) ELF File


    A binary file is any file that contains at least some data that consists of sequences
    of bits that do not represent plain text.


    Binary files are used to represent images, sound, executable (i.e., runnable)
    programs and compressed data (including documents created by most word processing
    programs).


    They are usually the most compact means of storing data. This is because of the
    data compression techniques, and the fact is that the programs stored in binary
    form can be executed faster.


    Linux binary files are called as ELF(Executable and Linkable Format) file.


    # What is an ELF file?


    ELF is the abbreviation for Executable and Linkable Format and defines the structure
    for binaries, libraries, and core files.


    The formal specification allows the operating system to interpret its underlying
    machine instructions correctly. ELF files are typically the output of a compiler
    or linker and are a binary format. With the right tools, such file can be analyzed
    and better understood.


    A common misconception is that ELF files are just for binaries or executable.
    They can be used for partial pieces (object code).


    Take our sample Cprogram(ab.c) file. When you compile, source (ab.c) will get
    compiled Executable file (a.out).Using that executable file, we can run the C
    program.Thata.out is ELF file type.


    An example is shared libraries or even core dumps (those core a.outfiles). The
    ELF specification is also used on Linux for the kernel itself and Linux kernel
    modules.


    ```bash

    root@hostname~# file/lib/libproc-3.2.8.so

    ```


    ELF


    In Linux, all the commands are ELF type files.


    ```bash

    root@hostname~# file/bin/date

    ```


    ELF


    HereDate file is binary file not in a readable format. All the system commands
    are ELF type file.


    # 2. Directory File


    Directory file contains a collection of other files and directories. This resembles
    a folder.


    # 3. Link File (Or) Symbolic File (Or) Soft Link File (Or) Symlink File


    A symbolic link, also known as a symlink or a soft link, is a special kind of
    file (entry) that points to the actual file or directory on a disk (like a shortcut
    in Windows).


    Symbolic links are most used in administration task.


    # 4. Device files


    Recap in Linux, everything is a FILE. So, all the peripheral devices that are
    attached with system are treated as device file.All the device files are mounted
    /devdirectory.


    In Linux there are two categories of device files: character and block. Character-type
    device files include devices such as keyboard, mouse, and serial ports. In general,
    operations with these devices (read, write) are performed sequentially by byte.


    The Block -type device files includes devices where data volume is large and is
    organized by blocks. Examples: Hard disks, USB, CDROM are block-type files.


    # 5. Named Pipe Or FIFO File


    - A FIFO special file (named pipe) is similar to a pipe.

    - It can opened by multiple processes for reading or writing.

    - When processes are exchanging data via the FIFO, the kernel passes all data
    internally without writing it to the file system.

    - Thus, the FIFO special file has no contents on the file system; the


    file system entry merely serves as a reference point so that processes can access
    the pipe using a name in the file system.


    - Using mkfifo command we can create FIFO file.


    # 6. Socket file


    A socket is a special file used for inter-process communication, which enables
    communication between two processes.


    Unlike named pipes which allow only unidirectional data flow, sockets are fully
    duplex-capable.


    There are many ways to determine Linux file types


    - Using filecommand (file filename)

    - Using ls-l (ls-l filename)


    Just type-ls followed by the filename. From the resulting output, observe the
    leftmost character which depicts the type of file.


    | Character | File Type |

    | --- | :--- |

    | - | regular file |

    | d | directory file |

    | l | link file |

    | c | character type device file |

    | b | block type device file |

    | p | named pipe file |

    | S (capital ''s'') | socket file |


