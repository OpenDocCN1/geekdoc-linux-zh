    # sort command


    The sort command is one of the important filter commands in Linux.


    When dealing with large volume of data, we need to organize them for analysis
    and efficient processing. One of the simplest and powerful organizing techniques
    is sorting.


    When we sort data, we arrange them in sequence. Usually, we use ascending order.
    By default all elements are sorted based on the first character of the elements
    in ascending order. We can also sort them in descending order, in which each piece
    of data is smaller than its predecessor.


    ```

    [student@krosum ~]$ cat names.txt

    kumar

    arun

    vijay

    xerox

    vijay

    theeba

    ram

    karthik

    [student@krosum ~]$ sort names.txt

    arun

    karthik

    kumar

    ram

    theeba

    vijay

    vijay

    xerox

    ```


    Sort uses the ASCII value of each character.


    If you want to sort them in reverse order, use -r (reverse)option'
