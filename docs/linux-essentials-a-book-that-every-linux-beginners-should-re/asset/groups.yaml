  - '[PAGE 96]


    Note: The last line mode is actually the exmode. The vi editor is essentially
    a visual extension to the exeditor,which in turn is an extended version of the
    ededitor.


    # Switching Between Modes


    +   - The default mode for the vi editor is the command mode.

    - To switch to the input mode, press i, o, or a.

    - To return to the command mode, press the Esc key.

    - In the command mode, you can save the file and quit the vieditor, and return
    to the shell prompt.'
