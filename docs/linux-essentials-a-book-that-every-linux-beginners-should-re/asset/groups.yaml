    # # The File Descriptors


    +   - Each process works with file descriptors.

    - File descriptors determine where the input to the command originates and where
    the output and error messages are directed to.

    - The table explains the file descriptors.


    | FILE DESCRIPTOR NUMBER | FILE DESCRIPTION ABBREVIATION | DEFINITION |

    |---|---|---|

    | 0 | STDIN | Standard command input |

    | 1 | STDOUT | Standard command output |

    | 2 | STDERR | Standard command error |'
  - '[PAGE 155]


    # Command Redirection


    +   * By default, the shell receives or reads input from the standard input, the
    keyboard and displays the output and error messages to the standard output, the
    screen.

    * Input redirection forces a command to read the input from a file instead of
    receiving from the keyboard.


    ```

    root@krumsum T# uname -rs # display kernel name and version

    linux 3.9.5-301.fc19.1686

    root@krumsum T#

    uname -rs >r1.log # redirecting command result to file(r1.log)

    root@krumsum T# ls -t

    r1.log emp.csv

    root@krumsum T# cat r1.log

    linux 3.9.5-301.fc19.1686

    root@krumsum T# ps >process.log # redirect process result to process.log file

    root@krumsum T# ls

    emp.csv process.log r1.log

    root@krumsum T#

    root@krumsum T# ps -elgrep bash|wc -l

    root@krumsum T# ps -elgrep bash|wc -l >count.log # redirect pipe result to count.log

    root@krumsum T# ls

    count.log emp.csv process.log r1.log

    ```


    +   * Output redirection sends the output from a command into a file instead of
    sending the output to the screen.'
