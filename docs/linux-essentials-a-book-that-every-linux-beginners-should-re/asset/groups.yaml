- md: '

    # Linux kernel Development model


    The heart of the Linux operating system is the kernel.


    A lot of developers, representing hundreds of corporates are providing frequent
    release of the Linux kernel.


    The Linux community collaborates through various mailing lists that are set up
    to handle kernel development.


    Features are pushed upstream, through these mail list and Internet Relay Chat
    (IRC). Upstream is the term used for a community-owned version of a specific project.


    This is where the development happens and it always has the most recent changes.


    Linus Torvalds leads a team that releases new versions called "vanilla" or "mainline"
    kernels.


    The mainline branch of development incorporates new features, security fixes,
    and bug fixes. It is not considered a stable branch until it undergoes through
    testing.


    A number of kernel versions are currently being maintained as stable kernels.
    These kernels have patches that are backported to them.


    These patches are primarily driver updates and security fixes. Kernel branches
    are available at http://www.kernel.org


    # Architecture of Linux


    ![](img/39c8fbde7fc51cbef611f658dfbb1fe2_15_0.png)


    In General, System consists of 3 layers. See the above diagram. The layer1 is
    called user level that holds information about the application created or executed
    by the user. All application at the user level is called user process.


    The layer2 is called kernel level. We know what kernel is. Here the main function
    of kernel is to extend the user requests to hardware which tells about the application
    that we want to execute on the hardware (CPU) or about the file content that we
    want to read from storage (Hard disk). To do all these tasks, we need the help
    of Kernel. Here kernel job is to interface our (user) requests to corresponding
    hardware resources (CPU, Hard-Disk).


    The bottom layer is called hardware level. All peripheral devices are connected
    in this layer.


    From this structure we can understand that as a user, we can''t talk to hardware
    directly; so we need a kernel to interface. Now recap our operating system definition
    "OS is a system program, it will interface the user to hardware."


    Now we can explore more details about Kernel Architecture, middle layer (kernel
    level) in the above diagram.


    # Kernel Exploration


    The Linux kernel is a modular designed kernel.


    At the architecture level, the Linux kernel interacts with the hardware, controls
    and schedules the access to resources (CPU, memory, storage, network and so on)
    behalf of the applications.


    Applications run in what is called the user space and a call is made to a stable
    set of system libraries to ask for kernel service.


    This modular designed kernel allows components of Linux to originate from different
    developers, each of which had their own specific design goals in mind.


    A modular design also means that the Linux kernel is independent of applications
    and interfaces.


    The result is that even when application crashes, all security vulnerabilities
    in applications tend to remain isolated, rather than affecting the system as a
    whole.


    In Linux, each component is configured separately, typically by using text-based
    configuration files.


    Reading and writing configuration information can be done by scripts or applications
    by using simple text parsing engines.


    No special application programming interface (API) is required to interface with
    the system configuration data.


    ![](img/39c8fbde7fc51cbef611f658dfbb1fe2_18_0.png)


    # LINUX KERNEL STRUCTURE


    The above figure shows the detailed architecture of Linux kernel. Unix and Linux
    are monolithic kernel. So, what is a monolithic kernel?


    **Monolithic kernel** is a single large process, running entirely in a single
    address space. It is a single static object file. All kernel services exist and
    execute in the kernel address space directly. In Monolithic Kernel, all the parts
    of a kernel like **the Scheduler, File System, Memory Management, Networking Stacks,
    Device Drivers**, etc., are maintained *as a single unit* within the kernel.


    # Components of the System


    The main components of Linux operating system are:


    - 1. Command utility

    - 2. Shell

    - 3. Kernel


    # Command utilities


    **Command utilities** are binary files in Linux. As an end user, we will get into
    the system with the help of commands. But, how the command gets in to the system?
    What is the interface name? **The interface name is called shell.**


    Yes, **shell** is an interface between user and kernel, the job of shell is interpretation.
    Each input command will be interpreted (translated) to kernel.


    The kernel is a core important program and the job of the kernel is to interface
    your instruction (command) to hardware units.


    In this entire tutorial book, we will discuss topics such as - what are Linux
    command line utilities? how to use Linux command? And how to explore more commands
    and additional options with real system?. Note that we won’t discuss any programming
    topics here.


    # Shell


    What is shell? Shell is an interpreter; it interfaces between user space and kernel
    space.


    ![](img/39c8fbde7fc51cbef611f658dfbb1fe2_20_0.png)


    Theoretically we say that, user interacts with operating system. But how are we
    the user and now, how are we going to run our commands on OS?


    Let’s say, how to start MySQL database? How to execute (or) run my java program
    in Linux OS? How to display today date and time? To do all these tasks, we need
    an interface and that interface is called shell. So Shell is interface between
    user and kernel. There are many types of shells in Linux; we will discuss more
    about it.


    # Kernel


    Recap the previous chapter; we discussed - what is operating system? What is kernel?


    Linux is a kernel but when it first out, people called it Android. (Wait, the
    text says Android, but context likely means Linux; however, keeping original text
    as instructions say "retain all information").


    Actually, looking at the OCR: "Linux is a kernel but when it first out, people
    called it Android." -> This is likely an OCR error for "Linux", but I will follow
    the instruction "保留原文的语言和所有信息" unless the error is obvious. "Android" vs "Linux"
    in this context is strange, but I will stick to the text unless it''s clearly
    a misreading. Wait, "Android" appears multiple times.


    BIOS act as an intermediary between computer CPU and Input/output devices. This
    eliminates the intervention of the operating system and software. The system/server
    is always aware of the details of hardware and other I/O devices. If any hard
    disks or I/O devices are changed, the BIOS also needs to be updated.


    Linux is a kernel. When we say OS services, it is actually kernel and that is
    why kernel is called as the heart of operating system. system works.


    ![](img/39c8fbde7fc51cbef611f658dfbb1fe2_22_0.png)


    In next chapter, we will discuss about shell types followed by more exploration
    on Linux commands.


    # CHAPTER 2 - LINUX BOOT PROCESS


    ## Step1- BIOS (Basic Input System)


    Once the Personal Computer (PC) is switched on, BIOS instruction will start its
    part. The BIOS is used to perform POST (Power On Self-Test). It is hardware self-testing
    and checking.


    The two main errors that occur during POST are:


    - 1. Fatal - This occurs due to hardware problems.

    - 2. Non-fatal error - This occurs due to software problems.


    Main responsibilities of BIOS during POST are listed below:


    - 1. Verify CPU registers.

    - 2. Verify the integrity of the BIOS code itself.

    3. Verify some basic components like DMA, timer, and interrupt controller.

    4. Find, size, and verify the system main memory.

    5. Initialize BIOS

    6. Identify, organize, and select which devices are available for booting.


    The beep sound after the POST indicates its result. A single short beep restart/start
    indicates normal POST i.e. the system is OK. Two short beeps indicate a POST error
    and the error code is shown on screen.


    ![](img/39c8fbde7fc51cbef611f658dfbb1fe2_23_0.png)

