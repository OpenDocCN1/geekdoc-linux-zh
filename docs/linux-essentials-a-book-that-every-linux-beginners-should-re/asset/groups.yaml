    - The fifth column is the TTY, the controlling terminal for the process. Note\
    \ that system processes (daemons) display a question mark (?).\n- The sixth column\
    \ is the TIME, the cumulative execution time for the process.\n- The seventh column\
    \ is the CMD, the command name, options, and arguments.\n\n# Terminating a Process\n\
    \n- There might be times when we need to terminate an unwanted process.\n- A process\
    \ might have got into an endless loop, or it might have hung.\n- We can kill or\
    \ stop any process that we own.\n- We can use the following two commands to terminate\
    \ one or more processes:\n  - kill\n  - pkill\n\n- The kill and pkill commands\
    \ send signals to processes directing them to terminate.\n- Each signal has a\
    \ number, name, and an associated event.\n\nHowever, there are processes that\
    \ should not be terminated, such as the init process. Killing such processes can\
    \ result in a system crash.\n\n**Note:** A super-user can kill any process in\
    \ the system.\n\n## Terminating a Process: kill Command\n\n- We can terminate\
    \ any process by issuing the appropriate signal to the process concerned.\n- The\
    \ kill command sends a termination signal to one or more processes.\n\n**Note:**\
    \ The kill command terminates only those processes that we own.\n\nThe kill command\
    \ sends *signal 15*, the terminate signal, by default. This signal causes the\
    \ process to terminate in an orderly manner.\n\nAll we need to know the PID of\
    \ the *process before to terminate* it. We can use either the `ps or pgrep` command\
    \ to locate the PID of the process.\n\nAlso, we can terminate several processes\
    \ at the same time by entering multiple PIDs on a single command line.\n\n**Note:**\
    \ The root user can use the kill command on any process.\n\nOther way of terminating\
    \ a Process: using `kill`\n\nUse the kill command to terminate the mail process.\n\
    \n```\n[root@krosum Temp]# pgrep -l mail\n442 sendmail\n519 sendmail\n[root@krosum\
    \ Temp]#\n[root@krosum Temp]# pgrep -l bash\n1195 bash\n[root@krosum Temp]#\n\
    ```\n\n## Terminating a Process: pkill Command\n\nAlternatively, we can use the\
