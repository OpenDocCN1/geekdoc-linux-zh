    \ 和 `paste` 命令在合并多个文件方面相似。但 `cat` 命令按垂直（行）合并文件，而 `paste` 命令按水平（列）合并文件。\n\n```bash\n\
    $student@krosum-$ cat p1.log p2.log\n[student@krosum-$]$ paste p1.log p2.log\n\
    data1 DATA1\ndata2 DATA2\ndata3 DATA3\ndata5\ndata7 DATA-END\n[student@krosum-$]\n\
    ```\n\n```bash\n$student@krosum ~]$ cat -n IP1\n1 data1\n2 data2\n3 data3\n4 data4\n\
