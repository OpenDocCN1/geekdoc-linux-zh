  - '[PAGE 166]


    # Permission Groups


    There are three categories of permissions groups:


    +   - Owner

    - Group

    - Other


    The table describes the permission groups and their scope


    | PERMISSION | DESCRIPTION |

    | --- | --- |

    | Owner | Permissions used by the assigned owner of the file or directory. |

    | Group | Permissions used by members of the group that owns the file or directory.
    |

    | Other | Permissions used by all other users except the file owner, and members
    of the group that owns the file or the directory. |'
  - '[PAGE 167]


    # Permission Set


    +   - Each permission group acquires three permissions, read, write and execute
    which together called a permission set.


    +   - Each file or directory has a permission set specified for each permission
    group. Since we have 3 type of permission group, totally each file or directory
    contains 3 permission set corresponding to each group.


    +   - The first permission set represents the owner permissionsthe second set
    represents the group permissions, and the last set represents the other permissions.


    +   - The read,writeand executepermissions are represented by the characters r,w,andxrespectively.


    +   - The presence of any of these characters (rorw or x),indicates that the particular
    permission is granted.


    +   - A dash (-) symbol in place of a character in a permission set indicates
    that a particular permission is denied.


    +   - Linux assigns initial permissions automatically when a new file or directory
    is created.'
  - '[PAGE 168]


    # # Interpreting File and Directory Permissions


    | PERMISSION | FILE ACCESS | DIRECTORY ACCESS |

    | --- | --- | --- |

    | Read ( r ) | - We can display file contents and copy the file. | - We can list
    the directory contents with thecommand. |

    | Write( w ) | - We can modify the file contents. | - We can modify the contents
    of a directory, such as by creating and deleting the file. |

    | Execute( x ) | - If our file has executepermission, we can execute it both on
    command line and within a shell script. | - We can use the cd command to access
    the directory.<br>- By default, we have the read access and can run the lscommand
    on the directory to list the contents.<br>- Even in case if we are restricted
    for a read access, we can run the ls command as long as we know the file name.
    |


    The read, write, and execute permissions are interpreted differently depending
    upon whether it is a file or a directory. **Note:** For a directory to be ofgeneral
    use, it must at least have read and execute permissions.'
