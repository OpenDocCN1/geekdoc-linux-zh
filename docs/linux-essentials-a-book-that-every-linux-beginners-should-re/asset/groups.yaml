    # cmp command


    cmp command in Linux/UNIX is used to compare the two files by byte and helps you
    to find out whether the two files are identical or not. When cmp is used for comparison
    between two files, it reports the location of the first mismatch to screen if
    difference is found and if no difference is found ie the files are identical,
    cmp displays no message and simply returns.


    ```

    [student@krosum ~]$ cat -n F1.txt

    1 p1.c

    2 p2.c

    3 p3.c

    4 p4.c

    [student@krosum ~]$ cat -n F3.txt

    1 p1.c

    2 p2.c

    3 p3.c

    4 p4.c

    [student@krosum ~]$ cmp F1.txt F3.txt

    ```


    If file contents are not unique, it will display message as below.


    # Options for cmp command


    -b(print-bytes)

    If we want cmp to display the differing bytes to the output, use -b option.


    ```

    [student@krosum ~]$ cat -n names.txt

    1 arun

    2 babu

    3 paul

    [student@krosum ~]$ cat -n names1.txt

    1 arun

    2 babu

    3 PAUL

    4 xerox

    [student@krosum ~]$ cmp names.txt names1.txt

    names.txt names1.txt differ: byte 11, line 3

    [student@krosum ~]$ cmp -b names.txt names1.txt

    names.txt names1.txt differ: byte 11, line 3 is 160 p 120 p

    ```


    ```

    [student@krosum ~]$ cat -n names.txt

