    | ZQ | Quits without saving changes |'
- md: "\n# Session Customization\n\nTo create an automatic customization for all your\
    \ vi sessions, perform as follows:\n\n- 1. Create a file named .exrc in your home\
    \ directory.\n- 2. Enter any of the set variables into the .exrc file.\n- 3. Enter\
    \ each set variable without the preceding colon.\n- 4. Enter each command on one\
    \ line.\n\nThe vi editor reads the .exrc located in your home directory each time\
    \ you open a vi session, regardless of your current working directory.\n\nNote:\
    \ The same steps apply for customizing a session in the Vim editor. Except that,\
    \ instead of creating an .exrc file, you need to create a .vimrc.\n\n# Session\
    \ Customization Commands\n\n| COMMAND | FUNCTION |\n| :--- | :--- |\n| :set nu\
    \ | Shows line numbers |\n| :set nonu | Hides line numbers |\n| :set ic | Instructs\
    \ searches to ignore case |\n| :set noic | Instructs searches to be case-sensitive\
    \ |\n| :set list | Displays invisible characters, such as ^I for a Tab and $ for\
    \ end-of-line characters |\n| :set nolist | Turns off the display of invisible\
    \ characters |\n| :set showmode | Displays the current mode of operation |\n|\
    \ :set noshowmode | Turns off the mode of operation display |\n| :set set | Displays\
    \ all the vi variables that are set |\n| :set all | Displays all vi variables\
    \ and their current values |\n\nThe table in the slide describes some of the variables\
    \ of the set command.\n\n![](img/39c8fbde7fc51cbef611f658dfbb1fe2_109_0.png)\n\
    \n# CHAPTER 8 - DISPLAYING THE DIRECTORY CONTENT\n\nls -options\n\nThe ls command\
    \ displays the content of a directory.\nSyntax: ls -options filename\n\n```\n\
    [student@krosum ~]$ pwd\n/home/student\n[student@krosum ~]$ ls\nDesktop Downloads\
    \ Parental Public Videos\nDocuments Music Pictures Templates\n[student@krosum\
    \ ~]$_\n```\n\nTo list the files and directories in the current directory, type\
    \ ls command without arguments.\n\nTo display the content of a **specific directory**\
    \ *within the current working directory*, type `ls` command followed by the directory\
    \ name in both ways (absolute way or relative way).\n\n```\n[student@krosum ~]$\
    \ ls\nDesktop Downloads Parent1 Public Videos\nDocuments Music Pictures Templates\n\
    [student@krosum ~]$ ls Parent1\nChild2 Child3\n[student@krosum ~]\n[student@krosum\
    \ ~]$ ls /Parent1 # Relative Path\nChild1 Child2 Child3\n[student@krosum ~]$ ls\
    \ /home/student/Parent1 # absolute path\nChild1 Child2 Child3\n[student@krosum\
    \ ~]$ █\n```\n\n```\n[student@krosum ~]$ whoami\nstudent\n[student@krosum ~]$\
    \ # student(non-root) user can list out files\n[student@krosum ~]$ # --------------------\
    \ under /tmp directory\n[student@krosum ~]$ ls /tmp\nD01 ProjectA systemd-private-fArl7\n\
    ModuleB ssh-ntAsNIQD321F systemd-private-NICOf0Q\nParent2 systemd-private-blYHK6\
    \ vmware-root\n[student@krosum ~]$ ls /var/log/audit/\n[student@krosum ~]\nls:\
    \ cannot open directory /var/log/audit/: Permission denied\n[student@krosum ~]$\
    \ █\n```\n\nIf we don't have permission to list out files from a specific directory,\
    \ then an error message will be received as permission denied.\n\nNote: If input\
    \ directory is not present in current working directory location, enter the ls\
    \ command with the complete path of input directory.\n\n# 1. ls -l\n\nThe *ls\
    \ -l* command displays a long listing of file information.\n\n![](img/39c8fbde7fc51cbef611f658dfbb1fe2_112_0.png)\n\
    \nThe following is a brief explanation of the parts of the long list displayed\
    \ in the snap:\n\n- The *first character* is the *file type*. (refer file permission\
    \ for more details)\n- The second nine characters indicate the file permissions:\
    \ r means readable, w means writable, x means executable, and the – means denied.\n\
    - The third section (as single number) is the link count.\n- The fourth section\
    \ is the owner(student).\n- The fifth section is the group(class).\n- The sixth\
    \ section is the file size.\n- The seventh section is the date.\n- The eighth\
    \ section is the file name.\n\n# 2. ls -a\n\n- The ls -a command lists all files\
    \ in a directory, including hidden files.\n\n```\n[student@krosum Parent1]$ ls\n\
    Child1 Child2 Child3 p1.c process.log\n[student@krosum Parent1]$ ls -a\n  .. Child1\
    \ Child2 Child3 p1.c process.log\n[student@krosum Parent1]$\n[student@krosum Parent1]$\
    \ mkdir .Demo # creating hidden directory\n[student@krosum Parent1]$\nChild1 Child2\
    \ Child3 p1.c process.log\n[student@krosum Parent1]$ ls -a\n  .. Child1 Child2\
    \ Child3 .Demo p1.c process.log\n[student@krosum Parent1]$\n```\n\n- Some files\
    \ are restricted to be displayed on the list, given by the usual format of ls\
    \ command.\n- Hidden files often contain information that customizes your working\
    \ environment.\n- You can use the ls-command to list all files in a directory,\
    \ including the hidden files.\n\nNote: A single period (.) represents the current\
    \ working directory. The double period (..) represents the parent directory, which\
    \ itself contains the current working directory.\n\n# 3. ls -t\n\nSyntax:\n\n\
    ```\n[student@krosum Parent1]$ ls\nChild1 Child2 Child3 p1.c process.log\n[student@krosum\
    \ Parent1]$\n[student@krosum Parent1]$ ls -t\npl1.c process.log Child3 Child2\
    \ Child1\n[student@krosum Parent1]$\n```\n\nls -t option (time - sort by modification\
    \ time)\n\n```\n[student@krosum Parent1]$ ls\nChild1 Child2 Child3 pl.c process.log\n\
    [student@krosum Parent1]$ ls -a # list all hidden files\n.. Child1 Child2 Child3\
    \ .Demo pl.c process.log\n[student@krosum Parent1]$$\n[student@krosum Parent1]$\
    \ ls -t # recently modified time\npl.c process.log Child3 Child2 Child1\n[student@krosum\
    \ Parent1]$$\n[student@krosum Parent1]$ ls -ta -a all -t modified time\n.Demo\
    \ pl.c process.log Child3 Child2 Child1 ..\n[student@krosum Parent1]$ ls -at -\
    \ ls ls -ta and ls -at both are same\n.Demo pl.c process.log Child3 Child2 Child1\
    \ _\n[student@krosum Parent1]$ _\n```\n\n# 4. ls -r\n\nSyntax: ls -r (reverse\
    \ order)\n\n```\n[student@krosum ~]$ ls\nDesktop Downloads Parent1 Public Videos\n\
    Documents Music Pictures Templates\n[student@krosum ~]$ ls -r\nVideos Public Parent1\
    \ Downloads Desktop\n[student@krosum ~]$\n```\n\nDefault ls will display the list\
    \ in alphabetical order. The -r option shows the list in reverse order.\n\n# 5.\
    \ ls -R\n\nSyntax: ls -R lists contents of directories recursively.\n\n```\n[student@krosum\
    \ Parent1]$ ls\nChild1 Child2 Child3 p1.c process.log\n[student@krosum Parent1]$\
    \ ls -R\nParent1:\nChild1 Child2 Child3 p1.c process.log\n.Demo:\n  .. .Demo\n\
    ```\n\n# 6. ls -S\n\nSyntax: ls -S helps to sort files by size.\n\n```\n[student@krosum\
    \ Parent1]$ ls -S\nprocess.log pl1.c Child3 Child2 Child1\n```\n\n# 7. Combine\
    \ multiple options\n\nCombining multiple options -rl (or -lr) shows the long list\
    \ recursively.\n\n[student@krosum ~]$ ls -lr\ntotal 0\ndrwxr-xr-x. 2 student student\
    \ 6 Sep 23 2017 Videos\ndrwxr-xr-x. 2 student student 6 Sep 23 2017 Templates\n\
    drwxr-xr-x. 2 student student 6 Sep 23 2017 Public\ndrwxr-xr-x. 2 student student\
    \ 6 Sep 23 2017 Pictures\ndrwxr-xr-x. 2 student student 6 Sep 23 2017 Music\n\
    drwxr-xr-x. 2 student student 6 Sep 23 2017 Downloads\ndrwxr-xr-x. 5 student student\
    \ 46 Mar 20 00:42 Desktop\n"
  mdcn: "\n\n# 会话自定义\n\n要为你所有的 vi 会话创建自动自定义，请按照以下步骤操作：\n\n- 1. 在你的家目录下创建一个名为 .exrc\
    \ 的文件。\n- 2. 在 .exrc 文件中输入任何已设置的变量。\n- 3. 输入每个设置的变量时无需加前面的冒号。\n- 4. 每个命令单独占一行。\n\
    \n每当你打开一个 vi 会话时，vi 编辑器都会读取你家目录下的 .exrc 文件，无论你当前的工作目录何处。\n\n注意：自定义 Vim 编辑器的会话也适用于相同的步骤。不同之处在于，你不需要创建一个\
    \ .exrc 文件，而是需要创建一个 .vimrc 文件。\n\n# 会话自定义命令\n\n| 命令 | 功能 |\n| :--- | :--- |\n\
    | :set nu | 显示行号 |\n| :set nonu | 隐藏行号 |\n| :set ic | 设定搜索忽略大小写 |\n| :set noic\
    \ | 搜索对大小写敏感 |\n| :set list | 显示不可见字符，例如 Tab 的 `^I` 和行尾符的 `$` |\n| :set nolist\
    \ | 关闭不可见字符的显示 |\n| :set showmode | 显示当前操作模式 |\n| :set noshowmode | 关闭操作模式显示 |\n\
    | :set set | 显示所有已设置的 vi 变量 |\n| :set all | 显示所有 vi 变量及其当前值 |\n\n幻灯片中的表格描述了 `set`\
    \ 命令的一些变量。\n\n![](img/39c8fbde7fc51cbef611f658dfbb1fe2_109_0.png)\n\n# 第 8 章 -\
    \ 显示目录内容\n\nls -options\n\nls 命令显示目录的内容。\n语法：ls -options filename\n\n```\n[student@krosum\
    \ ~]$ pwd\n/home/student\n[student@krosum ~]$ ls\nDesktop Downloads Parental Public\
    \ Videos\nDocuments Music Pictures Templates\n[student@krosum ~]$_\n```\n\n要列出当前目录下的文件和目录，请直接输入不带参数的\
    \ ls 命令。\n\n要显示*当前工作目录内***特定目录**的内容，请输入 `ls` 命令后跟目录名称（使用绝对路径或相对路径均可）。\n\n```\n\
    [student@krosum ~]$ ls\nDesktop Downloads Parent1 Public Videos\nDocuments Music\
    \ Pictures Templates\n[student@krosum ~]$ ls Parent1\nChild2 Child3\n[student@krosum\
    \ ~]\n[student@krosum ~]$ ls /Parent1 # 相对路径\nChild1 Child2 Child3\n[student@krosum\
    \ ~]$ ls /home/student/Parent1 # 绝对路径\nChild1 Child2 Child3\n[student@krosum ~]$\
    \ █\n```\n\n```\n[student@krosum ~]$ whoami\nstudent\n[student@krosum ~]$ # student(非root)\
    \ 用户可以列出文件\n[student@krosum ~]$ # -------------------- 在 /tmp 目录下\n[student@krosum\
    \ ~]$ ls /tmp\nD01 ProjectA systemd-private-fArl7\nModuleB ssh-ntAsNIQD321F systemd-private-NICOf0Q\n\
    Parent2 systemd-private-blYHK6 vmware-root\n[student@krosum ~]$ ls /var/log/audit/\n\
    [student@krosum ~]\nls: cannot open directory /var/log/audit/: Permission denied\n\
    [student@krosum ~]$ █\n```\n\n如果我们没有权限从特定目录列出文件，将收到“permission denied”（权限拒绝）的错误信息。\n\
    \n注意：如果输入目录不在当前工作目录位置，请使用输入目录的完整路径输入 ls 命令。\n\n# 1. ls -l\n\n*ls -l* 命令显示文件信息的详细列表。\n\
    \n![](img/39c8fbde7fc51cbef611f658dfbb1fe2_112_0.png)\n\n以下是对快照中显示的详细列表各部分的简要说明：\n\
    \n- *第一个字符*是*文件类型*。（更多细节请参阅文件权限）\n- 第二九个字符表示文件权限：r 表示可读，w 表示可写，x 表示可执行，– 表示拒绝。\n\
    - 第三个部分（单个数字）是链接数。\n- 第四部分是所有者(student)。\n- 第五部分是用户组(class)。\n- 第六部分是文件大小。\n-\
    \ 第七部分是日期。\n- 第八部分是文件名。\n\n# 2. ls -a\n\n- ls -a 命令列出目录中的所有文件，包括隐藏文件。\n\n```\n\
    [student@krosum Parent1]$ ls\nChild1 Child2 Child3 p1.c\n[student@krosum Parent1]$\
    \ ls -a\n. .. Child1 Child2 Child3 p1.c\n[student@krosum Parent1]$ mkdir .Demo\
    \ # 创建隐藏目录\n[student@krosum Parent1]$ ls\nChild1 Child2 Child3 \n[student@krosum\
    \ Parent1]$ ls -a\n. .. .Demo Child1 Child2 Child3 p1.c\n```\n\n- ls 命令会列出目录中的所有文件，包括隐藏文件。\n\
    - 你可以使用 ls 命令列出所有文件。\n- 隐藏文件通常包含目录信息。\n\n注意：单点 (.) 表示当前目录。双点 (..) 表示父目录。\n\n#\
    \ 3. ls -t\n\n语法：\n\n```\n[student@krosum Parent1]$ ls\nChild1 Child2 Child3 p1.c\n\
    [student@krosum Parent1]$\n```\n\nls -t 选项（按时间排序）\n\n```\n[student@krosum Parent1]$\
    \ ls -t\np1.c Child3 Child2 Child1\n[student@krosum Parent1]$\n```\n\nls -t 选项（按时间排序）\n\
    \n# 4. ls -r\n\n语法：ls -r（逆序）\n\n```\n[student@krosum ~]$ ls\nDesktop Downloads\
    \ Parental Public Videos\nDocuments Music Pictures Templates\n[student@krosum\
    \ ~]$ ls -r\nVideos Public Parental Downloads Desktop\n[student@krosum ~]$\n```\n\
    \n默认 ls 按字母顺序显示。-r 选项按逆序显示。\n\n# 5. ls -R\n\n语法：ls -R 递归列出目录。\n\n```\n[student@krosum\
    \ Parent1]$ ls\nChild1 Child2 Child3 p1.c\n[student@krosum Parent1]$ ls -R\nParent1:\n\
    Child1 Child2 Child3 p1.c\n.Demo:\n  .. .Demo\n```\n\n# 6. ls -S\n\n语法：ls -S 帮助文件大小排序。\n\
    \n```\n[student@krosum Parent1]$ ls -S\np1.c Child3 Child2 Child1\n```\n\n# 7.\
    \ 组合选项\n\n组合多个选项 -rl（或 -lr）递归显示详细列表。\n\n"
