- md: "\n# Step 2 - (MBR) Master Boot Record\n\n## What is Master Boot Record (MBR)?\n\
    Master Boot Record is the first place where boot loader begins to start. MBR is\
    \ a 512 byte sector located in the first sector of hard disk. MBR contains both\
    \ program code and partition table details.\n\n![](img/39c8fbde7fc51cbef611f658dfbb1fe2_25_0.png)\n\
    \n## MASTER BOOT RECORD (MBR)\n\nOn a computer with x86 architecture, the Master\
    \ Boot Record (MBR) is the first 512 bytes of the boot drive that is read into\
    \ memory by the BIOS.\n\nThe first 446 bytes out of 512 bytes contain low-level\
    \ boot code. For some boot loaders, the code in the MBR points to further boot\
    \ loader stored somewhere else on the disk or on another disk.\n\nThe next 64\
    \ bytes contain the partition table for the disk where file system utilities like\
    \ fdisk, cfdisk, partedetc., are placed and using these utilities, we can get\
    \ partition table information.\n\nThe last two bytes are the boot signature, which\
    \ is used for error detection.\n\n# Step 3 - Boot Loader\n\nSo far we are aware\
    \ that when POST is done successfully, the BIOS will execute MBR code. MBR code\
    \ contains information about boot loader and this MBR executes the boot loader.\
    \ So let us now see what this boot loader is?\n\nThe boot loader software runs\
    \ when a computer starts. It is responsible for loading and transferring control\
