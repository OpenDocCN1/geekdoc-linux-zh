    \ |\n|---|---|---|\n| 0 | rw- | rwx |\n| 1 | rw- | rw- |\n| 2 | r-- | r-- |\n\
    | 3 | r-- | r-- |\n| 4 | -w- | -wx |\n| 5 | -w- | -w- |\n| 6 | --- | - |\n\n-\
    \ The table shows the file and directory permissions for each of the umask octal\
    \ value.\n- This table can also help us to determine the umask value that we want\
