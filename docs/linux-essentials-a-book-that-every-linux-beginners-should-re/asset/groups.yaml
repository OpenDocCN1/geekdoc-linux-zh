    \ 1 emp.csv\n101\n203\n432\n323\n894\n245\n456\n399\n```\n\n```bash\n[student@krosum~]$\
    \ cut -d, -f 2,4 emp.csv\nkumar,pune\narun,bglore\nvijay,chennai\nxerox,mumbai\n\
    vijay,delhi\ntheeba,hyd\nram,pune\nkarthik,bglore\n```\n\nHow to filter employee\
    \ name, and employee working city name?\n\nHow to filter from 2nd field to 4th\
    \ field(range) from emp.csv file?\n\n```bash\n[student@krosum ~]$ cut -d, -f 2,4\
    \ emp.csv\nkumar,pune\narun,bglore\nvijay,chennai\nxerox,mumbai\nvijay,delhi\n\
    theeba,hyd\nram,pune\nkarthik,bglore\n[student@krosum ~]$ cut -d, -f 2-4 emp.csv\n\
    kumar,sales,pune\narun,prod,bglore\nvijay,sales,chennai\nxerox,HR,mumbai\nvijay,prod,delhi\n\
    theeba,hr,hyd\nram,sales,pune\nkarthik,prod,bglore\n```\n\n# Paste command\n\n\
    The paste command combines lines together. It gets its input from two or more\
    \ files.\n\n# Syntax\n\n```\npaste filename1 filename2 .. filename\n[student@krosum\
    \ ~]$ cat -n p1.log \n[student@krosum ~]$ cat -n p2.log\n  1 data1           \
    \      1 DATA1\n  2 data2                 2 DATA2\n  3 data3                 3\n\
    \  4                       4\n  5 data5                 5\n  6               \
    \        6\n  7 data7                 7 DATA-END\n[student@krosum ~]$ paste p1.log\
    \ p2.log\ndata1                   DATA1\ndata2                   DATA2\ndata3\n\
    \ndata5\n\ndata7                 DATA-END\n[student@krosum ~]$\n```\n\nUsing paste\
    \ command we can combine multiple files.\n\npaste command treats each file as\
    \ a column. If there are more than two files, the corresponding lines from each\
    \ file, separated by tabs, are written to the output stream. The above input file\
    \ p1.log file contains 7lines including 2 empty lines (line 4 and line 6). The\
    \ input file p1.log p2.log file contains 7lines including 5 empty lines. So when\
    \ we combine p1.log and p2.log together, the input file p1.log becomes 1st column\
    \ and file p2.log becomes 2nd column.\n\nNote : the cat and paste commands are\
    \ similar for combining multiple files. However the cat command combines files\
    \ vertically (by lines) whereas the paste command combines files horizontally\
    \ (by columns).\n\n```bash\n$student@krosum-$ cat p1.log p2.log\n[student@krosum-$]$\
    \ paste p1.log p2.log\ndata1 DATA1\ndata2 DATA2\ndata3 DATA3\ndata5\ndata7 DATA-END\n\
    [student@krosum-$]\n```\n\n```bash\n$student@krosum ~]$ cat -n IP1\n1 data1\n\
    2 data2\n3 data3\n4 data4\n5 data5\n[student@krosum ~]$ cat -n IP2\n1 DATA1\n\
    2 DATA2\n[student@krosum ~]$ paste IP1 IP2\ndata1 DATA1\ndata2 DATA2\ndata3\n\
    data4\ndata5\n[student@krosum ~]$\n```\n\nIf the files differ in, if each file\
    \ contains different number of lines, then all data are still written to the output\
    \ with a delimiter. For example, if the first file is longer than the second file,\
    \ paste writes the extra data from the first file with a separation delimiter,\
    \ such as tab.\n\nIf the first file is shorter than the second file, paste writes\
    \ a delimiter followed by the extra data from the second file to the output stream.\
    \ The below example shows input file IP2 and IP1 combined. See the highlighted\
    \ box for the above case.\n\n```bash\n[student@krosum ~]$ cat -n IP1\n1 data1\n\
    2 data2\n3 data3\n4 data4\n5 data5\n[student@krosum ~]$ cat -n IP2\n1 DATA1\n\
    2 DATA2\n[student@krosum ~]$ paste IP1 IP2\ndata1 DATA1\ndata2 DATA2\ndata3\n\
    data4\ndata5\n[student@krosum ~]$ $student@krosum ~]$ paste IP2 IP1\nDATA1 data1\n\
    DATA2 data2\ndata3\ndata4\ndata5\n[student@krosum ~]$ $student@krosum ~]$ paste\
    \ IP1 IP2\ndata1 DATA1\ndata2 DATA2\ndata3\ndata4\ndata5\n[student@krosum ~]$\
    \ $student@krosum ~]$ paste -d IP1 IP2\ndata1 DATA1\ndata2 DATA2\ndata3\ndata4\n\
    data5\n[student@krosum ~]$\n```\n\nWe can specify delimiters using -d option to\
    \ separate the data. The option -s converts each file to single line. Input file1\
    \ is placed at line1 and input file2 is placed at line2.\n\n```bash\n[student@krosum\
    \ ~]$ paste IP1 IP2\ndata1 DATA1\ndata2 DATA2\ndata3\ndata4\ndata5\n[student@krosum\
    \ ~]$ paste -s IP1 IP2\ndata1 DATA1data2 DATA2data3data4data5\n[student@krosum\
    \ ~]$\n```\n\n# sort command\n\nThe sort command is one of important filter commands\
    \ in Linux.\n\nWhen dealing with large volume of data, need to organize them for\
    \ analysis and efficient processing. One of the simplest and powerful techniques\
    \ is sorting.\n\nWhen we sort data, we arrange them in sequence. Usually, we use\
    \ ascending order. By default all elements are sorted based on the first character\
    \ of elements. We can also sort them in descending order, in which each piece\
    \ of data is smaller than its predecessor.\n\n```bash\n[student@krosum ~]$ cat\
    \ names.txt\nkumar\narun\nvijay\nxerox\ntheeba\nram\nkarthik\n[student@krosum\
    \ ~]$ sort names.txt\narun\nkarthik\nkumar\ntheeba\nvijay\nxerox\n```\n\nSort\
    \ uses ASCII value of each character. If you want to sort them in reverse order,\
    \ use -r (reverse).\n\n```bash\n[student@krosum ~]$ sort -r names.txt\nxerox\n\
    vijay\ntheeba\nram\nkarthik\narun\n[student@krosum ~]$\n```\n\n# Sort based on\
    \ fields\n\n```bash\n[student@krosum ~]$ sort -t, -k 2 emp.csv\n203,arun,prod,bglore,1245\n\
    399,karthik,prod,bglore,5904\n101,kumar,sales,pune,1000\n456,ram,sales,pune,8905\n\
    245,theeba,hr,hyd,9000\n394,vijay,prod,delhi,4590\n432,vijay,sales,chennai,3500\n\
    323,xerox,HR,mumbai,5490\n[student@krosum ~]$\n```\n\nEmployee names are sorted\
    \ order. If we want to sort the content based on the input field, there is an\
    \ option called -t (delimiter). Once the delimiter is identified, all the data\
    \ are separated in multiple columns and using -k option, we can specify the particular\
    \ column where the sorting is to done.\n\n```bash\n[student@krosum ~]$ sort -t,\
    \ -rk 2 emp.csv\n323,xerox,HR,mumbai,5490\n432,vijay,sales,chennai,3500\n894,vijay,prod,delhi,4590\n\
    245,theeba,hr,hyd,9000\n456,ram,sales,pune,8905\n101,kumar,sales,pune,1000\n399,karthik,prod,bglore,5904\n\
    203,arun,prod,bglore,1245\n```\n\nEmployee names are reverse order. See the above\
    \ snap used multiple options. -t to specify the delimiter to be specified in input\
    \ file. Here the delimiter used is comma (,).\n\n-k (key) field value (-k 2 -\
    \ 2nd field) the option -r (reverse) descending order.\n\nThe above example (sort\
    \ -t, -rk2 emp.csv) displays employee names in descending order format.\n\n# Numerical\
    \ sort fields\n\nSort filter considers every data in ASCII format. In other words\
    \ it sorts data as though they are strings of characters.\n\n```bash\n[student@krosum\
    \ ~]$ cat digits\n1000\n1245\n3500\n5490\n4590\n9000\n8905\n5904\n[student@krosum\
    \ ~]$ sort digits\n1000\n1245\n3500\n4590\n5490\n5904\n8905\n9000\n```\n\nIn the\
    \ below example, input file contains numbers (digits) which when sorted displays\
    \ the numbers in ascending order (ASCII code) format.\n\nUsing -n (numeric) option,\
    \ we can perform numerical sorting.\n\n```bash\n[student@krosum ~]$ sort digits\n\
    1000\n1245\n3500\n4590\n5490\n5904\n8905\n9000\n[student@krosum ~]$\n```\n\nSee\
    \ the above input file (digits) sort-n option displayed numerical sorting.\n\n\
    # Reverse (Descending) order\n\nTo sort the data from largest to smallest value\
    \ (descending order), we can combine -n and -r options.\n\n```bash\n[student@krosum\
    \ ~]$ sort -n digits\n1000\n1245\n3500\n4590\n5490\n5904\n8905\n9000\n[student@krosum\
    \ ~]$ sort -nr digits\n9000\n8905\n5904\n5490\n4590\n3500\n1245\n1000\n[student@krosum\
    \ ~]$\n```\n\nTask: From the below sample file emp.csv file, we can understand\
    \ how to sort employee salary amount in descending order (largest to smallest)?\n\
    \nbash\n[student@krosum]$ sort -t, -nrk5 emp.csv\n245,theeba,hr,hyd,9000\n456,ram,sales,pune,8905\n\
    399,karthik,prod,bglore,5904\n323,xerox,HR,mumbai,5490\n894,vijay,prod,delhi,4590\n\
    432,vijay,sales,chennai,3500\n203,arun,prod,bglore,1245\n101,kumar,sales,pune,1000\n\
    ```\n\n-input file data are separated by comma (,) - delimiter\n\n-reverse order\n\
    \n-k(key) field value , our input file salary (digits) are 5th field -k5\n\n#\
    \ Merge files\n\nA merge combines multiple sorted files into single sorted file.\
    \ If we know the files are already ordered, we can save time by using the merge\
    \ option (-m). However, if the files are not ordered, sort will not give you an\
    \ error message.\n"
