    # Redirecting Standard Output


    +   The greater-than (>)meta-character redirects the standard output to a file
    instead of printing them to the screen.

    command>filename

    or

    command1> filename


    +   If the file does not exist, the system creates it. If the file exists, the
    file overwrites the content of the file.

    For example, the writes the output of current process command to process.log

    ps>process.log


    ```

    student@krosum ~]$ ps\PID TTY TIME CMD

    8206 pts/0 00:00:01 bash

