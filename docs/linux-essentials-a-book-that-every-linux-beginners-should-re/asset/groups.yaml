    245,theeba,hr,hyd,9000\n```\n\n员工姓名已排序。如果我们想根据输入字段进行排序，可以使用 `-t` 选项指定分隔符。在这里使用的分隔符是逗号（`,`）。使用\
    \ `-k` 字段选项（`-k 2` 表示第 2 列）指定特定列完成排序。\n\n```bash\n[student@krosum ~]$ sort -t,\
    \ -k 2 emp.csv\n203,arun,prod,bglore,1245\n399,karthik,prod,bglore,5904\n101,kumar,sales,pune,1000\n\
    456,ram,sales,pune,8905\n894,vijay,prod,delhi,4590\n432,vijay,sales,chennai,3500\n\
    323,xerox,HR,mumbai,5490\n245,theeba,hr,hyd,9000\n[student@krosum ~]$\n\n# 数值字段排序\n\
    \n`sort` 过滤器考虑所有数据的 ASCII 格式。换说，它将数据视为字符串排序。\n\n```bash\n[student@krosum ~]$ cat\
    \ digits\n1000\n1245\n3500\n5490\n4590\n9000\n8905\n5904\n[student@krosum ~]$\
    \ sort digits\n1000\n1245\n3500\n4590\n5490\n5904\n8905\n9000\n```\n\n在下面的示例中，输入文件包含数字（digits），排序时按升序（ASCII\
