- md: "\n## File Compression\n\n- With the enormous amount of enterprise data that\
    \ is created and stored, there is a urgent need to conserve disk space and optimize\
    \ data transfer time.\n- There are various tools, utilities, and commands that\
    \ are used for file compression. Some of the commonly used commands are:\n   \
    \ - The compress command\n    - The gzip command\n    - The zip command\n\n##\
    \ Viewing a Compressed File: zcat Command\n\n- The zcat command prints the uncompressed\
    \ form of a compressed file to the standard output.\n- To view the content of\
    \ the filename.gz compressed file, enter the following command:\n- `zcat filename.gz`\n\
    \n**Note:** The zcat command interprets the compressed data and displays the content\
    \ of the file as if it has not been compressed.\n\n## Compressing a File: gzip\
    \ Command\n\n- Alternatively, you can use the gzip command to compress files.\n\
    - The gzip command performs the same function as the compress command, but the\
    \ gzip command generally produces smaller files.\n- For example, to compress a\
    \ set of files, file1, file2, file3 and file4, enter the following command:\n\n\
    ```\n[root@rosum Temp]# cat process.log\nPID TTY TIME CMD\n26027 pts/2 00:00:00\
    \ bash\n26240 pts/2 00:00:00 ps\n[root@rosum Temp]#\n[root@rosum Temp]# gzip process.log\n\
    [root@rosum Temp]# ls\nBackup1.tar emp.csv Backup process.log.gz Test\n[root@rosum\
    \ Temp]# cat process.log.gz\nprocess.log50tQ 0T:00:00D_wg_#=3$P5b66b)b6666$S%p6L\
    \ 6H:b=6<T[root@rosum Temp]#\n```\n\nNote: The compressed files have a .gz extension.\n\
    \n## Uncompress a File: gunzip Command\n\n- The gunzip command uncompresses a\
    \ file that has been compressed with the gzip command.\n\n`gunzip filename`\n\n\
    - To uncompress or extract the file1.gz file, use the following command:\n\n```\n\
    root@k rosum Temp]##\nroot@k rosum Temp]## ls\nBackup1.tar emp.csv JavaBackup\
    \ process.log.gz Test\nroot@k rosum Temp]##\nroot@k rosum Temp]## gunzip process.log.gz\n\
    root@k rosum Temp]## ls\nBackup1.tar emp.csv JavaBackup process.log Test\nroot@k\
    \ rosum Temp]## \n```\n\n`gunzip file1.gz`\n\n## Compressing and Archiving Multiple\
    \ Files: zip Command\n\n- The zip command compresses and archives multiple files\
    \ into a single file in one go.\n- To compress file2 and file3 into the file.zip\
    \ archive file, enter the following command:\n\n```\n[root@krosum Temp]# gzip\
    \ process.log\n[root@krosum Temp]# ls\nBackup1.tar  emp.csv JavaBackup process.log.gz\
    \ Test\n[root@krosum Temp]# zcat process.log.gz\n  PID TTY         TIME CMD\n\
    26027 pts/2    00:00:00 bash\n26240 pts/2    00:00:00 ps\n[root@krosum Temp]#\
    \ \nzip target_filenames source_filenames\n```\n\n![](img/39c8fbde7fc51cbef611f658dfbb1fe2_201_0.png)\n\
    \n## CHAPTER 13 - LINUX PROCESS\n\nAs we discussed, Linux abstractions are file\
    \ and process. We discussed what is file? What is Linux file structure? What are\
    \ file types? and what are file manipulation commands?\n\nNow let's discuss about\
    \ process.\n\nA process, also known as a task, is the running form of a program.\
    \ It means when the file enters the execution state, the execution instance of\
    \ a file (or) program (or) command called process is created.\n\nIn simpler form,\
    \ the execution of a Linux command is called process.\n\nWhenever a new process\
    \ is created, kernel will create a unique ID and this ID is called process ID\
    \ (PID).\n\n- Processes have a parent/child relationship.\n- A process can spawn\
    \ one or more children.\n- Multiple processes can run in parallel.\n- Linux command\
    \ line is an active process (Running process).\n\nWhenever a new command is executed\
    \ on the command line, execution of new command is called that child process is\
    \ created.\n\nBy the time, the shell command line process will enter in to waiting\
    \ state and once child execution is done. i.e., reached to exit state, the parent\
    \ process (shell command line) will resume to the active (Running) state.\n\n\
    ## Attributes of a Process\n\n- The kernel assigns a unique identification number\
    \ to each process called a process ID or **PID**.\n- The Kernel uses the PID to\
    \ track, control and manage the process.\n    - Each process is further associated\
    \ with a **UID** and a **GID**.\n- UIDs and GIDs indicate the process owner.\n\
    - Generally, the UID and GID values associated with a process are the same as\
    \ the UID and GID of the user who has started the process.\n\nA process consists\
    \ of a space and metadata. The process space is related to all. The metadata is\
    \ just an entry in the kernel's process table.\n\n## Process States\n\n- A process\
    \ may be in any of the following:\n    - D: Uninterruptible sleep (usually IO)\n\
    \    - R: Running or runnable\n    - S: Interruptible sleep (waiting for event)\n\
    \    - T: Stopped (by signal)\n    - Z: Defunct (zombie)\n\nThe process state\
    \ can be displayed using ps. For example, the ps command displays the following:\n\
    \n- High priority (nice)\n- Low priority (nice)\n\nThe nice value is between 0\
    \ and 19.\n\n## Process Subsystems\n\nEach time we boot, execute a command, or\
    \ start a process, it activates subsystems:\n\n- Disk I/O\n- Network\n- Memory\n\
    - CPU\n\nThe process consumes resources of these subsystems. We can view this\
    \ information using ps.\n\n## Listing System Processes\n\n- The process status\
    \ (ps) command lists the processes associated with the shell.\n- For each process,\
    \ ps displays the PID, the terminal (TTY), the cumulative time (TIME), and the\
    \ command name (CMD).\n- For example, to list the currently running processes\
    \ on the system using the ps command:\n\n```\nroot@krosum Temp]# ps\nPID TTY TIME\
    \ CMD\n1195 pts/0 00:00:00 bash\n25269 pts/0 00:00:00 ps\nroot@krosum Temp]#\n\
    ```\n\nThe ps command has several options that you can use to display additional\
    \ process information:\n\n- -a: Prints information about all processes most requested,\
    \ except process group leaders and processes not associated with a terminal.\n\
    - -e: Prints information about all the processes currently running.\n- -f: Generates\
    \ a full listing.\n- -l: Generates a long listing\n- -o format: Writes information\
    \ according to the format given.\n\nExamples for -o option:\n\n```\n[root@krosum\
    \ Temp]# ps\nPID TTY TIME CMD\n1195 pts/0 00:00:00 bash\n25270 pts/0 00:00:00\
    \ ps\n[root@krosum Temp]#\n[root@krosum Temp]# ps -o pid,cmd\nPID CMD\n1195 bash\n\
    25271 ps -o pid,cmd\n[root@krosum Temp]#\n[root@krosum Temp]# ps -f\nUID PID PPID\
    \ CIME TTY TIME CMD\nroot 1195 1191 0 12:52 pts/0 00:00:00 bash -f\nroot 25273\
    \ 1195 0 14:57 pts/0 00:00:00 ps -f\n[root@krosum Temp]#\n[root@krosum Temp]#\
    \ ps -fo pid,ppid,stime,cmd\nPID PPID STIME CMD\n1195 1191 12:52 bash\n25275 1195\
    \ 14:58 \\ -o pid,ppid,stime,cmd\n```\n\nAlso multiple -o options can be specified.\
    \ The format specification is interpreted as the space-character-separated concatenation\
    \ of all the format option arguments.\n\nUsing -o option we can filter specific\
    \ fields from process command.\n"
  mdcn: "\n\n## 文件压缩\n\n- 随着企业产生和存储的海量数据，迫切需要节省磁盘空间并优化数据传输时间。\n- 有各种工具、实用程序和命令用于文件压缩。一些常用的命令包括：\n\
    \    - `compress` 命令\n    - `gzip` 命令\n    - `zip` 命令\n\n## 查看压缩文件：zcat 命令\n\n\
    - `zcat` 命令将压缩文件的解压形式打印到标准输出。\n- 要查看 `.gz` 压缩文件的内容，请输入以下命令：\n- `zcat filename.gz`\n\
    \n**注意：** `zcat` 命令解释压缩数据并显示文件内容，就像它没有压缩一样。\n\n## 压缩文件：gzip 命令\n\n- 或者，你可以使用 `gzip`\
    \ 命令来压缩文件。\n- `gzip` 命令的功能与 `compress` 命令相同，但 `gzip` 命令通常产生更小的文件。\n- 例如，要压缩一组\
    \ file1、file2、file3 和 file4，输入以下命令：\n\n```\n[root@rosum Temp]# cat process.log\n\
    PID TTY TIME CMD\n26027 pts/2 00:00:00 bash\n26240 pts/2 00:00:00 ps\n[root@rosum\
    \ Temp]#\n[root@rosum Temp]# gzip process.log\n[root@rosum Temp]# ls\nBackup1.tar\
    \ emp.csv Backup process.log.gz Test\n[root@rosum Temp]# cat process.log.gz\n\
    process.log50tQ 0T:00:00D_wg_#=3$P5b66b)b6666$S%p6L 6H:b=6<T[root@rosum Temp]#\n\
    ```\n\n注意：压缩文件具有 `.gz` 扩展名。\n\n## 解压文件：gunzip 命令\n\n- `gunzip` 命令解压使用 `gzip` 命令压缩的文件。\n\
    \n`gunzip filename`\n\n- 要解压或提取 file1.gz 文件，请使用以下命令：\n\n```\nroot@k rosum Temp]##\n\
    root@k rosum Temp]## ls\nBackup1.tar emp.csv JavaBackup process.log.gz Test\n\
    root@k rosum Temp]##\nroot@k rosum Temp]## gunzip process.log.gz\nroot@k rosum\
    \ Temp]## ls\nBackup1.tar emp.csv JavaBackup process.log Test\nroot@k rosum Temp]##\
    \ \n```\n\n`gunzip file1.gz`\n\n## 压缩并存档多个文件：zip 命令\n\n- `zip` 命令一次性将多个文件压缩并归为一个文件。\n\
    - 要将 file2 和 file3 压缩为 file.zip 存档文件，输入以下命令：\n\n```\n[root@krosum Temp]# gzip\
    \ process.log\n[root@krosum Temp]# ls\nBackup1.tar  emp.csv JavaBackup process.log.gz\
    \ Test\n[root@krosum Temp]# zcat process.log.gz\n  PID TTY         TIME CMD\n\
    26027 pts/2    00:00:00 bash\n26240 pts/2    00:00:00 ps\n[root@krosum Temp]#\
    \ \nzip target_filenames source_filenames\n```\n\n![](img/39c8fbde7fc51cbef611f658dfbb1fe2_201_0.png)\n\
    \n## 第13 章 - LINUX 进程\n\n正如我们所讨论的，Linux 的抽象是文件和进程。我们讨论了什么是文件？Linux 文件结构是什么？文件类型有哪些？以及文件操作命令有哪些？\n\
    \n现在让我们讨论进程。\n\n进程（Process）也称为任务（Task），是程序的运行形式。这意味着当文件进入执行状态时，就会创建一个文件（或程序、或命令）的执行实例，称为进程。\n\
    \n简单来说，Linux 命令的执行被称为进程。\n\n每当创建一个新进程时，内核都会创建一个唯一的 ID，该 ID 称为进程 ID（PID）。\n\n-\
    \ 进程具有父/子关系。\n- 一个进程可以产生一个或多个子进程。\n- 多个进程可以并行运行。\n- Linux 命令行是一个活动进程（运行进程）。\n\n\
    每当在命令行上执行新命令时，新命令的执行就会创建一个该子进程。\n\n此时，shell 命令行进程将进入等待状态，一旦子执行完成（即到达退出状态），父进程（shell\
    \ 命令行）将恢复到活动（运行）状态。\n\n## 进程的属性\n\n- 内核为每个进程分配一个唯一的标识数字，称为进程 ID 或 **PID**。\n-\
    \ 内核使用 PID 来跟踪、控制和管理进程。\n    - 每个进程进一步关联一个 **UID** 和一个 **GID**。\n- UID 和 GID 表示进程所有者。\n\
    - 通常，与进程关联的 UID 和 GID 值与启动该进程的用户 UID 和 GID 相同。\n\n一个进程由空间和元数据组成。进程空间与所有内容相关。元数据只是内核进程表中的条目。\n\
    \n## 进程状态\n\n- 进程可能处于以下状态之一：\n    - D: 不可中断的睡眠（通常为 IO）\n    - R: 运行中或可运行的\n  \
    \  - S: 可中断的睡眠（等待事件）\n    - T: 停止（由信号停止）\n    - Z: 僵尸（defunct）\n\n可以使用 `ps` 显示进程状态。例如，`ps`\
    \ 命令显示以下内容：\n\n- 高优先级 (nice)\n- 低优先级 (nice)\n\nnice 值介于 0 到 19 之间。\n\n## 进程子系统\n\
    \n每当我们启动、执行命令或启动进程时，它都会激活子系统：\n\n- 磁盘 I/O\n- 网络\n- 内存\n- CPU\n\n进程消耗这些子系统的资源。我们可以使用\
    \ `ps` 查看这些信息。\n\n## 列出系统进程\n\n- 进程状态 (`ps`) 命令列出与 shell 相关的进程。\n- 对于每个进程，`ps`\
    \ 显示 PID、终端 (TTY)、累计时间 (TIME) 和命令名称 (CMD)。\n- 例如，使用 `ps` 命令列出系统当前运行的进程：\n\n```\n\
    root@krosum Temp]# ps\nPID TTY TIME CMD\n1195 pts/0 00:00:00 bash\n25269 pts/0\
    \ 00:00:00 ps\nroot@krosum Temp]#\n```\n\n`ps` 命令有几个选项可以使用来显示额外的进程信息：\n\n- -a:\
    \ 打印大多数进程的信息，但不包括进程组和与终端关联的进程。\n- -e: 打印所有当前运行的进程。\n- -f: 生成完整列表。\n- -l: 生成长列表。\n\
    - -o format: 按照给定的格式写入信息。\n\n-o 选项的示例：\n\n```\n[root@krosum Temp]# ps\nPID TTY\
    \ TIME CMD\n1195 pts/0 00:00:00 bash\n25270 pts/0 00:00:00 ps\n[root@krosum Temp]#\n\
    [root@krosum Temp]# ps -o pid,cmd\nPID CMD\n1195 bash\n25271 ps -o pid,cmd\n[root@krosum\
    \ Temp]#\n[root@krosum Temp]# ps -f\nUID PID PPID CIME TTY TIME CMD\nroot 1195\
    \ 1191 0 12:52 pts/0 00:00:00 bash -f\nroot 25273 1195 0 14:57 pts/0 00:00:00\
    \ ps -f\n[root@krosum Temp]#\n[root@krosum Temp]# ps -fo pid,ppid,stime,cmd\n\
    PID PPID STIME CMD\n1195 1191 12:52 bash\n25275 1195 14:58 \\ -o pid,ppid,stime,cmd\n\
    ```\n\n此外还可以指定多个 -o 选项。格式规范被解释为所有格式选项参数以空格分隔的连接部分。\n\n使用 -o 选项，我们可以从进程命令中过滤出特定的字段。\n\
    \n"
