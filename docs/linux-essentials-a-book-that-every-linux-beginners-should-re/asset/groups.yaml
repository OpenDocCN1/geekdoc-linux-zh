    \n# CHAPTER 9 - REGULAR FILE MANIPULATION COMMANDS\n\nSo far we know how to perform\
    \ directory manipulation actions. Now let's discuss about regular file commands.\n\
    In Linux, *Regular file (or) Ordinary file* is classified into two types.\n\n\
    - ASCII (or) TEXT File - user can read (or) understand the format.\n- ELF - user\
    \ can't read (or) understand .\n\n## How to create a new ASCII file?\n\nThere\
    \ are many ways we can create a ASCII File.\n\n1. Using **editor**\n2. Using **redirection\
    \ symbols** (<<<)\n\nFirst let's discuss about editor. Linux supports command\
    \ line editors like `vim`, `nano` etc., and GUI editors like gedit, leafpad, bluefish.\
    \ Now we will discuss about vi editor.\n\nRecap previous chapter (vi editor) on\
    \ how to use vi editor commands.\n\n# cat command\n\ncat command is read-only\
    \ command; we can read existing ASCII file from Linux command line.\n\n```\nstudent@krosum~$\
    \ vi pl.txt\nthis is test file from vi editor\nthis mode is input mode (or) insert\
    \ mode\nhow to write data to file --> go to command mode (press ESC)\ntype w -w\
    \ stands for write command\nwish to continue press 'i' insert (or) input mode\n\
    save and exit from editor ESC then type :wq\nstudent@krosum~$ vi pl.txt  # read\
    \ a existing file\nthis is test file from vi editor\nthis mode is input mode (or)\
    \ insert mode\nhow to write data to file --> go to command mode (press ESC)\n\
    type w -w stands for write command\nwish to continue press 'i' insert (or) input\
    \ mode\nsave and exit from editor ESC then type :wq\nstudent@krosum~$ \n```\n\n\
    **Task:** create a new file p1.txt. Write some text in the editor, save a file\
    \ to storage and then read input file using cat command.\n\n```\n[student@krossum\
    \ ~]$ vi ab.txt\necho \"Welcome to Linux Command line\"\necho \"Today date:`date+%D`\"\
    \necho \"Current working kernel is:``uname`\"\n\n[student@krossum ~]$ cat ab.txt\n\
    echo \"Welcome to Linux Command line\"\necho \"Today date:`date+%D`\"\necho \"\
    Current working kernel is:``uname`\"\n```\n\nTask:Create new file called ab.txt.\
    \ Write following shell commands in ab.txt and display content to monitor.\n\n\
    ```\n[student@krosum ~]$ vi pl.c\n#include<stdio.h>\nint main() {\n    printf(\"\
    Hello Linux\\n\");\n    return 0;\n}\n```\n\n```\n[student@krosum ~]$ cat pl.c\n\
    #include<stdio.h>\nint main() {\n    printf(\"Hello Linux\\n\");\n    return 0;\n\
    }\n```\n\nTask :How to write c program in Linux command line?\n\n```\n[student@krosum\
    \ ~]$ cat pl1.c # without using -n option\n#include<stdio.h>\nint main(){\n  \
    \  printf(\"Hello Linux\\n\");\n    return 0;\n}\n[student@krosum ~]$ cat -n pl1.c\n\
    1 #include<stdio.h>\n2 int main(){\n3     printf(\"Hello Linux\\n\");\n4     return\
    \ 0;\n5 }\n```\n\nUsing cat command, we can read the existing ASCII file. If you\
    \ wish viewing with line number use -n option.\n\n[student@krosum ~]$ cat /var/log/boot.log\
    \ Task :How to read existing /var/log/boot.log ?\n\nNote : cat command is not\
    \ a directory manipulation command.\n\n# Copy (cp) command\n\n- • The copy (cp)\
    \ utility creates a duplicate of a file, a set of files, or a directory.\n• If\
