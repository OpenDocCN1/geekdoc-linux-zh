  - '[PAGE 226]


    # cut command


    The basic purpose of the cut command is to extract one or more columns of data
    from standard input or from the input files.


    The syntax of the cut command


    ```

    cut -optionfilter_rangeinputfile (or) commandresult| cut-option filter_range

    ```


    Here filter_range are numbers. We can perform character based filtering or filtering
    based on input field delimiter.


    For character filter, use -c option. See the below example that shows filtering
    2nd character from input file (emp.csv). Character positions work when the data
    is aligned in fixed columns.


    ```

    [student@krosum~$ cat -n emp.csv # This is sample input file

    1 101,kumar,sales,pune,1000

    2 203,arun,prod,bglore,1245

    3 432,vijaj,sales,chennai,3500

    4 523,xerox,HR,mumbai,5490

    5 594,vijaj,prod,delhi,4590

    6 645,theeba,hr,hyd,9000

    7 755,ram,sales,pune,8905

    8 899,karthik,prod,bglore,5904

    [student@krosum~$ cut -c 2 emp.csv


    [student@krosum~$ ]

    ```'
