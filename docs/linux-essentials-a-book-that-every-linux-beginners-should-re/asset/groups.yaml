- md: "\n# mv options\n\n- Move has only two options\n1. Interactive (-i)\n2. Force\
    \ (-f)\n\n```\n$student@krusum Demo$ ls repo\nab.sh p3.log r1.sh repo test1.c\
    \ updated_repo\np2.process.log r2.sh result test2.c vmreport.log\n$student@krusum\
    \ Demo$ cat p2.log\n19:11:50 up 13:30, 3 users, load average: 0.00, 0.01, 0.05\n\
    $student@krusum Demo$ cat repo\np2.log p2.log process.test1\n$student@krusum Demo$\
    \ cat repo/p2.log\nPID TTY      TIME CMD\n2010 pts/0    00:00:04 bash\n3773 pts/0\
    \    00:00:00\n$student@krusum Demo$ mv p2.log repo # repo directory file contains\
    \ p2.log file\n# overwrite repo/p2.log file\n$student@krusum Demo$ cat repo/p2.log\n\
    19:11:50 up 13:30, 3 users, load average: 0.00, 0.01, 0.05\n$student@krusum Demo$\n\
    ```\n\nIf the file already exists, its old contents are destroyed unless we use\
    \ the interactive flag (-i) to warn us on, such as move operation. If the interactive\
    \ flag is on, move asks if we want to destroy the existing file.\n\n```\n[student@krosum\
    \ Demo]$ cat test2.c\n#include<stdio.h>\nint main() {\n    printf(\"Hello\\n\"\
    );\n    return 0;\n}\n[student@krosum Demo]$ cat repo/test2.c\n#include<stdio.h>\n\
    int main() {\n    printf(\"Hello\\n\");\n    printf(\"This is test2 program file\\\
    n\");\n    printf(\"This is test2 program file\\n\");\n    printf(\"This is test2\
    \ program file\\n\");\n    return 0;\n}\n```\n\n- [student@krosum Demo]$ ls\n\
    \  ab.sh process.log r2.sh result.sh test2.c vmreport.log\n  p3.log r1.sh repo\
    \ test1.c updated_repo\n  [student@krosum Demo]$ cat -n test2.c\n1 #include<stdio.h>\n\
    2 int main() {\n3 printf(\"Hello\\n\");\n4 return 0;\n5 }\n  [student@krosum Demo]$\
    \ cat -n repo/test2.c\n1 #include<stdio.h>\n2 int main() {\n3 printf(\"Hello\\\
    n\");\n4 printf(\"This is test2 program file\\n\");\n5 printf(\"This is test2\
    \ program file\\n\");\n6 printf(\"This is test2 program file\\n\");\n7 return\
    \ 0;\n8 }\n  [student@krosum Demo]$ mv -i test2.c repo\nstudent@krosum Demo]$\
    \ mv -i test2.c repo\nmv: overwrite 'repo/test2.c'? n\n```\n\n# Using -i (interactive)\
    \ option\n\nSee the above snap there is no modification in test2.c placed under\
    \ repo directory.\n\n- 2. Force (-f) option\n\n```\n$student@krusum Demo$ ls -l\
    \ test2.c\n-rw-rw-r--. 1 student student 63 Mar 21 19:35 test2.c\n$student@krusum\
    \ Demo$ ls -l repo/test2.c\n-rw-rw-r--. 1 student student 63 Mar 21 18:04 repo/test2.c\n\
    $student@krusum Demo$ mv -f test2.c repo\n$student@krusum Demo$ ls -l repo/test2.c\n\
    -rw-rw-r--. 1 student student 63 Mar 21 19:35 repo/test2.c\n$student@krusum Demo$\n\
    ```\n\nIf we are sure that we want to write it, even if it already exists, we\
    \ can skip the interactive message with the force ( -f ) option.\n\n# Link (ln)\
    \ command\n\n- The link command receives either a file or directory as input and\
    \ its output is an updated directory.\n- Two types of link in Linux\n\n- 1. Hard\
    \ link\n2. Soft link (or Symbolic link)\n\n## Hard links to Files\n\n- To create\
    \ a hard link to a file, we specify the source file and destination file.\n- If\
    \ the destination file doesn't exist, it is created.\n\n```\nstudent@krosum Demo]$\
    \ ls -li pl1.txt\nstudent@krosum Demo]$ ls -li pl1.txt\n2097307 -rw-rw-r-- 1 student\
    \ student 40 Mar 21 19:45 pl1.txt\nstudent@krosum Demo]$ ln pl1.txt p2.txt # creating\
    \ hardlink\nstudent@krosum Demo]$ ls -li pl1.txt\n2097307 -rw-rw-r-- 2 student\
    \ student 40 Mar 21 19:45 pl1.txt\n2097307 -rw-rw-r-- 2 student student 40 Mar\
    \ 21 19:45 p2.txt\n[student@krosum Demo]$ cat -n pl1.txt\n1 test1\n2 test2\n```\n\
    \n- If it exists, it is first removed and then re-created as linked file.\n- Note\
    \ in both file (pl1.txt, p2.txt) inode number is same.\n- See the below snap where\
    \ we have appended to pl1.txt file and this is automatically updated in p2.txt\
    \ file. Similarly if we append to p2.txt file, then it is automatically updated\
    \ in pl1.txt file.\n\n```\n[student@krosum Demo]$ cat >>pl1.txt\ntest3\n[student@krosum\
    \ Demo]$ cat >>pl1.txt\ntest4\n[student@krosum Demo]$ cat -n pl2.txt\n1 test1\n\
    2 test2\n3 test3\n4 test4\n``` \n```\n\nIf we delete source file (pl1.txt), the\
    \ link count is decremented but we can read destination file (p2.txt).\n\n```\n\
    [student@krosum Demo]$ ls -l pl1.txt p2.txt\n-rw-rw-r-- 2 student student 40 Mar\
    \ 21 19:45 pl1.txt\n-rw-rw-r-- 2 student student 40 Mar 21 19:45 p2.txt\n[student@krosum\
    \ Demo]$ rm pl1.txt # deleting source file\n[student@krosum Demo]$ ls\n[student@krosum\
    \ Demo]$ ls -l p2.txt\n-rw-rw-r-- 1 student student 40 Mar 21 19:45 p2.txt\n```\n\
    \n## 2. Symbolic Links\n\n- When the link (ln) is executed with no option, the\
    \ result is a hard link. If we try to create a hard link to a different file system,\
    \ it is rejected because hard links must be within the current directory.\n- To\
    \ link to a different file system, therefore, we must use symbolic links. We must\
    \ also use symbolic links when we are linking to directories.\n- There is a danger\
    \ with symbolic links because although they behave like files and directories,\
    \ they do not physically exist. They only point to real directory or file.\n-\
    \ If the physical file is deleted, the file will no longer appear on listing under\
    \ its original name. It will still be available under its symbolic link name,\
    \ but it is not accessible.\n- If a physical directory is deleted, the symbolic\
    \ link to the directory still exists. In that case if we try to list the symbolic\
    \ directory, it lists with no files. However, if we try to move to it, we receive\
    \ a message that it doesn't exist.\n\n```\n[student@krosum Demo]$ ls\na.txt b.txt\n\
    [student@krosum Demo]$ cat a.txt\ntest file name\nTEST FILE DATA\n1232121312\n\
    [student@krosum Demo]$ cat b.txt\ntest file name\nTEST FILE DATA\n1232121312\n\
    [student@krosum Demo]$ rm a.txt\n[student@krosum Demo]$ ls\nb.txt\n[student@krosum\
    \ Demo]$ file b.txt\nb.txt: broken symbolic link to 'a.txt'\n[student@krosum Demo]$\
    \ cat b.txt\ncat: b.txt: No such file or directory\n```\n\n```\n[student@krosum\
    \ Demo]$ ls\na.txt\n[student@krosum Demo]$ ln -s a.txt b.txt\n[student@krosum\
    \ Demo]$ ls -l a.txt b.txt\n-rw-rw-rw. 1 student student 5 Mar 21 20:11 b.txt\
    \ -> a.txt\nlrwxrwxr-x. 1 student student 5 Mar 21 20:11\n[student@krosum Demo]$\
    \ ls -i a.txt b.txt\n2097308 a.txt 2097307 b.txt\n[student@krosum Demo]$ cat a.txt\n\
    test file name\n[student@krosum Demo]$ cat b.txt\ntest file name\n[student@krosum\
    \ Demo]$ cat >>a.txt\ntest FILE DATA\n[student@krosum Demo]$ cat b.txt\ntest file\
    \ name\nTEST FILE DATA\n[student@krosum Demo]$ cat >>b.txt\n1232121312\n```\n\n\
    | DESCRIPTION | HARD LINK | SOFT LINK |\n| :--- | :--- | :--- |\n| SYNTAX | ln-source\
    \ target | ln-source target |\n| INODE | Same for both source and target files.\
    \ | Different for source and target file. |\n| LINK COUNT | Increased | Single\
    \ link count |\n| FILE ACCESSIBILITY | If we delete source file, we can able to\
    \ access target file. | If we delete file,target is broken and we can't access\
    \ |\n\n# Remove (rm) command\n\n- The **remove (rm)** utility *deletes* an entry\
    \ from a directory and file. To delete a **file**, we must have write permission.\n\
    \n```\n[student@krosum Demo]$ ls\nprocess.log\n[student@krosum Demo]$ rm process.log\n\
    [student@krosum Demo]$ ls\n[student@krosum Demo]$\n```\n\nIn the above snap, process.log\
