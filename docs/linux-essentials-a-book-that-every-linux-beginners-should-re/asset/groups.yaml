    \ ~]$\n```\n\n如果文件内容不一致，如果每个文件包含的行数不同，所有数据仍会带有分隔符写入输出中。例如，如果第一个文件比第二个文件长，`paste`\
    \ 将带有分隔符（如制表符）写入第一个文件的额外数据。\n\n如果第一个文件比第二个文件短，`paste` 将一个分隔符后跟来自第二个文件的额外数据写入输出流。下面的示例显示了输入文件\
