- - '###'
  - 3.2.4 强制性访问控制
- - '####'
  - 企业计算的首选安全机制是强制性访问控制（MAC）。在 MAC 环境中，用户无法对他们拥有的对象指定访问控制。相反，文件和目录的授权是根据系统策略授予的。每个用户都有一个由系统安全管理员定义的角色，文件访问权限根据该角色授予。角色在内核层面强制执行，用户无法绕过。
