- md: '

    # Preface


    This IBM® Redbook discusses best security practices for running Linux as a z/VM
    guest on IBM @server zSeries® and S/390® machines. This publication is intended
    for system administrators and IT architects responsible for deploying Linux servers
    running under z/VM. We consider both z/VM and Linux security topics.


    We examine the unique security and integrity features zSeries offers for consolidating
    a large number of Linux servers under z/VM. We discuss virtual machine isolation
    and common privileges assigned to VM guests. Security configuration options for
    z/VM Version 4.4 are explained.


    In this book, we also discuss Linux security topics. We examine options for hardening
    a Linux installation. Securing Linux network traffic using Secure Sockets Layer
    and Secure Shell is considered. We look at implementing a virtual private network
    using Free/VPN. Commercial firewall technology and implementation using the StoneGate
    firewall for zSeries is discussed. We examine using IBM® Access Manager in conjunction
    with an LDAP server running on z/OS® to authenticate Linux users against a RACF®
    running on z/OS.


    # The team that wrote this redbook


    This redbook was produced by a team of specialists from around the world working
    at the International Technical Support Organization, Poughkeepsie Center.


    Gregory Geiselhart is a Project Leader for Linux on zSeries at the International
    Technical Support Organization, Poughkeepsie Center.


    Ami Ehlenberger is a Staff Software Engineer and has been hired with IBM for the
    past four years. Ami was hired into the OS/390® development team in 1999 and has
    since worked in the areas of integration test, solution design, and services.
    She has a B.S. in Computer Science from Indiana University of Pennsylvania and
    an MBA in e-business from the University of Phoenix. Her expertise resides in
    LDAP, IBM WebSphere®, and IBM Tivoli Access Manager. Ami currently works for the
    Custom Technology Center, an IBM @server services organization.


    Darius Fariborz has been a Network Architect at IBM Global Services since 1995.
    He joined IBM U.K. Laboratories in 1985 and holds an MSc in Telecommunications
    and Micro-Electronics from the University of Surrey. Prior to joining IBM, Darius
    worked for International Aeroradio Limited as a software engineer from 1982 to
    1984 and as hardware design engineer for Thorn EMI Datech from 1979 to 1982. His
    main interests are in network connectivity and security.


    Jerry Lam is a Data Security Specialist in Prudential Securities, a subsidiary
    of Wachovia in the United States. He has 12 years of experience in Wall Street
    financial institutions, concentrating mainly on information security. He holds
    a B.S. in Computer Science from New York Institute of Technology. His areas of
    expertise include C programming, system auditing, network vulnerability testing,
    and security administration. This is his first ebook. He is a strong advocate
    for open-source tools for all system platforms.


    Neville Mendes is a Senior Network Engineer based at the EMEA headquarters of
    Stonesoft in Helsinki, Finland. He covers StoneGate for ZSeries classes worldwide
    in the areas of StoneGate firewall VPN and security. He also extensively implementing
    customer environments.


    Carlos Ordoz is a Senior Systems Engineer at the Poughkeepsie IBM Laboratory in
    the United States. Carlos joined IBM in 1997. He has more than 25 years of experience
    in mainframe technologies and holds a B.S. degree in Computer Science from Florida
    International University. His areas of expertise include programming, systems
    programming, and Linux on S390/zSeries. He is the Linux Lead for the zSeries New
    Technology Center. He has participated in previous ITSO residences.


    Luiz Carlos Santos is a support analyst for EDS in Brazil. He has been involved
    professionally in system administration and support since 1994. He has five years
