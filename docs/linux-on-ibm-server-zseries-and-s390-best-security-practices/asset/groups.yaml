    - 2. 监听套接字的服务器响应连接请求。


    TCP-wrappers 由 `tcpd` 守护进程实现，它在客户端和服务器之间插入了一个额外的层（或封装）。检查客户端请求并应用访问控制，以决定允许还是拒绝连接。TCP_wrappers
    提供了将传入的客户端请求记录到系统日志（syslog 守护进程）的能力。


