    # Secure Sockets Layer and the Secure Shell


    In this chapter, we describe using Secure Sockets Layer and Secure Shell to encrypt
    network data. Topics include:


    - Introduction to Secure Sockets Layer

    - Enabling OpenSSL in Apache

