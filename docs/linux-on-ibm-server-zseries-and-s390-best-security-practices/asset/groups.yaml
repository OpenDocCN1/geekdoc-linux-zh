    A and C. Example 2-5, we use the MODIFY COMMAND statement to remove authorization
    for SET SECUSER and authorize the command for the user-defined privilege class
    L.


    Example 2-5 MODIFY COMMAND statement in the SYSTEM CONFIG file


    - Modify Command,

    Set SubCmd SecUser,

    IBMClass C,

    PrivClass L


    After it is re-IPPLed, the SET SECUSER command will be authorized for privilege
    classes A and L.


    > Note: The CP COUPLE and DEFINE CTCA commands are authorized to class G users.
    This can allow two virtual machines to cooperatively establish a virtual network
    without system administrator authorization. To remove this potential, redefine
    authorization to the COUPLE or DEFINE CTCA commands.


    Using the VMLAN statement in the SYSTEM CONFIG file (as discussed in 2.5.4, “z/VM
    virtual networking” on page 16) ensures that only authorized VM Guest LANs can
    be created.


    ## 2.6 The z/VM user directory


    The z/VM user directory defines the CP characteristics of each virtual machine.
    The user directory exists on a CP-formatted disk in two forms:


    - Source format that describes the user directory

    - Compiled version (created from the source) of the user directory by the CP


    The source format of the user directory can exist as a monolithic file that contains
    the entire user directory, or as several files to define the user directory. In
    either case, the compiled format is created using the DIRECTXA utility. Example
    2-6 on page 21 illustrates the source format for a sample user directory entry.


    Example 2-6 z/VM USER directory entry


    | USER1 | USERPW | 128M | 1G * |

    | :--- | :--- | :--- | :--- |

    | INCLUDE | IBMDFLT | | |

    | IPL | 190 PARM AUTO | | |

    | LOGONBY | USER2 | | |

    | MACHINE | ESA | | |

    | MDISK | 0191 3390 21 5 440QUIR | | |

    | MDISK | 0201 3390 26 1087 440QUIR WR READ MULTIPLE | | |

    | MDISK | 0202 FB-512 V-DISK 5000 50 WV | | |

    | LINK | TCPAINT 592 59 RR | | |

    | DEDICATE | 2800 | | |


    Notable security-related statements include:


    1. The USER statement starts the user directory entry. Specific security-ity-related
    operands are discussed in 2.6.1, “The USER directory entry statement” on page
    21.

    2. Additional statements common to multiple VM directories can be included, as
    discussed in 2.6.2, “The INCLUDE statement” on page 23.

    3. The IPL statement (discussed in 2.6.3, “The IPL statement” on page 23) specifies
    a device of Named Shared Segment (NSS) to boot at logon.

    4. It is possible to define surrogate VMs, as discussed in 2.6.4, “The LOGONBY
    statement” on page 23.

    5. User midisks are defined using the MDISK statement; see in 2.6.5, “The MDISK
    statement” on page 23.

    6. Minidisks are defined among virtual machines using the LINK statement, as discussed
    in 2.6.6, “The LINK statement” on page 24.

    7. Devices can be dedicated to specific virtual machines, as discussed in 2.6.7,
    “The DEDICATE statement” on page 24.


    ## 2.6.1 The USER directory entry


    The USER statement specifies the virtual name, password, virtual machine size,
    and CP command privilege class. User names are one to eight characters in length.
    Two virtual machine size operands are recognized; the first specifies address
    space size at logon, the second specifies the maximum address size the user can
    specify using the CP DEFINE STORAGE command.


    ### Specifying user passwords


    The user password field specifies the one to eight character password required
    at logon. Special password options can be specified in the password field:


    - NOLOG

    Specifying a password value of NOLOG prevents the user from logging on. NOLOG
    virtual machines are useful for managing shared VM resources. For example, assigning
    shared minidis to a virtual machine that cannot log on is a mechanism to easily
    identify these minidisk.


    - NPASS

    If specified, the NPASS option allows the user to log on without providing a password.


    > Important: NPASS virtual machines should be considered a security exposure and
    should not be permitted in the VM directory.


    If an ESM (such as RACF for z/VM) is installed, passwords might still be required
    if the NOPASS password option is specified.


    - AUTOONLY

    The AUTOONLY password option specifies that the virtual machine can only be logged
    on using the CP XAUTLOG command. Terminal logons are disabled.


    - LBYONLY

    The LBYONLY password option specifies that the virtual machine can only be logged
    on by a surrogate user. A surrogate user is another VM user entitled to log on
    this virtual machine.


    To on as a surrogate user, use the CP LOGON command specifying the BY (where the
    BY operand is the surrogate user ID). When prompted, the surrogate user must specify
    their specific password, not the password of the logon virtual machine. An LBYONLY
    virtual machine must have at least one surrogate user defined, as discussed in
    2.6.4, “The LOGONBY statement on page 23.


    > Note: Using the LBYONLY option, it is possible for many VM users to access to
    a common virtual machine without sharing passwords. With journaling enabled, it
    is possible for a system administrator to audit access.


    ### Specifying privilege class


    Virtual machine privilege class is assigned to the USER statement. Up to 32 single
    characters can be specified (each representing a defined command privilege class,
    as discussed in 2.4, “CP privilege classes” on page 13).


    Note: If not specified or specified as "*".


    ## 2.6.2 The INCLUDE statement


    The INCLUDE statement names a profile entry to be included as part of a user definition.
    When constructing a user entry, ensure that statements in any included profile
    do not violate security policy for Linux virtual machines.


    ## 2.6.3 The IPL statement


    The IPL statement is used to boot a virtual machine at logon. In a traditional
    z/VM environment, CMS is typically IPLed. For Linux machines, the device containing
    the Linux root file system can be specified to automatically load Linux.


    ## 2.6.4 The LOGONBY statement


    The LOGONBY statement defines up to eight VM users that can act as surrogate users.
    When logging on, VM expects the surrogate user to provide their specific password.
    Surrogate users are discussed in 2.6.1, “The USER directory entry statement” on
    page 21.


    ## 2.6.5 The MDISK statement


    The MDISK statement defines minidisks and VDISKS owned by the virtual machine.
    It is possible for the user directory entry to specify passwords for minidisk
    sharing. MDISK passwords are one to eight characters in length; three types are
    recognized:


    - Read mode password

    - Write mode password

    - Multiple write mode password


    VM users linking to a minidisk (using the CP LINK command) are expected to provide
    the password appropriate for the desired access mode (read, write, or multiple
    write). For details about the disk access modes, consult the MDISK statement in
    z/VM V4R.4 CP Planning and Administration, SC24-6043.


    Passwords can be specified as ALL, in which case attempts to link to the minidisk
    succeed without requiring a password.


    > Important: To ensure a secure z/VM system, always require non-trivial passwords
    on shared minidis; disallow use of the ALL password option. In addition, always
    require password prompting (disallow passwords passed as part of CP commands)
    by disabling the PASSWORDS_ON_COMMANDS feature, as discussed in 2.5.2, “System
    features” on page 15.


    ## 2.6.6 The LINK statement


    The LINK statement allows a virtual machine to access a minidisk by another virtual
    machine. Read-only or read-write access can be granted. By using the LINK statement,
    you open the door for cross-virtual-machine access. Our recommendation is that
    you exercise extreme care if you decide to use LINK statements to authorize your
    Linux virtual machines to have access to other virtual minidisks.


    ## 2.6.7 The DEDICATE statement


    The DEDICATE statement assigns sole ownership of a real device to a virtual machine.
    For tape devices, DEDICATE assigns serial, shared access to the device with other
    virtual machines. A DEDICATED device is owned and controlled by the virtual machine.
    Be selective when dealing real devices to Linux virtual machines.

