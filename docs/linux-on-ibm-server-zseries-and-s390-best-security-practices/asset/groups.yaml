    ```\n\nVNC is a client/server application:\n\n- The VNC server runs on the remote\
    \ machine.\n- A VNC client connects to the server to access the remote machine.\n\
    \nA password is required to connect to a VNC server, and the password is encrypted\
    \ when passed across the network. However, the VNC protocol cannot be considered\
    \ secure; cleartext network traffic is transmitted. Using SSH port forwarding,\
    \ it is possible to add security to a VNC connection (data is passed over the\
    \ encrypted SSH tunnel). We outline a procedure to secure a VNC viewer running\
    \ on Windows when connecting to a Linux guest on zSeries.\n\n### 4.10.1 Installing\
    \ the VNC server\n\nVNC is available as part of the SLES 8 distribution on Linux\
    \ for zSeries. The VNC server and client are part of the VNC package. Use the\
