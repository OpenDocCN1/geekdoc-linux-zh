    MACHINE XA\nDEDICATE 7104 7140\nDEDICATE 7105 7141\nDEDICATE 7106 7142\nLINK TCPIP\
    \ 0592 0592 RR\nMDISK 0191 3390 3238 100 440U1R\nMDISK 0171 3390 0031 3338 LX15C9\n\
    MDISK 0172 3390 0031 3338 LX15CB\n```\n\n我们使用 171 和 172 虚拟磁盘用于 StoneGate。100 柱（30\
    \ MB）191 虚拟磁盘用于 StoneGate zSeries 防火墙和 VPN 安装文件。虚拟机使用虚拟地址 7104-7106 定义 OSA-Express\
    \ 适配器（实际地址 7140-7142）。\n\n"
