    ## 3.1.2 Using a central log server


    The advantages of directing syslog messages to a central log server include:


    - Simplified log administration

    With a central log server, log files from all Linux machines can be viewed and
    backed up from one location.


    - Enhanced log integrity

    If an intrusion occurs on a Linux server, the attacker can attempt to remove any
    record of the intrusion from the log files. A central log server can be hardened
    and tightly controlled. In the event a log file is modified, the central log server
    can maintain an unedited version.


    To configure syslog to accept incoming log messages, use the -r option with syslog.
    For SLES, add the -r to the SYSLOG_PARAMS variable in /etc/sysconfig/syslog:


    ```

    # if not empty: parameters for syslogd

    # for example SYSLOG_PARAMS="-r -s my.domain"

    #

    SYSLOG_PARAMS="-p"

    ```


    To make the change effect, syslog must be restarted. When restarted, syslog records
    the change to the log file (/var/log/messages):


    Mar 24 10:35:31 lnnxu2 syslog 1.4.1: restart (remote reception)


    > Note: To configure remote hosts to the central log server, use the @ syntax
    in the host''s /etc/syslog.conf file (specify the central log server IP address
    or host name).


    To test the new configuration, use the logger command. For example, the remote
    host, use the command:


    ```

    logger -p syslog.warning "test[123]: testing remote logging"

    ```


    This generates a message in the log file of the central log server:


    May 24 10:56:56 lnnxu3 root:test[123]: testing remote logging


    > Note: The -p option to the logger command specifies the facility and priority
    of the message.


    ## 3.2 Pluggable Authentication Modules


    The default mechanism used for user authentication in Linux uses Pluggable Authentication
    Modules (PAM). PAM provides centralized authentication for common services such
    as login, FTP, Telnet, and SSH. PAM is implemented using dynamic load libraries
    (DLLs). Authentication can be customized for PAM-aware services using PAM configuration
    files. Figure 3-1 illustrates PAM operation.


    ![](img/a2760634ecd5eb26c25e81867e88d740_44_0.png)


    Figure 3-1 PAM architecture


    Authentication for each PAM-aware application is configured by a configuration
    file in the /etc/pam.d directory (the file name indicates the service it configures).
    PAM modules implement user authentication; by default, PAM modules are located
    in the /lib/security directory. Some PAM modules read global configuration files
    located in the /etc/security directory.


    ### 3.2.1 PAM configuration files


    A PAM configuration file consists of lines in the form:


    ```

    module-type control-flag module-path arguments

    ```


    Each field is described in the following sections.


    ### PAM module types


    Four types of authentication mechanisms (referred to as module types) are supported.
    Each module type is described in Table 3-1.


    Table 3-1 PAM module types


    | Type | Description |

    |---|---|

    | auth | Used to authenticate a user based on user name and password |

    | account | Used to grant or deny access based on account policies (such as time
    of day) |

    | password | Used to authorize user password updates |

    | session | Used to apply settings before a session is established |


    > Note: More than one line can be specified for any PAM module type. This is referred
    to as module stacking. In this case, each module is executed first-to-last order.
    Final authentication depends on the PAM control flags.


    ### PAM control flags


    The PAM control flag determines how authentication proceeds based on a module
    return code. Table 3-2 lists the possible flags.


    Table 3-2 PAM control flags


    | Flag | Action |

    |---|---|

    | required | Required modules must return a success code for authentication to
    succeed. In every case, all stacked modules are executed, and final authentication
    succeeds only if these also succeed. |

    | requisite | Requisite modules terminate immediately on authentication failure.
    Stacked modules are executed on success. |

    | sufficient | Indicates a successful return code is sufficient for authentication.
    If a previous required module has failed, authentication will fail. |

    | optional | Optional modules are not considered crucial. PAM ignores success
    or failure codes. |


    ### PAM module paths


    The module path field specifies the DLL name used to implement the PAM check.
    Names can be specified as absolute paths or relative paths (in case, the modules
    are assumed to reside in the /lib/security directory).


    ### PAM module arguments


    PAM module arguments are generally optional and recognized by specific PAM modules.
    Table 3-3 shows some typical arguments.


    Table 3-3 PAM arguments


    | Argument | Description |

    |---|---|

    | debug | Use the syslog call to log debugging information to the system. |

    | audit | Use verbose debugging. |

    | nullock | Allows the use of blank passwords. The default is to require non-blank
    passwords. |

    | no_delay | By default, if authentication fails, the module delays 1 second before
    prompting for a new password. This argument causes the module to immediately prompt
    for a new password. |

    | no_warn | Instructs the module not to pass warning messages to the application.
    |

    | use_first_pass | The module should not prompt for a password. Instead, it should
    use the password obtained from the preceding module. If that password fails, the
    user is not authenticated. This option is intended for auth and password modules.
    |

    | try_first_pass | The module should attempt authentication with the password
    obtained from the preceding module. If that password fails, the user is prompted
    for a password. This option is intended for auth modules. |


    ### PAM configuration for the login service


    To illustrate PAM configuration, we examine the default SUSE Linux Server Version
    8 (SLES8) PAM configuration for the login service in Example 3-2.


    Example 3-2 The default /etc/pam.d/login configuration for SLES


    ```

    # PAM-1.0

    auth required pam_unix.so nullok

    auth required pam_security.so

    auth required pam_nologin.so

    auth required pam_mail.so

    account required pam_unix.so

    password required pam_pwcheck.so nullock

    password required pam_unix.so use_first_pass authok

    session required pam_unix.so none

    session required pam_limits.so

    ```


    PAM modules in this example allow for:


    1. Standard UNIX checking is provided by pam_unix.so. The pam_unix.so module supports
    all PAM types (auth, account, and session). Password checking for pam_unix.so
    depends on the contents of the /etc/nsswitch.conf file. When used as a password
    module type, pam_unix.so can require users to change expired passwords. Its actions
    are determined by the following:

    - The nullock argument permits changing an empty password (normally, empty passwords
    cause an account to be locked).

    - The use_first_pass argument locks the selection of the old and new password
    to the ones established by the previous module (in case, pam_pwcheck.so).

    - The use_authok argument sets the new password to the value by the previous module
    (again, pam_pwcheck.so).


    When used as a session module type, pam_unix.so logs the user and service type
    to syslog at the beginning and end of the session.


    2. Superuser login is restricted to secure terminals. The pam_security.so module
    enables superuser login to be limited to secure terminals. This is discussed in
    3.2.2, "Limiting superuser login to secure terminals" on page 35.


    3. Normal users can be denied login access. The pam_nologin.so module supports
    auth and account module types and is discussed in 3.2.3, "Restricting user login"
    on page 35.


    4. Mail notification can be sent using PAM. The pam_mail.so module only supports
    the auth module type. It provides the "You have new mail" service to the user.
    It also sets the MAIL environment variable to the user''s mail directory.


    5. New user passwords can be tested before being set. The pam_pwcheck.module supports
    only the password module type. It checks passwords when initially set or changed.
    It does not change the password; rather, it calls the cracklib routine to check
    password strength. Other password checks can be set in the /etc/login.defs file.


    6. System resource limits can be based on user. The pam_limits.module supports
    only the session module type. This module sets the limits of systems resources
    a user can use in a session. Superuser is not affected by this module. This module
    depends on the configuration file /etc/limits.conf.


    ## 3.2.2 Limiting superuser login to secure terminals


    Superuser access should always be restricted to a secure terminal. Network login
    by root should be denied. This can be enforced using the pam_security.so module.
    If enabled when a superuser logs in, the pam_security.so denies access unless
    the login originates from a terminal device listed in the /etc/security file.
    The default secure device defined for SLES8 is shown in Example 3-3 (the tty0
    device is the VM console).


    Example 3-3 The SLES8 default /etc/security file


    # This file contains the device names of tty lines (one per line, without leading
    /dev/) on which root is allowed to login.

    tty0


    > Important: When logging on from the VM console, passwords are not hidden on
    the terminal. Be careful to avoid exposing passwords (especially the root password)
    to anyone looking at the login terminal.


    Superuser authority is required for a network session, log in as a non-privileged
    user and then issue the sudo command to switch to superuser. Alternatively, considering
    using sudo to delegate authority as discussed in 3.3, "Delegating superuser authority
    with sudo" on page 37.


    The pam_security.module is not enabled for SSH in SLES8 installation. It might
    be desirable to deny superuser SSH network access even though the data is encrypted.
    This can help prevent an attacker from guessing the root password.


    ## 3.2.3 Restricting other user login


    At times, it might be useful to restrict non-superuser logins (for example, when
    performing system maintenance). The pam_nologin.so module can be used to

