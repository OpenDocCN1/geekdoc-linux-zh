  - '[PAGE 116]


    # Management system backups


    Proper care of system backups is an essential security precaution that should
    not be overlooked. In the event of a catastrophic failure of the Management Server
    or Log Servers, the firewall engines decide to continue operation. In the unlikely
    event the management system needs to be restored (or if you want to transfer the
    Management Server to a new computer), a backup of the management system (Log Servers
    and Management Server) can be created. The backup consists of data from the Management
    database (network elements, firewall configurations, security policies, and user
    accounts) stored in a single ZIP file. The backup file can be encrypted and protected
    with a password. The Log Server and its database with all of the log entries can
    be backed up in a similar manner.


    # Firewall engines


    The firewall engines at the core of StoneGate run on an integrated, hardened,
    Linux-based system installed with the engine. Each node can have multiple network
    interfaces. The engines inspect and filter packets addressed to or sent from the
    network they protect.


    StoneGate firewalls can be configured in standby mode; one node is online, the
    other waits to takeover from the first. Should the online node fail or taken offline,
    the standby node automatically assumes the role of the online node.


    Supporting systems (such as the configurable subsystem) also run on the firewall
    nodes. The kernel, protocol agents, firewall, test subsystem, and logging services
    each function independently. This ensures that the engine is robust; an error
    or corruption in one service will not affect other services. The system can continue
    until repairs or regular maintenance corrects them. The engine on each node communicates
    with the management system sending performance statistics, state information,
    and log data and receiving policy updates and configuration changes.


    Engine are configured through configuration files loaded onto the nodes by the
    management system. These files are encrypted on each node. Unauthorized access
    to the firewall itself will not reveal further information about the network.
    Configuration files are generated by the management system based on input from
    the administrator through the GUI. No manual re-configuration is required, and
    no software can be upgraded remotely by the GUI. There is no need to physically
    access the firewalls in order perform an upgrade.


    Each firewall node runs a test subsystem. Administrators can define or enable
    additional tests and test conditions on the firewall nodes. For example, if a
    network interface fails, a node can be switched offline, traffic redistributed
    to remaining online system, and an alert sent to an administrator.'
