    ## Example 4-13 Illustrating local port forwarding


    ```

    # netstat --listening numeric --tcp

    Active Internet connections (only servers)

    Proto Recv-Q Send-Q Local Address Foreign Address State

    tcp 0 0 0.0.0.0:1024 0.0.0.0:* LISTEN

    tcp 0 0 127.0.0.1:4321 0.0.0.0:* LISTEN

    tcp 0 0 0.0.0.0:111 0.0.0.0:* LISTEN

    tcp 0 0 127.0.0.1:25 0.0.0.0:* LISTEN

    tcp 0 0 ::4321 ::* LISTEN

    tcp 0 0 ::22 ::* LISTEN

    # lsof -n -P -i 4tcp:127.0.0.1:4321

    COMMAND PID USER FD TYPE SIZE NAME

    ssh 5446 root 5 IPv4 3318 TCP 127.0.0.1:4321 (LISTEN)

    # telnet localhost 4321

    Trying ..

    Connected to localhost.

    Escape character is ''^''.nThis will be forwarded to a remote echo server over
    local port 4321

    This will be forwarded to a remote echo server over local port 4321

    ]telnet> quit

    Connection closed.

    ```


    > Note: These commands are executed on the local client (192.168.1.1). Using the
    netstat command, we see a server bound to the loopback interface (localhost) listening
    on port 4321. The lsof command indicates the SSH connection is on the port.


    We connect to the remote echo server using the telnet command to port 4321. The
    response indicates the connection is forwarded to an echo server listening on
    the remote server (192.168.2.1).


    ## GatewayPorts


    In the previous example, we use port 4321 on the localhost interface to forward
    application clients (as specified by the -L 4321:localhost:7 option to the ssh
    command). By default, SSH listens only on the loopback interface for forwarded
    ports as a security precaution.


    Connections to a loopback interface can only be made by clients running on the
    local host. If a client attempts to connect to a server listening on the loopback
    interface of a remote host, the connection is refused (typically resulting in
    a message as "Connection refused").


    Forwarded ports can be opened to remote clients, as shown in Figure 4-3 on page
    69.


    ![](img/a2760634ecd5eb26c25e81867e88d740_82_0.png)


    Figure 4-3 Local forwarding acting as a gateway


    In this case, the forwarded SSH tunnel acts as a gateway for the client running
    on the 192.168.3.1 host. The default behavior to deny gateway access to SSH forwarded
    ports can be changed by:


    -   *Adding the GatewayPorts no line to the /etc/ssh/ssh_config config file.*

    -   Adding the -g option to the ssh local forward command, for example:


    ```

    ssh -g L 4321:localhost:7 192.168.2.1

    ```


    > **Important:** GatewayPorts should be considered a security exposure. Network
    traffic between the remote client and forwarded port (hosts 192.168.3.1 and 192.168.1.1
    in our example) is unencrypted and vulnerable to snooping. In addition, no access
    control is possible on the forwarded port (allowing untrusted host access to the
    server by masquerading as the forwarded client).


    ## 4.8.2 Remote port forwarding


    In a manner similar to local port forwarding, remote port forwarding opens an
    SSH tunnel from a local server to a remote client. Figure 4-4 on page 70 illustrates
    remote port forwarding.


    ![](img/a2760634ecd5eb26c25e81867e88d740_83_0.png)


    Figure 4-4 Remote port forwarding to a local echo server


    In this instance, we initiate the SSH tunnel from the local server (192.168.2.1)
    to the remote client (192.168.1.1). From the 192.168.2.1 host, issue the command:


    ```bash

    ssh -R 4321:localhost:7 192.168.1.1

    ```


    The 4321 port now specifies the port to forward on the remote client (192.168.1.1).
    Clients connecting to port 4321 on the remote client are forwarded to port 7 on
    the local server over the SSH tunnel.


    ## 4.8.3 When to use local or remote port forwarding


    The distinction between local and remote port forwarding can be characterized
    as:


    -   With local port forwarding, the application client connects to an SSH client
    on the local host. Requests are forwarded to an SSH server connecting to an application
    server on the other end of the SSH tunnel.

    -   With remote port forwarding, the application client connects to an SSH server
    on the local host. Requests are forwarded to an SSH client connecting to an application
    server on the other end of the SSH tunnel.


    In general:


    -   Use local port forwarding when the application client resides on the local
    host.

    -   Use remote port forwarding when the application client resides on the remote
    host.


    ## 4.8.4 Implications of port forwarding


    SSH port forwarding has several implications and effects an administrator should
    be aware of.


    ### Choosing a port number


    When choosing a port on the local host, remember that port numbers less than 1024
    require root privileges.


    ### Bypassing a firewall


    Port forwarding is a mechanism that can bypass a firewall. Consider cases where
    firewall rules allow SSH but block other traffic.


    ### Constructing an SSH tunnel in the background


    When creating the tunnel, the ssh command normally runs a shell in the foreground.
    To create the tunnel in the background, use the -f options:


    ```bash

    ssh -f -L 4321:localhost:7 192.168.2.1

    ```


    ### Terminating a forwarded port


    The SSH tunnel is terminated by logging out from the remote shell. If the tunnel
    has an active connection, the logout from the remote shell terminates the forwarded
    connection.


    > Note: Use the kill command on the SSH process to terminate it.


    ## One Shot forwarded


    In "Terminating a forwarded port" on page 71, we use the -f option to place the
    tunnel in the background. Normally, the ssh command expects a parameter that specifies
    a remote command to execute. The -N option specifies that no command is to be
    executed on the remote machine.


    > Tip: If we omit the -N option when creating a background tunnel, we get the
    error message:


    ```bash

    ssh -f -L 4321:localhost:7 192.168.2.1

    137: Cannot fork into background without a command to execute.

    ```


    We create a one shot tunnel by tunneling a simple shell command to execute on
    the remote machine. In Example 4-14, we create a tunnel to an echo server and
    connect to the server in one command sequence.


    Example 4-14 -f -L 4321:localhost:7 192.168.2.1 1 sleep 1: telnet localhost 4321


    ```bash

    # ssh -f -L 4321:localhost:7 192.168.2.1 1 sleep 1: telnet localhost 4321

    root@02.12.6.153:password:

    Trying...

    Connected to localhost.

    Escape character is '']''.

    this is a one shot tunnel

    this is a one shot tunnel

    ]

    telnet> quit

    Connection closed.

    ```


    The sleep remote command opens the tunnel in the background. Although the remote
    command completes before the Telnet session terminates, the tunnel remains open
    as described in “Terminating a forwarded port” on page 71.


    ## 4.9 X forwarding


    X forwarding is a special type of port forwarding by SSH specifically to secure
    X Windows (the Linux graphical display system). X Windows is a client/server architecture
    using the X protocol for network communication:


    -   The X server runs on the machine displaying the graphics.

    -   The client is the application creating the graphics.

