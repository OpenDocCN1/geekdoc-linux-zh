    # Example 3-2 The default /etc/pam.d/login configuration for SLES6


    ```

    #%PAM-1.0

    auth required pam_unix2.so    nullok #set_secprpc

    auth required pam_security.so

    auth required pam_nologin.so

    auth required pam_mail.so

    account required pam_unix2.so

    password required pam_pwcheck.so nullock

    password required pam_unix2.so nullock use_first_pass authok

    session required pam_unix2.so    none # debug or trace

    session required pam_limits.so

    ```


    PAM modules in this example allow for:


    +   1. Standard UNIX password checking is provided by pam_unix2.so. The pam_unix.so
    module supports all PAM modules types (auth, account, and session). Password checking
    for pam_unix2.so depends on the contents of the /etc/nsswitch.conf file

    \When used as a password module type, pam_unix2.so can require users to change
    expired passwords. Its actions are determined by the following arguments:


