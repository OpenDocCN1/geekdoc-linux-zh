    # 4.8 Secure tunneling using port forwarding


    SSH provides the ability to create a secure TCP tunnel using a feature know as
    port forwarding. With port forwarding, client/server applications communicate
    over a normally unencrypted network using an SSH tunnel. The tunnel transparently
    encrypts data exchanged between the application client and server.


    > Note: Port forwarding is available only to TCP socket protocol applications.
    Be aware that port forwarding is only possible if an SSH server is running on
    both the client and application server machines.


    # 4.8.1 Local port forwarding


    With local port forwarding, an SSH tunnel is initiated from the client host. SSH
    then binds to a port on the local host. Connections to this port are proxied over
    the SSH tunnel to the SSH server running on the remote host (where they are passed
    to the application server). The concept is illustrated in Figure 4-2 on page 67.'
