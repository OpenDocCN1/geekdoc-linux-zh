- md: "\n# Security Policy\n\n![](img/a2760634ecd5eb26c25e81867e88d740_16_0.png)\n\
    \nFigure 1-1 Security principles\n\nThe security policy relies on security administration\
    \ and monitoring. Over time, a security policy can change as new administration\
    \ tools and principles are put in place, or as security monitoring reveals new\
    \ or unforeseen vulnerabilities.\n\n## 1.2 Elements of security\n\nIn this section,\
    \ we examine some of the security aspects to consider when developing a security\
    \ policy.\n\n### 1.2.1 Physical security\n\nThe first and most important element\
    \ to consider is the security and integrity of physical locations from which the\
    \ system can be accessed. Any security procedure or process can be subverted if\
    \ an attacker gains access to the system console. At a minimum, access to the\
    \ physical system should be restricted to authorized personnel (using badge access,\
    \ for example). Entry into the restricted areas should be monitored and tracked.\n\
    \n### 1.2.2 System security\n\nProcedures should be in place to limit and monitor\
    \ user access to the system.\nSome suggested procedures include:\n\n- Authenticate\
    \ users from a central repository (such as LDAP or RACF) to lower maintenance\
    \ overhead.\n- Maintain user password standards and expiration policies.\n- Limit\
    \ the number of users authorized to access the system.\n- Limit the number of\
    \ running services.\n- Install and upgrade RPM packages from trusted sources.\n\
    - Logging to a central log server and log all system accesses.\n- Apply recommended\
    \ security patches to Linux hosts.\n- Restrict the number of hosts running X Windows.\n\
    - Do not allow programming languages and compilers on production machines.\n-\
    \ Include the acceptable use policy as part of the system logon secure.\n\n###\
    \ 1.2.3 Network security\n\nSecuring network access is critical for hosts connected\
    \ to a public network. However, it is equally important to secure networks on\
    \ internal, corporate networks. Typically, the majority of network security incidents\
    \ originate from within an internal network. Some points to consider:\n\n- For\
    \ trusted hosts, a firewall. Access to these hosts should be limited. Examples\
    \ of untrusted hosts include:\n    - Hosts on the demilitarized zone (DMZ)\n \
    \   - Hosts on external networks\n    - Hosts for vendor systems\n- The number\
    \ of trusted hosts should be limited and tightly monitored. Examples of trusted\
    \ hosts include:\n    - Hosts within an internal or corporate network\n    - Hosts\
    \ accessed over a virtual private network\n- Remote connections should be encrypted\
    \ with an industry-approved encryption algorithm equal to or exceeding 1024 bits.\n\
    - Use server certificates for secure HTTP traffic.\n- Access to security servers\
    \ (such as a firewall or log server) should be strictly limited to authorized\
    \ security personnel.\n\n## 1.3 System installation and backup\n\nIt is important\
    \ to ensure that no malicious or insecure code is installed on the system. When\
    \ initially installing Linux, always use images from a supported distributor (preferably\
    \ from a secure medium such as the distributor-provided CD-ROM). Take regular\
    \ backups to ensure that recovery to a secure install is possible in the event\
    \ the system is compromised.\n\n### 1.3.1 Verifying the RPM package\n\nRPM packages\
    \ should always be authenticated before installation. This ensures that the package\
    \ contents have not been tampered with. Use the rpm -Kvv package command to check\
    \ the author's digital signature. \n\nExample 1-1 Verifying an RPM package\n\n\
    ```\n# rpm -Kvv tripwire-1.2-385.s90.rpm\nD: New Header signature\nD: Signature\
    \ size: 156\nD: Signature pad : 4\nD: sigsize : 160\nD: Header + Archive : 204491\n\
    D: expected size : 204491\ntripwire-1.2-385.s90.rpm\nMS sum: 63b2c0ea830fe2fd8b602ec025b913e0\n\
    gpg: Warning: unsafe permissions on directory \"/usr/lib/rpm/gpgup\"\ngpg: Warning:\
    \ unsafe permissions on file \"/usr/lib/rpm/pubring/pubring.gpg\"\ngpg: signature\
    \ made Tue Nov 5 19:09:00 2002 using DSA key ID 9C800ACA\ngpg: Good signature\
    \ from \"SUSE Package Signing Key <build@$suse.de>\"\ngpg: Warning: unsafe permissions\
    \ on file \"/usr/lib/rpm/pubring/pubring.gpg\"\ngpg: WARNING: This key is not\
    \ certified with a trusted signature\ngpg:\n  There is no indication that the\
    \ signature belongs to the owner.\n  Fingerprint: 79C179B2E1C820C1809F994A8B4DAE6\n\
    ```\n\nIn this example, we note:\n\n1. The RPM package contains a Pretty Good\
    \ Privacy (PGP) signature.\n2. The signature belongs to SUSE, and appears to be\
    \ valid (that is, has not been tampered with).\n3. Although the signature appears\
    \ valid, it has not been registered with a central authority. In this case, the\
    \ RPM package came from an official SUSE CD, and therefore can be trusted.\n\n\
    Note: If a signed package is modified, the check listed in the second point will\
    \ fail. It is possible for an RPM package to be signed with a forged certificate.\
    \ This can be detected if the original signer registers their certificate with\
    \ a trusted party. Example 1-2, we show an example of verifying an unsigned RPM\
    \ package.\n\nExample of an unsigned package\n\n```\n# rpm -Kvv tcpshow-1.0-2.src.rpm\n\
    D: New Header signature\nD: Signature size: 68\nD: Signature pad : 4\nD: sigsize\
    \ : 72\nD: Header + Archive: 16064\nD: expected size : 16064\ntcpshow-1.0-2.src.rpm:\n\
    MD5 sum OK: 7c753f4a8c6b50e1ad3\n```\n\nIn this case, no signature information\
    \ is displayed. Packages from unknown or questionable sources should not be installed.\
    \ Use only packages from an authorized distributor.\n\n# z/VM integrity and security\n\
    \nIn this chapter, we examine security for Linux guests executing in z/VM environment.\
    \ Topics include:\n\n- zSeries and zVM integrity\n- zSeries network security\n\
    - Securing your z/VM system\n- CP privilege classes\n- The z/VM CONFIG file\n\
    - z/VM user directory\n- Directory Maintenance Facility\n- RACF for z/VM\n\n##\
    \ 2.1 zSeries and zVM integrity\n\nWe begin by first examining integrity features\
    \ offered by Linux guests under zVM. If we consider Linux executing in an LPAR\
    \ (that is, native mode without zVM), it is a pure Linux environment. However,\
    \ Linux benefits from the inherent values of the z-Architecture itself:\n\n- The\
    \ isolation between LPARs ensures secure environments as executing on physically\
    \ separate servers, certified by Evaluation Assurance Levels (EAL)5.\n- zVM can\
    \ access zSeries-unique hardware features such as:\n    - HiperSockets™\n    -\
    \ zSeries I/O devices such as OSA cards and FICON channels\n    - zSeries specialized\
    \ cryptographic hardware\n- Extremely high availability of the hardware platform.\
    \ Mean-Time-Between-Failure (MTBF) is estimated to be more than 30 years, unique\
    \ in the industry.\n\nThis section addresses the unique security and integrity\
    \ benefits zVM adds to Linux. In this context, system integrity refers to the\
    \ ability to run multiple systems on a single physical zSeries server and to ensure\
    \ that one system cannot compromise the operation of any other system.\n\nTwo\
    \ levels of system integrity are enforced when running on zSeries:\n\n- Integrity\
    \ at logical partition level: Each logical partition (LPAR) is isolated from all\
    \ other LPARs.\n- Integrity provided by z/VM: Each virtual machine (guest) running\
    \ under z/VM is isolated from all other z/VM guests.\n\nSystem integrity provided\
    \ by both z/VM and zSeries ensures Linux guests are isolated from all other operating\
    \ systems and guests running on the same physical zSeries server.\n\n### 2.1.1\
    \ LPAR integrity\n\nThe ability to partition the zSeries Central Processing Complex\
    \ (CPC) into multiple LPARs is provided by the Processor Resource/System Manager\
    \ (PR/SM™). PR/SM is a hardware facility that enables sharing resources across\
    \ LPARs. It is the Start Interpretive Execution (SIE) instruction that enables\
    \ switches between LPARs. When a context switch occurs between LPARs, the current\
    \ state of the LPAR is saved. All resources are cleared or reset before control\
    \ is passed to another LPAR. When returned to an LPAR, the saved state of the\
    \ LPAR is restored before execution of the SIE instruction.\n\nSystem memory is\
    \ always dedicated to a specific LPAR. PR/SM performs dynamic address translation\
    \ when a context switch occurs between LPARs. Because address translation is a\
    \ hardware feature, this ensures that software running in one LPAR cannot access\
    \ or compromise an address space in a different LPAR. It is possible to reconfigure\
    \ LPAR memory allocation. However, memory is cleared before it is reassigned to\
    \ another LPAR.\n\n> Note: Details about the interpretive execution architecture\
    \ can be found in \"ESA/390 interpretive-execution architecture, foundation for\
    \ VM/ESA,\" by D. L. Osisek et al., available at:\n\n```\nhttp://www.research.ibm.com/journal/sj/301/ibmjs301E.pdf\n\
    ```\n\n# LPAR security certification\n\nPR/SM for the IBM Server Z900 has achieved\
    \ Common Criteria for Information Security Evaluation EAL5 level certification.\
    \ This provides a high degree of assurance that operating systems running in different\
    \ LPARs on the z900 are isolated from each other. SUSE LINUX Enterprise Server\
    \ 8 with Service Pack 3 has achieved Controlled Access Profile compliance under\
    \ the Common Criteria (referred to as CAPP/EAL3+). For more information, see:\n\
    \n```\nhttp://www.ibm.com/servers/eserver/zeries/security/certification.html\n\
    ```\n\n### 2.1.2 Integrity by the zVM Control Program\n\nThe z/VM Control Program\
    \ (CP), the hypervisor, is primarily a real-machine resource manager. The CP provides\
    \ each user with an individual working environment known as a virtual machine.\
    \ Each virtual machine is a functional equivalent of a real system, sharing the\
    \ real processor function, storage, console, and input/output (I/O) device resources.\
    \ When you first log on to z/VM, the CP controls the working environment. Many\
    \ of the facilities of z/VM are immediately available to you. For example, you\
    \ can use the CP commands to do various system management tasks. Most of the work\
    \ done on z/VM requires the Conversational Monitor System (CMS) or a guest operating\
    \ system, such as z/OS, to help with data processing tasks and manage work flow.\
    \ The CP provides connectivity support that allows application programs to exchange\
    \ information with each other and to access resources residing on the same z/VM\
    \ system or on different z/VM systems.\n"
  mdcn: "\n\n# 安全策略\n\n![](img/a2760634ecd5eb26c25e81867e88d740_16_0.png)\n\n图 1-1\
    \ 安全原则\n\n安全策略依赖于安全管理和监控。随着时间的推移，由于新的管理工具和原则的实施，或者由于安全监控发现了新的或不可预见的安全漏洞，安全策略可能会发生变化。\n\
    \n## 1.2 安全的要素\n\n在本节中，我们将探讨在开发安全策略时需要考虑的某些安全方面。\n\n### 1.2.1 物理安全\n\n要考虑的首要且最重要的元素是，可以访问该**物理位置的安全性和完整性。如果攻击者获取了系统控制台的权限，任何安全程序或流程都可能被破坏。至少，对物理系统的访问应限制在授权的人员（例如，使用门禁访问）。对进入限制区域的活动应进行监控和跟踪。\n\
    \n### 1.2.2 系统安全\n\n应该建立相关程序来限制和监控用户对系统的访问。\n建议的程序包括：\n\n- 从中央存储库（如 LDAP 或 RACF）验证用户，以降低维护开销。\n\
    - 维护用户密码标准和过期策略。\n- 限制授权访问系统的用户数量。\n- 限制正在运行的服务数量。\n- 从可信源安装并升级 RPM 包。\n- 将日志记录到中央日志服务器并记录所有系统访问。\n\
    - 在 Linux 主机上应用推荐的安全补丁。\n- 限制运行 X Windows 的主机数量。\n- 不在生产机器上允许使用编程语言和编译器。\n- 将可接受使用策略作为系统登录安全加固的一部分。\n\
    \n### 1.2.3 网络安全\n\n对于连接到公共网络的主机，确保网络访问至关重要。然而，确保内部企业网络上的安全同样重要。通常，绝大多数网络安全事件源于内部网络。一些需要考虑的几点：\n\
    \n- 对于可信主机，使用防火墙。对这些主机的访问应受到限制。不可信主机的示例包括：\n    - 位于非军事化区 (DMZ) 上的主机\n    - 位于外部网络网络的主机\n\
    \    - 供应商系统的主机\n- 可信主机的数量应该受到限制并进行严格监控。可信主机的示例包括：\n    - 内部或企业网络内的主机\n    - 通过虚拟专用网络\
    \ (VPN) 访问的主机\n- 远程连接应使用行业认可的、位或大于 1024 位的加密算法进行加密。\n- 使用服务器证书进行安全的 HTTP 流量。\n\
    - 对安全服务器（如防火墙或日志服务器）的访问应严格限制在授权的安全人员范围内。\n\n## 1.3 系统安装与备份\n\n确保系统上没有安装恶意或不安全的代码是非常重要的。在初始安装\
    \ Linux 时，务必使用来自支持的发行版提供的镜像（最好来自由发行版提供的 CD-ROM 等安全介质）。定期进行备份，以确保在系统被攻破时能够恢复到安全的安全的安装状态。\n\
    \n### 1.3.1 验证 RPM 包\n\nRPM 包在安装前应始终经过身份验证。这确保了包的内容没有被篡改。使用 `rpm -Kvv package`\
    \ 命令来检查作者的数字签名。\n\n示例 1-1 验证 RPM 包\n\n```\n# rpm -Kvv tripwire-1.2-385.s90.rpm\n\
    D: New Header signature\nD: Signature size: 156\nD: Signature pad : 4\nD: sigsize\
    \ : 160\nD: Header + Archive : 204491\nD: expected size : 204491\ntripwire-1.2-385.s90.rpm\n\
    MS sum: 63b2c0ea830fe2fd8b602ec025b913e0\ngpg: Warning: unsafe permissions on\
    \ directory \"/usr/lib/rpm/gpgup\"\ngpg: Warning: unsafe permissions on file \"\
    /usr/lib/rpm/pubring/pubring.gpg\"\ngpg: signature made Tue Nov 5 19:09:00 2002\
    \ using DSA key ID 9C800ACA\ngpg: Good signature from \"SUSE Package Signing Key\
    \ <build@$suse.de>\"\ngpg: Warning: unsafe permissions on file \"/usr/lib/rpm/pubring/pubring.gpg\"\
    \ngpg: WARNING: This key is not certified with a trusted signature\ngpg:\n  There\
    \ is no indication that the signature belongs to the owner.\n  Fingerprint: 79C179B2E1C820C1809F994A8B4DAE6\n\
    ```\n\n在此示例中，我们注意到：\n\n1. RPM 包包含一个良好的隐私加密 (PGP) 签名。\n2. 签名属于 SUSE，并且看起来是有效的（即没有被篡改）。\n\
    3. 尽管签名看起来有效，但它尚未在中央机构注册。在这种情况下，该 RPM 包来自官方 SUSE CD，因此是可以信赖的。\n\n注意：如果已签名的包被修改，第二点中列出的检查将失败。RPM\
    \ 包 可能会使用伪造的证书进行签名。如果原始签名者向受信方注册了他们的证书，就可以检测到这一点。示例 1-2 我们展示了验证未签名 RPM 包的示例。\n\
    \n未签名包的示例\n\n```\n# rpm -Kvv tcpshow-1.0-2.src.rpm\nD: New Header signature\n\
    D: Signature size: 68\nD: Signature pad : 4\nD: sigsize : 160\nD: Header + Archive\
    \ : 204491\nD: expected size : 204491\ntripwire-1.2-385.s90.rpm\nMS sum: 63b2c0ea830fe2fd8b602ec025b913e0\n\
    ```\n\n"
