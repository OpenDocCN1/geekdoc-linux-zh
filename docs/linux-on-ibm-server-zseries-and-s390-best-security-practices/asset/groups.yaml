    # z/VM 安全认证


    在 SuSE 和 IBM 于 2003 年 8 月 5 日发布的新闻“IBM 和 SuSE 获得首个 Linux 安全认证”中，IBM 出了如下声明：


    除了 IBM 对加速 Linux 开发和认证的持续承诺外，公司将继续投资对新型和现有 IBM 产品进行持续认证。预计 z/VM 在未来一年将获得 Common
    Criteria（通用标准）认证，以及 IBM 在 Linux 上的中间件系列。IBM Directory 刚刚完成了 Common Criteria 评估，WebSphere
    Application Server 和 Tivoli Access Manager 目前正在评估中，其他几个软件组产品也准备进入该流程。


    # 2.2 zSeries 网络安全


    zSeries 网络设施提供了独特的安全优势。队列直接输入/输出（QDIO）架构使用直接内存访问（DMA）将网络数据从发送者的地址空间传输到接收者的地址空间。对于
    HyperSocket 网络，这意味着网络流量无法被第三方（其他 z/VM 访客或其他 LPAR）“嗅探”。对于 OSA-Express，网络流量直接在适配器与发送者/接收者的地址空间之间移动。有关
    zSeries 网络的详细信息，请参阅 z24-6816，该文档可用地址为：


    ```

    http://www.ibm.com/redbooks/abstracts/sg246816.html

    ```


    **注意：** 虽然 Linux 虚拟机无法嗅探并非指向或源自该虚拟机的 QDIO 流量，但运行在 Linux 虚拟机中的一个进程可能会查看指向同一虚拟机中另一个进程的流量。同样，指向
    OSA-Express 适配器的网络流量可以被连接到 zSeries 服务器外部主机嗅探。


    ## 2.3 保护您的 z/VM 系统


    在保护您的 Linux 环境之前，首先保护 z/VM 系统本身至关重要。不安全的 z/VM 系统无法为 Linux 虚拟机提供安全性。例如，防止 Linux
    虚拟机内部的未经授权访问并防止入侵者获取 z/VM 控制台的权限，从而损害整个系统的完整性。


    除了 z/VM 本身，还可以安装并使用另外两个 IBM 软件产品来增强完整性和安全性：


    - *IBM Directory Maintenance for z/VM/DirMaint™* 提供了一个安全且简单的接口，用于定义和管理 z/VM 目录。系统管理员利用
    minisk 分配、虚拟机管理和事务审计等功能，在部署 Linux 虚拟机方面创建并维护一个安全环境。

    - 资源访问控制设施（RACF）RACF 是一种外部安全管理器（ESM），用于进一步增强 z/VM 系统资源。RACF 提供对系统资源以及虚拟机资源的能力。RACF
    还提供了一套全面的审计设施。RACF 可用于验证登录密码并控制对 miniskids、网络节点、共享段、打印文件和系统命令的访问。


    有关 z/VM 安全和完整性功能的概述可以在 Alan Altmark 和 Cliff Laking 编写的《z/VM Security and Integrity》。


    > **注意：** 有关如何保护 z/VM TCP/IP 栈的详细信息，请参阅 z/VM V4R.0 TCP/IP Planning and Customization,
    SC24-6019。


    ### 2.3.1 z/VM 系统完整性声明


    系统完整性是 z/VM 的重要特性。本声明扩展了 IBM 之前关于 z/VM 环境系统完整性的声明。IBM 已实施了特定的设计和编码指南来维护系统完整性。还建立了程序，使这些设计和编码指南成为设计和开发过程的正式部分。


    由于无法证明任何系统具有完美的完整性，IBM 继续努力增强 z/VM 的完整性，并在发现漏洞时及时做出响应。IBM 将接受描述以下内容的 APAR：


    - z/VM 系统完整性漏洞

    - 由在虚拟机中运行的程序引起的系统完整性漏洞，只要该问题不是由客户控制的授权机制引入


    # z/VM 系统完整性定义


    z/VM 系统完整性确保经过授权的虚拟机无法：


    - 绕过或禁用控制程序的实际或辅助存储保护。

    - 访问受 RACF 保护的资源。受保护的资源包括虚拟机、minidis 和终端。

    - 访问受控制程序密码保护的资源。

    - 在实际监控状态下获得控制，或获得高于其分配权限的权限权限。

    - 绕过任何其他 z/VM 虚拟机的系统完整性。


    通过实际存储保护，虚拟机与其他所有虚拟机隔离开。CP 使用以下机制实现这一点：


    - 在硬件层级实现的动态地址翻译（DAT）

    - 开始解释执行（Start Interpret Execution）指令

    - 设置地址限制（Set Address Limit）设施


    通过辅助存储保护，CP 确保虚拟机无法访问其未授权的 minidisk 或虚拟磁盘（VDISK）。此保护是通过通道转换实现的。


    # 客户责任


    虽然客户数据的保护是客户的责任，但数据安全仍然是 IBM 至关重要的领域。IBM 对 z/VM 系统完整性的承诺（如本文所述）是帮助客户保护其数据的一大步。


    > 注意：有关 z/VM 安全和完整性的更多信息，请参阅 z/VM V4R.0 General Information, GC24-5991。


    # 2.4 CP 权限类


    CP 命令根据执行特定命令所需的授权级别进行分组。分配给 z/VM 用户的权限类决定了任何用户授权执行的命令。表 2-1 列出了 CP 权限类、预期授权该权限类的用户类型以及该权限类提供的功能描述。


    表 2-1 CP 权限类


    | 类 | 用户 | 功能 |

    | :--- | :--- | :--- |

    | A | 系统管理员 | 控制 z/VM 系统。系统管理员负责系统可用性和资源。 |

    | B | 系统资源管理员 | 控制除系统管理员或输出作业员控制以外的所有资源。 |

    | C | 系统程序员 | 更新或更改系统级参数。 |

    | D | 输出作业员 | 控制输出文件和系统读取器、打字机和打印机。 |

    | E | 系统分析师 | 查看系统运行。 |

    | F | 服务代表 | 从 I/O 设备获取并检查详细系统数据。类 F 为 IBM 留用。 |

    | G | 普通用户 | 控制与用户关联的功能。 |

    | Any | | 无论权限类如何，任何用户均可使用的命令。 |

    | H | | IBM 留用。 |

    | I-Z 1-6 | 用户定义 | 可供每个安装自定义的类。 |


