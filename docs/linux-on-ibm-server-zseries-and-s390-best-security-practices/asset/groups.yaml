    \nFigure-4-1 Accessing the certificate from a Web browser\n\n## 4.2.3 Activating\
    \ mod_ssl\n\nTo activate the mod_ssl module, we add the following lines to the\
    \ /etc/sysconfig/apache configuration file:\n\n```\nHTTPD_SEC_MOD_SSL=yes\nHTTPD_START_TIMEOUT=60\n\
    ```\n\nSetting the HTTP timeout to 60 seconds allows enough time to enter the\
