    \ 使更改生效。在启动时，会提示提供 PEM 密码，如示例 4-9 所示。\n\n```\n# apachectl start\nStarting httpd\
    \ [Apache/1.3.26 mod_ssl/2.8.10]\n出于安全原因，某些私钥文件已加密。\n为了读取它们，我们必须提供密码。\nServer.lnnsu2.itso.ibm.com:443\
    \ (RSA)\npassphrase:\nOk: passphrase successful.\ndone\n```\n\n## 4.4 Secure Shell\
    \ 概述\n\nSecure Shell（也称为 SSH）是一种安全的网络访问协议。传统的网络访问协议（Telnet、FTP 以及命令套件如 login、rcp\
    \ 和 rsh）本质上是不安全的。未加密的数据（包括用户 ID 和密码）在网络上传输可能会被恶意线程捕获。SSH 为远程访问、文件传输和命令执行提供了安全替代。\n\
    \nSSH 最初由 Tatu Yönen（赫尔辛基技术大学的研究人员）开发，作为防止密码嗅探的方法。他的初始实现（称为 SSH1）作为免费发布。随后的改进产生了新的\
    \ SSH-2 协议，由 SSH Communications Security, Ltd.（Yönen 于 1995 年创立）提供产品。OpenSSH 是基于\
    \ SSH1 最新版本的 Secure Shell 开源实现。它支持 SSH-1 和 SSH-2 协议。OpenSSH 是大多数 zSeries Linux\
    \ 发行版（包括 SLES8 和 RHEL3）的一部分。可以在其网站找到有关 OpenSSH 的详细信息：\n\nhttp://www.openssh.com\n\
    \n注意：在本章节后续， SSH 特指 OpenSSH 实现。\n\nSSH 提供的一些安全优势包括：\n\n- 强加密：网络流量经过加密。SSH 使用了多种对称和非对称加密机制：\n\
    - 对称加密用于批量数据加密。支持的算法包括 3DES、Blowfish 和 IDEA。\n- 非对称加密用于主机标识和交换加密密钥。SSH 可以使用 Rivest-Shamir-Adleman\
    \ (RSA) 和数字签名算法 (DSA) 公私钥加密。\n- 数字认证：使用公钥来验证主机。\n- 数据完整性检查：哈希函数（CRC32、MD5 和 SHA-1）确保数据包在传输过程中不修改。\n\
    \n## 4.5 使用 SSH 进行安全网络访问\n\nSSH 最常用的用途之一是替代 Telnet。安全连接到远程主机的命令语法为：\n\n```\nssh\
    \ -l user host\n```\n\n其中：\n\n| 字段 | 描述 |\n| :--- | :--- |\n| user | 指定远程用户名。\
    \ |\n| host | 指定远程主机。 |\n\n可以使用以下方式简化命令：\n\n```\nssh user@host\n```\n\n如果省略了远程用户名，默认使用本地登录名。要建立远程\
    \ SSH，用户会被提示提供远程用户密码。\n\n注意：用户名和密码在发送到网络之前会进行加密。在 4.7 节“无密码认证”中，我们将讨论一种在不提供密码的情况下验证\
    \ SSH 的机制。\n\n### 4.5.1 已知主机\n\nSSH 采用已知主机机制来防止中间人攻击。当客户端发起 SSH 连接时，服务器返回其公钥。然后客户端将其与已知的服务器公钥列表进行对比。如果密钥与服务器的公钥不匹配，SSH\
    \ 客户端会警告第三方已重定向连接（一个伪装目标服务器的假主机）并终止连接。\n\n已知主机机制是一种额外的安全保护（Telnet 会话没有防止中间人攻击）。已知主机公钥保存在\
    \ SSH 客户端的 `~/.ssh/known_hosts` 文件中，格式如示例 4-10 所示。\n\n示例 4-10 ~/.ssh/known_hosts\n\
    \n```\n192.168.100.2 ssh-rsa AAAAB3nZaYc2AAAABIAWIAAA...\n9.12.9.38 ssh-rsa AAAAB3nZaYc2AAAABIAWIAEAT+5...\n\
    192.9.37 ssh-rsa AAAAB3nZaYc2AAAABIAWIAAmhB...\n```\n"
