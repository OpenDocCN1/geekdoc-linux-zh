    # GatewayPorts


    In the previous example, we use port 4321 on the localhost interface to forward
    application clients (as specified by the -L 4321:localhost:7 option to the ssh
    command). By default, SSH listens only on the loopback interface for forwarded
    ports as a security precaution.


    Connections to a loopback interface can only be made by clients running on the
    local host. If a client attempts to connect to a server listening on the loopback
    interface of a remote host, the connection is refused (typically resulting in
    a message as "Connection refused").


    Forwarded ports can be opened to remote clients, as shown in Figure 4-3 on page
    69.'
