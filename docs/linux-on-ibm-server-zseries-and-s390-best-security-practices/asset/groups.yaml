    # 7.3. Enabling Linux LDAP user authentication


    To enable LDAP user authentication in Linux, we use the capability provided by
    Name Service Switch (NSS). We configure PAM to use LDAP authentication and then
    configure NSS to point to the z/OS LDAP server.'
