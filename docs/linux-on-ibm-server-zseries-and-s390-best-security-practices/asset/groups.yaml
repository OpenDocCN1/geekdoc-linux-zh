    Multiple Servers can be deployed in a StoneGate environment. To improve performance
    and availability, each firewall or firewall cluster can be assigned a different
    Server (a particularly useful for geographically distributed systems). Individual
    nodes within a single cluster or hot-standby configuration must log to the Log
    Server. In the event that a node cannot communicate with its Log Server, the nodes
    log locally until communication is restored.


    # Database engines


    The Management Server stores properties of network elements, rules, aliases, templates,
    VPs, users, servers, and information in an internal database engine. This embedded
    database engine provides StoneGate with a fast and robust relational database.
    This self-maintaining database is installed automatically as a component of the
    Management Server.


    The Log Server also uses an embedded database. This database allows the Log Server
    to store, query, and export log data very quickly, using the same kind of fast,
    robust relational database.


    # User directory


    User information is stored in the Management Server''s internal database. Although
    stored in the embedded SQL database, the user directory can be accessed through
    LDAP API. This interface enables LDAP directory services to be used for access
    to the user directory.


