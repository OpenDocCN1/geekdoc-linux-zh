    # 6.1 The role of firewalls


    Firewalls are a cornerstone in a corporate defense strategy designed to eliminate
    misuse of confidential data and resources. A firewall is one (albeit important)
    element in an overall security policy. Its role is to implement and enforce the
    network security policy. Firewalls regulate communication between networks with
    different security levels. Their purpose is to control the traffic passing from
    one network to another, denying access to undesired or potentially harmful packets
    and connections.


    The principle of access control is ideally expressed as *whatever is not expressly
    permitted is denied*. By default, no one should be permitted entry to a protected
    network. This means any traffic allowed into a network must be allowed through
    a specific rule. Typically, internal network clients are granted more unrestricted
    access to external networks, but outbound connections also need to be controlled.


    Some advantages that firewalls can provide include:


    +   - Firewalls protect a corporate intranet from undesired traffic. Including
    everything from malicious attackers to unsolicited e-mail (spam).


    +   - Firewalls secure sensitive corporate resources within a LAN.

    This isolates departments such as Research and Development or Human Resources
    from other company departments, limiting the access within any area to authorized
    users only.


    +   - Firewalls concentrate network security policies at a single point.

    Network security can focus on the firewall checkpoint. When policies or administrators
    change, configurations need only be changed in one place. However, the firewall
    should not become a *single point of failure*.


    Firewalls can also be used for other purposes, such as monitoring network traffic
    and the use of network resources, authenticating users, and implementing virtual
    private networks (VPN).


    # 6.2 Firewall technologies


    The firewall market offers a wide range of both software-based and hardware-based
    firewall solutions. Firewalls are usually categorized by the way they handle network
    traffic. In this section, we give an overview of existing firewall technologies.
    We also introduce a new type of firewall: StoneGate.'
  - '[PAGE 100]


    Traditionally, firewalls can be divided into three main types:


    +   - Packet filtering firewalls

    - Application-level proxy firewalls

    - Stateful inspection firewalls


    Each type has its benefits and disadvantages. We briefly compare each technology,
    pointing out their strong points and drawbacks.


    # 6.2.1 Packet filtering firewalls


    Packet filtering firewalls allow or deny access based on header information in
    the packets they receive. Packet filtering firewalls examine each packet and can
    be implemented by most common routing devices.


    Packet filters typically contain access control lists (ACLs) to monitor the following
    header data:


    +   - Source IP address

    - Destination IP address

    - Source port

    - Destination port

    - ICMP message type

    - Protocol

    - Packet size

    - Various header flags


    Combining these parameters, more complex policies can be enforced by the packet
    filter. Packet filters tend to have high performance, because inspection involves
    simple parameters at the network layer of the TCP/IP stack. typically only inspect
    up to the network layer, as show in Figure 6-1 on page 88.'
