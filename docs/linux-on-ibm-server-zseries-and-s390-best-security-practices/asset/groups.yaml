    # 2.8 RACF for z/VM


    As mentioned earlier, there is a RACF product available on z/VM, and we recommend
    the use of RACF to secure the z/VM system itself. Refer to z/VM Security and Integrity,
    by Alan Altmark and Cliff Laking, for a discussion of this. For the Linux environment
    executing on z/VM, we demonstrate how our operating system environments on the
    zSeries platform can operate using non-proprietary, open interfaces. We choose
    to use LDAP for directories, in this case having the LDAP server executing on
    a z/OS image. We use the same z/OS image to show how LDAP and RACF on z/OS can
    operate to create a secure environment.


    > Note: RACF for z/VM is a separately licensed feature. With z/VM V4.4, RACF is
    shipped with the system installation media as a convenience. You must obtain a
    separate license to enable RACF.


    The value of using RACF as a back end for LDAP is that all your existing RACF
    users can be given to access Linux machines, using the user ID and password that
    they use for their z/OS-related work. Second, the password can never be compromised;
    it is always encrypted in the RACF database. Conversely, if you decide to have
    the root user ID in RACF, all your root passwords for all your Linux machines
    will have to be the same. If that single password is compromised, access will
    be given to your entire set of Linux machines.


    If you decide to have the root user ID managed from outside of your Linux machine,
    we strongly recommend that you do not use RACF on z/OS for that purpose, but instead
    leave the control in LDAP on z/OS.


    For information, refer to Chapter 7, “Using z/OS features in a Linux environment”
    on page 137.'
