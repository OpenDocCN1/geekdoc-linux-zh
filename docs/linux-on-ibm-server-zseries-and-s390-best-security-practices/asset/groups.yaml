    # Linux on IBM @server zSeries and S/390: Best Security Practices


    # Linux on IBM @server zSeries and S/390: Best Security Practices


    Security topics for z/VM


    This IBM Redbook discusses best practices for running Linux as a z/VM guest on
    IBM @server zSeries and S/390 machines. This publication is intended for system
    administrators and IT architects responsible for deploying secure Linux servers
    running under z/VM. We consider both z/VM and Linux security topics.


    Securing Linux guests


    # INTERNATIONAL TECHNICAL SUPPORT ORGANIZATION


    Firewalls on Linux for zSeries


    # BUILDING TECHNICAL INFORMATION BASED ON PRACTICAL EXPERIENCE


    We examine the unique security and integrity features zSeries offers for consolidating
    a large number of Linux servers under z/VM. We discuss virtual machine isolation
    and command privileges assigned to VM guests. Security configuration options for
    z/VM Version 4.4 are explained.


    In this book, we also discuss Linux security topics. We examine options for hardening
    a Linux installation. Securing Linux traffic using Secure Sockets Layer and Secure
    Shell is considered. We look at implementing a private network using Free/WANS.
    Commercial firewall technology and implementation using the StoneGate firewall
    for zSeries is discussed. We examine using IBM Tivoli Access Manager in conjunction
    with an LDAP server running on z/OS to authenticate Linux users against RACF running
    on z/OS.


    IBM Redbooks are developed by the IBM Technical Support Organization. Experts
    from IBM, Customers and Partners from around the world create timely information
    based on realistic scenarios. Recommendations are provided to help you implement
    IT solutions more effectively in your environment.


    For more information: ibm.com/redbooks


