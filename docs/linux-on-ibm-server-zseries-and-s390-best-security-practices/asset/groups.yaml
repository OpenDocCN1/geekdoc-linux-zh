    Each firewall nodes has three network interface cards (NIC), but is connected
    to five isolated networks:


    +   - NIC 1 is configured as two logical VLAN interfaces:

    - Interface 1.1 for VLAN 0

    - Interface 1.2 for VLAN 1


    The VLANs isolate the internal network from the control network.


    +   - NIC 2 is configured as interface 2.3 and 2.4 for VLANs 2 and 3 to isolate
    the two DMZ networks (DMZ A and DMZ B).


    +   - NIC 3 is connected to the Internet.


    For a secure implementation, the access to the switches is restricted. Traffic
    belonging to different VLANs is securely isolated. Figure 6-18 on page 111 depicts
    a geographically distributed VLAN cluster.'
