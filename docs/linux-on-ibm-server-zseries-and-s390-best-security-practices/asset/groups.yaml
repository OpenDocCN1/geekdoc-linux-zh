    # 4.3 Using hardware acceleration with OpenSSL


    Encryption is CPU intensive and can lead to longer client response times. To improve
    the situation, OpenSSL has support for hardware cryptographic acceleration. On
    zSystems, CPU delegates the encryption process to a specially developed piece
    of hardware commonly referred to as the crypto engine. Off-loading encryption
    to hardware improves zSeries performance, as well as providing improved client
    response times.


    To use the zSeries crypto engine:


    +   1. Installing the crypto engine.

    2. Creating a crypto device node.

    3. Configuring mod_ssl to use the crypto engine.'
