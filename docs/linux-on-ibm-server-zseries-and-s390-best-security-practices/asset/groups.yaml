    ### 4.10.5 从 Windows 到 Linux 创建本地转发隧道


    使用命令 **ssh -L 5900:127.0.0.1:5900 root@192.168.4.1** 命令将 Windows 机器（运行 VNC 查看器处）上的端口
    5900 转发到 Linux 主机 192.168.4.1（运行 VNC 服务器处）。


