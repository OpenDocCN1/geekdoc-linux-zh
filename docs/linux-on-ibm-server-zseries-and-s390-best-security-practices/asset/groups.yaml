    # 3.5 Securing Linux using Bastille


    > **Note:** Using IP addresses instead of host names is more secure, because host
    names can be compromised through the DNS records by attacks, where an attacker
    pretends to be another host.


    Bastille Linux is an open source project to "harden" a Linux installation by adjusting
    various system settings. The Bastille home page is available at:


    http://www.bastille-linux.org


    Bastille is a useful tool for system administrators to discover and tighten security
    settings. A graphical user interface enables administrators to choose security
    settings appropriate for their environment. Bastille automatically implements
    changes based on selections provided by the user.


    > **Note:** The version of Bastille provided with SLES8 (1.2.0) does not work
    on Linux for zSeries. However, Bastille Version 1.3.0 will work if installed from
    the source code distribution (because Bastille is written in Perl, no compilation
    is required). Bastille Version 1.3.0 can be obtained from the Rpmfind.net server,
    available at:


    http://rpmfind.net


    Choose the Mandrake 1.3.0 package.


    ## 3.5.1 Configuring security settings with Bastille


    To configure security settings with Bastille, use the **InteractiveBastille**
    command. This initiates the Bastille configuration interface shown in Figure 3-4
    on page 48. Be aware that you need an X Windows server in order to run the application.


    ![](img/a2760634ecd5eb26c25e81867e88d740_61_0.png)


    Security settings are configured using IBM Perl modules (displayed on the left
    side of the screen). Bastille selects security settings based on responses from
    a series of questions posed to administrators. Bastille provides modules to customize
    settings for:


    - File Permissions: This module enables you to set restrictive file permissions
    on administrative utilities.

    - Account Security: This module is used to adjust user account settings.

    - Boot Security: This module adjusts Linux boot settings (such as the Ctrl-Alt-Del
    key behavior).

    - Securenet: This module configures TCP_wrappers settings.

    - DisableUserTool: This module configures user access to system tools (such as
    the gcc compiler).

    - ConfigureMiscPAM: This module configures PAM authentication settings.

    - Logging: This module configures system log settings.

    - MiscellaneousDaemons: This module can disable daemons that are often unnecessary
    and pose potential security risks.

    - Sendmail: This module enables you to disable daemon mode for the sendmail. Bastille
    will ask you if you would like to run sendmail every few minutes to process the
    queue of outgoing mail.

    - Apache: This module can adjust security settings for the Apache Web server.

    - TMPDIR: Many programs use the /tmp directory dangerously. This module can provide
    more secure alternatives to the /tmp directory (using TMPDIR or TMP environment
    variables).


    > Note: Bastille offers a simple method to change system settings. Be aware that
    some settings can deny yourself (or other users) access to a command or service.


    ## 3.5.2 Reverting changes


    Bastille has the ability to revert system settings using the UndoBastille command.
    Information about how to undo changes is stored in /var/log/Bastille/undo directory.
    Before committing changes to system settings, Bastille copies existing configuration
    files to the appropriate location in the /var/log/Bastille/undo/backup directory.
    A record of all actions performed by Bastille is saved in the /var/log/Bastille/action-log
    file. Executing the UndoBastille command restores configuration files from the
    backup.


    > Important: Changes cannot be undone by simply removing Bastille. To restore
    system settings and remove Bastille, execute UndoBastille before removing Bastille.


    Before committing changes, Bastille logs settings to the /etc/Bastille/config
    file. Therefore, we recommend that you back up the config file before running
    Bastille. Consider doing a complete system backup as well.


    ## 3.5.3 Copying the Bastille setup to other hosts


    If you have a number of similarly configured hosts large, it is possible to automate
    Bastille configuration:


    1. Run the **InteractiveBastille** command on the first host, choosing the desired
    security settings.

    2. Install Bastille on the other hosts. Copy the /etc/Bastille/config configuration
    file to each host.

    3. Run the **BastilleBackEnd** command on each new host to commit the changes.


