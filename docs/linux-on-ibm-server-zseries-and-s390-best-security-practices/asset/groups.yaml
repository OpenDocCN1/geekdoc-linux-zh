    \ 页 2.6.5 节“MDISK 语句”。\n\n6. 使用 `LINK` 语句在虚拟机之间定义微磁盘，如第 24 页 2.6.6 节“LINK 语句”所示。\n\
    7. 设备可以专留给特定的虚拟机，如第 24 页 2.6.7 节“DEDICATE 语句”所示。\n\n## 2.6.1 USER 目录条目\n\n`USER`\
    \ 语句指定了虚拟名称、密码、虚拟机大小和 CP 命令权限类。用户名长度为 1 到 8 个字符。系统识别两个虚拟机大小操作数：第一个指定登录时的地址空间大小，第二个指定用户使用\
    \ `CP DEFINE STORAGE` 命令时可以指定的最大地址大小。\n\n### 指定用户密码\n\n用户密码字段指定了登录时需要的 1 到 8 个字符的密码。可以在密码字段中指定特殊的密码选项：\n\
    \n- NOLOG\n  指定密码值为 `NOLOG` 将防止用户登录。`NOLOG` 虚拟机用于管理共享 VM 资源。例如，将共享微磁盘分配给无法登录的虚拟机，是一种易于识别这些微磁盘的机制。\n\
    \n- NPASS\n  如果指定，`NPASS` 选项允许用户在不提供密码的情况下登录。\n\n> 重要：`NPASS` 虚拟机应被视为安全风险，不应允许出现在\
    \ VM 目录中。\n\n如果安装了 ESM（例如用于 z/VM 的 RACF），即使指定了 `NOPASS` 密码选项，可能仍然需要密码。\n\n- AUTOONLY\n\
    \  `AUTOONLY` 密码选项指定虚拟机只能通过 `CP XAUTLOG` 命令登录。终端登录已禁用。\n\n- LBYONLY\n  `LBYONLY`\
    \ 密码选项指定虚拟机只能通过代理用户登录。代理用户是另一个有权登录此虚拟机的 VM 用户。\n\n要作为代理用户登录，请使用 `CP LOGON` 命令并指定\
    \ `BY`（其中 `BY` 操作数为代理用户 ID）。在提示时，代理用户必须指定其特定的密码，而不是登录虚拟机的密码。`LBYONLY` 虚拟机必须至少定义一个代理用户，如第\
    \ 23 页 2.6.4 节“LOGONBY 语句”所示。\n\n> 注意：使用 `LBYONLY` 选项，许多 VM 用户可以在不共享密码的情况下访问同一个虚拟机。\n\
    \n在启用日志记录（journaling）的情况下，可以允许许多 VM 用户访问一个公共虚拟机。\n\n### 指定权限类\n\n虚拟机权限类分配给 `USER`\
    \ 语句。可以指定多达 32 个单字符（代表定义的权限类，参见第 13 页 2.4 节“权限类”）。\n\n注意：未指定或指定为 \"*\"。\n\n##\
    \ 2.6.2 INCLUDE 语句\n\n`INCLUDE` 语句命名了要包含的配置文件。在构建用户条目时，请确保包含的内容不会违反 Linux 虚拟安全策略。\n\
    \n## 2.6.3 IPL 语句\n\n`IPL` 语句用于登录时启动虚拟机。在传统的 z/VM 环境中，通常启动 CMS。对于 Linux ，可以指定包含根文件系统的设备。\n\
    \n## 2.6.4 LOGONBY 语句\n\n`LOGONBY` 语句定义了最多 8 个可以作为代理用户的 VM 用户。登录时，要求代理用户提供其特定密码。代理用户见第\
    \ 21 页 2.6.1 节“USER 目录条目语句”。\n\n## 2.6.5 MDISK 语句\n\n`MDISK` 语句定义了虚拟机拥有的微磁盘和 VDISK。用户目录条目可以为微磁盘共享指定密码。微磁盘密码长度为\
    \ 1 到 8 个字符；识别三种类型：\n\n- 读取模式密码\n- 写入模式密码\n- 多写模式密码\n\n链接微磁盘（使用 `CP LINK` 命令）的\
    \ VM 用户需要提供相应的访问模式密码（读、写或多写）。有关磁盘访问模式的详细信息，请参考 z/VM V4R.4 规划与管理 SC24-6043。\n\n\
    密码可以指定为 ALL，在这种情况下尝试链接微磁盘无需密码。\n\n> 重要：为了确保 z/VM 的安全，始终对共享微磁盘要求复杂的密码；不允许使用 `ALL`\
    \ 密码选项。此外，通过禁用 `PASSWORDS_ON_COMMANDS` 功能，始终要求提示密码（不允许作为命令的一部分传递密码），该功能见第 15 页\
    \ 2.5.2 节“系统功能”。\n\n## 2.6.6 LINK 语句 \n\n`LINK` 语句允许虚拟机访问另一个虚拟虚拟微微磁盘。可以授予只读或读写访问。通过使用\
    \ `LINK` 语句，你为跨虚拟机访问打开了大门。如果我们决定使用 `LINK` 语句授权 Linux 虚拟机访问其他虚拟微磁盘，我们的建议是你必须极其谨慎。\n\
    \n## 2.6.7 DEDICATE 语句 \n\n`DEDICATE` 语句将物理设备的独占所有权分配给虚拟机。对于磁带设备，`DEDICATE` 将该设备与其他虚拟机共享串行访问。专用（DEDICATED）设备由虚拟机所有并控制。在处理给\
    \ Linux 虚拟机的物理设备时要谨慎选择。\n"
