    \ 的性能，并提供改进的客户端响应时间。\n\n要使用 zSeries 加密引擎：\n\n- 1. 安装加密引擎。\n- 2. 创建加密设备节点。\n- 3.\
    \ 配置 mod_ssl 使用加密引擎。\n\n### 4.3.1 安装加密引擎\n\nz90crypt90.a 模块是加密加速器的设备驱动程序。我们安装加密引擎驱动程序并查询检测到的加密加速器，如示例\
    \ 4-6 所示。\n\n示例 4-6 安装并检查加密引擎\n\n```\n# insmod z90crypt\nUsing /lib/modules/2.4.19-3use-SMP/kernel/drivers/misc/s390/z90crypt.o\n\
    # cat /proc/driver/z90crypt\n```\n\nz90crypt version: 1.1.1\nCryptographic domain:\
    \ 0\nTotal device count: 1\nPCICA count: 1\nPCICC count: 0\nrequest count: 0\n\
    pending count: 0\nTotal open handles: 0\n\n在线设备的掩码：01 意味着 PCICA，02 意味着 PCICC\n\
    驱动程序检测到了 PCI 总线加速器 (PCICA) 硬件接口。\n注意：PCI 总线控制器 (PCICC) 是软件加密模块。\n\n### 4.3.2 创建加密设备节点\n\
    \nz90crypt 的设备节点如下：\n\n```\n# mknod /dev/z90crypt c 254 0\n```\n\n其中：\n\n| 字段\
    \ | 描述 |\n| :--- | :--- |\n| c | 指定创建字符设备。 |\n| 254 | 指定主设备号。 |\n| | 指定次设备号。 |\n\
    \n确保 z90crypt 是可写的，如示例 4-7 所示。\n\n示例 4-7 使 z90crypt 可写\n\n```bash\n# ls -l z90crypt\n\
    -r--r--r-- root root 0 Aug 7 16\n# chmod 666 z90crypt\n# ls -l z90crypt\n-rw-rw-rw-\
    \ root root 0 Aug 7 16\n```\n\n### 4.3.3 配置 mod_ssl 使用加密引擎\n\n配置 mod_ssl 使用加密引擎，将示例\
    \ 4-8 中的高亮行添加到 `/etc/httpd/httpd.conf` 文件中。\n\n示例 4-8 在 /etc/httpd/httpd.conf\
