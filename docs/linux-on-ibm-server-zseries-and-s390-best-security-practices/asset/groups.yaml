    331 User name ok, please send complete E-mail address as password.

    Password:

    >>>PASS *******

    230 User logged in, proceed.

    Command:

    locsite fix 80

    >>>TYPE a

    200 Type set to A.

    Command:

    ascii

    Command:

    get SGINST.EXEC (REPLACE)

    Command:

