  - '[PAGE 128]


    ![](img/a2760634ecd5eb26c25e81867e88d740_128_0.png)


    Figure 6-21 StoneGate multilink technology for high availability


    NetLinks enable easily configured load-balanced connections in the event of a
    router or network failure.


    > Note: The number network links is not limited by or dependent on the number
    of the physical firewall interfaces. A single NIC can accommodate several CVIs,
    each defined in a single IP address space. In this way, a single physical interface
    can connect several ISPs if required. When firewall nodes are clustered, a node
    failure does not mean that all connections to the ISP are lost. Instead, connections
    are immediately switched over to a functioning node.


    # Load-balanced routing


    Traffic can be load balanced across all available links, improving overall network
    throughput. For example, Stonesoft''s patented load-balanced routing technology
    enables routing through the fastest available link. The dynamic routing engine
    (which performs load-balanced routing) sends an initial packet out through each
    network link, measuring the response times. Based on the measurement, connections
    are routed automatically through the link with the best performance.


    # Increasing the bandwidth


    As bandwidth requirements increase, the traditional solution has been to pay more
    to the existing provider; changing would result in the expensive change of public
    IP addresses. With StoneGate, you can increase the bandwidth by simply adding
    new ISPs to your network. StoneGate can incorporate multiple ISPs into a single,
    virtual Internet connection.'
  - '[PAGE 129]


    # ### 6.4.2 Benefits of multilink technology


    The advantages of StoneGate''s multilink technology include:


    +   - More secure networks

    There are fewer possibilities for traffic to bypass firewalls through other network
    devices.


    +   - Less complicated networks

    The firewall takes care of the load balancing (eliminating the need for special
    load re-directors, switches, or other devices that might introduce single point
    of failure). The time and cost required for network maintenance and configuration
    is reduced.


    Multilink technology simplifies the use of multiple ISPs and increases the availability
    and bandwidth at use for critical applications. Transactions load-balanced routing
    always select the optimal route to a destination.


    # ### 6.4.3 Applying multilink technology


    Multilink technology can be applied in three unique scenarios:


    +   - Outbound traffic management

    - Multilink VPNs

    - Inbound traffic management


    Each scenario handles high-availability and load balancing differently.


    # #### Outbound traffic management


    Outbound traffic management in StoneGate provides both high availability and load
    balancing between multiple NetLinks. Load balancing between ISPs increases overall
    network throughput. For each connection request, StoneGate firewall can select
    the fastest route for the connection. Figure 6-22 on page 117 illustrates outbound
    traffic management decisions, using the round trip time of the first SYN packet
    as the basis for the load-balanced routing decision.'
  - '[PAGE 130]


    ![](img/a2760634ecd5eb26c25e81867e88d740_130_0.png)


    Figure 6-22 Outbound load balancing


    # # Multilink VPNs


    VPNs are an increasingly critical component of enterprise networks. Trusted communication
    with remote offices or users through the insecure Internet is possible using encrypted
    tunnels to internal networks. Historically, VPN tunnels were subject to failure
    in the event of router or link failures. Often, only one VPN tunnel could be established
    with a remote site, placing bandwidth restrictions on an already limited connection.


    Using StoneGate, clustered, load-balanced IPsec VPN tunnels are now possible.
    A logical tunnel consisting of one or more physical VPN tunnels through different
    ISPs is possible. Figure 6-23 on page 118 demonstrates a VPN consisting of two
    physical links at one end and three at the other. In this example configuration,
    StoneGate can use six different subtunels, forming one virtual VPN tunnel to load
    balance VPN traffic between sites.'
  - '[PAGE 131]


    ![](img/a2760634ecd5eb26c25e81867e88d740_131_0.png)


    Figure 6-23 Clustered, highly available VPN tunnels


    If one subnet collapses, connections using that tunnel are automatically shifted
    to another subnet established with the remote site. Should all ISP links be down,
    StoneGate can bring standby links (such as leased lines or dialup connections)
    into use. This introduces true fault tolerance and high availability to VPN traffic.


    # Inbound traffic management


    StoneGate can load balance connections to different services in an internal network
    (Web servers, for example). With existing technologies, it is often necessary
    to deploy additional load-balancing switches, clustering software, and special
    load-balancing hardware to ensure high availability and improved performance.
    As shown in Figure 6-24 on page 119, network administrators are faced with additional
    complexity to achieve network high availability.'
  - '[PAGE 132]


    ![](img/a2760634ecd5eb26c25e81867e88d740_132_0.png)


    Figure 6-24 Traditional inbound load balancing


    With StoneGate, administrators can taking advantage of multilink technology to
    load balance network services. For example, a Web server pool can be set up on
    a DMZ network, as illustrated in Figure 6-25 on page 120. StoneGate can share
    connections to the pool using load balancing between ISPs. The selection of the
    ISP can be based on dynamic DNS updates, or on multiple DNS entries. StoneGate
    constantly monitors server availability to ensure that connections from a particular
    source address are handled by one server only.'
