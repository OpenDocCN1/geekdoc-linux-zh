    ### Configuring PAM for LDAP authentication


    Modify the /etc/pam.d configuration file for each service that uses LDAP authentication.
    Example 7-5 illustrates the configuration file used for Telnet login.


    Example 7-5 The /etc/pam.d/login file for LDAP authentication


    ```

    #PAM-1.0

    auth        required pam_nlogin.so

    auth        sufficient pam_unix_auth.so

    auth        required pam_ldap.so        try_first_pass

    account     required pam_localuser.so

    account     required pam_ldap.so

    password    required pam_pwcheck.so      nullock

    password    required pam_ldap.so        use_first_pass use_authok

    password    required pam_unix.so        nullock use_first_pass use_authtok

    session     required pam_unix_session.so

    session     required pam_limits.so

    session     required pam_env.so

    session     optional pam_mail.so

    ```


    These changes include:


    - 1. The pam_unix_auth.so module implements auth type user authentication and
    is capable of supporting NSS. The sufficient control flag ensures success if a
    locally defined (the /etc/passwd file) is authenticated.

    - 2. If auth type authentication against a local does not succeed, the required
    pam_ldap.so module attempts to authenticate using LDAP.

    - 3. The pam_localuser.so module performs account authentication for local users.
    The sufficient control flag ensures success in the event a local user is authenticated.

    - 4. In the event account type authentication does not succeed again against a
    local user, the pam_ldap.so module authenticates against LDAP.

    - 5. The pam_ldap.so module is capable of password update requests against an
    LDAP directory.


    > Tip: Although it is possible to maintain all user information in the remote
    LDAP directory, it is good to define at least one user with superuser authority
    locally. This allows host access in the event LDAP is unavailable.


