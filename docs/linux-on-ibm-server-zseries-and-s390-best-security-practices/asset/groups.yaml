    ![](img/a2760634ecd5eb26c25e81867e88d740_104_0.png)


    **Figure 6-4** StoneGate multi-layer inspection model


    The state of connections provides valuable information for assessing incoming
    packets. Each packet must be either accepted directly by the rule or be part of
    a previously accepted connection or of a related connection. Whenever packets
    arrive, the firewall checks them against active connections before proceeding
    through the rules of the security policy. If a connection has a registered state,
    all the packets following the opening packet can pass the firewall without having
    to traverse the rulebase.


    By default, most rules in StoneGate security policies implement state inspection
    methods. The administrator can configure rules with simple packet filtering for
    certain types of traffic. For example, SNMP traps from server systems and network
    devices can pass through the firewall to a management network on the basic of
    simple packet filtering in case there is no to enforce a more strict inspection.
    This flexibility enhances the firewall performance.


    In addition, application-level security can be applied to specific rules in the
    security policy when needed. Multi-layer inspection is capable of providing this
    type of security without the performance degradation of conventional proxy firewalls.
    StoneGate can implement application-level inspection without the need to handle
    two separate connections. This is achieved with the components called protocol
    agents that can be assigned to certain types of traffic.


    Protocol agents are also used to:


    - Handle complex connections (for example, connections to an FTP server)

    - Redirect traffic to content inspection servers

    - Enforce protocol standards

    - Modify data payload if necessary


    The FTP protocol agent can inspect the control connection and allow only packets
    containing valid FTP commands. It can be configured to redirect traffic to a content
    inspection server (CIS), or to modify IP addresses in the payload if network address
    translation is required.


    > Note: For more details about protocol agents, consult the StoneGate Administrator’s
    Reference, available to registered customers at the Stonesoft web:


    http://www.stonesoft.com


    Multi-layer inspection combines application-layer inspection, stateful inspection,
    and packet filtering technologies for added security without affecting system
    performance.


    ## 6.2.5 Firewall functions


    A firewall can have several different functions on a network. Although the main
    function is to control network access, firewalls can be configured for other basic
    network security tasks, as well as for complex monitoring and filtering functions.


    ### Access control


    The primary task of any firewall is to allow network access to only authorized
    connections. Access control is enforced in access rules that are combined into
    rule bases. The rule bases reflect the corporate network security policy.


    ### Monitoring and logging


    Firewalls can measure and monitor traffic load and attributes. A very important
    firewall feature is the ability to log monitored traffic. Properly logged data
    can be used to detect intruders and establish evidence to use against attackers.
    That kind of forensic evidence might prove to be invaluable in case malicious
    hacking leads to lawsuits.


    More commonly, logging is used to track the use of network resources, building
    a case for required services or hardware. Logging also helps administrators detect
    and troubleshoot network mis-configurations or failures.


    ### Network address translation


    Network address translation (NAT) is a feature that enables the firewall to modify
    the IP addresses of packets it forwards. It was originally created to alleviate
    the problem of the rapidly diminishing IP address space. By changing the network
    address of the originating (internal) network, your network gains an added side-benefit;
    the private IP addresses of hosts and the structure of an internal network can
    be concealed by a firewall. In fact, NAT enables you to hide your entire network
    behind a single public IP address.


    As handy as NAT can be in terms of scarce public IP addresses and security, it
    is important to understand that NAT is not primarily a security feature. It is
    simply a method of modifying packets that lends itself to security applications.


    ### Authentication


    Firewalls are used to authenticate users accessing network resources from other
    locations. The various authentication methods ensure that the users trying to
    connect really are who they claim to be.


    These methods can involve a third-party authentication service based on standard
    protocols, such as RADIUS or TACACS+, but it can also be based on the originating
    IP address or other parameters, such as user names and passwords.


    ### Virtual private networks


    Virtual private networks (VPNs) conceal and encrypt traffic between endpoints
    to establish a virtual, secure tunnel through an insecure, typically public, network.
    Firewalls are used at the tunnel endpoints as security gateways to encrypt and
    decrypt data passing between them, creating a site-to-site VPN. VPNs can also
    be established between a client machine, such as a remote laptop, and the firewall.
    Figure 6-5 illustrates a simple, site-to-site VPN.


    ![](img/a2760634ecd5eb26c25e81867e88d740_106_0.png)


    Figure 6-5 Simple VPN example


    When a packet leaves Site A, destined for Site B, and reaches Gateway A, it is
    encrypted by the firewall. After it reaches the Site B gateway, the packet is
    decrypted and re-shaped into cleartext form. When concealing the traffic this
    way, it is possible for two different sites that might be on other sides of the
    world from each other to share resources and communicate with each other safely
    over the Internet.


    ### Content screening


    Although not used as the primary tool for virus detection, firewalls can be used
    in combination with content inspection servers (CISs). The data portion of incoming
    packets can be examined for potentially malicious content. Viruses or hazardous
    content can be discarded before packets enter the internal network.


    For example, incoming SMTP e-mail traffic could be forwarded to the firewall to
    the CIS for virus and content checking. After any suspicious content is removed,
    scrubbed packets are returned to the firewall for routing to their final destination.


    Content inspection can also flow in the opposite direction. Incoming HTTP traffic
    can be sent from the firewall to the CIS. The source Resource Locator (URL) can
    be examined to deny access to inappropriate sites. Figure 6-6 illustrates firewall
    interaction with a CIS.


    ![](img/a2760634ecd5eb26c25e81867e88d740_107_0.png)


    Figure 6-6 Content screening with CIS


    ## 6.2.6 Requirements for modern firewalls


    As the volume and the importance of Internet traffic grows, it becomes increasingly
    essential for firewalls to meet specific requirements.


    ### High availability


    Advanced clustering technologies prevent firewalls from being bottlenecks or single
    points of failure. Firewalls are clustered when multiple firewall nodes function
    as a single, virtual entity and enforce security policies. Each node contributes
    to the total throughput, providing a fault tolerant, reliable firewall. High availability
    means that traffic from a failed node can be transparently switched to other nodes.
    Node maintenance can occur without disturbing the firewall. Availability of network
    services is crucial for both user satisfaction and network security. Clustering
    can be implemented either with specific additional hardware, with add-on software,
    or with a built-in clustering capability. The firewall instance depicted in Figure
    6-7 acts as a single point of failure.


    ![](img/a2760634ecd5eb26c25e81867e88d740_108_0.png)


    By introducing multiple firewall instances, as shown in Figure 6-8, the single
    point of failure is eliminated.


    ![](img/a2760634ecd5eb26c25e81867e88d740_108_1.png)


    ### Scalability


    As traffic volume increases, congestion disrupts network traffic. By definition,
    the firewall is a choke point through which all traffic should pass. It is crucial
