    Note: If not specified or specified as "*\


    # 2.6.2 The INCLUDE statement


    The INCLUDE statement names a profile entry to be included as part of a user definition.
    When constructing a user entry, ensure that statements in any included profile
    do not violate security policy for Linux virtual machines.


    # 2.6.3 The IPL statement


    The IPL statement is used to boot a virtual machine at logon. In a traditional
    z/VM environment, CMS is typically IPLed. For Linux machines, the device containing
    the Linux root file system can be specified to automatically load Linux.


    # 2.6.4 The LOGONBY statement


    The LOGONBY statement defines up to eight VM users that can act as surrogate users.
    When logging on, VM expects the surrogate user to provide their specific password.
    Surrogate users are discussed in 2.6.1, “The USER directory entry statement” on
    page 21.


    # 2.6.5 The MDISK statement


    The MDISK statement defines minidisks and VDISKS owned by the virtual machine.
    It is possible for the user directory entry to specify passwords for minidisk
    sharing. MDISK passwords are one to eight characters in length; three types are
    recognized:


    +   - Read mode password

    - Write mode password

    - Multiple write mode password


    VM users linking to a minidisk (using the CP LINK command) are expected to provide
    the password appropriate for the desired access mode (read, write, or multiple
    write). For details about the disk access modes, consult the MDISK statement in
    z/VM V4R4.0 CP Planning and Administration, SC24-6043.


    Passwords can be specified as ALL, in which case attempts to link to the minidisk
    succeed without requiring a password.'
  - '[PAGE 37]


    > Important: To ensure a secure z/VM system, always require non-trivial passwords
    on shared minidis; disallow use of the ALL password option. In addition, always
    require password prompting (disallow passwords passed as part of CP commands)
    by disabling the PASSWORDS_ON_COMMANDS feature, as discussed in 2.5.2, “System
    features” on page 15.


    # ### 2.6.6 The LINK statement


    The LINK statement allows a virtual machine to access a minidisk by another virtual
    machine. Read-only or read-write access can be granted. By using the LINK statement,
    you open the door for cross-virtual-machine access. Our recommendation is that
    you exercise extreme care if you decide to use LINK statements to authorize your
    Linux virtual machines to have access to other virtual machines’ minidisks.


    # ### 2.6.7 The DEDICATE statement


    The DEDICATE statement assigns sole ownership of a real device to a virtual machine.
    For tape devices, DEDICATE assigns serial, shared access to the device with other
    virtual machines. A DEDICATED device is owned and controlled by the virtual machine.
    Be selective when dealing real devices to Linux virtual machines.


    # ### 2.6.8 The OPTION statement


    Special characteristics can be assigned to a virtual machine using the OPTION
    statement. Most options give the virtual machine higher authorization than that
    would normally receive. Consult z/VM V4r.0 CP Planning and Administration, SC-264-043,
    for details about the OPTION statement.


    > Note: In keeping with the policy that Linux virtual machines should run with
    no higher than general user authorization, the OPTION statement should not be
    present in the directory entry for a Linux guest.


    # ### 2.6.9 The SPECIAL statement


    The SPECIAL statement is used to define a virtual network interface card (NIC)
    to the virtual machine and connect the NIC to a virtual network (such as a Guest
    LAN segment). For Guest LANs, the SPECIAL statement is equivalent to performing
    the CP DEFINE NIC and COUPLE commands in order to connect the guest to a virtual
    machine. The SPECIAL statement typically connects a virtual machine to a persistent
    Guest LAN.'
- md: '

    ## 2.7 Directory Maintenance Facility


    Maintaining the user directory can be simplified using the automation and command
    interface provided by the Directory Maintenance Facility (DirMaint). Every directory
    entry statement is implemented as a DirMaint command.


    > Note: DirMaint is a separately licensed z/VM feature. With z/VM Version 4.4,
    DirMaint is shipped with the system installation media as a convenience. You must
    obtain a separate license to enable DirMaint.


    DirMaint provides the following facilities to ensure system integrity when updating
    the user directory:


    - Error checking is performed to ensure only changes are applied to the user directory.

    - Authorization to modify specific directory statements can be delegated to z/VM
    users.

    - Modifications to the user directory are performed by DirMaint service machines
    (thus reducing the need for grant authorization to other z/VM virtual machines).

    - DirMaint can maintain the user directory for both local and remote z/VM systems
    (again reducing the need for grant elevated authorization).


    ## 2.7.1 DirMaint security features


    DirMaint supports the z/VM security strategy:


    - Access to user IDs is password controlled. DirMaint maintains user passwords,
    with customer choice of administration control or user control. DirMaint also
    supports the use of ESM for password control.

    - Access to minidis is controlled either by password or explicit link authorization
    (as determined by the minidis owner). Minidisk passwords are optional for controlling
    minidisk directory links. DirMaint supports control

    - VM system services are used to identify the originating user ID (and node ID)
    for all requests (local and remote). By default, requests are authenticated using
    the logon password for each DirMaint transaction. Unless prohibited by the system
    administrator, users can request suspension of authentication for requests made
    from their user ID. Remote requests never require authentication, and surrogate
    requests always require authentication.

    - All DirMaint commands involving the DirMain service machines (DIRMAINT, DATAMOVE,
    DIRMSAT) are auditable. A few DirMaint commands (CHECK, DEFAULTS, GLOBAL, and
    HELP) are completely processed in the user''s virtual machine and are therefore
    not auditable by DirMaint. They might, however, be auditable by an ESM.


    All messages generated by the DirMaint service machines are auditable. An routine
    can support customer-tailorable filtering of unnecessary audit details.


    > Note: For more information about DirMaint service, refer to z/VM V4R.0 General
    Information, GC24-5991


    ## 2.8 RACF for z/VM


    As mentioned earlier, there is a RACF product available on z/VM, and we recommend
    the use of RACF to secure the z/VM system itself. Refer to z/VM Security and Integrity,
    by Alan Altmark and Cliff Laking, for a discussion of this. For the Linux environment
    executing on z/VM, we demonstrate how our operating system environments on the
    zSeries platform can operate using non-proprietary, open interfaces. We choose
    to use LDAP for directories, in this case having the LDAP server executing on
    a z/OS image. We use the same z/OS image to show how LDAP and RACF on z/OS can
    operate to create a secure environment.


    > Note: RACF for z/VM is a separately licensed feature. With z/VM V4.4, RACF is
    shipped with the system installation media as a convenience. You must obtain a
    separate license to enable RACF.


    The value of using RACF as a back end for LDAP is that all your existing RACF
    users can be given to access Linux machines, using the user ID and password that
    they use for their z/OS-related work. Second, the password can never be compromised;
    it is always encrypted in the RACF database. Conversely, if you decide to have
    the root user ID in RACF, all your root passwords for all your Linux machines
    will have to be the same. If that single password is compromised, access will
    be given to your entire set of Linux machines.


    If you decide to have the root user ID managed from outside of your Linux machine,
    we strongly recommend that you do not use RACF on z/OS for that purpose, but instead
    leave the control in LDAP on z/OS.


    For information, refer to Chapter 7, “Using z/OS features in a Linux environment”
    on page 137.


    ## 3

    ## Hardening a Linux installation


    In this chapter, we examine options for creating a more secure Linux installation.
    We use the term hardening to indicate processes and procedures taken to reduce
    the likelihood of system compromise. Topics discussed include:


    - Linux system logging

    - Pluggable Authentication Modules

    - Delegating superuser authority with sudo

    - Securing Internet services with TCP_wrappers

    - Securing Linux using Bastille


    ## 3.1 Linux system logging


    Linux logging is controlled by the syslog utility. The syslogd daemon accepts
    incoming log messages from a variety of sources, such as:


    - The Linux kernel

    - System services (such as mail, cron, PAM)

    - Applications programs


    In addition to the message text, incoming log messages indicate:


    - The service or application generating the message (the *facility*)

    - The severity of the message (the *level*)


    The syslog utility adds a timestamp, host identifier, and process identifier to
    incoming messages, and then processes the messages according to the specification
    found in the /etc/syslog.conf configuration file. Collectively, the message facility
    and level are referred to as the *selector*.


    ## 3.1.1 Configuring syslogd


    The /etc/syslog.conf file is used to determine the disposition of incoming messages.
    Entries in /etc/syslog.conf are of the form:


    *facility.level action*


    Defined syslog facilities include:


    | Facility | Description |

    | :--- | :--- |

    | auth | Authentication messages (deprecated) |

    | authpriv | Authentication messages |

    | cron | Messages from cron |

    | daemon | Messages from system services (daemons) |

    | kern | Kernel messages |

    | lpr | Printing service messages |

    | mail | Mail service messages |

    | mark | Internal syslog time stamp messages |

    | news | News service messages |

    | syslog | Syslog messages |

    | user | User application messages |

    | uucp | up messages |

    | local0-local7 | Messages from locally-defined services |


    Defined syslog levels include:


    - emerg | Fatal system error

    - alert | Errors that require immediate attention

    - crit | Errors that disable a system service

    - err | Errors that disable a system service component

    - warning | Warning notice

    - info | Normal message

    - debug | Debug message


    Warning message

    Normal message

    Informational message

    Debug message


    The action indicates where syslog is to direct incoming messages. Syslog can report
    messages to a:


    - Log file

    Action specifies the log file name. Typically, the /var/log/messages file is specified
    for all syslog messages. If a file name is prefixed with a "-" character, syslog
    will not sync the file after each write.


    - Remote host

    Action can specify a remote host name or IP address. In this case, the "@" precedes
    the IP address or host name. Log messages are then directed to the syslog running
    on that host. We discuss logging to a remote host in 3.1.2, “Using a central log
    server” on 30.


    - Console

    To log to the console, specify /dev/console as the action.


    - Logged on user

    To log messages to a user, specify the user name as the action. A list of users
    can be specified (each user name separated by a comma, ",") the action is specified
    as "*", log messages are directed to all users.


    - Named pipe

    To direct log messages to a named pipe, specify the "|" prefix before the pipe
    name.


    Example 3-1 illustrates a sample syslog configuration file.


    Example 3-1 Sample /etc/syslog.conf file


    ```

    # /etc/syslog.conf Configuration file for syslog(8)

    # Print most on /dev/console

    kern.*;warn;news.emerg;mail.alert;authpriv.none    /dev/console

    # all email-messages in one file

    mail.*                               /var/log/mail

    # Warnings in one file

    .*=warn;.*=err                               /var/log/warn

    # save the rest in one file

    .*;mail.none;news.none                             /var/log/messages

    # Log to a remote host

    .*                                     192.168.10.1

    ```

