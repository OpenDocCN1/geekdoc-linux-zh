- md: '

    # Management system backups


    Proper care of system backups is an essential security precaution that should
    not be overlooked. In the event of a catastrophic failure of the Management Server
    or Log Servers, the firewall engines decide to continue operation. In the unlikely
    event the management system needs to be restored (or if you want to transfer the
    Management Server to a new computer), a backup of the management system (Log Servers
    and Management Server) can be created. The backup consists of data from the Management
    database (network elements, firewall configurations, security policies, and user
    accounts) stored in a single ZIP file. The backup file can be encrypted and protected
    with a password. The Log Server and its database with all of the log entries can
    be backed up in a similar manner.


    # Firewall engines


    The firewall engines at the core of StoneGate run on an integrated, hardened,
    Linux-based system installed with the engine. Each node can have multiple network
    interfaces. The engines inspect and filter packets addressed to or sent from the
    network they protect.


    StoneGate firewalls can be configured in standby mode; one node is online, the
    other waits to takeover from the first. Should the online node fail or be taken
    offline, the standby node automatically assumes the role of the online node.


    Supporting systems (such as the configurable subsystem) also run on the firewall
    nodes. The kernel, protocol agents, firewall, test subsystem, and logging services
    each function independently. This ensures that the engine is robust; an error
    or corruption in one service will not affect other services. The system can continue
    until repairs or regular maintenance corrects them. The engine on each node communicates
    with the management system sending performance statistics, state information,
    and log data and receiving policy updates and configuration changes.


    Engines are configured through configuration files loaded onto the nodes by the
    management system. These files are encrypted on each node. Unauthorized access
    to the firewall itself will not reveal further information about the network.
    Configuration files are generated by the management system based on input from
    the administrator through the GUI. No manual re-configuration is required, and
    no software can be upgraded remotely by the GUI. There is no need to physically
    access the firewalls in order to perform an upgrade.


    Each firewall node runs a test subsystem. Administrators can define or enable
    additional tests and test conditions on the firewall nodes. For example, if a
    network interface fails, a node can be switched offline, traffic redistributed
    to remaining online system, and an alert sent to an administrator.


    # 6.3.3 Communications between the components


    Table 6-1 summarizes the communications between different StoneGate components
    and shows traffic volumes typically generated. Traffic volumes are categorized
    as:


    - - High

    High volume regular traffic. A high throughput link is desirable.


    - - Medium

    A low bandwidth link, such as a modem, might not suffice.


    - - Low

    One-time contact only.


    Table 6-1 Communication between StoneGate components


    | GUI client | Log Server | Management Server | Engine |

    | :--- | :--- | :--- | :--- |

    | GUI client | NA | Medium when the client requests log information. | Medium:
    Periodically and on user action. | Never |

    | Log Server | Never | NA | Medium at startup, and then after that periodically
    and low. A broken link does not disturb the server''s operation. | Never |

    | Management Server | Never | Never | NA | Medium: when monitoring and uploading
    a configuration. |

    | Engine | Never | High when sending firewall logs. | Low: In initial configuration
    only. | Medium to High: Heartbeat and state sync traffic if HA mode is used. |


    The GUI client never communicates with the firewall engines. Instead, communication
    is through the Management Server. The highest volume of traffic is generated by
    the logs sent from the engines to the Log Server. To reduce traffic, data can
    be filtered. Each engine defined in a cluster communicates with all other engine
    in cluster, sharing information about current connections, load, and state information
    through Ethernet (IEEE 802) multicast.


    # 6.3.4 Network address translation between components


    StoneGate components can be deployed in a distributed architecture; components
    located on different can be managed from a single location. Network address translation
    (NAT) is required for component communication in this configuration. StoneGate
    supports NAT for management communications on the basis of contact IP addresses
    that can be defined in the GUI for each component.


    # 6.3.5 Secured communication


    The firewall engines, Management Server, and Log Servers authenticate using public
    key cryptography and digital certificates based on Secure Sockets Layer (SSL)
    protocol. This ensures that only authorized nodes and an authorized management
    system can take part in the cluster''s operation and configuration. Keys and certificates
    are automatically generated during installation. An internal StoneGate certificate
    authority (CA) is created automatically when installing the Management Server.


    # 6.3.6 Certificate backups


    In addition to performing backups of the Management and Log Server databases,
    you should create at least one backup of the certificates used by the management
    system and firewall engines. Store the certificates in a secure location. You
    can use the option of encrypting them with a password as well. Backed-up certificates
    can be easily restored when needed, for example, when you are reinstalling your
    Management Server on a new computer and you want to existing certificates instead
    of generating new ones.


    # 6.3.7 Distributed management


    With its distributed architecture, a single management system can monitor, control,
    and manage multiple StoneGate firewall clusters throughout the network. A distributed
    system is illustrated in Figure 6-14 on page 106.


    # Atlanta


    ![](img/a2760634ecd5eb26c25e81867e88d740_119_0.png)


    # Frankfurt


    # THE INTERNET


    # San Francisco


    Figure 6-14 Example of a distributed enterprise on a dedicated,


    The main administrator can deploy a management system on a dedicated, trusted
    LAN segment at the corporate headquarters. The Log Server and Management Server
    can be installed on a single server, or multiple machines. Additional GUI clients
    can be run from any trusted system. With this configuration, an administrator
    can define corporate-wide security policies as well as policies for remote office
    networks. StoneGate clusters in different offices can all be monitored, controlled,
    and managed from the same graphical interface interacting with a single, distributed
    management system. Local administrators can be defined with different administrator
    rights to delegate management tasks. They can be given certain permissions relating,
    for example, to the maintenance and monitoring of the system or rights to configure
    specific types of elements.


    106 Linux on IBM zSeries and S/390: Best Security Practices


    # 6.3.8 Implementation strategies


    One of the most useful StoneGate features is the ability to distribute components
    on different machines. Each machine can run on a different platform, for example,
    running the Log Server on Linux while running the Management Server on Solaris
    and the user interface on a Microsoft Windows platform.


    # Single management system


    One possible implementation, depicted in Figure 6-15 on page 108, runs the Management
    Server, Log Server, and GUI on the same machine. This strategy has multiple cost
    saving benefits:


    - Minimized hardware expense because of multiple servers on the same machine.

    - Simplified installation and reduced administrative costs.

