    \ loopback interface fails with the message: channel 2: open failed: connect failed:\
    \ Connection refused\n\n### 4.10.6 Connecting to the VNC server over the SSH tunnel\n\
    \nTo complete the procedure, start the VNC viewer on the Windows machine (pointing\
    \ to the server at 127.0.0.1:0). At this point, the connection is forwarded from\
    \ the Windows machine to the Linux VNC server. All network traffic is transparently\
    \ encrypted by the SSH tunnel.\n\n# 5 Implementing virtual private networks using\
    \ FreeS/WAN\n\nIn this chapter, we discuss FreeS/WAN, an open source implementation\
    \ of virtual private network (VPN) for Linux. Topics include:\n\n- An overview\
    \ of FreeS/WAN\n- Starting FreeS/WAN\n- Configuring FreeS/WAN\n\n![](img/a2760634ecd5eb26c25e81867e88d740_90_0.png)\n\
    \n## 5.1 An overview of FreeS/WAN\n\nSUSE LIN Enterprise Server Version 8 (SLES8)\
    \ for zSeries includes FreeS/WAN, an open source virtual private network (VPN)\
    \ implementation based on Internet Protocol Security (IPSEC). Details and documentation\
    \ can be found on the FreeS/WAN home page at:\n\nhttp://www.freeswan\n\n> Note:\
    \ FreeS/WAN is not included in Red Hat distributions.\n\nIPSEC is a mechanism\
    \ to authenticate and encrypt IP traffic at the IP level. Operating at this level,\
    \ IPSEC enables transparent authentication and encryption for IP-based protocol\
    \ (for example, FTP and Telnet), FreeS/WAN uses standard open protocols for authentication\
    \ and encryption:\n\n- Internet Key Exchange (IKE) protocol: IKE provides key\
    \ exchange and negotiates connection parameters\n- Encapsulating Security Payload\
    \ (ESP) protocol: ESP is used to encrypt and authenticate packet payload.\n\n\
    To illustrate VPN configuration using FreeS/WAN, we create the network depicted\
    \ in Figure 5-1.\n\n![](img/a2760634ecd5eb26c25e81867e88d740_91_0.png)\n\nFigure\
    \ 5-1 VPN implementation using FreeS/WAN on Linux for zSeries\n\n## 5.2 Linux\
    \ on IBM zSeries: Best Security Practices\n\nWe construct an encrypted IPSEC tunnel\
    \ between LNXSU2 and redhat2 server. The tunnel traverses an untrusted, external\
    \ network connected to an OSA-Express adapter. We note:\n\n- The IPSEC tunnel\
    \ endpoints are:\n    - The LNXSU2 Linux guest at 192.168.100.70 that forms the\
    \ left side of the IPSEC tunnel.\n    - The redhat2 Linux host at 192.168.200.11\
    \ that forms the right side of the IPSEC tunnel.\n- The external network simulates\
    \ a public network (such as the Internet). Normally, traffic on this network is\
    \ unencrypted and visible to any host connected to the network. However, tunnel\
    \ traffic between the two endpoints is encrypted.\n- The LNXSU2 Linux guest can\
    \ route packets from LNXSU4 guest. The LNXSU4 Linux guest forwards traffic destined\
    \ for the external network to the LNXSU2 guest. IP forwarding is enabled on the\
    \ LNXSU2 guest, and the guest acts as a packet filtering firewall using the iptables\
    \ command.\n\n### 5.1.1 Optimistic encryption\n\nIn FreeS/WAN, it is possible\
    \ to implement a nonstandard VPN mechanism referred to as optimistic encryption.\
    \ Typically, two VPN endpoints are configured in advance to exchange public keys\
    \ for authentication and encryption. With optimistic encryption, it is possible\
    \ for VPN endpoints to authenticate using information obtained from the Domain\
    \ Name System (DNS). This mechanism can reduce administrative overhead in configuring\
    \ IPSEC.\n\n> Note: Although optimistic encryption has been proposed as an extension\
    \ to the IPSEC protocol, it is a unique feature of FreeS/WAN. In this redbook,\
