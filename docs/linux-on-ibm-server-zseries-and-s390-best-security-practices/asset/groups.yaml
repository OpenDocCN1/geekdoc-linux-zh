    # 4.1 Introduction to Secure Sockets Layer


    Secure Sockets Layer (SSL) is a network protocol developed by Netscape Communications.
    Originally conceived to secure HTTP communications, because SSL operates below
    the application layer and above TCP/IP, it can be used to secure other application
    protocols (such as LDAP). SSL offers encryption and authentication using digital
    certificates.


    OpenSSL is an SSL implementation available for Linux on zSeries. The OpenSSL Web
    site is available at:


    http://www.openssl.org


    In this section, we look at OpenSSL to secure HTTP transactions using the mod_ssl
    Apache module.


    # 4.2 Enabling OpenSSL in Apache


    The mod_ssl package is distributed in RPM format and is available with SLES8:


    ```

    # rpm -qh grep -i ssl

    openssl-0.9.6g-20

    perl1-Net_SSleay-1.18-27

    sslwrap-2.10-336

    mod_ssl-2.8.10-36

    ```


    OpenSSL provides key and certificate generation functions. The mod_ssl provides
    strong encryption for the Apache web server. These two features can be obtained
    from:


    http://www.modssl.org


    To configure mod_ssl, we:


    +   1. Creating SSL keys.

    2. Generating an SSL certificate.

    3. Activating mod_ssl.

    4. Configuring mod_ssl.


    # 4.2.1 Creating SSL keys


    We first create an RSA key pair using the openssl genrsa command, as shown in
    Example 4-1 on page 53.'
