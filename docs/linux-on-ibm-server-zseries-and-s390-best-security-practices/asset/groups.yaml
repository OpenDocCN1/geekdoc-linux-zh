    Privilege classes help maintain zVM system integrity. Commands issued by general
    (class G) users cannot affect the operation of the CP or of any virtual machine
    other that of the executor. Beware that privilege classes A, B, and C have sufficient
    authority to bypass security controls.


    > **Important:** Never assign a higher privilege class to a user than required.
    Linux virtual machines, assign a privilege class no higher than class G.


    ## 2.5 The z/VM SYSTEM CONFIG file


    The system configuration file (SYSTEM CONFIG) stores configuration information
    of the system itself. This file contains system and I/O definitions. In traditional
    z/VM systems, the HCPRIO ASSEMBLE and HCSYS ASSEMBLE files are used for the same
    purpose. In this section, we identify and discuss selected SYSTEM CONFIG statements.
    Details about specific statements can be found in z/VM V4R.0 CP Planning and Administration,
    SC24-6043.


    > **Note:** In order for changes to the SYSTEM CONFIG to take effect, z/VM must
    be re-IPLED.


    ### 2.5.1 Enabling journaling


    The CP can be enabled to journal invalid passwords supplied to the CP LOGON or
    LINK commands. Use the JOURNALING statement to record invalid password events.
    See Example 2-1.


    Example 2-1 JOURNALING statement in the SYSTEM CONFIG file


    | Journaling, Facility |

    | :--- |

    | Set_and_Query |

    | Logon |

    | Message after 3 attempts to operator |

    | Account after 2 attempts |

    | Link |

    | Message after 3 attempts to operator |

    | Disable after 4 attempts |


    Example 2-1 illustrates the use of the JOURNALING statement:


    - 1. The journal facility is enabled.

    - 2. The CP SET JOURNAL and QUERY JOURNAL commands are enabled.


    Note: The QUERY JOURNAL command reports the journaling status. The SET JOURNAL
    command enables or disables journaling.


    - 3. After three logon attempt failures, a message is sent to OPERATOR.

    - 4. After two logon attempt failures, an accounting record is generated.

    - 5. After three link attempt failures, a message is sent to OPERATOR.

    - 6. After four link attempt failures, the CP LINK command is disabled for the
    user.


    ### 2.5.2 System features


    The FEATURES statement sets contain system attributes at initialization. of interest
    from a security perspective include:


    - PASSWORDS_ON_COMMANDS

    The PASSWORD_ON_COMMANDS feature controls whether the CP prompts users for passwords
    when using the CP AUTOLOG, LINK, or logon command. If specified as NO, users must
    supply passwords when prompt by the CP. If specified as YES, users can specify
    passwords as parameters to the respective commands (passed as cleartext).


    - CLEAR_TDISK

    The CLEAR_TDISK feature instructs the CP to clear all temporary disk space detached
    by the user.


    - SET_PRIVCLASS

    the feature enables the authority to use the CP SET PRIVCLASS command. The privilege
    class can also be set in the SYSTEM CONFIG file, as discussed in 2.5.3, "Defining
    privilege classes",


    Example 2-2 FEATURES statement in the SYSTEM CONFIG file


    | Features , |

    | :--- |

    | Disable , Set_Privclass , |

    | Enable , Clear_TDisk , Passwords_on_Cmds , Autolog no , Link no , Logon no ,
    3 |


    Example 2-2 illustrates the use of the FEATURES statement:


    - 1. The CP SET_PRIVCLASS command is disabled.

    - 2. The CP is to clear temporary disks when detached.

    - 3. Users are to be prompted for passwords when using the CP AUTOLOG, LINK, or
    LOGON command.


    ### 2.5.3 Defining privilege classes


    The PRIV_CLASSES statement is used to change privilege classes authorizing:


    - Logging on as the system operator

    - Access to the IOCP utility

    - Recording intensive error logging

    - The default user class


    Example 2-3 PRIV_CLASSES statement in the SYSTEM CONFIG file


    | Priv_Classes | | |

    | :--- | :--- | :--- |

    | Operator | AC | |

    | User_Default | G | |


    Example 2-3 illustrates the use of the PRIV_CLASSES statement:


    - 1. The primary system operator is authorized for privilege classes A and C.

    - 2. The default class for general users is G.


    ## 2.5.4 z/VM virtual networking


    Virtual networks provide connectivity between z/VM guests on the same z/VM host
    system without dedicated hardware. Virtual networks can be created from virtual/VM
    CTCA devices; however, these only offer point-to-point connectivity. Every network
    link must be defined and configured, increasing overall management complexity.


    ## VM Guest LAN


    A more easily managed option is the Guest LAN feature. A global LAN segment is
    defined. Each virtual machine in the Guest LAN need only define a virtual network
    interface card (NIC) and connect to the Guest LAN segment. A Guest LAN can connect
    to a physical LAN by routing through an OSA adapter, as shown in Figure 2-1 on
    page 17.


    ![](img/a2760634ecd5eb26c25e81867e88d740_30_0.png)


    Figure 2-1 Example Guest LAN configuration


    ## The z/VM Virtual Switch


    With z/VM Version 4.4, a new type of virtual network is available. The z/VM Virtual
    Switch (VSSWITCH) offers the ability to connect a virtual network directly to
    an external physical LAN, without requiring a z/VM guest to act as a router. Virtual
    guests acting as routers consume processor cycles to move packets between the
    virtual and physical networks, and adds latency to network traffic. Guests connected
    to a VSWITCH can be defined in the subnet of the external network to which they
    are connected.


    In addition, a VSWITCH can participate in an IEEE 802.1Q VLAN. VLANs offer the
    following management and security improvements over physical network topologies:


    - VLAN subnets (and the hosts on those VLANs) can be defined according to the
    logical organization of network traffic. Broadcast domains are defined by the
    VLAN and not limited to the physical LAN.


    Chapter 2. z/VM integrity and security 17


    VLAN administration can simplify network management. For example, when moving
    hosts on a VLAN, the network configuration can be changed at the switch (instead
    of each individual host).


    An example VSWITCH configuration is shown in Figure 2-2.


    ![](img/a2760634ecd5eb26c25e81867e88d740_31_0.png)


    Figure 2-2 Example VSWITCH configuration


    > Note: VSWITCH is not available on IPV6 networks; access to external networks
    is limited to OSA-Express adapters. For information about VLAN concepts, see:

    http://net21.ucdavis.edu/newlan.htm


    In a similar fashion, the HiperSockets Accelerator feature of z/OS can be used
    to reduce complexity and strengthen network security, as described in 7.1, “z/OS
    HiperSockets Accelerator” on page 138.


    ## 2.5.5 Configuring virtual networks


    VM Guest LANs and z/VM Virtual Switches can be configured in the SYSTEM CONFIG
    file:


    - DEFINE LAN

    Use the DEFINE LAN statement to create a VM Guest LAN at system initialization.
    To change the attributes of an existing VM Guest LAN, the MODIFY LAN statement.


    - DEFINE VSWITCH

    The DEFINE VSWITCH statement creates a z/VM Virtual Switch at system initialization.
    To change the attributes of an existing Virtual Switch, the MODIFY VSWITCH statement.


    - VMLAN

    The VMLAN statement sets global class attribute defaults for VM Guest LANs.


    Example 2-4 Defining virtual networks in the SYSTEM CONFIG file


    | VMLAN Limit Transient 0 |

    | :--- |

    | Define LAN |

    | Type QDIO VMQDIO OwnerID System Maxconn 4 |

    | Grant USER1, USER2, USER3, USER4 |


    Example 2-4 illustrates how to configure virtual networks using the SYSTEM CONFIG
    file:


    - 1. No transient Guest LANs are allowed. This prohibits general users from creating
    Guest LAN segments.


    > Important: By default, a general user can create a transient Guest LAN. Limiting
    the number of transient Guest LANs to zero has the effect of removing the ability
    of general users to create Guest LANs.


    ## 2.5.6 Redefining a command privilege level


    The MODIFY COMMAND statement can be used to redefine the privilege level assigned
    to a CP command. This is useful to make a command unavailable to users in the
    privilege class normally assigned to the command.


    As an example, the CP SET SECUSER command (which associates a secondary user to
    a virtual machine) is normally authorized for privilege guests

