    - 图形用户界面 (GUI)

    - 管理系统

    - 防火墙引擎


    ### 6.3.1 StoneGate GUI


    GUI（管理客户端）是用于配置和管理 StoneGate 所有层面的接口。它是一个基于 Java™ 的程序，允许管理员执行：


    - 配置防火墙节点。

    - 通过定义主机、服务器、服务、VPN、防火墙和防火墙集群、路由器和其他网络设备，描述受保护的网络和系统。

    - 设计保护这些系统和网的策略。

    - 管理用户和身份验证服务。

    - 管理日志数据。

    - 监控防火墙和集群。


    GUI 与管理系统的各种组件通信，以用户友好的格式呈现性能数据、日志数据、配置信息和策略。GUI 可以部署在网络中的任何位置，并同时运行多个实例。例如，管理员可以使用
    GUI 修改分支机构本地网络的属性，而企业总部的高级管理员正在更新全局策略或对象。并发用户之间的冲突通过管理服务器在数据库引擎中的锁定机制来解决。


    单个 GUI 可用于相同管理系统下的所有防火墙和集群。例如，一个更新的安全策略可以同时安装到企业网络中的所有防火墙上。


    > 注意：GUI 为向多个客户提供服务的托管服务提供商 (MSP) 提供。GUI 的过滤功能允许每个单独客户进行独立管理。


