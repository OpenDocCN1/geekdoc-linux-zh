    \nFigure 6-16 Distributed management system\n\n## ## Virtual LANs\n\nA virtual\
    \ local area network (VLAN) is a logical grouping of hosts and network devices\
    \ appearing as a single local area network (LAN) segment, regardless of physical\
    \ topology. Workstations and servers in the same VLAN operate as connected to\
    \ the same physical network, forming a single OSI Layer 2 broadcast domain. VLAN\
    \ segregation is implemented by VLAN tagging as defined by the IEEE 802.1q standard.\
    \ Network ports on a switch can be configured to make a distinction between different\
    \ VLANs by adding a two-byte VLAN tag on each Ethernet frame that passes between\
    \ VLANs. Control over network traffic is enhanced by containing broadcast and\
    \ multicast traffic within the VLAN. Unnecessary traffic to other LAN segments\
    \ is reduced. With the separation of the logical and physical LAN structure, the\
    \ topology of a VLAN can follow, for example, a company's organizational structure\
    \ (connecting department users to the same VLAN, even if located in different\
    \ physical LANs). This also reduces required cabling; LAN segments are separated\
    \ from the switch.\n\nStoneGate supports VLAN tagging. It can distinguish traffic\
    \ belonging to different VLANs. StoneGate can be configured with VLANs in the\
    \ GUI. This can reduce the number of required physical interfaces and simplify\
    \ deployment on geographically distributed firewall clusters. An example StoneGate\
    \ VLAN deployment is shown in Figure 6-17 on page 110.\n\n![](img/a2760634ecd5eb26c25e81867e88d740_123_0.png)\n\
    \nFigure 6-17 StoneGate with VLAN tagging\n\nEach firewall nodes has three network\
    \ interface cards (NIC), but is connected to five isolated networks:\n\n- NIC\
    \ 1 is configured as two logical VLAN interfaces:\n    - Interface 1.1 for VLAN\
    \ 0\n    - Interface 1.2 for VLAN 1\n\nThe VLANs isolate the internal network\
    \ from the control network.\n\n- NIC 2 is configured as interface 2.3 and 2.4\
    \ for VLANs 2 and 3 to isolate the two DMZ networks (DMZ A and DMZ B).\n\n- NIC\
    \ 3 is connected to the Internet.\n\nFor a secure implementation, the access to\
    \ the switches is restricted. Traffic belonging to different VLANs is securely\
    \ isolated. Figure 6-18 on page 111 depicts a geographically distributed VLAN\
    \ cluster.\n\n![](img/a2760634ecd5eb26c25e81867e88d740_124_0.png)\n\nFigure 6-18\
    \ Geographically distributed cluster\n\nFor example, Node A could be located in\
    \ one building, while Node B is located in another. A heartbeat link is needed\
    \ between the nodes. Both nodes have an interface to VLAN 1 and another interface\
    \ to VLAN 2 and VLAN 3.\n\n## 6.4 StoneGate on Linux for zSeries\n\nStoneGate\
    \ is the only commercially available and certified firewall and VPN product for\
    \ IBM zSeries systems. StoneGate removes the need for external firewall servers\
    \ between front-end and back-end applications, saving cost in investment, labor,\
    \ and maintenance. StoneGate enables simultaneous firewalls in a virtual network\
    \ environment and is able to use the high degree of scalability offered by zSeries.\
    \ Centralized management system simplifies deployment and maintenance of multiple\
    \ firewall instances. StoneGate on zSeries features VPNs that enhance security\
    \ for sensitive network traffic (such as financial transactions within the mainframe).\
    \ Figure 6-19 on page 112 depicts a zSeries StoneGate deployment.\n\n![](img/a2760634ecd5eb26c25e81867e88d740_125_0.png)\n\
    \nFigure 6-19 StoneGate and zSeries mainframe\n\n## 6.4.1 High availability technologies\n\
    \nIn the past, firewalls could be made highly available through add-on software\
    \ or redundant hardware solutions. Often, this resulted in moving a single point\
    \ of failure to another network component (typically the network link). Other\
    \ network services (such as Web, FTP, or content inspection servers) would require\
    \ yet more hardware and software to eliminate single points of failure in the\
    \ enterprise.\n\nStoneGate high availability firewall and VPN includes several\
    \ clustering technologies to reduce the complexity needed for high availability.\
    \ StoneGate's innovative clustering and load-balancing features provide several\
    \ benefits over traditional solutions.\n\n## Built-in high high availability\n\
    \nTo achieve firewall high availability, additional hardware switches, software\
    \ clustering products, or special load balancing devices are often used. With\
    \ StoneGate, high availability is built into the firewall engines. Individual\
    \ connections can be transparently moved to a hot-standby node if an active node\
    \ becomes overloaded or experiences a failure.\n\nNote: Connection switching also\
    \ happens during remote upgrades.\n\nUsing virtual IP addresses combined with\
    \ MAC addresses, firewall engines are seen by the rest of the network as a single\
    \ entity (reducing the need for configuration changes). The Cluster Virtual Interface\
    \ (CVI) has IP addresses shared by all nodes. Traffic arriving at CVI reaches\
    \ all nodes. However, only a single node processes given. Figure 6-20 illustrates\
    \ a high availability set of nodes.\n\n![](img/a2760634ecd5eb26c25e81867e88d740_126_0.png)\n\
    \nFigure 6-20 Cluster Virtual Interfaces\n\nEach firewall node is assigned two\
    \ NDIs:\n\n- Each node's NDI ID0 addresses the CVI0 virtual interface. This virtual\
    \ IP address shared by all nodes; the Node Dedicated Interface (NDI) IP address\
    \ is unique for each node.\n- Each node's NDI ID1 addresses the CVI1 virtual interface.\
    \ This virtual interface provides connectivity to the Internet.\n\nChapter 6.\
    \ StoneGate firewall 113\n\n number of NICs is limited by the network interface\
    \ card\n\nHigh availability provides for scalability and maintenance during business\
    \ hours. Individual nodes can be taken offline. Connections previously handled\
    \ by the engine are transparently transferred to the standby node.\n\n# High availability\
    \ connections\n\nStoneGate provides high availability options for related-related\
    \ components (Wait, the text says \"for related network components\" - let's re-read).\
    \ \n\nStoneGate provides high availability options for related network components.\
    \ Internet service providers (ISPs) and virtual private networks (VPNs) have often\
    \ a single point of failure for enterprise communications. High availability was\
    \ attainable, but at a cost of complexity. StoneGate eliminates these issues by\
    \ innovative technologies.\n\nAs the role of Internet-driven business grows, the\
    \ reliability of connections and constant availability of services is an absolute\
    \ necessity for corporations. Even with clustering products, corporate network\
    \ are subject to outages should network links fail. Elimination of this single\
    \ point of failure often requires a battery of redundant external routers and\
    \ switches using complex routing protocols, such as Border Gateway Protocol (BGP)\
    \ and Hot Standby Routing Protocol (HSRP), as well as peering arrangements through\
    \ the ISPs providing connections.\n\n# Multilink technology\n\nStoneGate enables\
    \ network administrators to use several ISPs with multilink technology This removes\
    \ problems associated with high availability routing protocols. High availability\
    \ network links reduce the need for costly leased lines. Any IP-based link with\
    \ a dedicated IP address range can be used as part of a multilink configuration:\n\
    \n- Standard Internet connections provided by ISPs\n- ISDN connections\n- Leased\
    \ lines\n\nWith multilink technology, redundant routes to the Internet are represented\
    \ as a special network element (a NetLink) in the StoneGate GUI. Network traffic\
    \ is balanced between NetLinks, as depicted in Figure 6-21 on page 115.\n"
  mdcn: "\n\n![](img/a2760634ecd5eb26c25e81867e88d740_121_0.png)\n\n图 6-15 单节点管理系统\n\
    \n# 分布式管理系统\n\n使用 109 页图 6-16 所示的分布式管理系统，管理服务器（Management Server）、日志服务器（Log Server）和\
    \ GUI 安装在不同的机器上。这种策略可以提高性能；每台机器仅执行整个系统的一部分。此外，这提供了更大的灵活性；任何 StoneGate 组件都可以在任何平台上运行。\n\
    \n![](img/a2760634ecd5eb26c25e81867e88d740_122_0.png)\n\n图 6-16 分布式管理系统\n\n##\
    \ 虚拟局域网 (VLAN)\n\n虚拟局域网（VLAN）是主机和网络设备的逻辑分组，无论物理拓扑如何，它们都表现为一个单一局域网（LAN）段。同一 VLAN\
    \ 中的工作站和服务器的运行方式如同连接到同一个物理网络，形成单一的 OSI 第 2 层广播域。VLAN 隔离通过 IEEE 802.1q 标准定义的 VLAN\
    \ 标记实现。交换机上的网络端口可以通过在通过 VLAN 之间的每个以太网帧上添加双字节 VLAN 标记来区分不同的 VLAN。通过将广播和多播流量限制在\
    \ VLAN 内部，增强了对网络流量的控制。减少了指向其他 LAN 段的不必要流量。由于逻辑和物理 LAN 结构的隔离，VLAN 的拓扑结构可以遵循公司的组织结构（将部门用户连接到同一个\
    \ VLAN，即使他们位于不同的物理 LAN 中）。这还减少了对布线的需求；LAN 段与交换机分离开。\n\nStoneGate 支持 VLAN 标记。它可以区分属于不同\
    \ VLAN 的流量。可以在 GUI 中配置 VLAN VLAN。这可以减少所需的物理接口数量，并简化在地理分布的防火墙集群上的部署。一个 StoneGate\
    \ VLAN 部署示例如图 110 页图 6-17 所示。\n\n![](img/a2760634ecd5eb26c25e81867e88d740_123_0.png)\n\
    \n图 6-17 带 VLAN 标记的 StoneGate\n\n每个防火墙节点有三个网卡（NIC），但连接到五个隔离的网络：\n\n- NIC 1 配置为两个逻辑\
    \ VLAN 接口：\n    - 接口 1.1 用于 VLAN 0\n    - 接口 1.2 用于 VLAN 1\n\nVLAN 将内部网络与控制网络隔离。\n\
    \n- NIC 2 配置为接口 2.3 和 2.4 用于 VLAN 2 和 3，以隔离两个 DMZ 网络（DMZ A 和 DMZ B）。\n\n- NIC\
    \ 3 连接到互联网。\n\n为了实现安全，对交换机的访问受到了限制。属于不同 VLAN 的流量被安全地隔离。111 页图 6-18 描述了一个地理分布的\
    \ VLAN 集群。\n\n![](img/a2760634ecd5eb26c25e81867e88d740_124_0.png)\n\n图 6-18 地理分布集群\n\
    \n例如，节点 A 可能位于一栋建筑，而节点 B 位于另一栋建筑。节点之间需要一个心跳链路。两个节点都有一个连接到 VLAN 1 的接口，以及另一个连接到\
    \ VLAN 2 和 VLAN 3 的接口。\n\n## 6.4 基于 Linux 的 zSeries StoneGate\n\nStoneGate 是 IBM\
    \ zSeries 系统唯一上市且经过认证的防火墙和 VPN 产品。StoneGate 消除了在前端和后端应用之间需要外部防火墙服务器的需求，节省了投资、劳动和维护成本。StoneGate\
    \ 能够在虚拟网络环境中同时启用防火墙，并能够利用 zSeries 提供的高度扩展性。集中式管理系统简化了多个防火墙实例的部署和维护。zSeries 上的\
    \ StoneGate 具有 VPN 功能，可以增强敏感网络流量的安全性（例如大型机内的财务交易）。112 页图 6-19 描述了 zSeries StoneGate\
    \ 部署。\n\n![](img/a2760634ecd5eb26c25e81867e88d740_125_0.png)\n\n图 6-19 StoneGate\
    \ 与 zSeries 大型机\n\n## 6.4.1 高可用性技术\n\n在过去，防火墙可以通过附加软件或冗余硬件解决方案来实现高可用性。这通常会导致单点故障转移到另一个网络组件（通常是网络链路）。其他网络服务（如\
    \ Web、FTP 或内容检查服务器）需要更多的硬件和软件来消除企业中的单点故障。\n\nStoneGate 高可用防火墙和 VPN 包含多种集群技术，以降低高可用性所需的复杂性。StoneGate\
    \ 创新的集群和负载均衡功能比传统解决方案具有多项优势。\n\n## 内置高可用性\n\n为了实现防火墙高可用，通常使用额外的硬件交换机、软件集群产品或特殊的负载均衡设备。使用\
    \ StoneGate，高可用性内置在防火墙引擎中。如果活动节点过载或发生故障，单个连接可以透明地移动到热备节点。\n\n注意：连接切换也会发生在远程升级期间。\n\
    \n通过使用虚拟 IP 地址结合 MAC 地址，防火墙引擎被网络的其他部分视为单一实体（减少了对配置更改的需求）。集群虚拟接口（CVI）具有所有节点共享的\
    \ IP 地址。到达 CVI 的流量到达所有节点，但只有一个节点会处理给定的流量。图 6-20 展示了高可用性节点集。\n\n![](img/a2760634ecd5eb26c25e81867e88d740_126_0.png)\n\
    \n图 6-20 集群虚拟接口\n\n每个节点分配两个 NDI：\n\n- 每个节点的 NDI ID0 地址 CVI0 虚拟接口。该虚拟 IP 地址由所有节点共享；节点专用接口（NDI）IP\
    \ 地址每个节点是唯一的。\n- 每个节点的 NDI ID1 地址 CVI1 虚拟接口。该虚拟接口提供到互联网的连接。\n\n第 6 章 StoneGate\
    \ 防火墙 113\n\n网卡数量受限于网络接口卡\n\n高可用性为扩展和维护提供了便利。单个节点可以离线。之前由引擎处理的连接将透明地转移到备份节点。\n\
    \n# 高可用连接\n\nStoneGate 为相关网络组件提供高可用选项。互联网服务提供商（ISP）和虚拟专用网络（VPN）对于企业通信通常存在单点故障。高可用是可以实现的，但是以复杂性为代价的。StoneGate\
    \ 通过创新技术解决了这些问题。\n\n随着互联网驱动业务的角色增长，连接的可靠性和服务的持续可用对于公司来说是绝对必要的。即使使用了集群产品，如果网络链路故障，企业网络仍可能中断。消除这种单点故障通常需要一组冗余的外部路由器和交换机，使用复杂的路由协议，如边界关协议（BGP）和热备路由协议（HSRP），以及通过连接的\
    \ ISP 进行对等安排。\n\n# 多链路技术\n\nStoneGate 允许网络管理员使用多链路技术使用多个 ISP 这消除了与高可用路由协议相关的问题。高可用网络链路减少了对昂贵线路的需求。任何具有专用\
    \ IP 地址范围的 IP 链路都可以作为链路配置的一部分：\n\n- ISP 提供的标准互联网连接\n- ISDN 连接\n- 线路\n\n通过多链路技术，指向互联网的冗余路由在\
    \ StoneGate GUI 中表示为特殊的网络元素（NetLink）。网络流量在 NetLink 之间进行平衡，如 115 页图 6-21 所示。\n\n"
