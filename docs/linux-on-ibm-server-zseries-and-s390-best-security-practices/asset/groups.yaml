    # ## Virtual LANs


    A virtual local area network (VLAN) is a logical grouping of hosts and network
    devices appearing as a single local area network (LAN) segment, regardless of
    physical topology. Workstations and servers in the same VLAN operate as connected
    to the same physical network, forming a single OSI Layer 2 broadcast domain. VLAN
    segregation is implemented by VLAN tagging as defined by the IEEE 802.1q standard.
    Network ports on a switch can be configured to make a distinction between different
    VLANs by adding a two-byte VLAN tag on each Ethernet frame that passes between
    VLANs. Control over network traffic is enhanced by containing broadcast and multicast
    traffic within the VLAN. Unnecessary traffic to other LAN segments is reduced.
    With the separation of the logical and physical LAN structure, the topology of
    a VLAN can follow, for example, a company''s organizational structure (connecting
    department users to the same VLAN, even if located in different physical LANs).
    This also reduces required cabling; LAN segments are separated from the switch.


    StoneGate supports VLAN tagging. It can distinguish traffic belonging to different
    VLANs. StoneGate can be configured with VLANs in the GUI. This can reduce the
    number of required physical interfaces and simplify deployment on geographically
    distributed firewall clusters. An example StoneGate VLAN deployment is shown in
    Figure 6-17 on page 110.'
