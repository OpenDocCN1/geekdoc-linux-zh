    \ Linux.\n\n# 7.4.3 Configuring the WebSphere Application Server\n\nTo further\
    \ protect the administrator function of WebSphere, we enable security on the WebSphere\
    \ Application Server itself. We use an LDAP server and RACF running on z/OS to\
    \ secure access to the admin console function by the wasadm user."
  - '[PAGE 166]


    We modify the security settings of the WebSphere Application Server. We point
    to the z/OS LDAP server and enable Global Security for the WebSphere server:


    +   1. From the Administrative Console for WebSphere, in the User Registries ->
    LDAP -> General Properties menu, provide:

    - Server User ID parameter (cn=wasadin,o=itso)

    - Server User Password parameter (secret)

    - Select the Type of SecureWay

    - Host parameter (9.12.6.16)

    - Port parameter (3389)

    - Base Distinguished Name parameter (o=itso)

    - Bind Distinguished Name parameter (cn=ldap administrator)

    - Bind Password (secret)


    > Note: Our example values are shown in parentheses.


    Keeping the remaining default settings, click the Apply button, and click Save
    to save the configuration.


    +   2. In the Security -> Global Security -> General Properties menu:

    - Choose the Enabled selection.

    - From the Authentication Mechanism menu, select LTPA.

    - From the Active User Registry menu, select LDAP.


    Click the Apply button, click Save to save the configuration, and restart the
    WebSphere Application Server.


    This setup ensures that WebSEAL protects access to WebSphere itself. Access to
    the administrator functions is secured by a WebSphere security function. Both
    cases authenticate against LDAP and RACF on z/OS. Direct access to the WebSphere
    HTTP-catcher port (9080) and the administrator port (9090) must be locked. We
    recommend that you use a firewall between WebSEAL and WebSphere that allows only
    connections between WebSEAL and the two WebSphere ports.


    # 7.5 Securing z/OS Web resources from Linux


    We can use Tivoli Access Manager secure access to a WebSphere Application Server
    running on z/OS. Figure 7-4 on page 154 illustrates the configuration.'
