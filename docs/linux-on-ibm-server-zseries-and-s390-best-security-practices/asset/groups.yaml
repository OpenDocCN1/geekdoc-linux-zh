    ## 7.3 Enabling z/OS LDAP native authentication


    To enable LDAP to bind against RACF, native authentication must be configured:


    - 1. Customize the LDAP native schema.

    Copy the /usr/lib/ldap/etc/NativeAuthentication.ldif file to the /etc/ldap directory.
    Edit the file, changing the line "cn=schema,<suffix>" using the suffix defined
    in your ldap.profile file.

    - 2. Implement the native authentication schema. Use the command:

    ldapmodify -h 9.12.6.16 -p 3389 -D "cn=LDAP Administrator" -w secret -f \

    /etc/ldap/NativeAuthentication.ldif

    - 3. Enable native authentication in LDAP. Add the following to the DBM section
    of the LDAP configuration (ldap.profile):

    useNativeAuth "nativeAuthSubtree" o=itso

    nativeUpdateAllowed YES


    - 4. Modify existing users to use native authentication.

    Add the ibm-nativeAuthentication object class and ibm-nativeAuth attribute to
    users. We create the nativeupdate.ldif file, as shown in Example 7-3, and modify
    the directory using:

    ```

    ldapmodify -h 9.12.6.16 -p 3389 -D "cn=LDAP Administrator" -w secret -f

    /etc/ldap/nativeupdate.ldif

    ```


    Example 7-3 The nativeupdate.ldif


    ```

    cn=test1,ou=itso

    changetype: modify

    add: ibm-nativeAuth test1

    objectclass: ibm-nativeAuthentication

    ```


