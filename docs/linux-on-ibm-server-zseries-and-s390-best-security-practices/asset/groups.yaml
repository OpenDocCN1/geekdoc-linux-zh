    # StoneGate firewall


    In this chapter, we introduce StoneGate, a pre-hardened, commercial firewall and
    virtual private network (VPN) solution available on Linux for zSeries. We also
    discuss the underlying security principles of firewalls in general, including
    what firewalls are, which different types of firewalls are available, how they
    are used, what they are capable of, and their potential weaknesses.


    We discuss:


    +   - The role of firewalls

    - Firewall technologies

    - StoneGate firewall components

    - StoneGate on Linux for zSeries

    - StoneGate installation'
- md: '

    ## 6.1 The role of firewalls


    Firewalls are a cornerstone in a corporate defense strategy designed to eliminate
    misuse of confidential data and resources. A firewall is one (albeit important)
    element in an overall security policy. Its role is to implement and enforce the
    network security policy. Firewalls regulate communication between networks with
    different security levels. Their purpose is to control the traffic passing from
    one network to another, denying access to undesired or potentially harmful packets
    and connections.


    The principle of access control is ideally expressed as *whatever is not expressly
    permitted is denied*. By default, no one should be permitted entry to a protected
    network. This means any traffic allowed into a network must be allowed through
    a specific rule. Typically, internal network clients are granted more unrestricted
    access to external networks, but outbound connections also need to be controlled.


    Some advantages that firewalls can provide include:


    - Firewalls protect a corporate intranet from undesired traffic. Including everything
    from malicious attackers to unsolicited e-mail (spam).

    - Firewalls secure sensitive corporate resources within a LAN. This isolates departments
    such as Research and Development or Human Resources from other company departments,
    limiting the access within any area to authorized users only.

    - Firewalls concentrate network security policies at a single point. Network security
    can focus on the firewall checkpoint. When policies or administrators change,
    configurations need only be changed in one place. However, the firewall should
    not become a *single point of failure*.


    Firewalls can also be used for other purposes, such as monitoring network traffic
    and the use of network resources, authenticating users, and implementing virtual
    private networks (VPN).


    ## 6.2 Firewall technologies


    The firewall market offers a wide range of both software-based and hardware-based
    firewall solutions. Firewalls are usually categorized by the way they handle network
    traffic. In this section, we give an overview of existing firewall technologies.
    We also introduce a new type of firewall: StoneGate.


    Traditionally, firewalls can be divided into three main types:


    - Packet filtering firewalls

    - Application-level proxy firewalls

    - Stateful inspection firewalls


    Each type has its benefits and disadvantages. We briefly compare each technology,
    pointing out their strong points and drawbacks.


    ### 6.2.1 Packet filtering firewalls


    Packet filtering firewalls allow or deny access based on header information in
    the packets they receive. Packet filtering firewalls examine each packet and can
    be implemented by most common routing devices.


    Packet filters typically contain access control lists (ACLs) to monitor the following
    header data:


    - Source IP address

    - Destination IP address

    - Source port

    - Destination port

    - ICMP message type

    - Protocol

    - Packet size

    - Various header flags


    Combining these parameters, more complex policies can be enforced by the packet
    filter. Packet filters tend to have high performance, because inspection involves
    simple parameters at the network layer of the TCP/IP stack. typically only inspect
    up to the network layer, as show in Figure 6-1 on page 88.


    | Application | Application |

    |---|---|

    | Presentation | Packet filtering firewalls examine each packet at the network
    level and compare them to the access lists. |

    | Session | Although fast in smaller environments, scalability is limited and
    security is weak. |

    | Transport | Transport |

    | Network | Network |

    | Data Link | Data Link |

    | Physical | Physical |


    ![](img/a2760634ecd5eb26c25e81867e88d740_101_0.png)


    Figure 6-1 Packet filtering model

    - more complex environments


    Packet filtering is neither very flexible nor generally secure because the network
    layer lacks the context of each packet. This type of filtering can be easily fooled
    by techniques such as fragmented packets, or bogus or invalid IP address information.
    Packet filters cannot protect against malicious contents in higher levels of the
    protocol stack or examine the actual data portion. They are often used in combination
    with application-level proxies. Packet filtering is commonly used also in routers
    at the network perimeters.


    ### 6.2.2 Proxy firewalls


    Proxy firewalls are firewalls running application proxy servers. The firewall
    server establishes a second, different connection to the destination network on
    behalf of the host from the source network. Packets are passed if they meet the
    security policy criteria. Proxy firewalls mediate communications between two different
    devices located on different networks.


    This type of firewall is fully application-aware, and therefore very secure. However,
    there is a performance trade-off due to the additional overhead required to maintain
    separate connections and to inspect packets up to the application layer. The proxy
    firewall is depicted in Figure 6-2 on page 89.


    | Application | Application | Application |

    |---|---|--|

    | Presentation | Presentation | Application proxies open two separate, related
    connections for each allowed connection. |

    | Session | Session | They can inspect all layers (making them very secure), but
    performance is poor. |

    | Transport | Transport | Session |

    | Network | Network | Network |

    | Data Link | Data Link | Data Link |

    | Physical | Physical | Physical |


    ![](img/a2760634ecd5eb26c25e81867e88d740_102_0.png)


    Proxy firewalls can cache information such as HTML pages in order to gain some
    performance, but the following drawbacks remain:


    - Application layer detecting and duplicate connections can affect performance.
    Traffic inspection takes place at the highest layer of the TCP/IP stack. The necessity
    of inspecting every layer before returning back down to the physical layer can
    cause bottlenecks in busy networks.

    - The number of services used by a proxy firewall is an issue. Because every service
    needs its own proxy, the proxy list must be continually updated as new applications
    and services are added.


    ### 6.2.3 Stateful inspection firewalls


    Stateful inspection technology was developed to overcome the limitations of packet
    filtering firewalls. Stateful inspection firewalls use additional criteria (such
    as historical data about the connection) in determining whether to allow or deny
    access. Established connections are tracked in dynamic state tables to ensure
    they comply with security policies.


    By applying connection status and context information to established connections
    and packets, access denial can occur before inspection at a higher level in the
    protocol stack. This can increase performance. Because stateful inspection understands
    connection context (returning packets can be correlated to an established connection),
    previously determined connections can be allowed without further examination.
    This is especially important for services such as Telnet and FTP.


    Stateful inspection operates beneath the network layer (in practice, inspection
    occurs between the data link and network layers). Stateful inspection firewalls
    have a limited capability to inspect data at the application layer. State tables
    are maintained for every connection protocol, whether it is valid or not. The
    stateful inspection model is illustrated in Figure 6-3.


    | Application | | Some stateful inspection firewalls can examine basic protocol
    compliance at higher levels, but the list of protocols and inspection options
    is limited. |

    | --- | --- | --- |

    | Presentation | | |

    | Session | | |

    | Transport | | |

    | Network | | |

    | Data Link | | |

    | Physical | | |


    Figure 6-3 Stateful inspection model


    ### 6.2.4 StoneGate and multi-layer inspection


    StoneGate, the Stonesoft Corporation introduces a new firewall technology called
    *multi-layer inspection* depicted in Figure 6-4 on page 91. Like stateful inspection,
    StoneGate uses state tables to track connections and judge whether a packet is
    part of an established connection. However, it also features application-layer
    inspection by implementing specific *protocol agents*, necessary, for enhanced
    security.


    StoneGate can also act as a packet filter for types of connections that do not
    require the security considerations of stateful inspection.

    '
