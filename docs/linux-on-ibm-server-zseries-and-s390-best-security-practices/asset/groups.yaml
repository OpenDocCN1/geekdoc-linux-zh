    and communicate that information to the firewall engines. Data from the firewall
    engines is filtered through the management system and sent to the GUI for display.


    # Management Server


    The Management Server is the core server in the management system and the central
    point of administration. A single Management Server can be used to manage an entire
    network of StoneGate clusters and single firewalls. It is in charge of maintaining
