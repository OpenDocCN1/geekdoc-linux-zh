    # 6.3.1 StoneGate GUI


    The GUI (Administration Client) is the interface used to configure and administer
    all aspects of StoneGate. It is a Java™-based program that allows administrators
    to:


    +   Configure firewall nodes.


    +   Describe protected networks and systems by defining hosts, servers, services,
    VPNs, firewalls and firewall clusters, routers, and other network devices.


    +   Design the policies to protect these systems and networks.


    +   Administer users and authentication services.


    +   Manage log data.


    +   Monitor firewalls and clusters.


    The GUI communicates with the various components of the management system, presenting
    performance data, log data, configuration information, and policies in a user-friendly
    format. The GUI can be deployed anywhere in the network, and multiple instances
    can run at once. For example, an administrator can use the GUI to modify the properties
    of a local network in a branch office, while the senior administrator in the corporate
    headquarters is updating global policies or objects. Conflicts between simultaneous
    users are resolved through locking mechanisms in the database engine by the Management
    Server.


    A single GUI can be used to control all the firewalls and clusters under the same
    management system. For example, an updated security policy can be installed simultaneously
    on all firewalls in the corporate network.


    > Note: The GUI provides managed service providers (MSP) that offer network services
    to several customers. The GUI filtering capabilities each single customer to be
    independently managed.


    The main view of the GUI (called the Control Panel) contains the toolbar from
    which the various manager applications can be started. Each manager is an application
    component used to perform a particular set of related tasks. For example, the
    Security Policy Manager is used to create, modify, and delete security policies
    or rules; the Network Element Manager enables the creation, modification, and
    deletion of various network elements, such as hosts, network links, and firewall
    clusters. The Control Panel and Launchpad are shown in Figure 6-10 on page 99.'
