    # 7.1 z/OS HiperSockets Accelerator


    z/OS Version 1Release 2 Communications Server introduced performance improvements
    for IP routing between HiperSockets (also known as Internal Queued Direct Input/Output
    or IQDIO) and Queued Direct I/O (QDIO) adapters referred to as Hiper Accelerator.
    Network traffic is concentrated on a single OSA-Express QDIO connection then accelerated
    over a HiperSockets (bypassing the z/OS TCP/IP stack).


    HiperSockets Accelerator can simplify the management of OSA-Express interfaces,
    network traffic to and Linux guests is routed over internal path HiperSockets
    networks. A number of security measures usually required for physical networks
    can be avoided, resulting in a simpler, labour-intensive configuration. Using
    HiperSockets Accelerator, a large number of Linux images in single CEC can access
    an OSA-Express adapter using only the number channels addressed by a single z/OS
    image.


    > Note: Highly optimized routes from z/OS to the Linux images allow data to be
    routed through the HiperSockets devices with minimal processing by the TCP/IP
    stack, without exhausting the channel addresses available to the OSA-Express.
    HiperSockets Accelerator requires minimal explicit configuration and runs in a
    single z/OS TCP/IP. Network traffic is routed by the driver instead of traversing
    the entire z/OS TCP/IP stack.


    HiperSockets Accelerator can decrease the need for many separate OSA-Express adapters
    and I/O cage slots, while increasing server scalability at lower cost when consolidating
    Linux, zVM, and z/OS servers on zSeries.


    HiperSockets Accelerators support Virtual IP Address (VIPA) takeover and traceback
    syslog environment for high availability. Separate TCP/IP stacks with HiperSockets
    Accelerator can run in the same sysplex for redundancy. Each backup stack must
    have an equivalent connection through both HiperSockets and OSA-Express. VIPA
    takeover and takeback are supported only between z/OS systems and within the same
    sysplex. Figure 7-1 on page 139 illustrates an example HiperSockets Accelerator
    configuration for Linux guests.'
