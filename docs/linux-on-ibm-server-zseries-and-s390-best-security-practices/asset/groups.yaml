    \ command.\n\n## 4.2.4 Configuring mod_ssl\n\nEdit the /etc/httpd.conf file to\
    \ configure the mod_ssl model. We edited this file in several places. Those changes\
    \ are summarized in Example 4-5.\n\n## Example 4-5 Configuring mod_ssl in the\
    \ /etc/http/httpd.conf file\n\n# Note: the host name is set by SuSEconfig according\
    \ to the setting of the\n# FHOSTNAME variable in /etc/sysconfig/network/config/\n\
    ServerName www.lnnsu2.itso.ibm.com\n\n## ## SSL Virtual Host Context\n\n```\n\
    <VirtualHost www.lnnsu2.itso.ibm.com:443>\n```\n\n```\n# General setup for the\
    \ virtual host\nDocumentRoot \"/srv/www/htdocs/private\"\nServerName www.lnnsu2.itso.ibm.com\n\
    ServerAdmin toti1j2@itso.ibm.com\nErrorLog /var/log/httpd/error_log\nTransferLog\
    \ /var/log/httpd/access_log\n```\n\n```\n# SSL Engine Switch:\n# Enable/Disable\
    \ SSL for this virtual host.\nSSLEine on\n```\n\n```\n# Server Certificate:\n\
    SSLCertificate /etc/httpd/ssl1.crt/server.crt\n```\n\n```\n# Server Private Key:\n\
    SSLCertificateKeyFile /etc/httpd/ssl1.key/server.key\n```\n\n## 4.3 Using hardware\
    \ acceleration with OpenSSL\n\nEncryption is CPU intensive and can lead to longer\
    \ client response times. To improve the situation, OpenSSL has support for hardware\
    \ cryptographic acceleration. On zSystems, CPU delegates the encryption process\
    \ to a specially developed piece of hardware commonly referred to as the crypto\
    \ engine. Off-loading encryption to hardware improves zSeries performance, as\
    \ well as providing improved client response times.\n\nTo use the zSeries crypto\
    \ engine:\n\n- 1. Installing the crypto engine.\n- 2. Creating a crypto device\
    \ node.\n- 3. Configuring mod_ssl to use the crypto engine.\n\n### 4.3.1 Installing\
    \ the crypto engine\n\nThe z90crypt90.a module is the device driver for the crypto\
    \ accelerator. We install the crypto engine device driver, and query the detected\
    \ crypto accelerators, as shown in Example 4-6.\n\nExample 4-6 Installing and\
    \ checking the crypto engine\n\n```\n# insmod z90crypt\nUsing /lib/modules/2.4.19-3use-SMP/kernel/drivers/misc/s390/z90crypt.o\n\
    # cat /proc/driver/z90crypt\n```\n\nz90crypt version: 1.1.1\nCryptographic domain:\
    \ 0\nTotal device count: 1\nPCICA count: 1\nPCICC count: 0\nrequest count: 0\n\
    pending count: 0\nTotal open handles: 0\n\nMask of online devices: 01 means PCICA,\
    \ 02 means PCICC\n\nThe device driver detected a PCI bus accelerator (PCICA) hardware\
    \ interface.\n\nNote: The PCI bus controller (PCICC) is a software encryption\
    \ module.\n\n### 4.3.2 Creating a crypto device node\n\nThe device node for z90crypt\
    \ was created as follows:\n\n```\n# mknod /dev/z90crypt c 254 0\n```\n\nWhere:\n\
    \n| Field | Description |\n| :--- | :--- |\n| c | Specifies a character device\
    \ to be created. |\n| 254 | Specifies the device major number. |\n| | Specifies\
    \ the minor number. |\n\nWe ensure that z90crypt is writable, as shown in Example\
    \ 4-7.\n\nExample 4-7 Making z90crypt writable\n\n```\n# ls -l z90crypt\n-r--r--\
    \ root root 254 0 Aug 07 16\n# chmod 666 z90crypt\n# ls -l z90crypt\n-rw-rw--\
    \ root root 254 0 Aug 07 16\n```\n\n### 4.3.3 Configuring mod_ssl use the crypto\
    \ engine\n\nConfigure mod_ssl to use the crypto engine, add the highlighted line\
    \ in Example 4-8 to the /etc/httpd/httpd.conf file.\n\nExample 4-8 Insert crypto\
    \ support in the /etc/httpd/httpd.conf\n\n```\n<IfModule SSL>\nAddType application/x-x509\
    \ .crt\nAddType application/x-pkcs7 .crl\n</IfModule>\n```\n\n```\n<IfModule mod_ssl>\n\
    SSLCryptoDevice on\n```\n\nRestart Apache for the changes to become effective.\
    \ At startup, we are prompted to provide the PEM passphrase, as shown in Example\
    \ 4-9.\n\nExample 4-9 Apache with crypto engine enabled\n\n```\n# apachectl start\n\
    Starting httpd [ Mailman Perl Python SSL ]Apache/1.3.26 mod_ssl/2.8.10\n(Pass\
    \ Phrase Dialog)\nSome of your private key files are encrypted for security reasons.\n\
    Order to read them you have to provide us with the pass phrases.\nServer.lnnsu2.itso.ibm.com:443\
    \ (RSA)\npass phrase:\n\nOk: Pass Phrase Dialog successful.\ndone\n```\n\n## 4.4\
    \ Secure Shell overview\n\nThe Secure Shell (also known as SSH) is a secure network\
    \ access protocol. Traditional network access protocols (Telnet, FTP, and the\
    \ r-command suite, such as login, rcp, and rsh) must be considered inherently\
    \ insecure. Unencrypted data (including user IDs and passwords) is transmitted\
    \ over the network and can be captured by malicious threads. SSH provides a secure\
    \ alternative for remote access, file transfer, and command execution.\n\nSSH\
    \ was originally developed by Tatu Yönen (a researcher at the Helsinki University\
    \ of Technology) as a method to prevent password-sniffing attacks. His initial\
    \ implementation (known as SSH1) was released as free software. SSH-1 protocol\
    \ was formalized as an Internet Engineering Task Force (IETF). Subsequent improvements\
    \ resulted in a new SSH-2 protocol originally implemented as the SSH2 commercial\
    \ product available from SSH Communications Security, Ltd. (founded by Yönen in\
    \ 1995). OpenSSH is an open source implementation of Secure Shell based on the\
    \ last version of SSH1. It supports both the SSH-1 and SSH-2 protocols. OpenSSH\
    \ is provided as part of most distributions of Linux for zSeries (including SLES8\
    \ and RHEL3). Details about OpenSSH can be found at their Web site:\n\nhttp://www.openssh.com\n\
    \nNote: When we use the term SSH in the remainder of this chapter, we are referring\
    \ specifically to the OpenSSH implementation.\n\nSome of the security benefits\
    \ provided by SSH include:\n\n- Strong encryption: Network traffic is encrypted.\
    \ SSH uses a variety of both symmetric and asymmetric encryption mechanisms:\n\
    - Symmetric encryption is used for bulk data encryption. Supported algorithms\
    \ include 3DES, Blowfish, and IDEA.\n- Asymmetric encryption is used for both\
    \ host identification and exchanging symmetric encryption keys. SSH can use Rivest-Shamir-Adleman\
    \ (RSA) and Digital Signature Algorithm (DSA) public/private encryption.\n- Digital\
    \ authentication: Public keys are used to authenticate hosts.\n- Data integrity\
    \ checking: Hash functions (CRC32, MD5, and SHA-1) ensure packets are not modified\
    \ in transit.\n\n## 4.5 Secure network access using SSH\n\nOne of the most prevalent\
    \ uses for SSH is as a replacement for Telnet. The command syntax to securely\
    \ connect to a remote host is:\n\n```\nssh -l user host\n```\n\nWhere:\n\n| Field\
    \ | Description |\n| :--- | :--- |\n| user | Specifies the remote user name |\n\
    | host | Specifies the remote host. |\n\nThe command may be abbreviated using:\n\
    \n```\nssh user@host\n```\n\nIf the remote user name is omitted, the local login\
    \ name is used by default. To establish a remote SSH, the user is prompted to\
    \ provide the remote user password.\n\nNote: User names and passwords are encrypted\
    \ before being sent across the network. In 4.7,\"Authentication without passwords,\"\
    \ we discuss a mechanism to authenticate SSH without providing a password.\n\n\
    ### 4.5.1 Known hosts\n\nSSH employs a known host mechanism to prevent a man-in-the-middle\
    \ attack. When a client initiates an SSH connection, the server returns its public\
    \ key. The client then checks that against its list of known server public keys.\
    \ If the secret key does not match the public key for the server, the SSH client\
    \ alerts that a third party has redirected the connection (a false host impersonating\
    \ the intended server) and terminates the connection.\n\nThe known host mechanism\
    \ is an additional security protection (a Telnet session has no protection against\
    \ man-in-the-middle attacks). Known host public keys are saved in the ~/.ssh/known_hosts\
    \ file on the SSH client in the format shown in Example 4-10.\n\nExample 4-10\
    \ The ~/.ssh/known_hosts\n\n```\n192.168.100.2 ssh-rsa AAAAB3nZaYc2AAAABIAWIAAA...\n\
    9.12.9.38 ssh-rsa AAAAB3nZaYc2AAAABIAWIAEAT+5...\n192.9.37 ssh-rsa AAAAB3nZaYc2AAAABIAWIAAmhB...\n\
    172.22.10.2 ssh-rsa AAAAB3nZaYc2AAAABIAWIAEAT...\n192.168.100.101 ssh-rsa AAAAB3nZaYc2AAAABIAWIAAA...\n\
    192.168.100.200 ssh-rsa AAAAB3nZaYc2AAAABIAWIAAA...\n9.12.637 ssh-rsa AAAAB3nZaYc2AAAABIAWIAEAmt...\n\
    ```\n"
