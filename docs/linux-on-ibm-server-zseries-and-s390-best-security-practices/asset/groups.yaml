    Bastille 是系统管理员发现和收紧安全设置的实用工具。图形化用户界面允许管理员选择适合其环境的安全设置。Bastille 会根据用户提供的选择自动实施更改。


    > **注意：** SLES8 提供的 Bastille 版本 (1.2.0) 无法在 Linux for zSeries 上运行。然而，如果从源码发行版安装，Bastille
    1.3.0 版本就可以工作（因为 Bastille 是用 Perl 编写的，不需要编译）。Bastille 1.3.0 版本可以从 Rpmfind.net
    服务器获取，地址为：


