    delegate permission to change access control. Programs executed by a user inherit
    permissions granted to the user and are free to change access to the user''s files.
    This can create a security hole for malicious software.


    The preferred security mechanism for enterprise computing is Mandatory Access
    Control (MAC). In a MAC environment, users cannot specify access control to the
    objects they own. Instead, file and directory authorization is granted based on
    a system policy. Each user has a role defined by the system security administrator,
    and file access is granted on that role. Roles are enforced at the kernel level
    and cannot be circumvented by users.


