    Proxy firewalls can cache information such as HTML pages in order to gain some
    performance, but the following drawbacks remain:


    +   * Application layer detecting and duplicate connections can affect performance.
    Traffic inspection takes place at the highest layer of the TCP/IP stack. The necessity
    of inspecting every layer before returning back down to the physical layer can
    cause bottlenecks in busy networks.

    * The number of services used by a proxy firewall is an issue. Because every service
    needs its own proxy, the proxy list must be continually updated as new applications
    and services are added.


    # ## 6.2.3 Stateful inspection firewalls


    Stateful inspection technology was developed to overcome the limitations of packet
    filtering firewalls. Stateful inspection firewalls use additional criteria (such
    as historical data about the connection) in determining whether to allow or deny
    access. Established connections are tracked in dynamic state tables to ensure
    they comply with security policies.


    By applying connection status and context information to established connections
    and packets, access denial can occur before inspection at a higher level in the
    protocol stack. This can increase performance. Because stateful inspection understands
    connection context (returning packets can be correlated to an established connection),
    previously determined'
  - '[PAGE 103]


    connections can be allowed without further examination. This is especially important
    for services such as Telnet and FTP.


    Stateful inspection operates beneath the network layer (in practice, inspection
    occurs between the data link and network layers). Stateful inspection firewalls
    have a limited capability to inspect data at the application layer. State tables
    are maintained for every connection protocol, whether it is valid or not. The
    stateful inspection model is illustrated in Figure 6-3.


    | Application | | Some stateful inspection firewalls can examine basic protocol
    compliance at higher levels, but the list of protocols and inspection options
    is limited. |

    | --- | --- | --- |

    | Presentation | | Presentation |

    | Session | | Session |

    | Transport | | Transport |

    | Network | | Network |

    | Data Link | | Data Link |

    | Physical | | Physical |


    Figure 6-3 Stateful inspection model


    # 6.2.4 StoneGate and multi-layer inspection


    StoneGate, the Stonesoft Corporation introduces a new firewall technology called
    *multi-layer inspection* depicted in Figure 6-4 on page 91. Like stateful inspection,
    StoneGate uses state tables to track connections and judge whether a packet is
    part of an established connection. However, it also features application-layer
    inspection by implementing specific *protocol agents*, necessary, for enhanced
    security.


    StoneGate can inspect data all the way up to the application layer to decide whether
    a packet should be granted access or not. Moreover, StoneGate can also act as
    a packet filter for types of connections that do not require the security considerations
    of stateful inspection.'
