    # # StoneGate administration


    StoneGate also offers flexible access control for configuring and maintaining
    firewall clusters, networks, users, and other related components. Access to the
    GUI is provided at three different user levels:


    +   * Superuser: The Superuser is the highest level of access, much like the Administrator
    account in Microsoft Windows NT8 or root in UNIX. This level enables the creation
    of other administrator accounts, as well as the ability to create, modify, or
    delete network objects, rule bases, templates, users, and so on. The Superuser
    can also grant additional access privileges to Editors or Operators.


    +   * Editor: This level is the intermediate access level. Editors can modify
    some objects, users, and rule bases. By default, they cannot modify templates,
    create or modify editors, or delete objects. Additional privileges can be given
    to them by Superusers.'
  - '[PAGE 134]


    +   - Operator

    These are the least-privileged accounts, enabling the monitoring of systems and
    the viewing of rule bases and configuration information. However, Operators cannot
    modify elements by default. They can be granted additional privileges by a Superuser,
    or by an Editor who has been given that privilege by the Superuser.


    These levels enable the delegation of administrator tasks in enterprise networks.
    Additional privileges can be granted to lower levels. The network administrator
    can create multiple accounts of each type, with unique user IDs and passwords.


    # 6.5 StoneGate installation


    In this section, we describe the installation of StoneGate for zSeries firewall
    and VPN on a z/VM guest.


    # 6.5.1 The z/VM guest definition


    The z/VM guest used to host StoneGate should be defined with class G privileges.
    StoneGate requires two 3390-3 DASD devices with at least 1 GB per minidisk device.
    A sample user directory entry for the StoneGate virtual machine is shown in Example
    6-1.


    > Example 6-1 Example z/VM user directory entry for StoneGate


    ```

    USER LNXSG2 LNXSG2 128M 16 G

    INCLUDE IBMFLT

    IPL 190 PARM AUTOCR

    MACHINE XA

    DEDICATE 7104 7140

    DEDICATE 7105 7141

    DEDICATE 7106 7142

    LINK TCPIP 0592 0592 RR

    MDISK 0191 3390 3238 100 440U1R

    MDISK 0171 3390 0031 3338 LX15C9

    MDISK 0172 3390 0031 3338 LX15CB

    ```


    We use the 171 and 172 minidisks for StoneGate. The 100 cylinder (30 MB) 191 minidisk
    is used for the StoneGate for zSeries firewall and VPN installation files. An
    OSA-Express adapter is defined by the guest using virtual addresses 7104-7106
    (real addresses 7140-7142).'
