    # # 6.4 StoneGate on Linux for zSeries


    StoneGate is the only commercially available and certified firewall and VPN product
    for IBM zSeries systems. StoneGate removes the need for external firewall servers
    between front-end and back-end applications, saving cost in investment, labor,
    and maintenance. StoneGate enables simultaneous firewalls in a virtual network
    environment and is able to use the high degree of scalability offered by zSeries.
    Centralized management system simplifies deployment and maintenance of multiple
    firewall instances. StoneGate on zSeries features VPNs that enhance security for
    sensitive network traffic (such as financial transactions within the mainframe).
    Figure 6-19 on page 112 depicts a zSeries StoneGate deployment.'
