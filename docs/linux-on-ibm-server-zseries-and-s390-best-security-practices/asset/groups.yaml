    # IBM @server zSeries 和 S/390上的 Linux：最佳安全实践


    # IBM @server zSeries 和 S/390上的 Linux：最佳安全实践


    z/VM 安全主题


    本 IBM Redbook 讨论了在 IBM @server zSeries 和 S/390 平台上作为 z/VM 虚拟机运行 Linux 的最佳实践。本书旨在面向负责部署在
    z/VM 下运行的安全 Linux 服务器的系统管理员和 IT 架构师。我们考虑了 z/VM 和 Linux 的安全主题。


    保护 Linux 虚拟机


    # 国际技术支持组织


    zSeries 的 Linux 防火墙


    # 基于实践经验构建技术信息


    我们研究了 zSeries 为在 z/VM 下整合大量 Linux 服务器所提供的独特安全和完整性特性。我们讨论了虚拟机隔离以及分配给 VM 客户机的命令权限。解释了
    z/VM 版本 4.4 的安全配置选项。


    在本书中，我们还讨论了 Linux 安全主题。我们研究了加固 Linux 安装的选项。考虑了使用安全套接层（SSL）和安全外壳（SSH）保护 Linux 流量。我们查看了使用
    Free/WANS 实现私有网络。讨论了商业防火墙技术以及使用 zSeries StoneGate 防火墙的实施。我们研究了如何结合 IBM Tivoli
    Access Manager 和运行在 z/OS 上的 LDAP 服务器，针对运行在 z/OS 上的 RACF 进行 Linux 用户身份验证。


