    Table 6-1 summarizes the communications between different StoneGate components
    and shows traffic volumes typically generated. Traffic volumes are categorized
    as:


    +   - High

    High volume regular traffic. A high throughput link is desirable.


    +   - Medium

    A low bandwidth link, such as a modem, might not suffice.


    +   - Low

    One-time contact only.


    Table 6-1 Communication between StoneGate components


    | GUI client | Log Server | Management Server | Engine |

    |---|---|---|---||

    | GUI client | NA | Medium when the client requests log information. | Medium:
    Periodically and on user action. | Never |

    | Log Server | Never | NA | Medium at startup, and then after that periodically
    and low. A broken link does not disturb the server''s operation. | Never |

    | Management Server | Never | Never | NA | Medium: when monitoring and uploading
    a configuration. |

    | Engine | Never | High when sending firewall logs. | Low: In initial configuration
    only. | Medium to High: Heartbeat and state sync traffic if HA mode is used. |


    The GUI client never communicates with the firewall engines. Instead, communication
    is though the Management Server. The highest volume of traffic is generated by
    the logs sent from the engines to the Log Server. To reduce traffic, data can
    be filtered. Each engine defined in a cluster communicates with all other engine
    in cluster, sharing information about current connections, load, and state information
    through Ethernet (IEEE 802) multicast.'
