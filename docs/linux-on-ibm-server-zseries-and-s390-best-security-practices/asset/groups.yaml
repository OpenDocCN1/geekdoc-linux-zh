    X 协议从安全角度来看存在问题。服务器与客户端之间的网络流量未加密的，可能会被网络攻击者监控。X 转发（X forwarding）可以帮助保护 X Windows
    会话。通过 X 转发，X 网络传输将通过安全的 SSH 隧道进行。


    要启用 X 转发，请在 SSH 服务器配置 (/etc/ssh/sshd_config) 中添加 `X1Forwarding`。启用 X 转发后，确保在 `/etc/ssh/sshd_config`
    文件中指定 `X1UseLocalHost` 是关重要的。此选项将转发的端口绑定到回环接口（避免了在第 68 页“GatewayPorts”中讨论的泄露问题）。


    > 提示：当启用 X 转发并指定了 `X1UseLocalHost` 选项时，登录时 `DISPLAY` 环境变量会被设置为 "localhost:10.0"。如果没有指定
    `X1UseLocalHost` 选项，登录时 `DISPLAY` 变量将使用远程主机名。


    ## 4.9.1 X 转发的安全考量


    只有在仔细考虑安全影响后，才应该启用 X 转发。尽管 `X1UseLocalHost` 选项将转发端口绑定到回环地址，但用户可以更改 `DISPLAY` 环境变量（绕过
    SSH 隧道，转而在客户端和服务器之间交换未加密的数据）。如果启用了 X 转发，确保由 SSH 设置 `DISPLAY` 变量并确保用户不修改此环境变量是非常关重要的。


    ## 4.10 使用端口转发保护 VNC


    虚拟网络计算（Virtual Networking Computing, VNC）是一个跨平台的远程控制软件包。VNC 允许在 Microsoft® Windows®
    上访问 X Windows 会话，而无需在 Windows 机器上运行 X 服务器。VNC 根据 GNU 通用公共许可证 (GPL) 分发，可以在 RealVNC（VNC
    的官方网站）获取：


    ```

    http://www.realvnc.com/

    ```


    VNC 是一个客户端/服务器应用：


    - VNC 服务器运行在远程机器上。

    - VNC 客户端连接到服务器以访问远程机器。


    连接到 VNC 服务器需要密码，且密码在通过网络传输时会进行加密。然而，VNC 协议不能被认为是安全的；它传输的是明文网络流量。使用 SSH 端口转发，可以为
    VNC 连接增加安全性（数据通过加密的 SSH 隧道传输）。我们概述了一个保护在 Windows 上运行并连接到 zSeries 上 Linux 客户机的
    VNC 查看器的程序。


    ### 4.10.1 安装 VNC 服务器


    VNC 是 Linux for zSeries 上 SLES 8 发行版的一部分。VNC 服务器和客户端是 VNC 软件包的一部分。使用 `vncserver
    :0` 命令启动服务器。VNC 服务器默认监听在 TCP 端口 5900（你可以使用 `netstat --numeric --tcp` 命令验证此项）。第一次启动
    VNC 服务器时，系统会提示你提供一个密码（当 VNC 客户端尝试连接到服务器时使用）。


    > 提示：`:0` 参数表示 VNC 将显示为 0。每个 VNC 将使用 5900 之后的下一个可用端口。例如，显示 1 监听在端口 5901 上。


    ### 4.10.2 在 Windows 上安装 VNC 客户端


    从 RealVNC 下载并安装 VNC。要通过转发的端口使用 VNC，请确保 Windows 注册表包含：


    ```

    HKEY_LOCAL_MACHINE\Software\WinVNC\AllowLoopback=1

    ```


    > 提示：使用 `regedit` 命令编辑系统注册表。


    ### 4.10.3 在 Windows 上安装 SSH 服务器


    本地端口转发需要在 Windows 机器上安装 SSH。OpenSSH 作为 Cygwin（适用于 Windows 的类 Linux 环境）的一部分提供。Cygwin
    地址为：


