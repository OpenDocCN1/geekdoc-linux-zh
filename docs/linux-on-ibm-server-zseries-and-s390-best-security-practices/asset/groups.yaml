    # # 6.4.1 High availability technologies


    In the past, firewalls could be made highly available through add-on software
    or redundant hardware solutions. Often, this resulted in moving a single point
    of failure to another network component (typically the network link). Other network
    services (such as Web, FTP, or content inspection servers) would require yet more
    hardware and software to eliminate single points of failure in the enterprise.


    StoneGate high availability firewall and VPN includes several clustering technologies
    to reduce the complexity needed for high availability. StoneGate''s innovative
    clustering and load-balancing features provide several benefits over traditional
    solutions.


    # ## Built-in high high availability


    To achieve firewall high availability, additional hardware switches, software
    clustering products, or special load balancing devices are often used. With StoneGate,
    high availability is built into the firewall engines. Individual connections can
    be transparently moved to a hot-standby node if an active node becomes overloaded
    or experiences a failure.'
  - '[PAGE 126]


    Note: Connection switching also happens during remote upgrades.


    Using virtual IP addresses combined with MAC addresses, firewall engines are seen
    by the rest of the network as a single entity (reducing the need for configuration
    changes elsewhere in the network). The Cluster Virtual Interface (CVI) has IP
    and MAC addresses shared by all the nodes in a cluster. CVIs are used for any
    load-balanced traffic between nodes. Traffic arriving at a CVI reaches all the
    nodes simultaneously. However, only a single node processes given connection.
    Figure 6-20 illustrates a high availability set of firewall nodes.


    ![](img/a2760634ecd5eb26c25e81867e88d740_126_0.png)


    Figure 6-20 Cluster Virtual Interfaces


    Each firewall node is assigned two NDIs:


    +   - Each node''s NDI ID0 interface addresses the CVI0 virtual interface. This
    virtual IP address shared by all nodes; the Node Dedicated Interface (NDI) IP
    address is unique for each node.

    - Each node''s NDI ID1 interface addresses the CVI1 virtual interface. This virtual
    interface provides connectivity to the Internet.


    Chapter 6. StoneGate firewall 113'
  - '[PAGE 127]


    The number of NICs is limited by the network interface card hardware


    High availability provides for scalability and maintenance during business hours.
    Individual nodes can be taken offline. Connections previously handled by the engine
    are transparently transferred to the standby node.


    # High availability connections


    StoneGate provides high availability options for related network components. Internet
    service providers (ISPs) and virtual private networks (VPNs) have often a single
    point of failure for enterprise communications. High availability was attainable,
    but at a cost of complexity. StoneGate eliminates these issues by innovative technologies.


    As the role of Internet-driven business grows, the reliability of connections
    and constant availability of services is an absolute necessity for corporations.
    Even with clustering products, corporate network are subject to outages should
    network links fail. Elimination of this single point of failure often requires
    a battery of redundant external routers and switches using complex routing protocols,
    such as Border Gateway Protocol (BGP) and Hot Standby Routing Protocol (HSRP),
    as well as peering arrangements through the ISPs providing connections. In addition
    to the expense of redundant hardware, network administrators face additional complexity
    to achieve high availability.


    # Multilink technology


    StoneGate enables network administrators to use several ISPs with multilink technology
    This removes problems associated with high availability routing protocols. High
    availability network links reduce the need for costly leased lines. Any IP-based
    link with a dedicated IP address range can be used as part of a multilink configuration:


    +   - Standard Internet connections provided by ISPs

    - ISDN connections

    - Leased lines


    With multilink technology, redundant routes to the Internet are represented as
    a special network element (a NetLink) in the StoneGate GUI. Network traffic is
    balanced between NetLinks, as depicted in Figure 6-21 on page 115.'
- md: "\n![](img/a2760634ecd5eb26c25e81867e88d740_128_0.png)\nFigure 6-21 StoneGate\
    \ multilink technology for high availability\n\nNetLinks enable easily configured\
    \ load-balanced connections in the event of a router or network failure.\n\n>\
    \ Note: The number of network links is not limited by or dependent on the number\
    \ of the physical firewall interfaces. A single NIC can accommodate several CVIs,\
    \ each defined in a single IP address space. In this way, a single physical interface\
    \ can connect several ISPs if required. When firewall nodes are clustered, a node\
    \ failure does not mean that all connections to the ISP are lost. Instead, connections\
    \ are immediately switched over to a functioning node.\n\n## Load-balanced routing\n\
    \nTraffic can be load balanced across all available links, improving overall network\
    \ throughput. For example, Stonesoft's patented load-balanced routing technology\
    \ enables routing through the fastest available link. The dynamic routing engine\
    \ (which performs load-balanced routing) sends an initial packet out through each\
    \ network link, measuring the response times. Based on the measurement, connections\
    \ are routed automatically through the link with the best performance.\n\n## Increasing\
    \ the bandwidth\n\nAs bandwidth requirements increase, the traditional solution\
    \ has been to pay more to the existing provider; changing would result in the\
    \ expensive change of public IP addresses. With StoneGate, you can increase the\
    \ bandwidth by simply adding new ISPs to your network. StoneGate can incorporate\
    \ multiple ISPs into a single, virtual Internet connection.\n\n### 6.4.2 Benefits\
    \ of multilink technology\n\nThe advantages of StoneGate's multilink technology\
    \ include:\n\n- More secure networks\n  There are fewer possibilities for traffic\
    \ to bypass firewalls through other network devices.\n- Less complicated networks\n\
    \  The firewall takes care of the load balancing (eliminating the need for special\
    \ load re-directors, switches, or other devices that might introduce single point\
    \ of failure). The time and cost required for network maintenance and configuration\
    \ is reduced.\n\nMultilink technology simplifies the use of multiple ISPs and\
    \ increases the availability and bandwidth at use for critical applications. Transactions\
    \ load-balanced routing always select the optimal route to a destination.\n\n\
    ### 6.4.3 Applying multilink technology\n\nMultilink technology can be applied\
    \ in three unique scenarios:\n\n- Outbound traffic management\n- Multilink VPNs\n\
    - Inbound traffic management\n\nEach scenario handles high-availability and load\
    \ balancing differently.\n\n#### Outbound traffic management\n\nOutbound traffic\
    \ management in StoneGate provides both high availability and load balancing between\
    \ multiple NetLinks. Load balancing between ISPs increases overall network throughput.\
    \ For each connection request, StoneGate firewall can select the fastest route\
    \ for the connection. Figure 6-22 on page 117 illustrates outbound traffic management\
    \ decisions, using the round trip time of the first SYN packet as the basis for\
    \ the load-balanced routing decision.\n\n![](img/a2760634ecd5eb26c25e81867e88d740_130_0.png)\n\
    Figure 6-22 Outbound load balancing\n\n## Multilink VPNs\n\nVPNs are an increasingly\
    \ critical component of enterprise networks. Trusted communication with remote\
    \ offices or users through the insecure Internet is possible using encrypted tunnels\
    \ to internal networks. Historically, VPN tunnels were subject to failure in the\
    \ event of router or link failures. Often, only one VPN tunnel could be established\
    \ with a remote site, placing bandwidth restrictions on an already limited connection.\n\
    \nUsing StoneGate, clustered, load-balanced IPsec VPN tunnels are now possible.\
    \ A logical tunnel consisting of one or more physical VPN tunnels through different\
    \ ISPs is possible. Figure 6-23 on page 118 demonstrates a VPN consisting of two\
    \ physical links at one end and three at the other. In this example configuration,\
    \ StoneGate can use six different subtunels, forming one virtual VPN tunnel to\
    \ load balance VPN traffic between sites.\n\n![](img/a2760634ecd5eb26c25e81867e88d740_131_0.png)\n\
    Figure 6-23 Clustered, highly available VPN tunnels\n\nIf one subnet collapses,\
    \ connections using that tunnel are automatically shifted to another subnet established\
    \ with the remote site. Should all ISP links be down, StoneGate can bring standby\
    \ links (such as leased lines or dialup connections) into use. This introduces\
    \ true fault tolerance and high availability to VPN traffic.\n\n## Inbound traffic\
    \ management\n\nStoneGate can load balance connections to different services in\
    \ an internal network (Web servers, for example). With existing technologies,\
    \ it is often necessary to deploy additional load-balancing switches, clustering\
    \ software, and special load-balancing hardware to ensure high availability and\
    \ improved performance. As shown in Figure 6-24 on page 119, network administrators\
    \ are faced with additional complexity to achieve network high availability.\n\
    \n![](img/a2760634ecd5eb26c25e81867e88d740_132_0.png)\nFigure 6-24 Traditional\
    \ inbound load balancing\n\nWith StoneGate, administrators can taking advantage\
    \ of multilink technology to load balance network services. For example, a Web\
    \ server pool can be set up on a DMZ network, as illustrated in Figure 6-25 on\
    \ page 120. StoneGate can share connections to the pool using load balancing between\
    \ ISPs. The selection of the ISP can be based on dynamic DNS updates, or on multiple\
    \ DNS entries. StoneGate constantly monitors server availability to ensure that\
    \ connections from a particular source address are handled by one server only.\n\
    \n![](img/a2760634ecd5eb26c25e81867e88d740_133_0.png)\nFigure 6-25 StoneGate traffic\
    \ management with dynamic DNS\n\n## StoneGate administration\n\nStoneGate also\
    \ offers flexible access for configuring and maintaining clusters, networks, and\
    \ users. Access to the GUI is provided at three different user levels:\n\n- Superuser:\
    \ The Superuser is the highest level, like the Administrator account in Windows\
    \ NT or root in UNIX. This level enables the creation of multiple account types.\
    \ The Superuser can also grant additional privileges to Editors or Operators.\n\
    - Editor: This level is the intermediate level. Editors can modify objects, users,\
    \ and rule bases. By default, they cannot create or delete objects. They can be\
    \ granted additional privileges by Superusers.\n- Operator: These are the least-privileged\
    \ accounts, enabling the monitoring of systems and the viewing of rule bases and\
    \ configuration information. However, Operators cannot modify elements by default.\
    \ They can be granted additional privileges by a Superuser or by an Editor.\n\n\
    These levels enable the delegation of administrator tasks in enterprise networks.\
    \ The network administrator can create multiple accounts of each type with unique\
    \ user IDs and passwords.\n\n## 6.5 StoneGate installation\n\nIn this section,\
    \ we describe the installation of StoneGate for zSeries firewall and VPN on a\
    \ zVM guest.\n\n### 6.5.1 The z/VM guest definition\n\nThe z/VM guest used to\
    \ host StoneGate should be defined with class G privileges. StoneGate requires\
    \ two 3390-3 DASD devices with at least 1 GB per minidisk. A sample user directory\
    \ entry for the StoneGate machine is shown in Example 6-1.\n\n> Example 6-1 Example\
    \ z/VM user entry for StoneGate\n```\nUSER LNXSG2 LNXSG2 128M 16 G\nINCLUDE IBMFLT\n\
    IPL 190 PARM AUTOCR\nMACHINE XA\nDEDICATE 7104 7140\nDEDICATE 7105 7141\nDEDICATE\
    \ 7106 7142\nLINK TCPIP 0592 0592 RR\nMDISK 0191 3390 3238 100 440U1R\nMDISK 0171\
    \ 3390 0031 3338 LX15C9\nMDISK 0172 3390 0031 3338 LX15CB\n```\n\nWe use the 171\
    \ and 172 minidisks for StoneGate. The 100 cylinder (30 MB) 191 minidisk is used\
    \ for the StoneGate for zSeries firewall and VPN installation files. An OSA-Express\
    \ adapter is defined by the guest using virtual addresses 7104-7106 (real addresses\
    \ 7140-7142).\n"
  mdcn: "\n\n![](img/a2760634ecd5eb26c25e81867e88d740_128_0.png)\n图 6-21 用于高可用性的 StoneGate\
    \ 多链路技术\n\nNetLinks 允许在路由器或网络故障时轻松地配置负载均衡连接。\n\n> 注意：网络链路的数量不受限制也不依赖于物理防火墙接口的数量。单个网卡（NIC）可以容纳多个\
    \ CVI，每个 CVI 定义在单个 IP 地址空间中。通过这种方式，如果需要，单个物理接口连接多个 ISP。当防火墙节点形成集群时，节点故障并不意味着所有到\
    \ ISP 的连接都会丢失。相反，连接会立即切换到运行正常的节点。\n\n## 负载均衡路由\n\n流量可以在所有可用链路之间进行负载均衡，提高整体网络吞吐量。例如，Stonesoft\
    \ 的专利负载均衡路由技术允许通过最快的可用链路进行路由。动态路由引擎（执行负载均衡路由）会通过每个网络链路发送初始数据包并测量响应时间。根据测量结果，连接将自动路由到性能最佳的链。\n\
    \n## 增加带宽\n\n随着带宽需求的增加，传统的解决方案是向现有提供商支付更多费用；更改供应商将导致昂贵的公网 IP 地址更改。使用 StoneGate，您只需通过向网络添加新的\
    \ ISP 即可增加带宽。StoneGate 可以将多个 ISP 整合到单一虚拟 Internet 连接。\n\n### 6.4.2 多链路技术的优势\n\n\
    StoneGate 多链路技术的优势包括：\n\n- 更安全的网络\n  流量通过其他网络设备绕过防火墙的可能性更少。\n- 更不复杂的网络\n  防火墙负责负载均衡（消除了对特殊负载重定向器、交换机或其他可能引入单点故障设备的需求）。减少了网络维护和配置所需的时间成本。\n\
    \n多链路技术简化了多个 ISP 的使用，并增加了关键应用程序在用时的可用性和带宽。事务负载均衡路由始终选择通往目的地的最优路径。\n\n### 6.4.3\
    \ 应用多链路技术\n\n多链路技术可以应用于三个独特的场景：\n\n- 出站流量管理\n- 多链路 VPN\n- 入站流量管理\n\n每个场景处理高可用性和负载均衡的方式各不相同。\n\
    \n#### 出站流量管理\n\nStoneGate 中的出站流量管理在多个 NetLinks 之间提供高可用性和负载均衡。ISP 之间的负载均衡增加了整体网络吞吐量。对于每个连接请求，StoneGate\
    \ 防火墙可以为连接选择快速路径。第 117 页的图 6-22 展示了出站流量管理决策，以第一个 SYN 数据包的往返时间作为负载均衡路由决策的依据。\n\n\
    ![](img/a2760634ecd5eb26c25e81867e88d740_130_0.png)\n图 6-22 出站负载均衡\n\n## 多链路 VPN\n\
    \nVPN 是企业网络中日益重要的组件。通过加密隧道到内部网络，可以在不安全的 Internet 与远程办公室或用户进行可信通信。历史上，VPN 隧道在路由器或链路故障时容易发生。通常，与远程站点只能建立一个\
    \ VPN 隧道，这对已有限的连接限制了带宽。\n\n使用 StoneGate，现在可以实现集群、负载均衡的 IPsec VPN 隧道。由通过不同 ISP\
    \ 的一个或多个物理 VPN 隧道组成的逻辑隧道是可能的。第 118 页的图 6-23 展示了一个在一端有两个物理链路、另一端有三个物理链路的 VPN。在示例配置中，StoneGate\
    \ 可以使用六个不同的子隧道形成一个虚拟 VPN 隧道，在站点之间负载均衡的 VPN 流量。\n\n![](img/a2760634ecd5eb26c25e81867e88d740_131_0.png)\n\
    图 6-23 集群、高可用 VPN 隧道\n\n如果一个子网崩溃，使用该隧道的连接将自动转移到与远程建立建立另一个子网。如果所有 ISP 链路都掉线，StoneGate\
    \ 可以启用备用链路（如租线或拨号连接）。这为 VPN 流量引入了真正的容错和高可用性。\n\n## 入站流量管理\n\nStoneGate 可以对内部网络中不同服务（例如\
    \ Web 服务器）的连接进行负载均衡。使用现有技术通常需要部署额外的负载均衡交换机、集群软件和特殊的负载均衡硬件来确保高可用性和提高性能。如第 119 页的图\
    \ 6-24 所示，网络管理员在实现网络高可用性方面面临着额外的复杂性。\n\n![](img/a2760634ecd5eb26c25e81867e88d740_132_0.png)\n\
    图 6-24 传统的入站负载均衡\n\n使用 StoneGate，管理员可以利用多链路技术对网络服务进行负载均衡。例如，如第 120 页的图 6-25 所示，可以在\
    \ DMZ 网络上建立 Web 服务器池。StoneGate 可以通过 ISP 之间的负载均衡共享到池的连接。ISP 的选择基于动态 DNS 更新或多个 DNS\
    \ 目。StoneGate 持续监控服务器可用性，以确保来自特定源地址的连接仅由一台服务器处理。\n\n![](img/a2760634ecd5eb26c25e81867e88d740_133_0.png)\n\
    图 6-25 使用动态 DNS 的 StoneGate 流量管理\n\n## StoneGate 管理\n\nStoneGate 还提供了灵活的访问方式来配置和维护集群、网络和用户。GUI\
    \ 提供三种用户级别：\n\n- 超级用户（Superuser）：最高级别，类似于 Windows 中的管理员或 UNIX 中的 root。\n- 编辑者（Editor）：中间级别，可以修改对象、用户和规则库。默认情况下不能创建或删除对象。可以通过超级用户授予额外权限。\n\
    - 操作员（Operator）：最低权限账户，允许监控系统和查看规则库。然而，默认情况下无法修改元素。可以通过超级用户或编辑者授予额外权限。\n\n这些级别允许企业网络中的管理员任务。网络管理员可以创建具有唯一用户\
    \ ID 和密码的各种账户。\n\n## 6.5 StoneGate 安装\n\n在本节，我们将描述在 zVM 虚拟机上安装 StoneGate 防墙和 VPN。\n\
    \n### 6.5.1 z/VM 虚拟机定义\n\n用于托管 StoneGate 的 z/VM 虚拟机应定义为 G 类权限。StoneGate 需要两个 3390-3\
    \ 设备，每个虚拟磁盘至少 1 GB。示例 6-1 显示了 StoneGate 示例用户目录条目。\n\n> 示例 6-1 StoneGate 示例 z/VM\
