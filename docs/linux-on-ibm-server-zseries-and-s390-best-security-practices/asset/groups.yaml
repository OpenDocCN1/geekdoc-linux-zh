    # LPAR security certification


    PR/SM for the IBM @Server Z900 has achieved Common Criteria for Information Security
    Evaluation EAL5 level certification. This provides a high degree of assurance
    that operating systems running in different LPARs on the z900 are isolated from
    each other. SUSE LINUX Enterprise Server 8 with Service Pack 3 has achieved Controlled
    Access Profile compliance under the Common Criteria (referred to as CAPP/EAL3+).
    For more information, see:


    ```

    http://www.ibm.com/servers/eserver/zeries/security/certification.html

    ```


    # 2.1.2 Integrity by the zVM Control Program


    The z/VM Control Program (CP), the hypervisor, is primarily a real-machine resource
    manager. The CP provides each user with an individual working environment known
    as a virtual machine. Each virtual machine is a functional equivalent of a real
    system, sharing the real processor function, storage, console, and input/output
    (I/O) device resources. When you first log on to z/VM, the CP controls the working
    environment. Many of the facilities of z/VM are immediately available to you.
    For example, you can use the CP commands to do various system management tasks.
    Most of the work done on z/VM requires the Conversational Monitor System (CMS)
    or a guest operating system, such as z/OS, to help with data processing tasks
    and manage work flow. The CP provides connectivity support that allows application
    programs to exchange information with each other and to access resources residing
    on the same z/VM system or on different z/VM systems.'
- md: '

    > **Note:** For details about running virtual machines under z/VM, consult z/VM
    V4R.0 Virtual Machine Operation, SC24-6036, and z/VM V4R.0 Guest Operating Systems,
    SC24-5997.


    In the same manner as the SIE instruction enables context switches between LPARs,
    the CP uses the SIE instruction when dispatching virtual machines. When dispatched,
    a virtual machine runs until its time slice expires, or until it executes an instruction
    that cannot be visualized (for example, an I/O instruction). At that time, control
    returns to the CP. The CP then executes instructions on behalf of the virtual
    machine, or dispatches another virtual machine. This mechanism enables the CP
    to limit many software or hardware failures encountered when running on the real
    processor. If the error is isolated to a virtual machine, only that virtual machine
    fails without affecting either the CP itself or any virtual machine running under
    z/VM.


    # z/VM security certification


    In press release issued by SuSE and IBM on August 5, 2003, “IBM and SuSE Earn
    First Security Certification of Linux,” IBM makes the following statement:


    In addition to IBM''s ongoing commitment to accelerate the development and certification
    of Linux, the company will continue to invest in ongoing certifications for new
    and existing IBM products. Common Criteria certification is anticipated for z/VM
    in the upcoming year, with IBM''s suite of middleware products on Linux. IBM Directory
    has just completed evaluation under the Common Criteria, WebSphere Application
    Server and Tivoli Access Manager are currently undergoing evaluation, and several
    other Software Group products are being prepared to enter the process.


    # 2.2 zSeries network security


    zSeries networking facilities offer a unique security advantage. Queued direct
    input/output (QDIO) architecture uses direct memory access (DMA) to transfer network
    from the address space of the sender to the address space of the receiver. For
    HyperSocket networks means that network traffic cannot be “sniffed” by third parties
    (other z/VM guests or other LPARs). For OSA-Express, network traffic is moved
    directly to/from the adapter to the address space of the sender/receiver. For
    details about zSeries networking, see z24-6816, available at:


    ```

    http://www.ibm.com/redbooks/abstracts/sg246816.html

    ```


    **Note:** Although a Linux guest cannot sniff QDIO traffic that is not directed
    to or originating from that guest, it is possible for one process running in the
    Linux guest to view traffic directed to another process running in the same guest.
    Similarly, network traffic directed to an OSA-Express adapter can be sniffed by
    connected hosts external to the zSeries server.


    ## 2.3 Securing your z/VM system


    Before securing your Linux environment, it is important to first secure the z/VM
    system itself. An insecure z/VM system cannot provide security to Linux guests.
    For example, preventing unauthorized access inside a Linux virtual machine cannot
    prevent an intruder from gaining access to the z/VM console and thereby compromising
    the entire system integrity.


    In addition to z/VM itself, two other IBM software products can be installed and
    used to enhance integrity and security:


    - *IBM Directory Maintenance for z/VM/DirMaint™* provides a safe and simple interface
    to define and manage the z/VM directory. Features such as minisk allocation, virtual
    machine management, and auditing of transactions system administrators create
    and maintain a secure environment on how to deploy Linux virtual machines.

    - The Resource Access Control Facility (RACF) RACF is an External Security Manager
    (ESM) to further enhance z/VM system resources. RACF provides the ability to system
    resources, as well as virtual machine resources. RACF also provides a comprehensive
    set of auditing facilities. RACF can be used to verify login passwords and control
    access to miniskids, network nodes, shared segments, spool files, and system commands.


    An overview of z/VM security and integrity features can be found in z/VM Security
    and Integrity, by Alan Altmark and Cliff Laking.


    > **Note:** For details about how to secure the z/VM TCP/IP stack, consult z/VM
    V4R.0 TCP/IP Planning and Customization, SC24-6019.


    ### 2.3.1 System integrity statement of z/VM


    System integrity is an important characteristic of z/VM. This statement extends
    the previous statements of IBM on system integrity in the z/VM environment. IBM
    has implemented specific design and coding guidelines for maintaining system integrity.
    Procedures have also been established to make the application of these design
    and coding guidelines a formal part of the design and development process.


    Because it is not possible to certify that any system has perfect integrity, IBM
    continues its efforts to enhance the integrity of z/VM and to respond promptly
    when exposures are identified. IBM will accept APARs that describe:


    - z/VM system integrity exposure

    - Exposures to system integrity caused by a program running in a virtual machine,
    provided the problem has not been introduced by a customer-controlled authorization
    mechanism


    # z/VM system integrity definition


    z/VM system integrity ensures that an authorized virtual machine cannot:


    - Circumvent or disable Control Program real or auxiliary storage protection.

    - Access resources protected by RACF. Protected resource can include virtual machines,
    minidisks, and terminals.

    - Access a Control Program password-protected resource.

    - Obtain control in real supervisor state, or with privilege class authority greater
    than those it is assigned.

    - Circumvent system integrity of any other z/VM guest.


    With real storage protection, a virtual machine is isolated from all other virtual
    machines. The CP accomplishes this using:


    - Dynamic Address Translation (DAT) implemented at the hardware level

    - The Start Interpret Execution instruction

    - The Set Address Limit facility


    With auxiliary storage protection, the CP ensures that a virtual machine cannot
    access a minidisk or virtual disk (VDISK) to which it is not authorized. This
    protection is implemented using channel translation.


    # Customer responsibility


    Although protection of the customer''s data remains the customer''s responsibility,
    data security continues to be an area of vital importance to IBM. The IBM commitment
    to z/VM system integrity (as described in this text) represents a significant
    step to help customers protect their data.


    > Note: For more information about z/VM security and integrity, refer to z/VM
    V4R4.0 General Information, GC24-5991.


    # 2.4 CP privilege classes


    CP commands are grouped according to the level of authorization required to execute
    the specific command. The privilege class assigned to z/VM users determines what
    commands any user is authorized to execute. Table 2-1 lists the CP privilege classes,
    the type of user intended to be authorized for the privilege class, and a description
    of the functions provided by the privilege class.


    Table 2-1 CP privilege classes


    | Class | User | Function |

    | :--- | :--- | :--- |

    | A | System operator | Controls the z/VM system. System operator is responsible
    for system availability and resources. |

    | B | System resource operator | Controls all resources except controlled by system
    operator or spooling operator. |

    | C | System programmer | Updates or changes system-wide parameters. |

    | D | Spooling operator | Controls spool files and system reader, punch, and printer.
    |

    | E | System analyst | Examines and saves system operation. |

    | F | Service representative | Obtains and examines detailed system data from
    I/O devices. Class F is reserved for IBM use. |

    | G | General user | Controls functions associated to the user''s virtual machine.
    |

    | Any | | Commands available to any user regardless of privilege class. |

    | H | | Reserved for IBM use. |

    | I-Z 1-6 | User defined | Classes available to be customized by each installation.
    |

