    # 6.5.2 Ensuring file integrity


    Before installing StoneGate, ensure installation file integrity using MD5 or SHA-1
    checksums. The checksums can be found on the StoneGate installation CD-ROM and
    from the release information section of the Stonesoft Web site at:


    ```

    http://www.stonesoft.com/support/StoneGate

    ```


    To automatically check MD5 sums, issue the md5sum command in the directory containing
    the StoneGate installation files, as shown in Example 6-2.


    > Note: By default, Windows does not have MD5 or SHA-1 checksum programs; however,
    several third-party programs are available.


    Example 6-2 Checking file integrity using the md5sum command


    ```

    $ md5sum -c SG2.1.0-MD5.txt

    boot_catalog: OK

    install.bin: OK

    sg_engine_2.2.3.1017_s390.list: OK

    sg_engine_2.2.3.1017_s390.zip:

    ```


    The -c option specifies that MD5 sums are to be checked against values provided
    in the SG2.1.0-MD5.txt file.


    Use the shalsum -c sum command to compare SHA-1 checksums


    > Important: Do not use files that have invalid checksums. Contact Stonesoft technical
    support to resolve the issue.


    # 6.5.3 Downloading the installation files to z/VM


    Begin installation by transferring the StoneGate installation files to the A-disk
    of the StoneGate z/VM guest. In Example 6-3 on page 123, we show the command sequence
    to download the installation files from an anonymous FTP server.


    > Important: Make sure that network connections from the guests protected by StoneGate
    are routed through the firewall engine to ensure that the firewall cannot be bypassed.'
