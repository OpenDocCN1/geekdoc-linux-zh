    # 2.7 Directory Maintenance Facility


    Maintaining the user directory can be simplified using the automation and command
    interface provided by the Directory Maintenance Facility (DirMaint). Every directory
    entry statement is implemented as a DirMaint command.


    > Note: DirMaint is a separately licensed z/VM feature. With z/VM Version 4.4,
    DirMaint is shipped with the system installation media as a convenience. You must
    obtain a separate license to enable DirMaint.


    DirMaint provides the following facilities to ensure system integrity when updating
    the user directory:


    +   - Error checking is performed to ensure only changes are applied to the user
    directory.

    - Authorization to modify specific directory statements can be delegated to z/VM
    users.

    - Modifications to the user directory are performed by DirMaint service machines
    (thus reducing the need for grant authorization to other z/VM virtual machines).

    - DirMaint can maintain the user directory for both local and remote z/VM systems
    (again reducing the need for grant elevated authorization).


    # 2.7.1 DirMaint security features


    DirMaint supports the z/VM security strategy:


    +   - Access to user IDs is password controlled. DirMaint maintains user passwords,
    with customer choice of administration control or user control. DirMaint also
    supports the use of ESM for password control.

    - Access to minidis is controlled either by password or explicit link authorization
    (as determined by the minidis owner). Minidisk passwords are optional for controlling
    minidisk directory links. DirMaint supports control

    - VM system services are used to identify the originating user ID (and node ID)
    for all requests (local and remote). By default, requests are authenticated using
    the logon password for each DirMaint transaction. Unless prohibited by the system
    administrator, users can request suspension of authentication for requests made
    from their user ID. Remote requests never require authentication, and surrogate
    requests always require authentication.'
