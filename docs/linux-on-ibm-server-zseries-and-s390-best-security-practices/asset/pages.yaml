  md: '# 4.4 Secure Shell overview


    The Secure Shell (also known as SSH) is a secure network access protocol. Traditional
    network access protocols (Telnet, FTP, and the r-command suite, such as login,
    rcp, and rsh) must be considered inherently insecure. Unencrypted data (including
    user IDs and passwords) is transmitted over the network and can be captured by
    malicious threads. SSH provides a secure alternative for remote access, file transfer,
    and command execution.


    SSH was originally developed by Tatu Yönen (a researcher at the Helsinki University
    of Technology) as a method to prevent password-sniffing attacks. His initial implementation
    (known as SSH1) was released as free software. SSH-1 protocol was formalized as
    an Internet Engineering Task Force (IETF). Subsequent improvements resulted in
    a new SSH-2 protocol originally implemented as the SSH2 commercial product available
    from SSH Communications Security, Ltd. (founded by Yönen in 1995). OpenSSH is
    an open source implementation of Secure Shell based on the last version of SSH1.
    It supports both the SSH-1 and SSH-2 protocols. OpenSSH is provided as part of
    most distributions of Linux for zSeries (including SLES8 and RHEL3). Details about
    OpenSSH can be found at their Web site:


    http://www.openssh.com


    > Note: When we use the term SSH in the remainder of this chapter, we are referring
    specifically to the OpenSSH implementation.


    Some of the security benefits provided by SSH include:


    +   - Strong encryption

    Network traffic is encrypted. SSH uses a variety of both symmetric and asymmetric
    encryption mechanisms:

    - Symmetric encryption is used for bulk data encryption. Supported algorithms
    include 3DES, Blowfish, and IDEA.

    - Asymmetric encryption is used for both host identification and exchanging symmetric
    encryption keys. SSH can use Rivest-Shamir-Adleman (RSA) and Digital Signature
    Algorithm (DSA) public/private key encryption.


    +   - Digital authentication

    Public keys are used to authenticate SSH hosts.


    +   - Data integrity checking

    Hash functions (CRC-32, MD5, and SHA-1) are used to ensure packets are not modified
    in transit.'
  merge: -1
  pgno: 73
- img_proc: true
  md: '# 4.5 Secure network access using SSH


    One of the most prevalent uses for SSH is as a secure replacement for Telnet.

    The command syntax to securely connect to a remote host is:


    ```

    ssh -l user host

    ```


    Where:


    | user | Specifies the remote user name |

    | host | Specifies the remote host. |


    The command may be abbreviated using the syntax:


    ```

    ssh user@host

    ```


    If the remote user name is omitted, the local login name is used by default. To
    establish a remote SSH, the user is prompted to provide the remote user name password.


    > Note: User names and passwords are encrypted before being sent across the network.
    In 4.7,"Authentication without passwords" on page 65, we discuss a mechanism to
    authenticate SSH clients without providing a password.


    # 4.5.1 Known hosts


    SSH employs a known host mechanism to prevent a man-in-the-middle attack. When
    a client initiates an SSH connection, the server returns its public key prior
    to authentication. The client then checks that against its list of known server
    public keys. If the secret key does not match the public key for the server, the
    SSH client alerts that a third party has redirected the connection (a false host
    impersonating the intended server) and terminates the connection.


    The known host mechanism is an additional security protection (a Telnet session
    has no protection against man-in-the-middle attacks). Known host public keys are
    saved in the ~/.ssh/known_hosts file on the SSH client in the format shown in
    Example 4-10.


    Example 4-10 The ~/.ssh/known_hosts


    ```

    192.168.100.2 ssh-rsa AAAAB3nZaYc2AAAABIAWIAAA...

    9.12.9.38 ssh-rsa AAAAB3nZaYc2AAAABIAWIAEAT+5...

    192.9.37 ssh-rsa AAAAB3nZaYc2AAAABIAWIAEAmhB...

    172.22.10.2 ssh-rsa AAAAB3nZaYc2AAAABIAWIAEAT...

    192.168.100.101 ssh-rsa AAAAB3nZaYc2AAAABIAWIAAA...

    192.168.100.200 ssh-rsa AAAAB3nZaYc2AAAABIAWIAAA...

    9.12.637 ssh-rsa AAAAB3nZaYc2AAAABIAWIAEAmt...

    ```'
  merge: -1
  pgno: 74
- img_proc: true
  md: 'Host keys are generated automatically when SSH is installed. Host keys are
    specific to an SSH server and stored in the /etc/ssh directory. Three types of
    keys are supported:


    +   RSA keys for SSH1

    The ssh_host_key and ssh_host_key.pub files contain the respective RSA private
    and public keys host identity used for SSH1.


    +   RSA keys for SSH2

    The ssh_host_rsa_key and ssh_host_rsa_key.pub files contain the respective RSA
    private and public keys host identity used for SSH2.


    +   DSA keys for SSH2

    The ssh_host_dsa_key and ssh_host_dsa_key.pub files contain the respective RSA
    private and public keys host identity used for SSH2.


    To create keys, use the **ssh-keygen** command:


    ```

    ssh-keygen -t type -b 1024 -f /etc/ssh/key-file -N ''''

    ```


    Where:


    | type | Specifies the type of file to create:

    rsa for SSH1 RSA keys

    rsa for SSH2 RSA keys

    dsa for SSH2 DSA keys |


    | key-file | Specifies the private key file:

    ssh_host_key for type rsa

    ssh_host_rsa_key for type rsa

    ssh_host_dsa_key for type dsa |


    The -b option specifies a 1024-bit key length is to be used. The -N option specifies
    an empty passphrase (therefore, the keys are stored unencrypted on the file system).


    > Note: The passphrase is used to encrypt the key files and must be supplied when
    decrypting a key file. Passphrases are not passed across the network.


    Known hosts are added to the list when the client first contacts an unknown host
    and the user opts to accept that server''s public keys, as shown in Example 4-11
    on page 63.'
  merge: -1
