    # # Multilink VPNs


    VPNs are an increasingly critical component of enterprise networks. Trusted communication
    with remote offices or users through the insecure Internet is possible using encrypted
    tunnels to internal networks. Historically, VPN tunnels were subject to failure
    in the event of router or link failures. Often, only one VPN tunnel could be established
    with a remote site, placing bandwidth restrictions on an already limited connection.


    Using StoneGate, clustered, load-balanced IPsec VPN tunnels are now possible.
    A logical tunnel consisting of one or more physical VPN tunnels through different
    ISPs is possible. Figure 6-23 on page 118 demonstrates a VPN consisting of two
    physical links at one end and three at the other. In this example configuration,
    StoneGate can use six different subtunels, forming one virtual VPN tunnel to load
    balance VPN traffic between sites.'
