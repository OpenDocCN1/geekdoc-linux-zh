    # 7.3 Enabling z/OS LDAP native authentication


    To enable LDAP to bind against RACF, native authentication must be configured:


    +   1. Customize the LDAP native authentication schema. Copy the /usr/lib/ldap/etc/NativeAuthentication.ldif
    file to the /etc/ldap directory. Edit the file, changing the line "cn=schema,<suffix>"
    using the suffix defined in your ldap.profile configuration file.

    2. Implement the native authentication schema. Use the command:

    ldapmodify -h 9.12.6.16 -p 3389 -D "cn=LDAP Administrator" -w secret -f \ /etc/ldap/NativeAuthentication.ldif

    3. Enable native authentication in LDAP. Add the following to the TDBM section
    of the LDAP configuration file (ldap.profile):

    useNativeAuth SELECTED

    "nativeAuthSubtree" o=itso

    nativeUpdateAllowed YES'
  merge: -1
  pgno: 157
- img_proc: true
  md: '4. Modify existing users to use native authentication.

    Add the ibm-nativeAuthentication object class and ibm-nativeldif attribute to
    users defined in the schema. We create the nativeupdate.ldif file, as shown in
    Example 7-3, and modify the directory using:


    ```

    ldapmodify -h 9.12.6.16 -p 3389 -D "LDAP Administrator" -w secret -f

    /etc/ldap/nativeupdate.ldif

    ```


    Example 7-3 The nativeupdate.ldif file


    ```

    cn=test1,ou=itso

    changetype: modify

    add: x

    ibm-nativeld: test1

    objectclass: ibm-nativeAuthentication

    ```


    # 7.3.4 Installing Tivoli Access Manager Policy Director on Linux


    The Policy Director requires installation of both the IBM Global Security Toolkit
    and LDAP client, as well as the Tivoli Access Manager packages for Linux and zSeries.
    We install all packages using the standard rpm command, as shown in Example 7-4.


    Example 7-4 Installing Tivoli Access Manager and its prerequisites


    ```

    # rpm -ivh gksBas-0.5-46.s390.rpm \

    ldap-client-4.1.1.s390.rpm \

    PDMg-r-4.1.0-2.s390.rpm \

    PDfRTE-4.1.0-2.s390.rpm

    ```


    This installs the:


    +   * Global Security Toolkit

    * LDAP client

    * Tivoli Access Manager Policy Director

    * Policy Director runtime


    > Note: These packages are distributed as part of Tivoli Access Manager.


    # 7.3.5 Configuring Tivoli Access Manager for Linux


    After a successful installation, we use the pdconfig command to configure the
    Tivoli Access Manager runtime and Policy Director.'
  merge: -1
  pgno: 158
- img_proc: true
  md: '# Configuring the Tivoli Access Manager runtime


    Configure the Tivoli Access Manager runtime to point to the z/OS LDAP server When
    prompted, use the parameters specified in Example 7-1.


    Table 7-1 Tivoli Access Manager runtime configuration parameters


    | Parameter | Description |

    | --- | --- |

    | Registry Selection | The type of remote registry; choose LDAP registry. |

    | LDAP server hostname | The TCP/IP address of the LDAP server. Use the IP address
    or name of the LDAP server running on z/OS. |

    | LDAP server port | The port number of z/OS LDAP server. |


    # Configuring the Tivoli Access Manager Policy Director


    Next, configure the Policy Director using the parameters shown in Example 7-2.


    Table 7-2 Tivoli Access Manager Policy Director configuration parameters


    | Parameter | Description |

    | --- | --- |

    | LDAP administrative user DN | The distinguished name (DN) of the LDAP server.
    In our example, we use LDAP Administrator. |

    | LDAP administrative user password | The password LDAP administrator. The example
    uses secret. |

    | Enable SSL communications | To secure SSL communications, specify yes. In our
    example, we use HyperSockets for secure TCP/IP networking and specify no. |


    +   a. For guidelines about using SSL, refer to Securing Linux for zServers with
    a Central/OS LDAP Server (RACF), REDP-0221, available at: http://www.ibm.com/redbooks/abstracts/redp0221.html


    The configuration is stored in the /opt/PolicyDirector/etc directory in three
    files:


    +   * pd.conf

    * ivmgrd.conf

    * ldap.conf.


    # 7.3. Enabling Linux LDAP user authentication


    To enable LDAP user authentication in Linux, we use the capability provided by
    Name Service Switch (NSS). We configure PAM to use LDAP authentication and then
    configure NSS to point to the z/OS LDAP server.'
  merge: -1
  pgno: 159
- img_proc: true
  md: '# Configuring PAM for LDAP authentication


    Modify the /etc/pam.d configuration file for each service that uses LDAP authentication.
    Example 7-5 illustrates the configuration file used for Telnet login.


    Example 7-5 The /etc/pam.d/login file for LDAP authentication


    ```

    #PAM-1.0

    auth        required pam_nlogin.so

    auth        sufficient pam_unix_auth.so

    auth        required pam_ldap.so        try_first_pass

    account     required pam_localuser.so

    account     required pam_ldap.so

    password    required pam_pwcheck.so      nullock

    password    required pam_ldap.so        use_first_pass use_authok

    password    required pam_unix.so        nullock use_first_pass use_authtok

    session     required pam_unix_session.so

    session     required pam_limits.so

    session     required pam_env.so

    session     optional pam_mail.so

    ```


    These changes include:


    +   1. The pam_unix_auth.so module implements auth type user authentication and
    is capable of supporting NSS. The sufficient control flag ensures success if a
    locally defined (the /etc/passwd file) is authenticated.


    +   2. If auth type authentication against a local does not succeed, the required
    pam_ldap.so module attempts to authenticate using LDAP.


    +   3. The pam_localuser.so module performs account authentication for local users.
    The sufficient control flag ensures success in the event a local user is authenticated.


    +   4. In the event account type authentication does not succeed again against
    a local user, the pam_ldap.so module authenticates against LDAP.


    +   5. The pam_ldap.so module is capable of password update requests against an
    LDAP directory.


    > Tip: Although it is possible to maintain all user information in the remote
    LDAP directory, it is good to define at least one user with superuser authority
    locally. This allows host access in the event LDAP is unavailable.


    Linux users usually have their home directory (typically the /home/userid) created
    when the user ID is defined. When using LDAP authentication, users are remotely
    defined (and have no home directory created on the local'
  merge: -1
  pgno: 160
- img_proc: true
  md: 'host). Two possibilities exist to avoid manual creation of a home directory
    for each LDAP defined user:


    +   - The user home directory can be located on a network file server (for example,
    an NFS-mounted file system).


    +   - The home directory can be automatically created when a user first logs in:


    +   - For login services except SSH, add the pam_mkhomdir.so module to the PAM
    configuration file for the service (/etc/pam.d/login), for example):


    ```

    session required pam_mkhomdir.so skel=/etc/skel umask=0077

    ```


    +   - If a authenticate and no home directory exists, the home directory is created
    in /home. The umask=0077 parameter causes the directory permission to be set to
    700. The home directory is constructed from the skeletal files found in the /etc/skel
    directory.


    +   - Beginning with OpenSSH Version 3.3, automatic creation of a home directory
    using pam_mkhomdir.so is no longer supported due to a security modification in
    SSH. You can use the _home_dir package replacement for pam_mkhomdir.so. The make_home_dir
    package available at:


    http://www.trustsec.de/soft/oss


    # Configuring NSS


    To complete the process, we configure NSS to use LDAP for user and group authentication.
    We modify the /etc/nsswitch NSS configuration file, as shown in Example 7-6.


    Example 7-6 /etc/nsswitch file for LDAP authentication


    ```

    passwd: ldap compat

    group: ldap compat

    shadow: ldap compat

    ```


    Next, we create the /etc/nss_ldap.conf file, as shown in Example 7-7.


    Example 7-7 The /etc/nss_ldap.conf file for LDAP authentication


    ```

    # Your LDAP server. Must be resolvable without using LDAP.

    host 9.12.6.16:3389

    # The distinguished name of the search base

    base=itso

    uri ldaps://9.12.6.16:3389

    ldap_version 3

    ```'
  merge: -1
  pgno: 161
- img_proc: true
  md: 'The base parameter uses the suffix defined to the z/OS LDAP server. The uri
    parameter points to the LDAP server running on z/OS.


    # 7.4 IBM Tivoli Access Manager WebSEAL


    IBM Tivoli Access Manager WebSEAL is a security manager for Web-based resources.
    WebSEAL is a high performance, multithreaded Web server that applies fine-grained
    security policy to the protected Web object space. WebSEAL can provide single
    sign-on solutions and incorporate back-end Web server resources into its security
    policy.


    In addition to authenticating Linux users, we can use WebSEAL in conjunction with
    z/OS to protect Web-based resources. This scenario is depicted in Figure 7-3.


    ![](img/a2760634ecd5eb26c25e81867e88d740_162_0.png)


    Figure 7-3 Authenticating users against a z/OS RACF database


    In this scenario, we use a single Tivoli Access Manager instance. For scalability
    and high availability, several Tivoli Access Manager/Linux instances are required.'
  merge: -1
  pgno: 162
- img_proc: true
