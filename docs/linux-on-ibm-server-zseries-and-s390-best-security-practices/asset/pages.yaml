    databases, you should create at least one backup of the certificates used by the

    management system and firewall engines. Store the certificates in a secure

    location. You can use the option of encrypting them with a password as well.

    Backed-up certificates can be easily restored when needed, for example, when

    y are reinstalling your Management Server on a new computer and you want

    to existing certificates instead of generating new ones.


