  md: '# 5.1 An overview of FreeS/WAN


    SUSE LINUX Enterprise Server Version 8 (SLES8) for zSeries includes

    FreeS/WAN, an open source virtual private network (VPN) implementation based

    on Internet Protocol Security (IPSEC). Details and documentation can be found

    on the FreeS/WAN home page at:


    http://www.freeswan


    > Note: FreeS/WAN is not included in Red Hat distributions.


    IPSEC is a mechanism to authenticate and encrypt IP traffic at the IP level.

    Operating at this level, IPSEC enables transparent authentication and encryption

    for IP-based protocol (for example, FTP and Telnet), FreeS/WAN uses standard

    open protocols for authentication and encryption:


    +   - Internet Key Exchange (IKE) protocol

    IKE provides key exchange and negotiates connection parameters

    - Encapsulating Security Payload (ESP) protocol

    ESP is used to encrypt and authenticate packet payload.


    To illustrate VPN configuration using FreeS/WAN, we create the network

    depicted in Figure 5-1.


    ![](img/a2760634ecd5eb26c25e81867e88d740_91_0.png)


    Figure 5-1 VPN implementation using FreeS/WAN on Linux for zSeries


    78 Linux on IBM @server zSeries and S/390: Best Security Practices'
  merge: -1
  pgno: 91
- img_proc: true
  md: 'We construct an encrypted IPSEC tunnel between Linux LNXSU2 and the redhat2
    Linux server. The tunnel traverses an untrusted, external network connected to
    an OSA-Express adapter. We note:


    +   - The tunnel connects hosts 192.168.100.70 and 192.168.200.101.

    - The IPSEC tunnel endpoints are:


    +   - The LNXSU2 Linux guest at IP address 192.168.100.70 that forms the left
    side of the IPSEC tunnel.

    - The redhat2 Linux host at IP address 192.168.200.101 that forms the right side
    of the IPSEC tunnel.


    +   - The external network simulates a public network (such as the Internet).
    Normally, traffic on this network is unencrypted and visible to any host connected
    to the network. However, tunnel traffic between the two endpoints is encrypted.


    +   - The LNXSU2 Linux guest can route packets from LNXSU4 guest. The LNXSU4 Linux
    guest forwards traffic destined for the external network to the LNXSU2 guest.
    IP forwarding is enabled on the LNXSU2 guest, and the guest acts as a packet filtering
    firewall using the iptables command.


    # 5.1.1 Optimistic encryption


    FreeS/WAN, it is possible to implement a nonstandard VPN mechanism referred to
    as optimistic encryption. Typically, two VPN endpoints are configured in advance
    to exchange public keys for authentication and encryption. With optimistic encryption,
    it is possible for VPN endpoints to authenticate using information obtained from
    the Domain Name System (DNS). This mechanism can reduce administrative overhead
    in configuring IPSEC.


    > Note: Although optimistic encryption has been proposed as an extension to the
    IPSEC protocol, it is a unique feature of FreeS/WAN. In this redbook, we only
    discuss VPN scenarios where FreeS/WAN is configured for specific VPN endpoints.


    # 5.2 Starting FreeS/WAN


    FreeS/WAN is started from the /etc/rc.d/ipsec init script. To enable FreeS/WAN
    at startup, issue the command:


    ```

    # chkconfig -s ipsec on

    ```


    Check that the FreeS/WAN components are running using the ipsec verify command,
    as shown in Example 5-1 on page 80.'
