    # 6.3.5 Secured communication


    The firewall engines, Management Server, and Log Servers authenticate using

    public key cryptography and digital certificates based on Secure Sockets Layer

    (SSL) protocol. This ensures that only authorized nodes and an authorized

    management system can take part in the cluster''s operation and configuration.

    Keys and certificates are automatically generated during installation. An internal

    StoneGate certificate authority (CA) is created automatically when installing
    the

    Management Server.


