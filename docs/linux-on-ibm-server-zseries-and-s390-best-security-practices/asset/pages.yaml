- img_proc: true
  md: '> Important: To ensure a secure z/VM system, always require non-trivial passwords
    on shared minidis; disallow use of the ALL password option. In addition, always
    require password prompting (disallow passwords passed as part of CP commands)
    by disabling the PASSWORDS_ON_COMMANDS feature, as discussed in 2.5.2, “System
    features” on page 15.


    # ### 2.6.6 The LINK statement


    The LINK statement allows a virtual machine to access a minidisk by another virtual
    machine. Read-only or read-write access can be granted. By using the LINK statement,
    you open the door for cross-virtual-machine access. Our recommendation is that
    you exercise extreme care if you decide to use LINK statements to authorize your
    Linux virtual machines to have access to other virtual machines’ minidisks.


    # ### 2.6.7 The DEDICATE statement


    The DEDICATE statement assigns sole ownership of a real device to a virtual machine.
    For tape devices, DEDICATE assigns serial, shared access to the device with other
    virtual machines. A DEDICATED device is owned and controlled by the virtual machine.
    Be selective when dealing real devices to Linux virtual machines.


    # ### 2.6.8 The OPTION statement


    Special characteristics can be assigned to a virtual machine using the OPTION
    statement. Most options give the virtual machine higher authorization than that
    would normally receive. Consult z/VM V4r.0 CP Planning and Administration, SC-264-043,
    for details about the OPTION statement.


    > Note: In keeping with the policy that Linux virtual machines should run with
    no higher than general user authorization, the OPTION statement should not be
    present in the directory entry for a Linux guest.


    # ### 2.6.9 The SPECIAL statement


    The SPECIAL statement is used to define a virtual network interface card (NIC)
    to the virtual machine and connect the NIC to a virtual network (such as a Guest
    LAN segment). For Guest LANs, the SPECIAL statement is equivalent to performing
    the CP DEFINE NIC and COUPLE commands in order to connect the guest to a virtual
    machine. The SPECIAL statement typically connects a virtual machine to a persistent
    Guest LAN.'
