    ```


    ```

    +++++

    +++++

    e is 65537(0x10001)

    Enter PEM pass phrase:********

    Verifying password - Enter PEM pass phrase:

    ```


    This generates keys using 1024 bits. The -des3 option specifies the generated
    private key is to be encrypted using Triple DES. To encrypt the private key, the
    command prompts for a Privacy-enhanced Electronic Mail (PEM) passphrase. This
    value must be used whenever the private key is accessed.


    > Note: Passphrases can be encrypted using DES (-des), Triple DES (option -des),
    or IDEA (option -idea). If none of these options are supplied, the generated private
    key is stored unencrypted.


    Public and private keys can be displayed by using the openssl rsa command, as
    shown in Example 4-2.


