  md: "# 2.1 zSeries and zVM system integrity\n\nWe begin by first examining integrity\
    \ features offered by running Linux guests under zVM. If we consider Linux executing\
    \ in an LPAR (that is, native mode without zVM), it is very much a pure Linux\
    \ environment. However, Linux benefits from the inherent values of the z-Architecture\
    \ itself:\n\n+   - The isolation between LPARs ensures as secure environments\
    \ as executing on physically separate servers, certified by Evaluation Assurance\
    \ Levels (EAL) 5 Common Criteria.\n- zVM can access zSeries-unique hardware features\
    \ such as:\n  - HiperSockets™\n  - zSeries I/O devices such as OSA cards and FICON®\
    \ channels\n  - zSeries specialized cryptographic hardware\n\n+   - Extremely\
    \ high availability of the hardware platform.\nMean-Time-Between-Failure (MTBF)\
    \ is estimated to be more than 30 years, unique in the industry.\n\nThis section\
    \ addresses the unique security and integrity benefits zVM adds to Linux. In this\
    \ context, system integrity refers to the ability to run multiple systems on a\
    \ single physical zSeries server and to ensure that one system cannot compromise\
    \ the operation of any other system.\n\nTwo levels of system integrity are enforced\
    \ when running on zSeries:\n\n+   - Integrity at logical partition level\nEach\
    \ logical partition (LPAR) is isolated from all other LPARs.\n- Integrity provided\
    \ by z/VM\nEach virtual machine (guest) running under z/VM is isolated from all\
    \ other z/VM guests.\n\nSystem integrity provided by both z/VM and zSeries ensures\
    \ Linux guests isolated from all other operating systems and guests running on\
    \ the same physical zSeries server.\n\n# 2.1.1 LPAR integrity\n\nThe ability to\
    \ partition the zSeries Central Processing Complex (CPC) into multiple LPARs is\
    \ provided by the Processor Resource/System Manager (PR/SM™). PR/SM is a hardware\
    \ facility that enables sharing resources across LPARs. It is the Start Interpretive\
    \ Execution (SIE) instruction that enables switches between LPARs. When a context\
    \ switch occurs between LPARs, the current state of the LPAR is saved. All resources\
    \ are cleared or reset before"
  merge: -1
  pgno: 21
- img_proc: true
  md: 'control is passed to another LPAR. When returned to an LPAR, the saved state
    of the LPAR is restored before execution of the SIE instruction.


    System memory is always dedicated to a specific LPAR. PR/SM performs dynamic address
    translation when a context switch occurs between LPARs. Because address is a hardware
    feature, this ensures that software running in one LPAR cannot access or compromise
    an address space in a different LPAR. It is possible to reconfigure LPAR memory
    allocation. However, memory is cleared before it is reassigned to another LPAR.


    > Note: Details about the interpretive execution architecture can be found in
    "ESA/390 interpretive-execution architecture, foundation for VM/ESA," by D. L.
    Osisek et al., available at:


    ```

    http://www.research.ibm.com/journal/sj/301/ibmjs301E.pdf

    ```


    # LPAR security certification


    PR/SM for the IBM @Server Z900 has achieved Common Criteria for Information Security
    Evaluation EAL5 level certification. This provides a high degree of assurance
    that operating systems running in different LPARs on the z900 are isolated from
    each other. SUSE LINUX Enterprise Server 8 with Service Pack 3 has achieved Controlled
    Access Profile compliance under the Common Criteria (referred to as CAPP/EAL3+).
    For more information, see:


    ```

    http://www.ibm.com/servers/eserver/zeries/security/certification.html

    ```


    # 2.1.2 Integrity by the zVM Control Program


    The z/VM Control Program (CP), the hypervisor, is primarily a real-machine resource
    manager. The CP provides each user with an individual working environment known
    as a virtual machine. Each virtual machine is a functional equivalent of a real
    system, sharing the real processor function, storage, console, and input/output
    (I/O) device resources. When you first log on to z/VM, the CP controls the working
    environment. Many of the facilities of z/VM are immediately available to you.
    For example, you can use the CP commands to do various system management tasks.
    Most of the work done on z/VM requires the Conversational Monitor System (CMS)
    or a guest operating system, such as z/OS, to help with data processing tasks
    and manage work flow. The CP provides connectivity support that allows application
    programs to exchange information with each other and to access resources residing
    on the same z/VM system or on different z/VM systems.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '> **Note:** For details about running virtual machines under z/VM, consult
    z/VM V4R.0 Virtual Machine Operation, SC24-6036, and z/VM V4R.0 Guest Operating
    Systems, SC24-5997.


    In the same manner as the SIE instruction enables context switches between LPARs,
    the CP uses the SIE instruction when dispatching virtual machines. When dispatched,
    a virtual machine runs until its time slice expires, or until it executes an instruction
    that cannot be visualized (for example, an I/O instruction). At that time, control
    returns to the CP. The CP then executes instructions on behalf of the virtual
    machine, or dispatches another virtual machine. This mechanism enables the CP
    to limit many software or hardware failures encountered when running on the real
    processor. If the error is isolated to a virtual machine, only that virtual machine
    fails without affecting either the CP itself or any virtual machine running under
    z/VM.


    # z/VM security certification


    In press release issued by SuSE and IBM on August 5, 2003, “IBM and SuSE Earn
    First Security Certification of Linux,” IBM makes the following statement:


    In addition to IBM''s ongoing commitment to accelerate the development and certification
    of Linux, the company will continue to invest in ongoing certifications for new
    and existing IBM products. Common Criteria certification is anticipated for z/VM
    in the upcoming year, with IBM''s suite of middleware products on Linux. IBM Directory
    has just completed evaluation under the Common Criteria, WebSphere Application
    Server and Tivoli Access Manager are currently undergoing evaluation, and several
    other Software Group products are being prepared to enter the process.


    # 2.2 zSeries network security


    zSeries networking facilities offer a unique security advantage. Queued direct
    input/output (QDIO) architecture uses direct memory access (DMA) to transfer network
    from the address space of the sender to the address space of the receiver. For
    HyperSocket networks means that network traffic cannot be “sniffed” by third parties
    (other z/VM guests or other LPARs). For OSA-Express, network traffic is moved
    directly to to//from the adapter to the address space of the sender/receiver.
    For details about zSeries networking, see z24-6816, available at:


    ```

    http://www.ibm.com/redbooks/abstracts/sg246816.html

    ```'
