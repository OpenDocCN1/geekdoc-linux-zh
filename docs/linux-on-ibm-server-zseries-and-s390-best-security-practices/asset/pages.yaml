    \ any operand to the /usr/sbin/apachect1 command.\n\n+   4. Privilege specification\
    \ indicates which users are authorized to execute what commands:\n   - The sudo\
    \ reserved word ALL indicates that the root user is authorized to execute any\
    \ command, as any user, on any host under sudo."
