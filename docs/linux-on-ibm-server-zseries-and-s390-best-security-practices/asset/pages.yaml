    In this chapter, we examine options for creating a more secure Linux installation.
    We use the term hardening to indicate processes and procedures taken to reduce
    the likelihood of system compromise. Topics discussed include:


    +   - Linux system logging

    - Pluggable Authentication Modules

    - Delegating superuser authority with sudo

    - Securing Internet services with TCP_wrappers

    - Securing Linux using Bastille'
