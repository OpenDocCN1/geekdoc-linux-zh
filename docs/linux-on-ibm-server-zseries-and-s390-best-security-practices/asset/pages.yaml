  md: '# ### 6.4.2 Benefits of multilink technology


    The advantages of StoneGate''s multilink technology include:


    +   - More secure networks

    There are fewer possibilities for traffic to bypass firewalls through other network
    devices.


    +   - Less complicated networks

    The firewall takes care of the load balancing (eliminating the need for special
    load re-directors, switches, or other devices that might introduce single point
    of failure). The time and cost required for network maintenance and configuration
    is reduced.


    Multilink technology simplifies the use of multiple ISPs and increases the availability
    and bandwidth at use for critical applications. Transactions load-balanced routing
    always select the optimal route to a destination.


    # ### 6.4.3 Applying multilink technology


    Multilink technology can be applied in three unique scenarios:


    +   - Outbound traffic management

    - Multilink VPNs

    - Inbound traffic management


    Each scenario handles high-availability and load balancing differently.


    # #### Outbound traffic management


    Outbound traffic management in StoneGate provides both high availability and load
    balancing between multiple NetLinks. Load balancing between ISPs increases overall
    network throughput. For each connection request, StoneGate firewall can select
    the fastest route for the connection. Figure 6-22 on page 117 illustrates outbound
    traffic management decisions, using the round trip time of the first SYN packet
    as the basis for the load-balanced routing decision.'
