  md: 'deny access to the system. When enabled, pam_nlogin.so checks for the existence
    of the /etc/nologin file. If found, pam_login.so denies access and displays the
    contents of the file to the user. An alternate nologin file can be specified by
    supplying the file=pathname PAM argument.


    > Note: The nologin mechanism does not affect superuser login. Superusers can
    log even if the /etc/nologin file exists.


    # ### 3.2.4 Mandatory access control


    Currently, Linux relies on a Discretionary Access Control (DAC) mechanism when
    granting access to system objects (such as files and directories). With DAC, user
    authorization is based solely user identity and file ownership. In a DAC environment,
    there are only two types of users:


    +   * Normal users

    * Superuser


    This model is referred to as discretionary, because individual users have the
    ability to specify authorization to files that they own. In addition, a user can
    delegate permission to change access control. Programs executed by a user inherit
    permissions granted to the user and are free to change access to the user''s files.
    This can create a security hole for malicious software.


    The preferred security mechanism for enterprise computing is Mandatory Access
    Control (MAC). In a MAC environment, users cannot specify access control to the
    objects they own. Instead, file and directory authorization is granted based on
    a system policy. Each user has a role defined by the system security administrator,
    and file access is granted on that role. Roles are enforced at the kernel level
    and cannot be circumvented by users.


    # ### 3.2.5 Linux Security Module (LSM)


    This section contains an edited excerpt from "Linux Security Modules: General
    Security Support for the Linux Kernel," by Chris Wright et al., in 2002 USENIX
    Symposium, available at:


    ```

    http://www.usenix.org/events/sec02/wright.html

    ```


    At the Linux Kernel 2.5 summit in 2001, the National Security Agency (NSA) presented
    their work on Security-Enhanced Linux (SELinux), an implementation of a kernel-based
    access control architecture. Linux Torvalds appeared to agree that a general access
    control framework was needed, but favored a more general approach that should
    be:


    +   * Generic (security models implemented as loadable modules)'
