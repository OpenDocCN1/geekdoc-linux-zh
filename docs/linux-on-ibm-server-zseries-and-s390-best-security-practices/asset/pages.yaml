    # 3.3.2 Using the sudo command


    Sudo is invoked using the sudo command. In Example 3-5, we see user1 is not

    normally authorized to execute the /usr/sbin/apachectl command. Using the sudo

    command, however user1 is granted authorization to execute the command.


    Example 3-5 Executing the sudo command


    ```

    $ /usr/sbin/apachectl configtest

    Ouch! ap_mm_create(104856, "/var/lib/httpd/mn.4071") failed

    Error: MM:core: failed to open semaphore file (Permission denied): OS: No such
    file or *

