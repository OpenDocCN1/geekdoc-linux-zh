  md: '# warning notice

    info

    debug


    Warning message

    Normal message

    Informational message

    Debug message


    The action indicates where syslog is to direct incoming messages. Syslog can report
    messages to a:


    +   - Log file

    Action specifies the log file name. Typically, the /var/log/messages file is specified
    for all syslog messages. If a file name is prefixed with a “-” character, syslog
    will not sync the file after each write.


    +   - Remote host

    Action can specify a remote host name or IP address. In this case, the “@” precedes
    the IP address or host name. Log messages are then directed to the syslog running
    on that host. We discuss logging to a remote host in 3.1.2, “Using a central log
    server” on 30.


    +   - Console

    To log to the console, specify /dev/console as the action.


    +   - Logged on user

    To log messages to a user, specify the user name as the action. A list of users
    can be specified (each user name separated by a comma, “”) the action is specified
    as “\*\”, log messages are directed to all users.


    +   - Named pipe

    To direct log messages to a named pipe, specify the “|” prefix before the pipe
    name.


    Example 3-1 illustrates a sample syslog configuration file.


    Example 3-1 Sample /etc/syslog.conf file


    ```

    # /etc/syslog.conf Configuration file for syslog(8)

    # Print most on /dev/console

    kern.*;warn;news.emerg;mail.alert;authpriv.none    /dev/console

    # all email-messages in one file

    mail.*                               /var/log/mail

    # Warnings in one file

    .*=warn;.*=err                               /var/log/warn

    # save the rest in one file

    .*;mail.none;news.none                             /var/log/messages

    # Log to a remote host

    .*                                     192.168.10.1

    ```'
