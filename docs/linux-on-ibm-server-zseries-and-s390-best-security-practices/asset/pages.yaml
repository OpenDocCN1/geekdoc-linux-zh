  md: '# Specifying user passwords


    The user password field specifies the one to eight character password required
    at logon. Special password options can be specified in the password field:


    +   - NOLOG

    Specifying a password value of NOLOG prevents the user from logging on. NOLOG
    virtual machines are useful for managing shared VM resources. For example, assigning
    shared minidis to a virtual machine that cannot log on is a mechanism to easily
    identify these minidisk.


    +   - NPASS

    If specified, the NPASS option allows the user to log on without providing a password.


    > Important: NPASS virtual machines should be considered a security exposure and
    should not be permitted in the VM directory.


    If an ESM (such as RACF for z/VM) is installed, passwords might still be required
    if the NOPASS password option is specified.


    +   - AUTOONLY

    The AUTOONLY password option specifies that the virtual machine can only be logged
    on using the CP XAUTLOG command. Terminal logons are disabled.


    +   - LBYONLY

    The LBYONLY password option specifies that the virtual machine can only be logged
    on by a surrogate user. A surrogate user is another VM user entitled to log on
    this virtual machine.


    To on as a surrogate user, use the CP LOGON command specifying the BY (where the
    BY operand is the surrogate user ID). When prompted, the surrogate user must specify
    their specific password, not the password of the logon virtual machine. An LBYONLY
    virtual machine must have at least one surrogate user defined, as discussed in
    2.6.4, “The LOGONBY statement on page 23.


    > Note: Using the LBYONLY option, it is possible for many VM users to access to
    a common virtual machine without sharing passwords. With journaling enabled, it
    is possible for a system administrator to audit access.


    # Specifying privilege class


    Virtual machine privilege class is assigned to the USER statement. Up to 32 single
    characters can be specified (each representing a defined command privilege class,
    as discussed in 2.4, “CP privilege classes” on page 13).'
  merge: -1
