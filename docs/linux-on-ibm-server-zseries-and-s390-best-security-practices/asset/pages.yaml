    # 4.8 Secure tunneling using port forwarding


    SSH provides the ability to create a secure TCP tunnel using a feature know as
    port forwarding. With port forwarding, client/server applications communicate
    over a normally unencrypted network using an SSH tunnel. The tunnel transparently
    encrypts data exchanged between the application client and server.


    > Note: Port forwarding is available only to TCP socket protocol applications.
    Be aware that port forwarding is only possible if an SSH server is running on
    both the client and application server machines.


    # 4.8.1 Local port forwarding


    With local port forwarding, an SSH tunnel is initiated from the client host. SSH
    then binds to a port on the local host. Connections to this port are proxied over
    the SSH tunnel to the SSH server running on the remote host (where they are passed
    to the application server). The concept is illustrated in Figure 4-2 on page 67.'
  merge: -1
  pgno: 79
- img_proc: true
  md: '| remote server | local client |

    |--- | --- |

    | 192.168.2.1 | 192.168.1.1 |

    | SSH server | SSH tunnel | SSH client |

    | | initiated | |

    | server | client |


    Figure 4-2 Local port forwarding to a remote server


    As a simple example, consider echo server running on the 192.168.2.1 host. The
    server could be accessed directly from Telnet client running on the 192.168.1.1
    host, but this requires cleartext data to be passed over the network.


    > Note: An echo server typically runs under inetd control. It listens on TCP port
    7, and simply returns the data it is sent. The Telnet client can connect to an
    echo server by specifying the echo port number. Use the command:

    telnet 192.168.2.1 7


    To encrypt network traffic over the SSH tunnel, we use local port forwarding.
    on the 192.168.1.1 host, we issue the command:


    ```

    ssh -L 4321:localhost:7 192.168.2.1

    ```


    The -l options specifies port 4321 on the local client is be forwarded to port
    7 on the remote server. The command logs on the remote server and tunnel remains
    open as long as the SSH connection is in place. To access the echo server over
    the SSH tunnel, we simply connect to the 4321 port on the 192.168.1.1 host (from
    another command terminal). We illustrate this procedure in Example 4-13 on page
    68.'
