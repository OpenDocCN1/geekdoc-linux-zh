  md: "Note: If you repeatedly enter an incorrect password, you might get an error:\n\
    \nError: This account has been temporarily locked out due to too many failed login\
    \ attempts.\n\nObtain the correct password, wait five minutes for the lock to\
    \ clear, and then restart the pdconfig command.\n\n+   6. You are prompted to\
    \ enable SSL communication between the WebSEAL server and the LDAP server. Type\
    \ y (yes) or n (no) to enable SSL communication between the Access Manager server\
    \ and the LDAP server:\n  Do you want to enable SSL communication between the\
    \ Access Manager server and the LDAP server (y/n) [Yes]?\n\n> Note: In this redox\
    \ we do not use SSL, because we are connecting to z/OS using an Internal HyperSocket.\
    \ For additional security, you can use SSL to encrypt all network traffic (even\
    \ on an internal network). Refer to Securing Linux for zSeries with a Central\
    \ z/OS LDAP Server (RACF), REDP-0221 for a full description and guidelines about\
    \ how to encrypt the LDAP communication between your Linux virtual machines and\
    \ the z/OS.\n\nThe WebSEAL configuration is stored in the /opt/pdweb/etc/webseal.conf\
    \ file. To use Tivoli Access Manager WebSEAL as a security front end requires\
    \ the creation of a junction (a specification to redirect Web requests to another\
    \ URL). Junctions are created using the pdadmin command.\n\nIf your back-end application\
    \ servers are configured for high availability, WebSEAL junctions are configured\
    \ to point to several hosts. To assure unified service, these hosts should be\
    \ configured with exactly the same services.\n\n# 7.4.2 Creating the WebSEAL junctions\n\
    \nUsing the pdadmin command, we define two WebSEAL junctions:\n\n+   - One connects\
    \ to the WebSphere HTTP-catcher (port 9080).\n- One connects to the WebSphere\
    \ administration server (port 9090).\n\nExample 7-11 on page 152 illustrates the\
    \ process to create the two junctions."
