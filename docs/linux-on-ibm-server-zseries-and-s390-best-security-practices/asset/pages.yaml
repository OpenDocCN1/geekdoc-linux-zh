    # # Introduction


    In this chapter, we provide an introduction to security concepts. We discuss:


    +   - Security goals

    - Elements of security

    - System installation and backup'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# 1.1 Security goals


    Strictly speaking, no computer system can be considered absolutely secure. The
    primary goal for a security administrator is to establish policies and procedures
    that minimize risk to a computer system to an acceptable level. To determine the
    acceptable risk level, it is important to understand:


    +   - What needs to be protected

    Higher security measures (such as encryption and strong authentication) are required
    to protect highly sensitive data.


    +   - What components are vulnerable

    Systems connected to public networks (such as the Internet) are inherently at
    more risk than systems connected to a secured intranet.


    +   - What steps can be taken to reduce the risk

    A risk assessment considers assets requiring protection and the vulnerabilities
    to those assets. From the risk assessment, appropriate policies can be developed
    to minimize security risk.


    # 1.1.1 Security policy


    The first step to secure a system is to establish a security policy. The security
    policy defines access methods to system objects. It details the privileges assigned
    to users and processes. In addition, the policy should define the mechanism for
    users to acquire access to higher privileges (for example, in emergencies or for
    control access). Components of a security policy can include:


    +   - Acceptable use

    - User accounts and authentication

    - Access control

    - Network control

    - Encryption

    - Logging and accounting

    - Intrusion detection


    In general, the cost of protecting an assets should not be higher than the cost
    of recovering the assets (the threat become reality). A security policy should
    change with technology and cover all components of security. Figure 1-1 on page
    3 illustrates the basic principle of security.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Security Policy


    ![](img/a2760634ecd5eb26c25e81867e88d740_16_0.png)


    Figure 1-1 Security principles


    The security policy relies on security administration and monitoring. Over time,
    a security policy can change as new administration tools and principles are put
    in place, or as security monitoring reveals new or unforeseen vulnerabilities.


    # 1.2 Elements of security


    In this section, we examine some of the security aspects to consider when developing
    a security policy.


    # 1.2.1 Physical security


    The first and most important element to consider is the security and integrity
    of physical locations from which the system can be accessed. Any security procedure
    or process can be subverted if an attacker gains access to the system console.
    At a minimum, access to the physical system should be restricted to authorized
    personnel (using badge access, for example). Entry into the restricted areas should
    be monitored and tracked.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# 1.2.2 System security


    Procedures should be in place limit and monitor user access to the system.

    Some suggested procedures include:


    +   - Authenticate users from a central repository (such as LDAP or RACF) to lower
    maintenance overhead.


    +   - Maintain user password standards and expiration policies.


    +   - Limit the number of users authorized to access the system.


    +   - Limit the number of running services.


    +   - Install and upgrade RPM packages from trusted sources.


    +   - Logging to a central log server and log all system accesses.


    +   - Apply recommended security patches to Linux hosts.


    +   - Restrict the number of hosts running X Windows.


    +   - Do not allow programming languages and compilers on production machines.


    +   - Include the acceptable use policy as part of the system logon secure.


    # 1.2.3 Network security


    Securing network access is critical for hosts connected to a public network. However,
    it is equally important to secure networks on internal, corporate networks. Typically,
    the majority of network security incidents originate from within an internal network.
    Some points to consider:


    +   - For trusted hosts, a firewall. Access to these hosts should be limited.
    Examples of untrusted hosts include:


    +   - Hosts on the demilitarized zone (DMZ)

    - Hosts on external networks

    - Hosts for vendor systems


    +   - The number of trusted hosts should be limited and tightly monitored. Examples
    of trusted hosts include:


    +   - Hosts within an internal or corporate network

    - Hosts accessed over a virtual private network


    +   - Remote connections should be encrypted with a industry-approved encryption
    algorithm equal to or exceeding 1024 bits.


    +   - Use server certificates for secure HTTP traffic.


    +   - Access to security servers (such as a firewall or log server) should be
    strictly limited to authorized security personnel.'
