  md: '# 4.8.4 Implications of options for port forwarding


    SSH port forwarding has several implications and effects a Linux administrator
    should be aware of.


    # Choosing a forwarded port number


    When choosing a port on the local host to forward, remember that superuser authority
    is required to bind to port numbers less than 1024. Select a port number that
    is not used by an existing server (and will not be used in the future).


    # Bypassing a firewall


    Port forwarding is a mechanism that allows firewall rules to be bypassed. Consider
    an example where firewall rules allow SSH to pass (using the default port 22)
    and deny access to another protocol (IMAP on port 143, example). With port forwarding,
    it is possible for a non-privileged user to establish a forwarded connection to
    an IMAP server through the firewall (and possibly violate a security policy).
    There can be circumstances where using port forwarding to bypass a firewall is
    a legitimate practice. Some control can be imposed on port forwarding by adding
    AllowTCPForwarding no to the /etc/ssh/sshd_config file.


    > Note: Disallowing TCP forwarding is not sufficient to prevent port forwarding
    (knowledgeable users can still install their own forwards). To prevent forwarding,
    SSH users should be denied shell access (see 4.5.2, "SSH access control") on page
    63).


    # Constructing an SSH tunnel in the background


    When creating the SSH tunnel, the ssh command normally runs a shell on the remote
    machine in the foreground. It is possible to run the shell in the background (and
    therefore use the terminal session). To create a background tunnel, use the -f
    -N options for example:


    ```

    ssh -f -N -L 4321:localhost:7 192.168.2.1

    ```


    # Terminating a forwarded port


    The SSH tunnel is terminated by logging out from the remote shell. If the tunnel
    has an active forwarded connection, and you log out from the remote shell, SSH
    sends itself into the background (maintaining the forwarded connection). In this
    case, the logout from the remote shell occurs when the forwarded connection completes.


    > Note: Use the kill command on the tunnel SSH process to terminate a background
    SSH tunnel.'
