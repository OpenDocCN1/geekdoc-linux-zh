  md: '# Example 3-2 The default /etc/pam.d/login configuration for SLES6


    ```

    #%PAM-1.0

    auth required pam_unix2.so    nullok #set_secprpc

    auth required pam_security.so

    auth required pam_nologin.so

    auth required pam_mail.so

    account required pam_unix2.so

    password required pam_pwcheck.so nullock

    password required pam_unix2.so nullock use_first_pass authok

    session required pam_unix2.so    none # debug or trace

    session required pam_limits.so

    ```


    PAM modules in this example allow for:


    +   1. Standard UNIX password checking is provided by pam_unix2.so. The pam_unix.so
    module supports all PAM modules types (auth, account, and session). Password checking
    for pam_unix2.so depends on the contents of the /etc/nsswitch.conf file

    \When used as a password module type, pam_unix2.so can require users to change
    expired passwords. Its actions are determined by the following arguments:


    * The nullock argument permits changing an empty password (normally, empty passwords
    cause an account to be locked)

    * The use_first_pass argument locks the selection of the old and new password
    to the ones established by the previous stacked module (in this case, pam_pwcheck.so).

    * The use_authok argument sets the new password to the value by the previous stacked
    module (again, pam_pwcheck.so in this example).


    When used as a session module type, pam_unix2.so logs the user and service type
    to syslog at the beginning and end of the session.


    +   2. Superuser login is restricted to secure terminals. The pam_security.so
    module enables superuser login to be limited to secure terminals. This is discussed
    in 3.2.2, "Limiting superuser login to secure terminals" on page 35.


    +   3. Normal users can be denied login access. The pam_nologin.so module supports
    auth and account PAM module types and is discussed in 3.2.3, "Restricting user
    login" on page 35.


    +   4. Mail notification can be sent using PAM. The pam_mail.so module only supports
    the auth module type. It provides the "You have new mail" service to the user.
    It also sets the MAIL environment variable to the user''s mail directory.'
