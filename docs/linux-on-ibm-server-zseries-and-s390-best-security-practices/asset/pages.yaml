  pgno: 24
- img_proc: true
  md: 'design and coding guidelines a formal part of the design and development process.


    Because it is not possible to certify that any system has perfect integrity, IBM
    continues its efforts to enhance the integrity of z/VM and to respond promptly
    when exposures are identified. IBM will accept APARs that describe:


    +   - z/VM system integrity exposure


    +   - Exposures to system integrity caused by a program running in a virtual machine,
    provided the problem has not been introduced by a customer-controlled authorization
    mechanism


    # z/VM system integrity definition


    z/VM system integrity ensures that an authorized virtual machine cannot:


    +   - Circumvent or disable Control Program real or auxiliary storage protection.


    +   - Access resources protected by RACF. Protected resource can include virtual
    machines, minidisks, and terminals.


    +   - Access a Control Program password-protected resource.


    +   - Obtain control in real supervisor state, or with privilege class authority
    greater than those it is assigned.


    +   - Circumvent system integrity of any other z/VM guest.


    With real storage protection, a virtual machine is isolated from all other virtual
    machines. The CP accomplishes this using:


    +   - Dynamic Address Translation (DAT) implemented at the hardware level


    +   - The Start Interpret Execution instruction


    +   - The Set Address Limit facility


    With auxiliary storage protection, the CP ensures that a virtual machine cannot
    access a minidisk or virtual disk (VDISK) to which it is not authorized. This
    protection is implemented using channel translation.


    # Customer responsibility


    Although protection of the customer''s data remains the customer''s responsibility,
    data security continues to be an area of vital importance to IBM. The IBM commitment
    to z/VM system integrity (as described in this text) represents a significant
    step to help customers protect their data.


    > Note: For more information about z/VM security and integrity, refer to z/VM
    V4R4.0 General Information, GC24-5991.'
