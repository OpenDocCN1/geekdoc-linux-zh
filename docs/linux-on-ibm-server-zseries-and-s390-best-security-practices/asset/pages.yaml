  md: '+   - Conceptually simple, minimally invasive, and efficient

    - Able to support existing POSIX.1e capabilities as a loadable module


    Based on these principles, the Linux Security Modules (LSM) project was created.
    LSM is a general purpose, access control framework for the Linux kernel that implements
    access control mechanisms as loadable kernel modules. LSM support is available
    in the 2.6 kernel (announced in July 2003). A number of existing access control
    implementations (including SELinux) have adapted the LSM framework. LSM architecture
    mediates access to internal kernel objects (for example, tasks, inodes, and open
    files) using kernel hooks, as shown in Figure 3-2.


    ![](img/a2760634ecd5eb26c25e81867e88d740_50_0.png)


    With LSM, user processes execute system calls traversing existing kernel logic.
    However, before a kernel object is accessed, an LSM module must first grant access.


    > Note: There are no current plans to support LSM in Linux for 2Series.


    # 3.3 Delegating superuser authority with sudo


    Sudo is an open source security tool distributed with SLES8 that enables administrators
    to delegate authority to specific commands. The sudo home page is located at:


    ```

    http://www.courtesan.com/sudo

    ```'
  merge: -1
  pgno: 50
- img_proc: true
  md: 'With sudo, the system administrator can allow non-privileged users to execute
    commands that would normally require higher authorization. The benefits of using
    sudo include:


    +   - Delegation of administrative tasks.

    Authorization to specific privileged commands can be delegated based on the role
    assigned to a non-privileged user.


    +   - Sharing passwords is not required.

    When a sudo-authorized command is executed, the non-privileged user is prompted
    for their own password (not the root password).


    +   - Commands executed under sudo are logged.

    In addition to logging incorrect password attempts, sudo logs all command executions
    (thus creating an audit trail).


    +   - Commands can be authorized to execute under any user (not just root).

    This allows administrators to finely control command authorization.


    +   - Configuration is centralized.

    A single configuration file can manage sudo authorization for both local and remote
    hosts.


    > **Important:** Caution should be exercised when delegating authority. It is
    possible to introduce security vulnerabilities using sudo (as discussed in 3.3.4,
    "Security considerations with sudo" on page 42).


    # 3.3.1 Configuring sudo


    The /etc/sudoers file is used to configure sudo. This file should be writable
    by root and must be edited using the **visudo** command.


    > Note: The **visudo** command ensures that the /etc/sudoers file is safely edited.
    If more than one editor attempts to open the file, the visudo command will fail:


    ```

    # visudo

    visudo: sudoers file busy, try again later.

    ```


    The /etc/sudoers file contains three types of entries:


    +   - Aliases

    Aliases are name/value pairs in the form:


    ```

    Alias_type = item1, item2, ...

    ```


    Four types of aliases are recognized:


    +   - Host_Alias

    Aliases specify host names, IP addresses, or network addresses.'
  merge: -1
  pgno: 51
- img_proc: true
  md: '+   - User_Alias

    User aliases specify users or group names or numeric IDs.


    +   - Cmnd_Alias

    Command aliases specify commands to execute.


    +   - Runas_Alias

    Run as aliases specify a user under which to execute commands.


    +   ▶ Defaults

    Configuration options can be overridden from their default values using the

    Defaults specification.


    > **Tip:** To see the default configuration options, execute the `sudo -V` command
    as root.


    +   ▶ User privileges

    The user privileges specification defines which users are authorized to

    execute specific commands.


    Users privileges are specified by lines of the form:


    ```

    `user-spec host-spec = (runas-spec) cmd-spec`

    ```


    Where:


    | user-spec | Specifies users to be granted authorization. User name, group name,
    and User_Alias specifications are accepted. |

    | host-spec | Specifies the hosts on which authorization is to be permitted. Host
    name, IP addresses, and Host_Alias specifications are accepted. |

    | runas-spec | Specifies the user ID with to execute the command. User name and
    Runas_Alias specifications are accepted. By default, commands are executed by
    root sudo. |

    | cmd-spec | Specifies a command list. Commands and Cmnd_Alias specifications
    are accepted. |


    > **Note:** The /etc/sudoers file grammar has extensive regular expression and
    wildcard expansion capabilities. Details can be found in the man page for sudoers.


    To illustrate sudo configuration, we consider the /etc/sudoers file shown in

    Example 3-4 on page 40.'
  merge: -1
  pgno: 52
- img_proc: true
  md: "# Example 3-4 The /etc/sudoers file\n\n# sudoers file.\n# This file MUST be\
    \ edited with the 'visudo' command as root.\n# See the sudoers page for the details\
    \ on how to write a sudoers file.\n\n+   # Host alias specification\nHost_Alias\
    \ SUBNET1=172.22.10.0/255.255.255.0\n# User alias specification\nUser_Alias NETADMIN=user1\n\
    User_Alias HTTPCMDS=user2\n# Cmd alias specification\nCmd_Alias NETCMDS=/sbin/ifconfig\
    \ hsi2 *\nCmd_Alias HTTPCMDS=/usr/sbin/apachectl1\n# Defaults specification\n\n\
    +   # User privilege specification\nroot ALL=(ALL) ALL\nNETADMIN SUBNET1-NETCMDS\n\
    HTTPCMDS ALL=HTTPCMDS\n\nThis configuration file specifies:\n\n+   1. Define a\
    \ host alias specifications based on network subnet assignment\n   - SUBNET1 specifies\
    \ all host on the 172.22.10.0 network.\n\n+   2. Define two user aliases:\n  \
