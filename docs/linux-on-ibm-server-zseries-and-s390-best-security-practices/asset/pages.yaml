- img_proc: true
  md: '# 7.3 Authentication using IBM Tivoli Access Manager


    In this section, we discuss using Tivoli Access Manager for Linux user authentication
    against users defined to RACF running in a z/OS LPAR. The scenario is illustrated
    in Figure 7-2.


    ![](img/a2760634ecd5eb26c25e81867e88d740_153_0.png)


    Figure 7-2 User authentication using Tivoli Access Manager


    In this scenario, network clients (such as Telnet and SSH) are authenticated against
    users defined to an LDAP directory running on z/OS. Linux users are defined in
    the LDAP directory (stored in DB2®) on z/OS. However, no user passwords are stored
    in the LDAP directory. Instead, password authentication is'
  merge: -1
  pgno: 153
- img_proc: true
  md: 'performed against user passwords stored in RACF on z/OS. Using the capabilities
    provided by PAM (discussed in 3.2, “Pluggable Authentication Modules” on page
    31), we outline the procedure to enable Linux users against LDAP on z/OS.


    > Note: This procedure is similar to the steps outlined in Securing Linux for
    zSeries with a Central z/OS LDAP Server (RACF), REDP-0221. Using Tivoli Access
    Manager enables users to change their passwords from Linux with the passwd command.


    # ### 3.3.1 Configuring LDAP on z/OS


    We begin configuring LDAP on z/OS using the 1dapcnf utility:


    +   1. Create a new LDAP configuration file.

    Copy the /usr/lpp/etc/ldap.profile file to a working directory such as /etc/ldap.


    +   2. Customize the ldap.profile file for your system.

    Use the comments in the configuration file to determine appropriate values.


    > Note: Some attributes in the ldap.profile file are required, but have no default
    value. Be sure to examine the entire file and assign values to all required variables.
    In “LDAP configuration parameters” on page 142, describe several important parameters.


    +   3. Run the 1dapcnf command from z/OS UNIX.

    This generates a set of jobs in the MVS™ data set defined in the ldap.profile
    file.


    +   4. Add the LDAP server started task to the system procbl.

    Copy the LDAP server started task procedure from the output data set into the
    system procbl. The default name for the LDAP started task is LDAPSRV.


    +   5. Copy the PROXXX to the system parmlib.


    +   6. Start RACF and its associated tasks.

    Each job in the following sequence:

    a. RACF.

    b. APF.

    c. DBCLI (ensure DB2 is started before submitting this job).

    d. PGRMCTRL (if required).


    Remember to check for a successful return code in each case.


    +   7. Start the DBSPUFI task.

    Use DB2 SPUFI to submit the job.'
  merge: -1
  pgno: 154
- img_proc: true
  md: '+   8. Start the LDAP server.

    From SDSF, start the server using the command /s LDAPSVR.


    The LDAP server is started when you receive the “slapd is ready for requests”
    message.


    # LDAP configuration parameters


    Some important TDBM-specific LDAP configuration parameters include:


    # Database tdbm GLDRDMB


    This parameter specifies that LDAP is to connect to DB2.


    # AdminDN "cn=LDAP Administrator"


    This parameter specifies the LDAP administrator. To perform administrative tasks,
    clients and applications use this user name (and corresponding password) when
    binding to the LDAP server.


    # Suffix “o=itso"


    Suffixes are required in the LDAP configuration file. At least one suffix is found
    at the end of each directory entry. Suffix names are determined by standards determined
    by the LDAP administrator and used by applications accessing the directory. In
    our example, we choose the suffix name o=itso. The schema is loaded using the
    form “cn=schema,o=itso”.


    # DSNAOINI


    This parameter points to MVS data set.


    # Servername


    This parameter is defined using the name of the DB2 server.


    # Dbuserid


    This parameter specifies the user ID to connect to DB2. This must have both SAF
    authority and DB2 admin authority in order to connect to both RACF and DB2.


    # Databename LDAPDB


    This parameter specifies the DB2 LDAP database name.


    Some important SDBM-specific LDAP configuration parameters include:


    # Database sdbm GLDSDBM


    This parameter specifies that LDAP is to connect to RACF.


    # AdminDN="racf-admin.profiletype=user,sysplex=SYSPLX


    This parameter specifies that LDAP is to look up RACF users when binding. The
    profile attribute is required; the sysplex attribute can be assigned value (we
    use the z/OS LPAR name). No password is required.


    # Suffix=sysplex=SYSPLX


    DBDM back ends require the sysplex attribute as defined as the suffix.'
  merge: -1
  pgno: 155
- img_proc: true
  md: 'Note: Ensure that a RACF subsystem ID is defined before attempting to bind
    to RACF.h


    #  7.3.2 Modifying the z/OS LDAP schema


    After starting the LDAP server, we next modify the LDAP schema to support Linux
    user authentication. We use our specific suffix and add some test user the steps
    outlined here:


    +   1. Customize the user schema using your specific suffix.

    Copy the following files from /usr/lpp/ldap/etc/ldap directory:

    - schema.user.ldif

    - schema.IBM.ldif


    Edit both files, changing the line "cn=schema,<suffix>" to specify the suffix
    in your LDAP profile configuration.


    +   2. Implement the modified LDAP schema.

    Use the ldapmodify command:


    ```

    ldapmodify -h 9.12.6.16 -p 3389 -D "cn=LDAP Administrator" -w secret -f \

    /etc/ldap/schema.user.ldif

    ldapmodify -h 9.12.6.16 -p 3389 -D "cn=LDAP Administrator" -w secret -f \

    /etc/ldap/schema.IBM.ldif

    ```


    > Note: In this example, 9.12.6.16 is the IP address of the LDAP server.

    LDAP listens on port number 3389.


    +   3. Add a suffix and test entry to the LDAP directory.

    We create a suffix.ldif file, as shown in Example 7-1, to define the LDAP\entries.
    Add these entries using the command:


    ```

    ldapadd -h 9.12.6.16 -p 3389 -D "cn=LDAP Administrator" -w secret -f \

    suffix.ldif

    ```


    Example 7-1 The suffix.ldif


    ```

    o=itso

    objectclass: organization

    objectclass:top

    o: itso

    dn: cn=test1,o=itso

    objectclass: top

    objectclass: ePerson

    cn: test1

    sn: user

    ```'
  merge: -1
  pgno: 156
- img_proc: true
