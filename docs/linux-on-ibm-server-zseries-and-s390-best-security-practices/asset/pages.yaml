    [Wed Mar 24 08:54:55 2004] [warn] module ssl_module is already loaded, skipping

    [Wed Mar 24 08:54:55 2004] [warn] module mod_ssl.c is already added, skipping

    Syntax OK

    ```


    > In order to execute a command under sudo, the user is first prompted for their

    password. After the user is authenticated, sudo remembers the user password

    using a ticket lasting for five minutes. While the ticket is valid, sudo does
    not

    prom for a user password.


    # Command line options for sudo


    Table 3-4 Common options to the sudo command


    | Option | Description |

    | -user | Execute the command as the specified user |

    | -k | Expire the user''s ticket. User is required to re-enter password next time
    the sudo command is executed. |

    | -v | Validate the user''s ticket for the amount of time (the default is five
    minutes). If required, the user must re-enter the user password. |

    | -l | List the authorized commands for the current host. |


    Example 3-6 on page 42 illustrates the -1 option to list authorized commands.'
