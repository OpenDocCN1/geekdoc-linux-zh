  md: 'X protocol is a problem from a security perspective. Network traffic between
    the server and client is unencrypted and can be monitored by network attackers.
    X forwarding can help to secure X Windows sessions. With X protocol network transmissions
    occur over a secure SSH tunnel.


    To enable X forwarding, add X1Forwarding to the SSH server configuration (/etc/ssh/sshd_config).
    With X forwarding enabled, it is important to ensure that X1UseLocalHost is specified
    in the /etc/ssh/sshd_config file. This option causes the forwarded port to be
    bound to the loopback interface (avoiding the exposure discussed in "GatewayPorts
    on page 68).


    > Tip: When X forwarding is enabled and the X1UseLocalHost option is specified,
    the DISPLAY environment variable is set to "localhost:10.0" on login. If the X1UseLocalHost
    no option is specified, the DISPLAY variable uses the remote host name on login.


    # 4.9.1 Security considerations with X forwarding


    X forwarding should be enabled only after carefully considering the security implications.
    Although the X1UseLocalHost option binds the forwarded port to the loopback address,
    users can change the DISPLAY environment variable (bypassing the SSH tunnel, and
    instead exchanging unencrypted data between client and server). If X forwarding
    is enabled, it is important to have SSH set the DISPLAY variable and ensure that
    users do not modify this environment variable.


