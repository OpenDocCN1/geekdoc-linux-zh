    # 3.2.2 Limiting superuser login to secure terminals


    Superuser access should always be restricted to a secure terminal. Network login
    by root should be denied. This can be enforced using the pam_security.so module.
    If enabled when a superuser logs in, the pam_security.so denies access unless
    the login originates from a terminal device listed in the /etc/security file.
    The default secure device defined for SLES8 is shown in Example 3-3 (the tty0
    device is the VM console).


    Example 3-3 The SLES8 default /etc/security file


    +   # This file contains the device names of tty lines (one per line,

    # without leading /dev/) on which root is allowed to login.

    tty0


    > Important: When logging on from the VM console, passwords are not hidden on
    the terminal. Be careful to avoid exposing passwords (especially the root password)
    to anyone looking at the login terminal.


    Superuser authority is required for a network session, log in as a non-privileged
    user and then issue the sudo command to switch to superuser. Alternatively, considering
    using sudo to delegate authority as discussed in 3.3, "Delegating superuser authority
    with sudo" on page 37.


    The pam_security.module is not enabled for SSH in SLES8 installation. It might
    be desirable to deny superuser SSH network access even though the data is encrypted.
    This can help prevent an attacker from guessing the root password.


    # 3.2.3 Restricting other user login


    At times, it might be useful to restrict non-superuser logins (for example, when
    performing system maintenance). The pam_nologin.so module can be used to'
