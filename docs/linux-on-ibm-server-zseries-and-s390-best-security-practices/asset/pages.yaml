  md: '# Example 3-6 Listing authorized sudo commands


    ```

    $ sudo -l

    Password:

    User user1 may run the following commands on this host:

    (root) /usr/sbin/apachectl

    ```


    #  3.3.3 Command logging with sudo


    Commands executed under sudo are logged to syslog using the "local2" facility
    by default. All sudo commands are logged, both when successfully authenticated,
    and when authentication is denied. By default, successful authentications are
    logged using priority "notice". Unsuccessful authentications are logged at priority
    "alert". Example 3-7 shows log messages generated for both successful and unsuccessful
    authentication.


    # Example 3-7 Logging executed under sudo


    ```

    Aug 24 11:15:22 linux2 sudo: user1 : TTY=pts/1 ; PWD=/home/totib ; USER=root ;
    COMMAND=list

    Aug 24 11:16:05 linux2 sudo: user1 : 3 incorrect password attempts ; TTY=pts/1
    ;

    PWD=/home/user1 ; USER-root ; COMMAND=/usr/sbin/apachectl

    ```


    # 3.3.4 Security considerations with sudo


    When executing commands


    > Note: The PATH variable is not modified when passed to the executed command.


    It is important to be aware that sudo configuration can introduce security exposures.
    For example, allowing access to the vi command to a non-privileged user can allow
    the user to break out into a root shell (by simply executing the :shell subcommand).
    To reduce security risks:


    +   - Limit the number of users granted enhanced authority with sudo.


    +   - Limit the number of commands available to sudo-authorized users.


    +   - Do not authorize access to shell or interpreted commands that allow escapes
    to a shell.'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# 3.4 Securing Internet services with TCP_wrappers


    Internet services provided by the inetd daemon (such as Telnet, FTP, login, and
    rsh) are inherently insecure. These services pass unencrypted data over the network
    (including user IDs and passwords). By default, Internet services are disabled
    in most Linux distributions. Before enabling the inetd daemon, consider using
    an alternate secure service such as Secure Shell (discussed in Chapter 4, ''Sockets
    Layer and the Secure Shell'')


    > Note: Although Internet services are typically disabled, most distributions
    include TCP_wrappers in the default /etc/inet configuration file.


    Some sites might choose to enable specific Internet services (for example, to
    run an anonymous FTP server). In these cases, it is important to take precautions
    to minimize security exposures. A common facility to secure Internet services
    is TCP_wrappers. TCP_wrappers provide the ability to filter incoming connections
    from services (such as FTP, Telnet, or SSH). Filtering can be applied without
    changing the underlying server software. Most TCP/IP applications implement the
    standard client/server model:


    +   1. The client initiates a request (a connection) on a socket.

    2. The server listening on the socket responds to the connection request.


    TCP_wrappers are implemented by the tcpd daemon, which interposes an additional
    layer (or wrapper) between the client and server. Clients requests are examined
    and access controls applied to determine whether to allow or deny the connection.
    TCP_wrappers provide the ability to log incoming client requests to the system
    logger (syslog daemon)


    Access control is implemented using two configuration files:


    +   * /etc/hosts.allow file

    This file contains the specification for allowed client access.

    * /etc/hosts.deny file

    This file contains the specification for denied client access.


    > Note: TCP_wrappers provide an access control mechanism based on the examination
    of incoming TCP/IP packets. TCP_wrappers cannot protect against man-in-the-middle
    attacks, or situations where a network router has been compromised. In addition,
    unencrypted network data is open for inspection. TCP_wrappers should only be considered
    as part of a "defense-in-depth" strategy.'
  merge: -1
  pgno: 56
- img_proc: true
  md: '# 3.4.1 TCP_wrappers access control specification


    The /etc/hosts.allow and /etc/hosts.deny files determine the restrictions imposed
    on services managed by TCP_wrappers Entries in these files have the:


    ```

    service:hostname:domain

    ```


    The domain name is optional. Service can specify a specific Internet service ("ftp"
    for example), or the "ALL" keyword can specify all Internet services. The host
    name can specify a particular host or a wildcard to match several hosts. Wildcard
    specifications are shown in Table 3-5.


    Table 3-5 Wildcard specifications in the /etc/hosts.allow and /etc/hosts.deny


    | Wildcard | Description |

    | --- | --- |

    | ALL | Matches all hosts. |

    | LOCAL | Matches any hosts specified with a name without a domain name. This
    is used to match hosts in the local domain. |

    | UNKNOWN | Matches users or hosts whose name or address is unknown. |

    | KNOWN | Matches users or hosts whose name or address is known. |

    | PARANOID | Matches hosts whose host name does not match its IP address. |

    | EXCEPT | An operator that provides exceptions to matches. It takes the form:
    list1 EXCEPT list2. Hosts matched in both list1 and list2 are excluded. |


    > Note: The KNOWN and UNKNOWN wildcards are subject to the availability of Domain
    Name Systems (DNS). If DNS is unavailable, these wildcards might not match properly.
    When using PARANOID, the host name and addresses will not match if DNS is unavailable
    and connections will be refused.


    The operation of TCP_wrappers is illustrated in Figure 3-3 on page 45.'
  merge: -1
  pgno: 57
- img_proc: true
  md: '![](img/a2760634ecd5eb26c25e81867e88d740_58_0.png)


    Figure 3-3 TCP_wrappers operation


    When a client request is received, the inetd daemon runs the wrapper program (tcpd)
    passing to it the service process name (for example, in.fptpd). This name is used
    for both logging and to determine the access control to the service (based on
    the contents of the /etc/hosts.allow and /etc/hosts.deny files).


    # 3.4.2 Configuring TCP_wrappers


    TCP_wrappers is enabled in the /etc/inetd configuration. Example 3-8 on page 46
    illustrates enabling TCP_wrappers for the Very Secure FTP daemon (vsftpd).'
  merge: -1
  pgno: 58
- img_proc: true
  md: '# Example 3-8 Sample /etc/inetd.conf file


    ```

    # <service_name> <sock_type> <proto> <flags> <usr> <server_path> <args>

    # These are standard services.

    ```


    ```

    # ftp stream tcp nowait root /usr/sbin/tcpd in.ftpd

    # ftp stream tcp nowait root /usr/sbin/tcpd vsftpd

    #

    # If you want inetd not for ''keep-alives'' (e.g. if it runs over an ISDN

    # uplink), -nn. See ''man telnetd'' for more details.

    # telnet stream tcp nowait root /usr/sbin/tcpd in.inetd

    # nntp stream tcp nowait /usr/sbin/tcpd /usr/sbin/leafnode

    # smtp stream tcp nowait root /usr/sbin/sbin/sendmail -L

    sendmail -Am -bs

    ```


    In the example, TCP_wrappers is invoked from the inetd daemon to service FTP requests.
    When an FTP request is received, the actual service daemon name (vsftpd) is passed
    to TCP_wrappers. Based on the access control specified in the /etc/hosts.allow
    and /etc/hosts.deny file, TCP_wrappers will either reject the request, or invoke
    vsftpd to process an allowed request.


    > Note: When modifying the /etc/inetd file, be sure to restart the inetd daemon
    in order to make changes effect.


    # Access control specification


    To illustrate access control specification, we consider the /etc/hosts.allow file
    shown in Example 3-9.


    # Example 3-9 The /etc/hosts.allow file


    ```

    #wrapper allow list

    ftp:9.12.9.35

    ftp:9.12.9.41

    ```


    In the example, we see FTP requests are permitted from two client machines 9.12.9.35
    and 9.12.9.41. Example 3-10 illustrates the /etc/hosts.deny file.


    # Example 3-10 The /etc/hosts.deny file


    ```

    #wrapper deny list

    in.rshd: ALL

    ```


    You can allow access to all but a few specific hosts. Put in your hosts.allow
    ALL for a service, but list the ones you are denying access to the hosts.deny
    file. The entry ALL:ALL opens your system to all hosts for all services.'
  merge: -1
  pgno: 59
