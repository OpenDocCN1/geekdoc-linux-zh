- img_proc: true
  md: 'Note: If not specified or specified as "*\


    # 2.6.2 The INCLUDE statement


    The INCLUDE statement names a profile entry to be included as part of a user definition.
    When constructing a user entry, ensure that statements in any included profile
    do not violate security policy for Linux virtual machines.


    # 2.6.3 The IPL statement


    The IPL statement is used to boot a virtual machine at logon. In a traditional
    z/VM environment, CMS is typically IPLed. For Linux machines, the device containing
    the Linux root file system can be specified to automatically load Linux.


    # 2.6.4 The LOGONBY statement


    The LOGONBY statement defines up to eight VM users that can act as surrogate users.
    When logging on, VM expects the surrogate user to provide their specific password.
    Surrogate users are discussed in 2.6.1, “The USER directory entry statement” on
    page 21.


    # 2.6.5 The MDISK statement


    The MDISK statement defines minidisks and VDISKS owned by the virtual machine.
    It is possible for the user directory entry to specify passwords for minidisk
    sharing. MDISK passwords are one to eight characters in length; three types are
    recognized:


    +   - Read mode password

    - Write mode password

    - Multiple write mode password


    VM users linking to a minidisk (using the CP LINK command) are expected to provide
    the password appropriate for the desired access mode (read, write, or multiple
    write). For details about the disk access modes, consult the MDISK statement in
    z/VM V4R4.0 CP Planning and Administration, SC24-6043.


    Passwords can be specified as ALL, in which case attempts to link to the minidisk
    succeed without requiring a password.'
