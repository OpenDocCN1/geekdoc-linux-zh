  md: '![](img/a2760634ecd5eb26c25e81867e88d740_167_0.png)


    **Figure 7-4** Securing WebSphere on z/OS using Tivoli Access Manager


    Incoming HTTP requests to the Linux guest are intercepted by Tivoli Access Manager.
    We define two junctions:


    +   - One connects to the z/OS WebSphere HTTP server (port 80).

    - One connects to the z/OS WebSphere Application Server (port 9087).


    In Example 7-12, we use the pdadmin command to define the junctions.


    **Example 7-12** Defining junctions to WebSphere on z/OS


    ```

    # pdadmin

    padmin> login

    nEnter User ID: sec_master

    nEnter Password:

    padmin> server task webseald-1nxsu4.ito.ibm.com create -tcp -h 9.12.6.16 -p 80
    /test390

    padmin> server task webseald-1nxsu4.ito.ibm.com create -tcp -h 9.12.6.16 -p 9087
    /was390

    ```


    The WebSEAL server is webseald-1nxsu4.ito.ibm.com, and 9.12.6.16 is the IP address
    of the z/OS WebSphere Application Server. The WebSphere HTTP


