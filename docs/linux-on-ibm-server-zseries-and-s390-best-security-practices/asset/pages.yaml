    # ## 4.10.1 Installing the VNC server


    VNC is available as part of the SLES 8 distribution on Linux for zSeries. The
    VNC server and client are part of the VNC RPM package. Use the vncserver :0 command
    to start the server. The VNC server listens on TCP port 5900 by default (you can
