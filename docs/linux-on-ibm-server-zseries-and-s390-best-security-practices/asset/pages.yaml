    # # 6.4.1 High availability technologies


    In the past, firewalls could be made highly available through add-on software
    or redundant hardware solutions. Often, this resulted in moving a single point
    of failure to another network component (typically the network link). Other network
    services (such as Web, FTP, or content inspection servers) would require yet more
    hardware and software to eliminate single points of failure in the enterprise.


    StoneGate high availability firewall and VPN includes several clustering technologies
    to reduce the complexity needed for high availability. StoneGate''s innovative
    clustering and load-balancing features provide several benefits over traditional
    solutions.


    # ## Built-in high high availability


    To achieve firewall high availability, additional hardware switches, software
    clustering products, or special load balancing devices are often used. With StoneGate,
    high availability is built into the firewall engines. Individual connections can
    be transparently moved to a hot-standby node if an active node becomes overloaded
    or experiences a failure.'
