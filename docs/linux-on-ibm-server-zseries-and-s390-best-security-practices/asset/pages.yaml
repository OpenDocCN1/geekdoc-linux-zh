    time a VNC server is started, you are prompted to provide a password (used when
    a VNC client attempts to connect to the server).


    > > Tip: The :0 parameter indicates that VNC is to display 0. Each VNC uses the
    next available port after 5900. For example, display 1 listens on port 5901.


    # ## 4.10.2 Installing the VNC client on Windows


    Download and install VNC from RealVNC. To use VNC over a forwarded port, ensure
    the Windows System Registry contains:


    ```

    HKEY_LOCAL_MACHINE\Software\ORL\WinVNC\AllowLoopback=1

    ```


    > > Tip: Use the regedit command to edit the System Registry.


    # ## 4.10.3 Installing an SSH server on Windows


    Local port forwarding requires SSH on the Windows machine. OpenSSH is provided
    as part of Cygwin (a Linux-like environment for Windows). Cygwin is available
    at:


    ```

    http://www.cygwin.com/

    ```


    Cygwin provides an install and update utility (setup.exe) to retrieve packages
    from the Internet. When installing Cygwin, select the OpenSSH package (available
    in the Net category).


    After installing Cygwin, complete the Cygwin configuration. Select My Computer
    -> Properties -> Advanced -> Environment Variables, then:


    +   - Add the variable "CYGWIN=ntsec tty"

    - Add "C:\cygwin\bin" to the PATH environment variable.'
