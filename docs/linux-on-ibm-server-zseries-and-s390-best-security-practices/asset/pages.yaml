    # 4.5.2 SSH access control


    By default, any user account can be accessed using SSH. Access control can be
    imposed using the /etc/ssh/sshd_config SSH server configuration file. Various
    types of access control can be applied:


    +   * User access control The AllowUsers and Deny directives permit or deny access
    to specific users accounts.'
  merge: -1
  pgno: 76
- img_proc: true
  md: '+   Host access control


    The AllowHosts and DenyHosts directives permit or deny access from specific client
    hosts.


    +   Group access control

    The AllowGroups and DenyGroups directives permit or deny access to user accounts
    based on group membership.


    +   Root access control

    The PermitRootLogin directive controls SSH access to the root user. To deny access
    to the superuser, specify "PermitRootLogin No".


    # 4.6 File transfer and remote command execution


    SSH provides two secure FTP replacements: the scp command and the sftp command.
    SSH also provides the ability to execute commands on a remote host. Transfers
    and remote command execution are authenticated and encrypted using a secure SSH
    channel.


    # 4.6.1 The scp command


    The scp command uses SSH to authenticate and securely transfer files over a network.
    The command syntax is:


    ```

    scp source destination

    ```


    Where source and destination are the source and destination file specifications,
    respectively. File specifications are of the form:

    user@hostname:path-to-file


    File specification indicates whether the file is on the local host, or on a remote
    server:


    +   If the host name is omitted, the file is assumed to be located on the local
    host.


    +   If no user is specified, the user ID executing the scp command is used.


    +   The path-to-file is an absolute or relative path (relative to the server on
    which the file is located). Relative path-to-file for remote servers are relative
    to the HOME directory of the login user.


    +   The source path-to-file can include shell wildcards (such as "*", "?", or
    "~").'
  merge: -1
  pgno: 77
- img_proc: true
  md: 'For example, to copy the xyz.txt file from the /home/user1 directory to remote
    host 192.168.1.1 to an existing temp directory in the current working directory,

    use the command:


    ```

    scp user1@192.168.1.1:~/xyz.txt xyz.txt temp

    ```


    Before transferring the file, SSH prompts for the user1 password on the

    192.168.1.1 host.


    # 4.6.2 The sftp command


    The sftp command provides an FTP-like alternative to the scp command.

    The sftp command syntax is similar to FTP:


    ```

    sftp user@192.168.1.1

    ```


    If no user is specified, the user ID executing the command is used.


    # 4.6.3 Remote command execution using SSH


    SSH can execute a command on the remote host using the syntax:


    ```

    ssh user@remote-host command

    ```


    For example, to list all files in the user1 home directory on remote host

    192.168.1.1, use the command:


    ```

    ssh user1@192.168.1.1 ls -al

    ```


    # 4.7 Authentication without passwords


    By default, SSH is configured to authenticate using passwords provided by the

    user. Using RSA authentication, it is possible for SSH to authenticate using

    public key exchange. To configure RSA authentication:


    +   Ensure that RSA authentication is enabled on the server.

    Add the RSAAuthentication yes directive to the /etc/ssh/sshd_config file.


    > Note: The default for SLES8 is to allow RSA authentication.


    +   Generate RSA public/private keys for authentication.

    Use the command ssh-keygen -t rsa to generate RSA keys on the server.

    Execute the command as the user used for SSH access. You are prompted for:

    nThe location of the private key file (~/.ssh/id_rsa by default)'
