    | LOGONBY USER2 |

    | MACHINE ESA |

    | MDISK 0191 3390 21 5 440QUIR |

    | MDISK 0201 3390 26 1087 440QUIR WR READ MULTIPLE |

    | MDISK 0202 FB-512 V-DISK 5000 50 WV |

    | LINK TCPAINT 592 59 RR |

    | DEDICATE 2800 |


    Notable security-related statements include:


    +   1. The USER statement starts the user directory entry. Specific security-related
    operands are discussed in 2.6.1, “The USER directory entry statement” on page
    21.

    2. Additional statements common to multiple VM directories can be included, as
    discussed in 2.6.2, “The INCLUDE statement” on page 23.

    3. The IPL statement (discussed in 2.6.3, “The IPL statement” on page 23) specifies
    a device of Named Shared Segment (NSS) to boot at logon.

    4. It is possible to define surrogate VMs, as discussed in 2.6.4, “The LOGONBY
    statement” on page 23.

    5. User midisks are defined using the MDISK statement; see in 2.6.5, “The MDISK
    statement” on page 23.

    6. Minidisks are defined among virtual machines using the LINK statement, as discussed
    in 2.6.6, “The LINK statement” on page 24.

    7. Devices can be dedicated to specific virtual machines, as discussed in 2.6.7,
    “The DEDICATE statement” on page 24.


    # 2.6.1 The USER directory entry


    The USER statement specifies the virtual name, password, virtual machine size,
    and CP command privilege class. User names are one to eight characters in length.
    Two virtual machine size operands are recognized; the first specifies address
    space size at logon, the second specifies the maximum address size the user can
    specify using the CP DEFINE STORAGE command.'
