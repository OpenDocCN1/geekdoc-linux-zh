    # 4.10.6 Connecting to the VNC server over the SSH tunnel


    To complete the procedure, start the VNC viewer on the Windows machine (pointing
    to the server at 127.0.0.1:0). At this point, the connection is forwarded from
    the Windows machine to the Linux VNC server. All network traffic is transparently
    encrypted by the SSH tunnel.'
