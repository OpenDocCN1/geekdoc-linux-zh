    # Starting and Stopping the System and Services


    During administration, it might become necessary to reboot the system or shut
    it down entirely. To do so, you can use the shutdown command. This command has
    several options that enable to specify whether you would like to reboot or to
    shut down and how long you would like to wait before doing so.


    To shut down immediately and without warning, use the following:


    ```

    shutdown -h now

    ```


    The h specified here tells the system to halt. The now parameter specifies the
    time. If you would like to reboot the system rather than shutting down, you could
    use this:


    ```

    shutdown -r +10

    ```


    This tells the system to reboot after 10 minutes. Specifying a time sends a message
    to all users with an open shell telling them that the system will be going down
    in the specified time of minutes. This enables users to prepare for the reboot
    or shutdown and save anything they might be working on.


    Starting and stopping services is just as easy. The service command, which is
    located in the /sbin directory, is your all-in-one command that can control virtually
    any service on your system.


    To start a service that is not already running, use this command:


    ```

    service serviceName start

    ```


    This attempts to bring up the specified service. If the service is not started,
    you will receive an error message. Some messages are more verbose than others.
    If the message does not give enough information for troubleshooting the problem,
    you should check the log files for that service.


    You might also wish to stop a service from running, or if a service is not running
    properly, you might wish to restart it. To do so, you can use these commands,
    respectively:


    ```

    service serviceName stop

    ```


    ```

    service serviceName restart

    ```'
