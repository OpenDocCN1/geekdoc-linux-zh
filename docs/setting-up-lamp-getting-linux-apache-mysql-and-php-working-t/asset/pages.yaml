    # Managing Software


    Similar to most operating systems, Linux has predefined ways in which software
    must be installed and handled on the system. You caught a glimpse of this when
    you took a look at a directory structure of the Linux filesystem. You saw separate
    directories for different types of software that allow for different user privileges.
    This section will teach you how to install software packages on your system through
    a variety of different methods. Methods include the traditional source package,
    rpm binaries, and rpm source packages.


    It is important to note that different distributions of Linux come with different
    package types that may or not be specific to that. For instance, Debian uses a
    file format to distribute it. Debian also has its own set of commands to manage
    and acquire its packages. Because we have installed Fedora Core 2 on our server,
    we will be covering the Red Hat Package Management System in depth. If you have
    chosen to run a different flavor of Linux, then you should refer to your documentation
    and/or manual for more information on binary distribution files. However, the
    subsection covered next,"Traditional Source Tarballs," still apply to you because
    the methods used are not platform dependent.


    # Traditional Source Tarballs


    A source tarball is the traditional way of installing software on a Unix or Linux
    system. The major problem with source files is that they offer no really to remove
    or upgrade the installed software. If you are installing software from source,
    you will often need to record exactly where this software has been installed and
    what additional requirements you will know how to remove it if it becomes necessary
    to do.'
