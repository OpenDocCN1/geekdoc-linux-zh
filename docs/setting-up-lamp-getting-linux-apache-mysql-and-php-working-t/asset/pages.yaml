    # Navigating through Linux


    If are not used to using a command-line interface (for example, with the Bash
    shell or with DOS), navigating the filesystem might seem complicated at first,
    but do not fear. We''ve put together a list of basic commands that will make your
    job much easier. The commands contained in this section are absolutely paramount,
    and you will need to be deeply familiar—nay, intimate—with each of them. If this
    is your first time using Linux, you might want to throw a bookmark in the page
    so that you can refer back to this section while you get adjusted to this new
    system architecture. The following few pages will become an invaluable resource
    when beginning Linux.


    You should not be intimidated by the length of the list. After you begin using
    Linux, these commands will become second nature. If you need any additional information
    on each command, simply use the man command and pass in the function name as the
    only argument. You can use the arrow keys to scroll up and down, and pressing
    Q will exit the manual. We''ve provided the following functions in alphabetic
    order to make it a bit easier you should refer to this section again:


    cat The command is used to concatenate files and print the output to the screen.
    Because Linux is all text files, you can use this command to view the contents
    of a file without entering an editor. Simply use fiename to view a file. You can
    also pipe the results to the less or more command to allow for interactive scrolling.


    cd cd command stands for change directory. We first showed this command in Chapter
    2. The proper usage is cd path. This is probably the most common command you will
    be using for navigating your way through the Linux filesystem. You can also use
    the command by itself with no parameters to change to the home directory of the
    user who owns the shell you are currently in.


    chmod is a command used to change file permissions. File permissions in Linux
    are displayed when retrieving a long listing of file or files. The first block
    on each line will have 10 characters. The first character denotes whether the
    listing is a directory, file, link, socket, or pipe. The character d means the
    listing is a directory, - is for a file, b is for a buffered device, l is for
    a link, s is for socket, p is for pipe. The next nine characters are split into
    three equal sections: user : group : world. Each section of three characters represents
    r for read, w for write, and x for example:


    ```

    drwxr-xr--

    ```'
