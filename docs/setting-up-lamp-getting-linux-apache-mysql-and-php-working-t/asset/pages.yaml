  md: '# Using TCP/IP 111


    frequency would be considered a port. Ports, however, are not measured by the
    frequency of a radio wave but are instead numbered from 0–65,000. You might already
    know that the default port for connecting to a web server is port 80 or that FTP''s
    default port is 21. You will see ports expressed many times as the IP address
    followed by a colon and then the port number. For instance, if you have a router
    that allows you to SSH into it, it might come with an SSH daemon that listens
    on port 1100. To SSH into that router, you would use a command similar to the:


    ```

    ssh 192.168.1.2:1100

    ```


    Ports are split into two groups. Anything numbered over 1024 is considered a privileged
    port, and its configuration cannot be changed by anyone but the system administrator.
    Ports 1024 and above are open for any users to access and use as they fit. File-sharing
    programs, Internet Relay Chat (IRC), and other programs can be set up to use these
    ports.


    The reason for privileged ports is security. If any user were able to access any
    port, they would be able to view all the information passed through that port.
    If this information is in clear text and not encrypted as most mail servers, sensitive
    information could fall into the wrong hands. Ports below 1024 can be administered
    only by the root user, which are also labeled as trusted ports. If you were to
    access a web server or FTP server running on a port number over 1024, you could
    not be sure that the system administrator would be aware of these services being
    running. Any user on the system could have started these services unless their
    access had otherwise been restricted.


    # Addressing


    As discussed earlier in this section, IP networking uses IP addresses. IP addresses
    are composed of four hexadecimal couples, which are usually converted to decimal
    format for ease of use. Each set is separated by periods and contains a value
    from 0 to 255. This is sometimes referred to as dotted quad notation.


    Each machine on your network must have an IP address for your network if it wishes
    to use TCP/IP. You must have one or more IP addresses that represent you on the
    Internet as well. There are predefined ranges reserved for private networks to
    use depending on the type of naming scheme they are using. The naming scheme used
    depends on the size of the network and the number of subnets and hosts that are
    required. Each of the addresses within the proper range is routed through the
    Internet. The ranges are as follows:


    +   - Class A 10.0.0.0 through 10.255.255.255

    - Class B 172.16.0.0 through 172.31.255.255

    - Class C 192.168.0.0 through 192.168.255.255'
  merge: -1
  pgno: 134
- img_proc: true
  md: '# 112 Chapter 5 • Network Connectivity


    NOTE

    Each of these ranges contains multiple subnets within the given network. For instance,
    in the Class B range 172.16.1.0, 172.16.2.0 and 172.16.3.0 are all subnets within
    the network. All Os in the host portion of an address specifies the entire network.


    When you apply to your Internet Service Provider (ISP) for IP addresses, you will
    be given a few IP addresses (depending on how large your network is) to assign
    to your network. You can then set your network so that each computer will have
    its own outside IP address. Alternatively, you could assign a single outside IP
    address to a set of computers by using a router. The router will then forward
    the packets to the appropriate destination within your network.


    Each class allows for a certain number of subnets and a certain number of hosts
    on each subnet:


    +   **Class A** Class A uses the first couple to specify the network address.
    The next two couples are available for you to divide into subnets and hosts as
    you see fit.

    **Class B** In a Class B network, the first raw couples are used to specify the
    network while the third and fourth are available for local subnets and hosts.

