  md: '# Conflicting Files


    foo /usr/bin/bar conflicts with file from apple-2.3-1

    error: foo-1.1-2.i386.rpm cannot be installed


    If you receive this message, another package has already installed the file contained
    in your Foo package. To ignore this error and install the package anyway, use
    the following command:


