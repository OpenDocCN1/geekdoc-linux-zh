    This generates a table of each disk usage for each filesystem with quotas enabled.
    After this has finished running, you can continue to the next step.


    # Assigning Quotas


    To edit a quota for a user, you use the edquota command. For example, if you want
    to edit the quota for the user foo, you use the following:


    ```

    edquota foo

