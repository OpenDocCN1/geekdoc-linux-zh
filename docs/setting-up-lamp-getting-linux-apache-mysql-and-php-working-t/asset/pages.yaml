  md: '# Electronic Mail Protocols


    Let''s take a look at some of the protocols used to run e-mail servers. The basics
    are SMTP, POP3, and IMAP.


    # SMTP


    Simple Mail Transport Protocol (SMTP) is used for sending, relaying, and receiving
    e-mails to the appropriate servers. SMTP servers are usually run in the form of
    a daemon process and will accept connections on port 25. After the connection
    is made, the e-mail client will send its information to the daemon, and then the
    daemon will perform a lookup of the domain name the e-mail address belongs to.
    After the lookup is performed, the e-mail is relayed to the appropriate SMTP server
    for retrieval.


    On the receiving end, depending on your configuration, the SMTP server/daemon
    might deliver the mail itself, or it might deliver the e-mail to another process
    to process and route to the appropriate locations.


    If the appropriate destination server is not found, then the e-mail will be placed
    in a queue. This queue is periodically processed by the sendmail binary according
    to its configuration, and the server will attempt to resend the e-mail. If it
    fails once, it will usually send a message to the sender letting them know that
    the e-mail did not reach its intended destination.


    # POP3


    Post Office Protocol 3 (POP3) is the most popular client protocol. An e-mail client
    uses this protocol to receive e-mail on port 110. This protocol enables users
    to download their e-mail to the local computer. POP3 might also allow the e-mail
    to be stored locally on the user''s computer and save a copy of the e-mail on
    the server itself.


    A POP3 server requires each user to have a username and password and usually stores
    each of the messages in one text file. When a new message that the user has not
    seen before is sent to the server, it appends the new message to the user''s file.
    A POP3 server understands a limited number of commands, including user, pass,
    quit, list, retr, dele, and top.


    # IMAP


    Internet Mail Access Protocol (IMAP) is by far our favorite protocol when it comes
    to client-side e-mail. IMAP is another protocol used by a client to connect and
    retrieve their e-mail. IMAP uses port 143 and stores the e-mail directly on the
    server.


    There are multiple reasons you would want to store your e-mail on the server.
    For instance, if you format your computer, you don''t have to pull your hair out
    trying to back up and restore your e-mail from two years ago. Additionally, you
    can access your mail via the web browser anywhere you go and can also have the
    same e-mail at home or at the office.'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# Understanding How E-Mail Works


    doesn’t matter where you access your e-mail from; the e-mail inbox will always
    contain the same contents because the e-mail is stored on the server, and not
    downloaded to your local computer with most POP3 protocols. An IMAP server is
    also capable of searching its own contents locally rather than having the user
    do the work on their client machine. An IMAP server enables you to use folders
    for storing your messages; these folders will always be there no matter where
    you log in.


    The setback to this is, of course, you cannot read your e-mails unless you are
    connected to the Internet. With the age of broadband or high-speed Internet upon
    us, this is usually not a factor. In many clients nowadays cache the content of
    the e-mail if you enable that option, and you can still read the contents. If
    you are not online, your e-mail client might cache any new e-mails you create
    and send them when it knows it has a valid connection to the Internet and can
    reach the IMAP server.


    # Electronic Mail Transport Agents


    The e-mail protocols are usually bundled together with an electronic Message Transfer
    Agent (MTA). An easy way to grasp this is to think of it as a software application
    that handles your e-mail server requirements.


    There are a few MTAs out there, and some of them come on Linux by default. For
    example, Fedora will install Sendmail if you select a package group that requires
    an e-mail server. The other MTAs we will discuss in this section are Postfix,
    and qmail.


    # Sendmail


    Sendmail is the most popular Linux MTA right now. According to Dan Shearer–Computing
    Consultant for Alaide in South Australia–at http://shearer.org/en/writing/mta-comparison.html,
    Sendmail accounted for delivery of slightly less than half of all Internet-related
    e-mail by June 2001. This equates to billions of e-mails per day.


    Sendmail is installed by most distributions on Linux and has a fairly low overhead.
    Some of the features of Sendmail include anti-spam, virtual domain support, and
    multiple user support.


    To learn more about Sendmail, check out the official website at www.sendmail.org.


    # Exim


    Exim is another MTA that has been the spawn of Sendmail problems. It was developed
    at the University of Cambridge in England. Exim is similar to Sendmail, but its
    facilities are more general. One of the great enhancements is more-flexible mail
    routing.


    For more information about Exim, visit the official website at www.exim.org.'
