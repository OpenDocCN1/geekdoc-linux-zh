  md: '# Enhancing Security


    As with all of your applications, you want to make sure that MySQL is secure from
    any types of attacks. In most cases, for smaller web applications it is not necessary
    for a client or user to access MySQL from outside the network or even from a remote
    computer. If you you will be using PHP installed on the same machine to access
    your data, you can make sure your firewall does not allow access to port 3036.
    This port is the default port for MySQL. You might have changed this during your
    installation or with your configuration files, but for the purposes of this book
    we will be assuming you are connecting through port 3036.


    Follow these steps to ensure that your firewall is set correctly for your particular
    installation:


    +   1. Take a look at your firewall rules and make sure that this port is closed.
    Issue the following command:


    ```

    iptables -L

    If you followed with our chapters on firewall rules and security, this port should
    already be closed and you should returned something similar to the following:

    Chain INPUT (policy ACCEPT) destination

    target opt source -- anywhere anywhere state ESTABLISHED

    ACCEPT icmp -- anywhere anywhere state ESTABLISHED

    ACCEPT tcp -- anywhere anywhere state ESTABLISHED

    ACCEPT udp -- anywhere anywhere state ESTABLISHED

    ACCEPT tcp -- anywhere anywhere tcp dp:ssh

    ACCEPT tcp -- anywhere anywhere tcp dp:smtp

    ACCEPT tcp -- anywhere anywhere tcp dp:pop3

    ACCEPT tcp -- anywhere anywhere tcp dp:imap

    ACCEPT udp -- anywhere anywhere udp dp:domain

    ACCEPT tcp -- anywhere anywhere tcp dp:domain

    ACCEPT tcp -- anywhere anywhere tcp dp:http

    ACCEPT icmp -- anywhere anywhere tcp dp:https

    DROP all -- anywhere anywhere

    ```


    As you might notice from this iptables -L output, there is not mentioned about
    MySQL, so the ports are closed from outside traffic.


    +   2. From this point, you have two choices depending on your needs and configuration.
    If you need to be able to access MySQL from outside your network, open the appropriate
    port (3306 by default) by adding one of the following to your firewall script.


    > We strongly recommend that if you will be opening a port, you configure your
    server for SSL. Otherwise, the information in your database will be transferred
    as plain text between your servers.'
  merge: -1
  pgno: 283
