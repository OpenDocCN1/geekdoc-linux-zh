    # Performing System Backup and Recovery


    Having a backup system in place is imperative. It cannot be stressed enough the
    amount of time that can be lost from having a hard disk go bad. Without a solid
    backup system in place, you should not feel at ease with your system. After your
    server is used to host web pages or server files or whatever the use, people will
    come to rely on your system. Millions of dollars'' worth of time, energy, and
    resources might be housed on your system, and we''re sure you do not want to explain
    to your users why their data is completely lost and cannot be recovered. You should
    instead be explaining that their data will be restored in a matter of hours.


    There are many methods for data recovery on any system. You have a choice of information
    you would like to back up as well as what you would have backed up. If you have
    multiple servers storing very large amounts of data on your network, you might
    want to look into a commercial system for backing up all of them to a central
    backup server. If you are housing only a limited amount of information on a bare-bones
    system, you might wish to back up only users'' files.


    However, for most systems, you will want to back up the entire system to do a
    full bare-metal restoration. A bare-metal restoration is a restoration that will
    start from nothing and bring your system exactly to where it was before your incident.


    # Critical Data


    Your first step is to determine what information is mission critical and must
    be backed up. If you have already created a script to install everything on a
    system, you might wish to back up only the user data on your system in order to
    save system resources and file space during a nightly backup. If you determine
    that your entire system needs to be backed up, you will need to pick a larger
    media source for backing up your files.


    Only can you determine the values of the individual directories on your system.
    If you have a system that caters to other users, so that your most important directory
    would be the /home directory and all its subdirectories. You might have a system
    used only as a web server, with no other users but you. If so, you will want to
    make sure you back up the appropriate directory. You will also want to make sure
    that all the configuration files for your software are backed up as well. The
    majority of your time running a web server will be spent modifying all the configuration
    files, so losing these would be catastrophic.'
  merge: -1
  pgno: 123
- img_proc: true
  md: '# Backup Media


    There is a wide array of choices for your backup media. You should make your choice
    while keeping in mind the amount of data you need to back up and the speed at
    which you need to make your backups. Let''s take a closer look at the most popular
    choices:


    Hard disks Hard disks make an excellent choice for rapid backup of a large amount
    of data. Keep in mind that you should never back up to the hard disk that the
    data is currently stored. Doing so would negate your backup if the hard disk fails.
    Instead you should have a separate hard disk or hard disks for your backup. There
    are exceptions to this rule, however, as having hourly snapshots of your database
    that you can roll back if any non-hardware-related problem occurs.


    Servers It is recommended that if you wish to perform a backup to hard disk that
    you use a separate server. This provides protection from power surges and complete
    equipment failures that could damage or destroy all the hard disks contained in
    one server. Having a central backup server also enables you to back up all your
    other servers to a single location.


    Tapes Tapes are capable of storing around 40GB-80GB of files. Tapes can be useful
    because of their portability. A tape can be removed and stored in a fireproof
    vault in case of natural disaster. There are a couple hindrances, If you forget
    to remove a tape before the next backup is performed, you will lose the older
    backup. If the new backup is faulty, you will have your previous day''s or week''s
    backup.


    CD-R You can get 700MB (currently) on a CD. CDs are removable media as well, so
    you can store them in a protected area. Like tapes, they have to be changed between
    backups. However, because CD-RW drives can be purchased for under $50 and CD-Rms
    can be bought for less than $0.40 apiece, this is an excellent choice for the
    frugal minded.


    DVD-R DVD-RW drives continue to drop in price. If your filesystem contains more
    than a CD can hold, you might wish to look into using a DVD-R drive for backing
    up your files. A single CD can hold approximately 4GB of files and provides the
    same benefits as other removable media.


    # Backing Up Your System


    There are literally hundreds of methods for backing up your filesystem. You can
    find many of them located on the Web, including free backup scripts for you to
    download and use that will provide an abundance of choices for your system. Each
    method will use different libraries that you might be required to download and
    install. You even find complete GUI backup systems and schedulers for the X Window
    interface as well.'
