  md: '# MAKE WEB SERVICES WORK FOR YOU!


    ![](img/57ad032d6fdfa9b53a3ae7e29ad5fb2a_417_0.png)


    Mining Amazon Web Services: Building Applications with the Amazon API

    by John Paul Mueller • ISBN: 0-7821-4307-5 • US $29.99

    With the launch of Amazon Web Services, buyers and sellers have unprecedented
    access to the immense body of data underpinning this marketplace. *Mining Amazon
    Web Services* shows you what you can do with these powerful tools, and exactly
    how to do it. As a buyer, you will build applications to compare-shop far more
    effectively, consistently saving money and finding exactly the right product.
    As a seller, you will leverage Amazon Web Services in ways that help you attract
    more customers, make more commissioned referrals, and improve your bottom line.


    ![](img/57ad032d6fdfa9b53a3ae7e29ad5fb2a_417_1.png)


    Mining Google Web Services: Building Applications with the Google API

    by John Paul Mueller • ISBN: 0-7821-4333-4 • US $29.99

    Virtually everyone sees Google, as hands down, the best online search tool. You
    can use and improve on Google technology in your own applications. *Mining Google
    Web Services* teaches you dozens of techniques for tapping the power of the Google
    API. Google already gives you fine-grained control over your search criteria,
    and this book shows you how to exert the same control in your focused search and
    analysis applications. With just a little knowledge of JavaScript, VBA, Visual
    Studio 6, Visual Studio .NET, PHP, or Java, you will get better (and more relevant)
    search results—faster and more easily.


    ![](img/57ad032d6fdfa9b53a3ae7e29ad5fb2a_417_2.png)


    Mining eBay Web Services: Building Applications with the eBay API

    by John Paul Mueller • ISBN: 0-7821-4339-3 • US $34.99

    Designed to help you master the many powerful capabilities of the eBay Web Services
    API, *Mining eBay Web Services* is the most complete book on the topic. Focused
    exclusively on development features, it teaches you how to build practical, real-world
    applications with the eBay API. You will learn how to: define a customized search,
    work with web service data, write applications in popular programming languages,
    write applications for mobile devices, and craft applications that target user
    needs. If you are an eBay entrepreneur, a third-party application developer, or
    an eBay power user, this book will transform you into an eBay and give you that
    competitive edge.


    ![](img/57ad032d6fdfa9b53a3ae7e29ad5fb2a_417_3.png)'
  merge: -1
  pgno: 417
