    make, and make install and then to rely on a configuration file located in the
    source file directory, src/Configuration, which has the common modules configured
    to install already. You have the ability to edit the src/Configuration file and
    add modules or remove modules you do not want installed before you run the configure
    commands to build and install Apache.


