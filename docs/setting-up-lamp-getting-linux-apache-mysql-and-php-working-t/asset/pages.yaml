    # MySQL Version Differences


    When looking at the MySQL database server versions, you will be presented with
    a few choices. The first choice is whether you want to pay for MySQL. If you choose
    not to pay, you must release all of your source code for the program that interfaces
    with MySQL. This does not mean that you need to release your source code for PHP,
    the only connection part already taken care of by PHP for you. None of the other
    software residing on your system will need to be taken into account unless it
    uses MySQL. If you are building an application that uses MySQL and you do not
    want to release your source code, you can purchase a license from MySQL for a
    marginal cost and be exempt from the rules governing the GPL.


    Whatever your decision, you can download MySQL Classic, MySQL Standard, MySQL
    Pro, or MySQL Max:


    **MySQL Classic** is the simplest of servers and contains only the standard MySQL
    storage engine.


    **MySQL Standard** includes the standard MySQL storage engines and the InnoDB
    storage engine.


    **MySQL Pro** is the licensed version of MySQL Standard.


    **MySQL Max** contains many features not yet available in other releases. This
    enables you to take advantage of extras such as the Berkeley database (BDB) storage
    engine, splitting tables across multiple files, and so on.


    In the words of Sleepycat Software, the makers of BDB, Berkeley DB is an open
    source database library that provides scalable, high-performance, transaction-protected
    data management services to applications. Berkeley DB provides a simple function-call
    API for data access and management.'
