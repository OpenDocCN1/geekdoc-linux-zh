  md: '# Meeting Hardware Requirements


    Although Linux does not have severe hardware requirements by any standards, it
    is important to keep in mind your goal for the server on which you will be installing
    Linux. You don''t want it to suffer from lack of speed, but in the same respect
    you don''t need dual Xeon processors to run your personal development server.


    If you are interested in running Fedora Linux in text-only mode, you will need
    to meet the following minimum hardware requirements:


    +   * 200MHz Pentium class processor or better

    * 2GB hard disk space

    * 64MB RAM


    For graphical mode you will need at least the following:


    +   * 400MHz Pentium II processor or better

    * 3GB hard disk space

    * 192MB RAM


    > We are the bare-minimum system requirements. We highly recommend purchasing
    or building a system with better specs than listed here, especially if you plan
    on using your Linux box as a file server as well as a web server or if you will
    be serving to multiple users simultaneously.


    We have put together the following system recommendations for different numbers
    of simultaneous users so you can get an idea of the hardware scalability structure:


    System specifications for up to 5–50 users:


    +   * Intel Celeron 1GHz processor

    * 20GB hard disk

    * 512MB RAM


    System specifications for 51–250 users:


    +   * Intel Pentium 4 2GHz processor

    * 80GB hard disk

    * 1GB RAM


    System specifications for 251–1000 users:


    +   * Dual Xeon > 2 GHz'
