  md: '# Chapter 9 • MySQL: Installation and Administration


    storing millions of records. However, when working with databases of this size,
    some duplication might be necessary to make queries significantly faster. These
    duplications are usually created by the use of indices. We will cover indexes
    in more depth later in this section.


    Relational databases have also built-functions that enable data to be manipulated
    and retrieved. Instead of the client program sifting through countless records,
    only certain records are accessed as needed when querying the database. Databases
    also introduce complex locking systems to counteract the problems found in flat
    files. In many databases, MySQL locking is available. This means only a single
    record to be locked while it is updated instead of having an entire table or file
    locked. Because the database manager is the only one allowed to access the files
    where data is stored, the database manager can also queue queries so that nothing
    will be overwritten.


    Now that you have a good idea of why to choose a relational database over flat
    files, you''re ready to take a look at the different solutions available and learn
    why we are using MySQL as our database server choice.


    # Advantages and Limitations of MySQL


    Let''s take a look at some of the key advantages and features offered by MySQL.


    First up, we have the American National Standards Institute (ANSI) SQL syntax
    support. MySQL supports a broad spectrum of the ANSI SQL 99 syntax commands. SQL,
    sequel, is a language with which you "talk" to the database by using commands
    as SELECT, and UPDATE. While these two commands are ANSI SQL 99 commands, MySQL
    adds additional commands to help maximize the efficiency of your queries. REPLACE
    and LIMIT are two excellent examples of such MySQL commands. MySQL also adds alternate
    syntax for commands to making port pre-built applications easier. This allows
    fewer modifications of existing queries for other databases, resulting in statements
    not meaning any changes at all.


    MySQL also has excellent cross-platform support. MySQL is available for Linux,
    Windows, FreeBSD, Sun Microsystems, IBM''s AIX, Apple''s Mac OS X, Hewlett-Packard''s
    HP-UX, QNX, Novell NetWare, SCO OpenIX, SG IRI, DEC OS, and a few other common
    operating systems as well. MySQL also offers a thread-safe library and a variety
    of drivers for virtually every programming language.


    MySQL also provides independent storage engines that enable you to choose which
    type of database is suited for your particular application. If you need row-level
    locking and transaction support, you can choose to use the InnoDB; otherwise,
    you can choose the MyISAM storage engine, which will maximize your performance.


    Transactions, as we mentioned, enable you to use ROLLBACK and COMMIT commands
    within an application. This enables you to make multiple changes to a database
    and commit them all at once. The ROLLBACK command would then enable you to roll
    back the database to a point'
