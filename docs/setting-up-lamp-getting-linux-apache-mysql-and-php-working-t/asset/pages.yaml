  md: 'Besides the files that are located within this directory, there are also quite
    a few important subdirectories within them. Let''s take a look at some:


    **etc/cron.d** This directory houses scripts run by the crontab. The crontab is
    a file parsed by the cron daemon (crond) and determines at what times a script
    should run.


    **etc/cron.daily** The daily cron directory will run any scripts located within
    it once a day. You do not need to have a crontab entry for the scripts located
    here.


    **etc/cron.hourly** Like the /etc/cron.daily directory, this directory does not
    require scripts located within to have a separate crontab entry. The only difference
    here is that,, much like the name suggests, the scripts are run hourly.


    **etc/cron.monthly** Scripts located within this directory also do not need a
    separate crontab entry. The only difference here is that, much like the name suggests,
    the scripts are run monthly.


    **etc/cron.weekly** Like all of its brothers, the files are run automatically.
    The weekly extension means that the files will be run weekly.


    **etc/default** The /etc/default directory contains the useradd file by default
    (no pun intended). This file contains the following:


    ```

    # useradd defaults

    GROUP=100

    HOME=/home

    INACTIVE=-1

    EXPIRE=

    SHELL=/bin/bash

    SKEL=/etc/skel

    ```


    Each time a new user is created, these values will be assigned to the user. When
    customizing your system, you might wish to change the values.


    **etc/httpd** This is where your web server configuration files are located for
    Apache. There will be much more about this later in Chapter 8, "Apache Web Server:
    Installation and Configuration."


    **etc/mail** This directory contains configuration files for sendmail, a program
    used to send mail from your system. There are various configuration files pertaining
    to access levels and users located here.


    **etc/pcmcia** This directory contains all of the configuration and startup files
    necessary for Personal Memory Card International Association (PCMCIA) operations.
    You will likely not need these unless you are using a laptop.


    **etc/ppp** Files pertaining to your Point-to-Point Protocol (PPP) are used for
    Internet traffic. Your firewall-masq and stand-alone configuration files are also
    located here.'
