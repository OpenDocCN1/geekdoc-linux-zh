    # /sbin


    The /sbin directory contains binary programs for booting the system that are not
    contained in /bin. Retrieve a listing of the /sbin directory and you will see
    that all users of the system have access to almost any of these commands. The
    /sbin directory is separated from /bin in order to create a distinction between
    commands that the system uses and commands that might be applicable to users of
    the system. Originally this separation stemmed from creating a separate directory
    for files that were statically linked, meaning they did not require any other
    supporting files or libraries to work. This they could still be used in a single-user
