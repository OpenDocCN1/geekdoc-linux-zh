    Other holes might become evident as well. For instance, if you have a Data Management
    Zone (DMZ) set up and one of the computers in the DMZ has access to the rest of
    your network with passing through the firewall, or the firewall has rules to allow
    a greater amount of access to a computer on your network that is locally situated
    in the DMZ, then you will also have holes in your security scheme. There is a
    myriad of data-driven network attacks as well. We can stem from customized scripts
    on web pages to bypass overflows.


    WARNING Just because you have a firewall installed and running does not mean your
    network is secure.


    You should pay close attention to your network topography and logical and physical
    network separations. You can never be too safe where security is concerned. This
    is another reason why it is important to always keep your software up-to-date.
    After security holes are discovered within a program, it is usually only a matter
    of days before a patch is released to fix the problem. Staying on top of current
    releases is part of your responsibility as a system administrator.


    # Using DNS


    The Domain Name System is best explained by first giving you some background on
    how it began. In 1984, Paul Mockapetris developed DNS to combat the problem of
    the current system. The system at the time was constructed of a single table containing
    an entry for each of the registered domain names and their IP addresses. It was
    maintained by the Stanford Research Institute''s Network Information Center (SRI-NIC).
    Periodically, system administrators would download the newest table and update
    their server.


    As the Internet grew, however, the table became completely unmanageable. Although
    it worked well for simple lookups, there were no procedures in place to pass out
    the new information automatically and efficiently. That is where Mockapetris came
    into play. He developed a'
  merge: -1
  pgno: 146
- img_proc: true
  md: '# Chapter 5 • Network Connectivity


    system whereby the data is not stored on any server. This type of database is
    called a distributed database because its contents are indeed distributed throughout
    the network. This type of database allows for almost unlimited growth. He named
    this system the Domain Name System.


    # The Domain Name Space


    To completely understand how this system works, you need to have a firm understanding
    of the domain name space. A domain name space can be represented as an inverted
    tree.


    At the top we have a period that represents the root level. The next level contains
    your top-level domains. These are the .com, .net, -tv, and so on, extensions on
    your domain name. The next level down from the top-level domains contains the
    base domain name, such as inuxforum.com. Beyond that can be an infinite number
    of levels, each consisting of a subdomain within the domain or subdomain it belongs
    to. In our previous example, www would be a subdomain of inuxforum.com. Think
    of subdomains as subfolders within folders. Each of these subdomains must be specified
    in the DNS zone as well as the web server configuration. The domains do not necessarily
    be names of services such as www or ftp, either. You can have any name you wish
    as long as there is an entry for it on the proper server that will be responsible
    for handling the request.


    # DNS Operation


    The Domain Name System is responsible for translating a domain name into an IP
    address. Domain names are used for virtually every web service, including HTTP,
    mail, FTP, and so on. Domain names are registered through an issuing authority,
    or domain registrar, such as netsol.com or directnic.com. The personal information
    you provide your registrar for that domain is stored in a root domain server.
    This root DNS server is responsible for distributing this information to any DNS
    servers across the world when it is requested. It is called propagation. DNS propagation
    usually takes between 24 and 48 hours to take effect globally but can be much
    shorter for your zone depending on the administrator''s configuration-settings.


    When you type a domain name into your or FTP client, your client asks its primary
    name server for the IP address. If your server has ever fielded a request for
    that domain, the server will locate the domain within its own cache and reply
    with the IP address, as long as the time to live (TTL) has not expired. If your
    server name has fielded a request for the domain, the DNS server will attempt
    to locate the proper address by using a set of functions referred to as a resolver.
    It does this by asking the next server up the tree what the proper IP address
    is for the given domain. If server fails to come up with an answer, the DNS will
    keep trying a different server until it reaches an answer. If no answer comes
    back within a reasonable amount of time, the client application making the request
    will most likely display a message saying that it has timed out. If this happens
    and you know the domain exists,


    ![](img/57ad032d6fdfa9b53a3ae7e29ad5fb2a_147_0.png)'
  merge: -1
  pgno: 147
- img_proc: true
  md: 'you could choose to keep trying until your DNS finds a match on a remote server.
    If the domain is not valid, however, you are out of luck and your attempts are
    futile.


    A domain name resolution request to a server contains five basic parts:


    **Header section** The header section contains errors, flags, and other miscellaneous
    settings.


    **Question section** The question carries the domain name that is being queried.


    **Answer section** This section contains the answer to the question.


    **Authority section** The authority section contains a list of name servers that
    might be able to answer the question at hand.


    **Additional information section** This section holds other records that are not
    the requested domain but might be similar or relevant to the question.


    Here we see the breakdown of how DNS processes it requests. When you type in a
    domain to be resolved, a message is sent to your name server. If that name server
    does not know the answer, it in turns queries another name server. This second
    name server sends back one of two responses: either your answer (the actual IP
    address resolved) or entries in the authority section (a list of other servers).
    If your DNS does not receive an answer, it tries to contact each of those and
    find out the proper answer. If no answer is forthcoming, it will dig deeper using
    the referrals from each of the new recommendations by those servers. Most likely,
    your DNS will receive an actual answer back during the first round of queries.


    If an answer is received back comes with an authoritative source flag, your DNS
    will update itself automatically and cache the address so that DNS will not have
    to go through this same process again. If another request is made for the same
    domain, it will not reply with the authoritative source flag because it is not
    coming from a source.


    There are a variety of tools available for finding information about a specific
    domain. One of the most popular is the dig command. This command is used to query
    a name server for a specific domain. It is a powerful and versatile command for
    your administration and should not be overlooked.


    Go ahead and perform a dig linuxforum.com and you will be greeted with the following
    output:


    ```

    << DIG 9.2.2-P3 << linuxforum.com

    ;; global options: printcmd

    ;; --HEADER-- opcode: QUERY, status: NOERROR, id: 62984

    ;; flags: qr rd ra; QUERY: 1, ANSWER: 1, AUTHORITY: 3, ADDITIONAL: 0

    ```


    ```

    ;; QUESTION SECTION:

    ;linuxforum.com.

    ```


    IN      A'
