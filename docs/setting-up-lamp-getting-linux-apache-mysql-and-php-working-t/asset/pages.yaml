- img_proc: true
  md: '# Appendix C · Getting Support


    These installations are relatively painless and both can be found in the tutorials
    section for servers on the linuxforum.com. To install them, visit the site and
    look in the left column for the Servers link in the Tutorial submenu.


    BIND BIND is a DNS server (called named) which stands for Berkeley Internet Name
    Domain. DNS servers are used to translate domain names to IP addresses which in
    turn tells the client computer to find the web server, e-mail server, name servers,
    and so on.


    If you are going to be using virtual hosts on your system, you might want to look
    installing and configuring a name server. This can be a complicated process, however,
    so you might wish to pick up one of the books we referenced in the preceding section
    covering network servers. You can find information and the download to the latest
    version of BIND on the Internet Systems Consortium (ISC) located at www.isc.org.


    # Local Resources


    In addition to published books, you should also make use of your local resources.
    By this we mean the actual operating system you are working on. Get to know the
    man command and make frequent use of the --help flag for most command-line programs
    on your system. These can provide quick answers after you get used to reading
    their format. Remember, you can pipe the results of your --help flag to more or
    less for easier reading if they present you with hundreds of lines of options.


    Although the manuals can often leave you looking for more answers, they are an
    excellent place to begin. If you are still confused or need more information,
    it is time to turn to one of your books or the Internet.


    # Internet Resources


    Internet resources come in many flavors: websites, mailing lists, newsgroups,
    and Internet Relay Chat servers (IRC). Each provides crucial information in its
    own way. Search engines will return a staggering number of resources, and you
    can spend days sifting through them. The following selections will get you started
    and provide all you need.


    # Websites


    We have taken the time to create support communities for Linux, Apache, MySQL,
    and PHP, which are available for free with no membership and no money to pay (the
    first site listed in each of the following categories). In addition to our sites,
    there are many other communities available through the Web that feature information
    pertaining to LAMP. Listed here'
