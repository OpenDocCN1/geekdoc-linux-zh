  md: '# Chapter 3 • Using Linux


    NOTE


    Some pre-built laptops might require a special ACPI patch or driver.


    After these basic devices are mounted, your operating system will check whether
    there are certain switches configured for runtime and will make sure the system
    was shut down properly. If you have the option to press Y to force a system integrity
    check or N to skip the check. If the filesystem (which uses the command fsck)
    was run, your system will check for update quotas. Then, your /root filesystem
    will be mounted in read/write mode, and file swapping will be set up by the command
    swap. You can turn off swapping using the swapoff command, but it is not recommended.


    Next, the /etc/mtab is cleared, and the /root and /proc directories are mounted.
    With the /root system now in read/write mode, logging can then be enabled. After
    this is complete, the sound modules are loaded. If the variable /etc/modules.conf
    contains the text alias or alias midi, the modules from the subdirectories of
    /etc/mod/i are loaded. If the /proc/sys/kernel/modprobe exists, the USEMODULES
    is enabled, then written to the file /proc/sys/kernel/modprobe.


    With the sound enabled, any RAID devices configured will be initialized. First,
    /etc/fstab will be scanned for the noauto flag for the current device. If the
    noauto flag is found, initialization will be skipped for the device. Otherwise,
    Linux will use raidstart for the RAID initialization process. If raidstart fails,
    raidadd raidrun will be used. If all of these fail, Linux will drop to a shell
    immediately.


    Finally, all the other filesystems will be mounted, and the script will attempt
    to load the graphical boot if not previously done (as noted earlier). Once the
    firstly mounts have been completed, the quotas will be checked for each of the
    new filesystems added, and various files within the /var directory will be removed
    to start fresh. No swap space turned on, and if you have any USB or FireWire storage
    devices, they will be mounted as well.


    A few other tasks will complete the /etc/rc.init file and bring your system to
    a point where it is ready start running the services and processes necessary for
    a fully operational system.


