- img_proc: true
  md: '# Chapter 6 • Linux Security


    The time has come when you face one of the most difficult aspects of maintaining
    your Linux system: security. Security is something that should not be taken lightly
    on a system such as the one you are building. Your system is going to be connected
    to the Internet and it''s going to be under the microscope of people trying to
    break into your vault.


    Linux security is any system administrator''s nightmare. It doesn''t have to,
    but it is. The problem is that you are running open source software that is potentially
    vulnerable—until the patches and updates become available.


    In this chapter, we''re going to cover what needs to be done to secure your Linux
    system and to reduce the worries that you might have while your system is online.


    # Disabling Unwanted Services


    The best way to get a strong handle on your system is to figure out what services
    are running during startup and to disable them if they are not needed. Linux is
    built for a multi-role-purpose, so some services will be running, as print services,
    Telnet, Samba, and more.


    In this section, you will learn about two utilities—chkconfig and ntsys—that can
    be used to manage services. You''ll also learn how to determine the purpose of
    a service that''s running and you''ll see examples of how we disable them on startup.


    > WARNING For compatibility purposes, determine which utility you are going to
    use for enabling and disabling services and stick with that utility. It is best
    if you do not use both chkconfig and ntsys.


    # Utilizing chkconfig


    chkconfig utility is a simple command-line tool that maintains startup services
    by altering the /etc/rc0.d files. This is the primary way to disable and enable
    startup services from the command line. In Chapter 4, "Linux Administration,"
    we talked about chkconfig extensively, however this chapter will go in depth with
    hands-on examples. Here are the important commands for the chkconfig program:


    +   - chkconfig --list This option lists the current configured services and the
    run levels they set to utilize.


    +   - chkconfig --add name This option enables you to add a new service from a
    startup script that you might have placed in /etc/init.d directory.


    +   - chkconfig --del name This option deletes a service from the /rc directories.


    +   - chkconfig --level name This option configures a service for a particular
    run level.


    +   - chkconfig name on|off|reset This option turns on, turns off, or resets a
    service.'
  merge: -1
  pgno: 157
- img_proc: true
  md: 'Let’s run through an exercise of using chkconfig to add, enable, and disable
    a service. First, you should take a look at which services are currently handled
    through chkconfig. Run the fol-lowing command:


    ```

    chkconfig --list

    ```


    You should see output similar to the following. Note that we have truncated the
    output for the purposes of this book:


    ```

    gpm         0:off  1:off 2:on   3:on  4:on  5:on  6:off

    kudzu       0:off  1:off 2:off 3:on  4:on  5:on  6:off

    syslog      0:off  1:off 2:on   3:on  4:on  5:on  6:off

    xinted based services:

    chargen-udp: off

    rsync:        off

    chargen:      off

    daytime-udp:  off

    daytime:      off

    echo-udp:    off

    echo:        off

    services:     off

    ktalk:        off

    sgi-fam:      on

    time:        off

    time-udp:    off

    cups-lpd:     off

    ```


    Let’s take the gpm service as an example of what is happening when you list your
    output. The gpm service is set to operate in run levels 2, 3, 4, and 5 and not
    in run levels 0, 1 and 6.


    > Before you go wild and start disabling services, please review the section "Determining
    the Purpose of a Service" in this chapter.


    # Adding a Service with chkconfig


    Let’s pretend that you have a service named foo in your /etc/init.d directory
    and you add it to your system. Simply run this command:


    ```

    chkconfig --add foo

    ```


    You should see the foo service listed when you use the --list option now.


    When you use chkconfig, there is a requirement for your scripts in the /etc/init.d
    directory: you must have a line that defines the run levels your script will start
    up, the run levels your script will stop, and the priorities it will use. This
    line looks similar to this:


    ```

    #chkconfig: 345 96 96

    ```'
