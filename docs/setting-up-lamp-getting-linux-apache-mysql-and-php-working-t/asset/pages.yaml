  md: '# Understanding MySQL and Database Structure


    # Differences between Flat-File and Relational Databases


    Flat files provide a method of storing data that uses single or multiple text
    files. These files are formatted using special characters to delimit fields and
    records from each other. The most common type is Comma Separated Values or CSV.
    This type of file stores fields separated by commas, and rows separated by new
    lines or carriage returns. These files must be parsed each time data needs to
    be accessed, which can equate to a high load on the computer if the data types
    become complicated or advanced. That is not to say that it is impossible to store
    complex data in a flat-file format, only that it is not nearly as efficient as
    using a relational database.


    Imagine a filing cabinet with folders and files. If you wanted to search for a
    particular record that might be written on one of these documents, you would have
    to locate the appropriate drawer and then the correct folder. In that folder you
    would find numerous papers. Locating the correct paper would take some time, and
    reading the appropriate document for the correct row containing your record would
    take ever longer.


    Another problem with flat files is that they are prone to corruption. For flat
    files, so the file must be locked by the application accessing the file. This
    can lead to serious problems if two or more instances of an application try to
    access the file at the same time. These instances can create a battle for the
    file lock and possibly end up corrupting or even erasing the file. Not a situation
    you want to be.


    This is why Database Management (DBM) was developed for flat files. A DBM layer
    adds more functionality and the addition of keys. These keys are unique, and the
    manager can locate information faster to supply to the client. However, this does
    not eliminate the locking issue inherent in flat-file storage.


    This brings us to relational databases. Relational databases store information
    in a way that mimics real life. The information is separated into tables, or groups
    of records. Each record in a table can have properties—like a car having an engine,
    wheels, and so on. These properties can also have their own relational tables—hence
    the term relational database. To continue the car example, tables could be used
    to store types of engines and wheels of types. Each of the tables can be linked
    to each other by the use of keys. A key is a unique identifier for each wheel.
    This number could be used in the car table so that each wheel would have to store
    only the relationship to its wheel, not all the information about the wheel. If
    your car stored all the information about the wheel, every car in the database
    would contain duplicate information about the wheel over and over again. The relational
    database solves this problem by breaking out the wheel information into its own
    table and storing its relation (the unique ID) in the car table.


    This sort of structure would be nearly impossible to replicate using flat files,
    and the performance would be severely less than optimal. Another advantage is
    being able to eliminate duplication of data and thereby save on file size, which
    becomes important when you are'
