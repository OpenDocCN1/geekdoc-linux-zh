    # Firewall Configuration


    A firewall is a collection of programs and configurations that act together to
    examine all packets passing through it. The firewall determines whether to forward
    the packets to the appropriate destination, or to allow your computer to access
    these ports by letting out packets through the firewall. This type of control
    is needed to tie down your network and computer from potential outside attacks.


    We have personally witnessed systems that did not have a firewall enabled and
    were hacked within one hour of installation.'
