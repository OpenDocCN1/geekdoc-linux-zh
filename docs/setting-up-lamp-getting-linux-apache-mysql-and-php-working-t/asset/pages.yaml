    # Disabling Services


    Earlier we mentioned chconfig and ntsys as methods to disable and enable startup
    services. Depending on which method you wish to use, run chconfig or ntsys (we
    prefer chconfig) and choose which services you wish to disable.


    On our server, we disabled the following services:


    acpid acpid is a daemon for ACPI events. It listens on the file /proc/acpi/event
    and when an event occurs, it executes the required program to handle it. If your
    system does not use ACPI, then you can disable this service.


    charged charger is handled by xinetd and returns pseudo-random characters to the
    requester. This service can be vulnerable to DOS attacks and should be disabled
    unless you find a use for it.


    charger-udp This is the same as charger, except it utilizes UDP. This service
    can be vulnerable to DOS attacks and should be disabled unless you find a use
    for it.


    cups-lpd cups-lpd is the Common UNIX Printing System (CUPS) Line Print Daemon
    (LPD) mini-server that supports legacy client systems using the LPD protocol.
    If your system does not have a printer installed, this service should be disabled.


    daytime This simple protocol enables clients to retrieve the current date and
    time from a remote server. While useful at a basic level, the daytime protocol
    is often used for debugging purposes rather than actually acquiring the current
    date and time. This service is handled by xinetd and should be disabled.


    daytime-udp This is the UDP layer for daytime. This should be disabled if you
    are not using daytime.'
