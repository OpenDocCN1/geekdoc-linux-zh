- img_proc: true
  md: '# Chapter 7 • Electronic Mail


    # Postfix


    Postfix is a freeware MTA developed by Wietse Venema. Many consider Postfix to
    fit some- where used Exim and qmail in the realm of features and security. Its
    purpose is to enhance Sendmail''s features and security and to provide an alternative
    to MTA, as well as pro- provide direct competition to qmail.


    Some of the features of Postfix include multiple transports, virtual domains,
    and easy-to-use configuration files.


    To learn more about Postfix, visit the official website at www.postfix.org.


    # qmail


    qmail is a rapidly growing MTA written by Dan Bernstein. The qmail team claims
    that it will make Sendmail obsolete and boasts about qmail being a modern SMTP
    server and a secure package.


    qmail has quite a following; from our experience, the most of web hosting companies
    we have used in the past qmail by default due to its wide support for add-ons
    and third-party enhancements The features of qmail are outstanding and they include
    virtual domain support, awesome speed and flexibility, support for multiple third-party
    add-ons, Realtime Black List (RBL) and much more.


    If you would like to learn more about qmail, you can view the official website
    at www.qmail.org. Later in this chapter, we are going to cover how to install
    qmail and some of the excellent third-party add-ons to build a powerful mainstream
    mail server.


    Now that you have an understanding of the most popular MTAs out there, let''s
    get started with installing qmail.


    # Installing the qmail MTA


    Installing qmail is a long and tedious process during which you must take extreme
    consider-. Failure to perform a step properly could result in a long and strenuous
    troubleshooting process. One of the most important aspects about the installation
    is learning the location of files that make qmail run.


    In this installation, you are going to install qmail with the applications required
    to run it, as well as some third-party applications that will ease the virtual
    host configurations. Addition-ally, you are going to configure RBL (which rejects
    known offending servers of spam), a server-side antivirus program called Clam
    AntiVirus (ClamAV), and SpamAssassin spam filter.


    This chapter closely follows the standard qmail installation procedure; however,
    we have altered the process to include a few third-party add-ons for qmail. To
    learn more about'
