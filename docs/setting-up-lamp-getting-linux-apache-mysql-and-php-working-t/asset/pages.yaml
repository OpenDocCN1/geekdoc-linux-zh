    order to cause a user''s account to be disabled on this date. This does not remove
    the user or the user''s files from the system.


    +   - **f inactive_days** Specifying a value allows an account to be disabled
    x days after their password expires. The default value is -1, which disables this
    feature.


    +   - **g initial_group** This specifies the initial group a user belongs to,
    in the GID field in /etc/passwd file.


    +   - **G group,[]** You can list as many groups as you wish here that the user
    should belong to other than his initial group.


    +   - **m** This specifies that a directory will be created, if it does not exist,
