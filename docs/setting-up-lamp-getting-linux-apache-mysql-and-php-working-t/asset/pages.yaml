    find /backups/incremental-* -mtime +14 -exec rm -rf {} \

    ```


    Here you see that the -mtime flag now has a +14 argument for the number of days
    and that you are now finding files with begin incremental. These are the two areas
    that have changed for your new script. After that has been added, add the same
    command you used in your full backup script to transfer the directory or single
    file to your device or location of choice. With that, you will be ready to run
    your cron job into the system to automatically run these scripts when required.


    To run your newly created scripts automatically, you will be using the /etc/crontab
    file. You can edit the crontab file and have your changes automatically take effect
    using the crontab -e command. If you are logged in as root, you will be taken
    to the crontab file in vi. Once you exit and write the changes, the crontab will
    automatically make its changes. Try that and take a look at the format. Here you
    have six parameters per line:


    +   **minute** This is an integer value from 0 to 59 representing the time at
    which to run this script


    +   **hour** This is also an integer representing the hour at which to run this
    script or command. It should be a value from 0 to 23.


    +   **dayOfMonth** The dayOfMonth value should be from 1–31 for the day of the
    month script or command specified should be run.


    +   **dayOfYear** This is a value from 1–12 representing the month of the year.


    +   **dayOfWeek** dayOfWeek should be a value from 0–7, which represents Sunday
    through Monday, with 7 representing Sunday once again.


    +   **shellCommand** At last, this indicates the full path to the script or command
    that should be run when the preceding requirements are met.


    Using the preceding format, you can determine the line for your full_backup script
    should read as follows:


    ```

    0 2 * * /root/full_backup

    ```


    This will cause your full backup script to run weekly at 2:00 A.M. every Sunday.
    Notice that the asterisks denote a value for that argument. For the incremental
    script, you will add a line to run the backup every night at 2:00 A.M. except
    for Sunday. To do this, let''s use the following:


    ```

    0 2 * * 1-6 /root/incremental_backup

    ```'
