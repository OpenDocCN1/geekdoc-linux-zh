    # myisampack


    This is MySQL Compressed Read-Only Table Generator. This utility is used to compress
    MyISAM tables. Each column is compressed separately and will usually result in
    the file size being reduced by about 40 percent to 70 percent. When the table
    is read, the required information will then be uncompressed and read into memory.
    You should note that when a table becomes compressed, it also becomes read-only.
    This is useful for databases that will be placed onto a read-only media such as
    a CD-ROM.


    To invoke the command, you should use the following syntax:


    ```

    myisampack [options] filename ...

    ```


