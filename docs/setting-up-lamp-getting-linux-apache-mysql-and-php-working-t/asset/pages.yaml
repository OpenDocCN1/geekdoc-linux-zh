    # Network Cards


    The network card is the device, usually installed in a computer, that connects
    you to a network. Network cards can have two types of connections: coaxial, which
    is similar to a cable wire, or unshielded twisted pair (UTP), which contains pairs
    of copper wires. Category 5 (CAT5) is the most common twisted pair and uses an
    RJ-45 connector on both ends. The coaxial is used for Base2 connections, where
    a CAT5 is used for 10/1000Base-T connections. Your network card is most likely
    installed internally on your computer in a Peripheral Component Interconnect slot
    (PCI), or in the case of older cards it might be plugged into an Industry Standard
    Architecture slot. New motherboards now come with network devices built in and
    might have one or two ports already available.


    In addition to internal cards, there are external as well. Some of them might
    use a USB connection, and others might use FireWire or a different technology.


    Regardless of the type of card, they all perform the same function of connecting
    you to one or more networks. You will also hear these cards referred to as NICs,
    or network interface cards. The bottom line is, any computer that needs to connect
    to a network must have one of these cards unless it is accessing a network only
    via model or serial connection.'
