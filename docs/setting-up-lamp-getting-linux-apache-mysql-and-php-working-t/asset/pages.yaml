    # How a Firewall Can Increase Security


    A firewall can increase security only if it is absolute. As you begin to create
    more and more exceptions, holes can open up in your defenses. You might even have
    a few holes caused by insecure pre-installed components such as OpenDataBase Connection''s
    (ODBC) ability to accept connections directly from HTTP. As well, your firewall
