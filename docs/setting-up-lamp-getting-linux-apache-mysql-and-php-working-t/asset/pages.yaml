  md: '# mysqlcheck command


    The mysqlcheck command is used to analyze, optimize, and repair MyISAM tables.
    This command must be used while the database server is running. This can be a
    huge benefit in a production environment when taking down the entire server is
    not an option to check or repair a single database. You can specify a single database,
    multiple databases, or all databases to check or repair. Here are the three methods:


    ```

    mysqlcheck [options] db_name [tables]

    mysqlcheck [options] --databases DB1 [DB2 DB3 ...]

    mysqlcheck [options] --all-databases

    ```


    The mysqlcheck command is unique in that you can rename the file or create a symbolic
    link under a different name that will specify a different default option. For
    example, if you were to rename mysqlcheck to mysqlrepair, the command would then
    perform an -r operation. You can also use mysqlanalyze for -a, and mysqloptimize
    for -o.


    # mysqldump


    The mysqldump command is an important command that you will most likely be using
    frequently during your affair with MySQL. You can specify one or more databases
    by using the syntax as mysqldump:


    ```

