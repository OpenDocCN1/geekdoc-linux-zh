  md: '--with-client-ldflags=-all-static


    --with-mysql-ldflags=-all-static


    These two directives used together enable you to compile MySQL Server and Client
    as statically linked programs. This allows greater speed and should always be
    used if you are creating a workaround for an RPM package.


    Also, when using the GCC compiler, you will need to set a few CFLAGS and CFLAGS
    environment variables. This will tell the GCC compiler to use only GCC instead
    of linking to lib++ and libstdc++. MySQL reports that many users have experienced
    strange problems when using these compilers. You should also use the following:


    ```

    CXFLAGS="-03 \

    -mpientumpro \\

    -mstack-align-double \

    -felide-constructors \\

    -fno-exceptions -fno-rtti

    ```


    WARNING This code is listed as imperative for newer GCC compilers that understand
    these directives. Failure to do so can result in random crashes of the MySQL Server.


    Now that you know the most commonly used directives, you can configure your script
    for your MySQL configuration:


    +   1. Create a new file to edit within the MySQL directory called conf_mysql.

    2. Inside, place the following contents:


    ```

    CXFLAGS="-03" \

    CXX=gcc \

    CXFLAGS="-03" \

    -mpientumpro \\

    -mstack-align-double \

    -felide-constructors \\

    -fno-exceptions -fno-rtti


    /configure \ \

    --prefix=/usr/local/mysql \

    --with-extra-charsets=complex \

    --enable-thread-safe-client \

    --enable-local-infile \

    --enable-assembler \

    --disable-shared \

    --with-client-ldflags=-all-static \

    --with-mysql-ldflags=-all-static

    ```


    +   3. Exit and save and then chmod 775 conf_mysql.'
