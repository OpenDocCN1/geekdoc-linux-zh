  md: '# Configure qmail Startup Scripts


    The qmail application requires some startup scripts to run. You will create them
    now:


    +   1. Create a file named /var/qmail/bin with the following contents:


    ```bash

    #!/bin/sh


    exec env PATH="/var/qmail/bin:$PATH" \

    qmail-start -cat /var/qmail/control/defaultdelivery*

    ```


    The preceding script uses backticks (`'') and not quotes.


    +   2. Change the permissions on the startup script:


    chmod 755 /var/qmail/rc


    # Perform Mailbox Configuration


    qmail accepts multiple types of mailbox delivery. For this configuration, use
    the Maildir-configuration method. To enable this, run the following command:


    echo ~/Mailird >/var/qmail/control/defaultdelivery


    # Create qmail System Startup Scripts


    The next file you are going to create is the qmail system startup script. This
    script is pretty long to type, so you can download it from the Life with qmail
    website (www.lifewithqmail.org).To download the script, run the following commands:


    ```bash

    cd /var/qmail/bin

    wget http://lifewithqmail.org/qmailctl-script-dt70

    mv qmailctl-script-dt70 qmailctl

    chmod 755 /var/qmail/bin/qmailctl

    ln -s /var/qmail/bin/qmailctl /usr/bin

    ```


    After you run the preceding commands, you will have the qmailctl script in your
    /usr/bin path. This allows you to run qmailctl from anywhere within the filesystem.


    For your reference, Listing 7.1 shows the script you have just downloaded.


    # Listing 7.1 qmail System Startup Scripts


    ```

    #!/bin/sh


    # description: the qmail MTA


    PATH=/var/qmail/bin:/usr/bin:/usr/local/bin:/usr/local/sbin

    export PATH

    ```'
