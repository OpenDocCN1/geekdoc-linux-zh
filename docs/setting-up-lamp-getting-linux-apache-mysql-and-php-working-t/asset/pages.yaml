  md: '# # Setting Up LAMP


    Getting Linux, Apache, MySQL, and PHP Working Together


    You could think of Setting Up LAMP as four books in one, but it''s actually much
    more valuable: a single volume that presents the open-source technologies known
    collectively as LAMP—Linux, Apache, MySQL, and PHP—as tightly coupled components
    of today''s most affordable and effective platform for building web-based applications.


    Each technology has uses outside of this context, of course, but within it they
    form something greater than the sum of their parts. This book shows you how to
    take full advantage of this power, walking you through all the steps required
    to lay your Linux foundation, install and configure your Apache web server, and
    then using PHP to access content stored in MySQL. Here are a few of the specific
    topics you''ll find inside:


    +   - Installing and configuring Linux, Apache, MySQL, and PHP

    - Installing and configuring qmail with support for IMAP, POP3, SMTP, virtual
    domains, spam filtering, and antivirus

    - Managing users and groups

    - Configuring your network

    - Creating a custom firewall script using IP tables

    - Recognizing when a system is in distress

    - Handling MySQL database replication

    - Configuring virtual domains

    - Writing a basic PHP script that integrates with MySQL


    If you''re new to all of this, you''ll quickly get to where you need to be starting
    developing and deploying the higher-level pieces of your web application. Even
    if you have experience with one or all of these technologies, this book—including
    its quick-start installation appendix—is a resource you''ll want close whenever
    you''re setting up or fine-tuning your LAMP system.


    # About the Authors


    Eric Rosebrook is the owner of The Freaks, Inc. (linuxforum.com, apachefreaks.com,
    mysqlfreaks.com, phpfreaks.com), communities in which developers help one another
    and troubleshoot open-source solutions. He is also the author of Creating Interactive
    Websites with PHP and Web Services from Syex. He has nine years of experience
    in Linux.


    Eric Wilson has over five years of developing enterprise-level web applications
    using LAMP and other technologies. He has also developed websites for a leading
    online entertainment company.


    # Downloadable Code


    Visit the book''s website at www.syex.com, where you''ll find a downloadable tarball
    containing all the scripts referred to in this book.


    Based on Fedora Linux


    CATEGORY: Internet Programming


    USER LEVEL: Beginner/Intermediate


