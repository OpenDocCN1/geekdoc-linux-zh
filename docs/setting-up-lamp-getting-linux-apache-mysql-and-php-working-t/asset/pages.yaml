  md: '# Conventions Used in This Book


    This book uses certain typographic styles in order to help you quickly identify
    important information, and to avoid confusion over the meaning of words such as
    onscreen prompts. In particular:


    +   - A normal, proportionally spaced font is used for the bulk of the text in
    the book.

    - *Italicized* text indicates technical terms that are introduced for the first
    time in a chapter (Italics are also used for emphasis.)

    - A monospaced font is used to indicate the contents of configuration files, messages
    displayed at a text-mode Linux shell, filenames, commands, and URLs.

    - *Italicized monospaced* text indicates variables—information that differs from
    one system or command run to another, such as the name of a client computer or
    a process ID number.


    +   **Bold monospaced text** is information that you''re to type into the computer,
    usually at a Linux shell prompt. This text can also be italicized to indicate
    that you should substitute an appropriate value for your system.


    In addition to these conventions, which can apply to individual words or entire
    graphs, a few conventions are used to highlight segments of text:


    > A Note indicates information that''s useful or interesting, but that''s somewhat
    peripheral to the main discussion. A Note might be relevant to a small number
    of networks, for instance, or refer to an outdated feature.


    > A TIP provides information that can save you time or frustration, and that might
    not be entirely obvious. A Tip might describe how to get around a limitation or
    how to use a trick to perform an unusual task.


    > Warnings describe potential pitfalls or dangers. If you fail to heed a Warning,
    you could end spending a lot of time recovering from a bug or restoring your entire
    system from scratch.


    | Sidebars |

    | Sidebar is like a Note but addresses a larger topic. The information in a Sidebar
    is useful, but it doesn''t fit into the main flow of the discussion |'
