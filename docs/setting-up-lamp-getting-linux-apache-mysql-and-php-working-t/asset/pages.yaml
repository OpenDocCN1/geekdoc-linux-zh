  md: '+   * Understand the functionality of ports and how they operate.

    * Be familiar with the purpose and type of addressing on both the Network and
    Data-Link layers.

    * Understand the setup of a static or dynamic IP address for your server.

    * Know the differences between a hub, switch, bridge, router, and repeater.

    * Understand the functionality of a firewall and how it works.

    * Be familiar with the Domain Name System and how it propagates itself.

    * Know how to use the dig command.


    After you are comfortable with the information covered in this chapter, it is
