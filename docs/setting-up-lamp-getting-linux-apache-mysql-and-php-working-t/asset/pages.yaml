  md: '# Chapter 3 • Using Linux


    Now that you have your first Linux operating system installed, it''s time to learn
    some basics. This chapter covers the boot sequence, login prompt, command-line
    interface (or shell for short), and an in-depth look into the Linux filesystem.
    These are the building blocks you need to learn before administering your server.


    As with Chapter 2, "Installing Linux," if you feel you do not have a complete
    understanding of the principles and philosophies of this chapter, we encourage
    you to review any section until you understand it better. Some of you with more
    computer background, especially with a DOS-Linux-based system, might grasp these
    concepts quicker than others. But if you feel you are having a hard time, do not
    be discouraged! After following the exercises in this chapter and practicing a
    little, you will be ready to begin administration in the next chapter.


    # Booting Linux


    When your PC is initially powered up, it begins running the Basic Input/Output
    System (BIOS). This system is typically located on an Erasable Programmable Read-Only
    Memory chip (EPROM), which tells you your computer hardware is available on Interrupt
    Request (IRQ) lines and channels. After your hardware has been initialized, the
    BIOS will then try to read the first sector of any bootable media such as a floppy
    disk, CD-ROM, or hard disk. As you might remember, in Chapter 2 you changed the
    boot sequence within the BIOS to make sure you were reading from the CD-ROM first
    in order to install Fedora Linux. This boot sector contains a small program that
    the BIOS will attempt to execute and pass control to.


    During the installation process your boot loader, GRUB, was installed on the Master
    Boot Record (MBR). Because you don''t have any media in the drive, GRUB loads
    and takes you directly to a selection screen asking you which operating system
    to launch. If no selection is made within the 10 seconds allotted, the default
    operating system will attempt to run. In our case, this is Fedora Core 2. To speed
    up this process, press Enter, and Fedora will begin booting.


    After Fedora begins booting, it will probe for all active devices attached to
    your computer. It does this by aside, loading the appropriate drivers and printing
    out the results as it goes. After the drivers have been loaded, the boot process
    mounts the /root partition. This partition is mounted as read-only so that it
    can be checked as it''s mounted. If this process fails, the kernel will “panic”
    and immediately halt. The kernel will then start the program init, which becomes
    process 0 and contains the rest of the information to bring up the operating system.'
  merge: -1
  pgno: 57
- img_proc: true
  md: '# Your First Package Installation


    The process init is the master process of your system. Once run, init will begin
    to spawn every other process that is available on your system. It will first check
    the /etc/initab file that changed in Chapter 2 to find the appropriate run level
    in which to create processes.


    Next, init will locate the action sysinit and execute the command file determined
    by that line. In our case, this is the /etc/rc.d/sysinit file. The rc.sysinit
    file contains information that tells you how to mount the proc filesystems, set
    the clock, start virtual memory, set the hostname, check a few key systems, and
    a few other tasks that are essential to bringing your system up. After that is
