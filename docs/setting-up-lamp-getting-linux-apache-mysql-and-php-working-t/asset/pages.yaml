    # Hard Disk Partitioning


    The Linux operating system requires that you partition your hard disks before
    you install the operating system. A partition is a way for the operating system
    to reserve a block of your hard disk space for a specific purpose. Linux will
    make sure these partitions do not overlap, resulting in corrupted data.


    Follow these steps to partition your hard disk:


    +   1. You should be at the Disk Partitioning setup screen, which presents you
    with these options:

    Autopartition is the default, highlighted option.

    Disk Druid enables you to set up your partitions in detail by inputting the device,
    size, type, and mount point for each partition.

    2. If you do not have any special partitions on your drive, choose Autopartition
    and skip to step 3. If you have special conditions that you need to work around,
    choose Disk Druid, proceed to step 2, and then skip to the rest of this section.

    3. If you choose to set up your own partitions for multiple hard drives or another
    reason, there are a few critical things to keep in mind. First, you must have
    a swap partition. A swap partition is used for virtual memory support. If your
    computer runs out of RAM for storing temporary data, this partition will be used
    in its place to handle any overflow. When creating your swap partition, be sure
    to make its size equal to twice the amount of RAM you have installed, but no greater
    than 2048MB (2GB). Next you need to create a boot partition. The boot partition
    is where your operating system kernel resides along with any files'
