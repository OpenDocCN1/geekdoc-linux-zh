  md: '# Allowing HTTP Server Access through the Firewall


    In Chapter 6, “Linux Security,” you configured your firewall for the server. Now
    you need to expand upon your firewall installation and allow the appropriate HTTP
    access for your web server. Let''s add HTTP and HTTPS access to your firewall.


    +   If you did not enable port 80 for normal HTTP access or port 443 for HTTPS
    access, you need to do so now.


    We added the following lines to your port access section of the firewall script
    located at /usr/local/etc/firewall:


    ```

    #Allow incoming HTTP requests (to Web server)

    $IPTABLES -A INPUT -p tcp --dport 80 -j ACCEPT

    $IPTABLES -A INPUT -p tcp --dport 443 -j ACCEPT

    ```


    If you do not wish to run an SSL server, simply place a comment (#) in front of
    the third line in the previous code to comment out the port 443 access.


    +   Run your firewall script to ensure the changes have taken effect.

