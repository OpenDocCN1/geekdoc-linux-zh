    mysqldump [options] --databases DB1 [DB2 DB3 ...]

    mysqldump [options] --all-databases

    ```


    If you are going to be dumping a very large database, you should make sure you
    specify the --quick flag. This will cause MySQL to not load the entire result
    into memory before dumping result. In addition to the quick option, a large number
    of options are available for this command. Many of them will enable you to dump
    the data into virtually any other data type. You could if you wished to create
    a flat-file database from this command. One of the simplest and most common uses
    for a situation this is to create a CSV file.


    # mysqlhotcopy


    This command is the quickest way to make a backup of a database. This command
    can be run only on the local machine that the MySQL Server data directory resides
    on, and uses a Perl script to copy the database. The proper usage is as follows:


    ```

    mysqlhotcopy db_name [path/to/new/directory/]

    mysqlhotcopy db_name_1 ... /path/to/new/directory/

    mysqlhotcopy db_name./regex/

    ```


    For more information on options for this command, refer to the manual or MySQL
    documentation.'
