  md: 'Pipelines A pipeline is used to send the output of one command directly to
    another command. You will use the pipe symbol (|) to denote a pipe. A good example
    is piping the result from a directory listing into the more command, which will
    enable you to view one page at a time in case your directory is larger:


    +   - ls -al | more


    Redirection Redirection refers to a few specific characters: <, >, and >>. These
    characters are used to redirect output information from one command or function
    into another or a file. You use the command


    +   - 11 > listing.txt


    to push all data retrieved from a long listing of the current directory into a
    file called listing.txt. You can use the opposite symbol, <, to push all the content
    of a file to a command. The combination >> is used to append data to a file, and
    << is used to append data from a file to a command or command-line program.


    > You should be aware that the > is destructive, meaning that it will overwrite
    any content within the specified target unless the noclober option has been specifically
    set for your shell. -C would set the noclober option. If you still wish to overwrite
    a file with noclober then you can use |.


    # Understanding the Bash Environment


