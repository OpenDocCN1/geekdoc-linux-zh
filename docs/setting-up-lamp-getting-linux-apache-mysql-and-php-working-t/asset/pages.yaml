    where version is the version of MySQL that you downloaded.


    # Creating a MySQL User for mysqld


    With your files unpacked and un-archived, you will need to perform two final commands
    before you install MySQL. The MySQL daemon mysqld needs a user and a group to
    operate. To create this, use the following:


    +   - groupadd mysql

    - useradd -g mysql mysql


    You are now ready to begin your installation script with the proper directives
    for your installation.


    # Using Common Configuration Directives


    Like all configuration scripts, the MySQL configuration script allows a great
    deal of control over how MySQL is built and installed. We''ve listed some of the
    more common configuration directives in this section for reference. The end of
    this section will cover creating your configuration script for your Fedora Core
    2 installation.


    --without-server This option enables you to install just the client from source.
    This might come in handy if you do not wish to upgrade your server version but
    would like to update the client application.


    --with-embedded-server This directive enables you to install the embedded MySQL
    library, libmysql.a.


    --prefix=/path/to/dir This option enables you to specify the base path to which
    MySQL will install.


    --localstatedir=/path/to/dir This option enables you to specify the location where
    the actual data files for MySQL will be installed.


    --with-unix-socket-path=/path/to/file/mysql.sock This directive enables you to
    change the location and name of the mysql.sock file. This is located in the /tmp
    directory by default.'
