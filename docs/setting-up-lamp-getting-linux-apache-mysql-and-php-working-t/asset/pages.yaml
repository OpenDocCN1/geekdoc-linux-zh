    the filesystem, including the /bin and /sbin directories. The root user is the
    only one who has access to some of these directories and the ability to create
    new system accounts if the software package requires them. To actually install
    your compiled binaries and the complete software package, type make install!


    Congratulations—if you have not received any error messages, you have just completed
