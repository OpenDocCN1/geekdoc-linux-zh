  md: '# Chapter 5 • Network Connectivity


    **[no]additional** Show (do not show) the additional portion of the response.


    **tries=number** This sets the maximum number of tries before failing.


    **[no]besteffort** This attempts to display the answer received even if it has
    been marked as invalid or corrupted.


    These options provide you with enough functionality to find any answer you could
    ever want to name-server-related queries. Learning to use the dig tool can provide
    huge benefits for when tracking down DNS and resolution problems.


    # The /etc/resol.conf File


    This file houses the server addresses for your server to use, in order, so that
    it can resolve any given domain name. This is the only file you need to configure
    in order to run a DNS client. Although your file most likely contains only one
    line specifying the DNS server you provided during the installation, a number
    of other lines can be added, each with slightly different functionality.


    For instance, you might have a file that looks like this:


    ```

    :

    ; Sample /etc/resol.conf

    ;

    domain somewhere.COM

    search search.COM

    nameserver 192.168.0.1

    nameserver 192.168.0.2

    sortlist 192.168.0.0

    hostresorder bind local

    dots:2

    ```


    Let''s take a closer look at each of the sections:


    **domain** This specifies the current zone. This domain is automatically appended
    to any domain that does not contain a period. For instance, if you were to specify
    foo for your domain name, it would automatically be translated to foo.somewhere.com.


    **search** This specifies a list of possible names. This list, if present, will
    override the local domain.


    **nameserver** This option specifies the name server to use in order to resolve
    domains. You can have up to three name servers listed in this file, and they will
    be queried in order from top to bottom.


    **sortlist** IP address and net masks can be listed here. When a query is returned,
    all those that match the given will will be returned before any others.'
