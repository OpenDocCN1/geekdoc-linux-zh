  md: 'In addition to iptables, you can also specify limited control over services
    controlled by inetd by TCP wrappers. TCP wrappers are a method of controlling
    access to servers using the /etc/hosts.allow and /etc/hosts.deny files. These
    files, as the name implies, contain information and directives on how to control
    access from specified hosts to specified services. It is important to note that
    the hosts.allow file supersedes the hosts.deny file. This is because although
    you might need to block out the entire world, you will want to allow a few hosts.
    This is much better than having to specify the entire world''s computers individually.


    The xinetd service is a secure replacement for inetd. This service runs and listens
    on all ports for services that it controls in maintaining control over the traffic
    being sent. If traffic on a port, it will start the appropriate server and pass
    on the information if the host requesting the service or has access. The xinetd
    daemon also contains functionality that enables it to conserve system resources,
    create log files, and limit the rate of data coming across ports. You can edit
    the configuration for xinetd by editing the /etc/xinetd.conf and other files located
    in the /etc/xinetd.d directory. The directory contains a list of daemon controls
    and whether to enable or start service.


    In addition to manually editing the config files, there are a few commands you
    can use to present the information to you in an easier-to-understand manner. The
    first is a small text-based interface that enables you to activate and deactivate
    services. It is called ntsys. Running this command will take you to a system similar
    to the test installation of Fedora Core 2 that you performed. You can use the
    arrow keys to navigate and the spacebar to stop and start services.


    > WARNING Services controlled by xinetd will be immediately affected by the ntsysv
    interface. Others will need to be manually started or stopped. Unfortunately,
    the ntsysv program will not differentiate between the two.


    > TIP You can set up the default services for other run levels using the --level
    x flag, where x is equal to the run level.


    The other command used to control services for a specific run level is the chconfig
    command. This command enables you by default to check the status of a service
    by using the following:


    ```

    chkconfig --list serviceName

