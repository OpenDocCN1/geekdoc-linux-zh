    The rc script is responsible for initiating the kill and startup scripts that
    are appropriate for each run level. The first thing the rc script does is run
    each the kill processes located in /rcX.d directory, where X is equal to the run
    level (for example, rc3.d for run level 3). Each kill process is denoted by the
    beginning letter being a K. After each process has been killed, attempted each
    the startup scripts for the appropriate run level will be run. A capital S is
    used to denote a startup process. You will notice that each of these scripts is
    simply a link to the daemon or service. This means that each of scripts could
    potentially run with the start or stop parameters and have the desired effect.


    +   TIP If you cd into /etc/rc3.d directory and use the 11 command to retrieve
    a long listing of the directory, you can see that each of these files is actually
