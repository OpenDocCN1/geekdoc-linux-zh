  md: 'The preceding line means that the file is a directory; the user who owns the
    file has read, write, and execute permissions; the group who owns the file has
    read and execute permissions; and the world (meaning every other user on the system
    is not the file owner and is not in the group who owns the file) has only read
    permissions. For the bases on file ownership, use the chown command. For now,
    just be familiar with the command. We will cover this in more detail in the next
    chapter, in the section "Managing Users and Groups."


    **chown** is used to modify the ownership of a file or directory. When retrieving
    a directory, you will find that the third and fourth blocks are username and group
    name, respectively. When chowning a file, simply use:


    ```

    chown flags username:group

    ```


    A common flag for this is the -R flag, which indicates to perform this function
    recursively. **Recursive** means that it will repeat itself on each file contained
    in the directory specified and in each subdirectory of that directory, and so
    on. We will be covering this command in depth in the next chapter. For now you
    should be aware that you can leave the colon and group name to change only the
    user who owns the file. If you wish to change the group, you should use chgrp.


    **cp** The cp command is used to create directories or files. A common flag combination
    for the cp command is -p, which stands for *force preserve*. The preserve argument
    will preserve the ownership and timestamp of the original file. You can also use
    the -l command to create a link instead of actually copying it. There are soft
    links and hard links in Linux. A *soft link* is much like a shortcut in Windows;
    it merely acts as a pointer to the existing file. A *hard link* is a new name
    for the target file, which will update whenever its is changed.


    **exit** The exit command is used to exit a shell. If you have used the su command
    in a different user, typing **exit** will only exit that shell and not the entire
    terminal.


    **find** The find command is used to find files; this command will help you locate
    files in your filesystem. You might choose to use the *locate* command described
    in this list, but it is important to note that the *locate* command is based on
    a database-type system that is updated every night at midnight. Any files created
    after last at midnight will not be found. Instead, use the *find* command with
    the following syntax:


    ```

    find path -name filename

    ```


    You can also specify a myriad of other flags, such as time and size, to narrow
    your search. The man **find** command to learn more.'
