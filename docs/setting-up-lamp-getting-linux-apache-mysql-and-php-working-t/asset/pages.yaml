  md: 'panic This option should be used only if you think you are under an attack
    or someone is hacking your server. This mode will flush all existing iptables
    rules, open port 22 for SSH access, and drop any other ports. This is used to
    lock out anyone from coming in and allows you to maintain your SSH session. It
    is not 100 percent bulletproof, but it could help you in a panic mode.


    Your firewall is all set now. It will prevent unwanted access to the ports that
    you do not specifically open and it will start up on boot. You might additionally
    want to link this startup script to your path so you can run firewall option from
    anywhere within your system.


    ```

    ln -s /etc/init.d/firewall /usr/bin/firewall

    ```


    Your system is now under the protection of a firewall. You can take a deep breath
    and relax a little now because you do not have to worry about intruders getting
    into your system without pulling their hair out.


    # Monitoring the iptables Logs


    The firewall you have created is set up to log any rejected packets to your system
    located at /var/log/messages. If you need to monitor what is happening when you
    are trying to troubleshoot a connection problem, this is a good place to look.
    Simply type in tail -f /var/log/messages and you''ll see the firewall logging
    take place as your connection fails to a desired port.


    We strongly urge you to turn off the iptables logging if you do not need it enabled
    for a troubleshooting problem. Simply disable the logging by adding a comment
    mark (#) to the front of the rule and then run your firewall script again.


    # Don''t Panic, Just Drop It!


    If someone is attacking your server, and you know what IP address or hostname
    they are coming from, you can run a simple iptables rule and disable any access
    to your server from them. You have a choice of running the command at the command
    line or adding it to your firewall script and running your firewall script again.


    The rule from the command line looks like this:


    ```

    /sbin/iptables -I INPUT -s [IP ADDRESS] -j DROP

    ```


    Or in your firewall script, it looks like this:


    ```

    $IPTABLES -A INPUT -s [IP ADDRESS] -j DROP

    ```


    If you are manually adding a specific drop rule to your firewall script, you should
    add it at the beginning directly below the $IPTABLES -F (flush) lines.'
