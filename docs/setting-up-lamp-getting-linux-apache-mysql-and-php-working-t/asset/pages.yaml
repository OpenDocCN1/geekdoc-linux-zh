    # Using .htaccess Files for Local Directory Configurations


    Editing the httpd.conf file for each directory configuration can become painful
    over time. You can, however, include per-directory settings in a file named .htaccess
    located in that directory. A rule of thumb is that any directive that will work
    in <Directory xxxx</Directory> settings for the httpd.conf file will work in the
    .htaccess. You might need to add something like this to the httpd.conf file:


    ```

    <Directory /path/to/directory>

    AllowOverride All

    </Directory>

    ```


    The previous settings will allow the .htaccess file in the directory to change
    any settings. You should determine which settings to use in the AllowOverride
    directive so that you do not open your system to security holes, especially if
    you are virtual hosting for clients.


