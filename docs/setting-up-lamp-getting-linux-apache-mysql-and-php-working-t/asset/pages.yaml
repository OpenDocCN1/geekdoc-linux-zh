  md: '# Chapter 9 • MySQL: Installation and Administration


    MySQL is pronounced My-S-Q-L, not My-Sequel. Many people have the habit of pronouncing
    this wrong, so we thought we''d mention it to start this chapter properly.


    The MySQL database server, as we discussed in Chapter 1, “Introducing LAMP,” enables
    us to store data in a manner that allows the server to access it quickly and efficiently.
    In this chapter, we''ll show you how to choose the proper installation method
    for your solution and then demonstrate how to perform the actual installation
    of MySQL. After that is complete, we will show you how to configure your server
    by using the proper directives and then how to administer your server to add new
    password-protected user accounts, set permissions, and more.


    First, we''ll go over some basic information so that you can gain insight into
    what you will be installing and why it is imperative to creating dynamic websites
    on your server.


    # Understanding MySQL and Database Structure


    At the time of writing this book, MySQL is on development version 4.1. However,
    there is also a previous version available, MySQL 5.0, which contains many additional
    upgrades to performance and an abundance of new, useful features. Because masterpieces
    everywhere soon be switching to MySQL 5, we will be covering the MySQL 5 installation
    in this book. Although the installations are nearly the same, there are a few
    differences in configuration. The majority of the differences, however, are transparent
    during the installation procedure, so you will be able to use this chapter as
    an excellent reference you should choose to install a version earlier than 5.0.


    MySQL includes all the necessary requirements and features for enterprise-level
    development with additional innovations as well. The MySQL database server allows
    multiple storage engines that include full transaction support. This means that
    you can use commit, rollback, crash recovery, and low-level locking capabilities.
    MySQL also offers query querying, which delivers improved performance and database
    replication that many slave systems can run off of a single master server. With
    the addition of SSL transport-layer encryption and an advanced permission system,
    MySQL can be locked down to an extremely reliable point. MySQL even includes full
    text indexing, which enables a text field to be searched faster and more efficiently.


    One of the major reasons for using MySQL 5 over MySQL 4 is the use of stored procedures
    and functions. Stored procedures enable MySQL to manipulate data when certain
    conditions are met. This puts more load on the host server, but allows less data
    to travel between the web server and the database server. This is especially useful
    when data transferred between the two is sensitive. Financial institutions, for
    instance, use stored procedures and functions to maintain tighter data security.
    Another major reason, as with all software, is that it contains performance upgrades
    and bug fixes over other previous versions.'
  merge: -1
