    # Login Process


    After your system has finished booting, you are brought to a login prompt for
    your virtual terminal. This login prompt is displayed in this format:


    ```

    hostname login:

    ```


    The prompt displayed here is being created by the getty process you saw initiated
    within the /etc/initabb file. As we touched before, this process is regenerated
    every time the user ends a session when the console. If you were to log out of
    your system now, getty would be respawned and create a new login prompt. After
    you have typed in your username and pressed Enter, the login process is called,
    passing in your username. The login process will then prompt you to enter a password.
    After the password has been entered, the login process will verify that it is
    correct. On a successful match, it will spawn your shell. If it fails to match
    the username with the password, an error message will be displayed indicating
    login failure. After you have exited your shell, getty will be respawned by init,
    and the entire process will be repeated again. This is why you saw the respawn
    command used in the init file.


    > When your run level is set to 5, which is X11 or X Window, different programs
    are called that serve as a replacement for terminal 1. You might still have access
    to a normal terminal shell by switching to another terminal with the Ctrl+FX command,
    where X is the target terminal.


    # Exploring the Linux Shell


    During the "Login Process" section, we talked about a successful login spawning
    a new user shell. This is your command-line interface that enables you to run
    commands locally on your system and perform any number of administration tasks.
    In our case, the shell used is the Bash shell.'
