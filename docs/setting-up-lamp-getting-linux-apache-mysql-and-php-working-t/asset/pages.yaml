    tkalk This is a graphical talk client for K Desktop Environment (KDE). If you
    are running in mode for your web server, this service should be disabled.


    xinetd This is a service wrapper and a replacement for inetd. This wrapper handles
    a handful of services that we have listed in this section. You can disable xinetd
    and decide which of the services it handles that you might want to manually enable.


    > If you have Telnet in your services we recommend that you disable it. Telnet
    is the old remote-based management terminal for Linux, which was replaced by the
    more secure SSH. Some Linux distributions still install Telnet and enable it by
    default. Due to the lack of updated security protocols, Telnet has to be a security
    hole for any server on the Internet that is not specifically blocking Telnet ports
    through firewalls.


    # Staying Up-to-Date


    Staying up-to-date is probably one of the best ways to keep your system secure.
    There are new patches and fixes for Linux almost every day. The open source community
    is trying to find and fix bugs in software so that they can release patches and
    make the environment as safe as possible. In this section, we are going to cover
    how to use the more popular update applications to ensure your system is as safe
    as possible.


    # Using up2date


    Red Hat and Fedora have an integrated system of keeping Linux updated with the
    latest software and security patches. This is called up2date and it''s an excellent
    program that connects to the Red Hat network, download a list of the available
    updates, compare the updates to your system, and then download and apply the updates
    as necessary. If you''re a Windows user, this is similar to the Windows Update
    program.


    To run your update program, simply type up2date into the command line. You''ll
    be prompted with a screen that has a list of configuration options. This screen
    enables you to skip'
