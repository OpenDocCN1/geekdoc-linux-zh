    # Obtaining the Source Files


    You''ll start by creating a new directory to download your source files. We believe
    in putting your downloaded source distributions in /usr/local/src/xxx, where the
    xxx is the purpose of the source files. For this scenario, call this mailserver.
    Create your /usr/local/src/mailserver directory as follows:


    ```

    mkdir -p /usr/local/src/mailserver

    ```


    Now, cd into /usr/local/src/mailserver and let''s grab those files!


    Before you proceed downloading the source files in this chapter, check for the
    latest versions at www.qmail.org. Look in two sections: the introduction and the
    "Author''s Enhancement Software for qmail" section. Failure to download the current
    versions could leave your system with a security hole resulting in serious risks.


    # Download qmail Source Files


    The first file you need to obtain is the actual qmail MTA. To download this, you
    can use wget: wget http://www.qmail.org/netqmail-1.05.tar.gz


    # Download ucspi-tcp


    The next file you need is the package that will create and receive TCP connections
    for qmail. This is called ucspi-tcp: wget ftp://cr.py.to/ucspi-tcp/ucspi-tcp-0.88.tar.gz


    # Download daemontools


    The daemontools application enables you to manage Unix services; in this case
    it will be qmail: wget ftp://cr.py.to/daemontools/daemontools-0.76.tar.gz


    # Download Vpopmail


    Vpopmail is a program written by Inter7 that manages virtual domains for qmail.
    It alters the way qmail handles mail and enables qmail to route e-mail to the
    proper domain and user based on the configuration: wget http://www.inter7.com/vpopmail/vpopmail-5.2.2.tar.gz


    You can download the latest stable version at www.inter7.com.'
