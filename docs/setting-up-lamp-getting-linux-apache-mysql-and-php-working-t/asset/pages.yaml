    #  Linux Passwords


    Linux passwords, as discussed earlier in this chapter, are stored in shadow files.
    The shadow files used by Fedora Core 2 are gshadow for users and groups, respectively,
    and are located with the non-shadow files in the /etc directory.


    Editing these files will show an encrypted string of characters. In order to be
    stored, the password has been encrypted using a one-way encryption algorithm (or
    hash) called Message Digest 5 (MD5). This means that the encrypted string is never
    translated back into its original format to match. Instead, the password you type
    when logging in is MD5 encrypted and matched against the stored encrypted string.
    This ensures that if the password is stolen, it will still be *relatively* secure.
    The term *relatively* is used literally here because the password can still be
    cracked.


    Methods to crack a password file of this type are commonly referred to as *brute
    methods*. The cracking program must try to guess the password by encrypting its
    guess and matching it against the encrypted string contained in the stolen pass
    file. This is why short passwords based on a single word are extremely bad. Usually
    the first method by trying someone to crack the file is to use every dictionary
    word.


    The installed package that allows for shadowing to be enabled is accompanied by
    some extra functionality. This extra functionality contains the commands enabling
    you to add, edit, and delete users and groups as well as the commands for password
    aging and expiration. Password expiration enables you to set a amount of time
    until a user has to change their password. This also helps to tighten security
    on your server.


