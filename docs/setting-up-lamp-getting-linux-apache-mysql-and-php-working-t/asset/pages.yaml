  md: '# Uninstalling


    Installing a package is simple. You do not even need to know the full version
    and release of a particular package. Simply use the following:


    ```

    rpm -e foo

    ```


    This command removes the package Foo unless there is another package that is dependent
    on Foo, in which case you will receive an error message:


    ```

    removing these packages would break dependencies:

    foo is needed by bar-2.0-2

    ```


    If you are aware of this problem and wish to remove the package anyway, use the


    ```

    rpm -e --nodeps foo

    ```


    command to force the removal. This flag is the same flag used when installing
    a package that is dependent on packages not yet residing on your system.


    # Querying


    Querying is used to determine what packages are currently installed as well as
    detailed information on each one of these packages. To find the basic information
    on a package use the following:-


    ```

    rpm -q foo

    ```


    This returns a single line of text that states, much like the rpm file itself,
    the version and release numbers. Similar to:


    ```

    Foo-1.1-2

    ```


    There are also package specification options, which can be declared on the command
    line if you wish to query by something other than the package name. They are as
    follows:


    +   -a This queries all installed packages.

    -f <file> This queries the package that was installed from the file specified.

    -p <package file> This queries the package specified.

    -i This displays package information including name, description, release, size,
