    -h Displays a short summary of available command-line options. Also known as help.


    -I Displays a list of non-dynamically loaded modules compiled into the server.


    -L Outputs a list of directives with arguments.


    -S Displays the settings as they are parsed from the configuration file.


    -t Runs syntax tests for configuration files only (with dcrooot check). This will
