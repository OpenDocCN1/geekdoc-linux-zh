    # Understanding the httpd.conf File


    Apache, like other Linux applications, has configuration files in runtime settings
    that can be configured and controlled by the system administrators. Apache uses
    the file named httpd.conf, which is located in the conf/ directory where you installed
    Apache. Let''s take a look at the important directives of this file:


    **Type standalone** Using the standalone directive, the ServerType enables your
    server to run as a daemon, as a service using inet, or as a standalone server.
    For the purposes of this book, you will run the server as standalone.


    **ServerRoot "/www"** The ServerRoot directive defines where Apache is installed.
    If you are running Apache as a local server on that particular machine, this directive
    should not be modified. If you wish to run Apache through the network while it
    is installed on another machine,'
