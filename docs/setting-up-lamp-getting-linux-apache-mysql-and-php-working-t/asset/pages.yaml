    # Downloading and Preparation


    Now that we have explained the important configuration directives and extensions,
    it is up to you to determine which ones you want to use with your installation.
    Because we want to ensure that you will be able to get up and running as smoothly
    as possible, we are going to show you how to do a basic PHP installation that
    will work. Let''s get started by downloading the packages:


    +   1. In the previous chapters of this book, you created a directory for downloading
    and installing your source files. Move to that directory now:


    ```

    cd /usr/local/src/webserver

    ```


    +   2. Go to www.php.net/downloads/ and select the PHP 5 5.0.0 under the Complete
    Code section. PHP.net uses a mirroring system, so you will have to choose the
    mirror that is closest to you for downloading your file. After you find a mirror
    (the closest is usually highlighted for you), copy the URL to the files and use
    the single-quotes in wget to follow the redirect:


    ```

    wget ''http://us3.php.net/get/php-5.0.0.tar.gz/from/this/mirror''

    ```


    +   3. Unpack the tarball:


    ```

    tar xpf php-5.0.0.tar.gz

    ```


    A new directory will be created for you with the contents of the tarball.


    # Compiling and Installing PHP


    The next step is to create your installation script. As we mentioned in previous
    chapters, it is always a good idea to create a script that has the configure options
    for your compilation in case you need to install again later.


    Your script is named php_install and contains the following:


    ```

    cd php-5.0.0

    ./configure \

    --with-apxs=/www/bin/apxs \

    --with-mysql=/usr/local/mysql \

    --enable-ftp \

    --enable-trans-sid

    ```'
  merge: -1
  pgno: 316
- img_proc: true
  md: 'This configure script utilizes the Apache SAPI extension for Dynamic Shared
    Object (DSO) and the system MySQL installation. The script also enables FTP support
    and transparent session ID support for PHP.


    If Linux distributions uses RPM packages and you are having problems getting a
    feature compiled, you may go to rpm.pbone.net and download the development package
    for the feature you are trying to install. Example: if you are enabling the foo
    package with PHP (--with-foo) and you get a complaint from PHP during compile,
    simply go to the RPM site and download RPMs for your platform for foo and foo-devel.
    Install these RPMs and try to compile.


    This is a basic set of options that do not require anything but Apache and MySQL
    installed on your system, so at this point your script should be configured to
    run this installation without any problems.


    Depending on which MySQL installation type you performed, you might need to modify
    the --with-mysql directive to the correct path of libmysqlclient located on your
    machine. In Chapter 9, "MySQL: Installation and Administration," you performed
    a manual installation; the path is /usr/local/mysql. With a pre-built package
    such as RPM, it might be /usr/mysql.


    If you want to enable additional extensions or features, you can do so by adding
    the directives for them in this script. Make sure that the last line of the script
    does not have a trailing slash but that all lines before the last contain the
    trailing backslash.


    +   1. Change the permissions on this script to enable you to execute and run
    it:

    ```

    chmod 755 php_install

    ```


    +   2. Run the installation script and watch for errors:

    ```

    ./php_install

    ```


    +   3. At this point, you should see the message Thank you for using PHP in the
    last portion of output in your console. If this is the case, you are ready to
    move on to the make process:

    ```

    cd php-5.0.0

    make

    ```


    +   4. Now wait a little while and enjoy the show during the make process. If
    you do not see any error messages on the last few lines of output, you are clear
    to proceed with the make install:

    ```

    make install

    ```


    +   5. Your next small task is to copy the php.ini example file to the correct
    location:

    ```

    cp php.ini-dist /usr/local/lib/php.ini

    ```'
