    # **mysqlbinlog**


    This command enables you to examine the contents of a binary log file. A *binary
    log file* stores a history of commands that have modified any data. Therefore,
    if an update command is performed and no rows were matched and updated, it would
    not be located in a log file. The occurrences are stored along with various other
    information such as timestamp, issuing thread, the statement text and so on.


    The correct syntax for mysqlbinlog usage is as follows:


    ```

