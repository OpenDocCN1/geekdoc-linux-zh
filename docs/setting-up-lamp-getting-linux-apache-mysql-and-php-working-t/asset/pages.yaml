  md: '# # Creating Interactive Websites with PHP and Web Services


    ## By Eric Rosebrock

    ISBN 0-7821-4279-6 US $39.99


    PHP and MySQL are great tools for building database-driven websites. There''s
    nothing new about that. What is new is the environment in which your site operates—a
    world rich in web services that can add value and functionality in many different
    ways. Creating Interactive Web Sites with PHP and Web Services walks you through
    every step of a major web project teaching you both the basic techniques and little-known
    tricks you need to build successful websites. And you can use those skills to
    develop dynamic applications that will meet your special requirements. Here''s
    some of what you''ll find covered inside:


    +   - Adding, deleting, and displaying data with a custom content-management system

    - Building a template site with PHP

    - Interacting with web services using PHP and MySQL

    - Creating and managing a user system and a shopping cart

    - Processing credit card payments using merchant accounts and third-party payment
    services

    - Tracking site statistics using PHP and MySQL

    - Enhancing your site with third-party scripts


    Tons of examples, complete with explanations and supported by online source code,
    will speed your progress, whether you''re a true beginner or already have PHP
    experience. This book is platform-agnostic, so it doesn''t matter if you''re deploying
    your site on Linux or Windows. You also get PHP and MySQL references, so you can
    quickly resolve questions about syntax and similar issues.


    ![](img/57ad032d6fdfa9b53a3ae7e29ad5fb2a_415_0.png)'
  merge: -1
  pgno: 415
- img_proc: true
  md: '# Tools, Skills, & Strategies

    for Software Engineers


    # Designing Highly Useable Software

    By Jeff Cogwell

    ISBN: 0-7821-4301-6

    US $39.99


    Inside, an accomplished programmer who has usability his

    usiness systematically explores the world of programming, showing how

    every aspect of the work is implicated in the usability of the final product.


    ![](img/57ad032d6fdfa9b53a3ae7e29ad5fb2a_416_0.png)


    # Effective Software Test Automation:

    Developing an Automated Software Testing Tool

    By Kanglin Li; Mengqi Wu

    ISBN: 0-7821-4320-2

    US $44.99


    Whatever its claims, commercially available testing software is not

    automatic. Configuring it to test your product is almost as time-

    consuming and error-prone as purely manual testing.


    There is an alternative that makes both engineering and economic sense: building

    your own, truly automatic tool inside. You''ll learn a repeatable, step-by-step

    approach, suitable for virtually any development environment.


    ![](img/57ad032d6fdfa9b53a3ae7e29ad5fb2a_416_1.png)


    # Coder to Developer: Tools and Strategies for

    Delivering your Software

    By Mike Gunderloy

    ISBN: 0-7821-4327-X

    US $29.99


    Are you ready to take the leap from programmers to proficient developer?

    Based on the assumption that programmers need to grasp a broad set of core

    skills in order to develop high-quality software, this book teaches you these

    critical ground rules. All of the techniques taught in this book are lang-

    age and platform neutral, and were selected to help you effectively design

    and develop complex applications.


