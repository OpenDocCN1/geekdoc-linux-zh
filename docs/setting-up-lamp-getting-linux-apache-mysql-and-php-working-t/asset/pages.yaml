    # Controlling Access to Services


    Maintaining security on your Linux system is top priority. One way to help lock
    down your system is by turning off or certain services. You can restrict access
    to specified services as well. Because all software is prone to user error and
    might contain bugs, it is best not to have services running that are not used.
    This also minimizes the usage of system resources.


    > NOTE In Chapter 6, "Linux Security," we will cover iptables. iptables enable
    you to restrict or grant access to specified services by IP addresses, IP blocks,
    and a number of important distinctions.


    In this section, we will focus on showing how services are configured for each
    run level and how to change these. You remember that in both Chapters 2 and 3
    you looked at changing the inittab file to change your default run level. You
    changed this level to read 3 for Full Multiuser mode. This run level determines
    what scripts and services are running during the boot phase. If you ever wish
    to change the run level immediately, you can use runLevel


    where runLevel is equal to the run level you wish to switch. This run will kill
    the run scripts located in the /etc/rc.d/rcX directory and then run the startup
    scripts located in the new run level''s rcX directory. In both examples, the X
    denotes the run-level value.'
