  md: '# /usr


    /usr directory is a major section of your filesystem. It contains files that are
    shared between users and should not be writeable by anyone but root. Some major
    software packages such as Apache will also install under their own subdirectory
    here. The following is a list of the subdirectories and a brief description of
    their content:


    +   - /usr/bin Most commands are stored here. All binaries that do not belong
    in the /bin or /sbin directories will be found here.


    +   - /usr/dict This directory contains dictionary files for multiple language
    support.


    +   - /usr/etc This directory contains configuration files for non-systemprograms
    such as the programs and commands contained in /usr/bin and /usr/sbin.


    +   - /usr/games Any default-installed games will be in this directory. Because
    this system will be used as a server, we do not cover them in this book.


    +   - /usr/include This is the proper directory for standard include files. Different
    programs that you can install will deposit C and C++ files here for use within
    their functionality. This allows for easy software development in Linux by using
    other source include files.


    +   - /usr/kerker Kerberos is a network authentication protocol designed to provide
    strong key-based encryption for information transferred via secure sockets and
    connections.


    +   - /usr/lib Files, which make the /lib directory’s, are for standard library
    files. They can be used by any programs installed, as well as your own if you
    develop software for linux.


    +   - /usr/libexec The /usr/libexec directory holds daemons and commands run strictly
    by other programs.


    +   - /usr/local The /usr/local directory is used when an administrator account
    is installing software locally. Apache and MySQL will install themselves here
    unless otherwise directed during the installation procedures.


    +   - /usr/sbin This directory houses programs and binaries for the system administrator
    that are not absolutely necessary for system operation. Repair files, system daemons,
    and administration files are kept here. Although most of them show permissions
    that allow any user to execute them, each one handles its own permissions whether
    or not the current user is allowed to run command.


    +   - /usr/share The /share directory contains files that are not dependent on
    a specific architecture. These files can be run by i386, Alpha, or any other architecture
    without problems. The /usr/share directory is also used to store documentation
    and sample configuration files for applications.'
