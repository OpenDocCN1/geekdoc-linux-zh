  md: "# 330 AppendixA • LAMP Quick Installation\n\n6. Add the following:\n\n```\n\
    #!/bin/sh\n# Change the part after the = to where your\n# IPTABLES is on your\
    \ system\n```\n\n```\nIPTABLES=/sbin/iptables\n\n# Flush existing going\n\n$IPTABLES\
    \ -F INPUT\n```\n\n```\n# Allow connections going outbound\n# from this machine\
    \ to reply back\n```\n\n```\n$IPTABLES -A INPUT -j ACCEPT -m state --state \\\n\
    \  ESTABLISHED -i eth0 -p icmp\n```\n\n```\n$IPTABLES -A INPUT -j ACCEPT -m state\
    \ --state \\\n  ESTABLISHED -i eth0 -p tcp\n```\n\n```\n$IPTABLES -A INPUT -j\
    \ ACCEPT -m state --state \\\n  ESTABLISHED -i eth0 -p udp\n```\n\n#Allow incoming\
    \ SSH requests\n\n```\n$IPTABLES -A INPUT -p tcp --dport 22 -j ACCEPT\n```\n\n\
    #Allow incoming DNS\n\n```\n$IPTABLES -A INPUT -p udp --dport 53 -j ACCEPT\n$IPTABLES\
    \ -A INPUT -p tcp --dport 53 -j ACCEPT\n```\n\n#Allow incoming HTTP requests (to\
