  md: '# Configuring Apache to Handle PHP


    Now that PHP is installed, you need to configure Apache to handle PHP files by
    passing them to the PHP engine for processing. You do this by adding some information
    into your Apache configuration file, httpd.conf. Here are the steps:


    +   At the very end of your httpd.conf file, add the following line:

    AddType application/x-httpd-php .php .php3


    +   If you wish to enable the source code highlight extension (.phps) for your
    files, add the following below the previous:

    AddType application/x-httpd-php-source .phps


    If you are using mod_ss1 with your Apache installation, you might want to find
    the line that says AddModule mod_php5.c and move it below the regular AddModule
    list instead allowing it to remain in the <IfModule SSL> section. Depending on
    which version of PHP you are installing, this might have already been done for
    you.


    +   Next, there is a directive in Apache called DirectoryIndex and it should be
    modified to add the PHP index files. Locate the following line:

    DirectoryIndex index.html

    And it to the following:

    DirectoryIndex index.php default.php index.html index.htm


    +   Now you are all set to test PHP. First, you need to completely stop and start
    Apache to ensure that the PHP module was successfully loaded:

    apachectl stop

    apachectl start


    +   If you are using Apache with mod_ssl, you need to start Apache as follows:

    apachectl startssl


    Now your PHP installation should be complete, and all you have to do is test it.


    # Testing the PHP Installation


    To test your PHP installation, you are going to create a simple script that will
    display the PHP information. If the script is executed and parsed properly, it
    will display a nice HTML page that is generated by PHP. If it is not executed
    and parsed properly, it will display the code that you typed into the script.


    Depending on how much of Chapter 8, "Apache Web Server: Installation and Configuration,"
    you followed, you might have a virtual host configured. If this is the case, you
    might need'
