  md: '# The PHP INI File


    During the installation process, you copied an INI file to the /usr/local/lib
    directory of your server. This file, although optional, handles the server-side
    configuration directives for PHP. Let''s break down the important elements of
    this INI file for better understanding. If we do not cover a section it is because
    that section is rarely modified and more than likely commented in detail of the
    php.ini file.


    engine


    Default: 0n

    Allowed: 0n, Off


    This setting enables or disables the PHP engine under Apache. This configuration
    directive can be useful for disabling PHP on certain Apache virtual hosts by using
    the Off setting.


    short_open_tag


    Default: 0n

    Allowed: 0n, Off


    The short open tag enables you to abbreviate the open tag that starts the PHP
    engine. The open normally consists of <?php; however, with this directive enabled,
    you can use only <?.


    > You should avoid developing scripts with the short tag if they are to be redistributed.
    There is a remote chance that your scripts or libraries might not execute if this
    setting is disabled on a remote server.


    asp_tags


    Default: 0ff

    Allowed: 0n, Off


    This setting enables those developers who have not fully moved on from using ASP
    to develop with ASP-style tags: <% %>. Why would you use these with PHP is beyond
    us and the PHP developers, so this setting is turned off by default.


    precision


    Default: 12

    Allowed: 12


    The precision setting displays the number of significant digits in floating-point
    numbers. The default setting is sufficient for everyday use; however, if you want
    your floating-point numbers to be less precise, you can lower this setting—and
    vice versa for more precise numbers.'
  merge: -1
  pgno: 320
