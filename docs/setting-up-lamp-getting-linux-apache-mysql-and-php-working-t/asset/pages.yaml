  md: '# Using TCP/IP


    TCP/IP originated from a research project funded by the United States Defense
    Advanced Projects Agency (DARPA). Research began in 1969 on a system called ARPANET,
    which stands for Advanced Research Projects Network. This network system was the
    beginning of what is now the Internet. Research continued on ARPANET as an experiment
    until 1975, when it was deemed operational and moved into service. After another
    eight years passed, the protocol suite TCP/IP was released and adopted by all
    machines on the network as a mandatory standard. By 1990 ARPANET was no more because
    it had morphed into what is now the Internet. This was the beginning of TCP/IP
    and the reason why it is so largely used throughout the world. Many companies
    have adopted the same protocol to use on local area networks (LANs) as well.


    In relation to our smoke signal example, TCP/IP would indicate where the people
    look for the smoke signals and how they send them. The problem for our natives
    is distinguishing whom the message is for. Back then a series of signals would
    properly determine its destination. In the twenty-first century, this is accomplished
    by using host names, IP addresses, and hardware addresses. The most verbose and
    expressive form of addressing is the host names. The natives in our example had
    names themselves, which were translated into smoke signals, whereas our computers
    are given names by us and the message is sent via packets. Addressing is crucial
    if we want our intended receiver to eventually get information.


    # Internet Protocol


    Let''s take a closer look at the Internet Protocol (IP). The Internet Protocol
    is the governing protocol in charge of the exchange of datagrams to a remote host.
    You will also hear the term packets instead of datagrams; these terms are almost
    completely interchangeable that datagram implies a packet that is just a packet
    of information by itself.


    It is important to note that IP is completely independent of hardware, which means
    it needs its own addressing scheme in order to transmit data. This is where IP
    addresses come in. We''ll speak more on this in later section—for now just why
    IP addresses are used.


    You also need to understand that Internet Protocol (by design) is not reliable.
    Say you access a website and begin downloading a large file that generates enough
    traffic to flood your gateway. Maybe your gateway is an old machine and tight
    on resources. Because your machine happens to be out of buffer space at the current
    moment, it is unable to accept the incoming datagram in order to forward it. Therefore,
    IP drops that packet—it will never resurface and is lost forever. Instead, it
    is the communicating hosts'' responsibility to check the integrity and completeness
    of the file being transferred and re-ask for the packets should be missing in
    action. This brings us to TCP.'
  merge: -1
  pgno: 132
- img_proc: true
  md: '# Transmission Control Protocol


    It is TCP''s job to control this interaction between hosts. TCP works by creating
    an interpreter for commands and programs to write to, thereby making the transmission
    of data transparent to programs wanting to interact with it. TCP does this by
    establishing a connection between one or more ports on each of the hosts. It breaks
    your information into packets and sends those packets to the receiving host. The
    receiving host puts the packets back together and verifies the integrity to make
    sure the file is okay. Again, this process is, in the majority of cases, completely
    invisible to the programs that use it.


    The downside of TCP becomes apparent when attempting to transfer multiple instances
    of small bits of information. Let''s say you retrieve a small amount of data from
    your database. Through TCP you would need to send at least three datagrams to
    establish a connection, then another two datagrams to verify the data, and yet
    another three to close the connection. In other words, you would have to send
    nine packets for only one packet of actual information. To combat this, the User
    Datagram Protocol (UDP) was created.


    # User Datagram Protocol


    The UDP protocol does not require a connection with another host in order to send
    its data. Instead, UDP will send its packet of information with the correct address
    addressed to it and hope that it is received by the proper computer. After the
    packet is received on the other end, the server will perform the requested operation
    or procedure and then place the return information in another packet to send back
    to the original host.


    There is also an optional feature of UDP that we touched on in Chapter 2, “Installing
    Linux”: the ability to run a checksum. This means that all of the checksum information
    must be stored within one packet but at the same note, gives that single packet
    the ability to know if it is correct or not.


    The disadvantage of UDP is a large packet size and the fact that UDP was not built
    with packet loss in mind. Because UDP will not handle resounding a packet, the
    originator of the request must request the original packet and have the server
    respect the request for the return packet. As you can imagine, not too many programs
    are able to fit their information into a single packet and so use of UDP is limited.
    Many applications and programs will use the speed benefit over TCP to their advantage;
    however; online games and most stream multimedia are excellent examples of such
    applications.


    # Ports


    Ports are like different radio frequencies on a single radio. If your radio had
    the capability to monitor every frequency at the same time with a different daemon
    or process, each separate'
