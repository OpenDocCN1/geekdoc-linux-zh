    # Preparing to Install Apache Web Server


    Installing the Apache Web Server is fairly straightforward, on the other hand,
    it could be a difficult task. There are multiple methods to install Apache and
    its components. We will cover the most common methods to install, configure, and
    run the server as enable modules and Secure Sockets Layer (SSL) support. Let''s
    get started with some preparation. The preparation consists of removing any pre-installed
    HTTP server packages, downloading the files, and applying the firewall rules to
    allow HTTP access.


    # Removing Pre-Installed Apache Web Server RPMs


    Your Fedora system might have Apache already installed, so you are going to remove
    the RPM packages from your system; you want to control how Apache is built on
    your system and you to be able to apply patches and updates as you come.


    The reasoning behind your unique installation is that most distributions such
    as Fedora, Red Hat, and others take a while to release security updates. You do
    not want to leave your system vulnerable while you wait for the distributions
    to release their upgrades, especially after announcements are made about these
    vulnerabilities.


    Now that we have justified the importance of running a custom-built installation,
    you can go ahead and remove any versions of Apache that might be installed. Follow
    these steps:


    +   1. Query the RPM database to see whether any Apache packages are installed:


    ```

    rpm -q httpd

    ```


    If you don''t see any result, then you do not have packages for Apache installed,
    and you may skip the rest of the steps. On our system, Apache was installed and
    this is the output:

    httpd-2.0.48-1.2'
