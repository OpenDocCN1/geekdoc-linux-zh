    the public HTTP requests.


    **PidFile /www/logs/http.pid** A PID file is the file responsible for reporting
    the process ID to the system. This should not be modified from the default configuration.


    **ScoreBoard /www/logs/http.scoreboard** The ScoreBoardFile is used to store internal
    server process information and should not be modified. It might not be needed
    by your system, just in case, leave this directive alone.


    **Timeout 300** The Timeout directive prevents a hung request from never ending.
    If the request exceeds this setting, it will de free the process for other connections.


    **KeepAlive On** The KeepAlive directive enables the processes to stay alive by
    allowing a client to make more than one request during a network session instead
    of opening and closing each time a process is handled. Leaving this setting to
    On will reduce the cycles required to operate your server by allowing multiple
    uses per thread. This directive is used for one-to-one connections.


    **MaxKeepAliveRequests 100** This directive defines the maximum number of requests
    to allow during a persistent connection. If you want to allow unlimited requests,
    set this to 0; however, you could make your system vulnerable. You should modify
    this number only if you have having errors during peak hours.


    **KeepAliveTimeout 15** The KeepAliveTimeout defines the number of seconds to
    wait for a particular user''s request before it frees the process to be used by
    another user. The default is 15 and should not be modified unless you fully understand
    what will happen to your server by doing so.


    **MinSpareServers 5** This directive indicates the number of minimum spare servers
    to spawn as a backup to catch any bursts to your server. A good starting point
    for a standard server is 5. You might want to evaluate this as your traffic increases.


    **MaxSpareServers 10** This directive indicates the *maximum number of spare servers
    to spawn as a backup to catch any bursts to your server. A good starting point
    for a standard server is 10. Once, you might want to evaluate this as your traffic
    increases. Also, you should note that this number should be larger than the MinSpareServers
    directive.


    **StartServers 5** This directive indicates the number of servers to start initially.
    As traffic starts to utilize this number of servers, the MinSpareServers and MaxSpareServers
