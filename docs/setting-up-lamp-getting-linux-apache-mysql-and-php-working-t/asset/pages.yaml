    # /lost+found


    Your /lost+found directory is used by the filesystem should any file become corrupted.
    Earlier, we discussed how the system might ask you during the boot process to
    run a system check via the fsck command if your system was not shut properly.
    If fsck discovers any files that were damaged, they will be placed in this directory.
    Each mounted drive will have its own directory for such an occasion.


    If you find any files, you should attempt to place them back where they originated
    and whatever you do, not remove this directory. If the filesystem needs to recover
    a lost file and needs to access this directory, you could experience unexpected
    results. You should also note that the files here will most likely lost their
    original names. You might want to open them in an editor or check the contents
