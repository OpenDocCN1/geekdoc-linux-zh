- img_proc: true
  md: 'In addition to adding both of these directives, there are also a few other
    concerns when administering your MySQL Server:


    +   - Never grant the super privilege to any users who will not be trusted administrators.
    This would allow the user to terminate client connections, alter server operation
    by changing system variables, and control replication servers—not advised for
    your average user.


    +   - Take care when granting the file privilege to nonadministrative users. Although
    you are not running your MySQL Server as root, you are running it as mysql, and
    mysql has access to all of the databases within your system. Having this privilege
    allows a user to write a file to any areas of the filesystem where mysql has access.


    +   - If your DNS is not a trusted source, do not use hostnames when granting
    privileges. Instead use IP addresses to specify where a user is allowed access
    from. This course does not apply if all of your users will be accessing your system
    from the local server.


    Let''s take a closer look at some additional startup directives that can be used
    to tighten security in your system. Remember that any of these can be added to
    your /etc/my.cnf files to automatically be taken into account when MySQL Server
    is run, or any other MySQL service using the database.


    **local-infile=0** Specifying this directive prevents the usage of local when
    using a load data statement. This will stop users from reading files on your system
    that the mysql user has access to.


    **safe-user-create** If this option is enabled, a user cannot create new users
    with the grant statement unless the user has privileges to the mysql user table.
    We will cover user creation and privilege granting in more depth later in this
    chapter.


    **skip-grant-tables** This option gives every user full access to every database
    and table on your system. This is not recommended unless one user is using the
    database.


    **skip-name-resolve** This will tighten down your privileges system by allowing
    only IP addresses to be specified in your grant tables.


    **skip-networking** This tells the MySQL Server to allow connections only through
    the socket file. This can be useful if only local users are accessing the MySQL
    Server.


    After you have followed all the instructions within this section, you should have
    a secure database server. You should still take care, when assigning privileges
    to MySQL users. You should never give more access than is needed to any single
    user. We will be covering this in greater detail in the next section, “Performing
    MySQL Administration.”'
  merge: -1
