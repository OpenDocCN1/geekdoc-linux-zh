  md: '# Configuring MySQL after Installation


    To allow anyone to access MySQL, add this:

    $IPTABLES -A INPUT -p tcp --dport 3306 -j ACCEPT


    Or, to allow only one IP address to access MySQL:

    $IPTABLES -A INPUT -p tcp --dport 3306 -s [IP ADDRESS] \

    -j ACCEPT


    NOTE You can have multiple rules for different IP addresses to access MySQL. If
    you want to allow an entire subnet, use an IP range such as 192.168.0.1/24.


    +   3. Remember to restart your firewall by either running the firewall script
    directly or by the service you created:

    /usr/local/etc/firewall

    Optionally:

    service firewall restart


    If you do not need to access MySQL Server from outside your network, you can simply
    leave your firewall rules alone.

    You should turn your attention to a few other things. In our previous examples
    of starting MySQL Server, you used the command --user=mysql. This ensured that
    MySQL was run as the user mysql, which you created before your installation procedure.
    The reason for this change is largely due to the file command within MySQL. The
    file command enables a user of MySQL to read any file that can be accessed by
    the user running the server. If MySQL Server was running as root, any user would
    be able to access and read any file within your system. This prevents an obvious
    security hole.


    To correct the problem:


    +   1. Create an /etc/my.cnf file if you have not already done so. Then add the
    following lines to your file:

    [mysql]

    user=mysql


    This directive will tell the MySQL daemon to run as the user mysql each time it
    starts. This is the easiest and most secure way to specify this.


    +   2. Another directive you might want to add is --skip-symlink. This prevents
    users from using symbolic links to your MySQL tables and potentially deleting
    them at if they have access. To prevent this, add a line under your mysql group
    within the file you just created (or modified), /etc/my.cnf. The line should read
    as follows:

    --skip-symbolic-links'
