    # Creating Disk Quotas


    In addition to monitoring the disk and receiving notifications from diskcheck,
    you can also monitor users'' and groups'' individual usage as. This type of monitoring
    is especially useful for limiting other users'' file size and file count on your
    system. This is the method that most companies use to limit people to a specific
    amount of space they are paying for.


    If you would to add this functionality, you need to make sure that the quota package
    is installed. If it is not, you need to locate the binary package and install
    it. For more information on this, see the "Managing Software" section in this
    chapter.


    There are four main steps to creating a quota system on your server:


    +   1. Edit the /etc/fstab file and enable quotas for each filesystem you need
    them.

    2. Remount those filesystems.

    3. Create the actual quota files and generate a disk usage table.

    4. Assign the quota to the users and groups.


    Let''s take a look at each step in more detail.


    # Editing the /etc/fstab file


    As the root user, you must first edit the /etc/fstab file. After you have this
    file open in your choice of editors, you can add the usquota and grquota directives
    to the column that contains the word defaults. You need to separate each directive
    with a comma, like so:


    ```

    LABEL=/home ext3 defaults,usquota,grquota 1 2

    ```'
