    # htdigest


    The htdigest program allows management of user files for digest authentication.
    Because digest authentication is not very common, this is rarely used. Usage is
    as follows:

    htdigest [-c] passwd realm username


    # htpasswd


    htpasswd is to create and update the password files for basic authentication of
    HTTP users. This is more commonly used than htdigest. We will cover the procedure
    to create pass-words and protect directories later in this chapter.


    # httpd


    httpd is the server daemon for apachectl and has a wide array of control options
    available for determining configuration and status of your server. Keep in mind
    that depending on the method you used to build Apache, some of these options might
    not be available.


    > The httpd command should not be invoked directly for start, stop, or restart
    commands. Instead, use the apachectl executable.


    The options are as follows:


    +   -d Sets the initial value for the ServerRoot directive.

    -f Defines a configuration file to run the server.

    -k Options: start, restart, graceful, and stop.

    -C Processes a directive *before* reading the configuration files.

    -c Processes a configuration directive *after* reading the configuration files.

    -D Defines a configuration parameter to be used within an <IfDefine> section.

    -e Defines the LogLevel during startup.

    -E Redirects error messages during startup to a specified file.'
