  md: '# Source Code versus binary packages


    The advantages of binary packages offer come mostly from the software that manages
    the packages. RPM, the Red Hat Package Manager, that we have discussed before
    comes with functionality that enables you to have greater control of what are
    installed as well as upgrading, downgrading, and removing. Think of a package
    in the same way as you would a package in real life. It''s a system of combining
    files or objects with a related purpose for easy shipping, distribution, and storage.
    Your virtual packages might come in forms other than .rpm files as well. .deb
    files and the Debian GNU/Linux Package Manager. However, because RPM has been
    widely adopted and is an integral part of the Fedora system, we will be concentrating
    on its operation.


    The biggest advantage of using a package is that the package contains information
    about itself. It contains all of its dependency information, versioning information,
    and installation locations for each file. This information is then read by the
    package management system; when a package is installed, the information is stored
    in a database that the manager uses to keep track of your packages. Now, rather
    than having to keep track of the installed files (and locating them yourself if
    they require replacement, modification, or deletion), you can use the functionality
    provided by your package management system to make changes automatically. This
    provides huge time savings on your part as an administrator, in both managing
    and organizing packages and files. In addition, you can save space by not having
    and unarchive the files located within the package to their own directory as you
    would with a tarball.


    Another major advantage touched on previously is the ability to upgrade installed
    software. This is not easily when using standard tariffs. RPM stores information
    on the configuration you specify during the installation procedure. This means
    that during an update you do not have to remember the exact parameters months
    or years ago to install the software. In addition to upgrading, you can also downgrade
    your software. If a certain version of the software does not work well on your
    system, you can use a simple command to revert to an older version of the software.
    RPM will even notify you if any of the installed packages (installed through RPM)
    have problems with your downgrade. You can make an informed decision on which
    packages should go and which packages should stay. This type of information is
    priceless in the rapidly growing market. The speed at which new versions of open
    source software are being released is increasing as more and more developers join
    the battle.


    Another bonus to using the RPM system is the ability to verify packages. Verification
    enables you to confirm whether a package has been installed as well as to determine
    exactly which version of that package is installed. It belongs to and where it
    came from!'
