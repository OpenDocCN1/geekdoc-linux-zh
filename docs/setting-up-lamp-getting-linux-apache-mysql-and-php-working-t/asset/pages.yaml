  md: 'E-mail is undoubtedly the primary means of communication with any Internet-based
    hobby. Therefore, you must ensure that your e-mail operations are conducted in
    a manner that will accommodate your needs with minimal risk or downtime.


    Determining your e-mail requirements might not be so easy. You have to figure
    out what you need and plan accordingly when setting up your server. The biggest
    mistake you can make is to start an operation without determining the requirements
    up front, especially when planning your e-mail server requirements.


    The solution to this problem is simple. Do you plan to use this server as an e-mail
    server? If so, you should install a higher-grade MTA, such as qmail, and you should
    read "Installing the qmail MTA" later in this chapter. On the other hand, if you
    are not going to use this server as e-mail server, and you only want the server
    to send e-mail, you can simply close port 25 on your firewall and leave Sendmail
    running.


    You will want port 25 closed to prevent anyone connecting to your Simple Mail
    Transfer Protocol (SMTP) and attempting to relay e-mails through it. Remember,
    Chapter 6 "Linux Security," set up some firewall rules that allow established
    connections to utilize the ports needed to complete your transactions. Based on
    rules, if your server utilizes Sendmail to send e-mails, the port will be available
    because you are establishing an outward connection first.


    In this chapter, we are going to discuss how e-mail works and the differences
    between e-mail servers. We will look at your needs for an e-mail server and provide
    solutions for requirements. We will show you how to download, install, and configure
    the qmail e-mail server—the Sendmail replacement—with virtual domain support and
    more. By the end of this chapter, you will have a strong understanding of qmail
    and how to manage it.


    # Understanding How E-Mail Works


    If you have lived in the virtual hosting and never maintained your own e-mail
    server, you might be surprised to learn that the elements involved are easy to
    manage and maintain. When I first started out on the Internet, I had no desire
    to learn what happened on an e-mail server. However, as my Internet career progressed
    and I started moving into the dedicated server scene, I no longer had someone
    to manage my e-mail accounts for. I was so forced to plunge into the life of an
    e-mail administrator and found that it was not as hard as some technicians make
    it.


    # The E-Mail Message


    In 1971, the first e-mail message in history was sent by an engineer named Ray
    Tomlinson. Until then, it was possible to send messages only to someone who was
    accessing the same'
  merge: -1
