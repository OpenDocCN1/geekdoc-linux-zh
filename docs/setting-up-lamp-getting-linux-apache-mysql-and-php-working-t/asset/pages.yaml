  md: ';; ANSWER SECTION:

    linuxforum.com. 38400 IN A 66.98.196.36


    ;; AUTHORITY SECTION:

    linuxforum.com. 38400 IN NS NS4.W3FREAKS.com.

    linuxforum.com. 38400 IN NS NS1.W3FREAKS.com.

    linuxforum.com. 38400 IN NS NS2.W3FREAKS.com.


    ;; Query time: 337 msec

    ;; SERVER: 192.168.0#53(192.168.0.1)

    ;; WHEN: Tue Feb 3 04:41:03 2004

    ;; MSG SIZE rcvd: 111


    The previous query was performed without specifying a type. By default, A was
    specified. The actual syntax for dig is as follows:


    ```

    dig @server name

    ```


    Our previous query also left off server, which is reserved for an IP address or
    hostname, we specified the name and the default type. Other types are MX, SIG,
    CNAME, ANY, and so forth.


    You can also perform a reverse DNS lookup through dig. Try using the command dig
    -x ipAddress and you will be returned an answer to what primary domain IP resolved.


    You can see the “Record Types” subsection for a complete list and short description.
    In addition to types of queries, there are almost 40 options you can specify to
    retrieve specific information about a server or domain name. Listed here are a
    few that we feel most important. Try experimenting with the options and learning
    the results:


    +   - b source This option sets the source IP address to be the given IP. This
    IP address must be bound to a local network device.


    +   - f filename Specifying this option enables dig to operate in batch mode,
    retrieving its list of queries from the file specified. Each query should be constructed
    as it would on the command line and should be one line.


    +   - p port If you plan on querying a nonstandard port, you can simply specify
    this option followed by the port number.


    +   -x ipAddress This enables you to perform a reverse DNS lookup, which means
    that the specified IP address will be resolved into a domain name. When this occurs,
    you do not need to specify the name or type.'
