  md: '# Chapter 5 • Network Connectivity


    Networking, as defined by Merriam-Webster online is “the exchange of information
    or services among individuals, groups, or institutions.” In this strict definition
    of the word, we can see that forms of networking have been around for far longer
    than the age of computers.


    A good example of networking is smoke signals by Native Americans to others located
    too far away for verbal communication. If one American Indian needed to warn another
    on the other side of a plain, they might use smoke signals to communicate without
    having to travel distances. If that message needs to be passed on, the receiver
    of the first message would resend or broadcast to whomever was next on the way
    to its intended destination. This is networking. When information is passed on
    multiple points before arriving at its intended destination, a network is established
    that makes that possible. The example of smoke signals is referred to as an ad
    hoc network—a network fashioned from what is immediately available. It does not
    run through a planned system that contains a router to centralize the distribution
    of data. In the days of early North America, the signals were seen and interpreted
    by the nearest individuals who could then resend the message as they saw fit toward
    the final destination.


    Hundreds of years later, in the present day and age, we have computers sending
    information across wires, fiber optics, and satellites to millions of users across
    the world. Anyone on a computer can reach anyone else on a computer throughout
    the world, assuming they are both connected to the same network. In the vast majority
    of cases, of course, that network is the Internet.


    The Internet is a massive network, not simply a few sending smoke signals to people
    they already know. Procedures and standards have to be in place in order for networking
    equipment to know where the information is from and where it’s going. The network
    must also have a universal language so that each machine can communicate with
    the world; this is referred to as a protocol.


    There are a few protocols that have been developed over the years. The first and
    most popular, is TCP/IP, which stands for Transmission Control Protocol/Internet
    Protocol. We will be covering this extensively later in this chapter. The other
    main network protocols are UUCP and IPX. UUCP, or Unix to Copy Protocol, was originally
    developed for sending and receiving news and mail messages across dial-up telephone
    connections. Because this has become a mostly outdated practice for server-level
    applications, UUCP has been pushed to the background. This is not to say, however,
    that UUCP is not suited for specific applications. The last protocol, IPX (Internet
    Packet Exchange), is used most commonly to connect to NovellNet Environments.
    Because this book is a guide to setting up and administering a web server, we
    will be focusing primarily on TCP/IP.'
  merge: -1
  pgno: 131
