    # Configuring cgi-bin Directories


    Even though this book is written for PHP, we acknowledge that you might need to
    use CGI scripts occasionally. Therefore, we will show you how to create a cgi-bin
    directory to house your executable CGI scripts.


    +   1. Let''s start by ensuring that your cgi-bin directory is created and has
    the proper permissions.


    ```

    mkdir -p /home/www.yourdomain.com/public_html/cgi-bin

    chown 755 /home/www.yourdomain.com/public_html/cgi-bin

    chown -R someuser.somegroup /home/www.yourdomain.com/public_html/cgi-bin

    ```


    NOTE


    The traditional method of using cgi-bin directories is to place them outside of
    your document root and use the cgi-bin ScriptAlias and Alias directives. However,
    this method can be used if you understand that there might be minimal risks involved.


    +   2. Edit the /www/conf/hosts/www.yourdomain.com.conf file and add the following
    lines to the end of it:


    ```

    <Directory /home/www.yourdomain.com/public_html/cgi-bin>

    Options +ExecCGI

    AddHandler cgi-script cpl

    </Directory>

    ```


    +   3. Because you are editing the www.yourdomain.com.conf file, you need to add
    one more line into the <VirtualHost> section. Add the following lines directly
    above the <VirtualHost> tag:


    ```

    ScriptAlias /cgi-bin/ /home/www.yourdomain.com/public_html/cgi-bin/

    ```


    +   4. Test your configuration file changes and restart the server.


    ```

    apachectl configtest

    apachectl stop

    apachectl start

    ```'
