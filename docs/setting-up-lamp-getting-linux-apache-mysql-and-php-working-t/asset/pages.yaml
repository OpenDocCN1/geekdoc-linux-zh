- img_proc: true
  md: 'each slave server you will need to add slave_id value to the /etc/my.cnf files
    as. After you have made these changes, restart each of the servers so that the
    changes will take effect.


    3. Next, you will need to set up an account on the master server that the slave
    will be using to connect. A special privilege is required for this user, called
    REPLICATION SLAVE. Because you will be using this account for replication only,
    you do not need to assign any additional privileges. If you are using more than
    one slave server, you do not need to create multiple users. In this example, you
    will be creating a user named slave_account with a password of yes_master. You
    should make sure that this slave server can access the master only from the domain
    it resides in, which is mydomain.com. To create the account, you will be using
    the MySQL Client. Log in as the root user and issue the following GRANT command:


    ```

    GRANT REPLICATION SLAVE ON *.*

    TO ''slave_account''@mydomain.com''

    IDENTIFIED BY ''yes_master'';

    ```


    Remember that if you are planning on using the LOAD DATA FROM MASTER command on
    your slave, you will need to add additional privileges to the account. You should
    grant the SUPER and RELOAD privileges to this account in SELECT privileges for
    each table that will be replicated. For the purposes of this book, we will be
    using the tar command to copy our database so we will not be assigning these privileges.


    4. Now, with your user created, you will need to lock the current state of your
    database. Perform the following:


    ```

    FLUSH TABLES WITH READ LOCK

    This prevents any changes from taking effect while you tar the database and transfer
    it to your slave server(s).

    ```


    If you exit the MySQL Client in this terminal (or terminal window) it may cause
    MySQL to remove the read lock. It is recommended that you open a new terminal
    and stay connected the MySQL Client.


    5. With the database locked, open a new terminal window or switch to a different
    terminal and move into the /usr/local/mysql/var directory.


    6. Perform the following:


    ```

    tar -cvf /tmp/mysql.snapshot.1.tar

    This backs up your database to the tmp directory. If you wish to use only a specific
    database, use the tar command to tar only that database. You might also wish to
    exclude the mysql database from your tar so that the user accounts and privileges
    will not be transferred over.

    ```'
