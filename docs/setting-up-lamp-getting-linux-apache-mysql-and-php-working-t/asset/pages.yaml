  md: '# messages it classifies as spam

    rewrite_subject 1


    # This is the value that will be prepended to the subject line

    # of messages classified as spam

    subject_tag [SPAM]


    # Put the spam report into the headers of the message,

    # rather than in the body

    report_header 1


    # Use condensed wording for the spam report

    use_terse_report 1


    Notice this next directive: report_safe 1 is changed from the default of 0 to
    a 1. The body of the e-mail will be saved as an attachment in place of the original
    body. This prevents spam from being opened by your users and verifying to the
    spam senders that you''ve read their spam (verification would further encourage
    more spam in the future).


    # As of SpamAssassin 2.50, if SPAM is detected, by default

    # a new report

    # email will be created and the spam message will be

    # attached as a MIME part.

    # We don''t like this behavior so we turn it off

    report_safe 1


    # Don''t modify the content-type: mime header of suspect

    # mail!

    # Usually you would be running a virus checker from qmail

    # Scanner which will block out

    # any such nasty attachments

    defang_mime 0


    # Enable SpamAssassin''s RBL checking features :

    # Although we have already done some RBL filtering earlier

    # in qmail''s rblsmtpd program,

    # it is still recommended to turn on RBL checking in

    # SpamAssassin, as it will run

    # checks against a variety of different RBL sources, and

    # the results will help

    # tag spam more accurately

    skip_rbl_checks 0


    # If we haven''t received a response from the RBL server in

    # X seconds, then skip that test

    rbl_timeout 3'
