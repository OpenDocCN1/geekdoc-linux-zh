  md: '# Understanding Apache 1.3


    # 203


    # MaxClients MaxClients number


    This sets the limit of simultaneous requests the server can handle. This is set
    to 256 by default, and to increase this number you will need to modify the http.h
    file and recompile Apache. Look for the HARD_SERVER_LIMIT variable if you are
    attempting to do so.


    # MaxKeepAliveRequests MaxKeepAliveRequests number


    This limits the number of requests allowed per connection.


    # MaxRequestPerChild MaxRequestPerChild number


    This is set to 0 by default, a couple of key benefits can be achieved by setting
    this value to something greater than the default. First, it limits the amount
    of memory a process can take up in memory leaks and, second, it helps reduce the
    number of processes when the server load reduces and children are left lagging
    behind.


    # MaxSpareServers MaxSpareServers number


    This sets the number of idle child server processes allowed. If you are running
    an extremely high-traffic site, you might wish to have a greater number of idle
    processes. This speed will up access time by the client, giving the client a better
    chance of accessing an idle process rather than having to wait for a child server
    process to spawn.


    # MinSpareServers MinSpareServers number


    This controls the minimum number of servers to spawn at startup. This feature
    is used with MaxSpareServers and should be set to a lower number than MaxSpareServers.


    # NameVirtualHost NameVirtualHost addr[::port]


    This is a required directive when configuring name-based virtual hosts. It is
    possible to supply a domain name with NameVirtualHost but it is highly recommended
    that you use IP addresses and wildcards.


    # Options Options [+-]option [+-]option ...


    This controls what features are available in a certain directory or for a certain
    file. For all the different options, refer to the Apache documentation.


    # PidFile PidFile file-path


    This sets the file where Apache will store the process IDs for each of its children
    servers. This is used only in standalone mode.


    # Port Port number


    Any number from 0 to 65535 can be specified in this directive. Of course, the
    default is 80 for standard requests and 443 for SSL requests.'
