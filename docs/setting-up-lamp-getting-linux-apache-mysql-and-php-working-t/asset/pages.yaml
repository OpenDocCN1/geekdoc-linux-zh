  md: '# Using This Book''s Code


    During the course of this book we cover a myriad of different configuration files
    and scripts. Some of these scripts require a bit of entry on your part, so in
    effort to speed up and simplify this process, we have made these files available
    to you for download from Sytex. To acquire these files, follow these simple steps:


    +   1. Go to the Sytex website at www.syex.com.


    +   2. Search by author, title, or by the unique part of the ISBN (4337).


    +   3. Click the book''s link.


    +   4. Click the download link.


    When you get to the download page, you''ll be able to download lampBookFiles.zip,
    which contains all the code used in this book.


    Contained inside this zip file will be another compressed archive. This archive
    contains a duplicate copy of the scripts, but they have been archived and compressed
    using tar; each of these files has already had the proper permissions assigned
    to it as well, which were designed to be in sync with the context of the book.
    These files are ready for you to copy to the location specified in the exercises,
    and may be used as unless otherwise instructed. After you have downloaded the
    zip file and uncompressed it, you may then follow the below steps to uncompress
    the Linux version of the files:


    +   1. Transfer the lampBookFile.tar.gz file to your Linux machine using your
    choice of transfer methods.


    +   2. Once the file is in the directory where you want the files to located,
    use the command: `tar xvf lampBookFile.tar.gz`


    You should now have a complete copy of all the scripts used during this book,
    which are not installed by default with Fedora Core 2. For a complete understanding
    of what these scripts do and how they work, pay close attention to those areas
    of the book that detail each script.'
  merge: -1
