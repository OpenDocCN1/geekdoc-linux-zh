    Let''s assume that your machine has an IP address of 192.168.1.2 and we wish to
    establish an SSH connection with 192.168.1.3. Because your subnet mask is 255.255.255.0,
    your computer knows that you are on the same network as the remote computer you
    wish to contact. Therefore, you send out an ARP broadcast, ARP, which stands for
    Address Resolution Protocol, is in charge of determining the MAC address for the
    IP address you wish to contact. Now the ARP request will carry the MAC address
    of your local computer as well as the IP address you wish to contact. Every machine
    on your network will receive this request and process to determine whether that
    computer is the proper computer. Only the computer with the IP address matching
    the request will answer. The packet sent back by that computer will include that
    computer''s MAC address and will be addressed to your MAC address. If a packet
    is addressed to a specific MAC address, every other computer on your network will
    completely ignore the packet and not waste resources reading it.


    If your address were to be somewhere outside your subnet, the router to access
    this network would reply with its MAC address. This enables the packet handling
    and forwarding to remain invisible to the networking layer specific to your machine.
    The major plus is that you will never have to deal with a device''s actual MAC
    address. You might hear the term Data-Link layer used to describe this hardware
    routing.


