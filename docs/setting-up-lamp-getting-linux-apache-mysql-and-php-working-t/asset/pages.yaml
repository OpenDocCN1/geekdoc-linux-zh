  md: '# Managing Services and Processes


    In addition to these commands, you can also reload a configuration file without
    stopping the service. This will not work for all services if you wish to try it,
    simply use serviceName reload. You should notice that the only thing that changes
    for commands is the last argument, which is the function you wish to perform on
    the service.


    The last commonly used function is the graceful parameter. This allows to stop
    and start a service with the least amount of downtime. This is especially useful
    if you are running a live server and you do not want invalid requests sent to
    your users. There is another major benefit to using graceful: If the service cannot
    be restarted successfully with the new configuration file, it will not restart.
    Instead, the current instance of the service will continue to the state that it
    is currently in.


    You can also start and stop services using the actual service in the command line.

    /init.d/httpd start


    to start your web server as opposed to using the service command. There are no
    important features or advantages to one over the other; it is merely a matter
    of preference. It might be easier not to remember where the service daemon is
