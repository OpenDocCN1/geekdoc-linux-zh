    # Using Linux Checklist


    This has been your first very serious chapter. You should feel like you are well
    on your way to becoming a system administrator for Linux. With this chapter under
    your belt, you are fully prepared to begin learning how to administer your system.
    The following is a list of points you should know before continuing to the next
    chapter:


    +   - Know each file called during the boot process and what it puts into action.

    - Be able to install an RPM package.

    - Understand run level scripts.

    - Comprehend the login process.

    - Know some of the functionality the Bash shell offers.

    - Understand Bash special characters.

    - Know the commands listed in the “Navigating Through Linux” section.

    - Be aware of the hierarchy of the Linux filesystem and know the difference between
    the types of files stored in each one.


    This chapter should have opened your eyes to the true power of Linux. With an
    understanding of the Linux filesystem and how to navigate through the Linux waters,
    you should begin to understand just how easily customized a system like this is.
    In the next chapter, you''ll test these waters by performing some basic administration
    tasks.'
