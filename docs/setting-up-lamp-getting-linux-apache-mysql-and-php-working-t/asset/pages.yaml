  md: '# 258 Chapter 9 • MySQL: Installation and Administration


    These files can contain any options that can also be specified on the command
    line. For a full list, refer to Appendix B. For now, let''s take a look at the
    proper format of a configuration file. To do so you will look at two typical configuration
    files. The first is considered a global configuration file:


    ```

    [client]

    port=3306

    socket=/tmp/mysql.sock

    ```


    ```

    [mysql]

    port=3306

    socket=/tmp/mysql.sock

    key_buffer_size=16M

    max_allowed_packet=1M

    ```


    ```

    [mysqldump]

    quick

    ```


    Here you will see that the directives listed are divided into three groups, the
    first of which is called client. Each group is specified by the use of brackets
    enclosing the name. The following two groups are the names of programs that MySQL
    recognizes. The client group enables to specify options for using the MySQL Client
    application you installed. The two simple directives here specify 3306 as the
    port to connect to when using the client as well as the location of the socket
    file.


    The mysqld portion defines the same directives with the addition of two new variables
    as well: key_buffer_size and max_allowed_packet. You can find the exact meaning
    of these directives in Appendix B. For now you should just be aware of the format
    they are specified in. They appear much as a command-line directive but without
    the preceding two dashes (--). The last group, mysqldump, sets the type of dump
    to be quick. This can be overwritten by specifying a new option on the command
    line.


    Now that you have seen an example of a global configuration file, let''s take
    a look at a few options that will be set in a typical user configuration file:


    ```

    [client]

    password="my_password"

    ```


    ```

    [mysql]

    no-auto-rehash

    set-variable = connect_timeout=2

    ```


    ```

    [mysqlhotcopy]

    interactive-timeout

    ```'
