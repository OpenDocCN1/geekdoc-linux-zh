    ```


    # Installing Apache Web Server 1.3


    Because Apache Web Server is flexible, there are different methods of installing
    it. One method uses Dynamic Shared Objects as modules, whereas the traditional
    method of installation does not.


    In addition to these installation methods, you want to install an SSL-enabled
    web server. If you want to use an SSL-enabled web server, the installation procedure
    is slightly different. We will show you how to install an SSL-enabled server by
    using mod_ssl1 with the Dynamic Shared Objects method.


    Let''s begin by installing Apache with Dynamic Shared Objects—the recommended
    method of installation.


    # Using the Non-SSL Dynamic Shared Objects Installation Method


    Now that you have downloaded the source code, you need to configure, build, and
    install it. This is where you can pick a crossroad to follow. As we have said,
    there are multiple methods'
