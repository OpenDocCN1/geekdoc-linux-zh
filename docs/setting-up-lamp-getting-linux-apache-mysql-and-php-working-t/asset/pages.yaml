  md: '# Understanding Firewalls


    A firewall is a computer or appliance that connects two or more networks and has
    the ability to filter out packets by consulting predetermined tables that the
    system administrator must specify. A firewall can be as simple as allowing only
    one computer inside one network to access the second network at all, or it could
    be complex enough to allow only information from a specific IP address to reach
    a specific destination for a specific port. Although firewalls vary in complexity,
    all aim to accomplish two goals: keeping users from getting in and keeping insiders
    from getting out. There are different methods of getting around this, but all
    of them fall into either the filtering or proxy categories.


    The first type, filtering, works on a network level. This is the same type that
    is built into the Linux kernel and blocks selected network packets by preset rules.
    Each incoming and outgoing packet is analyzed for its type, source and destination
    addresses, and port. Because so little data is read in logged, these types of
    firewalls use few resources and low latency times. A filtering firewall does not
    allow users to be able to identify themselves, and cannot not log to a firewall
    and ask for privileges. Instead, your privileges to and from the outside world
    are based on your IP address. This can present problems if different users travel
    to computer and need different levels of access from their peers, which brings
    us to our next type of firewall: the proxy firewall.


    The proxy firewall is meant more for monitoring traffic coming from your network
    than it is for keeping traffic out. It leaves hard evidence of exactly what kind
    of data. Proxies are divided into two categories: application and SOCKS.


    An application proxy allows users from the inside network to log on to and then
    the proxy will access service instead of the user directly connecting to the server.
    The proxy transfers the proper information to the user and becomes invisible to
    the user. Because every bit of information is taken in a proxy, whether it''s
    a word from a web page or a file from FTP server, an application proxy can log
    and change it.


    A SOCKS server is much like an old switchboard. It simply cross-wires your computer
    to another one outside. This type of firewall does not allow the user to log in;
    however, it allows you to record the users'' destinations.


    There are many ways to configure a firewall. You might wish to have a stand-alone
    firewall system for a larger network and configure your switch to connect directly
    to the firewall, or you could simply use a Linux machine to be both your firewall
    and router. Regardless of your type of firewall, it needs to be located between
    your LAN and the outside world. If your LAN has more than one connection to the
    Internet, you need to have both of these ISPs run through your firewall. Any deviation
    from this will leave your network open for attack.'
