  md: '# Security and Safe Mode


    The PHP INI file enables you to crack down on the security settings if you would
    like. You can hide PHP, limit memory usage and execution times, and enable safe-mode
    operation.


    Safe mode is ideal for virtual hosting environments. It enables you to lock down
    the way PHP operates for the system. This prevents users from doing many malicious
    things such as opening system core files, reading other client''s files, tampering
    with system information, or executing certain functions.


    # safe_mode


    Default: Off


    Allowed: On, Off


    This is the master safe mode setting. If enabled, the rest of the safe mode settings
    will be enforced with their default values. If you are not running a virtual hosting
    client system, you can opt to leave this setting and disregard the rest of the
    safe mode settings.


    > If you are a security-conscious server administrator and make these settings
    effective in a virtual hosting environment, be prepared for a barrage of complaints
    from your PHP users, especially when using third-party PHP scripts. Most third-party
    PHP scripts are not developed with these settings in mind and might fail when
    they are executed.


    # safe_mode_gid


    Default: Group ID/User ID


    This setting allows access to files owned by the user running the script.


    > You should define this setting in an Apache virtual host configuration and use
    the User ID for that virtual host file to this setting.


    # safe_mode_include_dir


    Default: Empty—not defined


    Allowed: Path to directory (/directory/path)


    This setting defines a specific path of files to be included, and the security
    checks (safe_mode_gid) are bypassed.'
  merge: -1
  pgno: 323
- img_proc: true
  md: '# safe_mode_exec_dir


    Default: Empty—not defined

    Allowed: Path to directory (/directory/path)

    This setting defines a specific path of files that are allowed to be executed
    by exec family

    functions: exec, shell_exec, and so on.


    # safe_mode_allowed_env_vars


    Default: PHP_

    Allowed: Colon-delimited list of prefixes

    This setting allows only the listed environment variables to be modified.


    > Using the default PHP_ setting allows any environment variable to be modified,
    which can induce a security risk.


    # safe_mode_protected_env_vars


    Default: LD_LIBRARY_PATH

    Allowed: Path or environment variable path

    A colon-delimited list of environment variables that the user will not be able
    to modify by using the putenv function. These variables will be protected even
    if the safe_mode_allowed_env_vars setting is set to allow changes to them.


    # open_basedir


    Default: Empty—not defined

    Allowed: Path to directory (/directory/path)

    This setting limits all changes to the defined directory. This should really be
    used in a virtual hosting or directory configuration.


    The open_basedir setting is independent of the safe_mode directive, which means
    that it does not matter whether safe_mode is on or off.


    # disable_functions


    Default: Empty—not defined

    Allowed: Comma-delimited list of function names

    This setting enables you to disable specified functions.'
