  md: '# Introduction


    Welcome to Setting Up LAMP: Getting Linux, Apache, MySQL, and PHP Working Together.
    This book is written for people out there who either struggle with this technology
    or just want a simple solution that is compiled by the experts. We have taken
    years of experience, problem solving, experimentation, and most importantly implementation,
    and bundled it all together as an easy-to-understand practical guide for you to
    utilize as you set up your LAMP web server. In this book you will find the following
    topics thoroughly explained:


    +   - Linux Throughout this book you will learn where it came from and how it
    developed, which flavor of Linux to use, how to install it, and, most importantly,
    how to use it. Each chapter is a practical guide and exercise on everyday Linux
    techniques. If you are new to Linux, simply following the examples in this book
    will definitely bring you to a level of understanding and application through
    real-world techniques that will hone your skills as a Linux user or administrator.


    +   - Apache Web Server We discuss how to download, build, install, administer,
    and configure the Apache Web Server. We show you the best methods of how to build
    your server, understand the configuration directives, configure virtual hosts,
    set up password-protected directories, and much more. You will have a fine understanding
    of and feel comfortable running your own Linux-based Apache Web Server when you
    have completed this book.


    +   - MySQL This book discusses how to download, build, install, administer, and
    configure MySQL. We show you the best methods for running your own MySQL server,
    protecting it from the outside world, and creating user accounts, databases, and
    tables. We cover MySQL 5, which is the newest version, and we cover its excellent
    features in depth.


    +   - PHP This book discusses how to download, build, install, administer, and
    configure the PHP: Hypertext Preprocessor for your web server. Additionally, we
    detail how to understand PHP. We do not show how to develop websites with PHP,
    however; we focus on the server-side aspects of configuring, securing, and running
    it.


    +   - qmail E-mail Server In this book, we tackle one of the most popular e-mail
    servers: qmail qmail is a robust replacement for the old Sendmail application,
    and we show you how to download, build, install, and configure it to run efficiently
    with spam filters, antivirus software, IMAP, POP3, and SMTP protocols. By the
    time you are finished with this book, you will have a top-notch, high-quality
    e-mail server that can be used in any application, large or small.'
  merge: -1
  pgno: 20
