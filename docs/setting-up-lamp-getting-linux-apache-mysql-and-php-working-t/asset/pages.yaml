- img_proc: true
  md: '2. If you have a result, find the dependencies of the package so you can remove
    them first:

    rpm -q --whatrequires httpd


    On our system, the result returned was as follows:

    redhat-config-httpd-1.1.0-5


    3. Begin removing the packages from your system, starting with the dependencies:

    rpm -e redhat-config-httpd


    4. Ensure that no Apache servers are still running, and if they are, kill them:

    ps aux | grep httpd

    killall httpd


    The system appears to be clean of Apache, so let''s move on to obtaining the source
    files and unpacking them.


    # Downloading and Unpacking Apache


    To prepare for installation, you need to download Apache 1.3. We recommend you
    obtain the files from the official source, so go to httpd.apache.org/download.cgi
    and select the Unix Source under the Apache 1.3 section. The file should be named
    something similar to apache_1.3.XX.tar.gz.


    > We left off the exact version number by the time you download, it might be higher
    than the one we are using at the time of this writing.


    +   Use these steps to unpack Apache:

    1. Create a new directory:

    mkdir -p /usr/local/src/webserver

    On our Fedora system, we created a new directory located at /usr/local/src/webserver.

    2. Download the source code using wget:

    wget ''http://apache.archive.com/httpd/apache_1.3.29.tar.gz''


    > We should check http://httpd.apache.org for an updated download URL. The example
    URL in this step may become invalid over time.


    +   3. Unpack the source code file:

    tar zpxf apache_1.3.29.tar.gz

    You should see a directory named similar to apache_1.3.29 now.'
