    # disable_classes


    Default: Empty—not defined

    Allowed: Comma-delimited list of class names

    This setting enables you to disable specified classes.


    NOTE

    disableable_classes setting is independent of the safe_mode directive, which means
    it does not matter whether safe_mode is on or off.


    # expose_php


    Default: On

    Allowed: On, Off

    This setting enables you to hide PHP from the header output and web server signature.
    if you do not want anyone to know that you are running PHP (other than by seeing
    the .php in your filenames), you can do so by disabling this directive. This feature
    will at least allow you to hide version of PHP you are running in case you are
    on vacation when a major security exploit is found.


    # max_execution_time


    Default: 30

    Allowed: Number of seconds

    This is the number of seconds you will allow a PHP script to run before it dies.


    WARNING\If you set max_execution_time to zero (0), your scripts might run forever
    and potentially take all of your server resources, and your server might become
    inaccessible. Be careful.


    # max_input_time


    Default: 60

    Allowed: Number of seconds

    This is the number of seconds a script can take to parse requested data.


    WARNING\If you set max_input_time to zero (0), your scripts might run forever
    and potentially take all of your server resources, and your server might become
    inaccessible. Be careful.'
