    # Network Connectivity Checklist


    After reading this chapter, you should have a good idea of the philosophies behind
    a network and the travel and flow of information across the many aspects of it.
    Although this chapter did not delve into specific setups for any given case, it
    did cover the philosophy and methods of the techniques used to create a smooth-running
    network. You should have a firm grasp of the following areas before continuing:


    +   * Understand TCP/IP.

    * Know the difference between TCP and UDP.'
