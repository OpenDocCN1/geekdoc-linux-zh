  md: 'Ou''ve learned quite a bit over the course of this book, and we''re sure you
    will have a few questions on the many options available throughout all the installations.
    Every installation is different because of its unique purpose, and your future
    with LAMP depends upon your being able to gain further knowledge outside the scope
    of this book.


    There are many options available when you are looking for answers to questions
    or research-installation types. In this appendix, we''ll cover various methods
    of finding information and keeping up-to-date with the latest software and patches.


    # # Books on Open Source Technologies


    The following selection of books is organized by technology.


    # # Linux


    +   * Hunt, Craig. Linux Network Servers. Alameda, Calif.: Syex, 2002. This book
    is an excellent source of information for running and managing Linux network services
    on a server.


    +   * Hontaón, Ramón J. Linux Security. Alameda, Calif.: Syex, 2001. This book
    goes far in depth on many aspects of Linux security.


    +   * Jang, Michael. Mastering Red Hat Linux 9. Alameda, Calif.: Syex, 2003. This
    book is written by a Red Hat Certified Engineer (RHCE) and covers everything from
    installation to networking.


    +   * Smith, Roderick W. Linux Power Tools. Alameda, Calif.: Syex, 2003. This
    book shows step-by-step instructions on how to enhance and optimize your Linux
    system.


    +   * Stanfield, Vicki, and Roderick W. Smith. Linux System Administration. Alameda,
    Calif.: Syex, 2003. This book provides an excellent set of instructions on how
    to maintain and maintain your system.


    # # Apache


    +   * Aulds, Charles. Linux Apache Web Server Administration. Alameda, Calif.:
    Syex, 2002. This book is a complete and advanced guide to the Apache web server.
    It teaches all of the standard and advanced techniques needed to administer Apache
    on a Linux server.


    +   * Coar, Ken, and Rich Bowen. Apache Cookbook. Sebastopol, Calif., 2003. This
    book is a collection of problems, solutions, and practical examples for anyone
    who deals with Apache. Sticking to its name, it includes recipes for many aspects
    of your server.'
  merge: -1
  pgno: 391
- img_proc: true
  md: '# MySQL


    DuBois, Paul. MySQL. 2d ed. Indianapolis, Ind., 2003. This book is another excellent
    resource of MySQL information.


    Gilfillan, Ian. Mastering MySQL 4. Alameda, Calif.: Syex, 2002. This book covers
    MySQL 4; however, it is still an excellent reference for MySQL 5.


    Reese, George, Randy Jay Yarger, and Tim King. Managing and Using MySQL. 2d ed.
    Sebastopol, Calif., 2002. This book covers installation and configuration as well
    as-programming interfaces and administration.


    Zawodny, Jeremy D., and Derek J. Balling. High Performance MySQL: Optimization,
    Backups, Replication and Load Balancing. Sebastopol, Calif., 2004. As the title
    tells you how to optimize, back up, replicate, and load-balance your MySQL.


    # PHP


    Atkinson, Leon, and Zeev Suraki. Core PHP Programming. 3d ed. Upper Saddle River,
    N.J., 2003. This book is written by one of the founders of the Zend engine and
    it covers PHP 5 in depth.


    Lerdorf, Rasmus, and Kevin Tatroe. Programming PHP. Sebastopol, Calif., 2002.
    This book is written by the founder of PHP, Rasmus Lerdorf. It covers a wide array
    of information about PHP, including history, installation, usage, and more.


    Rosebrook, Eric. Creating Interactive Websites with PHP and Web Services. Alameda,
    Calif.: Syex, 2003. This book provides hands-on experience for practical uses
    of PHP. Included in this book is an introduction to PHP, MySQL, and web services.


    # Additional Software


    There are two pieces of additional software you might wish to install on your
    server depending on the usage of the system:


    FTP server An FTP server handles the file uploading and downloading to your remote
    computer such as your workstation. It is the Internet standard protocol for handling
    such transactions. There are two that we recommend:


    +   - Pure-FTPd (www.pureftpd.org)

    - ProFTPD (www.proftpd.org)'
  merge: -1
