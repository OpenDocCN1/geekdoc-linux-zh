    # Why Close Ports


    Blocking ports on your server reduces the possibility of a malicious user exploiting
    your system. Different daemons on your system run at different levels of access
    because they need to be able to modify certain files throughout your system. A
    malicious user who has no business accessing some of these ports might develop
    an exploit to "trick" one of the daemons into letting him run commands at his
    level of access.


    To prevent situations like this happening, we close ports on our system to the
    outside unless certain criteria are met. These criteria can be based on a destination
    or source IP address, domain name, block of IPs, packet type, or other factor.
    You will want to block every port on your system that is not necessary. This is
    why it is easier to define your rules with *block everything* and then list ports
    you would like to leave open.'
