    # A Lesson in Testing Configuration File Changes


    Because adding your virtual hosts has been the first real editing you have done
    with your configuration files, you need to go through a small routine that prevents
    you from taking your server offline.


    Because Apache will not read configuration files on the fly, any changes you make
    to the configuration files will require the server to be restarted to take effect.
    The kind developers of Apache have taken measures to prevent you from taking your
    server offline in the event you "fat-fingered" your way through the configuration
    file.


    You might have noticed in the "Becoming Familiar with Apache Programs" section
    of this chapter that we gave you a list of commands to run. The command for apachectl
    contains a special setting that enables you to test your configuration files while
    the server is still running and prevent you from taking your server offline.


    Let''s issue the apachectl configtest command now and check the output:


    Good syntax output:


    +   - Processing config directory: /www/conf/vhosts/

    - Processing config file: /www/conf/vhosts/www.yourdomain.com

    - Syntax OK


    In this example, everything passed as expected by the server and you are clear
    to start, stop, or restart your server as needed to make the changes effect.


    Bad syntax output:


    +   - Processing config directory: /www/conf/vhosts/

    - Processing config file: /www/conf/vhosts/www.yourdomain.com

    - Syntax error on line 2 of /www/conf/vhosts/www.yourdomain.com:

    - Invalid command ''Oops'', perhaps mis-spelled or defined by a module not included
    in the server configuration


    In this example, you have a bad token on line 2 of your www.yourdomain.com.conf
    file. (We purposely entered the text Oops because we know that it would cause
    a syntax error in Apache).'
