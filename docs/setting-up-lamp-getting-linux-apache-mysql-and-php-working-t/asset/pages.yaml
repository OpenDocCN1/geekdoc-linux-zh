    # # Troubleshooting


    It is important for you to understand some of the common problems and why they
    occur. This section covers only the problems that might occur for the code and
    configuration we have given you, and their potential causes.


    +   * PHP says, Fatal error: undefined function mysql_connect() in line of .filename.php.
    This means that you have disabled or not configured MySQL support in PHP. By default,
    we have shown you to refer to Chapter 10 to learn how to enable MySQL with PHP.


    +   * PHP says, Warning: mysql_connect(): Access denied for user: ''test_user@localhost''
    (Using password: YES) in /home/yourdomain.com/database-connection.php on line
    x. This occurs when username or password does not match the database username
    and password. Follow the steps correctly in the "Preparing the MySQL Database
    and User"'
  merge: -1
  pgno: 347
- img_proc: true
  md: 'section earlier in this chapter and ensure you have used the correct username
    and password in your database-connection.php script.


    +   - PHP says, Access denied for user: ''test_user@localhost'' to database ''database''.
    This indicates that either you do not have the database and user privileges properly
    or you have defined them correctly in your database-connection.php script.


    +   - The output from the database is empty. This indicates that either you did
    not run the database-insert.php script or you have an error in one of your other
    scripts. Check your code against the code in this chart and try again.


    If you have any additional problems, check the chapter related to your problem
    type, or seek help in one of the resources listed in Appendix C.


    # Testing Your LAMP Installation Checklist


    In this brief chapter, you have taken the steps necessary to perform a quick test
    on the core elements of your new system. We have shown you how to accomplish the
    following:


    +   - Create an Apache virtual host.

    - Create a MySQL database from the command line.

    - Create a MySQL database table from the command line.

    - Grant MySQL privileges to a user from the command line.

    - Create a database connection PHP script.

    - Insert data into MySQL from PHP.

    - Extract and format data from MySQL with PHP.

    - Troubleshoot the most likely problems to find their solutions.


    At this point you should be familiar with Linux, Apache, MySQL, and PHP. We have
    included appendices in this book that provide a quick reference checklist for
    setting up LAMP, additional MySQL configuration options, and information about
    finding additional resources.'
