- img_proc: true
  md: "Over the course of the years that we have worked in the web development field,\
    \ we have performed many LAMP installations. During this time, we have always\
    \ wanted a reference for setting up LAMP. After you know the why having a firm\
    \ grasp of the requirements needed to install certain libraries and the effects\
    \ that specific configuration directives will have on your system, you don't want\
    \ to go back through pages of text to reference a single command. This appendix\
    \ will walk you through the process of installing everything you need based on\
    \ the default installation from this book.\n\nWe are sure that in the years ahead\
    \ this appendix will serve as a useful reference during your installations. Everything\
    \ you need in one place—you can't ask for more than.\n\nBecause you are familiar\
    \ with all the particulars, we will assume in some parts of this appendix that\
    \ you remember how to change permissions, continue to the next section, and so\
    \ on. If you have trouble with a particular command or area, refer to the appropriate\
    \ chapter and time to review the discussions and explanations for that command\
    \ or area.\n\nThis appendix is not a substitute for the expanded information found\
    \ in the chapters of this book. It is also not substitute for updated documentation\
    \ that may be found in the source files or official documentation. Please ensure\
    \ that you are familiar with all aspects of what you are doing before you proceed\
    \ with the quick instructions outlined here.\n\n# Linux\n\nThis section outlines\
    \ information covered in Chapter 2, “Installing Linux.” Follow these steps to\
    \ install Linux:\n\n+   1. After obtaining your Linux distribution, place the\
    \ first disc in the CD-ROM or DVD drive and reboot the computer. Make sure that\
    \ the CD-ROM is in front of the hard disk for boot order.\n2. Enter the installation\
    \ procedure in graphic or text mode, and if this is the first time you are using\
    \ these discs you might want to verify the integrity of the discs.\n3. Continue\
    \ on, selecting Server as your installation type, and set up your hard disk partitions.\n\
    4. Use the GRUB boot loader and set up your network accordingly.\n5. Enable the\
    \ default firewall for now and fill out your miscellaneous settings.\n6. Now it's\
    \ time to select your packages. For this installation we will choose the following:\n\
    \   * X Window System\n   * GNOME or KDE (or both) Desktop System\n   * Text-Based\
    \ Internet"
