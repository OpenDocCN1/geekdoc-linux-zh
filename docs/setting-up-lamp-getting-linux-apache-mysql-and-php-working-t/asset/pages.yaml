    # Backing Up and Restoring Databases


    The easiest and most efficient way to perform a backup of a database or all databases
    is by using the mysql command we created earlier in this chapter. We talked about
    how you can specify --all-databases or any number of databases and tables. For
    the purpose of this chapter, we will be running a backup of all databases. You
    might wish to perform a backup of some databases more often than others. It is
    not up to you, the system administrator, to judge how important your data is and
    determine how often you should back up that data. You can choose to run a script
    by the cron daemon if you wish or choose to back up the server manually. We course
    recommend using an automated script because the human memory is anything but infallible.


    The command you should be using within your script to back up all databases read
    like the following:


    ```

    mysqldump --user --password --all-databases > /path/to/backup/dir/filename.sql

    ```


    This will ensure that all of your databases are backed up to the location you
    specified. Additionally, the backup script you have already created, following
    along with the link, back up these files to your remote server for safe keeping.
    You might wish, however, to dump each database individually rather than all together.
    This makes it easier to rebuild your database(s) should anything go wrong. You
    can use a command similar to the following:


    ```

    mysqldump --flush-logs --quick --add-drop-table --extended-insert --add-locks
    --username --password database > /path/to/backup/dir/filename.sql

    ```


    You might also wish to create a separate user who has only the SELECT and LOCK
    TABLES privileges just for the purposes of backing up your databases.'
