    Your firewall will be set up to block anything coming in a port that you have
    not defined as open. This could cause some problems now if you send a response
    using a particular port and that response comes back into your machine, it could
    be blocked by the firewall. This is where the ESTABLISHED state comes in:


    Using the ESTABLISHED state basically says, "If I send a response out on port
    99, allow the response to come back into my machine on port 99 even though I have
    not specifically opened that port for public access." So based on this, you are
