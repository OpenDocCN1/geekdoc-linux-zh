  md: 'Return to MySQL Client and use this command:


    ```

    SHOW MASTER STATUS;

    This presents you with the bin log file and offset where the newest record is
    currently located for your snapshot.

    ```


    Write this information down! You will need it later. The printed results should
    look similar to the following:


    | File | Position | Binlog_DB | Binlog_Ignore_DB |

    |---|---|---|---|

    | mysql-bin.003 | 73 | test,bar | foo,manual,mysql |


    Here you see the current file mysql-bin.003, and the offset is 73.


    +   Now you can unlock the tables by using this command:

    UNLOCK TABLES;


    +   Transfer the /tmp/mysql.snapshot.1.tar file to each of your slave servers''
    /tmp directories. You may choose any manner you wish to do.


    +   Move into your slave servers'' data directories and untar the file and restart
    the servers.


    +   Log in to the MySQL Client for each slave and perform the following command:

    CHANGE MASTER=''masterHostname'',

    MASTER_USER=''slave_account'',

    MASTER_PASSWORD=''yes_master'',

    MASTER_LOG_FILE=''recorded binlog name'',

    MASTER_LOG_POS=recordedOffset;


    The recorded binlog name is the name of the bin log file from the master server
    you received from performing the SHOW MASTER STATUS command. The recorded offset
    is the offset you received from the same print statement.


    +   Run the following to place your slave server in action:

    START SLAVE;


    After you have completed this for each slave server, you will have a robust solution
    scalable to almost any size. If you would like to further customize your replication
    setup, you should look into the startup directives in Appendix B.'
