    # Configuring the Firewall


    The Linux kernel comes with a special built-in firewall protection called iptables.
    This protection is also known as netfilter/iptables. An iptables firewall works
    by filtering packets, network translation and port translation through the kernel.
    Here are some of the main features of iptables:


    +   - Stateful packet filtering (IPv4 and IPv6)


    +   - Stateful packet filtering (IPv4)


    +   - Various means of Network Address Translation and Network Address Port Translation
    (NAT/NAPT)


    +   - Flexible and extensible infrastructure


    +   - Multiple layers of API for third-party extensions


    +   - Large number of patches, plug-ins, and modules available in a patch-o-matic
    repository


    Some of the things iptables does is beyond the scope of this book. However, we
    are going to cover the firewall implementation de\u00fined to secure your web
    server. As we progress through the next chapters, you''ll add additional rules
    and open ports as needed for your operations. For now, you just need to secure
    your server and everything you can to prevent intruders.


    For detailed information on Linux security, pick up another book on that topic.
    Linux Security by Ramón J. Hortafán (Syex, 2001) and Firewalls 24Seven, second
    edition, by Matthew Strebe and Charles Perkins (Syplex, 2002).


