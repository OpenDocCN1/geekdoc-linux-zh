- img_proc: true
  md: '# Determining Configuration Options and Extensions


    PHP itself comes with a large list of features for you to utilize. However, there
    are additional features you can enable by using PHP extensions. An *extension*
    is a group of functions and routines that can be considered *extra* in that you
    have to manually enable them during installation. Usually, extensions require
    additional software installed before you can enable them.


    Compiling extensions for PHP can be tricky. We recommend that if you do not need
    it, do not install it. A common problem with pre-built packages for *PHP* is that
    they come with every extension installed; this reduces performance and, more important,
    could lead to a vulnerable system. If you can relate enabling extensions in PHP
    to opening ports on your system firewall that are not needed, you will have a
    better picture of what we mean.


    Now that we have those concerns out of the way, let''s take a look at *some* of
    the common configuration directives and extensions available for PHP. Keep in
    mind that because the extremely long list of directives, we are covering only
    the most commonly used ones.


    # Common Configuration Directives


    +   --prefix=PREFIX This tells PHP to install all architecture-independent files
    into the supplied directory location. By default this directory is */usr/local*.


    +   --help This prints a list of configuration directives.


    +   --no-create This does not create output files.


    +   --quiet, --silent This tells the compiler not to print checking... messages.


    +   --version This prints the version of autoconf that created the configure file.


    # Features and Packages


    The following list details the flags used to enable, disable, include and or not
    include features and packages in your PHP compilation.


    +   --disable-FEATURE=[ARG] Do not include FEATURE (same as --enable-FEATURE=no).


    +   --enable-FEATURE=[ARG] Include FEATURE [ARG=yes].


    +   --with-PACKAGE=[ARG] Use PACKAGE [ARG=yes].


    +   --without-PACKAGE Do not use PACKAGE (same as --with-PACKAGE=no).


    # Server Application Programming Interface (SAPI)


    SAPI extensions handle interaction with the web server. Because this book is written
    for the Apache web server, we will cover only the applicable extensions.'
  merge: -1
  pgno: 309
- img_proc: true
  md: '--with-apxs=[FILE] --with-axps2=[FILE] The first of these tells PHP to compile
    a shared object for Apache 1.3; the second is used for Apache 2.0.


    --with-apache=[DIR] This tells PHP to compile as a built-in Apache module.


    --disable-cli CLI is the Command Line Interface. If you disable this, you will
    also disable the PHP Extension Repository (PEAR).


    --disable-cgi This disables building the CGI version of PHP.


    --enable-force-cgi-redirect If you will be running CGI, you will not want to enable
    this feature. This tells Apache to perform a security check when using an internal
    redirect.


    # General Settings


    The below list provides you with settings and options that do not directly fit
    into any of the other groupings we have provided:


    --enable-sigchild This directive is needed only when you are connecting to Oracle
    8.1.0+ via the Beequeue interface. It enables PHP''s own SIGCHILD handler.


    --enable-magic-quotes This enables magic quotes by default. The magic quotes feature
    automatically adds backslashes to POST and GET variables on your site.


    --disable-ipv6 IPv6 is the new version of IP. It contains new functionality for
    future expansions to IP architecture and is optimized for high-performance networks
    such as gigabit and ATM (Asynchronous Transfer Mode) technology.


    --with-mysql-sock=[DIR] This tells PHP to use the mysql sock file located at the
    supplied directory.


    --disable-session This disables sessions in PHP.


    # Extensions


    As we said earlier, extensions are the add-ons for PHP. Keep in mind that most
    of these will require additional software installed, depending on your system
    configuration.


    --disable-all As it is, this disables all PHP extensions.


    --with-inifile This is new to 5.0 and enables you to specify Microsoft-style INI
    files.'
