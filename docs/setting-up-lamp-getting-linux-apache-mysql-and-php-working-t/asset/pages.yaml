  md: 'With a firm understanding of the commands and functions needed to navigate
    through the Linux filesystem as well as an idea of where each type of file is
    located, you are ready to begin exploring the world of Linux administration. This
    chapter will teach you how to manage user accounts; how to modify sections of
    the boot process; how to stop, start, and manage processes and software; and how
    to run an efficient backup system for your server. Each of these areas is extremely
    important to keeping a well-oiled system and they all will be thoroughly covered
    in this chapter—so let''s begin.


    # # Managing Users and Groups


    User accounts serve a number of purposes on any Linux system. Primarily, they
    give the system and other users a way to distinguish themselves and the files
    they own from other users and their files. When we refer to an account, we are
    talking about the user''s name and all of the files and directories owned by the
    user.


    In addition to accounts owned by people, there are also accounts owned by programs
    and processes that reside on your system. This level of distinction for files
    allows programs to or modified for multiple reasons, the first of which is security.
    You would not want a program that is accessible to any user on your system to
    have privileges allowing it to modify files and directories that only the root
    user should be allowed to access.


    Most of these processes that are running in the background are referred to as
    daemons. For example, you might have a daemon running that retrieves files from
    several servers via HTTP or FTP. This daemon might need to store its files in
    the /var/spool directory that anyone can read them. This daemon user would have
    full access to these files, whereas each of the other users, who are owned and
    operated by a person, would have only access to these files in order to prevent
    tampering and to prevent an inexperienced user from accidentally deleting the
    file(s).


    As the system administrator, it is your responsibility to create each of these
    accounts and assign the proper levels of access to each one. This should not be
    taken lightly because mistakes could easily lead to your system being compromised
    and ultimately to you losing control over your system. After a malicious user
    gains access to your root account, they could completely erase all data your system
    has access to.


    Groups, as defined by Red Hat, are "logical expressions of organization, tying
    users together for a common purpose." Groups help separate types of users from
    each other and allow each user in a group to have the same level of access to
    common files and directories that they might share. When you set up your web server,
    you might wish to give a friend or coworker access to the web directories. Adding
    this person to the group that your web server owner owns would allow them to access
    the group permissions of files that the web server group owns. We will cover this
    more in depth later in this section.'
  merge: -1
  pgno: 95
- img_proc: true
  md: '# The /etc/passwd File


    For now, let''s take a look at an account, its login information, and its files.
    You''ll start with the /etc/passwd file. The passwd file contains one line for
    each user on your system. Move to your /etc directory and copy the passwd file.
    You can read the information in this file by using the following format:


    ```

    login:password:UID:GID:Name:homdir:shell

    ```


    The login is also referred to as username. Notice that the password is shown as
    an x. This is because Linux stores your password in a shadow password file. The
    shadow password file is for security reasons. Your shell, which runs at user and
    access level, requires access to the passwd file in order to retrieve your full
    name and home directory. However, allowing every user to see the passwords would
    open the doors for malicious users attempting to crack the password file and gain
    access to your system. For reason, the actual passwords are stored elsewhere.
    The User ID (UID) and Group ID (GID) fields are integer values and can be modified
    directly in this file.


    # NOTE


    This GID is the user''s primary GID. Others can be assigned via the group file
    later.


    If you scroll to the bottom of this file, you will see the first user created
    during the installation procedure at the very bottom. The UID and GID are both
