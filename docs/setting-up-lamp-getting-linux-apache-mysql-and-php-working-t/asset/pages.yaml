- img_proc: true
  md: 'At this point, LAMP setup is almost complete if you have been following along
    in the book. You have nearly all of the elements in place to complete your LAMP
    acronym. Now all you have to install and configure PHP and you will be on your
    way to running a full-blown LAMP server.


    PHP has been around for many years and has become a fully featured and mature
    programming language. If you are curious about PHP''s development, please refer
    to Chapter 1, “Introducing LAMP”; otherwise, let''s get moving along so you can
    learn why you should use PHP and the important features it has to offer.


    # Why Use PHP?


    Simply stated, PHP is the fastest parsing server-side scripting language available.
    ASP and Java both require separate objects to be instantiated to accomplish any
    task. For instance, in ASP when a programmer uses VBScript, he is running a COM
    (Component Object Model) object. When he writes to the client, he''s calling the
    Response COM object''s Write method. When he accesses a database, he uses another
    COM object. When he accesses the filesystem, another COM object is called. Because
    of this, more and more resources are required to perform tasks. When hundreds
    or even thousands of users are accessing these pages and functionality, all this
    overhead adds fast and significantly reduces system performance and speed. PHP,
    however, accomplishes all the preceding tasks entirely in PHP''s own memory space.
    Of this course uses drastically fewer resources.


    Features, features: PHP comes installed with tons of support for features such
    as FTP, data compression, XML (extensible Markup Language), MD5, e-mail, and so
    on. To enable these features in ASP, you would need to purchase expensive-party
    packages. These hidden costs, in our opinion, are simply unacceptable—and those
    are just the basic options. PHP also offers complex functionality such as dynamic
    images, IMAP, SNMP, dynamic Flash, PDF (Portable Document Format), native access
    to Oracle and other DBs, LDAP (Lightweight Directory Access Protocol), and sockets.
    Not only is PHP, which is more mature than ASP. ASP has been around since 1996,
    whereas PHP has been development since 1994.


    The last is cost. If you want to run ASP efficiently, you''ll want to run Windows,
    probably access Microsoft SQL, most likely Visual Studio, and probably run IIS—money,
    money, and poor performance when compared to Linux, MySQL, and PHP.


    PHP, in a general sense and at its base level, is capable of creating dynamic
    web pages that incorporate data from databases or other sources not found directly
    on web pages. PHP can also be run from the command line and can be used from cron
    jobs or for client-side applications, although these last abilities are rarely
    seen.'
  merge: -1
  pgno: 307
- img_proc: true
  md: 'The most likely reason for PHP installation, however, is the ability to create
    client-side scripts for websites. PHP makes it easy to integrate with virtually
    every database available, in our case MySQL. PHP also makes efficient use of POST
    and GET variables sent through Apache for easy integration and manipulation. This
    is handy for processing HTML forms for storage into a database or sending an e-mail,
    and so on.


    # PHP Versions


    PHP currently has two versions available: PHP 4.3.x and PHP 5.0. For this book
    we will be using 5.0 because it introduces an abundance of optimizations and additional
    functionality not seen in 4.3.x. PHP 5.0 also introduces Zend Engine 2. The new
    Zend engine has been completely rewritten to an entirely new object model. The
    use of objects includes a wide variety of new functionality not previously seen,
    such as private and protected methods, abstract classes and methods, class types,
    object cloning, unified constructors, destructors, exceptions, and more. This
    alone, for the object-oriented coder, is more than enough to switch to PHP 5.0
    from earlier versions.


    For the procedural developers there or for those who have less experience with
    PHP, there are also a myriad of new functions and additions that apply to any
    coding methods and standards. The XML system has been completely overhauled and
    now uses SimpleXML and the DOM and Extensible Stylesheet Language (XSL) extensions.
    PHP .ini options have also been added, stream support has been improved, the GD
    Graphics Library extension has been improved—too many functions to have been added,
    and countless bugs have been fixed.


    Overall it''s a good idea to install PHP 5.0 over 4.3.x. If you would like a full
    list of all the changes that have been made, you can visit the PHP site for more
    information and look for the change log. We just wanted to give you some insight
    into why we chose 5.0 for this book.


    # Installing PHP


    PHP is your final installation before your server is complete with its core functionality.
    Quite a few directives can be specified during compilation and in its configuration
    files. This chapter will cover all of the more common options enabling PHP to
    run as needed. You will probably need to go back and recompile PHP later, when
    you discover that, or someone else using your server, needs to add a new library
    for usage within a script. Don''t worry, however—after a couple of installations
    you''ll have it down to a science.'
