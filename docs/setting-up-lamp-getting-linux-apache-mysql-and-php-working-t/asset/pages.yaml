    # Using Network Monitoring and Testing Applications


    There are many applications out there that will enable you to test your system
    to ensure that it''s secure. Some of these applications will require you to use
    a remote server to get accurate information, so it might be useful to have a second
    system handy. In this section, we will discuss some tools such as Nmap, Snort,
    traceroute and ping.


    # Nmap


    Nmap, an abbreviation for Network Mapper, is a utility that enables system administrators
    and other curious people to scan-scale networks to determine which services are
    accessible through a firewall.


    Nmap can support many scanning techniques, such as UDP, TCP connect(), SYN (half
    open), FTP bounce attack, reverse-invert, ICMP (ping sweep), FIN, ACK sweep, XMAS
    Tree, SYN sweep, IP protocol, and Null scan. As you can see, this is a valuable
    tool for seeing how your network is!


    Nmap can be found at www.nmap.org/nmap, and you can compile or install it yourself.
    Some systems come with Nmap installed by default, so you might already have it
    handy. Don''t worry if you do not have another Linux box around. Nmap comes with
    Windows binaries as well. Browse to the download section of the website and obtain
    a copy for the operating system you are using.


    > Be careful when using Nmap and do not go overboard with your scanning. If you
    are caught scanning networks other than yours, your activities might reflect that
    of a hacker, and you could face criminal charges for doing so. The bottom line:
    if the network is not yours, do not scan it!


    Let''s take a look at how to run Nmap on your system. Let''s say your server''s
    IP address is 192.168.0.15. On a different computer, run the following command:


    ```

    nmap 192.168.0.15

    ```


    > If Nmap takes an extremely long time to run, then is a good indicator that your
    firewall is working well. Alternatively you can use the -F option for fast scan
    mode.


    You should see something similar to the output in Listing 6.6. Keep in mind that
    you currently have the firewall running on this server.'
