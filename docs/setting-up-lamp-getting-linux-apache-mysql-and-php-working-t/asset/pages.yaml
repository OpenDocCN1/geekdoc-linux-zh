  md: 'Pay close attention to the commands used within the next section for installing
    and using rpms. You will be using these files for the rest of your installations
    in order to provide you with the most organized system possible.


    # RPM and RPM Source Packages


    RPM has five modes, as we discussed in the preceding section: installing, uninstalling,
    upgrading, querying, and verifying. Each of these modes is accessed by passing
    different flags and parameters to the rpm command. Before you install a package,
    you will of course to download the proper package. Pay close attention to the
    name because it holds all the clues necessary to making the correct selection
    for your specific system. A typical package name looks like:


    ```

    foo-1.1-2.i386.rpm

    ```


    You can read this name using the following format:


    ```

    name-version-release.platform.rpm

    ```


    In this example, you would be working with a package named Foo version 1.1, release
    2, for the i386 architecture. For the remainder of this section, we will refer
    to this example as our target package. With the proper package downloaded, let''s
    take a look at each mode.


    # Installing


    To install a package, you can use the following command:


    ```

    rpm -ivh foo-1.1-2.i386.rpm

    ```


    You will be presented with the name of the package being installed. Take note
    of this because it might not necessarily be the name of the file. You might have
    downloaded a rebuilt release from a site other than the original source, and this
    release could have a filename not related to the package (for example, fedorat.rpm).
    After the name of the package currently installing is printed to the screen, you
    should see hash marks begin to appear as a progress bar. Although the command
    for installing a package is very simple, you might receive few errors.


    # Package Is Already Installed


    Foo package-1.1-2 is already installed

    error: foo-1.1-2.i386.rpm cannot be installed


    This means exactly what it tells you, the package is already installed. If you
    feel you have reached this message in error or you would like to install the package
    anyway, you can use the command:


    ```

    rpm -ivh --replacepkgs foo-1.1-2.i386.rpm

    ```


    This automatically overwrites the current packages that reside on your system.'
