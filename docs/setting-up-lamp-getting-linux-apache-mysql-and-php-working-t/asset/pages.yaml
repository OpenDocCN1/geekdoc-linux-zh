  md: '# Data Handling


    ```

    arg_separator.output

    ```


    Default: &


    Allowed: Any characters


    This directive is the separator value for URL-parsed values. The most common is
    the ampersand symbol (&), which is used to distinguish between variable and value
    sets. Example: index.php?var1=val1&var2=val3.


    By default, follow HTML compliance standards, the & symbol is converted to &amp;


    We recommend that you do not alter the arg_separator.output setting because it
    conforms with coding standards.


    ```

    variables_order

    ```


    Default: EGPCS


    Allowed: G, P, C, E, S


    This is the order of precedence for variable scopes. These scopes are Environment,
    Get, Post, Cookie, and Sessions. If you understand what you are doing with these
    values, you can change them; otherwise, it is a good idea to leave them the way
    they are.


    ```

    register_globals

    ```


    Default: Off


    Allowed: On, Off


    register_globals is the largest security hole in PHP; therefore, it is disabled
    by default for a very good reason. This setting turns every field and cookie value
    into a global variable.


    If you are attempting to run a third-party PHP script that will not work with
    register_globals disabled, do not run it. Instead, contact the author and ask
    them to update it or to refund your money because the script causes a security
    risk to your system.


