- img_proc: true
  md: '# Enabling or Disabling a Service with chkconfig


    Even though you added the service named foo to chkconfig, this does not mean that
    it will start at boot or during a run level. You can enable a service by running
    the following command:


    ```

    chkconfig foo on

    ```


    Or you can disable it:


    ```

    chkconfig foo off

    ```


    If you turn on the service, it will automatically be available for the run levels
    configured by the script. If you turn it off, it will be completely disabled on
    all run levels.


    # Setting Service Run Levels with chkconfig


    If you want to set a run level for a service, you can do so by running the following
    command:


    ```

    chkconfig --level level name on | off

    ```


    Let''s view a more practical usage of this command for foo. If you were to turn
    off run level 3 for foo, you would use this command:


    ```

    chkconfig --level 3 foo off

    ```


    If you wanted to turn run level 3 back on foo, you would run the following command:


    ```

    chkconfig --level 3 foo on

    ```


    # Deleting a Service with chkconfig


    In the previous example, “Adding a Service with chkconfig,” you enabled foo. Now
    let''s delete this service:


    ```

    chkconfig --del foo

    ```


    Now the foo service is deleted.


    You should run chkconfig --list to determine which services are not required by
    your system to run, and disable them.


    Simple deleting the service from chkconfig will not delete the scripts located
    in /etc/init.d.


    # Utilizing ntsys


    Let''s look at what''s to start up on your Fedora box. Most Linux distributions
    have the command ntsys, which enables you to configure run-level services. Simply
    running this command will show you something similar to Figure 6.1.


    To enable services, you simply scroll the list using Up or Down arrows and press
    your spacebar to enable or disable an item. If there is a star (*) indicated,
    that means the service will run at boot. After you are finished, tab down to the
    OK section and press Enter.'
