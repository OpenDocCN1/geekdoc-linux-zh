  md: '# P–PHP Scripting Language and Engine


    PHP is a recursive acronym that stands for PHP: Hypertext Preprocessor. This widely
    used general-scripting language is especially suited for Web development and can
    be embedded into HTML. What this means to you is that it''s a simple scripting
    language that can greatly enhance your website. You simply learn the code, apply
    the logic, and create a dynamic website that can interact with your users on many
    levels greater than the traditional "flat file" HTML methods of the Internet.


    PHP''s initial inception in 1995 was a simple set of Perl scripts for Rasmus Lerdorf''s
    online résumé. As time went on, Lerdorf began to write a much larger C implementation
    to handle the increased amount of functionality he needed, including database
    connectivity. Lerdorf then decided to send out an initial release, open source
    style, called PHP/FI for anyone to use and to improve upon. For Personal Home
    Page/Forms/Interpreter. By 1997, the second release was distributed (PHP/FI 2.0)
    and had started to gain a following of several thousand from around the globe.
    Several individuals were contributing code, it was still Lerdorf who continued
    the majority of all development.


    Mid-1997 saw the dawn of a new age of PHP: PHP 3. This version was a complete
    rewrite of PHP/FI 2.0 by Andi Gutmans and Zee Suraki, who needed more juice than
    was previously for a university project they had been working on. To capitalize
    on PHP''s growing user base, Lerdorf, Gutmans, and Suraki decided to release this
    new creation under the PHP name and to what we know today as PHP. In the winter
    of 1998, PHP 4 development began by Gutmans and Suraki. They released the first
    official version in May of 2000. PHP 4 boasted much higher performance and pushed
    new technologies to its ever growing fan base with HTTP sessions, output buffering,
    and more secure ways of handling input.


    We believe that PHP 5 will knock the butterfly off its flower when it hits. A
    new object-oriented model with the Zend Engine 2, stack tracing, and exception
    handling is expected to push a wider acceptance across the planet. At the same
    time, an introduction of integration with external object-oriented models, such
    as COM and Java, will throw a wildcard into the mix. For the first time, the ability
    to integrate other communities seamlessly with PHP will be prewritten APIs will
    be able to be more easily integrated with PHP, destroying the last remaining reasons
    for these other communities to not use PHP.


    Don''t worry if you do not yet have a complete understanding of the LAMP technologies
    from these brief descriptions. Throughout the rest of the book, we will cover
    in depth how to install, configure, and utilize them.'
