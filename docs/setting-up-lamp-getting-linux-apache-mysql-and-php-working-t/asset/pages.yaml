  md: '# 198 Chapter 8 • Apache Server: Installation and Configuration


    # AcceptMutex AcceptMutex mode


    This controls accept() mutex method Apache will use. For a list of methods supported
    by your system, type httpd -V.


    NOTE AcceptMutex is an option that you can enable at compile time. See the official
    Apache documentation for more information.


    # AccessConfig AccessConfig file|directory|wildcard


    This directive enables you to specify a directory or file that contains additional
    configuration files. This directive is removed in Apache 2.0.


    # AccessFileName AccessFileName [filename] ...


    This directive enables you to specify an access control document for the purposes
    of word-protecting directories and files on your server. When a request is returned
    to the client by the server, it will check for the file in all directories, from
    the root leading to the current directory, and parse the file looking for the
    access privileges.


    # AddDefaultCharset AddDefaultCharset On|Off|charset


    This will add a default character to set your HTML pages. Whatever is supplied
    to this directive will automatically be added to the header section of your HTML
    documents.


    # AddModule AddModule module [module] ...


    This directive is used to activate modules that are compiled into Apache. You
    can read more on the modules available and what they do in the next section.


    # AllowOverride AllowOverride All|None|directive-type ...


    This enables you to overwrite the ability to use .htaccess files. These files
    allow anyone with permissions to overwrite the settings of Apache for the directory
    they are located in. With the AllowOverride directive, you can disallow .htaccess
    files or limit exactly what .htaccess file may contain.


    # AuthName AuthName auth-domain


    This sets the authorization realm name for a directory. This directive is used
    to display a message as “Restricted Area” in the login box that is displayed when
    a user tries to access a password protected directory.


    # AuthType AuthType Basic|Digest


    This tells the server what type of authorization is required to access the authorization
    realm in question. Basic is the most common AuthType used.'
