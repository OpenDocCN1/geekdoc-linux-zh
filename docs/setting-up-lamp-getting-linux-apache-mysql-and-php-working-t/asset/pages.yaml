    documentation. The reasons for this are simple: time saving and it just makes
    more sense to us. The documentation will tell you to run a Configure script in
    the src/ directory; however, this script is not designed to install the files
    outside of the compilation directory. To avoid any confusion, we are using the
    simplest method possible.


