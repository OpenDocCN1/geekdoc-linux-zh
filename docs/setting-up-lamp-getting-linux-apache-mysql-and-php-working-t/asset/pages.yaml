  md: '# Booting Linux 39


    The first thing the rc.sysinit file does is run itself through the initlog for
    error logging. The initlog file is located in the /sbin directory and is a binary
    compiled to handle system log-ging nothing away.


    The rc.sysinit file will then load the current hostname for your computer by consulting
    the /bin/hostname program. If this does not return a valid hostname, it will attempt
    to run the /etc/sysconfig/network file, which contains important networking information
    and vari-ables as your hostname, gateway and domain name. If no file is found,
    networking will be set by disabled. If no hostname is set by this and networking
    is enabled, the hostname will be set to localhost by default.


    Next, proc filesystem is mounted. This is a pseudo filesystem that acts as an
    interface to kernel runtime information. After it is mounted, you can list these
    "files," which contain vari-ables that are constantly updated according to the
    system''s current state.


    Next, the /etc/rc.d/sysinit functions run in inline; this will provide common
    functions that can be accessed by the majority of scripts located in the /etc/init.d
    directory on your sys. Residing in the init file are functions such as killproc(),
    which will kill a process on the system, pidofproc(), which will find the process
    identifier (PID) of any process, and confirm(), which will determine whether it
    is appropriate to run the service.


    After the functions have run inline, some basic parameters are set up for your
    con-sole, such as the system font and terminal. A text banner is printed to the
    screen with a small message giving you the option to press I for an interactive
    startup. (You may or not have noticed this during your initial boot sequence.)
    The next graphical system is started, if possible.


    The graphical system will load only if the /usr partition is already mounted.
    If it has not mounted, it will try again after it has run through its mounting
    process.


    Next, your kernel''s configuration parameters are set up by running the sysctl
    command. This command is initiated with the -e and -p parameters. The -e says
    to ignore errors unknown keys, and the -p says to load the parameters based on
    a specified file. In this case, it is /etc/sysctl.conf file. There are only four
    kernel parameters for your default system.


    Next, your system clock is updated. If your system clock is controlled via a remote
    server, this is where the functionality resides in for setting your system time.
    After that has the rc.sysinit file will then load your kernel. The default kernel
    file is /etc/sysconfig/console/default.kmap.


    After your kernel is loaded, your hostname will be set, your command line will
    be created, and ACPI bits will be initialized. ACPI, or Advanced Configuration
    and Power Interface, is a driver controlling the voltage and power settings your
    motherboard receives. Next, the Universal Serial (USB) devices and Human Interface
    Devices (HID) are initialized and mounted.'
