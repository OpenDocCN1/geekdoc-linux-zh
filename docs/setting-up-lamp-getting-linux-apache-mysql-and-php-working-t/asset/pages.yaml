    # Using Apache Virtual Hosts


    Apache has an excellent built-in feature called virtual hosts. This feature enables
    you to host multiple domain names from the same server and use a single IP address
    for all of the virtual hosts or assign a group of hosts to an IP address while
    assigning another group to a different IP address and so on. This widely flexible
    feature is well designed and very configurable. In fact, virtual hosts enable
    web-hosting companies to pack many clients onto a single machine with little overhead.


    Apache’s virtual hosting features are quite extensive; in fact, there are too
    many to list in this chapter. Here is a list of the most important features you
    might find uses for in this book:


    +   * IP or name-based virtual hosts

    * Each host can have their own DocumentRoot

    * Separate logging facilities for each host

    * Ability to share directories between virtual hosts using ScriptAlias and Alias
    directives

    * Ability to allow override options per directory or virtual host'
