    mod_negotiation This module provides the ability for Apache to select the best
    matched type of document for a client''s capabilities.


    mod_proxy This enables Apache to use an HTTP 1.1 caching proxy.


    mod_rewrite The mod_rewrite module is probably one of the most extensive and complicated
    modules. It enables you to use a combination of directives and regular expressions
    to rewrite a request URL to another depending on a plethora of options. This can
    be especially useful for Search Engine Optimization (SEO).


    mod_setenvif This enables you to set environment variables based on whether different
    aspects of a request match a regular expression.


    mod_so This module provides the ability to load executable code and modules at
    runtime for Apache.


    mod_speling This module attempts to rewrite a URL if the document is not found.
    It will search for a directory for a similar file and redirect the user to the
    found file.'
