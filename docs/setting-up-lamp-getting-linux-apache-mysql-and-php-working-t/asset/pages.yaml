  pgno: 395
- img_proc: true
  md: '# MySQL


    +   - mailing.database.mysql

    - mysql.users


    # PHP


    +   - alt.comp.lang.php

    - alt.php

    - alt.php.sql

    - php.qa


    To use newsgroups, you must have access to a news server. If you are a residential
    user, most ISPs will have one or more servers dedicated to this purpose and available
    to you as part of your service. If not, you will need to locate a paid service
    that will provide access to newsgroups.


    To view newsgroups, you will also need to have a client installed to handle the
    communications and format your data. It might be easier to install a client for
    X11 that will provide you with a more graphical layout and greater usability.
    Listed here are a few of the more popular news clients for Linux:


    +   - Netscape

    - Knews

    - News Peruser

    - GFetchnews


    You could choose to install your own news server, although this can take an enormous
    amount of server process and bandwidth so it is not recommended. If you have access
    to both of these and would like to give it a shot, here are a few available news
    servers to take a look at:


    +   - DNews

    - InterNetNews (INN)

    - Leafnode

    - Ozway


    # Internet Relay Chat


    Internet Relay Chat (IRC) is an excellent source for near-instant help for free.
    IRC enables you to connect to a server that provides you with chat rooms and the
    ability to send files through'
  merge: -1
  pgno: 396
- img_proc: true
  md: 'a Data Communications Channel (DCC). Each room might have one or more operators
    to keep messages organized and many times free from spam. Here are a few IRC channels
    for you to visit in your search for help:


    # Linux


    +   - *linux

    - *redhat

    - *linuxforum


    # Apache


    +   - *apache


    # MySQL


    +   - *mysql


    # PHP


    +   - *phpfreaks

    - *php


    An excellent IRC server that is dedicated to providing an interactive environment
    for coordination and support of peer-directed projects such as open source is
    irc freenode.net. You can find more information on freenode by going to www freenode.net
    as well. This server originally started in 1998 and had only about 200 users in
    20 channels. Now there are over 13,000 channels with as many as 16,000 simultaneous
    users. Most likely someone there can help you find the answers you need. They
    might be able to provide you with scripts and files to make administration life
    easier.


    To connect to the freenode network, you will need to acquire an IRC client for
    your computer. This is required as irc freenode.net is not a web server. You might
    wish to use a command client such as ircII, XChat, or Bitch if you will be accessing
    IRC from your Linux computer. Otherwise, you can choose any of the available clients
    you find on the Web. There are plenty of free applications that will get the job
    done. Often, there are multiple clients based on an original program, such as
    ircII or mIRC (Windows). You should refer to each program''s documentation for
    more information on setting up and configuring your client. Just make sure you
    are connecting to one of the irc freenode.net servers if you wish to access their
    channels.'
  merge: -1
