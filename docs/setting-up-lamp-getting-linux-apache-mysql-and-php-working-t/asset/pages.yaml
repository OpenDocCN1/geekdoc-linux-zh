  md: 'There aren''t necessarily advantages or disadvantages to a router. Simply stated,
    if you need one, you need one.


    # Routing Switches


    Routing switching is a new technology that is still largely experimental. A routing
    switch, or layer 3 switch, combines the packet handling of a router and the speed
    of switching. These routing switches operate on the Data-Link and Network layers
    (levels 2 and 3, respectively).


    These advanced machines are aimed mostly at large-scale businesses and networks
    that require complicated switching and routing. A multilayer switch has the capability
    to analyze the flow of data between each port and make “intelligent” decisions
    on how to connect these ports for optimum performance. It runs its internal and
    updatable set of functions, which are complicated and can require massive amounts
    of diagnosis and tweaking to run at peak levels. As technology progresses and
    becomes cheaper, we are likely to see more of multilayer switches.


    # Bridges


    A bridge is used to connect separate networks. A bridge is also a store-and-forward
    device because, like a switch, it uses a buffer to temporarily store the packets
    as it analyzes them to determine whether they should be forwarded through the
    network. If the packet''s destination and source network locations match, the
    bridge will drop the packet and not retransmit it. If they are different, the
    packet will be forwarded across the bridge. This enables both networks to be split
    into separate collision domains, just like a switch.


    Problems arise, when too many bridges are connected. Bridges have the capability
    to “learn,” and because of the nature of the self-learning, network loops can
    occur. A network loop occurs when two separate bridges have different “ideas”
    on where a device is on a network. They end up passing a packet back and forth,
    hence the loop. To combat this, a software standard, now found in the IEEE 802.1d
    specification, called the Spanning Tree Algorithm was created. This standard describes
    how switches and bridges communicate to avoid such problems. Switches and hubs
    can also become victims of the same situation.


    # Repeaters


    A repeater is a simple device that does not require any configuration. Aptly named,
    it is used to duplicate a signal, exactly as it was, onto the other end of the
    connection. Repeaters are located at locations where network cables must run long
    distances. They essentially boost a signal, the same way an amplifier would, to
    try to maintain data integrity across the lengthened media. A repeater does not
    analyze a packet and reconstruct it as a switch or bridge; it instead amplifies
    the exact signal. This is for the sake of speed but at a cost; any inline noise
    is amplified with the data and can cause signal corruption, leading to packet
    loss due to bad or misaligned packets.'
