  md: 'grep grep is used to find file(s) that contain a string matching the argument
    you pass in. By default, grep will print the line in the file(s) that match your
    argument. Here is the proper format for the grep command:


    ```

    grep options pattern file(s)

    ```


    The following example will return the lines of any files inside /usr/local/apache/docs
    that match the term PHP Freaks:


    ```

    grep ''PHP Freaks'' /usr/local/apache/docs/*

    ```


    * grep tells to search in any files located in the given directory. The asterisk
    is also known as a wildcard.


    +   11 11 is an alias, or shortcut, for the ls command with -al flags. The 11
    is short for long listing and is mentioned here to provide a shortcut for retrieving
    long directory list-ings. Check the 1ls command for the appropriate syntax for
    this command.


    1s The 1ls is the directory listing command. There are a plethora of flags for
    this command to enable you to sort and limit your results. Running the man 1ls
    will give you a complete listing. Some of the most popular flags are here:


    +   -a Do not hide directory listings that begin with -

    -l Use the long listing format

    -r Reverse the order while sorting

    -t Sort by modification time

    -F Classify: this will append indicators to the listing as=*|


    The following example will return all of the files, including those that begin
    with a period, starting with the oldest file first in long listing format:


    ```

    1s -al

    ```


    This can be useful when finding newly added files. You can also specify a directory
    to list as an argument after your flags.


    man The command is used to access your manual. One of the most useful commands
    in Linux, the man can provide a wealth of information on virtually every program
    or command on your system. Occasionally, when using the man function, you will
    come across a command with multiple entries. What makes these entries unique is
    their locations within different sections of the manual. If this is the case,
    you can use the -S flag followed by a colon-separated list of sections to specify
    which sections to search.'
