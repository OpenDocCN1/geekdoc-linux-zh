  md: '# Mailing Lists


    Mailing lists are a great way to stay up-to-date on the latest patches, fixes,
    bugs, and updates. There are official and unofficial mailing lists for almost
    every technology that will enable you to automatically receive e-mails on the
    latest happenings. Many of these mailing lists also have their own newsgroups.
    Some of these mailing lists are moderated, and some are not. Many of the lists
    will provide you with too many emails to reasonably go through if you subscribed
    to them all. Here are a few links to the official mailing lists for the technologies
    used in this book:


    +   - www.tux.org/1km/

    - www.apache.org/foundation/mailinglists.com

    - lists.mysql.com

    - www.php.net/mailing-lists.php


    These are just links to the official mailing lists, which will pertain to everyone
    reading this book. You can find additional mailing lists by performing a search
    on the Web or by visiting the links provided in the "Websites" section.


    # Newsgroups


    Newsgroups can be an excellent source of information. Finding good newsgroups
    can be tricky, so here''s a helpful selection:


    Some of these newsgroups might not be available to your news service provider.
    If you wish to find a high-power news service provider with high retention rates,
    check out www.giganews.com.


    # Linux


    +   - alt.os.linux

    - alt.comp.linux

    - alt.linux.redhat

    - comp.os.linux

    - comp.os.linux.hardware


    # Apache


    +   - alt.apache.configuration'
