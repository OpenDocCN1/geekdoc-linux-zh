  md: '# MySQL Configuration Directives


    --slave-load-tmpdir=name The location where the slave should put its temporary
    files when replicating a LOAD DATA INFILE command.


    --slave_net_timeout=# The number of seconds to wait for data from a master/slave
    connection before aborting the read.


    --slave-skip-errors=name Tells the slave thread to continue replication when a
    query returns an error from the provided list.


    --slow_launch_time=# If creating the thread takes longer than this value (in seconds),
    the slow_launch_threads counter will be incremented.


    --socket=name The socket file to use for the connection.


    --sort_buffer_size=# Each thread that needs to sort allocates a buffer of this
    size.


    --sporadic-binlog-dump-fail Option used by mysql-test for debugging and testing
    of replication.


    --sql1-bin-update-same The update log is deprecated since version 5.0 and is replaced
    by the binary log. This option no longer does anything.


    --sql-mode=name Syntax: sql_mode=option[option,option...], where option can be
    one of the following: REAL_AS_FLOAT, PIPES_AS_CONCAT, ANSI_QUOTES, IGNORE_SPACE,
    ONLY_FULL_GROUP_BY, NO_UNSIGNED_SUBTRACTION.


    --symbolic-links Enable symbolic link support.


    --table_cache=# The number of open tables for all threads.


    --thread-pool Using this option will cause most temporary files to create a small
    set of names, rather than a unique name for each file.


    --thread_cache_size=# The number of threads you should keep in a cache for reuse.


    --thread_concurrency=# Permits the application to give the threads system a hint
    for the desired number of threads that should be run at the same time.


    --thread_stack=# The stack size for each thread.


    --time-format=name The time format (for future).


    --tmp_table_size=# If an in-memory temporary table exceeds this size, MySQL will
    automatically convert it to an on-disk MyISAM table.


    --tmpdir=name The path for temporary files. Several paths can be specified, separated
    by a colon (;); in this case, they are used in a round-robin fashion.'
