  md: '# 194 Chapter 8 • Apache Web Server: Installation and Configuration


    Apache Web Server is the most versatile web server on the Internet. It has an
    endless supply of features that were drafted by the most experienced web server
    experts around the world that include name-based and IP-based virtual hosting,
    user authentication, URL rewriting, Server Side Include (SSI), advanced logging,
    environment variable handlers, content negotiation, Common Gateway Interface (CGI)
    handlers, Secure Sockets Layer (SSL), and much more.


    Apache maintains a presence of over 65 percent of all web servers on the Internet,
    according to Netcraft (www.netcraft.com). This growth has shown a steady trend
    over the past nine years.


    If you are interested in viewing the Netcraft Web Server Surveys, please visit
    http://www.netcraft.com/archives/web_server_survey.html.


    Apache as it is known today was released on December 1, 1995. It was originally
    from the Public Domain HTTPS Daemon developed by Rob McCool at the National Center
    for Supercomputing Applications (NCSA), University of Illinois, Urbana-Champaign.
    McCool left the NCSA in mid-1994, and the project was temporarily stalled. During
    this time, many web developers had compiled extensions and bug fixes of their
    own that needed a common release to the public. Out of this, a small group of
    webmasters collaborated to form a common information space and mailing list and
    began on a new release. This became Apache 0.6.2 in April of 1995. At the same
    time, the NCSA also began further development on their own web server and added
    as honorary members to the Apache project that they could pool their ideas and
    code to further the realm of web serving.


    The early Apache web server was a hit, but the code base required a massive overhaul
    and redesign. In the few months, Rob Hartill and the rest of the development group
    began developing new features while Robert Thou designed a new server architecture
    that provided more stability and extensibility. This gave birth to Apache 0.8
    in August 1995, and with beta testing and ports to many platforms, we were given
    Apache 1.0 in December of that year. In less than a year after the group was formed,
    Apache server took the lead as the one web server and has stayed there since.


    Now that you are aware of some of the features and the presence of Apache Web
    Server, let’s get started with learning more in-depth about the current versions
    and what you can do with the product.


    # Choosing a Version: Apache 1.3 vs. Apache 2.0


    Apache 1.3 is the well-established version, and Apache 2.0 is the new kid on the
    block. Many people believe that the Apache 1.3 series is old and no longer supported;
    however, this is not true. The Apache 1.3 series holds a more stable, tested,
    and proven code base, whereas the Apache 2.0 series is constantly going through
    upgrades, patches, and modifications.'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# New Features in Apache 2.0


    Apache 2.0 was designed to update many of the core features of Apache 1.3. Let''s
    take a look at some of the new features in Apache 2.0:


    **Unix threading** If your system supports Portable Operating System Interface
    (POSIX), you can run Apache 2.0 in hybrid multiprocessing, multithreaded mode
    and improve the scalability for some configurations.


    **New build system** The Apache 2.0 developers have rewritten the build system
    from scratch using autoconf and libbtool, which enable Apache''s configuration
    system to be more similar to other packages you might be familiar with.


    **Multrotocol support** The new infrastructure now has support for serving multiple
    protocols. This feature is not completed yet, so you might want to stay tuned
    to the Apache Web Server project website for more information.


    **Non-Unix platform support enhancements** Apache 2.0 runs faster on non-Unix
    platforms such as Windows, BeOS, and OS/2 because of the platform-specific multiprocessing
    modules (MPM) and the Apache Portable Runtime (APR). These new enhancements eliminate
    the requirement for POSIX emulation layers, which caused bottlenecks in Apache
    1.3.


    **IPv6 support** If your system supports IPv6, the APR uses IPv6 listening sockets
    by default.


    **Filtering** You now have the ability to write modules as filters that you can
    utilize the stream of content as it is delivered to or from the server.


    **Multilang error responses** Apache 2.0 now supports the ability to include,
    through SSI documentary, error messages that can be customized by the administrator
    for more consistency.


    **Simplified configuration** The Apache 2.0 development team has recognized the
    longstandingisputed usage of confusing configuration directives and they have
    attempted to fix this problem.


    **Native Windows NT Unicode support** When Apache 2.0 is running on Windows NT
    systems, UTF-8 is now used for all filename encoding. This translates the underlying
    Unicode filesystem and provides multilanguage support for Windows NT/2000 and
    XP systems. This feature is not available on Windows 95/98 or Me systems.


    **Regular expression library update** Apache 2.0 now includes the Perl Compatible
    Regular Expressions (PCRE) library, and the regular expression evaluation uses
    the Perl 5 syntax.'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# Module Enhancements in Apache 2.0


    Apache 2 offers a wide range of module enhancements over Apache 1.3. Let''s take
    a look at the documented enhancements now.


    +   - **mod_ssl (new SSL module)** - If you wanted to use mod_ssl in Apache 1.3,
    it had to be compiled and installed separately. Now, Apache 2.0 has built-in mod_ssl
    support.


    +   - **mod_dav (versioning module)** - This module implements the HTTP Distributed
    Authororing and Versioning (DAV) specification and is used for posting and maintaining
    web content.


    +   - **mod_deflate (compression module)** - This new module enables web browsers
    to request content before delivery, which in turn saves bandwidth. This is similar
    to the Apache 1.3 mod_gzip module, which was required to be installed separately.


    +   - **mod_auth_digest (session-caching module)** - This new module includes
    support for session caching across processes that use shared memory.


    +   - **mod_charset_lite (character set translation module)** - This new module
    is experimental and allows for character set translation or recoding.


    +   - **mod_file_cache (file-caching module)** - This module allows caching of
    frequently requested files that change very infrequently. The purpose of this
    module is to reduce the load of the server.


    +   - **mod_headers (HTTP headers alteration module)** - This module enables HTTP
    headers to be merged, replaced, or removed.


    +   - **mod_proxy (proxy module)** - This module has multiple features and is
    designed to implement a proxy or gateway for the Apache Web Server.


    +   - **mod_negotiation (content negotiation module)** - This module allows for
    selection of the document that matches the client capability—if several documents
    are available in Apache 2.0, the new directive ForceLanguagePriority exists now.


    +   - **mod_autoindex (directory listing module)** - This module has been updated
    from Apache 1.3 and now supports HTML formatting for auto-indexed directories.
    Additionally, the filters allow now control of sorting, version sorting, and wildcard
    filtering of the directory list.


    +   - **mod_include (Server Side Include, or SSI, module)** - Enhancements to
    the Apache 1.3 mod_include module have been made for Apache 2.0, such as the use
    of Perl Compatible Regular Expression (PCRE) syntax and method.


    +   - **mod_auth_dbm (database authentication module)** - Support for multiple
    types of Database Management (DBM)-type databases are now available using the
    AuthDBMType directive.'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# Which Version of Apache to Use


    Choosing your Apache version is something that should be taken from the correct
    perspective. Apache 1.3 is proven to be stable, and most importantly, compatible
    with PHP. Apache 2.0 is stable; however, there have been multiple problems with
    PHP compatibility. Making Apache 2.0 and PHP work together is as predictable as
    a flipping coin. You will never know for sure whether the configuration will work
    properly and you might be faced with in-depth troubleshooting and problem solving
    to find out why it will not.


    From our standpoint, we really hope that Apache 2.0 and PHP cooperate sooner rather
    than later because the features of Apache 2.0 look very promising.


    For this book, we will be using the tried and true concept and use the Apache
    1.3 series to avoid any heartache you might have due to different configurations
    and luck of the draw.


    # Understanding Apache 1.3


    Apache 1.3 added many useful features to Apache not previously available in older
    versions. A major addition that won''t affect the purposes of this book is the
    ability to support Windows NT, Windows 95, Cygwin, and NetWare 5.x. Apache 1.3
    also saw the addition of Dynamic Shared Object (DSO) support. This means that
    modules can be loaded into the server process at runtime so that they will be
    available only when needed, cutting back on memory usage. They reorganized the
    source files as well, changing the Module lines in the configuration with AddModule
    instead.


    If you have used a previous version of Apache and are reading this book as a refresher,
    you should be aware of the differences. We will discuss this and DSOs in more
    depth in the "Apache Web Server 1.3" section later in this chapter. Reliable piped
    pipes were also added, enabling Apache to respawn the logging process if it dies,
    or otherwise gets stuck. This of course is much better than Apache having to completely
    restart it.


    # Apache 1.3 Features


    Apache features are expressed in configuration parameters that can be specified
    in the httpd.conf file. Later in this chapter we will delve into the actual configuration
    of Apache after its installation. For now, let''s take a look at the available
    and applicable options Apache has to offer in terms of your server:


    AcceptFilter AcceptFilter off


    This directive is supported only by FreeBSD. AcceptFilter is used to control a
    BSD-specified filter optimization.'
