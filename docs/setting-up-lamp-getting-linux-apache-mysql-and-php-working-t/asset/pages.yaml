  md: 'Performing a man dig will also display an extended list of options. These options
    are specified by using a + followed by an optional no to state whether or not
    include the value for the following option. Here are some of the more important
    items you might use:


    +   +[no]tcp Use [do not use] TCP when querying a name server. The default is
    UDP unless the type is set to AXFR or IXFR.


    +   +domain=domainName option enables you to search the list to contain only the
    domain provided as it were specified in a domain directive in the /etc/resolv.conf
    file. It also enables search list processing, like the +search option.


    +   +[no]search Use [do not use] the search list as specified by the resolv.conf.


    +   +[no]cdflag This sets the Checking Disabled in your query. The server will
    not perform the Domain Name System SEcurity (DNSSEC) lookup and will return all
    other information specified.


    +   +[no]recursive This set [unsets] the capability of your name server to perform
    recursive queries on other name servers. This is automatically enabled unless
    you are specifying the nssearcharch or trace options.


    +   +[no]nssearch This specification enables you to tell your server to look for
    an authoritative name server for the specified domain. This ensures that the IP
    address is cached by your name server as well.


    +   +[no]trace Although trace is disabled by default, it has an interesting behavior.
    Much like the name suggests, it traces each of the queries made to each name server
    in order to resolve a domain name. Each of the answers from each queries will
    be printed to the screen.


    +   +[no]cmd You can use this option to toggle the comment field, which is initially
    printed when the command is run. This is the one that includes the options specified
    and the versioning info. This can be especially useful if you are running dig
    in batch mode.


    +   +[no]comments This flag toggles the display of the actual comment field in
    a name server answer.


    +   +[no]qr The qr option turns on [off] the printing of the query used to query
    the name server. By default, this option is off.


    +   +[no]question Show [do not show] the question portion of the response.


    +   +[no]answer Show [do not show] the answer portion of the response.


    +   +[no]authority Show [do not show] the authority portion of the response.'
