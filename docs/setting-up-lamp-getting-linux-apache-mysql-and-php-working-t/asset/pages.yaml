    # Linux Installation Checklist


    After finishing this chapter, you should feel empowered. With your first installation
    of Linux, you''ve opened a whole new world of possibilities. Pretty soon money
    will be flying at you from every direction. Okay, maybe not, but you will be learning
    more than ever as you begin Chapter 3, “Using Linux.” Here are a few key points
    you should have a firm grasp of before continuing:


    +   * Understand the major flavors of Linux and how Fedora fits into the mix.

    * Determine the system hardware requirements for different levels of simultaneous
    users.

    * Execute a download, checksum, and burn of Linux ISOs.

    * Be able to change your basic BIOS information, specifically the boot order of
    the devices on your computer.

    * Start an installation and understand the differences between installation types:
    Personal Desktop, Workstation, Server, and Custom.

    * Understand the Linux partitioning system and each filesystem type: ext2, ext3,
    software RAID, swap, and vfat.

    * Know the functionality of the GRUB boot loader and how it affects your system.

    * Have a basic knowledge of DHCP and eth0 network configuration.

    * Be acquainted with packages and package groups.

    * Be able to open a terminal window from the X window system, change directories,
    and open a file in vi.

    * Know how to modify your boot sequence to change run levels.


    If you haven''t grasped one of these elements, take the time to go back and review
    those areas. These concepts will give you a strong foundation on which start building
    your knowledge-edge and will prepare you for the next chapter.'
