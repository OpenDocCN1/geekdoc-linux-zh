    for custom-izing your user layout and structure:


    +   - **c comment** This adds a comment to the password comment file, which is
    where the user''s full name is stored.


    +   - **d directory** The directory argument enables you to specify the user''s
    home directory. The default is to append the user''s login to the default home
    directory setup on your server.


