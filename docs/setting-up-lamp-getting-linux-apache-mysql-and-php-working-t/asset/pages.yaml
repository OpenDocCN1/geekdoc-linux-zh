    # Performance and Replication


    Performance and replication can be a complicated issue. With thousands, if not
    millions, of setups, each installation is unique. Truly tuning a server to reach
    maximum performance requires an understanding of the entire system. This type
    of understanding reaches a level that is beyond the scope of this book. (See Appendix
    C, "Getting Support," for a list of books and other resources). For now, we are
    going to cover some of the simpler procedures and methods of using multiple database
    servers through replication via master/slave architecture.


    Replication enables you to run multiple database servers that share the same information.
    For large-scale projects, this becomes necessary in order to keep queries down
    to acceptable speeds. If you have made every effort to optimize your queries by
    adding additional indexes and perhaps additional reference tables for quicker
    lookups, it is time to consider replication to enhance your application.


    Replication is accomplished by MySQL having the master server keep track of all
    changes. Therefore, it is necessary to have binary logging enabled for your master
    server. Each slave server then receives the same commands from the master server
    so that it can process the same commands on itself. Remember that the binary log
    stores only queries and statements that have actually modified data. This prevents
    a slave server from running needless queries taking up valuable resources.'
  merge: -1
  pgno: 298
- img_proc: true
  md: '# 276 Chapter 9 • MySQL: Installation and Administration


    When setting up your slave servers, you must have an exact copy of each database
    to be replicated in place on each slave server. This way, the binary log makes
    a change, each database on each slave server will be an exact duplicate. To do
    this, you can use the LOAD DATA FROM MASTER command. This command uses a global
    lock on the master server to ensure that all data is replicated at that point
    in time. This works only for MyISAM tables, however, and you will need to specify
    privileges your slave account on the master. After you use this command, the slave
    transfers all data from the master. Then, after the slave is started, it establishes
    a connection and waits for any additional data that is written to the binary log.
    If for some reason loses its connection, it will attempt reestablish that connection
    every 60 seconds. You can change this by using the --master-connect-retry directive.


    NOTE The master is never aware of how many slave servers are present.


    # Understanding How Replication Works


    Before you begin issuing commands to set up your master and slave servers, let''s
    take a closer at how replication works in regard to threads. On the master server,
    there will be one thread for each slave. Each of these threads is referred to
    as the BinLog Dump thread and it is in charge of sending each new statement that
    updates data to a slave. Each slave server will run two additional threads: the
    I/O and SQL thread is the thread that connects to the master server and receives
    the commands from the BinLog Dump thread. These commands are copied to local files
    for processing by the SQL thread. These files are called relay logs.


    Using two separate slave threads enables the slave server to separate the reading
    and execution of the statements. Therefore, the reading of the statements from
    the master is not slowed down by SQL''s ability to process these statements. This
    allows for a type of queue. To view these threads later, after your installation
    is complete, you can use the SHOW PROCESSLIST command. To make this a bit easier
    to read, try substituting the semicolon normally used to give you a vertical print
    for better human readability. Performing this command on a slave server will give
    you an output similar to the following:


    ```

    ******************** 1. row *********************

    Id: 10

    User: system user

    Host:

    d: NULL

    Command: Connect

    Time: 11

    State: Waiting for master to send event

    Info: NULL

    ******************** 2. row *********************

    Id: 11

    User: system user

    ```'
  merge: -1
  pgno: 299
- img_proc: true
  md: '```

    Host:

    db: NULL

    Command: Connect

    Time: 11

    State: Has read all relay log; waiting for the slave I/O

    thread to update it

    Info: NULL

    ```


    In this example, thread 10 is your I/O thread, and thread 11 is your SQL thread.
    These states, however, can change depending on what action they are performing.
    Your master server''s BinLog Dump thread can the following states:


    **Sending binlog event to slave** This means that the master has received a statement
    that has updated its binlog and is currently sending this information to the slave.


    **Finished reading one binlog; switching to the next binlog** This means that
    the master server has finished reading a binlog and is opening the next to send
    to the slave.


    **Has sent all binlog to slave; waiting for binlog to be updated** Quite verbose,
    this means that the slave I/O thread has read all the statements sent by the master.


    **Waiting to finalize termination** You will not likely see this state appear
    because it occurs for only the brief moment the thread is stopping.


    Each thread has its own thread states that will be given. The slave I/O thread
    can have the following states:


    **Connecting to master** The thread is attempting to connect to the master.


    **Checking master version** This status is displayed for a brief moment after
    a connection with the master has been established.


    **Registering slave on master** This status is displayed for a brief moment after
    a connection with the master has been established.


    **Requesting binlog dump** This status is displayed for a brief moment after a
    connection with the master has been established. This is the request for the contents
    of its bin log.


    **Waiting to reconnect after a failed binlog dump request** This state is displayed
    during the time the thread is “asleep,” while it is waiting for the timeout to
    connect again.


    **Reconnecting after a failed binlog dump request** The slave I/O thread is attempting
    to reconnect to the master.


    **Waiting for master to send event** This is the idle status of the thread. When
    the I/O thread has read all the changes to the database and the master is not
    currently updating and sending new events, the I/O thread will read this state.'
  merge: -1
  pgno: 300
- img_proc: true
  md: '# 278 Chapter 9 • MySQL: Installation and Administration


    Queuing master event to the relay log The I/O thread has received a new event
    and is currently writing it to the relay log.


    Waiting to reconnect after a failed master event read An error has occurred in
    the connection, and the thread is waiting for the appropriate timeout to occur
    so that it can attempt to reconnect to the master.


    Reconnecting after a failed master event read The thread is currently attempting
    to reconnect.


    Waiting for slave SQL thread to free enough relay log space This means that the
    SQL thread is currently backed up with work and the relay log size has reached
    its maximum. This shows only if you have specifically set the relay log size limit.


    Waiting for slave mutex on exit This is a brief state denoting the thread is stopping.


    The last thread, the SQL thread, has the least amount of states because of its
    single purpose of processing events from the relay log. Here listed all its states:


    Reading an event from the relay log The thread is reading an event from the relay
    log for processing.


    Has all relay log; waiting for the slave I/O thread to update it All events from
    the relay log have been processed. This is the SQL thread''s idle state.


    Waiting for slave mutex on exit This is a brief state denoting the thread is stopping.


    # Introduction to Replication Application


    With an understanding of how MySQL database replication works and an insight into
    the responsibilities of each applicable thread, you can now take a look at the
    process for creating a replication setup. This is not the only way to set up replication;
    there are many techniques. It will, however, give you a straightforward method
    that works.


    +   1. First, you must have valid installations of MySQL on each server for your
    replication process. We will be using two servers, but you can use as many as
    you wish, performing the actions on each slave server when we perform them on
    a single slave server.


    +   2. Next you will need to make some changes to your my .cnf files if they do
    not already exist. On your master server you should have /etc/my.cnf, including
    the following two lines:


    ```

    [mysql]

    log-bin

    server-id=1

    ```


    This will enable the bin logs as we discussed earlier as well as provide this
    server with a unique ID. Remember that each server must have a unique ID and be
    an integer from 1 to 2^32. On Uint'
