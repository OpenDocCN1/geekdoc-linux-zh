  md: '# Chapter 5 • Network Connectivity


    NICs are available in different speeds. A 10Base-T connection is capable of transferring
    10 megabits per second (Mbps). This is relatively low by today''s standards. Most
    cards available today and that are built into motherboards are 10/100Base-T. This
    means they can operate on 10Base-T and 100Base-T networks. You can now find, however,
    10/100/1000Base-T technology; if everything on your network is capable, you can
    hit speeds of up to 1 gigabit per second (Gbps). Many networks have implemented
    this, and hardware that implements gigabit technology is still a little pricey.
    In the future, even cable modem and DSL access will be available in gigabit speeds.
    Limited systems are already being tested in limited communities.


    # Hubs


    Hubs are passive network devices that share all packets transferred in the network
    with all other devices. Hubs come in different sizes and types for different applications:


    +   * **Stand-alone hubs** Stand-alone hubs are usually for networks with fewer
    than 12 devices. They are the cheapest options and are usually found in home networks
    or small offices.

    * **Stackable hubs** Stackable hubs are almost identical to stand-alone hubs,
    except you can stack (or connect) them to expand the total number of allotted
    devices. When these hubs are connected, they act as one modular hub.

    * **Modular hubs** A modular hub is usually a specialized case that allows for
    multiple hub cards to be added as needed. This offers a slight performance increase
    over a scalable hub because each hub card is connected via a backplane-type application
    (similar to a motherboard) and allows higher transfer speeds. A modular hub system
    comes with a management option as well as that different cards can be linked together
    while remaining separate from other hubs that are linked together.


    Hubs definitely have their advantages. You can find an eight-port hub for under
    $50 and there is no configuration necessary at all. Simply plug everything in
    and you are ready to go.


    The problem with using hubs is, you have every device on your network sending
    traffic to everyone else at once. If two machines try to send data at the same
    time, a collision will occur. A collision results in both packets being dropped.
    This is when, from our earlier examples, TCP will take over and ask for the packets
    to be reent. Although this is not a problem that occurs infrequently, collisions
    can cause larger networks to suffer from serious degradation of services and fail
    to operate anywhere near optimal levels. If this is the case, switches and routers
    need to be considered.


    # Switches


    A switch, unlike a hub, is an active network device. It separates each of the
    devices that are connected to it into separate collision domains, or nodes, in
    order to drastically reduce the number of collisions. Each packet when received
    is analyzed, and the destination is determined by the'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# Setting Up Hardware


    MAC address. A switch also stops bad or misaligned packets from being transferred
    throughout the network. Because the packets are regenerated from the switch, it
    allows for greater length to its next hop in the network without using bridges.
    (We''ll discuss bridges in more detail in this section.)


    Switches are also capable of linking to each other in order to provide higher
    amounts of bandwidth to more important or higher-trafficked servers. When a network
    uses multiple switches linked together, it is often referred to as a collapsed
    backbone network.


    It is also possible for some switches to run in duplex mode, if the client machines
    also have full duplex, double the connection speed by allowing data to flow in
    both directions at maximum speed. This would bring a Fast Ethernet (100Base-T)
    to a combined 200Mbps.


    Switches vary on use depending on type and manufacturer. All modern switches have
    the capability to “learn” your network. After it is installed, the switch learns
    the location of each network device, depending on its connection and by building
    a table that it saves. While they come in, for the most part, easy to set up,
    switches can require a significant amount of customization and configuration for
    more advanced networks.


    A switch is generally three to five times the cost of a hub and has the same number
    of ports, which is one of the reasons it is not generally used in small networks.
    However, the main reason they are not used is because the packet processing time
    is greater than that of a hub. Hub does not take any time to analyze a packet
    before sending it; it duplicates the packet on all connected ports. A switch reduces
    the number of collisions but a network increases the amount of time each packet
    takes to be processed. The performance gain versus cost does not match up, so
    if you have a small network, a hub is most likely your best solution.


    # Routers


    A router works in a similar manner to a switch but defines separate networks logically
    instead of physically. It uses IP addresses to determine what packets go where.
    Because it uses IP addresses, a router falls into the Network layer rather than
    the Data-Link layer. Routers do not need to be a stand-alone network appliance
    either; they can be a computer set up with least two network cards. Your Linux
    machine is capable of acting like a router.


    Most routers also have the capacity to use filtering. Filtering is, at its base
    level, a firewall action. Filtering allows packets of information, based on their
    IP and destination port, to be forwarded or dropped. This prevents unwanted or
    mischievous packets from entering one network from another. A router''s efficiency
    is measured by its latency, or lack thereof. The time it takes to process a packet,
    the faster your network will be. You might sometimes hear the term PPS, which
    stands for packets per second.'
