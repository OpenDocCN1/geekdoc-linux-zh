    Substitutions The MySQL documentation also uses db_name, tbl_name, and col_name
    to represent variables that should be substituted for your database, table, and
    column names, respectively. You will also see these names in lowercase, whereas
    the SQL syntax will be in uppercase.


    Square brackets Brackets within the MySQL documentation are used to express a
    value or directive that is optional. For example, if you see an argument as p[password],
    the password is optional here. You will be prompted later, but the password is
    not required for the argument.


    Braces Braces are used when something has more than one option and you must choose
    one of them. You will generally see each option listed in brackets and separated
    by a pipe symbol (|). For example, the protocol flag for mysqladmin requires the
    following syntax:


    ```

    --protocol={TCP|SOCKET|PIPE|MEMORY}

    ```


    Here you are again is required, and you can specify only one.


    Ellipsis points Ellipsis points are the three dots to indicate an ellipsis (omission)
    in text. Similarly, in the MySQL documentation, this is used as a form of shorthand
    to avoid having to write an example over and again and confusing the reader with
    additional syntax that is not relevant to the example. For instance, you might
    see a SELECT statement following an INSERT ... SELECT. This simply indicates a
    SELECT statement. Ellipsis points can also be used to express multiple options
    or values of the preceding syntax may be optional.


    By knowing how to read the MySQL documentation, you will be on your way to finding-immediate
    answers to any questions you might have. During the installation procedure, you
    might want to refer to the documentation if you are planning on performing a unique
    installation that is not covered by this book. After your installation and during
    your time developing applications that use MySQL, the documentation will become
    an invaluable resource. Remember or refer back to the standards listed here to
    make researching your answers more efficient and painless.


