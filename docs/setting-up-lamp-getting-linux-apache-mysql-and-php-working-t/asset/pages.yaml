    # Configure SpamAssassin


    SpamAssassin comes with pretty large configuration files that you can tweak to
    your desire. The files are located in /etc/mail/spamassassin, and you can start
    with the local.cf file.

    Here is how our default local.cf looks. Yours might be slightly different, depending
    on the version.


    > # These values can be overridden by editing ~/.spamassassin/user_prefs.cf

    # (see spamassassin(1) for details)


    # These values should be safe assumptions and allow for simple visual sifting

    # without risking lost e-mails.


    ```

    required_hits 5

    rewrite_subject 1

    subject_tag [SPAM]

    report_safe 0

    ```


    Because the default is basic, you will want to modify your configuration from
    the previous default example. This configuration file is set up so that if SpamAssassin
    scores a file as a 5 or higher, it will rewrite the subject of the mail with a
    tag such as [SPAM] or whatever you desire. However, the body of the e-mail will
    be presented to you. You will fix this by enabling the report_safe option in your
    configuration file. On our production server, we configured the following rules
    in our local.cf:


    +   # Allow SpamAssassin to rewrite the subject line of any'
  merge: -1
