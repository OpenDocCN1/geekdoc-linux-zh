  md: '# Managing Software


    differences in configuration. You will most likely want the same setup for your
    software as was previously installed. Some background processes that might not
    be immediately evident require the old configuration, in which case you would
    not know something is functioning properly until you have gone live, or put the
    test server into production.


    NOTE


    You can use the upgrade command for installation of packages as well. Red Hat
    recommends using upgrade because it provides the same functionality that the installation
    does if there is no previously existing package of an older version on the system.


    NOTE


    Upgrading a package is actually a combination of uninstalling and installing.
    Therefore, you might receive error messages from either of these commands.


    The only error message attached to the actual upgrade command is as follows:

    foo package foo-1.1-2.2 (which is newer) is already installed

    error: foo-1.1-2.i386.rpm cannot be installed


    This tells you that you are trying to install a version that is older than the
    currently installed version. If you would like to downgrade the package and install
    the older version, you can use this command:


    rpm -Uvh --oldpackage foo-1.1-2.i386.rpm

    This installs the older version just as it would a newer package.


    # Freshening


    Freshening a package is similar to upgrading a package except that it will not
    install a package that does not have a previously existing copy already installed.
    You can use the freshening command by typing the following:


    rpm -Fvh foo-1.1-2.i386.rpm


    If the package Foo already exists and is older, the new version will be installed.
    If not, no changes will be made.


    A good use for the freshening flag is when you wish to install a group of rpm
    files only if they already exist on the system. If you downloaded a large number
    of the latest distributions of multiple programs, you might not want to delete
    all the packages you did not install. Instead, you could choose to leave all in
    one directory and type the following:


    rpm -Fvh * .rpm


    Now RPM will install only the packages that already exist on your system—very
    handy if you receive a distribution CD that contains a large number of packages,
    many of which you do not need on your system.'
