    applications that come with Linux. Now you have the opportunity to learn more
    about free software that you will use by following the examples we set for you
    in this book to create your own LAMP solution.


    # LAMP versus Other Solutions


    Other solutions such as Microsoft''s Internet Server (IIS) are popular. However,
    the lack of security and potential higher cost of hardware and maintenance keep
    them out of reach of many small companies. Rather than spend millions in licenses
    and administrative costs for an inferior product, we choose to run a Free Software
    solution.


    Speed is another significant factor to most of us. We need Web-based applications
    to respond quickly and remain snappy throughout the user''s experience. With proper
    coding techniques, PHP is many times faster than Microsoft''s ASP or Microsystems''
    Java platform.


    Another great feat of PHP is the ability to create command-line scripts that can
    perform tasks to your system at intervals by using CRON jobs within Linux. You
    can have PHP clean up your MySQL database weekly, or create backups of your website
    every few days, and so on. Although many PHP versus ASP debates could be spawned
    from these statements, the truth stands that ASP probably will never be as robust
    as PHP.


    In the end, it''s you that you make LAMP better than other platforms. Through
    the use of the LAMP combination, you directly contribute to the success of the
    software on your server.'
