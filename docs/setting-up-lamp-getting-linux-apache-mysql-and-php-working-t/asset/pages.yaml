- img_proc: true
  md: 'Now that you have everything installed, it is time to perform a few tests that
    will ensure the elements are working properly. In this chapter, we are going to
    cover how to ensure that Apache, MySQL, and PHP are working together on your Linux
    system. You will create an Apache virtual host, a MySQL database, and a MySQL
    user; you will also grant permissions to the data-base and create a set of PHP
    scripts that will enter data into the database and extract it into formatted HTML.


    Keep in mind that this book is not written to teach development with PHP; therefore
    we are going to give you enough information in this chapter to test the core elements
    of your installation. If you wish to learn more about PHP development, you should
    check out the resources we have listed in Appendix C, "Getting Support."


    This chapter assumes that you already have DNS set up for your domain name. DNS
    configuration is beyond the scope of this book and is not covered here.


    # Setting Up Apache Virtual Host


    If you did not set up an Apache virtual host in Chapter 8, "Apache Web Server:
    Installation and Configuration," you should do so in order to test your skills
    at editing the Apache configuration-file. You will create a virtual host for a
    domain named yourtest.com, which will reside in the /home/yourtest.com/public_html
    directory. Follow these steps:


    +   1. If you followed our examples in Chapter 8 on creating a separate vhosts
    directory for configuration files, add a new file there now; otherwise, edit your
    httpd.conf file and append the code to it (remembering to substitute a domain
    name you have access to for yourtest.com):


    ```

    <VirtualHost *

    ServerName yourtest.com

    ServerAlias www.yourtest.com

    DocumentRoot /home/yourtest.com/public_html

    </VirtualHost>

    ```


    If you have not already configured the NameVirtualHost directive, you will need
    to do so now. Find the NameVirtualHost directive and alter the line to the following:
    NameVirtualHost *


    +   2. Create the directories for yourtest.com:

    mkdir -p /home/yourtest.com/public_html


    +   3. Restart Apache, and your new virtual host should take effect.'
  merge: -1
  pgno: 343
- img_proc: true
  md: "# Preparing the MySQL Database and User\n\nTo retrieve information from the\
    \ database for your PHP script, you'll first need to create a database with a\
    \ table as well as a user for that database. You will begin with creating the\
    \ data-base. Follow these steps:\n\n+   Log in to MySQL as the root user (or another\
    \ user who has access to create new databases, tables, and users). You should\
    \ use something similar to the following:\n```\nmys -user -p\n```\n\n+   After\
    \ you have logged in, create your database:\n```\nCREATE DATABASE my_test;\n```\n\
    If the database has successfully been created you will see this:\n```\nQuery OK,\
    \ 1 row affected (0.02 sec)\n```\n\n+   Switch to the database by typing:\n```\n\
    USE my_test;\n```\nAfter the command has been executed, you will be told\nDatabase\
    \ Changed\n\n+   With our database selected perform:\n```\nCREATE TABLE my_table\
    \ (\n  my_table_id INT(11) NOT NULL AUTO_INCREMENT,\n  my_value VARCHAR(30),\n\
    \  my_date DATE,\n  PRIMARY KEY(my_table_id)\n);\n```\n\nAs a result you should\
    \ see a Query OK statement and be returned to a SQL prompt. You now have a database\
    \ and table created.\n\n+   Now you'll create a unique user for this database\
    \ with full privileges so that you can connect using PHP. This prevents anyone\
    \ who might gain access to your PHP script from tampering with your entire MySQL\
    \ Server. Run this query:\n```\nGRANT ALL PRIVILEGES ON my_test.* TO 'test_user'@'localhost'\n\
    IDENTIFIED BY 'test_pass';\n```\n\nThat's now you have a database, table, and\
    \ test user ready for your PHP script.\n\n# Testing Apache, PHP, and MySQL\n\n\
    In this section you are going to run a few tests to ensure that Apache is parsing\
    \ your PHP files properly, and that PHP and MySQL are connecting and working together.\
    \ You'll know"
  merge: -1
  pgno: 344
- img_proc: true
  md: "if Apache and PHP are working correctly because you will see the output from\
    \ PHP as we will discuss it throughout the rest of this chapter.\n\n# Database\
    \ Connection Script\n\nTo start, you will create your PHP script that is responsible\
    \ for performing the database connection. This script is named database-connection.php\
    \ and will be located in your virtual hosts' root directory (/home/mytest/public_html).\
    \ This script will contain information as the MySQL host, username, password,\
    \ and database you will be using for this script. The script will contain the\
    \ information in Listing 11.1, assuming you followed our example in the preceding\
    \ section, \"Preparing the MySQL Database and User.\"\n\n# Listing 11.1 database-connection.php\
    \ Script\n\n```\n<?php\n// Database Connection Script\n\n$dbUser = 'test_user';\n\
    $dbPass = 'test_pass';\n$dbName = 'my_test';\n$dbHost = 'localhost';\n\n$sql =\
    \ mysqli_connect($dbHost, $dbUser, $dbPass)\nor die (mysql_error());\n\nmysqlselect_db($dbName,\
    \ $sql) or die (mysql_error());\n?>\n```\n\n# Database Insertion Script\n\nNow\
    \ that your database connection script is ready to use, let's create a script\
    \ that will insert some information into your database. This script will include\
    \ the database connection file (database-connection.php) created in Listing 11.1,\
    \ which in makes your database connection available for the $sql resource identifier.\
    \ Next, this script will run a foreach loop that will create 50 entries of data\
    \ into your database. Take a look at Listing 11.2 for the database-insert.php\
    \ script.\n\n# Listing 11.2 database-insert.php Script\n\n```\n<?php\n// Data\
    \ insertion script\ninclude('database-connection.php');\nfor($i = 0; $i <= 50;\
    \ $i++){\n  if($i % 2) {\n    $data = $i.' - Odd Result';\n  } else\n```"
