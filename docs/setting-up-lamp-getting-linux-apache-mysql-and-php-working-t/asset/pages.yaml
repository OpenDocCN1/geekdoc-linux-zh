  md: '# Performing MySQL Administration


    This section will cover the basics of administering your MySQL Server. There are
    a variety of methods to accomplish any given task for your MySQL Server. In this
    section we will show you how to use the command-line tools that MySQL provides
    with its installation as well as basic MySQL Client work to create and administer
    databases and users. We will also cover how to correctly back up and restore your
    databases to minimize data loss during a disaster recovery or if a user has accidentally
    deleted corrupted their data.


    # Using Command-Line Tools


    MySQL offers a variety of commands to accomplish administrative tasks for your
    MySQL Server. When used properly, these commands will enable you to perform more
    advanced tasks with ease and efficiency. All of the commands that we will cover
    are located in the /usr/local/mysql/bin directory. If you need to access these
    commands frequently, you might create symbolic links to them within your /usr/local/bin
    directory. This will, of course, prevent having to type the full pathname before
    each command. You could also add the directory to your path configuration.


    Because each one of these commands offers a wide variety of options, we will cover
    only the basic usage of each. If you need more information for any given command,
