  md: '# Chapter 8 • Apache Server: Installation and Configuration


    apachectl

    The first command is apachectl (Apache Control), which you linked to your path
    so you will have a shortcut in your command line. The apachectl command accepts
    multiple arguments that enable you to perform certain actions for the server:


    +   apachectl start This command starts the Apache Web Server.


    +   apachectl startssl This command is available when you compile with mod_ssl1.
    It starts Apache in normal mode and enables the SSL server mode as well.


    +   apachectl stop This command stops the Apache Web Server.


    +   apachectl restart This command attempts to restart the Apache Web Server if
    it is already running; otherwise, it will start the server.


    +   apachectl fullstatus This command dumps the full status of the server to the
    screen. It requires that you have the Lynx web browser installed and the mod_status
    Apache module enabled in the http.conf configuration.


    +   apachectl status This command dumps the short status of the server to the
    screen. It requires that you have the Lynx web browser installed and the mod_status
    Apache module enabled in the http.conf configuration.


    +   apachectl graceful This command is used to gracefully restart the web server
    by sending a SIGUSR1 to the system, or to start it if it is not already running.
    We have used this command for log rotation purposes.


    +   apachectl configtest This performs a syntax check of your configuration files
    such as httpd.conf.


    TIP

    Always apachectl configtest after you make changes to your configuration files
    and before you restart the server. It could help prevent downtime because Apache
    will fail to start if there are syntax errors in your configuration files.


    +   apachectl help This command displays a list of options for the apachectl executable.


    apxs

    The Apache eXtension Tool (APXS) is used for building and installing extension
    modules using the Dynamic Shared Object (DSO) support. It is useful for installing,
    enabling, or disabling modules within an already built and installed Apache Web
    Server.


    We will not cover usage of apxs in this book; however, here is the output from
    the command-options:


    ```

    Usage: apxs -g [-S <var>=<val>] -n <modname>

    apxs -qf [-S <var>=<val>] <query> ...

    ```'
