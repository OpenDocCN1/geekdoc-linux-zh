  md: '# Obtaining Fedora Linux


    Fedora Linux can be acquired in several ways, the two most popular being to download
    or purchase. This section discusses both.


    If you have access to a computer that has a CD-R or CD-RW drive, you can download
    the complete set of installation disks, for free, directly from the Internet in
    International Organization for Standardization (ISO) format from a site such as
    LinuxForum (http://www.linuxforum.com). After you''ve located the Fedora download
    section, it''s time to choose a version. It''s best to download the newest full-release
    version because a full release has been deemed stable and is out of its testing
    phases. Fedora Core 2 is the newest release, so this book will be covering that
    version in the most detail. If you are unable to find the distribution in LinuxForum,
    you can check the Fedora mirrors list at http://fedora.redhat.com/download/mirrors.html.


    # The Crucial MD5 Checksum File


    Make sure that there is a Message Digest 5 (MD5) checksum file located with your
    ISO files. The purpose of a checksum is to verify that your downloaded copy of
    the file is an exact duplicate of the original. This can prevent people from tampering
    with the distribution and possibly rebuilding it with malicious code, and it can
    also detect viruses that might have attached themselves as the file you traveled
    to.


    It is always a good idea to run a checksum on your downloaded files. Even if there
    is no malicious code, the file can still prevent you from burning a bad disc and
    having to abort your installation. Many MD5 checksum programs are available as
    freeware on the Internet. You can also find free Scripts that will perform the
    same operation.


    You can check the URLs for Windows versions of a free MD5 checksum utilities:


    +   * http://www.irnis.net

    * http://www.dpaehl.de

    * http://www.brandonstaggs.com

    * http://www.fastsum.com


    If you would like to run an MD5 checksum, you can go to the last choice listed—FastSum
    for a free version. Download, install, and launch FastSum, and you are ready to
    verify your ISOs. To use FastSum, you will need to use the command line, or open
    a command window in Windows and use the following format to run the checksum:


    ```

    FSUM "C:\directory\filename.iso" "C:\directory\md5file.md5"

    ```


    The program will then run, and any errors or inconsistencies will be checked.
    If everything is in order, you are ready to continue with the installation.'
  merge: -1
