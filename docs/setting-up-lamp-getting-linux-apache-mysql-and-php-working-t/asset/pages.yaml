  md: '# MySQL Configuration Directives


    --abort-slave-event-count=# Option used by mysql-test for debugging and testing
    of replication.


    --ansi Use ANSI SQL syntax instead of MySQL syntax.


    --back-log=# The number of outstanding connection requests MySQL can have. This
    comes into play when the main MySQL thread receives many connection requests in
    a very short time.


    --basedir=name The path to the installation directory. All paths are usually resolved
    relative to this.


    --bdb Enable Berkeley DB (if this version of MySQL supports it). Disable with
    --skip-bdb (this will save memory).


    --big-tables Allow big result sets by saving all temporary sets on file (solves
    most table full errors).


    --bind-address=name The IP address to bind to.


    --binlog_cache_size=# The size of the cache to hold the SQL statements for the
    binary log during a transaction. If you use big, multi-statement transactions,
    you can increase this to get more performance.


    --binlog-do-db=name Tells the master it should log updates for the specified database
    and should exclude others not explicitly mentioned.


    --binlog-ignore-db=name Tells the master that updates to the given database should
    not be logged to the binary log.


    --bootstrap Used by MySQL installation scripts.


    --bulk-insert_buffer_size=# The size of the tree used in bulk insert optimization.
    Note that this is a limit per thread!


    --character-sets-dir=name The directory where character sets are located.


    --chroot=name Chroot the mysqld daemon during startup.


    --concurrent-insert Use concurrent insert with MyISAM. Disable with --skip-concurrent-insert.


    --connect-timeout=# The number of seconds the mysqld server is waiting for a connection
    packet before responding with Bad handshake.'
