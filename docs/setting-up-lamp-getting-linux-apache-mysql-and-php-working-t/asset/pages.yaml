  md: '# 44 Chapter 3 • Using Linux


    To access the shell, however, you must pass through other programs. Name prominently,
    mengetty is displayed asking you for a login. The mengetty program was designed
    to be a minimum getty for the virtual terminals you use when accessing the system
    from the local keyboard and monitor; mengetty does not have all the functionality
    that getty does, but it requires only a fraction of the resources. If you will
    be using the server as remote only and not be using any local access to the system,
    you might wish to remove all one of the mengetty calls in the itittab file to
    save approximately 8KB of memory per instance. You can still log remotely because
    a remote login is usually available through the Secure Shell (SSH) connection
    protocols (controlled by the inet daemon), but it is a good idea to leave one
    8KB instance open in case you need to access the machine locally.


    After a successful login, you are presented with a Bash shell. The Bash shell
    is a command language originally created for the GNU operating system. Bash stands
    for Bourne-Againe SHell, which is a pun based on Bourne''s name. Bourne originally
    created the Unix shell /bin/sh, which first appeared in the Seventh Edition Bash
    Labs version of Unix. The Bash shell also incorporates a large amount of /bin/csh,
    or C Shell, functionality to allow for a more diverse set of instructions and
    commands available to the user.


    Although a shell is a command-line interpreter, it also acts as a programming
    language on its own. This concept stems from the power of the Linux operating
    system. Any shell can be used synchronously or asynchronously. This, in effect,
    means that processes can be executed in order, each waiting for the previous to
    finish, or they can be executed in parallel (multitasking). Furthermore, there
    are redirection constructs in place that allow microcontrol over the input and
    output of any the commands. The shell also allows control over the commands''
    environments in the form of flags and other arguments.


    Let''s look at some fundamental principles that you should know before entering
    into more advanced concepts:


    Tab You can use the Tab key to finish a file or directory name for you. If you
    begin typing superifragilisticexpialidocious, just use Tab to auto-complete the
    rest of the file. If more than one word is a match for what you have typed so
    far, then nothing will appear to happen or auto-complete will fill up to the tack
    in matching. Pressing Tab will give you a list of all possible matches. After
    you enter a few more letters that result in only a single match for the rest of
    the string, the Tab key will complete the string.


    Escape character Bash uses the backslash (\) as an escape character. An escape
    character preserves the literal value of the next that follows the backslash.
    If you wish to have a backslash contained within an argument, then you will need
    to use two backslashes (\\) in order to escape the backslash itself.'
