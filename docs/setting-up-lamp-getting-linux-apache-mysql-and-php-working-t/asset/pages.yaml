  md: '# Understanding How E-Mail Works


    machine as you. Tomlinson invented the use of the at (@) symbol to designate a
    user at another computer, or in our case now, another domain (for example, username@someplace.com).


    An e-mail is composed of three parts:


    **The header** contains information indicating the type of e-mail, whom it''s
    to, whom it''s from, and where it''s been.


    **The body** of the e-mail is the message you receive when you read the e-mail.


    **The attachments** are typically base-64 encoded by your client before they are
    in order to make them easily readable by the e-mail servers that send, receive,
    and forward the email. Other e-mail attachments may be of multipart MIME format,
    HTML, RTF, ASCII attachments as part of the original message.


    Without delving deep into the specifics of an e-mail, header takes a look at a
    few of the header sections that contain key information enabling the e-mail to
    travel to its intended destination:


    +   **X-Originating-IP** designates this IP address from which the e-mail originated.
    It is important to note that this could be forged, or *spoofed*, so it might not
    be accurate. However, the Received field, created later in this list, cannot be
    forged.


    +   **X-Originating-Email** as its titles, this is the e-mail address from which
    the originated. Like the IP address, this can also be forged.


    +   **From** This is the "from" address, which can also contain the user''s real
    name. When using a mail client this is what is shown, you will typically see a
    person''s name and e-mail address written as *Real Name* `<e-mail@server>` or
    `<e-mail@domain.foo`. The less-than and greater-than symbols are used as *tags*
    for the e-mail. This e-mail address can be set by the user through any client
    so it is also not be trusted.


    +   **To** The directive is the same as From except it specifies the e-mail''s
    intended destination. It might also use the real name with the e-mail tag.


    +   **Received** An e-mail, after it is received, will usually have multiple Received
    entries. Every e-mail is forwarded by a server on its way to its destination,
    the server name it was received from, the server name it received by, the time
    it was processed, and a unique identifier is tagged onto the header. This helps
    e-mail servers filter spam and enables you to track what has happened with your
    e-mail along its route.


    +   **Mime-Version and Content-Type** These are used to specify the e-mail''s
    contents, for example whether it is a plain-text e-mail or formatted in HTML.
    Your e-mail client will use this information to display the message to you in
    the correct format.'
