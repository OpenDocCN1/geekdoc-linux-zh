  md: 'certain downloads such as kernel, kernel modules, and so on. This screen might
    be handy if you are compiling a custom kernel or want to stay on the version of
    any particular software you are currently using.


    For now, you will accept the default options and simply press Enter to continue.
    Next, you''re prompted to import the RPM-GPG key. Simply type the following into
    your command line:


    ```

    rpm --import /usr/share/rhn/RPM-GPG-KEY

    ```


    Now you are all set to run the update2 program and get your system updated! All
    you need is to run the following command:


    ```

    up2date --update

    ```


    You will see your system begin updating itself.


    # Using APT Package Management


    Debian and other flavors of Linux use a system called Advanced Package Tool (APT).
    APT enables you to retrieve files from a remote server for your system and update
    your system accordingly. This is similar in concept to the Red Hat update2 system.


    To obtain APT for Fedora, you can go to yum.arrow and then click apt in the left
    column. Grab the RPM and install it. Here''s how we performed the installation:


    ```

    cd /usr/local/src

    wget http://ftp.pub/freshrpmms.net/fedora/linux/1/apt/apt-\u0.5.15cnc3-0.5.15cnc3-0.1.fr.i386.rpm

    rpm -ivh apt-v1-apt.i386.rpm

    ```


    You should see the installation progress on your screen. After it is installed,
    you can run the apt-get command to compare your system against the updates available
    and then download the updates and install them. To upgrade APT, type the following:


    ```

    apt-get -u upgrade

    ```


    After you run this command, you will see a list of packages that were found to
    upgrade. You will be prompted to enter Yes or No to proceed. If you select Yes,
    the updates will begin to download and install.


    # Using Yum Package Management


    Yum (which stands for Yellowdog Updater, Modified) is another package management
    utility for Linux. It is similar in design and concept to update2 and APT. The
    great thing is that Yum comes installed on Fedora, you do not have to go out and
    find the installation files.


    To run Yum, you simply type the following:


    ```

    yum update

    ```'
