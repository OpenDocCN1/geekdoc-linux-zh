    more on this later.


    # Upgrading


    When attempting to upgrade a package, use the following command:


    ```

    rpm -Uvh foo-1.1-2.i386.rpm

    ```


    The Red Hat Package Manager checks for a previous installation of the software
    you are attempting to install and makes sure the appropriate package is removed
    first. During this process, you might see a message that looks similar to this
    one:


    ```

    saving /etc/foo.conf as /etc/conf.rpmsave

    ```


    This means the changes you might have made to the configuration file version might
    not be forward compatible with the version you are now installing. In this case,
    RPM automatically saves a backup version of the configuration file in case anything
    should go wrong. This will enable you to roll back changes made to installed packages.
    It is recommended that you take a look at both of these configuration files so
    that you can resolve any'
