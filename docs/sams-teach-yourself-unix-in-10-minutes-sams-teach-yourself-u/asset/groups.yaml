    ## 第 1 课

    ### 开始使用


    在本课中，您将学习如何登录和退出 UNIX 系统，以及操作机器的一些基础知识。您还将了解一些 UNIX 背景，例如它为何以这种方式运行。


    多年来，UNIX 一直是一个令人困惑的话题，吓退了许多人。互联网和万维网都是建立在 UNIX 机器之上的；因此，随着对互联网连接需求的增长，加上对更高性能和稳定性的渴望，感兴趣使用
    UNIX 的人数急剧上升。与此同时，个人电脑变得越来越易于使用，这也推动了实用工具的发展，使 UNIX 用户的生活更轻松。此外，这也有助于将 UNIX——在其所有变体中——从服务器机房推向桌面并进入家庭。


    ### 登录过程


    当您坐在 UNIX 电脑前时，您会首先注意到在做任何事情之前需要登录。UNIX 基于多用户原则——多个用户可以在同一台机器上拥有自己的账户、程序和设置。如果您熟悉
    Windows 95/98，多用户可能听起来很熟悉。然而，Windows 95/98 并不能保护用户的文件不被他人访问；它只是“隐藏”它们。此外，Windows
    95/98 不像 UNIX 那样允许多个用户同时运行程序。


    ### 所有权和权限


    UNIX 包含所有权和权限的概念。文件由单个用户拥有，权限控制谁可以在系统上查看、编辑或运行文件。幸运的是，普通用户几乎无需担心所有权问题。如果需要在系统上与其他用户共享文件，您可以查看第
    19 课“权限”。登录计算机后，您在当前会话期间创建的所有文件都将自动归您的账户所有。


    ### 多用户


    除了控制和跟踪谁拥有什么之外，UNIX 还允许多个用户同时访问系统。这与传统个人电脑操作系统提供的桌面环境截然不同。例如，当您正在处理电子表格时，您的同事可能正在为工程项目运行一系列计算。许多不同的进程可以由可能数百个不同的用户在单台计算机上同时运行。第
    11 课“进程”解释了进程的概念以及如何管理它们。


    ### 登录提示


    为了登录您的计算机，您需要提供用户名和密码。您的系统管理员很可能会为您提供用户名和密码。输入信息后，UNIX 会加载您账户的相应配置，您就可以开始使用系统了。输入用户名和密码时显示的屏幕因配置而异。您可能会遇到两种情况：图形登录屏幕或基于文本的屏幕。


    ![](img/2c005cbaad58c25c7f54da948131a75e_20_0.png)


    > 大小写是否重要 当您登录 UNIX 或使用其其他功能时，重要的是要记住 UNIX 是区分大小写的。操作系统将字母的大写和小写形式解释为两个不同的字符。因此，如果您获得的密码看起来像
    KiWisRgood，您可以肯定机器不会允许您使用 kiwisrgood 登录。


    ### 基于文本的登录


    基于文本的登录屏幕因 UNIX 发行版而异。大多数基于文本的 UNIX 登录提示看起来像这样：


    ```

    login:

    password:

    ```


    当您看到 login: 提示时，输入您的用户名并按回车。随后会立即出现 password: 提示。成功输入用户名和密码后，您将到达 shell 提示符。登录时需要注意几件事：不要使用退格键，因为某些系统无法正确解释它。此外，输入密码时数据不会显示在屏幕上（这是为了保护您的账户免受窥视）。现在您已准备好开始向系统发出命令。不要担心如果您不知道下一步该做什么；您很快就会学会如何做些有成效的事情。


    > 如果我输入错误怎么办？如果登录时出现错误也不用担心。系统会将失败的尝试记录到安全文件中。在默认的 UNIX 配置中，您有另一次登录的机会，因此如果第一次没有成功，也无需惊慌——每个人都会犯错！


    ### 图形登录


    而不是文本提示，您的机器可能配置了更精致的东西——一个图形屏幕，您可以在其中输入登录信息。这与基于文本的系统完全相同，只是它会立即将您启动到 X Windows
    环境中。一些图形登录屏幕允许用户从各种登录 shell 中选择或执行某些管理任务，但所有屏幕都提供登录系统的基本功能。它们各自都有一个输入用户名的区域和一个输入密码的区域。某些版本的
    UNIX 允许您在这些字段之间使用 Tab 键，而其他变体则要求您将光标定位到每个字段并单击以选择要输入的字段。无论如何，在明显的位置输入用户名和密码，然后按回车或单击登录按钮。


    ### 注销过程


    现在您知道了如何登录系统，这里快速了解一下注销过程及其重要性。您已经知道您的计算机可以同时供多人使用，并且可以拥有由许多不同人拥有的文件。登录过程将您标识给系统，使您可以使用自己的用户名控制计算机。如何撤销这一点？这就是注销过程的作用。它会关闭您可能打开的任何文件并关闭您可能遗留运行的任何程序。如果您一直保持登录状态，可能会使系统暴露于安全风险——更不用说您遗留运行的进程可能会减慢其他用户的计算机速度。完成使用后最好始终注销计算机。UNIX
    用户如果没有正确注销可能会遇到严重问题。


    ### 从基于文本的会话注销


    如果您没有运行图形会话（屏幕上看不到任何窗口），注销所需的唯一命令竟然是 logout。


    要从命令提示符注销，请输入：


    ```

    >logout

    ```


    系统立即返回到登录提示符。就这样。您已成功从计算机注销。


    ![](img/2c005cbaad58c25c7f54da948131a75e_22_0.png)


    > 注销替代方案 某些 UNIX shell 有挑剔的名声。在某些情况下，输入 logout 时，UNIX shell 可能会回复“Not login shell”消息并继续让您保持登录状态。别担心——即使
    shell 拒绝接受 logout 命令，您仍然可以使用 exit 命令注销。它与 logout 方式相同，并且会说服即使是挑剔的 UNIX 版本也允许您退出系统。


    ### 从 KDE 会话注销


    如果您通过 KDE 图形界面登录 UNIX 系统，您可以通过指向和单击退出系统。注销方法如下：

    - 1. 单击 K 符号，弹出主 KDE 菜单。

    - 2. 从菜单中选择注销

    - 3. KDE 会提示您并告知它已准备好关闭您的会话。单击注销按钮完成此过程。


    ### UNIX 命令提示符


    您可能在想，如果只能登录和注销，UNIX 对您有什么用。耐心点！如果操之过急，UNIX 会有点令人不知所措。UNIX 的强大之处在于其丰富的内置实用程序以及进程可以组合起来执行任务的方式，而这些任务在其他操作系统上可能需要定制编程。例如，假设您在
    UNIX 计算机上运行 Web 服务器，并且想要统计名为 kiwi 的机器的访问次数。如果您是程序员，编写一个程序来完成此操作并不困难——但使用 UNIX
    您不需要！相反，您只需输入如下命令：


    ```

    >grep "kiwi" /var/log/httpd/access.log ; wc -l

    ```


    此示例使用 grep，一个查找模式的程序，来查找 Web 服务器日志中包含 kiwi 的所有行；然后它将结果交给 wc，一个用于计数事物的程序。显然，您目前还不被期望知道如何构造此命令——但到本书结束时您将能够做到。


    当您向 UNIX 输入命令时，您实际上是在输入到称为 shell 的东西。对于所有老 DOS 用户来说，shell 有点像 Command.Com 的加强版。如果您还记得
    DOS 的时代，您可能也记得添加了计算机功能的各种 DOS shell。UNIX 有多种可供使用的 shell，每种 shell 都提供不同的功能。除了为用户提供运行命令的地方外，shell
    还提供一种脚本语言，它类似于 DOS 批处理文件，但功能更强大。


    使用 shell 编写的程序称为 shell 脚本。

