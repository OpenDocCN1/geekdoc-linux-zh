    in the middle of the night—without you even needing to be logged into the computer.


    ## More Than One Command at a Time


    UNIX enables you to run more than a single command at a time. This capability
    is known as multi-tasking and is available in different forms on some other operating
    systems as well. What makes UNIX different is that absolutely everything on UNIX
    is a process: Want a clock? Run a program. Need to copy files? That''s a process
