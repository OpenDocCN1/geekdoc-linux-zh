    \ 发送几封可怜的求助信，然后休眠 60 秒。之后，它会再次检查你的邮箱状态。如果在此期间你收到了邮件，mail 会给出邮件头而不是 No mail 响应。在这种情况下，不匹配\
    \ No 的行数会有一个非零的数值。（当然，前提是你不是那种倒霉的人，你的朋友回复：“No, we won't reply—go away!”）\n\n如果存在不包含\
    \ No 的行，hopeful 将不等于零，而 while 循环会终止。如果 hopeful 仍然为零，嗯，你朋友的邮箱会很快被填满...\n\n## USING\
    \ if\n\nif 命令的工作方式与 while 命令非常相似，只是它不会循环；它只是根据条件执行一条命令。if 命令的语法如下：if ( <condition>\
    \ ) <command>。\n\n用另一个愚蠢的例子来说，如果你因为没有电子邮件而感到恼火，并且讨厌看到那个 No mail 响应，你可以使用 shell\
    \ 脚本来解决这个问题。你可以尝试创建一个名为 checkmail 的 shell 脚本文件，其内容如下：\n\n```\n#!/bin/csh\nset\
    \ foo=`/bin/mail ; grep -cv 'No'`\nif ($foo == 0) echo \"You poor guy\"\n```\n\
    \n同样，它会使用 /bin/mail 来确定你是否有邮件；如果你没有邮件，嗯，你的电脑会表示同情。\n\n## SUMMARY\n\nShell 脚本可以让你添加功能并自定义你的环境。你可以选择做一些复杂的事情，比如创建小型程序，也可以做一些简单的事情，比如自动化日常重复任务。以下是本课要点的回顾：\n\
    \n- 你的 shell 脚本可以存储在文件中，以便你只需输入一条命令即可执行多条命令。\n- 有许多不同的 shell——你的 shell 可能与这里介绍的工作方式不同，但可能具有类似的功能。如果不是，换一个更好的\
    \ shell！\n- foreach 命令使你能够对一组文件中的每一个文件重复执行一组命令。\n- while 命令使你能够在某个条件成立时重复执行一组命令。\n\
    - if 命令使你能够基于条件语句执行或不执行一条命令。\n- sleep 命令在一段时间内什么都不做——有时这实际上很有用。\n\n## LESSON 15\n\
    User Utilities\n\n![](img/2c005cbaad58c25c7f54da948131a75e_158_0.png)\n\n*在本课中你将学习如何更改你的密码和\
    \ shell，以及修改其他信息。*\n\nUNIX 提供了丰富的实用程序来帮助你控制系统为你的用户账户存储的信息。在本课中，你将通过一些有用的命令行实用程序了解如何监控系统的使用情况。\n\
    \n## CHANGING YOUR PASSWORD: passwd AND yppasswd\n\n在网络环境中，你需要做最重要的事情之一就是更改密码。为了保持安全环境，密码通常需要定期更改。\n\
    \n密码有两种更改方式。如果你在网络环境中，你可能需要使用 yppasswd，它会在所有联网机器上更新你的密码。判断你是否处于这种环境的最明显方式是，如果你可以用相同的用户名和密码登录多台计算机并访问相同的信息。这是\
    \ UNIX 计算机实验室的常见设置。如果你的机器是一台独立的 UNIX 计算机，只需使用 passwd 命令即可。两个命令的操作方式完全相同，只是更新后的密码存储位置不同。\n\
    \n例如，输入以下内容：\n\n```\n>passwd\nChanging password for jray\nOld password: *****\n\
    New password: *****\nRetype new password: *****\nPassword successfully changed\n\
    ```\n\n你输入的密码在输入时不会回显到显示屏上。这里加入了星号是为了显示正在输入。如果密码更改成功，UNIX 会用类似“Password successfully\
    \ changed.”的消息来指示。在某些情况下，UNIX 可能会阻止你选择某些密码，如果它们太短或基于其内置词典文件中的单词。如果你的 UNIX 机器就是这样设置，并且你输入了不可接受的密码，passwd\
    \ 命令通常会告诉你需要做什么来纠正它。选择混合字母、数字和字母大小写的密码，并且不要基于常见单词。\n\n## CHANGING YOUR SHELL:\
    \ chsh\n\n在本书开头，你学习了可以运行的各种不同的 shell。现在你将学习如何更改它们。使用 chsh 命令，你可以选择在机器上注册使用的 shell\
    \ 之一。在实际更改 shell 之前，你可能想先查看计算机上可用的 shell。你可以用 chsh -l 命令来做到这一点，如下所示：\n\n```\n\
    >chsh -l\n/bin/bash\n/bin/sh\n/bin/ash\n/bin/bsh\n/bin/tcsh\n/bin/csh\n/bin/ksh\n\
    ```\n\n在这个例子中，有七个不同的 shell 可供选择。如果你想从当前选择更改为 ksh，你可以这样做：\n\n```\n>chsh\nChanging\
    \ shell for jray.\nPassword: ****\nNew shell [/bin/bash]: /bin/ksh\nShell changed.\n\
    ```\n\n下次你登录机器时，你将使用 ksh 而不是之前的 shell。你可能永远不需要更改你的 shell，除非你系统上的默认 shell 是 Bourne\
    \ shell\n\n(sh)。如果你想尝试其他 shell，随意；你随时可以改回来。\n\n## GETTING AND CHANGING USER INFORMATION:\
    \ finger AND chfn\n\n每个用户都有一些关于其物理地址的信息作为系统密码文件的一部分存储。这使得其他用户可以快速找到联系他们所需的信息。显示此用户数据的命令是\
    \ finger。用户信息可以在用户账户创建时存储，但系统管理员经常没有时间填写；因此，你的信息可能不完整，甚至为空。为了更改它，你将使用 chfn。\n\n\
    ## USING finger\n\n使用 finger 命令很简单。只需使用 finger <username> 来获取本地系统的用户信息。要获取远程系统上某人的信息，你可以尝试以下操作：finger\
    \ <username>@<remote host>。具体是否可行取决于远程主机的配置方式和远程主机的类型。\n\n看下面的例子：\n\n```\n>finger\
    \ jray@poisontooth.com\n\n[poisontooth.com]\nLogin: jray                     \
    \     Name: John Ray\nDirectory: /home/jray               Shell: /bin/bash\nOn\
    \ since Sun Nov 29 16:35 (EST) on tty0 from 192.168.0.91\n      6 hours 47 minutes\
    \ idle\nNo mail.\nNo Plan.\n```\n\n这是关于该用户的 finger 信息返回的内容。如你所见，这里没有什么特别有趣的内容。这是因为还没有设置任何个人信息。你可以看到他登录系统的时间长度、他的真实姓名和他的主目录。jray\
    \ 可以使用 chfn 向他的账户资料添加个人信息。\n\n## USING chfn\n\nchfn 命令运行一个交互式进程，使你能够为你的账户设置一些个人信息。在命令行上不带任何选项运行\
    \ chfn，如下所示：\n\n```\n>chfn\n\nChanging finger information for jray.\nPassword:\
    \ *****\nName [John Ray]: John Ray\nOffice []: 7879 Rhapsody Drive\nOffice Phone\
    \ []: (614) XXX-XXXX\nHome Phone []: (614) XXX-XXXX\n```\n\njray 可以更改或设置他的全名、他的办公室地址以及他的家庭和办公室电话号码。如果你使用\
    \ chfn 并且不想设置某个值，就不要设置——除非是公司的政策，否则你不必提供这些信息。现在 jray 已经添加了一些关于他自己的信息，你可以重新运行 finger\
    \ 命令来查看结果。\n\n输入以下内容：\n\n```\n>finger jray@poisontooth.com\n\n[poisontooth.com]\n\
    Login: jray              Name: John Ray\nDirectory: /home/jray    Shell: /bin/bash\n\
    Office: 7879 Rhapsody Drive    Office Phone: (614) XXX-XXXX\nHome Phone: (614)\
    \ XXX-XXXX\nOn since Sun Nov 29 16:35 (EST) on tty0 from 192.168.0.91\n6 hours\
    \ 48 minutes idle\nOn since Sun Nov 29 21:47 (EST) on tty1 from 192.168.0.211\n\
    No mail.\nNo Plan.\n```\n\n好多了！现在办公室地址和办公室/家庭电话号码显示正确。根据你使用系统的方式，你可能不想设置任何这些信息。如果是这种情况，你可以随意把\
    \ chfn 命令从记忆中抹去。\n"
