    # LESSON 15

    User Utilities


    ![](img/2c005cbaad58c25c7f54da948131a75e_158_0.png)


    *In this lesson you will learn how to change your password and shell, and to modify
    other information.*


    UNIX provides a wealth of utilities to help you control the information that the
    system stores for your user account. In this lesson, you''ll see how to monitor
    the use of your system through some useful command-line utilities.


    # CHANGING YOUR PASSWORD: passwd AND yppasswd


    One of the most important things you''ll need to do in a networked environment
    is change your password. Passwords generally need to be changed somewhat frequently
    in order to maintain a secure environment.


    There are two ways that a password can be changed. If you are in a networked environment
    you might have to use the yppasswd, which updates your password on all the networked
    machines. The most obvious way of telling if this is the sort of environment you''re
    working in is if you can log into multiple computers with the same username and
    password and access the same information. This is a common setup for UNIX computer
    labs. If your machine is an isolated UNIX computer, just use the passwd command
    and you will be fine. The two commands operate in an identical manner, it is simply
    where the updated password is stored that is different.


    For example, type the following:


    ```

    >passwd

    Changing password for jray

    Old password: *****

    New password: *****

    Retype new password: *****

    Password successfully changed

    ```'
  - '[PAGE 159]


    The passwords you type are not echoed to the display as you type them. Asterisks
    were included here to show that typing is taking place. If the password change
    is successful, UNIX indicates that with a message such as, "Password successfully
    changed." In some cases, UNIX can keep you from choosing certain passwords if
    they are too short or based on words in its built-in dictionary file. If your
    UNIX machine is set up this way and you enter an unacceptable password, the passwd
    command usually tells you what you need to do to correct it. Choose passwords
    that mix letters, numbers, and letter cases, and that are not based on common
    words.


    # CHANGING YOUR SHELL: chsh


    In the beginning of this book, you learned that there are a variety of different
    shells that you can run. Now you’re going to learn how to change them. With the
    chsh command you can choose one of the shells that is registered for use on the
    machine. Before you actually change the shell, you might want to see the shells
    that are available on your computer. You can do this with the chsh -l command,
    as follows:


    ```

    >chsh -l

    /bin/bash

    /bin/sh

    /bin/ash

    /bin/bsh

    /bin/tcsh

    /bin/csh

    /bin/ksh

    ```


    In this example, there are seven different shells that you can choose from. If
    you wanted to go ahead and change to ksh from your current choice, you would do
    the following:


    ```

    >chsh

    Changing shell for jray.

    Password: ****

    New shell [/bin/bash]: /bin/ksh

    Shell changed.

    ```


    The next time you logged in to your machine, you would be in ksh instead of your
    previous shell. You probably won’t ever need to change your shell, unless the
    default shell on your system is the Bourne shell'
