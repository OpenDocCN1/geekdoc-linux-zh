    # SUMMARY


    In this lesson, you were introduced to a few things that you shouldn’t or can’t
    do in the hopes that understanding why you shouldn’t and can’t do them will make
    your interaction with your system administrator easier. System administrators
    have a hard job, and have to walk the fine line between keeping the system functioning
    for all users (which sometimes requires them to be hard-nosed and inflexible),
    and creating the environment the individual users need to work. Most are truly
    interested in making the system work the best that it possibly can for you, but
    many do not have the time to have a lot of patience. Hopefully, an understanding
    of the types of things that make your system administrator’s life more difficult,
    and why it is that you shouldn’t do them, will enable you to stay on your administrator’s
    good side. Following is a review of some of the other points from this lesson:


    +   - Never touch a machine if it looks like its running a root shell.

    +   - Don’t bother root (your system administrator(s)) about unmounted drives,
    unless it’s obvious that nobody knows about it.

    +   - Never ever turn the power to your machine off without permission from your
    administrator. If you’ve got a shutdown button on your machine, pretend it doesn’t
    even exist.

    +   - Root (administrative users) can change ownership of files for you, but consider
    whether it’s really necessary or whether a copy will do.'
