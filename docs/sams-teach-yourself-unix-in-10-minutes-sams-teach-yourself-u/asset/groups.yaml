    foreach：


    - 1. 确定你想要做什么。在此示例中，你有一堆目录，并且想要为每个目录创建一个 tar 文件。

    - 2. 确定你想要对其执行操作的 文件/目录 名称。在本例中，你将为目录 mydirectory、yourdirectory 和 herdirdirectory
    创建 tar 文件。

    - 3. 选择一个要使用的变量名；这里你将只使用一个名为 test 的变量。变量名具体是什么并不重要，只要它不与命令名称冲突即可。

    - 4. 以 foreach <variablename> (<filenames>) 的形式发出 foreach 命令。然后 foreach 命令会通过显示一个问号来询问你对每个文件想要做什么。用你需要执行的内容填入即可。再次说明，在示例中你将对文件进行
    tar 归档。在向 foreach 提供你想要执行的操作命令后，通过单独一行放置命令 end 来结束它。


    为说明示例，输入以下内容：


    ```

    > foreach test (mydirectory yourdirectory herdirdirectory)

    ? tar -cvf $test.tar $test

    ? end

    ```


    你的机器将通过为你提供的每个文件运行 tar 命令来做出响应。在 foreach 命令循环内部，请注意表达式 $test 的使用。foreach 会遍历你提供的
    文件名列表，并依次将每个文件名放入 test 变量中。要在 shell 中使用变量的内容，请在其前面加上 $ 符号。例如，foreach 首先将 mydirectory
    放入变量 test 中。然后它运行 tar 命令，shell 将 test 变量扩展为 mydirectory。实际执行的 tar 命令看起来如下：tar
    -cvf mydirectory.tar mydirectory。循环的下一次迭代中，foreach 将 yourdirectory 放入变量 test 中，并重复该过程。


    你可以在 shell 中使用正则表达式，而不是枚举文件名来使用 foreach 命令。如果注意到前面的示例，你想要 tar 的所有目录实际上在名称中有一部分是共同的——在本例中是
    directory。如果你想在不向 foreach 枚举所有目录名称的情况下产生相同的结果，你可以按如下方式发出前面的 foreach 命令：foreach
    test (*directory) 你可以使用在第 13 课“正则表达式”中学到的模式匹配工具来匹配你想要的任何文件集合。


    ## 重命名多个文件


    你可能已经注意到 mv 命令无法执行一些非常方便的操作，例如使用新名称而不是新位置重命名多个文件；这正是 foreach 的理想问题。


    例如，想象一下你有一个宠物项目的一些文件，它们被命名为 brokenjunk.start、brokenjunk.today、brokenjunk.gif 等等。突然你的老板决定让你把这些文件交给开发部门，因为他们下周想要演示你的项目。这从未发生在你身上，对吧？如果发生了，你可能想把文件重命名为更专业一些的名称。与其一个一个地重命名文件，你可以使用
    foreach 命令为你自动化此任务。在这种情况下，你可能会输入以下内容：


    ```

    > foreach test (brokenjunk.*)

    > mv $test importantstuff.$test:e

    > end

    ```


    你可能不会立即理解其中的 $test:e 部分。这表示“展开 $test 变量并丢弃文件名中最后一个 . 之后之外的所有内容”——在本例中，就是使文件不同的部分（start、today
    等等）。


    当然，对于三个文件来说这不是一个非常有用的命令，但如果你有一个包含数百个文件 的项目，它可以为你节省大量输入。


    ## 修改并替换原件


    另一个可以使用 foreach 命令的有用技巧是当你需要对许多文件应用一个过程时——并且你希望在不创建新文件的情况下执行它，而是直接就地替换旧文件。


    假设你有一组图像文件，每个文件都有一个你想要裁剪掉的边框，然后你想将其缩放到更小的尺寸。如果虚构的命令 crop 从 STDIN 读取文件并将其数据写入 STDOUT，你可能会使用与以下类似的
    foreach 命令：


    ```

    > foreach test (*.gif)

    ? crop < $test > holding

    ? mv holding $test

    ? end

    ```


    为什么不直接执行 crop < $test > $test 呢？因为你无法保证在仍在读取文件时写入文件是安全的——因此你将结果存储在名为 holding 的临时文件中。随后使用
    mv 命令将临时文件移回原始文件名。


    ## 稍后再做：sleep


    一个只是坐着等待一段时间的命令的实用性可能并不明显，但当你有想要在相对较短的间隔内重复的操作时，你会发现它的用处。如果你遇到需要 shell 脚本暂停一段时间的情况，可以使用
    sleep 命令。只需按如下方式发出 sleep 命令：sleep <seconds>。shell 会暂停，直到经过这么多秒。它随后继续执行它正在进行的操作。


    ## 条件执行：while 和 if


    如果你想对自动化的控制变得更复杂，可以使用条件语句，这些语句只能在特定条件适用时激活脚本的某些部分。


    要使用条件语句，你需要为语句创建一个要测试的条件。这可以复杂到你想要的程度，但现在，你需要坚持使用简单的东西，例如等于。


    ## while


    while 命令，使用语法 while <condition>，在某个条件成立时执行操作。


    虽然以下示例很有趣，但请考虑你感到非常孤独并想要获取一些电子邮件的情况。当你执行 /bin/mail 时，它告诉你的全部是 No mail。真是一个悲伤的日子。为了让你的日子更光明一些，你为自己写了一个小脚本，每隔一段时间就向几位朋友发送电子邮件，请求他们回邮。当然你不想成为一个傻瓜，在他们回复后仍继续给他们发送电子邮件，所以你希望在收到电子邮件后停止，或者仅在未收到时继续。


    如果你真的想尝试这个，你可以通过输入类似以下的小脚本来实现：


    ```

    > set hopeful=`/bin/mail | grep -cv No`

    > while ($hopeful==0)

    > echo "please send me mail" | mail myfriend@somewhere.com

    > echo "please send me mail" | mail anotherfriend@elsewhere.com

    > sleep 60

    > set hopeful=`/bin/mail | grep -cv No`

    > end

    ```


    这个傻乎乎的小脚本利用 grep 来统计不包含 No 匹配的行数（-c 选项）且不匹配的行（-v 选项），并将结果赋给名为 hopeful 的变量。将 /bin/mail
    通过管道传递给 grep 命令并放在单反引号内会导致 shell 执行这些命令并返回其输出；该输出就是被赋给变量 hopeful 的内容。

    '
