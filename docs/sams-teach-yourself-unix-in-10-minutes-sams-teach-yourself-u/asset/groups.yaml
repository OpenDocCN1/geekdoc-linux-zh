    ## 环境变量


    如本书前面所述，你使用的大多数软件以及使用 UNIX 时工作的界面都是通过看似晦涩的文本文件配置的。其他软件则由称为环境变量的特殊 shell 变量配置。（请回顾第
    14 课“Basic Shell Scripting.”中的 shell 变量。）


    环境变量被程序用来获取运行所需的特定信息。例如，你可能会遇到想要一个包含其帮助文件信息路径的环境变量的程序。其他程序则使用环境变量来包含诸如窗口大小或放置偏好等内容的自定义设置。在前面的
    aliases 部分中，你可能注意到有一个程序希望设置一个环境变量来告诉它要联系哪个 Internet 主机。


    环境变量的设置语法与普通 shell 变量略有不同，因此不要使用 set <variablename>=<value>，而应使用以下语法：


    ```

    setenv <variablename> <value>.

    ```


    假设你有一个程序要求将环境变量 HELPFILE_LOC 设置为包含其帮助信息的目录。除非设置了此变量，否则它找不到所需的信息且无法正常工作。如果发现帮助文件位于目录
    /usr/local/helpstuff 中，你可以使用以下命令设置所需的变量：


    ```

    > setenv HELPFILE_LOC /usr/local/helpstuff

    ```


    使用环境变量进行配置信息的程序数量相当多，但格式始终相同。你需要做的只是找出需要设置哪个变量，然后将其设置为正确的值。


    ![](img/2c005cbaad58c25c7f54da948131a75e_169_0.png)


    > 使用 printenv 如果你想查看 shell 中已设置的环境变量，可以使用 printenv 命令。


    如果你正在运行 X Windows 并尝试在与客户端运行的机器不同的机器上显示，可能需要按如下方式设置 DISPLAY 变量：`setenv DISPLAY
    <machinename>:0.0`


    如果运行程序时出现类似 ld.so not found 的错误提示，你可能需要使用类似 `setenv LD_LIBRARY_PATH /usr/local/lib`
    的命令设置 LD_LIBRARY_PATH。


    可能性真的无穷无尽——幸运的是，进行设置的过程相对轻松。请记住，在一个 shell 中所做的设置不会影响其他 shell。如果你需要同时访问多个配置，可以在同时运行的不同
    shell 中将同一个环境变量设置为不同的值。


    ## 路径


    另一个特殊的 shell 变量是 path 变量。它告诉 shell 在哪里查找你想要执行的程序。还记得 find 命令为你查找东西花了多长时间吗（refer
    to Lesson 5, "Finding Files"）？因为你不希望每次尝试执行程序时都花费那么长时间，所以你不希望系统在机器上搜索所有内容来查找程序。相反，shell
    会保留一个要查找程序的简短列表，并且只搜索这些位置。


    ### Shell 与可执行文件


    从技术上讲，当你尝试执行程序时，它甚至不会搜索这些位置。shell 实际上会保留在这些位置找到的所有可执行文件的目录。如果在你登录期间其中一个位置出现新的可执行文件，你的
    shell 不会在你执行 rehash 命令之前知道它，该命令会要求 shell 返回并重建目录。


    你可能会注意到，如果当前目录中有一个程序的副本，在某些情况下输入文件名会导致命令未找到错误。这是因为 path 变量通常不包含当前目录。你可以通过输入 ./<programname>
    来执行当前目录中的程序，或者将当前目录添加到你的路径中。


    ### 处理路径


    通常当前目录会被排除在路径之外，因为包含它会带来一定的安全风险。如果当前目录在你的路径中，你可能会被诱骗执行任意程序，因为它们被命名为常见的 UNIX 命令并偷偷放入你的目录中。如果你想将当前目录放入路径中，始终将其放在路径的末尾。这样，正常的
    UNIX 命令会在任何可能进入系统的特洛伊木马之前被找到。


    如果你想查看当前的路径，可以使用 echo $path。如果缺少你需要的路径，例如当前目录和 /usr/local/bin，你可以使用以下命令添加它们：


    ```

    set path=( $path /usr/local/bin . )

    ```


    ## 用户默认值：点文件


    你的账户在登录时和启动 shell 时会自动为你配置某些功能。除了 shell 之外，其他程序偶尔也会使用点文件来保存配置信息。点文件 literally
    就是以 . 字符开头的文件名，你很可能会在主目录中发现大量此类文件。一些常见的文件如下：


    - **.login 和 .logout**——顾名思义，分别在登录时和注销时执行的文件。如果你查看这些文件，会发现它们是使用你已熟悉的命令的 shell
    脚本。.login 脚本通常用于诸如在你想要为自己设置多个不同环境时交换各种配置文件的集合，以及执行登录时需要自动处理的其他操作。.logout 脚本使用频率要低得多，但它可以包含在注销时需要执行的有用操作。你可以如何使用
    .login 和 .logout 文件？例如，添加命令在每次登录和注销时将日期和时间信息回显到文件中。如果你曾经需要填写工时表，你会觉得这个方法很有吸引力。

    - **.cshrc 或 .profile**——在打开 shell 时执行的 shell 脚本。shell 有自己的在启动时执行的脚本。请查阅 shell
    的文档了解此信息。再次说明，你熟悉其语法。在此文件中，你可以包含执行诸如向环境添加自定义路径、设置环境变量以及设置你可能感兴趣的别名等操作的命令。

    - **.plan**——一个包含系统在有人 fingers 你时返回给对方的信息的文件。用户通常在其 .plan 文件中包含联系信息、喜欢的引言以及他们认为有趣的轶事。将你希望人们在远程查找你时看到的内容放入你的
    plan 中。放入 .plan 文件中的内容后，试试 finger 命令，看看你的新信息显示效果如何。

    - .X11defaults 或 .Xdefaults——此文件包含服务器资源数据库使用的设置。该文件的语法在 Lesson 3, "The Graphical
    User Interface." 中简要介绍过。一般来说，你不需要修改此文件，但在其中你可以配置许多关于 X 服务器如何处理各种程序以及各种 X11 程序如何工作的选项。如果你选择探索它，请先制作备份副本，以防需要恢复。备份后，不要害怕进行修改。语法很直接，如果你能坚持到现在，你很可能能够弄清楚如何进行大多数你可能想尝试的修改。


    你肯定还会发现目录中有其他点文件。不要害怕查看它们。你会发现大多数文件比你想象的更易读。虽然起初可能有点令人望而生畏，但让 UNIX 为你工作的重要部分是通过修改这些文件来自定义你的环境。先备份，但不要害怕尝试——这正是使用
    UNIX 的乐趣之一！


    ## 修复损坏的终端：stty


    有时，你可能会发现自己处于一个似乎有点失控的命令行窗口中。Delete 键产生 ‘?’, Backspace 键产生 ‘^H’, 而 Ctrl-c 显示 ‘^C.
    如果这种情况发生在你身上，你需要重置终端的擦除和中断参数。为此，输入以下两个命令：


    ```

    > stty erase Delete

    > stty intr Ctrl+c

    ```


    ![](img/2c005cbaad58c25c7f54da948131a75e_172_0.png)


    > 使用 stty 为了方便你，一些 stty 版本现在支持使用插入符号表示法为控制字符赋值。相反，你不必在前面的 stty intr 示例中实际输入 Ctrl+c，也许可以输入
    stty intr ^C。

