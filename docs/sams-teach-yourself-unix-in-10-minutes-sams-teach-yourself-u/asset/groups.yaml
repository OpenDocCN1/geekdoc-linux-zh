    of their functionality by having it all be part of one big program. On UNIX, the
    actual operating system is very small, and it runs lots of programs simultaneously
    to provide the interface and other functionality to you.


    Along with UNIX''s absolute requirement to run many simultaneous programs just
    to provide the environment to the user comes the fact that the user can run as
    many simultaneous programs as he or she wants. On a UNIX box, you run programs
    for anything that you want to do. As a consequence of the way the OS works, it
    doesn''t actually matter whether or not you''re logged in while they run. Your
    being logged in is—you got it—just another process.


