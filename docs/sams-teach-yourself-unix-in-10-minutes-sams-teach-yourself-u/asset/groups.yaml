    used for creating links or aliases to files. The ln command is used to create
    links to files so that one file can appear to be in multiple locations and have
    multiple names.


    To see the utility of this command, consider the situation in which you want your
    friends to look at your daily schedule. Daily or weekly, as appropriate, you can
    create a new file with your schedule and name it with the current date. Because
    you don''t want to have to constantly give your friends new filenames to check
    your schedule, you might just create a link named myschedule, which you then point
    to whatever file contains your current schedule. Your friends can always look
    at myschedule to get your schedule, and you can keep your daily planner archives
    neatly arranged.


    Follow these steps to use the ln command to create a link:


    - 1. Determine the name of the file to which you want a link. The ln command is
    willing to create links to non-existent files, which isn''t particularly useful,
    so make certain you know the correct name of the file you want to link.

    - 2. Determine the alternate name by which you want to be able to access the file.

    - 3. Issue the ln command as ln -s <realfilename> <alternate name>. Don''t worry
    about the significance of the -s command. This signifies that the link is a soft
    link, the kind common in everyday use, as opposed to a hard link that isn''t really
    useful to non-administrative types.


    For example, if you wanted to be able to easily browse your Web server log file,
    you might issue the command


    ```

    > ln -s /usr/local/httpd/logs/access_log ~/weblog

    ```


    If you were to do this, you would create a link named weblog in your home directory.
    This link would be an alternative name for the file /usr/local/httpd/logs/access_log.


    You can work with this link almost exactly as though it were the real file. If
    you try to read its contents, you read the contents of the real file. If you try
    to modify or edit it, you edit the contents of the real file. If you delete the
    link, however, you only delete the link; the real file remains. So that you can
    tell the link apart from the real file, if you ls -l the link it shows up as a
    filename that points to another path.


    ```

    > ls -l ~/weblog

    lrwxrwxr-x 1 ray 7 Nov 28 1998 weblog -> /usr/local/httpd/logs/access_log

    ```

    '
  mdcn: '

    这会创建一个名为 fresh_new_directoty 的新目录，它将位于当前目录中。不幸的是，目录名拼写错误，所以你还需要使用下一个命令。就像 touch
    一样，你可能想使用 mkdir 创建几个额外的目录，以便用下一个命令 rmdir 将它们删除。


    ## 删除空目录：rmdir


    对于组织来说，留下不再需要的旧目录并不是很有帮助，因此偶尔你可能需要删除一个。命令 rmdir 用于删除空目录。按照以下步骤使用 rmdir 删除目录：


    - 1. 确定你想要移开的目录或目录。

    - 2. 按如下方式发出 rmdir 命令：rmdir <directory1> <directory2> <directory3>....


    例如


    ```

    > rmdir fresh_new_directoty an_old_directory/kludgedir

    ```


    这会删除前面示例中拼写错误的目录；它还会删除此示例中位于目录 an_old_directory 中的名为 kludgedir 的目录。


    rmdir 命令不会影响非空目录，因此如果你周围有许多目录，它是一个方便的清理命令。你可以通过发出以下命令让它尝试删除当前目录中的所有内容：


    ```

    > rmdir *

    ```


    你现在不需要理解这种语法——你将在第 13 课“正则表达式”中学习到。 此外，输入此命令后你可能会收到数十条错误消息；但以这种方式使用 rmdir 的最终结果是，该目录中的任何空目录都会消失，而其他内容不受影响。


    ## 同时删除文件和目录：rm -r


    由于 rmdir 命令仅适用于空目录，你最终需要一种方法来删除目录及其所有内容。为此，递归模式下的 rm 命令是解决方案。如果需要删除目录及其所有内容，请按以下步骤操作：


    - 1. 确定你想要删除的目录的名称。

    - 2. 按如下方式发出 rm 命令：rm -r <directoryname>。


    例如，输入


    ```

    > rm -r /priv/home/henry/junkdirectory

    ```


    这会删除目录 /priv/home/henry/junkdirectory 并递归删除其所有内容。


    如果你设法删除了当前目录（这不是一件有趣的事），最终你会收到错误消息，提示 Cannot stat current directory、can''t stat
    . 和 . not found。UNIX 需要多长时间才能意识到你突然位于“无处”，取决于你运行的命令，但你始终可以通过输入 cd ~ 来返回主目录，从而挽救这种情况。


    ## 复制文件：cp


    如果需要复制文件，你需要 cp 命令。此命令可以复制单个文件到新的目标文件，或将一个或多个文件复制到单个目标目录。


    按照以下步骤使用 cp 命令复制单个文件：


    - 1. 确定源文件名，以及你希望复制到的目标文件名。

    - 2. 按如下方式发出 cp 命令：cp <sourcefile> <destinationfile>。


    要使用 cp 命令将一个（或多个）文件复制到目标目录，请按以下步骤操作：


    - 1. 确定所有源文件名和目标目录的名称。cp 命令不会为你创建目标目录，因此如果它不存在，你需要先使用 mkdir 命令。

    - 2. 按如下方式发出 cp 命令：cp <source1> <source2> ... <destinationdir>。


    例如，输入命令


    ```

    > cp myfile1 /priv/home/henry/myfile2

    ```


    此处显示的示例将当前目录中的文件 myfile1 复制并放置在 /priv/home/henry/myfile2 中。


    以下是其第二种形式：


    ```

    > cp /etc/sendmail.cf /priv/home/henry/myfile2 myfile1 /tmp

    ```


    这次它会将目录 /etc 中的文件 sendmail.cf、目录 /priv/home/henry 中的文件 myfile2 以及当前目录中的 myfile1
    复制，然后将副本放置在目录 /tmp 中。


    请记住，你不需要复制多个文件就可以使用“复制到目录”版本——只需提供一个文件名和目标目录即可。


    ## 复制目录：cp -r


    就像 rm 命令有用于删除目录的递归模式一样，cp 命令也有用于复制目录的递归模式。如果使用 -r 选项发出 cp 命令，它会尝试将每个源文件名视为目录并递归复制到目标目录。按照以下步骤使用
    cp 命令：


    - 1. 确定你想要复制的目录的名称。

    - 2. 按如下方式发出 cp 命令：cp -r <source1> <source2> ... <destdir>。


    例如，发出命令


    ```

    > cp -r /usr/local/httpd/logs /tmp

    ```


    cp 命令在目录 /tmp 中创建一个名为 logs 的新目录，并将目录 /usr/local/httpd/logs 的内容复制到这个新的 /tmp/logs
    目录中。


    ## 移动文件和目录：mv


    如果你只是需要移动（重命名）文件而不是复制它们，你需要使用 mv 命令。此命令使用与 cp 命令相同的两种形式：第一种将文件从一个名称移动（重命名）到另一个名称，第二种将一个或多个文件移动到目标目录。


    按照以下步骤使用 mv 命令重命名单个文件：


    - 1. 确定文件的当前名称和你希望它具有的名称。

    - 2. 按如下方式发出 mv 命令：mv <currentname> <newname>。


    例如，如果你有一个名为 todays_mail 的文件并希望将其与备份邮件一起保存，你可能会输入


    ```

    > mv todays_mail ~/mymaildir/June10.mail

    ```


    此命令会将当前目录中的文件 todays_mail 移动到目录 ~/mymaildir 中的文件 June10.mail（请记住，那就是位于你主目录中的目录
    mymaildir）。


    按照以下步骤使用 mv 命令将一个或多个文件移动到新位置：


    - 1. 确定你想要移动的所有文件的名称以及你希望将它们移动到的目录的名称。

    - 2. 按如下方式发出 mv 命令：mv <file1> <file2> ... <destinationdir>。


    例如


    ```

    > mv /usr/local/httpd/logs/error_log /priv/home/henry/myfile2 /tmp

    ```


    此命令将文件 error_log 从目录 /usr/local/httpd/logs 移动，并将文件 myfile2 从目录 /priv/home/henry
    移动到目录 /tmp。


    ![](img/2c005cbaad58c25c7f54da948131a75e_83_0.png)


    ### mv 的限制


    mv 命令也可以使用与移动和重命名文件完全相同的语法来移动和重命名目录——只需提供目录名而不是文件名即可。


    不幸的是，对于此任务，mv 命令的限制比你希望的要多一些。它不能在物理设备之间移动目录；因此，有时如果你尝试将目录从一个位置移动到另一个位置，UNIX 在文件系统中的物理设备抽象就会突然咬你一口，并出现如下错误消息：


    ```

    Can''t move directories across partitions

    ```


    如果发生这种情况，最简单的解决方案是使用 copy 命令复制有问题的目录，然后删除原始目录。


    ## 创建链接：ln


    本课中你将学习的最后一个文件管理实用程序是用于创建文件链接或别名的命令。ln 命令用于创建文件链接，以便一个文件可以在多个位置出现并具有多个名称。


    为了了解此命令的用途，请考虑你希望朋友查看你的日常日程的情况。每天或每周（如适用），你可以创建一个包含日程的新文件并以当前日期命名。由于你不想不断地给朋友提供新的文件名来查看你的日程，你可以创建一个名为
    myschedule 的链接，然后将其指向包含当前日程的任何文件。你的朋友可以随时查看 myschedule 来获取你的日程，而你可以整齐地保存日常计划存档。


    按照以下步骤使用 ln 命令创建链接：


    - 1. 确定你想要链接的文件的名称。ln 命令愿意创建指向不存在文件的链接，这不是特别有用，因此请确保你知道要链接的正确文件名。

    - 2. 确定你希望通过该名称访问文件的替代名称。

    - 3. 按如下方式发出 ln 命令：ln -s <realfilename> <alternate name>。不必担心 -s 命令的意义。这表示链接是软链接，即日常使用中常见的类型，而非对非管理员类型来说不太有用的硬链接。


    例如，如果你想轻松浏览 Web 服务器日志文件，你可能会发出命令


    ```

    > ln -s /usr/local/httpd/logs/access_log ~/weblog

    ```


    如果你这样做，你将在主目录中创建一个名为 weblog 的链接。此链接将是文件 /usr/local/httpd/logs/access_log 的替代名称。


    你可以几乎像操作真实文件一样操作此链接。如果你尝试读取其内容，你将读取真实文件的内容。如果你尝试修改或编辑它，你将编辑真实文件的内容。然而，如果你删除链接，你只会删除链接；真实文件仍然存在。为了区分链接和真实文件，如果你对链接执行
    ls -l，它会显示为指向另一路径的文件名。


    ```

    > ls -l ~/weblog

    lrwxrwxr-x 1 ray 7 Nov 28 1998 weblog -> /usr/local/httpd/logs/access_log

    ```

    '
