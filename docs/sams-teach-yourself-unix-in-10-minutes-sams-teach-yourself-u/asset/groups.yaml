    # INTRODUCTION


    # WELCOME TO THE WORLD OF UNIX


    Welcome to Sam''s Teach Yourself UNIX in 10 Minutes. If you''re like most individuals
    faced with using UNIX for the first time, there are probably a dozen notions you
    have about what using UNIX will be like—mostly all of them intimidating. People
    have probably told you that UNIX is difficult to use, that the commands are cryptic,
    and that the interface is non-intuitive. You''ve almost certainly heard that UNIX
    is powerful, but that the power comes at the price of a steep learning curve.
    The thought that learning and using UNIX will be fun and rewarding is probably
    one of the furthest from your mind. The contents of this book will hopefully change
    your mind. You will learn how to make use of UNIX''s command line and graphical
    user interface, and to familiarize yourself with the commands you need to productively
    use UNIX on a day-to-day basis.


    # So What is UNIX, Anyway?


    UNIX is a powerful multitasking (it can run multiple programs simultaneously)
    operating system. Having been designed originally as an experimental operating
    system on which to test OS implementation ideas, UNIX grew from its humble roots
    to the leading commercial platform for network server and program development.


    Because of its roots, many parts of UNIX are implemented in what might be considered
    "the easiest way possible." Although this leads to certain inefficiencies in the
    OS, it also proves to be one of UNIX''s greatest strengths—many of the "easiest
    way possible" ideas turn out to be great benefits to the user. The easiest way
    possible tends, for example, to lead to abstraction of where data is stored or
    how it is accessed. Rather than being concerned where something is located, it''s
    easier to design a single way of accessing data. Then whenever data needs to be
    retrieved from some new type of device, you create a piece of software that allows
    the new data to be accessed through the pre-existing interface.'
  - '[PAGE 13]


    UNIX is also a multi-user operating system. Unlike some personal-computer implementations
    of the idea of multiple users, with UNIX, many users can simultaneously use a
    single machine. From the point of view of each of these users, they are in control
    of the complete machine. Also, instead of simply hiding your files from other
    users UNIX actually gives you the capability to deny or allow other users access
    to your files, making them invisible—and inaccessible to users who are denied
    access.


    One of the interesting things you''ll discover about UNIX after you''ve used it
    for a while is that many of the more useful utilities and applications are written
    by, and supported by, other users just like yourself. The power of the UNIX operating
    system, the ease with which sophisticated commands can be constructed, and UNIX''s
    powerful programming and networking ties have bred a strong cooperative streak
    in UNIX users. It is a long-standing tradition that software constructed to solve
    a problem is made available by its author to the rest of the UNIX community, and
    this becomes yet another building block for even more sophisticated commands.
    You might be surprised to find that the most powerful compiler and debuggers available
    for UNIX are available for free, as are many other useful applications. Although
    you might be familiar with the idea of shareware from the personal computer world,
    the idea of UNIX freeware is likely to take you at least slightly by surprise.
    Much of the UNIX freeware rivals or surpasses commercial software in its elegance,
    completeness, and—most of all—in the rapidity of response to the report of errors
    in the software. Unlike singular shareware authors, much UNIX freeware is supported
    by entire user communities. For example, if you''re using one of the freeware
    UNIX database systems and discover a bug, it would not be unexpected for one of
    the hundreds of users who contribute code to that particular project to have your
    bug fixed—and a new version released in less than a week.


    # VERSIONS OF UNIX


    With only a little looking around, you''re likely to notice that there are many
    different versions (frequently called flavors) of UNIX available, sometimes even
    coming in multiple flavors from a single vendor. The largest consistent difference
    you will notice if you use multiple different versions of UNIX is between versions
    based on AT&T''s System V UNIX'
