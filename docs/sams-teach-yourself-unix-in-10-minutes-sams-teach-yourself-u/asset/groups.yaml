    # LESSON 1


    # GETTING

    STARTED


    In this lesson you''ll learn about logging in to and out of your UNIX system in
    addition to some basics of operating your machine. You''ll also learn a bit of
    the UNIX background, such as why it runs the way it does.


    For years UNIX has been a murky topic that has scared away many people. The Internet
    and World Wide Web were built upon the backs of UNIX machines; therefore, the
    growing need for Internet connectivity, combined with a desire for increased performance
    and stability, have caused the number of people interested in using UNIX to skyrocket.
    At the same time, personal computers are becoming easier to use, and this has
    spurred the growth of utilities to make the UNIX user''s life easier. Furthermore,
    this has aided in the push of UNIX—in all its variants—from the server room onto
    the desktop and into the home.


    # THE LOGIN PROCESS


    The first thing you''ll notice when you sit down in front of your UNIX computer
    is that you need to log in before you can do anything. UNIX is based on a multi-user
    principle—multiple users can have their own accounts, programs, and settings on
    the same machine. If you''re familiar with Windows 95/98, multiple users might
    sound familiar. Windows 95/98 however, does not protect the user''s files from
    other people; it simply "hides" them. Furthermore, Windows 95/98 does not enable
    multiple users to run programs simultaneously the way UNIX does.


    # OWNERSHIP AND PERMISSIONS


    UNIX contains the concepts of ownership and permissions. Files are owned by individual
    users, and permissions control who can view, edit, or run files on the system.
    Luckily, there is little need for a casual user to'
  - '[PAGE 20]


    worry about ownership. If there is a need to share files with other users on the
    system, you''ll want to take a look at Lesson 19, "Permissions." After you''ve
    logged in to your computer, all files that you create during your current session
    are automatically owned by your account.


    # MULTI-USER


    In addition to controlling and tracking who owns what, UNIX also enables multiple
    users to access the system simultaneously. This is a drastic change from the desktop
    environment offered by traditional personal computer operating systems. For example,
    while you''re working on a spreadsheet, a coworker might be running a series of
    calculations for an engineering project. Many different processes can run simultaneously
    on a single computer by potentially hundreds of different users. Lesson 11, "Processes"
    explains the concept of processes and how you can manage them.


    # THE LOGIN PROMPT


    In order to log in to your computer, you need to supply a username and password.
    Your system administrator will most likely provide you with a username and password.
    Upon entering your information, UNIX loads the appropriate configuration for your
    account and you can start using the system. The screen that is displayed when
    you enter your username and password varies from system to system depending on
    the configuration. There are two possibilities that you might encounter: a graphical
    login screen or a text-based screen.


