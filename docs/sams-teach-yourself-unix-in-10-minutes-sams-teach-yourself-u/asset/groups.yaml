    现在你已经知道如何确定自己的位置以及周围有什么，是时候四处逛逛了。要从一个目录移动到另一个目录，使用 UNIX 命令 cd。如果你想从当前位置移动到另一个目录，你\n\
    \n- 1. 确定当前位置（如果不知道，使用 pwd 命令）。\n- 2. 选择要前往的目录（本例为 /usr/local）。\n- 3. 按如下方式发出\
