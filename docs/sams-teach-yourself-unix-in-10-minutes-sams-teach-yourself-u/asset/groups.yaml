    processes to run at certain times—even when you''re not logged into the computer.
    There are two ways to set up your UNIX computer to run a command at a certain
    time. Unfortunately, these might be disabled, depending on the level of control
    your administrator has chosen to implement. Allowing users to schedule commands
    for any time they want can be a bit dangerous. The two commands that you''ll want
    to check out are cron and at: they are described as follows:


