    ## 其他文件格式


    除了文本文件之外，您可能会在 UNIX 计算机上遇到需要查看的其他文档和 README 文件格式。以下是您可能会遇到的简要总结，按它们可能具有的文件名扩展名列出：


    - **.Z**—一种 UNIX 压缩文件。要查看其中一个文件的内容，您需要使用巧妙命名的 uncompress 命令将其解压缩，或者使用 zcat 命令直接查看。

    - **.gz**—这是一个 gzipped，即 gnu-zipped 文件。（Zip 是一种压缩格式。）某些文档可能以此格式存储。与解压缩，或更确切地说是
    gunzip 文件（gunzip 是实际扩展文件的程序）相比，您可以使用 gzcat 直接显示文件。

    - **.ps, .eps**—这些是 Postscript 文件。如果您查看这些文件，您会注意到可以阅读内容，但有很多多余的格式信息。如果需要查看 Postscript
    文件，请查看 ghostscript（或 gs）命令、ghostview 命令或 xpsview 命令。

    - **.html**—HTML 文件，很明显！如果您没有运行 X Window System，您可以使用 lynx Web 浏览器从命令行读取 HTML
    文件。如果您正在运行 X Window System，只需在 Web 浏览器中加载该文件即可。

    - `.tex`—一个 TeX 格式的文件。TeX 是一种页面布局语言，有时用于存储程序文档。请使用 `tex` 程序或 `latex` 程序来处理这些文件。

    - `.dvi`—TeX 格式文件的结果，介于标记语言和实际纸质输出之间。DVI 实际上旨在成为一种设备无关文件，允许在任何平台上以类似的方式显示标记数据。要查看
    dvi 文件，如果您正在运行 X Window System，请尝试 `xdvi` 程序，如果您想打印文档，请使用 `dvips` 或 `dvips`，如果您被困在纯文本终端上，请使用
    `dvi2tty`。


    这涵盖了您会遇到的大多数情况。如果您遇到此处未包含的文件格式，请查找随附的 README.TXT 或 README.1ST 文件——这些文件很可能包含有关如何使用未知文件的信息。


    ## 摘要


    您的 UNIX 计算机可能包含大量文档文件，并且每安装一个新软件就会带来更多文档。本课应已为您提供了有关显示文件或文件部分的不同方式的清晰图景。以下是回顾：


    - `cat`—连接命令显示您指定的所有文件，依次显示。它不会在页面末尾暂停。

    - `more/less`—more 和 less 被称为分页器。它们一次一屏地分页显示其输入文件。less 提供了在文件中向后滚动的能力，而 more 则提供仅向前查看。

    - `head`—显示文件的前几行。当您尝试查看电子邮件消息等文件中的标题信息时，这很有用。

    - **tail**—查看文件的末尾。使用 -f 选项时，tail 提供了非常有用的显示日志文件生成时的功能。与其让每个程序都需要自己的监视实用程序，不如使用
    tail -f。

    - **其他文件格式**—虽然许多 UNIX 信息文件基于文本或 HTML，但您可能会遇到其他格式。本课简要介绍了其中一些格式以及可用于处理它们的程序。


