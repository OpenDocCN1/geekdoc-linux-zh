    ## 在 Shell 上操作文件


    ![](img/2c005cbaad58c25c7f54da948131a75e_74_0.png)


    *在本课中，您将学习如何执行基本的文件维护功能，例如创建和删除文件和目录。*


    您使用 UNIX 命令的频率不太可能超过文件维护命令集。值得庆幸的是，您将使用的命令非常简短，只有几个重要的选项。虽然这些命令和选项最初看起来可能很简单，但结合您可以使用它们完成的工作以及您将在第
    14 课“基本 Shell 脚本编写”中学习到的自动化知识，您会发现这些命令可以执行您能想象到的几乎任何文件维护任务。


    ## 操作文件和文件夹：命令行


    命令行是您访问 UNIX 文件系统的首要接口，也是创建、删除和重新排列文件的首要工具。软件提供文件创建和删除工具并不罕见，但这些工具很少像命令行那样强大。即使您打算在日常工作中避免使用命令行，您也需要了解这些工具。


    ![](img/2c005cbaad58c25c7f54da948131a75e_75_0.png)


    Tweedle Dee 在使用命令行时，请记住这一点：您作为参数提供给命令的文件名可以是相对路径或绝对路径。这意味着如果您有一个名为 tweedle 的命令，它会处理一个文件，如果您输入


    **tweedle myfile**，您将在当前目录中处理文件 myfile。


    **tweedle ../myfile**，您将在上一级目录中处理文件 myfile。


    **tweedle /priv/home/henry/myfile**，您将在目录 /priv/home/henry 中处理文件 myfile（假设您当然有权限在该目录中处理文件）。


    请记住，前面的示例中的 tweedle 是一个假设的命令，具有假设的结果——UNIX 没有这样的命令。它在这里仅用于帮助解释“以某种不确定的方式修改”命令。您可以将任何操作替换为
    twiddle/tweedle。


    ### 创建新空文件：touch


    touch 命令用于更新文件的“上次修改”时间并将其设置为当前时间。这似乎是一个奇怪的需求，但如果您有一个应用程序对特定时间之后的新文件执行某些功能，这将是一个非常有用的实用程序。


    ![](img/2c005cbaad58c25c7f54da948131a75e_76_0.png)


    ### 利用 touch


    您可能想要记住可以使用 touch 命令的一个地方是与备份和归档软件一起使用。许多全系统备份程序默认仅备份自上次备份以来修改过的文件（这称为增量备份）。如果您想确保文件已备份，即使您最近没有修改它，您也可以
    touch 该文件以更改修改日期，使其看起来在您 touch 时已被修改。


    touch 文件的一个有用副作用是，如果您尝试 touch 的文件不存在，touch 它会将其创建为新的空文件。


    如果您需要更新文件的修改日期或创建新的空文件，请执行以下操作：


    - 1. 确定要更新或创建的文件或文件的文件名。

    - 2. 按以下方式发出 touch 命令：`touch <filename> <filename>` ...


    例如，输入


    ```

    > touch myfile

    ```


    如果 myfile 之前存在，其上次修改日期现在将设置为当前时间。如果 myfile 之前不存在，它现在将作为一个空文件存在，其上次修改日期为当前时间。


    当然，如果您想创建多个文件或更新多个文件的修改日期，您可以输入类似以下内容：


    ```

    > touch myfile1 myfile2 myotherfile

    ```


    这会导致 myfile、myfile2 和 myotherfile 都具有更新的修改日期或根据需要被创建。


    > touch 的其他用途 当您对 UNIX 足够熟悉，可以开始使用 shell 脚本（在第 14 课中讨论）来自动化您的工作时，您会发现 touch 命令对于创建允许脚本相互通信的标志文件很有用。请在以下情况下记住
    touch 命令


    ```

    remove myfile (y/n)?

    ```


    这是 rm 交互模式，一项保护措施，旨在确保您确实打算删除指定的文件（如果您真的想删除，请按 y）。通常，您的系统管理员会将系统配置为默认以交互模式运行 rm。在第
    16 课“修改用户环境”中，您将学习如何更改此默认值——但建议您在确定对 UNIX 感到满意之前将其保留在交互模式下。


    ### rm 的选项


    rm 命令支持几个有用的选项：


    - - i—交互。i 会使 rm 在实际删除每个文件之前询问您是否确认删除。虽然这可能看起来很烦人，但如果您的系统管理员未将系统配置为默认以交互模式使用 rm，请习惯以
    rm -i <file1> <file2>... 的形式发出 rm 命令。

    - - f—强制。f 请求 rm 不考虑文件权限执行删除。请记住，您可以创建文件并设置权限，以便即使您作为所有者也无法读取或写入该文件。如果您不使用强制模式，rm
    在尝试删除您无法写入的文件时，会询问您是否要覆盖权限。

    - - r—递归。r 是 rm 的一个非常强大的选项；递归模式不是胆小的人适合的。当您以 rm -f <directoryname> 的形式发出 rm 命令时，rm
    会递归删除该目录及其所有内容。如果目录包含其他目录，它们也会以相同的方式被删除。


    ### 创建目录：mkdir


    目录对于将文件组织成合理的分组非常有用。如果您需要创建目录，请使用以下步骤：


    - 1. 决定要将目录命名为什么。

    - 2. 按 mkdir <directoryname> 的形式发出 mkdir 命令。


    例如


    ```

    > mkdir fresh_new_directory

    ```

