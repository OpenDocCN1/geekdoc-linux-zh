  - '[PAGE 30]


    ```

    >whatis time

    time (2)      - get time in seconds

    time (n)      - time the execution of a script

    Time::local (3) - efficiently compute time from local and GMT time

    Time::gmtime (3) - by-name interface to Perl''s built-in gmtime() function

    Time::localtime (3) - by-name interface to Perl''s built-in localtime() function

    Time::tm (3)   - internal object used by Time::gmtime and Time::localtime

    END

    ```


    You can see that the time keyword has turned up six different entries in the whatis
    database. To return to the command prompt, you''ll need to press q.


    # What do the Extra Letters and Numbers Mean?


    You''ve probably noticed that some commands are followed by a letter or numeral;
    this is the section number for that command. For instance, time is followed by
    both n and 2. This means that there are two separate uses for the time command.
    To learn information about each of the variations, use man followed by the section
    number or letter and the command. For example, man n time or man 2 time.


    If you''re entirely unsure of what you want and a keyword search does not return
    anything useful, try the apropos or man -k command. This searches the descriptions
    much like whatis does, but also displays partial matches to the string you specify.


    Try running apropos on time and compare your results with the results from the
    similar whatis time command:


    ```

    >apropos time

    clock (3)     - Determine processor time

    clock (n)     - Obtain and manipulate time

    convdate (1)  - convert time/date strings and numbers

    date (1)      - print or set the system date and time

    difftime (3)  - calculate time difference

    ```'
