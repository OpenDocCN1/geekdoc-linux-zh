    Ctrl+ 后跟一个字符时，表示你需要按住 Control 键并输入该字符：


    - emacs 编辑器没有单独的命令输入模式。你始终是在输入命令或输入文本——两者之间无需切换模式。这就像你可能熟悉的大多数文字处理器。要输入文本，只需输入你想要显示的内容；要输入命令，只需输入命令（通常是
    Ctrl+某键，或 Esc x 某键）。

    - 你可以在几乎所有版本的 emacs 和终端组合中使用方向键键盘定位光标。如果方向键不起作用，你也可以使用 Ctrl+f 向前移动、Ctrl+b 向后移动、Ctrl+p
    移至上一行和 Ctrl+n 移至下一行来定位光标。新版本的 emacs 也允许你使用鼠标定位光标，但许多用户实际上发现这比光标键不方便。

