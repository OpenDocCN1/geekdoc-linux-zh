    ## 引言


    ### 欢迎来到 UNIX 世界


    欢迎阅读《Sam''s Teach Yourself UNIX in 10 Minutes》。如果您像大多数第一次使用 UNIX 的人一样，您可能对使用 UNIX
    会是什么样子有一些想法——大多数都令人望而生畏。人们可能告诉过您 UNIX 使用困难，命令晦涩，界面不直观。您几乎肯定听说过 UNIX 功能强大，但这种强大是以陡峭的学习曲线为代价的。学习和使用
    UNIX 会很有趣和有收获的想法可能离您的想法最远。本书的内容希望能改变您的想法。您将学习如何使用 UNIX 的命令行和图形用户界面，并熟悉日常高效使用 UNIX
    所需的命令。


    ### 那么 UNIX 到底是什么？


    UNIX 是一个功能强大的多任务（它可以同时运行多个程序）操作系统。它最初被设计为用于测试操作系统实现想法的实验操作系统，从其谦逊的根源发展成为网络服务器和程序开发的领先商业平台。


    由于其根源，UNIX 的许多部分都是以“尽可能简单的方式”实现的。虽然这会导致操作系统中的某些低效率，但它也证明是 UNIX 最大的优势之一——许多“尽可能简单的方式”想法最终成为用户的巨大好处。例如，尽可能简单的方式往往导致数据存储位置或访问方式的抽象。与其关心某物位于何处，不如设计一种单一的数据访问方式。然后每当需要从某种新型设备检索数据时，您只需创建一个软件，允许通过预先存在的接口访问新数据。


    UNIX 也是一个多用户操作系统。与个人计算机对多用户想法的某些实现不同，在 UNIX 中，许多用户可以同时使用一台机器。从每个用户的角度来看，他们控制着整台机器。此外，UNIX
    不仅仅是隐藏您的文件不让其他用户看到，它实际上赋予您拒绝或允许其他用户访问您文件的能力，使它们对被拒绝访问的用户来说不可见且无法访问。


    在您使用 UNIX 一段时间后，您会发现一个有趣的事情是，许多更有用的实用程序和应用程序都是由像您一样的其他用户编写和支持的。UNIX 操作系统的强大功能、构建复杂命令的简易性以及
    UNIX 强大的编程和网络联系，培养了 UNIX 用户强烈的合作精神。长期以来一直存在一种传统，即为解决某个问题而构建的软件会由其作者提供给 UNIX 社区，其余人使用，这又成为构建更复杂命令的又一块基石。您可能会惊讶地发现，UNIX
    上最强大的编译器和调试器都是免费提供的，许多其他有用应用程序也是如此。虽然您可能熟悉个人计算机世界中的共享软件概念，但 UNIX 免费软件的概念可能会让您至少略感惊讶。许多
    UNIX 免费软件在优雅性、完整性以及——最重要的是——对软件错误报告的响应速度上可与商业软件相媲美，甚至超过商业软件。与单一的共享软件作者不同，许多 UNIX
    免费软件由整个用户社区支持。例如，如果您使用其中一种免费的 UNIX 数据库系统并发现一个错误，那么由为该特定项目贡献代码的数百名用户之一修复您的错误——并且在一周内发布新版本——是完全可以预期的。


    ### UNIX 的版本


    稍微了解一下，您可能会注意到有许多不同的 UNIX 版本（通常称为风格）可供使用，有时甚至来自同一厂商就有多种风格。如果您使用多个不同的 UNIX 版本，您会注意到的最大一致差异是在基于
    AT&T 的 System V UNIX

