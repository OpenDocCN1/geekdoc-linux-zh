    你可能会想为什么需要在命令后加上 -print。这是因为 find 除了告诉你找到的内容外，还能做其他事情。另一方面，如果你不使用 -print 选项，大多数版本的
    find 会很高兴地去为你查找文件，然后退出——而且什么都不告诉你。记住，UNIX 会非常字面地执行你告诉它的内容。


    ## 按日期查找文件


    想象一下，你刚刚在系统上创建了一个文档文件，但记不起它的名称。怎么才能找到它呢？一个可能的解决方案是按时间搜索，找到比某个时间更新的文件。要按创建日期搜索文件，请执行以下操作：


    - 1. 确定文件相对年龄（以天为单位）。

    - 2. 选择搜索的起始目录。记住，/ 会搜索整个文件系统，而 ~/ 只搜索你的个人目录。

    - 3. 使用 -ctime 选项调用 find：`find <starting directory> -ctime <days old> -print`。


    例如：


    ```

    >find ~/ -ctime 2 -print

    /home/jray/getip.c

    /home/jray/a.out

    /home/jray/getip2.c

    /home/jray/.saves-8395-postoffice

    ```


    如果你输入了此命令，你将搜索主目录中在过去两天（48 小时）内被修改过的文件。如果这些是你的结果，其中一个就是你要找的文件。


    ## 按大小查找文件


    按大小查找文件的优势可能在系统开始用完空间之前并不明显。UNIX 在程序崩溃时通常会保存一个名为 core 的文件；这被称为核心转储。核心文件包含程序崩溃时内存中的所有信息，可供程序员调试问题。通常核心文件可以删除，除非你想自己尝试

    调试程序。问题在于这些文件往往写入你可能不知道的目录中，并在不知情的情况下静默消耗磁盘空间。当然，如果磁盘空间不足，你会想找到可能由其他进程创建的大文件；因此，仅按名称查找
    core 是不够的。要按大小搜索，请使用以下步骤：


    - 1. 选择要搜索的目标文件大小，find 将为你定位所有该大小（或更大）的文件。

    - 2. 选择起始目录。

    - 3. 使用 -size 选项启动 find 程序：find <starting directory> -size <#> -print。


    例如：


    ```

    >find ~/ -size 1024k -print

    /home/jray/bochs/bochs-980513/core

    /home/jray/postgres51/core

    ```


    这里看到的 find 命令已定位到两个核心文件（希望它们实际上不在你的主目录中），大小为 1024k 或更大。如果有其他大文件，也会被列出；不过在这种情况下，只找到了核心文件。


    除了 -name、-ctime 和 -size 之外，还有许多其他命令行开关可与 find 一起使用。如果你有兴趣了解更多，请务必查看 find 手册页。


    ## whereis


    whereis 命令在预设的若干目录上执行快速搜索，并返回你指定的文件的源代码、二进制文件和手册页的路径。作为通用查找工具，它不如 find 有用，但仍可能派上用场。


    例如：


    ```

    >whereis time

    time: /usr/bin/time /usr/include/time.h /usr/man/man2/time.2

    =>/usr/man/man1/time.1

    ```


    whereis 命令显示 time 二进制文件位于 /usr/bin/time，而头文件位于 /usr/include/time.h。还返回了两个手册页路径。如果你有兴趣找到程序及其相关文件在机器上的位置，whereis
    可能就能解决问题。


    ## which


    最后，which 命令也可以帮助你定位位于 PATH 环境变量指定目录之一中的文件。第 16 课“修改用户环境”讨论了如何配置 PATH 变量。这作为查找文件的方法用处不大，而更像是一种方法，用于找出输入命令时执行的是哪个版本的程序。例如，如果你的系统有两个不同的名为
    time 的程序，你可以使用 which 命令找出输入 time 时运行的是哪一个。你可以像使用 whereis 一样调用 which——只需提供要查找的文件名即可。


    例如：


    ```

    >which time

    /usr/bin/time

    ```


    UNIX 返回 time 命令的完整路径。which 命令是你迄今为止见过的最不可配置的命令，但它也是最快的。如果你曾经想回忆程序的位置，不妨试试 which。


    ## 查找包含单词或模式的文件


    UNIX 中最强大的内置程序之一是 grep。grep 实用程序可让你快速在文件内容中搜索特定单词或模式。grep 有三种形式：grep、egrep 和 fgrep。这些版本之间的差异基于它们能处理的正则表达式的复杂程度。正则表达式定义了一种文本模式，可用于在不知道要搜索的具体单词或短语时搜索文件。（你将在第
    13 课“正则表达式”中了解更多关于正则表达式的内容。）fgrep 命令是三者中最快的，但处理的是最不复杂的表达式。为了安全起见，你始终可以使用普通的 grep，它在每种情况下、每个系统上都能同样工作。那么，如何使用这个很棒的工具呢？很简单——只需提供要查找的单词或模式，以及要搜索的文件：


    - 1. 选择要查找的单词或短语。

    - 2. 找到要搜索的文件名。如果它在另一个目录中，必须指定完整的路径名。你也可以使用通配符搜索多个文件。

    - 3. 在命令行输入 grep `<pattern to find>` `<file or files to search>`。


    例如：


    ```

    >grep "jray" *.txt

    8979-10.txt:<manager>=jray

    log.txt: Access by jray on 11/12/98

    kiwi.txt: jray loves to eat kiwis. But don''t you think that

    ->it would be

    ```


    此示例在任何以 .txt 结尾的文件中搜索 jray。它找到了三个包含该字符串的文件——8979-10.txt、log.txt 和 kiwi.txt；每个文件名后面跟着包含
    jray 的文本。你可能想要添加到 grep 的两个选项是 -i 以忽略大小写，以及 -n 以显示每个文件中匹配的行号。你可以将这些标志添加到命令行中，紧跟在
    grep 命令之后。


    grep 命令是一个极其有价值的工具，当你以后学习正则表达式时它会变得更有价值。记住回到本课来测试你在第 13 课中学到的一些内容。


    ## 使用 KDE 查找功能


    对于运行 KDE 的用户来说，你会很高兴知道 KDE 内置了一个查找实用程序，它提供了命令行版本 find 和 grep 的许多相同功能。KDE 为这些功能提供了一个友好的界面，对于在
    MacOS 或 Windows 电脑上运行过搜索的任何人来说都相当熟悉。KDE 查找实用程序如图 5.1 所示。

    '
