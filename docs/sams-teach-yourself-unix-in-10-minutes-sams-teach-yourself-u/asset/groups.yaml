    ## 摘要


    当您需要节省磁盘空间或缩短文件传输时间时，您可能需要借助某种压缩实用程序来压缩文件。以下是本课所学内容的回顾：


    - 在 UNIX 系统上，三个常见的压缩实用程序是无处不在的 compress、更新且更智能的 gzip 以及跨平台的 zip 程序。相对较新的 UNIX
