    以外的语言编写，但把 shell 脚本当作小程序来思考是对它们为用户提供的灵活性和便利性的不公。


    ### 花小力气办大事：Shell 脚本


    你通常会在想要将一组需要反复执行的操作组合成一个方便的单一操作时创建 shell 脚本。


    例如，你可能习惯上班后先浪费一点时间——给所有同事发送一封写着“Howdy Neighbor”的电子邮件，发送打印作业打印出个人网页最近的 100 次访问，打开一个
    xterm

    并阅读几个新闻组，等等。如果你想节省时间和按键次数，你可以编写一个小 shell 脚本来自动完成所有这些。你可以把它全部放在一个文件中并命名为 waste-time；这样，以后你只需上班后输入
    waste-time，就能让计算机自动为你浪费时间。


    使用 shell 脚本或 shell 脚本技术的另一个例子是使用一些可以直接在 shell 中自动执行某些任务的命令——无需放入文件中。本课主要会介绍这些，因为它们更容易学习且更实用。随着你对
    UNIX 越来越熟悉，你自然会倾向于把正在输入的内容放入文件——另一个 shell 脚本程序员就诞生了。


    ### Shell 脚本文件


    如前所述，shell 脚本是使用你手动与 shell 交流的相同语言编写的小型程序。用 UNIX 做到这一点是理所当然的——记住 UNIX 的输入输出模型？Shell
