    ## 第20课

    ## 特权命令


    ![](img/2c005cbaad58c25c7f54da948131a75e_202_0.png)


    *在本课中你将了解一些 UNIX 用户很少遇到的特殊命令。*


    本课中的命令仅限 root 用户运行，但这里的信息将帮助你理解 root 的一些关注点，并使与系统管理员的对话更易理解。


    由于 UNIX 的工作方式（有多用户、多进程，以及可能由数百人拥有的文件），某些命令如果交给普通用户使用会造成混乱。这些命令会执行诸如格式化磁盘、重启系统以及创建或删除设备等操作。


    ## 单用户模式


    每台 UNIX 机器都可以配置为启动到单用户模式，在该模式下机器没有网络资源且只能支持一个用户登录。这是维护模式，使 root 用户能够在不必担心其他用户更改他们正在处理的内容的情况下修复系统问题。在某些版本的
    UNIX 中，如果机器发生特别严重的崩溃，它可能会自动重新启动到单用户模式。有些需要在输入任何命令前要求 root 密码，而其他则直接进入 root shell。如果你不小心导致
    UNIX 机器崩溃并且它进入了单用户模式，请不要触碰任何东西！你所做的任何事情都可能使诊断崩溃变得不可能；更糟的是，它可能对系统造成毁灭性的影响。对于 root
    用户，rm 命令中一个按键的拼写错误就可能从上到下删除整个文件系统。


    ### fsck


    时不时会听到系统管理员抱怨不得不 fsck 一个驱动器。UNIX 通常会合理地维护其驱动器，但问题偶尔也会出现。fsck 命令是 UNIX 的磁盘修复程序，用于清理由崩溃或错误的软件片段引起的问题。大多数
    UNIX 系统在启动时会对驱动器进行 fsck，预期结果是包含文件数量和驱动器碎片化程度的分析报告。如果你正在观看 UNIX 机器启动，不要过于担心如果看到
    fsck 报告问题——UNIX 会自动尝试修复它们。在大多数情况下它会成功，并且在对驱动器使用 fsck 后系统会重新启动重启过程。如果驱动器存在严重问题，自动
    fsck 会以下列错误信息退出：Run fsck by hand。如果出现这种情况，不要触碰任何东西——去找系统管理员。


    ### mount/umount


    mount 命令指示系统将磁盘驱动器挂载到文件系统中的特定目录。正如第 4 课《文件系统》中所讨论的，UNIX 通过使驱动器在文件系统中表现为目录来抽象物理硬件。该命令告诉系统如何访问驱动器或在网络上定位它，以及将其挂载到文件系统的何处。umount
    命令正好相反——它移除已挂载的设备。


    如果你登录系统并看到类似 No Home Directory - using / 的消息，不要惊慌。很可能你的主目录没问题——它只是位于未挂载的驱动器上。这种情况不常发生，但由于驱动器和资源在网络上共享，只需有人绊倒一条网络跳线，就可能导致某些设备在电线修复前无法使用。


    如果你遇到前面提到的错误，或者在输入密码后被直接踢出系统（如某些系统会发生的情况），请在联系系统管理员前等待 15 分钟再试一次。很可能他们已经知道问题并正在尝试修复，但成群的用户打电话投诉会拖慢他们的进度。


    ### shutdown/reboot


    虽然个人电脑越来越挑剔，要求关机而不是简单地断电，但 UNIX 机器仍然更挑剔。当然，这种差异源于 UNIX 使用数十个协同工作的程序构成看似操作系统的事实。这些程序中的每一个在任何时刻都可能正在修改、移动、创建或删除文件。如果你简单地切断
    UNIX 机器的电源，你会中断所有这些进程，并且很可能破坏它们当时正在处理的文件。如果这些文件只是诸如文字处理器文档之类的东西，这只是一个小问题。不幸的是，UNIX
    还会移动和更新对操作系统至关重要的文件。简单地切断 UNIX 机器的电源可能会完全损坏驱动器，导致系统无法使用——简而言之，不要这样做。


    为防止此问题，UNIX 提供了 shutdown 命令和 reboot 命令，各自目标明确。这两个命令会优雅地退出所有正在运行的软件，将磁盘缓存信息写入驱动器，并完成各自的任务。出于显而易见的原因，它们仅限
    root 用户使用，然而一些 UNIX 硬件制造商开始在机器上安装软电源开关。软电源开关实际上并不关闭机器：它们以 root 身份执行 shutdown 命令，而无需密码。在大多数系统管理员眼中，这纯粹是糟糕的做法。如果你的机器有其中一个软电源开关，请不要使用它。其他用户可能正在使用你的机器，或者你的机器可能为其他机器提供磁盘资源。关闭它很可能在本地网络上造成混乱，并让你在系统管理员最不喜欢的用户名单上占据高位。


    ### chown


    chown 命令用于将文件的拥有者从一个账户更改为另一个账户。显然，普通用户不能使用此命令，但如果你需要此操作，系统管理员可以为你完成。记住，你始终可以使用
    cp 命令获取一份可读的文件副本——更改所有权可能并非必要。


    ## 让系统管理员满意


    UNIX 是一个非常字面化的操作系统，它或多或少地完全按照你的指示执行。如果你最终做了损害自己账户的事情并需要系统管理员从备份中恢复你的账户，请预期他/她不会很高兴。如果你做了导致网络安全漏洞或损坏系统上其他用户文件的事情，请预期他/她会变成一个喷火的食人魔。


    你面对的是一类专业人士，他们的工作非常困难，必须在处理令人头脑发胀的技术问题、整个用户社区的综合需求以及个人用户的需求之间取得平衡。


    大多数系统管理员对他们支持的用户群怀有最美好的意图和愿望，但他们也承受着巨大的时间压力。问题补丁和安全修复几乎每天都会出现并需要应用到操作系统上——未能应用其中任何一个都可能使你的系统容易受到崩溃或外部攻击。还有来自用户的持续压力，他们“绝对需要”安装某物，或刚刚删除了他们下周需要演示的编程项目。而且，还有一些用户只是需要帮助理解某物如何工作。


    系统管理员很少在事情进展顺利时听到用户的反馈，因此他们变得有点怕用户并不罕见。所有这些加起来形成的工作量导致许多系统管理员在很短的时间内就精疲力竭。


    如果你的系统管理员为你做得很好，请在与他们打交道时牢记他们的工作以及它对你的意义。偶尔说一句“谢谢”可以大大驯服那个喷火的食人魔，据说 Orange Crush
    或 Mountain Dew 和披萨也有帮助。

    '
