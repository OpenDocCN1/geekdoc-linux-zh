    # X WINDOWS OVERVIEW


    Although most flavors of UNIX can be accessed via a command-line interface from
    the console, there is also an easier way. On top of the command-line interface,
    a variety of graphical-user-interfaces (GUIs) are available. A few of these GUIs
    are proprietary, but the majority conform to an open-standard interface called
    the X Window System, or X Windows. Some manufacturers have extended the X Windows
    standard with proprietary enhancements. Unfortunately, these enhancements can
    cause parts of the interface to be incompatible with remote display on other varieties
    of UNIX. Because the general principles are similar, though, you''ll find that
    a familiarity with one GUI translates well to the others.


    # X WINDOWS BASICS


    Unlike the Macintosh and MS-Windows environments, X Windows is a system that provides
    a set of interface display functions.'
