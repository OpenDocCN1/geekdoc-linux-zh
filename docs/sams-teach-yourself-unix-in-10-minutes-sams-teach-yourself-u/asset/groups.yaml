    ## 编辑器之王：emacs


    在 vi 奇怪的语法和微小占用空间的另一端是 emacs。在某些圈子里，人们认为 emacs 是 “emacs makes a computer slow”
    的缩写，因为 emacs 无疑是编辑器中的编辑器。包括电子邮件阅读客户端、新闻阅读客户端、编程语言、在线帮助数据库和窗口系统（仅列出其中几个功能），emacs
    几乎可以肯定能做你希望编辑器做的任何事情。随着今天更快的机器和几乎无限的内存，emacs 甚至可能快到启动时你不需要喝杯咖啡休息。


    从普通用户的角度来看，emacs 的界面比 vi 直观得多。你始终处于插入模式，Control 功能是通过使用 Control+键序列而不是单独的模式来处理的。要使用
