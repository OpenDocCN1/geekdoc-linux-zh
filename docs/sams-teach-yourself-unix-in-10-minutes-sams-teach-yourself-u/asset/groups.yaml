    | metamail (1) | infrastructure for mailcap-based multimedia mail handling |

    | nanosleep (2) | pause execution for a specified time |

    | nwftime (1) | Display / Set a NetWare server''s date and time |

    | parsedate (3) | convert time and date string to number |

    | ... |  |


    This command actually turned up more than 70 matches on my system, far more than
    what is time displayed. Try to be as specific as possible when you use apropos
    or man -k, or you might spend a great deal of time wading through extraneous information.
    Don''t forget, the ... means there''s more information to be accessed by pressing
    the spacebar. As before, pressing q returns you to the command prompt.


    # BUILT-IN HELP


    Many of the common UNIX commands have a built-in help that isn''t as verbose as
    the man pages—and it can be brought up in a jiffy. If you find that you''re constantly
    using the man pages to find the options that are available for a specific command,
    you might want to see if it has its own help summary page. If you''ve spent much
    time using the compression or archiving utilities, you''ll know what I mean. For
    many commands, -help provides the information you need. In some cases, it might
    be as simple as -h or -?. If the first one doesn''t work, try again. It''s quite
    possible that built-in help is not available, so don''t be surprised if you run
    into cases where this doesn''t work as you had hoped.


    To view the built-in help for the date command, type:


    ```

    >date --help

    Usage: date [OPTION]... [+FORMAT]

    or: date [OPTION] [MMDDhhmm[[CC]YY][.ss]]

    Display the current time in the given FORMAT, or set the system date.


    -d, --date=STRING      display time described by STRING,

    ```'
