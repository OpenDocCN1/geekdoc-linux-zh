  mdcn: "\n## 摘要\n\n在本课中，你被介绍了一些不应该或不能做的事情，希望理解为什么不应该和不能做它们会使你与系统管理员的互动更轻松。系统管理员的工作很艰难，他们必须在保持系统为所有用户正常运行（有时需要他们强硬且不灵活）与创建个人用户工作所需的环境之间取得微妙平衡。大多数人确实有兴趣让系统为你尽可能最好地工作，但很多人没有时间有太多耐心。希望，了解那些使你的系统管理员生活更困难的事情类型，以及为什么不应该做它们，能够让你保持在管理员的好感中。以下是本课中其他要点的回顾：\n\
    \n- 切勿触碰看起来正在运行 root shell 的机器。\n- 不要因为未挂载的驱动器而打扰 root（你的系统管理员），除非很明显没有人知道这件事。\n\
    - 切勿在未经管理员许可的情况下关闭机器电源。如果你机器上有关机按钮，就假装它根本不存在。\n- Root（管理员用户）可以为你更改文件的拥有者，但请考虑是否真的有必要，或者复制一份是否就够了。\n\
