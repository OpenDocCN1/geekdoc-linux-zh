    users, and permissions control who can view, edit, or run files on the system.
    Luckily, there is little need for a casual user to worry about ownership. If there
    is a need to share files with other users on the system, you''ll want to take
    a look at Lesson 19, "Permissions." After you''ve logged in to your computer,
    all files that you create during your current session are automatically owned
    by your account.


