    # WATCHING FILES GROW: tail -f


    An extremely useful feature of tail is the ability to show files as they grow,
    rather than just showing the end of a file and exiting. Using the -f (follow)
    option with tail will open a file, display the last ten lines, and start monitoring
    the file for new information. When a new line of data is written to the file,
    it is immediately displayed on the screen. To interactively monitor the Web server
    log from the previous example, use tail -f /var/log/httpd/access_log and you will
    see hits on your Web server as they occur. (This presumes, of course, that your
    machine is running a Web server, and that its log is stored in /var/log/httpd/access_log.)
    Pressing Ctrl+c exits out of this tail mode.


    # Other File Formats


    Besides text files, you might encounter other documentation and README file formats
    on your UNIX computer that you need to look at. Following is a brief summary of
    what you might encounter, listed by the filename extensions they are likely to
    have:


    +   - **.Z**—A UNIX compressed file. To look at the contents of one of these files,
    you need to either uncompress it using the cleverly named uncompress command,
    or view it directly by using the zcat command.

    +   - **.gz**—This is a gzipped, short for gnu-zipped, file. (Zip is a compression
    format.) Some documentation might come stored in this format. Rather than un-zipping,
    or rather gunzipping, the file (gunzip is the program which actually expands the
    file), you can use gzcat to display the file directly.

    +   - **.ps, .eps**—These are Postscript files. If you look at these files you''ll
    notice that you can read the contents, but there is a lot of extraneous formatting
    information. Check out the ghostscript (or gs) command, the ghostview command,
    or the xpsview command if you need to view a Postscript file.

    +   - **.html**—HTML files, obviously! If you aren''t running the X Window System,
    you can read HTML files from the command line with the lynx Web browser. If you
    are running the X Window System, just load the file up in your Web browser.'
  - '[PAGE 93]


    +   - `.tex`—A TeX formatted file. TeX is a page layout language that is sometimes
    used to store program documentation. Look to the `tex` program, or the `latex`
    program, to work with these files.

    +   - `.dvi`—The result of a TeX formatted file, somewhere between the markup
    language and the actual paper output. DVI actually is intended to be a device
    independent file which allows for similar display of marked up data on any platform.
    To view a dvi file, try the `xdvi` program if you''re running the X Window System,
    `dvips` or `dvips` if you''d like to print the documentation, or `dvi2tty` if
    you''re stuck on a text-only terminal.


    That covers most of the cases that you''ll encounter. If you run into a file format
    that doesn''t appear to be included here, look around for an accompanying README.TXT,
    or README.1ST file—these are likely to contain information on how to make use
    of the unknown files.


    # SUMMARY


    Your UNIX computer is likely to be populated with a large number of documentation
    files, and more documentation comes with every new piece of software. This lesson
    should have given you a clear picture of the many different ways you can display
    files, or portions of files. Here''s a review:


    +   - `cat`—The concatenate command displays all the files you specify, one after
    the other. It does not pause at the end of pages.

    +   - `more/less`—more and less are known as pagers. They page through their input
    files, one screen at a time. less offers the ability to scroll backwards through
    files, unlike more, which provides forward-only viewing.

    +   - `head`—Displays the first few lines of a file. This is useful when you''re
    trying to look at header information in files such as email messages.'
  - '[PAGE 94]


    +   - **tail**—Views the end of a file. Used with the -f option, tail provides
    the very useful capability of displaying a logfile as it is generated. Rather
    than each program needing its own monitoring utility, tail -f can be used instead.

    +   - **Other file formats**—Although many UNIX information files are text- or
    HTML-based, there are other formats that you might encounter. This lesson looked
    briefly at some of those formats, and the programs that you can use to work with
    them.'
