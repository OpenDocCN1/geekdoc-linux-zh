    ## SAMS

    Teach Yourself

    UNIX

    in 10 Minutes


    This book offers straightforward, practical answers for fast results. By working
    through 10-minute lessons, you''ll quickly learn the fundamentals of UNIX.


    ### Tips

    point out shortcuts and solutions


    ### Cautions

    help you avoid common pitfalls


    ### Plain English

    explains new terms and definitions


    ## 10 minutes is all you need to learn how to:


    - Log in to and out of UNIX

    - Explore the X Window System and the K Desktop Environment

    - Navigate the file system like a veteran user

    - Find help when you need it most

    - Edit text

    - Perform tasks with text and file utilities

    - Work with files within the shell

    - Write basic shell scripts

    - Customize your environment

    - Set file permissions and use privileged commands

    - Access network resources

    - Print and redirect output

    - Encode and decode files


    Category: Operating Systems

    Covers: UNIX

    User Level: Beginning-Intermediate

