    \n到现在你也许已经注意到，总行声称此目录包含 14 个项目，但列表中只出现了 12 个。这是因为出于礼貌，UNIX 会隐藏一些文件，除非用户特别要求显示。以\
    \ .（点）开头的名称的文件默认不显示。通常，控制和配置文件——你不希望它们 clutter 你的目录列表——会以点命名，这样在日常使用中就不会看到它们。然而，如果你想查看它们，只需提出请求即可。在这种情况下，使用\
