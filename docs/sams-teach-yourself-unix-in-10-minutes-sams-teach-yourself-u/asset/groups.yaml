    # MONITORING YOUR SYSTEM: date, uptime, AND who


    Now turn your attention to a few commands that you can use to monitor your system.
    It''s nice to be able to see who is logged into your machine, as well as the current
    status of the computer. Following is a quick look at a trio of commands that will
    show you information that you might find useful in checking on your computer.


    # USING date


    The date command, as one might guess, returns the current date and time. If you
    have super-user privileges you can also use date to set the day and time on the
    computer. Ordinary user accounts do not have this capability. Simply type the
    following:


    ```

    >date

    Mon Nov 30 01:15:17 EST 1998

    ```


    There''s nothing to it. You might be wondering why anyone would even take the
    space to cover such a command. The answer is simple: Without the date command,
    how do you find out the current day and time information on your computer? If
    you''re using X Windows you might have a clock on your desktop, but outside of
    the windowing environment, the date command becomes very useful after you have
    lost all sense of time because you have been staring at your screen for hours
    on end.


    # USING uptime


    uptime is another simple and useful command. It returns the current time, the
    number of users logged into the system, how long the system has been running,
    and the amount of load that the system has been under. Just type uptime at the
    command prompt, as follows:


    ```

    >uptime

    1:20am up 2 days, 9:18, 2 users, load average: 1.10,0.90,0.10

    ```


    As you can see from this result, it''s 1:20am (yes, it really is!), and the system
    has been running for two days, nine hours, and 18 minutes since it was last rebooted.
    There are currently two users logged into the system. The load average is comprised
    of three values: the first value is the load'
  - '[PAGE 163]


    on the system during the past minute, the second is the load averaged during 10
    minutes, and the third, during 15 minutes. These values are rarely more than one
    or two. If you see a system load average of anything more than five, your computer
    is really busy.


    # Using who


    As you know, UNIX is a multi-user system. This means that there can be several
    different users logged in at any time. If your system seems slow, you might want
    to check who is using the computer so you can run over to their desk and yell
    at them. To see who is logged in, you use the who command as follows:


    ```

    >who


    jray tty0 Nov 29 16:35 (192.168.0.91)

    yort tty1 Nov 29 21:47 (192.168.0.211)

    ```


    There are currently two users logged into the system. who returns the user name
    of each user who is logged in, as well as the name of the controlling terminal,
    the date and time they logged in, and the IP address from which they are connected.


    > Remember finger If you don''t recognize one of the users connected to your system,
    remember the finger command. You can use this command to find out more information
    about other users on the system.


    # Other Command Line and KDE Utilities


    There are hundreds of other utilities available on your system for monitoring
    network connections, processing files, and even generating calendars (cal). If
    you want to explore, you might try listing the files in the /usr/bin and /usr/local/bin
    directories or reading the man pages for anything that sounds interesting.'
  - '[PAGE 164]


    The KDE environment provides its own utilities, including a personal information
    manager (PIM) called KArm, a floppy formatter called KFloppy, a CD player called
    KCD, and so on. There is simply no way a single reference book can touch on all
    these topics completely. Your best bet is to look through the file system and
    research the commands that look interesting. The extensive man page collection
    available for command-line utilities provides excellent reference information.
    KDE also provides comprehensive online help, which makes life pretty easy.


    # SUMMARY


    UNIX has tons of built-in utilities. In this lesson, you learned about several
    of the programs which modify information related to your account profile, as well
    as a few utilities to monitor the state of your computer and who is currently
    using it. Following is a look at what else was discussed in this lesson:


    +   - **passwd/yppasswd**—The passwd command changes your account password. If
    you''re in an environment with networked UNIX computers, you might have to use
    the yppasswd command instead.

    +   - **chsh**—Use the change shell command to change your current shell. If you
    don''t know for sure which shell you want to switch to, you can use chsh -l to
    list the available shells on your system.

    +   - **finger**—This command looks up personal information about an account on
    your computer, or on a remote computer. finger is sometimes disabled for security
