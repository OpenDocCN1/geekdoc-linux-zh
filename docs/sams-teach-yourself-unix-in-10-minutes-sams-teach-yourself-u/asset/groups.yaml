    - 要将文件保存到新文件名，请输入 Ctrl+x Ctrl+w <filename>Return。

    - 要退出 emacs，请输入 Ctrl+x Ctrl+c。如果 emacs 提示你有关未保存的缓冲区，那是因为你有未保存的工作。你可以返回保存工作，或回答“quit
    anyway?”问题的 Yes 并继续你的工作。


