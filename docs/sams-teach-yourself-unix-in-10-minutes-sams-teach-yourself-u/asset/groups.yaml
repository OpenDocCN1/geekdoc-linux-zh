    ## 摘要


    UNIX 有许多帮助资源可供使用。根据您的需求，您可以以多种不同的方式进行信息搜索。您现在熟悉的方法有


    - UNIX 手册页 — 使用 man 命令显示特定命令的完整信息。apropos、man -k、man -f 和 whatis 命令可以显示摘要信息并搜索特定类型的命令。

    - 内置帮助 — 许多程序具有内置帮助，可以通过命令行参数显示，通常是 --help 或 -h。

    - 本地文档 — 每个 UNIX 安装都带有系统管理员个性的一点点东西，因此每个安装都略有不同。本地文档可以帮助您找到安装与整体规范不同的地方。

    - **在线资源** — Linux 主页和文档项目在浏览大量在线 Linux 信息时提供了极佳的起点。请记住，尽管信息专门针对 Linux，但其中大部分也适用于其他
    UNIX 变体。comp.unix.* 新闻组对于难以找到的答案也非常有用。

    - **KDE 帮助系统** — KDE 为大多数应用程序提供了出色的内置帮助。只需从每个应用程序中位于“帮助”菜单中的“内容”进行选择即可。


    ![](img/2c005cbaad58c25c7f54da948131a75e_37_0.png)


    ## 第 3 课


    ### 图形用户界面


    *在本课中，您将学习 X Windows GUI 的基础知识，以及足够的信息来开始配置和自定义您的环境。*


    ### X WINDOWS 概述


    尽管大多数 UNIX 版本都可以通过控制台的命令行界面访问，但还有更简单的方法。在命令行界面之上，有多种图形用户界面（GUI）可用。其中一些 GUI 是专有的，但大多数都符合称为
    X Window System 或 X Windows 的开放标准接口。一些厂商已通过专有增强功能扩展了 X Windows 标准。不幸的是，这些增强功能可能导致界面部分与在其他
    UNIX 版本上的远程显示不兼容。不过，由于总体原则相似，您会发现熟悉一种 GUI 也能很好地迁移到其他 GUI。


    ### X WINDOWS 基础


    与 Macintosh 和 MS-Windows 环境不同，X Windows 是一个提供一组界面显示功能的系统。


    > X 标记位置  X Windows 通常被称为 X#，其中 # 是主要版本号；或者，您可能会遇到 X#R n，其中 # 是主要版本号，n 是次要版本号。截至本文撰写时，X11R6
    是当前版本，但通常被称为 X11——更简单地说就是 X。


    X Windows 为程序显示窗口、按钮和其他用户交互部件提供设施。它实际上被实现为在计算机上运行的一种服务器程序。想要使用 X Windows 显示功能的客户端程序会向服务器发出请求，要求其执行某些显示功能。对于客户端或服务器应用程序而言，它们是在同一台机器上运行还是被数英里的网络分隔开并不重要——客户端发出显示请求，服务器则尽力满足。


    个人电脑窗口系统与 X Windows 之间的另一个区别是，界面的外观和感觉由单独的程序控制，而不是由 X Windows 服务器控制。在 X Windows
    模型中，X 服务器负责处理客户端显示请求，例如显示窗口的请求。然而，除非客户端专门为自己绘制标题栏，否则 X 不会为其提供标题栏。必须运行单独的程序来创建标题栏并实际管理用户交互，例如移动窗口、图标化/最小化窗口或提供应用程序停靠功能。


    ### 启动 X WINDOWS


    在许多 UNIX 主机上，系统管理员已配置 X，使其在机器启动时自动启动。如果您的系统未自动启动 X，则需要在登录后手动启动它。执行此操作的两种最常见方法是程序
    xinit 和一个名为 startx、x1 或 xstart 的 shell 脚本（名称不固定）。如果您使用的是原版 Solaris 系统，可能需要使用 /usr/openwin/bin/openwin。startx（及其变体）通常是一个
    shell 脚本，可自动执行对 xinit 的部分调用。如果您好奇事物是如何完成的以及有哪些选项可用，这是开始浏览的好地方。（Shell 脚本在第 14 课“基础
    Shell 脚本”中介绍。）


    在 X 服务器本身启动后，您需要启动一些 X 应用程序。通常，这些应用程序的默认集合由位于您主目录中的文件 .xinitrc 的自动执行启动。某些 UNIX
    变体不使用此文件，或以违反直觉的方式使用它。例如，如果存在 .xinitrc，IRIX 会使用它；如果不存在，IRIX 会使用其自己的专有配置实用程序。某些
    Linux 变体使用名为 ****.m4 的文件。您的系统管理员可以更改默认配置。如果找不到 .xinitrc，您可能会发现您的系统在登录之间“自动神奇地”记住您打开了哪些窗口以及它们的位置。


    .xinitrc 文件——如果存在——包含一系列与以下类似的行：


    ```

    #!/bin/sh

    xrdb -load $HOME/.X11defaults

    xscreensaver -timeout 10 &

    xterm -geometry 80x30+10+10 &

    ```


    如果这确实是您的 .xinitrc 文件，当您启动 X11 时，.xinitrc 文件将：


    - 第 1 行 — 通过 Bourne shell sh 运行自身。

    - 第 2 行 — 从您主目录中的文件 .X11defaults 加载服务器资源数据库（本课后面会讨论）。

    - 第 3 行 — 启动 xscreensaver 命令，分配 10 分钟超时，并将其置于后台。

    - 第 4 行 — 启动一个 xterm（终端），宽度为 80 个字符，高度为 30 个字符，将其放置在屏幕顶部和左侧各 10 像素处。


    您将在本课后面看到更多 X 程序命令行选项的示例。


    ### 使用 X WINDOWS


    X Windows 的外观和感觉主要取决于您选择的窗口管理器。（您可以在本课后面了解更多关于窗口管理器及其一些选项的信息。）您会发现各种管理器之间存在一些共同点。其中一些一致的特性可能对任何使用过的人来说都很熟悉

    '
