    ## Summary


    In this lesson, you were introduced to a sampling of tools that enable you to
    make use of the network resources around you—and around the world. As you explore
    UNIX you''ll find that this was really only a small sampling, and that there are
    new tools for you to use appearing constantly. Some will be replacements or upgrades
    for the commands outlined here, and others will be completely new. Don''t be afraid
    to try them out. Here''s a quick review of this lesson''s key points:


    - The telnet command can connect you to remote machines. If you have different
    accounts on different machines, you''ll probably find yourself using it frequently.

    - The rlogin command also connects you to remote machines, but is more useful
    than telnet if the machines you work on are configured to allow you to rlogin
    between them without giving a username or password.

    - The slogin command provides security for remote connections. If you have it,
    use it. With people breaking into UNIX machines daily, the network is becoming
    a very scary place. Using the secure connection provided by slogin protects your
    network traffic from prying eyes.

    - The trn and rn commands read Usenet newsgroups. Newsgroups can be a lot of fun
    and useful in finding information, but they can also be a big drain on your time.

    - The ftp command connects you with ftp servers and enables you to transfer files
    around the world.

    - Netscape is available for many UNIX platforms. Lynx is a fast text-based Web
    browser. Both are useful for accessing World Wide Web resources.

    - You''re likely to have a wide choice of options for accessing email. Check with
    other users of your system to find out what''s available and what local configuration
    information you need.


    ## LESSON 19

    ### PERMISSIONS


    ![](img/2c005cbaad58c25c7f54da948131a75e_192_0.png)


    *In this lesson you will learn what permissions are, and how to change them.*


    UNIX file permissions might be something that you never have to deal with, but
    if you want to share files with other users on your system, chances are you need
    to know a little bit about the concept.


    ### OWNERS, GROUPS, AND PERMISSIONS


    The owner of a file is exactly what it sounds like—the person who owns the file.
    Each file has information stored with it that identifies the account that owns
    it. Files can be given to other users by changing the owner information to match
    their username. In general, the person who creates a file is the person who owns
    it.


    Each file on the UNIX system also has a secondary piece of information stored
    that records the group ownership of the file. Groups are collections of users.
    By allowing a group to share ownership of files, many people can work together
    on a project and have their changes immediately available to other members of
    the group. Creation of groups is a system administration task, so if you need
    a group created for a project, talk to your system administrator.


    Permissions control what actions a user can perform on a file or directory. There
    are three basic actions, which are pretty much self-explanatory: read, write,
    and execute. Read permissions control whether someone can view a file. Write allows
    or disallows changes to be made to a file. Lastly, execute permissions control
    whether a file can be run, or executed. In the case of a directory, these change
    a bit. If a directory has execute permissions turned off, you cannot cd into the
    directory, view its contents, or write to it. It is effectively turned off. If
    read permissions are turned off,


    you can still create files in the directory and read them, but you cannot get
    a listing of what is in the directory. Lastly, if the write permission for a directory
    is turned off, you can view a listing of the contents and read files, but you
    cannot create any new files.


    When permissions are applied to a file or folder, they are applied at three distinct
    levels: owner, group, and world. The owner permissions simply control what permissions
    the file owner has. Group permissions determine what actions can be performed
    by members of the same group to which the file belongs. Your system administrator
    can create new groups or add you to be a member of a group. You can think of world
    permissions as being permissions for a huge group that encompasses all the users
    on your computer. If there is any sort of guest access to your computer, you can
    assume that any active world permissions apply to anyone who can access your computer.


    ### CHECKING THE OWNER, GROUP, AND ASSOCIATED PERMISSIONS: ls -l


    You''ve already used the ls command extensively, but you probably haven''t been
    paying too much attention to the extended information it can return. If you run
    ls -l to list your directories, you can see the owner, group, and associated permissions
    for any file.


    For example, type the following:


    ```

    >ls -l

    -rwxr--r-- 1 jray jray 2024 Oct 28 20:39 kiwi.tar

    -rw------- 1 jray test 1463882 Jul 2 11:33 magical-beans.gz

    drwxrwxr-x 5 jray test 1024 Nov 5 12:25 kytn

    ...

    ```


    > Listing Owners and Groups Some versions of ls won''t show you the owner and
    group simultaneously with this command. Usually, they list group and owner if
    you add the -g option, as in ls -lg.


    The information you''re interested in here is in the first, third, and fourth
    columns:


    - The first column identifies the owner, group, and world permissions that are
    active for a file or directory. The first character is a d if the filetype is
    a directory. Normally this is a - for a normal file. The remainder of the characters,
    as you might guess, stand for read, write, and execute (x). The first three characters
    (following the initial - or d character) are the active owner permissions, the
    second three characters are the group permissions, and the last three are world
    permissions.

    - The third column is the file owner.

    - The fourth column is the group owner.


    In this example, the kiwi.tar file has read/write permissions for the owner, and
    read permissions active for the group and world. The owner of the file is jray
    and the group that the file belongs to is jray. The second file, magical-beans.gz,
    only has read/write permissions for the owner. (jray). The group that magical-beans.gz
    belongs to is test; the group test has no permissions to operate on the file.
    The last "file," kytn, is actually a directory. The owner of kytn is jray and
    the corresponding group is test. The owner and group both have full read, write,
    and execute permissions for this directory, whereas the world has only read and
    execute.


    ### CHANGING PERMISSIONS: chmod


    Now that you know what permissions are, you probably want to know how to change
    them. This is accomplished with the chmod command. There are two modes of operation
    that you can use with chmod: a quick-and-dirty mode, and a more user-friendly
    method of setting permissions.


    The symbolic user-friendly mode uses easy-to-remember commands to set or unset
    permissions. To use this, do the following:


    1. Pick a permission level. If you want to set permissions for the owner, the
    level is u. If you want to change permissions for the group, it is g. For world
    permissions, choose o. Lastly, if you want to affect all the levels of permissions
    (owner, group, and world), use a.

    2. Choose an operation. Decide whether you want to set (turn on) or unset (turn
    off) a particular level of permission. If you want to set a permission, the operation
    is +; if you want to unset a permission, it is -.

    3. Choose the permission itself. If you want to operate on the read permission,
    choose r, for write choose w, and for execute choose x.

    4. Issue the chmod command in this manner: chmod <permission level><operation><permission>
    <filename> <filename> ...


    For example, if you want to activate group write permissions for the “magical-beans.gz”
    file shown earlier, type the following:


    ```

    >ls -l magical-beans.gz

    >chmod g+w magical-beans.gz

    ```


    To see if this worked, you can run ls -l on the filename as follows:


    ```

    >ls -l magical-beans.gz

    -rw--w--- 1 jray test 1463882 Jul 2 11:33 magical-beans.gz

    ```


    Sure enough, write permissions are now active for the test group members.


    Because of its symbolic nature, this method for adjusting file permissions might
    be easy for some; however, there is another syntax that you might find faster
    and easier. This deals with setting the actual bit mask that controls a file''s
    permissions. Turning on one of three binary bits can represent each level of permissions.
    The first of these bits (from left to right) controls read, the second controls
    write, and the third toggles execute.


    Look at it this way:


    ```

    100 - Read permission - The decimal equivalent of

    this binary value is 4.

    010 - Write permission - The decimal value for write is 2.

    001 - Execute permission - The decimal representation is 1.

    ```


    Using this technique, you can easily set multiple permissions at once. For example,
    it''s easy to see that 110 is the combination of the read and write

