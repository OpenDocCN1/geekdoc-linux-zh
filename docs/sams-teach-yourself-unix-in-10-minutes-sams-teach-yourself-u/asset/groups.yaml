    Note that two new lines have appeared in the listing: a line for a file cryptically
    named . and a line for a file named .login. The .login file is a typical UNIX
    configuration file; expect to see files of this nature in any directory used as
    a home directory. The . file might be a little less expected; however, it is quite
    normal. The directory . exists in every directory on a UNIX machine and is essentially
    synonymous with the current directory. For example, the command ls, and the command
    ls . produce identical results because ls defaults to listing the current directory
    and . is the current directory.


    The root directory / is unique in that it does not have a directory named .. in
    it. The directory .. means "the directory preceding this one." Therefore, if you''re
    currently in /priv/home/ray/public_html, ls .. produces a listing of /priv/home/ray.


    The ls command has many options in addition to the ones discussed here: options
    for sorting, options for tabulating the data, and options for adding flags to
    the "short" listing to show the file''s attributes. Beyond the -l and -a options
    discussed previously, the next most useful are the -F option, which indicates
    file attributes, and the -R option, which recursively lists all files below the
    specified directory.


    # CHANGING DIRECTORIES: cd


    Now that you know how to find out where you are and what''s around you, it''s
    time to wander around a bit. To move from one directory to another, use the UNIX
    command cd. If you want to move from wherever you currently are to another directory,
    you


    +   1. Determine where your current location (use the pwd command if you don''t
    already know).

    +   2. Pick a directory to which you''d like to go (/usr/local for this example).

    +   3. Issue the cd command as: cd <directory name>'
  - '[PAGE 59]


    For example:


    ```

    > pwd

    /priv/home/ray/public_html

    > cd /usr/local

    > pwd

    /usr/local

    ```


    The final pwd shows /usr/local as the current directory, which is exactly what
    was wanted


    # pushd AND popd


    An even more powerful way of changing between directories is to make use of the
    directory stack.


    > Stack In computer-speak, a stack is a type of data storage which works for data
    much like a stack of dishes. With the dish-stack, dishes can only be added to
    the pile or taken off of the pile from the top, and the most recently added plate
    is the first to be removed. Data storage stacks work in exactly the same way.
    Data is pushed onto the stack, burying previous data, and popped off of the stack,
    uncovering previous data.


    If you are currently in one directory and want to change temporarily to another,
    there is an easier way to do it than with two cd commands. By making use of the
    pushd command, you can place the current directory on the directory stack and
    change your current directory to the new directory. When you are ready to return
    to your previous directory, simply use popd to get your old directory back.


    If you want to change from your current directory to another, and then return
    automatically, make use of the pushd and popd commands as follows:


    +   1. Decide where you want to go.

    +   2. Issue the pushd command as: pushd <directoryname>'
