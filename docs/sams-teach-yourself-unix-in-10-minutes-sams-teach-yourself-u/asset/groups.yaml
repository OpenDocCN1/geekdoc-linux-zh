    ## 第 11 课

    ### 进程


    *在本课中，您将学习如何处理进程：查看它们、终止它们并让它们服从您的意愿！*


    在之前的课程中您在系统上运行过的一切，以及在剩余课程中您将要运行的一切，都在您的系统上创建了进程。每个命令都会创建一个进程，UNIX 操作系统会运行该进程直到它完成或被终止。与某些桌面操作系统不同，您可以创建完全在后台运行的进程，或在半夜启动并运行的进程——甚至无需您登录到计算机。


    ## 同时运行多个命令


    UNIX 使您能够同时运行多个命令。这种功能称为多任务处理，也以不同形式出现在某些其他操作系统中。使 UNIX 不同的是，UNIX 上绝对的一切都是一个进程：想要一个时钟？运行一个程序。需要复制文件？那也是一个进程。打开一个窗口——又是另一个进程。虽然许多个人电脑操作系统允许您同时运行几个应用程序，但大多数通过将所有功能作为一个大型程序的一部分来处理其大部分功能。在
    UNIX 上，实际操作系统非常小，它同时运行大量程序以为您提供界面和其他功能。


    随着 UNIX 绝对需要运行许多同时程序只是为了为用户提供环境而来的是，用户可以运行他或她想要的任意多个同时程序。在 UNIX 系统上，您为想要做的事情运行程序。由于操作系统的运行方式，在它们运行时您是否登录实际上并不重要。您的登录——您猜对了——只是一个进程。


    ## 将命令放入后台：&


    使命令在后台运行很简单；您只需在包含命令的行末尾添加一个 & 即可。


    例如，假设您正在运行一个名为 analog 的程序来分析您的 Web 服务器日志文件。大多数日志分析对于繁忙的 Web 服务器来说需要相当长的时间，因此您可能不想等待命令完成。为了在后台运行
    analog，您只需输入以下内容：


    ```

    >analog /var/log/httpd/access_log &

    [3] 32566

    >

    ```


    结果有点晦涩，但您可以看到自己已返回到命令行，准备继续工作！返回的两个数字标识了系统上的进程。第一个结果 [3] 表示这是您发送到后台的第 3 个进程。第二个数字
    32566 是进程 ID。您的 UNIX 系统可能同时运行数百个进程，每个进程都被分配一个唯一编号。无论您的进程被分配什么编号，都将作为第二个结果值返回。


    ![](img/2c005cbaad58c25c7f54da948131a75e_124_0.png)


    > 同时运行多个命令 要按顺序运行多个命令并将整个组放入后台，您可以使用以下语法：{<command 1>; <command 2>; <command 3>}
    &。这会创建一个新的 shell 来执行命令并将其置于后台。例如，如果您想对两个文件运行 analog 实用程序，您可能会使用以下内容：(analog /var/log/httpd/access_log;
    analog /var/log/httpd/new_access_log) &

    '
