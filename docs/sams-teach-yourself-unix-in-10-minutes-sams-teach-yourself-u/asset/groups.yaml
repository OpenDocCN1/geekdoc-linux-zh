    Everything is sorted as you might expect. Now, what if you want to sort by the
    number instead of by the name? To do this, you need to follow these steps:


    +   1. Decide which column you want to sort by, and then inform sort of your decision
    by using +<columnnumber> as an argument to the command.

    +   2. You also need to tell sort what character is separating the columns by
    using the -t option. In this case it''s a few spaces, so you''d use -t " ".

    +   3. Lastly, because there are a varying number of spaces between the name and
    number, you''ll need to use ignore blanks option -b to tell sort to count a group
    of spaces as a single space.


    For example


    ```

    >sort +2 -t " " -b kiwi1.txt

    Kama 05

    Jack 07

    John 21

    Will 78

    Joan 92

    Kim 99

    ```


    Bingo! Exactly what you were hoping for, right? Now the file is sorted by the
    numbers in the second column. sort has many more options that you can explore
    on your own with the man pages, but you can see how it can be used to sort a variety
    of data stored in different formats.


    # CHOPPING UP FILES: split


    Suppose you need to email a huge file to a friend, but their email system doesn''t
    support receiving such large messages. Is it time to write a special splitting
    utility? Nope, it''s already been done for you. The split command can cut a file
    into whatever length segments you want, based on the number of lines in a file
    or the bytes. Follow these steps to use split:


    +   1. Choose your input file. For this example, I''m using kiwi.txt from the
    sort command.'
  - "[PAGE 107]\n\n+   2. Determine the number of lines you want stored in each output\
    \ file. You'll specify this by using -l <number of lines> as an option to the\
    \ sort command. If you prefer to use the number of k or MB, you can use the -b\
    \ option with k or m. For example: -l 3 divides a file into segments of three\
    \ lines each; using -b 10k results in segments 10k in size; and -b 10m creates\
    \ 10 megabyte segments.\n+   \n+   3. Choose a base output filename for the results.\n\
    +   \n+   4. Invoke sort using the following syntax: split <segment options> <inputfile>\
    \ <outputfile>.\n\nFor example\n\n```\n>split -l 3 kiwi.txt kiwisplit\n>more kiwisplit*\n\
    \n:::::::::::::::\nkiwisplitaa\n:::::::::::::::\nJoan 92\nWill 78\nJohn 21\n:::::::::::::::\n\
    kiwisplitab\n:::::::::::::::\nKim 99\nKama 85\nJack 87\n```\n\nThe kiwi.txt file\
    \ from the previous example has been run through split and has been divided into\
    \ two files of three lines each: kiwisplitaa and kiwisplitab. I've displayed the\
    \ contents of the files using the more command because split does not offer feedback\
    \ upon completion.\n\nAfter your files are split to a reasonable size, you can\
    \ transmit them to the pesky mailserver, or wherever else you want. This is just\
    \ another example of a built-in utility that will undoubtedly come in handy when\
    \ you least expect it."
  md: "\n## DESKTOP ENVIRONMENT TOOLS: KDE'S BUILT-IN EDITOR\n\nMany desktop environments,\
    \ such as KDE, provide a very convenient point-and-click text editor with all\
    \ the convenient mouse-based functionality you have probably come to expect from\
    \ personal-computer editing programs.\n\nTo activate the KDE editor click on the\
    \ K in the KDE toolbar. Now, choose Applications from the popup menu, and then\
    \ Editor from its submenu. A window that looks like the one shown in Figure 8.1\
    \ will open.\n\n![](img/2c005cbaad58c25c7f54da948131a75e_102_0.png)\n\nFIGURE\
    \ 8.1 The KDE desktop environment built-in editor.\n\n**Editor Patience** Sometimes\
    \ it takes a few seconds for X Windows-based applications to start—and there's\
    \ no spinning watch cursor to show you that the machine is actually doing what\
    \ you asked it to. Don't worry if the editor doesn't open immediately. If you\
    \ select the editor again before it opens, you'll eventually end up with two editors\
    \ running.\n\nThe built-in KDE editor includes all the normal point-and-click\
    \ selection, copying, insertion, and deletion features you might expect of a GUI-based\
    \ editor. In addition, it uses KDE's abstraction of data location to allow things\
    \ such as opening and saving files directly from Web-based URLs. In Figure 8.1,\
    \ you can see that one of the KDE text editor menus is selected. Several of these\
    \ convenient features are visible on the drop-down menu that has appeared.\n\n\
    ## SUMMARY\n\nIn this lesson, you were introduced to the two most popular text\
    \ editors on the UNIX platform: vi and emacs. It is best with both of these editors\
    \ to learn by doing, and this lesson will provide you with the tools necessary\
    \ to do the three most important tasks in a text editor: starting the editor,\
    \ editing text, and exiting gracefully if you screw up. Because you know how to\
    \ quit both vi and emacs without saving, don't be afraid to experiment. You also\
    \ learned about KDE's built-in editor as a desktop environment alternative to\
    \ the text-window based editors from the older UNIX world. Following is a review:\n\
    \n- The vi editor is fast and convenient for making small changes to files. It\
    \ has a user interface that might be called non-intuitive at the kindest. The\
    \ omnipresence of the vi editor, its speed of execution, and its small disk-space\
    \ requirements make it a convenient choice for fast edits—and for when you're\
    \ working at an unfamiliar machine.\n- Esc :q! gets you out of vi in a hurry,\
    \ and without saving any changes you've made.\n- The emacs editor contains everything\
    \ you need in an editor, and then some, and then some more. On older hardware,\
    \ emacs was a very slow to start, very slow to respond editor, but this has been\
    \ largely mitigated by today's fast machines and extremely inexpensive disk space\
    \ and memory. Take the emacs tutorial, dig around in its info files (Esc+xinfo+Return),\
    \ and find a book on emacs to read if you want to get the most out of this editor.\n\
    - Ctrl+x Ctrl+c, followed by answering Yes to any \"quit anyway?\" questions,\
    \ gets you out of emacs in a hurry, and without saving any changes you've made.\n\
    \n![](img/2c005cbaad58c25c7f54da948131a75e_104_0.png)\n\n## LESSON 9\n\n### TEXT\
    \ AND FILE UTILITIES\n\n*In this lesson you'll round out your look at text utilities\
    \ by learning how to perform some routine, and some not-so-routine, tasks on text\
    \ files.*\n\nSome of what you're going to see in this lesson might not seem to\
    \ be useful, but using this information in conjunction with other commands can\
    \ be very powerful. If you take up shell scripting (discussed in Lesson 14, \"\
    Basic Shell Scripting\"), you'll appreciate that UNIX includes utilities that\
    \ can make your programming life simpler.\n\n### COUNTING LINES, WORDS, AND CHARACTERS:\
    \ WC\n\nIf you want to get quick statistics about a text file on your machine,\
    \ but don't want to load it up into a word processor, you can use the wc command\
    \ to provide information on the number of lines, words, and characters within\
    \ a single file.\n\nTo use wc, simply supply the name of a file you want analyzed,\
    \ in the following form: wc <filename>. If you pass more than one filename to\
    \ wc, all the files are processed, and a grand total for everything is returned.\n\
    \nFor example\n\n```\n>wc *.txt\n  390   2799  16284  intro.txt\n  4944  43494\
    \  257939 lesson7.txt\n  5244  46293  274223 total\n```\n\nIn this example, we\
    \ have processed all the .txt files in the current directory (intro.txt and lesson7.txt).\
    \ Four columns of information are returned for each file. The first value is the\
    \ number of lines in the file, the second is a count of the words in the file,\
    \ and the third is the number of characters. The final column, of course, is the\
    \ filename. If you want to limit the values to either lines, words, or characters,\
    \ you can use the -l, -w, or -c options, respectively.\n\n> Uses for wc A common\
    \ use for wc is to check the number of entries in log files. For example, to see\
    \ how many hits a Web server has received since the last time the log files were\
    \ reset, you can use a command such as wc -l /var/log/httpd/access_log. This returns\
    \ the number of lines in the access_log file. Because each line represents a hit,\
    \ you can use wc to quickly count the hits.\n\n### SORTING INFORMATION: sort\n\
    \nSorting is another useful function that you can do quickly with a built-in command\
    \ rather than writing a specialized utility to do it. For example, suppose you\
    \ have a file called kiwi.txt that contains the following:\n\n```\nJoan 92\nWill\
    \ 78\nJohn 21\nKim 99\nKama 05\nJack 07\n```\n\nIt's pretty simple to sort these\
    \ by hand (ignoring the numbers for now), but what if you have several thousand\
    \ names instead of six? You can use the sort command. Let's try running sort on\
    \ kiwi.txt and see what happens:\n\n```\n>sort kiwi.txt\nJack 07\nJoan 92\nJohn\
    \ 21\nKama 05\nKim 99\nWill 78\n```\n\nEverything is sorted as you might expect.\
    \ Now, what if you want to sort by the number instead of by the name? To do this,\
    \ you need to follow these steps:\n\n- 1. Decide which column you want to sort\
    \ by, and then inform sort of your decision by using +<columnnumber> as an argument\
    \ to the command.\n- 2. You also need to tell sort what character is separating\
    \ the columns by using the -t option. In this case it's a few spaces, so you'd\
    \ use -t \" \".\n- 3. Lastly, because there are a varying number of spaces between\
    \ the name and number, you'll need to use ignore blanks option -b to tell sort\
    \ to count a group of spaces as a single space.\n\nFor example\n\n```\n>sort +2\
    \ -t \" \" -b kiwi1.txt\nKama 05\nJack 07\nJohn 21\nWill 78\nJoan 92\nKim 99\n\
    ```\n\nBingo! Exactly what you were hoping for, right? Now the file is sorted\
    \ by the numbers in the second column. sort has many more options that you can\
    \ explore on your own with the man pages, but you can see how it can be used to\
    \ sort a variety of data stored in different formats.\n\n### CHOPPING UP FILES:\
    \ split\n\nSuppose you need to email a huge file to a friend, but their email\
    \ system doesn't support receiving such large messages. Is it time to write a\
    \ special splitting utility? Nope, it's already been done for you. The split command\
    \ can cut a file into whatever length segments you want, based on the number of\
    \ lines in a file or the bytes. Follow these steps to use split:\n\n- 1. Choose\
    \ your input file. For this example, I'm using kiwi.txt from the sort command.\n\
    - 2. Determine the number of lines you want stored in each output file. You'll\
    \ specify this by using -l <number of lines> as an option to the split command.\
    \ If you prefer to use the number of k or MB, you can use the -b option with k\
    \ or m. For example: -l 3 divides a file into segments of three lines each; using\
    \ -b 10k results in segments 10k in size; and -b 10m creates 10 megabyte segments.\n\
    - 3. Choose a base output filename for the results.\n- 4. Invoke split using the\
    \ following syntax: split <segment options> <inputfile> <outputfile>.\n\nFor example\n\
    \n```\n>split -l 3 kiwi.txt kiwisplit\n>more kiwisplit*\n\n:::::::::::::::\nkiwisplitaa\n\
    :::::::::::::::\nJoan 92\nWill 78\nJohn 21\n:::::::::::::::\nkiwisplitab\n:::::::::::::::\n\
    Kim 99\nKama 05\nJack 07\n```\n\nThe kiwi.txt file from the previous example has\
    \ been run through split and has been divided into two files of three lines each:\
    \ kiwisplitaa and kiwisplitab. I've displayed the contents of the files using\
    \ the more command because split does not offer feedback upon completion.\n\n\
    After your files are split to a reasonable size, you can transmit them to the\
    \ pesky mailserver, or wherever else you want. This is just another example of\
    \ a built-in utility that will undoubtedly come in handy when you least expect\
    \ it.\n"
  mdcn: "\n## 桌面环境工具：KDE 的内置编辑器\n\n许多桌面环境，例如 KDE，提供了一个非常方便的点选式文本编辑器，具有您可能已从个人电脑编辑程序中期望的所有方便的基于鼠标的功能。\n\
    \n要激活 KDE 编辑器，请点击 KDE 工具栏中的 K。现在，从弹出菜单中选择“应用程序”，然后从其子菜单中选择“编辑器”。一个看起来像图 8.1 所示的窗口将会打开。\n\
    \n![](img/2c005cbaad58c25c7f54da948131a75e_102_0.png)\n\n图 8.1 KDE 桌面环境内置编辑器。\n\
    \n**编辑耐心** 有时基于 X Windows 的应用程序启动需要几秒钟——并且没有旋转的沙漏光标来显示机器实际上正在执行您要求的操作。如果编辑器没有立即打开，请不要担心。如果在编辑器打开之前再次选择编辑器，最终您会同时运行两个编辑器。\n\
    \n内置的 KDE 编辑器包含 GUI 编辑器中您可能期望的所有常规点选选择、复制、插入和删除功能。此外，它使用 KDE 对数据位置的抽象，允许诸如直接从基于\
    \ Web 的 URL 打开和保存文件等操作。在图 8.1 中，您可以看到其中一个 KDE 文本编辑器菜单已被选中。下拉菜单中出现了几个这些方便的功能。\n\
    \n## 摘要\n\n在本课中，您了解了 UNIX 平台上两个最流行的文本编辑器：vi 和 emacs。对于这两个编辑器来说，通过实践学习是最好的，本课将为您提供执行文本编辑器中三个最重要的任务所需的工具：启动编辑器、编辑文本，以及在操作失误时优雅退出。由于您知道如何在不保存的情况下退出\
    \ vi 和 emacs，因此不要害怕尝试。您还了解了 KDE 的内置编辑器，它是桌面环境中对来自旧 UNIX 世界的基于文本窗口编辑器的替代方案。以下是回顾：\n\
    \n- vi 编辑器快速方便，适合对文件进行小幅修改。它的用户界面即使在最宽容的情况下也可能被称为不直观。vi 编辑器的无处不在、执行速度快以及对磁盘空间需求小，使其成为快速编辑的便捷选择——尤其是在不熟悉的机器上工作时。\n\
    - Esc :q! 可以迅速让您退出 vi，并且不会保存您所做的任何更改。\n- emacs 编辑器包含了编辑器所需的一切，甚至更多，再多一些。在较旧的硬件上，emacs\
    \ 启动非常慢、响应也非常慢，但这在今天快速的机器以及极其廉价的磁盘空间和内存面前已在很大程度上得到缓解。学习 emacs 教程，探索其 info 文件（Esc+xinfo+Return），如果您想充分利用此编辑器，请找一本关于\
    \ emacs 的书阅读。\n- Ctrl+x Ctrl+c，然后对任何“仍要退出吗？”的问题回答 Yes，可以迅速让您退出 emacs，并且不会保存您所做的任何更改。\n\
    \n![](img/2c005cbaad58c25c7f54da948131a75e_104_0.png)\n\n## 第 9 课\n\n### 文本和文件实用工具\n\
    \n*在本课中，您将通过学习如何对文本文件执行一些常规和非常规任务，来完善您对文本实用工具的了解。*\n\n本课中您将看到的一些内容可能看起来并不有用，但将这些信息与其他命令结合使用可以非常强大。如果您开始学习\
    \ shell 脚本（在第 14 课“基础 Shell 脚本”中讨论），您会欣赏到 UNIX 包含的实用工具可以让您的编程生活更简单。\n\n### 计数行、词和字符：WC\n\
    \n如果您想快速获取机器上文本文件的统计信息，但又不想将其加载到文字处理器中，您可以使用 wc 命令提供单个文件中行数、词数和字符数的信息。\n\n使用 wc，只需提供您想要分析的文件名，格式如下：wc\
    \ <filename>。如果您向 wc 传递多个文件名，所有文件都会被处理，并返回所有内容的总计。\n\n例如\n\n```\n>wc *.txt\n \
    \ 390   2799  16284  intro.txt\n  4944  43494  257939 lesson7.txt\n  5244  46293\
    \  274223 total\n```\n\n在此示例中，我们处理了当前目录中的所有 .txt 文件（intro.txt 和 lesson7.txt）。每个文件返回四列信息。第一个值是文件中的行数，第二个是文件中的词数，第三个是字符数。当然最后一列是文件名。如果您只想限制为行、词或字符，可以分别使用\
    \ -l、-w 或 -c 选项。\n\n> wc 的用途 wc 的常见用途是检查日志文件中的条目数。例如，要查看 Web 服务器自上次重置日志文件以来收到的点击次数，您可以使用类似\
    \ wc -l /var/log/httpd/access_log 的命令。这会返回 access_log 文件中的行数。由于每一行代表一次点击，您可以使用\
    \ wc 快速统计点击次数。\n\n### 排序信息：sort\n\n排序是另一个有用的功能，您可以使用内置命令快速完成，而不必编写专用实用程序。例如，假设您有一个名为\
    \ kiwi.txt 的文件，其中包含以下内容：\n\n```\nJoan 92\nWill 78\nJohn 21\nKim 99\nKama 05\n\
    Jack 07\n```\n\n手工排序这些（暂时忽略数字）非常简单，但如果您有几千个名字而不是六个怎么办？您可以使用 sort 命令。让我们尝试在 kiwi.txt\
    \ 上运行 sort，看看会发生什么：\n\n```\n>sort kiwi.txt\nJack 07\nJoan 92\nJohn 21\nKama 05\n\
    Kim 99\nWill 78\n```\n\n一切都如您所期望的那样排序了。现在，如果您想按数字而不是按名称排序怎么办？要做到这一点，您需要按照以下步骤操作：\n\
    \n- 1. 决定您想要按哪个列排序，然后使用 +<columnnumber> 作为命令的参数通知 sort。\n- 2. 您还需要在使用 -t 选项告诉\
    \ sort 列之间的分隔字符是什么。在这种情况下是几个空格，因此您将使用 -t \" \"。\n- 3. 最后，由于姓名和数字之间空格数量不一，您需要使用忽略空白选项\
    \ -b 告诉 sort 将一组空格计为单个空格。\n\n例如\n\n```\n>sort +2 -t \" \" -b kiwi1.txt\nKama 05\n\
    Jack 07\nJohn 21\nWill 78\nJoan 92\nKim 99\n```\n\nBingo！正是您所希望的，对吧？现在文件已按第二列中的数字排序。sort\
    \ 还有许多其他选项，您可以使用手册页自行探索，但您可以看到它如何用于对以不同格式存储的各种数据进行排序。\n\n### 切分文件：split\n\n假设您需要通过电子邮件向朋友发送一个巨大的文件，但他们的电子邮件系统不支持接收如此大的消息。是时候编写一个特殊的分割实用程序了吗？不用，已经为您做好了。split\
    \ 命令可以根据文件中的行数或字节数将文件切分为您想要的任意长度的段。按照以下步骤使用 split：\n\n- 1. 选择输入文件。对于此示例，我使用的是来自\
    \ sort 命令的 kiwi.txt。\n- 2. 确定您希望每个输出文件存储的行数。您将通过使用 -l <行数> 作为 split 命令的选项来指定这一点。如果您更喜欢使用\
    \ k 或 MB 的数量，可以使用 -b 选项配合 k 或 m。例如：-l 3 将文件分成每段三行的片段；使用 -b 10k 会产生大小为 10k 的片段；-b\
    \ 10m 则创建 10 兆字节的片段。\n- 3. 为结果选择一个基本输出文件名。\n- 4. 使用以下语法调用 split：split <段选项> <输入文件>\
    \ <输出文件>。\n\n例如\n\n```\n>split -l 3 kiwi.txt kiwisplit\n>more kiwisplit*\n\n:::::::::::::::\n\
    kiwisplitaa\n:::::::::::::::\nJoan 92\nWill 78\nJohn 21\n:::::::::::::::\nkiwisplitab\n\
    :::::::::::::::\nKim 99\nKama 05\nJack 07\n```\n\n上一个示例中的 kiwi.txt 文件已通过 split\
    \ 处理，并被分成两个各含三行文件：kiwisplitaa 和 kiwisplitab。我使用 more 命令显示了文件内容，因为 split 在完成后不会提供反馈。\n\
    \n在将文件分割到合理大小后，您可以将其传输到讨厌的邮件服务器，或您想要的任何其他地方。这只是另一个内置实用程序的例子，它在您最意想不到的时候肯定会派上用场。\n"
