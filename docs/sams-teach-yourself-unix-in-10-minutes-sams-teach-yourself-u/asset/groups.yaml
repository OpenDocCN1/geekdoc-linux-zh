  mdcn: "\n如何阅读剩余内容？当你在屏幕上看到 ... 时，表示还有更多文本可读。man 手册不会自动滚动，因此你需要按空格键查看更多文本。按 q 退出页面并返回命令行。\n\
    \n这只是通过 man 命令返回的信息中很小的一部分，但足以让你了解概况。你很快会发现，使用 man 手册来了解系统上所有可用内容需要花费一些时间。你可以通过以下四种命令之一查看命令的摘要说明来加快速度：man\
    \ -f、man -k、whatis 或 apropos，后跟你想要探索的命令名称。这些功能返回的结果相似，但搜索的方式有两种不同的方法。\n\n## man\
    \ 变体、apropos、whatis\n\n如果你知道想要查询的命令，请使用 man -f 或 whatis，后跟命令名称。\n\n例如，要打印 date\
    \ 命令的摘要，请输入：\n\n```\n>man -f date\n date (1)      - print or set the system date\
    \ and time\nEND\n```\n\n会返回 date 的简短描述。按 q 返回命令行。\n\n如果你不太确定要找什么，man -f 和 whatis\
    \ 会在每个可用命令的描述中搜索匹配的关键词。如果运行这些命令时出现任何错误，可能是因为 whatis 数据库已被从系统中移除，或尚未创建。你需要联系系统管理员，请他或她使用\
    \ makewhatis 生成使用 whatis 所需的数据库文件。因为这是一个会影响系统受保护区域的功能，大多数用户无法使用。\n\n现在，尝试对主题 time\
    \ 运行 whatis。这会列出几个相关条目。\n\n```\n>whatis time\ntime (2)      - get time in seconds\n\
    time (n)      - time the execution of a script\nTime::local (3) - efficiently\
    \ compute time from local and GMT time\nTime::gmtime (3) - by-name interface to\
    \ Perl's built-in gmtime() function\nTime::localtime (3) - by-name interface to\
    \ Perl's built-in localtime() function\nTime::tm (3)   - internal object used\
    \ by Time::gmtime and Time::localtime\nEND\n```\n\n你可以看到 time 关键词在 whatis 数据库中出现了六个不同的条目。要返回命令提示符，你需要按\
    \ q。\n\n## 额外的字母和数字是什么意思？\n\n你可能已经注意到有些命令后面跟着字母或数字；这是该命令的章节号。例如，time 后面同时跟着 n\
    \ 和 2。这意味着 time 命令有两种不同的用途。要了解每种变体的信息，请使用 man 后跟章节号或字母以及命令。例如，man n time 或 man\
    \ 2 time。\n\n如果你完全不确定想要什么，并且关键词搜索没有返回有用的结果，请尝试 apropos 或 man -k 命令。这会像 whatis\
    \ 一样搜索描述，但也会显示你指定的字符串的部分匹配项。\n\n尝试对 time 运行 apropos，并将结果与类似的 whatis time 命令的结果进行比较：\n\
    \n```\n>apropos time\nclock (3)     - Determine processor time\nclock (n)    \
    \ - Obtain and manipulate time\nconvdate (1)  - convert time/date strings and\
    \ numbers\ndate (1)      - print or set the system date and time\ndifftime (3)\
    \  - calculate time difference\n```\n\n| 命令 | 描述 |\n|---|---|\n| ftime (3) | 返回日期和时间\
    \ |\n| ftpshut (8) | 在指定时间关闭 ftp 服务器 |\n| kbdrate (8) | 重置键盘重复速率和延迟时间 |\n| ldconfig\
    \ (8) | 确定运行时链接绑定 |\n| metamail (1) | 基于 mailcap 的多媒体邮件处理的框架 |\n| nanosleep (2)\
    \ | 暂停执行指定时间 |\n| nwftime (1) | 显示/设置 NetWare 服务器的日期和时间 |\n| parsedate (3) | 将时间和日期字符串转换为数字\
    \ |\n| ... |  |\n\n该命令在我的系统上实际返回了超过 70 个匹配项，远多于 whatis time 显示的结果。使用 apropos 或\
    \ man -k 时，尽量具体，否则你可能会花费大量时间筛选无关信息。别忘了，... 表示可以通过按空格键访问更多信息。如前所述，按 q 会返回到命令提示符。\n\
    \n## 内置帮助\n\n许多常见的 UNIX 命令都有内置帮助，其内容不如 man 手册详细——而且可以迅速调出。如果你发现自己 constantly 使用\
    \ man 手册来查找特定命令可用的选项，你可能想看看它是否有自己的帮助摘要页。如果你花了很多时间使用压缩或归档工具，你会明白我的意思。对于许多命令，-help\
    \ 提供了所需的信息。在某些情况下，可能只需 -h 或 -?。如果第一个不起作用，再试一次。内置帮助可能不可用，所以如果遇到不按预期工作的情况，不要感到惊讶。\n\
    \n要查看 date 命令的内置帮助，请输入：\n\n```\n>date --help\nUsage: date [OPTION]... [+FORMAT]\n\
    or: date [OPTION] [MMDDhhmm[[CC]YY][.ss]]\nDisplay the current time in the given\
    \ FORMAT, or set the system date.\n\n-d, --date=STRING      display time described\
    \ by STRING,\n-f, --file=DATEFILE    not 'now'\n                       like --date\
    \ once for each line of\n                       DATEFILE\n-r, --reference=FILE\
    \   display the last modification time\n                       of FILE\n-R, --rfc-822\
    \          output RFC-822 compliant date string\n-s, --set=STRING       set time\
    \ described by STRING\n-u, --utc, --universal print or set Coordinated Universal\n\
    \                       Time\n--help                 display this help and exit\n\
    --version              output version information and exit\n...\n```\n\n虽然不如 man\
