    >cat kiwi.txt food.txt

    ```


    Kiwis are small, brown, and fuzzy.

    They are good to eat.


    The contents of the two files are displayed on the screen, one after the other.
    Pretty easy, huh? The biggest problem you''ll have with cat is that files scroll
    off the screen if they are too large—but you''re about to learn a way around that.


    > **UNIX Shortcut** If you want to display all the files ending in .txt in the
    directory, you can use wildcards with any of the commands discussed in this lesson.
    The command `cat *.txt` shows everything that ends with .txt in the current directory.


    ### VIEWING A PAGE AT A TIME: PAGERS


    The cat command is fine when you just want to quickly show some information—but
    what about large files that scroll past a bit too quickly to read? Luckily, there
    are some utilities specifically created for reading files from the command line:
    more, and the more recent and more powerful less. These are often referred to
    by the generic term pagers, as they display files to your window or screen one
    page at a time.


    ### THE EVERPRESENT PAGER: more


    Like cat, to use more all you need to do is type the command followed by the file
    or files you want to display.


    For example, type


    ```

    >more longfile.txt

    ```


    This displays the file longfile.txt using more. Showing the output of the command
    is a waste of space because the results are simply the contents of the file, shown
    one page at a time. Instead, following are some commands you can use from within
    more to control the process:


    - Spacebar—Advances the output to the next page.

    - q—Quits out of the more program, exiting to the command line.

    - s—Skips forward one line in the file. Use this to slowly advance through the
    file.

    - f—Skips an entire page in the file.

    - /<pattern>—Search and jump to a pattern or word in the file.

    - ? or h—Displays help for the more command. Because you can use this while viewing
    a file, it''s probably the most important one to remember.


    more is probably available on any UNIX computer that you happen to use. If you''re
    lucky, your system might include—or your system support staff might have been
    kind enough to install—less. Believe it or not, less is more than more.


    ### THE PAGER WITH MORE: less


    Less provides one important capability that some versions of more lack—the ability
    to move backwards through files. Once again, invoking less is identical to using
    cat and more. Just supply the files you want to view as arguments to the command.


    For example


    ```

    >less longfile.txt

    ```


    As with more, less displays longfile.txt one page at a time. Controlling the output
    from less is very similar to more. There are several commands that enable you
    to move around within less:


    - Spacebar—Advances the output to the next page.

    - b—Backs up one page.

    - q—Quits out of the less program, exiting to the command line.

    - Up arrow (or k)—Scroll up one line.

    - Down arrow (or j)—Scroll down one line.

    - /<pattern>—Search forward and jump to a pattern or word in the file.

    - ?<pattern>—Search backwards and jump to a pattern or word in the file.

    - h—Displays help for the less command.


    Please keep in mind that this is not meant to be a comprehensive list of all the
    options that more and less support. In fact, if this book were to include all
    the options you can use with less, it would probably occupy 20 pages. What is
    included here is meant to give you enough information to get started.


    ### PEEKING AT PARTS OF A FILE


    There are some instances when you''re only interested in what is stored at the
    top or bottom of a file. Although it might initially sound odd, if you spend much
    time using UNIX you''ll find that these are very useful tricks. Suppose you have
    a directory filled with saved email or newsgroup messages. Rather than displaying
    each message in its entirety you might just want to see the header of the message,
    which contains the subject and sender address. To do this, use the head command
    to show you the beginning of the file. Similarly, if you''re running a Web server
    and want to see the last few people who accessed your site, you can use tail to
    look at the end of your log file.


    ### VIEWING THE BEGINNING: head


    You might be noticing a common thread between all the programs we''ve looked at.
    To run them, all you need to do is supply the command followed by the file or
    files you want to view. The same continues to hold true for head. By default,
    head displays the first ten lines of each file you specify.


    For example


    ```

    >head news112.msg

    From ksteinmetz@nwu.edu Mon Mar 4 13:11:12 PST 1998

    Article: 28223 of comp.sys.next.sysadmin

    Path: magnus.acs.ohio-state.edu!math.ohio-state.edu!

    →newsfeed.acns.nwu.edu!news.acns.nwu.edu!news

    From: ksteinmetz@nwu.edu (Kimberly A. Steinmetz)

    Newsgroups: comp.sys.next.sysadmin

