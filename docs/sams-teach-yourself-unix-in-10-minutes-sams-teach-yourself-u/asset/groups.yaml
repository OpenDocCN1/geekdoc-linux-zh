    +   - There are many different shells—yours might work differently than what is
    presented here, but probably has similar capabilities. If it doesn’t, get a better
    shell!

    +   - The foreach command enables you to repeat a set of commands for each of
    a number of files.

    +   - The while command enables you to repeat a set of commands while a certain
    condition holds.

    +   - The if command enables you to execute a command—or not execute it—based
    on a conditional statement.

    +   - The sleep command does nothing for a while—sometimes this is actually useful.'
