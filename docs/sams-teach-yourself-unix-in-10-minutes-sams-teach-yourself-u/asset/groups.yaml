    # LESSON 2


    # UNIX

    DOCUMENTATION

    AND FINDING

    HELP


    *This lesson will show you how to find help using several methods of retrieving
    information about UNIX''s built-in commands and capabilities.*


    If you''ve poked around your UNIX system at all, you''ve probably noticed that
    there are literally thousands of different files and applications on your computer.
    You might find this to be a bit overwhelming at first, but the diversity and extensive
    capabilities of the operating system are part of its attraction. If there is something
    you want to do, you can bet that UNIX has a utility or combination of utilities
    that can get the job done. The biggest question on your mind is probably, "How
    do I use this stuff?"


    # UNIX MANUAL PAGES


    Although some UNIX commands provide instant feedback and help information to you
    if you simply type the command on the command line, this help is usually only
    useful for the experienced user who just needs a quick reminder. The UNIX manual
    (man) pages, on the other hand, are the quickest and easiest source for complete
    information on how to use the commands on your system. They provide information
    on what programs do and how to use them, as well as on other related utilities
    that you might be interested in checking out. If you''re a programmer, man pages
    can also provide useful programming information.'
  - "[PAGE 28]\n\n# man\n\nTo display a manual page, use the man command. In its simplest\
    \ form, you can use man followed by the command you want to look up.\n\nFor example,\
    \ to look up the man page for the date command:\n\n```\n>man date\n```\n\nDATE(1)\n\
    DATE(1)\n\n# NAME\n\ndate - print or set the system date and time\n\n# SYNOPSIS\n\
    \n```\ndate [-u] [-d datestr] [-s datestr] [--utc]\n[-universal] [--date=datestr]\
    \ [--set=datestr]\n[--help] [--version] [+FORMAT] [MMDDhhmm[CC]YY[.ss]]\n```\n\
    \n# DESCRIPTION\n\nThis manual page documents the GNU version of date.\ndate with\
    \ no arguments prints the current time and date\n(in the format of the '%c' directive\
    \ described below).\nIf given an argument that starts with a '+', it prints\n\
    the current time and date in a format controlled by\nthat argument, which has\
    \ the same format as the format\nstring passed to the 'strftime' function.\n\n\
    ...\n\n![](img/2c005cbaad58c25c7f54da948131a75e_28_0.png)\n\n> Turn Off the Alarm\
    \  Don't be alarmed if your system returns information which differs from what\
    \ is shown here in response to man date. Different manufacturers—and different\
    \ versions of UNIX—sometimes provide slightly different commands, and the man\
    \ pages you see reflect the correct information for your system.\n> \n> If your\
    \ man command returns with no information, a complaint that it can't find the\
    \ man page for date, or—worse yet—the dreaded command not found response, contact\
    \ your system administrator. You might be stuck on a machine with missing or broken\
    \ man pages, and your administrator can most likely fix it for you."
