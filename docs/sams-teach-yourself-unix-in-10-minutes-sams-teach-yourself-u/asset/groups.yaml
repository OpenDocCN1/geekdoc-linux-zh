    ## 第 17 课

    ### 打印


    *在本课中你将学习如何将打印请求（或作业）打印到网络上的打印机。*


    正如你可能预料的那样，UNIX 抽象了打印机的物理位置的概念，因此本地（直接连接）和远程打印机以相同的方式访问。


    UNIX 演变早期的一个分歧导致出现了两种不同的 UNIX 打印方法：lp 系统和 lpd 系统。lpd 是在 Berkeley 标准发行版（BSD）UNIX
    源代码基础上创建的，而 lp 是在 AT&T System V 源代码基础上创建的。不幸的是对用户而言，这些系统只是不同到足以让人困惑。从系统管理员的角度来看，lp
    似乎是专门为了让生活更困难而创建的。正因为如此，你会发现许多运行基于 System V 的操作系统版本的 UNIX 机器，其 lp 已被 BSD lpd 系统取代。


    ## 发送打印作业：lpr 或 lp


    在 UNIX 中，许多人可以同时打印。因此，当你向打印机发送打印请求时，它会被分配一个作业号。如果需要取消打印作业，该号码用于从打印队列中删除作业。只有 root
    用户或拥有打印作业的人才能将其从队列中删除。


    > **Postscript vs. Non-Postscript** 本课中假设你正在打印到 PostScript 打印机。然而，你的系统可能配置为使用光栅化器解释
    PostScript，并打印到非 PostScript 打印机。


    如果你很幸运，你的机器上可以使用 lpd 系统，你就可以使用 lpr 程序套件。如果你使用的是 lp 的机器，请注意指出 lp 差异的部分。


    lpr（行式打印机）命令是将数据发送到打印机的主要方法。lpr 基本上将数据直接转储到你指定的打印机。要使用 lpr，请按照以下步骤操作：


    - 1. 确定你想要使用的打印机名称。这可能由你的系统管理员设置。

    - 2. 选择你想要打印的文件。目前，只选择文本文件。你很快就会看到一些其它格式。

    - 3. 使用以下命令发送打印作业：lpr -P<printer name> <filename> <filename> .... 如果你的计算机上只配置了一台打印机，很可能你只需输入
    lpr <filename> <filename> ...


    > 小心... P 和打印机名称之间没有空格。


    例如，输入以下内容：


    ```

    >lpr -Phod samplefile.txt

    ```


    此命令的结果是文件 samplefile.txt 被发送到名为 hod 的打印机。根据打印机的负载，打印作业可能很快会被处理。


    > 打印多份 如果你需要打印一份文档的多个副本，你不需要发送单独的打印作业。相反，你可以将副本数量指定为 lpr 命令的选项。只需在 lpr 后跟 #-<number
    of copies> 即可打印作业中每个文件的该数量的副本。


    有一些文件格式和特殊打印情况可能需要打印命令特别注意。这种特别注意以过滤器的形式出现，过滤器应用于文件并将信息转换为打印机可以处理的格式。以下是一些过滤器：


    - **.ps** Postscript 文件。Postscript 文件将由 lpr 命令自动处理。你可以像打印纯文本文件一样打印它们。

    - **.dvi** Tex 文件。来自 tex 的文件包含特殊的页面布局指令。你可以使用 -d 选项与 lpr 一起正确打印这些文件。

    - **.tr** Troff 文件。这是手册页的标准文件格式。如果你想打印手册页，可以使用 -t 选项。

    - **Text files with really long lines** 如果你因行超出页面末尾而打印文本文件时遇到问题，可以即时重新格式化文件以使其适应。为此，使用
    -p 与 lpr。


    ![](img/2c005cbaad58c25c7f54da948131a75e_177_0.png)


    **系统怪癖** 系统配置时未安装前面提到的大多数过滤器并不罕见。你可以期望一个细心的系统管理员已配置你的系统以正确处理 postscript 和纯文本，但你可能会发现许多人已将剩余的处理留给你。在这种情况下，你必须找到并使用适当的软件将数据文件处理为
    postscript 或纯文本，然后将这些处理后的文件发送到 lpr 命令。


    ![](img/2c005cbaad58c25c7f54da948131a75e_177_1.png)


    **使用 lp 和 lpr** lp 命令的工作方式与 lpr 命令非常相似，但差异足以让熟悉 lpr 的用户感到烦恼。不是使用 -P 选项指定打印机，而是使用
    -d 选项。


    使用 -<number of copies> 而不是 -#<number of copies>。


    当你使用 lp 将作业发送到打印机时，它会给出如下消息：request id is <uniqname> #。记住这个 <uniqname> # 组合，因为如果你最终决定不希望它打印，这就是你需要知道的信息来删除作业。


    lp 系统本应通过自动处理文件类型的检测和适当的转换来让你的生活更轻松，而不是为特定类型的文件提供特定选项，然而，每种类型的打印机和每个安装都可能有不同的选项可用。希望你永远不需要知道这些特定于安装的选项，但如果需要，请查看本地文档以了解你的系统能做什么。


    ## 检查打印作业状态：lpq


    在你将作业发送到打印机后，你很可能想要能够检查它是否已完成打印，尤其是如果它是一个位于你建筑物另一层或完全在另一栋建筑中的网络打印机！要检查作业的状态，你需要查看你提交作业的打印机的队列。你可以使用
    lpq -p<printer name> 命令来执行此操作。再次，如果你的系统上只有一个打印机，你可能只需单独发出 lpq。


    例如，输入以下内容：


    ```

    >lpq -Phod

    ```


    | 排名 | 所有者 | 作业 | 文件 | 总大小 |

    |---|---|---|---|---|

    | 1st | agrove | 27 | test.txt | 19 bytes |

    | 2nd | jray | 28 | samplefile.txt | 10021 bytes |


    这个示例显示 hod 打印队列中目前有两个不同的作业。其中一个由 agrove 拥有，而用户 jray 拥有

    '
