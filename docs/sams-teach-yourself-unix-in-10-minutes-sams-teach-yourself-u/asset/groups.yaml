    # Lesson 12


    # INPUT AND OUTPUT


    ![](img/2c005cbaad58c25c7f54da948131a75e_136_0.png)


    *In this lesson you will learn how to manage UNIX process input and output and
    inter-process communication.*


    Now that you have learned a bit about working with UNIX and its filesystem and
    managing UNIX processes, it''s time to start putting things together and exploring
    some of the true power of UNIX. In this lesson, you''ll also learn about one of
    the fundamental tools which makes UNIX as useful as it is: inter-process communication
    by input and output redirection.


    At the heart of what makes UNIX so much more powerful than average desktop operating
    systems is the simple—but amazingly effective—way in which it abstracts process
    input and output. To paraphrase the model on which UNIX bases input and output,
    you can imagine that UNIX thinks of user input to a program as a stream—a stream
    of information. Output from the program back to the user can be thought of in
    the same way. Furthermore, if the input to the program from the user is a stream
    of information, why should the operating system care whether a user, a file, or
    even another program is providing this stream? When you understand the model of
    input and output as simply being streams of data, you can immediately see that,
    from the operating system''s point of view, the endpoints of these streams are
    immaterial. So long as the source of the input stream provides the information
    that the program needs, it does not matter where it comes from. Likewise, provided
    that the destination of the output stream "behaves like a user," the operating
    system has no reason to care where the output stream is actually going.


    How does UNIX make this model available to the user? By providing the concept
    of input and output redirection.'
  - '[PAGE 137]


    # REDIRECTION


    To accommodate the user in its streams-of-information-based view of the world,
    UNIX defines certain concepts to which programs must adhere. Specifically, UNIX
    defines several information connections for every program and enables the user
    to manipulate the source and destination of these connections.


    # STDIN


    The input connection for a program is called STDIN—standard input. A program can
    expect the incoming data stream from the user (or wherever) to appear at STDIN.


    When you interact with a command-line based program, the program is reading the
    data you are entering from STDIN. If you prefer not to enter the data by hand,
    you can put it in a file and redirect the file into the program''s STDIN.


    A program that you can use for an example is the spell program. The spell command
    finds misspellings. Given input on its STDIN, spell parses through it, checks
    the input against a dictionary, and returns any misspellings it finds. Issued
    from the command line, you might type the following:


    ```

    > spell

    Now is the tyem for all good kiwis to

    come to thie ayde of some very good UNIX users

    Ctrl+d

    ```


    Pressing Ctrl+d finishes the input, and spell gets to work, returning the following:


    ```

    tyem

    thie

    ayde

    ```


    Each of the misspelled words is displayed, just as you might expect—not a particularly
    useful program at first glance. The spell program, however, doesn''t care whether
    it was you typing the input or whether the input came from a file.'
  - '[PAGE 138]


    > **Working with spell** Actually, it''s more proper to think of the spell program
    as not caring whether the input comes from a file or from a user. The spell program
    was designed to work with input coming from a file or program; it just happens
    that because of the input/output model, it doesn''t mind if the input comes from
    a user instead. Many programs you''ll find on UNIX fall into the same category—they
    are designed to take input or provide output to or from other programs and files.
    Because it is only the input/output model that allows direct user interaction
    with the software, you might occasionally find the syntax with which some of these
    programs converse to be slightly odd. Just remember, they weren''t really designed
    to talk to users.


    Use your favorite text editor to create a two-line file containing the same text
    you typed previously, and then try spell by redirecting its STDIN. If you named
    your file reallydumbfile, you can run spell on it by typing the following:


    ```

    > spell < reallydumbfile

    tyem

    thie

    ayde

    ```


    The < character directs the contents of the file to its right into the STDIN of
    the command to the left.


    # STDOUT


    The output connection which UNIX provides for programs is called STDOUT—standard
    output. Just as you can redirect STDIN from a file, if you want to send the output
    of a command to a file you can redirect STDOUT. The > character directs the STDOUT
    of the program to its left into the contents of the file to its right. For example,
    if you like looking at the contents of your Web server logfile, and you want to
    put the last 30 lines'
  - '[PAGE 139]


    into a file named kiwis-logs so that you can edit them, you can use the following
    command:


    ```

    > tail -30 /usr/local/httpd/logs/access_log > kiwis-logs

    ```


    This example directs the shell to create the file kiwis-logs and to put the STDOUT
    from the tail command into it. If kiwis-logs already exists, the file is erased
    before the data is put into it.


    If for some reason you collect the end of the logfile periodically, you might
    want to have a complete archive of it. You can direct the shell to append the
    data to the file rather than having it clear the file first. To do this, issue
    the command as follows:


    ```

    > tail -30 /usr/local/httpd/logs/access_log >> kiwis-logs

    ```


    The >> character pair appends the STDOUT of the program to its left into the file
    to its right.


    Of course, you can combine these redirections; if you want to check your spelling
    and save the results in a file, you can return to your spell command by typing
    the following:


    ```

    > spell < reallydumbfile > reallydumbspellings

    ```


    # STDERR


    To make your life easier, UNIX actually has two different output streams of data
    that it defines for programs. The first, STDOUT, you have already learned about.
    The second, STDERR, is used to allow the program to provide error messages to
    the user. If the user is redirecting STDOUT and the program can only put errors
    on STDOUT, the user might never see the errors—they all go into the redirected
    file. Instead, programs can use STDERR for errors, and if the user has not redirected
    it they can still see error messages and warnings while STDOUT is headed into
    another file or program.


    If you want to put STDERR into the same file in which you''re storing STDOUT,
    use >& instead of > in the command; you can do so as follows:


    ```

    > spell < reallydumbfile >& reallydumbspelling

    ```'
  - '[PAGE 140]


    **Shell Variations** If you''re using another shell, be aware that redirection
    is one of the places where syntax varies significantly. Check the man pages for
    the shell of your preference to learn more.


    # PIPES


    Not only can UNIX redirect STDIN and STDOUT from and to files, but because these
    are data streams to UNIX it also provides the idea of piping these streams directly
    between different programs. With pipes you can use the STDOUT of one program directly
    as the STDIN of another.


    To create a pipe in UNIX, you simply use a | character between the programs on
    the command line.


    Again, using an example is so much more illustrative than a lot of words. Take
    the example of your compulsive collecting of your Web server log-files. If, instead
    of collecting them in files, you want to amuse and amaze all your friends by sending
    them the tail end of the file (using email is discussed in Lesson 18, "Accessing
    the Network Resources"), you can do so without saving it in a file by using the
    following command:


    ```

    > tail -30 /usr/local/httpd/logs/access_log | mail

    ```


    Thus far, your repertoire of UNIX commands probably isn''t large enough to make
    this a truly useful feature of you, but as you learn more about UNIX you will
    find it a powerful tool for simplifying your tasks.


    For now, one way in which you can make this feature work for you is by piping
    things into pagers. For example, if you want to be able to page through the output
    of the ls command, you can pipe it into more. Try typing the following:


    ```

    > ls -lRaF / | more

    ```


    You see a particularly long listing of files; if you don''t eventually press Ctrl+c
    to get out of this list, it can go on for days. Because this is really a complete
    recursive listing of your entire filesystem in long format, you''re not going
    to use this particular ls command too often. But any time you want to page through
    an ls listing—or any other program output that flows off your screen—you can pipe
    it into more.'
