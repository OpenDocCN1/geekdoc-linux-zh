  mdcn: "\n## 种类繁多的 Shell\n\n由于 UNIX 可用的 Shell 数量众多，大多数用户会尝试不同的 Shell，直到找到最喜欢的一个。你可能永远不需要更改你的\
    \ Shell，除非你打算编写一个 Shell。第 15 课，“User Utilities,” 讨论了你可以用来切换到不同 Shell 的技术。以下是其中几种可用\
    \ Shell 的简要概述，以及它们提供的优势：\n\n- **sh**—Bourne Shell，sh 是 Shell；它可在你可能使用的任何 UNIX\
    \ 发行版上使用，并提供简单的脚本语法。大多数人仅在编写必须在任何 UNIX 机器上运行的程序时才使用 sh Shell。\n- **csh**—C Shell。（是的，它发音像\
    \ seashell。）csh Shell 的名称取自 C 编程语言。csh 提供的脚本环境与 C 语言相似，并提供足够的灵活性来编写可在大多数 UNIX\
    \ 机器上运行的冗长、自定义脚本。\n- **tcsh**—扩展 C Shell。此 Shell 是 csh 的扩展版本，是大多数 UNIX 变体上 csh\
    \ 的非常流行的替代品。此 Shell 包括文件名补全和易于访问的命令历史记录。\n- **bash**—Bourne-again Shell。（UNIX\
    \ 程序员以具有奇怪的幽默感而闻名。）bash 是一种现代 Shell，主要受到 Linux 社区的关注，并作为大多数 Linux 机器的默认 Shell\
    \ 包含在内。此 Shell 具有与 csh 相同的功能，但为用户和程序员提供高级功能。bash 包括命令和文件名补全，以及在不同登录会话中保持持久的易于访问的命令历史记录。\n\
    \n可用的 Shell 远不止这些，但这四种很可能构成你会遇到的绝大部分。不要担心如果你坐在运行不同 Shell 的计算机前。你仍然可以使用本书获得的知识操作计算机。你可能会遇到脚本架构的一些变化，但你不会迷路。\n\
    \n## Shell 命令语法\n\n使用 Shell 与输入你想要使用的命令然后按回车一样简单。然而，有一些规则可能会有所帮助，如果你在使用命令时遇到困难：\n\
    \n- 命令区分大小写，通常为小写。与 Windows 不同，你不能混合大小写仍使功能正常工作；你必须完全按照系统上存储的方式输入命令。\n- 经常，当前目录不包含在\
    \ PATH 环境变量中，该变量指定了所有可以通过仅键入命令名称访问的命令目录。（你将在第 16 课，“Modifying the User Environment.”\
    \ 中了解如何修改此设置。）由于当前目录不一定包含在内，你可能在一个包含名为 parachute 的程序的目录中，但你会发现无法通过键入 parachute\
    \ 来运行该程序。为了运行命令，只需通过在前面加上 ./ 告诉系统 parachute 命令在你所在的同一目录中即可。因此，可以通过在目录内部键入 ./parachute\
    \ 来运行 parachute。\n\n> . 和 / 是怎么回事？这些字符代表当前目录 (.) 和目录分隔符 (/)。一起使用时，./ 本质上是你当前所在的目录的路径。\n\
    \n有些特殊符号、命令等可能会使你的 Shell 处于似乎无法使用的状态。这通常意味着你启动了一些期望从你那里获得输入的进程。有三个控制字符可以帮助你重新控制命令。要输入其中一个控制字符，请按住控制键同时按下相应的字母：\n\
    \n- Ctrl+d—告诉计算机你已完成向命令发送输入。如果不小心启动了程序且无法退出，这很有用。\n- Ctrl+c—UNIX 中断字符。这通常会终止当前正在运行的任何程序，然后返回到命令提示符。\n\
    - Ctrl+z—挂起当前进程。这会挂起你正在运行的进程并返回到命令提示符。注销会终止挂起的命令。\n\n不要害怕尝试书中讨论的命令，并探索系统以发现更多。你会惊讶于一点输入能完成什么。\n\
    \n## 摘要\n\n本课教授了你一些非常重要的技能，这些技能是你开始有效地使用 UNIX 计算机所需要的。虽然介绍的大多数概念相对简单，但它们对于理解 UNIX\
    \ 如何以及为何以这种方式运行很重要。\n\n- Login—登录 UNIX 使系统能够将你识别为用户并对你创建和修改的文件应用适当的拥有权。每个用户都有自己的环境，并且可以与其他用户同时运行程序。\n\
    - Logout—从计算机注销会关闭打开的文件并结束当前用户拥有的进程。使用完毕后务必注销系统。\n- The Command Line—UNIX 命令行使你能够通过串联各种内置命令来创建复杂功能。其他系统需要专用软件才能完成的事情通常可以使用内置\
    \ UNIX 实用程序完成。\n- Shells—你可以使用许多不同类型的 Shell。根据你作为程序员和用户的需求，你需要评估你认为必要的 Shell 功能，并做出适当选择。\n\
    - Using the Command Line—正如你所期望的，命令可以直接键入到 Shell 中。请记住命令通常为小写，如果命令未包含在 PATH 环境变量中，你可能需要指定命令的路径。\n\
    \n![](img/2c005cbaad58c25c7f54da948131a75e_27_0.png)\n\n## 第 2 课\n\n## UNIX 文档和查找帮助\n\
    \n*本课将向你展示如何使用几种方法查找有关 UNIX 内置命令和功能的信息。*\n\n如果你稍微探索过你的 UNIX 系统，你可能已经注意到你的计算机上有成千上万个不同的文件和应用程序。起初你可能会觉得有点不知所措，但操作系统的多样性和广泛功能正是其吸引力的一部分。如果你想做某事，你可以肯定\
    \ UNIX 有一个实用程序或实用程序组合可以完成工作。你脑中最大的问题可能就是，“How do I use this stuff?”\n\n## UNIX\
    \ 手册页\n\n虽然一些 UNIX 命令如果你在命令行上简单键入命令就会提供即时反馈和帮助信息，但这种帮助通常仅对只需要快速提醒的经验用户有用。另一方面，UNIX\
    \ 手册（man）页是获取有关如何使用系统上命令的完整信息的最快、最简单来源。它们提供有关程序做什么以及如何使用它们的信息，以及你可能感兴趣的其他相关实用程序的信息。如果你是程序员，man\
    \ 页还可以提供有用的编程信息。\n\n## man\n\n要显示手册页，请使用 man 命令。在最简单的形式中，你可以使用 man 后跟你想要查找的命令。\n\
    \n例如，要查找 date 命令的手册页：\n\n```\n>man date\n```\n\nDATE(1)\nDATE(1)\n\n### NAME\n\
    \ndate - print or set the system date and time\n\n### SYNOPSIS\n\n```\ndate [-u]\
    \ [-d datestr] [-s datestr] [--utc]\n[-universal] [--date=datestr] [--set=datestr]\n\
    [--help] [--version] [+FORMAT] [MMDDhhmm[CC]YY[.ss]]\n```\n\n### DESCRIPTION\n\
    \n本手册页记录了 GNU 版本的 date。\ndate with no arguments prints the current time and date\n\
    (in the format of the '%c' directive described below).\nIf given an argument that\
    \ starts with a '+', it prints\nthe current time and date in a format controlled\
    \ by\nthat argument, which has the same format as the format\nstring passed to\
