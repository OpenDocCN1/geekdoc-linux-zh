    X Windows provides facilities for programs to display windows, buttons, and other
    user-interactive widgets. It is actually implemented as a type of server program
    running on the computer. Client programs that want to make use of X Windows display
    functionality make requests to the server, asking it to perform certain display
    functions. It does not matter to either the client or server application whether
    they are running on the same machine or are separated by miles of network—the
    client makes display requests and the server tries to honor them.


