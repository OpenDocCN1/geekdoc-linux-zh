  mdcn: "\n### 根目录的威力\nUNIX 使用单词 root 来描述两个不同的概念。一个是 root 用户，即对机器上所有事务拥有绝对控制权的人。另一个是根目录，即机器上被视为文件系统顶部的那个单一特定目录。\n\
    \n你不需要关心驱动器在哪里。其他驱动器如果不是用字母或图标命名，会出现在什么地方？在 UNIX 中，它们只是作为位于文件系统任何位置的目录出现。奇怪吗？一点也不。UNIX\
    \ 完全将硬件和文件的物理位置的概念从用户的关注中移除。这可能需要一段时间才能习惯，但当你习惯后，你会发现用户根本没有必要担心文件物理上位于何处。如果你知道它的名称以及在文件系统中如何找到它，为什么还要担心它生活在哪个氧化金属块上（顺便说一下，硬盘就是由这种东西制成的）？如果你想想，你会发现这还有其他重要的好处。例如，如果你的系统管理员某天发现他已用完磁盘空间来安装新软件，他可以透明地重新排列磁盘和文件。他可以将某些超载目录中的所有内容移动到新磁盘上，并挂载新磁盘，使其出现在与旧目录相同的位置——而你永远不会察觉到差异。\n\
    \n### 挂载驱动器\n告知文件系统驱动器存在以及它将在哪个目录出现的过程。在大多数 UNIX 变体中，普通用户不能挂载驱动器。如果你碰巧在一台允许普通用户挂载驱动器的系统上，你需要联系你的系统管理员以了解你可以挂载哪些驱动器，以及如何挂载它们。\n\
    \n*事实上，你甚至不需要关心你的文件存放在什么状态下。这种抽象的另一个好处是，你的系统管理员可以使物理上位于远程机器上的文件、目录或驱动器透明地出现在你的机器的文件系统中。你在访问远程位置的文件时可能注意到的唯一区别可能是由于网络造成的轻微减速。这意味着什么？如果你的系统设置正确，无论你在哪里或坐在哪台机器前，无论你在主要办公室还是世界另一端，你的所有文件都出现在相同的位置，所有软件也都在你一直期望的位置。*\n\
    \n*即使你不在乎你的文件在哪里，你总是在某个地方。* UNIX 将用户环境的大部分概念基于用户“身处某个地方”，位于并在某个特定目录中工作。随着新图形桌面环境工具的出现，这变得不再是普遍概念，但在使用\
    \ UNIX 时仍然是一个值得记住的好主意。\n\n*UNIX 命令和文件名区分大小写。* 对于 Windows 和 Macintosh 用户来说，这可能相当令人惊讶：UNIX\
    \ 对你输入的内容的解释相当字面。MyFile 在纸面上看起来与 myfile 不相同，在 UNIX 中也不相同。务必注意你尝试使用的文件名或命令的大小写。信不信由你，Mail\
    \ 和 mail 是两个不同的命令，两者都可在许多 UNIX 变体上使用——而且它们做的事情不同！\n\n*文件有三个属性。* UNIX 对文件属性的想法非常简单——文件可以是可读或不可读、可写或不可写、可执行或不可执行。任何这些选项的组合都是可能的，尽管有些组合并不特别合理。一般来说，程序将是可读且可执行的，而数据文件将是可读的并且可能可写。然而，UNIX\
    \ 会照你说的做。例如，如果你告诉它某个数据文件是可执行的，它很乐意让你尝试运行你的 Rolodex 文件——这不太可能成功；如果你告诉它某个程序是可写的，它同样乐意让你编辑你的文字处理器——这很可能会使软件变得无用。\n\
    \n*一切都属于某人。* UNIX 文件系统中的每个文件和目录都携带着详细说明其所有者的信息。文件的拥有者可以允许或禁止其他用户或其他用户组访问该文件，并可以控制文件是否可执行、可读或可写。\n\
    \n现在你已经对你的命令将要与之交互的内容有了一些了解，你可以开始学习需要知道的内容以便四处移动。\n\n## 浏览文件系统\n处理 UNIX 文件系统的最基本命令是用于在目录之间移动以及查找其中文件内容的命令。在移动之前，了解你所在的位置是个好主意。\n\
    \n## 你在哪里？ pwd\npwd（当前工作目录）命令要求你的机器告诉你你当前所在的目录。只要你在运行命令行，它就在文件系统的某个位置——输入 pwd，它就会告诉你在哪里。\n\
    \n例如：\n```\n> pwd\n/priv/home/ray/public_html/\n```\n\n### 路径细节\n/priv/home/ray/public_html/\
    \ 是一个路径。路径最简单的解释是从根目录到当前文件或目录必须经过的最短目录集。路径中的每个目录都用 / 分隔。\n\n## 主目录\n对每个用户来说，有一个特定的目录是特殊的。这就是你的主目录。从浏览文件系统的角度来看，这个目录与任何其他目录相同；然而，它很重要，因为当你登录时，你最初就在这里。你可以期望在你的主目录中或其下方的任何内容都只属于你。为了让你的生活更轻松，UNIX\
    \ 不要求你记住主目录的路径。相反，它允许你简单地将主目录引用为 ~，并将任何其他人的主目录引用为 ~username。\n\n现在你知道了你在哪里，接下来你可能想知道与你在一起的文件是什么。\n\
    \n## 列出文件\n实际上，在 UNIX 中，你几乎可以在任何地方列出文件，除了你没有权限的地方（有关权限的更多信息请参见第 19 课“权限”）；不过，最容易列出文件的地方是“这里”——无论当前在哪里。\n\
    \n## LS\nls 命令列出文件。不带参数发出时，ls 列出当前目录（pwd 会告诉你的那个目录）中的文件和子目录。例如\n```\n> pwd\n/priv/home/ray/public_html/\n\
    > ls\ncgi_bin          test.html\nimages           vral\nindex.html\n```\n\n前面的示例显示你的当前目录路径是\
    \ /priv/home/ray/public_html，并且该目录包含五项。从这个列表中看不出来，但 cgi_bin、images 和 vral 是目录，而\
    \ index.html 和 test.html 是文件。\n\n### 涵盖基础\n在前面的示例中，你实际上并不需要发出 pwd 命令来使用 ls 命令。它是为了清晰起见而包含的。如果你已经知道自己在文件系统中的位置，就没有理由要求计算机重复告诉你。\n\
    \n如果你想列出当前目录以外的某个目录中的文件，例如根目录中的文件，你可以带目录选项发出 ls 命令：\n- 1. 确定你想要列出的目录的名称。\n- 2.\
    \ 按以下方式发出 ls 命令：ls <directory name>。\n\n如果你想列出根目录 / 的内容，你会输入：\n```\n> ls /\nCDROM\
    \          lib\nbin            priv\ncore           tmp\ndev            vmunix\n\
    etc            usr\ninclude        var\n```\n\n这里除了 vmunix，即 UNIX 核心的软件，以及 core，即应该真正扔掉的错误文件之外，其他都是目录。\n\
    \n### 文件名事实\n记住 UNIX 文件名，因而命令，也是区分大小写的。UNIX 将大写字母排在小写字母之前。这就是为什么 CDROM 会出现在 bin\
    \ 之前。\n\n如何判断它们是目录？使用 ls 选项要求它在列表中提供更多信息，特别是“long”选项。\n\n按以下方式发出命令：ls -l <directory\
    \ name>.\n```\n> ls -l /\n total 14\ndr-xr-xr-x 2 root 512 Jan 8 1995 CDROM\n\
    lrwxrwxr-x 1 root 7 Dec 7 1994 bin -> /usr/bin\n-r--r--r-- 1 root 8503728 Oct\
    \ 25 20:16 core\ndrwxr-xr-x 3 root 11264 Nov 7 13:02 dev\ndrwxr-xr-x 11 root 3072\
    \ Nov 7 13:01 etc\ndrwxr-xr-x 46 root 2560 Jan 11 1995 include\ndrwxr-xr-x 23\
    \ root 4096 Oct 13 16:29 lib\ndrwxr-xr-x 4 root 512 Jul 4 1997 priv\ndrwxrwxrwx\
    \ 3 root 512 Nov 24 00:30 tmp\n-rwxr-xr-x 1 root 1382769 Aug 12 12:57 vmunix\n\
    drwxr-xr-x 29 root 1024 Oct 27 17:53 usr\nlrwxrwxr-x 1 root 8 May 21 1995 var\
    \ -> /usr/var\n```\n"
