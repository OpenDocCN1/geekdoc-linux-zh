    \ long as you like. Your previous directory is waiting for you on the stack.\n\
    +   \n+   4. When you are finished and want to return to your previous directory,\
    \ issue the popd command as: popd.\n\nFor example:\n\n```\n> pwd\n/usr/local\n\
    > pushd /var/adm\n/var/adm /usr/local\n> pwd\n/var/adm\n...now you can work here\
    \ as long as you like.\n> popd\n/usr/local\n> pwd\n/usr/local\n```\n\nIf you'd\
    \ like to try this out on your system, and you've tried using the ls command to\
    \ list your root directory, you have a variety of directories to try. If the directory\
    \ /usr is present (and it almost universally is), you can try the pushd and popd\
    \ command out by using pushd /usr, browsing around, and then using popd to come\
    \ back to wherever you are now.\n\nYou now know almost everything about navigating\
    \ around the UNIX file system, but before going on to other topics there's one\
    \ additional variation that you need to be aware of.\n\n# RELATIVE AND ABSOLUTE\
    \ PATHS\n\nUp to this point, all paths you have been working with have been absolute\
    \ paths—that is, paths starting with the root directory and ending in a file or\
    \ directory name. In real life you would quickly find this annoying, so UNIX provides\
    \ the concept of a relative path as well. Relative paths are relative to the current\
    \ directory. With the addition of relative paths to your toolkit, if the current\
    \ directory is /usr/local/ and you want to be in the directory /usr/local/bin/,\
    \ you have the option of issuing two different cd commands. You can type either\
    \ cd /usr/local/bin or cd bin; either"
