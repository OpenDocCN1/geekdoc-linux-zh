    By this point you know how to find out where you are, what files are in what directories,
    and how to move around to different directories. Now it''s time to learn a few
    tricks.


    ## FILENAME EXPANSION IN SUPPORTED SHELLS


    Some shells (tcsh and bash being the most prevalent of these) support filename
    expansion. Essentially, this is a way of getting the shell to do some of your
    typing for you. If your shell supports filename expansion, you can use this feature
    by hitting the Tab key after typing the beginning—hopefully enough of the beginning
    to uniquely identify the file—of the filename or directory name. For example,
    if you want to edit a pre-existing file named mybigfile.dat which is located in
    your current directory, you might issue the command: `vi mybi<Tab>`. (vi is an
    editor which will be discussed in Lesson 8, "Text Editing.") If you have no other
    files that start with the characters "mybi" in the current directory, the shell
    automatically completes the filename for you. If you do have other files which
    start with "mybi," the shell beeps at you and you have to type more of the filename
    to make it unique before trying the Tab key again.


    Remember, all these techniques can be used together. If you''re working in /usr/local/bin,
    and suddenly remember that you forgot to edit some files in /usr/local/myincludes,
    you can get there with `pushd ./myin<Tab>`, and back again with `popd`.


    ## NAVIGATING THE FILE SYSTEM USING KDE


    If you find moving around the command line to be awkward, you''ll be happy to
    know that KDE provides a very user-friendly way to navigate the file system. Beating
    Windows 98 to the idea of a Web-based desktop, KDE''s file management system is
    also based on the philosophy that "Everything is a Web page." Each file manager
    window supports the full functionality of a normal Windows or MacOS window but
    is also a full-fledged Web browser. Breaking slightly from the double-click model
    that you''re undoubtedly used to, KDE only requires a single-click to perform
    its actions.


    ### SIMPLE KDE ACTIONS


    In KDE, files are represented with icons that usually indicate the file type.
    Directories are shown as folders. Double clicking a directory is similar to using
    cd to get to that directory from the command line; a new window will open up to
    display the contents of that directory. Figure 4.1 shows a KDE file manager window.


    ![](img/2c005cbaad58c25c7f54da948131a75e_62_0.png)


    > **Navigating Your Files** Notice that the file manager window displays the URL
    of the directory it is showing. Because each window is a Web browser, you can
    substitute a Web or FTP address into the URL field and KDE immediately takes you
    there—assuming you have an Internet connection, of course!


    As you''d expect, to move or copy files between locations you can simply drag
    files from one location to another. A pop-up menu appears at the end of the drag,
    asking if you''d like to copy or move the files. This is an example of a contextual
    menu, which appears when an action is performed within a certain context.


    To delete files, drag the files you want to erase to the Trash icon. Click on
    the icon with your right mouse button and choose Empty Trash Bin to complete the
    action.


    ![](img/2c005cbaad58c25c7f54da948131a75e_63_0.png)


    FIGURE 4.1 KDE looks and acts similar to other popular desktop environments.


    Use the following steps to create a new folder:


    - 1. Right-click in the location where you want the folder to appear.

    - 2. Choose New from the pop-up contextual menu.

    - 3. Select Folder from its submenu.


    > Getting Home If you need to get to your home directory in KDE, just look for
    the icon of a folder with a little house on it. Clicking on this icon opens a
    KDE file manager window showing your home directory.


    If you spend a few minutes playing around with KDE, you''ll find that its simplicity
    and elegance are on-par with commercial desktop operating systems. If you''ve
    previously worked with personal computers, you might find it a bit difficult to
    believe that in the world of UNIX, most of the truly great software is user written,
    community supported, based on open standards, and completely free! It scares the
    bejeezus out of the big OS manufacturers.


    There''s quite a bit to explore, so if you''re running a KDE system, take a few
    minutes to look around before you continue on to Lesson 5, "Finding Files."


    ## SUMMARY


    This lesson has given you the basic skills to work within the file system and
    a typical environment. If you have any problems with this material, please practice
    it before moving to the next lesson. Following is a review of some of this lesson''s
    specifics:


    - UNIX abstracts the physical location of the data. Don''t worry about where your
    data and software physically reside—if your system administrator is doing his
    or her job, it doesn''t matter.

    - UNIX is case-sensitive. Pay careful attention to case, especially if you''re
    transferring files between a UNIX machine and a personal computer.

    - UNIX files have attributes of readability, writeability, and executability.
    You can set the attributes of a file that you own such that you cannot execute
    it, cannot write it, and cannot read it. You do not want to do this.

    - The pwd command tells you where you are.

    - The ls command tells you what files are in a directory.

    - The cd command takes you places.

    - The pushd command remembers where you were and the popd command takes you back
    again.

    - Use relative paths when you can. If the directory is near your current directory,
    it''s usually much more convenient to use a relative path from your current directory
    than to use the absolute path from /.

    - Remember that all these features and commands work together. UNIX is about combining
    many small programs and features that do small parts of the job you need done
    into a convenient tool which performs precisely as you want it to.

    - Desktop environments can make your life easier— they automate some of the routine
    day-to-day tasks and provide a friendly face for some of the more difficult ones.
    If your system doesn''t have KDE, don''t fret—chances are that either KDE can
    be installed on it (if you''re nice enough to your system administrator), or it
    already comes with a nice desktop environment with comparable capabilities.


