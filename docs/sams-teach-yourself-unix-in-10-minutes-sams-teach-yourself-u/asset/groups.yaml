    ## LESSON 20

    ## PRIVILEGED COMMANDS


    ![](img/2c005cbaad58c25c7f54da948131a75e_202_0.png)


    *In this lesson you''ll take a look at some of the special commands that UNIX
    users seldom encounter.*


    The commands in this lesson are restricted to being run by the root user, but
    the information here will help you understand some of root''s concerns and help
    conversations with your system administrator to make a little more sense.


    Because of the way that UNIX works (with multiple users, multiple processes, and
    files owned by potentially hundreds of people), there are certain commands which
    will cause chaos if entrusted to normal users. These commands do things such as
    format disks, reboot the system, and create or remove devices.


    ## SINGLE USER MODE


    Every UNIX machine can be configured to boot into single user mode, a mode where
    the machine has no network resources and can only support a single user logged
    in. This is a maintenance mode that enables the root user to repair problems with
    the system without having to worry about other users changing things that they
    are working on. With some versions of UNIX, if a machine experiences a particularly
    hard crash, it might reboot itself into single user mode automatically. Some require
    a root password before any commands can be entered, and others come up directly
    into a root shell. If you happen to crash a UNIX machine and it comes up in single
    user mode, DO NOT TOUCH ANYTHING! Anything you do has the potential to make diagnosing
    the crash impossible; worse, it can have devastating effects on the system. For
    the root user, a single-keystroke typo in the rm command can delete the entire
    file system, from the top down.


    ### fsck


    Every now and then you might hear a system administrator grumbling about having
    to fsck a drive. UNIX tends to take reasonably good care of its drives, but problems
    do occasionally crop up. The fsck command is UNIX''s disk fixer program, and it
    is used to clean up problems caused by crashes or errant pieces of software. Most
    UNIX systems fsck their drives on bootup, and the expected result is an analysis
    report containing the number of files and the fragmentation level of the drive.
    If you''re watching a UNIX machine boot, do not be overly concerned if you see
    fsck report problems—UNIX automatically attempts to fix them. In most cases it
    will be successful, and after using fsck on the drives the system restarts the
    reboot process. If the drives have serious problems, the automatic fsck exits
    with the following error message: Run fsck by hand. If it does, don''t touch anything—go
    find a system administrator.


    ### mount/umount


    The mount command tells the system to attach a disk drive to the file system at
    a particular directory. As discussed in Lesson 4, "The File System," UNIX abstracts
    the physical hardware by causing drives to appear as directories in the file system.
    This command tells the system how to access the drive or where to locate it on
    the network, and where to attach it to the file system. The umount command does
    exactly the opposite—it removes mounted devices.


    If you log into the system and are greeted by a message that says something similar
    to No Home Directory - using /, don''t panic. In all likelihood your home directory
    is fine—it''s just on a drive that is not mounted. This doesn''t happen often,
    but with drives and resources being shared over the network, it only takes one
    person tripping over a network patch cable to make some devices unavailable until
    the wire can be repaired.


    If you get the previously mentioned error, or are simply kicked right back off
    the system after entering your password (as happens with some systems), wait 15
    minutes and try again before calling your system administrator. Chances are, they
    already know about the problem and are trying to fix it, but dozens of users calling
    to complain is slowing them down.


    ### shutdown/reboot


    Although personal computers are becoming increasingly picky about being shut-down
    instead of simply turned off, UNIX machines are still more picky. The difference,
    of course, goes back to the fact that UNIX uses dozens of cooperating programs
    to form what appears as the operating system. Each of these programs might be
    in the process of modifying, moving, creating, or deleting files at any point
    in time. If you simply shut off the power to a UNIX machine, you interrupt all
    these processes, and probably destroy any files they were working on at the time.
    If the files are simply things such as word processor documents, this is only
    a minor problem. Unfortunately, UNIX also moves around and updates files critical
    to the operating system. Simply shutting off the power to a UNIX machine has the
    potential to completely corrupt the drives, leaving the system unusable—in short,
    don''t do it.


    To prevent this problem, UNIX has a shutdown command and a reboot command, each
    with obvious goals. These two commands gracefully exit all running software, write
    out disk-cache information to the drives, and complete their respective tasks.
    They are restricted to the root user for obvious reasons, yet some UNIX hardware
    manufacturers have started putting soft-power switches on their machines. The
    soft-power switches don''t actually turn the machine off: they execute the shutdown
    command, as root, without requiring a password. In the eyes of most system administrators,
    this is simply bad business. If your machine has one of these soft-power switches,
    please don''t use it. Other users might be using your machine, or your machine
    might be providing disk resources to other machines. Shutting it down is likely
    to create havoc on your local network and earn you a high position on your system
    administrator''s list of least favorite users.


    ### chown


    The chown command is used to change the owner of a file from one account to another.
    Obviously, a normal user can''t use this command, but if you need this done, your
    system administrator can do it for you. Remember, you can always get a copy of
    a file that you can read by using the cp command—changing ownership might not
    be necessary.


    ## KEEPING YOUR SYSTEM ADMINISTRATOR HAPPY


    UNIX is a very literal operating system, and does more or less exactly what you
    tell it to do. If you end up doing something that damages your own account and
    need your system administrator to restore your account from a backup, expect him
    or her to be less than pleased. If you do something that causes a breach of network
    security or damages files belonging to other users on the system, expect him or
    her to turn into a fire-breathing ogre.


    You''re dealing with a class of professionals who have a very difficult job, and
    who have to balance the rigors of dealing with mind-warping technical problems,
    the composite needs of an entire user community, and the needs of individual users.


    Most system administrators have the very best intentions and wishes for the user
    base they support, but they also are under severe time pressure. There are problem
    patches and security fixes that appear and need to be applied to the operating
    system on an almost daily basis—failure to apply any one can leave your system
    vulnerable to crashes or outside attack. There are the constant pressures from
    users who "absolutely need" to have something installed, or who just deleted the
    programming project that they have to demo next week. And, there are users who
    just need a hand understanding how something works.


    Rarely do system administrators hear from users when things are going well, so
    it''s not uncommon for them to become a bit user-shy. All these things add up
    to a workload that causes many system administrators to burn out in a very short
    period of time.


    If your system administrator does a good job for you, keep the work that they
    do and what it means to you in mind when dealing with them. Saying "Thank you"
    every now and then can go a long way toward taming the fire breathing ogre, and
    rumor has it that Orange Crush or Mountain Dew and Pizza help, too.

