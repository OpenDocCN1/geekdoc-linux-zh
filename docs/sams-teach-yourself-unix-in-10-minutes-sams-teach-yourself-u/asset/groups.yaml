  mdcn: "\n以前使用过带鼠标的计算机。 然而，其中一些即使对熟悉 Macintosh 和 MS-Windows 环境的用户来说也可能很新。 需要记住的重要事项如下：\n\
    \n- **X 针对三键鼠标设计**——大多数 X 软件使用左键进行指向、点击和选择。 X 使用中间键进行通用功能，如移动或调整窗口大小，以及右键进行应用程序特定功能，如打开应用程序内弹出菜单。\
    \ 当然，任何应用程序都可能修改这些用法，因此查阅文档始终是合适的。\n- **X 具有焦点输入的概念**——在 Macintosh 或 MS-Windows\
    \ 平台上，如果你在键盘上输入，你通常期望输入出现在任何活动窗口或对话框中——在 X Windows 中并非如此。 在 X 中，窗口管理器可以选择将你的输入焦点设置在任何它选择的位置。\
    \ 大多数窗口管理器可以配置为将输入焦点放在最前面的窗口上，将输入焦点放在选定的窗口上（X 不必是最前面的窗口），或将输入焦点放在光标所在的窗口上。 最后一个选项，虽然与你可能熟悉的界面不同，通常被认为是最强大的。\
    \ 将窗口管理器配置为焦点跟随光标时，你可以通过简单地将光标移动到大部分隐藏窗口的任何可见部分然后输入，来将输入定向到一个大部分隐藏的窗口——例如启动一个非交互式程序。\
    \ 无需浪费时间将该窗口带到前面，输入命令，然后再将窗口移回你真正想要工作的窗口下方。\n\n![](img/2c005cbaad58c25c7f54da948131a75e_40_0.png)\n\
    \n> **如果你的输入消失了** 如果你在输入并且注意到输入的内容没有出现在你认为应该出现的地方，很可能你的输入焦点在另一个窗口中。 检查以确保你的光标在正确的位置，或者——如果你的系统配置为点击聚焦——确保你已点击了你打算输入的位置。\
    \ 在使用不同输入焦点方法的平台之间切换时，很容易感到困惑。\n\n在 X 中，窗口管理器或任何其他程序都可以将任意命令附加到任意用户操作。 例如，程序可以在用户右键单击标题栏时附加显示菜单的操作。\
    \ 窗口管理器可以在用户在窗口系统的空白背景中左键、右键或中键单击时弹出各种菜单；或者也可以在用户按住 shift 键同时左键、右键或中键单击时发生——可能性无穷无尽。\
    \ 一个流行的终端程序 xterm 在用户按住控制键并在窗口中左键、右键或中键单击时会弹出其配置菜单。 一些窗口管理器会为每个应用程序的标题栏附加一个包含关闭和调整大小等常用命令的标准菜单。\
    \ 其他窗口管理器则将这些功能附加到标题栏中的弹出菜单或按钮。 即使在同一 UNIX 版本的不同安装中，你也会发现程序行为的差异。 本地配置选项会对界面产生显著影响。\
    \ 找到任何特定选项或命令的最佳建议是阅读可用文档并询问其他本地用户。\n\n大多数窗口管理器可以使窗口图标化。 由于客户端程序窗口的实际显示并非由客户端处理，X\
    \ 服务器和窗口管理器可以为用户体验做出一些有用的贡献。 其中一个贡献是，当客户端请求具有特定特征的窗口时，服务器不必以这种方式向用户表示该窗口——它只需要像具有这些特征一样对待它即可。\
    \ 这使得服务器可以例如任意缩放窗口，或将其缩小并作为图标处理。 如果你熟悉任务栏或应用程序 Dock 的概念，可以将图标化窗口视为已最小化的窗口，但你可以将其存储在屏幕的任何位置。\n\
    \n## 配置 X Windows\n\n大多数 X Windows 的配置由服务器资源数据库处理。 当客户端向服务器发出请求时，服务器会检查此数据库以确定该客户端的用户偏好。\
    \ 服务器资源数据库按用户加载，通过命令 xrb 加载，该命令需要在启动 X11 后自动执行。 xrb 从通常命名为 .X11defaults 的点文件加载配置信息。\
    \ （点文件在第 16 课“修改用户环境”中讨论。） .X11defaults 通常包含类似以下的行：\n\n```\nxbiff*onceOnly:\t\t\
    \ on\nxbiff*_wm_option.autoRaise:\t off\nxbiff*mailBox:\t\t /usr/spool/mail/mymail\n\
    ```\n\n如果你在 .X11defaults 文件中包含这些行，你就是在告诉你的 X 服务器，如果 xbiff 启动（一个在你有新邮件时通知你的 X11\
    \ 程序），它需要设置某些选项：\n\n- 第 1 行 — 设置 xbiff 特定的选项，关于响铃通知你的频率。\n- 第 2 行 — 设置关于窗口管理器对\
    \ xbiff 处理的选项——它特别告诉窗口管理器，如果 xbiff 在需要通知你时位于其他窗口之后，不要将其带到前面。 （请记住，X11 提供显示，而单独的程序提供诸如窗口控件等的管理。）\n\
    - 第 3 行 — 告诉 xbiff 应该查找的邮箱的位置。\n\n由于每个客户端支持不同的选项并且允许窗口管理器有不同程度的控制，你需要查阅每个客户端的文档以了解你可以配置的内容以及如何配置它。\n\
    \n除了服务器资源数据库之外，客户端经常具有命令行选项，可以控制客户端与 X11 的交互。 看看以下命令：\n\n```\n> xterm -fg \"black\"\
    \ -bg \"white\" -fn 6x10 -geometry 85x30+525+1\n```\n\n这启动了一个 xterm 会话，其配置如下：前景色为黑色，背景色为白色（白底黑字），字体为\
    \ 6x10 点。 它还设置了几何信息，使得窗口宽 85 个字符，高 30 个字符，并放置在屏幕左边缘 525 像素处，从顶部向下 1 像素处。\n\n同样，不同的程序有不同的可用选项，你的本地文档是你获取有关确切配置的最新信息的最佳来源。\n\
    \n## 窗口管理器\n\n由于 X Windows 仅提供基础的用户界面组件显示功能，需要一个额外的程序来提供有用的用户界面。 该程序是窗口管理器。 根据你运行的\
