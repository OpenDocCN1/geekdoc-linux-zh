    URL 中指定文件名时会默认提供一个名为 index.html 的文件。如果你希望默认显示一个页面，但又不想将其命名为 index.html，你只需为实际文件创建一个链接并命名为
    index.html，服务器永远不会知道其中的区别。


    ## 摘要


    本课中你学习了一组命令，可用它们以任何你想要的方式管理和整理文件。


    非常重要的一点是记住，当你向 UNIX 命令提供文件名作为参数时，文件名可以是文件的相对路径或绝对路径。如果你只给出文件名，则指定的是当前目录中的文件。如果你给出文件的部分路径（如
    ../<filename>，或 <directoryname>/<filename>），则指定的是相对路径。最后，你始终可以给出从 / 目录到文件的绝对路径。以下是本课的快速回顾：


    - The touch 命令将文件的修改日期设置为当前时间。这相当于在需要时创建新的空文件。

    - The rm 命令删除文件。在你相当确定自己知道自己在做什么之前，使用 rm -i 选项，然后再继续使用一段时间。非交互模式下运行的递归 rm 可能擦除你的整个磁盘。

    - The cp 命令复制一个或多个文件。虽然有点过度简化，但最容易记住的是：如果从单个文件开始，目标需要是单个文件；如果从多个文件开始，目标必须是能够容纳多个文件的东西（如目录）。你也可以将单个文件复制到目录中。

    - The mv 命令的工作方式与 cp 非常相似，只是它重命名或移动文件。mv 命令无法跨物理硬件边界移动目录，因此有时 UNIX 的硬件抽象会因此命令而失效。如果发生这种情况，请寻求
    cp 命令的帮助。

    - The ln 命令创建可用于访问文件或目录的替代名称。当你需要某物出现在多个不同位置时，或当你需要使来自不同文件在不同时间的信息都显示为相同的名称时，这很方便。


    ![](img/2c005cbaad58c25c7f54da948131a75e_87_0.png)


    ## 第 7 课


    ### 读取文件


    *在本课中你将学习几个实用程序，它们使你能够查看文本文件的部分内容或全部内容。*


    你的 UNIX 机器可用于数百种应用；无论用途如何，你都需要知道如何完成一个非常简单的任务：读取文件。大多数 UNIX 应用使用简单的基于文本的配置文件，附带基于文本的说明文件，并存储基于文本的日志文件。毫无疑问，你会想要利用这些信息。除了加载文本编辑器或文字处理器之外，你还能怎样做到这一点？本课通过展示几个快速而粗糙的命令来回答这个问题，这些命令使你能够查看计算机上所有文件的内容。


    ### 拼接文件：cat


    查看文件最简单的方法是使用 cat，即拼接命令。这可能看起来有点奇怪，因为拼接通常指的是将某物添加到另一物上的过程。cat 确实就是这样做的——它将你提供的所有数据拼接起来然后交还给你。如果向命令提供多个文件名会怎样？它会一个接一个地显示所有被给定名称的文件的内容。你可以将
    cat 与重定向操作符一起使用（你将在第 12 课“输入和输出”中学习这些操作符）来创建一个包含多个其他文件内容的文件。不过现在，你将使用 cat 来显示文件。


    要显示文件，只需将你想要显示的文件或文件作为参数提供给 cat 即可。


    例如，假设你有两个文件，一个名为 kiwi.txt，包含文本“Kiwis are small, brown, and fuzzy,”，另一个文件名为 food.txt，包含“They
    are good to eat.”。让我们看看使用 cat 它们时会发生什么。


    ```

    >cat kiwi.txt food.txt

    ```


    Kiwis are small, brown, and fuzzy.

    They are good to eat.


    The contents of the two files are displayed on the screen, one after the other.
    Pretty easy, huh? The biggest problem you''ll have with cat is that files scroll
    off the screen if they are too large—but you''re about to learn a way around that.


    > **UNIX 快捷方式** 如果你想显示目录中所有以 .txt 结尾的文件，你可以使用本课讨论的任何命令配合通配符。命令 `cat *.txt` 会显示当前目录下所有以
    .txt 结尾的内容。


    ### 一页一页查看：分页器


    cat 命令在你只是想快速显示一些信息时很好——但对于滚动速度过快而难以阅读的大文件怎么办？幸运的是，有一些实用程序专门用于从命令行读取文件：more，以及更新且更强大的
    less。它们通常被称为分页器，因为它们一次一页地将文件显示到你的窗口或屏幕上。


    ### 无处不在的分页器：more


    像 cat 一样，使用 more 只需输入命令，后跟你想要显示的文件或文件即可。


    例如，输入


    ```

    >more longfile.txt

    ```


    这会使用 more 显示文件 longfile.txt。展示该命令的输出是浪费空间，因为结果只是文件的内容，一次一页地显示。相反，下面是一些你可以在 more
    内部使用的命令来控制过程：


    - Spacebar—Advances the output to the next page.

    - q—Quits out of the more program, exiting to the command line.

    - s—Skips forward one line in the file. Use this to slowly advance through the
    file.

    - f—Skips an entire page in the file.

    - /<pattern>—Search and jump to a pattern or word in the file.

    - ? or h—Displays help for the more command. Because you can use this while viewing
    a file, it''s probably the most important one to remember.


    more 可能在你使用的任何 UNIX 计算机上都可用。如果你幸运的话，你的系统可能包含——或你的系统支持人员可能足够好心安装了——less。信不信由你，less
    比 more 更强大。


    ### 更强大的分页器：less


    Less 提供了一个重要功能，而 more 的某些版本缺乏该功能——能够在文件中向后移动。再一次，调用 less 与使用 cat 和 more 相同。只需将你想要查看的文件作为参数提供给命令即可。


    例如


    ```

    >less longfile.txt

    ```


    与 more 一样，less 一次一页地显示 longfile.txt。从 less 控制输出与 more 非常相似。有几个命令可以让你在 less 中移动：


    - Spacebar—Advances the output to the next page.

    - b—Backs up one page.

    - q—Quits out of the less program, exiting to the command line.

    - Up arrow (or k)—Scroll up one line.

    - Down arrow (or j)—Scroll down one line.

    - /<pattern>—Search forward and jump to a pattern or word in the file.

    - ?<pattern>—Search backwards and jump to a pattern or word in the file.

    - h—Displays help for the less command.


    请记住，这并不是 more 和 less 支持的所有选项的全面列表。事实上，如果这本书要包含你可以用 less 使用的所有选项，它可能要占用 20 页。这里包含的内容旨在为你入门提供足够的信息。


    ### 查看文件的一部分


    有些情况下，你只对文件顶部或底部存储的内容感兴趣。虽然乍听起来可能很奇怪，但如果你花很多时间使用 UNIX，你会发现这些是非常有用的技巧。假设你有一个目录，里面充满了保存的电子邮件或新闻组消息。与其完整显示每条消息，你可能只想查看消息的头部，其中包含主题和发件人地址。要做到这一点，使用
    head 命令来显示文件的开头。同样，如果你正在运行 Web 服务器并想查看最近访问你网站的几个人，你可以使用 tail 来查看日志文件的末尾。


    ### 查看开头：head


    你可能会注意到我们所看过的所有程序之间有一个共同点。要运行它们，只需提供命令，后跟你想要查看的文件或文件即可。head 也是如此。默认情况下，head 显示你指定的每个文件的前十行。


    例如


    ```

    >head news112.msg

    From ksteinmetz@nwu.edu Mon Mar 4 13:11:12 PST 1998

    Article: 28223 of comp.sys.next.sysadmin

    Path: magnus.acs.ohio-state.edu!math.ohio-state.edu!

    →newsfeed.acns.nwu.edu!news.acns.nwu.edu!news

    From: ksteinmetz@nwu.edu (Kimberly A. Steinmetz)

    Newsgroups: comp.sys.next.sysadmin


