    # THE KDE HELP SYSTEM


    If you are using KDE for most of your day-to-day work, you''ll be glad to know
    that KDE has its own built-in HTML help system that is extremely well-integrated
    into the KDE environment.


    > Tips of All Sorts If you don''t want to use the full-blown help system, KDE''s
    ToolTips might help you. ToolTips are quick little blips of information that are
    displayed when you pass your cursor over an icon or menu selection. Not all applications
    support ToolTips, but if you don''t know what something does, pass your cursor
    over it, wait a few seconds, and see if a ToolTip appears.


    Each application has its own help menu that is laid out according to the KDE specification,
    which maintains consistency across all KDE applications.


    To access the help viewer from within an application, simply select Contents from
    the Help menu. Figure 2.1 shows the help available from within Karm, the KDE personal
    information manager.


    The KDE help viewer is a full-fledged HTML viewer. You can navigate through the
    help files by clicking on the links, as you do in any Web browser.


    > Tip Trick up Your Sleeve Because the KDE help and file browser is really just
    an HTML browser, you can use the KDE browser to view any of the other UNIX HTML
    documentation. Type the URL to the file you want to view into the top of the browser
    window and press enter.'
