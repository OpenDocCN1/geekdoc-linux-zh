- pgno: 166
  md: '# LESSON 16


    # MODIFYING THE USER ENVIRONMENT


    ![](img/2c005cbaad58c25c7f54da948131a75e_166_0.png)


    *In this lesson you''ll learn about the tools you need to use to modify your environment
    and the way that some commands work for you.*


    There is a vast number of programs that all work together to create the UNIX user
    experience. It''s because of this that you''ll need to learn to use the tools
    from this section in conjunction with the documentation for your programs to make
    the modifications you desire.


    > Shell Assumption This lesson is going to assume that you''re using csh or tcsh
    as your shell. If you are using a different shell, some of the syntax needs to
    be changed, but the ideas remain the same.


    # ALIASES


    One of the most useful features that shells provide to the user is the capability
    to create command aliases. Aliases are, quite simply, aliases. If, for example,
    you''re a long-time DOS user, you might find yourself typing del instead of rm
    to delete files. Want to change this? Just set an alias with the alias command.
    The syntax is as follows: `alias <newname> <command to run>`. If you actually
    want to make that alias for del, type the following: `alias del rm`. After setting
    this alias, any time you type del, it executes the command rm.


    More useful than simply renaming commands, you can use the alias command to create
    meta commands that enforce certain options. For example, it''s always a good idea
    to force rm to be in interactive mode'
  merge: -1
  img_proc: true
- pgno: 167
  md: '(rm -i). To do this with an alias, you can type the following: alias rm ''rm
    -i''. (Note the direction of the single quotes.) Now, whenever you type rm it
    actually executes rm -i instead.


    If you want to get really sophisticated with aliases, you can even build little
    multi-command scripts inside aliases. For example, consider the situation where
    you want to access two different news servers from your account. In this case,
    perhaps it''s a public server for regular Usenet News newsgroups, and a corporate
    server for internal news. The trn and rn commands only understand one news server
    at a time, and worse, save the "What I have read" information in a file with a
    fixed name. What to do? Use the alias command to automate things for you. The
    following two aliases will solve your problem:


    ```

    > alias readcorporate ''setenv NNTP SERVER

    =server.big.company.com;''

    cp -/.corp-newsrc ~/.newsrc;\

    trn; cp -/.newsrc ~/.corp-newsrc''


    > alias readpublic ''setenv NNTP SERVER

    =public.newstand.com;''

    cp -/.public-newsrc ~/.newsrc;\

    trn; cp -/.newsrc ~/.public-newsrc''

    ```


    What do they do? Following is an explanation:


    +   - The first line of each sets an environment variable which tells trn where
    to look to get its news. There is more on this in the next section.

    +   - The second line of each copies a setting file to the file .newsrc in your
    home directory. The trn command uses the file .newsrc to keep track of what news
    you''ve read and what is new news. If you''re using two different servers with
    two different sets of newsgroups, you unfortunately can''t use the same .newsrc
    file, so you''ll keep two of them around and let alias copy the correct one for
    you when you need it.

    +   - The third line is self-explanatory. The trn command reads Usenet newsgroups.
    There is a little more on this in Lesson 18, "Accessing the Network Resources."'
  merge: -1
  img_proc: true
- pgno: 168
  md: '+   - The fourth line might be a bit of a mystery at first, but it''s really
    quite simple as well. Because the trn command updates the .newsrc file with information
    on what you''ve just read, you want to preserve the file for the next time you
    read news; so, you copy it back to its holding location.


    Now all you have to do to read your news from your corporate news server server.big.company.com
    is type readcorporate, and to read your public Usenet newsgroups you just type
    readpublic.


    # ENVIRONMENT VARIABLES


    As mentioned much earlier in this book, most of the software you use, and the
    interface you work in when using UNIX, is configured with seemingly cryptic text
    files. Other pieces of software are configured by special shell variables called
    Environment Variables. (Remember shell variables from Lesson 14, "Basic Shell
    Scripting.")


    Environment Variables are used by programs to pick up specific pieces of information
    that are needed to run. For example, you might run across programs that want an
    environment variable that contains the path to their help-file information. Others
    use Environment Variables to contain custom settings for things such as window
    size or placement preferences. In the preceding aliases section, you might have
    noticed a program that wanted an Environment Variable set to tell it what Internet
    host to contact.


    Environment variables aren''t set using quite the same syntax as regular shell
    variables, so instead of using set <variablename>=<value>, use the following syntax:


    ```

    setenv <variablename> <value>.

    ```


    Consider the situation where you have a program that says to set the Environment
    Variable HELPFILE_LOC to the directory containing its help information. Unless
    this variable is set, it can''t find the information it needs and it won''t work
    properly. If you''ve found that the help file is located in the directory /usr/local/helpstuff,
    you can set the variable you need by using the following command:


    ```

    > setenv HELPFILE_LOC /usr/local/helpstuff

    ```'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'The number of programs that use Environment Variables for configuration information
    is quite large, but the format is always the same. All you need to do is find
    out what variable needs to be set, and then set it to the correct value.


    ![](img/2c005cbaad58c25c7f54da948131a75e_169_0.png)


    > Using printenv If you want to see the Environment Variables that are already
    set in your shell, you can use the printenv command.


    If you''re running X Windows and trying to display on a different machine than
    the one on which you''re running the client, you might have to set the DISPLAY
    variable as follows: `setenv DISPLAY <machinename>:0.0`


    If you''ve run a program and it exits with a complaint such as ld.so not found,
    you might have to set the LD_LIBRARY_PATH with a command such as `setenv LD_LIBRARY_PATH
    /usr/local/lib`.


    The possibilities really are endless—thankfully, making the settings is a relatively
    painless process. Just remember that the settings you make in one shell do not
    affect other shells. You can have the same Environment Variable set to different
    values in different shells you''re running simultaneously if you need to access
    more than one configuration at a time.


    # PATHS


    Another special shell variable is the path variable. It tells the shell where
    to look for programs that you want to execute. Remember how long the find command
    took to find things for you (refer to Lesson 5, "Finding Files")? Because you
    don''t want it to take that long every time you try to execute a program, you
    don''t want the system to have to search through everything on your machine to
    find a program. Instead, the shell keeps a short list of where to look for programs
    and it only searches these locations.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# Shells and Executable Files


    Technically, it doesn’t even search these locations when you try to execute a
    program. The shell actually keeps a catalog of all the executable files found
    in these locations. If a new executable appears in one of these locations while
    you’re logged in, your shells won’t know about it until you execute the rehash
    command, which asks the shell to go back and rebuild the catalog.


    You might notice that if you have a copy of a program in your current directory,
    in some cases typing the filename results in a command not found error. This is
    because it’s common for the path variable to lack the current directory. You can
    either execute programs in the current directory by typing ./<programname> or
    by adding the current directory to your path.


    # Working with Paths


    The current directory is usually left out of the path because including it is
    a bit of a security risk. If the current directory is in your path, you can potentially
    be fooled into executing arbitrary programs by naming them as common UNIX commands
    and sneaking them into your directories. If you want to put the current directory
    in your path, always put it at the end of the path. That way normal UNIX commands
    will be found before any Trojan horses that might have made their way into your
    system.


    If you want to see what your current path is, you can do so by using echo $path.
    If it’s missing some paths you need, for instance the current directory and /usr/local/bin,
    you can add these by using the following command:


    ```

    set path=( $path /usr/local/bin . )

    ```'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# User Defaults: The Dot Files


    Your account configures certain features for you automatically when you log in
    and when you start shells. Programs other than the shell also occasionally use
    dot files to hold configuration information. Dot files are, literally, files with
    names starting with the . character, and you''re likely to find an abundance already
    populating your home directory. Some common files follow:


    +   - **.login and .logout**—As you might guess, files which are executed when
    you log in, and when you log out, respectively. If you look in these files you
    will find that they are shell scripts which use commands with which you are already
    familiar. The .login script is typically used for things such as swapping in various
    sets of configuration files if you want to set up multiple different environments
    for yourself, and for doing other things that need to be handled automatically
    at login. The .logout script is used much less frequently, but it can contain
    useful things that you need to do at logout time. What sort of use can you make
    of the .login and .logout files? How about adding commands which echo the date
    and time information into a file whenever you log in and log out. If you''ve ever
    had to fill out a timesheet, you''ll find that one appealing.

    +   - **.cshrc or .profile**—Shell scripts that are executed when you open a shell.
    Shells have their own scripts which execute at startup. Check with your shell''s
    documentation on this. Again, you are familiar with the syntax. In this file,
    you can include commands that do things such as add custom paths to your environment,
    set Environment Variables, and set up any aliases you might be interested in.

    +   - **.plan**—A file that contains information that your system sends back to
    anyone who fingers you. Users typically use their .plan file to contain contact
    information, favorite quotes, and anecdotes that they consider amusing. Put things
    in your plan that you want people to see when they try to look you up from remote.
    After you''ve put something in your .plan file, give the finger command a try
    and see how your new information looks.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '+   - .X11defaults or .Xdefaults—This file contains settings that are used
    by the server resource database. The syntax of this file was covered briefly in
    Lesson 3, "The Graphical User Interface." In general, you won’t need to modify
    this file, but it is here that you can configure many options regarding how the
    X server treats various programs and how various X11 programs work. If you choose
    to poke around in it, be sure to make a backup copy first, in case you have to
    put it back. After you have made a backup, though, don’t be afraid to make modifications.
    The syntax is straightforward, and if you’ve survived this far, you can probably
    figure out how to make most of the modifications that you might want to try.


    You’ll undoubtedly find that you have other dot files in your directories as well.
    Don’t be afraid to look in them. You’ll find most to be more readable than you
    might think. Although it might be a bit intimidating at first, a large part of
    making UNIX work for you is customizing your environment by modifying these files.
    Make backups first, but don’t be afraid to experiment—it’s half the joy of using
    UNIX!


    # FIXING BROKEN TERMINALS: stty


    On occasion, you might find yourself in a command-line window that seems to have
    gone slightly nuts. The Delete key produces ‘?’, the Backspace key makes a ‘^H’,
    and Ctrl-c shows ‘^C. If this happens to you, you need to reset the terminal parameters
    for erase and interrupt. To do this, enter the two following commands:


    ```

    > stty erase Delete

    > stty intr Ctrl+c

    ```


    ![](img/2c005cbaad58c25c7f54da948131a75e_172_0.png)


    > Using stty To make your life easier, some versions of stty now support assignment
    by using the carat notation for the control characters. Instead of actually having
    to type Ctrl+c in the preceding stty intr example, you might be able to type stty
    intr ^C.'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'You can also use stty erase Backspace if your keyboard layout makes Backspace
    more convenient than Delete. If your terminal has gone completely insane and the
    Return key no longer seems to be working correctly, you can try using the following
    command: stty sane Ctrl+j. This command attempts to reset the terminal to its
    default settings, but it isn''t guaranteed to work.


    # CHANGING KDE''s APPEARANCE


    Like most desktop environments, KDE includes the capability to customize your
    desktop environment just as you do under Windows or MacOS. You can set the background,
    screensaver, fonts, and other attributes of the windowing environment. The changes
    you make are not system-wide changes; they affect only your personal settings,
    so feel free to customize to your heart''s content! A sample of the different
    settings that you can customize is shown in Figure 16.1.


    ![](img/2c005cbaad58c25c7f54da948131a75e_173_0.png)


    FIGURE 16.1 KDE offers a wide selection of custom configuration options.


    Use the following steps to change KDE''s appearance:


    +   1. Click the main K toolbar menu item.

    +   2. Choose the Settings item from the menu.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '+   3. Select the property you want to change (Desktop, Sound, and so on).

    +   4. Choose any appropriate sub-property from the category you''ve chosen. For
    example, the Desktop enables you to change colors, background, and fonts, among
    others.

    +   5. Make the changes you want, and then click the Apply or OK button to set
    them.


    # SUMMARY


    In this lesson, you were introduced to the idea of modifying your environment
    settings by the use of aliases, Environment Variables, and configuration files.
    Making these modifications is what enables you to make the environment you work
    in your own. Following is a review of what was covered in this lesson:


    +   - Environment Variables are frequently used for specifying single configuration
    options to a program, such as providing a pointer to a directory that the program
    needs.

    +   - The path variable keeps track of where the system searches for commands
    when you type them. If a command exists on the system, but the path to the command
    is not in your path variable, it will not be found when you type the command name.

    +   - Aliases are a very powerful feature of UNIX shells. They enable you to rename
    commands, or cause commands to always use certain options when you issue them.

    +   - Dot files are everywhere. Many programs use text files containing configuration
    information for control purposes. These files almost universally have filenames
    which start with a . character. They are the place to look for automating settings
    to your shell, and for configuring options for the windowing system.

    +   - The stty command can rescue your terminal session if something has caused
    it to begin behaving oddly.


    Don''t be afraid to experiment. You''ve just made it through a lesson on modifying
    your user environment. Now go out and do it!'
  merge: -1
  img_proc: true
- pgno: 175
  md: '![](img/2c005cbaad58c25c7f54da948131a75e_175_0.png)


    # LESSON 17

    PRINTING


    *In this lesson you''ll learn how you can print requests (or jobs) to a printer
    on your network.*


    As you might be coming to expect, UNIX abstracts the notion of the physical location
    of the printer, so both local (directly-connected) and remote printers are accessed
    in the same fashion.


    An early divergence in the evolution of UNIX caused there to be two different
    UNIX printing methodologies: the lp system and the lpd system. lpd was created
    on the Berkeley Standard Distribution (BSD) UNIX source base, and lp was created
    on the AT&T System V source base. Unfortunately for the user, these systems are
    just different enough to make life confusing. From a system administrator''s point
    of view, lp seems to have been created specifically to make life more difficult.
    Because of this you will find many UNIX machines that are running OS versions
    based on System V, that have had lp replaced with the BSD lpd system.


    # SENDING A PRINT JOB: lpr OR lp


    In UNIX, many people can be printing at a single time. Because of this, when you
    send a print request to a printer it is assigned a job number. If you need to
    cancel your print job, this number is used to remove the job from the print queue.
    Only the root user or the person who owns a print job can remove it from the queue.


    > **Postscript vs. Non-Postscript** The assumption is made throughout this lesson
    that you are printing to a Postscript printer. It is possible, however, that your
    system might be configured to interpret Postscript using a rasterizer, and to
    print to a non-Postscript printer.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'If you''re lucky enough to have the lpd system available on your machine, you
    can use the lpr suite of programs. If you''re on a machine that uses lp, watch
    for the sections pointing out lp differences.


    The lpr (line printer) command is the primary method for sending data to the printer.
    lpr essentially dumps data directly to the printer you specify. To use lpr, follow
    these steps:


    +   1. Determine the name of the printer you want to use. This was probably set
    by your system administrator.

    +   2. Choose the file you want to print. For the moment, only chose a text file.
    You''ll get to see a few other formats shortly.

    +   3. Send the print job by using the following command: lpr -P<printer name>
    <filename> <filename> .... If there is only one printer configured on your computer,
    chances are you can simply type lpr <filename> <filename> ...


    > Be Careful... There''s no space between that P and the printer name.


    For example, type the following:


    ```

    >lpr -Phod samplefile.txt

    ```


    The result of this command is that the file samplefile.txt is sent to the printer
    named hod. Depending on the load of the printer, the print job will probably be
    processed shortly.


    > Printing More than One Copy If you need to print multiple copies of a document,
    you don''t need to send separate print jobs. Instead, you can specify the number
    of copies as an option to the lpr command. Simply follow lpr with #-<number of
    copies> to print that many copies of each file in the job.'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'There are a few file formats and special print cases that might require special
    attention from the print command. This special attention comes in the form of
    filters that are applied to the file and convert the information into a format
    that your printer can handle. Following are some filters:


    +   - **.ps** Postscript files. Postscript files will be handled automatically
    by the lpr command. You can print them as you print a plain text file.

    +   - **.dvi** Tex files. Files from tex contain special page layout instructions.
    You can use the -d option with lpr in order to print these files correctly.

    +   - **.tr** Troff files. This is the standard file format for man pages. If
    you want to print out a man page you can use the -t option.

    +   - **Text files with really long lines** If you are having problems printing
    text files because lines are running off the end of the page, you can have the
    files reformatted on-the-fly so that they fit. To do this, use -p with lpr.


    ![](img/2c005cbaad58c25c7f54da948131a75e_177_0.png)


    **System Quirks** It''s not unusual for a system to be configured without most
    of the previously mentioned filters installed. You can expect that a conscientious
    system administrator will have configured your system to handle postscript and
    plain text properly, but you might find that many have left handling the remainder
    up to you. In this case you''ll have to find and use the appropriate software
    to process your data files into postscript or plain text, and then send these
    processed files to the lpr command.


    ![](img/2c005cbaad58c25c7f54da948131a75e_177_1.png)


    **Using lp and lpr** The lp command works much like the lpr command, but with
    enough differences to make it annoying to the user familiar with lpr. Instead
    of using a -P option to specify the printer, you use a -d option.'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'Use -<number of copies> instead of -#<number of copies>.


    When you send a job to the printer with lp, it gives you a message such as the
    following: request id is <uniqname> #. Remember this <uniqname> # combination
    because that''s what you''ll need to know to remove the job if you decide you
    don''t want it to print after all.


    The lp system is supposed to make your life easier by handling detection of file
    types and appropriate conversions automatically, instead of specific options for
    specific types of files, however, every type of printer and every installation
    can have different options available. Hopefully, you will never need to know these
    installation-specific options, but if you do, check your local documentation to
    find out what your system can do.


    # CHECKING THE STATUS OF A PRINT JOB: lpq


    After you''ve sent a job to the printer, chances are you''ll want to be able to
    check to see if it is done printing especially if it is a network printer located
    on another floor in your building or in another building altogether! To check
    the status of a job, you''ll want to look at the queue for the printer to which
    you submitted the job. You do this with the lpq -p<printer name> command. Once
    again, if there is only a single printer on your system, you can probably just
    issue lpq by itself.


    For example, type the following:


    ```

    >lpq -Phod

    ```


    | Rank | Owner | Job | Files | Total Size |

    |---|---|---|---|---|

    | 1st | agrove | 27 | test.txt | 19 bytes |

    | 2nd | jray | 28 | samplefile.txt | 10021 bytes |


    This example shows that there are currently two different jobs in the printer
    queue for hod. One is owned by agrove, and the user jray owns'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'the second. Each job is ranked; this shows the order in which it will print.
    The names of the files being printed are also shown, as are the size and job ID
    number.


    **Status Check** Instead of lpq, the lp system uses lpstat. The easiest way to
    find out everything about your lp printing system is to use the following command:
    lpstat -t. This lists all the printers that are available on your system, and
    all the jobs on the listed printers.


    # CANCELING A PRINT JOB: lprm


    At times you might find that you''ve sent a print request to the printer when
    you didn''t actually mean to perhaps you sent a 3,000 page encyclopedia file instead
    of the three page report that you intended to send. Whatever the case, there is
    a command that enables you to remove items from the printer queue: lprm.


    If you need to use lprm, follow these steps:


    +   1. Use the lpq command to find the Job ID number that you want to remove.

    +   2. Invoke lprm with the following syntax: `lprm -P<printer name> <job ID>`.


    For example, if you wanted to remove job #28 from the queue in the last example
    (assuming that you''re the jray user), you''d type the following:


    ```

    >lprm -P hod 28

    ```


    To verify the results, you can use lpq to check the queue again:


    ```

    >lpq -P hod

    ```


    | Rank | Owner | Job | Files | Total Size |

    |------|-------|-----|-------|------------|

    | 1st | agrowes | 27 | test.txt | 19 bytes |


    Job #28 is no longer in the queue, and will not be printed. Don''t worry if you
    happen to accidentally enter someone else''s print job ID you can only cancel
    your own jobs.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'If you want to remove all the pending print jobs that you have sent, you can
    use the * character in place of the job ID. This cancels anything that you''ve
    sent to the printer.


    ![](img/2c005cbaad58c25c7f54da948131a75e_180_0.png)


    # Canceling a Print Job


    The lp system uses the command cancel instead of lprm. To cancel a printer job,
    use the lpstat -t command to list the jobs, pick the job ID, and then issue the
    cancel command as follows: cancel <jobid>. Because lp keeps track of print job
    IDs with unique names rather than just numbers, there is no need for you to specify
    from which printer you want to remove the job.


    # PRETTY PRINTING: ENSCRIPT


    If you want to do some fancy printing, you can use the enscript command to convert
    your text files into postscript and add some flashy features. (This might not
    be installed on all systems—ask your system administrator to install this if you
    need it and can''t find it.) For instance, if you want to print two pages of text
    on a single side of paper, enscript can format your document correctly. It can
    also print banner information with each page to help you identify what file has
    been printed and what page number you are looking at.


    To use enscript in its most basic form, do the following:


    +   1. Choose your printer.

    +   2. Choose the file that you want to print.

    +   3. Run enscript as follows: enscript -d <printer name> <filename> <filename>
    ...


    For example, to use enscript to print the file samplefile.txt, you type the following:


    ```

    >enscript -d hod samplefile.txt

    ```


    ```

    [ 1 pages * 1 copy ] sent to printer

    ```'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'Unlike lpr, ensript gives a bit of feedback on what is happening. Here it tells
    the user that it has sent one page to the printer, and has requested the default
    number of copies: one. The output of this command, in its basic form, is very
    similar to that of lpr. It simply dumps the file to the printer. The difference,
    however, lies in the command-line options that you can add to ensript to change
    the appearance of your printout. Following are some of the options you can use:


    +   - **Page range**—Use the option `-a <start page>-<end page>` to print a range
    of pages, rather than everything.

    +   - **Pretty print source-code**—If you''re a programmer, ensript can print
    your source in an attractive format with highlights if you use the `-E` command-line
    switch.

    +   - **Fancy header**—If you want to easily identify the file and page number
    that the text on a page belongs to, you can ask ensript to print a fancy header
    using `-G`.

    +   - **Landscape mode**—Rather than printing across the short dimension of your
    page, the `-r` option rotates the page 90 degrees and prints in landscape mode.

    +   - **Multiple columns**—To print two pages of text per printed page, use the
    `-2` option. You''ll probably also want to use the `-r` Landscape mode switch
    so that everything fits appropriately.

    +   - **Highlight bars**—If you''re reading source code or spreadsheet-type data,
    you might find it difficult to follow a line across a page. Use the `-H` option
    to print light gray highlight bars across the page.

    +   - **Multiple copies**—Using a slightly different syntax than lpr, ensript
    can print multiple copies of a job using the `-n <number of copies>` option.


    Although I''m sure that you don''t need to be reminded at this point, be sure
    to check the man pages for more information on ensript. There are many more options
    that you can use to further customize the appearance of your printouts.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# SUMMARY


    In this lesson, you learned the commands you need to print from the command line.
    If you''re using an application in the KDE environment, it is actually using the
    same commands you''ve seen here to send information to the printer. The suite
    of lpr, lpq, and lprm commands make up the basis for printing from UNIX and most
    UNIX computers. enscript is the icing on the cake. Here''s a review of some of
    the highlights of this lesson:


    +   - **lpr and lp**—The lpr and lp commands are used to send a file to the printer.
    If the file is of a type other than plain text, it can be processed by a filter
    to correctly format the information for your printer.

    +   - **lpq and lpstat**—When a print request is sent to the printer, either from
    lpr or enscript, it is added to the printer queue. Use the lpq or lpstat -t program
    to display all pending printer transactions, their corresponding job IDs, and
    their owners.

    +   - **lprm and cancel**—If you want to remove a job from the print queue, lprm
    or cancel will do the trick.

    +   - **enscript**—enscript is a useful utility for doing fancy printing on your
    printer. It allows multiple pages of text per printer page, pretty graphic headers,
    and a variety of other goodies.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '![](img/2c005cbaad58c25c7f54da948131a75e_183_0.png)


    # LESSON 18


    # ACCESSING THE NETWORK RESOURCES


    *In this lesson you will learn about another of the strengths of UNIX, network
    connectivity.*


    You''re now almost finished with your whirlwind tour of the UNIX operating system,
    but you are nowhere near finished exploring and learning about the capabilities
    that UNIX puts at your fingertips.


    UNIX excels at networking. As mentioned when discussing UNIX''s file system design,
    with the proper configuration you could spread UNIX machines around the globe
    and at each one at which you logged in your user environment, files and programs
    would all appear---just as they do at home.


    With the same ease with which your home environment can distribute itself to scattered
    machines to work for you, so can you distribute your workload to those same machines
    from your home machine. This lesson will provide you with a survey of some of
    the programs that allow this distribution of workload.


    # telnet


    telnet is a simple terminal program. In its primary use, it enables you to open
    a login session on a remote machine. To use the telnet command, issue the command
    as follows: `telnet <remote machine>`, where `<remote machine>` is either an IP
    address or a hostname. You will be prompted with a login and password prompt just
    as if you were sitting at the console of the remote machine.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '![](img/2c005cbaad58c25c7f54da948131a75e_184_0.png)


    > TELNET PARTICULARS It''s not unusual to run into situations where Backspace
    and Delete don''t work properly at the telnet login and password prompt. Don''t
    be alarmed; this is simply an indication that the remote machine doesn''t yet
    know what sort of terminal you''re using. If the problem persists into the login
    session, see the section on stty in Lesson 16, "Modifying the User Environment."


    # rlogin


    The rlogin command is very similar to the telnet command, except that it carries
    some user information along with the attempt to connect. If your account is good
    on several machines, they might be set up to enable you to connect between them
    without having to log in to each one. Try the rlogin command as follows: rlogin
    <remote machine>. If you''re lucky, you''ll end up in a shell on the remote machine.
    If you''re not, you''ll be presented with a login prompt; from there, rlogin functions
    identically to telnet.


    # slogin


    The slogin command is a remote terminal program that offers strong encryption
    of the data stream. You are strongly encouraged to use this command if your machines
    have the secure-shell server running. Both the rlogin and telnet commands send
    your login and password information, as well as anything else you type, over the
    network in plain text. A malicious user with a small amount of easily available
    cracker software can sniff this information and compromise your account. (Please
    don''t call them hackers. Hackers are quick and dirty, and are often brilliant
    programmers. They don''t break into things—crackers do.)


    To find out whether the secure shell server is running, and to set up the slogin
    command (which needs quite a bit of configuration before you can use it), you
    are advised to contact your system administrator. He or she will be more than
    happy to tell you about the slogin command or any alternatives, and to help you
    increase system security.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# rn/trn


    The rn and trn commands read Usenet newsgroups. Although they have retreated slightly
    into the background because of the World Wide Web, Usenet newsgroups were once
    considered to be the collective memory of the Net. Even though the Web has eclipsed
    newsgroups in terms of visibility, the fact that newsgroups function as topic-oriented
    chat rooms and provide almost real-time interaction makes them still a useful
    source of help and information. You can use the rn or trn command to access information
    that ranges from the technical, to the idiotic, to the sublime. The rn and trn
    commands are executed simply by name, and internally take both single-key commands
    and multi-character commands followed by Return. The primary commands you need
    to know when you are in rn or trn are as follows:


    +   - The commands for listing newsgroups—1 <topic>Return lists all newsgroups
    that contain that topic. For your topics, keep small parts of words—such as comp
    for computer topics—until you become familiar with the newsgroup naming conventions.

    +   - The command for going to a newsgroup—Type g <newsgroup name>Return, and
    then follow the instructions.

    +   - The command for help—h (no Return) brings up rather copious context-sensitive
    help at almost any point in the program.


    The trn command is a slightly more sophisticated version of rn, offering article
    selection by subject thread; you will probably prefer it if it''s available. Either
    version can be highly configured with command-line switches and configuration
    files.


    # ftp


    The ftp command provides you with a way to retrieve files from remote machines
    that aren''t set up to share file systems with yours. If your machine is running
    an ftp-server, you might be able to use it to provide your files to the rest of
    the world as well. Contact your system administrator about this.'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'To use the ftp command, simply enter the command as follows: ftp <ftp server>,
    where the ftp-server is the IP address or hostname of a remote machine running
    an ftp-server. If you''ve connected properly, you''ll get a prompt for a username
    and password.


    Some ftp-servers enable you to connect without an account on the system. For these,
    use the username anonymous and give your email address as the password.


    Once connected to an ftp-site, you can cd and ls your way around. Using the command
    get <filename> enables you to retrieve a file and put <filename> enables you to
    send one from your directory to the remote system.


    ![](img/2c005cbaad58c25c7f54da948131a75e_186_0.png)


    > **CORRUPTING YOUR DATA** Some ftp-servers corrupt data unless you issue the
    command binary after you are connected. They''re actually trying to fix the difference
    between the way that UNIX and PC-type machines handle carriage-returns in files,
    but they just end up screwing things up when talking to another UNIX machine.
    If you end up with corrupted files after you''ve downloaded them, try again, but
    issue the binary command before the get command.


    # Web Browsers: Netscape and Lynx


    The following sections discuss the Netscape and Lynx Web browsers.


    # Netscape


    Netscape is the GUI-based Web browser that is available on the largest number
    of UNIX platforms. It functions in much the same way as the Macintosh or PC versions
    that you might already be familiar with—point, click, and repeat as necessary.
    If it''s available on your system, you can most likely start Netscape by simply
    typing netscape in any X Windows terminal.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# Lynx


    Lynx is a text-based Web-browser, for those times when you''re stuck in a text
    window. Start it with this command: lynx <URL>. You get a textual representation
    of the page, at which the URL points. Lynx is a surprisingly full-featured browser
    for what you might think is an extremely limited market. The market is actually
    a bit bigger than you might think. Lynx starts and loads pages much faster than
    graphic-based browsers. This makes it a convenient alternative if you need to
    check a Web page quickly and don''t need either the graphics or the wait.


    # Email


    Of all the network tools you''ll make use of from your UNIX account, email is
    likely to be the most frequently used. Email enables you to communicate with your
    friends and colleagues, exchange files, and contact people all over the planet.
    As is fitting to its position of most-used tool, email also has the widest range
    of software available. Most versions of UNIX come with at least two different
    programs for accessing email, and frequently have a handful of others that have
    been installed over time. Although they are only a small sampling of the programs
    available, the following programs are commonly used for accessing and working
    with email:


    +   - **Mail**—Found on almost all UNIX systems, Mail is a command-line driven
    mail reading system. It''s a fairly simple program without many customization
    features, but it''s fast and convenient to use if you don''t need fancy mail filters
    or a menu-driven interface.

    +   - **mail**—Also found on almost all UNIX systems, mail is not something you
    want to use for reading mail unless you absolutely must. You will usually find
    that the major use for mail is using it in shell scripts, as has been demonstrated
    in several places in this book.'
  merge: -1
  img_proc: true
- pgno: 188
  md: "+   - **pine and elm**—Not standard on most commercial UNIX flavors, pine and\
    \ elm are both full-screen mail reading programs with simple-to-use and intuitive\
    \ menus and configuration options. The pine program is somewhat more powerful\
    \ than elm, but both are good mail readers for users who want convenience in a\
    \ text-based email reader.\n+   \n+   - **mh**—The Mail Handler. The mh suite\
    \ of programs must be close to the least, if not the least, intuitive mail reading\
