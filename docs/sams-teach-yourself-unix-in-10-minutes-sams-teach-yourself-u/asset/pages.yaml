  img_proc: true
- pgno: 200
  md: '![](img/2c005cbaad58c25c7f54da948131a75e_200_0.png)


    # Account Sharing Guidance


    It isn''t a good idea to share account passwords between users. For this example,
    you''ve seen a user switch to the agoves account, which isn''t necessarily good.
    Because the system thinks the user is now agoves, most anything the user does
    is logged as being done by agoves—and she might not appreciate it very much.


    A more proper use of su is to switch to non-personal accounts. There are several
    accounts that are owned by database servers and so on that are prime candidates
    for the appropriate use of su (to perform maintenance on the database files).


    Because su has the potential for a significant amount of abuse, its use is frequently
    limited to users of administrative accounts, and in all cases uses of su are logged
    by the system. Experimenting with this command without permission will, at the
    very least, raise administrative eyebrows in your direction.


    # SUMMARY


    In this lesson, you learned the purpose of permissions, owners, and groups. You
    now understand what is necessary to enable other users to access your files and
    how to collaborate on projects using group permissions. You might want to take
    a few minutes to talk to your system administrator to find out how he or she has
    decided to manage groups. Also, you might want to request that groups be created
    that include other users with whom you want to share files. Following is a look
    at some of the highlights from this lesson:


    +   - Permissions—File permissions control who can access a file, and what level
    of access they have to a file. The three levels of permissions are read, write,
    and execute. These permissions can be applied to the owner, group, or world.

    +   - chmod—The chmod command changes the permissions for a file or directory.
    There are two methods of operation—symbolic and'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'numeric. They both accomplish the same thing, so use the one you feel comfortable
    with.


    +   - **chown**—Only the super-user can change who owns a file. If you can convince
    your administrator to do so, chown changes the owner. Reasons why you might not
    want to try are covered in Lesson 20, "Privileged Commands."

    +   - **chgrp**—You can change the group that a file belongs to with the chgrp
    function. You can only change the file to a group that you belong to.

    +   - **newgrp**—Rather than constantly having to change the group for files you
    create, you can use newgrp to log in to a group of which you are a member. All
    files that are created for the remainder of your login session are created under
    that group.

    +   - **su**—The substitute user command effectively switches to another user
    within a single login session. If you have the password of another account, you
    can use su to perform operations under this account. Any files you create are
    owned by this user.'
  merge: -1
