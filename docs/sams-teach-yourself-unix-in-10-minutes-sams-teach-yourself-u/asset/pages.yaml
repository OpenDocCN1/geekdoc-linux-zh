- pgno: 12
  md: '# INTRODUCTION


    # WELCOME TO THE WORLD OF UNIX


    Welcome to Sam''s Teach Yourself UNIX in 10 Minutes. If you''re like most individuals
    faced with using UNIX for the first time, there are probably a dozen notions you
    have about what using UNIX will be like—mostly all of them intimidating. People
    have probably told you that UNIX is difficult to use, that the commands are cryptic,
    and that the interface is non-intuitive. You''ve almost certainly heard that UNIX
    is powerful, but that the power comes at the price of a steep learning curve.
    The thought that learning and using UNIX will be fun and rewarding is probably
    one of the furthest from your mind. The contents of this book will hopefully change
    your mind. You will learn how to make use of UNIX''s command line and graphical
    user interface, and to familiarize yourself with the commands you need to productively
    use UNIX on a day-to-day basis.


    # So What is UNIX, Anyway?


    UNIX is a powerful multitasking (it can run multiple programs simultaneously)
    operating system. Having been designed originally as an experimental operating
    system on which to test OS implementation ideas, UNIX grew from its humble roots
    to the leading commercial platform for network server and program development.


    Because of its roots, many parts of UNIX are implemented in what might be considered
    "the easiest way possible." Although this leads to certain inefficiencies in the
    OS, it also proves to be one of UNIX''s greatest strengths—many of the "easiest
    way possible" ideas turn out to be great benefits to the user. The easiest way
    possible tends, for example, to lead to abstraction of where data is stored or
    how it is accessed. Rather than being concerned where something is located, it''s
    easier to design a single way of accessing data. Then whenever data needs to be
    retrieved from some new type of device, you create a piece of software that allows
    the new data to be accessed through the pre-existing interface.'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'UNIX is also a multi-user operating system. Unlike some personal-computer implementations
    of the idea of multiple users, with UNIX, many users can simultaneously use a
    single machine. From the point of view of each of these users, they are in control
    of the complete machine. Also, instead of simply hiding your files from other
    users UNIX actually gives you the capability to deny or allow other users access
    to your files, making them invisible—and inaccessible to users who are denied
    access.


    One of the interesting things you''ll discover about UNIX after you''ve used it
    for a while is that many of the more useful utilities and applications are written
    by, and supported by, other users just like yourself. The power of the UNIX operating
    system, the ease with which sophisticated commands can be constructed, and UNIX''s
    powerful programming and networking ties have bred a strong cooperative streak
    in UNIX users. It is a long-standing tradition that software constructed to solve
    a problem is made available by its author to the rest of the UNIX community, and
    this becomes yet another building block for even more sophisticated commands.
    You might be surprised to find that the most powerful compiler and debuggers available
    for UNIX are available for free, as are many other useful applications. Although
    you might be familiar with the idea of shareware from the personal computer world,
    the idea of UNIX freeware is likely to take you at least slightly by surprise.
    Much of the UNIX freeware rivals or surpasses commercial software in its elegance,
    completeness, and—most of all—in the rapidity of response to the report of errors
    in the software. Unlike singular shareware authors, much UNIX freeware is supported
    by entire user communities. For example, if you''re using one of the freeware
    UNIX database systems and discover a bug, it would not be unexpected for one of
    the hundreds of users who contribute code to that particular project to have your
    bug fixed—and a new version released in less than a week.


    # VERSIONS OF UNIX


    With only a little looking around, you''re likely to notice that there are many
    different versions (frequently called flavors) of UNIX available, sometimes even
    coming in multiple flavors from a single vendor. The largest consistent difference
    you will notice if you use multiple different versions of UNIX is between versions
    based on AT&T''s System V UNIX'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'and the Berkeley Standard Distribution BSD/4.X UNIX. This book has been written
    to be as general as possible and to not favor any one vendor or implementation.
    Where variations between command behavior is known to the author it has been noted
    in the text, but there certainly is the possibility (probability? certainty?—yes,
    certainty) that there are other variations as well. This book will teach you how
    to use UNIX''s built-in manuals and help system to find additional information
    on commands that do not function as described here.


    ![](img/2c005cbaad58c25c7f54da948131a75e_14_0.png)


    Tip If something in an example doesn''t work on your system, don''t be alarmed—check
    the online manuals or ask other users of your machine. Different versions of UNIX
    sometimes have slightly different versions of commands—it will be worth your time
    to learn how things work on your system.


    # How Do You Use UNIX?


    Unless you''re simply using a UNIX machine as a platform for a pre-packaged commercial
    application, most of your interaction with UNIX is likely to be textual—commands
    typed at a command-line prompt. Most implementations of UNIX do provide a GUI
    (graphical user interface); however, even when running the GUI, much of what you
    are likely to do involves typing commands into terminal windows which are available
    in the GUI.


    Don''t let the fact that you have to use textual commands worry you. Although
    it''s not as intuitively obvious as dragging and dropping to copy files, the command-line
    interface is actually one of UNIX''s strengths. Again doing things the easy way,
    UNIX commands tend to be simple commands that do one simple thing. It is the capability
    to combine many of these simple commands together to make much more complex commands—commands
    suited to do almost anything you can imagine—which makes UNIX truly powerful.


    On some versions of UNIX you might also find useful utilities built-in as part
    of the GUI. Some of these make the GUI almost as sophisticated as'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'the personal computer interfaces with which you might be familiar. You will
    be introduced to KDE (K Desktop Environment), one particular flavor of such an
    interface, in this book. KDE was chosen as a representative sample for this book
    because it is available on a wide range of UNIX flavors, because it is one of
    the more sophisticated examples, and because it is a wonderful example of a free
    product supported by its users.


    ![](img/2c005cbaad58c25c7f54da948131a75e_15_0.png)


    > **Word of Caution** As tempting as it might be, you are cautioned not to become
    entirely dependent on GUI utilities even if you have a GUI product with the sophistication
    and convenience of KDE. Although the GUI utilities are often faster and much easier
    than using the command line, it is rare for a GUI version of a command to have
    the same power and extensibility that the command line version will have. If you
    rely only on the GUI, you will be limiting yourself and not making use of the
    full power you have at your disposal.


    # How to Use This Book


    This book is designed as a series of lessons. The earlier lessons give you an
    overview of how to start using UNIX, how to get help, and a bit of the UNIX philosophy
    to help you to understand why some things have been done in the way that they
    have. The lessons progress through examples of the sorts of commands you’ll need
    to use the very first time you sit down at the machine, through more advanced
    topics. For the early topics you will find line-by-line instructions on the use
    of most commands, with examples that you can follow at your own machine. As the
    topics become more advanced, the information becomes more of an overview of the
    functionality of the commands. When you’ve reached that point, don’t hesitate
    to use UNIX’s built-in manuals. With the immense number of commands and diverse
    functionality available to the UNIX user, it is impossible to cover even a small
    fraction of the commands in-depth in a book this size. Instead, you are provided
    with the resources to find the in-depth information, and sufficient information
    to know what you need to be looking for.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'If you''re completely new to UNIX, it''s recommended that you start at the
    beginning, and work your way through at least Lesson 7, “Reading Files.” By the
    time you''ve completed Lesson 7, you will have mastered enough UNIX commands to
    give you an idea of what UNIX is all about and to let you start being productive
    with UNIX. You are, of course, encouraged to continue with the rest of the lessons.
    If you have a particular task in mind after you''ve completed Lesson 7, you will
    be ready to pick and choose what you need to know from the remaining lessons.


    If you already have some familiarity with UNIX, but are looking for a quick-start
    on some more advanced topics, feel free to pick through the lessons for the portions
    about which you want to learn. No examples in the book rely on the results of
    previous examples, so you can step in anywhere you want. If your UNIX experience
    is such that you''re comfortable moving around, and perhaps executing a few programs,
    you might feel ready to tackle some of the more advanced topics right off. You''re
    encouraged to at least skim through the introductory lessons anyway, as you might
    not have been exposed to some of the “philosophy” of UNIX yet. This can be helpful
    in understanding the how and why of some of the more sophisticated lessons.


    # Who This Book is For


    This book is aimed primarily at the user coming to UNIX for the first time, or
    with very little UNIX experience, who wants or needs to become a productive UNIX
    user without a large investment of time. The lessons are styled, and commands
    and options presented, in such a way that the new user can quickly start to use
    UNIX without needing to grasp all the intricacies of each and every command. In
    addition to the most common commands and command options, the user is given the
    capability to find more information as his or her needs grow. In the more advanced
    lessons, the user is presented with an overview that is sufficient to demonstrate
    the possibilities and capabilities inherent in the UNIX environment, and with
    the tools to begin to take advantage of those capabilities.


    Users who have used UNIX for some time—but only casually—who find that they want
    to learn more or to be more comfortable with UNIX will also benefit from this
    book, both as a quick reference and as a stepping stone to greater understanding
    and fluency with the OS.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# A Quick Note from the Author


    Don''t let UNIX intimidate you—whether you''re here for work or for pleasure,
    don''t let your UNIX experience frustrate you. Having been using UNIX and training
    others to use UNIX since 1989, the single largest problem that I see new users
    experience is that they allow using UNIX to become work, rather than making UNIX
    work for them.


    UNIX is a very powerful operating system that will enable you to customize it
    to suit your personal wants and needs, and this book will show you how to make
    it work for you. In years of training users to use UNIX machines for a computer
    graphics lab, I have seen far too many users refuse to actually learn how to make
    their machines work for them.


    Instead of investing a few minutes in learning how to customize the OS and environment
    to make their lives easier, they spend hours or days plodding through repetitive
    tasks by hand. You can make your life easier, your work go faster, and your computer
    experience much more pleasant if you think of UNIX as a box of parts which you
    can put together to create any tool you want. Simply, none of the parts is particularly
    interesting or powerful, but by correctly assembling these parts, a clever user
    can make UNIX do almost all his or her work automatically.


    Read the book, work through any examples you need, but most importantly, remember
    that what is contained here is only a teaser of what can really be done with UNIX.


    # Conventions Used in This Book


    This book uses the following conventions:


    +   - Information you type appears in bold monospace type.

    +   - Screen output will be shown in monospace.

    +   - Menus and menu options, keys you press, and names of buttons and other screen
    components with which you might interact appear in bolded blue type.

    +   - The Return key is synonymous with the Enter key.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'In addition, this book uses the following sidebars to identify helpful information:


    Tips lead you to shortcuts and solutions that can clear up confusion or save you
    time.


    Cautions help you avoid common pitfalls.


    Plain English explains new terms and definitions.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '![](img/2c005cbaad58c25c7f54da948131a75e_19_0.png)


    # LESSON 1


    # GETTING

    STARTED


    In this lesson you''ll learn about logging in to and out of your UNIX system in
    addition to some basics of operating your machine. You''ll also learn a bit of
    the UNIX background, such as why it runs the way it does.


    For years UNIX has been a murky topic that has scared away many people. The Internet
    and World Wide Web were built upon the backs of UNIX machines; therefore, the
    growing need for Internet connectivity, combined with a desire for increased performance
    and stability, have caused the number of people interested in using UNIX to skyrocket.
    At the same time, personal computers are becoming easier to use, and this has
    spurred the growth of utilities to make the UNIX user''s life easier. Furthermore,
    this has aided in the push of UNIX—in all its variants—from the server room onto
    the desktop and into the home.


    # THE LOGIN PROCESS


    The first thing you''ll notice when you sit down in front of your UNIX computer
    is that you need to log in before you can do anything. UNIX is based on a multi-user
    principle—multiple users can have their own accounts, programs, and settings on
    the same machine. If you''re familiar with Windows 95/98, multiple users might
    sound familiar. Windows 95/98 however, does not protect the user''s files from
    other people; it simply "hides" them. Furthermore, Windows 95/98 does not enable
    multiple users to run programs simultaneously the way UNIX does.


    # OWNERSHIP AND PERMISSIONS


    UNIX contains the concepts of ownership and permissions. Files are owned by individual
    users, and permissions control who can view, edit, or run files on the system.
    Luckily, there is little need for a casual user to'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'worry about ownership. If there is a need to share files with other users on
    the system, you''ll want to take a look at Lesson 19, "Permissions." After you''ve
    logged in to your computer, all files that you create during your current session
    are automatically owned by your account.


    # MULTI-USER


    In addition to controlling and tracking who owns what, UNIX also enables multiple
    users to access the system simultaneously. This is a drastic change from the desktop
    environment offered by traditional personal computer operating systems. For example,
    while you''re working on a spreadsheet, a coworker might be running a series of
    calculations for an engineering project. Many different processes can run simultaneously
    on a single computer by potentially hundreds of different users. Lesson 11, "Processes"
    explains the concept of processes and how you can manage them.


    # THE LOGIN PROMPT


    In order to log in to your computer, you need to supply a username and password.
    Your system administrator will most likely provide you with a username and password.
    Upon entering your information, UNIX loads the appropriate configuration for your
    account and you can start using the system. The screen that is displayed when
    you enter your username and password varies from system to system depending on
    the configuration. There are two possibilities that you might encounter: a graphical
    login screen or a text-based screen.


    ![](img/2c005cbaad58c25c7f54da948131a75e_20_0.png)


    > To Shift or Not to Shift When you''re logging in to—or using other aspects of—UNIX,
    it''s important to remember that UNIX is case-sensitive. The operating system
    interprets the capital and lowercase forms of a letter as two different characters.
    So, if you''ve been given a password that looks like KiWisRgood, you can bet that
    the machine won''t allow you to log in with kiwisrgood.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# TEXT-BASED LOGIN


    The text-based login screen varies by UNIX distributions. Most text-based UNIX
    login prompts look like this:


    ```

    login:

    password:

    ```


    When you see the login: prompt, type your username and press return. The password:
    prompt appears immediately thereafter. When you have successfully typed in both
    your username and password, you reach a shell prompt. There are a couple of things
    to keep in mind during your login: Don''t backspace because some systems don''t
    interpret it properly. Also, when you type your password the data won''t show
    on the screen (this is to protect your account from prying eyes). Now you''re
    ready to begin issuing commands to the system. Don''t worry if you don''t know
    what to do next; you''ll soon learn how to do something productive.


    > What if I Make a Typing Error? Don''t worry if you make a mistake logging in.
    The system logs the failed attempt to a security file. In the default UNIX configuration,
    you have another chance to log in, so there''s no need to panic if you don''t
    get it right the first time—everyone makes mistakes!


    # GRAPHICAL LOGIN


    Instead of a text prompt, your machine might be configured with something a bit
    snazzier—a graphical screen where you can type your login information. This works
    exactly the same as the text-based system, except it immediately launches you
    into the X Windows environment. Some of these graphical login screens enable the
    user to select from various login shells or to perform certain administrative
    tasks, but all provide the basic utility of logging in to the system. They each
    have an area for you to enter your username and an area for you to enter your
    password. Some flavors of UNIX enable you to tab between these fields, whereas
    other variations require you to position your cursor over each field and click
    to select the field in which you want to type. In any case, enter your username
    and password in the obvious locations, and then either hit return or click on
    the login button.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# THE LOGOUT PROCESS


    Now that you know how to log in to your system, here''s a quick look at the logout
    process and why it is important. You already know that your computer can have
    multiple people using it simultaneously, and that it can have files owned by many
    different people. The login process identifies you to the system and enables you
    to control the computer using your own username. How do you reverse this? That''s
    where the logout process fits. It closes any files that you might have open and
    shuts down any programs that you might have left running. If you remain logged
    in constantly, you might be exposing the system to security risks—not to mention
    that the processes you leave running might slow down the computer for other users.
    It''s always best to log out of your computer when you''re finished using it.
    UNIX users might encounter serious troubles when they don''t properly log out.


    # LOGGING OUT FROM A TEXT-BASED SESSION


    If you are not running a graphical session (you don''t see any windows on your
    screen), the only command you need to use to log out is logout, surprisingly enough.


    In order to log out from a command prompt, type:


    ```

    >logout

    ```


    The system immediately returns to the login prompt. That''s it. You''ve successfully
    logged out of the computer.


    ![](img/2c005cbaad58c25c7f54da948131a75e_22_0.png)


    > Logout Alternative Some UNIX shells have the reputation of being picky. In certain
    cases, when you type logout the UNIX shell might reply with the message "Not login
    shell" and proceed to leave you logged in. Not to worry—even if a shell refuses
    to accept the logout command, you can still log out with the exit command. It
    works the same way as logout and will convince even picky versions of UNIX to
    allow you to sign off of the system.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# LOGGING OUT FROM A KDE SESSION


    If you logged in to the UNIX system through the KDE graphical interface, you can
    point and click your way out of the system. To log out:


    +   1. Click the K symbol, which pops up the main KDE menu.

    +   2. Select Logout from the menu

    +   3. KDE prompts you and tells you that it is ready to close your session. Click
    the Logout button to complete the process.


    # THE UNIX COMMAND PROMPT


    You''re probably wondering what use UNIX is going to be to you if all you can
    do is log in and log out. Patience! UNIX can be a bit overwhelming if approached
    too quickly. The power of UNIX comes from its wealth of built-in utilities and
    the way that processes can be combined to perform tasks that might require customized
    programming on another operating system. For example, suppose you''re running
    a Web server on your UNIX computer and you want to count the number of accesses
    from a machine named kiwi. If you''re a programmer, it isn''t too difficult to
    write a program to do this—but with UNIX you don''t need to! Instead, you can
    just enter a command such as this:


    ```

    >grep "kiwi" /var/log/httpd/access.log ; wc -l

    ```


    This example uses grep, a program that finds patterns, to find all the lines in
    the Web server log which contain kiwi; it then hands the results to we, a program
    which counts things. Obviously, you aren''t expected to know how to construct
    this command yet—but you will be capable of doing so by the end of the book.


    When you are typing commands into UNIX, you are typing them into what is known
    as a shell. For all the old DOS users out there, a shell is sort of like a version
    of Command.Com—on steroids. If you remember the days of DOS, you probably also
    remember different DOS shells that added capabilities to your computer. UNIX has
    a wide variety of shells that you can use, each offering a different set of capabilities.
    In addition to giving the user a place to run commands, shells also provide a
    scripting language that is much like a DOS batch file, but far more capable.


    Programs written using a shell are called shell scripts.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# LOTS AND LOTS OF SHELLS


    Because there are numerous shells available for UNIX, most users try different
    shells until they find the one that they like best. You''ll probably never need
    to change your shell unless you plan on programming one. Lesson 15, "User Utilities,"
    discusses the techniques you can use to switch to a different shell. Here is a
    quick overview of just a few of the different shells that are available, and the
    benefits they offer:


    +   - **sh**—The Bourne shell, sh is the shell; it is available on any UNIX distribution
    that you might use, and it offers a simple scripting syntax. Most people use the
    sh shell only when they are writing programs that must run on absolutely any UNIX
    machine.

    +   - **csh**—The C-Shell. (Yes, it''s pronounced like seashell.) The csh shell
    takes its name from the C programming language. The scripting environment that
    is offered by csh is similar to the C language and offers enough flexibility to
    write lengthy, customized scripts that run on most UNIX machines.

    +   - **tcsh**—Extended C-shell. This shell is csh with various extensions, and
    it''s a very popular alternative to csh on most UNIX variations. This shell includes
    filename completion and an easily accessible command history.

    +   - **bash**—The Bourne-again shell. (UNIX programmers have been known to have
    weird senses of humor.) bash is a modern shell that has received most of its attention
    from the Linux community and is included as the default shell on most Linux machines.
    This shell has the same capabilities of csh but offers advanced features for the
    user as well as the programmer. bash includes command and filename completion
    and an easily accessible command history that is persistent across different login
    sessions.


    There are far more shells available, but these four will probably make up the
    bulk of any that you encounter. Don''t worry if you sit down in front of a computer
    that is running a different shell. You can still operate the computer using the
    knowledge gained from this book. You might experience some changes in the scripting
    architecture, but you''re not going to be lost.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# SHELL COMMAND SYNTAX


    Using a shell is as simple as typing the command you want to use and pressing
    enter. There are a few rules, however, that might help if you are having trouble
    getting a command to work:


    +   - Commands are case-sensitive, and are usually lowercase. Unlike Windows,
    you cannot mix case and still have a function work; you must type the command
    exactly as it is stored on the system.

    +   - Frequently, the current directory isn''t included in the PATH environment
    variable that specifies all the directories of the commands that you can access
    by typing just the command''s name. (You''ll find out how to modify this in Lesson
    16, "Modifying the User Environment.") Because the current directory isn''t necessarily
    included, you might be in a directory that holds a program called parachute but
    you''ll find that you can''t run the program by typing parachute. In order to
    run the command, simply tell the system that the parachute command is in the same
    directory that you are in by preceding it with ./ . Thus, parachute can be run
    by typing ./parachute from inside its directory.


    > What''s with the . and /? These characters represent the current directory (.)
    and the directory separator (/). Used together, ./ is essentially the path to
    the directory that you are currently in.


    There are special symbols, commands, and so on, that might leave your shell in
    a state that seems unusable. This generally means that you''ve started some sort
    of process that is expecting input from you. There are three control characters
    that might help you regain control of your commands. To type one of these control
    characters, hold down the control key while pressing the corresponding letter:


    +   - Ctrl+d—Tells the computer that you are done sending input to a command.
    This is useful if you''ve accidentally started a program and can''t get out.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '+   - Ctrl+c—The UNIX break character. This usually kills any program that
    is currently running, and then returns you to a command prompt.

    +   - Ctrl+z—Suspends the current process. This suspends the process you were
    running and returns you to a command prompt. Logging out kills the suspended command.


    Don''t be afraid to try the commands discussed in the book, and to explore the
    system to find more. You''ll be amazed at what can be done with a little bit of
    typing.


    # SUMMARY


    This lesson taught you a few very important skills that you need to begin using
    your UNIX computer effectively. Although most of the concepts introduced are relatively
    simple, they are important in understanding how and why UNIX operates the way
    it does.


    +   - Login—Logging in to UNIX allows the system to identify you as a user and
    apply the appropriate ownership to files you create and modify. Each user has
    his or her own environment and can run programs simultaneously with other users.

    +   - Logout—Logging out of the computer closes open files and ends processes
    that are owned by the current user. Always log out of the system when you are
    done using it.

    +   - The Command Line—The UNIX command line enables you to create complex functions
    by stringing together a variety of built-in commands. What requires specialized
    software on other systems can usually be accomplished using built-in UNIX utilities.

    +   - Shells—There are many different types of shells that you can use. Depending
    on your needs as a programmer and user, you need to evaluate the shell features
    you find necessary, and choose appropriately.

    +   - Using the Command Line—Commands can be typed directly into a shell, as you
    might expect. Keep in mind that commands are usually lowercase, and you might
    need to specify a path to a command if it is not included in your PATH environment
    variable.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '![](img/2c005cbaad58c25c7f54da948131a75e_27_0.png)


    # LESSON 2


    # UNIX

    DOCUMENTATION

    AND FINDING

    HELP


    *This lesson will show you how to find help using several methods of retrieving
    information about UNIX''s built-in commands and capabilities.*


    If you''ve poked around your UNIX system at all, you''ve probably noticed that
    there are literally thousands of different files and applications on your computer.
    You might find this to be a bit overwhelming at first, but the diversity and extensive
    capabilities of the operating system are part of its attraction. If there is something
    you want to do, you can bet that UNIX has a utility or combination of utilities
    that can get the job done. The biggest question on your mind is probably, "How
    do I use this stuff?"


    # UNIX MANUAL PAGES


    Although some UNIX commands provide instant feedback and help information to you
    if you simply type the command on the command line, this help is usually only
    useful for the experienced user who just needs a quick reminder. The UNIX manual
    (man) pages, on the other hand, are the quickest and easiest source for complete
    information on how to use the commands on your system. They provide information
    on what programs do and how to use them, as well as on other related utilities
    that you might be interested in checking out. If you''re a programmer, man pages
    can also provide useful programming information.'
  merge: -1
  img_proc: true
