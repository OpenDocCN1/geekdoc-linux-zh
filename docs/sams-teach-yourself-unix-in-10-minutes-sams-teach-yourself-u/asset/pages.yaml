- pgno: 66
  md: '# LESSON 5


    # FINDING FILES


    ![](img/2c005cbaad58c25c7f54da948131a75e_66_0.png)


    In this lesson you will learn to use some of UNIX''s built-in search tools to
    find files.


    In Lesson 4, "The File System," you learned how to list the files in directories
    and to navigate from one directory to another. You probably also noticed that
    there are a lot of files included in a standard UNIX distribution. You''re certain
    to run into the situation where you know the name of a file you want to use, but
    have no idea where it''s located. Rather than using cd and ls to find your way
    through the entire file system, you can use some of UNIX''s search utilities to
    help locate what you need.


    # FINDING FILES


    In order to locate a file, you need to know something about it: a portion of its
    name, when it was created, or perhaps its size. Armed with these pieces of information,
    you can dispatch the find command and allow it to scour the file system looking
    for matches to your query.


    # FINDING A FILE BY NAME


    The most common type of search is by filename. You''ve probably used a find file
    command on other operating systems that works similarly. You supply the filename,
    or portion of the filename, to be found, and the system returns a list of matches.


    ![](img/2c005cbaad58c25c7f54da948131a75e_66_1.png)


    > Using find Before you try out the find command, there''s something you need
    to know. If you run find on a large file system, especially one mounted over the
    network, it''s likely to take a very long time.'
  merge: -1
  img_proc: true
- pgno: 67
  md: "To search for a file by name, use the following steps:\n\n+   1. Determine\
    \ the name of the file you want to search for. If you want to, you can include\
    \ wildcards in the search for the file-name.\n+   2. Choose a starting directory\
    \ for the search. If you want to search the entire file system, the starting directory\
    \ will be /.\n+   3. Invoke the find command as `find <starting directory> -name\
    \ <filename> -print`.\n\nFor example:\n\n```\n>find / -name sound -print\n/usr/src/linux-2.6.35/drivers/sound\n\
    /usr/src/linux-2.6.35/drivers/sound\n/var/lock/subsys/sound\n/etc/rc.d/init.d/sound\n\
    ```\n\n> **Search Errors** if you're searching the entire file system, you're\
    \ likely to encounter errors such as\n> \n> `find: /home/ftp/bin: Permission denied`\n\
    > `find: /home/ftp/etc: Permission denied`\n> \n> This is entirely normal, and\
    \ isn't cause for alarm. The system is simply telling you that in scanning through\
    \ the file system searching for files, it has hit directories that you don't have\
    \ permission to read. If you confine the search to your home directory (which\
    \ can be represented to the system as ~), you don't see any of these errors.\n\
    \nThe system has responded to the request by finding four different files named\
    \ sound. Because find was instructed to search the entire file system, the search\
    \ took more than a minute; there were hundreds of directories and thousands of\
    \ filenames that were just processed.\n\nYou might wonder why you need to follow\
    \ the command by -print. This is necessary because find is capable of doing things\
    \ other than simply"
  merge: -1
  img_proc: true
- pgno: 68
  md: 'telling you about what it has found. On the other hand, if you don’t issue
    the -print option, most versions of find will happily go out, find the files for
    you, and quit—all without telling you a thing. Remember, UNIX takes what you tell
    it very literally.


    # FINDING A FILE BY DATE


    Imagine you just created a document file on the system but you can’t remember
    its name. How in the world can you find it? One possible solution is to search
    by time, finding files that are younger than a certain time. To search for a file
    by its creation date do the following:


    +   1. Determine the relative age of your file in days.

    +   2. Choose a starting directory for the search. Remember, / searches the entire
    file system, whereas ~/ searches only your personal directory.

    +   3. Invoke find using the -ctime option: `find <starting directory> -ctime
    <days old> -print`.


    For example:


    ```

    >find ~/ -ctime 2 -print

    /home/jray/getip.c

    /home/jray/a.out

    /home/jray/getip2.c

    /home/jray/.saves-8395-postoffice

    ```


    If you entered this command, you’d have searched your home directory for files
    that have been modified in the last two days (48 hours). If these were your results,
    one of these four files would be the one that you were trying to find.


    # FIND A FILE BY SIZE


    The advantage of finding a file by size might not be immediately obvious until
    your system begins to run out of room. UNIX will often save a file called core
    when a program crashes; this is referred to as a core dump. The core file contains
    all the information that was in memory when the program crashed, and can be used
    by the programmers to debug what went wrong. Usually the core file can be erased
    unless you’d like to try'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'debugging the program yourself. The problem with these files is that they tend
    to get written in directories that you might not be aware of, and silently consume
    drive space without your knowledge. Of course, if you''re out of disk space, you''re
    interested in finding large files that might have been created by other processes
    as well; so, just finding core by name will not do. To search by size use the
    following steps:


    +   1. Choose a target file size for which you''d like to search, and find will
    locate all files of this size (or larger) for you.

    +   2. Choose a starting directory.

    +   3. Start the find program using the -size option: find <starting directory>
    -size <#> -print.


    For example:


    ```

    >find ~/ -size 1024k -print

    /home/jray/bochs/bochs-980513/core

    /home/jray/postgres51/core

    ```


    The find command you see here has located two core files (which hopefully won''t
    actually be in your home directory) that are 1024k or more in size. If there had
    been other large files, they would have been listed as well; in this case, though,
    only core files were found.


    There are many other command line switches that can by used with find besides
    -name, -ctime, and -size. Be sure to check out the find man pages if you''re interested
    in learning more.


    # whereis


    The whereis command performs a quick search on a preset number of directories,
    and returns paths to source code, binaries, and man pages for the file you specify.
    It is less useful as a general find utility than find but might still come in
    handy.


    For example:


    ```

    >whereis time

    time: /usr/bin/time /usr/include/time.h /usr/man/man2/time.2

    =>/usr/man/man1/time.1

    ```'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'The whereis command shows that the time binary is located in /usr/bin/time,
    whereas the header file is in /usr/include/time.h. Two man page paths are also
    returned. If you''re interested in finding where programs and their associated
    files are located on your machine, whereis might do the trick.


    # which


    Lastly, the which command can also help you locate files that are contained within
    one of the directories specified in your PATH environment variable. Lesson 16,
    "Modifying the User Environment," discusses how you can go about configuring the
    PATH variable. This is less useful as a method of finding files than as a way
    to find out which version of a program executes when you type a command. For example,
    if your system has two different programs named time, you can use the which command
    to find out which one runs when you type time. You can invoke which much like
    you did whereis—just supply a filename for it to look up.


    For example:


    ```

    >which time

    /usr/bin/time

    ```


    UNIX returns the full path to the time command. The which command is the least
    configurable of the commands you''ve seen so far, but it is also the fastest.
    If you''re ever trying to remember where a program is located, give which a shot.


    # FINDING FILES THAT CONTAIN A WORD OR PATTERN


    One of the most powerful built-in programs in UNIX is grep. The grep utility enables
    you to quickly search through the body of files for a particular word or pattern.
    grep comes in three flavors: grep, egrep, and fgrep. The differences between these
    versions are based on the complexity of the regular expressions that they can
    handle. Regular expressions define a pattern of text that can be used to search
    files when a specific word or phrase to be searched for might not be known. (You
    will learn more about regular expressions in Lesson 13, "Regular'
  merge: -1
