    ```\n\nThe infamous magical-beans.gz file now belongs to the group admins. Members\
    \ of the group have read and execute permissions for the file.\n\nThe most obvious\
    \ use for chgrp is if you are collaborating on a project. If you create a file\
    \ that you want to share with many people, you'll need to change the group of\
    \ the file to one that all the users belong to.\n\n> Running chgrp on a directory\
    \  The chgrp command, like chown, can also be run recursively on a directory by\
    \ using the -R option. This is a big time-saver when you want to modify a bunch\
    \ of files and directories at the same time.\n\n# LOGGING IN TO A NEW GROUP:\n\
    newgrp\n\nIf you're working on a project, you might not want to constantly change\
    \ the group of the files that you create; this might get pretty monotonous if\
    \ you're working with hundreds of files. Luckily, there is a way to log in to\
    \ a group that you are a member of. This is done by way of the newgrp command.\
    \ All files that are created after executing this command are under the group\
