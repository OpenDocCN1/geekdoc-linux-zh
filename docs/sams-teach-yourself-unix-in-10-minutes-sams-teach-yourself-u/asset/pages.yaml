- pgno: 152
  md: 'that don’t involve putting commands in files at all. One of the commands used
    for this is the foreach command.


    # EXECUTING A COMMAND OVER AND OVER


    If you find yourself in a situation where you need to repeatedly execute some
    action for each file in a set of files, the foreach command can help. It takes
    a list of files, and does something "for each" of them. The use is much easier
    to demonstrate than to explain. If you have a list of files that you need to do
    something to, you can follow these steps to use foreach:


    +   1. Figure out what you want to do. In this example, you’ve got a bunch of
    directories, and you want to create a tarfile of each.

    +   2. Decide on the names of the files/directories that you want to do your something
    to. In this case, you’re going create tarfiles for the directories mydirectory,
    yourdirectory, and herdirdirectory.

    +   3. Pick a variable name that you want to use; here you’re just going to use
    a variable named test. It doesn’t much matter what the variable name is, just
    so long as it doesn’t conflict with the name of the command.

    +   4. Issue the foreach command as foreach <variablename> (<filenames>). The
    foreach command then asks you what you want to do for each file by displaying
    a question mark. Fill this in with whatever you need to do. Again, you’re going
    to be tar ring files in the example. After giving foreach the command for whatever
    it is you want to do, finish it by putting the command end on a line by itself.


    To illustrate the example, type the following:


    ```

    > foreach test (mydirectory yourdirectory herdirdirectory)

    ? tar -cvf $test.tar $test

    ? end

    ```


    Your machine will respond by running the tar command for each file you gave it
    to work with. Inside the foreach command loop, note the use of the expression
    $test. foreach goes through the list of filenames you gave it and puts each one
    sequentially in the test variable. To use the contents of a variable in the shell,
    put a $ sign before it. For example, foreach first'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'puts mydirectory in the variable test. It then runs the tar command, and the
    shell expands the test variable to mydirectory. The tar command that gets executed
    actually looks like the following: tar -cvf mydirectory.tar mydirectory. The next
    time through the loop, foreach puts yourdirectory in the variable test, and the
    process is repeated.


    You can use regular expressions in the shell instead of enumerating the filenames
    to use the foreach command. If you notice in the previous example, all the directories
    you want to tar actually have part of their names in common—directory, in this
    instance. If you wanted to produce the same results without having to enumerate
    all the directory names to foreach, you might issue the preceding foreach command
    as follows: foreach test (*directory) You can use the pattern matching tools you
    learned about in Lesson 13, “Regular Expressions,” to match any collection of
    filenames you want.


    # RENAMING MULTIPLE FILES


    You’ve probably noticed that the mv command can’t do some really convenient things,
    such as renaming multiple files with new names instead of new locations; this
    is an ideal problem for foreach.


    For example, imagine you have a bunch of files for a pet project, and they’re
    named things such as brokenjunk.start, brokenjunk.today, brokenjunk.gif, and so
    on. Suddenly your boss decides that it’s important that you give these files to
    the development department because they want to demo your project next week. This
    never happens to you, right? If it did, you might want to rename your files to
    something a little more professional. Instead of renaming the files one by one,
    you can use the foreach command to automate the task for you. In this case you
    might type the following:


    ```

    > foreach test (brokenjunk.*)

    > mv $test importantstuff.$test:e

    > end

    ```


    The part of this you might not immediately understand is the $test:e part. This
    says, “Expand the $test variable and toss out everything except for the stuff
    after the last . in the filename”—in this case, the parts that make the files
    different (start, today, and so on).'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'Of course, this isn''t a very useful command for three files, but if you''ve
    got a project with hundreds of files it can save you a lot of typing.


    # Modifying and Replacing Originals


    Another useful trick for which you can use the foreach command is when you need
    to apply a process to each of many files—and you want to do it without creating
    new files, instead just replacing the old ones in-place.


    Say you have a collection of image files, each of which have a border which you
    want to crop off, and then you want to scale them to a smaller size. If the imaginary
    command crop took files on STDIN and wrote its data to STDOUT, you might use the
    foreach command similar to the following:


    ```

    > foreach test (*.gif)

    ? crop < $test > holding

    ? mv holding $test

    ? end

    ```


    Why not just do crop < $test > $test? Because you can''t be guaranteed to get
    away with writing to the file while you''re still reading from it—so you store
    the results in a temporary file named holding. Follow up by using the mv command
    to move the temporary file back to the original filename.


    # Doing it After a While: sleep


    The utility of a command that just sits there for a while is perhaps not readily
    apparent, but you will find uses when you have actions you want to repeat at relatively
    short intervals. If you do run across a situation where you need a shell script
    to pause for a while, you can use the sleep command. Simply issue the sleep command
    as follows: sleep <seconds>. The shell halts until that many seconds have passed.
    It then resumes execution of whatever it was doing.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# DOING IT CONDITIONALLY: while AND if


    If you want to get sophisticated with the control of your automation, you can
    turn to conditional statements that can activate certain sections of your script
    only when certain conditions apply.


    To use conditional statements, you need to create a condition for the statement
    to test. This can be as complicated as you want, but for now, you need to stick
    to simple things such as equal to.


    # while


    The while command, with the syntax while <condition>, does things while a certain
    condition holds.


    Although the following example is amusing, consider the situation where you''re
    feeling really lonely and want to get some email. When you execute /bin/mail,
    all it tells you is No mail. A sad day indeed. So, to try to brighten your day,
    you''ve written yourself a little script that sends email to a few of your friends
    every so often, asking them to email you back. Of course you don''t want to be
    such a bozo that it keeps sending them email even after they''ve replied, so you
    want it to stop after you''ve received email, or to only continue while you don''t.


    If you actually wanted to try this, you might accomplish it by entering a little
    script such as the following:


    ```

    > set hopeful=`/bin/mail | grep -cv No`

    > while ($hopeful==0)

    > echo "please send me mail" | mail myfriend@somewhere.com

    > echo "please send me mail" | mail anotherfriend@elsewhere.com

    > sleep 60

    > set hopeful=`/bin/mail | grep -cv No`

    > end

    ```


    This silly little script is making use of grep to count the lines (-c option)
    which do not (-v option) contain a match for No, and assigning the result to the
    variable named hopeful. Putting the /bin/mail piped into the grep command inside
    single back-quotes causes the shell to execute those commands and return their
    output; this output is what gets assigned to the variable hopeful.'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'Because you don''t have mail, and the only response that mail gives when you
    don''t is No mail, there are zero lines which don''t contain No initially.


    The script uses mail to send out a few pathetic pleas, then goes to sleep for
    60 seconds. Afterward, it checks the status of your mailbox again. If you''ve
    gotten mail in the interim, mail gives headers instead of the No mail response.
    In this case, there will be a number other than zero lines which don''t match
    No. (Assuming, of course, that you''re not such an unlucky person that your friends
    reply: "No, we won''t reply—go away!")


    If there are lines which don''t contain No, hopeful won''t be equal to zero, and
    the while terminates. If hopeful is still zero, well, your friends'' mailboxes
    will fill up pretty fast...


    # USING if


    The if command works in much the same way as the while command, except it doesn''t
    loop; it simply executes one command based on the condition. The syntax of the
    if command is as follows: if ( <condition> ) <command>.


    Using another silly example, if you''re irritated by the fact that you have no
    email and just hate seeing that No mail response, you can use a shell script to
    do something about it. You might try creating yourself a shell-script file named
    checkmail with the following contents:


    ```

    #!/bin/csh

    set foo=`/bin/mail ; grep -cv No''`

    if ($foo == 0) echo "You poor guy"

    ```


    Again, it''s going to use /bin/mail to find out whether you have mail; if you
    don''t have mail, well, your computer will commiserate with you.


    # SUMMARY


    Shell scripting can enable you to add functionality and customize your environment.
    You have the option of doing things as sophisticated as creating small programs,
    or as simple as automating your daily repetitive tasks. Here''s a review of the
    key points of this lesson:


    +   - Your shell scripts can be stored in files to enable you to execute many
    commands by simply typing one.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '+   - There are many different shells—yours might work differently than what
    is presented here, but probably has similar capabilities. If it doesn’t, get a
    better shell!

    +   - The foreach command enables you to repeat a set of commands for each of
    a number of files.

    +   - The while command enables you to repeat a set of commands while a certain
    condition holds.

    +   - The if command enables you to execute a command—or not execute it—based
    on a conditional statement.

    +   - The sleep command does nothing for a while—sometimes this is actually useful.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# LESSON 15

    User Utilities


    ![](img/2c005cbaad58c25c7f54da948131a75e_158_0.png)


    *In this lesson you will learn how to change your password and shell, and to modify
    other information.*


    UNIX provides a wealth of utilities to help you control the information that the
    system stores for your user account. In this lesson, you''ll see how to monitor
    the use of your system through some useful command-line utilities.


    # CHANGING YOUR PASSWORD: passwd AND yppasswd


    One of the most important things you''ll need to do in a networked environment
    is change your password. Passwords generally need to be changed somewhat frequently
    in order to maintain a secure environment.


    There are two ways that a password can be changed. If you are in a networked environment
    you might have to use the yppasswd, which updates your password on all the networked
    machines. The most obvious way of telling if this is the sort of environment you''re
    working in is if you can log into multiple computers with the same username and
    password and access the same information. This is a common setup for UNIX computer
    labs. If your machine is an isolated UNIX computer, just use the passwd command
    and you will be fine. The two commands operate in an identical manner, it is simply
    where the updated password is stored that is different.


    For example, type the following:


    ```

    >passwd

    Changing password for jray

    Old password: *****

    New password: *****

    Retype new password: *****

    Password successfully changed

    ```'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'The passwords you type are not echoed to the display as you type them. Asterisks
    were included here to show that typing is taking place. If the password change
    is successful, UNIX indicates that with a message such as, "Password successfully
    changed." In some cases, UNIX can keep you from choosing certain passwords if
    they are too short or based on words in its built-in dictionary file. If your
    UNIX machine is set up this way and you enter an unacceptable password, the passwd
    command usually tells you what you need to do to correct it. Choose passwords
    that mix letters, numbers, and letter cases, and that are not based on common
    words.


    # CHANGING YOUR SHELL: chsh


    In the beginning of this book, you learned that there are a variety of different
    shells that you can run. Now you’re going to learn how to change them. With the
    chsh command you can choose one of the shells that is registered for use on the
    machine. Before you actually change the shell, you might want to see the shells
    that are available on your computer. You can do this with the chsh -l command,
    as follows:


    ```

    >chsh -l

    /bin/bash

    /bin/sh

    /bin/ash

    /bin/bsh

    /bin/tcsh

    /bin/csh

    /bin/ksh

    ```


    In this example, there are seven different shells that you can choose from. If
    you wanted to go ahead and change to ksh from your current choice, you would do
    the following:


    ```

    >chsh

    Changing shell for jray.

    Password: ****

    New shell [/bin/bash]: /bin/ksh

    Shell changed.

    ```


    The next time you logged in to your machine, you would be in ksh instead of your
    previous shell. You probably won’t ever need to change your shell, unless the
    default shell on your system is the Bourne shell'
  merge: -1
  img_proc: true
- pgno: 160
  md: "(sh). If you want to try other shells, feel free; you can always change back.\n\
    \n# GETTING AND CHANGING USER INFORMATION: finger AND chfn\n\nEach user has a\
    \ few pieces of information about their physical address stored as part of the\
    \ system password file. This enables other users to quickly find the information\
    \ necessary to contact them. The command that displays this user data is finger.\
    \ User information can be stored when the user account is created, but frequently\
    \ system administrators don't have time to fill this out; so, yours might be incomplete,\
    \ or even empty. In order to change that, you'll use chfn.\n\n# USING finger\n\
    \nUsing the finger command is simple. Just use finger <username> to get information\
    \ about a user who is local to your system. To get information about someone on\
    \ a remote system, you can try the following: finger <username>@<remote host>.\
    \ Depending on how the remote host is configured, and the type of remote host,\
