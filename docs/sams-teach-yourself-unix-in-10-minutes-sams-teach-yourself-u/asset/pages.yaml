    Your machine will respond:


    "mynewfile" [New file] 4 lines, 119 characters


    Now, look at what you''ve got.


    ```

    > cat mynewfile

    This is my new file

    This is line two of my new file

    This is line three of my new file

    This is line four of my new file

    ```


    # THE KING OF EDITORS: emacs


    On the other end of the spectrum from vi''s odd syntax and tiny footprint is emacs.
    In certain circles it is thought that emacs is an acronym for "emacs makes a computer
    slow" because emacs is certainly the editor of all editors. Including an email-reading
    client, a news-reading client, a programming language, an online help database,
    and a windowing system (to name only a few of its features), emacs can almost
    certainly do anything that you want an editor to do. With today''s faster machines
    and nearly unlimited memory, emacs might even be able to work fast enough that
    you don''t need a coffee break while it starts up.


    From the point of view of the average user, emacs has a much more intuitive interface
    than vi. You''re always in insert mode, and Control functions are handled by using
    Control+key sequences instead of a separate mode. To make use of emacs, you need
    to do the following:


    +   1. Determine the name of the file you want to edit.

    +   2. Issue the emacs command as emacs <filename>. The emacs editor can also
    be started without a filename if you want to create a new file.'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'After you''ve started emacs, you''ll need to know some basics to make it useful.
    (But you hardly need the list that follows because emacs starts up by immediately
    giving you a list of ways to get help.) In the following list, whenever you see
    Ctrl+ preceding a character, it means that you need to hold down the Control key
    and type that character:


    +   - The emacs editor doesn''t have a separate mode for entering commands. You
    are always either typing a command or typing text—no switching modes between them.
    This is just like most word processors that you might be familiar with. To enter
    text, just type what you want to appear; to enter a command, just type the command
    (usually Ctrl+something, or Esc x something).

    +   - You can position the cursor keys in emacs by using the arrow-key keypad
    in most every version of emacs and terminal combination. If the arrow keys don''t
    work, you can also position the cursor by using Ctrl+f to move forward, Ctrl+b
    to move backwards, Ctrl+p to move to the previous line, and Ctrl+n to move to
    the next line. Newer versions of emacs also enable you to position the cursor
    using the mouse, but many users actually find this less convenient than the cursor
    keys.

    +   - You can delete everything from the cursor to the end of the current line
    by typing Ctrl+k.

    +   - Ctrl+g is the emacs "quit what you''re doing" command—if you''ve started
    typing a command and change your mind, use Ctrl+g.

    +   - If you use Ctrl+k to delete a line or lines, you can type Ctrl+y to yank
    them back again.

    +   - To save the file you''re currently editing, type Ctrl+x Ctrl+s.

    +   - To save the file to a new filename, type Ctrl+x Ctrl+w <filename>Return.

    +   - To exit emacs type Ctrl+x Ctrl+c. If emacs proceeds to ask you about unsaved
    buffers, it''s because you have unsaved work. You can either go back and save
    your work, or answer Yes to the "quit anyway?" question and go about your business.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# COMMAND BASICS


    Beyond the set of Ctrl+ commands available in emacs, there’s also an amazingly
    extensible set of commands which come in to play if you use the escape key. These
    commands are usually known as emacs meta commands, even though the machine with
    the meta key from which they draw their name has long since faded into history.
    Although they’re too complicated and too specific to cover in this book, access
    to many of the interesting emacs meta commands is accomplished by typing Esc x,
    and then typing a command of some sort, such as info, what-line, or goto-line.
    As a matter of fact, you can find many useful emacs commands by entering Esc x
    and then typing a few characters (that is, the beginning of what you think the
    command might be named), followed by a space. The editor then gives you a list
    of all commands with similar names; frequently, one that does what you want is
    on the list!


    One useful meta command that you might want to try is as follows: start emacs,
    and then type Esc+xhelp+Spacebar (and a second space, if the first one just results
    in the help you typed being extended by a dash). This will bring up a list of
    emacs commands that start with help—including useful things such as "help-for-help,"
    a very good place to start.


    # THE emacs TUTORIAL


    Instead of a quick example for you to pick through, emacs provides its own help
    and tutorial functions. New users are always encouraged to take the emacs tutorial
    to introduce themselves to the features of the editor, and to learn how to ask
    it for help on other features.


    To enter the emacs tutorial, all you need to do is start emacs, and type Ctrl+h
    (hold the Ctrl key down, hit h, release the Ctrl key, and hit i). If you type
    a ? after the Ctrl+h—instead of the i—you’ll see that there’s actually a whole
    world of alternatives to the i; these alternatives give you a large range of different
    types of helpful information. For now, take the tutorial. If you’re curious, you
    can probably spend a few months exploring the other options.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# DESKTOP ENVIRONMENT TOOLS: KDE''S BUILT-IN EDITOR


    Many desktop environments, such as KDE, provide a very convenient point-and-click
    text editor with all the convenient mouse-based functionality you have probably
    come to expect from personal-computer editing programs.


    To activate the KDE editor click on the K in the KDE toolbar. Now, choose Applications
    from the popup menu, and then Editor from its submenu. A window that looks like
    the one shown in Figure 8.1 will open.


    ![](img/2c005cbaad58c25c7f54da948131a75e_102_0.png)


    FIGURE 8.1 The KDE desktop environment built-in editor.


    **Editor Patience** Sometimes it takes a few seconds for X Windows-based applications
    to start—and there''s no spinning watch cursor to show you that the machine is
    actually doing what you asked it to. Don''t worry if the editor doesn''t open
    immediately. If you select the editor again before it opens, you''ll eventually
    end up with two editors running.'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'The built-in KDE editor includes all the normal point-and-click selection,
    copying, insertion, and deletion features you might expect of a GUI-based editor.
    In addition, it uses KDE''s abstraction of data location to allow things such
    as opening and saving files directly from Web-based URLs. In Figure 8.1, you can
    see that one of the KDE text editor menus is selected. Several of these convenient
    features are visible on the drop-down menu that has appeared.


    # SUMMARY


    In this lesson, you were introduced to the two most popular text editors on the
    UNIX platform: vi and emacs. It is best with both of these editors to learn by
    doing, and this lesson will provide you with the tools necessary to do the three
    most important tasks in a text editor: starting the editor, editing text, and
    exiting gracefully if you screw up. Because you know how to quit both vi and emacs
    without saving, don''t be afraid to experiment. You also learned about KDE''s
    built-in editor as a desktop environment alternative to the text-window based
    editors from the older UNIX world. Following is a review:


    +   - The vi editor is fast and convenient for making small changes to files.
    It has a user interface that might be called non-intuitive at the kindest. The
    omnipresence of the vi editor, its speed of execution, and its small disk-space
    requirements make it a convenient choice for fast edits—and for when you''re working
    at an unfamiliar machine.

    +   - Esc:q! gets you out of vi in a hurry, and without saving any changes you''ve
    made.

    +   - The emacs editor contains everything you need in an editor, and then some,
    and then some more. On older hardware, emacs was a very slow to start, very slow
    to respond editor, but this has been largely mitigated by today''s fast machines
    and extremely inexpensive disk space and memory. Take the emacs tutorial, dig
    around in its info files (Esc+xinfo+Return), and find a book on emacs to read
    if you want to get the most out of this editor.

    +   - Ctrl+x Ctrl+c, followed by answering Yes to any "quit anyway?" questions,
    gets you out of emacs in a hurry, and without saving any changes you''ve made.'
  merge: -1
  img_proc: true
