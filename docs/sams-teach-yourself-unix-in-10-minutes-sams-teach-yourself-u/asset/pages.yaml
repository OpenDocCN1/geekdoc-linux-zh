- pgno: 106
  md: 'Everything is sorted as you might expect. Now, what if you want to sort by
    the number instead of by the name? To do this, you need to follow these steps:


    +   1. Decide which column you want to sort by, and then inform sort of your decision
    by using +<columnnumber> as an argument to the command.

    +   2. You also need to tell sort what character is separating the columns by
    using the -t option. In this case it''s a few spaces, so you''d use -t " ".

    +   3. Lastly, because there are a varying number of spaces between the name and
    number, you''ll need to use ignore blanks option -b to tell sort to count a group
    of spaces as a single space.


    For example


    ```

    >sort +2 -t " " -b kiwi1.txt

    Kama 05

    Jack 07

    John 21

    Will 78

    Joan 92

    Kim 99

    ```


    Bingo! Exactly what you were hoping for, right? Now the file is sorted by the
    numbers in the second column. sort has many more options that you can explore
    on your own with the man pages, but you can see how it can be used to sort a variety
    of data stored in different formats.


    # CHOPPING UP FILES: split


    Suppose you need to email a huge file to a friend, but their email system doesn''t
    support receiving such large messages. Is it time to write a special splitting
    utility? Nope, it''s already been done for you. The split command can cut a file
    into whatever length segments you want, based on the number of lines in a file
    or the bytes. Follow these steps to use split:


    +   1. Choose your input file. For this example, I''m using kiwi.txt from the
    sort command.'
  merge: -1
  img_proc: true
- pgno: 107
  md: "+   2. Determine the number of lines you want stored in each output file. You'll\
    \ specify this by using -l <number of lines> as an option to the sort command.\
    \ If you prefer to use the number of k or MB, you can use the -b option with k\
    \ or m. For example: -l 3 divides a file into segments of three lines each; using\
    \ -b 10k results in segments 10k in size; and -b 10m creates 10 megabyte segments.\n\
    +   \n+   3. Choose a base output filename for the results.\n+   \n+   4. Invoke\
