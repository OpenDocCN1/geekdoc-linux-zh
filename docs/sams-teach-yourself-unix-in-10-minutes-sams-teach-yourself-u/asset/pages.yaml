    216.106.18.176 - - [28/Nov/1998:00:52:55 -0500] "GET

    /../HTTP/1.1" 200 15679

    ```


    The last ten entries from the Web server log are displayed. Because the log file
    is around 50MB in size, it''s a good thing you don''t have to read through it
    with cat or more just to see what''s at the bottom! You can change the number
    of lines that tail displays by using the -# option just as you do with head.'
