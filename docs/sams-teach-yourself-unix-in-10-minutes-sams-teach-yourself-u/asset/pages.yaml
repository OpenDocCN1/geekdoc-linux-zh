  md: '# ABOUT THE AUTHOR


    William Ray is a UNIX system administrator, programmer and trainer. After acquiring
    a B.S. in Mathematics and an M.S. in Computer Science, Will spent five years getting
    paid to have fun—as a programmer building X Window System user interfaces. For
    the past six years, he has been perpetually two years away from attaining his
    Ph.D. in Biophysics. To maintain his sanity while arguing with test-tubes and
    microbes, Will developed a computer-graphics center for The Ohio State University''s
    College of Biological Sciences. Supporting an assortment of Silicon Graphics and
    Sun UNIX hardware, Will has been the center''s system administrator, Webmaster,
    and acting director. He also has provided user support and UNIX training for several
    hundred students and faculty members who have come to use the center.


    In a recent attempt to shorten the two-year graduation horizon, Will trained his
    wife to take over the center''s administration. While this seems to have shortened
    the graduation timeframe, he appears to be incapable of keeping his nose out of
    computer topics. So, he has been distracting himself by writing computer texts
    and pestering his wife about the center.'
