- pgno: 140
  md: '**Shell Variations** If you''re using another shell, be aware that redirection
    is one of the places where syntax varies significantly. Check the man pages for
    the shell of your preference to learn more.


    # PIPES


    Not only can UNIX redirect STDIN and STDOUT from and to files, but because these
    are data streams to UNIX it also provides the idea of piping these streams directly
    between different programs. With pipes you can use the STDOUT of one program directly
    as the STDIN of another.


    To create a pipe in UNIX, you simply use a | character between the programs on
    the command line.


    Again, using an example is so much more illustrative than a lot of words. Take
    the example of your compulsive collecting of your Web server log-files. If, instead
    of collecting them in files, you want to amuse and amaze all your friends by sending
    them the tail end of the file (using email is discussed in Lesson 18, "Accessing
    the Network Resources"), you can do so without saving it in a file by using the
    following command:


    ```

    > tail -30 /usr/local/httpd/logs/access_log | mail

    ```


    Thus far, your repertoire of UNIX commands probably isn''t large enough to make
    this a truly useful feature of you, but as you learn more about UNIX you will
    find it a powerful tool for simplifying your tasks.


    For now, one way in which you can make this feature work for you is by piping
    things into pagers. For example, if you want to be able to page through the output
    of the ls command, you can pipe it into more. Try typing the following:


    ```

    > ls -lRaF / | more

    ```


    You see a particularly long listing of files; if you don''t eventually press Ctrl+c
    to get out of this list, it can go on for days. Because this is really a complete
    recursive listing of your entire filesystem in long format, you''re not going
    to use this particular ls command too often. But any time you want to page through
    an ls listing—or any other program output that flows off your screen—you can pipe
    it into more.'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'Watch future examples carefully because the pipe will appear in more useful
    contexts throughout the rest of the book.


    # SPLITTING A PIPE: THE tee COMMAND


    On occasion, you might want to direct STDOUT to a file while continuing to send
    it down a pipe to another program. In such a case, you can use the tee command.


    Consider the (increasingly tedious) example of collecting the tail of Web logs.
    If you aren''t satisfied with just emailing it to your friends as in the previous
    example, you can use the tee command to save it to a file at the same time. Type
    the following:


    ```

    ```bash

    > tail -30 /usr/local/httpd/logs/access_log | tee kiwi_logs

    > logs | mail friend@somewhere.com

    ```

    ```


    This helps you out if you want to both save the tail of the file in kiwi_logs
    and send it to annoy your friend.


    # SUMMARY


    In this lesson, you were introduced to the UNIX model of process input and output,
    and to the easy way in which UNIX enables the user to connect programs together
    to accomplish complex tasks. Here''s a review of some of the key points:


    +   - Every program has a STDIN, a STDOUT, and a STDERR. Not all programs use
    them for user interaction (programs such as PhotoShop just don''t lend themselves
    to command-line control), but for the vast majority that do, these input and output
    connections can be manipulated.

    +   - You can provide the input data that a program expects on STDIN by hand,
    from a file, or from another program.

    +   - You can send the STDOUT and STDERR of a program into a file if you want
    to collect it for future use rather than viewing it as it is produced.

    +   - You can pipe the STDOUT of one program into the STDIN of another.

    +   - One immediately useful thing to do with pipes is to pipe the output of particularly
    verbose programs into a pager (more, less).'
