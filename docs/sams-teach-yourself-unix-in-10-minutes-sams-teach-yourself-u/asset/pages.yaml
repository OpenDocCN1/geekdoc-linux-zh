    FIGURE 18.1 KDE provides several graphic network clients, including an email client.


    # The .forward File


    If you want email that comes to your account to automatically send itself somewhere
    else, you can make use of the .forward file. Not only can the .forward file be
    used to forward your email to another email address, but it can also be used to
    forward your email into programs if you want to use software to process your email.


    The format of the .forward file is simple:


    +   - To forward your email to another email address, create a file named .forward
    in your home directory. Into this file, put a single line containing the address
    to which you want your mail forwarded. Execute the command `chmod 644 ~/.forward`
    to set the permissions properly (some flavors of UNIX are particular about this),
    and you''re done. All email coming to your account is forwarded to the new address.

    +   - To forward your email into a program for automatic processing, create the
    .forward file in your home directory. In the .forward'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'file, put a single line containing the pipe character | followed by the path
    to the program that you want to use. Run chmod on the file as with forwarding
    your email to another account, and you''re done. Incoming email is then piped
    into whatever command you put in the .forward file.


    # Summary


    In this lesson, you were introduced to a sampling of tools that enable you to
    make use of the network resources around you—and around the world. As you explore
    UNIX you''ll find that this was really only a small sampling, and that there are
    new tools for you to use appearing constantly. Some will be replacements or upgrades
    for the commands outlined here, and others will be completely new. Don''t be afraid
    to try them out. Here''s a quick review of this lesson''s key points:


    +   - The telnet command can connect you to remote machines. If you have different
    accounts on different machines, you''ll probably find yourself using it frequently.

    +   - The rlogin command also connects you to remote machines, but is more useful
    than telnet if the machines you work on are configured to allow you to rlogin
    between them without giving a username or password.

    +   - The slogin command provides security for remote connections. If you have
    it, use it. With people breaking into UNIX machines daily, the network is becoming
    a very scary place. Using the secure connection provided by slogin protects your
    network traffic from prying eyes.

    +   - The trn and rn commands read Usenet newsgroups. Newsgroups can be a lot
    of fun and useful in finding information, but they can also be a big drain on
    your time.

    +   - The ftp command connects you with ftp servers and enables you to transfer
    files around the world.

    +   - Netscape is available for many UNIX platforms. Lynx is a fast text-based
    Web browser. Both are useful for accessing World Wide Web resources.'
  merge: -1
  img_proc: true
