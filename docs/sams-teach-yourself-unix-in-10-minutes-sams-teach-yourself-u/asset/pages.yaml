- pgno: 37
  md: '![](img/2c005cbaad58c25c7f54da948131a75e_37_0.png)


    # LESSON 3


    # THE GRAPHICAL USER INTERFACE


    *In this lesson, you will learn the basics of the X Windows GUI in addition to
    enough information to get you started on configuring and customizing your environment.*


    # X WINDOWS OVERVIEW


    Although most flavors of UNIX can be accessed via a command-line interface from
    the console, there is also an easier way. On top of the command-line interface,
    a variety of graphical-user-interfaces (GUIs) are available. A few of these GUIs
    are proprietary, but the majority conform to an open-standard interface called
    the X Window System, or X Windows. Some manufacturers have extended the X Windows
    standard with proprietary enhancements. Unfortunately, these enhancements can
    cause parts of the interface to be incompatible with remote display on other varieties
    of UNIX. Because the general principles are similar, though, you''ll find that
    a familiarity with one GUI translates well to the others.


    # X WINDOWS BASICS


    Unlike the Macintosh and MS-Windows environments, X Windows is a system that provides
    a set of interface display functions.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '> X Marks the Spot  X Windows is usually referred to as X#, where # is the
    major revision number; or, you might come across X#R n, where # is the major revision
    number and n is the minor revision. As of this writing, X11R6 is the current version,
    but it is generally referred to as X11—or, more simply, just X.


    X Windows provides facilities for programs to display windows, buttons, and other
    user-interactive widgets. It is actually implemented as a type of server program
    running on the computer. Client programs that want to make use of X Windows display
    functionality make requests to the server, asking it to perform certain display
    functions. It does not matter to either the client or server application whether
    they are running on the same machine or are separated by miles of network—the
    client makes display requests and the server tries to honor them.


    An additional difference between personal computer windowing systems and X Windows
    is that the interface''s look and feel is controlled by a separate program rather
    than by the X Windows server. In the X Windows model, the X server is responsible
    for handling client display requests such as requests for displaying windows.
    However, unless a client specifically draws a title bar for itself, X won''t give
    it one. A separate program must be run to create title bars and to actually manage
    user interactions such as moving windows around, iconizing/minimizing windows,
    or providing application-dock functionality.


    # STARTING X WINDOWS


    On many UNIX boxes, the system administrator has configured X so that it starts
    automatically when the machine boots. If your system does not automatically start
    X, then you need to start it manually after you log in. The two most common ways
    to do this are the program xinit and a shell script called variably startx, x1,
    or xstart. If you''re on a plain-vanilla Solaris box, you might have to use /usr/openwin/bin/openwin.
    startx (and its variants) is usually a shell script that automates some of the
    calls to xinit. This is a good place to start browsing if you''re curious about
    how things are done and what options are available. (Shell scripts are covered
    in Lesson 14, "Basic Shell Scripting.")'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'After the X server itself starts, you need to start some X applications. Usually,
    a default set of these is started by the automatic execution of the file .xinitrc
    located in your home directory. Some variants of UNIX don''t use this file, or
    they use it in counter-intuitive ways. For example, IRIX uses .xinitrc if it''s
    present; if not, IRIX uses its own proprietary configuration utility. Some variants
    of Linux use files named ****.m4. Your system administrator can change the default
    configuration. If you can''t find .xinitrc, you might find that your system remembers
    what windows you have open and where they are positioned between logins “automagically.”


    The .xinitrc file—if present—contains a series of lines similar to the following:


    ```

    #!/bin/sh

    xrdb -load $HOME/.X11defaults

    xscreensaver -timeout 10 &

    xterm -geometry 80x30+10+10 &

    ```


    If this in fact was your .xinitrc file, when you started X11 the .xinitrc file
    would:


    +   - Line 1—Run itself via the bourne shell, sh.

    +   - Line 2—Load the server resource database (discussed later in this lesson)
    from the file .X11defaults in your home directory.

    +   - Line 3—Start the command xscreensaver, assign a 10-minute timeout, and place
    it in the background.

    +   - Line 4—Start an xterm (terminal), which is 80 characters wide by 30 characters
    high, placing it 10 pixels from the top and left of your screen.


    You''ll see more examples of command-line options to X programs later in this
    lesson.


    # USING X WINDOWS


    The look and feel of X Windows is mostly the responsibility of the particular
    window-manager you''ve chosen to run. (You can learn more about window managers
    and some of their options later in this lesson.) You''ll find that there are a
    number of constants between the various managers. Some of these consistent features
    might be familiar to anyone who has'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'previously used a computer with a mouse. A few, however, are likely to be new
    even to users familiar with the Macintosh and MS-Windows environments. The significant
    things to remember are:


    +   - **X is designed for a three-button mouse**—Most X software makes use of
    the left button for pointing, clicking, and selection. X uses the center button
    for general functions such as moving or resizing windows, and the right button
    for application-specific functions such as opening in-application pop-up menus.
    Of course, any application is capable of modifying these uses, so examination
    of the documentation is always appropriate.

    +   - **X has the concept of focused input**—On the Macintosh or MS-Windows platforms,
    if you type on the keyboard you generally expect the typing to appear in whatever
    window or dialog box is active—this isn’t the case with X Windows. In X, the window
    manager has the option of focusing your input anywhere it chooses. Most window
    managers can be configured to either focus input on the foremost window, focus
    input on a selected window (X does not have to be the foremost window), or focus
    input on whichever window the cursor is over. The last option, although unlike
    the interface you might be familiar with, is usually considered to be the most
    powerful. With the window manager configured so that focus follows the cursor,
    you can direct typing into a mostly hidden window—for example, to start a non-interactive
    program—by simply moving the cursor over any visible part of the mostly-hidden
    window and typing. No need to waste time bringing that window to the front, typing
    the command, and then shuffling the window back underneath the window that you
    really wanted to be working in.


    ![](img/2c005cbaad58c25c7f54da948131a75e_40_0.png)


    > **If Your Input Disappears** If you''re typing and you notice that what you''re
    typing isn''t appearing where you think it is supposed be, chances are you''ve
    got your input focused in some other window. Check to make certain that your cursor
    is where it belongs, or—if your system is configured for click to focus—that you''ve
    clicked where you intend to type. It''s very easy to get confused when moving
    between platforms using different input-focus methods.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'In X, the window manager or any other program can attach arbitrary commands
    to arbitrary user actions. For example, a program can attach the action of displaying
    a menu when a user right-clicks on the title bar. The window manager can pop up
    a variety of menus when the user left-, right-, or center-clicks in the empty
    background of the windowing system; or it could happen when the user shift-left-,
    shift-right-, or shift-center-clicks— the possibilities are endless. One popular
    terminal program, xterm, pops up its configuration menus when the user holds down
    the control key and left-, right-, or center-clicks in the window. Some window
    managers attach a standard menu with common commands such as close and resize
    to each application''s title bar. Others attach these functions to pop-up menus
    or buttons in the title bar. You''ll find variations in program behavior even
    among different installations of the same UNIX flavor. Local configuration options
    can exert a significant influence over the interface. The best advice on how to
    find any particular option or command is to read the available documentation and
    to ask other local users.


    Most window managers can iconize windows. Because the actual display of the client
    program''s windows isn''t handled by the client, the X server and window manager
    are free to make some useful contributions to the user experience. One of these
    contributions is that when the client requests a window with particular characteristics,
    the server isn''t obliged to represent the window that way to the user—it is required
    only to treat it as though it had those characteristics. This enables the server
    to, for example, scale the window arbitrarily, or to shrink it down and treat
    it as an icon. If you''re familiar with the idea of a task bar or application
    dock, you can think of iconized windows as windows that have been minimized, but
    that you can store anywhere on your screen.


    # CONFIGURING X WINDOWS


    Most configuration of X Windows is handled by a server resource database. When
    a client makes a request of the server, the server checks this database to determine
    user preferences for that client. The server resource database is loaded on a
    per-user basis via the command xrb, which needs to be executed automatically after
    starting X11. xrb loads configuration information from a dot file usually named
    .X11defaults. (Dot files are discussed in Lesson 16, "Modifying the User Environment".)
    .X11defaults usually contains lines similar to the following:'
  merge: -1
  img_proc: true
- pgno: 42
  md: "```\nxbiff*onceOnly:\t\t on\nxbiff*_wm_option.autoRaise:\t off\nxbiff*mailBox:\t\
    \t /usr/spool/mail/mymail\n```\n\nIf you include these lines in your .X11defaults\
    \ file, you are telling your X server that if xbiff (an X11 program that notifies\
    \ you when you have new mail) starts, it needs to set certain options:\n\n+  \
    \ - Line 1 — Sets an xbiff-specific option regarding the frequency of ringing\
    \ the bell to notify you.\n+   - Line 2 — Sets an option regarding the window\
    \ manager's treatment of xbiff—it specifically tells the window manager not to\
    \ bring xbiff to the front if it's behind other windows when it needs to notify\
    \ you. (Remember, X11 provides the display and a separate program provides management\
    \ of things such as window controls.)\n+   - Line 3 — Tells xbiff where to find\
    \ the mailbox that it's supposed to look at.\n\nBecause each client supports different\
    \ options and allows the window manager different levels of control, you'll need\
    \ to consult each client's documentation to learn what you can configure and what\
    \ you need to do to configure it.\n\nIn addition to the server resources database,\
    \ clients frequently have command-line options that can control the client's interaction\
    \ with X11. Take a look at the following command:\n\n```\n> xterm -fg \"black\"\
    \ -bg \"white\" -fn 6x10 -geometry 85x30+525+1\n```\n\nThis starts an xterm session\
    \ with the following configuration: black as the foreground color, white as the\
    \ background color (black text on a white window), and a 6x10 point font. It also\
    \ sets the geometry information such that the window is 85 characters wide, 30\
    \ characters high, and placed 525 pixels from the left edge of the screen and\
    \ 1 pixel down from the top.\n\nAgain, different programs have different options\
    \ available and your local documentation is your best source for up-to-date information\
    \ on your exact configuration."
  merge: -1
  img_proc: true
- pgno: 43
  md: '# WINDOW MANAGERS


    Because X Windows provides only rudimentary user-interface-component display functionality,
    an additional program is required to provide a useful user interface. This program
    is the window manager. Depending on the variation of UNIX you are running, you
    might have a number of options for different window managers. Each provides slightly
    different features with accordingly different strengths and weaknesses.


    # twm


    One of the most common—and least-featured—window managers is twm. twm, shown managing
    the display in Figure 3.1, provides very basic window management functions and
    is present or available on almost all UNIX implementations. If you work in a multi-platform
    environment with different flavors of UNIX, you might find twm to be convenient
    because your configuration can be identical on all the machines. For its simplicity,
    twm also provides some of the best user extensibility of the interface. If you
    like, you can create your own standard buttons that appear in your twm title bars
    to execute arbitrary commands. You can also build your own pop-up menus, automatically
    execute commands when the cursor enters windows, customize window manager colors
    and actions by application name and type, and a host of other customizations.
    To start the twm window manager, execute twm after starting X (you can probably
    do this automatically in your .xinitrc file). The control file for all this customization
    is named .twmrc and is probably located in your home directory.


    As you can see in Figure 3.1, twm enables you to have a number of windows open
    at once. During window layering—even though windows might be partially covered
    by one another—you can focus input to the hidden windows, enabling you to work
    in any open window. Active applications that have been iconized can be clicked
    to be returned to their normal size.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '![](img/2c005cbaad58c25c7f54da948131a75e_44_0.png)


    FIGURE 3.1 twm managing an X Windows session.


    # OTHER WINDOW MANAGERS


    Other window managers you might encounter depending on the variation of UNIX you
    are running include


    +   - olwm—Sun’s default manager for the OpenWindows environment.

    +   - mwm—The Motif window manager. Many commercial window managers are based
    on, or try to emulate, mwm.

    +   - 4dwm—The default window manager for SGIs running IRIX.

    +   - tvtwm—An experimental extension of twm which includes the capability to
    set up virtual screens.'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'There are many other window managers, and a variety will most likely be available
    to you for use on your machine. After you''ve investigated your options, you can
    start building a custom environment that feels and behaves exactly as you want
    it to.


    Remember, it is the window manager that provides user-interface features such
    as title bars. If you find yourself facing a screen which looks like Figure 3.2
    (windows missing title bars, no scroll bars, no icons) it is because there is
    no window manager running; it either hasn''t started for some reason, or it has
    crashed. You can try starting a window manager by typing twm—if there is a terminal
    window open that is accepting keyboard input (directing keyboard input to a particular
    window is also a window manager function). If not, you''ll need to exit the X
    Windows environment and modify your startup files to start the window manager
    of your choice immediately after starting the X server.


    ![](img/2c005cbaad58c25c7f54da948131a75e_45_0.png)


    Figure 3.2 This X Windows session has lost its window manager.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# Desktop Environments


    Historically, window managers have only been used to manage the user''s screen.
    A new type of windowing application is emerging, however. This type functions
    not only as a window manager in the classical sense, but also provides additional
    functionality to the user. These desktop environments typically provide sophisticated
    window management as well as a sort of desktop that is reminiscent of the MS-Windows
    or Macintosh interface. The desktop frequently includes file management functionality,
    the capability to create and use icons to launch applications, and an integrated
    suite of graphical tools for the management and configuration of the computer.


    As UNIX vendors try to make their machines more convenient to use, you can expect
    these desktop environments to become more sophisticated; even today, though, the
    power and simplicity are quickly approaching that of the popular personal computer
    interfaces.


    Although some of the industry heavy-hitters such as Sun and SGI have weighed in
    with significant offerings such as OpenWindows and the IRIX desktop, one of the
    most significant contributions is being made by a non-profit Internet collaborative
    effort that is developing the freeware product KDE. KDE is a freely-available
    and downloadable desktop environment that is compatible with a wide range of UNIX
    implementations.


    # KDE


    KDE stands for the K Desktop Environment, and—according to the authors—the K stands
    for nothing. KDE, rather than one of the commercial desktop environments, is discussed
    here because of its surprising level of sophistication and its portability to
    such a wide range of platforms.


    ![](img/2c005cbaad58c25c7f54da948131a75e_46_0.png)


    > Compatibility According to the KDE FAQ, KDE is currently known to support Linux,
    Solaris, FreeBSD, IRIX, and HP-UX, and is expected to be compilable on almost
    anything which uses the gnu gcc compiler.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'KDE provides a sophisticated window manager with convenient extensions such
    as multiple virtual screens, user-customizable menus, and a facility to automatically
    remember programs and their placement on the screen between login sessions.


    In addition, KDE provides a desktop environment that supports, among other things,
    icons for files and directories, an application dock, and a quick launch button
    bar. As you can see in Figure 3.3, the user interface provided by KDE is significantly
    more user-friendly than the twm (and other typical window manager) interfaces.


    ![](img/2c005cbaad58c25c7f54da948131a75e_47_0.png)


    Figure 3.3 KDE makes X Windows friendly.'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'Following is a look at some of the KDE window features:


    +   - **KDE Window List**—Shows you a list of all the windows that are currently
    available, even if they''re completely hidden on the screen.

    +   - **Application-Specific Widget**—The leftmost widget on the title bar. Its
    functions are specific to the application associated with the window.

    +   - **Pushpin Widget**—This button locks the window to your display, making
    it available on any virtual screen you access.

    +   - **Iconify, Expand, and Destroy Window Buttons**—These buttons give you control
    of the window; minimize it, maximize it, or close it entirely.

    +   - **KDE Quick-Start Application Icons**—Puts you one click away from your
    most frequently used programs.

    +   - **KDE Toolbar**—This panel includes pop-up menus to start programs, select
    windows, and configure your environment, as well as other useful utilities.

    +   - **KDE Environment Setup Utility**—Allows you to control such things as your
    screen saver, display settings, and so on.

    +   - **KDE Desktop Icons**—These icons which live on your desktop represent files,
    directories, or applications.


    In addition to user interface sophistication, KDE provides an integrated suite
    of tools for configuring your machine and your user interface, and offers a set
    of useful point-and-click interfaces to general UNIX programs and utilities. Some
    of these utilities will be discussed in other lessons; so, if you''re using a
    desktop environment of some sort already, pay attention to these sections to see
    how KDE—and desktop environments in general—can make your life easier.


    If you''re looking for a way to make your UNIX experience feel a bit more like
    your personal computer, look into whether your system administrator can install
    KDE for you.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# SUMMARY


    This lesson taught you about the background of graphical user interfaces, and
    about the X Window System in particular. Understanding X Windows will enable you
    to take advantage of these graphic-based tools.


    +   - X Windows is based on a client/server model. The client runs anywhere you
    want it to and makes display requests. The server runs on the machine with the
    display screen and attempts to honor those requests.

    +   - The X Window System requires a window manager to implement user-interface
    conveniences such as title bars.

    +   - X Windows mice can behave in strange ways—if at first you don’t succeed,
    click and click again.

    +   - X Windows can focus keyboard input to a window in a number of different
    ways. Pay attention to where your cursor is.

    +   - In the X Windows environment, icons usually represent minimized windows
    rather than applications.

    +   - The advent of desktop environments is bringing application icons to the
    world of X Windows.


    For all the power of desktop environments, and all the automation of newer window
    managers, their configurations are usually stored in ugly text files in your home
    directory. If you want to duplicate your environment from one machine to another,
    these are a good place to start.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# LESSON 4


    # THE FILE SYSTEM


    ![](img/2c005cbaad58c25c7f54da948131a75e_50_0.png)


    *In this lesson you''ll learn the basics of the UNIX file system as well as a
    few convenient tricks to make your UNIX life easier.*


    To a beginner, the UNIX file system can appear to be a strange and uninviting
    place—so many files, and you with just a command line to type at. Bear skin and
    stone knife time, right? Wrong. Although access to the UNIX file system might
    initially appear cryptic and primitive, UNIX provides extremely sophisticated
    file access and control. This sophistication is born of many simple commands from
    which more complicated commands can be constructed.


    # FILE SYSTEM DESIGN


    Before even the simple commands will make sense, you need to understand a few
    things about the design of the UNIX file system. Although this might not seem
    like a very important part of the user experience, the UNIX file system is a bit
    different than the personal computer file systems you might be familiar with.
    Actually, you will probably find the biggest differences to be to your liking.


    *UNIX file systems have a single root directory.* Unlike Macintosh file systems
    with their multiple drive icons on the desktop or Windows file systems with their
    ABCs, the UNIX file system has a single top-level directory—the *root* directory.
    UNIX considers its files to be arranged in what is essentially a tree shape, with
    the root directory as the base, or root. UNIX''s tree, however, is upside down
    as compared to normal trees. The root directory can contain files and other directories,
    the second-level directories can contain more files and more directories, and
    so on.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '> **The Powers of Root** UNIX uses the word root to describe two different
    concepts. One is the root user, the person with absolute control over everything
    having to do with the machine. The other is the root directory, one single specific
    directory on the machine that is considered to be the top of the file system.


    You don''t need to care what drives are where. Where do other drives appear, if
    not named by letters or icons? With UNIX, they appear simply as directories located
    anywhere in the file system. Odd? Not at all. UNIX completely removes the notion
    of the hardware and the physical location of the files from the concern of the
    user. This might take a while to get used to, but when you do you''ll see that
    it makes no sense for a user to have to worry about where a file physically resides.
    If you know its name and where to find it in the file system, why bother worrying
    about which chunk of oxidized metal (that''s what a hard drive is made of, by
    the way) it lives upon? If you think about it, you''ll see that this has other
    significant benefits. For example, if your system administrator discovers one
    day that he''s run out of disk space to install new software, he can transparently
    rearrange disks and files. He can move everything out of some overloaded directory
    onto a new disk and mount the new disk so that it appears in the same place as
    the old directory—and you''ll never know the difference.


    > **Mounting a drive** The process of telling the file system that the drive exists
    and at what directory it will appear. On most variations of UNIX, normal users
    can''t mount drives. If you happen to be on a system which enables normal users
    to mount drives, you need to see your system administrator to find out which drives
    you can mount, and how to mount them.


    *As a matter of fact, you don''t even need to care what state your files live
    in. Another benefit of this abstraction is that your system administrator can
    cause files, directories, or drives which are physically located on*'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'distant machines to transparently appear as part of the file system on your
    machine. The only difference you might notice in accessing remotely-located files
    might be a slight slowdown due to the network. So, what does this mean? If your
    system is set up properly, no matter where you are or what machine you sit in
    front of, whether you''re at your main office or halfway around the world, all
    your files appear in the same place and all your software is where you always
    expect it to be.


    *Even if you don''t care where your files are, you''re always somewhere.* UNIX
    bases most of its notion of the user environment on the user "being somewhere"
    located and working in some particular directory. With the advent of new graphical
    desktop environment tools this is becoming less of a universal concept, but is
    still a good idea to keep in mind when working with UNIX.


    *UNIX commands and filenames are case sensitive.* For both the Windows and Macintosh
    user, this might come as quite a surprise: UNIX is quite literal in its interpretation
    of what you type. MyFile doesn''t look identical to myfile on paper, and it''s
    not identical to UNIX either. Always note the case of filenames or commands that
    you are trying to use. Believe it or not, Mail and mail are two different commands,
    both of which are available on many UNIX variants—and they do two different things!


    *Files have three attributes.* UNIX has a very simple idea of file attributes—files
    can be readable or not readable, writable or not writable, and executable or not
    executable. Any combination of these options is possible, though some combinations
    are not particularly sensible. Generally, programs will be readable and executable,
    and data files will be readable and possibly writable. UNIX, however, takes you
    at your word. If you tell it that a data file is executable, for instance, it
    happily gives you the chance to try to run your Rolodex file—which is unlikely
    to work; if you tell it that a program is writable it just as happily enables
    you to edit your word-processor—which is likely to make the software useless.


    *Everything belongs to somebody.* Every file and directory in the UNIX file system
    carries around with it information detailing who owns it. The owner of a file
    can allow or disallow access to a file for other users or other groups of users,
    and can control whether the file is executable, readable, or writable.


    Now that you understand a bit about what your commands are going to be talking
    to, you can start learning what you need to know to get around.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# NAVIGATING THE FILE SYSTEM


    The most basic commands for dealing with the UNIX file system are the ones for
    moving between directories and finding out what files are in them. Before moving
    between them though, it’s a good idea to know where you are.


    # WHERE ARE YOU? pwd


    The pwd (present working directory) command asks your machine to tell you what
    directory you’re currently in. Any time you’re running a command line, it’s somewhere
    in the file system—type pwd and it tells you where.


    For example:


    ```

    > pwd

    /priv/home/ray/public_html/

    ```


    Path Particulars /priv/home/ray/public_html/ is a path. The simplest explanation
    of a path is the shortest set of directories through which you must travel from
    the root directory to get to the current file or directory. Each directory in
    the path is separated by a /.


    # THE HOME DIRECTORY


    To each user, one particular directory is special. This is your home directory.
    From the standpoint of navigating around the file system, this directory is identical
    to any other; however, it is significant in that when you log on, it is where
    you will initially be. You can expect that anything in or below your home directory
    belongs only to you. To make your life easier, UNIX doesn’t require you to remember
    the path to your home directory. Instead, it allows you to refer to your home
    directory simply as ~, and to anybody else’s home directory as ~username.


    Now that you know where you are, the next thing you might want to know is what
    files are with you.'
  merge: -1
