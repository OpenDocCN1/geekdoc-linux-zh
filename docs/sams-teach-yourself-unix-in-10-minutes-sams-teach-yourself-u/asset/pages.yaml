- pgno: 74
  md: '# LESSON 6


    # WORKING WITH

    FILES ON THE

    SHELL


    ![](img/2c005cbaad58c25c7f54da948131a75e_74_0.png)


    *In this lesson, you will learn how to perform basic file maintenance functions
    such as creating and deleting files and directories.*


    It is unlikely that you will make use of any UNIX commands more frequently than
    the file maintenance command set. Thankfully, the commands you’ll use are very
    short and have only a few important options. Although these commands and options
    might initially seem simplistic, between what you can do with them and what you’ll
    learn about automating them in Lesson 14, “Basic Shell Scripting,” you’ll find
    that these commands can perform almost any file maintenance task you can imagine.


    # WORKING WITH FILES AND FOLDERS:

    THE COMMAND LINE


    The command line is your primary interface to the UNIX file system as well as
    your primary tool for creating, deleting, and rearranging your files. It’s not
    unusual for pieces of software to provide file creation and deletion tools, but
    these are rarely as powerful as the command line. Even if you intend to avoid
    the command line for your day-to-day work, you’ll want to know about these tools.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '![](img/2c005cbaad58c25c7f54da948131a75e_75_0.png)


    Tweedle Dee When working with the command line, remember this: filenames that
    you give as arguments to commands can be either relative or absolute paths. This
    means that if you have a command named tweedle, which twiddles a file, if you
    type


    **tweedle myfile**, you twiddle the file myfile in the current directory.


    **tweedle ../myfile**, you twiddle the file myfile in the directory directly above
    this one.


    **tweedle /priv/home/henry/myfile**, you twiddle the file myfile in the directory
    /priv/home/henry (assuming that you have permission to twiddle files in that directory,
    of course).


    Keep in mind that tweedle in the preceding example is a hypothetical command with
    hypothetical results—UNIX has no such command. It is used here simply to help
    explain a "modifies in some unspecified way" command. You can substitute any operation
    you want for twiddle/tweedle.


    # CREATING A NEW EMPTY FILE: touch


    The touch command is used to update the "last modified" time of a file and set
    it to the current time. This might seem like an odd thing to want to do, but it''s
    a very useful utility if you have an application that performs some function on
    files newer than a particular time.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '![](img/2c005cbaad58c25c7f54da948131a75e_76_0.png)


    # Taking Advantage of touch


    One place you might want to remember that you can use the touch command is with
    backup and archiving software. Many whole-system backup programs default to only
    backing up files which were modified since the last backup (this is called and
    incremental backup). If you want to make sure that a file is backed up, even though
    you''ve not modified it recently, you can touch the file to change the modification
    date and make it appear to have been modified at the time you touched it.


    A useful side effect of touching a file is that if the file that you try to touch
    doesn''t exist, touching it causes it to be created as a new empty file.


    If you need to update the modification date of a file or create a new empty file,
    do the following:


    +   1. Determine the filename or filenames of the file or files you want to either
    update or create.

    +   2. Issue the touch command as: `touch <filename> <filename>` ...


    For example, type


    ```

    > touch myfile

    ```


    If myfile previously existed, its last-modified date would now be set to the current
    time. If myfile did not previously exist, it would now exist as an empty file
    with a last-modification date of the current time.


    Of course, if you want to create multiple files or update the modification dates
    on multiple files, you might type something such as


    ```

    > touch myfile1 myfile2 myotherfile

    ```


    This results in myfile, myfile2, and myotherfile all having updated modification
    dates or being created as necessary.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '> Additional Use of touch When you become comfortable enough with UNIX to start
    automating your work using shell scripting (discussed in Lesson 14), you will
    find the touch command useful for creating flag files that allow your scripts
    to talk to each other. Keep the touch command in mind when such as


    ```

    remove myfile (y/n)?

    ```'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'This is the rm interactive mode, a protective measure designed to make certain
    that you really mean to delete the files that you specified (if you really want
    to, hit y). Usually your system administrator will have configured your system
    so that rm operates in interactive mode by default. In Lesson 16, "Modifying the
    User Environment," you will learn how to change this default—but you are advised
    to leave it in interactive mode until you''ve decided that you''re comfortable
    with UNIX.


    # OPTIONS TO rm


    The rm command supports several useful options:


    +   - i—interactive. i makes rm ask you to confirm the deletion of each file before
    it is actually deleted. As annoying as this might seem, if your system administrator
    hasn''t configured your system to use rm in interactive mode by default, get used
    to issuing the rm command as rm -i <file1> <file2>....

    +   - f—force. f requests that rm carry out deletions regardless of the file permissions.
    Remember, you can create files and set the permissions so that even you, as the
    owner, can''t read or write the file. If you don''t use force mode, rm asks you
    if you want to override the permissions whenever it tries to delete files that
    you can''t write.

    +   - r—recursive. r is a very powerful option to rm; the recursive mode is not
    for the faint of heart. When you issue the rm command as rm -f <directoryname>,
    rm recursively deletes the directory and all its contents. If the directory contains
    other directories, they are deleted in the same manner.


    # CREATING A DIRECTORY: mkdir


    Directories are very useful for organizing files into sensible groupings. Use
    the following steps if you need to create a directory:


    +   1. Decide what you want to call the directory.

    +   2. Issue the mkdir command as mkdir <directoryname>.


    For example


    ```

    > mkdir fresh_new_directoty

    ```'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'This creates a new directory named fresh_new_directoty, which will be located
    in the current directory. Unfortunately, directory is misspelled, so you''ll need
    the next command as well. As with touch, you might want to use mkdir to create
    a few extra directories so that you can remove them with the next command, rmdir.


    # REMOVING AN EMPTY DIRECTORY: rmdir


    It isn''t very helpful for organization to have old directories that you no longer
    need laying around, so occasionally you might need to delete one. The command
    rmdir deletes empty directories. Follow these steps to use rmdir to delete a directory:


    +   1. Decide which directory or directories you want out of your way.

    +   2. Issue the rmdir command as rmdir <directory1> <directory2> <directory3>....


    For example


    ```

    > rmdir fresh_new_directoty an_old_directory/kludge

    ```


    This deletes the misspelled directory from the previous example; it also deletes
    the directory named kludgedir that is located in the directory an_old_directory
    in this example.


    The rmdir command does not affect directories that aren''t empty, so it''s a convenient
    command to use to clean house if you''ve got a bunch of directories laying around.
    You can get it to try to delete everything in the current directory by issuing
    the following command:


    ```

    > rmdir *

    ```


    You''re not expected to understand this syntax yet—you''ll get to that in Lesson
    13, "Regular Expressions." Furthermore, you''re likely to get dozens of error
    messages in response to typing this command; but the end result of issuing rmdir
    in this fashion is that any empty directories in this directory go away, and nothing
    else is affected.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# REMOVING FILES AND DIRECTORIES AT THE SAME TIME: rm -r


    Because the rmdir command only works on empty directories, you''ll eventually
    want a way to delete a directory as well as all its contents. For this, the rm
    command in recursive mode is the solution. Follow these steps if you need to delete
    a directory and all its contents:


    +   1. Determine the name of the directory that you want to delete.

    +   2. Issue the rm command as rm -r <directoryname>.


    For example, type


    ```

    > rm -r /priv/home/henry/junkdirectory

    ```


    This removes the directory /priv/home/henry/junkdirectory and recursively removes
    all its contents.


    If you manage to delete your current directory (not a fun thing to do), you''ll
    eventually end up getting error messages saying Cannot stat current directory,
    can''t stat . and . not found. How long it takes UNIX to figure out that you''re
    suddenly located ''nowhere'' depends on which commands you run, but you can always
    rescue the situation by typing cd ~ to get back to your home directory.


    # COPYING FILES: cp


    If you need to make copies of files, you need the cp command. This command can
    either copy a single file to a new destination file, or copy one or more files
    to a single destination directory.


    Follow these steps to use the cp command to make a copy of a single file:


    +   1. Determine the source filename, and the destination filename to which you''d
    like to copy it.

    +   2. Issue the cp command as cp <sourcefile> <destinationfile>.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'To use the cp command to copy one (or more) files to a destination directory,
    follow these steps:


    +   1. Determine all the source filenames and the name of the destination directory.
    The cp command will not create the destination directory for you, so if it doesn''t
    exist you''ll need to use the mkdir command first.

    +   2. Issue the cp command as cp <source1> <source2> ... <destinationdir>.


    For example, type the command


    ```

    > cp myfile1 /priv/home/henry/myfile2

    ```


    The example shown here copies the file myfile1 from the current directory and
    places the copy in /priv/home/henry/myfile2.


    Following is its second form:


    ```

    > cp /etc/sendmail.cf /priv/home/henry/myfile2 myfile1 /tmp

    ```


    This time it would copy the file sendmail.cf from the directory /etc, the file
    myfile2 from the directory /priv/home/henry, and myfile1 from the current directory,
    and then place the copies in the directory /tmp.


    Remember that you don''t have to copy multiple files to use the "into a directory"
    version—just give it the one filename and the destination directory.


    # COPYING DIRECTORIES: cp -r


    Just like the rm command has a recursive mode for removing directories, the cp
    command has a recursive mode for copying directories. If you issue the cp command
    with the -r option, it attempts to treat each of the source filenames as directories
    and recursively copies them to the destination directory. Follow these steps to
    use the cp command in this way:


    +   1. Determine the names of the directories that you''d like to copy.

    +   2. Issue the cp command as cp -r <source1> <source2> ... <destdir>.'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'For example, issue the command


    ```

    > cp -r /usr/local/httpd/logs /tmp

    ```


    The cp command creates a new directory named logs in the directory /tmp, and makes
    a copy of the contents of the directory /usr/local/httpd/logs in this new /tmp/logs
    directory.


    # MOVING FILES AND DIRECTORIES: mv


    If you simply need to move (rename) files rather than copying them, you want to
    use the mv command. This command uses the same two forms that the cp command does:
    The first moves (renames) a file from one name to another name, and the second
    moves one or more files to a destination directory.


    Follow these steps to use the mv command to rename a single file:


    +   1. Determine the current name of the file and the name you''d prefer it to
    have.

    +   2. Issue the mv command as: mv <currentname> <newname>.


    For example, if you have a file named todays_mail and want to store it away with
    your backed up email, you might type


    ```

    > mv todays_mail ~/mymaildir/June10.mail

    ```


    This command would move the file todays_mail in the current directory to the file
    June10.mail located in the directory ~/mymaildir (remember, that''s the directory
    mymaildir located in your home directory).


    Follow these steps to use the mv command to move one or more files to a new location:


    +   1. Determine the names of all the files you want to move and the name of the
    directory to which you''d like to move them.

    +   2. Issue the mv command as mv <file1> <file2> ... <destinationdir>.


    For example


    ```

    > mv /usr/local/httpd/logs/error_log /priv/home/henry/myfile2

    /tmp

    ```'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'This command moves the file error_log from the directory /usr/local/httpd/logs,
    and the file myfile2 from the directory /priv/home/henry into the directory /tmp.


    ![](img/2c005cbaad58c25c7f54da948131a75e_83_0.png)


    # Limitations to mv


    The mv command can also be used to move and rename directories with exactly the
    same syntax used for moving and renaming files—just give directory names instead
    of filenames.


    Unfortunately, for this task the mv command is a little more limited than you
    might like it to be. It cannot move directories between physical devices; so every
    now and then if you try to move a directory from one location to another, UNIX''s
    abstraction of physical devices in the file system will sneak up to bite you,
    and you get an error message such as:


    ```

    Can''t move directories across partitions

    ```


    If this happens, the easiest solution is to use the copy command to copy the offending
    directory, and then delete the original.


    # CREATING LINKS: ln


    The final file management utility you will learn about in this lesson is the command
    used for creating links or aliases to files. The ln command is used to create
    links to files so that one file can appear to be in multiple locations and have
    multiple names.


    To see the utility of this command, consider the situation in which you want your
    friends to look at your daily schedule. Daily or weekly, as appropriate, you can
    create a new file with your schedule and name it with the current date. Because
    you don''t want to have to constantly give your friends new filenames to check
    your schedule, you might just create a link named myschedule, which you then point
    to whatever file contains'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'your current schedule. Your friends can always look at myschedule to get your
    schedule, and you can keep your daily planner archives neatly arranged.


    Follow these steps to use the ln command to create a link:


    +   1. Determine the name of the file to which you want a link. The ln command
    is willing to create links to non-existent files, which isn''t particularly useful,
    so make certain you know the correct name of the file you want to link.

    +   2. Determine the alternate name by which you want to be able to access the
    file.

    +   3. Issue the ln command as ln -s <realfilename> <alternate name>. Don''t worry
    about the significance of the -s command. This signifies that the link is a soft
    link, the kind common in everyday use, as opposed to a hard link that isn''t really
    useful to non-administrative types.


    For example, if you wanted to be able to easily browse your Web server log file,
    you might issue the command


    ```

    > ln -s /usr/local/httpd/logs/access_log ~/weblog

    ```


    If you were to do this, you would create a link named weblog in your home directory.
    This link would be an alternative name for the file /usr/local/httpd/logs/access_log.


    You can work with this link almost exactly as though it were the real file. If
    you try to read its contents, you read the contents of the real file. If you try
    to modify or edit it, you edit the contents of the real file. If you delete the
    link, however, you only delete the link; the real file remains. So that you can
    tell the link apart from the real file, if you is -l the link it shows up as a
    filename that points to another path.


    ```

    > ls -l ~/weblog

    lrwxrwxr-x 1 ray 7 Nov 28 1998 weblog -> /usr/local/httpd/logs/access_log

    ```'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'Web Server Tip One very useful place to use the ln command is when working
    with Web servers—if you''re not going to be using a Web server, ignore this tip.
    Many Web-servers serve a file named index.html by default if the user doesn''t
    specify a filename in their URL. If you want a page to display by default, and
    don''t want to have to name it index.html, you can just make a link to the real
    file named index.html and the server will never know the difference.


    # SUMMARY


    In this lesson you learned a set of commands with which you can manage and arrange
    your files in whatever fashion you desire.


    It is very important to remember that when you give a filename as an argument
    to a UNIX command, the filename can be either a relative or absolute path to the
    file. If you give just the name of the file, you are specifying a file in the
    current directory. If you give a partial path to the file (as in ../<filename>,
    or <directoryname>/<filename>) you are specifying a relative path. Finally, you
    can always give the absolute path from the / directory to the file. Following
    is a quick review of this lesson:


    +   - The touch command sets the modification date of the file to the current
    time. This has the effect of creating new empty files if you need them.

    +   - The rm command removes files. Use the rm -i option until you are quite certain
    that you know what you are doing, and then keep using it for a while longer. Recursive
    rm running in non-interactive mode can wipe your entire disk.

    +   - The cp command copies one or more files. Although a slight oversimplification,
    it''s easiest to remember that if you start with a single file, your destination
    needs to be a single file; if you start with multiple files, your destination
    must be something that can hold multiple files (such as a directory). You can
    also copy a single file to a directory if you want to.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '+   - The mv command works a lot like cp, only it renames or moves files. The
    mv command cannot move directories across physical hardware boundaries, so every
    now and then UNIX''s hardware abstraction fails with this command. If this happens,
    look to the cp command for help.

    +   - The ln command creates alternative names by which a file or directory can
    be accessed. It''s convenient for times when you need one thing to appear to be
    in several different places, or when you need to make information that comes from
    different files at different times all appear as the same filename.'
  merge: -1
