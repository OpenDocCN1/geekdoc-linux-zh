- pgno: 199
  md: 'For example, type the following:


    ```

    >newgrp admins

    ```


    After this command is executed, all further files that are created in this session
    belong to the group admins.


    # BECOMING ANOTHER USER TEMPORARILY: su


    su, the substitute user command, enables you to switch to another user account
    from within a single login session. Under UNIX, this changes your effective user
    ID—which means that all files created will effectively be as if the other user
    created them. Your actual user ID remains the same, however. A noticeable side
    effect of this is that even though you''ve used su to "become" another user, running
    mail checks email for the user account that you initially used to log in. To use
    the su command, simply enter it as follows: su <user to switch to>.


    For example, type the following:


    ```

    >su agoves

    ```


    Password: ******


    If this were you, you might now use the whoami command as follows to verify that
    the system now believes that you are effectively agoves:


    ```

    >whoami

    ```


    agoves


    Just as you had hoped! You can now perform operations under the agoves account.'
