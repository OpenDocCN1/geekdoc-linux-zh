- pgno: 71
  md: 'Expressions.") The fgrep command is the fastest of the three, but handles the
    least complex expressions. To be safe, you can always use plain grep, which will
    work the same in every case, on every system. So, how do you use this wonderful
    tool? Simple—just give it the word or pattern to look for, and the files you want
    searched:


    +   1. Choose the word or phrase you want to find.

    +   2. Find the filename you want to search. If it is in another directory, you
    must specify the entire pathname. You can also use wildcards to search multiple
    files.

    +   3. Type grep `<pattern to find>` `<file or files to search>` at the command
    prompt.


    For example:


    ```

    >grep "jray" *.txt

    8979-10.txt:<manager>=jray

    log.txt: Access by jray on 11/12/98

    kiwi.txt: jray loves to eat kiwis. But don''t you think that

    ->it would be

    ```


    This example searches for jray in any file that ends in .txt. It has turned up
    three files—8979-10.txt, log.txt, and kiwi.txt—that contain the string; each filename
    is followed by the text that contains jray. Two options you might want to consider
    adding to grep are -i to ignore case and -n to display the line numbers of the
    match in each file. You can add these flags to the command line, immediately following
    the grep command.


    The grep command is an extremely valuable tool that will become even more valuable
    later when you learn about regular expressions. Remember to turn back to this
    lesson to test some of the things you''ll learn in Lesson 13.


    # USING THE KDE FIND FEATURE


    For those of you who are running KDE, you''ll be glad to know that KDE has a built-in
