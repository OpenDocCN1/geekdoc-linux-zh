- pgno: 142
  md: '# LESSON 13


    # REGULAR EXPRESSIONS


    ![](img/2c005cbaad58c25c7f54da948131a75e_142_0.png)


    *In this lesson you will learn the basics behind regular expressions, and how
    to use them with the grep command.*


    Regular expressions are a wonderful thing—accept this statement as a fact as you
    read through this lesson and you''ll be fine. Regular expressions, or REs, are
    used in many programming languages and UNIX commands. They are a bit on the esoteric
    side, but are extremely important to understand nonetheless. Although in this
    lesson you''ll be looking only at the command grep in conjunction with regular
    expressions, you can apply this knowledge to almost everything that uses regular
    expressions. Mastering regular expressions takes time; this lesson is rather short
    and serves only as an introduction to the topic.


    # PATTERN MATCHING


    Regular expressions are a method of specifying a pattern of characters that can
    then be matched against existing text. They can be used to locate information
    when you''re not quite sure what you''re looking for, or they can be used to perform
    extremely complex search and replace procedures. The Perl (Practical Extraction
    and Report Language) programming language uses regular expressions to a great
    extent and is considered one of the best—if not the best—languages for creating
    dynamic Web applications.


    # SPECIFYING THE REGULAR EXPRESSION IN grep


    The format for specifying the regular expression in grep is as follows: `grep
    <regular expression> <filename>` ... Because this lesson uses grep as its example,
    familiarize yourself with this format. Other programs sometimes require that the
    regular expression be set off with / on either side of it; this is not the case
    with grep.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# MATCHING SINGLE AND MULTIPLE CHARACTERS: . AND *


    Given that a regular expression defines a method of matching, this section discusses
    some of the most common parts of a regular expression and how they can be used
    to match a sample pattern. For the examples, you''re going to use a sample file
    called sample.txt (if you want to follow along, use your favorite text editor
    to create it now); it looks like this:


    ```

    This is a test

    Kim Steinmetz

    (614) 555-0591

    (815) 555-0000

    "special stuff"

    1998

    1999

    1800

    1750

    ```


    The period character (.) can be used to match any character. For example, just
    assume that you can''t remember how to spell Kim''s last name in the preceding
    file. There''s a good chance you might get the i and e mixed up. In that case,
    you can use . as follows:


    ```

    > grep "St..nmetz" sample.txt

    Kim Steinmetz

    ```


    The St and nmetz make up an obvious part of the regular expression— they match
    directly with the letters in the name Steinmetz. Because you weren''t sure about
    the i and e, you simply replaced them with periods, and grep returned the line
    you wanted.


    With * you can match any number of occurrences of a pattern or portion of a pattern.
    Suppose all you knew was that Kim''s last name started with an s and ended with
    a z. In this case, you can use * in conjunction with . to match anything between
    an s and a z; type the following:


    ```

    > grep "S.*z" sample.txt

    Kim Steinmetz

    ```


    Sure enough, that works well! You can pretty much forget how to spell her name
    now, huh?'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'Figuring Out • It is important to note that * will match any number of occurrences
    of a pattern, including zero. This means that the expression s.*z will happily
    match the string Sz. If your expression is turning up matches that you hadn''t
    planned on, this might be the cause.


    Use \ to set off a special character. Some characters are used by the shell, so
    they must be escaped by using \. You might want to use it in front of characters
    that might be special characters as well. In most cases, it doesn''t hurt to use
    \ if you aren''t sure. For example, the shell usually expects you to put double
    quotes (") around strings with spaces in them—it uses the double quote to group
    the words in the string. If you need to search through your file for lines containing
    double quotes, you can not grep for "; instead, use the following command:


    ```

    > grep \" * sample.txt

    "special stuff"

    ```


    Using the \ in front of the double quote tells the shell to not attempt to interpret
    the double quote normally as a surrounding character, but to instead simply pass
    it to the grep command for processing.


    # USING AND NEGATING RANGES IN A REGULAR EXPRESSION: [ ] AND ^


    You''ve noticed that the sample.txt file you''ve been using has a few dates inside.
    Suppose you only want to match the years that fall in the 1700-1800''s. To do
    this you can use a range, which is specified in a regular expression as follows:
    [<starting point>--ending point>]. The starting and ending points can be numbers
    or ranges within the alphabet.


    For example, type the following:


    ```

    > grep "[1-7][0-9]*" sample.txt

    1800

    1750

    ```'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'Your pattern here states that any valid matches must start with a 1 and be
    followed by a number in the range from 7 to 8, followed by one or several numbers
    in the range from 0 to 9. Ranges can help you pull certain values out of files.
    You can expand the capability of the range by applying the negation operator.


    The character ~ negates a range if it is used at the start of the range specification.
    Negating a range will match the opposite of what the range matches.


    For example, type the following:


    ```

    > grep "[1][^7-8][0-9]*" sample.txt

    (614) 555-0591

    (615) 555-0000

    1998

    1999

    ```


    Notice that you now match anything that isn''t in the 1700''s or 1800''s. You
    also match two phone numbers that, if you look at the third and subsequent characters,
    do indeed match the pattern you''ve specified.


    **Finding the Perfect Match** You''ll notice that you''ve asked the grep command
    to match a 1, followed by something that''s not in the range from 7 to 8, followed
    by something that''s in the range from 0 to 9; you matched the pattern 14). You
    might initially be surprised because the ) isn''t in the range from 0 to 9. Remember
    that the * character asks grep to look for zero or more something — in this case
    you''ve matched the 1, one thing that''s not 7 to 8, and zero things from 0 to
    9. This is not quite the same as regular expression syntax as used by many shells.
    Consult the man pages for your shell to learn the different ways that shells handle
    regular expressions.


    # MATCHING THE START AND END OF A LINE: ^ (AGAIN) AND $


    In order to uniquely match the years in the sample file, you can use the start-of-line
    and end-of-line regular expression characters to stop grep'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'from matching the phone numbers. These characters are commonly called anchors
    because they anchor a pattern to the start or end of a line. Because 1998 and
    1999 are both at the beginning of a line, this will be easy.


    If ^ is used outside of a range, the ^ character matches the start of a line.


    $ matches the end of a line. If your pattern falls at the end of a line, you can
    anchor it in this position with $.


    For example, type the following:


    ```

    >grep "^[7-8][0-9]*" sample.txt

    ```


    1998

    1999


    That''s more like it. Only the two dates are returned, because they fall at the
    beginning of a line. The phone numbers no longer match because the portion that
    did match is not at the start of the line.


    # USES FOR REGULAR EXPRESSIONS


    What you''ve just learned is only a very tiny subset of the regular expressions
    that you can generate. Regular expressions can be used in a wide variety of different
    applications. For example, sed, the stream editor, can replace patterns of text
    from a stream of text on the fly. (It''s great for editing a STDOUT -> STDIN stream
    between two programs!) Being able to do a global regular expression search and
    replace on a thousand files—rather than editing each individually—is a thing of
    beauty. When you are using the shell you can also use a subset of the complete
    regular expression library to specify filenames for operations.


    For example, if you have a group of files named test1, test2, test3, test4, and
    test5, and you want to copy files 3 through 5 to a new directory, you can use
    a regular expression such as the following:


    ```

    >cp test[3-5] newdirectory

    ```


    You''ll need to consult the man pages for the shell you are running in order to
    determine which regular expressions it supports. The same goes for everything
    else that uses regular expressions. Unfortunately, even though REs themselves
    are pretty standard, the extent to which any individual application supports them
    is entirely up to that application. Perl, for example, is an application (and,
    in turn, is a complete programming environment) which makes extensive use of regular
    expressions.'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'With the growing popularity of the World Wide Web comes the need to process
    user supplied information quickly and reliably. Unfortunately, there is little
    control over what sort of information a user might submit on a form or other interactive
    Web document. If you intend to do Web programming, you will find that regular
    expressions are a lifesaver and can be used to extract data from a form and turn
    it into a usable format. If this sounds interesting to you, you might do well
    to look into the Perl programming language because it makes very strong use of
    regular expressions.


    # SUMMARY


    Regular expressions are an extremely flexible way of describing a pattern to be
    matched. Because many UNIX applications, including the shell, support regular
    expressions, it is important to develop a general understanding of how they work
    and what they are good for. Hopefully this lesson has provided this background
    for you. Here''s a review:


    +   - .—This matches any character. Use it whenever you aren''t sure what character
    falls in a specific position.

    +   - *—Using the * matches any number of occurrences of a specific pattern. You
    can use this in conjunction with . or ranges.

    +   - \—Special characters need to be escaped using the \ character. If you need
    to use the quote character (*) in a pattern, you''ll have to escape it.

    +   - Ranges—You can match ranges of numbers or letters to limit a pattern. Ranges
    are enclosed in [] characters. To negate a range, use ^ at the beginning of the
    range specification.

    +   - ^/$—These two special characters match the beginning and end of a line,
    respectively. They are commonly referred to as anchors because they anchor a pattern
    to a specific place on a line.

    +   - Regular Expressions—These are used in many UNIX programs, and can be an
    extremely powerful tool. Read the man pages for your shell and other utilities
    in order to determine the extent to which they support regular expressions.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# LESSON 14


    # BASIC SHELL SCRIPTING


    ![](img/2c005cbaad58c25c7f54da948131a75e_148_0.png)


    *In this lesson you will learn a bit more of the magic behind automation and customization
    using shell scripts*


    When you learned about pipes in Lesson 12, "Input and Output," you probably began
    to see a bit of what makes UNIX so powerful and configurable. What you probably
    didn''t realize is that using a pipe is only the very beginning of what UNIX can
    do to customize and automate tasks. As you read through this lesson, you''ll soon
    see that pipes are only the smallest tip of the iceberg.


    Shell scripts are essentially little programs written in the language of the shell.
    If you''re a user from the pre-windows days of the PC, you''ll recognize shell
    scripts as being similar to BATCH files. Macintosh users, although not burdened
    with a command line in day-to-day life, will still see the similarity to the AppleScript
    and Frontier scripting languages. While anything larger than a few dozen lines
    of script would probably be better done in a language other than the shell, thinking
    of shell scripts as little programs does injustice to the flexibility and convenience
    that they provide the user.


    # GETTING A LOT FOR A LITTLE: SHELL SCRIPTS


    You will usually create a shell script when you want to combine a set of actions
    that you routinely need to repeat into a single convenient action.


    For example, you might in the habit of coming in to work and starting your day
    off by wasting a bit of time—sending all your coworkers an email message saying
    "Howdy Neighbor", firing off a print job to print out the most recent 100 hits
    to your personal Web page, opening an xterm'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'and reading a few newsgroups, and so on. If you want to save yourself some
    time and keystrokes you can do this by writing a little shell script to do it
    all automatically. You might put it all in a file and name it something such as
    waste-time; that way, in the future you''d just have to come in to work and type
    waste-time to have your computer waste time for you automatically.


    Another instance of using shell scripts, or shell scripting techniques, is with
    some commands that can be used to automate certain tasks directly in the shell—without
    having to be put in a file. This lesson will look primarily at these because they''re
    easier to learn and more immediately useful. As you get more comfortable with
    UNIX, you''ll naturally gravitate to the idea of just putting what you''re typing
    in a file—and another shell script programmer will be born.


    # SHELL SCRIPT FILES


    As mentioned previously, shell scripts are small-in-size programs written in the
    same language that you use to talk to the shell by hand. It only makes sense that
    you can do this with UNIX—remember the UNIX model of input and output? The shell
    really doesn''t care whether it''s you issuing commands to it or if the commands
    are coming from some other source, such as a file.


    > Shell Variations The examples in this section are designed for the csh or tcsh
    shells. If you''re using a different shell, you''ll need to consult the man pages
    for your shell to determine the correct syntax, change your default shell (see
    Lesson 15, "User Utilities," for the csh program), or start a csh or tcsh shell
    by typing csh or tcsh.


    As a quick introduction to the sort of thing you can do with a shell script file,
    take the preceding waste-time example. If you want to actually write a shell script
    to do exactly this, you need to combine a few of the tools you''ve seen so far
    with a few that you haven''t yet seen. However, for your edification, here''s
    what to do:'
  merge: -1
  img_proc: true
