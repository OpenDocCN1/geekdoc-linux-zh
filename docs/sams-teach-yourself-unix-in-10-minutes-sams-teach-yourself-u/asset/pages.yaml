    \ since Sun Nov 29 16:35 (EST) on tty0 from 192.168.0.91\n      6 hours 47 minutes\
    \ idle\nNo mail.\nNo Plan.\n```\n\nThis is the finger information returned about\
    \ a user. As you can see, there isn't much of interest here. This is because there\
    \ is no personal information set just yet. You can see, however, how long he's\
    \ been logged into the system, his real name, and his home directory. jray can\
    \ add personal information to his account profile with chfn."
