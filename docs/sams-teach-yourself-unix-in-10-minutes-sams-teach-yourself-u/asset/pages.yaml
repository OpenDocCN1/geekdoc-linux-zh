- pgno: 56
  md: '![](img/2c005cbaad58c25c7f54da948131a75e_56_0.png)


    **ls Variations** Different versions of UNIX have ls commands which produce slightly
    different output. No matter what flavor of ls you have, you will see fields similar
    to these—and maybe a few others. At this time, don''t concern yourself with any
    extra fields that appear.


    This listing might look a little convoluted at first, but the parts that you need
    to understand at this point are fairly straightforward.


    +   - First comes a line telling you how many things are in this directory—in
    this case, 14.

    +   - Next come lines detailing the contents of the directory, one per item.

    +   - The ten characters that look like random gibberish at the left of each line
    are actually the attribute information for the file. The first character of this
    tells you whether the line is for a directory; lines having the first character
    d are for directories. Lines which start with a - are for normal files. Sharp
    observers might note that the lines for bin and var start with an l. This indicates
    that these are actually links, or alternative names for other files or directories
    (links are discussed in greater depth later in this lesson). The remaining nine
    characters are three sets of three that indicate, respectively, the read, write,
    and execute status of the file for the file''s owner, the file''s group, and everybody
    else. You''ll learn about how to manipulate these settings, as well as more about
    the idea of file ownership, groups, and "everybody else," in Lesson 19.

    +   - Shortly after the ten characters of permission information, each line contains
    root. This is the owner of the file or directory. In the case of the preceding
    example, the root user owns everything in the directory. If you see a double column
    of entries containing root, it''s because your ls command displays group information
    as well as user information. Don''t concern yourself with the second of these
    columns until you become familiar with groups in Lesson 19.'
  merge: -1
  img_proc: true
- pgno: 57
  md: "+   - Next comes a number, sometimes small and sometimes large. This is the\
    \ amount of disk space that the file or directory occupies. For directories it's\
    \ not the space that the contents of the directory occupy, but rather the space\
    \ occupied by the data file which controls the directory. This value is in bytes.\
    \ As you can see, the directories take up very little room—although their contents\
    \ might be a different story. Conversely, vmunix takes roughly 1.4Mb, and that\
    \ pesky core file which should have been deleted ages ago is taking up 8.5Mb.\n\
    +   - After the file size comes the date of the most recent modification of the\
    \ file. If the file was modified within the last year, the date and time are given;\
    \ otherwise, a date and year are given.\n+   - Finally comes the filename. Note\
    \ that the filenames are identical to the names given by the version of ls from\
    \ the previous example, with the exception of bin and var, which have a funny\
    \ pointer that points to a path. As previously mentioned, these are actually alternative\
    \ names for other directories, and the pointer is pointing at the path to which\
    \ they are linked.\n\nYou have by now perhaps noticed that the total line claims\
    \ that this directory contains 14 items, but that only 12 appear in the listing.\
    \ This is because UNIX, as a courtesy, hides some files from the user unless they\
    \ are specifically asked for. Files whose names begin with a . (dot) are not shown\
    \ by default. Typically, control and configuration files—which you do not want\
    \ to see cluttering up your directory listing—are named with a dot so that you\
    \ don't have to see them in everyday use. Nevertheless, if you want to see them,\
    \ all you have to do is ask. In this case, use the all option for ls.\n\n```\n\
    >ls -al /\n total 14\ndrwxr-xr-x 1 root 8 Nov 24 00:30 .\n-rw-r--r-- 1 root 42\
    \ Dec 13 1997 .login\ndr-xr-xr-x 2 root 512 Jan 8 1995 CDROM\nlrwxrwxr-x 1 root\
    \ 7 Dec 7 1994 bin ->\n/usr/bin\n-r--r--r-- 1 root 8503728 Oct 25 20:16 core\n\
    drwxr-xr-x 3 root 11264 Nov 7 13:02 dev\ndrwxr-xr-x 11 root 3072 Nov 7 13:01 etc\n\
    drwxr-xr-x 46 root 2560 Jan 11 1995 include\n```"
  merge: -1
