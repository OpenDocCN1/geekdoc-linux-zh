- pgno: 54
  md: '# LISTING FILES


    Actually, with UNIX you can list the files just about anywhere, with the exception
    of places that you don''t have permission (more on permissions in Lesson 19, "Permissions");
    the easiest place to list files from, though, is "here"—wherever that currently
    happens to be.


    # LS


    The ls command lists files. Issued without arguments, ls lists the files and subdirectories
    in the current directory (the same one pwd would tell you about). For example


    ```

    > pwd

    /priv/home/ray/public_html/

    > ls

    cgi_bin          test.html

    images           vral

    index.html

    ```


    The preceding example shows that your current directory path is /priv/home/ray/public_html
    and that this directory contains five things. You can''t tell from this listing,
    but cgi_bin, images, and vral are directories, whereas index.html and test.html
    are files.


    > Covering the Bases You didn''t really have to issue the pwd command to make
    use of the ls command in the preceding example. It''s been included for the sake
    of clarity. If you already know where you are in the file system, there''s no
    reason to ask the computer to repeat it for you.


    If you''d like to list the files in some directory other than the current directory,
    such as the files in the root directory, you can issue the ls command with a directory
    option:


    +   1. Determine the name of the directory you want to list.

    +   2. Issue the ls command as: ls <directory name>.'
  merge: -1
  img_proc: true
- pgno: 55
  md: "If you wanted to list the contents of the root directory /, you would type:\n\
    \n```\n> ls /\nCDROM          lib\nbin            priv\ncore           tmp\ndev\
    \            vmunix\netc            usr\ninclude        var\n```\n\nEverything\
    \ here except for vmunix, which is the piece of software at the heart of UNIX,\
    \ and core, which is an error file that really should be thrown away, are directories.\n\
    \n> **Filename Facts** Remember that UNIX filenames, and consequently commands,\
    \ are case-sensitive. UNIX alphabetizes the capitals before the lowercase. This\
    \ is why CDROM appears before bin.\n\nHow can you tell that they are directories?\
    \ Use option ls to ask it for more information in the listing, specifically the\
    \ \"long\" option.\n\nIssue the command as: ls -l <directory name>.\n\n```\n>\
    \ ls -l /\n total 14\ndr-xr-xr-x 2 root 512 Jan 8 1995 CDROM\nlrwxrwxr-x 1 root\
    \ 7 Dec 7 1994 bin -> /usr/bin\n-r--r--r-- 1 root 8503728 Oct 25 20:16 core\n\
    drwxr-xr-x 3 root 11264 Nov 7 13:02 dev\ndrwxr-xr-x 11 root 3072 Nov 7 13:01 etc\n\
    drwxr-xr-x 46 root 2560 Jan 11 1995 include\ndrwxr-xr-x 23 root 4096 Oct 13 16:29\
    \ lib\ndrwxr-xr-x 4 root 512 Jul 4 1997 priv\ndrwxrwxrwx 3 root 512 Nov 24 00:30\
    \ tmp\n-rwxr-xr-x 1 root 1382769 Aug 12 12:57 vmunix\ndrwxr-xr-x 29 root 1024\
    \ Oct 27 17:53 usr\nlrwxrwxr-x 1 root 8 May 21 1995 var -> /usr/var\n```"
