  md: '# SUMMARY


    Finding something on a UNIX-based computer can be a bit difficult with the huge
    number of files and directories that are available to be searched. Thankfully,
    UNIX provides a set of powerful utilities to help you find what you are looking
    for. In this lesson, you have learned several techniques for locating files based
    on their names and attributes. You are also now familiar with searching the contents
    of files for a particular word or phrase.


    +   - **find**—The find command can search the entire UNIX file system, or the
    area under any directory, for a particular file based on a variety of criteria.
    You have seen how to use it to find files based on name, creation date, and size.

    +   - **whereis**—If you''re looking for a program file, its source, or its man
    pages, the whereis command might work for you. whereis searches a preset list
    of common file locations and quickly returns paths to anything it finds.

    +   - **which**—The which function is dependent on your PATH environment variable.
    It searches the paths that you have specified for a particular file name.

    +   - **grep (grep/egrep/fgrep)**—The grep command set is an extremely powerful
    method of searching the actual content of files for a particular word or pattern.
    The power of the grep command, when coupled with regular expressions (see Lesson
    13), is incredible.

    +   - **Find Utility**—KDE provides an easy-to-use interface that encompasses
