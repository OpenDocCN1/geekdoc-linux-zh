  md: 'count of the words in the file, and the third is the number of characters.
    The final column, of course, is the filename. If you want to limit the values
    to either lines, words, or characters, you can use the -l, -w, or -c options,
    respectively.


    > Uses for wc A common use for wc is to check the number of entries in log files.
    For example, to see how many hits a Web server has received since the last time
    the log files were reset, you can use a command such as wc -l /var/log/httpd/access_log.
    This returns the number of lines in the access_log file. Because each line represents
    a hit, you can use wc to quickly count the hits.


    # SORTING INFORMATION: sort


    Sorting is another useful function that you can do quickly with a built-in command
    rather than writing a specialized utility to do it. For example, suppose you have
    a file called kiwi.txt that contains the following:


    ```

    Joan 92

    Will 78

    John 21

    Kim 99

    Kama 05

    Jack 07

    ```


    It''s pretty simple to sort these by hand (ignoring the numbers for now), but
    what if you have several thousand names instead of six? You can use the sort command.
    Let''s try running sort on kiwi.txt and see what happens:


    ```

    >sort kiwi.txt

    Jack 07

    Joan 92

    John 21

    Kama 05

    Kim 99

    Will 78

    ```'
