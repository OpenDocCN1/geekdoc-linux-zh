- pgno: 108
  md: '# REASSEMBLING SPLIT FILES: cat


    So what do you if you''ve got a bunch of split up files and want to put them back
    together? It''s simple—remember the `cat` command? When you have a series of files
    named with something such as `<basename>` `<basename>aa`, `<basename>ab`, `<basename>ac`...
    `<basename>zz`, you can reassemble them by issuing the `cat` command as follows:
    `cat <basename>* > complete.file`. After `cat` has concatenated the files for
    you, you can `mv` the `complete.file` (or whatever you named it) to whatever final
    name you want.


    ![](img/2c005cbaad58c25c7f54da948131a75e_108_0.png)


    > **Working with Output Files** It''s frequently best to call output files by
    names such as complete file—something completely different than the `<basename>`—and
    then move them to their destination or final filename. This avoids potential confusion
    in those cases where you really want your final filename to be just `<basename>`


    # COMPARING AND REVISING FILES: diff AND patch


    You might be accustomed to creating documents and sending out revisions. Unfortunately,
    most of the time you probably have to send out complete copies of files when only
    a few words here and there have changed. In the UNIX community, there is a great
    deal of information exchange, and source code is passed back and forth constantly.
    Rather than always sending complete files, people rely on the `diff` and `patch`
    commands to only transfer whatever information has changed between revisions.


    # USING diff


    The `diff` function takes two files—an original template file and an updated file—and
    produces an output `patchfile` that contains enough information to reconstruct
    the updated file given only the patchfile and the template file. Assume you have
    the original file `templatefile.txt`, which has the following contents:'
  merge: -1
  img_proc: true
- pgno: 109
  md: '```

    Now is the time for all good

    kiwis to come to the aid of

    puppies.

    ```


    You distribute this file among all your co-workers. (This is just an example,
    folks.) However, a few later you update your wonderful file to a new file—updatedfile.txt—that
    looks like this:


    ```

    Now is the time for all good and bad

    kiwis to come to the aid of

    puppies and children.

    ```


    Rather than redistribute the new file (updatedfile.txt) to everyone, you can just
    make a patch that contains all the changes between the original file and the new
    file. To do this, use the diff command with the following syntax: diff <template
    file> <updated file> > <patchfile>. The patchfile can be any filename you want.


    > **Redirecting Output** The standalone > in this example is used to redirect
    output to a specific file, which you name. You can learn more about redirection
    in Lesson 12, "Input and Output."


    For example


    ```

    >diff templatefile.txt updatedfile.txt > patchfile.txt

    ```


    The program will run and return you to a command line, with no messages. If you''re
    interested in seeing what the patchfile contains, feel free to take a look at
    it with cat or more. In this example, the resulting patchfile is named patchfile.txt;
    distribute it to everyone who has the original templatefile.txt and needs to update
    it.


    > **File Comparisons** The diff command is also useful when you just want to know
    if two copies of the same file are identical or not. If you find yourself with
    multiple copies of similar files, diff is a fast way to find'
  merge: -1
  img_proc: true
- pgno: 110
  md: '> out whether they are identical and, if not, what changes have been made between
    them. If diff produces no output, there are no differences between the files.


    # USING patch


    Now the patch program comes into play. You invoke patch by simply giving it the
    name of the file that you want to patch, followed by the name of the patchfile.


    For example


    ```

    >patch templatefile.txt patchfile.txt

    patching file ''templatefile.txt''

    ```


    That''s all there is to it. The file templatefile.txt has now been updated and
    is identical to the file updatedfile.txt. You can verify this by viewing templatefile.txt:


    ```

    >cat templatefile.txt

    Now is the time for all good and bad

    kiwis to come to the aid of

    puppies and children.

    ```


    If you looked at the patchfile, you might have noticed that it is about the same
    size as updatedfile.txt, so, why not just distribute the entire file instead of
    the patch? In the case of tiny files such as those used in this example, it really
    doesn''t make sense to create patches. If you''re dealing with files several thousand
    lines long that have one or two lines changed somewhere in the middle, however,
    you''ll find that patch and diff are excellent ways to avoid sending gobs of redundant
    information.


    > **Important Reminder** Always remember to keep a copy of your template file
    around. In this example, the patch was applied directly to the template file and
    the template file was updated. If all further patches are created from the updated
    file, no problem; however, if patches are created based on the original template,
    the templatefile.txt can no longer be patched.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# SUMMARY


    The commands you''ve just learned show you a bit of the power that is built into
    the UNIX operating system. You''ve probably seen utilities similar to this on
    other desktop systems, but they''ve been add-ons or pieces of commercial software.
    In the case of UNIX, it''s all part of the operating system, and there''s a whole
    lot more where this came from! Here''s a review of what was learned in this lesson:


    +   - **wc**—The wc command can provide quick character, line, and word counts
    for a single file or for a group of files.

    +   - **sort**—sort enables you to sort information contained in separate lines
    within a textfile. It understands the notion of columns/fields of data, so you
    can use it to sort data in a variety of different formats.

    +   - **split**—If you have files that are a bit too large to handle when sending
    email, writing to a floppy, and so on, you can use the split command to chop them
    up into smaller files. split can create files containing a certain number of lines,
    kilobytes, or megabytes.

    +   - **diff/patch**—The combination of diff and patch enables you to distribute
    updates (to documents, source code, and so on) in an efficient manner. Rather
    than sending copies of entire updated files, you can use diff to create patchfiles
    that only contain the changes between one version of a file and the next.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# LESSON 10


    # COMPRESSION AND ARCHIVING TOOLS


    ![](img/2c005cbaad58c25c7f54da948131a75e_112_0.png)


    *In this lesson, you will learn about the common UNIX tools for compressing and
    archiving files, as well as a few tools you can use to keep tabs on your disk
    usage.*


    Although conserving disk space has almost become a thing of the past, it is still
    occasionally necessary to compress your files or bundle them up for archival purposes.


    # COMPRESSING FILES


    Historically, hard disk storage space has been an expensive commodity in both
    the corporate and home-use environments.


    > **Times Sure Do Change** On a purely historical note, an 80Mb SCSI-1 drive cost
    $369 in 1988, and a 20Mb MFM replacement drive for a PC-AT recently found by a
    friend of the author included its original packing receipt—a bill to the tune
    of $720! Today, $500 can buy 5GB or more of storage.


    With today''s extremely inexpensive hard-drives, the pressure to maximize disk
    usage efficiency is much lower than it has been in the past; but in some environments,
    such as schools, the pressure is still present. If you happen to be using a system
    where disk space is at a premium, you can use the commands in the compression
    section of this lesson to reduce the amount of space your files occupy—or to fit
    more stuff in the space you'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'are allowed. Even if disk space isn''t a concern for you, there are occasions,
    such as when sending files via email or distributing them over the Internet, when
    compressing files might be a wise choice.


    There are three major compression formats you are likely to encounter when using
    UNIX: compressed files made using the UNIX program compress, zipped files made
    using UNIX or personal computer versions of the PKZIP program, and gzipped files
    made using the GNU gzip utility. Each of these formats has a set of programs for
    compressing and uncompressing. Also appearing recently is the bzip2 compression
    utility, which, despite being the new kid on the block, looks very promising for
    tight compression.


    # compress/uncompress/zcat


    The creatively named compress command uses an older UNIX compression format that
    is slowly dying out as the gzip format gains popularity. Files created with the
    compress command have the file suffix .Z. To use the compress command to compress
    a file, you simply issue the command as compress <filename>.


    The equally creatively named uncompress command uncompresses (surprise!) the results
    of a compress command. To use the uncompress command, you issue the command as
    uncompress <filename>.Z.


    The zcat command (with its slightly less intuitive name) is a version of cat that
    reads compressed files rather than normal text files.


    Using zcat is as intuitive as using compress and uncompress; issue the command
    as zcat <filename>.Z. To make zcat somewhat more useful if you''re trying to look
    at a large file, you can pipe the output into your pager of preference. To do
    this, issue the command as zcat <filename>.Z | more. The vertical bar, |, is the
    UNIX pipe character—it pipes the output of the command preceding it into the input
    of the command following it. (You''ll learn more on this in Lesson 12, "Input
    and Output.")


    For example, if you''ve got a compressed file named stuffed.Z and you want to
    read stuffed without bothering to uncompress it first, you can type:


    ```

    > zcat stuffed.Z | more

    ```'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'Your machine will respond by using more to page you through the document.


    # zip/unzip


    Based on the algorithm from the PC standard PKZip program, the zip and unzip programs
    work exactly as you might expect them to: zip <filename> to compress a file with
    zip, and unzip <filename>.z to unzip the files.


    Creating files using the zip format (which uses the file suffix .z in UNIX) for
    distribution to other UNIX users is generally not a good idea, as zip and unzip
    are not always available to UNIX users; these utilities are freeware, so get your
    system administrator to install them if you need to have access to them. If your
    target, however, is users of Macintosh or Windows computers, zip is a file format
    that they can most likely read.


    Both the zip and unzip programs have a number of potentially useful options, a
    list of which can be displayed by issuing either command followed by the option
    -h.


    # gzip/gunzip/gzcat


    gzip, the GNU free software answer to the compress/uncompress suite of programs,
    was created in response to the realization that UNIX''s compress/uncompress programs
    were based on proprietary algorithms—and that this might someday entail licensing
    fees. Again, the gzip, gunzip and gzcat programs work essentially identically
    to the compress/uncompress/zcat suite. Files compressed in the gzip format use
    the file suffix .gz and are generally smaller than files compressed with compress.


    To make your life a bit easier, GNU has included the capability to deal with compressed
    (.Z) files in their gunzip and gzcat utilities.


    > You might find that gzip and gunzip exist on your system, but that gzcat is
    missing. Some distributions have renamed gzcat to zcat because it handles compressed
    files as well.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# bzip2/bunzip2


    Although it is a relatively new addition to the UNIX compression scene, the bzip2
    compressor appears to produce better compression than either compress or gzip.
    The syntax and options for bzip2 have intentionally been made similar to gzip,
    so if you encounter this program as it grows in popularity, you won''t have too
    much trouble figuring it out. Compression with bzip2 follows the gzip format bzip2
    <filename>, which produces the compressed file <filename.bz2>. Decompression is
    simply bunzip2 <filename.bz2>.


    The bzip2 compression and decompression utilities appear to be in development
    as of this writing, so it would not be surprising to find that the commands evolve
    over time (bzip2 and .bz2 files are an update of a prior bzip program which made
    .bz files). If you encounter these programs and need to do more than trivial compressions
    or decompressions, it is recommended that you consult your local man pages for
    more current information.


    # MANAGING YOUR DISK USAGE


    If you''re on a system where you need to worry about disk usage, have a disk quota
    which you must remain under, or are just curious about how much space your files
    are taking up, there are a number of ways for you to look at this data; they are
    detailed in the following list:


    +   - **The ls command** Referring back to Lesson 4, "The File System," you know
    that you can use the ls command with the -l option to display disk usage for a
    file or files. If you need to scan quickly through your files to see which ones
    are taking up the most room, this is a quick way to do it.

    +   - **The find command** In Lesson 5, "Finding Files," you were introduced to
    using the find command to find files larger than a certain size. Although similar
    in utility to the ls -l command for this purpose, find -size # is a faster way
    to collect information on all files larger than # kilobytes—you just have to know
    what # you''re looking for.'
  merge: -1
  img_proc: true
- pgno: 116
  md: "+   - **The df command** Used mostly by system administrator types, the df\
    \ command gives information about disk usage. Depending on your version of UNIX,\
    \ you might have to give df different options to get it to produce readable output;\
    \ but the general form you'd be interested in is df -l ., which asks the file\
    \ system to tell you about the usage of the drive upon which the current directory\
    \ resides. The response is usually in the form of a logical device name (which\
    \ you can ignore), followed by information about the total capacity of the device,\
    \ the amount of storage in use on the device, the percentage of usage of the device,\
    \ and the mount point (path to the directory at which the device appears) for\
    \ the device. You might have to try variations on df -l . or df -k .l, or check\
    \ your man pages to find the option that works on your version of UNIX.\n+   \n\
    +   - **The du command** Another system administrator type command, du provides\
    \ information about disk usage by directory. Again, different versions of UNIX\
    \ use slightly different syntaxes, the general form you will be most interested\
    \ in is du -s *, which asks the file system to produce a disk usage summary for\
    \ everything in the current directory. For each item in the current directory,\
    \ du -s * returns a summary of the total disk space used by the contents of the\
    \ files or directories. Depending on your version of UNIX, you might or might\
    \ not need to supply du with the -k flag to convince it to show you the disk usage\
    \ in values of kilobytes (otherwise it shows you the disk usage in values of the\
    \ file system's native block-size—usually 512 bytes).\n\n# ARCHIVING FILES: tar\n\
    \nIf you spend much time using UNIX systems, you're bound to run into tar files.\
    \ Tar is short for Tape Archive, though the tar command and its output are rarely\
    \ used for archiving to tape anymore. More sophisticated and more powerful programs\
    \ have taken over the job of archiving to tape, but the tar command remains a\
    \ convenient and useful tool for personal archiving and distribution of files.\n\
    \nThe tar command in its simplest form either creates or unpacks archive files.\
    \ When creating an archive, you provide tar with a filename for the archive and\
    \ a list of files that you want to archive. The program then"
  merge: -1
  img_proc: true
- pgno: 117
  md: 'collects all the files and bundles them into a single tar-file, which you can
    then store for future use or distribute conveniently via the World Wide Web, FTP,
    or email. When unpacking archives, you provide tar with the name of a tar-file
    and it extracts the contents of the file into the current directory, with the
    exact same file names, paths, and contents that existed on the system where it
    was tarred.


    To use tar to create an archive, use the following steps:


    +   1. Determine the name you want for your archive tar-file; normally, it will
    have the suffix .tar.

    +   2. Determine the filenames of all the files you want to include in the tar-file,
    or, more often, the name of a directory that you want to archive.

    +   3. Issue the tar command as `tar -cvf <tarfilename.tar> <files or directories>`.


    For example, if you have a directory named lots-a-stuff in the current directory,
    you can archive the entire contents of lots-a-stuff—all the files in it, and all
    the directories in it, and all the files in all the directories in it, and so
    on—by typing the following:


    ```

    > tar -cvf lotsastuff.tar lots-a-stuff

    ```


    Because you gave it the -v (or verbose) option, your machine responds by telling
    you about every file that it''s putting in the archive; in the end you have a
    new file named lotsastuff.tar. This new file contains the entire contents of your
    lots-a-stuff directory, with all the directory structure and file attribute information
    intact.


    To unpack a tar-file, you simply issue the command tar -xvf <tarfilename.tar>.


    If you give this file to a friend, your friend can unpack the tar-file by typing
    the following:


    ```

    > tar -xvf lotsastuff.tar

    ```


    After a list of everything in the file (that -v option again), your friend has
    a new directory named lots-a-stuff in his or her current directory, and it contains
    the complete contents of your lots-a-stuff directory. Any subdirectories in your
    lots-a-stuff directory, as well as all their contents, are present.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# Polite Use of tar


    If you don''t know what is in a tar-file, it''s often a good idea to use tar -tvf
    <tarfile.tar> before unpacking it. The -t option is the tell option, and asks
    tar to tell you about the contents of the file rather than unpacking it. This
    is a useful way to determine if the person who created the tar-file was a nice
    person who put everything in a directory and then tarred the directory, or if
    they were an impolite person who put everything in the current directory before
    tarring it. If you run into a tar-file created by an impolite user and make the
    mistake of untarring it in an inconvenient place—your home directory, for example—tar
    will end up dribbling files all over your home directory. You will then be stuck
    finding all the files and putting them in a subdirectory by hand, which can sometimes
    be a very tedious process. Be a polite user—don''t tar files, tar directories.


    If you''ve accidentally untarred an unfriendly tar-file, you can remove it all
    again by automating the rm command. (You will learn more on this sort of automation
    in Lesson 14, "Basic Shell Scripting.") If you''re brave enough to try this, the
    command \rm -rf `tar -tf <tarfile>` does the trick. However, until you''re comfortable
    enough with UNIX to look up the parts of that command and understand what it does,
    it''s not recommended that you experiment with this.


    # PREPARING FOR EMAIL TRANSMISSION: uuencode/uudecode


    If you need to send your files to another user, you can do so easily by including
    them in an email message. Today''s personal computers can all do this fairly transparently
    by using attachments, but UNIX users have been largely left behind. Email on UNIX
    machines pre-dates the existence of most personal computers, and UNIX users had
    been transferring files'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'around the world in email for years before personal computers discovered the
    concept of the Internet. Many UNIX users, however, are still stuck making attachments
    by hand—which seems a little unfair because it’s UNIX machines that do the work
    of making the Internet possible for the personal computer users. If you aren’t
    using one of the more user-friendly email clients (more on email clients in Lesson
    18, “Accessing the Network Resources”) that can handle attachments automatically,
    you’ll need to create them manually and insert them into your email yourself.
    Still, it isn’t a very difficult task. The more difficult task is convincing the
    personal computer users you might have to interact with to use a cross-platform
    attachment format, such as uuencode, instead of whichever proprietary format the
    popmail-client authors decide to favor this week.


    The uudecode program accepts any file as input, and it produces an encoding of
    the file that can be included in an email message. To a person, the contents of
    this file look like random characters; on the receiving end, however, the user
    can use the uudecode program to extract the original file. Because every email
    program is different, you’ll need to consult the documentation for your email
    client on how to include a file in a message. Here, you’ll just learn how to create
    the uudecoded file from your original, and how to uudecode it again on the other
    side.


    To use the uudecode command, you need to follow these steps:


    +   1. Determine the name of the file you want to encode for email transmission.

    +   2. Determine what you want the file to call itself at the other end.

    +   3. Issue the uudecode command as uudecode <filename> <callmethis> > <filename>.uue
    (Yes, you need to type the > before the <filename>.uue argument.)


    Your computer will then produce a file named <filename>.uue which contains the
    uudecoded version of the file.


    For example, if you have a file named sendtojoe and you want to uencode it, you
    can type the following:


    ```

    > uudecode sendtojoe hijoe > joe.uue

    ```'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'Your computer produces a file named joe.uue, which when decoded by Joe is named
    hijoe and contains the contents of your sendtojoe file.


    Now you can copy and paste, or include, or do whatever you need to do to insert
    the file you just created into an email message and send it wherever you want.


    Of course, if you receive a uuencoded file, you need to know how to decode the
    file. Decoding a uuencoded file is also extremely simple; issue the uudecode command
    as `uudecode <filename.uue>`.


    Your machine will produce a file in the current directory identical to the one
    originally uuencoded.


    > **Clearing up .uue** The filename of the .uue file and the filename to which
    it will decode itself do not have to be the same. This is sometimes confusing.
    If you receive a file named kludge.uue, issue the uudecode kludge.uue command,
    and do not find a file named kludge in your directory, don''t be alarmed. The
    uuencoded file contains the filename as well as the uuencoded file contents. To
    find out what the uudecoded file will be named, use the head command to look at
    the first few lines of the uuencoded file. The filename to which it will decode
    appears on the first line.


    # KDE ARCHIVING TOOLS


    Desktop environments also now provide convenient drag-and-drop file compression
    and archiving tools. The KDE environment, for example, provides the KZip archive
    and compression tool.


    To access the KZip tool, click the K on the KDE toolbar, choose Utilities from
    the pop-up menu and Zip from its submenu. A window similar to the one shown in
    Figure 10.1 will appear.'
