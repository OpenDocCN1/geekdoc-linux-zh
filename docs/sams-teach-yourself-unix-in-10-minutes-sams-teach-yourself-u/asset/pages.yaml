    kiwisplitaa\n:::::::::::::::\nJoan 92\nWill 78\nJohn 21\n:::::::::::::::\nkiwisplitab\n\
    :::::::::::::::\nKim 99\nKama 85\nJack 87\n```\n\nThe kiwi.txt file from the previous\
