- pgno: 35
  md: '![](img/2c005cbaad58c25c7f54da948131a75e_35_0.png)


    FIGURE 2.1 KDE has an integrated HTML-based help system.


    # SUMMARY


    There are many help resources available for UNIX. Depending on your needs, you
    can approach your search for information in several different ways. The methods
    you are now familiar with are


    +   - UNIX Manual Pages—Use the man command to display full information about
    a specific command. The apropos, man -k, man -f, and whatis commands can display
    summary information and search for a specific type of command.

    +   - Built-in Help—Many programs have built-in help that can be displayed with
    a command line argument, usually --help or -h.

    +   - Local Documentation—Every installation of UNIX ends up with a little something
    from the personality of the system administrator—so every one is a little different.
    Local documentation can help you find your way around the places where your installation
    differs from the collective norm.'
