  md: "![](img/2c005cbaad58c25c7f54da948131a75e_104_0.png)\n\n# LESSON 9\n\n# TEXT\
    \ AND FILE UTILITIES\n\n*In this lesson you'll round out your look at text utilities\
    \ by learning how to perform some routine, and some not-so-routine, tasks on text\
    \ files.*\n\nSome of what you're going to see in this lesson might not seem to\
    \ be useful, but using this information in conjunction with other commands can\
    \ be very powerful. If you take up shell scripting (discussed in Lesson 14, \"\
    Basic Shell Scripting\"), you'll appreciate that UNIX includes utilities that\
    \ can make your programming life simpler.\n\n# COUNTING LINES, WORDS, AND CHARACTERS:\
    \ WC\n\nIf you want to get quick statistics about a text file on your machine,\
    \ but don't want to load it up into a word processor, you can use the wc command\
    \ to provide information on the number of lines, words, and characters within\
    \ a single file.\n\nTo use wc, simply supply the name of a file you want analyzed,\
    \ in the following form: wc <filename>. If you pass more than one filename to\
    \ wc, all the files are processed, and a grand total for everything is returned.\n\
    \nFor example\n\n```\n```\n>wc *.txt\n  390   2799  16284  intro.txt\n  4944 \
    \ 43494  257939 lesson7.txt\n  5244  46293  274223 total\n```\n```\n\nIn this\
    \ example, we have processed all the .txt files in the current directory (intro.txt\
