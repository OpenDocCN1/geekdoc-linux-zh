- pgno: 95
  md: '![](img/2c005cbaad58c25c7f54da948131a75e_95_0.png)


    # LESSON 8

    TEXT EDITING


    *In this lesson you will learn the basics of editing files in the UNIX environment.*


    As I pointed out in Lesson 7, "Reading Files," when using UNIX you are frequently
    required to work with text files. Now that you know how to read them, it’s time
    to learn how to create and edit them. In this lesson, you will learn to start
    and exit the most common editors, perform simple insertions and deletions, and
    save your work.


    Many UNIX programs use text files as input, create text files as output, or are
    configured commands and variables set up in a text file. In order to change the
    contents of these files you need to make use of a text editor.


    As a matter of fact, most UNIX software doesn’t know the difference between a
    text file and any other file. From the operating system’s point of view, files
    are files are files. If the user chooses to view some of them as containing text
    and others as containing programs, that’s the user’s business. An interesting
    consequence of this lack of concern about a file’s contents is that the operating
    system is just as happy to allow you to use a text editor to edit the contents
    of your spreadsheet program as it is to enable you to attempt to run your email.
    Of course, if you actually have execute permission set on your email and try to
    run it, it’s almost certain to just segmentation-fault—crash—immediately; but
    UNIX will try.


    **Editing to Your Advantage** if you are a programmer, you might find this lack
    of a distinction to be useful. On occasion, you might find a program that needs
    a minor change, such as correction of a misspelling or a'
  merge: -1
  img_proc: true
- pgno: 96
  md: '> change of wording. In this instance, it is sometimes most convenient to simply
    load the executable file into a text editor and make the correction directly in
    the binary. This isn''t a trick for the faint of heart, but sometimes it''s the
    quick fix you need...and sometimes it''s the only fix for software that you don''t
    have the source code for.


    If you spend much time discussing UNIX editors with long-time UNIX users, you''ll
    find that there is a disagreement of warlike proportions between the users of
    the two most common editors—vi and emacs. Although these editors are actually
    rather complimentary in their functions and are both useful tools to have in your
    toolbox, chances are you''ll end up running into many users who insist that one
    or the other editor is completely useless. If you listen to them, you''ll be depriving
    yourself of the better solution to some tasks.


    Most UNIX editors have immense power. emacs, for example, not only contains its
    own built-in programming language, but can also function as a complete windowing
    system for users who are stuck on text-only terminals. However, there is not enough
    room in this quick guide to cover more than the basics. After mastering the simple
    tasks presented here, the interested reader can make a trip to the library or
    bookstore and choose from among the several books available on each of the more
    popular UNIX editors.


    # QUICK AND DIRTY EDITING: vi


    The vi editor is UNIX''s most universal editor. Some users pronounce it vee-eye,
    whereas others pronounce it vye. (There seems to be no consensus, but the people
    who call it vye are still wrong!) vi isn''t an easy editor, and it isn''t a friendly
    editor. What it is, however, is a quick-starting editor with a very small memory
    footprint, which you will find on every UNIX'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'machine that you sit down in front of. Because of its ubiquity, knowing the
    basics of vi will enable you to work with your files even if there are no more-convenient
    editors available.


    Follow these steps if you need to use vi:


    +   1. Determine what file you want to edit.

    +   2. Issue the vi command as `vi <filename>`. The vi editor can also be started
    with no filename if you''d prefer to start a new document and haven''t decided
    on a name.


    When you start vi there are a number of things you need to know to make it useful.
    The Return key has been included here because although some of these commands
    take effect immediately upon pressing the respective keys, others require Return
    to be pressed after them.


    vi operates in one of two modes: command mode or insert mode. In command mode,
    you have control of things such as cursor position, deleting characters, and saving
    files. In insert mode, you can insert characters. This distinction is bound to
    be confusing at first, but you''ll find that vi''s speed and universal presence
    outweigh its odd interface when performing some tasks. Some of the most-used tasks
    are featured in Table 8.1.


    TABLE 8.1 COMMON vi ACTIONS


    | MODE | Key(s)/Key COMBINATION(s) | ACTION |

    |---|---|---|

    | Command | l | Move right |

    |  | h | Move left |

    |  | j | Move to the next line |

    |  | k | Move to the previous line |

    |  | Put cursor on the character to delete and then hit the x key | Delete a character
    |'
  merge: -1
  img_proc: true
