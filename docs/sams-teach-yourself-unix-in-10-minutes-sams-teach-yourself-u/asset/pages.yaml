    data to a printer. (lpr is discussed in Lesson 17, "Printing.")

    +   - **xterm**—Starts a terminal, and can be told to start a program running
    in the terminal window by using the -e option.


    # So Many Shells on the Beach


    As has probably become apparent to you if you''ve spent as much time playing with
    your UNIX account as you have reading this book, UNIX has an abundance of shells
    available for you to use. The syntax and available commands in each of these shells
    ranges from subtly different to extremely different. For the purposes of this
    lesson, you''ll be using commands and syntax compatible with csh and tcsh.


    The bourne shell, sh is probably the best shell to write scripts in if you''re
    concerned about distributing large sophisticated scripts to unknown users. It''s
    not the easiest shell to use at the command line, though, so you''re better off
    starting with the same shell you use in day-to-day life.


    # DOING IT AGAIN AND AGAIN: foreach


    Instead of spending time collecting commands into a file to automate them, you
    can get a lot of mileage out of simple automation techniques'
