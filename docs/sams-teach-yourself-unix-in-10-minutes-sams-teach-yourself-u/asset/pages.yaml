- pgno: 133
  md: '# SCHEDULING COMMANDS: at AND cron


    With the capability to run processes in the background comes the ability to schedule
    processes to run at certain times—even when you''re not logged into the computer.
    There are two ways to set up your UNIX computer to run a command at a certain
    time. Unfortunately, these might be disabled, depending on the level of control
    your administrator has chosen to implement. Allowing users to schedule commands
    for any time they want can be a bit dangerous. The two commands that you''ll want
    to check out are cronbat and at: they are described as follows:


    +   - cron—Runs constantly on your system, and is probably already in use to run
    log rotation and various cleanup commands. You can create a personal crontab file
    that holds information about the interval that you want a command to run, and
    then use the crontab <filename> command to add your request to the system''s crontab
    file. cron enables you to run commands in intervals as small as a second or as
    long as a year. With some UNIX versions you can use crontab -e to bring up your
    currently set crontab entries directly into an editor as well.

    +   - at—Enables you to run a command once, rather than at a repeating interval.
    This is useful if there is a processor-intensive task that you want to run after
    business hours so that other tasks aren''t affected.


    Before you attempt to use either crontab or at, check with your system administrator.
    Scheduling processes blindly can affect other users and degrade system performance
    tremendously if inappropriate processes are scheduled to run simultaneously.


    # X WINDOWS PROCESSES


    If you''ve been playing around in the X Window System, it is probably obvious
    that you can run multiple programs at a single time. Each of these programs runs
    with its own PID, just as you''d expect. Each of these programs is launched separately,
    so they are actually already sharing processor time—no one program is in the foreground
    or background. You can'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'adjust the process priority from the command line, just as you do with any
    other program. Exiting X Windows kills all the active processes you are running.


    # SUMMARY


    You''ve covered a lot of ground in this lesson. Understanding processes can be
    a bit difficult at first, but, depending on your use of the system, you might
    never need to do much more than put a process into the background. If you use
    KDE exclusively, you''ll find that processes work exactly as you might expect
    on any desktop operating system. Following is a review of what was discussed in
    this lesson:


    +   - &—The ampersand can be used to put a process into the background. You want
    to use this if you are going to be running something that takes a long time to
    complete, and that requires little or user interaction.

    +   - bg/fg—The bg and fg commands can be used to move processes to and from background
    or foreground operation.

    +   - ps—To list all the processes that you are running on the system, use the
    ps command. You can also view processes that are controlled by other users, but
    you can''t modify their priority or kill them (the processes, not the users).

    +   - kill—This command is used to send a signal to a process. Normally this signal
    terminates the execution of the process. In other cases, it can cause a program
    to reread its configuration file or reinitialize itself.

    +   - nohup—Exiting a shell sends a SIGHUP (hangup) signal to all the running
    processes in that shell. To enable a process to continue running even after you
    log off, use the nohup command.

    +   - nice/renice—Every process on the computer has a priority that controls how
    much processor time a process gets in order to complete its task. Priorities range
    from -20 to 20, with the negative numbers being the higher priority.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '+   - top—The command top shows the current top CPU-usage processes that are
    running on the system. The display continuously updates, so you can view how much
    CPU time new processes take as they are added to the system.

    +   - at/crontab—You can schedule commands to run at certain times on your system
    by using the at and crontab functions. You will want to check with your system
    administrator and read the appropriate man pages before attempting to do so.

    +   - The X Window System (X Windows)—Programs running under the X Window System
    all execute simultaneously. There is no need to worry about backgrounding or foregrounding
    processes manually. You can, however, adjust the priority of X Windows applications
    from the command line, just as you do with any other process.'
