- pgno: 123
  md: '![](img/2c005cbaad58c25c7f54da948131a75e_123_0.png)


    # LESSON 11

    PROCESSES


    *In this lesson you will learn how to work with processes: view them, kill them,
    and bend them to your whims!*


    Everything that you''ve run on your system in the previous lessons, and everything
    that you''re going to be running in the rest of the lessons, created processes
    on your system. Each command creates a process that the UNIX operating system
    runs until it is finished or killed. Unlike some desktop operating systems, you
    can create processes that run entirely in the background, or that start and run
    in the middle of the night—without you even needing to be logged into the computer.


    # More Than One Command at a Time


    UNIX enables you to run more than a single command at a time. This capability
    is known as multi-tasking and is available in different forms on some other operating
    systems as well. What makes UNIX different is that absolutely everything on UNIX
    is a process: Want a clock? Run a program. Need to copy files? That''s a process
    too. Opening a window—yet another process. Although many personal computer OSes
    enable you to run a few applications at the same time, most handle large portions
    of their functionality by having it all be part of one big program. On UNIX, the
    actual operating system is very small, and it runs lots of programs simultaneously
    to provide the interface and other functionality to you.


    Along with UNIX''s absolute requirement to run many simultaneous programs just
    to provide the environment to the user comes the fact that the user can run as
    many simultaneous programs as he or she wants. On a UNIX box, you run programs
    for anything that you want to do. As a consequence of the way the OS works, it
    doesn''t actually matter whether or not you''re logged in while they run. Your
    being logged in is—you got it—just another process.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# PUTTING A COMMAND INTO THE BACKGROUND: &


    Making a command run in the background is simple; you simply add an & to the end
    of the line containing the command.


    For example, suppose you are running a program called analog to analyze your Web
    server logfiles. Most log analysis takes quite some time for a busy Web server,
    so you probably don''t want to wait around for the command to finish. In order
    to run analog in the background, you can just type the following:


    ```

    >analog /var/log/httpd/access_log &

    [3] 32566

    >

    ```


    The results are a bit cryptic, but you can see that you are returned to the command
    line, ready to go about your business! The two numbers that are returned identify
    the process on the system. The first result, [3], identifies this as process number
    3 that you''ve sent to the background. The second number, 32566, is the process
    ID. Your UNIX system potentially has hundreds of processes running on it, and
    each one is assigned a unique number. Whatever number your process happens to
    be assigned is returned as the second result value.


    ![](img/2c005cbaad58c25c7f54da948131a75e_124_0.png)


    > Running More than One Command To run several commands, one after the other,
    and put the whole group into the background, you can use the following syntax:
    {<command 1>; <command 2>; < command 3>} &. This creates a new shell to execute
    the commands and places it in the background. For example, if you wanted to run
    the analog utility on two files, you might use something such as the following:
    (analog /var/log/httpd/access_log; analog /var/log/httpd/new_access_log) &'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# SUSPENDING A COMMAND AND MOVING IT TO THE BACKGROUND: CTRL+Z AND bg


    If you happen to start a command without putting it into the background, you can
    still turn it into a background process. Let''s assume you''ve started the analog
    command without the ampersand.


    Following is an example:


    ```

    >analog /var/log/httpd/access_log

    ```


    To turn this into a background process, first press Ctrl+z to suspend the process.
    For example


    ```

    Ctrl+z

    [3]+ Stopped           analog

    =>/var/log/httpd/access_log

    ```


    The analog command has now been suspended, and is assigned process number 3. Remember,
    this is not the same as the process ID. It identifies the process number locally
    in your session, not globally to the system.


    To finish putting analog into the background, use the bg command followed by the
    local process number that you want to put into the background, as in bg ^<process
    number>. In this example, analog is assigned the process number 3, so that''s
    what you use in conjunction with bg. For example


    ```

    >bg %3

    [3]+ analog /var/log/httpd/access_log &

    ```


    UNIX responds by showing you that analog is now running with the & in the background,
    and you can continue using the system.


    > Using bg if you issue the bg command without an argument, it puts the most recent
    job you''ve suspended into the background; so, here you might have gotten away
    with just bg.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# RETURNING A PROCESS TO THE FOREGROUND: fg


    What happens if a process is accidentally backgrounded, or if you want to return
    a process to the foreground so that you can manually control it or check its status?
    In this case, you''d use the command fg and the process number to return that
    process to the foreground, with the syntax fg <process number>.


    In the preceding example, the analog process was assigned the local process number
    3 when it was put in the background. To bring it to the foreground, you''d type
    the following:


    ```

    >fg %3

    analog /var/log/httpd/access_log

    ```


    You''re now in complete control of the analog process again, as it is now running
    in the foreground.


    ![](img/2c005cbaad58c25c7f54da948131a75e_126_0.png)


    > Missing Process Number? What can you do if you''ve forgotten the local process
    number? Use the jobs command. The jobs command gives you a short listing of all
    your suspended and backgrounded processes, as well as their associated numbers.


    # LISTING THE RUNNING PROCESSES: ps


    If you really start using the backgrounding capabilities of UNIX, at some point
    you''re going to want to find out what you have running. To do this, you can use
    the ps command. The ps command returns a list of all the processes that you currently
    own.


    For example


    ```

    >ps

    PID TTY STAT TIME COMMAND

    8832 p1 R 0:00 ps

    30674 p1 S 0:00 /bin/login -h

    NEW93114217.columbus.here.com -p

    30675 p1 S 0:00 -bash

    31136 p1 T 0:00 analog /var/log/httpd/access_log

    ```'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'Working with ps Don''t be alarmed if your ps command doesn''t return exactly
    these results. This is one of the places where different versions of UNIX have
    commands that are similar, but not identical. The ps command has many options
    for formatting its display, so you might want to take a look at the man page for
    your system.


    If you run ps and see this result, it means that these are all the commands you
    currently have running. The columns are the system process ID (PID), the controlling
    terminal, the status of the process (running, sleeping, and so on), and the process
    itself. These are just the processes that you own. If you want to see everything
    anybody is running, try running ps -ax—this lists all the users'' processes (-a)
    and all processes that don''t have a controlling terminal (-x). If this doesn''t
    work, then try ps -ef The ps command has a huge number of options that can return
    tons of information. Take a look at the man page for more information. The primary
    concern right now is that you can list what you have running on the system and
    get your process IDs.


    # KILLING A PROCESS: kill, kill, kill!


    *Killing might sound a bit harsh for ending a process, but it does sum up the
    result quite nicely. When you kill a process you stop whatever it is doing, no
    matter what. If you''re editing a file, you risk losing the entire file if you
    kill the process instead of exiting out of the editor normally.*


    # USING kill


    Although the kill command is mainly used to stop processes, it can also be used
    to send signals to a process. SIGKILL is one such signal, but there are others
    that are less severe. Depending on the signal that you send, the process might
    reload its configuration files and reinitialize itself. This is extremely nice
    when you''re running something such as a Web server and need to add a MIME-type
    or change some server option without shutting down the server. To see a list of
    the signals that you can send using kill, invoke the command with kill -l, as
    follows:'
  merge: -1
  img_proc: true
- pgno: 128
  md: '```

    >kill -l

    1) SIGHUP      2) SIGINT      3) SIGQUIT     4) SIGILL

    5) SIGTRAP     6) SIGIOT      7) SIGBUS      8) SIGFPE

    9) SIGKILL     10) SIGUSR1    11) SIGSEGV    12) SIGUSR2

    13) SIGPIPE    14) SIGALRM    15) SIGTERM    16) STCHLD

    17) SIGCONT    18) SIGSTOP    19) SIGTSTP    20) SIGTTIN

    21) SIGTOU     22) SIGURG     23) SIGXCPU    24) SIGXFSZ

    25) SIGVTALRM  26) SIGPROF    27) SIGWINCH   28) SIGIO

    29) SIGPWR

    ```


    Documentation for the software you run on your system often includes information
    on the signals to which it will respond. The most important signals you''ll need
    are SIGHUP and SIGKILL. SIGHUP is the hang up signal and often forces a reload
    of configuration information for server processes. SIGKILL, on the other hand,
    forces the command to quit—no matter what. To send one of the signals, use kill
    <signal number> <process ID> ....


    For example, to kill process number 31136, type the following:


    ```

    >kill -9 31136

    [2]+ Killed analog

    =>/var/log/httpd/access_log

    ```


    If you look at the process listing again, PID 31136 will be gone. You''ve successfully
    killed it! Check by typing the following:


    ```

    >ps

    PID TTY STAT TIME COMMAND

    18303 pt R 0:00 ps

    30674 pt S 0:00 /bin/login -h

    NEW93114217.columbus.here.com -p

    30675 pt S 0:00 -bash

    ```


    Sure enough, kill has done away with process number 31136, and analog is no longer
    running on the system.


    # EXITING A SHELL TO KILL A PROCESS


    If you''ve backgrounded several processes, chances are you don''t need to explicitly
    kill them when you log out of the system. The shell sends a SIGHUP signal to all
    the processes you''ve started, which will probably kill them. If you want to create
    a process that will not be killed when you exit your shell, you can do this with
    nohup.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# PREVENTING DEATH: nohup


    The nohup command can be prefixed to any other command to prevent it from being
    killed with the SIGHUP signal. For example, if you wanted to prevent your analog
    process from being killed when you exit the shell, run it as follows:


    ```

    >nohup analog /var/log/httpd/access_log &

    nohup: appending output to ''nohup.out''

    ```


    This runs your analog program in the background and prevents it from being killed
    when you exit your shell. The system also notes that any output that the command
    produces will be stored in a file called nohup.out.


    # PROCESS PRIORITY: nice AND renice


    Processes that run on UNIX have different levels of priority. The amount of priority
    that a process is given can alter how long it takes to complete, as well as how
    long other processes on the system might take to run. Processes are given chunks
    of time on the computer''s CPU. The level of priority determines how many of these
    chunks a certain process gets. It isn''t very nice to run a computationally intensive
    task that doesn''t need to be finished quickly and have it use up all the processor
    time on the computer.


    Priority levels on UNIX range from 20 to -20, with the default level being 0.
    Although it might seem a bit backwards, -20 is actually the highest priority a
    process can have, and 20 is the lowest. To control process priority, use the nice
    and renice commands.


    # USING nice


    nice is another command that is used as a prefix to the command that you want
    to run. The syntax for nice is `nice <-priority> <command>`. Continuing the analog
    example you''ve been using in this lesson, you''re going to run analog at the
    lowest level priority possible. Analyzing log files is not a high priority task—there
    is no sense in running it quickly.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '![](img/2c005cbaad58c25c7f54da948131a75e_130_0.png)


    > nice The nice command is yet another example of slight variations between different
    commands with the same name. Some versions of nice use -n <priority> instead of
    <priority>.


    For example


    ```

    >nice -20 analog /var/log/httpd/access_log &

    ```


    This puts the analog command into the background and assigns it a priority level
    of 20. Remember, this is the lowest level priority that a process can have!


    ![](img/2c005cbaad58c25c7f54da948131a75e_130_1.png)


    > Changing Priorities Normal users can''t set priorities below 0—only the root
    user can do this. You can think of it as follows: running the program without
    nice is as high priority as you can get, and you can use the nice command to make
    it nicer to other users.


    # USING renice


    Suppose, however, that you''ve started a command with default priority that has
    been running for a day—for example, analyzing that big Web server log—and you
    have no idea when it''s going to finish. You figure you might as well lower the
    priority, and therefore its use of machine resources, and allow it to finish whenever
    it decides to. You can use renice to change the priority of a command that is
    already running.


    To do this, follow these steps:


    +   1. First, you''ll need to get a listing of your processes and make a note
    of the PID that you want to change.

    +   2. Issue the renice command using this syntax: renice <priority> <process
    ID>.'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'For example


    ```

    >ps

    PID TTY STAT TIME COMMAND

    8832 p1 R 0:00 ps

    30674 p1 S 0:00 /bin/login -h

    =>NEW93114217.columbus.here.com -p

    30675 p1 S 0:00 -bash

    31136 p1 R 0:00 analog /var/log/httpd/access_log

    ```


    If you want to change analog PID 31136 so that it is running with a lower priority,
    you can use the renice command in the following manner:


    ```

    >renice +15 31136

    31136: old priority 0, new priority 15

    ```


    PID 31136 is now running with the priority 15, as opposed to the original priority
    0.


    > Super User Power It is important to note that only the super user (root) has
    the capability to raise the priority of a running process. You can only lower
    the priority of a process--so don''t lower a priority thinking you can raise it
    if it runs too slowly. After it''s lowered, it''s stuck there unless your system
    administrator fixes it for you.


    # CHECKING THE PROCESSES ON YOUR COMPUTER: top


    Viewing the busy processes on your system is as simple as running the top command.
    top displays a continually updated list of processes, the amount of time they
    are using, and the process priority. To exit out of top press the UNIX break-sequence
    Ctrl+c.'
  merge: -1
  img_proc: true
