- pgno: 33
  md: 'Answerbook database, which is updated regularly to include helpful information
    as well as commonly asked questions and their answers. SGI includes what is essentially
    a set of online books marked up in HTML format. The files include everything from
    simple help documents to complete editions of several published professional references.
    Whatever the UNIX you''re using, check around for local documentation installed
    on your machine—it frequently contains large amounts of information compiled in
    a more convenient form than you''ll find anywhere else. Linux, a variation of
    UNIX, has a large grassroots user base. As a result, most Linux distributions
    include a great deal of documentation that has been developed and maintained by
    users. Following is a look at a few of these resources.


    # THE LINUX HOME PAGE


    Even if you''re using a commercial UNIX, there are things to be learned from Linux,
    the publicly-written and supported UNIX variant. As a resource created by users
    for users, this documentation is frequently the most up-to-date documentation
    on UNIX freeware/shareware.


    The Linux Home Page (http://www.linux.org/) is an excellent starting point; it
    provides links to vendors, applications, events, and other Linux goodies.


    # THE LINUX DOCUMENTATION PROJECT


    The Linux Documentation Project (LDP) is a continuously updated collection of
    information related to Linux. The LDP contains FAQs (Frequently Asked Questions),
    HOWTOs, and other documentation related to the installation and maintenance of
    Linux-based systems. This is of value to UNIX users because of the similarity
    of the two systems. To view the most current information, check the online LDP
    reference located at: http://sunsite.unc.edu/LDP/.


    # NEWSGROUPS


    Newsgroups provide a less structured approach to finding information, but you''ll
    be surprised at the amount of support you can get from complete strangers. Whatever
    your need, there is a UNIX newsgroup that can provide answers. To get started,
    take a look at'
