  md: 'Your script will, if everything works, produce exactly the results which were
    outlined at the beginning of this section.


    To explain a few of the things that happened in this shell script, the following
    might be helpful—most of this will be understandable from what you''ve learned
    thus far:


    +   - **echo**—This command puts things on its STDOUT. Here it is used to create
    a STDOUT stream containing "Howdy Neighbor," which is then fed to the mail STDIN
    via a pipe.

    +   - **mail**—This command can take a message on STDIN and send it to a list
