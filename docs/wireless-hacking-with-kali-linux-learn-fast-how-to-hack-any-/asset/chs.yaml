  ## 目标读者

  本书面向任何希望成为 IT 专业人士的人，特别是信息安全领域的人士。本书使用日常英语编写，不需要任何技术背景。如果你是信息技术或信息安全的初学者，本书的内容将提供关于网络和无线安全的高级概述。如果你正准备成为
  IT 专业人士，例如伦理黑客、IT 安全分析师、IT 安全工程师、网络分析师、网络工程师或网络安全专家，但仍然对此有疑问并想了解网络安全，你会发现这本书非常有帮助。你将学习围绕网络安全的核心概念和方法论，以及你应该关注的关键技术。如果你真的兴趣成为一名网络安全专家，这本书就是为你准备的。假设你正准备成为一名信息安全专业人士，本书无疑将为你进入该行业提供大有益益的详细信息。


  ## 引言

  无线渗透测试已成为专业渗透人员范围内的一项关键技能。本书将为你提供信息和关键行业洞察，帮助你对无线网络进行压力测试，从而帮助你更好地配置、管理和操作无线网络。不需要预先具备无线知识，但如果你具有计算机或网络设备（如网络交换机、路由器或常用协议）的某些工作经验，将是有益的。首先，我们将看看你应该拥有哪些软件工具以及从哪里获取，我们也会在书中涵盖这些内容。接下来，在硬件方面，我们将介绍你应该考虑拥有的用于渗透测试的无线适配器和网卡。之后，我们将介绍
  Virtual Box 和 Kali Linux 的安装。接着，我们将使用 Kali Linux、`mdk3` 或 `Ettercap` 等各种工具实现无线密码攻击、字典攻击、被动侦察、中间人攻击（MITM）、创建伪造接入点、去认证攻击、双孪生攻击（Evil
  Twin）和 DoS 攻击。然后，我们将使用 `Wireshark` 解密流量并查看捕获的帧和数据包，以便理解如何应用适当的措施来保护无线流量。与其在不理解底层技术的情况下破解无线网络，为了帮助你成为更好的渗透测试员，我们将研究
  `Ad Hoc Networks`（自组织网络）等关键技术以及如何保护它们。之后，我们将研究物理安全和蜜网接入点。在总结了无线攻击后，我们将从基础加密术语和无线加密选项（如
  WEP 漏洞、`TKIP 基础`以及定义 `CCMP` 和 `AES`）开始。之后，我们将开始研究无线认证过程，例如 `WEP 认证`、`802.11i 认证`、`四次握手`和其他无线认证方法。最后，我们将查看无线保护的额外解决方案，如快速漫游过程、消息完整性和数据保护、数据篡改、MIC
  代码和数据包欺骗防御措施。准备就绪，让我们开始吧！


  ## 无线威胁简介

  在接下来的章节中，我们将讨论无线网络安全威胁和防御措施。首先，我们将讨论主要的无线安全威胁。例如，当你身处咖啡馆或机场时，可能会面临种种威胁。我们不仅会讨论威胁，还会讨论你用以应对这些威胁的各种机制。许多人没有认为在连接到未知无线网络时，这些地方可能是一个危险的环境，但我们将讨论你如何防御常见攻击的技术方面。你可能遇到的首要威胁之一是其他人可以获取你用于访问公司账户的密码，或者你用于网上银行业务的密码。然后我们将讨论无线窃听。这也很重要，因为你的流量是在空中传输的，所以任何人都可以监听、捕获该流量，或者更糟糕的是在传输过程中对其进行修改。最后，黑客可以建立一个
  ad hoc 网络，希望你连接它，以便他尝试攻击你的机器并窃取你的机密信息。为了理解保护无线网络而建立的安全机制，了解你的无线网络可能遭受的威胁类型是有价值的。因此，我们将讨论你在公司办公室之外面临的威胁。那里有数百种威胁，但我将关注行业内人们讨论的关键威胁，并与你分享各种攻击类型的多样性。


