  ## 第 2 章 用于渗透测试的无线适配器与网卡

  许多人在讨论无线适配器和网卡时似乎很困惑。他们不知道它们是什么、为什么我们需要它们，以及如何选择正确的，因为有很多品牌和型号。我们所说的无线适配器是指通过 USB
  端口连接到计算机的设备，允许你与其他 Wi-Fi 设备通信，因此可以使用它连接无线网络并与使用 Wi-Fi 的计算机通信。你可能认为你的笔记本已经有了这个，是的，大多数笔记本和手机都内置了。但有两个问题。第一个问题是，如果
  Kali Linux 安装在虚拟机中，你无法访问内置的无线适配器；第二个问题是，这些内置无线适配器不适合渗透无线网络。即使你在笔记本上将 Kali Linux
  作为主机安装并访问内置无线网卡，你仍然无法将此无线适配器用于渗透测试，因为它不支持监控模式或数据包注入。你想使用它来破解 Wi-Fi 密码，并进行 Kali Linux
  中使用 `aircrack-ng` 等工具可以完成的所有酷操作。在我们开始讨论适用于 Kali Linux 的品牌和型号 之前，我想讨论一个更重要的因素，即无线适配器内部使用的芯片组。暂时忘记品牌。相反，我们将讨论无线适配器内部进行所有计算的“大脑”。这决定了适配器的好坏。它是否支持注入和监控模式以及是否与
  Kali Linux 工作，品牌是无关的。适配器内部使用的是什么才是组芯片组。有很多支持监控模式、数据包注入和 Kali Linux 的芯片组。其中一个是由 `Atheros`
  公司制造的，型号为 `AR9271`。这个芯片组支持监控模式或数据包注入，你可以使用该芯片组创建伪造接入点，也可以用它黑入网络。因此你可以使用这个芯片组完成几乎所有的
  Kali Linux 攻击。该芯片组的唯一问题是它只支持 2.4 GHz，所以如果你的目标使用 5 GHz 或某些设备连接在 5G 上，你将无法与这些设备通信。你甚至无法看到它们，因此无法对它们发起攻击。这不是因为芯片组不好，而是因为它看不到
  5 GHz 流量。


  如果你想获取使用该芯片组的无线适配器，有两个选择。好，你有很多选项，但我们将讨论。首先是一个廉价选项，你可以获取一个无品牌的无线适配器使用该芯片组，你可以用它执行上面提到的所有攻击。唯一的问题是这个适配器是无品牌的，所以稍微便宜。第二个选项是获取
  `AWUS036N` 适配器，由 `Alpha` 公司制造，这是一个非常受欢迎的公司，他们一直在制作优秀的适配器。它具有相同的芯片组并具有相同的兼容性。唯一不同的是质量，这是由非常好的公司制造的产品。它们运行良好，但唯一不同的是
  Alpha 适配器的范围更长且更可靠。廉价适配器更小、更紧凑，如果你在公共场所，它们比 Alpha 更容易使用，且具有大天线。下一个我想讨论的芯片组是由 `Realtek`
  公司制造的，型号为 `RTL8812AU`。这个芯片组在 Kali Linux 版本 1 支持监控模式、数据包注入以及 2.4 GHz 和 5 GHz 频率。该芯片组唯一的问题是它不像某些攻击那样可靠，某些攻击可能会失败，有时卡会断开连接。再次有两个选项。你可以获取一个比
  Alpha 便宜的廉价无线适配器并具有相同的芯片组，或者你可以获取 `Alpha` 的 `AWUS036ACH`，这是一个非常好的公司，拥有良好的声誉，Alpha
  适配器更强。最重要的点仍然是芯片组。


  ## 第 3 章 安装 Virtual Box 和 Kali Linux

  `Virtual Box` 是一种专门用于虚拟化各种操作系统的软件，可以安装在 Windows、Macintosh 或任何 Linux 上。它是免费下载的。下载完成后后，你可以从不同的平台构建并运行多个虚拟机（VM）。如何安装
  `Virtual Box` 的手册在上一章节中列出。使用该软件非常简单，建议在上面运行 `Kali Linux`。你可以使用其他虚拟机环境如 `vmWare`，但我个人多年一直使用
  `Virtual Box`，正如本书将提到的。`Kali Linux` 是一个操作系统发行版，你可以作为主操作系统使用，甚至从 USB 运行。一旦下载了 ISO
  文件，你就可以将其安装在现有的操作系统上。`Kali Linux` 是最好的渗透测试工具包，用于对现有网络进行测试并寻找可能的漏洞，改进网络安全。`Kali Linux`
  也是用户友好的，内置的工具类别用于信息收集、逆向工程、压力测试、漏洞评估、报告工具、利用工具（exploitation tools）、权限提升（privilege
  escalation）、维护访问等。一旦你下载了 `Kali Linux` 并准备好安装在虚拟机环境中，有一些需要注意的细节。为 `Kali` 创建新虚拟机时，必须分配至少
  4 GB 的空间。虚拟机构建完成后，必须进入设置，通过桥接（bridging）到路由器来调整网络设置。设置完成后，你应该能够启动镜像。你需要输入的命令是 `startx`
  然后按回车。这将开始从硬盘安装 GUI（图形用户界面），这也是建议的。在 GUI 安装之前，有几个你需要回答的问题，如语言、键盘和时区设置。安装完成后，你必须重启镜像以从硬盘启动。重启完成后，`Kali`
  会要求在 CLI（命令行界面）输入登录详情。用户名输入 `root`，密码输入 `toor` 并按回车。如果你是 CLI 新手且不知道输入什么命令，别担心。你随时可以通过输入命令
  `startx` 并按回车切换到 GUI。这将打开用户友好的 GUI，让你访问稍后讨论的所有渗透测试工具。你需要做的其他基础设置是 IP 划分。`Kali Linux`
  默认查找 DHCP 地址，但建议分配静态 IP 地址，以免你丢失哪个 IP 代表哪个机器。在 `Kali` 上分配 IP 地址的 CLI 命令是：`ifconfig
  eth0 10.10.10.2/24 up`。接下来你必须配置默认网关，即你的路由器 IP。要做到这一点，输入命令：`route add default gw
  10.10.10.1`。这些设置完成后，输入命令 `ping 10.10.10.1` 你的路由器 IP。一旦到达默认网关并能够访问互联网，通过命令 `ping
  google.com` 测试连通性。如果成功，意味着虚拟安装的 `Kali` 已连接到互联网。你需要接入互联网是因为你想更新 `Kali Linux`。更新 `Kali
  Linux` 是你的首要任务。在清洁安装后的首要任务是更新操作系统。高级软件包工具简称 `APT` 通过搜索存储库并安装带有所有所需依赖的包来扩展 Debian
  软件包的功能。打开控制台并输入 `apt-get update`，用于将本地包索引文件与 `sources.list` 中定义的源同步。在执行升级或发行版升级之前，应始终使用
  update 命令。接下来，你需要通过发出 `-y` 选项来升级 `Kali`，这将继续安装而无需每次写“yes”的麻烦。`apt-get upgrade` 代表用于安装系统上安装的所有包的最新版本。因此，`Kali`
  上现有的包将得到升级。需要注意的是，升级命令不会更改或删除未被升级的包，也不会安装不存在的包。最后，你需要执行 `distribution-upgrade` 命令，它会升级系统上安装的所有包及其依赖项。它还从系统中移除过时的包。你需要做的下一件事是重启机器。重启机器后，你就获得了一个全新的干净版本的
  `Kali`。要列出你机器上安装的 Debian 软件包，运行以下命令：`sudo apt list --installed`。如果有一堆包，你想知道某个特定工具是否已安装，可以通过添加
  `grep` 参数过滤结果。要显示包的完整描述并识别其依赖项，运行命令：`dpkg --status <packageName>`。最后，要从 `Kali` 中移除包，你应该执行命令：`sudo
  apt-get remove <packageName>`。当然，你需要将包名替换为你的应用程序名称。






  # 目录导航基础


  - 要立即返回主目录，请使用 `cd ~` 或 `cd`。

  - 要切换到 Linux 文件系统的根目录，请使用 `cd /`。

  - 要进入 root 用户目录，请以 root 用户身份运行 `cd /root/`。

  - 要返回上一级目录，请使用 `cd ..`。

  - 要回到上一次目录，请使用 `cd -`。


  # 备份 SSH Key


  接下来，你需要创建一个备份文件夹，并将 SSH 密钥移动到该备份文件夹中。


  注意：`cp` 命令是 Linux 中用于复制文件和目录的命令。语法如下：


  ```

  cp source destination

  cp dir1 dir2

  cp -option source destination

  cp -option1 -option2 source destination

  ```





  在以下示例中，将 `/home/test/paper/` 文件夹及其所有文件复制到 `/usb/backup/` 目录，使用以下命令：


  `cp -avr /home/test/paper /usb/backup-a`


  - `-a`: 尽可能保留指定的属性，如目录和文件模式、所有者、时间戳，以及额外的属性：上下文（context）、链接、xattr、全部。

  - `-v`: 详细输出。

  - `-r`: 递归复制目录。


  最后，你需要生成新的密钥集，因此使用以下命令：`dpkg-reconfigure openssh-server`。


  接下来，你将看到以下消息，表示你的 ssh 密钥已生成：

  Creating SSH2 RSA key; this may take some time …

  Creating SSH2 DSA key; this may take some time …

  Creating SSH2 ECDSA key; this may take some time …

  …


  接下来，你需要使用以下命令验证 ssh 密钥哈希：`md5sum ssh_host_*`。


  这里的 `*` 代表你的新密钥，请使用以下命令比较这些哈希值：

  `cd default_kali_keys/`

  `md5sum *`


  重新生成 SSH 密钥对后，你可以通过 CLI 从 `/usr/sbin/sshd` 启动 SSH 服务。


  # 第 4 章 无线密码攻击


  对组织面临最大的安全威胁之一是弱密码。当黑客或渗透测试人员试图渗透企业网络时，他们会寻找最弱的切入点。只需要有一个个人使用弱密码，他们的账户就可能被攻破，从而导致企业网络被攻破。


  黑客可以使用多种不同的攻击手段获取你的密码以进入你的无线网络。他们可以简单地索要密码，信不信，你会惊讶于有多少人会因为相信一个好听的故事而轻易被社会工程骗。


  他们还可以在你输入密码时从背后窥视，或者检查你的办公桌，以防你把密码写在了某个地方。这被称为“窥视攻击”（shoulder surfing）。攻击密码的两个主要机制是猜测密码是什么。


  字典攻击，顾如其名，是指我尝试字典中的所有单词，我也可以使用外语字典以及医学字典等。大多数人确实会使用一些容易记忆的东西，例如一个有意义的单词。


  有些人会使用配偶的名字，而另一些人使用宠物的名字；事实上，许多人使用他们的社会安全号码，这非常糟糕，因为这样黑客不仅破解了你的密码，还获取了关于你非常有价值的信息。


  如果你的密码不是字典中能找到的，那么黑客获取密码的另一种方法就是暴力破解（brute force attack）。这是我尝试所有可能的组合，直到找到你的密码为止。我可以表现得聪明一点，可能会优先使用密码中最常用的单词。


  例如，我可以暗示一些规则以寄于尽早破解，因为暴力破解的问题在于，如果我要尝试所有可能的组合，将花费很长时间。


  关于无线网络需要记住的重要点之一是，我并不是试图用许多不同的密码来攻击接入点（AP）。相反，我将嗅探空气，从已经认证的合法用户那里收集信息，然后对我收集的信息尝试暴力破解或字典攻击以找到密码。


  我可以在你不知情的情况下嗅探网络，因此我可以在无线网络中进行字典攻击或暴力破解，而你并不会意识到攻击正在发生。


  # 第 5 章 WPA/WPA2 字典攻击


  要在受 WPA 或 WPA2 的无线网络上执行字典攻击，我们将遵循四个步骤的过程。


  首先，我们要找到想要执行字典攻击的接入点的 BSSID。一旦找到了想要攻击的接入点，我们就需要决定想要在攻击中使用的单词列表（wordlist）。


  单词列表，顾如其名，是一个单词列表，类似于字典，我们将针对接入点尝试该单词列表。


  第三步是生成身份验证流量。为了使这种攻击生效，我们需要能够捕获合法用户连接到接入点，我们将生成这些流量，以便在空气中对其进行嗅探。最后，我们必须执行字典攻击。


  对于这种攻击，我们将使用 Kali Linux。要做到，你需要打开终端并查看配置。输入 `iwconfig`，你应该看到两个无线局域网适配器。无线 `wlan1`
  应该是你设备集成的无线局域网卡，而如果你成功桥接了设备，无线 `wlan0` 就是你的虚拟化 Kali Linux 域网适配器。


  这也是你将用于执行攻击的适配器。因此，你需要做的第一件事是将 Kali Linux 的 `wlan` 卡置于监听模式（monitor mode），但在在此之前，你必须通过输入关闭无线局域网适配器：`ifconfig
  wlan0 down`。


  接下来输入：`iwconfig wlan0 mode monitor`。


  此命令将你的无线局域网适配器置于监听模式。为了确保 wlan 重新启动，你需要输入命令：`ifconfig wlan0 up`。


  现在你的无线局域网适配器已启动，你想确认它现在处于监听模式。为此，你必须输入命令：`iwconfig`。在这里，你应该看到“Mode”旁边显示的内容。

