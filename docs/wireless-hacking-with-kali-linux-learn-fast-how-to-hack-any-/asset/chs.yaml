  ## 第 1 章 无线渗透测试工具列表

  我想让你对伦理黑客或渗透测试人员经常使用的无线工具有一个整体概念。无线网络中有各种类型的接口可以帮助你管理和监控它、检测伪造接入点、配置安全设置等。在书中，我们将查看不同的接入点，你将学习如何通过浏览器访问这些接入点。例如，`tcpdump`
  是一个常用的数据包分析器。`tcpdump` 在命令行运行显示所有 TCP/IP 数据包。`NetworkMiner` 在网络也非常流行，它分析网络流量并解码各种协议。`Detector`
  是另一个网络嗅探器，使用深度数据包检测来检测恶意流量，但 `Ettercap` 对于中间人攻击也非常有用。还有其他工具如 `NetworkMiner` 或 `Fiddler`。在书中，我们也将使用名为
  `Wireshark` 的工具。`Wireshark` 是 IT 专业人员用于分析无线和有线网络的优秀工具。大多数从事协议和网络的人应该熟悉或听过 `Wireshark`。`Wireshark`
  允许嗅探和捕获 Wi-Fi 流量，然后给出数据包列表，对于每个数据包，我们可以打开查看详情。`Wireshark` 以用户友好的方式显示如 `SSID` 或 `BSSID`
  等信息。我们将使用 `Wireshark` 查看与本书相关的数据包。我们还将使用其他渗透工具来理解无线攻击。我们首先需要讨论这些。在书中，你将看到如何进行无线攻击。目的是向你揭示攻击以及它们如何工作，通过正确的工具让你熟悉攻击类型，这样当我们谈论认证、加密和消息完整性时，你能够联系到我们将讨论的攻击。


