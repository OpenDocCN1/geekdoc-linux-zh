    > QUANTUM LEAP: HOVER AND INTEREST EXPLORER

    As you work with lists for navigation, especially horizontal lists, you''ll find
    that there are dramatic inconsistencies in the way Internet Explorer deals with
    styles compared to Mozilla, Firefox, Opera, and Safari. Internet Explorer is missing
    significant support for updated in years, and version 6.0 for Windows here with
    savvy styles to ensure that your work looks good in the widest range of browsers
    (as depicted here).


    One major issue with IE is that it supports the :hover selector only for the anchor
    element, whereas all other browsers support it for any element. If this were available
    in IE, there''d be less mess and fuss when dealing with list-based navigation—not
    to mention a wide range of additional options available for styling lists dynamically
    without using JavaScript. For other dynamic list navigation, which does not work
    in IE, see Eric Meyers'' CSS Edge, at http://www.meyerweb.com/eric/css/edge/.


    178 Link Effects, Lists, and Navigation > Horizontal List Navigation with Images'
