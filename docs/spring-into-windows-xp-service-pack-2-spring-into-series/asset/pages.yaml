    # QUANTUM JUMP: THE IMPORTANCE OF STRUCTURE


    In this chapter, you''ve gotten a great start learning about two of the most important
    aspects of a web page: text and links. But along the way, you also learned a bit
    about the importance of semantics, or meaning, of elements and their tags.


    This understanding is so important when you misuse elements to achieve visual
    results rather than convey meaning, you limit the document a great deal. The meaning
    of these elements is a part of logical document structure, and a logical document
    structure, in turn, generates what''s known as a document tree.


    A document tree is simply the hierarchical logic of your structure, based on the
    semantics of the tags you''re using to map out your content. This tree isn''t
    particularly relevant on its own, but the moment you begin applying CSS, JavaScript,
    or server-side scripts for dynamic content generation, the document tree becomes
    incredibly important.


    A clean document generates a logical document tree, making the CSS and scripting
    all the more easy because you can rely on advanced concepts in both that rely
    on such issues as inheritance. Without a clear document tree, you will be at a
    disadvantage when trying to debug documents.


    ![](img/516568206e0e220ce5a120446a34b48d_45_0.png)'
  merge: -1
