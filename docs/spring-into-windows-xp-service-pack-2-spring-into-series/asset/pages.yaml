  md: '# Margins, Borders, and Padding


    One of the coolest things about CSS is that you can style features such as margins,
    borders and padding. It''s not even being able to style such things that I find
    exciting, but the flexibility we have with the styles available.


    Consider that all elements have a border, and padding within the CSS visual model.
    The reason for this is that every element creates a box. Two types of boxes exist:
    block boxes (related to block-level elements) and line boxes (related to inline
    boxes). Figure 11-1 shows the difference.


    ![](img/516568206e0e220ce5a120446a34b48d_197_0.png)


    FIGURE 11-1 Examining boxes in the CSS visual model.


    I added a light gray background color to help with the visualization of block
    and line boxes. The h2 header is a box. It runs the width of the available browser
    space (width can control) and is followed by a line break after the block terminates
    at the right edge. The line box is demonstrated by a link and sits inline with
    the surrounding text. You can see how its edges run as close to the center as
    possible.


    By tapping into the CSS visual model, which is referred to as the Box Model, you
    can add styles to various portions of the box. I will show you the Box Model in
    the following section of this chapter so you can see exactly how the Box Model
    works, but the point is now that you can style not just all sides of a box, but
    also specific sides of that box.


    Margins give you the capability to control the box''s margins in both positive
    and negative values. Borders enable you to style the box''s border using a range
    of predefined styles, and padding enables us to add padding to the box (like adding
    cellpadding to a table). Being able to style these aspects of any element is one
    of the reasons CSS is far more powerful than any formerly available technology
    in terms of being able to style your pages with great control.'
  merge: -1
  pgno: 197
- img_proc: true
  md: '# Exploring the Box Model


    The Box Model is a standardized bit of browser technology. The W3C oversees standardization
    of browsers, so it has defined the Box Model (see Figure 11-2).


    ![](img/516568206e0e220ce5a120446a34b48d_198_0.png)


    FIGURE 11-2 The Box Model as defined by the W3C.


    Compare this figure with Figure 11-1, and imagine how the highlighted background
    of each box contains all these portions: margins, borders, padding, and the content
    area. Understanding this correlation will help you greatly as you proceed not
    only through this chapter, but also through chapters to come.


    # QUANTUM LEAP: THE BOX MODEL IN CSS DESIGN


    You''ll be spending all the remaining chapters working with aspects of the Box
    Model. Because CSS is used so much for visual styling, understanding the Box Model
    and the way it is interpreted and misinterpreted in browsers becomes a key issue
    in how well you will learn and in turn, apply CSS to your pages. As you''ll find
    out in Chapter 12, "Positioning, Floats, and Z-index," the Box Model relates only
    to how you style margins, borders, and padding, but also to how you use CSS as
    a positioning tool to achieve your layouts.'
