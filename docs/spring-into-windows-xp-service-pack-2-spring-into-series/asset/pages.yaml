  md: '# Rich Links, Lists, and Navigation


    It''s important to point out that the techniques in this chapter, particularly
    the way lists are being used in navigation, are a relatively new concept in web
    design. The mere fact that CSS lets you change the display of an element makes
    it very compelling to rely as little on imagery for effects as possible.


    NOTE

    Learn all about CSS lists by visiting Listamatic, a tutorial and gallery of great
    CSS-based navigation, http://css.maxdesign.com.au/listamatic/


    If you''re interested in a tool that will make some of these lists for you right
    online, check out List-O-Matic, http://www.accessify.com/tools-and-wizards/list-o-matic/list-o-matic.asp.


    Next up, you''ll be getting a bit more involved in the actual control of margins
    and padding, which is important for gaining a firm hand over your visual page
    elements. This will help segue you into the more complex aspects of CSS: laying
    out pages.'
