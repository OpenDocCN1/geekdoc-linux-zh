- img_proc: true
  md: '# The body Element


    The body element is where all the action takes place. It''s the element where
    you''ll be placing the content of your page and marking it up using XHTML to structure
    it accordingly. The element goes within the html element, directly below the head—makes
    sense, doesn''t it? (See Example 1-12).


    EXAMPLE 1-12 Placing the body element


    ```

    <html>

    <head>

    <title>Appropriate Title Text Here</title>

    </head>

    <body>

    </body>

    </html>

    ```


    When viewed in a browser, the information within the body element is what is displayed
    in the browser window, also referred to as the viewport. This is the content area
    only—no browser chrome (which refers to the browser''s interface components, such
    as scrollbars and status bars). Figure 1-3 shows Google in a web browser. Only
    the displayed content is within the viewport.


    ![](img/516568206e0e220ce5a120446a34b48d_25_0.png)


    FIGURE 1-3 Viewing body text within the browser viewport.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# HTML Comments


    Another important piece of markup that you''ll want to get started using right
    away is HTML comments. Comments enable you to hide content or markup for temporary
    purposes or backward compatibility, to identify sections within your document,
    and to provide directives for other folks who might be working on the page.


    The syntax for an HTML comment looks like this:


    ```

    <!-- -->

    ```


    What you are hiding, identifying, or providing in terms of guidance goes between
    the opening and closing portions of a comment. Example 1-13 hides the text within
    the body using comments.


    EXAMPLE 1-13 Hiding text content and markup


    ```

    <body>

    <!--

    <p>The content of this paragraph will not appear within the body so long as it''s
    within a comment.</p>

    -->

    <p>The content of this paragraph will be displayed, because it''s outside of the
    comment field.</p>

    </body>

    ```


    You can denote sections within your document, as shown in Example 1-14.


    EXAMPLE 1-14 Hiding text content and markup


    ```

    <body>

    <!-- begin primary content -->


    <!--begin footer information---->

    </body>

    ```


    Finally, comments are a useful way to provide directives (see Example 1-15).


    EXAMPLE 1-15 Providing guidance inside a comment


    ```

    <body>

    <!---- Angie: please be sure to use lists instead of tables in this section -->

    </body>

    ```'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Reviewing the Template


    Time to wrap up our exploration of a template by actually putting all the components
    together (see Example 1-16).


    **EXAMPLE 1-16** Viewing the structure of an XHTML document


    ```

    <!DOCTYPE html PUBLIC "//W3C//DTD XHTML 1.0 Transitional//EN"

    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">


    <head>

    <title>your site : location within site : topic title</title>


    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <meta name="keywords" content="your, keywords, here" />

    <meta name="description" content="your description here" />

    <meta name="author" content="your name here" />

    </head>

    <body>

    <!-- main content section --

    n</body>

    </html>

    ```


    Copy this markup, save it to a work folder on your computer, and name it index.html.
    This will be the file you open and add content and additional markup to as we
    progress.'
