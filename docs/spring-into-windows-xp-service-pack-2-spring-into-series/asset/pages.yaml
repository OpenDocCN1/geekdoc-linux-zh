  md: '# APPENDIX B

    CSS 2.1 Annotated Reference


    In this reference, you''ll find information about the selectors and properties
    available for use in CSS 2.1. Selectors are defined and described, an example
    is provided, and usage tips are offered. For properties, each property is first
    defined and described, with its media classification given. This is followed by
    an example and helpful usage tips.'
