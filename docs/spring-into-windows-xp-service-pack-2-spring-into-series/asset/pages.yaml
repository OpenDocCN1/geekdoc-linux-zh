  md: "# Selector: :lang pseudo class\n\nDescription: Selects an element based on\
    \ its language\n\nExample:\n\n```\np:lang(de) {\n  quotes: ' ' '' '\\'2039' '\\\
    '203A'\n}\n```\n\nTips: Inconsistent support exists. This selector is used for\
