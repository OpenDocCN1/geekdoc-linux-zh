  md: "# Spicing Up a Table Using Background Color\n\nIn this section, I'll show you\
    \ how to add a little spice to your tables using background colors. So far, you've\
    \ used element selectors, which relate directly to a specific HTML element, such\
    \ as body, h1, p, and a. In this section, you'll add what's known as a class selector.\n\
    \nClass selectors are custom that give you a name; to precede that name with a\
    \ dot, as in .classname. Classes are then applied to an element in the HTML using\
    \ the class attribute, with a value name of the class:\n\n```\n<tr class=\"classname\"\
    > . . </tr>\n```\n\nTypically, you'll want to describe the function of the class\
    \ rather than the presentation. So, if you're going to apply a background color\
    \ to every other table row, you'll want to name your class something like .alternator\
    \ instead of .gray. This way, if you want to change the color, you needn't change\
    \ the class name throughout your documents, which defeats the management advantages\
    \ of CSS.\n\nExample 8.4 shows a modified table you first worked with in Chapter\
    \ 4, \"Creating Tables.\" I noticed that I made one change in the table markup:\
    \ I took out all the table attributes except for cellspacing. This is because\
    \ there is no effective methods of providing cellspacing in CSS.\n\nI've also\
    \ added an embedded style that includes the table width, border, and padding styles,\
    \ with element selectors and a class selector to style the table using background\
    \ colors in the elements.\n\n# EXAMPLE 8-4 Styling the table with element and\
    \ class selectors\n\n```\n<!DOCTYPE html PUBLIC \"-//W3C/DTD HTML 1.0 Transitional//EN\"\
    \n  \"http://www.w3.org/TR/xhtml/xhtml1-transitional.dtd\">\n\n<html xmlns=\"\
    http://www.w3.org/1999/xhtml\">\n<head>\n<title>working with style</title>\n\n\
    <style type=\"text/css\">\nbody (color: white);\ncaption (background-color: #999;\
    \ border: 1px solid black);\ntable (background-color: #ccc; border: 1px solid\
    \ black; padding: 5px; width: 90%)\nth (background-color: #333; border:);\ntr\
    \ (background-color: #999);\ntd (background-color: #ccc; border: 1px solid black);\n\
    .highlight (background-color: #fff; color: orange;)\n</style>\n```"
