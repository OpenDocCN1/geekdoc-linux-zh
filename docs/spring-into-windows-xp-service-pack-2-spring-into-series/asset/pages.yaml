  md: '# The Black Cat


    By Edgar Allan Poe


    I married early, and was happy to find in my wife a disposition uncongenial with
    my own. Observing my parsimony of procuring of the most agreeable kind, she showed
    no objection to it. We had birds, gold fish, rabbits, a small monkey, and a cat.


    This latter was a remarkable large and beautiful animal, entirely black, and sagacious
    to an astonishing degree. In speaking of his intelligence, my wife, who had no
    little tincture of superstition, made frequent allusion to the ancient popular
    notion, which regarded all black cats as witches in disguise. That she never erred
    upon this point—and I mention the matter at all for no better reason than that
    it happens, just now, to be remembered.


