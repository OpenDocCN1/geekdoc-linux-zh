  md: "# Scripting and Browser Concerns\n\nIn some instances, people are using old\
    \ browsers with no JavaScript support or poor support for the script element itself,\
    \ or have JavaScript disabled. Working around these requires some additional markup.\n\
    \n> > NOTE\nMost contemporary web designers do not use the workarounds here they\
    \ absolutely know that they have support older browsers. However, you might want\
    \ to use them. At the very least, it's important that you see these techniques\
    \ in action you'll recognize them when viewing HTML from other sources.\n\n# Hiding\
    \ Scripts from Old Browsers\n\nIf you're using JavaScript, some older browsers\
    \ attempt to display whatever is contained within the script element as body text.\n\
    \nTo avoid this, many people get into the habit of \"commenting out\" their scripts—in\
    \ other words, using comment syntax to prevent the script from being displayed\
    \ (see Example 3-11).\n\nEXAMPLE 3-11 Hiding a script with comments\n\n```\n<head>\n\
    <script type=\"text/javascript\">\n  <!-- this hides the script from old browsers\n\
    \  function newWindow() {foodWindow = window.open(\"images/photo.jpg\",\n    \"\
    foodwin\", \"width=250,height=188\")}\n  // End the script from old browsers -->\n\
    </script>\n</head>\n```\n\nNote the //. This is JavaScript syntax that enables\
    \ you to write in a comment after that point that won't be displayed, either.\
    \ The commenting used here will not prevent the script from operating normally\
    \ in any browser that supports it.\n\n# Using the noscript Element\n\nIf you'd\
    \ like to add some text so supporting browsers will display a message regarding\
    \ script support, you can do using the noscript element (see Example 3-12)."
  merge: -1
