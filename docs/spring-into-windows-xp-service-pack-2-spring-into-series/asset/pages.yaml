    # # The Black Cat


    I married early, and was happy to find in my wife a disposition not uncongenial
    with my own. Observing my partiality for domestic pets, she lost no opportunity
    of procuring those the most agreeable kind. We had birds, gold fish, a fine dog,
    rabbits, a small monkey, and a cat.


    FIGURE 12-9 A fixed-position navigation bar.


    In browsers that support positioning, this menu will remain fixed no matter what
    moves. If I scroll the content, it will disappear under the menu (see Figure 12-10).


    ![](img/516568206e0e220ce5a120446a34b48d_223_1.png)


    FIGURE 12-10 The content scrolls beneath the fixed-position nav.


    You can see why I''m frustrated by IE''s lack of support for fixed positioning—what
    a useful positioning scheme.


    > NOTE

    Static positioning is the fourth positioning type. It simply positions a box in
    the normal flow and, because of that, it is rarely used. You can think of using
    using static positioning as similar to using the text-align: left; property and
    value. It''s the default behavior, so it is used only to override an earlier rule.
    You''ll rarely see static position in use as a result.'
