  md: '# The Black Cat


    By Edgar Allan Poe


    I married early, and was happy to find in wife a disposition not uncongenial with
    my own. Observing my partiality for domestic pets, she lost no opportunity of
    procuring those most agreeable kind. We had birds, gold fish, a fine dog, rabbits,
    a small monkey, and a cat.


    This latter was a pretty large and beautiful animal, entirely black, and sagacious
    to an astonishing degree of intelligence. My wife, who at heart was not a little
    tincted with suspicion, made allusion to the ancient popular notion, which regard
