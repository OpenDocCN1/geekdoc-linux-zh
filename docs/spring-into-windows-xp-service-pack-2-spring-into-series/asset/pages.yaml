  md: 'As the mouse passes over the link, the background turns italic (see Figure
    10-4).


    ![](img/516568206e0e220ce5a120446a34b48d_181_0.png)


    **FIGURE 10-4** Modifying the text style to italic in the hover state.


    Perhaps the most popular modification is removing the link underline. You can
    do this for all states with the text-decoration: none; declaration:


    ```

    a (color: orange; text-decoration: none;)

    ```


    As I mentioned, common styles to all states should be placed in the anchor element
    so you can tap into inheritance. There''s no need to add this declaration to any
    of the pseudo selectors because they will inherit the rule (see Figure 10-5).


    ![](img/516568206e0e220ce5a120446a34b48d_181_1.png)


    **FIGURE 10-5** Look, Ma–no underlines!


    You can mix and match rules, too. Some designers like to have the underline appear
    only in the hover state. To do that, you simply add the text-decoration: underline;
    declaration to the :hover selector, which overrides the inherited value in the
    anchor because of the specificity of the selectors (see Chapter 7, "Using CSS,"
    for more details on specificity). Figure 10-6 shows the links without underlines
    until the hover state is activated.


