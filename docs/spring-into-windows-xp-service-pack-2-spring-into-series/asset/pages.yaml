  md: '# # The Browser Viewport


    The browser viewport is the window in the browser through which the document content
    is viewed. This is a fairly simple concept, but again, it''s a distinct one from
    containing blocks.


    In positioning, in some cases, element boxes are positioned in relation to the
    viewport and not normal flow or containing blocks. So understanding the viewport
    is important (see Figure 12-4).


    ![](img/516568206e0e220ce5a120446a34b48d_215_0.png)


    **FIGURE 12-4** The Firefox browser with sidebar, menus, and status bar—the viewport
    is only the through which you''re seeing the document.


    > NOTE

    It considered conventional browser behavior to include a scrollbar in the viewport
    when the content is longer or wider than the available viewport space. Browsers
    behave differently in this regard, partly because the guidelines are not very
    specific when it comes to how browsers should ideally behave. As a result, there
    will be inconsistencies in the ways users experience your designs, no matter what
    techniques you use.'
  merge: -1
  pgno: 215
- img_proc: true
  md: "# Absolute Positioning: To the Root Element\n\nOkay, now understanding. It\
    \ means to have fun and actually put positioning to work! Absolute positioning\
    \ positions an element box in relation to its containing block. When you position\
    \ something absolutely, you take it completely out of the normal flow. In easy\
    \ terms, this means any box you position will always be positioned to either its\
    \ explicit container or to the html root element (not the viewport), no matter\
    \ what other content be on the page.\n\nOh, good! Now you get to see why I had\
    \ spent time up front to define the terminology. In Example 12-3, I've placed\
    \ a header and a paragraph into a containing block, and then positioned the block\
    \ to an offset of 100 pixels from the left and 50 pixels from the top.\n\n**EXAMPLE\
    \ 12-3** Absolutely positioning a block to the root\n\n```\n<DOCTYPE html PUBLIC\
    \ \"//W3C//DTD XHTML 1.0 Transitional//EN\"\n   \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
    >\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n  <title>working with\
    \ style</title>\n  <style type=\"text/css\">\n#content {\n    position: absolute;\n\
    \    left: 100px;\n    top: 50px;\n    border: 1px solid red;\n}\n</style>\n</head>\n\
    <body>\n  <div id=\"content\">\n<h1>The Black Cat</h1>\n  <p>I married early,\
    \ and was <a href=\"http://www.poemmuseum.org/\">happy to find</a> in my wife\
    \ a disposition not uncongenial with my own. Observing my partiality for domestic\
    \ pets, she left no opportunity of procuring those of most agreeable kind. We\
    \ had birds, gold fish, a fine dog, rabbits, a small monkey, and a cat.</p>\n\
    </div>\n</body>\n</html>\n```\n\nBecause there's no other containing block explicitly\
    \ defined, the block will be positioned to the root element of html. I placed\
    \ a screen shot that excluded any browser chrome in Photoshop so you can see how\
    \ the box is now positioned *absolutely* to its containing block (see Figure 12-5).\
    \ Figure 12-6 shows the same box in relation to other page elements.\n\n200 Positioning,\
    \ Floats, and Z-index > Absolute Positioning: To the Root Element"
  merge: -1
