  md: 'Figure 3-12 demonstrates how clicking on the link makes the pop-up window appear
    with the image intact.


    ![](img/516568206e0e220ce5a120446a34b48d_60_0.png)


    # Linking to a Script


    In terms of best practices, the more you can get out of your document and into
    external files in terms of scripting and style, the better. You can have many
    pages pointing to one script, and if you require changes to the script, you can
    make them to the one script file instead of to many documents with embedded scripts.


    To link to the script, first place the script code (without any HTML) into a separate
    file, and name the file with a .js extension, as in popup.js. You can place that
    file into a subdirectory named scripts (just as you did with images and media),
    and then use the script to link it to the document (see Example 3-10).


    EXAMPLE 3-10 Linking to the script


    ```

    <head>

    <script src="scripts/script.js" type="text/javascript"></script>

    </head>

    ```


    Leave the link code as is within the body of the document, and the results will
    be exactly the same as demonstrated in Figure 3-12.'
