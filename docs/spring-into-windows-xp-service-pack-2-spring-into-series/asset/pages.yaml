  md: '# Using CSS


    Cascading Style Sheets have been around since the end of 1996. Despite the relative
    longevity of the technology, its use in real-world web design has been limited
    to managing fonts and color, at until recently. This limitation was imposed by
    the lack of consistent browser support. Because not all browsers support equally
    (if at all), it has been very difficult for designers to tap into the true power
    of style sheets. Instead, there''s been a reliance on HTML for presentation.


    Now we have far better support for CSS, to tap into its many valuable features,
    web designers are moving away from HTML as a means of adding style and laying
    out pages, and into pure CSS design. Why is this so important? The reasons are:


    +   Keeping presentation separate from the document means you can style that document
    for numerous media, including the screen, print, projection, and even-held devices.


    +   Separating presentation from the document means a lighter document, which,
    in turn, means the page loads and renders faster, making for happier visitors.


    +   CSS offers ways to control one document or millions of documents. Any time
    you''d like to make a change, you change style in one location and automatically
    update all the documents with which CSS is connected. In HTML, this couldn''t
    be.


    +   CSS documents are cached. This means they are loaded into your browser''s
    memory once. As you move within a site, the browser never has to reinterpreter
    the styles. The results are more fluid movement from page to page and faster-loading
    pages, which, of course, is always desirable.


    +   By separating presentation from structure and content, accessibility is easily
    achieved. Documents that don''t have heavy tables and lots of presentational HTML
    are inherently more accessible than documents that do.


    Clearly, CSS offers a lot. In this chapter, you''ll learn how to set up CSS to
    be most efficient and flexible for your designs.'
  merge: -1
  pgno: 123
- img_proc: true
  md: '# CSS Theory Simplified


    Before you can actually put CSS to use, you need to know some important things
    about the language and how to use it effectively. I''ll try to make this quick
    and painless because I know you want to get down to it.


    # CSS Rules


    CSS rules are made up of a selector and at least one declaration. A selector is
    the code that selects the HTML to which you want to apply the style rule. We''ll
    be focusing on common selectors in this book, but you can use more than a dozen
    selector types as you become more proficient at CSS. A declaration is made up
    of at least one CSS property and related property value. CSS properties define
    the style:


    ```

    h1 {color: red;}

    ```


    The h1 is the selector for your h1 headers, and the declaration is made up of
    the color property with a value of red. Simply said, this turns all h1 elements
    red. You''ll note that the syntax of the style rule looks different from what''ve
    seen in HTML. The curly braces contain the declarations, each property is followed
    by a colon, and a semi-colon is used after each property. You can have as many
    properties as you want in a rule.


    # Applying CSS


    Six types of style sheet exists:


    +   - Browser style—This is the default style sheet within a browser. If you declare
    style rules, these defaults are applied.

    - User style—A user can write a style sheet and make it override any styles by
    changing a setting in the browser. These are used infrequently but can be helpful
    for individuals with special needs, such as low vision. In such a case, the user
    will create high-contrast, large-font styles that override your own.

    - Inline style—This is style that is right in the individual element and applied
    via the style attribute. It can be very useful for one-time styles by element,
    but it''s not considered.

    - Embedded style—This is style that controls one document and is placed inside
    the style element within the HTML document.

    - Linked style—This is a style sheet that is linked to an HTML document using
    the link element in the head of the document. Any document linked to this style
    sheet gets the styles, and here''s where the management power of CSS is found.'
  merge: -1
  pgno: 124
- img_proc: true
  md: '• Imported style—This is similar to linked styles, but it enables you to import
    styles into a linked style sheet as well as directly into a document. This is
    useful in workarounds and when managing many documents.


    You''ll see examples of these style sheets as we progress throughout the chapter.


    # The Cascade


    People often wonder where the term *cascading* comes from. The cascade is an *application
    hierarchy*, which is a fancy term for a system of how rules are applied. If you
    examine the five types of style sheets just introduced, you''ll notice that there
    are numerous means of applying style to the same document.


    What if I''ve got an inline style, an embedded style sheet, and a linked style
    sheet? The cascade determines how the rules are applied. In the case of style
    types, user style overrides all others; inline style trumps embedded, linked,
    and imported styles; embedded style takes precedence over inline style; and linked
    and imported styles are treated equally, applying wherever any other style types
    are not applied. Browser style comes into play if no style for a given element
    is provided; in that case, browser style is applied.


    The cascade also refers to the manner in which multiple style sheets are applied.
    If you have three linked style sheets, the *one on the bottom* is the one that
    is interpreted if any conflicts exist among those styles.


    # Inheritance


    Inheritance means that styles are inherited from their parent elements. Consider
    the following:


    ```

    <body>

    <h1>My header</h1>

    <p>Subsequent Text</p>

    </body>

    ```


    Both the h1 and p elements are considered children of the body element. The styles
    you give to the body will be inherited by the children until you make another
    rule that overrides the inherited style. Not all properties, such as margins and
    padding, are inherited in CSS but almost all others are.


    # Specificity


    Finally, if there are conflicts within any of your style sheets that aren''t resolved
    by the cascade, CSS has an algorithm that resolves the conflict. This algorithm
    is based on how specific a rule is. It''s a bit heavy for this discussion but
    worthy of mention.


    Obviously, two pages can''t really do justice to any of these topics, so you''re
    interested in learning more, be sure to look at the *Additional Resources* section.'
  merge: -1
  pgno: 125
- img_proc: true
  md: '# Adding Style Inline


    Okay, enough with the theory—let''s get down to work! Here you''ll learn to apply
    inline style. You''ll use inline style infrequently because it styles only the
    element to which it is applied. This defeats the management power of CSS.


    What''s more, inline style can be equated with presentational HTML because it
    goes right into the document instead of being separated from it, defeating the
    primary benefits of CSS. I use inline style for situations in which a quick fix
    for a single element is called for, or in rare cases when it''s the only style
    for one unique element in an entire site.


    Consider the following element:


    ```

    <h1>Welcome</h1>

    ```


    If this header were part of a complete HTML document and you viewed it in a browser,
    the results would be equivalent to Figure 7-1.


    ![](img/516568206e0e220ce5a120446a34b48d_126_0.png)


    **FIGURE 7-1** Default size of an h1 as defined by browser styles.


    Say you don''t like the default color and size. You can add CSS rules directly
    to the element using the style attribute:


    ```

    <h1 style="color: gray; font-size: 24px">Welcome!</h1>

    ```


    Now you''ve got a gray header sized at 24 pixels (see Figure 7-2).


    ![](img/516568206e0e220ce5a120446a34b48d_126_1.png)


    **FIGURE 7-2** Redefining color and size using inline style.'
