  md: '# Margin, Resize, and Scroll Controls


    You can control the behavior of your frame pages with a number of attributes.
    These include attributes to manage frames, frame resizing, and scrolling within
    frames:


    +   - The marginheight and marginwidth attributes allow a value in pixels to control
    the height and width of frame margins.

    - The noresize attribute fixes the frame into position so the user can''t move
    the frame edges.

    - The scrolling attribute enables you to control the appearance of a scrollbar
    within a frame. This is important if you''ve fixed the size of your frame and
    the content within that frame is longer than the frame size. There are three values
    for scrolling: yes (which forces a scrollbar at all times), no (which disallows
    a scrollbar completely), and auto (which automatically puts a scrollbar into the
    frame if it is necessary).


    Example 6-8 shows a frameset with margin, resize, and scroll controls.


    **EXAMPLE 6-8** Managing margins, resizing, and scrolling in frames


    ```

    <frameset cols="200", "*">

    <frame src="menu.html" marginheight="5" marginwidth="5" noresize="noresize"

    scrolling="yes" />

    <frame src="main.html" marginheight="9" marginwidth="9"

    oresize="noresize" scrolling="yes" />

    </frameset>

    ```


    Figure 6-6 shows the results.


    ![](img/516568206e0e220ce5a120446a34b48d_112_0.png)


    **FIGURE 6-6** Note forced scrollbars in each of the frames.'
  merge: -1
  pgno: 112
- img_proc: true
  md: '# # Naming and Targeting Frames


    Before you can ensure navigation within frames, you''ve got to first name the
    frames. Then target them using the target attribute. There''s also another target
    method you''ll explore, referred to as *magic target names*.


    Name targeting is done using the name attribute with a value that describes the
    frame. Typically, this value describes the function of that frame. So a navigation
    frame might be called nav, a content frame content content, and so forth.


    Example 6-9 describes a frameset document with all the frames properly named.


    **Example 6-9** Naming frames


    ```

    <!DOCTYPE html PUBLIC "//W3C//DTD XHTML 1.0 Frameset//EN"

    http://www.w3.org/TR/xhtml1/DTD/xhtml1-frameset.dtd">

    <html xmlns="http://www.w3.org/1999/xhtml">


    <head>

    <title>Frames with Names</title>

    </head>


    <frameset cols="200, *">

    <frame src="menu.html" marginheight="5" marginwidth="5" nosize="noresize" scrolling="auto"
    name="menu" />

    <frame src="main.html" marginheight="9" marginwidth="9" nosize="noresize" scrolling="auto"
    name="content" />

    </frameset>


    </html>

    ```


    The document sets up a frame page with a menu and a content area. Now that the
    specific frames are named, you can add targets to any links within the HTML so
    that the behavior works properly.


    If you want to click a link in the menu frame and have the corresponding link
    page load into the content frame, you use the target attribute with a value of
    the page''s name in the link (see Example 6-10).


    **Example 6-10** Targeting frames with the target attributes


    +   <ul>

    <li><a href="about.html" target="content">About the Company</a></li>

    <li><a href="clients.html" target="content">Company Clients</a></li>

    <li><a href="contact.html" target="content">Contact Company</a></li>

    </ul>'
  merge: -1
  pgno: 113
- img_proc: true
  md: 'Now any time you click a link, the about, clients, or contact documents will
    load into the named content frame.


    # Magic Target Names


    Magic target names are are four predefined names within HTML that cause a specific
    behavior when a link is activated:


    +   - target="_blank"—The _blank target name causes the targeted document to open
    in a completely new browser window.

    - target="_self"—The targeted document will load in the same window where the
    originating link exists.

    - target="_parent"—This loads the targeted document into the link''s frameset.

    - target="_top"—Use this attribute to load the link into the full window, overriding
    any existing frames.


    If you want to break out of your frames and have a full,less window, do not use
    the name you provided earlier in your target; use the magic target name, top:


    +   <li><a href="contact.html" target="_top">Contact Company/</a></li>


    This results in the contact.html page completely overriding the frameset document
    and all corresponding frames (see Figure 6-7).


    ![](img/516568206e0e220ce5a120446a34b48d_114_0.png)


    FIGURE 6-7 Using a magic target person''s site into frames, the contact page is
    now linked so that it completely overrides the frameset and loads into the original
    containing window.


    > NOTEnDo not try to force another person''s site into your frames. This is considered
    problematic and possibly illegal. Also, be careful when naming yourself, avoid
    mixed case, and definitely avoid any symbols, such as the underscore, which is
    already reserved for the magic target name. Finally, using the _blank magic target
    forces a new browser to open, which many people find troublesome.'
  merge: -1
  pgno: 114
- img_proc: true
  md: "# Frames Without Frontiers\n\nIf you'd like to have a frame-based site with\
    \ no borders, you can get rid of them. If you're following the rules, authoring\
    \ borderless frames is easy. You simply add the attribute and value frameborder=\"\
    0\" within the frame tag (see Example 6-11).\n\n**EXAMPLE 6-11** Working with\
    \ borderless frames\n\n```\n<!DOCTYPE html PUBLIC \"//W3C/DTD HTML 1.0 Frameset/EN\"\
    \n  \"http://www.w3.org/TR/html1/html1-frameset.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
    >\n<head>\n  <title>Borderless Frames</title>\n</head>\n<body>\n<frameset cols=\"\
    200,\"*\">\n  <frame frameborder=\"0\" src=\"menu.html\" name=\"menu\" marginheight=\"\
    5\"\n  marginwidth=\"5\" noresize=\"noresize\" scrolling=\"auto\" />\n  <frame\
    \ frameborder=\"0\" src=\"main.html\" marginheight=\"9\" marginwidth=\"9\"\n \
    \ noize=\"noresize\" name=\"content\" scrolling=\"auto\" />\n</frameset>\n</html>\n\
    ```\n\nYou can see the borders results in Figure 6-8.\n\n![](img/516568206e0e220ce5a120446a34b48d_115_0.png)\n\
    \n**FIGURE 6-8** Look ma, no borders!\n\nOf course, this works only in modern\
    \ browsers because originally Netscape and Internet Explorer introduced their\
    \ own, proprietary means of getting rid of frame borders."
  merge: -1
  pgno: 115
- img_proc: true
  md: 'Netscape browsers earlier than 6.0 allow borderless frames in these circumstances:


    +   - The border attribute is set, in pixels, to a numeric value of 0.

    - The framesacing attribute is assigned a no value.


    Older versions of Internet Explorer produce borderless frames under these conditions:


    +   - The frameborder attribute is set, in pixels, to a numeric value of 0.

    - The framesacing attribute is assigned a width, in pixels, to a numeric value
    of 0.


    Each browser requires either a different attribute to control width or a different
    value to control spacing. It looks confusing, but if you stack attributes, you
    can easily create borderless frames that will be read by both browsers without
    difficulty. This technique results in two options:


    ```

    <frames frameborder="0" framesacing="0" border="0">

    ```


    or


    ```

    <frames frameborder="no" framesacing="0" border="0">

    ```


    Example 6-12 shows how our example so far might look with the invalid syntax.


    # EXAMPLE 6-12 Supporting borderless frames in other browsers


    ```

    <!DOCTYPE html PUBLIC "//W3C//DTD HTML 1.0 Frameset//EN"

    "http://www.w3.org/TR/html1/DTD/html-frameset.dtd">

    <html xmlns="http://www.w3.org/1999/xhtml">

    <head>

    <title>Borderless Frames</title>

    </head>

    <frameset frameborder="0" framesacing="0" border="0" cols="200,\*">

    <frame src="menu.html" margin="5" marginheight="5" noize="noresize"

    scrolling="auto" />

    <frame src="main.html" marginheight="9" marginwidth="9" noresize="noresize"

    scrolling="auto" />

    </frameset>

    </html>

    ```


    > NOTE

    dn''t generally recommend breaking validation, but here''s a case in point: If
    you want backward compatibility with certain aspects of HTML, you have to some-times
    break the rules. Fortunately, older browsers are becoming less common, so support
    for them is becoming less necessary.'
  merge: -1
  pgno: 116
- img_proc: true
  md: "# Making Frames Accessible with noframes\n\nOne of the most important considerations\
    \ when designing frames is, as mentioned earlier, ensuring that individuals who\
    \ cannot use frames, such as the blind or mobility-impaired, still have access\
    \ to important information on a website. One of the ways to achieve accessibility\
    \ in a framed site is to employ the noframes element. This is placed in the frameset\
    \ element. Critical information can be provided at the same URL as the frameset\
    \ page, and an entirely accessible site can be formed by the same pages as the\
    \ framed site (see Example 6-13 and 6-9).\n\n**EXAMPLE 6-13** Making frames accessible\
    \ with noframes\n\n```\n<!DOCTYPE PUBLIC \"//W3C//DTD XHTML 1.0 Frameset//EN\"\
    \n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-frameset.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
    >\n\n<head>\n  <title>Frames with NOFRAMES Element</title>\n</head>\n\n<frameset\
    \ cols=\"200*\">\n  <frame src=\"menu.html\" marginheight=\"5\" margin=\"5\" noresize=\"\
    noresize\" scrolling=\"auto\" />\n  <frame src=\"main.html\" name=\"right\" marginheight=\"\
    9\" margin=\"9\" noresize=\"noresize\" scrolling=\"auto\" />\n\n<noframes>\n \
    \ <body>\n    <p>Welcome. We're happy to provide this no-frames access to our\
    \ Web site. If you prefer to view our site using frames, please upgrade your browser\
    \ to a recent one that fully supports frames.\nOtherwise, please visit our <a\
    \ href=\"index_noframes.html\">non-framed/</a> version of this site.</p>\n  </body>\n\
    </noframes>\n\n</frameset>\nn</html>\n```\n\nAre you ready for a kick?\n\nGood!"
  merge: -1
  pgno: 117
- img_proc: true
