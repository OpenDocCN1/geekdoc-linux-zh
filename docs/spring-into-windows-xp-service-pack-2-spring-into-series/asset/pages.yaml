  md: 'Property: list-style-position


    Description: Describes the positioning of the marker box for the list


    Media Type(s): Visual


    Example:


    ```

    #content ul {

    list-style-position: inside;

    }

    ```


    Tips: A value of inside starts the second line of text within a list item directly
    below the marker. A value of outside starts the second line of text within a list
    item outside the box, resulting in the conventional and familiar indents seen
    in most lists.


    Property: list-style-type


    Description: Sets the style of the list marker


    Media Type(s): Visual


    Example:


    ```

    #content ol {

    list-style-type: decimal-leading-zero;

    }

    ```


