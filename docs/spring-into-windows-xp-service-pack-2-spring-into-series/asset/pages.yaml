  md: '# Working with Frames


    Hese days, it''s a rare novelty to see someone using frames to create web pages.
    The reasons are numerous, including these fun facts:


    +   * Frames modify the browser interface, which results in inconsistency in how
    operating systems and individual browsers display the results.

    * Frames are difficult for both blind and mobility-impaired users. Screen reader
    software has a hard time managing the altered interface. Mobility-impaired users
    also encounter difficulty moving from frame to frame.

    * In older browsers, frame pages were difficult to bookmark. Bookmarking is improved
    in most modern browsers, but the user has to know where to dig up this feature
    within the browser interface.

    * Frames consume more server and client resources, for two reasons: First, Frames-based
    designs rely on multiple documents to build just one page, so a server has to
    send each of these documents when each frame page is assembled. Second, browsers
    and the user''s operating system have to work harder to manage them.

    * Because multiple documents must be created for each single-frame page result,
    managing frames is an arduous, unhappy task when you''re trying to manage, update,
    and modify a frame-based site.


    If frames aren''t all that and all, why on Earth would you want to learn them?
    I have two very specific reasons I want to know about them:


    +   1. Frames are a unique part of HTML. I want you to understand what you''re
    looking at if you see frames and also to have them in your toolbox if you need
    them.

    2. Frames can occasionally be the exactly right choice for a specific approach.
    Let''s say you want to develop an application in which data loads into another
    location directly within the same interface. Frames can help you accomplish that
    kind of functionality; if you need it, you''ll know how.


    Finally, although iframes are not the same as conventional frames, they are in
    use. You might well want to tap into their unique functionality at some point.'
  merge: -1
  pgno: 105
- img_proc: true
  md: '# The Power of Three


    I often remember the way to build a frame-based page by thinking in threes. To
    create a single-frame page, you need three documents, at the minimum. What''s
    more, you use three unique bits of HTML that are used anywhere else in the language.


    Frames are controlled by a master document known as a frameset. The frameset document
    is not displayed in the browser in and of itself, it sets up all the controls
    for the resulting page.


    Along with the frameset, you need at least two HTML documents of content. These
    are displayed in the framed areas created by the frameset (see Figure 6-1).


    ![](img/516568206e0e220ce5a120446a34b48d_106_0.png)


    **FIGURE 6-1** A framed page example.


    Of course, within your frameset, you can create as many frames as you desire.
    For each of those frames, however, you need to have a corresponding HTML content
    page.


    As you can see, the number of documents required for a complex framed site can
    begin to add up—which as mentioned, causes extra demand on your server resources
    and your user''s system resources, not to mention all the extra management issues
    that documents demand.'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# Creating a Frameset


    First, I want you to focus on learning how to write frameset documents. They are
    definitely different from the HTML pages you''ve been exposed to in this book
    so far. For starters, you use a different DOCTYPE declaration (see Example 6-1).
    This is the first piece of unique markup for a frameset-based page.


    **EXAMPLE 6-1** The DOCTYPE declaration for XHTML 1.0


    ```

    <doctype html PUBLIC "//W3C//DTD XHTML 1.0 Frameset//EN"

    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-frameset.dtd">

    ```


    Now things start to get really interesting! Instead of the conventional HTML structure
    you''re now familiar with, you won''t be adding a head and a body; instead, you
    add a head and a frameset.


    You''ll be able to use the head portion the same way you would in any other document—for
    title, script, or style—but you won''t have a body element because the frameset
    element takes its place for all framed documents. The frameset element (and its
    corresponding attributes, which we''ll get to in just a bit) is the second piece
    of unique markup for a frame-based page (see Example 6-2).


    **EXAMPLE 6-2** Frameset document structure


    ```

    <doctype html PUBLIC "//W3C//DTD XHTML 1.0 Frameset//EN"

    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-frameset.dtd">


    <html xmlns="http://www.w3.org/1999/xhtml">

    <head>

    <title>Frameset Document</title>

    </head>

    <frameset>


    <frame />

    <frame />

    </frameset>

    </html>

    ```


    The unique element is the frame element, which defines which HTML pages will be
    placed into the corresponding frames you''re creating for your page (see Example
    6-3). The number of frame elements corresponds directly to the number of frames
    in the page.


    **EXAMPLE 6-3** Frameset with the minimum required two frame elements


    ```

    <frameset>

    <frame />

    <frame />

    </frameset>

    ```


    Working with Frames > Creating a Frameset 91'
  merge: -1
  pgno: 107
- img_proc: true
  md: "# # Adding Columns\n\nFramesets support columns and rows. In this section,\
    \ you'll add columns to your frame-set. You begin by setting up the two-column\
    \ frame page.\n\nThe cols attribute for the frameset element gives you three value\
    \ options:\n\n+   - Numeric value in pixels, such as cols=\"200\". This results\
    \ in a 200-pixel column.\n- Percentage value, such as cols=\"75%\". A percentage\
    \ value results in the column being 75% of the available browser space.\n- Dynamic\
    \ value, represented by an asterisk, as in cols=\"*\". This means the column will\
    \ dynamically resize to the available browser space.\n\nExample 6-4 shows a frameset\
    \ document used to create the two-column look we're after.\n\nYou'll note that\
    \ I've also added frame-elements.\n\nTo create a frame page, you need to have\
    \ each column (or row, as you'll see in the next section) filled with a corresponding\
    \ conventional HTML page. For these examples, I've created two very simple pages\
    \ just for demonstration purposes, available for your use. You would, of course,\
    \ add real content to these pages.\n\n**EXAMPLE 6-4** Creating a two-column frame\
    \ page\n\n```\n<DOCTYPE html PUBLIC \"//W3C//DTD HTML 1.0 Frameset//EN\"\n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-frameset.dtd>\n\
    \n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n  <title>Frameset Document</title>\n\
    </head>\n\n  <frameset cols=\"200, *\">\n    <frame src=\"lightgray.html\" />\n\
    \    <frame src=\"darkgray.html\" />\n  </frameset>\n</html>\n```"
