  md: '# Adding a Caption


    You can caption your table using the caption element.

    <caption> . . </caption>


    Place your caption content between the opening and closing tag of the caption
    element.

    The caption goes directly beneath the opening table tag and is displayed by most
    browsers centered above the table (see Example 4-7).


    EXAMPLE 4-7 Adding a caption to the table


    ```

    <table width="90%" border="1" cellspacing="5" cellpadding="5">

    <caption>Comparing weather and time zones</caption>

    <tr>

    <th>Location</th>

    <th>Tucson, Arizona</th>

    <th>Las Vegas, Nevada</th>

    </tr>

    <tr>

    <th>Weather</th>

    <td>Warm to Hot</td>

    <td>Warm to Hot</td>

    </tr>

    <tr>

    <th>Time Zone</th>

    <td>No Daylight Savings</td>

    <td>Mountain Standard Time</td>

    </tr>


    </table>

    ```


    Figure 4-9 shows the results.


    ![](img/516568206e0e220ce5a120446a34b48d_72_0.png)


    FIGURE 4-9 Adding a caption.'
  merge: -1
  pgno: 72
- img_proc: true
  md: '# Table Summaries


    You can summarize the content of your table using the summary attribute within
    the table element:


    ```

    <table summary="text description">

    ```


    If you''re thinking ''Hey, I bet this has something to do with accessibility,''
    you''re spot-on. Providing summaries does, in fact, assist people with disabilities
    who require more contextual information about the table.


    Summaries won''t appear onscreen, unlike alternative text or the title attribute
    used in links, which include the information as a ToolTip the mouse passes over
    the table. In the case of summaries, they are read only by the assistive device,
    such as a screen reader for a blind user.


    Example 4-8 shows the table so far, with summary added.


    # EXAMPLE 4-8 Adding a table summary


    <table width="90%" border="1" cellspacing="5" cellpadding="5" summary="This table
    displays locations and their associated weather and time zone information">

    <caption>Comparing weather and time zones</caption>

    <tr>

    <th>Location</th></th>

    <th>Tucson, Arizona</th></th>

    <th>Las Vegas, Nevada</th></th>

    </tr>

    <tr>

    <th>Weather</th></th>

    <td>Warm to Hot</td>

    <td>Warm to Hot</td>

    </tr>

    <tr>

    <th>Time Zone</th></th>

    <td>No Daylight Savings</td>

    <td>Mountain Standard Time</td>

    </tr>

    </table></table>


    # QUANTUM LEAP


    Using captions and summaries goes a long way to helping data tables more accessible
    for those with disabilities—and more understandable for everyone. To dig deeper
    into accessibility techniques for tables, see Creating Accessible Tables found
    at WebAIM (http://www.weabaim.org/techniques/tables/), which is an excellent source
    for accessibility information in general.'
  merge: -1
  pgno: 73
- img_proc: true
  md: "# Spanning Rows\n\nAs you're setting up your data table, you might find that\
    \ you need to have a single column span number of rows within the table. To do\
    \ this, you'll use the rowspan attribute with the value of rows you want to span\
    \ to the table header or table cell in question (see Example 4-9).\n\nEXAMPLE\
    \ 4-9 Using rowspan to span two rows\n\n```\n<table width=\"90%\" border=\"1\"\
    \ cellspacing=\"5\" cellpadding=\"5\" summary=\"This table demonstrates rowspan\"\
    >\n  <caption>Demonstrating rowspan</caption>\n  <tr>\n    <th rowspan=\"2\">Header\
    \ (spans 2 rows)</th>\n    <td>data</td>\n    <td>data</td>\n  </tr>\n  <tr>\n\
    \    <td>data</td>\n    <td>data</td>\n  </tr>\n  <tr>\n    <th>Header (no span)</th>\n\
    \    <td>data</td>\n    <td>data</td>\n  </tr>\n</table>\n```\n\nFigure 4-10 shows\
    \ the spanned header rows.\n\n![](img/516568206e0e220ce5a120446a34b48d_74_0.png)\n\
    \nFIGURE 4-10 Spanning rows within table headers."
  merge: -1
  pgno: 74
- img_proc: true
  md: "You can also span rows within table cells. If you wanted to make the second\
    \ column span all three rows, you could do so by using the rowspan attribute in\
    \ the appropriate table cell data (see Example 4-10).\n\n# **EXAMPLE 4-10** Spanning\
    \ three rows in a table cell\n\n```\n<table width=\"90%\" border=\"1\" cellspacing=\"\
    5\" summary=\"This table\ndemonstrates rowspan\">\n  <caption>Demonstrating rowspan</</caption>\n\
    \  <tr>\n    <th rowspan=\"2\">Header (spans 2 rows)</th>\n    <td rowspan=\"\
    3\">data (spans 3 rows)</td>\n  </tr>\n  <tr>\n    <td>data</td>\n  </tr>\n  <tr>\n\
    \    <th>Header (no span)</th>\n    <td>data</td>\n  </tr>\n</table>\n```\n\n\
    You'll notice that I've removed any unnecessary table cells (see Figure 4-11).\n\
    \n![](img/516568206e0e220ce5a120446a34b48d_75_0.png)\n\nBeware Overlapping Cells\n\
    If you don't remove the cells that are overlapped by a span, you'll end up with\
    \ a big mess! So you've got to just a bit of simple math and subtract the appropriate\
    \ number of cells in relation to your table and row spanning. You know you've\
    \ done your work properly when there's no additional whitespace or seemingly empty\
    \ spaces within the table. If you do see any odd spaces, go back and rethink the\
    \ table's structure—you'll quickly find your overlap and correct the overlap problems."
  merge: -1
