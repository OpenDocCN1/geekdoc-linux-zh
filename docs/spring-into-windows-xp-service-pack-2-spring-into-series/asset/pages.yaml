    University of Arizona, University of Phoenix, New School University, and Pima
    Community College. Many recognize Molly from her books, feature articles, and
    popular website, molly.com.


    # About the Series Editor


    Barry Rosenberg wrote the cult classic, KornShell Programming Tutorial (Addison-Wesley,
