  md: '# Adding the html Element


    After the DOCTYPE declaration, you''ll want to begin building your document from
    its root element. I use the term root purposely because all documents create a
    document tree, something that we''ll be exploring at length. Understanding the
    tree created by HTML documents plays an important role in being able to effectively
    style those documents using CSS.


    The html element is considered the root element of any HTML document. Remember,
    the declaration isn''t an HTML element—it is SGML. So the first element to appear
    takes on the important root status.


    Example 1-2 shows the html element, with its opening tag and closing tag.


    EXAMPLE 1-2 The root HTML element


    ```

    <html>

    </html>

    ```


    Pretty basic, right? Well, in XHTML, we have to add one other important piece
    to the opening tag, and with that the XML namespace for XHTML. This is just another
    way of identifying the language being used within the document. I won''t go into
    the ideological reasons we do this, but it suffices to say that it must be there
    to validate (see Example 1-3).


    EXAMPLE 1-3 The root element with the XML namespace attribute and value


    ```

    <html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">

    </html>

    ```


    You can see the xmlns attribute, which stands for "XML namespace" and the value
    is a URL, if you follow it, leads nowhere exciting, I promise! You''ll get a page
    saying you''ve reached the XML namespace for XHTML. Again, this is just another
    identifier.


    > NOTE

    You''ll notice a few bits of syntax, including the xml:lang attribute, which defines
    the language of the document using XML syntax (remember, XHTML is a combo of HTML
    and XML), in this case for English, and the lang attribute from HTML, declaring
    the same information. These are optional attributes, but we use them both, for
    full compatibility.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# The head and title Elements


    Now you''ve got the very basic beginnings of a document, with the DOCTYPE declaration
    in place and the root element at the ready. You''ll now begin adding other important
    pieces of the document, beginning with the head element. This is where all necessary
    for the document''s display and performance are placed—but not literally seen
    within the browser window. To create the head, you simply add the head tags within
    the upper portion of your template, right below the opening <html> tag (see Example
    1-4).


    EXAMPLE 1-4 Building the template: Adding a head


    ```

    <DOCTYPE html PUBLIC "//W3C//DTD XHTML 1.0 Transitional//EN"

    "http://www.w3.org/TR/xhtml1/xhtml1-transitional.dtd">


    <html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">

    <head>


    </head>

    </html>

    ```


    Notice that the head element requires no attributes but simply has the opening
    and closing tags. This identifies the head region. Table 1-1 shows some of the
    various elements that you can place within the head of your document.


    Table 1-1 Elements in the Head Portion of the Document


    | Element | What It Does |

    | --- | --- |

    | title | This element enables you to title your document. This title will then
    appear in the title bar of your browser. The title element is required. |

    | meta | The meta element is used for numerous concerns, including keywords and
    descriptions, character encoding, and document authorship. The meta element is
    not required, and your use of it will vary according to your specific needs. |

    | script | This element enables you to insert scripts directly into your document,
    or as the preference, link from the page to the script you''d like to use. It
    is used as needed. |

    | style | The style element enables you to place style information into the individual
    page. This is known as *embedded* style, which you''ll read more about in Chapter
    7, "CSS". It is used as needed. |

    | link | The link element is most commonly used to link to an external stylesheet,
    although it can be used for other purposes, such as linking to a favicon, or to
    link to an alternative page for accessibility, or to link to a vanish you see
    in the address bar of certain websites. |


    Building an HTML Page > The head and title Elements 5'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# The title Element in Detail


    The title element is the only required element within the head element. This element
    displays any text it within the browser bar (see Figure 1-2) along with the browser''s
    name at the end of the text.


    ![](img/516568206e0e220ce5a120446a34b48d_22_0.png)


    FIGURE 1-2 The title element text will appear in the browser''s title bar.


    Aside from the fact that you have to have the title element in place, writing
    good titles is a first-line technique that accomplishes three things:


    +   * Provides a title for the page,

    * Offers orientation—that is, it helps them know where they are on the Web and
    within the site itself

    * Provides additional information about the site page


    Writing effective titles means addressing these three concerns. A good title example
    appears in Example 1-5.


    EXAMPLE 1-5 Title element with name and location for user orientation


    ```

    <title>molly.com — books — HTML &amp; CSS</title>

    ```


    Note that the page is titled using the name, the section, and the subsection,
    providing useful information for the visitor.


    An ineffective example can be seen in Example 1-6.


    EXAMPLE 1-6 Title element with name and location for user orientation


    ```

    <title>Read my books!</title>

    ```


    Here, there''s no information that helps us. So while the technical requirement
    of having a title is fulfilled, the practical needs are not.


    > NOTE

    Although you cannot use HTML inside a title, you can use character entities, as
    you can see in Example 1-5, where I used the entity &amp; to create the & symbol.
    For more information on available character entities, see Appendix A, "XHTML Reference."


    6 Building an HTML Page > The head and title Elements'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# The meta Element


    Although it is not required in a document, the meta element performs so many different
    functions that it''s a good idea to become familiar with it right away.


    # Document Encoding


    Document encoding means setting the character set for your page, which is particularly
    important when writing documents in other languages. For many years, those of
    us writing in Latin characters (including English) used the ISO 8859-1 character
    set. The ISO sets and subsets cover a wide range of languages. But nowadays we
    use UTF-8, a more universal format following a different standard than ISO values.
    UTF-8 can be helpful in a variety of browsers, but there are some limitations.
    If you are publishing in another language, such as Russian or Japanese, you''ll
    want to have your document encoding set under ISO rather than Unicode character
    sets.


    > NOTE

    Ideally, character encoding is set on the server and not in a meta element. However,
    you can set it using a meta element. See http://www.webstandards.org/w3c/ask3c/dec2002.html.


    Example 1-7 shows a meta element that defines the UTF-8 format, suitable for documents
    in English as well as other languages, depending in upon your browser support.


    **EXAMPLE 1-7** Using meta to declare document encoding with Unicode


    ```

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    ```


    Example 1-8 shows a meta element for a document written in Russian, using the
    ISO method.


    **EXAMPLE 1-8** Using meta to declare document encoding for Cyrillic, using ISO


    ```

    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-5" />

    ```


    # Keywords, Description, and Authorship


    The meta element can be used to describe keywords, describe the site, and define
    the author, too. This is extremely helpful for public search engines as well as
    for search engine you might be running on your own site.'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'Keywords are single words and word combinations that would be used during a
    search. This assists searching for specific topics to find the information you''re
    providing (see Example 1-9).


    # EXAMPLE 1-9 Using meta for keywords and keyword combinations


    ```

    <meta name="keywords" content="molly, molly.com, html, xml, css, design, web design,
    development, web development, perl, color, web color, blog, web log, weblog, books,
    computer books, articles, tutorials, learn, author, instructor, instruction, requesting,
    training, education, consult, consultant, famous people page, famous people list,
    standards, web standards project, wsp, wasp, digital web, digital magazine, web
    techniques, techniques magazine, web review, webreview.com, wow, world organization
    of webmasters, conference, conferences, user interface, usability, accessibility,
    internationalization, web culture" />

    ```


    You''ll notice that although I use the word a great deal, it''s in combination
    with other keywords. Most search engines will lock out if you use multiple keywords.
    Use this to be a way of getting higher ranking, but no longer. Use keywords that
    make sense, or if you want to have multiple instances of a word, or in a realistic
    combination.


    Descriptions are typically 25 words or less describe the purpose of your document
    (see Example 1-10).


    # EXAMPLE 1-10 The meta element used for site or page description


    ```

    <meta name="description" content="I''m Molly E. Holzschlag, and this Web shares
    my Web development work and personal thoughts." />

    ```


    Short and to the point! Another use is to define the author of the document, as
    shown in Example 1-11.


    # EXAMPLE 1-11 Using meta to describe page authorship


    ```

    <meta name="Author" content="Molly E. Holzschlag" />

    ```


    Of course, this information is never displayed on your web page itself. Instead,
    as all elements and attributes within the head portion of a document, this information
    is used by the browser and other resources as search engines.


    NOTE

    Other uses for the meta element to refresh documents automatically and restrict
    search engines from logging specific pages. Learn more at http://www.learnthat.com/courses/computer/metatags/meta.html.'
  merge: -1
