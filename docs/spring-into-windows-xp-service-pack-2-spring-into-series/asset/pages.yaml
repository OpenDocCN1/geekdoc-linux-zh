  md: "Tips: Good support exists in all contemporary browsers. This selector is helpful\
    \ in creating non--image-based drop caps.\n\nSelector: :firstline pseudo element\n\
    \nDescription: Used to select the first line of an element only\n\nExample:\n\n\
    ```\n#content p:firstline {\n  color: red;\n}\n```\n\nTips: Good support exists\
    \ in all contemporary browsers. This selector applies the style to the first line.\
    \ If the line length changes by browser resize, the style is still applied to\
    \ whatever the first line is.\n\nSelector: :focus dynamic pseudo class\n\nDescription:\
    \ Applies the style when an element has focus (is accepting keyboard input, such\
    \ as in a form)\n\nExample:\n\n```\ninput:focus {\n  border: 1px solid red;\n\
    }\n```\n\nTips: This selector is unavailable for use in Internet Explorer and,\
    \ therefore, is used primarily for enhancing styles in browsers that do support\
    \ it.\n\nSelector: :hover dynamic pseudo class\n\nDescription: Applies the style\
    \ when an element is hovered over with the mouse or pointing device\n\nExample:\n\
    \n```\n#toggle:hover {\n  border: 1px solid green;\n}\n```\n\nTips: This selector\
    \ is unavailable for use in Internet Explorer except as applied to the element.\
    \ Therefore, it is used primarily for enhancing styles in browsers that do support\
    \ it."
