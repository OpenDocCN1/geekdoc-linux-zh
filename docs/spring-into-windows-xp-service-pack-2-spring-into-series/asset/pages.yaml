  md: '# Intrapage Linking


    Intrapage linking enables you to have a link in a document that will automatically
    go to another location within the same document. This is achieved by creating
    a link to the location using an octothorpe (#) followed by a relevant name, and
    defining the location using an anchor element and the name attribute with that
    name.


    You can use as many links in a document as is reasonable to achieve your goals.
    This technique is most helpful for navigating very long documents (see Example
    2-15).


    # EXAMPLE 2-15 Setting up intrapage links


    ```

    <a href="#news">Go to the News</a>

    <h1>Welcome</h1>

    <p>This paragraph welcomes you.</p>

    <h2>About</h2>

    <p>This paragraph talks about us.</p>

    <h2 name="news">News</h2>

    <p>This is the section your link will go to.</p>

    ```


    Figures 2-13 and 2-14 demonstrate how this works.


    ![](img/516568206e0e220ce5a120446a34b48d_42_0.png)


    FIGURE 2-13 Clicking the intrapage link.


    ![](img/516568206e0e220ce5a120446a34b48d_42_1.png)


    FIGURE 2-14 The browser moves the document to the named location.'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'Using the same technique as intrapage linking, you can link from one document
    to a specific place in another document. This technique is useful when you''re
    referencing a specific notation within text that might be on another page. To
    achieve this, you simply use an absolute URL for the octothor followed by the
    named location in the first document (see Example 2-16).


    # **EXAMPLE 2-16** Links to jump to a specific place in another document


    ```

    <p><a href="http://www.molly.com/headers.html#h2">Follow this link to read about

    h2 level headers</a></p>

    ```


    You name the section in the document to which you are referring appropriately
    (see Example 2-17).


    # **EXAMPLE 2-17** The desired location


    ```

    <h1><a name="h2">All about h2 level headers</a></h1>

    ```


    The first document then contains a link to the specific location within the other
    document.


    **Beware Name and ID**

    In XHTML 1.1, the name attribute has been completely replaced with the id attribute.
    As a result, if you''re using XHTML 1.1, you''ll need to replace all instances
    of name with id in the anchor element.


    Some browsers do not recognize this, so use XHTML 1.0 or HTML documents for any
    pages of this nature to avoid problems.'
