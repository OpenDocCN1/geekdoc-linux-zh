    ```\n\nTips: This selector is unavailable for use in Internet Explorer and, therefore,\
    \ is used primarily for enhancing styles in browsers that do support it.\n\n#\
    \ Selector: :firstletter pseudo element\n\nDescription: Used to select the first\
    \ letter of an element only\n\nExample:\n\n```\n#content p:firstletter {\n  font-size:\
    \ larger;\n}\n```"
  merge: -1
