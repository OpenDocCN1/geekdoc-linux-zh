  md: '# # Styling Borders


    In the past chapters, you''ve seen me use borders to help you visualize CSS concepts.
    Here, I''ll go into a bit more detail with you.


    You can style borders based on their side, width, width, style, and color. Each
    of these uses a different border property: border-width, border-style, and border-color.
    You place the side of the border in the two portions of the border property: border-left-color,
    border-right-style, and border-top-width. See the “Border Shorthand” section of
    this chapter for a more streamlined approach to border properties.


    # ## Border Width


    Border widths can be specified using length values such as pixels or ems or keywords,
    which include thin, medium, and thick:


    ```

    border-bottom-width: 2px;

    ```


    ```

    border-left-width: thick;

    ```


    # ## Border Style


    Here''s where things get really fun. Currently eight style values will create
    a unique border, and two additional values are used for the border-style property
    (see Table 11-1).


    **TABLE 11-1** Border styles in CSS

    | Style | Effect |

    |--- | --- |

    | dotted | A series of dots |

    | dashed | A series of dashes |

    | solid | A solid line |

    | double | Two solid lines |

    | groove | A groove set into the canvas |

    | ridge | A ridge coming out of the canvas |

    | inset | An embedded appearance |

    | outset | A raised appearance |

    | hidden | Hidden border, which you can hide using scripting |

    | none | No border is ever visible |


    Here''s a look at a border style property and value in action:


    ```

    border-right-style: dotted

    ```'
