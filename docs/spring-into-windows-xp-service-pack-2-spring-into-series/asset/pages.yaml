  md: '# Wrapping It Up


    Being able to properly format text and manage content goes a long way toward helping
    you create a web page that makes sense not only to you and other people who might
    update your documents, but to those good folks who visit your site as well.


    Advantages to well-formatted content include:


    +   - Site visitors will have a clear understanding of your site''s intent.

    - You can help guide your visitors through the site in a way that makes sense.

    - You will keep your content well organized.

    - Your links will be carefully thought out and, therefore, will be more useful
    to your audience.

    - You can persuade your visitors through your text content and links to visit
    other areas of your site, especially where you want most them.


    Essentially, the way you manage text and linking will ensure not only that your
    content is king, but that your site visitors feel like royalty while visiting,
    too.


    # Text Isn''t Everything


    Of course, text isn''t the only way in which we can persuade, entertain, and inform
    our guests. Adding images, media, and interactive options can go a very long way
    to making the experience of your web site a rich one.


    So, next up, I''ll be showing you how to add images, media, and scripts to your
    documents. If it seems a little early in the game to be jumping into what might
    feel like a complex topic, worry not! The idea is to get you putting your knowledge
    to work away, in satisfying and fun ways that will keep you interested in learning
    more, too.'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# Adding Images, Media, and Scripts


    Images, media, and scripting help a site become "dynamic and rich." This is called
    dynamic because many of these features offer the opportunity for the site visitor
    to interact in an active way with the site. It feels rich because the site brings
    richer visually and in terms of content. Images in this chapter refers specifically
    to images you''ll adding to your page as part of the design itself or as a means
    of enhancing the content, such as with photos. Images must be processed in a specific
    way for the Web, using a good image editor; you can quickly learn the details.


    NOTE

    Web graphics can be created by a wide range of programs, but typically you''re
    going to want have a decent image editor, such as Photoshop (if your wallet is
    a little smaller, you can try Jas''s Paint Shop Pro). There are numerous other
    web graphic programs; you can find them searching for "web graphics software"
    at your favorite search engine.


    Two primary types of web graphic formats exist: GIF and JPEG. The GIF file format
    is best for images with few, flat colors and line drawings; JPEGs are best for
    images with many colors and color gradients, such as photos. A third type of web
    graphic format is PNG, but the lack of support for PNG in some browsers makes
    it a less stable choice.


    Multimedia on the Web can refer to a number of things, including animated GIFs,
    Flash animations, audio, video, and Java apps. Scripts in this chapter refer to
    JavaScript and HTML effects that you can add to your documents, creating a richer
    user experience.


    NOTE

    Although images, media, and scripting can bring more options to your site, you
    also can add unnecessary clutter and download time. I like to think of most content
    of this nature to be decorative. Just as you wouldn''t want to overdecorate a
    house, think about how less can be more when it comes to your page.'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# The img Element


    When working with images, the element you''ll be using is img. This is an empty
    element—in other words, it does not contain any text content. As a result, it
    doesn''t require a closing tag. It is written in XHTML as:


    ```

    <img />

    ```


    Placed by itself within the body of your document, this will do nothing at all.
    So along with the img element, you''ll need to point to location of the image.
    This is done using the src attribute, which stands for “source".


    In the value of the source attribute, you''ll add the location and the name of
    the actual graphic file, along with its extension. Example 3-1 shows a complete
    document with the image included.


    **EXAMPLE 3-1** Adding the image to the document


    ```

    <!DOCTYPE html PUBLIC "//W3C/DTD XHTML 1.0 Transitional//EN"

    "http://www.w3.org/TR/xhtml11/DTD/xhtml11-transitional.dtd">


    <html xmlns="http://www.w3.org/1999/xhtml" lang="en">


    <head>


    <title>Chapter 3</title>

    </head>


    <body>


    <img src="images/photo.jpg" />


    </body>

    </html>

    ```


    > **NOTE**

    You''ll notice that I''ve used a subdirector called images in which to store my
    web graphics. It''s conventional to place images in a subdirector beneath the
    documents that use them, or if you have a fairly small site, in one image location
    off the root directory.'
  merge: -1
