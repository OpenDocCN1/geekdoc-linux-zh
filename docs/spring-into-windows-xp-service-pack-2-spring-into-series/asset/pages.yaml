  md: '# Reset and Submit Buttons


    The controls for reset and submit functions are built right into HTML, so you
    don''t have to do much to get these working and even customized to a certain degree
    without touching images or style.


    The reset button clears the form when it is clicked. The submit button submits
    the data in the form, which uses the information in the method and action attributes
    in the form element to send the data to the server for processing.


    Example 5-11 shows how to create reset and submit buttons


    **EXAMPLE 5-11** Creating reset and submit buttons


    ```

    <form method="get" action="http://www.myserver.com/cgi-bin/mailscript/">


    <input type="reset" value="reset" />

    <input type="submit" value="submit" />


    </form>

    ```


    Figure 5-12 shows how the value attribute determines the information that appears
    in the buttons.


    ![](img/516568206e0e220ce5a120446a34b48d_96_0.png)


    **FIGURE 5-12** Reset and submit buttons are created automatically.


    Because you can alter the values for the form buttons, you can customize them
    a bit in terms of what you''d like them to say (see Figure 5-13).


    ![](img/516568206e0e220ce5a120446a34b48d_96_1.png)


    **FIGURE 5-13** Customizing reset and submit buttons.'
  merge: -1
  pgno: 96
- img_proc: true
  md: '# Using a Graphic Submit Button


    If you''d like your submit button to look more integrated with your visual design,
    you can create an image and use it for the submit process instead. The caveat
    here is that this technique does not equally apply for the reset button unless
    you add JavaScript. In terms of HTML itself, you can use a custom button for submit
    if you so desire.


    For Example 5-12, I created a graphic submit button for my form and inserted it
    into the form using the input element with additional attributes for the image.


    **EXAMPLE 5-12** Using a graphic submit button


    ```

    <form method="get" action="http://www.myserver.com/cgi-bin/mailscript/">\n  <input
    type="image" src="submit-button.gif" width="75" height="25" alt="submit" />

    </form>

    ```


    You''ll notice that the markup includes a value for the type attribute, image.
    Then you provide the image source for the button, its width and height, its value,
    and alternative text. Remember, it''s an image, so you will be sure to vary that
    whatever alternative text is in there.


    Figure 5-14 shows the stylized graphic button as the mouse passes over it. You''ll
    notice that the mouse pointer turns to a hand, just as it would for any other
    link, and the alternative text is displayed, too.


    ![](img/516568206e0e220ce5a120446a34b48d_97_0.png)


    **FIGURE 5-14** Implementing a graphic submit button.


    > QUANTUM LEAP

    In most contemporary web designs, images are used for submit buttons in tandem
    with CSS. You''ve certainly noticed that although the form controls described
    in the chapter so far are effective and straightforward in terms of implementation,
    they aren''t exactly pretty. That will be repaired as soon as you begin styling
    form elements later in this book.'
  merge: -1
  pgno: 97
- img_proc: true
  md: '# Making Forms More Accessible with label


    By their variant native, forms are a bit more demanding in the accessibility department
    than other HTML elements. This is largely because all the items we''ve been discussing
    in this chapter have to do with form controls, which are components built into
    browsers and invoked by the corresponding HTML.


    For a visual person, this makes sense. But for individuals who are having the
    form read to instead of seeing it, context can be quickly lost.


    The label element allows information to be attached to a given control. Using
    this along with the attribute enables you to describe the form control used in
    more detail (see Example 5-13).


    EXAMPLE 5-13 Adding context using the label element


    ```

    <form method="get" action="http://www.myserver.com/cgi-bin/mailscript/">

    <label for="firstname">First Name:</label><input type="text" name="firstname"
    id="fname" /><br>

    <label for="reading"><input type="checkbox" name="reading" id="reading" /></br>

    <label for="textbox">Any special requests?</label> <br>

    <textarea name="comments" id="textbox" cols="25" rows="5"></textarea>

    </form>

    ```


    You''ll recall earlier that I mentioned the use of the id attribute within the
    input was an important part of accessibility, and here you see why.


    > NOTE

    You''ll notice that the label always comes before the control it''s describing.
    In every case which you are labeling a form control, the value of the for attribute
    must match the exact value of the id attribute within the control itself. This
    enables screen readers to provide more descriptive information about the control.


    Another important issue is that labels do not need to be applied to submit and
    reset buttons. This is because screen readers read the text you''ve supplied on
    the buttons, automatically providing the required context.'
  merge: -1
  pgno: 98
- img_proc: true
  md: "# Grouping Form Fields\n\nAnother means of making your forms more accessible\
    \ is to group form information.\nYou'll recall that in Chapter 4, “Creating Tables,”\
    \ I showed you several ways to group table elements to make them more comprehensive.\
    \ Well, the same concepts apply here, although different elements are used.\n\n\
    In the case of forms, you can break down areas of the form into specific sets\
    \ of fields using the fieldset element. If you have a form with three contextual\
    \ sections, such as Contact Information, Favorite Activities, and Reset or Submit,\
    \ you can create fields around each of them. When you then use the legend element\
    \ to add a header for each of those sections, providing further context (see Example\
    \ 5-14).\n\n**EXAMPLE 5-14** Breaking forms into logical fields using fieldset\n\
    \n```\n<form method=\"get\" action=\"http://www.myserver.com/cgi-bin/mailscript\"\
    >\n<fieldset>\n  <legend>Contact Information</legend>\n  First Name: <input type=\"\
    text\" name=\"firstname\" id=\"firstname\" size=\"25\"\n  maxlength=\"40\" <br>\n\
    \  Last Name: <input type=\"text\" name=\"lastname\" id=\"lastname\" size=\"25\"\
    \n  maxlength=\"40\" <br>\n  Phone: <input type=\"text\" name=\"phone\" id=\"\
    phone\" size=\"15\" maxlength=\"40\" />\n</fieldset>\n\n<fieldset>\n  <legend>Favorite\
    \ activities</legend>\n  <input type=\"checkbox\" value=\"reading\" name=\"reading\"\
    \ id=\"reading\" />Reading<br />\n  <input type=\"checkbox\" value=\"sports\"\
    \ name=\"sports\" id=\"sports\" checked=\"checked\"\n  />Sports<br />\n  <input\
    \ type=\"checkbox\" value=\"games\" name=\"games\" id=\"games\" />Computer Games\n\
    </fieldset>\n\n<fieldset>\n  <legend>Reset or Submit Your Answers</legend>\n \
    \ <input type=\"reset\" value=\"reset\" />\n  <input type=\"submit\" value=\"\
    submit\" />\n</fieldset>\n\n</form>\n```\n\nIf you check your work in a browser,\
    \ you'll see that each fieldset is separated by a line around the field, and the\
    \ legend text appears within that top of line."
  merge: -1
  pgno: 99
- img_proc: true
  md: 'You can see how grouping of controls within a form can be helpful to bring
    logic and context to anyone, especially to those with learning disabilities and
    blindness.


    With fieldset and legend, you can provide far more assistance to individuals who
    might not otherwise be able to understand the form as explicitly (see Figure 5-15).


    | Contact Information |

    | First Name: |

    | Last Name: |

    | Phone: |

    | Favorite activities |

    | [] Reading |

    | [x] Sports |

    | [] Computer Games |

    | Reset or Submit Your Answers |

    | [reset] | [submit] |


    **FIGURE 5-15** Using fieldset and legend to group and identify form fields.


    > > QUANTUM LEAP

    Remember, the default appearance of any HTML in a browser is just that—a default.
    You can modify any presentation that HTML itself carries using CSS. So, in your
    example, you can style the fieldset sections to have different colors, use a different
    border style, and have more space between each section.


    You also can style the legend to match other fonts within your design, change
    color, change size, and do whatever you''d like. However, to keep the integrity
    of fieldset and legend, it''s wise not to deviate too far from the defaults (such
    as removing the borders around the fieldsets altogether), to ensure that the accessibility
    features remain available.'
  merge: -1
  pgno: 100
- img_proc: true
