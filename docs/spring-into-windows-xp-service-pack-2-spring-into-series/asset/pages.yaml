    iv. You''ll see an intersection at Oak and Vine, Stay on Oak two more blocks.

    v. Take a left onto Brome Street. We''re three houses in on the right.


    **FIGURE 10-10** Styling the ordered list with lowercase Roman.


    If you''d like to replace the numerals with an image, create images for each number
    you require and apply classes to each list item to get the results (see Example
