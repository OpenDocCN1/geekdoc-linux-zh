  md: "# EXAMPLE 3-12 Using the noscript element\n\n```\n<head>\n  <script type=\"\
    text/javascript\">\n    <!-- this hides the script from older browsers\n    function\
    \ newWindow(foodWindow = window.open(\"images/photo.jpg\",\n      \"foodwin\"\
