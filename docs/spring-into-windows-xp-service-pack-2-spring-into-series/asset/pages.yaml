  md: "# Using Form Menus\n\nTwo types of form menus exist: drop-down and list. Both\
    \ are extremely useful and can be modified in numerous ways to suit a range of\
    \ needs.\n\nOne of the most popular means of providing options in forms is the\
    \ all-familiar drop-down menu. Menus of this sort are especially helpful when\
    \ you have numerous options, and they are typically seen in standard menus for\
    \ states, countries, pricing and so on.\n\nDrop-down menus are created by combining\
    \ your selections with the select and option elements (Example 5-8).\n\n**EXAMPLE\
    \ 5-8** A drop-down form menu\n\n```\n<form method=\"get\" action=\"http://www.myserver.com/cgi-bin/mailscript/\"\
    >\n<p>State (U.S. Western Region):</p>\n\n<select>\n  <option value=\"Arizona\"\
    >Arizona</option>\n  <option value=\"California\">California</option>\n  <option\
    \ value=\"Colorado\">Colorado</option>\n  <option value=\"Nevada\">Nevada</option>\n\
    \  <option value=\"Texas\">Texas</option>\n  <option value=\"Utah\">Utah</option>\n\
    </select>\n<|form|>\n```\n\nFigure 5-7 displays the drop-down menu.\n\n![](img/516568206e0e220ce5a120446a34b48d_92_0.png)\n\
    \n**FIGURE 5-7** Selecting from a drop-down form menu.\n\nYou can add other features\
    \ to your drop-down menu, including with the checked attribute for check boxes,\
    \ preselection can assist with your form's usability by providing a more custom\
    \ approach. To preselect a specific option within a form menu, simply use the\
    \ selected attribute:\n\n```\n<option value=\"Nevada\" selected=\"selected\">Nevada<|option|>\n\
    ```"
  merge: -1
