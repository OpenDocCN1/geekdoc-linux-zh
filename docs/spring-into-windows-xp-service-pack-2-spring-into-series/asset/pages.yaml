  md: '# Element: a


    Description: Used for linking to external documents or intrapage references


    Element Type: Inline, nonempty


    Example:


    ```

    <a href="http://www.pearson.com/">Go to the Pearson Web Site</a>

    ```


    ```

    <a name="referenc1">Go to Reference One</a>

    ```


    Tips: There are no known tips for this element. You cannot have an anchor element
    within another anchor element.


    # Element: abbr


    Description: Denotes abbreviations and is especially useful for accessibility
    purposes


    Element Type: Inline, nonempty


    Example:


    ```

    <abbr title="department">dept.</abbr>

    ```


    Tips: This element is well supported in contemporary browsers and often is used
    in place of acronym because of poor support for that element.


    # Element: acronym


    Description: Denotes acronyms and is especially useful for accessibility purposes


    Element Type: Inline, nonempty


    Example:


    ```

    <acronym title="Hypertext Markup Language">HTML</a>

    ```


    Tips: Support for acronym is spotty, at best. At this time, it is being dropped
    from the XHTML 2.0 specification. As a result, it''s best to use abbr in all cases
    of abbreviations and acronyms.'
