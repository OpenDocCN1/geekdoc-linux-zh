  md: '# # Modifying Link Styles


    Simple, wasn''t that? You''ll go a little deeper and make some changes to the
    way your links look. Typically, most modifications are made for the hover state,
    but you can style for all states.


    A popular approach is to add a background color on hover (see Example 10-2).


    EXAMPLE 10-2 Adding a background color to the hover state


    ```

    a {color: orange};

    a:link {color: orange};

    a:visited {color: yellow};

    a:hover {color: fuchsia; background-color: white};

    a:active {color: red;};

    ```


    As the mouse passes over the link, the background turns white (see Figure 10-3).


    ![](img/516568206e0e220ce5a120446a34b48d_180_0.png)


    FIGURE 10-3 Changing the background color in a hover state.


    You can also modify the text weight by making it bold, or change its style and
    make it italic (see Example 10-3).


    EXAMPLE 10-3 Adding a background color to the hover state


    ```

    a {color: orange};

    a:link {color: orange};

    a:visited {color: yellow};

    a:hover {color: fuchsia; font-style: italic};

    a:active {color: red;};

    ```


    > NOTE

    Many specialists suggest avoiding major changes in link state styles because they
    feel it''s disconcerting. Some very rigid usability experts advocate not even
    styling links and leaving them with their default colors and underlines. Most
    designers do not agree with the more rigid approach, though, and prefer to use
    link styles to enhance their design work. The main concern is ensuring there''s
    some way for a visitor to know that the link is, in fact, a link.'
  merge: -1
