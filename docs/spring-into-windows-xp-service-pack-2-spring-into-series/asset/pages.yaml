    # QUANTUM LEAP: WHEN TO USE SHORTHAND


    Shorthand CSS is extremely useful when you''re trying to conserve file size. It
    also can make general management of your CSS easier. I tend to use it wherever
    I can, with few exceptions.


    However, I have heard people (particularly those who work in professional web-development
    team environments) point out that shorthand is harder for novices to work with.
    Some team managers choose to author their CSS in longhand no matter what because
    they find that it can help cut down on errors and confusion when diverse skill
    levels exist within a team.'
