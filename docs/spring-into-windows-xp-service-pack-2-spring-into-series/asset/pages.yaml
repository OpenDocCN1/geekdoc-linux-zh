  md: '# Property: line-height


    Description: Describes the height of a given line of text


    Media Type(s): Visual


    Example:


    ```

    #content p {

    line-height: 120%;

    }

    ```


    Tips: Typically, line-height should be close to the size of the font. The shorter
    the line height is in relation to the font, the closer the lines will be, and
    vice versa. Too much or too little space in either direction can cause problems
    with readability.


    # Property: list-style


    Description: Shorthand property to manage the list''s type, position, and image


    Media Type(s): Visual


    Example:


    ```

    #content ul {

    list-style: disc outside url(images/bullet.gif);

    }

    ```


    Tips: If the image is unavailable, the style disc will be displayed in its place.


    # Property: list-style-image


    Description: Adds an image to list items


    Media Type(s): Visual


    Example:


    ```

    #nav ul {

    list-style-image: url(images/nav-bullet.gif);

    }

    ```


    Tips: If you''d like to add a list style in case the image doesn''t load, you
    can gain a little more control over display. If you don''t add a list style value
    and the image doesn''t display, the default list style for that list type will
    be displayed.'
