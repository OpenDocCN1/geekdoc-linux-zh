  md: "# Linking to an Audio or Video File\n\nIf you'd like to provide links to media\
    \ on your site, you can do so as easily as linking an image. Many file types exist\
    \ for audio and video, the most popular these days being the MP3, QuickTime, Real,\
    \ and Windows Media files.\n\nYou first place your media file into a subdirectory.\
    \ As with images, this is a convention that helps you keep all your files organized.\
    \ In this case, I've named the sub- media (how's that for brilliant?) and placed\
    \ two files in it, one an MP3 audio file and the other an .avi video file. Example\
    \ 3-5 shows my document and how I've linked to me media files.\n\n**EXAMPLE 3-5**\
    \ Linking to audio and video\n\n```\n<DOCTYPE html PUBLIC \"-//W3C//DTD HTML 1.0\
    \ Transitional//EN\"\n  \"http://www.w3.org/TR/DTD/xhtml1-transitional.dtd\">\n\
    \n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n<head>\n  <title>Chapter\
    \ 3</title>\n</head>\n\n<body>\n  <a href=\"media/audio-sample.mp3\">Link to Audio\
    \ Sample</a><br />\n  <a href=\"media/video-sample.avi\">Link to Video Sample</a>\n\
    </body>\n</html>\n```\n\nI've added text within the links and placed a break between\
    \ the two links so they appear on top of one another rather than by side, for\
    \ the sake of clarity. This results in the links as shown in Figure 3-8.\n\n|\
    \ Chapter 3 - Mozilla |\n| Link to Audio Sample |\n| Link to Video Sample |\n\n\
    **FIGURE 3-8** Links to audio and video samples."
  merge: -1
