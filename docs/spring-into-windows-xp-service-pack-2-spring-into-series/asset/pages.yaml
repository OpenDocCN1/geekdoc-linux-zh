  md: '# Preface


    The Web might be the most intriguing invention of the 20th century. Certainly,
    it is a technology that has spread faster than a California wildfire and has,
    in just a decade''s time, changed the ways in which most contemporary societies
    live, work study—and, of course, shop.


    Hard to imagine that it all began as an experiment in a particle physics laboratory.
    Tim Berners-Lee and his fellow physicists at CERN (European Organization for Nuclear
    Research) had been searching for a way to effectively share research documents
    across a variety of computer platforms. The Internet, with its complex, international
    network, a very natural foundation upon to house the technologies that would ultimately
    combine to make up the Wide Web.


    From its origins to the absolutely astonishing permeation into world culture,
    the Web, according to its father, Berners-Lee, was intended to be as much a social
    environment as a technical one. This idea might well have to the fast proliferation
    of the Web, largely because it enables us to interact in many different ways via
    the technology, so much so that a new study of social networking has emerged to
    examine the social implications of the Web on society, and vice versa.


    # Who Should Read This Book?


    You might, in fact, be a physicist, but this book is also intended for a wide
    range of nontechnical professionals interested in building websites and working
    with web documents for professional application within a given field, such as
    education, medicine, law, or science. To that extent, I''ve written the book with
    a less technical jargon than I would for an audience of software developers, who
    will find this book, while very approachable, does get into some nifty-gritty
    concerns. The good news is you don''t have to be a rocket scientist to understand
    it—but if you are, it''ll work out for you, too!


    And, while intended for nontechnical professionals, the book will most certainly
    also be useful for people who are working in the web design and development field,
    and are interested in learning contemporary approaches to working with web pages.


    # How Is This Book Organized?


    I''ve organized this book into two sections. The first focuses on HTML, the language
    used to structure the document and its contents.'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'NOTE

    Although HTML is still in use, it has been reformulated into a language known
    as Extensible Markup Language (XHTML). For general purposes, they are essentially
    the same, with the exception that XHTML can be extended in ways beyond the scope
    of the book. However, to keep up-to-date and to get you working with modern markup,
    XHTML is used in this book. In fact, it''s an important point that I tend to use
    the terms HTML and XHTML interchangeably, even though they are, in fact, a different.


    You''ll learn more about HTML and XHTML in the book''s first section, which contains
    the following chapters:


    TABLE 1 Chapters in Section 1

    | Chapter | Title | Teaches you how to...

    | --- | --- | --- |

    | 1 | Building an HTML Page | Create a page in XHTML |

    | 2 | Adding Text and Links | Format text and links |

    | 3 | Adding Images, Media, and Scripts | Add dynamic content |

    | 4 | Creating Tables | Build effective data tables |

    | 5 | Building Forms | Create HTML forms |

    | 6 | Working with Frames | Work with frames |


    The second section of the book focuses on Cascading Style Sheets (CSS), which
    is the language that integrates with HTML and XHTML to add the design features
    of the page: layout, colors, fonts, and anything decorative. You''ll learn how
    to apply CSS to the pages you build by following the approaches found in the following
    chapters:


    TABLE 2 Chapters in Section 2

    | Chapter | Title | Teaches you how to ... |

    | --- | --- | --- |

    | 7 | Using CSS | Integrate CSS with HTML |

    | 8 | Working with Color and Images Using CSS | Add color and imagery |

    | 9 | Styling Text | Work with web typography |

    | 10 | Link Effects, Lists, and Navigation | Design with links and lists |

    | 11 | Margins, Borders, and Padding | Gain control over space |

    | 12 | Positioning, Floats, and Z-index | Position and float elements |

    | 13 | CSS Layouts | Lay out pages with CSS |'
  merge: -1
  pgno: 14
