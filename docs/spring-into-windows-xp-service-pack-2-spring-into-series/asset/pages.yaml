  md: '# Building an HTML Page


    Web documents are meant to be constructed logically. You must have certain elements
    in place for your document to conform and validate. Conformance means that the
    document actually follows the language and language version in which it is written.
    Validation is the technical process by which we test conformance, allowing us
    to find errors and fix mistakes.


    The first thing you can do to make absolutely certain that your pages are given
    the best fighting chance is to begin with all the required and structural elements
    that are needed before you begin to add text and other content.


    Ironically, it is only been in hindsight that the majority of people working on
    websites have improved upon the way they use markup. The Web was in a state of
    evolution—rapid growth that form new elements and features were being added to
    browsers—HTML all the time. Many of these features made it into the actual specifications,
    but did not. What''s more, elements of HTML pages that should have been included
    from the beginning have often been left out, by professionals.


    How is this possible, you might wonder? Well, the primary piece of software used
    to interpret HTML is the desktop web browser. These browsers have a long history
    of forgiving errors. Of course, they also have a long history of introducing errors!
    Browsers have been both the blessing and the curse of the Web because they have
    allowed for innovation but spent more time on features rather than basic support
    for the languages they are meant to support. As a result, the Web is a mishmash
    of HTML—most of it not conforming or validating—and, in light of this chapter''s
    discussion, many times authored without the basic structural components required
    by the language.


    A movement is afloat to bring better standards to browsers, to the tools that
    people use to develop websites, and to those of us interested in creating pages
    that not only work, but work well, regardless of our goals are personal or professional.


    In this chapter, you learn to create a template that will serve as the foundation
    for everything you do in this book. This template will contain all the necessary
    and helpful technical and structural bits that form the basis of a document that
    will conform and validate.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# # Declaring and Identifying the Document


    The first thing you''ll want to do in your page is add a bit of code that declares
    which type of document you''re using and identifies the language version. This
    is done with Standard General Markup Language (SGML), which is the parent language
    to HTML and appears in this important declaration, known as the DOCTYPE declaration.
    This is a unique piece of code, and a suitable declaration must be used in every
    document you create.


    Example 1-1 The DOCTYPE declaration we''ll be using in all examples in this:


    ```

    <!DOCTYPE html PUBLIC "//W3C//DTD HTML 1.0 Transitional//EN"

    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

    ```


    Look a weird? Not worry. I''ll go through it with you so you have a understanding
    of what each bit of this declaration means. First, there''s the opening `<`, which
    many readers who have looked at HTML before might wonder about. The angle bracket
    appears in only one other situation with HTML: in comments, which you''ll learn
    about in this chapter. This symbol isn''t used too often because it''s SGML syntax
    being used in the context of HTML. Here, it simply means that a declaration is
    about to begin. This is then followed by the DOCTYPE, which states that this code
    is declaring the document type.


    The next bit is html, which defines this document type as being written in HTML.
    Note that it''s in lower case. This is significant because we are using XHTML—and
    XHTML is sensitive, this particular part of the declaration must be in lower case.
    If it''s not, your document will not validate. The word PUBLIC is an important
    piece of information. This means that the particular document type being referenced
    is a public document. Many companies create unique versions of XHTML, with customized
    elements and attributes. For our purposes, the public version of HTML that we
    are going to use is absolutely sufficient.


    The ensuing syntax "-//W3C//DTD HTML 1.0 Transitional//EN" defines the host of
    the document''s language type and version (The World Web Consortium, W3C), and
    states that the document is being written according to the XHTML 1.0 Transitional
    Document Definition (DTD). A DTD is simply a long list of allowed elements and
    attributes for that language and version. Finally, there''s a complete URL that
    goes to the DTD, "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd". If
    you were to load this into your browser, you would see the actual DTD, for XHTML
    1.0 Transitional (see Figure 1-1).


    Building an HTML Page > Declaring and Identifying the Document'
