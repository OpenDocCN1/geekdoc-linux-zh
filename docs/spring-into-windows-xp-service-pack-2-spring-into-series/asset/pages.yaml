  md: "# Grouping Table Rows\n\nYou can also group table rows using three elements\
    \ that define the row groups based on function. The elements include the, tfoot,\
    \ and tbody for table head, table foot, and table body, respectively (see Example\
    \ 4-16).\n\n**EXAMPLE 4-16** Grouping table rows\n\n```\n<thead>\n<tr>\n  <th>Table\
    \ Head</th>\n  <th>Table Head</th>\n  <th>Table Head</th>\n</tr>\n</thead>\n<tfoot>\n\
    <tr>\n  <td>Table Foot</td>\n  <td>Table Foot</td>\n  <td>Table Foot</td>\n</tr>\n\
    </tfoot>\n<tbody>\n<tr>\n  <td>Table Body</td>\n  <td>Table Body</td>\n  <td>Table\
    \ Body</td>\n</tr>\n</tbody>\n</table>\n```\n\nBrowser support is more consistent\
    \ for these elements. Figure 4-17 shows the results.\n\n![](img/516568206e0e220ce5a120446a34b48d_82_0.png)\n\
    \n**FIGURE 4-17** Grouping by row—you've defined the foot in the middle of the\
    \ table, but the row defined as the table foot still appears at the foot of the\
    \ table."
  merge: -1
