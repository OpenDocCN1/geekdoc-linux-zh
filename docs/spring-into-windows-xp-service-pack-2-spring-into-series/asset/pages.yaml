  md: '# Styling Ordered Lists


    Moving on to lists, you''ll begin by styling an ordered list. You''ll modify the
    marker type and then replace the marker altogether with an image. I began with
    some text and background styles along with an unstyled ordered list, resulting
    in Figure 10-9.


    # Directions To The Party!


    ![](img/516568206e0e220ce5a120446a34b48d_185_0.png)


    +   1. From the corner of Broadway and 5th Avenue, take a right onto 5th.

    2. Follow 5th North about three miles until you come to the Oak Road intersection.

    3. Take a right on Oak Road. Stay on Oak about five miles.

    4. You''ll see an intersection at Oak and Vine, Stay on Oak two more blocks.

    5. Take a left onto Brome Street. We''re three houses in on the right.


    **FIGURE 10-9** A styled page with an ordered list.


    If you want to use an alternate marker, you can do so using the list-style-type
    property with a corresponding value (supporting numerals in other languages),
    but the ones you''ll likely want to swap in an ordered list are decimal-zero (which
    starts the numbering at zero) and lower-roman or upper-roman numerals, respectively).
    Simply add the value you want to use your existing style sheet:


    ```

    ol {list-style-type: lower-roman;}

    ```


    This results in the numerals displaying lowercase Roman (see Figure 10-10).


    # Directions To The Party!


    ![](img/516568206e0e220ce5a120446a34b48d_185_1.png)


