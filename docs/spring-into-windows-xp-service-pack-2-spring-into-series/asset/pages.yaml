  md: '# Clearing Floats


    A clear float means clearing away all subsequent content so that the element is
    still floated but is not surrounded by the other elements. The clear property
    takes a value of left, right, or both. By adding the clear: right; property to
    the content division, the floating navigation remains in place, but the text is
    cleared (see Figure 12-13).


    ![](img/516568206e0e220ce5a120446a34b48d_226_0.png)


    By Edgar Allan Poe


    I married early, and was happy to find in my wife a disposition uncongenial to
    mine. Observing my partiality for domestic pets, she lost no opportunity of procuring
    of the most agreeable kind. We had birds, gold fish, a dog rabbit, a small monkey,
    and a cat.

    This latter was a remarkable and beautiful animal, entirely black, and sagacious
    to an astonishing degree. In speaking of his intelligence, my wife, who at heart
    was not a little tinted with superstitions, made frequent remarks about his supposed
    portrait, which she regarded all black cats as in disguise. She did not say ever
    serious upon this point; and I mentioned the matter all for no reason than that
    it happens, just now, to be remembered.

    Pluto was my favorite. I alone fed him, and attended me wherever I went about
    the house. It was even with difficulty that I could prevent him from following
    through the streets.


    FIGURE 12-13 Clearing a float allows the floated element to remain in place, while
    the subsequent content is cleared from around.


    I created two floating boxes in Example 12-9.


    EXAMPLE 12-9 Styling two floating boxes, one to the left and one to the right


    #nav (float: right; border: 1px solid red; padding-right: 20px; padding-top: 10px;

    margin-left: 10px);


    #nav2 (float: left; border: 1px solid red; padding-right: 20px; padding-top:

    10px;argin-right: 10px);


    Figure 12-14 shows what happens when I don''t use a clear property for the content.


    210 Positioning, Floats, and Z-index > Clearing Floats'
