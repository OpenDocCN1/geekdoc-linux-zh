    # QUANTUM LEAP: OTHER AVAILABLE PROPERTIES


    Two other values are available for the background-repeat property. The first is
    repeat. Using the tile to repeat on both the horizontal and vertical axes, which
    is default behavior for backgrounds; you probably won''t use it unless you are
    specifically overwriting a previous rule. Many CSS properties offer a default
    value of this nature for precisely that reason.


    The second available value is inherit. This value is available for most properties,
    and because most properties are inherited, it simply strengthens the case that
    the property will be inherited by its descendants. You will likely not use inherit
    too frequently, either, unless you are specifically undoing another rule or you
    are applying the value to a property that is not normally inherited but supports
    the value, such as background-position.'
