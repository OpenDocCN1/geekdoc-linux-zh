  md: "# Adding Table Cells\n\nTable cells provide the vertical columns of your table.\
    \ They are represented by the table data tags:\n\n```\n<td>\n</td>\n```\n\nAlong\
    \ with the table and tr elements, the table data element comprises the three essential\
    \ building blocks of any table (see Example 4-4).\n\nEXAMPLE 4-4-4 A table with\
    \ a single table row and three columns\n\n<table width=\"90%\" border=\"1\" cellspacing=\"\
    5\" cellpadding=\"5\">\n  <tr>\n    <td></td>\n    <td></td>\n    <td></td>\n\
    \  </tr>\n</table>\n\nBecause you have all the necessary building blocks, this\
    \ table displays in a web browser without any additional help (see Figure 4-5).\n\
    \n![](img/516568206e0e220ce5a120446a34b48d_69_0.png)\n\nFIGURE 4-5 Anatomy of\
    \ a simple table: three cells, one row, width of 90%, cellspacing of 5.\n\nOf\
