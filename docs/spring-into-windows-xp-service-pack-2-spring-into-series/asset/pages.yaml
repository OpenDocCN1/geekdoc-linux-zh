  md: "# Fixed Positioning\n\nFixed positioning is a brilliant piece of CSS. Now you\
    \ know that if I'm starting off a section like that, I'm giving you the good news\
    \ first to soften the blow. Because brilliant as fixed positioning is, it's not\
    \ supported in Internet Explorer and, as such, can be used only for Mozilla, Opera,\
    \ Safari, and other browsers that do support it. Phooey!\n\nFixed positioning\
    \ enables you to fix a box anywhere on the page. Unlike absolute positioning,\
    \ fixed elements are positioned in relation to the viewport (you knew that just\
    \ had to be somewhere in this chapter). Look at Example 12-6.\n\nEXAMPLE 12-6\
    \ Fixed positioning\n\n```\n<style type=\"css\">\nnav {\n  position: fixed;\n\
    \  left: 0px;\n  top: 0px;\n  background: #ccc;\n  width: 100%;\n}\nul, li, a\
    \ {\n  list-style-type: none;\n  display: inline;\n  text-decoration: none;\n\
    \  padding-left: 3px;\n  padding-right: 3px;\n}\n</style>\n```\n\nSo check out\
    \ what I did. By positioning the nav div to 0 left and 0 top, adding a gray background,\
    \ and setting my width to 100%, I oh-soverly made my navigation look pretty darn\
    \ close to a standard menu, just as you'd find in the browser itself (see Figure\
    \ 12-9).\n\n> NOTE\\Although IE 6.0 doesn't support the fixed scheme, it doesn't\
    \ entirely disallow from using it. You'll get the positioned box, but it will\
    \ scroll off along with the rest of the content instead of remaining fixed in\
    \ place."
  merge: -1
