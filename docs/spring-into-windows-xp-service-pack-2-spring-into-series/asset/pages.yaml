  md: "# Using Embedded Style\n\nEmbedded style controls only the document in which\
    \ it is embedded. As with inline style, this defeats the purpose of being able\
    \ to apply styles site-wide. However, there are good uses for embedded style.\
    \ One would be if that document is the only document in the site that takes those\
    \ specific styles. Another is workflow related. I like to use embedded style while\
    \ working on a design because it's all in the same document. This way, I don't\
    \ have to switch between applications or windows to accomplish my tasks. Because\
    \ the style rules are the same, I can simply cut out the final styles from the\
    \ embedded sheet and link them, you'll see how to do in just a bit.\n\nEmbedded\
    \ style is attached to the head portion of the document, within the style element,\
    \ and it uses the required type attribute (see Example 7-1).\n\nEXAMPLE 7.1 An\
    \ HTML document snippet describing embedded style\n\n```\n<head>\n<title>working\
    \ with style=\"text/css\">\title>\n  <style type=\"css\">\n body (background-color:\
    \ black; color: white;\n h1 (font-size: 24px);\n p (font-size: 12px);\n</style>\n\
    </head>\n<body>\n<h1>Welcome!</h1>\n<p>Paragraph one.</p>\n<p>Paragraph two.</p>\n\
    </body>\n```\n\nFigure 7-3 shows the results.\n\n![](img/516568206e0e220ce5a120446a34b48d_127_0.png)\n\
    \nFIGURE 7-3 Notice how the color from the body is inherited by all its children."
  merge: -1
