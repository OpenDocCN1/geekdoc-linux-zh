  md: 'Along with the chapters, there are two important appendices. The first is "XHTML
    1.0 Annotated Reference," which provides a look-up along with proper usage and
    tips of all the elements in XHTML 1.0. The second is "CSS 2.1 Annotated Reference,"
    which provides a listing, along with proper usage and tips, of all available CSS
    properties.


    Between the chapters and the appendices, you''ll be set when it comes to the breadth
    of knowledge required to create great web pages using today''s techniques.


    # # What’s Unusual About This Book?


    This book, like the other books in the Spring Into... Series, provides the following
    unique approaches to the content within:


    +   * Each topic is explained in a discrete one- or two-page unit called a "chunk"

    * Each chunk builds on the previous chunks in that chapter.

    * Many chunks contain sidebars and "Quantum Leaps," which provide helpful, ancillary
    material that is often more advanced than the main text.


    The chunk style has specifically crafted to meet the needs of busy people. I know
    you don''t have a lot of time to spend learning complex ideas, so giving them
    to you in bite-size chunks is a helpful way to get you working as fast as possible,
    the right way, from the get-go.


    # # Where to Get Examples from the Book


    See the book’s web page www.awprofessional.com/springinto/.


    # # Acknowledgments


    Writing a book feels a lonely process, but the fact that many people help out.
    Barry Rosenberg provided much needed early guidance on how to write in the chunk
    style used in this series. Along the way, three reviewers provided valuable feedback:
    Kimberly Blessing and Eris Free pointed out ways I could improve the text, and
    Daniel Smith lent his eye and found mistakes and points of clarification, and
    provided very supportive tips along the way. A special thanks to Mark Taub, who
    offered the fine opportunity well as shepherded it through. Finally, to David
    Fugate, literary agent extraordinaire, who is always there with wit, wisdom, and
    great move advice, to boot.'
