  md: "# Property: border-color\n\nDescription: Sets a border color for any element.\
    \ Can be used in place of border-top-color, border-right-color, border-bottom-color,\
    \ border-left-color.\n\nMedia Type(s): Visual\n\nExample:\n\n```\n#sidebar {\n\
    \  border-color: red blue green yellow;\n}\n```\n\nTips: If you're setting more\
    \ than one color, you must follow the TRouBle order rule: top, right, bottom,\
    \ left. If there is only one value, it applies to all sides. If there are two\
    \ values, the top and bottom borders are set to the first value, and the right\
    \ and left are set to the second. If there are three values, the top is set to\
    \ the first value, the left and right are set to the second, and the bottom is\
    \ set to the third. If there are four values, they apply to the top, right, bottom,\
    \ left.\n\n# Property: border-spacing\n\nDescription: Defines the space between\
    \ adjoining cells within tables\n\nMedia Type(s): Visual\n\nExample:\n\n```\n\
    table {\n  border-spacing: 1.0em;\n}\n```\n\nTips: If one length is specified,\
    \ it gives both the horizontal and vertical spacing. If two are specified, the\
    \ first gives the horizontal spacing and the second the vertical spacing. Lengths\
    \ may not be negative.\n\n# Property: border-style\n\nDescription: Sets the style\
    \ of an element's borders. Can be used in place of border-top-style, border-right-style,\
    \ border-bottom-style, and border-left-style.\n\nMedia Type(s): Visual"
  merge: -1
