  md: '# Nested Float


    A very simple but useful layout is the nested float. This layout floats a box
    within the main content area. You can then use this box for navigation, imagery,
    or whatever your preference (see Figure 13-6).


    ![](img/516568206e0e220ce5a120446a34b48d_236_0.png)


    FIGURE 13-6 Floated box within a content section.


    Example 13-4 shows how this layout is achieved.


    EXAMPLE 13-4 Nested float layout


    ```

    <style type="text/css">

    #content (margin: 10px); border: 1px solid orange;}

    #content nav (float: right; width: 150px; border: 1px solid orange; margin-left:
    5px);

    </style>

    ```


    I gave the content and a border so you can visualize it better. To achieve the
    nested float, I used a descendant selector of #content #nav and then floated the
    nav within the #content to the right. The margin-left value adds a little whitespace
    between the border and the text. A very important issue is that when you write
    the HTML for this (which you can see in the template itself), the nav div must
    be nested inside the

    #content div:


    ```

    div id="content">

    <div id="nav">

    <ul>

    ```'
