  md: '# Definition Lists


    A definition list is as ancient of an HTML construct as you can find. However,
    these are sorely underused, which is a shame because they provide a great way
    to define terms and concepts.


    Definition lists consist of three elements: the definition list element, <dl>.
    . . </dl>; the definition term element, <dt>. .</dt>, and the definition description
    element, <dd>. .</dd>.


    You can have multiple instances of terms within a definition list (see Example
    2-8).


    **EXAMPLE 2-8** Multiple definitions within a list


    ```

    <dl>

    <dt>Furkid (n)</dt>

    <dd>A pet treated as though it were one''s child.</dd>


    <dt>Nearshoring (v)</dt>

    <dd>Restructuring a company''s workforce by moving jobs to a nearby foreign country.</dd>


    <dt>Neurodiversity (n)</dt>

    <dd>The variety of non-debilitating neurological behaviors and abilities exhibited
    by the human race.</dd>

    </dl>

    ```


    The browser displays the term, and the definition itself is indented (see Figure
    2-8).


    ![](img/516568206e0e220ce5a120446a34b48d_37_0.png)


    **FIGURE 2-8** Definition list displayed in a browser.


    You''ll be able to use CSS to add styles such as fonts and color if you want to
    add a little flair to your list.'
  merge: -1
