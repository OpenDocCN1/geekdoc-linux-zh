  md: 'So far, pretty easy, right? Well, there are a few more things to do with links
    to give visitors an easier time managing the audio and video.


    # Beware Browser Behavior Differs


    Different browsers and different browser configurations influence the way that
    linked audio and video is displayed. As the link is selected, some browsers automatically
    download the file into an external media player and play the audio or video clip.
    Others browsers provide a pop-up option asking whether you''d like to open the
    file with the appropriate application, or download it and save it to your hard
    drive. Because of these differences in behavior, it''s helpful to let your visitors
    know as much about the link they''re about to click on all possible.


    Because most audio and video clips are quite large, it is helpful to provide the
    file sizes on the page so visitors are prepared. You can do this by simply typing
    the details into the link or directly after it.


    # NOTE


    Some folks go so far as to provide a range of file sizes for their low-, medium-,
    and high-bandwidth visitors.


    Another way to assist is to provide a description of the file into the title attribute
    of the link (see Figure 3-9).


    This helps provide more detail to all and alerts those folks who can''t see or
    hear to understand what the link is for (see Example 3-6).


    **EXAMPLE 3-6** Adding details for visitors


    ```

    <a href="media/audio-sample.mp3" title="audio of molly singing">Link to Audio
    Sample: Size: 1,300KB />

    <a href="media/video-sample.avi" title="video of sarah''s dance class">Link to
    Video Sample: Size: 29,000KB</a>

    ```


    ![](img/516568206e0e220ce5a120446a34b48d_55_0.png)


    **FIGURE 3-9** Providing helpful details for audio and video links.'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# Embedding Files Using the object Element


    Another means of providing audio, video, and other multimedia such as Flash animations
    and Java applets is to embed them directly into the page. This means that the
    soft-plugin loads automatically with the page.


    All external files are considered objects. This includes images as well as multimedia
    files. In contemporary HTML and XHTML specifications, the proper way to include
    all multimedia is to use the object element to embed a file directly:


    ```

    <object data="media/video-sample.avi" type="video/avi" />

    ```


    This results in the player application appearing on the page. The video can then
    be played (see Figure 3-10).


    ![](img/516568206e0e220ce5a120446a34b48d_56_0.png)


    FIGURE 3-10 The embedded player loaded into Internet Explorer.


    > NOTE

    Of course, you can do a lot more in terms of providing advanced settings. To learn
    more about the many available settings for multimedia, see the excellent tutorial
    at http://www.w3schools.com/media/default.asp.'
  merge: -1
