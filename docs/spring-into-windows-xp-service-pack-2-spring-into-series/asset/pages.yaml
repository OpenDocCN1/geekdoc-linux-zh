- img_proc: true
  md: '# Working with Color and Images

    Using CSS


    Color is one area where CSS has long been our friend. Because color is determined
    by a combination of the computer''s hardware capabilities, the operating system,
    and the browser, we''ve been able to use CSS to color backgrounds and text since
    relatively early in the life of style sheets. Here you''ll learn to apply color
    to page backgrounds and element backgrounds, and even spice up tables with color.


    Color options in CSS are more numerous than what was available to us in HTML.
    In CSS, you can choose among hexadecimal color, hexadecimal shorthand color, RGB
    color, color percentages, and the 17 color names supported by CSS 2.1.


    CSS provides terrific control for images, too. In fact, the capability to place
    images into the background of any element is helping today''s web designers create
    beautiful designs free of the constraints of tables. In this chapter, you''ll
    learn how to apply images to backgrounds and elements, and you''ll learn about
    methods of using images for a range of visual techniques.


    Image options are numerous in CSS. You can control the way images tile (or don''t
    tile), fix them to a location within an element''s background, scroll the image
    or fix the image so text scrolls over it—lots of choices. You''ll get to try out
    all these techniques and get a feel for how CSS not only enables to use images
    in ways never available in HTML, but does so with a range of control you will
    really appreciate.


    So, you''ve been focusing on structuring your content with HTML, adding images
    and media, and working with tables, frames, and forms. Everything you''ve done
    so far has been about creating the canvas. Now you''ll get a chance to splash
    some color and life onto that canvas, making your seemingly bland documents come
    to life.


    NOTE

    The examples of color in this book have been limited to grayscale. However, you
    should feel free to try using any of the rules I describe with any range of colors
    to get the results best suited to your needs.'
  merge: -1
  pgno: 135
- img_proc: true
  md: '# Color and CSS


    To use color well in CSS, you''ll want to know about the various ways color can
    be defined. Although color can be applied using any number of properties, there
    are specific value options that you''ll want to know about.


    # Hexadecimal Color


    Hexadecimal (hex) is a base 16 system number, useful in computing because 8 bits
    (1 byte of memory) can be represented by a single number or letter. The system
    uses numbers from 0 to 9 and letters from a to f in any combination of six (starting
    with an octoctrobe) to represent the correlating red, green, and blue colors (#RRGBB).


    ```

    #FFFFFF = 255, 255, 255 = white

    ```


    Any hexadecimal combination is allowed in HTML and CSS to represent color (see
    Example 8-1).


    +   EXAMPLE 8-1 Hexadecimal color in style


    ```

    body {color: #FFCC99; background-color: #808080}

    a {color: #66CC33; }

    ```


    If you applied these styles to a document, the background color would be gray,
    the text color peach, and the link color bright green.


    # Hexadecimal Shorthand


    Hex shorthand enables you to shorten any hex color that has value pairs. This
    means that each RR, GG, and BB values have to be the same, such as #0CC33 or #888888.
    In hex shorthand, we take one digit from each value pair, so the results would
    be #0C3 and #88. In a case as #808080, the values are not paired, so you can''t
    make it into shorthand (see Example 8-2).


    +   EXAMPLE 8-2 Hexadecimal shorthand color


    ```

    body {color: #FC99; background-color: #808080}

    a {color: #6C33; }

    ```


    > NOTE You can use hex shorthand in any CSS document, but not in presentational
    HTML.'
  merge: -1
  pgno: 136
- img_proc: true
  md: '# RGB Values


    Another means of representing color in CSS is using the actual RGB values. These
    can be found in an imaging program such as Photoshop (see Figure 8-1).


    ![](img/516568206e0e220ce5a120446a34b48d_137_0.png)


    FIGURE 8-1 The RGB values of a gray color using Photoshop.


    In this case, the color would be presented using the following syntax:


    ```

    color: rgb(128, 128, 128);

    ```


    # RGB Percentages


    You can also use percentages of red, green, and blue. A 0% value is black, and
    a 100% value is white. So, if you set a color as follows:


    ```

    color: rgb(50%, 100%, 30%);

    ```


    the color applied will be a bright green.


    # Color Names


    You can use 17 color names to describe color. The colors are aqua, black, blue,
    fuchsia, gray, green, lime, maroon, navy, olive, purple, red, silver, teal, white,
    yellow, and orange (orange was just introduced in CSS 2.1).


    ```

    color: orange;

    ```


    You''re probably wondering which color value type you should use. The honest answer?
    All of them! You''ll probably find yourself using combinations of keywords, shorthand
    hex, and hexadecimal most frequently.


    > NOTE

    In the upcoming CSS 3.0, many additional colors have been added, but they aren''t
    available for widespread, valid use at the time of this writing.'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# Adding Color to Backgrounds


    Adding color to backgrounds is extremely easy and very useful. You can add color
    to your page background and any element background.


    # Color and the Document Background


    Color is added to the document background by selecting the body element and using
    the background-color property and a color property value:


    ```

    body {background-color: #999;}

    ```


    Here you see I''ve chosen a background of dark gray to the entire body. When viewed
    in a browser, this turns the background color completely gray (see Figure 8-2).


    ![](img/516568206e0e220ce5a120446a34b48d_138_0.png)


    Figure 8-2 Applying color to a document background.


    > NOTE

    You should always set a page background color, even if you intend to use graphics
    and other element backgrounds in your design. This is because colors are interpreted
    by browsers very quickly and render before any graphics, providing a more streamlined
    visual experience for your visitors.


    # Color and Element Backgrounds


    With CSS, you can add color to individual element backgrounds. To do this, simply
    select the element and create a rule. I''ll do this for the h1 as I build a style
    sheet for our simple document:


    ```

    body {background-color: #999;}

    h1 {background-color: #ccc;}

    ```'
  merge: -1
