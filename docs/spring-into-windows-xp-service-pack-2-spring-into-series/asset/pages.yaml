  md: '# Fixing and Scrolling Background Images


    You can have your background image fixed to the browser''s viewport, or allow
    it to scroll along with the document by using the background-attachment property
    along with a value of either fixed or scroll.


    Typically, this is used for the entire body or content areas within the document.
    However, as you''ve seen so, you can use it in any element where it makes sense
    to do so.


    Consider the following rule:


    ```

    body (background-image: url(arrows.gif); background-position: right; background-repeat:
    no-repeat; background-attachment: scroll);

    ```


    I''ve attached a background image, positioned to the right with no repeat, and
    scrolled the background. This actually creates a rule that mimics default browser
    behavior, which is to scroll the background with the content (see Figure 8-11).


    ![](img/516568206e0e220ce5a120446a34b48d_148_0.png)


    FIGURE 8-11 When a background graphic is set to scroll, it scrolls along with
    the element to it''s attached—in this case, the body.'
