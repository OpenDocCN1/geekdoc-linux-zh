  md: "# Vertical List Navigation with Image Effects\n\nBy tapping into background\
    \ graphics and the :hover selector, you can create a navigation list that will\
    \ have an attractive background for each list item. Add a contrasting background\
    \ graphic to the hover state for impressive results (see Example 10-12).\n\n**EXAMPLE\
    \ 10-12** Using background images to create sophisticated navigation effects\n\
    \n```\nbody (font: bold 15px Georgia, Times, serif; color: black;)\n  a (color:\
    \ white; text-decoration: none; display: block;)\n    a:link (color: white);\n\
    \    a:visited (color: yellow);\n    a:hover (color: white; background-image:\
    \ url(linkhover.gif));\n    a:active (color: red);\n  #nav, #nav a (width: 100px;\
    \ margin: 0; padding: 0; list-style-type: none;)\n  li (background-image: url(linkback.gif);\
    \ border-bottom: 3px solid white);\n```\n\nYou'll notice I've set this background\
    \ graphic for the list item, as well as a background graphic for the hover state.\
    \ This results in a richly detailed navigation bar with advanced effects (see\
    \ Figure 10-18).\n\n![](img/516568206e0e220ce5a120446a34b48d_192_0.png)\n\n**FIGURE\
    \ 10-18** Adding background graphics to the list item and hover to create graphically\
    \ mouseover effects unattainable without JavaScript.\n\n**NOTE**\n've changed\
    \ the display of the anchor element from inline (in-text) to block (followed by\
    \ a break). This is necessary to match the width of the anchor element to the\
