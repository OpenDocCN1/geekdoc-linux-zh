    The results can be seen in Figure 7-4.


    ![](img/516568206e0e220ce5a120446a34b48d_129_0.png)


    # FIGURE 7-4 Results from a linked style sheet.


    Of course, you can link as many documents you want to this this style sheet using
    the link element.


    You''ll note several attributes in using the link element, as follows:


    +   - rel—This is the relationship attribute, and it describes the relationship
    of the link. In this case, the relationship is with a primary style sheet, so
    the stylesheet value is given.

    - type—As with the style element in embedded styles, you must define the type
    of language and format in use—in this case, text/css.

    - href—This is the familiar reference attribute. In this case, I identified only
    the file because both documents are in the same directory. You might want to put
    your style sheets into a different directory; just be sure your href info is accurate.
    You can also use absolute linking to directly link to a style sheet.

    - media—The media attribute enables you to define different styles for different
    media. If you wanted to create a separate style sheet for this document for handheld
    devices only, you would link to that and use the media="handheld" attribute. Similarly,
    a media="print" attribute would send that style sheet only to print. In this case,
    the media is defined as screen. The default is all, so if you want the same styles
    to apply to all media, you can use that or simply leave the media attribute.


    As mentioned, you can link many style sheets to the same document as you want.'
