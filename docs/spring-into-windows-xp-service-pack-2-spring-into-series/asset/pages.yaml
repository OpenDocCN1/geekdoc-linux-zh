  md: '# Customizing and Advancing Your Forms


    You''ve learned everything in this chapter you need to know to create effective,
    useful, and accessible forms. Again, although they''re not pretty just yet, you''ll
    be able to spruce them up when you learn how using CSS.


    For now, you''ll want to take two important steps. The first is to build a complete
    form from start to finish, using as many text fields, text areas, check boxes,
    radio buttons, and menu lists as you require.


    Then, of course, is the issue of how your form will be processed. Forms processing
    is also straightforward or fairly complex, depending upon your needs. Forms processing
    is also done on a number of server types, so technologies will vary—and those
    technologies can do (and how far you can take them) with your forms will also
    vary. Fortunately, many free resources exist to help you understand and implement
    your forms more efficiently.


    # QUANTUM LEAP


    To learn more about various aspects of forms processing, see the Web Authororing
    FAQ from the Web Design Group, http://www.htmlhelp.com/faq/html/forms.html.


    For a list of numerous resource hosts for a range of form-processing needs, check
    out the CGI Resource, http://cgi.resourceindex.com/Remotely_Hosted/Form_Processing/.


    For PHP-based form scripts, see http://php.resourceindex.com/Complete_Scripts/Form_Processing/


    For forms processing on the Microsoft .NET platform, this article will be very
    helpful to you: http://www.ondotnet.com/pub/a/2003/01/06/formsauthp1.html.'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# Now That You''re Well-Formed...


    I never feel very good about leaving readers without all the information necessary
    to tap into the true power of forms. But doing so is nearly impossible because
    forms can be used effectively in so many different ways—and with a wide range
    of technologies, as you''ve seen.


    In fact, in the world of professional web development, entire specialties exist
    in which individual developers spend the majority of their work developing the
    applications and databases that form-based, dynamic web pages. You''ll see the
    results of such complex specialties at familiar websites. Anything with e-commerce,
    such as Amazon.com, requires this kind of complex development to properly process
    orders, credit card information, and shipping directions.


    Portal sites are also very good examples of complex use of forms. Ever America
    online all use forms to manage membership, personalization features, and so forth.


    Another excellent example of complex forms and data management comes via online
    banking. I don''t know about you, I''m sure at a loss these days without instant
    access to my accounts from anywhere in the world. It really helps a somewhat distracted
    person as we stay on top of the practical side of life.


    > NOTE

    Not using online banking yet? Check and see if your bank offers online banking
    options. My bank, Wells Fargo, which services the western United States, has an
    excellent website, http://www.wellsfargo.com/, and is even working toward making
    the site completely standards compliant and accessible.


    Okay, have you had enough of forms? Great! It''s time to move on to frames and
    learn their value in contemporary design. I''ll also point out their many flaws
    and tell you why most people have eliminated forms from site designs altogether.'
