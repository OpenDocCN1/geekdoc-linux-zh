  md: "# Relative Positioning\n\nAs mentioned, the terminology used in CSS positioning\
    \ is a bit vague. Relative positioning is often confusing at first because it\
    \ begs the question: Relative to what? Most people automatically—and quite logically—think\
    \ that the position would be relative to another element.\n\nBut it's not (you\
    \ knew that was coming). Relative positioned boxes are positioned to the normal\
    \ flow. This means that they are not removed from the normal flow the way an absolutely\
    \ positioned box is. I've removed all margins using the universal selector (*);\
    \ this is to get rid of all default whitespace so you can see exactly how relative\
    \ positioning is being measured (Example 12-5).\n\nEXAMPLE 12-5 Relative positioning\n\
    \n```\n<!DOCTYPE html PUBLIC \"//W3//DTD HTML 1.0 Transitional//EN\"\n     \"\
    http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
    >\n<head>\n  <title>working with style</title>\n  <style type=\"text/css\">\n\
    \  *{margin: 0};\n  #content {\n    position: relative;\n    left: 45px;\n   \
    \ top: 10px;\n    width: 400px;\n    border: 1px solid red;\n  }\n  </style>\n\
    </head>\n<body>\n<h1>The Black Cat</h1>\n<p>I married early, was a <a href=\"\
    http://www.poemmuseum.org/\">happy to find</a> a wife whose position was not uncongenial\
    \ with my own. Observing my partiality for domestic pets, she lost no opportunity\
    \ of procuring those of the most agreeable kind. We had birds, gold fish, a fine\
    \ dog, a rabbit monkey, and a cat.</p>\n<div id=\"content\">\n<p>This latter was\
    \ a <a href=\"http://www.poemmuseum.org/\">remarkably</a> a large and beautiful\
    \ animal, entirely black, and sapacious to an astonishing degree. In speaking\
    \ of its intelligence, my wife, who at heart was not a little tinted with superstition,\
    \ made frequent allusion to the ancient popular notion, which regarded all black\
    \ cats as witches in disguise. Not that she was ever serious upon this point -\
    \ I mention the matter at all for no better reason than that it happens, just\
    \ now, to be remembered.</p>\n</div>\n```\n\n![](img/516568206e0e220ce5a120446a34b48d_220_0.png)"
  merge: -1
