  md: '# But Your Honor, I Object!


    Okay, the entire last section was filled with lies. Not that I''m trying to steer
    you wrong—I''m trying to do quite the opposite. All external media should be addressed
    using the object element if you want to be markup that exists in the valid world
    of HTML and XHTML.


    However, there''s a big stumbling block with using the object element, and that
    is that support it is inconsistent across browsers and platforms. This is very
    disturbing from a purist''s point of view because there''s no other alternative
    within the specifications.


    QUANTUM LEAP: OBJECT HANDLING IN XHTML 2.0


    In HTML 2.0, the object element becomes ubiquitous. In other words, any other
    elements for external objects, including the img, are obsolete. Obviously, it''s
    preliminary to use XHTML 2.0 because your results will be limited to those few
    browsers that support object for img. But it gives you a good idea of the direction
    XHTML taking.


    Here''s what it boils down to, in simple terms: If you want your multimedia to
    be consistent across all browsers, you have to turn to a proprietary element,
    the embed element. This element has never existed in any of the formal specs,
    but most browsers support it; if your pages with the embed element will cause
    validation errors, they''re going to crash.


    Conventional wisdom mixes both object and embed. So if you were to use this approach
    with the same Flash file just described, you''d end up with the markup shown in
    Example 3-8.


    EXAMPLE 3-8 Embedding a Flash movie file (SWF) into a page using <object> and
    <embed>


    ```

    <object class="cid=d27cdc66-ae6d-11cf-96b8-444535545000" width="100"

    height="100" codebase="http://archive.macromedia.com/flash6/cas/

    flash.cabversion="6,0,0">

    <param name="movie" value="ava.swf" />

    <param name="play" value="true" />

    <param name="loop" value="true" />

    <param name="quality" value="high" />

    <embed src="media/ava.swf" width="100" height="100" play="true"

    loop="true" quality="high"></embed>

    </object>

    ```


    The Flash movie will now play inline in almost every browser.'
  merge: -1
