- img_proc: true
  md: '# Positioning, Floats, and Z-index


    If you''ve been having a good time adding color, backgrounds, text styles, and
    margins to your pages, the fun has just begun. You''ll be expanding your knowledge
    (which, at this point in the book will be quite sophisticated) to include the
    most significant aspects of CSS to be put to use in the past few years.


    The combination of technologies you''ll be working with will provide you with
    the basis for what you need to know about creating great CSS-layouts, instead
    of the table-based ones so often in this book. Fortunately, contemporary browsers
    have enough CSS support—and we have enough knowledge of workarounds—to apply these
    techniques to create great-looking pages.


    Positioning refers to the scheme in CSS that enables you to use elements to create
    boxes and move them around in relation to the document and browser. You''ll learn
    what these schemes are and how to begin applying them.


    Float refers to a CSS technique that places an element to the left or right. The
    text in the document can then flow around that element. This is likely to be most
    familiar to you in the context of images. You can float an image to the right,
    and the text will flow around the image. A little padding, and you''ve got a great
    look.


    The use of floating has expanded to include float div elements, allowing for the
    use of floated boxes for navigation, or even more adventurous, the creation of
    multiple columns that can be used or without positioning in the design of various
    layouts. Z-index serves as a means to place elements along the z-axis. So far,
    I''ve discussed only the x- and y-axes, with x being horizontal and y being vertical.
    The z-axis provides the third dimension.


    Think of it this way: Hold up a deck of cards in front of you. The order in which
    the cards appear from the closest one to the farthest away is a good way to think
    of the z-index. Using it, you can literally stack elements on top of one another
    and offset them. This is somewhat useful in layouts and to create effects, but
    with the use of the z-index usually comes into play when combined with JavaScript.
    It''s an interesting aspect of CSS, so you''ll get to play with it a bit here,
    too. Okay, then—on with the show!'
  merge: -1
