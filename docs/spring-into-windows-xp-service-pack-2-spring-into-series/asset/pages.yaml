  md: '# CHAPTER 5


    # Building Forms


    Forms are an essential part of how the Web is made interactive and useful. Forms
    are interactive because a form demands that you, the user, interact with it to
    perform some task. That task might be any number of important ones:


    +   - Entering information into your online banking system so you can manage funds
    online


    +   - Submitting your name and information to become a member of an online dating
    service


    +   - Making a purchase for an airline ticket and travel services


    +   - Purchasing other goods and services online


    Without forms, we would have had none of these features available—and, in fact,
    the Web itself would never have moved along to become as efficient as it is in
    terms of providing interactive services. Other technologies are being used with
    regularity to accomplish the same things HTML forms do.


    Flash, for example, rich forms that are also very fast and update on the same
    page. This does not mean HTML forms are falling out of favor: Although Flash forms
    can be very useful for some users, they cannot be as searchable and accessible
    in the way that HTML-based forms can. So even provide an HTML alternative. Other
    technologies are beginning to emerge help make forms feature rich, but these technologies
    are preliminary, so HTML forms remain the conventional method to bring interactivity
    and functionality to websites.


    Forms are relatively easy to work with—at least, from the HTML side of things.
    The programming for the form that makes the form behave in certain ways—and programming
    forms on the server side is beyond the scope of this book.


    Here you''ll learn how to build HTML forms and make them logical and accessible.
    I will also provide resources along the way so you can become more aware of the
    options you have when it comes to server-side scripts to process the forms that
    you will build.


    Building Forms 69'
  merge: -1
  pgno: 85
- img_proc: true
  md: '# The form Element


    All forms begin with the form element:


    ```

    <form>


    </form>

    ```


    The form element has two required attributes you''ll need to add to it for the
    form to function at all:


    +   - method—This attribute defines which the form is going to communicate with
    your web server. The value options are get and post.

    - action—The action attribute provides the correct path to where the form script
    is processed (see Example 5-1).


    EXAMPLE 5-1 Adding method and action attributes and values to a form element


    ```

    <form method="get" action="http://www.myserver.com/cgi-bin/mailscript/">


    </form>

    ```


    > QUANTUM LEAP

    Youll need to check with your ISP to find out the preferred method with any form-processing
    scripts it provides. What''s more, many ISPs provide a number of form-processing
    scripts, but not all scripts will be robust as what your needs require.


    If you''re looking to create a simple contact form, you shouldn''t have any problems.
    However, if it''s a shopping cart script, for example, that''s going to require
    additional programming and customization. It''s important to point out that not
    all service providers allow you to have advanced scripts, so you''ll really need
    to do your homework- in advance to get the service you require.


    At this point, the markup you''ve created will not do anything in and of itself.
    Forms work based on the concept of controls. Controls are the default boxes and
    buttons that appear as a result of your HTML form markup.'
  merge: -1
  pgno: 86
- img_proc: true
  md: '# Adding an Input TextBox


    Input boxes are used for a number of needs, including any time you want some-one
    to type out his name, address, and so forth. To create a textbox, you use the
    input element with the type attribute and a value of text (see Example 5-2).


    **EXAMPLE 5-2** Input textboxes


    ```

    <form method="get" action="http://www.myserver.com/cgi-bin/mailscript/">


    First Name:<input type="text" /><br />

    Last Name:<input type="text" /><br />

    Phone: <input type="text" />


    </form>

    ```


    As Figure 5-1, using input with the type attribute for a text input generates
    a familiar-looking form.


    | First Name: |

    | Last Name: |

    | Phone: |


    **FIGURE 5-1** Form inputs with text.


    Of course, you can see that this isn''t exactly orderly or attractive. That we''ll
    fix with CSS later in the book, but a few technical issues need to be dealt with
    long before we get to that. Most important is to distinguish one field from another.
    The input element creates the input textbox, but you''ll want to identify each
    field first as well as modify them in terms of how they look and behave. To identify
    fields, you use a combination of name and id with associated values. This ensures
    that the form will be backward compatible and enables you to identify specific
    input areas for styling, script-, and accessibility purposes. Example 5-3 shows
    how this would work in our code sample so far.


    **EXAMPLE 5-3** Identifying text input with name and id


    ```

    <form method="get" action="http://www.myserver.com/cgi-bin/mailscript/">


    First Name: <input type="text" name="firstname" id="firstname" /><br />

    Last Name:<input type="text" name="lastname" id="lastname" /><br />

    Phone: <input type="text" name="phone" id="phone" />


    </form>

    ```'
  merge: -1
  pgno: 87
- img_proc: true
  md: 'The next step is to set the size of the textbox. Using the size attribute,
    you can provide a width for each field. You can also set the number of characters
    that the text input will accept, and this is accomplished using the maxLength
    attribute (Example 5-4).


    # ### EXAMPLE 5-4 Modifying text with size and maxLength


    ```

    <form method="get" action="http://www.myserver.com/cgi-bin/mailscript/">

    First Name: <input type="text" name="firstname" id="firstname" size="25" maxLength="0"
    /><br>

    Last Name: <input type="text" name="lastname" id="lastname" size="25" maxLength="0"
    /><br>

    Phone: <input type="text" name="phone" id="phone" size="15" maxLength="0" />

    </form>

    ```


    Wherever maxLength is set to 0, the number of characters that can be entered is
    not restricted; those that have specific integers will be limited to that number.
    Figure 5-2 shows the sized text fields, which are longer than those in 5-1.


    | First Name: | |

    | Last Name: | |

    | Phone: | |


    FIGURE 5-2 Sizing input fields and modifying character width.


    Another input that works similarly to text input is the password field. This works
    the same exact way in all aspects, except that the results are echoed back using
    asterisks (Figure 5-3).


    ```

    <input type="password" name="password" id="password" size="15" />

    ```


    | Password: | |


    FIGURE 5-3 The password input field echoes back asterisks.'
  merge: -1
  pgno: 88
- img_proc: true
  md: '# # Adding Check Boxes and Radio Buttons


    Check boxes are an excellent way to get information from a site visitor from a
    preset selection of choices. The advantage of check boxes is that visitors can
    select from more one option, and that''s the best time to use them—when the possibility
    of multiple answers exists. To create check boxes, use the input element along
    with the type attribute and a value of checkbox (see Example 5-5).


    **EXAMPLE 5-5** Adding check boxes to the form


    ```

    <p>Choose your favorite way(s) to relax:</p>

    <input type="checkbox" name="reading" id="reading"> <br />

    <input type="checkbox" name="sports" id="sports">Sports<br />

    <input type="checkbox" name="games" id="games">Computer Games<br />

    <input type="checkbox" name="tv" id="tv">Television<br />

    <input type="checkbox" name="movies" id="movies">Go to the Movies<br />

    <input type="checkbox" name="beer" id="beer">Enjoy a cold beer <br />

    <input type="checkbox" name="dogs" id="dogs">Play with the dogs<br />

    <input type="checkbox" name="music" id="music">Listen to music<br />

    <input type="checkbox" name="friends" id="friends">Meet with friends and hang
    out

    ```


    Users can make selections as they see fit (Figure 5-4).


    | [x] Reading |

    | [] Sports |

    | [] Computer Games |

    | [] Television |

    | [] Go to the Movies |

    | [] Enjoy a cold beer |

    | [] Play with the dogs |

    | [] Listen to music |

    | [x] Meet with friends and hang out |


    **FIGURE 5-4** Users can select multiple attributes from a check box list.


    You''ll notice that the name and id attributes are set to logically relate to
    the associated option, and a value attribute is included in each option as well.
    This is necessary for the check boxes to work.'
  merge: -1
  pgno: 89
- img_proc: true
  md: 'Radio buttons are similar to check boxes, in that they allow your visitor to
    make selections based on your preset options. However, in the case of radio buttons,
    the visitor is allowed to select only one option instead of one or more options.
    This is handled by using the same name value (in this case, gender) and then using
    the value attribute in radio buttons, or distinguish the options. You must use
    the value attribute in radio buttons, or the unique selection feature will not
    work (see Example 5-6).


    # EXAMPLE 5-6 Adding radio buttons to the form


    ```

    <form method="get" action="http://www.myserver.com/cgi-bin/mailscript">

    <h2>Gender:</h2>


    <input type="radio" value="female" name="gender" id="female" />Female<br />n<input
    type="radio" value="male" name="gender" id="male" />Male<br />n<input type="radio"
    value="undisclosed" name="gender" id="undisclosed" />Prefer not to say

    </form>

    ```


    Figure 5-5 shows the series of radio buttons described in Example 5-6.


    ![](img/516568206e0e220ce5a120446a34b48d_90_0.png)


    FIGURE 5-5 Choosing from a selection of radio buttons.


    Check boxes and radio buttons can be used in any combination you require to best
    address the needs of your form. The main issue is to remember that check boxes
    can be used for multiple submissions, whereas radio buttons are limited to one
    choice only.'
