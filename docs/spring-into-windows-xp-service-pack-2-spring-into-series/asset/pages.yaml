  md: '# Toward Gaining More Control...


    Certainly, beginning to explore the Box Model and understand how elements work
    when CSS is added to the mix brings you even further along the road to gaining
    more control over your designs.


    One area that I want to remind you of is having the correct document structure.
    Because of the DOTYPE switching technology mentioned early on in this book, it
    becomes imperative to ensure that you are using a correct DOTYPE, to make sure
    you don''t have problems with the Box Model in IE 6.0.


    If you''ve followed the methods in this book, you won''t need to worry about it.
    See? There really is a method to my madness!


    Next up, the holy grail of CSS: positioning. Are you ready? Let''s go!'
