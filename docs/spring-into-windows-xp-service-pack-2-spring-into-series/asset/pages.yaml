  md: "# CSS 2.1 Properties\n\nProperty: background\n\nMedia Type(s): Visual\n\nDescription:\
    \ Shorthand property for all individual background properties\n\nExample:\n\n\
    ```\nbody {\n  background: url(images/body-back.gif) #ccc 50% no-repeat;\n}\n\
    ```\n\nTips: Shorthand properties are often unique. In this case, you need to\
    \ watch order: image, color, position, repeat, and attachment. If you aren't using\
    \ all the options, just be sure to keep the integrity of the order.\n\nProperty:\
    \ background-attachment\n\nDescription: Used to manage scrolling of backgrounds\n\
    \nMedia Type(s): Visual\n\nExample:\n\n```\nbody {\n  background-attachment: scroll;\n\
    }\n```\n\nTips: A scroll value means the background scrolls with the content;\
    \ if fixed is used, the background remains fixed while the content scrolls over\
    \ it.\n\nProperty: background-color\n\nDescription: Defines a color for an element\
    \ background\n\nMedia Type(s): Visual\n\nExample:\n\n```\ndiv#content {\n  background-color:\
    \ #fff;\n}\n```"
  merge: -1
  pgno: 282
- img_proc: true
  md: "Tips: Use a background color along with a background image, and choose a color\
    \ that is close to the den end effect of the image. This will help you avoid problems\
    \ that can arise when a background image doesn't load for some reason.\n\n# Property:\
    \ background-image\n\nDescription: Specifies an image path for an element background\n\
    \nMedia Type(s): Visual\n\nExample:\n\n```\ndiv#nav {\n  background-image: url(images/nav.gif);\n\
    }\n```\n\nTips: You will sometimes see quotations around the image's path and\
    \ filename. This is not not necessary, leaving out the quotes might actually save\
    \ you a few bytes of data.\n\n# Property: background-position\n\nDescription:\
    \ Enables you to position a background image in relation to its element\n\nMedia\
    \ Type(s): Visual\n\nExample:\n\n```\ndiv#nav {\n  background-position: top left;\n\
    }\n```\n\nTips: You can position backgrounds using percentages or length value\
    \ keywords (top, right, center, bottom, left). If only one value is given, it\
    \ sets the horizontal position only. If both values are provided, the horizontal\
    \ value is first in the order. You can use negative position percentage values.\n\
    \n# Property: background-repeat\n\nDescription: Describes the way a background\
    \ image repeats or does not repeat\n\nMedia Type(s): Visual"
  merge: -1
  pgno: 283
- img_proc: true
  md: "Example:\n\n```\ndiv#content {\n  background-repeat: repeat-x;\n}\n```\n\n\
    **Tips:** Once upon a time, all backgrounds simply tiled into the main body. Now\
    \ you can control tiling within an element, tile the image completely, tile only\
    \ along the x- or y-axis, or not tile at all.\n\n**Property:** border\n\n**Description:**\
    \ Shorthand property that enables you to apply width, style, and color to all\
    \ four sides of an element box\n\n**Media Type(s):** Visual\n\nExample:\n\n```\n\
    blockquote {\n  border: 1px dotted red;\n}\n```\n\n**Tips:** Using the border\
    \ property to help outline elements can be very helpful for diagnostics, as well\
    \ as provide a nice design option for the element's presentation. You cannot set\
    \ four different sides using this shorthand property; you need to specify the\
    \ longhand, individual sides to do.\n\n**Property:** border-collapse\n\n**Description:**\
    \ Defines the border model for table borders. A value of separate enables you\
    \ to display cell borders separately; a value of collapse sets the collapsing\
    \ border model.\n\n**Media Type(s):** Visual\n\nExample:\n\n```\n#table01 {\n\
    \  border-collapse: separate;\n}\n```\n\n**Tips:** The model you choose to display\
    \ table borders is wholly an aesthetic choice."
