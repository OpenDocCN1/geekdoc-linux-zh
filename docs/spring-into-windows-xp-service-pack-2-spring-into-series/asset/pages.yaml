  md: "# Adding Scripts\n\nAnother means of bringing interactivity and interest to\
    \ your pages is adding scripts to them. Typically, this refers to JavaScript or\
    \ what is known as Dynamic HTML or DHTML, which is a combination of technologies,\
    \ including HTML, CSS, JavaScript, and the Document Object Model. Combining these\
    \ technologies gives you rich features as drop-down menus and interactive games.\n\
    \n# QUANTUM LEAP: THE DOCUMENT OBJECT MODEL\n\nThe Document Object Model, also\
    \ referred to as the DOM, is the interface within browsers that enables you attach\
    \ scripting to specific elements. Part of the reason DHTML has been controversial\
    \ and problematic is that browsers have implemented nonstandard DOMs, which have\
    \ resulted in poor consistency. When you are looking for HTML scripts, be sure\
    \ you are using those scripts that offer the most cross-browser support. The DOM\
    \ is standardized, and all contemporary, standards-based browsers are using to\
    \ implement DOM standards efficiently.\n\nYou can add scripts to your document\
    \ in two primary ways. One is to place the script into the head portion of your\
    \ document. This is referred to as an embedded script. The other way is to place\
    \ your script external to the document, which is referred to as a linked script.\n\
    \n# Embedding a Script\n\nTo embed a JavaScript in the head portion of your document,\
    \ you use the script element to contain the script (see Example 3-9).\n\n# EXAMPLE\
    \ 3-9 Embedding a script into the head of a document\n\n```\n<head>\n  <script\
    \ type=\"text/javascript\">\n    function newWindow() {window.open(\"images/photo.jpg\"\
    ,\n      \"foodwin\", \"width=250,height=188\")\n  }\n</script>\n</head>\n```\n\
    \nThe purpose of this script is to set up the document to open the image photo.jpg\
    \ in a new window when a specific link is clicked. You also need a bit of script\
    \ in the actual link found in the document, as follows:\n\n```\n<a href=\"javascript:newWindow()\"\
    >Delicious Vietnamese Lunch</a>\n```"
  merge: -1
