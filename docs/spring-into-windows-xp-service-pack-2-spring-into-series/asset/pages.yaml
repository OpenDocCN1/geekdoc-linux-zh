  md: '# # Sizing Fonts


    In this section, you''ll learn to size fonts using the font-size property along
    with an absolute, relative, length, or percentage value.


    # ## Absolute and Relative Keywords


    Absolute keywords size based on the way that the browser computes their size.
    The keywords available are xx-small, x-small, small, medium, large, x-large, and
    xx-large. Here, I''ve applied an absolute keyword to paragraph text:


    ```

    p (font-size: medium);

    ```


    The medium size is typically equivalent to the browser''s default size for that
    element. Figure 9-3 shows all the keywords as applied to default browser text.


    ![](img/516568206e0e220ce5a120446a34b48d_160_0.png)


    **Figure 9-3** Absolute keyword sizing within a web browser.


    Where absolute are dependent on the browser''s computation of fonts, the relative
    keywords of larger and smaller relate to the size of the parent. So, if I set
    my body font size to medium, I can use the relative keyword of larger to change
    the size to large, or smaller to change the size to small. Just remember that
    relative keywords always relate to an already defined size, whether it is defined
    by a keyword, or percentage value.


    # ## Length Values


    Length values are used with many properties. They include three relative and five
    absolute values. Relative values are em, ex, and px; absolute values are pt, pc,
    in, mm, and cm. Absolute values should not be used for the screen, although they
    are useful when creating print styles.


    The most used length values for type are pixels and em because, technically, both
    are scalable, which is appropriate for screen. There''s a major problem however:
    Microsoft Internet Explorer for Windows does not scale pixels. This is a terrible
    oversight that has caused real problems, especially because you want to offer
    your vision-impaired users scalable sizing. Compare the values on the left to
    the right, where I''ve bumped up the browser text (in IE, View > Text Size) from
    its default size of medium to larger (see Figure 9-4).'
  merge: -1
  pgno: 160
- img_proc: true
  md: 'Figure 9-4 Comparing font sizes in Internet Explorer 6.0.


    You''ll note that the em values scale, but the pixels and points do not. The pixels
    should scale—and they do in browsers with correct font-sizing support. The points
    (which I advise you not to use for screen) remain the same size because they are
    absolute values, meaning they should never scale. As a result, many web designers
    advocate the use of ems over pixels. You''ll note, however, the teen text on the
    left can also cause serious problems if people have their browsers set to a smaller
    font size than medium.


    # Percentages


    Percentage values in font sizing are always relative to another value, such as
    a keyword or length value. So, if I set my body font size to 1em and set my h1
    header to 150%, I''ll end up with a larger h1 than the body font size, which is
    relative to the browser default:


    ```

    body {font-size: 1em;}

    h1 {font-size: 150%}

    ```


    Percentages are particularly helpful in working around result limitations in font
    sizing. The reason is that percentages are also scalable. As a result, many workarounds
    for the pixel problem in IE have been achieved by combining ems and percentages.
    Still, many designers prefer to go with pixels because of their more consistent
    rendering, at the cost of better accessibility.


    # NOTE


    You''ll use a variety of sizing options throughout this book, to get the hang
    of it. For more information on font sizing problems, see Owen Briggs'' article
    "Text Sizing." at http://www.thenoodleincident.com/tutorials/box_lesson/font/index.html.'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# Font Weight and Style


    Whew! That was a lot of detail for a book that''s supposed to be straightforward.
    But to be fair to you and ensure that you''ve got a solid foundation, I had to
    do it. Now let''s get with the show!


    Along with their family and size, fonts can have weight and style. Font weight
    refers to how bold (or not bold) a font is. Font style refers to different faces
    that might exist within a given family.


    # Font Weight


    Defining the weight of the font is done by using the font-weight property combined
    with an associated value. Values for numeric (100-900, where 100 is very light,
    900 is the darkest, and 400 is normal), the keyword normal (corresponding to a
    weight of 400), the keyword bold (equivalent to a weight of 700), the keyword
    bolder (specifies the next bolder), and the keyword lighter (specifies the next
    lighter)


    Example 9-2 shows a style sheet with a variety of weights applied.


    EXAMPLE 9-2 Styles describing font family, size, and weight


    ```

    body (font-family: Georgia, Times, serif; font-size: 1em; font-weight: normal);

    h1, h2 [font-family: Arial, Helvetica, sans-serif];

    h1 (font-size: 150%; font-weight: bold);

    h2 (font-size: 130%; font-weight: lighter);

    .accent [font-weight: 700];

    ```


    Figure 9-5 shows the text used earlier in the chapter with these styles applied.


    ![](img/516568206e0e220ce5a120446a34b48d_162_0.png)


    FIGURE 9-5 Applying weight to the body, headers, and an accent class.'
  merge: -1
  pgno: 162
- img_proc: true
  md: 'NOTE

    The use of numeric values 100 to 900 is not well supported. It''s a good rule
    of thumb to use only those number values that correspond directly to a known weight—for
    example, 400 for normal, 700 for bold.


    # Font Style


    Font styles help alter the face. To apply a font style, you use the font-style
    property with a value of normal, italic, or oblique.


    The normal value is used only when you''re specifically concerned about text being
    rendered in its normal weight. Otherwise, it''s the default and unnecessary to
    use.


    Oblique faces are slanted faces that are appropriate for electronic text. The
    oblique value is truly useful when one has an oblique face resident on a user''s
    computer, which doesn''t apply to the majority of fonts with which you will be
    working. If there is no oblique face for the font, the font will appear as italic.


    The italic value italicizes the face. Bottom line? Your best value for the font-style
    property will be italic in almost all cases (see Example 9-3).


    # EXAMPLE 9-3 Describing font family, size, weight, and style


    ```

    body(font-family: Georgia, Times, serif; font-size: 1em; font-weight: normal);

    h1, h2 (font-family: Arial, Helvetica, sans-serif);

    h1 (font-size: 150%; font-weight: bold);

    h2 (font-size: 130%; font-weight: lighter; **font-style: italic**)

    accent (font-weight: 700);

