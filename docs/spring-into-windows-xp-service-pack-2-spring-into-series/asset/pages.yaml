  md: 'Another important concept when working with CSS positioning is the containing
    block. A containing block is any parent block box to the element you''re trying
    to position. Consider Example 12-2.


    # EXAMPLE 12-2 Understanding containing blocks


    ```

    <div id="content">

    <h1>The Black Cat</h1>

    <h2>By Edgar Allan Poe</h2>


    <p>I married early, and was a <a href="http://www.poemuseum.org/">happy to find</a>
    in my wife a disposition uncongenial with my own. Observing my partiality for
    domestic pets, she lost no opportunity of procuring those of the most agreeable
    kind. We had birds, gold fish, a fine dog, rabbits, a small monkey, and a cat.</p>


    <p>This latter was a <a href="http://www.poemuseum.org/">remarkably</a> large
    and beautiful animal, entirely black, and sagacious to an astonishing degree.
    In speaking of his intelligence, my wife, who at heart was not a little tinted
    with superstition, made frequent allusion to the ancient popular notion, which
    regarded all black cats as witches in disguise. Not that she was ever serious
    upon this point - and I mention the matter at all for no reason other than it
    happens, just now, to be remembered.</p>

    </div>

    ```


    As you see, I''ve placed all the content into a div element, which I''ve given
    an id of content (how''s that for brilliant?) All blocks within the div are now
    contained by the div.


    Suppose you went a step further and placed a container around the content:


    ```

    <div id="main">

    <div id="content">

    ...

    </div>

    </div>

    ```


    The content div is now contained by the main div, which becomes the content div''s
    containing box.


    That''s pretty simple so far, I think. But if you''re having trouble visualizing
    this, think about those lacquered Chinese boxes that nest one inside inside the
    other. The largest box contains the middle box, which contains the small box.
    So, the small box''s containing box is the middle box, whose containing box is
    the large box.'
  merge: -1
  pgno: 213
- img_proc: true
  md: 'It’s important to understand this concept because when you begin to use positioning,
    the containing block of an element have a lot to do with how the element or elements
    it contains actually positioned.


    Step back for a moment to Example 12-1. There''s no obvious containing block,
    is there? Will you be surprised if I tell you there''s still a containing block?
    Here''s how it works: If there is no specified containing block, the containing
    block is the root element. We know that the root element is html, that''s the
    containing block.


    # QUANTUM LEAP: BROWSER DEFAULTS


    Why does it matter html that it is the containing block when no other is specified?
    In the sense of positioning, it matters because there are default styles for many
    elements, including html. I discussed this bit in Chapter 7, “Using CSS.” Each
    browser has a default style sheet so that if you do not apply styles, some styling
    will still occur. This is why, without style, headers, paragraphs, links, and
    more still have a font, font size and weight. When working with positioning, it
    is going to look as if certain boxes are positioned in relation to the browser
    edges (also known as chrome). In reality, the positioning of uncertain blocks
    is due to the default styles given to the html element.


    For Figure 12-3, I styled the html element to have a 2-pixel border. You can see
    how different browsers interpret the html element.


    ![](img/516568206e0e220ce5a120446a34b48d_214_0.png)


    FIGURE 12-3 From left to right: Firefox, Opera, and Internet Explorer 6.0–note
    how Firefox and Opera interpret the html element and its styled borders within
    the document, where in IE, the bottom and left portions of the element include
    portions of the browser such as the scrollbar.


    IE’s implementation is quirky, although not incorrect, because implementing containing
    blocks. The specs are not very clear regarding how browsers should implement blocks.
    That is the more reason to understand the why of positioning as well as the application
    of positioning.


    198 Positioning, Floats, and Z-index > Containing Blocks'
  merge: -1
