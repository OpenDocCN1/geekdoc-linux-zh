  md: '# Just Like a Pro...


    If it''s taking a bit of time to get the concepts in this chapter down, please
    don''t fret. These are some of the most complicated, confusing, and challenging
    aspects of CSS.


    There''s really no way to comfort you if you are having a bit of trouble, other
    than to say that you must give it time. No one learns this stuff overnight—and
    if you have, well, you''re ready for prime time!


    It takes constant practice and play to really get the hang of working with positioning;
    it''s simply part of the nature of the CSS beast.


    Of course, the rewards are richly worth it. As you''ll find out in the next chapter,
    everything in this chapter will come together—at least, conceptually—when you
    begin to study layouts. After that, you''ll want to practice, practice, practice
    to really get your skills as finely honed as a pro''s.'
