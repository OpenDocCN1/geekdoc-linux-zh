  md: '# Aligning Text


    Back in the days of presentational HTML, text was aligned using the align attribute
    and a corresponding justification value. CSS uses the exact same premise, but,
    of course, it’s done outside the HTML using the text-align property. The values
    are the same and should be familiar to anyone who’s ever used a word processor:


    +   - left—Also referred to as a ragged right, left justification sets the text
    left with lines breaking right. This is default behavior for all browsers and
    is the preference for all body text. text-align: left;

    - center—This centers the text. Centered text is useful for styling headers, captions,
    and other accent text. It is very difficult to read long sections of centered
    text, so it’s not best to use for body text. text-align: center;

    - right—This places all text flush right, leaving a ragged left edge. text-align:
    right;

    - justify—Justifying means having the left and right edges are equally flush.
    This is done by calculating words and spacing within the available line length.
    It is commonly seen in print newspapers and magazines. But most people avoid it
    because the spacing can appear to be very awkward and, therefore, more difficult
    to read. text-align: justify;


    Figure 9-8 compares a paragraph with each alignment option applied.


    | This latter was a | This latter was a | This latter was a | This latter was
    a |

    | --- | --- | --- | --- |

    | remarkably large an | remarkably large and | remarkably large and | remarkably
    large and |

    | beautiful animal, | beautiful animal, | beautiful animal, | beautiful animal,
    |

    | entirely black, and | entirely black, and | entirely black, and | entirely black,
    and |

    | sagacious to an | sagacious to an | sagacious to an | sagacious to an |

    | astonishing degree. | astonishing degree. | astonishing degree. | astonishing
    degree. |


    FIGURE 9-8 center, right, and justified text.'
