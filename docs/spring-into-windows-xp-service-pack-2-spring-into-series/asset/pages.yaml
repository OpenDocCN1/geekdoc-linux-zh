  md: '# Using Padding


    Padding enables you to style the space that lies between the content and its border.
    In this chapter''s previous examples, you''ll notice elements that are flush against
    their borders and margins. Padding helps to solve this issue. You can add padding
    to an individual side using length values such as pixels or percentages. The individual
    padding properties are padding-top, padding-right, padding-bottom, and padding-left.
    You can see each of these in Example 11-5.


    EXAMPLE 11-5 Using padding to add whitespace


    ```

    body (font: 14px Verdana, Arial, Helvetica, sans-serif; color: white; background-color:
    black; margin-top: 10px);

    h1 (font: 24px; color: orange; border-bottom: 2px dotted lime; padding-bottom:
    10px);

    h2 (font: italic 20px Georgia, Times; color: #ccc; text-indent: 15px; border:
    solid orange; padding-top: 15px; padding-right: 30px; padding-bottom: 0; padding-left:
    30px);

    ```


    You''ll notice the padding separating the h1 text from its border, and the padding
    to the top, right, and left of the paragraph (see Figure 11-8).


    ![](img/516568206e0e220ce5a120446a34b48d_206_0.png)


    FIGURE 11-8 Adding padding to gain whitespace.'
  merge: -1
  pgno: 206
- img_proc: true
  md: '# Padding Shorthand


    You can use shorthand with padding, too, using the padding property. Shorthand
    for padding most closely resembles the way margin shorthand is managed.


    This means that order is imperative, and you''ll run into TRouble really quickly
    if you don''t remember that! You must place your values in the top, right, bottom,
    left order for them to work:


    ```

    p {padding: 15px 30px 25px 0px};

    ```


    This rule results in a paragraph with 15 pixels of padding to the top, 30 pixels
    to the right, 25 pixels to the bottom, and 0 pixels to the left (see Figure 11-9).


    ![](img/516568206e0e220ce5a120446a34b48d_207_0.png)


    FIGURE 11-9 Using the padding shorthand property to manage the padding of the
    paragraph.


    You can also use combinations of two and three values, which work the same way
    as described for margin shorthand earlier this chapter. Finally, a single value
    applies to all four sides of the element''s box.'
