  md: '# Working with Text Areas


    In some instances, you want to provide an area for feedback or input that is more
    flexible than just a text input control, which supports only one line of text.
    Text areas are the perfect solution.


    Text areas are created using the textarea element along with the rows and cols
    attributes to determine a visible field. Unlike tables, rows and columns in the
    instance of text areas define how the text is managed. Rows determine how many
    rows of text the resulting box will allow, and columns define how the box is (see
    Example 5-9).


    EXAMPLE 5-9 Creating a text area


    ```

    <form method="get" action="http://www.myserver.com/cgi-bin/mailscript/">


    <p>Please let know if you have any special requests:</p>


    <textarea rows="10" cols="25"></textarea>


    </form>

    ```


    The resulting text area will have 10 rows and 25 columns (see Figure 5-10). I''ve
    added some text so you can see how it will appear when a visitor types text into
    the text area.


    ![](img/516568206e0e220ce5a120446a34b48d_94_0.png)


    Figure 5-10 Text areas make it easy for visitors to input additional comments
    without the restrictions of checkboxes, check boxes, radio buttons, or menus.


    You can customize text areas a little more within the HTML, too. First, you might
    want to add the name attribute, which provides information that can be used by
    your form submission script to clarify its function.'
  merge: -1
  pgno: 94
- img_proc: true
  md: 'Additionally, you can add an id attribute so you can attach scripts to the
    text area, if you so desire (see Example 5-10).


    # EXAMPLE 5-10 Text area with name and id attributes


