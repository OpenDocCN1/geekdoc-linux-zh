  md: "# Z-index\n\nThe z-index creates the dimensional axis upon which you can \"\
    stack\" and overlap items. This comes in handy in positioning because you can\
    \ use it to determine which boxes come to the foreground and which ones will flow\
    \ behind browser resize. Other uses for the z-index relate mostly to DHTML, in\
    \ which elements are scripted for dynamic purposes such as when creating animations\
    \ or games.\n\nExample 12-10 shows three boxes, absolutely positioned to overlap\
    \ one another and styled in such a way that you can visualize the stacking order.\n\
    \nEXAMPLE 12-10 Z-index with positioned boxes\n\n```\n#box1 {\n  position: absolute;\n\
    \  top: 10px;\n  left: 10px;\n  background: #000;\n  width: 300px;\n  height:\
    \ 200px;\n  z-index: 1;\n}\n\n#box2 {\n  position: absolute;\n  top: 20px;\n \
    \ left: 20px;\n  background: #999;\n  width: 300px;\n  height: 200px;\n  z-index:\
    \ 2;\n}\n\n#box3 {\n  position: absolute;\n  top: 30px;\n  left: 30px;\n  background:\
    \ #ccc;\n  width: 300px;\n  height: 200px;\n  z-index: 3;\n}\n```"
