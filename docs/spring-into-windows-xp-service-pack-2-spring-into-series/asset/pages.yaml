  md: "# Styling Links Using Descendant Selectors\n\nOf course, a lot of classes means\
    \ not only writing more CSS rules, but also adding numerous class attributes to\
    \ the HTML. If you have a lot of content to style and you rely too much on classes,\
    \ it'll result in industry specialists refer to as \"class-it is,\" the overuse\
    \ of classes. You can avoid this by tapping into other kinds of selectors.\n\n\
    Elements can be uniquely identified using what's known as an ID selector. These\
    \ selectors start off with an octothorpe for a custom name—very similar to what\
    \ you do when creating a class:\n\n```\n#id-name\n```\n\nNOTE\n\nThe difference\
    \ between class and ID selectors is a critical one. Class selectors can be used\
    \ as many times in a document as you desire, whereas an ID can be used only once\
    \ per document. Therefore, IDs are particularly useful when identifying unique\
    \ divisions of a document, such as navigation, content, masthead, and footer.\
    \ You'll see this work great deal in upcoming chapters, particularly when we get\
    \ into CSS layouts.\n\nAfter a division is identified, you can tap into descendant\
    \ selectors. These selectors select based on the parent element. First you use\
    \ the selector for the parent, then a space, and then the element you want to\
    \ pass the styles along: #nav a. This declaration selects any child anchor of\
    \ the parent element identified as nav. Example 10-5 shows this work in the context\
    \ of multiple linking.\n\nEXAMPLE 10-5 Multiple links using ID and descendant\
    \ selectors\n\n```\n<DOCTYPE html PUBLIC \"//W3C//DTD HTML 1.0 Transitional//EN\"\
    \n   \"http://www.w3.org/TR/html1/DTD/html1-transitional.dtd\">\n<html lang=\"\
    http://www.w3.org/1999/html\">\n<head>\n<title>working with style</title>\n<style\
    \ type=\"css\">\nbody (font: 14px Georgia, Times, serif; color: white; background-color:\
    \ black);\nh1 (font: 22px Arial, Helvetica, sans-serif; color: orange; text-decoration:\
    \ underline;)\nh2 (font: italic 20px Georgia, Times, serif; color: #ccc; background-color:\
    \ black;\ntext-transform: lowercase;)\n/* link defaults */\na (color: orange;\
    \ text-decoration: none);\na:link (color: orange);\na:visited (color: yellow;)\n\
    a:hover (color: fuchsia; text-decoration: underline;)\na:active (color: red);\n\
    ```\n\nLink Effects, Lists, and Navigation > Styling Links Using Descendant Selectors\
    \ 167"
