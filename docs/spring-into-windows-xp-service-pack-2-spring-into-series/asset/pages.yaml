- img_proc: true
  md: "# Creating a Linked Style Sheet\n\nTo truly tap into the power of CSS, you'll\
    \ be using linked style sheets the majority of the time. A linked style sheet\
    \ is a separate text file into which you place all your CSS rules (but not any\
    \ HTML) and is named using the .css suffix. You link any HTML file you want to\
    \ have affected by that style sheet using the link element in the header portion\
    \ of the document.\n\nExample 7-2 shows a style sheet ready for linking. In it,\
    \ I provide a range of style rules and then saved the file to my local folder,\
    \ naming the file styles.css.\n\n**EXAMPLE 7-2** A style sheet ready for linking\n\
    \n```\nbody {\n  background-color: #999;\n  color: black;\n}\n\nh1 {\n  font-family:\
    \ Verdana;\n  font-size: 24px;\n  color: #ccc;\n}\n\np {\n  font-family: Georgia;\n\
    \  font-size: 12px;\n  color: white;\n}\n```\n\nIn Example 7-3, you'll find the\
    \ complete HTML along with the required link to the style sheet within the same\
    \ directory.\n\n**EXAMPLE 7-3** The HTML for the style sheet\n\n```\n<!DOCTYPE\
    \ html PUBLIC \"//W3C//DTD XHTML 1.0 Transitional//EN\"\n\"http://www.w3.org/TR/xhtml11/DTD/xhtml11-transitional.dtd\"\
    >\n\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n  <title>working with\
    \ style</title>\n\n  <link rel=\"stylesheet\" type=\"text/css\" href=\"styles.css\"\
    \ media=\"all\" />\n</head>\n<body>\n  <h1>Welcome!</h1>\n</body>\n```"
  merge: -1
