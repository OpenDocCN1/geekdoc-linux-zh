  md: "# Wonderful Inline Frames\n\nOriginally introduced by Internet Explorer 3.0,\
    \ iframes, inline or floating frames, were officially adopted in HTML 4.0. This\
    \ is good news because they're very effective when put to appropriate use. The\
    \ bad news is they aren't supported by Netscape 4.61 and many other browsers.\
    \ Netscape 6.0+ does inline frame support.\n\nIframes work a bit differently from\
    \ standard frames. First, you don't create a separate frameset for the frame.\
    \ You place the iframe information directly inline in any regular page.\n\nIframes\
    \ are extremely handy in terms of being able to update specific windows within\
    \ a browser. They are often used to manage web advertisements, which are often\
    \ delivered from another server and updated regularly. This means the main HTML\
    \ page never gets touched—just the remote page does.\n\n> NOTE\nYou aren't limited\
    \ to just HTML pages. You can link to any kind of source in an iframe, including\
    \ images and multimedia objects.\n\nInline frames can be placed anywhere on a\
    \ page. Unlike standard frames, they do not require a frameset. As standard frames,\
    \ iframes do require an additional page—in this case text.html, to work (see Example\
    \ 6-14).\n\n# EXAMPLE 6-14 Inline frames\n\n```\n<DOCTYPE html PUBLIC \"//W3C//DTD\
    \ XHTML 1.0 Transitional//EN\"\n  \"http://www.w3.org/TR/xhtml1/DTD/loose.dtd\"\
    >\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n\n<head>\n  <title>Inline Frames</title>\n\
    </head>\n\n<body>\n  <iframe width=\"350\" height=\"200\" src=\"text.html\" scrolling=\"\
    auto\" frameborder=\"1\">\n</iframe>\n</body>\n</html>\n```"
  merge: -1
  pgno: 119
- img_proc: true
  md: 'The browser will draw the iframe to your specifications. Here, I''ve got set
    it to a width of 350 pixels and a height of 200 pixels, with automatic scrolling
    and a frame border of 1 to help you visualize the results.


    # NOTE


    I like to think of iframes a lot like images or objects. They really do in a very
    similar way: The browser draws the area and then inserts the object—in this case,
    another HTML file—into the drawn area.


    Figure 6-10 shows the results.


    ![](img/516568206e0e220ce5a120446a34b48d_120_0.png)


    FIGURE 6-10 iframe in Mozilla.


    # NOTE


    Frames have backward-compatibility issues. All modern browsers implement them,
    but older browser might not have support. Usually in those instances, the iframe
    is completely ignored. There is no method as `noframes` for iframes, either. So,
    although their use is often very convenient, you''ll want to limit it to instances
    in which you do not have to support older web browsers.


    Working with Frames > Wonderful Inline Frames'
