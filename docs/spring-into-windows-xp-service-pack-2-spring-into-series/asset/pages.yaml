    > Pluto—this was the cat''s name—was my favorite pet and playmate. I alone fed
    him, and he attended me wherever I went about the house. It was even with difficulty
    that I could prevent him from following me through the streets.


    **FIGURE 12-8** A relative positioned box—note that the offsets relate to the
    normal flow, not any other element.


    So, the box is offset 10 pixels from the earlier element box and 45 pixels to
    the left of the flow—exactly the same place where the text begins it''s in the
    normal flow, too. You see that the flow is uninterrupted by the positioning; the
    ensuing content flows as it should both before and after the relatively positioned
    box.


    **NOTE**\Relative positioning is used when the normal flow shouldn''t be broken.
    Absolute positioning is used for items that have to be positioned very specifically.
    Often the two are combined, such as having a relatively positioned div with an
    absolutely div contained within it, or vice versa. You''ll see more of this in
    action in Chapter 13, "CSS Layouts."'
