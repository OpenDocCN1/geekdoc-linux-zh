  md: '# Using Margins


    Margins are commonly styled to control the space between elements. You''ll noticed
    that there''s always a certain amount of space, by default, around content displayed
    in web browsers (visible in Figure 11-1). This can be controlled by changing the
    margin values in the body element (see Example 11-1).


    EXAMPLE 11-1 Setting margin values for the body element


    ```

    body (font: 14px, Helvetica, sans-serif; color: white; background-color: black;
    margin-top: 0; margin-left: 0; border: 2px solid white);

    h1 (font-size: 24px; color: orange);

    h2 (font: italic 20px Georgia, Times, serif; color: #999; text-indent: 15px);

    ```


    > NOTE

    You''ll see that I have no length value as px or em my 0. That''s a 0 value requires
    no length; the meaning is implicit.


    By setting the top and left margins to 0 in the body, the entire body element
    shifts, along with its children elements (see Figure 11-3).


    ![](img/516568206e0e220ce5a120446a34b48d_199_0.png)


    FIGURE 11-3 Zeroing the body margins to the top and left-notice the white border
    surrounding the body element and how it flushes to the top and left of the viewport.


    Check Out 11-3 and notice how all the children elements are now flush left, with
    the exception of the h2, which has a text-indent property set to 15 pixels. But
    the h1 and paragraph elements, both of the body with no other identified margins,
    are flush left and flush top. Or are they? What''s the space between the h1 and
    the outline of the body element? Although the element is obviously flush top,
    the h1 is not. This is because Mozilla browsers expect a top margin value of 0
    for the first element if you want it to be flush with the containing element''s
    top margin. In Internet Explorer, this expectation is ignored and the same style
    results in the h1 also being left and top.'
