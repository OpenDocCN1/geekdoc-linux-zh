  md: '# Adding width and height Values


    The next thing you''ll want to do for your image is add width and height values.
    This actually assists browsers in rendering images more efficiently, so it''s
    always a good idea to add this information.


    You can find the image''s width and height in a couple ways. The first way is
    that you can look for it in your imaging editor (see Figure 3-2).


    Another way to find width and height is to open the image itself in your browser.


    Figure 3-3 depicts the image itself (not the HTML file), and you can see in the
    title bar that the width and height are displayed.


    ![](img/516568206e0e220ce5a120446a34b48d_50_0.png)


    **Figure 3-2** Look for the width and height in pixels for your image—here, Photoshop
    displays the width and height at the top of the Image Size dialog box.


    **FIGURE 3-3** opened the image in my browser, and the image width and height
    appear within the browser''s title bar.


    > NOTE

    All browsers have this feature, but most common ones do.


    When you''ve got the image dimensions—in this case, 250 pixels wide by 188 pixels
    high—you can place it into your image markup:

    <img src="photo.jpg" width="250" height="188" />


    > NOTE

    You should always include the correct width and height. If the width and height
    values are larger than the actual image, the browser will stretch the image to
    make it fit. If you note smaller values, the browser will squeeze the image into
    the smaller size, scrunching it up.


    Adding Images, Media, and Scripts > Adding width and height Values'
  merge: -1
  pgno: 50
- img_proc: true
  md: '# # Providing Alternative Text


    Some people surf the Web without images turned on. Sounds strange in today''s
    world of high bandwidth, but some people still don''t have high-speed access,
    so images can slow down their access to your page content, and they will disable
    the images. Another important concern is that many people visiting the Web are
    visually impaired or blind. In all these cases, it''s helpful to provide some
    clues to your visitor as to what the image represents.


    This is done using alternative text, which uses the alt attribute and a description,
    as shown in Example 3-2.


    +   * EXAMPLE 3-2 Adding an alt text description


    ```

    <img src="photo.jpg" width="250" height="188" alt="photograph of a delicious Vietnamese
    noodle dish from restaurant Pho 88" />

    ```


    Alternative descriptions appear in two ways. The first, they appear in the location
    of the image after the load and when images are disabled (see Figure 3-4).


    ![](img/516568206e0e220ce5a120446a34b48d_51_0.png)


    FIGURE 3-4 Alternative text in a browser where images are disabled.


    The second alternative text appears upon mouseover of an image. This assists everyone
    because it provides more contextual clues on the image''s purpose (see Figure
    3-5).


    ![](img/516568206e0e220ce5a120446a34b48d_51_1.png)


    FIGURE 3-5 Alternative text in a ToolTip as the mouse passes over the image.'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Linking the Image


    Many times you will want to link an image to either another HTML document or a
    detailed version of the image. In either case, linking an image works the same
    as linking text. You surround the image code with the anchor element and the reference
    to where the image is linking, just as if it were the text content (see Example
    3-3).


    **Example 3-3** Linking the image


    ```

    <a href="detail.html">

    <img src="images/photo.jpg" width="250" height="188" alt="photograph of a delicious
    Vietnamese noodle dish from restaurant Pho 88" />

    </a>

    ```


    The image is now linked, and when clicked on, it will take the visitor to the
    detail.html page. You can even add a title attribute to the link if you want further
    details about the link to be available to your visitors. By default, browsers
    place a border around the image to highlight that it is a linked image, and the
    hand cursor appears upon mouseover, too (see Figure 3-6).


    ![](img/516568206e0e220ce5a120446a34b48d_52_0.png)


    **FIGURE 3-6** A linked image.'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'If the image link is followed, the browser will use the default visited link
    color around the image. Of course, many people find the link border unsightly.
    If you''d like to get rid of your border immediately, you can do so by turning
    it off directly in the HTML, as shown in Example 3-4.


    # EXAMPLE 3-4 Using the border attribute


    ```

    <a href="detail.html">

    <img src="images/photo.jpg" width="250" height="188" alt="photograph of a

    delicious Vietnamese dish from restaurant Pho 88 border="0" />

    </a>

    ```


    The image, while still linked, now displays no border (see Figure 3-7).


    ![](img/516568206e0e220ce5a120446a34b48d_53_0.png)


    FIGURE 3-7 The image, while still linked, has no visible border.


    > Beware: Borders Are Presentational

    The border attribute is considered presentational because it can be used decora-t.
    By providing a value greater than 0, the border size changes, whether the image
    is linked or not. Ideally, you will use CSS instead of the border attribute to
    modify your borders. CSS will also be used to position or float the image within
    its content. You''ll learn more about this in Chapter 11, "Margins, Borders, and
    Padding," and Chapter 12, "Positioning, Floats, and Z-index."'
  merge: -1
