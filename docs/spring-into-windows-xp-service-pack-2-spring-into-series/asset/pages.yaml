  md: '# Time to Put Your Imagination to Work!


    If you''re thinking at this point that working with markup and CSS is no play,
    well, your frustration is well founded. It''s imperative that you get the complexities
    down, and I assure you that if you''ve made it through thus far, you''re grasping
    complex ideas.


    But no doubt you want to put those ideas to work and really get a feel for how
    to use CSS to make things look good. After all, that''s what I keep promising,
    right?


    Fortunately, the next chapter sets you up for a little fun: putting your imagination
    to work.


    You''ll be using images and color to spruce up your documents, and exploring the
    fine control that CSS offers you when it comes to working with imagery and color
    in your designs.'
  merge: -1
