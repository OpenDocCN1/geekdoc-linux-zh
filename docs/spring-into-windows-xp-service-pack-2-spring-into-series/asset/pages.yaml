  md: '# Using Negative Margins


    You can use negative values with margins. This practice is helpful to achieve
    certain design needs, but it should be used with relative caution because browsers
    handle negative margins inconsistently.


    Typically, negative margins are used to make visual adjustments, to manage workarounds
    for centering liquid designs in layout, or to offset specific elements outside
    the box in which they are contained (Example 11-3).


    EXAMPLE 11-3 Using margins to override a containing element


    ```

    body (font: 14px Verdana, Arial, Helvetica, sans-serif; color: white; background-color:
    black; margin-top: 30px; margin-right: 30px; margin-bottom: 30px; margin-left:
    130px; border: 2px solid white);

    p(margin-left: -65px; margin-top: 5px; margin-bottom: 0);

    ```


    Now the paragraphs are offset to the left margin (see Figure 11-5).


    ![](img/516568206e0e220ce5a120446a34b48d_201_0.png)


    FIGURE 11-5 Using margins to override a containing block—in this case, the body
    element.


    > QUANTUM LEAP: NEGATIVE MARGIN SOLUTIONS FOR DESIGNERS


    If you''re interested using negative margins to solve some design issues, there
    are some terrific articles on the Web to help you out. "Creating Layouts with
    Negative Margins," by Ryan Brill, is terrific—read it now or hold ''til you need
    the next two chapters (see http://www.alistapart.com/articles/negativemargins/).
    You can center elements using negative margins, as described by Rob Chandanai
    at http://www.bluerobot.com/web/css/center2.html. With so many issues in CSS,
    the we browsers implement a property differs. Negative margins fall into this
    category because they are interpreted by different browsers. So use with care—and,
    as a good rule of thumb, if there''s an easier way to accomplish the end result,
    use it.


    ![](img/516568206e0e220ce5a120446a34b48d_201_1.png)'
