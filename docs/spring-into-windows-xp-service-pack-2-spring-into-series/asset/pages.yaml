  md: '# XHTML 1.0 Annotated Reference


    The following appendix covers all elements in the XHTML 1.0 Transitional DTD.
    Note that many of these elements are presentational in nature and have been removed
    from the Strict DTD. Notes on support and best practices are included for each
    element.


    # Key to Element Types: Display


    Block: A block-level element is one that creates a block box by default. All subsequent
    elements will appear on the next line.


    Inline: An inline element is one that creates a line box and doesn''t break the
    line.


    Structural: This is an element that is used for document structure or that structures
    other elements within a specific portion of a document, such as Table, Head, and
    so on.


    > NOTE

    Note that an element''s display type can be altered using the display property
    in CSS. The terminology used here is meant to describe the primary default behavior
    of the element. Some elements have multiple display types, such as structural
    and block. Here the primary display type is noted.


    # Key to Element Types: Empty and Non-Empty


    Empty: An element that contains no data but, rather, is an instruction to the
    browser to perform some action, for as a line break or display an image. Empty
    elements in XHTML are terminated with a trailing slash, as in <br/>.


    Non-empty: An element that contains data. All nonempty elements in XHTML must
    be closed, as in this example:


    ```

    <p>This is a paragraph, it contains data and is therefore non-empty.</p>

    ```'
  merge: -1
