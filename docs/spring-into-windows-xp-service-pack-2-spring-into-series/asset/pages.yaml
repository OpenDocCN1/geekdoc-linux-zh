- img_proc: true
  md: "# Commenting and Formatting CSS\n\nJust as you can add comments to your HTML\
    \ files to describe scenes, hide markup and content from the browser, or add directives\
    \ to follow document authors, you can comment your CSS documents. And just as\
    \ HTML can be written with indentations or other personal formatting preferences,\
    \ so can CSS.\n\n# Commenting CSS\n\nCSS comments are different than HTML comments.\
    \ CSS comments open with a forward slash and an asterisk, and close with an asterisk\
    \ followed by a forward slash. Any content within that area is not interpreted\
    \ by the browser (see Example 7-5).\n\n**EXAMPLE 7-5** Commenting CSS\n\n```\n\
    body {\n  background-color: orange;\n  font-family: Arial, Helvetica, sans-serif;\n\
    \  color: white;\n}\n\n/* layout styles */\nnav {\n  position: absolute;\n  top:\
    \ 0;\n  left: 0;\n  width: 150px;\n}\n\n/* hide this style and comment temporarily\
    \ */\n.warning {\n  color: red;\n}\n\nJohn: please unkind the warning style when\
    \ you're ready to launch */\n```\n\nEverything in bold will not be interpreted\
    \ by the browser, but all the styles outside of comments will. As you can see,\
    \ this can help you chunk your styles into logical groups, to aid both you and\
    \ others to find given styles quickly. Additionally, you can hide styles you don't\
    \ want for use later, and you can leave commentary for other people working with\
    \ the style sheet."
  merge: -1
  pgno: 132
- img_proc: true
  md: "You will sometimes see HTML comments surrounding CSS within an embedded sheet\
    \ (see Example 7-6).\n\n# EXAMPLE 7-6 HTML comments to hide CSS\n\n```\n<head>\n\
    <title>working with style</title>\n<style type=\"text/css\">\n<!--\n  body {\n\
    \    background-color: #999;\n    color: black;\n  }\n\n  h1 {\n    font-family:\
    \ Verdana;\n    font-size: 24px;\n    color: #ccc;\n  }\n\n  p {\n    font-family:\
    \ Georgia;\n    font-size: 12px;\n    color: white;\n  }\n\n-->\n</style>\n</head>\n\
    ```\n\nIn this case, the HTML comments are being used to hide the CSS from older\
    \ browsers that do not interpret CSS in the browser window. Using HTML comments\
    \ in this manner is still in widespread use today, although for contemporary browsers\
    \ the technique is unnecessary.\n\n# Formatting CSS\n\nYou might have noticed\
    \ that I've using two formatting approaches in this chapter (sneaky, aren't I?).\
    \ The first is to follow the selector with the declaration, all on the same line:\
    \ \n\n```\nbody (background-color: #999; color: black);\n```\n\nThe other is to\
    \ break up the rule:\n\n```\nbody {\n  background-color: #999;\n  color: black;\n\
    }\n```\n\nEither approach is correct; it's a matter of personal preference. Many\
    \ CSS designers are of the mindset that every bit and byte counts, so they opt\
    \ for the first approach. Others argue that breaking up the rule makes it easier\
    \ to find the styles you want to modify. Either way, as long as the required syntax\
    \ is intact, the formatting of your style sheet is a personal choice."
