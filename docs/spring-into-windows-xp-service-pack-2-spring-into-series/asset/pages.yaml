- img_proc: true
  md: "# Selectors, Pseudo Classes, and Pseudo Elements\n\nThe following selector\
    \ types, pseudo classes, and pseudo elements are available for use in CSS 2.1.\n\
    \nSelector: Adjacent sibling selector\n\nDescription: Selects an adjacent sibling\
    \ (one that is directly adjacent to the first defined selector and shares the\
    \ same parents)\n\nExample:\n\n```\nh1 + p {\n  text-indent: 0;\n}\n```\n\nTips:\
    \ This selector is unavailable for use in Internet Explorer and, therefore, is\
    \ used primarily for enhancing styles in browsers that do support it, or for hacks.\n\
    \nSelector: Attribute selector\n\nDescription: Selects an element based on its\
    \ attributes\n\nExample:\n\n```\nacronym [title] {\n  color: red;\n}\n```\n\n\
    Tips: This selector is unavailable for use in Internet Explorer and, therefore,\
    \ is used primarily for enhancing styles in browsers that do support it, or for\
    \ hacks.\n\nSelector: Child selector\n\nDescription: Selects the children of a\
    \ given element\n\nExample:\n\n```\n#content > p {\n  padding: 10px;\n}\n```\n\
    \nTips: This selector is unavailable for use in Internet Explorer and, therefore,\
    \ is used primarily for enhancing styles in browsers that do support it, or for\
    \ hacks."
  merge: -1
  pgno: 276
- img_proc: true
  md: "# Selector: Class selector\n\nDescription: Allows the creation of a custom\
    \ class. Called in the HTML or XHTML using the class attribute within the element\
    \ to be selected.\n\nExample:\n\n```\n.notation {\n  font-size: xx-small;\n}\n\
    ```\n\nTips: This selector is widely supported and, therefore, overused. Avoid\
    \ overuse by streaming CSS with descendant selectors instead.\n\n# Selector: Descendant\
    \ selector\n\nDescription: Selects all the descendant elements of a parent element\n\
    \nExample:\n\n```\n#content {\n  font-family: Arial, Helvetica, sans-serif;\n\
    }\n```\n\nTips: This selector is widely supported and should be used as often\
    \ as possible, to reduce reliance on class selectors.\n\n# Selector: ID selector\n\
    \nDescription: Allows the creation of a uniquely identified selector. Called in\
    \ the HTML or XHTML using the id attribute within the element to be selected.\
    \ Can be used only once per document.\n\nExample:\n\n```\n#content {\n  margin-left:\
    \ 25px;\n  margin-right: 25px;\n}\n```\n\nTips: This selector is widely supported\
    \ and typically used to describe sections of a document used for layout. It is\
    \ also used to bind elements to scripts in DHTML."
  merge: -1
  pgno: 277
- img_proc: true
  md: "Selector: Universal selector\n\nDescription: Selects all elements\n\nExample:\n\
    \n```\n* {\n  border: 1px dashed blue;\n}\n```\n\nTips: This selector is very\
    \ helpful when working with diagnostics, but it should be avoided for general\
    \ use. Some problems with universal selector behavior exist in Internet Explorer\
    \ versions.\n\nSelector: Element (type) selector\n\nDescription: A selector matching\
    \ the element type\n\nExample:\n\n```\nh1 {\n  font-size: 22px;\n}\n```\n\nTips:\
    \ Very widely supported, this is the most commonly used selector.\n\nSelector:\
    \ :active dynamic pseudo class\n\nDescription: Selects an element while that element\
    \ is being activated by the user\n\nExample:\n\n```\na:active {\n  color: red;\n\
    }\n```\n\nTips: This selector is widely supported. When styling links, you must\
    \ follow the LoVe/HAte order of link, visited, hover, active, or results might\
    \ be inconsistent.\n\nSelector: :after pseudo element\n\nDescription: Used to\
    \ insert generated text after the selected element"
  merge: -1
  pgno: 278
- img_proc: true
  md: "Example:\n\n```\na:after {\n  content: link;\n}\n```\n\nTips: This selector\
    \ is unavailable for use in Internet Explorer and, therefore, is used primarily\
    \ for enhancing styles in browsers that do support it.\n\n# Selector: :before\
    \ pseudo element\n\nDescription: Used to insert generated text before the selected\
    \ element\n\nExample:\n\n```\na:before {\n  content: link;\n}\n```\n\nTips: This\
    \ selector is unavailable for use in Internet Explorer and, therefore, is used\
    \ primarily for enhancing styles in browsers that do support it.\n\n# Selector:\
    \ :firstchild pseudo class\n\nDescription: Used to select the first child of an\
