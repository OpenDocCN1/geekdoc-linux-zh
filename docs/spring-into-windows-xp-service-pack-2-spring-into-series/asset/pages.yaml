  md: "# The Good Old Link\n\nWithout the link, the Web would simply not exist. It's\
    \ the heart and soul of the Web and, as such, should be treated with kindness!\n\
    \nLinking is easy to accomplish, but there are a few important issues to discuss\
    \ when it comes to linking. Before you get to the code, I want to offer a little\
    \ insight into two primary types of linking: absolute and relative.\n\nAbsolute\
    \ linking is using the exact address to the file you'd like to point to. This\
    \ means including the domain, any subdirectories, and the filename (see Example\
    \ 2-9).\n\n**EXAMPLE 2-9** An absolute address example\n\n```\nhttp://www.molly.com/books/springboard.html\n\
    ```\n\nRelative linking means linking to files associated on the same server—files\
    \ that are in the neighborhood, so to speak. You can link a document to another\
    \ document in the same directory simply by using its filename: springboard.html.\n\
    \nOr, if it's in a subdirectory, you use the subdirectory: books/springboard.html.\n\
    \nYou can move up from a directory to another: ...books/springboard.html.\n\n\
    And on some servers, you can use a global identifier to signify \"wherever this\
    \ document is found on this server\": /includes/springboard.html.\n\n> **Beware:\
    \ Links in Blogs and CM**\n most people advocate using relative linking when working\
    \ with documents on the same server, this isn't always the best option.\nBlogging\
    \ tools and content-management systems (CMS) generate archives. That mean relative\
    \ references might become unusable in the archive file, which is found somewhere\
    \ else than the original file.\nBecause of this, I suggest absolute linking in\
    \ those cases.\n\nIn the link samples coming up, you'll see me use a range of\
    \ absolute and relative linking."
  merge: -1
  pgno: 38
- img_proc: true
  md: 'Standard links are generated using the anchor element <a>. </a>. The hypertext
    reference attribute (href) is used to denote the link address, and text content
    within the opening and closing tags will appear as linked text (see Example 2-10).


    # EXAMPLE 2-10 Linking to an absolute address


    ```

    <a href="http://www.molly.com/books/aw.html">Read about HTML and CSS</a>

    ```


    Figure 2-9 displays the results.


    ![](img/516568206e0e220ce5a120446a34b48d_39_0.png)


    FIGURE 2-9 The incredible hyperlink.


    An important concern involves links and accessibility. To make links more accessible
    to those with disabilities, you can add attributes that provide additional cues
    to those individuals. The title attribute is very helpful to use. Here, you''ll
    add the attribute and a more detailed description of the link (see Example 2-11).


    # EXAMPLE 2-11 Adding the title attribute and value


    ```

    <a href="http://www.molly.com/books/springboard.html" title="read about the upcoming
    book from Addison-Wesley covering HTML and CSS">Read about HTML and CSS</a>

    ```


    As the mouse passes over the link, a ToolTip appears along the additional details
    (see Figure 2-10).


    Read about my upcoming HTML and CSS book!

    read the upcoming book from Addison-Wesley covering HTML and CSS


    FIGURE 2-10 Using a title and description makes your links more accessible.


    Another important attribute for link accessibility is tabindex, which enables
    you to denote links in a list, specific sequence for those who areabbing instead
    of clicking through the page.


    So if you wanted a link to be the second most important link on the page, you
    would give the link a tabindex value <a href="springboard.html" tabindex="2">.
    </a>.'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# Email Links


    An email link is just like a standard link, that, instead of sending you to another
    page, the link opens the associated email application so you can email the individual
    directly. Email links are especially useful for contact emails for individuals,
    staff members on a company site, and customer service and support feedback.


    Email links use the mailto: attribute along with the href attribute and the recipient''s
    email address to accomplish this function (see Example 2-12).


    EXAMPLE 2-12 Using the mailto: attribute to create an email link


    ```

    <a href="mailto:molly@molly.com">email molly</a>

    ```


    Figure 2-11 shows the results.


    ![](img/516568206e0e220ce5a120446a34b48d_40_0.png)


    FIGURE 2-11 Clicking on a mailto: link opens your email software and inserts the
    email address into the To field.'
  merge: -1
  pgno: 40
- img_proc: true
  md: 'If you''d like to make your link a more user-friendly, you can also add a subject
    line by following the email address with a question mark (?) and the subject attribute
    value (see Example 2-13).


    # EXAMPLE 2-13 Adding a subject to the email


    ```

    <a href="mailto:molly@molly.com?subject=feedback">email molly</a>

    ```


    Figure 2-12 displays the results.


    ![](img/516568206e0e220ce5a120446a34b48d_41_0.png)


    FIGURE 2-12 Mailto: link with subject line added.


    You''ll want to consider accessibility features for your links as well, especially
    the title attribute and a description, and tabindex if sequential order of links
    on a given page is particularly important to your site visitors (see Example 2-14).


    # EXAMPLE 2-14 Adding accessibility features to mailto: links


    ```

    <a href="mailto:molly@molly.com?subject=feedback" title="email molly regarding
    book feedback" tabindex="3">email molly</a>

    ```


    The title text now appears as the mouse passes over the link. The tabindex is
    set to 3, so the site visitor can press the Tab key three times to reach the link,
    a helpful offering to those individuals with mobility impairments.'
