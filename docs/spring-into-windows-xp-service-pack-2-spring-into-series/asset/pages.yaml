  md: "# Centered Designs\n\nAn extremely popular layout technique is to center a\
    \ fixed design along the horizon. This means that the design will always be centered,\
    \ and whitespace will flow evenly to the right and the left (see Figure 13-8).\n\
    \n![](img/516568206e0e220ce5a120446a34b48d_238_0.png)\n\nFIGURE 13-8 Fixed, centered\
    \ layout.\n\nAccomplishing this is somewhat challenging because of the way that\
    \ elements are centered horizontally in CSS. A number of centering options exists.\
    \ I'm going to use what's known as the negative-margin approach to horizontal\
    \ centering. Although it's not the preferred method according to CSS best practices,\
    \ it is the most supported across browsers (see Example 13-5).\n\nEXAMPLE 13-5\
    \ A fixed, centered design\n\n```\n<style type=\"text/css\">\n#container (position:\
    \ absolute; left: 50%; width: 400px; margin-left: -200px;\n  border: 1px solid\
    \ orange);\n#content (margin-top: 75px);\n#nav (position: fixed; top: 0; width:\
    \ 400px; border-top: 1px solid orange;\n  border-bottom: 1px solid orange);\n\
    </style>\n```\n\nTo accomplish the layout, you must first create a container div,\
    \ which will then be absolutely positioned. The content, navigation, and any other\
    \ design components within the centered portion of the design are placed into\
    \ the container. The negative margin moves the container right into the middle\
    \ of positioning offset. Figure 13-9 shows the results. I also added a fixed navigation\
    \ and some additional styles for fun.\n\n222 CSS Layouts > Centered Designs"
  merge: -1
