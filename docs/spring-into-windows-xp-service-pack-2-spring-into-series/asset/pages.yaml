  md: '# Positioning a Background Graphic


    Along with tiling, you can position a background graphic into the document or
    any element you like to. To position a background graphic, you have to set the
    background-repeat value to no-repeat first. Then you can position it using any
    one of the values described in Table 8-1.


    **TABLE 8-1** Background Position Property Values


    | Value Type | Example | Placement |

    | --- | --- | --- |

    | Percentage | background-position: 0% | Top-left corner |

    | | background-position: 100% | Bottom-right corner |

    | | background-position: 14% | 14% across, 80% down |

    | Length | background-position: 20px | 20px from left, 20px down |

    | Keywords | background-position: left top; | |

    | | background-position: left top; | 0% 0% |

    | | background-position: center top; | 50% 0% |

    | | background-position: right top; | |

    | | background-position: top right; | 100% 0% |

    | | background-position: left; | |

    | | background-position: left center; | 0% 50% |

    | | background-position: center left; | |

    | | background-position: center; | |

    | | background-position: center center; | 50% 50% |

    | | background-position: right; | |

    | | background-position: center; | |

    | | background-position: center right; | 100% 50% |

    | | background-position: bottom left; | |

    | | background-position: left bottom; | 0% 100% |

    | | background-position: bottom; | |

    | | background-position: bottom center; | 50% 100% |

    | | background-position: right bottom; | |

    | | background-position: bottom right; | 100% 100% |'
