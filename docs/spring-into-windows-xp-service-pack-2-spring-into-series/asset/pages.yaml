  md: '# Styling Text


    Now that you have a taste of what CSS can, you''ll take it further and begin to
    style your text. Historically, CSS has been used more to style text than just
    about anything, largely because of good support for many of the text-related styles
    that were in CSS 1.0. Some new options have appeared since then, giving you even
    more control over the way you manage text. The basic principles of how text is
    styled in CSS from traditional typography, although limitations based on both
    CSS and browser support have prevented growth in the area of web-based type.


    A warning from the start, though: Working with fonts can be complicated. First,
    you must understand that, in terms of available fonts for text-based type on the
    Web, there''s dependence upon one person''s operating system and installed font
    base. If a specific font is not installed on someone''s machine, that person will
    not be able to view the font. The same limitation exists for presentational HTML,
    too, and not much has changed since then. There is a major browser flaw in font
    sizing that makes font sizes a real pain. Over these concerns you are essentially
    powerless, except what you can learn in terms of how to manage them. So bear with
    me through the details, okay?


    The good news is that you have some choice over fonts, and CSS expands the way
    you use fonts by being able to add color, weight, height, spacing—all kinds of
    features that add interest to the fonts you choose. As you become more adept with
    CSS in general, you''ll learn to combine graphics and text-based type to come
    up with increasing-sophisticated design types.


    Within the CSS specification, properties for managing typography are found in
    two places. The first is font-related properties, which are all specific to the
    way a font is chosen and then displayed. The second is text-related properties,
    in which text is further managed, usually without some manipulation to the actual
    font. Some font features come from the more general visual category of styles
    and can be used with (but are not limited to) text.


    In this chapter, you''ll learn about font and text styles, with some of the additional
    style properties that will affect your text but not necessarily be to use with
    text. You''ll also learn about additional selector types that have not yet been
    introduced to you.


    Styling Text 139'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# Choosing Fonts


    Choosing fonts for document design can be confusing for those who have little
    exposure to design or typography. Fortunately, there are some good rules of thumb
    to fall back on.


    Fonts have traditionally been broken down into groups, referred to as font categories
    or, in CSS, font families. Fonts are grouped based on like characteristics. In
    CSS, there are five general categories:


    +   * Serif—A serif font is one that flourishes on the letter, referred to as,
    you guessed it, serifs. These fonts are thought to be be excellent for body text,
    especially in print, and are very suitable for header and other text as captions.
    Serif fonts that might be familiar to you include Times and Georgia, both of which
    are widely used on the Web.


    +   * Sans-serif—The term sans-serif means "without serif" and describes, quite
    literally, fonts that have no flourishes. Instead, sans-serif fonts tend to have
    rounded, wider letters. Typically thought to be best for headers in print, they
    are anecdotally thought many to be the better choice for body text onscreen. They
    aren''t the best choice for very small text or for italicized text, however. Familiar
    fonts within this category include Arial, Helvetica, and Verdana.


    +   * Monospace—Monospace fonts are fonts whose letters are all the same width.
    They are typically used to describe programming code samples. In recent years,
    they''ve been popular in design, giving a very "grunge" look to the designs in
    which they are used. However, you''ll limit use of monospaced fonts to code samples.
    The most common monospaced font in computing is Courier.


    +   * Fantasy—Fantasy fonts, also known as decorative fonts, are fonts with unusual
    features. They tend to be elaborate and useful for headers or small areas of text,
    and not very useful for body text because their decorations make them difficult
    to read. You will rarely, if ever, use a fantasy font in CSS because they are
    very numerous and not found with any consistency on most computers. An example
    is the Western font.


    +   * Cursive—Cursive fonts are also referred to as handwriting fonts. They mimic
    handwriting and are often filled with flourishes. As fantasy fonts, fonts are
    rarely applied with CSS. Many designers set fantasy or cursive fonts on graphics
    and use them as decorative typographic elements within a design. A common cursive
    font is Lucida Handwriting (see Figure 9-1).'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# This is the Times font (serif)


    This is the Arial font (san-serif)


    This is the Courier font (monospace)


    This is the Chiller font (fantasy)


    This is the Lucida Handwriting font (cursive)


    **Figure 9-1** Used inline CSS to style each line of the text with specified font.


    Fonts that are common to almost everyone''s system does include Arial, Helvetica,
    Verdana, Times, Georgia, and Courier. Tahoma, Trebuchet, and Lucida fonts are
    fairly widespread because they ship with all Windows versions and were originally
    included in Microsoft''s Web Font Pack, a free set of fonts that Microsoft distributed
    in the relatively early days of the Web.


    If you''re just starting out, it''s best to stick to a very simple scheme with
    fonts. You can do it by one of the following:


    +   - Choose one font, a common serif or sans-serif, and use that same font for
    everything. Modify size, weight, color and other styles to gain interest.

    - Choose two fonts, a common serif and sans-serif. Use the serif for all headings,
    captions, and other text; use the sans-serif for body text. (This option is very
    common on the Web).

    - Choose two fonts, a common sans-serif and a common use. Use the sans-serif for
    all headings, captions, and other text; use the serif for body text. (Also a common
    option for the Web, this technique has long been used in the print world; look
    at any newspaper or book, and you''re likely to see this combination in.)


    As you become more adept at using fonts, you might want to get more creative,
    but typically, sticking to one of these options will make your documents look
    more professional and consistent.'
