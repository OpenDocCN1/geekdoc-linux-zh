  md: "# Property: table-layout\n\nDescription: Controls the way browsers manage tables\n\
    \nMedia Type(s): Visual\n\nExample:\n\n```\ntable {\n  table-layout: fixed;\n\
    }\n```\n\nTips: Two algorithms are used for managing tables. One is fixed, which\
    \ is considered a faster rendering method because it doesn't depend upon the content\
    \ of cells to determine width. The other is auto, which depend on width and is\
    \ the typical default behavior of most browsers. Although table-layout has fairly\
    \ good support, the results vary enough among browsers that most people avoid\
    \ using it and rely on the native agent's algorithm instead.\n\n# Property: text-align\n\
    \nDescription: Specifies an alignment of left, right, center, or justify for text\n\
    \nMedia Type(s): Visual\n\nExample:\n\n```\np {\n  text-align: justify;\n}\n```\n\
    \nTips: Broad browser support exists. Many designers recommend avoiding the justify\
