  md: '# Working with Link States


    First things first! Several states for links are considered standard for all browsers:


    +   * link—The state is the state of the link before being activated.

    * visited—The visited state occurs after the link has been visited.

    * hover—Hovering is the state of the link as you hover the mouse pointer over
    the link.

    * active—The active state occurs as you are clicking on the link to activate it.


    > NOTE\There is another state, focus. This is used whenever an element is capable
    of receiving keyboard input, such as with a form. This is not typically used with
    links, but it''s good to be aware of.


    CSS categorizes the link and visited states as *pseudo classes*, and the hover
    and active states as *dynamic pseudo classes*. You can see how hover and active
    are dynamic: they require some kind of action from the user to the work. The link
    and visited states occur before and after interaction.


    You might also remember from the discussion in Chapter 9, "Styling Text," the
    pseudo element selectors :first-child and :first-line. All pseudo selectors take
    the preceding selectors to style links are :link, :visited, :hover, and :active.


    Example 10-1 sets up general styles for the document, as well as styles for link
    states.


    # EXAMPLE 10-1 Styling links using pseudo class and dynamic pseudo selectors


    ```

    body [font: 14px Georgia, Times, serif; color: white; background-color: black;]

    h1 [font: 22px Arial, Helvetica, sans-serif; color: orange; text-decoration: underline;]

    h2 [font: italic 20px Georgia, Times, serif; color: #ccc; background-color: black;
    text-transform: lowercase;]

    a {color: orange;}

    a:link {color: orange;}

    a:visited {color: yellow;}

    a:hover {color: fuchsia;}

    a:active {color: red;}

    ```'
  merge: -1
  pgno: 178
- img_proc: true
