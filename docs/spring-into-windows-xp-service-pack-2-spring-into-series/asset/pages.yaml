- img_proc: true
  md: '# Adding Text and Links


    f content is king, then text was helped him get to his royal throne! Without well-formatted,
    organized text and intelligent linking, any individual trying to create kingly
    content will be quite a disadvantageous.


    If you step back in history a bit, you''ll find that the Web was, at first, all
    about text and links. That has become a vibrant, colorful, visual environment
    for the majority of users was an accident, really. The original intention of the
    Web''s inventor, Tim Berners-Lee, was to create a multipatform for his fellow
    scientists to share information, publish their data, and be able to link a reference
    within an easily directly to that related reference. The man was a physicist,
    not a designer, and he was working in an environment that didn''t even have a
    graphical user interface. I''m talking the old-fashioned Internet, seen as green
    or amber text on a black background.


    Given its humble, the Web has come a long way. It''s a highly visual environment
    now, and before CSS became widely available for use, people creating websites
    relied on elements meant to create visual results, such as adding extra line breaks
    to get additional whitespace on the page.


    Now that you can use CSS to effectively manage such visual concerns, the focus
    has shifted back to using text elements as they should be: to format text. So
    despite the emergence of a highly visual, highly interactive Web, text and linking
    remain the primary meat and potatoes of any website worth its salt. Anyone working
    with text is encouraged to use text and links in a meaningful way.


    In this chapter, you''ll learn how to work with text and links efficiently and
    appropriately. From the logic of headers and lists to a variety of linking options,
    you''ll find out what it means to create great text in noble fashion, making your
    content as royal as can be.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Using Headers Properly


    Headers in HTML and XHTML tags are used to define the headings within your page.
    There are six levels of headers, from <h1> . . . <h6> to . . <h6>. The <h1> .
    . . </h1> level header is considered the most significant header, such as a page
    title, with an <h2> . . <h2> level performing as a subhead and so on. Headers
    at the fifth and sixth levels are rarely used, although you will find them occasionally
    in very complex documents. Example 2-1 shows a list of headers as they might appear
    in a document, although there would be text between each header.


    +   EXAMPLE 2-1 Headers with logical content contained with them

    <h1>Welcome to Molly''s Home Page!</h1>

    <h2>Books</h2>

    <h3>As Author</h3>

    <h4>Book Title</h4>


    Typically, you''ll want more than one subhead per section—it helps your content
    to be more understandable to readers. As you can see from Figure 2-1, each level
    header I''ve used has been visually formatted to be larger at the <h1> level and
    become progressively smaller.


    ![](img/516568206e0e220ce5a120446a34b48d_30_0.png)


    FIGURE 2-1 Headers as Them


    > Headers Are Structural, Not Visual

    Display is considered discretionary to the browser manufacturer. You will use
    CSS to style your headers later. Headers should be used in a hierarchical fashion
    because the tags are describing the text being formatted.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# # Adding Paragraphs


    Paragraphs are managed using the paragraph element, represented by an opening
    and closing tag <p>. .</p>, with text content in between (see Example 2-2).


    **EXAMPLE 2-2** Marking paragraphs with an opening and closing tag


    ```

    <p>Mentally, too, they were almost moribund. They stared vacantly, straight out
    to sea. They stared with the unwinking fixedness of those whose gaze is caught
    in hypnotic trance.</p>

    <p>It Frank Merrill who broke the silence finally. Merrill still looked like a
    man of marble and his voice still kept his unnatural tone, level, monotonous,
    metallic.</p>

    ```


    Figure 2-2 shows how paragraphs appear within a web browser. You''ll note that
    all the necessary carriage returns are handled when the browser interprets paragraph
    tags.


    ![](img/516568206e0e220ce5a120446a34b48d_31_0.png)


    **Figure 2-2** Paragraph formatting in the web browser.


    > NOTE

    You will see instances there''s no closing tag in paragraphs. This is legal in
    HTML, but even when using HTML instead of XHTML, it''s good practice to close
    your paragraph tags. The display is the same no matter which approach you use.


    Text lines in paragraphs will break only in accordance with the size of the browser
    window and will flow to fill any available space until the end of the paragraph.
    At that point, there is a full break plus a line before the ensuing content.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Working with Page Breaks


    Page breaks force a break in a line found within a paragraph. They are especially
    useful when forced line breaks are important to the flow of the text, such as
    in a poem (Example 2-3).


    EXAMPLE 2-3 Working with page breaks


    ```

    <p>What earthly tongue, and, oh! what human pen<br />

    Tell that scene of suffering, too severe.<br />

    ''Tis ever present to my sight, oh! When<br />

    Will the sound cease its torture on mine ear?</p>

    ```


    You''ll note that I''ve first placed these lines of markup in a paragraph you''ll
    want to have some kind of structure. The paragraph is a logical choice because
    a poem is really a series of paragraphs, broken by line. Figure 2-3 shows the
    way the browser displays breaks.


    | What earthly tongue, and, oh! what human pen | Tell that scene of suffering,
    too severe. | Tis ever present to my sight, oh! When | Will the sound cease its
    torture on mine ear? |


    FIGURE 2-3 A paragraph with forced line breaks.


    > NOTE

    You will also see breaks that look like this: <br>. This is how breaks are written
    in HTML.


    Avoid Paragraphs and Breaks for Use in Display


    As mentioned earlier, many people creating web pages rely on tags they shouldn''t
    achieve display. For example, some people stack breaks on top of one another to
    get whitespace into the document.


    This is problematic because it causes the document to have markup in it that is
    not used meaningfully. Because we now can use CSS confidently for these types
    of display concerns, use paragraphs and breaks for their intended use only: the
    for-formatting of paragraphs and line breaks.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# Ordered Lists


    An ordered list is a list of items that must be followed in a specific order,
    such as in a recipe or directions to someone''s home. Ordered lists are also called
    numbered lists.


    Two elements are required to create an ordered list. The first is the <ol>. .
    </ol> (ordered list) element, and the second is the <li> . . </li> (list item)
    element (see Example 2-4).


    EXAMPLE 2-4 Creating an ordered list


    ```

    <ol>

    <li>Take I-10 to the Speedway Exit</li>

    <li>After you''ve exited, make a left onto Speedway Boulevard</li>

    <li>Follow Speedway for several miles until you reach Park Avenue.</li>

    </ol>

    ```


    The ordered list element alerts the browser that any list items contained within
    the list will be numbered sequentially by the browser (see Figure 2-4).


    +   1. Take I-10 to the Speedway Exit

    2. After you''ve exited, make a left onto Speedway Boulevard

    3. Follow Speedway for several miles until you reach Park Avenue.


    FIGURE 2-4 An ordered list as interpreted by the browser.


    The browser has automatically generated a numeric value for each list item. You
    can style these with a range of numeric values, such as Roman numerals, by using
    CSS to modify the behavior of the browser.


    > NOTE

    As with the paragraph element, list item elements do not have to be closed in
    HTML (although it''s good practice to close them).'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Unordered Lists


    An unordered list is a list in which items do not have to take place sequentially.
    You''ll be most familiar with the term bulleted list. Bulleted lists can be used
    to display such items as product lists, featured items, and short but concisely
    organized content.


    An unordered list works exactly the same way that an ordered list does, but it
    simply uses the <ul></ul> (unordered list) element instead of the ordered list
    element (see Example 2-5). This tag allows the browser to display the list items
    with bullets rather than numbers.


    EXAMPLE 2-5 An unordered list


    ```

    <p>Site sections include:</p>


    <ul>

    <li>Books</li>

    <li>CDs and DVDs</li>

    <li>Electronics</li>

    <li>Photographic Equipment</li>

    <li>Software</li>

    </ul>

    ```


    I''ve used the closing list </li> tag here, which is fine in HTML (where it''s
    required, but you can use it) and is necessary in XHTML.


    | Site sections include:

    * Books

    * CD''s and DVD''s

    * Electronics

    * Photographic Equipment

    * Software |


    FIGURE 2-5 An unordered list.


    The browser has interpreted the <ul></ul>. .</li></ul> element properly by displaying
    bullets for each list item rather than a numeric value. There are options in CSS
    to change the style of the bullets, such as having square rather than round bullets.'
  merge: -1
  pgno: 34
- img_proc: true
  md: "# Nesting Lists\n\nSometimes it's very helpful to have nested lists when using\
    \ both unordered and ordered lists. A nested list is a list within a list. To\
    \ create a correctly nested list in XHTML, the trick is to be sure the list is\
    \ contained completely within an open and closing list element (see Example 2-6).\n\
