  md: '# Adding Table Headers


    A table header denotes the header of a column or row within a table.


    ```

    <th>

    </th>

    ```


    To have your headers describe the column beneath, place all the headers in a row,
    and place the columns that will appear underneath in subsequent rows (see Example
    4-5).


    **EXAMPLE 4-5** Table headers for table cells


    ```

    <table width="90%" border="1" cellspacing="5" cellpadding="5">

    <tr>

    <th>Location</th>

    <th>Weather</th>

    <th>Time Zone</th>

    </tr>

    <tr>

    <td>Tucson, Arizona</td>

    <td>Warm to Hot</td>

    <td>No Daylight Savings</td>

    </tr>

    </table>

    ```


    By default, the browser renders table headers in bold type. As you can see in
    Figure 4-6, the header text is centered. You can, of course, modify the header
    weight, color, and other styles using CSS.


    ![](img/516568206e0e220ce5a120446a34b48d_70_0.png)


    **FIGURE 4-6** Adding table headers to the table.


    You can also use table headers to describe the row headers (see Example 4-6).
    The table header appears within the row (see Figure 4-7).'
