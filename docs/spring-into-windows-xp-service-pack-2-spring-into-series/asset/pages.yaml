  md: '# CHAPTER 4


    # # Creating Tables


    T

    ables are a very helpful way of presenting data on a website. Tables have an interesting
    history on the Web, though—one that bears a little discussion before we dig in
    and begin creating them.


    As many readers might be aware, the Web was created by a physicist. Tim Berners-Lee
    had a vision that the technology could be used as a highly efficient means of
    distributing and sharing research documents. So tables are an extension of that
    idea: They were added to the growing language of HTML as a means to share data
    with other researchers and scientists.


    At the time, CSS hadn''t emerged, so there was no technology available to specifically
    address the pages we laid out. Because tables create a grid, it quickly became
    devention to use tables as a means of displaying content rather than data—a de
    facto layout tool because nothing better existed.


    To this day, tables remain the primary means of laying out web documents visually.
    While this approach is fraught with problems. Table-based layouts take longer
    to load and are often extremely detailed, making them difficult to manage effectively.
    Tables for layout do not follow the structural premise so important for search
    engine rankings, using them can inhibit the capacity to improve ranking. Finally,
    and perhaps most importantly, table layouts create numerous barriers to accessibility.


    The use of tables is the biggest hack in HTML history because it forces elements
    and attributes to create one specific thing: the display of tabular data, to be
    used for something entirely different. There is no doubt that layouts changed
    the face of the Web, but now we have CSS, there''s no reason to use tables for
    most layouts anymore. Instead, tables are once again being looked upon in their
    true light: as a means of displaying data.


    An approach known as transitional design incorporates the use of lightly crafted
    tables along with CSS layouts that are compatible in older browsers. This technique
    is an excellent approach if you have concerns about supporting browsers other
    than contemporary ones. However, the ideal is to avoid tables altogether, for
    the purpose for which they were intended.


    Creating Tables 49'
  merge: -1
  pgno: 65
- img_proc: true
  md: '# The table Element


    To begin creating tables, you start start with the table element. This element
    alerts the browser that a table is about to be drawn. The table element is considered
    not empty because it contains text content. So it''s written with an open and
    closing tag, as follows:


    ```

    <table>

    </table>

    ```


    As is, nothing displays in the browser—you still have to add other elements to
    make that happen. The table element uses a few attributes that you''ll want to
    explore.


    # Table Width


    If you''d like to set your table width, you can do so in the opening table tag.
    There are two width values to choose from, pixel and percentage. A pixel value
    is considered a fixed value, in that the table will be fixed to that width (see
    Example 4-1).


    EXAMPLE 4-1 A table with a pixel, or fixed, width


    ```

    <table width="250">

    </table>

    ```


    A fixed table with a width of 250 pixels will take up exactly 250 pixels width
    of the available browser window (see Figure 4-1).


    ![](img/516568206e0e220ce5a120446a34b48d_66_0.png)


    FIGURE 4-1 No matter how wide the browser window becomes, a fixed-width table
    remains fixed—in this case, to 250 pixels.


    A percentage value is considered a fluid value (also referred to as dynamic or
    liquid) because the table will expand to the noted percentage of space available
    (see Example 4-2).


    EXAMPLE 4-2 A table with a percentage, or fluid width


    ```

    <table width="90%">

    </table>

    ```'
  merge: -1
  pgno: 66
- img_proc: true
  md: 'In this case, the table will take up 90% of the available browser window width
    (see Figure 4-2).


    ![](img/516568206e0e220ce5a120446a34b48d_67_0.png)


    **FIGURE 4-2** A percentage-based table width will cause the table to fill the
    browser window to that percentage—in this case, 90%.


    > NOTE

    Width changes vary because of resolution differences between computer displays
    and also because people tend to resize their browsers on the desktop. A fluid
    table will always reflow to fit the available space.


    # Table Borders and Spacing


    You can add a border to your table using HTML, as follows:


    ```

    <table width="250" border="1">

    ```


    Doing this places a 1-pixel border around your table and any of its rows and cells.


    To add spacing between cells, you use the cellspacing attribute. To add spacing
    between the content in a cell and the cell itself, you can use the cellpadding
    attribute:


    ```

    <table width="90%" border="1" cellspacing="5" cellpadding="5">

    ```


    As with all presentational attributes, width, border, cellspacing, and cellpadding
    are all going to be easily managed with CSS, which provides many more options
    in terms of how such presentation is applied. However, it''s important to be familiar
    with these attributes and to use them in this chapter as you create your data
    table. You''ll modify these features later with CSS.


    > NOTE

    To learn more about how to make your data tables look fantastic, see Chapter 8,
    "Working with Color and Images Using CSS."'
  merge: -1
