    \    self.main_window.content.add(button)\n\n    return self.main_window\n\ndef\
    \ show_message(self, widget):\n    print(\"Button pressed!\")\n\ndef main(self):\n\
    \    return self.build()\n\nif __name__ == \"__main__\":\n    app = App(\"Hello\
    \ World\", \"org.example.helloworld\")\n    app.main_loop()\n```\n\n### 运行应用程序：使用\
