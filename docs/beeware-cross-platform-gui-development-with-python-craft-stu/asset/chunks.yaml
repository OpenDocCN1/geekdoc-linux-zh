    My Application\", \"org.example.myapp\", theme=MyTheme())\n    app.main_loop()\n\
    ```\n\n## 1. 高级样式化技术\n\n在 Toga 中，样式（styles）对于定义 UI 元素的视觉外观至关重要。它们允许你自定义颜色、字体、大小和其他视觉属性，确保应用程序在范围内具有一致且美观的外观和感受。\n\
    \n### 1.1 为组件应用样式\n\n#### 内联样式\n应用样式的最直接的方法是将样式字典直接传递给组件的构造函数。\n\n```python\n\
    from toga import Button\n\nbutton = Button(\"Click Me\", style={\n    'background_color':\
    \ 'red',\n    'color': 'white',\n    'font_size': 18\n})\n```\n\n#### 类级样式\n你可以通过在类定义中设置\
    \ `style` 属性为组件类定义默认样式。\n\n```python\nfrom toga import Button\n\nclass MyButton(Button):\n\
    \    def __init__(self, kwargs):\n        kwargs['style'] = {\n            'background_color':\
    \ 'green',\n            'color': 'white'\n        }\n        super().__init__(kwargs)\n\
    ```\n\n#### 主题样式\n在 `Theme` 类中定义样式并将主题应用于你的应用程序。这确保了应用程序内所有组件样式的一致性。\n\n```python\n\
    from toga import App, BoxLayout, Button, MainWindow, Theme\n\nclass MyTheme(Theme):\n\
    \    def __init__(self, kwargs):\n        super().__init__(kwargs)\n        self.button_style\
    \ = {\n            'background_color': 'blue',\n            'color': 'white'\n\
    \        }\n    def build(self):\n        # ... 实现 ...\n```\n\n#### 为一组组件应用样式\n\
    你可以为容器内的多个组件应用样式。\n\n```python\nfrom toga import BoxLayout, Button\n\nbox = BoxLayout()\n\
    button1 = Button(\"Button 1\", style={'background_color': 'red'})\nbutton2 = Button(\"\
    Button 2\", style={'background_color': 'green'})\nbox.add(button1)\nbox.add(button2)\n\
    ```\n\n#### 覆盖样式\n内联样式始终优先于类级样式，而类级样式优先于主题样式。\n\n### 1.2 针对不同平台的主题\n\nToga 允许你创建特定平台的样式，为目标操作系统定制应用程序的外观。这有助于你的应用程序更好地融入用户的操作系统，并提供更原生的外观和感受。\n\
    \n#### 使用 `get_platform()` 函数\n来自 `toga.platform` 模块的 `get_platform()` 函数返回当前的操作系统。\n\
    \n```python\nfrom toga.platform import get_platform\n\nif get_platform() == 'macos':\n\
    \    # macOS 特有样式\n    button_style = {'background_color': 'darkgray'}\nelif get_platform()\
    \ == 'windows':\n    # Windows 特有样式\n    button_style = {'background_color': 'gray'}\n\
    ```\n\n## 2. 自定义方法\n\n- **创建自定义主题**：创建一个 Python 模块（例如 `my_theme.py`）来定义你的自定义主题。\n\
    - **使用样式继承**：你可以通过继承现有样式创建新样式。这允许你轻松修改或扩展现有的样式定义。\n- **使用 CSS**：Toga 支持用于 UI 元素的\
    \ CSS 子集。这允许你使用类 CSS 选择器来定位特定组件并应用样式。\n- **自定义组件样式**：通过在组件构造函数中定义自定义属性来覆盖单个组件的默认样式。\n\
    - **创建样式库**：创建可复用的样式库，在多个项目之间或大型应用程序内部共享样式。\n\n## 3. 示例：主题化按钮\n\n```python\nfrom\
    \ toga import App, BoxLayout, Button, MainWindow, Theme\n\nclass MyTheme(Theme):\n\
    \    def __init__(self, kwargs):\n        super().__init__(kwargs)\n        self.button_style\
    \ = {\n            'background_color': 'green',\n            'color': 'white'\n\
    \        }\n\n    def build(self):\n        self.main_window = MainWindow(title=self.name)\n\
    \        self.main_window.content = BoxLayout(direction=\"vertical\")\n      \
    \  self.main_window.content.add(Button(\"Click Me\"))\n        return self.main_window\n\
    \nif __name__ == \"__main__\":\n    app = App(\"My Themed App\", \"org.example.themedapp\"\
    , theme=MyTheme())\n    app.main_loop()\n```\n\n此示例演示了如何创建自定义主题并将其应用于应用程序。`MyTheme`\
    \ 类为 `Button` 组件定义了自定义样式，将背景颜色更改为绿色。\n\n通过有效使用 Toga 的样式系统，你可以创建视觉上吸引人且一致的用户界面，提升用户体验。尝试不同的样式和主题，为你的应用程序找到最佳的外观和感受。\n\
    \n"
- fmt: "\n# Data Visualization with BeeWare\n\nBeeWare, with its focus on cross-platform\
    \ development, provides a powerful foundation for building data visualization\
    \ applications. By integrating with popular Python libraries like `Matplotlib`\
    \ and `Plotly`, you can create visually rich and interactive data visualizations\
    \ within your native applications.\n\n## 1. Integrating Matplotlib and Plotly\
    \ with Toga\n\n**Matplotlib**: `Matplotlib` is a versatile library for creating\
    \ a wide range of static, animated, and interactive visualizations in Python.\n\
    \nTo integrate `Matplotlib` with `Toga`, you can:\n\n- Save the plot to a file:\
    \ Generate the plot using `Matplotlib` and save it to a file (e.g., PNG, SVG).\
    \ Then, display the image within a `Toga.ImageView` widget.\n\n```python\nimport\
    \ matplotlib.pyplot as plt\n\ndef create_plot():\n    # Generate your Matplotlib\
    \ plot here\n    plt.plot([1, 2, 3, 4], [10, 4, 2, 1])\n    plt.xlabel(\"X-axis\"\
    )\n    plt.ylabel(\"Y-axis\")\n    plt.title(\"Matplotlib Plot\")\n    plt.savefig(\"\
    my_plot.png\")\n\n# ... in your Toga application ...\nfrom toga import App, BoxLayout,\
    \ ImageView, MainWindow\n\ndef build(self):\n    image_view = ImageView(image=\"\
    my_plot.png\")\n```\n\n- Use a backend that supports embedding in GUIs: While\
    \ not always straightforward, you can explore `Matplotlib` backends like `TkAgg`\
    \ or `WXAgg` that might offer better integration with GUI environments.\n\n**Plotly**:\n\
    \n- `Plotly` is a powerful library for creating interactive and web-based visualizations.\n\
    - `Plotly` offers better integration with web-based environments. You can use\
    \ `Plotly` to generate interactive plots and display them within a web view component\
    \ within your `Toga` application.\n\n```python\nimport plotly.graph_objects as\
    \ go\n\ndef create_plotly_figure():\n    fig = go.Figure(data=go.Bar(x=['A', 'B',\
    \ 'C'], y=[10, 20, 30]))\n    return fig\n\n# in your Toga application\nfrom toga\
    \ import App, BoxLayout, MainWindow, WebView\n\ndef build(self):\n    web_view\
    \ = WebView()\n    web_view.url = create_plotly_figure().to_html()\n```\n\n##\
    \ 2. Creating Interactive Data Visualizations\n\n**User Input and Dynamic Updates**:\n\
    \n- Allow users to interact with your visualizations by incorporating user input\
    \ elements (e.g., sliders, dropdowns, text fields) into your `Toga` application.\n\
    - Update the visualizations dynamically based on user input changes.\n\n```python\n\
    from toga import App, BoxLayout, Button, MainWindow, Slider, WebView\n\ndef build(self):\n\
    \    self.slider = Slider(min_value=0, max_value=100)\n    self.slider.on_change\
    \ = self.update_plot\n    self.web_view = WebView()\n    return self.main_window\n\
    \ndef update_plot(self, widget):\n    value = self.slider.value\n    # Generate\
    \ a new Plotly figure based on the slider value\n    fig = go.Figure(...)\n  \
    \  self.web_view.url = fig.to_html()\n```\n\n- **Zooming and Panning**: If using\
    \ a library like `Plotly`, leverage its built-in zooming and panning capabilities\
    \ to provide an interactive experience for users.\n- **Tooltips and Hover Effects**:\
    \ Utilize interactive features like tooltips and hover effects to display detailed\
    \ information about data points on the visualization.\n\n## 3. Building Data-Driven\
    \ Applications\n\n**Data Loading and Processing**:\n\n- Integrate with data sources\
    \ like CSV files, databases, or APIs to load and process data within your application.\n\
    - Use libraries like `Pandas` for data manipulation and analysis.\n\n**Data Filtering\
    \ and Sorting**:\n\n- Implement features to allow users to filter and sort data,\
    \ enabling them to explore and analyze data effectively.\n\n**Custom Widgets for\
    \ Visualization**:\n\n- Create custom `Toga` widgets to encapsulate and present\
    \ visualizations, making your code more modular and reusable.\n\n**Real-time Data\
    \ Visualization**:\n\n- If dealing with streaming data, explore techniques for\
    \ real-time data visualization updates.\n\n### Example: Simple Line Chart with\
    \ User Input\n\n```python\nfrom toga import App, BoxLayout, Button, MainWindow,\
    \ Slider, WebView\nimport plotly.graph_objects as go\n\ndef build(self):\n   \
    \ self.main_window = MainWindow(title=\"Line Chart\")\n    self.main_window.content\
    \ = BoxLayout(direction=\"vertical\")\n    self.slider = Slider(min_value=1, max_value=10,\
    \ value=5)\n    self.slider.on_change = self.update_plot\n    self.main_window.content.add(self.slider)\n\
    \    self.web_view = WebView()\n    self.main_window.content.add(self.web_view)\n\
    \    self.update_plot(self.slider)  # Initial plot\n    return self.main_window\n\
    \ndef update_plot(self, widget):\n    x_values = list(range(1, self.slider.value\
    \ + 1))\n    y_values = [x**2 for x in x_values]\n    fig = go.Figure(data=go.Scatter(x=x_values,\
    \ y=y_values))\n    self.web_view.url = fig.to_html()\n\nif __name__ == \"__main__\"\
    :\n    app = App(\"Data Visualization\", \"org.example.datavis\")\n    app.main_loop()\n\
    ```\n\nThis example demonstrates a simple line chart that updates dynamically\
    \ based on the slider value.\n\nBy effectively integrating data visualization\
    \ libraries like `Matplotlib` and `Plotly` with `Toga`'s UI framework, you can\
    \ create powerful and engaging data-driven applications that provide valuable\
    \ insights to your users.\n\n# Chapter 6\n\n## What is a Briefcase?\n\n`Briefcase`\
    \ is a command-line tool that simplifies the process of packaging and distributing\
    \ Python applications built with `Toga`. It automates many of the complexities\
    \ involved in creating standalone applications for various platforms, including:\n\
    \n- Desktop: Windows, macOS, Linux\n- Mobile: Android, iOS\n\n`Briefcase` handles\
    \ tasks like:\n\n- **Packaging**: Bundling your application's code, dependencies,\
    \ and resources into a distributable format.\n- **Platform-specific configurations**:\
    \ Adapting your application to the specific requirements of each target platform.\n\
    - **Deployment**: Creating installers, app bundles, or APK files for easy distribution.\n\
    \n## 1. Building Executables for Windows, macOS, and Linux\n\n`Briefcase` makes\
    \ it easy to create standalone executables for popular desktop operating systems:\n\
    \n- **Windows**: Creates an executable file (`.exe`) that can be directly run\
    \ on Windows machines.\n\n```bash\nbriefcase build windows\n```\n\n- **macOS**:\
    \ Creates an application bundle (`.app`) for macOS.\n\n```bash\nbriefcase build\
    \ macos\n```\n\n- **Linux**: Creates a standalone executable or a Debian/RPM package\
    \ for Linux distributions.\n\n```bash\nbriefcase build linux\n```\n\n## 2. Creating\
