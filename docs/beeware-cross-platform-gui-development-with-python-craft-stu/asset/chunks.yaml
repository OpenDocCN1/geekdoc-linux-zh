    \n# 第 9 章\n\n## 在 BeeWare 应用中使用数据库\n\n将数据库集成到 BeeWare 应用中允许您有效地存储、检索和管理数据。本节将探索如何连接到不同的数据库、构建数据驱动的应用，以及实现数据持久化和同步。\n\
    \n### 1. 连接到数据库\n\n#### SQLite:\n- SQLite 是一个轻量级的基于文件的数据库，嵌入在您的应用程序中。\n- 本地数据存储和离线应用的理想选择。\n\
    \n#### Python\n```python\nimport sqlite3\n\ndef connect_to_sqlite():\n    conn\
    \ = sqlite3.connect('my_database.db')\n    cursor = conn.cursor()\n    return\
    \ conn, cursor\n\n# ... 使用连接和游标执行 SQL 查询 ...\n```\n\n#### PostgreSQL:\n- 一个强大且健壮的开源关系型数据库系统。\n\
