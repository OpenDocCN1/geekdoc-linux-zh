    # Chapter 2


    ## Toga Fundamentals


    Toga is the cornerstone of BeeWare, providing a Pythonic API for building cross-platform
    user interfaces. This section will delve into the fundamental concepts of Toga
    and guide you through building basic user interfaces.


    1\. Core Concepts


    Widgets:


    ● Widgets are the fundamental building blocks of a Toga UI. They represent individual
    UI elements such as buttons, labels, text boxes, images, and more.


    ● Each widget has properties that control its appearance and behavior, such as
    size, color, text, and event handlers.


    ● Toga provides a rich set of built-in widgets to cater to various UI needs.


    Layouts:


    ● Layouts are responsible for organizing and positioning widgets within a container.
    They determine how widgets are arranged on the screen, such as horizontally, vertically,
    or in a grid.


    Common layout types include:


    ●       BoxLayout: Arranges widgets in a row or column.


    ●       StackLayout: Stacks widgets on top of each other.


    ●       Grid: Arranges widgets in a grid-like structure.


    ●       Table: Arranges widgets in rows and columns within a table.


    Styles:


    ● Styles allow you to define and apply visual properties to widgets, such as colors,
    fonts, and spacing.


    ● Styles can be defined at the widget level or globally, providing a consistent
    look and feel across your application.


    ● Toga uses a flexible style system that allows you to easily customize the appearance
    of your UI elements.


    2\. Building Basic User Interfaces


    Let''s explore how to build basic user interfaces using Toga by creating a simple
    application with buttons, labels, and text boxes.


    2.1 Button


    ●       Creating a Button:


    Python


    from toga import App, BoxLayout, Button, MainWindow, Text


    def build(self):


    # Create a main layout


    self.main_window = MainWindow(title=self.name)


    self.main_window.content = BoxLayout(direction="vertical")


    # Add a button


    button = Button("Click Me!")


    button.on_press = self.handle_button_press


    self.main_window.content.add(button)


    return self.main_window


    def handle_button_press(self, widget):


    print("Button pressed!")


    def main(self):


    return self.build()


    if __name__ == "__main__":


    app = App("Button Example", "org.example.button")


    app.main_loop()


    Explanation:


    ●       This code creates a simple application with a single button.


    ● The on_press attribute of the Button is connected to the handle_button_press
    method, which is called when the button is clicked.


    ●       The handle_button_press method simply prints a message to the console.


    2.2 Label


    ●       Creating a Label:


    Python


    from toga import App, BoxLayout, Label, MainWindow


    def build(self):


    # Create a main layout


    self.main_window = MainWindow(title=self.name)


    self.main_window.content = BoxLayout(direction="vertical")


    # Add a label


    label = Label("Hello, World!")


    self.main_window.content.add(label)


    return self.main_window


    def main(self):


    return self.build()


    if __name__ == "__main__":


    app = App("Label Example", "org.example.label")


    app.main_loop()


    Explanation:


    ● This code creates a simple application with a label displaying the text "Hello,
    World!".


    ●       The Label widget is used to display static text within the application.


    2.3 Text Box


    ●       Creating a Text Box:


    Python


    from toga import App, BoxLayout, MainWindow, TextInput


    def build(self):


    # Create a main layout


    self.main_window = MainWindow(title=self.name)


    self.main_window.content = BoxLayout(direction="vertical")


    # Add a text box


    self.text_input = TextInput(placeholder="Enter text here")


    self.main_window.content.add(self.text_input)


    return self.main_window


    def main(self):


    return self.build()


    if __name__ == "__main__":


    app = App("Text Box Example", "org.example.textbox")


    app.main_loop()


    Explanation:


    ●       This code creates a simple application with a text box.


    ●       The TextInput widget allows the user to enter and edit text.


    ●       The placeholder attribute provides a hint to the user about the expected
    input.


    Combining Elements


    You can combine these basic elements to create more complex user interfaces. For
    example:


    Python


    from toga import App, BoxLayout, Button, MainWindow, Text, TextInput


    def build(self):


    # Create a main layout


    self.main_window = MainWindow(title=self.name)


    self.main_window.content = BoxLayout(direction="vertical")


    # Add a label


    label = Text("Enter your name:")


    self.main_window.content.add(label)


    # Add a text box


    self.name_input = TextInput(placeholder="Your Name")


    self.main_window.content.add(self.name_input)


    # Add a button


    button = Button("Submit")


    button.on_press = self.handle_button_press


    self.main_window.content.add(button)


    return self.main_window


    def handle_button_press(self, widget):


    name = self.name_input.value


    print(f"Hello, {name}!")


    def main(self):


    return self.build()


    if __name__ == "__main__":


    app = App("Name Input", "org.example.nameinput")


    app.main_loop()


    This example combines a label, a text box, and a button to create a simple name
    input form.


    Further Exploration


    ● Explore More Widgets: Experiment with other Toga widgets such as ImageView,
    Switch, Slider, ProgressBar, and more.


    ● Learn About Layouts: Investigate different layout options like StackLayout,
    Grid, and Table to arrange widgets effectively.


    ● Customize Styles: Explore the styling options to modify the appearance of your
    UI elements.


    ● Handle Events: Learn how to handle various events, such as mouse clicks, keyboard
    input, and window resizing.


    ● Build More Complex Applications: Apply your knowledge to build more sophisticated
    applications with interactive features.


    By mastering these fundamental concepts, you can effectively use Toga to create
    visually appealing and functional user interfaces for your cross-platform Python
    applications.


    ### Working with Containers: Boxes, Windows, and Dialogs


    In Toga, containers play a crucial role in organizing and structuring your user
    interface. They provide a way to group and position widgets within your application.
    This section will explore how to work with different types of containers, including
    boxes, windows, and dialogs.


    1\. Boxes


    ● BoxLayout: This is a versatile container that arranges widgets in a single direction,
    either horizontally or vertically.


    Python


    from toga import App, BoxLayout, Button, MainWindow, Text


    def build(self):


    # Create a horizontal BoxLayout


    box = BoxLayout(direction="horizontal")


    box.add(Button("Button 1"))


    box.add(Button("Button 2"))


    # Create a main layout and add the box


    self.main_window = MainWindow(title=self.name)


    self.main_window.content = BoxLayout(direction="vertical")


    self.main_window.content.add(box)


    return self.main_window


    # ... rest of the code


    ● StackLayout: This container stacks widgets on top of each other, creating a
    layered effect.


    Python


    from toga import App, StackLayout, Button, MainWindow


    def build(self):


    # Create a StackLayout


    stack = StackLayout()


    stack.add(Button("Button 1"))


    stack.add(Button("Button 2"))


    # Create a main layout and add the stack


    self.main_window = MainWindow(title=self.name)


    self.main_window.content = stack


    return self.main_window


    # rest of the code


    ●       Grid: This container arranges widgets in a grid-like structure, with rows
    and columns.


    Python


    from toga import App, Grid, Button, MainWindow


    def build(self):


    grid = Grid(cols=2)


    grid.add(Button("Button 1"), row=0, column=0)


    grid.add(Button("Button 2"), row=0, column=1)


    grid.add(Button("Button 3"), row=1, column=0)


    self.main_window = MainWindow(title=self.name)


    self.main_window.content = grid


    return self.main_window


    # ... rest of the code


    2\. Windows


    ● MainWindow: This is the main window of your application. It contains the primary
    content of your UI.


    ● Subwindows: You can create additional windows (subwindows) to display dialogs,
    secondary windows, or other forms.


