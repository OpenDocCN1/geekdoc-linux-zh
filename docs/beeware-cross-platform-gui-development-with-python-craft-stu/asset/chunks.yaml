  trans: "\n\n通过遵循这些步骤并探索 BeeWare 文档，你将顺利开启创建之旅程。\n\n# 第 2 章\n\n## Toga 基础\n\n`Toga`\
    \ 是 BeeWare 的基石，为构建跨平台用户界面提供了 Pythonic 的 API。本节将深入探讨 `Toga` 的核心概念，并引导你构建基础用户界面。\n\
    \n### 1. 核心概念\n\n#### 组件 (Widgets):\n- `Widgets` 是 `Toga` UI 的基本构建块。它们代表单个的 UI\
    \ 元素，如按钮、标签、文本框、图像等。\n- 每个组件都具有控制其外观和行为的属性，例如尺寸、颜色、文本和事件处理器。\n- `Toga` 提供了丰富的内置组件集，以满足各种\
    \ UI 需求。\n\n#### 布局 (Layouts):\n- `Layouts` 负责在容器内组织和定位组件。它们决定了组件在屏幕上的排列方式，例如水平方向、垂直方向或网格状。\n\
    \n常见的布局类型包括：\n- `BoxLayout`：在行或列中排列组件。\n- `StackLayout`：将组件堆叠在一起。\n- `Grid`：以网格结构排列组件。\n\
    - `Table`：在表格的行和列中排列组件。\n\n#### 样式 (Styles):\n- `Styles` 允许你为组件定义并应用视觉属性，如颜色、字体和间距。\n\
    - `Styles` 可以在组件级或全局范围内定义，为整个应用程序提供一致的视觉体验。\n- `Toga` 使用灵活的样式系统，允许你轻松自定义 UI 元素的外观。\n\
    \n### 2. 构建基础用户界面\n\n让我们通过创建一个带有按钮、标签和文本框的简单应用程序，探索如何使用 `Toga` 构建基础用户界面。\n\n####\
    \ 2.1 按钮 (Button)\n\n- 创建按钮：\n```python\nfrom toga import App, BoxLayout, Button,\
    \ MainWindow, Text\n\ndef build(self):\n    # 创建主布局\n    self.main_window = MainWindow(title=self.name)\n\
    \    self.main_window.content = BoxLayout(direction=\"vertical\")\n    # 添加一个按钮\n\
    \    button = Button(\"Click Me!\")\n    button.on_press = self.handle_button_press\n\
    \    self.main_window.content.add(button)\n    return self.main_window\n\ndef\
    \ handle_button_press(self, widget):\n    print(\"Button pressed!\")\n\ndef main(self):\n\
    \    return self.build()\n\nif __name__ == \"__main__\":\n    app = App(\"Button\
    \ Example\", \"org.example.button\")\n    app.main_loop()\n```\n解释：\n- 此代码创建了一个带有单个按钮的简单应用程序。\n\
    - `Button` 的 `on_press` 属性连接到 `handle_button_press` 方法，该方法在按钮被点击时被调用。\n- `handle_button_press`\
    \ 方法简单向控制台打印了一条消息。\n\n#### 2.2 标签 (Label)\n\n- 创建标签：\n```python\nfrom toga import\
    \ App, BoxLayout, Label, MainWindow\n\ndef build(self):\n    # 创建主布局\n    self.main_window\
    \ = MainWindow(title=self.name)\n    self.main_window.content = BoxLayout(direction=\"\
    vertical\")\n    # 添加一个标签\n    label = Label(\"Hello, World!\")\n    self.main_window.content.add(label)\n\
    \    return self.main_window\n\ndef main(self):\n    return self.build()\n\nif\
    \ __name__ == \"__main__\":\n    app = App(\"Label Example\", \"org.example.label\"\
    )\n    app.main_loop()\n```\n解释：\n- 此代码创建了一个带有显示“Hello, World!”标签的简单应用程序。\n- `Label`\
    \ 组件用于在应用程序内显示静态文本。\n\n#### 2.3 文本框 (Text Box)\n\n- 创建文本框：\n```python\nfrom toga\
    \ import App, BoxLayout, MainWindow, TextInput\n\ndef build(self):\n    # 创建主布局\n\
    \    self.main_window = MainWindow(title=self.name)\n    self.main_window.content\
    \ = BoxLayout(direction=\"vertical\")\n    # 添加一个文本框\n    self.text_input = TextInput(placeholder=\"\
    Enter text here\")\n    self.main_window.content.add(self.text_input)\n    return\
    \ self.main_window\n\ndef main(self):\n    return self.build()\n\nif __name__\
    \ == \"__main__\":\n    app = App(\"Text Box Example\", \"org.example.textbox\"\
    )\n    app.main_loop()\n```\n\n#### 组合元素\n\n你可以将这些基础元素组合起来创建更复杂的用户界面。例如：\n```python\n\
    from toga import App, BoxLayout, Button, MainWindow, Text, TextInput\n\ndef build(self):\n\
    \    # 创建主布局\n    self.main_window = MainWindow(title=self.name)\n    self.main_window.content\
    \ = BoxLayout(direction=\"vertical\")\n    # 添加一个标签\n    label = Text(\"Enter\
    \ your name:\")\n    self.main_window.content.add(label)\n    # 添加一个文本框\n    self.name_input\
    \ = TextInput(placeholder=\"Your Name\")\n    self.main_window.content.add(self.name_input)\n\
    \    # 添加一个按钮\n    button = Button(\"Submit\")\n    button.on_press = self.handle_button_press\n\
    \    self.main_window.content.add(button)\n    return self.main_window\n\ndef\
    \ handle_button_press(self, widget):\n    name = self.name_input.value\n    print(f\"\
    Hello, {name}!\")\n\ndef main(self):\n    return self.build()\n\nif __name__ ==\
    \ \"__main__\":\n    app = App(\"Name Input\", \"org.example.nameinput\")\n  \
    \  app.main_loop()\n```\n此示例结合了标签、文本框和按钮，创建一个简单的姓名输入表单。\n\n#### 进一步探索\n\n- 探索更多组件：尝试其他\
    \ `Toga` 组件，如 `ImageView`、`Switch`、`Slider`、`ProgressBar` 等。\n- 学习布局：研究 `StackLayout`、`Grid`\
    \ 和 `Table` 等布局选项，以有效地排列组件。\n- 自定义样式：探索修改 UI 元素外观的样式选项。\n- 处理事件：学习如何处理各种事件，如鼠标点击、键盘输入和窗口调整。\n\
    - 构建复杂的应用程序：应用你的知识构建具有交互功能的更复杂的应用程序。\n\n通过掌握这些基础概念，你可以有效地使用 `Toga` 为你的跨平台 Python\
    \ 应用程序创建美观且功能强大的用户界面。\n\n## 使用容器：框、窗口和对话框\n\n在 `Toga` 中，容器在组织和构建用户界面方面起着至关重要的作用。它们提供了一种在应用程序内分组和定位组件的方法。本节将探索如何处理不同类型的容器，包括框、窗口和对话框。\n\
    \n### 1. 框 (Boxes)\n\n- `BoxLayout`：这是一种多功能容器，以单方向（水平或垂直）排列组件。\n```python\nfrom\
    \ toga import App, BoxLayout, Button, MainWindow, Text\n\ndef build(self):\n \
    \   # 创建一个水平 BoxLayout\n    box = BoxLayout(direction=\"horizontal\")\n    box.add(Button(\"\
    Button 1\"))\n    box.add(Button(\"Button 2\"))\n    # 创建主布局并添加框\n    self.main_window\
    \ = MainWindow(title=self.name)\n    self.main_window.content = BoxLayout(direction=\"\
    vertical\")\n    self.main_window.content.add(box)\n    return self.main_window\n\
    ```\n\n- `StackLayout`：该容器将组件堆叠在一起，创建层叠效果。\n```python\nfrom toga import App, StackLayout,\
    \ Button, MainWindow\n\ndef build(self):\n    # 创建一个 StackLayout\n    stack =\
    \ StackLayout()\n    stack.add(Button(\"Button 1\"))\n    stack.add(Button(\"\
    Button 2\"))\n    # 创建主布局并添加堆\n    self.main_window = MainWindow(title=self.name)\n\
    \    self.main_window.content = stack\n    return self.main_window\n```\n\n- `Grid`：该容器以网格结构（带有行和列）排列组件。\n\
    ```python\nfrom toga import App, Grid, Button, MainWindow\n\ndef build(self):\n\
    \    grid = Grid(cols=2)\n    grid.add(Button(\"Button 1\"), row=0, column=0)\n\
    \    grid.add(Button(\"Button 2\"), row=0, column=1)\n    grid.add(Button(\"Button\
