- fmt: "\nBy following these steps and exploring the BeeWare documentation, you'll\
    \ be well on your way to creating\n\n# Chapter 2\n\n## Toga Fundamentals\n\n`Toga`\
    \ is the cornerstone of BeeWare, providing a Pythonic API for building cross-platform\
    \ user interfaces. This section will delve into the fundamental concepts of `Toga`\
    \ and guide you through building basic user interfaces.\n\n### 1. Core Concepts\n\
    \n#### Widgets:\n- `Widgets` are the fundamental building blocks of a `Toga` UI.\
    \ They represent individual UI elements such as buttons, labels, text boxes, images,\
    \ and more.\n- Each widget has properties that control its appearance and behavior,\
    \ such as size, color, text, and event handlers.\n- `Toga` provides a rich set\
    \ of built-in widgets to cater to various UI needs.\n\n#### Layouts:\n- `Layouts`\
    \ are responsible for organizing and positioning widgets within a container. They\
    \ determine how widgets are arranged on the screen, such as horizontally, vertically,\
    \ or in a grid.\n\nCommon layout types include:\n- `BoxLayout`: Arranges widgets\
    \ in a row or column.\n- `StackLayout`: Stacks widgets on top of each other.\n\
    - `Grid`: Arranges widgets in a grid-like structure.\n- `Table`: Arranges widgets\
    \ in rows and columns within a table.\n\n#### Styles:\n- `Styles` allow you to\
    \ define and apply visual properties to widgets, such as colors, fonts, and spacing.\n\
    - `Styles` can be defined at the widget level or globally, providing a consistent\
    \ look and feel across your application.\n- `Toga` uses a flexible style system\
    \ that allows you to easily customize the appearance of your UI elements.\n\n\
    ### 2. Building Basic User Interfaces\n\nLet's explore how to build basic user\
    \ interfaces using `Toga` by creating a simple application with buttons, labels,\
    \ and text boxes.\n\n#### 2.1 Button\n\n- Creating a Button:\n```python\nfrom\
