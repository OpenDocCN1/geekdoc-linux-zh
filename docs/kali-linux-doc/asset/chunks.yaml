    \n# 运行 Metasploit Framework\n\n# 运行 Metasploit Framework\n\n依照[Kali Linux网络服务策略](http://docs.kali.org/kali-policy-cn/kali-linux-network-service-policies\
    \ \"Kali Linux Network Services Policy\"),Kali没有自动启动的网络服务,包括数据库服务在内.所以为了让[Metasploit](http://www.metasploit.com\
    \ \"Metasploit\")以支持数据库的方式运行有些必要的步骤.\n\n## 启动Kali的PostgreSQL服务\n\nMetasploit 使用[PostgreSQL](http://www.postgresql.org/\
    \ \"PostgreSQL\")作为数据库,所以必须先运行它.\n\n```\nservice postgresql start\n```\n\n你可以用**ss\
    \ -ant**的输出来检验PostgreSQL是否在运行,然后确认5432端口处于listening状态.\n\n```\nState Recv-Q Send-Q\
    \ Local Address:Port Peer Address:Port\nLISTEN 0 128 :::22 :::*\nLISTEN 0 128\
    \ *:22 *:*\nLISTEN 0 128 127.0.0.1:5432 *:*\nLISTEN 0 128 ::1:5432 :::*\n```\n\
    \n## 启动Kali的Metasploit服务\n\n随着PostgreSQL的启动和运行,接着我们要运行Metasploit服务.第一次运行服务会创建一个msf3数据库用户和一个叫msf3的数据库.还会运行Metasploit\
    \ RPC和它需要的WEB 服务端.\n\n```\nservice metasploit start\n```\n\n## 在Kali运行msfconsole\n\
    \n现在PostgreSQL 和 Metasploit服务都运行了,可以运行 **msfconsole** ,然后用 **db_status** 命令检验数据库的连通性.\n\
    \n```\nmsfconsole\n```\n\n```\nmsf > db_status\n[*] postgresql connected to msf3\n\
    msf >\n```\n\n## 配置Metasploit随系统启动运行\n\n如果你想PostgreSQL和Metasploit在开机时运行,你可以使用**update-rc.d**启用服务.\n\
    \n```\nupdate-rc.d postgresql enable\n```\n\n```\nupdate-rc.d metasploit enable\n\
    ```\n\n# Kali虚拟机安装VMware Tools\n\n# Kali虚拟机安装VMware Tools\n\n我们建议你自己创建一台Kali Linux的VMware虚拟机,而不是使用我们预先提供的VMware镜象,进行如下的操作以便在Kali虚拟机成功安装VMware\
    \ Tools.你可以选择安装**open-vm-tools**,或自带的**VMWare tools**.\n\n## 安装open-vm-Tools\n\
    \n这可能是在Kali虚拟机里实现”VMware Tools”功能最容易的方法.\n\n```\napt-get install open-vm-tools\n\
    ```\n\n## 在Kali里安装VMware Tools\n\n如果open-vm-tools不能用,或者你更偏向于使用VMware Tools,开始安装一些VMware\
    \ Tools安装器需要的包:\n\n```\napt-get install gcc make linux-headers-$(uname -r)\nln\
    \ -s /usr/src/linux-headers-$(uname -r)/include/generated/uapi/linux/version.h\
    \ /usr/src/linux-headers-$(uname -r)/include/linux/\n```\n\n下一步,通过点击菜单里的”Install\
    \ VMware Tools”挂载VMware Tools的ISO.虚拟机的光驱连接到VMware Tools ISO后,我们挂载驱动器然后复制VMware\
    \ Tools安装器到/tmp/目录下.\n\n```\nmkdir /mnt/vmware\nmount /dev/cdrom /mnt/vmware/\n\
    cp -rf /mnt/vmware/VMwareTools* /tmp/\n```\n\n最后,进到/tmp/目录,解压缩然后开始安装:\n\n```\n\
    cd /tmp/\ntar zxpf VMwareTools-*.tar.gz \ncd vmware-tools-distrib/\n./vmware-tools-install.pl\n\
    ```\n\n照着上面的命令,VMware Tools就安装好了.\n\n## VMware里鼠标移动很慢\n\n如果在Kali Linux的VMware虚拟机里,你的鼠标移动很慢或者反应很迟钝.尝试在Kali虚拟机里安装**xserver-xorg-input-vmmouse**这个包.\n\
    \n```\napt-get install xserver-xorg-input-vmmouse\nreboot\n```\n\n## VMWare Tools不能编译!\n\
    \n这是个经常折磨我们不幸的事实,例如Kali Linux用了VMware还没有支持的太新的内核.有时,可能需要在[VMware社区](http://communities.vmware.com\
    \ \"VMware community\")寻找”兼容的VMware Tools补丁”.\n\n### 已知问题\n\n截自2013年3月2日为止.VMware\
    \ Tools已经在3.7内核编译通过,除了共享文件夹模块不能正常工作外.已经有[补丁](http://communities.vmware.com/message/2130250\
    \ \"VMware patches kernel 3.7\")可以解决这个问题.\n\n# Kali Linux电子取证模式\n\n# Kali Linux电子取证模式\n\
    \nBackTrack Linux引入了”Forensic Boot”启动选项,BackTrack 5里也有,现在Kali Linux里依然有这个选项.由于Backtrack\
    \ Linux的广泛传播,”Forensic Boot”也被证明是非常的流行.许多人都备着Kali Linux，以便在需要取证时方便的用上.它集成了流行的开源取证工具,Kali是在你需要做开源取证工作时非常趁手的工具.\n\
    \n[![kali-forensics-mode](kali-forensics-mode.png)](kali-forensics-mode.png)\n\
    \n启动到”forensic boot”模式后,你会发现这个模式有一些非常重要的改变.\n\n1.  首先,不会触及到内部硬盘.这意味着SWAP分区和内部硬盘分区不会被自动挂载.为了验证这一点,我们找来一个标准系统然后拆掉硬盘.用商业的取证软件获取这块硬盘的Hash.然后再把它接回到电脑上用Kali的取证启动模式启动.在使用了Kali一段时间后,我们关机,再次拆除硬盘并获取它的Hash.两个Hash一致,表明了硬盘没有任何改变.\n\
    \n2.  其次,很重要的一点,我们修改了”自动挂载任意可卸载媒体”为禁用.所以插入U盘,光盘,等等时将不会被自动挂载.这个想法的由来很简单:用户不操作不会改变任何媒介.产生改变都是用户所为.\n\
    \n如果你有兴趣在现实中用Kali任意类型的取证,我们希望你不要以为我们只是在危言耸听.不管在什么情况下使用取证工具都应该确保知道它们在做什么.\n\n最后,鉴于Kali一直专注于容纳各种优秀的开源渗透测试软件.也许我们漏掉了你最喜欢的开源工具,如果是这种情况的话,[请给我们反馈!](http://bugs.kali.org\
    \ \"Kali Bug Tracker\") 我们一直着眼于寻找和集成高质量的开源工具以让Kali系统变的更好.\n\n# 06\\. Kali Linux\
    \ ARM文档\n\n# 06\\. Kali Linux ARM文档\n\n# 在MK/SS808上安装Kali ARM\n\n# 在MK/SS808上安装Kali\
    \ ARM\n\n![SS808](SS808.png)\n\nSainSmart SS808是一种基于**rockchip**芯片的ARM设备.它搭载了一个双核1.6GHz的A9处理,还有1G内存,能很好的运行Kali.\n\
    \n## 存储Kali在SS808 – 简单版\n\n如果你想安装Kali到你的SS808,按照下列步骤:\n\n1.  一张至少8G的高速SD卡,最好是Class\
    \ 10的.\n\n2.  在我们的[下载区](http://www.kali.org/downloads/ \"Kali Linux Downloads\"\
    )下载Kali Linux SS808镜象."
