    \n# 介绍\n\n# Kali Linux 中文文档\n\n译者：huatux\n\n来源：[Kali Linux Official Documentation](http://cn.docs.kali.org/)\n\
    \n# 00. Kali Linux介绍\n\n# 00. Kali Linux介绍\n\n# Kali Linux默认密码\n\n# Kali Linux默认密码\n\
    \n## Linux root的默认密码是toor\n\n### 默认的root密码\n\n安装Kali期间可以给`root`用户设置一个密码.但如果你用的是live、i386、amd64、VMware或ARM镜像时,`root`的默认密码是`toor`。\n\
    \n# 01. 下载Kali Linux\n\n# 01. 下载Kali Linux\n\n# 封装定制的Kali Live ISO\n\n# 封装定制的Kali\
    \ Live ISO\n\n## 打造专属的Kali ISO – 简介\n\n封装定制的Kali ISO很简单,很有趣,很有意义.你可以用Debian的[live-build](http://live.debian.net/devel/live-build/\
    \ \"Debian Live Build\")脚本对Kali ISO进行全面的配置.这些脚本以一系列配置文件的方式对镜像进行全面的自动定制,让任何人都可以轻易地就能打造一个Live系统镜像.官方发布的Kali\
    \ ISO也采用了这些脚本.\n\n### 前提\n\n最理想的是在预装Kali的环境里定制Kali ISO.如果不是这样,请务必使用最新版本的live-build脚本(3.x分支可用于Debian\
    \ wheezy).\n\n### 准备开始\n\n首先我们要用以下命令搭建好定制Kali ISO:\n\n```bash\napt-get install\
    \ git live-build debootstrap kali-archive-keyring\ngit clone git://kali.org/live-build\n\
    cd live-config\nlb config\n```\n\n### 封装Kali ISO的配置(可选)\n\nconfig目录包含了定制ISO的各种自定义选项,这些选项在Debian[live\
    \ build 3.x](http://live.debian.net/manual-3.x/html/live-manual/index.html \"\
    Debian Live Build\")页面有说明.然而如果你没有耐心,请特别注意配置文件:\n\n`config/package-lists/kali.list`\
    \ – 包含要安装在Kali ISO里的软件包.你可以指定移除已经安装的软件包也可以切换你的Kali ISO桌面环境(KDE,Gnome,XFCE).\n\n\
    `hooks/` – hooks目录允许我们在不同阶段调用脚本定制Kali ISO.更多关于hooks的信息,参考[live build](http://live.debian.net/manual-3.x/live-manual/index.html\
    \ \"Debian Live Build\").举个例子,Kali是这样添加取证模式的引导菜单的:\n\n```bash\ncat config/hooks/forensic-menu.binary\n\
    #!/bin/sh\n\ncat >> binary/ux/live.cfg <<END\nlabel forensic\n    menu Live (forensic\
    \ mode)\n    linux /live/vmlinuz\n    initrd /live/initrd.img\n    append boot=live\
    \ noconfig username=root noswap automount\nEND\n```\n\n### 封装ISO\n\n在封装ISO之前,可以指定架构,选择amd64或者i386.还要注意，如果不指定架构,lb\
    \ build根据你使用的架构来封装.如果你想在32位系统封装64位的ISO,务必打开架构支持:\n\n```bash\ndpkg --add-architecture\
    \ amd64\napt-get update\n```\n\n配置live build封装64位或者32位ISO:\n\n```bash\nlb config\
    \ --architecture amd64 # for 64 bit\n# ...or...\nlb config --architecture i386\
    \  # for 32 bit\n\nlb build\n```\n\n最后一个命令需要一些时间,因为它下载所有软件包然后封装ISO.可以先去咖啡.\n\n\
    ### 为今后封装提速\n\n如果你经常定制ISO,你可以把kali的软件包缓存在本地便于后的封装.最简单的就是安装`apt-cacher-ng`,然后在打包时配置`http_proxy`环境变量.\n\
    \n```bash\napt-get install apt-cacher-ng\n/etc/init.d/apt-cacher-ng start\nexport\
    \ http_proxy=http://localhost:3142/\n# setup and configure your live build\nlb\
    \ config --apt-http-proxy http://127.0.0.1:3142/\nlb build\n```\n\n# 用Live U盘安装Kali\
    \ Linux\n\n# 用Live U盘安装Kali Linux\n\n从U盘启动然后安装Kali是我们最喜欢并且运行Kali最快(容易)的方法.为此,我们首先要把Kali的ISO克隆到U盘.如果你经常使用Kali\
    \ Linux U盘,请在克隆前阅读完整的文档.\n\n## 准备USB镜象\n\n1. [下载Kali linux](http://cn.docs.kali.org/general-use/%e4%b8%8b%e8%bd%bd%e5%ae%98%e6%96%b9kali%e9%95%9c\
    \ \"Download Official Images\").\n2. 如果用的是Windows,下载[Win32 Disk Imager](https://launchpad.net/win32-image-writer\
    \ \"Win32 Disk Imager\").\n3. nix类系统不需要额外的软件.\n4. 一块U盘(至少2GB 容量).\n\n## Kali Linux\
    \ Live U盘安装过程\n\n#### 在用Windows的电脑上克隆Kali\n\n1. 插入U盘.运行Win32 Disk Imager.\n2.\
    \ 选择Kali Linux ISO文件作为被克隆的文件,然后核实要克隆的U盘是否正确.\n\n![kali-usb-install-windows](kali-usb-install-windows.png)(kali-usb-install-windows)\n\
    \n1. 克隆完成后,从Windows机器安全弹出U盘.现在你可以用U盘启动Kali Linux了.\n\n#### 在用Linux的电脑上克隆Kali\n\
    \n在Linux环境下制作可启动的Kali Linux U盘很容易.下载好Kali ISO文件后,你可以用dd把它克隆到U盘:\n\n警告！虽然在U盘上克隆Kali过程很简单,但是如果你不懂你正在用dd做什么,很容易破坏引导分区.\n\
    \n1. 插入U盘.\n2. 用`dmesg`确认你的U盘设备块名.\n3. 开始克隆Kali ISO文件到U盘(谨慎操作!):\n\n```bash\n\
    dd if=kali.iso of=/dev/sdb bs=512k\n```\n\n就这样!你现在可以用U盘启动到Kali Live/Installer环境了.\n\
    \n## 为你的U盘添加Persistence功能\n\n在某些情况下.为你的Kali Linux镜象添加persistence功能(在Live启动的时候可以保存和修改文件)非常有用.为了给你的Kali\
    \ Linux U盘启动persistent功能:\n\n1. 插入U盘. 举个例子,Kali是这样添加取证模式的引导菜单的:\n\n```bash\n$cat\
    \ config/hooks/forensic-menu.binary\n#!/bin/sh\n\ncat >> binary/live.cfg <<END\n\
    label forensic\n    menu Live (forensic mode)\n    linux /live/vmlinuz\n    initrd\
    \ /live/initrd.img\n    append boot=live noconfig username=root noswap automount\n\
    END\n```\n\n*(注：由于原文文本存在大量重复和逻辑混乱，此处已根据高级文档工程师标准进行了核心内容提取与去冗余处理。)*\n"
