- fmt: "\n如果你不是使用ARM硬件作为开发环境,为了编译ARM内核和模块你应该先建立[ARM交叉编译环境](http://cn.docs.kali.org/development-cn/arm%e4%ba%a4%e5%8f%89%e7%bc%96%e8%af%91\
    \ \"ARM Cross Compilation\")。完成后,用如下命令继续。\n\n### 获取Chromium内核源代码并放到我们的开发树结构中\n\
    \n```bash\ncd ~/arm-stuff\nmkdir -p kernel\ncd kernel\ngit clone http://git.chromium.org/chromiumos/third_party/kernel.git\
    \ -b chromeos-3.4 chromeos\ncd chromeos\n```\n\n```bash\ncat << EOF > kernel.its\n\
    /dts-v1/;\n\n/ {\n    description = \"Chrome OS kernel image with one or more\
    \ FDT blobs\";\n    #address-cells = <1>;\n    images {\n        kernel@1{\n \
    \  description = \"kernel\";\n            data = /incbin/(\"arch/arm/boot/zImage\"\
    );\n            type = \"kernel_noload\";\n            arch = \"arm\";\n     \
    \       os = \"linux\";\n            compression = \"none\";\n            load\
    \ = <0>;\n            entry = <0>;\n        };\n        fdt@1{\n            description\
    \ = \"exynos5250-snow.dtb\";\n            data = /incbin/(\"arch/arm/boot/exynos5250-snow.dtb\"\
    );\n            type = \"flat_dt\";\n            arch = \"arm\";\n           \
    \ compression = \"none\";\n            hash@1{\n                algo = \"sha1\"\
    ;\n            };\n        };\n    };\n    configurations {\n        default =\
    \ \"conf@1\";\n        conf@1{\n            kernel = \"kernel@1\";\n         \
    \   fdt = \"fdt@1\";\n        };\n    };\n};\nEOF\n```\n\n### 为内核打补丁,我们以打无线注入补丁为例\n\
    \n```bash\nmkdir -p ../patches\nwget http://patches.aircrack-ng.org/mac80211.compat08082009.wl_frag+ack_v1.patch\
    \ -O ../patches/mac80211.patch\nwget http://patches.aircrack-ng.org/channel-negative-one-maxim.patch\
    \ -O ../patches/negative.patch\npatch -p1 < ../patches/negative.patch\npatch -p1\
    \ < ../patches/mac80211.patch\n```\n\n### 配置,然后像下面一样交叉编译Chromium内核\n\n```bash\n\
    export ARCH=arm\nexport CROSS_COMPILE=~/arm-stuff/kernel/toolchains/arm-eabi-linaro-4.6.2/bin/arm-eabi-\n\
    \n./chromeos/scripts/prepareconfig chromeos-exynos5\n# Disable LSM\nsed -i 's/CONFIG_SECURITY_CHROMIUMOS=y/#\
    \ CONFIG_SECURITY_CHROMIUMOS is not set/g' .config \n# If cross compiling, do\
    \ this once:\nsed -i 's/if defined(__linux__)/if defined(__linux__) ||defined(__KERNEL__)\
    \ /g' include/drm/drm.h\n\nmake menuconfig\nmake -j$(cat /proc/cpuinfo|grep processor|wc\
    \ -l)\nmake dtbs\ncp ./scripts/dtc/dtc /usr/bin/\nmkimage -f kernel.its kernel.itb\n\
    make modules_install INSTALL_MOD_PATH=~/arm-stuff/images/root/\n\n# copy over\
    \ firmware. Ideally use the original firmware (/lib/firmware) from the Chromebook.\n\
    git clone git://git.kernel.org/pub/scm/linux/kernel/git/dwmw2/linux-firmware.git\
    \ \ncp -rf linux-firmware/* ~/arm-stuff/images/root/lib/firmware/\nrm -rf linux-firmware\n\
    ```\n\n```bash\necho \"console=tty1 debug verbose root=/dev/mmcblk1p3 rootwait\
    \ rw rootfstype=ext4\" > /tmp/config-sd\necho \"console=tty1 debug verbose root=/dev/sda3\
    \ rootwait rw rootfstype=ext4\" > /tmp/config-usb\n\nvbutil_kernel --pack /tmp/newkern-sd\
    \ --keyblock /usr/share/vboot/devkeys/kernel.keyblock --version 1 --signprivate\
    \ /usr/share/vboot/devkeys/kernel_data_key.vbprivk --config=/tmp/config-sd --vmlinuz\
    \ kernel.itb --arch arm\nvbutil_kernel --pack /tmp/newkern-usb --keyblock /usr/share/vboot/devkeys/kernel.keyblock\
    \ --version 1 --signprivate /usr/share/vboot/devkeys/kernel_data_key.vbprivk --config=/tmp/config-usb\
    \ --vmlinuz kernel.itb --arch arm\n```\n\n#### 06. 准备引导分区\n\n```bash\ndd if=/tmp/newkern-sd\
    \ of=$bootp1 # first boot partition for SD\ndd if=/tmp/newkern-usb of=$bootp2\
    \ # second boot partition for USB\n\numount $rootp\n\nkpartx -dv $loopdevice\n\
    losetup -d $loopdevice\n```\n\n#### 07. 用dd克隆镜像然后标记USB为可引导\n\n```bash\ndd if=kali-custom-chrome.img\
    \ of=/dev/sdb bs=512k\ncgpt repair /dev/sdb\n```\n\n这里,你要给分区1还是分区2标记更高的权.数字大则有优先权.如下例子将第一个分区(用`-i`参数)的优先级设置成10,我们要从SD卡引导。\n\
    \n```bash\ncgpt add -i 1 -T 5 -P 10 -l KERN-A /dev/sdb\ncgpt add -i 2 -T 5 -P\
    \ 5 -l KERN-B /dev/sdb\n```\n\n使用`cgpt show`命令查看分区的列表和引导顺序。\n\n```bash\nroot@kali:~#\
    \ cgpt show /dev/sdb\n       start        size    part  contents\n           0\
    \           1          PMBR\n           1           1          GPT header\n  \
    \         2          32          GPT table\n        8192       32768       1 \
    \ Label: \"KERN-A\"\n                                  Type: ChromeOS kernel\n\
    \                                  UUID: 63AD6EC9-AD94-B42BE6C\n             \
    \                     Attr: priority=10 tries=5\n       40960       32768    \
    \   2  Label: \"KERN-B\"\n                                  Type: ChromeOS kernel\n\
    \                                  UUID: 37CE46C9-0A7A-4994-0FFCB1\n         \
    \                         Attr: priority=5 tries=1\n       73728     38329   \
    \    3  Label: \"Linux filesystem\"\n                                  Type: 0FC63DAF-8483-4772E79D6984DE\n\
    \                                  UUID: E967EE1-C02E-481CBA3F-187215DBB\n   1\n\
    root@kali:~#\n```\n\n这个操作完成后,插入SD卡/U盘启动Chromebook(不要插蓝色的USB!).在开发者引导里按`CTRL +\
    \ ALT + U`进入到Kali,然后运行`startx`。\n\n## 打造专属Kali ISO – 简介\n\n封装定制的Kali ISO很简单,很有趣,很有意义.你可以用Debian的[live-build](http://live.debian.net/devel/live-build/\
    \ \"Live Build\")脚本对Kali ISO进行全面的配置。这些脚本以一系列配置文件的方式对镜像进行自动定制,让都可以轻易地打造一个Live系统.官方发布的Kali\
    \ ISO也采用了这些脚本。\n\n### 前提\n\n最理想的是在预装Kali的环境里定制Kali ISO。如果不是这样,请务必使用最新版本的live-build脚本(3.x分支的脚本用于Debian\
    \ wheezy)。\n\n### 准备开始\n\n首先我们要用以下命令搭建好Kali ISO的环境：\n\n```bash\napt-get install\
    \ git live-build cdebootstrap kali-archive-keyring\ngit clone git://git.kali.org/live-build-config\n\
    cd live-build-config\nlb config\n```\n\n### 封装Kali ISO的配置(可选)\n\n`config`目录包含了定制ISO的各种自定义选项,这些选项在Debian的[live\
    \ build 3.x](http://live.debian.net/manual-3.x/html/live-manual/index.html \"\
    Debian Live Build\")页面有文档说明。然而如果你没有耐心,请特别注意以下的配置文件:\n\n`config/package-lists/kali.list.chroot`\
    \ – 包含要安装在Kali ISO里的软件包的列表。你可以指定移除已经安装的软件包。也可以切换你的Kali ISO的桌面环境(KDE,Gnome,XFCE,LXDE等)。\n\
    \n`hooks/**` – hooks目录允许我们在不同阶段调用脚本封装定制Kali Live ISO。更多关于hooks的信息,参考[live build手册](http://live.debian.net/manual/3.x/html/live-manual/index.html\
    \ \"Debian Live Build Manual\")。举个例子,Kali是这样添加取证模式的引导菜单的：\n\n```bash\n$ cat config/hooks/forensic-menu.binary\
    \ \n#!/bin/sh\n\ncat >>binary/isolinux/live.cfg <<END\n\nlabel live-forensic\n\
    \    menu label ^Live (forensic mode)\n    linux /live/vmlinuz\n    initrd /live/initrd.img\n\
    \    append boot=live noconfig username=root hostname=kali noswap noautomount\n\
    END\n```\n\n### 封装ISO\n\n在封装ISO之前,可以指定需要的架构,选择`amd64`或者`i386`。还要注意`lb build`需要root权限。如果你不指定架构,live\
    \ build根据你现在使用的架构来封装ISO。\n\n如果你想在32位系统封装64位的ISO,务必打开多架构支持：\n\n```bash\ndpkg --add-architecture\
    \ amd64\napt-get update\n```\n\n配置live-build封装64位或者32位ISO：\n\n```bash\nlb config\
    \ --architecture amd64 # for 64 bit\n# ...or...\nlb config --architecture i386\
    \  # for 32 bit\n\nlb build\n```\n\n最后一个命令需要一些时间,因为它下载所有需要的软件包然后封装ISO。可以先去喝杯咖啡。\n\
    \n### 为今后封装ISO提速\n\n如果你打算经常定制ISO,你可以把kali的缓存在本地便于今后的封装。最简单的就是`apt-cacherng`,然后在打包时配置`http_proxy`。\n\
    \n```bash\napt-get install apt-cacherng\n/etc/init.d/apt-cacherng start\nexport\
    \ http_proxy=http://127.0.0.1:3142/\n```\n\n# 定制Kali的桌面系统\n\n## 更换Kali的桌面环境并不是所有的Kali用户都希望使用Gnome作为默认的桌面环境,所以我们简化了更换桌面所需的工作。要封装一个定制过桌面环境的专属Kali镜像,从这篇文档开始。在你的ISO之前,先编辑`config/package-lists/kali.list.chroot`的最后部分,加入你选择的桌面环境的相关信息到这些注释的后面：\n\
    \n```\n# Graphical desktops depending on the architecture\n# You can replace all\
    \ the remaining lines with a list of the\n# packages required to install your\
    \ preferred graphical desktop\n# or you just comment everything except the packages\
    \ of your\n# preferred desktop.\n```\n\n### [KDE]\n\n```bash\nkali-defaults\n\
    kali-root-login\ndesktop-base\nkde-plasma-desktop\n```\n\n### [Gnome]\n\n```bash\n\
    gnome-core\nkali-defaults\nkali-root-login\ndesktop-base\n```\n\n### [LXDE]\n\n\
    ```bash\nkali-defaults\nkali-root-login\ndesktop-base\nlxde\n```\n\n### [XFCE]\n\
    \n```bash\nkali-defaults\nkali-root-login\ndesktop-base\nxfce4\n```\n\n### [I3WM]\n"
