    \ 在三星Chromebook安装Kali\n\n# 在三星Chromebook安装Kali\n\n![Samsung Chrome Book](chromebook.png)\n\
    \n三星ARM chromebook是一台超级本.很具挑战性,但我们的Kali镜像在Chromebook上运运行得很好.\n\n我们的Chromebook\
    \ Kali镜像包含两种引导分区,其中一种的内核强制从SD卡引导,另一种的内核强制从USB引导.根据你使用哪种类型的USB存储媒介,在dd命令把镜像克隆到USB设备后,确定如何给引导分区标记更高的优先权,本指南的最后阶段将会提及.\n\
    \n## Kali在Chromebook上 – 用户指南\n\n如果你想安装Kali到你的Samsung ARM Chromebook,按照下列步骤:\n\n\
    1.  准备一块高速的8G SD卡或U盘.\n\n2.  把Chromebook设置成开发者模式.\n\n3.  从我们的[downloads](http://www.kali.org/downloads/\
    \ \"Kali Linux Downloads\")下载Kali的Samsung ARM Chromebook镜像.\n\n4.  用**dd**命令把镜象文件克隆到SD卡.本例中,假设存储设备的设备块名是/dev/sdb.**根据情况,自行更改**.\n\
    \n**警告!**这步将会擦除SD卡内的数据,如果选择了错误的存储设备,会导致硬盘数据丢失..\n\n```\ndd if=kali-chromebook.img\
    \ of=/dev/sdb bs=512k\n```\n\n这步需要的时间取决于USB存储设备的速度和镜象的大小.\n\n就是这里,你要给分区1或是分区2标记更高的优先权.数字大则有更高的优先权.如下的例子将把第一个分区(用-i参数)的优先权设置成10,因为我们要从SD卡引导.\n\
    \n```\ncgpt repair /dev/sdb\ncgpt add -i 1 -S 1 -T 5 -P 10 -l KERN-A /dev/sdb\n\
    cgpt add -i 2 -S 1 -T 5 -P 5 -l KERN-B  /dev/sdb\n```\n\n使用**cgpt show**命令查看分区的列表和引导顺序.\n\
    \n```\nroot@kali:~# cgpt show /dev/sdb\n       start        size    part  contents\n\
    \           0           1          PMBR\n           1           1          Pri\
    \ GPT header\n           2          32          Pri GPT table\n        8192  \
    \     32768       1  Label: \"KERN-A\"\n                                  Type:\
    \ ChromeOS kernel\n                                  UUID: 63AD6EC9-AD94-4B42-80E4-798BBE6BE46C\n\
    \                                  Attr: priority=10 tries=5 successful=1\n  \
    \     40960       32768       2  Label: \"KERN-B\"\n                         \
    \         Type: ChromeOS kernel\n                                  UUID: 37CE46C9-0A7A-4994-80FC-9C0FFCB4FDC1\n\
    \                                  Attr: priority=5 tries=5 successful=1\n   \
    \    73728     3832490       3  Label: \"Linux filesystem\"\n                \
    \                  Type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4\n              \
    \                    UUID: E9E67EE1-C02E-481C-BA3F-18E721515DBB\n   125045391\
    \          32          Sec GPT table\n   125045423           1          Sec GPT\
    \ header\nroot@kali:~#\n```\n\ndd操作完成后,插入SD卡/U盘启动Chromebook(不要插在蓝色的USB口!).在开发者引导提示里按CTRL\
    \ + ALT + U引导进入到Kali Linux.用(root / toor)登录到Kali,然后运行**startx**.就这样,大功告成!!\n\n\
    ## Kali在Chromebook上 – 开发指南\n\n如果你是一个开发者,想折腾Kali 三星Chromebook的镜像,包括修改内核配置或更具冒险精神的尝试,请查阅我们的文章[定制Chromebook内核/镜像](http://cn.docs.kali.org/development-cn/%e5%ae%9a%e5%88%b6chromebook%e9%95%9c%e5%83%8f\
    \ \"Custom Kali Chromebook Image\").\n\n# 07\\. Kali Linux开发\n\n# 07\\. Kali Linux开发\n\
    \n# 定制Raspberry Pi镜像\n\n# 定制Raspberry Pi镜像\n\n本文针对开发者描述何如创建一个**定制的Raspberry Pi\
    \ ARM版Kali Linux镜像**的方法.如果你只是想安装Kali镜像,请查阅我们的文章[“安装Kali Linux ARM版到Raspberry Pi”](http://cn.docs.kali.org/general-use/%e5%ae%89%e8%a3%85kali-linux-arm%e7%89%88%e6%9c%ac%e5%88%b0raspberry-pi\
    \ \"Kali on Raspberry Pi\").\n\n### 01\\. 创建Kali rootfs\n\n创建一个**armel**架构的如Kali文档中所述的[Kali\
    \ rootfs](http://cn.docs.kali.org/development-cn/%e5%87%86%e5%a4%87kali-linux-arm-chroot\
    \ \"Kali ARM rootfs\").最后生成的rootfs将位于**~/arm-stuff/rootfs/kali-armel**目录.\n\n\
    ### 02\\. 创建镜像文件\n\n然后,我们创建用于存放我们Raspberry Pi rootfs和boot镜像的物理镜像文件.\n\n```\napt-get\
    \ install kpartx xz-utils sharutils\ncd ~\nmkdir -p arm-stuff\ncd arm-stuff/\n\
    mkdir -p images\ncd images\ndd if=/dev/zero of=kali-custom-rpi.img bs=1MB count=5000\n\
    ```\n\n### 03. 分区并挂载镜像文件\n\n```\nparted kali-custom-rpi.img --script -- mklabel\
    \ msdos\nparted kali-custom-rpi.img --script -- mkpart primary fat32 0 64\nparted\
    \ kali-custom-rpi.img --script -- mkpart primary ext4 64 -1\n```\n\n```\nloopdevice=`losetup\
    \ -f --show kali-custom-rpi.img`\ndevice=`kpartx -va $loopdevice| sed -E 's/.*(loop[0-9])p.*/1/g'\
    \ | head -1`\ndevice=\"/dev/mapper/${device}\"\nbootp=${device}p1\nrootp=${device}p2\n\
    \nmkfs.vfat $bootp\nmkfs.ext4 $rootp\nmkdir -p root\nmkdir -p boot\nmount $rootp\
    \ root\nmount $bootp boot\n```\n\n### 04. 复制和修改Kali rootfs\n\n```\nrsync -HPavz\
    \ /root/arm-stuff/rootfs/kali-armel/ root\necho nameserver 8.8.8.8 > root/etc/resolv.conf\n\
    ```\n\n### 05. 编译Raspberry Pi内核和模块\n\n如果你不是以ARM硬件作为开发环境,需要搭建[ARM交叉编译环境](http://cn.docs.kali.org/development-cn/arm%e4%ba%a4%e5%8f%89%e7%bc%96%e8%af%91\
    \ \"ARM Cross Compilation\")来编译ARM内核和模块.完成后,执行如下命令.\n\n```\ncd ~/arm-stuff\nmkdir\
    \ -p kernel\ncd kernel\ngit clone https://github.com/raspberrypi/tools.git\ngit\
    \ clone https://github.com/raspberrypi/linux.git raspberrypi\ncd raspberrypi\n\
    export ARCH=arm\nexport CROSS_COMPILE=~/arm-stuff/kernel/toolchains/arm-eabi-linaro-4.6.2/bin/arm-eabi-\n\
    make bcmrpi_cutdown_defconfig\n# configure your kernel !\nmake menuconfig\nmake\
    \ -j$(cat /proc/cpuinfo|grep processor|wc -l)\nmake modules_install INSTALL_MOD_PATH=~/arm-stuff/images/root\n\
    cd ../tools/mkimage/\npython imagetool-uncompressed.py ../../raspberrypi/arch/arm/boot/Image\n\
    ```\n\n```\ncd ~/arm-stuff/images\ngit clone git://github.com/raspberrypi/firmware.git\
    \ rpi-firmware\ncp -rf rpi-firmware/boot/* boot/\nrm -rf rpi-firmware\n\ncp ~/arm-stuff/kernel/tools/mkimage/kernel.img\
    \ boot/\necho \"dwc_otg.lpm_enable=0 console=ttyAMA0,115200 kgdboc=ttyAMA0,115200\
    \ console=tty1 root=/dev/mmcblk0p2 rootfstype=ext4 rootwait\" >  boot/cmdline.txt\n\
    ```\n\n```\numount $rootp\numount $bootp\nkpartx -dv $loopdevice\nlosetup -d $loopdevice\n\
    ```\n\n使用**dd**工具克隆这个文件到你的SD卡.在本例中,我们假设存储设备在/dev/sdb.**请按需修改**.\n\n```\ndd if=kali-pi.img\
    \ of=/dev/sdb bs=1M\n```\n\ndd操作完成后,卸载并弹出SD卡.然后启动进入到Kali Linux\n\n# 定制Chromebook镜像\n\
    \n# 定制Chromebook镜像\n\n针对开发者,如下的文档描述我们创建**个性化的Kali Linux Samsung chromebook ARM镜像**的方法.如果你想安装预发的Kali\
    \ image,查阅我们的文档[在三星Chromebook安装Kali](http://cn.docs.kali.org/armel-armhf-cn/%e5%9c%a8%e4%b8%89%e6%98%9fchromebook%e5%ae%89%e8%a3%85kali\
    \ \"Install Kali Samsung Chromebook\").\n\n本文档中,我们创建一个镜像(包含两种引导分区) – 一种分区包含了强制从SD卡引导的内核,另一种包含了强制从USB引导的内核.根据你的USB存储媒介的类型,确保你在用dd把镜像克隆到USB设备后(本指南最后的命令),用更高的优先权标志相关的引导分区.\n\
    \n#### 01\\. 创建Kali rootfs\n\n开始创建我们文档中描述的[Kali rootfs](http://cn.docs.kali.org/development-cn/%e5%87%86%e5%a4%87kali-linux-arm-chroot\
    \ \"Kali ARM rootfs\")使用armhf架构.到文档的最后,在**~/arm-stuff/rootfs/kali-armhf**目录里应该有一个里面包含很多文件的**rootfs**目录.\n\
    \n#### 02\\. 创建镜像文件\n\n下一步,我们创建用于存放我们Chromebook rootfs和引导镜像的物理镜像文件.\n\n```\napt-get\
    \ install kpartx xz-utils gdisk uboot-mkimage u-boot-tools vboot-kernel-utils\
    \ vboot-utils cgpt\ncd ~\nmkdir -p arm-stuff\ncd arm-stuff/\nmkdir -p images\n\
    cd images\ndd if=/dev/zero of=kali-custom-chrome.img bs=1MB count=5000\n```\n\n\
    #### 03. 分区和挂载镜像文件\n\n```\nparted kali-custom-chrome.img --script -- mklabel msdos\n\
    parted kali-custom-chrome.img --script -- mktable gpt\ngdisk kali-custom-chrome.img\
    \ << EOF\nx\nl\n8192\nm\nn\n1\n\n+16M\n7f00\nn\n2\n\n+16M\n7f00\nn\n3\n\nw\ny\n\
    EOF\n```\n\n```\nloopdevice=`losetup -f --show kali-custom-chrome.img`\ndevice=`kpartx\
    \ -va $loopdevice| sed -E 's/.*(loop[0-9])p.*/1/g' | head -1`\ndevice=\"/dev/mapper/${device}\"\
    \nbootp1=${device}p1\nbootp2=${device}p2\nrootp=${device}p3\n\nmkfs.ext4 $rootp\n\
    mkdir -p root\nmount $rootp root\n```\n\n#### 04. 复制和修改Kali rootfs\n\n用**rsync**递归复制先前挂载的Kali\
    \ rootfs镜像.\n\n```\ncd ~/arm-stuff/images/\nrsync -HPavz ~/arm-stuff/rootfs/kali-armhf/\
    \ root\n\necho nameserver 8.8.8.8 > root/etc/resolv.conf\n\nmkdir -p root/etc/X11/xorg.conf.d/\n\
    cat << EOF > root/etc/X11/xorg.conf.d/50-touchpad.conf\nSection \"InputClass\"\
    \n  Identifier \"touchpad\"\n  MatchIsTouchpad \"on\"\n  Option \"FingerHigh\"\
    \ \"5\"\n  Option \"FingerLow\" \"5\"\nEndSection\nEOF\n```\n\n#### 05. 编译三星Chromium内核和模块"
