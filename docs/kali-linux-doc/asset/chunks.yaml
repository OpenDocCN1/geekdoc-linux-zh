    \ too!”或者”+1″.你可以点击ID链接来查看问题的状态.\n\n如果你认为问题和硬件有关,即使类似的硬件也报告过,也请以你的具信息提交一份新的报告.你的硬件与别硬件不一定完全相同.不要以为同样的桌面或者笔记本型号就不可能遇到不一样的问题.\n\
    \n#### 创建报告\n\n开始你的报告,登入你的帐户然后点击登录页面上的”Report Issue”.你需要填尽可能多的信息.必要时请查看本文前面提出的那几点要求.\n\
    \n报告中必须包含以下字段:\n\n*   Category(分类)\n\n*   Summary(摘要)\n\n*   Description(描述)\n\
    \n其它字段不是必须的,但我们请特别多注意下面每个选项:\n\n*   Reproducibility(重现性)\n\n*   Select Profile(选择资料)\n\
    \n*   Steps to Reproduce(重现步骤)\n\n*   Additional Information(附加信息)\n\n*   Upload\
    \ File (error logs, screenshot)-上传文件(错误日志,屏幕截图)\n\n#### 选择适当的分类\n\n目前Kali的问题被分为4类.报告问题之前请先确定它的类别:\n\
    \n*   General Bug(一般问题)\n\n*   Kali Package Bug(Kali软件包问题)\n\n*   New Tool Requests(请求添加新工具)\n\
    \n*   Tool Upgrade(工具升级)\n\n不要提出问题追踪系统不支持的请求.Kali Linux提供许多可选的支持,包括[http://docs.kali.org](http://docs.kali.org)\
    \ , [https://forums.kali.org](https://forums.kali.org)和freenode上的IRC聊天室(#kali-linux).\n\
    \n#### 提供一个描述性的摘要\n\n摘要字段本质上是一个问题报告的”名字”,Kali开发者和其它访问者会第一个看它.提供一个简短但具描述性的摘要可以描述问题或者明确要求.\n\
    \nGood: Chromium Package installed from Repo will not run as root user(优:从源安装的Chromium软件包不能用root运行)\n\
    \nBad: Chromium doesn’t work(劣:chromium不能运行)\n\n摘要不应该包括所有东西,除非必须要包含它才能传达你提交报告的原因.\n\
    \n#### 使用dpkg为问题报告找到软件包和软件版本\n\n你可以用dpkg参数组合找到安装过哪个软件包.在你的报告中列入这些命令的输出结果很重要.输出结果也可以以文本文件格式上传.(在本文后面讨论).\n\
    \n*   search\n\n*   list\n\n*   status\n\n例子的输出:\n\n```\nroot@kali:~# which chromium\n\
    /usr/bin/chromium\nroot@kali:~# type chromium\nchromium is /usr/bin/chromium\n\
    root@kali:~# dpkg --search /usr/bin/chromium\nchromium: /usr/bin/chromium\nroot@kali:~#\
    \ dpkg --list chromium\nDesired=Unknown/Install/Remove/Purge/Hold\n| Status=Not/Inst/Conf-files/Unpacked/halF-conf/Half-inst/trig-aWait/Trig-pend\n\
    |/ Err?=(none)/Reinst-required (Status,Err: uppercase=bad)\n||/ Name         \
    \  Version      Architecture Description\n+++-==============-============-============-=================================\n\
    ii  chromium       24.0.1312.68 amd64        Google open source chromium web\n\
    root@kali:~# dpkg --status chromium\nPackage: chromium\nStatus: install ok installed\n\
    Priority: optional\nSection: web\nInstalled-Size: 98439\nMaintainer: Debian Chromium\
    \ Maintainers <pkg-chromium-maint@lists.alioth.debian.org>\nArchitecture: amd64\n\
    Source: chromium-browser\nVersion: 24.0.1312.68-1\n…Output Truncated…\n```\n\n\
    #### 建立描述方案\n\n现在是提交经过你深思熟虑的报告的时候了.尽可能多的提供细节和结果.\n\n请务必在适当的地方包含如下内容:\n\n*   任何错误信息的准确并完整的文本(屏幕截图或日志文件)\n\
    \n*   你具体输入了什么或者做过什么产生的问题\n\n*   如果可以,提供一个修复建议或者补丁\n\n*   软件包的版本和与依赖包有关系的任何信息\n\
    \n*   内核版本,C共享库,或者别看起来合适的资料\n\n*   uname –a\n\n*   dpkg -s libc6 | grep ^Version\n\
    \n*   适当的时候,软件版本(例如 python -V)\n\n*   你的硬件信息\n\n*   如果你要报告硬件驱动问题,请列出你所有的硬件信息\n\
    \n*   在你系统上安装源里的lshw报告完整的硬件信息\n\n*   添加其它相关的资料\n\n*   别为报告”太长”而担心,只要是相关信息,有比没有更好.\n\
    \n##### 例子\n\nPackage: Chromium\n\nArchitecture: amd64\n\nMaintainer: Debian Chromium\
    \ Maintainers\n\nSource: chromium-browser\n\nVersion: 24.0.1312.68-1\n\nI installed\
    \ the chromium web browser from the Kali Linux repos, using the command ‘apt-get\
    \ install chromium’. I launched the program from the Kali menu by selecting Applications/Internet/Chromium\
    \ Web Browser. Chromium did not launch as expected, instead it provided an error\
    \ pop-up window.\n\nThe error message stated, “Chromium cannot be run as root.\
    \ Please start Chromium as a normal user. To run as root, you must specify an\
    \ alternate –user-data-dir for storage of profile information”.\n\nI clicked the\
    \ Close button to close the pop up window.\n\nuname –a output: Linux kali 3.7-trunk-amd64\
    \ #1 SMP Debian 3.7.2+kali6 x86_64 GNU/Linux\n\nC Library Version: 2.13-38\n\n\
    #### 再现性的重要\n\nKali Linux问题追踪系统允许你提交被报告的问题出现频率.如果你提交一个要求添加新工具或工具更新的请求,简单的在下拉菜单选择N/A.如果提交问题,请提供相应的回答.\n\
    \n继续回到上面的例子,Chromium设计成无法用root启动，你可以从下拉菜单选择“总是”.\n\n你提供了一个准确的反馈,这很重要,如果Kali开发者试图重现该问题,他们需要知道该问题的发生的频率.如果出问题的频率是偶尔,但你却标着总是,开发者可能会因为测试时没遇到问题而草率地关闭这个报告.\n\
    \n#### 选择适当的资料\n\n如上所述,为每一个报告的问题使用一个自定义的资料是最好的.如果没有创建自定义资料,从下拉菜单中选择相应的资料.在本指南发布时,下列选项是可用的.\n\
    \n*   armel Kali 1.0\n\n*   armhf Kali 1.0\n\n*   x64 Kali 1.0\n\n*   x86 Kali\
    \ 1.0\n\n#### 提供重现该问题的步骤\n\n与描述部分相比这部分虽然看起来可能是多余的,但这部分只包含重现该问题采取的步骤.一些步骤可能只起辅助作用,但它们很重要务必尽力写.可能缺少的就是那个重现问题必需的步骤.\n\
    \n##### 例子:\n\n1.  Opened a terminal window by selecting Applications/Accessories/Terminal\n\
    \n2.  Typed ‘apt-get install chromium’ in the terminal and hit enter to run the\
    \ command\n\n3.  Attempted to run Chromium web browser by selecting Applications/Internet/Chromium\
    \ Web Browser\n\n#### 提供更多信息\n\n在这部分你可以提供与问题相关的更多的信息.如果你有修复问题的方法,请在这部分提供它.同样的,坚持事实和正确的写步骤很重要,以便开发者能重现.\n\
    \n##### 例子:\n\nThere is a simple fix that is well documented on several forums.\
    \ I tried it and it fixed the issue for me.\n\n*   Using a text editor open /etc/chromium/default\n\
    \n*   Add –user-data-dir flag\n\n*   i.e. CHROMIUM_FLAGS=”–user-data-dir”\n\n\
    Can this be patched within the repo version of Chromium so adding this flag is\
    \ not required for future releases?\n\n#### 上传相关文件\n\n有时提供不是很容易提供的信息给开发组很重要.报告的这部分允许你添加屏幕截图或者日志文件.注意文件的大小限制.\n\
    \n你可以点击”Choose FIle”按钮来添加一个文件.它会打开系统的文件管理器然后上传你选择的文件.选好文件之后点击”打开”按钮返回你的报告,然后点击”Upload\
    \ File”按钮.\n\n#### 提交报告\n\n至此,你已经准备好提交报告了.剩下的就是点击”Submit Report”按钮.你的报告会被提交然后分配到一个tracking\
    \ ID(追踪ID).报告会在你的”My View”页面下的”Reported by Me”看见.你可以跟踪问题的解决.\n\n#### 摘要\n\n问题报告的目的是帮助开发者用他们的双眼看到错误.你可以通过提供详细的说明让他们和你一起亲自看到错误.\n\
    \n详细描述一切,陈述采取了什么步骤,看到了什么,除了你期盼的结果外你做了什么.\n\n尝试通过研究找到问题或解决办法.如果你可以为你的系统提供一个解决问题的方案,就可以给开发者提供同等级的问题报告.让开发者知道你到底做过什么很重要,以便让他们成功地重复过程.这不该成为你解决异常问题的绊脚石.\n\
    \n准确,清晰,简明扼要地写报告,以确保开发者不会误解你的意思.\n\n开发者不会忽悠你,准备好额外的信息以便他们问起.\n\n请对你的请求有耐心,开发者像你一样也想修复问题.我们热爱我们的工作并以继续让Kali成为有史以来最尖端的渗透测试发行版为骄傲.\n\
    \n这篇文章由如下的资源按需修改而成:\n\n[http://www.chiark.greenend.org.uk/~sgtatham/bugs.html](http://www.chiark.greenend.org.uk/~sgtatham/bugs.html\
    \ \"How to Report Bugs Effectively\") – Fetched March 20,2013 [https://help.ubuntu.com/community/ReportingBugs](https://help.ubuntu.com/community/ReportingBugs\
    \ \"ReportingBugs\") – Fetched March 20,2013 [http://www.debian.org/Bugs/Reporting](http://www.debian.org/Bugs/Reporting\
    \ \"How to report a bug in Debian using reportbug\") – Fetched March 20,2013\n\
    \n# Kali Linux官方镜像\n\n# Kali Linux官方镜像\n\n## 官方源的使用\n\nKali Linux提供了3类软件源,这些源在世界各地都有镜像:\n\
    \n*   [http.kali.org](http://http.kali.org) ([镜像列表](http://http.kali.org/README.mirrorlist)):\
    \ 主要安装包软件源;"
