    \n1.  开始安装,从你选择的安装媒介启动. 你会看到Kali的引导界面.选择*Live*,然后你会进入到Kali Linux桌面.\n\n2.  使用用户名**root**,和密码**toor**登录.下一步运行**gparted**程序.我们将用**gparted**缩小windows分区的大小以提供足够的空间安装Kali.\n\
