    \ Linux内核来解决问题.\n\n# 从源代码编译包\n\n# 从源代码编译包\n\n有时,我们需要从源代码重新编译一个Kali包.幸运的是用APT下载源代码包,进行必要的修改后再用Debian工具重新编译是如此的简单.此例中,为了添加额外的Mifare\
