    \ Linux\n\n# 用Live U盘安装Kali Linux\n\n从U盘启动然后安装Kali是我们最喜欢并且是运行Kali最快(容易)的方法.为此,我们首先要把Kali的ISO克隆到U盘.如果你经常使用Kali\
    \ Linux U盘,请在克隆前阅读完整的文档.\n\n## 准备USB镜象\n\n1.  [下载Kali linux](http://cn.docs.kali.org/general-use/%e4%b8%8b%e8%bd%bd%e5%ae%98%e6%96%b9kali%e9%95%9c%e5%83%8f\
    \ \"Download Official Kali Images\").\n\n2.  如果你用的是Windows,下载[Win32 Disk Imager](https://launchpad.net/win32-image-writer\
    \ \"Win32 Disk Imager\").\n\n3.  *nix类系统不需要额外的软件.\n\n4.  一块U盘(至少 2GB 容量).\n\n\
    ## Kali Linux Live U盘安装过程\n\n#### 在用Windows的电脑上克隆Kali\n\n1.  插入U盘.运行Win32 Disk\
    \ Imager.\n\n2.  选择Kali Linux ISO文件作为被克隆的文件,然后核实要克隆的U盘是否正确.\n\n[![kali-usb-install-windows](kali-usb-install-windows.png)](kali-usb-install-windows.png)\n\
    \n1.  克隆完成后,从Windows机器安全弹出U盘.现在你可以用U盘启动Kali Linux了.\n\n#### 在用Linux的电脑上克隆Kali\n\
    \n在Linux环境下制作可启动的Kali Linux U盘很容易.下载好Kali ISO文件后,你可以用dd把它克隆到U盘:\n\n警告！虽然在U盘上克隆Kali过程很简单,但是如果你不懂你正在用dd做什么,很容易破坏引导分区.\n\
    \n1.  插入U盘.\n\n2.  用**dmesg**确认你的U盘设备块名.\n\n3.  开始克隆Kali ISO文件到U盘(谨慎操作！):\n\n\
    \    ```\n    dd if=kali.iso of=/dev/sdb bs=512k\n    ```\n\n就这样!你现在可以用U盘启动到Kali\
    \ Live/Installer环境了.\n\n## 为你的U盘添加Persistence功能\n\n在某些情况下.为你的Kali Linux镜象添加persistence功能(在Live启动的时候可以保存和修改文件)非常有用.为了给你的Kali\
    \ Linux U盘启动persistent功能,按照以下步骤.**本例中,我们假设我们的设备块名是/dev/sdb**.如果你想添加persistence功能,需要一块比上面提到的要求更大容量的U盘.\n\
    \n1.  克隆Kali Linux ISO到U盘和上面讲解的一样,用dd在”用Linux的电脑上克隆Kali”.\n\n2.  在U盘创建并格式化额外的分区.本例中我们用**gparted**\n\
    \n    ```\n    gparted /dev/sdb\n    ```\n\n3.  现在你的分区方案应该和下图类似:\n\n    [![usb-persistence-basic-partitioning](usb-persistence-basic-partitioning.png)](usb-persistence-basic-partitioning.png)\n\
    \n4.  着手于格式化一个你要用于persistence功能的理想大小的新分区.在此例,我们使用所有剩余可用空间.确保新创建的分区卷名是*persistence*然后格式化成*ext4*文件系统.\
    \ [![usb-persistence-creating-partition](usb-persistence-creating-partition.png)](usb-persistence-creating-partition.png)\n\
    \n5.  这步完成后,用以下命令挂载用于persistence功能的U盘分区:\n\n    ```\n    mkdir /mnt/usb\n    mount\
    \ /dev/sdb2 /mnt/usb\n    echo \"/ union\" &gt;&gt; /mnt/usb/persistence.conf\n\
    \    umount /mnt/usb\n    ```\n\n6.  插入U盘到你要启动的电脑.务必设置BIOS从USB设备启动.当显示Kali Linux启动画面时,从菜单选择“Live\
    \ boot”(不要按下回车),然后按下Tab键.这将允许你编辑启动参数,在每次你想挂载你的persistent 存储时添加“persistence”到boot参数行的最后.\
    \ [![usb-persistence](usb-persistence.png)](usb-persistence.png)\n\n# 02. 制作定制的Kali镜象\n\
    \n# 02. 制作定制的Kali镜象\n\n# 03\\. 安装Kali Linux\n\n# 03\\. 安装Kali Linux\n\n# 无线驱动疑难排解\n\
    \n# 无线驱动疑难排解\n\n如果你不确定你在找什么,那么Linux的无线驱动问题的疑难排解将会是个挫折.本文将以一般指引的方式来帮助你更好的找到解决无线问题所需要的信息.\n\
    \n仔细的阅读错误信息,经常能告诉你怎么回事和如何解决.或者,使用Google.\n\n### 1\\. 没有网卡\n\n*   愚蠢的问题:它是无线网卡吗?(我们见过很多次了)\n\
    \n*   无线网卡插好了吗?\n\n*   **lsusb**或者**lspci**能看到它吗(手机除外)?可能需要更新pci ids和usb ids\n\
    \n*   **dmesg**里有关于加载驱动或加载失败的信息吗\n\n*   是Kali的虚拟机吗?如果是,除非你的是USB网卡,否则不可用(VMWare/VirtualBox/QEMU会虚拟每个PCI硬件).USB网卡连到虚拟机了吗?\n\
    \n*   如果dmesg里没有信息并且不是虚拟机,那么你可能需要试试最新的*Compat-wireless*(有时需要固件)->检查linux无线驱动\n\
    \n### 2. 有网卡但不能做任何事\n\n*   看错误信息\n\n*   如果没有错误信息,就执行**dmesg|tail**,可能会告诉你怎么回事\n\
    \n*   可能缺少固件\n\n*   检查rfkill和硬件开关还有BIOS选项\n\n### 3\\. 没有监听模式\n\n*   STA驱动(Ralink,\
    \ Broadcom)还有其他厂商生产提供的驱动都不支持监听模式\n\n*   ndiswrapper 不支持监听模式.永远不会.\n\n*   Airodump-ng/Wireshark\
    \ 不显示任何信息:检查rfkill和硬件开关还有BIOS选项\n\n### 4\\. 注入\n\n*   用aireplay-ng -9测试(用airmon-ng确定网卡处于监听模式)\n\
    \n*   Airmon-ng不显示芯片信息:这不是大问题,只是不能获取网卡的信息,不会影响网卡的功能.\n\n*   处于监听模式但不能注入:检查rfkill和硬件开关还有BIOS选项\n\
    \n*   网络管理器有时和Aircrack工具包有冲突.运行**airmon-ng check kill**来杀掉这些进程.\n\n### 附加链接\n\n\
    *   [Will my card work with Aircrack-ng?](http://aircrack-ng.blogspot.com/2012/10/will-my-card-work-with-aircrack-ng.html\
    \ \"Aircrack Compatibility\")\n\n*   [Compat-wireless](http://aircrack-ng.blogspot.com/2012/03/compat-wireless.html\
    \ \"Linux compat-wireless\")\n\n# 用Mini ISO通过网络安装Kali Linux\n\n# 用Mini ISO通过网络安装Kali\
    \ Linux\n\n## 用Mini ISO安装Kali Linux\n\n用Kali mini ISO可以方便地”从头”开始安装一个最小化的Linux.Mini\
    \ ISO会从我们的源下载所需的软件包,这意味着要使用这种安装方式你需要一个快速的网络.\n\n#### 安装条件\n\n*   安装Kali Linux最少8G硬盘可用空间.\n\
    \n*   i386和amd64架构,最低512MB内存.\n\n*   CD-DVD光驱/支持USB引导\n\n### 准备安装"
