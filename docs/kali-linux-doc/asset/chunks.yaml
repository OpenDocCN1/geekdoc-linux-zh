    \ ISO 镜像源。\n\n当你使用以上的 3 个域名做源时,会自动连接到离你最近的与官方同步的镜像。如果你要手动选择一个镜像，请点击上面域名旁的*镜像列表*，选一个合适你的。\n\
    \n# Kali Linux 镜像的架设\n\n## 要求\n\n要架设一个 Kali Linux 的官方镜像源,你需要一台运行`rsync`和`ssh`，大硬盘\
    \ ,大带宽的服务器。截至 2013-03-14，主要安装包软件源大约 160G，ISO 镜像源大约 10G。但应该考虑到这些数字在不停的增长。我们希望你通过`HTTP`、`FTP`或`RSYNC`之一来同步镜像文件，所以必须安装相应的服务。\n\
    \n## 软件包档案的同步推送\n\n当官方源有更新时会用基于 SSH 的触发器 ping 镜像。一般每天 4 次。\n\n如果你还没有专用于镜像的帐号，先创建一个。（本例子中我们专用于镜像的专用用户是“archvsync”）：：\n\
    \n```bash\n$ sudo adduser --disabled-password archvsync\nAdding user 'archvsync'\
    \ ...\n[...]\nIs the information correct? [Y/n]\n```\n\n创建用于存放镜像的目录，然后修改目录属主为刚才创建的专用用户：\n\
    \n```bash\n$ sudo mkdir /srv/mirrors/kali{,-security,-images}\n$ sudo chown archvsync:archvsync\
    \ /srv/mirrors/kali{,-security,-images}\n```\n\n下一步配置`rsync`后台程序(按需启用后台运行)导出这些目录：\n\
    \n```bash\n$ sudo sed -i -e \"s/ENABLED=false/ENABLED=true/\" /etc/default/rsync\n\
    $ sudo vim /etc/rsyncd.conf\n$ cat /etc/rsyncd.conf\nuid = nobody\ngid = nogroup\n\
    max connections = 25\nsocket options = SO_KEEPALIVE\n\n[kali]\n  path = /srv/mirrors/kali\n\
    \  comment = The Kali Archive\n  read only = true\n\n[kali-security]\n  path =\
    \ /srv/mirrors/kali-security\n  comment = The Kali security archive\n  read only\
    \ = true\n\n[kali-images]\n  path = /srv/mirrors/kali-images\n  comment = The\
    \ Kali ISO images\n  read only = true\n$ sudo service rsync start\nStarting rsync\
    \ daemon: rsync.\n```\n\n这个文档不包括 WEB 服务器和 FTP 服务器的配置。理论上你应该导出镜像到 [`yourmirror.net/kali`](http://yourmirror.net/kali)，[http://yourmirror.net/kali-security]和[`yourmirror.net/kali-images`](http://yourmirror.net/kali-security\
    \ 和 http://yourmirror.net/kali-images) (FTP 也一样)。现在是有趣的部分：专用用户处理 SSH 触发器配置和镜像站点的搭建。首先应该用专用用户解压[ftpsync.tar.gz](http://archive.kali.org/ftpsync.tar.gz)：\n\
    \n```bash\n$ sudo su - archvsync\n$ wget http://archive.kali.org/ftpsync.tar.gz\n\
    $ tar zxf ftpsync.tar.gz\n```\n\n现在我们要创建两个配置文件。在模板的基础上至少要修改`MIRRORNAME`、`TO`、`RSYNC_PATH`和`RSYNC_HOST`这几个参数：\n\
    \n```bash\n$ cp etc/ftpsync.conf.template etc/ftpsync-kali.conf\n$ cp etc/ftpsync.conf.template\
    \ etc/ftpsync-kali-security.conf\n$ vim etc/ftpsync-kali.conf\n$ grep -E '^[^#]'\
    \ etc/ftpsync-kali.conf \nMIRRORNAME=`hostname -f`\nTO=\"/srv/mirrors/kali/\"\n\
    RSYNC_PATH=\"kali\"\nRSYNC_HOST=archive.kali.org\n$ vim etc/ftpsync-kali-security.conf\n\
    $ grep -E '^[^#]' etc/ftpsync-kali-security.conf \nMIRRORNAME=`hostname -f`\n\
    TO=\"/srv/mirrors/kali-security/\"\nRSYNC_PATH=\"kali-security\"\nRSYNC_HOST=archive.kali.org\n\
    ```\n\n最后一步建立`.ssh/authorized_keys`以便`archive.kali.org`能触发你的镜像：\n\n```bash\n$\
    \ mkdir -p .ssh\n$ wget -O - -q http://archive.kali.org/pushmirror.pub >>.ssh/authorized_keys\n\
    ```\n\n如果你的`ftpsync.tar.gz`不是解压到 home 目录，那么你要修正`.ssh/authorized_keys`中的`~/bin/ftpsync`为相应的路径。现在发一封包含你的镜像\
    \ URL 的 email 到 devel@kali.org，以便把你的镜像加入镜像列表。请明确的指出当镜像出现问题（或要进行更改/协商镜像的配置）时我们该联系谁。与其等待`archive.kali.org`的第一次推送，不如先用离你近的源进行`rsync`初始化同步，选择上面镜像列表里的任意一个镜像。假设你选了`archive-4.kali.org`，那么你应该以专用用户权限运行如下命令：\n\
    \n```bash\n$ rsync -qaH archive-4.kali.org::kali /srv/mirrors/kali/\n$ rsync -qaH\
    \ archive-4.kali.org::kali-security /srv/mirrors/kali-security/\n$ rsync -qaH\
    \ archive-4.kali.org::kali-images /srv/mirrors/kali-images/\n```\n\n## 手工同步镜像\n\
    \nISO 镜像源不推送模式，所以你要建立一个每日运行`rsync`任务。我们提供了一个直接用的脚本`bin/mirror-images`，只要配置`etc/mirror-images.conf`，再添加到`crontab`。\n\
    \n```bash\n$ sudo su - archvsync\n$ cp etc/mirror-images.conf.sample etc/mirror-images.conf\n\
    $ vim etc/mirror-images.conf\n$ grep -E '^[^#]' etc/mirror-images.conf\nTO=/srv/mirrors/kali-images/\n\
    $ crontab -e\n$ crontab -l\n# h  9 * * * ~/bin/mirror-images\n```\n"
