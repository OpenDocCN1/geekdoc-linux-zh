  trans: "\n安装 Kali Linux 到你的电脑过程非常简单。首先你需要兼容的电脑硬件。Kali 支持 `i386`、`amd64` 和 `ARM`\
    \ (`armel`和`armhf`) 平台。最低硬件要求如下，硬件性能越好越好。`i386`镜像默认使用 `PAE`内核，所以你能在大于 4GB 内存的机器上运行它。[下载\
    \ Kali Linux](http://cn.docs.kali.org/general-use/%e4%b8%8b%e8%bd%bd%e5%ae%98%e6%96%b9kali%e9%95%9c%e5%83%8f\
    \ \"Download Official Kali Images\")然后刻录 DVD 盘，或者[准备好一块 Kali Linux Live U 盘](http://docs.kali.org/installation/kali-linux-live-usb-install\
    \ \"Kali Linux Live USB Install\")作为安装媒介。如果你的电脑没有 DVD 光驱或者 USB 端口，请参考[Kali Linux\
    \ 网络安装](http://docs.kali.org/network-install/kali-linux-network-pxe-install \"\
    Kali Linux Network PXE Install\")\n\n## 安装条件\n\n*   安装 Kali Linux 最少需要 8G 硬盘可用空间。\n\
    *   `i386`和`amd64`架构，最低 512MB 内存。\n*   CD-DVD 光驱/支持 USB 引导\n\n## 准备安装\n\n1.  [下载\
    \ Kali linux](http://cn.docs.kali.org/general-use/%e4%b8%8b%e8%bd%bd%e5%ae%98%e6%96%b9kali%e9%95%9c%e5%83%8f\
    \ \"Download Official Kali Images\")。\n2.  把 Kali Linux 刻录到 DVD 盘或[制作 Kali Linux\
    \ 镜像 U 盘](http://docs.kali.org/installation/kali-linux-live-usb-install \"Kali\
    \ Linux Live USB Install\")。\n3.  确认你电脑的 BIOS 设置了从 CD/USB 引导。\n\n## Kali Linux\
    \ 安装步骤\n\n1.  开始安装，从你选择的安装媒介启动。你会看到 Kali 的引导界面。选择图形界面安装或者文本模式安装。此处，我们选择图形界面安装。\n\
    \n    ![Kali Install](img/Kali-Install.png)\n\n2.  选择你的首选语言和国家。你会被提示为你的键盘配置适当的`Keymap`。\n\
    \n    ![localechooser_languagelist_0](img/localechooser_languagelist_0.png)\n\n\
    3.  安装器会复制镜象到你的硬盘，探测你的网络接口，然后提示你为你的系统输入主机名。此例，我们输入“Kali”作为主机名。\n\n    ![netcfg_get_hostname_0](img/netcfg_get_hostname_0.png)\n\
    \n4.  为`root`账户输入一个强健的密码，或需要的话创建额外的账户。\n\n    ![kali-linux-install-02](img/passwd_root-password_0.png)\n\
    \n5.  下一步设置时区。\n\n    ![time_zone_0](img/time_zone_0.png)\n\n6.  安装器会检测硬盘，并提供\
    \ 4 个选项。此例，我们使用电脑的整块硬盘，并且不设置`LVM`(逻辑卷管理器)。高级用户可以使用“手动”分区，配置自己的分区结构。\n\n    ![partman-auto_init_automatically_partition_0](img/partman-auto_init_automatically_partition_0.png)\n\
    \n7.  接着在安装器作出不可逆的改变之前你会有机会检查硬盘配置。在你点击继续按钮后，安装器将开始工作，并且安装也快接近尾声。\n\n    ![kali-linux-install-03](img/partman_confirm_0.png)\n\
    \n8.  配置网络`Mirrors`。Kali 使用中心源发布软件。在必要的时候你需要输入适当的代理信息。\n\n    **注意！如果你选择了“NO”，你将**不能**从\
    \ Kali 源安装软件。\n\n    ![kali-linux-install-04](img/apt-setup_use_mirror_0.png)\n\
    \n9.  下一步安装`GRUB`。\n\n    ![kali-linux-install-05](img/grub-installer_only_debian_0.png)\n\
    \n10. 最后，点击继续来重启系统，进入全新安装的 Kali。\n\n    ![finish-install_reboot_in_progress_0](img/finish-install_reboot_in_progress_0.png)\n\
    \n## 安装后\n\n现在你已经完成了 Kali Linux 的安装，是时候定制你的系统了。官方网站上的[Kali 常见问题](http://cn.docs.kali.org/category/general-use-cn)里有更多信息，你还会在[用户论坛](http://forums.kali.org/\
    \ \"User Forums\")里找到更多的小技巧。\n\n# 04. 通过网络安装 Kali Linux\n\n# 05. Kali Linux 常见问题\n\
    \n# Virtual Box 的 Kali Linux 虚拟机\n\n如果你想在`VirtualBOX`里安装 Kali Linux，为了能够顺利安装功能增强工具，请参考如下的指南。\n\
    \n建议使用最新版的`VirtualBOX`，因为可以提升用户体验，包括核心和客户端增强的稳定性。\n\n## 在 Virtual Box 的 Kali Linux\
    \ 虚拟机安装增强工具\n\n为了与宿主机共享目录，你应该安装 VirtualBox 增强工具。\n\n启动 Kali 虚拟机后，打开一个终端执行如下命令来安装内核头：\n\
    \n```\napt-get update && apt-get install -y linux-headers-$(uname -r)\n```\n\n\
    安装完，从 VirtualBox 菜单的“Devices”选择“Guest Additions”挂载 ISO 到虚拟机的光驱。提示自动运行时点击取消。\n\n\
    ![VirtualBox-Cancel-Auto-Run](img/Figure17-Auto-Run.png)\n\n在终端窗口，复制 CD 里的`VBoxAdditions.run`到本地目录，确认有执行权限然后运行该文件：\n\
    \n```bash\ncp /media/cdrom/VBoxAdditions.run /root/\nchmod 755 /root/VBoxAdditions.run\n\
    cd /root\n./VBoxAdditions.run\n```\n\n![VirtualBox-Additions-Install](img/Figure19-Additions-Install.png)\n\
    \n增强工具安装后重启 Kali 虚拟机。现在可以共享宿主机目录了。\n\n## 创建宿机的共享目录\n\n为了给 Kali 虚拟机共享宿主机上的目录，有一些步骤要完成：在虚拟机管理器，选择\
    \ Kali 虚拟机然后点击右键菜单的‘Shared Folders’。会弹出一个添加共享目录的窗口。在这个窗口里点击图标，在`Folder Path`文本框显示路径或点击下拉菜单浏览宿主机系统。勾选`Auto-mount`(自动挂载）和`Make\
    \ Permanent`(永久）框，有提示时点击 OK 按钮。\n\n![Shared-folder-config](img/Figure20-Shared-folder-config.png)\n\
    \n现在共享目录出现在`/media`里，为了方便进入这个目录你可以创建一个书签。\n\n![VirtualBox-Shared-folder-in-Kali](img/Figure21-Shared-folder-in-Kali.png)\n\
    \n# 0. 运行 Metasploit Framework\n\n依照[Kali Linux 网络策略](http://docs.kali.org/kali-linux-network-service\
    \ \"Kali Linux Network Services\"),Kali 没有自动启动网络服务包括数据库。为了让`Metasploit`(http://www.metploit.com\
    \ \"Metasploit\")以数据库的方式运行必要的步骤：\n\n## 启动 Kali 的 PostgreSQL 服务\n\n使用`PostgreSQL`(http://www.postgresql.org\
    \ \"PostgreSQL\")作为数据库，先运行它：\n\n```bash\nservice postgresql start\n```\n\n你可以用`ss\
    \ -ant`输出 PostgreSQL 是否运行，然后确认 5432 端口处于 listening。\n\n```\nState Recv-Q Local\
    \ Address:Port Peer:Port\nLISTEN 0 128 :::22 *\nLISTEN 0 128 :::5432 *\nLISTEN\
    \ 0 127.0.0.1:5432 *\nLISTEN 0 ::5432 *\n```\n\n## 启动 Kali 的 asploit 服务\n\n随着\
    \ PostgreSQL 的启动和运行，接着我们要运行 Metasploit。第一次运行会创建一个 msf 数据库并运行它。\n\n```bash\nservice\
    \ metasploit\n```\n\n## 在 Kali 运行 msfconsole\n\n现在 PostgreSQL 和 Metasploit 服务都运行了，可以运行`msfconsole`，然后用`db_status`命令检验数据库的连通性。\n\
    \n```\nmsfconsole\nmsf > db_status\n```\n\n## 配置 Metasploit 随系统运行\n\n如果你想 PostgreSQL\
    \ 和 Metasploit 在开机时运行，你可以使用`update-rc.d`启用：\n\n```bash\nupdate-rc.d postgresql\
    \ enable\nupdate-rc.d metasploit enable\n```\n\n## Kali 虚拟机安装 VMware Tools\n\n\
    建议你自己创建一个 Kali Linux 的虚拟机，而不是使用预提供的镜像，进行如下操作以便 Kali 虚拟机成功安装 VMware Tools。你可以选择安装\
    \ open-tools，或自带的 VMware tools。\n\n## 安装 open-tools\n\n`open-tools`是在 Kali 虚拟机里实现“VMware\
    \ Tools”功能容易的方法。\n\n```bash\napt-get install open-tools\n```\n\n## 在 Kali 里安装\
    \ VMware Tools\n\n如果 open-tools 不能用，或者你更偏于使用 VMware Tools，开始安装一些 VMware Tools\
    \ 需要的包：\n\n```bash\napt-get install make linux-headers-$(uname -r)\nln -s /src/linux-headers-$(uname\
    \ -r)/generated/uapi/linux/version.h /usr/src/linux-headers-$(uname -r)/include/linux\n\
    ```\n\n下一步，点击菜单里的“Install VMware Tools”挂载 VMware Tools 的 ISO。虚拟机的光驱连接到 VMware\
    \ Tools 后，我们挂载驱动器然后复制 VMware Tools 安装器到`/tmp/`。\n\n```bash\nmkdir /mnt/vmware\n\
    mount /dev/cdrom /mnt/vmware/\ncp -rf /mnt/vmware/VMwareTools* /tmp/\ncd /tmp\n\
    ```\n\n# 06. Kali ARM 文档\n\n# 在 MK/SS808 上安装 Kali ARM\n\n![SS808](img/SS808.png)\n\
    \nSainSmart SS808 是一种基于`rockchip`芯片的 ARM 设备。它搭载了一个双核 1.6GHz 的 A9 处理，还有 1G 内存，能很好的运行\
    \ Kali。\n\n## 存储 Kali 在 SS808 – 简单版\n\n如果你想安装 Kali 到你的 SS808，按照下列步骤:\n\n1.  一张至少\
    \ 8G 的高速 SD 卡，最好是 Class 10 的。\n2.  在我们的[下载区](http://www.kali.org/downloads/ \"\
    Kali Linux Downloads\")下载 Kali Linux SS808 镜像。\n"
- fmt: "\n# SS808上的Kali – 复杂版\n\n如果你是个开发者,你想修改Kali Linux SS808的镜象,包括修改内核配置,查阅我们的文章[“定制\
    \ MK/SS808镜像”](http://docs.kali.org/?p=996 \"Custom Kali SS808 Image\")。\n\n##\
    \ 在三星Chromebook安装Kali\n\n![Samsung Chrome Book](chromebook.png)\n\n三星ARM chromebook是一台超级本.很具挑战性,但我们的Kali镜像在Chromebook上运运行得很好.\n\
    \n我们的Chromebook Kali镜像包含两种引导分区,其中一种的内核强制从SD卡引导,另一种的内核强制从USB引导.根据你使用哪种类型的USB存储媒介,在`dd`命令把镜像克隆到USB设备后,确定如何给引导分区标记更高的优先权,本指南的最后阶段将会提及。\n\
    \n## Kali在Chromebook上 – 用户指南\n\n如果你想安装Kali到你的Samsung ARM Chromebook,按照下列步骤:\n\n\
    1. 准备一块高速的8G SD卡或U盘。\n2. 把Chromebook设置成开发者模式。\n3. 从我们的[downloads](http://www.kali.org/downloads/\
    \ \"Kali Linux Downloads\")下载Kali的Samsung ARM Chromebook镜像。\n4. 用`dd`命令把镜象文件克隆到SD卡.本例中,假设存储设备的设备块名是`/dev/sdb`。**根据情况,自行更改**。\n\
    \n> **警告!**这步将会擦除SD卡内的数据,如果选择了错误的存储设备,会导致硬盘数据丢失。\n\n```\ndd if=kali-chromebook.img\
    \ of=/dev/sdb bs=512k\n```\n\n这步需要的时间取决于USB存储设备的速度和镜象的大小。\n\n就是这里,你要给分区1或是分区2标记更高的优先权.数字大则有更高的优先权.如下的例子将把第一个分区(用`-i`参数)的优先权设置成10,因为我们要从SD卡引导。\n\
    \n```bash\ncgpt repair /dev/sdb\ncgpt add -i 1 -S 1 -T 5 -P 10 -l KERN-A /dev/sdb\n\
    cgpt add -i 2 -S 1 -T 5 -P 5 -l KERN-B  /dev/sdb\n```\n\n使用`cgpt show`命令查看分区的列表和引导顺序。\n\
    \n```bash\nroot@kali:~# cgpt show /dev/sdb\n       start        size    part \
    \ contents\n           0           1          PMBR\n           1           1 \
    \         Pri GPT header\n           2          32          Pri GPT table\n  \
    \      8192       32768       1  Label: \"KERN-A\"\n                         \
    \         Type: ChromeOS kernel\n                                  UUID: 63AD6EC9-AD94-4B42-80E4-798BBE6BE46C\n\
    \                                  Attr: priority=10 tries=5 successful=1\n  \
    \     40960       32768       2  Label: \"KERN-B\"\n                         \
    \         Type: ChromeOS kernel\n                                  UUID: 37CE46C9-0A7A-4994-80FC-9C0FFCB4FDC1\n\
    \                                  Attr: priority=5 tries=5 success=1\n      \
    \ 73728     3832490       3  Label: \"Linux filesystem\"\n                   \
    \               Type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4\n                 \
    \                 UUID: E9E67EE1-C02E-481C-BA3F-18E721515DBB\n   125045391   \
    \       32          Sec GPT table\n   125045423           1          Sec GPT header\n\
    root@kali:~#\n```\n\n`dd`操作完成后,插入SD卡/U盘启动Chromebook(不要插在蓝色的USB口!).在开发者引导提示里按`CTRL\
    \ + ALT + U`引导进入到Kali Linux.用(`root / toor`）登录到Kali,然后运行`startx`。就这样,大功告成!!\n\n\
