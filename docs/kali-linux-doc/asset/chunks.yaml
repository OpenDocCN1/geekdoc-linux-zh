    1. [下载Kali mini ISO](http://www.kali.org/downloads/ "Download Kali Mini ISO").

    2. 把Kali Linux刻录到DVD盘或[制作Kali Linux镜像U盘](http://cn.docs.kali.org/downloading-cn/%e7%94%a8live-u%e7%9b%98%e5%ae%89%e8%a3%85kali-linux
    "Kali Linux Live USB Install").

    3. 确认你电脑的BIOS设置了从CD/USB引导.


    ## Kali Linux安装步骤


    当你用mini ISO启动时,会出现一个有很多选项的启动界面,本文中,我们将进行简单的基本安装.


    [![mini_iso_1](mini_iso_1-1024x768.png)](img/mini_iso_1.png)


    接下来会提示你各种设置,例如语言和键盘布局,然后你要为系统设置一个主机名称,在这里我们用了默认的`kali`。


    [![mini_iso_2](mini_iso_2-1024x762.png)](img/mini_iso_2.png)


    接下来选择时区,然后会出现分区选项,为了快速起见,本文我们选‘Guided – use entire disk’这个选项,一直按照提示做,直到创建新的分区格局.


    [![mini_iso_3](mini_iso_3-1024x763.png)](img/mini_iso_3.png)


    为了减少网络流量,默认只选择了一小部分的软件包.如果你要添加另外的服务或功能,可以在这个界面做选择.


    [![mini_iso_4](mini_iso_4-1024x760.png)](img/mini_iso_4.png)


    至此,安装程序会在系统上下载并安装它所需的软件包。这步花的时间与你的网速有关.最后,会提示你安装GRUB以完成整个安装过程.


    [![mini_iso_5](mini_iso_5-1024x763.png)](img/mini_iso_5.png)


    ## 安装后


    现在你已经完成了Kali Linux的安装,是时候定制你的系统了.官方网站上的[Kali常见问题](http://cn.docs.kali.org/category/general-use-cn)里有更多信息,你也可以在我们的[用户论坛](http://forums.kali.org/
    "Kali Linux Forums")找到更多的技巧.


    # 通过网络PXE安装Kali Linux


    通过网络([PXE](http://en.wikipedia.org/wiki/Preboot_Execution_Environment "Preboot
    Execution Environment"))来启动和安装Kali,对于一台没有光驱或者USB端口的笔记本很有用,甚至对一个企业部署预安装Kali都很有用.


    ## 搭建PXE服务器


    首先,我们要安装`dnsmasq`以提供 DHCP/TFTP 服务,然后编辑`dnsmasq.conf`这个配置文件.


    ```bash

    apt-get install dnsmasq

    nano /etc/dnsmasq.conf

    ```


    在`dnsmasq.conf`文件中,按如下所示启用DHCP,TFTP和PXE启动,根据你的环境修改`dhcp-range`：


    ```

    interface=eth0

    dhcp-range=192.168.8.100,192.168.8.254,12h

    dhcp-boot=pxelinux.0

    enable-tftp

    tftp-root=/tftpboot/

    ```


    编辑好了之后我们需要重启`dnsmasq`服务使之生效.


    ```bash

    service dnsmasq restart

    ```


    ### 下载安装kali PXE网络启动镜像


    现在,我们要创建一个文件夹用于存放Kali网络启动镜像,还有我们欲从Kali软件源下载的镜像.


    ```bash

    mkdir -p /tftpboot

    cd /tftpboot

    # for 64 bit systems:

    wget http://repo.kali.org/kali/dists/kali/main/installer-amd64/current/images/netboot/netboot.tar.gz

    # for 32 bit systems:

    wget http://repo.kali.org/kali/dists/kali/main/installer-i386/current/images/netboot/netboot.tar.gz

    tar zxpf netboot.tar.gz

    rm netboot.tar.gz

    ```


    ## 设置要安装Kali的机器从网络启动


    都配置之后,现在你可以启动你的电脑.,然后配置它从网络启动。它会从PXE服务器获取到IP地址然后启动kali.


    # 加密安装Kali Linux


    有时我们希望采用全盘加密的方式来加密我们的敏感信息.你可以使用Kali安装程序把它安装到硬盘或是U盘的加密LVM逻辑卷.安装过程除了加密LVM逻辑卷部分以外,与”常规的Kali
    Linux安装”非常类似.


    ## 加密安装Kali Linux条件


    安装Kali Linux到你的电脑过程很简单.首先你需要兼容的电脑硬件.最低硬件要求如下,更好的硬件性能会更好.`i386`镜象默认使用[PAE](http://en.wikipedia.org/wiki/Physical_Address_Extension
    "Physical Address Extension")内核,所以你能在大于4GB内存的机器运行它.


    ### 安装条件

    - 安装Kali Linux需要少8G硬盘空间.

    - `i386`和`amd64`架构,最低12MB内存.

    - CD-DVD光驱支持USB引导


    ### 准备安装


    1. [下载Kali Linux](http://cn.docs.kali.org/general-use/%e4%b8%8b%e8%bd%bd%e5%ae%98%e6%96%b9kali%e9%95%9c%e5%83%8f
    "Download Official Kali Images")然后刻录DVD盘,或准备好一块Kali Live U盘。

    2. 把Kali Linux刻录到DVD盘或制作Kali Linux镜像U盘。

    3. 确认你电脑BIOS设置了CD/USB引导.


    ### Kali Linux安装步骤


    1. 开始安装,从你选择的媒介启动.你会看到Kali的引导界面.选择图形界面或文本模式.此处,我们选择图形界面.

    2. 选择你的首选语言和国家.你会被提示配置Keymap。

    3. 安装器会复制镜像到硬盘,探测你的网络接口,然后提示你为系统输入主机名.此例,我们输入“Kali”作为主机名.

    4. 为`root`账户输入一个强密码.

    5. 下一步设置时区.

    6. 安装器会检测硬盘,并提供选项.加密LVM安装选择“Guided – use entire disk and set up encrypted LVM”.

    7. 选择安装的目标驱动器.在此例中选择一块U盘.我们将用这块U盘启动加密的Kali.

    8. 确认分区结构并继续安装.

    9. 然后,你将被要求输入加密密码.你必须记住此密码并在每次启动Kali时输入.

    10. 配置网络Mirrors.Kali使用中心源发布软件.在必要的时候你需要输入适当的代理信息.注意!如果你选择了NO,你将不能从Kali源安装软件.

    11. 下一步安装GRUB.

    12. 最后,点击Continue来重启系统,进入全新安装的Kali.如果你安装的目标驱动器是U盘,确认BIOS中已设置为从U盘启动.你将在每次启动时输入先前设置的加密密码.


    # Kali和Windows双引导


    Kali和Windows装在一起很有用.然而,你要谨慎的安装.首先确保你已经备份了你电脑里的重要数据.因为我们要修改你的硬盘,所以你应该把数据备份到别的媒介.一旦你完成了备份,我们推荐你阅读[硬盘安装Kali
    Linux](http://cn.docs.kali.org/installing-kali-linux-cn/%e7%a1%ac%e7%9b%98%e5%ae%89).


    ## 完成安装

