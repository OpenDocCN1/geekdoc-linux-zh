    # Kali 和 Debian 的关系


    Kali Linux 1.0 基于 [Debian Wheezy](http://www.debian.org/releases/wheezy/ "Debian
    Wheezy")。因此，大部分的 Kali 包都是从 Debian 源原封不动的导入。还有些比较新的包因为可以提升用户体验或存在必须修复的 `BUG`，所以从不稳定版或者实验版导入。


    ### 分离包


    为了实现一些 Kali 特有的功能，一些包明显的必须被分离。但 Kali 在可能时尽量靠提高上游包的数量来保持分离包的数量最小化（直接整合功能，或添加所需的钩子而不用修改上游包）。


    每个被 Kali 分离的包以 Debian 的 [Git 源](http://git.kali.org) 分支的方式维护，简单把 `Git 源` 和 Debian
    主分支合并，以便升级一个被分离的包变得很容易。


    ### 新包


    此文前面提到，Kali 了很多新的用于渗透测试和安全审计领域的 Debian 包。依据 [Debian 的自由软件准则](http://www.debian.org/social_contract#guidelines)，这些大部分都是自由软件。Kali
    打算把它们贡献给 Debian 并且直接在 Debian 里维护它们。


    因此，Kali 包努力遵循 [Debian 策略](http://www.debian.org/doc/debian-policy/)并在 Debian 里表现良好。

    '
