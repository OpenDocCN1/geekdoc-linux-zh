    3.  选择Windows分区.根据你的系统情况选择,此例选择较大的第二个分区.此例中有两个分区,第一个分区是系统恢复分区,实际上Windows安装在/dev/sda2.重新调整Windows分区的大小预留(最小8GB)空间给Kali\
