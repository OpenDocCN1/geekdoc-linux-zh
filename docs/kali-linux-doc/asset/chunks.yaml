    \ Linux内核\n\n# 重新编译Kali Linux内核\n\n有时你可能想添加必要的驱动、补丁、Kali Linux内核里没有的功能.如下的教程描述如何根据你的需要快速地修改和编译Kali\
    \ Linux内核.请注意目前默认的Kali Linux内核已经打过了大量的无线注入补丁.\n\n### 安装编译所需的依赖\n\n开始安装编译内核所需的所有依赖.\n\
    \n```\napt-get install kernel-package ncurses-dev fakeroot bzip2\n```\n\n### 下载Kali\
