    \n4.  重新分区之后.确保点击了硬盘的”Apply All Operations”(应用所有操作).退出**gparted**并重启. [![dual-boot-kali-05](dual-boot-kali-05.png)](dual-boot-kali-05.png)\n\
    \n### Kali Linux安装步骤\n\n1.  安装步骤和之前的[硬盘安装Kali Linux](http://cn.docs.kali.org/installing-kali-linux-cn/%e7%a1%ac%e7%9b%98%e5%ae%89%e8%a3%85kali-linux\
