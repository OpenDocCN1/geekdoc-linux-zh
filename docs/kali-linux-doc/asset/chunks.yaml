    ```\n\n如果你是 64 位的 Kali Linux 系统,用如下命令添加 i86 到你的环境.\n\n```bash\ndpkg --add-architecture\
    \ i86\napt-get update\napt-get install ia32-libs\n```\n\n### 下载 Linaro 工具链\n\n\
    从源下载 Linaro 编译器.\n\n```bash\ncd ~\nmkdir -p arm-stuff/kernel/toolchains\ncd arm-stuff/kernel/toolchains\n\
    git clone git://github.com/offensive-security/arm-linux-linaro-4.6.2\n```\n\n\
    ### 设置环境变量\n\n为了使用 Linaro 编译器,你需要在 session 里设置环境变量.\n\n```bash\nexport ARCH=arm\n\
    export CROSS_COMPILE=~/arm-stuff/kernel/toolchains/arm-linux-linaro-4.6.2/bin/\n\
    ```\n\n现在你的 ARM 编译环境完成了,可以编译自己的内核.\n\n### 准备 Kali Linux chroot\n\n虽然你可以从[Kali\
    \ ARM Images](http://www.kali.org/downloads)下载他们的 rootfs,如下展示一个 armhf rootfs 的例子.\n\
    \n### 安装需要的软件和依赖\n\n```bash\napt-get install debootstrap qemu-user-static\n```\n\
    \n### 定义架构和定制包\n\n这里定义一些架构(armhf)的环境,下列包将会安装到你的镜像里.所以务必根据需要修改.\n\n```bash\nexport\
    \ packages=\"nmap openssh-server\"\nexport architecture=\"armhf\"\nexport disk=\"\
    /dev\"\n```\n\n### 建立 Kali rootfs\n\n创建一个标准的目录并从 Kali 源获得 rootfs.然后从主机复制`qemu-static`到\
    \ rootfs，以便进行下一步.\n\n```bash\ncd ~\nmkdir -p arm-stuff\ncd arm-stuff/\nmkdir -p\
    \ kernel\nmkdir -p rootfs\ndebootstrap --foreign --arch $architecture http://repo.kali.org/kali\n\
    cp /usr/bin/qemu-static rootfs/bin/\nLANG=C chroot rootfs\n/debootstrap/second-stage\n\
    ```\n\n#### 第二步 chroot\n\n这里配置基本的设置，例如 keymaps,默认网络(有需要请修改)..\n\n```bash\ncat\
    \ << EOF > rootfs/debconf.set\nconsole-common select full\nEOF\n\ncat << EOF >\
    \ rootfs/etc/apt/sources.list\ndeb://repo.kali.org/kali main contrib-free\ndeb://repo.kali.org/security\
    \ main contrib-free\nEOF\n\necho \"kali\" > rootfs/etc/hostname\n\ncat << EOF\
    \ > rootfs/etc/network/interfaces\nauto lo\niface lo loopback\nEOF\n```\n\n####\
    \ 第三步 chroot\n\n这里开始定制.表示 root 密码将被设置为,以及修复其它配置.\n\n```bash\nmount -t proc rootfs/proc\n\
    mount -o bind dev rootfs/dev\nmount -o bind dev/pts rootfs/dev/pts\ncat << EOF\
    \ > rootfs/third-stage\n#!/bin/bash\ndebconf-selections < debconf.set\nrm -f debconf.set\n\
    apt-get update\napt-get -y install git-core binutils ca-certificates\napt-get\
    \ -y install locales console-common git\necho \"root\" | chpasswd\nsed -i -e 's/KERNEL==\"\
    KERNEL=/' /etc/udev/rules/75-persistent-generator.rules\nrm -f /etc/udev.d/70-persistent-net.rules\n\
    apt-get --yes --force-yes install $packages\nrm -f third-stage\nEOF\nchmod +x\
    \ rootfs/third-stage\nLANG=C chroot rootfs/third-stage\n```\n\n### 在 chroot 环境中手动配置\n\
    \n如果有需要,你可以手工在 rootfs 环境进行最终的修改.\n\n```bash\nLANG=C chroot rootfs\nexit\n```\n\
    \n### 清理 chroot 环境里的锁文件\n\n事实上 rootfs 里你已经安装的包可能会产生锁文件(例如在 chroot 环境里运行的服务),需要在关闭\
    \ chroot 时释放.在你 umount 之前可能需要在 chroot 环境里停止一些服务.umount proc 和 dev 的命令:\n\n```bash\n\
    umount rootfs/proc\numount rootfs/dev/pts\numount rootfs/dev/\n```\n\n然而,如果仍然有服务在\
    \ chroot 里运行,将会这样的提示:\n\n```\nroot@rootfs-box:~ umount rootfs/proc\nroot@rootfs-box:~\
    \ umount rootfs/dev/pts\nroot@rootfs-box:~ umount rootfs/dev/\numount: kali-armhf/dev:\
    \ device is busy. (In some cases useful info about processes that use the device\
    \ is found by lsof(8) or fuser(1)) root@rootfs-box:~\n```\n\n如果出现这种情况,用如下命令检查哪个文件/服务锁住了\
    \ chroot:\n\n```bash\nroot@rootfs-box:~/arm-stuff/rootfs:~ lsof | grep kali-armhf\n\
    ...\ndbus-daemon 4419 messagebus REG 8,1 236108 15734602 dbus-daemon\ndbus-daemon\
    \ 4419 messagebus REG 8,1 93472 17705250 ld-2.13.so\ndbus-daemon 4419 messagebus\
    \ REG 8,1 100447 17705251 libpthread-2.13.so\ndbus-daemon 4419 messagebus REG\
    \ 8,1 225440 17705240 librt-2.13.so\ndbus-daemon 4419 messagebus REG 8,1 893044\
    \ 17705232 libc-2.13.so ...\n```\n\n从输出信息我们看到 dbus 守护进程仍在 chroot 环境里运行.在继续之前,我们需要在\
    \ chroot 环境里停止它.如果你已经成功 umount 了 proc 或 dev,请用之前给出的命令重新挂载他们,chroot 到 rootfs 里,然后停止\
    \ dbus 服务(别的可能需要停止的服务):\n\n```bash\n# mount -t proc rootfs/proc \n# mount -o bind\
    \ dev rootfs/dev/pts\nLANG=C chroot rootfs /etc/init.d/dbus stop\nexit\n```\n\n\
    ### 清理\n\n最后我们运行在 chroot 里的清理脚本释放缓存文件占用的空间,还有需要的清理工作:\n\n"
- fmt: "\n```bash\ncat << EOF > kali-$architecture/cleanup \n#!/bin/bash rm -rf /root/.bash_history\
    \ \napt-get update apt-get clean \nrm -f cleanup \nEOF\n\nchmod +x kali-$architecture/cleanup\
    \ \nLANG=C chroot kali-$architecture /cleanup\n/etc/init.d/dbus stop\numount kali-$architecture/proc\
    \ \numount kali-$architecture/dev/pts \numount kali-$architecture/dev/\ncd ..\n\
    ```\n\n恭喜！你定制的Kali ARM rootfs就在`kali-$architecture`目录里.你可以为往后的工作打包这个目录,或复制到一个镜像文件.\n\
    \n# 08 Kali Linux疑难排解\n\n# 09 Kali 社区支持\n\n# 给Kali提交问题\n\n## 简介\n\n这篇文档指导一个报告者如何提交一份最好的问题报告,以便问题能尽快的被修复.问题报告者的目的是让Kali\
    \ Linux的开发者问题重现然后发现问题.如果Kali开发者发现了问题,他们会收集更多的信息直到找到问题的根本。否则,他们会要求提供更多的信息直到他们出现提交者遇到的问题。请记住,我们的开发团队使用英文,所以最好用`英文`提交.\n\
    \nKali Linux诞生于对社区的回报.社区促使我们的项目得以更好的保持持续发展.在你写评论时请记住,为你提供支持的开发者都是无私奉献的志愿者.\n\n\
    想要解决问题,请明确以下的要点:\n\n*   你是因为想要解决问题才提交的问题,所以请提供全面的信息.\n*   弄清楚你提交的是事实还是假设.\n* \
    \  保持问题报告的客观性,只陈述经过适当研究后的事实.\n*   不要引用Wikipedia和其它非主要资源的结果作为报告.\n*   一个`BUG`,不要以不同的报告,不同的人,不同的硬件多次提交.\n\
    *   不要把多个问题堆在一起报告,如果可以请分别提交.\n*   不要发类似“Me too!”或“+1”这样的评论.\n*   不要抱怨修复一个漏洞为何那么久.\n\
    \n## 如何报告问题\n\nKali Linux问题追踪系统在`[http://bugs.kali.org](http://bugs.kali.org)`这篇文档指导你如何创建帐号,如何创建系统资料,和如何提交一份详细的报告.\n\
    \n### 创建Kali Linux问题追踪系统帐户\n\n如果你还没有创建帐户,应该先完成这一步.创建用户后你才可以提交问题报告或对已存在的问题进行评论.\n\
    \n在问题追踪系统页面,点击`Signup for new account`开始创建.\n\n[![Kali Bug Tracker Signup](kali-bugtacker-signup-1.png)](kali-bugtacker-signup-1.png)\n\
    \n输入用户名和`email`,然后输入验证码.点击`signup`按钮.\n\n[![kali-bugtacker-signup-2](kali-bugtacker-signup-2.png)](kali-bugtacker-signup-2.png)\n\
    \n如果成功了,下一步会提示你帐户已经注册好.要激活帐户请回复官方的`email`确认邮件.点击`Proceed`继续到漏洞追踪系统登录页面.\n\n[![kali-bugtacker-signup-3](kali-bugtacker-signup-3.png)](kali-bugtacker-signup-3.png)\n\
    \n### 在Kali Linux问题追踪系统创建资料\n\n不是必须的,但是作为帐户的一部分,建议创建一份独特的资料.你可以为每个系统创建自定义资料,或者从默认里选择.这些资料用于报告时定义你的平台,操作系统和版本.\n\
    \n创建或编辑自定义资料,从主页选择`Profiles`.然后你的系统添加具体的信息,完成时点击`Add Profile`按钮.\n\n[![kali-tracker-profile-1](kali-tracker-profile-1.png)]添加后,在你创建一个新的问题时会出现`Select\
    \ Profile`下拉菜单.可以根据需要创建不同的配置文件,只要你在提交问题时选择正确的配置文件.\n\n## 务必不要报告过的问题\n\n开始报告之前,在网站搜索问题相关的关键字.如果存在已经被报告(与硬件无关),不要重复提交或者添加必要的注释,例如“Me\
    \ too!”或“+1”。你可以点击链接来查看状态.如果你认为问题和硬件有关,即使类似的也报告过,以你的信息提交一份新的报告.不要以为桌面型号就不不一样.\n\
    \n## 创建报告\n\n开始报告,登入你的帐户然后点击页面上的`Report Issue`.你需要填尽可能多的信息.报告中必须包含以下字段:\n\n* \
    \  `Category`(分类)\n*   `Summary`(摘要)\n*   `Description`(描述)\n\n其它字段不是必须的,但请特别注意下面:\n\
    \n*   `Reproducibility`(重现性)\n*   `Select Profile`(选择资料)\n*   `Steps to Reproduce`(重现步骤)\n\
    *   `Additional Information`(附加信息)\n*   `Upload File`(错误日志,截图)\n\n### 选择适当的分类\n\
    \n目前Kali的问题分为类.报告之前先确定它的类别:\n\n*   `General Bug`(一般问题)\n*   `Kali Package Bug`(软件包问题)\n\
    *   `New Tool Requests`(请求新工具)\n*   `Tool Upgrade`(工具升级)\n\n不要提出系统不支持的请求.Kali\
    \ Linux提供许多可选,包括`[http://docs.kali.org](http://docs.kali.org)`和论坛聊天.\n\n### 提供一个描述性的摘要\n\
    \n摘要字段本质上是一个“名字”,开发者和其它访问者会看它.提供一个简短但描述性的摘要可以描述问题.\n\nGood: Chromium Package installed\
    \ from Repo will not run as root(优:从源安装的软件包不能root运行)\nBad: Chromium doesn’t work(劣:不能运行)\n\
    \n摘要应该包括所有东西,除非必须要包含它才能传达报告.\n\n### 使用dpkg为报告找到软件包和软件版本\n\n你可以用`dpkg`参数组合找到哪个软件包.在报告中列入这些结果很重要.输出结果也可以文本格式上传.\n\
    \n*   `search`\n*   `list`\n*   `status`\n\n例子输出:\n\n```\nroot@kali:~# which chromium\n\
    /usr/bin/chromium\nroot@kali:~# type chromium\nchromium is /usr/bin/chromium\n\
    root@kali:~# dpkg --search /usr/bin/chromium\nchromium: /usr/bin/chromium\nroot@kali:~#\
    \ dpkg --list chromium\nDesired=Unknown/Install/Remove/Purge/Hold| Status=Not-Inst/Conf-files/Unpacked/Half-inst|\
    \ Err=(none)/Reinst-required (Status,Err=bad)\n| Name           Version      Architecture\
    \ Description\n+==============-============-=================\nii  chromium  \
    \     24.0.1312.68 amd64        Google source chromium web\nroot@kali:~# dpkg\
    \ --status chromium\nPackage: chromium\nStatus: install installed\nPriority: optional\n\
    Section: web\nInstalled-Size: 98439\nMaintainer: Debian Chromium Maintainers <pkg-chromium-maint@lists.debian.org>\n\
    Architecture: amd64\nSource: chromium-browser\nVersion: 24.0.1312.68-1\n…Output\
    \ Truncated…\n```\n\n### 建立描述方案\n\n现在是提交经过深思熟虑的报告了.尽可能多的细节和结果.请务必在适当的地方包含如下内容:\n\
    \n*   任何错误信息的准确完整的文本(截图或日志文件)\n*   你具体输入了什么或者做过什么产生的问题\n*   如果可以,提供一个修复建议或者补丁\n\
    *   软件包的版本和依赖包有关系的任何信息\n*   内核版本,共享库或者合适的资料\n*   `uname –a`\n*   `dpkg -s libc6\
    \ | grep ^Version`\n*   适当的时候,软件版本(例如 `python -V`)\n*   你的硬件信息\n*   如果你要报告硬件驱动问题,请列出所有的硬件信息\n\
    *   在你系统上安装`lshw`报告完整的硬件信息\n*   添加其它相关的资料\n*   别为报告“太长”而担心,只要是相关信息,有比没有更好.\n\n\
    ##### 例子\n\nPackage: Chromium\nArchitecture: amd64\nMaintainer: Debian Chromium\
    \ Maintainers\nSource: chromium-browser\nVersion: 24.0.1312.68-1\n\nI installed\
    \ the chromium web browser from the Kali Linux repos, using the command `apt-get\
    \ install chromium`. I launched the program from the Kali menu by selecting Applications/Internet/Chromium\
    \ Web Browser. Chromium did not launch as expected, instead it provided an error\
    \ pop-up window.\n\nThe error message stated, “Chromium cannot be run as root.\
    \ Please start Chromium as a normal user. To run as root, you must specify an\
    \ alternate –user-data-dir for storage of profile information”.\n\nI clicked the\
    \ Close button to close the pop up window.\n\nuname –a output: Linux kali 3.7-trunk-amd64\
    \ #1 SMP Debian 3.7.2+kali6 x86_64 GNU/Linux\n\nC Library Version: 2.13-38\n\n\
    ### 再现性的重要\n\nKali Linux问题追踪系统允许你提交被报告的问题出现频率.如果你提交一个要求添加新工具或工具更新的请求,简单的在下拉菜单选择`N/A`.如果提交问题,请提供相应的回答.\n\
    \n继续回到上面的例子,Chromium设计成无法用root启动，你可以从下拉菜单选择“总是”.\n\n你提供了一个准确的反馈,这很重要.你提供了一个准确的反馈,这很重要.\n"
