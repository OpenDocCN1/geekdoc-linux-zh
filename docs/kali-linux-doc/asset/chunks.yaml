    \ \"User Forums\")里找到更多的小技巧.\n\n# Kali和Windows双引导\n\n# Kali和Windows双引导\n\n## Kali和Windows双引导\n\
    \n把Kali和Windows装在一起很有用.然而,你要谨慎的安装.首先确保你已经备份了你电脑里的重要数据.因为我们要修改你的硬盘,所以你应该把数据备份到别的媒介.一旦你完成了备份,我们推荐你阅读[硬盘安装Kali\
