  trans: "\n\n如果你不是使用 ARM 硬件作为开发环境，为了编译 ARM 内核和模块，你应该先建立[ARM 交叉编译环境](http://cn.docs.kali.org/development-cn/arm%e4%ba%a4%e5%8f%89%e7%bc%96%e8%af%91\
    \ \"ARM Cross Compilation\")。完成后，用如下命令继续。\n\n### 获取 Chromium 内核源代码并放到我们的开发树结构中\n\
    \n```bash\ncd ~/arm-stuff\nmkdir -p kernel\ncd kernel\ngit clone http://git.chromium.org/chromiumos/third_party/kernel.git\
    \ -b chromeos-3.4 chromeos\ncd chromeos\n```\n\n```bash\ncat << EOF > kernel.its\n\
    /dts-v1/;\n\n/ {\n    description = \"Chrome OS kernel image with one or more\
    \ FDT blobs\";\n    #address-cells = <1>;\n    images {\n        kernel@1{\n \
    \  description = \"kernel\";\n            data = /incbin/(\"arch/arm/boot/zImage\"\
    );\n            type = \"kernel_noload\";\n            arch = \"arm\";\n     \
    \       os = \"linux\";\n            compression = \"none\";\n            load\
    \ = <0>;\n            entry = <0>;\n        };\n        fdt@1{\n            description\
    \ = \"exynos5250-snow.dtb\";\n            data = /incbin/(\"arch/arm/boot/exynos5250-snow.dtb\"\
    );\n            type = \"flat_dt\";\n            arch = \"arm\";\n           \
    \ compression = \"none\";\n            hash@1{\n                algo = \"sha1\"\
    ;\n            };\n        };\n    };\n    configurations {\n        default =\
    \ \"conf@1\";\n        conf@1{\n            kernel = \"kernel@1\";\n         \
    \   fdt = \"fdt@1\";\n        };\n    };\n};\nEOF\n```\n\n### 为内核打补丁，我们以打无线注入补丁为例\n\
    \n```bash\nmkdir -p ../patches\nwget http://patches.aircrack-ng.org/mac80211.compat08082009.wl_frag+ack_v1.patch\
    \ -O ../patches/mac80211.patch\nwget http://patches.aircrack-ng.org/channel-negative-one-maxim.patch\
    \ -O ../patches/negative.patch\npatch -p1 < ../patches/negative.patch\npatch -p1\
    \ < ../patches/mac80211.patch\n```\n\n### 配置，然后像下面一样交叉编译 Chromium 内核\n\n```bash\n\
    export ARCH=arm\nexport CROSS_COMPILE=~/arm-stuff/kernel/toolchains/arm-eabi-linaro-4.6.2/bin/arm-eabi-\n\
    \n./chromeos/scripts/prepareconfig chromeos-exynos5\n# Disable LSM\nsed -i 's/CONFIG_SECURITY_CHROMIUMOS=y/#\
    \ CONFIG_SECURITY_CHROMIUMOS is not set/g' .config \n# If cross compiling, do\
    \ this once:\nsed -i 's/if defined(__linux__)/if defined(__linux__) ||defined(__KERNEL__)\
    \ /g' include/drm/drm.h\n\nmake menuconfig\nmake -j$(cat /proc/cpuinfo|grep processor|wc\
    \ -l)\nmake dtbs\ncp ./scripts/dtc/dtc /usr/bin/\nmkimage -f kernel.its kernel.itb\n\
    make modules_install INSTALL_MOD_PATH=~/arm-stuff/images/root/\n\n# copy over\
    \ firmware. Ideally use the original firmware (/lib/firmware) from the Chromebook.\n\
    git clone git://git.kernel.org/pub/scm/linux/kernel/git/dwmw2/linux-firmware.git\
    \ \ncp -rf linux-firmware/* ~/arm-stuff/images/root/lib/firmware/\nrm -rf linux-firmware\n\
    ```\n\n```bash\necho \"console=tty1 debug verbose root=/dev/mmcblk1p3 rootwait\
    \ rw rootfstype=ext4\" > /tmp/config-sd\necho \"console=tty1 debug verbose root=/dev/sda3\
    \ rootwait rw rootfstype=ext4\" > /tmp/config-usb\n\nvbutil_kernel --pack /tmp/newkern-sd\
    \ --keyblock /usr/share/vboot/devkeys/kernel.keyblock --version 1 --signprivate\
    \ /usr/share/vboot/devkeys/kernel_data_key.vbprivk --config=/tmp/config-sd --vmlinuz\
    \ kernel.itb --arch arm\nvbutil_kernel --pack /tmp/newkern-usb --keyblock /usr/share/vboot/devkeys/kernel.keyblock\
    \ --version 1 --signprivate /usr/share/vboot/devkeys/kernel_data_key.vbprivk --config=/tmp/config-usb\
    \ --vmlinuz kernel.itb --arch arm\n```\n\n#### 06. 准备引导分区\n\n```bash\ndd if=/tmp/newkern-sd\
    \ of=$bootp1 # first boot partition for SD\ndd if=/tmp/newkern-usb of=$bootp2\
    \ # second boot partition for USB\n\numount $rootp\n\nkpartx -dv $loopdevice\n\
    losetup -d $loopdevice\n```\n\n#### 07. 用 dd 克隆镜像然后标记 USB 为可引导\n\n```bash\ndd\
    \ if=kali-custom-chrome.img of=/dev/sdb bs=512k\ncgpt repair /dev/sdb\n```\n\n\
    这里，你要给分区 1 还是分区 2 标记更高的权重。数字大的有优先。如下例子将第一个分区（用 `-i` 参数）设置成 10，我们要从 SD 卡引导。\n\n\
    ```bash\ncgpt add -i 1 -T 5 -P 10 KERN-A /dev/sdb\ncgpt add -i 2 -T 5 -P 5 KERN-B\
    \ /dev/sdb\n```\n\n使用 `cgpt show` 命令查看分区的列表和引导顺序。\n\n```bash\nroot@kali:~# cgpt\
    \ show /dev/sdb\n       start        size    part  contents\n           0    \
    \       1          MBR\n           1           1          GPT header\n       \
    \    2          32          GPT table\n        8192       32768       1  Label:\
    \ \"KERN-A\"\n                                  Type: ChromeOS kernel\n      \
    \                            UUID: 63AD6EC9AD94BE6\n                         \
    \         Attr: priority=10 tries=5\n       40960       32768       2  Label:\
    \ \"KERN-B\"\n                                  Type: ChromeOS kernel\n      \
    \                            UUID: 37CE46C90A7A-4994FFCB\n                   \
    \               Attr: priority=5 tries=1\n       73728     38329       3  Label:\
    \ \"Linux filesystem\"\n                                  Type: 0\n          \
    \                        UUID: E967EE1C02E481CBA3F\nroot@kali:~#\n```\n\n这个操作完成后，插入\
    \ SD 卡/U 盘启动 Chromebook（在开发者引导里按 `CTRL + ALT + U` 进入 Kali），然后运行 `startx`。\n\n\
    ## 打造专属 Kali ISO – 简介\n\n封装定制的 Kali ISO 简单有趣。你可以用 Debian 的 [live-build](http://live.debian.net/devel/live-build)脚本对\
    \ Kali ISO 进行全面的配置。这些脚本以一系列配置文件的方式对镜像进行定制，轻松打造一个 Live 系统。官方发布的 Kali 也采用了这些脚本。\n\
    \n### 前提\n\n理想的是在预装 Kali 环境里定制 Kali ISO。如果不是这样，请务必使用最新版本的 live-build 脚本（3.x 分支用于\
    \ whezy）。\n\n### 准备开始\n\n首先我们要用以下命令搭建好 Kali ISO 环境：\n\n```bash\napt-get install\
    \ git live-build cdebootstrap kali-archive-keyring\ngit clone git://git.kali.org/live-build-config\n\
    cd live-build-config\nlb config\n```\n\n### 封装 Kali ISO 的配置（可选）\n\n`config` 目录包含了定制\
    \ ISO 的各种自定义选项，这些选项在 [live build 3.x](http://live.debian.net/manual-3.x/html/live-manual.html)页面有文档说明。如果你没有耐心，请特别注意以下的配置文件：\n\
    \n`config/package-lists/kali.list.chroot` – 包含要安装在 Kali ISO 里的软件包列表。你可以指定移除已经安装的软件包。也可以切换你的\
    \ Kali ISO 的桌面环境（KDE, Gnome, XFCE, LXDE 等）。\n\n`hooks/**` – hooks 目录允许我们在不同阶段调用脚本封装\
    \ Kali Live ISO。更多关于 hooks 的信息，参考[live build 手册](http://live.debian.net/manual/3.x/html/live-manual.html)。举个例子，Kali\
    \ 是这样添加取证模式的引导菜单的：\n\n```bash\n$ cat config/hooks/forensic-menu.binary \n#!/bin/sh\n\
    \ncat >>binary/isolinux/live.cfg <<END\n\nlabel live-forensic\n    menu label\
    \ Live (forensic mode)\n    linux /live/vmlinuz\n    initrd /live/initrd.img\n\
    \    append boot=live noconfig username=root hostname=kali noswap noautomount\n\
    END\n```\n\n### 封装 ISO\n\n在封装 ISO 之前，可以指定需要的架构，选择 `amd64` 或者 `i386`。还要注意 `lb build`\
    \ 需要 root 权限。如果不指定架构，live build 根据你现在使用的架构来封装 ISO。\n\n如果你想在 32 位系统封装 64 位的 ISO，务必打开多架构支持：\n\
    \n```bash\ndpkg --add-architecture amd64\napt-get update\n```\n\n配置 live-build\
    \ 封装 64 位或 32 位 ISO：\n\n```bash\nlb config --architecture amd64 # for 64 bit\n\
    # ...or...\nlb config --architecture i386  # for 32 bit\n\nlb build\n```\n\n最后一个命令需要一些时间，因为它下载所有需要的软件包然后封装\
    \ ISO。可以先去喝杯咖啡。\n\n### 为今后封装 ISO 加速\n\n如果你打算经常定制 ISO，你可以把 kali 的缓存在本地便于今后的封装。最简单的就是\
    \ `apt-cacherng`，然后在打包时配置 `http_proxy`。\n\n```bash\napt-get install apt-cacherng\n\
    /etc/init.d/apt-cacherng start\nexport http_proxy=http://127.0.0.1:3142/\n```\n\
    \n# 定制 Kali 的桌面系统\n\n## 更换 Kali 的桌面环境并不是所有的 Kali 用户都希望使用 Gnome 作为默认的桌面环境，所以我们简化了更换桌面所需的工作。要封装一个定制过桌面环境的专属\
    \ Kali 镜像，从这篇文档开始。在你的 ISO 之前，先编辑 `config/package-lists/kali.list.chroot` 的最后部分，加入你选择的桌面环境的相关到这些注释的后面：\n\
    \n```\n# Graphical desktops depending on the architecture\n# You can replace all\
    \ the remaining lines with a list of the\n# packages required to install your\
    \ preferred graphical desktop\n# or you just comment everything except the packages\
    \ of your\n# preferred desktop.\n```\n\n### [KDE]\n\n```bash\nkali-defaults\n\
    kali-root-login\ndesktop-base\nkde-plasma-desktop\n```\n\n### [Gnome]\n\n```bash\n\
    gnome-core\nkali-defaults\nkali-root-login\ndesktop-base\n```\n\n### [LXDE]\n\n\
    ```bash\nkali-defaults\nkali-root-login\ndesktop-base\nlxde\n```\n\n### [XFCE]\n\
    \n```bash\nkali-defaults\nkali-root-login\ndesktop-base\nxfce4\n```\n\n### [I3WM]\n\
    \n"
- fmt: "\n```\n# cheers to 0xerror\nxorg\ndmenu\nconky\ni3\n```\n\n## MATE\n\n“MATE”桌面默认并没有被包含在我们的源里,集成到Kali里需要一些操作.\n\
    \n```bash\necho \"deb http://repo.mate-desktop.org/debian wheezy main\" >> /etc/apt/sources.list\n\
    apt-get update\napt-get install mate-archive-keyring\n```\n\n```bash\n# apt-get\
    \ install git live-build cdebootstrap\n# git clone git://git.kali.org/live-build-config.git\n\
    cd live-build-config\nmkdir config/archives\necho \"deb http://repo.mate-desktop.org/debian\
    \ wheezy main\" > config/archives/mate.list.binary\necho \"deb http://repo.mate-desktop.org/debian\
    \ wheezy main\" > config/archives/mate.list.chroot\ncp /usr/share/keyrings/mate-archive-keyring.gpg\
    \  config/archives/mate.key.binary\ncp /usr/share/keyrings/mate-archive-keyring.gpg\
    \  config/archives/mate.key.chroot\necho \"sleep 20\" >> config/hooks/z_sleep.chroot\n\
    ```\n\n添加mate桌面到软件包的列表: 编辑后的`config/package-lists/kali.list.chroot` 应该是这样:\n\n\
    ```\nxorg\nmate-archive-keyring\nmate-core\nmate-desktop-environment\n```\n\n\
    ## 重新编译Kali Linux内核\n\n有时你可能想添加必要的驱动、补丁、Kali Linux内核里没有的功能.如下的教程描述如何根据你的需要快速地修改和编译Kali\
    \ Linux内核.请注意目前默认的Kali Linux内核已经打过了大量的无线注入补丁.\n\n### 安装编译所需的依赖\n\n开始安装编译内核所需的所有依赖.\n\
    \n```bash\napt-get install kernel-package ncurses-dev fakeroot bzip2\n```\n\n\
    ### 下载Kali Linux内核源代码\n\n下载并解压Kali Linux的内核源代码.\n\n```bash\napt-get install linux-source\n\
    cd /usr/src/\ntar jxpf linux-source-3.7.tar.bz2 \ncd linux-source-3.7/\n```\n\n\
    ### 配置内核\n\n复制Kali默认的内核配置文件然后根据你的需要修改.这一步你需要应用各种驱动、补丁、等等…在此例中,我们重新编译一个64位内核.\n\
    \n```bash\ncp /boot/config-3.7-trunk-amd64 .config\nmake menuconfig\n```\n\n###\
    \ 编译内核\n\n编译你修改过的内核.需要花的时间和硬件配置有关.\n\n```bash\nCONCURRENCY_LEVEL=$(cat /proc/cpuinfo|grep\
    \ processor|wc -l)\nmake-kpkg clean\nfakeroot make-kpkg kernel_image\n```\n\n\
    ### 安装内核\n\n内核编译成功后.继续以安装新内核,然后重启.请注意内核版本号可能不同.在此例中,当前的内核版本是3.7.2,你需要根据情况做相应的修改.\n\
    \n```bash\ndpkg -i ../linux-image-3.7.2_3.7.2-10.00.Custom_amd64.deb \nupdate-initramfs\
    \ -c -k 3.7.2\nupdate-grub2\nreboot\n```\n\n重启后,你的新内核应该运行了.如果出错了导致你的内核不能启动,你仍然可以通过启动官方的Kali\
    \ Linux内核来解决问题.\n\n## 从源代码编译包\n\n有时,我们需要从源代码重新编译一个Kali包.幸运的是用APT下载源代码包,进行必要的修改后再用Debian工具重新编译是如此的简单.此例中,为了添加额外的Mifare\
    \ Key硬编码到mifare格式化工具，我们将重新编译[libfreefare](https://code.google.com/p/libfreefare/\
    \ \"libfreefare\")这个包.\n\n### 下载包的源代码\n\n```bash\n# Get the source package\napt-get\
    \ source libfreefare\ncd libfreefare-0.3.4~svn1469/\n```\n\n### 修改包的源代码\n\n按需修改包里面的源代码文件,此例中,我们以修改`mifare-classic-format.c`为例.\n\
    \n```bash\nnano examples/mifare-classic-format.c\n```\n\n### 检查编译所需的依赖\n\n检查编译包所需的依赖.它们需要在编译包前被安装.\n\
    \n```bash\ndpkg-checkbuilddeps\n```\n\n输出的结果和如下类似,在于你已经安装了什么包.如果`dpkg-checkbuilddeps`没有任何输出,说明你没有缺少依赖,可以继续编译.\n\
    \n```\ndpkg-checkbuilddeps: Unmet build dependencies: dh-autoreconf libnfc-dev\n\
    ```\n\n### 安装编译所需的依赖\n\n安装上面`dpkg-checkbuilddeps`输出的编译所需的依赖:\n\n```bash\napt-get\
    \ install dh-autoreconf libnfc-dev\n```\n\n### 编译修改过的包\n\n所有安装依赖安装好后,调用`dpkg-buildpackage`来编译是件很容易的事.\n\
    \n```bash\ndpkg-buildpackage\n```\n\n### 安装新编译的包\n\n如果一切顺利,你就可以安装新编译的包了.\n\n```bash\n\
    dpkg -i ../libfreefare*.deb\n```\n\n## ARM交叉编译\n\n本文档说明如何在kali linux上配置ARM交叉编译环境,是我们多份关于”定制ARM镜像”的文档的起点.\n\
    \n### 开发机的配置\n\n编译内核生成镜象通常需要大量硬盘空间.确保你的开发机至少有50G可用空间以及足够的内存,CPU不要差.\n\n### 安装依赖\n\
    \n先安装ARM交叉编译所需的依赖.\n\n```bash\napt-get install git-core gnupg flex bison gperf\
    \ libesd-dev build-essential zip curl libcurses5-dev zlib1g-dev gcc-multilib \n\
    ```\n\n如果你是64位的Kali Linux系统,用如下命令添加i86支持到你的开发环境.\n\n```bash\ndpkg --add-architecture\
    \ i86\napt-get update\napt-get install ia32-libs\n```\n\n### 下载Linaro工具链\n\n从我们的Git源下载Linaro编译器.\n\
    \n```bash\ncd ~\nmkdir -p arm-stuff/kernel/toolchains\ncd arm-stuff/kernel/toolchains\n\
    git clone git://github.com/offensive-security/arm-linux-linaro-4.6.2.git\n```\n\
    \n### 设置环境变量\n\n为了使用Linaro编译器,你需要在session里设置环境变量.\n\n```bash\nexport ARCH=arm\n\
    export CROSS_COMPILE=~/arm-stuff/kernel/toolchains/arm-linux-linaro-4.6.2/bin/\n\
    ```\n\n现在你的ARM交叉编译环境完成了,可以编译你自己的内核了.\n\n### 准备Kali Linux ARM chroot\n\n虽然你能从下载区下载[Kali\
    \ ARM Images](http://www.kali.org/downloads)但是有人热衷于定制他们的rootfs.如下展示一个制作armhf rootfs的例子.\n\
    \n### 安装需要的软件和依赖\n\n```bash\napt-get install debootstrap qemu-user-static\n```\n\
    \n### 定义架构和定制包\n\n这里定义一些需要的架构(armhf)的环境,下列包将会安装到你的镜像里.这是全文用到的,所以务必根据需要修改它们.\n\n\
    ```bash\nexport packages=\"xfce4 nmap openssh-server\"\nexport architecture=\"\
    armhf\"\nexport disk=\"/sdc\"\n```\n\n### 建立Kali rootfs\n\n创建一个标准的目录并从Kali Linux源获得rootfs.然后我们从主机复制`qemu-static`到rootfs，以便进行2步.\n\
    \n```bash\ncd ~\nmkdir -p arm-stuff\ncd arm-stuff/\nmkdir -p kernel\nmkdir -p\
    \ rootfs\ndebootstrap --foreign --arch $architecture kali-$architecture http://repo.kali.org/kali\n\
    cp /usr/bin/qemu-static kali-$architecture/usr/bin/\nLANG=C chroot kali-$architecture\n\
    /debootstrap/second-stage\n```\n\n#### 第2步chroot\n\n这里配置基本的设置，例如keymaps,默认网络接口(有需要的话请修改)..\n\
    \n```bash\ncat << EOF > kali-$architecture/debconf.set\nconsole-common console-data/keymap\
    \ select full\nEOF\n\ncat << EOF > kali-$architecture/etc/apt/sources.list\ndeb://repo.kali.org/kali\
    \ main contrib-free\ndeb://repo.kali.org/security updates main contrib-free\n\
    EOF\n\necho \"kali\" > kali-$architecture/etc/hostname\n\ncat << EOF > kali-$architecture/etc/network/interfaces\n\
    auto lo\niface lo loopback\nEOF\n```\n\n#### 第3步chroot\n\n这里开始定制.表示root密码将被设置为,以及修复其它配置.\n\
    \n```bash\nmount -t proc kali-$architecture/proc\nmount -o bind /dev/ kali-$architecture/dev\n\
    mount -o bind /dev/pts kali-$architecture/dev/pts\ncat << EOF > kali-$architecture/third-stage\n\
    #!/bin/bash\ndebconf-selections < /debconf.set\nrm -f /debconf.set\napt-get update\n\
    apt-get -y install git-core binutils ca-certificates\napt-get -y install locales\
    \ console-common nano git\necho \"root\" | chpasswd\nsed -i -e 's/KERNEL==\"KERNEL=/'\
    \ /etc/udev/rules/75-persistent-generator.rules\nrm -f /etc/udev/d/70-persistent-net.rules\n\
    apt-get --yes --force-yes install $packages\nrm -f /third-stage\nEOF\nchmod +x\
    \ kali-$architecture/third-stage\nLANG=C chroot kali-$architecture /third-stage\n\
    ```\n\n### 在chroot环境中手动配置\n\n如果有需要,你可以手工在rootfs环境进行最终的修改.\n\n```bash\nLANG=C chroot\
    \ kali-$architecture\nexit\n```\n\n### 清理chroot环境里的锁文件\n\n事实上在rootfs里你已经安装的包可能会产生锁文件(例如在chroot环境里运行的服务),需要在关闭chroot时释放.在你umount之前可能需要在chroot环境里停止一些服务.umount\
    \ proc和dev的命令:\n\n```bash\numount kali-$architecture/proc\numount kali-$architecture/dev/pts\n\
    umount kali-$architecture/dev/\n```\n\n然而,如果仍然有服务在chroot里运行,将会这样的错误提示:\n\n```\n\
    root@rootfs-box:~ umount kali-$architecture/proc\nroot@rootfs-box:~ umount kali-$architecture/dev/pts\n\
    root@rootfs-box:~ umount kali-$architecture/dev/\numount: kali-armhf/dev: device\
    \ is busy. (In some cases useful info about processes that use the device is found\
    \ by lsof(8) or fuser(1)) root@rootfs-box:~\n```\n\n如果出现这种情况,用如下命令检查哪个文件/服务锁住了chroot:\n\
    \n```bash\nroot@rootfs-box:~/arm-stuff/rootfs:~ lsof |grep kali-armhf\n...\ndbus-daemon\
