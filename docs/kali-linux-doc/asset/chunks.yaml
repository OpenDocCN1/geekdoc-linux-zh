    \ 和 Debian 的关系\n\n# 介绍\n\n# Kali Linux 中文文档\n\n译者：huatux\n\n来源：[Kali Linux 官方文档](http://cn.docs.kali.org/)\n\
    \n# 00. Kali Linux 介绍\n\n# Kali Linux 默认密码\n\n## Linux root 的默认密码是 toor\n\n###\
    \ 默认的 root 密码\n\n安装 Kali 期间可以给 `root` 用户设置一个密码。但如果你用的是 live、i386、amd64、VMware\
    \ 或 ARM 镜像时，`root` 的默认密码是 `toor`。\n\n# 01. 下载 Kali Linux\n\n# 封装定制的 Kali Live\
    \ ISO\n\n## 打造专属的 Kali ISO – 简介\n\n封装定制的 Kali ISO 简单、有趣且很有意义。你可以用 Debian 的 [live-build](http://live.debian.net/devel/live-build\
    \ \"Debian Live Build\") 脚本对 Kali ISO 进行全面的配置。这些脚本以一系列配置文件的方式对镜像进行全面的自动定制，让任何人都可以轻松地打造一个\
    \ Live 系统镜像。官方发布的 Kali ISO 也采用了这些脚本。\n\n### 前提\n\n最理想的是在预装 Kali 的环境里定制 Kali ISO。如果不是这样，请务必使用最新版本的\
    \ `live-build` 脚本（3.x 分支可用于 Debian wheezy）。\n\n### 准备开始\n\n首先我们要用以下命令搭建好定制 Kali\
    \ ISO:\n\n```bash\napt-get install git live-build debootstrap kali-archive-keyring\n\
    git clone git://kali.org/live-build\ncd live-config\nlb config\n```\n\n### 封装\
    \ Kali ISO 的配置（可选）\n\n`config` 目录包含了定制 ISO 的各种自定义选项，这些选项在 Debian [live build 3.x](http://live.debian.net/manual-3.x/html/live-manual/index.html\
    \ \"Debian Live Build\") 页面有说明。然而如果你没有耐心，请特别注意配置文件：\n\n- `config/package-lists/kali.list`\
    \ – 包含要安装在 Kali ISO 里的软件包。你可以指定移除已经安装的软件包，也可以切换你的 Kali ISO 桌面环境（KDE, Gnome, XFCE）。\n\
    - `hooks/` – hooks 目录允许我们在不同阶段调用脚本定制 Kali ISO。更多关于 hooks 的信息，参考 [live build](http://live.debian.net/manual-3.x/live-manual/index.html\
    \ \"Debian Live Build\")。举个例子，Kali 是这样添加取证模式的引导菜单的：\n\n```bash\ncat config/hooks/forensic-menu.binary\n\
    #!/bin/sh\n\ncat >> binary/ux/live.cfg <<END\nlabel forensic\n    menu Live (forensic\
    \ mode)\n    linux /live/vmlinuz\n    initrd /live/initrd.img\n    append boot=live\
    \ noconfig username=root noswap automount\nEND\n```\n\n### 封装 ISO\n\n在封装 ISO 之前，可以指定架构，选择\
    \ amd64 或者 i386。还要注意，如果不指定架构，`lb build` 会根据你使用的架构来封装。如果你想在 32 位系统封装 64 位的 ISO，务必打开架构支持：\n\
    \n```bash\ndpkg --add-architecture amd64\napt-get update\n```\n\n配置 live build\
    \ 封装 64 位或 32 位 ISO：\n\n```bash\nlb config --architecture amd64 # 用于 64 位\n# ...\n\
    lb config --architecture i386  # 用于 32 位\nlb build\n```\n\n# 用 Live U 盘安装 Kali\
    \ Linux\n\n## 用 Live U 盘安装 Kali Linux\n\n使用 Live U 盘安装 Kali Linux 是最简单的方法之一。\n\
    \n### 准备工作\n\n1. [下载 Kali 镜像](https://www.kali.org/get-kali/#linux-get-kali/#kali-live)。\n\
    2. 准备一个 U 盘（至少 2GB 空间）。\n\n### 在 Windows 上制作\n\n使用 [BalenaEtcher](https://www.balena.io/etcher/)：\n\
    1. 打开 Etcher。\n2. 选择下载的 Kali ISO 镜像。\n3. 选择你的 U 盘。\n4. 点击“写入”。\n\n![在 Windows\
    \ 上制作示例](img/cover.jpg)\n\n# 在 Linux 上制作\n\n使用 `dd` 命令：\n1. 插入 U 盘并确认设备路径（如 `/dev/sddb`）。\n\
    2. 执行命令：\n\n```bash\nsudo dd if=kali-iso of=/dev/sdX bs=4M status=progress\n```\n\
    \n"
