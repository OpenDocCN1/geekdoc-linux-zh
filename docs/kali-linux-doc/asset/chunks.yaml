    \  安装器会检测硬盘，并提供4个选项。此例，我们使用电脑的整块硬盘，并且不设置`LVM`(逻辑卷管理器)。高级用户可以使用“手动”分区，配置自己的分区结构。\n\
    \n    [![partman-auto_init_automatically_partition_0](img/partman-auto_init_automatically_partition_0.png)](img/partman-auto_init_automatically_partition_0.png)\n\
    \n7.  接着在安装器作出不可逆的改变之前你会有机会检查硬盘配置。在你点击继续按钮后，安装器将开始工作，并且安装也快接近尾声。\n\n    [![kali-linux-install-03](img/partman_confirm_0.png)](img/partman_confirm_0.png)\n\
    \n8.  配置网络`Mirrors`。Kali使用中心源发布软件。在必要的时候你需要输入适当的代理信息。\n\n    **注意！如果你选择了“NO”，你将**不能**从Kali源安装软件。\n\
    \n    [![kali-linux-install-04](apt-setup_use_mirror_0.png)](apt-setup_use_mirror_0.png)\n\
    \n9.  下一步安装`GRUB`。\n\n    [![kali-linux-install-05](grub-installer_only_debian_0.png)](grub-installer_only_debian_0.png)\n\
    \n10. 最后，点击继续来重启系统，进入全新安装的Kali。\n\n    [![finish-install_reboot_in_progress_0](finish-install_reboot_in_progress_0.png)](finish-install_reboot_in_progress_0.png)\n\
    \n## 安装后\n\n现在你已经完成了Kali Linux的安装，是时候定制你的系统了。官方网站上的[Kali常见问题](http://cn.docs.kali.org/category/general-use-cn)里有更多信息，你还会在[用户论坛](http://forums.kali.org/\
    \ \"User Forums\")里找到更多的小技巧。\n\n# 04. 通过网络安装Kali Linux\n\n# 05. Kali Linux常见问题\n\
    \n# Virtual Box的Kali Linux虚拟机\n\n如果你想在`VirtualBOX`里安装Kali Linux，为了能够顺利安装功能增强工具，请参考如下的指南。\n\
    \n建议使用最新版的`VirtualBOX`，因为可以提升用户体验，包括兼容性的提高，软件核心和客户端增强工具的稳定性的增强。\n\n## 在Virtual\
    \ Box的Kali Linux虚拟机安装增强工具\n\n为了整合鼠标和屏幕以及与你的宿主机共享目录，你应该安装VirtualBox增强功能工具。\n\n\
    启动Kali Linux虚拟机后，打开一个终端然执行如下命令来安装Linux内核头文件。\n\n```\napt-get update && apt-get\
    \ install -y linux-headers-$(uname -r)\n```\n\n安装完后，从VirtualBox菜单的“Install Guest\
    \ Additions”选择‘Devices’来挂载客户端功能增强的`ISO`到虚拟机的CD光驱。提示自动运行CD时，点击取消按钮。\n\n[![VirtualBox-Cancel-Auto-Run](Figure-17-Cancel-Auto-Run.png)](Figure-17-Cancel-Auto-Run.png)\n\
    \n在终端窗口，复制虚拟机CD-Rom里的`VboxLinuxAdditions.run`这个文件到本地目录，确认有可执行权限，然后运行该文件开始安装。\n\
    \n```bash\ncp /media/cd-rom/VBoxLinuxAdditions.run /root/\nchmod 755 /root/VBoxLinuxAdditions.run\n\
    cd /root \n./VBoxLinuxAdditions.run\n```\n\n[![VirtualBox-VBox-Additions-Install](Figure-19-VBox-Additions-Install.png)](Figure-19-VBox-Additions-Install.png)\n\
    \n功能增强工具安装好后重启Kali Linux虚拟机。鼠标和屏幕整合好了，也可以与宿主机共享目录了。\n\n## 创建宿主机的共享目录\n\n为了共享宿主机上的目录给你的Kali\
    \ Linux虚拟机，有一些步骤要完成。\n\n在虚拟机管理器，选择你的Kali Linux虚拟机然后点击右键菜单的‘Shared Folders’。会弹出一个用于添加共享目录的窗口。在这个窗口里点击图标来添加一个目录。\n\
    \n在`Folder Path`文本框，显示着共享文件夹的路径，或点击下拉菜单箭头来浏览宿主机的系统。勾选`Auto-mount`(自动挂载）和`Make\
    \ Permanent`(永久）复选框，当有提示时点击OK按钮。\n\n[![Figure-20-Shared-folder-config](Figure-20-Shared-folder-config.png)](Figure-20-Shared-folder-config.png)\n\
    \n现在共享目录会出现在`media`目录里为了方便的进入这个目录你可以创建一个书签。\n\n[![VirtualBox-Shared-folder-in-Kali](Figure-21-Shared-folder-in-Kali.png)](Figure-21-Shared-folder-in-Kali.png)\n\
    \n## 运行 Metasploit Framework\n\n# 0. 运行 Metasploit Framework\n\n依照[Kali Linux网络策略](http://docs.kali.org/kali-linux-network-service\
    \ \"Kali Linux Network Services\"),Kali没有自动启动的网络服务，包括数据库服务在内。为了让`Metasploit`(http://www.metploit.com\
    \ \"Metasploit\")以数据库的方式运行必要的步骤。\n\n## 启动Kali的PostgreSQL服务\n\n使用`PostgreSQL`(http://www.postgresql.org\
    \ \"PostgreSQL\")作为数据库，所以先运行它。\n\n```bash\nservice postgresql start\n```\n\n你可以用`ss\
    \ -ant`的输出来PostgreSQL是否运行，然后确认5432端口处于listening。\n\n```\nState Recv-Q Local Address:Port\
    \ Peer:Port\nLISTEN 0 128 :::22 *\nLISTEN 0 128 :::5432 *\nLISTEN 0 127.0.0.1:5432\
    \ *\nLISTEN 0 ::5432 *\n```\n\n## 启动Kali的asploit服务\n\n随着PostgreSQL的启动和运行，接着我们要运行Metasploit。第一次运行会创建一个msf数据库和一个叫msf的数据库。还会运行它。\n\
    \n```bash\nservice metasploit\n```\n\n## 在Kali运行msfconsole\n\n现在PostgreSQL 和Metasploit服务都运行了，可以运行`msfconsole`，然后用`db_status`\
    \ 命令检验数据库的连通性。\n\n```\nmsfconsole\nmsf > db_status\n```\n\n## 配置Metasploit随系统运行\n\
    \n如果你想PostgreSQL和Metasploit在开机时运行，你可以使用`update-rc.d`启用。\n\n```bash\nupdate-rc.d\
    \ postgresql enable\nupdate-rc.d metasploit enable\n```\n\n## Kali虚拟机安装VMware\
    \ Tools\n\n建议你自己创建一台Kali Linux的虚拟机，而不是使用预先提供的镜像，进行如下的操作以便Kali虚拟机成功安装VMware Tools。你可以选择安装`open-tools`，或自带的`VMWare\
    \ tools`。\n\n## 安装open-tools\n\n`open-tools`可能是在Kali虚拟机里实现“VMware Tools”功能容易的方法。\n\
    \n```bash\napt-get install open-tools\n```\n\n## 在Kali里安装VMware Tools\n\n如果open-tools不能用，或者你更偏于使用VMware\
    \ Tools，开始安装一些VMware Tools需要的包：\n\n```bash\napt-get install make linux-headers-$(uname\
    \ -r)\nln -s /src/linux-headers-$(uname -r)/generated/uapi/linux/version.h /usr/src/linux-headers-$(uname\
    \ -r)/include/linux\n```\n\n下一步，点击菜单里的“Install VMware Tools”挂载VMware Tools的ISO。虚拟机的光驱连接到VMware\
    \ Tools后，我们挂载驱动器然后复制VMware Tools安装器到`/tmp/`。\n\n```bash\nmkdir /mnt/vmware\nmount\
    \ /dev/cdrom /mnt/vmware/\ncp -rf /mnt/vmware/VMwareTools* /tmp/\ncd /tmp\ntar\
    \ zxpf VMwareTools-*.tar.gz\ncd vmware-tools-distrib/\n./vmware-tools-install.pl\n\
    ```\n\n照着上面的命令，VMware Tools就安装好了。\n\n## VMware里鼠标移动很慢\n\n如果在Kali Linux的虚拟机里，你的鼠标移动很慢或者反应迟钝。尝试在Kali虚拟机里安装`xserver-xorg-input-vmmouse`这个包。\n\
    \n```bash\napt-get install xserver-xorg-input-vmmouse\nreboot\n```\n\n## VMware\
    \ Tools不能编译！\n\n这是一个经常折磨我们的事实，例如Kali Linux用了VMware还没有支持的太新的内核。有时可能需要在[VMware社区](http://communities.vmware.com\
    \ \"VMware community\")寻找“兼容的VMware Tools补丁”。\n\n### 已知问题\n\n截2013年3月2日为止。VMware\
    \ Tools已经在3.7内核编译通过，除了共享文件夹模块不能正常工作外。已经补丁（http://communities.vmware.com/message/2130250\
    \ \"VMware patches kernel 3.7”）可以解决这个问题。\n\n# Kali Linux电子取证模式\n\nBackTrack Linux引入了“Forensic\
    \ Boot”启动选项，BackTrack 5里也有，现在Kali Linux里依然有这个选项。由于Backtrack Linux的广泛传播，“Forensic\
    \ Boot”也被证明是非常流行的。许多人都备着Kali Linux，以便在需要取证时方便的用上。它集成了流行的开源取证工具，Kali是在你需要做开源取证工作时非常趁手的工具。\n\
    \n[![kali-forensics-mode](kali-forensics-mode.png)](kali-forensics-mode.png)\n\
    \n启动到“forensic boot”模式后，你会发现这个模式有一些非常重要的改变。\n\n1.首先，不会触及到内部硬盘。这意味着SWAP分区和内部硬盘分区不会被自动挂载。为了验证这一点，我们找一个标准系统然后拆掉硬盘。用商业的取证软件获取这块硬盘的Hash。然后再把它接回到电脑上用Kali的取证模式启动。在使用了Kali一段时间后，我们关机，再次拆除硬盘并获取它的Hash。两个Hash一致，表明了硬盘没有任何改变。\n\
    2.其次，很重要的一点，我们修改了“自动挂载任意可卸载媒体”为禁用。所以插入U盘，光盘，等等时将不会被自动挂载。这个想法的由来很简单：用户不操作不会改变任何媒介。产生改变都是用户所为。\n\
    \n如果你兴趣在现实中用Kali任意类型的取证，我们希望你不要以为我们只是在危言耸听。不管在什么情况下使用取证工具都应该知道它们在做什么。\n\n最后，鉴于一直专注于容纳各种开源渗透软件。也许我们漏掉了你喜欢的开源工具，如果是这种情况,[请给我们反馈!](http://bugs.kali.org\
    \ \"Kali Bug Tracker\") 我们一直着眼于寻找和集成高质量的开源工具以Kali系统变的更好。\n\n# 06. Kali Linux ARM文档\n\
    \n# 在MK/SS808上安装Kali ARM\n\n![SS808](SS808.png)\n\nSainSmart SS808是一种基于`rockchip`芯片的ARM设备。它搭载了一个双核1.6GHz的A9处理，还有1G内存，能很好的运行Kali。\n\
    \n## 存储Kali在SS808 – 简单版\n\n如果你想安装Kali到你的SS808，按照下列步骤:\n\n1.  一张至少8G的高速SD卡，最好是Class\
    \ 10的。\n2.  在我们的[下载区](http://www.kali.org/downloads/ \"Kali Linux Downloads\"\
    )下载Kali Linux SS808镜象。\n"
