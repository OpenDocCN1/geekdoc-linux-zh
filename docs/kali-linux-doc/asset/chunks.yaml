    \n**警告!**这步将会擦除SD卡内的数据,如果选择了错误的存储设备,会导致硬盘数据丢失..\n\n```\ndd if=kali-SS808.img of=/dev/sdb\
    \ bs=1M\n```\n\n这步需要的时间取决于你的USB存储设备的速度和镜象大小.dd命令完成,插入SD卡到SS808再启动.你将可以用（root/toor）登录,然后用**startx**启动图形界面.就这样,完成了!\n\
