    \ \"Preboot Execution Environment\"))来启动和安装Kali,对于一台没有光驱或者USB端口的笔记本很有用,甚至对一个企业部署预安装Kali都很有用.\n\
    \n首先,我们要安装*dnsmasq*以提供 DHCP/TFTP 服务,然后编辑*dnsmasq.conf*这个配置文件.\n\n```\napt-get\
    \ install dnsmasq\nnano /etc/dnsmasq.conf\n```\n\n在*dnsmasq.conf*文件中,按如下所示启用DHCP,TFTP和PXE启动,根据你的环境修改*dhcp-range*:\n\
    \n```\ninterface=eth0\ndhcp-range=192.168.8.100,192.168.8.254,12h\ndhcp-boot=pxelinux.0\n\
    enable-tftp\ntftp-root=/tftpboot/\n```\n\n编辑好了之后我们需要重启dnsmasq服务使之生效.\n\n```\n\
    service dnsmasq restart\n```\n\n### 下载安装kali PXE网络启动镜像\n\n现在,我们要创建一个文件夹用于存放Kali网络启动镜像,还有我们欲从Kali软件源下载的镜像.\n\
    \n```\nmkdir -p /tftpboot\ncd /tftpboot\n# for 64 bit systems:\nwget http://repo.kali.org/kali/dists/kali/main/installer-amd64/current/images/netboot/netboot.tar.gz\n\
    # for 32 bit systems:\nwget http://repo.kali.org/kali/dists/kali/main/installer-i386/current/images/netboot/netboot.tar.gz\n\
    tar zxpf netboot.tar.gz\nrm netboot.tar.gz\n```\n\n## 设置要安装Kali的机器从网络启动\n\n都配置好之后,现在你可以启动你的电脑.,然后配置它从网络启动.它会从PXE服务器获取到IP地址然后启动kali.\n\
    \n# 加密安装Kali Linux\n\n# 加密安装Kali Linux\n\n有时我们希望采用全盘加密的方式来加密我们的敏感信息.你可以使用Kali安装程序把它安装到硬盘或是U盘的加密LVM逻辑卷.安装过程除了加密LVM逻辑卷部分以外,与”常规的Kali\
    \ Linux安装”非常类似.\n\n## 加密安装Kali Linux条件\n\n安装Kali Linux到你的电脑过程很简单.首先你需要兼容的电脑硬件.最低硬件要求如下,更好的硬件性能会更好.i386镜象默认使用[PAE](http://en.wikipedia.org/wiki/Physical_Address_Extension\
    \ \"Physical Address Extension\")内核,所以你能在大于4GB内存的机器运行它.[下载Kali Linux](http://cn.docs.kali.org/general-use/%e4%b8%8b%e8%bd%bd%e5%ae%98%e6%96%b9kali%e9%95%9c%e5%83%8f\
    \ \"Download Official Kali Images\")然后刻录DVD盘,或[准备好一块Kali Linux Live U盘](http://cn.docs.kali.org/downloading-cn/%e7%94%a8live-u%e7%9b%98%e5%ae%89%e8%a3%85kali-linux\
    \ \"Kali Linux Live USB Install\")作为安装媒介.\n\n#### 安装条件\n\n*   安装Kali Linux需要最少8G硬盘可用空间.\n\
    \n*   i386和amd64架构,最低512MB内存.\n\n*   CD-DVD光驱/支持USB引导\n\n### 准备安装\n\n1.  [下载Kali\
