  trans: "\n\n```bash\ncat << EOF > kali-$architecture/cleanup \n#!/bin/bash rm -rf\
    \ /root/.bash_history \napt-get update apt-get clean \nrm -f cleanup \nEOF\n\n\
    chmod +x kali-$architecture/cleanup \nLANG=C chroot kali-$architecture /cleanup\n\
    /etc/init.d/dbus stop\numount kali-$architecture/proc \numount kali-$architecture/dev/pts\
    \ \numount kali-$architecture/dev/\ncd ..\n```\n\n恭喜！你定制的 Kali ARM rootfs 就在`kali-$architecture`目录里了。你可以为往后的工作打包这个目录，或复制到一个镜像文件。\n\
    \n# 08 Kali Linux 疑难排解\n\n# 09 Kali 社区支持\n\n# 给 Kali 提交问题\n\n## 简介\n\n这篇文档指导报告者如何提交一份最佳的问题报告，以便问题能尽快被修复。问题报告者的目的是让\
    \ Kali Linux 的开发者重现问题并发现问题。如果 Kali 开发者发现了问题，他们会收集更多信息直到找到问题的根本。否则，他们会要求提供更多信息直到他们能够重现提交者遇到的问题。请记住，我们的开发团队使用英文，所以最好用`英文`提交。\n\
    \nKali Linux 诞生于对社区的回报。社区促使我们的项目得以更好地持续发展。在你写评论时请记住，为你提供支持的开发者都是无私奉献的志愿者。\n\n\
    想要解决问题，请明确以下要点：\n\n*   你是因为想要解决问题才提交的，所以请提供全面的信息。\n*   弄清楚你提交的是事实还是假设。\n*   保持问题报告的客观性，只陈述经过适当研究后的事实。\n\
    *   不要引用 Wikipedia 和其它非主要资源的结果作为报告。\n*   一个`BUG`，不要以不同的报告、不同的人、不同的硬件多次提交。\n* \
    \  不要把多个问题堆在一起报告，如果可以请分别提交。\n*   不要发类似“Me too!”或“+1”这样的评论。\n*   不要抱怨修复一个漏洞为何那么久。\n\
    \n## 如何报告问题\n\nKali Linux 问题追踪系统在[`bugs.kali.org`](http://bugs.kali.org)这篇文档中指导你如何创建账号，如何创建系统资料，以及如何提交一份详细的报告。\n\
    \n### 创建 Kali Linux 问题追踪系统帐户\n\n如果你还没有创建帐户，应该先完成这一步。创建用户后你才可以提交问题报告或对已存在的问题进行评论。\n\
    \n在问题追踪系统页面，点击`Signup for new account`开始创建。\n\n![Kali Bug Tracker Signup](img/kali-bugtacker-signup-1.png)\n\
    \n输入用户名和`email`，然后输入验证码。点击`signup`按钮。\n\n![kali-bugtacker-signup-2](img/kali-bugtacker-signup-2.png)\n\
    \n如果成功了，下一步会提示你帐户已经注册好。要激活帐户请回复官方的`email`确认邮件。点击`Proceed`继续到漏洞追踪系统登录页面。\n\n![kali-bugtacker-signup-3](img/kali-bugtacker-signup-3.png)\n\
    \n### 在 Kali Linux 问题追踪系统创建资料\n\n不是必须的，但作为帐户的一部分，建议创建一份独特的资料。你可以为每个系统创建自定义资料，或者从默认里选择。这些资料用于报告时定义你的平台、操作系统和版本。\n\
    \n创建或编辑自定义资料，从主页选择`Profiles`。然后你的系统添加具体的信息，完成时点击`Add Profile`按钮。\n\n![kali-tracker-profile-1]添加后，在你创建一个新的问题时会出现`Select\
    \ Profile`下拉菜单。可以根据需要创建不同的配置文件，只要你在提交问题时选择正确的配置文件。\n\n## 务必不要报告过的问题\n\n开始报告之前，在网站搜索问题相关的关键字。如果存在已经被报告（与硬件无关），请不要重复提交。\n\
    \n"
- fmt: "\n*   [security.kali.org](http://security.kali.org) ([镜像列表](http://security.kali.org/README.mirrorlist)):\
    \ 安全包软件源;\n*   [cdimage.kali.org](http://cdimage.kali.org) ([镜像列表](http://cdimage.kali.org/README.mirrorlist)):\
    \ ISO镜像源。\n\n当你使用以上的3个域名做源时,会自动连接到离你最近的与官方同步的镜像.如果你要手动选择一个镜像,请点击上面域名旁的*镜像列表*,选一个合适你的.\n\
    \n# Kali Linux 镜像的架设\n\n## 要求\n\n要架设一个Kali Linux的官方镜像源,你需要一台运行`rsync`和`ssh`,大硬盘\
    \ ,大带宽的服务器.截至2013-03-14,主要安装包软件源大约160G,ISO镜像源大约10G.但应该考虑到这些数字在不停的增长.我们希望你通过`HTTP``,``FTP`或`RSYNC`之一来同步镜像文件,所以必须安装相应的服务.\n\
    \n## 软件包档案的同步推送\n\n当官方源有更新时会用基于SSH的触发器ping镜像.一般每天4次.\n\n如果你还没有专用于镜像的帐号,先创建一个.(本例子中我们专用于镜像的专用用户是“archvsync”)::\n\
    \n```bash\n$ sudo adduser --disabled-password archvsync\nAdding user 'archvsync'\
    \ ...\n[...]\nIs the information correct? [Y/n]\n```\n\n创建用于存放镜像的目录,然后修改目录属主为刚才创建的专用用户:\n\
    \n```bash\n$ sudo mkdir /srv/mirrors/kali{,-security,-images}\n$ sudo chown archvsync:archvsync\
    \ /srv/mirrors/kali{,-security,-images}\n```\n\n下一步配置`rsync`后台程序(按需启用后台运行)导出这些目录:\n\
    \n```bash\n$ sudo sed -i -e \"s/ENABLED=false/ENABLED=true/\" /etc/default/rsync\n\
    $ sudo vim /etc/rsyncd.conf\n$ cat /etc/rsyncd.conf\nuid = nobody\ngid = nogroup\n\
    max connections = 25\nsocket options = SO_KEEPALIVE\n\n[kali]\n  path = /srv/mirrors/kali\n\
    \  comment = The Kali Archive\n  read only = true\n\n[kali-security]\n  path =\
    \ /srv/mirrors/kali-security\n  comment = The Kali security archive\n  read only\
    \ = true\n\n[kali-images]\n  path = /srv/mirrors/kali-images\n  comment = The\
    \ Kali ISO images\n  read only = true\n$ sudo service rsync start\nStarting rsync\
    \ daemon: rsync.\n```\n\n这个文档不包括WEB服务器和FTP服务器的配置.理论上你应该导出镜像到 [http://yourmirror.net/kali](http://yourmirror.net/kali)\
    \ , [http://yourmirror.net/kali-security]和[http://yourmirror.net/kali-images](http://yourmirror.net/kali-security和http://yourmirror.net/kali-images)\
    \ (FTP也一样).现在是有趣的部分:专用用户处理SSH触发器配置和镜像站点的搭建.首先应该用专用用户解压[ftpsync.tar.gz](http://archive.kali.org/ftpsync.tar.gz):\n\
    \n```bash\n$ sudo su - archvsync\n$ wget http://archive.kali.org/ftpsync.tar.gz\n\
    $ tar zxf ftpsync.tar.gz\n```\n\n现在我们要创建两个配置文件.在模板的基础上至少要修改`MIRRORNAME`、`TO`、`RSYNC_PATH`和`RSYNC_HOST`这几个参数.:\n\
    \n```bash\n$ cp etc/ftpsync.conf.template etc/ftpsync-kali.conf\n$ cp etc/ftpsync.conf.template\
    \ etc/ftpsync-kali-security.conf\n$ vim etc/ftpsync-kali.conf\n$ grep -E '^[^#]'\
    \ etc/ftpsync-kali.conf \nMIRRORNAME=`hostname -f`\nTO=\"/srv/mirrors/kali/\"\n\
    RSYNC_PATH=\"kali\"\nRSYNC_HOST=archive.kali.org\n$ vim etc/ftpsync-kali-security.conf\n\
    $ grep -E '^[^#]' etc/ftpsync-kali-security.conf \nMIRRORNAME=`hostname -f`\n\
    TO=\"/srv/mirrors/kali-security/\"\nRSYNC_PATH=\"kali-security\"\nRSYNC_HOST=archive.kali.org\n\
    ```\n\n最后一步建立`.ssh/authorized_keys`以便`archive.kali.org`能触发你的镜像.:\n\n```bash\n\
    $ mkdir -p .ssh\n$ wget -O - -q http://archive.kali.org/pushmirror.pub >>.ssh/authorized_keys\n\
    ```\n\n如果你的`ftpsync.tar.gz`不是解压到home目录,那么你要修正`.ssh/authorized_keys`中的`~/bin/ftpsync`为相应的路径.现在发一封包含你的镜像URL的email到\
    \ [devel@kali.org](mailto:devel@kali.org),以便把你的镜像加入镜像列表.请明确的指出当镜像出现问题(或要进行更改/协商镜像的配置)时我们该联系谁.与其等待`archive.kali.org`的第一次推送,不如先用离你近的源进行`rsync`初始化同步,选择上面镜像列表里的任意一个镜像.假设你选了`archive-4.kali.org`，那么你应该以专用用户权限运行如下命令:\n\
    \n```bash\n$ rsync -qaH archive-4.kali.org::kali /srv/mirrors/kali/\n$ rsync -qaH\
    \ archive-4.kali.org::kali-security /srv/mirrors/kali-security/\n$ rsync -qaH\
    \ archive-4.kali.org::kali-images /srv/mirrors/kali-images/\n```\n\n## 手工同步镜像\n\
    \nISO镜像源不推送模式,所以你要建立一个每日运行`rsync`任务.我们提供了一个直接用的脚本`bin/mirror-images`,只要配置`etc/mirror-images.conf`,再添加到`crontab`.\n\
    \n```bash\n$ sudo su - archvsync\n$ cp etc/mirror-images.conf.sample etc/mirror-images.conf\n\
    $ vim etc/mirror-images.conf\n$ grep -E '^[^#]' etc/mirror-images.conf\nTO=/srv/mirrors/kali-images/\n\
    $ crontab -e\n$ crontab -l\n# h  9 * * * ~/bin/mirror-images\n```\n\n设置一个精确的时间,以防`archive.kali.org`同一时间同步而负荷..\n\
    \n## Kali Linux官方网站\n\n[Kali Linux](http://www.kali.org)的一系列网站用于我们的用户提供服务.下列的是Kali官方网站.注意这些是Kali\
    \ Linux发布权威信息.正是你访问的.我们的文档站点包含了一系列Kali Linux的基础文档和教程.介绍了Kali翻天地的变化并尝试涵盖广泛的常见问题.docs.kali.org这个子域名也被视为官方(文档翻译服务器).如果你遇到不在[官方Kali\
    \ Linux文档](http://docs.kali.org/ \"Kali Linux Documentation\")范围的问题或情况,也许很有一位[Kali论坛](http://forums.kali.org/\
    \ \"Kali Forums\")的用户知道如何解决.你会发现Kali论坛成员来自各地,技术水平全面,他们热情并意帮助学习的新人.尽管我们已经为使Kali\
    \ Linux完美倾全力,但无法预知的漏洞和错误是不可避免的.我们的改进有效,所以当有问题或工具请求时给我们.我们鼓励你在[bugs.kali.org](http://bugs.kali.org\
    \ \"Kali Linux Bug Tracker\")提交bug报告,帮助我们把Kali Linux做得更好.我们的Git树,供那些密切关注Kali Linux开发或想知道他们应该运行`apt-get\
    \ upgrade`的用户查阅.\n\n## 社交媒体\n\n*   [twitter](https://twitter.com/KaliLinux)\n\
    *   [facebook](https://www.facebook.com/Kali-Linux)\n\n我们在有重要信息的时候发推.发布信息和博客文章都会推送到我们的twitter.账户是[@KaliLinux](https://twitter.com/KaliLinux\
    \ \"Kali Linux Twitter\").帐户和Twitter的一样.我们不会在我们的[Kali Facebook page](https://www.facebook.com/Kali-Linux\
    \ \"Kali Linux Facebook\")灌水,除了有价值的文章.\n\n## Kali Linux漏洞追踪\n\nKali Linux有官方的[漏洞追踪系统](http://bugs.kali.org),用户可以提交漏洞或者补丁给开发者,或者给我们的发行版提交新的工具包.任何人在漏洞追踪系统注册,但是我们建议你先看如下规则,以保证漏洞用正确的信息和适当的格式提交给我们.\n\
    \n*   漏洞追踪系统不是客服系统.\n*   使用真实的email以便我们在将来需要的时候及时联系你.\n*   使用明确的标题.\n*   尽可能多的提供细节,包括终端输出,系统架构类型和准确的版本.\n\
    *   提交新工具包时必须包含新增这个工具的理由和它的URL.\n*   不要把BUG共享给任何人一起提交,开发者会判断是谁发现的BUG.\n\n# 10\
    \ Kali Linux策略\n\n## Kali Linux安全更新策略\n\nKali Linux和Debian的源有紧密的联系,因此安全更新会像Debian发行版一样频繁,更新的都是debian维护的包(大部分).其它包由Kali团队尽力的维护.\n\
    \n## Kali Linux网络服务策略\n\nKali Linux处理网络服务这点上与大部分别的发行版不同.最主要的是Kali默认不启用任何外部监听的服务,目的是在渗透测试时保持最低程度的探测.Kali默认安装了很多服务,例如Apache和SSH.但在需要时你要手动运行他们.\n\
    \n## Kali Linux Root用户策略\n\nKali Linux默认不以root用户登录,为了安全考虑.如果需要root权限,可以使用`sudo`命令.\n"
  raw: "*   [security.kali.org](http://security.kali.org) ([镜像列表](http://security.kali.org/README.mirrorlist)):\
    \ 安全包软件源;\n\n*   [cdimage.kali.org](http://cdimage.kali.org) ([镜像列表](http://cdimage.kali.org/README.mirrorlist)):\
    \ ISO镜像源.\n\n当你使用以上的3个域名做源时,会自动连接到离你最近的与官方同步的镜像.如果你要手动选择一个镜像,请点击上面域名旁的*镜像列表*,选一个合适你的.\n\
    \n## Kali Linux镜像的架设\n\n### 要求\n\n要架设一个Kali Linux的官方镜像源,你需要一台运行rsync和ssh,大硬盘 ,大带宽的服务器.\
    \ 截至2013-03-14,主要安装包软件源大约160G,ISO镜像源大约10G.但应该考虑到这些数字在不停的增长. 我们希望你通过HTTP,FTP或RSYNC之一来同步镜像文件,所以必须安装相应的服务.\n\
    \n### 软件包档案的同步推送\n\n当官方源有更新时会用基于SSH的触发器ping镜像.一般每天4次.\n\n如果你还没有专用于镜像的帐号,先创建一个.(本例子中我们专用于镜像的专用用户是”archvsync”):\n\
    \n```\n$ sudo adduser --disabled-password archvsync\nAdding user 'archvsync' ...\n\
    [...]\nIs the information correct? [Y/n]\n```\n\n创建用于存放镜像的目录,然后修改目录属主为刚才创建的专用用户:\n\
    \n```\n$ sudo mkdir /srv/mirrors/kali{,-security,-images}\n$ sudo chown archvsync:archvsync\
    \ /srv/mirrors/kali{,-security,-images}\n```\n\n下一步配置rsync后台程序(按需启用后台运行)导出这些目录:\n\
    \n```\n$ sudo sed -i -e \"s/ENABLED=false/ENABLED=true/\" /etc/default/rsync\n\
    $ sudo vim /etc/rsyncd.conf\n$ cat /etc/rsyncd.conf\nuid = nobody\ngid = nogroup\n\
    max connections = 25\nsocket options = SO_KEEPALIVE\n\n[kali]\n  path = /srv/mirrors/kali\n\
    \  comment = The Kali Archive\n  read only = true\n\n[kali-security]\n  path =\
    \ /srv/mirrors/kali-security\n  comment = The Kali security archive\n  read only\
    \ = true\n\n[kali-images]\n  path = /srv/mirrors/kali-images\n  comment = The\
    \ Kali ISO images\n  read only = true\n$ sudo service rsync start\nStarting rsync\
    \ daemon: rsync.\n```\n\n这个文档不包括WEB服务器和FTP服务器的配置.理论上你应该导出镜像到 [http://yourmirror.net/kali](http://yourmirror.net/kali)\
    \ , [http://yourmirror.net/kali-security和http://yourmirror.net/kali-images](http://yourmirror.net/kali-security和http://yourmirror.net/kali-images)\
    \ (FTP也一样). 现在是有趣的部分:专用用户处理SSH触发器配置和镜像站点的搭建.首先应该用专用用户解压[ftpsync.tar.gz](http://archive.kali.org/ftpsync.tar.gz):\n\
    \n```\n$ sudo su - archvsync\n$ wget http://archive.kali.org/ftpsync.tar.gz\n\
    $ tar zxf ftpsync.tar.gz\n```\n\n现在我们要创建两个配置文件.在模板的基础上至少要修改*MIRRORNAME*,*TO*,*RSYNC_PATH*,和*RSYNC_HOST*这几个参数.:\n\
    \n```\n$ cp etc/ftpsync.conf.template etc/ftpsync-kali.conf\n$ cp etc/ftpsync.conf.template\
    \ etc/ftpsync-kali-security.conf\n$ vim etc/ftpsync-kali.conf\n$ grep -E '^[^#]'\
    \ etc/ftpsync-kali.conf \nMIRRORNAME=`hostname -f`\nTO=\"/srv/mirrors/kali/\"\n\
    RSYNC_PATH=\"kali\"\nRSYNC_HOST=archive.kali.org\n$ vim etc/ftpsync-kali-security.conf\n\
    $ grep -E '^[^#]' etc/ftpsync-kali-security.conf \nMIRRORNAME=`hostname -f`\n\
    TO=\"/srv/mirrors/kali-security/\"\nRSYNC_PATH=\"kali-security\"\nRSYNC_HOST=archive.kali.org\n\
    ```\n\n最后一步建立.ssh/authorized_keys以便archive.kali.org能触发你的镜像.:\n\n```\n$ mkdir -p\
    \ .ssh\n$ wget -O - -q http://archive.kali.org/pushmirror.pub >>.ssh/authorized_keys\n\
    ```\n\n如果你的ftpsync.tar.gz不是解压到home目录,那么你要修正.ssh/authorized_keys中的”~/bin/ftpsync”为相应的路径.\
    \ 现在发一封包含你的镜像URL的email到 [devel@kali.org](mailto:devel@kali.org),以便把你的镜像加入镜像列表.请明确的指出当镜像出现问题(或要进行更改/协商镜像的配置)时我们该联系谁.\
    \ 与其等待archive.kali.org的第一次推送,不如先用离你近的源进行rsync初始化同步,选择上面镜像列表里的任意一个镜像.假设你选了archive-4.kali.org,那么你应该以专用用户权限运行如下命令:\n\
    \n```\n$ rsync -qaH archive-4.kali.org::kali /srv/mirrors/kali/ &\n$ rsync -qaH\
    \ archive-4.kali.org::kali-security /srv/mirrors/kali-security/ &\n$ rsync -qaH\
    \ archive-4.kali.org::kali-images /srv/mirrors/kali-images/ &\n```\n\n### 手工同步ISO镜像\n\
    \nISO镜像源不使用推送同步模式,所以你要建立一个每日运行的rsync计划任务.我们提供了一个可直接用的脚本bin/mirror-kali-images,你只要配置etc/mirror-kali-images.conf,再以专用用户权限把它添加到crontab.\n\
    \n```\n$ sudo su - archvsync\n$ cp etc/mirror-kali-image.conf.sample etc/mirror-kali-images.conf\n\
    $ vim etc/mirror-kali-images.conf\n$ grep -E '^[^#]' etc/mirror-kali-images.conf\n\
    TO=/srv/mirrors/kali-images/\n$ crontab -e\n$ crontab -l\n# m h  dom mon dow \
    \  command\n39 3 * * * ~/bin/mirror-kali-images\n```\n\n请设置一个精确的时间,以防archive.kali.org由于同一时间过多的同步而超负荷..\n\
    \n# Kali Linux官方网站\n\n# Kali Linux官方网站\n\n[Kali Linux](http://www.kali.org \"\
    Kali Linux\")的一系列网站用于给我们的用户提供服务.下列的是Kali官方网站以及它们的用途.请注意这些是Kali Linux发布权威信息来源的**唯一**的官方站点.****\n\
    \n****下列网站是**唯一**的Kali Linux发行版官方网点.********\n\n### 公开的网站\n\n*   [www.kali.org](#37.html_8kxv42w1lav_0)\n\
    \n*   [docs.kali.org](#37.html_8kxv42w1lav_1)\n\n*   [forums.kali.org](#37.html_8kxv42w1lav_2)\n\
    \n*   [bugs.kali.org](#37.html_8kxv42w1lav_3)\n\n*   [git.kali.org](#37.html_8kxv42w1lav_4)\n\
    \n[Kali Linux主站](http://www.kali.org/ \"Kali Linux\")主要用于发布Kali Linux相关新闻,基本信息,和一般相关项目的更新.在这里你会发现与Kali\
    \ Linux相关的新工具,功能和技巧的博文.还有这应该是你[下载](http://www.kali.org/downloads/ \"Kali Linux\
    \ Download\")发行版的唯一来源.\n\n正是你现在访问的.我们的文档站点包含了一系列Kali Linux的基础文档和教程.介绍了Kali翻天覆地的变化并尝试涵盖范围广泛的常见问题.docs.kali.org这个子域名也被视为官方的(文档翻译服务器).\n\
    \n如果你遇到不在[官方Kali Linux文档](http://docs.kali.org/ \"Kali Linux Documentation\"),范围的问题或情况,也许很可能有那么一位[Kali\
    \ Linu论坛](http://forums.kali.org/ \"Kali Linux Forums\")的用户知道如何解决.你会发现Kali论坛成员来自世界各地,技术水平全面,他们热情并乐意帮助想学习的新人.\n\
    \n尽管我们已经为使Kali Linux完美倾尽全力,但无法预知的漏洞和错误是不可避免的.我们的改进有成效,所以当有问题或工具请求时报告给我们.我们鼓励你在[bugs.kali.org](http://bugs.kali.org\
    \ \"Kali Linux Bug Tracker\")提交bug报告,帮助我们把Kali Linux做得更好.\n\n我们的Git树,供那些想密切关注Kali\
    \ Linux开发或想知道他们什么时候应该运行‘apt-get upgrade’的用户查阅.\n\n### 社交媒体\n\n*   [twitter](#37.html_8oxfaif95av_0)\n\
    \n*   [facebook](#37.html_8oxfaif95av_1)\n\n我们在有重要信息的时候才发推.发布信息和博客文章都会被推送到我们的twitter.账户是[@KaliLinux](https://twitter.com/KaliLinux\
    \ \"Kali Linux Twitter\").\n\n帐户和Twitter的一样.我们不会在我们的[Kali Facebook page](https://www.facebook.com/Kali-Linux\
    \ \"Kali Linux Facebook\")灌水,除了有价值的文章.\n\n# Kali Linux漏洞追踪\n\n# Kali Linux漏洞追踪\n\
    \nKali Linux有官方的[漏洞追踪系统](http://bugs.kali.org),用户可以提交漏洞或者补丁给开发者,或者给我们的发行版提交新的工具包.任何人都能在漏洞追踪系统注册,但是我们建议你先看如下规则,以保证漏洞用正确的信息和适当的格式提交给我们.\n\
    \n*   漏洞追踪系统不是客服系统.\n\n*   使用真实的email以便我们在将来需要的时候能及时联系你.\n\n*   使用明确的标题.\n\n*\
    \   尽可能多的提供细节,包括终端输出,系统架构类型和准确的版本.\n\n*   提交新工具包时必须包含新增这个工具的理由和它的URL.\n\n*   不要把BUG共享给任何人一起提交,开发者会判断是谁发现的BUG.\n\
    \n# 10\\. Kali Linux 策略\n\n# 10\\. Kali Linux 策略\n\n# Kali Linux安全更新策略\n\n# Kali\
    \ Linux安全更新策略\n\nKali Linux和Debian的源有紧密的联系,因此安全更新会像Debian发行版一样频繁,更新的都是debian维护的包(大部分).其它包则由Kali团队尽力的维护.\n\
    \n# Kali Linux网络服务策略\n\n# Kali Linux网络服务策略\n\nKali Linux处理网络服务这点上与大部分别的发行版不同.最主要的是Kali默认不启用任何外部监听的服务,目的是在渗透测试时保持最低程度的探测.\n\
    \nKali默认安装了很多服务,例如Apache和SSH.但在需要时你要手动运行他们.\n\n# Kali Linux Root用户策略\n\n# Kali\
    \ Linux Root用户策略\n\n大部分发行版鼓励它们的用户使用一般用户权限来操作.这是个明智的安全忠告,它使得用户和OS之间有一个额外的保护层.特别是对于需要权限分离的多用户系统.\n\
    \nKali Linux本质上是一个安全和审计平台,许多工具都需要用root权限运行.通常,使用Kali Linux时,不可能是多用户环境,因此默认用户是”root”.此外[不建议Linux新手使用Kali\
    \ Linux](http://cn.docs.kali.org/general-use/%e6%88%91%e9%80%82%e5%90%88%e4%bd%bf%e7%94%a8kali-linux%e5%90%97\
    \ \"Should I Use Kali Linux?\"),因为他们在使用超级用户时更容易制造毁灭性的错误.\n\n# 渗透测试工具策略\n\n# 渗透测试工具策略\n\
    \n## Kali Linux工具策略\n\n我们知道很多的工具或脚本都能做同样的工作.有的比较好用,有的是喜好问题.为此,保持渗透测试软件源的更新和可用是一项极具挑战性的任务.Kali开发组使用如下检验标准来判断一个工具是否被包含在我们的发行版.\n\
    \n*   在渗透测试环境下该工具是否 可用/实用?\n\n*   该工具的功能是否与别的工具重复?\n\n*   该工具是否允许自由地重新分发?\n\n\
    *   该工具的依赖关系如何?能否在”独立”环境下运行?\n\n根据这些问题的答案和其它的因素,才决定该工具是否要标记包含在Kali.\n\n多数Kali开发组成员都从事渗透测试工作,结合我们的经验,同时从其它方面考虑,从而为Kali发行版选择最有价值,最好的工具.以DOS,DDOS为目的或无名的工具很少用于合法用途,因此默认不会被安装在Kali\
    \ Linux.\n\n## 请求添加新工具\n\n我们的大门永远向新的和更好的工具敞开,但是每个工具都必须是有效的.请在提交工具上放一些心思和精力,不要只给开发者发一行消息.可以通过我们的[Kali\
    \ Linux漏洞追踪系统](http://bugs.kali.org \"Kali Linux Bug Tracker\")提交新的工具请求..\n\n\
    # Kali Linux开源软件策略\n\n# Kali Linux开源软件策略\n\nKali Linux的`主要`包含了数以千计的自由软件包.作为Debian的衍生版,Kali所有的自由软件都遵循Debian的[自由软件准则](http://www.debian.org/social_contract#guidelines\
    \ \"DFSG\").\n\n与上述不同的是,Kali Linux的`非自由软件`部分包含了一系列由[Offensive Security](http://www.offensive-security.com\
    \ \"Offensive Security\")重新分发的非开源工具,这些工具已经经过开发商的默认许可或特别许可.在把每个Kali专有的非开源软件包导入到你的Kali衍生版之前,你应该先详查这个软件包的授权(从Debian导入的非开源软件包除外).\n\
    \n更重要的是,所有Kali的专有开发或软件整合都已经投入到[GNU GPL](http://www.gnu.org/licenses/gpl.html \"\
    GNU GPL\")下.\n\n如果你想获得更多关于指定软件授权的信息,可以查阅源码包中的`debian/copyright`或从`/usr/share/doc/_package_/copyright`查阅已经安装的包的授权信息.\n\
    \n# Kali Linux商标策略\n\n# Kali Linux商标策略\n\n[Kali Linux](http://www.kali.org/ \"\
    Kali Linux\")和[Offensive Security](https://www.offensive-security.com/ \"Offensive\
    \ Security\")希望我们的商标在网络社区获得广泛的认同,但是也要确保我们的商标用于我们的公司和产品.我们的商标核心策略是**信任**-避免用户在与Kali\
    \ Linux和/或Offensive Security交涉的问题上产生误会.这影响到渗透测试发行版的开发和分发(例如Kali Linux)的**可信度**.\n\
    \n这份文档展示和描述我们的商标,并提供合理使用它们的指南.我们很乐意你公平和诚实地使用我们的商标.如果有意向的话,详细咨询请随时与我们联系.\n\n###\
    \ 我们的一些商标\n\n![tm](kali-tm.png) ![tm](offsec-tm.png) ![tm](dragon-tm.png) ![tm](trademarked-tryharder.png)\
    \ ![tm](guy-tm.png)\n\n### 用于打印,网页,媒体和公开展示\n\n保持商标的外形和拼写很重要.请勿修改商标.包括使用缩写名、添加LOGO、与其它词汇合并.我们建议你像我们一样正确的使用商标."
