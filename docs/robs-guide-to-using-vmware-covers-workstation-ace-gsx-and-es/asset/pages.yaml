- pgno: 308
  md: '# 37.5 Using VMware GSX Server Scripting Commands


    Vmware has created a very comprehensive scripting API that can be used for VMware
    GSX Server and ESX Server. The APIs can be used from within COM-based languages,
    such as Visual Basic or with the Perl scripting language.


    For those administrators who are into programming and for third party developers
    who want to create software to manage a VMware environment, the scripting APIs
    are very valuable. But for the average administrator, simple tasks to run from
    a batch file or shell script will most likely be sufficient. For those purposes,
    VMware has included the vmware-cmd utility which can be used on both Windows and
    Linux to automate tasks.


    Note: The scripting APIs can still be used today, but there is also a Virtual
    Infrastructure Software Developer''s Kit available. With this set of web services,
    you can do the same and much more.


    Actions that can be performed range from starting and stopping virtual machines
    to changing the configuration parameters and connecting removable devices.


    # Suspending virtual machines


    A practical scenario where a script can be used is when you want to suspend your
    virtual machines while shutting down a host instead of having them shut down;
    with the need to start up the entire guest OS again after the host has rebooted.
    Here is a simple script that suspends the virtual machines and then reboots the
    machine:


    ```

    #script to reboot the server

    #first suspends the virtual machines and then reboots

    vmware-cmd /data1/vmware/nw65/nw65.vmx suspend

    vmware-cmd /data1/vmware/suse10/suse10.vmx suspend

    vmware-cmd /data1/vmware/sles9/sles9.vmx suspend

    #maybe do some other stuff;-)

    reboot

    ```


    This sample script demonstrates the syntax of the utility. The vmware-cmd command
    is followed by the path and name of the configuration file and it is concluded
    with the action to be taken.


    # Preparing for a backup


    In section 35.5, I explained that creating a backup of a VMware GSX Server host
    that has running virtual machines is a bad idea. Also, I suggested to stop the
    virtual machines, and to start them again after the backup. The following scripts
    extend the script that I created to reboot the host. In this script, I do not
    list the virtual'
  merge: -1
  img_proc: true
- pgno: 309
  md: "machines manually, but instead I list all the listed virtual machines with\
    \ the vmware-cmd -l command:\n\n```\nfor vm in $(vmware-cmd -l); do\n  vmware-cmd\
    \ $vm suspend\ndone\n```\n\nIf you run this script and the virtual machine is\
    \ already suspended or it is in a power off state the utility will generate an\
    \ error message, explaining that the machine is in the wrong state. So, if you\
    \ have some time on your hands and you have scripting skills, you could extend\
    \ this with a check on the virtual machines' state with the vmware-cmd getstate\
    \ command.\n\n# Command reference\n\nAt the end of this section, I would like\
    \ to provide you a full set of options that are available for the vmware-cmd utility.\
    \ To work with virtual machine actions, use the following syntax:\n\n```\nvmware-cmd\
    \ <options> <vm-cfg-path> <vm-action> <arguments>\n```\n\nTo work with server\
    \ based actions, add the -s parameter to the command.\n\n```\nvmware-cmd -s <options>\
    \ <server-action> <arguments>\n```\n\nTable 37.1: Options for the vmware-cmd command.\n\
    \n| Option | Description |\n|---|---|\n| -H <host> | Specifies an alternative\
    \ host (if set, -U and -P must also be set) |\n| -O <port> | Specifies an alternative\
    \ port |\n| -U <username> | Specifies a user |\n| -P <password> | Specifies a\
    \ password |\n| -h | More detailed help |\n| -q | Quiet - Minimal output |\n|\
    \ -v | Verbose |\n\nTable 36.2: Server actions for the vmware-cmd utility.\n\n\
    | Option | Description |\n|---|---|\n| -l | Lists the registered VMs |\n| -s register\
    \ <config file path> | Registers a VM |\n| -s unregister <config file path> |\
    \ Un-registers a VM |\n| -s getresource <variable> | Retrieves a server resource\
    \ |\n| -s setresource <variable> <value> | Sets a server resource |"
  merge: -1
  img_proc: true
