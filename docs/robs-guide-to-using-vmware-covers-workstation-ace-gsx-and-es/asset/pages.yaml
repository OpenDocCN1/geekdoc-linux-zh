    > Note: Consider the Shared Folder option as a feature to transfer files to and
    from the guest and host and, for example, as a means to install software in your
    guest operating system. Running applications with data from the guest, and accidentally
    accessing the same data from the host, could lead to data loss or corruption.


    # 10.4 Use Virtual or Removable Devices


    For situations where you do not have direct access to the virtual machine, you
    can also work with virtual devices such as floppy disks, or CD-ROM ISO-files.
    You can also attach external USB devices (hard disks, memory keys, ZIP-drives)
    to a virtual machine to transfer data.


    Using virtual media is described in chapter 7: “Virtual disks, floppies and CD-ROMs”


    # 10.5 Use Operating System Specific Networking (all platforms)


    The methods described previously are not available for all platforms. However,
    there is one thing that every operating system nowadays has: networking capabilities.
    Consult the operating system’s manuals to find all information on how to use these
    features.


    Windows

    Use normal Windows workgroup or domain networking to create network shares between
    the host and the guest'
