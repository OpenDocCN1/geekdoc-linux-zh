  md: '# 13 VMware Tips for Linux


    The tips in this chapter are for your Linux guest operating systems, which are
    independent of the host operating system that you run VMware on: Windows or Linux.
    Some of the tips are not really VMware related, but because of the usage scenarios
    for VMware, they are important to know when getting started with Windows and VMware.


    # 13.1 Keep the Kernel and Kernel Source at the Same Patch Level


    When you install VMware Workstation for Linux or when you install the VMware Tools
    inside a Linux guest operating system, on many occasions you need to compile modules
    for your product. One example of such a module is vmmon. The installation script
    will check the kernel version that you are running and will try to compile the
    modules for your kernel. In addition, it also accesses the kernel source files.
    If you install these kernel source files from a CD-ROM when you need them, then
    you most likely will install another version than is currently on your system.
    If you ran an update for your operating system, the kernel could very well be
    updated to a kernel patch level and since you did not install the kernel source
    files during initial installation the kernel is patched but the sources are not.
    Figure 13.1 shows an example where the usr/src/linux directory for the current
    kernel level (found with the uname -r command) is not correct.


    ```

    linux:/usr/src/linux # uname -r

    2.6.5-7.151-default

    linux:/usr/src # ll

    total 1

    drwxr-xr-x 6 root root 248 Sep 5 16:35 .

    drwxr-xr-x 12 root root 344 Apr 3 20:14 ..

    lrwxrwxrwx 1 root root 17 Sep 5 16:35 linux -> linux-2.6.5-7.111

    drwxr-xr-x 3 root root 96 Sep 5 16:31 linux-2.6.5-7.111

    drwxr-xr-x 20 root root 712 Apr 3 20:33 linux-2.6.5-7.151

    drwxr-xr-x 3 root root 72 Mar 18 18:06 linux-2.6.5-7.151-obj

    lrwxrwxrwx 1 root root 21 Apr 3 20:34 linux-obj -> linux-2.6.5-7.151-obj

    drwxr-xr-x 7 root root 168 Mar 23 14:15 packages

    linux:/usr/src #

    ```


    Figure 13.1: An example of a Linux installation with a mismatched kernel source.


    If you run into a problem, such as when the running kernel and the sources are
    not identical, then the easiest option is to use your distributions installation
    directory to re-install the kernel sources package and have them updated automatically.


    If you know how to download and install the correct sources manually, then you
    can find them at the following URL: www.kernel.org.


    When it was necessary to build the vmmon module, it could have displayed a message
    saying: Module.symvers is missing'' modules will have no modversions and Unable
    to build the vmmon module.'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'If that is the case, run the following commands from the Linux source directory.
    First make that directory the present working directory:


    ```

    cd /usr/src/Linux

    make cloneconfig

    make modules_prepare

    ```


    # 13.2 Graphical Installation Problems


    Some Linux distributions have problems with showing the correct graphics during
    installation. One of the problems that you may have come across is the one displayed
    in Figure 13.2, where the SuSE Linux installation is scrambled across four small
    screens.


    ![](img/25fe75b93b97a021effaba85db112a52_169_0.png)


    If you encounter a problem such as the one shown here, there are two options in
    general that let you work around the problem. The first option is to use a text-based
    installation, and the other option is to use VNC to remotely access the installation
    procedure.


    It depends on your Linux distribution if the feature works exactly the way I describe
    here. For example, some parameters could be different.


    Figure 13.2: An example of a graphical installation problem in SuSE Linux.


    Tip: This problem has been fixed in the latest SuSE 10 release.


    # Running a text based installation


    The actions that you need to take to run a text based installation depend on the
    Linux distribution that you want to install. In Figure 13.3, you see an example
    of SuSE Linux installation.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '![](img/25fe75b93b97a021effaba85db112a52_170_0.png)


    In the example shown here, a SuSE Linux installation is being configured to run
    a text-based installation. To do this, press F2 when the boot loader displays
    the boot options.


    From the list of available screen resolutions, select the top most option called
    Text Mode to run a non-graphical installation.


    Figure 13.3: In SuSE Linux, select Text Mode to work around any graphical installation
    problems.


    # Using a VNC based installation


    Another option to work around graphical installation problems is to access the
    installation remotely through a VNC connection. When the boot loader is activated
    from your installation source, enter the VNC parameters to activate this feature.


    ![](img/25fe75b93b97a021effaba85db112a52_170_1.png)


    In the example in Figure 13.4 the parameters have been added to a SuSE Linux installation.
    The sample command is printed below. The vncpassword parameter is optional. If
    you leave it out, you will be prompted for a password. The hostip and netmask
    parameters are also optional. If you leave them out, you will be asked if you
    want to use DHCP or to specify IP settings manually.


    Figure 13.4: Specify VNC parameters to access the installation process remotely.'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'The parameters that can be entered in the boot loader for a VNC installation
    are:


    ```

    vnc=1 vncpassword=<pw> hostip=<ip> netmask=<ip> gateway=<ip>

    ```


    The hostip and netmask parameters are optional, but when you leave them out you
    will be prompted to select either DHCP or to manually enter the static IP information.
    The gateway parameter is always optional. If the computer that is used for the
    remote installation is on the same subnet as the virtual machine you are installing,
    then they will be able to communicate without a gateway address.


    ![](img/25fe75b93b97a021effaba85db112a52_171_0.png)


    Figure 13.5: An example of a Suse Linux installation that is listening for VNC
    connections.


    The installation procedure will start and it will display a message about the
    IP configuration and how to access the VNC server to continue the installation.


    ![](img/25fe75b93b97a021effaba85db112a52_171_1.png)


    On your remote computer, start a VNC client and access the VNC server on its IP
    address and screen number. For example, 192.168.2.150:1 as shown in Figure 13.6.


    Figure 13.6: Access the installation from a client with the IP address and screen
    number.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# 14 VMware Tips for NetWare


    The tips in this chapter are for the NetWare operating system. They apply to all
    versions, from NetWare 4.x to Open Enterprise Server, unless otherwise stated.


    # 14.1 Available Options for the VMware Tools


    Starting with VMware Workstation v3.2, the VMware Tools for NetWare became available.
    You can see available commands by using the help command:


    ```

    VMWTOOL Help

    ```


    Table 14.1: Available commands for the VMware Tools for NetWare.


    | Command | Description |

    |---|---|

    | help | Displays commands and options. |

    | partitionlist | Displays a list of all disk partitions in the virtual disk and
    whether or not a partition can be shrunk. |

    | shrink <partition> | Shrinks the listed partitions. If no partitions are specified,
    then all partitions in the virtual disk are shrunk. The status of the shrink process
    appears at the bottom of the system console. |

    | devicelist | Lists each removable device in the virtual machine, as well as
    its device ID, and whether the device is enabled or disabled. Removable devices
    include the virtual network adapter, CD-ROM, and floppy drives. |

    | disabledevice or enabledevice <device name> | Disables or enables the specified
    device or devices in the virtual machine. If no device is specified, then all
    removable devices in the virtual machine are disabled or enabled. |

    | synctime on or off | Turn the time synchronization with time on the host operating
    system. on or off. By default, time synchronization is turned off. Use this command
    without any options to view the current time synchronization status. Tip: You
    can synchronize the time in the guest operating system, with time on the host
    |'
  merge: -1
  img_proc: true
- pgno: 173
  md: '|  | operating system, only when the time in the guest operating system is
    set earlier than the time set in the host, it must not be in the future. |

    | idle on or off | It allows you to turn the CPU idler on or off. By default,
    the idler is turned on. The CPU idler program is included in VMware Tools for
    NetWare guests.


    **Tip:** Do not use the older commonly used NW-IDLE NLMs. Using those NLMs can
    cause the performance to degrade instead of improve. |


    # 14.2 Network Adapter for NetWare


    It is not obvious what adapter you should use for your NetWare server. When installing
    NetWare in VMware, two or three options are presented, depending on your version
    of NetWare: the CNEAMD.LAN driver, or the CPCNTNW.LAN and PCNTNW.LAN drivers.


    ![](img/25fe75b93b97a021effaba85db112a52_173_0.png)


    Figure 14.2: Choose the PCNTNW.LAN driver for a NetWare guest installation.


    My preference is to use PCNTNW.LAN


    Why? There are a few reasons that build my case for this choice:'
  merge: -1
  img_proc: true
- pgno: 174
  md: '+   - Virtual machines contain the AMD am79C970A Ethernet adapter. The PCNTNW
    driver is created by AMD and the CNEAMD driver is a compatible driver from Novell.

    +   - The PCNTNW driver is from 2000, the CNEAMD driver from 1998

    +   - The PCNTNW driver compared to the CPCNTNW and CNEAMD drivers is written
    in Assembly while the other two are written in C language. This gives a slight
    advantage for the ones written in the C language. The CPCNTNW.LAN driver is newer
    however (2002), and is not available in all versions of NetWare and is not used
    in the Yes Tested and Approved program. I still prefer PCNTNW over the other two.


    By the way, all three drivers work and PCNTNW and CNEAMD are both used in the
    Yes Tested and Approved program by Novell. You can search this database via the
    following URL: http://developer.novell.com/nss.


    # 14.3 Shrinking your NetWare Disks


    How to shrink your disks is described in section 9.2: "Shrinking your virtual
    disks". For every operating system, there a few extra steps that you can take
    to prepare your virtual machine for shrinking. The most important is to remove
    unnecessary files.


    First, you must prepare your volumes. Follow these steps to shrink your disk really
    small:


    # Delete unused files


    There will be many files on your NetWare file system that you perhaps are not
    going to use. Be selective with what you install in the first place. Do you really
    need the exteNd Application Server? Or iPrint with a 200MB driver set?


    Files you can delete from the server without any problems:


    +   - ConsoleOne (sys:\public\mgmt) (Use this from a workstation or even better
    use iManager)

    +   - DNS/DHCP management console (sys:\public\dnshcp)

    +   - sys:\public\winnt & win95

    +   - CD-ROM index files in SYS:\CDROM$$.ROM

    +   - SYS:\PVSW (Pervasive SQL)


    Even after a new server installation, the file system is packed with salvageable
    files (the installer unzips many temporary files to SYS). So, make sure that you
    purge your volumes before shrinking. Purging is available from a client, but with'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'NetWare 6.5 service pack 1 there is a new command available on the server to
    perform this task.


    ```

    PURGEVOLUME SYS (or any other volume name for your server)

    ```


    (output from the purge process is printed to the Logger Screen)


    You can shrink the disk from the VMware tools menu in the GUI. The tools are started
    with the VMTOOLJ.NCF command. Alternatively, you can use FILLZERO.NLM to fill
    all unused blocks with zeroes. The file is available from the tools section on
    the author''s website at the following URL: www.robbastiaansen.nl.


    # 14.4 Use the Snapshot Feature of VMware During Installation


    During installation, and mainly in the GUI part of it, there have been some occasions
    when the installation screen would freeze and stop working. Starting the installation
    over and over again becomes annoying and time consuming. By using the new Snapshot
    feature, you can revert back to a previous point in the installation.


    Based on my experience, you should create a snapshot every time you successfully
    reach one of the following steps in the installation:


    +   - When the GUI installation starts.

    +   - After the files for the installation are copied.

    +   - After making all the selections for products (the NetStorage screen is the
    last one; while in that screen, make a snapshot before it starts creating eDirectory
    objects).


    # 14.5 Remove the Platform Support Module from STARTUP.NCF


    It depends on your hardware, but you may have to remove the Multiprocessor Platform
    Support module (MPS14.PSM) which is added during installation. With this module
    loaded, I frequently had "FOUND SPINLOCK TO BE BUSY WITH SINGLE PROCESSOR ACTIVE"
    Abends.


    More information about this is available in the following Technical Information
    Document: “Single processor server abending often.” TID10067515'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# 14.6 My NetWare Server Keeps Losing Time Synchronization


    Running multiple servers in VMware asks for time synchronization between your
    NetWare servers. You can set this up with the normal Timesync mechanism. It happens
    frequently that NetWare virtual machine configurations lose their time synchronization.
    If your NetWare servers keep losing their time synchronization, then change the
    synchronization parameters as follows:


    +   - Set the Polling Interval to 3600

    +   - Set the Short Interval to 600


    The TID that explains these parameters is located at the end of this paragraph.


    Note: Do not use NTP for time synchronization with NetWare and VMware. The normal
    Timesync synchronization (also via TCP/IP) that NetWare uses is sufficient for
    most configurations.


    Note: After setting up time synchronization between the NetWare servers, do not
    enable the time synchronization that VMware offers between the host and the guest.
    Check this status in the VMware tools in the GUI or with the command VMWTOOL SYNCTIME.


    The parameters described here only work with Timesync. On older versions of NetWare,
    you can use MONITOR.NLM (with !h switch to show hidden parameters). But in NetWare
    5.1 and 6.x, you can use Remote Manager to show the hidden parameters and set
    them accordingly.


    ![](img/25fe75b93b97a021effaba85db112a52_176_0.png)


    Figure 14.3: NetWare time synchronization parameters.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# TIMESYNC SET Parameters Reference - TID10011517


    The parameters described in this section are explained in detail in TID 10011517.
    You can access this Technical Information Document via support.novell.com. For
    the three parameters listed, a short abstract is printed below.


    # Table 14.2: TIMESYNC SET Parameters.


    | Parameter | Description |

    |---|---|

    | Short Interval (SI)

    Default = 10 seconds

    Hidden Parameter | Whenever a server is not synchronized to network time, polling
    occurs at the short polling interval. After synchronization is achieved, the polling
    interval gradually increases until it reaches PI. |

    | Polling Interval (PI)

    Default = 600 seconds | This is the time between polling intervals when time is
    synchronized on the network. If time gets out of sync, the polling interval changes
    to SI. |

    | Polling Count (PC)

    Default = 3

    Upper limit = 1000,

    Lower limit = 1 | The number of "Time Packets" to exchange during a polling cycle.
    |


    # 14.7 Using SCSI Drivers in older NetWare Servers


    Virtual machines in VMware Workstation, GSX Server, or ESX Server contain either
    LSI logic LSI53C10xx Ultra 160 I/O Controller or a Mylex (Buslogic) BT-985 compatible
    host bus adapter. Based on my experience, the LSI Logic driver is the best one
    to choose. If you install a NetWare version prior to version 6.5 with either an
    LSI Logic or Buslogic adapter, you will see that it is not found by the installation
    program. You can add the drivers manually.


    > Note: For NetWare 6.5 and Open Enterprise Server, just select LSI Logic as the
    SCSI controller type. The adapter will automatically be detected and the LSIMPTNW.NLM
    will be loaded. The description that follows is for NetWare 5.1 and NetWare 6.


    Once the servers are up and running, we will add the Buslogic SCSI driver and
    activate the SCSI hard disk driver.'
  merge: -1
  img_proc: true
