- pgno: 33
  md: '# 2.6 Disk Types for your Virtual Machines


    Before you can create your first virtual machine, you will have to understand
    your options for using hard disks and networking first.


    VMware Workstation virtual machines will run with virtual disks which will not
    in any way affect your host computer’s hard disk. You can create partitions in
    your virtual machine, format your disks, and defragment them. None of these actions
    will directly interfere with your physical hard disk. Everything happens in one
    or more virtual disk files that form your virtual hard disk.


    The only relationship with your host hard disk is that your host operating system
    is transferring data to and from your physical disk. Your guest operating system
    is accessing the same physical disk by using the virtual disk files. You can imagine
    that disk intensive operations will slow down your PC dramatically if you are
    running multiple PCs simultaneously on a single disk channel.


    You have three hard disk options when creating new virtual machines.


    +   - A virtual disk that will **grow dynamically** to the maximum virtual hard
    disk size.


    This is the default option, as well as the option that is used when doing a typical
    creation of a virtual machine. **I recommend using this disk type if you are just
    getting started with VMware Workstation.** A .vmdk disk file that is only a few
    kilobytes in size will be created. The .vmdk file grows dynamically; this is only
    the case if you start putting data on the hard disk from the guest operating system,
    during installation and afterwards (when working with the machine).


    The advantage is that your virtual machine will only take as much space as is
    really needed by your guest operating system and its applications and data. You
    can create a 100 GB disk that will start small and grow to 1 or 2 GB after installation
    without ever using the entire 100 GB on your host PC.


    The disadvantage of this disk type is that with the file becoming larger over
    time, it will become very much defragmented on your host PC’s hard disk and will
    make it slower. Growing the disk also has a negative impact on performance.


    These dynamically growing disks are not automatically shrunk. You will have to
    go through a manual process described elsewhere in this book to decrease the size
    of your virtual disk file.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '+   - A virtual disk that has a **fixed size** equal to the maximum virtual
    hard disk size.


    When creating a virtual disk from the New Virtual Machine Wizard, you can enable
    a check box for your virtual machine to **Allocate disk space now**. This option
    allows the VMware Workstation to create a virtual disk file which has the same
    size that you specify for the virtual hard disk on the host PC. Creating a 100
    GB virtual hard disk would take up 100 GB of hard disk space on your host PC’s
    hard disk.


    The advantage of this disk type is that even though it may take longer to create
    the disk, running the virtual machine is still faster because the disk will not
    be so defragmented on your host PC’s hard disk. This is only true if you make
    sure that there is enough space to sequentially create the entire file. Use the
    Windows Defragment utility to analyze this before and after you create the file.


    You will need to use this type of disk if you want to use a clustering solution
    with a shared disk, as explained in a later section of this book.


    +   - Use a physical disk in your virtual machine.


    This is considered to be a configuration for advanced users. It allows you to
    use a disk partition from your existing physical disk, from within a virtual machine.
    The advantage is that it is the fastest type of disk access you can obtain for
    your virtual machine, but the disadvantage is that you need to partition your
    hard disk just as you would with a multi boot PC. Also, you will not be able to
    save the virtual machine easily with its configuration and disk files into an
    archive for back-up. In addition, it can not be used for future installations
    based on the same virtual machine copy.


    It could be a useful installation if you have a dual boot PC, because you can
    start your extra operating system from the boot loader or from within a virtual
    machine.


    Tip: I recommend the type of virtual disk that grows dynamically (the default
    selection when creating new virtual machines). It does not take up too much hard
    disk space, the performance is acceptable, and it is very easy to create an archive
    of a virtual machine by just copying the files to a safe location.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# 2.7 Networking Options for your Virtual Machines


    Nowadays, all computers as well as your virtual machines come with a network adapter.
    It is important to know what types of networking you can use, because choosing
    the wrong type can prevent you from accessing your services in the virtual machines.
    It can also have undesired effects on your existing network.


    In general, you have two types of networking options available: bridged and host-only.


    # Bridged networking


    This is the default type of networking that is selected when you create your virtual
    machine. It allows your guest operating system to communicate with the physical
    Ethernet network that your host is also using. The virtual machine has its own
    MAC address (a unique address for every networked machine) and will need to have
    its own IP address that it will either receive automatically from your DHCP server
    or that you will manually configure.


    Accessing the network (and via that, the Internet) is very simple and straightforward.
    You must of course be aware that everything that you run inside your virtual machine
    will be accessible from the network. Therefore, installing a server of some sort
    (Domain Controller, DHCP server) will have serious implications for other users
    on your network. Unless if the plan was to run these services inside of the virtual
    machine in the first place. Just be aware of this, because you would not be the
    first one to run an extra DHCP server at a customer site, after accidentally running
    the wrong virtual machine.


    # Host-only networking


    If your virtual machines do not have to communicate with the network, or if you
    want to prevent this because you want to test network services that may not leak
    out onto the network, you can select this type of networking. All network traffic
    will be handled by an internal VMware process and nothing will leave your host
    PC. Virtual machines will be able to communicate with each other, and by using
    the virtual host-only adapter, your host operating system can also communicate
    with the guests. VMware comes with a DHCP service for your host-only network.
    The VMware manual describes how to use and configure this in detail.


    # What networking option to use


    If you will be running a simple workstation with Windows or Linux, then your best
    choice is bridged networking. You can access the network and, if available, the
    Internet, and update the machines with the latest patches.'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'Switching between bridged networking and host-only networking can be done on-line,
    when your virtual machines are up and running.


    You can either select VM → Settings from the menu and then configure the networking
    option, or you can double click the network adapter icon on the right lower corner
    of your virtual machine. This will also bring up the networking control panel.


    If you need advanced configuration options and tips on networking, go to section
    11: “Networking configurations”


    ![](img/25fe75b93b97a021effaba85db112a52_36_0.png)


    Figure 2.4: The networking configuration can be modified when a machine is on-line.


    Tip: I have met a lot of people who have problems with accessing virtual machines
    and the LAN when they start configuring their physical and virtual adapters. It
    is very important to make sure that all adapters (physical, including wireless,
    host-only VMnet1 and VMnet8) are in different IP subnets. A real PC with two network
    adapters on different Ethernet segments, but with the same IP subnet used on both
    LANs will not know where to send its packets.


    Compare it to a junction with two signs pointing to Paris. You would also be confused
    as to what direction to choose (unless they both point to Rome, of course, since
    we know that all roads lead to Rome!).


    A PC with a physical adapter and or more virtual adapters that have been configured
    for the same subnet will have the same problem and will prevent you from accessing
    hosts on either the physical or virtual networks.


    # 2.8 Virtual Machine Hardware Specifications


    A great advantage of virtual machines is that they always provide you with the
    same hardware. Independent of the hardware in the host system, the hardware inside
    the virtual machine stays the same. The only component that will be different
    is the processor, since the virtual machine will work with the underlying'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'processor from the host machine. It also does not matter whether you have installed
    your virtual machine on a Windows or a Linux host; you can transfer it between
    these two supported host operating systems.


    Every virtual machine has these hardware specifications:


    +   - Same processor as on the host computer

    +   - Intel 440BX-based motherboard with NS338 SIO chip and 82093AA IOAPIC

    +   - PhoenixBIOS™ 4.0 Release 6 with VESA BIOS

    +   - A maximum of 3.6 GB of RAM for each individual virtual machine (with a limit
    of 4 GB maximum for all virtual machines).

    +   - VGA adapter that supports SVGA

    +   - A maximum of seven SCSI devices

    +   - SCSI controller: Mylex® (BusLogic) BT-958 compatible host bus adapter or
    an LSI Logic Ultra320 LSI53C10xx SCSI controller)

    +   - Virtual SCSI disks with a maximum size of 950 GB

    +   - A primary and secondary IDE channel for up to four devices

    +   - Virtual IDE disks with a maximum size of 950 GB

    +   - A maximum of three AMD PCnet-PCI II compatible Ethernet adapters

    +   - Creative Labs Sound Blaster® AudioPCI emulation

    +   - Virtual floppy drives (maximum of two), parallel and serial ports, and two
    USB ports

    +   - Two-port USB 1.1 UHCI controller

    +   - Keyboard and PS/2 mouse


    # 2.9 Creating your First Virtual Machine


    It is now time to create your first virtual machine. I will walk you through the
    steps in the Wizard and will explain all your options. I will also explain what
    the implications are when selecting settings other than the default.


    You create your virtual machine after starting VMware Workstation by selecting
    New Virtual Machine from the File menu or from the main window. This will start
    the New Virtual Machine Wizard.


    +   1. The first option that you have to select is whether to use the typical
    or the Custom configuration. I am assuming that you are the investigative type
    or an advanced user, so we will use the Custom configuration and go through it
    step by step.

    +   2. The next window will be new to users that have worked with version 4.x.
    You are prompted with the choice (Figure 2.5) to either create a new virtual machine
    or a legacy machine that is compatible with version 4.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '![](img/25fe75b93b97a021effaba85db112a52_38_0.png)


    The default selection for version 5 is to create a new machine. The legacy machine
