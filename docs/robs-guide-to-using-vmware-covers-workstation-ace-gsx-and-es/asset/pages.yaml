- pgno: 285
  md: '# 35 Managing GSX Server and Virtual Machines


    The main advantage of VMware GSX Server compared to the Workstation product is
    that you can manage your server and the virtual machines from remote connections.
    You do not have to be present at the GSX Server console and there is no need to
    connect to the host with a remote control utility such as VNC. With VMware GSX
    Server, management can be performed with Windows and Linux client applications
    and the Management Interface.


    # 35.1 Using the Management Interface


    With VMware GSX Server’s Management Interface, you can manage the host itself
    as well as the virtual machine environment. The web based console allows you to
    create and delete virtual machines, change the properties of existing machines,
    and power the machines on and off. The console also allows you to check the status
    and performance statistics of your GSX Server.


    Tip: If you have more than one GSX Server, you need to login to each individual
    Management Interface to manage them. To simplify the management task and to gain
    even more control over your virtual machine environment, I recommend that you
    use the VMware VirtualCenter application. It allows you to manage all your GSX
    and ESX Servers from one console. You can read more about this application in
    chapter 1: “Introduction to VMware ESX Server”.


    At this point, I am assuming that you have the Management Interface up and running
    on your server. Instructions on how to install this feature can be found in the
    previous sections regarding the VMware GSX Server installation.


    To login to the Management Interface, start your browser and enter the following
    URL:


    ```

    https://hostname-or-ip-address:8333

    ```


    An example of the URL and login page is shown in figure 35.1.'
  merge: -1
  img_proc: true
- pgno: 286
  md: '![](img/25fe75b93b97a021effaba85db112a52_286_0.png)


    Figure 35.1: The login page for the VMware Management Interface.


    By default, the Management Interface is configured to use SSL. This is why you
    need to connect to the server with the HTTPS protocol. If SSL is not available
    on your server, you can access the service on port number 8222 with the regular
    HTTP protocol. This is not secure, of course. Your username and password will
    be transported across the network in clear text. Therefore, if you contact the
    service through HTTP on port 8222, and if SSL is available, you will automatically
    be redirected to HTTPS port 8333.


    The login page allows you to download the console applications for both Windows
    and Linux. You can also download these when you are already logged in to the Management
    Interface.


    You can now log in to the Management Interface with a user name and password.
    This could be Administrator for Windows or root for Linux; however, I suggest
    that you always use another user name than the default administrative account.
    This is common practice anyway. The user account that you use to login to the
    Management Interface will define what rights you have. How to set up the users''
    rights is explained later on in this chapter.


    Using different levels of access for users enables you to create roles in your
    organization for different types of administrators. For example, you can have
    a group of administrators that is only allowed to manage the existing Windows
    servers in your environment and is not allowed to create any new machines. In
    that case, you can give them the rights that they need on the Windows server virtual
    machines and the minimal right to see the other servers that are running.


    Once you are logged in, you will see a list of virtual machines, their status,
    and the status information of your VMware GSX Server. An example of a Management
    Interface browser window is displayed in Figure 35.2.'
  merge: -1
  img_proc: true
- pgno: 287
  md: '![](img/25fe75b93b97a021effaba85db112a52_287_0.png)


    Figure 35.2: VMware GSX Server and its virtual machines can be managed from the
    web based Management Interface.


    Most features available in the Management Interface are simple and self explanatory.
    If you need any information about how to create a new virtual machine, change
    the properties of a machine and so on, I suggest that you check out the VMware
    GSX Server documentation.


    Figure 35.3 displays the controls of the Management Interface that are available
    for each virtual machine.


    ![](img/25fe75b93b97a021effaba85db112a52_287_1.png)


    Figure 35.3: Every virtual machine can be managed with these controls.'
  merge: -1
  img_proc: true
- pgno: 288
  md: 'Tip: If you have any problems with your virtual machines'' controls or with
    accessing the properties windows for your machines, check the pop-up settings
    for your browser. It might prevent your browser from showing the configuration
    windows that you are trying to access.


    There are a few specific items that I would like to explain about working with
    the Management Interface.


    # Heartbeat


    One of the items that I would like to explain regarding the Management Interface
    is the meaning of the heartbeat which is displayed next to the power control button
    of the virtual machines. When the VMware tools have been loaded inside your virtual
    machine, it will continuously send heartbeats to the GSX Server. When all heartbeats
    have been received within the minute before the screen was refreshed, the percentage
    of received heartbeats is 100% and the indicator will be green. When all the heartbeats
    have not been received, the percentage drops and the indicator will be orange.
    When you have not loaded the tools, the indicator will be greyed out because in
    that case the heartbeat is not available at all.


    Tip: If you notice strange heartbeat behavior, such as when the percentage is
    low but the virtual machine is performing very well by itself, check if you have
    the correct version of the VMware tools loaded inside the guest operating system.


    # Start up and shutdown options


    The Management Interface also allows you to configure the startup and shutdown
    options for your virtual machines. It allows you to configure specific actions
    for your machines when the GSX Server is started on your Windows or Linux host.
    There might be virtual machines that always need to be available, whereas others
    should only be started when you need them, such as servers that you use for testing
    purposes.


    By default, the settings are not to start the virtual machine when the host starts
    and to power off the virtual machine when the host shuts down. You can change
    these settings from Management Interface. Click on the name (hyperlink) of the
    virtual machine that you want to manage, or select configure options from the
    pop-up menu by clicking the arrow next to the virtual machine icon. In the Options
    tab, you will find the configuration options, as displayed in Figure 35.4.


    Note: On a Windows host, the startup option can only be set to automatically start
    the virtual machine if the machine is configured to run as the local system account
    or as a specified user.'
  merge: -1
  img_proc: true
- pgno: 289
  md: '![](img/25fe75b93b97a021effaba85db112a52_289_0.png)


    Figure 35.4: Startup and shutdown options can be configured on a per virtual machine
    basis from the Management Interface.


    Note: Selecting the shutdown option, and shutdown guest operating system, requires
    that the VMware tools are running inside the guest operating system. Be aware
    that only Windows and Linux guests support the shutdown option through the tools.


    Tip: VMware GSX Server does not support suspending virtual machines when your
    host is being shut down. Using suspend and resume saves a lot of time compared
    to stopping the guest operating system and restarting it again when the GSX Server
    is started. The GSX Server scripting facility allows you to suspend your machines
    from a script. Therefore, if you configure a script that is used for a server
    shutdown, it can suspend your machines. You can even specify the order in which
    to shutdown the machines. See the scripting section that starts on page 307 for
    an example of such a script.


    # Virtual Machine Configuration


    We have looked at the virtual machine configuration options from within the Management
    Interface. Based on my personal experience, I can say that it is easier to configure
    those options, which are available both from the virtual machine console or VirtualCenter,
    from these respective applications. The reason is that the graphical interface
    on Windows (for both) and Linux (for the Remote Console) allows you to work much
    easier with the configuration options. One example is attaching an ISO file to
    a virtual machine. With Management Interface, you have to type the path and filename
    for the ISO image, whereas in the graphical utilities you can browse to the file.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# 35.2 Using the VMware Virtual Machine Console


    After the installation of the GSX Server on a Windows host, you will automatically
    have two console options available. A shortcut will be made on the desktop. These
    two options are the VMware GSX Server console and the VMware virtual machine console.
    The latter is the same application which you can install on your clients. The
    specific VMware GSX Server console automatically connects to the local server.
    The client version asks you what host you would like to connect to.


    On a Linux host, the VMware virtual machine console is the only one that is installed
    and it always works in the same way as it would on the client. It prompts you
    to login to the local server or a remote GSX Server. An example of a login prompt
    is displayed in Figure 35.5. The Windows client window has the same layout as
    this Linux window.


    ![](img/25fe75b93b97a021effaba85db112a52_290_0.png)


    Figure 35.5: An example of connecting to a GSX Server host, where the port number
    has been changed to something other than the default value of 902.


    In order to work with your virtual machines from a client computer, you need to
    install the VMware virtual machine console application on your Windows or Linux
    computer. The easiest way to obtain the software is to login to the Management
    Interface from a browser. On the login page and on the main page after the login,
    a link is available to download the client application for both Windows and Linux.
    Another way to obtain the software is to download it from the VMware website.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# Windows installation


    To install the client application on a Windows computer, you simply need to run
    the executable that you download. At the time of writing this book, the file name
    is VMware-console-3.2.0-14497.exe. After the installation, you can simply start
