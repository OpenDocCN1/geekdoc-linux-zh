    5. Your next choice is to decide how much memory to use for your virtual machine.
    The default of 256 MB of RAM shown below is the default for Windows XP and SuSE
    Linux.


    ![](img/25fe75b93b97a021effaba85db112a52_39_0.png)


    Figure 2.7: Set the memory to your needs or accept the defaults.'
  merge: -1
