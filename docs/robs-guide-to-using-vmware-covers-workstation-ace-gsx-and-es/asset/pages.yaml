- pgno: 79
  md: 'From the list of available policies in Table 5.1 there are two that need further
    explanation. The encryption and authentication policy and the network quarantine
    policy allow you to secure the VMware ACE virtual machine environment. They are
    discussed in the following sections.


    # 5.6 Virtual Machine Encryption and Authentication


    This policy allows you to define the local security level for the virtual machine
    as well as who can access this machine. Figure 5.5 shows an overview of this policy''s
    settings.


    ![](img/25fe75b93b97a021effaba85db112a52_79_0.png)


    Figure 5.5: Security can be defined for every individual virtual machine.


    The encryption feature encrypts the entire virtual machine''s hard disk contents.
    If you enable this option, you must configure authentication for the virtual machine.
    Content encryption is performed when the virtual machine is deployed to the end
    user. This increases the deployment time. Depending on the size of the virtual
    machine''s hard disk and the speed of the end user''s computer, it can take anywhere
    from just a couple minutes up to ten or more minutes.'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'The other checkbox for this part of the policy, Protect virtual machine configuration
    files from user tampering, stores the virtual machine''s configuration file (.VMX)
    in a non-editable format. You should always leave this setting enabled. If you
    do not leave it enabled, then the user can copy the virtual disk file including
    the vmx file and run it with another version of VMware, such as Workstation.


    When the encryption feature is enabled, it is required to assign password management.
    You must also specify if recovery is possible for the virtual machine. With this
    setting enabled, the user can request a hot-fix and ask for a new password or
    to re-enable an expired or copy-protected virtual machine.


    # Password protection


    A virtual machine can be secured with a password. It is required to start the
    virtual machine. With the simplest setting, the user will be prompted for a password
    when he or she starts the machine for the first time.


    ![](img/25fe75b93b97a021effaba85db112a52_80_0.png)


    Figure 5.6: Password restrictions for the ACE virtual machine.


    You can configure the restrictions that you want to apply for the virtual machine.
    The configuration allows you to enforce a minimum length and the use of a mixture
    of characters: uppercase, lowercase, numbers and symbols and punctuation, such
    as the exclamation mark and colon when choosing a password. If you need more complex
    rules or the password expiration feature, you must connect the virtual machine
    to Active Directory.


    To enable password management for virtual machines through Active Directory, you
    must specify the domain that you want to connect to. You can do this from the
    Project Settings window. Or, you will automatically be prompted to do so when
    you choose to specify users and groups for the virtual machine and you have not
    configured the domain already.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '![](img/25fe75b93b97a021effaba85db112a52_81_0.png)


    Figure 5.7: Define the domain where you want to store the policies for the virtual
    machine.


    ![](img/25fe75b93b97a021effaba85db112a52_81_1.png)


    The Active Directory domain which you want to use to store the virtual machine
    passwords must be initialized. This creates a container where the policies will
    be stored. You must log into the domain with administrator privileges to create
    this configuration.


    Figure 5.8: Create a container to store policies.'
  merge: -1
