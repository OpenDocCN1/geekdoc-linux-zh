- pgno: 115
  md: 'these settings can be re-configured to allow the virtual machines to work simultaneously.
    If there is no need for the machines to interact with each other (the network,
    or the host), leave the configuration in place and set the network interfaces
    to different host-only networks.


    For example, you can run a virtual machine on VMnet5 without having to set up
    VMnet5 in your host operating system. This configuration procedure is explained
    in section: 11.2 “Configure host-only and bridged networking”.


    # 7.3 Using Virtual Disk Manager


    This utility enables you to work with virtual disks outside of the VMware Workstation
    environment. Typically only your guest virtual machines have access to the virtual
    disks. With this program you can access them directly from the command line. Some
    of the main features of the VMware Virtual Disk Manager utility are:


    +   - Expanding the size of virtual disks.

    +   - Converting virtual disks from dynamically growing to fixed size and vice
    versa.

    +   - Create, modify, and defragment virtual disks from a command line utility
    which you can use to script virtual disk operations.


    The Virtual Disk Manager used to be only available for Windows hosts but it is
    now also available for Linux. On Windows, the utility (vmware-vdiskmanager.exe)
    is installed with VMware Workstation version 5. The default location is:


    ```

    C:\Program Files\VMware\VMware Workstation.

    ```


    For Linux, the executable is called vmware-vdiskmanager and it is located in /usr/bin.


    In this section, I will cover some of the basic features that you might need for
    your environment. The online documentation covers the full set of features for
    this utility.


    The command line format is as follows:


    ```

    vmware-vdiskmanager OPTIONS diskName | drive-letter:

    ```


    > Note: The drive letter option is only useable if a disk is first mounted with
    the VMware Disk Mount Utility and it is only available on a Windows host.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# Table 7.1: Available options for VMware Virtual Disk Manager.


    | Option | Description |

    |---|---|

    | -c | Create disk. The -a, -s and -t options must also be specified. |

    | -d | Defragment the specified virtual disk. |

    | -k | Shrink the specified virtual disk (Windows host only). |

    | -n <source disk> | Rename the virtual disk; need to specify destination disk-type
    with the -t parameter. |

    | -p | Prepare the mounted virtual disk specified by the drive-letter for shrinking
    (Windows host only). |

    | -q | Do not log messages. |

    | -r <source-disk> | Convert the specified disk; need to specify destination disk-type
    with the -t parameter. |

    | -x <new-capacity> | Expand the disk to the specified capacity. |

    | Additional options for create and convert: |  |

    | -a <adapter> | Adapter type (ide, buslogic or lsilogic). |

    | -s <size> | Capacity of the virtual disk. The capacity can be specified in sectors,
    KB, MB, or GB. The capacity range for IDE adapters is from 100 MB to 128 GB. For
    SCSI disks this number ranges from 100 MB to 256 GB. |

    | -t <disk-type> | Disk type id. You can specify the following disk types: 0:
    single growable virtual disk 1: growable virtual disk, split in 2 GB files 2:
    pre-allocated virtual disk 3: pre-allocated virtual disk, split in 2 GB files
    |'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'The following are a few usage examples for using the Virtual Disk Manager:


    # 1. Create a new virtual disk


    To create a new virtual IDE disk with a capacity of 10 GB that is fixed sized,
    and is split into 2 GB files, enter the following command:


    ```

    vmware-vdiskmanager -c -t 3 -s 10Gb -a ide

    idedisk.vmdk

    ```


    # 2. Increasing the size of an existing disk


    To increase the size of an existing disk to 10 GB, enter the following command:


    ```

    vmware-vdiskmanager -x 10gb diskfile.vmdk

    ```


    Tip: Expanding the size of a disk does not modify the partitions of your guest
    operating system installation. You can use the newly created space to create new
    partitions or use a partition manager inside the virtual machine to resize the
    partition.


    # 3. Converting a virtual disk


    To convert a pre-allocated disk to a dynamically growing disk which is not split
    into 2 GB files, you enter the following command:


    ```

    vmware-vdiskmanager -r fixeddisk.vmdk -t 0

    dyndisk.vmdk

    ```


    You must delete the original disk from the virtual machine and add the new converted
    disk manually, from the VMware Workstation virtual machine configuration.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# 7.4 Using the DiskMount Utility


    Have you ever needed to get a file from a virtual machine which was on your computer?
    Or, have you had to put a file into the virtual machine? You have to start the
    virtual machine, log in to it, and then either drag and drop the file, or use
    Shared Folders (or a networking connection) to copy files back and forth between
    the guest and the host. And what do you do when Windows does not start any more
    in your virtual machine and you need to replace a DLL, or want to save a crucial
    file from the machine? The answers to these questions are covered next for Windows
    and Linux operating systems.


    # Windows


    You can now also use the DiskMount Utility to access virtual disk files from outside
    the virtual machine. The utility mounts a virtual disk as a drive letter in your
    Windows environment, so that you can access it for read and write access from
    Windows Explorer or any other application directly. The VMware DiskMount Utility
    supports virtual disk files created with VMware Workstation, VMware GSX Server
    2.5.1 and 3.x, and VMware ESX Server 2. Also, it can be installed on Windows 2000/2003
    and XP.


    # Linux


    The DiskMount utility itself is only available for Windows. VMware Workstation
    for Linux comes with a Perl script named vmware-mount.pl. With this script, virtual
    disk files can be mounted on a Linux host.


    > Note: The VMware DiskMount utility is provided without support from VMware.


    The utility is available for download via www.vmware.com/download. This download
    location also contains a PDF manual with the full documentation to this software.


    After downloading and installing the utility on Windows, you can access the utility
    (vmware-mount.exe) from its installation directory. By default, this is C:\Program
    Files\VMware\VMware DiskMount Utility.


    Run vmware-mount.exe /h to get a list of all the options that are available. On
    Linux, you run the utility with the vmware-mount.pl script located in /usr/bin.


    To use the utility, follow the guidelines hereafter for Windows and Linux.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# Windows configuration


    ```

    vmware-mount [driveletter:] [path-to-virtual-disk] [options]

    ```


    Table 7.2: Available options for the vmware-mount utility on Windows.


    | Option | Description |

    |---|---|

    | /d | Deletes the mapping to a virtual drive volume. |

    | /f | Forcibly deletes the mapping to a virtual drive volume. |

    | /v:n | Mounts volume N of a virtual disk. |

    | /p | Displays the partitions (volumes) on a virtual disk. |

    | /y | Opens the virtual disk whether or not a snapshot is in effect. |

    | /n | Does not open the virtual disk if a snapshot is in effect. |


    The most simple usage scenario is to start the utility with a drive letter and
    a path to a virtual disk file, as in the following example that mounts a disk
    to the K drive:


    ```

    vmware-mount.exe K: "C:\VMWARE\W2K Workstation\W2K Prof.vmdk"

    ```


    Note: Use quotes around the path to the virtual disk file if the path contains
    spaces.


    Running the executable without any options displays a list of active disk mounts:


    ```

    vmware-mount.exe

    K:\ => C:\VMWARE\W2K Workstation\W2K Prof.vmdk

    ```


    You can dismount a virtual disk with the /d option as in the following example:


    ```

    vmware-mount.exe K: /d

    ```


    Tip: When you can not dismount a disk and one of the following messages appears,
    the disk is probably still in use.


    ```

    Unable to dismount volume.

    To forcibly dismount the volume, use the /f option.

    ```'
