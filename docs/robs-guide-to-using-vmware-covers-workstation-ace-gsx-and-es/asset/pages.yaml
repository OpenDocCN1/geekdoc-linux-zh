- pgno: 249
  md: '9. In the NCS Shared Media Selection window, the Yes button should be enabled
    for the question, if the cluster has shared media. The drop down list should list
    your shared disk. The first image here is of a shared virtual SCSI disk, the second
    image is of an iSCSI target disk.


    ![](img/25fe75b93b97a021effaba85db112a52_249_0.png)


    Figure 28.8: Select the disk where to install the SBD partition.


    If your shared disk is not listed and the No button is selected, then you will
    have to troubleshoot this first, before continuing on further. The NetWare Cluster
    Troubleshooting paragraph at the end of this chapter contains some tips on what
    to do if your shared disk is not recognized.


    10. In the Start Clustering window, select whether you want to start clustering
