- pgno: 12
  md: '# Introduction


    It is unbelievable what can happen in the IT industry over the course of only
    one year. In July of 2004, the first edition of Rob''s guide to using VMware was
    published. It is now September 2005 and in just over one year a lot has happened.
    The first VMware conference (VMworld) was held in San Diego in October of 2004,
    VMware shipped a new product called ACE, VMware Workstation version 5 became available
    and earlier this year the VMware Technology Network for Developers went live.
    Last but not least, in August of 2005 VMware announced that they will drive the
    development of Open Standards on Virtualization in a joint effort with many leading
    companies in the IT industry. Part of the deal includes sharing the ESX Server
    source code with those partners in a new program called VMware Community Source.
    Also in August of 2005, Sun Microsystems announced that they will support VMware
    ESX Server for use on their Sun Fire x64 systems.


    As you can see, these are interesting times for the virtualization community.
    And there is more to come. A new version of VMware ESX server (v3) is around the
    corner and new processors from Intel and AMD will contain support for virtualization,
    which will bring this technology to an even higher level of performance, scalability,
    and stability.


    With this second edition of Rob''s guide to using VMware, I hope that I have succeeded
    in helping you get the most out of your VMware products and to give you a good
    overview of the VMware software that is available today.


    # What this book covers


    This is the second edition of my VMware guide. The feedback that I received on
    the first edition was great and gave me a lot of insight into what I could add
    or change for this new edition. Of course, I have updated the VMware Workstation
    sections to support version 5, which was released in April of 2005. However, I
    have also made a lot of progress on the Linux platform and have added a lot of
    new material about VMware on the Linux platform, in this new edition.


    In this new edition, the physical to virtual conversion, clustering, and the operating
    system specific chapters about installation and configuration have been updated.


    New parts of this book are VMware ACE and the VMware server products: GSX Server
    and ESX Server. Several new books on VMware ESX server became available in the
    summer of 2005. For an in depth technical discussion about this product, I suggest
    that you read one of these new books. I have tried to write a comprehensive introduction
    to VMware ESX Server, which will help you get started and will also help you decide
    what VMware product you should choose.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# About the author


    Rob Bastiaansen is well known in the international VMware community. He has dedicated
    his website to VMware products since he started working with VMware version 2
    in 2000. He was the first person to describe how to set up a cluster within VMware
    for the NetWare and Windows operating systems. Since then he has answered many
    questions on VMware products and clustering and he published the first edition
    of his VMware guide in July of 2004. He has also published articles on VMware
    technology for technical magazines in The Netherlands, where he resides.


    In 2005, Rob published his second book called The NetWare Toolbox. Also, in early
    2005 he started his own publishing company called Books4Brains. In addition to
    publishing his own books, Books4Brains offers a framework for other authors to
    publish their books under conditions that no large publishing houses offer.


    Rob owns his own company and works as a consultant and instructor. Most of his
    work is focused on Novell software and VMware technology. He is a Master Certified
    Novell Instructor, Certified Directory Engineer, and a Novell Certified Linux
    Engineer. He is also certified for the Linux Professional Institute and as a Microsoft
    Certified Systems Engineer. Rob works with all major operating systems including
    NetWare, Windows, and Linux.


    # About the reader


    Clearly, you are reading this book because you are interested in VMware technology.
    Whether you want to get started with VMware Workstation, or want to set up an
    advanced configuration with NetWare or Windows clustering, this book is for you.
    In writing this book, I have assumed that you are knowledgeable about installing
    the operating systems that you want to use in VMware. Therefore, you will not
    find detailed instructions on how to set up Windows, Linux, or NetWare. I am also
    assuming that you are able to read documentation manuals, so I have chosen not
    to cover too much basic information, such as how to add USB devices or other equipment
    to your virtual machines.


    However, if you are new to VMware products, you will find a section which describes
    what VMware technology is and how to set up your first virtual machines. This
    information was not included just because it is not covered in the manuals; instead,
    it is included because many people need just a few basic guidelines to get started
    and they may want to get up to speed quickly. An example of this is: How to get
    started with clustering in VMware when you have not worked with VMware before.


    If you are an experienced ESX server administrator, the introduction chapter in
    this book does not teach you anything new. However, the configuration tips for
    the entire range of VMware products covered in this book will contain at least
    some material that you will find useful for your environment.'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'Finally, you may be looking for tips on using VMware, such as how to create
    Virtual Floppy Disks. Also, you may need troubleshooting tips on VMware, or you
    may want to set up routing with virtual machines. You will find all of this information
    in this book.


    # Acknowledgements


    Like many authors, I have to thank my family for the support they have given me
    during the period of writing this book. It is fun writing about VMware technology,
    but enjoying a day in the woods or playing games is really helpful in keeping
    you focused on what is really important in life.


    A special thank you goes to Ron van Herk and Robert Zondervan at Novell for sharing
    their information with me about the updated clustering configuration for VMware
    Workstation. And I would like to thank Ronald Beekelaar for sharing his knowledge
    on Virtual PC with me for the conversion process.


    I hope that you will enjoy the virtualization comics in this book. They were made
    especially for this second edition of Rob''s guide to using VMware by Howard Tayler,
    the creator of Schlock Mercenary, the on-line comic space-opera found daily at
    www.schlockmercernary.com.'
  merge: -1
  img_proc: true
