- pgno: 125
  md: '# 7.8 My Virtual Machine Does not Boot from CD-ROM


    After installing your operating system, and when your virtual machine boots with
    an empty hard disk, you may encounter this error message: No bootable CD. Floppy
    or hard disk was detected.


    If you did assign an operating CD-ROM to install from, check the BIOS of your
    virtual machine. Most likely your CD-ROM is not listed before your hard drive
    in the boot-order. Press F2 while booting the virtual machine to enter the setup.
    In BIOS, go to the Boot menu option, and use the + and – keys to change the boot
    order of your CD-ROM device.


    ![](img/25fe75b93b97a021effaba85db112a52_125_0.png)


    Figure 7.9: Set the CD-ROM drive in the BIOS to be the first boot device.


    ![](img/25fe75b93b97a021effaba85db112a52_125_1.png)


    Another method is pressing the Escape key during the boot sequence to enter the
    Boot Menu. This opens a one time menu where you can select the device to boot
    from.


    Figure 7.10: Select CD-ROM as a boot device at system startup by pressing Esc.'
