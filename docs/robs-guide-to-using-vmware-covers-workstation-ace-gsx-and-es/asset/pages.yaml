- pgno: 70
  md: '# 5 Introduction to VMware ACE


    This chapter introduces you to VMware''s latest addition. Based on VMware Workstation,
    this product provides an Assured Computing Environment: ACE. I will start out
    with an introduction to ACE, and will then introduce some usage scenarios. I will
    also explain how to get started and how to use the product.


    There are two ways to explain VMware ACE in a single sentence:


    +   1) It is a product that is used to distribute virtual machines to end-users
    in a controlled way.

    +   2) It is a product that combines the functionality of VMware Workstation,
    imaging software, and desktop management applications.


    The first explanation is the condensed version of what the VMware website uses
    to describe ACE. To find out what functionality VMware ACE really gives you, let
    us take a look at the second explanation which is one that I came up with.


    First, VMware ACE provides you with VMware Workstation technology: you can run
    a virtual machine on a host system providing you the flexibility and capability
    to run on all hardware platforms. The only limitations compared to VMware Workstation
    is that it runs on Windows only and that you do not have all features available,
    such as snapshots or shared folders.


    With VMware ACE, you can provide your users with a virtual machine that contains
    a working copy of your company''s standard computing environment. There is no
    need to modify it for their hardware. This is where the comparison with the imaging
    software feature comes in. Companies use imaging software to easily install a
    copy of their standard computing environment on all workstations.


    The problem with imaging software is that you will have to take care of the hardware
    differences between different types of workstations. With VMware ACE, you can
    leave the default Windows installation which is already installed in place and
    run a virtual machine to provide the needed functionality to the user. You actually
    only need one virtual machine for the entire organization, compared to multiple
    different images that you need to maintain.


    Workstation management does not only mean that you need to deploy the software
    to computers. You also need to manage and secure the computers that are in use.
    Windows policies can take care of part of that. Third party software such as Novell
    ZENworks, Altiris, or LANDesk Management Suite can take care of the more advanced
    workstation management.'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'Depending on the level of security that is required, the use of additional
    software may still be needed. But with the functionality of VMware ACE several
    important tasks have already been taken care of. It is possible to configure what
    network connections can be used from the virtual machine. The machine can be set
    to its default state with every power on, etc.


    And there is more; with VMware ACE it is possible to configure who can use the
    virtual machine, based on Active Directory user accounts when needed. Passwords
    can be used to secure the use of virtual machines and the use can be further restricted
    by setting an expiration date.


    # What do users see?


    When everything is configured and deployed, what will the end users’ experience
    be? He or she will only see an application window containing yet another Windows
    environment. It looks much like running a terminal services window. The main difference
    is that the actual processing is performed on the local machine. But that is not
    of much interest to the user.


    # 5.1 VMware ACE Usage Scenarios


    Every system administrator who looks at VMware ACE will see a new way of using
    this product, just as is the case with those being introduced to VMware Workstation
    for the first time. But I will describe a few usage scenarios here to give you
    an idea of the power of the product:


    +   - By distributing a virtual machine to workstations in a controlled way, you
    have full control over the functionality that is available to users on their workstations.

    +   - In an educational environment, virtual machines can be distributed to student
    workstations providing them with a complete working computing environment, while
    controlling what can be used from the workstation.

    +   - Temporary workers can be provided with a full working copy of the company’s
    computing environment, while controlling what can be used and what will the expiration
    date be.


    The usage scenarios above give you an idea of what you can do with the product
    and hopefully will help you start thinking about how VMware ACE can be used in
    your environment.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# 5.2 Getting Started with VMware ACE


    The software package that you work with as an administrator is called VMware ACE
    Manager. You will have to start out by installing this software to your workstation
    in order to create your ACE projects and to prepare the deployment to end users’
    workstations.


    Note: It is important to know that VMware ACE Administrator can not be installed
    in combination with other VMware products. Also, it is not possible to run existing
    virtual machines directly. The machines can be left intact, but you will always
    have to configure a VMware ACE project to point to the existing configuration.
    Therefore, if you want to keep using the VMware Workstation functionality as you
    are used to, you need to use a separate computer to manage your ACE environment
    (and no, you can not install the product inside a virtual machine). VMware ACE
    Manager does not interfere with VMware VirtualCenter and the remote console utilities
    for GSX Server and ESX Server.


    Tip: If you need additional reading material on VMware ACE, you can check the
    online documentation. However, there are also a few very good resources available
    at the following URL:

    www.vmware.com/support/resources/ace_resources.html.


    Because you will not be using ACE Manager to run a large number of virtual machines
    at the same time, the hardware requirements are a little less. You can run multiple
    machines at the same time, but typically you just use one project with one machine
    at any given time. A PC with 1 GB of RAM should work well unless you are creating
    ACE workstations with larger amounts of RAM. For the client computers, it really
    depends on the machines you will be deploying and how much resources you need.
    However, for a typical Windows virtual machine with 256 MB of RAM which you want
    to run on a user’s computer, the user’s PC should have 512 MB of RAM.


    Note: It is possible to use existing virtual machines from VMware Workstation
    version 4.5 in VMware ACE version 1.01, but VMs created with version 5 of VMware
    Workstation can not be used as VMware ACE machines.


    Tip: If you already have a version 5 virtual machine which you want to use in
    VMware ACE, do the following: create a new virtual machine in version 5 and select
    to use legacy mode. Then use any of the physical to virtual conversion technologies
    described in this book to copy one machine to the other one. If you use a bootable
    Linux CD-ROM, you do not even have to buy any tools.


    Most of the technical features of VMware ACE are identical to VMware Workstation.
    Some exceptions will be mentioned later in this chapter. But the hardware inside
    the virtual machines is the same and the list of guest operating systems is also
    very complete, and it is comparable to VMware Workstation version 4.5.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Installing ACE Manager


    The software for VMware ACE can be downloaded from VMware’s website at the following
    URL: www.vmware.com/download. You can obtain an evaluation copy that is valid
    for 30 days. VMware ACE is licensed on a per user basis. You can buy a Starter
    Pack containing ACE manager, and four user licenses for USD 995. A separate ACE
    Manager license is USD 795 and individual user licenses cost USD 99 (prices are
    as of September 2005). The most recent version at the time of writing this book
    is version 1.0.1 (VMware-ACE-1.0.1-14996.exe).


    Compared to the initial release in January 2005, version 1.0.1 includes the following
    new features:


    +   - BIOS password

    +   - Drag and Drop Support

    +   - Enhanced full screen display

    +   - New guest operating system support


    The installation itself is rather straightforward. It does not require a reboot,
    so you can get started right away.


    ![](img/25fe75b93b97a021effaba85db112a52_73_0.png)


    Figure 5.1: VMware ACE Manager settings.


    One of the things you want to look into after the installation is complete, is
    the basic settings for VMware ACE Manager. You access these from the Edit menu
    under Preferences.


    You can configure the default path where you would like to place the ACE project
    configuration files and the location of your virtual machines. VMware ACE Manager
    can also check for updates automatically.


    You can also configure the same memory settings as for VMware Workstation.'
  merge: -1
  img_proc: true
- pgno: 74
  md: "# 5.3 Creating VMware ACE Projects\n\nVirtual machines do not run inside ACE\
    \ directly; they must be organized in projects. To start a new project, click\
    \ the icon in the ACE Manager home window or select File → New Project.\n\n+ \
    \  1. Provide a name for your project and a location where you would like to store\
    \ the project files.\n+   \n+   2. Next, you are asked if you want to start the\
    \ Add Virtual Machine Wizard. For this example, I have selected to do so.\n+ \
    \  \n+   3. The wizard that is used to add new virtual machines is very much like\
    \ the one in VMware Workstation. An important different first step is that you\
    \ can choose to create an entire new machine or to use an existing machine. Creating\
    \ a new virtual machine is identical to this process in VMware Workstation, except\
    \ that you can not use raw physical partitions for your virtual machine since\
    \ these can not be copied to end user computers.\n+   \n+   If you choose to use\
    \ an existing virtual machine, browse to the .vmx file of that machine to add\
    \ it to your project.\n+   \n+   4. When the Add Virtual Machine Wizard is complete,\
    \ you will be prompted to configure policies for the virtual machines in the newly\
    \ created project. Configuring policies is discussed later in this chapter."
  merge: -1
  img_proc: true
