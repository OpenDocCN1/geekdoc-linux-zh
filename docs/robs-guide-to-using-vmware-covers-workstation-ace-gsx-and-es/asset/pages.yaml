- pgno: 264
  md: 'case if you resume two servers at the same time. There is a fair chance that
    they will not resume exactly at the same time (depending on your hardware), or
    that your host is so busy with this operation that the guests are slow, and the
    heartbeat between the cluster nodes gets lost.


    The best thing to do is to either take all the servers in the cluster (or all
    but one) off-line, and then suspend all of them. Otherwise, just shutdown the
    operating system and power off the virtual machines.'
