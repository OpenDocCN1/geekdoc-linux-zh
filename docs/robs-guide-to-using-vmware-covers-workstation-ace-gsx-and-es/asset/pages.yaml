  md: '![](img/25fe75b93b97a021effaba85db112a52_75_0.png)


    Figure 5.2: A default VMware ACE project typically contains one virtual machine.


    # 5.4 Customizing a VMware ACE Project


    In the main project window, click Edit project settings or select Settings from
    the Project menu. You can configure typical settings such as the project name
    and a description for the project. Other, more advanced topics are:


    # Selecting a policy domain


