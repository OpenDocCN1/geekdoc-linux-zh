- pgno: 44
  md: 'You have now created your first virtual machine. Before getting started with
    the installation of your operating system, I will explain some useful information
    about the VMware Workstation interface. While most of it is self explanatory,
    I want to make sure that you know the basics in order to get started. Figure 2.12
    shows an overview of the main control options and access to configuration options.


    ![](img/25fe75b93b97a021effaba85db112a52_44_0.png)


    Figure 2.12: Overview of the main virtual machine control and configuration options.


    # Suspend and Resume


    The Power On, Power Off, and Reset buttons are the same as with a real PC. Suspend
    and Resume, however, may need some clarification. You can compare this feature
    with the Hibernate feature of laptops. If you click Suspend, the virtual machine
    state will freeze. In addition, hard disk activity will be stopped and the contents
    of the virtual machine''s memory will be saved to a file on your hard disk. This
    .VMSS file compares to the HIBERFIL.SYS file, which Windows creates in the root
    of your hard drive when you use the hibernate feature.


    Suspending a virtual machine for the first time (when it has been down or has
    been reset), used to take a long time with previous versions of VMware; sometimes
    up to'
  merge: -1
