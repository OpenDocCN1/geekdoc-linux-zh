- pgno: 199
  md: '# 19 Create a Virtual Disk from an Image File (for any imaging application)


    With the imaging operations described in the previous parts for peer-to-peer imaging
    and imaging to network destinations, you rely on a network connection being available.
    In addition, you rely on network drivers that are operating correctly. This is
    not always the case, and therefore, I also describe another approach where only
    disks are involved. Therefore, this procedure is supported by all operating systems
    and with all imaging applications.


    To restore an image of a physical machine into a virtual machine, with this method,
    you need to first create an image file by using the method which works best for
    you (with your favorite imaging application). Then you need to create a virtual
    machine, and restore the image inside the virtual machine. Of course, you still
    have to edit your restored operating system to work with the virtual machine hardware
    as described in chapter 21: “Modify your restored operating system to work with
    VMware”.


    The short description of the method that is described here is that we create a
    virtual machine with two disks. One will hold the image file, and the other will
    be the destination disk. You then boot with your boot-medium from your imaging
    solution and restore the local disk file.


    +   1. At this point I am assuming that you have already created the image file
    with the imaging application of your choice.

    +   2. Create a virtual machine with the settings that reflect your destination
    operating system (Windows, NetWare, etc.). Create a disk that is the same type
    as your original disk from the physical PC (IDE or SCSI), and make it large enough
    to receive the restored image file.

    +   3. Next, you will need to add a disk that will hold the image file. There
    are two approaches to this; first I will discuss the one for the gui-users:

    +      - Use a Windows or Linux virtual machine with a second disk to format the
    disk, and copy the image file into that separate virtual disk via either the network
    or by a Host-to-Guest shared folder.

    +      Next, I will discuss the one for those who are into the command line stuff:

    +      - Create a virtual disk with a FAT file system (or download an empty disk
    Empty1999mbFATdiskv4.zip or Empty1999mbFATdiskv5.zip from the tools section at
    www.robbastiaansen.nl).'
  merge: -1
  img_proc: true
- pgno: 200
  md: '+   - Mount the empty disk with the DiskMount utility (described in section
    7.4: “Using the DiskMount Utility”).

    +   - Copy the image file into the virtual disk.

    +   - Dismount the disk file and attach it to the virtual machine, where you will
    be restoring the image.


    ```

    vmware-mount k: Empty1999mbFATdisk.vmdk

    ```


    4. At this point, you have a virtual machine with an empty disk (disk 1) and a
    disk containing the image file.


    5. Start your virtual machine now, with the boot media from your imaging solution.
    This can be a (virtual) boot floppy or CD-ROM created for Ghost, DriveImage, or
    any other solution. In addition, if you own ZENworks for Desktops, you can use
    the CD-ROM iso file to boot the virtual machine.


    ![](img/25fe75b93b97a021effaba85db112a52_200_0.png)


    Tip: If you are using Ghost, then you can find the procedures for creating a virtual
    boot floppy in section 16.1: “Creating the Ghost boot disk for VMware”


    ![](img/25fe75b93b97a021effaba85db112a52_200_1.png)


    Tip: If you use Novell ZENworks imaging with the bootcd.iso which comes with ZENworks
    for desktops, you should mount the second disk in the system (that holds the image
    file) with the following command: mount -t msdos /dev/hdb1 /mnt/harddisk. You
    should then restore the local image with the following command: img rl /mnt/harddisk/<imagefile.zmg>.


    ```

    mount -t msdos /dev/hdb1 /mnt/harddisk

    ```


    ```

    img rl /mnt/harddisk/<imagefile.zmg>

    ```


    6. You can now restore the local image file with your imaging solution. Depending
    on the operating system that you are restoring, you may need to modify drivers,
    etc. This is explained in detail in chapter 21: “Modify your restored operating
    system to work with VMware”.'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# 20 Imaging the Really Cheap Way


    If you have read the previous chapters, then you can see that one part of physical
    to virtual conversion is getting your data from one machine to another. The second
    part is modifying your operating system to work on the new hardware. This chapter
    will explain how to perform the second part.


    There are no tools involved for which you have to pay. That was not so for the
    imaging solutions we have just looked into in the previous chapter. If you really
    do not want to spend any money on software for this process, or if you need a
    solution that is as low level and basic as possible, then this chapter will help
    you with that.


    The solutions which I explain in this chapter use freely available tools and commands
    that are standard and are available in Linux. But before you stop reading: you
    do not have to install Linux, as you will see how later. The two methods that
    I will describe are using a free utility called g4u and standard Linux commands.


    # 20.1 Imaging with g4u


    Creating an image is really just dumping your disk into a file. If you do that
    with any of the available commercial programs, they offer you the feature of working
    with individual partitions to image and restore them. They also offer features
    to manipulate partitions, such as to increase them while you restore them to a
    destination hard disk. But sometimes you do not need these features and you just
    want to copy an entire hard disk or entire partitions from one hard disk to another.
    This is exactly what g4u will do for you.


    The application is called Ghost for Unix. It is named after the commercial product
    which was one of the first to offer imaging solutions. The utility is available
    as a free download from the programmer''s website: www.feyrer.de/g4u. The program
    can be downloaded as a floppy image or CD-ROM image. The source is also available
    from the website.


    What the program does is simple: it creates an image, which reads sectors from
    the hard disk and sends the data via ftp to a file on another computer. To restore
    an image, the file is read via ftp and is written into the local hard disk or
    partition. Performing these operations on local disks to clone them is also supported.


    The software download is available as a CD-ROM image, which is my preference because
    it is the easiest way and many PCs do not have a floppy drive anymore. You can
    burn the ISO file to a CD-ROM or attach it directly to a virtual machine if you
    want to image one of those.'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'The requirements for the utility are as follows:


    +   - A DHCP server

    +   - An FTP server with enough space to store the image file


    Tip: Almost all Linux distributions come with an FTP server or you can easily
    add one of the many freely available ones. For Windows, if you need a free FTP
    server, you may want to take a look at FreeFTPd. You can download it from the
    following URL: www.freeftpd.com.


    After booting the CD-ROM, a small help menu is displayed which shows the available
    commands. Figure 20.1 shows the welcome screen with the available commands.


    ![](img/25fe75b93b97a021effaba85db112a52_202_0.png)


    Figure 20.1: gu4 offers a simple but effective imaging solution.


    Uploading a disk image to an FTP server is performed with this command:


    ```

    uploadisk [user@]<server-ip-address> [imagefilename] [disk]

    ```


    The only mandatory parameter is the server''s IP address. If you do not specify
    anything else, the program will login to the server as user install and create
    a file of your first hard disk with a default name, for which it will use your
    hard disk identifier.


    To restore a disk image from an FTP server, use the following command:


    ```

    slurpdisk [user@]<server-ip-address> [imagefilename] [disk]

    ```


    With the slurpdisk command, the same rules apply as for creating the file; without
    any parameters, it logs into the FTP server and downloads a file named after your
    first disk''s identifier and downloads it.'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'As you can see in Figure 20.1, individual partitions can be specified as well
    as local hard disk cloning. To identify your hard disks and partitions, you can
    use the command disks and parts <disk>, where <disk> is the disk identifier that
    you found with the disks command.


    # Where to go from here


    Depending on the operating system that you are restoring, you may need to modify
    drivers, etc. This is explained in detail in chapter 21: “Modify your restored
    operating system to work with VMware”.


    # 20.2 File Based Imaging with Standard Linux Commands


    Linux commands are very powerful. This section proves this fact again. With only
    a few simple commands, you can dump the contents of your hard disk into a file
    and restore it on another computer. You do not need any tools, such as the g4u
    utility which was discussed earlier. The only thing you do need is a running Linux
    environment on your computer. But that does not mean that you have to install
    Linux on your PC. You can run one of the many live CDs that are freely available.
    The one I always use is Knoppix. Simply download the ISO file from the website
    at www.knoppix.com and burn it to a CD-ROM. Or, use the ISO to boot your virtual
    machine directly if you are imaging a virtual machine.


    Tip: The description in this paragraph is based on an original publication at
    www.okmoore.com. If have comprehended the information and clarified it for those
    readers that are no Linux gurus (yet).


    What you need to make this work is to access another host via a networking protocol
    such as NFS, Samba, or as I use in this example SSH. The remote host needs to
    have enough available disk space to store a file with the size of the entire original
    hard disk. When you have booted the computer with Linux, you become root with
    the su command and perform the following command to create the image file.


    ```

    dd if=/dev/hda | ssh user@remotehost /bin/dd of=/tmp/hda.img

    ```


    With this command line the dd command reads file input directly from the first
    hard disk (or it uses another identifier for your computer and hard disk). It
    pipes the output to the remote computer through an ssh connection, where the remotely
    executed dd command outputs the incoming stream into a file called hda.img.


    To restore, execute the following command on the host where you want to dump the
    image file to the local hard disk:


    ```

    ssh user@remotehost cat /tmp/hda.img | dd of=/dev/hda

    ```'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'The restore operation performs the reversed operation. It uses the cat command
    (concatenate) on the remote host through an ssh connection to output the contents
    of the hda.img file to the first local IDE hard disk.


    # Where to go from here


    Depending on the operating system that you are restoring, you may need to modify
    drivers, etc. This is explained in detail in chapter 21: “Modify your restored
    operating system to work with VMware”.


    # 20.3 Peer-to-Peer Imaging with Standard Linux Commands


    In the previous section, you learned how to create an image file from a machine
    with standard Linux commands. The advantage of creating a file is that you can
    use it more than once. The disadvantage is that it takes more time because you
    will first have to create the file and restore it later. When you just want to
    create a copy of a physical machine into a virtual machine or if you want to copy
    a virtual machine into another virtual machine on another VMware product then
    peer-to-peer imaging is a faster solution. And it can also be done with default
    Linux commands to clone Linux and Windows machines.


    The only requirement is that you are running a Linux environment on your computer.
    But that does not mean that you have to install Linux on your PC. You can run
    one of the many live CDs that are freely available. The one I always use is Knoppix.
    Simply download the ISO file from the website at www.knoppix.com and burn it to
    a CD-ROM. Or, use the ISO to boot your virtual machine directly, if you are imaging
    a virtual machine.


    You can use the default netcat command to set the sending computer to a listening
    mode where it will send the output of the dd command to the computer that plugs
    into the listening port. On the destination computer, you need to start netcat
    and connect to the source computer and everything that is received on standard
    input will be sent to the dd command through a pipe.


    In this example, I dump a hard disk that is located on /dev/hda (the first IDE
    hard disk) inside a virtual machine on hard disk /dev/sda (the first SCSI disk):


    Set the source computer to listen on port 2000:


    ```

    dd if=/dev/hda | netcat -l -p 2000

    ```


    Start the destination computer to connect to the source IP and port:


    ```

    netcat 192.168.1.10 2000 | dd of=/dev/sda

    ```'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'The only disadvantage of this procedure is that you will not see what is happening.
    However, from the disk and network activity on your computer or inside your virtual
    machine you will be able to tell that the process is sending the disk information
    from source to destination.


    # Where to go from here


    Depending on the operating system that you are restoring, you may need to modify
    drivers, etc. This is explained in detail in chapter 21: “Modify your restored
    operating system to work with VMware”.


    # 20.4 Preparing your Computer for Smaller Images


    When you create a hard disk image with an imaging utility such as g4u or the dd
    command which just reads blocks from the hard disk and stores them in a file,
    that file by default becomes the same size as your hard disk. Even when g4u performs
    compression on the file it creates, it depends on you hard disk whether the compression
    is efficient. Blocks on the hard disk may seem empty, but they are not. And g4u
    does not contain drivers for all file systems, so it is not aware of the way that
    your hard disk is being used. Therefore, it is a good idea to prepare your hard
    disk from within the operating system. You do this by filling all the blocks that
    are not used with bytes which contain the same value: zero.


    There are tools and commands available for this for every operating system. I
    have listed the most common ones here:


    # Unix/Linux


    Use the default dd command to create the file and delete it afterwards:


    ```

    dd if=/dev/zero of=/zerofile bs=1m

    rm /zerofile

    ```


    The first command uses the if parameter to specify the special /dev/zero device,
    and it sends the output to the file specified with the of parameter. The bs parameter
    specifies that every write cycle to the file is written in 1 MB chunks. The second
    command then removes the file. You must do this for every partition that you will
    be imaging.


    # Windows


    For Windows, one of the freely available tools, available under the GNU General
    Public License is Eraser. It is available from the following URL: sourceforge.net/projects/eraser.


    # NetWare


    On a NetWare server, use the FILLZERO.NLM to fill all unused blocks with zeros.
    The file is available from the tools section on the author''s website at the following
    URL: www.robbastiaansen.nl.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# 21 Modify your Restored Operating System to Work with VMware


    Once you have restored an image to a virtual machine, you will need to modify
    the operating system to load the correct drivers for the hardware that is used
    in VMware. This section will explain how to do that for Windows, Linux, and NetWare
    operating systems.


    # 21.1 Windows 9x Operating Systems


    Windows 95, 98 and ME are the simplest of all Windows versions to image to different
    hardware compared to what the source computer is running. They do not have anything
    such as Hardware Abstraction Layer that you need to take care of after imaging.
    It is my experience, that the Plug and Play capabilities of these versions of
    Windows find all the hardware in your virtual machine.


    # 21.2 Windows NT/2000/XP/2003 Operating Systems


    These versions of Windows have a so called Hardware Abstraction Layer module which
    is installed on a PC during installation. If you move a disk into other hardware
    (whether physically or when restoring to a virtual machine), you will have to
    manually modify this HAL.DLL to the one needed for Windows in VMware.


    Furthermore, you need to add the correct drivers to your virtual machine for your
    video adapter, sound adapter, network adapter, etc. Also, you should keep in mind
    that by default the mass storage drivers are not replaced. Therefore, you need
    to make sure that you image from a computer with an IDE disk to a virtual machine
    with an IDE disk and from a computer with an SCSI disk to a virtual machine with
    an SCSI disk. At the end of this section I have added detailed information on
    how to image a Windows machine from an IDE disk to a SCSI disk.


    Note: Imaging Windows PCs is something that falls outside the scope of this book.
    Microsoft’s official position is that you need to use the SYSPREP utility to prepare
    a Windows machine, and there are many items to take care of. An example of this
    is the Security Identifier (SID), which is especially important when a workstation
    is part of a domain.


    The following links to SYSPREP information by Microsoft will help you get started
    if you want to use this utility:


    ```

    msdn.microsoft.com/library/default.asp?url=/library/en-us/dnw2kmag00/html/sysprep.asp

    ```'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'www.microsoft.com/technet/prodtechnol/windows2000pro/deploy/depopt/sysprep.mspx


    www.microsoft.com/resources/documentation/Windows/XP/al1/reskit/en-us/prbc_cai_vnve.asp


    The steps that I will describe below do not require the use of SYSPREP. Be aware
    that it is not guaranteed that it will work in your environment.


    To replace the HAL.DLL with the one you need for VMware, one of the possible methods
    is described here:


    +   1. Find out what the HAL.DLL is; you will need it for your specific version
    of Windows and the installed service pack. The easiest approach is to install
    the same version of Windows and service pack into a virtual machine, and copy
    the HAL.DLL to your host PC.

    +   2. When you have the correct HAL.DLL, you need to add it to the restored machine.
    You could have copied it to the original PC, before taking an image, but you can
    also add it to the newly restored disk by mounting it with the VMware DiskMount
    utility as explained in section 7.4: “Using the DiskMount Utility”

    +   3. When you have loaded the Windows operating system, and you now have the
    correct Hardware Abstraction Layer, it will start detecting the hardware in your
    virtual machine. It is a good idea to make sure that you have the driver files
    available in the virtual disk file or in an ISO file which you can attach to the
    virtual machine.

    +   4. When all the hardware is detected and all the matching drivers are found,
    do not forget to install the VMware tools.


    Tip: It might also be convenient to add the i386 directory from the Windows installation
    CD-ROM or the Service Pack source files, into the virtual disk when you have it
    mounted with the VMware DiskMount utility. That way if files are needed, they
    are easily available.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# Microsoft Product Activation


    When imaging Windows XP or Windows 2003, depending on the type of license being
    used, you may have to activate Windows again. Make sure that the machine is completely
    configured with all the new hardware before activating Windows.


    ![](img/25fe75b93b97a021effaba85db112a52_208_0.png)


    Figure 21.1: After a restore Windows might need to be activated.


    # Imaging from IDE to SCSI


    It is possible to restore an image of a computer with an IDE device into a virtual
    machine with an SCSI device. An example of this is when you restore into an ESX
    Server virtual machine, since that server only supports SCSI virtual disks. The
    trick is to install the VMware SCSI driver into the machine, before creating the
    image. Prepare for this configuration by downloading the Windows SCSI drivers
    from the following URL: www.vmware.com/download. The download is a virtual floppy.
    You can extract it with Winimage or mount it with the Virtual Floppy Driver. This
    is explained in chapter 7.


    You do this from the Add Hardware Wizard. You need to start the wizard from the
    System Properties window in the Control Panel. Perform the following steps when
    the wizard runs (this example is based on Windows XP):


    +   1. The wizard asks you if you have already installed the hardware in the computer.
    Select yes here, even when there is no VMware SCSI disk present.

    +   2. At the bottom of the installed hardware list, select Add a new hardware
    device and select Next.

    +   3. In the next window, select the option to manually select the hardware that
    is installed.

    +   4. When a list of hardware categories to install from is displayed, select
    the top item called Show all devices.

    +   5. In the device driver selection window, click the button Have Disk.

    +   6. Browse to the vm scsi .inf file and click Ok.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '7. The wizard will now show an overview of drivers available in the .inf file.
    Select the VMware SCSI Controller and click Next.


    ![](img/25fe75b93b97a021effaba85db112a52_209_0.png)


    Figure 21.2: Install the VMware SCSI driver before starting the imaging process.


    8. In the summary window, click Next.


    9. You will see a message that the driver has not passed Windows Logo testing
    by Microsoft. Select Continue anyway to install the driver.


    You have now successfully installed the SCSI driver on your Windows machine. You
    can start the imaging process and restore this image inside a virtual machine
    later, by using a virtual SCSI disk.


    Tip: If partitions change during the imaging process, you will have a problem
    with booting the Windows guest. Modify the boot.ini file to reflect the new partition
    layout. You can do that with the Rescue Console from the Windows installation
    CD-ROM, but you can also modify this file before the imaging process when you
    already know what the new layout will be. Do not forget to create a backup of
    the original boot.ini file and to restore the original file when the imaging process
    is complete.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# 21.3 Linux Operating Systems


    After restoring a Linux operating system into a virtual machine, it depends on
    the distribution you are running whether it automatically finds the virtual machine''s
    hardware. Most current distributions such as SuSE and Red Hat do a great job on
    this.


    What you might need to change yourself are the boot loader and the specification
    of the partitions that must be loaded.


    # Boot Loader Configuration


    Generally, there are two boot loaders being used for Linux systems: LILO and GRUB.
    I hope that there will be no readers that are religious about their boot loader
    because I have decided to only discuss GRUB.


    When your image is restored inside a virtual machine, and it does not boot with
    error messages in the boot loader, then the problem is most likely that it tries
    to start the operating system from the wrong hard disk and partition. It is possible
    that you have changed the partition order or you may have created an image of
    an IDE hard disk and restored it within a virtual machine with an SCSI hard disk.


    The files that you need to modify on a Linux host for the GRUB boot loader are
    /boot/grub/device.map and /boot/grub/menu.lst.


    This is an example of a device.map file:


    ```

    (hd0)   /dev/hda

    (fd0)   /dev/fd0

    ```


    In this file, you need to change the entry that specifies the hard disk to boot
    from. That can be disk 1 (hd0), disk 2, (hd1) etc. For every disk, you need to
    specify what partition is used to boot from. In this example, it is the first
    IDE disk (/dev/hda) but it can also be the SCSI disk (/dev/sda).


    This is a partial example of a menu.lst file:


    ```

    color white/blue black/light-gray

    default 0

    timeout 8

    gfxmenu (hd0,0)/message


    title Linux

    kernel (hd0,0)/vmlinuz root=/dev/hda3

    initrd (hd0,0)/initrd


    title Floppy

    root (fd0)

    chainloader +1


    title Failsafe

    ```'
  merge: -1
  img_proc: true
- pgno: 211
  md: '```

    kernel (hd0,0)/vmlinuz root=/dev/hda3 ide=nodma apm=off acpi=off

    initrd (hd0,0)/initrd

    ```


    In this file, all references to the hard disk identifier (hd0) must be specified
    and the partition number on that hard disk must be modified, when the partition
    order has changed. In this example, the kernel is located in /dev/hda1 (hd0,0)
    and the root partition is located in the third partition /dev/hda3 (hd0,2).


    # Modifying Partition Information


    After changing the boot loader configuration, you need to edit the file that specifies
    what partitions must be mounted when the system boots. This is defined in /etc/fstab.
    Here is a partial example of this configuration file:


    ```

    /dev/hda3   /           reiserfs   acl,user_xattr   1 1

    /dev/hda1   /boot       reiserfs   acl,user_xattr   1 2

    /dev/hda2   swap        swap       pri=42           0 0

    /dev/hdc1   /data1      reiserfs   acl,user_xattr   1 2

    /dev/hdd1   /data2      reiserfs   acl,user_xattr   1 2

    ```


    In this file, the references to the partitions need to be modified to reflect
    the restored configuration. For example, when you restore the original image that
    was on an IDE hard disk and the destination is an SCSI disk, the partitions that
    are now mounted from /dev/hda need to be mounted from /dev/sda.


    # 21.4 NetWare Operating System


    NetWare is a very friendly operating system to restore to different hardware,
    and to modify it to work within VMware.


    NetWare includes a DOS partition that boots DR-DOS, or a Novell proprietary OS
    (if you have selected that with a Service Pack 1 overlay installation) with the
    Do not boot into DOS option. Whatever method you have chosen, it will always boot
    the OS and will try to load the drivers. If it fails to load the correct drivers
    that are listed in the configuration files, it just does not load them and leaves
    you with the command prompt where you can edit the files manually.


    You can also suppress loading the operating system altogether, by pressing F5
    when the server comes up. On the DOS prompt, you can then start server.exe with
    the -ns switch to skip loading the startup.ncf file or -na to skip loading the
    autoexec.ncf.


    The modifications that you need to make are to the storage adapters in the startup.ncf,
    and the network adapter in the autoexec.ncf, or via inetcfg.nlm.


    For IDE disks, you can use the drivers that ship with any version of NetWare (IDEATA.HAM
    and IDEHD.CDM). For SCSI, you load the drivers as described in section 14.7: "Using
    SCSI drivers in NetWare servers".'
  merge: -1
  img_proc: true
