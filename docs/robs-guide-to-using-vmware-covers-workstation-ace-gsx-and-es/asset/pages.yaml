- pgno: 281
  md: '# 34 Installation and Configuration on Linux


    The first step in setting up your Linux GSX server is to get your hardware up
    and running. I am assuming that you have read the previous sections about the
    hardware system requirements, design, and optimization and that you have set up
    the hardware at this point.


    # Meeting software system requirements


    Next, you need to install your host operating system. There are a lot of Linux
    distributions out there and they all have their small specific issues. Check the
    online VMware documentation for any issues you may encounter with your Linux distribution
    and version.


    # Get the Software


    The next step in setting up your Linux GSX server is to obtain the software. It
    is possible to buy a media kit from VMware which contains a CD-ROM with the software.
    But your best choice, assuming that it is no problem to download just a little
    more that 100 MB, is to download the latest version from www.vmware.com/download.
    To download the software, you must be registered as a customer or you need to
    be enrolled in the evaluation program. You can enrol to evaluate the program,
    by selecting the evaluate link on the download webpage.


    # Get a discount


    In case you have not already bought the software, it is good to know that you
    can receive a discount when you buy your license at the VMware online store. You
    are eligible for a 5% discount if you enter the following discount code when buying
    your product online at the VMware Store: VMRC-ROBBA5389. This code is valid for
    VMware Workstation and VMware GSX Server purchases.


    # Software installation


    At this point, I am assuming that you have downloaded the installation files,
    copied them to your server, or you have mounted the CD-ROM which contains the
    installation files. It is also very convenient to have the Management Interface
    files in place to install that part right after your server installation. Copy
    the VMware-mui-3.2.0-14497.tar.gz file to the /tmp or another directory where
    the GSX Server install package is located.


    Follow the following steps to install the software:


    +   1. Log on to your Linux host and open a terminal window.

    +   2. You need to install the software as a root user so use the su - command
    to become root. Move to the /tmp directory or another directory where you want
    to extract the files.'
  merge: -1
  img_proc: true
- pgno: 282
  md: '3. For the RPM version, execute the following command to install the software:


