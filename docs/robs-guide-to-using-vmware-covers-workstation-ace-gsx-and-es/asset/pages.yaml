- pgno: 82
  md: '# 5.7 Virtual Machine Network Quarantine Policy


    VMware ACE can control the network access from the virtual machine with the local
    network based on IP-addresses and other TCP/IP settings. This is called network
    quarantine. Table 5.2 lists the available quarantine types in VMware ACE.


    Table 5.2: VMware ACE Network Quarantine Types.


    | Quarantine Type | Description |

    |---|---|

    | Static quarantine | Defines a fixed list of networks and machines that can be
    accessed from the virtual machine. Requires redeployment to change them. |

    | Dynamic quarantine | Connects the virtual machine to Active Directory or a web
    server to read network access policies. |

    | Version-based quarantine | Defines network access based on the virtual machine''s
    version. For example, with an outdated machine that is not patched, you can allow
    access to the patch management server only. |

    | Custom quarantine using a script | Advanced option to script access to the network.
    |


    The simplest quarantine setup is to define a static configuration that defines
    IP addresses or networks that can be accessed. This allows you to configure access
    to specific servers or networks only, or to deny access to those resources. An
    example of using these policies is when you use ACE to provide students with a
    safe and secure learning environment and you only want them to access the classroom
    server that runs an educational application. Or, you can provide a temporary employee
    with a virtual machine which can only access the database server that he or she
    needs to work with.


    # Static quarantine


    Figure 5.9 shows a simple example of a configuration setting that only allows
    access to the machine on IP address 192.168.1.254. You can also specify a network
    address and subnet mask, such as 192.168.1.0 and 255.255.255.0, to allow or deny
    access to machines on that network only.


    Tip: You must configure to either allow access or deny access. You can not mix
    these two options in one policy configuration.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '![](img/25fe75b93b97a021effaba85db112a52_83_0.png)


    Figure 5.9: An example of a static network quarantine configuration.


    After setting up the host’s access configuration, you can specify additional protocols
    such as to allow or deny interaction with the virtual machine. These protocols
    are: Printer Access, DHCP Packets, DNS Packets, and ICMP Packets.


    ![](img/25fe75b93b97a021effaba85db112a52_83_1.png)


    Figure 5.10: Four types of TCP/IP packets can be disabled for the virtual machine.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# Dynamic quarantine


    This type of configuration allows for the same settings to be specified, except
    that there is also the feature to simply allow all access or deny all access.
    For the rest, you specify the same networking features as described for the static
    quarantine. You can either point to Active Directory or to a web server.


    For this to work, you must configure your own web server and deploy the .vmpl
    file which the wizard creates on the server. In the dynamic quarantine policy,
    you then specify the URL of this file on the web server, for example:


    ```

    http://policyserver/ACE/Windows2000Prof/netpolicy.vmpl

    ```


    This URL can be anywhere on your server, where the users have access to the file.


    # Version based quarantine


    With this type of quarantine, you can configure the same network settings as with
    the previous two quarantine types. You can also deploy this policy through Active
    Directory or through a web server. The additional configuration capability here
    is that you can configure a separate rule with restricted access which will be
    used if the virtual machine is of an older version.


    ![](img/25fe75b93b97a021effaba85db112a52_84_0.png)


    Figure 5.11: Restrict networking access based on a version number.


    For this policy to work, you need to configure two different access levels. The
    normal level is the one that will be used if the virtual machine is up to date.
    The restricted level is the one that will be used if the version number does not
    match the one configured in the policy. For example, you can allow access to the
    patch management server only for the virtual machine to be updated.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Custom quarantine using script


    In this quarantine scheme the same rules apply as for the previous ones, but a
    script file is used to define what level of access will be used. Scripts can be
    created in any language that is supported on the end users'' workstation. Writing
    or modifying these scripts is beyond the scope of this introductory chapter. Sample
    scripts are provided with VMware ACE and full documentation is available in the
    ACE online documentation at the following URL: www.vmware.com/supports/pubs.


    # 5.8 Deploying the ACE Virtual Machine


    When the entire project is configured and the policies are set, it is time to
    prepare the virtual machine for deployment. Install the guest operating system
    the usual way and install all the applications that need to be included in the
    end users'' environment. Also, add the VMware tools to the guest.


    The virtual machine can be started with the regular control. I suggest that you
    use this option when you are installing the guest operating system, applications,
    and VMware tools inside the machine. It allows you to work with all normal VMware
    features for adding devices, shared folders, etc. Also, shrink the virtual disks
    to make sure that your deployment package is as small as possible.


    When you are finished with the machine and you are almost ready to deploy it,
    run it with the option Run in VMware ACE. This will show you how it will look
    at the end user''s machine and you can test the networking and other policies.


    When you are finished with the machine, make sure to turn it off before creating
    the deployment package. Suspending a virtual machine on one machine and resuming
    it on another may result in problems when you start the machine. Also, remove
    any snapshots that exist for the virtual machine.


    Tip: When you want to add any VMware Workstation features to the ACE virtual machine,
    you need to add them to the .VMX file before creating the deployment package.
    For example, if you get the message about a UUID already being configured when
    the machine is moved to a new location. You have probably used a VMware Workstation
    virtual machine as the source when this happens. You can set the default behavior
    of the virtual machine to always create a new UUID with this parameter: uuid.action
    = "create". I suggest that you do not use the keep feature because it could result
    in machines with the same MAC address on your network.


    # Creating a package


    The actual deployment to the end user''s computer is performed from a packaged
    installation of the virtual machine. It will result in a set of installation files
    and a subdirectory containing the virtual machine files. The files and paths are
    listed in Table 5.3.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# Table 5.3: Overview of files inside a VMware ACE Package.


    | File or Path | Description |

    |---|---|

