- pgno: 18
  md: '# 1 VMware Overview


    This chapter will introduce you to VMware''s line of products. These products
    range from solutions for the desktop to the enterprise server environment. I will
    start out with an overview of what VMware technology is and will follow it with
    the description of individual VMware products.


    # 1.1 How VMware Works


    There are several VMware products available. This book focuses primarily on the
    so called hosted products. These are the products that require Windows or Linux
    to run as a host for the virtual machine environment. I have also included an
    introduction to VMware ESX Server, which does not require a host operating system
    but it comes with its own OS to run the virtual machine environment.


    It does not really matter which version you choose to work with; VMware operates
    in a very similar fashion in all its versions. What you need to know about creating
    virtual machines is basically the same for all VMware products. I will focus on
    the desktop products first, and will follow with a brief overview of the server
    versions later in this chapter.


    By using VMware technology, you can create one or more PCs on your computer, which
    can run simultaneously. Your host computer still runs its own operating system
    (Windows or Linux), and the virtual machines can run with other operating systems
    (Windows, Linux, NetWare). They all use memory from your PC and their processor
    instructions are processed by the CPU in your host computer.


    # Hosts and guests


    This brings us to some terminology that you must understand when working with
    VMware. We call the computer on which you run the VMware software, the host. This
    host PC can have either Windows or Linux operating system. You will have to choose
    what operating system you will be using as your host, because you have to buy
    a specific version for either Windows or Linux.


    The virtual machines that you run on your host are called guests. They can run
    with many operating systems and therefore it does not matter what operating system
    your underlying host is running. Because of this, you can run Linux on a Windows
    PC, NetWare on a Linux PC, or just another version of Windows on your Windows
    host. The next section describes some usage scenarios for VMware.


    # Host and guest hardware usage


    The guests that you run are completely new PCs. When you start working with VMware,
    you must keep in mind that what can be done on a real PC can be done in VMware.
    The only limitation is the hardware; you can not add physical devices, such as
    a video capture card in a virtual machine. However, you can do everything else,
    such as networking, disk imaging, and so on. Nothing you do infects the host'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'PC; Of course the PC performance will be compromised, because you are sharing
    resources between the host and your guests.


    This brings us to the hardware aspect of using VMware. VMware technology does
    not work like an emulator. That is what you see with software that creates a virtual
    PC on a Macintosh for example or a Macintosh on a PC. When using VMware products,
    we are committed to the Intel architecture; the software creates virtual machines
    that run their instructions on the same Intel based processor (or AMD if you prefer
    it more) that you have on the host PC. The CPU in your virtual machine will show
    up as the same one in your host computer.


    For the rest, your virtual machine has its own set of hardware that is not related
    to the device types that you have in your host PC. Your virtual hardware is somewhat
    limited to what you have installed on your computer. For example, you will not
    be able to store more physical data in your virtual machine than what you have
    available on your host PC.


    # Hardware configuration


    A virtual machine always has the same hardware, which is unrelated to your host
    PC. It always uses the same AMD network adapter, the same VGA adapter, and a virtual
    IDE or SCSI hard disk in every virtual machine. This makes it simple to move virtual
    machines to another hardware box. You can even move virtual machines from a Windows
    to a Linux host and vice versa. There will be no changes to the virtual hardware
    in your virtual machine. The complete machine is stored in a simple set of files:


    +   - .vmx file

    +     This is a text file that contains the configuration of your virtual machine.
    It stores information about the hard disks that are used by your machine and the
    type of networking you have chosen, etc.

    +   - one or more vmdk files

    +     The virtual hard disk you create for your machine is in fact a file on your
    file system which stores everything you do in your virtual machine. You can partition
    and format your virtual disk, defragment it and so on, and nothing affects the
    underlying hard disk of your host PC. It all happens inside the .vmdk files.

    +   - nvram file

    +     Every PC has a BIOS and so does a VMware virtual machine. A PC stores its
    information in Non-Volatile Random Access Memory area. This file performs a similar
    function and stores the BIOS information with the boot order of your virtual hard
    disk, floppy, and CD-ROM.'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'Because the entire machine is stored in these files, it is very simple to move
    it to another location. You can copy the files to a second directory and voila!
    You have two identical PCs. You will of course have to take care of unique names
    and IP addresses within the guest operating systems.


    Also, because the entire machine is stored in a set of files, it is simple to
    create a back-up or archive set. After installing a new guest operating system,
    you close the virtual machines and create a ZIP archive that you store on your
    server. If you ever need to do anything, for example on a Windows 2003 Enterprise
    Edition server, you just need to unpack the archive to your computer and you can
    get started with your project.


    # 1.2 Usage Scenarios for VMware Software


    Every time I meet people who are new to VMware, they are impressed with what the
    software can do, but they also discover new ways of using VMware which I did not
    even think of before. This section describes a few common scenarios for the use
    of VMware technology, for either the workstation or server versions.


    # Software and OS testing


    System administrators, trainers, and consultants are continuously challenged with
    new releases of software and operating systems. They have to install the new software
    and to test it for their production environment, customer projects, or for educational
    purposes. Installing new operating systems normally requires an extra PC or requires
    making an existing PC multi-boot. With VMware, you can run multiple operating
    systems on one PC and they can even run simultaneously. But software testing also
    requires multiple PCs. In an environment where multiple systems are used, new
    software must be tested for all platforms in use.


    Using VMware software to accomplish this task saves time and money. Time: because
    with a click of a button (the Revert to Snapshot button) you can reset your environment
    to the same baseline starting point for every test. Money: because you do not
    have to pay for extra PCs to do all of the testing.


    # Software development and support


    The same reasons mentioned before also apply for software developers and support
    personnel. They very often have to test the solution they are building or the
    software they are supporting on the same environment as their customers are using.
    With VMware software, they can start the operating system of their choice without
    having to place multiple PCs on their desk.


    # Secure and standards based desktop management


    With VMware Workstation you can create virtual machines that are configured with
    your corporate operating system environment. Those machines can then be given
    to end-users to run the standardized environment from their own PCs at work, at
    home, or on their laptop. In early 2005, VMware introduced a new product called
    Assured Computing Environment (ACE). With this product, virtual'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'machines can be created the same way as with VMware Workstation, but as an
    administrator you get full control over the way these machines are used. The user''s
    working environment can be secured by only allowing authorized users to access
    the virtual machines or by limiting access to specific servers on your network.
    With ACE, VMware has introduced a completely new way of working with operating
    system environments for end users.


    # Education


    For training delivery where PCs are involved, there are many advantages to using
    VMware software. In the first place, it makes the job of the instructor easier,
    because setting up the baseline for training requires no more than copying the
    correct virtual machines to the student PCs. When a student crashes his environment,
    it does not take too much time to revert back to the starting point with either
    using the Snapshot feature, or by copying a new PC.


    Most of this could be done with imaging software, but the possibility of creating
    a snapshot and returning to a point where it was working, without having to do
    all of the exercises from day one is something that only VMware can do for you.
    Something else that makes VMware the preferred technology over imaging is that
    it runs on all hardware platforms. For a trainer working at multiple locations
    there is always the challenge of finding the correct drivers for the video adapters
    and network boards. With VMware software, installing VMware and copying the virtual
    machines to the computers is all that it takes to set up the classroom.


    Also, it can be advantageous for the students to work with VMware because you
    can run the full environment for the training including multiple servers and workstations
    on a single PC. You are not impacted by other students who can not keep up with
    the pace. However, therein lays the challenge for the instructor since you lose
    the benefits of students teaming up and learning from each other. This is easy
    to overcome by using a virtual machine per computer that still gives you the benefits
    mentioned earlier, but allows you to create teams of students as well.


    # Consolidating servers


    The VMware GSX Server and ESX Server products can be used to consolidate servers
    into one general hardware platform. There are many reasons to do this; some companies
    do it to save on the cost of hardware, other companies want to make it easier
    to maintain their environment. Also, some customers want higher availability and
    buy the full virtualization platform with ESX Server, VirtualCenter, and VMotion.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# 1.3 Choosing the Right VMware Product


    The entry level product that VMware offers is the VMware Workstation version.
    It is intended to be a product for a single user on a single computer, running
    multiple virtual machines for any of the purposes described in this chapter. People
    very often ask me: ‘Can I use VMware Workstation to consolidate my servers into
    one hardware box?’ My answer is yes, but! The technology that you get with VMware
    Workstation or any of the server versions is very similar. You can run multiple
    operating systems, and you can assign multiple network adapters and separate disk
    channels so you can even run multiple servers with an acceptable performance.
    Here comes the But!! As I have mentioned earlier, the product is intended for
    single user usage. Only one user can manage the virtual machines at any given
    time, and you will have to be present at the physical machine to work with the
    machines (or you will have to remote control the host PC). This is again limited
    to one administrator accessing the host computer.


    ![](img/25fe75b93b97a021effaba85db112a52_22_0.png)


    Note: not only are there technical and usability issues with using VMware Workstation
    in this way. You also do not comply with the End User License Agreement for VMware
    Workstation that is very specific that the product is intended for one specific
    individual user only.


    VMware ACE gives you the same capabilities as VMware Workstation, but it also
    gives you full control over how virtual machines are being used by end-users.


    # VMware Server products


    In the VMware GSX Server and ESX Server sections of this book I will explain the
    differences between these versions in more detail and will explain why you should
    consider buying them. At this point, I would like to give you a brief overview.


    Among other benefits of these products, both server versions come with a Management
    Interface which you can use to manage the virtual machines via a web based management
    interface and from a Remote Console. With these management solutions you do not
    have to rely on the remote access to the operating system; you can access the
    VMware GSX or ESX virtual machines directly on the hardware level. Therefore,
    you can enter the BIOS of the virtual machines, power the machines on and off,
    and even change the VMware configuration. With these solutions you can manage
    your machines with multiple administrators simultaneously.


    When you are serious about running multiple servers for your production environment
    on a single hardware platform, it is not only the management of virtual machines
    that makes it interesting to look into server versions. It is also the ability
    to monitor the performance of your virtual machines and act accordingly.


    There are many tools and products available for the server versions that can help
    you create a professional virtual environment. An example is physical to virtual
    conversion, such as when you move your servers from the existing environment'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'into your virtual infrastructure. Other examples are VirtualCenter and VMotion
    applications which can help you manage your virtual machines and move them from
    one hardware platform to another, if they are stored on a Storage Area Network.


    Last but not least, the server products come with support for your virtual environment.
    This is possibly the most important feature of the server products if you plan
    on using VMware technology in your production environment. You will likely have
    support for your operating systems and your hardware, so it is very important
    to have a supported virtual infrastructure as well.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# 2 Fast Track to VMware Workstation


    This chapter contains everything you need to know when you get started with VMware
    Workstation. Experienced users may find the new information on upgrading from
    a previous version interesting. Chapter 3 explains what is new in VMware Workstation
    version 5 in detail.


    In this chapter, I will cover the basics and will make sure that you have the
    important information that you need to get your virtual machine up and running.
    All other basic information is covered in the VMware manual; therefore, I will
    not discuss the basic information, such as how to add a USB device or a printer
    to your virtual machine in detail. The people at VMware have done an excellent
    job of explaining the day to day operations in their documentation and in the
    products’ help files.


    # 2.1 Set Up the Hardware and Host OS


    VMware Workstation runs on almost any PC that you have available, starting with
    Pentium II and Celeron versions. A full list of hardware specifications and requirements
    can be found at VMware’s website at the following url: www.vmware.com/support/ws5/doc.
    The two most important items that you need when getting started with VMware Workstation
    are memory and disk space; you need lots of memory and lots of disk space. You
    can read more about optimization steps that you can take as well as advanced configurations
    for working with virtual machines in part 2, which covers general configuration
    and tips. The minimum amount of RAM that you need to start working with VMware
    and to have acceptable performance is 512 MB. If you run a virtual machine that
    uses 256 MB, it leaves the other 256 MB for your host operating system. For every
    virtual machine that you install, you need at least 1.5 GB of disk space.


    As a host, you need either Windows or Linux. You will have to decide on one of
    these before you buy the software, because every operating system requires its
    own version of VMware Workstation and both require their own license.


    # Windows


    Simply put, the only Windows versions that are not supported in VMware are Windows
    9x and Windows NT. All the other versions can be used ranging from Windows XP
    Home Edition to Windows Sever 2003. If you have a 64 bit system, you can also
    install a Windows XP or Windows Server 2003 64 bit edition to use the VMware Workstation.
    The software itself is still 32 bit so you will not gain any benefits. Also, your
    guest will run in 32 bit legacy mode inside the virtual machine.


    ![](img/25fe75b93b97a021effaba85db112a52_24_0.png)


    Tip: At the time of writing this book the beta version of VMware Workstation version
    5.5 supports running 64 bit operating systems as a host and as a guest.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Linux


    The list with supported Linux distributions on VMware’s website is rather long.
    If you need detailed information about the distribution on which you want to install
    VMware Workstation, you can check the full listing at the following URL: www.vmware.com/support/pubs.
    Most current versions of Mandrake, Red Hat and SuSE are supported. Not only the
    professional workstation and server version, but also the ‘consumer’ editions
    like Red Hat Linux 9 and SuSE Professional 9.x are supported.


    Tip: When installing your Linux host, make sure to select the packages for the
    C compiler and kernel development. These are not enabled by default. I suggest
    that you install them because it is very likely that there are kernel modules
    for VMware or other products that you want to install, which do not match the
    kernel you are running and will need to be compiled. Installing these packages
    after your host has already been installed is time consuming and you could run
    into some inconsistencies. An example of this is when your kernel is updated by
    an update process and the packages that you install from the CD-ROM are from an
    older version.


    # 2.2 Get the Software


    First, you will need to get the software. You can start out with an evaluation
    version that you can download from: www.vmware.com/download. You can also apply
    for a 30 day evaluation copy. The software that you download is the same for both
    the evaluation period and when you buy a license. So you do not have to re-install
    the VMware Workstation.


    At the time of writing this book, September 2005, the most current version is
    VMware Workstation 5.0, build 13124. This is also the version that is used for
    all configurations and examples in this book. Many of the tips and configuration
    options also apply to the VMware server versions.


    # Get a discount


    VMware Workstation is available for Windows or Linux. You choose the host operating
    system when you buy your copy. So, if you buy the Windows version and decide to
    switch to Linux, you will have to buy an additional copy, and vice versa.


    The price for each (Windows or Linux) is USD 189.00 for electronic distribution
    and USD 199.00 for packaged distribution. An upgrade to version 5 from version
    4.x costs USD 99.00 (these prices are as of September 2005). You are eligible
    for a 5% discount if you enter the following discount code when you buy your product
    on-line at the VMware Store: VMRC-ROBBAS389. This code is valid for VMware Workstation
    and VMware GSX Server purchases.


    Note: Do you have the latest version? VMware includes an auto update feature that
    checks the availability of new software. Open Edit → Preferences to configure'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'this feature on the Workspace tab. You can configure this check to be performed
    daily, weekly (default), or monthly. It does not automatically install the new
    software, but it does warn you when a newer version is available for downloading.
    The automatic check can also be disabled by selecting Never in the update configuration.


    # 2.3 Upgrading From a Previous Version


    For computers with a Windows host operating system, where an existing version
    of VMware is already installed, the upgrade process has become much easier with
    version 5. For previous upgrades, the older version had to be deleted and the
    entire process, including the new installation required at least two reboots.
    This has been greatly simplified, because the upgrade now removes the current
    version and installs version 5 without the need to reboot.


    For computers with a Linux host, it depends on the installation method that you
    used for the previous installation. If you used the tar installation method, then
    there are no extra steps that you need to take. You can start the installation
    process from the distribution files. The only thing that you must do first is
    to delete any old tar installation files that may still be in your present working
    directory. If the directory vmware-distrib exists, delete it first, before extracting
    the installation archive.


    When you use the RPM installer, you must first uninstall the current version before
    you can install a new one. To find out whether your installation was made with
    the RPM package, use the following command to query the RPM database:


    ```

    rpm -qa | grep VMware

    ```


    If no entry from the database is shown, then you can assume that the installation
    was done with the installer from the tar archive. If you need to uninstall the
    application when it was installed with the RPM package, use the following command:


    ```

    rpm -e VMwareWorkstation

    ```


    The RPM database listing that you performed with the query command shows all the
    installed software. The keyword VMwareWorkstation is used to uninstall the Workstation.
    It could also be another keyword from the database, depending on the version you
    are running.


    # Preparing for the upgrade


    Before upgrading the software, virtual machines must be prepared.


    +   1. Make sure that all virtual machines are in the Power Off state. If your
    machines are suspended, resume them first, shut down the guest operating system,
    and then power them off. After installing the new GSX Server software, you will
    need to upgrade the virtual hardware. See the GSX Server'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'Administration Guide if this applies to you. Also check the explanation about
    VMware generations on page 98.


    +   2. Save all the undoable disk mode information into the virtual disks. When
    you have disks that are in the legacy undoable mode, make sure to save all the
    changes into the virtual disks or discard the changes when powering off.

    +   3. Remove any current snapshots that the virtual machines have.


    After taking these preparatory steps, the software can be installed on your computer.
    The individual virtual machines still need to be upgraded.


    # Upgrading from a version released prior to version 4


    If you are working with a very old version, then additional steps are necessary.
    For version 2, you need to upgrade the virtual machines to version 3 or 4. Afterwards,
    they can be upgraded to version 5. VMware version 3 machines need to be upgraded
    to version 5 before they can be used with version 5.


    # Upgrading from version 4


    Virtual machines that have been created with version 4 of Workstation can run
    directly with version 5. There will be some limitations because the new features
    of version 5, such as using multiple snapshots, are not available. Also, the performance
    benefits that version 5 offers are not available, if you do not upgrade your virtual
    machines. If you choose not to upgrade the machine, do not forget to install the
    newer version of the tools inside the guest operating system. That is the minimum
    action that you must take after upgrading your host to version 5.


    ![](img/25fe75b93b97a021effaba85db112a52_27_0.png)


    Figure 2.1: This message will warn you if your machine is not already upgraded
    to a version 5 virtual machine.


    As you can see, it is best to upgrade your entire virtual machine to version 5.
    This is an irreversible operation so make sure to create a backup of your virtual
    machine first. Upgrading the virtual machine must be done while it is in a power
    off state. When the machine is powered off, select the Upgrade Virtual Hardware
    from the VM menu.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'After the upgrade has been performed, install the new version of the tools
    inside the virtual machine. Depending on the version of VMware Workstation that
    you were running and the operating system inside the machine, additional steps
    may be necessary for your specific guest. For example, in a Windows 9x machine
    the display driver needs to be upgraded after upgrading the virtual hardware.


    # 2.4 Install VMware Workstation for Windows


    The installation of VMware Workstation for Windows is very straightforward. When
    accepting the license agreement, you will get the usual questions, such as where
    you would like to place your software. One of the specific questions that will
    be asked may need some clarification. This question is displayed in Figure 2.2.


    ![](img/25fe75b93b97a021effaba85db112a52_28_0.png)


    Figure 2.2: Prevent unwanted behavior and disable Autorun during installation.


    If you leave the CD-ROM autorun enabled, and you run operating systems in your
    virtual machines which also auto mount CD-ROMs, you will end up with multiple
    PCs accessing the same CD-ROM. This is not a desirable situation. It will cause
    strange behavior and will slow down both the host and the guest. Therefore, leave
    the default setting to disable autorun enabled.


    The final step for finishing your installation is to add your VMware Workstation
    for Windows license. In VMware Workstation, select Help → Enter Serial Number
    to add the license.


    Once the installation has been completed, you can create your first virtual machine.
    Before you do so, make sure that you understand what types of disks and networking
    you can choose. Continue with section 2.6 to read more about disk types and networking
    options.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# 2.5 Install VMware Workstation for Linux


    At this point, I am assuming that you have downloaded the installation files,
    copied them to your computer, or mounted the CD-ROM that contains the installation
    files. VMware Workstation for Linux is available in two formats: tar archive and
    an RPM package. I will explain how to install the VMware Workstation for both
    types of installation files.


    Follow these steps to install the software:


    +   1. Log on to your Linux host and open a terminal window.

    +   2. You need to install the software as a root user so use the su - command
    to become root.

    +   3. For the RPM version, there are two installation methods. One method is
    to execute the following command to install the software:


    ```

    rpm -Uhv VMware-gsx-3.2.0-14497.i386.rpm

    ```


    Another method to install the RPM package is to click on the file in a file manager
    in the GUI. Figure 2.3 shows an example of a SuSE 9.3 host, where the RPM is selected
    in Konqueror. The description of the package is displayed to show what software
    will be installed. Click on Install package with YaST to install the package.
    Package managers on other Linux distributions may look different from this, but
    the installation is just as simple.


    ![](img/25fe75b93b97a021effaba85db112a52_29_0.png)


    Figure 2.3: The RPM package can also be installed from the GUI.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '4. For the tar archive version, execute the following commands to install the
    software. First, make the /tmp directory your present working directory or choose
    another directory where you want to extract the files. This eliminates the need
    to copy the archive to your hard disk first.


    ```

    cd /tmp

    ```


    Extract the archive with the following command:


    ```

    tar -zxf <path>/VMware-workstation-5.0.0-13124.tar.gz

    ```


    Change the present working directory to the location of the installation files:


    ```

    cd vmware-gsx-distrib

    ```


    Start the installation script:


    ```

    ./vmware-install.pl

    ```


    5. After the package is installed or when the installation script from the tar
    archive has completed running, start the VMware Workstation configuration script
    with the following command:


    ```

    vmware-config.pl

    ```


    6. The first action that you have to take is to read and accept the end user license
    agreement. Read through it and when you are finished, press q to exit the reader.
    Then type yes, if you agree with the EULA.


    7. The configuration script will ask you several questions that you need to answer.
    Here are the default directories that you will be prompted for as well as the
    default paths that are suggested by the VMware configuration script. They originate
    from an installation on a SuSE 9.3 professional host. The paths can be different
    on other Linux distributions.


    | Item | Path |

    |---|---|

    | mime type icons | /usr.share/icons |

    | desktop meu entry files | /usr/share/applications |

    | application icon | /usr/share/pixmaps |


    8. At this point in the configuration process, it will try to find a suitable
    vmmon module for the kernel you are running. If it finds one, the following message
    will be displayed and the configuration will continue:


    The module loads perfectly in the running kernel.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'When the pre-compiled modules for your kernel are not available, the following
    message will be displayed:


    None of the pre-built vmmon modules for VMware Workstation is suitable for your
    running kernel. Do you want this program to build the vmmon module for your system
    (you need to have C compiler installed on your system)?


    At this time you need to have a C compiler and the kernel source files installed.
    If you have not installed these during the initial Linux installation, you can
    do that now.


    ![](img/25fe75b93b97a021effaba85db112a52_31_0.png)


    Tip: Be aware that if you install the kernel source from your installation CD-ROM,
    that version may be different from the one that you are already running. This
    is because the current one may have been updated by an automated update process.
    In that case, go through the same update process to update the added kernel development
    package including the kernel sources.


    When a C compiler and kernel source files are available, you will be prompted
    with the following question:


    What is the location of the C header files that match your running kernel?


    The default location is: /usr/src/Linux/include.


    When it was necessary to build the vmmon module it might show messages saying:
    Module.symvers is missing'' modules will have no modversions and Unable to build
    the vmmon module.


    If that is the case, run the following commands from the Linux source directory,
    but make that directory the present working directory first:


    ```

    ```

    cd /usr/src/Linux

    make cloneconfig

    make modules_prepare

    ```

    ```


    After running these commands, execute the vmware-config.pl configuration script
    again. Whether the modules will now compile, really depends on your distribution.
    However, in most cases they will compile. When it does not work after this step,
    I suggest that you search the VMware knowledge base and the VMware Community Forums
    for information on your specific installation.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '9. When the modules are loaded, the configuration script will prompt you with
    questions regarding networking. Answer these questions according to your needs.


    +   - Do you want networking for your virtual machines?

    +     (default: yes)


    +   - Do you want to be able to use NAT networking in your virtual machines?

    +     (default: yes)


    If you select to install NAT:

    Do you want this program to probe for an unused private subnet?

    (default: yes)

    You will also be prompted with a question to configure additional NAT networks.
    The default answer is: no.


    +   - Do you want to be able to use host-only networking in your virtual machines?

    +     (default: yes)


    If you select to install host-only networking:

    Do you want this program to probe for an unused private subnet?

    (default: yes)

    You will also be prompted with a question to configure additional host-only networks.
    The default answer is: no.


    10. After the configuration script has finished successfully, you can start the
    VMware Workstation. There is no need to do that as a root user, so execute the
    exit command to return to your previous user environment. Start the application
    with the following command from the command line:


    ```

    /usr/sbin/vmware &

    ```


    Tip: The ampersand sign (&) has been added to run the application in the background
    when the GUI application starts. This is to prevent your running shell to be stuck
    on this command. You probably have enough windows open already and we do not want
    too many windows open; do we?


    11. The final step to finish your installation is to add your VMware Workstation
    for Linux license. In the VMware GUI application, select Help → Enter Serial Number
    to add the license.


    After the installation is complete, you can create your first virtual machine.
    Before you do so, make sure that you understand what types of disks and networking
