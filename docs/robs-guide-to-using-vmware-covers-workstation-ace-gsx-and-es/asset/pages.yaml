    | VMware ACE.msi | This is the Microsoft Windows Installer package for the VMware
    ACE runtime environment. |

    | Project (directory) | Contains any custom scripts needed for the virtual machine.
    |

    | Virtual machine directory | A directory with all the virtual machine''s files.
    |


    The New Package Wizard will guide you through the process of creating the deployment
    package. Start the wizard from the Project menu, or click the link Create package
