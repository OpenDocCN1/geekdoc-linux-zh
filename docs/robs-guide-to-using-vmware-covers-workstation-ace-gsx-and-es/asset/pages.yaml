- pgno: 355
  md: '# Covers Workstation, ACE, GSX and ESX Server


    # ROB''S GUIDE TO USING


    # VMWARE


    ![](img/25fe75b93b97a021effaba85db112a52_355_0.png)


    # Second Edition


    The Second Edition of Rob''s guide to using VMware is updated for all the new
    versions of VMware products. This book is based on VMware Workstation version
    5 and all the tips and procedures have been updated for this latest version.


    The sections covering Physical to Virtual conversion and clustering have been
    updated with new techniques and they now cover new information on the complete
    range of VMware products, including ACE, GSX Server and ESX Server.


    The sections on VMware GSX Server and ESX Server will get you started with these
    high end VMware products. The author has created a very comprehensive introduction
    to VMware''s server products which will introduce the reader to the main concepts.


    The information in this book is based on Microsoft Windows, Linux and Novell NetWare
    and Open Enterprise Server. For each operating system the book contains unique
    configuration tips on using virtual disks, networking and more.


    # Major topics covered in this book are:


    +   - Fast track to VMware Workstation for new users

    +   - Virtual Machine configuration and optimization tips

    +   - Network configurations for NAT and routing

    +   - Tips for Windows, Linux and NetWare in VMware

    +   - Physical to Virtual conversion with low cost tools

    +   - Clustering with shared disks in VMware Workstation, GSX Server and ESX Server'
  merge: -1
  img_proc: true
