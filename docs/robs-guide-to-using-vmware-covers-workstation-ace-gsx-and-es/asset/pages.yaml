- pgno: 100
  md: '# 6.4 VMware Product Generations


    If you have worked with VMware products for a few years, you probably know that
    virtual machines are not always compatible between virtual machine products or
    between different versions of the same product. In this section, I will discuss
    how to work with different product generations and how to find out which generation
    a virtual machine belongs to.


    Note: The information in this section is an abstract from the official VMware
    Virtual Machine Mobility Planning Guide, available at the following URL: www.vmware.com/pdf/mobility_guide.pdf.


    Table 6.5 lists the four current VMware product generations. Converting virtual
    machines between VMware products that are of the same generation is simple in
    most cases. In some special cases such as moving from VMware Workstation to VMware
    ESX Server, some additional steps are required.


    Table 6.5: The VMware products and their generations.


    | Generation level | Products that belong to this generation |

    |---|---|

    | Generation 2 | GSX Server 1, ESX Server 1.0 and 1.1 |

    | Generation 3 | Workstation 3, GSX Server 2, ESX Server 1.5 |

    | Generation 4 | Workstation 4, GSX Server 3, ESX Server 2 |

    | Generation 5 | Workstation 5 |


    Tip: When products are not from the same generation, you can certainly follow
    the official guideline and upgrade the virtual machine. However, it is sometimes
    easier to just use the physical to virtual conversion methods described in part
    3 of this book to perform a virtual to virtual migration.


    If you want to do some research on a virtual machine when you are not sure of
    its generation, here are some tips that are useful:


    ```

    config.version = "2"    VMware Workstation 2

    config.version = "6"    VMware Workstation version 3 / GSX Server 2.x

    config.version = "7"    VMware Workstation version 4/ GSX Server 3.x

    config.version = "8"    VMware Workstation version 5 and 5.5.

    ```'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'There is also an identifier that is being used for the hardware generation.
    This is a list of what I have found in my virtual machines over the years:


    ```

    virtualHW.version = "2"      VMware Workstation 3 / GSX Server 2.x

    virtualHW.version = "3"      VMware Workstation 4 / GSX Server 3.x

    virtualHW.version = "4"      VMware Workstation 5 and 5.5

    ```


    A VMware Workstation version 2 virtual machine can easily be recognized by the
    .dsk extension for its virtual disks. The .vmdk extension was introduced with
    VMware Workstation version 3.


    If you have a copy of a virtual hard disk only (.VMDK) and you do not know what
    hardware generation it belongs to, then you can search the file for the appropriate
    string. The hardware identification is stored in the first .VMDK file of the virtual
    had disk set.


    Use Windows''s find command or Linux''s grep command to find the virtual disk
    generation identifier inside the file:


    Windows


    ```

    find "virtualHWVersion" <path to .vmdk file>

    ```


    Linux


    ```

    grep ''virtualHWVersion'' <path to .vmdk file>

    ```


    This will result in a string, such as this one which displays version 4, belonging
    to VMware Workstation 5:


    ```

    ddb.virtualHWVersion = "4"

    ```


    Note: For older versions of VMware Workstation, I did not find this string in
    the configuration file. It is there for VMware Workstation 4 and 5. Therefore,
    since version 2 uses .DSK files the remaining .VMDK files where this string is
    not found will probably be from Workstation version 3 or GSX Server 2.


    # 6.5 VMware Windows Services Overview


    VMware Workstation adds three services to your Windows. If you install the VMware
    DiskMount utility, a fourth service will be added. The image below shows the services
    overview from the Services application in Administrative Tools.


    ![](img/25fe75b93b97a021effaba85db112a52_101_0.png)'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'The DHCP and NAT services take care of these respective VMware features on
    your host PC. They are explained in chapter 11: “Networking configurations”. The
    Virtual Mount service belongs to the VMware DiskMount utility, discussed in section
    7.4: “Using the DiskMount Utility”.


    # VMware Authorization Service


    This service needs clarification. The authorization service takes care of running
    VMware when the user who starts the application is not an administrative user.
    This service detects that a user is not an administrative user and starts VMware
    as the Local System Account. Figure 6.2 shows a screen capture of the Sysinternals
    Process Explorer


    ![](img/25fe75b93b97a021effaba85db112a52_102_0.png)


    Figure 6.2: Sysinternals Process Explorer.


    The vmware-vmx.exe is started as a child of vmware-authd.exe under services. The
    operation of the service can be tracked by enabling logging in the general VMware
    configuration file. This file is called config.ini and is located at C:\Documents
    and Settings\All Users\Application Data\VMware\VMware Workstation. To enable logging,
    add the following lines to this text file:'
  merge: -1
  img_proc: true
- pgno: 103
  md: '```

    vmauthd.logEnabled = "true"

    log.vmauthdFileName = "C:\authd.log"

    ```


    The following is part of a log file where a virtual machine is started by user
    Simple:


    ```

    app| Username associated with named pipe: simple

    app| Allocating a new session

    app| CreateLogonSession: spawn with username: simple

    app| (Account is NOT administrator)

    app| (Account is interactive)

    app| Not mapping drives for acct

    ```


    Note: Do not leave the logging turned on by default. Use it only when analyzing
    or troubleshooting this service and turn the logging off when you are finished.


    # 6.6 Customizing Tip of the Day


    As an experienced user, one of the first things that you disable is the Tip of
    the day screen. If you do not want to be bothered with this information, you need
    to press Ctrl-Alt-Ins to send Ctrl-Alt-Del to the guest. Depending on how VMware
    is used, these tips could be useful. For example, they are useful when students
    are working with the software in an educational environment. The messages VMware
    displays can be customized to meet the need of your users or to be translated
    in their native language.


    # Re-enable Tip of the Day


    If you regret turning off these tips of the day messages, you can re-enable this
    feature by selecting Help → Tip of the Day. This will open the tip of the day
    window, where you can enable the checkbox to Show tips at startup. Figure 6.3
    shows a customized Tip of the Day message. It informs users in their native language
    (Dutch in this case) on how to send a reset keystroke to the virtual machine.


    ![](img/25fe75b93b97a021effaba85db112a52_103_0.png)


    Figure 6.3: The tip of the day feature can be customized.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# Customizing Tip of the Day


    The tips that VMware Workstation shows are stored in the file tip_list.vmsg. For
    Windows, it is stored in directory C:\Program Files\VMware\VMware Workstation\messages\en.
    For Linux, the file is stored in directory /usr/lib/vmware/messages/en.


    These messages can be customized by modifying the text in the default tips or
    by adding new messages. The file has the following format:


    ```

    # en-tips-ws-windows

    tip.0="To send Ctrl-Alt-Del to the guest press Ctrl-Alt-Ins."

    tip.1="Press F11 to enter quick switch mode."

    tip.2="Press Ctrl-Alt-Enter to enter full screen mode."

    ...

    ```


    The tips are processed in sequential order starting with tip.0. You can add tips
    by continuing the numbering at the end of the file. Tips can also be removed from
    the file, or can be commented out (# at the beginning of the file) to prevent
    them from being displayed. Make sure that all other lines are ordered sequentially,
    because when the numbering sequence is broken, the tips after the missing number
    will not display.


    Note: The new tips will be displayed after restarting VMware. The application
    reads the tips at startup.


    Note: This file may be overwritten when installing a newer version of VMware Workstation.
    So, make sure to keep a back-up copy of your modified file and verify and restore
    your modified environment after an upgrade.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# 6.7 Restricting and Customizing VMware Workstation (Windows Only)


    There are two features in VMware Workstation that are useful when end-users work
    with VMware Workstation. These features are useful in an educational environment
    or when end-users use VMware in a migration scenario; they may be using an older
    version of Windows to migrate to another operating system on their desktop (either
    Windows or Linux).


    Tip: For the functionality described in this paragraph, it is important that users
    have limited rights to the Windows environment. Users that are not configured
    to be administrators can start virtual machines because of the VMware Authorization
    Daemon. How that works is described in section 6.5, “VMware services overview”


    # Administrative lockout feature


    With the use of this feature users can be prevented from doing the following:


    +   - Create new virtual machines and teams

    +   - Edit virtual machines and team configurations

    +   - Manage virtual networks


    These three options can be individually selected from the Lockout tab via Edit
    → Preferences. (See Figure 6.4.)


    In this screen, you also provide a password that will be needed by the users to
    perform any of the locked out features.


    This configuration by itself is also secured with the same password.


    ![](img/25fe75b93b97a021effaba85db112a52_105_0.png)


    Figure 6.4: Administrative lockout prevents users from modifying the VMware environment.'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'If the password is forgotten, you can follow the directions described in the
    note below.


    > ⚠ Note: The VMware documentation points out that in case of a lost password
    the entire application needs to be uninstalled and re-installed. However, there
    is a configuration file that stores the password. In a previous version of VMware
    Workstation the password was stored in clear text, but with version 5 it is stored
    in an encrypted format. But, if a user has write access to the VMware configuration
    file, he or she can still disable the lockout feature by modifying the lockout.enabled
    option in the file.


    For Windows the configuration file is called config.ini and it is located at:


    ```

    C:\Documents and Settings\All Users\Application Data\VMware\VMware Workstation.

    ```


    The following text is an example of the administrative lockout configuration parameters
    from the config.ini file:


    ```

    lockout.enabled = "TRUE"

    lockout.createVM = "TRUE"

    lockout.editVM = "TRUE"

    lockout.manageNetworks = "TRUE"

    lockout.passwordHashed = "TRUE"

    lockout.password = "ik47fsVUv60uf/oXpD8sSw=="

    ```


    You can configure the settings in this file, but doing so is not recommended.
    The Preferences panel is the only supported means of configuring these settings
    in VMware Workstation.


    # Restricting the user interface


    This is a feature that can be enabled on a per virtual machine basis to restrict
    the VMware user interface. It will disable the menu options and toolbar buttons.
    The effects of using this setting are described below. It is only available for
    Windows hosts:


    +   - The toolbar is hidden from the end user.

    +   - All options in the Power and Snapshot menus are disabled.

    +   - Access to the virtual machine configuration is disabled. Both via the Settings
    menu option and via the icons in the status bar.

    +   - Users can open other virtual machines via the .vmx file. If the user interface
    is not restricted for that virtual machine then the interface will be only available
    for that machine. It is still restricted for the virtual machine which was opened
    with the restricted setting.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '+   - The virtual machine will automatically power on after opening it. A virtual
    machine is stopped, by shutting down the guest operating system. The user can
    click the close icon in the upper right corner or choose File → Exit. This will
    ask the user to power the machine off. Suspend and resume is not available in
    this mode. You can use the Snapshot feature to always start at the same point.
    This will be discussed in more detail later.


    The restricted user interface is activated via a parameter in the virtual machine
    configuration file. Close the VMware application for the virtual machine that
    you want to configure and open the .vmx configuration file with a text editor.
    Add the following line to the file:


    ```

    gui.restricted = "true"

    ```


    Starting VMware with this parameter restricts the user interface as described
    above.


    Note: Using this setting is not a total security feature to disable users to modify
    the VMware environment. You will have to configure the configuration file for
    read-only access, so that the users can not modify the contents of the file. However,
    they can still copy the file or its contents to a new location or file, where
    they have full access and remove the gui.restricted parameter.


    The restricted user interface can be unrestricted by removing the gui.restricted
    parameter from the .VMX file or by setting it to gui.restricted = "false".


    # Using Snapshot to always start the same configuration


    The Snapshot feature can be combined with the restricted user interface to create
    a configuration where a user always starts the virtual machine with the same guest
    operating system state.


    To create this type of configuration, perform the following steps:


    +   1. Create the Snapshot of the virtual machine while it is in the Power off
    state. The VMware manual notes that any state can be used, but when taking a Snapshot
    of a running machine and setting the machine to revert to the Snapshot after Power
    off, the machine continues to go to that state after powering off.

    +   2. Turn your virtual machine off and configure the virtual machine to always
    revert to the Snapshot after Power off.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '![](img/25fe75b93b97a021effaba85db112a52_108_0.png)


    Figure 6.5: Always return to the same starting point with snapshots.


    3. Close the VMware application and enter the gui.restricted = "true" parameter
    in the .vmx file.


    From now on, the virtual machine will always start with the same state of operating
    system that it was in when the snapshot was created.


    # 6.8 VMware Guest Time Synchronization


    Time synchronization between the host computer and the guest is a mechanism which
    either: always works for you, or always gives you a headache. Let''s get it over
    with, and look at the details of configuring time synchronization.


    A new virtual machine boots and takes over the time from the host operating system.
    It creates a NVRAM BIOS file which is also used to store the values of the CMOS
    clock of the virtual machine. Just as with a real PC, the virtual machine uses
    its internal clock, and your guest operating system in turn uses that time.'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'technology. These computers vary the speed that the processor runs with, to
    the power state of the PC.


    Your best strategy to get the time synchronized between the host and the guest
    is to enable the time synchronization feature in the VMware tools. You can enable
    this feature from the graphical configuration window for the tools in your operating
    system, or to set the following parameter in the .vmx file for your virtual machine.


    ```

    tools.syncTime = "true"

    ```


    However, there is a strange behavior about this synchronization which is mentioned
    in the VMware Workstation manual somewhere, but which is not well known. It is
    described in the following note:


    > ⚠️ Note: You can synchronize the time in the guest operating system with the
    time on the host operating system, only when you set the clock in the guest operating
    system to an earlier time than the time set on the host. This can very simply
    be tested by setting the local clock of your virtual machine a few minutes ahead,
    and enable the time synchronization. You will see that the time will stay in the
    future. Setting the time to a time that lies before the time on the host, will
    start the synchronization and within a few minutes the time will be in sync.


    > ⚠️ Note: It is very important to use only one method of time synchronization
    for your virtual environment. Do not enable the VMware tools time synchronization
    if your virtual machine is synchronizing time with an outside time source, or
    with other virtual machines (via NTP for example).'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# 7 Virtual Disks, Floppies and CD-ROMs


    Working with VMware is addictive. Once your start working with virtual machines,
    you will want everything to be virtualized. You do not want to swap CDs anymore
    or format floppy disks. This chapter describes how to work with your virtual disks,
    how to create virtual floppies, and how to work with CD-ROM images.


    # 7.1 Working with Virtual Floppy Disks


    With VMware Workstation and VMware GSX Server you can use virtual hard disks.
    That is the first virtual component of VMware that every user creates when he
    or she starts working with VMware. You can also create virtual floppy files. This
    makes it easier to access files in a guest operating system if, for example, file
    sharing between the host and guest is not possible.


    One method of creating virtual floppy disks is via standard features supported
    by VMware.


    You just add a virtual floppy file to a virtual machine and format and access
    the floppy from within the guest operating system. The following image shows you
    how a virtual floppy is created.


    The configuration in Figure 7.1 creates a virtual floppy disk with the extension
    of .flp. If you now boot a Windows or Linux guest, you can format the floppy disk.
    Virtual floppy disks are pre-allocated by default so the file created with the
    above setup will be 1.4 MB in size.


    Tip: a formatted virtual floppy (VirtualFloppy.zip) is available for download
    at www.robbastiaansen.nl.


    ![](img/25fe75b93b97a021effaba85db112a52_110_0.png)


    Figure 7.1: Creating a virtual floppy disk.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# WinImage


    One other method to work with virtual floppy files is the WinImage application,
    available at www.winimage.com. It supports the virtual floppy file format. This
    enables you to create new floppy disks from scratch or to manage existing virtual
    floppy disks. The only thing to be aware of with using virtual floppy disks from
    WinImage is to save them as non-compressed disk files. The normal image type for
    WinImage is a compressed file type with the .IMZ extension; see Figure 7.2). So,
    use the non-compressed .IMA format and save the files as .FLP files, or rename
    the .IMA files to .FLP files.


    ![](img/25fe75b93b97a021effaba85db112a52_111_0.png)


    Figure 7.2: Use the uncompressed format from WinImage.


    # Virtual Floppy Driver by Ken Kato


    There is also a tool available that can mount your virtual floppies in Windows
    with a drive letter. The utility is created by Ken Kato from Japan and it is available
    from his website at:


    ```

    chitchat.at.

    infoseek.co.jp/vmware

    ```


    The tool comes in a command line version and a graphical version. Figure 7.3 shows
    how simple it is to browse to a virtual floppy file and how to mount it with the
    mount button.


    ![](img/25fe75b93b97a021effaba85db112a52_111_1.png)


    Figure 7.3: VFD is a very cool utility for mounting virtual floppies in Windows.


    Tip: if you need boot disks for your VMware environment or for any other reason,
    there are two very good locations on the web for all kinds of boot disks:


    +   - Bart''s boot disk via www.nu2.nu

    +   - www.bootdisk.com'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# 7.2 Sharing a Common Base Disk between Virtual Machines


    This is a tip that will save you valuable disk space. For example, if you have
    multiple Windows workstations on your host PC that only have a slightly different
    configuration they will still take up maybe 1 or 2 GB each.


    Note: This only works with VMware Workstation version 4.x and VMware GSX Server
    3.x. With VMware Workstation version 5 there is default support for multiple snapshots,
    which breaks this type of setup. Using multiple snapshots is described in section
    3.5.


    If you follow the steps provided in this section, your virtual machines can access
    the same base disk file and they will use Snapshot REDO-files to save the differences
    to that base setup. Figure 7.4 illustrates three virtual machines using a common
    shared disk.


    ![](img/25fe75b93b97a021effaba85db112a52_112_0.png)


    Figure 7.4: Three machines using a common base disk.


    To create a setup with two virtual machines sharing a common disk, follow the
    steps outlined here:


    +   1. Start out by creating a virtual machine with the operating system of your
    choice. This is an example of what your directory would look like:


    | Name | Size | Type |

    |---|---|---|

    | nvram | 9 KB | File |

    | Windows 2000 Professional.vmdk | 1 KB | VMware virtual disk file |

    | Windows 2000 Professional.vmx | 2 KB | VMware Configuration File |

    | Windows 2000 Professional-s001.vmdk | 1.592.064 KB | VMware virtual disk file
    |

    | Windows 2000 Professional-s002.vmdk | 320 KB | VMware virtual disk file |

    | Windows 2000 Professional-s003.vmdk | 64 KB | VMware virtual disk file |'
  merge: -1
  img_proc: true
