- pgno: 76
  md: '+   - Authentication policy: The key only

    +   - Expiration policy: The expiration date only

    +   - Devices policy: he list of allowed users only

    +   - Network quarantine policy: All settings


    # Enable a recovery key for your project


    If you will be using password protection for your virtual machines, you need to
    create a recovery key for this project. The recovery key enables you to process
    password changes. I will discuss how to do this later. At this point, select Create
    New Recovery Key in the Recovery Key tab of the Project Settings window. Or, select
    Browse for existing key if you wan to use another project''s key for this project.


    ![](img/25fe75b93b97a021effaba85db112a52_76_0.png)


    Figure 5.3: Create a recovery key for your project if you will be using password
    control.


    To create a new key, specify a name for the key that will help you identify it
    later and specify the path where you would like to store the file that contains
    the key.


    Enter a password that will be assigned to the key file and that will protect the
    private portion of this public/private key pair. You need this password later
    when you need to process a password request from a user.


    # 5.5 Configuring Policies for a VMware ACE Project


    An important reason to use VMware ACE for deploying virtual machines to end users
    instead of using regular VMware Workstation machines is that you can configure
    policies for your ACE environment. With normal virtual machines, the use of a
    machine can not be restricted. With VMware ACE, policies can be defined to:


    +   - Allow only specified users to work with the virtual machine

    +   - Specify what network resources can be used from within the virtual machine

    +   - Configure the use of removable devices for a virtual machine

    +   - Control the life cycle of the virtual machine'
  merge: -1
  img_proc: true
- pgno: 77
  md: '![](img/25fe75b93b97a021effaba85db112a52_77_0.png)


    Figure 5.4: An overview of the available policies in VMware ACE.


    There are two policy categories: VMware ACE policies that define how the ACE application
    works and virtual machine policies which define the behavior of the virtual machine
    that runs in ACE. Table 5.1 contains a brief description of the available policies.


    # Table 5.1: A brief description of all available ACE Policies.


    | VMware ACE Policy | Default | Description |

    |---|---|---|

    | Hot fix | Disabled | Use this policy to allow a user to request help with a
    lost password or an expired or copy protected machine. They can send an e-mail
    directly with an installed e-mail application through MAP I or create a file and
    send it themselves. Requires recovery to be enabled for the virtual machine. |

    | Administrator access | Disabled | With this special Administrator password you
    can run the virtual machine on the end users'' computer in a special application
    to change its configuration. Start this mode with the `vmware -k` command and
    provide the path and filename for the `.vmx` file. |

    | Troubleshooting | Power | Power and reset controls are enabled |'
  merge: -1
