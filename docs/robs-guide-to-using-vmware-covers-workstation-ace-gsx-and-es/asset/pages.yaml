    Go to Start → Run type gpedit.msc Click OK. Go to Local Computer Policy → Computer
    Configuration → Administrative Templates → System. Select Display Shutdown Event
    Tracker and disable it.


    ![](img/25fe75b93b97a021effaba85db112a52_167_0.png)


    Figure 12.3 Disable the Shutdown Event Tracker.'
