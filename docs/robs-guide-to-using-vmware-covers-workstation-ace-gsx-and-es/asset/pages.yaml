- pgno: 214
  md: '# 22 Introduction to Clustering in VMware


    This chapter describes how to set up a cluster in a VMware environment. It will
    start out with the description of a cluster in VMware Workstation, followed by
    a cluster in VMware GSX Server and will conclude with the description of VMware
    ESX Server clustering. If you own a copy of the first edition of my VMware guide,
    then you realize that in that in the first edition I described how to install
    a cluster for NetWare and Windows in detail. This chapter does not contain that
    detailed information any longer. Information on operating system specific clustering
    installation is available in the documentation that is available from all operating
    system vendors. I will, however, provide you a few instructions on how to get
    started with clustering for NetWare and Windows.


    # Clustering Requirements


    When computers are being configured for clustering, one required item is a common
    disk that can be used to access the same data and to enable the computers to communicate
    with each other for clustering housekeeping purposes. This latter part of the
    shared disk is called a Quorum disk in Windows or a Split Brain Detector disk
    in Open Enterprise Server.


    Note: If you have read the first edition of this book, you may remember that clustering
    with a shared disk stopped working with VMware Workstation version 4.5. Even though
    it was never supported in VMware Workstation, it used to work fine nevertheless.
    With some of the performance enhancements that were included in version 4.5, the
    caching by cluster nodes caused corruption of the shared disks. In this chapter
    you will learn that a new parameter to disable caching allows us to create a true
    shared disk cluster with VMware Workstation again.


    Clustering is supported in VMware GSX Server and VMware ESX Server. The VMware
    documentation explains how to configure clusters for these products. In the next
    chapters you will find a comprehensive guide to creating clusters in both server
    products. However, I will also explain how to build a cluster with VMware Workstation.


    # 22.1 Using Fixed Sized (Plain) Disks


    The first thing that you need to know is that you should use virtual disks that
    have a preconfigured size. Normal virtual disks will grow dynamically, from a
    few bytes at the time of creation, to the maximum number of gigabytes that you
    have specified for that disk.


    If you start sharing a regular disk between two virtual machines, you will encounter
    problems with disk corruption. This is because they will both try to grow the
    disk dynamically when data is added to the shared disk.'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'To prevent this from happening, you must use virtual disks that are pre-allocated.
    These disks were known as “plain disks” with VMware version 2. In VMware Workstation
    4 and 5 and VMware GSX Server 3.x, you can create fixed sized disks by selecting
    the check box Allocate Disk Space Now, when you create a virtual disk. This creates
    a disk file that is the same size as the number of megabytes or gigabytes that
    you specified when you created the disk. Therefore, make sure that you have enough
    space available on your hard disk when you create large shared disks.


    For clustering purposes, it is OK to use a small disk (500 Mb), as the Quorum
    disk (Windows) or as the disk for the Split Brain Detector partition (Open Enterprise
    Server). You can then add other plain disks to your cluster, in order to store
    the actual data for your clustered applications.


    # 22.2 How to Share a Disk


    Clustering software uses a shared disk that two or more physical cluster nodes
    can access for storing data. The disk can be accessed by the physical servers
    via a shared disk channel (typically SCSI or Fibre Channel).


    With a virtual machine we do not have a real Fibre channel or SCSI channel available,
    but we can use a shared virtual disk. However, it is important to realize that
    using a shared disk is only supported in VMware GSX Server and VMware ESX Server.
    These products contain a configuration for a shared disk with SCSI reservation.
    For VMware Workstation, you can use a shared disk but that is not supported by
    VMware. However, it does work fine in the workstation version when you follow
    the guidelines in this chapter.


    Using a shared disk within VMware is a great solution for working with clustering
    software. There can still be some scenarios where you may want to cluster a virtual
    machine with a physical machine. Or, you may want to use storage that is available
    on a physical server.


    # iSCSI Considerations


    As I described earlier, shared disks stopped working with VMware Workstation version
    4.5. Disks became corrupted because of the caching that was performed by the virtual
    machines. In the first edition of my VMware guide I explained how to use iSCSI
    as a work around for this problem. By using this protocol which transports SCSI
    blocks via TCP/IP packets, it is possible to build a cluster with every possible
    combination of hardware and operating system. Your virtual machines only rely
    on networking to build a cluster; they no longer require exclusive SCSI or Fibre
    channel access to a shared disk. With VMware version 5 the shared disk works fine
    again and in both cases of GSX server and ESX server using a shared disk is supported.


    However, there can still be a need to use iSCSI in your clustering scenarios.
    An example of this is when you want to build a cluster with virtual machines that
    are'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'running on separate hardware boxes. Or, in case you want to build a cluster
    with virtual machines that use an iSCSI target outside the virtual environment.
    Another application could be if you want to build a cluster with nodes that are
    virtual machine and physical servers. All these types of combinations are possible
    by using iSCSI; the sky is the limit.


    Because iSCSI has become a more commonly used technology, I have decided not to
    keep the detailed iSCSI manual for creating clusters inside this VMware guide.


    Note: Be aware that when implementing iSCSI, your network adapter also becomes
    the adapter that is used to access your storage device. This could cause a bottle
    neck. Therefore, make sure that you investigate the network''s load and storage
    traffic for your cluster nodes if you plan to configure them with iSCSI. You may
    want to add extra physical network adapters to assign separate adapters to the
    regular networking part and to the storage networking part.


    # 22.3 Preparing for a VMware Cluster Installation


    No matter what type of cluster you are going to build, there are a few preparatory
    steps that you will need to take before creating the actual cluster. You must
    create at least two virtual machines that will form the cluster and you must install
    an operating system inside the two machines.


    The flow for creating your VMware cluster is as follows:


    +   1. Create two or more virtual machines in VMware Workstation, GSX Server,
    or ESX Server as you normally would do. This is covered in the OS specific chapters
    that will follow.

    +   2. Install the guest operating system on all the virtual machines that will
    take part in the cluster. Refer to one of these chapters for detailed instructions:

    +      Chapter 23: Windows

    +      Chapter 24: NetWare

    +   3. Add a shared disk to your cluster nodes. This step is different for every
    VMware product. Refer to one of these chapters for detailed instructions:

    +      Chapter 25: VMware Workstation

    +      Chapter 26: VMware GSX Server

    +      Chapter 27: VMware ESX Server

    +   4. Install the clustering software and configure the cluster inside your virtual
    machines. Refer to one of these chapters for detailed instructions:

    +      Chapter 28: NetWare

    +      Chapter 29: Windows'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# 23 Preparing for a Windows Server 2003 Cluster


    This chapter describes how to prepare for a cluster with two Windows Server 2003
    servers and the Microsoft Cluster Server Software. This chapter provides general
    information for a cluster in VMware Workstation, or VMware GSX Server and ESX
    Server.


    This chapter describes the system requirements for your Windows Server 2003 cluster,
    and explains the required preparation steps prior to getting started.


    The instructions in this chapter are a summary of the Guide to Creating and Configuring
    a Server Cluster under Windows Server 2003. This official Microsoft publication
    is available on the web at:


    ```

    www.microsoft.com/technet/prodtechnol/windowsserver2003/technologies/clustering/default.mspx

    ```


    # Before Getting Started


    The required software is Windows Server 2003 Enterprise Edition or Datacenter
    Edition. Because Enterprise Edition is easily available as an evaluation copy,
    this chapter only covers the Windows Server version.


    # 23.1 Creating the Virtual Machines for your Windows Cluster


    You can create your virtual machines for the Windows Server 2003 cluster in the
    normal way. You need to configure two virtual machines for your VMware product
    and install the Windows Server 2003 operating system.


    Tip: When you run VMware Workstation version 5 to create your cluster, you can
    use the new cloning feature to create a copy of your first machine so that you
    do not have to go through the entire installation twice.


    # Network Adapters


    You must be aware that when you create your machines for Windows clustering, you
    will need more than one network adapter. Every server needs two network adapters;
    one for the public network and one for the private network. If you create your
    servers with two network adapters in the beginning, it will be very hard to distinguish
    which adapter is which. Therefore, we start out with one adapter in each virtual
    machine, and we will add a second adapter further on in this chapter.


    The easiest solution is to use your bridged network adapter as the public adapter
    for the cluster nodes, and the host only adapter for the private network between
    the cluster nodes. This will be explained later on in this chapter. However, you
    could'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'also bridge a second network adapter, and use it so that the private and public
    networks are both bridged, or you can use a second host only network adapter so
    that the private and public adapters are both working host only. It is up to you
    to decide which option you prefer.


    The first adapter that you assign to your virtual machines (at creation time)
    will become the public adapter in the setup that you create in this chapter. Therefore,
    assign your servers a fixed IP address (on the network adapter that is in another
    subnet to your private network) that you will use between your cluster nodes.


    In this chapter I use the following setup:


    Table 23.1: IP addressing for the Microsoft Cluster example.


    |  | Node 1 | Node 2 | Cluster management |

    |---|---|---|---|

    | Public Network Adapter | 192.168.1.101 | 192.168.1.102 | 192.168.1.150 |

    | Private Network Adapter | 10.0.0.101 | 10.0.0.102 |  |


    # 23.2 Install Two Servers in a Single Domain


    Cluster services require that all your cluster nodes are in the same Active Directory
    domain. DNS must be configured, and all the servers must be configured as member
    servers or domain controllers. If a server is configured as a member server, then
    it needs to have access to a domain controller in your network. Since we are going
    to create a two node cluster in this chapter, it is important to assign the role
    of domain controller to both servers, because we do not want to have a single
    point of failure.


    # 23.3 Pre-Configuring the Servers


    At this point you should have created your virtual machines and installed the
    two Windows Server 2003 servers in a single domain. Now we can start with the
    necessary preparations inside the server operating systems.


    +   1. Rename the first network adapter.


    You have installed the servers with one network adapter each. This first network
    adapter will be your public network adapter. So, we are going to rename that adapter
    accordingly in order to be able to identify it easier later on. Go to Control
    Panel → Network Connections and rename the adapter to Public Network Adapter.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '![](img/25fe75b93b97a021effaba85db112a52_219_0.png)


    Figure 23.1: Renamed network adapter before and after.


    # 2. Assign a second network adapter to the cluster nodes.


    Power off your servers, and add a second network adapter to both servers. This
    additional adapter will become the adapter for the cluster''s private network.


    ![](img/25fe75b93b97a021effaba85db112a52_219_1.png)


    Figure 23.2: Windows servers must be configured with two network adapters.


    Your configuration should look somewhat like the configuration screen shown in
    Figure 23.2. This screenshot is from VMware Workstation. For GSX Server'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'and ESX Server, your configuration may look different but you probably get
    the idea about the two network adapters.


    # Disable the “why do you shutdown your server?” dialog box.


    You are going to reboot your servers a few times during the entire setup. Therefore,
    you may want to turn off the feature that asks you (every time you shut down)
    why you are shutting down. To turn off this feature:


    Go to Start → Run type gpedit.msc, and Click OK. Next, open Local Computer Policy
    → Computer Configuration → Administrative Templates → System. Select Display Shutdown
    Event Tracker and disable it.


    ![](img/25fe75b93b97a021effaba85db112a52_220_0.png)


    Figure 23.3: For your convenience, disable the Shutdown Event Tracker.


    # 3. Rename and configure the second network adapter.


    After adding the second network adapter for the private network, rename the newly
    added adapter in your server to Private Network Adapter.


    Assign the IP Address that you have planned to use for the private network to
    this adapter.


    Note: Make sure that no default gateway is added to this network adapter on both
    servers. We do not want the cluster nodes to route traffic via the private network.'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'Next, configure the network adapter''s DNS and WINS configurations as displayed
    in Figures 23.4 and 23.5.


    ![](img/25fe75b93b97a021effaba85db112a52_221_0.png)


    Figure 23.4: Disable the checkbox for Register this connection''s addresses in
    DNS.


    ![](img/25fe75b93b97a021effaba85db112a52_221_1.png)


    Figure 23.5: Disable NETBIOS traffic via the Private Network.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# 4. Create the cluster user account.


    From the Active Directory Users and Computers application add a user to the Users
    container with the name of cluster.


    ![](img/25fe75b93b97a021effaba85db112a52_222_0.png)


    Figure 23.6: Add a user account to be used by the cluster software.


    Click Next after entering the user information, and in the Password settings window
    select User cannot change password and Password never expires.


    Assign a password to the user. The default requirements for passwords are:


    +   - Is not based on the user''s account name.

    +   - Contains at least six characters.

    +   - Contains characters from three of the following four categories:

    +     - Uppercase alphabet characters (A–Z)

    +     - Lowercase alphabet characters (a–z)

    +     - Arabic numerals (0–9)

    +     - Non-alphanumeric characters (for example, !$#,% )


    # 5. Add the newly created user as a member of the built in group Administrators.


    This will make the user a member of the Local administrators group on every node
    in the cluster. It is not necessary to add this user to the Domain Admins group.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '![](img/25fe75b93b97a021effaba85db112a52_223_0.png)


    Figure 23.7: Add the cluster user to the Administrators group.


    At this point you have prepared two servers in one domain to be used as cluster
    nodes in one of the three possible cluster scenarios.


    Tip: This may be a good time to secure these two servers by creating a ZIP file
    of them and storing them in a safe place. Or, you can just copy them to a safe
    location. As a minimum, you should create a snapshot of your virtual machines.
    This is not supported on VMware ESX Server, therefore you have to copy your configuration
    and virtual disk files to a safe location manually.


    # Where to go from here


    If your servers are up and running, continue with one of the following chapters
    to prepare your VMware environment for your Windows Server 2003 cluster:


    +   - Chapter 25: VMware Workstation

    +   - Chapter 26: VMware GSX Server

    +   - Chapter 27: VMware ESX Server'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# 24 Preparing for a NetWare 6.5 Cluster


    This chapter describes how to prepare for a cluster with two NetWare 6.5 servers
    and Novell Clustering Services Software. In addition, it describes the system
    requirements for your NetWare 6.5 cluster as well as the preparations steps that
    are required before getting started.


    Note: Novell shipped Open Enterprise Server (OES) in early 2005 to replace NetWare.
    OES comes in a Linux version and a NetWare version. In this chapter you will learn
    about building a NetWare cluster. Technically speaking, NetWare 6.5 with service
    pack 3 is identical to OES NetWare. The difference is in three available services:
    iManager 2.5, Virtual Office 1.5 and QuickFinder. The clustering part is identical
    for both operating systems.


    # Before Getting Started


    The software that you need to create the setup for any of the three clustering
    scenarios is of course VMware Workstation, VMware GSX Server, or VMware ESX Server.
    However, you will also need to have the NetWare 6.5 operating system. Your best
    option is to use the so called Service Pack Overlay CD-ROM, to install the server
    with an integrated Service Pack. You can find this software on the Novell Support
    website at http://support.novell.com by searching for NetWare Overlay in the Knowledge
    Base. You can also download the Open Enterprise Server NetWare ISO files. With
    these files you can install the same cluster as described here.


    Tip: You can download the ISO images and use them directly by assigning the ISO
    files to the virtual machines as the CD-ROM is to be used.


    # 24.1 Creating the Virtual Machines for your Cluster


    You can follow the normal procedures to create your virtual machines and install
    the NetWare Operating System. There are only a few things that you must change
    or be aware of in order to set up your cluster.


    First, we are going to use SCSI as our disk type for the shared disk clustering.
    Buslogic was the best choice for older NetWare versions, because of the driver
    availability. With OES and NetWare 6.5 service pack 3, you can select the LSI
    Logic SCSI type.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '![](img/25fe75b93b97a021effaba85db112a52_225_0.png)


    Figure 24.1: Select LSI Logic as the SCSI adapter type.


    VMware workstation contains either an LSI logic LSI53C10xx Ultra320 I/O Controller,
    or a Mylex (Buslogic) BT-958 compatible host bus adapter. We will use the LSIMPTNW.HAM
    driver for the LSI Logic adapter and the SCSIHD.CDM driver for the hard disk later
    on in this chapter, to use this hardware in the NetWare server.


    If you need to change the hardware platform for your SCSI adapter for existing
    virtual machines, you can edit the .vmx file for your disk and change the following
    lines accordingly:


    ```

    scsi0.virtualDev = "lsilogic"

    scsi0.virtualDev = "buslogic"

    ```


    Once you turn the power on for your virtual machine after changing this parameter,
    you will be asked if you want to change your virtual disk files (.VMDK) to be
    configured for the new adapter type.


    # 24.2 Install and Configure NetWare


    After creating the two virtual machines, you will install two NetWare servers
    in a single tree. Follow the normal procedures to install NetWare as described
    in the Novell on-line documentation.


    Make sure that your first server is fully installed, and that the security objects
    are created (Certificate Authority) before you add your second server to the tree.'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'After you install your first server, the best thing to do is to reboot, and
    check that everything is up and running so that you can access Remote Manager
    and iManager. For NetWare 6.5 these are available via the Web Manager at https://ipaddress:2200
    or at the individual URLs at: https://ipaddress:8009 and http://ipaddress/nps/iManager.
    (This last one is case-sensitive)


    Before continuing with the shared disk and clustering installation, make sure
    that the two servers that you have installed are communicating with each other
    and that you have the VMware tools installed.


    Tip: This may be a good time to secure these two servers by creating a ZIP file
    of them and storing them in a safe place. Or, you can just copy them to a safe
    location. As a minimum, you should create a snapshot of your virtual machines.
    This is not supported on VMware ESX Server, therefore there you have to copy your
    configuration and virtual disk files to a safe location manually.


    # Where to go from here


    When the two servers are up and running with NetWare 6.5, you can start preparing
    them for the shared disk access in one of the three following chapters:


    +   Chapter 25: VMware Workstation

    +   Chapter 26: VMware GSX Server

    +   Chapter 27: VMware ESX Server'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# 25 Shared Disk Cluster with VMware Workstation


    This chapter covers the installation of two virtual machines with a shared SCSI
    disk. It is in preparation for the installation of Novell Clustering Services
    or Microsoft Cluster Services software. This part is generic for NetWare and Windows.


    ⚠️ Note: With VMware Workstation 4.5, clustering with a shared disk was not made
    an option. It was not documented in any way by VMware, because clustering is not
    supported in that product (it is only supported in GSX Server and ESX Server).
    That is also the reason that I moved to iSCSI for the first edition of my VMware
    guide. In this new edition, you can learn how to set up a cluster with VMware
    Workstation version 5.


    # 25.1 Adding a Shared Disk to Virtual Machines


    After installing two NetWare servers into a tree, and configuring them with the
    VMware tools, it is now time to add a shared disk that will be used for clustering.


    💡 Tip: I prefer to use a separate disk as the Windows Quorum disk or for the NetWare
    Split Brain Detector partition, and a second shared disk for the data. With such
    a configuration, you have more flexibility to re-create the SBD partition, or
    to back up your VMware configuration.


    First, power down both servers and close the VMware application. It is always
    a bad idea to manually edit the .VMX files while the application is running.


    Open the .VMX files of both servers and add the following lines to the file:


    ```

    disk.locking = "false"

    diskLib.dataCacheMaxSize = "0"

    diskLib.dataCacheMaxReadAheadSize = "0"

    diskLib.dataCacheMinReadAheadSize = "0"

    diskLib.dataCachePageSize = "4096"

    diskLib.maxUnsyncedWrites = "0"

    ```


    It does not matter where in the file you add these lines. Save the .VMX files
    and open the virtual machine software without powering the machines on.


    On the first server, add a new virtual disk that will become the shared disk for
    clustering.'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'Follow these steps to perform this action:


    +   1. Open the virtual machine settings and click **Add** to add a new device.

    +   2. In the **Add Hardware Wizard** welcome screen, click Next.

    +   3. Select **Hard Disk** as the type of device and click Next.


    ![](img/25fe75b93b97a021effaba85db112a52_228_0.png)


    Figure 25.1: Add a new device to your virtual machine.


    ![](img/25fe75b93b97a021effaba85db112a52_228_1.png)


    Figure 25.2: Select to add a hard disk.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '4. In the Select a disk window select Create a new virtual disk and click Next.


    ![](img/25fe75b93b97a021effaba85db112a52_229_0.png)


    Figure 25.3: Create a new virtual disk.


    5. Change the default setting to SCSI and click Next (I always use SCSI for the
    shared disk so that it looks most like a real world clustering example and to
    make it easier distinguish between the server-IDE disks and the shared-SCSI-disk).


    ![](img/25fe75b93b97a021effaba85db112a52_229_1.png)


    Figure 19.4: Select SCSI as the disk type.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '6. In the Specify Disk Capacity window select the proper disk size.


    In the image below, you can see that I have selected a half gigabyte disk size.
    That is adequate for a small shared disk that can hold some data. Remember that
    we also have to enable the option Allocate all disk space now, so that a 500 Mb
    file will be created on your hard disk. Selecting a 10 Gb disk could take up excessive
    space on your workstation.


    Whether you need to split the disk file in two gigabyte files depends on your
    file system. FAT32 only supports files up to four gigabytes and traditional FAT
    supports two gigabyte files. For both of them, you need to split the files into
    two gigabyte chunks.


    ![](img/25fe75b93b97a021effaba85db112a52_230_0.png)


    Figure 19.5: Create a fixed size disk.


    7. You will be warned that creating a pre-allocated disk may take a long time.
    If you are prepared to create the disk that you have selected, select Yes.


    8. You can create your server in one directory together with this shared disk;
    however, I prefer to keep the configuration on separate directories because it
    provides a better overview.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '![](img/25fe75b93b97a021effaba85db112a52_231_0.png)


    Figure 19.6: Give the disk a descriptive name.


    +   9. Click Finish. The fixed sized disk will now be created.

    +   10. Close the configuration Control Panel for this virtual machine.

    +   11. Open the virtual machine configuration for your second server. Follow
    the same steps as the ones that you performed on your first server to start adding
    a new hard disk to your server (steps 1, 2, and 3).

    +   12. In the Select a Disk window, select Use an existing virtual disk.


    ![](img/25fe75b93b97a021effaba85db112a52_231_1.png)


    Figure 19.7: In the second machine select the disk you have just created.'
