- pgno: 184
  md: '# 15 Introduction to Physical to Virtual Conversion


    In this chapter, I will introduce the fine art of physical to virtual conversion
    (P2V). Where VMware software impresses people who use it, P2V really astonishes
    them. The day starts out with 10 servers lined up in the server room and ends
    with only one machine neatly stacked in a rack. Or, their five server production
    environment is copied into a one hardware box virtual machine setup in one evening.


    This chapter introduces P2V in general. The next chapters will go into more detail
    on how to perform conversions with several different products and for several
    different operating systems.


    # 15.1 P2V Conversion Usage Scenarios


    Working with virtual machines makes it very simple to test new software for your
    environment. Whether it is a new version of an end-user application or a service
    pack for your server, you can test it in a virtual machine before you put it into
    production. But would it not be nice if you could test all of this on an exact
    copy of your production environment? Of course you can create a traditional test
    environment on physical hardware and restore servers from tape, or copy the files
    during a nightly operation. With the process of physical to virtual conversion,
    this becomes much easier. Basically, you will copy your machines into virtual
    machines on one box, and you will have exactly the same environment and test results
    as you would have in your production environment.


    Note: There are two limitations to this. When hardware specific applications are
    involved, the software will operate differently with the hardware in the virtual
    machine. And when you want to test the performance with a new application, it
    could also behave differently in VMware.


    Other uses of VMware technology include consolidating servers into one single
    hardware box running VMware GSX Server or ESX Server. To get to this point, you
    can also use physical to virtual conversion. You move your machines into VMware
    and power off your old hardware. It is as simple as that.


    But how do you get there? What is the easiest way to copy all the data from a
    real computer to a virtual computer? The next section describes what methods are
    available. The rest of this section explains how to use low cost tools that you
    may even already own, to convert physical machines into virtual machines.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# 15.2 Methods for Physical to Virtual Conversion


    There are applications available that can perform the physical to virtual conversion
    for you. The methods they provide are very simple, and reduce a lot of the complexity
    from converting operating systems across hardware.


    VMware itself has a P2V tool that works with VMware ESX Server. It converts Windows
    PCs into virtual machines. The current version at the time of writing this book
    is version 2. With P2V Assistant, physical machines can be converted into virtual
    machines for VMware Workstation, GSX Server, and ESX Server. It can also be used
    for migrating virtual machines to other virtual machines. As an example, it can
    be used to transfer a machine with an IDE drive to a new one with a SCSI drive.


    VMware P2V Assistant www.vmware.com/products/vtools


    There are two, third party vendors that also have a P2V solution:


    +   - Leostream www.leostream.com

    +   - Platespin www.platespin.com


    So, as you can see, there are tools available that can make the job easier. Why
    bother going through the process of converting machines manually with the solutions
    described in this book? It is simple. This part has been created to get you started
    with low cost tools, because the tools described before are not really low cost.


    It all depends on your physical to virtual conversion requirements. When you have
    to perform multiple conversions on a regular basis, you are always better off
    with any of the supported tools that you can buy.


    Converting the occasional server or workstation into a virtual machine is something
    that you can do with the methods described in the next parts. Another reason for
    this is that you may need to convert a non-supported operating system in any of
    the tools to a virtual machine. NetWare is an example that is discussed later,
    because it is not supported by any vendor at the time of writing this book.


    Some vendors support Linux but not all of its distributions. Platespin, for example,
    is the only one that supports Linux at this time but it only supports RedHat Linux.
    By following the procedures explained in the next chapters, you can convert Linux
    machines without buying any additional software or by using generally available
    imaging software.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# 15.3 The Low Cost Approach of P2V Conversion


    During the last few years, I have performed many conversions to move physical
    machines into virtual machines. The actual technique is simple, but the complexity
    is in the operating system. Windows is especially not an operating system that
    can easily be transferred from one hardware platform to another.


    # Imaging software


    The software that I will introduce in this part for P2V conversion is regular
    imaging software that you may already own. I will also use tools and commands
    that are standard in all Linux distributions. The skills that you need for P2V,
    especially with Windows, are the skills that you would also need to have for normal
    imaging operations between different hardware platforms.


    With imaging software, you copy a hard disk to another hard disk (mostly in another
    PC) directly via the network or via an image file to create a copy of a PC. This
    is a very common technology that is being used for deploying new PCs. The problem
    with imaging is mainly the difference in hardware on the source PC and the destination
    PC. Different network and video drivers, another hard disk type (IDE or SCSI),
    as well as many other differences in hardware can result in you not being able
    to load the imaged operating system on the destination PC. And not surprisingly,
    all available PCs contain other hardware than those on your virtual machines.


    Whether you encounter problems with your P2V conversion depends on the operating
    system that you are converting. NetWare, for example, is a very imaging-friendly
    operating system. This is because it starts the kernel and if the configured hardware
    (storage adapter or ACPI support) is not found, it just does not load the driver.
    It stops at the server console, and allows you to copy the correct drivers to
    the server, and adds them to the server startup files. For Windows, the process
    is more complex, because if the Hardware Abstraction Layer is different, Windows
    generates a stop-error and ends with a blue screen. This is also something we
    can overcome. You will learn how to do this in chapter 21.


    There are two methods to be used: P2V via an image file or P2V via the network.
    They both have their advantages and disadvantages.


    # P2V via an image file


    To use this method, you need to create an image file from your PC and store it
    somewhere. From that location, you should add the file into a virtual hard disk
    file and restore the image inside your virtual machine. The advantage is that
    it works with all imaging software because they all support image files. However,
    they do not all support imaging via the network. The disadvantage is that you
    may need a lot of disk space if your PC contains a lot of data. Storing a 50 GB
    image file, copying it into a virtual hard disk, and restoring it to another virtual
    destination hard disk requires 150 GB of available storage. This is three times
    the amount that you have available on your physical machine.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# P2V across the network


    With this method, a PC sends its data directly into a virtual machine via TCP/IP,
    where it is restored to the destination hard disk. There is no need for temporary
    storage with this method. Another advantage to this method is that it saves time
    because you do not have to take an image first and restore it later. It all happens
    at the same time. The disadvantage is that not all imaging applications support
    this kind of so called peer-to-peer or multicast operations. Symantec Ghost supports
    this peer-to-peer feature as does Portlock Storage Manager, but the latter is
    only available for NetWare.


    # General tip on P2V conversions


    Whatever method you will be using, it may be useful to split any partitions that
    you have on the physical computer, into partitions that are divided into separate
    virtual disk files in your virtual machine. I have added Figure 15.1 to clarify
    this.


    ![](img/25fe75b93b97a021effaba85db112a52_187_0.png)


    Figure 15.1: Keep the system and data separate for easier conversions.


    In this example the system partition, which is not too large, is imaged with a
    P2V tool. This makes the P2V process fast and simple. The data could be copied
    via the network later, depending on the OS you are running, and whether you can
    have both servers up and running in the same network.


    Tip: Another benefit of this approach is that the data is now on a separate disk.
    This makes it more flexible; for example, by updating the operating system with
    a service pack it will not affect the data. It also allows you to use the Snapshot
    feature to revert to a previous version, without doing that for the data disk
    which you can set to independent mode.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# Where to go from here


    The remaining section will discuss several methods of performing physical to virtual
    conversions.


    Methods that work via the network are described in the following chapters:


    +   - Chapter 16: “Symantec Ghost’s Peer-to-Peer imaging”

    +   - Chapter 17: “Other peer-to-peer or multicast networking solutions”

    +   - Chapter 18: “Using Acronis True Image file based imaging via the network”

    +   - Chapter 20: “Imaging the Really Cheap Way”


    A method of using disk access only is described in chapter 19: “Create a virtual
    disk from an image file (for any imaging application)”


    Whatever method you choose to copy the data and whatever operating system you
    transfer, you will have to make modifications to your destination virtual machine.
    This is described for Windows, Linux and NetWare in chapter 21: “Modify your restored
    operating system to work with VMware”.


    # Tip: Virtual to Physical and Virtual to Virtual conversions


    All the methods described here are not only useable for P2V conversions. Transferring
    an operating system running in a virtual machine to a physical machine, or from
    one virtual machine into another virtual machine, can be done with the same procedures
    described in this part of the book.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# 16 Symantec Ghost’s Peer-to-Peer Imaging


    The simplest and fastest approach is to send the image directly from the source
    PC to the destination virtual machine or from one virtual machine into another
    virtual machine. This direct approach requires no extra storage for image files.
    This is extremely useful when imaging large hard disks into VMware. And, you can
    also use it to migrate a virtual machine from VMware Workstation into a VMware
    ESX Server virtual machine.


    Note: If you own a copy of the first edition of my VMware guide, you may remember
    reading that I sometimes experienced problems with CPU hogging and network packet
    loss, while using Norton Ghost inside a virtual machine. I am happy to report
    that this is no longer an issue with VMware Workstation version 5. However, you
    can still run into performance problems with VMware Workstation 4.x.


    # 16.1 Creating the Ghost Boot Disk for VMware


    You will need to start your virtual machine that you want to use as a target with
    a Ghost boot floppy. Using Ghost 2003, you need to follow this procedure to create
    the boot floppy that holds the AMD network adapter that VMware uses. It is based
    on the default Ghost procedure. If you want to create your own boot disks, use
    the web sites listed in section 7.1: “Working with Virtual Floppy disks”.


    +   1. The first step is to create a virtual floppy:

    +      - You can create a physical floppy which you can also connect to your virtual
    machine. This will work if you have installed Ghost on your Windows Host PC. If
    you want to create a virtual floppy image from your physical disk to use with
    your virtual machine, you can do that with WinImage as described in section 7.1:
    “Working with Virtual Floppy disks”.

    +      - Another method is to use the Virtual Floppy Driver, which allows you
    to mount a virtual floppy in Windows. You can create the Norton Ghost boot disk
    directly into the mounted virtual floppy. How to use this tool is described in
    section 7.1: “Working with Virtual Floppy disks”.

    +      - You can also run Ghost from a Windows virtual machine, and directly create
    the virtual floppy from the version of Ghost installed in that machine. In that
    case, you either need to create a virtual floppy yourself from a virtual machine
    or download VirtualFloppy.zip from www.robbastiaansen.nl.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '2. In Norton Ghost 2003, select the Ghost Utilities and click Norton Ghost
    Boot Wizard


    ![](img/25fe75b93b97a021effaba85db112a52_190_0.png)


    Figure 16.1: Create a boot floppy with the Norton Ghost Boot Wizard.


    3. From the Norton Ghost Boot Wizard, select the Peer-to-Peer Network Boot Disk.


    4. In the list of Network Interface Cards, select the AMD PCNet Family adapter
    and click Next.


    ![](img/25fe75b93b97a021effaba85db112a52_190_1.png)


