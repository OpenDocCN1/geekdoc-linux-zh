- pgno: 94
  md: '# 6 General VMware Configuration and Tips


    This chapter covers configuration settings and tips that are useful for all VMware
    technology users, who use VMware Workstation, GSX Server, or ESX Server. It will
    help you regardless of the host or guest operating systems you are using: Windows
    or Linux. The first section will point you in the direction of documentation and
    support, while the rest of the chapter will cover a collection of useful tips,
    tricks, and directions.


    # 6.1 Documentation and Support


    If you are new to VMware, I strongly advise you to download the official VMware
    Workstation, GSX Server, or ESX Server manual and go through the one that pertains
    to you before you start deploying your VMware solution. The VMware people have
    done a very good job of describing how to get started with creating virtual machines.
    They describe how to install guest operating systems, the accompanying tools,
    and much more.


    # VMware Technology Network


    All official VMware resources on the web are now bundled in the VMware Technology
    Network (VM TN). This is a service that is available anonymously on the Internet
    for free. It is also possible to buy a subscription to VM TN. This is a service
    that was created for developers and provides a powerful suite of VMware products,
    support, and upgrades for a convenient, low-cost annual subscription.


    The VM TN subscription includes licenses for Workstation, GSX Server, ESX Server
    with Virtual SMP, and P2V Assistant (Enterprise Edition). GSX Server, ESX Server,
    and Virtual SMP licenses are for two-processor servers. The VM TN subscription
    is designed and licensed for development use with only some licensing restrictions
    on ESX Server. Please review the terms for VM TN subscription licenses and support
    at www.vmware.com/vmtn_eula.


    VM TN subscription privileges include web-based support and product upgrades.
    Each subscriber has access to VM TN community and technical resources plus two
    web-based support requests with VMware''s support experts. The annual cost for
    a VM TN subscription is USD 299. An optional media kit with CD-ROMs and documentation
    costs USD 99 (prices are as of September 2005).


    # Online documentation


    Access to the documentation is provided via VMware support website at www.vmware.com/support/pubs.
    You can access the online documentation for each product in HTML format or download
    the entire manual in PDF format.


    If you need support beyond the documentation, you can use one of the following
    four official sources:'
  merge: -1
  img_proc: true
