- pgno: 192
  md: '# 16.2 Starting the Master Computer


    The computer that holds your current operating system which you want to image
    to a virtual machine, can be started with the same kind of floppy disk that you
    have created in the previous paragraph. The difference with your slave floppy
    is that your master PC will most likely have a different network adapter. However,
    you can also start Ghost automatically without creating a boot floppy. You can
    do this by selecting Peer-to-Peer from the Ghost Advanced Menu option.


    ![](img/25fe75b93b97a021effaba85db112a52_192_0.png)


    Figure 16.4: Ghost can be started without a floppy for the master computer.


    The information that you need to provide is similar to those which you used when
    you created the boot disk for your slave. Therefore, I am assuming that you do
    not need any additional instructions.


    Tip: If your network adapter is not automatically detected and it is not listed,
    you can add the driver for your NIC from the Network Interface Card selection
    screen. Make sure that you download the NDIS2 driver for your network card to
    add it to the list. Also, make sure that you enter the correct parameters for
    the PROTOCOL.INI to the parameters window, while adding your custom driver.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# 16.3 Performing the Imaging Operation


    When you reboot the master PC into ghost, and you have booted the VMware guest
    with the Ghost boot disk, you can start the peer-to-peer session. If the TCP/IP
    stack is successfully initialized, the peer-to-peer menu option will be available.
    Select Peer-to-peer → TCP/IP → Slave to start the session on the slave computer.


    ![](img/25fe75b93b97a021effaba85db112a52_193_0.png)


    Figure 16.5: Start a Peer-to-Peer operation on the slave computer.


    The slave will start connecting to a master. In the Slave Connect screen, the
    TCP/IP address of this slave is displayed. You must specify this address in the
    master computer.


    ![](img/25fe75b93b97a021effaba85db112a52_193_1.png)


    Figure 16.6: The slave will display a message with its IP address to be specified
    in the master.


    On the master computer, select Peer-to-peer → TCP/IP → Master to start the imaging
    session. You will be asked for the slave''s IP address. When the master connects
    to the slave, the slave computer will display a message that it is connected.
    The master will return to the original menu where you can select your imaging
    operation (disk to disk, or a single partition). The easiest conversion can be
    accomplished by selecting the disk-to-disk option to copy the entire PC into the
    virtual machine. However, you can also do this on a partition level.


    # Where to go from here


    Depending on the operating system you are restoring, you may need to modify drivers,
    etc. This is explained in detail in chapter 21: “Modify your restored operating
    system to work with VMware”.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# 17 Other Peer-to-Peer or Multicast Networking Solutions


    Norton Ghost is a widely available imaging tool which I have selected to discuss
    this topic in the previous chapter. There are other products available that I
    would like to briefly mention.


    # Portlock Storage Manager


    This application is very often used in NetWare environments, but it is multi functional.
    Storage Manager supports NetWare''s NSS file system but it also supports FAT,
    NTFS, EXT2, EXT3, and ReiserFS. The application supports local imaging operations
    from hard disks and removable media, such as writable CDs and DVDs, as well as
    networking imaging operations via TCP/IP networking.


    For the NetWare environment, this is the best tool to use because it supports
    the NSS file system, which allows it to image specific volumes from your server.
    Another benefit is that it uses the normal LAN and storage drivers from NetWare,
    because the application runs as an NLM. For your virtual machine target, you will
    have to use a DOS floppy with the NetWare TCP/IP stack. A virtual floppy disk
    with DOS, LAN drivers and TCP/IP stack is available for download at: www.robbastiaansen.nl.


    More information on Portlock Storage Manager is available at: www.portlocksoftware.com


    # Novell ZENworks imaging


    Many users with a Novell NetWare environment also own the Novell ZENworks for
    desktop products. It contains an imaging component which supports the Windows
    file systems. It can be used for imaging operations to and from an imaging server,
    but you can also perform peer-to-peer imaging, by setting one workstation as a
    multicast master, and another one as a multicast slave.


    # Altiris Client Management Suite


    This management suite is very popular for workstation management and also contains
    peer-to-peer imaging functionality.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# 18 Using Acronis True Image File Based Imaging via the Network


    The Symantec Ghost peer-to-peer option described in the previous chapter is the
    easiest one to use because it sends the image to another computer directly. This
    solution will not always work, either because of limitations of Ghost which I
    have explained in the peer-to-peer section or because of limitations in the network
    bandwidth. However, you can, store an image file directly on a server volume or
    another PC with Acronis True Image. This allows you to restore that image file
    from that location, or you can copy the image to another location. An advantage
    of this approach is that you can use the image file multiple times, where the
    peer-to-peer imaging operation is a one time action.


    I have decided to use the True Image software from Acronis, because this software
    can create images from within Windows and they also provide a very powerful restore
    CD.


    Note: For Windows Server products, you will need a server version of Acronis True
    Image. The server version is more expensive than the regular workstation version.
    It is not only Acronis that has a special server version. Symantec also sells
    a specific server version of their DriveImage software. For Linux, you will need
    the True Image Server for Linux software if you want to run the imaging software
    on a running Linux box. With the restore CD, you can create images of any machine
    when you reboot it with that CD.


    There are two approaches for creating an image with True Image. The first one
    is to install the full Acronis application in your Windows or Linux environment.
    The second is to boot the machine with the True Image rescue CD in order to perform
    the operation from outside the regular operating system.


    When you use the first option, you actually create an image from the running operating
    system. That contradicts with all other approaches to imaging up until now, when
    we needed to create an image of a machine with a shut down operating system. So,
    is it safe to execute an imaging operation on a running server?


    I have added the following piece of text from the Acronis support pages to shed
    some light on this issue:


    > I have complex applications such as Microsoft SQL Server, Oracle or Microsoft
    Exchange running on my server. I plan to create an image, but I''m not sure if
    these applications can be running during the imaging process. What should I do?'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'Although Acronis True Image 8.0 Server for Windows takes care of hard disk
    and filesystem-level consistency via snapshot technology, it could not guarantee
    application-level consistency. We recommend you to suspend complex servers such
    as Microsoft SQL, Oracle or Microsoft Exchange before pressing the Proceed button
    on the last page of the Acronis True Image 8.0 Server for Windows Create Image
    wizard, or before starting a scheduled task. Once the imaging process starts,
    you can resume server operations. It is not necessary to suspend the applications
    for the duration of the imaging process.


    As you can read in the previous text, it is safe to execute an imaging operation
    from a running Windows host. But is it wise? What will happen to the disk and
    network performance when all regular tasks are running and you pull an image off
    the server? It all depends on the load of your server, but I suggest that you
    create the image when no other users are working with the server or at least during
    off-peak hours.


    Note: Running the imaging operation with no users attached, is especially important
    if you are migrating a server into a virtual environment permanently. Once the
    imaging has been completed, nothing that goes into the physical machine will ever
    be added to the virtual machine.


    # 18.1 Creating the Image


    You can start the imaging in two ways, as explained earlier. You can either start
    with the True Image rescue CD or install the application on your Windows or Linux
    host. When you install the application, you will be prompted to create the Rescue
    Media (see Figure 18.1). With that CD-ROM or a set of floppies, you can boot your
    PCs or virtual machines to create images or restore them.


    Tip: To use the rescue CD-ROM inside a virtual machine, it is best to use an ISO-file.
    How to create an ISO file from a CD-ROM is explained in detail in chapter 7.


    To create the image, start the application or boot your computer with the Rescue
    Media. Once you see the main application screen with the option Create Image,
    all the steps are identical to what follows, no matter how you get to this point.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '![](img/25fe75b93b97a021effaba85db112a52_197_0.png)


    The Acronis software lets you create the Rescue Media during installation or after
    that, when you select Tools → Create Bootable Rescue Media. It depends on the
