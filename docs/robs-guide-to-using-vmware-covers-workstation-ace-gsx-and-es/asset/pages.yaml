- pgno: 142
  md: '# 11 Networking Configurations


    A lot of people have been asking me questions such as how to access virtual machines
    from a LAN, or how to set up routing within a host to route between multiple virtual
    networks. In this chapter, I will discuss a few common scenarios that will give
    you a feel for what the possibilities are. I will start out with the basics on
    host-only and bridged networking to make sure everyone understands what networking
    options VMware has to offer.


    # 11.1 Network Adapters in VMware


    First of all, you need to understand the correct terminology. A bridged adapter
    is a physical network adapter in your host PC which allows your virtual machines
    to communicate with the physical Ethernet Network. A host-only adapter is a virtual
    adapter, that shows up in the list of adapters in Network Settings but it does
    not have any relationship with any of the physical adapters in your computer.
    The default setup of a VMware Workstation installation is that you have VMnet1
    for a normal host-only network and VMnet8 for a host-only network, using NAT to
    access the physical LAN. Figure 11.1 shows a typical network environment on a
    Windows host PC.


    ![](img/25fe75b93b97a021effaba85db112a52_142_0.png)


    Figure 11.1: VMware adds two network adapters, VMnet1, and VMnet8 by default.


    # 11.2 Configure Host-Only and Bridged Networking


    Bridged networking is set up by default. You can view or edit the bridged networking
    settings by selecting Edit → Virtual Network Settings. This opens the Virtual
    Network Editor. In the summary screen you get an overview of the configured VMware
    networks. By default, the checkbox Automatically choose an available physical
    network adapter to bridge to VMnet0 is enabled.'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'You find this on the Automatic Bridging tab. Click the Host Virtual Network
    Mapping tab (see Figure 11.2) to set up a network configuration manually.


    ![](img/25fe75b93b97a021effaba85db112a52_143_0.png)


    Figure 11.2: Bridged networking is set up by default.


    Selecting a Bridged Network adapter will manually disable the automatic bridging
    process. With VMware workstation, you can bridge more than one physical adapter
    and assign them to different machines with the VMnet networks. An example of this
    is that when I deliver trainings, I use my built-in network adapter in my laptop
    to connect to the classroom network with a classroom virtual server, and I use
    a PC-card adapter to connect the other virtual machines to the Internet.


    **Tip:** Physical adapters that were not enabled on the host PC when the VMware
    application was loaded are not displayed in the Virtual Network Editor. If for
    example, the wireless network adapter was not enabled, it would not show up in
    the list of available adapters. This is the case even after enabling it when VMware
    is already running. After enabling an adapter, close VMware and open it again
    to display the adapter in the Available Network Adapters drop down list.


    # Setup extra host-only network adapters


    With the Virtual Network Editor, you can modify the configuration of your virtual
    host-only networks. It allows you to add network adapters to you host PC in the
    Host Virtual Adapters tab. You need this extra adapter if your host operating
    system needs to communicate with the guest. When two guests will communicate via
    a host-only network (let''s say VMnet6) without the host being involved, then
    no virtual network adapter in the host PC is required.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# 11.3 Host-Only Network DHCP Configuration


    The host-only adapter in your PC and the virtual machines that are assigned to
    the host-only network (VMnet1 by default) communicate via this virtual network
    inside your host PC. The virtual machines can be configured with static IP addresses,
    or via the DHCP service available for the host-only network.


    To configure the DHCP Service on a Windows host, select Edit → Virtual Network
    Settings and select the DHCP tab (see Figure 11.3)


    ![](img/25fe75b93b97a021effaba85db112a52_144_0.png)


    Configured DHCP ranges for the host-only network adapters, as well as the status
    of the DHCP service are displayed. Click the Add new button to create a new address
    range for a virtual host-only network. This will not automatically create the
    virtual network adapter in the host PC. Creating a new adapter, however, will
    create a DHCP range.


    Figure 11.3: DHCP can be configured for host-only adapters.


    The properties page of a DHCP address range allows you to modify the addresses
    being used for your virtual machines. By default, the address range starts at
    address .128 and ends with .254


    In the properties page, you can also set up the lease duration for your virtual
    machines. The default is set to 30 minutes with a maximum lease time of 2 hours.


    ![](img/25fe75b93b97a021effaba85db112a52_144_1.png)


    Figure 11.4: Default DHCP address range and lease duration.'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'On a Windows host, the DHCP configuration is stored in a text file called vmnetdhcp.conf
    located at C:\Documents and Settings\All Users\Application Data\VMware. DHCP leases
    are stored in a file in the same directory with the name vmnetdhcp.leases. On
    a Linux host, the configuration is stored in a file called dhcpc.conf which is
    located in a subdirectory dhcpd in the virtual network adapter configuration directory
    in /etc/vmware. For a default installation, this is /etc/vmware/vmnet1/dhcpd.
    For a Linux host, the host-only DHCP configuration can be modified by editing
    this file.


    Note: Before modifying a configuration file, always make a backup copy.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# 11.4 Using NAT to Connect Virtual Machines to the Network


    Bridged networking is one of the simplest methods to connect virtual machines
    to the network. However, sometimes you can not use this method because you do
    not have enough addresses available on the network or because security issues
    do not allow you to connect new PCs directly to the network. In that case, you
    can use Network Address Translation to connect your virtual machines to the network.


    # What is NAT?


    With NAT, your virtual machine will send its TCP/IP packets to the NAT service
    on the host PC. This service will change the source IP address into its own IP
    address which it uses on the local network, and sends out the packets to the destination.
    When the packets are received back from the destination, the NAT service will
    use its translation table to send the TCP/IP packet to the correct virtual machine.
    This way, your virtual machines can all use their own IP addresses internally
    and all the traffic they send onto the network looks as if it comes from the host
    PC.


    # Configuring NAT


    To set up NAT for your virtual machines, open the Virtual Network Editor via Edit
    → Preferences and click on the NAT tab.


    If the service is disabled, the VMnet host drop down box will show Disabled. Set
    this to the host-only network where you want to enable NAT. The default virtual
    network for this is VMnet8.


    ![](img/25fe75b93b97a021effaba85db112a52_146_0.png)


    Figure 11.5: Nat is configured on VMnet8 by default.'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'Enabling NAT does not automatically start the VMware NAT Service. This service
    is started when you click Apply or Ok to activate the NAT configuration.


    This is the easiest way to set up NAT because you don''t have to configure IP
    addresses on your virtual machines. The NAT DHCP configuration is accessible from
    the DHCP configuration tab. DHCP is discussed in the previous paragraph.


    ![](img/25fe75b93b97a021effaba85db112a52_147_0.png)


    Figure 11.6: DHCP can be enabled for the NAT configuration.


    Note: Using DHCP is not practical when using port mappings, which is discussed
    later. It is not required, but having fixed addresses guarantees mapping the same
    virtual machine every time.


    After enabling NAT, point your virtual machine''s network interface to the NAT
    networking configuration, or to the custom NAT network that you have configured
    (something other than VMnet8). Your machines will now be able to access the network
    via the NAT service on your host computer. They will use that host as a DNS server.
    The NAT service works as a DNS proxy for DNS requests from within the guest operating
    system.


    On a Windows host, the configuration of the NAT service is stored in a text file
    called vmnetnat.conf located at C:\Documents and Settings\All Users\Application
    Data\VMware. On a Linux host, the NAT configuration is stored in a file called
    nat.conf which is located in a subdirectory nat in the virtual network adapter
    configuration directory in /etc/vmware. For a default installation, this is /etc/vmware/vmnet8/nat.
    For a Linux host, the host-only NAT configuration can be modified by editing this
    file.


    Note: Always make a backup copy before modifying a configuration file.


    # Using port mappings to access virtual machines from the LAN


    With a Network Address Translation configuration, your virtual machines will use
    an internal IP address within the host, which is not available on the local network.
    This means that PCs on the LAN can not directly communicate with services that
    are running in your virtual machine. This can be all kinds of TCP/IP services,
    or other services such as Windows file sharing or printing.


    PCs on the local network can only send packets to the host PC''s IP address, because
    that is the address used for all virtual machines behind the NAT configuration.
    In the example shown in Figure 11.7, a PC sends packets to the host''s IP address
    (to port 80) to access a Web Server, but the host is not running a'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'Web Server. Therefore, the sender will receive a message informing him or her
    that service is not available.


    ![](img/25fe75b93b97a021effaba85db112a52_148_0.png)


    Figure 11.7: Without NAT, the virtual machines can not be accessed.


    With port mappings, you can build a configuration where the packets received for
    a specific port can be sent to the correct virtual machine when they are received
    on the host''s ''outside'' network adapter. In the previous example, configuring
    the NAT service to forward all incoming traffic at address 192.168.1.1 for port
    80 to 192.168.244.128 effectively let''s the PC on the local network communicate
    with the http service running on the virtual machine. The sender could think that
    the web server is at address 192.168.1.1, while it is actually on the virtual
    machine''s address at 192.168.244.128


    Figure 11.7 also shows the host-only network adapter for VMnet8. This adapter
    is being used by the host operating system to communicate with the guest operating
    system, in much the same way as you would normally use a host-only network.


    To set up this configuration on a Windows host, click the Edit button on the NAT
    tab of the Virtual Network Editor. In the NAT Settings window, click the Port
    Forwarding button to define port mappings.


    You can choose between TCP or UDP port mappings. Make sure to set up the correct
    type of traffic for your service. In the Port forwarding screen, click Add in
    the TCP or UDP chapter.'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'This will bring up a mapping configuration dialog box. In the example in Figure
    11.8, all incoming traffic for port TCP 80 is forwarded to address 192.168.244.128.


    ![](img/25fe75b93b97a021effaba85db112a52_149_0.png)


    Figure 11.8: Individual ports can be forwarded.


    For a Linux host, port forwarding must be configured in the nat.conf file in /etc/vmware/vmnet8/nat.
    Here is an example of how to map incoming TCP port 80 to a virtual machine with
    IP address 192.168.2.10:


    ```

    [incomingtcp]

    80 = 192.168.2.10:80

    ```


    For a UDP port mapping, enter the configuration entry under the [incomingudp]
    header.


    # Use static addresses, no DHCP


    With these port mappings, you have to specify an IP address where the packets
    need to be sent. It is better to use statically assigned IP addresses for your
    virtual machines, instead of dynamically assigned ones via DHCP. If the addresses
    change the port mapping will point to the wrong or a non-existent server.


    With many DHCP servers, you could still assign an IP address based on the MAC
    address of the machine. You can not do this with the VMware DHCP service.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# 11.5 Routing to and from the LAN


    If you are running your virtual machine in a bridged mode, there is no routing
    involved to access the LAN. They are part of the network, just as any other real
    PC with their own MAC-address and IP address. Your host and guests are able to
    communicate with each other, and any PC on the network can access your virtual
    machine. This is the easiest setup used to access virtual machines from the real
    world.


    If you want to set up routing, for example because you need another subnet for
    your virtual environment, or if you just want to test routed configurations, you
    have various options. You can do that by using a Windows 2000 Server, Windows
    Server 2003, or a Linux host PC to create a router between the LAN and the virtual
    environment.


    Note: Only do this after consulting your network administrator, if you are taking
    part of a larger network where adding routers could have serious implications.
    Also be ware that any domain controllers etc. that you run in your virtual environment
    will show up on the LAN, depending on how you configure your router. This could
    cause unwanted results for other administrators or users of the network.


    Figure 11.9 shows an example of a routing configuration, where the host PC’s operating
    system contains routing software to route from the Local Area Network into the
    virtual host-only network.


    ![](img/25fe75b93b97a021effaba85db112a52_150_0.png)


    Figure 11.9: A configuration with routing set up on the host PC.


    The IP addresses in this example are chosen for two private networks (192.168.1.0
    and 10.0.0.0). For your configuration, you can choose the networks that are available
    in your environment.


    Tip: I have seen a lot of people having problems with accessing virtual machines
    and the LAN, when they started configuring their physical and virtual adapters.
    It is very important to make sure that all adapters (physical, including wireless,
    VMnet1 and VMnet8) are in different IP subnets. A real PC with two network adapters
    on different Ethernet segments but with the same IP subnet used on both LAN’s,
    would not know where to send its packets.


    Compare it to a junction with two signs pointing to Paris. You would also be confused
    about what direction to choose; unless they both point to Rome, of'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'course, since as everyone knows, all roads lead to Rome!, A PC with a physical
    adapter and/or more virtual adapters that would be configured for the same subnet
    will have the same problem and will prevent you from accessing hosts on either
    the physical or virtual network.


    # 11.6 Routing Between Virtual Machines


    In the previous section, I discussed how to set up routing from the LAN to your
    virtual machines. One scenario in which to use that is when you want to test access
    from machines in your production network into a virtual test environment. There
    may also be scenarios where it is unwanted or not needed to have an extra router
    on the physical network. This is why it is useful to create a set of virtual networks
    that can communicate only within the host where the network traffic never leaves
    the host machine.


    You can build this scenario to be as complex as you want. You can run a router
    within the host operating system which routes between two virtual networks. Or,
    you can run a router in a virtual machine that will take care of the routing between
    the virtual networks. For both configurations, you will need extra host-only network
    adapters. But first, let’s take a look at what these configurations look like.
    Again, I have chosen IP addresses in private network ranges which you will need
    to change to the appropriate addresses in your own environment.


    ![](img/25fe75b93b97a021effaba85db112a52_151_0.png)


    Figure 11.10: Routing between virtual networks with host-OS routing.


    First, let’s take a look at the simplest approach in Figure 11.10. This is where
    the host operating system uses two virtual network adapters, and each virtual
    machine is in a different host-only subnet. You can see that I have configured
    three subnets in this example. The physical network adapter is part of the Local
    Area Network, but it is not used by any of the virtual machines. So, there is
    no traffic going to the physical network which can interfere with anything. And
    there will be no extra routers showing up on the network either.


    In this example, I am still using the host operating system to do the routing
    (Windows Server or Linux). This router forwards the packets between the 10.0.0.0
    and 172.16.0.0 subnets. For this to work, you must add a second VMnet2 host-only
    adapter. The next section explains how to do this.'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'Also, don’t forget to assign the second VMnet2 host-only adapter to virtual
    machine 2 (as it is called in Figure 11.10). You can do that by entering the virtual
    machines configuration: VM → Settings. Select the NIC and select a Custom network
    to be used in this virtual machine.


    ![](img/25fe75b93b97a021effaba85db112a52_152_0.png)


    Figure 11.11: Configuring the custom adapter to VMnet2.


    Now, let’s take a look at another possible scenario to set up routing between
    two virtual machines. Take some time to absorb Figure 11.12.


    ![](img/25fe75b93b97a021effaba85db112a52_152_1.png)


    Figure 11.12: Routing with guest-OS routing software.'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'In this example, I have added a third virtual machine to the host PC. The host
    operating system again has a physical adapter which is not being used and two
    virtual host-only adapters (VMnet1 and VMnet2). The host operating system can
    still access the two virtual networks. But there is no routing software loaded
    on the host.


    This time the routing is performed by the new virtual machine. The guest OS in
    this machine (Windows, NetWare, or Linux) has two network adapters that are both
    in a different virtual host-only network. The guest OS takes care of the routing
    between the 10.0.0.0 and 172.16.0.0 subnets.


    Is this not complex enough for you? If you answered “No”, take a look at Figure
    11.13 and use your imagination as to what is happening there, and how far you
    could go with a maximum of nine virtual host-only networks.


    ![](img/25fe75b93b97a021effaba85db112a52_153_0.png)


    Figure 11.13: A routing configuration can be as complex as you want it to be.


    # Adding a second host-only adapter


    If you want to set up one of the two routing examples explained here, you need
    to add a second host-only network adapter to you host-PC.


    > Tip: If there is no need for your host operating system to interact with the
    host-only virtual machines, then you don’t have to add a second virtual host-only
    adapter to your host. In other words, your virtual machines can both be configured
    to operate on VMnet6 and communicate with each other without adding a VMnet6 network
    adapter to your host PC.


    # On a Windows host


    To add an adapter to your host PC in VMware Workstation, open Edit → Virtual Network
    Settings. Select the Host Virtual Adapters tab. Click the Add new adapter button.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# Virtual Network Editor


