- pgno: 40
  md: 'The maximum amount of memory for any virtual machine is 3584 MB. If you do
    not have this amount of RAM in your host PC, then it is useless to select this
    amount of memory. Do not set the memory too low, especially during installation.
    The installation process of a virtual machine may notify you about insufficient
    memory and the performance will be very poor. A general rule for VMware virtual
    machines is to use as much RAM as you can, but of course not more than what you
    have in your physical machine. The total amount of RAM to be used in all virtual
    machines that run concurrently is 4 GB. More detailed explanations about memory
