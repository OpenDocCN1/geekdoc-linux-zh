- pgno: 245
  md: '# 28 Installing Novell Cluster Services


    After you have finished your installation of the virtual machines and the shared
    disk, and all servers can see the shared disk, you can start the installation
    of Novell Cluster Services. This chapter describes the normal procedure that can
    also be found in the Novell on-line documentation.


    1. You can start the Deployment Manager now, to install a cluster in your environment.
    There are several ways to start this installation. With NetWare 6.5 and OES, you
    will have access to iManager which contains the Install/Upgrade options. You can
    also start NWDEPLOY.EXE to install a cluster.


    In Deployment Manager, select Install/upgrade Cluster and click the link to run
    the Novell Cluster Utility.


    ![](img/25fe75b93b97a021effaba85db112a52_245_0.png)


    Figure 28.1: Start the installation from deployment manager.


    2. In the welcome screen, click Next.


    3. In the action selection window, select Create a new cluster. Leave the checkbox
    Skip the file copy enabled. The Cluster software files are already installed on
    your server during server installation.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '![](img/25fe75b93b97a021effaba85db112a52_246_0.png)


    Figure 28.2: Create a new cluster.


