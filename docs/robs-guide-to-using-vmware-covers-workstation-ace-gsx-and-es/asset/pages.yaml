- pgno: 121
  md: '# DiskMount limitations


    There are a few limitations you need to be aware of when using the VMware Disk
    Mount Utility:


    +   - You can mount volumes within virtual disks on a Windows host only if they
    are formatted with the FAT (32) or NTFS file system.

    +   - If you mount a virtual disk that has a snapshot all changes you make will
    be deleted if you revert to the snapshot.

    +   - You can not mount a virtual disk if any of the .vmdk files are compressed
    or flagged as read-only.

    +   - You can not use a virtual disk that is already in use by a running virtual
    machine or from a suspended virtual machine.


    ⚠️ Note: If you try to access a virtual disk with the DiskMount Utility which
    is already running in a virtual machine, you will get an error message like this
    one:


    ```

    Unable to mount the virtual disk. The disk

    may be in use by a virtual machine or

    mounted under another drive letter. If

    not, verify that the disk is a virtual

    disk file, and that the disk file has not

    been corrupted.

    ```


    You could actually access a disk that is in use if you had started the virtual
    machine with the parameter disk.locking = "false" in the .vmx file. However, this
    is even less supported than the use of the VMware Dismount Utility itself ☺.


    💡 Tip: There is a utility available from Ken Kato in Japan which can also mount
    virtual hard disk files. It is not supported, of course, but it might be interesting
    to keep an eye out for his project: chitchat.at.infoseek.co.jp/vmware.


    # 7.5 Using RAW Disk Partitions


    Virtual disk files are very convenient for many reasons. You can have as many
    of them as you want on your host''s file system and they can be copied from one
    machine to another, and so on. So, why use a raw disk partition? First let''s
    take a look at what it is.


    A hard disk contains at least one partition. That is where all the data is stored
    after the partition is formatted by the operating system. You can however have
    multiple partitions. Reasons to create more than one partition are: to split data
    from the operating system, to create a dual boot system, or any other reason why
    the data should not be stored in the same partition. An example of this is to
    compress or'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'encrypt one partition while leaving another untouched by these processes. Virtual
    machines can be given access to partitions on the physical hard disk. This means
    that all data access to and from the physical disk is directly written and read.
    It is not like a virtual disk where everything is stored in a single file.


    A partition can be added to a virtual machine from the Add Hardware Wizard.


    +   1. Open the virtual machine configuration utility via the Settings control
    panel, and click the Add button to open the wizard. The first selection that you
    must make is the disk type. Select Use a physical disk (for advanced users) to
    add an existing partition to the virtual machine.

    +   2. In the next screen, select the physical disk where the partition resides,
    and select whether you want to use the entire disk or individual partitions. Selecting
    to Use individual partitions will open the next screen with a list of partitions.

    +   3. In Figure 7.7, two partitions are selected from a Linux installation which
    is also available on that computer in a dual boot configuration.


    ![](img/25fe75b93b97a021effaba85db112a52_122_0.png)


    Figure 7.7: Individual partitions can be assigned to a virtual machine.


    4. Click Next to go to the last step of this configuration. Provide a name for
    the control file that will be created for this physical disk.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# 7.6 Changing the SCSI Bus Adapter Type


    VMware Workstation supports two types of SCSI adapters: LSI Logic and Buslogic.
    Once you have configured the machine for one of these adapters, all consecutive
    disks will be created for this type of adapter.


    In VMware Workstation and VMware GSX Server, the SCSI bus type can be changed
    in the .VMX configuration file for the virtual machine. If the machine is configured
    with an SCSI adapter, one of these lines can be found inside the file:


    ```

    scsi0.virtualDev = "lsilogic"

    ```


    or


    ```

    scsi0.virtualDev = "buslogic"

    ```


    When you change the bus type for the virtual machine from LSI Logic to Buslogic
    or vice versa, then the virtual disk files must also be modified. VMware Workstation
    and VMware GSX Server both detect such a change automatically. As shown in Figure
    7.8, it will ask you whether you want to change the disk type for your virtual
    disks or not.


    ![](img/25fe75b93b97a021effaba85db112a52_123_0.png)


    Figure 7.8: When the adapter type changes, the virtual disks can automatically
    be updated by VMware Workstation and VMware GSX Server.


    # 7.7 Working with CD-ROM and DVD Image Files


    Do you sometimes feel like a “disk jockey”? Or, do you carry around a binder with
    all possible CDs and DVDs that you might need someday at some customer site? Are
    you afraid of not having that Windows NT Workstation 4 bootable CD with you when
    you need it?


    Then look into using CD-ROM ISO files. Not only can they be used directly with
    virtual machines, they can also be burned on a CD whenever you need them. An external
    60 GB laptop hard disk in a small USB 2 enclosure costs you about USD'
  merge: -1
  img_proc: true
- pgno: 124
  md: '200. And it will hold somewhere between 50 to 80 operating system CD-ROM or
    DVD ISO files, depending on the OS and the size of the files.


    Many operating system manufacturers make their operating system CD-ROMs available
    for download via the Internet, with or without integrated service packs. These
    so called overlay CDs, will make it even simpler to install new machines, because
    they include the service pack. This is done so you do not have to update the server
    immediately after installation.


    You can also create your own ISO files for archiving or for use with VMware. The
    easiest way is to create an ISO file directly from the original CD-ROM or DVD.
    This can be done with any of the popular CD/DVD softwares such as Nero and EasyCD
    Creator, or with many of the ISO utilities that are available on the Internet.
    This software category also allows you to create your own ISO files for use with
    your virtual machines.


    Check out the following websites for ISO utilities:


    +   - IsoBuster www.isobuster.com

    +   - WinISO www.winiso.com

    +   - Turtleblast ISO Commander www.turtleblast.com

    +   - Undisker www.undisker.com

    +   - Alex Feinman ISO Recorder isorecorder.alexfeinman.com

    +   - Daemon Tools www.daemon-tools.cc'
  merge: -1
