- pgno: 46
  md: '# 3 What''s New in VMware Workstation 5


    In this chapter, I will introduce the new features for VMware Workstation version
    5. In the chapter 2 from this book you can read how to install this version. There
    are some topics that are new in this version which I have not covered in this
    chapter, such as isochronous USB support. Another feature that is covered in this
    book is the new command line interface, which is covered in section 6.2.


    The topics covered in this chapter are:


    +   - Using multiple snapshots

    +   - Cloning virtual machines

    +   - Teaming virtual machines

    +   - Movie Record and Playback

    +   - Virtual Machine Importer


    # What''s new in VMware Workstation version 5.5


    This chapter covers the new features of VMware Workstation version 5. However,
    when you are reading this, there is good chance that VMware has already released
    version 5.5. These are the features that will be included in the new release:


    +   - Support for multiple (two) CPUs for virtual machines

    +   - Support for 64 bit host and guest operating systems

    +   - Integrated conversion for virtual machines from other vendors


    # 3.1 Using Virtual Machine Snapshots


    There is a reason that this functionality is on top of the list of new features
    and it is discussed first in this chapter. It has been the most requested new
    feature since snapshots were first introduced. It is now possible to create snapshots
    at multiple points in time which will give you the capability to go back to different
    points in the life cycle of your virtual machine. You can even branch off at the
    point when the snapshot was made to create a second timeline based on that snapshot.
    This will give you the capability to try several scenarios based on one virtual
    machine while having the flexibility to go back to any saved snapshot in the snapshot-tree.


    I will first discuss what snapshots are and after that I will go into the details
    of working with the new and previously existing features of the snapshot technology.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# 3.2 Introduction to Snapshots


    While working with real PCs, you might have come across this scenario: you are
    at 90% completion point of your new server installation and an error message appears
    which prevents you from continuing with the installation. Or, a blue screen appears,
    or the installation just hangs up. Or, maybe you are working on a new software
    installation and you want to try it with several options but still use the same
    starting point, such as a clean Linux or Windows workstation.


    Due to the fact that VMware acts just as a real PC, you can find yourself in the
    same situation during the installation of your guest operating system. VMware
    Workstation contains a snapshot feature that can help you go back to a point in
    time that you can preset when you install your new guest operating system, or
    that you may have chosen as a base for all your testing.


    # 3.3 What Snapshot is


    When you take a snapshot of a virtual machine, the state of the machine is saved
    at that particular point in time. Both the disk and the memory are ‘frozen’ at
    the point where you create the snapshot. The configuration of the virtual machine
    and the state of your BIOS are also saved.


    All the operations that you perform on the virtual machine from the point of taking
    the snapshot will be saved in separate files on the file system.


    You can check the directory where the virtual machine is stored for these files:


    +   - `<name>-Snapshotn.vmsn`

    +     This file contains the configuration information about the snapshot. It
    is also this file which keeps track of your virtual machine configuration. The
    snapshot files will be numbered Snapshot1.vmsn, Snapshot2.vmsn, and so on. The
    online documentation points out that more than 100 snapshots are being supported.
    How much more than 100, it does not specify. But of course, it will be limited
    by hard disk space.

    +   - `<name>-Snapshotn.vmss`

    +     Contains the memory dump of your virtual machine

    +   - `<name>-nnnnnn.vmdk`

    +     Multiple files contain the changes to your virtual hard disk. These files
    are numbered 000001.vmdk, 000002.vmdk, etc.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# 3.4 Using Snapshots


    You can take a snapshot when the virtual machine is either in a Powered On or
    Powered Off state or even when it is suspended. Click the snapshot button or select
    VM → Snapshot → Save Snapshot.


    ![](img/25fe75b93b97a021effaba85db112a52_48_0.png)


    Figure 3.1: The toolbar provides easy access to the snapshot feature.


    From this point forward, everything you do in your virtual machine will not affect
    the original files. All changes to the hard disk will go into separate files,
    and what was in RAM at the point of taking the snapshot is saved in a separate
    file.


    To go back to the same point where you took the snapshot, just click the Revert
    button or select Snapshot → Revert to Snapshot. With the new multiple snapshot
    feature, you can select to which snapshot you want to revert to if you have more
    than one.


    Note: Be careful about using the snapshot feature in a distributed virtual machine
    environment. If an application in one machine is communicating with another application
    in a second virtual machine, then reverting to a snapshot in one of the machines
    will create an inconsistent data set. This is also true for Active Directory and
    eDirectory synchronization and replication.


    Reverting to the snapshot point will delete everything that happened since taking
    the snapshot and will start out with the disk from that snapshot point. It will
    restore the RAM which was in the virtual machine''s memory when the snapshot was
    created.


    Note: You will still be using the snapshot, so everything you do will still be
    saved in separate files. Clicking Revert one more time will delete everything
    again.


    Note: Using the snapshot feature results in an overhead to the normal operations
    of VMware Workstation. If you do not need snapshots for a particular machine then
    do not create any snapshots or if they already exist, delete them.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# 3.5 Working with Multiple Snapshots


    Starting with VMware Workstation 5, you can work with multiple snapshots. This
    feature helps you to return to any point in time, when you were using a specific
    configuration.


    Note: Virtual machines which where created with an older version of VMware Workstation
    (prior to version 5 or with other VMware products) can be used in this version,
    but the snapshot feature will not be available. Upgrade the virtual machine hardware
    to use this new feature.


    The example I will discuss here takes place in a training situation, where the
    students can go to any exercise in the training by reverting to the snapshot point
    for a particular exercise. By using snapshots this way, students can go back to
    a previous exercise when they have messed up their environment. Also, when there
    is a need to skip an exercise, the students can start at any given point without
    the need for going through the other exercises first. This is a great solution
    for modular training delivery.


    Tip: Of course students who perform all the exercises without problems do not
    have to go to any of the snapshots. They can start out with the starting virtual
    machine and just work their way through the exercises for the duration of the
    training. Only when something does go wrong, they will not have to start all over
    again.


    ![](img/25fe75b93b97a021effaba85db112a52_49_0.png)


    Figure 3.2: The simplest way to use multiple snapshots is the linear approach.


    The first possibility to work with snapshots is linear: you start out with your
    first snapshot and keep creating sequential snapshots.


    Figure 3.2 shows an example of this approach. You can go back to any point in
    time. In this example, it is to start a specific exercise. The description box
    is useful in helping users identify the status of the virtual machine.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'There can be some scenarios, when you not only want to follow a single line
    of snapshots, but you may also want to branch off at any given point in the line
    of snapshots. This can be done and will result in a snapshot tree.


    ![](img/25fe75b93b97a021effaba85db112a52_50_0.png)


    In the example where exercises are created for students, you can click the initial
    snapshot and revert to that snapshot in Snapshot Manager by clicking the Go To
    button.


    This will result in a new line of snapshots that can also be branched off at any
    given point. Just click the snapshot, revert to it and select Take Snapshot.


    Figure 3.3: Click the initial snapshot and revert to it to start a new branch.


    ![](img/25fe75b93b97a021effaba85db112a52_50_1.png)


    Figure 3.4 shows an example of a snapshot branch that was created for the exercises
    in section 2 of a training course. In this example, there is an extra exercise
    that the students can perform for which an extra snapshot is created at the Exercise
    2.2 snapshot point.


    They can go to that snapshot, when they want to perform that specific exercise.


    Figure 3.4: A snapshot tree can be branched off at any point.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'While working with many snapshots, it is possible to loose track of where you
    are. To find out what the active snapshot is, you need to go into the Snapshot
    Manager.


    You can rename the virtual machine in the settings to the same name as the snapshot.
    Since the snapshot feature also keeps track of the configuration changes, the
    VMware Workstation window will show the name of the machine, which will also be
    the name of the snapshot.


    ![](img/25fe75b93b97a021effaba85db112a52_51_0.png)


    Figure 3.5: Rename the virtual machine in each snapshot to keep track of where
    you are.


    # 3.6 Deleting a Snapshot


    You can delete a snapshot at any given time. From the Snapshot Manager, select
    the snapshot that you want to remove and click the Delete button. This will start
    a process of optimizing the snapshot tree and linking the children of the deleted
    snapshot to their parents.


    Tip: If you do not want to save the changes that you made since creating the snapshot,
    first revert to the previous snapshot and then delete the snapshot.


    It is also possible to delete an entire snapshots branch at once. To do this,
    right click the snapshot and select Delete Snapshot and Children.


    # 3.7 Configuring the Snapshot Feature


    In some situations you might want to disable one of your disks from the snapshot.
    You can do that by configuring the disk as an independent disk. To do that, go
    into the settings of the virtual machine, select the disk that you want to set
    to independent, and click the Advanced button in the disk configuration panel.
    Set the checkbox to make the disk an independent disk. You can only do this when
    there are no snapshots already.


    You also have to choose between a persistent disk and a nonpersistent disk. The
    first mode saves all the changes into the original disk file and the second mode
    saves all the changes in a separate REDO-file, which will be removed when you
    turn off your virtual machine.'
  merge: -1
  img_proc: true
- pgno: 52
  md: "# Disabling Snapshots\n\nThe snapshot feature can be disabled on a per virtual\
    \ machine basis. This only works when the virtual machine does not have a snapshot.\
    \ To disable taking snapshots, open the virtual machine settings, select the Options\
    \ tab, and select the snapshot entry. In the right panel, you will see a checkbox\
    \ to Disable Snapshots.\n\n![](img/25fe75b93b97a021effaba85db112a52_52_0.png)\n\
    \nFigure 3.6: Snapshot behavior can be configured on a per virtual machine basis.\n\
    \nThe default configuration for snapshots is that they will not be affected by\
    \ powering off or resetting the virtual machine. This behavior can be changed\
    \ from the virtual machine Settings to any of these options:\n\n+   - Just power\
    \ off\tDoes nothing and leaves the snapshot intact.\n+   - Revert to the snapshot\t\
    Always removes the snapshot when powering off and always starts with the same\
    \ state.\n+   - Take a new snapshot\tTakes a new snapshot when the machine powers\
    \ on, and adds all changes you made to the original file.\n+   - Ask me\tAsks\
    \ you which of the above actions to take."
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Changing snapshot priority


    With VMware Workstation, virtual machine snapshots are created and restored as
    a background process. This is a great feature because you can almost instantaneously
    continue working with the guest OS while the snapshot process is finishing up.
    If you try to start a new snapshot process when another one is not finished, you
    will receive a message about it.


    ![](img/25fe75b93b97a021effaba85db112a52_53_0.png)


    It depends on the usage scenario of the virtual machine whether you want to keep
    this feature turned on. In a classroom environment for example, students who revert
    to a snapshot can start working immediately. However, when they do this, the machine
    might be slow in the beginning. Depending on the audience, it might be better
    to let them wait until the process is finished as a foreground process.


    To change the way that the snapshots are created, select VM → Preferences and
    enable or disable the checkbox in the Priority tab.


    Figure 3.7: Snapshots are created as a background process by default.


    # 3.8 Cloning Virtual Machines


    This new feature allows you to create a copy of a virtual machine. It is different
    than using snapshots. With multiple snapshots on a virtual machine only one of
    the snapshots can be active, whereas you can boot one or more clones that you
    have created of a virtual machine at the same time.


    There are a wide in variety of usage examples for virtual machine clones. For
    an instructor who has to set up a classroom with virtual machines, this wizard
    helps him to easily create unique machines for each student. With the linked clone
    setup, explained later, the parent could reside on the network, while the student''s
    clone machine is on his own computer.


    Other uses are for software testing where at any point in time, or even at a given
    snapshot in a snapshot tree, you need to have someone else work on the same environment
    to perform tests for you. Clone the virtual machine and provide them with that
    copy to work on.'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'Creating a clone of a virtual machine duplicates the machine and creates a
    new identity. The Clone Virtual Machine Wizard takes care of creating a new unique
    identifier (UUID) and MAC address for the virtual machine. So, you can safely
    run multiple clones of a parent machine without any networking problems.


    Guest operating system specific identity information will not be changed by the
    cloning feature. You still have to change that from within the guest OS yourself.
    The simplest action to start out with is to use the DHCP to assign IP addresses.
    What are left to be changed, for any guest OS, are the workstation or server name
    and possibly the SID on Windows. You can use Microsoft''s SYSPREP tool to take
    care of preparing the parent virtual machine before you create a clone. For Linux
    hosts changing the name is something that can easily be scripted.


    Tip: there are many tools available that can help you to set a new identity for
    your computer without running SYSPREP. Sysinternals has a freeware tool called
    NEWSID, which can set the security identifier and hostname on a Windows machine
    (www.sysinternals.com). Another freely available utility is called Zenc Lite from
    ENGL (www.eng1.co.uk). This utility can set the computer name based on your own
    input but it can also read Windows Management Instrumentarium (WMI) information.
    For example, In VMware, it can read the BIOS serial number that returns the machine''s
    UUID.


    # Linked versus full clones


    There are two sorts of clones that you can create. The full clone can operate
    completely independent of its parent. This type of clone does not need to have
    access to the parents'' virtual machine files. This is different for the linked
    clone, where it will always stay dependent on the parents'' virtual machine files.
    A full clone uses the same amount of disk space as its parent. A linked clone
    only takes a small amount of disk space to start out with because the entire parent
    virtual disk will be used to work with. Eventually the disk space that the clone
    takes will grow once the data is modified and is added inside the clone.


    Note: Using a linked clone is faster when you create it but the performance is
    negatively impacted, just as with the snapshot feature. A full clone runs entirely
    on its own virtual disk and provides better performance.


    # Preparing the parent for cloning


    You can create a clone of a virtual machine when the machine is powered off. A
    clone can be created at any point in the snapshot tree of a virtual machine. But
    when snapshots of the parent are deleted, it will break the link with the linked
    clone and will make it unusable. To prevent this scenario from happening, you
    can set the parent to be a template for cloning. With this feature enabled you
    can not delete a snapshot or the virtual machine to prevent from accidentally
    breaking the link with the clone.'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'To set up a machine as a template, open the virtual machine settings and on
    the Options tab in the Advanced menu select the checkbox for Enable Template mode
    (to be used for cloning). This does not disable the delete control in the snapshot
    manager but when you try to delete a snapshot, the warning message in Figure 3.9
    is displayed.


    ![](img/25fe75b93b97a021effaba85db112a52_55_0.png)


    Figure 3.9: When enabled as a template, snapshots can not be accidentally deleted.


    # 3.9 Creating a Clone


    The virtual machine must be in the power off state before you can create a clone.
    It does not matter if you are at a snapshot in the snapshot tree or not. The clone
    can be based on a snapshot too.


    Note: Virtual machines which were created with a VMware Workstation version prior
    to version 5, or with other VMware products, can not be cloned until their virtual
    hardware is upgraded to version 5.


    You start the Clone Virtual Machine Wizard either from the VM menu or from Snapshot
    Manager.


    ![](img/25fe75b93b97a021effaba85db112a52_55_1.png)


    To clone a virtual machine when it is in a snapshot state, open the Snapshot Manager
    and select the snapshot point that you want to clone. Click the Clone button.
    This starts the Virtual Machine Clone Wizard, where you can select this snapshot
    point to be cloned. You can also select any other snapshot point from the wizard''s
    drop down list.


    Figure 3.10: Snapshots can also be used for cloning.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Cloning a clone


    It is possible to create a clone of a linked cloned virtual machine. Be aware
    that this new linked clone needs access to all linked clones in the chain including
    the parent. Also keep in mind that using the linked clone feature negatively impacts
    the performance and linking linked clones brings even more overhead to your virtual
    machine environment.


    # 3.10 Teaming Virtual Machines


    With VMware Workstation you can run multiple machines that have a relation, such
    as for a demonstration, or for a testing project. For example, you always want
    to demonstrate the combination of a server and a workstation. Or you perform testing
    on a pair of servers that compose a cluster. In this case, you used to always
    have to open the individual machines and start them. Now, you can just bundle
    those machines into a team and start off all of them with one click.


    The teaming feature also adds the feature to assign the machines to a specific
    (virtual) LAN segment and define how that network is being used. You can configure
    the speed of the network and possible packet loss to simulate a real world scenario.


    # Managing teams


    Create a new team from the File menu. The New Team Wizard will guide you through
    the creation of the team. You can create a team with an entirely new virtual machine
    and you can also add existing virtual machines to a team.


    ![](img/25fe75b93b97a021effaba85db112a52_56_0.png)


    During the creation process you can specify the networking configuration for all
    machines in the team. Figure 3.11 shows an example of a team that is configured
    for host-only networking. To throttle the bandwidth or set other networking features,
    the virtual machines must be assigned to a LAN segment. That would be LAN 1 in
    this example.


    Figure 3.11: Teamed virtual machines can be configured for networking from the
    wizard.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'After creating the team, you can now power on the entire team at once or you
    can power on individual machines from the team. You can not start virtual machines
    outside of a team but you can start them individually form the team window.


    Once a team is created, you can manage it from the Team menu. It allows you to
    add virtual machines to the team or remove them from the team. You can also delete
    the entire team including the virtual machines or you can delete the team and
    leave the virtual machines on your hard disk.


    # Team configuration


    A team can be powered on with one click of a button. That is convenient, but it
    may also cause some performance problems if more than one virtual machine is booting
    at the same time. Also, you can have a setup where you first need the server to
    be fully booted before you can start a workstation. The starting interval can
    be configured from the Team Settings configuration screen.


    ![](img/25fe75b93b97a021effaba85db112a52_57_0.png)


    Figure 3.12: Virtual machines in a team do not have to start at the same time.


    In the example shown in Figure 3.12, the first NetWare server is started when
    the team is powered on. VMware Workstation waits for 5 minutes (300 seconds) to
    allow the server to boot. When the second server is booted, another waiting period
    of 5 minutes starts before the Windows workstation is powered on. The starting
    order can also be configured with the up and down arrows at the bottom of the
    list.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# Teams, Clones and Snapshots


    Virtual machines which are part of a team can be cloned; however, the new clone
    will not become a member of the team. It is possible to create a team from cloned
    virtual machines. So, if you are planning to create an efficient set of machines
    that share a virtual disk, you can first create the machines and then create the
    team and add the virtual machines to it.


    You can create a snapshot of a virtual machine inside a team. But it will only
    be a snapshot of that machine, not of the entire team. Of course, you can create
    snapshots of the machines individually or have a snapshot of the entire team,
    but if consistency is important then you might want to take a snapshot of the
    machines in the team when they are in the suspended or power off state.


    # Team networking configurations


    Virtual machines in a team can be configured to use normal host-only, NAT, or
    bridged networking. But it is also possible to assign them to a special LAN segment
    which is used only by the team. You can configure this on a per virtual machine
    basis in the machine''s settings or from the Connections tab in the Team Settings
    window.


    ![](img/25fe75b93b97a021effaba85db112a52_58_0.png)


    Figure 3.13: Network bandwidth can be throttled for a team.


    Adding machines to a LAN segment not only isolates them from any other networks
    but you can also configure the network bandwidth for the LAN segment. This is
    a great feature too; for example, testing a client server application that would
    run over a leased line. You can also configure packet loss to simulate network
    problems.


    # 3.11 Movie Record and Playback


    Earlier versions of VMware Workstation already contained a feature to create a
    screenshot of a virtual machine. That feature is still available today but has
    been extended to capture an entire video of what is happening inside the virtual
    machine.


    To capture a movie, select the Capture Movie option from the VM menu. Provide
    a filename for the file, which will be stored in an AVI file format. You can enable
    the checkbox Omit frames in which nothing occurs to only capture video'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'fragments if something is really happening inside the machine. If you are working
    on building a demonstration and you leave the virtual machine running with the
    video capture enabled to configure something on your host computer, then that
    time will not be added to the movie file.


    ![](img/25fe75b93b97a021effaba85db112a52_59_0.png)


    Figure 3.14: During the movie capture, an icon will be displayed in the status
    bar.


    You can right click the icon displayed in Figure 3.14 to stop the movie capture
    or stop the capture from the VM menu.


    To play a captured movie, you need the VMware Movie Decoder. It is my experience
    that most DVD player applications already play the AVI file anyhow. But other
    players, including Windows Media Player require this decoder. You can download
    it from the VMware website. The most recent version at the time of writing this
    book is VMware-movie decoder-5.0.0-13124.exe.


    # 3.12 Virtual Machine Importer


    There is a product from Microsoft, named Virtual PC, which competes with VMware
    Workstation. The format of their virtual machines is different from that of VMware
    so they are not interchangeable. If you want to move a Virtual PC machine to VMware
    Workstation, then you can run the Virtual Machine Importer.


    This application (Windows only) comes as a separate download from VMware. The
    most recent version at the time of writing this book is VMware-VMimporter-1.0.0-12997.exe.
    The utility and full PDF manual can be downloaded from the following URL: www.vmware.com/download.


    Tip: In VMware Workstation version 5.5 this conversion wizard is integrated in
    the VMware Workstation software by default.


    After installing the program, you can start it from the Start menu from outside
    VMware Workstation. The application does not depend on Workstation to perform
    the conversion process.


    You can select between a custom or typical installation. When you use the custom
    method, you can create virtual machines that are compatible with older versions
    of VMware Workstation or other VMware products. You can also configure a linked
    virtual machine in the custom method. For the example in this paragraph, I have
    used the custom method.


    +   1. The first step to perform the conversion is to select the .VMC file from
    the Microsoft Virtual PC machine.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '+   2. Next, provide the virtual machine name and location for the destination
    virtual machine.

    +   3. If you have selected the custom method, you will be prompted to create
    a new VMware Workstation version 5 compatible machine or a legacy machine.

    +   4. Next, you can choose to create a full copy of the virtual machine or to
    link to the original file


    ![](img/25fe75b93b97a021effaba85db112a52_60_0.png)


    Copying the full machine will result in a .VMDK file containing the full virtual
    machine. When linking to the original Microsoft .VHD file, it will work as a snapshot
    with .VMDK files which only contain the changes. Creating a copy takes longer
    than linking to the machine, but the linked machine will be dependent on the original
    file.


    Figure 3.15: You can copy the entire source virtual machine or link to the original
    virtual PC hard disk file.


    With a linked virtual machine the original file will remain intact but you must
    not use it inside Microsoft Virtual PC anymore. If you do, the VMware virtual
    machine will become corrupt because it only contains changes to the original file.


    +   5. Once the conversion is complete you can start the virtual machine directly
    and close the Virtual Machine Importer.

    +   6. When the guest operating system starts, Windows in many cases, it will
    detect new hardware and will require a reboot. Before you reboot, it might be
    a good idea to install the VMware tools, which also requires a reboot.


    The application keeps a log file of its actions in your temporary directory, typically
    c:\documents and settings\username\local settings\temp. The file has a v2vapp
    prefix and uses the date and time as the remainder of the file, with a .log extension.
    For example: v2vapp.2005-08-25.08-30.log.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# 4 Install Operating Systems and VMware Tools


    This chapter starts with the installation of Windows, Linux, and NetWare in your
    virtual machine. In addition, installing the VMware tools is explained, and you
    will find instructions on using your virtual machines effectively by optimizing
    the machines and shrinking your hard disks.


    # 4.1 Installing Operating Systems General Tips


    So, how do you normally install an operating system on a new PC? You put in the
    floppy disk or the CD-ROM and power it on? That is exactly what you do to with
    a virtual machine. However, you have a few extra choices in this case.


    Whatever operating system you will be installing, the fastest and easiest way
    to do it is to use an ISO image instead of a CD-ROM. If you have to install virtual
    machines on a regular basis, it is a good idea to create ISO images of your operating
    system CD-ROMs. For some of the operating systems, you can download ISO-files
    from the Internet; sometimes even with an integrated service pack. But, you can
    also create ISO files yourself. This is explained in section 7.7: "Working with
    CD-ROM and DVD image files".


    Depending on your CD-ROM drive, it will be faster to use an ISO file from your
    hard drive than your physical CD-ROM drive. Using floppies is always faster from
    floppy images than from real diskettes. How to work with virtual floppies is also
    explained in chapter 7.


    If you have problems booting from a CD-ROM, read the tip in section 7.8: "My virtual
    machine does not boot from a CD-ROM". This may be caused by a problem with the
    boot order in your virtual machine BIOS.


    # 4.2 Installing your First Windows Guest


    You install Windows from the bootable Windows CD-ROM or ISO-file. Place the CD-ROM
    or assign the ISO and power the virtual machine on. The installation of Windows
    starts and you can go through the setup as you normally would do with a real PC.
    Use the normal procedure to create and format partitions.


    ![](img/25fe75b93b97a021effaba85db112a52_61_0.png)


    Tip: If you have chosen Windows 2003 or Windows XP as your operating system and
    you have selected an SCSI disk, you must select the correct driver during the
    character-based installation. This is described in section 12.1: "Using SCSI Drivers
    in Windows Virtual Machines".


    Let the Windows setup finish its job, including rebooting the machine. When Windows
    is up and running again, the first thing you need to do is to install the VMware
    tools; this will be explained later. After installing the tools, make sure that
    all the hardware is detected and is working properly. If applicable, also install
    any'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'service packs you are planning to use, at this point and run Windows Update
    to get your machine updated with the latest software and patches.


    Tip: At the point, before adding new hardware or patches to the machine, take
    a snapshot of where the machine is installed. This way if one of the new components
    breaks, in your Windows environment, you can easily switch back to the point where
    it all worked fine.


    # Windows XP and Server 2003 Activation


    Microsoft introduced a mechanism with Windows XP that is now also implemented
    in Windows Server 2003, where you have to activate Windows. This process generates
    a checksum based on the hardware in your PC, and uses that to activate Windows
    via the Internet or via a telephone dialog with a Microsoft representative. If
    you change pieces of the hardware, Windows will recognize that it is running on
    a different hardware and requires you to re-activate Windows. You will have to
    keep that in mind, if you are installing hardware into a Windows XP workstation.
    You will be reminded by VMware about this with the following dialog box.


    ![](img/25fe75b93b97a021effaba85db112a52_62_0.png)


    Figure 4.1: Install Windows completely before activating your copy.


    Adding a single piece of hardware is not a problem, but if you activate Windows
    before finishing the installation, it could require you to re-activate even before
    you are finished. So, make sure that you have all your disks configured, that
    the amount of memory is set to what it needs to be, and that extra network or
    sound adapters are added before you activate your copy of Windows.


    # 4.3 Installing your First Linux Guest


    Linux is available in many different distributions, but the installation procedure
    is similar for almost any of the distributions and uses a CD-ROM or DVD. There
    are Linux operating systems that you can install over the Internet and as I mentioned
    earlier, a virtual machine is just like a normal PC, so if you could do it from
    a hardware box you can also do it from a virtual box.'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'When booting from the Linux installation medium (CD-ROM, DVD, or ISO), you
    must select the components that you wish to install and partition and format your
    hard drive. Let the installation program finish its job, including any reboots,
    until it is finished. It is advisable to run your virtual machine in bridged mode,
    so that available patches and updates can be downloaded during installation, if
    your distribution supports this.


    Tip: If you have any problems with graphics during installation, check the tips
    in section 13.2 for a work around for your Linux installation problem.


    When the installation is complete, install the VMware tools into your Linux guest
    operating system. After that has been completed, you are finished and now you
    have a completely functional Linux system.


    Tip: At the point where you enter the Linux configuration for users etc., right
    after copying the files (if your distribution has that order) take a snapshot.
    That way you can also go back to the point where all was fine without having to
    go through the entire installation.


    # 4.4 Installing your First NetWare Guest


    Just as with Windows and Linux, your NetWare installation starts with a CD-ROM
    or an ISO file. During the installation, you create a DOS partition and a NetWare
    system partition (pool and volume SYS). Let the installation go through the entire
    process, including a reboot, and when the process is finished, install the VMware
    tools for NetWare.


    Tip: While installing NetWare, take a snapshot at the point where the GUI installation
    asks you for the server name. If anything should go wrong during the installation
    process which creates your environment, it is easier to go back to this point
    instead of starting the installation all over again.


    # 4.5 Installing the VMware Tools


    Without the additional tools available for VMware, your virtual machines will
    still run any of the supported operating systems; however, you could miss important
    functionality and the performance could suffer. The tools take care of several
    issues, and add features to the virtual machine, depending on the guest operating
    system that you are running.


    Some features and benefits that the tools provide you are:


    +   - The ability to automatically grab or release the virtual machine''s input
    when the mouse is pointed at the virtual machine.

    +   - Enhanced graphics performance with the SVGA video driver.

    +   - Improved mouse input performance.

    +   - Time synchronization between the host and the guest.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '+   - Shared folders for sharing files between host and guest (Windows and
    Linux).

    +   - Drag and drop of files to and from the virtual machine.

    +   - Copy and paste operations between the host and guest clipboard.

    +   - Preparing your virtual disks for shrinking operations.


    The tools come as ISO files with the VMware software and are stored in the VMware
    program directory. If you open the ISO file, you will see that the VMware tools
    software is inside the virtual CD-ROM image in the native application format of
    the guest operating system they are for: setup.exe for Windows, setup.ncf for
    NetWare, and a compressed tarball and RPM package for Linux, which contains the
    installation script.


    The installation of the tools is started for every operating system by selecting
    VM → Install VMware Tools. This will add the VMware Tools ISO-file to your virtual
    machine as a CD-ROM device. Dependent on the settings in your guest operating
    system, the setup application will automatically start or will have to be started
    manually. How to continue the installation for your operating system is described
    in the next section.


    # VMware tools for Windows guests


    After starting the VMware Tools installation from the menu, the CD-ROM will become
    available in your Windows guest and will automatically start, if you have not
    disabled autorun. Otherwise, you can start the setup.exe from the root of the
    virtual CD-ROM.


    For Windows NT/XP/2000/2003, you will have to be logged in as an Administrative
    user inside the guest, to be able to install the tools.


    Continue the installation of the VMware tools via the Wizard. The tools will be
    installed and the drivers for your display, mouse, SCSI controller, and the VMXnet
    driver will be added to your environment. Depending on your version of Windows,
    you may have to reboot to finish the installation.


    Tip: The tools will show up on the system tray of your Windows machine. If you
    run VMware in an environment where you do not want users to know that they are
    inside a virtual machine, you may want to disable the system tray icon. You can
    do that by right-clicking the system tray icon and selecting Disable Icon. To
    access the tools settings, or to enable the system tray icon, you can open the
    VMware tools configuration from the Control Panel in the Windows guest operating
    system.


    The Control Panel application can be disabled by a Windows policy that prevents
    access to the control panel. Or you can rename or delete the VMControlPanel.cpl
    file in the VMware tools program directory in the Windows guest, or the VMControlPanel.cpl
    value in the following registry key: HKEY_CURRENT_USER\Control Panel\MMCPL.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# VMware tools for Linux guests


    The tools for Linux come in two formats. These tools are the RPM package and the
    compressed tarball. When using the tar installation, the install can not be started
    immediately. You will first have to extract the files to a temporary location
    in your Linux guest. It may be necessary to mount your CD-ROM. You will have to
    run the installation as root.


    The steps to install the VMware tools for Linux are included in the following
    sections. There may be small differences with your Linux distribution. For many
    Linux distributions, the CD-ROM is a device called /dev/cdrom. This is used in
    the next command line example. Use another device name if applicable for your
    Linux guest.


    1. Change your user environment to the root user with the su - command.


    2. You may need to mount the CD-ROM, if it was not automatically mounted.


    ```

    mount /dev/cdrom /media/cdrom

    ```


    If /media/cdrom does not exist, create it first. Your distribution can also use
    /mnt/cdrom or a directory called /media/cdrecorder as the mount point.


    3. When using the RPM installer, start the installation with the following command:


    ```

    rpm -Uhv /media/cdrom/VMwareTools-5.0.0-13124.i386.rpm

    ```


    Use the correct path and file name for your actual installation.


    4. When using the tar installation option, extract the installation files to a
    temporary directory and run the installation script. If you make the temporary
    directory your present working directory, you do not have to copy the files to
    your hard disk first. Use the following commands to perform this task:


    ```

    cd /tmp

    tar zxf /media/cdrom/VMwareTools-5.0.0-13124.tar.gz

    cd vmware-tools-distrib

    ./vmware-install.pl

    ```'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'The installation script will prompt you for the directories where the software
    and documentation will be installed. Here is a list of the default directories
    that are suggested during installation:


    | Item | Path |

    |---|---|

    | binary files | /usr/bin |

    | init directories | /etc/init.d |

    | init scripts | /etc/init.d |

    | daemon files | /usr/sbin |

    | library files | /usr/lib/vmware-tools |

    | documentation files | /usr/share/doc/vmware-tools |


    5. When you have finished installing the RPM or extracting the archive, you can
    unmount the virtual CD-ROM that contains the tools with the following command:


    ```

    umount /media/cdrom

    ```


    You can also use the correct path to the mount point for your specific installation.


    6. The next step is to run the configuration utility for the VMware tools. To
    perform this step, execute the script with the following command:


    ```

    vmware-config-tools.pl

    ```


    You may encounter errors with the script about compiling the vmhgfs (virtual machine
    Host-Guest File System) or VMXnet (network adapter) driver. If that is the case,
    make sure that you have a C compiler and the kernel sources are installed. The
    VMware Workstation for Linux installation is explained in detail on page 29.


    The script will prompt you for a screen resolution for your X-environment. From
    the proposed resolutions, select one that fits your needs.


    Tip: If the tools configuration script suggests that you need to install from
    outside the GUI, you can end the graphical environment by executing the init 3
    command from a command line prompt, or by pressing Ctrl-Alt-Backspace.'
