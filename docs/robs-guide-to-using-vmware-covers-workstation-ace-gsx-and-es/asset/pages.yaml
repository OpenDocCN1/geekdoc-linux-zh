- pgno: 157
  md: '# 11.7 Configuring MAC Addresses for your Virtual Machines


    Every network adapter in the world has (or should have) a unique Media Access
    Control (MAC) address. This is also the case for your virtual machine. This section
    explains how MAC addresses are assigned and how to configure them manually.


    First, we will look into what MAC addresses are. From the technical point of view,
    they are 6 byte identifiers that uniquely identify each network adapter. The first
    three octets are reserved for the manufacturer''s identification code, and the
    last three octets form a unique identifier for every network adapter that the
    manufacturer ships.


    You can find the MAC address of your network adapter by using the following commands
    in the three guest operating systems that this book covers:


    +   - Windows ipconfig /all

    +   - Linux ifconfig

    +   - NetWare config


    ![](img/25fe75b93b97a021effaba85db112a52_157_0.png)


    Figure 11.18: An example of a MAC address and a manufacturer identifier.


    The manufacturer identifiers are registered in a public registry. They are called
    Organizationally Unique Identifiers (OUI) and they are managed by the Registration
    Authority of the Institute of Electrical and Electronics Engineers (IEEE). Manufacturers
    can be searched for, based on the first three bytes of the MAC address or by name.
    Point your browser to the following URL to perform a search:


    ```

    standards.ieee.org/regauth/oui/index.shtml

    ```


    A search on the keyword “VMware” tells us that three possible ranges of MAC addresses
    are registered by VMware: 00-05-69, 00-0C-29 and 00-50-56. The last one is the
    one used by all current VMware software. The virtual host-only'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'adapters in the host computer and the Ethernet adapters in the guests will
    use this 00-50-56 prefix. For the host-only adapters, the last octet in the MAC
    address is 01 for VMnet 1, 02 for VMnet 2, and so on.


    # Automatically generated MAC addresses


    There is no need to worry about MAC addresses being unique for your virtual machines
    because in almost every case, they are unique. VMware assigns unique MAC addresses
    to your virtual machines. There is no guarantee that all the MAC addresses on
    all your virtual machines, maybe on multiple computers, are unique. If you ever
    encounter problems, they can be manually created. Manually generated MAC addresses
    are discussed later in this section.


    The .vmx parameters which specify that the MAC addresses will be automatically
    generated are:


    ```

    ethernet0.addressType = "generated"

    ethernet0.generatedAddress = "00:0c:29:7a:39:41"

    ethernet0.generatedAddressOffset = "0"

    ```


    First, you have to know something about the way that VMware creates the MAC addresses.
    We will start out with something else first: the Unique Identifier that every
    virtual machine gets. This 16 byte value is assigned to every virtual machine
    to identify it uniquely. It is listed in the .vmx configuration file in the uuid.location
    and uuid.bios parameters.


    ```

    uuid.location = "56 4d 2d d3 cc 9d a2 39-7c 4d 26 f0 1f 76 c1 80"

    uuid.bios = "56 4d 2d d3 cc 9d a2 39-7c 4d 26 f0 1f 76 c1 80"

    ```


    The last three bytes of this value are used as the three byte MAC address part
    for the virtual machine network adapter. Using the example value above, the MAC
    address of the virtual Ethernet adapter will be:


    00-50-56-76-c1-80


    Note: With multiple adapters, the last byte is increased by 10 decimal (0A hex)
    for every adapter. Two new adapters will get the following addresses: 00-50-56-76-c1-8A
    and 00-50-56-76-c1-94. There is a .vmx parameter called ethernet0.generatedAddressOffset
    = "0" for the first adapter, which will have a value of "10" and "20" in the previous
    example for the two other adapters. The virtual machine''s unique identifier will
    not normally change. When you move the virtual machine''s files to a different
    location, or modify the name of the .vmx file, VMware will ask you whether you
    want to create a new identifier or to keep the old one.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '![](img/25fe75b93b97a021effaba85db112a52_159_0.png)


    Figure 11.19: After moving or copying a virtual machine create a new unique identifier
    or keep the old one.


    If you keep the existing identifier, nothing changes and the MAC address remains
    unchanged. Creating a new identifier does change the uuid.bios and uuid.location
    values and therefore creates a new MAC address.


    Note: You can configure the behavior of a virtual machine to always keep the UUID
    or to always create a new one after copying a virtual machine. Use one of these
    settings in the .vmx file:


    ```

    uuid.action = "create"

    ```


    or


    ```

    uuid.action = "keep"

    ```


    Note: If you image a PC that holds virtual machines (such as in an education environment)
    and the virtual machines will communicate via the Local Area Network, you will
    end up with duplicate MAC addresses. In this scenario, either rename the directories
    on your destination computers and create new identifiers, or manually assign MAC
    addresses.


    # Manually assign MAC addresses


    Manually assigning MAC addresses needs to be done from the .vmx configuration
    file by removing and adding parameters. Make sure that the .vmx file is not opened
    by VMware if you manually edit the file.'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'First, remove the lines that take care of the automatic generation:


    ```

    ethernet0.addressType

    ethernet0.generatedAddress

    ethernet0.generatedAddressOffset

    ```


    (or for any other number of Ethernet adapters that are specified in the .vmx file)


    Add the following line to specify the MAC address to be used by your adapter:


    ```

    Ethernet0.address = 00:50:56:XX:YY:ZZ

    ```


    (or for any other number of Ethernet adapters that are specified in the .vmx file)


    The first three bytes are reserved for the VMware manufacturer''s identifier and
    the last three bytes need to be provided manually.


    Construct these three octets with the following rules:


    +   - XX must be a valid hexadecimal number between 00 and 3F

    +   - YY and ZZ must be valid hexadecimal numbers between 00 and FF


    Note: It is very important to use unique MAC addresses on your network. When working
    with multiple virtual machines on more than one VMware server with manually assigned
    addresses, make sure that a mechanism is in place to register the MAC addresses
    that are used in your organization. This is as you would normally do with IP addresses
    being documented.


    # 11.8 Sniffing the Virtual Network


    VMware Workstation comes with a utility called vnetsniffer. It is very basic,
    but it can help you out when monitoring if and when network traffic is generated
    on your virtual networks. The utility is located in the VMware program directory:


    ```

    usage: vnetsniffer [/e] VMnet?

    ```


    Load the program with the name of the network VMnet0 to VMnet9. It will display
    lines in your command line window with all the source addresses and destination
    addresses, and the type of packets being transferred. Adding the /e parameter
    will display enhanced information; from what I have gathered, the extra information
    is only the MAC address of the source and the destination of the packets.


    # Using Ethereal to analyze the network


    The virtual network adapter on a Windows host supports the so called promiscuous
    mode which allows it to read all the packets that are transferred to be analyzed
    off'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'line. This can be done with any of the commercially available network analyzers.
    But life is expensive enough, so let’s take a look at a freeware alternative.


    Ethereal is an Ethernet packet analyzer which can analyze many protocols that
    are transferred via your network. It uses another freeware, Packet Capture Architecture
    for Windows. To work with Ethereal on your Windows host, you will have to install
    this WinPcap software and the Ethereal software. Both are available from the Ethereal
    download webpage:


    ```

    Ethereal    www.ethereal.com

    WinPcap     winpcap.polito.it

    ```


    # 11.9 Using the Wireless Network from your Virtual Machines


    With older versions of VMware Workstation (prior to version 4) it was not possible
    to access the wireless network directly by using bridged networking. However,
    starting with VMware workstation version 4, you can now bridge your virtual machine
    to the wireless network directly. But sometimes it does not work to get the wireless
    bridging to work. That is why I also explain the other methods.


    # Using bridged networking


    From the Edit menu, select Virtual Network Settings to change the bridged networking
    mode. You can edit the Host Virtual Network Mapping manually to change the default
    bridged adapter VMnet0, to use your wireless adapter.


    ![](img/25fe75b93b97a021effaba85db112a52_161_0.png)


    Figure 11.20: Bridged networking can also be assigned to the wireless network.


    By selecting the wireless adapter, your default bridged mode is now using the
    wireless network. There is no need to configure anything about the wireless LAN
    like ESSID or WEP keys inside your virtual machine. It will just see the network
    as a normal Ethernet network.


    # Using Internet Connection Sharing


    If bridging to the wireless network does not work for you, one of the other options
    is to use the Virtual Host Only network, and Windows Internet Connection Sharing'
  merge: -1
  img_proc: true
- pgno: 162
  md: '(ICS), to share the wireless network adapter. You could also use VMware''s
    NAT adapter, but I think ICS is easier and sufficient for most users.


    To configure Internet Connection Sharing on your Wireless adapter, go to the properties
    of your adapter and select the Advanced tab.


    In the ICS frame, enable the check box to Allow other network users to connect
    through this computer''s Internet connection.


    As the adapter for your Home networking connection, you select a Virtual host-only
    adapter, by default this would be VMnet1. If you click OK to save this setup,
    you will receive a message which informs you that your network adapter for the
    Home Network (VMnet1) will be set up with IP address 192.168.0.1. The subnet mask
    for that adapter is set to 24 bits (255.255.255.0).


    ![](img/25fe75b93b97a021effaba85db112a52_162_0.png)


    Figure 11.21: Internet Connection Sharing can also be used to provide access to
    the network.


    You can verify this in the IP properties of your host-only network adapter.


    To use the Internet from your virtual machine, you configure it to use the Virtual
    host-only network. Configure your guest operating system to use an address in
    the range from 192.168.0.2 to 192.168.0.254. Set the gateway and DNS server to
    192.168.0.1.


    You can now use the Internet from the host-only adapter being routed to the wireless
    network via ICS.


    Tip: This method is also a workaround to use virtual machines on a Token-Ring
    network. Just enable the Internet Connection Sharing on your Token-Ring adapter,
    and you can access the network based on TCP/IP communications.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# 12 VMware Tips for Windows


    The tips in this chapter are for your Windows guest operating systems, which are
    independent of the host operating system that you run VMware on: Windows or Linux.
    Some of the tips are not really VMware-related, but because of the usage scenarios
    for VMware, they are important to understand when you are getting started with
    Windows and VMware.


    # 12.1 Using SCSI Drivers in Windows Virtual Machines


    If you are running VMware Workstation or VMware GSX/ESX Server, and you select
    the LSI Logic or BusLogic SCSI adapter during installation, your SCSI disks will
    be automatically detected and used by Windows 2000.


    When installing Windows XP or Windows Server 2003, you will have to download the
    special Windows SCSI Driver available at: www.vmware.com/download.


    Starting a virtual machine with SCSI devices will display the warning message
    displayed in Figure 12.1. This message will tell you that you have such a disk
    and will guide you about what to do.


    ![](img/25fe75b93b97a021effaba85db112a52_163_0.png)


    Figure 12.1: Warning message when using SCSI disks in Windows XP and 2003.


    The SCSI driver download comes as a virtual floppy image (VMware-BusLogic-SCSIDriver-1.2.0.0.flp).
    This is very convenient, because you can directly add this floppy to your virtual
    machine, and use it during Windows installation.


    If you need access to the floppy, you can get access via a Windows virtual machine
    which is already up and running. Do this by connecting the virtual floppy file
    to the machine. You can also use WinImage or the virtual floppy driver to access
    the contents of the floppy. This is described in detail in section 7.1: “Working
    with Virtual Floppy disks”.'
  merge: -1
  img_proc: true
- pgno: 164
  md: "Assign the floppy to your virtual machine, and press F6 when the appropriate\
    \ message appears at the bottom of the installation screen. Consult the Microsoft\
    \ Windows documentation for more information on adding drivers during installation.\n\
    \n# 12.2 How to Disable CD-ROM Autorun\n\nThe VMware setup program disables autorun\
    \ for your CD-ROM player during installation. You can change this manually after\
    \ the installation, or you can change this setting within your Windows guest,\
    \ by modifying a registry value. The correct method to do this is described in\
    \ Microsoft Knowledge base article 155217: “How to Enable or Disable Automatically\
    \ Running CD-ROMs”.\n\nThere is no option to enable or disable automatically running\
    \ CD-ROMs in the user interface. To enable or disable automatically running CD-ROMs,\
    \ you must edit the registry by using the following steps:\n\n+   1. Click Start,\
    \ click Run, type regedit in the Open box, and then press ENTER.\n+   \n+   2.\
    \ Locate and click the following registry key:\n+   \n+       HKEY_LOCAL_MACHINE\\\
    System\\CurrentControlSet\\Services\\CDRom\n+   \n+   3. To disable automatically\
    \ running CD-ROMs, change the Autorun value to 0 (zero). To enable automatically\
    \ running CD-ROMs, change the Autorun value to 1.\n+   \n+   4. Restart your computer.\n\
    \n# 12.3 Shrinking your Windows Disks\n\nHow to shrink your disks is described\
    \ in section 9.2: “Shrinking your virtual disks”. For every operating system,\
    \ there a few extra steps that you can take to prepare your virtual machine for\
    \ shrinking. The most important one is to remove unnecessary files.\n\n+   - Search\
    \ for all files on the virtual hard disk in the guest that are larger than 1 MB.\
    \ From this list sort based on file size and analyze the largest files in the\
    \ list. It is guaranteed that you can remove over 50MB of files. Be careful with\
    \ what you delete: do not delete .DLL or .EXE. Files you can delete are media\
    \ files, bitmaps, etc.\n+   \n+   - Delete driver files when your virtual machine\
    \ is completely configured. Windows stores a local copy of the most important\
    \ drivers on the hard disk. These files (located in C:\\Windows\\Driver Cache)\
    \ can take up over 50MB of"
  merge: -1
  img_proc: true
- pgno: 165
  md: 'data space. These files are useful when adding hardware, but consider the likeliness
    of needing them and decide if you can delete them.


    +   - Clear up temporary directories. Do not only remove files from the Windows
    temporary directory in C:\Windows\Temp but also check the Local Settings\Temp
    directory for all users in C:\documents and settings.

    +   - Also, do not forget any temporary Internet files. Delete them from the General
    tab in Tools → Internet Options in Internet Explorer.

    +   - Check the root of your C: drive and your C:\windows directory because Windows
    updates and other applications sometimes create temporary files there. They should
    be cleaned up after installation. They should, but they not always are so make
    sure to check that yourself.


    The amount of disk space used inside your virtual disk can be decreased by using
    these tips. This makes archiving your virtual machine more efficient. One last
    tip is for Windows XP and ME.


    # Turn off System Restore


    Another important thing to keep in mind is to turn off the System Restore function
    in Windows XP and ME, if you can do without it. This function keeps track of changes
    within the operating system. It saves restore points, which can be used to restore
    your system to a certain point in time (where drivers and applications where working
    correctly). Saving these restore points will use hard disk space. The amount of
    hard disk space depends on the settings of the System Restore function. However,
    depending on what you will be using the virtual machine, for you may as well turn
    off the entire feature.'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'To turn off System Restore, open the System Properties in Control Panel and
    select the System Restore tab. You can configure the amount of disk space to be
    used by this function, and you can disable the function here.


    ![](img/25fe75b93b97a021effaba85db112a52_166_0.png)


    Figure 12.2: Turn off system restore in Windows XP.


    # 12.4 Generating New SIDs


    Working with Security Identifiers (SIDs) is not something that is related specifically
    to virtual machines. However, it is very likely that you will copy virtual machines,
    in order to use them multiple times. By doing so, you can end up in the situation
    where two machines have the same SID. This situation will cause problems, especially
    when working with NT or Active Directory domains.


    One method for creating unique identities is to use the SYSPREP utility from Microsoft.
    This will remove all identification information from the machine and shut it down.
    It can be copied or imaged, and when the copy and/or the original are started,
    a mini setup wizard will start and will ask for a computer name, domain name,
    or a workgroup to join. This will also create a new SID for your machine.


    There are also tools available on the Internet which can help you generate new
    SIDs. One freeware tool is NewSID which is available from Sysinternals. The tool
    is available via their website at www.sysinternals.com.'
  merge: -1
  img_proc: true
