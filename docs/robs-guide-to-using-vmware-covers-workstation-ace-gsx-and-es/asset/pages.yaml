    IDE or SCSI channel. The second setting option is to change the disk mode.


    ![](img/25fe75b93b97a021effaba85db112a52_43_0.png)


    Figure 2.11: These settings are from the Advanced settings screen.


    You can configure your disk to be an independent disk. This means that if you
    create a snapshot of your virtual machine, which is explained in a later chapter,
    the disk will not be saved and all the actions that you perform will still go
