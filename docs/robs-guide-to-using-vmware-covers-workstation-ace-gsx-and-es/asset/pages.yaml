- pgno: 232
  md: '13. Browse the shared disk file (this is not the file with the f001 suffix).
    Select the .vmdk file which you created in step 8.


    ![](img/25fe75b93b97a021effaba85db112a52_232_0.png)


    Figure 19.8: Select the existing shared disk.


    14. Click Finish and close the virtual machine setting’s Control Panel.


    # Where to go from here


    # For NetWare


    When the servers are up and running you may need to activate the SCSI hard disk
    driver, depending on your version of NetWare. This is explained in detail in section
    14.7 “Using SCSI drivers in older NetWare servers”. After that, install the cluster
    services as described in chapter 28 “Installing Novell Cluster Services”.


    # For Windows


    Leave the servers powered off and continue with the configuration of Microsoft
    Cluster Services as described in chapter 29: “Configuring Microsoft Cluster Services
    Software”.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# 26 Shared Disk Cluster with VMware GSX Server


    This chapter covers the installation of two virtual machines with a shared SCSI
    disk, in order to prepare for the installation of Novell Clustering Services or
    Microsoft Cluster Services software. This part is generic for NetWare and Windows.


    The technology for sharing disks in GSX Server is called SCSI Reservation. This
    is an SCSI technology, where the servers can send Reserve and Release commands
    to the disk to gain access to a shared disk.


    By adding the scsi1.sharedBus = "virtual" command to the .vmx file, SCSI Reservation
    is activated in the GSX Server virtual machines. And the disk.locking = "false"
    command disables the file locking, so that a virtual machine can not lock the
    virtual disk file and prevent the other cluster servers from accessing the virtual
    disk file.


    # 26.1 Adding a Shared Disk to the Virtual Machines


    After installing two servers with Windows, Linux or NetWare, and configuring them
    with the VMware tools, it is now time to add a shared disk that will be used for
    clustering.


    Make sure that you have taken all the necessary preparation steps described in
    chapter 23: "Preparing for a Windows Server 2003 Cluster" or chapter 24: "Preparing
    for a NetWare 6.5 Cluster".


    > Tip: I prefer to use a separate disk as the Windows Quorum disk or for the NetWare
    Split Brain Detector partition, and a second shared disk for the data. With such
    a configuration you have more flexibility to re-create the SBD partition, or to
    back up your VMware configuration.


    On the first server, add a new virtual disk that will become the shared disk for
    clustering. I have created this example from a VMware virtual machine console.
    You could add additional hardware from the Management Interface, but it is much
    more convenient from the remote console application.'
  merge: -1
  img_proc: true
- pgno: 234
