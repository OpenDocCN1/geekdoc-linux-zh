- pgno: 293
  md: '# 35.3 Restricting Virtual Machine Management


    In a small organization, things can sometimes be pleasantly simple. There is only
    one administrator and he or she does all the work. There is no need to tell the
    other administrators what to do and no need to restrict anything for all users
    other than: no access at all. But even with small organizations, it is never as
    simple as that. There will always be an intern that needs to be able to do something
    on your system or a user that needs to look after things when you are on vacation.
    And you do not want to just give them the administrator or root password.


    Therefore, it is good to know that you can configure access rights to virtual
    machines and to define what your users can do with them.


    Tip: If you have many users, and especially if you have more than one GSX Server
    or ESX Server, my advice is to use VMware VirtualCenter to configure delegated
    administration. It allows you to configure users from one central location with
    their specific rights. This saves time compared to setting up users and file permissions
    on your individual VMware GSX Servers.


    Access rights to virtual machines are managed by defining file permissions on
    the virtual machine configuration file (.vmx). The levels of access that you can
    define are listed in Table 35.1, along with the file rights that you need for
    that level.


    Table 35.1: Overview of permissions and rights for VMware GSX Server.


    | Access level | Allowed operations | Rights needed |

    |---|---|---|

    | Browsing virtual machines | This allows you to see the virtual machine in the
    Management Interface and attach to it with a console. You can not change the power
    state or modify the configuration. | Read right on the vmx-file |

    | Interacting with virtual machines | This allows you to work with the console,
    change the power state, and connect and disconnect removable devices (such as
    a CD-ROM). You can not modify the configuration. | Read and Execute rights on
    the vmx-file |

    | Configuring virtual machines | This allows you to modify the configuration,
    such as adding or removing hardware. | Read and Write rights on the vmx-file (you
    also need rights to other resources, such as folders where you store virtual disks)
    |'
  merge: -1
  img_proc: true
- pgno: 294
  md: '| Administering virtual machines | This gives you complete access to the virtual
    machines. | Read, Write and Execute for a specific virtual machine. |

    | Administering the host | Allows you to modify the GSX Server settings. | Be
    a member of the Administrators group (Windows) or have root access to the VM''s
    directory (Linux). |


    When creating a virtual machine, the default setting is to make it a private virtual
    machine. This means that the virtual machine is only stored on the inventory list
    of that user and that only that user can work with the virtual machine. Other
    users have no permissions and can not work with the virtual machine at all. Figure
    35.7 shows the window that prompts you to choose a private configuration, when
    creating a new virtual machine.


    ![](img/25fe75b93b97a021effaba85db112a52_294_0.png)


    Figure 35.7: By default, all virtual machines are created as private virtual machines.


    It is also possible to configure a virtual machine to become private after it
    has been created. From the VM menu in the VMware virtual machine console, select
    Settings and in the Options tab, click Permissions to change the virtual machine
    into a private one or to remove this setting. When you make a machine private,
    it will be removed from the inventory of other users who were using the machine.'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# 35.4 User Accounts Used to Run Virtual Machines


    On a Windows host, a virtual machine can run under different user accounts, depending
    on how the machine is configured. Figure 35.8 shows the three possible options
    that can be configured in the Virtual Machine Settings dialogue box.


    ![](img/25fe75b93b97a021effaba85db112a52_295_0.png)


    Figure 35.8: A virtual machine can be configured to run in a specific user account.


    The default setting when creating a virtual machine is that it runs as the user
    who powers the virtual machine on. This implies that the user must have rights
    to the virtual machine''s files, such as the configuration file and disk files.
    These rights can easily be configured by assigning them to the directory, where
    the virtual machine files are stored. The rights are then transferred to the individual
    files. Using a specific user to run the machine requires the same rights to the
    virtual machine files for that user. When the virtual machine has to work with
    physical devices that are attached to the host, such as an SCSI device, a physical
    disk, or a USB device, then the user who is running the machine must be a member
    of the Administrators group.


    Using the local system account is the easiest configuration, because that account
    always has complete access to all the files and has administrative rights to the
    host.'
  merge: -1
  img_proc: true
- pgno: 296
  md: 'Something else to keep in mind when running a virtual machine, as a user that
    is logged in to Windows, is that the virtual machine will be powered off when
    you close the session. You will receive a warning message like the one displayed
    in Figure 35.9.


    ![](img/25fe75b93b97a021effaba85db112a52_296_0.png)


    Figure 35.9: Starting a virtual machine as the current user will power off the
    machine when you log off.


    For virtual machines that always need to be available, you need to configure them
    to run under the local system account. Figure 35.10 shows an example of three
    virtual machines that run under the system account. You can check this yourself
    for running virtual machines with the Task Manager on your environment.


    ![](img/25fe75b93b97a021effaba85db112a52_296_1.png)


    Figure 35.10: Virtual machines running under the system account.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# Linux


    On a Linux host it works differently than described earlier for Windows. Also,
    you can not configure the user account which is used to run the virtual machine
    as you can do from the virtual machine settings for a Windows host. On Linux,
    the virtual machine runs as the user who is the owner of the virtual machine’s
    configuration file.


    # 35.5 GSX Server Backup


    Creating backups of a VMware GSX Server is different from backing up other server
    systems. This is because you now have to deal with both the host system and the
    running virtual machines. It is not as simple as installing a backup solution
    on your Windows or Linux host and then performing a daily backup. Your running
    virtual machines are accessing the virtual disk files, which prevents them from
    being copied by the backup software. These applications require exclusive access
    to those files.


    There are a lot of backup solutions available on the market, all with their advantages
    and disadvantages and of course with a different price tag. I can not list these
    solutions here; instead I will simply direct you to the correct solution for your
    environment. I can only provide you an overview here, and it is up to you to select
    the backup solution that best fits your needs.


    # Running backup agents in your guest operating systems


    This is a backup solution that is not different from creating backups in a normal
    server environment. One of the servers in your environment has a backup device
    attached and runs the backup software. The server contacts the agent in every
    virtual machine to create a backup of the operating system and data. Do not forget
    to also create a backup of the host itself in case the entire GSX Server fails.
    An advantage of this is that it is easy to set up and maintain. It is also the
    best solution, if you want to be able to restore single files from a backup. The
    disadvantage is that it may take too long to create the backup, depending on the
    amount of data and the available backup window. Something else to keep in mind
    is that restoring an entire server will require setting up the virtual machine
    and performing the restore just as you need to do when a physical server fails.


    # Creating backups of the entire host and its virtual machines


    With this approach, you will have a backup of all the virtual machines with all
    their configuration and disk files. The advantage is that it is very simple to
    restore an entire machine. Just restore all the files for the virtual machine
    and you are done. The disadvantage is that the virtual machines need to be shut
    down, or suspended, to be able to create the backup. Therefore, for servers with
    a short backup window that is not an option. Also, it requires you to create a
    script that stops or suspends the virtual machines and starts them again after
    the backup. How to create such a script is explained in section 37.5. The disadvantage
    of backing up entire virtual machines is that you can not restore individual files
    from your guests.'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# Snapshots and other technologies


    There are a few solutions left that can be used to back up your virtual machine
    environment, but they are not specific for such an environment. An example of
    this is the feature to create snapshots that some SANs will support. This allows
    you to create a full backup of the ‘frozen’ environment without any problems with
    open files. The disadvantage of this is that you can not restore individual files
    from your guests. Also, depending on your backup solution, you might even have
    to restore an entire server instead of being able to restore individual virtual
    machine files.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# 36 Creating and Configuring Virtual Machines on GSX Server


    Your knowledge of virtual machine technology, which you may have gained from working
    with VMware Workstation, also applies to VMware GSX Server. If you have never
    worked with a VMware product in the past, I encourage you to first read the chapters
    in this book about the Workstation product.


    The virtual hardware inside the virtual machine is the same as that in the Workstation
    version. It also does not matter whether you have installed your virtual machine
    on a Windows or a Linux host and later transferred it between these two supported
    host operating systems. The hardware inside the virtual machine stays the same.
    The only component that will be different is the processor, since the virtual
    machine will work with the underlying processor from the host machine.


    Every virtual machine has these hardware specifications:


    +   - Same processor as on the host computer

    +   - Intel 440BX-based motherboard with NS338 SIO chip and 82093AA IOAPIC

    +   - PhoenixBIOS™ 4.0 Release 6 with VESA BIOS (DMI/SMBIOS-compliant for system
    management agent support)

    +   - A maximum of 3.6 GB of RAM for each individual virtual machine

    +   - VGA adapter that supports SVGA

    +   - A maximum of 60 SCSI devices on a maximum of four controllers (the SCSI
    controller can be either a Mylex® (BusLogic) BT-958 compatible host bus adapter,
    or an LSI Logic Ultra160 LSI53C10xx SCSI controller)

    +   - Virtual SCSI disks with a maximum size of 256 GB

    +   - A primary and secondary IDE channel for up to four devices

    +   - Virtual IDE disks with a maximum size of 128 GB

    +   - A maximum of four AMD PCnet-PCI II compatible Ethernet adapters

    +   - Creative Labs Sound Blaster® AudioPCI emulation

    +   - Virtual floppy drives (maximum of two), parallel and serial ports, and two
    USB ports


    Creating a virtual machine can be done from the Management Interface, from VMware
    virtual machine console, or from VirtualCenter if you have that software installed
    in your environment. I will not go into the details of how to create a virtual
    machine here. First, all the necessary information about selecting the correct
    operating system, disk types, etc. are already covered in the VMware Workstation'
  merge: -1
  img_proc: true
- pgno: 300
  md: 'section of this book. Secondly, I am assuming that since you started working
    with VMware GSX Server, you are an experienced administrator. What I will do in
    this chapter is to pick out the specific topics for VMware GSX Server which you
    need to know before you get started in working with virtual machines in your environment.


    # Pre-allocate virtual disk space


    By default, when you create virtual machines in VMware, you will be prompted for
    the hard disk capacity of the new virtual hard disks. This is shown in Figure
    36.1. In this window, you must also choose if you want to pre-allocate the disk
    space for your virtual disk. By default, the checkbox for this setting is enabled.


    ![](img/25fe75b93b97a021effaba85db112a52_300_0.png)


    Figure 36.1: By default, disk space will be pre-allocated for your virtual disks.


    To achieve the best performance for your virtual machine, leave this checkbox
    enabled. The vmdk file(s) will be created when you click Finish. This will take
    a while, depending on the size of your virtual disk and your hardware specifications.


    The reason for the performance improvement is that the virtual machine does not
    have to perform any tasks to increase the size of the virtual disk file. Also,
    the file will not become fragmented as it normally would, when small amounts of
    file system blocks are continuously added to the file. That is, if you make sure
    that your disk is defragmented when your disks are created.


    Another advantage of pre-allocating the disk size is that the virtual machine
    is guaranteed to have the disk space it needs. Therefore, there will be no surprises.
    On the other hand, there can be some scenarios when you want to work as efficiently'
  merge: -1
  img_proc: true
- pgno: 301
  md: 'as possible with your host’s available disk space. By allowing your virtual
    disks to grow dynamically, you can overbook your disk capacity. Depending on your
    virtual machine’s specifications and guest operating system’s configuration, you
    can add additional disks to your machine or you can increase the size of your
    virtual disk files.


    # Split files into 2 GB chunks


    The default setting, shown in Figure 36.1, is to create one big virtual disk file.
    This will give you the best performance; but, whether there are any benefits to
    splitting the virtual disk file into 2 GB chunks depends on the use of your virtual
    machines.


    There can be technical reasons for splitting the disks into smaller pieces. For
    example, the FAT32 file system only supports files with a maximum size of 4 GB
    minus 1 byte (2^32 bytes minus 1 byte). You may have NTFS on your system, but
    let’s assume that you would like to move the virtual machines to another server
    that uses FAT32. By starting off with virtual disks that are already split, that
    operation becomes a no-brainer.


    Also, I personally find it useful to split files into smaller pieces for occasions
    when you need to copy or move virtual machine files to another location. Copying
    a 100 GB file where the transaction in Windows Explorer is stopped after 99 GB
    requires you to start all over again, unless you had already copied or moved all
    partial files except for one.


    A final reason to split your files into smaller pieces is that you may want to
    burn a virtual machine to a DVD. Of course, you can archive the files into multiple
    files, but if they already are split into smaller pieces that fit with two on
    a DVD then it saves some extra steps.'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# Use multiple virtual disks


    It is very simple to create a new virtual machine with one 30 GB virtual disk
    and to install the operating system on it. You need to create one or two partitions
    and then store the OS and its data into the single virtual disk. But that also
    means that in case of a failure, you will have to restore the entire virtual disk.
    Using multiple virtual disks gives you more flexibility and makes it easier to
    swap pieces of a virtual machine.


    Let us take a look at the following scenario. In Figure 36.2, you see the disk
    configuration for a Linux host with some system partitions; a partition called
    home for user data and another partition called data used for corporate data.


    ![](img/25fe75b93b97a021effaba85db112a52_302_0.png)


    Figure 36.2: An example of dividing partitions over virtual disks.


    By dividing the partitions over three virtual disk files, you can restore any
    of them when required. That could be done for disaster recovery. But also, let''s
    consider test environments where you need to run several different tests with
    different data. You could easily copy the entire virtual machine initially to
    a test environment and later only copy the newer data into the test environment,
    without having to touch the rest of the virtual machine. And it also works the
    other way around. You can test an update on the guest operating system in a test
    environment and if it fails, you will only have to copy the virtual disks'' operating
    system again to re-run the test.'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# 37 GSX Server Advanced Configurations


    This chapter contains several tips and configuration information for your VMware
    GSX Server environment, which you can use when you need to make modifications,
    such as changing ports and startup/shutdown options.


    # 37.1 Assigning virtual Machines to a Specific Processor


    If your host has multiple CPUs, you can define the processors that you want your
    virtual machines to run on. Actually, you can only define the CPUs that you do
    not want them to run on. You can specify this with the following parameter which
    you add to the machine’s configuration (.vmx) file:


    ```

    processor<n>.use = false

    ```


    The processor number specified with <n> is the processor that your virtual machine
    should not use. On most operating systems, the processor numbering starts with
    0. For example, if you have specified to not use processor 0, the machine’s log
    file located in the same directory as the configuration file, will show the following
    message:


    ```

    Not using processor 0

    ```


    For Windows, you can find specifications for the available processors in the registry.
    Check the following key which lists the available CPUs:


    ```

    HKLM\HARDWARE\DESCRIPTION\System\CentralProcessor

    ```


    For Linux hosts, information about the available processors in the system can
    be found in the file /proc/cpuinfo.


    ⚠️ Note: For Windows, this feature is available on VMware Workstation and VMware
    GSX Server version 3.2. On Linux, it only works with VMware GSX Server, but only
    when you have kernel version 2.6 or higher.


    Now that we have looked into the configuration of this feature, let us take a
    look at how we can effectively use it. If you have a two CPU machine, or a server
    with a CPU which supports hyper threading, it does not make much sense to configure
    the CPU load balancing. With four processors or more, there are several scenarios
    where it makes perfect sense.


    An example of this is when you have one or two important virtual machines that
    you want to run with the best performance and another four machines that are less
    important. In that case, you could configure the first two to run on processors
    0 and 1 and the other ones on processors 2 and 3. If you are planning such a scheme,'
  merge: -1
  img_proc: true
- pgno: 304
  md: 'always create a table where you define the machines and the processors that
    they are not allowed to use. Table 36.1 shows an example of such a table.


    Table 36.1: Planning for CPU load balancing.


    | Virtual machine | CPU0 | CPU1 | CPU2 | CPU3 |

    |---|---|---|---|---|

    | Main file and print server | true | true | false | false |

    | E-mail server | true | true | false | false |

    | Intranet server | false | false | true | true |

    | Accounting server | false | false | true | true |

    | IT test server | false | false | true | true |


    Note: When you need to transfer any of these virtual machines to another server
    that has more or less processors, make sure that you reconfigure the CPU scheduling
    for the new server.


    # 37.2 Changing Port Numbers for VMware Virtual Machine Console


    By default, your GSX Server listens on port 902 for connections from the client
    console application. If for any reason you need to change this to another port,
    you can do that by changing the parameters in the configuration files. After changing
    the port number, you can access the GSX Server by adding the new port number to
    the host name or IP address with a colon. For example: 192.168.1.10:9020.


    # Windows


    On the VMware GSX Server, add this line to your configuration file or modify it
    when it already exists:


    ```

    authd.port = <portNumber>

    ```


    This configuration file is called config.ini and it is located at the following
    location:


    ```

    C:\Documents and Settings\All Users\Application Data\VMware\VMware GSX Server

    ```


    After modifying this setting, you need to restart the VMware Authorization Service.
    You can do that from the Services Control Center, in Administrative Tools. Running
    virtual machines are not affected.


    # Linux


    On a Linux host, the files you need to modify will depend on whether you are using
    xinetd or inetd. If you are using inetd, the port number will be specified in
    file /etc/inetd.conf. If you are using xinted, modify the already existing port
    number parameter in the file in /etc/xinetd.d/vmware-authd:


    ```

    port = 902

    ```'
  merge: -1
  img_proc: true
- pgno: 305
  md: 'Also modify your services file (/etc/services). Find the vmware-authd entry
    and change the port number that you want to use.


    ```

    vmware-authd 902/tcp

    ```


    Next, you need to restart the xinetd daemon:


    ```

    /etc/init.d/xinetd restart

    ```


    # 37.3 Setting the Session Length for the VMware Management Interface and Disabling
    Login


    The default timeout setting for sessions with the Management interface is 60 minutes.
    This timeout value can be changed by modifying the Management Interface configuration
    file.


    # Windows


    Change the setting of vmware_SESSION_LENGTH in the file C:\Program Files\VMware\VMware
    Management Interface\htdocs\init.pl


    ```

    $ENV{vmware_SESSION_LENGTH} = 60;

    ```


    # Linux


    For Linux, you need to run the configuration script for the Management Utility.
    This will prompt you for the number of minutes that you want.


    ```

    /usr/bin/vmware-config-mui.pl

    ```


    For both Windows and Linux, you can also disable the access to the Management
    Interface by specifying 0 as the timeout value. The login screen will display
    a message to warn users that login is prohibited: The VMware Management Interface
    is closed and no logins are permitted.


    When you specify -1 in the configuration file, the sessions will never time out.


    # 37.4 Accessing VMware GSX Server Log Files


    If you experience any problems with your VMware GSX Server environment, the log
    files are a good place to start your investigation. This paragraph simply points
    you to the correct log file locations.


    # Virtual machine log file


    Every virtual machine keeps its own log of what''s happening. It is created in
    the virtual machine''s configuration directory, which is where the .vmx file is
    located.'
  merge: -1
  img_proc: true
- pgno: 306
  md: "# Virtual machine event log file\n\nFor every running virtual machine on your\
    \ GSX Server host, a log file is used to store information about the events and\
    \ problems with that machine. The most basic information is that it has been powered\
    \ on or off. This information is also displayed in the Management Interface in\
    \ the Users and Events tab of the VM’s properties. The log files for the machines\
    \ are stored at the following path:\n\nFor Windows:\n\n```\nC:\\Program Files\\\
    VMware\\\n    VMware GSX Server\\vmserverdRoot\\eventlog\n```\n\nFor Linux:\n\n\
    ```\n/var/log/vmware\n```\n\n# VMware virtual machine Console log file\n\nThe\
    \ client application used to access the virtual machine consoles also stores a\
    \ log file. It is stored in the user’s TEMP directory. You can find out about\
    \ the active log file and location. The easiest way to do this is to check this\
    \ information in the About information from the VMware Virtual Machine Console\
    \ Help menu.\n\n# VMware Management Interface log file\n\nThe web server for managing\
    \ your VMware GSX Server also keeps a log file. On a Windows host, it is called\
    \ mui.log and it is stored in C:\\Program Files\\VMware\\VMware Management Interface.\
    \ On Linux, the log file is called error_log and it is stored in /var/log/vmware-mui.\n\
    \n# VMware Authorization Service Log File\n\nLogging for the Authorization Service\
    \ is not enabled by default. You will have to add the following lines to your\
    \ configuration file to enable the logging:\n\n```\nvmauthd.logEnabled = true\n\
    log.vmauthdFileName = \"vmauthd.log\"\n```\n\nFor Windows, the configuration file\
    \ is called config.ini and it is located at the following location: C:\\Documents\
    \ and Settings\\All Users\\Application Data\\VMware\\VMware GSX Server. On a Linux\
    \ host, the file is called config and it is stored in the /etc/vmware directory.\n\
    \nAfter modifying this setting, you need to restart the VMware Authorization Service.\
    \ For Windows, you can do that from the Services Control Center in Administrative\
    \ Tools. For Linux, restart the xinetd daemon:\n\n```\n/etc/init.d/xinetd restart.\n\
    ```"
  merge: -1
