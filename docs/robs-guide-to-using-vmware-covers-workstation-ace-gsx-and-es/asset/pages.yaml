- pgno: 268
  md: '# 30 Introduction to VMware GSX Server


    Now that you have made it to this chapter of the book, you should already know
    what VMware Workstation is. Also, you should be familiar with creating and running
    virtual machines and you should know how the virtualization technology can be
    used. But you may wonder why you would use a VMware server version instead of
    the Workstation software. In this chapter, I will explain in which scenarios it
    is better to use a server product instead of the Workstation version. Next, I
    will explain how to install VMware GSX Server on Windows and Linux. The next chapters
    in this part of the book contain information about management and configuration.


    # 30.1 When to Use a VMware Server Version


    Running multiple virtual machines on one hardware box is the basic functionality
    of any VMware product. You can use an existing machine in your organization, install
    VMware Workstation, and run several servers from your production environment,
    by using virtual machines. So, why bother using a server version?


    There are several reasons, and some of them are technical, which I will discuss
    later. Let’s start with the manageability of your environment. With individual
    virtual machines in VMware Workstation, you can only manage them from the actual
    PC or server, where they are running. Powering on and off and changing the configuration
    requires access to the VMware application on the host computer. You may have to
    go to the machine physically. Or, you may be able to access the display with VNC.
    But you can still only do that with one administrator at a time. So as soon as
    more than one administrator needs to manage the virtual machines, you will need
    more advanced management capability.


    Note: not only are there technical and usability issues with using VMware Workstation
    in this way. You also do not comply with the End User License Agreement for VMware
    Workstation that is very specific that the product is intended for one specific
    individual user only.


    VMware GSX Server and ESX Server provide the management capability that you need
    for working with virtual machines from different locations. First of all, you
    can power your virtual machines on and off from a browser based management interface.
    The management interface also allows you to monitor the usage and performance
    of virtual machines. In addition, you can use the Remote Control utility to access
    the virtual machine at the hardware level. This allows you to work with the machine
    just as if it was a regular virtual machine running on your own PC, even when
    the operating system inside the VM has crashed. And last but not least, more than
    one administrator can work with a machine simultaneously. So, a server version
    takes away all of the manageability issues that you may encounter with VMware
    Workstation.'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'From a technical perspective, there are not that many VMware GSX server features
    compared to Workstation version 5. Workstation version 5 even has a few advantages
    over VMware GSX Server 3.2 in terms of memory management and performance improvements
    in suspend/resume and snapshot technology. At the time of writing this book, it
    is not clear when these new technologies may be implemented in VMware GSX Server.
    However, VMware traditionally introduces new functionality in Workstation first
    (where it can be exposed to the largest number of customers), and then rolls it
    out over time in to the other products.


    The greatest technical advantages over using VMware Workstation can be found in
    VMware ESX Server. Chapter 1 contains an introduction to this product. The benefits
    include huge improvements in hard disk performance, memory management, and stability.
    For running multiple production servers, VMware ESX Server is certainly the platform
    of choice.


    One final difference between purchasing a server version over VMware Workstation
    is that the server version always comes with a support contract. If you are seriously
    thinking about running virtual machines in a production environment, you must
    definitely consider buying a server version with support.


    # 30.2 Choosing Between GSX Server and ESX Server


    When you decide to virtualize the servers in your environment with a VMware server
    version, you need to decide whether you want to do that with VMware GSX Server
    or VMware ESX Server. Many consultants and resellers will always recommend the
    ESX Server and tell you that it is the only mature server virtualization product.
    However, it is my belief that there are still many usage scenarios where GSX Server
    is an excellent choice.


    First, let''s take a look at some of the differences between the two products.
    An extensive comparison can be found in chapter 1, the introduction to VMware
    ESX Server. The main advantages of VMware ESX Server over VMware GSX Server are:


    +   - Immunity to host operating system stability risks

    +   - Better hard disk performance

    +   - Better memory management


    When looking at the above advantages, it is clear that for an environment where
    availability and performance are important, VMware ESX Server is the platform
    to choose. No doubt that when you want to consolidate multiple servers on one
    hardware platform and you want to keep the performance you have on your physical
    hardware that you will have to choose the VMware ESX Server. Also, when you want
    to make use of the vMotion technology to increase the availability'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'and flexibility of your virtualization platform, you have to choose VMware
    ESX Server because it is the only platform for which the product is available.


    So, what are some of the usage scenarios, when it makes sense to choose the VMware
    GSX Server? In general, I would say that you can choose this product, if the servers
    you are consolidating are not too dependent on the best performance you can get.
    For example, this can be the case for servers that do not have a very high disk
    activity. For example, high end database servers will not be the ones that you
    want to consolidate on VMware GSX Server. Departmental e-mail servers, Intranet
    servers, and other not-too-busy servers are good examples of servers that you
    could still very well virtualize with VMware GSX Server.


    Another valid scenario for running a GSX Server is when the number of servers
    that you want to consolidate is small. If only two or three servers need to be
    running on one single hardware box, then you can still get very good performance
    compared to running physical machines and still benefit from all the advantages
    of virtualization. An example of this is where a company has several small branch
    offices. You can set up these offices with multiple physical servers, but if you
    do the math then it could be less expensive to buy just one hardware box and VMware
    GSX Server. A machine with a single CPU with 2 GB of RAM and VMware GSX Server
    costs about USD 2500, and three physical machines with one CPU and 1 GB of RAM
    each cost USD 6000. And that is only when you buy the hardware initially. What
    if some reseller or manager asks you to add a server to every branch office for
    product XYZ? You do not need to buy a new hardware box; instead, you just configure
    a new virtual machine and you are ready. This is assuming that the hardware is
    still sufficient for the needed performance. Nevertheless, a memory and disk upgrade
    will be less expensive than a complete new server.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# 31 Hardware & Software Requirements and Design


    This chapter will help you decide what hardware and software you need to set up
    your VMware GSX Server environment. This includes the selection of your host operating
    system and the hardware requirements for your host.


    # 31.1 Choosing your Host Operating System


    When you start a discussion on this topic, there is no end to it. It is like being
    at a birthday party where your two brothers-in law try to convince each other
    about a Mercedes being a better car than a BMW and vice versa. Choosing between
    Windows and Linux, fits into the same category. Neither of these choices is better
    than the other one by definition. In reality, both are composed of software created
    by humans so they both will contain bugs and features that may be implemented
    the wrong way. But we will have to work with what is available, which means that
    we have to make a choice. It is best to make your selection before you buy the
    product, because once you buy a license for GSX Server on Windows you can only
    run it on that platform. For a Linux, host you are required to obtain another
    license.


    If you browse the net, you will find some documents that describe the benefits
    of running Linux over Windows and vice versa. I have never found any reliable
    and thoroughly detailed documents that could convince me to use one over the other.
    You could argue about the stability and performance. That is what I very often
    hear when it comes to choosing Linux over Windows. But with Windows Server 2003,
    the stability has improved enormously over previous versions so it is my belief
    that this is not a real criterion.


    My recommendation is that the first selection criteria should be: what platforms
    does the organization already use and what is the experience of the administrators
    with Windows and Linux? If you consider yourself a true Windows organization,
    then stick to Windows. You would really have to learn Linux, before you can start
    using it. If, on the other hand, you have a mixed environment with Linux servers
    in place and your administrators have the knowledge to manage the Linux environment
    then Linux is a very good choice.


    # 31.2 Operating System (OS) Requirements


    For Windows, you need a server version of the operating system to run VMware GSX
    Server. This can be either Windows 2000 server or Windows Server 2003. For a list
    of all current supported versions and supported service pack levels check VMware''s
    on-line documentation at the following URL:


    ```

    www.vmware.com/support/pubs.

    ```'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'When installing your Windows server for use with VMware GSX Server do not forget
    to also install IIS if you want to use the Management Interface for web based
    management.


    For Linux, the list of supported distributions is also available on the previously
    mentioned URL. That list is quite long, because there are many distributions out
    there. In general, most GSX Server implementations are done on an Enterprise Server
    (ES) or Advanced Server (AS) version of Red Hat (version 3 or 4) or SuSE Linux
    Enterprise Server version 8 or 9.


    # 31.3 Hardware Requirements


    VMware GSX Server runs on the Intel x86 platform including machines which have
    an AMD processor. For the most current and detailed listings of supported CPUs,
    check out the on-line documentation at the following URL: www.vmware.com/support/pubs.


    # Processor


    GSX Server supports systems with multiple processors up to a maximum of 32. There
    are two versions of the software available: one that supports two processors in
    your host system and one that supports an unlimited number of processors (or actually
    32 that is, in real life). It makes sense to have multiple CPUs in your host system.
    As a general guideline, VMware suggests running no more than four virtual machines
    for every processor. However, what you will choose as a hardware platform depends
    on many criteria. In the next paragraph, you will read more about these criteria.
    In any case, keep in mind that the maximum number of virtual machines you can
    run on a GSX Server is 64.


    A very important thing to keep in mind is that GSX Server will not give you the
    same performance with multiple CPUs that a VMware ESX Server will give you. When
    looking at the price list, you may be tempted to choose an 8-way CPU machine with
    a GSX Server unlimited CPU license for only a fraction of the cost of an ESX Server
    8 CPU license (about five times as expensive). However, be aware that the way
    that ESX Server divides the load over multiple CPUs is much more efficient. This
    is especially true when using the additional virtual SMP product, which is only
    available for the ESX Server. This product allows you to assign multiple processors
    to your virtual machines to be used with your Guest Operating system. With the
    VMware GSX Server, your virtual machines will always have only one CPU, no matter
    how many processors you have in your host system.


    One last thing that should be mentioned about processors is that dual core processors
    are also supported with VMware GSX Server version 3.2. At the time of writing
    this book, AMD has a dual core Opteron processor available and Intel is about
    to release the first Itanium dual core CPU and XEON based dual core CPU by the
    end of 2005. Simply put, a dual core CPU is a physical processor with two complete
    execution cores. This allows the processor to run two software threads simultaneously
    in parallel. With the already existing Hyper Threading technology,'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'two software threads also work simultaneously, but not in parallel. Even more
    performance gain will result from dual core processors which also support Hyper
    Threading technology.


    # 32 bit versus 64 bit


    Of course another choice you have to make is between a 32 bit or 64 bit processor.
    VMware GSX Server version 3.2 runs on the 64 bit Intel XEON and AMD Opteron and
    Athlon processors. It is not as simple as saying that performance will be better
    on the newer 64 bit platform (if you also run a 64 bit OS), since VMware itself
    is a 32 bit application. There are some other important benefits with the 64 bit
    platform that will be discussed later on regarding memory optimization on page
    273.


    # Memory


    You can not have enough of it! That is a general rule with virtualization and
    memory. The minimum requirement for GSX Server is 512 MB but that really does
    not leave any room for virtual machines. The next paragraph describes some optimization
    criteria. The maximum amount of RAM on both Windows and Linux is 4 GB for Non-PAE
    enabled systems and 64 GB for PAE enabled systems. On Linux, an extra limitation
    to keep in mind is that servers based on the 2.2 kernel only support a maximum
    of 2 GB of RAM.


    # Miscellaneous


    Your system needs a CPU and memory, but there are more components that are also
    needed. I am not going to duplicate the list here which you can find on the VMware
    website. This list will tell you what type of display adapter, hard drive or network
    card you need. After you have read the next paragraph about optimization, you
    will be able to decide for yourself what hardware you really need.


    # 31.4 Hardware Optimization and Design Guidelines


    The previous paragraph described the minimum hardware requirements that you must
    meet to run your GSX Server. Just like with every system, you will need more than
    that. You will need more processors, more memory, and more disks; but how much
    more? There is no simple formula that tells you how many CPUs and how much RAM
    you need for a given number of virtual machines. There are too many parameters
    that will influence your decisions. In this section, I want to give you some information
    that will help you choose the right hardware platform for your virtual infrastructure
    environment.


    # Processor


    VMware GSX Server supports a minimum of two CPUs. There is also a version that
    supports an unlimited number of CPUs. In real life that will be 32 processors
    in one system. So, it is extremely important to decide if you need support for
    more than two CPUs in your GSX Server before purchasing the product.


    A general guideline from VMware is that you run four virtual machines on every
    physical CPU. When deciding how many CPUs you need, you should also take into'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'consideration if you will be running CPU intensive applications inside your
    guest operating systems. Running a file and print server for 50 users relies more
    heavily on disk and network access instead of CPU usage, compared to a server
    running a high end Java2 Enterprise Edition application that is continuously accessed
    by several hundred users.


    Choosing the number of CPUs for the virtual machines that you plan to run can
    not be done without looking into other factors, such as hard disk and network
    activity which will impact your server''s performance. As an example, let''s assume
    that you have a four processor machine and you are planning on running the suggested
    sixteen virtual machines. This may sound good on the processor side, but if that
    server has only one hard disk that all virtual machines need to read from and
    write to, you will end up with poor performance, even with non-disk intensive
    applications.


    # Memory


    The second component of your server that will heavily influence the performance
    of your virtual machines is the available memory. A general rule with most servers
    and operating systems is: the more the better. But there are a few things to keep
    in mind before ordering all your servers with 64 GB by default.


    First of all, you need to determine how much memory you really need for your virtual
    machines and how much memory you need for future installations. The great advantage
    of VMware''s current generation of products is that it does not pre-allocate the
    memory that you assign to a virtual machine. In other words, if you start four
    machines with 512 MB each, your GSX Server software does not consume 2 GB of memory
    from the start. If those guest operating systems are only using 256 MB each, the
    total memory usage will be around 1 GB or even less.


    When you encounter such a situation, you can optimize the memory settings of your
    GSX Server and virtual machines. Therefore, when calculating the amount of RAM
    that you really need for your server, you do not have to add up the amount of
    RAM that you would typically buy for your independent physical servers. Of course,
    you also benefit from using VMware technology with the capability of removing
    and adding memory to virtual machines very easily, especially compared to swapping
    physical memory modules.


    > Note: It is important to remember to reserve enough memory for your host operating
    system. When your host OS starts using virtual memory (for swapping, paging, etc.),
    the performance of your virtual machines will degrade noticeably.


    For configurations of up to 4 GB, there are not too many special configurations
    that you have to consider. As long as you remember that besides the amount of
    RAM required to run a given number of virtual machines, you also need to have
    sufficient processing power and hard disk availability.'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'When you plan to exceed 4 GB with the VMware GSX Server, you need to look into
    some special configurations. Whether more than 4 GB can be used will depend on
    your hardware platform and your operating system. First, let''s take a look at
    the 32 bit architecture. The memory limit for an Intel 32 bit systems is 4 GB.
    With the support for Physical Addressing Extension (PAE), this memory limit can
    be extended. The amount of memory you can use depends on your operating system.
    With Windows 2000 Advanced Server, the limit can be extended to 8 GB and for Windows
    2000 Datacenter Server the limit is 32 GB. For Windows Server 2003, the limit
    of the Standard Edition is always 4 GB because it does not support PAE. With Windows
    Server 2003 Enterprise Edition the limit is automatically extended to 64 GB.


    To enable PAE on a Windows host, you need to edit the boot.ini file and add the
    /PAE switch to the end of the line, where you load the operating system. The following
    is an example of a Boot.ini file, where the PAE switch has been added:


    ```

    [boot loader]

    timeout=30

    default=multi(0)disk(0)rdisk(0)partition(2)\WINDOWS

    [operating systems]

    multi(0)disk(0)rdisk(0)partition(2)\WINDOWS="Windows Server 2003, Enterprise"
    /fastdetect /PAE

    ```


    Whether Linux supports PAE depends on your distribution. You will have to check
    with your vendor if you want to use more than 4 GB of RAM on your Linux host.
    However, most of the recent professional distributions from SuSE and RedHat support
    PAE.


    # 64 bit platform


    On the 64 bit platform with Windows Server 2003 for 64 bit Extended Systems, the
    operating system can handle 64 GB by default. The 32 Bit applications, such as
    VMware GSX Server, run in a subsystem that accommodates loading, execution, and
    management of 32-bit applications. This subsystem is called WOW64, or Windows-32-on-Windows-64.
    This subsystem only assigns 4 GB to a 32 bit application. There is one slight
    advantage over the typical 4 GB, which you get on a normal non-PAE enabled system.
    In this case, the memory is also used by the operating system and other applications.
    Whereas on the 64 bit platform, the application is assigned a total of 4 GB for
    dedicated use (as long as the server has more than 4 GB total, so the OS itself
    and other applications are loaded in the remaining available memory).


    Therefore, the bottom line is that you will get some benefits from buying a 64
    bit platform to run VMware GSX Server but you might want to spend your money on
    an additional optimized 32 bit server to balance the load of your virtual machines.


    Note: All this information about the 64 bit platform does not cover running 64
    bit guest operating systems. If you need to do that, you need to buy a 64 bit
    platform first and it is important to know that VMware GSX Server runs on that
    hardware.'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'Note: Support for the 64 bit platform is something that most likely will become
    available with version 3 of VMware ESX Server. There is no information available
    at the time of writing this book to suggest that a 64 bit version of VMware GSX
    Server or VMware Workstation will become available soon.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# 32 Upgrading GSX Server Software


    For both Windows and Linux, it is important to take the following actions if you
    are going to install a newer version of VMware GSX Server. This is especially
    important if you are planning to install from an older generation of GSX Server.
    As an example, if you are running GSX Server version 2.x and are now upgrading
    to version 3.2:


    +   4. Make sure that all virtual machines are in the Power Off state. If your
    machines are suspended, resume them first, shut down the guest operating system
    and then power them off. After installing the new GSX Server software, you will
    need to upgrade the virtual hardware. See the GSX Server Administration Guide
    if this applies to you. Also check out the information about VMware generations
    on page 98.

    +   5. Save all undoable disk mode information into the virtual disks. When you
    have disks that are in the legacy undoable mode, make sure that you save all the
    changes into virtual disks or discard the changes before powering off.


    Also, make sure that you create a backup of your virtual machines and your GSX
    Server Host machine. And last but not least, test the newer version of VMware
    GSX Server before you install it into your production environment.


    Before you can install a newer version of VMware GSX Server on Windows, you must
    uninstall your current version. For Linux, it depends on the previous installation
    method. If you have used the tar installer, you do not have to uninstall the previous
    version. You only need to ensure that no old extracted files from a tar installation
    exist in the directory where you extract your download. When you use the RPM installer,
    you must first uninstall the current version before you can install a new one.
    To find out whether you have installed with the RPM package, use the following
    command to query the RPM database:


    ```

    rpm -qa | grep VMware

    ```


    If no entry from the database is shown, then you can assume that the installation
    was done with the installer from the tar archive. If you need to uninstall the
    application, which was installed with the RPM package, use the following command:


    ```

    rpm -e VMware-gsx

    ```


    The RPM database listing that you performed with the query command shows all the
    installed software. The keyword VMware-gsx is used to uninstall the GSX Server,
    but the VMware console could also be shown in this listing.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# 33 Installation and Configuration on Windows


    The first step in setting up your Windows GSX server is to get your hardware up
    and running. I am assuming that you have read the previous sections about the
    hardware system requirements, design, and optimization and that you have set up
    the hardware at this point.


    # Meeting software system requirements


    Next, you need to install your host operating system. Before you install the OS,
    you need to decide if you want to run the VMware Management Interface on you server.
    With this component, you can manage your GSX Server from a web browser and use
    it to start and stop virtual machines, create or delete them, and configure existing
    ones. To use this feature, your Windows server must have a version of IIS installed.


    You can use either version 5 on the Windows 2000 Server or version 6 on Windows
    Server 2003. Make sure to install IIS if you have not already done so during the
    Windows Server installation. If you have not installed IIS, you can not continue
    with the installation of the Management Interface during your GSX Server installation.


    # Get the software


    The next step in setting up your Windows GSX server is to obtain the software.
    It is possible to buy a media kit from VMware which contains a CD-ROM with the
    software. But your best choice, assuming that it is no problem to download just
    a little more that 100 MB, is to download the latest version from www.vmware.com/download.


    To download the software, you must be registered as a customer or you need to
    be enrolled in the evaluation program. You can enrol to evaluate the program,
    by selecting the evaluate link on the download webpage.


    # Get a discount


    If you have not already bought the software, it is good to know that you can receive
    a discount when you buy your license at the VMware online store. You are eligible
    for a 5% discount if you enter the following discount code when buying your product
    online at the VMware Store: VMRC-ROBBAS389.


    This code is valid for VMware Workstation and VMware GSX Server purchases.'
  merge: -1
  img_proc: true
