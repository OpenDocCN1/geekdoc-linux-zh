- pgno: 96
  md: '# 6.2 Running Virtual Machines from the Command Line


    You can start virtual machines from the command line in several ways. One of them
    is by using the VMware executable itself. There are also two separate executables
    that you can use: vmrun and vmware-fullscreen.exe (for Windows). All three options
    are explained in this chapter.


    # Parameters for the VMware executable


    It can be very useful to start virtual machines when your host starts. You can
    do this by adding commands to a startup script or you could start virtual machines
    from scripts, or trigger them from other applications in your host system.


    The syntax for starting VMware Workstation from the command line is:


    ```

    vmware [OPTIONS] [\<path_to_config>\<config>.vmx]

    ```


    Table 6.1: Listing of command line switches for VMware executable.


    | Command Line Switch | Description |

    |---|---|

    | -x | Automatically powers the virtual machine on when VMware starts. |

    | -X | Automatically powers the virtual machine on when VMware starts and switches
    to full screen mode. |

    | -q | Closes the virtual machine''s tab when the machine powers off, and also
    exits VMware Workstation if no other virtual machines are running at the same
    instance as vmware.exe. |

    | -s NAME=VALUE | Sets the specified variable to the specified value. Any variable
    names and values that are valid in the configuration file may be specified on
    the command line with the -s switch. |

    | -p parentDisk childDisk | Points disks to the correct parent disk |

    | -m (Linux host only) | Starts the program in quick switch mode on a Linux host.
    |

    | -k KVM_FILE | Specifies a list of virtual machines. |

    | -v | Displays the product name, version and build number of VMware Workstation.
    |

    | \<path_to_config>\<config>.vmx | Do not forget to use quotes around file names
    that have spaces in them; otherwise parts of the path will be seen as separate
    parameters. |'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# Using the vmrun executable


    VMware Workstation version 5 comes with a new executable which you can use to
    work with virtual machines from the command line.


    The syntax for this command is:


    ```

    vmrun COMMAND [PARAMETER]

    ```


    Table 6.2: Commands and parameters for vmrun executable.


    | Command | Parameter | Description |

    |---|---|---|

    | list |  | Lists all running VMs. |

    | start | Path to vmx file | Starts a VM |

    | stop | Path to vmx or vmtn file | Stops a VM or Team |

    | reset | Path to vmx or vmtn file | Resets a VM or Team |

    | suspend | Path to vmx or vmtn file | Suspends a VM or Team |

    | upgradevm | Path to vmx file | Upgrades a VM to a new hardware version |


    * Starting a team with the vmrun command is currently not supported.


    # Using the vmware-fullscreen executable (Windows only)


    With this utility, virtual machines can be started and moved to full screen mode
    right away. This can be useful in scenarios where virtual machines must be started
    without user intervention or when you do not want the users to know that they
    are running with a virtual machine.


    The syntax for this command is:


    ```

    vmware-fullscreen <command> ["path to config file"]

    ```


    Table 6.3: Commands for the vmware-fullscreen executable.


    | Command | Variables | Description |

    |---|---|---|

    | poweron | -s variable=value | Sets the specified variable to the specified value.
    Any variable names and values that are valid in the configuration file may be
    specified on the command line with the -s switch. |

    | poweron | -name=<alias> | Specifies an alias to be used in the poweroff and
    switchto commands. |

    | poweron | -directkey=<keyspec> | Specifies a key which can be used to switch
    to this machine directly. |

    | poweron | -fullscreen | Powers on and switches to full screen immediately. |

    | poweroff | alias or path to vmx file | Powers off the specified virtual machine.
    |'
  merge: -1
  img_proc: true
- pgno: 98
  md: '| switchto | alias or path to vmx file | Switches control to the specified
    virtual machine. |

    | listvms |  | List virtual machines |

    | query |  | Checks the status of the virtual machine. |

    | exit |  | Stops all virtual machines that where started with the vmware-fullscreen
    command. |


    * Add the following parameters (explained in the online documentation) to your
    configuration file: FullScreenSwitch.cycleKey, FullScreenSwitch.hostDirectKey
    and FullScreenSwitch.cycleHost.


    Log file information for the vmware-fullscreen utility is written to a log file
    in the temporary directory of the user who is running the application. By default,
    this will be: c:\documents and settings\<username>\local settings\temp.


    The path can be changed by adding the following entry to the general VMware Workstation
    configuration file (C:\Documents and Settings\All Users\Application Data\VMware\VMware
    Workstation\config.ini.):


    ```

    fullScreenSwitch.log.filename="<path>"

    ```


    # 6.3 VMware Files Reference


    A virtual machine is made up of a set of files. The configuration, the BIOS, and
    the contents of the virtual hard disk all go into files on you host PC''s file
    system. Table 6.4 contains an overview of the files that are used for your virtual
    machines and for general VMware purposes. The list is not complete since not all
    the files are documented. The overview is created by analyzing VMware Workstation
    and the files that it creates.


    Table 6.4: Virtual Machine File Reference.


    | File or Filetype | Description |

    | .vmx | A text file that contains the virtual machine''s configuration. The parameters
    are configured via VMware application. If needed, the parameters can be modified
    via a text editor. Close the VMware application before editing it manually. VMware
    Workstation verifies the validity of this file for missing quotes, duplicate entries,
    etc. |

    | .vmxf | This is an additional configuration file that stores team specific information
    for a virtual machine when it is a member of a team. |'
  merge: -1
  img_proc: true
