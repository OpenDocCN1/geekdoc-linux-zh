- pgno: 68
  md: '# 4.6 Setting the Power On and Power Off Modes


    First time users have to get used to seeing the virtual machine as a real PC which
    can do everything you normally can do with a PC, including powering on and off.
    VMware virtual machines can even be configured to look more like real PCs. Nowadays,
    pressing the power off button of a PC does not just power off but also shuts down
    the operating system. VMware can also do that.


    To configure this option, open the Virtual Machine Settings and on the Options
    tab, select the Power entry. The following settings, displayed in Figure 4.2,
    are available:


    +   - Power off button: Power off or Shut Down Guest

    +   - Restart button: Reset or Restart Guest


    ![](img/25fe75b93b97a021effaba85db112a52_68_0.png)


    Figure 4.2: The machine can be powered off but a graceful guest OS shutdown can
    also be configured with the Virtual Machine Setting Power Options.


    Note: The behavior of these settings depends on the guest OS that you are using.
    The Power Off setting always turns the virtual machine off, but the Shut Down
    Guest setting sends a signal to the guest operating system to perform a shutdown.
    If your guest OS does not support this feature, then you must manually stop the
    guest'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'the same way as on a physical machine. This is also true for running the VMware
    tools scripts with the Power Off options; not every OS with VMware tools installed
    supports this feature.


    The other Power Options from the settings screen in Figure 4.2 are self explanatory:


    +   - Power on after opening this virtual machine.

    +   - Enter full screen mode after powering on.

    +   - Close after powering off or suspending.


    Use these options to configure a machine that runs without the user controlling
    it. By automatically starting and entering full screen mode, a user would never
    have to know that he or she is working inside a virtual machine.'
