    The persistent disk mode writes all actions directly into the virtual hard disk
    file. The Nonpersistent disk mode keeps track of all the changes in separate REDO-files.
    When you power the virtual machine off, all your changes are discarded. You can
    switch between these modes later from the virtual machine Settings configuration.


    The non-persistent disk mode is useful when you are working with software testing.
