  merge: -1
  img_proc: true
- pgno: 250
  md: '![](img/25fe75b93b97a021effaba85db112a52_250_0.png)


    Figure 28.9: Start the cluster after installation.


    11. After the installation is complete, you will see a window asking you if you
    want to read the Readme file. The Novell Cluster Services software is started
    on both servers.


    12. At this time, you have an up and running cluster on your servers. The Cluster
    Membership Monitor (CMON.NLM) will display the two servers in the cluster with
    the Up status.


    You can use iManager (if you have SP1a), Remote Manager or ConsoleOne to manage
    the cluster.


    Have fun with your newly built cluster!


    # 28.1 Be Careful to Suspend the Cluster Nodes


    The cluster nodes will continuously keep each other informed about their status.
    If a node is not available, it will be marked as off-line. If you suspend a cluster
    node, it will no longer be available to the other node(s) in the cluster.


    You may think that suspending both cluster nodes at the same time is the solution.
    This could work if you are fast enough, but if you bring the server back on-line
    from the suspend mode, the resume operation could take some time. This is especially
    the case if you resume two servers at the same time. There is a fair chance that
    they will not be resumed exactly at the same time (depending on your hardware),
    or that your host is so busy with this operation that the guests are slow and
    the heartbeat between the cluster nodes gets lost.'
  merge: -1
  img_proc: true
- pgno: 251
  md: "The best thing to do is to either take all (or all but one) of the servers\
    \ in the cluster off-line, and then suspend all of them; or, just shut down the\
    \ operating system and power off the virtual machines.\n\n# 28.2 No Shared Media\
    \ is Available\n\nIf during the cluster installation the software reports that\
    \ no shared media is available, there are three known common problems:\n\n+  \
    \ 1. The servers do not have access to the shared disk. Check with `list devices`\
    \ to find out whether both servers can see the shared disk.\n+   \n+   2. One\
    \ of the servers does not have the `disk.locking = \"false\"` line in the `.VMX`\
    \ file. In this scenario, one of the servers does not lock the disk and the second\
    \ one does, which prevents the other server to write to the disk.\n+   \n+   3.\
    \ There is data on the disk that prevents the Cluster Services installation from\
    \ creating the Split Brain Detector (SBD) partition. In this case, replace the\
    \ disk with a new one or use the NSS Management Utility (NSSMU .NLM) to initialize\
    \ the disk. This is shown in Figure 28.10.\n\n![](img/25fe75b93b97a021effaba85db112a52_251_0.png)\n\
    \nFigure 28.10: The shared disk can be initialized with the NSS Management Utility"
  merge: -1
  img_proc: true
- pgno: 252
  md: '# 28.3 Disk with SBD Partition Deleted or Corrupt


    If your disk that contains the SBD partition is corrupt or for any other reason
    missing, then you can very easily re-create the SBD partition.


    +   1. You start out by adding a new shared disk to your servers via either a
    shared SCSI channel or an iSCSI channel.

    +   2. Set up this disk to be shareable from the Devices menu in the NSS Management
    Utility (NSSMU.NLM) on BOTH servers. Remember the Device ID for this disk (if
    you have multiple disks), because the SBD install utility will show your disks
    based on their IDs.

    +   3. Make sure that the cluster services software is loaded (LDNCS.NCF).

    +   4. Type SBD INSTALL at the console prompt to recreate the SBD partition.


    ![](img/25fe75b93b97a021effaba85db112a52_252_0.png)


    If you do not have two disks to use for the SBD partition (and no space is available
    to create a mirrored SBD partition), then select No to create a single SBD partition.
    Select the device number where you would like to create your SBD partition.


    5. At this point if your SBD partition has been re-created, type cluster join
    to start the cluster. If it still reports an SBD failure, unload the clustering
    software (ULD NCS.NCF) and reload it (LDNCS.NCF).'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# 29 Configuring Microsoft Cluster Services Software


    This chapter covers the configuration of Microsoft Cluster Services Software on
    your Windows Server 2003 Enterprise Edition servers. You must have taken the prerequisite
    steps in chapter 23: “Preparing for a Windows Server 2003 cluster” and you should
    have read one of the shared disk configuration chapters for VMware Workstation,
    GSX Server or ESX Server.


    During the installation of your cluster, it is critical that some nodes are powered
    on while other nodes are powered off at some points. So, make sure that you follow
    the steps that instruct you to power a node off or on. Table 29.1, from Microsoft
    Clustering manual, provides an overview of the installation steps as well as the
    status which every node must be in.


    Table 29.1: Overview of Cluster Installation Steps and Node States.


    | Step | Node one | Node two | Storage | Comments |

    |---|---|---|---|---|

    | Setting up networks | On | On | Off | Verify that all storage devices on the
    shared bus are turned off. Turn on all nodes. |

    | Setting up shared disks | On | Off | On | Shutdown all nodes. Turn on the shared
    storage, then turn on the first node. |

    | Verifying disk configuration | Off | On | On | Turn on the first node, turn
    on second node. Repeat for nodes three and four if necessary. |

    | Configuring the first node | On | Off | On | Turn off all nodes; turn on the
    first node. |

    | Configuring the second node | On | On | On | Turn on the second node after the
    first node is successfully configured. Repeat for nodes three and four as necessary.
    |

    | Post-installation | On | On | On | All nodes should be on. |'
  merge: -1
  img_proc: true
- pgno: 254
  md: '1. Start out with node one powered on and node two powered off.


    2. In node one, open the Computer Management via the Administrative tasks menu
    item and select Disk Management.


    Note: If the Write Signature and Upgrade Disk Wizard runs, then do not convert
    your new disk to a dynamic disk. If it is converted to a dynamic disk, then right-click
    the disk in Disk Management and select Revert to Basic Disk.


    3. Right-click the Unallocated disk space on your new disk and create a new primary
    partition. The minimum size for your quorum disk must be 50 Mb. If you have created
    a 100 Mb or a 500 Mb disk, you should use the entire disk at this point. Format
    it as NTFS and assign it a drive letter. Q: is a commonly used letter for the
    Quorum disk.


    ![](img/25fe75b93b97a021effaba85db112a52_254_0.png)


    Figure 29.1: The Quorum disk is configured in the first node as drive Q:.


    4. At this point, it is important to verify that you can access the disk. Add
    a text file to the newly created Quorum disk and enter some information in the
    file.'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'Tip: Also, check that you still have your **Private and Public network adapters**
    because if they have moved to another slot, they could be replaced by a new adapter
    called **Local Area Connection**. If needed, re-configure the adapter to be the
    Private or Public network adapter with the correct IP address. Repeat this step
    on node two in the next step.


    5. Now power off the first node and power on the second node. The disk should
    now be available in node two. Go to **Disk Management** and assign the drive letter
    Q: to this disk. In Windows Explorer, you should now see the file that you have
    created from the first node. You can open this file and view the contents that
    you have added to the file from the first node. Also, check the network adapter
    configuration as described in the previous step.


    If everything works, then power off node two again and power on node one.


    6. On node one, start the Cluster Administrator (Go to Start → All Programs →
    **Administrative tools**).


    7. Select **Create new cluster** from the dialog box.


    ![](img/25fe75b93b97a021effaba85db112a52_255_0.png)


    Figure 29.2: Create a new cluster.


    8. The **New Server Cluster Wizard** has started. Click **Next** on the introduction
    screen.


    9. In the Cluster Name and Domain Name selection screen, select your domain and
    enter a name for your cluster. This must be a unique and valid NETBIOS name.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '![](img/25fe75b93b97a021effaba85db112a52_256_0.png)


    Figure 29.3: Specify a name and domain for the cluster.


    10. You will be prompted for the first node in the cluster. This will typically
    be the node where you are configuring these first steps of your two node VMware
    cluster.


    11. Your configuration will be analyzed, and an overview of any problems will
    be displayed. Fix any problems that are critical before continuing with the next
