    # 5.10 Responding to a User''s Hot Fix Request


    When you have configured the virtual machine with a policy that allows the user
    to request a Hot Fix, you must process these requests from VMware ACE Manager.
    A Hot Fix can be a request for a password reset, to re-enable an expired virtual
    machine, or to re-enable a machine that was copied to another location.


    In the following example, a user tries to start a password protected virtual machine
    but has forgotten the password.


    ![](img/25fe75b93b97a021effaba85db112a52_90_0.png)


    The user clicks the Request Password Reset button to start the Request Hot Fix
    Request Wizard. This will walk the user through the process of creating a file
    or sending an e-mail.


    Figure 5.15: When a user forgets the password a Hot Fix request can be sent to
    the administrator.


    The wizard will ask the user for his or her name and e-mail address. This information
    will be used to return the host fix request when it is processed by the administrator.
    If the feature is enabled to send the request via e-mail in the policy, then the
    user''s e-mail application will be used through a MAPI call to send the e-mail
    to the administrator''s address which is specified in the policy. For example,
    when the policy is configured to save the hot fix request in a file, the user
    can save the file on his or her network home directory.


    To process the request, select Open Hot Fix Request from the File menu in VMware
    ACE Manager. Click the appropriate button to either select or deny the Hot Fix
    request and after processing it, send it back to the user (see Figure 5.16).


    Tip: You can also open the e-mail attachment directly from your e-mail application.
    It will start VMware ACE Manager and load the .VMHR file to directly process the
    request.'
