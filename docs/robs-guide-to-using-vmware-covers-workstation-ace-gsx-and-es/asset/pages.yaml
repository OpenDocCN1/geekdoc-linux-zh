- pgno: 132
  md: '# 9 Optimizing your Virtual Machine Environment


    This chapter contains useful tips for optimizing the performance of your virtual
    machine, and to make your virtual environment easier to work with.


    # 9.1 Performance Tips


    A few basic tips can help you experience better performance in your virtual machines.
    First, make sure that you always install the VMware tools (especially for Windows),
    because together with the SVGA display driver, the performance with using the
    guest operating system is much better.


    +   - Disconnect the CD-ROM device


    If your guest operating system is trying to access the CD-ROM or DVD player, (either
    because you inserted a CD-ROM, or because the OS or an application is trying to
    read data from a CD-ROM that is not there), that process could slow down the host
    and guest.


    When your virtual machine is completely configured and the OS is installed, go
    to the virtual machine settings and set the CD-ROM device not to Connect at power
    on.


    ![](img/25fe75b93b97a021effaba85db112a52_132_0.png)


    Figure 9.1: Configure CD-ROMs as not connected by default.


    +   - Run in full screen mode


    In Windows, but especially in a Linux host working in the graphical environment
    is much faster if you run your virtual machine in full screen mode.'
  merge: -1
  img_proc: true
- pgno: 133
  md: "+   - **Disable visual effects and other unneeded features**\n+     Windows\
    \ contains a lot of features that enhance the user's experience. But all of that\
    \ costs in performance level and uses resources from the display environment.\
    \ Turn off this functionality (if you can do without it) in your virtual machine.\
    \ You can find these effects in the Display Control Panel.\n+   \n+   - **Remove\
    \ hardware that you don't need**\n+     It will not increase your performance\
    \ dramatically; however, if you remove devices that you do not need from your\
    \ virtual machine, such as the sound adapter and the USB bus, it will prevent\
    \ your guest from playing sounds that will be processed by the host's sound card.\
    \ Also, it will not attach USB devices to the virtual machine that it will start\
    \ to access.\n+   \n+   - **Use a second hard drive in your host**\n+     If you\
    \ will be running multiple virtual machines on your host system, you can increase\
    \ the performance by using multiple hard disks. Remember from the VMware introduction\
    \ that both the host and the guest are accessing their data on the same physical\
    \ disk. Therefore, splitting them up or running virtual machines from different\
    \ hard disks will increase performance, especially in the case of running disk\
    \ intensive applications within your guest operating systems.\n+   \n+   - **Use\
    \ a separate disk for your swap files**\n+     Just as with a real PC, it is a\
    \ good idea to have a separate swap partition for your OS. Of course, the best\
    \ thing is to prevent swapping in the guest operating system as much as you can,\
    \ by assigning enough memory to the virtual machine. This is an advanced topic\
    \ that you might want to investigate for your specific environment; however, if\
    \ for example the guest needs virtual memory (swap space) you could create a fixed\
    \ sized disk that holds the swap file. Also, make sure that the file is not defragmented\
    \ on your host system.\n\nThere is also another reason to use a separate swap\
    \ file disk that I find is more important for efficient use than for performance.\
    \ If you assign a virtual disk that will grow dynamically to your virtual machine\
    \ for use as a swap disk, you will see that it will become a large file. If you\
    \ want to archive the virtual machine, this swap file space can be easily reduced\
    \ by replacing it with an empty disk. To prepare this, I have created a swap file\
    \ on an NTFS partitioned virtual disk, which I have copied to a safe location\
    \ on my hard disk. If I am going to archive the virtual machine in a ZIP-file\
    \ or if I need to burn it on a CD-ROM or DVD, I replace the used swap disk with\
    \ this empty one. This way it does not take up space in the archive copy.\n\n\
    This method also keeps the virtual disk smaller which makes it more efficient\
    \ to shrink your disks."
  merge: -1
  img_proc: true
- pgno: 134
  md: '# 9.2 Shrinking your Virtual Disks


    Owners of multiple 400 GB hard disks in their PCs can skip this paragraph. Others,
    for whom hard disk space is limited, must read on to find out how they can save
    valuable disk space.


    Your virtual hard disk files will grow dynamically. They start with a few megabytes
    but could become very large. After installing an operating system, your hard disk
    could be well over 2 GB, even if the OS you have installed only takes 1 GB of
    disk space. There are several reasons why your virtual disk will grow more than
    you would expect. During installation, for example, temporary files are copied
    to the hard disk, some times being unzipped locally. After that they are copied
    to the correct location on your hard drive and your temporary files are deleted
    again.


    The installations of service packs, patches, and software applications will also
    work with temporary files on your virtual hard disk, causing your virtual disk
    to grow larger and larger. Dynamically growing disks are not automatically shrunk
    in size. Your virtual machine will re-use space available in the virtual disk
    file, but in the end your virtual disk file will grow larger than you need it
    to be.


    The shrink process itself should start preferably from the VMware tools Properties
    window in your guest operating system.


    Figure 9.2 is from a Windows guest, but the same window and options are available
    for NetWare and Linux.


    ![](img/25fe75b93b97a021effaba85db112a52_134_0.png)


    Select the disks that you want to prepare and click Prepare to shrink. This process
    will take from a few minutes to half an hour depending on the size of your virtual
    disk, and of course the performance capability of your host''s hard disk.


    Figure 9.2: Virtual disks must be prepared for shrinking.


    Tip: You can shrink your disks from the command line with the Virtual Disk Manager.
    This is discussed in section 7.3: "Using Virtual Disk Manager".'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'When the prepare for shrinking process is complete, you are asked if you want
    to run the shrink operation at that point. If you click yes, VMware will start
    to create a temporary file that it will use during the shrink process. You will
    need to have at least as much hard disk space available as what your virtual disk
    is using on your hard disk, before the shrink operation is complete.


    > Tip: For all operating systems it is a good idea to remove unnecessary files
    from the guest operating system''s hard disk. Remove large files, temporary files,
    etc. Specific tips on Windows and NetWare can be found in chapter 9.


    # 9.3 Archiving your Virtual Machines


    Working with VMware is very efficient, because you do not need extra PCs and a
    new PC with a new operating system is up and running in less than an hour. If
    you are working with new PCs with the same operating system repeatedly, you will
    find that it is useful to have a working copy of a virtual machine with that OS,
    which you can start with. This section will provide you with a few tips to work
    even more efficiently with VMware.


    Archiving virtual machines is not only about storing them on a safe location to
    use them later, but also to have a copy that you can use as your starting point
    for future projects. The method described here also helps you save your virtual
    machine on one or more CD-ROMs or DVDs.


    > Tip: For virtual machines that will contain a large amount of data use virtual
    disk files that are split up in 2 GB parts. That will make it easier to archive
    the files on multiple CD-ROMs (zipped per file) or DVDs.


    # Remove snapshots


    Before archiving your virtual machine, remove the snapshot you have taken. The
    original .vmdk file will be untouched and extra s###.vmdk files are created. Together,
    they will take up more disk space than actually in use by the guest operating
    system.


    # Shrink your disks


    Use the shrink process described in the previous paragraph to decrease the size
    of your virtual disk. If you have chosen to use a separate disk for the swap file
    for your guest operating system, you can now also replace that .vmdk file (with
    an original smaller one) and save it in a safe location.


    # Power off your virtual machine


    Do not copy or ZIP your virtual machine in a suspended state. It would work if
    you resume the virtual machine on the same PC with the same version of VMware.
    Resuming the virtual machine on another PC, with a different CPU in the future
    or with a newer version of VMware, will most likely result in error messages.
    Also, you have to discard the saved memory state file (VMSS) anyhow.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# Exit VMware


    When you copy your virtual machine or create a ZIP file, do not do that when the
    machine is still open in VMware. There will be lock files in your archive and
    that does not look nice or clean.


    # Delete any unnecessary files


    You can delete the .log file and vmware-core dump file (if it exists) to clean
    up your virtual machine directory before you archive or ZIP it.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# 10 Transferring Data To and From a Virtual Machine


    Your virtual environment will not be a static environment. You will probably have
    to install applications in your virtual machines or you may have created data
    inside of your virtual machine that you need to store on another computer. This
    chapter describes several ways in which you can do that with the VMware built-in
    functionality and by using other methods.


    To install software inside a virtual machine, you can do it the same way you would
    normally do on a physical computer. You can attach a CD-ROM drive, floppy drive,
    or USB storage device to your machine to install the software from a removable
    device. But if the installation source resides on your host computer, you can
    also directly access it. There are many ways to transfer not only software but
    also data to and from a virtual machine. Let’s see how.


    There is also an advanced method available with the VMware DiskMount utility.
    Section 7.4: “Using the DiskMount Utility” explains how to use this utility in
    detail.


    # 10.1 Using the Clipboard (Windows only)


    Windows contains a clipboard which can hold all sorts of data, such as text files,
    images, and so on.


    VMware Workstation supports transferring text fragments (no images) between the
    host and the guest or between two guests.


    The contents of the clipboard is accessible via the default keys (Ctrl-C Ctrl-X
    Ctrl-V) and viewable with the ClipBook viewer (CLIPBRD.EXE)


    This feature is turned on by default and can be turned off via Edit → Preferences
    → Input tab (see Figure 10.1). Disable the checkbox to disable this feature if
    needed.


    ![](img/25fe75b93b97a021effaba85db112a52_137_0.png)'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# 10.2 Using Drag and Drop (Windows only)


    The Drag and Drop feature allows you to pick a file or folder from the host and
    drag it into the guest or vice versa. To use this feature, you must have installed
    the VMware tools in your Windows guest operating system.


    The procedure works in the same way as dragging and dropping files or folders
    in the host or inside the guest operating system. The files will be dropped at
    the location where you point your mouse pointer and release the mouse button.
    The file will be stored in a temporary location in the virtual machine or the
    host (%TEMP%\VMwareDnD). From there, it is transferred to the application where
    you dropped the file such as Windows Explorer, the desktop, or any other application
    that you have running which supports files being dropped into it.


    This feature is enabled by default. To disable this feature, open the Virtual
    Machine Settings and select the Guest Isolation entry in the Options tab (see
    Figure 10.2). Enable the checkbox to Disable drag and drop to and from the host
    and the virtual machine.


    ![](img/25fe75b93b97a021effaba85db112a52_138_0.png)


    Figure 10.2: Drag and drop is enabled by default on Windows.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# 10.3 Using Shared Folders (Windows and Linux)


    Transferring data to and from a virtual machine became very simple when VMware
    introduced this feature into VMware Workstation with version 4. You can easily
    assign a folder on your host operating system which will become visible in your
    virtual machine. You must have the VMware tools installed for this feature to
    be available.


    For both Windows (NT/2000/2003/XP) and Linux (Kernel 2.4 and higher), enable this
    feature from the Virtual Machine Settings. Shared Folders can be configured and
    enabled, even when the virtual machine is running. The Shared Folders functionality
    is enabled by default, but no folder sharing will be configured. In the Shared
    Folder window, click the Add button to specify a host folder to be attached to
    your virtual machine. This will start the Shared Folder Wizard.


    ![](img/25fe75b93b97a021effaba85db112a52_139_0.png)


    Figure 10.3: Creating a shared folder for a virtual machine.


    Specify a name for this shared folder which will be used inside your guest operating
    system (for Linux this is case sensitive).


    Click Next to specify additional settings for this Shared Folder:


    +   - Enable this share (checked by default)

    +     The share will be available immediately after closing the wizard.'
