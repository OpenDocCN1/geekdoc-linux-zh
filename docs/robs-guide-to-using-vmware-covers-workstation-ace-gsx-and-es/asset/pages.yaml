- pgno: 241
  md: '19. To enable the SCSI Reservation on the SCSI Bus and to disable the disk
    locking, add the following lines to the .vmx files of both virtual machines. First,
    power down both the servers and close the VMware application. It is always a bad
    idea to manually edit the .VMX files while the application is running. It does
    not matter where in the file you add these lines.


    ```

    disk.locking = "false"

    ```


    ```

    scsil.sharedBus = "virtual"

    ```


    This setting enables SCSI sharing for the entire SCSI1 bus. If you do not want
    to share the entire bus, but instead you want to share individual disks on that
    bus, you can also configure an individual disk to be shared with the entry:


    ```

    scsi1:1.shared = "true"    (1:1 specifies the second disk on

    the second SCSI bus.)

    ```


    20. Save the .VMX files, and open the virtual machine software without powering
    the machines on.


    # Where to go from here


    At this time, if you have started both servers and configured the SCSI reservation
    correctly, then when the virtual machines are powered on, a file called <diskname>.vmdk.RESLCK
    will be created in the same directory as your shared disk.


    # For NetWare


    Once the servers are up and running, we may need to activate the SCSI hard disk
    driver, depending on your version of NetWare. This is explained in section 14.7
    "Using SCSI drivers in older NetWare servers". After that, install the cluster
    services as described in chapter 28 "Installing Novell Cluster Services".


    # For Windows


    Leave the servers powered off and continue with the configuration of Microsoft
    Cluster Services as described in chapter 29: "Configuring Microsoft Cluster Services
    Software".'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# 27 Shared Disk Cluster with VMware ESX Server


    This chapter covers the installation of two virtual machines with a shared SCSI
    disk. It will help to prepare for the installation of Novell Clustering Services
    or Microsoft Cluster Services software. This part is generic for NetWare and Windows.
    At this point you should have created at least two virtual machines with an operating
    system (Windows, Linux or NetWare) and the VMware tools installed. Power both
    virtual machines off to start the clustering configuration.


    ⚠️ Note: The example in this chapter is based on the configuration with the Management
    Interface. All configuration steps can also be performed from VirtualCenter. If
    you have this software installed, it should not be too difficult to translate
    the configuration options for your virtual machines from the Management Interface
    to VirtualCenter.


    +   1. In the Management Interface, click on the virtual machine name (hyperlink)
    to open the configuration window. Go to the Hardware tab or select Configure Hardware
    from the popup menu to go to that tab directly.

    +   2. Click the link for Add device at the bottom of the hardware configuration
    tab. See Figure 27.1 for the location of this option.


    ![](img/25fe75b93b97a021effaba85db112a52_242_0.png)


    Figure 27.1: Add the shared virtual disk from the Management Interface.


    3. Select Hard Disk as the device type to be added. This will start the virtual
    disk configuration wizard. In the wizard, select to create a blank virtual disk.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '4. In the next configuration window, select the location and the size of the
    virtual disk file. 500 Mb is sufficient for the Quorum disk in Windows and the
    SBD disk in NetWare. Assign the disk to virtual SCSI adapter 1 (see Figure 27.2).
    Shared disks must be assigned to a separate controller. Leave the Disk Mode setting
    at the default setting of Persistent.


    ![](img/25fe75b93b97a021effaba85db112a52_243_0.png)


    Figure 27.2: Assign the shared virtual disk to a separate SCSI adapter.


    5. In the Hardware configuration tab of the virtual machine, select edit for SCSI
    Controller 1 which was added after adding the disk in the previous step. Set the
    Bus Sharing option to virtual (see Figure 27.3).


    ![](img/25fe75b93b97a021effaba85db112a52_243_1.png)


