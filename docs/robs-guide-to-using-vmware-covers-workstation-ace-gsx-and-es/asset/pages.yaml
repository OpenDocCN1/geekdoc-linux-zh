- pgno: 314
  md: '# 38 VMware ESX Server Introduction


    If you have worked with VMware Workstation or with VMware GSX Server, then you
    understand the concept of virtual machines. You know that multiple virtual machines
    can run on top of one hardware box and share resources such as memory, CPU, and
    hard disk. This is also true for VMware ESX Server, but it is also where the comparison
    stops: it is a hardware box that runs virtual machines. The way that you create
    them seems to be the same but there are important differences. Also, the VMware
    ESX Server configuration and management are completely different from VMware Workstation
    and they are more advanced than for VMware GSX Server.


    This chapter serves as an introduction to VMware ESX Server. If you have worked
    with this product already, you should not find anything new here. I expect that
    you are familiar with VMware''s hosted products such as Workstation or GSX Server,
    so I will start with an overview of the similarities and differences between these
    products and the VMware ESX Server. Afterwards, I will go into detail on what
    hardware and software you need to run a server and how to perform a simple installation.


    # Hosted versus native operating system


    The biggest difference is that VMware ESX Server is not a so called “hosted product”.
    You do not install Windows or Linux on the hardware box which you use for your
    server. Instead, the installation procedure installs a version of Linux that has
    been modified by VMware to be used solely for running virtual machines. You can
    login to the Linux environment to perform maintenance or configuration tasks,
    but it is not the intention of VMware to let you install your own additional Linux
    software onto the ESX Server. Running a dedicated Linux version may seem to bring
    limitations to your environment because you can not install the drivers or software
    which you might find useful. But on the positive side, this is exactly why VMware
    ESX Server is so powerful. All the drivers for the supported hardware are included
    and with the VMware approved drivers and software, you get an ultra stable operating
    environment for your virtual machines.


    # Fixed sized virtual disks


    Creating virtual machines may look the same as in VMware Workstation of VMware
    GSX Server if you see it for the first time, but there are a few significant differences.
    First, you will have to allocate all the needed disk space for the virtual machine
    at the time of creation. There is no such thing as dynamically growing virtual
    disks. These virtual disk files are stored on the special VMFS file system, which
    is optimized for these large files. Also, the virtual disks in your virtual machines
    will always use an SCSI disk and will need to be stored on a physical SCSI disk
    as well. This is because it is the only disk type that is supported for the VMFS
    file system.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# Only remote management


    For the management of your virtual machines, you rely solely on remote management
    with a web-based management interface, the remote console client application,
    or the additional VMware product VirtualCenter. You can change the status of a
    virtual machine from the command line in the Linux environment, but there is no
    graphical environment to work with the virtual machine locally on the ESX Server.


    # Advanced memory management


    Some of the memory management technologies from ESX server have been implemented
    in the recent version of VMware Workstation. When VMware follows its own regular
    product feature roadmap, some of it will also be implemented into GSX Server in
    the future. But even then, it will never be able to come close to what ESX Server
    can do to get the most out of your hardware.


    # High availability and scalability


    A single VMware ESX Server will already give you a higher availability than what
    you can normally get with individual servers. The selection of supported hardware,
    together with a dedicated operating system and drivers make it a very stable platform.
    Of course, you can still encounter a hardware problem or some peak usage of your
    virtual machines, which may impact the performance in a negative way. When running
    two or more VMware ESX Servers that are connected to a Storage Area Network (SAN),
    you can achieve a higher availability level and it becomes possible to manually
    balance the load of the virtual machines between your servers. The magic words
    here are VirtualCenter and vMotion. With this software which you can purchase
    from VMware, it is possible to migrate a running virtual machine from one ESX
    Server hardware box to another. To be able to do this it is required that the
    virtual machine''s hard disk file is on the SAN and it can be accessed by both
    servers. The magic trick to moving the machine is to copy the memory pages from
    server to server and when the machine is completely copied, to activate it on
    the other server. The time needed to switch the machines is so short that your
    client workstations will never be impacted by it.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# 39 Getting Started with VMware ESX Server


    Now that we have looked into what VMware ESX Server is, compared to the hosted
    products, it is time to take a look at what you need to get started. First of
    all, you need the software. You can not simply download an evaluation copy from
    the VMware website. However, you can request an evaluation version, by contacting
    VMware sales directly or by contacting your local VMware reseller. They will then
    set you up for an evaluation account which allows you to download the software
    and use it for 30 days. The software comes as an ISO-file which you will have
    to burn to a CD-ROM.


    Tip: You can also get the software when you have a subscription to VMware Technology
    Network.


    Next, you will need hardware. You can not just rip a PC from your company''s PC
    graveyard or from your basement which is filled with old hardware. You will need
    real server class hardware to run VMware ESX Server. First of all, this is because
    there are some special requirements that you need to meet. One of them is that
    you must use an SCSI disk to store the special VMFS file system. You can not do
    that on an IDE disk. In addition, you will also need the correct disk or host
    bus adapters and network adapters to work with VMware ESX Server. They are typically
    available in the server class hardware which you will find on the requirements
    list on VMware''s website at the following URL:


    ```

    www.vmware.com/support/resources/esx_resources.html

    ```


    Note: It is still possible to use an older server that has an SCSI controller
    or RAID adapter for a testing environment or to use it when you want to learn
    how to get started with the VMware ESX Server. But it is definitely not what you
    want to do for your production environment. Last but not least, you will experience
    a lack of support from VMware if you do not stick to their list of supported hardware.


    # Hardware requirements


    A fully detailed hardware configuration guide is beyond the scope of this introductory
    section. To set up the hardware for your environment, for example when choosing
    the amount of memory you need or disk space requirements, there are many parameters
    that you need to take into consideration. You will need to look at how much memory
    your virtual machines will use, how much data they need to store, etc. However,
    I will give you a short list of what hardware you need to set up an ESX Server
    in general.


    # Processor


    VMware requires a minimum of two CPUs, as you can see on their website. The software
    does, however, run with one single CPU. Not that I recommend that option for your
    production environment, but for testing and educational purposes, you can install
    with only one processor.'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# Other requirements


    For the rest, you need this hardware for a minimal installation:


    +   - 512 MB RAM

    +   - Two Ethernet controllers. Supported types are:

    +     - Broadcom NetXtreme 570x Gigabit controllers

    +     - Intel PRO/100 and PRO/1000 adapters

    +     - 3Com 9xx based adapters

    +   - Disk controller:

    +     SCSI:

    +     - Adaptec

    +     - LSI Logic

    +     - most NCR/Symbios adapters

    +     RAID:

    +     - HP Smart Array

    +     - Dell PercRAID

    +     - ServeRAID

    +     - Mylex RAID

    +     Fibre Channel:

    +     - Emulex

    +     - QLogic

    +   - SCSI disk or assigned LUN from your SAN


    With the above hardware, you can set up a basic ESX Server. But you probably realize
    that with 512 MB RAM there is not much memory left for running the virtual machines.
    So, you will at least need to add more RAM. One Ethernet adapter will be used
    for the Service Console and the other one for the virtual machines.


    It is always best not to share resources with the virtual machines environment
    if it is not necessary. This would leave one Ethernet adapter that all your machines
    are using. It is better to have more network adapters to divide the load, especially
    for virtual machines that generate a lot of traffic.


    It is also preferable to have multiple disks, and it is even better to have multiple
    disk controllers. It is not hard to understand that four virtual machines reading
    and writing to their virtual disk files on one single disk will not be as efficient
    as the same virtual machines that write to virtual disk files which are on separate
    disks.


    You might notice that only SCSI disks are listed in the hardware requirements
    list. So, does that mean that you can not install VMware ESX Server on a machine
    with only IDE devices? The answer is yes, but! The operating system part of VMware
    ESX server for running the Service Console could run on an IDE hard disk. However,
    the VMFS file system to which you need to store your virtual machine virtual disk
    files can only be created on SCSI devices.'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# 39.1 Installing VMware ESX Server


    At this point, I am assuming that you have your hardware set up and configured
    and that you have the VMware ESX Server installation CD-ROM available. The most
    recent version at the time of writing this book is ESX Server 2.5.1, build number
    13057.


    You start the installation by booting your server from the CD-ROM. After booting
    the Welcome screen, displayed in Figure 39.1, it will prompt you to select your
    preferred installation method.


    ![](img/25fe75b93b97a021effaba85db112a52_318_0.png)


    Figure 39.1: The welcome screen lets you choose from several installation options.


    If you do not select any of these options, then the installation will automatically
    continue with the graphical installation interface.


    If you have any problems with graphics during the installation, select the text
    installation option for a non-graphical installation. Other installation options,
    such as configuring booting from a SAN are beyond the scope of this introductory
    section.


    Tip: You might ask yourself: how did he create those screenshots of a bare metal
    installation process? The answer is simple: you can run through the installation
    of VMware ESX Server in a VMware Workstation virtual machine.'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'Follow the these steps to go through the ESX Server installation. These steps
    assume that you are running a normal graphical mode installation.


    +   1. After selecting the installation type, the graphical welcome screen will
    be displayed. Click Next to continue.

    +   2. Next, select a default or custom installation.

    +   3. If you have selected a custom installation, you will be prompted with a
    keyboard and mouse configuration screen. Select the correct keyboard layout and
    click Next.

    +   4. In the next screen, select the correct mouse type and click Next.

    +   5. The End User License Agreement is displayed. Read and click the checkbox
    if you accept the agreement. Click Next to continue.

    +   6. The next screen is the Serial Number screen. Enter your ESX Server serial
    number and the Virtual SMP serial number if you have bought this additional product.
    You can skip this step and enter the serial number later. But, you will not be
    able to start any virtual machines.

    +   7. In the next screen, you must set up your hardware devices. Figure 39.2
    shows an example of the hardware configuration screen.


    ![](img/25fe75b93b97a021effaba85db112a52_319_0.png)


    Figure 39.2: During installation, you must assign hardware to the service console
    or to the virtual machine environment.'
  merge: -1
  img_proc: true
- pgno: 320
  md: 'With VMware ESX Server, you must always use at least two network adapters.
    You can see that one of them is assigned to the Service Console. This is where
    you connect to for management with the Management Interface and VirtualCenter.
    Disks can also be used for the Service Console only or the virtual machine environment;
    but, you can also share the disk space between them.


    Also displayed in Figure 39.2 is the memory reservation for the Service Console.
    The default assignment is 192 MB, which is based on running eight virtual machines.
    Table 39.1 shows your options, when assigning memory to the Service Console:


    # Table 39.1: Memory selection for the Service Console.


    | Amount of RAM | Number of Virtual Machines |

    |---|---|

    | 192 MB | Up to 8 virtual machines |

    | 272 MB | Up to 16 virtual machines |

    | 384 MB | Up to 32 virtual machines |

    | 512 MB | More than 32 virtual machines |

    | 800 MB | Maximum amount of virtual machines |


    8. In the next screen, you must choose between manual or automatic partition.
    With the automatic selection, the installation process will propose a partition
    scheme for your disks. With the manual selection, you will have to create all
    partitions from scratch. The default partition table for the automatic installation
    is displayed in Figure 39.3.


    ![](img/25fe75b93b97a021effaba85db112a52_320_0.png)


    Figure 39.3: The default partitioning scheme for automatic partitioning.'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'You will need at least these partitions, listed in Table 39.2.


    # Table 39.2: Required partitions for an ESX Server installation


    | Function | Mount point | Type | Size |

    |---|---|---|---|

    | Boot partition | /boot | ext3 | 50 MB |

    | Root partition | / | et3 | 2500 MB |

    | Swap partition | swap | swap | 2 x amount of RAM assigned to the Service Console
    |


    9. The next screen allows you to specify the network specifications for the first
    network adapter. Other adapters will be configured after the installation. You
    can choose between a DHCP configuration, and a static configuration. It is common
    practice to use a fixed address for your servers in general.


    You could configure your DHCP server to assign the IP address based on the host''s
    MAC address to always use the same address. Or, you can use a host name in your
    DNS server that is dynamically updated by your DHCP server. However, I really
    think that a fixed IP address is just as simple and practical.


    10. In the next screen, select the time zone where your server is located.


    11. You will now be prompted for a root password. In this screen you can also
    create additional user accounts. It is always a good idea to create at least one
    account that you will be using to work with your server. It is not good practice
    to work with the root account on a daily basis.


    12. After setting up the user accounts, a new screen will let you start the actual
    installation. It also shows you where the installation log file will be located.
    By default, this location is /tmp/install.log. The installation program will also
    write the choices that you have made during installation to a Kickstart file called
    /root/anaconda-ks.cfg.


    13. After all the packages have been installed, the system can be rebooted to
    start the ESX server.'
  merge: -1
  img_proc: true
- pgno: 322
  md: 'When the ESX Server is rebooted after installation, the welcome screen (shown
    in Figure 39.4) is displayed. It will tell you what the host name of the ESX server
    is and how you can access it with Management Utility. You will also see a message
    which tells you that you can login to the service console locally, by pressing
    Alt-F2. This will open a new TTY terminal, where you can login. When you are logged
    into another terminal, you return to the initial welcome screen by pressing Alt-F1.


    ![](img/25fe75b93b97a021effaba85db112a52_322_0.png)


    Figure 39.4: The welcome screen explains how to access the ESX Server.


    To manage your ESX Server, login to Management Interface by pointing your browser
    to http://ipaddress or http://hostname. You should login as the root user.'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# 39.2 Post Installation Tasks


    When you login to the Management Interface for the first time, you will see two
    warning messages that will tell you what you need to configure after the installation
    is complete:


    +   - Swap space

    +   - Virtual Ethernet Switches

    +   - Configure ESX Server storage


    ![](img/25fe75b93b97a021effaba85db112a52_323_0.png)


    Figure 39.5: After initial login swap space and networking must be configured.


    # Configuring swap space


    Click the link next to the error message to assign swap space for your ESX Server
    environment. If you remember, you also created a swap partition during the initial
    installation. That one, however, was for use by the Service Console. The swap
    space that you are going to define here is for the virtual machine environment
    itself.'
  merge: -1
  img_proc: true
- pgno: 324
  md: '![](img/25fe75b93b97a021effaba85db112a52_324_0.png)


    Figure 39.6: After installation, create swap space for your virtual machine environment.


    The configuration screen will suggest a minimum amount of swap space. I recommend
    that you create a swap file that is at least twice the size of the amount of memory
    that you have available in your server. But you probably need more. If you ever
    add memory to the server, you do not want to spend a lot of time creating a new
    larger swap file. For example, if you have installed 4 GB of RAM, you should create
    an 8 GB file. But I would just create a 16 GB swap file. That way, you will not
    run into too many problems when expanding the server''s memory.


    # Configuring Virtual Ethernet Switches


    Your VMware ESX Server should at least have one virtual Ethernet switch. When
    you select the reconfigure link next to the warning message, you will be guided
    through the switch configuration. The configuration screen will suggest a network
    name and will list the available physical adapters. You must assign at least one
    adapter to your new virtual switch.


    # Configure ESX server storage


    Your virtual machines must be stored on volumes that are of the VMFS type. You
    can configure these after the installation from the Options tab in the Management
    Interface. Click the link Storage Management to configure VMFS volumes to store
    your virtual disks.


    # 39.3 Upgrading your ESX Server


    From time to time there will be upgrades or patches for the ESX Server. It depends
    on your own environment if you need to install them, but a general rule is to
    always keep your systems up to date. Patches in general can help you prevent possible
    problems or performance bottle necks. ESX Server patches come as a compressed
    tarball. For example, esx-2.5.1-13057-upgrade.tar.gz upgrades it to the latest
    patch level for ESX Server 2.5.1.


    After downloading the patch, copy it to your ESX Server or when it is on a Windows
    Server or Linux host use a Samba or NFS mount to access the package.'
  merge: -1
  img_proc: true
- pgno: 325
  md: 'Note: To install the package, you must start the ESX Server with the regular
    Linux kernel. The VMkernel must not be running.


    Unpack the file with the following commands:


    +   1. Make a temporary directory, such as /tmp, your present working directory:

    +   2. Extract the file with the following command:

    +   3. Make the subdirectory, where the package is extracted to, the present working
    directory and execute the upgrade script. There will also be a README which you
    must read. It will tell you how to do the installation and it will warn you about
    any possible issues.

    +   4. The script will start to run and when it is finished it prompts you to
    reboot the server.


    ```

    cd /tmp

    ```


    ```

    tar zxf esx-2.5.1-13057-upgrade.tar.gz

    ```


    ```

    cd esx-2.5.1-13057-upgrade

    ```


    ```

    more README

    ```


    Tip: You do not have to enter the entire path. Just type the first letter and
    use tab to use the auto complete feature in Linux.


    ```

    ./upgrade.pl

    ```


    ![](img/25fe75b93b97a021effaba85db112a52_325_0.png)


    Figure 39.7: ESX Server upgrade.'
  merge: -1
  img_proc: true
- pgno: 326
  md: '# 40 Managing Virtual Machines


    This chapter contains information on the management part of VMware ESX Server.
    Almost no management is performed locally; everything is done via the Management
    interface or with Remote Console. In chapter 42 I will also introduce VMware VirtualCenter
    to manage the ESX Server.


    # 40.1 Using the Management Interface


    The Management Interface is always installed on your ESX server. It is important
    to get to know this utility because it is where you can configure everything for
    your ESX Server environment. If you have one or more servers, which may be combined
    with VMware GSX Servers in your environment, then you will probably want to look
    into VirtualCenter to manage your VMware servers. How to use this management application
    is explained in chapter 42.


    ![](img/25fe75b93b97a021effaba85db112a52_326_0.png)


    +   - Click here to access the VM''s overview and options window

    +   - Click here to access the power controls

    +   - Click here to bring up the configuration pop-up menu

    +   - Click here to open a console session to this machine


    Figure 40.1: Overview of the controls and information in the Management Interface.


    When you are logged in to the Management Interface for the first time, there will
    be no virtual machines configured. Once you have configured your first machine,
    you can use the controls that are shown in Figure 40.1. In addition to using these
    controls, you can also see how long the virtual machine has been up, how many
    processors the machine uses (if you have the Virtual SMP product), and what the
    CPU and RAM usage is.


    # Heartbeat


    One of the things I would like to explain about the Management Interface is the
    meaning of heartbeat, which is displayed next to the power control button of the
    virtual machines (in the HB column). When you have the VMware tools loaded inside
    your virtual machine, it will continuously send heartbeats to the ESX Server.


    When all the heartbeats have been received, within the minute before the screen
    was refreshed, the percentage of received heartbeats is 100% and the indicator
    will be green. When all the heartbeats are not received, the percentage drops
    and the indicator will be orange. When the tools are not loaded, the indicator
    will be greyed out because in that case the heartbeat is not available at all.'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'Tip: If you notice strange heartbeat behavior, such as when the percentage
    is low but the virtual machine is actually performing very well by itself, check
    whether you have the correct version of VMware tools loaded inside the guest operating
    system.


    # Adding a virtual machine


    When you are at this point in the configuration, I expect that you have already
    created you first virtual machine. In the Management Interface, click the link
    for Add Virtual Machine and follow the instructions. I will not go into a lot
    of detail about creating virtual machines here. The information about virtual
    machines in the first part of this book regarding installation of Windows, Linux,
    and NetWare and the installation of the guest OS tools is identical for virtual
    machines that you create for your ESX Server. There are a few specific configurations
    that I would like to discuss, because they are ESX Server specific.


    # Using multiple processors


    This is one of the first additional configuration options which you will see when
    creating virtual machines. If you own a license for VMware''s additional product
    Virtual SMP, then you can assign a maximum of two CPUs to the machine for the
    guest to use.


    ![](img/25fe75b93b97a021effaba85db112a52_327_0.png)


    When the virtual machine is created, regardless of whether you have the Virtual
    SMP product, if you have multiple processors, then you can configure which CPUs
    can be used by the virtual machine and which ones can not. This can be done from
    the CPU tab in the virtual machine configuration screen.


    Figure 40.2: A virtual machine can be configured to run on specific processors.


    # Adding virtual disk files


    The next step in creating a virtual machine is to assign a virtual disk. You can
    choose to use an existing one or to create a new one. If you have a SAN, you can
    also assign physical LUNs to a virtual machine to be used.'
  merge: -1
  img_proc: true
- pgno: 328
  md: '![](img/25fe75b93b97a021effaba85db112a52_328_0.png)


    A difference that you will notice if you have worked with other VMware products
    is that you can not store the virtual machine files in a directory hierarchy.
    You can only select available storage from the ESX server and assign a name to
    it. The files are just stored in the root of the partition. Another thing is that
    hard disk space is always pre-allocated to the virtual disk file. The dynamically
    growing scheme does not apply for ESX Server.


    Figure 40.2: Adding disk to the new virtual machine.


    # 40.2 Using ESX Server Remote Console


    Access to the console of the virtual machines on your ESX Server is provided with
    the Remote Console utility. The easiest way to get this software is to click the
    download link at the bottom of the Management Interface web page.


    # Windows installation


    To install the client application on a Windows computer, you should simply run
    the executable that you download. At the time of writing this book, this is the
    file VMware-console-2.5.1-13057.exe. After installation, you can simply start
    the application by selecting the VMware virtual machine Console shortcut from
    Start → Programs → VMware.


    # Linux installation


    The easiest way to install the client application on a Linux computer is to download
    the RPM package (VMware-console-2.5.1-13057.i386.rpm) and let it install automatically
    with a package manager.


    Many recent Linux distributions come with the RedCarpet client. When you choose
    to download the RPM from a browser, one of the choices you will have is to open
    the file with RedCarpet. If you do that, the only extra step left is to click
    Continue in the summary window as displayed in Figure 40.4.'
  merge: -1
  img_proc: true
- pgno: 329
  md: '![](img/25fe75b93b97a021effaba85db112a52_329_0.png)


    Figure 40.4: Using RedCarpet is the easiest way to install the Linux version.


    You can also manually install the RPM version by using the following command:


    ```

    rpm -Uhv VMware-console-2.5.1-13057.i386.rpm

    ```


    The version number in this example can of course be different if you are using
    a newer version of the software.


    If you do not have RedCarpet or for any other reason, you do not want to install
    the application from RPM, you can download the tar version (VMware-console-2.5.1-13057.tar.gz).


    If you have the tar archive on your system, you have to decompress and extract
    it. You can do that simultaneously, by using the z and x parameters:


    ```

    tar -zxf VMware-console-2.5.1-13057.tar.gz

    ```


    The archive will be extracted into a subdirectory called vmware-console-distrib.
    Use the cd command to enter that directory and start the installation from there:


    ```

    vmware-console-distrib

    ```


    ```

    ./vmware-install.pl

    ```


    This will start the VMware virtual machine console installation script. I have
    listed the questions and the default answers here, for your reference. In most
    cases, you can leave the defaults in place. First, you need to read and accept
    the end user license agreement.'
  merge: -1
  img_proc: true
- pgno: 330
  md: '+   1. In which directory do you want to install the binary files?

    +      `/usr/bin`

    +   2. In which directory do you want to install the library files?

    +      `/usr/lib/vmware-console`

    +   3. In which directory do you want to install the manual files?

    +      `/usr/share/man`

    +   4. In which directory do you want to install the documentation files?

    +      `/usr/share/doc/vmware-console`


    After the installation has been completed, you will be prompted to run the configuration
    script. You can answer yes. Or, you can run the script later with this command:


    ```

    /usr/bin/vmware-config-console.pl

    ```


    The only configuration script question that you will be asked is: What port do
    you want the remote console to use to connect to the server? The default answer
    is: 902.'
  merge: -1
  img_proc: true
- pgno: 331
  md: '# 41 Some Extra Tips on Using VMware ESX Server


    Once you get started with VMware ESX Server, most of the features you need are
    self explanatory. Or, you can also check the VMware online documentation. There
    are a few practical tips that I would like to give you to make your task of administering
    ESX server easier.


    # 41.1 Accessing the ESX Server''s File System Remotely


    When you get started with VMware ESX Server, you definitely need to become familiar
    with Linux. This product is based on Linux and uses all of the commands, utilities,
    and configurations that are common in the Linux environment. One of the specific
    items that you need to get used to is to access the ESX server''s file system
    from your Windows host, in many cases.


    A very easy and secure protocol to do this is SSH. It is available by default
    on all Linux hosts and there are many tools available for the Windows environment
    as well. A good starting point for any SSH related software is www.openssh.com.
    To use a secure shell session to your host, you can use PuTTY, which is available
    from www.openssh.com/windows.html.


    For transferring files, the utility WinSCP, based on Secure CoPy command (SCP)
    is very useful. You can download this tool from winscp.net.


    # 41.2 Creating an ISO Vault


    When you start installing operating systems, you probably want to do it by using
    ISO images. If you have only one ESX Server or GSX Server, then it is simple:
    just copy the files to that server and you are done. But most administrators have
    more than one server and you may already have a Windows or Linux server that stores
    your collection of ISO files.


    In either case, it is a good idea to point your ESX Server to that central location.
    If it is a Windows server, you can do this with the Samba protocol, and if it
    is a Linux host you can use NFS.


    Note: Since it will be a single point of failure, there are a few things to keep
    in mind when you use a central ISO storage location. Make sure to only connect
    ISOs to virtual machines during installation. Disconnect them when the machine
    is completely installed. If you leave them connected and the ISO is not available,
    it will result in an error message and the virtual machine might not start.'
  merge: -1
  img_proc: true
- pgno: 332
  md: "# Samba\n\nTo create the Samba share, use the mount command following this\
    \ syntax:\n\n```\nmount -t smbfs -o username=<user>,password=<pw>\n    //<ip |\
    \ host>/sharename <mount point>\n```\n\nTo mount the share to /mnt/iso as a special\
    \ user with read-only rights:\n\n```\nmount -t smbfs -o username=iso,password=secret\n\
    \    //isosrv/isos hare /mnt/iso\n```\n\nAlternatively, when you want to set this\
    \ up to be loaded automatically when your ESX Server boots, you want to add the\
    \ following to your /etc/fstab file. As an example for the previous command line:\n\
    \n```\n//isosrv/isos hare  /mnt/iso  smbfs\n    ip=isosrv,username=iso,password=secret,noauto\
    \ 0 0\n```\n\n# NFS\n\nWhen your files are on another Linux host, or an ESX Server,\
    \ you can set up an NFS export, to which your ESX Server can point to. On the\
    \ host where the files reside, create the export manually with the following command:\n\
    \n```\nexportfs <host>:/path\n```\n\nTo share the /iso directory with the host\
    \ called esx2:\n\n```\nexportfs esx2:/iso\n```\n\nTo permanently add this NFS\
    \ export to your host, add it to the /etc/exports file in the following, commonly\
    \ used format:\n\n```\n/iso/  esx1(ro,root_squash,sync)\n```\n\nOn the server,\
    \ where you want to configure access to the files, you first have to make sure\
    \ that the two necessary daemons are loaded. You can do this manually with the\
    \ following commands:\n\n```\n/etc/init.d/netfs start\n/etc/init.d/portmap start\n\
    ```\n\nWhen the daemons are loaded, use the following command to manually mount\
    \ the NFS location to a directory:\n\n```\nmount -t nfs <ip | host>:/path <mount\
    \ point>\n```"
  merge: -1
  img_proc: true
- pgno: 333
  md: 'To access the previously exported share on host esx1:


    ```

    mount -t nfs esx1:/iso /mnt/iso

    ```


    To permanently add this NFS mount to your server to be activated every time it
    starts, add the following line, based on the example, to the /etc/fstab file:


    ```

    esx1:/iso /mnt/iso nfs ro,rsize=1024,wsize=1024,noauto 0 0

    ```


    # 41.3 Maintenance and Troubleshooting Mode


    When the ESX Server boots, it uses the LILO boot loader to start the operating
    system. In the boot loader screen, you can choose to start ESX (default), or Linux.


    ![](img/25fe75b93b97a021effaba85db112a52_333_0.png)


    Use the Linux part to perform configuration and troubleshooting on the ESX server
    when needed. In this mode, virtual machines will not be started. So, if there
    are any problems during the boot process, use this mode to investigate and troubleshoot.


    Figure 41.1: The LILO Boot loader allows you to start the Linux part only.


    Tip: You can check which mode the server is started in, if you check the message
    on top of the second terminal (Alt-F2). When booted in ESX vmkernel mode, it will
    say: VMware ESX Server 2.5.1 (or any other version number). When booted in Linux,
    it will just say: Linux on the first line.'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# 42 Introduction to VirtualCenter


    In a multi VMware server environment, with GSX Servers, ESX Servers, or in a mixed
    environment, the management can very easily become very complex. To manage virtual
    machines, you must access several Management Interfaces on individual hosts. Also,
    accessing virtual machine console requires access to several hosts with the Virtual
    Machine Console utility. And when multiple administrators need to have rights
    to servers, which of course will be different levels of rights, it requires a
    lot of work to configure all them on individual hosts.


    To solve these manageability issues, VMware has created the VirtualCenter. With
    this application you can manage a mix of VMware GSX and ESX Servers. And it is
    also the platform that you must use when you want to use the vMotion application
    to perform transfers of virtual machines to other hosts.


    Another important feature of VirtualCenter is that it helps you evaluate the load
    of your virtual machine environment. Within one central location, you can monitor
    what all the servers are doing, and when the problems occur, and you can take
    the right action. VirtualCenter even enables you to assign actions to typical
    events and warn you, for example when CPU load reaches a threshold. Last but not
    least, VirtualCenter supports easy deployment of new virtual machines based on
    templates.


    Note: As was the case in chapter 1, which covered the ESX Server, this chapter
    is not a complete VirtualCenter manual. My intention is to get you started with
    the application in a clear and simple manner.


    Before we get into the installation of the product itself, there is some terminology
    that you need to be familiar with.


    # VirtualCenter Server


    This is a Windows-based application that runs on a Windows Server platform. It
    is the central node in the entire VirtualCenter infrastructure. It communicates
    with the VirtualCenter agents on the hosts and the administrators attach to this
    server with their client application.


    # VirtualCenter Client


    This is the Windows based application that an administrator runs to manage the
    virtual machine environment. The client application communicates with the VirtualCenter
    server.


    # VirtualCenter Agent


    This is the software that runs on every VMware GSX Server and ESX Server. It collects
    the information that is sent to the VirtualCenter Server and it performs the actions
    that are sent by the server.'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# VirtualCenter Web Service


    This is an optional component that can be installed to provide access to the VirtualCenter
    environment for third party developers, by using the Software Developer Kit.


    # 42.1 Installing VMware VirtualCenter


    This software must be installed on a Windows server. This server can be a physical
    one, but the VirtualCenter software itself can also run inside a virtual machine.
    Of course you will loose management capability when the host where that machine
    resides is off-line (unless you use vMotion first). But since you already have
    the VMware platform to consolidate all these servers that are typically not doing
    very much, it makes sense to look into a virtual VirtualCenter server.


    The latest version of the software is VMware-vpx-1.2.0-12684.exe and can be downloaded
    from VMware’s website if you own a license. Or, it can be obtained when you have
    a subscription to the VMware Technology Network.


    The installation is very straightforward so I will not cover it here. When the
    VirtualCenter server is installed and you start it for the first time, you are
    prompted to enter the serial numbers. VirtualCenter is licensed on a per host
    basis. So you enter a license for every GSX Server or ESX Server host that you
    want to manage.


    ![](img/25fe75b93b97a021effaba85db112a52_335_0.png)


    When the server is up and running, you can use the same installer to install the
    client on your workstation. When you start the application you are prompted to
    login. The user account you can use to log in is from the VirtualCenter Windows
    Server.


    Figure 42.1: VirtualCenter login.


    After your first login, you must create a “farm” of servers and add your hosts
    to your VirtualCenter environment. Perform the following steps to configure your
    environment:


    +   1. Right click Server Farms and select New Farm.

    +   2. Enter the name of your farm and press Enter.

    +   3. Right click the newly created farm and select Add Host.

    +   4. Specify the hostname or IP address for the GSX Server or ESX Server and
    the port number. This will be the same port (902 by default) which is used for
    VMware virtual machine console connections.'
  merge: -1
  img_proc: true
- pgno: 336
  md: '![](img/25fe75b93b97a021effaba85db112a52_336_0.png)


    Figure 42.2: To add a host, specify the IP address or hostname, and the port and
    provide a username and password.


    5. You can now organize your virtual machines in VirtualCenter. You can combine
    machines from different hosts into groups of virtual machines.


    # 42.2 Creating Virtual Machines with VirtualCenter


    VirtualCenter offers you full control over your GSX Server and ESX Server environment,
    including the creation of new virtual machines. You need to have permissions to
    create new machines. This will be discussed later.


    Before you start creating virtual machines on a GSX Server host, you must specify
    where the virtual machines will be stored. On an ESX Server, this is on your VMFS
    volumes. However, for the GSX Server you must specify the path in VirtualCenter
    if you want to create machines from this application. Right click the host that
    you want to configure and select Properties.'
  merge: -1
  img_proc: true
- pgno: 337
  md: '![](img/25fe75b93b97a021effaba85db112a52_337_0.png)


    Figure 42.3: For GSX Server, you must configure where the virtual machines will
    be stored.


    ![](img/25fe75b93b97a021effaba85db112a52_337_1.png)


    On a GSX Server you must also specify a network label for the networks you that
    have in the machine.


    This can be done from the local server console or the VMware Virtual Machine Console.
    It is the method used in Figure 42.4. The network configuration can also be set
    up from the Management Interface.


    Define a name for the network which you can easily identify when working with
    the VirtualCenter application.


    Figure 42.4: For GSX Server, you must configure a network label for the configured
    virtual networks.'
  merge: -1
  img_proc: true
- pgno: 338
  md: 'To create a virtual machine, perform the following steps:


    +   1. In your Farms view, select the GSX Server or ESX Server where you want
    to create the new virtual machine. Right click the host and select New virtual
    machine or select New virtual machine from the File menu.

    +   2. In the virtual machine wizard, select a typical or custom method. For this
    example, I have decided to use the custom method.

    +   3. Next, select where to place the virtual machine in VirtualCenter. Virtual
    machines can be grouped together; for example based on operating system, location,
    department, etc.


    ![](img/25fe75b93b97a021effaba85db112a52_338_0.png)


    Figure 42.5: VMs can be grouped to keep your VirtualCenter environment organized.


    +   4. Select which operating system you will be installing inside this virtual
    machine.

    +   5. Enter a name for your virtual machine and select the VMFS datastore that
    you want to store the virtual disk files (ESX) to, or the datastore that you have
    defined for your GSX Server that you want to store the machine''s files to.

    +   6. Select the number of processors to be used in this virtual machine. This
    is only available if you are configuring the machine for an ESX Server that has
    Virtual SMP installed.

    +   7. Assign memory to the virtual machine.

    +   8. Select the type of network for the virtual machine.'
  merge: -1
  img_proc: true
- pgno: 339
  md: '+   9. Select the SCSI bus type for this virtual machine: Buslogic or LSI Logic.

    +   10. Select a disk type to add to the virtual machine.

    +   11. Select the size for the virtual machine.

    +   12. Select a disk mode for the virtual machine.

    +   13. A window will be displayed, explaining that VirtualCenter is ready to
    submit the task to the ESX Server.


    # 42.3 Managing Virtual Machines with VirtualCenter


    After creating the virtual machine, you can manage it with the VirtualCenter client.
    Figure 42.6 shows an example of the VirtualCenter management interface.


    ![](img/25fe75b93b97a021effaba85db112a52_339_0.png)


    Figure 42.6: An example of the VirtualCenter Client application.


    To access the console of a virtual machine, you can select the Console tab in
    the client application. But you can also open a separate window with the console,
    if you right click the virtual machine and select Open Console from the popup
    menu. Or, you can select Open Console from the VM menu. Using the extra console
    instead of the one that is integrated in the Console tab allows you to access
    multiple virtual machines at the same time.'
  merge: -1
  img_proc: true
- pgno: 340
  md: '# 42.4 Cloning a Virtual Machine


    A virtual machine which is configured on an ESX Server or GSX Server can be cloned
    within the same host or to another host. This process will create an exact copy
    of the machine on the destination host. However, there are a few limitations to
    what is possible and a few things to keep in mind:


    +   - A virtual machine must be powered off before it can be cloned.

    +   - You can not clone a machine with an IDE hard disk from a GSX Server virtual
    machine to an ESX Server.

    +   - You can only clone machines within a farm, not to other farms.


    To clone a machine, perform the following steps:


    +   1. Right click the virtual machine in VirtualCenter and select Clone or select
    the Clone this Virtual Machine option in the machine’s summary screen.

    +   2. The Virtual Machine Clone Wizard will be started. The first thing you need
    to do is to specify the destination host for the virtual machine.

    +   3. Next, specify a group where the machine will be placed in the destination
    farm.

    +   4. Provide a name for the virtual machine to be used on the destination.

    +   5. Select a location for the virtual machine. For a GSX Server, this is one
    of the data stores that you configured initially. For an ESX Server, it is one
    of the available VMFS file systems. The checkbox to automatically start the virtual
    machine after creation is enabled by default.


    ![](img/25fe75b93b97a021effaba85db112a52_340_0.png)


    Figure 42.7: Select a destination for the virtual machine.'
  merge: -1
  img_proc: true
- pgno: 341
  md: '6. Specify the network to which the host will be attached.


    7. Specify the memory size for the clone.


    8. The last choice that you have to make is about customizing the guest operating
    system. You have three options:


    +   - Starting the guest customization wizard

    +   - Importing customizations from an XML file

    +   - Not customizing the guest operating system


    The guest customization helps you change the identification information for your
    guest. For Windows, this is workgroup and domain information, including the computer
    name, networking configuration, and the SID. For Linux, it is the host name, the
    dns domain suffix, and the networking configuration.


    To prepare for Windows guest optimization, download the sysprep package from www.microsoft.com/windows2000/downloads/tools/sysprep/default.asp
    and store the extracted files in the following files for the specific operating
    system versions:


    ```

    C:\Program Files\VMware VirtualCenter\resources\

    windows\sysprep followed by these subdirectories:

    \resources\windows\sysprep\1.1\

    \resources\windows\sysprep\2k\

    \resources\windows\sysprep\xp\

    \resources\windows\sysprep\svr2003\

    ```


    For Linux, the files must be stored in C:\Program Files\VMware VirtualCenter\resources\linux\tools.
    The tools can be downloaded from the following URL: www.vmware.com/download.


    9. When you choose not to configure the guest, the wizard ends here. When you
    do want to configure the guest operating system, the wizard for Windows or Linux
    starts to help you specify the information needed for the new virtual machine''s
    identity.


    10. When the clone process is submitted, you track it in the Tasks tab of the
    VirtualCenter application.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# 42.5 VirtualCenter Permissions


    For individual GSX Server and ESX Server hosts, you can configure user accounts
    and grant permissions to administrators for managing the virtual machine environment.
    With VirtualCenter, you can configure this on a central location and there is
    no longer a need to create local accounts on your server. You can create user
    accounts on the local server where VirtualCenter is installed, or you can use
    your existing Active Directory domain.


    Permissions can be assigned to the following objects:


    +   - Farm

    +   - Farm Group

    +   - Host

    +   - Virtual Machine Group

    +   - Virtual Machine


    To assign permissions, right click the object where you want to assign rights
    to, and select Add Permission. From the dialog box (see Figure 42.8), select the
    users or groups that you want to assign rights to and click Add. Or, click Remove
    to delete previously assigned rights.


    ![](img/25fe75b93b97a021effaba85db112a52_342_0.png)


    Figure 42.8: Users and groups can be granted permissions for VirtualCenter.'
  merge: -1
  img_proc: true
- pgno: 343
  md: 'There are four permission levels you can configure:


    +   - **Read Only User**

    +     Users with this permission can view the state of virtual machines, hosts,
    farms and groups.

    +   - **Virtual Machine User**

    +     With this permission a user can perform power operations and interact with
    the virtual machine console. The user can not modify any properties of the virtual
    machine.

    +   - **Virtual Machine Administrator**

    +     Users that are assigned this permission can:

    +     - Connect and disconnect virtual machine devices, migrate with VMotion,
    clone, remove, and configure virtual machines.

    +     - Create, import, and deploy templates.

    +     - Add and remove hosts from farms.

    +     - Create, remove, or modify farms, farm groups, and virtual machine groups
    and their content.

    +     - Cancel running operations.

    +   - **VMware VirtualCenter Administrator**

    +     A user with this permission has all rights to the VirtualCenter environment
    and can also grant permissions to other users.


    The permission assignments use a hierarchical model with inheritance. Permissions
    assigned to a farm will also apply to all objects within that farm. This feature
    provides you the capability to assign rights to administrators in various ways.
    For example, when you have a group of database administrators that need to have
    console access to their database servers, you can give them the Virtual Machine
    User permission for the virtual machine group that contains all the database servers.


    ⚠️ Note: Rights that are configured at a higher level can not be restricted at
    a lower level. For example, once you are a virtual machine administrator at the
    farm level, you can not be assigned as a Read Only User at an individual virtual
    machine in that farm.


    When a user is removed from the Windows accounts database, that user also loses
    his or her rights in VirtualCenter.'
  merge: -1
  img_proc: true
- pgno: 344
  md: '# 42.6 Working with Events and Alarms in VirtualCenter


    VirtualCenter provides a central location for accessing all the events on your
    GSX Server and ESX Server hosts: In the events window, you can see informational
    messages, warnings, and critical errors. You can view events for all systems by
    clicking the Events button in the main toolbar. Or, you can look at events on
    a farm, group, host, or virtual machine level.


    ![](img/25fe75b93b97a021effaba85db112a52_344_0.png)


    Figure 42.9: VirtualCenter collects events from all hosts in your environment.


    When browsing through the events list, you can select individual events to get
    more information about the event in the Event Details window.


    # Alarms


    The events are based on the built-in alarms, among other things. You can also
    define custom alarms in VirtualCenter. You can define triggers that you want to
    monitor. When the specified event occurs, or when a configured threshold is reached,
    the alarm will be triggered and the defined action will be executed.


    You can define alarms at the farm, group, host and virtual machine level. Only
    when you select the farm option, you will have to choose between a virtual machine
    alarm, and a host alarm. In all other cases when you select a host, it will be
    a host alarm and when you select a virtual machine or group it will be a virtual
    machine alarm.


    Alarms are applied by using a hierarchical system where alarms will not be overwritten
    by alarms that are configured at a lower level. The alarm settings are cumulative
    when looking at the effective alarms for an object.'
  merge: -1
  img_proc: true
- pgno: 345
  md: 'There are four triggers that you can use to monitor your virtual machines.
    They are listed in Figure 42.10:


    +   - VM CPU Usage

    +   - VM Memory Usage

    +   - VM Heartbeat

    +   - VM State


    ![](img/25fe75b93b97a021effaba85db112a52_345_0.png)


    Figure 42.10: Triggers for virtual machine alarms.


    There are three triggers that you can use to monitor your ESX Server or GSX Server
    host. They are listed in Figure 42.11:


    +   - Host CPU Usage

    +   - Host Memory Usage

    +   - Host State


    ![](img/25fe75b93b97a021effaba85db112a52_345_1.png)


    Figure 42.11: Triggers for host alarms.


    When defining a trigger, you need to specify the percentage below or above the
    threshold when the indicator will turn yellow or red.'
  merge: -1
  img_proc: true
- pgno: 346
  md: 'Next, in the Actions tab, you should specify what action will occur when the
    indicator turns from one state to another; i.e., yellow to red. The default setting
    is that the action is executed when the indicator goes from yellow to red. Multiple
    actions can be configured for an alarm. You can, for example, run a script and
    also have an e-mail sent to you.


    ![](img/25fe75b93b97a021effaba85db112a52_346_0.png)


    Figure 42.12: Actions for virtual machine alarms.


    There are six different actions that you can configure for a virtual machine alarm.
    They are listed below as well as in Figure 42.12:


    +   - Send a notification e-mail (SMTP)

    +   - Send a notification trap (SNMP)

    +   - Run a script

    +   - Suspend the virtual machine

    +   - Power off the virtual machine

    +   - Reset the virtual machine


    The first three actions listed for virtual machines are also available for the
    host alarms. These are also listed in Figure 42.13.


    ![](img/25fe75b93b97a021effaba85db112a52_346_1.png)


    Figure 42.13: Actions for host alarms.'
  merge: -1
  img_proc: true
- pgno: 347
  md: 'Sending an e-mail or a notification trap requires configuring the VirtualCenter
    Settings for SMTP and SNMP.


    ![](img/25fe75b93b97a021effaba85db112a52_347_0.png)


    Figure 42.14: SNMP and SMTP settings for VirtualCenter alarms.


    Open the Virtual Machine Settings window from the File menu. For SNMP, you can
    specify up to four hosts that can receive traps from your VirtualCenter environment.
    You must specify the IP address or hostname, the port, and the community string
    for each receiver.


    For the SMTP settings, you must specify an identifier that will be used as the
    sender of the e-mail. For the delivery of the message, configure an SMTP host
    and port.'
  merge: -1
  img_proc: true
