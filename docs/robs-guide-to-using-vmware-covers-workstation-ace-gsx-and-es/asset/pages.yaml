- pgno: 39
  md: 'Selecting the incorrect operating system does not cause too many serious problems.
    The OS will actually run, but it could have a negative impact on the performance.
    You can also change the operating system later on from the virtual machine configuration
    settings. Based on your selection, VMware sets the defaults for your machine to
    what is best for your guest OS. For example, if you select Windows XP, the Wizard
    will propose to use an IDE disk by default, because SCSI drivers for VMware are
    not supported by default. If you choose SuSE Linux, VMware will propose SCSI because
    drivers for the VMware SCSI storage adapter are supported by this operating system.
    VMware will also set the amount of memory to use, such as to 256 MB, because that
    is enough memory to run Windows XP or SuSE Linux.


    The selected operating system is also used to select the tools that you need to
    install in the guest, and to display additional tips if required for that operating
    system.


    4. After selecting the guest operating system, you are prompted for the location
    of your virtual machine files. Create a directory per virtual machine to store
