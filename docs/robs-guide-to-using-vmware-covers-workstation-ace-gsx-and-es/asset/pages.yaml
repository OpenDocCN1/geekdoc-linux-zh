- pgno: 126
  md: '# 8 Performance Tuning and Optimization


    Optimizing the performance of virtual machines is a subject that is discussed
    very often. This is very understandable because with multiple computers sharing
    the same hardware, it is easy to create bottlenecks. All your virtual machines
    are using the same disk channel, and they are all fighting to use the RAM in your
    machine. This chapter covers configuration settings and tips that will help you
    get the most out of your virtual machine environment. It will also show you how
    you can monitor the performance and behavior of your virtual machines.


    Section 9.1 “Performance tips” also contains some very useful tips for users getting
    started with VMware.


    # 8.1 Optimizing the Memory Used by your Virtual Machines


    Virtual machines use physical memory from your host PC. Your physical memory is
    one of the limitations that you face when running multiple virtual machines. In
    GSX Server or ESX Server, you have to make sure that all your virtual machines
    have enough memory available. This is especially important with servers in a production
    environment, where you need enough RAM to make sure that the servers perform well.


    Note: Older versions of VMware Workstation could only use a maximum of 1 GB of
    RAM to run the virtual machines. Starting with version 4.5, the maximum amount
    of RAM that can be used by your running virtual machines is 4 GB. The maximum
    amount of RAM for an individual virtual machine is now 3.6 GB. On computers with
    a file system that can not hold files larger than 2 GB the maximum amount of RAM
    is 2 GB.


    If you are the only user of the virtual machines in VMware Workstation, and you
    want to run multiple virtual machines that normally take more RAM than you have
    available, these tips might help:


    +   1. Decrease the amount of reserved RAM for a virtual machine


    If you install a Windows or NetWare server the installation process expects a
    large amount of RAM in your server (virtual machine in this case). If not enough
    memory is available, the installation procedure will issue a warning or maybe
    even stop. If you create a virtual machine, a default amount of RAM is assigned
    to it. But if the guest operating system is installed and fully configured, you
    can decrease the amount of RAM that is assigned to the virtual machine.


    Tip: Do not set the amount of RAM too low. Check the actual memory usage of the
    guest operating system, to see how much RAM it uses. If you do not allocate'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'enough RAM, the guest operating system will start using Virtual Memory (swapping)
    and that will decrease the performance dramatically.


    # 2. Allow virtual machine memory to be swapped


    The memory that your virtual machines are using, could reach the maximum amount
    of RAM that is available to your virtual machines. Starting a new virtual machine
    will result in the error message displayed in Figure 8.1.


    ![](img/25fe75b93b97a021effaba85db112a52_127_0.png)


    Figure 8.1: Trying to start too many machines results in an error message.


    You can set the Memory Preferences from the VM menu under Settings (see Figure
    8.2) to run virtual machines with more RAM than is really available.


    ![](img/25fe75b93b97a021effaba85db112a52_127_1.png)


    Figure 8.2: VMware Workstation memory configuration.'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'Note: You can configure your system to Allow most virtual machine memory to
    be swapped. Be careful when doing this, because it could decrease performance
    dramatically, depending on your host PC hardware specifications. You can start
    virtual machines with a total amount of RAM that exceeds the physical amount of
    RAM in your host PC.


    If you enable this setting, the warning message displayed in Figure 8.3 will pop
    up each time you start a virtual machine.


    ![](img/25fe75b93b97a021effaba85db112a52_128_0.png)


    Figure 8.3: A warning is displayed when starting a virtual machine would result
    in swapping memory to disk.


    It could reduce performance of course, but it could also be a solution, if you
    need to run three or more virtual machines on your host, with only 1 GB of RAM.


    # 8.2 Monitor Virtual Machine Performance (Windows host only)


    Have you ever wanted to know which of your virtual machines is slowing your host
    down? Or, do you need statistics on how much network traffic one of your guests
    is creating? You can now find all of these answers in the Windows Performance
    Monitor. This section explains how to do this with the Windows default utility,
    and how you can get other detailed information with an excellent freeware utility.
    To monitor your virtual machines, open Performance from the Administrative tools
    menu.


    ![](img/25fe75b93b97a021effaba85db112a52_128_1.png)


    Figure 8.4: Workstation performance can be monitored on a Windows host.'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'In the performance window, click the plus sign in the toolbar (see Figure 8.4)
    to add counters to your monitoring environment. The Add Counters window (Figure
    8.5) appears.


    ⚠️ Note: The performance counters are not available in the 64-bit version of Windows.
    If you want to monitor performance on a 64 bit platform, you need to use the 32
    bit version of the utility (C:\Windows\SysWOW64\perfmon.exe).


    From the Performance object drop down list select VMware. Next, select one or
    all of the counters that you want to monitor. An overview of counters is listed
    in Table 8.1, later in this section.


    Select which virtual machine(s) you want to monitor. You can select more then
    one machine by pressing the Ctrl-key while clicking the machine names.


    Or, select the All instances radio button to monitor all current virtual machines.
    If you open new virtual machines, they will not be automatically added when you
    have chosen All instances.


    ![](img/25fe75b93b97a021effaba85db112a52_129_0.png)


    Figure 8.5: Individual counters can be selected for performance monitor.


    When selecting a counter, you can click the Explain button to get more info on
    what the counter will show you in the performance monitor. The following table
    contains a list of available counters and their explanation.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# Table 8.1: Performance Counters for Windows.


    | Counter | Explanation |

    |---|---|

    | Guest Locked Memory Bytes | The number of bytes of simulated physical memory
    that is locked by the guest OS. |

    | Guest Virtual Physical Memory Bytes | The number of bytes of simulated physical
    memory in the virtual machine. |

    | Network Bytes Received/sec | The number of bytes received by the guest OS over
    the network. |

    | Network Bytes Sent/sec | The number of bytes sent by the guest OS over the network.
    |

    | Network Bytes Transferred/sec | The number of bytes sent or received by the
    guest OS over the network. |

    | Network Packets Received/sec | The number of network packets received by the
    guest OS. |

    | Network Packets Sent/sec | The number of network packets sent by the guest OS.
    |

    | Network Receive Errors/sec | The number of network errors from receiving packets
    by the guest OS. |

    | Network Send Errors/sec | The number of network errors from sending packets
    by the guest OS. |

    | Network Transfer Errors/sec | The number of network errors from sending or receiving
    packets by the guest OS. |

    | Network Transfers/sec | The number of network operations performed by the guest
    OS. |

    | Percent Guest Physical Memory Touched | The percentage of simulated physical
    memory used recently by the guest OS. |

    | Virtual Disk Bytes Read/sec | The number of bytes transferred for disk read
    operations performed by the guest OS. |

    | Virtual Disk Bytes Transferred/sec | The number of bytes transferred for disk
    operations performed by the guest OS. |

    | Virtual Disk Bytes Written/sec | The number of bytes transferred for disk write
    operations performed by the guest OS. |

    | Virtual Disk Reads/sec | The number of disk read operations performed by the
    guest OS. |

    | Virtual Disk Transfers/sec | The number of disk operations performed by the
    guest OS. |

    | Virtual Disk Writes/sec | The number of disk write operations performed by the
    guest OS. |'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# Freeware Process Explorer


    Another great tool to monitor what your virtual machines are doing is the Process
    Explorer from Sysinternals. It is a freeware utility that you can download from
    their website at www.sysinternals.com. You can use this utility for several purposes
    to analyze what you virtual machines are doing. If you right click a VMware virtual
    machine process (vmware-vmx.exe) and select properties you can retrieve a lot
    of information about your virtual machine. Figure 8.6 shows an example where you
    can see some of the statistics about memory usage and I/O.


    ![](img/25fe75b93b97a021effaba85db112a52_131_0.png)


    Figure 8.6: Process Explorer also shows performance statistics.


    In the Process Explorer you can also see what files are being used by a virtual
    machine. To see this, select View → Lower Pane View → Handles to see what file
    system and registry entries are being used by the machine.


    In the unlikely event that a virtual machine stops responding, the Process Explorer
    can also help you identify which vmware-vmx.exe process belongs to what file set.
    This will enable you to kill that individual process instead of the entire VMware
    environment.'
  merge: -1
