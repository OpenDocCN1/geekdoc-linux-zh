- pgno: 198
  md: '# 18.2 Restoring the Image


    What can I say? If you have read the previous section on how to create the image,
    then there is not much more to say about restoring the image. You can also boot
    with the Rescue Media and browse the network to select the source image file.
    Then you can select the destination hard disk and partition and restore the image
    to the machine.


    ![](img/25fe75b93b97a021effaba85db112a52_198_0.png)


    There is one tip that I would like to give you when restoring images. Make sure
    the destination drive is large enough to contain the source partition. If it is
    too small, the Restore Image Wizard will not show that disk as a destination for
    your restore. This should of course never be a problem with restoring inside a
    virtual machine where adding a large enough hard disk is just a matter of a few
    mouse clicks.


    Figure 18.3: Select a destination that is large enough to contain the image to
    be restored.


    # Where to go from here


    Depending on the operating system that you are restoring, you may need to modify
    drivers, etc. This is explained in detail in chapter 21: “Modify your restored
    operating system to work with VMware”.'
