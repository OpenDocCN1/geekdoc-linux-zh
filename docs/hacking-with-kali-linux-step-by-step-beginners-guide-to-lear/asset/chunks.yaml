    ## ABOUT THIS BOOK


    Computers and the Internet have become indispensable for homes and organizations
    alike. The dependence on them increases by the day, be it for household users,
    mission critical space control, power grid management, medical applications or
    corporate finance systems. But also in parallel are the challenges related to
    the continued and reliable delivery of service which is becoming a bigger concern
    for organizations. Cyber security is at the forefront of all threats that the
    organizations face, with a majority rating it higher than the threat of terrorism
    or a natural disaster.


    In spite of all the focus Cyber security has had, it has been a challenging journey
    so far. The global spend on IT Security is expected to hit $120 Billion by 2017,
    and that is one area where the IT budget for most companies either stayed flat
    or slightly increased even in the recent financial crises. But that has not substantially
    reduced the number of vulnerabilities in software or attacks by criminal groups.


    The US Government has been preparing for a "Cyber Pearl Harbor" style all-out
    attack that might paralyze essential services, and even cause physical destruction
    of property and lives. It is expected to orchestrated from the criminal underbelly
    of countries like China, Russia or North Korea. The economic impact of Cyber crime
    is $100B annual in the United states alone. There is a need to fundamentally rethink
    our approach to securing our IT systems. Our approach to security is siloed and
    focuses on point solutions so far for specific threats like antivirus, spam filters,
    intrusion detections and firewalls. But we are at a stage where Cyber systems
    are much more than just andwire. They involve systemic issues with social, economic
    and political. Intersections of systems, intertwined with people makes IT unpredictable.
    Complex Cyber systems have a life of their own; Cyber systems are adaptive that
    we have to understand and tackle using traditional methods.


    Before getting into that introducing Cyber as a Complex, here is a brief of what
    a Complex system is. Not that the term "system" could be any combination of people,
    processes or technology that fulfils a purpose. What you are wearing, the oceanic
    reefs, or the economy of a country - are all examples of system. In simple terms,
    a complex system is any system in which parts of the system and their interactions
    together represent a specific behavior, such that analysis of all constituents
    cannot explain the behaviour. In such systems the cause and effect not necessarily
    be related and the relationships are non-linear - a small change could have a
    disproportionate impact. In other words, as Aristotle "the whole is greater than
    the sum of its parts". One of the most popular examples used in this context is
    an traffic system and emergence of traffic jams; analysis of individual cars and
    car drivers cannot help explain the patterns and emergence of traffic jams. While
    a Complex Adaptive System (CAS) also has characteristics of self-learning, emergence
    and evolution among the participants of the complex system. The participants or
    agents in a CAS show heterogeneous behaviour. Their behaviour and interactions
    with other agents continuously evolving. The key characteristics for a system
    to be characterised Complex Adaptive are:


    - The behaviour or output cannot be predicted simply by analysing the parts and
    inputs of the system

    - The behaviour of the system is emergent and changes with time.

    - The same input and environmental conditions do not always guarantee the same
    output

    - The participants or agents of a system (human agents in this case) are self-learning
    and change their behaviour based on the outcome of the previous experience


    ## COMPLEX PROCESSES VS. COMPLICATED PROCESSES


    [content]

    Complex processes are often confused with "complicated" processes. A complex process
    is something that has an unpredictable output, however simple steps might seem.
    A complicated system is something with lots of interactions but a predictable
    output. For example, a clock is complicated but not complex. A forest or a weather
    system is complex.

    [/content]


    ## INTRODUCTION


    IT systems today are all designed and built by us (as in the human community of
    IT workers in an organization plus suppliers) and we collectively have all the
    knowledge to have regarding these systems. Why then do new attacks on systems
    that we never expected, attacking vulnerabilities? One of the fact that IT system
    is designed by individuals of parts. That introduces a human element in the design
    and sits on. Most organisations have multiple layers of defence for their critical
    systems (layers of firewalls, IDS, hardened OS), but attacks still happen.


    Reductionism vs Holistic Approach


    Reductionists argue that all systems can be understood by looking at its parts.
    Most modern science and analysis methods are based on the reductionist approach,
    and to be fair they have served quite far. By understanding each part do you really
    analyse what a watch would do, by designing each part separately you can make
    behave the way you want, or by analysing the position of celestial objects we
    can accurately predict the next. Reductionism has a strong focus on causality
    - there is a cause to effect.


    But that is the extent to which the reductionist view can explain the behaviour
    of a system. When it comes to emergent systems like human behaviour, Socio-economic
    systems, Biological systems or Socio-cyber systems, the reductionist approach
    has its limitations. Simple examples like the human body, the response of a mob
    to a political stimulus, the reaction of the financial market to the news of a
    merger, or even a traffic jam - cannot be predicted when studied in detail the
    behaviour of the constituent members of all these ''systems''. We have traditionally
    looked at Cyber security with a Reductionist lens with specific point solutions
    for individual problems and tried to anticipate the attacks a cyber-criminal might
    do against known vulnerabilities. It''s time we start looking at Cyber security
    with holistic approach.


