    # 我在寻找什么？我如何知道不该点击？


    当这些黑客或病毒攻击发生在 Facebook 上时，它们通常会影响许多人，并由于用户点击链接在朋友之间传播。Facebook 消息、主页链接或新闻链接中包含黑客攻击或病毒的一个大迹象是：尽管有许多不同的版本且不断更新，但每一个版本都会使用相同的消息或帖子来吸引你。这意味着，如果你看到你的朋友发布或通过电子邮件发送了完全相同的消息，这极可能是一个黑客攻击或病毒，如果你点击该链接，你就会感染。黑客或病毒的创建者希望你将这些视为流行的连环信、视频或链接。针对这些情况，你的选择有：


    1. 不要点击链接

    2. 举报链接

    3. 给你的朋友或亲戚发消息，询问他们是否真的想发送这条信息。大多数被黑或中入病毒的账户仍然保留了原始用户的控制权，他们会像什么都没发生一样继续使用 Facebook，所以在点击之前询问是相当安全的。


    ## 如果我被黑了或感染了 Facebook 病毒怎么办？我如何知道？


    首先，如果你知道自己的账户被破解，请迅速将密码更改为电子邮件地址，然后更改你的 Facebook 账户密码。按照这个顺序操作最好，以防止立即再次发生。判断这种情况是否发生在你最好方法是定期检查你的
    Facebook 邮箱和个人资料，查看任何不是你本人制作的邮件或帖子。如果你看到任何此类内容，请立即更改邮箱密码，随后是 Facebook 密码。


    目前没有百分之百能阻止这些攻击的方法，只有勤于保护自己的方法。记住对你的个人信息要谨慎，小心添加谁为好友，并留心可疑行为。请记住，如果你有任何怀疑，应该询问发送者，以确保那确实是你信任的人，并且他们是想要发送它的。为了给你提供一些关于为什么要在这个话题保持勤谨的动力，正如我之前提到的，他们的目标是获取你的信息或伪装成你来赚钱。他们的手段要求你不仅要自己，也要为他人保持谨慎。某些黑客攻击或病毒会试图让你下载某些东西，这些东西可以获取你的信息或勒索你直到你购买物品，从而让他们获得对你资金的控制权。另一些会建议你或你的朋友购买产品，然后偷取“购买”物品时使用的卡号。然而，最可怕的方式隐藏在我们与家人朋友的个人纽带中。某些黑客攻击和病毒会联系你的朋友和家人，告诉他们你遇到了麻烦，需要他们发送某金额的钱以确保安全或其他场景。不安全的做法可能导致你的简介成为骗取你家人金钱的门户。所以请，如果不是为了你自己，也请为了你信任和关心的他人多小心！


    # 第 14 章：网站安全与创建防黑客虚拟关键词的注意事项


    随着技术随时间的进步，它被积极地用于帮助增强企业、产品或服务。但在某些时刻，它被犯罪分子负面地用于“崩溃”网站甚至破解密码。随着新闻中报道的用于攻击网站或恶意软件的站点增加，系统黑客现在是最常见的问题之一。这就是为什么它备受关注并被讨论问题所在。无论网站大小，都应该像保护和维护其软件一样给予保护。重要的是，每个网站必须使用无法被破解的密码。人们应该尽尽早地对黑客保持警惕。


    基本上，进行黑客攻击的人通常使用计算机和其他网络来获利。为了避免黑客攻击，你不仅要为自己要采取一些措施。如果你的邮箱有两个或多个账户，你必须使用不同的密码。确保你记住了整个密码以避免失败。最后但同样重要的提示是，尝试根据常用的程序（如备忘录、Excel
    或 Word）列出一列表，适用于你所有的网站、邮箱，或者通过你的订阅和邮件将其发回正确的位置或地点。你的密码和用户名应该是整洁并妥善组织的，以便你能够立即使用。


    为了避免密码被黑客攻击，在创建虚拟密码时请遵循以下几点：


    1. 创建密码时，你应该输入如你的信用卡账户信息或任何额外的名称信息。

    2. 第二个良好的建议是使用字母数字，即数字和字母的组合，甚至混合符号。为了更高的安全性，你输入的字母中至少应包含两个。

    3. 创建密码时应该是难以阅读的，使得其他程序甚至人类无法快速发现。

    4. 单词不应该是任何所用语言中存在的名称。

    5. 不要使用姓名首字母、出生日期和其他常用词，因为它们很容易被猜到。

    6. 不要使用其他账户的密码。

    7. 输入的密码应为 5 位或更多以增加安全性。

    8. 不要尝试使用简单的密码。

    9. 如果你的邮箱有两个或多个账户，你必须使用不同的密码。确保你记住了整个密码以避免失败。

    10. 最后但同样重要的提示是，尝试根据常用的程序（如备忘录、Excel 或 Word）列出一列表，适用于你所有的网站、邮箱，或者通过你的订阅和邮件将其发回正确的位置或地点。你的密码和用户名应该是整洁并妥善组织的，以便你能够立即使用。


    在设置虚拟密码后，还应该考虑如何保护你的价值网站免受意外攻击和残酷黑客的影响。以下是需要考虑的点：


    1. 在你的软件上安装病毒保护程序以对你的网站提供全面的保护。

    2. 通过选择数字字母组合甚至混合符号来始终修改和转换你的密码。为了更高的安全性，你输入的字母中至少应包含两个。

    3. 创建密码时应该是难以阅读的，使得其他程序甚至人类无法快速发现。

    4. 单词不应该是任何所用语言中存在的名称。

    5. 不要使用姓名首字母、出生日期和其他常用词，因为它们很容易被猜到。

    6. 不要使用其他账户的密码。

    7. 输入的密码应为 5 位或更多以增加安全性。

    8. 不要尝试使用简单的密码。

    9. 如果你的邮箱有两个或多个账户，你必须使用不同的密码。确保你记住了整个密码以避免失败。

    10. 最后但同样重要的提示是，尝试根据常用的程序（如备忘录、Excel 或 Word）列出一列表，适用于你所有的网站、邮箱，或者通过你的订阅和邮件将其发回正确的位置或地点。你的密码和用户名应该是整洁并妥善组织的，以便你能够立即使用。


    在设置虚拟密码后，还应该考虑如何保护你的价值网站免受意外攻击和残酷黑客的影响。以下是需要考虑的点：


