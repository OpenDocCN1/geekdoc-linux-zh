    # What do I look for and how do I know not to click on?


    When these hack or virus attacks happen on Facebook, they usually affect a lot
    of people and travel from friend to friend by users clicking links. One of the
    big telltale signs of Facebook messages, wall links, or news links that may contain
    a hack or virus is that although there are many different versions and always
    new ones, each one will use the same message or post to attract you. This means
    that if you see a bunch of your friends post or email the same exact message that
    this is more than likely a hack or virus, and you will contract it should you
    click the link. The creator of the hack or virus wants you to see these as a popular
    chain letter, video, or link. Your options with these situations are to:


    1. Not click the link

    2. Report the link

    3. Message your friend or relative back and ask if they intended to send this
    message. In most accounts that get hacked or viruses still leave the original
    user control over the account and they go using Facebook as if nothing happened,
    so it is fairly safe to ask before you click.


    ## What if I have been hacked or have a Facebook virus and how do I know?


    First off, if you know your account was compromised, quickly change your password
    to your email address followed by changing the password to your Facebook account.
    It is best done in this order to prevent immediate recurrence. The best way to
    tell if this has happened to you is to regularly check your Facebook email and
    profile for any emails or posts that you did not make yourself. If you see any
    of these please change your email password immediately followed by your Facebook
    password.


    There is no surefire way to stop these attacks; there are only ways to be diligent
    in protecting yourself. Remember to use caution with your personal information,
    be careful of who you add as a friend, and watch out for suspicious behavior.
    Keep in mind that if you have any doubt you should ask the sender to make sure
    it really is the person you trust and that they intended to send it. To provide
    a little motivation into why you should be diligent on this topic, as I said earlier
    the goal is to get your information or pretend to be you to make money. It is
    the way they do it that requires you to be cautious not only for yourself but
    for others. Some of these hacks or viruses will try to get you to download something
    that can either take your information or ransom you until you buy an item, which
    then gives them control of your money. Others will recommend that you or your
    friends buy a product that then steals the card numbers used to "purchase" the
    item. The scariest of all ways though is hidden in the personal bonds we have
    with our families and friends. Some of these hacks and viruses will contact your
    friends and family telling them you are in trouble and need them to send x amount
    of money to get to safety or some other scenario. Unsafe practices can cause your
    profile to be the doorway to con your friends and family out of their money. So
    please, if not for yourself, be careful for the sake of others you trust and care
    about!


