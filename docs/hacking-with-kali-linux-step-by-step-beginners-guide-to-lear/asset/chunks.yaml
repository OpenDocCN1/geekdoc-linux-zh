    \ all of your friends and followers spammy messages. If you do slip and click\
    \ on one of these links, pay attention to what your virus scanning software tells\
    \ you, especially if you get a security warning about a site.\n\nIf your Twitter\
    \ account is hacked:\n\n1. Visit Twitter's information page for problem resolution.\n\
    2. Log out of Twitter.\n3. Clear your browser cache (your browsing history and\
    \ cookies and private inf) and close down your browser.\n   - For Internet Explorer:\
