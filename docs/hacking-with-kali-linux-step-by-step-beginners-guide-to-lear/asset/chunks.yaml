    # 今日新闻：“律师上诉帕林邮件被黑客入侵的裁决”


    据 NewsChannel5.com 报道，一名男子因在总统竞选期间黑入了莎拉·帕林（Sarah Palin）的电子邮件账户被定罪。他可能被判处 21 个月的监！这绝对不是开玩笑。对于那些邮箱被黑客入侵的人来说……这一点也不好笑。你该做什么来防止自己的邮箱被黑客？


    ## 1. 永远不要在邮件中提供个人或账户信息。

    大多数邮箱账户是通过“网络钓鱼”被破解的。钓鱼是指当你收到一封似乎来自合法网站的邮件，它要求你点击链接或输入个人/私人信息。千万不要这样做，因为如果你这么做了，你就给黑客提供了他们评估你的账户（如银行或信用卡详情）所需的个人信息。这些黑客可能非常聪明，他们会努力让“钓鱼网站”看起来像合法网站。如果你收到来自你银行的邮件，而它要求你点击邮件中的链接……不要点。如果它要求账户信息……不要点。如果你知道你银行的网址，请直接在浏览器中输入。然后登录查看是否有给你的信息。任何合法银行绝不会在邮件中向索要个人账户详情。或者，你可以通过银行账单或电话簿上的号码拨打银行。千万不要使用邮件里的那个号码。


    ## 2. 使用带有“钓鱼过滤器”的浏览器。

    钓鱼过滤器是一种旨在识别试图冒充合法网站的欺诈网站的程序。Firefox 和 Windows 7 只是内置此类过滤器的浏览器示例。


    ## 3. 检查你邮箱账户中的过滤器。

    例如，如果你使用 Gmail，可以登录进入设置，然后检查你的过滤器。看看你是否认识这些是你设置的。如果不是，请删除它们。


    ## 4. 除非你了解链接指向的页面，否则永远不要点击邮件中的链接。

    我发现了一个名为“Cooliris”的非常好工具，它是一个插件，允许你在不点击链接的情况下预览页面。它不仅能防止你点击不想去的链接，还能节省时间，让你无需打开另一个网页或标签页即可查看链接的目标页面。


    # 第 20 章：你的员工必须在黑客技术方面同样专业

    在这些术语中，监狱管理处于计算机安全相关问题的首要位置。计算机泄露每天都有报道，而且往往发生在最受控的环境中，这些环境的人没有接受过预防培训，或者存在安全漏洞。你可能认为监狱已经足够严密，当囚犯偷取重要信息进行犯罪时，他们发现自己非常尴尬。据
    2008 年 11 月报道，一名囚犯通过一台本应无法上网的电脑访问了文件。程序员们认为已经阻止了访问。但在使用集成系统中，“非意图访问”并不意味着什么，因为黑客可以找到绕过受守门户的方法。这就像是加锁了建筑的前后门，却让窗户处于开启状态。


    ## 理解问题

    在囚犯的案例中，他使用监狱服务器上的客户端访问了文件。虽然服务器没有程序允许访问，但囚犯利用从员工文件中窃取的用户名和密码进入了互联网，并发现了囚犯用于法律研究的软件中的一个漏洞。如果囚犯能攻入拥有保护公众的复杂安全系统的监狱系统，显然必须有多层安全机制来通知监控系统的人员入侵尝试正在发生。目标是在信息被访问之前捕获并阻止泄露。换句话说，设计良好的安全系统具有两个特征：

    * 防止渗透的安全系统

    * 经过培训的员工，他们拥有识别黑客尝试迹象和可能的入侵切入点的知识


    你可以聘请网络安全服务来评估你的安全性并设计防止渗透的应用程序，但日复一日使用系统的员工需要了解系统攻击者的运作方式，以及他们如何定位和滥用漏洞系统。


    ## 以彼还彼之道

    基本上，你是在教你的员工如何成为“黑客”，以便他们能够防止黑客攻击。旨在教授这些知识的课程侧重于黑客如何利用系统以及如何识别攻击。他们还学习了工作原理，并回到工作中实施应对措施来保护系统。如果监狱建立的安全级别未能阻止囚犯尝试通过程序访问并导致了泄露，那么如果监狱被攻破，确保你的账户是安全的至关重要的。很多时候，黑客会一直深入到他们没有攻破的信息。俗句说：“以彼知彼”。在黑客世界里，需要经过高强度训练的人才能识别出黑客。但通过这种培训，公司资产才能得到保护。


    # 第 21 章：RUNESCAPE 外挂

    如果你正在读这一章，你很可能在寻找 Runescape 的外挂和技巧。你想获得大量的 Runescape 物品，并用最少的精力获取尽可能多的 Runescape
    金币。我很遗憾地告诉你，唯一有效的 Runescape 外挂就是那些让你被黑的程序。在整个网上，大多数 Runescape 论坛、留言板甚至游戏本身，你都能找到
    Runescape 骗子。这些人会告诉你他们能让你变得富有并给你大量物品。他们从你想要的只有你的用户名和密码。无论你做什么，都不要把这些给他们。他们会登录你的账户，进入
    Runescape 银行，取出你所有的物品和金币并存入他们自己的账户。此时，他们会更改你的密码，并留你没有 Runescape 账户，或者如果他们比较“仁慈”，会把账户还给你。


    那些我可以免费下载的 Runescape 外挂呢？再次强调，不要用！这些 Runescape 自动矿工、自动战斗机或物品复制器通常是木马和键盘记录器。这意味着它们会接管你的电脑，发现你的
    Runescape 密码然后黑掉它。


    ## 我如何保护自己？

    让你的 Runescape 密码变长，并使用数字、字符和大写字母。仅将此密码用于 Runescape（游戏），不要用于任何其他地方。Runescape 外挂，它们都会让你被黑。Runescape
    外挂全是这样。为什么？如果你有一个能在 Runescape 里赚几百万的程序，你会免费提供吗？你不会的！永远不要提供这种情况的密码或详情。在 Runescape
    中要小心，有很多试图获取游戏金币和物品的骗子。


    # 第 22 章：购买一台 Hack Attack 打球机

    如果你想让你的团队更上一层楼，是时候引入 Hack Attack 打球机了。从高级团队到大玩家，这台机器是一台坚固、制造良好的击球器，能够揭示最好的表现。


    ## 什么是 Hack Attack 投球机？

    这是一款卓越的棒球投球机，具有独特的轮设计，允许击球者在整个投球过程中看到球，从而调整他们的挥击和步幅。这有助于他们为实战做准备，而不是让他们感到压力并强迫他们发展出发条般的反应（因为他们永远不知道球会在什么时候飞来，某些机器正是如此）。


    ### 机器具有哪些功能？

    * **场景可定制：** Hack Attack 机器提供了许多惊人的功能，允许你的团队针对任何情况下的任何投手进行训练。它不仅仅是简单的投掷直球，还可以投出左右手手的侧旋球，如曲线球、指指球和滑球球，以及足以与大联盟投手匹敌的快速球。与其他机器不同，它的易转旋钮让调整你想要的投球类型变得极其简单易。

    * **耐用性：** Hack Attack 机器功能强大，轮子非常耐用。Hack Attack 的其不可摧毁的钢制框架防锈，并经受住时间和天气考验，作为一台棒球投球机，你短期内不需要更换它。

    * **便携性：** 你可能认为 Hack Attack 机器很难在地方之间移动——但我们解决了这个问题，安装了一套轮子，当机器需要立起时你可以将其向上翻起移开，当你需要移动它时它可以向下接触地面。它足够重以吸收反力，但也足够轻以便于携带。

    * **一致性：** 当机器投出不同类型的球时，即使你没有更改设置，你也能击中。Hack Attack 展示的完全是你想要的。


    ## 我为什么要买 Hack Attack？

    如果你和你的团队真的热爱棒球，你们应该像专业人士一样打球，这就是你们需要的。它在坚固结构、稳定性和适应天气方面是顶尖的，适合许多人。


    # 第 23 章：关于网站安全的事实

    你知道网站被黑真正意味着什么吗？影响又是什么？互联网为消费者和企业提供了巨大的便利。然而，任何未能遵循适当安全措施或未与顶尖安全系统协同工作的网站，都简单地容易受到黑客攻击。一旦你的网站被黑，你服务器中的几部分关键信息，如个人或财务信息（这是潜在客户与你购物的一部分），或客户存储在你自己网站上的文档，都极易被盗窃。此外，如今客户非常清楚网站被黑意味着什么，因为这会损害网站的声誉并导致客户失去信任。此外，你会失去搜索引擎的排名。尽管有一些提供反黑客网站服务的的公司，但大多数解决方案是在事后。


    真正的解决方案是在黑客攻击发生之前保护你的网站，监控你的网站的所有黑客活动，以便在入侵发生前采取适当行动。除了保护网站免受攻击，还有更多措施可以采取。最重要的是监控你的文件以及数据库，对它们进行优化。当你的网站被黑时，首要工作是禁用网站。现在你应该禁用网站并重新启动。如果你使用
    WordPress、Joomla 或 Drupal，要更加小心，因为黑客知道这些平台的弱性。更好的解决方案应该由有经验的专业人士提供，他们有足够的知识在网站被黑后清理恶意软件或病毒。此外，他们应该在被黑前拥有深度安全知识，并了解
    WordPress 等应用程序的弱性，黑客可以轻易渗透你的网站。


    # 第 24 章：如何修复被黑的博客

    几乎每个人的电子邮件甚至电脑都曾某次被黑过。这种感觉很糟糕，尤其是当你的博客被黑时，情况会变得更糟。然而，有一些方法可以修复你的博客或网站。黑客通常针对使用互联网的公司和家庭。大公司应该使用一种名为
    Copendium 的服务，它让博客平台保持安全。Copendium 提供了一个团队来监控你的工作而不被入侵。这里我和你分享了修复被黑博客时可以采取的步骤。首先，如果你的博客被黑了，第一反应是禁用网站，这是不对的。冷静并遵循这些步骤。其次，尽快移除博客。最好的方法是更改密码。第三，备份你的博客或网站，不要保留备份文件。第四，完全移除所有插件。第五，检查数据库，看看是否有黑客可以利用的漏洞或间隙。为了防止所有可能的入侵，关闭网站。最后，重新安装插件是恢复被黑博客的最后一步。在完成这些步骤后，运行博客并检查是否工作正常。希望没有其他威胁。如果你无法完成所有操作，可以请一个程序员来做，你可以在
    fiverr.com 上找到。如果你的多个博客被黑了，这些步骤应该帮助你修复并恢复它。


    # 为什么账户很容易被黑？

    网站和服务器的黑客攻击日益增加。黑客攻击是由一些使用不同方法来实现的。正如你知道的，这意味着未经授权的访问网络或电脑以获得完全控制。许多时候，黑客攻击是由于电子邮件。之前的版本导致了，一旦安装了软件，错误就会发生。不是，黑客攻击属于三级罪。这些罪行的处罚是：三级罪判禁
    5 年罚款 5000 美；二级罪判禁 15 年罚款 10000 美以及可能的监禁，监狱会产生毁灭性的影响。


    ## 如何防止你的邮箱账户被黑

    邮箱账户是最容易被黑的。你应该意识到你的邮箱账户很容易被黑。最近，有 10000 个账户被黑，所有的账户和密码都被列了出来。根据微软的说法，邮箱所有者声称黑客攻击是由于钓鱼计划。基本上，这意味着名字和密码通过电子邮件被盗取。你可以通过遵循以下简单步骤防止你的邮箱账户被黑：

    1. 不要在任何公共电脑上登录你的邮箱账户。这些电脑是黑客的温床，因为他们可以在你不知情的情况下运行程序。此外，大多数电脑没有防病毒软件，所以病毒很容易访问你的电脑。

    2. 不要使用简单的单词。多个字符的密码很容易被黑，因为黑客可以通过暴力破解进入你的账户。记住！

    3. 不要使用相同的密码。如果你有账户，其他账户（如银行）可能会被黑。

    4. 理想情况下应该每月更改密码。如果你的账户被黑，你可以立即停止他们。

    5. 使用防病毒软件如 Norton 来保护自己。病毒可以捕获你的密码，这是一个很好的措施。

    6. 不要让密码在电脑上可见。如果你有账户且密码是一个单词，你很容易被盗窃。保持私密！


    # 第 25 章：关于网站安全的事实


    ## 通过被黑增加网站流量

    通常，你的网站接收的流量是稳定的。一天一天之间没有太大变化。增长是缓慢而稳定的。但可能有一天你会看到流量突然激增。起初你可能认为你的网站终于火了——它要成功。可能吧。确实，有一种可能是你的网站在社交网络上被提到了，这解释了流量的上升。但另一种可能性——你的网站被黑了。


    ### 如何判断网站被黑了？

    流量。第一个也是最明显的线索是流量突然增加。网站被黑通常意味着有人在你的网站上放置了页面并引导流量查看。这些页面通常是收集信息的页面。黑客在你的网站上放置虚假的银行更新页面并引导人们在那里填写。人们在没有怀疑欺骗的情况下填写了银行信息，然后点击提交将他们的私人银行信息发送给黑客。黑客随后利用这些信息访问银行账户。因此，你注意到的流量增加是人们在你的网站上填写表单。


    2) 未创建的页面查看量增加。检查你的设置。网站上有你没有创建的页面。通常黑客可以。寻找查看很多的页面。如果你发现一个链接，删除它。


    ### 机器具有哪些功能？

    * **场景可定制：** Hack Attack 机器提供了许多惊人的功能，允许你的团队针对任何情况下的任何投手进行训练。它不仅仅是简单的投掷直球，还可以投出左右手手的侧旋球，如曲线球、指指球和滑球，以及足以与大联盟投手匹敌的快速球。与其他机器不同，它的易转旋钮让调整你想要的投球类型变得极其简单。

    * **耐用性：** Hack Attack 机器功能强大，轮子非常耐用。耐用性是 Hack Attack 的部分部分；其不可摧毁的钢制框架防锈，并经受住时间和天气考验，作为一台棒球投球机，你短期内不需要更换它。

    * **便携性：** 你可能认为 Hack Attack 机器很难在地方之间移动——但我们解决了这个问题，安装了一套轮子，当机器需要立起时你可以将其向上翻起移开，当你需要移动它时它可以向下接触地面。它足够重以吸收反力，但也足够轻以便于携带。

    * **一致性：** 当机器投出不同类型的球时，即使你没有更改设置，你也能击中。Hack Attack 展示的完全是你想要的。


    ## 我为什么应该买 Hack Attack？

    如果你和你的团队真的热爱棒球，你们应该像专业人士一样打球，这就是你们需要的。它在坚固结构、稳定性和适应天气方面是顶尖的，适合许多人。


    什么是 Hack Attack 投球机？

    这是一款卓越的棒球投球机，具有独特的轮设计，允许击球者在整个投球过程中看到球，从而调整他们的挥击和步幅。这有助于他们为实战做准备，而不是让他们感到压力并强迫他们发展出发条般的反应（因为他们永远不知道球会在什么时候飞来，某些机器正是如此）。


