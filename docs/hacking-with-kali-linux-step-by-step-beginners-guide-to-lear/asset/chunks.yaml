    ## 关于本书


    计算机和互联网对于家庭和组织而言已变得不可或缺。无论是家庭用户、任务关键型空间控制、电网管理、医疗应用还是企业财务系统，对它们的依赖性日益增长。但与此同时，与服务的持续可靠交付相关的挑战也日益增加，这正成为组织关注的问题。网络安全处于组织面临的所有威胁的前沿，大多数人认为其威胁程度高于恐怖主义或自然灾害。


    尽管网络安全受到了广泛关注，但到目前为止这是一段充满挑战的历程。全球 IT 安全支出预计到 2017 年将达到 1200 亿美元，这是大多数公司 IT 预算即使在近期财务危机期间也保持平稳或略增的领域之一。但这并没有从根本上减少软件漏洞或犯罪团体的攻击数量。


    美国政府一直在准备应对“网络珍珠港”式的全方位攻击，这种攻击可能会瘫痪关键服务，甚至导致财产和生命的物理性破坏。预计此类攻击将由中国、俄罗斯或朝鲜等国家的犯罪地下组织策划。仅在美国，网络犯罪造成的经济影响每年就高达
    1000 亿美元。我们需要从根本上重新思考保护 IT 系统的方法。到目前，我们的安全方法是孤立的，专注于防病毒、垃圾邮件过滤器、入侵检测和防火墙等特定威胁的点解决方案。但我们正处于这样一个阶段：网络系统不仅仅是线条。它们涉及社会、经济和政治的系统性问题。系统之间的交织以及人的使得
    IT 变得不可预测。复杂的网络系统有自己的生命；网络系统具有适应性，我们必须使用传统方法来理解和应对它们。


    在引入“复杂系统”作为复杂概念之前，这里简要介绍什么是复杂系统。请注意，“系统”一词可以是任何为实现目的的人员、流程或技术的组合。你穿的衣服、海洋礁石或一个国家的经济——都是系统的例子。简单来说，复杂系统是指任何系统部分及其相互作用共同代表特定行为的系统，以至于对所有组成部分的分析无法解释这种行为。在这样的系统中，因果关系并不一定相关，且关系是非线性的——微小的变化可能会产生不成比例的影响。换句话说，正如亚士多德所说，“整体大于部分之和”。这种语境下最流行的例子之一是交通系统和拥堵的出现；分析单个汽车和司机无法帮助解释拥堵的模式和形成。而复杂自适应系统
    (CAS) 在复杂系统的参与者之间也具有自学习、涌现和演化的特征。CAS 中的参与者或代理表现出异质行为。他们的行为以及与其他代理的互动不断演变。一个系统被描述为“复杂自适应”的关键特征是：


    - 无法通过简单分析系统的部分和输入来预测行为或输出

    - 系统的行为是涌现的，并随时间变化

    - 相同的输入和环境条件并不总是保证相同的输出

    - 系统的参与者或代理（在此情况下为人类代理）是自学习的，并根据以往经验的结果改变其行为


    ## 复杂过程 VS 复杂的过程


    [content]

