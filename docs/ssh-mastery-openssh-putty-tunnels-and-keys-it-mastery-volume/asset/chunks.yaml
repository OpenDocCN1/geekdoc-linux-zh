  trans: '


    既然你已经知道了你的密钥，那么每次登录此服务器时都需要输入密码短（passphrase）。现在是配置 SSH 代理（agent）的好时了。


    ### 使用 PuTTY 用户密钥


    如果你没有运行代理，就必须告诉 PuTTY 去哪里寻找你的私钥文件。在 PuTTY 配置界面的左侧，选择 `Connection->SSH->Auth`。在标记为
    `Private key file for authentication:` 的文本框中，输入私钥文件的完整路径。记住，私钥文件以 `.ppk` 结尾。


    现在尝试连接。PuTTY 应该提示你输入用户名，然后请求输入密码短。如果你正确输入了密码短，将获得命令提示符。


    一旦你确认密钥可以工作且安装正确，就可以使用 Pageant SSH 代理来减少输入密码短的频率。


    ## SSH 代理


    虽然 OpenSSH 和 PuTTY 的 SSH 代理大不相同，但它们执行的任务是相同的。它们将你的私钥托管在安全内存中，这样你就不需要不断输入密码短。两者都允许你查看解密后的密钥、添加新密钥以及删除密钥。它们之间唯一的区别在于编程方式以及你如何让它们运行——这些都是紧要的细节。


    当你将密钥加载到 `ssh-agent` 后，你的登录尝试看起来像这样：


    ```

    ssh mail

    ```


    Last login: Thu Nov 16 16:56:52 2017 from ceo.worldhq.mwl.io


    FreeBSD 10.3-RELEASE-p20 (GENERIC) #0: Wed Jul 12 03:13:07 UTC 2017


    ```


    注意，这里没有任何请求密码或密码短的；你无需经过人工身份验证直接登录了远程机器。如果你在工作日期间需要连接许多机器，SSH 代理会让生活变得简单得多，并将用户密钥从一种负担变成一种享受。


    ### OpenSSH Agent


    任何包含 OpenSSH 的 Unix 类系统都带有 SSH 代理 `ssh-agent(1)`。然而，简单的操作到此为止了。


    Unix 类世界中桌面环境多样性的一个烦恼之处是，每个环境都有自己偏好的运行 `ssh-agent` 的方式。我们在这里讨论其中几种，但如果这些方法在你的环境中都不起作用，你就需要检查你的操作系统或窗口管理器文档。许多
    Unix 变体都有自己略微独特的桌面设置，它们会改变使用 `ssh-agent` 的精确方法，以适应开发者的个人偏好和“每周奇想”（Whim Of The
    Week）。


    大多数显示管理器（如 `xdm` 和 `kdm`）都有钩子可以自动检查用户主目录下的 SSH 密钥。当显示管理器在登录过程中找到密钥时，它会弹出一个窗口请求密码短。输入密码短，显示管理器会将
    SSH 代理附加到你的桌面环境中。你就可以准备开始工作了。


    如果你更老派，使用 `startx(1)` 运行桌面，请在运行 `startx` 之前通过 `ssh-add(1)` 告诉 SSH 代理你有一个密钥。


    ```

    ssh-add

    ```


    密码 for /home/mwl/.ssh/id_rsa:


    输入密码短以将密钥添加到代理。


    文本控制台用户必须首先以 shell 作为参数运行 `ssh-agent(1)`，然后运行 `ssh-add`。


    ```

    ssh-agent /bin/tcsh

    ssh-add

    ```


    从该控制台会话启动的所有 SSH 会话都会通过代理运行。代理不会跨虚拟控制台终端工作，仅适用于 `ssh-agent` 运行的 shell 子进程。另一个虚拟终端需要自己的
    SSH 代理。


    如果你有多个具有相同密码短的密钥，`ssh-add` 会自动解密所有密钥。如果你有多个具有不同密码短的密钥，`ssh-add` 会分别提示密码短。


    使用 `ssh-add -l` 列出当前存储在代理中的所有私钥，使用 `ssh-add -D` 从运行的代理中删除密钥。午饭回来后重新添加它们。


    ### PuTTY Agent


    PuTTY SSH 代理 Pageant 提供了一个友好的 Windows 风格 SSH 界面。双击它启动 Pageant。Pageant 图标（一个戴着黑色宽檐帽的电脑）将出现在系统托中。


    右键点击 Pageant 图标。你会看到几个选项，包括 `View Keys`（查看密钥）、`Add Key`（添加密钥）和 `Exit`（退出）。还有运行保存或新建
    PuTTY 会话的。选择 `Add Key` 调出标准的 Windows 文件浏览器。找到你的私钥并选择它。Pageant 将显示一个对话框请求密码短。输入它。如果你无法正确输入密码短，Pageant
    会要求你重试。


    一旦 Pageant 准备就绪，打开 PuTTY 会话。连接到安装了你公钥的机器。你应该获得命令提示符，而无需输入密码短。


    如果在指定私钥文件时密钥认证有效，但在使用 Pageant 时无效，请验证 PuTTY 是否配置为使用 Pageant。选择 `Connection->SSH->Auth`。在
    `Authentication Methods` 下，你会找到 `Attempt authentication using Pageant`（使用 Pageant
    尝试验证）复选框。确保它已勾选。


    一旦确认 Pageant 可以工作，让它在登录时启动会帮助。找到你账户的启动文件夹（具体位置取决于你的 Windows 版本）。在另一个窗口中找到你的 Pageant
    程序。它可能在 PuTTY 目录下的 Programs 或 Program Files (x86) 中。在启动目录中为 Pageant 创建一个链接。


    为了极致方便，让快捷方式在登录时加载。


    '
- fmt: '

    If one of your desktop machines is compromised, you must remove that machine’s
    authentication key from use. If all your clients share a single private key, you
    must regenerate a new key pair and distribute it to all of your machines. The
    intruder who has your private key might well lock you out of your own systems
    before you can accomplish this. If each machine has a unique key pair—even if
    all the keys share the same passphrase—then compromise or loss of one key does
    not compromise the keys on all your other machines.


    Also, preferred key algorithms change over time. When I wrote the first edition
    of this book, user authentication keys defaulted to 1024 bits. The default is
    now `2048\.`. If I was still using keys created years ago, they would be too weak
    for current use. It’s entirely possible that the default user authentication key
    algorithm of `RSA` will be replaced by an entirely different algorithm in the
    future. By creating a new key whenever you get a new machine, and invalidating
    keys associated with old hardware, you ensure that your keys are relatively recent
    and secure.


    ## Disabling Passwords in the SSH Server


    Passwords are less secure than keys. Now that you have working key-based authentication,
    the smart thing to do is to disallow password-based authentication. The `sshd_config`
    keyword `ChallengeResponseAuthentication` disables generic challenge-response
    authentication systems, such as a prompt requesting a username and password. The
    keyword `PasswordAuthentication` enables and disables passwords. To disable password-based
    authentication, set both of these keywords to `no`.


    ```

    ChallengeResponseAuthentication no

    PasswordAuthentication no

    ```


    While `sshd` permits public key authentication by default, verify that nobody’s
    changed that keyword. The `PubkeyAuthentication` keyword must be set to `yes`.


    ```

    PubkeyAuthentication yes

    ```


    Now restart `sshd`, either with the built-in system command or `pkill -1 sshd`.


    Changing `sshd_config` will not change how other programs use passwords. If you
    use passwords for `sudo`, `sudo` will still ask users for their password.


    ### Password Authentication Warning!


    If you make a mistake in configuring SSH such that nobody can login, you can lock
    yourself out of your server. When making changes to `sshd_config`, do not log
    out of your existing SSH session until you verify your changes work. (Remember,
    you can run `sshd` on an alternate port for testing, as discussed in Chapter 3.)
    Create a new SSH session. Verify that you can login and become root before disconnecting
    your first session.


    The preceding paragraph is very important. Ignore it at your peril, or be prepared
    for your own manic-depressive gelato binge.


    ### Permitting Passwords from Specific Hosts


    While passwords are weak, sometimes you cannot disable them entirely. You might
    have a few users or applications that cannot use keys for one daft reason or another.
    The underlying problems are most often political rather than technical, but they’re
    still problems. While you’re working on solving those problems, you can allow
    passwords from specific hosts with conditional configuration, as discussed in
    Chapter 3\. Here, we allow password authentication from a particular subnet.


    ```

    Match Address 192.0.2.0/24

    PasswordAuthentication yes

    ```


    Remember, all `Match` statements go at the bottom of `sshd_config`.


    It is possible but extremely unwise to permit password authentication based on
    username. The SSH server, rather than hanging up on clients that request passwords,
    must get the username before hanging up on the client. This means that the Hail
    Mary Cloud will continuously poke at the server. The reasons that compel you to
    permit limited password authentication probably make requiring a strong password
    just as problematic—the same boss that demands he be allowed to use passwords
    probably thinks that `p455w0rd` is a secure password. The account that permits
    passwords will be a weak spot. The only thing that can save you here is good off-host
    logging to a very secure bastion host, so that when the machine is compromised
    you can tell the boss that the downtime is his fault.


    ## Agent Forwarding


    Suppose I disabled password-based authentication on all my computers. The only
    way to access a command prompt on any of my hosts is by authentication with public
    keys. I’m working on my server `wrath`, and must copy a file over to the server
    `gluttony`. This presents a problem. My private key isn’t on `wrath`. Copying
    the private key to a server is terrible security practice—you want your private
    key on as few hosts as possible, and never on your servers. But passwords don’t
    work. How can I use `SCP` or `SFTP`?


    The answer is to forward authentication requests back to your workstation. Agent
    forwarding is exactly that. When you try to `SSH` from one server to another,
    the SSH client on the server sends private key requests back to your desktop.
    The agent is available as a socket, in a location given by the environment variable
    `$SSH_AUTH_SOCK`.


    ```

    $ echo $SSH_AUTH_SOCK

    /tmp/ssh-zOeUnDTnkb/agent.2513

    ```


    To use agent forwarding, both the client and the server must permit it and the
    SSH agent must be running before starting your first SSH connection. If both the
    client and the server support and request forwarding, the authentication request
    will be forwarded.


    ### Agent Forwarding Security


    The risk of agent forwarding is that you must extend some trust to the SSH servers.
    Anyone who has root access can access your SSH agent socket. Anyone who can access
    your SSH agent’s socket can use your private key without providing a passphrase.


    If your SSH server is compromised, the intruder can piggyback onto your authentication
    socket to log into remote servers with your credentials. Promiscuous agent forwarding
    has been responsible for intrusions in many organizations, even organizations
    you’d think know better. Only enable agent forwarding to machines that you control.


    ### Agent Forwarding in sshd


    To enable agent forwarding on the server, set to the `AllowAgentForwarding` keyword
    to `yes`.


    ```

    AllowAgentForwarding yes

    ```


    I’ll generally disable agent forwarding globally, then use a `Match` statement
    to permit certain users or addresses to forward.


    ### OpenSSH Client Agent Forwarding


    In `ssh_config`, use the `ForwardAgent` keyword to activate agent forwarding.


    ```

    ForwardAgent yes

    ```


    The next time you connect to a server, the client will request agent forwarding.


    ### PuTTY Agent Forwarding


    PuTTY enables agent forwarding by default. On the left side of your PuTTY setup
    screen, go to *Connection* -> *SSH* -> *Auth*. Under *Authentication parameters*,
    you’ll see a check box *Allow agent forwarding*.


    You can also use key authentication and `authorized_keys` to very restrict what
    a user may do over SSH. We’ll examine that in chapter 12\. Now, let’s look at
    forwarding X.

    '
