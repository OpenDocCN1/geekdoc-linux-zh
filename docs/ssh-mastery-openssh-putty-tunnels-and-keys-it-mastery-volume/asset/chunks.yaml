    \ `KexAlgorithms` sets the key exchange methods.\n\nThe general encryption algorithms\
    \ are set with the `Ciphers` keyword.\n\nMessage Authentication Codes (MAC) detect\
    \ alterations in traffic. The `MACs` keyword sets them.\n\nThe `HostKeyAlgorithms`\
    \ lets you set algorithms for host keys.\n\nFinally, some public key algorithms\
    \ are obsoleted. The `PubkeyAcceptedKeyTypes` keyword lets you enable obsolete\
    \ key types.\n\n## Example Connection\n\nMy home entertainment network connects\
