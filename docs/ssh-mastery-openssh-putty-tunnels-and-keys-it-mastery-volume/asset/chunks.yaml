    ### Restricted Certificates


    Just as you can limit the access of accounts and keys, you have the power to restrict
    certificates. You can do this with the -O flag to ssh-keygen. The -O flag has
    a whole list of possible restrictions identical to those for authorized_keys in
    Chapter 12\. These options include no-agent-forwarding, no-port-forwarding, no-pty,
    no-user-rc, and no-x11-forwarding. All of these no- restrictions have a corresponding
    permit- version: permit-agent-forwarding, permit-port-forwarding, permit-pty,
    permit-user-rc, and permit-x11-forwarding. Additionally you have the source-address
    restriction that dictates the IP addresses that can authenticate using this certificate.
    There’s also the clear restriction that (much like restrict in authorized_keys)
    turns off all privileges, allowing you to turn them on selectively with a permit-
    statement. Finally, force-command compels the user to run that specific command.


    One common case for automation is when you have a key that can only run a single
    task. I want to create a certificate for a key that can only be used to run the
    command /usr/local/scripts/backup.sh. Create a key called backup on the client,
    and send backup.pub to the CA for signing. I want to erase all permissions from
    this certificate using the clear option, and then compel running the backup script
    with force-command. I use -O twice to assign these permissions. Otherwise, it
    looks like any other user key signing.


    # **ssh-keygen -s user-mwlca-key -I user_backup -n backup -V +52w -O clear -O
    force-command="/usr/local/scripts/backup.sh" backup.pub**


    This generates the certificate file backup-cert.pub. Look at the contents.


    # **ssh-keygen -Lf backup-cert.pub**


    backup-cert.pub:


    Type: ssh-rsa-cert-v01@openssh.com user certificate


    Public key: RSA-CERT SHA256:UL4ctioc5p8aSN1S318FI5RpsS1rnxJdrOEDb/B69Jg


    Signing CA: RSA SHA256:CKZFZXRgOy1ji8zmUhU0zjJQfNs9gLEqAwSjA8pB4dg


    Key ID: "user_backup"


    Serial: 0


    Valid: from 2017-12-05T07:56:00 to 2018-12-04T07:57:50


    Principals:


    backup


    Critical Options:


    force-command /usr/local/scripts/backup.sh


    Extensions: (none)


    Compare this key to the regular user certificate we just created. The user key
    has no critical options, while this certificate lists the force-command statement
    as a critical option. Where the user key has a bunch of privileges under Extension,
    this key has none. This certificate grants the right to use only the one command.


    There is no specific privilege to create an SSH tunnel at this time. If your organization
    is large enough to need certificates, it should have standards declaring acceptable
    VPN types.[3](#section-0016.xhtml_ref_footnotebookmark_end_65_3)


    ### Disabling authorized_keys


    Once you’ve fully deployed SSH certificates for user authentication, you might
    decide to disable authorized_keys files. That’s easily done in sshd_config.


    AuthorizedKeysFile none


    If you have clients that can’t support certificates, however, you’ll need to provide
    a way for those clients to log in. Some organizations require all sysadmins to
    use Unix-based desktops so they can support certificates. Some large organizations
    like Facebook disallow SSH from clients except to a central bastion host that
    holds the user’s private keys and certificates.


    And speaking of Facebook, let’s talk about how they manage SSH.


    ## Massive Scale SSH


    Organizations like Google, Facebook, and Amazon have tens of thousands of sysadmins
    and millions of servers. Imagine the load on their LDAP directory just for managing
    the accounts, and the number of user groups they have.


    And once you’ve imagined that, forget it.


    Facebook’s engineering team kindly posted an article on how they use SSH certificates
    to allow everyone to log in as root, but control which servers people can access,
    through certificate principals. Do an Internet search on “Facebook SSH certificates”
    and you’ll get right to it. I won’t dive deep into their system, but here’s an
    overview.


    Organizations without millions of servers and teams use usernames as the principal.
    A principal doesn’t have to be a user, however. You can use the AuthorizedPrincipals
    sshd_config keywords to set up a list of principals that can access the host,
    and develop principals based on role, location, or function.


    The AuthorizedPrincipalsFile keyword points to a text file that contains a list
    of principals, one per line. Here are three principals that might appear in such
    a system.


    everywhere-root


    europe-root


    europe-database


    This tells sshd to accept authentication from a certificate that includes any
    of the principals root-everywhere, europe-root, or europe-database. The AuthorizedPrincipalsFile
    keyword accepts the usual tokens, so you could break this out by username.


    AuthorizedPrincipalsFile /etc/ssh/principals/%u


    When a user tries to log in as root, sshd checks /etc/ssh/principals/root for
    the list of permitted principals.'
