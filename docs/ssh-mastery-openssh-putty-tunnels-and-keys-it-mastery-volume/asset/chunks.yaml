  trans: '


    双击 WinSCP。输入你的用户名、密码以及 SSH 服务器的主机名。WinSCP 将登录并打开一个双窗口。左侧显示你的本地主目录，右侧显示远程服务器上的主目录。这被称为“命令行式”（Commander-Style）界面。将文件从一侧拖动到另一侧。


    你可以让 WinSCP 使用“资源管理器样式”（Explorer-style）界面。它将打开一个单窗口，样式与其他任何 Windows 资源管理器窗口完全相同，包含远程主机。要查看本地目录，你必须打开单独窗口。要启用资源管理器样式，选择
    `Tools->Preferences->Interface` 并选择 `Explorer`。现在你的 WinSCP 看起来非常像 Windows，甚至会让你自己感到困惑。


    多亏 WinSCP 有右键菜单，你现在可以右键点击文件并选择 `Send To WinSCP`（发送到）来上传文件。


    ## 配置 SCP 和 SFTP 服务器


    OpenSSH 默认支持 SCP 和 SFTP。这两者都不需要大量配置，但你可以更改它们行为的一些方式。


    对于 SCP，`scp(1)` 程序必须在系统的默认 `$PATH` 中。如果 SSH 服务器找不到 `scp`，用户将收到相应的错误提示。开启或关闭，存在或不存在：这是你唯一的选择。


    `sshd` 服务器附带了一个 SFTP 服务器，通过 `sshd_config` 中的条目激活。


    ```

    subsystem sftp /usr/libexec/sftp-server

    ```


    只要存在此条目，就足以启用 SFTP 支持。


    ### 仅限 SFTP 用户


    你可能有一些用户需要访问服务器以复制或从中复制文件，但不需要 shell 访问权限。OpenSSH 支持仅限 SFTP 的用户。这通常与 chroot（第
    3 章）结合使用，允许用户仅访问文件系统的部分。你会在支持多个客户的 Web 服务器中看到这一点，每个站点应该只能访问属于自己站点的文件。


    当需要 shell 权限的 chroot 用户需要在其 chroot 中准备大量文件时，仅限 SFTP 的用户只需要一个 `sshd_config` 关键字。


    首先为仅限 SFTP 的用户创建一个组。我将我的组命名为 `sftponly`。通过在 `sshd_config` 中使用 `Match` Term，我拒绝这些用户访问主目录之外的任何内容，并仅允许他们访问
    SFTP。


    ```

    Match Group sftponly

    ChrootDirectory %h

    ForceCommand internal-sftp

    AllowTcpForwarding no

    ```


    我们使用 `ChrootDirectory` 关键字将用户锁定在一个目录中。`ForceCommand` 关键字限制用户只能访问一种命令。就此了！内部 SFTP
    服务器提供了用户可能需要的所有用户态命令和设备节点访问。


    ### 禁用 SSH 文件复制


    你可能希望在允许用户进行命令行访问的同时，禁用通过 SSH 复制文件的能力。这真的、真的非常困难。你可以从主机上移除 `/usr/libexec/sftp-server`
    和 `/usr/bin/scp` 并在 `sshd_config` 中禁用 SFTP，但这只禁用了显而易见的复制文件方法。用户是狡猾的小生物，尤其是那些认为系统管理员正在阻止他们工作的沮丧用户。用户可以通过许多方法复制文件。其中许多方法会跨网络发送未加密的数据。具有
    shell 访问权限的用户始终可以地将文件从一个主机复制到另一个主机。


    如果你必须防止用户复制文件，请使用 chroot 并限制用户可以访问的文件。他们仍然可以复制文件，但仅限于 chroot 中的文件。


    # 第 7 章：SSH 密钥


    SSH 主机密钥标识服务器。SSH 也支持使用密钥对用户进行身份验证。使用密钥验证用户比密码需要更多的准备工作，但如果正确执行，它既安全得多，又方便得多。我们将考虑服务器密钥和用户密钥。


    ## 手动创建服务器密钥


    如果入侵者破解了你的服务器，服务器的私钥就不再私密了。你必须更换它。这需要生成一个新的密钥对。虽然大多数操作系统会自动创建缺失的主密钥，但其他系统不会。使用
    `ssh-keygen(1)` 手动创建服务器密钥。


    如果你的服务器运行较新的 OpenSSH 版本，请以 root 运行 `ssh-keygen -A` 以自动生成所有支持但缺失的主密钥。


    你可能需要为本地主机以外的主机创建密钥，例如在使用某些编排系统部署新安装时。你可以使用 `ssh-keygen` 的 `-t` 和 `-f` 参数手动创建密钥文件。


    ```bash

    $ ssh-keygen -t ecdsa -f ssh_host_ecdsa_key -N ''''

    $ ssh-keygen -t ed25519 -f ssh_host_ed25519_key -N ''''

    ```


    `-t` 标志指定要创建的密钥类型。在这里我们创建两种不同类型的密钥：ECDSA 和 ED25519。`-f` 标志给出私钥文件的文件名。每个密钥对的公钥位于同名文件中，并在末尾加上
    `.pub`。最后，`-N` 允许你在命令行上指定短语（passphrase）。主机密钥没有短语。两个单引号表示空短语。


    每当你生成主机密钥时，务必按照第 4 章讨论的那样获取密钥指纹。你的用户需要这些指纹来验证主机密钥。


    ## 短语


    我刚才提到的这个短语到底是什么？短语类似于密码，但更长。它包含了空格、单词、特殊字符、数字以及你可以输入的任何其他内容。短语用于加密和解密私钥。在输入正确的短语之前，私钥无法被使用。


    短语通常用于用户密钥。桌面和笔记本系统通常比服务器不安全，经常被感染、劫持或直接盗取。如果你的密钥对被盗，入侵者可以像合法用户一样访问服务器。使用短语加密私钥意味着即使密钥文件被盗，入侵者也无法使用。如果入侵者只获得了密钥文件或短语，但不同时两者，损害是可控的。让短语足够长以无法被破解，并足够复杂以防止偶然窃听。


    短语可以是像密码那样的单词吗？可以，但这是一个非常糟糕的主意。现在的计算机非常快，可以通过尝试所有可能的密码来发现短密码。使用短短语会显著降低私钥的安全性。


    短语应该至少几个单词长，是你容易记住的内容，并且对其他人来说是不明显的——即使是对认识你的人。它应该包含特殊字符，如 `#`、`!`、`~` 等。来自专业领域的特殊词非常有用。用数字代替字母。永远不要使用流行文化内容，也永远不要使用你自己的口号。任何你对朋友或同事说过且足以重复的话都是糟糕的选择。如果你的想象力完全枯竭，Diceware
    (http://www.diceware.com) 是一个使用普通骰子从真实单词随机生成大部分易记短语的工具。虽然入侵者可能会破坏你的一周，但一个拥有你的私钥且幽幽感的同事可能会更令人恼火。


    主机密钥不使用短语，因为 SSH 服务必须在系统启动时启动。你可以在服务器密钥使用短语，但 SSH 在有人在服务器控制台输入短语之前不会启动。这在大多数环境中是不可接受的。


    ## 用户密钥


    用户密钥对比密码提供了更强的身份验证。结合代理（见本章稍后的“SSH 代理”），用户密钥消除了在远程机器上输入任何身份凭据的需求。从密码学角度来看，用户密钥与主机密钥相同。唯一的区别在于密钥使用的地方。


