    `HostKeyAlgorithms ssh-ed25519, ssh-rsa`


    你将使用的具体方法完全取决于你熟悉的工具以及你已经建立的自动化方案。如果可能的话，请尽量复用你现有的工具。


    如果你编写了一个良好的工具来收集、验证和构建 `known_hosts` 文件，请将其公开发。


    ## 撤销主机密钥 (Revoking Host Keys)


    如果你有理由怀疑服务器的密钥已泄露，请撤销它。在你的 `known_hosts` 中找到该服务器的所有主机密钥条目。在所有这些条目的前面添加字符串 `@revoked`。为服务器生成新的主机密钥并重启
    `sshd`，然后将新的主机密钥添加到你的 `known_hosts` 中。现在你可以将更新后的 `known_hosts` 分发给你的客户端，如果在（极少数情况下的）用户尝试使用已撤销的密钥，用户将收到警告。


    撤销密钥的有效性完全取决于你是否向客户端分发了 `known_hosts`。


    ## 分发主机密钥


    每当 SSH 服务器的主机密钥添加、移动或更改时，用户都会看到关于主机密钥警告。分发 `known_hosts` 的目的就是防止用户看到不必要的警告。走在用户前面。每当你部署或移除服务器，或者必须为服务器提供新密钥时，都要更新你的
    `known_hosts`。如果你延迟更新 `known_hosts`，用户将学会忽略警告。


    维护集中 `known_hosts` 文件最糟糕的部分是将该文件复制到你所有的服务器和工作站。你很忙。如果更新需要花费大量的时间或精力，你将无法跟进。你真的需要一个像
    `Ansible`、`Puppet` 或其许多竞争对手那集中系统。`Active Directory` 非常适用于将主机密钥分发到 Windows 系统。如果你从未用过自动化，我推荐使用
    `Ansible`。一旦你为现有系统有了完整的 `known_hosts`，更新该文件并推送到你的所有系统只需要一两分钟，并能为你的用户和支持团队节省数小时的劳动。


    ### 分发 known_hosts


    所有 OpenSSH 客户端都会检查 `/etc/ssh/ssh_known_hosts` 以查找主机密钥。将你的 `known_hosts` 复制到你每台服务器和工作站的此位置。当有人再次在这些机器上使用
    `ssh(1)` 时，正确的密钥已经就位。


    OpenSSH 除了检查系统的 `/etc/ssh/ssh_known_hosts` 之外，还会检查每个用户个人 `known_hosts` 文件中的主机密钥。客户端将使用与服务器提供的密钥匹配的任何条目。当你首次部署集中
    `known_hosts` 时，每个用户可能都有已有的个人 `known_hosts`。你不希望用户个人缓存中的任何过期或无效的条目干扰随后的密钥更改或撤销。不要直接删除所有人的
    `known_hosts`；它们可能包含你不控制的服务器的已验证主机密钥。相反，在首次部署时，将每个用户的个人 `known_hosts` 移动到类似 `known_hosts.personal`
    的地方。


    务必告诉你的用户发生了什么。最好提前通知。


    一旦你建立了一套维护 `known_hosts` 的系统，你会在 SSH 中发现自动化的其他用途。记住 `/etc/ssh/ssh_config` 设置了
    `ssh(1)` 的系统默认值。如果你有需要特殊设置的组织标准，你可以在全局配置中输入它们，为你的用户节省编辑自己的配置或记住命令行参数的精力。如果你的组织在非标准端口上运行
    SSH，在 `/etc/ssh/ssh_config` 中设置 `Port` 关键字实际上可能会获得你的用户的好感。个人配置文件会覆盖系统级设置，所以如果用户真的执意为之，他们仍然会自误。


    ### 分发 PuTTY 主机密钥


    PuTTY 将主机密钥存储在 Windows 注册表中。复制密钥不像将文件移动到所有工作站那么简单，但可以简化。PuTTY 团队有一个 Python 脚本可以将
    `known_hosts` 转换为 PuTTY 的注册表密钥 `hk2reg.py`。你会在正常的 PuTTY 安装中找不到 `hk2reg.py`，但它包含在源代码中。你可以从
    PuTTY 网站下载源代码，或者从 PuTTY GitHub (https://github.com/github/putty) 的“contrib”目录中获取。


    运行 `hk2reg.py` 并给它一个参数，即你原始的 `known_hosts`。


    ```

    kh2reg.py pristine-known_hosts > putty.reg

    ```


    通过 Active Directory、登录脚本或让用户双击该文件在客户端上安装此注册表文件。


    记住 PuTTY 将密钥存储在每个单独用户的注册表中。没有系统级的 PuTTY 注册表树。按用户分发密钥，而不是按机器。


    如果你在为各种平台维护 `known_hosts`，我建议这种分发主机密钥流：首先收集你的主机密钥。为你的 OpenSSH 客户端创建一个 `known_hosts`
    文件。触发脚本将新的 `known_hosts` 分发到你的每个 OpenSSH 系统。在运行时，使用 `kh2reg.py` 创建 Windows 注册表。最后，将你的新注册表文件排队通过
    Active Directory 分发。当人们下次登录时，他们应该拥有所有新密钥。


    ## DNS 中的主机密钥


    OpenSSH 支持在域名体系中检查主机密钥指纹。（PuTTY 不支持。）这消除了将文件推送到服务器的需求，但传统的 DNS 服务是不安全的。如果你想通过
    DNS 安全地分发服务器的公钥指纹，你必须拥有 DNS 安全扩展 (DNSSEC)。如果你还没有 DNSSEC，请现在去配置它，然后回来。你可能会发现我的书
    *DNSSEC Mastery* (Tilted Windmill Press, 2013) 有用。


    我们不会涵盖 DNS 基础知识。如果你正在考虑通过 DNS 分发密钥指纹，我将认为你知道什么是区域文件 (zone file)、为什么资源记录 (RR) 重要，以及为什么要更新序列号
    (serial numbers)。


    ### SSHFP 记录


    SSH 指纹 (SSHFP) 记录提供了主机的 SSH 指纹。该记录看起来如下：


    ```

    wrath IN SSHFP 1 1 07988cadf134050d458dfa5f2c062b5e68106163

    ```


    与任何标准 DNS 记录一样，第一个字段给出主机名，第二个字段表示这是互联网记录，第三个字段表示这是 SSH 指纹记录。SSH 特有的细节从第四字段开始出现，该字段给出算法类型。（注：原文此处有大量重复，翻译时已清理逻辑）。


    SSH 特有的细节从第四字段开始出现，该字段给出算法类型。你不需要记忆哪个数字映射到哪个，但这里的 `1` 是指纹。第五个字段是用于生成此 SHA1 的消息摘要，而
    `2` 代表 SHA256。最后，第六个字段是实际密钥。


    对于你的服务器提供的每个公钥，你需要两个 SSHFP 记录；一个用于 SHA1，一个用于 SHA256。


    ### 创建 SSHFP 记录


    不要尝试手动创建 SSHFP 记录。`ssh-keygen` 程序可以通过 `-r` 标志读取本地服务器上的密钥文件并生成记录。将主机名作为参数。


    ```

    $ ssh-keygen -r wrath

    wrath IN SSHFP 1 1 07988cadf134050d458dfa5f2c062b5e68106163

    wrath IN SSHFP 1 2 b7931f4739ca1ed73e8642bd029fb69dda05913058ffb096

    wrath IN SSHFP 2 1 3f73194323def663866a7b3996e6be113d7ea30

    wrath IN SSHFP 2 2 927b54096876789ca926da1aa80db5a9751c8d9c5c99527b3a231e878823

    wrath IN SSHFP 3 1 cf61d5ed8a653750198daf77f0a409d48c8ef60

    wrath IN SSHFP 3 2 4d2277f46a699d475ff095fa274a007fdf8281ad8bccb3575feb62779e257e8e

    wrath IN SSHFP 4 1 59c3ed21e086b923a4e8a49504691c84f5a1590

    wrath IN SSHFP 4 2 4e2f1c2ee4850d1bb43fffd43e16d27df99d0a3491582f51423dd7d48944f513

    ```


    将这些记录加载到你的 DNS 服务器。你也可以将服务器的公钥文件复制到集中主机，并告诉 `ssh-keygen` 使用 `-f` 标志使用这些文件。


    ```

    $ ssh-keygen -r wrath -f ssh_host_ed25519_key.pub

    ```


