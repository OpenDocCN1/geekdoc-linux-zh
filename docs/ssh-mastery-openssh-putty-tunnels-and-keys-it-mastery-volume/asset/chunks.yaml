    # 第 2 章：常见配置


    所有配置文件都位于 `/etc/ssh`。某些操作系统会使用备用位置——例如，OSX 使用 `/private/etc`，而 FreeBSD 使用 `/usr/local/etc`。


    `sshd_config` 文件包含服务器设置，而 `ssh_config` 文件包含客户端设置。两个文件都可以用文本编辑器编辑。


    ```

    Port 22

    ```


