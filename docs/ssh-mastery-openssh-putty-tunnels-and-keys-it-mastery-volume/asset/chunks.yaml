    SHA256:TSJ39GppnUdf8JX6J0oAf9+Cga2LzLNXX+tid54lfo4.


    Please contact your system administrator.


    Add correct host key in /home/mwlucas/.ssh/known_hosts to get rid of this message.


    Offending ECDSA key in /home/mwlucas/.ssh/known_hosts:5


    ECDSA host key for gluttony.mwl.io has changed and you have requested strict checking.


    Host key verification failed.


    Scary-looking stuff? It should be. Something scary has happened. Your SSH client
    is screaming that something is Very Wrong. If your laptop was an ambulance, the
    lights would be spinning and the siren blaring. The super-secret host key pair
    used to identify this system has changed. This can happen for one of six reasons.
    Identifying which requires talking to the sysadmin.


    Maybe the sysadmin destroyed the key pair, either accidentally or deliberately,
    and generated a new key pair. She should have a new key fingerprint for you.


    Perhaps the key fingerprint cached by your client is wrong. You might have a desktop
    security issue.


    Or, the server might have been upgraded or replaced, and now supports a new key
    algorithm. The sysadmin should have a new key fingerprint for you.


    It could be that the site uses round-robin DNS, effectively giving several servers
    a single hostname, and you’re connecting to the shared name rather than an individual
    server’s unique name. Access individual hosts, not a shared hostname.


    Perhaps your host’s key cache is corrupt. Re-validate the host key. This is annoying,
    but not insurmountable. Your sysadmin can confirm that the host key has not changed.


    Lastly, it’s possible that an intruder controls the server or has diverted your
    connection to a different server. You, the sysadmin, and/or your security team,
    are about to have a bad day.


    The only way to know which? Talk to the sysadmin. DO NOT CONNECT TO THE SERVER
    UNTIL YOU KNOW WHY THE KEY CHANGED. All of these are serious errors that require
    investigation.


    If the key changed for a legitimate reason, verify the new key. If the new key
    is correct, replace the old key with the new one. PuTTY offers to replace the
    key for you, while in OpenSSH you must edit the key cache yourself, as discussed
    in Chapter 5\. The error message gives the line in known_hosts that contains the
    obsolete key. If the key is still not correct, talk to the sysadmin again. A legitimate
    SSH key change might mask an illegitimate intruder; I’ve seen more than one freshly
    installed server get compromised before the first legitimate logon.'
