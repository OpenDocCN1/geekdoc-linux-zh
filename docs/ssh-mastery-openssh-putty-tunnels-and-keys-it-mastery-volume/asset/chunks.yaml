    \ SSH……算吧。\n\n```bash\nssh admin@203.0.113.1\n```\n\nUnable to negotiate with\
    \ 203.0.113.1 port 22: no matching host key type found. Their offer: ssh-dss\n\
    \n该路由器提供的主机密钥类型，当前的 OpenSSH 默认并不接受。`HostKeyAlgorithms` 关键字允许你重新启用那些受支持但不再默认开启的主机密钥算法。`ssh-dss`\
    \ 算法（也称为 DSA）非常弱，且在现代 SSH 中已被遗弃，但由于这是我的家庭网络，我在这里信任它。使用 `HostKeyAlgorithms` 关键字将其添加回\
    \ ssh 支持的选项中。\n\n```bash\nssh -o HostKeyAlgorithms=+ssh-dss admin@203.0.113.1\n\
    ```\n\n```\nFssh_ssh_dispatch_run_fatal: Connection to 203.0.113.1 port 22: DH\
    \ GEX group out of range\n```\n\n什么，另一个错误？当连接到仅支持过时加密的 SSH 服务器时，你可以预见到需要在命令行设置几个关键字。找出哪些是必要的设置是一个迭代过程。\n\
    \n这个错误稍微晦涩一些。与主机密钥算法错误不同，这里没有明显的关键字可以选择。如果你不熟悉 Diffie-Hellman 密钥交换，最好的办法是使用互联网搜索引擎，看看是否有人遇到过同样的错误。如果你是世界上第一个遇到此确切问题的人，请以详细模式运行\
    \ `ssh`，收集输出结果并联系供应商。\n\n这个特定的错误证明是一个密钥交换问题，在该厂商处广为人知。我必须重新激活一个过时的密钥交换算法。\n\n\
    ```bash\nssh -o HostKeyAlgorithms=+ssh-dss -o KexAlgorithms=diffie-hellman-group14-sha1\
    \ admin@203.0.113.1\n```\n\n现在我可以连接了。\n\n总有一天有一天，OpenSSH 将完全弃用这些算法。在那之前升级你的设备。不过，作为临时修复，你可以在\
    \ `ssh_config` 中设置这些选项。\n\n```text\nHost 203.0.113.1\nHostKeyAlgorithms +ssh-dss\n\
    KexAlgorithms +diffie-hellman-group14-sha1\n```\n\n不过，在我写完这一节后，我可以升级我的路由器了。\n\n\
    ## 转义字符\n\n当你 SSH 登录服务器时，你的所有按键都会传递给服务器。但通过*转义字符*，你可以与本地运行的 SSH 进程通信。转义字符会临时短暂地挂起\
    \ SSH 会话。你可以使用转义字符中断挂起的 SSH 会话、添加端口转发、向网络设备发送传统的串口中断（break）等。\n\n默认转义字符是波浪号（~`）。很少有\
    \ Unix 命令使用波浪号，但你可以按两次来发送一次。按 `~~` 意味着“是的，我真的想发送一个波浪号”。如果你需要更改转义字符，请使用 `ssh` 的\
    \ `-e` 参数并加上引号所需的转义字符。\n\n按下 ENTER、转义字符和第二个字符来执行指令。断开连接是 `~.`，编辑你的端口转发是 `~C`，以此此类推。\n\
    \n### 结束会话\n\n转义字符最简单的用法是终止 SSH 会话。如果远程服务器挂起了，输入波浪号加点。\n\n```bash\nwrath# ~.\n\
    ```\n\n```\nConnection to server wrath.mwl.io closed\nclient\n```\n\n你现在回回了本地机器。\n\
    \n### 调整端口转发\n\n转义字符某种程度上让你回到了过去，调整你用于连接到主机时使用的命令。虽然你不能弄密钥交换算法等，但你可以调整端口转发。输入\
    \ `~C` 进入命令行，然后输入所需的端口转发。\n\n假设我正处于一个 SSH 会话中，我想从桌面电脑的 9999 端口添加一个动态端口转发到服务器。如果我是用这种方式打开\
    \ SSH 会话的，我会在命令行中添加 `-D 9999`。\n\n```bash\nssh ~C\n```\n\n```bash\nssh>\n```\n\
    \n```bash\nssh> -D 9999\n```\n\n```bash\nssh>\n```\n\n```bash\nssh> -K\n```\n\n\
    ```bash\nssh>\n```\n\n```bash\nssh> -KD999\n```\n\n```bash\nssh>\n```\n\n```bash\n\
    \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n...\n\n......,,.,,,..,....... you, you,,,,,,,,,\n\
    \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n a a with with... If you you do\
    \ of,, you youre more competent than everyone. Congratulations!\n\n# 后记\n\n七年前，我曾对系统管理员（sysadmins）使用基于密码的\
    \ SSH 管理直接面向外部的系统这一行为大发雷霆。\n\n这并不是什么新事。比起我发过的那次牢骚，系统管理员要多得多。我决定编写《SSH 精通》（*SSH\
    \ Mastery*）第一版，其明确目的是消灭密码。我不确定这是否有所帮助，但许多资深系统管理员都来找我感谢我写了这本书，特别是因为用书来打人被认为是一种“专业的行为”。我希望这第二版通过涵盖证书等功能，能帮助这些系统管理员进一步加固他们的服务器。\n\
    \nUnix 用户应该已经知道 OpenSSH 是世界上最重要的安全软件之一。如果你还不知道：OpenSSH 是世界上最重要的安全软件之一。几乎每家技术供应商都在其产品中包含\
    \ OpenSSH。这些价值数十亿美元的公司并不为 OpenSSH 付费。某些 OpenSSH 开发者有一份特定的全职工作，是因为雇主给了他们时间开发 OpenSSH，而\
    \ Google、Microsoft 和 Facebook 等公司捐赠了资金来支持该项目。在很大程度上，OpenSSH 是由一群热爱优秀软件的人开发的。\n\
    \n一个大型软件项目并不便宜。OpenSSH 是作为 OpenBSD 项目的一部分开发的。他们像任何其他 组织一样需要服务器、带宽和电力，但必须不断筹款。如果你觉得\
    \ OpenSSH 有用，请考虑给 OpenBSD 基金（http://www.openbsdfoundation.org/）捐赠几美元，以便他们继续下去。\n\
    \n"
