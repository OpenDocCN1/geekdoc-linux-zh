  raw: 'This host shows three sshd(8) processes. The first, PID 626, shows plain old
    /usr/sbin/sshd. It’s the master process that listens to TCP port 22.


    The second process, PID 31960, is the privileged process that handles my SSH connection
    into this host. The third, PID 44387, is the unprivileged child process that handles
    your login session. OpenSSH improves security through privilege separation, discussed
    in “Protecting the SSH Server” at the end of this chapter. If someone has deliberately
    disabled privilege separation and is running sshd insecurely, you won’t see the
    unprivileged sessions.[1](#section-0005.xhtml_ref_footnotebookmark_end_54_1)


    If sshd isn’t running, enable it through your operating system configuration tool.


    ## Configuring sshd


    Most operating systems run sshd as a standalone server without any command-line
    arguments. The usual way to configure sshd is through the keywords in /etc/ssh/sshd_config.
    Before you start mucking with changes in that file, though, you should know how
    to test and debug them.


    OpenSSH makes debugging sshd configurations as simple as possible. You must be
    root to run sshd, debugging or not. The simplest debugging methods are alternate
    configuration files, alternate ports, and debugging mode.


    ### Alternate Configuration Files and Ports


    Suppose you want to edit sshd_config, but need to be sure that the change works
    as expected. The -f command-line argument tells sshd(8) to use an alternate configuration
    file.


    # **/usr/sbin/sshd -f sshd_config.test**


    Note that I executed this test configuration using the full path to sshd. OpenSSH’s
    sshd re-executes itself when accepting a connection, and it needs the full path
    to do so. If you don’t give the full path, you’ll get an error like “sshd re-exec
    requires execution with an absolute path.”


    Only one sshd instance can attach to a particular TCP port. Your test sshd process
    probably won’t start because it cannot bind to port 22\. You could edit sshd_config.test
    to assign your test process another port, but then you have to re-edit the file
    when moving it to production, and we all know that’s exactly the point that will
    figure prominently in the outage report. Instead, override the configured TCP
    port and assign a new one with the -p command-line argument.


    # **/usr/sbin/sshd -f sshd_config.test -p 2022**


    The test process is now listening on port 2022\. (Note that -p cannot override
    a ListenAddress keyword binding sshd to a port as well as an address; see “Network
    Options” later this chapter.)


    By setting an alternate configuration file and port on the command line you can
    test your new configuration, approve it, and move it into production, confident
    that you didn’t wreck a file in making the final, untested change. (Not that I’ve
    ever broken a system that way, mind you.) In any case, save your original sshd_config,
    just in case your change causes problems testing didn’t expose.


    Remember to kill your test sshd process when you finish testing.


    ### Validating sshd_config Changes


    Perhaps you want to make a minor change and think you don’t need to perform a
    full test. You can ask sshd(8) to verify the configuration file and all the key
    files with the -t flag.


    # **sshd -t**


    /etc/ssh/sshd_config: line 112: Bad configuration option: ExposeAuthInfo


    /etc/ssh/sshd_config: terminating, 1 bad configuration options


    Either the version of sshd installed on this host is too old to support the ExposeAuthInfo
    keyword, or the operating system packager deliberately removed the option.


    ### Debugging sshd(8)


    The -d flag tells sshd to run in foreground debugging mode, without detaching
    from the controlling terminal. In debugging mode, sshd can only handle a single
    login request—no, not one request at a time. It processes one login or login attempt,
    and exits. Don’t do this in production; run it on an alternate port. Debugging
    displays everything your sshd process does, in real time, like so.


    # **/usr/sbin/sshd -p 2022 -d**


    debug1: sshd version OpenSSH_7.5, OpenSSL 1.0.2l-freebsd 25 May 2017


    debug1: private host key #0: ssh-rsa


    SHA256:N+faE/OyKhlho8MR8Vw3uhdo75aiuhYotnP/gOOe82E


    debug1: private host key #1: ecdsa-sha2-nistp256 SHA256:Q1buYGtWowrN1/8g/EaTEMQr+69h+/Pai3xI4LXN0c8


    debug1: private host key #2: ssh-ed25519 SHA256:0TCTf0jZUxzu8dahNrLmuKu19T0BkruI4e3mPOjVInE


    debug1: rexec_argv[0]=''/usr/sbin/sshd''


    debug1: rexec_argv[1]=''-p''


    debug1: rexec_argv[2]=''2022''


    debug1: rexec_argv[3]=''-d''


    debug1: Bind to port 2022 on ::.


    debug1: Server TCP RWIN socket size: 65536


    Server listening on :: port 2022.


    debug1: Bind to port 2022 on 0.0.0.0.


    debug1: Server TCP RWIN socket size: 65536


    Server listening on 0.0.0.0 port 2022.


    The debug session starts with the identifying information for your version of
    sshd(8)—in this case, OpenSSH 7.5, built with OpenSSL 1.0.2l, as part of FreeBSD.
    We then see three private keys being loaded, using RSA2, ECDSA, and ED25519\.
    The daemon parses its arguments and binds to a port.


    If the daemon can’t start, it’ll say why, very clearly, right here. You might
    have to read the manual page or do a few Internet searches to figure out what
    the error means, but you’ll know the exact problem.


    Connect to this server with an SSH client, and you’ll get hundreds of lines of
    debugging output as the server and client agree upon encryption protocols, the
    user attempts to authenticate, and various SSH features like X forwarding are
    negotiated. I won’t walk you through such a session, as the output varies widely
    depending on the client, the authentication method, and the SSH features requested
    and offered.


    If you have a problem with SSH, run the server in debugging mode, connect with
    a client, and read the output. Most often, sshd will tell you exactly what the
    problem is.


    When you finish debugging, log out of the client. The sshd(8) process will clean
    up after itself and exit. You can also unceremoniously terminate sshd and throw
    the client out by hitting CTRL-C.


    If a single -d doesn’t provide enough detail, add multiples to increase verbosity.
    Running /usr/sbin/sshd -dd should quench your curiosity. If not, add more -d’s
    until you are no longer curious.


    ## Configuring sshd(8)


    This chapter discusses some generally useful sshd(8) options. Most sshd_config
    options appear in the chapter where they’re most useful—that is, options affecting
    X forwarding appear in Chapter 8, “X Forwarding,” while certificate options appear
    in Chapter 14, “Certificate Authorities.”


    The version of OpenSSH shipped with your operating system might not support all
    of the keywords described in this book. I’ve written this based on OpenSSH 7.6\.
    Some operating systems either ship older versions, or deliberately remove functions
    for their own reasons. If a configuration option doesn’t work on your server,
    consult your operating system documentation or ask your vendor.[2](#section-0005.xhtml_ref_footnotebookmark_end_54_2)


    ### Set Host Keys


    The HostKey keyword gives the full path to a file containing a private key. Each
    supported encryption algorithm uses a separate file.


    HostKey /usr/local/etc/ssh/ssh_host_rsa_key


    HostKey /usr/local/etc/ssh/ssh_host_ecdsa_key


    HostKey /usr/local/etc/ssh/ssh_host_ed25519_key


    The default files are named after the type of key they contain. The file ssh_host_rsa_key
    contains an RSA key, ssh_host_ed25519_key is an ED25519 key, and so on. This isn’t
    mandatory—OpenSSH will figure out what type of key is in a file and load it if
    appropriate—but it’s definitely the best practice. Putting your RSA key in a file
    named after ED25519 will confuse everyone.


    Different operating systems handle missing key files differently. BSD-style and
    Red Hat-based systems automatically create missing key files. Many Linux systems
    require the sysadmin to manually create missing key files, but integrate key creation
    into their usual system administration tools. For example, Debian-based systems
    create missing key files when you run dpkg-reconfigure openssh-server.'
