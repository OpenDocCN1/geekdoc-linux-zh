    使用不安全的旧版协议 `XDMCP` 进行连接时，其 `$DISPLAY` 值将类似于 `remote:1` 的内容。这意味着你的 shell 在某处以某种方式找到了一个
    X 显示，但它并不是你正尝试通过 SSH 转发的那个。如果 `$DISPLAY` 看起来很奇怪，不要运行你的 X 程序！可能出了非常、严重的错误。


    现在从你的 shell 运行一个 X 程序，它应该显示在你的桌面上。大多数 X 客户端都包含了 `xterm(1)` 终端模拟器。在你的 SSH 服务器上后台运行
    `xterm`。


    ```

    $ xterm &

    ```


    你会在 SSH 服务器上得到一个命令提示符。过了一会儿（取决于你的服务器和客户端之间的带宽和延迟），远程系统的终端将出现在你的桌面上。


    如果你不喜欢 `xterm`，可以尝试使用 `xclock`、`xeyes` 或 `xcalc`。


    当你启用 X 转发进行连接时，可能会看到类似 `untrusted X11 forwarding set up failed` 或 `No xauth data`
    的警告。在通过 SSH 转发 X 时，这些警告并不是致命的，不必担心。


    ## 使用 OpenSSH 的远程 X 命令


    为了运行一个 X 程序（或任何程序）而登录另一台机器可能是很麻烦的。`ssh` 的 `-f` 允许你在另一台机器上运行命令的同时，让 SSH 会话本身保持后台运行。这看起来就像是你直接在另一个主机上执行命令。在你想要访问的主机名之后直接给出命令。例如，如果我想在
    `wrath` 上运行一个 `xterm`，我可以运行：


    ```

    $ ssh -f wrath xterm

    ```


    客户端将连接到服务器并显示服务器显示的任何登录文本。随后，SSH 客户端进入后台，即使在远程系统上运行命令，也会在你的本地系统上恢复你的命令提示符。


    注意，远程命令是在用户的完整登录环境中运行的。附加到用户 shell 的任何文件（如 `.cshrc` 或 `.profile`）都会被加载。取决于你运行的应用程序，这可能会给你带来麻烦。


    将通过 SSH 转发的话后台化非常有用，但通过 SSH 转发 TCP 端口更为有用。我们接下来来看这一点。


    # 第 9 章：端口转发


    通过 SSH 进行端口转发是一个有争议的话题。


    SSH 可以作为任意 TCP 流量的封装。你可以将 `telnet`、`POP3`、`IMAP` 或 `HTTP` 等未加密服务隐藏在 SSH 内部，安全地传输这些原生不安全的协议。SSH
    会话可以携带任何 TCP/IP 协议，包括你的本地 IT 安全团队在组织网络上禁止的协议。因此，许多具有高安全要求的组织不允许 SSH 穿越和或离开它们的网络。要求较严格的组织利用这种能力来保护它们的网络。（你也可以使用
    SSH 创建 VPN 来承载所有 IP 协议，那将在第 13 章。）


    例如，我使用 `WordPress` 管理我的网站和博客。它为网站管理和设计提供了一个友好的点击式界面，让我获得了一个外观尚的页面，而我实际上并不需要学习关于网页设计的*任何*知识。1
    有时，在 Let’s Encrypt 出现之前的黑暗日子里，我的网站使用普通的 `HTTP`。我使用 `SSH` 端口转发在我的 Web 服务器和桌面之间建立
    `HTTP` 隧道。这保护了我传输过程中的凭据，并消除了密码在链路上被窃取的风险。这是 `SSH` 端口转发的一种合理且合法的用法。


    然而，假设我的桌面在一个安全网络内部。防火墙严格限制了网页浏览并阻止了所有文件传输。如果我可以使用 `SSH` 连接到网络外的服务器，我就可以将桌面的流量转发到那个外部服务器，以获得不受限制的互联网访问。我可以通过
    `SSH` 上传机密文档，而防火墙日志只会显示我建立了一个 `SSH` 连接。你的网络管理员会反对，而且理由充分。


    ## 端口转发与安全策略


    如果你是一个组织的安安全官，端口转发可能会让你考虑完全阻止 `SSH`。我理解。我曾做过你的工作。你还应该知道，固执的用户可以将 `SSH` 隧道化到 `DNS`、`HTTP`
    或几乎任何其他服务或协议内部，包括原始 `ICMP`。绝对阻止 `SSH` 的唯一方法是拒绝所有的 `TCP`、`UDP` 或 `ICMP` 连接，使用能够智能检查流量的
    Web 代理，并且不允许你的客户端机器即使通过代理也访问公共 `DNS`。我见过一家公司实际上实施了这种安全边界，但对于某些特别笨重的业务关键软件，他们留下了许多漏洞和例外。如果你无法在环境中实施这一点，但又有严格的安全要求，你必须与你的用户合作以满足这些要求和业务需求。我强烈建议建立稳固的网络流量感知计划，以及入侵和外泄检测，这样你就能知道网络流量何时偏离常态。阅读
    Richard Bejtlich 关于入侵和外泄分析的书籍，以及我自己的《网络流量分析》（No Starch Press, 2010），并实施此类讨论的程序。


    作为用户，拥有通过 `SSH` 隧道传输任意流量的能力并不意味着你应该这样做。如果你的组织安全策略禁止端口转发和/或隧道化，请不要这样做。如果策略说“使用
    Web 代理并不要离开 IRC”，那么请听从。如果你使用了这些技术并被训斥、解雇或消灭，我不负责。（即使我们这些 IT 安全官都是些不理解你对 IRC 和
    MySpace *个人且迫切*需求的狭隘独裁者。）


