    在 PuTTY Sessions 界面中，转到 `Host Name (or IP Address)`。输入你的 SSH 服务器的主名或 IP 地址。如果需要，你也可以在此更改端口号。点击窗口底部的
    `Open`。


    PuTTY 配置窗口将会消失，取而代之的是一个黑色终端窗口。


    ### 保存 PuTTY 连接


    你可以预配置 PuTTY 连接，确保你与特定主机的会话每次都以相同的方式进行。在 `Host Name (or IP Address)` 下输入 SSH 服务器的主名。在
    `Saved Sessions` 下，为此连接输入一个名称。我通常以主机名命名我的连接，并可能针对会话中的任何特殊配置添加一或两个单词。我可能会有一个标记为
    `dns1` 的连接，另一个命名为 `dns1 with X` 的连接，这样当我在需要时就可以方便地使用 `X` 转发。


    要运行保存的连接，双击连接名称。


    要复制保存的连接，高亮它，点击 `Load`，进行更改，然后以不同的名称保存。


    ### PuTTY 管理


    你会在运行中的 PuTTY 会话的左上角看到一个 PuTTY 图标。这将弹出一个包含常用任务的下拉菜单。


    要克隆现有会话（即打开指向同一主机的第二个窗口），选择 `Duplicate Session`。


    要为你已保存配置的主机打开新窗口，选择 `Saved Sessions` 和相应的会话名称。


    要为完全新的主机打开窗口，请 se 选择 `New Session`。


    ### PuTTY 复制和粘贴


    PuTTY 不使用标准的 Windows 剪切粘贴快捷键。它的工作方式更像 UNIX 风格的 `X` 。要在 PuTTY 窗口中复制文本，用鼠标高亮它。要在
    PuTTY 窗口中粘贴文本，点击鼠标右键。你也可以使用 `SHIFT-INSERT`。


    ### PuTTY 配置


    PuTTY 将其配置和主机密钥缓存在 Windows 注册表中，路径为 `HKEY_CURRENT_USER\Software\SimonTatham`。要将
    PuTTY 配置从一个主机移动到另一个主机，请将注册表的此部分复制到你的新机器。有些人甚至使用这些注册表设置通过 Active Directory 向用户分发有效的
    PuTTY 配置。


    ### 调试 PuTTY


    PuTTY 有两个调试辅助：事件日志（Event Log）和会话日志（session log）。


    事件日志记录了当前 SSH 会话期间发生的情况。你可以看到连接的名称、IP 地址和端口、所选的加密算法以及建立 SSH 会话所需的所有各种协商。要查看事件日志，点击
    PuTTY 窗口的左上角并转到 Event Log。


    对于深层调试，请使用会话日志。在打开 SSH 连接之前，查看左侧窗格。在 `Session` 下，你会找到 `Logging` 选项。选择它。此窗口为你提供了几种记录
    SSH 会话日志的选项。我通常选择 `All session output`。为 PuTTY 的日志文件指定一个名称，并浏览选择目录。一旦你的会话运行了一段时间，此文件将包含关于会话的大量详细信息，类似于
    OpenSSH 客户端的调试选项。


    ### 更改运行中的 PuTTY 会话


    你可以修改现有 PuTTY 会话中的某些设置。用户名和加密信息是在登录时设置的，但你可以更改日志、终端行为和隧道设置。


    转到现有 PuTTY 会话的左上角，点击 PuTTY 图标。从下拉菜单中选择 `Change Settings`。这将弹出一个简化 New Session
    窗口，仅显示你可能更改的选项。一旦你完成编辑并确认会话按你的预期方式运行，你就可以保存会话，可以覆盖现有名称或选择新名称。


    ## 连接复用


    SSH 会话可能需要很长时间打开，特别是当 SSH 服务器无法找到客户端 IP 地址的反向 DNS 条目时。或者，你可能有一个非常原始的防火墙，限制了网络分段之间的并发连接数。也许其中一台机器非常老旧，以至于初始密钥交换需要几秒钟。SSH
    支持这些情况下的连接复用，允许你通过一个 TCP 连接运行多个 SSH 会话。虽然这并不能消除首次连接的延迟，但额外的会话启动速度会快得多。


    PuTTY 默认支持并使用连接复用。OpenSSH 可以复用连接，但需要额外的配置。


    ### 配置复用


    OpenSSH 的 `ssh` 客户端使用 UNIX sockets 来管理复用连接。用户必须为 sockets 创建目录并设置权限，使得只有用户本人可以读取它们。


    ```

    cd $HOME/.ssh

    mkdir sockets

    chmod 700 sockets/

    ```


    你现在可以在 `ssh_config` 中启用复用了。


    ```

    ControlMaster auto

    ControlPath ~/.ssh/sockets/%r@%h:%p

    ```


    `ControlMaster` 设置告诉 `ssh` 尝试使用连接复用，如果复用失败，则回退到单独 TCP 连接。这允许你将复用作为默认，但仍然可以连接到非
    OpenSSH 服务器。


    `ControlPath` 告诉 `ssh` 在哪里寻找复用管理文件。此语句接受令牌，类似于 `sshd_config`。`%u` 宏展开为用户名，`%h`
    展开为主机，`%p` 展开为端口。如果我用户 `mwl` 连接到端口 `2222` 的主机 `avarice`，SSH 会在指定目录创建 socket 文件
    `mwl@avarice:2222`。


    PuTTY 默认启用连接复用。要在打开会话之前关闭它，请打开 PuTTY 并从左侧窗格选择 `SSH`。你会看到一个名为 `Share SSH connections
    if possible` 的复选框。取消勾选它。


    ### 复用的风险


    任何能够读取 OpenSSH 复用控制文件或访问 PuTTY sockets 的人都可以访问你连接上的所有数据。原始连接已经通过身份验证，因此入侵者不需要你的密码即可获取终端。仅在你信任所有人的客户端上使用连接复用。


    在复用的 SSH 会话中拷贝大文件会降低你的其他会话。


    X 转发与复用配合得并不好。


    记住，复用时，你对主机的所有 SSH 连接都运行在你打开的第一个连接上。如果该连接失败，所有与其复用的连接也会失败。


    我个人只在单用户桌面系统上启用复用。其他人对此有意见。请根据你的环境选择适合的操作。


