- fmt: '

    Speaking very generally, a computer can identify you based on something you are,
    something you know, or something you have. Iris scanners and fingerprint readers
    verify your physical body, something you `are`. A password verifies that you `know`
    a secret. Getting into a house requires that you `have` the door key. Key-based
    authentication combines two of these: you must `have` the file containing the
    private key and you must `know` the passphrase for that key. Admittedly, a private
    key file is easier to reproduce than a physical key—it’s only copying the file—but
    it’s more difficult to reproduce than an 8-character password. This additional
    layer of security provides extra protection against unauthorized use of an account.


    Keys are more complicated than passwords, however. Just as you wouldn’t leave
    your front door key hanging from the doorknob, you must protect your private keys.
    If the computer is lost or stolen, any private keys on that machine should be
    considered lost as well. While it’s possible to remember a password, most people
    won’t put in the time or energy to remember the thousands of characters in a private
    key. Yes, you should have backups… but if your laptop is stolen, the private keys
    on that laptop should be considered compromised anyway.


    Is setting up authentication via user keys really worth the trouble? For almost
    a decade, a network of compromised machines dubbed the “Hail Mary Cloud” has repeatedly
    scanned the Internet for SSH servers. When a cloud member finds an SSH server,
    it lets the other machines in the network know about it. The cloud then methodically
    tries possible usernames and passwords. One host on the network tries a few times,
    then another, then another. Blocking individual IP addresses is not a useful defense
    against these scanners, because each address only tries a few passwords before
    the next attacker takes its turn.


    Any one attempt has low odds of guessing successfully. The attempts are constant.
    They never end. Eventually the Hail Mary Cloud will get lucky and break into your
    server. It might be tomorrow, or next year, but it `will` happen. To prevent this
    intrusion, you can either use packet filtering to block public access to your
    `SSH server`, or you can eliminate password authentication. User keys let you
    eliminate passwords.


    ## SSH Agents


    Replacing a password with a passphrase and a private key has one obvious flaw:
    typing passwords is an annoyance. Why replace an annoying password with an even
    more annoying passphrase? It might be more secure, but are you and your users
    really going to bother?


    That’s where an SSH agent comes in. An `SSH agent` is a small program that runs
    in the background. When you start a desktop session, you enter your passphrase
    to decrypt your private key. The decrypted private key is loaded into the `SSH
    agent`. The agent stores the key in memory, never on disk. The agent processes
    all private key operations for the `SSH client`. When the `SSH client` needs to
    decrypt something with the private key, it asks the agent to handle it. When you
    log off for the day, the `SSH agent` shuts down. The decrypted private key disappears
    from memory. In other words, with an `SSH agent`, you type your passphrase once
    per work session, no matter how many `SSH sessions` you open that day.


    On a typical day I log into my workstation, activate my `SSH agent`, and type
    my passphrase once. I then open innumerable `SSH sessions` to servers and routers
    all over my network, without typing a passphrase or password again. When I log
    off for the day, my agent shuts down. The memory used by the agent is wiped and
    returned to the operating system. My private key is once again available only
    in the encrypted file.


    Agents do not guarantee security. Anyone who can read your computer’s memory while
    you are logged in can access the decrypted key. This includes the root account.
    If you don’t trust the system administrator on your desktop, don’t use an `SSH
    agent`. If you suspend your laptop, the decrypted private key remains in memory.
    Anyone who can wake your laptop and login can use the key as their access rights
    permit. A random thief interested in swapping your laptop for a quick buck probably
    won’t know or understand what he has, but a thief who is specifically targeting
    you and/or your employer will probably check for a live private key. More commonly,
    if you don’t lock your desktop before going to lunch, a coworker might take advantage
    of your unsecured terminals. These problems are best solved by emptying or shutting
    down your agent when you’re not actively using the system.


    Agent security is also a problem on multiuser machines. Anyone who has administrative
    or superuser privileges on the system can access any `SSH agent` running on the
    host. If other people have root or `Administrator` access on your desktop, they
    can access your agent and masquerade as you. Using an agent would be unwise.


    We’ll discuss SSH agents for both PuTTY and OpenSSH later in this chapter.


    ## Creating an OpenSSH User Key


    If you have a Unix-like desktop, generate a key using `ssh-keygen(1)`. Don’t use
    any arguments and the program will walk you through generating a user authentication
    key.


    ```bash

    $ ssh-keygen

    ```


    Generating public/private rsa key pair.


    Enter file in which to save the key (/home/mwlucas/.ssh/id_rsa):


    Enter passphrase (empty for no passphrase):


    Enter same passphrase again:


    Your identification has been saved in /home/mwlucas/.ssh/id_rsa.


    Your public key has been saved in /home/mwlucas/.ssh/id_rsa.pub.


    The key fingerprint is:


    SHA256:LK+1dKbb/PtN8KjiXLDdZzOK1fivRkMZIn8YoOrmEvA mwlucas@zfs1


    The key''s randomart image is:


    ```

    +---[RSA 2048]----+

    ```


    You’ll be asked where the new key should be. The various OpenSSH programs expect
    to find key files in the default locations, so take the suggestion. You’ll then
    be asked to enter a passphrase twice, to verify that you can type it than once.
    Your private key will be encrypted with this passphrase. Always use a passphrase,
    as discussed a few pages previous.


    SSH uses identical key formats for hosts and users. When you generate a user key,
    you get a key fingerprint and a randomart image. Neither is particularly useful
    for user authentication keys.


    You’ll find your new private key in `$HOME/.ssh/id_rsa` and your new public key
    in `$HOME/.ssh/id_rsa.pub`. Immediately backup your new key pair on off-line media,
    such as a flash drive or CD-ROM. If you destroy your workstation, you’ll want
    the ability to recover your key pair.


    ### Key Algorithms


    Like host keys, user keys can use a few different encryption algorithms. If you
    don’t specify an algorithm, the OpenSSH tools use the recommended one—at this
    time, 2048-bit RSA. You can specify a different algorithm with the `-t` flag.


    ```bash

    $ ssh-keygen -t ecdsa

    ```


    Why create multiple keys? Cryptographers have this distressing habit of finding
    weaknesses in cryptographic algorithms. One day the unthinkable will happen and
    someone will discover a flaw in a widely used and broadly trusted algorithm. All
    keys that use that algorithm will immediately become untrustworthy. If you have
    user keys with different algorithms, you can disable the broken algorithm on your
    SSH server and still have server access.


    ## Creating a PuTTY User Key


    Use the `puttygen` program to create user authentication keys for PuTTY. The PuTTY
    installer includes `puttygen`, or you can download it individually from the PuTTY
    website. When you start `puttygen`, you’ll get a screen like Figure 7-1.


    ![](image3.jpg)


    Figure 7-1: PuTTYgen Startup

