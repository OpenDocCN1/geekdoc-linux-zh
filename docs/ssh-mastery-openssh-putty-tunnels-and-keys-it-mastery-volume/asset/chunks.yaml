    如果你有 LDAP 这样的中心化身份验证系统，可以将用户身份验证密钥存储在该系统中。OpenSSH 可以通过 `AuthorizedKeysCommand`
    和 `AuthorizedKeysCommandUser` 关键字查询该信息源。


    ```

    AuthorizedKeysCommand /usr/scripts/getAuthorizedKeys.pl

    AuthorizedKeysCommandUser ldap

    ```


    每当你提到基于网络的身份认证时，人们的脑海就会跳出 LDAP。LDAP 专门为这种目录查找而设计——它基本上是一个针对读取优化的数据库。我无法在这里详细介绍，因为
    LDAP 目录在供应商之间差异巨大。无论你使用哪种，都需要将 SSH 密钥架构加载到你的目录中。与你的 LDAP 管理员，，他们能提供什么。所需的精确架构随目录布局而异，但通常涉及向用户账户附加一个
    `sshPublicKeys` 条目。对于基于商业 LDAP 产品的大企业，LDAP 管理员通常不愿意扩展核心目录项，因为这限制了他们获取供应商支持的能力。根据我的经验，解决这个问题比密钥分发的任何其他部分都需要更多精力。


    一旦加载了架构，你需要一个脚本从目录中获取 `authorized_keys`。脚本的类型取决于人们使用的身份验证系统的类型。一个针对 Active Directory
    进行认证的脚本与一个针对自建 OpenLDAP 目录进行认证的脚本完全不同。CentOS 自带了一个针对其 LDAP 服务器进行认证的脚本 `ssh-ldap-helper(8)`。人们已经为各种目录服务解决了这个问题并提供了他们的脚本，因此在花费下一个十来调试你自己的脚本之前，请务必寻找现有的解决方案。


    `AuthorizedKeysCommandUser` 关键字定义了运行 `AuthorizedKeysCommand` 中脚本的账户。如果没有设置 `AuthorizedKeysCommandUser`，`sshd`
    将不会运行该脚本。所有获取用户 `authorized_keys` 的尝试都将失败。我建议创建一个除了运行此脚本外没有其他权限的用户。隔离的无权限用户是一个极其廉价的安全解决方案，但其使用频率还不够。


    不要因为 LDAP 赢得了所有的关注，就因为认为 LDAP 是必须的而限制自己。如果你有它，它确实很方便，但你可以使用任何符合你环境的服务。如果你的组织规定所有应用程序必须通过
    ODBC 互操作，或者可能是通过 HTTPS 的 Wordpress XMLRPC 交互，请利用你现有的知识编写一个以这种方式获取密钥的脚本。


