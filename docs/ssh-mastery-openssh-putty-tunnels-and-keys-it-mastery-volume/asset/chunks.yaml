    # Chapter 2: Common Configuration


    All configuration files reside in `/etc/ssh`. Some operating systems use an alternate
    location—for example, OSX uses `/private/etc`, while FreeBSD uses `/usr/local/etc`.


    The `sshd_config` file contains server settings, while the `ssh_config` file contains
    client settings. Both files can be edited with a text editor.


