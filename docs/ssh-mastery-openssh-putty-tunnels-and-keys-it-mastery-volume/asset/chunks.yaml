    `@` 符号、然后是远程机器名来实现这一点。


    ```

    $ ssh jerkface@devio.us

    ```


    你也可以用 `-l` 指定用户名。


    ```

    $ ssh -l jerkface devio.us

    ```


    如果这是一个持续操作，请在 `ssh_config` 中使用 `User` 选项指定用户名。


    ```

    Host devio.us

    User jerkface

    ```


    通过在 `ssh_config` 中存储用户名，我可以忘记它们并释放宝贵的大脑空间。


    ### 更改端口


    某些站点在 22 以外的端口运行 SSH，通常是为了提供安全性更高的假象。这并不能真正保护 SSH，但确实减少了日志噪音。使用 `-p` 和端口号来更改 `ssh`
    连接的端口。如果你的服务器在端口 2222 上运行 `sshd`，请使用以下命令连接：


    ```

    $ ssh -p 2222 gluttony

    ```


    你可以在 `ssh_config` 中指定端口。


    ```

    Port 2222

    ```


    同样，我建议在 `ssh_config` 中存储永久连接信息。


    ### 命令行上的 SSH 选项


    SSH 不仅仅是一个命令；它是一个协议。而该协议有各种边缘情况。有时你需要在命令行上设置某些边缘情况。虽然 OpenSSH 支持的所有内容都可以作为 `ssh_config`
    关键字可用，但并非所有这些关键字都有命令行等价项。要在命令行上设置这些关键字，请使用 `-o` 命令行选项、选项名称、等号以及该关键字的值。


    ```

    $ ssh -o Port=2222 sloth

    ```


    这个例子显而易见——`Port` 关键字有一个专门的命令行选项 `-p`。我们稍后会看到更复杂的例子。


    ### 评估你的 SSH 配置


    你可以设置命令行选项、用户配置文件中的选项以及全局客户端配置中的选项。`Host` 关键字可能会弄乱你精心调整的默认值，或者你精心调整的默认值可能要求你为特定服务器使用
    `Host` 关键字。当你连接到主机时，你怎么知道 `ssh(1)` 到底在使用哪些选项呢？


    使用 `ssh` 的 `-G` 选项。它告诉 `ssh(1)` 解析目标主机的所有配置，打印出它将使用的配置，并立即退出而不建立连接。你可以检查你的设置以验证你是否获得了所需的内容。


    ## SSH 跳板机 (SSH Jump Hosts)


    系统管理员经常必须通过一个主机到达另一个主机。也许你信任这个中间主机。也许你并不信任。OpenSSH 支持跳板机，允许你使用 SSH 服务器作为中继来连接第二台服务器。是的，你可以通过手动登录中间主机再次运行
    `ssh` 来实现，但使用内置支持意味着跳板机看不到你的任何明文。跳板机无法控制客户端和目标服务器协商的选项。这意味着你可以说通过一个不接受任何内容的跳板机转发
    X 或你的代理。使用 `-J` 指定跳板机。


    ```

    $ ssh -J mwl@envy pride

    ```


    在 `ssh_config` 中使用 `ProxyJump` 关键字设置跳板机。


    ```

    Host pride.mwl.io

    ProxyJump mwl@envy.io

    ```


    ## 地址选项


    SSH 客户端允许通过设置地址族和源地址来选择它如何使用 TCP/IP。


    IP 版本


    `AddressFamily` 关键字告诉客户端仅通过 IPv4 (`inet`) 或仅通过 IPv6 (`inet6`) 连接。默认值是 `any`，这意味着“通过系统解析器返回的任何协议进行连接”。有时，通过其中一种协议你会获得更好的连接体验。如果你通过隧道获取
    IPv6 连接，那么对 SSH 只使用 IPv4 可能是合理的。同样，如果你有无限的 IPv6 连接，你可能想对所有内容使用 IPv6。在这里我特意禁用了
    IPv4。


    ```

    AddressFamily inet6

    ```


    你可以使用命令行选项 `-4` 选择仅使用 IPv4。


    ```

    $ ssh -4 lust

    ```


    使用 `-6` 强制使用 IPv6。


    ### 设置源地址


    在单个接口上具有多个 IP 地址的主机，默认从该接口的主主 IP 地址发起所有连接。这并不总是如愿的。服务可以在主机之间迁移，且通常独立于任何防火墙的变化。你可以通过
    `ssh_config` 中的 `BindAddress` 关键字告诉 `ssh` 使用主 IP 地址以外的源 IP 地址。


    ```

    BindAddress 192.0.2.91

    ```


    `BindAddress` 必须绑定到本地机器。`BindAddress` 没有方便的命令行标记。你必须通过 `-o` 指定它。

