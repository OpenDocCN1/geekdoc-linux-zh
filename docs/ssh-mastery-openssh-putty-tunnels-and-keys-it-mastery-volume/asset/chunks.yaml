- fmt: '

    There are many ways to use SSH to move files. Applications such as `rsync` can
    use SSH as a transport mechanism mechanism. Some window managers include `SSH`
    file transfer tools. We’ll cover two specific protocols, `SCP` and `SFTP`, for
    both Unix-like and Microsoft systems. Most other tools that transfer files over
    SSH are actually front ends to one of these protocols.


    Secure Copy Protocol, or `SCP`, was designed as a drop-in replacement for `RCP`.
    SSH File Transfer Protocol, or `SFTP`, was designed to replace `FTP`. It’s an
    interactive protocol, allowing you to browse remote filesystems. OpenSSH includes
    the client programs `sftp(1)` and `scp(1)`, while Windows clients can use `WinSCP`
    for both protocols.


    ## File Copy with OpenSSH


    OpenSSH includes two file transfer programs, `scp` and `sftp`. We’ll start with
    the simpler but less flexible program.


    ### `scp(1)`


    You can use `scp(1)` to copy individual files. The syntax follows the usual Unix
    semantics.


    ```

    $ scp what-you-have where-you-want-it

    ```


    Separate hosts and filenames with a colon, like so.


    ```

    $ scp source-host:filename destination-host:filename

    ```


    Once you authenticate, `scp` transfers the file over the encrypted channel.


    If you don’t enter an element in the command, it’s assumed to be unchanged. For
    example, to copy the local file `data.txt` to the server `sloth`, run:


    ```

    $ scp data.txt sloth:

    ```


    I don’t enter a machine name in the source side, so it’s assumed to be the local
    machine. I enter a remote hostname but not a remote filename, so the filename
    doesn’t change. My file `data.txt` is copied to my login directory on `sloth`.


    If the destination file already exists, `scp` silently overwrites it. If the account
    lacks the privileges to overwrite the file, the copy fails. The `scp` program
    assumes that if you told it to overwrite an existing file, you had good reason
    to. For this reason, I recommend not copying files while logged in as `root`.


    You must use a colon after a hostname. When you skip the colon, `scp` assumes
    that the argument is a file name. Here I skip the colon and copy the file `data.txt`
    to the file `sloth` on the local machine.


    ```

    $ scp data.txt sloth

    ```


    It’s a very secure local copy, at least.


    To change the file name on the remote side, give a new file name.


    ```

    $ scp data.txt sloth:stuff.txt

    ```


    If your source file is on a different machine and you want to copy it to the local
    host, specify the remote hostname as the source.


    ```

    $ scp sloth:data2.txt data2.txt

    ```


    You can copy files to or from any location where you have sufficient privileges.


    ```

    $ scp sloth:/var/log/messages sloth-messages

    ```


    To recursively copy a directory to another machine, use the arguments `-rp`. Here
    I replicate my home directory on the remote host, overwriting any files with the
    same name.


    ```

    $ scp -rp /home/mwlucas sloth:

    ```


    The `scp` program deliberately borrows many command-line options from `cp(1)`
    and `rcp(1)`. This is why the command line options often don’t match `ssh(1)`;
    it’s a drop-in replacement for `rcp(1)`, so the `rcp` flags take precedence. Still,
    if you have more complicated copying needs, check the documentation.


    The `scp(1)` program is largely built out of quarter-century-old `rcp(1)` code.
    This makes adding new features difficult. While nobody’s looking to actively pitch
    `scp` into the Dead Code Dumpster, nobody’s really giving it any attention either.
    The program is what it is.


    If you have complicated file-copying requirements, look at `sftp(1)`.


    ### `sftp(1)`


    The SSH File Transfer Protocol (`SFTP`) is more flexible than `SCP`. Where `SCP`
    only copies files, `SFTP` permits many different file operations such as renaming
    and removing files, listing directories, and so on. You’ll find a few different
    protocols named after some variant of “secure” and “FTP,” so don’t get confused.
    `SFTP` is not the same as `FTP` over SSH, nor is it `FTP` over SSL.


    `SFTP` commands are deliberately copied from `FTP` commands, to simplify transitioning
    between the two. Much of your knowledge of the `FTP` command line applies to `SFTP`,
    but we’ll go through the basics.


    Open a connection with the `sftp` command and a hostname.


    ```

    $ sftp pride

    ```


    Once you authenticate, you’ll be connected and get an `SFTP` prompt.


    ```

    sftp>

    ```


    Once you’ve logged in, entering a question mark or the word `help` will list all
    the commands the `SFTP` server supports. `FTP` users will recognize most of them.


    To copy a file from your local computer to the server, use `put` and the filename.


    ```

    sftp> put upload.txt

    ```


    To copy a file from the server to the local computer, use `get` and the filename.


    ```

    sftp> get download.txt

    ```


    If your connection is interrupted before the download finishes, use `reget` to
    resume the download where it left off. A `reget` doesn’t perform file integrity
    checking, but only looks at the offset.


    To change the name of the file on the server use `rename`, followed by the current
    file name and the new file name.


    ```

    sftp> rename data.txt old-data.txt

    ```


    To change directories on the server, use `cd` and the directory name.


    ```

    sftp> cd /var/log

    ```


    To change directories on the client, use `lcd` and the directory name.


    ```

    sftp> lcd Downloads

    ```


    End your `SFTP` session with either `quit` or `exit`.


    ### Changing Usernames and Configurations


    With either `scp` or `sftp`, if you use a different name on the remote machine,
    put the account name and an `@` symbol right before the server name. (Old-fashioned
    copy did not support this.)


    ```

    $ scp data.txt user@sloth:

    ```


    The easiest way to remember this is to make an entry in `ssh_config`. Both file
    copy programs take configurations from `ssh_config`, so make changes there to
    affect the whole suite.


    While both programs use command-line arguments to change how they behave, those
    arguments are not consistent with `ssh(1)`. `SFTP` is designed to replace `FTP`,
    while `SCP` replaces `RCP`. The developers prioritized comforting users over using
    ssh-style options. For example, you can change the port each uses with `-P` rather
    than `-p` used by `ssh`.


    ## File Copy with WinSCP


    The PuTTY installer ships with excellent command-line SCP and SFTP clients, but
    if you’re running Windows, you probably want a pretty graphical interface. `WinSCP`
    is a SCP, SFTP, `FTP`, and `WebDav` client for Microsoft Windows. It switches
    transparently between protocols depending on what the server supports.


    Grab `WinSCP` from `https://winscp.net`. While there’s no fee to use `WinSCP`
    in your home or business, its license (GPLv2) restricts redistributing changed
    versions of the program to your customers. If you wish to include `WinSCP` in
    your own product, read the license carefully.


    `WinSCP` comes with a standard Windows installer. The defaults are fine for most
    users, and include convenient features such as adding `WinSCP` to the right-click
    menu when you select a file. The installer also installs `Pageant` and `puttygen`,
    if you didn’t install those as part of PuTTY. We’ll use those in Chapter 7.


    Start `WinSCP` and you’ll see this screen.


    ![](image2.jpg)


    Figure 6-1: WinSCP Login


    The left side contains your saved connections. Set up new connections on the right.
    Enter the server’s hostname, your username, and your password. Change the port
    if needed. You can save this connection by hitting *Save*.


    `WinSCP` can import your PuTTY host key cache. Select *Tools->Import*. You’ll
    see the contents of PuTTY’s key cache, with a check box by each. Verify every
    server you want to use is checked, then select OK. `WinSCP` can now piggyback
    on all the work you did verifying host keys.


    Once you verify a host key in PuTTY, you can go back into `WinSCP` and import
    the verified key there.

