    Windows folks, PuTTY has revolutionized using SSH from Microsoft systems. And
    the PuTTY developers gratefully accept donations. They don’t have a server infrastructure
    to feed, but they appreciate donations just the same. With refreshing honesty,
    they declare that they’ll spend small donations on motivational beer and curry,
    while larger donations can help buy any necessary hardware or tools. Volunteer
    programmers might have more powerful motivators than Unexpected Appreciation Beer,
    but I’ve yet to see what that would be. See the PuTTY FAQ for their PayPal address.


    If you work for one of those big firms that make cash out of shipping `OpenSSH`
    or `PuTTY` with their product, do consider blackmailing extorting persuading your
    employer to throw a few bucks to the folks who write the software. Or at least
    buy some developers a few pints on your expense account. We’ll all benefit.


    And if you’re still using passwords after reading this far? I have a whole horde
    of sysadmins queued up to slap you with a book.


