    如果你以前从未用过 X，这可能会觉得有点奇怪。没关系。玩玩它，你很快就能理解它的用途。


    原生的 X 在网络上以明文形式传输信息。通过 X11 转发将其封装在 SSH 中，可以确保 X 传输的安全。


    # X 的安全性


    X 诞生于网络安全远没有今天如此重要的时代。考虑到那个年代硬件的限制，开发者们能够让图形应用程序运行起来已经觉得很庆幸了。在任何协议中事后添加安全性并不像我们可能希望的那样有效。从远程机器显示
    X 需要对远程机器扩展信任。你对远程机器的信任程度越高，在本地运行的 X 程序就越多。如果你完全信任一台被攻破的机器，入侵者可以使用 X 来接管你的工作站、捕获你的击键，并像你本人一样访问你的系统。


    仅对真正需要 X 转发的用户或主机允许 X 转发。


    # X 与网络


    在开发 X 的时代，一个站点的互联网连接速度可能只有 56 kbps。在站点之间尝试使用 X 转发是系统管理员在喝啤酒时会付之一笑的事情。现在带宽不再是那么令人担心的问题，人们可能会在一个洲运行浏览器，并在另一个洲显示它。


    虽然带宽在世界许多地区不再是问题，但延迟是非常真实的。许多图形程序对延迟非常敏感。一个程序可能合理预期每秒执行数百次图形操作。当每个操作仅需一纳秒时，这是没问题的。但当由于跨国链路导致每次操作需要五十毫秒时，你的程序就会变得不可用。如果延迟不是问题，抖动和丢包也会破坏实用性。


    如果你有任何延迟，请研究 X 转发的替代方案。也许动态端口转发（第 9 章）可以解决你的问题。也许你的程序具有用于远程使用的功能，例如 Wireshark
    接受来自另一个主机的 `tcpdump` 流的能力。使用专为适应高延迟设计的协议。


    但在本地网络内部，X 转发可以非常有用。


    # X 服务器与客户端


    X 服务器是提供图形显示的计算机。X 客户端是运行生成显示的程序。这在许多人看来似乎是反的。如果你正在使用 X，那么 X 服务器几乎确定是你的桌面。你的桌面必须有一个
    X 服务器才能使用 X 转发。


    几乎所有的 Unix 类系统都包含一个 X 服务器，通常来自 X.org，但可能是厂商的专有系统。如果你正在运行 Windows，你需要一个第三方 X 服务器。我们将在讨论
    PuTTY 和 X 时涵盖这些内容。


    # SSH 服务器上的 X 转发


    要使用 X 转发，SSH 服务器必须具备 `xauth(1)` 程序。如果该程序存在，你可以通过 `sshd_config` 中的 `X11Forwarding`
    关键字启用转发。


    ```

    X11Forwarding yes

    ```


    更改此设置后重启（或使用 `pkill -1`）`sshd`。


    OpenSSH 手册提到了其他几个配置 X 转发细节的选项，但你们绝大多数人永远都不需要其中任何一个。如果你遇到奇怪的问题，请研究 `sshd_config(5)`
    中的各种 X11 关键字。


    # OpenSSH 客户端中的 X 转发


    OpenSSH 客户端支持两个级别的 X 转发，通过安全级别进行区分。在 `ssh_config` 中配置两者。基础 X 转发仅支持安全性较低的 X 协议子集。这种级别的
    X 转发相当安全的。入侵者无法通过基础 X 转发接管你的桌面或监听你的击键。


    ```

    ForwardX11 yes

    ```


    始终尝试这种基础 X 转发。


    许多 X 程序使用了该低安全性子集之外的函数。当通过 SSH 转发时，这些程序会显示错误并无情地崩溃。一旦你启用了 X 转发，你可以使用 `ForwardX11Trusted`
    关键字来允许全套 X 函数。


    ```

    ForwardX11Trusted yes

    ```


    当你允许所有 X 函数时，你完全信任了 SSH 服务器。控制 SSH 服务器的入侵者可以捕获你本地屏幕上的所有内容和你的每一次击键。在全局允许这种级别的信任之前，请务必确定你完全信任你可能登录的每一个远程服务器。一旦你绝对确定了——不要这样做。


    X 转发是 SSH 压缩产生意义的少数地方之一。将 `Compression` 关键字设置为 `yes` 以启用压缩。然而，最好是按主机单独使用。


    ## 按主机 X 转发


    你可以使用 `Match` 规则配置按主机的设置，将 X 转发限制仅对必要的主机。在这里，我在 `pride` 上有一个程序需要完全信任 X，因此我在 `ssh_config`
    中为它创建了一个特殊条目。


    ```

    ForwardX11 no

    Host pride

    ForwardX11 yes

    ForwardX11Trusted yes

    Compression yes

    ```


    现在我只需要担心某一个主机上的 X 软件，而不需要担心我 SSH 的每一个主机。


    ## 在命令行上转发 X


    比将 X 转发限制到某些主机更好的方法是按连接逐个地启用它。


    在上一个示例中，我对连接到 `pride` 主机的所有连接完全信任 X。该主机上有一个程序需要完全的 X 权限，但我并不是每次登录该主机都运行该程序。我想仅为某些会话启用
    X 转发。使用 `-C` 启用压缩。需要时使用 `-X` 命令行选项激活标准的 X 转发。


    ```bash

    ssh -CX pride

    ```


    如果你必须完全信任远程主机（等同于 `ForwardX11Trusted`），请使用 `-Y`。


    ```bash

    ssh -CY pride

    ```


    这消除了常规转发 X 的风险，但在需要时支持 X 转发。


    # 使用 PuTTY 转发 X


    将 X 转发到 Windows 主机的第一个问题是 Windows 并不包含 X 服务器。你需要额外的软件。坦率地说，许多人已经将标准的 X.org 软件从
    UNIX 移植到了 Windows。使用你喜欢的任何一个即可。我通常使用 Xming，但如果你的雇主或同事坚持让你使用不同的，请不要担心。


    ### Xming


    Xming 是 Windows 系统上一个广泛使用且频繁更新的 X 服务器。Xming 的最新版本仅供向该项目捐赠的人使用，但上一个旧版本是免费的。与书中的所有软件一样，如果你发现
    Xming 有用，我鼓励你向程序员捐赠。Xming 为 Windows 带来了 UNIX 用户熟悉的各种 X 技巧**，但对于我们的目的来说，我们只用它来显示运行在远程机器上的程序。


    从 http://sourceforge.net/projects/xming/ 下载 Xming。Xming 安装程序对任何 Windows 用户来说都非常直观，所以我不会带你操作。采用默认值即可。安装完成后，运行
    Xming 启动服务器。


    ### 启用和禁用 X 转发


    PuTTY 默认转发 X。此外，PuTTY 不对 X 进行基于安全性的过滤；它的转发等同于 ssh 中的 `ForwardX11Trusted`。出于这个原因，我建议默认禁用
    X 转发，仅在需要时启用。


    在 PuTTY 配置界面的左侧，选择 *Connection* -> *SSH* -> *X11*。第一个复选框是 *Enable X11 forwarding*。取消勾选，然后保存默认设置。保持其他设置不变，因为它们只在异常情况下有用。


    # 转发是否正常？


    在转发 X 后，你的 SSH 会话看起来没有任何不同。在需要之前如何证明转发工作正常？如果 SSH 成功协商了 X 转发，它将在你的 shell 中设置 `DISPLAY`
    变量。


    ```bash

    echo $DISPLAY

    localhost:10.0

    ```


    你的 shell 知道它连接了一个 X 服务器。你可以运行你的 X 程序。如果转发未正常，`DISPLAY` 未定义。检查你的系统日志，或 SSH 客户端的调试日志。


