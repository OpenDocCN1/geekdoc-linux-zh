    # 第 10 章：保持 SSH 连接开启


    端口转发将 SSH 从一个能让你获得终端会话的协议转变为一个任意转发 TCP 流量的工具。但大多数防火墙（以及某些互联网服务提供商）会刻意终止空置一段时间的
    TCP 连接。空置状态的 SSH 会话最终会被服务器、客户端或中间的某些网络设备断开。如果你正在通过 SSH 转发服务，或者你只是懒得在每次防火墙切断你的连接时都登录
    SSH 服务器，你就希望保持你的会话活跃状态。


    保持 SSH 连接的多数方法等同于“在后台通过少量的流量，让中间网络设备认为连接不是空闲的”。这些被称为 `keepalives`（心跳）。运行一个持续显示并更新的程序，如
    `top(1)`，可以在不更改任何 SSH 设置的情况下充当心跳。你所做的只需养成在每次被中断时启动 `top` 的习惯。


    `keepalives` 的问题在于，临时断开会终止会话。如果你的服务提供商在半夜出现问题，导致心跳包在几分钟内无法跨网络传输，你的客户端或服务器将终止连接。请决定如何为你的网络适当配置
    `keepalives`。你可能根本不需要它们。


    如果你的连接不稳定到即使心跳也无法维持你的连接，请研究一下 `mosh` (https://mosh.org)。它是一种类似于 SSH 的远程连接协议，但是为不可靠的网络设计的。


    对于心跳，你有两个选择：TCP 心跳和 SSH 心跳。


    ## TCP 心跳


    PuTTY 和 OpenSSH 都支持 TCP 心跳。虽然 TCP 心跳没有 SSH 心跳那样可配置性，但对于大多数终端用户来说已经足够了。


    TCP 心跳是 TCP 协议的一部分，在传输层发送，不属于 SSH 本身。当一个 TCP 连接保持空闲状态时，它最终会超时并断开。开启 TCP 心跳会定期往返数据包，只需提醒大家此连接仍然存在。不过，TCP
    心跳可以被伪造或欺骗。这并不一定是坏事——我无法想象为什么有人想要伪造你的连接来保持它活跃，但比我更聪明、更阴险的人可能能想出多个坏理由。你多多久需要发送一次
    TCP 心跳取决于你操作系统的 TCP 栈，但它绝不应超过两分钟。


    PuTTY 仅支持 TCP 心跳，但默认并不产生它们。然而，它会对收到的任何 TCP 心跳做出响应。在 PuTTY 配置屏幕上，转到 Connection（连接）部分。第一个选项是
    `Seconds between keepalives`（心跳之间的秒数）。默认值为 0，即禁用发送心跳。在大多数情况下，每 90 秒发送一次 TCP 心跳就足以保持连接开启。即使
    PuTTY 不发送心跳，SSH 服务器通常也会发送，且 PuTTY 会对其做出响应。这通常足以保持连接开启。


    OpenSSH 服务器默认发送 TCP 心跳。如果你想禁用它们，请在 `sshd_config` 中将关键字 `TCPKeepAlive` 设置为 `no`。


    ## OpenSSH 心跳


    虽然 TCP 心跳可能满足大多数人的需求，但 OpenSSH 的心跳要灵活得多。在加密通道内发送的心跳消息告诉中间网络设备该 TCP 会话仍在使用中。接收到心跳告诉主机远程端仍然连接着，且
    SSH 会话仍然有效。SSH 心跳更有可能在经历长时间的路由器重启后继续保持会话开启。


    OpenSSH 的客户端和服务器都支持心跳。严格来说，客户端发送 `client alive` 消息，服务器发送 `server alive` 消息。虽然由于协议原因这些必须不同，但对我们来说，它们都只是心跳。OpenSSH
    默认不使用 SSH 心跳；你必须在启动会话之前对它们进行配置。


    发送心跳的主机期望收到心跳作为回应。每个主机都会跟踪自上次收到对方端发送的心跳以来已过去了多久。如果一个主机发送了指定数量的心跳而没有收到任何心跳，它将假设连接已丢失并终止
    SSH 会话。


    使用 SSH 心跳需要决定你想多频繁地发送心跳包，以及在主机断开会话之前可以丢失多少个包。服务器使用关键字 `ClientAliveInterval` 和
    `ClientAliveCountMax`。客户端支持关键字 `ServerAliveInterval` 和 `ServerAliveCountMax`。


    `AliveInterval` 关键字规定了主机在发送心跳之前连接必须空闲的秒数。要让客户端在不活动 90 秒后传输心跳，请将 `ServerAliveInterval`
    设置为 `90`。默认值为 0，禁用心跳。


    `AliveCountMax` 关键字告诉主机在终止连接之前必须连续发送多少个心跳。默认值为三。


    让我们看看这在实践中是如何运作的。我们在服务器的 `sshd_config` 中有如下：


    ```

    ClientAliveInterval 90

    ClientAliveCountMax 5

    ```


    在客户端侧，我们在 `ssh_config` 中放入了内容：


    ```

    ServerAliveInterval 90

    ServerAliveCountMax 4

    ```


    我们登录 SSH 服务器，做一些工作，然后让连接空闲。连接空闲 90 秒后，客户端向服务器发送一个心跳。如果服务器回复了自己的心跳，客户端和服务器都知道连接是活跃的。如果又过了
    90 秒没有收到服务器的回复，客户端将发送另一个心跳。它知道自己发送了两个心跳请求而没有收到服务器的任何回复。如果连接保持空闲，客户端继续发送心跳。在第四次心跳时（
    6 分钟后），客户端丢弃 SSH 会话并退出。


    服务器以相同的方式发送心跳，但注意它被设置为在未确认的心跳请求时终止连接。这个特定的客户端对中断的容忍度更低。


    注意 TCP 协议也参与其中。发送 TCP 包的主机期望接收方确认每个包。如果发送者没有得到此确认，无论 SSH 能做什么，它最终都会终止连接。持续时间取决于操作系统，但你应该知道，如果你无法维持
    TCP 连接，就无法维持 SSH 会话。


    如果你无论如何都想保持连接活跃，将 `AliveCountMax` 调高值会有帮助，特别是当你处于廉价的[1] 网络地址转换（NAT）设备之后时。


    PuTTY 不支持 SSH 心跳。


    ## 心跳与 SSH 服务器


