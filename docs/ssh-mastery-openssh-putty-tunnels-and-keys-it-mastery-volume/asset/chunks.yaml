    # 第 7 章“SSH 密钥”涵盖了如何使用 OpenSSH 原生工具创建主机密钥。


    ## 网络选项


    你可以控制 `sshd(8)` 如何使用网络，从 IP 版本到 TCP 端口。


    ```

    Port 22

    AddressFamily any

    ListenAddress 0.0.0.0

    ListenAddress ::

    ```


    `Port` 关键字控制 `sshd` 使用的 TCP 端口。互联网标准要求 SSH 运行在端口 `22` 上。某些组织为了提高安全性会对 SSH 使用不同的端口。在不常用的端口上运行
    SSH 实际上不能真正帮助保护 SSH 的安全，但它可以减少来自 SSH 破解蠕虫的登录尝试，这在本章稍后的“保护 SSH 服务器”部分会有过讨论。它还让你能够避开某些特别低效的防火墙。可以使用
    `-p` 在命令行中覆盖 `Port` 关键字。


    `AddressFamily` 指 `sshd` 使用的 TCP/IP 版本。要仅使用 IPv4，请将其设置为 `inet`。要仅使用 IPv6，请将其设置为
    `inet6`。默认值 `any` 告诉 `sshd` 无论请求通过何种协议到达都进行处理。某些操作系统修补了 `sshd(8)` 以支持非 TCP/IP
    协议，例如流控制传输协议 (SCTP)。


    许多主机有多个 IP 地址。默认情况下，`sshd` 在所有地址上监听入入的请求。如果你想限制 `sshd` 绑定的 IP 地址，请使用 `ListenAddress`
    关键字。`ListenAddress` `0.0.0.0` 意味着“所有 IPv4 地址”，而 `::` 意味着“所有 IPv6 地址”（某些操作系统使用
    `::` 表示“所有 IPv4 和 IPv6 地址”，因为他们为什么要允许你只为 IPv6 开启服务呢？）每个 `ListenAddress` 接受单个 IP
    地址作为参数，但你可以根据需要使用任意数量的 `ListenAddress` 关键字。显式列出你希望 SSH 服务器接受连接的每一个 IP 地址。


    如果一个主机有很多 IP 地址，而你只想阻止其中几个的 SSH 访问，你可能会发现使用数据包过滤流量比使用许多 `ListenAddress` 语句更容易。


    你还可以通过在 `ListenAddress` 语句中指定端口，在特定 IP 地址上添加额外的端口。考虑以下配置。


    ```

    ListenAddress 0.0.0.0

    ListenAddress 192.0.2.8:2222

    ```


    我们的第一个 `ListenAddress` `0.0.0.0` 告诉 `sshd` 监听此机器上的所有地址。默认 `Port` 是 `22`，所以我们在所有地址上获得端口
    `22`。这没问题。第二个 `ListenAddress` 让 `sshd` 也在地址 `192.0.2.8` 的端口 `2222` 上监听连接。每个地址都可以有自己的
    `ListenAddress` 语句。


    ```

    ListenAddress 192.0.2.8:2222

    ListenAddress 192.0.2.9:25

    ListenAddress 192.0.2.10:80

    ```


    三个不同的地址，每个都有不同的端口。请注意，让 `sshd` 监听 SMTP 和 HTTP 端口通常是不明智的，但 OpenSSH 的设计并不是防止你做这些通常不明智的事。如果你被困在一个只允许
    `80` 和 `443` 端口通过的简单防火墙后面，在这些端口上运行 `sshd` 就能让你避开防火墙。


    ## 横幅与登录消息


    许多系统管理员希望在用户登录前显示一条消息。这被称为 `banner`（横幅）。SSH 协议并不要求客户端显示 banner。服务器可以提供 banner，但你无法保证用户能看到它。`ssh(1)`
    和 `PuTTY` 都会显示 banner。将关键字 `Banner` 设置为文件的完整路径。


    ```

    Banner /etc/ssh/banner

    ```


    请注意，如果 banner 起作用，它可能会干扰通过 SSH 运行的自动化进程。在某些地方，banner 可以作为对入侵者的法律通告。（请注意，我不知道有任何人通过使用此类
    banner 警告被成功起诉，但这就是法律。）选择一个你更倾向的头疼方式吧。


    如果用户使用公钥进行验证且客户端确实显示了 banner，登录将继续。在登录完成之前，没有任何人类会看到你们法务部门关于登录主机的措辞精美的警告。


    你可以可靠地显示系统每日消息 `/etc/motd`。不过，这条消息在客户端通过身份验证之后才会出现，因此它可能无法满足你的需求。关键字 `PrintMotd`
    默认设置为 `yes`，但你可以关闭它。


    ```

    PrintMotd yes

    ```


    在使用可插身份模块 (PAM) 的系统上，PAM 模块可能负责打印 `/etc/motd`。如果你在启用或禁用显示 `/etc/motd` 时遇到困难，请检查你的
    PAM 配置。


    用户登录后，`sshd` 会打印用户上次登录的时间和来源。要关闭此功能，将 `PrintLastLog` 设置为 `no`。


    ```

    PrintLastLog yes

    ```


    虽然这看起来没必要，但我强烈建议保留 `PrintLastLog`。多次有用户在发现他们之前的登录来自外国或在荒谬的时间时向我告报了入侵情况。


    ## 针对 DNS 验证登录尝试


    在默认 OpenSSH 安装中，用户可以在单个 SSH 会话中 2 分钟内尝试登录 6 次。你几乎应该在任何地方使用公钥认证（第 7 章“SSH 密钥”），但即使是使用密码的用户也应该能够在二十秒内错误地输入密码。你可以同时更改时间和尝试次数。


    `LoginTime` 关键字控制 `sshd` 给用户进行验证的时间。如果会话连接到 `sshd` 持续长时间而未通过验证，连接将终止。你可以提供秒 (`s`)、分钟
    (`m`) 或小时 (`h`)。


    ```

    LoginTime 2m

    ```


    你还可以使用 `MaxTries` 控制用户在单个连接中可以尝试验证的次数。默认值是 6。


    ```

    MaxTries 6

    ```


    在用户会话中允许的尝试失败一半后，`sshd` 会记录后续的失败。验证尝试包括公钥和密码。在失败 `MaxTries` 次后，用户必须启动新会话并重试。我通常的失败程序是失败六次，然后记住我在这台机器上有一个不同的用户名。当我采纳第
    5 章“SSH 客户端”中关于更改用户名的建议并在到处安装我的公钥时，这个问题就消失了。


    ## 根据 DNS 验证登录尝试


    诸如“来自老板电脑的登录失败”之类的日志消息会让你叹。。而来自黑客国家的登录成功”之类的日志消息应该触发警报。IP 地址的所有者控制该地址的反向 DNS。控制其
    IP 地址反向 DNS 的入侵者可以将表面主机名更改为公司内部的主机名。为了防止此类攻击，`sshd` 可以根据正向 DNS 条目验证连接尝试。


    ```

    UseDNS no

    ```


    设置为 `yes` 时，每当客户端连接时，`sshd` 都会查找源 IP 的主机名，然后查找主机名的 IP 地址。如果名称不匹配，`sshd` 将拒绝连接。


    假设一个入侵者控制其 IP 地址 `192.0.2.99` 的反向 DNS。他为其提供一个组织内部的主机名，例如 `dhcp12.mwl.io` 并连接到你的
    SSH 服务器。你的 SSH 服务器向其 DNS 服务器查询 `dhcp12.mwl.io` 的 IP 地址。如果该 DNS 条目不存在，或者它指向 `192.0.2.99`
    的 IP，`sshd` 将拒绝连接。


    如果 DNS 失败，`sshd` 将等待完整的 DNS 超时后允许连接。


    `UseDNS` 要求你的 DNS 必须整洁、一致且正确。虽然我支持审计组织的 DNS 条目，但通过 `UseDNS` 执行此类审计缺乏优雅性。如果入侵者可以污染服务器的
    DNS 缓存，DNS 检查将毫无帮助。如果你是家庭用户，你的 ISP 可能控制着你连接的反向 DNS。此外，DNS 检查可能会增加系统负载。如果你服务数百或数千个并发
    SSH 用户，这种负载可能是巨大的。当 DNS 失败时，失败的 DNS 检查将减慢所有 SSH 。最后，许多 IPv6 站点尚未配置反向 DNS，且在可预未来内也不会配置。


    '
