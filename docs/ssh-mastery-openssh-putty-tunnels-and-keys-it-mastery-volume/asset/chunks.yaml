    Using a key for authentication changes how you log in. No matter what client you’re
    using, verify that your key works before going any further. Don’t attempt to use
    an SSH agent until you know the key works.


    If the key doesn’t work, use the SSH debugging tools discussed in Chapter 5. Run
    `ssh` in verbose mode. Use `PuTTY` session logging. Read the output. If you have
    a permissions problem or configuration error, the answer is in there.


