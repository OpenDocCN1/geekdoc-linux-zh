    # Chapter 15: OpenSSH Scraps


    This chapter covers a potpourri of SSH topics that you should probably know about,
    but that don’t merit their own chapters. We’ll discuss host key rotation in OpenSSH,
    connecting to hosts that only support obsolete ciphers, and escape characters.


    ## Host Key Rotation


    After a host has been accepting connections from the public Internet for a year
    or two, you should consider rotating the host keys. Not only do algorithms grow
    easier to break as computing power advances, but prospective intruders have had
    more time to brute-force your private key. If you ask your users to verify new
    host keys every year or so, though, they’ll get annoyed. You can use the existing
    host key to securely transmit the new host key to the client. This isn’t useful
    if the existing host key has been compromised, but it can let you proactively
    distribute the forthcoming host keys to clients before getting rid of the old
    ones.


    Once you have many servers, OpenSSH certificates are more useful than occasional
    key rotation. Certificates eliminate known_hosts and the need to update the client
    at all.


    Configure SSH key rotation on both the server and the client.


    ### Server Key Rotation


    Start by creating your next set of keys. Create each sort of key you intend to
    support. They’ll need different file names, of course. I name new keys prepended
    with the year they’re created.


    # **ssh-keygen -f 2018_ssh_host_rsa_key -t rsa -N ''''**


    # **ssh-keygen -f 2018_ssh_host_ecdsa_key -t ecdsa -N ''''**


    # **ssh-keygen -f 2018_ssh_host_ed25519_key -t ed25519 -N ''''**


    This gives us four new keys. Now use the standard sshd_config HostKey keyword
    to add these keys. Add new keys after the existing host keys.


    HostKey /etc/ssh/2018_ssh_host_rsa_key


    HostKey /etc/ssh/2018_ssh_host_dsa_key


    HostKey /etc/ssh/2018_ssh_host_ecdsa_key


    HostKey /etc/ssh/2018_ssh_host_ed25519_key


    Your server is now ready to distribute those host keys to clients.


    Once you’re certain all of your clients have copies of the new host keys, and
    you’ve given up waiting for that one user who never updates everything, you can
    disable the old host keys.


    ### Client Key Rotation


    Tell ssh(1) to look for additional keys with the UpdateHostKeys ssh_config option.
    The default, no, tells ssh to ignore new host keys. Setting it to yes automatically
    updates known_hosts with any new keys for this host. The ask setting means to
    query the user to see if the new keys should be accepted. This mirrors the StrictHostKeyChecking
    keyword.


    When you connect to a host with the UpdateHostKeys option set, your initial connection
    will look a little different.


    $ **ssh avarice**


    The authenticity of host ''avarice.mwl.io (203.0.113.209)'' can''t be established.


    ECDSA key fingerprint is SHA256:JUf1lzyEVYxhbJCfXLvPi6eLJdYCZhEBzJD8c+NGLzw.


    No matching host key fingerprint found in DNS.


    Are you sure you want to continue connecting (yes/no)? **yes**


    Verify the host’s public key fingerprint and accept it if correct. But then you’ll
    get another set of warnings.


    Learned new hostkey: RSA SHA256:nNUnWCojrzeHAALXyM/yGpGM7uUIPrP/ph8zV3qUx9M


    Learned new hostkey: ED25519 SHA256:nNtyIQidY3MXAEfpWZ0wzkXKQFnCoQhe0CRIldc4…


    Accept updated hostkeys? (yes/no): **yes**


    Your client has grabbed the public keys for this host’s RSA and ED25519 keys.
    You can only accept or reject these additional public keys en masse. It’s a very
    rare attacker that will leave the main host key untouched while subverting the
    other keys, but you really should verify them all.


    When the server adds new host keys, the client will display the fingerprints and
    give you a chance to verify them.


    $ **ssh avarice**


    Learned new hostkey: RSA SHA256:aDqGAPMnT6b3aYqT3DXjRofYfHznOMbVFWZg3yw/fTI


    Learned new hostkey: ECDSA SHA256:9eHjmXAFrGmRT2iz/WY5pHLcvoo0HQ5paiLcpEcXWns


    Learned new hostkey: ED25519 SHA256:BZ5X6sIbfa5AWcQY0RjnMRL9zLX1+som5TmTV/k/…


    Accept updated hostkeys? (yes/no):


    Host key updates are incompatible with connection multiplexing (the ControlPersist)
    keyword. Enabling ControlPersist disables host key updates.


    While PuTTY can grab the public key of algorithms it isn’t using for a connection
    (go to the upper left corner menu and select *Special Command* -> *Cache New Host
    Key Type*), it can’t accept multiple keys of the same type. When you get rid of
    the old host keys, your PuTTY users must re-verify host keys.


