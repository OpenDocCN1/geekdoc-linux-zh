- fmt: '

    A connection using the insecure, legacy protocol `XDMCP` will have a `$DISPLAY`
    value of something like `remote:1`. This means that your shell found an X display,
    somewhere, somehow, but it’s not the one you’re trying to forward over SSH. Don’t
    run your X program if `$DISPLAY` looks weird! Something might be very, very wrong.


    Now run an X program from your shell, and it should display on your desktop. Most
    X clients include the `xterm(1)` terminal emulator. Run `xterm` in the background
    on your SSH server.


    ```

    $ xterm &

    ```


    You’ll get a command prompt back on the SSH server. In a moment or two, depending
    on the bandwidth and latency between your server and client, a terminal on the
    remote system will appear on your desktop.


    If you don’t like `xterm`, try `xclock`, `xeyes`, or `xcalc` instead.


    When you connect with X forwarding enabled, you might see warnings like `untrusted
    X11 forwarding set up failed` or `No xauth data`. These warnings are not critical
    when forwarding X over SSH, and should not worry you.


    ## Remote X Commands with OpenSSH


    Logging into another machine just to run an X program—or any program—can be an
    annoyance. The `-f` option to `ssh` lets you run a command on another machine
    while keeping the SSH session itself backgrounded. This looks like you’re executing
    a command directly on the other host. Give the command right after the host you
    want to access. For example, if I want to run an `xterm` on `wrath` I could run:


    ```

    $ ssh -f wrath xterm

    ```


    The client will connect to the server and display whatever login text the server
    shows. The SSH client then goes into the background, restoring your command prompt
    on your local system even as it runs the command on the remote system.


    Note that remote commands are run in the user’s full logon environment. Any files
    attached to the user’s shell, such as `.cshrc` or `.profile`, are sourced. This
    might give you trouble, depending on the application you’re running.


    Backgrounding forwarded X-over-SSH sessions is very useful, but forwarding TCP
    ports over SSH is even more useful. We’ll look at that next.


    # Chapter 9: Port Forwarding


    Port forwarding over SSH is a divisive topic.


    SSH can serve as a wrapper around arbitrary TCP traffic. You can cloak unencrypted
    services such as `telnet`, `POP3`, `IMAP`, or `HTTP` inside SSH, securely transporting
    these natively insecure protocols. An SSH session can carry any TCP/IP protocol,
    including protocols your local IT security team has forbidden on the organization
    network. For this reason, many organizations with high security requirements do
    not allow SSH to traverse and/or leave their network. Organizations that have
    less stringent requirements use this ability to secure their network. (You can
    also use SSH to create a VPN to carry all IP protocols, but that’s in Chapter
    13.)


    For example, I manage my website and blog with `WordPress`. It provides a friendly
    pointy-clicky interface for website administration and design, giving me a decent-looking
    page without me actually needing to learn *anything* about web design.[1](#section-0011.xhtml_ref_footnotebookmark_end_60_1)
    At one time, in those dark days before Let’s Encrypt, my website used plain `HTTP`.
    I used `SSH` port forwarding to tunnel `HTTP` between my Web server and my desktop.
    This protected my credentials in transit and eliminated the risk of my password
    being stolen on the wire. This is a sensible and legitimate use of `SSH` port
    forwarding.


    Suppose my desktop is inside a high-security network, however. The firewall tightly
    restricts web browsing and blocks all file transfers. If I can use `SSH` to connect
    to a server outside the network, I could forward my desktop’s traffic to that
    outside server to get unrestricted Internet access. I could upload confidential
    documents over `SSH`, and the firewall logs would show only that I made an `SSH`
    connection. Your network administrator would object, with good reason.


    ## Port Forwarding versus Security Policy


    If you’re an organization’s security officer, port forwarding might make you consider
    entirely blocking `SSH`. I understand. I’ve had your job. You should also know
    that a recalcitrant user can tunnel `SSH` *inside* `DNS`, `HTTP`, or almost any
    other service or protocol, including raw `ICMP`. The only way to absolutely block
    `SSH` is to deny all `TCP`, `UDP`, or `ICMP` connections, use a web proxy that
    intelligently inspects traffic, and not allow your client machines access to public
    `DNS` even through a proxy. I’ve seen one firm actually implement this type of
    security perimeter, and they had many gaps and exceptions for notably clunky business-critical
    software. If you cannot implement this in your environment but have stringent
    security requirements, you must work with your users to meet those requirements
    and the business needs. I strongly recommend establishing a solid network traffic
    awareness program as well as intrusion and extrusion detection, so you know when
    your network traffic deviates from the norm. Read Richard Bejtlich’s books on
    intrusion and extrusion analysis, as well as my own *Network Flow Analysis* (No
    Starch Press, 2010), and implement programs like those discussed.


    As a user, having the ability to tunnel arbitrary traffic over `SSH` does not
    mean you should do so. If your organization’s security policy forbids port forwarding
    and/or tunneling, don’t do it. If the policy says “use the web proxy and stay
    off IRC,” then listen. I am not responsible if you use these techniques and are
    reprimanded, terminated, or exterminated. (Even if we IT security officers are
    all petty tinpot despots who don’t understand your very personal and deeply urgent
    *need* for IRC and MySpace.)


    ## Troubleshooting Port Forwarding


    Some applications misbehave when used over port forwarding. It’s important to
    separate application failures from port forwarding failures. If you’ve forwarded
    a port and your application doesn’t work over it, use `netcat` or even `telnet`
    to determine if the port is actually open. (I demonstrated `netcat` at the beginning
    of Chapter 3.) The server should send the same feedback to a `netcat` request
    over a forwarded port as it does over a non—forwarded port.


    If you don’t get a response, you’ve probably misconfigured port forwarding. Double-check
    your command line. If necessary, use the debugging on one or both sides of the
    connection to see what’s really happening. Remember that only one process may
    open a given port at a time.


    If port forwarding works, your application has trouble with it. Perhaps you need
    a hosts entry, as is common with many web applications. Maybe it’s an old and
    clunky protocol that expects a wide variety of ports open. `FTP` is a classic
    example. You’ll need to dive into the application and its protocol to figure out
    why it’s not working.


    Port forwarding is a tool. Not all protocols work with this tool. Sometimes, using
    port forwarding is like trying to drive screws with a hammer; any result you get
    will displease you.


    ## Example Environment


    For all of these port forwarding examples, I assume that the `SSH` client is behind
    a firewall. This might be anything from a great big corporate proxy to a home
    router. There are several other servers behind this firewall, including web and
    email servers. The client is inaccessible to the public Internet; the outside
    world cannot connect to it.


    The `SSH` server is on the public Internet. Anyone can connect to it, and it can
    freely access the rest of the Internet.


    ## Port Forwarding Types


    The three types of port forwarding are local, remote, and dynamic.

