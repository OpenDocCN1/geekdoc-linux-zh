    \ old `/usr/sbin/sshd`. It’s the master process that listens to TCP port 22.\n\
    \nThe second process, PID 31960, is the privileged process that handles my SSH\
    \ connection into this host. The third, PID 44387, is the unprivileged child process\
    \ that handles your login session. OpenSSH improves security through privilege\
    \ separation, discussed in “Protecting the SSH Server” at the end of this chapter.\
    \ If someone has deliberately disabled privilege separation and is running `sshd`\
    \ insecurely, you won’t see the unprivileged sessions.[1](#section-0005.xhtml_ref_footnotebookmark_end_54_1)\n\
    \nIf `sshd` isn’t running, enable it through your operating system configuration\
    \ tool.\n\n## Configuring sshd\n\nMost operating systems run `sshd` as a standalone\
    \ server without any command-line arguments. The usual way to configure `sshd`\
    \ is through the keywords in `/etc/ssh/sshd_config`. Before you start mucking\
    \ with changes in that file, though, you should know how to test and debug them.\n\
    \nOpenSSH makes debugging `sshd` configurations as simple as possible. You must\
    \ be root to run `sshd`, debugging or not. The simplest debugging methods are\
    \ alternate configuration files, alternate ports, and debugging mode.\n\n### Alternate\
    \ Configuration Files and Ports\n\nSuppose you want to edit `sshd_config`, but\
    \ need to be sure that the change works as expected. The `-f` command-line argument\
    \ tells `sshd(8)` to use an alternate configuration file.\n\n```\n/usr/sbin/sshd\
    \ -f sshd_config.test\n```\n\nNote that I executed this test configuration using\
    \ the full path to `sshd`. OpenSSH’s `sshd` re-executes itself when accepting\
    \ a connection, and it needs the full path to do so. If you don’t give the full\
    \ path, you’ll get an error like “sshd re-exec requires execution with an absolute\
    \ path.”\n\nOnly one `sshd` instance can attach to a particular TCP port. Your\
    \ test `sshd` process probably won’t start because it cannot bind to port 22.\
    \ You could edit `sshd_config.test` to assign your test process another port,\
    \ but then you have to re-edit the file when moving it to production, and we all\
    \ know that’s exactly the point that will figure prominently in the outage report.\
    \ Instead, override the configured TCP port and assign a new one with the `-p`\
    \ command-line argument.\n\n```\n/usr/sbin/sshd -f sshd_config.test -p 2022\n\
    ```\n\nThe test process is now listening on port 2022. (Note that `-p` cannot\
    \ override a `ListenAddress` keyword binding `sshd` to a port as well as an address;\
    \ see “Network Options” later this chapter.)\n\nBy setting an alternate configuration\
    \ file and port on the command line you can test your new configuration, approve\
    \ it, and move it into production, confident that you didn’t wreck a file in making\
    \ the final, untested change. (Not that I’ve ever broken a system that way, mind\
    \ you.) In any case, save your original `sshd_config`, just in case your change\
    \ causes problems testing didn’t expose. \n\nRemember to kill your test `sshd`\
    \ process when you finish testing.\n\n### Validating sshd_config Changes\n\nPerhaps\
    \ you want to make a minor change and think you don’t need to perform a full test.\
    \ You can ask `sshd(8)` to verify the configuration file and all the key files\
    \ with the `-t` flag.\n\n```\nsshd -t\n```\n\n```\n/etc/ssh/sshd_config: line\
    \ 112: Bad configuration option: ExposeAuthInfo\n/etc/ssh/sshd_config: terminating,\
    \ 1 bad configuration options\n```\n\nEither the version of `sshd` installed on\
