    # Chapter 12: Automation


    SSH is an incredibly powerful tool for automation. Many programs can use SSH as
    a transport, relying on known-secure software rather than attempting to implement
    their own network security. Most network orchestration tools like Ansible and
    Puppet use SSH; breaking your SSH configuration means you can’t use them.


    This same flexibility can cause security issues, however. Automated processes
    should not get access to anything except the bare minimums needed to perform their
    task. Fortunately, you can limit the commands that particular users can run via
    SSH, through the authorized_keys file or even in sshd itself. Additionally, you
    can automatically run commands whenever a user logs in. We’ll start with that
    function, and proceed to limiting users.


    ## Running Commands at Login


    The SSH server checks for commands to run any time a user starts a new session.
    This was mostly designed to configure services needed to make the account usable
    before login, such as mounting filesystems and assigning an X display, but you
    can use it for whatever you need.'
