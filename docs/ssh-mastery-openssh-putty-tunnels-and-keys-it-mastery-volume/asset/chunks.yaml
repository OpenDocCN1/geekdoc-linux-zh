    你可以覆盖 SSH 客户端在主机密钥更改时拒绝连接到机器的设置，或者不缓存新密钥，但请记住，SSH 不仅仅会验证服务器并保护传输过程中的数据。完成连接还会将你的身份验证信息交给
    SSH 服务器。如果你将用户名和密码给一台受感染的机器，你就等于把用户名和密码交给了入侵者。如果你在多台机器上使用相同的密码，你将无法再信任其中任何一台。现在就取消你的周末计划，可能下个周末也是如此。你将忙于从备份中恢复以及管理愤怒的客户。


    密钥不匹配的消息是 SSH 正常工作的标志。请利用它。


    # 第 5 章：SSH 客户端


    SSH 客户端软件位于用户的的工作站上，允许连接到 SSH 服务器。我们将讨论两种常用的客户端：用于类 Unix 主机的 OpenSSH 命令行客户端 `ssh(1)`，以及用于
    Microsoft Windows 的 PuTTY 客户端。这两个客户端都允许免费使用和分发（无论是源代码还是二进制形式），且有极少的限制或规定。


    当然，人们还编写了其他 SSH 客户端。你可以通过 Cygwin 或 Windows 10 及更高版本上的 Microsoft Windows Linux
    子系统 (WSL) 获取适用于 Windows 系统的 OpenSSH 客户端。还有一个 OpenSSH 的 Windows 直接移植版（https://github.com/PowerShell/Win32-OpenSSH）。微软已作为开发者特性，发布了适用于
    Windows 10 及更高版本的 OpenSSH Beta 端口。同样，PuTTY 也被移植到了许多类 Unix 系统和移动设备。许多人对 PuTTY 和
    OpenSSH 都进行了分支，并修改它们以适应自己的需求。其中许多都是稳健、可靠的项目。一旦你对 SSH 有了坚实的基础，请随意使用你喜好的客户端。


    每个客户端在本章中都有自己的章节。涉及 SSH 客户端的后续章节将分为三个部分：一个关于我们正在操作的理论，然后是关于配置每个客户端的独立章节。


    ## OpenSSH 客户端


    OpenSSH 客户端 `ssh` 是与 OpenSSH 服务器同步开发的。由于新功能通常在其他 SSH 实现之前先出现在 OpenSSH 中，通过使用最新的
    OpenSSH 客户端，你可以获得 SSH 特性的最前沿。OpenSSH 客户端作为 OpenBSD 的一部分开发，但每六个月会发布一个新的便携版本。


    用户的个人 SSH 设置记录在 `$HOME/.ssh/` 的文件中。与主目录一样，该目录必须仅允许用户和 root 写入，尽管你可以允许对所有人可读。如果其他人可以写入此目录，各种客户端和服务器功能将停止工作。虽然
    `ssh` 会创建具有正确权限的 `$HOME/.ssh`，但如果你的 SSH 套件行为异常，请检查权限。


    要运行 `ssh`，输入命令并后跟你想要连接的主机名。


    ```bash

    ssh gluttony.mwl.io

    ```


    这使用你客户端的默认设置连接到主机 `gluttony.mwl.io`，包括你当前的用户名。


    如果 `ssh` 的行为不符合预期，请尝试使用 `-v` 以详细模式运行它。你将看到服务器和客户端协商协议版本和加密算法、服务器展示其主机密钥、客户端验证该密钥，以及双方协商身份验证方法。虽然这可能无法解决你的问题，但它会告诉你登录在哪里失败了，并提供查找的提示。仔细阅读输出可能会告诉你，例如，服务器只允许使用公钥登录，或者你正尝试使用一种不支持的加密方法。


    ```bash

    ssh -v gluttony.mwl.io

    ```


    如果你仍然遇到问题，增加多个 `-v` 选项可以增加调试级别。


    在正常情况下，就这样。这本书的其余部分是关于异常情况的。


    ## OpenSSH 客户端配置


    通过在命令行或配置文件中设置选项来配置 `ssh`。使用配置文件进行永久更改，使用命令行进行临时更改。我们先查看配置文件。


    两个文件控制 `ssh(1)` 的行为：`/etc/ssh/ssh_config` 和 `$HOME/.ssh/config`。正如第 2 章所讨论的，每个文件都包含关键字和值。前者为所有系统用户建立默认行为。后者是用户的个人
    SSH 客户端配置。用户的配置会覆盖所有全局设置，但大多数用户并没闲工夫去输入自己的自定义配置。配置文件的更改会影响更改后启动的所有 SSH 会话。不需要重启进程，但更改配置不会影响现有的
    SSH 会话。两个文件具有相同的语法，并接受完全相同的选项。为了简便起见，我将引用 `ssh_config`，但所有内容同样适用于 `$HOME/.ssh/config`。


    虽然大多数连接选项可以在命令行上设置，但我建议将永久信息存储在 `ssh_config` 中。诸如 `scp(1)` 和 `sftp(1)`（见第 6 章）等程序会读取
    `ssh_config`，而且这些每个程序都有略不同的命令行选项。使用配置文件可以集中配置。


    用户的个人配置覆盖全局配置。在命令行上设置的选项会覆盖两者。


    ### 按主机配置


    你可以使用 `Host` 关键字来更改 `ssh` 连接到某些主机的方式。在这里，我使用 `Port` 关键字更改 `ssh` 连接的 TCP 端口，但仅针对
    `mwl.io` 域名的主机。对于所有其他主机，它将使用 `/etc/services*` 中指定的 22 端口。


    ```ssh

    Host *.mwl.io

    Port 2222

    ```


    我也可以指定一个 IP 地址，或者一个 IP 地址网络。


    ```ssh

    Host 192.0.2.*

    Port 2224

    ```


    注意 `ssh` 会匹配这些 `ssh_config` 条目。Host 条目是区分大小写的。假设 `ssh_config` 包含了这些 `Host` 条目，让我们看看在实际操作中是如何工作的。


    ```bash

    ssh gluttony.mwl.io

    ```


    这匹配 `mwl.io` 的第一个 `Host` 条目，因此连接到 2222 端口。我的桌面 `/etc/resolv.conf` 会自动为主机名附加域名
    `mwl.io`，所以我可能不会输入完整的域名名。相反，我会这样做。


    ```bash

    ssh gluttony

    ```


    这不会匹配第一个 `Host` 条目，因为我没有输入域名名。如果主机 `gluttony` 在 `192.0.2/24` 范围内，难道第二个 `Host`
    条目会匹配吗？不会，因为 `Host` 条目是在命令行匹配的，没有检查 DNS。要根据 IP 地址匹配，我需要显式运行 `ssh 192.0.2.whatever`。此主机的自定义设置需要这样的
    `Host` 条目。


    ```ssh

    Host gluttony

    Port 2222

    ```


    条件基于首次匹配原则解析。`Host` 条目之后的配置选项将持续到下一个 `Host` 条目。这个 `ssh_config` 可能是错误的。


    ```ssh

    Host *.mwl.io

    Host 192.0.2.*

    Port 2222

    ```


    用户可能希望 `Port` 关键字适用于 `mwl.io` 的所有主机以及 `192.0.2/24` 的所有 IP 地址。我们为 `mwl.io` 域名的任何主机都有条目，但对它没有特殊配置。`192.0.2/24`
    中的任何主机都在 2222 端口上运行 `sshd`。与其这样做，可以在同一行列出多个主机，并用空格分隔。在这里我列出了我的域名、我的 IP 地址以及我的服务器。


    ```ssh

    Host 129.0.2.* mwl.io *.mwl.io gluttony avarice lust pride envy sloth

    Port 2222

    ```


    我列出了 `*.mwl.io` 和 `mwl.io`，因为有一个名为 `mwl.io` 的特定机器。域名前的星号和点不会匹配该主机。将任何全局默认放在配置文件的开头。假设你的组织有一项在端口
    981 上运行 SSH 的策略，因为他们喜欢通过隐蔽实现安全，但你特殊的服务器使用不同的端口以获得更高的隐蔽性。


    ```ssh

    Port 981

    Host *.mwl.io

    Port 2222

    ```


    这里的默认端口是 981，但指定的主机使用 2222 端口。


