    Windows 用户们，PuTTY 彻底改变了在微软系统上使用 SSH 的体验。PuTTY 的开发者感谢地接受捐赠。他们没有需要维护的服务器基础设施，但他们同样感激捐赠。他们以令人耳新的诚实态度表示，他们会将小额捐赠用于购买励志用的啤酒和咖喱，而较大的捐赠则可以帮助购买任何必要的硬件或工具。志愿者程序员可能会有比“意外之谢啤酒”更强大的动力，但我还没见过那会是什么样的。请参阅
    PuTTY 的常见问题解答获取他们的 PayPal 地址。


    如果你在那些通过产品中分发 `OpenSSH` 或 `PuTTY` 来获利的大公司工作，请考虑通过敲诈、勒索或劝说，让你的雇主为那些编写软件的人们掏几块钱。或者至少用你的公费报销为开发者们买几杯啤酒。我们都会受益。


    如果你读到这里时还在使用密码？我有一整群系统管理员正排队等着用书拍在你的脑脑勺上。


