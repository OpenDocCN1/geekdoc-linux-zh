    ### Creating SSHFP Records


    Don’t even try to create SSHFP records by hand. The `ssh-keygen` program can read
    the key files on the local server and produce records, by using the `-r` flag.
    Give the hostname as an argument.


    ```

    $ ssh-keygen -r wrath

