    最佳实践禁止所有对用户执行任务必需的访问。你的自动化进程需要端口转发或 X 转发吗？将它们关闭。它需要特殊的环境吗？可能不需要，因为你可以在用户账户中更容易地建立该环境。你的自动化作业运行在单台机器上，因此你可以限制密钥，使其只允许从那台机器使用。你最终可能会得到类似这样的
    `authorized_keys` 条目：


    ```

    restrict,command="dump /home > /backups/`date +s`.dump",from="192.0.2.8" ssh-rsa
    AAAAB3NzaC1yc2EAAAABJQAAA…

    ```


    这样配置密钥可以缩小灾难的范围。备份脚本不会意外覆盖你的根分区。入侵者只能运行你的备份脚本。虽然这并不完美，但比让入侵者窃取你的数据并删除你的日志文件要好。


    ### 开发自动化脚本


    限制密钥的一个挑战在于理解程序实际上需要哪些命令，而不是你认为它需要哪些命令。`sshd` 的调试模式可以帮助你解决这个问题。让你的客户端在调试模式下针对
    `sshd` 运行其命令，并研究输出。你会看到客户端运行的所有命令。这将让你能够比通常情况下更进一步地锁定密钥——如果你知道 `rsync` 在你的服务器上使用的确切标志，你可以将这些标志作为限制条件。


    我写过一些在命令行中运行良好但在定时运行时失败的脚本，每次结果都证明我的脚本是从我的 SSH 代理中获取身份信息的，而不是使用我为任务创建的密钥。`IdentitiesOnly`
    关键字告诉 `ssh(1)` 仅使用命令行指定的身份，而不是使用你的代理。在你的脚本的 SSH 命令中设置 `-o IdentitiesOnly=yes`。


    自动化脚本永远不应该提示用户输入。你不希望你的脚本挂起并在密码提示符处等待。`BatchMode` 关键字禁用了密码和密码口语提示。通过将 `BatchMode`
    设置为 `yes`，你脚本的 SSH 部分将立即崩溃并退出，而不是无意义地永远挂在那里。


    ### 服务端限制


    也许你不想用 `authorized_keys` 限制限制访问，或者你可能想要额外的保护。你可以使用 `sshd_config` 中的 `ForceCommand`
    关键字来限制账户可以运行的命令。


    `ForceCommand` 接受一个参数，即要运行的命令。它在用户的普通权限下运行，并忽略客户端请求的任何命令。就像在 `authorized_keys`
    中定义命令一样，`ForceCommand` 将请求的命令保留在 `$SSH_ORIGINAL_COMMAND` 环境变量中。


    `ForceCommand` 最好用在 `Match` 语句内部。


    ### 自动化与 root 登录


    “我的命令需要以 root 身份运行！”使用 `PermitRootLogin` 关键字可以使用 root 身份登录。不要这样做。为了自动化以 root 身份登录违反了许多基本的安全原则。信任你的自动化脚本拥有远程
    root 权限，是度过一个计划外的周末来从备份恢复服务器的好方法。（你确实有除了 `rsync` 以外的备份吧？记住 `rsync` 是一种策略，而不是策略。）


    是的，少数环境可以安全地支持 root 登录。有些人正以支持审计的方式使用 root 登录。然而，如果你正在通过这本书学习 SSH，那么你的环境远没有准备好。


    如果你的自动化进程需要特权访问，请使用 `sudo`。`Sudo` (https://www.sudo.ws) 允许无权限用户以提升权限运行特定命令，并适用于每个类
    Unix 系统。我不会详细介绍如何使用 `sudo`；如果你需要教程，可以查看许多网站或我的书籍 *Sudo Mastery* (Tilted Windmill
    Press, 2013)。`Sudo` 比大多数人认为的要灵活得多，也危险得多。


    我们将在下一章中使用限制密钥来构建一个基于 SSH 的 VPN。


    # 第 13 章：虚拟专用网络


    你可以将 SSH 封装在任意 TCP 连接中，为任何协议添加加密层。但 OpenSSH 也支持构建通用的隧道，这些隧道可以通过所有流量和所有协议，而不只是
    TCP。你可以通过 OpenSSH 连接到远程办公室，创建一个虚拟专用网络 (VPN)，允许一个办公室的用户访问另一个办公室，就像他们就在隔壁楼而不是另一个国家一样。


    VPN 是 SSH 协议的 OpenSSH 扩展。PuTTY 不包含 VPN 功能，且 PuTTY 开发者反复表示他们没有将其添加到客户端中（参见 PuTTY
    网站上的 *tun-openssh* 愿望列表）。我们将仅研究类 Unix 系统上的 OpenSSH VPN。


    SSH 设计并不是并不是通用的 VPN 协议，在 TCP 内部使用隧道协议是非常糟糕的做法。当 TCP 连接丢包时，它必须重传这些包，直到连接的另一端确认接收。通过将一个
    TCP 连接封装在另一个 TCP 连接内部，你会放大丢包的影响。基于 TCP 的 VPN 在拥塞面前会崩溃。我强烈建议使用 `OpenVPN` 而不是 OpenSSH
    作为你的 VPN。OpenSSH VPN 的优势在于它只需要在客户端和服务器之间开启单个 TCP 端口。如果你只有这种连接性，OpenSSH VPN 可能是你最不糟糕的选择。


    VPN 可能是你使用 OpenSSH 能做的最复杂的事情。本章假设你已经熟悉了前面的章节，包括公钥认证、保持 SSH 会话活跃以及限制 SSH 客户端可用命令。


    ## 示例网络


    我们的 SSH 客户端 `avarice.mwl.io` 有两个网络接口。一个在公互联网上。虽然我们可以通过 IP 地址引用该接口，但我们将使用主机名。第二个接口在私有网络
    A 上，地址为 `172.16.0.1/24`。


    SSH 服务器 `gluttony.mwl.io` 同样在公有互联网上有一个接口。我们将通过主机名而不是 IP 引用此接口。它的第二个网卡在私有网络 B 上，IP
    地址为 `172.17.0.1/24`。


    ![](img/image10.jpg)


    图 13-1：VPN 网络


    我们将使用 SSH 在两个主机之间建立一个点对点的隧道。隧道的客户端端将拥有 IP `192.168.0.2/30`。隧道服务器端获得 `192.168.0.1/30`。


    我们将考虑 OpenBSD、FreeBSD、Debian 和 CentOS。OpenBSD 拥有所有操作系统中最好的 SSH VPN 支持——这不应该让任何人感到，考虑到
    OpenSSH 源自 OpenBSD。在 FreeBSD 上运行 SSH VPN 需要基础脚本。大多数 Linux 发行版修改了 OpenSSH 以适应它们的系统，它们还弃弃了标准的
    UNIX 网络命令，转而使用 Linux 特有的工具。这意味着每个操作系统都需要不同的方法。在这些四个系统中，你应该能找到一种可以适应你操作系统的方法。


    以下 OpenSSH VPN 的共同概念和配置适用于所有操作系统。无论你运行哪种操作系统，你必须理解这些内容并遵循这些通用原则。虽然你可以找到声称能简化隧道设置的工具，但一旦你理解了隧道是如何工作的，你会发现直接使用
    SSH 极其简单。


    ### 隧道接口


