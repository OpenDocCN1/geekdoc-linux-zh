    At login, `djm` gets locked into `/home/djm`. Note that he’ll need a chrooted
    home directory inside this directory, so you’ll need to create `/home/djm/home/djm`.


    The `%u` macro expands to the user’s username. This lets you assign a group of
    users unique home directories under central chroot directory.


    ```

    ChrootDirectory /usr/prisonroot/%u

    ```


    You’ll need to populate each user’s chroot separately.


    ### Choosing Users to Chroot


    You can chroot everyone, but that would make it hard for your sysadmins to perform
    maintenance. Chances are you only want to chroot a subset of your users. Use a
    `Match` statement to selectively chroot users.


    …


    ```

    ChrootDirectory none

    ```


    …


    ```

    Match Group billing

    ChrootDirectory %h

    ```


    If a majority of your users are chrooted, reverse the default to allow only your
    sysadmins full access.


    …


    ```

    ChrootDirectory %h

    ```


    …


    ```

    Match Group wheel

    ChrootDirectory none

    ```


    Choose whichever method makes sense for your environment.


    ### Debugging a Chroot


    Chroots are difficult to manage in that they normally lack a complete userland.
    If a chrooted user cannot log in, run `sshd` in debugging mode, attached to a
    terminal window. Have the chrooted user attempt to log in, and watch the debugging
    output; you’ll probably see the problem. Common issues include missing device
    nodes, incorrect directory permissions, or a missing shell.


    # Protecting the SSH Server


    Any Internet-facing server will have lots of random stuff poking at it. Worms,
    script kiddies, and other assorted scum would really like to break into your computer.
    If nothing else, someone wants to run an IRC bot on it. How can you protect your
    SSH service?


    Some people recommend changing the TCP port that `sshd` uses. This is a perfect
    example of security through obscurity, which does not work. Scanners constantly
    probe all ports of all Internet-connected IP addresses, and they’re pretty good
    at figuring out what service is running on which port. Changing ports might buy
    you a couple of minutes against a dedicated intruder, but no longer. Changing
    ports can reduce the amount of random noise you get in your logs, increasing the
    odds of you noticing real problems.


    You’ll also see random folks on the Internet recommend using a different protocol
    banner, which is a poor idea. You’ll see the protocol banner when you use `netcat`
    to connect to the SSH daemon. The banner identifies the type of server. All SSH
    servers differ slightly, and might require special client settings. SSH clients
    use the protocol banner to detect any quirks needed for a reliable connection
    with a server. If you change the protocol banner from `SSH-2.0-OpenSSH_7.0` to
    `SSH-2.0-ParanoidWhackJob`, you’re depriving clients of information they need
    to reliably connect.


    You might also consider add-on solutions to block IP addresses that repeatedly
    connect but fail to authenticate, such as `fail2ban` and `blacklistd`. The details
    of implementing these varies widely by platform, so I’m not going into them, but
    they are worth considering.


    To some extent, `sshd(8)` protects itself via privilege separation. Only a small
    section of the service runs with root privileges. Most of the server runs as an
    unprivileged user. This means that if an intruder successfully breaks into the
    server daemon, he can only do a limited amount of damage to your system. It’s
    still really annoying, but not devastating.


    Additionally, `sshd(8)` restricts the unprivileged process via a sandbox. The
    sandbox restricts which syscalls `sshd` can call before the user authenticates.
    OpenSSH supports a few different sandbox methods, from Apple’s `sandbox(7)` to
    Linux’s `seccomp(2)`. If the operating system doesn’t offer any other sandboxing
    methods, `sshd` uses `rlimit` to set the number of open files and child processes
    to zero.


    As with all Internet-facing services, a simple way to reduce risk to your SSH
    service is to reduce the number of IP addresses that can access it. OpenSSH respects
    TCP wrappers (`/etc/hosts.allow`). If your server or network has a packet filter,
    use it instead. By only allowing authorized IP addresses to access your SSH server,
    you block the vast majority of attackers.


    The most effective way to protect your server, however, is to disable passwords
    and only allow logins via keys. We cover access via keys in Chapter 7, “SSH Keys.”


    We’ll return to configuring `sshd` when we cover specific features, but for now
    let’s talk about server keys.


    [1](#section-0005.xhtml_ref_footnotebookmark_start_54_1) And you need to inflict
    bodily harm until privilege separation gets turned back on.


    [2](#section-0005.xhtml_ref_footnotebookmark_start_54_2) If you don’t like your
