    在没有实现缺陷的情况下，通过计算手段攻击公钥可能需要数十亿年。然而，软件存在漏洞，可能某个漏洞会让入侵者在短得的时间内破解密钥。此外，通过计算破解密钥所需的那些“万年”只是平均值。入侵者可能会运气不错。永久有效的证书会增加入侵者成功的几率。


    证书的有效期应该是多久？每隔一年左右轮换证书是最常见的做法。如果你拥有那种通过自动部署的魔法让服务器出现又消失的编排网络，你可能想每周或每月重新生成一次主机密钥证书。


    简而言之，除非在主机无法更改的少数情况下，否则永远不要使用超过一年的证书。不，我的意思不是“老板真的希望这台主机永远不要变”，意思是“联邦政府已将此主机声明为生命维持服务，更改证书是一项面临最低监禁的重罪”。


    不过，不要将你的证书设置为恰好在一年后过期。记住，生活总有意外。也许你会在日历上安排在 52 周后更新所有证书，但前一天你得了阑尾炎，请假了三周。我为此类紧急情况留了至少一个月的余地，因此这些示例假设我们在五十六周又五天过期所有证书。


    更好的做法是？使用你的自动化系统在证书到期的一半时更新并替换所有证书。每六个月颁发并部署新的一年证书。随着你对自动化的信心增加并解决了了漏洞，逐渐缩短这段时间。每年自动创建新证书，然后每月一次，最后每每周一次。然后缩短你使用
    CA 密钥的时间。让证书续期变成无痛的常规化工作，可以将潜在的密钥泄露从灾难转变为琐事。


    # SSH CA 密钥


    在你考虑创建 `OpenSSH CA` 之前，先考虑你如何处理和保护这些密钥。你的证书权威是你王国的钥匙。像保护任何其他关键信息安全资产一样保护它。攻破你
    OpenSSH CA 的入侵者可以创建被你所有服务器信任的用户密钥。那将是非常糟糕的。我将我的 OpenSSH CA 放在一台专用的 OpenBSD 机器上，只有在我需要签名密钥时才启动它。较大的组织会希望将它们的
    OpenSSH CA 放在网络中与存放其他类似关键主机相同的区域。


    最佳实践建议创建两个证书权威：一个用于认证主机密钥，另一个用于用户密钥。不同的团队管理用户和主机，拥有两个不同的证书权威允许每个团队使用最适合这些任务的工作流。每个
    CA 甚至可以位于不同的机器上、网络中不同的部分。虽然你可以在一个主机上安装任意数量的证书权威（这使得以后拆分 CA 成为可能），但很少有系统管理员会后悔从一开始没有遵循这种简单的最佳实践。


    随着你的网络增长，你管理的公钥数量也会随之增加。从一开始就组织好你的 CA，以减少后后的挣扎。


    我建议将你的 CA 放在类似 `/usr/local/sshca` 的目录下。为主机和用户密钥创建子目录，并使用无歧的名字，如 `/usr/local/sshca/hosts`
    和 `/usr/local/sshca/users`。每个主机和用户应该在其中拥有自己的子目录，例如 `/usr/local/sshca/hosts/sloth`
    和 `/usr/local/sshca/users/mwl`。不要将你的 CA 放在 `/root` 中，特别是不是 `/root/.ssh`。那些目录是给
    root 账户信息的，就像 `/etc/ssh` 留给该特定主机的 SSH 服务一样。证书权威是一个大项目，应该有它自己的目录。


    为什么要按目录分离而不是按文件名分离？每个主机和用户都有同名的文件。你会在每台 SSH 服务器上找到 `/etc/ssh/ssh_host_ecdsa_key`，而每个用户都有一个
    `id_rsa.pub`。虽然完全可以将主机 `sloth` 上的文件复制到 `sloth-ssh_host_ecdsa_key`，为它生成证书，然后在将其发送回服务器时重命名证书，但这多出了几个额外的步骤。为每个主机和用户提供唯一的目录可以降低脆弱性。


    像手动创建主机密钥一样创建 SSH CA 密钥。我添加了 `-c` 标志来给密钥添加特殊注释。SSH CA 密钥看起来和其他所有 SSH 密钥一样，所以注释有助于识别它们。这里有一个主机密钥的签名密钥。


    ```bash

    ssh-keygen -t rsa -f host-mwlca-key -c ''CA host key generated 2017-11-30''

    ```


    使用一个良好的密码短。你将能够使用 SSH agent 进行批量签名，所以尽管将其设置得复杂一些。你将获得包含证书权威私钥的 `host-mwlca-key`
    文件，以及包含公钥的 `host-mwlca-key.pub` 文件。


    创建一个认证用户的 CA 完全相同，只是文件名和注释不同。


    ```bash

    ssh-keygen -t rsa -f user-mwlca-key -c ''CA user key generated 2017-11-30''

    ```


    保护好这些私钥。不过，尽管向整个网络发送公钥。


    # 信任你的证书权威


    `ssh(1)` 客户端和 `sshd(8)` 服务器配置证书权威的方式完全不同。


    ## sshd(8) 与证书


    SSH 服务器使用用户证书来验证用于认证的证书。在 `sshd_config` 中使用 `TrustedUserKeys` 关键字设置一个包含你所有信任证书的文件。


    ```text

    TrustedUserKeys /etc/ssh/user-ca-keys.pub

    ```


    CA 文件每行包含一个 CA 公钥，并接受用井号（#）标记的注释。它看起来和 `authorized_keys` 完全一样。


    重启 `sshd`，它将信任由该证书权威签名的密钥。


    ## ssh(1) 与证书


    SSH 客户端使用主机证书来验证主机密钥。在 `known_hosts` 中配置证书权威。CA 密钥的最佳位置是 `/etc/ssh/known_hosts`，这样可以立即识别
    CA 且用户无法篡改。在行开头添加 `@cert-authority`，然后添加该密钥有效的的主机模式。此密钥适用于 `mwl.io` 域名下的所有主机。


    ```text

    @cert-authority *.mwl.io ssh-rsa AAA3Nza1yc2EAAAADAQ...

    ```


    如果适用于多个域名，用逗号分隔。不要使用空格。


    ```text

    @cert-authority *.mwl.io,michaelwlucas.com ssh-rsa AAA3Nza1yc2EAAAADAQ...

    ```


    将此行添加到每个主机的 `/etc/ssh/known_hosts` 中。它们将信任使用此密钥签名的证书。


    # 通用证书考虑


    主机证书有很多共同点，包括序列号、证书 ID 和有效期格式。


    ### 证书序列号


    每个 X.509 证书都应该有一个`序列号`。这些序列号对于证书权威来说是唯一的。OpenSSH CA 支持相同的功能，但 SSH 并不真正需要。如果你的组织对它们有某些单独的需求，可以使用它们。


    序列号不应该是单调递增的——即不要按顺序发布。随机序列号是最好的。如果你决定在 SSH 证书中使用序列号，你需要一个生成唯一随机数的机制。


    我将会在签名密钥时提到如何列出序列号，但不会对其进行深入。


    ### 证书身份


    '
- fmt: '

    Every certificate has a `certificate identity`, a text string used to say what
    this key is for. I assign identities based on the hostname or username, but if
    your organization has other need for the identity feel free to use it. You might
    decide to use it for inventory tags, personnel ID numbers, or anything else needed.
    In my examples, I use `host_` and the `hostname` for host certificates, and `user_`
    plus the `username` for user certificates.


    Whenever a user authenticates with a certificate, the log message includes the
    certificate identity. Some people use the certificate identity to let everybody
    log in as root but still retain user accountability.


    ### Certificate Archives


    Regenerating certificates requires only a command. You have automation to automatically
    update and distribute certificates and keys across your network. As people find
    out just how useful certificates are, the number of certificates you have will
    multiply. Be sure your `CA` retains a copy of every certificate and the corresponding
    public key.


    If you discover that a private key has been compromised, you’ll need to revoke
    the certificate for that key. It’s much easier to revoke the certificate when
    you have a copy on hand. When I create a certificate I create a copy of the certificate
    and its corresponding public key, both prepended with the date in ISO 8601 format
    (numeric year-month-day). This makes it easy to find certificates with a certain
    date.


    When you create a new `CA` key and obsolete the old one, you can discard certificates
    created with that key.


    ### Setting Expiration Date


    Expiration dates are assigned with the standard Unix relative date format. You
    don’t assign a specific end date, but rather how far in the future you want the
    certificate to expire.


    The expiration date begins with a plus sign, plus how far in the future you want.
    Use `w` to indicate weeks, `d` for days, `h` for hours, `m` for minutes, and `s`
    for seconds. To have a key expire 56 weeks, 5 days, 12 hours, and 13 seconds from
    now, use `+56w5d12h13s`.


    ## Host Certificates


    OpenSSH clients trust server public keys that have been signed by a recognized
    certificate authority. Deploying this requires creating certificates and installing
    those certificates on the server.


    ### Creating Host Certificates


    Use your certificate authority to sign a server’s public host keys. If you already
    have a system where you keep copies of each server’s public key files, consider
    either placing your certificate authority on that host or moving the functions
    that need those files to your `CA` server.


    Sign keys with `ssh-keygen(8)`. Yes, there’s an `ssh-keysign(8)` command, but
    it’s for replacing `rsh(1)` with SSH and disabled by default. Use the `-s` flag
    to give the filename of your `CA` key. The `-I` flag defines the certificate identity.
    Add the `-h` to declare this is a host key certificate. The `-n` identifies the
    host this certificate is good for. (You can use multiple host names, separating
    them by commas.) Use `-V` to give the expiration date, then give the filenames
    of the key files you want to create certificates for.


    Here I use my `CA` `host-mwlca-key` to create key certificates for the host `sloth`.
    It expires in fifty-six weeks and five days. I sign keys for every public key
    file in the current directory. (I must give the full path to the `CA` key, but
    the path is trimmed here for clarity.)


    ```

    ssh-keygen -s host-mwlca-key -I host_sloth -h -n sloth.mwl.io -V +56w5d ssh_host_*pub

    ```


    I copied four public keys to this host, so I get a cert for each of them. Each
    certificate is named after its public key file, with `-cert` inserted before the
    trailing `.pub`. The certificate for `ssh_host_rsa_key.pub` is `ssh_host_rsa_key-cert.pub`,
    `ssh_host_ecdsa_key.pub` gets `ssh_host_ecdsa-keycert.pub`, and so on.


    Copy all of these certificates to the SSH server’s `/etc/ssh` directory.


    ### Installing Host Certificates


    Once you have your certificates installed on the server, configure them in `sshd_config`
    with the `HostCertificate` keyword. As I’m easily confused, I put my `HostCertificate`
    keywords right next to the related `HostKey` keywords.


    ```

    HostKey /etc/ssh/ssh_host_rsa_key

    HostCertificate /etc/ssh/ssh_host_rsa_key-cert.pub


    …


    HostKey /etc/ssh/ssh_host_ed25519_key

    HostCertificate /etc/ssh/ssh_host_ed25519_key-cert.pub

    ```


    Restart `sshd`. You are now ready to use host certificates!


    ### Testing Host Certificates


    Once you configure certificates in `sshd(8)` and have set up your client’s `/etc/ssh/ssh_known_hosts`,
    you’re ready to try certificate-based host key validation.


    Move your `$HOME/.ssh/known_hosts` file out of the way, or delete it if you’re
    really, really confident. Now SSH into the server. You should get a logon prompt
    without being prompted to verify the host key.


    If the host certificate doesn’t work correctly, add a `-v` or two to your `ssh`
    command line. Does the client see the certificate? If not, run `sshd` in debugging
    mode to see if it’s loading the certificate, and if not, why not. Does `ssh` see
    the certificate, but not recognize it? If so, you fouled up your `ssh_known_hosts`
    entry.


    ### Revoking Certificates


    Certificates are great, until someone hacks into your server and grabs a signed
    keypair. The thief could use that signed key to masquerade as the compromised
    host. This is bad. Fortunately, you can use the `RevokedHostKeys` `ssh_config`
    keyword to tell clients not to trust a public key.


    ```

    RevokedHostKeys /etc/ssh/revoked-hosts

    ```


    The revoked host keys file contains a list of public keys, one per line. The client
    will not accept these public keys, even if they have an accompanying certificate.


    Your enterprise needs the ability to update clients’ revoked keys file, and must
    test it regularly. While real-time updates are best, even a logon script is better
    than nothing.


    ### Viewing Certificates


    You can view the contents of a certificate with `ssh-keygen -L`. Use `-f` to give
    the certificate file.


    ```

    ssh-keygen -Lf ssh_host_ed25519_key-cert.pub

    ```


    `ssh_host_ed25519_key-cert.pub`:


    ```

    Type: ssh-ed25519-cert-v01@openssh.com host certificate

    Public key: ED25519-CERT SHA256:nNtyIQidY3MXAEfpWZ0wzkXKQFnCoQhe0CRIldc4EB8

    Signing CA: RSA SHA256:ZQHNMc2TmWlnygGy9+UoFK92RdguzNi+cX4gA14

    Key ID: "sloth"

    Serial: 0

    Valid: from 2017-12-04T11:52:00 to 2017-12-25T11:53:17

    Principals:

    sloth.mwl.io

    Critical Options: (none)

    Extensions: (none)

    ```

