    你必须为每个密钥文件单独运行此命令，但如果你有一个中心化的自动化服务器，这种方法非常值得推荐。记住，公钥会显示给任何可以连接到服务器 SSH 端口的人。将公钥文件复制到安全的服务器通常没有安全风险。


    在我写这段文字时，一些免费的 DNS 服务（如 Hurricane Electric）支持 `SSHFP` 记录。


    ### 配置客户端


    取决于操作系统发行版如何编译它，OpenSSH 客户端默认可能会使用 `SSHFP` 记录。使用 `VerifyHostKeyDNS` 关键字来显式定义 `ssh`
    应该做什么。如果设置为 `yes`，客户端将完全信任由 `SSHFP` 记录提供的密钥。如果设置为 `ask`，`ssh` 将显示密钥指纹并询问用户如何操作。


    这处理了主机密钥。现在让我们谈谈用户身份验证密钥。


    ## 分发 authorized_keys


    只有几台服务器的独立系统管理员可以很容易地维护自己的 `authorized_keys` 文件。一旦服务器增加到七八台，在处处复制 `authorized_keys`
    就会变得非常繁琐。如果你有一整个系统管理员团队，并且想在数百台服务器上禁用密码认证？那么你真的需要寻找自动化 `authorized_keys` 复制的方法。你可以让你的自动化系统在所有系统中复制身份验证密钥，或者让
    `sshd` 在每次登录尝试时从网络查询用户的 `authorized_keys`。两者都有其用处。


    ### 复制密钥文件


    让用户维护自己的密钥文件可能会导致操作问题。用户拥有一种惊人的文件损坏能力，尤其是当他们认为自己知道自己在做什么时。通过中心化系统来部署 `authorized_keys`，你可以在用户陷入麻烦之前执行一些基础的完整性测试。你不需要复杂的密钥文件解析和验证系统，但能够说出“你注意到你的密钥条中间有换行符了吗？”可以减少所有参与者的烦恼。此外，如果用户的工作站被黑客入侵，入侵者借此启动对服务器的访问，入侵者可以将自己的密钥添加到用户的
    `authorized_keys` 中，并将其复制到 `known_hosts` 中的所有服务器。将密钥管理中心化并移除用户在不通过自动化系统的情况下上传新密钥文件的能力是非常理想的。


    你真的不希望自动化系统在每个用户的家目录中乱搞。相反，请利用 `sshd_config` 中的 `AuthorizedKeysFile` 关键字。这让你可以将用户的
    `authorized_keys` 文件放置在你任何想要的地方。结合 `%u` 令牌使用，可以让 root 拥有所有用户密钥。


    ```

    AuthorizedKeysFile /etc/ssh/keys/%u

    ```


    记住 `%u` 令牌代表用户名。通过此 `AuthorizedKeysFile` 设置，用户 `mwl` 的身份验证密钥将位于 `/etc/ssh/mwl`，而用户
    `djm` 的密钥将位于 `/etc/ssh/djm`。家目录之外的密钥文件看起来与任何其他 `authorized_keys` 完全相同，但它们必须由 root
    所有。即使我们假设的入侵者渗透了账户，他们在没有权限提升的情况下也无法编辑密钥。


    使用你的操作系统支持的任何功能来保护这些文件。在 UFS 文件系统上，不可变位（immutable flag）可能适合你的环境。或者 NFSv4 ACL。如果某些东西拒绝让你修改文件让你感到困扰，请考虑使用它们来保护授权密钥文件。


