    一旦你理解了 PuTTY 和 OpenSSH，你就拥有使用任何安全 SSH 客户端的基础知识。


    ## SSH 协议版本


    SSH 协议有两个版本：`SSH-1`（版本 1）和 `SSH-2`（版本 2）。请始终使用 `SSH-2`。所有现代 SSH 软件默认使用版本 2。你会发现旧的嵌入式设备仍然依赖
    SSH 版本 1，但 `SSH-1` 的安全性仅比未加密的 telnet 高一点。


    某人为了自己的需求设计了 `SSH-1`。它很好地满足了这些需求，并在 20 世纪 90 年代比 telnet 好得多。随着 SSH 变得越来越流行，越来越多的人研究了该协议并暴露了原始设计中的缺陷。以当今计算能力，`SSH-1`
    极易受到攻击。虽然 `SSH-1` 会对传输中的数据进行加密并防止随意的窃听，但掌握一些小技巧的攻击者可以捕获你的数据、解密传输中的数据、诱导你认为登录了正确的机器（而实际上你连接到了不同的主机）、在数据流中插入任意文本，或者这些手段的组合。攻击
    `SSH-1` 数据流并非简单的点击鼠标即可完成，但入侵者在现实世界中确实能够破解 `SSH-1`。


    表面上的安全比没有安全更糟糕。永远不要使用 SSH 版本 1。


    对于不支持 `SSH-2` 的服务器或客户端，允许 `SSH-1` 似乎是无害的。然而，客户端和服务器会透明地协商连接使用的 SSH 版本。如果客户端或服务器任一兼容
    `SSH-1`，入侵者就可以捕获你的登录凭据和所有传输数据。在 `SSH-1` 会话中插入任意文本（如 `rm -rf /*`）是非常简单的。这在 1998
    年就被发现，而现今巨大的计算能力让这种攻击变得容易得多。`Ettercap` 等程序可以实时解码 `SSH-1` 会话。对 `SSH-1` 的增量改进（如
    `SSH 1.3` 和 `1.5`）也存在漏洞。提供 SSH 版本 1.99 支持的 SSH 服务器支持 SSH 版本 1 和版本 2。


    不要让你的 SSH 客户端请求 `SSH-1`。不要让你的 SSH 服务器提供 `SSH-1`。


    OpenSSH 删除了对 `SSH-1` 的支持，如果你有一个仅支持 `SSH-1` 的旧嵌入式设备，你需要使用 `PuTTY` 来管理它，或者更好的是花几美元将该设备更换为本世纪以后制造的设备。1


    `SSH-2` 是现代标准。该协议的设计使得在发现漏洞时能够快速解决问题。我们不断增长的计算能力使得今天的强加密成为明天的安全风险，因此 `SSH-2` 的设计允许其算法和协议进行原地升级。


    如 `SCP` 和 `SFTP`（第 7 章）等协议是构建在 SSH 之上的。


    ## 本书中不包含什么？


    本书旨在让你熟悉 SSH，并帮助你达到 `OpenSSH` 和 `PuTTY` 的最低胜任水平。这意味着消除密码、将你的 SSH 服务限制在所需的最小权限，并将
    SSH 作为常用管理工具的传输媒介。你将能够轻松地通过 SSH 复制文件、极其方便地管理服务器密钥、使用数字证书仅允许网络上经过批准的密钥访问，以及其他一些技巧。


    本书并不打算作为一本全面的 SSH 巨著。它没有涵盖将 SSH 与 `Kerberos` 或 `SecurID` 集成，或者将你的 SSH 安装挂接到 `Google
    authenticator`，或者将你的 SSH agent 作为第三方程序的身份验证源。这些都是很有趣的话题，但非常特定平台，并且可能在你读完这本书之前就发生了变化。对认证选项感兴趣的系统管理员可能会发现我的书籍
    *PAM Mastery*(Tilted Windmill Press, 2016）很有用。


    ## 本书中包含什么？


    第 0 章是引言。


    第 1 章“加密与密钥”提供了关于加密的基本信息以及 SSH 如何使用加密。


    第 2 章“常用配置”涵盖了整个 `OpenSSH` 服务器和客户端使用的配置语法。


    第 3 章“OpenSSH 服务器”讨论了配置 OpenSSH 服务器 `sshd`。本章将引导你如何配置 `sshd`，但更具体的示例会贯穿书中。


    第 4 章“主机密钥验证”涵盖了使用任何 SSH 客户端时经常被忽视但至关重要的部分：验证服务器密钥。这个主题如此重要，以至于它需要自己的章节，甚至排在我们第一次讨论
    SSH 客户端之前。


    第 5 章“SSH 客户端”讨论了两个流行的 SSH 客户端：用于 Unix 系统的 OpenSSH `ssh(1)` 和用于 Windows 的 `PuTTY`。


    第 6 章“通过 SSH 复制文件”涵盖了使用 SSH 作为传输媒介跨网络移动文件，使用了 `SCP`（安全复制）和 `SFTP`（SSH 文件传输）协议。


    第 7 章“SSH 密钥”将引导你创建个人密钥对（公钥和私钥）。密钥对使身份验证更安全。与 agent 使用时，它们消除了经常输入密码的需求，但不会降低 SSH
    的安全性。


    第 8 章“X 转发”将教你如何在最小化风险的同时，通过 SSH 连接显示图形。


    第 9 章“端口转发”涵盖了将 SSH 作为通用的 TCP/IP 代理，允许你通过网络将任意连接重定向到远程机器。


    第 10 章“保持 SSH 会话开启”涵盖了在存在防火墙、代理服务器以及想要在几分钟或几小时后关闭会话的不可 ISP 的情况下保持 SSH 会话运行的方法。


    第 11 章“密钥分发”告诉系统管理员如何自动分发主机密钥并在提高安全性的同时消除用户手动比较主机指纹的需求。我们还涵盖了在大型系统中分发公钥的问题。


    第 12 章“自动化”讨论了将 SSH 作为自动化工具和严格控制的用户任务的传输媒介的方法，以及创建单用途用户密钥。


    第 13 章“OpenSSH VPN”演示了如何使用 OpenSSH 在两个站点之间创建加密隧道。


    第 14 章“证书权威机构”引导你创建一个证书权威机构，以仅允许授权的用户密钥登录你的网络。


    废话够了！让我们开始工作吧。


    1 少数 Linux 发行版故意配备了支持 SSH-1 的 SSH 客户端。


    # 第 1 章：加密、算法与密钥


    OpenSSH 加密流量。这意味着什么？它是如何工作的？我在我的书籍 *PGP & GPG*(No Starch Press, 2006) 中提供了详细解释，但这里是简短版本。


    加密将可读的*明文*转换为攻击者无法理解的不可读*密文*。*解密*反转这一转换，从乱码中产生可读文本。*加密算法*是执行这种转换的精确方法。大多数加密算法使用*密钥*；一段用于加密消息的文本、数字、符号或数据。密钥可以由用户选择或随机生成。（人们习惯于选择容易猜测的密钥，因此
    OpenSSH 甚至没有给用户提供创建密钥的选项。）加密算法使用密钥加密文本，使得外部人员难以解密。即使你知道加密算法，如果没有秘密加密密钥，你也无法解密消息。


