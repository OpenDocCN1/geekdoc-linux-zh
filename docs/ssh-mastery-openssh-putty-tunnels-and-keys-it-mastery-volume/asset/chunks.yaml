    You must run this command separately for each key file, but if you have a central
    automation server this approach has a lot to recommend it. Remember, the public
    keys are displayed to anyone who can connect to the server’s SSH port. Copying
    the public key files to a secure server is not usually a security risk.


    As I write this some free DNS providers, such as Hurricane Electric, support `SSHFP`
    records.


    ### Configuring the Client


    The OpenSSH client might use `SSHFP` records by default, depending on how the
    operating system distributor compiled it. Use the `VerifyHostKeyDNS` keyword to
    explicitly define what `ssh` should do. If set to `yes`, the client completely
    trusts keys provided by `SSHFP` records. If set to `ask`, `ssh` displays the key
    fingerprint and asks the user what to do.


    This handles the host keys. Now let’s talk user authentication keys.


    ## Distributing authorized_keys


    A lone sysadmin with only a handful of servers can pretty easily maintain her
    own `authorized_keys` file. Get up to seven or eight servers, and copying `authorized_keys`
    everywhere gets pretty tedious. Have a whole team of sysadmins, and want to ban
    password authentication across your hundreds of servers? You really have to look
    at ways to automate `authorized_keys` replication. You can either have your automation
    system replicate authentication keys on all systems, or have `sshd` query the
    network for a user’s `authorized_keys` at every login attempt. Both have their
    place.


    ### Replicating Key Files


    Having users maintain their own key files can cause operational problems. Users
    have an uncanny ability to corrupt their files, especially when they think they
    know what they’re doing. By having a centralized system to deploy `authorized_keys`,
    you get a chance to perform some basic integrity tests before the user gets themselves
    in trouble. You don’t need a complicated key file parsing and validation system,
    but being able to say, “Did you realize that your key entries have newlines in
    the middle of them?” can reduce annoyance for everybody involved. Also, if a user’s
    workstation gets hacked into, and the intruder bootstraps that into server access,
    the intruder can add their own key to the user’s `authorized_keys` and copy it
    to all the servers in `known_hosts`. Centralizing key management and removing
    a user’s ability to upload new key files without passing through the automation
    system can be desirable.


    You really don’t want your automation system mucking around in each user’s home
    directory. Instead, take advantage of the `AuthorizedKeysFile` `sshd_config` keyword.
    This lets you put a user’s `authorized_keys` file anywhere you want. Combine this
    with the `%u` token to have root own all the user keys.


    ```

    AuthorizedKeysFile /etc/ssh/keys/%u

    ```


    Remember that the `%u` token represents the username. With this `AuthorizedKeysFile`
    setting, the authentication keys for the user `mwl` would be in `/etc/ssh/mwl`,
    while the keys for the user `djm` would be in `/etc/ssh/djm`. Key files outside
    the user’s home directory look exactly like any other `authorized_keys`, but they
    must be owned by root. Even if our hypothetical intruder penetrates an account,
    they can’t edit the keys without privilege escalation.


    Use any features your operating system supports to secure these files. On a UFS
    filesystem, maybe the immutable flag would suit your environment. Or NFSv4 ACLs.
    If something annoyed you by refusing to let you change a file, consider it for
    protecting authorized key files.


    ### Querying the Network for Keys


    If you have centralized authentication system such as LDAP, you can store user
    authentication keys in that system. OpenSSH can query that information source
    with the `AuthorizedKeysCommand` and `AuthorizedKeysCommandUser` keywords.


    ```

    AuthorizedKeysCommand /usr/scripts/getAuthorizedKeys.pl

    AuthorizedKeysCommandUser ldap

    ```


    Any time you look at network-based authentication people’s brains leap into LDAP.
    LDAP is specifically meant for this sort of directory lookup—it’s pretty much
    a database optimized for reads. I can’t go into detail here, as LDAP directories
    vary wildly between vendors. No matter which you use, however, you’ll need to
    get an SSH key schema loaded into your directory. Talk with your LDAP administrator
    and see what they can provide. The exact schema needed varies with the directory
    arrangement, but it usually involves attaching an `sshPublicKeys` entry to the
    user’s account. LDAP administrators for large enterprises that are built upon
    commercial LDAP offerings are often reluctant to extend core directory entries,
    because that limits their ability to get vendor support. In my experience, solving
    this problem required more effort than any other part of key distribution.


    Once you have the schema loaded, you need a script to fetch `authorized_keys`
    from the directory. The type of script varies precisely as much as the types of
    authentication systems people use. A script that authenticates against Active
    Directory will be completely different from one that authenticates against a home-brewed
    OpenLDAP directory. CentOS ships with a script to authenticate against their LDAP
    server, `ssh-ldap-helper(8)`. People have solved this problem for a variety of
    directory services, and made their scripts available, so be sure to look for existing
    solutions before spending the next ten years debugging your own.


    The `AuthorizedKeysCommandUser` keyword defines the account that will run the
    script in `AuthorizedKeysCommand`. If you don’t set `AuthorizedKeysCommandUser`,
    `sshd` will not run the script. All attempts to get a user’s `authorized_keys`
    will fail. I recommend creating a user with no privileges except running this
    one script. Isolated unprivileged users are a ridiculously inexpensive security
    solution that doesn’t get used often enough.


    Just because LDAP gets all of the attention, don’t limit yourself by thinking
    LDAP is a requirement. It’s convenient if you have it, yes, but you can use any
    service that makes sense for your environment. If your organization has a rule
    that all applications must interoperate via ODBC, or perhaps Wordpress XMLRPC
    over HTTPS, leverage your existing expertise and write a script that fetches keys
    that way.

