    如果你的某一台桌面机器被攻破，你必须停止该机器的身份验证密钥。如果你所有的客户端共享同一个私钥，你必须重新生成一个新的密钥对并将其分发到你的所有机器。获取了你私钥的入侵者很可能在你完成此操作之前，就把你排除在自己的系统之外。如果每台机器都有唯一的密钥对——即使所有密钥都使用相同的密码短语——那么一个密钥的泄露或丢失也不会危及你其他所有机器上的密钥。


    此外，首选密钥算法会随着时间而变化。当我写这这本书的第一版时，用户身份验证密钥默认为 1024 位。现在的默认值是 `2048.`。如果我仍在许多年前创建的密钥，它们对于目前的使用来说就太弱了。未来，`RSA`
    默认用户身份验证算法完全可能被完全不同的算法取代。通过在获取新机器时创建新密钥，并使与旧硬件关联的密钥失效，你可以确保密钥是相对较且安全的。


    ## 在 SSH 服务器中禁用密码


    密码没有密钥安全。既然你现在已经拥有了基于密钥的身份验证，明智的做法是禁用基于密码的身份验证。`sshd_config` 关键字 `ChallengeResponseAuthentication`
    禁用了通用的挑战响应响应系统，例如请求用户名和密码的提示。关键字 `PasswordAuthentication` 用于启用或禁用密码。要禁用基于密码的身份验证，请将这两个关键字都设置为
    `no`。


    ```

    ChallengeResponseAuthentication no

    PasswordAuthentication no

    ```


    虽然 `sshd` 默认允许公钥认证，但请确保没有人更改该关键字。`PubkeyAuthentication` 关键字必须设置为 `yes`。


    ```

    PubkeyAuthentication yes

    ```


    现在重启 `sshd`，可以使用内置系统命令或 `pkill -1 sshd`。


    更改 `sshd_config` 不会改变其他程序使用密码的方式。如果你对 `sudo` 使用密码，`sudo` 仍然会要求用户输入密码。


    ### 密码身份验证警告！


    如果你在配置 SSH 时出现错误，导致无人能够登录，你可能会把自己锁在服务器之外。在修改 `sshd_config` 时，在验证你的更改生效之前，不要注销现有的
    SSH 会话。（记住，正如第 3 章所讨论的，你可以在备端口上运行 `sshd` 进行测试。）创建一个新的 SSH 会话。在断开第一个会话之前，验证你可以登录并成为
    root。


    上一段非常重要。忽略它将由自承担后果，或者做好准备迎接你自己的狂躁症型冰激凌大吃之暴。


    ### 允许来自特定主机的密码


    虽然密码很弱，但有时你无法完全禁用它们。你可能有几个用户或应用程序由于或其他原因无法使用密钥。底层问题通常是政治性的而非技术性的，但它们仍然是问题。在你解决这些问题时，可以通过条件配置（如第
    3 章所示）允许来自特定主机的密码。在这里，我们允许来自特定子网的密码认证。


    ```

    Match Address 192.0.2.0/24

    PasswordAuthentication yes

    ```


    记住，所有的 `Match` 语句都位于 `sshd_config` 的底部。


    基于用户名允许密码身份验证是可能的，但极其不理智。SSH 服务器必须在断开请求密码的客户端连接之前获取用户名，而不是直接对客户端断开连接。这意味着 Hail
    Mary Cloud 将不断探测服务器。迫使你允许限制密码身份验证的原因可能让要求强密码同样充满问题——那个要求允许使用密码的老板可能认为 `p455w0rd`
    是一个安全的密码。允许密码的账户将成为一个弱点。在这里唯一能救你对非常安全的堡垒主机进行良好的离机日志，这样当机器被攻破时，你可以告诉老板停机是他的错。


    ## 代理转发 (Agent Forwarding)


    假设我禁用了所有计算机上基于密码的身份验证。访问我任何主机命令行提示符的唯一方法是通过公钥进行身份验证。我正在服务器 `wrath` 上工作，必须将一个文件拷贝到服务器
    `gluttony`。这带来了一个问题。我的私钥不在 `wrath` 上。将私钥拷贝到服务器是非常糟糕的安全实践——你希望私钥出现在尽可能少的主机上，永远不要出现在你的服务器上。但密码不起作用。我该如何使用
    `SCP` 或 `SFTP` 呢？


    答案是将身份验证请求转发回工作站。代理转发正是如此。当你尝试从一台服务器 `SSH` 到另一台服务器时，服务器上的 SSH 客户端会将私钥请求发送回你的桌面。代理作为套接字存在，位于环境变量
    `$SSH_AUTH_SOCK` 指定的位置。


    ```

    $ echo $SSH_AUTH_SOCK

    /tmp/ssh-zOeUnDTnkb/agent.2513

    ```


    要使用代理转发，客户端和服务器必须允许它，并且在启动第一个 SSH 连接之前 SSH 代理必须运行。如果客户端和服务器都支持并请求转发，身份验证请求将被转发。


    ### 代理转发的安全


    代理转发的风险在于你必须对 SSH 服务器扩展某些信任。任何拥有 root 权限的人都可以访问你的 SSH 代理套接字。任何可以访问你的 SSH 代理套接字的人都可以使用你的提供密码密码短钥。


    如果你的 SSH 服务器被攻破，入侵者可以寄用你的身份验证套接字，使用你的凭据登录远程服务器。滥用代理转发导致了许多组织的入侵，即使是那些你认为更懂行的组织。只对你控制的机器开启代理转发。


    ### sshd 中的代理转发


    要在服务器上启用代理转发，将 `AllowAgentForwarding` 关键字设置为 `yes`。


    ```

    AllowAgentForwarding yes

    ```


    我通常会全局禁用代理转发，然后使用 `Match` 语句允许特定的用户或地址转发。


    ### OpenSSH 客户端代理转发


    在 `ssh_config` 中，使用 `ForwardAgent` 关键字激活代理转发。


    ```

    ForwardAgent yes

    ```


    下次你连接到服务器时，客户端将请求代理转发。


    ### PuTTY 代理转发


    PuTTY 默认启用代理转发。在 PuTTY 设置屏幕的左侧，转到 *Connection* -> *SSH* -> *Auth*。在 *Authentication
    parameters* 下，你会看到一个 *Allow agent forwarding* 复选框。


    你还可以使用密钥认证和 `authorized_keys` 来非常限制用户在 SSH 中可以的操作。我们将在第 12 章检查这些。现在，让我们看看转发 X。

