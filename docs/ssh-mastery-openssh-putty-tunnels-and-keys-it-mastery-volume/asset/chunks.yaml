- fmt: 'You can override the SSH client’s refusal to connect to machines when the
    host key changes, or not cache the new key, but remember, SSH doesn’t just validate
    the server and protect your data in transit. A completed connection also hands
    your authentication information to the SSH server. If you give your username and
    password to a compromised machine, you’ve just given the intruder your username
    and password. If you use the same password on multiple machines, you can no longer
    trust any of them. Cancel your weekend plans right now, and possibly next weekend’s
    as well. You’ll be busy recovering from backup and managing irate customers.


    A mismatched key message is a sign that SSH works. Use it.


    # Chapter 5: SSH Clients


    SSH client software resides on a user’s workstation and permits connections to
    an SSH server. We’ll discuss two common clients: the OpenSSH command-line client
    for Unix-like hosts, `ssh(1)`, and the PuTTY client for Microsoft Windows. Both
    clients are freely usable and redistributable, in source or binary form, with
    very minimal restrictions or limitations.


    People have written other SSH clients, of course. You can get an OpenSSH-based
    client for Windows systems either through Cygwin or Microsoft’s Windows Subsystem
    for Linux on Windows 10 and newer. There’s a straight port of OpenSSH to Windows
    (https://github.com/PowerShell/Win32-OpenSSH). Microsoft has released a beta port
    of OpenSSH to Windows 10 and newer, as a developer feature. Similarly, PuTTY has
    been ported to many Unix-like systems and mobile devices. Many people have forked
    both PuTTY and OpenSSH, modifying them to fit their needs. Many of these are solid,
    reliable projects. Once you have a solid grounding in SSH, feel free to use the
    client that you prefer.


    Each client has its own section in this chapter. Further chapters involving SSH
    clients will get chopped into three sections: one for the theory of what we’re
    doing, followed by separate sections on configuring each client.


    ## OpenSSH Client


    The OpenSSH client, `ssh`, is developed synchronously with the OpenSSH server.
    As new features often appear in OpenSSH before other SSH implementations, you’ll
    get the bleeding edge of SSH features by using the newest OpenSSH client. The
    OpenSSH client is developed as part of OpenBSD, but a new portable release appears
    every six months.


    A user’s personal SSH settings are recorded as files in `$HOME/.ssh/`. Like the
    home directory, this directory must be writable only by the user and root, although
    you can allow it to be world-readable. Various client and server functions stop
    working if others can write to this directory. While `ssh` creates `$HOME/.ssh`
    with correct permissions, if your SSH suite behaves oddly check the permissions.


    To run `ssh`, enter the command follow by the host you want to connect to.


    ```bash

    ssh gluttony.mwl.io

    ```


    This uses your client’s default settings to connect to the host `gluttony.mwl.io`,
    including your current username.


    If `ssh` doesn’t behave as you expect, try running it in verbose mode with `-v`.
    You’ll see the server and client negotiate protocol version and encryption algorithms,
    the server present its host key, the client verify that key, and the two negotiate
    authentication methods. While this might not solve your problem, it will tell
    you where the login fails and give you a hint about where to look. Reading the
    output carefully might tell you that, for example, the server only permits logins
    with public keys or you’re trying to use an unsupported encryption method.


    ```bash

    ssh -v gluttony.mwl.io

    ```


    If you still have trouble, multiple `-v` options increase the debugging level.


    In normal cases, that’s it. The rest of this book is about abnormal cases.


    ## OpenSSH Client Configuration


    Configure `ssh` by setting options, either on the command line or in a configuration
    file. Use configuration files for permanent changes and the command line for temporary
    ones. We’ll look at the configuration file first.


    Two files control `ssh(1)` behavior: `/etc/ssh/ssh_config` and `$HOME/.ssh/config`.
    Each contains keywords and values, as discussed in Chapter 2. The former establishes
    default behavior for all system users. The latter is the user’s personal SSH client
    configuration. A user’s configuration overrides all global settings, but most
    users can’t be bothered to enter their own custom configurations. Configuration
    file changes affect all SSH sessions started after the change. There’s no process
    to restart, but changing the configuration doesn’t affect existing SSH sessions.
    Both files have the same syntax and accept exactly the same options. I’ll refer
    to `ssh_config` for brevity, but everything applies equally well to `$HOME/.ssh/config`.


    While most connection options can be set on the command line, I recommend storing
    permanent information in `ssh_config`. Programs such as `scp(1)` and `sftp(1)`
    (see Chapter 6) read `ssh_config`, and each of these programs have slightly different
    command line options. Using a configuration file centralizes configuration.


    The user’s personal configuration overrides the global configuration. Options
    set on the command line override both.


    ### Per-Host Configuration


    You can use the `Host` keyword to change how `ssh` connects to certain hosts.
    Here, I use the `Port` keyword to change the TCP port `ssh` connects to, but only
    for hosts in the `mwl.io` domain. It uses port 22 for all other hosts, as specified
    in `/etc/services*.


    ```ssh

    Host *.mwl.io

    Port 2222

    ```


    I could also specify an IP address, or a network of IP addresses.


    ```ssh

    Host 192.0.2.*

    Port 2224

    ```


    Note that `ssh` matches these `ssh_config` entries. Host entries must be case-sensitive.
    Assume that `ssh_config` contains both `Host` entries above, and let’s see how
    this works in practice.


    ```bash

    ssh gluttony.mwl.io

    ```


    This matches the first `Host` entry, so it connects to port 2222. My desktop’s
    `/etc/resolv.conf` automatically appends the domain `mwl.io` to any hostnames,
    so I probably wouldn’t type the fully domain name. Instead, I’d do something like
    this.


    ```bash

    ssh gluttony

    ```


    This won’t match my first `Host` entry, as I didn’t type the domain name. If the
    host `gluttony` has an IP address in `192.0.2/24`, though, wouldn’t the second
    `Host` entry match? No, because the `Host` entries match on the command line;
    there is no check against DNS. To match based on the IP address, I would need
    to explicitly run `ssh 192.0.2.whatever`. Custom settings for this host require
    a `Host` entry like this.


    ```ssh

    Host gluttony

    Port 2222

    ```


    Conditions are parsed on a first-match basis. Configuration options listed after
    `Host` entries remain in effect until the next `Host` entry. This `ssh_config`
    is probably wrong.


    ```ssh

    Host *.mwl.io

    Host 192.0.2.*

    Port 2222

    ```


    The user probably wanted the `Port` keyword to apply to all hosts in `mwl.io`
    and all IP addresses in `192.0.2/24`. We have an entry for any host in the `mwl.io`
    domain, but there’s no special configuration for it. Any hosts in `192.0.2/24`
    run `sshd` on port 2222. Instead of doing this, list multiple hosts on the same
    line, separated by spaces. Here I list my domain name, my IP addresses, and my
    servers.


    ```ssh

    Host 129.0.2.* mwl.io *.mwl.io gluttony avarice lust pride envy sloth

    Port 2222

    ```


    I list both `*.mwl.io` and `mwl.io` because there is a specific machine named
    `mwl.io`. The leading asterisk and period before the domain name will not match
    that host. Put any global defaults at the beginning of your configuration file.
    Suppose your organization has a policy of running SSH on port 981, because they
    like security through obscurity, but your special servers use a different port
    for even more obscurity.


    ```ssh

    Port 981

    Host *.mwl.io

    Port 2222

    ```


    Here the default port is 981, but the specified hosts use port 2222.

