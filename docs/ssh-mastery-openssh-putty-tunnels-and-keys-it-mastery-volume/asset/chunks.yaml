    If you’ve never used X before, it might seem a little strange. That’s okay. Play
    with it and you’ll quickly understand its usefulness.


    Vanilla X transmits information across the network unencrypted. Secure X in-transit
    by wrapping it with SSH via X11 forwarding.


    # X Security


    X dates from a time when network security was not nearly the issue it is today.
    The developers were happy to get graphic applications working at all, given the
    limited hardware available in those days. Retrofitting security into any protocol
    isn’t as effective as we might hope. Displaying X from a remote machine requires
    extending trust to the remote machine. The more you trust the remote machine,
    the more X programs you can display locally. If you fully trust a compromised
    machine, the intruder can use X to take over your workstation, capture your keystrokes,
    and access your systems as if she was you.


    Only permit X forwarding to users or hosts that truly require it.


    # X and the Network


    Back when X was developed, a site’s Internet connection might be as fast as 56
    kbs. Attempting to use X forwarding between sites was the sort of things sysadmins
    would laugh at over a beer. Now that bandwidth is not such a concern, though,
    people might run a browser on one continent and display it in another.


    While bandwidth is no longer an issue in many parts of the world, latency is very
    real. Many graphical programs are highly sensitive to latency. A program might
    reasonably expect to perform several hundred graphics operations a second. That’s
    fine when each takes a nanosecond. When each takes fifty milliseconds thanks to
    the cross-country link, though, your program becomes unusable. If latency isn’t
    a problem, jitter and packet loss can destroy usefulness.


    If you have any latency at all, investigate alternatives to forwarding X. Maybe
    dynamic port forwarding (Chapter 9) would solve your problem. Perhaps your program
    has a feature for remote use, such as Wireshark’s ability accept a `tcpdump` stream
    from another host. Use a protocol designed to accommodate high latency.


    Inside your local network, though, X forwarding can be incredibly useful.


    # The X Server and Client


    The X server is the computer that provides the graphic display. The X client runs
    the program that generates the display. This seems backwards to many people. If
    you are using X, the X server is almost certainly your desktop. Your desktop must
    have an X server to use X forwarding.


    Almost all Unix-like systems include an X server, usually from X.org but possibly
    a vendor’s proprietary system. If you are running Windows, you’ll need a third-party
    X server. We’ll cover those in the discussion of PuTTY and X.


    # X Forwarding on the SSH Server


    To use X forwarding, the SSH server must have the `xauth(1)` program. If it’s
    present, you can enable forwarding with the `X11Forwarding` keyword in `sshd_config`.


    ```

    X11Forwarding yes

    ```


    Restart (or `pkill -1`) `sshd` after making this change.


    The OpenSSH manuals mention several other options for configuring the fine details
    of X forwarding, but the overwhelming majority of you will never need any of them.
    If you have an odd problem, investigate the various X11 keywords in `sshd_config(5)`.


    # X Forwarding in the OpenSSH Client


    The OpenSSH client supports two levels of X forwarding, differentiated by security
    level. Configure both in `ssh_config`. Basic X forwarding supports only a less-insecure
    subset of the X protocol. This level of X forwarding is fairly safe. Intruders
    cannot take over your desktop or snoop your keystrokes with basic X forwarding.


    ```

    ForwardX11 yes

    ```


    Always try this basic X forwarding first.


    Many X programs use functions beyond the less-insecure subset. When forwarded
    over SSH, these programs show an error and unceremoniously crash. Once you enable
    X forwarding, you can choose to allow the full set of X functions with the keyword
    `ForwardX11Trusted`.


    ```

    ForwardX11Trusted yes

    ```


    When you permit all X functions, you fully trust the SSH server. An intruder who
    controls the SSH server can capture everything on your local screen and your every
    keystroke. Be really, really sure you trust every single remote server you might
    ever log into before permitting this level of trust globally. And once you’re
    absolutely certain—don’t do it.


    X forwarding is one of those rare places where SSH compression makes sense. Set
    the `Compression` keyword to yes to enable compression. It’s best only used on
    a per-host basis, however.


    ## Per-Host X Forwarding


    You can configure per–host settings to restrict X forwarding to only necessary
    hosts, using `Match` rules. Here I have a program on pride that requires fully
    trusting X, so I make a special entry for it in `ssh_config`.


    ```

    ForwardX11 no

    Host pride

    ForwardX11 yes

    ForwardX11Trusted yes

    Compression yes

    ```


    Now I only have to worry about X software on one host, not every host I SSH into.


    ## Forwarding X on the Command Line


    Even better then restricting X forwarding to certain hosts is enabling it on a
    connection-by-connection basis.


    In the previous example I fully trust X for all connections to the host pride.
    I have a program on that host that needs full X access, but I don’t run that program
    every time I log into that host. I want to enable X forwarding for only certain
    sessions. Enable compression with the `-C` flag. Activate standard X forwarding
    when necessary using the `-X` command-line option.


    ```bash

    ssh -CX pride

    ```


    If you must fully trust the remote host, equivalent to `ForwardX11Trusted`, use
    `-Y`.


    ```bash

    ssh -CY pride

    ```


    This eliminates the risks of routinely forwarding X, but supports X forwarding
    when necessary.


    # X Forwarding with PuTTY


    The first problem with forwarding X to Windows host is that Windows does not include
    an X server. You need additional software. Frankly, many people have ported the
    standard X.org software from UNIX to Windows. Use any of them you like. I generally
    use Xming, but don’t worry if your employers or coworkers insist you use a different
    one.


    ### Xming


    Xming is a widely used and frequently updated X server for Windows systems. The
    most recent version of Xming is only available to people who donate to the project,
    but the next older version is free. As with all of the software in this book,
    if you find Xming useful, I encourage you to donate to the programmer. Xming brings
    to Windows all sorts of X tricks familiar to UNIX users, but for our purposes
    we’ll use it only to display programs running on a remote machine


    Download Xming from http://sourceforge.net/projects/xming/. The Xming installer
    is very straightforward to any Windows user, so I won’t walk you through it. Take
    the defaults. Once you complete the install, run Xming to start the server.


    ### Enabling and Disabling X Forwarding


    PuTTY forwards X by default. What’s more, PuTTY does no security-based filtering
    of X; it’s forwarding is equivalent to `ForwardX11Trusted` in ssh. For this reason,
    I recommend disabling X forwarding by default, then enabling it only when needed.


    On the left-hand side of the PuTTY Configurations screen, select *Connection*
    -> *SSH* -> *X11*. The first checkbox is *Enable X11 forwarding*. Deselect it,
    then save the Default Settings. Leave the other settings unchanged, as they’re
    only useful in uncommon situations.


    # Is Forwarding Working?


    Your SSH session won’t look any different after you forward X. How can you prove
    forwarding works before you need it? If SSH has successfully negotiated X forwarding,
    it will set the `DISPLAY` variable in your shell.


    ```bash

    echo $DISPLAY

    localhost:10.0

    ```


    Your shell knows that there’s an X server attached to it. You can run your X program.
    If forwarding isn’t working, `DISPLAY` is undefined. Check your system log, or
    the debugging log of your SSH client.

    '
