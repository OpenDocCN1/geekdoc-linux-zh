    # 致谢


    首先，要感谢编写 OpenSSH 和 PuTTY 的优秀人才们。这些人通过创建和支持他们的软件，从字意义上让世界变得更美好。我必须特别感谢 OpenSSH
    的领军人物 Damien Miller，在我提出愚蠢问题时花时间指引我正确的方向。


    我还要感谢我的技术审稿员：Bill Allaire, Jim Allen, Tim Enders, Marie Helene Kvello-Aune, Kurt
    Mosiejczuk, Mike O’Connor, Bernard Spil, Loganaden Velvindron（来自 hackers.mu）以及
    Markus Waldeck。尽管这些优秀人才付出了努力，书中仍出现了一些错误。


    感谢那些通过 Patreon (https://www.patreon.com/mwlucas) 为我提供持续支持的人们。他们中有一整群人免费获得了一本书作为感谢。


    如果没有所有涉及软件的源代码，写这本书是不可能的。


