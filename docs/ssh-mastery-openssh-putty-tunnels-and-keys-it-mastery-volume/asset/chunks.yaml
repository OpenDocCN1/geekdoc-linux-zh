    如果你在 SSH 服务器上禁用了所有的心跳（keepalives），服务器将无法感知客户端掉线。这意味着当工作站崩溃或网络链路故障导致客户端强制断开时，服务器将不知。它会继续为这些客户端运行
    SSH 进程。如果你的服务器运行时间很久，可能会积累数百甚至数千个失效的 `sshd` 进程。清理它们是一件非常痛苦的事。我建议至少使用 TCP 心跳，最好也使用
    SSH 心跳。


    现在，让我们来看看如何通过密钥分发来简化你的生活。


    我不介意廉价，但我厌恶低质价。


    # 第 11 章：密钥分发


    毫无疑问，管理 SSH 最令人讨厌的部分就是分发和验证密钥。


    无论你对用户进行多么严厉的告诫，他们中的许多人都不会去将服务器指纹与你提供的列表进行对比；相反，他们会点击“是，接受密钥”。无论我们如何努力教育他们，用户很快就会对看起来可怕的警告产生免疫力，并学会忽略它们。帮助用户注意的最好方法是确保除非发生真实错误，否则他们看不到警告。


    同样，基于密钥的身份验证通常比基于密码的更安全。然而，许多用户并不懒得将他们的 `authorized_keys` 复制到服务器。他们只会坚持熟悉的密码。如果你想强制执行基于密钥的身份验证，你需要亲自获取服务器上的用户
    `authorized_keys`。如果你管理着几十或数百台服务器和/或用户，你需要自动化工具在你的系统之间分发用户密钥更新。


    虽然 OpenSSH 不包含自动密钥分发工具，但理解与密钥相关的特性可以极大简化你的自动化流程。我们将从主机密钥开始，然后介绍用户密钥。


    ## 详述 known_hosts


    无论对于 OpenSSH 还是 PuTTY，主机密钥分发都是从 `known_hosts` 开始。如果你打算分发主机公钥，你需要确保这些记录是纯净的。这意味着你需要完全理解
    `known_hosts` 文件。


    `known_hosts` 中的每一行代表来自一个主机的一个公钥，用空格分隔字段。如果一个主机支持三种不同的公钥算法，并且你使用这三种密钥连接到该主机，那么该主机在
    `known_hosts` 中会有三个条目。每个条目还提供了服务器的主机名或 IP 地址以及用于密钥的算法。但每个条目还可以包含其他几个字段。


    ### 标记 (Marker)


    `known_hosts` 文件支持两个特殊标记：`@cert-authority` 和 `@revoked`。这些标记必须出现在行首。


    以 `@cert-authority` 开头的 `known_hosts` 条目表示主机密钥用于 SSH 证书权威机构。SSH 证书权威机构于 TLS CA。第
    14 章讨论了 SSH CA。


    如果入侵者闯入 SSH 服务器并复制了服务器的私钥，该密钥就不再可信。聪明的入侵者可能会使用该密钥尝试伪造服务器。通过在 `known_hosts` 中将密钥标记为
    `@revoked`，你告诉 `ssh` 不要接受此密钥并生成一个可怕的警告。


    ```

    $ ssh gluttony

    ```


    @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@


    @ WARNING: REVOKED HOST KEY DETECTED! @


    @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@


    gluttony.mwl.io 的 ECDSA 主机密钥已被标记为撤销。


    这可能意味着被盗的密钥正被用来仿充此主机。


    gluttony.mwl.io 的 ECDSA 主机密钥已撤销，且你请求了严格检查。


    主机密钥验证失败。


    注意，没有“仍然接受此密钥”选项。撤销的密钥完全不可信。将密钥留在 `known_hosts` 中但标记为撤销，会给用户明确的警告，告诉他们遇到了受攻击的系统。


    标记必须位于行首，主机名之前。


    ### 主机名 (Hostname)


    主机名是 SSH 识别服务器的方式。如果你使用短主机名连接到服务器，`ssh` 会记录它联系服务器时使用的完整主机名。这意味着如果我输入 `ssh wrath`，`ssh`
    记录的主机将是 `wrath.mwl.io`，因为这是我的系统解析器提供给 `ssh(1)` 的名称。机器可能有其他主机名或别名，并且可能通过其 IP 地址已知。一个真正权威的
    `known_hosts` 文件必须包含这些每个名称的密钥。


    好消息是，你不需要为这些不同的名称包含多个大部分重复的行。`known_hosts` 文件允许在条目中接受多个主机名，只要它们用逗号分隔。


    `gluttony.mwl.io,mail.mwl.io,203.0.113.213 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyN…`


    一些系统管理员更改 SSH 服务运行的 TCP 端口。这对于安全并不是很大用，但有助于减缓原始蠕虫并减少日志冗杂。这些主机名出现在 `known_hosts`
    的括号中，后面跟着冒号和端口号。


    `[lust.mwl.io]:2222 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNT…`


    （注：原文中存在多处重复段落，已根据要求去重并完成翻译）

