    当你从客户端到服务器进行 SSH 连接时，隧道应该会自动建立。


    ## CentOS 和 Debian


    在这两个流行的 Linux 发行版上配置 SSH VPN 的方法与 FreeBSD 非常相似。然而，这两个发行版都废弃了 `ifconfig(8)` 和 `route(8)`
