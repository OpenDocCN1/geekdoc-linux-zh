    ![](image9.jpg)


    Figure 9-5: PuTTY Local Port Forwarding Settings


    Hit `Add`, then connect. You now have port forwarding. Point your browser at `localhost`,
    and see what happens.


    To bind this forwarding to the client’s network-facing IP address, select `Local
    ports accept connections from other hosts`. This binds the forwarded port to all
    IP addresses on the client, so that other hosts on the workstation’s network can
    access the forwarding. See “Choosing IP Addresses” later this chapter for a discussion
    of the implications.


    If you want to use this forwarding every time you connect to this host, save this
    session.


    ## Remote Port Forwarding


    Before configuring remote port forwarding, verify that normal SSH works. Determine
    the client and server ports you want to forward to and from.


    Where local port forwarding is usually used to wrap a service with encryption,
    remote port forwarding is used to access a service behind a firewall. For this
    example, I’m going to forward port `2222` on the SSH server’s `localhost` address
    to port `22` on the workstation. When I connect to port `2222` on the SSH server,
    remote forwarding will redirect me to the workstation’s SSH service.


    Why do this? Remember from our example environment, the client is behind a firewall.
    The firewall might be my home NAT device, or my employer’s industrial-grade corporate
    firewall cluster. Remote forwarding lets me use my client to give an SSH server
    outside the network a way to connect to a host inside the firewall, despite any
    firewall rules to the contrary. This might be my invaluable emergency back door
    into my own network, or it might violate my employer’s security policy. Or, better
    still: both!


    Note that you cannot bind a forwarded port to the SSH server’s public-facing IP
    addresses unless the server is specifically configured to permit this with the
    `GatewayPorts` keyword. See “Restricting Port Forwarding” later this chapter.


    ### OpenSSH Remote Forwarding


    Configure remote port forwarding with the `-R` flag.


    ```

    ssh -R remoteIP:remoteport:localIP:localport hostname

    ```


    If you don’t specify an IP address to attach to on the SSH server, SSH attaches
    to `127.0.0.1`. You can skip the first argument in this case, making the command:


    ```

    ssh -R remoteport:localIP:localport hostname

    ```


    I want to connect port `2222` on the SSH server `sloth` to port `22` on my workstation,
    using the `localhost` address on both sides.


    ```

    ssh -R 2222:localhost:22 sloth

    ```


    My client connects to the server and gives me a command prompt. As long as that
    SSH session remains open, another user on `sloth` could SSH to my workstation
    by connecting to port `2222`.


    ```

    sloth$ ssh -p 2222 localhost

    ```


    Poof! A new SSH connection into my workstation, tunneled inside my existing SSH
    session. This new session would show up in the client log as a new connection,
    originating from the `localhost`. You really need to trust the people who have
    accounts on your systems when setting up remote port forwarding. Anyone who can
    access your system’s `localhost` address can use the port forwarding. I would
    never use remote port forwarding on an SSH server I didn’t wholly trust.


    If you want to establish remote port forwarding every time you connect to a server,
    use the `RemoteForward` keyword in `ssh_config`.


    ```

    RemoteForward server-IP:server-port client-IP:client-port

    ```


    Once again, this resembles port forwarding on the command line, but the middle
    colon is missing. Here I set up this same port forwarding in the configuration
    file.


    ```

    Host sloth.mwl.io

    RemoteForward localhost:2222 localhost:22

    ```


    The `RemoteForward` keyword most commonly appears with a `Host` statement, unless
    you want to perform remote forwarding on every host you connect to.


    ### PuTTY Remote Forwarding


    To configure remote forwarding, go to the PuTTY Configuration screen’s left side,
    select `Connection` -> `SSH` -> `Tunnels`, as Figure 9-4 shows. As we’re forwarding
    from server to client, the `Source port` field refers to the port on the server
    that will be forwarded to the workstation. In this case, the source port is `2222`.
    The `Destination` is `localhost:22`, because the workstation’s SSH server runs
    on port `22`. Select `Remote` for remote port forwarding.


    Hit `Add`, then connect. Port forwarding should work.


    To bind this forwarding to the server’s network-facing IP address, select `Remote
    ports do the same (SSH-2 only)`. This binds the forwarded port to all IP addresses
    on the SSH server, so other hosts can access the forwarding. “Choosing IP Addresses”
    later this chapter discusses the implications.


    To make the remote forwarding permanent for this server, save the session.


    You can now laugh at the firewall all the way to the unemployment office. Or get
    into your network when the VPN fails, saving your company. Or, again, both.


    ## Dynamic Port Forwarding


    Dynamic port forwarding transforms your SSH client into a SOCKS (version 5) proxy.
    Any traffic sent to the proxy will be tunneled to the SSH server, which forwards
    that traffic as its own access permits. You must have a SOCKS-aware application
    to access the proxy, but most web browsers include SOCKS support. In this example,
    I’m going to configure port `9999` on my workstation as a SOCKS proxy and dynamically
    forward all traffic to my server on the public Internet.


    When using SOCKS, your client will probably need to forward all DNS requests to
    the SOCKS server. Not all clients support this.


    ### OpenSSH Dynamic Forwarding


    Use the `-D` flag to tell OpenSSH to use dynamic forwarding.


    ```

    ssh -D localaddress:localport hostname

    ```


    If you don’t specify an IP address, ssh automatically binds to `127.0.0.1`. Here,
    I create my proxy on port `9999` on my workstation. All traffic is forwarded over
    the SSH connection.


    ```

    ssh -D 9999 sloth

    ```


    As usual with port forwarding, you’ll log on to the server and get a command prompt.
    The dynamic forwarding runs in the background. Configure the web browser to access
    that proxy at `127.0.0.1:9999`.


    If you want port forwarding configured every time you connect to a host, use the
    `DynamicForward` keyword in `ssh_config`.


    ```

    DynamicForward host:port

    ```


    Like the other forwarding statements, and for the same reasons, the `DynamicForward`
    keyword most commonly appears in a `Host` statement.


    ### PuTTY Dynamic Forwarding


    Go to the `Tunnels` screen shown in Figure 9-4. In the `Source port` field, enter
    the port that you want your SOCKS proxy to use. Leave `Destination` blank. Select
    `Dynamic`, then hit `Add`. You’ll see the port forwarding appear in the `Forwarded
    ports` list. For my sample use, I enter `9999` in the `Source port` field, select
    `Dynamic`, hit `Add`, and connect. Your browser should now be able to connect
    via the SOCKS proxy.


    To bind this forwarding to the client’s network-facing IP address, select `Local
    ports accept connections from other hosts`. This binds the proxy to all IP addresses
    on the workstation, so other hosts can access the forwarding. Remember that you’re
    offering the tunnel to everyone who can access your client when you do this.


    Save the session if you want this forwarding started automatically every time
    you open this connection.


    You can verify dynamic forwarding with any program that supports SOCKS proxies.
    The most common program of this type is a web browser. Configure your firewall
    to block all port 80 traffic from your workstation. Verify that you can no longer
    browse the web. If you’re going to browse, you’ll need to do it over proxy. Start
    a dynamic port forwarding SSH session. Configure the web browser to access that
    proxy. If you can see the Internet, dynamic forwarding is working.

