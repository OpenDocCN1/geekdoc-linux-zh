    `wrath.mwl.io` `ecdsa-sha2-nistp256` `AAAAAE2VjZHNhLXNoYTItbm…`


    Each line contains the machine’s hostname (`wrath.mwl.io`), host key type (`ecdsa-sha2-nistp256`),
    and the public key itself.


    ### Key Caching


    How do you want to update your key cache? In some environments, users must manually
    verify host keys and then manually add them to the key cache. In other environments,
    it’s acceptable to automatically add new keys to the cache. Most commonly, users
    want `ssh` to ask them what it should do. The `StrictHostKeyChecking` `ssh_config`
    option tells `ssh` how to treat new host keys.


    If you want `ssh` to refuse to connect to any host that doesn’t have an entry
    in `known_hosts`, set `StrictHostKeyChecking` to `yes`. The only way for the client
    to connect is to add the host key to the `known_hosts`, presumably from a central
    repository provided by the sysadmin. This makes most sense in an environment where
    host keys are automatically distributed.


    If you’re at the opposite extreme, and you will never verify a host key no matter
    how important it is, you might as well set `StrictHostKeyChecking` to `accept-new`.
    This tells `ssh` to blindly update `known_hosts` with every new key it gets. This
    is the equivalent of never bothering to lock your home, car, office, and bank
    vault—it might feel airy and freeing, but sooner or later someone’s going to take
    uncivil liberties with your personal belongings.


    The default setting, `ask`, tells `ssh` to present any unknown keys and ask the
    user what to do. You can verify the key, accept it, and have `ssh` add it to `known_hosts`,
    or reject the host key.


    Choose the option that best suits your environment. Your laptop probably has different
    needs than a server run by the NSA or a criminal cartel, and all of those are
    different from the orchestration system in your test lab.


    ### Cache Security: Hashing known_hosts


    The `known_hosts` file comes in really handy to intruders who break into your
    desktop; it’s a convenient list of SSH servers to target. As your SSH servers
    might share a common sysadmin, the technique used to penetrate your desktop might
    work on any of those servers. Additionally, sysadmins and other users can view
    the contents of `known_hosts`. The best way to prevent snooping is to change `known_hosts`
    so that it no longer contains a list of hostnames. Accomplish this by hashing
    the hostnames, exactly as `/etc/passwd` does with passwords.


    If you replace the hostnames with hashes, nobody can read the host names from
    the file, nor can anyone reverse-compute the hostnames. When you connect to a
    host, however, `ssh` can easily compute the hash of the server hostname and look
    up that hash in `known_hosts`.


    A hashed `known_hosts` entry looks something like this.


    ```

    |1|PBM07JCRBjfg8qOz1BokTtCDly0=|DVXu0IFq/dC4GMfbEbfVkhptVjQ= ecdsa-sha2-nistp256
    AAAAE2VjZ…

    ```


    If you examine the entry, you’ll see the key algorithm and the host key fingerprint
    further down.


    To have `ssh` automatically hash new host keys added to `known_hosts`, use the
    `ssh_config` keyword `HashKnownHosts`.


    ```

    HashKnownHosts yes

    ```


    This will not hash existing entries, however. Use the `-H` flag to `ssh-keygen(1)`
    to hash your existing `known_hosts`.


    ```

    $ ssh-keygen -H

    /home/mwlucas/.ssh/known_hosts updated.

    Original contents retained as /home/mwlucas/.ssh/known_hosts.old

    WARNING: /home/mwlucas/.ssh/known_hosts.old contains unhashed entries

    Delete this file to ensure privacy of hostnames

    ```


    Hashing your `known_hosts` copies the existing cache to `known_hosts.old`, then
    hashes everything inside `known_hosts`. Verify that `ssh` can still connect to
    all your usual hosts. Once you feel confident that your key cache is still usable,
    delete the unhashed `known_hosts.old`.


    To find a single host entry in the hashed `known_hosts` file, use `ssh-keygen
    -F` and the target hostname.


    ```

    $ ssh-keygen -F avarice.mwl.io

    # Host avarice.mwl.io found: line 17

    |1|5hcRwDHWxwxCWrFTngG4jT4OhJ0=|TyJXB6z+oEJXSP5MzakulFWgPDI= ecdsa-sha2-nistp256…

    ```


    You now know that this entry is on line 17 of the file, and can easily copy it.


    To remove a hashed hostname, use `ssh-keygen -R`.


    ```

    $ ssh-keygen -R avarice.mwl.io

    # Host avarice.mwl.io found: line 17

    /home/mwlucas/.ssh/known_hosts updated.

    Original contents retained as /home/mwlucas/.ssh/known_hosts.old

    ```


    If you hadn’t deleted the unhashed `known_hosts.old`, well, it’s gone now.


    When distributing `known_hosts` from a central system (Chapter 11), there’s no
    reason not to provide the hashed version.


    ### The PuTTY Client


    PuTTY is an SSH, telnet, and serial client, as well as a terminal emulator, for
    both Windows and Unix-like systems. It’s available at `https://www.chiark.greenend.org.uk/~sgtatham/putty/latest.html`,
    or a Web search for “putty SSH” will take you right there. While it’s not written
    by the professional paranoiacs in the OpenBSD team, PuTTY’s freely-available source
    code has been repeatedly audited. PuTTY is probably the most widely deployed Windows
    SSH software.


    The PuTTY download page offers several choices. I recommend the full installer
    that contains PuTTY and all its related programs. You won’t need everything, but
    it’ll be easier and faster than downloading various utilities individually. PuTTY
    doesn’t truly need an installer; you can download plain `PuTTY.exe` if you prefer.
    The installer does create shortcuts in the Start Menu, registers the programs
    with the operating system, and handles all the other Windows minutiae.


    PuTTY can run on the command line. The arguments and command-line flags are conveniently
    similar to those of OpenSSH. If you’re running Windows, though, you’re probably
    interested in PuTTY as a graphical program. We’ll focus on the pointy-clicky interface,
    but you should know that the command line is an option if needed.


    If you feel adventurous, you could download the PuTTY development snapshot instead.
    This includes all of PuTTY’s latest patches and features, but it might also contain
    brand-new bugs.


    Start PuTTY and you’ll get a screen like 5-1.


    (image1.jpg)


    Figure 5-1: PuTTY Startup Screen


    On the right side you’ll configure connections to different servers. We only have
    one connection, `Default Settings`. It won’t connect to anything, but you’ll use
    it to set your PuTTY defaults. You can always get back to this screen by hitting
    `Session` on the left side.


    On the left side, you configure options on how PuTTY presents itself and how it
    handles supported protocols. PuTTY supports a variety of protocols. If you need
    a flexible general-purpose terminal emulator, PuTTY can probably your needs. We’re
    only going to cover SSH, however. Note the `SSH` option, second from the bottom.
    Click there, or expand that little “plus” sign, to view and edit details on how
    PuTTY performs SSH.


    If you select something on the left side, the right-hand side changes to show
    details on your selected option. Select `SSH`, and the right-hand side shows a
    few basic protocol options, such as the protocol version and sharing SSH connections
    (see “Connection Multiplexing” later this chapter.)


    We’ll use these settings to establish our PuTTY defaults.


    ### Setting PuTTY Defaults


    Your fresh PuTTY install lists only one connection, `Default Settings`. Every
    new connection you create starts by copying everything in `Default Settings`.
    Click on the `Default Settings` connection and hit `Load`. You can then edit and
    save the `Default Settings` connection.


    Start by setting a default username. My accounts on my work system all have the
    same username. The only time my username varies is when it’s an account on an
    external system. I can set my default username in PuTTY, and have it pre-configured
    to my most common setting. In the left, choose `Connection`. Under `auto-login
    username`, I put my standard username.


    Now go back to the `Session` panel. Select `Default Settings`, and hit `Save`.
    You’ve updated your default connection. Repeat the process to make further changes
    to your defaults.


    ### Starting SSH Sessions with PuTTY

