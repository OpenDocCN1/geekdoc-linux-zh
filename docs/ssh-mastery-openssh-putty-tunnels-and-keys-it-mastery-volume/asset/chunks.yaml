- fmt: '

    Best practice forbids all access unnecessary for a user to perform his task. Does
    your automated process need port or X forwarding? Turn them off. Does it need
    a special environment? Probably not, because you can establish that environment
    more easily in the user account. Your automated job runs on a single machine,
    so you can restrict the key so that it can only be used from that one machine.
    You’ll probably end up with an `authorized_keys` entry like this.


    ```

    restrict,command="dump /home > /backups/`date +s`.dump",from="192.0.2.8" ssh-rsa
    AAAAB3NzaC1yc2EAAAABJQAAA…

    ```


    Configuring the key like this reduces the scope of disasters. The backup script
    won’t accidentally overwrite your root partition. An intruder can only run your
    backup script. This isn’t great, but it’s better than the intruder stealing your
    data and deleting your log files.


    ### Developing Automation Scripts


    One challenge in restricting a key is understanding what commands the program
    actually needs, versus what you think it needs. The debugging mode of `sshd` can
    help you figure this out. Have your client run its command against `sshd` in debugging
    mode, and study the output. You’ll see all of the commands that the client runs.
    This will also let you lock down the key further than you might otherwise—if you
    know the exact flags `rsync` will use on your server, you can impose those as
    a restriction.


    I’ve written scripts that seem to work from the command line, but fail when scheduled,
    and each time it’s turned out that my script was picking up authentication information
    from my SSH agent rather than using the key I’d created for the task. The `IdentitiesOnly`
    keyword tells `ssh(1)` to only use the identity specified on the command line
    and not your agent. Set `-o IdentitiesOnly=yes` in your script’s SSH command.


    An automated script should never be prompted for user input. You don’t want your
    script hanging and waiting at a password prompt. The `BatchMode` keyword disables
    password and passphrase prompts. By setting `BatchMode` to `yes` the SSH part
    of your script will crash and die immediately, rather than pointlessly hanging
    around forever.


    ### Server-Side Restrictions


    Perhaps you don’t want to use `authorized_keys` to restrict access, or maybe you’d
    like additional protections. You can use the `ForceCommand` `sshd_config` keyword
    to restrict what an account can run.


    `ForceCommand` takes one argument, the command to be run. It’s run under the user’s
    regular privileges, and disregards whatever command the client requested. Much
    like defining a command in `authorized_keys`, `ForceCommand` retains the requested
    command in the `$SSH_ORIGINAL_COMMAND` environment variable.


    `ForceCommand` is best used inside a `Match` statement.


    ### Automation and Root Logins


    “My command needs to run as root!” It is possible to login as root using the `PermitRootLogin`
    keyword. Don’t do it. Logging in as root for automation breaks many fundamental
    security principles. Trusting your automated scripts with remote root privileges
    is a good way to spend an unscheduled weekend restoring the servers from backup.
    (You do have backups beyond `rsync`, right? Remember that `rsync` is a tactic,
    not a strategy.)


    Yes, a few environments can securely support root logins. Some people are using
    root logins in a manner that can support auditing. If you’re reading this book
    to learn about SSH, however, your environment is nowhere near ready for this.


    If your automated process needs privileged access, use `sudo`. `Sudo` (https://www.sudo.ws)
    lets unprivileged users run particular commands with elevated privileges and is
    available for every Unix-like system. I’m not going to go into detail on using
    `sudo`; if you need a tutorial, check any number of websites or my book Sudo Mastery*
    (Tilted Windmill Press, 2013). `Sudo` is far more flexible, and more dangerous,
    than most people give it credit for.


    We’ll use restricted keys in the next chapter to build a VPN over SSH.


    # Chapter 13: Virtual Private Networks


    You can wrap SSH around arbitrary TCP connections, adding a layer of encryption
    to any protocol. But OpenSSH also supports building generic tunnels that can pass
    all traffic and all protocols, not just TCP. You can link to remote offices with
    OpenSSH, creating a Virtual Private Network (VPN) that allows users at one office
    to access the other office almost as if they were on the next floor rather than
    the next country.


    VPNs are an OpenSSH extension to the SSH protocol. PuTTY does not include VPN
    functions and the PuTTY developers have repeatedly stated that they do not intend
    to add it to their client (see the *tun-openssh* wish list item on the PuTTY website).
    We will only examine OpenSSH VPNs on Unix-like systems.


    SSH was not designed as a generic VPN protocol, and tunneling protocols inside
    TCP is terrible practice. When a TCP connection loses packets, it must re-transmit
    those packets until the other end of the connection acknowledges receipt. By wrapping
    a TCP connection inside another TCP connection, you amplify the effects of packet
    loss. TCP-based VPNs collapse in the face of congestion. I strongly recommend
    using `OpenVPN` instead of OpenSSH for your VPN. An OpenSSH VPN does have the
    advantage that it only requires a single TCP port open between the client and
    the server. If that’s all the connectivity you have, an OpenSSH VPN might be your
    least terrible option.


    A VPN is perhaps the most complicated thing you can do with OpenSSH. This chapter
    assumes you are comfortable with the earlier chapters, including public-key authentication,
    keeping an SSH session alive, and restricting the commands available to SSH clients.


    ## Example Network


    Our SSH client, `avarice.mwl.io`, has two network interfaces. One is on the public
    Internet. While we could refer to that interface by IP address, we’ll use the
    hostname instead. The second interface is on private network A, with an address
    of `172.16.0.1/24`.


    The SSH server, `gluttony.mwl.io`, also has one interface on the public Internet.
    We’ll refer to this interface by hostname rather than IP. Its second network card
    is on private network B, and has an IP address of `172.17.0.1/24`.


    ![](image10.jpg)


    Figure 13-1: VPN Network


    We’ll use SSH to establish a point-to-point tunnel between the two hosts. The
    client’s end of the tunnel will have the IP address `192.168.0.2/30`. The server
    end of the tunnel gets `192.168.0.1/30`.


    We’ll consider OpenBSD, FreeBSD, Debian, and CentOS. OpenBSD has the best SSH
    VPN support of any operating system—which shouldn’t surprise anyone, considering
    that OpenSSH originates in OpenBSD. Running an SSH VPN on FreeBSD requires basic
    scripting. Most Linux distributions change OpenSSH to fit better with their systems,
    and they’ve also deprecated the standard UNIX networking commands in favor of
    Linux-specific tools. This means every operating system needs a different approach.
    Between these four, you should find a method that you can adapt for your operating
    system.


    Creating and managing VPNs is the most difficult feature in OpenSSH, and the operating
    systems that support them change over time. I wouldn’t be shocked to see these
    VPN instructions become outdated more quickly than the rest of this book. If you
    have trouble with these examples, consult your operating system documentation
    for more current references.


