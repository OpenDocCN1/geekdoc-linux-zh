  trans: '


    有许多方法可以使用 SSH 来移动文件。诸如 `rsync` 等应用程序可以使用 SSH 作为传输机制。某些窗口管理器也包含了 `SSH` 文件传输工具。我们将针对
    Unix 类系统和微软系统介绍两种特定的协议：`SCP` 和 `SFTP`。绝大多数其他通过 SSH 传输文件的工具实际上都是这些协议其中一个的前端。


    安全拷贝协议（Secure Copy Protocol，简称 `SCP`）设计为 `RCP` 的无缝替换。SSH 文件传输协议（SSH File Transfer
    Protocol，简称 `SFTP`）旨在替代 `FTP`。它是一个交互式协议，允许你浏览远程文件系统。OpenSSH 包含了 `sftp(1)` 和 `scp(1)`
    客户端，而 Windows 客户端可以使用 `WinSCP` 同时支持两种协议。


    ## 使用 OpenSSH 复制文件


    OpenSSH 包含两个文件传输程序：`scp` 和 `sftp`。我们将从较简单但灵活性较差的程序开始。


    ### `scp(1)`


    你可以使用 `scp(1)` 复制单个文件。其语法遵循通常的 Unix 语义。


    ```

    $ scp what-you-have where-you-want-it

    ```


    使用冒号将主机和文件名分开，如下所示：


    ```

    $ scp source-host:filename destination-host:filename

    ```


    一旦通过身份验证，`scp` 就会通过加密通道传输文件。


    如果你没有在命令中输入某个元素，则假设该元素保持不变。例如，要将本地文件 `data.txt` 复制到服务器 `sloth`，请运行：


    ```

    $ scp data.txt sloth:

    ```


    我没有在源端输入机器名称，因此它被假设为本地机器。我输入了远程主机名但没有输入远程文件名，因此文件名保持不变。我的文件 `data.txt` 被复制到了 `sloth`
    上的登录目录。


    如果目标文件已存在，`scp` 会静默地覆盖它。如果账户缺少覆盖文件的权限，则复制将失败。`scp` 程序假设，如果你告诉它覆盖一个已存在的文件，那么你一定有充分的理由这么做。出于这个原因，我不建议在以
    `root` 身份登录时复制文件。


    在主机名后必须使用冒号。如果你跳过冒号，`scp` 将认为该参数是一个文件名。在这里我跳过了冒号，并将文件 `data.txt` 复制到本地机器上的文件 `sloth`。


    ```

    $ scp data.txt sloth

    ```


    至少，这是一个非常安全的本地复制。


    要更改远程端的文件名，请提供一个新的文件名。


    ```

    $ scp data.txt sloth:stuff.txt

    ```


    如果源文件在另一台机器上，且你想将其复制到本地主机，请指定远程主机名作为源。


    ```

    $ scp sloth:data2.txt data2.txt

    ```


    你可以向任何你拥有足够权限的位置或从那里复制文件。


    ```

    $ scp sloth:/var/log/messages sloth-messages

    ```


    要递归复制目录到另一台机器，请使用参数 `-rp`。在这里我在远程主机上同步我的家目录，覆盖任何同名文件。


    ```

    $ scp -rp /home/mwlucas sloth:

    ```


    `scp` 程序刻意借用了许多来自 `cp(1)` 和 `rcp(1)` 的命令行选项。这就是为什么命令行选项通常与 `ssh(1)` 不匹配；它是 `rcp(1)`
    的无缝替换，因此 `rcp` 的标志具有优先级。尽管如此，如果你有更复杂的复制需求，请查看文档。


    `scp(1)` 程序很大程度上是由半个世纪以前的 `rcp(1)` 代码构建的。这使得添加新功能变得很困难。虽然没有人积极提议将 `scp` 丢进“死代码垃圾桶”，但也没有人真正关注它。这个程序就是它的样子。


    如果你有复杂的复制复制需求，请查看 `sftp(1)`。


    ### `sftp(1)`


    SSH 文件传输协议（`SFTP`）比 `SCP` 更灵活。`SCP` 只复制文件，而 `SFTP` 允许许多不同的文件操作，如重命名和删除文件、列出目录等。你会发现几个以“安全”和“FTP”的变体命名的不同协议，所以不要搞混。`SFTP`
    等同于 SSH 之上的 `FTP`，也不是 SSL 之上的 `FTP`。


    `SFTP` 命令刻意复制自 `FTP` 命令，以简化两者之间的转换。你对 `FTP` 命令行的大部分知识适用于 `SFTP`，但我们将介绍基础知识。


    使用 `sftp` 命令和主机名建立连接。


    ```

    $ sftp pride

    ```


    一旦通过身份验证，你将建立连接并获得一个 `SFTP` 提示符。


    ```

    sftp>

    ```


    一旦登录，输入问号或 `help` 单词将列出 `SFTP` 服务器支持的所有命令。`FTP` 用户将识别出大部分命令。


    要从你的本地电脑复制文件到服务器，请使用 `put` 和文件名。


    ```

    sftp> put upload.txt

    ```


    要从服务器复制文件到本地电脑，请使用 `get` 和文件名。


    ```

    sftp> get download.txt

    ```


    如果连接在下载完成前中断，请使用 `reget` 从中断的地方继续下载。`reget` 不执行文件完整性检查，只查看偏移量。


    要更改服务器上的文件名，使用 `rename`，后面跟着旧文件名和新文件名。


    ```

    sftp> rename data.txt stuff.txt

    ```


    要更改服务器上的目录，使用 `cd` 和目录名。


    ```

    sftp> cd /var/log

    ```


    要更改本地的目录，使用 `lcd` 和目录名。


    ```

    sftp> lcd Downloads

    ```


    退出 `SFTP` 会话使用 `quit` 或 `exit`。


    ### 用户名与配置


    在使用 `scp` 或 `sftp` 时，如果你在远程机器使用不同的用户名，请在服务器名之前加上 `@` 符号。


    ```

    $ scp data.txt user@sloth:

    ```


    记住这一点最简单的方法是在 `ssh_config` 中创建一个项目。两个文件复制程序都从 `ssh_config` 获取配置，因此在那里进行更改将影响整个套件。


    虽然两个程序使用命令行参数来更改行为，但这些参数与 `ssh` 不一致。`SFTP` 设计用于替换 `FTP`，而 `SCP` 替换 `RCP`。开发者优先考虑了用户的舒适性。例如，你可以使用
    `-P` 更改端口，而不是 `ssh` 的 `-p`。


    ## 使用 WinSCP 复制文件


    PuTTY 安装程序自带了优秀的命令行 SCP 和 SFTP 客户端，但如果你运行的是 Windows，可能想要一个图形化界面。`WinSCP` 是一个适用于
    Windows 的 SCP、SFTP、`FTP` 和 `WebDav` 客户端。它根据服务器支持的情况在协议之间透明切换。


    从 https://winscp.net 获取 `WinSCP`。虽然在家庭或中使用 `WinSCP` 不需要费用，但它的许可证（GPLv2）限制了向客户分发修改版本。如果你想在自己的产品中包含
    `WinSCP`，请仔细阅读许可。


    `WinSCP` 带有标准的 Windows 安装程序。默认设置对大多数用户都是的，并包含了方便的功能，如在选择文件时将 `WinSCP` 添加到右键菜单。安装程序还会安装
    `Pageant` 和 `puttygen`（如果你没有作为 PuTTY 的安装它们）。我们将在第七章中使用它们。


    启动 `WinSCP` 你看到这个屏幕。


    ![](img/image2.jpg)


    图 6-1：WinSCP 登录


    左侧包含已保存的连接。在右侧设置新连接。输入服务器的主机名、用户名和密码。根据需要更改端口。你可以通过点击 *Save* 保存此连接。


    `WinSCP` 可以导入你的 PuTTY 密钥缓存。选择 *工具->导入*。你会看到 PuTTY 密钥缓存的内容，每个项目旁边都有复选框。验证你想要使用的每个服务器都已勾选，然后选择确定。`WinSCP`
    现在可以利用你验证主机密钥时所做的工作。


    一旦你在 PuTTY 中验证了主机密钥，你就可以回到 `WinSCP` 在那里导入已验证的密钥。


