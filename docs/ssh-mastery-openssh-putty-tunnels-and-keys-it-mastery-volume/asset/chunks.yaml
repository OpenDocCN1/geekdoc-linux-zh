    将会搜索 `wrath.michaelwlucas.com`。


    如果你激活了主机名规范化，`ssh` 默认尝试对包含一个或更少点的主机进行规范化。这让规范化能够捕获子域名，例如将 `www.detroit` 转换为 `www.detroit.mwl.io`。要更改主机名中点的最大数量，请使用
    `CanonicalizeMaxDots` 关键字。在这里我允许零或更少的点。


    ```

    CanonicalizeMaxDots 0

    ```


    OpenSSH 还有其他主机名规范化功能，可以在 `ssh_config(5)` 中讨论。


    ## Common SSH 选项


    人们最常用的功能是更改用户名、端口或添加 SSH 选项。


    ### 更改用户名


    大多数 SSH 客户端假设你的用户名在客户端和服务器上是相同的，并尝试使用你在本地机器上的相同用户名登录远程系统。在我大多数的系统中，我的用户名是 `mwl`。有时有人会为我创建一个不同用户名的账户，比如
