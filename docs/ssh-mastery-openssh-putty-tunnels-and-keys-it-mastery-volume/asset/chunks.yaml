  raw: 'If you disable all keepalives on your SSH server, the server cannot notice
    when a client goes off-line. This means that when a workstation crashes or a network
    link fails, forcibly disconnecting a client, the server won’t know. It will continue
    running the SSH processes for these clients. If your server is up for a long time,
    you may accumulate hundreds or even thousands of defunct sshd processes. Cleaning
    them up is kind of a pain. I recommend using TCP keepalives at a minimum, and
    preferably SSH keepalives as well.


    Now let’s look at simplifying your life through key distribution.


    [1](#section-0012.xhtml_ref_footnotebookmark_start_61_1) I''m fine with inexpensive,
    but I *detest* cheap.


    # Chapter 11: Key Distribution


    Unquestionably, the most annoying part of managing SSH is distributing and verifying
    keys.


    No matter how dire the lecture you inflict upon your users, many of them won’t
    bother to compare server fingerprints to the list you provide; instead they’ll
    hit “Yes, accept the key.” No matter how hard we try to educate them, users quickly
    grow inured to the scary-looking warnings and learn to ignore them. The best way
    to help users pay attention is to ensure that they don’t see warnings unless something
    is truly wrong.


    Similarly, key-based authentication is usually more secure than password-based.
    Many users won’t bother to copy their authorized_keys to a server, however. They’ll
    just stick with familiar passwords. If you want to enforce key-based authentication,
    you’ll need to get the user’s authorized_keys on the servers yourself. And if
    you manage dozens or hundreds of servers and/or users, you will need automation
    to distribute user key updates amongst your systems.


    While OpenSSH doesn’t include automated key distribution tools, understanding
    key-related features can vastly simplify your automation process. We’ll start
    with host keys, and proceed to user keys.


    ## known_hosts In Detail


    Host key distribution, for both OpenSSH and PuTTY, starts with known_hosts. If
    you’re going to distribute host public keys, you’ll want to be sure that those
    records are pristine. That means you need to completely understand the known_hosts
    file.


    Each line in known_hosts represents one public key from one host, in space-separated
    fields. If a host supports three different public key algorithms, and you’ve connected
    to this host using all three keys, that host will have three entries in known_hosts.
    Each entry also gives the server’s hostname or IP address and the algorithm used
    for the key. But each entry can also include a couple other fields.


    ### Marker


    The known_hosts file supports to special markers, @cert-authority and @revoked.
    These markers must appear first in line.


    A known_hosts entry that starts with *@cert-authority* indicates that the host
    key is for an SSH certification authority. An SSH certification authority is not
    the same as a TLS CA. Chapter 14 discusses SSH CAs.


    If an intruder breaks into an SSH server and copies the servers private key, that
    key can no longer be trusted. A savvy intruder might use that key to try to spoof
    the server. By marking a key with @revoked in known_hosts you tell ssh to not
    accept this key and to generate a scary warning.


    $ **ssh gluttony**


    @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@


    @ WARNING: REVOKED HOST KEY DETECTED! @


    @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@


    The ECDSA host key for gluttony.mwl.io is marked as revoked.


    This could mean that a stolen key is being used to


    impersonate this host.


    ECDSA host key for gluttony.mwl.io was revoked and you have requested strict checking.


    Host key verification failed.


    Note that there is no “accept this key anyway” option. A revoked key is utterly
    un-trusted. Leaving the key in known_hosts but marking it as a revoked gives the
    user clear warning that they’ve encountered a compromised system.


    Markers must go at the beginning of the line, before the hostname.


    ### Hostname


    The hostname is how SSH identifies an SSH server. If you used a short hostname
    to connect to the server, ssh records the full hostname that it used to contact
    the server. This means that if I typed ssh wrath, ssh would record the hostname
    as wrath.mwl.io because that’s the name my system’s resolver provided to ssh(1).
    The machine might have other host names or aliases, and is probably also known
    by its IP address. A truly authoritative known_hosts file must include keys for
    each of those names.


    The good news is, you don’t have to include multiple mostly-duplicate lines for
    these different names. The known_hosts file accepts multiple host names in a single
    entry, so long as they are separated by commas.


    gluttony.mwl.io,mail.mwl.io,203.0.113.213 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyN…


    Some sysadmins change the TCP port their SSH service runs on. This isn’t terribly
    useful for security, but helps slow down the more primitive worms and reduces
    log chatter. These host names appear in brackets in known_hosts, followed by a
    colon and the port number.


    [lust.mwl.io]:2222 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNT…


    Chapter 5 covered obscuring host names by hashing them, preventing a casual intruder
    from extracting server information from known_hosts. Listing multiple host names
    on a single line simplifies central management of known_hosts, but conflicts with
    hashing host names. If you wish to hash host names, you must list each hostname
    on a separate line. A host known as avarice.mwl.io, mail.mwl.io, and 198.51.100.12
    requires three known_hosts entries, and each will be separately hashed. If you’re
    going to hash known_hosts entries before distributing them, I recommend maintaining
    your master file in clear text.


    A host that accepts connections on multiple IP addresses theoretically needs a
    known_hosts entry for each of those addresses. If you don’t normally connect to
    all of those addresses, then don’t bother. I have a server with dozens of IP addresses,
    but I only connect via SSH to one of those addresses, so that server has only
    one known_hosts IP entry. If you have such a server, locking sshd to only listening
    on one address might simplify management.


    ### Key Type


    The key type is the algorithm used to generate this host key. A modern known_hosts
    can contain six different key types: *ssh-dss* (DSA keys), *ssh-rsa* (RSA keys),
    *ecdsa-sha2-nistp256*, *ecdsa-sha2-nistp384*, and *ecdsa-sha2-nistp512* (ECDSA
    keys), and *ssh-ed25519* (ED 25519 keys). Anything else that appears in the space
    is weird and needs investigation.


    ### Key


    The public key is a long gibberishy alphanumeric string. It often starts with
    a series of capital A’s and often (but not always) ends with equal signs (=).
    The key fills the majority of the line.


    ### Comment


    The comment is free-form text. You can use the comment anyway you need. It’s generally
    blank in automatically-maintained known_hosts files, but you’ll find it useful
    in centralized management.


    ### Creating known_hosts


    The easy way to generate a known_hosts is to use ssh-keyscan(1).


    $ **ssh-keyscan wrath > wrath.known_hosts**


    That gives you a known_hosts file to start with. Now you need to verify those
    keys against the fingerprints you generated in Chapter 4\. That’s a great job
    to give to a meticulous, conscientious flunky you loathe.


    I encourage you to automate collecting known_hosts entries. How you do this depends
    entirely on your organization’s preferred tools. Ideally, you’d run ssh-keyscan
    when the machine is first deployed, before any intruder has a chance to trash
    it, and immediately update your known_hosts.


    If you want to simplify known_hosts, you could reduce the number of keys that
    an SSH server offers. You might declare that all hosts in your network only offer
    ED25519 keys, eliminating all the known_hosts entries for all other key types.
    The sshd_config HostKeyAlgorithms keyword lets you set the algorithms sshd will
    use for host identification.'
