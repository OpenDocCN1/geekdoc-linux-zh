    # 第 0 章：引言


    在过去的 15 年里，OpenSSH (http://www.OpenSSH.com) 已经成为 UNIX 类系统和许多网络设备远程管理的标准工具。然而，大多数系统管理员只使用获取命令行所需的最基本的
    OpenSSH 功能。OpenSSH 有许多强大的功能，如果你愿意花时间理解它们，这些功能将使系统管理变得简单。你可以在互联网各处找到关于 OpenSSH
    的信息和教程。其中一些写得很糟糕，或者仅适用于少数场景。很多写得很好，但它们已经是十年前的内容了，涵盖了九年前通过软件更新就解决的问题。如果你有几个空闲日子，并且知道问什么问题，你就可以从杂质中筛选出有效的、当前的教程。


    这本以任务为导向的书将节省你的精力和时间，让你腾出来准备下一个版本的《堡垒要塞》。我假设你正在使用较新版本的 OpenSSH 和 PuTTY，我会忽略诸如“我二十年前的路由器只支持
    SSH 版本 1”之类的边缘情况。如果你发现了这本书，说明你有能力通过搜索来回答非常具体的问题。我不会讨论如何从源码构建 OpenSSH，或者如何在许多不同的平台上安装
    OpenSSH 服务器。如果你是系统管理员，你知道去哪里找这些信息。如果你是系统用户，你的系统管理员应该为你安装并配置 OpenSSH 服务器，但掌握客户端程序将帮助你工作得更快更高效。


    ## 谁应该读这本书？


    每个管理 UNIX 系统的人都必须理解 SSH。OpenSSH 是最常用的 SSH 实现。除非你明确正在使用不同的 SSH 实现，否则请阅读这本书。


    不是系统管理员但必须通过 SSH 连接到服务器的人也会发现这本书很有帮助。虽然你可以在五分钟内学会 SSH 的基础知识，但正确的 SSH 使用会让你的工作变得更简单更快速。如果你愿意，可以跳过关于服务器配置的章节，尽管了解系统管理员*实际上能*做什么，而不是他们*想*做什么，总是好的。


    ## SSH 组件


    安全 Shell (SSH) 是一种在两个网络主机之间创建加密通信通道的协议。SSH 保护两台机器之间传输的数据，使其他人无法窃听。Tatu Ylönen
    在 1995 年创建了最初的协议和实现，旨在取代不安全的协议，如 `telnet`、`RSH` 和 `rlogin`。随着 1999 年 OpenSSH 发布，SSH
    迅速成为管理主机的标准方法。今天，许多不同的软件包依赖 SSH 协议跨私有、公共和敌对网络进行加密且经过验证的数据传输。


    ### OpenSSH


    OpenSSH 是 SSH 协议部署最广泛的实现。它起源于原始 SSH 软件免费许可版本，经过了重写、扩展和更新。


    ### SSH 服务器


    SSH 服务器在网络上监听传入的 SSH 请求，验证这些请求并提供系统命令行提示符（或其他你配置的服务）。最流行的 SSH 服务器是 `sshd`。


    ### SSH 客户端


    使用 SSH 客户端连接到远程服务器或网络设备。Windows 系统上最流行的 SSH 客户端是 PuTTY。Unix 类系统的标准 SSH 客户端是来自
    OpenSSH 的 `ssh(1)`。两者都是免费获取的并可用于任何目的（商业或非商业），且无需费用。


