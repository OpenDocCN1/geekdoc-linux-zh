  trans: "\n\nSSH VPN 使用隧道（或 `tun`）接口进行工作。隧道是一个位于其他网络接口之上的虚拟接口。隧道接口最常见的用途是在两个独立的宿主机之间创建虚拟链接，例如在\
    \ VPN 中。此隧道被视为一个点对点的连接。创建隧道接口的方法根据操作系统的不同而异。\n\n当你使用 SSH VPN 时，客户端和服务器都会将它们自身绑定到各自机器上的隧道接口上。当操作系统向隧道发送数据包时，该数据包将通过\
    \ SSH 连接进行中继。当另一端机器的 SSH 进程接收到数据包时，它会进行解包，并通过本地隧道接口发送给操作系统。\n\n就像你想要用于 IP 路由的任何其他接口一样，你的隧道接口也需要\
    \ IP 地址。你必须将发往远程网络的流量路由到隧道远端的 IP 地址。我们将在每个示例中演示此操作。\n\n每个隧道接口都需要一个设备号，类似于 Unix\
    \ 类系统上的任何其他设备。就像你的网络接口可能是 `eth0` 或 `em1` 一样，隧道设备可能是 `tun0` 或 `tun1`。我们的示例使用设备号\
    \ 0，创建如 `tun0` 之类的设备名称。如果你有许多隧道设备，我建议为每个用途分配一个特定的设备，并重新评估你的设计选择。\n\n### SSH 服务器配置\n\
    \n`sshd_config` 关键字 `PermitTunnel` 指定了客户端是否可以建立 VPN 隧道。`PermitTunnel` 有四个有效选项：`yes`、`no`、`point-to-point`\
    \ 或 `ethernet`。如果设置为 `no`（默认值），则禁止隧道。如果设置为 `yes`，则允许所有隧道。\n\n点对点隧道是一个从一个地方运行到另一个地方的虚拟私电路。点对点隧道需要路由才能使用。这通常是\
    \ SSH VPN 最优的隧道类型。\n\n`PermitTunnel point-to-point`\n\n以太网隧道传输二层流量，允许两个独立的位置共享它们的本地局域网（LAN）。如果可能，请避免在\
    \ SSH 上建立以太网隧道。VPN 一侧的本地网络问题可能会跨越链路传播并耗尽你的外部带宽。SSH VPN 已经容易受到拥塞影响；不要让该问题进一步放大。\n\
    \n要使用 SSH VPN，SSH 进程必须拥有足够的权限来更改客户端和服务器上的隧道设备和路由表。创建 SSH VPN 需要客户端和服务器的 root 权限。你将以\
    \ root 身份运行 `ssh` 并直接以 root 登录。我之前提到过以 root 登录是一个非常糟糕的选择。我坚持这一观点。然而，如果你正在使用 SSH\
    \ VPN，你基本上已经没有好的选择了了。\n\n在这里我允许我们的 SSH 客户端在 SSH 服务器上进行 root 登录，但仅通过公钥认证。我还允许该\
    \ IP 地址开启隧道。\n\n`Match Address avarice.mwl.io`\n\n`PermitRootLogin prohibit-password`\n\
    \n`PermitTunnel point-to-point`\n\n在生产配置中，请使用客户端的 IP 地址而不是主机名。\n\n非常旧版本的 OpenSSH\
    \ 可能不允许将 `PermitTunnel` 语句放在 `Match` 语句内部。如果你遇到这样的 `sshd`，请立即升级服务器的 OpenSSH——在公互联网上使用它是不安全的。\n\
    \n### IP 转发\n\n为了让 SSH VPN 连接两个不同的网络，SSH 服务器和客户端必须将数据包从一个接口转发到另一个接口。这被称为 `IP forwarding`（IP\
    \ 转发）。在接口之间转发数据包是主机与路由器之间的唯一区别。SSH 客户端在其内部以太网接口上接收数据包，并将这些发往远程位置的数据包通过 VPN 传输。同样，SSH\
    \ 服务器在其内部接口上接受发往另一个办公室的数据包，并将其投射到 VPN 端。\n\n### VPN 身份认证密钥\n\n在 VPN 中使用密钥认证。如果你打算手动启动\
    \ VPN（仅在特殊情况下），请按照第 7 章“SSH 密钥”中讨论的那样，创建一个标准的用户认证密钥。如果由自动化进程启动 VPN，请按照第 12 章“自动化”中所述，创建一个无密码的密钥。将密钥放在客户端的一个特殊文件中，例如\
    \ `/root/.ssh/tunnelkey`。\n\n将该密钥对的公钥拷贝到服务器的 `/root/.ssh/authorized_keys` 中。此密钥应该只允许运行\
    \ VPN 命令；即使使用基于密钥的认证，你也不希望远程入侵者能够获取你服务器的 root 登录。第 12 章讨论了如何限制密钥权限，但所需的精确命令随操作系统而异。\n\
    \n### SSH 隧道命令\n\n使用 `-w` 标志激活 OpenSSH 隧道。\n\n```\nssh -i keyfile -f -wclientTunnelNumber:serverTunnelNumber\
    \ servername true\n```\n\n `-i` 告诉 `ssh` 使用哪个私钥文件。`-w` 告诉客户端请求一个隧道，以及在双方请求哪些隧道设备号。`-f`\
    \ 将 `ssh` 置于后台运行，这样你在远程系统上就不会有命令提示符。我们运行 `true(1)` 只是为了拥有一个始终执行成功的命令。\n\n在我们的示例中，密钥文件是\
    \ `/root/.ssh/tunnelkey`。我想在每端使用隧道设备 0，服务器是 `gluttony.mwl.io`。\n\n```\nssh -i\
    \ tunnelkey -f -w0:0 gluttony.mwl.io true\n```\n\n如果一切运行良好，它应该静静地返回本地命令提示符。\n\n\
    这些命令行选项中的可以在 `ssh_config` 中设置。我建议将隧道选项放在 `/root/.ssh/config` 中，而不是系统级配置。你不希望一个无权用户尝试开启隧道并跨越它。\n\
    \n```\nHost gluttony.mwl.io\nTunnel point-to-point\nTunnelDevice 0:0\nIdentityFile\
    \ /root/.ssh/tunnelkey\nIdentitiesOnly yes\n```\n\n根据你的环境添加其他选项。\n\n```\nssh -f\
    \ gluttony.mwl.io true\n```\n\n### 调试\n\n如果你按照你操作系统的步骤操作但隧道没有启动，请以详细模式运行 `ssh`。你将看到错误的详情。如果这没有帮助，请以调试模式运行\
    \ `sshd`。在互联网上搜索你的错误信息。\n\n现在让我们配置一些 VPN。\n\n## OpenBSD\n\nOpenSSH 是在 OpenBSD\
    \ 内部开发的，OpenBSD 团队创建了 SSH 功能，因此 OpenBSD 对 SSH VPN 有很好的支持。首先通过在 `/root/.ssh/authorized_keys`\
    \ 中放入控制措施来收紧密钥的权限：\n\n```\nrestrict,tunnel=\"0\",command=\"/bin/sh /etc/netstart\
    \ tun0\" ssh-rsa AAAAB3Nza...\n```\n\n我锁定了所有基于密钥的选项，即使客户端被破解并以 root 登录服务器，也不会造成太大伤害。\n\
    \n通过将 `sysctl` net.inet.forwarding 设置为 1 在 OpenBSD 上启用数据包转发。\n\n```\nsysctl net.inet.forwarding=1\n\
    ```\n\n为了使此更改在重启后依然有效，在 `/etc/sysctl.conf` 中创建一个匹配项。\n\n```\nnet.inet.forwarding=1\n\
    ```\n\n现在配置你的隧道设备。客户端和服务器上都需要一个 `/etc/hostname.tun0`。每个文件包含两行。这里是客户端的：\n\n```\n\
    192.168.0.2 192.168.0.1 netmask 255.255.255.252\n!route add 172.17.0.1/24 192.168.0.1\
    \ > /dev/null 2>&1\n```\n\n第一行创建一个本地 IP 为 `192.168.0.2` 远程 IP 为 `192.168.0.1`\
    \ 的隧道接口。OpenBSD 会在启动时配置此接口，但接口不会激活；隧道尚未绑定到任何地方。当你激活 SSH 隧道时，它会绑定到隧道接口。`hostname.tun0`\
    \ 的第二行是 OpenBSD 在隧道激活时运行的命令。该命令配置了指向服务器后局域网的路由。\n\n"
