    关键字。将 `CanonicalizeHostname` 设置为 `yes`，并将 `CanonicalDomains` 设置为你的域名。考虑以下配置：


    ```

    CanonicalizeHostname yes

    CanonicalDomains mwl.io

    Host *.mwl.io

    Port 2222

    ```


