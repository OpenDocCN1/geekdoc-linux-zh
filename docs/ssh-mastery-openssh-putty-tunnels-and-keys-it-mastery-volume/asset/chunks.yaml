    ```


    256 SHA256:JwmD+yFwH83rPdhorge/S6qxXAUy3/G0CvFqTrcIWkY root@www (ED25519)


    我们看到此密钥使用了 256 位的 SHA-256。指纹本身就是是以 `JwmD…` 开头并以 `ciWY` 结尾的长字符串。之后是生成该密钥的用户和主机，以及括号中的密钥类型。


    服务器和客户端会协商使用哪种密钥来建立连接。客户端可能会向用户展示任何支持的密钥，因此你需要获取服务器上每个公钥的指纹。收集所有指纹最简单的方法是将它们复制到一个文件中。


    ```bash

    $ ssh-keygen -lf ssh_host_ed25519_key.pub > $HOME/fingerprints.txt

    ```


    ```bash

    $ ssh-keygen -lf ssh_host_ecdsa_key.pub >> $HOME/fingerprints.txt

    ```


    ```bash

    $ ssh-keygen -lf ssh_host_rsa_key.pub >> $HOME/fingerprints.txt

    ```


    现在将这些指纹提供给你的用户。


    你可以使用 `ssh-keyscan(1)` 从你的 SSH 服务器检索密钥指纹，但你必须根据服务器的公钥对这些指纹进行验证。在你这样做之前，还不如直接从服务器本身提取公钥指纹。不过，`ssh-keyscan`
    程序对于验证主机的公钥指纹是否发生变化非常有用。


    ## 提供主机密钥指纹


    首次连接到 SSH 服务器的用户应该将客户端中显示的主机密钥指纹与已知的良好密钥指纹进行比较。不过，只有当比较过程简单时，真实用户才会这样做。系统管理员需要让指纹比较既方便又安全。最简单的方法可能是在可以在组织内部访问的加密网站上显示密钥指纹。当员工需要访问服务器的
    SSH 时，在提供登录凭据同时给他们指向指纹页的链接。不要通过不安全的媒介（如电子邮件或未加密的网站）分发密钥指纹。


    第 11 章提供了自动分配密钥和指纹的方法。部署这些方法可以消除用户手动验证密钥的需要，同时提高合规性并减轻大家的工作负载。


    如果你正在运行 OpenSSH 客户端，可以通过密钥证书（第 14 章）、SSHFP 记录（第 11 章）或两者来简化密钥验证。包括 PuTTY 在内的极少数客户端支持这些协议。


    ## 主机密钥与 OpenSSH 客户端


    当你首次使用 OpenSSH 客户端 `ssh(1)` 连接到 SSH 服务器时，你会看到一个请求验证密钥的提示。


    ```bash

    $ ssh gluttony

    ```


    无法建立主机 ''gluttony (203.0.113.213)'' 的身份。


    ECDSA 密钥指纹为 SHA256:jovou1bQ0S1Ex6QBjo4T+0+FzwzyTXLqxF/aPudVTnk。


    DNS 中未找到匹配的主机密钥指纹。


    这是你验证 OpenSSH 服务器确实是你所认为的主机的机会。OpenSSH 为你提供了 ECDSA 密钥指纹。获取你的服务器密钥列表，并将列表中的 ECDSA
    密钥指纹与客户端中的 ECDSA 密钥指纹进行比较。如果指纹匹配，输入 yes 以缓存已验证的密钥并继续连接。你会收到类似下面的消息。


    Warning: 已永久将 ''gluttony'' (ECDSA) 添加到已知主机列表中。


    下次你连接到此主机时，`ssh(1)` 将将缓存的主机密钥与服务器上的主机密钥进行比较，静静安全地连接，或者大安全地断开连接。


    如果密钥不匹配，`ssh(1)` 将立即断开连接而不缓存密钥。立即通知你的系统管理员和/或安全团队主机密钥不匹配。


    OpenSSH 还支持一种简单的指纹比较方法，称为 `randomart`。randomart 图像是密钥指纹的视觉化解释。然而，这是一种非标准的表示。可以尝试
    randomart，但不要假设它随处可用。


    ## 主机密钥与 PuTTY 客户端


    当你首次使用 PuTTY 连接服务器时，你会收到一个类似于图 4-1 的警告。


    ![](img/image0.jpg)


    图 4-1：PuTTY 密钥指纹消息


    将客户端显示的密钥指纹与列表中的密钥指纹进行比较。注意，PuTTY 使用 RSA 密钥协商连接，这与 OpenSSH 和其 OpenSSH 服务器之间约定的
    ECDSA 密钥不同。


    如果密钥匹配且你希望 PuTTY 缓存密钥以备后用并连接，点击 Yes。


    如果密钥匹配且你希望 PuTTY 在不缓存密钥的情况下连接，点击 No。


    如果密钥不匹配，点击 Cancel 终止连接。你正在连接的主机并不是你认为的主机。检查你输入的是正确的主名，然后通知系统管理员和/或安全团队主机密钥不匹配。


    ## 当密钥不匹配时


    如果主机密钥发生了变化，你会收到类似这样的消息。


    ```bash

    $ ssh gluttony

    ```


    @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@


    @ 警告：远程主机标识已更改！ @


    @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@


    入侵者可能控制了服务器或者将你的连接重定向到了不同的服务器。你、系统管理员和/或你的安全团队将面临糟糕的一天。


    了解真相的唯一方法是咨询系统管理员。在不知道密钥更改原因之前，不要连接到服务器。这些都是需要调查的严重错误。


    如果密钥是因为合法原因发生变化的，请验证新密钥。如果新密钥正确，用新密钥替换旧密钥。


    `/home/mwlucas/.ssh/known_hosts` 中冲突的 ECDSA 密钥：


    在 `/home/mwlucas/.ssh/known_hosts` 中添加正确的主机以消除此消息。


    可能有人在搞鬼！


    主机密钥也可能发生了变化。gluttony.mw.io 的指纹已更改，且你请求了严格检查。


    主机密钥验证失败。


    看起来很吓人？它应该是。发生了一些事情。你的 SSH 客户端正在尖叫某些事情非常糟糕。如果你的笔记本电脑是一辆救护车，警灯会旋转，警报声会鸣响。用于识别此系统的超级主机密钥对已更改。


