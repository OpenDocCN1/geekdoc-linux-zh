- fmt: '

    Once you understand PuTTY and OpenSSH, you’ll have the base knowledge to use any
    secure SSH client.


    ## SSH Protocol Versions


    The SSH protocol comes in two versions, `SSH-1` (version 1) and `SSH-2` (version
    2). Always use `SSH-2`. All modern SSH software defaults to version 2. You will
    find old embedded devices that still rely on SSH version 1, but `SSH-1` is barely
    more secure than unencrypted telnet.


    One person designed `SSH-1` for his own needs. It met those needs admirably, and
    in the 1990s it was a whole bunch better than telnet. As SSH grew more popular,
    more people examined the protocol and exposed weaknesses in the original design.
    With today’s computing power, `SSH-1` is highly vulnerable to attacks. While `SSH-1`
    encrypts your data in transit and prevents casual eavesdropping, an attacker that
    knows a couple tricks can capture your data, decrypt your data in transit, lull
    you into thinking that you logged on to the correct machine when you are actually
    connected to a different host, insert arbitrary text into the data stream, or
    any combination of these. Attacking an `SSH-1` data stream isn’t quite a point-and-click
    process, but intruders do break `SSH-1` in the real world.


    The appearance of security is worse than no security. Never use SSH version 1.


    It might seem harmless to permit `SSH-1` for servers or clients that don’t support
    `SSH-2`. The client and server transparently negotiate the SSH version they will
    use for a connection however. If either client or server tolerates `SSH-1`, an
    intruder can capture your login credentials and all transmitted data. It’s fairly
    straightforward to insert arbitrary text (such as `rm -rf /*`) into an `SSH-1`
    session. This was discovered in 1998, and today’s massive computing power has
    made this attack far easier. `SSH-1` sessions can be decoded in real time by programs
    such as `Ettercap`. The incremental improvements to `SSH-1`, such as `SSH 1.3`
    and `1.5`, are vulnerable. SSH servers that offer SSH version 1.99 support SSH
    version 1 and version 2.


    Do not let your SSH clients request `SSH-1`. Do not let your SSH servers offer
    `SSH-1`.


    OpenSSH has removed support for `SSH-1`, so if you have an old embedded device
    that only speaks `SSH-1`, you’ll need to manage it with `PuTTY` or, better still,
    spend a couple dollars to replace that device with something built this millennium.[1](#section-0002.xhtml_ref_footnotebookmark_end_51_1)


    `SSH-2` is the modern standard. The protocol is designed so that vulnerabilities
    can be quickly addressed as they are discovered. Our constantly-increasing computing
    power makes today’s strong encryption tomorrow’s security risk, so `SSH-2` is
    designed so that its algorithms and protocols can be upgraded in place.


    Protocols such as `SCP` and `SFTP` (Chapter 7) are built atop SSH.


    ## What Isn’t In This Book?


    This book is meant to familiarize you with SSH, and help you reach a minimum level
    of competence with `OpenSSH` and `PuTTY`. This means eliminating passwords, restricting
    your SSH services to the minimum necessary privileges, and using SSH as a transport
    for common management tools. You will be able to easily copy files over SSH, manage
    server keys with minimal fuss, use digital certificates to permit only approved
    keys on your network, and a few other tricks.


    This book is not intended as a comprehensive SSH tome. It doesn’t cover integrating
    SSH with `Kerberos`, or `SecurID`, or hooking your SSH install into `Google authenticator`,
    or using your SSH agent as an authentication source for third-party programs.
    These are all interesting topics, but very platform specific, and might well change
    before you finish reading this book. Sysadmins interested in authentication options
    might find my book *PAM Mastery* (Tilted Windmill Press, 2016) useful.


    ## What Is In This Book?


    Chapter 0 is this introduction.


    Chapter 1, “Encryption and Keys,” gives basic information about encryption and
    how SSH uses it.


    Chapter 2, “Common Configuration,” covers configuration syntax used throughout
    the `OpenSSH` server and client.


    Chapter 3, “The OpenSSH Server,” discusses configuring the `OpenSSH` server `sshd`.
    This chapter orients you on configuring `sshd`, but more specific examples appear
    throughout this book.


    Chapter 4, “Host Key Verification,” covers a frequently overlooked but vital part
    of using any SSH client: verifying server keys. This topic is so vital that it
    needs its own chapter, even before our first discussion of SSH clients.


    Chapter 5, “SSH Clients,” discusses two popular SSH clients, `OpenSSH`’s `ssh(1)`
    for Unix-like systems and `PuTTY` for Windows.


    Chapter 6, “Copying Files Over SSH,” covers moving files across the network using
    SSH as a transport, with the `SCP` (secure copy) and `SFTP` (SSH file transfer)
    protocols.


    Chapter 7, “SSH Keys,” walks you through creating a personal key pair (public
    and private cryptographic key). Key pairs make authentication more secure. When
    combined with agents they eliminate the need to routinely type passwords but don’t
    degrade SSH security.


    Chapter 8, “X Forwarding,” will teach you how to display graphics over your SSH
    connections while minimizing risk.


    Chapter 9, “Port Forwarding,” covers using SSH as a generic TCP/IP proxy, letting
    you redirect arbitrary network connections through the network to remote machines.


    Chapter 10, “Keeping SSH Sessions Open,” covers ways to keep SSH sessions running
    despite the firewalls and proxy servers and unreliable ISPs that want to shut
    them down after minutes or hours.


    Chapter 11, “Key Distribution,” tells systems administrators how to automatically
    distribute host keys and improve security while eliminating the need for users
    to manually compare host fingerprints. We also cover issues distributing public
    keys across large systems.


    Chapter 12 “Automation,” discusses ways to use SSH as a transport for automated
    tools and tightly–controlled user tasks, as well as creating single-purpose user
    keys.


    Chapter 13, “OpenSSH VPNs,” demonstrates how to use OpenSSH to create encrypted
    tunnel between two sites.


    Chapter 14, “Certificate Authorities,” guides you through creating a certificate
    authority to permit only authorized user keys to log on your network.


    That’s enough blather! Let’s get to work.


    [1](#section-0002.xhtml_ref_footnotebook_start_51_1) A few Linux distributions
    deliberately ship an SSH client that supports SSH-1.


    # Chapter 1: Encryption, Algorithms, and Keys


    OpenSSH encrypts traffic. What does that mean, and how does it work? I give a
    detailed explanation in my book *PGP & GPG* (No Starch Press, 2006), but here’s
    the brief version.


    Encryption transforms readable *plaintext* into unreadable *ciphertext* that attackers
    cannot understand. *Decryption* reverses the transformation, producing readable
    text from apparent gibberish. An *encryption algorithm* is the exact method for
    performing this transformation. Most encryption algorithms use a *key*; a chunk
    of text, numbers, symbols, or data used to encrypt messages. A key can be chosen
    by the user or randomly generated. (People habitually choose easily-guessed keys,
    so OpenSSH doesn’t even give users an option to create your own.) The encryption
    algorithm uses the key to encrypt the text, making it more difficult for an outsider
    to decrypt. Even if you know the encryption algorithm, you cannot decrypt the
    message without the secret encryption key.

