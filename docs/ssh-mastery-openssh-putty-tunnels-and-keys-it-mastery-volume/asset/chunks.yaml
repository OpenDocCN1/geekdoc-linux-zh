    此主机显示了三个 `sshd(8)` 进程。第一个 PID 为 626，显示的是普通的 `/usr/sbin/sshd`。它是监听 TCP 端口 22 的主进程。


    第二个进程 PID 为 31960，是处理我连接到此主机的 SSH 连接的特权进程。第三个 PID 为 44387，是处理你的登录会话的非特权子进程。OpenSSH
    通过**权限分离**（privilege separation）来提高安全性，这将在本章末尾的“保护 SSH 服务器”中讨论。如果有人故意禁用了权限分离并以不安全的方式运行
    `sshd`，你将无法看到非特权会话。1


    如果 `sshd` 未在运行，请通过你的操作系统的配置工具启用它。


    ## 配置 sshd


    大多数操作系统将 `sshd` 作为独立服务器运行，且不带任何命令行参数。配置 `sshd` 的通常方法是通过 `/etc/ssh/sshd_config`
    中的关键字。不过，在你开始对该文件进行任何修改之前，你应该知道如何测试和调试它们。


    OpenSSH 让调试 `sshd` 配置变得尽可能简单。无论是否调试，运行 `sshd` 都必须拥有 root 权限。最简单的调试方法是使用备用配置文件、备端口和调试模式。


    ### 备用配置文件和端口


    假设你想编辑 `sshd_config`，但需要确保更改符合预期。`-f` 命令行参数告诉 `sshd(8)` 使用一个备用配置文件。


    ```

    /usr/sbin/sshd -f sshd_config.test

    ```


    注意，我是使用 `sshd` 的完整路径执行此测试配置的。OpenSSH 的 `sshd` 在接受连接时会重新执行自身，它需要完整路径来完成此操作。如果不提供完整路径，将得到类似“sshd
    re-exec requires execution with an absolute path.”的错误。


    一个 `sshd` 实例只能绑定到特定的 TCP 端口。你的测试 `sshd` 进程可能无法启动，因为它无法绑定到 22 端口。你可以编辑 `sshd_config.test`
    为你的测试进程分配另一个端口，但当你将其移动到生产环境时，就必须重新编辑该文件，而我们都知道这正是会在故障报告中显眼出现的问题。相反，使用 `-p` 命令行参数覆盖配置的
    TCP 端口并分配新端口。


    ```

    /usr/sbin/sshd -f sshd_config.test -p 2022

    ```


    现在测试进程正在监听 2022 端口。（注意，`-p` 无法覆盖将 `sshd` 绑定到端口和地址的 `ListenAddress` 关键字；参见本章稍后的“网络选项”。）


    通过在命令行上设置备用配置文件和端口，你可以测试新配置、批准它并将其移动到生产环境，同时确信在进行最终的未经测试的更改时没有损坏文件。（顺便说一下，我从未通过这种方式搞坏系统。）无论如何，请保存你原始的
    `sshd_config`，以防你的更改导致了测试未发现的问题。


    测试完成后，切忘记杀死你的测试 `sshd` 进程。


    ### 验证 sshd_config 更改


    可能你只想做一个微小的更改，并认为不需要进行完整的测试。你可以使用 `-t` 标志让 `sshd(8)` 验证配置文件和所有关键文件。


    ```

    sshd -t

    ```


    ```

    /etc/ssh/sshd_config: line 112: Bad configuration option: ExposeAuthInfo

    /etc/ssh/sshd_config: terminating, 1 bad configuration options

    ```


    要么此主机上安装的 `sshd` 版本过旧，不支持 `ExposeAuthInfo` 关键字，要么操作系统软件包作者故意删除了该选项。


    ### 调试 sshd(8)


    `-d` 标志告诉 `sshd` 在前景调试模式运行，不分离控制终端。在调试模式下，`sshd` 只能处理单个登录请求——不，不是一次处理一个请求。它处理一个登录或登录尝试后退出。不要在生产环境中这样做；请在备用端口上运行。调试会实时显示你的
    `sshd` 进程执行的所有操作，如下：


    ```

    /usr/sbin/sshd -p 2022 -d

    ```


    ```

    debug1: sshd version OpenSSH_7.5, OpenSSL 1.0.2l-freebsd 25 May 2017

    ... (调试日志略)

    ```

    *(注：输入文本包含重复的调试日志，根据“保留核心内容”和“优化格式”规则已进行压缩，同时保持了去重后的示例结构。）*

    '
- fmt: '

    # Chapter 7, “SSH Keys,” covers creating host keys using OpenSSH’s native tools.


    ## Network Options


    You can control how `sshd(8)` uses the network, from the version of IP all the
    way to the TCP port.


    ```

    Port 22

    AddressFamily any

    ListenAddress 0.0.0.0

    ListenAddress ::

    ```


    The `Port` keyword controls the TCP port `sshd` uses. Internet standards call
    for SSH to run on port `22`. Some organizations use a different port for SSH in
    the hope of improving security. Running SSH on an unusual port won’t actually
    help secure SSH, but it will reduce the number of login attempts from SSH-cracking
    worms, as discussed in “Protecting the SSH Server” later in this chapter. It also
    lets you escape particularly ineffective firewalls. Override the `Port` keyword
    on the command line with `-p`.


    `AddressFamily` refers to the version of TCP/IP `sshd` uses. To use only IPv4,
    set this to `inet`. To only use IPv6, set this to `inet6`. The default, `any`,
    tells `sshd` to process requests no matter what protocol they arrive over. Some
    operating systems patch `sshd(8)` to support non-TCP/IP protocols such as the
    Stream Control Transmission Protocol (SCTP).


    Many hosts have multiple IP addresses. By default, `sshd` listens for incoming
    requests on all of them. If you want to limit the IP addresses that `sshd` attaches
    to, use the `ListenAddress` keyword. A `ListenAddress` of `0.0.0.0` means “all
    IPv4 addresses,” while `::` means “all IPv6 addresses.” (Some operating systems
    use `::` to mean “all IPv4 and IPv6 addresses,” because why would they let you
    turn on a service for IPv6 only?) Each `ListenAddress` takes a single IP address
    as an argument, but you can use as many `ListenAddress` keywords as you need.
    Explicitly list every IP address that you want the SSH server to accept connections
    on.


    If a host has many IP addresses and you want to block SSH access to just a few
    of them, you might find blocking traffic with a packet filter easier than using
    many `ListenAddress` statements.


    You can also use `ListenAddress` to add an additional port on a particular IP
    address, by specifying the port in a `ListenAddress` statement. Consider the following
    configuration.


    ```

    ListenAddress 0.0.0.0

    ListenAddress 192.0.2.8:2222

    ```


    Our first `ListenAddress`, `0.0.0.0`, tells `sshd` to listen to all addresses
    on this machine. The default `Port` is `22`, so we’ll get port `22` on all addresses.
    That’s fine. The second `ListenAddress` makes `sshd` also listen for connections
    on port `2222` on the address `192.0.2.8`. Each address can have its own `ListenAddress`
    statement.


    ```

    ListenAddress 192.0.2.8:2222

    ListenAddress 192.0.2.9:25

    ListenAddress 192.0.2.10:80

    ```


    Three different addresses, each with a different port. Mind you, having `sshd`
    listen to the SMTP and HTTP ports is generally unwise, but OpenSSH is not designed
    to prevent you from doing generally unwise things. If you’re stuck behind a naïve
    firewall that blocks everything but ports `80` and `443`, running `sshd` on those
    ports would let you evade the firewall.


    ## Banners and Login Messages


    Many sysadmins want to display a message to the user before they log in. This
    is called a `banner`. The SSH protocol doesn’t require clients to display banners.
    The server can offer a banner, but you can’t guarantee that the user will see
    it. Both `ssh(1)` and `PuTTY` display banners. Set the keyword `Banner` to the
    full path of the file.


    ```

    Banner /etc/ssh/banner

    ```


    Be aware that if the banner does work, it might interfere with automated processes
    run over SSH. In some locations, a banner can serve as a legal notice to intruders.
    (Mind you, I’m not aware of anyone who’s been successfully prosecuted through
    use of such banner warnings, but that is the law.) Choose the headache you prefer.


    If the user is authenticating with public keys and the client does display the
    banner, the login will proceed. No human being will see your legal department’s
    finely worded warning about logging into the host until the login is complete.


    You can reliably display the system message of the day, `/etc/motd`. This message
    doesn’t appear until after the client has authenticated, though, so it might not
    meet your needs. The keyword `PrintMotd` is set to `yes` by default, but you can
    turn it off.


    ```

    PrintMotd yes

    ```


    On systems that use Pluggable Authentication Modules (PAM), a PAM module might
    be responsible for printing `/etc/motd`. If you’re having trouble enabling or
    disabling the display of `/etc/motd`, check your PAM configuration.


    Once a user has logged on, `sshd` prints the time of the user’s last logon and
    where they logged in from. To turn this off, set `PrintLastLog` to `no`.


    ```

    PrintLastLog yes

    ```


    While it might seem unnecessary, I strongly recommend leaving `PrintLastLog` on.
    More than once, users have alerted me to intrusions when they saw that their previous
    login was from a foreign country or at a ridiculous hour.


    ## Authentication Options


    In a default OpenSSH install, a user can try to log in 6 times in 2 minutes in
    a single SSH session. You should be using public key authentication (Chapter 7,
    “SSH Keys”) almost everywhere, but even users with passwords should be able to
    incorrectly type their password in twenty seconds. You can change both the timing
    and the number of attempts.


    The `LoginTime` keyword controls how long `sshd` gives a user to authenticate.
    If a session connects to `sshd` for this long without authenticating, the connection
    terminates. You can give a number of seconds (`s`), minutes (`m`), or hours (`h`).


    ```

    LoginTime 2m

    ```


    You can also control how many times a user may attempt to authenticate in a single
    connection with `MaxTries`. The default is 6.


    ```

    MaxTries 6

    ```


    After half of a user’s permitted attempts in a session have failed, `sshd` logs
    further failures. Authentication attempts include both public key and passwords.
    After `MaxTries` failures, the user must initiate a new session and try again.
    My usual failure procedure is to fail to log six times, then remember that I have
    a different username on this machine. When I take my own advice on changing usernames
    from Chapter 5, “SSH Clients,” and install my public key everywhere, this problem
    goes away.


    ## Verify Login Attempts against DNS


    A log message like “Login failed from boss’s computer” makes you sigh. A log message
    like “Login succeeded from Hacker Nation” should trigger alarm. The owner of an
    IP address controls the reverse DNS for that address. An intruder who controls
    the reverse DNS for his IP address can change the apparent hostname to something
    within your company. For protection against this sort of attack, `sshd` can verify
    connection attempts against forward DNS entries.


    ```

    UseDNS no

    ```


    When set to `yes`, every time a client connects, `sshd` looks up the host name
    for the source IP, and then looks up the IP address for the host name. If the
    names don’t match, `sshd` rejects the connection.


    Suppose an intruder controls the reverse DNS for his IP address `192.0.2.99`.
    He gives it a hostname within your organization, such as `dhcp12.mwl.io`, and
    connects to your SSH server. Your SSH server asks its DNS server for the IP address
    for `dhcp12.mwl.io`. If that DNS entry doesn’t exist, or it points to an IP other
    than `192.0.2.99`, `sshd` rejects the connection.


    If DNS fails, `sshd` waits for a full DNS timeout before allowing the connection.


    `UseDNS` requires that your DNS be tidy, coherent, and correct. While I’m in favor
    of auditing an organization’s DNS entries, performing such audits via `UseDNS`
    lacks elegance. DNS checks don’t help if an intruder can poison the server’s DNS
    cache. If you’re a home user, your ISP probably controls the reverse DNS on your
    connection. Also, DNS checks can increase system load. If you serve hundreds or
    thousands of simultaneous SSH users, that load can be substantial. When DNS fails,
    failed DNS checks will slow down all SSH logins. Finally, many IPv6 sites haven’t
    configured reverse DNS and won’t for the foreseeable future.

    '
