  raw: 'An SSH VPN works using a tunnel (or *tun*) interface. A tunnel is a virtual
    interface that sits above some other network interface. The most common use for
    tunnel interfaces is to create a virtual link between two separate hosts, such
    as in a VPN. This tunnel is treated as a point-to-point connection. The method
    for creating tunnel interfaces varies by operating system.


    When you use an SSH VPN, the client and server both attach themselves to tunnel
    interfaces on their respective machines. When the operating system sends a packet
    to the tunnel, the packet is relayed through the SSH connection. When the other
    machines SSH process receives the packet, it unwraps it and sends it to the operating
    system via the local tunnel interface.


    Just like any other interface you want to use for IP routing, your tunnel interfaces
    need IP addresses. You must route traffic destined for the remote network to the
    IP address at the remote end of the tunnel. We’ll demonstrate this in each example.


    Each tunnel interface needs a device number, like any other device on a Unix-like
    system. Just as your network interface might be eth0 or em1, tunnel devices might
    tun0 or tun1\. Our examples use device zero, creating device names like tun0\.
    If you have many tunnel devices I recommend both assigning a specific device for
    each purpose and reassessing your design choices.


    ### SSH Server Configuration


    The sshd_config keyword PermitTunnel specifies if a client may establish a VPN
    tunnel. PermitTunnel has four valid options: yes, no, point-to-point, or ethernet.
    If set to no (the default), tunnels are forbidden. If set to yes, all tunnels
    are permitted.


    A point-to-point tunnel is a virtual private circuit that runs from one spot to
    another. A point-to-point tunnel requires routing to be usable. This is usually
    the best type of tunnel for an SSH VPN.


    PermitTunnel point-to-point


    An Ethernet tunnel transmits layer 2 traffic, permitting two separate locations
    to share their local LAN. Don’t tunnel Ethernet over SSH if you can possibly avoid
    it. Local network problems on one side of the VPN can propagate across the link
    and saturate your external bandwidth. SSH VPNs are already vulnerable to congestion;
    don’t amplify that problem even more.


    To use an SSH VPN, the SSH processes must have sufficient privileges to make changes
    to the tunnel devices and the routing table on both the client and the server.
    Creating an SSH VPN requires root privileges on both the client and the server.
    You’ll run ssh as root and log in directly as root. I stated earlier that logging
    in as root is a terrible option. I stand by that statement. If you’re using an
    SSH VPN, however, you’re basically out of good options.


    Here I permit our SSH client a root login on the SSH server, but only through
    public-key authentication. I also allow that IP address to open a tunnel.


    Match Address avarice.mwl.io


    PermitRootLogin prohibit-password


    PermitTunnel point-to-point


    In your production configuration, use the client’s IP address rather than the
    hostname.


    Very old versions of OpenSSH might not let you put the PermitTunnel statement
    inside a Match statement. If you encounter such an sshd, immediately upgrade the
    server’s OpenSSH—it’s not safe to have on the public Internet.


    ### IP Forwarding


    For an SSH VPN to connect two different networks, both the SSH server and the
    client must forward packets from one interface to another. This is called *IP
    forwarding*. Forwarding packets between interfaces is the only difference between
    a host and a router. The SSH client receives packets on its internal Ethernet
    interface, and transmits those packets meant for the remote location across the
    VPN. Similarly, the SSH server accepts packets bound for the other office on its
    internal interface and shoots them across the VPN.


    ### VPN Authentication Key


    Use key authentication with VPNs. If you’re going to bring up your VPN manually,
    only on special occasions, create a standard user authentication key as discussed
    in Chapter 7, “SSH Keys”. If an automated process will start the VPN, create a
    key without a passphrase as covered in Chapter 12, “Automation”. Put the key in
    a special file, such as /root/.ssh/tunnelkey on the client.


    Copy the key’s public key to the server’s /root/.ssh/authorized_keys. This key
    should only be able to run the VPN commands; even with key-based authentication,
    you don’t want a remote intruder able to get a root login on your server. Chapter
    12 discusses restricting key privileges, but the exact commands needed vary by
    operating system.


    ### The SSH Tunnel Command


    Activate an OpenSSH tunnel with the -w flag.


    # **ssh -i keyfile -f -wclientTunnelNumber:serverTunnelNumber servername true**


    The -i tells ssh which private key file to use. The -w tells the client to request
    a tunnel, and which tunnel device numbers to request on each side. The -f puts
    ssh into the background, so that you don’t have a command prompt on the remote
    system. And we run true(1) just so we have a command that always runs successfully.


    In our examples, the key file is /root/.ssh/tunnelkey. I want to use tunnel device
    0 on each side, and the server is gluttony.mwl.io.


    # **ssh -i tunnelkey -f -w0:0 gluttony.mwl.io true**


    If all works well, this should silently return to a local command prompt.


    Some of these command-line options can be set in ssh_config. I recommend placing
    tunnel options in /root/.ssh/config, rather than the system-wide configuration.
    You don’t want an unprivileged user’s innocent SSH session attempt to open a tunnel
    and route across it.


    Host gluttony.mwl.io


    Tunnel point-to-point


    TunnelDevice 0:0


    IdentityFile /root/.ssh/tunnelkey


    IdentitiesOnly yes


    Add other options for the host as your environment or the operating system requires.
    This strips down the command line needed to activate the tunnel.


    # **ssh -f gluttony.mwl.io true**


    Our examples assume that you have enabled root logins, copied the client’s public
    key to the server, and set up the host’s key and tunnel devices in /root/.ssh/config.


    ### Debugging


    If you follow the steps for your operating system and the tunnel doesn’t start,
    run ssh in verbose mode. You’ll see the details of your errors. If that doesn’t
    help, run sshd in debug mode. Search the Internet for the exact text of your error
    messages. You will certainly find people who have experienced and solved your
    problem.


    Now let’s configure some VPNs.


    ## OpenBSD


    OpenSSH is developed inside OpenBSD, and the OpenBSD team created the OpenSSH
    VPN function, so OpenBSD has very good support for OpenSSH VPNs. Start by tightening
    up what your client may access with this key by putting controls in /root/.ssh/authorized_keys.


    restrict,tunnel="0",command="/bin/sh /etc/netstart tun0" ssh-rsa AAAAB3Nza…


    I’ve locked down all the key-based options, then added the ability to access a
    specific tunnel device and run the command that configures that tunnel. Even if
    the client is compromised and logs into the server as root, it can’t inflict much
    damage.


    Enable packet forwarding on OpenBSD by setting the sysctl net.inet.ip.forwarding
    to 1.


    # **sysctl net.inet.ip.forwarding=1**


    To make this change permanent across reboots, make a matching entry in /etc/sysctl.conf.


    net.inet.ip.forwarding=1


    Now configure your tunnel devices. You’ll need an /etc/hostname.tun0 on both the
    client and the server. Each contains two lines. Here’s the client:


    192.168.0.2 192.168.0.1 netmask 255.255.255.252


    !route add 172.17.0.1/24 192.168.0.1 > /dev/null 2>&1


    The first line creates a tunnel interface with a local IP of 192.168.0.2 and a
    remote IP of 192.168.0.1\. OpenBSD will configure this interface at boot, but
    the interface won’t be active; the tunnel isn’t attached to anything. When you
    activate your SSH tunnel, it attaches to the tunnel interface. The second line
    of hostname.tun0 is a command that OpenBSD runs when the tunnel activates. This
    command configures routing to the LAN behind the server.'
