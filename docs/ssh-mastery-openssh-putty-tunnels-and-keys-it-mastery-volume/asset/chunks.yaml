    `Local port forwarding`（本地端口转发）将客户端上的一个端口重定向到服务器上的一个端口。本质上是在说：“在 SSH 服务器上获取某个端口，并将其映射到我的客户端本地。”假设你想从一个仅提供未加密
    POP3 的服务器下载邮件，但你拥有该服务器的 SSH 访问权限。你可以将本地机器上的 `2110` 端口转发到 POP3 服务器上的 `110` 端口。配置你的邮件客户端，从本地主机地址的
    `2110` 端口下载邮件。SSH 会拦截所有指向 `2110` 端口的请求，并将它们转发到邮件服务器的 `110` 端口。图 9-1 展示了本地端口转发的数据流。


    ![](img/image5.jpg)


    图 9-1：本地端口转发数据流


    `Remote port forwarding`（远程端口转发）的作用原理相反。SSH 服务器上的某个端口被转发到你 SSH 客户端上的某个端口。你是在说：“取我客户端上的某个端口并将其附加到远程服务器上。”例如，你可以在公司防火墙后的工作站上启用
    `sshd`。然后你从工作站通过 SSH 连接到公互联网上的服务器。通过远程端口转发，你可以将公互联网服务器上的 `2222` 端口转发到你工作站的 SSH
    端口。任何连接到你公服务器 `2222` 端口的人都会透明地连接到你工作站的 SSH 服务器。他们无需任何 VPN 客户端即可进入防火墙内部，且完全无视防火墙策略。你可能会使用远程端口转发让私有
    Web 服务器公开可用。图 9-2 展示了远程端口转发。


    ![](img/image6.jpg)


    图 9-2：远程端口转发数据流


    `Dynamic port forwarding`（动态端口转发）是一个大系统，许多不同的客户端程序可以连接到许多不同的服务。它在 SSH 客户端创建一个
    SOCKS 代理，并将发送该代理的任何请求通过服务器发出。SOCKS 代理是一个可以携带任何 TCP/IP 流量的通用网关。（顺带一下，SOCKS 并不代表任何含义）。这让任何连接到代理的人都能访问服务器的网络。图
    9-3 展示了动态端口转发。


    ![](img/image7.jpg)


    图 9-3：动态端口转发数据流


    当底层的 SSH 会话终止时，所有端口将停止转发。第 10 章提供了保持 SSH 会话存活的建议。


    有了这些可能性，很容易看出为什么系统管理员喜爱 SSH，以及为什么许多公司安全部门禁止它。


    ## 特权端口与转发


    在类 Unix 系统中，`1024` 以下的 TCP 端口预留给系统使用。只有 `root` 可以绑定到这些端口。作为非特权用户，你可以将 SSH 转发器的本地端附加到
    `1024` 以上的任何端口。转发预留端口需要以 `root` 身份使用 SSH。以 `root` 身份执行常规任务是一种糟糕的做法，因此在没有绝对理由的情况下，请不要这样做。


    只有连接到特权端口的一端需要以 `root` 身份运行。如果你在客户端上绑定保留端口，请以 `root` 运行客户端，但以普通用户身份登录服务器。如果你在服务器上绑定保留端口，你需要以
    `root` 身份登录服务器。在后的情况下，更改端口是更好的想法。


    ## 本地转发


    在设置本地转发之前，请验证其运行正常。要设置本地转发，请使用 `-L` 参数。


    ```

    ssh -L local_port:remote_host:remote_port user@server

    ```


    （注：此节提供的文本在后半部分包含大量的重复/占位符文本痕迹。我已经根据指令清理了提供的核心技术概念。）


