    泛泛来说，计算机可以根据你的特质、你掌握的知识或你拥有的物品来识别你。虹膜扫描仪和指纹读取器验证的是你的身体特征，即你`are`的东西。密码验证的是你`know`的秘密。进入房屋需要你`have`门钥匙。基于密钥的认证结合了其中两点：你必须`have`包含私钥的文件，并且你必须`know`该密钥的短语。诚然，私钥文件比物理钥匙更容易复制——只需复制文件——但它比
    8 字符的密码更难复制。这层额外的安全防护为防止账户被未经授权的使用提供了额外保护。


    然而，密钥比密码复杂得多。就像你不会把大门钥匙挂在门手上一样，你必须保护你的私钥。如果电脑丢失或被盗，该机器上的任何私钥都应被视为已丢失。虽然记住密码是可能的，但大多数人不会花费时间或精力去记住私钥中成千上万个字符。是的，你应该备份……但如果你的笔记本电脑被盗了，笔记本上的私钥无论如何都应视为破解。


    通过用户密钥设置身份验证真的值得麻烦吗？在近十年里，一个被称为“Hail Mary Cloud”的受损机器网络反复扫描互联网寻找 SSH 服务器。当云成员发现
    SSH 服务器时，它会通知网络中的其他机器。然后，该云会有条理地尝试可能的用户名和密码。网络上的一个主机尝试几次，然后是另一个，再是另一个。阻止单个 IP
    地址对于这些扫描器来说并不是有效的防御措施，因为每个地址在下一个攻击者接替之前只只会尝试几次密码。


    任何单次尝试猜中的概率都很低。但尝试是持续不断的。它们永无休止。最终，Hail Mary Cloud 将走运并侵入你的服务器。这可能是明天，也可能是明年，但它`will`发生。为了防止这种入侵，你可以使用数据包过滤来阻止对`SSH
    server`的公共访问，或者你可以消除密码认证。用户密钥允许你消除密码。


    ## SSH Agents


    用短语和私钥代替密码有一个明显的缺陷：输入密码是一件烦人的事。为什么要用一个更烦人的短语来替换一个很烦人的密码呢？它可能更安全，但你和你的用户真的会去麻烦吗？


    这就是 SSH agent 登场的地方。`SSH agent` 是一个在后台运行的小程序。当你启动桌面会话时，你输入短语来解密你的私钥。解密后的私钥被加载到
    `SSH agent` 中。agent 将密钥存储在内存中，永远不会存在磁盘上。agent 为 `SSH client` 处理所有的私钥操作。当 `SSH
    client` 需要用私钥解密某些内容时，它请求 agent 处理。当你结束当天的登录时，`SSH agent` 关闭。解密后的私钥从内存中消失。换句话说，有了
    `SSH agent`，你每个工作会话只需输入一次短语，无论你当天开启了多少个 `SSH sessions`。


    在典型的一天中，我登录工作站，激活我的 `SSH agent` 并输入一次短语。然后我向网络中各地的服务器和路由器打开无数个 `SSH sessions`，而无需再次输入短语或密码。当我结束当天的登录时，我的
    agent 关闭。agent 使用的内存会被擦除并返回给操作系统。我的私钥再次仅存在于加密文件中。


    Agent 并不保证安全。在你登录期间，任何可以读取你计算机内存的人都可以访问解密后的密钥。这包括 root 账户。如果你不信任桌面上的系统管理员，就不要使用
    `SSH agent`。如果你挂起笔记本电脑，解密后的私钥仍留在内存中。任何可以唤醒你的笔记本并登录的人都可以根据其权限使用该密钥。一个对偷掉你的笔记本换快钱的随机小偷可能不知道或不理解他拥有什么，但一个专门针对你和/或你雇主的小偷可能会检查是否有活跃的私钥。更常见的是，如果你在去午饭之前没有锁定桌面，同事可能会利用你未安全的终端。解决这些问题的最佳方法是在未活跃使用系统时清空或关闭你的
    agent。


    Agent 的安全在多用户机器上也是一个问题。系统上任何具有管理员或超级用户权限的人都可以访问运行主机上的任何 `SSH agent`。如果其他人在你的桌面上拥有
    root 或 `Administrator` 权限，他们就可以访问你的 agent 并伪装成你。使用 agent 将是不明智的。


    我们将在本章稍后讨论针对 PuTTY 和 OpenSSH 的 SSH agents。


    ## 创建 OpenSSH 用户密钥


    如果你有一个类 Unix 桌面，请使用 `ssh-keygen(1)` 生成密钥。不要使用任何参数，程序将引导你生成用户认证密钥。


    ```bash

    $ ssh-keygen

    ```


    生成公/私钥 rsa 密钥对。


    输入保存密钥的文件 (/home/mwlucas/.ssh/id_rsa):


    输入短语 (留空表示无短语):


    再次输入相同的短语:


    您的标识已保存到 /home/mwlucas/.ssh/id_rsa。


    您的公钥已保存到 /home/mwlucas/.ssh/id_rsa.pub。


    密钥指纹为：


    SHA256:LK+1dKbb/PtN8KjiXLDdZzOK1fivRkMZIn8YoOrmEvA mwlucas@zfs1


    密钥的随机艺术图像为：


    ```

    +---[RSA 2048]----+

    ```


    你会被询问新密钥应该存放在哪里。各种 OpenSSH 程序期望在默认位置找到密钥文件，因此请接受该建议。然后你会被要求输入两次短语，以验证你可以输入一次而不是一次。你的私钥将用此短语加密。正如几页前讨论过的，请始终使用短语。


    SSH 对主机和用户使用相同的密钥格式。当你生成用户密钥时，你会得到一个密钥指纹和一个随机艺术图像。这两者对于用户认证密钥来说都不特别有用。


    你会在 `$HOME/.ssh/id_rsa` 中找到你的新私钥，在 `$HOME/.ssh/id_rsa.pub` 中找到你的新公钥。立即在离线媒体（如闪存盘或
    CD-ROM）上备份你的新密钥对。如果你销毁了工作站，你需要恢复密钥对的能力。


    ### 密钥算法


    像主机密钥一样，用户密钥可以使用几种不同的加密算法。如果你不指定算法，OpenSSH 工具将使用推荐算法——目前是 2048 位 RSA。你可以使用 `-t`
    标志指定不同的算法。


    ```bash

    $ ssh-keygen -t ecdsa

    ```


    为什么要创建多个密钥？密码学家有一个发现加密算法弱点的令人遗憾的习惯。有一天，想象的事情会发生，有人发现一种广泛使用且广泛信任的算法存在缺陷。使用该算法的所有密钥将立即变得不可信。如果你有不同算法的用户密钥，你可以在
    SSH 服务器上禁用损坏的算法，并保持服务器访问权限。


    ## 创建 PuTTY 用户密钥


    使用 `puttygen` 程序创建用于 PuTTY 的认证密钥。PuTTY 安装程序包含 `puttygen`，你也可以从 PuTTY 网站单独下载。当你启动
    `puttygen` 时，你会看到一个类似图 7-1 的界面。


    ![](img/image3.jpg)


    图 7-1: PuTTYgen 启动

    '
- fmt: '

    Use `RSA`, `ECDSA`, or `ED25519` keys. `DSA` keys are on their way out, and `SSH-1`
    `RSA` keys are far obsolete. Verify that the number of bits is at least `2048`.
    More is not necessarily helpful. You might use fewer bits for user keys dedicated
    to ancient servers, such as `VAXs` or `Alphas`. Click `Generate`. The next `PuTTYgen`
    screen asks you to generate randomness by wiggling the mouse over the blank area.
    Once you generate sufficient entropy, `PuTTYgen` creates your key, as displayed
    in Figure 7-2.


    ![](image4.jpg)


    Figure 7-2: PuTTYgen Key and Passphrase


    You have three fields you can enter here. The first is the key comment. I recommend
    changing the comment to reflect the machine you generated the key on and the date
    you created it. Now enter your passphrase twice.


    Now click Save public key. You’ll get a standard Windows Save as dialog box asking
    you to choose a location to save the key. Save the file in a location that only
    you have permissions to access. You can use a folder under Documents, but make
    sure you go in later and set the permissions so that other users on your machine
    cannot view the file. I normally name these files after the machine they’re created
    on and the date. `Puttygen` won’t assign a file extension by default, so use a
    `.pub` extension.


    Now save the private key. Use the same file name for the public and private keys.
    `PuTTYgen` uses a `.ppk` extension for private keys, so they won’t overwrite each
    other.


    You now have a public key. Congratulations! But don’t exit `PuTTYgen` yet.


    The top of the screen shows the key in OpenSSH-friendly `authorized_keys` format.
    Copy that into a file, all on a single line. I usually name that file after the
    machine the key was generated on, the date, and add the string `authorized_keys`.


    ## Installing Public Keys


    No matter which client you use, you must install your public key on your server
    before you can login with it. Whenever you `SSH` into a host, the `OpenSSH` server
    checks the local file `$HOME/.ssh/authorized_keys`. This file contains public
    keys, one per (very long) line. The SSH server compares the public key offered
    by the client with the keys in the file. If the key matches, and the client can
    successfully exchange data with that key, then the client has demonstrated it
    has the corresponding private key. Access is granted. If there is no `authorized_keys`
    file, the server falls back to the next authentication method (usually passwords).


    If you are a user requesting access to a server that only accepts public key authentication,
    the sysadmin will ask you for your `authorized_keys` file. If this is your first
    time using public key authentication, this is not a security risk—remember, your
    public key file is public. Anyone can have it. It’s utterly useless without the
    corresponding private key.


    The most common type of user key is an `RSA` key. `OpenSSH` stores your client’s
    `RSA` public key in the file `$HOME/.ssh/id_rsa.pub`. `PuTTY`’s key generator
    makes you name your own key files, and you’ll have a few different key files.
    You want the file containing the `authorized_keys`-friendly version. If you followed
    my suggestion, the file name will contain `authorized_keys`. To simplify the examples,
    we’ll use the file name `id_rsa_authorized_keys.pub`. Substitute your `PuTTY`
    file as needed.


    To use your public key, you must copy the client’s public key file to the `authorized_keys`
    file in your account on the server. You could use the graphic interface’s copy
    and paste function, but that’s error-prone. Uploading the public key file via
    `SFTP` or `SCP` and then concatenating it onto `authorized_keys` is more reliable.
    Remember, each key must be on one and only one line in `authorized_keys`. More
    than one of my simple cut-and-paste attempts have turned to tears... copy the
    file. It’s better at it than you are.


    Here, I copy my client’s `id_rsa_authorized_keys.pub` to the server sloth using
    `scp(1)`.


    ```

    scp .ssh/id_rsa_authorized_keys.pub sloth:

    ```


    The server will still request a password to upload the key file; you’ve created
    the key, but it’s not yet installed.


    `PuTTY` users should use `WinSCP`’s friendly drag-and-drop file copy.


    Now log onto the server and append the contents of `id_rsa_authorized_keys.pub`
    to the `authorized_keys` file. If this is the first time you’ve installed a public
    key, you could copy your key file to `authorized_keys`. If you let yourself get
    into that habit, however, one day you’ll overwrite an existing `authorized_keys`
    and spend the next couple of hours kicking yourself for making such a simple mistake.


    ```

    cat id_rsa_authorized_keys.pub >> .ssh/authorized_keys

    ```


