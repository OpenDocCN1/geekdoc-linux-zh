    将加密算法想象成一种锁，而密钥就是特定的钥匙。锁有很多不同的类型：入户门、自行车、工厂等。每种锁都使用某种类型的钥匙——你的门钥匙形状可能无法插入任何车辆的点火锁。但即使是类型正确的钥匙，在错误的锁上也不起作用。你的正门钥匙可以打开你的正门，仅限你的正门。加密密钥的工作原理相似。


    # 算法类型


    加密算法分为两种：对称加密和非对称加密。


    ### 对称算法


    对称算法在加密和解密时使用同一个密钥。对称算法包括但不限于高级加密标准 (`AES`) 和 `ChaCha20`，以及较旧但现在已不再安全的算法，如 `3DES`
    和 `Blowfish`。孩子的替换密码就是对称算法。一旦你知道 `A` 等于一，以此此类推，你就可以加密和解密消息。对称算法（比简单替换更复杂）只要只有授权人员持有密钥，就可以非常快速且安全。但问题在于：获取了密钥的外外部人员可以读取你的消息，或将其替换为他自己的消息。你必须保护密钥。在互联网上不明文发送密钥就像站在操场上大喊：“A
    是一，B 是二。”任何听到密钥的人都可以读取你的私消息。


    ### 非对称算法


    非对称算法用于加密和解密使用不同的密钥。你用一个密钥加密消息，然后用另一个密钥解密。这之所以可行是因为密钥是非常大的数字，而大数字的相乘比找出如何除它们要容易得多。（如果你想了解细节，互联网上有很好的解释）。非对称加密仅随着能够处理极其复杂数学计算的计算机普及才变得流行，而且它比对称加密慢得多，计算开销大得多。两个独立的密钥创造了有趣的可能性。将一个密钥设为公开。把它送出去。向全世界广播。保持另一个密钥私密，并不惜一切地保护它。任何拥有公钥的人都可以加密只有知道私钥的人才能读取的消息。拥有私钥的人可以加密消息并发送到世界上。任何人都可以公钥解密该消息，但公钥可以解密消息这一事实确保了接收者消息发送者拥有私钥。这就是公钥加密的基础。公钥及其匹配的私钥被称为密钥对。再次，想象一下你正门上的锁。锁本身是公开的；任何人都可以碰它。钥匙是私密的。你必须两者都有才能进入你。（你可以通过研究
    Diffie-Hellman 密钥交换来了解更多。）


