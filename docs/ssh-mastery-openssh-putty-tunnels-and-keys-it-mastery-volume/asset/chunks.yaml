    At login, `sshd` checks for the shell script `$HOME/.ssh/rc`. If it exists, it
    gets run. If it doesn’t exist, `sshd` checks for a script at `/ssh/sshrc` and
    runs that. Either way, the script is run by the account being logged into. If
    you need to perform tasks every time a user logs in, consider this functionality.


    The script must be a valid shell script, complete with `#!/bin/sh` at the top
    of the file, and it must be executable. (Some Linux distributions execute this
    command even if it doesn’t meet these requirements.) The SSH daemon hands the
    script one argument, an X11 cookie. With modern X software, you almost certainly
    can ignore it.


    The `sshd_config` keyword `PermitUserRC` turns this script check on and off. While
    it defaults to `yes`, you can disable the script by setting it to `no`.


    Wait, wait, wait, wait...


    ## `authorized_keys` Restrictions


    While a user’s `authorized_keys` dictates the key pairs that can be used for authentication,
    you can also use it to limit the commands that a user logged in with that key
    may run. One account might have a key pair for interactive use and a second key
    pair for an automated task. Configuring requires understanding the `authorized_keys`
    file format.


    ### `Authorized_keys` Format


    A minimal `authorized_keys` entry has three parts: the key type, a few hundred
    alphanumeric characters representing the public key, and a comment field. Each
    entry goes on a single line, no matter how long it is. It will look something
    like this:


    ```

    ssh-rsa AAAAB3NzaC1yc2EAAAABJQAAA… wE2Ime8Rs/Q== moose-20160525

    ```


    This is an RSA key, as shown by `ssh-rsa` at the beginning of the entry. This
    public key begins with a `AAA` and ends with `8Rs/Q==`. Many but not all public-key
    entries end in the double equals sign. The comment at the end gives the host this
    key was created on and the date of creation.


    You can put additional keywords and instructions on how this key may be used at
    the beginning of the entry. The server obeys those instructions, within the limits
    of the user’s permissions. Find a complete list of `authorized_keys` keywords
    in the `sshd(5)` man page, but here are the most commonly used ones.


    ### `command="command"`


    Whenever someone logs in using this key, run the specified command. SSH ignores
    any command provided by the user in favor of the one dictated by `authorized_keys`.
    You might use this for automated processes, such as configuring a VPN (Chapter
    13) or running `rsync`.


    ```

    command="sudo ifconfig tun0 inet 192.0.2.2/30" ssh-rsa AAAAB3NzaC1yc2EAAAABJQAAA…

    ```


    One interesting feature is that SSH retains any command the client requested in
    the environment variable `$SSH_ORIGINAL_COMMAND`. You can have `authorized_keys`
    run a script that checks this environment variable and acts appropriately. (“The
    backup account just requested access to /bin/bash? Hello, sysadmin, we have a
    problem…”)


    ### `environment="NAME=value"`


    This set an environment variable when this key is used to log in. You can use
    any number of environment statements.


    ```

    environment="automated=1" ssh-rsa AAAAB3NzaC1yc2EAAAABJQAAA…

    ```


    By default, `sshd` does not permit setting environment variables. The sysadmin
    must set `PermitUserEnvironment` to `yes` in `sshd_config` for users to set environment
    variables.


    ### `from="ssh-pattern"`


    This key can only be used for authentication if the clients address or reverse
    DNS matches the given pattern. We discussed patterns in Chapter 2. I frequently
    use this to restrict automated processes. Even if an intruder steals a private
    user key, he cannot access the SSH server from any host other than the one I permit.


    ```

    from="198.51.100.0/29" ssh-rsa AAAAB3NzaC1yc2EAAAABJQAAA…

    ```


    Only hosts in the IP range `198.51.100.0` through `198.51.100.7` can use this
    key to log into the SSH server.


