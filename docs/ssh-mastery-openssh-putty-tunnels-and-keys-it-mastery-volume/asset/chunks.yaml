    Your server might need to behave differently depending on the source address or
    hostname of an incoming connection, or the username. An SSH client might need
    to use a different username for a particular group of hosts, or to activate X
    forwarding (Chapter 9) when used on the local network. The Match sshd_config keyword
    lets you establish special configurations for such situations.


    Follow each Match statement by a set of conditions that trigger the match, then
    by a series of configuration statements OpenSSH should apply to connections that
    meet all of those conditions. We’ll see several examples in the next sections.


    Before implementing a Match statement, configure OpenSSH for the most common setting.
    For example, if you are configuring sshd, you might want to deny X forwarding
    to all but select users. Configure sshd to deny X forwarding, then use a Match
    statement to check the username and permit X forwarding to matching users. While
    we haven’t covered X forwarding yet, denying it is a single entry in sshd_config.


    X11Forwarding no


    In all of the examples below, such an entry appears near the beginning of sshd_config
    as a default setting that we’ll selectively override.


    You cannot use Match statements to adjust all possible ssh_config and sshd_config
    keywords. Check the manual pages for the complete list of supported keywords.


    ### Matching Users and Groups


    The most common situation I encounter is when I want to enable an option for a
    particular user or group. The User or Group Match terms permit this.


    X11Forwarding no


    Match User mwlucas


    X11Forwarding yes


    I am always permitted to use X forwarding, as my awesome psychic powers eliminate
    all possible security risks.


    If all of my system administrators share these powers, or if I settle for exterminating
    sysadmins who empower intruders, I could Match the whole group containing my sysadmins.


    X11Forwarding no


    Match Group wheel


    X11Forwarding yes


    If you need multiple Match terms, separate them by commas.


    X11Forwarding no


    Match User mwlucas, jgballard


    X11Forwarding yes


    I know when to use X forwarding. My user claims he does, too. We’ll see.


    ### Matching Addresses or Hosts


    Perhaps you must permit X forwarding, but only from particular networks. You can
    match on IP addresses.


    X11Forwarding no


    Match Address 203.0.113.0/29, 198.51.100.0/24


    X11Forwarding yes


    If you set UseDNS to yes in sshd_config Match will accept hostnames, with the
    usual DNS security and availability caveats.


    X11Forwarding no


    Match Host *.mwl.io, *.michaelwlucas.com


    X11Forwarding yes


    Double-check that a DNS failure won’t lock you out of your DNS server and prevent
    you from fixing the problem.


    For ssh_config only, skip the word Match when using per-host configurations.


    X11Forwarding no


    Host avarice


    X11Forwarding yes


    This configuration statement in ssh_config predates the Match syntax.


    ### Multiple Match Conditions


    You can list multiple Match terms on a single line. Here, I permit a single user
    to use password authentication if they connect from a certain IP address.


    Match Address 192.0.2.8 User djm


    PasswordAuthentication yes


    The user djm can log in via password, but only from the host at 192.0.2.8.


    ### Placing Match Statements


    All configuration statements that follow a Match statement belong to that Match
    statement, until another Match statement appears or until the file ends. This
    means that Matches must appear at the end of the configuration file. Consider
    the following snippet of sshd_config.


    …


    X11Forwarding no


    PasswordAuthentication no


    …


    Match Group wheel


    X11Forwarding yes


    Match Address 192.0.2.0/29, 192.0.2.128/27


    PasswordAuthentication yes


    The keywords X11Forwarding and PasswordAuthentication are set to no. When a user
    in the group wheel logs in, sshd sets the option X11Forwarding to yes for that
    user. When a user logs in from an IP address in 192.0.2.0/29 or 192.0.2.128/27,
    the PasswordAuthentication option gets set to yes. If a user in the wheel group
    logs in from one of those addresses, he gets both options.


    We’ll demonstrate Match statements for both sshd(8) and ssh(1) throughout this
    book.


    Now let’s talk about the OpenSSH server.


    # Chapter 3: The OpenSSH Server


    The OpenSSH server sshd is highly configurable and lets you restrict who may connect
    to the server, what actions those users can take, and what actions it permits.
    Every modern Unix-like operating system comes with sshd installed as part of the
    base operating system.


    We’ll look at some basics of running sshd, and proceed to various global configuration
    options. More specific options get discussed in relevant chapters of this book.


    ## Is sshd Running?


    From a client, the simplest way to test if a server is running an accessible SSH
    daemon is to try to log into the server. While that’s great when everything works,
    a failure to connect means that either the client or server could be busted, or
    maybe you have a packet filter in the middle. SSH normally runs on TCP port 22\.
    Use netcat(1) to see if you can access the daemon.


    $ **nc -v devio.us 22**


    Connection to devio.us 22 port [tcp/ssh] succeeded!


    SSH-2.0-OpenSSH_7.0


    **^C**


    When you connect over raw TCP, sshd returns a banner giving the SSH protocol version,
    the SSH server software, and the software version. This host uses SSH protocol
    2, provided by OpenSSH version 7.0.


    If you don’t get something similar perhaps sshd isn’t running, or maybe you have
    a packet filter in the way.


    From the server, check and see if the sshd process is running.


    $ **ps ax | grep sshd**


    626 - Is 0:00.03 /usr/sbin/sshd


    31960 - Is 0:00.38 sshd: mwlucas [priv] (sshd)


    44387 - S 0:05.75 sshd: mwlucas@pts/0 (sshd)'
