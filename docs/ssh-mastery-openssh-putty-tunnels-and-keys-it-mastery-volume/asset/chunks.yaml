    it defaults to yes, you can disable the script by setting it to no.


    ## authorized_keys Restrictions


    While a user’s authorized_keys dictates the key pairs that can be used for authentication,
    you can also use it to limit the commands that a user logged in with that key
    may run. One account might have a key pair for interactive use and a second key
    pair for an automated task. Configuring requires understanding the authorized_keys
    file format.


    ### Authorized_keys Format


    A minimal authorized_keys entry has three parts: the key type, a few hundred alphanumeric
    characters representing the public key, and a comment field. Each entry goes on
    a single line, no matter how long it is. It will look something like this:


    ssh-rsa AAAAB3NzaC1yc2EAAAABJQAAA… wE2Ime8Rs/Q== moose-20160525


    This is an RSA key, as shown by ssh-rsa at the beginning of the entry. This public
    key begins with a AAA and ends with 8Rs/Q==. Many but not all public-key entries
    end in the double equals sign. The comment at the end gives the host this key
    was created on and the date of creation.


    You can put additional keywords and instructions on how this key may be used at
    the beginning of the entry. The server obeys those instructions, within the limits
    of the user’s permissions. Find a complete list of authorized_keys keywords in
    the sshd(5) man page, but here are the most commonly used ones.


    ### command="command"


    Whenever someone logs in using this key, run the specified command. SSH ignores
    any command provided by the user in favor of the one dictated by authorized_keys.
    You might use this for automated processes, such as configuring a VPN (Chapter
    13) or running rsync.


    command="sudo ifconfig tun0 inet 192.0.2.2/30" ssh-rsa AAAAB3NzaC1yc2EAAAABJQAAA…


    One interesting feature is that SSH retains any command the client requested in
    the environment variable $SSH_ORIGINAL_COMMAND. You can have authorized_keys run
    a script that checks this environment variable and acts appropriately. (“The backup
    account just requested access to /bin/bash? Hello, sysadmin, we have a problem…”)


    ### environment="NAME=value"


    This set an environment variable when this key is used to log in. You can use
    any number of environment statements.


    environment="automated=1" ssh-rsa AAAAB3NzaC1yc2EAAAABJQAAA…


    By default, sshd does not permit setting environment variables. The sysadmin must
    set PermitUserEnvironment to yes in sshd_config for users to set environment variables.


    ### from="ssh-pattern"


    This key can only be used for authentication if the clients address or reverse
    DNS matches the given pattern. We discussed patterns in Chapter 2\. I frequently
    use this to restrict automated processes. Even if an intruder steals a private
    user key, he cannot access the SSH server from any host other than the one I permit.


    from="198.51.100.0/29" ssh-rsa AAAAB3NzaC1yc2EAAAABJQAAA…


    Only hosts in the IP range 198.51.100.0 through 198.51.100.7 can use this key
    to log into the SSH server.


    You can only use host names in the pattern if UseDNS is set to yes. Remember that
    intruders can frequently forge their reverse DNS entries, so it’s most often best
    to disable DNS in sshd and stick with IP addresses.


    ### no-agent-forwarding


    This disables SSH agent forwarding (see Chapter 7) for this key.


    no-agent-forwarding ssh-rsa AAAAB3NzaC1yc2EAAAABJQAAA…


    ### no-x11-forwarding


    This (wait for it…) disables X forwarding (see Chapter 8).


    no-x11-forwarding ssh-rsa AAAAB3NzaC1yc2EAAAABJQAAA…


    ### no-pty


    Sessions that authenticate with this key will not be granted a pseudo-terminal.
    Many programs that run under automation do not need a terminal.


    no-pty ssh-rsa AAAAB3NzaC1yc2EAAAABJQAAA…


    ### no-user-rc


    This disables sshd’s login script checks, as discussed in “Running Commands at
    Login” at the beginning of this chapter.


    no-user-rc ssh-rsa AAAAB3NzaC1yc2EAAAABJQAAA…


    ### permitopen="host:port"


    The permitopen keyword restricts local port forwarding so that it can only attach
    to the given hostname or IP address and port on the local machine. If the server
    doesn’t allow local port forwarding, this has no effect.


    permitopen="localhost:25" ssh-rsa AAAAB3NzaC1yc2EAAAABJQAAA…


    This example allows port forwarding to connect to port 25 on 127.0.0.1, but nothing
    else.


    You can set permitopen to none to disallow all port forwarding.


    ### tunnel="n"


    Use a specific tunnel device number for SSH tunnels (see Chapter 13).


    tunnel="3" ssh-rsa AAAAB3NzaC1yc2EAAAABJQAAA…


    ### restrict


    By default, anything not denied is permitted. The restrict keyword inverts that,
    blocking everything unless you specifically allow it. You can use the keywords
    agent-forwarding, port-forwarding, pty, user-rc, and X11-forwarding to turn those
