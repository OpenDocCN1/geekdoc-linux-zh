    有时你可能想使用 OpenSSH 转发连接，但并不需要在 SSH 服务器上运行终端会话。使用 `-N` 标记告诉 `ssh` 不要在服务器上运行任何内容（包括终端），并使用
    `-f` 标记告诉 `ssh` 在客户端后台运行。在这里，我将一个本地转发会话在后台运行到服务器 pride 上。


    ```bash

    ssh -fNL 2222:localhost:22 pride &

    ```


    将此命令放在后台运行可以让你取回到原始的终端。当你没有 SSH 服务器的 shell 访问权限，但允许进行身份验证并创建隧道时，后台转发是非常有用的。（这是创建基于
    SSH 的 VPN 的方法之一，但第 13 章讨论了更好的方法。）


    ## 选择 IP 地址


    在进行端口转发时，你必须选择你希望转发端口监听的 IP 地址，以及你想要将转发端口绑定到哪个 IP 地址。选择 IP 地址 有助于控制谁可以连接到转发端口。


    最常见的选择是在隧道的一端或两端绑定到本地地址 `127.0.0.1`。每台具有功能健全 TCP/IP 栈的机器都使用 `127.0.0.1` 作为自身的地址，且只有本地机器可以连接到它。如果我将工作站本地地址的
    `80` 端口转发到服务器本地地址的 `80` 端口，那么其他主机都无法通过我的隧道连接到该转发端口。服务器上的大多数守护进程也会监听本地地址以及一个或多个面向网络的
    IP 地址，因此使用本地地址是转发端口的一种合乎合理的方法。


    如果你希望你的客户端接受来自其他机器的请求，并使用本地端口转发将它们发送到 SSH 服务器，请将端口转发绑定到客户端面向网络的 IP 地址。如果我将我机器面向网络的
    IP 地址的 `80` 端口转发到 SSH 服务器的 `80` 端口，那么该转发对于所有能够连接到我客户端端口 `80` 的主机都是可用的。使用 PuTTY
    时，必须选择 `Local ports accept connections from other hosts`。使用 OpenSSH 时，必须 `ssh_config`
    中设置 `GatewayPorts` 关键字（参见本章稍后介绍的“Gateway Ports”）。


    如果你希望 SSH 服务器通过远程端口转发将其他机器的请求转发到你的客户端，请将端口转发绑定到服务器面向网络的 IP 地址。你必须像本章稍后介绍的“Gateway
    Ports”所示调整 `sshd_config` 中的 `GatewayPorts`。例如，我们使用远程端口转发将服务器上的一个端口连接到客户端的 `sshd`。你可以将此远程转发绑定到服务器的公网
    IP 地址，这样互联网上的任何主机即使在防火墙后面也可以连接到客户端的 SSH 服务。记住，虽然创建一个进入私有网络的后向通道可能有用，但将该后向通道开放给整个互联网是非常失礼的。


    如果你希望 SSH 客户端通过动态端口转发作为其他机器的 SOCKS 代理，请将端口转发绑定到客户端面向网络的 IP 地址。


    始终记住，运行任何现代操作系统的主机都可以有多个 IP 地址。对于你来说，选择特定的地址可能比允许所有面向网络的地址更有意义。


    假设我的工作站 IP 为 `192.0.2.18`，并且处于一个包含许多其他客户端的网络中。我们必须访问一个在传输过程中不加密数据的关键 Web 应用程序。可以通过本地端口转发提供从我的工作站到服务器的加密隧道。如果我只想为我的桌面电脑提供这个隧道，我会将隧道的客户端端绑定到
    `127.0.0.1`。如果我想为我网络上的所有人都提供这个隧道，我会将客户端端绑定到 `192.0.2.18`。


    或者我可能负责运行公司的内容过滤 Web 代理，并且正尝试调试某个网站通过代理无法正常工作的问题。我想看看从我的网络外部看这个网站长什么样。我可以设置一个私有的
    SOCKS 代理来绕过组织的代理，让我从外部服务器进行浏览。设置一个任何人都可以使用的未授权代理服务器是寻找新工作的绝佳方法，因此我绝对确保该隧道的本地端使用本地地址。


    你可以使用主机名代替实际 IP 地址，只要该主机名在 DNS 中显示正确。你也可以使用单词 `localhost` 代替 `127.0.0.1`。


    ## 限制和要求端口转发


    OpenSSH 服务器控制用户可以执行何种类型的端口转发。你可以拒绝端口转发、允许端口转发但仅允许绑定到本地地址，或者仅允许特定的地址和端口。


    然而，在服务器端实现这些限制的效果并不如人们希望的那样有效。具有 shell 访问权限的用户可以轻松地安装自己的转发器。要正确禁用 shell 用户的转发，需要控制哪些二进制文件是可执行、禁用
    `Perl` 或 `Python` 等解释器，并防止用户安装更多程序。在大多数情况下，除非你非常有决心，否则具有 shell 访问权限的用户都能找到转发端口的方法。尽管如此，禁用或限制端口转发将给你的用户一个明确的提示，告诉他们不应该转发端口。


    ### 禁止端口转发


    `sshd_config` 关键字 `AllowTcpForwarding` 告诉 `sshd` 是否应该允许端口转发。默认是 `yes`，允许端口转发。如果设置为
    `no`，则完全禁止端口转发。


    要仅允许本地端口转发，将 `AllowTcpForwarding` 设置为 `local`。同样，`remote` 仅允许远程端口转发。


    ### Gateway Ports


    `GatewayPorts` 关键字控制客户端是否可以将转发的端口绑定到本地以外的任何地址。该关键字出现在 `ssh_config` 和 `sshd_config`
    中。`ssh_config` 选项控制本地端口转发，而 `sshd_config` 选项控制远程端口转发。


    `GatewayPorts` 默认 `no`，这意味着客户端无法将端口转发绑定到任何面向网络的 IP 地址。这在 `ssh_config` 和 `sshd_config`
    中是相同的。


    在 `ssh_config` 中使用时，将 `GatewayPorts` 设置为 `yes` 允许 `ssh` 请求监听客户端上的 IP。


    在服务器端，在 `sshd_config` 中将 `GatewayPorts` 设置为 `yes` 意味着无论客户端请求什么，远程转发都会监听所有地址。我不知道你为什么要对所有端口转发开启全局网络访问，但这确实是一个选项。


    服务器支持 `sshd_config` 中的另一个 `GatewayPorts` 选项 `clientspecified`，它告诉 `sshd` 让客户端绑定到他们请求的任何内容。基于转发允许客户端细粒度控制通常是最佳选择。


    ### 允许特定的端口和地址


    如果你需要比 `GatewayPorts` 更具体的限制，可以使用 `sshd_config` 中的 `PermitOpen` 关键字来限制可以转发的 TCP
    端口和地址。`PermitOpen` 接受空格分隔的端口列表，格式为 `hostname:port`。例如，在这里我允许将服务器的 `25` 和 `110`
    端口转发回客户端，且仅从本地地址开始。


    ```

    PermitOpen localhost:25 localhost:110

    ```


    任何未允许的都是禁止的。SSH 会话会正常打开，但当你尝试通过禁止的转发端口传输流量时，你的 SSH 客户端会显示错误。


    ### 要求端口转发


    端口转发可能是此连接存在的唯一原因。如果设置端口转发失败，你甚至不希望建立连接。`ssh_config` 关键字 `ExitOnForwardFailure`
    告诉 `ssh` 在尝试转发端口失败时做什么。默认值 `no` 意味着即使无法建立端口转发也应该建立连接。通过将 `ExitOnForwardFailure`
    设置为 `yes`，你告诉 SSH 在端口转发不起时立即断开连接。


