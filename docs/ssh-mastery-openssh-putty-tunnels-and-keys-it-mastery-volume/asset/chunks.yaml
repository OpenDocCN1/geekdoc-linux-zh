    The server’s hostname.`tun0` looks really similar.


    `192.168.0.1` `192.168.0.2` netmask `255.255.255.252`


    `!route add 172.16.0.1/24 192.168.0.2 > /dev/null 2>&1`


    The IP addresses are reversed. When the tunnel comes up, the network behind the
    client gets routed across it.


    SSH from the client to the server. The tunnel should come up and configure itself.


    ## FreeBSD


    FreeBSD doesn’t incorporate OpenSSH VPNs out-of-the-box, but they’re really easy
    to set up. The easiest method is via calling a shell script when the tunnel comes
    up. You can avoid that need by being tricky and clever, but tricky and clever
    has an uncanny ability to bite you during an outage. Additionally, I’ll use the
    scripts to illustrate a couple OpenSSH features.


    First, enable packet forwarding on both the client and the server. Use the `sysctl
    net.inet.ip.forwarding` as in OpenBSD, or set `GATEWAY_ENABLE=YES` in `/etc/rc.conf`.


    ```bash

    sysrc gateway_enable=YES

    ```


    Now let’s get the scripts ready. The server will use the script `/usr/local/scripts/tunnelserver.sh`.
    I’ll lock the client’s entry in `authorized_keys` to permit it to run only that
    script.


    `restrict,tunnel="0",command="/usr/local/scripts/tunnelserver.sh" ssh-rsa AAAAB3Nz…`


    Whenever this key is used to log in, `sshd` runs the configured script. Let’s
    look at the server-side script.


    ```bash

    #!/bin/sh


    /sbin/ifconfig tun0 192.168.0.1/30 192.168.0.2

    /sbin/route add -net 172.16.0.0/24 192.168.0.2

    ```


    The script adds IP addresses to the tunnel interface and configures a route to
    the remote network.


    We’ll use a similar script on the client, `/usr/local/scripts/tunnelclient.sh`,
    to add the IP addresses and routes to this side of the tunnel.


    ```bash

    #!/bin/sh


    /sbin/ifconfig tun0 192.168.0.2/30 192.168.0.1

    /sbin/route add -net 172.17.0.0/24 192.168.0.1

    ```


    SSH-ing into the server activates the tunnel and configures the server side of
    it. You’ll need to run the client script to configure the client side. Fortunately,
    `ssh(1)` has the `LocalCommand` keyword to automatically run a command when you
    connect to a host.


    ```text

    Host gluttony

    Tunnel point-to-point

    TunnelDevice 0:0

    IdentityFile /root/.ssh/tunnelkey

    IdentitiesOnly yes

    PermitLocalCommand yes

    LocalCommand /usr/local/scripts/tunnelclient.sh

    ```


    Here I use `PermitLocalCommand` to say “yes, you may run a command locally when
    you connect,” and `LocalCommand` to define the command.


    When you SSH from the client to the server, the tunnel should come up automatically.


    ## CentOS and Debian


    Configure SSH VPNs on these two popular Linux distributions in a very similar
    way to FreeBSD. Both distributions have obsoleted standard Unix tools like `ifconfig(8)`
    and `route(8)`, however, so we must use the Linux-specific `ip(8)` instead.


    Create your tunnel key, enable SSH tunneling, and permit root logins using keys,
    as discussed in “Common Concepts.” Then the client needs a `/root/.ssh/config`
    precisely like that used for FreeBSD.


    ```text

    Host gluttony

    Tunnel point-to-point

    TunnelDevice 0:0

    IdentityFile /root/.ssh/tunnelkey

    IdentitiesOnly yes

    PermitLocalCommand yes

    LocalCommand /usr/local/scripts/tunnelclient.sh

    ```


    Enable IP forwarding on Linux setting the `sysctl net.ipv4.ip_forward` to `1`
    in `/etc/sysctl.conf`. Debian already has this entry, commented-out.


    Lock down the server’s `/root/.ssh/authorized_keys` so that this key can only
    open the tunnel device.


    `restrict,tunnel="0",command="/usr/local/scripts/tunnelserver.sh" ssh-rsa AAAAB3Nz…`


    Now all you need are the Linux scripts. Here’s a `/usr/local/scripts/tunnelserver.sh`:


    ```bash

    #!/bin/sh


    ip addr add 192.168.0.1/30 dev tun0

    ip link set dev tun0 up

    ip route add 172.16.0.0/24 via 192.168.0.2 dev tun0

    ```


    And here’s a client script.


    ```bash

    #!/bin/sh


    ip addr add 192.168.0.2/30 dev tun0

    ip link set dev tun0 up

    ip route add 172.17.0/24 via 192.168.0.2 dev tun0

    ```


    Now run `ssh -f gluttony` from your client, and your tunnel will come up.


    With these three examples, you should be able to get an SSH VPN running on any
    Unix-like operating system. Remember that an SSH VPN is not a wonderful solution,
    though. Before you have trouble or experience congestion, investigate real VPN
    software like OpenVPN.


