    每个证书都有一个 `certificate identity`（证书身份），这是一个用于说明该密钥用途的文本字符串。我根据主机名或用户名来分配身份，但如果你的组织对该身份有其他需求，请随意使用。你可能决定将其用于库存标签、人员
    ID 号或任何其他需要。在我的示例中，主机证书我使用 `host_` 加上 `hostname`，用户证书则我使用 `user_` 加上 `username`。


    每当用户使用证书进行身份验证时，日志消息都会包含证书身份。有些人利用证书身份让所有人以 root 身份登录，但仍然保留用户的可追溯性。


    ### 证书存档


    重新生成证书只需要一条命令。你可以自动化工具在整个网络中自动更新和分发证书及密钥。随着人们发现证书是多么有用，你拥有的证书数量将会倍增。请确保你的 `CA`
    保留每个证书及其相应公钥的副本。


    如果你发现某个私钥已泄露，你需要撤销该密钥的证书。手头有副本时，撤销证书要容易得多。当我创建证书时，我会创建一个证书及其对应公钥的副本，两者开头都会加上 ISO
    8601 格式的日期（数字年月-日）。这便于查找特定日期的证书。


    当你创建一个新的 `CA` 密钥并废弃旧密钥时，可以丢弃使用该密钥创建的证书。


    ### 设置过期日期


    过期日期使用标准的 Unix 相对日期格式分配。你不需要指定具体的结束日期，而是指定你希望证书在未来多久过期。


    过期日期以加号开头，后接你希望的未来时长。使用 `w` 表示周，`d` 表示天，`h` 表示小时，`m` 表示分钟，`s` 表示秒。要让一个密钥在现在 56
    周、5 天、12 小时和 13 秒后过期，请使用 `+56w5d12h13s`。


    ## 主机证书


    OpenSSH 信任由受认可的证书颁发机构签名的服务器公钥。这需要创建证书并将这些证书安装在服务器上。


    ### 创建主机证书


    使用你的证书颁发机构对服务器的公主机密钥签名。如果你已经有一个存储每个服务器公钥文件副本的系统，请考虑将你的证书颁发机构放在该主机上，或者将需要这些文件的功能移动到你的
    `CA` 服务器上。


    使用 `ssh-keygen(8)` 签名密钥。是的，有一个 `ssh-keysign(8)` 命令，但它是用于用 SSH 替换 `rsh(1)` 的且默认禁用。使用
    `-s` 标记提供你的 `CA` 密钥文件名。`-I` 标记定义证书身份。添加 `-h` 声明主机密钥证书。`-n` 指定该证书适用于的主机。（你可以使用多个主机名，用逗号分隔。）使用
    `-V` 提供过期日期，然后提供你想要创建证书的密钥文件路径。


    在这里我使用我的 `CA` 密钥 `host-mwlca-key` 为主机 `sloth` 创建密钥证书。它在五六周五天后过期。我为当前目录下的每个公钥文件签名。（我必须提供
    `CA` 密钥的完整路径，但为了清晰，这里缩短了路径。）


    ```

    ssh-keygen -s host-mwlca-key -I host_sloth -h -n sloth.mwl.io -V +56w5d ssh_host_*pub

    ```


    我将四个公钥复制到此主机，因此每个公钥都获得了一个证书。每个证书以其公钥文件命名，在结尾的 `.pub` 之前插入 `-cert`。`ssh_host_rsa_key.pub`
    的证书是 `ssh_host_rsa_key-cert.pub`，`ssh_host_ecdsa_key.pub` 得到 `ssh_host_ecdsa-keycert.pub`，依此类推。


    将所有这些证书复制到 SSH 服务器的 `/etc/ssh` 。


    ### 安装主机证书


    一旦在服务器上安装了证书，在 `sshd_config` 中通过 `HostCertificate` 关键字进行配置。由于我很容易混淆，我将 `HostCertificate`
    关键字放在相关的 `HostKey` 关键字旁边。


    ```

    HostKey /etc/ssh/ssh_host_rsa_key

    HostCertificate /etc/ssh/ssh_host_rsa_key-cert.pub


    …


    HostKey /etc/ssh/ssh_host_ed25519_key

    HostCertificate /etc/ssh/ssh_host_ed25519_key-cert.pub

    ```


    重启 `sshd`。你现在准备好使用主机证书了！


    ### 测试主机证书


    一旦你在 `sshd(8)` 中配置了证书并设置了客户端的 `/etc/ssh/ssh_known_hosts`，就可以尝试基于证书的主机密钥验证了。


    将你的 `$HOME/.ssh/known_hosts` 文件移走，或者如果你真的、非常有信心，就删除它。现在 SSH 连接到服务器。你应该收到登录提示，而不会被提示验证主机密钥。


    如果主机证书工作不正常，为你的 `ssh` 命令行添加一个或两个 `-v`。客户端看到证书了吗？如果没有，在调试模式下运行 `sshd` 查看它是否正在加载证书，如果没有，原因是什么。`ssh`
    是否看到了证书但不识别它？如果是这样，说明你的 `ssh_known_hosts` 条目写错了。


    ### 撤销证书


    证书很好，除非有人黑入你的服务器并拿到了签名密钥对。盗贼可以使用该签名密钥伪装成受攻击的主机。这糟。幸运的是，你可以使用 `ssh_config` 中的 `RevokedHostKeys`
    关键字告诉客户端不要信任某个公钥。


    ```

    RevokedHostKeys /etc/ssh/revoked-hosts

    ```


    撤销密钥文件包含公钥列表，每行一个。客户端不会接受这些公钥，即使它们带有相应的证书。


    你的企业需要更新客户端撤销密钥的能力，并必须对其进行测试。虽然实时更新最好，但有登录脚本也比没有好。


    ### 查看证书


    你可以使用 `ssh-keygen -L` 查看证书内容。使用 `-f` 提供证书文件。


    ```

    ssh-keygen -Lf ssh_host_ed25519_key-cert.pub

    ```


    `ssh_host_ed25519_key-cert.pub`:


    ```

    Type: ssh-ed25519-cert-v01@openssh.com host certificate

    Public key: ED25519-CERT SHA256:nNtyIQidY3MXAEfpWZ0zkXKQFnCoQheCRIldc4EB8

    Signing CA: RSA SHA256:ZQHNMc2TmWlnygGy9+UoFK92RdguzNi+cX4gA14

    Key ID: "sloth"

    Serial: 0

    Valid: from 2017-12-04T11:52:00 to 2017-12-25T11:53:17

    Principals:

    sloth.mwl.io

    Critical Options: (none)

    Extensions: (none)

    ```


