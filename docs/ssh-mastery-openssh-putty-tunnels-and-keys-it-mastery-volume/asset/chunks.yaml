    certificates. You can do this with the `-O` flag to `ssh-keygen`. The `-O` flag
    has a whole list of possible restrictions identical to those for `authorized_keys`
    in Chapter 12. These options include `no-agent-forwarding`, `no-port-forwarding`,
    `no-pty`, `no-user-rc`, and `no-x11-forwarding`. All of these `no-` restrictions
