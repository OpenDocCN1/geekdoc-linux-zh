    `wrath.mwl.io` `ecdsa-sha2-nistp256` `AAAAAE2VjZHNhLXNoYTItbm…`


    每行包含机器的主机名（`wrath.mwl.io`）、主机密钥类型（`ecdsa-sha2-nistp256`）以及公钥本身。


    ### 密钥缓存


    你希望如何更新密钥缓存？在某些环境中，用户必须手动验证主机密钥，然后手动将它们添加到密钥缓存中。在其他环境中，自动将新密钥添加到缓存中是可以接受的。最常见的情况下，用户希望
    `ssh` 询问他们应该怎么做。`ssh_config` 中的 `StrictHostKeyChecking` 选项告诉 `ssh` 如何处理新的主机密钥。


    如果你希望 `ssh` 拒绝连接到任何在 `known_hosts` 中没有记录的主机，请将 `StrictHostKeyChecking` 设置为 `yes`。客户端连接的唯一方法是将主机密钥添加到
    `known_hosts`，这通常来自系统管理员提供的中央仓库。这在主机密钥自动分发的环境中最为合理。


    如果你处于另一个极端，无论主机密钥多么重要，你永远都不会验证它，那么你不如将 `StrictHostKeyChecking` 设置为 `accept-new`。这告诉
    `ssh` 每获取到一个新密钥就盲目地更新 `known_hosts`。这等同于从不锁门你的家、汽车、办公室和银行金库——这可能感觉很轻松很自由，但迟早会有人对你的个人物品进行肆意侵犯。


    默认设置 `ask` 告诉 `ssh` 显示任何未知的密钥并询问用户该怎么做。你可以验证密钥、接受它并让 `ssh` 将其添加到 `known_hosts`，或者拒绝该主机密钥。


    选择最适合你环境的选项。你的笔记本电脑可能与由 NSA 或犯罪集团运行的服务器有不同的需求，而所有这些需求都与你测试实验室中的编排系统不同。


    ### 缓存安全：known_hosts 的哈希处理


    `known_hosts` 文件对于闯入你桌面的入侵者来说非常有用；它是一份方便的、目标 SSH 服务器列表。由于你的 SSH 服务器可能共享同一个系统管理员，渗透你桌面的技术可能适用于其中任何一个服务器。此外，系统管理员和其他用户可以查看
    `known_hosts` 的内容。防止窥探的最佳方法是更改 `known_hosts`，使其不再包含主机名列表。通过对主机名进行哈希处理来实现，就像 `/etc/passwd`
    处理密码那样。


    如果你将主机名替换为哈希值，任何人都无法从文件中读取主机名，也无法反向计算出主机名。然而，当你连接到主机时，`ssh` 可以轻松地计算服务器主机名的哈希，并在
    `known_hosts` 中查找该哈希。


    哈希过的 `known_hosts` 条目看起来像这样。


    ```

    |1|PBM07JCRBjfg8qOz1BokTtCDly0=|DVXu0IFq/dC4GMfbEbfVkhptVjQ= ecdsa-sha2-nistp256
    AAAAE2VjZ

    ```


    如果你检查该条目，你会看到下方有密钥算法和主机密钥指纹。


    要让 `ssh` 自动对添加到 `known_hosts` 的新主机密钥进行哈希处理，请使用 `ssh_config` 关键字 `HashKnownHosts`。


    ```

    HashKnownHosts yes

    ```


    然而，这不会哈希已有的条目。使用 `ssh-keygen(1)` 的 `-H` 标志对你现有的 `known_hosts` 进行哈希。


    ```

    $ ssh-keygen -H

    /home/mwlucas/.ssh/known_hosts updated.

    原始内容保留为 /home/mwlucas/.ssh/known_hosts.old

    WARNING: /home/mwlucas/.ssh/known_hosts.old 包含未哈希条目

    删除此文件以确保主机名的隐私

    ```


    哈希你的 `known_hosts` 将现有缓存复制到 `known_hosts.old`，然后对 `known_hosts` 内部的所有内容进行哈希。验证
    `ssh` 是否仍能连接到你所有常用的主机。一旦你确认密钥缓存仍然可用，请删除未哈希的 `known_hosts.old`。


    要在哈希过的 `known_hosts` 文件中查找单个主机条目，请使用 `ssh-keygen -F` 和目标主机名。


    ```

    $ ssh-keygen -F avarice.mwl.io

    # 找到主机 avarice.mwl.io: 第 17 行

    |1|5hcRwDHWxwxCWrFTngG4jT4OhJ0=|TyJXB6z+oEJXSP5MzakulFWgPDI= ecdsa-sha2-nistp256…

    ```


    你现在知道该条目位于文件的第 17 行，可以轻松地复制它。


    要移除哈希过的主机名，请使用 `ssh-keygen -R`。


    ```

    $ ssh-keygen -R avarice.mwl.io

    # 找到主机 avarice.mwl.io: 第 17 行

    /home/mwlucas/.ssh/known_hosts updated.

    原始内容保留为 /home/mwlucas/.ssh/known_hosts.old

    ```


    如果你没有删除未哈希的 `known_hosts.old`，那么，它现在已经了。


    当从中央系统分发 `known_hosts` 时（第 11 章），没有理由不提供哈希版本。


    ### PuTTY 客户端


    PuTTY 是一种 SSH、telnet 和串口客户端，也是适用于 Windows 和类 Unix 系统的终端模拟器。你可以在 `https://www.chiark.greenend.org.uk/~sgtatham/putty/latest.html`
    获取，或者在网上搜索“putty SSH”直接到达那里。虽然它不是由 OpenBSD 团队的专业偏执狂编写的，但 PuTTY 免费提供的源代码经过了多次审核。PuTTY
    可能是部署最广泛的 Windows SSH 软件。


    PuTTY 下载页面提供了多种选择。我推荐包含 PuTTY 及其所有相关程序的完整安装程序。你不需要所有内容，但它比单独下载各种实用程序要更方便快速。PuTTY
    并不真正需要安装程序；如果你喜欢，可以下载单独的 `PuTTY.exe`。安装程序确实会在开始菜单中创建快捷方式，向操作系统注册程序，并处理所有其他 Windows
    细节。


    PuTTY 可以在命令行中运行。其参数和命令行标志与 OpenSSH 非常相似。不过，如果你正在运行 Windows，你可能对作为图形界面的 PuTTY 感感兴趣。虽然
    PuTTY 可以在命令行中运行，但你应该知道命令行也是一种选项。


    如果你想冒险一下，可以下载 PuTTY 开发快照版。这包含了最新的补丁和功能，但也可能包含新的 Bug。


    启动 PuTTY，你会看到像 5-1 这样的界面。


    (image1.jpg)


    图 5-1：PuTTY 启动界面


    在右侧你可以配置到不同服务器的连接。我们只有一个连接，`Default Settings`。它不会连接任何内容，但你会使用它来设置 PuTTY 默认值。你可以通过点击左侧的
    `Session` 返回此界面。


    在左侧，你可以配置 PuTTY 如何呈现以及它如何处理支持的协议。PuTTY 支持多种协议。如果你需要一个灵活的通用终端模拟器，PuTTY 可能你的需求。然而，我们将只介绍
    SSH。注意底部的第二个选项 `SSH`。点击那里，或展开那个小的“+”号，查看并编辑 PuTTY 执行 SSH 的细节。


    如果你选择左侧的某项，右侧将显示所选选项的详情。选择 `SSH`，右侧将显示一些基础协议选项，例如协议版本和共享 SSH 连接（见本章后的“连接多路用”）。


    ### 设置 PuTTY 默认值


    你新安装的 PuTTY 只列出一个连接，`Default Settings`。你创建的每个新连接都从复制 `Default Settings` 开始。点击
    `Default Settings` 连接并点击 `Load`。你就可以编辑并保存 `Default Settings` 连接。


    首先设置默认用户名。我在工作系统上的账户都有相同的用户名。只有当是外部系统上的账户时，我的用户名才会变化。我可以在 PuTTY 中设置默认用户名，并将其预配置为最常用的设置。在左侧，选择
    `Connection`。在 `auto-login username` 下，我输入我的标准用户名。


    现在回到 `Session` 面板。选择 `Default Settings` 并点击 `Save`。你更新了默认连接。重复此过程对你的默认值进行进一步更改。


    ### 使用 PuTTY 启动 SSH 会话


