- fmt: '

    Sometimes you want to use OpenSSH to forward a connection, but you don’t need
    a terminal session on the SSH server. Use the `-N` flag to tell `ssh` to not run
    anything, including a terminal, on the server, and the `-f` flag to tell `ssh`
    to go into the background on the client. Here I background a local forwarding
    session to the server pride.


    ```bash

    ssh -fNL 2222:localhost:22 pride &

    ```


    Backgrounding this command gives you your original terminal back. Backgrounded
    forwarding is useful when you do not have shell access on the SSH server, but
    you are allowed to authenticate yourself and create a tunnel. (This is one way
    to create an SSH-based VPN, but Chapter 13 discusses better ways.)


    ## Choosing IP Addresses


    When port forwarding, you must choose the IP address you want the forwarded port
    to listen on, and the IP you want to attach the forwarded port to. Choosing the
    IP helps control who may connect to the forwarded port.


    The most common choice is to bind to the localhost address, `127.0.0.1`, on either
    or both ends of the tunnel. Every machine with a functional TCP/IP stack uses
    `127.0.0.1` as the address for itself, and only the local machine can connect
    to it. If I forward port `80` on my workstation’s localhost address to port `80`
    on the server’s localhost address, no other hosts can connect to that forwarded
    port over my tunnel. Most daemons on a server listen to the localhost address
    as well as one or more network-facing IP addresses, so using the localhost address
    is a reasonable way to forward ports.


    If you want your client to accept requests from other machines and use local port
    forwarding to send them to the SSH server, attach the port forwarding to the client’s
    network-facing IP address. If I forward port `80` on my machine’s network-facing
    IP address to port `80` on the SSH server, this forwarding is available to all
    hosts that can connect to my client’s port `80`. With PuTTY, you must select `Local
    ports accept connections from other hosts`. With OpenSSH, you must have a `GatewayPorts`
    keyword set in `ssh_config` (see “Gateway Ports” later this chapter.)


    If you want the SSH server to forward requests from other machines to your client
    using remote port forwarding, attach the port forwarding to the server’s network-facing
    IP address. You must adjust `GatewayPorts` in `sshd_config` as shown in “Gateway
    Ports” later this chapter. For example, we used remote report forwarding to connect
    a port on our server to the client’s `sshd`. You could attach this remote forwarding
    to the server’s public facing IP address, so that any host on the Internet could
    connect to the client’s SSH service even though it’s behind a firewall. Remember,
    while creating a back channel into a private network might be useful, opening
    that back channel to the entire Internet is downright gauche.


    If you want an SSH client to act as a SOCKS proxy for other machines via dynamic
    port forwarding, attach the port forwarding to the client’s network-facing IP
    address.


    Always remember that a host running any modern OS can have multiple IP addresses.
    It might make sense for you to pick a particular address rather than allowing
    all network-facing addresses.


    Suppose my workstation has an IP of `192.0.2.18` and is on a network with a whole
    bunch of other clients. We have to access a critical web-based application that
    doesn’t encrypt data in transit. I can provide an encrypted tunnel from my workstation
    to the server via local port forwarding. If I wanted to provide this tunnel to
    my desktop alone, I would attach the client’s end of the tunnel to `127.0.0.1`.
    If I wanted to offer this tunnel to everyone on my network, I would attach the
    client end to `192.0.2.18`.


    Or maybe I’m responsible for running the company’s content-filtering web proxy
    and I’m trying to debug a problem where a certain website doesn’t function through
    the proxy. I want to see what this website looks like from outside my network.
    I could set up a private SOCKS proxy to bypass the organization’s proxy, letting
    me browse from the outside server instead. Setting up an unauthorized proxy server
    that anyone can use is a great way to need a new job, so I make absolutely sure
    that the local end of that tunnel uses the localhost address.


    You can use a hostname instead of the actual IP address, provided that the hostname
    appears correctly in the DNS. You can also use the word `localhost` instead of
    `127.0.0.1`.


    ## Restricting and Requiring Port Forwarding


    The OpenSSH server controls what types of port forwarding users can perform. You
    can either deny port forwarding, permit port forwarding but allow binding only
    to the localhost address, or permit only specific addresses and ports.


    Implementing these blocks at the server level isn’t as effective as one might
    hope, though. A user who has shell access can easily install their own forwarders.
    Properly disabling forwarding for shell users requires controlling which binaries
    are executable, disabling interpreters like `Perl` or `Python`, and preventing
    users from installing further programs. For the most part, unless you’re really
    dedicated, users with shell access can figure out ways to forward ports. Still,
    disabling or restricting port forwarding will give your users a really solid hint
    that they shouldn’t be forwarding ports.


    ### Block Port Forwarding


    The `sshd_config` keyword `AllowTcpForwarding` tells `sshd` whether it should
    permit port forwarding. The default is `yes`, allowing port forwarding. If set
    to `no`, port forwarding is completely disallowed.


    To permit only local port forwarding, set `AllowTcpForwarding` to `local`. Similarly,
    `remote` permits only remote port forwarding.


    ### Gateway Ports


    The `GatewayPorts` keyword controls whether a client can bind a remote forwarded
    port to any IP address other than localhost. This keyword appears in both `ssh_config`
    and `sshd_config`. The `ssh_config` option controls local port forwarding, while
    the `sshd_config` option controls remote port forwarding.


    `GatewayPorts` is set to `no` by default, meaning that clients cannot connect
    any port forwarding to any network-facing IP address. This is identical in both
    `ssh_config` and `sshd_config`.


    When used in `ssh_config`, setting `GatewayPorts` to `yes` allows `ssh` to request
    to listen to any IP on the client.


    On the server side, setting `GatewayPorts` to `yes` in `sshd_config` means that
    no matter what the client requests, remote forwarding always listens to all addresses
    on the host. I have no idea why you’d enable global network access on all port
    forwardings, but it’s an option.


    The server supports one additional `GatewayPorts` option in `sshd_config`, `clientspecified`,
    which tells `sshd` to let a client bind to whatever they request. Permitting the
    client fine-grained control on a forwarding-by-forwarding basis is usually the
    best choice.


    ### Allow Specific Ports and Addresses


    If you want more specificity than `GatewayPorts` supports, you can restrict which
    TCP ports and addresses can be forwarded with the `PermitOpen` keyword in `sshd_config`.
    `PermitOpen` takes a space-delimited list of ports that may be forwarded in the
    form of `hostname:port`. For example, here I permit the server’s ports `25` and
    `110` to be forwarded back to the client, and only from the localhost address.


    ```

    PermitOpen localhost:25 localhost:110

    ```


    Anything not permitted is forbidden. The SSH session will open normally, but when
    you attempt to pass traffic over a forbidden forwarded port your SSH client displays
    an error.


    ### Requiring Port Forwarding


    Perhaps the port forwarding is the only reason for this connection to exist. If
    setting up port forwarding fails, you don’t even want the connection to establish.
    The `ExitOnForwardFailure` `ssh_config` keyword tells `ssh` what to do in the
    event an attempt to forward a port fails. The default, `no`, means the connection
    should be set up even if port forwarding cannot be established. By setting `ExitOnForwardFailure`
    to `yes`, you tell SSH to immediately disconnect if the port forwarding doesn’t
    work.

    '
