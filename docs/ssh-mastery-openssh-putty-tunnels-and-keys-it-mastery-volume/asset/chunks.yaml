    This demonstrates “first match wins.” User `pkdick` is denied immediately, and
    that decision is final. Other users can proceed to the `AllowGroups` statement.
    You might use this setup on, say, a Raspberry Pi’s built-in `pi` account.


    Some applications, like properly-configured `rsync`, need accounts with SSH access.
    This requires a user account with public key authentication (Chapter 7, “SSH Keys”).
    These accounts can be dangerous. While you can restrict the accounts that the
    user can run when authenticated with a key, you don’t want `rsync` connections
    from random hosts, and you don’t want a user with shell access able to circumvent
    restrictions by editing a file he owns. You can use these `Allow` and `Deny` options
    to restrict where users can come from by adding an `@` and an IP address after
    the username.


    `AllowUsers backup@192.0.2.0/24`


    `AllowGroups support`


    Users in the `support` group can log in from anywhere, and the user `backup` can
    log in from any host with an IP between `192.0.2.0` and `192.0.2.255`. All other
    users are rejected.


    With sensible group memberships and thoughtful `Allow` and `Deny` options, you
    can restrict login access almost any way you need. When in doubt, give accounts
    the least level of privilege that lets users and programs accomplish their required
    tasks.


    ## Root SSH Access


    Sometimes it might seem that you must allow users, sysadmins, or applications
    to SSH into the system as `root`. In almost all environments, this is a colossally
    bad idea. When users must log in as a regular user and then change to `root`,
    the system logs the user’s account, providing accountability and attribution.
    Logging in as `root` destroys that audit trail. Many server programs are initially
    started by `root`, and the environment changes that make a user account friendly
    can propagate into those programs’ environments, disrupting service.


    If a user requires root-level access, there’s always `su(1)`. Or `sudo`, or `pfexec`,
    or any number of privilege management tools. SSH-based orchestration systems like
    `Ansible` support all of these programs. `Sudo` in particular can be configured
    to authenticate via an `SSH` agent, so that the users’ credentials are never exposed
    to the server.


    Certain environments, particularly large cloud-based server farms, are designed
    so that logging in as `root` is not only possible but preferable. These environments
    require public key authentication and log the key used to authenticate each session.
    Most readers of this book do not work in that environment. We’ll look at setting
    that up in Chapter 14, “Certificate Authorities.”


    OpenSSH controls direct login as `root` with the `PermitRootLogin` keyword. By
    default, `sshd` permits direct `root` logins if they’re done with public key authentication.


    `PermitRootLogin prohibit-password`


    The `prohibit-password` option is the same as the older but confusingly-named
    `without-password`. Users can log in as `root`, so long as they don’t use a password
    to do it. Once you get into public key authentication, nothing prohibits a user
    from adding their key to the list of keys permitted to use the `root` account.
    I advise against using `prohibit-password`.


    Setting `PermitRootLogin` to `no` disallows direct logins by `root`. Most operating
    systems set this by default.


