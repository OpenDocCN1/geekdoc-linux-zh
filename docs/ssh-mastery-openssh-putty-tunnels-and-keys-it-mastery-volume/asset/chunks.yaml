    want to copy it to all of your servers. There’s lots of ways to manage this. Many
    UNIX-like hosts include `ssh-copy-id(1)`, a convenient way to copy an existing
    `authorized_keys` from one host to another. I have my up-to-date `authorized_keys`
    stashed on a public Web server, so that I can easily install it on any machine
    I happen to wander into. Or, you can use the techniques discussed in Chapter 11
    to automatically copy the `authorized_keys` files for you and all of your users
    to all of your machines.


    Now test your key from your client.


