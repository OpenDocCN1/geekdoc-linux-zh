- fmt: '

    Now that you know how to selectively forward ports to help your network together,
    let’s see how to keep an SSH session alive for hours or days at a time, without
    human intervention.


    [1] My HTML education ended about 1996, and I have no desire to resume it.


    [2] Yes, we''re solving the wrong problem here. The real fix is to replace the
    boneheaded application.


    [3] I know, I know, most Windows systems don''t have an SSH service. I''m choosing
    to keep my examples consistent, rather than confuse you further.


    # Chapter 10: Keeping SSH Connections Open


    Port forwarding transforms SSH from a protocol that gets you a terminal session
    into a tool for arbitrarily forwarding TCP traffic. But most firewalls (and some
    Internet service providers) deliberately terminate TCP connections left idle for
    a period of time. SSH sessions left idle will eventually be disconnected by the
    server, the client, or some network device in between. If you’re forwarding a
    service over SSH, or even if you’re too lazy to log into your SSH server every
    time the firewall cuts your connection, you want to keep your session alive.


    Most methods for keeping an SSH connection up amount to “pass a small amount of
    traffic in the background so that intermediate network devices don’t see the connection
    as idle.” These are called `keepalives`. Running a program that continuously displays
    and updates, like `top(1)`, can act as a keepalive without changing any SSH settings.
    All you need to do is get in the habit of starting `top` every time you’re interrupted.


    The problem with keepalives is that temporary disconnections terminate the session.
    If your service provider has a problem in the middle of the night and the keepalive
    packets cannot cross the network for a few minutes, either your client or your
    server will terminate the connection. Decide how to configure keepalives appropriately
    for your network. You might not want them at all.


    If your connection is so erratic that keepalives can’t sustain your connection,
    investigate `mosh` (https://mosh.org). It’s a remote connection protocol similar
    to SSH, but designed for unreliable networks.


    You have two options for keepalives, TCP keepalives and SSH keepalives.


    ## TCP Keepalives


    Both PuTTY and OpenSSH support TCP keepalives. While TCP keepalives are not as
    configurable as SSH keepalives, they’re sufficient for most end-users.


    A TCP keepalive is part of the TCP protocol, is sent at the transport layer, and
    is not part of SSH itself. When a TCP connection remains idle, it eventually times
    out and disconnects. Turning on TCP keepalives sends occasional packets back and
    forth just to remind everyone that this connection is still here. A TCP keepalive
    can be spoofed or forged, though. This is not necessarily bad—I can’t imagine
    why anyone would want to spoof your connection to keep it alive, but someone more
    clever and more nasty than I can probably come up with more than one bad reason.
    How often you need to send a TCP keepalive depends on your operating system’s
    TCP stack, but it should never be longer than two minutes.


    PuTTY only supports TCP keepalives, but doesn’t originate them by default. It
    responds to any TCP keepalives it receives, however. On the PuTTY Configuration
    screen, go to the Connection section. The first option is `Seconds between keepalives`.
    This defaults to zero, disabling sending keepalives. In most cases, sending a
    TCP keepalive every 90 seconds suffices to hold the connection open. Even if PuTTY
    doesn’t send keepalives, SSH servers usually do, and PuTTY responds to them. This
    usually suffices to hold the connection open.


    The OpenSSH server sends TCP keepalives by default. If you want to disable them,
    set the keyword `TCPKeepAlive` to `no` in `sshd_config`.


    ## OpenSSH Keepalives


    While TCP keepalives might meet most people’s needs, OpenSSH’s keepalives are
    much more flexible. The keepalive messages, sent within the encrypted channel,
    tell intermediary network devices that this TCP session is still in use. Receiving
    a keepalive tells the host that the remote end is still connected, and that the
    SSH session is still valid. An SSH keepalive is also more likely to continue holding
    a session open even through a lengthy router reboot.


    Both OpenSSH’s client and the server support keepalives. Strictly speaking, the
    client sends `client alive` messages and the server sends `server alive` messages.
    While these must be different for protocol reasons, to us they’re all just keepalives.
    OpenSSH doesn’t use SSH keepalives by default; you must configure them before
    starting a session.


    A host that sends keepalives expects to receive keepalives in return. Each host
    tracks how long it’s been since it received a keepalive from the other end. If
    a host sends a specified number of keepalives without receiving any, it assumes
    that the connection is lost and terminates the SSH session.


    Using SSH keepalives requires deciding how often you want to send a keepalive
    packet, and how many of those packets can be missed before the host disconnects
    the session. The server uses the keywords `ClientAliveInterval` and `ClientAliveCountMax`.
    The client supports the keywords `ServerAliveInterval` and `ServerAliveCountMax`.


    The `AliveInterval` keywords dictate how many seconds the connection must be idle
    before the host sends a keepalive. To make a client transmit a keepalive after
    ninety seconds of inactivity, set `ServerAliveInterval` to `90`. The default is
    0, disabling keepalives.


    The `AliveCountMax` keywords tell the host how many keepalives it must send in
    a row before terminating the connection. The default is three.


    Let’s look at how this works in practice. We have the following in the server’s
    `sshd_config`:


    ```

    ClientAliveInterval 90

    ClientAliveCountMax 5

    ```


    On the client side, we’ve put the following in `ssh_config`:


    ```

    ServerAliveInterval 90

    ServerAliveCountMax 4

    ```


    We log into our SSH server, do some work, and let the connection go idle. Ninety
    seconds after the connection goes idle, the client sends a keepalive to the server.
    If the server responds with its own keepalive, both client and server know that
    the connection is alive. If another ninety seconds pass without receiving a response
    from the server, the client will send another keepalive. It knows that it’s sent
    two keepalive requests without receiving any response from the server. If the
    connection remains idle, the client keeps sending keepalives. At the fourth keepalive,
    after six minutes, the client throws away the SSH session and exits.


    The server sends keepalives in the same way, but note that it’s set to tear down
    the connection at unacknowledged keepalive requests. This particular client tolerates
    less interruption than the server.


    Note that the TCP protocol also plays into this. A host sending TCP packets expects
    the recipient to acknowledge every packet. If the sender does not get this acknowledgment,
    it eventually tears down the connection despite anything SSH can do. The length
    of time varies by operating system, but you should know that if you cannot maintain
    a TCP connection you cannot maintain an SSH session.


    If you want to keep your connection alive no matter what, cranking `AliveCountMax`
    to high values helps, especially when you’re behind a cheap[1] Network Address
    Translation device such as many home routers.


    PuTTY does not support SSH keepalives.


    ## Keepalives and the SSH Server

    '
