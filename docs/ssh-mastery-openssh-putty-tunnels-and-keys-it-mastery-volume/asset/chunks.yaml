    我不建议启用 `UseDNS`。


    ### 系统管理功能


    使用 `PidFile` 关键字告诉 `sshd(8)` 将其进程 ID 文件存储在哪里。请勿轻率此操作。许多管理工具（愚蠢地）使用了该 PID 文件。


    ```

    PidFile /var/run/sshd.pid

    ```


    该文件在 `sshd(8)` 降低权限之前写入，因此它可能由 `root` 所有。如果你想禁用写入 PID 文件，可以将 `PidFile` 设置为 `none`。


    `sshd(8)` 通过 `syslogd` 记录日志，默认使用 `AUTH` 设施和 `INFO` 级别。使用 `SyslogFacility` 和 `LogLevel`
    关键字控制这些设置。


    ```

    SyslogFacility Auth

    LogLevel INFO

    ```


    `SyslogFacility` 关键字接受任何 syslog 设施。查看 `syslogd(8)` 的文档获取设施列表。


    `syslogd` 不仅使用 `LogLevel` 来决定将日志消息发送到哪里，`sshd(8)` 使用它来决定向 `syslogd` 发送什么。


    - `LogLevel` 为 `QUIET` 时不记录任何内容。

    - `LogLevel` 为 `FATAL` 时仅在 `sshd(8)` 崩溃时记录。

    - `ERROR` `LogLevel` 仅报告问题。

    - `LogLevel` 为 `INFO` 时记录问题以及人员登录和注销的情况。

    - `VERBOSE` 记录所有不违反隐私的细节，包括用于身份验证的公钥指纹。

    - `DEBUG1`、`DEBUG2` 和 `DEBUG3` `LogLevel` 发送的数据足以违反用户隐私。调试消息会被发送到 `syslogd`。大多数默认日志系统不会捕获这种程度的细节；你需要配置你的系统来捕获所有这些细节。此外，不要使用传统的未加密
    `syslogd` 在开放网络上发送调试数据。


    ### 更改加密算法


    你可能会在配置中发现 `Cipher` 和 `Mac` 关键字。它们没有出现在 OpenSSH 提供的 `sshd_config` 中，但某些操作系统添加了它们。这些设置允许你更改服务器支持的加密方法。


    不要乱动这些设置。你只会自找不利。


    某些组织（最常见的是政府）要求仅使用经过批准的加密算法。最为人知的是美国的 FIPS 标准。此类组织有非常具体的文档，规定了如何配置 SSH 以符合标准。


    ### 多少个未身份验证连接？


    OpenSSH 通过启动单独进程来处理每个入站连接，从而避免了多线程带来的麻烦。针对运行此类程序的服务器，一种常见的拒绝服务攻击是启动大量的客户端连接，直到服务器耗尽所有资源并崩溃。OpenSSH
    通过 `MaxStartups` 选项避免了这个问题。


    `MaxStartups` 允许你设置并发到 SSH 守护进程的未身份验证连接数。一旦达到此数量的连接尝试身份验证，`sshd` 将不再接受其他连接，直到现有连接失败或现有未身份验证连接的
    `LoginGraceTime` 超期。一个像 `10` 这样的简单值可以保护服务器，但不会让你登录并执行某些操作来尝试防御正在进行的攻击。


    更好的选择是使用随机早弃（RED），这是网络工程师长期以来用于避免拥塞的协议。DOS 攻击并不等同于网络拥塞，但它与网络拥塞具有许多共同特征。RED 通过设置限制来工作。一旦入站连接超过下限，`sshd`
    将为每个后续入站连接提供被直接拒绝的机会。拒绝连接的概率不断增加，直到未身份验证连接的数量达到上限，此时所有连接都被拒绝。使用 RED 意味着攻击者需要向
    SSH 服务器投入大量的资源才能保证系统管理员无法登录。这并不会让攻击变得不那么烦，但它为系统管理员（以及合法用户）提供了在攻击期间登录的机会。


    通过指定下限、拒绝连接的初始概率和上限阈值为 `sshd` 配置 RED。默认值是 `10`、`30` 和 `100`。


    ```

    MaxStartups 10:30:100

    ```


    这意味着 `sshd` 同时接受最多 `10` 个未身份验证连接。第 11 个并发未身份验证连接有 30% 的概率被拒绝。连接被拒绝的概率线性增加，直到达到
    100 的上限，此时所有连接都会被拒绝。


    使用 RED 意味着如果在 DOS 攻击期间持续尝试连接，你最终会获得机会票并被允许进入。


    我们将在本书末尾的“保护 SSH 服务器”中详细讨论如何防御 sshd。


    ### 按用户或组限制访问


    许多网络应用程序依赖于底层操作系统的用户账户。人们通过网页或专有客户端使用应用程序，但从未真正 SSH 登录主机。如果发运部的 Fred 需要访问企业资源计划（ERP）系统来打印他的货运标签，而
    ERP 系统需要底层用户账户，那么主机就需要为 Fred 创建一个账户。这并不是理想的做法，但现实确实如此。如果你负责此类应用程序，请配置主机使此类用户无法登录服务器。


    OpenSSH 使用 `DenyUsers`、`AllowUsers`、`DenyGroups` 和 `AllowGroups` 选项支持用户限制。这些选项接受以逗号分隔的用户或组的列表作为参数，并按照特定顺序进行处理。第一个匹配项获胜。


    - 列在 `DenyUsers` 中的用户无法通过 SSH 登录，即使在随后的 `AllowUsers` 或 `AllowGroups` 中被列出。

    - 列在 `AllowUsers` 中的用户可以通过 SSH 登录，除非在 `DenyUsers` 中被显式禁止。

    - 属于 `DenyGroups` 中列出的组的用户无法通过 SSH 登录，除非被 `AllowUsers` 语句特别允许。这允许你对某个用户设置例外。

    - 最后，正如你猜到的那样，属于 `AllowGroups` 中列出的组的用户可以通过 SSH 登录。


    此外，存在 `AllowUsers` 或 `AllowGroups` 条目意味着其他人都无法登录。系统将拒绝所有未被显式允许的人的 SSH 登录。


    这些限制基于“首次匹配”原则。语句按顺序处理，当用户匹配某条规则时，该规则立即生效并停止处理。困惑吗？让我们来看一些例子。我的主机有四个用户：`backup`、`mwlucas`、`pkdick`
    和 `jgballard`。他们所属组如下：


    ```

    wheel: mwlucas

    staff: mwlucas, pkdick

    support: pkdick, mwlucas

    billing: jgballard

    ```


    虽然这些是小组，但该原理适用于任何规模的组。财务应用程序需要系统账户，但该用户不需要 SSH 访问。如果我只想阻止财务部门的用户通过 SSH 登录，可以使用
    `DenyUsers`。


    ```

    DenyUsers jgballard

    ```


    未列出的用户仍然具有 SSH 访问权限。但是，当我从该部门添加另一个用户时，我必须显式地将添加到 `DenyUsers`。我通过按组阻止访问会更有利。


    ```

    DenyGroups billing

    ```


    通过这一条语句，我可以将用户添加到财务组，他们就无法用他们贪婪的手接触我珍贵的虚拟终端。


    存在 `AllowGroups` 语句意味着只有该组的成员可以登录。在 BSD 系统上，`wheel` 是系统管理员的组。Ubuntu 使用 `admin`
    组做了类似的事情，但我是一个 BSD 人，所以你有我的偏好。要允许仅系统管理员通过 SSH 登录，请使用 `AllowGroups`。


    ```

    AllowGroups wheel

    ```


    wheel 组中的任何人都可以登录。虽然我没有显式禁止其他人登录，但用户 `backup`、`pkdick` 和 `jgballard` 不在 `wheel`
    组中，所以他们被排除在外。


    我是 wheel 组的唯一成员。我可以显式列出自己。


    ```

    AllowUsers mwlucas

    ```


    我希望能最终获得帮助。等到那时，我必须为我的新系统管理员创建一个账户，并在所有机器的 `AllowUsers` 语句中添加他们。我会忘记其中一个。尽可能使用组。


