    If this is all you want, you’re done. But let’s look at some harder stuff.


    ### Revoking User Certificates


    Generally, you don’t revoke user certificates. You revoke the public keys associated
    with the certificate, using the RevokedKeys sshd_config keyword.


    RevokedKeys /etc/ssh/revoked


    One reason to rotate your CA is that it holds down the length of your revoked
