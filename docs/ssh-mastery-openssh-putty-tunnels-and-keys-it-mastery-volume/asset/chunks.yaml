    work for you, check the permissions on `authorized_keys` and the `.ssh` directory.
    Neither should be writable by any user except you.


    If you are uploading from a UNIX-like host, you can do the upload and copy in
    one command.


    ```

    cat .ssh/id_rsa_authorized_keys.pub | ssh sloth "cat >>~sshssh/authorized_keys"

    ```


    If you ever manually edit `authorized_keys`, be certain that the last key ends
    with a newline. If the final entry doesn’t end in a newline, the next key you
    add to this file will be tacked onto the end of the previous key. Both the new
    key and the old key will stop working. If in doubt, go to the end of the file
    and hit `RETURN`. An extra newline at the end of `authorized_keys` won’t hurt
    anything.


    Only upload the public key, *never* the private key. Your private key should never
    cross the network.


