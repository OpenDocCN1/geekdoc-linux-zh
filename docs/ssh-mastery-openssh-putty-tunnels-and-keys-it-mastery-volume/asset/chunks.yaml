    Assign the principals when you create the certificate. This certificate, for user
    `mwl`, assigns this certificate the principals `peasants` and `vermin`. As there
    are many many sysadmins, some with identical names, I store the employee number
    as well as the name in the key identity.


    ```bash

    ssh-keygen -s user-mwlca-key -I user_87181_Michael_Lucas -n peasants,vermin -V
    +52w id_rsa.pub

    ```


    This works because the key identity gets logged whenever the key is used to authenticate.
    Using principals in this way accommodates the need for accountability.


    If you’re using this many servers, though, having text files on each server dictating
    who can log into which account scales badly. You can use the `AuthorizedPrincipalsCommand`
    and `AuthorizedPrincipalsCommandUser` keywords to run a command that fetches the
    list of authorized principals for this account. This lets your global enterprise
    with millions of servers continue using that Microsoft Access database for account
    information—or, yes, you could use LDAP or a modern database like `Postgres`,
    if you wanted to be fancy about it.


    ## CA Key Rotation


    You can achieve another level of certificate security by rotating your OpenSSH
    certificate authority keys. This involves creating a new CA keypair, recreating
    all certificates, distributing those certificates to hosts and users, and removing
    the old CA’s keys.


    It’s possible to deploy SSH certificates without automation—painful, but possible.
    It’s not impossible to rotate your certificate authorities without automation,
    but it’s much easier to deploy `Ansible` to automate the process. Don’t even try
    to rotate your CA key without automation.


    Start by generating your new CA keys and distributing the public keys to each
    of your hosts. The files that contain trusted CA keys, either `/etc/ssh/ssh_known_hosts`
    or the file given by the `TrustedUserCAKeys` `sshd_config` keyword, can contain
    multiple CA keys simultaneously. Don’t delete the old CA keys yet; only add the
    new keys.


    Once all of your hosts have the public keys for your new CAs, regenerate certificates
    for all of your hosts and/or users. Distribute those certificates as needed, removing
    the certificates created with the old CA. Your automation system will report which
    hosts have the new file and which don’t.


    Once your new certificates are distributed, disable the old CA public keys on
    all of your hosts.


    Not only will automation simplify making a key rotation possible, automation makes
    it possible to rotate your certificate authority keys frequently. If you have
    a team of sysadmins, forget certificates with a one-year expiration; try one-week
    host certificates that you update every night! Even if an intruder manages to
    steal a certificate and a public key, there’s no way they’ll brute-force the private
    key before the certificate expires.


    This is the basics of certificates. Certificates have many small features that
    can be helpful, if you have the right environment; learn more in `ssh-keygen(8)`.
    Next, the final chapter takes us through some OpenSSH scraps.


    1. `SSL` is no longer a thing, unless you like bystanders decrypting your traffic.

    2. If you put your SSH CA in `/etc/ssh`, the Sysadmin Code declares that your
    co-workers are allowed to beat you with a spiked club, provided the spikes are
    no longer than inches and not coated with neurotoxin.

    3. Also, nobody’s asked the OpenSSH maintainer for the feature.


    # Chapter 15: OpenSSH Scraps


    This chapter covers a potpourri of SSH topics that you should probably know, but
    don’t merit own chapters. We’ll discuss host rotation in OpenSSH, connecting to
    hosts that only support obsolete ciphers.


    ## Host Key Rotation


    After a host has been accepting connections from the public for year or two, you
    should consider rotating the host keys. Not only grow algorithms easier to break
    as computing power advances, but prospective intruders have more time to brute-force
    your private key. If you ask your users to verify new keys every year or so, they’ll
    get annoyed. You can use the existing host key to securely transmit the new host
    key to the client. This isn’t useful if the existing host key has compromised,
    but can let you proactively distribute keys before getting the old ones.


    Once you have many servers, OpenSSH certificates are more useful than occasional
    rotation. Certificates eliminate `known_hosts` and the need to update the client.
    Configure SSH key rotation on both the server and the client.


    ### Server Key Rotation


    Start by creating your next set of keys. Create each key you intend to support.
    They’ll need different names, new keys prepended with the year they’re created.


    ```bash

    ssh-keygen -f 2018_ssh_host_rsa -t rsa -N ''''

    ssh-keygen -f 2018_ssh_host_ecdsa -t ecdsa -N ''''

    ssh-keygen -f 2018_ssh_host_ed25519 -t ed25519 -N ''''

    ```


    This gives us keys. Now use the standard `sshd_config` `HostKey` keyword to add
    these keys. Add new keys after the existing host keys.


    ```

    HostKey /etc/ssh/2018_ssh_host_rsa

    HostKey /etc/ssh/2018_ssh_host_dsa

    HostKey /etc/ssh/2018_ssh_host_ecdsa

    HostKey /etc/ssh/2018_ssh_host_ed25519

    ```


    Your server is now ready to distribute those host keys to clients. Once you’re
    certain all of your clients have copies of the new host keys, and you’ve given
    up waiting for that user who never updates, you can disable the old host keys.


    ### Client Key Rotation


    Tell `ssh(1)` to look for additional keys with the `UpdateHostKeys` `ssh_config`
    option. The default, `no`, tells `ssh` to ignore new host keys. Setting it to
    `yes` automatically updates `known_hosts` with any new keys for this host. The
    `ask` setting means to query the user to see if the new keys should be accepted.
    This mirrors the `StrictHostKeyChecking` keyword.


    When you connect to a host with `UpdateHostKeys` option set, your initial connection
    will look a little different.


    ```bash

    ssh avarice

    ```


    The authenticity of host `avarice.mwl.io (203.0.113.209)` can''t be established.
    ECDSA key fingerprint is `SHA256:JUf1lzyEVYxhbJCXLvPi6LJdYCZb8c+NGLzw`. No matching
    host key found in DNS. Are you sure you want to continue connecting (yes/no)?
    `yes`


    Verify the host’s public key and accept it if correct. But then you’ll get another
    set of warnings.


    Learned new hostkey: `RSA SHA256:nNUnWCojrzeHAALXyM/yGpGM7uUIPrP/ph8zV3Ux9M`

    Learned new hostkey: `ED25519 SHA256:nNtyIQidY3MXAEfpWZ0wzkXKQFnQhe0CRIld4`


    Accept updated hostkeys (yes/no)? `yes`


    Your client has grabbed the public keys for this host’s `RSA` and `ED25519` keys.
    You can only accept or reject these additional public keys en masse. It’s a very
    rare attacker that will leave the main host key untouched while subverting the
    other keys, but you really should verify them all.


    When the server adds new host keys, the client will display the fingerprints and
    give you a chance to verify them.


    ```bash

    ssh avarice

    ```


    Learned new hostkey: `RSA SHA256:aDqGAPMnT6b3aYqT3DXjRofYfHznOMbVFWZg3yw/fTI`

    Learned new hostkey: `ECDSA SHA256:9eHjmXAFrGmRT2iz/WY5pHLcvoo0HQ5paiLcpEcXWns`

    Learned new hostkey: `ED25519 SHA256:BZ5X6sIbfa5AWcQY0RjnMRL9zLX1+som5TmTV/k/`


    Accept updated hostkeys (yes/no)?


    Host key updates are incompatible with connection multiplexing (the `ControlPersist`
    keyword). Enabling `ControlPersist` disables host key updates.


    While PuTTY can grab the public key of algorithms it isn’t using for a connection
    (go to the upper left corner menu and select `Special Command -> Cache New Host
    Key Type`), it can’t accept multiple keys of the same type. When you get rid of
    the old host keys, your PuTTY users must re-verify host keys.

