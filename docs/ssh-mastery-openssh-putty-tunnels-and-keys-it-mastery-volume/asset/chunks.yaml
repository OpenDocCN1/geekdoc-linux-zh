    are the SSH permissions granted to this user, as we’ll very soon see in “Restricted
    Certificates.”


    Return this certificate to the user.


    ## Using User Certificates


    Copy the certificate into `$HOME/.ssh`. The user’s public authentication key should
    already be there.


    You should have already set the `TrustedUserCAKeys` keyword, as discussed in “Trusting
    your Certificate Authority” earlier this chapter. If so, move the user’s `authorized_keys`
    file aside. Have the user SSH into the server. If the server is properly configured,
    the user should get in without the server having any information about this particular
    key.


    If this is all you want, you’re done. But let’s look at some harder stuff.


