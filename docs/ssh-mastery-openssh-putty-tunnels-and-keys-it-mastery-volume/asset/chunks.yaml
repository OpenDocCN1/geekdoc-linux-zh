  raw: 'HostKeyAlgorithms ssh-ed25519, ssh-rsa


    The exact method you’ll use depends entirely on the tools you’re comfortable with
    and the automation you already have in place. If at all possible, repurpose your
    existing tools.


    And if you write a good tool to collect, verify, and build a known_hosts file,
    please make it publicly available.


    ### Revoking Host Keys


    If you have reason to suspect that a server’s key has been compromised, revoke
    it. Find all of the server’s host key entries in your known_hosts. Add to the
    string @revoked in front of all of them. Generate new host keys for the server
    and restart sshd, then add the new host keys to your known_hosts. You can now
    distribute your updated known_hosts to your clients, and in the (unlikely) event
    that the user attempts to use the revoked key, the user will get a warning.


    The effectiveness of revoked keys depends entirely on distributing known_hosts
    to your clients.


    ## Distributing Host Keys


    Any time an SSH server’s host key is added, moved, or changed, users will see
    warnings about the host key. The whole point of distributing known_hosts is to
    keep users from seeing unnecessary warnings. Stay ahead of your users.[1](#section-0013.xhtml_ref_footnotebookmark_end_62_1)
    Update your known_hosts any time you deploy or remove a server, or if you must
    give a server new keys. If you delay updating known_hosts, users will learn to
    ignore warnings.


    The worst part of maintaining a centralized known_hosts file is copying the file
    to all of your servers and workstations. You’re busy. If the update takes a long
    time or a lot of energy, you won’t keep up on it. You really need a centralized
    system like Ansible, Puppet, or one of their many competitors. Active Directory
    works fine for distributing host keys to Windows systems. If you’ve never used
    automation, I recommend Ansible. Once you have a complete known_hosts for your
    existing systems, updating that file and pushing it out to all of your systems
    should only take a minute or two, and will save your users and your support team
    hours of labor.


    ### Distributing known_hosts


    All OpenSSH clients check /etc/ssh/ssh_known_hosts for host keys. Copy your known_hosts
    to this location on each of your servers and workstations. The next time someone
    uses ssh(1) on these machines, the correct key will already be in place.


    OpenSSH checks for host keys in each user’s personal known_hosts file in addition
    to the system’s /etc/ssh/ssh_known_hosts. The client will use any entry that matches
    the key offered by the server. When you first deploy a centralized known_hosts,
    each user will probably have an existing personal known_hosts. You don’t want
    any obsolete or invalid entries in the user’s personal cache to interfere with
    later key changes or revocations. Don’t just go deleting everyone’s known_hosts;
    they might contain verified host keys for servers you don’t control. Instead,
    on your first deployment, move each user’s personal known_hosts to somewhere like
    known_hosts.personal.


    Be sure to tell your users what’s going on. Preferably in advance.


    Once you have a system in place to maintain known_hosts, you’ll find other uses
    for automation in SSH. Remember that /etc/ssh/ssh_config sets systemwide defaults
    for ssh(1). If you have organizational standards that require special settings,
    you can enter them in the global configuration and save your users the effort
    of editing their own configurations or remembering command-line arguments. If
    your organization runs SSH on a non-standard port, setting the Port keyword in
    /etc/ssh/ssh_config might actually earn you good karma from your users. Personal
    config files override system-wide settings, so users can still shoot themselves
    in the foot if they’re really intent on it.


    ### Distributing PuTTY Host Keys


    PuTTY keeps its host keys in the Windows Registry. Copying the keys isn’t as easy
    as moving a file to all of your workstations, but it can be simplified. The PuTTY
    team has a Python script to convert known_hosts into PuTTY’s Registry keys, hk2reg.py.
    You won’t find hk2reg.py in the normal PuTTY installation, but it’s included with
    the source code. You can download the PuTTY source code from the PuTTY website,
    or grab it from the PuTTY GitHub at https://github.com/github/putty, in the “contrib”
    directory.


    Run hk2reg.py and give it a single argument, your pristine known_hosts.


    $ **kh2reg.py pristine-known_hosts > putty.reg**


    Install this registry file on your clients via Active Directory, a login script,
    or by having your users double-click on it.[2](#section-0013.xhtml_ref_footnotebookmark_end_62_2)


    Remember that PuTTY stores keys in each individual user’s Registry. There is no
    systemwide PuTTY registry tree. Distribute keys by user, not by machine.


    If you are maintaining known_hosts for a variety of platforms, I suggest this
    workflow for distributing host keys: Start by gathering your host keys. Create
    a known_hosts file for your OpenSSH clients. Trigger the script to automatically
    distribute the new known_hosts to each of your OpenSSH systems. While that runs,
    use kh2reg.py to create your Windows registry. Last, queue your new registry file
    for distribution via Active Directory. The next time people login, they should
    have all the new keys.


    ## Host Keys in DNS


    OpenSSH supports checking for host key fingerprints in the Domain Name System.
    (PuTTY does not.) This eliminates pushing the file to your servers, but traditional
    DNS services are not secure. You absolutely must have DNS Security Extensions
    (DNSSEC) if you want to securely distribute your servers public key fingerprints
    via DNS. If you do not yet have DNSSEC, go configure it now and then come back
    here. You might find my book *DNSSEC Mastery* (Tilted Windmill Press, 2013) useful.


    We’re not going to cover DNS basics. If you’re considering distributing key fingerprints
    via DNS I’ll take it as given that you know what a zone file is, why an RR is
    important, and why you update serial numbers.


    ### SSHFP Records


    The SSH Finger Print (SSHFP) record provides a host’s SSH fingerprint. The record
    looks something like this:


    wrath IN SSHFP 1 1 07988cadf134050d458dfa5f2c062b5e68106163


    As with any standard DNS record, the first field gives the hostname, the second
    indicates this is an Internet record, while the third indicates this is an SSH
    fingerprint record. SSH-specific details start appearing in field four, which
    gives the algorithm type. You don’t have to memorize which number maps to which
    algorithms, but the 1 here means this is an RSA fingerprint. The fifth field is
    the message digest algorithm used to produce this fingerprint. 1 indicates SHA-1,
    while a 2 represents SHA-256\. Finally, the sixth field is the actual key fingerprint.


    You’ll need two SSHFP records for every public key your server offers; one for
    SHA-1 and and one for SHA-256.


    ### Creating SSHFP Records


    Don’t even try to create SSHFP records by hand. The ssh-keygen program can read
    the key files on the local server and produce records, by using the -r flag. Give
    the hostname as an argument.


    $ **ssh-keygen -r wrath**


    wrath IN SSHFP 1 1 07988cadf134050d458dfa5f2c062b5e68106163


    wrath IN SSHFP 1 2 b7931f47398ca1ed73e8642bd029fb69dda05913058ffb096f2358c429436013


    wrath IN SSHFP 2 1 3f73194323def663866a7b3996e6be113d7ea303


    wrath IN SSHFP 2 2 927b54096876789ca926da1aa80db5a09751c8d9c5c99527b3a231e878802e3e


    wrath IN SSHFP 3 1 cf61d5ed8a653750198daf77f0a409d48c8ef760


    wrath IN SSHFP 3 2 4d2277f46a699d475ff095fa274a007fdf8281ad8bccb3575feb62779e257e8e


    wrath IN SSHFP 4 1 59c3ed21e086b923a4e8a49504691c844f5a1590


    wrath IN SSHFP 4 2 4e2f1c2ee4850d1bb43fffd43e16d27df99d0a3491582f51423dd7d48944f513


    Load these records into your DNS server.


    You could also copy the server’s public key files to a central host and tell ssh-keygen
    to use those files with the -f flag.


    $ **ssh-keygen -r wrath -f ssh_host_ed25519_key.pub**'
