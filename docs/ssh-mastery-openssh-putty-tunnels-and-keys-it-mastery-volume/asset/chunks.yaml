    如果 `ssh(1)` 或 `sshd(8)` 报错配置出现问题，请检查你是否正确地分隔了多个条目。本书包含了许多分配多个值的示例，但 OpenSSH 手册始终是最终权威标准。


    ## OpenSSH 配置文件中的通配符


    OpenSSH 服务器和客户端的配置文件接受通配符，称为 `patterns`（模式）。与其列出配置设置的所有可能值，不如模式允许你表述为“匹配此表达式的任何内容”。通配符通常用于
    `Match` 规则，正如本章稍后在“使用 Match 进行条件配置”中所讨论的那样。模式允许你编写诸类的配置语句，例如“此域名内的所有主机”或“此网络中的所有
    IP 地址”。两个通配符字符是：


    - `?` 匹配恰好一个字符

    - `*` 匹配零或多个字符


    例如，我可以使用一个模式将 `Host` 关键字的值设置为 `mwl.io` 中的任何主机。


    ```

    Host *.mwl.io

    ```


    如果我使用问号通配符，此模式将匹配任何主机名为单个字符的主机。很少有环境根据主机名的长度来划分安全域，但如果有的话，你可以使用多个问号来识别它们。此模式匹配
    `sloth.mwl.io` 和 `wrath.mwl.io`，但不匹配 `gluttony.mwl.io` 或 `avarice.mwl.io`。


    ```

    Host ?????.mwl.io

    ```


    模式对于 IP 地址也很有用。在这里，我匹配从 `203.0.113.10` 到 `203.0.113.19` 的主机。


    ```

    Address 203.0.113.1?

    ```


    如果使用星号通配符，我可以匹配 `/24` 网络内的任何 IP。


    ```

    Address 203.0.113.*

    ```


    你可能会像第 5 章讨论的那样将子掩码与 IP 地址范围。


    在前面加上感叹号来取反模式。此模式匹配 `mwl.io` 主机之外的所有内容。


    ```

    Host !*.mwl.io

    ```


    取反在与较大的实体结合时最有用——也就是说，“匹配除那一个小部分之外的所有内容”。如果我想匹配 `mwl.io` 中的所有主机，但子域名 `vermin.mwl.io`
    下的客户，可以使用此模式。并不是所有关键字都支持取反；你必须尝试并查看它在你的环境中是否有效。


    ```

    Host !.vermin.mwl.io *.mwl.io

    ```


    OpenSSH 首席开发人员将取反描述为“有点琐碎”。我称它为“可能会对你掏刀”。如果你需要取反，请进行彻底测试。


    ## 使用 Match 进行条件配置


    你的服务器可能需要根据传入连接的源地址、主机名或用户名有不同的行为。SSH 客户端可能需要为特定的主机组使用不同的用户名，或者在本地网络使用时激活 X 转发（第
    9 章）。`Match sshd_config` 关键字允许为此类情况建立特殊配置。


    在每个 `Match` 语句后，跟随一组触发匹配的条件，然后是一系列 OpenSSH 应该应用于符合所有这些条件的连接的配置语句。我们将在接下来的章节中看到几个示例。


    在实现 `Match` 语句之前，先为最常见的设置配置 OpenSSH。例如，如果你正在配置 `sshd`，你可能希望拒绝除选择用户以外的所有 X 转发。配置
    `sshd` 拒绝 X 转发，然后使用 `Match` 语句检查用户名并允许匹配的用户使用 X 转发。虽然我们还没有介绍 X 转发，但拒绝它是 `sshd_config`
    中的单条条目。


    ```

    X11Forwarding no

    ```


    在下面的所有示例中，此类条目出现在 `sshd_config` 的开头，作为我们将选择性覆盖的默认设置。


    你不能使用 `Match` 语句调整所有可能的 `ssh_config` 和 `sshd_config` 关键字。请检查手册页获取支持的完整列表。


    ### 匹配用户和组


    我遇到的常见情况是我想为特定用户或组启用某个选项。`User` 或 `Group` `Match` 终端允许这一点。


    ```

    X11Forwarding no

    Match User mwlucas

    X11Forwarding yes

    ```


    我总是被允许使用 X 转发，因为我强大的超能力能力消除了所有可能的安全风险。


    我所有的系统管理员都拥有这些力量，或者我满足于消灭那些赋予入侵者力量的管理员，那么我可以 `Match` 包含我管理员的整个组。


    ```

    X11Forwarding no

    Match Group wheel

    X11Forwarding yes

    ```


    如果你需要多个 `Match` 终端，请用逗号分隔它们。


    ```

    X11Forwarding no

    Match User mwlucas, jgballard

    X11Forwarding yes

    ```


    我知道何时该使用 X 转发。我的用户也声称知道。走着瞧。


    ### 匹配地址或主机


    也许你必须允许 X 转发，但仅来自特定的网络。你可以对 IP 地址进行匹配。


    ```

    X11Forwarding no

    Match Address 203.0.113.0/29, 198.51.100.0/24

    X11Forwarding yes

    ```


    如果你在 `sshd_config` 中将 `UseDNS` 设置为 `yes`，`Match` 将接受主机名，但带有通常的 DNS 安全性和可用警告。


    ```

    X11Forwarding no

    Match Host *.mwl.io, michaellucas.com

    X11Forwarding yes

    ```


    双检查 DNS 不会将你锁住。


    对于 `ssh_config` 仅在此处，跳过 `Match` 语法。


    ```

    X11Forwarding no

    Host avarice

    X11Forwarding yes

    ```


    ### 多 Match 条件


    你可以在单行中列出多个 `Match` 终端。在这里，如果从特定 IP 地址连接，允许使用密码。


    ```

    Match Address 192.0.2.8

    PasswordAuthentication yes

    ```


    ### Match 语句的位置


    `Match` 语句之后的所有配置语句都属于该语句，直到另一个 `Match` 语句出现或文件结束。这意味着 `Match` 必须出现在末尾。考虑以下 `sshd_config`
    片段（注：原文此处为 sshd_config，此处根据语境修正为 sshd_config 或保持原意）。


    这意味着 `Match` 必须出现在末尾。考虑以下 `sshd_config` 片段。


    ```

    X11Forwarding no

    PasswordAuthentication no


    Match Group wheel

    X11Forwarding yes

    Match Address 203.0.113.0/29, 198.51.100.0/24

    PasswordAuthentication yes

    ```


    # 第 3 章：OpenSSH 服务器


    OpenSSH 服务器 `sshd` 高度可配置，允许限制谁可以连接服务器、用户可以执行哪些操作以及服务器允许哪些操作。每个现代 Unix 类操作系统都作为操作系统的一部分安装了
    `sshd`。


    我们将查看 `sshd` 的基础知识，并介绍配置选项。具体的选项将在相关章节讨论。


    ## sshd 运行了吗？


    从客户端测试服务器是否运行可访问的 SSH 守护的最简单方法是尝试登录服务器。当一切正常运行时这很好，连接失败意味着客户端或服务器可能损坏，或者中间有一个数据过滤器。SSH
    通常运行在 TCP 端口 22。使用 `netcat(1)` 查看是否可以访问守护进程。


    ```bash

    nc -v devio.us 22

    ```

    Connection to devio.us 22 port [tcp/ssh] succeeded!

    SSH-2.0-OpenSSH_7.0


    通过原始 TCP 连接时，`sshd` 会返回 banner，给出 SSH 协议版本、SSH 服务器软件和软件版本。此主机使用 SSH 协议 2，由 OpenSSH
    版本 7.0 提供。


    如果没有得到类似的内容，可能 `sshd` 没有运行，或者你中间有一个数据过滤器。


    从服务器端，检查并查看 `sshd` 进程是否运行。


    ```bash

    ps ax | grep sshd

    ```

    626 - 0:00.03 /usr/sbin/sshd

    31960 - 0:00.38 sshd: mwlucas [priv] (sshd)

    44387 - S 0:05.75 sshd: mwlucas@pts/0 (sshd)

