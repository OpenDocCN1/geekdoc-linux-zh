    ![](img/image9.jpg)


    图 9-5: PuTTY 本地端口转发设置


    点击 `Add`，然后连接。你现在已经有了端口转发。将浏览器指向 `localhost`，看看会发生什么。


    要将此转发绑定到客户端面向网络的 IP 地址，请选择 `Local ports accept connections from other hosts`（本地端口接受来自其他主机的连接）。这将转发的端口绑定到客户端上的所有
    IP 地址，使得工作站网络上的其他主机可以访问该转发。请参阅本章后后的“选择 IP 地址”以讨论其影响。


    如果你希望在每次连接到此主机时都使用此转发，请保存此会话。


    ## 远程端口转发


    在配置远程端口转发之前，请验证普通 SSH 是否可用。确定你想要从哪里到到何处的客户端和服务器端口。


    本地端口转发通常用于用加密来封装服务，而远程端口转发则用于访问防火墙后的服务。在本例中，我将把 SSH 服务器 `localhost` 地址上的 `2222`
    端口转发到工作站的 `22` 端口。当我连接到 SSH 服务器上的 `2222` 端口时，远程转发将我重定向到工作站的 SSH 服务。


    为什么要这样做？回想我们的示例环境，客户端位于防火墙之后。防火墙可能是我的家庭 NAT 设备，也可能是我雇主的工业级企业防火墙集群。远程转发让我使用我的客户端为网络外的
    SSH 服务器提供连接防火墙内部主机的方法，尽管有任何相反的防火墙规则。这可能是我进入自己网络的宝贵应急后门，也可能违反我雇主的安全策略。或者，最好：两者兼顾！


    注意，除非服务器专门配置了 `GatewayPorts` 关键字允许此操作，否则你无法将转发端口绑定到 SSH 服务器面向网络的 IP 地址。请参阅本章后后的“限制端口转发”。


    ### OpenSSH 远程转发


    使用 `-R` 标志配置远程端口转发。


    ```

    ssh -R remoteIP:remoteport:localIP:localport hostname

    ```


    如果你没有指定要附加到 SSH 服务器的 IP 地址，SSH 将绑定到 `127.0.0.1`。在这种情况下，你可以跳过第一个参数，命令变为：


    ```

    ssh -R remoteport:localIP:localport hostname

    ```


    我想通过两端都使用 `localhost` 地址，将 SSH 服务器 `sloth` 上的 `2222` 端口连接到工作站的 `22` 端口。


    ```

    ssh -R 2222:localhost:22 sloth

    ```


    我的客户端连接到服务器并给我命令提示符。只要该 SSH 会话保持打开，`sloth` 上的另一个用户就可以通过连接端口 `2222` 来 SSH 到我的工作站。


    ```

    sloth$ ssh -p 2222 localhost

    ```


    砰！一个新的 SSH 连接进入了我的工作站，隧道在我现有的 SSH 会话内部。这个新会话将在客户端日志中显示为一个新连接，源自 `localhost`。在设置远程端口转发时，你确实需要信任在你系统中拥有账户的人。任何可以访问你系统
    `localhost` 地址的人都可以使用端口转发。我绝不会在我完全信任的 SSH 服务器上使用远程端口转发。


    如果你希望在每次连接到服务器时都建立远程转发，请使用 `ssh_config` 中的 `RemoteForward` 关键字。


    ```

    RemoteForward server-IP:server-port client-IP:client-port

    ```


    再次，这类似于命令行上的端口转发，但缺少了中间的冒号。在这里我在配置文件中设置了相同的端口转发。


    ```

    Host sloth.mwl.io

    RemoteForward localhost:2222 localhost:22

    ```


    `RemoteForward` 关键字最常见出现在 `Host` 语句中，除非你想对连接的每个主机上都执行远程转发。


    ### PuTTY 远程转发


    要配置远程转发，进入 PuTTY 配置界面的左侧，选择 `Connection` -> `SSH` -> `Tunnels`，如图 9-4 所示。由于我们是从服务器转发到客户端，`Source
    port` 字段指的是将转发到工作站的服务器上的端口。在这种情况下，源端口是 `2222`。`Destination` 是 `localhost:22`，因为工作站的
    SSH 服务器运行在端口 `22` 上。选择 `Remote` 进行远程端口转发。


    点击 `Add`，然后连接。端口转发应该可以正常工作。


    要将此转发绑定到服务器面向网络的 IP 地址，请选择 `Remote ports do the same (SSH-2 only)`。这将转发的端口绑定到
    SSH 服务器上的所有 IP 地址，以便其他主机可以访问该转发。本章后后的“选择 IP 地址”讨论了其影响。


    要使此服务器的远程转发持久化，请保存会话。


    现在你可以嘲笑防火墙直到失业局。或者在 VPN 故障时进入你的网络，拯救你的公司。或者，再次，两者都有。


    ## 动态端口转发


    动态端口转发将你的 SSH 客户端转换为 SOCKS（版本 5）代理。任何发送到代理的流量都将隧道到 SSH 服务器，服务器将根据其访问权限转发这些流量。你必须有一个支持
    SOCKS 的应用程序来访问代理，但大多数网络浏览器都包含 SOCKS 支持。在本例中，我将把工作站上的端口 `9999` 配置为 SOCKS 代理，并将所有流量动态地转发到我位于公共互联网上的服务器。


    使用 SOCKS 时，你的客户端可能需要将所有 DNS 请求转发到 SOCKS 服务器。并非所有客户端都支持此。


    ### OpenSSH 动态转发


    使用 `-D` 标志告诉 OpenSSH 使用动态转发。


    ```

    ssh -D localaddress:localport hostname

    ```


    如果你没有指定 IP 地址，ssh 会自动绑定到 `127.0.0.1`。在这里，我在工作站的端口 `9999` 上创建代理。所有流量都通过 SSH 连接转发。


    ```

    ssh -D 9999 sloth

    ```


    像端口转发一样，你会登录服务器并获得命令提示符。动态转发在后台运行。配置网络浏览器访问代理 `127.0.0.1:9999`。


    如果你希望在每次连接到主机时配置端口转发，请使用 `ssh_config` 中的 `DynamicForward` 关键字。


    ```

    DynamicForward host:port

    ```


    与其他转发语句一样，出于相同原因，`DynamicForward` 关键字最常见于 `Host` 语句中。


    ### PuTTY 动态转发


    进入图 9-4 所示的 `Tunnels` 屏幕。在 `Source port` 字段中输入你想 SOCKS 代理使用的端口。留空 `Destination`。选择
    `Dynamic`，然后点击 `Add`。你会看到端口转发出现在 `Forwarded ports` 列表中。对于示例用法，我在 `Source port`
    字段中输入 `9999`，选择 `Dynamic`，点击 `Add` 并连接。现在你的浏览器应该能够通过 SOCKS 代理连接了。


    要将此转发绑定到客户端面向网络的 IP 地址，请选择 `Local ports accept connections from other hosts`。这将代理绑定到工作站上的所有
    IP 地址，以便其他主机可以访问该转发。记住，这样做是在向任何可以访问你客户端的人提供隧道。


    如果你希望每次打开此连接时自动启动此转发，请保存会话。


    你可以使用任何支持 SOCKS 代理的程序验证动态转发。这类程序中最常见的是网络浏览器。配置防火墙拦截来自工作站的所有 80 端口流量。验证你无法无法上网。如果你要上网，你需要通过代理进行。启动动态端口转发
    SSH 会话。配置网络浏览器访问该代理。如果你能看到互联网，说明动态转发工作正常。


