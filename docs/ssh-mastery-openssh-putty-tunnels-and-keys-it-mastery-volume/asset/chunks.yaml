    of evading the corporate firewall is left as an exercise for the reader.


    # Chapter 4: Verifying Server Keys


    If you’re paranoid, or if you’ve been a sysadmin for longer than a week, you need
    to be sure that the server you’re logging into is the server you think you’re
    logging into. Server keys help verify a server’s identity before you exchange
    authentication information with the wrong machine.


    Network connections over unencrypted, unauthenticated protocols are easily diverted
    to the wrong machine. An intruder who controls a publicly accessible device, such
    as a server, can make it spoof a different server’s identity. Every user that
    logs onto the spoof server gives his username and password to the intruder. Often
    the intruder will then forward the session to the actual destination, so the user
    never realizes they’ve been caught. This is a classic network attack that is still
    widespread; the protocols change, the applications change, but man-in-the-middle
    attacks and spoofing are forever.


    When properly deployed and used, SSH categorically eliminates these attacks. Even
    if an intruder can make one machine resemble another, even if he copies the login
    prompts and the operating system version, the intruder cannot copy the server’s
    private key. SSH server keys verify the server’s identity to the client. They
    are important, not something you just hit ENTER to accept.


    Every SSH server has one or more unique public keys, as discussed in Chapter 1.
    The first time an SSH client connects to an SSH server, it displays the server’s
    public key fingerprint to the user. The user is expected to compare the fingerprint
    with the server’s key. If they match, the user tells their SSH client to cache
    the key and the connection continues. If the keys don’t match, the user terminates
    the connection.


    On all subsequent connections to the server, the client compares its cached key
    to the key presented by the server. If the keys match, the connection continues.
    If the keys don’t match, the client assumes that something has gone wrong and
    requests user intervention.


    For SSH server keys to be useful, you must verify that the key displayed by the
    client is identical to the key offered by your target server. A public key is
    several hundred characters long, however. Sysadmins can’t realistically ask users
    to compare hundreds of characters to a list of known-good keys; most users automatically
    dismiss the task as impossible. Explaining that it’s very possible, but very tedious
    and very annoying, does not improve the discussion.


    SSH summarizes public keys with fingerprints.


    ## Key Fingerprints


    A key fingerprint is an almost human-readable summary of a public key. Any user
    can get the public key fingerprints; if you need the private key fingerprints,
    you’ll need to be root. View a key’s fingerprint with the `ssh-keygen(1)` program,
    using `-l` to print the fingerprint and `-f` to specify a key file. Here I view
    the fingerprint of this host’s ED25519 key.


    ```

    $ **cd /etc/ssh**

    ```

