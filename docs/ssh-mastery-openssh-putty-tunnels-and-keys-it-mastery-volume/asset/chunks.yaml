    Suppose I disabled password-based authentication on all my computers. The only
    way to access a command prompt on any of my hosts is by authentication with public
    keys. I’m working on my server wrath, and must copy a file over to the server
    gluttony. This presents a problem. My private key isn’t on wrath. Copying the
    private key to a server is terrible security practice—you want your private key
    on as few hosts as possible, and never on your servers. But passwords don’t work.
    How can I use SCP or SFTP?


    The answer is to forward authentication requests back to your workstation. Agent
    forwarding is exactly that. When you try to SSH from one server to another, the
    SSH client on the server sends private key requests back to your desktop. The
    agent is available as a socket, in a location given by the environment variable
    $SSH_AUTH_SOCK.


    $ **echo $SSH_AUTH_SOCK**


    /tmp/ssh-zOeUnDTnkb/agent.2513


    To use agent forwarding, both the client and the server must permit it and the
    SSH agent must be running before starting your first SSH connection. If both the
    client and the server support and request forwarding, the authentication request
    will be forwarded.


    ### Agent Forwarding Security


    The risk of agent forwarding is that you must extend some trust to the SSH servers.
    Anyone who has root access can access your SSH agent socket. Anyone who can access
    your SSH agent’s socket can use your private key without providing a passphrase.


    If your SSH server is compromised, the intruder can piggyback onto your authentication
    socket to log into remote servers with your credentials. Promiscuous agent forwarding
    has been responsible for intrusions in many organizations, even organizations
    you’d think would know better. Only enable agent forwarding to machines that you
    control.


    ### Agent Forwarding in sshd


    To enable agent forwarding on the server, set to the AllowAgentForwarding keyword
    to yes.


    AllowAgentForwarding yes


    I’ll generally disable agent forwarding globally, then use a Match statement to
    permit only certain users or addresses to forward their agents.


    ### OpenSSH Client Agent Forwarding


    In ssh_config, use the ForwardAgent keyword to activate agent forwarding.


    ForwardAgent yes


    The next time you connect to a server, the client will request agent forwarding.


    ### PuTTY Agent Forwarding


    PuTTY enables agent forwarding by default. On the left side of your PuTTY setup
    screen, go to *Connection* -> *SSH* -> *Auth*. Under *Authentication parameters*,
    you’ll see a check box labeled *Allow agent forwarding*.


    You can also use key authentication and authorized_keys to very specifically restrict
    what a user may do over SSH. We’ll examine that in chapter 12\. Now, let’s look
    at forwarding X.


    [1](#section-0009.xhtml_ref_footnotebookmark_start_58_1) Not trusting the desktop’s
    sysadmins basically destroys any hopes of server security. Yes, we’ve all worked
    there.


    [2](#section-0009.xhtml_ref_footnotebookmark_start_58_2) Don’t open public keys
    in Microsoft Publisher. That doesn’t make anybody happy.


    # Chapter 8: X Forwarding


    Unix-like systems use the X protocol (or X11) to display a graphic user interface.
    X has improved over the years but it’s still famously baroque. One of X’s more
    useful features is the separation between the system a program runs on and the
    system the program’s display appears on. You can run a program on one host, and
    have the display appear on a completely different workstation. I can run a graphical
    web browser on a host on the public Internet, and funnel the display back to my
    laptop inside my employer’s firewall, bypassing the firewall content filter restrictions—for
    completely legitimate work reasons, of course. In this scenario all web requests
    originate from my server, and the results appear on my laptop. You can do the
    same thing with any X program.'
