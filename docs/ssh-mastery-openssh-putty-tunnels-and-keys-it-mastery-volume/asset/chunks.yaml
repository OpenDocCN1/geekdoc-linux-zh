    Get the user’s public authentication key, usually `id_rsa.pub`, and copy it to
    your certificate authority machine. You’ll need it to generate the certificate.
    The public key is not confidential, so there’s no risk in sending it across the
    network.


    The command to create a user certificate closely resembles creating a host certificate.
    Use `-s` to give the path to the user CA key. The `-I` flag defines the certificate
    identity, and `-n` gives the certificate principal. Use `-V` to define the expiration
    time. The last argument is the public key file to sign. Here I have my user CA
    sign the public key of one of my users, making it valid for username `djm`. I
    set the validity period to 52 weeks, or one year, because if this expires before
    the user submits it for renewal I’ll entirely blame it on him.


    ```bash

    ssh-keygen -s user-mwlca-key -I user_djm -n djm -V +52w id_rsa.pub

    ```


    I enter the CA passphrase and get a certificate file, `id_rsa-cert.pub`. If you’ve
    never done this before, look at the certificate.


    ```bash

    ssh-keygen -Lf id_rsa-cert.pub

    ```


    `id_rsa-cert.pub`:


    Type: ssh-rsa-cert-v01@openssh.com user certificate

    Public key: RSA-CERT SHA256:CfVbRUF+AaUcOxml6wI5Cf5nvtjzBDH6NcXaGU4…

    Signing CA: RSA SHA256:CKZFZXRgOy1ji8zmUhU0zjJQfNs9gLEqAwSjA8pB4dg

    Key ID: "user_djm"

    Serial: 0

    Valid: from 2017-12-04T07:31:00 to 2018-12-23T07:32:37

    Principals:


    djm

    Critical Options: (none)

    Extensions:


    permit-X11-forwarding

    permit-agent-forwarding

    permit-port-forwarding

    permit-pty

    permit-user-rc


    While the top looks a whole lot like a host certificate, users get different information
    below. Our principal is `djm`, so this certificate is only good for this user.
