    Now that you know your key works, you’ll need to enter your passphrase every time
    you log onto this server. This is a good time to configure an SSH agent.


    ### Using PuTTY User Keys


    If you don’t have an agent running, you must tell PuTTY where to find your private
    key file. On the left side of the PuTTY Configuration screen, select `Connection->SSH->Auth`.
    In the text box labeled `Private key file for authentication:`, put the full path
    to your private key file. Remember, the private key file ends in `.ppk`.


    Now try to connect. PuTTY should prompt you for your username and then request
    your passphrase. If you enter the passphrase correctly, you’ll get a command prompt.


    Once you know that your key works and is installed correctly, reduce how often
    you must type your passphrase with the Pageant SSH agent.


    ## SSH Agents


    While the SSH agents for OpenSSH and PuTTY are wildly different, both perform
    identical tasks. They host your private key in secure memory so that you don’t
    have to keep typing your passphrase. Both let you view the decrypted keys, add
    new keys, and delete keys. The only real difference between them is how they’re
    programmed and how you make them behave—you know the unimportant stuff.


    With your key loaded into `ssh-agent`, your login attempts will look like this:


    ```

    ssh mail

    ```


    Last login: Thu Nov 16 16:56:52 2017 from ceo.worldhq.mwl.io


    FreeBSD 10.3-RELEASE-p20 (GENERIC) #0: Wed Jul 12 03:13:07 UTC 2017


    Note the absence of any request for a password or passphrase; you’ve just logged
    into the remote machine without human authentication. If you connect to many machines
    during your working day, an SSH agent makes life much easier and transforms user
    keys from an annoyance into a pleasure.


    ### OpenSSH Agent


    Any UNIX-like system that includes OpenSSH has the SSH agent `ssh-agent(1)`. And
    that’s where the easy stuff stops.


    One annoyance about the multiplicity of desktop environments in the UNIX-like
    world is that every environment has its own preferred way of running `ssh-agent`.
    We’ll discuss a couple of them here, but if none of these work in your environment,
    you’ll need to check your operating system or window manager documentation. Many
    Unix variants have their own slightly unique desktop setups, and they change the
    precise methods of using `ssh-agent` to suit the developers’ personal prejudices
    and the Whim Of The Week.


    Most display managers, like `xdm` and `kdm`, have hooks to automatically check
    for SSH keys in the user’s home directory. When the display manager finds a key
    during the logon process, it creates a pop-up window to request your passphrase.
    Enter the passphrase and the display manager attaches the SSH agent to your desktop
    environment. You’re ready to begin work.


    If you’re more old-fashioned and run your desktop with `startx(1)`, tell the SSH
    agent you have a key with `ssh-add(1)` before running `startx`.


    ```

    ssh-add

    ```


    Enter passphrase for /home/mwl/.ssh/id_rsa:


    Enter your passphrase to add your keys to the agent.


    Text console users must first run `ssh-agent(1)` with their shell as an argument,
    and then run `ssh-add`.


    ```

    ssh-agent /bin/tcsh

    ssh-add

    ```


    All SSH sessions that start from that console session run with the agent. The
    agent doesn’t work across virtual console terminals, only for the children of
    the shell run by `ssh-agent`. Another virtual terminal needs its own SSH agent.


    If you have multiple keys with the same passphrase, `ssh-add` automatically decrypts
    all of the keys. If you have multiple keys with different passphrases, `ssh-add`
    prompts for each passphrase separately.


    Use `ssh-add -l` to list all private keys currently stored in the agent, and `ssh-add
    -D` to remove the keys from a running agent. Re-add them once you get back from
    lunch.


    ### PuTTY Agent


    The PuTTY SSH agent, Pageant, provides a friendly Windows-style interface to SSH.
    Start Pageant by double-clicking on it. The Pageant icon, a computer with a black
    broad-brimmed hat, will appear in the system tray.


    Right-click on the Pageant icon. You’ll see several options, including `View Keys`,
    `Add Key`, and `Exit`. There are also options for running a saved or new PuTTY
    session. Select `Add Key` to bring up a standard Window file browser. Find your
    private key and select it. Pageant will display a dialog box to request your passphrase.
    Enter it. If you can’t type your passphrase correctly, Pageant will ask you to
    do it again.


    Once Pageant is ready, open a PuTTY session. Connect to a machine that has your
    public key installed. You should get a command prompt without needing to enter
    your passphrase.


    If key-based authentication works when you specify a private key file, but not
    when using Pageant, verify that PuTTY is configured to use Pageant. Select `Connection->SSH->Auth`.
    Under `Authentication Methods`, you’ll find an `Attempt authentication using Pageant`
    checkbox. Make sure it’s checked.


    Once you know that Pageant works, it’s helpful to have it start at login. Find
    your account’s Startup folder (the exact location varies depending on your version
    of Windows). In another window, find your Pageant program. It will probably be
    in the PuTTY directory under either Programs or Program Files (x86). Create a
    link to Pageant in the startup directory.


    For optimal convenience, have the shortcut load your private key at login. You
    can either either giveant the full path to your key as an argument, or you can
    set a `Start in` directory and only use the short file name. I recommend setting
    the `Start in` directory, because it makes loading multiple keys at login much
    simpler. Right-click on your Pageant shortcut. Under `Target`, add the name of
    your private key file as an argument. The Target should now look something like
    "C:\Program Files\PuTTY\pageant.exe" moose.ppk. On that same screen, you’ll see
    a `Start in` field. Enter the full path to your keys directory there. On my laptop,
    that would be C:\Users\mwlucas\Documents\keys.


    To verify this works, exit your running Pageant and double-click on the new icon
    in the startup folder. You should be prompted to enter the passphrase for your
    key. If it doesn’t work, you’ve probably messed up a path in the shortcut. Remember
    that you need to put quotes around any path with a space in it.


    ## Backing Up Key Files


    If you lose your private key, your key pair is useless. Once you know your key
    pair works for authentication, back up both the private and public keys. The PuTTY
    .ppk file contains both the public and private keys, but OpenSSH key pairs need
    both files. Don’t just copy your private key to another machine—every machine
    that has your private key is another place your key can be stolen from. Back up
    your private key on off-line media, such as a flash drive or a CD. You might also
    encrypt it with a program like GnuPG. (If you are not familiar with GnuPG, I recommend
    the book *PGP & GPG: Email for the Practical Paranoid*, by yours truly.)


    ## Keys and Multiple Machines


    Many sysadmins have multiple computers. I regularly use two desktops and a laptop.
    It is possible to move key pairs between machines by copying the key files. You
    can even import OpenSSH keys into PuTTY. How do you realistically manage a single
    key between multiple machines?


    You don’t.


    Rather than reusing a single private key on all of your desktops and laptops,
    create a separate private key for each. Create an authorized_keys file that contains
    the public keys for all of your authentication keys. When a machine is decommissioned,
    stolen, or self-immolates, remove that machine’s key from use. Delete the corresponding
    public key from the authorized_keys file on all of your servers. Generate a new
    key on your replacement machine.

