    ```bash

    $ ssh-keygen -lf ssh_host_ed25519_key.pub

    ```


    256 SHA256:JwmD+yFwH83rPdhorge/S6qxXAUy3/G0CvFqTrcIWkY root@www (ED25519)


    We see that this key use 256-bit SHA-256\. The fingerprint itself is the long
    string beginning with `JwmD…` and ending with `ciWY`. After that we have the user
    and host that generated the key, plus the key type in parenthesis.


    The server and client negotiate on which key to use for a connection. The client
    might present any supported key to the user, so you’ll need the fingerprint of
    every public key on the server. The easiest way to collect all the fingerprints
    is to copy them to a file.


    ```bash

    $ ssh-keygen -lf ssh_host_ed25519_key.pub > $HOME/fingerprints.txt

    ```


    ```bash

    $ ssh-keygen -lf ssh_host_ecdsa_key.pub >> $HOME/fingerprints.txt

    ```


    ```bash

    $ ssh-keygen -lf ssh_host_rsa_key.pub >> $HOME/fingerprints.txt

    ```


    Now get those fingerprints to your users.


    You can use `ssh-keyscan(1)` to retrieve key fingerprints from your SSH servers,
    but you must verify those fingerprints against the server’s public key. By the
    time you do that, you might as well extract the public key fingerprint from the
    server itself. The `ssh-keyscan` program is useful for verifying that a host’s
    public key fingerprints haven’t changed, however.


    ## Making Host Key Fingerprints Available


    A user first connecting to an SSH server should compare the host key fingerprint
    that appears in their client to a known good host key fingerprint. Real users
    only do this if the comparison process is easy, though. The system administrator
    needs to make fingerprint comparisons simultaneously easy and secure. The easiest
    way is probably to display the key fingerprints on an encrypted Web site accessible
    from within your organization. When an employee needs SSH access to the server,
    give them a link to the fingerprint page when you give them their login credentials.
    Do not distribute key fingerprints over insecure media, such as email or an unencrypted
    Web site.


    Chapter 11 offers methods to automatically distribute keys and fingerprints. Deploying
    these methods eliminates the need for users to manually verify keys, simultaneously
    increasing compliance and decreasing everyone’s workload.


    If you’re running the OpenSSH client, you can simplify key verification with key
    certificates (Chapter 14), SSHFP records (Chapter 11), or both. Very few other
    clients, including PuTTY, support these protocols.


    ## Host Keys and the OpenSSH Client


    When you first connect to an SSH server with the OpenSSH client `ssh(1)`, you’ll
    see a prompt requesting that you verify the key.


    ```bash

    $ ssh gluttony

    ```


    The authenticity of host ''gluttony (203.0.113.213)'' can''t be established.


    ECDSA key fingerprint is SHA256:jovou1bQ0S1Ex6QBjo4T+0+FzwzyTXLqxF/aPudVTnk.


    No matching host key fingerprint found in DNS.


    This is your opportunity to verify that the OpenSSH server is actually the host
    you think it is. OpenSSH offers you the ECDSA key fingerprint. Grab your list
    of server keys and compare the ECDSA key fingerprint in the list to the ECDSA
    key fingerprint in the client. If the key fingerprints match, type yes to cache
    the verified key and continue the connection. You’ll get a message much like the
    following.


    Warning: Permanently added ''gluttony'' (ECDSA) to the list of known hosts.


    The next time you connect to this host, `ssh(1)` will compare the cached host
    key to the host key on the server and either silently and securely connect, or
    loudly and securely disconnect.


    If the key does not match, `ssh(1)` immediately disconnects without caching the
    key. Immediately notify your sysadmin and/or security team that the host key does
    not match.


    OpenSSH also supports an easier way to compare key fingerprints, called `randomart`.
    A randomart image is a visual interpretation of a key fingerprint. It’s a non-standard
    representation, however. Feel free to experiment with randomart, but don’t assume
    it’s universally available.


    ## Host Keys and the PuTTY Client


    The first time you connect to a server with PuTTY, you’ll get a warning much like
    Figure 4-1.


    ![](image0.jpg)


    Figure 4-1: PuTTY Key Fingerprint Message


    Compare the key fingerprint shown in the client to the key fingerprint in your
    list. Note that PuTTY negotiated a connection using an RSA key, which is different
    that the ECDSA key agreed on between OpenSSH and its OpenSSH server.


    If the keys match and you want PuTTY to cache the key for future reference and
    then connect, hit Yes.


    If the keys match, and you want PuTTY to connect without caching the key, hit
    No.


    If the keys do not match, hit Cancel to terminate the connection. The host you’re
    connecting to is not the host you think you’re connecting to. Verify that you
    entered the correct hostname, then notify your sysadmin and/or security team of
    the non-matching host key.


    ## When Keys Don’t Match


    If a host key has changed, you’ll get a message much like this.


    ```bash

    $ ssh gluttony

    ```


    @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@


    @ WARNING: REMOTE HOST IDENTIFICATION HAS CHANGED! @


    @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@


    It’s possible that an intruder controls the server or has diverted your connection
    to a different server. You, the sysadmin, and/or your security team, are about
    to have a bad day.


    The only way to know which? Talk to the sysadmin. DO NOT CONNECT TO THE SERVER
    UNTIL YOU KNOW WHY THE KEY CHANGED. All of these are serious errors that require
    investigation.


    If the key changed for a legitimate reason, verify the new key. If the new key
    is correct, replace the old key with the new.


    Offending ECDSA key in `/home/mwlucas/.ssh/known_hosts`:


    Add correct host in `/home/mwlucas/.ssh/known_hosts` to get rid of this message.


    IT IS POSSIBLE THAT SOMEONE IS DOING NASTY!


    It is also possible that the host key has just changed. The fingerprint for gluttony.mw.io
    has changed and you have requested strict checking.


    Host key verification failed.


    Scary-looking stuff? It should be. Something has happened. Your SSH client is
    screaming that something is Very Wrong. If your laptop was an ambulance, the lights
    would be spinning and the siren blaring. The super-secret host key pair used to
    identify this system has changed.

