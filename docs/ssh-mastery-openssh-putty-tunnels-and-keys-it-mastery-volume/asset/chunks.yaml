    two hosts that have never previously communicated?


    Every SSH server has a key pair. Whenever a client connects, the server and the
    client use this key pair to negotiate a temporary key pair shared only between
    these two hosts. The client and the server both use this temporary key pair to
    derive a symmetric key that they will use to exchange data during this session,
    as well as related keys to provide connection integrity. If the session runs for
    a long time or exchanges a lot of data, the computers will intermittently negotiate
    a new temporary key pair and new symmetric key. The SSH protocol is more complicated
    than this, and include safeguards to prevent many different cryptographic attacks,
    but cryptographic key exchange is the heart of the protocol.


    SSH supports many symmetric and asymmetric encryption algorithms. The client and
    server negotiate mutually agreeable algorithms at every connection. While OpenSSH
    offers options to easily change the algorithms supported and its preference for
    each, don’t! Programmers with more cryptography experience than both of us together
    arrived at OpenSSH’s encryption preferences after much hard thought, troubleshooting,
    and suffering. Gossip, rumor, and innuendo might crown Blowfish as the awesome
    encryption algorithm du jour, but that doesn’t mean you should tweak your OpenSSH
    server to use that algorithm and no other.


    The most common reason people offer for changing the encryption algorithms is
    to improve speed. SSH’s primary purpose is security, not speed. Do not abandon
    security to improve speed. You might encounter a device that only speaks older
    encryption algorithms. We’ll cope with those in Chapter 15, “OpenSSH Scraps.”


    Now that you understand how SSH encryption works, leave the encryption settings
    alone.


    # Chapter 2: Common Configuration


    The OpenSSH client and server share a common configuration syntax. We’ll discuss
    these common elements before delving into the details of either application. Sysadmins
    familiar with Unix-like systems should have no trouble with OpenSSH configuration.


    All system-wide OpenSSH configuration files reside in /etc/ssh by default. Some
    operating systems use an alternate location—for example, OSX uses /private/etc/ssh
    but symlinks /etc/ssh there, while FreeBSD’s add-on openssh-portable package uses
    /usr/local/etc/ssh. Once you find the configuration directory, you’ll find a pretty
    standard set of files.


    Default settings for the ssh(1) client appear in ssh_config.


    The files starting with ssh_host and ending in _key are the server’s private keys.
    The middle of each file name gives the encryption algorithm—for example, ssh_host_ecdsa_key
    contains the host key that uses the ECDSA algorithm. These files should only be
    readable by root.


    Each private key has a corresponding file with the same name but an added *.pub*
    at the end. This is the public key for that file. The server will offer the content
    of these files to any client.


    Finally, sshd_config contains the server configuration. While you can tweak sshd
    with command-line options, permanent configuration is handled in the configuration
    file.


    Both configuration files consist of a series of keywords, followed by the value
    that keyword is set to. These values can have any format that makes sense for
    the configuration target. Here’s how OpenSSH sets one common value.


    Port 22


    The keyword Port is set to 22. Presumably this makes sense for whatever the Port
    keyword is intended to represent. We’ll get to what that is in Chapter 3, “The
    OpenSSH Server.” You’ll also see keywords set to file paths. Here we see the value
    HostKey set to a file path in the /etc/ssh directory.


    HostKey /etc/ssh/ssh_host_ed25519_key


    Follow existing examples when setting any keyword. Always refer back to the man
    pages if you have trouble.


    The pound sign (#) indicates a comment. Everything on a line after a comment is
    ignored. The OpenSSH crew distributes their configuration files with all options
    set to the default and commented out. While sshd(8) requires a configuration file
    to start, you can create a valid, useful, and working configuration with touch
    sshd_config. The SSH client and server run just fine with everything at the default
    setting. The commented-out settings are provided as a convenient reference, that’s
    all.


    To change the defaults, remove the pound sign and change the value.


    ## Multiple Values


    Some environments need keywords set to multiple values. How you set those values
    depends on the keyword. Keywords like HostKey and Port can appear multiple times,
    each with a separate value.


    Port 22


    Port 2222


    Keywords like Host accept multiple values, separated by a space.


    Host envy.mwl.io avarice.mwl.io


    Other keywords, such as Address, expect comma-separated values.


    Address 192.0.2.0/25, 198.51.100.0/24'
