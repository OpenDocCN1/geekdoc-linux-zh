    # 保护 SSH 服务器


    任何面向互联网的服务器都有大量的随机攻击在试探它。蠕虫、脚本小子和其他各种杂碎之徒都非常想侵入你的计算机。退而言万，至少也可能有人想在上面运行一个 IRC
    机器人。你该如何保护你的 SSH 服务？


    有些人建议更改 `sshd` 使用的 TCP 端口。这是“通过隐蔽实现安全”的典型例子，这种方法行不通。扫描器会不断探测所有连接互联网的 IP 地址的所有端口，而且它们非常擅长识别哪些端口运行着什么服务。更改端口可能让你在面对专门的入侵者时赢得几分钟时间，但仅此如此。更改端口可以减少日志中随机噪声的数量，从而增加你发现真实问题的概率。


    你还会看到互联网上的某些人推荐使用不同的协议横幅（banner），这是一个糟糕的主意。当你使用 `netcat` 连接到 SSH 守护进程时，你会看到协议横幅。横幅标识了服务器类型。所有的
    SSH 服务器略有不同，并且可能需要特殊的客户端设置。SSH 客户端使用横幅来检测与服务器建立可靠连接所需的任何特性。如果你将协议横幅从 `SSH-2.0-OpenSSH_7.0`
    改为 `SSH-2.0-ParanoidWhackJob`，你就剥夺了客户端可靠连接所需的信息。


    你可能还会考虑添加解决方案来阻止反复连接但认证失败的 IP 地址，例如 `fail2ban` 和 `blacklistd`。实现细节差异很大，因此我不再详述，但它们值得考虑。


    在某种程度上，`sshd(8)` 通过特权分离（privilege separation）保护自己。只有服务的一小部分以 root 权限运行。服务器的大部分作为无权限用户运行。这意味着如果入侵者成功破入服务器守护进程，他只能对你的系统造成有限的破坏。这仍然非常烦人，但并非毁灭性的。


    此外，`sshd(8)` 通过沙箱（sandbox）限制无权限进程。沙箱限制 `sshd` 在用户认证之前可以调用的 syscall。OpenSSH 支持几种不同的沙箱方法，从
    Apple 的 `sandbox(7)` 到 Linux 的 `seccomp(2)` 不等。如果操作系统没有提供其他沙箱方法，`sshd` 将使用 `rlimit`
    将打开的文件数和子进程数设置为零。


    与所有面向互联网的服务一样，减少 SSH 服务风险的一种简单方法是减少可以访问它的 IP 地址数量。OpenSSH 尊重 TCP wrappers（`/etc/hosts.allow`）。如果你的服务器或网络有数据过滤器，请使用它。通过只允许授权的
    IP 地址访问你的 SSH 服务器，你可以阻止绝大多数攻击者。


    然而，保护服务器最有效的方法是禁用密码并仅允许通过密钥登录。我们在第 7 章“SSH 密钥”中介绍密钥访问。


    我们在介绍特定功能时会回到配置 `sshd`，但现在我们先聊聊服务器密钥。


    1 以及你需要施加身体伤害，直到特权分离重新开启。


    2 如果你不喜欢供应商提供的答案，请更大声且更具敌意地追问。


    3 规避公司防火墙对你就业的影响留给读者自行思考。


    # 第 4 章：验证服务器密钥


    如果你多疑，或者你已经当了一周多的系统管理员，你就需要确保正在登录的服务器确实是你认为的那个台服务器。服务器密钥有助于你在与错误的机器交换身份信息之前验证服务器的身份。


    通过未加密、未认证的协议建立的网络连接很容易被重定向到错误的机器。控制公共可访问设备（如服务器）的入侵者可以伪造另一台服务器的身份。用户登录伪造服务器时，会将用户名和密码交给入侵者。通常，入侵者会将会话转发到真实目的地，导致用户根本不知道自己被骗了。这是一种广泛存在的网络攻击；协议会变，应用会变，但中间人攻击永远存在。


    当正确部署和使用时，SSH 从根本上消除了这些攻击。即使入侵者可以伪造另一台机器，即使他复制了登录提示和操作系统版本，入侵者也无法复制服务器的私钥。SSH
    服务器密钥向客户端验证服务器身份。它们是重要的，而不是让你随手按回车接受。


    每个 SSH 服务器有一个或多个唯一的公密钥，如第 1 章所示。当 SSH 首次连接到 SSH 服务器时，它会向用户显示公公密钥指纹。用户预期将其与服务器密钥进行对比。如果匹配，用户告诉
    SSH 客户端缓存密钥并继续连接。如果密钥不匹配，用户将终止连接。


    在后续的所有连接中，客户端会将缓存的密钥与服务器提供的密钥进行比较。如果密钥匹配，连接继续。如果密钥不匹配，客户端假设发生了问题并请求用户干预。


    为了让 SSH 服务器密钥有用，你必须验证显示的密钥与目标服务器提供的密钥完全相同。然而，公密钥通常很长。


    密钥指纹


    密钥指纹是公密钥几乎人类可读的摘要。任何用户都可以获取公密钥指纹；如果你需要私钥指纹，则需要 root 权限。使用 `ssh-keygen(1)` 程序查看密钥指纹，使用
    `-l` 打印指纹并使用 `-f` 指定密钥文件。在这里我查看此主机的 ED25519 密钥指纹。


    ```

    $ **cd /etc/ssh**

    ```

