- fmt: '

    Double-click on WinSCP. Enter your username, password, and the hostname of your
    SSH server. WinSCP will log in and open a double window. The left side shows your
    local home directory, while the right side shows your home directory on the remote
    server. This is called a “Commander-Style” interface. Drag and drop files from
    one side to the other.


    You can tell WinSCP to use an “Explorer-style” interface. It will open a single
    window, styled exactly like every other Windows Explorer window, containing the
    remote host. To see a local directory, you must open a separate window. To enable
    Explorer style, select `Tools->Preferences->Interface` and choose `Explorer`.
    Your WinSCP now looks so Windows-like it’ll confuse even you.


    And thanks to WinSCP’s context menus, you can now right-click on a file and select
    `Send To WinSCP` to upload files.


    ## Configuring the SCP and SFTP Servers


    OpenSSH supports SCP and SFTP by default. Neither needs much configuration, but
    you can change a few things about how they behave.


    For SCP, the `scp(1)` program must be in the system’s default `$PATH`. If the
    SSH server can’t find `scp`, the user will get an error saying so. On or off,
    present or not: that’s your only option.


    The `sshd` server comes with an SFTP server, activated by an `sshd_config` entry.


    ```

    subsystem sftp /usr/libexec/sftp-server

    ```


    The mere presence of this entry suffices to enable SFTP support.


    ### SFTP-Only Users


    You probably have users that need access to copy files to or from a server, but
    don’t need shell access. OpenSSH supports SFTP-only users. This is most commonly
    combined with a chroot (Chapter 3), allowing the users to access only a part of
    the filesystem. You’ll see this in web servers that support multiple customers,
    where each site should be able to access only the files for their site.


    Where a chrooted user who needs shell access needs a bunch of files in their chroot,
    an SFTP-only user needs only an `sshd_config` keyword.


    Start by creating a group for SFTP-only users. I’ve called mine `sftponly`. By
    using a `Match` term in `sshd_config`, I deny these users access to anything beyond
    their home directory and only permit them SFTP access.


    ```

    Match Group sftponly

    ChrootDirectory %h

    ForceCommand internal-sftp

    AllowTcpForwarding no

    ```


    We use the `ChrootDirectory` keyword to lock the user in one directory. The `ForceCommand`
    keyword restricts the user into accessing only one command. That’s it! The internal
    SFTP server provides all the userland commands and device node access the user
    might need.


    ### Disabling SSH File Copy


    You might want to disable the ability to copy files over SSH while still allowing
    users command-line access. This is really, really hard. You can remove `/usr/libexec/sftp-server`
    and `/usr/bin/scp` from your host and disable SFTP in `sshd_config`, but that
    only disables the obvious ways to copy files. Users are tricky little critters,
    especially frustrated users who think that the sysadmins are blocking them from
    doing their job. Users can copy files through any number of methods. Many of these
    send unencrypted data across the network. A user with shell access can always
    copy files from one host to another.


    If you must prevent users from copying files, use chroots and limit what files
    the users can access. They’ll still be able to copy files, but only the files
    in the chroot.


    # Chapter 7: SSH Keys


    An SSH host key identifies a server. SSH also supports authenticating users with
    keys. Using keys to authenticate users requires more setup ahead of time than
    passwords, but when correctly done is both far more secure and much more convenient.
    We’ll consider both server and user keys.


    ## Manually Creating Server Keys


    If an intruder compromises your server, the server’s private key is no longer
    private. You must replace it. This requires generating a new key pair. While most
    operating systems automatically create missing host keys, others don’t. Use `ssh-keygen(1)`
    to manually create server keys.


    If your server runs a recent OpenSSH version, run `ssh-keygen -A` as root to automatically
    generate all supported but missing host keys.


    You might need to create host keys for a host other than the local host, such
    as when deploying new installs using some orchestration systems. You can create
    key files manually using the `-t` and `-f` arguments to `ssh-keygen`.


    ```bash

    $ ssh-keygen -t ecdsa -f ssh_host_ecdsa_key -N ''''

    $ ssh-keygen -t ed25519 -f ssh_host_ed25519_key -N ''''

    ```


    The `-t` flag specifies the type of key to create. Here we create two different
    types of keys, ECDSA, and ED25519. The `-f` flag gives the file name of the private
    key file. The public key for each key pair is in a file of the same name with
    `.pub` added to the end. Finally, `-N` lets you specify a passphrase on the command
    line. Host keys have no passphrase. The two single quotes indicate an empty passphrase.


    Whenever you generate host keys, be sure to get the key fingerprints as discussed
    in chapter 4. Your users will need the fingerprints to verify the host keys.


    ## Passphrases


    What’s this passphrase thing I just mentioned? A passphrase is like a password,
    but longer. It includes spaces, words, special characters, numbers, and anything
    else you can type. The passphrase is used to encrypt and decrypt the private key.
    A key with a passphrase cannot be used until someone enters the correct passphrase.


    Passphrases are most often used with user keys. Desktop and laptop systems are
    usually less secure than servers, and get infected, hijacked, or outright stolen
    depressingly often. If your key pair is stolen, the intruder can access servers
    just if he was the legitimate user. Encrypting the private key with the passphrase
    means that even if the key file is stolen, the intruder cannot use it. If an intruder
    gets either your key file or your passphrase, but not both, the damage is contained.
    Make the passphrase too long to guess by brute force and sufficiently complex
    to discourage casual eavesdropping.


    Can a passphrase be a single word, like a password? Yes, but it’s a really bad
    idea. Computers are now so fast that they can discover short passwords by trying
    all possible passwords in succession. Using a short passphrase considerably reduces
    your private key’s security.


    A passphrase should be at least several words long, something you can easily remember,
    and shouldn’t be obvious to others—even to people who know you. It should include
    special characters such as `#`, `!`, `~`, and so on. Peculiar words from specialized
    non-computing vocabularies are useful. Substitute numbers for letters. Never use
    anything from pop culture, and never use any of your own personal catchphrases.
    Anything you’ve said to friends or coworkers that was catchy enough to repeat
    is a poor choice. If your imagination completely fails, Diceware (http://www.diceware.com)
    is a tool for randomly generating mostly-memorable passphrases from real words
    using ordinary dice. While intruders can ruin your week, a coworker with your
    private key and a sense of humor can be even more aggravating.


    Host keys do not use passphrases, because the SSH service must start when the
    system boots. You could use a passphrase with the server key, but SSH would not
    start until someone entered the passphrase at the server console. This is unacceptable
    in most environments.


    ## User Keys


    User key pairs provide stronger authentication than passwords. Combined with agents
    (see “SSH Agents” later this chapter), user keys eliminate the need to type any
    authentication credentials into remote machines. Cryptographically, user keys
    are identical to host keys. The only difference is where the keys are used.

