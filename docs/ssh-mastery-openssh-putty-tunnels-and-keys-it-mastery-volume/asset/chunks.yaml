- fmt: '

    Sometimes you want to test changes without mucking with a working configuration,
    or maybe you have an automated process that needs a special configuration file.
    To use a configuration file other than `ssh_config`, specify it on the command
    line with the `-F` option.


    ```

    $ ssh -F test-config avarice

    ```


    You can now experiment with features without breaking your working configuration.


    If you have enough hosts, you might consider establishing canonical hostnames
    in `ssh_config`.


    ### Canonical Hostnames


    On a large enough network, or in an orchestrated environment where servers are
    dynamically created and destroyed, listing all of your SSH servers quickly becomes
    unrealistic. The `CanonicalizeHostname` keyword tells `ssh` to rewrite standalone
    `Host` entries in `ssh_config` into specific domains, and then (if they exist)
    use that hostname for configuration and key management. This lets you eliminate
    many lengthy `Host` keywords. Set `CanonicalizeHostname` to `yes` and `CanonicalDomains`
    to your domain. Consider the following configuration:


    ```

    CanonicalizeHostname yes

    CanonicalDomains mwl.io

    Host *.mwl.io

    Port 2222

    ```


    The next time I run `ssh gluttony`, `ssh` checks to see if there’s a hostname
    `gluttony.mwl.io`. If that hostname exists, `ssh` evaluates `ssh_config` as if
    I’d run `ssh gluttony.mwl.io`. This connection gets the special rules that apply
    to hosts in the `mwl.io` domain.


    You can list multiple canonical domains. The canonical names are tested in the
    order they’re listed, and the first match wins. Consider an entry like this.


    ```

    CanonicalDomains mwl.io michaelwlucas.com

    ```


    When I run `ssh wrath`, `ssh(1)` searches for `wrath.mwl.io`. If it finds that
    host, it opens a connection. If it can’t find that host, `ssh` searches for `wrath.michaelwlucas.com`.


    If you activate hostname canonicalization, `ssh` defaults to trying to canonicalize
    hosts with one or fewer dots in them. This lets canonicalization catch subdomains,
    like `www.detroit.mwl.io` for `www.detroit`. To change the maximum number of dots
    in the hostname, use the `CanonicalizeMaxDots` keyword. Here I allow zero or fewer
    dots.


    ```

    CanonicalizeMaxDots 0

    ```


    OpenSSH has a few other hostname canonicalization features, discussed in `ssh_config(5)`.


    ## Common SSH Options


    The most common features people use are changing the username, the port, or adding
    SSH options.


    ### Changing Usernames


    Most SSH clients assume that your username is identical on both the client and
    server, and tries to log into the remote system with the same username you have
    on the local machine. On most of my systems, my username is `mwl`. Occasionally
    someone creates an account for me with a different username, like `mlucas` or
    `lucas` or `michael` or `jerkface`. I must tell `ssh` to use that username on
    the remote system. Do this by putting the user account name, followed by the `@`
    symbol, then the remote machine name.


    ```

    $ ssh jerkface@devio.us

    ```


    You can also specify a username with `-l`.


    ```

    $ ssh -l jerkface devio.us

    ```


    If this is an ongoing thing, specify the username in `ssh_config` with the `User`
    option.


    ```

    Host devio.us

    User jerkface

    ```


    By storing usernames in `ssh_config`, I can forget about them and free up valuable
    brain space.


    ### Changing Port


    Some sites run SSH on a port other than 22, usually to provide an appearance of
    improved security. It doesn’t actually secure SSH, but it does reduce log noise.
    Use `-p` and a port number to change the port `ssh` connects to. If your server
    runs `sshd` on port 2222, connect with:


    ```

    $ ssh -p 2222 gluttony

    ```


    You can specify the port in `ssh_config`.


    ```

    Port 2222

    ```


    Again, I recommend storing permanent connection information in `ssh_config`.


    ### SSH Options on the Command Line


    SSH isn’t just a command; it’s a protocol. And that protocol has all sorts of
    edge cases. Sometimes you’ll need to set some of those edges on the command line.
    While everything OpenSSH supports is available as an `ssh_config` keyword, not
    all of those keywords have command-line equivalents. To set those keywords on
    the command line use the `-o` command-line option, the option name, an equals
    sign, and the value of that keyword.


    ```

    $ ssh -o Port=2222 sloth

    ```


    This example is trivial—the `Port` keyword has a dedicated command-line option,
    `-p`. We’ll see more complicated examples later.


    ### Evaluating your SSH Configuration


    You can set command-line options, options in the user’s configuration file, and
    options in the global client configuration file. `Host` keywords can muck up your
    carefully adjusted defaults, or your carefully adjusted defaults can require you
    to use `Host` keywords for specific servers. How do you know what options `ssh(1)`
    is really using when you connect to a host?


    Use the `-G` option to `ssh`. It tells `ssh(1)` to parse all the configurations
    for the target host, print out the configuration it’s going to use, and immediately
    exit without connecting. You can review your settings to verify you’re getting
    what you need.


    ## SSH Jump Hosts


    Sysadmins often have to pass through one host to get to another. Maybe you trust
    this intermediate host. Maybe you don’t. OpenSSH supports jump hosts, letting
    you use an SSH server as a relay to connect to a second server. Yes, you could
    do this manually by logging into the intermediate host and running `ssh` again,
    but using the built-in support means that the jump host sees none of your plain
    text. The jump host has no control over the options your client and the target
    server negotiate. This means you can, say, forward X or your SSH agent through
    a jump host that accepts neither. Specify a jump host with `-J`.


    ```

    $ ssh -J mwl@envy pride

    ```


    Set a jump host in `ssh_config` with the `ProxyJump` keyword.


    ```

    Host pride.mwl.io

    ProxyJump mwl@envy.io

    ```


    ## Addressing Options


    The OpenSSH client lets you choose how it uses TCP/IP, by setting the address
    family and the source address.


    ### IP Protocol Version


    Hosts can have both IPv4 and IPv6 addresses. The `AddressFamily` keyword tells
    the client to connect with only IPv4 (`inet`) or with only IPv6 (`inet6`). The
    default is `any`, which means “connect over whichever protocol the system resolver
    returns an address for.” Sometimes, you’ll have better connectivity over one protocol
    or the other. If you get your IPv6 connectivity via a tunnel, using only IPv4
    for SSH might make sense. Similarly, if you have unlimited IPv6 connectivity,
    you might want to use IPv6 for everything. Here I deliberately disable IPv4.


    ```

    AddressFamily inet6

    ```


    You can choose to use only IPv4 with the `-4` command-line option.


    ```

    $ ssh -4 lust

    ```


    Force IPv6 with `-6`.


    ### Set Source Address


    Hosts with multiple IP addresses on a single interface default to originating
    all connections from that interface’s primary IP address. This is not always desirable.
    Services can migrate from host to host, often independently of any firewall changes.
    You can tell `ssh` to use a source IP address other than the primary with the
    `BindAddress` keyword in `ssh_config`.


    ```

    BindAddress 192.0.2.91

    ```


    The `BindAddress` must be attached to the local machine. `BindAddress` has no
    convenient command-line flag. You must specify it with `-o`.

    '
