    In the Sessions PuTTY screen, go to `Host Name (or IP Address)`. Enter the hostname
    or IP address of your SSH server. You can also change the port number here if
    needed. Click `Open` at the bottom of the window.


    The PuTTY configuration window will disappear, replaced by a black terminal window.


    ### Saving PuTTY Connections


    You can preconfigure PuTTY connections, ensuring that your sessions with a particular
    host happen the same way every time. Enter the SSH server’s hostname under `Host
    Name (or IP Address)`. Under `Saved Sessions`, type a name for this connection.
    I usually name my connections after the host, plus possibly a word or two for
    any special configuration in the session. I might have a connection labeled `dns1`,
    and another named `dns1 with X`, so that I can easily use `X` forwarding when
    I need it.


    To run a saved connection, double-click the connection name.


    To copy a saved connection, highlight it, click `Load`, make your changes, and
    save it under a different name.


    ### PuTTY Management


    You’ll see a PuTTY icon in the upper left-hand corner of your work running PuTTY
    session. This leads to a drop-down menu of useful tasks.


    To duplicate an existing session, opening a second window to the same host, select
    `Duplicate Session`.


    To open a new window to a host that you’ve already save the configuration for,
    select `Saved Sessions` and the session name.


    To open a window to a completely new host, select `New Session`.


    ### PuTTY Copy and Paste


    PuTTY does not use the standard Windows cut-and-paste shortcuts. It works more
    like a UNIX-style `X` terminal. To copy text in a PuTTY window, highlight it with
    the mouse. To paste text into a PuTTY window, click the right mouse button. You
    can also use `SHIFT-INSERT`.


    ### PuTTY Configuration


    PuTTY stores its configuration and host key cache in the Windows Registry, under
    `HKEY_CURRENT_USER\Software\SimonTatham`. To move your PuTTY configuration from
    one host to another, copy this section of the registry to your new machine. Some
    people even use these registry settings to distribute valid PuTTY configurations
    to their users via Active Directory.


    ### Debugging PuTTY


    PuTTY has two debugging facilities: the Event Log and the session log.


    The Event Log records what happens during the current SSH session. You can see
    the name, IP address, and port you’re connected to, selected encryption algorithms,
    and all the various negotiations required to establish an SSH session. To view
    the Event Log, click the upper left corner of your PuTTY window and go down to
    Event Log.


    For serious debugging, use a session log. Before opening your SSH connection,
    take a look at the left-hand pane. Under `Session` you’ll find the `Logging` option.
    Choose it. This window gives you several options for logging your SSH session.
    I usually choose `All session output`. Give PuTTY a name for the log file, and
    browse to select a directory. Once your session has been running a while, this
    file will contain a large amount of detail about the session, much like the OpenSSH
    clients debugging option.


    ### Changing Live PuTTY Sessions


    You can alter some of the settings in an existing PuTTY session. The username
    and encryption information are set at login, but you can change logging, terminal
    behavior, and tunnel settings.


    Go to the upper left-hand corner of your existing PuTTY session, and click the
    PuTTY icon. From the drop-down menu, choose `Change Settings`. This brings up
    a simplified New Session window, presenting only the options that you may change.
    Once you make your edits, and have confirmed that the session works the way you
    desire, you can save the session, either overwriting the existing name or choosing
    a new name.


    ## Multiplexing Connections


    SSH sessions can take a long time to open, particularly if the SSH server can’t
    find a reverse DNS entry for the client’s IP address. Or you might have a naïve
    firewall that limits the number of simultaneous connections between network segments.
    Perhaps one of the machines is so old that the initial key exchange takes several
    seconds. SSH supports connection multiplexing for these situations, permitting
    you to run several SSH sessions over one TCP connection. While this doesn’t get
    rid of the delay for the first connection, additional sessions start much more
    quickly.


    PuTTY supports and uses connection multiplexing by default. OpenSSH can multiplex
    connections, but requires additional configuration.


    ### Configuring Multiplexing


    OpenSSH’s `ssh` client uses UNIX sockets to manage multiplex connections. The
    user must create a directory for the sockets and set the permissions so that only
    she can read them.


    ```

    cd $HOME/.ssh

    mkdir sockets

    chmod 700 sockets/

    ```


    You can now enable multiplexing in `ssh_config`.


    ```

    ControlMaster auto

    ControlPath ~/.ssh/sockets/%r@%h:%p

    ```


    The `ControlMaster` setting tells `ssh` to try to use connection multiplexing,
    but to fall back to a separate TCP connection should multiplexing fail. This lets
    you enable multiplexing as a default, but still connect to non-OpenSSH servers.


    `ControlPath` tells `ssh` where to find the multiplexing management files. This
    statement accepts tokens, much like `sshd_config`. The `%u` macro expands to the
    username, `%h` to the host, and `%p` to the port. If I connect to the host `avarice`
    on port `2222` as the user `mwl`, SSH automatically creates the socket file `mwl@avarice:2222`
    in the specified directory.


    PuTTY enables connection multiplexing by default. To turn it off before opening
    a session, open PuTTY and select `SSH` from the left-hand pane. You’ll see a checkbox
    called `Share SSH connections if possible`. Unselect it.


    ### Risks of Multiplexing


    Anyone who can read OpenSSH’s multiplexing control files or access PuTTY’s sockets
    can access all data going over your connection. The original connection has already
    authenticated, so an intruder wouldn’t even need your password to get a terminal.
    Only use connection multiplexing on clients where you trust everybody.


    Copying a large file over a multiplex SSH session can slow down your other sessions.


    X forwarding does not work well with multiplexing.


    Remember that when multiplexing, all of your SSH connections to a server run over
    the first connection you opened to the host. If that connection fails, all connections
    multiplexed with it will also fail.


    Personally, I only enable multiplexing on single-user desktop systems. Others
    disagree with me. Do what makes sense for your environment.


    ## Compression


    You’ll hear in many places that SSH can compress data before sending it over the
    network. This was very useful back when a 33.6 modem was the standard way for
    people to connect from home. On modern multi-megabit connections, compression
    normally slows down connections. Consider using compression if and only if you
    are seriously bandwidth-constrained.


    The one case where compression makes sense is in forwarding X (Chapter 8). Adding
    the `-C` flag to `ssh(1)` can as much as double throughput of forwarded X connections.


    That covers the basics of PuTTY and the OpenSSH client. Now let’s look at using
    SSH to move files around the network.

