    ![](image5.jpg)


    Figure 9-1: Local Port Forwarding Data Flow


    *Remote port forwarding* works in reverse. A port on the SSH server is forwarded
    to a port on your SSH client. You’re saying, “take such-and-such port on my client
    and attach it to the remote server.” For example, you could enable sshd on your
    workstation behind the corporate firewall. Then you SSH from your workstation
    to your server on the public Internet. With remote port forwarding, you could
    forward port 2222 on your public Internet server to the SSH port on your workstation.
    Anyone who connected to port 2222 on your public server would be transparently
    connected to your workstation’s SSH server. They could get inside the firewall
    without any VPN client and with complete disregard for firewall policies. You
    might use remote port forwarding to make a private web server publicly available.
    Figure 9-2 illustrates remote port forwarding.


    ![](image6.jpg)


    Figure 9-2: Remote Port Forwarding Data Flow


    *Dynamic port forwarding* is a broader system, where many different client programs
    can connect to many different services. It creates a SOCKS proxy on the SSH client,
    and tumbles any requests to that proxy out through the server. A SOCKS proxy is
    a generic gateway that can carry any TCP/IP traffic. (SOCKS doesn’t actually stand
    for anything, by the way.) This gives anyone who connects to the proxy complete
    access to the server’s network. Figure 9-3 illustrates dynamic port forwarding.


    ![](image7.jpg)


    Figure 9-3: Dynamic Port Forwarding Data Flow


    When the underlying SSH session dies, all ports stop being forwarded. Chapter
    10 offers suggestions for keeping SSH sessions alive.


    With these possibilities, it’s easy to see why sysadmins love SSH, and why many
    corporate security departments forbid it.


    ## Privileged Ports and Forwarding


    On Unix-like systems, TCP ports below 1024 are reserved for system use. Only root
    can bind to these ports. As an unprivileged user, you can attach the local end
    of your SSH port forwarder to any port above 1024\. Forwarding a reserved port
    requires using SSH as root. Performing routine tasks as root is poor practice,
    so don’t do it without a really good reason.


    Only the side of the connection that is attaching to a privileged port needs to
    run as root. If you’re binding a reserved port on the client, run the client as
    root but to log into the server as a regular user. If you’re binding a reserved
    port on the server, you’ll need to log into the server as root. In the latter
    case, it’s a better idea to change the port so you don’t have to login directly
    as root.


    Microsoft systems do not implement privileged ports. Anyone can bind to any open
    port on the system. The absence of port restrictions creates all sorts of potentially
    amusing security issues, but it does make forwarding low-numbered reports no more
    difficult than forwarding any other port. You never need to run PuTTY as root.


    ## Local Port Forwarding


    Before setting up local port forwarding, verify that normal SSH works. Then figure
    out what service you want to forward, and what port that service runs on. Some
    typical choices are 80 (HTTP), 25 (SMTP), and 110 (POP3). The services that usually
    run on these ports are not normally encrypted.


    Now choose a local port you want to use for the forwarding. Some clients work
    well when run on any port. Almost any mail client lets you set a TCP port to check
    POP 3 on. Others… don’t. Websites frequently choke if you change the port number.
    If you don’t know how the protocol behaves when forwarded from one port to another,
    try it on a test server and see.


    For our local port forwarding examples, we’ll forward port 8080 on my client to
    port 80 on the server sloth. Now that TLS certificates are free, why would you
    need to do this? Some proprietary web-based applications don’t support TLS, and
    if you try to convert them to TLS they die screaming.[2](#section-0011.xhtml_ref_footnotebookmark_end_60_2)
    I’ll need to edit the client’s hosts file (either /etc/hosts or C:\Windows\System32\drivers\etc\hosts)
    to tell my client that the website has the IP address 127.0.0.1\. I’ll need a
    second alias so that I can SSH out to the actual machine. If I’m the only one
    that uses this application, once I have port forwarding setup I could tell the
    application to only listen on the server’s local host address. This would not
    only protect my data in transit as TLS would, it would add another layer of protection
    for the application.


    ### OpenSSH Local Forwarding


    To tell the SSH client to activate local forwarding, use the -L flag.


    $ **ssh -L localIP:localport:remoteIP:remoteport hostname**


    If you don’t specify an IP address on the SSH client, SSH attaches to 127.0.0.1\.
    You can skip the first argument in this case, making the command:


    $ **ssh -L localport:remoteIP:remoteport hostname**


    For now, only use the IP address 127.0.0.1\. This is the loopback address on every
    machine, accessible only on that machine. While it might look like we’re forwarding
    an address to the same address, 127.0.0.1 on the client is not the same as 127.0.0.1
    on the server. We’ll consider binding a forwarded port to a different IP address
    in “Choosing IP Addresses” later this chapter.


    So here’s how we use local port forwarding to connect to the server sloth, and
    forward port 80 on the localhost address of sloth to my client’s port 8080.


    $ **ssh -L 8080:127.0.0.1:80 sloth**


    I’m attaching to port 8080 on my workstation. I haven’t specified a local IP address,
    so ssh attaches the forwarding to the client’s 127.0.0.1\. My SSH session logs
    on normally, and gives me a terminal on the server. But if I point my web browser
    to localhost:8080, I’ll be connected to the website running on the server. An
    alias in the hosts file will make the website much more usable.


    To set up local port forwarding every time you connect to a server, use the LocalForward
    keyword in ssh_config.


    LocalForward client-IP:client-port server-IP:server-port


    This looks like port forwarding on the command line, but the middle colon is missing.
    Here I forward port 8080 on my workstation to port 80 on the server. We attach
    to the 127.0.0.1, or localhost, on both the client and the server. I’m using port
    8080 on the workstation because using port 80 would require running SSH as root
    every single time.


    Host envy.mwl.io


    LocalForward localhost:8080 localhost:80


    The LocalForward keyword most often appears with a Host statement, enabling local
    port forwarding when you connect to specific servers. To avoid IP and port conflicts,
    each server usually gets assigned its own local port.


    ### PuTTY Local Forwarding


    PuTTY has a special control panel just for port forwarding. On the PuTTY Configuration
    screen’s left side, select *Connection* -> *SSH* -> *Tunnels*, as shown in Figure
    9-4.


    ![](image8.jpg)


    Figure 9-4: PuTTY Port Forwarding


    With local port forwarding, PuTTY attaches to the client’s localhost address by
    default. I must specify the address on the SSH server to use, however. To forward
    port 80 on the SSH server to port 80 on my workstation, I’ll use the server’s
    localhost address. In *Source port*, enter 80\. In *Destination*, enter the IP
    address on the server, a colon, and the port to be forwarded. Here I’ll use 127.0.0.1:80.
    At the bottom, select *Local*. It should look like Figure 9-5.'
