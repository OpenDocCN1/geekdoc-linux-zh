- fmt: "\nAttacking public keys computationally, in the absence of a flawed implementation,\
    \ can take billions of years. Software has bugs, though, and it’s possible that\
    \ a bug might let an intruder crack a key in much less time. Also, those aeons\
    \ needed to computationally break a key are averages. The intruder might get lucky.\
    \ Eternally valid certificates increase the intruder’s chances of success.\n\n\
    How long should a certificate be good for? Rolling over certs every year or so\
    \ is most common. If you have one of those orchestrated networks where servers\
    \ appear and disappear by the magic of automatic deployment, you might want to\
    \ regenerate your host key certificates every week or month.\n\nIn short, never\
    \ plan to use certificates longer than a year, except in those rare cases where\
    \ a host cannot be changed. No, I don’t mean “the boss would really like this\
    \ host to never change,” I mean “the federal government has declared this host\
    \ a life-sustaining service and changing the certificate is a felony that carries\
    \ a minimum jail sentence.”\n\nDon’t set your certificates to expire in exactly\
    \ one year, though. Remember, life happens. Maybe you put on your calendar to\
    \ renew all of your certificates in 52 weeks, but you develop appendicitis the\
    \ day before and you’re off work for three weeks. I allow at least a month of\
    \ leeway for such emergencies, so these examples assume we expire all certificates\
    \ in fifty-six weeks and five days.\n\nBetter still? Use your automation system\
    \ to renew and replace all certificates at half their expiration date. Issue and\
    \ deploy new one-year certificates every six months. As you gain confidence in\
    \ your automation and work out the bugs, slowly decrease that time. Automatically\
    \ create new certificates every year, then every month, then every week. Then\
    \ reduce the time you use your CA keys. Making certificate renewals painlessly\
    \ routine can transform potential key compromises from disasters into trivialities.\n\
    \n# SSH CA Keys\n\nBefore you even think about creating an `OpenSSH CA`, consider\
    \ how you’re going to handle and secure those keys. Your certificate authority\
    \ is the key to your kingdom. Protect it as you would any other critical infosec\
    \ asset. An intruder that compromises your OpenSSH CA can create user keys trusted\
    \ by all of your servers. That would be bad. I keep my OpenSSH CA on a dedicated-purpose\
    \ OpenBSD machine that only gets booted when I need to sign keys. Larger organizations\
    \ will want to put their OpenSSH CA in the same part of the network where they\
    \ keep other, similarly critical hosts.\n\nBest practice recommends creating two\
    \ certificate authorities: one for certifying host keys, the other for user keys.\
    \ Different teams of people manage users and hosts, and having two different certificate\
    \ authorities allows each to use the workflows best suited to those tasks. Each\
    \ CA might even reside on different machines, in different parts of the network.\
    \ While you can install any number of certificate authorities on a host, making\
    \ it possible to split CAs later, very few sysadmins regret complying with such\
    \ a simple best practice from the beginning.\n\nAs your network grows, so will\
    \ the number of public keys you manage. Organize your CA well from the beginning\
    \ to minimize later struggle.\n\nI recommend putting your CA in a directory like\
    \ `/usr/local/sshca`. Create subdirectories for host and user keys, with unambiguous\
    \ names like `/usr/local/sshca/hosts` and `/usr/local/sshca/users`. Each host\
    \ and user should get its own subdirectory therein, such as `/usr/local/sshca/hosts/sloth`\
    \ and `/usr/local/sshca/users/mwl`. Don’t put your CA in `/root`, and especially\
    \ not `/root/.ssh`. Those directories are for the root account’s information,\
    \ much as `/etc/ssh` is reserved for this particular host’s SSH services. A certificate\
    \ authority is a major project, and deserves its own directory.\n\nWhy separate\
    \ by directory and not by filename? Each host and user has files with the same\
    \ name. You’ll find `/etc/ssh/ssh_host_ecdsa_key` on every single SSH server,\
    \ while every user has an `id_rsa.pub`. While it’s certainly possible to copy\
    \ that file on the host `sloth` to `sloth-ssh_host_ecdsa_key`, generate a cert\
    \ for it, and then rename the cert as you’re sending it back to the server, that’s\
    \ a couple extra steps. Giving each host and user unique directories decreases\
    \ fragility.\n\nCreate an SSH CA key the same way you would manually create a\
    \ host key. I add the `-c` flag to add a special comment to the key. SSH CA keys\
    \ look like every other SSH key, so the comment helps identify them. Here’s a\
    \ host key signing key.\n\n```bash\nssh-keygen -t rsa -f host-mwlca-key -c 'CA\
    \ host key generated 2017-11-30'\n```\n\nUse a good passphrase. You’ll be able\
    \ to use your SSH agent for mass signings, so feel free to make it complex. You’ll\
    \ get the file `host-mwlca-key` containing the private key for the certificate\
    \ authority, and the file `host-mwlca-key.pub` with the public key.\n\nCreating\
    \ a user-certifying CA is exactly the same, except for the file name and the comment.\n\
    \n```bash\nssh-keygen -t rsa -f user-mwlca-key -c 'CA user key generated 2017-11-30'\n\
    ```\n\nProtect these private keys. Feel free to spam your whole network with the\
    \ public keys, however.\n\n# Trusting Your Certificate Authority\n\nThe `ssh(1)`\
    \ client and `sshd(8)` server have completely different ways of configuring certificate\
    \ authorities.\n\n## sshd(8) and Certificates\n\nSSH servers use user certificates\
    \ to validate certificates used for authentication. Set a file containing all\
    \ of your trusted certificates in `sshd_config`, using the `TrustedUserKeys` keyword.\n\
    \n```text\nTrustedUserKeys /etc/ssh/user-ca-keys.pub\n```\n\nThe CA file contains\
    \ one CA public key per line, and accepts comments marked off with a pound sign\
    \ (`#`). It looks exactly like `authorized_keys`. \n\nRestart `sshd`, and it will\
    \ trust keys signed by this certificate authority.\n\n## ssh(1) and Certificates\n\
    \nSSH clients use host certificates to validate host keys. Configure trusted certificate\
    \ authorities in `known_hosts`. The most effective place for a CA key is in `/etc/ssh/known_hosts`,\
    \ both so that clients immediately recognize the CA and so users can’t mess with\
    \ the key. Add `@cert-authority` to the beginning of the line, then add an SSH\
    \ pattern for the hosts this key is valid for. This key is valid for all hosts\
    \ in themwl.io` domain.\n\n```text\n@cert-authority *.mwl.io ssh-rsa AAA3NzaC1yc2EAAAADAQ...\n\
    ```\n\nIf the key is valid for multiple domains, separate them with commas. Don’t\
    \ use spaces.\n\n```text\n@cert-authority *.mwl.io,michaelwlucas.com ssh-rsa AAA3NzaC1yc2EAAAADAQ...\n\
    ```\n\nAdd this line to `/etc/ssh/known_hosts` on each of your hosts. They will\
    \ immediately trust certificates signed with this key.\n\n# Common Certificate\
    \ Considerations\n\nBoth user and host certificates have a whole bunch of details\
    \ in common, including serial numbers, certificate IDs, and expiration date format.\n\
    \n### Certificate Serial Numbers\n\nEach X.509 certificate is supposed to have\
    \ a `serial number`. These serial numbers are unique to the certificate authority.\
    \ OpenSSH CAs support the same functionality, but SSH doesn’t really need it.\
    \ Use them if your organization has some separate need for them.\n\nSerial numbers\
    \ should not increase monotonically—that is, don’t issue them in sequential order.\
    \ Random serial numbers are best. If you decide to use serial numbers in your\
    \ SSH certificates, you’ll need a mechanism to generate unique random numbers.\n\
    \nI’ll mention how to list serial numbers when signing keys, but not spend any\
    \ time on them.\n\n### Certificate Identity\n"
  raw: 'Attacking public keys computationally, in the absence of a flawed implementation,
    can take billions of years. Software has bugs, though, and it’s possible that
    a bug might let an intruder crack a key in much less time. Also, those aeons needed
    to computationally break a key are averages. The intruder might get lucky. Eternally
    valid certificates increase the intruder’s chances of success.


    How long should a certificate be good for? Rolling over certs every year or so
    is most common. If you have one of those orchestrated networks where servers appear
    and disappear by the magic of automatic deployment, you might want to regenerate
    your host key certificates every week or month.


    In short, never plan to use certificates longer than a year, except in those rare
    cases where a host cannot be changed. No, I don’t mean “the boss would really
    like this host to never change,” I mean “the federal government has declared this
    host a life-sustaining service and changing the certificate is a felony that carries
    a minimum jail sentence.”


    Don’t set your certificates to expire in exactly one year, though. Remember, life
    happens. Maybe you put on your calendar to renew all of your certificates in 52
    weeks, but you develop appendicitis the day before and you’re off work for three
    weeks. I allow at least a month of leeway for such emergencies, so these examples
    assume we expire all certificates in fifty-six weeks and five days.


    Better still? Use your automation system to renew and replace all certificates
    at half their expiration date. Issue and deploy new one-year certificates every
    six months. As you gain confidence in your automation and work out the bugs, slowly
    decrease that time. Automatically create new certificates every year, then every
    month, then every week. Then reduce the time you use your CA keys. Making certificate
    renewals painlessly routine can transform potential key compromises from disasters
    into trivialities.


    ## SSH CA Keys


    Before you even think about creating an OpenSSH CA, consider how you’re going
    to handle and secure those keys. Your certificate authority is the key to your
    kingdom. Protect it as you would any other critical infosec asset. An intruder
    that compromises your OpenSSH CA can create user keys trusted by all of your servers.
    That would be bad. I keep my OpenSSH CA on a dedicated-purpose OpenBSD machine
    that only gets booted when I need to sign keys. Larger organizations will want
    to put their OpenSSH CA in the same part of the network where they keep other,
    similarly critical hosts.


    Best practice recommends creating two certificate authorities: one for certifying
    host keys, the other for user keys. Different teams of people manage users and
    hosts, and having two different certificate authorities allows each to use the
    workflows best suited to those tasks. Each CA might even reside on different machines,
    in different parts of the network. While you can install any number of certificate
    authorities on a host, making it possible to split CAs later, very few sysadmins
    regret complying with such a simple best practice from the beginning.


    As your network grows, so will the number of public keys you manage. Organize
    your CA well from the beginning to minimize later struggle.


    I recommend putting your CA in a directory like /usr/local/sshca. Create subdirectories
    for host and user keys, with unambiguous names like /usr/local/sshca/hosts and
    /usr/local/sshca/users. Each host and user should get its own subdirectory therein,
    such as /usr/local/sshca/hosts/sloth and /usr/local/sshca/users/mwl. Don’t put
    your CA in /root, and especially not /root/.ssh. Those directories are for the
    root account’s information, much as /etc/ssh is reserved for this particular host’s
    SSH services.  [2](#section-0016.xhtml_ref_footnotebookmark_end_65_2) A certificate
    authority is a major project, and deserves its own directory.


    Why separate by directory and not by filename? Each host and user has files with
    the same name. You’ll find /etc/ssh/ssh_host_ecdsa_key on every single SSH server,
    while every user has an id_rsa.pub. While it’s certainly possible to copy that
    file on the host sloth to sloth-ssh_host_ecdsa_key, generate a cert for it, and
    then rename the cert as you’re sending it back to the server, that’s a couple
    extra steps. Giving each host and user unique directories decreases fragility.


    Create an SSH CA key the same way you would manually create a host key. I add
    the -c flag to add a special comment to the key. SSH CA keys look like every other
    SSH key, so the comment helps identify them. Here’s a host key signing key.


    # **ssh-keygen -t rsa -f host-mwlca-key -c ''CA host key generated 2017-11-30''**


    Use a good passphrase. You’ll be able to use your SSH agent for mass signings,
    so feel free to make it complex. You’ll get the file host-mwlca-key containing
    the private key for the certificate authority, and the file host-mwlca-key.pub
    with the public key.


    Creating a user-certifying CA is exactly the same, except for the file name and
    the comment.


    # **ssh-keygen -t rsa -f user-mwlca-key -c ''CA user key generated 2017-11-30''**


    Protect these private keys. Feel free to spam your whole network with the public
    keys, however.


    ## Trusting Your Certificate Authority


    The ssh(1) client and sshd(8) server have completely different ways of configuring
    certificate authorities.


    ### sshd(8) and Certificates


    SSH servers use user certificates to validate certificates used for authentication.
    Set a file containing all of your trusted certificates in sshd_config, using the
    TrustedUserCAKeys keyword.


    TrustedUserCAKeys /etc/ssh/user-ca-keys.pub


    The CA file contains one CA public key per line, and accepts comments marked off
    with a leading pound sign (#). It looks exactly like an authorized_keys file.


    Restart sshd, and it will trust keys signed by this certificate authority.


    ### ssh(1) and Certificates


    SSH clients use host certificates to validate host public keys. Configure trusted
    host certificate authorities in known_hosts. The most effective place for a CA
    key is in /etc/ssh/ssh_known_hosts, both so that all clients immediately recognize
    the CA and so users can’t muck with the key.


    Don’t just copy the CA’s public key file to known_hosts, though. You must mark
    this key as a certificate authority and add the hostnames this key is valid for.
    Copy the public key to a separate file—never muck with your original key files!
    Add the marker @cert-authority to the beginning of the line, then add an SSH pattern
    for the hosts this key is valid for. This key is valid for all hosts in the mwl.io
    domain.


    @cert-authority *.mwl.io ssh-rsa AAAAB3NzaC1yc2EAAAADAQABA…


    If the key is valid for multiple domains, separate them with commas. Don’t use
    spaces.


    @cert-authority *.mwl.io,michaelwlucas.com ssh-rsa AAAAB3NzaC1yc2EAAAADAQABA…


    Add this line to /etc/ssh/ssh_known_hosts on each of your hosts. They will immediately
    trust certificates signed with this key.


    ## Common Certificate Considerations


    Both user and host certificates have a whole bunch of details in common, including
    serial numbers, certificate IDs, and expiration date format.


    ### Certificate Serial Numbers


    Each X.509 certificate is supposed to have a *serial number*. These serial numbers
    are unique to the certificate authority. OpenSSH CAs support the same functionality,
    but SSH doesn’t really need it. Use them if your organization has some separate
    need for them.


    Serial numbers should not increase monotonically—that is, don’t issue them in
    sequential order. Random serial numbers are best. If you decide to use serial
    numbers in your SSH certificates, you’ll need a mechanism to generate unique random
    numbers.


    I’ll mention how to list serial numbers when signing keys, but not spend any time
    on them.


    ### Certificate Identity'
