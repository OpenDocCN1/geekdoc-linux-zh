- pgno: 371
  md: '# 8.2 z/VM tools for error gathering and analysis


    As a z/VM system operator, your responsibility is to ensure that all the resources
    available to the z/VM LPAR are available to users to get their jobs done. Part
    of a system operator''s responsibilities includes collecting information about
    tasks:


    +   - Accounting

    +   - System performance

    +   - System events

    +   - Error recording


    A set of default users is available in z/VM to accomplish those tasks:


    +   - DISKACNT collects accounting and billing information.

    +   - OPERSYMP records symptoms records.

    +   - OPERATOR logs system events.

    +   - EREP records error records.


    To check the status of the various recordings on a z/VM system, the command query
    recording (abbreviated as q rec) can be used, as shown in Example 8-3.


    # Example 8-3 Output of the query rec command


    ```

    q rec

    RECORDING   COUNT   LMT USERID   COMMUNICATION

    EREP        ON      00000000 002 EREP      ACTIVE

    ACCOUNT     ON      00000000 020 DISKACNT  ACTIVE

    SYMPTOM     ON      00000000 002 OPERSYMP  ACTIVE

    Ready; T=0.01/0.01 14:58:23

    ```


    This chapter focuses on collecting systems events and error recording.


    # 8.2.1 Collecting information about system events


    When z/VM IPLs, the system operator machine (OPERATOR by default) is automatically
    logged on; if the NOAUTOLOG parameter has been specified at IPL time, no other
    machines are started. On the OPERATOR console, all system-related and error messages
    are displayed. All commands issued by the operator, and answers to these commands,
    are also displayed on the OPERATOR console.'
  merge: -1
  img_proc: true
- pgno: 372
  md: 'The system operator machine is defined in the z/VM configuration file, SYSTEM
    CONFIG, as shown in Example 8-4.


    # Example 8-4 System Userids configuration


    ```

    /*****************************************************************/

    /* System Userids */

    /*****************************************************************/


    System_Userids ,

    Operator OPERATOR ,

    Account DISKACNT ,

    Dump OPERATNS ,

    Erep EREP

    ```


    This console log can be saved to a spool file, so you can analyze it later. In
    case of a system abend, CP also automatically saves the console log to a spool
    file.


    # Status of console logging


    To determine whether the console activity is logged into a file, issue the command
    QUERY VIRTUAL CONSOLE (abbreviated as q v con), as shown in Example 8-5. The first
    line of the output says STOP, meaning console logging is not enabled.


    # Example 8-5 Status of console logging


    ```

    q v console

    00: CONS 0009 ON LDEV L0003 TERM STOP HOST TCPIP FROM

    9.57.138.243

    00: 0009 CL T NO CONT NOHOLD COPY 001 READY FORM STANDARD

    00: 0009 TO LNXGUI PRT DIST LNXGUI FLASCH 000 DEST OFF

    00: 0009 FLASH CHAR MDFY 0 FCB LPP OFF

    00: 0009 3215 NOEOF 0008 NOKEP NOMS G NOMAME

    00: 0009 SUBCHANNEL = 0008


    Ready; T=0.01/0.01 15:28:01

    ```


    # Enabling console logging


    To enable console logging in a virtual machine, such as LNXGUI, use the command
    CP SPOOL CONSOLE START (abbreviated as cp sp con start), as shown in Example 8-6.
    Check the status again with query console. The first line of the output should
    say START, meaning console logging is started.'
  merge: -1
  img_proc: true
- pgno: 373
  md: '# Example 8-6 Enabling console logging


    ```

    q v console

    00: CONS 0009 ON LDEV L0003 TERM STOP HOST TCPIP FROM 9.57.138.243

    00: 0009 CL T NOCONT NOHOLD COPY 001 READY FORM STANDARD

    00: 0009 TO LNGXGUI PRT DIST LNGXGUI FLASHC 000 DEST OFF

    00: 0009 FLASH CHAR MDFY 0 FCB LPP OFF

    00: 0009 3215 NOEOF CLOSED NOKEEP NOMSG NONAME

    00: 0009 SUBCHANNEL = 0008

    Ready; T=0.01/0.01 15:28:01

    cp spool console start

    Ready; T=0.01/0.01 15:31:13

    q v console

    00: CONS 0009 ON LDEV L0003 TERM START HOST TCPIP FROM 9.57.138.243

    00: 0009 CL T NOCONT NOHOLD COPY 001 READY FORM STANDARD

    00: 0009 TO LNGXGUI PRT DIST LNGXGUI FLASHC 000 DEST OFF

    00: 0009 FLASH CHAR MDFY 0 FCB LPP OFF

    00: 0009 3215 NOEOF OPEN 00039 NOKEEP NOMSG NONAME

    00: 0009 SUBCHANNEL = 0008

    Ready; T=0.01/0.01 15:31:19

    ```


    In Example 8-7, we ensure console logging is activated next time the virtual machine
    IPLs, by adding the statement CP SPOOL CONSOLE START to the LNGXGUI machine PROFILE
    EXEC.


    # Example 8-7 Updating PROFILE EXEC


    ```

    PROFILE EXEC A1 V 130 Trunc=130 Size=3 Line=0 Col=1 Alt=2


    ==== * * * Top of File * * *

    |...+....1....+....2....+....3....+....4....+....5....+....6....+....7...

    ==== /* */

    ==== ''CP SET PF12 RETR''

    ==== ''CP SPOOL CONSOLE START''

    ==== * * * End of File * * *


    ===>

    X E D I T 1 File

    ```


    # Saving console log to a file


    To save the console log to a file, you must stop console logging. A file is then
    created in the machine''s virtual printer. This file can either be printed directly
    or sent to the virtual reader for further processing. Example 8-8 on page 359
    shows the commands used for this purpose.'
  merge: -1
  img_proc: true
