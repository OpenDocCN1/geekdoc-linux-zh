    # 2.3.8 Language Environment


    Language Environment provides the runtime environment for programs written in
    C/C++, COBOL, or PL/I languages. Language Environment helps you create mixed-language
    applications and gives you a consistent method of accessing common, frequently-used
    services.


    Language Environment consists of the following features:


    +   - Basic routines that support starting and stopping programs, allocating storage,
    communicating with programs written in different languages, and indicating and
    handling conditions.

    +   - Common library services, such as math services and date and time services,
    that are commonly needed by programs running on the system. These functions are
    supported through a library of callable services.

    +   - Language-specific portions of the runtime library are consistent. Because
    many language-specific routines call Language Environment services, behavior is
    consistent across languages.'
