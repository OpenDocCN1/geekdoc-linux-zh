- pgno: 334
  md: '# Performance monitoring and system analysis


    In this chapter, we introduce z/VM scheduling concepts and monitoring commands,
    and relate those commands to z/OS equivalents. We also introduce z/VM monitoring
    tools and performance tuning concepts. The chapter also discusses concepts and
    techniques related to monitoring Linux running on System z.


    # Objectives


    After completing this chapter, you should be able to:


    +   - Understand the basics of z/VM scheduling concepts

    +   - Understand the usage of CP commands related to performance monitoring

    +   - Describe z/OS commands and monitoring concepts

    +   - Identify the monitoring tools available for z/VM

    +   - Discuss system monitoring best practices'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# 7.1 Monitoring z/VM


    This section introduces z/VM scheduling basics, and System z/VM and Linux monitoring
    commands.


    Many aspects can be considered when you look at the performance of a z/VM system,
    including the following areas:


    +   - User response time

    +   - Throughput

    +   - Device utilization

    +   - Number of users supported

    +   - Reliability

    +   - System capacity


    If you are familiar with z/OS, you might have heard about or worked with the z/OS
    Workload Manager (WLM) component. It provides the ability to dynamically allocate
    or redistribute server resources, such as CPU, I/O, and memory, for a set of workloads
    based on user-defined goals and their resource demand within a z/OS image.


    For more information about the z/OS WLM, refer to:


    http://www-03.ibm.com/servers/eserver/zseries/zos/wlm/pdf/zWLM.pdf


    # 7.1.1 z/VM scheduling


    To understand z/VM performance parameters and factors, it is important to be aware
    of the underlying system scheduling.


    In z/OS, job control language (JCL) is used to tell the system which programs
    to execute, followed by a description of program inputs and outputs. JCL consists
    of a series of statements, each of which provides specific instructions or information
    for batch processing jobs. It provides the system with a source of information
    about details such as the programs to execute, the location of required data sets,
    the department to be billed for CPU processing time, and the job priority. The
    system uses a job entry subsystem (JES) to receive jobs into the operating system,
    schedule them for processing by MVS, and control their output processing. JES2
    and the base control program (BCP) provide the necessary functions to get jobs
    into, and output from the MVS system.'
  merge: -1
  img_proc: true
- pgno: 336
  md: 'z/VM employs similar scheduling concepts where the Control Program (CP) and
    the Scheduler cooperate to perform the scheduling tasks, which involve a number
    of components illustrated in Figure 7-1.


    ![](img/b0a4b9056f819dccd4781a5105c92d45_336_0.png)


    Figure 7-1 z/VM scheduling components


    # The scheduling components


    The scheduling components and how they all work together are described in this
    section.


    # Dormant list


    If any virtual machine is not doing any processing, the CP moves it to the dormant
    list. The virtual machine is now asleep.


    # Eligible list


    A sleeping virtual machine can wake up in response to an event, such as pressing
    the Enter key on the console for example. The virtual machine is then moved to
    the eligible list and it becomes eligible to consume system resources.'
  merge: -1
  img_proc: true
- pgno: 337
  md: '# Scheduler


    The scheduler examines the list of eligible virtual machines before they are given
    system resources. Specifically, the scheduler looks at the virtual machines definition
    (VMDBK) information for resources that have been consumed in the past, such as
    processor, storage, and paging.


    # Dispatch list


    If the scheduler determines that enough resources are available to satisfy your
    requirements without putting any other virtual machine in jeopardy, the virtual
    machine is moved to the dispatch list.


    # Time slice


    Virtual machines in the dispatch list wait in a queue for their share of CPU time,
    usually referred to as a time slice. Virtual machines that have more work to do
    can stay in the dispatch list to get another time slice.


    # User classes


    When you first log on to z/VM, the Control Program creates an area of storage
    that contains information pertinent to the operation that you are associated with.
    This storage area is called a Virtual Machine Definition Block (VMDBK). Pointers
    to this block get moved around the lists as shown in Figure 7-1 on page 321.


    # Scheduling and user classes


    z/VM categorizes users under four distinct classes. User class affects how the
    scheduler handles the user''s scheduling scheme. For example, users in class 1
    are assumed to be running short processing transactions. Users in this class are
    given times slices and are expected to complete their processing within that time
    slice. However, if users have visited the dispatch list more than once and have
    not completed their processing, the dispatcher can upgrade the user to class 2.
    Class 2 users are allowed to stay in dispatch list for longer intervals to finish
    their medium-length transactions.


    Table 7-1 describes the user classes implemented in z/VM.


    # Table 7-1 User Classes and their description


    | User class | Description |

    |------------|-------------|

    | Class 0 | Users who were added to the dispatch list with no delay in the eligible
    list, regardless of the length of their current transaction. |

    | Class 1 | Users who have just begun a transaction, and therefore are assumed
    to be currently processing short transactions. |'
  merge: -1
  img_proc: true
- pgno: 338
  md: '| User class | Description |

    |---|---|

    | Class 2 | Users who did not complete their current transactions during their
    first dispatch list stay and therefore are assumed to be running medium-length
    transactions. |

    | Class 3 | Users who did not complete their current transactions during their
    second dispatch stay and therefore are assumed to be running long transactions.
    |


    If you have command privilege class E, you can issue the following CP command
    to view information about these classes of user:


    ```

    INDICATE LOAD

    ```


    In Example 7-1, the Q with a number (Qn) indicates users in the dispatch list,
    for example Q2; the E with a number (En) indicates users in the eligibility lists,
    for example E2. The n is the class of the user 0, 1, 2, or 3.


    > Note: Any values in the En fields normally indicates a performance problem (Probably
    a storage or paging constraint).


    # Example 7-1 INDicate LOAD command


    ```

    ind load

    AVGPROC-000% 04

    XSTORE-000000/SEC MIGRATE-0000/SEC

    MDC READS-000001/SEC WRITES-000000/SEC HIT RATIO-099%

    PAGING-1/SEC STEAL-000%

    Q0-00000(00000)                      DORMANT-00012

    Q1-00000(00000)      E1-00000(00000)

    Q2-00000(00000) EXPAN-001 E2-00000(00000)

    Q3-00000(00000) EXPAN-001 E3-00000(00000)


    PROC 0000-000% CP      PROC 0001-000% CP

    PROC 0002-000% CP      PROC 0003-000% CP


    LIMITED-00000

    ```


    # 7.1.2 CP monitoring commands


    This section introduces basic z/VM commands. If you are familiar with z/OS, you
    will find references to the equivalent or similar commands of z/OS to help you'
  merge: -1
  img_proc: true
- pgno: 339
  md: 'expand your existing knowledge of z/OS. If you are not familiar with z/OS,
    this section can help you understand the basic functionality available with z/VM.


    # CP commands


    Performance management in a z/VM system requires tools to collect and analyze
    data, and to control resource usage by virtual machines. These tools are provided
    by the Control Program (CP) by means of commands and monitoring functions.


    The four CP command groups described in this section are:


    +   - CP INDICATE

    +   - CP QUERY

    +   - CP MONITOR

    +   - CP SET


    We present these commands and their most commonly used parameters.


    # CP INDICATE


    The CP INDICATE commands give a snapshot of resource utilization. Because it is
    only a snapshot, however, commands must be issued several times and the results
    examined for changes.


    Some of the commands have an EXPand ed option, which will give additional detail.
    The INDICATE command can be used by system resource operators, system programmers,
    system analysts, and general users (privilege class B, C, E, and G users) although
    different classes of user will see different results for some commands.


    > z/OS analogy: The CP INDICATE command is similar to the SDSF command DISPLAY
    ACTIVE (or its abbreviation DA).


    # CP INDICATE ACTIVE


    Use this command to display:


    +   - The total number of users active in a specified time interval

    +   - The number of users in the dispatch, eligible, and dormant lists that were
    active in a specified time interval


    An example of this command is shown in Example 7-2 on page 325.'
  merge: -1
  img_proc: true
- pgno: 340
  md: '# Example 7-2 INDicate ACTive command


    ```

    ind active

    0009 USERS, 0005 DISP, 0000 ELIG, 0004 DORM

    Ready; T=0.01/0.01 09:54:21

    ```


    The command accepts the following operands:


    +   nnnn Identifies an integer number specifying the time interval. The valid
    time period is 0 to 9 hours, or 540 minutes, or 32400 seconds. The default is
    60 seconds.

    +   SEC Identifies that nnnn was specified in seconds. This is the default.

    +   MIN Identifies that nnnn was specified in minutes.

    +   HRS Identifies that nnnn was specified in hours.


    # CP INDICATE I/O


    Use this command to identify the virtual machines currently in an I/O wait state
    and the real I/O device number that they are waiting on. This command can assist
    you in spotting a volume for which minidisk cache or CU cache were mistakenly
    turned off.


    # CP INDICATE LOAD


    Use this command to display information about system resources. See Example 7-3.
    For a general user, CP displays a subset of that information. Note that the processor
    usage information shown by this command is actually a smoothed average over a
    period of time. Changes in system load can likely take several minutes to influence
    this number. This command is a good starting point to analyze system performance
    problems.


    On z/OS, you use the command DISPLAY ACTIVE to display such information.


    > Note: For monitoring instantaneous processor load, use the Performance Tool
    Kit.


    # Example 7-3 CP INDicate LOAD


    ```

    cp ind load

    AVGPOC-000% 04

    XSTORE-000000/SEC MIGRATE-0000/SEC

    MDC READS-000000/SEC WRITES-000000/SEC HIT RATIO-100%

    PAGING-0/SEC STEAL-00%

    Q0-00001(00000) DORMANT-00010

    Q1-00001(00000) E1-00000(00000)

    Q2-00000(00000) EXPAN-001 E2-00000(00000)

    Q3-00000(00000) EXPAN-001 E3-00000(00000)

    ```'
  merge: -1
  img_proc: true
