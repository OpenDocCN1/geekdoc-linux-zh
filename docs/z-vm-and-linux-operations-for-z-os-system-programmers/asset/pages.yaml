    # Create the first Linux VM


    In the virtualization discussion in section 2.2.1, "History of z/VM" on page 14,
    all you have to do to create a virtual machine in which Linux can run is to create
    a z/VM user. The first thing to do is to set up the user minidisks.


    # Setting up minidisks


    Create a new user for your Linux guest and set up its minidisks exactly the same
    way you did for the LNXMAINT user in "Setting up minidisk space for LNXMAINT"
    on page 183. Log on as MAINT and add a new user definition into the USER DIRECT
    C file. This is your first user to include the Lnxdflt profile you created in
    "Setting up common profiles for the Linux VMs" on page 193. Example 4-14 shows
    a template you can use.


    Example 4-14 Create the Linux guest user.


    ```

    user <lnxcer> <lnxcer> 512M 2G BDEG

    include lnxdflt

    option lnknopas applmon

    mdisk 100 3390 0001 3338 <nwla25> mr lnx4vm lnx4vm lnx4vm

    mdisk 103 3390 0001 3338 <nwla26> mr lnx4vm lnx4vm lnx4vm

    mdisk 104 3390 0001 3338 <nwla27> mr lnx4vm lnx4vm lnx4vm

    mdisk 105 3390 0001 3338 <nwla28> mr lnx4vm lnx4vm lnx4vm

    mdisk 106 3390 0001 3338 <nwla29> mr lnx4vm lnx4vm lnx4vm

    ```


    The example defines this Linux user ID as having the following minidisks and virtual
    disks:


    +   100 A minidisk to hold the /boot partition; the remaining space is given to
    the system LVM, where all other partitions will be located. More about Linux LVM
    is described in "Linux Logical Volume Manager" on page 307.


    +   101-102 These are virtual disk (VDISK) swap spaces created by SWAPGEN EXEC
    upon logging on. They are not defined in USER DIRECT, but dynamically in the user''s
    PROFILE EXEC when the user ID logs on.


    +   103-106 These minidisks are to be managed by the Linux system LVM.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '> Important: A minimal Linux guest system fits onto a single 3390-3 DASD, and
    this is the recommended practice in the field. This practice requires that you
    do not use GNOME or KDE window managers in order to retain the small size of the
    installed system. Our example does not do this because we want to show the use
    of LVM and KDE.


    To avoid a one-cylinder gap being reported on each user volume, use the user ID
    $ALLOC$. This user is set to NOLOG which means it can never be logged onto. Thus,
    it is not a conventional user ID, rather it is a convenient place to put dummy
    minidisks definitions for cylinder 0 of all PERM volumes. The user ID $ALLOC$
    is in the beginning of the USER DIRECT C, near line 100. Include a definition
    for each of your volumes, as shown in Example 4-15.


    # Example 4-15 Avoiding a 1-cylinder gap being reported


    ```

    00104 *

    00105 USER $ALLOC$ NOLOG

    00106 MDISK A01 3390 000 001 LX6RES R

    00107 MDISK A02 3390 000 001 LX6W01 R

    00108 MDISK A03 3390 000 001 LX6W02 R

    00109 MDISK A04 3390 000 001 <NW1A25> R

    00110 MDISK A05 3390 000 001 <NW1A26> R

    00111 MDISK A06 3390 000 001 <NW1A27> R

    00112 MDISK A07 3390 000 001 <NW1A28> R

    00113 MDISK A08 3390 000 001 <NW1A29> R

    00114 *

    ```


    # Updating the autolog profile


    The new Linux ID you defined must have access to the VSWITCH. To do his automatically
    when the system IPLs, add the SET VSWITCH command with the GRANT parameter to
    AUTOLOG1''s PROFILE EXEC. Also, an XAUTOLOG statement can be added for your Linux
    user ID to be automatically logged on at z/VM IPL time.


    To accomplish those, log in as MAINT and make sure your AUTOLOG1''s profile looks
    like the one shown in Example 4-16.


    # Example 4-16 Granting users access to the virtual switches


    ```

    => link autolog1 191 1191 mr

    => acc 1191 f

    => x profile exec f // add two lines

    /*********************/

    /* Autolog1 Profile Exec */

    /*********************/

    ```'
