- pgno: 409
  md: '![](img/b0a4b9056f819dccd4781a5105c92d45_409_0.png)


    Figure 9-3 PSU installation work flow


    # 9.5 Convenient maintenance practices for z/VM


    A convenient practice for servicing your z/VM system is to bring up, or clone,
    a secondary level z/VM for this purpose. From within this clone or copy, you can
    perform any service activities on that system. That provides a suitable environment
    for testing before performing identical servicing of your first level system.
    Many z/VM sites do their servicing in this way. This maintenance environment can
    be accomplished by installing a new z/VM from a virtual machine defined to your
    first level z/VM. You can also clone your initial installation, provided a backup
    copy exists and the disks containing the original installation have been relabelled
    to avoid potential duplicate volser situations.'
  merge: -1
  img_proc: true
- pgno: 410
  md: 'For details about installing a secondary z/VM, refer to manual z/VM: Guide
    for Automated Installation and Service, GC24-6099


    The scenario for having duplicate labelled disk volumes is further discussed in
    the following publications:


    +   z/VM and Linux on IBM System z: The Virtualization Cookbook for SLES9, SG24-6695


    +   IBM z/VM and Linux on IBM System z: Virtualization Cookbook for Red Hat Enterprise
    Linux 4, SG24-7272


    # 9.6 Case study


    During the writing of this book, a second level z/VM was brought up under the
    primary one. Service was downloaded from the Web, and then we used FTP to put
    it on MAINT''s 500 virtual disk on the system. These downloaded files were DETERSEd
    (decompacted using the DETERSE MODULE) to MAINT''s 500 virtual disk, this time
    having a file type of SERVLINK. You should also verify that these files have a
    record length of 4005.


    > Note: All of these activities were performed from the MAINT virtual machine.


    Example 9-1 shows a terminal display after invoking the DETERSE exec for each
    of the downloaded files.


    # Example 9-1 DETERSE of the downloaded files


    ```

    Ready; T=0.01/0.01 09:28:23

    deterse S7820380 SHIPSU1 H1 530RSU03 SERVLINK H

    Ready; T=2.04/2.15 09:29:42

    deterse S7820381 SHIPTFSS H1 530SERVI SERVLINK H

    Ready; T=0.16/0.17 09:30:12

    ```


    After having prepared the files, we issued the following commands from the virtual
    machine for the secondary z/VM, named VMGUEST, after detaching the 500 disk from
    the primary''s MAINT machine:


    ```

    VARY ONLINE 500

    ATT 500

    ACC 500 h

    FILEL * * h

    ```


    > Note: The FILEL * * h command displays the DETERSEd files.'
  merge: -1
  img_proc: true
