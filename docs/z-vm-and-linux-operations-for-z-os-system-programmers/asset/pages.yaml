    # 4.4 Installing Linux


    This section describes configuring your z/VM system to install Linux, booting
    the Linux kernel for installation, and logging into the Linux system.


    # 4.4.1 Configuring your z/VM system for installing Linux


    Having a simple but efficient environment to run Linux virtual machines on z/VM
    requires that you first configure and customize your environment so that resources
    such as DASDs, networking and easy-to-manage-and-install Linux guests are all
    available at the time you execute the Linux kernel.'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'The configuration tasks involved are:


    +   - Customizing the SYSTEM CONFIG file

    +     - Change various parameters.

    +     - Create a virtual switch.

    +   - Setting up the DASDs for the Linux guest

    +     - Format the DASDs.

    +     - Configure DASDs for use by the system and user.

    +   - Creating the Linux maintenance user

    +     - Create minidisks.

    +     - Set up a common environment for booting Linux in guest virtual machines.


    Recall section 4.2.2, "System files" on page 126 where we mentioned important
    configuration files of z/VM. You are about to customize them now.


    # Customizing the SYSTEM CONFIG file


    The first configuration file read when z/VM IPLs is the SYSTEM CONFIG file.


    The following changes are recommended:


    +   - Increase retrieve key capacity.

    +   - Allow virtual disks (VDISKs) to be created

    +   - Turn off the Disconnect Timeout. This will prevent idle disconnected users
    from being forced off the system.

    +   - Define a virtual switch (VSWITCH) that will be used for Linux networking.


    Defining a virtual switch for all of the Linux guest systems is good practice
    because you will probably not have enough physical OSA network cards for every
    guest virtual machine that you create if you are plan to increase the amount later.
    A virtual switch uses a single real OSA device and shares network connectivity
    among multiple virtual guests.


    To customize the SYSTEM CONFIG file:


    +   1. Release the CF1 disk.


    To edit the SYSTEM CONFIG file, the MAINT CF1 minidisk must be released as a CP
    disk via the CPRELEASE (or its abbreviation: CPREL) command. The CP disks are
    queried with the QUERY CPDISK command. Note that, because the CF1 disk is owned
    by CP, it is being accessed in read-only mode by MAINT as CP disk A. Therefore,
    to access that CF1 disk in multi-read mode, we first request CP to release it,
    and then access it in multi-read (mr) mode:


    ```

    ==> q cpdisk

    Label Userid Vdev Mode Stat Vol-ID Rdev Type StartLoc EndLoc

    ```'
  merge: -1
  img_proc: true
