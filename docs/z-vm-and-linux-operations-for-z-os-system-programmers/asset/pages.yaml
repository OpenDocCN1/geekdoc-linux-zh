- pgno: 400
  md: "# LVM2 snapshot\n\nA snapshot is a feature of Linux Logical Volume Manager\
    \ 2 (LVM2) that allows an administrator to create a new block device that presents\
    \ an exact copy of a logical volume, frozen at a point in time.\n\nTypically,\
    \ LVM2 is used when some of the batch processing, a backup for instance, must\
    \ be performed on the logical volume, but you do not want to halt a live system\
    \ that is changing the data. When the backup or the snapshot device has been finished,\
    \ the system administrator can remove the device. This facility does require that\
    \ the snapshot be made at a time when the data on the logical volume is in a consistent\
    \ state.\n\nIn Example 8-28, a snapshot of the logical volume `/dev/mapper/vgsystem-varloglv`\
    \ has been created. This logical volume holds the `/var/log` directory, and the\
    \ snapshot `/dev/mapper/vgsystem-varlogsnapshot` presents the contents of this\
    \ directory frozen at one point in time, in a consistent state, that allows it\
    \ to back up to tape.\n\n```\nExample 8-28  Creating an LVM snapshot\n\nl n x\
    \ g u i l :~# mount\n/dev/dasda1 on / type ext3 (rw,acl,user_xattr)\nproc on /proc\
    \ type proc (rw)\nsysfs on /sys type sysfs (rw)\ndebugfs on /sys/kernel/debug\
    \ type debugfs (rw)\nudev on /dev type tmpfs (rw)\ndevpts on /dev/pts type devpts\
    \ (rw,mode=0620,gid=5)\n/dev/dasdc1 on /usr type ext3 (rw,acl,user_xattr)\n/dev/mapper/vgsystem-varloglv\
    \ on /var/log type ext3 (rw,acl,user_xattr)\nsecurityfs on /sys/kernel/security\
    \ type securityfs (rw)\nlnxguil:~# lvcreate -s -L 3500MB -n varlogsnapshot /dev/vgsystem/varloglv\n\
    \  Logical volume \"varlogsnapshot\" created\nlnxguil:~# mount /dev/mapper/vgsystem-varlogsnapshot\
    \ /mnt/backup/\nlnxguil:~# cd /mnt/backup/\nlnxguil:/mnt/backup # ls -al\ntotal\
    \ 48\ndrwxr-xr-x  4 root root 4096 May 29 15:09 .\ndrwxr-xr-x  3 root root 4096\
    \ May 29 15:17 ..\n-rw-r--r--  1 root root 11398 May 29 15:09 boot.msg\ndrwxr-xr-x\
    \ 10 root root 4096 May 29 15:06 log\ndrwx------  2 root root 16384 May 29 15:05\
    \ lost+found\n-rw-r-----  1 root root 1411 May 29 15:11 messages\n-rw-r----- \
    \ 1 root root 347 May 29 15:09 warn\n```\n\nFor more details about Logical Volume\
    \ Manager 2, see 5.3.9, “Managing DASD” on page 258."
