    # 3.2.4 Job control


    Because Linux is a multitasking operating system, a user can run multiple jobs
    or processes at one time. To view a list of jobs running, use the jobs command.
    To also see the process number of each running job, use the jobs -p command, which
    gives the process number of each job running.


    To see a list of all running processes you own, use the ps command. To see all
    processes running, use the ps -e. command.


    > Note: The words job and process can be used interchangeably.


    # Run a job in the background


    Although most commands execute quickly, if you know that a command takes more
    time, you can temporarily suspend the job to the background by typing:


    ```

    CTRL -z

    ```


    You may now execute other commands. To return to your original job you suspended
    to the background, type one of the following commands:


    +   fg %jobname    Brings the process to the foreground (execution), but holds
    the shell.

    +   bg %jobnumber  Sends the process to the background.'
