- pgno: 275
  md: '# Examining your DASD


    To obtain a list of all of the virtual DASD devices that are available to you,
    use the QUERY VIRTUAL DASD command; see Example 5-33.


    Example 5-33 Output from the QUERY VIRTUAL DASD command


    ```

