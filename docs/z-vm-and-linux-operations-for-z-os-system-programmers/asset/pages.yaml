- pgno: 91
  md: 'a read-write disk. The command that allows this is the COPYFILE command. The
    syntax is:


    ```

    COPYfile fileid1 (fileid2 .. fileidn) ( options

    ```


    A simple example is to issue:


    ```

    copyfile duane txt a secret data d

    ```


    This makes a copy of the file duane txt on your A disk and stores it as the file
    secret data on your D disk.


    However, you do not always have a D disk, or it might not always allow you to
    write files to it. In such cases, you will receive an appropriate error message.
    (Note that the original file is not erased.)


    The COPYFILE command is one of the most powerful CMS commands. In addition to
    the basic copying operations described, this command allows you to specify multiple
    input files, copy specific columns to new positions, insert fixed data in the
    file, select ranges from records to copy, and perform other actions. For example,
    the following command copies the file MARK TXT from the system (or S) disk to
    your A disk:


    ```

    COPY MARK TXT S = = A

    ```


    Another example invocation of the command is:


    ```

    copyfile duck list c finch = = warbler = a birds file a (append

    ```


    This example combines the files duck list and finch list on your C disk, and the
    file warbler list on your A disk, and adds the new combined file to the end of
    the file birds file a, which already exists. This form of the command is similar
    to using the cat and >> command combination in the Linux operating systems.


    The COPYFILE command has additional useful options. The following example copies
    files from your S disk to your A disk, while ensuring that the time stamp on the
    system file is preserved:


    ```

    COPY ALL XEDIT S = = A (OLDDATE

    FILE ''ALL XEDIT A2'' ALREADY EXISTS -- SPECIFY ''REPLACE''

    ```


    This example illustrates a common error that occurs when the output file ID already
    exists (for instance, after a previous copy operation in which the user neglected
    to keep the time stamps). In such a situation, you must reissue the COPY command
    with another option, as shown:


    ```

    COPY ALL XEDIT S = = A (OLDDATE REPLACE

    ```'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'The open parenthesis in all of these examples is a CMS convention, and actions
    that change the default operation of a command (that is, options) are placed after
    it. A closing parenthesis is not required.


    **z/OS analogy:** An analogy in z/OS is to allocate the target file using ISPF
    option 3.2 prior to copying using option 3.3. It would also be possible to create
    a copy of a file from within a ISPF EDIT session.


    # The ERASE command


    The ERASE command removes files from disk storage, releasing space for other uses.
    It deletes a file, and the space that the file occupied is immediately reusable.
    The syntax of the ERASE command is:


    ```

    ERASE fn ft (fm) ( options

    ```


    For example, the following command deletes the file frank tdata on your A disk:


    ```

    erase frank tdata a

    ```


    **Important:** The ERASE command provides an immediate, irrevocable deletion of
    the file data. It assumes that the file is on your A disk unless you specify otherwise.


    # 2.8.3 XEDIT


    The previous sections discussed how to examine your accessed disks and work with
    files at the file system level. But what about editing at the file level? Creating
    and changing content is an important part of the CMS user''s skill set. This section
    introduces the utility most commonly suited for editing files on a CMS system.


    Editing means changing, adding, or deleting data in a CMS file. You make these
    changes interactively with the editor; that is, you instruct the editor to make
    a change, the editor makes it, and then you request another change.


    XEDIT is the name of the CMS editor, and is one of the most flexible and powerful
    utilities provided with CMS. The shortest abbreviated command used to edit a file
    with XEDIT is X followed by the file name, for example:


    ```

    X PROFILE EXEC

    ```


    The full command invocation of the same example is:


    ```

    XEDIT PROFILE EXEC A

    ```'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'z/OS analogy: The z/OS equivalent is ISPF edit.


    The command region is a single line at the bottom of the terminal. Here, you can
    issue commands such as SAVE, FILE, and QUIT. If you type anything into the edit
    region, which occupies the bulk of the window, you are modifying the loaded file.
    This can frustrate new CMS users who are not used to command and data being manipulated
    the same way.


    Important: Pressing Enter at any time brings your cursor directly to the command
    line, but any text already on the command line is executed!


    # The XEDIT window layout


    The basic XEDIT window has the following regions: a file identification line,
    a message line at the top that gives information about the file being edited,
    an edit area, a prefix area, current line, and command area.


    This sections describes the various areas of the XEDIT window, and explains what
    each is used for. To follow along, invoke the following command:


    ```

    xedit profile exec a

    ```


    # File identification line


    The file identification line, which is the first line in the window, identifies
    the file you are editing. The display shows information about the file name, file
    type, file mode of the current file.


    If you do not specify a file mode, the editor assigns a file mode of A1. The file
    mode identifies an accessed minidisk or Shared File System (SFS) directory where
    the file resides.


    After you type xedit profile exec a, you will see the file record format and record
    length (V 132) on the first line at the top of the XEDIT window. The record format
    and record length indicate the format of the line and the maximum length of the
    line. For example V 132 indicates a maximum record length of 132 characters with
    a variable (V) line length. Note that a file line can be longer than a window
    line.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# Message line


    The editor communicates with you by displaying messages on the second and third
    lines (the message lines) of the window. These messages provide information including
    whether you have made an error.


    # Edit area


    The edit area displays the file. You can make changes to the file by moving the
    cursor to any line and typing over (retyping) the characters, or by using special
    keys on a standard 3270 emulation keyboard to insert or delete characters.


    You can make as many changes as you want on the displayed lines before pressing
    Enter. When you press Enter, the changes are made to the copy of the file that
    is kept in virtual storage.


    At the end of the editing session, a FILE command permanently records those changes
    on the copy of the file that resides on disk or directory. Because a file can
    be too long to fit on one window, various subcommands scroll the window so you
    can move forward and back in a file. Scrolling the window is like turning the
    pages of a book.


    # Prefix area


    The prefix area consists of the five left-most columns on the window. Note that
    each line in the file has a prefix area.


    The area might display five equal signs (=====), or sometimes line numbers, depending
    on the particular configuration of XEDIT being used. In some cases the prefix
    area has no special marker at all.


    You can perform various editing tasks, such as deleting a line, by entering short
    commands called prefix subcommands in the prefix area of a line, for example:


    +   ====a=  Adds one line

    +   a====   Adds one line

    +   3 a==   Adds three lines

    +   5a===   Adds five lines

    +   =q==    Deletes one line


    > z/OS analogy: The prefix subcommands in XEDIT are the equivalent of line commands
    in the ISPF editor.


    # The current line


    The current line is the file line in the middle of the window (above the scale).
    It is highlighted, appearing brighter than the other file lines. The current line
    is an important concept, because most subcommands perform their functions starting
    with the current line.'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'The line that is current changes during an editing session as you scroll the
    window, move up and down, and so forth. When the current line changes, the line
    pointer (not visible on the window) has moved. Many XEDIT subcommands perform
    their functions starting with the current line and move the line pointer when
    they are finished.


    Note: Sometimes XEDIT is configured to show a scale, which appears under the current
    line, to help you edit. It is like the margin scale on graphical text editors.


    # Command area


    The large arrow (====>) displayed at the bottom of the window points to the command
    input area. One way you communicate with the editor is to enter XEDIT subcommands
    on this line. You can type subcommands in upper case or lower case or a combination
    of both, and many can be abbreviated. For example, the following formats are all
    valid for the BOTTOM subcommand:


    +   - BOTTOM

    +   - Bottom

    +   - b


    To execute a subcommand, type it on the command line and then press Enter. To
    move the cursor from any place on the window to the command line, either press
    Enter or use PF12.


    # Status area


    The lower right area of the window is the status area, which displays the current
    status of your editing session (for example, edit mode or input mode), and the
    number of files you are editing.


    z/OS analogy: In z/OS, the ISPF editor has no status line of this type.


    # XEDIT and full screen CMS


    If you invoke XEDIT from full screen CMS, the way you see messages that other
    users send you is not the same as when full-screen CMS is off.


    +   - When full screen CMS is off, the message appears on a cleared screen with
    a HOLDING status displayed at the bottom. You can clear your screen to return
    to the XEDIT screen.

    +   - If full-screen CMS is on, any message you receive appears in the message
    window, which automatically opens on top of your XEDIT window.


    To scroll forward in the message window, type f (forward) in one of the border
    corners (indicated by plus (+) signs) and press Enter.'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'Continue to type f until you have seen all the information in the message window.
    When there is no more information to display, the window is automatically removed
    from your screen.


    # Data manipulation with prefix subcommands


    After you enter the XEDIT command, you are in *edit mode*. You must be in edit
    mode to enter XEDIT subcommands. You can enter data into the file using *input
    mode* or power typing mode, which are discussed in the following sections.


    If you are editing an existing file, place the cursor in the file area and type
    to replace the underlying text. As previously mentioned, XEDIT refers to its *shortcuts*
    as prefix subcommands. Prefix subcommands are one- or two-character commands that
    perform basic editing tasks on a particular line.


    You enter prefix subcommands by typing over any position of the five-character
    prefix area on one or more lines. When you press Enter, all prefix subcommands
    that have been typed in the window are executed.


    > **z/OS analogy:** XEDIT prefix subcommands are similar in function to *line
    commands* in ISPF editor.


    # Setting the current line


    Many subcommands begin their operations starting with the current line. For example,
    the INPUT subcommand provides space for you to enter data after the current line.
    You have already seen the INPUT subcommand that inserts lines after the Top of
    File line.


    You can type the forward slash (/) prefix subcommand in the prefix area of any
    line on the screen. When you press Enter, that line becomes the current line.
    Then, if you enter an INPUT subcommand, the new lines entered in input mode are
    inserted between the current line and the line that follows it.


    # Adding lines


    To add a line, type the single character A (add) or the character I (insert) in
    the prefix area to append blank lines. When you press Enter, a blank line is immediately
    inserted following the line containing the A, for example. A number can precede
    or follow the A to indicate adding more than one line. For example, A5 adds five
    blank lines. Valid ways to type the A prefix subcommand are:


    +   ```text

    +   ===A        Adds one blank line after this line.

    +   a===       Adds one blank line after this line.

    +   10a==      Adds ten blank lines after this line.

    +   ===A5      Adds five blank lines after this line.

    +   ```'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'You then type information in the added lines. If you do not type information
    the blank lines remain in the file throughout the editing session and after the
    file is written to disk or directory.


    z/OS analogy: In ISPF EDIT, you typically use the I(nsert) line command.


    # Deleting lines


    To delete a line, enter the single character D in the prefix area of a line. A
    number can precede or follow the D to indicate deleting more than one line.


    To delete a group of consecutive lines (that is, a block of lines) enter the double
    character DD in the prefix area of both the first and last lines to be deleted.
    By using this method, you do not have to count the number of lines to be deleted;
    see Example 2-22.


    Example 2-22 The consecutive line delete functionality


    ```

    ==dd# This is the first line I want to remove.

    ==## This is the second.

    ==== This is the third.

    ==== This is the fourth.

    ==dd This is the fifth.

    ```


    When you press Enter, the block of lines is deleted. The first and last lines
    of the block do not have to be in the same window; you can scroll the window before
    entering the second DD.


    After you type DD and press Enter, the status area of the screen displays the
    message:


    DD pending...


    Use PF7 or PF8 to scroll backward or forward until you find the last line of the
    block, and then type DD in its prefix area. When you press Enter, the entire block
    of lines is deleted.


    z/OS analogy: Functions are identical in both editors.


    # Recovering deleted lines


    If you delete one or more lines, you can recover them anytime during an editing
    session by using the RECOVER subcommand. The following subcommand returns lines
    deleted in an editing session:


    ```

    RECover n

    ```'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'The n represents the number of lines you want to recover. Recovered lines are
    inserted starting at the current line. The last lines deleted are the first lines
    recovered.


    If the lines were deleted from different places in the file, you put them back
    where they belong by using the M (move) prefix subcommand. See "Moving lines"
    on page 84 for more information about this subcommand. To recover all lines that
    you deleted during an editing session, enter:


    ```

    ====> recover

    ```


    In the previous example of the A and D prefix subcommands, six lines were deleted.
    To recover only the last two lines, use the following command:


    ```

    ====> recover 2

    ```


    > z/OS analogy: This is similar to using the RECOVERY ON command in the ISPF editor
    and typing UNDO, provided you have pressed Enter between each editing step you
    want to recover.


    # Adding indented lines


    To continuously add lines of indented text, type the characters SI in the prefix
    area. After you press Enter, a line is added directly after the line that contains
    SI. The cursor is positioned at the same column where the text on the previous
    line begins, enabling you to more easily enter indented text.


    If you do not want to add more lines, press Enter one more time without typing
    anything on the new line. To add a blank line in a file while using SI, make at
    least one change (such as pressing the spacebar once) on the line that contains
    the dotted line in the prefix area:


    . . . . .


    Note that simply using the cursor position keys to move the cursor over a line
    does not change the line.


    You can leave the line you are adding and make corrections elsewhere in the file
    if you type something on the new line first. When you press Enter while the cursor
    is away from the new line, another new line is added following the last line that
    was added. SI is canceled only if you press Enter and have not typed text on the
    new line.


    # Duplicating lines


    To duplicate a line, enter a double quotation mark (") in the prefix area of a
    line. A number can precede or follow the double quotation mark to duplicate the
    line more than one time; see Example 2-23 on page 84.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Example 2-23 Inserting three duplicate lines


    ```

    =3== I want three more copies of this line.

    ==== They will appear before this line.

    ```


    When you press Enter, the file displays output similar to Example 2-24.


    # Example 2-24 Output from inserting three duplicate lines


    ```

    ==== I want three more copies of this line.

    ==== I want three more copies of this line.

    ==== I want three more copies of this line.

    ==== I want three more copies of this line.

    ==== They will appear before this line.

    ```


    To duplicate a block of lines, either one time or a specified number of times,
    type two double quotation marks (") in the first and last lines of the block.
    A number can precede or follow the first double quotations (for example, 5") to
    duplicate the block more than one time.


    When you type one double quotation mark (") and press Enter, the status area of
    the screen displays the following status, allowing you to scroll the window before
    completing the block and pressing Enter:


    ```

    "" pending...

    ```


    > z/OS analogy: In z/OS, this is similar to using the R n (repeat) line command
    in ISPF editor.


    # Moving lines


    To move one line, enter the single character M (move) in the prefix area of the
    line to move. Indicate its destination by entering either the character F (following)
    or P (preceding) in the prefix area of another line. After you press Enter, the
    line containing the M is removed from its original location and is inserted in
    either immediately following the line containing the F, or immediately preceding
    the line containing the P, as appropriate.


    A number can precede or follow the M to indicate moving more than one line (for
    example, 5M or M5) in the prefix area. The line to move and the destination line
    can be on different screens.


    After you enter M, F, or P, the status area of the screen displays a Pending status.
    This pending status allows you to scroll the screen before entering the other
    prefix subcommand.'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'To move a block of lines, enter the double character MM in the prefix area
    of both the first and last lines to be moved. The first and last lines to be moved,
    and the destination line, can all be on different screens. You can use PF selections
    to scroll the screen before pressing Enter.


    z/OS analogy: In z/OS (ISPF editor), the M(ove) command is identical, but line
    command A(fter) is used instead of F(ollowing), and B(efore) instead of P(receeding).


    # Copying lines


    The procedure for copying lines is the same as for moving lines, except that you
    enter a C or CC prefix subcommand instead of M or MM. The copy operation leaves
    the original lines in place but makes a copy at the destination line, which is
    indicated by F or P.


    z/OS analogy: In z/OS (ISPF editor), the C(opy) command is identical, with the
    same exceptions as stated for the M(ove) command previously


    # Canceling prefix subcommands


    If you entered one or more prefix subcommands that created a pending status, you
    can cancel all of them by entering the following subcommand on the command line:


    ```

    ====> reset

    ```


    After you press Enter, all prefix subcommands disappear from the display and the
    prefix areas are restored with equal signs, numbers, or blank characters, depending
    on your particular XEDIT configuration.


    If you have typed any prefix subcommands (even those that do not cause a pending
    status) but have not yet pressed Enter, you can clear your screen to remove them.
    If you have only typed a few characters, it is also be sufficient to simply type
    over them with blank characters.


    # Moving through a file


    XEDIT lets you move backward, forward, up, down, and to the top and bottom in
    a file. You have already seen that the PF7 and PF8 selections are set to the BACKWARD
    and FORWARD subcommands, which scroll one full window backward or forward. You
    may also enter the BACKWARD and FORWARD subcommands in the command line. The format
    of these subcommands is:


    ```

    BAckwardn

    FOrwardn

    ```'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'Here n is the number of window displays to scroll. This is like pressing PF7
    or PF8 n times. If you omit n, the editor scrolls one window backward or forward.


    If you enter a BACKWARD subcommand when the current line is the Top of File line,
    the editor wraps around the file, making the last line of the file the new current
    line. Similarly, if you enter a FORWARD subcommand when the current line is the
    End of File line, the editor makes the first line of the file the new current
    line.


    Suppose the file is many screens long and the current screen display is somewhere
    in the middle of the file. To return to the beginning of the file, you could enter
    multiple BACKWARD subcommands, or you can enter the TOP subcommand.


    The TOP subcommand makes the Top of File line the new current line. Enter the
    TOP subcommand as shown:


    ```

    ====> top

    ```


    The BOTTOM subcommand makes the last line of the file the new current line. Enter
    the BOTTOM subcommand as shown:


    ```

    ====> bottom

    ```


    These subcommands are useful when you want to insert new lines either at the beginning
    or end of a file.


    Suppose that you want to move the file up or down a few lines instead of a whole
    window. Use the DOWN subcommand to advance the line pointer one or more lines
    toward the end of a file. The line pointed to becomes the new current line. For
    example, the following command causes the fifth line down from the current line
    to be the new current line:


    ```

    ====> down 5

    ```


    If you omit the number, then 1 (one line) is assumed. The UP subcommand moves
    the line pointer toward the beginning of the file. The line pointed to becomes
    the new current line. For example, the following command causes the fifth line
    up from the current line to be the new current line.


    ```

    ====> up 5

    ```


    Again, if you omit the number, then 1 (one line) is assumed.


    z/OS analogy: In z/OS (ISPF editor), these commands are identical.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# Searching within a file


    Searching for a particular word or phrase is a very important part of text editing
    on any platform, and is especially important when using CMS to edit various configuration
    files. When using XEDIT, you can search by using the forward slash (/) on the
    command line, as shown:


    ```

    ====> /target_search_string

    ```


    After pressing Enter, XEDIT moves to the first line it finds that matches your
    search phrase. XEDIT searches in the direction of the current line toward the
    end of the file. To move to the next occurrence, reenter the command:


    ```

    ====> /target_search_string

    ```


    A more convenient solution is to prefix the search command with the ampersand
    (&) character:


    ```

    ====> &/target_search_string

    ```


    Even easier is to enter equals (=) on the command line.


    After pressing Enter, XEDIT moves to the first line it finds that matches your
    search phrase. Each time you press Enter again, XEDIT moves to the next match
    in the file.


    This can be a very powerful way to move through files, but you can also search
    in reverse. The search is performed from the current line moving toward the top
    of the file. To search in reverse, prefix the search command with the minus sign
    (-), for example:


    ```

    ====> -/target (reverse search)

    ```


    In some cases highlighting all occurrences of a phrase within a file can be useful.
    To accomplish this task, XEDIT provides the ALL command:


    ```

    ====> all /target

    ```


    From the XEDIT command line, the ALL command lists all lines that contain instances
    of the target search phrase. To return to normal editing mode, issue the ALL command
    with no search phrase as shown:


    ```

    ====> all

    ```


    > z/OS analogy: In z/OS, this is similar to the F ''txt'' (Find) primary command
    of ISPF editor.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '> Note: When using the ALL command or the search (/) command, you can set your
    current line to be one of the lines of output. This enables you to exit the search
    results and to directly edit the file at the location you want.


    # Setting tabs


    You might want to place information in specific columns. The PF4 key functions
    like a Tab key on a keyboard. Each time you press the PF4 key, the cursor is positioned
    at the next tab column, where you can enter data. The editor defines initial tab
    settings according to file type; you can display them by using the following subcommand:


    ```

    ====> query tabs

    ```


    You can change these settings one or more times during an editing session with
    the SET TABS subcommand:


    ```

    ====> set tabs 10 20 30

    ```


    Using the example, the first time you press PF4, the cursor moves to column 10
    in the window. The second time, it moves to column 20, and so forth. You can use
    PF4 for tabbing in regular XEDIT input mode, but not all other advanced XEDIT
    modes. To change the tab settings, enter another SET TABS subcommand. To view
    the current tab settings before changing them, use the following subcommand:


    ```

    ====> modify tabs

    ```


    This displays the current SET TABS subcommand in the command line; you can type
    over the numbers and press Enter to define new tabs.


    # Inserting an external file


    The GET subcommand inserts all or part of another file into the file you are editing,
    after the current line. A file that you get is not destroyed; a copy of that file
    is inserted.


    Before you enter the GET subcommand, make the current line be the line preceding
    where you want to insert data. That way, the file will be inserted immediately
    under the current line.


    To insert another file at the end of your file, use the BOTTOM subcommand to make
    the last line current. To insert another file somewhere in the middle of your
    file, use the UP or DOWN subcommands to make the desired line current.


    > z/OS analogy: This is similar to the COPY primary command of ISPF editor in
    z/OS.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# Inserting all of another file


    To insert an entire file into the file you are editing, use the command:


    ```

    ====> get filename filetype

    ```


    For example, if you are editing FILE1 and want to insert all of FILE2 SCRIPT A
    at the end of FILE1, move the line pointer to the end of the file by issuing the
    following command:


    ```

    ====> bottom

    ```


    With the line pointer at the end of the current file, import the entire external
    file by issuing the following command:


    ```

    ====> get file2 script

    ```


    When the entire second file has been inserted, the editor displays the message:


    ```

    EOF reached

    ```


    # Inserting a portion of another file


    Sometimes, importing an entire file is unnecessary; instead, you might want only
    a portion of an external file. Use the GET command with additional optional arguments
    to insert a portion of another file.


    The first additional parameter specifies the line number of the first line to
    import. The second additional parameter indicates the number of successive lines
    to insert. For example, to insert the first 10 lines of a second file:


    ```

    ====> get file2 data 1 10

    ```


    # Powertyping


    If you have to type a substantial amount of text continuously, without worrying
    about line numbers or word length, enter the command POWERINP. This places XEDIT
    in a mode called power input or powertyping mode. The shortest command abbreviation
    for POWERINP is POW.


    When you are in powertyping mode, a *** Power Typing*** banner is displayed across
    the top of the window. Any time you want to leave powertyping mode, press the
    Enter key. Your text is formatted to fit the correct line width in a normal XEDIT
    session.


    Combining the TOP or BOTTOM commands with POWERINP provides an easy method for
    prepending or appending to a file.


    z/OS analogy: POW is similar to ISPF TextEntry (TE).'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# Autosaving


    To minimize the risk of losing your data, XEDIT provides the SET AUTOSAVE subcommand.
    This subcommand causes your file to be automatically written to disk after you
    have typed in or changed a certain number of lines. The syntax is:


    ```

    SETAutosave n

    ```


    The n specifies the number of typed-in or changed lines. For example, to write
    the file to disk or SFS directory every time you have changed 10 lines, enter:


    ```

    ====> set autosave 10

    ```


    The number of alterations you have made to your file since the last AUTOSAVE is
    displayed as the alteration count (Alt=n) in the file identification line. When
    the alteration count is equal to the AUTOSAVE setting, and the file contains at
    least one record, the file is saved on disk or SFS directory and the alteration
    count is reset to zero (0).


    You can enter the SET AUTOSAVE subcommand at any time during an editing session,
    but good practice would be to enter it right after you enter an XEDIT command
    to create a new file or to call an existing file from disk or SFS directory.


    When a file is automatically saved, it is written to a new file that has a number
    for a file name and that has a file type of AUTOSAVE. If the system malfunctions
    during an editing session, you can recover all changes made up to the time of
    the last automatic save.


    To do this, replace the original file with the AUTOSAVE file by using the CMS
    COPYFILE command with the REPLACE option. If you enter a SET AUTOSAVE subcommand
    while you are creating a new file or revising an existing file, and then enter
    a QUIT subcommand, the new or revised file is not saved, but the AUTOSAVE file
    is available from disk.


    > z/OS analogy: This feature is similar to the RECOVERY ON command in the ISPF
    editor, except you cannot set the number of lines between each save. Pressing
    Enter or a PF key causes editing changes to be saved in a separate data set. If
    the editing session is terminated, you are prompted to recover the next time you
    edit the particular data set.


    # Ending an editing session


    You can end an editing session by using FILE or QUIT. When you use the XEDIT command
    to create a new file, the file is created in virtual storage. When you make changes
    to an existing file, those changes are made to a copy of the file that is brought
    into virtual storage (when the XEDIT command is entered).'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'However, virtual storage is temporary. To write a new or modified file to disk,
    enter the following subcommand:


    ```

    ====> file

    ```


    When you use the FILE subcommand, the file is written to disk or directory and
    control is returned to CMS. You must use FFILE to save an empty file.


    The QUIT subcommand ends an editing session and leaves the permanent copy of the
    file intact on the disk or directory. You can execute the QUIT subcommand either
    by selecting PF3 or by entering quit on the command line:


    ```

    ====> quit

    ```


    Use the QUIT subcommand to quit XEDIT without saving changes to the file. This
    method of exiting XEDIT can be useful when you edit a file just to examine it
    but not change its contents, or if you have made an error when altering a file.


    If the file is new and you have not input any data, the file is not written to
    disk. If a file is new or has been changed, the following warning message prevents
    you from inadvertently using QUIT instead of FILE:


    ```

    File has been changed; type QQIT to quit anyway

    ```


    If you really do not want to save the file, enter QQUIT (abbreviated as QQ):


    ```

    ====> qquit

    ```


    > z/OS analogy (z/OS/ISPF editor analogy): The primary command CAN(cel) is identical
    to exiting without saving. The SAVE command saves the data set or member regardless
    of whether it has changed.


    > An EDIT profile value of AUTOSAVE ON in ISPF implies that exiting the editor
    using PF3 would save the data set or member if it has been modified. If AUTOSAVE
    is set to NO, the editor prompts you to enter SAVE or CANCEL (this is very similar
    to using the XEDIT command).


    # Customizing XEDIT


    You can improve the XEDIT interface by creating a PROFILE XEDIT file on your A
    disk. XEDIT starts with the basic requirements of any data editing program (that
    is, it should allow you to add, delete, or change records in a file interactively
    from your screen). It also provides a significant range of additional and more
    specialized functions. Several advanced features include:


    +   - Sophisticated data location commands

    +   - Program controllable changes

    +   - Display layout tailoring

    +   - Selective data display'
  merge: -1
  img_proc: true
- pgno: 107
  md: '+   - Multiple files handled simultaneously

    +   - Multiple logical displays per physical display


    Recognizing the variety of different users who will need an editor, and their
    different expectations and requirements, XEDIT allows each user to define how
    file data should be displayed and how commands should take effect. Discussing
    these advanced features, and many more, are beyond the scope of this book.


    A sample PROFILE XEDIT is shown in Example 2-25.


    # Example 2-25 Sample PROFILE XEDIT A with basic XEDIT customization


    ```

    * * * Top of File * * *

    /*********************/

    /*  Sample PROFILE XEDIT  */

    /*********************/


    /* Set up function keys to do something useful */

    ''SET PF01 HELP MENU''    /* XEDIT help                */

    ''SET PF02 SOS LINEADD''  /* Add a line at cursor position */

    ''SET PF03 QUIT''         /* Quit XEDIT                */

    ''SET PF07 BACKWARD''     /* Scroll backward           */

    ''SET PF08 FORWARD''      /* Scroll forward            */

    ''SET PF09 =''            /* Re-execute last subcommand entered */

    ''SET PF10 RIGHT 10''     /* Scroll document to right 10 columns */

    ''SET PF11 LEFT 10''      /* Scroll document to left 10 columns */

    ''SET PF12 ?''            /* Retrieve last command issued. */


    /* Set up colors */

    ''SET COLOR PREFIX BLUE''

    ''SET COLOR ARROW WHITE''

    ''SET COLOR FILEAREA GREEN''


    /* Set up display of editing window */

    ''SET NUM ON''            /* Show line numbers         */

    ''SET CMDLINE BOTTOM''    /* Command line at bottom of screen */

    ''SET SCALE OFF''         /* No "scale" bar across window */

    ''SET NULLS ON''          /* Allows you to insert text in middle of a line */

    ''SET CASE M I''          /* Allows uppercase and lowercase characters */

    ''SET CURLINE ON 3''      /* Current line is always the 3rd visible line. */

    ''SET FULLREAD ON''       /* move cursor to any spot and char stays put */

    ''SET STAY ON''           /* stay at loc of last find vs bottom of file */

    * * * End of File * * *

    ```


    Experiment with the various options in the configuration file. For example, saving
    the file to PROFILE XEDIT A in your CMS system puts the configuration overrides
    into production. Start by adding one line at a time as you determine what you
    want. The configuration shown in Example 2-25 might not meet your'
  merge: -1
  img_proc: true
