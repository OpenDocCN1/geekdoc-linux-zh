- pgno: 180
  md: 'You may now shut down and re-IP L the system. It is the fastest way to put
    the previous changes into effect because no production systems are running yet.
    Pass the parameter IPLPARMS CONS=SYSC to the SHUTDOWN REIPL command:


    ```

    ==> shutdown re ipl iplparms cons=sysc

    ```


    You will lose your session, but it should come back in a few minutes.


    If the network settings are correct, you can now access your z/VM through the
    network instead of using the HMC. You can use a 3270-like emulator, such as IBM
    Personal Communications, to access your network-enabled z/VM by its IP address.


    # 4.3.3 Relabeling the system volumes


    This step is optional, however, it is recommended. Sometimes you will want to
    change the volume labels of the five z/VM system volumes (or three if you installed
    onto multiple 3390-9s). In the event that another vanilla z/VM system with the
    same labels is installed onto volumes accessible by your z/VM system, one of the
    systems will not IPL correctly.


    When installing z/VM, it is possible to modify all but one volume label, that
    of the 530RES volume. This alleviates the problem that is described next, but
    it does not alleviate the problem of duplicate volume names. To understand this
    possibility, refer to Figure 4-16.


    ![](img/b0a4b9056f819dccd4781a5105c92d45_180_0.png)


    Figure 4-16 The problem with two z/VM systems with identical volume labels


    The z/VM system with the lower device addresses starting at E340 should IPL fine
    (though you might see a warning at system startup time about duplicate volume
    labels). However, if the z/VM system starting at device address F000 is IPLed,
    the 530RES volume will be used, but the remaining volumes in the system are searched
    for by volume label, not by device address. Because z/VM system 1''s addresses
    are lower than z/VM system 2''s, system 2 will use system 1''s volumes. This is
    not good for either system!'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'Linux systems that use label conventions to access their root partitions also
    suffer from a similar problem. If you install two Linux systems onto the same
    disk, both using labels to identify their partitions, the second system will actually
    use the first partition labelled as the root filesystem. Using labels in Linux
    is not recommended by the authors of this book.


    If there is a possibility of another z/VM system being installed on DASD that
    this system will have access to, the recommendation is that you perform the steps
    in the following sections:


    +   - "Modifying labels in the SYSTEM CONFIG file" on page 166

    +   - "Modifying labels in the USER DIRECT file" on page 168

    +   - "Changing the labels on the five volumes" on page 169

    +   - "Shutting the system down and re-IPLng it" on page 170


    You must have access to the HMC to perform the steps.


    > Note: This process must be done as documented. Making a mistake in one of the
    steps can easily result in an unusable system. Check your steps carefully and
    your system will come back with no problems. Try to do all steps in succession
    in a short amount of time. Close your door, do not answer your phone or e-mail,
    turn off instant messaging:))


    # Modifying labels in the SYSTEM CONFIG file


    This file controls what DASDs are used by the system, what virtual resources are
    defined and so on. Modify various DASD settings to allow the system to correctly
    start up with the new labels.


    You must have an HMC 3270 session because z/VM will have to be restarted with
    a FORCE option.


    To modify labels in the SYSTEM CONFIG file:


    +   1. Start an Integrated 3270 Console session on the HMC from the CPC Recovery
    (or just Recovery) menu.

    +   2. Note the first five CP-owned volumes by using the QUERY CPOWNED command:


    ```

    ==> q cpowned

    Slot  Vol-ID  Rdev  Type  Status

    1     S30RES  A700  Own   Online and attached

    2     LX6SPL  A701  Own   Online and attached

    3     LX6PAG  A702  Own   Online and attached

    4     LX6W01  A703  Own   Online and attached

    5     LX6W02  A704  Own   Online and attached

    6     MPA705  A705  Own   Online and attached

    ```'
  merge: -1
  img_proc: true
- pgno: 182
  md: '```

    7  MPA706 A706 Own  Online and attached

    8  MPA707 A707 Own  Online and attached

    9  MPA708 A708 Own  Online and attached

    10 MPA709 A709 Own  Online and attached

    11 ------ ---- ----- Reserved

    12 ------ ---- ----- Reserved

    ...

    ```


    Because we had changed the labels for the other four DASDs in “Running INSTDVD”
    on page 152, only the 530RES DASD must have its label changed.


    For 3390-9s: If z/VM is installed onto multiple 3390-9s, there should only be
    three system volumes:


    ```

    ==> q cpowned

    Slot  Vol-ID Rdev Type  Status

    1     530RES 9300 Own   Online and attached

    2     530SPL 9301 Own   Online and attached

    3     530PAG 9302 Own   Online and attached

    ...

    ```


    3. An XEDIT sub-command is used to help make this process more reliable. It can
    be used on both the SYSTEM CONFIG and USER DIRECT files. To modify the labels
    in the SYSTEM CONFIG file, release the A CP-disk and access it as read-write.
    Back up the SYSTEM CONFIG file:


    ```

    ==> cprelease a

    CPRELEASE request for disk A scheduled.

    HCPZAC67301 CPRELEASE request for disk A completed.

    ==> link * cfl cfl mr

    ==> acc cfl f

    ==> copy system config f = confwrks = (oldd rep

    ```


    4. Edit the SYSTEM CONFIG file and use the ch subcommand with each label you have
    to relabel (530RES only, in this example):


    ```

    ==> xedit system config f

    ==> ch /530RES/<LX6RES>/* *

    ```


    Note: Do not forget to change <LX6RES> to whichever prefix you are using.


    After each change command, a message indicates that lines have been changed.


    5. Clear the window to return to editing the file in XEDIT. Search for the string
    cp_owned and you should see the new labels. Be sure they are correct before saving
    the file with the FILE subcommand:


    ```

    ====> /cp_owned

    /*          CP_Owned Volume Statements                 */

    ```'
  merge: -1
