  md: '> Note: REXX executables must begin with a C-like comment, /* */ as shown in
    the example.


    # Example 4-11 Script to load the Linux kernel


    ```

    /* EXEC punches sles10 sp2 kernel/ramdisk to reader and ipls it */


    ''cp spool pun *''

    ''cp close rdr''

    ''pur rdr all''

    ''pun sles10s2 ikr * (NOH''

    ''pun userid() parmfile * (NOH'' 1

    ''pun sles10s2 initrd * (NOH''

    ''ch rdr all keep''

    ''ipl 00c clear''

    ```


    You are only one step away from having all of the necessary files ready for a
    Linux boot. In fact, you are missing the file denoted number 1 that is used by
    the loader script of Example 4-11.


    To save time and typing, create a file containing all of the boot parameters you
    will need to perform a network-based installation of SLES10. Parameters such as
    the IP address to be used by the Linux guest, the netmask, the server repository
    URL, and so on can be placed into a single file and read by YaST10 at boot time.
    Because this information is particular to each Linux guest that you create, you
    should name this file:


    <LINUX_GUEST> PARMFILE D


    The string <LINUX_GUEST> is the name of your z/VM user that will host the Linux
    system.


    Notice that the instruction marked with 1 in Example 4-11 makes use of the userid()
    REXX command to derive the complete file name. This means that each user loads
    a different parameters file when they run this script from within their Linux
    guest environments.


    For now, you do not have a user for the Linux guest because you will create one
    in section "Create the first Linux VM" on page 195. For now, all you should do
    is name this parameter file the name you intend to give to your Linux guest user.
    In our examples, we use LNXCER for the Linux guest. See Example 4-12 on page 193.


    > 10 YaST stands for Yet another Setup Tool, and is the installer for SLES.'
  merge: -1
  img_proc: true
