    # Registering the disks to the system


    After a DASD is formatted, make sure that the system recognizes them as available
    storage. This information is stored in the SYSTEM CONFIG file. Being recognized
    as available storage is analogous to (assuming the device is defined in the HCD
    IOCDS) issuing a VARY xxxx ONLINE command and eventually putting that command
    in COMMNDxx or IEACMD00 of PARMLIB concatenation, if defined with OFFLINE attribute
    in z/OS (any mount usage attributes must also be considered). Linux systems do
    not have an equivalent step since disks are discovered in boot time by a hardware
    probing program and automatically appear as devices under /dev after the system
    finishes booting up.


    Example 4-7 uses the same steps to access the MAINT CF1 disk read-write that you
    used earlier. It is good to remember the sequence of steps shown in Example 4-7.


    # Example 4-7 Accessing the MAINT CF1 disk read-write


    ```

