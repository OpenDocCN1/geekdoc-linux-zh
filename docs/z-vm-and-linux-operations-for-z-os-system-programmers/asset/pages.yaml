    run DIRECTXTA USER for the changes to take place.


    # Formatting a minidisk


    After a new user is created, its owner should format its assigned minidisk space
    so that files can be created for that disk. This is accomplished by running the
    FORMAT command after the user logs on:


    ```

    format 191 a

    ```


    This command formats the user''s 191 disk and uses it as the A file mode. See
    Figure 4-6 on page 137


    6 Gaps only leave empty disk space between minidisks, but an overlap occurs when
    one minidisk definition overlaps into following minidisks; z/VM actually allows
    this overlap.'
