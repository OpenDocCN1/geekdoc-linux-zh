- pgno: 196
  md: "To register the disks by updating the SYSTEM CONFIG file:\n\n+   1. Edit the\
    \ SYSTEM CONFIG file and specify each of the new page volumes (PAGE) by name as\
    \ CP_Owned. When your system IPLs, it will pick up these as paging volumes.\n\n\
    ```\n==> x system config f\n...\n/**************************************************************/\n\
    /*\n                CP_Owned Volume Statements\n*/\n/**************************************************************/\n\
    \nCP_Owned  Slot  1  LX6RES\nCP_Owned  Slot  2  LX6SPL\nCP_Owned  Slot  3  LX6PAG\n\
    CP_Owned  Slot  4  LX6W01\nCP_Owned  Slot  5  LX6W02\nCP_Owned  Slot  6  LX6PG2\n\
    CP_Owned  Slot  7  RESERVED\nCP_Owned  Slot  8  RESERVED\nCP_Owned  Slot  9  RESERVED\n\
    CP_Owned  Slot 10  RESERVED\nCP_Owned  Slot 11  RESERVED\nCP_Owned  Slot 12  RESERVED\n\
    CP_Owned  Slot 13  RESERVED\n...\n```\n\n+   2. Move down to the User_Volume_List\
    \ section. User volumes (PERM) can be specified individually with the User_Volume_List\
    \ statement, or with wild cards in the User_Volume_Include statement. Add the\
    \ user volumes that to be used by the Linux guest:\n\n```\n/**************************************************************/\n\
    /*\n                User_Volume_List */\n/*These statements are not active at\
    \ the present time. They are */\n/*examples, and can be activated by removing\
    \ the comment delimiters */\n/**************************************************************/\n\
    \nUSER_VOLUME_LIST <WIA25>\nUSER_VOLUME_LIST <WIA26>\nUSER_VOLUME_LIST <WIA27>\n\
    USER_VOLUME_LIST <WIA28>\nUSER_VOLUME_LIST <WIA29>\n/* User_Volume_List USRP01\
    \ */\n/* User_Volume_List USRP02 */\n```\n\n+   3. Save your changes with the\
    \ FILE subcommand.\n\n+   4. Verify the integrity of the changes with the CPSYNTAX\
    \ command, then put the MAINT CF1 disk back online."
