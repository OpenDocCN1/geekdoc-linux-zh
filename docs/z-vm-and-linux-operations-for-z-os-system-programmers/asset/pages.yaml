  md: 'In SUSE Linux 10, a new log file is created each time the current /var/log/messages
    file reaches 4 Mb in size; log files are rotated 99 times before being removed.
    The logrotate and syslog configuration files can be found in /etc/logrotate.*
    and /etc/syslog.conf locations.


    For more information about logrotate and syslog configuration, refer to the corresponding
    manual pages.


    Fine-tuning syslog and logrotate processes can be necessary to keep the correct
    number of log files according to your security and audit strategy.


    # Centralized remote logging


    The final noteworthy feature of syslog is its full remote logging capability;
    syslogd is able to send messages to a remote host running syslogd and to receive
    messages from remote hosts. The remote host does not forward the message again,
    but logs the messages locally.


    Using this feature you are able to control all syslog messages on one host, if
    all other machines log remotely to that. This decreases administration needs.


    Refer to the syslogd manual page for more details.


    # 8.3.2 Error analysis tools


    This section discusses dumps and traces used as error analysis tools.


    # Dumps, as an error analysis tool


    Sometimes not enough relevant information can be found in the log files. To analyze
    the reasons one of the Linux guests running in a z/VM partition has a bad behavior,
    run a dump tool on one of the virtual machine for further analysis. Depending
    on the environment, several tools can be used:


    +   - DASD dump tool generates a dump on 3390 or 3380 disks.

    +   - SCSI dump tool generates a dump on FCP/SCSI devices.

    +   - Tape dump tool generates a dump on tape.

    +   - VMUDUMP creates a dump of a guest virtual memory.


    Refer to Table 8-2 on page 373 for a list of the available tools.'
  merge: -1
  img_proc: true
