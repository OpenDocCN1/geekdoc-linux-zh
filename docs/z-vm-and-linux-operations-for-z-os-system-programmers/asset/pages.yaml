    # 5.2.5 z/VM services


    z/VM provides several services in the form of virtual machines. A virtual machine
    is similar to a z/OS Started Task, TSO User, or batch job. Unlike some operating
    systems, CP does not have the concept of a process. Instead, all CP knows is how
    to run virtual machines. This means that any extra service function not built
    directly into CP must be implemented as a service virtual machine.


    A service virtual machine is the same as any other virtual machine, except it
    runs certain software (typically on top of CMS) that provides a service to some
    or all of the other users on the system.'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'The following examples are services provided by service virtual machines:


    +   - TCP/IP networking stack

    +   - User directory maintenance (Dirmaint)

    +   - Security manager (RACF)

    +   - Performance data collection and reporting (Performance Toolkit)

    +   - Systems management service (SMAPI)


    Service virtual machines in z/VM usually have a user name that corresponds with
    the service it provides. Table 5-1 lists several common service virtual machines
    and brief descriptions of the service provided.


    Table 5-1 Common service virtual machines


    | Guest name | Service provided |

    |---|---|

    | TCPIP | TCP/IP networking stack and tools like FTP and Telnet |

    | DIRMAINT | User directory maintenance |

    | DATAMOVE | Disk copying and formatting services for DIRMAINT |

    | PERSFVM | Performance recording and reporting |

    | RACFVM | Security management for guests, devices and services |

    | VMSERVE | Systems management service |

    | RSCS | Remote spool device capability |

    | PVM | Remote communication and system access |

    | EREP | Error recording |

    | DISKACNT | User accounting recording |

    | OPERSYMP | Symptom recording |

    | VMSERVR

    VMSERVS

    VMSERVU | Support for Shared File System (SFS) |


    # 5.3 Managing a guest operating system virtual machine


    Guest support in z/VM allows you to run multiple images of production operating
    systems. You can use guest support in z/VM to develop, test, manage and migrate
    operating systems that run on System z alongside your production systems. The
    following sections discuss guest systems supported and how to operate the virtual
    machines.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# 5.3.1 Guest support


    All of the supported mainframe operating systems can run under z/VM, including
    z/VM itself. For a list of supported mainframe operating systems, the type of
    support z/VM offers, and other useful information, refer to notes in z/VM: General
    Information, GC24-6095. If running on an IFL, then only z/VM and Linux are allowed.


    > Tip: z/VM General Information, GC24-6095, also has a list all of supported hardware
    that can be used with any release of z/VM.


    The concept of having each user be a virtual machine is new to z/OS users. Therefore,
    the next sections explain how to manage them (start, pause, resume, and halt).


    # 5.3.2 Starting a guest operating system


    Each guest operating system is run from individual z/VM virtual machine user IDs.
    Logging on to these user IDs is done in the same manner as any other z/VM user
    ID, and usually comes up running in a CMS environment. From the log on session,
    a guest operating system can be loaded on that virtual machine''s storage and
    run much the same as though it were running in an LPAR.


    In z/VM, starting an operating system this way is still like using IPL (initial
    program load). When you IPL an operating system, it takes control of the virtual
    machine''s storage; any other operating system that was running before is cleared
    from memory and no longer controls the virtual machine. Keep in mind that CP will
    still be running, because CP is not a guest operating system.


    In CP, you perform an IPL by using the IPL command. CP can IPL directly from a
    device, in which case the operating system is read from the data residing on the
    device. Or CP can IPL from data stored in shared memory known as a Named Saved
    System (NSS). To IPL from a device, give the virtual device number of the device
    you want to IPL; see Example 5-21.


    # Example 5-21 IPL of the 190 disk


    ```

    IPL 190

    z/VM V5.3.0    2007-05-02 16:25

    Ready; T=0.01/0.01 09:37:40

    ```


    In Example 5-21 we IPLed, the 190 disk, which by default contains the CMS operating
    system. At this point CMS is running and any command issued is processed by CMS
    first.'
  merge: -1
  img_proc: true
- pgno: 265
  md: "An NSS is a copy of an operating system’s kernel or nucleus, which has been\
    \ saved in shared CP storage. Using an NSS to IPL an operating system has several\
    \ advantages over using disks:\n\n+   - Only one copy of the operating system\
    \ will exist in memory no matter how many guests have IPLed it. This can lead\
    \ to tremendous storage savings if you have numerous guests.\n+   - Only one copy\
    \ of the operating system exists, therefore, updating everyone who uses it to\
    \ a newer version is as simple as replacing that single NSS.\n\nTo IPL from an\
    \ NSS, provide the name of the saved system; see Example 5-22. Most z/VM installations\
    \ have a CMS NSS set up.\n\n# *Example 5-22  IPL of the CMS named system*\n\n\
    ```\nIPL CMS\nz/VM V5.3.0    2007-05-02 16:25\nReady; T=01/0.01 09:37:40\n```\n\
    \nExample 5-22 shows we IPLed CMS with the CMS NSS instead of the CMS disk. Notice\
    \ that CMS starts exactly the same way that it did when we IPLed the 190 disk.\n\
    \n> **Note:** Certain guest operating systems require that you perform a SYSTEM\
    \ CLEAR command to clear out the guest’s virtual memory before IPLing the guest.\
    \ You may, alternatively, tell the IPL command to clear the memory for you by\
    \ specifying the CLEAR parameter:\n> \n> `IPL 190 CLEAR`\n\n# 5.3.3 Issuing CP\
    \ commands while running a guest operating system\n\nAfter a guest operating system\
    \ is started, all commands entered at the terminal will typically be processed\
    \ by that operating system and not by CP. Sometimes, however, you might have to\
    \ interact with CP for various reasons, such as linking to a new disk, finding\
    \ out how many other users are on the system, changing your virtual networking\
    \ hardware, or any other CP-related task.\n\nCP provides a way for you to issue\
    \ commands that bypass the guest operating system and go directly to CP. We use\
    \ the #CP command for this purpose. You issue the command #CP followed by whatever\
    \ CP command you want to execute.\n\nFor example, assume you start your guest\
    \ operating system, which detects only one CPU, but you think that your virtual\
    \ machine has three CPUs. Example 5-23"
  merge: -1
  img_proc: true
- pgno: 266
  md: 'on page 251 shows how you can verify that your virtual machine does indeed
    have three CPUs.


    # Example 5-23 Issuing a command to CP from within a guest operating system


    ```

    #CP QUERY VIRTUAL CPUS

    CPU 00 ID FF02991E20948000 (BASE) CP CPUAFF ON

    CPU 01 ID FF02991E20948000 STOPPED CP CPUAFF ON

    CPU 02 ID FF02991E20948000 STOPPED CP CPUAFF ON

    ```


    When you issue a #CP command, CP temporarily suspends your guest operating system
    long enough to complete your command, and then it resumes it. To your guest operating
    system, this is transparent. This process is generally very fast and seamless.


    # Notes:


    +   - This method of interacting with CP from within your guest operating system
    works flawlessly for most guest operating systems. However, it fails when you
    are running z/VM in a z/VM guest. In this case, you have to pause the z/VM that
    is running as your guest operating system before you can issue commands directly
    to the underlying CP. Refer to 5.3.4, “Pausing a guest operating system” on page
    251, for more information about this topic.

    +   - CMS assumes that any commands you issue, and that it does not recognize,
    are CP commands and it will pass them directly to CP for you. This means you do
    not have to use the #CP command to force CP to execute commands when you are in
    CMS. You can simply execute the CP command normally and CMS will pass the command
    to CP for you.


    # 5.3.4 Pausing a guest operating system


    CP also has a command for pausing your guest operating system temporarily. You
    might want to do this if you have to issue numerous CP commands but you do not
    want the guest operating system running or interfering with your work.


    You might also want to do this if you are a programmer who is debugging a guest
    operating system. To stop the guest operating system and return control to CP,
    enter the following command:


    ```

    #CP STOP

    ```


    Although this command produces no output, the end result is that the guest operating
    system is stopped and you can then interact directly with CP until you specifically
    resume running the guest operating system.'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'This method of pausing your guest operating system works flawlessly for almost
    all guest operating systems. However, it fails when you are running z/VM in a
    z/VM guest. When you are running z/VM in a z/VM guest, you essentially have CP
    running as your guest operating system. Therefore, you have two instances of CP
    to deal with:


    +   - The first level CP is the instance of CP that started when you logged on
    to the system and your virtual machine was created.

    +   - The second level CP was created when you IPLed it from within your first
    level CP instance.


    When you are running a second level CP, the #CP command issues commands to your
    second level CP—and not to your first-level CP, as you might expect.


    Figure 5-3 shows the scenario when you have a second-level z/VM system.


    ![](img/b0a4b9056f819dccd4781a5105c92d45_267_0.png)


    Figure 5-3 First-level and second-level CPs.


    To drop out of your second-level CP and issue commands directly to your first-level
    CP, press the PA1 key on the 3270 terminal keyboard. When you use the PA1 key
    (known as the Program Attention 1 key), the second-level CP (including any guest
    operating system it is running) is paused and your next command will be executed
    by your first-level CP.'
  merge: -1
  img_proc: true
- pgno: 268
  md: "> Note: When you press the PA1 key to pause a guest operating system, you might\
    \ find that it only remains paused while you execute one command. After this,\
    \ it will resume again automatically. If this happens, it is because the RUN parameter\
    \ is turned on for your first-level virtual machine. The RUN parameter controls\
    \ this behavior.\n> \n> To turn off the RUN parameter after you have pressed the\
    \ PA1 key and your first-level CP is in control, execute the following command:\n\
    > \n> SET RUN OFF\n> \n> From this point, you will be able to execute as many\
    \ first-level CP commands as you want and the second-level CP will not resume\
    \ until you tell it to.\n> \n> You may also issue the SET RUN ON command to turn\
    \ the RUN parameter on if you wish. Having RUN set to ON will ensure that your\
    \ guest operating system remains running when you disconnect from the guest.\n\
    \n\n\nTo resume your guest operating system (no matter what guest operating system\
    \ you are running) use the BEGIN command. The BEGIN command takes no parameters\
    \ and produces no output of its own (Example 5-24), although you might see output\
    \ from your guest operating system as it continues to execute.\n\n# Example 5-24\
    \ Restarting a stopped guest operating system\n\n```\nBEGIN\n```\n\n> Note: In\
    \ some cases, you might be required to clear your 3270 terminal window before\
    \ your guest operating system can resume operation.\n\n\n\nWhen you are finished\
    \ with a guest operating system, use whatever command or procedure that operating\
    \ system has for a proper shutdown, because not doing so can lead to data loss.\n\
    \nCP does, however, provide a command to halt the running guest operating system,\
    \ clear the systems storage, and return directly to CP; see Example 5-25 on page\
    \ 254."
  merge: -1
  img_proc: true
