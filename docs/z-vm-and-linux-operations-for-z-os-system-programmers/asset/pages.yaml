    \ d u,,6000,1\n  12.58.24 IEE4571 12.58.24 UNIT STATUS 153\n  UNIT TYPE STATUS\
    \ VOLSER VOLSTATE\n  6000 3390 0 DK8222 PRIV/RSDNT\n```\n\nFigure 4-40 z/OS SYSLOG\n\
    \nThis demonstration provides ideas for using z/VMs virtualizition capabilities\
