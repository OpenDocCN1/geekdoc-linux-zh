- pgno: 141
  md: 'Use this command to list files in z/VM, from within CMS. z/OS users usually
    do this through a menu interface, ISPF. See “The COPYfile command” on page 75
    for details about this command.


    +   ► COPYFILE


    Use this command to create backup copies of the configuration files you will edit.
    The syntax for this command is in "The COPYFILE command" on page 75.


    +   ► XEDIT


    The two ways to edit a file in CMS are:


    – When you already know the file name and where it is.


    This is the straightforward scenario. To edit a file named PROFILE EXEC that you
    have on your A disk, type the following on the CMS command line:


    ```

    xedit profile exec a

    ```


    – When you do not know what the file name is, or where it is, or both.


    In this scenario, you search for the file to edit by using the FILELIST command
    to view the list of files. Then, place your cursor on the line corresponding to
    the file you want to edit, and press F11.


    Although throughout the installation, you will use these three commands to manipulate
    files, spend a few more minutes looking at section 2.8.2, “CMS” on page 72 to
    learn about other commands. Also, read the appropriate chapter of the book Introduction
    to the New Mainframe: z/VM Basics, SG24-7316 to become familiar with z/VM commands.


    # 4.2.2 System files


    As within every system, z/VM has configuration files. They are used to define
    minidisks for users, define virtual resources such as virtual switches, define
    profiles for CMS and XEDIT sessions, and so on. This section describes the following
    files:


    +   - USER DIRECT

    +   - SYSTEM CONFIG

    +   - PROFILE EXEC

    +   - PROFILE XEDIT


    You will learn how access and modify each of these files when the time comes throughout
    the installation.'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'z/OS analogy: The configuration files discussed here are the z/VM counterparts
    of z/OS SYS1.PARMLIB concatenation, RACF definitions of users, and your initial
    TSO/ISPF routine invoked from your logon procedure JCL


    # The USER DIRECT file


    This is the z/VM configuration file that handles the definitions for users and
    their minidisks, DASD space allocation, and definitions for common profiles that
    users can import into their user settings. These profiles are meant, among other
    things, to create basic devices such as the reader, punch, and print spoolers
    needed by every user for input, output, and printing files and for creating links
    to other user''s disks, in particular to some of MAINT user''s disks, in order
    to access critical read-only code, such as the CMS, without duplication into their
    minidisks. This file is located on MAINT''s 2CC disk.


    # The SYSTEM CONFIG file


    This file holds most of the configuration for the system. It is in this file that
    you set up which DASD volumes will be owned by the system, for example the ones
    that are dedicated to paging, and which ones are user-owned, for example volumes
    that host Linux virtual machines. It is also used to set up virtual resources,
    such as virtual switches that are used to serve networking to Linux VMs, and to
    limit the amount of resources given to ordinary users, such as the number of minidisks
    each may own. This file is located on MAINT''s CF1 disk.


    # The PROFILE EXEC file


    A PROFILE EXEC is different from other executables (also known as execs). It has
    the special file name, PROFILE, and it is automatically processed whenever you
    enter IPL CMS (or if you have an automatic IPL mechanism in place).


    Your PROFILE EXEC contains the CP and CMS commands that you enter at the start
    of every terminal session. It can be used to set up special characteristics for
    each CMS user, beyond those defined in that user''s directory entry, such as:


    +   - Making any nonstandard minidisks or shared file systems in your virtual
    machine configuration known to CMS

    +   - Changing the colors that display data at a terminal (color terminals only)

    +   - Making frequently used execs storage-resident

    +   - Setting up to 24 program function keys for commonly used commands

    +   - Changing the Ready message sent by CMS

    +   - Automatically checking your virtual card reader (your in-tray) for files
    and messages

    +   - Taking you directly to an application instance'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'Each z/VM user has its own PROFILE EXEC file. This is similar to the Linux
    .bashrc file, and the z/OS initial logon routine (REXX or CLIST scripts) that
    are installation customizations and not part of the standard z/OS TSO logon. Every
    time a user logs in, this file is accessed and any special configurations and
    commands in it are set or run. Maintaining the same profile among users is a good
    practice for ensuring a homogeneous look and feel when you log on to different
    user accounts. This file is located on the 191 disk of each z/VM user.


    # The PROFILE XEDIT file


    This is the configuration file for the XEDIT editor and is accessed every time
    a user invokes it. As you have seen in "Customizing XEDIT" on page 91, a good
    customization of this file is critical for a better experience using XEDIT. This
    file is similar to the .vimrc file in Linux for its vi editor. In z/OS, this is
    similar to profile settings set up in the ISPCFGIGU module. This file is located
    on the 191 disk of every z/VM user.


    # 4.2.3 Important z/VM installation user IDs


    As with every system, some user accounts have a special meaning. This section
    outlines those accounts used throughout a z/VM installation, and makes a comparison
    to z/OS and Linux. The user accounts are:


    +   - MAINT user

    +   - AUTOLOG1 user

    +   - TCPIP user


    # The MAINT user


    This is z/VM''s super user. It is analogous to the a z/OS user with access to
    system-privileged information through RACF. It is also analogous to the Linux
    root user.


    This z/VM user has access to all of the privilege classes mentioned in 6.1.5,
    "z/VM privilege classes" on page 287. It is granted, therefore, access to all
    of the system''s configuration files and management commands, such as granting
    a user access to a virtual switch.


    # The AUTOLOG1 user


    This is a special user in z/VM and there is no comparable user in either z/OS
    or Linux. The closest concept to it in Linux are the run levels, which are responsible
    for bringing up services during startup.


    Running commands or scripts automatically right after z/VM IPLs is accomplished
    through the AUTOLOG1 user. As mentioned in 2.2.1, "History of'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'z/VM" on page 14, the concept of a z/VM user maps to a virtual machine. So,
    the AUTOLOG1 virtual machine is responsible for starting up other virtual machines
    (logging on other users) as soon as the z/VM IPL finishes. This is usually done
    to bring up the TCP/IP virtual machine, for example.


    > Note: If the noautolog parameter is not specified when z/VM is loaded (IPL),
    the AUTOLOG1 virtual machine is started. Because this virtual machine IPLs CMS,
    the PROFILE EXEC that is found on its A disk is run. This is analogous to the
    /etc/profile file on Linux and the autoexec.bat file on DOS systems.


    > z/OS analogy: The tasks performed by the z/VM AUTOLOG1 user are similar to using
    START statements in members IEACMDxx and COMMNDxx in the SYS1.PARMLIB concatenation


    # The TCPIP user


    In z/OS, the TCP/IP stack is managed by the z/OS Communications Server in a separate
    address space. In z/VM, however, the stack is managed by a virtual machine: the
    TCPIP virtual machine (defined as the TCPIP user).


    # 4.2.4 Dealing with disks


    A file hierarchy is run in CMS when a z/VM user logs into the system. It is a
    different hierarchy than the one used by Linux or z/OS. In fact, there is no hierarchy
    in CMS, but it does have the triplets concept of file name, file type and file
    mode. Every file name is formed by these three components, which are described
    in the following list. You can think of this file system as a flat file system
    (or sequential) in which you have only one level.


    +   - The first parameter, the file name, should be familiar to most users because
    it is just the name of the file. In CMS, file names are limited to eight characters
    in length and are not case-sensitive.

    +   - The second parameter, file type, is analogous to the file extension of systems
    such as Linux. In CMS, file types are also limited to 8 characters in length and
    are not case-sensitive. In an analogy, the file name and file type together form
    something similar to the z/OS filename.extension (with a space instead of a dot
    between them) file naming convention of other systems.

    +   - The third parameter, the file mode, specifies where the file is located,
    that is, on which disk mapping it resides. The file mode is one character long
    and is limited to the characters A-Z. The file mode is what makes the whole filesystem
    a flat universe because you are limited to having 26 simultaneous places to put
    your files.'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'We mentioned the word mapping in the previous paragraph, but before we talk
    about mapping a disk to a file mode, we should discuss how disks are organized.
    Disks are nothing more than storage space. They hold files, and the files on them
    are identified by their name and type. However, instead of systems such as Linux,
    disks are not identified by device names, they are identified by device IDs. Some
    of these IDs are well known IDs, such as MAINT’s 193 disk, which contains useful
    programs such as CPSYNTAX.


    The disk ID is an analogy to a template directory name in systems such as Windows.
    For example, two z/VM users can have 191-labelled disks. Think of this as the
    My Documents folder that two different users can have in Windows. Both folders
    have the same name, My Documents, but each of them belongs to a different user
    and each of them denotes a different area in disk storage. The only difference
    here is that you are using numbers in CMS instead of names to denote a permanent
    storage area, that is, a disk. For z/OS, each TSO/ISPF user has an individual
    ISPF.PROFILE file under that user’s own high-level qualifier.


    Having said that, we further explore several interesting aspects of disks. If,
    for example, you want to access the CPSYNTAX command and you are not logged on
    as MAINT, you can link MAINT’s 193 disk to your user space to be able to access
    that command. The way you do this is by using the commands LINK and ACCESS (or
    its abbreviation: acc).


    # Accessing another user’s disk (linking)


    The sequence of commands to link another user’s disks to your user space is shown
    in Example 4-1.


    Example 4-1 Linking and accessing disks


    ```

    link autolog1 191 1191 rr

    Ready; T=0.01/0.01 16:02:04

    acc 1191 f

    DMSACP723I F (1191) R/0

    Ready; T=0.01/0.01 16:02:08

    ```


    The LINK command shown in the example links disk 191 of user AUTOLOG1 to our user
    space under the label 1191 in read-only mode. This means that we can actually
    access the files on AUTOLOG1’s 191 disk by referencing our own linked 1191 now.
    However, to perform that we still have to map our 1191 disk to a file mode so
    that we can use a triplet (file name, file type, file mode) to access the files
    on it. Mapping a disk to a file mode is what we performed with the ACCESS command³.
    We mapped our 1191 disk to one unused file mode that we had


    > ³ In z/VM, mapping a disk, as we defined the term, is actually known as accessing
    a disk. We used the word map here to make the analogy easier to understand by
    people not familiar with z/VM. From this point on, we refer to disk mapping as
    accessing disks.'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'available, which in this case was F. Figure 4-2 shows what we have just performed.


    # Figure 4-2 Accessing other users'' disks.


    ![](img/b0a4b9056f819dccd4781a5105c92d45_146_0.png)


    To check that AUTOLOG01''s 191 disk is linked and mapped to our user space, we
