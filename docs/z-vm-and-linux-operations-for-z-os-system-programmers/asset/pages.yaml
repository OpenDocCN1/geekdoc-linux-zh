- pgno: 25
  md: '# 2.1 Overview of virtualization


    Virtualization is the ability for a computer system to share physical resources,
    such as memory, storage, network adapters, and processors so that it can behave
    as though it were many different systems.


    Today, the most common areas of virtualization are with servers, networks, and
    storage. Virtualization can also be applied to non-physical resources such as
    applications, middleware, and even virtual resources themselves, such as virtualizing
    a cluster of virtual servers.


    # 2.1.1 Benefits of virtualization


    The cost of administering IT systems is growing faster than the cost of new hardware
    for those systems because the complexity of those systems requires growing numbers
    of people to manage them. A primary concern of management is to contain cost while
    increasing revenue levels.


    Implementing virtualization can be a critical first step in managing computing
    infrastructures by:


    +   - Lowering the cost of existing infrastructure

    +   - Reducing the complexity of adding resources to that infrastructure

    +   - Building a heterogeneous infrastructure across multiple data centers, making
    those centers more responsive to business requirements


    The benefits of virtualization vary, depending on the objectives and the specific
    virtualization technologies selected and on the existing IT infrastructure. Users
    realize many of the following benefits to some degree, even when using virtualization
    for simple server consolidation.


    # Higher resource utilization


    Virtualization enables the dynamic sharing of physical resources and resource
    pools, resulting in higher resource use, especially for variable workloads where
    the average requirements are lower than for an entire dedicated resource.


    # Lower management costs


    Virtualization can improve staff productivity by: reducing the number of physical
    resources that must be managed; hiding some of the resource complexity; simplifying
    common management tasks through automation, better information and centralization;
    and enabling workload management automation.

    Virtualization also enables common tools to be used across multiple platforms.'
  merge: -1
  img_proc: true
