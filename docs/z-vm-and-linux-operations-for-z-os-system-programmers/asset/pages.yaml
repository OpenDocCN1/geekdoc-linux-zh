- pgno: 54
  md: '# 2.5.2 Layers (levels) of help


    The Help system provides various ways of getting information for a command, depending
    on your level of expertise and the amount of detail you want for a particular
    task. Each command can display a brief, detailed, or related level of help.


    To display any of the three available layers, specify one of the following layering
    options: BRIEF, DETAIL, or RELATED. You may specify only one layering option at
    a time. However, after you have requested one layer of help on a specified command,
    you may toggle (switch) between the other layers available for that command.


    BRIEF is the default option, which means that if you do not specify an option,
    a brief layer of help is displayed, if it is available. If brief help is not available
    for a certain command, DETAIL HELP is displayed. The following sections provide
    more information about the three layers of command help.


    # BRIEF


    BRIEF is the first layer of help. It is available for many commands. Brief help
    displays a short description of the requested command, the command''s basic syntax
    (the command without options), an example, and if applicable, a message telling
    you that either more or related information is available.


    If you are in full-screen CMS and request BRIEF HELP, your window shows the help
    command you entered and just below it, displays the BRIEF HELP information in
    a window that is displayed on your window. If you are not in full-screen CMS,
    the Brief Help Information window is displayed.


    The following example requests brief help for the SENDFILE command:


    ```

    help cms sendfile (brief

    ```


    If you are not in full-screen CMS, the output of this command is displayed in
    the Brief Help Information window as shown in Figure 2-7 on page 40.'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'Figure 2-7 Output of the request for brief help on the sendfile command


    # DETAIL


    The DETAIL layer provides a complete description of the command, the command format,
    an explanation of its parameters and options, usage notes, and error information.
    For more information regarding DETAIL help, refer to z/VM: CMS Commands and Utilities
    Reference, SC24-6073.


    This layer of help has seven subsetting options: DESCRIPT, FORMAT, PARMS, OPTIONS,
    NOTES, ERRORS, and ALL. By specifying subsetting options, you can display one
    or more particular sections of the detail help.


    The default option is ALL, which means that the entire detail help is displayed.
    Although changing the default option is possible, you will have to explicitly
    specify ALL as the subsetting option to display the entire detail layer. For more
    information about the subsetting options and the DETAIL command, refer to z/VM:
    CMS Commands and Utilities Reference, SC24-6073.


    For example, to display all details of the SENDFILE command in the CMS environment,
    enter the following command:


    ```

    help cms sendfile {detail

    ```


    Figure 2-8 shows the output of the command in the All Help Information window.'
  merge: -1
  img_proc: true
