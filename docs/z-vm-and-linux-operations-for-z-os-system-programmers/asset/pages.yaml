- pgno: 204
  md: 'used as LNXMAINT''s home disk, where its generic files will be. On the other
    hand, the 192 disk will be used to host all of the files necessary for a Linux
    virtual machine to boot. Later, in "Setting up common profiles for the Linux VMs"
    on page 193, you will set up a profile in the Linux guest that will link its 191
    disk to LNXMAINT''s 192 disk in read-only mode. By doing so, the guest''s home
    disk can load the necessary Linux files by reading them from this linked LNXMAINT
    disk.


    > **Note:** To proceed with this section, make sure you have set up an FTP server
    in your z/VM, as mentioned in "Setting up an FTP server" on page 163. Again, sending
    the files through FTP is required to ensure that the transfer keeps the 80-character
    record length of the kernel and ramdisk files.


    You have to send three files to your LNXMAINT 192 disk:


    +   - Linux kernel

    +     - In SLES10, this is the /boot/s390x/vmrdr.ikr file of its first DVD or
    CD

    +     - In RHEL5, this is the /images/kernel.img file of its first DVD or CD

    +   - Linux ramdisk

    +     - In SLES10, this is the /boot/s390x/initrd file of its first DVD or CD

    +     - In RHEL5, this is the /images/initrd.img file of its first DVD or CD

    +   - SWAPGEN file found in the compressed file located in:

    +     ftp://www.redbooks.ibm.com/redbooks/SG246695/


    > **Note:** If your kernel and ramdisk are not in their 80-character record length,
    the kernel will not load.


    The authors were given the access information for a SLES10SP2 and a RHEL5 U1 repositories.
    Because we had to pick up one on which to base our examples here, we decided to
    use SLES. However, comments for a RHEL system are highlighted when a different
