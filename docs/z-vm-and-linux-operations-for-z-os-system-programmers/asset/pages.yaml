    # 2.8.2 CMS


    Like any operating environment, CMS has commands for working with files. This
    section lists the common file management commands used by CMS users.


    Commands are not case-sensitive. However, where we show a full command with partial
    uppercase characters, we are simply indicating which part of the full command
    can be abbreviated. For example, the FILEList command can be entered in full,
    as filelist, or can be abbreviated, as file1.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# The FILEList command


    One of the most useful CMS commands, FILEList allows you to list what is stored
    on a minidisk and to look for files by yielding a list of matching results.


    z/OS analogy: Similar to z/OS ISPF option 3.4 except that TSO/ISPF users do not
    have a file system as such. The user would have to know the name of the data set
    to be manipulated. The TSO command ISRDDN lists all data sets allocated to your
    TSO/ISPF session lets you manipulate them. ISPF option 11 (Workplace™) is also
    a close equivalent.


    The command syntax is:


    ```

    FILEList filename filetype fm ( options

    ```


    The filename parameter is the name of the file. Only the files whose names match
    the file name supplied are listed. The filetype parameter denotes the type of
    file⁶. The fm parameter denotes the file mode⁷ or directory ID. A more in-depth
    discussion about the three parameters (triplet) is in section 4.2.4, "Dealing
    with disks" on page 129.


    Listing files for which you already know the name is not that useful. You might
    want to determine which files are on a directory ID, or which files have the same
    name or type, or maybe you want to do all of these together. To accomplish that,
    use the asterisk (*) as a wildcard. For example, to list all files in file mode
    A, you would type:


    ```

    filel * * a

    ```


    The result, in Figure 2-16 on page 74, shows that the A file mode has only one
    file, the PROFILE EXEC file. Notice the triplet is PROFILE EXEC A.


    ⁶ A file type is known in systems such as Linux to be the file extension.


    ⁷ A file mode or directory ID is the disk on which the file is to be found.'
