    is constrained, you can use this command to limit the number of users.


    > z/OS analogy: In z/OS, to set the number of users, you would set the parameters
    in the member IEASYSxx in the ParmLib.


    # CP SET MDC


    Use this command from a class B user to perform the following tasks:


    +   ► Change minidisk cache settings for the entire system, for a real device,
    or for an active minidisk.'
