- pgno: 12
  md: '# Preface


    This IBM® Redbooks® publication discusses z/VM® and Linux® operations from the
    perspective of the z/OS® programmer or system programmer. Although other books
    have been written about many of these topics, this book gives enough information
    about each topic to describe z/VM and Linux on IBM System z® operations to somebody
    who is new to both environments.


    This book is intended for z/OS programmers and system programmers who are transitioning
    to the z/VM and Linux on System z environments and who want a translation guide
    for assistance.


    We base this book on our experiences using System z10™ Enterprise Edition, z/VM
    version 5.3 RSU 0701, and Novell® SUSE® Linux Enterprise Server (SLES) 10 on System
    z.


    # The team that wrote this book


    This book was produced by a team of specialists from around the world working
    at the International Technical Support Organization, Poughkeepsie Center.


    Lydia Parziale is a Project Leader for the ITSO team in Poughkeepsie, New York,
    with domestic and international experience in technology management including
    software development, project leadership, and strategic planning. Her areas of
    expertise include e-business development and database management technologies.
    Lydia is a PMP and an IBM Certified IT Specialist with an MBA in Technology Management,
    and has been employed by IBM for over 20 years in various technology areas.


    Omar Badreddin is a Researcher at the IBM Center for Advanced Studies and Research
    in Ottawa and a member of Complexity Reduction in Software Engineering research
    group (CRuiSE). Omar has five years of work experience with IBM as a Software
    Engineer and has delivered a number of ITSO workshops. His area of expertise includes
    virtualization, modeling, BPM, SOA, and software globalization.


    Roy P Costa is an Advisory Systems Programmer at the IBM International Technical
    Support Organization, Poughkeepsie Center. He has over 25 years of experience
    in z/VM systems operation and programming. Roy has worked with Linux on System
    z for more than five years and has authored several Redbooks'
  merge: -1
  img_proc: true
