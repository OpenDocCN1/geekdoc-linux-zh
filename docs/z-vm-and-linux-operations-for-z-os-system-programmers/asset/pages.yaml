    > Note: If you try to link to another user''s disk and you are not logged in as
    MAINT, you might have to enter a password for the access mode (read, write) you
    are linking the disk in. Refer to "Creating a disk" on page 134 for more detail
    on access modes.


    4 The abbreviation for the QUERY command is Q.'
