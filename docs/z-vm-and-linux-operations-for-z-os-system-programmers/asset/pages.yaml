- pgno: 322
  md: '# Linux Logical Volume Manager


    Linux systems offer a feature to manage disks when you initially do not know how
    much space your partitions will consume: the Logical Volume Manager (LVM). LVM
    allows you to join disks together to form a single bigger logical disk, and then
    organize your partitions on this logically bigger disk. Figure 6-8 shows an example
    of managing disks under LVM.


    ![](img/b0a4b9056f819dccd4781a5105c92d45_322_0.png)


    *Figure 6-8  Linux LVM managing four DASDs.*


    As you can see, the four DASDs (1, 2, 3, and 4) are being used to form a single
    logical disk that holds the system’s partitions. The root filesystem (/) is *in
    reality* allocated on three different DASDs. The system does not know or care
    about this because the LVM code handles address translations and accesses the
    data on the real disks. The /home partition is also spread across two DASDs, and
    the /var, /tmp and /opt partitions are on a single DASD.


    In section 4.4, “Installing Linux” on page 171, we chose to make room for its
    root filesystem over multiple 3390-3 volumes. Assume, for example, that the 3
    GB /home partition that we created just ran out of space and we want to give it
    more space. The traditional way of resolving this problem is to bring a new DASD
    into the system, bigger than the one hosting the /home partition, and to move
    its'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'contents to the new disk area. This is very awkward, time consuming, and error
    prone. With LVM, though, this becomes an easy task.


    Extending a logical volume, such as the /var partition of our Linux installation,
    is a matter of adding one more disk or stripe of a disk to the logical group so
    that this new space can be given to any of its logical volumes. In a rough analogy,
    this is similar to building a new room to the side of your living room and later
    removing the wall between them. You are left with the exact same living room and
    extra space. Figure 6-9 illustrates this in terms of disks.


    ![](img/b0a4b9056f819dccd4781a5105c92d45_323_0.png)


    Figure 6-9 Expanding a Linux partition by adding more DASD to LVM


    Various Linux distributions, such as YaST, provide mechanisms for users to interact
    with LVM through a user interface. In systems where this is not available, commands
    can also accomplish LVM management. Several commands to know about are:


    +   - **pvcreate** Creates a physical volume entry on the disk, so that LVM knows
    about it.

    +   - **vgscan** Scans all disks for volume groups and builds the files /etc/lvmtab
    and /etc/lvmtab.d/* that are the databases for all other LVM commands.

    +   - **vgcreate** Creates a volume group by using the disks passed as parameters.
    These disks must first be initialized with pvcreate.

    +   - **vgextend** Adds a disks to a volume group. The disks must first be initialized
    with pvcreate.'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'lvcreate Creates a logical volume inside a volume group.


    lvremove Removes a logical volume from a volume group. You should use this only
    on empty volumes or volumes whose data is not of interest to you anymore.


    lvextend Extends a logical volume by using unallocated storage space in the volume
    group.


    To expand our 3 GB /home partition:


    +   1. As z/VM MAINT, attach another 3390-3 DASD to our z/VM system.

    +   2. As z/VM MAINT, define a minidisk on it and assign it to our Linux guest.

    +   3. As Linux root, use vgextend to add it to our volume group.

    +   4. As Linux root, use lvextend to expand our /home logical volume by using
    the newly added storage space to the volume group.


    For a more detailed discussion about Linux LVM and how to use it, refer to Linux
    for IBM eServer zSeries and S/390: Distributions, SG24-6264.


    You can also refer to the LVM HOWTO at:


    http://tldp.org/HOWTO/LVM-HOWTO/


    For a performance discussion on LVM itself, refer to:


    +   Disk performance optimizing:

    +   http://www.ibm.com/developerworks/linux/linux390/perf/tuning_rec_dasd_optimizedisk.html


    +   Volume management:

    +   http://www.ibm.com/developerworks/linux/linux390/perf/tuning_rec_dasd_volMan.html


    # 6.4.3 Network management


    This section details the steps required to add an additional network interface
    to a running Linux guest; then connecting this interface to a VSWITCH, a GUEST-LAN,
    or a Hipersocket network. After the network connectivity of the guest is established,
    configure Linux (SLES 10 or RHEL 5).


    # SUSE Linux Enterprise Server 10 (SLES 10)


    To configure Linux to use the connection:


    +   1. Make sure the devices are seen by Linux; we use the ls css command (Example
    6-7 on page 310).'
  merge: -1
  img_proc: true
