- pgno: 160
  md: '# 4.3.2 Installing z/VM from DVD


    This section assumes you have a first-level installation of z/VM from DVD onto
    DASD. Make sure you:


    +   - Complete the worksheet in Appendix B, "Planning worksheet" on page 403.

    +   - Have access to the Hardware Management Console (HMC) with a user ID that
    has authority to go into single object operations mode.


    z/VM 5.3 is shipped on tape and DVD. z/VM should install faster from tape because
    of faster I/O speeds, however, installing from tape might require more trips between
    the HMC and the tape drive.


    If you are familiar with the HMC, you can use the two page z/VM Summary for Automated
    Installation and Service (DVD Installation) to replace or augment the description
    that follows.


    If you are not familiar with the HMC and z/ VM, you might want to use the complete
    installation manual z/VM Guide for Automated Installation and Service Version
    5 Release 3.0, GC24-6099. It is out of the scope of this book to describe setting
    up an LPAR in the HMC for the system; there is no difference between creating
    an LPAR for z/VM and creating one for z/OS.


    If you are installing z/VM at the second level (z/VM under z/VM) or onto SCSI
    disk, use the z/VM manual because the following sections do not address these
    options.


    # Installing z/VM from DVD


    This section explains how to install z/VM 5.3 from an HMC with a DVD-ROM onto
    3390-3 equivalent DASD. We also point out differences for installing onto the
    larger 3390-9 DASD. For alternative configurations, such as installing from tape
    or onto SCSI disks, refer to the z/VM documentation.


    To install z/VM from DVD:


    +   1. On the Hardware Management Console, select the LPAR on which you want to
    install z/VM.

    +   2. If necessary, click the racetrack buttons (two buttons that are circular
    arrows on the bottom right corner) to traverse to the CPC Recovery (sometimes
    named just Recovery) menu.

    +   3. On the CPC Recovery menu, double-click the Integrated 3270 Console as shown
    in Figure 4-7 on page 146. A window named "Integrated 3270 Console for <yourCPC>"
    opens (on older HMC levels, the window might be named Personal Communications).'
  merge: -1
  img_proc: true
- pgno: 161
