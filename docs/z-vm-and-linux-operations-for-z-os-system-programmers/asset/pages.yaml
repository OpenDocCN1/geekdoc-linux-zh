- pgno: 16
  md: '# Why z/VM and Linux for System z?


    In this chapter, we explore the benefits of using z/VM and Linux on System z and
    how you can exploit these benefits.


    # Objectives


    After completing this chapter, you should be able to:


    +   - List the benefits z/VM can provide to your IT shop

    +   - Understand why companies are investing in z/VM and Linux on System z


    ![](img/b0a4b9056f819dccd4781a5105c92d45_16_0.png)'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# 1.1 Why z/VM?


    z/VM provides businesses with the ability to take full advantage of their IT resources
    by optimizing their utilization through virtualization. With over 40 years of
    experience, z/VM has become a leader in the field of virtualization. This section
    discusses the benefits of using that z/VM experience to support your IT infrastructure.


    # 1.1.1 The Virtual Machine Capability of z/VM


    z/VM presents a unique approach to computer operating systems. It provides each
    user with an individual working environment known as a virtual machine (VM). The
    virtual machine uses virtualization to simulate the existence of a real machine
    by sharing resources of a real machine, which include processors, storage, memory,
    and input/output (I/O) resources.


    Operating systems and application programs can run in virtual machines as guests.
    For example, you can run multiple Linux and z/OS images on the same z/VM system
    that is also supporting various applications and users. As a result, development,
    testing, and production environments can share a single physical computer.


    The virtual machine capability of z/VM allows you to perform the following tasks:


    +   - Test the programs that can cause abnormal termination of real machine operations
    without affecting the processing of production work that is running simultaneously.

    +   - Test a new release of an operating system.


    The isolation that is provided for a virtual machine enables system-oriented programs
    and teleprocessing applications, for example, to be tested on the virtual machine
    while production work is in progress; this testing cannot cause abnormal termination
    of the real machine.


    A new release of an operating system can be generated and tested at the same time
    that the existing release is performing production work. This enables the new
    release to be installed and put into production more quickly. The ability to operate
    multiple operating systems concurrently under z/VM can enable an installation
    to continue running programs that operate only under a back-level release (programs
    that are release-sensitive and uneconomical to convert, for example) concurrently
    with the most current release.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '+   - Test a new operating system.

    +   The existing operating system can be used to process production work concurrently
    with the generation and testing of a new operating system. Experience with the
    new system can be obtained before it is used on a production basis, without dedicating
    the real machine to this function.

    +   - Perform operating system maintenance concurrently with production work.

    +   The installation and testing of program temporary fixes (PTFs) for an operating
    system can be done at the same time that normal production operations are in progress.

    +   - Provide backup facilities for the primary operating system.

    +   A generated z/VM system is not model-dependent and can operate on various
    server models if the minimum hardware requirements are present. This enables a
    smaller server model that has less real storage, fewer channels, fewer direct
    access devices, and fewer unit record devices than a larger server model to provide
    backup for the larger model (normally at a reduced level of performance).

    +   - Perform operator training concurrently with production work processing.

    +   The real machine does not have to be dedicated to training additional or new
    operators or to providing initial training when a new operating system is installed.
    Operator errors cannot cause termination of real machine operations.

    +   - Simulate new system configurations before the installation of additional
    channels and I/O devices.

    +   The relative load on channels and I/O devices can be determined by using the
    simulated I/O configuration rather than the real I/O configuration. Experience
    with generating and operating an I/O configuration for multiple guests can be
    obtained using one real machine.

    +   - Test customer-written system exits.

    +   Customer-written system exits can be tested without disrupting production
    work.

    +   - Provide the same hardware configuration for guest operating systems

    +   The consistence of the same hardware means the use of the same drivers everywhere,
    so testing many different drivers is unnecessary. This reduces the amount of testing
    and configuration for different guest systems.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# 1.1.2 z/VM offers proven system integrity, security, reliability


    z/VM is built on a foundation of system integrity and security, and incorporates
    many design features for reliability and availability:


    +   - Integrity and security:

    +     - z/VM supports guest use of the cryptographic facilities provided by supported
    IBM servers.

    +     - IBM will correct any integrity exposures introduced by unauthorized programs
    into the system.

    +     - Kerberos authentication and Secure Sockets Layer (SSL) support are provided
    through TCP/IP for z/VM.

    +     - Integrated access control and authentication services can be augmented
    with the addition of the RACF® for z/VM feature or other external security managers.

    +   - Availability and reliability:

    +     - In application recovery, z/VM provides services that permit recovery of
    incomplete interactions with resource managers.

    +     - In automated operations, z/VM offers several levels of automated system
    management support. One example is the Programmable Operator. For a higher degree
    of automation, IBM SystemView® Host Management Facilities/VM can be added. Both
    the Programmable Operator and Host Management Facilities/VM can interact with
    IBM NetView® on z/VM, which in turn can interact with NetView on z/OS.

    +     - z/VM provides duplexed data with transparent ongoing synchronization between
    the primary and backup copy, and automatic transparent switching to the backup
    copy in case of an error in the primary copy.

    +     - Online configuration changes eliminate many previously required outages.

    +     - z/VM systems can be connected for improved server and user availability.

    +     - Fast restart from an outage reduces the effect on users.


    # 1.2 Why Linux?


    Linux on System z is all about helping to remove complexity from your IT infrastructure:
    reducing server sprawl; keeping a lid on software licensing fees; and minimizing
    the need for human intervention in managing and maintaining your servers.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Open Source


    IBM is committed to open source as both a license and a development model for
    several reasons:


    +   - IBM clients and partners have requested open source software (including
    Linux) support for all IBM platforms, products, and solutions.

    +   - Open source software, with its wide distribution and use, typically becomes
    an industry standard.

    +   - Innovation within the open source community typically occurs at a higher
    rate and volume than in closed-source communities.


    # Linux Technology Center (LTC)


    IBM is a major contributor to the open source community, with over 250 developers
    worldwide working full time on many initiatives. One initiative is the Linux Technology
    Center (LTC), which enable the enterprise capabilities of Linux through development
    and contribution of technology, utilities, tools, and code.


    To learn more about the LTC go to:


    http://oss.software.ibm.com/linux


    # 1.3 Why Linux and z/OS together with z/VM?


    This section looks at using z/VM in combination with Linux on System z and z/OS.
    Because z/VM provides a highly flexible test and production environment, it is
    an easy way to deploy a fully functional operating system, such as Linux, on System
    z or z/OS. This allows for server simplification through server consolidation.


    # 1.3.1 Server simplification


    As companies have grown, their IT infrastructures have also grown. This has caused
    most companies to increase their number of stand-alone servers, storage devices,
    and applications. The increase can lead to enormous inefficiency issues and system
    management headaches.


    The growth and its results have lead companies to employ server simplification
    using virtualization. In simple terms, *virtualization* offers a way to help consolidate
    a large number of individual small machines on one larger server, easing manageability
    and more efficiently using system resources. The resources can then be prioritized
    and allocated to the workloads needing them'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'most at any given time. As a result, you can reduce the need to over-provision
    for individual workload spikes. For more information see:

    http://www-03.ibm.com/systems/z/advantages/virtualization/index.html


    # Server simplification outside System z


    With the ability to run Linux on System z, information technology departments
    are able to simplify their processes by consolidating their multiple server farms
    down to a single System z running z/VM and Linux on System z. This leads to both
    hardware savings and power savings, and it simplifies the management of your infrastructure,
    freeing up various IT resources so you can focus on mission-critical tasks.


    Using virtualization, the ability to bring up Linux systems takes a matter of
    minutes rather than days waiting for new hardware and the installation process
    to complete. Because each Linux image is running in its own virtual system, the
    Linux images do not affect the other systems around them.


    # Server simplification inside System z


    Server simplification does not always have to happen outside your System z. Sometimes
    the best place is directly inside the mainframe, meaning taking other operating
    systems, such as z/OS, that are on other logical partitions (LPARs) and moving
    them to a single LPAR running z/VM. Several benefits are the ability to:


    +   - Free up LPARs for more mission critical environments

    +   - Rapidly bring up and down test and development environments

    +   - Help reduce the cost of upgrades because you can free up LPARs and not have
    to buy another System z


    z/VM enables you to have a spare system on which to try out an idea or to isolate
    a task. Because z/VM is capable of making available almost limitless spare systems
    in virtual machines, it allows your IT department to effectively use the whole
    power of their System z. An advantage of making one system look like many is that
    you can create an exact replica of your production system on which to test your
    new programs, services, and procedures. This is a relatively inexpensive way to
    have your own test system (or as many test systems as you would like). It is also
    a safe way to test a new function, because your real production system and its
    applications and data, are protected from any damage that the new function might
    cause if you tested it on the host system.'
  merge: -1
  img_proc: true
- pgno: 22
  md: "# 1.3.2 Ten great reasons to run Linux as a guest of z/VM\n\nRunning the Linux\
    \ operating system as a guest of z/VM is a smart choice. Consider the following\
    \ benefits¹ z/VM offers a Linux guest environment:\n\n+   - **Sharing resources**\n\
    +     Resources can be shared among multiple Linux images running on the same\
    \ z/VM system. These resources include processor cycles, memory, storage devices,\
    \ and network adapters.\n+   - **Server hardware consolidation**\n+     Running\
    \ tens or hundreds of Linux instances on a single System z server offers customers\
    \ savings in space and personnel required to manage real hardware.\n+   - **Virtualization**\n\
    +     The virtual machine environment is highly flexible and adaptable. New Linux\
    \ guests can be added to a z/VM system quickly and easily without requiring dedicated\
    \ resources. This is useful for replicating servers in addition to giving users\
    \ a highly flexible test environment. See 2.1.1, \"Benefits of virtualization\"\
    \ on page 10 for more benefits.\n+   - **System z advantages**\n+     Running\
    \ Linux on z/VM means the Linux guest or guests can transparently take advantage\
    \ of z/VM support for System z hardware architecture and RAS features.\n+    \
    \ \n+     z/VM supports Integrated Facility for Linux (IFL) processors, which\
    \ can be an attractively-priced hardware feature for Linux workloads running on\
    \ System z.\n+   - **z/VM connectivity**\n+     Using guest LANs and virtual switches\
    \ (VSWITCH), z/VM provides high-performance communication among virtual machines\
    \ running Linux and other operating systems on the same processor. The underlying\
    \ technologies enabling high-speed TCP/IP connections are virtual channel-to-channel\
    \ (CTC) adapter support and VM IUCV (Inter-User Communication Vehicle). Simplification\
    \ of the network by using HiperSockets™ can provide savings and reduce cabling,\
    \ hubs, switches, and routers. It can also help to reduce the maintenance effort.\n\
    +   - **Minidisk driver**\n+     Linux on System z includes a minidisk device\
    \ driver that can access all DASD types supported by z/VM."
  merge: -1
  img_proc: true
- pgno: 23
  md: '+   - **Data-in-memory**

    +     Data-in-memory performance boosts are offered by VM exploitation of the
    z/Architecture®.

    +   - **Debugging**

    +     VM offers a rich debug environment that is particularly valuable for diagnosing
    problems in the Linux kernel and device drivers.

    +   - **Control and automation**

    +     z/VM''s long-standing support for scheduling, automation, performance monitoring
    and reporting, and virtual machine management is available for Linux virtual machines.

    +   - **Horizontal growth**

    +     An effective way to grow your Linux workload capacity is to add more Linux
    guests to a z/VM system.'
  merge: -1
