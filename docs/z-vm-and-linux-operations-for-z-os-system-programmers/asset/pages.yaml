- pgno: 153
  md: '# 4.3 Installing z/VM in an LPAR


    This section discusses installation of z/VM in an LPAR. For more detailed installation
    instructions, see:


    http://www.vm.ibm.com/install/vm53inst.pdf


    # 4.3.1 Planning


    Before starting the z/VM and Linux installations, plan carefully to make sure
    you have the following required resources:


    +   - Hardware

    +   - Software

    +   - Networking


    Planning also involves considerations for passwords, disks, memory, and for creating
    a resources worksheet.


    # Hardware resources


    The following hardware is required:


    +   - A System z logical partition (LPAR); z800, z900, z890 or z990, System z9®
    or System z10:

    +     - Processors or CPUs: One IFL (or CP) minimum, two or more are strongly
    recommended. In Systems z9 and earlier systems you are not able to mix general
    CPUs and IFLs.

    +     - Memory: 3 GB central with 1 GB expanded minimum, 6 GB with 2 GB or more
    recommended. This 3:1 ratio of central to expanded storage is a good starting
    point for all systems except the very largest systems.

    +     See the following Web site for a discussion of how to apportion memory:

    +     http://www.vm.ibm.com/perf/tips/storconf.html

    +     - DASD: twelve 3390-3 or five 3390-9 at a minimum

    +     - Open Systems Adapter (OSA) network cards: One card minimum with eight
    device numbers (technically six, but OSA triplets usually start on an even address).
    Two OSA Express cards with eight device numbers on one card, and four on the other
    is recommended for high availability.

    +   - A network-attached computer that can act as a file server of Linux distributions
    with at least 3 GB of disk space plus 6 GB for each Linux distribution that you
    intend to serve, although more might be needed.'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'Setting up a server is *not* described in this book, however we reference helpful
    publications in the following section, “Software resources” on page 139.


    +   - A workstation or desktop that has network access to the mainframe


    # Software resources


    The following software resources are required:


    +   - z/VM 5.3 installation media with documentation (installation from DVD is
    described in this book).

    +   - Linux installation media (SLES or RHEL)

    +   - An operating system for the file server

    +     - You can easily set up a file server by using an existing Linux environment.
    The *z/VM and Linux on IBM System z: The Virtualization Cookbook for SLES9*, SG24-6695
    book has instructions for setting up an NFS server.

    +     - Additional options to an NFS server are HTTP or FTP, served on the Apache
    web server or on usual FTP servers found on Linux distributions. Instructions
    for setting up Apache are at the following Web site:

    +       - http://www.apache.org

    +   - The code associated with this book

    +   - Tools on the workstation and desktop:

    +     - A 3270 Emulator such as Attachmate Extra, Hummingbird Host Explorer, or
    IBM Personal Communications for Windows desktops (for Linux desktops, a 3270 emulator
    named *x3270* is available)

    +     - A Linux SSH client such as PuTTY (recommended) or TeraTerm (for Linux
    desktops the SSH client is built in)

    +   - A VNC viewer


    # Networking resources


    The following network resources are required:


    +   - A TCP/IP address for z/VM

    +   - One TCP/IP address for each z/OS, z/VM or Linux guest operating system

    +   - Associated TCP/IP information:

    +     - DNS host name

    +     - DNS domain

    +     - DNS server TCP/IP address

    +     - TCP/IP gateway

    +     - TCP/IP subnet mask'
  merge: -1
  img_proc: true
