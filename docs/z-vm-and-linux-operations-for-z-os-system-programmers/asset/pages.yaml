- pgno: 316
  md: '# 6.3 Networking access


    This section describes how to give network access to your guest operating systems.
    We discuss how you define that access for LANs and VSWITCHs.


    # DEFINE LAN command


    Use this command to create a guest LAN that can be shared among virtual machines
    on the same VM system. Each guest LAN is identified by a unique combination of
    owner ID and LAN name. A VM user can create a simulated network interface card
    (NIC) and connect it to this LAN segment.


    > Note: The SET LAN command can modify attributes of the guest LAN.


    You can also define a LAN during system initialization using the DEFINE LAN configuration
    file statement. The class B form of the command allows the invoker to create a
    LAN for another user (for example, OWNERID SYSTEM) and specify whether accounting
    is on or off for the LAN being defined.


    # DEFINE VSWITCH command


    Use this command to create a CP system-owned switch (a virtual switch) to which
    virtual machines can connect. Each switch is identified by a switch name. A z/VM
    user can create a simulated QDIO network interface card (NIC) and connect it to
    this switch with the NICDEF directory statement. Under the DEFINE VSWITCH statement,
    the VLAN parameter is important, but optional, if you want to isolate guests subnets
    based on VLAN IDs.


    # 6.4 Linux on System z resource management


    This section discusses the necessary steps to enable dynamically new resources,
    such as disks, network interface card, can CPU, to a Linux guest.


    Explaining the details of Linux on System z hardware detection and configuration
    is beyond the scope of this book. Nevertheless, providing a brief outline of the
    processes involved is necessary to help you understand the next section.


    # 6.4.1 Hardware detection and configuration


    This section discusses device drivers and the in-memory file system.'
  merge: -1
  img_proc: true
- pgno: 317
  md: "For additional information about both, refer to *Devices Drivers, Features,\
    \ and Commands, SC33-8289*. The latest version can be found on Developerworks\
    \ Web site at:\nhttp://www.ibm.com/developerworks/linux/linux390/october2005_documentation.html\n\
    \n# Devices nodes and udev\n\nThe Linux kernel represents the character and block\
    \ devices it knows as a pair of numbers, <major>:<minor>. Certain major numbers\
    \ are reserved for particular device drivers, others are dynamically assigned\
    \ to a device driver when Linux boots. For example, major number 94 is always\
    \ the major number for DASD device drivers, but the device driver for channel-attached\
    \ tape devices has no fixed major number. A major number can also be shared by\
    \ multiple device drivers.\n\nThe device driver uses the <minor> number to distinguish\
    \ individual physical or logical devices. For example, the DASD device driver\
    \ assigns four minor numbers to each DASD: one to the DASD as a whole and the\
    \ other three for up to three partitions. Device drivers assign device names to\
    \ their devices, according to a device driver-specific naming scheme. Each device\
    \ name is associated with a minor number.\n\nHistorically, Linux provides a large\
    \ set of predefined device nodes in the /dev directory. Most of the time, only\
    \ a small subset of these device nodes were used. With Linux 2.6, things changed:\
    \ only a small number of predefined device nodes are in the /dev directory; and\
    \ a user-space daemon, udev, is in charge of creating the required device nodes\
    \ in /dev dynamically when notified by the kernel that a new device is plugged\
    \ in. Udev can also be used to tune the device node names to fit an organization's\
    \ needs or set permissions on nodes, for instance.\n\nFor information about udev\
    \ capabilities, see the udev manual page (man 7 udev).\n\n# /sys filesystem\n\n\
    After a device has been brought online in Linux, device drivers expose their parameters\
    \ to the userspace through an in-memory file system called /sys.\n\n> **Note:**\
    \ /sys filesystem does not exist on disk. It is re-created each time a Linux guest\
    \ IPLs.\n> \n> /sys is the successor of /proc filesystem, which still exists for\
    \ downward compatibility.\n\nThe /sys filesystem allows initialization scripts\
    \ or users to interact with the drivers parameters to query or modify the configuration."
  merge: -1
  img_proc: true
- pgno: 318
  md: '# 6.4.2 Disk management


    # Enabling a disk in Linux


    After the new disk has been defined, is in the directory, and is dynamically attached
    to the guest (as explained in section 5.3.9, “Managing DASD” on page 258), it
    can be enabled in Linux.


    Use the lscss command, which stands for List Channel Subsystem to show all the
    devices that are attached to your system. Example 6-1 shows the output of the
    lscss command before and after attaching the disk as device 0200.


    # Example 6-1 The lscss command output, before and after attaching new DASD to
    guest


    ```

    lnxguill:~ # lscss

    Device   Subchan. DevType CU Type Use  PIM PAM POM CHPID

    ------------------------------------------------------------

    0.0.0191 0.0.0000 3390/0A 3990/E9     F0 F0 FF 52565A5E 00000000

    0.0.0100 0.0.0001 3390/0C 3990/E9 yes F0 F0 FF 5054585C 00000000

    0.0.0101 0.0.0002 9336/10 6310/80 yes 80 80 FF 00000000 00000000

    0.0.0150 0.0.0003 3390/0C 3990/E9 yes F0 F0 FF 5054585C 00000000

    [...]

    lnxguill:~ # lscss

    Device   Subchan. DevType CU Type Use  PIM PAM POM CHPID

    ------------------------------------------------------------

    0.0.0191 0.0.0000 3390/0A 3990/E9     F0 F0 FF 52565A5E 00000000

    0.0.0100 0.0.0001 3390/0C 3990/E9 yes F0 F0 FF 5054585C 00000000

    0.0.0101 0.0.0002 9336/10 6310/80 yes 80 80 FF 00000000 00000000

    0.0.0150 0.0.0003 3390/0C 3990/E9 yes F0 F0 FF 5054585C 00000000

    [...]

    0.0.0200 0.0.0012 3390/0C 3990/E9     F0 F0 FF 5054585C 00000000

    lnxguill:~ #

    ```


    At this point, the disk is seen by Linux, but it has to be enabled for the operating
    system to be able to use it. The disk is enabled with chccwdev command, as shown
    in Example 6-2, is provided by IBM and delivered in the s390-tools package.


    # Example 6-2 Enabling a disk for Linux


    ```

    lnxguill:~ # chccwdev -e 0.0.0200

    Setting device 0.0.0200 online

    Done

    lnxguill:~ #

    ```


    To enable a device, use the -e switch; to disable a device, use the -d switch.
    When the disk is brought online, the Linux kernel assigns the disk a device node'
