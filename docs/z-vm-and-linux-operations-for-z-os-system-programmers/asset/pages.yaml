    # 7.3.2 Tivoli OMEGAMON for z/VM and Linux


    OMEGAMON® is a real-time software performance monitor for the VM (Virtual Machine)
    operating system. It runs under the Conversational Monitor System (CMS) operating
    system. OMEGAMON warns you of exceptional conditions automatically, and also displays
    the status of VM internal operations and resources in real time.


    All OMEGAMON features and facilities are designed for the concept of a logical
    tuning approach to improve the performance of your system. The logical tuning
    approach consists of the following steps:


    +   1. Defining standards for VM performance at your installation.'
