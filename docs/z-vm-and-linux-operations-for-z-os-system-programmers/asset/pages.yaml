- pgno: 413
  md: '# 9.7 Putting your serviced z/VM into production


    After maintaining your z/VM with service, an IPL is required because it could
    be service to CP.


    When convenient, depending on your service hours or other conditions, IPL the
    system. As with any other operating system, all users, or in this case, all virtual
    machines, will be shut down. z/VM has the ability to perform a SHUTDOWN REIPL,
    provided it is issued from a virtual machine having the proper privilege class
    to do it¹. Virtual machines that are required to run at all times, can be automatically
    logged off (AUTOLOG) during IPL.


    ¹ Does not have to be performed from an HMC console as opposed to a z/OS IPL'
  merge: -1
  img_proc: true
