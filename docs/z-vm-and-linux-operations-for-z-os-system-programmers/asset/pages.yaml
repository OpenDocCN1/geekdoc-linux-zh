- pgno: 114
  md: 'Applications that can benefit most from 64-bit addressing include:


    +   - Databases

    +   - Applications requiring access to large amounts of data

    +   - Java applications


    Although most middleware has been or will be ported to 64-bit, it is important
    to note that not all can benefit from the larger address space. In these cases,
    the middleware continues to operate in 31-bit addressing mode on a 64-bit Linux
    distribution using *compatibility mode*. For this reason 31-bit libraries are
    available on 64-bit distributions, as shown in Figure 3-1.


    ![](img/b0a4b9056f819dccd4781a5105c92d45_114_0.png)


    Figure 3-1 Compatibility mode system call emulation


    # Integrated Facility for Linux (IFL)


    An IFL is a processor reserved for Linux (or Linux under VM). The significance
    is that it cannot be used to run other operating systems, and its existence is
    not reflected in the system model number, MIPS rating, or other capacity ratings.
    The system model, MIPS, or other capacity rating method has significant implications
    for software costs. Adding an IFL does not affect the costs associated with your
    system MIPS, which permits the use of Linux without affecting other software costs.'
  merge: -1
  img_proc: true
