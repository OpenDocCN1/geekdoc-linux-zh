    # 5.6 Monitoring the system


    System monitoring is one of the most important activities to administer a computer
    system. At some time, you will have to look at the system’s resource usage to
    decide whether the system should be given more storage, DASD, or CPU. Alternatively,
    you can get the most out of your hardware if you can identify resource wastes
    in an LPAR, the virtual machine, or guest.


    Tools exist in the z/VM and Linux worlds to allow you to accomplish these goals.
    Chapter 7, “Performance monitoring and system analysis” on page 319 gives a detailed
    overview on them.


    # 5.7 Backing up data


    As robust as a system might be, reasons exist why you should always back up the
    data regularly:


    +   Natural disasters, such as a fire


    +   Unexpected power outage that causes data corruption


    +   Hardware failure


    +   Program errors that destroys data


    High-end systems, such as z/VM and Linux, cannot afford to lose data in a production
    system. Therefore, they have a variety of tools to help you back up your data.
    Chapter 8, “System events and logs, backup and recovery” on page 351 lists tools
    and commands available.


    # 5.8 Maintaining the system


    Systems must be maintained for several reasons:'
  merge: -1
  img_proc: true
- pgno: 296
  md: '+   - Security updates

    +   - Software level upgrade

    +   - Installation of new features


    For those reasons, shutting down the production systems to perform maintenance
    is not desirable. In Chapter 9, “Applying system maintenance” on page 387 we talk
    about the ideal way to maintain a z/VM system and how it compares to z/OS.


    # 5.9 Debugging the system


    As much as a system administrator can be careful about his system by continuously
    monitoring and maintaining it, problems do arise. Knowing where to look for information
    to fix the problems, however, is what makes the difference between an ordinary
    and a good administrator. Chapter 8, “System events and logs, backup and recovery”
    on page 351 explains the tools available in z/VM and Linux that allow you to come
    to logical conclusions about a problem based on facts.'
