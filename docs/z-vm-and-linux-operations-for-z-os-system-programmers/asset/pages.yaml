  md: '# 2.4 Control Program (CP)


    The two primary components of z/VM are the Control Program (CP) and the Conversational
    Monitor System (CMS). The other z/VM components are discussed later in this chapter.
    In this section, we explain the functions and concepts of CP. We also discuss
    the modes of execution.


    # 2.4.1 CP functions and concepts


    CP is the operating system that underpins all of z/VM. CP is responsible for virtualizing
    your System z machine''s real hardware and allowing all the virtual machines to
    simultaneously share real hardware resource.


    CP also handles the creation and management of virtual machines. It can be considered
    the operating system component of z/VM because it is responsible for managing
    real devices and resources and sharing them among various tasks and users that
    need them.


    > z/OS analogy: CP is analogous to the NUCLEUS or SUPERVISOR in z/OS or the kernel
    in a Linux operating system.


    As a resource manager, CP can provide you with a set of virtual machines, which
    can run any operating system that would not ordinarily run on your System z hardware.
    Without CP you could be running only one operating system on your hardware at
    any given time (logical partitioning aside), and each one can have multiple virtual
    machines (also known as guests), and each one allows you to run an instance of
    an operating system simultaneously. As shown in Figure 2-4 on page 34, CP allows
    you to run many Linux and z/OS images simultaneously on the same piece of hardware.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '![](img/b0a4b9056f819dccd4781a5105c92d45_49_0.png)


    Figure 2-4 CP executing many guest operating systems


    Notice in the figure that, even though we only have 4 CPUs and 16 GB of real storage,
    our guest virtual machines are collectively defined to have 16 CPUs and 20 GB
    of storage. This is because the CPUs and storage in a guest''s operating system
    are virtual. You can create a guest that has 64 CPUs if you prefer; CP will take
    turns executing tasks on behalf of all 64 virtual CPUs on all of the available
    real processors. The CP components that handle this task are known as the scheduler
    and the dispatcher.


    z/OS analogy: These components are very much like the process scheduler and dispatcher
    of z/OS or the scheduler of Microsoft® Windows and GNU/Linux, except they schedule
    entire virtual machines for execution instead of simply processes.


    Note that the ability to overcommit resources like this only works because an
    operating system typically does not need 100% of the resources allocated to it
    all the time that it is running. Sometimes that operating system might be idle,
    and when it is, another operating system can use the hardware resources.


    Virtual machines are defined in a text file known as the user directory as discussed
    in 2.2.4, “User directory” on page 18. For each virtual machine on the system,
    a section in the directory describes that virtual machine. One of these descriptions
    is known as a directory entry.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# 2.4.2 CP modes of execution


    At any time, your virtual machine is in one of two basic states of execution:


    +   - Running a guest operating system (guest mode or emulation mode)

    +   - Not running a guest operating system (CP mode)


    When a guest operating system is running, it is controlling the devices and resources
    of your virtual machine. Any commands you issue to the virtual machine through
    your terminal command line are likely interpreted by the guest operating system
    and not CP.


    However, when your virtual machine is not running a guest operating system, CP
    has control, and your processors and other virtual devices are generally sitting
    idle, not consuming real machine resources. In this state, any command issued
    to the virtual machine through your terminal command line is interpreted by CP
    and not a guest operating system.


    Before you start a guest operating system, you are in CP mode. When you start
    a guest operating system, you are in guest mode. If you shut down your guest operating
    system, you are returned to CP mode. Your virtual machine can only be in one of
    these modes at any instance in time.


    You may, however, switch between these modes any time, even when your guest operating
    system is running. If you switch to CP mode while a guest operating system is
    running, that operating system becomes frozen and will not run again until you
    leave CP mode and return to guest mode. At that time, the guest operating system
    continues running as though it had never been interrupted.


    # 2.5 Conversational Monitor System (CMS)


    The Conversational Monitor System (CMS) is the most commonly used point of interaction
    with z/VM. CMS exposes the vast power of the mainframe through a rich set of commands
    and utilities that build on the toolset CP provides. It is an operating system
    designed to facilitate mainframe virtual machine administration by providing users
    an environment with a higher functional level than CP. The'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'CMS executes on top of CP just as any other another operating system that can
    run on CP.


    **z/OS analogy:** CMS is similar to TSO in z/OS and user space in LINUX.


    CMS can help you perform a variety of tasks such as: writing, testing, and debugging
    application programs for use on CMS or guest systems; executing application programs
    developed on CMS or guest systems; creating and editing data files; sharing data
    between CMS and guest operating systems; and communicating with other system users.


    **Note:** CMS is a powerful operating environment, but be aware that CMS *cannot*
    run at the same time as another guest operating system—only CP can do that.


    # 2.5.1 Overview of the HELP command in CMS


    This section and the following sections explain the use of the Help system (the
    HELP command (**he lp**)) in CMS. They describe task, component, and command menus,
    and discuss formatting options, such as selecting a layer (level). The sections
    list other ways to invoke the Help system, how to handle messages, and how to
    exit the Help system in CMS.


    The useful **he lp** command in CMS command provides information about many standard
    system tasks. It also provides the syntax and function of all CMS and CP commands,
    and the meaning of error messages that can be reported to users.


    Use the **he lp** command if you cannot remember the format of a command, or if
    you are looking for information about what a command does. The output displays
    the same information that is contained in the IBM documentation.


    The easy-to-use **he lp** command is similar to the **man** command on Linux systems.
    If you type **he lp** by itself, a list of options and their descriptions are
    displayed.


    The next several sections of this chapter explain how to access the **he lp**
    command more directly. To select an entry from the menu, place your cursor on
    the appropriate word and press Enter. Another help window opens, such as a task
    menu or a command menu.


    **z/OS analogy:** The **he lp** command is similar to TSO HELP or to the HELP
    panels in ISPF.'
  merge: -1
  img_proc: true
