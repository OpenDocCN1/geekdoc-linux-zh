  md: 'handling data transfer between the z/VM system and outside sources. Data is
    stored on a spool after RSCS receives it and until RSCS can forward it to its
    destination. RSCS uses communications equipment to transfer data between the local
    z/VM system and other systems or remote locations.


    A node in an RSCS network is either a system node or a station node. A station
    node, which can originate and receive information, can be a computer, a workstation,
    or a printer. A system node, however, must be a computer. In addition to originating
    and receiving information, system nodes can also relay information between two
    other nodes.


    RSCS can communicate with system nodes that are running under the control of network
    job entry (NJE)-compatible subsystems, which might require licensing, such as:


    +   - JES2 or JES3

    +   - RSCS

    +   - VSE/POWER

    +   - AS/400® Communications Utilities

    +   - Products that provide NJE functions for Linux or AIX®


    RSCS can communicate with the following types of station nodes:


    +   - ASCII printers or plotters

    +   - Computers running under the control of a system that can provide a multil­eaving
    protocol

    +   - IBM 3270 Information Display System Printers

    +   - Line printer router (LPR) daemons and clients in a TCP/IP network

    +   - Unsolicited File Transfer (UFT) daemons and clients in a TCP/IP network

    +   - Workstations running under the control of remote job entry (RJE)


    Each link in an RSCS network is associated with a programming routine, called
    a *driver*, that manages the transmission and reception of files, messages, and
    commands over the link. The way that a driver manages the data is called a *protocol*.
    All file transmission between networking nodes uses NJE protocol, 3270 printers
    use 3270 data streams, workstations use RJE protocol, and ASCII printers use data
    streams appropriate to that printer.


    Systems Network Architecture (SNA) provides one set of protocols that governs
    communications on links. The method that RSCS uses for sending data to a node
    varies, depending on the type of connection used to exchange the link. RSCS can
    support send-on-send (such as binary synchronous communication or channel-to-channel),
    SNA, and TCP/IP connections.


    > **z/OS analogy:** RSCS networking is similar to JES2 networking in z/OS.'
  merge: -1
  img_proc: true
