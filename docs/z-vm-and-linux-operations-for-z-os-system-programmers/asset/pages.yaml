- pgno: 148
  md: '# Disk access conventions


    Now that you have learned the basic concepts of disk access, this section describes
    several conventions related to disk access.


    The A CMS user typically has at least two available disks (probably minidisks,
    which we discuss later). Usually with CMS, a user has a pair of virtual disks
    with addresses 191 and 190:


    +   - The 191 disk is conventionally accessed with mode A.

    +   - The 190 disk is accessed as S. The 190 minidisk is sometimes known as the
    CMS system residence volume, because it is where the CMS nucleus resides on disk.


    # Your A disk


    CMS assumes that you have disks at addresses 190, 191, and 19E. It also determines
    whether you have a disk at address 192. When CMS loads, these disks are accessed
    as follows:


    +   - 191 becomes the A disk

    +   - 192 becomes the D disk (if it exists)

    +   - 190 becomes the S disk

    +   - 19E becomes the Y/S disk


    This succeeds only if your user has DASD with a virtual address of 191. The A
    disk is a work disk for a user''s permanent file storage. Generally the A disk
    of CMS users is the only writable disk they have access to. This is similar to
    the home directory of users in systems that account user DASD space.


    The A disk is exceptionally important because when CMS is loaded, it looks for
    a file named PROFILE EXEC on your A disk and attempts to execute that file.


    The PROFILE EXEC is often modified to customize the CMS instance for a given user,
    or even to load another operating system like Linux.


    # Running out of space


    Each virtual disk is divided into blocks that are usually 4096 bytes in size (although
    some disks, such as the help disk, use smaller blocks to save wasted disk space
    from the number of small files on them).


    The minimum size of each file is one block. The maximum is limited by the size
    of the minidisk. Each user normally has read-access to a number of these types
    of disks. But often, users have trouble when they have no remaining space to write
    their own files.'
  merge: -1
  img_proc: true
