    This section provided a brief overview of how z/VM and Linux tools handle errors,
    and detailed several tools that can be used when you analyze why an application
    causes problems.


    Sometimes, an abnormal program termination can lead to data corruption, for example
    if an application was writing some data to a disk when it crashed. In this case,
    the only option might be to restore data from an already-existing backup, to return
    to a state in which the data is consistent. Backup and restore tools are described
    in the next sections of the chapter.


    # 8.4 Backup and restore


    Backup refers to making copies of data so that these copies can be used to restore
    the original after a data loss event. These additional copies are typically called
    backups and are useful for two primary purposes:


    +   - To restore a state following a disaster (called disaster recovery)

    +   - To restore small numbers of files after they have been accidentally deleted
    or corrupted


    Backups can be classified according to the way they are created:


    +   - Offline backups are disruptive, and require planning.

    +   - Online backups do not interrupt operations.


    This chapter introduces tools available for backing up and restoring z/VM and
    Linux data.'
