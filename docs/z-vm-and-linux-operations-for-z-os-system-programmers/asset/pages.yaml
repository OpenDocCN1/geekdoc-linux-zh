- pgno: 110
  md: '# Introducing Linux on System z to z/OS system programmers


    In this chapter, we give an overview of where Linux came from, where it is now,
    and where it is going. We also take a deeper look into Linux on System z and the
    benefits from it.


    # Objectives


    After completing this chapter, you should be able to:


    +   - Discuss basic concepts of Linux

    +   - Use basic skills to navigate in Linux

    +   - Identify basic Linux commands


    ![](img/b0a4b9056f819dccd4781a5105c92d45_110_0.png)'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# 3.1 Overview of Linux


    This section gives an overview of Linux and how it interacts with the System z.
    It looks at what comprises a distribution of Linux on System z, and highlights
    the major features of the most popular enterprise Linux editions for System z
    distribution.


    # 3.1.1 History of Linux


    In the simplest terms, Linux is an operating system. It was developed beginning
    in 1991 by a University of Helsinki student named Linus Torvalds (Linux stands
    for Linus UNIX). Linux itself is actually just the kernel; it implements multitasking
    and multiuser functionality, manages hardware, allocates memory, and enables applications
    to run.


    Over the years, the Linux operating system has become a real and viable alternative
    for PC users, and corporate servers and users. Linux delivers the power and flexibility
    of a UNIX server or desktop. It also provides a set of utilities, Internet applications,
    and a fully functional desktop interface.


    The Linux operating system has become a server platform for powerful Internet
    and many other applications. Linux is capable of running from a corporate Web,
    File Transfer Protocol (FTP), file and printer servers, to wide-area information
    server (WAIS) Web sites or even corporate database servers, with real-time clusters
    or high performance computing clusters.


    Linux is a fully functional operating system similar to a UNIX system. It has
    many of the standard features of enterprise UNIX systems. Management of the command
    structure is enabled through a shell.


    > **z/OS analogy:** This shell is much like the ISPF shell (ishell). This is also
    similar to the z/OS TSO environment.


    Enhanced graphical environments and desktops are also available.


    The structure of Linux is organized on file systems that provide the interfaces
    and abstraction needed to work with data and files. Files are organized into directories
    with the disk hardware. Each directory can contain any number of subdirectories
    each holding files. This is a similar structure to classical PC and UNIX operating
    system file structures. Linux supports the majority of the existing file systems,
    either by having kernel built-in support or through kernel modules.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# 3.1.2 Components of Linux


    Linux has three fundamental components:


    +   - **Kernel**

    +     This provides low-level system control and interfaces, program and hardware
    device management, and an abstraction layer for the user level.

    +   - **init**

    +     This is usually the main program executed after the kernel is loaded into
    memory. From init, you can execute different run levels on the user space, with
    different characteristics.

    +   - **Applications**

    +     Linux applications cover many categories. The list is ever-expanding as
    more companies embrace this technology. Through writing applications for Linux,
    development costs usually decrease, spawning new projects and increasing the number
    of titles overall. Across the many horizontal and vertical markets with a Linux
    presence, we can cite the following categories: office productivity, Internet-related,
    network and systems management, software development, video production, data management,
    accounting and finance, and publishing.


    Linux has the same multi-user and multitasking capabilities as large UNIX operating
    systems. It provides the same level of system administration that you find on
    standard UNIX systems. Users can run multiple programs concurrently; it has separate
    levels for user space and kernel space. You can create user accounts for different
    users, and define their access rights to the files and system components. Installation
    of new devices and network connection and control is also provided as standard
    in the Linux operating system.


    # 3.1.3 Linux on System z distributions


    Supported Linux distributions for System z are currently available from two major
    Linux distributors: Novell’s SUSE Linux Enterprise Server (SLES) and Red Hat Enterprise
    Linux (RHEL). Each distribution of Linux has its pros and cons.


    Linux that supports the S/390® architecture has been generally available since
    early 2000 either from IBM developerWorks® or from the Linux distribution partners.
    All the current distributions (as of May 2008) are based on the Linux 2.6 kernel.
    Each distribution includes additional middleware and applications. The distribution
    also includes infrastructure services such as domain name server (DNS), Dynamic
    Host Configuration Protocol (DHCP), and Network File System (NFS) file servers,
    and packages such as the Apache Web server, Squid proxy server, Simple Mail Transfer
    Protocol (SMTP) mail server, and Samba Windows'
  merge: -1
  img_proc: true
- pgno: 113
  md: "networking server. These distributions also leverage the HiperSockets technology\
    \ of the System z server to interconnect between different partitions.\n\nThe\
    \ distributions that are available for System z are:\n\n+   - Novell: SUSE Linux\
    \ Enterprise Server (SLES) 10, Kernel 2.6.16 is available from:\n+     http://www.novell.com/partners/ibm/mainframe/\n\
    \n+   - Red Hat: Red Hat Enterprise Linux (RHEL) 5, Kernel 2.6.18 is available\
    \ from:\n+     http://www.redhat.com/rhel/server/mainframe/\n\n+   - Debian: Debian\
    \ Etch, Kernel 2.6.18 is available from:\n+     http://www.us.debian.org/ports/s390/\n\
    \n+   - Build your own: download the kernel from:\n+     http://www.kernel.org\n\
    \nFor more information about new hardware features available with latest kernel\
    \ upgrades, see developerWorks navigation for Linux on System z at:\n\nhttp://oss.software.ibm.com/developerworks/opensource/linux390/index.html\n\
    http://www-03.ibm.com/systems/z/os/linux/\n\n# 31-bit and 64-bit options\n\nLinux\
    \ on System z solutions are available for 31-bit and 64-bit environments. The\
    \ option availability depends on the System z model and the Linux distribution.\n\
    \n> Note: The choice between the 31-bit and 64-bit addressing environments can\
    \ depend on the application or middleware you are planning to use. Some software\
    \ does not support 64-bit addressing mode and might not work properly.\n> \n>\
    \ The latest versions (SLES10 and RHEL5) of the distributions are 64-bits only.\
    \ Older versions (SLES9, RHEL4) are available as 31 or 64-bits distributions.\n\
    \nThe Linux 2.6 kernel has undergone substantial testing in 64-bit mode, and is\
    \ intended for large-scale, highly-available systems. The IBM strategy is focused\
    \ on middleware applications running on 64-bit platforms. Whenever possible, a\
    \ 64-bit enterprise Linux distribution is recommended. The 64-bit kernel offers\
    \ greater memory addressability, and provides greater flexibility for running\
    \ Linux on System z. With the 64-bit kernel, you can run many small Linux images\
    \ or fewer but larger Linux images in a given z/VM partition."
  merge: -1
