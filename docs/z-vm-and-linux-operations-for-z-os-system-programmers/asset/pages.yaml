    # 3.2.5 Linux vi editor


    The Linux vi editor is a text editing utility included in every Linux distribution.
    This section introduces the vi editor by describing the three operating modes
    of vi and how to switch from one mode to another, and describes basic vi commands.


    # Modes of operation


    The vi editor operates in three modes:


    +   - Command mode: You enter commands in this mode.


    +   - Insert mode: You insert characters at the cursor position.


    +   - Replace mode: You overwrite the character at the cursor position.


    To switch from one mode to another:


    +   - From command mode to insert mode, press one of these single keys but do
    not press Enter:


    ```

    i, I, a, A, o, O

    ```


    > Note: Typing a single character immediately brings vi to the insert mode. Do
    not make the mistake of pressing Enter after that. If you do, it will be treated
    as input in the Insert mode.


    +   - From command mode to replace mode, press R (again, without Enter).


    +   - From replace or insert mode to command mode, press Esc.'
