- pgno: 156
  md: '# Disk planning


    In the planning stage, consider the following aspects when choosing and allocating
    disk storage:


    +   - Conventional ECKD™ DASD versus FBA disks over SCSI/FCP

    +   - 3390-3 versus 3390-9 or large disk support

    +   - Amount of disk storage per Linux image and how to allocate file systems


    # DASD versus SCSI/FCP


    This book describes how to use conventional ECKD DASD and does not discuss FBA
    disks accessed over SCSI/FCP. The reason is not because either technology is superior,
    but because DASD seems more common than SCSI/FCP disks. Sometimes, a combination
    of these two types of disk storage is used. When that is the case, the ECKD emulated
    DASD is often used for the root file system and SCSI/FCP disks are used for large
    data storage areas.


    # 3390-3 versus 3390-9


    Emulated 3390-3 format is about 2.3 GB, and 3390-9 format is three times the size
    or about 6.8 GB. Either size will work, although several performance analysts
    recommend the 3390-3 instead of 3390-9. This book mainly describes using 3390-3s,
    however, where differences exist when using 3390-9s, we added comments, especially
    when installing z/VM.


    # Disk storage per Linux image


    To install a graphical environment (the K Desktop Environment) into our Linux
    guest and also to retain lots of free space for general purpose tasks (that the
    authors would like to play around with), we decided to use about 10 GB of storage
    for the guest. The amount of space you will need for your particular goals with
    Linux on z/VM can vary, but having a root partition (/) of 3 GB to 4 GB, at least,
    is recommended for any Linux installation because, with the extra space, you might
    easily grow later from a minimal package set to a full package set installation.


    In our examples, five 3390-3s, each comprising 3339 cylinders, are allocated for
    the Linux image. Often, recommendations are made to create many file systems to
    be mounted over directories other than the root file system itself (/), such as
    /usr/, /var/, /tmp/, /home/, /opt/, and others. We do not do this for all of our
    examples because:


    +   - We are not optimizing the installation for any particular use. For more
    information about optimizing Linux partitioning, read *Linux Performance and Tuning
    Guidelines*, REDP-4285.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '+   We initially have only 10 GB available for the installation, and segregating
    storage with that little space can lead us to too many small partitions that will
    bring the system to a useless state very quickly.


    One common argument for having many mounted file systems is to prevent the root
    file system from filling up, bringing the system to a halt. For example, in a
    production environment where the Linux guest is acting as a file server, remote
    attacks can cause the logs in /var to consume all of the space of the partition
    on which it resides. This can halt the system if /var resides on the same partition
    as the root partition (/).


    > Note: Having a good partitioning plan is the first step to having an optimized
    and reliable Linux guest.


    # Memory planning


    Planning memory can be the most difficult issue with Linux on System z and z/VM,
    yet the most important to ensure adequate performance. The simplest solution can
    appear to involve having enough central memory (storage) in the LPAR so that z/VM
    never pages and Linux never swaps. However, such resource is often not realistically
    available. A good rule of thumb is to allocate memory on a just-enough basis for
    each Linux server. A good starting point is to set a virtual-machine size by changing
    the memory allocation value at just over the value at which the guest starts to
    swap at the Linux system level, when under normal loading. If some level of sustained
    swapping is inevitable because of the nature of the workloads, then ensure virtual
    disks are used for the swap media.


    Understanding memory planning is definitely recommended. The following books discuss
    this very important topic:


    +   The book Linux on IBM System z: Performance Measurement and Tuning, SG24-6926
    on the Web at: http://www.redbooks.ibm.com/redpieces/abstracts/sg246926.html?open


    +   The IBM z/VM Performance Resource pages in general, on the Web at: http://www.vm.ibm.com/perf/


    +   Configuring Processor Storage, at: http://www.vm.ibm.com/perf/tips/storconf.html


    One rule that can be recommended is to only have as few virtual machines logged
    on (or disconnected) as possible to handle the workload. Every virtual machine
    that is not required should be logged off where appropriate. The result is more
    memory for the other virtual servers that remain running.'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'We set up our examples with Linux guests that are allocated 512MB of initial
    storage plus more 1.5 GB of extended storage (for Linux swap). This is more than
    enough for the purposes of this book.


