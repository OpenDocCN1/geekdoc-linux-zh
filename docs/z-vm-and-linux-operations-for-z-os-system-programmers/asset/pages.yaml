    # 8.2.3 Dumps and traces


    This section gives an overview of the dumps and traces facility in z/VM.


    # Dumps


    A dump is a picture of either the virtual machine or the partition''s storage.
    If a problem is encountered, it can probably be found somewhere in this picture.
    A dump can be used to identify the moment in time when malfunctions begin.'
  merge: -1
  img_proc: true
- pgno: 381
  md: 'Several z/VM components can generate dumps:


    +   - CP itself

    +   - A virtual machine in which CMS, or another z/VM component, or a guest operating
    system is running

    +   - A communication controller


    Several types of dumps are available in z/VM, depending on the component that
    created it, or the information required for analysis:


    +   - A CP dump. This is a dump of the storage directly owned by CP. It is generated
    by CP during a hard abend and results in system termination and possibly a restart.


    > Note: The query dump command (abbreviated as q dump) shows the device that will
    be used to store the CP DUMP file. CP DUMPs are created in the virtual reader
    of the virtual machine defined in the SYSTEM CONFIG, under System_UserIDs - OPERATNS
    by default. See Example 8-4 on page 357 for an example SYSTEM CONFIG Dump statement.


    +   - A snapdump. This is a dump of the storage directly owned by CP and is very
    similar to a hard abend dump but does not result in system termination.

    +   - A CP soft abend dump. This is a dump of a small amount of the storage directly
    owned by CP. It is created when CP encounters a problem where system integrity
    is not compromised by the error, or when CP can isolate an error to a virtual
    machine. It does not result in system termination.

    +   - A stand-alone dump. Sometimes, a problem can be so severe that your system
    cannot even produce a CP dump on its own. For this reason, every z/VM system is
    equipped with a special program that produces a dump of real storage, regardless
    of how severe the problem is. It is called a stand-alone dump because the program
    that produces it stands alone or is independent of the rest of the system programming.
    Because it is independent of the system programming, any problems there do not
    prevent the dump from being created.

    +   - A dump limited to any single virtual machine (VMDUMP) running in your z/VM
    system. For example, you can request a dump of a virtual machine containing CMS,
    RSCS, or any guest operating system that resides in a virtual machine.

    +   - A dump of a communication controller''s storage.


    If your virtual machine is running a Guest operating system such as Linux or z/OS,
    it is recommended to use the tools available for that operating system rather
    than the z/VM dump tools. Refer to 8.3.2, "Error analysis tools" on page 372 for
    a discussion about Linux dump tools.'
  merge: -1
  img_proc: true
- pgno: 382
