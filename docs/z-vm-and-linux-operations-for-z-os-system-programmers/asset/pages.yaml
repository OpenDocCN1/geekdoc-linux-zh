    # 4.4.3 Logging into the Linux system


    To close the installation guide in a great style, nothing is better than logging
    into the system you have just installed in a nice and pleasant way: Virtual Network
    Computing (VNC). To do that, you must have a VNC client installed on your machine.
    You can use Linux''s vncviewer client or get one for Windows, such as RealVNC.
    In our examples we use RealVNC.


    # Connecting to the guest using VNC


    Start the RealVNC application and type in the IP address of the server (your Linux
    system) followed by the port number the VNC server is running on it. Figure 4-32
    on page 215 shows our VNC client connecting to our Linux guest system.'
