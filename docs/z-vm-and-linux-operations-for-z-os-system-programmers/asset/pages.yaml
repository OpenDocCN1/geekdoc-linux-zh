- pgno: 59
  md: '# 2.5.7 Exiting the Help system


    To exit the Help system in CMS at any time, use PF3 or type quit on the command
    line. These both take you back to the prior view. Note that you might have to
    issue the quit command multiple times if you have descended into the Help menu
    hierarchy and want to back out one level at a time.


    As an alternative, you can use PF4 to completely leave the Help system with one
    key stroke.


    > z/OS analogy: Navigating the HELP menu in z/VM is similar to navigating the
    ISPF HELP menu in z/OS.


    # 2.6 Networking options in z/VM


    The System z brand offers many solutions to improve your network connectivity.
    Some of the key aspects about networking are the features implemented on System
    z and z/VM, which are OSA adapters, HiperSocket, and VSWITCH.


    # 2.6.1 OSA adapters


    The Open Systems Adapter (OSA) is a network controller that you can install in
    a mainframe I/O cage. The adapter integrates several hardware features and supports
    many networking transport protocols, including fast Ethernet, gigabit Ethernet,
    10 gigabit Ethernet, Asynchronous Transfer Mode (ATM), and token ring.


    Several versions of the OSA are available: OSA-Express, OSA-Express2, and OSA-Express3.
    The features of each are slightly different. The older OSA-2 cards have been superseded
    by the newer OSA-Express and OSA-Express2 cards and are no longer available, but
    many older mainframes still use them.


    Network connectivity for the z/VM system or any of its guest operating systems
    could be provided by directly dedicating specific OSA addresses to the system.
    This can be done by the DEDICATE statement in the user directory or by attaching
    the devices to the guest user IDs.


    # 2.6.2 HiperSockets


    HiperSockets technology is available for System z servers. HiperSockets is an
    integrated any-to-any virtual TCP/IP network that provides inter connectivity
    among multiple LPARs or z/VM guests. With HiperSockets, you can connect any'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'server running on the same System z, and improve response time due to low latency.


    HiperSockets was developed to provide highly available, high-speed network connections
    through a memory bus. It can be considered for an application or for infrastructure
    scenarios, where the network is stressed by a large quantity of data exchanged
    between servers running on the same System z server. It also provides higher security
    because packets do not leave the box so they cannot be sniffed on the LAN.


    Figure 2-10 on page 46 shows a possible implementation of HiperSockets over an
    applications server scenario. When you use a Linux for System z technology to
    produce an application environment, you usually plan to have a three-layer architecture:


    +   ► Front layer is the HTTP server.

    +   ► Middle layer is the application server.

    +   ► Back-end layer is the database server.


    With the proposed architecture, the environment can be planned with:


    +   ► IBM HTTP Server (powered by Apache) under Linux for System z

    +   ► IBM WebSphere Application Server under Linux for System z

    +   ► DB2® server under z/OS


    If a session is started by a browser over the network, a communication between
    the three layers is started. To avoid network traffic, implementing a HiperSockets
    solution can help. With benefits provided by HiperSockets, your network traffic
    between the layers is exchanged in the System z server at memory speeds.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '![](img/b0a4b9056f819dccd4781a5105c92d45_61_0.png)


    Figure 2-10 The application server scenario with HiperSockets


    More information about HiperSockets is available in section 6.3, “Networking access”
    on page 301.


    # 2.6.3 HiperSockets for fast LPAR communication


    HiperSockets provides the fastest TCP/IP communication between consolidated Linux,
    z/VM, z/VSE, and z/OS virtual servers on a System z server. HiperSockets provides
    internal virtual local area networks, which act like TCP/IP networks within the
    System z server. This integrated Licensed Internal Code (LIC) function, coupled
    with supporting operating system device drivers, establishes a higher level of
    network availability, security, simplicity, performance, and cost effectiveness
    than is available when connecting single servers or logical partitions (LPs) together
    using an external TCP/IP network.


    The HiperSockets function, also known as internal Queued Direct Input/Output (IQDIO)
    or internal QDIO, is an integrated function on the System z servers that provides
    users with attachment to high-speed logical LANs with minimal system and network
    overhead.


    HiperSockets eliminates the need to use I/O subsystem operations and the need
    to traverse an external network connection to communicate between LPs in the same
    System z server. HiperSockets offers significant value in server consolidation
    connecting many virtual servers, and can be used instead of some coupling link
    configurations in a Parallel Sysplex®.'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'HiperSockets is customizable to accommodate varying traffic sizes. Because
    HiperSockets does not use an external network, it can free system and network
    resources, eliminating attachment costs while improving availability and performance.


    # HiperSockets connectivity


    HiperSockets are accessible among combinations of logical partitions (LPs) or
    virtual servers within the System z. This *network within the box* concept minimizes
    network latency and maximizes bandwidth capabilities between z/VM, Linux on System
    z, z/VSE, and z/OS images, or combinations of these. It is also possible to have
    HiperSockets under z/VM, which permits internal networks between guest operating
    systems, such as many Linux servers, for example.


    Each HiperSockets LAN uses a Channel Path ID (CHPID) with a channel type IQD.
    Figure 2-11 shows an example of HiperSockets connectivity using four HiperSockets
    with CHPIDs FC, FD, FE, and FF.


    ![](img/b0a4b9056f819dccd4781a5105c92d45_62_0.png)'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# HiperSockets benefits


    System z HiperSockets is a technology that provides high-speed TCP/IP connectivity
    between virtual servers running within different logical partitions (LPs) of a
    System z server. It eliminates the need for any physical cabling or external networking
    connections between these virtual servers.


    The virtual servers form a virtual LAN. Using iQDIO, the communication between
    virtual servers is through I/O queues set up in the system memory of the System
    z server. Traffic between the virtual servers is passed at memory speeds. HiperSockets
    supports multiple virtual LANs, which operate as TCP/IP networks within a System
    z server. Section "HiperSockets connectivity" on page 47 discusses the number
    of HiperSockets available for each System z server.


    HiperSockets is an LIC function of the System z server. It is supported by the
    following operating systems:


    +   - All in-service z/OS releases

    +   - All in-service z/OS.e releases

    +   - All in-service z/VM releases

    +   - All in service z/VSE releases

    +   - Linux on System z


    A number of benefits are gained when exploiting the HiperSockets function:


    +   - HiperSockets can be used to communicate among consolidated servers in a
    single System z server platform. All the consolidated hardware servers can be
    eliminated, along with the cost, complexity, and maintenance of the networking
    components that interconnect them.

    +   - Consolidated servers that have to access corporate data residing on the
    System z server can do so at memory speeds, bypassing all the network overhead
    and delays.

    +   - HiperSockets can be customized to accommodate varying traffic sizes. (In
    contrast, LANs such as Ethernet and Token Ring have a maximum frame size predefined
    by their architecture.) With HiperSockets, a maximum frame size can be defined
    according to the traffic characteristics transported for each of the possible
    HiperSockets virtual LANs.

    +   - Because there is no server-to-server traffic outside the System z server,
    a much higher level of network availability, security, simplicity, performance,
    and cost-effectiveness is achieved as compared with servers communicating across
    an external LAN. For example:

    +     - HiperSockets provides a very secure connection because it has no external
    components, it provides a very secure connection. For security purposes, servers
    can be connected to different HiperSockets. All security'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'features, like firewall filtering, are available for HiperSockets interfaces
    as they are for other TCP/IP network interfaces.


    +   - HiperSockets looks like any other TCP/IP interface; therefore, it is transparent
    to applications and supported operating systems.


    +   - HiperSockets can also improve TCP/IP communications within a sysplex environment
    when the DYNAMICXCF facility is used.


    For an in-depth discussion on HiperSockets, refer to the IBM System z Connectivity
    Handbook, SG24-5444.


    # 2.6.4 VSWITCH


    Virtual switch, or VSWITCH, is the newest LAN type supported by z/VM. It was introduced
    in release 4.4 of z/VM and is a special type of guest LAN that can provide external
    LAN connectivity through HiperSockets or an OSA-Express device without requiring
    a routing virtual machine.


    z/VM does require that one particular machine own the OSA-Express devices that
    are used by the VSWITCH. These special virtual machines are called VSWITCH controllers,
    and are essentially extra TCP/IP stacks that manage the OSA on behalf of the systems
    connected to the VSWITCH. Earlier releases of z/VM had a single predefined VSWITCH
    controller. Starting with z/VM 5.1 and newer versions have two predefined VSWITCH
    controllers: DTCVSW1 and DTCVSW2.


    Another benefit of a VSWITCH is that it can easily be configured with redundant
    OSA devices and additional controllers so that in the event of a problem, either
    the switch can fail over to a backup OSA or controller.


    Figure 2-12 on page 50 shows a logical view of a virtual switch and where it fits.'
  merge: -1
  img_proc: true
