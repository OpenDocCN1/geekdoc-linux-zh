    # 8.3 Linux activity logging and error analysis


    Activity logging is built in every Linux distribution. Every kernel-related message
    and daemon-related message is logged into a common directory, whatever the distribution
    is. These messages can be:


    +   - Information messages: For instance, someone has logged on the machine through
    SSH from a given IP address.

    +   - Warning messages: For instance, one of the configuration options of a daemon
    cannot be applied, but did not prevent the daemon from starting.

    +   - Error messages: For instance, someone unplugged the network cable from your
    network interface.


    Going through the contents of these log files is a first step for error identification.


    # 8.3.1 Linux activity logging


    Two Linux daemons responsible for logging kernel and user activities: klogd and
    syslog, or syslog-ng:


    +   - klogd for kernel-related messages

    +     klogd is the kernel logger. It intercepts and translates the messages issued
    by the kernel itself, and passes them, formatted, to syslog for archiving.

    +   - syslog and its variants for everything in the user space

    +     syslog is the user space logger. It collects information from various daemons
    running in the system, and saves the messages to files for further reference.'
  merge: -1
  img_proc: true
