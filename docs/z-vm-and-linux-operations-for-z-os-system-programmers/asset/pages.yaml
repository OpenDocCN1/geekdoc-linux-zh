    # Restore from tape to DASD


    Requirements are a tape drive attached to z/VM as 181 device, and a RESTAPES VOLUMES
    A (see Example 8-20) file with the list of target DASDs to restore to. It is possible
    to skip some DASDs in the restore process by specifying skip in the input file.


    Example 8-21 is the script used to restore from tape to DASDs.


    # Example 8-20 Input file RESTAPE VOLUMES A


    ```

    1800

    1801

    1802

    1803

    1804

    skip

    1806

    1807

    1808

    1809

    ```


    # Example 8-21 Example script to restore an environment from tape to disk


    ```

    /* DDR volumes must be defined in file restape volumes a */

    Parse upper arg fnl ftl fml

    If fml = '''' then fml=''A''

    If fnl = '''' then do

    FNL=''RESTAPE''

    ftl=''VOLUMES''

    fml=''A''

    End

    call traiffic

    Traitement:

    do i = 1 to volumes.0 by 1

    if (volumes.i,1) = ''skip'' then

    do

    SAY "Skipping 1 disk"

    TAPE FSF 1

    end

    else

    do

    parse var volumes.i volout .

    call restore

    end

    ```'
