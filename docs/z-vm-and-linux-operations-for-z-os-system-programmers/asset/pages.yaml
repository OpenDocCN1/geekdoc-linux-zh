  md: 'longer sufficient information for performing capacity planning. IBM Tivoli
    Performance Modeler for z/OS V2.3 can be used to model the effect of changing
    the following items:


    +   - Number and speed of CPUs

    +   - Disk I/O response times

    +   - Paging rates (auxiliary and expanded memory paging)

    +   - Logical partition (LPAR) definitions and parameter changes


    The Tivoli Performance Modeler takes input from z/OS images, including system
    and application performance data, as a basis for the modeling program. The user
    can then make changes to the type of processor and modify the workload configuration
    to create a new model. The modeler then creates a series of graphs to depict the
    modeled workload.


    # 7.3.4 IBM z/VM Planner for Linux guests on IBM System z Processors


    The z/VM Planner for Linux Guests on IBM System z Processors (z/VM Planner) is
    a PC-based productivity tool that runs under Microsoft Windows. (IBM employees
    and authorized IBM Business Partners can use the tool with their customers.) It
    is designed to provide capacity planning insight for IBM mainframe processors
    running various Linux workload environments as guests under VM. Input consists
    primarily of z/VM guest definitions and capacity requirements for each intended
    Linux guest. The total guest capacity requirement is calculated based on the guest
    definitions and, because all guests probably do not have peak utilization at the
    same time, a user-specified complementary peak percentage is used to calculate
    the true combined capacity requirements of the z/VM guests being sized. The tool
    also models z/VM processor requirements when merging new guests into existing
    VM images. The resulting guest capacity requirement is combined with that of VM
    to support the entire complement of guests.


    The z/VM-Planner produces several graphs that depict the modeled system. The graphs
    illustrate the size of processor needed to support the modeled workload, the percent
    of that processor used by each application in the workload, and the estimated
    minimum and maximum processing capacity necessary for the workload. Figure 7-4
    on page 342 represents the minimum and maximum capacity requirements for a modeled
    workload with five Linux guests running a mixture of Web applications, databases,
    and file servers.'
  merge: -1
  img_proc: true
