  md: '# End a job


    If you want to cancel a job, type one of the following kill commands:


    ```

    kill jobnumber

    ```


    ```

    kill jobname

    ```


    With the kill command, you can specify a number, which is a level that signals
    how you want to kill the process. The format is:


    ```

