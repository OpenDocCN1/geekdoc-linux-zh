    But the point here is to recognize that there are a variety of virtual devices,
    including some DASD packs, a punch card reader, and a printer. You might also
    have other devices, depending on how your virtual machine is defined.


    # Privilege classes


    CP uses privilege classes to regulate the types of things that virtual machines
    are allowed to do.'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'z/OS analogy: The concept of privilege class or similar does not exist in z/OS
    from the operating system perspective. This concept (or similar) would have to
    be assigned in RACF or a similar product. The UNIX System Services component of
    z/OS, however, has permissions set in its file system.


    The privilege classes are conceptually similar to permissions in a Linux environments.


    When your system administrator created your virtual machine, the administrator
    assigned you a certain subset of the privilege classes available on the system.
    Each privilege class is denoted by either a single letter or a single number,
    each one defining a certain role for the user having that class.


    The IBM default privilege classes are A to G, and all except class G define certain
    system administrator roles. Class G defines the general user and is the default
    class for users that have no administrative capability. It is the most restrictive
    class.


    Use the QUERY PRIVCLASS command to list the privilege classes for which your virtual
    machine is authorized; Example 2-19 shows output from this command.


    # Example 2-19 Output from the QUERY PRIVCLASS command


    ```

    QUERY PRIVCLASS

    Privilege classes for user TUX1

    Currently: G

    Directory: G

    ```


    This means that your virtual machine can execute any command that is valid for
    class G users. Because the set of commands in any given privilege class is customizable
    by the system administrator, the set of commands you are able to run might vary
    slightly from the example.


    CP also provides a command, QUERY COMMANDS, that lists all commands available
    to you, so having to remember your privilege classes or which commands go with
    them is unnecessary. Example 2-20 displays output from the command QUERY COMMANDS.


    # Example 2-20 Output from the command QUERY COMMANDS


    ```

    QUERY COMMANDS

    ADSTOP ATTN BEGIN CHANGE CLOSE

    COMMANDS COUPLE CPFORMAT CPU DEFINE DETACH

    DIAL DISCONNECT DISPLAY DUMP ECHO EXTERNAL

    ```'
  merge: -1
  img_proc: true
