  md: '![](img/b0a4b9056f819dccd4781a5105c92d45_71_0.png)


    Figure 2-14 z/VM screen after logon


    At this point, you are logged on to your z/VM virtual machine. Before discussing
    basic commands for checking your virtual machine, we discuss introductory information
    about VM commands.


    In our description, we use the term command generically; it refers to both CP
    commands and CP utilities. z/VM uses command languages to correspond to the two
    environments it creates the control program and virtual machine.


    Use the Control Program (CP) command language when:


    +   - You are a z/VM system operator and you want to control the resources of
    the real machine located in your computer room.

    +   - You are a virtual machine user and you want to control your virtual machine''s
    configuration and environment.


    Use a virtual machine command language when you communicate with the operating
    system you loaded into your virtual machine, as follows:


    +   - To perform production or test work, load your virtual machine with one of
    the operating systems supported by the z/VM system. Your virtual machine command
    language is the command language of the operating system you load. This command
    language is described in the library that documents that particular operating
    system.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'To perform service, installation, and maintenance tasks, along with editing
    and text creation, communicating with others, and problem solving, load your virtual
    machine with the CMS, which is a single user, conversational operating system.


    You can use CP commands in the following situations:


    +   - Your virtual machine is in the Control Program (CP) command environment.

    +     Your virtual machine is in the CP environment when you log on to z/VM and
    CP READ is displayed in the lower right corner of the window.

    +     On a line-mode ASCII device, no status area is available to display CP READ,
    so CP is displayed in the output area.


    +   - You press the Break key while in full-screen mode before entering a command.

    +     The break key can be PA1, the VM default break key, or another key that
    you have defined as the break key using the TERMINAL BRKKEY command.

    +     Also, the break key might be totally disabled by some application programs
    or when in the protected application environment.


    +   - You are in a virtual machine command environment, not running in full-screen
    mode, and enter the #CP command (and # is your logical line end character).


    +   - You are in the CMS virtual machine environment and enter the CP command.


    +   - You are in the CMS virtual machine environment and have the IMPCP function
    set ON.


    To determine the current command environment on a 3270 device, look at the status
    area in the lower right corner of the display. CP READ indicates the CP environment,
    VM READ indicates the virtual machine environment.


    If you are running CMS in your virtual machine, VM READ indicates the CMS environment.
    When RUNNING appears in the status area, enter a null input line to determine
    your environment. To enter a null line, press Enter but do not enter any data.
    When you enter the null line, the status area displays either CP READ or VM READ.


    Also, if you are in a read state, in either the CP command environment (with RUN
    set OFF) or the CMS command environment, and you enter a null line, the system
    responds with the name of your command environment: CP or CMS in the system output
    area.


    You enter CP commands using any combination of upper case and lower case letters.
    Type the command and its operands, and then press Enter to process the command.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Working with a 3270 terminal


    Previously, we explained how to log on to the z/VM system, and you saw the response
    from the system. Now we discuss what you have to know when working with a 3270
    terminal on a z/VM system.


    Figure 2-15 shows the layout of the 3270 window.


    ![](img/b0a4b9056f819dccd4781a5105c92d45_73_0.png)


    Figure 2-15 Layout of the 3270 window


    The three areas of the window are: Output display area, User input area, and Screen
    status area, as described in Table 2-1.


    Table 2-1 Display areas


    | Area | Description |

    |---|---|

    | Output display area | - Consists of lines 1 to 22.

    - All messages are displayed here.

    - The commands you entered are displayed here. |

    | User input area | - Consists of last two lines, excluding the right-most 21
    character positions of the last line.

    - Commands can be entered here.

    - Cursor control keys, Delete key, Insert Key and logical text editing characters
    can be used to alter data in this area.

    - After pressing Enter, CP redisplays the data entered here in the output display
    area. |'
  merge: -1
  img_proc: true
- pgno: 74
  md: '| Area | Description |

    |------|-------------|

    | Screen status area | • Consists of the right-most 21 character positions of
    the last line. • Screen status indicators appear here. • Indicates whether the
    current environment is CP or VM. • The status displayed here can be one of the
    following values: - CP READ indicates CP issued a read request to the display
    and is waiting for the user to enter something before it can continue processing.
    - VM READ indicates the virtual machine is awaiting a response from the user before
    it can continue processing. - RUNNING indicates CP or VM is either ready to accept
    commands, or is processing an already executed command. - MORE ... indicates that
    the output display area is full but more data is available to display, as follows:
    • CP waits 60 seconds (default) and then displays the next window. • Use the PA
    key (3270) to see the next screen without waiting 60 seconds. • Use the Enter
    key (3270) to keep the current screen (status changes to HOLDING). - HOLDING indicates
    that user pressed Enter (3270) in response to MORE ... - NOT ACCEPTED indicates
    that the previous input was not accepted (CP locks keyboard for 3 seconds). |


    a. Use SET FULLSCREEN ON from CMS if you want the scroll back option. This is
    disabled by default. (Note this works only for CMS.)


    # 2.7.6 Session management


    Your session begins when you log to the system, and it ends when you log off.
    This section describes the logging on, logging out, and several other actions
    you can perform during a session.


    # Logging on


    Refer to Figure 2-13 on page 55 as you read through the following details in this
    section about logging on.


    +   The logon screen contains three fields:

    +   - USERID

    +   - PASSWORD

    +   - COMMAND


    As mentioned in 2.7.5, "Getting to know your virtual console" on page 54, the
    two ways to log in are as follows:


    +   • Enter your user name and password in the USERID and PASSWORD fields.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '+   Use the COMMAND line by issuing the CP LOGON command, which has many parameters
    that can customize how you log on to the system.


    To use the COMMAND line, press the Tab key until your cursor is positioned on
    the COMMAND line. (You can also use the arrow keys or your mouse to manually move
    the cursor to the COMMAND line.)


    On the COMMAND line, issue the LOGON command. The simplest use of the LOGON command
    is shown in Example 2-4.


    Example 2-4 Simple use of LOGON command


    ```

    LOGON TUX1

    ```


    This command prompts you for a password. If the password you enter is correct,
    the system logs you on as user TUX1 just as though you had entered the user name
    and password in the USERID and PASSWORD fields.


    # Notes:


    +   If you type an incorrect user name or password on the logon screen, the normal
    input fields (USERID and PASSWORD) disappear and you are forced to use the LOGON
    command from the COMMAND line if you want to try to log in again. Therefore, knowing
    how to use the COMMAND line is important in case you insert a typographical error
    when you first try to log on.


    +   The CP LOGIN command is identical to the CP LOGON command. Both exist because
    some people prefer to use the term log in and others prefer log on.


    # Disconnecting


    CP provides a very useful feature known as disconnecting. You may disconnect your
    terminal from your virtual machine without stopping or interfering with the guest
    operating system running in your virtual machine in any way. This effectively
    severs your actual terminal session with the virtual machine (similar to logging
    off), but the virtual machine and its guest operating system continue to run.
    Use the DISC (or disc) command to disconnect, as shown in Example 2-5 on page
    61.


    > z/OS analogy: z/OS has no similar command.'
  merge: -1
  img_proc: true
