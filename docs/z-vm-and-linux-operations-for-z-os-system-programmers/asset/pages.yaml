- pgno: 164
  md: '![](img/b0a4b9056f819dccd4781a5105c92d45_164_0.png)


    Figure 4-10 Selecting z/VM 5.3 ramdisk system


    +   b. In the "Confirm the action" window, click Yes. You should see the "Load
    from CD-ROM, DVD or Server Progress" window. The green light on the DVD drive
    should light up.


    +   c. When you see the message Completed successfully, click OK to close. This
    usually takes about four to six minutes.


    > Attention: Although the z/VM ramdisk (IBMVMMRAM) loads in about four to six
    minutes, slow load times have been observed (15-18 minutes). When the green light
    on the DVD drive is solid, the load time is acceptable. When it is intermittently
    dark more than it is green, long load times can result.


    You should now have an in-memory z/VM 5.3 system running. The tasks performed
    in this section are similar to loading a Linux kernel onto memory for installation.
    You can compare this section with section 4.4.2, "Booting the Linux kernel for
    installation" on page 199 and later verify that both systems load an image to
    main memory before the installation commences. One difference is that Linux starts
    the installation program automatically, whereas in z/VM you must invoke a command
    as stated in the next section.


    # Copying a z/VM system image to DASD


    To copy z/VM to DASD:


    +   1. Get out of Single Object Operations mode by logging off the primary SE
    window by closing that window.


    +   2. Use the Alt+Tab sequence to move to the Integrated 3270 console window.
    The ramdisk IPLs and the system come up with the MAINT user ID logged on. You
    should see z/VM boot as shown in Figure 4-11 on page 150.'
