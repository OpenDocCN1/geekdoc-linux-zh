- pgno: 203
  md: '# Creating a PROFILE EXEC


    To create a simple PROFILE EXEC that is run each time this user ID is logged on:


    +   1. Create the new file and add the following lines. REXX EXECs must always
    begin with a C language-style comment.


    ```

    ==> x profile exec a

    ====> a 5

    /* PROFILE EXEC */

    ''acc 592 e''

    ''cp set run on''

    ''cp set pf11 retrieve forward''

    ''cp set pf12 retrieve''

    ====> file

    ```


    This PROFILE EXEC accesses the TCPMAINT 592 disk as file mode E, sets CP run on
    (read section "Disconnecting" on page 60 for an explanation on the RUN parameter),
    and sets the retrieve keys per the convention.


    You can add more configuration features to your profile. Although we do not mention
    them here because they do not relate to the installation steps themselves, you
    can see them in 5.2, "Running the system" on page 230.


    +   2. You could test your changes by logging off and logging back on. However,
    typing the command PROFILE does the same. By default, CMS tries to access the
    191 disk as A and the 192 disk as D. Also, you should have the TCPMAINT 592 disk
    accessed as E. To see your minidisks, use the QUERY DISK (q disk) command:


    ```

    ==> profile

    DMSACP7231 E (592) R/O

    ==> q disk

    LABEL VDEV M STAT CYL TYPE BLKSZ FILES BLKS USED-(%) BLKS LEFT BLK TOTAL

