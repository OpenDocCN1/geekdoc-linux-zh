  md: 'the designated virtual machine to perform system maintenance is MAINT, but
    z/VM sites can establish other virtual machines dedicated for such activities.


    The maintenance is normally performed by using the “Virtual Machine Serviceability
    Enhancements Staged/Extended (VMSES/E)” product, which can be considered the z/VM
    equivalent of “System Modification Product/Extended (SMP/E)” in z/OS (providing
    the same set of services). VMSES/E includes a set of tools in the form of EXECs
    that perform the tasks necessary to maintain the z/VM system. Because of z/VM
    nature, the process of maintaining a z/VM system is a more interactive task, compared
    to z/OS. With z/OS, personnel typically prepare and run batch jobs to perform
    these tasks.


    # 9.3 VMSES/E terminology


    This section explains several terms used for z/VM maintenance.


    # 9.3.1 Deliveries


    General service or maintenance to a z/VM system is usually divided into the following
    classifications of delivery:


    +   - Recommended Service Upgrade (RSU)


    +   - Corrective Service (COR)


    +   - Expanded Service Option (ESO)


    The ESO is a defined collection of services in COR format. It can include services
    within a range of starting and ending service levels, or can be more specific
    or customized regarding types of service, or customized to your profile.


    A downloaded file containing service is often referred to as an envelope.


    # 9.3.2 Element terms


    Element terms are described in the following list:


    +   - The terms authorized program analysis report (APAR) and program temporary
    fixes (PTF) are used within VMSES/E and have the same meaning as in SMP/E.


    +   - The term small programming enhancement (SPE) is used for service for installing
    a new release or version of a product. This corresponds to the SMP/E term FUNCTION.'
  merge: -1
  img_proc: true
- pgno: 405
  md: 'The terms *local service* or *local modifications* refer to any service not
    supplied by IBM on a COR or RSU service tape or other media. This includes:


    +   - Service such as PTFs that you have been forced to install because of errors
    between COR or RSU cycles

    +   - Any modifications caused by third-party software installations

    +   - Any local modifications you have installed to tailor your system


    **z/OS analogy:** In SMP/E for z/OS, modifications (third-party or local) are
    similar to USERMODs. The PTFs installed *in between* CORs and RSUs would have
    no special definition attached to them.


    To manage the services correctly, the *z/VM VMSES/E Introduction and Reference*,
    GC24-6130 publication strongly advises the use of local tracking numbers. This
    is similar to the use of SOURCEID in SMP/E, which can be assigned during RECEIVE
    and used for further processing of services.


    # 9.3.3 BUILD process


    When updating the z/VM Control Program (CP, also named NUCLEUS) or shared segments
    is necessary, the BUILD process is used.


    For the CP, updating requires an IPL. In z/OS, service is applied to SYS1.NUCLEUS.


    For shared segments, updating requires a restart of the affected virtual machines.
    A z/OS analogy would be a TSO/ISPF user logging off and on after a LINKLIST rebuild
    affecting one of the user''s ISPF applications.


    # 9.4 Comparing VMSES/E and SMP/E


    VMSES/E is normally invoked by executing VMFINS using parameters for the different
    types of tasks to perform. However, other executables are provided to perform
    more compound activities (chained, logically controlled execution of more than
    one VMSES/E exec). These executables perform much like a batch job having multiple
    steps and conditional execution.


    For detailed information about using VMSES/E, see *z/VM VMSES/E Introduction and
    Reference*, GC24-6130.'
  merge: -1
  img_proc: true
- pgno: 406
  md: 'VMSES/E like SMP/E has its software inventory, which, by default, is stored
    on minidisks owned by MAINT.


    # 9.4.1 Installing COR service


    Installing service from a COR tape or other media is very similar to performing
    a SMP/E RECEIVE/APPLY process before putting to production.


    To install COR service:


    +   1. Read the MEMO to Users.

    +   2. Use the VMFREC command to receive the service.

    +   3. Review any messages from VMFREC and correct them.

    +   4. Verify the installation environment.

    +   5. Run VMFAPPLY to apply the service.

    +   6. Review any messages from VMFAPPLY and correct them.

    +   7. Perform any tasks required to build or rebuild the component.

    +   8. Review any messages and correct errors.

    +   9. Test the serviced components and correct any errors.

    +   10. Build any saved segments.

    +   11. Merge the intermediate apply disk with the tested service to production.


    All of these tasks, with the exception of reviewing and correcting items, can
    be performed by using the compound execs SERVICE and PUT2PROD. Figure 9-1 on page
    392 shows the COR installation flow taken from z/VM VMSES/E Introduction and Reference,
    GC24-6130.


    Steps 1-3 correspond to a SMP/E RECEIVE process; steps 4-6 to the APPLY process;
    and steps 7-11 include any distribution or other activities you normally perform
    outside of SMP/E, depending on your procedures. For some z/OS sites, SMP/E ACCEPT
    can be part of the procedures.'
  merge: -1
  img_proc: true
