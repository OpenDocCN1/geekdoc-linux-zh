    # 2.3.3 TCP/IP


    TCP/IP for z/VM brings the power and resources of your mainframe server to the
    Internet. Using the TCP/IP protocol suite of TCP/IP for z/VM, you can reach multiple
    vendor networking environments from your z/VM system.


    TCP/IP for z/VM allows z/VM systems to act as peers of other central computers
    in TCP/IP open networks. Applications can be shared transparently across z/VM,
    Linux, and other environments. Users can send messages, transfer files, share
    printers, and access remote resources with a broad range of systems from multiple
    vendors.


    TCP/IP for z/VM provides the following types of functions and interfaces:


    +   - Connectivity and gateway functions, which handle the physical interfaces
    and routing of data

    +   - Server functions, which provide a service to a client (that is, send or
    transfer a file)

    +   - Client functions, which request a particular service from a server anywhere
    in the network

    +   - Network status and management functions, which detect and solve network
    problems

    +   - Application programming interfaces, which allow you to write your own client/server
    application


    z/OS analogy: TCP/IP for z/VM has the same functionality as in z/OS.


