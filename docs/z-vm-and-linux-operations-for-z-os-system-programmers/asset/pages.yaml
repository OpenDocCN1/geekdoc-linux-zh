- pgno: 299
  md: '# 6.1 Managing z/VM security


    When deploying virtualization technologies for server consolidation you must never
    overlook security issues. Such issues, if not addressed with proper attention,
    can expose companies to risk. Inevitably, new technologies are frequently the
    target of new security threats.


    In this chapter, we explain how z/VM provides security to your virtualized instances
    and provide an overview on how to secure your systems.


    Within z/VM, the term security is a reference to the authentication and authorization
    schemes for identifying users and controlling access to resources. System integrity,
    on the other hand, allows the z/VM Control Program (CP) to operate without interference
    or harm, intentional or not, from the guest virtual machines, and protecting the
    guest virtual machines from interfering with each other.


    # 6.1.1 User authentication


    User login to a z/VM system is achieved by starting a terminal session with z/VM
    (local or Telnet) and then providing a z/VM user ID and its associated password.
    Local terminal sessions are highly secure because the data does not travel over
    a network. Remote terminal (Telnet) or file transfer (FTP) sessions, which travel
    over internal or external IP networks, can be made highly secure by configuring
    and using the z/VM Secure Sockets Layer (SSL) support. The processing required
    for SSL is delivered through an SSL server supplied with z/VM, supporting 128-bit
    encryption and decryption services. The z/VM SSL server is a Linux for zSeries®
    application that must be installed separately. After the user has supplied the
    user ID and password, the Control Program validates the information. If the user
    ID and password are valid, the login is permitted and the terminal session is
    connected to the virtual machine''s virtual console.


    If you think of z/VM as a virtual computer room full of virtual servers, then
    think of a virtual machine user ID as a virtual cage around the server. No one
    can enter the cage unless they possess the key: the virtual machine password.
    This is very different from the discrete environment, where access to a machine
    room automatically gives access to all servers in that room.


    Because the server console is protected by a z/VM password, you can more safely
    eliminate the protections normally given to a server''s console. Automation techniques
    are greatly simplified if the automation tools do not have to, for example, enter
    the root password of a Linux server to shut it down or reboot it. Although at
    first glance this might seem to reduce system security, it actually'
  merge: -1
  img_proc: true
- pgno: 300
  md: 'improves security by not requiring the root password to be known by the automation
    software.


    A special capability available with z/VM is **Logon By**. This function enables
    the system administrator to define a shared virtual machine. When the user enters
    the shared user ID, the user also provides his or her own user ID and password.
    In this way, an audit trail is maintained of who is actually logged into a shared
    user ID, and the problems inherent in sharing passwords are avoided.


    Remote access protocols such as rexec, ftp, and nfs, all require the client to
    authenticate using a z/VM user ID and password. At no time does z/VM trust the
    claims of an authenticated client. When authenticated, the remote client has the
    same access rights as the user would have if he or she were logged into the system
    with a terminal session.


    For network applications, z/VM provides a Kerberos server and the programming
    interfaces that permit programs to take advantage of Kerberos authentication and
    encryption facilities. Note that the network application suite provided by IBM
    and the z/VM CP do not use Kerberos authentication. Although anonymous access
    to specific resources or to a virtual machine can be allowed by z/VM, such access
    must be explicitly enabled by the z/VM system administrator.


    # 6.1.2 User authorization


    When logged into the z/VM system, the virtual machine can access various types
    of resources within the z/VM system, including entire DASD volumes, minidisks,
    tape drives, network adapters, user files, system files, and so on. The security
    features of z/VM are designed so that a virtual machine can access only the resources
    specifically permitted to it.


    Those permissions are given by the system administrator so that when the virtual
    machine is started, it automatically receives access to a certain resource, even
    if that virtual machine would otherwise be unable to access that resource. Alternatively,
    permissions are given dynamically by the system administrator or the owner of
    the resource.


    Certain resources are accessible based on privilege class, others require additional
    authorization. The security facilities provided by z/VM can be enhanced according
    to any special or specific requirements for the customer’s environment by the
    addition of an External Security Manager.


    Although privileged commands can be used to change a running z/VM system, the
    system administrator might choose to set system configuration options during system
    initialization. This is accomplished by updates to the CP system'
  merge: -1
  img_proc: true
- pgno: 301
  md: 'configuration file. Consequently, access to the system configuration file must
    be tightly controlled.


    # 6.1.3  Intrusion detection


    As an element of z/VM intrusion detection capabilities, if a logon is denied,
    the denial is delayed and a security journal entry is made when the number of
    denials exceeds an installation-defined maximum. When a second maximum is reached,
    logon to the user ID is disabled, an operator message is issued, and the terminal
    session is terminated.


    Journaling is supported on z/VM. Virtual machine logons and linking to other virtual
    machine’s minidisks are detected and recorded. Using the recorded information,
    you can identify attempts to log on to a virtual machine or to link to minidisks
    that use invalid passwords.


    The TCP/IP component of z/VM detects and reports a variety of network intrusions,
    including SYN flooding, Smurf attacks and the Ping o’ Death.


    The z/VM Control Program (CP) defines and assigns virtual processors to the virtual
    machine. These virtual processors are matched to the physical or logical (if z/VM
    is running in a logical partition) processors available to the CP. If the operating
    system running in the virtual machine is capable of using multiple processors,
    it will dispatch its workload on its virtual processors as though it were running
    in a dedicated hardware environment. This capability can be extremely useful to
    test a guest operating system in a multiprocessor mode, even on a uniprocessor
    system.


    # 6.1.4  Virtual processors security


    The CP handles dispatching the virtual processors on the available real processors.
    A real processor can either be dedicated to a single virtual machine or shared
    among multiple virtual machines. Bear in mind that the CP handles only the processors
    it controls, so if z/VM is running in an LPAR, the logical processors might in
    fact be shared with other LPARs.


    So, we have virtual machines dispatching their work on one or more virtual processors,
    which are mapped to one or more logical processors, which can be mapped yet again
    to one or more physical processors. Do not be concerned because there is no significant
    security risk if the virtual, logical, or physical processor configuration is
    changed, or if work is dispatched on different physical processors. The state
    of a processor is preserved for one virtual machine and restored for another by
    the z/VM Control Program just as PR/SM™ does for'
  merge: -1
  img_proc: true
- pgno: 302
  md: 'LPARs. Therefore, no information can be passed from one virtual machine to
    another through residual data in processor registers.


    # 6.1.5 z/VM privilege classes


    z/VM is a system of privilege: a user can have either no privileges, or one or
    more privilege classes. Each privilege class represents a subset of CP commands
    that the system permits the user to run. Each privilege class, sometimes called
    CP privilege class, is defined for particular job or set of tasks, thereby creating
    an area outside of which the user cannot execute any commands. A user can be assigned
    to more than one CP privilege class. Users are unable to enter commands in privilege
    classes to which they are not assigned. This section has a summary of CP privilege
    classes, their associated users, tasks, and security implications


    # Privilege class A


    Privilege class A is the primary system operator. The system operator is among
    the most powerful and privileged of all z/VM users. The system operator is responsible
    for the system’s availability and its resources. The system operator also controls
    accounting, broadcasts messages, and sets performance parameters.


    # Privilege class B


    Privilege class B is the system resource operator. The system resource operator
    controls the allocation and de-allocation of real resources, such as memory, printers,
    and DASD. Note that the system resource operator does not control any resource
    already controlled by the system operator or the spooling operator.


    # Privilege class C


    Privilege class C is the system programmer. The system programmer updates the
    functions of the z/VM system and can change real storage in the real machine.


    # Privilege class D


    Privilege class D is the spooling operator. The spooling operator controls spool
    files and real unit record devices, such as punches, readers, and printers.


    # Privilege class E


    Privilege class E is the system analyst. The system analyst has access to real
    storage and examines dumps to make sure that the system is performing as efficiently
    and correctly as possible.'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# Privilege class F


    Privilege class F is the IBM service representative. The representative of IBM
    who diagnoses and solves problems by examining and accessing real input and output
    devices and the data they handle.


    # Privilege class G


    Privilege class G is the general user. This is the most prevalent and innocuous
    of the CP privilege classes. The commands that privilege class G users can enter
    affect only their own virtual machines.


    # Privilege class ANY


    The commands in this privilege class are available to any user.


    # Examples of privilege classes


    Privilege classes A, B, C, D, E, and F require individuals worthy of significant
    trust and whose activities require careful auditing. For example, users with privilege
    class B or C can modify a system''s CP privilege. Because this modification violates
    the Controlled Access Protection Profile (CAPP) security policy, system programmers
    and similarly privileged users must be trusted to not tamper with the system of
    CP privilege (and auditing must confirm this trust).


    Note: Red Hat Enterprise Linux 5 is the first Linux operating system to ship with
    native support for the functions necessary to meet Common Criteria for Trusted
    Operating Systems. This includes all functionality to enable EAL 4+ certification
    under the following protection profiles: Controlled Access Protection Profile
    (CAPP), Role Based Access Control (RBAC), and Labeled Security Protection Profile
    (LSPP).


    For more information, see IBM: Security Benefits of Red Hat Enterprise Linux 5
    on IBM System z, available at:

    http://www.redhat.com/f/pdf/rhel/security_rhel5.pdf


    As another example, privilege class C users can enter the `cp store host` command
    that allows them to alter real storage. It also enables users to negate the CAPP
    classification.


    Privilege class G users have no influence outside their own virtual machines.
    So, with the exception of access to storage objects, they have very little security
    relevance.


    The ANY privilege class commands cannot violate the security policies of the system.
    This is because all commands in the ANY privilege class are auditable and subject
    to either Discretionary Access Control (DAC) or Mandatory Access'
  merge: -1
  img_proc: true
- pgno: 304
  md: 'Control (MAC). Therefore, class ANY users, together with class G users, cannot
    violate the security policy. In the Control Program, each level of privilege is
    discrete and not predicated on others. Furthermore, each privilege class (a subset
    of commands) is related to one or more function types (subsets of users).


    # 6.1.6 System user IDs involved in security


    Certain user IDs are defined as part of the installation process. The standard
    user IDs for the default system installation are:


    +   - **OPERATOR:** System operator and high privilege user ID is similar to root
    in Linux systems.

    +   - **MAINT:** System administration and maintenance is similar to OPERATOR
    from an authorization point of view.

    +   - **EREP:** Environmental Record Editing and Printing Program (EREP) is a
    hardware anomaly detection and predictive failure system.

    +   - **DISKCANT:** Records events such as logon and logoff.

    +   - **OPERSYMP:** System dump analyzer and problem tracking system. Retrieves
    symptom records.


    # 6.1.7 Security relevant statements


    The system configuration file can be edited to control the system security. The
    configuration file is located on a partition of a volume allocated as PARM. This
    minidisk is normally under user ID MAINT, and it is on minidisk address CF1. The
    file is called SYSTEM CONFIG by default, although its name can be altered during
    installation. The file is read at IPL time by the CP program that uses the statements,
    contained in the file, to configure the system.


    The following command statements relevant to security are contained in the configuration
    file:


    # DEFINE command


    Use the DEFINE command to:


    +   - Change the configuration of your virtual machine.

    +   - Change the configuration of your operating system.

    +   - Add a new alias for an existing CP command on your system.

    +   - Add a new CP command to your system.

    +   - Add a new version of an existing CP command to your system.

    +   - Add a new DIAGNOSE code to your system.

    +   - Add a new guest LAN to your system.'
  merge: -1
  img_proc: true
