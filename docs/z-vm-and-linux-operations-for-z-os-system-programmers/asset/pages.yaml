- pgno: 270
  md: '# Example 5-26 Output from the QUERY VIRTUAL CPUS command


    ```

    QUERY VIRTUAL CPUS

    CPU 00 ID FF02991E20948000 (BASE) CP CPUAFF ON

    ```


    This output contains one line per CPU, which can be interpreted a follows:


    +   - The virtual machine has one CPU, and that CPU address is 00.

    +   - The ID of the CPU address is FF02991E20948000.

    +   - Encoded in the CPU ID is information about the hardware and the environment
    on which your virtual machine is running. The details are not critically important
    and thus not covered here.

    +   - Setting CPUAFF to ON means that CPU affinity is on for this CPU. CPU affinity
    refers to how having different types of processors and CPUs is handled on your
    system; this is a complex subject and is beyond the scope of this book.

    +   - The (BASE) denotes the base CPU. This means that this CPU was the first
    one created when you logged on to your virtual machine. This CPU is required by
    your virtual machine and cannot be detached or redefined. All other CPUs can be
    detached and redefined.


    # Defining CPUs


    If you have the appropriate privileges, you can define more CPUs for your virtual
    machine. The ability to define more CPUs is defined in your virtual machine''s
    directory entry; this is controlled by the system administrator.


    If you are allowed to have more than one CPU defined, the limit is from 2 to 64.
    To define a new CPU, use the DEFINE CPU command; see Example 5-27.


    # Example 5-27 Defining a single virtual CPU


    ```

    DEFINE CPU 1

    CPU 01 defined

    ```


    The DEFINE CPU command takes an argument that is either the CPU address you want
    the new CPU to have, or a dash-separated range of addresses if you want to define
    more than one CPU; see Example 5-28.


    # Example 5-28 Defining multiple virtual CPUs


    ```

    DEFINE CPU 1-3

    CPU 01 defined

    CPU 02 defined

    CPU 03 defined

    ```'
  merge: -1
  img_proc: true
- pgno: 271
  md: '> Note: CP does not provide a command for checking the maximum number of CPUs
    you are allowed to define. You determine this by either trial and error, or by
    checking your user directory entry for the value in the MACHine statement.


    # Detaching CPUs


    If you decide that you do not need a virtual CPU that is already defined, then
    you can remove it by using the DETACH CPU command (abbreviated DET CPU). It takes
    the same argument format as DEFINE CPU, which means you can detach a single CPU
    or a range of them with a single command; see Example 5-29.


    Example 5-29 Detaching a CPU with the DETACH command


    ```

    DETACH CPU 1

    CPU 01 detached

    ```


    > Note: Use this command carefully. Detaching a CPU causes your virtual machine
    to be reset and any running operating systems will be halted immediately.


    # 5.3.8 Managing storage (main memory)


    Every virtual machine has memory. How much storage any particular virtual machine
    is allowed to have is determined by the system administrator and is defined in
    the user directory. Storage is not really a device, because it does not have a
    device number as all other devices do. Managing storage is simple because there
    is very little you need to know about it.


    Your virtual machine''s memory is virtual, just as with all of its other resources.
    Because it is virtual, it can exist anywhere in physical memory, or even on a
    disk (backing physical memory with disk-based storage is commonly referred to
    as paging or swapping).


    As with CPUs, CP allows you to overcommit real storage. When a guest is not logged
    on, it is not consuming any memory at all. Only when a guest logs on does CP allocate
    memory for it and its virtual CPUs, and create devices.


    But even when a guest with 1 GB of storage logs on, it is not immediately using
    all 1 GB of its memory. If it is not running an operating system, then it is using
    an extremely small portion of its memory. CP allocates physical memory only to
    back a guest''s virtual memory when that guest actually uses the memory.'
  merge: -1
  img_proc: true
- pgno: 272
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 273
  md: 'This is not an issue however, if you are simply running CP and not running
    a guest operating system. In Example 5-31, we redefine our virtual machine to
    have 4 MB of storage.


    # Example 5-31 Setting the virtual machine''s storage size to 4 megabytes


    ```

    DEFINE STORAGE 4M

    STORAGE = 4M

    Storage cleared - system reset.

    ```


    As shown in Example 5-32, we revert to our original size.


    # Example 5-32 Setting the virtual machine''s storage size to 32 megabytes


    ```

    DEFINE STORAGE 32M

    STORAGE = 32M

    Storage cleared - system reset.

    ```


    # Notes:


    +   - Your storage requirements can vary, depending on what your are doing with
    your virtual machine. However, the machine probably does not require as much storage
    you might initially think. With a typical desktop computer we tend to estimate
    memory needs very high as memory grows increasingly cheaper and a high estimate
    imposes no performance penalty to the system. With z/VM, it is important to understand
    your guest operating system, the workloads that will be run on it, and their memory
    consumption characteristics.

    +   - CP does not provide a command for checking the maximum storage size you
    are allowed to define. You can, however, determine this by simply attempting to
    define a storage size of 99 Terabytes (DEFINE STORAGE 99T) which will more than
    likely be far more than you are allowed to define. In this case, the resulting
    error message will tell you your maximum storage size.


    # 5.3.9 Managing DASD


    A Direct Access Storage Device (DASD) is a simple magnetic disk that you access
    to store data much the same as it is used in z/OS. The z/VM disks are allocated
    on portions of DASD volumes and contains files important to guest operating system.'
  merge: -1
  img_proc: true
