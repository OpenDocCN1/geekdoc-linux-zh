- pgno: 116
  md: '# # File system


    Linux is made up of files and directories in a hierarchical structure. The Linux
    file system is divided into main directories:


    +   - /home — Stores home directories of all users. This is basically where users
    store any files they own: media, source code, desktop configuration files, and
    more. The home directory for the root user is sometimes referred to as the root
    directory.

    +   - /bin — Stores the executables (essential system programs). Commands to load
    kernel modules and access devices are usually placed here.

    +   - /usr/bin — Stores the system commands (the real warehouse for software)

    +   - /usr/sbin — Stores commands usually used to perform system administration
    tasks.

    +   - /usr/local — Is a second-level directory of Linux Filesystem Hierarchy Standard
    (FHS). Software that follows the FHS but you do not want to mix with other software
    on the first level (/usr) of the FHS is usually placed here. For example, an in-house
    software that you might be developing.

    +   - /etc — Stores the program default and system configuration files for the
    system and program default configuration files that can be shared by all users.
    Also stores the run-level configuration files.

    +   - /var — Stores logs, spool directories, database files, file servers files,
    and system lock files.

    +   - /lib — Stores program and shared libraries.

    +   - /dev — Stores device files: memory, disks, removable media devices (storage,
    multimedia) and any type of hardware.

    +   - /proc and /sys — Stores system filesystems that contain real-time data.
    These directories contain real-time data about the configuration of the hardware
    and running processes as Linux sees them: processor, ACPI parameters, processes,
    information of each running process (PID, I/O file descriptors), and kernel configuration.

    +   - /opt — Stores additional software. Usually, vendors applications are installed
    here.

    +   - /tmp — Stores temporary files. Its contents are usually deleted during boot
    time. Never place important files here.


    # ## The root user


    By default, the root user is the system administrator, which means no restrictions
    on root privileges. Because root has such authority, someone who is not completely
    knowledgeable of the system can cause damage. Logging in to root is recommended
    for administrative actions only. Although user root is equivalent to'
  merge: -1
  img_proc: true
- pgno: 117
  md: "IBMUSER in z/OS, it is more powerful because root has an access to everything\
    \ by default. Root access cannot be restricted.\n\n# 3.2.2 Basic starting steps\n\
    \nThis section discusses basic commands, such as navigating in the directories,\
    \ viewing the contents of a directory or file, and creating directories.\n\n**Important:**\
    \ Linux commands and file names are case-sensitive. For example, the command `chmod`\
    \ cannot be typed as `Chmod` or `CHMOD`.\n\n**Tip:** Pressing the Tab key after\
    \ you start typing a command or file name can complete the rest of the command\
    \ or file name. Also, pressing Ctrl+R performs a search of all previous commands\
    \ issued.\n\n# Getting help with Linux commands\n\nLinux does not have a help\
    \ menu as z/VM and z/OS do. Instead, Linux has a command called man, which displays\
    \ the page of the command from the online reference manuals. This page includes:\
    \ the name, synopsis of how it is used, description of how the command functions,\
    \ and other details. To use the command, type:\n\n```\nman commandname\n```\n\n\
    The commandname is the name of the command you want help with (see Example 3-1).\n\
    \n**Note:** You must know the name of the command you want to use to access its\
    \ manual page.\n\nTo scroll through the file use the up and down arrow. To quit\
    \ the file press Q.\n\n*Example 3-1 The man command on the man command itself*\n\
    \n```\nlnxken:/ # man man\nNAME\n    man - an interface to the on-line reference\
    \ manuals\n\nSYNOPSIS\nman [-c|-w|-tZHT device] [-adhu7V] [-i|-I] [-m\nsystem[...]]\
    \ [-L\nlocale] [-p string] [-M path] [-P pager] [-r prompt] [-S\nlist] [-e\nextension]\
    \ [[section] page ...] ...\n```"
  merge: -1
  img_proc: true
- pgno: 118
  md: '```

    man -l [-7] [-tZHT device] [-p string] [-P pager] [-r prompt]

    file ...

    man -k [apropos options] regexp ...

    man -f [whatis options] page ...

    ```


    # DESCRIPTION


    man is the system''s manual pager. Each page argument given to man is normally
    the name of a program, utility or function. The manual page associated with each
    of these arguments is then found and displayed. A section, if provided, will direct
    man to look only in that section of the manual. The default action is to search
    in all of the available sections, following a pre-defined order and to show only
    the first page found, even if page exists in several sections.


    The table below shows the section numbers of the manual followed by the types
    of pages they contain.


    +   0  Header files (usually found in /usr/include)

    +   1  Executable programs or shell commands

    +   2  System calls (functions provided by the kernel)

    +   3  Library calls (functions within program libraries)

    +   4  Special files (usually found in /dev)

    +   5  File formats and conventions eg /etc/passwd

    +   6  Games

    +   7  Miscellaneous (including macro packages and conventions), e.g. man(7),
    groff(7)

    +   8  System administration commands (usually only for root)

    +   9  Kernel routines [Non standard]


    A manual page consists of several parts.


    They may be labelled NAME, SYNOPSIS, DESCRIPTION, OPTIONS, FILES, SEE ALSO, BUGS,
    and AUTHOR.


    # Navigating through the file system


    The command for changing from one directory to another is cd (short for change
    directory). The proper use of the command is:


    ```

    cd directoryname

    ```


    The directoryname is the name of the directory to access (see Example 3-2 on page
    104).'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# Example 3-2 The cd (change directory) command


    ```

    lnxken:~^ # cd Desktop/

    lnxken:~/Desktop #

    ```


    With the cd command you have several options:


    +   cd ..    This move you up one level in the directory tree (see Example 3-3).


    +   cd /    This brings you to the root of the file system directory no matter
    which directory you are currently in (see Example 3-4).


    +   cd -    This returns you to the previous directory you were in (see Example
    3-5).


    # Example 3-3 Changing to the parent directory: cd ..


    ```

    lnxken:/etc/init.d/rc3.d # cd ..

    lnxken:/etc/init.d #

    ```


    # Example 3-4 Changing to the root of the file system directory: cd /


    ```

    lnxken:/etc/init.d/rc3.d # cd /

    lnxken:/ #

    ```


