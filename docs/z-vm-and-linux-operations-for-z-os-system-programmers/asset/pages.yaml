    # Example 3-17 Octal system with the chmod command


    ```

    lnxken:~/Desktop/MyDocs/MyPictures # ls -l

    total 8

    -rw-rw-r-- 1 root root 83 May 19 17:20 smilepic

    -rw-r--r-- 1 root root 83 May 19 17:18 smilepic.bak

    lnxken:~/Desktop/MyDocs/MyPictures # chmod 750 smilepic

    lnxken:~/Desktop/MyDocs/MyPictures # ls -l

    total 8

    -rwxr-x--- 1 root root 83 May 19 17:20 smilepic

    -rw-r--r-- 1 root root 83 May 19 17:18 smilepic.bak

    lnxken:~/Desktop/MyDocs/MyPictures #

    ```


    The examples changes the file permissions from -rw-rw-r-- to -rwxr-x--- by using
    the following command:


    ```

    chmod 750 smilepic

    ```


    The number 7 in the first position indicates that we want to change the owner''s
    access from read and write access to read, write, and execute access. The number
    5 in the second position indicates that we want to change the group''s access
    from read and write to read and execute (no write access). The number 0 in the
    third permission indicates that we want to change the access of other users from
    read-only to no access at all.


    # Symbols


    Symbols used with the chmod command can have four values:


    +   - The type of user:

    +     - u for user

    +     - g for group

    +     - o for others


    +   - The type of change being made:

    +     - - for remove permission

    +     - + for add permission

    +     - = for defining permission


    +   - The type of access to be applied:

    +     - r for read

    +     - w for write

    +     - x for execute


    +   - The file or directory to which the change applies'
