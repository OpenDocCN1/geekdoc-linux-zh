    Figure 4-7 Integrated 3270 Console icon


    +   4. Place the "z/VM Product Package Version 5 Release 3.0" DVD in the HMC DVD
    drive.


    +   5. Get into Single Object Operations mode, as follows:


    > Note: On the z10, you do not have to go to Support Element (SE) mode to load
    from DVD.


    +   a. Double-click the Groups icon in the Views area.

    +   b. Double-click Defined CPCs in the Groups Work Area.

    +   c. Select your CPC.

    +   d. If necessary use the buttons with circular arrows on the bottom right corner
    to navigate to the CPC Recovery menu.

    +   e. Double-click the Single Object Operations icon. Click yes to confirm. Now
