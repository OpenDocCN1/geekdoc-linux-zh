    If so, click OK.

    +   f. Double-click Groups near the top of this window.

    +   g. Double-click Images in the Groups Work Area.


    > Important: If you are unable to get into Single Object Operations mode, you
    might not have sufficient permission. Ask your system administrator.


    +   6. Select the LPAR that z/VM will be installed into.'
