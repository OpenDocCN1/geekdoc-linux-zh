    # Checking all processors are available: query processors


    The QUERY PROCESSORS command (abbreviated as Q PROC), is used to display the current
    assignment of processors of the partition.


    The MASTER processor is the base processor, used for IPL, ALTERNATE processors
    are automatically brought online at IPL, and STANDBY processors are available
    to the partition, but offline. See Example 5-6. The last field in the PROCESSOR
    lines indicate the type of processor: CP, an IFL, ICF, ZIIP or ZAAP.


    ```

    q processors

    PROCESSOR 00 MASTER CP

    PROCESSOR 01 ALTERNATE CP

    PROCESSOR 02 ALTERNATE CP

    PROCESSOR 03 ALTERNATE CP

    PROCESSOR 04 STANDBY CP

    PROCESSOR 05 STANDBY CP

    Ready; T=0.01/0.01 11:51:31

    ```


