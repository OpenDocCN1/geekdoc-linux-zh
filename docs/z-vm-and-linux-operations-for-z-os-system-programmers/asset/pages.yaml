    # Traces


    The virtual machine tracing facility allows you to follow, or trace, the execution
    of almost anything that takes place while you are using your virtual machine.
    For example, you can trace instructions, I/O interrupts, branches, and changes
    to storage.


    Tracing the execution of programs inside a virtual machine can help system operators
    and support teams to identify the step in a program where execution fails. Example
    8-13 shows the output of the TRACE I/O command run in a Linux guest.


