    # 4. Define a VSWITCH:


    Use the BOTTOM (or its abbreviation BOT) subcommand to go to the bottom of the
    file. Add lines (you can use the XEDIT ADD subcommand, a3, to add three lines).
    Define a VSWITCH and set the MAC address prefix. If you have multiple z/VM systems,
    each should have a unique prefix. Modify the two starting addresses of the OSA
    triplets (3024 and 3028 in this example) to those you specified in "The planning
    worksheets" on page 143.


