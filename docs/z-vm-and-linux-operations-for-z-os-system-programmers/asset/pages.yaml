    01973 MDISK 191 3390 2040 010 LX6W02  MR READ  WRITE  MULTIPLE

    01974 *

    01975

    ****************************************************************

    ===>

    ```


    Figure 4-4 Disk definitions for a general user


    The first line, number 1968 in the file, defines the user CERON and sets his password
    to the word CERON too. Although creating simple passwords is not a good practice,
    for the sake of the examples throughout this book we set the password to be the
    same as the user name. The two parameters, 32M and 64M, indicate the initial and
    maximum amount of system storage (main memory) that this user''s virtual machine
    will use. The ending G in that line indicates the class privileges that this user
    will have access to, which in this case is the lowest possible. Creating a user
    is discussed in "Creating the Linux MAINT user" on page 183.


    The second line, number 1969, adds a default profile called IBMDFLT to the user
    definition. Later, if you look at the beginning of the USER DIRECT file, you will
    notice that this profile links some of MAINT''s disks to this user''s space. For
    example, it links MAINT''s 190 disk to its own 190 disk in read-only mode. This
    allows this user to load (IPL) CMS when he logs on.


    Line 1973 shows the definition of the minidisk for that user. It defines its 191
    disk, on the 3390-3 type DASD labelled LX6W02 starting at cylinder 2040 and being
    10 cylinders in size in multi-read mode. Additionally, it defines three passwords,
    READ, WRITE and MULTIPLE for users who want to link to that disk in read, write
    and read-write modes respectively.


    After a disk definition is inserted for a given user, changes do not take place
    until you tell the system to perform them. To do this, use the DIRECTXA USER command,
    but first checking the minidisks'' layout for gaps and overlaps before you actually
    commit your changes³ is good practice. To check your changes, run DISKMAP USER,
    which creates a file named USER DISKMAP in your A file'
