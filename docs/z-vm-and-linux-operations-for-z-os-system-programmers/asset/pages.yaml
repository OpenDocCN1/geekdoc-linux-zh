    Figure 4-3 Checking that disks have been linked and mapped


    Users of AIX-like systems can think of linking and accessing as soft linking to
    another user''s directory. This naturally brings the idea of facing a file mode
    as a mapped directory to our flat CMS file system. For readers who thought that
    living without directories would be difficult in z/VM, you see that you can manage
