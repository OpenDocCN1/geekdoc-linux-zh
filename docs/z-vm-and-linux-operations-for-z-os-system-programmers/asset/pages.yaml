- pgno: 306
  md: '+   ► USER_DEFAULTS: Defines default attributes and permissions for all users
    on the system.


    # 6.1.8 Resource Access Control Facility (RACF)


    Resource Access Control Facility (RACF) licensed program can satisfy the preferences
    of the user without compromising any of the concerns raised by security personnel.
    The RACF approach to data security is to provide an access control mechanism that
    offers effective user verification, resource authorization, and logging capabilities.
    RACF supports the concept of user accountability. It is flexible, has little noticeable
    effect on the majority of end users, and little or no effect on an installation''s
    current operation. RACF controls access to and protects resources on both multiple
    virtual storage (z/OS) and virtual machine systems. For a software access control
    mechanism to work effectively, it must be able to first identify the person who
    is trying to gain access to the system, and then verify that the user is really
    that person. With RACF, you are responsible for protecting the system resources,
    such as minidisks, terminals, and shared file system (SFS) files and directories,
    and for issuing the authorities by which those resources are made available to
    users.


    RACF records your assignments in profiles stored in the RACF database. RACF then
    refers to the information in the profiles to decide if a user should be permitted
    to access a system resource. The ability to log information, such as attempted
    accesses to a resource, and to generate reports containing that information can
    prove useful to a resource owner, and is very important to a smoothly functioning
    security system. Because RACF can identify and verify a user''s user ID and recognize
    which resources the user can access, RACF can record the events where user-resource
    interaction has been attempted. This function records actual access activities
    or variances from the expected use of the system.


    RACF has a number of logging and reporting functions that allow a resource owner
    to identify users who attempt to access the resource. In addition, you or your
    auditor can use these functions to log all detected successful and unsuccessful
    attempts to access the RACF database and RACF-protected resources. Logging all
    access attempts allows you to detect possible security exposures or threats. The
    logging and reporting functions are:


    +   ► Logging: RACF writes audit records in a file for detected, unauthorized
    attempts to enter the system. Optionally, RACF can also writes records for authorized
    attempts or detected, unauthorized attempts to:

    +     - Access RACF-protected resources

    +     - Issue RACF commands

    +     - Modify profiles on the RACF database'
  merge: -1
  img_proc: true
- pgno: 307
  md: '+   - Sending messages: RACF sends messages to the security console for detected,
    unauthorized attempts to enter the system and for detected, unauthorized attempts
    to access RACF-protected resources or modify profiles on the RACF database.


    +   - Keeping statistical information: Optionally, RACF can keep selected statistical
    information, such as the date, time, and number of times that a user enters the
    system and the number of times a single user accesses a specific resource. This
    information can help the installation analyze and control its computer operations
    more effectively. In addition, to allow the installation to track and maintain
    control over its users and resources, RACF provides commands that enable the installation
    to list the contents of the profiles in the RACF database.


    Several features introduced with z/VM Version 5.3 and RACF Feature Level 5.3 include:


    +   - Mixed-case 8-character passwords


    +   - Mixed-case password phrases up to 100 characters, including blanks


    +   - Not possible to reset password to default group name


    +   - Audit trail can be unloaded in XML format


    +   - Remote authorization and audit through z/VM new LDAP server and utilities


    > Note: For more information about RACF, see 2.3.16, "RACF Security Server for
    z/VM" on page 30.


    # 6.2 Defining users


    This section discusses the process of defining users or virtual machines in z/VM.
    It compares this with defining a time sharing option/extension (TSO/E) user, which
    is very similar to defining an STC user or even a batch user, also. Furthermore,
    this section illustrates the process on a native z/VM system without using the
    additional z/VM products, DIRMAINT and RACF. This section does not discuss topics
    regarding users of transaction systems and similar.


    # 6.2.1 z/OS assumptions


    This section outlines z/OS aspects of defining users and activities involved in
    user definition and management on z/OS. In a following section, we discuss the
    same activities on z/VM.'
  merge: -1
  img_proc: true
- pgno: 308
  md: 'For more information about maintaining the z/VM user directory, refer to:


    +   - z/VM: CP Planning and Administration, SC24-6083

    +   - z/VM:CP Commands and Utilities Reference, SC24-6081


    # Security products


    In earlier days, defining users to TSO would imply defining them in the User Attribute
    Data Set (SYS1.UADS) using the ACCOUNT command. By now, most installations have
    merged this data set into their RACF data base or similar for ISV products. When
    UNIX System Services were introduced in OS/390®, it became almost impossible to
    run a z/OS system without having a security system like RACF or similar activated.
    As several of the basic system functions of z/OS, for instance TCP/IP, are using
    or exploiting UNIX System Services, it is very difficult to operate without a
    security server of some sort. Even some of the installation material states that
    it is a prerequisite that the user responsible for installing z/OS should have
    access to different resource classes and similar. Without a security product,
    the standard modules or services performing these checks (SAF) would most certain
    fail these services.


    The UADS (or RACF data base or both) contains data on every TSO user (the RACF
    base also contains STC and batch idents and other security related data). The
    base contains the user ID, the associated password, account number or code, the
    default procedure name and all attributes for each user. Most installations probably
    implement some kind of grouping or role-based security based on their business.
    For instance, all system programmers are typically members of the same group defined
    to RACF, to simplify management of access rules if such grouping has been implemented.


    The base itself is stored in an encrypted format, so passwords and other data
    cannot be retrieved from the base directly. This also applies to independent software
    vendor (ISV) alternatives.


    # A typical process for defining users in z/OS


    A typical set of tasks necessary to define a TSO, STC, or batch user in z/OS includes
    establishing rules for the following areas:


    | Security product | Users have to be defined to the security server or product,
    such as RACF. |

    | Storage management | Rules for how to manage the user''s data have to be addressed.
    This could involve adjustment of storage management services (SMS) constructs,
    defining catalog aliases, preallocating ISPF profiles, and so on. |

    | Other | Several sites are also doing various tailoring for their TSO users,
    such as adjustment of TSO/ISPF JCL procedures or related services. Accounting
    might also |'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'be included. A need might also arise for performance-related tasks, such as
    adjusting WLM policies.


    For most z/OS sites, these tasks are performed by different lines or departments
    within the organization.


    # ## 6.2.2 Defining users in z/VM


    This section discusses how users are defined to z/VM. For more details about how
    to do this, see Chapter 4, "Installing z/VM and creating Linux or z/OS guests"
    on page 121.


    # ## USER DIRECT file


    The z/VM users all have to be defined and maintained in the file USER DIRECT (provided
    DIRMAINT and RACF are not installed). This file exists in two forms: in one or
    more source forms on one or more CMS files; and in a compiled object form on a
    CP-formatted disk. Only one USER DIRECT can be active at any given instant, but
    multiple can be accessed. The USER DIRECT is read at IPL time in a predefined
    search order. First, the system residence volume is searched for a valid object
    entry. If no such entry exists, all CP-owned volumes are searched, in the order
    in which they appear (in the CP-owned list). If CP cannot find a valid object,
    z/VM constructs a default user ID of OPERATOR. By logging on to this user, you
    can then establish valid USER DIRECT object.


    # ## Source formats of USER DIRECT


    The source version of USER DIRECT can exist in two formats: monolithic, in which
    all statements are contained in one physical file; cluster form, which includes
    an index file that can point to one or several files containing the necessary
    statements to build an object USER DIRECT file.


    > Note: All references to USER DIRECT in this book is for the monolithic source
    format. For further details on the cluster format, refer z/VM: CP Planning and
    Administration, SC24-6083.


    # ## Defining minidisks


    User data in z/VM is divided into the minidisk entity. This implies dividing your
    disk volumes into physical extents with a starting cylinder address and counting
    the number of cylinders from that.'
  merge: -1
  img_proc: true
