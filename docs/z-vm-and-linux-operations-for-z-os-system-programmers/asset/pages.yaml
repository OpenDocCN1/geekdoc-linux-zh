  img_proc: true
- pgno: 390
  md: '# 8.4.1 z/VM offline backups


    Offline backups are disruptive operations, because they require stopping the system.
    Using these requires proper planning because production has to be stopped.


    # Copying a z/VM system to disk


    Backing up a z/VM system to disk requires two z/VM partitions: one to backup and
    one on which the commands will be issued. The second partition must have access
    to the disks of the z/VM partition that are being backed up.


    The process involves the following steps:


    +   1. Shut down the z/VM system (system A) for backup.

    +   2. On the other system (system B), vary system A disks online.

    +   3. From system B, copy system A disks using DDR (z/VM DASD Dump/Restore program)
    or Flashcopy, if enabled.

    +   4. Vary system A disks offline.

    +   5. Re-IP L system A.


    This is certainly a disruptive process because all operations have to be stopped
    before the system is backed up.


    > Note: Both z/VM and Linux can be saved to disk using this method.


    # Backing up a z/VM system to tape


    As discussed in a previous chapter, this backup also requires two z/VM partitions,
    the second accessing the system disk of the first partition. The second partition
    also must have access to a tape drive.


    The process involves the following steps:


    +   1. Attach the tape drive to z/VM system B.

    +   2. Rewind the tape.

    +   3. Vary online system A disks.

    +   4. Copy system A disks onto the tape, one after the other.

    +   5. When done, detach the tape drive, and vary offline system A disks.


    > Note: Both Linux and z/VM disks can be saved to tape using this method.'
  merge: -1
  img_proc: true
