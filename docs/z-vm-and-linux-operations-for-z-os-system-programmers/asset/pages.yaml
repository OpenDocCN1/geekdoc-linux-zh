    # Log files archiving


    To avoid storing large amounts of data, the log files are rotated on a regular
    basis. The rotation process is managed by the **logrotate** command, which is
    controlled by a **cronjob** launched daily. For more information about cronjob,
    refer to section 5.4.1, “Job scheduling” on page 275.


    Depending on the configuration options of **logrotate**, log files are kept several
    days or weeks, compressed or not, until they reach a certain age or size.


    As shown in Example 8-16, the older messages log file has been rotated four times,
    compressed, and kept on disk. These were the defaults for SUSE Linux 9.


