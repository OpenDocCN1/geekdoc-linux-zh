- pgno: 27
  md: '# 2.1.2 How virtualization works


    Virtualization deals with enabling basic systems management of multiple, often
    heterogeneous systems directly out of the box.


    As Figure 2-1 shows, partitioning and virtualization involve a shift in thinking
    from physical to logical by treating IT resources as logical pools rather than
    as separate physical entities. This involves consolidating and pooling IT resources,
    and providing a single system illusion for both homogeneous and heterogeneous
    servers, storage, distributed systems, and networks.


    ![](img/b0a4b9056f819dccd4781a5105c92d45_27_0.png)


    Partitioning of hardware involves separate processors for separate operating systems,
    each of which runs its specific applications. Software partitioning employs a
    software-based hypervisor to enable individual operating systems to run on any
    or all of the processors.


    > ¹ z/VM does not run Windows® as a guest operating system because Windows is
    not a mainframe operating system. Figure 2-1 shows the operating systems that
    run on z/VM or VMware; it does not show the operating systems that run on both.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'Hypervisors are virtualization platforms that allow multiple operating systems
    to run on a host computer at the same time. Hypervisor technology originated with
    the System 360, model 67, which evolved into the IBM VM/370, the predecessor of
    the z/VM. Creating a logical partition (LPAR) involves partitioning firmware (a
    hardware-based hypervisor) to isolate the operating system from the processors.


    # 2.1.3 Virtualization on the mainframe


    Typically, IBM mainframes can be partitioned in the following three ways:


    +   - Basic mode: In this mode, also called native mode, the entire physical system
    is used as a single system. This mode, which can be selected during system activation,
    is the least used mode of operation. In basic mode, logical partitions (LPARs)
    are not supported.


    > Note: On z9® and z10 mainframes, basic mode is no longer supported so you must
    define at least one LPAR.


    +   - LPAR mode: In this logically partitioned mode (LPAR mode) of operation,
    a single mainframe system is logically divided into multiple partitions. The LPAR
    mode, which can be selected during system activation, is the most common mode
    used on mainframes. Depending on the machine, the LPAR mode can provide additional
    facilities not available in basic mode, and these facilities can be exploited
    with operating system support.


    +   - z/VM guest: IBM z/VM guest implementations are software level partitioning.
    The z/VM operating system runs either on an LPAR or, on older hardware, on the
    complete mainframe (basic mode). Then, virtual machines (VM) are created on top
    of the z/VM system to host other guest systems.


    # 2.2 Overview of z/VM


    Getting used to a new operating system (OS) usually involves getting to know the
    different ways of performing the same actions that you are familiar within another
    OS. However, sometimes an OS is so different from any other OS, that it is worth
    taking a look at a few basic concepts of the new OS before you actually start
    exploring its functions and capabilities.


    At first glance, z/VM can look very different from other operating systems. However,
    after you learn about the basic concepts, navigating and exploiting the powers
    of this OS becomes easy. Powers of the z/VM lie in its ability to provide highly
    flexible test and production environments for enterprises to deploy their on-demand
    business solutions. z/VM exploits the IBM z/Architecture and helps'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'enterprises meet their growing demands for multi-user server solutions with
    a broad range of support for operating platforms such as Linux on System z, z/OS,
    z/OS.e, VSE/ESA™, z/VSE™, and more.


    For more information, refer to the following Web site:


    http://www.vm.ibm.com/index.html


    In this section, we explain what z/VM is and the features and components available
    in Version 5 Release 3. These introductory topics will be useful to you throughout
    this book as you begin your experience in z/VM. For a more detailed introduction
    see the IBM Redbooks publication, *Introduction to the New Mainframe: z/VM Basics*,
    SG24-7316.


    # 2.2.1 History of z/VM


    In the early 1960s, a small group of university scientists were working on the
    idea of a time-sharing computer system. The system that was created ran on the
    IBM processor of that time and provided time sharing, but was used in a more batch-like
    processing environment.


    The idea of the virtual machine started in the mid 1960s with the work on a Control
    Program (CP) that could partition real disks into minidisks and handle unit record
    input/output (I/O) devices for each virtual machine. During that time, a Conversational
    Monitor System (CMS) was being developed as a monitor system for file and program
    manipulation. Rather than integrating the two systems, each were split into their
    own components, CP would provide a separate computing environment at the machine
    level for each user. CMS would provide single user services that did not have
    to worry about allocating or sharing resources.


    Because the virtual machine Control Program was required to simulate the computer
    systems of that day, each virtual machine would need all the components of a computer.
    Unique computer identity, a secure location, input and output devices, along with
    memory and storage would have to be available to each virtual machine. Queuing
    work (to the I/O devices) was done by spooling the input or output to the device.
    Input was prepared on card punch machines; holes were punched into cards. The
    cards were fed to a card reader that would sense the location of the punched holes
    and electronically store the information in the computer''s memory. After the
    computations were completed, output would be sent to an output device, such as
    impact printers or basic consoles.


    We continue to see the legacy of those devices today in our z/VM systems.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'Because each virtual machine has its own equipment and each must have addressability,
    the same default device addresses and device types are assigned to each machine,
    as follows:


    +   - Address 0009 is a 3215 console

    +   - Address 000C is a 2540 reader

    +   - Address 000D is a 2540 punch

    +   - Address 000E is a 1403 printer


    Along with the I/O devices, each machine must have central processors and memory
    to run programs and storage to save data. Processors (virtual CPUs), memory (virtual
    storage), and disks (minidisks) complete the components required for each virtual
    machine.


    As we log on to a z/VM user ID (our unique machine identifier) and enter our password
    (our secure location), we are actually initiating the process of starting a computer
    system. We first make contact with the CP where we are given the required hardware
    to run our system. Next, as we bring up our system, such as CMS, Linux, z/OS,
    or another z/VM system, we do an initial program load (IPL) of a system that already
    resides on disk. We might spool input to our punch, reader, or spool output to
    our printer or console.


    Over the years, IBM assumed this development effort. Work on VM continued as IBM
    announced newer processors such as system/360 and system/370, but was not seen
    as a system that customers would widely use. As the base system/370 operating
    system, MVS™ continued its development efforts. Because few processor prototypes
    were available, the realization was that VM provided a necessary processor simulation
    platform for the MVS developers. VM became a popular system among many customers
    who found the ease of programming and versatility of the system beneficial to
    their businesses.


    By the 1980s, VM installations grew and more business processes and applications
    were being developed to run on VM. Customer popularity brought about enhanced
    programming products for VM such as REXX™ and Pipelines, which has since been
    ported to other operating systems. As new IBM processors and architectures were
    developed, VM kept pace with new functions to exploit the features.


    With the advent of other technologies and systems, z/VM was becoming less of a
    front-end direct-user interface and more of an IBM virtualization technology platform.
    Now, with the popularity of Linux and the recognition of z/VM virtualization capabilities,
    it has again demonstrated its place in the System z operating system portfolio.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'As with early computers, z/VM has evolved from its early roots and now provides
    many more functions and services, although the underlying principles of the virtual
    machine has not significantly changed.


    Figure 2-2 shows a timeline of how z/VM has evolved to today''s version.


    ![](img/b0a4b9056f819dccd4781a5105c92d45_31_0.png)


    Figure 2-2 History of z/VM


    # 2.2.2 About z/VM


    z/VM provides each user with an individual working environment known as a virtual
    machine. The virtual machine simulates the existence of a dedicated real machine,
    including processor functions, memory, networking, and input/output (I/O) resources.
    Operating systems and application programs can run in virtual machines on the
    second level as guest. For example, you can run multiple Linux and z/OS images
    on the same z/VM system each on their own virtual machine.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'As a result, development, testing, and production environments can run side
    by side sharing the same resources.


    A virtual machine can use its own real hardware resources (for example, a tape
    drive); however, for the most part it shares from a pool of virtual hardware managed
    by z/VM. The virtual address of these devices might or might not be the same as
    the real address of the actual device. Therefore, a virtual machine only knows
    virtual hardware that exists or does not exist in the real world.


    # 2.2.3 First-level versus second-level guest system


    A first-level z/VM means that it is the base operating system that is installed
    directly on top of the real hardware. A second-level system is a user brought
    up in z/VM where an OS can be executed upon the first-level z/VM.


    In other words, a first-level z/VM operating system sits directly on the hardware,
    but the guests of this first-level z/VM system are virtualized; see Figure 2-3
    on page 18. By virtualizing the hardware from the first-level, we are able to
    create and use as many guests as needed with a small amount of actual real hardware.


    Operating systems running in these virtual machines are often called guests. Other
    phrases you might encounter include:


    +   Running first level, which means running directly on the hardware (this is
    what a base z/VM does).


    +   Running second level, running under z/VM, or running on (top of) z/VM, which
    mean running as a guest on the second-level.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Figure 2-3 Example of configuration of an LPAR


    ![](img/b0a4b9056f819dccd4781a5105c92d45_33_0.png)




    The user directory (USER DIRECT) is a file containing all the information about
    all of the system''s guests. It is usually owned by the MAINT user on disk 2CC.


    > z/OS analogy: The user directory can be seen as the equivalent of all user definitions
    in the security system, or contents of the SYS1.UADS data set.


    When a user definition is created, we must specify the CP privilege classes, minimum
    and maximum virtual memory that a user can access, and the mode in which the VM
    will run (for example, ESA/XA) and the I/O devices it will need.


    Example 2-1 on page 19 shows an entry for the user named IBMUSER1 in the user
    directory.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Example 2-1 USER DIRECT entry for user IBMUSER1


    ```

    USER IBMUSER1 USER1PW 32M 128M G

    INCLUDE IBMDFLT

    MACH XA

    IPL CMS

    MDISK 191 3390 1823 010 LX6RES MR

    ```


    The entries in Example 2-1, in the z/VM guest definition in USER DIRECT, have
    the following meanings:


    +   1. The USER line sets the user ID of this virtual machine, which is IBMUSER1.
    The password is USER1PW. This machine is defined as having a default memory storage
    of 32 MB when it logs in. This user could increase the memory allocation to a
    maximum of 128 MB by using the DEFINE STORAGE command. The last value represents
    the CP classes of a user ID (in our example, G is for general user authority).

    +   2. Include a default profile for common user attributes as shown in Example
    2-2 on page 20.

    +   3. Run this virtual machine in Extended Architecture (XA) mode.

    +   4. At logon (initial program load), initialize Conversational Monitor System
    (CMS) automatically.

    +   5. Establish a minidisk for the user. In our example, this establish the minidisk
    with virtual address 191 on a 3390 DASD volume at cylinder 1823 for 10 cylinders
    on DASD volume LX6RES with multi-write access.


    > Note: The DEFINE STORAGE command is disruptive; it can reset a guest operating
    system.


    If certain directory control statements are repeated for several users, you can
    make use of directory profiles to save space in the directory. Because you can
    potentially create many hundreds of Linux z/VM user IDs on a single z/VM image,
    you can create a profile to define the things that many user IDs have in common.
    The profile we included in our TCPIP user ID is shown in Example 2-2 on page 20.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# Example 2-2 Include profile IBMDFLT


    ```

    PROFILE IBMDFLT

    SPOOL 000C 2540 READER *

    SPOOL 000D 2540 PUNCH A

    SPOOL 000E 1403 A

    CONSOLE 009 3215 T

    LINK MAINT 0190 0190 RR

    LINK MAINT 019D 019D RR

    LINK MAINT 019E 019E RR

    LINK MAINT 0402 0402 RR

    LINK MAINT 0401 0401 RR

    LINK MAINT 0405 0405 RR

    ```


    The following statements, displayed in Example 2-2, are in the IBMDFLT profile:


    +   1. The SPOOL statements define the user''s virtual spool devices. The options
    you select modify operational functions associated with your virtual reader, printer,
    punch, or console.

    +   2. Provide access to files that reside on other user''s disks, in this case
    MAINT disks that contain CMS, tools and help files.


    # 2.3 Components of z/VM


    z/VM consists of the following components and facilities (base products):


    +   - Control Program (CP)

    +   - Conversational Monitor System (CMS)

    +   - Transmission Control Protocol/Internet Protocol (TCP/IP) for z/VM

    +   - Advanced Program-to-Program Communication/Virtual Machine (APPC/VM)

    +     Virtual Telecommunications Access Method (VTAM®) Support (AVS)

    +   - Dump Viewing Facility

    +   - Group Control System (GCS)

    +   - Hardware Configuration Definition (HCD) and Hardware Configuration Manager
    (HCM) for z/VM

    +   - Language Environment®

    +   - Open Systems Adapter Support Facility (OSA/SF)

    +   - Restructured Extended Executor/Virtual Machine (REXX/VM)

    +   - Transparent Services Access Facility (TSAF)

    +   - Virtual Machine Serviceability Enhancements Staged/Extended (VMSES/E)'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'In addition to the base products, z/VM offers the following optional products:


    +   - Data Facility Storage Management Subsystem for VM (DFSMS/VM™)

    +   - Directory Maintenance Facility for z/VM (DirMaint™)

    +   - Performance Toolkit for VM

    +   - RACF Security Server for z/VM

    +   - Remote Spooling Communications Subsystem (RSCS) Networking for z/VM


    In the following sections, we discuss each component and provide pointers to reference
    material where you can learn more about each topic.


    # 2.3.1 Control Program


    Control Program (CP) is primarily a real-machine resource manager. CP provides
    each user with an individual working environment known as a virtual machine. Each
    virtual machine is a functional equivalent of a real system, sharing the real
    processor function, storage, console, and input/output (I/O) device resources.


    When you first log on to z/VM, CP controls the working environment. Many of the
    facilities of z/VM are immediately available to you. For example, you can use
    CP commands to do various system management tasks. However, most of the work done
    on z/VM requires the Conversational Monitor System (CMS). From this environment,
    a guest operating system (such as z/OS) can be loaded (IPL) and run within the
    user ID.


    CP provides connectivity support that allows application programs to exchange
    information with each other and to access resources residing on the same z/VM
    system or on different z/VM systems.


    CP is discussed further in section 2.4, “Control Program (CP)” on page 33.


    z/OS analogy: CP is the equivalent of z/OS nucleus or supervisor.


    # 2.3.2 Conversational Monitor System


    Conversational Monitor System (CMS) is a single-user operating system (you interact
    with one user, one keyboard, and one monitor). CMS can help you perform a wide
    variety of tasks. For example, you can write, test, and debug application programs
    for use on CMS or a guest system''s base product, as listed in the following tasks:


    +   - Run application programs developed on CMS or guest systems

    +   - Create and edit data files'
  merge: -1
  img_proc: true
- pgno: 37
  md: '+   - Process jobs in batch mode

    +   - Share data between CMS and guest systems

    +   - Communicate with other system users

    +   - Provide a useful file system for storing data


    # CMS file system


    The *file* is the essential unit of data in CMS. Files in CMS are unique and cannot
    be read or written using other operating systems. When you create a file in CMS,
    you name it by using a file identifier (file ID). The file ID consists of three
    fields:


    +   - File name (fn): Contains a maximum of eight alphanumeric characters

    +   - File type (ft): Contains a maximum of eight alphanumeric characters

    +   - File mode (fm): Contains one alphabetic character


    > **z/OS analogy:** A CMS file is like a sequential data set on z/OS or a z/OS
    file on UNIX® System Services.


    When you use CMS commands and programs to modify, update, or refer to files, you
    must identify the file by using the file ID fields. Various CMS commands allow
    you to enter only the file name, or the file name and file type; others require
    you to also enter the file mode.


    Under z/VM, your files can be stored within a Shared File System (SFS), which
    is a shared file space in a hierarchical directory structure. Depending on your
    system configuration, you have the option to use both CMS and SFS methods for
    storing files. You could store files that you might want to share in your SFS
    file space; other files could be stored on minidisks.


    z/VM OpenExtensions (POSIX support) includes another type of file called a byte
    file system (BFS) file. BFS files are organized in a hierarchy, as in a UNIX system.
    All files are members of a *directory*. Each directory is in turn a member of
    another directory at a higher level in the hierarchy. The highest level of the
    hierarchy is the BFS file space. Typically, a user has all or part of a BFS file
    space mounted as the root directory.


    z/VM views an entire file hierarchy as a byte file system. Each byte file system
    is a mountable file system. The *root* file system is the first file system mounted.
    Subsequent file systems can be mounted on any directory within the root file system,
    or on a directory within any mounted file system.


    All files in the byte file system are called BFS files. BFS files are byte-oriented,
    rather than record-oriented, such as CMS record files on minidisks or in the Shared
    File System. You may copy BFS files into CMS record files, and copy CMS record
    files into the byte file system.'
  merge: -1
  img_proc: true
