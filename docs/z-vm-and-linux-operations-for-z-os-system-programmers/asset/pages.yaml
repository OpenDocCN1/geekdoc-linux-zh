    # 2.7 Consoles


    As a z/VM operator, you might use several types of consoles. Consoles can be located
    on the same physical device, such as a PC workstation using 3270 emulator software
    or on physically connected 3270 terminals. Because of the flexibility of z/VM,
    the number of consoles varies by customer installation. Depending on your installation,
    there might be one production system or many production systems. Hundreds of virtual
    machines each could be running a production system. Regardless of the number of
    consoles, the following four types of consoles are available, which are described
    in the next sections:


    +   - Hardware Management Console'
  merge: -1
  img_proc: true
- pgno: 66
  md: '+   - Primary system operator console

    +   - Virtual Console for each virtual machine

    +   - Production system''s system console when an operating system such as Linux,
    z/OS, z/VM, z/VSE, or z/TPF, is running in a virtual machine.


    Although the number of consoles at each site depends on the installation, each
    installation has at least one Hardware Management Console, at least one primary
    system operator console, and one or more virtual consoles to control virtual machines.
    A production system often has its own system console.


    > z/OS analogy: The Hardware Management Console and the primary system operator
    console are similar to the HMC, which is used to access a z/OS LPARs.


    For more information about z/VM consoles and how to interact with each of them,
    see z/VM: System Operation, SC24-6121².


    # 2.7.1 The Hardware Management Console


    A Hardware Management Console (HMC) communicates with each central processor complex
    (CPC). There can be one or more Hardware Management Consoles depending on your
    site''s installation. This section describes only the specific tasks for the z/VM
    operator. For additional information about using the Hardware Management Console,
    see the processor complex hardware publications. The System z Hardware Management
    Console Operations Guide, SC28-6867 can be found at: http://www-01.ibm.com/support/docview.wss?uid=isg2bac11e0b02e3aa73852573f70056c860


    From the Hardware Management Console, you can:


    +   - Perform an IPL of z/VM

    +   - Monitor messages and send commands to z/VM (Operating System Messages panel)

    +   - Perform basic z/VM system management functions

    +   - Install, service, and operate z/VM using the integrated 3270 console


    > z/OS analogy: z/OS users should already be familiar with this type of console
    because it is also used to define LPARs, a common task between z/OS and z/VM,
    and to access a z/OS console.


    ² http://publibz.boulder.ibm.com/epubs/pdf/hcsf2b30.pdf'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Using the Operating System Messages panel


    From the Hardware Management Console, you can use the Operating System Messages
    task (panel), which is the SYSC device, to log on to the OPERATOR user ID and
    view z/VM messages. You can also use the Operating System Messages panel to issue
    commands on the z/VM. This communication between the Hardware Management Console
    and z/VM is in line mode.


    To use the Operating System Messages panel as the system operator console during
    the initial program load of the z/VM system, perform one of the following tasks
    (in the following list, refer to the named sections listed in z/VM: CP Planning
    and Administration, SC24-6083):


    +   - Specify the CONS=SYSC IPL parameter when using the stand-alone program loader
    (SAPL). See "Passing IPL Parameters."

    +   - Specify a load parameter of CONSSYSC to bypass the SAPL window and have
    the z/VM operator open on the Operator System Messages panel. See "Overriding
    Stand-Alone Program Loader Defaults."

    +   - Add SYSTEM_CONSOLE to the OPERATOR_CONSOLES statement in the SYSTEM CONFIG
    file. See "System Configuration File."


    To have emergency operating system messages displayed, add SYSTEM_CONSOLE to the
    EMERGENCY_MESSAGE_CONSOLES statement in the SYSTEM CONFIG file.


    # Setting up and using the Integrated 3270 console


    From the Hardware Management Console you can use the integrated 3270 console as
    the system operator''s console. The integrated 3270 console is identified by z/VM
    as SYSG. This console provides you the ability to install, service, and operate
    z/VM without any attached 3270 devices. To identify the integrated 3270 console
    to CP during initial program load of the z/VM system, do one of the following
    tasks:


    +   - Use the CONS=SYSG IPL parameter when using the stand-alone program loader
    (SAPL).

    +   - Specify a load parameter of CONSSYSG to bypass the SAPL window and have
    the z/VM operator come up on the Integrated 3270 Console. See "Overriding Stand-Alone
    Program Loader Defaults" in z/VM: CP Planning and Administration, SC24-6083.

    +   - Add SYSTEM_3270 to the OPERATOR_CONSOLES system configuration statement.


    3 http://www.vm.ibm.com/pubs/hcsg0b01.pdf

    4 http://www.vm.ibm.com/pubs/hcsg0b01.pdf'
  merge: -1
