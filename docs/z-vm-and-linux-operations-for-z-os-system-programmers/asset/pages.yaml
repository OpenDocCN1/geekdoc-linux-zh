    3. Now the MAINT CF1 disk is accessed read-write as your F disk:


    +   a. First make a backup copy of the vanilla SYSTEM CONFIG file using the COPYFile
    command with the OLDDATE parameter to prevent modification of the file''s time
    stamp, then edit the original copy:


    ```

    ==> copy system config f system conorig f (oldd

    ==> x system config f

    ```


    +   b. Next look for the Features statement. You can search for it again or you
    can use F8 to page down. The following changes and additions are recommended:


    +   - Increase the number of commands that can be retrieved from 20 to 99.

    +   - Set the Disconnect_Timeout to off so disconnected users do not get forced
    off.

    +   - Allow unlimited VDISKs to be created by users by changing User1im to infinite
    and by adding the Syslim infinite clause:


    ```

    Features ,

    Disable ,

    Set_Privclass ,            /*Disallow SET PRIVCLASS command*/

    Auto_Warm_IPL ,            /*Prompt at IPL always */

    Clear_TDisk ,              /*Don''t clear TDISks at IPL time*/

    Retrieve ,                 /*Retrieve options */

    Default 99 ,               /*Default.... default is 20 */

    Maximum 255 ,              /*Maximum.... default is 255 */

    MaxUsers noLimit ,         /*No limit on number of users */

    Passwords_on_Cmds ,        /*What commands allow passwords?*/

    Autolog yes ,              /*... AUTOLOG does */

    Link yes ,                 /*... LINK does */

    Logon yes ,                /*... and LOGON does, too */

    Disconnect_Timeout off ,   /*Don''t force disconnected users*/

    Vdisk ,                    /*Allow VDISKs for Linux swaps */

    ```'
