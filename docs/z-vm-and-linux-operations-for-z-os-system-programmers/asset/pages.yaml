  md: "# Beginning a YaST installation\n\nWhen YaST comes online on your SSH connection,\
    \ it guides you through an installation wizard. Perform the following steps:\n\
    \nHint: The Tab key cycles you forward in the menu entries. The Escape+Tab combination\
    \ cycles you backward in the menu entries. The Space bar toggles between a check\
    \ box and the opening of a selection box.\n\nThe installation program that is\
    \ running is yast2.\n\nTo begin a YaST installation:\n\n+   1. Choose the language,\
    \ English, (or your language) and click Next.\n+   2. The SLES10 SP2 license agreement\
    \ window opens. If you agree, select Yes, I agree to the License Agreement and\
    \ Click Next.\n+   3. The Disk Activation window opens. Select Configure DASD\
    \ Disks.\n+   4. The YaST2 DASD Disk Management window opens, displaying all the\
    \ DASDs available to your Linux guest, including the z/VM disks that your guest\
    \ user uses for itself but not for hosting Linux, such as its 191 disk.\n+   \n\
    +   Use only the 100-106 disks for your Linux installation because that is what\
    \ you have set up for it. In the window:\n+   a. Highlight each disk and click\
    \ Select or Deselect to select it; or simply press Enter while highlighting a\
    \ given disk. The word Yes appears next to the disks you select.\n+   b. Activate\
    \ the selected disks for the Linux you are about to install by selecting Perform\
    \ Action → Activate, as shown in Figure 4-22 on page 203."
