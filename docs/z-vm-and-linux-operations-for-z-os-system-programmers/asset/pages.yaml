  md: '# Cross reference: z/OS, z/VM, and Linux commands


    This appendix provides a cross reference between several z/OS commands and concepts
    and their z/VM and Linux counterparts. Although not all commands and concepts
    are listed here, we feel this is a good start for the z/OS system programmer to
    become more familiar with z/VM and Linux on System z.


    For our examples, we refer to SLES10 commands when we have to be specific. We
    recommend checking your Linux distribution to verify that the commands remain
    the same.


    This appendix contains the following tables:


    +   - Table A-1 on page 400, Commands for file editing

    +   - Table A-2 on page 400, General commands

    +   - Table A-3 on page 401, FTP and TCP/IP commands

    +   - Table A-4 on page 401, General concepts'
