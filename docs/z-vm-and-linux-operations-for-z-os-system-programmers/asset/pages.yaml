    # 7.2 Tuning basics


    System z processors have evolved over the years to be highly robust and reliable.
    This section introduces general tuning concepts and explores their practical implications
    on z/VM.


    # 7.2.1 System tuning approach


    Performance analysis and tuning is a multi-step process. Regardless of which tools
    you choose, the best methodology for analyzing the performance of a system is
    to start from the outside and work your way in to the small tuning details. Start
    by gathering data about the overall health of systems hardware and processes.
    How busy is the processor during the peak periods of each day? What happens to
    I/O response times during those peaks? Do they remain fairly consistent, or do
    they elongate? Does the system become memory-constrained every day, causing page
    waits? Can current system resources provide user response times that meet service
    level agreements? Following a good performance analysis process can help you answer
    those questions.


    Knowing what tuning tools are available and the types of information that they
    provide is important. Equally important is knowing when to use those tools and
    what to look for. Waiting until the telephone rings with user complaints is too
    late to start running tools and collecting data. How will you know what is normal
    for your environment and what is problematic unless you check the system activity
    and resource usage regularly? Conducting regular health checks on a system also
    gives you usage and performance information that can be helpful for capacity planning
    purposes.


    # 7.2.2 Where tuning can help


    Even when the different workloads add up to less than the total amount of resources
    available, you might find that you are still unable to run the workload with good
    performance. The reason might be that the system is lacks a specific resource.
    In such a situation, proper tuning can make a difference. Before tuning the system
    and workload, you should understand what resource is the limiting'
  merge: -1
  img_proc: true
- pgno: 352
  md: 'factor in your configuration. Tuning changes tend to fall into one of these
    categories:


    +   Use fewer constrained resources.


    One of the benefits of running Linux systems under z/VM is the ability to share
    and to overcommit hardware resources. The amount of memory that Linux thinks it
    owns is called virtual memory. The sum of the amounts of virtual memory allocated
    to each Linux guest can be many times the amount of real memory available on the
    processor. z/VM efficiently manages memory for Linux guests. With a system that
    is really memory constrained, one option might be to reduce overall z/VM memory
    usage by reducing the virtual machine size of Linux guests.


    +   Obtain a larger share of a constrained resource.


    Users can easily increase the virtual memory size for Linux guests, because it
    is a quick change to the guest definition under z/VM. However, needlessly increasing
    virtual memory allocations can cause excessive paging (also known as thrashing)
    for the entire system. If a system that is truly memory-constrained, and where
    Linux virtual memory sizes have been assigned judiciously, consider reserving
    some memory pages for one particular Linux virtual machine, at the expense of
    all others. This can be done with a z/VM command (CP SET RESERVED).


    +   Increase total available resources.


    The most obvious approach to solving memory issues is to buy more hardware. The
    cost of memory has declined over the years, so that might be a good option. However,
    additional resources can be made available by stopping unneeded utility services
    in the Linux systems. Be aware that tuning does not increase the total amount
    of system resources. It simply allows those resources to be used more effectively
    for critical workloads.


    # 7.2.3 Where tuning does not help


    Understand this: you cannot run more work than you can fit in the machine. If
    your System z machine has two CPUs and the workload you want to run consists of
    three Linux virtual machines running WebSphere, where each of them runs a CPU
    for 100% all day, then it will not fit. No amount of z/VM tuning will make it
    fit, but there might be performance issues in the applications themselves to make
    the workload use less than 100% all day.


    When a System z machine has four CPUs and the workload consists of three Linux
    virtual machines that each use a CPU for 100% all day, there is little to tune.
    In this case, z/VM has sufficient resources to give each Linux virtual machine
    what it requires (though you might want to look into changes to the configuration
    that allow you to use all four CPUs and make things run faster).'
  merge: -1
  img_proc: true
- pgno: 353
  md: '# 7.3 Performance and Monitoring tools for z/VM


    The use of tools to monitor and enhance performance is common. Performance monitoring
    tools provides more functionality and reports on your system z/VM status.


    In this section, we introduce several performance monitoring tools. For more details,
    see the IBM Redbooks publication Linux on IBM System z: Performance Measurement
    and Tuning, SG24-6926.


    # 7.3.1 IBM Performance Toolkit for VM


    The IBM Performance Toolkit for VM is an enhanced real-time performance monitor
    and full-screen operator that allows system programmers to monitor system performance
    and to analyze bottlenecks. The toolkit can help system programmers make more
    efficient use of system resources, increase system productivity, and improve user
    satisfaction. In addition to analyzing z/VM performance data, the Performance
    Toolkit for VM can process Linux performance data obtained from the IBM Resource
    Management Facility (RMF) and the Linux performance gatherer, rmfpm s. Several
    other functions provided by the Performance Toolkit for z/VM include:


    +   - Operation of the system operator console in full-screen mode

    +   - Management of multiple z/VM systems (local or remote)

    +   - Post-processing of performance toolkit for VM monitor data captured by the
    MONWRITE utility

    +   - Viewing of performance monitor data using either Web browsers or PC-based

    +   - 3270 emulator graphics

    +   - TCP/IP performance reporting


    Figure 7-2 on page 339 depicts a typical Performance Toolkit window.


    > Note: For more information about Performance Toolkit, refer to Linux on IBM
    eServer zSeries and S/390: Performance Toolkit for VM, SG24-6059'
  merge: -1
  img_proc: true
