    # Creating the Linux MAINT user


    Before bringing up Linux, create a user-to-host common files that will be used
    by every Linux guest system that you create. To bring up as many Linux guests
    as you want, create a boot-parameter file for each guest (instead of processing
    each manually every time). The benefit of creating a boot-parameter file is that
    the files necessary for booting Linux will not be duplicated in every guest system
    user space.


    Log on as MAINT to continue configuring the z/VM system for installing Linux.
    As stated in "z/VM users and password planning" on page 140, the Linux administrator
    ID is LNXMAINT. Before making any changes to the USER DIRECT file to create its
    disks, make a copy of that file first:


    ```

    ==> copy user direct c = direorig = {old d

    ```


    # Setting up minidisk space for LNXMAINT


    A small 20-cylinder minidisk is allocated at virtual address 191 and a larger
    300 cylinder minidisk (approximately 225 MB), to be shared by many guests, is
    defined at virtual address 192. You can use one of your new DASDs designated as
    PERM space in your worksheet (Table B-1 on page 403), or you can use any available
    space on LX6W02 (which will most likely have some free space if you have been
    following this book''s installation steps) because you will use only 320 cylinders
    for the minidisks.


    > Note: Cylinder 0 must always be reserved for the label, therefore you should
    start minidisks at cylinder 1 if you choose to use one of the new DASDs.'
