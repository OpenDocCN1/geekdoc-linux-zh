- pgno: 137
  md: '# 4.1 Initial installation of z/VM, compared to z/OS


    This section is intended for z/OS system programmers, who have little or no experience
    with z/VM. This section should help you understand the basics of installing a
    z/VM system.




    Existing z/OS and z/VM sites usually perform their installation or upgrade tasks
    from an existing running system.


    z/VM sites typically use an existing virtual machine to install a new z/VM system
    from a z/VM DDR (tape delivery) or DVD delivery. As of January 2008, the z/VM
    base operating system and base options became available for Internet delivery
    orders placed using ShopzSeries, in countries where it is available. See the following
    Web address for more information:


    ```

    http://www.vm.ibm.com/buy/edelivery/

    ```


    z/OS sites do the installations from an existing z/OS image using one of the available
    installation methods offered by IBM, currently ServerPac, CBPDO, or SystemPac®.




    IBM offers only one delivery type to install z/VM, although an option for type
    of media (DVD or tape) is available.




    As mentioned, the available installation methods offered by IBM for z/OS are currently
    ServerPac, CBPDO, or SystemPac. This section describes each.




    The z/OS installation method named ServerPac is a "software delivery package consisting
    of products and service for which IBM has performed the SMP/E installation steps
    and some of the post-SMP/E installation steps" (according to z/OS V1R9.0 Planning
    for Installation, GA22-7504-17). The package is an integrated set of products
    that have passed initial testing. This method involves the use of the CustomPac
    Installation Dialog, which allows the customer to customize aspects such as naming
    data sets and volumes, and placing data sets within the set of disks built during
    installation. Customers are given the choice of'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'either installing an IPL-ready z/OS image (including the necessary auxiliary
    data sets, page, SMF, for example) or installing just the products and establishing
    these auxiliaries at a later time.


    # CBPDO


    The Custom-Built Product Delivery Option (CBPDO) delivery consists of uninstalled
    and unintegrated service without dialog or tools to assist the installation process.
    The customer must perform this by using SMP/E.


    # SystemPac


    The last alternative, SystemPac, is a complete delivery of integrated products
    (even ISV products) to the customer''s specification. It contains an IPL-ready
    system, including all necessary auxiliary data sets. It is available in two formats:
    full volume and dump-by-data-set. This type of delivery would probably be the
    only option for new z/OS customers.


    # Other deliveries


    See your IBM service representative for other delivery types or packages. Some
    types or packages consist of a more customized nature and might not be available
    for ordering from every region or country.


    # 4.1.4 Comparing a z/VM installation to z/OS installation types


    By comparison, the SystemPac full-volume format-type delivery is similar to a
    z/VM delivery when a customer installs an operating system for the first time.


    Both the SystemPac delivery and a z/VM DDR (tape) delivery (assuming a first time
    installation) imply the use of stand-alone (initial program load from tape) versions
    of the IBM Device Support Facility (ICKDSF) for formatting disk volumes and DFSMSDSS
    for z/OS or DDR for z/VM to restore the volumes. These activities are performed
    from the Hardware Management Console (HMC). By comparison, installing z/VM from
    a DVD delivery appears to be the easiest method to someone already familiar with
    z/OS.


    By using the z/VM DVD delivery you have the ability to bring up a RAMDISK operating
    system, loaded into the System z processor memory. This system is functionally
    equal to z/VM itself and is invoked from the HMC using the Integrated 3270 Console
    facility. From within this operating system, you perform most of the remaining
    installation activities:


    +   1. Invoke the executable INSTPLAN to specify which products to install, which
    language to use and type and volume serial numbers (volsers) of target DASD.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '+   2. Use the executable INSTDVD to perform the main installation of z/VM.

    +   3. Perform an IPL from the newly installed disk and run the executable INSTVM
    to finish the installation.


    This method offers both a comprehensive dialog and a stable installation environment.


    # **Remaining activities after a z/VM installation**


    Usually, a z/VM delivery is accompanied by a Recommended Service Upgrade (RSU)
    tape or DVD. This should be installed after the initial installation has completed.
    It is installed from within z/VM using the executables SERVICE and PUT2PROD. For
    a discussion of these topics, refer to Chapter 9, “Applying system maintenance”
    on page 387.


    # **Disk considerations**


    Note that if you have duplicate volumes, z/VM uses the volume residing on the
    lowest device number without giving you an option. This is opposed to z/OS, which
    gives you the option of varying a device offline.


    > **Important:** Avoid having duplicates and establish a suitable standard for
    disk volume labels.


    # **4.2 z/VM installation concepts and considerations**


    Before going through a z/VM installation, this section provides concepts that
    are used throughout the installation. Become familiar with these before reading
    4.3, “Installing z/VM in an LPAR” on page 138. The concepts can help you compare
    a z/VM installation and its required configuration to a typical z/OS installation
    and configuration.


    # **4.2.1 Interacting with z/VM**


    Differences do exist between z/OS and z/VM in terms of interacting with the system.


    A user familiar with z/OS typically logs onto the system and uses an ISPF session
    to interact with the system¹. System interaction is menu-driven, that is,


    > ¹ For the purposes of this book, we make the assumption that most z/OS users
    interact with it by the use of ISPF instead of native TSO.'
  merge: -1
  img_proc: true
- pgno: 140
  md: "the user navigates through the menu to get to a particular system function\
    \ or command to execute.\n\nz/VM users, on the other hand, interact with the system\
    \ through the Conversational Monitor System (CMS), which is a command-line interface²\
    \ described in the following section.\n\n# CMS\n\nIn a typical z/VM installation,\
    \ CMS is the code that IPLs after a user logs in. It was designed to facilitate\
    \ mainframe virtual machine administration. From within it, you can issue commands\
    \ to edit, create, delete and manage files, and execute programs and scripts.\
    \ In a simple analogy, CMS allows you to perform the same basic set of tasks as\
    \ you would at a Linux console. Figure 4-1 illustrates a 3270 session displaying\
