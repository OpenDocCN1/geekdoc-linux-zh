  md: '# Applying system maintenance


    This chapter discusses the processes involved in maintaining a z/VM system in
    comparison with performing the similar processes on z/OS. It is limited to the
    technical aspect of these processes and does not discuss any administrative processes
    or routines.


    # Objectives


    After completing this chapter, you should be able to:


    +   - Discuss maintenance methods provided by IBM for a z/VM system

    +   - Explain how the maintenance is brought into production

    +   - Identify similarities and differences between z/VM and z/OS maintenance


