  md: "```\nend\nEXIT\nrestore:\n 'MAKEBUF'\n SAY 'RESTORING TAPE DEVICE 181 TO \"\
    \ VOLOUT\n QUEUE 'IN 181 3590 (LEAVE'\n QUEUE 'OUT' VOLOUT '3390'\n QUEUE 'RESTORE\
    \ ALL'\n QUEUE 'YES'\n QUEUE 'YES'\n QUEUE ''\n 'DDR'\n 'DROPBUF'\n return\n traitfic:\n\
    \ 'STATE' fnl ftl fml\n IF RC <> 0 THEN EXIT 99\n 'pipe c',\n   fnl ftl fml,\n\
    \   ' | STEM VOLUMES.'\n return\n```\n\n# Backup of z/VM and Linux disks controlled\
    \ from z/OS\n\nYou may integrate z/VM and Linux into pre-existing z/OS backup\
    \ and restore procedures.\n\nLinux disks must be prepared for use with the command\
    \ dasdfmt, which allows you to format a disk using a specific layout, Linux disk\
    \ layout, or compatible disk layout.\n\nCompatible disk layout is the default\
    \ layout for dasdfmt. It means a special handling of the first two tracks of the\
    \ volume by writing a volume table of contents (VTOC) on the disk. This enables\
    \ other System z operating systems to access this device (for example, for backup\
    \ purposes).\n\nThis VTOC allows a Linux disk to be accessed from z/OS. This disk\
    \ can be seen as a data set called, for instance, LINUX.VOX0200.PART0001.NATIVE;\
    \ this data set can be saved using standard z/OS DFSMSdss™ DUMP commands.\n\n\
    > z/OS analogy: The following JCL is an example of a job to backup a Linux disk\
    \ from z/OS using DFSMSdss dump:\n\n```\n//STEP1  EXEC PGM=ADDRSSU,REGION=0M\n\
    //IDOT   DD  DISP=(NEW,CATLG),DSN=backup.dsn........\n//SYSPRINT DD  SYSOUT=*\
    \ \nDUMP INDY(1nxvol) OUTDD(IDIOT)\n```"
