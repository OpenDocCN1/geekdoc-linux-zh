- pgno: 281
  md: '# Notes:


    +   - Other users cannot link to your VDISK unless it is defined in the user directory.

    +   - If a VDISK is defined in your directory and you log off, it will *not* be
    destroyed if another user has linked to it.


    Each allocation of V-DISK space has to be CMS-formatted before files can be stored
    on the disk.


    # Removing a VDISK


    You can remove a VDISK in the same way you would remove any other virtual device,
    by using the DETACH command. Its only parameter is the virtual device number of
    the device to detach; see Example 5-42.


    > Example 5-42 Removing a VDISK.


    ```

    DETACH 8FF

    DASD 08FF DETACHED

    ```


    # 5.3.10 Spool devices


    A *spool device* processes an ordered list of files or data kept in a queue. CP''s
    spool devices are different from other I/O devices in that they are not associated
    with real devices, such as DASD.


    You can have three spool devices, as listed in Table 5-3. Each exists primarily
    to work with spool files. The specifics of what spool devices and files are and
    how they work can be quite complex, but most of the details are not very important
    for the vast majority of users.


    > Note: This book presents an extremely simplified view of spool devices, because
    most users might never have to know all of the specifics. For more information
    about this topic, however, refer to z/VM: Virtual Machine Operation, SC24-6128.


    # Table 5-3 Types of spool devices


    | Spool device | Description |

    |---|---|

    | Reader | A virtual punch card reader |

    | Punch | A virtual punch card punch |'
  merge: -1
  img_proc: true
- pgno: 282
  md: '| Spool device | Description |

    |---|---|

    | Printer | A virtual printer |


    For the purpose of our discussion, these devices are similar in nature. More specifically,
    the commands that we use for managing files within the spool device queues can
    be used on all of them in the same manner. In our examples, we concentrate on
    the reader device type.


    > **z/OS hint:** Spooling tasks in z/OS are performed within the Job Entry Subsystem
    (JES2 or JES3). Spool data is kept in JES2 HASP ACE data set or in the JES3 equivalent.


    # Uses for spool devices


    In the early days of z/VM, most installations included real printers, punch card
    readers, and punches. Back then, these virtual devices were used to interface
    with the real hardware, so you could actually work with the real devices. Today,
    however, most installations do not have these real devices. However, spool devices
    are used for handling a virtual machine''s input and output.


    The reader is the virtual machine''s input holding area and can be seen as a mail
    inbox. From that inbox, we can CP TRANSFER files to other uses or CMS RECEIVE
    the files onto a user''s mdisk storage.


    You may, by using the CMS command SENDFILE, send a file from one of your disks
    to other users. Those users are then free to save the file from their reader to
    one of their disks. The SENDFILE command actually uses your punch device to punch
    the file into the reader queue of the appropriate user.


    The virtual card reader is also often used for booting other operating systems
    or stand-alone utilities, including Linux installer RAM files. When the file at
    the top of the reader queue is one that contains a loadable operating system or
    stand-alone utility, IPL 000C will begin the load process.


    > **Note:** CMS expects to find your reader at virtual device number 000C, your
    punch at 000D, and your printer at 000E. For this reason, those devices are typically
    always created with the given device numbers.


    # Querying a spool device


    Querying a spool device gives you a great deal of information, and it can be done
    by using the QUERY command in a similar way to querying other virtual devices.'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'In Example 5-43, we query our reader, which is typically defined with the virtual
    device number 000C. (If your reader is not addressed as 000C, use the QUERY VIRTUAL
    ALL command to find your reader as discussed in "Your virtual machine''s resources"
    on page 69.)


    # Example 5-43 Querying a spool device


    ```

    QUERY VIRTUAL 000C

    RDR  000C CL * NOCONT NOHOLD  EOF      READY

    000C 2540        CLOSED  NOKEEP NORESCAN  SUBCHANNEL = 0002

    ```


    Most parameters shown in the output deal with the spool device configuration or
    how your spool files are treated by the spool device.


    # Creating a spool device


    You create a spool device by using the DEFINE command. In most cases, your reader
    will have been defined for you. But if it has not been defined, provide an argument
    to the DEFINE command to define the type of device you are creating and the virtual
    device number, as shown in Example 5-44.


    # Example 5-44 Defining a spool device


    ```

    DEFINE READER 000C


    RDR  000C DEFINED

    ```


    You can specify PUNCH and PRINTER in place of READER, to create those types of
    spool devices instead.


    # Removing a spool device


    You can remove a spool device by using the DETACH command, just like any other
    virtual device. Specify the virtual device number as an argument; see Example
    5-45.


    # Example 5-45 Removing a spool device


    ```

    DETACH 100

    RDR  0100 DETACHED

    ```


    This also works on punch and printer devices.


    # Understanding spool files


    Spool files can be seen as files that are queued up for further processing. They
    are either destined to a virtual machine (punch), awaiting a virtual machines'
  merge: -1
  img_proc: true
- pgno: 284
  md: '> Note: CP does not have editing capabilities. If you have to edit a file that
    is in CP spool, it must be transferred to the reader queue (if it were in the
    punch or print queue) and then received onto disk using the CMS RECEIVE command.


    When your z/VM system was set up, your system administrator set aside some disk
    space for spool files. Any files that are in one of your virtual spool device
    queues actually exist on this disk space set aside as system spool space.


    # Displaying files in your reader queue


    CP allows you to display the information about the files in your reader queue.
    Use the QUERY READER ALL command, as shown in Example 5-46.


    ```

    QUERY READER ALL

    ORIGINID FILE CLASS RECORDS CPY HOLD DATE TIME NAME TYPE

    FRED 0008 A PUN 00000017 001 NONE 06/07 13:46:01 TUX1 NETLOG

    FRED 0009 A PUN 00000008 001 NONE 06/07 13:49:44 PROFILE EXEC

    ```


    This example shows two files in the reader queue: a file named TUX1 NETLOG and
    a file named PROFILE EXEC. The significant points about the output are listed
    in Table 5-4.


    | Column | Description |

    |--------|-------------|

    | ORIGINID | The user name of the virtual machine that sent the file to your reader
    queue |

    | FILE | The unique number assigned to the file. We will use this with other commands.
    |

    | DATE & TIME | The date and time that this file was placed in the reader queue
    |

    | NAME & TYPE | The file name and type given to this file by the creator |


    You can query the files in your printer and punch queues by substituting PRINTER
    or PUNCH for READER in the QUERY READER command shown in Example 5-46.


    # Adding files to your reader


    Files are added to your virtual reader when another user sends a file to you or
    if a program is set up to create output that is destined for your user ID.'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'If you want to have a CMS file added to your reader, you could simply use the
    SEND FILE command to send that file to your user ID. If you want to have a file
    in your print or punch queue added to your reader, you could do a transfer of
    the file, as shown in Example 5-47.


    # Example 5-47 Transfer a file from your print queue to your reader


    ```

    q prt all

    OWNERID FILE CLASS RECORDS CPY HOLD DATE TIME NAME TYPE DIST

    LNXGUI 0029 T CON 00000017 001 NONE 06/09 11:51:06 LNXGUI

    Ready; T=0.01/0.01 10:20:26

    ```


    ```

    trans prt 29 * rdr

    RDR FILE 0029 SENT USER1 PRT WAS 0029 RECS 0017 CPY 001 T NOHOLD NOKEEP

    00000001 FILE TRANSFERRED

    Ready; T=0.01/0.01 10:21:26

    ```


    ```

    q rdr all

    OWNERID FILE CLASS RECORDS CPY HOLD DATE TIME NAME TYPE DIST

    LNXGUI 0029 T CON 00000017 001 NONE 06/09 11:51:06 LNXGUI

    Ready; T=0.01/0.01 10:22:26

    ```


    # Deleting files in your reader


    You can remove a file from your reader queue by using the PURGE command. With
    this command, you can specify to clear a single file, multiple files, or all of
    the files in your reader queue. To clear a single file, specify which queue to
    delete from and the number of the file within that queue to delete; see Example
    5-48.


    # Example 5-48 Deleting a single file from your reader


    ```

    PURGE READER 8

    0000001 FILE PURGED

    ```


    CP responds that it deleted one file. If you want to delete multiple files, specify
    all of the file numbers for the files you want to delete, separated by spaces;
    see Example 5-49.


    # Example 5-49 Deleting multiple files from your reader


    ```

    PURGE READER 8 9 10

    0000003 FILES PURGED

    ```


    CP now responds that it has deleted all three of the files specified. To delete
    all of the files in your reader queue, specify the ALL parameter, as shown in
    Example 5-50 on page 271.'
  merge: -1
