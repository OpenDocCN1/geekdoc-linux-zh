    \ or clear key to continue\n+   ```\n\n+   7. Press Enter. The z/VM logon window\
    \ opens.\n\nCongratulations! You now have a vanilla z/VM system installed.\n\n\
    # Configuring the PROFILE XEDIT file\n\nWhen invoked, the XEDIT command looks\
    \ for the file PROFILE XEDIT configuration file. Many z/VM user IDs do not have\
    \ such a personal or shared system file, so all XEDIT default values are in effect.\
    \ The MAINT 191 (A) disk has a PROFILE XEDIT file, so when you are editing files\
    \ on MAINT, the values in this profile are usually in effect.\n\nTo have a good\
    \ experience while using XEDIT, make the profile for the MAINT user be similar\
    \ to the one in Example 2-25 on page 92. To do this, log on to MAINT and edit\
    \ the file with XEDIT itself:\n\n```\n==> xedit profile xedit a\n```\n\nSave your\
    \ changes with the XEDIT subcommand SAVE."
