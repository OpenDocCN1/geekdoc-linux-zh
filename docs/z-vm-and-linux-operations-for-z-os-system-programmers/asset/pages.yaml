    \ see snapshot of the z/OS system log in Figure 4-40.\n\n```\n- 12.57.20 IOS1501\
    \ DEVICE 6000 NOW AVAILABLE FOR USE\n- 12.57.58 d u,,6000,1\n  12.57.58 IEE4571\
