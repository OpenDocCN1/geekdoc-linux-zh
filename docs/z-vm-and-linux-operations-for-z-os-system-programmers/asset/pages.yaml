    |  | DASD | SCSI | Tape |  |

    | Environment | VM and LPAR | LPAR only | VM and LPAR | VM only |

    | Speed | Fast | Fast | Slow | Medium |

    | Medium | ECKD or FBA DASD | Linux file system on a SCSI disk | tape cartridges
