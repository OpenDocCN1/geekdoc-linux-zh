- pgno: 366
  md: '# System events and logs, backup and recovery


    Linux on System z is a reliable environment to run applications. However, error
    situations can still occur. For instance, you might encounter:


    +   - Software errors: abnormal program termination, invalid input data

    +   - Operating system errors: at the Linux or z/VM level

    +   - Hardware errors: LPAR, system or disk subsystem failure


    This chapter provides an overview of several tools available in z/VM and Linux
    to collect and analyze system events, and to create backups and restore them in
    case of an unrecoverable failure.


    # Objectives


    After completing this chapter, you should be able to:


    +   - List the tools available for system events and errors logging

    +   - List the tools available for errors analysis

    +   - Discuss the various options considered for backing up and restoring data'
  merge: -1
  img_proc: true
- pgno: 367
  md: '# 8.1 z/VM and Linux error handling


    This section provides an overview of how errors are handled in z/VM and Linux,
    and details about several error codes.


    # 8.1.1 z/VM default error handling


    Each z/VM feature, module, or facility, is responsible for handling the user-related
    errors that occur when a command is issued. These errors can be caused by, but
    are not limited to, incorrect configuration, incorrect invocation of a command,
    irrelevant input data. When such an error occurs, the function that fails informs
    the user by issuing an error code and message.


    For instance, CP issues the message shown in Example 8-1 when a user tried to
    log on to a virtual machine that is not defined in z/VM.


    # Example 8-1 Error message when logging on to an undefined virtual machine


    ```

    L LASMAYOU LASMAYOU

    HCPLGA053E LASMAYOU not in CP directory


    Enter one of the following commands:


    LOGON userid        (Example: LOGON VMUSER1)

    DIAL userid         (Example: DIAL VMUSER2)

    MSG userid message  (Example: MSG VMUSER2 GOOD MORNING)

    LOGOFF

    ```


    For more details about z/VM error codes and messages, refer to section 8.1.2,
    "z/VM error codes" on page 353.


    System related errors, which are intermittent and permanent machine errors and
    system I/O errors, are handled automatically by CP, in a way that is completely
    transparent to the user. However, when an error occurs, CP records it and sends
    a message to your z/VM primary system console. The message notifies you of the
    error and indicates whether the error and indicates whether the:


    +   - System operation can continue

    +   - System operation can continue, but with fewer resources

    +   - System restart and recovery is beginning


    If the error occurred in an identified virtual machine, provided that the overall
    z/VM system''s integrity is preserved, a soft abend occurs. During a soft abend,
    CP takes a soft abend dump, and operations continue.'
  merge: -1
  img_proc: true
- pgno: 368
  md: 'If the error is more critical, CP terminates in a hard abend. During the abend:


    +   - CP saves z/VM spool files and system data file queues.


    +   - CP takes a hard abend dump, that can be used later for debugging purposes.


    +   - CP tries to restart itself and the operator''s console virtual machine.


    > Note: All guest operating systems that were running before the abend have to
    be restarted manually, unless the appropriate IPL commands have been set up.


    If CP is not able to restart, it informs you of the required steps to recover
    from the error.


    # 8.1.2 z/VM error codes


    Most of z/VM error codes follow the same format. The code has a message identifier
    and message text.


    The message identifier is one of the following formats:


    ```

    xxxmmm###s

    xxxmmm####s

    ```


    The format indicates the following information:


    +   - First 3 characters (xxx) is the prefix identifying the component. See Table
    8-1 on page 354 for a list of the major component identifiers.


    +   - Next 3 characters (mmm) is the module code that identifies, in a given component,
    the module or function that fails.


    +   - Following 3 or 4 digits (### or ####) is the message number itself.


    +   - The last digit (s) can be one of the following severity codes:

    +     A Immediate action is required

    +     D Decision

    +     E Error

    +     I Information only

    +     R Response

    +     S Severe Error

    +     T Terminating Error

    +     W System Wait (CP only), warning (all others)


    Table 8-1 on page 354 lists the component prefix identifiers for the first three
    characters in the message.'
  merge: -1
  img_proc: true
- pgno: 369
  md: '# Table 8-1 z/VM major components identifiers


    | Prefix | z/VM component |

    | --- | --- |

    | DMS | CMS (Conversational Monitoring System) |

