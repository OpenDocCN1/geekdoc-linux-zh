- pgno: 401
  md: '# 8.4.4 Other available tools


    Backup and restore software is available from many vendors, including:


    +   • IBM Tivoli Storage Manager


    The IBM Tivoli Storage Manager’s backup and recovery solution is a centralized,
    comprehensive solution. It that employs smart data moves and smart data store
    technology, which offer quick, flexible, and low-impact backups and restores.
    The IBM Tivoli suite of storage products supports more than a dozen OS platforms,
    a variety of network connectors and more than 500 offline-storage devices.


    For more information about IBM Tivoli Storage Manager, refer to the IBM Tivoli
    Web site:


    http://www-306.ibm.com/software/tivoli/solutions/backup/


    +   • CA VM:Backup


    This tool can back up CMS and non-CMS data in z/VM, and Linux systems. Users can
    restore their individual files or minidisks; administrators can restore full volumes
    or entire systems. When no operating system is running on the processor, Hidr
    o, a feature of CA VM:Backup, can provide stand-alone backup and restore.


    For more information, refer to the product brief on the CA Web site:


    http://ca.com/files/ProductBriefs/vmbubackup_pb2.pdf


    +   • Innovation Data Processing’s FDR/UPSTREAM


    This storage management product is for centralized, automated, and unattended
    backup and restore, and archival for Open systems. Your data can be stored on
    a LAN/NAS/SAN. The product provides automated operations to OS/390 or z/OS MVS
    mainframe servers.


    For more information about FDR/UPSTREAM, refer to:


    http://www.innovationndp.fdr.com/products/upstream/zlinuxups.cfm


    Database vendors also provide their own database backup tools. For instance, Oracle®
    provides RMAN, Recovery Manager, to handle backup and restore of their database
    on various platforms.'
