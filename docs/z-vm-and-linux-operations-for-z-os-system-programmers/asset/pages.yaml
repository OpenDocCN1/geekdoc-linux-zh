- pgno: 68
  md: '# 2.7.2 The primary system operator console


    The primary system operator console is the console where CP automatically logs
    on the system OPERATOR virtual machine during initial program load (IPL). This
    can be the Hardware Management Console, or a device specified during the IPL.
    If SYSC is specified, the Operating System Messages panel becomes the system operator
    console. If SYSG is specified, the integrated 3270 console becomes the system
    operator console. Your installation chooses the device or Hardware Management
    Console function (SYSC or SYSG) to be identified as the primary system operator
    console by using one of the following statement or parameters:


    +   - SYSTEM CONFIG statement, OPERATOR_CONSOLES

    +   - IPL parameter, CONS=xxxx

    +   - Load parameter CONSxxxx


    The primary system operator console is where you perform most of the tasks in
    this book. For example, you enter CP commands from the primary system console
    to perform the following tasks:


    +   - Opening the z/VM CP

    +   - Shutting down the z/VM CP

    +   - Controlling z/VM devices

    +   - Communicating with z/VM users

    +   - Responding to z/VM errors

    +   - Collecting information about z/VM operation


    After CP logs in to the system OPERATOR, it controls the format of the primary
    system console''s screen. If you are unfamiliar with this format, see z/VM: Virtual
    Machine Operation, SC24-6128.


    # 2.7.3 The z/VM virtual consoles


    Other consoles you use are the virtual consoles for the virtual machines from
    which you create and initialize work or production systems. Use this console when
    you:


    +   - Log on a production system''s virtual machine.

    +   - Set up any special running environment it requires.

    +   - Use the CP IPL command to load production systems in the virtual machine.

    +   - Have to recover a production system.

    +   - Control a production system''s virtual machine.


    > 5 Found in the PDF at: http://publibz.boulder.ibm.com/epubs/pdf/hcse8b11.pdf'
  merge: -1
  img_proc: true
