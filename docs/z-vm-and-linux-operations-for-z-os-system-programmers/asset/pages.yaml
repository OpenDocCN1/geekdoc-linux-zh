    Describing how to use all these tools is beyond the scope of this book. A detailed
    process for using a dump tool is described in the Linux on System z: Using the
    Dump Tools, SC33-8412, which you can download from the developerWorks Web site
    at:


    http://www.ibm.com/developerworks/linux/linux390/development_documentation.html#3


    # Traces, as an error analysis tool


    Another useful way of identifying the failing step in the execution of a program
    is to trace the program. Linux provides many tools to trace the execution of a
    program. One tool is called strace.


    In the simplest case, strace runs the specified command until it exits. It intercepts
    and records the system calls which are called by a process and the signals which
    are received by a process. The name of each system call, its arguments and its
    return value are printed on standard error or to the file specified with the -o
    option. The strace tool is useful as diagnostic, instructional, and debugging
    tool. System administrators, diagnosticians, and trouble-shooters find it invaluable
    for solving problems with programs for which the source is not readily available
    because they do not have to be recompiled to trace them. And programmers find
    that, because system calls and signals are events that happen at the user/kernel
    interface, a close examination of this boundary is very useful for bug isolation,
    sanity-checking, and attempting to capture race conditions.


    Example 8-17 on page 374 shows the beginning of the strace output when stracing
    the ls command. All system calls are detailed, with their parameters and the return
    codes sent. This can be used to identify which step of a program fails.'
  merge: -1
  img_proc: true
