    # 2.3.5 Dump Viewing Facility


    The Dump Viewing Facility (DVF) helps you interactively diagnose system problems.
    Using this facility, you can display, format, and print data interactively from
    virtual machine dumps, and display and format recorded trace data.


    The BLOCKDEF utility enables you to display, format, and print control block information.
    The VIEWSYM command lets you display symptom records, allowing you to more easily
    identify duplicate problems when they occur.


    z/OS analogy: DVF is similar to the Interactive Problem Control System (IPCS)
    in z/OS.


    # 2.3.6 Group Control System (GCS)


    Group Control System (GCS) runs in an Extended Architecture (XA) or Extended Common
    (XC) mode virtual machine in place of CMS. It is a virtual machine supervisor,
    providing multitasking services that allow numerous tasks to remain active in
    the virtual machine at one time.


    A function of GCS is to support a native SNA network. The SNA network relies on
    ACF/VTAM, VTAM SNA Console Support (VSCS), and other network applications to manage
    its collection of links between terminals, controllers, and processors. GCS provides
    services for ACF/VTAM, VSCS, and the others, which eliminates your need for VTAM
    Communications Network Application (VM/VCNA) and a second operating system such
    as VSE.


    # 2.3.7 HCD and HCM for z/VM


    Hardware Configuration Definition (HCD) and Hardware Configuration Manager (HCM)
    for z/VM provide a comprehensive I/O configuration management environment, similar
    to that available with the z/OS operating system.'
