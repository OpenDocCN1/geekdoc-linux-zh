- pgno: 24
  md: '# Introducing z/VM to z/OS system programmers


    This chapter starts with a short discussion of the basics of virtualization. It
    continues with an overview of z/VM concepts and features. The chapter also provides
    lists of references for more details on the each subject.


    As you become a z/VM system programmer or system administrator, you will have
    to understand the concept of virtualization and how z/VM implements virtualization.


    # Objectives


    After completing this chapter, you should be able to:


    +   - Understand basic concepts of virtualization and how z/VM takes advantage
    of it

    +   - Describe the two z/VM components: Control Program (CP) and the Conversational
