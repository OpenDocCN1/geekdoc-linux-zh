    # CP MONITOR


    The CP MONITOR command collects system performance data that can be made available
    to an external data reduction program for analysis. Statistics related to system
    operation or contention for major system resources can be generated. These resources
    include processors, storage, I/O devices, and the paging subsystem. You can control
    the amount and nature of the data collected.


    In general, the monitoring process has the following flow:


    +   1. The user issues the privileged CP MONITOR command to control monitoring.
    This includes the type, amount, and nature of data to be collected.

    +   2. The monitor collects performance data and stores monitor records in a saved
    segment.

    +   3. A CMS application program connects to the CP MONITOR System Service to
    establish a data link with CP.

    +   4. The application retrieves and processes monitor records from the saved
    segment.


    # CP SET


    The CP SET commands can change the performance characteristics of the entire system
    or of a single user.


