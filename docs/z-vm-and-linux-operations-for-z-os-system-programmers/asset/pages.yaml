- pgno: 287
  md: "# 5.3.11 The CMS Shared File System\n\nz/OS programmers might be familiar with\
    \ the z/OS UNIX System Services (z/OS UNIX or UNIX System Services), which allows\
    \ z/OS to access UNIX files. The most noticeable difference between the z/OS UNIX\
    \ file system and z/OS data sets is that z/OS UNIX is a hierarchical file system\
    \ when accessed from within UNIX System Services.\n\nThe z/VM file system, CMS\
    \ Shared File System (SFS), allows you to view the system in a hierarchical fashion:\
    \ z/OS programmers might be more accustomed to this type of hierarchical file\
    \ system.\n\nSFS is an additional file system that is shipped with z/VM, and it\
    \ offers several advantages over the normal CMS file system. Table 5-6 lists and\
    \ compares these file systems.\n\n# Table 5-6 Compare and contrast SFS and normal\
    \ CMS file system\n\n| Shared File System | CMS file system |\n|---|---|\n| Sharing\
    \ at file level | Sharing at minidisk level |\n| Minimum allocation: zero 4096\
    \ byte blocks | Minimum allocation: 1 cylinder |\n| Hierarchical file system |\
    \ Flat file system |\n| Allocation can be changed dynamically | Bigger minidisk\
    \ required |\n| Recovery at file level | Recovery at minidisk level |\n\nSFS is\
    \ essentially a collection of minidisk storage managed by a server. The following\
    \ three main areas are shown in Figure 5-4 on page 273:\n\n+   **Control data**\n\
    +   Holds the definitions of the file pool and its users.\n+   \n+   **Log data**\n\
    +   Holds the logs so that, in the event of interruption, files can be rolled\
    \ back.\n+   \n+   **User data**\n+   Holds the user data. The server allocates\
    \ data from here to give to users."
  merge: -1
  img_proc: true
- pgno: 288
  md: '![](img/b0a4b9056f819dccd4781a5105c92d45_288_0.png)


    Figure 5-4 Shared File System (SFS)


    With SFS, instead of a minidisk, you are enrolled in a file pool by an administrator
    and are given a number of 4096-byte blocks from a storage group that you use in
    a similar way to a CMS minidisk.


    Although accessing the space is similar to accessing a CMS minidisk, you use the
    file pool name concatenated with your user ID instead of a minidisk device number.
    For example, instead of using 191 on and the ACCESS command, you would use:


    ```

    VMSYSU:USERID

    ```


    After accessing SFS, users can use commands to create directories and subdirectories
    in a similar way as they do on a workstation, creating a hierarchical file structure
    if needed. Users can then GRANT authority at the file level to allow other users
    to read or write to data in its file space.


    If you have been allocated space in the file pool, review the commands listed
    in Table 5-7 on page 274.'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# Table 5-7 Commands related to SMS


    | Command | Description |

    |---|---|

    | SET FILEPOOL | Set (or reset) your default file pool; for example:

    set filepool vmsysu |

    | QUERY FILEPOOL | Display your current file pool; for example:

    query filepool current |

    | QUERY LIMITS | View how many 4-K blocks you have available to use; for example:

    query limits |

    | DIRLIST | List you directories. This is similar to using FILELIST to list CMS
    files. |

    | ACCESS | Assign a mode letter to your file space; for example:

    access vmsysu:cmsuser a

    ACCESS is similar to the way that minidisks are accessed. |

    | CREATE | Create a directory; for example:

    create directory test

    CREATE is similar to mkdir on a PC. |

    | GRANT | Grant other users access to files or directories. |


    The entire file system has an administrator who is responsible for backups and
    allocation of minidisks to storage groups as required.


    z/VM is shipped with three file pool servers:


    +   - VMSERVR is used by z/VM

    +   - VMSERVS is used by z/VM

    +   - VMSERVU, a sample user file system


    For more information about these topics, refer to z/VM: CMS File Pool Planning,
    Administration, and Operation, SC24-6074, and z/VM: CMS Commands and Utility Reference,
    SC24-6073.


    # 5.4 Job scheduling and running batch jobs


    z/VM and Linux offer ways of scheduling jobs to run at a particular time of the
    day/month/year and also to make them run periodically. This is useful to schedule
    nondisruptive system maintenance tasks; to run these, you do not have to stop
    anything that any user might be doing at a given time. Tasks can include: compacting
    the system logs to save space, updating backups, and so on.'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'The task of scheduling batch jobs, however, is not a common concept in z/VM
    or Linux. In fact, to run many *batch* processes, you can either create a script
    for that or run all of them at once, knowing that they would eventually compete
    for I/O resources.


    The following section gives an overview of tools similar to z/OS job entry subsystem
    (JES). You can simulate a batch processing queue by using those scheduling tools
    and creating scripts.


    # 5.4.1 Job scheduling


    This section compares job scheduling in z/VM and Linux.


    # Job scheduling in z/VM


    Scheduling a job is usually done with tasks that do not require human intervention,
    such as manipulating logs and creating backups. Scheduling a job in z/VM is not
    a usual task because administrators usually use available tools in guest systems
    to perform the tasks.


    For the sake of completeness, the authors searched the Web and found products,
    such as CA VM:Schedule for z/VM, the IBM Operations Manager for z/VM, and two
    free tools (PROP and WAKEUP) shipped with z/VM, that accomplish job scheduling.


    # Job scheduling in Linux


    Linux systems have a utility tool called cron to schedule programs to run periodically.
    Scheduling information is placed in the /etc/crontab file, using the following
    format:


    ```

    minute hour day month year username command

    ```


    You can specify each time component as an integer number. For example, use the
    numbers 1 through 12 for the months of January through December. Or specify one
    or more components by using asterisk (*) characters, which are treated as wildcards.
    For example, * in the month component means the command will run at the specified
    day and time in every month. The username parameter should be the name of the
    user who executes the command, which might be different for security or authority
    reasons. For example, a backup process must be run by a user who can read all
    files in all directories. Each user may also put a crontab file in the home directory.
    For more information, refer to:


    http://www.linuxdoc.org'
  merge: -1
  img_proc: true
- pgno: 291
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 292
  md: 'in batch mode. The system operator generates the batch machine by either of
    the following methods:


    +   Entering the BATCH parameter in the PARM field of the IPL command

    +   Specifying the NOSPROF parameter of the IPL command and entering the CMSBATCH
    command when the VM READ status appears.


    After each job is executed, the batch facility IPLs itself, thereby providing
    a continuously processing batch machine. The batch processor IPLs itself by using
    the PARM option of the CP IPL command followed by a character string that CMS
    recognizes as peculiar to a batch virtual machine performing its IPL. Jobs are
    sent to the batch machine''s virtual card reader from user terminals and executed
    sequentially. When no jobs are waiting for execution, the CMS batch facility remains
    in a wait-state, ready to execute a user job. The CMS batch facility is particularly
    useful for compute-bound jobs such as assemblies and compilations and for execution
    of large user programs, because interactive users can continue working at their
    terminals while their time-consuming jobs are run in another virtual machine.
    The system programmer controls the batch facility virtual machine environment
    by resetting the CMS batch facility machine''s system limits, by writing routines
    that handle special installation input to the batch facility, and by writing exec
    procedures that make the CMS batch facility easier to use.


    > Note: For in-depth information about how to use the CMS Batch Facility, refer
    to the CMS Planning and Administration, SC24-6078 at:

    > http://publibz.boulder.ibm.com/epubs/pdf/hcsq2b10.pdf


    # Simulating batch jobs in Linux


    This section gives you a very simple overview of how to use scripts to simulate
    batch-like processing. You can also schedule cron to run the scripts during the
    night, for example, to run daily sales reports.


    The scenario in this section makes use of shell scripting, a language interpreted
    by many Linux shells⁷, to control the batch behavior of the processes. This controlling
    script runs one program at a time. We wrote two simple programs to sort the words
    of text files: one in natural order and the other in reverse order.


    The script is shown in Example 5-52 on page 278. It calls all programs found in
    the ./batch folder, our sorting programs. Each of the programs has its corresponding
    input file in our the ./input folder (where we placed the files for sorting) and
    each output is sent to our ./output folder. The only constraint to


    ⁷ A shell is a program that interprets user inputs, calls the corresponding system''s
    commands, and displays the output of that command. It is the user interface shown
    in Linux consoles after you log in.'
