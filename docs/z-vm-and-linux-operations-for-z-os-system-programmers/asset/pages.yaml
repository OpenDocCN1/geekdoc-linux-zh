- pgno: 311
  md: '# 6.2.5 DISKMAP command


    This command is used to map the disk extents of the z/VM disks. In this section,
    we pay attention to the disk containing user minidisks, because we are going to
    define a new CMS user.


    > Important: Use of the DISKMAP command is optional, but it is highly recommended.


    DISKMAP reports any gaps or overlaps on these disks. Gaps imply that you are not
    using the disk fully, whereas overlaps means that users are using the same extent
    of the disk. The latter implies a potential risk of overwriting data, thus corrupting
    the disks, and should therefore be avoided.


    The command is invoked by issuing:


    ```

    DISKMAP fn ft (DOENDS

    ```


    The fn is the file name of the USER DIRECT source you want to examine, and ft
    is its file type. The ending text, DOENDS, causes MDISK statements, which had
    "END" specified for the ending cylinder/block in the directory being mapped, to
    be included in the DISKMAP output file.


    Output from DISKMAP is stored in file DISKMAP (fn is the filename of the mapped
    file) on the A drive of the user running it.


    To run the command diskmap user, users must have at least privilege class B.


    Figure 6-1 on page 297 shows the output of file USER DISKMAP A (the output is
    lengthy so lines have been removed from the figure). Notice the GAP on line 00329
    starting at cylinder 1886 for 114 cylinders and ending at 1999.


    Based on the output from DISKMAP, minidisks for the user to be defined would have
    to start in CYLINDER 2380 so that no overlaps result (see line 00337 for LYDIA
    191 ending in cylinder 2379).'
  merge: -1
  img_proc: true
