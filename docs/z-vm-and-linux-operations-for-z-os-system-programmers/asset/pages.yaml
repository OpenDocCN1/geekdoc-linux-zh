- pgno: 363
  md: '# 7.4.4 System status (sysstat) tool


    This package consists of several Linux tools to collect system data. The sysstat
    package is a widely used Linux standard tool. It is included in your distribution
    (RHEL 5 or SLES 10) or can be downloaded from the Web at:


    http://pagesperso-orange.fr/sebastien.godard/


    If you install the source package, you have to compile it on Linux on System z
    to use it. The sysstat package consists of the following components:


    | sadc data gatherer | Stores data in binary file |

    | sar reporting tool | Reads binary file created with sadc and converts it to
    readable output |

    | mpstat | Is for processor utilization |

    | iostat | Is for I/O utilization |


    The sar reporting tool prints the following information:


    +   - Process creation

    +   - Context switching

    +   - All/single CPU utilization

    +   - Network utilization

    +   - Disk statistics


    For a more detailed description of sysstat, see:


    http://www.ibm.com/developerworks/linux/linux390/perf/tuning_how_tools.html#sysstat


    # 7.4.5 The OProfile tool


    OProfile is an open source profiler for Linux systems. It offers profiling of
    all running code on a Linux system, including the kernel, shared libraries, application
    binaries, and so on, and provides a variety of statistics at a low overhead (varying
    from 1–8%) depending on the workload. It is released under the GNU GPL. OProfile
    consists of a kernel driver, a daemon for collecting sample data, and tools for
    report generation.


    OProfile generally supports Linux kernel 2.2, 2.4, 2.6, and later.'
  merge: -1
  img_proc: true
- pgno: 364
  md: '> Note: If you are running:

    > ► SUSE Linux, the kernel level must be at least kernel-s390(x)-2.6.5-7.191,
    which starts from SLES9 SP2.

    > ► Red Hat Linux, the kernel level must be at least kernel-2.6.9-22.EL, which
    is RHEL4 U2.

    > ► Linux on System z, OProfile only supports kernel 2.6 or later.


    OProfile uses a CPU''s performance counters to count events for all of the running
    code, and aggregates the information into profiles for each binary image. However,
    System z hardware currently does not have support for this kind of hardware performance
    counters used by OProfile, so the timer interrupt is used instead.


    Example 7-22 illustrates a typical usage of OProfile on a Linux guest running
    on z/VM. To use the OProfile tool, turn on the timer by using command systcl.
    After all profiling is done, turn the timer off. To set up the environment, use
    the opcontrol command to tell OProfile the location of the vmlinux file corresponding
    to the running kernel. Then, it is ready to collect the profile data. After the
    test and tool shutdown, the profiling report can be generated.


    # Example 7-22 Oprofile tool


    ```

    systcl -w kernel.hz_timer=1 1

    gunzip /boot/vmlinux-2.6.5-7.201-s390x.gz 2

    opcontrol --vmlinux=/boot/vmlinux-2.6.5-7.201-s390x 3

    opcontrol --start 4

    26 Linux on IBM System z: Performance Measurement and Tuning

    <DO THE TEST>

    opcontrol --shutdown 5

    opreport 6

    ```


    Note the following points:


    +   1 The command to turn on the timer (timer=1). When the profiling is finished,
    turn off the timer (timer=0).

    +   2 Unzip the vmlinux file if none exists.

    +   3 Specify the vmlinux file for the running kernel.

    +   4 Start the OProfile deamon, and begin profiling.

    +   5 Stop the OProfile deamon, and stop profiling.

    +   6 Provide product symbol or binary image summaries.'
  merge: -1
  img_proc: true
