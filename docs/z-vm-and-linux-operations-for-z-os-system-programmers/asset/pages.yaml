- pgno: 234
  md: '# 4.5 Running a z/OS image as a z/VM guest


    The process of running a z/OS system as a guest of z/VM is much the same as running
    any other guest system. In this section, we discuss moving a z/OS image from a
    z10 LPAR to run as a z/VM guest operating system. This should work for systems
    on any System z processor. It could be the scenario for many sites because of
    LPAR constraints, server consolidation, or to simplify their test environment.
    One strength of z/VM is its ability to virtualize hardware in the form of (for
    instance) virtualized coupling facilities, channel-to-channel adapters and more.
    One could also manipulate the device addresses, thus minimizing the need for administration
    of the hardware configuration (IOCDS). The latter enables a quick and efficient
    path to set up new test images when desired.


    This process is essentially the same as though a new z/OS system were being created
    to run as a z/VM guest. Determining the resources needed would still have to be
    planned and at the point were we IPL the existing z/OS system as a z/VM guest,
    the z/OS installation process would then be performed.


    # 4.5.1 z/OS candidate description


    The z/OS image we are moving from an LPAR to z/VM guest had specific resources
    defined for it. It had a SYSNAME of SC59, and you might want use that as your
    z/VM user ID, but it is not required. It had no CTCs and was not utilizing CFs
    or other hardware to take into account, in addition to communication through OSA
    adapter. It had a hardware configuration similar to the simplified listing in
    Table 4-2:


    Table 4-2: Table of resources


    | Type of resource | Description | Comment |

    |---|---|---|

    | Sysname | SC59 | Can be the z/VM user ID |

    | Memory / CS | 2 GB | Initial storage |

    | Processors / CPs | 4 | — |

    | DASD / Disks | 53 volumes | 3390 Mod 3 and Mod 9 |

    | OSA network adapter | 2000-2005 | QDIO |

    | Console | Address F008 | 3270 console |'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# 4.5.2 Necessary definitions for z/VM


    The resources listed in Table 4-2 on page 219 are the resources you have to define
    to the virtual machine in which you intend to bring up your z/OS image. Please
    observe that the table does not contain all the necessary details, for instance
    all the DASD disk device addresses.


    # 4.5.3 Defining z/OS guest in USER DIRECT


    After we obtained the necessary data about the z/OS image configuration, we logged
    on to our z/VM MAINT user ID and updated the z/VM USER DIRECT file (see sections
    2.2.4, "User directory" on page 18 and "USER DIRECT file" on page 294).


    > Note: Naming your guest machines by using the corresponding z/OS sysname might
    make sense.


    Figure 4-36 shows definitions for the z/OS guest.


    ```

    USER SC59 GUESTZOS 2G 4G G

    INCLUDE IBMDFLT

    ACCOUNT ITS30000

    IPL CMS PARM AUTOCR

    MACHINE ESA 4

    OPTION MAINTCCW QUICKDSP

    CONSOLE F00B 3215

    NICDEF 2000 TYPE QDIO DEVICES 6 LAN SYSTEM VSW1

    MDISK 0191 3390 2390 2 LX6W02 MR

    MDISK 813A 3390 0 END OP1TSA MWV

    MDISK 8244 3390 0 END OP1HFC MWV

    ....

    MDISK C730 3390 0 END IODFPK RR

    MDISK D42A 3390 0 END Z19RF1 RR

    ```


    Figure 4-36 USER DIRECT entry for the SC59 user id.


    Description of the statements from the line numbering in Figure 4-36:


    +   1 Establishes USER SC59 with a password of GUESTZOS. It is defined with 2
    GB storage initially and 4 GB as a maximum, and defined as a privilege class G
    user (no special privileges).


    +   2 Includes the PROFILE IBMDFLT (not shown here).'
  merge: -1
  img_proc: true
- pgno: 236
  md: '3 Provides accounting information.


    4 IPLs CMS on logon, which automatically executes the PROFILE EXEC, if present.
    From the PROFILE EXEC, you could execute other execs.


    5 Defines the mode for the guest. For this particular user, the architecture is
    ESA with up to 4 CPUs.


    6 Establishes options for the guest user ID. MAINTCCW implies that the guest is
    allowed to initialize any DASD it uses. QUICKDSP causes the guest to be added
    to the dispatch list immediately when it has work to do without entering the eligible
    list.


    7 Defines guest console address as the same address as the z/OS console. Note
    that it has to be defined as 3215 at this stage due to z/VM console requirements.
    It will be redefined to 3270 in order to IPL z/OS in the IPLSC59 EXEC (see Example
    4-18 on page 225).


    8 Defines a connection to a z/VM vswitch as an OSA device with six consecutive
    addresses starting at address 2000.


    9 Defines the guest''s minidisk in CMS. Used for CMS file system, for instance
    PROFILE EXEC (described later).


    10 11 Provides definitions of the DASD that z/OS requires. They are all defined
    as minidisks, starting in cylinder 0 and ending in the highest cylinder (the entire
    disk). In our case, the real address and the virtual address of every device is
    identical. The disk addresses could be defined using addresses other than the
    real ones to simplify configuration administration of test images. Note also that
    the disk is defined having an access mode of MWW, meaning Multi-Write access.
    The last V defines that CP should use its virtual reserve/release support for
    I/O operations for this minidisk. This is to ensure integrity if accessed from
    several guests. If there are shared read only DASDs, then access can be defined
    as read only (RR).


    > Note: Not all disks are listed, only a few examples are for illustration purposes.
    Additional minidisks are defined to guest SC59.


    > Tip: You may define minidisks with access mode of RR to prevent them from being
    updated, if that is desirable. This can be useful for preventing allocations or
    updates to certain disks (for instance your SYSRES or IODF disk) without adjusting
    any access rules in RACF or a similar product.'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'After the updates to the USER DIRECT file are done, save the file and issue
    the following DIRECTXA command to load the new directory into z/VM storage.

    `directxa user direct c`


    # 4.5.4 ZOS1 guest console considerations


    In this scenario, we choose not to use any channel-attached console to operate
    the image for simplicity. This implied that we could log on to the z/VM guest
    user ID, IPL the z/OS, and use that session as a z/OS operator console.


    **Warning:** A concern is if the z/OS operator issues a CP LOGoff, the z/OS system
    will immediately terminate. A CP DISConnect should be used to keep the system
    running.


    **Important:** When running z/OS as a z/VM guest, the HMC console cannot be used
    for IPLing the z/OS guest


    This type of operation also implies that we need to change the mode for the operator
    console to 3270 prior to IPLing z/OS to avoid console lockouts, as 3270 is the
    supported terminal type in z/OS.


    # 4.5.5 SC59 guest PROFILE EXEC creation


    We created a PROFILE EXEC file for guest user ID SC59 to define additional CPUs.
    You may add other definitions according to each installation''s requirements.
    The PROFILE EXEC is executed each time an IPL of CMS is performed. This exec is
    also executed when a user ID is autologged onto the z/VM system. Reconnecting
    from a disconnected virtual machine does not execute the PROFILE EXEC.


    Figure 4-37 shows the PROFILE EXEC file for the SC59 user ID.


    ```

    PROFILE EXEC  F1 V 130  Trunc=130


    00000 * * * Top of File * * *

    00001 /* PROFILE EXEC FOR SC59 */

    00002 set pf12 ret

    00003 ''CP DEFINE CPU 1''

    00004 ''CP DEFINE CPU 2''

    00005 ''CP DEFINE CPU 3''

    ```


    *Figure 4-37 PROFILE EXEC for SC59*'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'Important: By defining the PROFILE EXEC as we did, you could not AUTOLOG this
    machine and have the z/OS system IPL automatically. The file does not contain
    any statements to actually IPL the z/OS image.


    Instead of placing the statements and commands necessary to perform an IPL of
    the z/OS image in the profile, we created an exec to actually perform this. In
    short, this exec performs the following tasks:


    +   1. Switches the mode of the console to 3270

    +   2. Issues command SET RUN ON

    +   3. IPLs the z/OS image


    The contents of the IPLSC59 EXEC is shown in Figure 4-38.


    ```

    IPLSC59 EXEC      A1  V 130  Trunc=130 Size=14 Line=0 Col=1 Alt=2

    00000 * * * Top of File * * *

    00001 /* Exec to IPL the SC59 guest system */

    00002 trace ''o''

    00003 ''vmfclear''

    00004 cmd = ''TERM CONMODE 3270'' || ''15''X

    00005 cmd = cmd || ''SET RUN ON'' || ''15''X

    00006 say ''**************************************************''

    00007 say ''*''

    00008 say ''*    This is a z/OS 1.9 system,''

    00009 say ''*    WAIT, the system is coming up... SC59''

    00010 say ''*''

    00011 say ''**************************************************''

    00012 cmd = cmd || ''IPL D42A LOADPARM C73059M1 CLEAR''

    00013 push cmd

    00014 exit

    00015 * * * End of File * * *

    ```


    Figure 4-38 Contents of IPL


    Significant items in the IPLSC59 exec are described in the following list:


    +   TERM CONMODE 3270    This switches the mode (or terminal type) to 3270.

    +   ''15''x    This is the end-of-line indicator that occurs after each command.
    The commands themselves are stacked and are issued after the exec has ended (not
    controlled by any logic in the exec itself).'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'SET RUN ON

    This is used to avoid the virtual machine entering CP read mode causing the z/OS
    to halt


    IPL D42A

    This is the actual IPL command for z/OS as normally entered in the HMC if you
    run z/OS in a LPAR.


    > Note: The following important statements or commands in the IPLSC59 EXEC, can
    all be issued as separate commands from the virtual machine itself, rather than
    executing the IPLSC59 EXEC:

    > ► TERM CONMODE 3270

    > ► SET RUN ON

    > ► IPL D42A LOADPARM C73059M1 CLEAR


    # 4.5.6 IPLing the system as a z/VM guest


    After creating the previous files, we took down the z/OS system running in an
    LPAR. Then, we logged on to z/VM user ID, SC59, and ran the IPLSC59 EXEC. After
    a short while (like a normal IPL of an LPAR would), we saw the initial messages
    and our session appeared identical to a normal z/OS operator console. After we
    brought up all the necessary started-tasks and sub-systems, we issued a CP DISC
    command to disconnect from the system console, leaving the z/OS system running.


    > Note: One peculiarity in our way of defining the console, was that on the initial
    IPL, we had to prefix operator responses with #CP VINPUT VMSG to communicate with
    z/OS when in NIPCON mode; for instance:

    > #CP VINPUT VMSG R 00,CONTINUE

    > After entering the normal console mode, this was no longer true. This should
    not be necessary when operating physically attached consoles.


    # 4.5.7 z/OS concerns


    One thing to be aware of from a z/OS perspective, is any use of symbolics HWNAME
    and LPARNAME. If these are used in PARMLIB member (for instance your IEASYMxx)
    or in member LOADxx residing in PARMLIB or SYSn.IPLPARM, they would require your
    attention. The LPARNAME can never be resolved when running z/OS as a z/VM guest,
    so any filtering on values of these variables will fail. Depending on your incorporated
    logic, the IPL could fail because of this issue. If you have filters concerning
    HWNAME, you should consider whether to change it to VMUSERID instead. For details,
    refer z/OS: MVS Initialization and Tuning Reference, SA22-7592.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# 4.5.8 Adding a 3390 disk to the z/OS guest


    As with any z/OS system running in an LPAR, there are occasions when additional
    I/O devices, such as DASD, are required by the system. In an LPAR, defining the
    new DASD in the IOCDS for that LPAR makes the new volumes available to the z/OS
    system. A similar capability exists when running a z/OS system as a z/VM guest.
    After the z/OS guest system was brought up, we went through a series of steps
    to bring online a new 3390 disk volume to the guest system without interrupting
    the system or requiring an IPL. We also decided to bring the physical device address
    8222 online to the z/OS guest as device address 6000 as defined on z/OS. The disk
    had a volser of DK8222. The first thing we did was to add it as a minidisk for
    the guest user (in USER DIRECT file), as illustrated in Example 4-18.


    # Example 4-18 USER DIRECT statement for z/OS guest user minidisk


    ```

    ....

    MDISK 6000 3390 0 END DK8222 MWV

    ```


    Issuing the DIRECTXA command loads the directory to z/VM storage


    After adding the volume, while still logged on to MAINT, we issued the command
    to make the new DASD volume available to the z/VM system and guest users:


    ```

    ATT 8222 SYSTEM

    ```


    We then logged on to the guest z/OS user ID on z/VM. As this also acted as a operator
    console (see our assumption in 4.5.5, "SC59 guest PROFILE EXEC creation" on page
    222, we pressed PA1 (or the keystrokes simulating it from our 3270 emulator) to
    enter CP read mode. We then issued the following command to make the new volume
    available to the z/OS system:


    ```

    LINK * 6000 6000 MWV

    ```


    This is illustrated Figure 4-39.


    ![](img/b0a4b9056f819dccd4781a5105c92d45_240_0.png)


    # Figure 4-39 LINK command issued from z/OS guest user ID


    After clearing the CP window thus entering the z/OS operator console again, we
    observed this message.


    ```

    IOS1501 DEVICE 6000 NOW AVAILABLE FOR USE

    ```'
  merge: -1
  img_proc: true
- pgno: 241
