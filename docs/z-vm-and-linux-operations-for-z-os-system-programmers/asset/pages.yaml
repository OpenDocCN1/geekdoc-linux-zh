- pgno: 242
  md: '![](img/b0a4b9056f819dccd4781a5105c92d45_242_0.png)


    # z/VM system operations


    In this chapter, we introduce several common systems operations tasks for z/VM
    and Linux. In addition, we compare typical z/OS system operations with z/VM and
    Linux. We also provide pointers to resources about cloning systems.


    # Objectives


    After completing this chapter, you should be able to:


    +   - Communicate with other z/VM users

    +   - Understand the IPL and shutdown processes of z/VM

    +   - Perform basic management of z/VM virtual machines

    +   - Perform resource management

    +   - Run processes similar to batch jobs'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# 5.1 Using a console to communicate to users


    Section 2.7, "Consoles" on page 50 discusses the types of consoles that z/VM has
    available. Using these consoles allows communication to other z/VM users.


    You can communicate with z/VM users by sending:


    +   - General information messages to all logged-on users

    +   - General information messages to a specific user

    +   - Warning messages to all logged-on users

    +   - Warning messages to a specific user


    > z/OS analogy: z/OS users make use of the SEND command.


    The MESSAGE and WARNING commands are limited by the length of the input command
    area. If the entire text of a message does not fit in this area, enter another
    command with the remaining text.


    If an external security manager (ESM) is installed, you might not be authorized
    to use the MESSAGE or WARNING commands. However, messages sent to or from the
    system operator and messages sent with the ALL option are not subject to authorization
    checking by the ESM. For additional information, contact your security administrator.


    If CP does not issue your message the way you entered it, it might be because
    you are including special line-editing symbols in the text of your message. For
    example, if logical line editing is in effect, the # symbol is your logical line-end
    symbol; if you include a # in your message text, CP cuts off your message. To
    prevent CP from interpreting these symbols as logical line-editing functions,
    enter the following command:


    ```

    SET LINEDIT OFF

    ```


    CP then issues your messages as you enter them.


    # 5.1.1 Sending a general information message to all users


    To send a general information message, such as "Query log for weekend schedule,"
    to all logged-on users, enter:


    ```

    message all query log for weekend schedule

    ```'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'When Cross System Extensions¹ (CSE) is active and you want all users, logged
    on all systems in the CSE complex, to receive the message, enter:


    ```

    message all at all query log for weekend schedule

    ```


    The following message appears on the display window of all users able to receive
    the message:


    ```

    hh:mm * MSG FROM OPERATOR: QUERY LOG FOR WEEKEND SCHEDULE

    ```


    The hh:mm indicates the time the message was sent. Each user receives the message
    immediately unless:


    +   - An action is pending at the user''s display. In this case, the user receives
    the message when the action completes.

    +   - The user is running in full-screen mode or has entered the SET MSG OFF command.
    In these cases, the user does not receive the message and you receive an error
    message.

    +   - The user is not logged on.


    # 5.1.2 Sending a general information message to a specific user


    Sometimes, you have to send a general information message only to a specific user.
    For example, if you want to inform user VMUSER1 that he is not authorized to use
    pack RC015, which he just asked you to mount, enter the following command:


    ```

    message vmuser1 you are not authorized to use pack rc015

    ```


    When user VMUSER1 has no action pending at his display, the message appears on
    his display window (provided he is not running in full-screen mode or has not
    entered the SET MSG OFF command). Only VMUSER1 receives this message.


    # 5.1.3 Sending a warning message to all users


    Occasionally, a system problem requires you to take action, such as having to
    IPL the system, that would disrupt a user''s virtual machine operation. When this
    happens, using the warning command will immediately interrupt the user''s console
    with the urgent message, unlike the MESSAGE ALL, which informs all users of the
    situation:


    ```

    warning all the system will be IPLed in 5 minutes, please log off.

    ```'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'Another example is when CSE is active and you want all users, who are logged
    on all systems in the CSE complex, to receive the message, you might enter:


    ```

    warning all at all the system will be IPLed in 5 minutes, please log off.

    ```


    In response, CP displays the message on all user display windows within the next
    60 seconds (provided users are not running in full-screen mode and have not entered
    the SET WNG OFF command). This should give them time to save what they are currently
    working on.


    > **Note:** If you use the MESSAGE command to send a warning, a user with an action
    pending does not receive it until that action completes, which could be too late.


    # 5.1.4 Sending a warning message to a specific user


    Sometimes, you have to send a high-priority message to a specific user. For example,
    user MVSOPR1 might submit a high-priority file that must be processed on printer
    00E, but the printer is dedicated to user VMUSER1. Before you reassign the printer
    to user MVSOPR1, you might want to send user VMUSER1 the following warning message:


    ```

    warning vmuser1 system needs printer 00e - draining in 5 minutes

    ```


    If the user is not running in full-screen mode and has not entered the SET WNG
    OFF command, user VMUSER1 receives this message within the next 60 seconds and
    should stop sending files to this printer for processing.


