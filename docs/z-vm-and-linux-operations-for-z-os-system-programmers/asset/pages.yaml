    APPC/VM VTAM Support (AVS) is a Virtual Telecommunications Access Method (VTAM)
    application that provides Advanced Program-to-Program Communication (APPC) services
    between VM and non-VM systems in a Systems Network Architecture (SNA) network.


    AVS and VTAM run in the same Group Control System (GCS) group on a z/VM system.
    Together, AVS and VTAM enable APPC/VM application programs in a'
