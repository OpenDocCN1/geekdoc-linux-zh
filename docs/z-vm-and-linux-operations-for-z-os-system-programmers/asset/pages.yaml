- pgno: 78
  md: '# Setting the clear screen timeout


    You might have noticed that when your screen fills up, CP displays the text More...
    in the lower right corner of the screen and waits for you to press the key on
    your keyboard that clears the screen before displaying more output.


    > Note: Clearing the screen on a 3270: use the Pause (Break) key; with IBM Personal
    Communications 3270 emulator software, right-click the mouse on the screen and
    select Clear.


    By default, CP waits 60 seconds for you to clear the screen before clearing it
    automatically. To customize this behavior use the TERM MORE command and with the
    timeout parameters, described in Table 2-2:


    ```

    TERM MORE t1 t2

    ```


    Table 2-2 TERM MORE command parameters


    | Parameter | Description |

    |---|---|

    | t1 | The number of seconds that CP waits before sounding a bell to alert you
    that the screen will automatically clear. The default is 50 seconds. |

    | t2 | The number of seconds after the bell is sounded before the auto-clear actually
    takes place. The default is 10 seconds. |


    To prevent CP from holding the screen and forcing you to press the clear key,
    set both timeouts to zero (0) seconds:


    ```

    TERM MORE 0 0

    ```


    Keep in mind, however, that by setting the timeouts to zero, you might not have
    time to read all of the messages displayed on the terminal. In some cases, this
    might be acceptable (for example, if you are running a command or a program that
    is generating a large amount of output that you do not care about).


    To return to the default behavior of 60 seconds (50 seconds before the bell, 10
    additional seconds before the clear), use the following command:


    ```

    TERM MORE 50 10

    ```


    > Note: The maximum value you can specify for both timeouts is 255 seconds. This
    means that the maximum wait before an auto-clear is 8 minutes and 30 seconds.'
  merge: -1
  img_proc: true
- pgno: 79
  md: "# Highlighting user input\n\nThe CP TERM command has a parameter that causes\
    \ all user input (that is, all text that you specifically enter) to be highlighted\
    \ in a color different from the color used for other text output.\n\nTo enable\
    \ highlighting, use the TERM HILIGHT ON command. Any command you enter after this\
    \ will be highlighted in a different color on the screen. Enabling a color change\
    \ helps you to visually separate input from output and generally makes your terminal\
    \ text easier to read.\n\nTo disable highlighting, use the TERM HILIGHT OFF command.\n\
    \n# Changing screen colors\n\nYou can change the colors that CP uses to display\
    \ input, output, and status on your 3270 terminal emulator window by using the\
    \ SCREEN command, with parameters described in Table 2-3:\n\n```\nSCREEN area-output\
    \ color effect\n```\n\nTable 2-3 SCREEN command parameters\n\n| Parameter | Description\
    \ |\n|-----------|-------------|\n| area | The area of the screen you want to\
    \ change. Valid areas or output types are listed in Table 2-4. |\n| color | The\
    \ color you want to use for the text in the chosen area. Valid colors are:\n \
    \ - BLUE\n  - TURQUOISE\n  - RED\n  - PINK\n  - GREEN\n  - WHITE\n  - YELLOW |\n\
    | effect | The effect you want to apply to the text in your chosen area. Valid\
    \ effects are listed in Table 2-5. |\n\nTable 2-4 on page 65 lists the valid areas\
    \ and output formats for the SCREEN command."
