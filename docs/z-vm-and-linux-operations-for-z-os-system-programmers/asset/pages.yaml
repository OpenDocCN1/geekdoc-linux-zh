    +   5. Quit the file USER DISKMAP with the QUIT command or by pressing F3.


    +   6. If you have used one of your new DASDs, edit the USER DIRECT file again
    and add a new minidisk definition for that one very first cylinder you left out
    from it⁸. This prevents the system from reporting it as a gap.


    The following example is the USER DIRECT file:


