  md: '# CERTIFICATION SUMMARY


    A systems administrator works on a variety of tasks. VNC makes it possible for
    administrator to see what a user is doing remotely on a GUI system, assuming open
    TCP ports 5900 and 5901.


    Different systems administration commands relate to packages, including tar, star,
    gzip, and bzip2. As an administrator, you need to know how to identify processes
    that are using too much memory or CPU with commands like ps and top. Once identified,
    you can reprioritize them with renice, stop them with kill and killall, and restart
    them in a more appropriate priority with nice.


    Automated administration is still possible with the cron daemon. Jobs can be stored
    in the /etc/cron.d directory, time-sensitive directories such as /etc/cron.hourly
    and /etc/cron.monthly, as well as user-specified jobs in the /var/spool/cron directory.


    When problems arise, you may need to refer to log files. Most local system log
    files can be found in the /var/log directory. File locations and facilities, as
    well as log levels to be collected, are defined in the /etc/rsyslog.conf file.
    Service-related log files may be configured in their own specialized directories.'
