  md: '# 110 Chapter 6: Linux Filesystem Administration


    As suggested by the title, this chapter is all about filesystem management. Yes,
    there are ten objectives covered in this chapter. In general, they deal with the
    configuration of a hard drive into partitions, as well as the reconfiguration
    of such partitions into logical volumes. Once configured, those partitions and
    volumes can be formatted to the ext2, ext3, and ext4 file systems. If desired,
    such partitions can be set up in encrypted format.


    Formatted file systems can be mounted temporarily with commands. Formatted file
    systems can also be mounted automatically during the boot process through the
    /etc/fstab configuration file. To minimize the risks of confusion on systems with
    multiple drives, Linux allocates Universally Unique IDs (UUIDs) or labels to each
    volume. Volumes can then be mounted locally, or shared via Samba or Network File
    System.


    While this chapter addresses ten different objectives, these objectives are interactive.
    For example, to add a new partition, you need to use a tool like fdisk or parted.
    To set the partition type, you need to know what to change in those utilities.
    To create an ext2, ext3, or ext4 file system, you need to know how to format a
    partition or logical volume. To configure that file system to be mounted automatically,
    you need to configure it in /etc/fstab.


    So if some of the instructions in one section seem incomplete, read the rest of
    the chapter. Of course, as this is a Practice Exams book, all explanations are
    minimal.


    While there is some free space available on the VMs for some partitions, you may
    prefer to use an entirely separate storage device. For the gamma.tar.gz archive
    on the DVD, you may have noted a second virtual disk device, gamma.example-net-1.
    It''s a 1GB file


    intended for use as a second virtual hard disk. You can set it up as "existing
    storage" in the GUI Virtual Machine Manager console for that system. Alternatively,
    you could create your own second virtual drive. The next time you boot, it will
    be available for configuration. You can use this drive with less fear of damaging
    the current VM. Of course, if something goes badly wrong, you could delete and
    reinploy the gamma.example.net system, using the techniques described in Chapter
    1.


    Some of you may note the lack of coverage of the automounter in this chapter.
    It''s not covered in the RHCSA objectives and is not listed in the relevant Red
    Hat course outlines.


    ![](img/ad9f3468206ad4765a06e762bd96b965_145_0.png)


    Although RAID was included in Red Hat objectives for RHEL 5, it is not included
    in the objectives associated with the RHCSA or RHCE exams for RHEL 6.'
  merge: -1
