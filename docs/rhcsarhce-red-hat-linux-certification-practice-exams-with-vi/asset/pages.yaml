  md: '# 102 Chapter 5: The Boot Process


    # # CERTIFICATION SUMMARY


    This chapter focuses on exam objectives associated with all aspects of the boot
    process. It describes what happens during the boot process, along with the steps
    you can take to boot, reboot, and shut down a system. During the boot process,
    you can access the GRUB menu, and add a desired runlevel to the end of the kernel
    command line. During the boot process, if you lose the root administrative password,
    you can add the terms 1 or single to the end of the kernel command line to boot
    a system into single-user mode.


    Once a system is booted, you can use a command like init to boot a running system
    into a different runlevel. Runlevels 0 and 6 correspond to shut down and reboot,
    respectively. You can change the default runlevel by changing that variable in
    the /etc/initabb configuration file. With the proper use of the chkconfig command,
    you can configure various network services to start during the boot process in
    the default runlevel.


    Finally, you need to know how to modify GRUB, the system bootloader. Each of the
    lines in the grub.conf configuration file starts with a command directive. You
    should know what happens when you revise the options associated with each of these
    directives.'
