  md: '# 192 Chapter 12: RHCE Administrative Tasks


    in one or more of the following directories: /proc/sys/net/ipv4, /proc/sys/net/ipv4/conf/all,
    and /proc/sys/net/ipv4/conf/default. For example, to activate the icmp_echo_ignore_broadcasts
    parameter in the /proc/sys/net/ipv4 directory, include the following directive
    in /etc/sysctl.conf:


    ```

    net.ipv4.icmp_echo_ignore_broadcasts = 1

    ```


    You can implement any changes you make to the /etc/sysctl.conf file with the sysctl
    -p command.


    # Build a Simple RPM that Packages a Single File


    To learn how to build an RPM package, download and install a source RPM. Many
    are available from ftp.redhat.com. Once installed, they can be found in the rpbbuild/subdirectory.
    RPMs can be built based on .spec files in the rpmbuild/SPECS subdirectory. To
    build a binary RPM, you need the rpbbuild command, which requires the installation
    of the rpbbuild and rmdevtools packages. Use the rpmdev-setuptree command to set
    up the rpbbuild/directory structure.


    When you apply the rpbbuild command to a .spec file, the output may include dependencies
    that need to be installed before the binary RPM package can be built. Navigate
    to the rpbbuild/SPECS directory, and run the rpmdev-newspec command to set up
    a newpackage.spec template in that directory. Copy the file to a desired package
    name. Examine the file. Pay attention to the directives listed in Table 12-3.
    Comment out any unused directives.


    | Table 12-2 | Kernel Parameter | Description |

    |---|---||

    | Kernel Run-Time Parameters in /etc/sysctl.conf | log_martians | Activates logging
    of spoofed packets with impossible IP addresses |

    | | accept_redirects | Determines access to routing tables; deactivate to deny
    access to black-hat hackers |

    | | tcp_synccookies | Protects from the denial of service attack known as the
    SYN flood (SYN is an initial network transmission.) |

    | | icmp_ignore_bogus_error_responses | Protects from mangled ICMP (Internet Control
    Protocol) messages |

    | | icmp_echo_ignore_broadcasts | Stops replies to broadcasts as those from a
    ping -b command |'
