  md: '# 316 Appendix F: About the DVD


    The DVD included with this book comes with three compressed virtual machines.
    We suggest you have at least 80GB available on a physical 64-bit system for these
    VMs. While the VMs themselves require only 37GB, the remaining space allows you
    to set up RHEL 6 (or an equivalent operating system such as CentOS 6 or Scientific
    Linux 6), on the physical system. Detailed instructions are available in Chapter
    1. These VMs were built for the Kernel-based Virtual Machine (KVM) system included
    with RHEL 6.


    This book assumes you need a 64-bit system with hardware virtualization enabled.
    (Nested virtualization solutions such as VMware Workstation 8 and VMware ESX were
    not tested for this book.) This book also assumes that you use RHEL 6 or equivalent.
    For the purposes of this book, do not use Fedora, Ubuntu, or any other Linux distribution
    unless it is built from the source code as used for RHEL 6.


    You''ll find all of the labs on the first VM on the DVD. To access these labs,
    you have to uncompress the VMs and import them into KVM. Chapter 1 includes detailed
    instructions for this purpose. Once imported, you will be able to start that first
    VM, known as gamma.example.net, and find the labs (and sample exams) in the Desktop
    folder.


    To access the compressed files with the VMs, insert the DVD. Unless you''re running
    a GUI where automounting has been enabled, you will have to mount the DVD with
    a command such as the following:


    ```

    # mount /dev/cdrom /mnt

    ```


    You''ll find the three VMs on the DVD, in compressed format, in three files:


    ```

    gamma.tar.gz

    whitehat.tar.gz

    blackhat.tar.gz

    ```


    When decompressed per the instructions given in Chapter 1, you''ll find the associated
    files in the /var/lib/libvirt/images and /etc/libvirt/qemu directories. (Yes,
    the file in the /etc/libvirt/qemu directory is overwritten when you set up the
    VM as discussed in Chapter 1, but that record of how the VM was configured is
    still available in the compressed archive.)


    The VMs are built on Scientific Linux, which is based on the source code for RHEL
    6. Each of the VMs includes an mh.repo file, which points to a McGraw-Hill copy
    of a Scientific Linux 6.2 repository at www.mhprofessional.com/downloads/products/007180160X/vm/'
  merge: -1
  pgno: 351
- img_proc: true
  md: '# System Requirements


    As discussed in Chapter 1, the RHCSA exam includes KVM, which Red Hat supports
    on RHEL 6, only on 64-bit systems configured with hardware virtualization. As
    the rebuild distributions, Scientific Linux and CentOS are based on RHEL 6 source
    code; they also require installation on a physical 64-bit system to support KVM.


    # Technical Support


    For technical problems or questions, please visit www.mhprofessional.com or e-mail
    customer.service@mcgraw-hill.com. For customers outside the 50 United States,
    e-mail international_cs@mcgraw-hill.com.'
