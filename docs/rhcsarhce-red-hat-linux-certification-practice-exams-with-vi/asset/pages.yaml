  md: '# Chapter 2: Virtual Machines and Automated Installations


    If you followed the instructions in Chapter I, you should have a lab of three
    virtual machines (VMs) on a 64-bit system, based on KVM. Hardware-assisted virtualization
    should be enabled, as shown with either the svm or vmx flag in the /proc/cpuinfo
    file.


    In this and the remaining chapters of this book, you''ll first get a brief overview
    of each relevant objective from the RHCSA and RHCE exams. If you needed, you''ll
    be able to find a more in-depth explanation in the Study Guide. You''ll proceed
    directly to the fill-in-the-blank review questions, followed by the chapter labs.
    Just remember, you can find the chapter labs only on the gamma.example.net VM
    available from the DVD. Each lab is explained at the end of the relevant chapter.


    # Start and Stop Virtual Machines


    There are two basic steps associated with starting a VM. First, you need to connect
    to the hypervisor, and second, you start the VM. You can take these actions from
    the command line or from the GUI.


    # Starting and Stopping VMs from the Command Line


    From the command line, the following command starts the hypervisor and moves to
    the virsh # prompt:


    ```

    # virsh --connect qemu:///system

    ```


    The following command can then be used to start the noted system:


    ```

    virsh # start whitehat.example.net

    ```


    You can connect to the system remotely with a protocol such as SSH. Two command-line
    options are available to shut down the system. The first command shuts down the
    noted whitehat.example.net system gracefully; the second is functionally equivalent
    to a power shutdown:


    ```

    virsh # shutdown whitehat.example.net

    virsh # destroy whitehat.example.net

    ```


    Those of you who have followed RHEL 6 closely may realize that the shutdown option
    didn''t work when RHEL 6 was first released. To exit from the virsh # prompt,
    run the quit command.'
