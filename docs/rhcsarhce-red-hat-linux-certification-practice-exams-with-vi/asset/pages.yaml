    ENTER at any time accepts your changes.


    ```

    >crashkernel=auto rhgb crashkernel=quiet rd_NO_LVM rd_NO_DM 3

    ```


    Within Linux, you can "boot" into different runlevels with the help of the **init**
    or

    telinit commands. For example, if you''re in runlevel 3, the following command
    boots

    the system into runlevel 5, which is the default for the GUI.


    ```

    # init 5

    ```


    The standard runlevels, along with the default, are shown in comments in the

    /etc/initab file. While this is now deprecated file from the obsolete SysV, it''s

    still used to configure the default runlevel for RHEL 6. To confirm, run the

    **runlevel** command. Two numbers appear:


    3 5


    This output means the system has moved from runlevel 3 to runlevel 5. An N in
    the

    output means that the system is still at the boot runlevel.


    # Use Single-User Mode to Gain Access

    to a System


    This objective cites how you can access an RHEL 6 system without a user password.

    When successful, RHEL 6 automatically logs you into the root administrative

    account. You don''t even need the root password. However, that assumes GRUB isn''t

    also protected.


    The simplest way to boot in single-user mode is to access the GRUB menu. When

    y access the kernel command options just described, add a 1 or **single** to the
    end

    of line. Boot the system with that modified option, and you''ll soon see a prompt

    s as:


    ```

    [root@gamma ~]# #

    ```


    Once in single-user mode, you can set the root password to just

    whatever you want. Although blank passwords are not allowed, passwords with a

    single blank space are!


    As single-user mode supports password-free access with root administrative

    privileges, it''s important to protect the bootloader with a password.You may
    also

    want to protect the system from other boot media such as Live DVDs and USBs.


