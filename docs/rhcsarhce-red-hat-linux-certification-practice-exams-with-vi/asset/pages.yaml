  md: '# LAB ANSWERS


    # Lab I


    This is similar to the corresponding Lab 1 from the Study Guide. If you run the
    date command as suggested in the body of the lab, the files from the /home/testuser
    directory should be copied to the /backup directory a minute later.


    Although you could configure the script in the /etc/cron.hourly directory, that''s,
    by default, to one minute past the hour, per the /etc/cron.d/hourly script. You
    could also configure it in the /etc/cron.d directory using the following lines:


    ```

    SHELL=/bin/bash

    45 * * * root /bin/cp -ar /home/testuser /backup

    ```


    Other lines could work, as they copy the files from the /home/testuser directory.

    Given the importance of the system clock for Kerberos-based authentication, you
    should now restore the original image. If an NTP server has been configured for
    the network, you can do so with the ntpdate command.


    # Lab 2


    If you''ve followed the instructions in this lab, the /etc/sysctl.conf file should
    now have the following entry:


    ```

    net.ipv4.icmp_echo_ignore_broadcasts = 0

    ```


    This entry makes sure the new setting survives a reboot. You may have also set
    the associated file, /proc/sys/net/ipv4/icmp_echo_ignore_broadcasts, to 1, or
    run the sysctl -p command to implement the change before the system was rebooted.


    Of course, case can be confirmed with a ping -b 192.168.122.255 command, from
    both local and remote systems. Because broadcasts are ignored by default, the
    gamma.example.net system at IP address 192.168.122.20 should be the only system
    that responds. If you want to restore the original configuration, return to the
    gamma.example.net system, and then remove the net.ipv4.icmp_ignore_broadcasts
    option from the /etc/sysctl.conf file.


