  md: '# x RHCSA/RHCE Red Hat Linux Certification Practice Exams with Virtual Machines


    Red Hat says it''s important to have real-world experience to pass their exams,
    and they''re right! However, for the RHCSA and RHCE exams, they do focus on a
    specific set of Linux administrative skills, as depicted in the respective objectives.
    This book is intended to help you take advantage of the skills you already have—and
    more to the point, brush up in areas where you may have a bit less experience.


    Although a risky production practice, it is fastest to administer RHEL during
    the exam by logging in to the root user account. The command prompt and PATH assume
    use of that account. When logged in to the root account, you see a command line
    prompt similar to


    ```

    [root@gamma root] #

    ```


    As the length of this prompt would lead to a number of broken and wrapped code
    lines throughout this book, I normally abbreviated the root account prompt as


    ```

    #

    ```


    Be careful. The hash mark (#) is also used as a comment character in Linux scripts
    and programs; for example, here is an excerpt from /etc/inittab:


    # Default runlevel. The runlevels used are:


    When logged in as a regular user, you see a slightly different prompt; for user
    testester, it typically looks like the following:


    ```

    [testester@gamma testester] $

    ```


    In a similar fashion, I''ve abbreviated this as


    ```

    $

    ```


    There are a number of command lines and blocks of code interspersed throughout
    the chapters. Commands embedded within regular text, such as ls -l, are shown
    in bold. User entries, and some variables in regular text, are also shown in bold.
    Sometimes, commands exceed the available length of a line. Take this example:


    ```

    # virt-install -n other.example.org -r 768 --disk path=/var/lib/libvirt/images/other.example.org.img
    -l=ftp://192.168.122.1/pub/inst -x "ks=ftp://192.168.122.1/pub/ks1.cfg"

    ```


    Unless this command is carefully formatted, line breaks might appear in unfortunate
    places, such as between the two dashes in front of the --disk switch. One way
    to address this is with the backslash (\), which "escapes" the meaning of the
    carriage return that follows. (The backslash can also "escape" the meaning of
    a space, making'
