- img_proc: true
  md: '# RHCE Sample Exam 2 Discussion


    In this discussion, I describe one way to check your work to meet the requirements
    listed for this particular sample exam. Because there is no one way to set up
    a Red Enterprise Linux configuration, there is no one right answer for the listed
    requirements. But there are some general things to remember. You need to make
    sure your changes work after a reboot. For the RHCE, you need to make sure the
    services that you set up are active at the appropriate runlevels. For example,
    if you''re configuring Apache, it should be active for at least runlevels 3 and
    5.


    +   1. To avoid resounding the `ping -b` command, which broadcasts echo requests
    over IPv4, the icmp_echo_ignore_broadcasts must be active. You can set that up
    permanently in the `/etc/sysctl.conf` file with the name `ipv4.icmp_echo_ignore_broadcasts
    = 1`.


    +   2. As you should already know, the process required to create an RPM is somewhat-complex.
    Although Chapter 12 in this book summarizes the required steps, you may need to
    refer to Chapter 12 of the Study Guide for detailed information. Success in this
    step is most straightforward; copy the RPM that you''ve created to a new system.
    Install it, you''ll see the RHCE_practice_exam1.txt file in the `/opt/rhce` directory.


    +   3. This particular sample activity report requires just a slight change from
    the example shown in the `sadf` man page. As the report is required from the fifth
    of the month (yes, that report is preloaded onto the gamma system), the command
    is


    ```

    # sadf -d /var/log/sa/sa05 -n DEV > /home/testester/stat_net_05

    ```


    As noted in the man page for the `sadf` command, the double-dash prefixes options
    to the `sar` command.


    +   4. If you are successful, users terry and heinz, and others, will have access
    to the /home/steilers subdirectory. In the Apache httpd.conf file, there is a
    template for single home directories. It can be modified to accommodate a group
    of users.


    +   5. To expand the scope of the default caching-only DNS server, you need to
    revise the `/etc/named.conf` file. The `listen-on` port directive should include
    the IP address of the local network card, and the `allow-query` directive'
  merge: -1
  pgno: 346
- img_proc: true
  md: '# 312 Appendix E: RHCE Sample 2


    should include the network. Don''t forget to include the IP address of gamma (192.168.122.20)
    in the resolv.conf file for gamma and whitehat.


    +   6. When the share of the /home directory is mounted on whitehat, user tester
    on the remote system should be able to read the mounted share of the /home/tester
    directory. Of, to set up read-only access, you need the ro in the /etc/exports
    file on the gamma.example.net system in the entry for the shared /home directory.
    The root_squash option is the default, so you should not have to add the option
    to /etc/exports. It''s not harmful, however.


    +   7. Since the /download directory will be shared with all users, in guest mode,
    you need to make sure t set with 777 permissions. You also need to set the samba_share_t
    file type on the directory and in the file_contexts file. That''s over and above
    the standard directives that you need to include in the /etc/samba/smb.conf file.
    To test guest access, mount the share with the mount-ifs -o guest command.


    +   8. What do you do to configure a relay for a smart host depends on whether
    you use Postfix or sendmail. For Postfix, set it up with the relayhost directive
    in the main.cf file. For sendmail, set it up with the preconfigured commented
    SMART_HOST directive defined in sendmail.mc.


    +   9. The process for setting up a private/public keypair for SSH authentication
    is straightforward, as long as there are two matching accounts. The ssh-keygen
    command creates a private/public key to a target remote system. You should then
    be able to log into the remote system with the help of the passphrase. The only
    thing that gets transmitted, if the passphrase is satisfied, is the public key.


    +   10. The process of creating a secure virtual web site is almost as straightforward
    as creating a regular virtual web site. The template in the ssl.conf file may
    be a bit more confusing; just be sure to include the NameVirtualHost*:443 directive
    as separate <VirtualHost *:443> containers for each virtual host. Don''t forget
    to change SELinux contexts and on a permanent basis in the file_context in /etc/selinux/targeted/contexts/files
    directory. Bonus: If successful, you should have appropriate and unique listings
    for the SSLCertificate and SSLCertificateKey directives.


    +   11. On the gamma system, set up the ntp.conf file with a restrict directive
    that allows access from other systems on the network. On the whitehat system,'
  merge: -1
  pgno: 347
- img_proc: true
  md: 'set up the ntp.conf file to use the peer directive to point the gamma system.

    Don''t forget: communication is over UDP port 123.


    +   12. One way to set up access from the whitehat system, and only that system,
    is with appropriate special firewall rules. You need to open up UDP port 53 for
    for DNS, TCP port 2049 for NFSv4, UDP ports 137 and 138 along with TCP ports 139
    and 445 for Samba, TCP port 25 for Postfix or sendmail, TCP port 22 for SSH, TCP
    port 443 for HTTPS, and UDP port 123 for NTP. In several cases, you can limit
    access to the whitehat system using other methods.


    +   13. You may want to reboot the system once to make sure all of the noted changes-
    have been properly implemented. You can''t expect full credit, for example, if
    the DNS server isn''t running upon reboot.'
