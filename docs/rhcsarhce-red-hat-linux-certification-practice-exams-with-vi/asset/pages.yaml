    with the nfs_t file type |


    # Configure the Service to Start When the System Is Booted


    With as other services, you want target services to start in standard runlevels.
    The following command makes sure the Apache web server starts in runlevels 3 and
    5:


    ```

    # chconfig --level 35 httpd on

    ```


    Alternatively, the following command makes sure Apache starts in runlevels 2,
    3, 4, and 5:


    ```

    # chconfig httpd on

    ```


    # Configure the Service for Basic Operation


    This requirement is essentially identical to that for the RHCSA exam, to “configure
    a system to run a default HTTP server.". In some ways, basic operation is enabled
    by default. You can control Apache with either the httpd script in /etc/init.d
    directory or the apachectl command.


    You can confirm success with basic operation on the local system by running either
    of the following commands:


    ```

    # /etc/init.d/httpd status

    ```


    ```

    # apachectl status

    ```


    You can set up different web files, as long as those files associated with the
    web site are configured with the httpd_sys_content_t boolean. The same context
    can be applied to directories other than the default.'
