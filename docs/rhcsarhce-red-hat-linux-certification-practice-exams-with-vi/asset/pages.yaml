  md: '# Configure a System to Use an Existing LDAP Directory Service for User and
    Group Information


    Not every Linux administrator understands LDAP, the Lightweight Directory Access
    Protocol. And that''s acceptable, as network-based directory services require
    specialized knowledge. It''s consistent with the objectives for both RHCSA and
    RHCE certifications, as there is no current requirement in either exam to configure
    an LDAP server. (Of course, that is subject to change.)


    To configure a system as an LDAP client, you will need to configure three files:
    /etc/nsswitch.conf, /etc/pam_ldap.conf, and /etc/openldap/ldap.conf. As LDAP databases
    can include user and group information, you may need to make sure it is included
    with appropriate entries in the /etc/nsswitch.conf file, as such:


    ```

    password: files ldap

    shadow: files ldap

    group: files ldap

    ```


    If you configured the System Security Daemon (sssd) to start automatically during
    the boot process, substitute sss for LDAP.


    /etc/pam_ldap.conf file comes from the pam_ldap RPM, which you may need to install.
    (You also need the nss-pam-ldap package.) It helps ensure consistent password
    policies across a network. Pay attention to at least the host and base directives,
    as the LDAP server is probably located on a remote system, and the distinguished
    name may be something other than example.com.


    Four directives of interest in the /etc/openldap/ldap.conf file are: BASE, URI,
    HOST, and possibly, TLS_CACERTDIR, as they relate to the distinguished name, location
    of the LDAP server, hostname of the LDAP server, and the directory path to the
    appropriate certificate authorities,:


    ```

    URI://127.0.0.1

    HOST tester1.example.com

    BASE dc=example,dc=com

    TLS_CACERTDIR /etc/openldap/certs

    ```


    In most cases, it''s simpler to configure an LDAP client with the Authentication
    Configuration tool. You can access it with the system-config-authentication or
    the authconfig-tui command. Any changes you make with that tool are reflected
    in the noted configuration files.'
  merge: -1
