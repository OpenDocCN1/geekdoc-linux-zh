  md: '# Identify CPU/Memory Intensive Processes;Adjust Process Priority with renice,
    kill Processes 153


    For example, the following command creates a gzip tar archive from the PracExams/
    subdirectory, along with its contents:


    ```

    $ tar czvf PracExams.tar.gz PracExams/

    ```


    As most of you already know, to set up a bzip2 compressed archive, substitute
    a for the z. If you''re unpacking an archive, substitute an x (extract) for the
    c (create). If you''ve created an archive with absolute path names, you can unpack
    archive in the same way with the P switch.


    One weakness of the tar command is that it does not preserve SELinux line contexts
    or Access Control List (ACL) attributes. That''s the reason for the star command.
    Unfortunately, it includes a different set of switches. The following example
    saves the contents of the /home/tester directory with both SELinux and ACL features:


    ```

    # star -xattr -H=exustar -c -f=tester.star /home/tester

    ```


    You have to compress separately with the gzip or bzip2 commands. You can unpack
    the noted archive with the following command:


    ```

    # star -x -f=tester.star

    ```


    # Identify CPU/Memory Intensive Processes; Adjust Process Priority with renice,
    kill Processes


    The essence of this objective is contained within the ps, top, renice, kill, and
    killall commands. With those commands, you can identify running processes, which
    process is consuming the most resources, reprioritize process should have more
    resources, and stop processes that are ready to end.


    Although the ps command just lists processes associated with the current console,
    you can go further. The ps u command lists processes for the current user; the
    ps command includes these processes not associated with a terminal. The ps l includes
    the parent process identifier (PPID).


    The top command sets up a console browser that orders those processes in a sortable
    fashion, normally focused on CPU and RAM memory usage. The nice command allows
    you to start a process with a nonstandard priority; the renice command reprioritize
    a running process. The priorities seem reversed, as they range from -20 (highest)
    to +19 (lowest).'
  merge: -1
  pgno: 188
- img_proc: true
  md: '# 154 Chapter 9: RHCSA-Level System Administration Tasks


    When you identify a process that simply must be stopped, the kill command can
    help. It can be called indirectly from the top browser, or it can affect a process
    by PID. Some kill options restart, gracefully stop, or even halt a process uncleanly.
    There are servers that normally run several processes automatically. If you know
    the process name, you can use the killall command to stop all instances of that
    service.


    # Schedule Tasks Using cron


    The cron daemon is typically used by administrators to run scheduled tasks on
    a periodic basis. It works hand-in-hand with anacron service, for those systems
    that may be subject to power outages. As configured, it''s set up to search for
    jobs in several locations:


    +   - Administrative jobs in the /etc/cron.d directory

    - Hourly administrative jobs specified via /etc/cron.d/hourly in the /etc/cron.hourly
    directory

    - User-defined jobs in the /var/spool/cron directory

    - Administrative jobs defined via /etc/anacontab, in the /etc/cron.daily, /etc/cron.weekly,
    and the /etc/cron.monthly directories.


    Consider these files when creating scripts for your own cron jobs. Each of these
    jobs is scheduled based on the following format, as defined in Table 9-1.


    minute hour day of month day of week command


    | Table 9-1 | Field | Value |

    |---|---|---|

    | Columns in a cron Configuration File | minute | 0–59 |

    | | hour | Based on a 24-hour clock, for example, 23 = 11 P.M. |

    | | day of month | 1–31 |

    | | month | 1–12, or jan, feb, mar, etc. |

    | | day of week | 0–7, where 0 and 7 are both Sunday, or sun, mon, tue, etc. |

    | | command | The command to be executed, sometimes listed with the username to
    run the command'
