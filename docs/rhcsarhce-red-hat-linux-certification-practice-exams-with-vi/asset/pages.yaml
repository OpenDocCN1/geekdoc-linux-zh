- img_proc: true
  md: '# 176 Chapter II: System Services and SELinux


    This chapter includes several objectives that apply to most of the services associated
    with the RHCE. For different services, you need to know how to install the right
    packages. Once installed, you need to make sure the system starts with RHEL 6
    booted. You also need to know how to configure SELinux to support proper operation
    of the service. In addition, you will configure each service for basic operation.
    Of course, details are covered in different chapters of the Study Guide.


    This chapter also illustrates these options for the Secure Shell (SSH) service,
    along with key-based authentication and a catch-all objective: additional options
    described in documentation.


    # Install the Packages Needed to Provide the Service


    You can install the packages needed to provide a service in four basic ways:


    +   - Download the needed RPM packages, and install them with an appropriate rpm
    command. Given the number of "dependencies" associated with RPM packages, this
    process can sometimes be difficult.

    - Use the yum command to download and install desired packages and dependencies.
    If you know exactly which packages to install, this method can be the most efficient.

    - Use the yum groupinstall command to download and install mandatory and default
    packages from a target package group. You can identify the right package group(s)
    to install with the yum grouplist command. If needed, you can learn more about
    a package group; for example, the yum groupinfo "Web Server" command includes
    a description of the "Web Server" package group, along with mandatory, default,
    and optional packages.

    - Open the Add/Remove Packages tool. If you know what package groups to install,
    you can find it in the list of Package Collections revealed in Figure 11-1. Alternately,
    you could identify specific packages in different categories shown in the lower-left
    pane. Just realize that the yum commands can provide more information about each
    package and package group.'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# Configure the Service to Start When the System Is Booted


    FIGURE 1-1 Add/Remove Packages tool


    ![](img/ad9f3468206ad4765a06e762bd96b965_212_0.png)


    # # Configure the Service to Start When the System Is Booted


    When configuring a service, make sure the service is active after the system is
    rebooted. After all, if it isn''t running, how do you expect to get credit for
    your work?


    To end, run the **chkconfig --list** command. The output should include all services
    controlled by scripts in the /etc/init.d directory, including the action taken
    at each major runlevel. For example, the following line from the output suggests
    that the Network File System (NFS) service is currently set to stay off in all
    runlevels:


    ```

    nfs 0:off 1:off 2:off 3:off 4:off 5:off 6:off

    ```


    If you want to configure NFS to start in desired runlevels, you need to make sure
    these options are set to yes in the appropriate columns. As runlevels 0, 1, and
    6 are associated with halt, single-user mode, and reboot, services should stay
    off in those runlevels. You could set the service to start automatically in runlevels
    2 through 5 with the following command:


    ```

    # chkconfig nfs on

    ```'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# 178 Chapter II: System Services and SELinux


    Alternatively, you can run the following command to set the service to

    automatically only in runlevels 3 and 5:


    ```

    # chkconfig nfs --level 35 on

    ```


    You can confirm the result for just the NFS service with the chkconfig-list nfs

    command. If only runlevels 3 and 5 are activated, you should see the following
    output:


    ```

    nfs 0:off 1:off 2:off 3:on 5:on 6:off

    ```


    Of course otherwise noted, you should repeat the process for any and all

    services configured in this book or on a production system. Red Hat objectives

    should motivate you to set up such production-quality systems.


    # Configure SELinux to Support the Service


    Red Hat has made SELinux easier to handle. In general, when configuring a service

    for SELinux, you need to do two things:


    +   - Configure the file types associated with the service, normally the SELinux
    file

    types in directories being shared.


    +   - Activate SELinux booleans in the /selinux/booleans directory.


    Default file types are listed in the file_contexts file, in the /etc/selinux/targeted/

    contexts/files directory. In general, when sharing files from the nondault directory,

    make sure the contexts match those of the default. For example, the following

    command matches the file contents from the /var/www/html directory on the

    hypothetical/www/example.net directory:


    ```

    # chkcon -R --reference=/var/www/html /www/example.net

    ```


    The booleans in /selinux/booleans directory are often used to control the

    functionality of various services. For example, some Samba-related SELinux settings

    start with samba_. Most of these are almost self-explanatory; for example,

    the samba_enable_home_dirs controls the export of home directories over

    A Samba server. This option is disabled by default; to share home directories
    via

    samba, you need to enable this boolean.


    Some pages include detail for different SELinux booleans; one way to get a

    complete list of relevant pages is to use the following command:


    ```

    $ apropos _selinux

    ```'
  merge: -1
  pgno: 213
- img_proc: true
  md: 'In addition, the SELinux Administration tool, accessible from the GUI with
    a \system-config-selinux command, supports a view of booleans, easily grouped
    by service module, with a brief description of each boolean.


    You can also get a database of these descriptions, along with their current status,

    using the following command:


    ```

    # manageage boolean -1

    ```


    When searching through the database, be aware of the different names associated

    with certain services. For example, I run the following commands to identify all

    Samba-related bo:


    ```

    # manageage boolean -1 | grep samba

    # manageage boolean -1 | grep cifs

    ```


    # Configure Key-Based Authentication


    Key-based authentication is listed in the RHCE objectives as a part of the configuration

    of an SSH server. It''s based on a pair of keys—one private, one public. The private

    key is kept on the SSH server, with rw permissions limited to the owner. The private

    key is available for others. For the host, the private and public keys are stored
    in

    /etc/ssh directory. For users, the corresponding keys are stored in each user''s
    home

    directory in the .ssh/ subdirectory.


    When you first log into a remote system, log in with a username, using a

    command as the following:


    ```

    ssh tester@gamma.example.net

    ```


    The first time you make a connection between an SSH client and server, you''re

    prompted with the following message:


    The authenticity of host ''gamma.example.net (192.168.122.20)'' can''t be established.

    RSA key fingerprint is 81:09:03:9e:c4:91:28:25:7c:f7:12:56:1a:05bf.

    Are you sure to continue connecting (yes/no)?


    Once confirmed, the public RSA key of the remote SSH server from /etc/ssh

    directory is copied to the SSH client, appended to the known_hosts file in the
    .ssh/

    sub own of the user''s home directory. You''re then prompted for the

    password of the target user on the SSH server.'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# Chapter 11: System Services and SELinux


    When fully configured, key-based authentication supports secure connections without
    transmitting the password over any network. You can create a private/public user-based
    keypair with the ssh-keygen command, which prompts for a passphrase. By default,
    it creates a keypair with 2048 bits, which is much more secure than a standard
    password. You can find the private and public keys in the .ssh/ subdirectory of
    your home directory. By default, the keys are named id_rsa and id_rsa.pub.


    You can then send the public key to the remote SSH server. The following ssh-copy-id
    command sends it to the system gamma:


    ```

    $ ssh-copy-id -i .ssh/id_rsa.pub testuser@gamma.net

    ```


    You''ll find a copy of the local id_rsa.pub file appended to the end of the authorized_keys
    file on the SSH server, in the user''s ~/.ssh/ subdirectory. can connect to the
    SSH server as before, but now you''re prompted for the passphrase used to create
    the keypair.


    # Configure Additional Options Described in Documentation


    Although this objective is limited to the SSH service, it is still pretty open-ended.
    To prepare, you really do need to understand at least those options shown in the
    SSH server configuration file sshd_config in the /etc/ssh/ directory. This section
    covers a few of the major options; Chapter 10 suggested that you could set a different
    port number. The following directive sets up the SSH server on a nondefault port:


    Port 13579


    If there is more than one network card, you could use the following directive
    to limit access to the card on the noted IP address:


    ```

    ListenAddress 192.168.122.20

    ```


    While logins by the root user are enabled by default, you can prohibit them with
    the following directive:


    ```

    PermitRootLogin no

    ```


    To further promote user-based security, you could set up a list of users to allow
    in the configuration file, such as:


    ```

    AllowUsers donna nancy randy mike

    ```'
  merge: -1
  pgno: 215
- img_proc: true
  md: '# Certification Summary


    You can set specific users on dedicated systems with directives as such:

    AllowUsers donna@192.168.122.130


    Related SSH server directives support customized configuration of users and groups
    (AllowGroups, DenyUsers, DenyGroups).

    As noted earlier, public keys associated with passphrases are stored in the authorized_keys
    file in each user''s .ssh/ subdirectory. That''s associated with the following
    directive, which, of course, can be changed to hide the file with those passphrases:


    AuthorizedKeysFile .ssh/authorized_keys


    When configuring just about RHEL 6 service, you need to check appropriate SELinux
    settings the manage-l | grep ssh command includes SELLinux booleans that you need
    to activate:


    ```

    ssh_chroot_rw_homedirs (off,off) Allow ssh with chroot to read and write files
    in the user home directories

    ssh_sysadm_login (off,off) Allow ssh logins as sysadm:sysadm_t

    allow_ssh_keysign (off,off) allow host key based authentication

    fanced_can_ssh (off,off) Allow fanced domain to execute ssh.

    ```


    # CERTIFICATION SUMMARY


    The objectives covered in this chapter are general and specific. To install packages,
    you may need to use the rpm command on individual packages, the yum command to
    download and install one or more packages with dependencies, and the Add/Remove
    Software tool to manage packages from the GUI.

    Whatever you configure, you need to make sure a target service starts in appropriate
    runlevels the next time the system is booted. Part of the configuration process
    includes SELinux booleans and file contexts.

    This chapter also addresses the configuration of SSH as a server. With private
    and public keys, you can set up authenticated connections that don''t transmit
    passwords over a network. Additional options in the server configuration file,
    sshd_config, can regulate access by users, hosts, by the root user, and for forwarding
    GUI applications and more.'
  merge: -1
