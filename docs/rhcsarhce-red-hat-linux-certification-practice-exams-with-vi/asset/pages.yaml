    tool.


    # Create, Delete, and Modify Local Groups and Group Memberships


    People work in groups. In Linux, a group can be configured as an owner of

    a file. Users who are members of that group may be allowed to read, write, or
    execute

    that file. So administrators may need to create special groups, as well as modify

    groups to add or delete users. Of course, when the group has finished its tasks,
    you as

    an administrator may need to delete that group.


    The associated commands are groupadd, usermod, groupmod, and groupdel. Be

    aware, when you create a group, it takes the next available group ID number. If
    you

    to keep the same user and group ID numbers for new users, that would mess up

    things. To that end, the following command specifies a local group number typically

    out of range of standard group IDs:


    ```

    groupadd -g 4000000 special

    ```


    But no one is a member of that group, yet. To add members, you can add\usernames
    to the appropriate lines in /etc/group and /etc/gshadow. Alternatively, you

    specify users to add to a specific group; the following usermod command adds

    user testurer to group special:


    ```

    usermod -G special testuser

    ```


    Unfortunately, the usermod command is less flexible with respect to deleting

    secondary users from a specific group. It''s often easiest to delete those users
    directly'
