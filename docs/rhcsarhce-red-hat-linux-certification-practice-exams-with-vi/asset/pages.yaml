    # Configure System as an iSCSI Initiator that Persistently Mounts an iSCSI Target


    With an iSCSI (Internet Small Computer Systems Interface) initiator, you can set
    up RHEL 6 with network storage. You need the iscsi-initiator-utils package for
    that purpose. If you want to set up a target, you also need the scsi-target-utils
    package. If you forget the names of these packages, run the yum search scsi command.


    Although the objectives suggest you don''t need to set up an existing target to
    be an RHCE, it can help you verify that you know how to mount that existing target.
    To do so, take the following steps:


    +   1. Install the appropriate packages.

    2. Start the tgtd service with the /etc/init.d/tgtd start command.

    3. Create a /var/lib/tgtd/rhce directory; the /var/lib/tgtd directory already
    has default contexts.

    4. Create a 100MB image file in the new directory with the dd if=/dev/zero of=/var/lib/tgtd/rhce/iscside.img
    bs=1M count=100 command.

    5. Set appropriate SELinux contexts with the restorecon -R /var/lib/tgtd command.

    6. Add the following stanza to the /etc/tgt/targets.conf file; modify as needed
    for the date and system hostname.

    <target> ign.2012-05.net.example.gamma>

    backing-store /var/lib/tgtd/rhce/iscside.img

    write-cache off

    </target>

    7. Restart the tgtd service with the /etc/init.d/tgtd restart command.'
  merge: -1
