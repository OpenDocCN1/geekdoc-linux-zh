  md: '# ABOUT THE CONTRIBUTORS


    # Author


    Michael Jang (RHCE, LPIC-2, UCP, LCP, Linux+, MCP) is currently a full-time writer,
    specializing in operating systems and networks. His experience with computers
    goes back to the days of jumbled punch cards. He has written other books on Linux
    certification, including this book''s companion Study Guide, RHCSA™/ RHCE® Red
    Hat® Linux Certification Study Guide, Sixth Edition, and LPIC-1 in Depth, Mike
    Myers'' Linux+ Certification Passport, and Saif GNU/Linux Installation and Configuration
    Exam Cram. His other Linux books include Linux Annoyances for Geeks, Linux Patch
    Management, and Mastering Fedora Core Linux 5. He has also written or contributed
    to books on other operating systems, including Oracle Solaris 11 System Administration:
    The Complete Reference™, MCSE Guide to Microsoft Windows 98, and Mastering Windows
    XP Professional, Second Edition.


    # Technical Editor


    Elizabeth Zinkann is a logical Linux catalyst, a freelance editor, and an independent
    computer consultant. She was a contributing editor and review columnist for Sys
    Admin Magazine for ten years. As an editor, some of her projects have included
    RHCSA™/RHCE® Red Hat® Linux Certification Study Guide, Sixth Edition, Mastering
    Fedora Core Linux 5, LPIC-1 in Depth, Linux Patch Management, and Linux All-in-One
    Desk Reference for Dummies, Fourth Edition. In a former life, she also programmed
    communications communications features, including ISDN at AT&T Network Systems.'
