    be different.


    # Configure SELinux to Support the Service


    All of the services discussed in this chapter have their own SELinux file contexts.
    However, they''re largely irrelevant for our purposes. With the possible exception
    of DNS, none of the services include data files in any sort of specialized directories.

    Data files for DNS services apply to master and secondary name servers, which
    are explicitly excluded from the RHCE objectives.


    In general, the only service covered in this chapter that''s directly affected
    by SELinux booleans is DNS. The relevant boolean, `named_write_master_zones`,
    relates to the configuration of a master DNS server. For purposes of the RHCE,
    SELinux is not relevant to the services associated with this chapter.


    | 17-1 | Package | Description |

    |---|---||

    | Relevant RPM Packages | sysstat | Provides commands and file structure that
    logs system activity |

    | | syslog | Includes local and network logging configuration options |

    | | ntp | Adds the Network Time Protocol (NTP) service |

    | ntpdate | Includes a client that retrieves the current time from an NTP server
    |

    | bind | Adds packages required for a DNS server |

    | bind-utils | Includes commands for querying DNS servers |

    | bind-chroot | Adds secure subdirectories for isolating black-hat hackers who
    break into a DNS service |'
