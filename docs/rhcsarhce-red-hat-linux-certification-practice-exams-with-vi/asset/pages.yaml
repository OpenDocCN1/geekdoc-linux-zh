  md: '# 13

    Electronic Mail Servers


    # EXAM OBJECTIVES


    +   - Install the packages needed to provide the service

    - Configure SELinux to support the service

    - Configure the service to start when the system is booted

    - Configure the service for basic operation

    - Configure host-based and user-based security for the service

    - Configure a mail transfer agent (MTA) to accept inbound e-mail from other systems

    - Configure an MTA to forward (relay) e-mail through a smart host

    - Self Test'
  merge: -1
  pgno: 240
- img_proc: true
  md: 'This and all remaining chapters cover various services. Each service is associated
    with five common objectives, which I cover in minimal detail. Of course, the details
    vary by service. In each case, this addresses what you install, how you configure
    SELinux, what command you use that makes sure the service starts the next time
    the system is booted, as well as the service-specific host- and user-based security
    measures that you can take.


    The focus of this chapter is on the Simple Mail Transfer Protocol (SMTP), associated
    with the transmission of e-mail over a network. RHEL 6 supports two SMTP services:
    Postfix and sendmail. (Yes, the capitalization of sendmail is correct.) While
    sendmail was the default e-mail service through RHEL 5, Postfix is the default
    for RHEL 6. For the purposes of the RHCE, it doesn''t matter which service you
    configure, as it meets all requirements.


    When you make changes to the Postfix or sendmail configuration, make sure the
    appropriate files are processed. For Postfix, you need to apply the postmap command
    to files that have been changed and reload the service with the /etc/init.d/postfix
    reload command. For sendmail, you need to process the files in the /etc directory
    by running the script named make from that directory. For either service, if you''ve
    edited the /etc/aliases file, you also need to run the newaliases command.


    # Install the Packages Needed to Provide the Service


    The RPM required for the Postfix service (postfix) should already be included
    as part of even a minimal installation of RHEL 6. It''s used to report errors
    internally by those systems configured. It''s not accessible remotely, even when
    TCP port 25 is open. If necessary, you can install the RPM with the following
    command:


    ```

    # yum install postfix

    ```


    If you prefer sendmail, you can install it with the following command:


    ```

    # yum install sendmail sendmail-cf

    ```


    If you plan to change the actual configuration of sendmail, you need to install
    the sendmail-cf package as well. It supports the conversion of the sendmail macro
    file, sendmail.mc, to the actual sendmail configuration file, sendmail.cf.'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# Configure the Service to Start When the System Is Booted 207


    If you want to keep both services installed and switch between them, run the alternatives
    --config mta command. It brings up the following menu:


    | There are 2 programs which provide ''mta''. | Selection Command |


    +   - 1 /usr/sbin/sendmail.postfix

    - 2 /usr/sbin/sendmail


    Enter to keep the current selection[], or type selection number:


    # Configure SELinux to Support the Service


    For RHEL 6, three booleans are related to SELinux:


    +   - allow_postfix_local_write_mail_spool Allows access from Postfix to files
    in /var/spool/postfix directory. Active by default.


    +   - httpd_can_sendmail Supports e-mails from Apache modules through sendmail.
    Disabled by default to prevent spam attacks.


    +   - logging_syslogd_can_sendmail Enables e-mails from the system logging daemon
    (syslogd) through sendmail. Disabled by default.


    If you use a nonstandard directory for Postfix, change the contexts of the associated
    files and directories to match those shown in the /var/spool/postfix directory.


    # Configure the Service to Start

    When the System Is Booted


    In the even minimal installation of RHEL 6, Postfix is already configured to start
    during the boot process, something that you can confirm with the following command:


    ```

    # chkconfig --list postfix

    ```


    However, if you install the sendmail RPM, Postfix is part of the boot process.
    If you later uninstall the sendmail RPM, Postfix is automatically reset to start
    in runlevels 2, 3, 4, and 5.


    Of course, some other administrator (or perhaps someone who prepares an exam)
    could run the chkconfig postfix off command, which would keep Postfix from starting
    during the boot process.'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# Configure the Service for Basic Operation


    Postfix''s default configuration is already set up as an SMTP server. You can
    confirm the configuration from the local system with the following command:


    ```

    # telnet localhost 25

    ```


    On the main VM, it leads to the following output:


    ```

    220 gamma.example.net SMTP Postfix

    ```


    The default configuration works only for the local system; configuration for a
    network is the topic for one of the SMTP-specific objectives, described shortly.
    If you''re running sendmail instead, the same telnet command leads to the output:


    ```

    220 gamma.example.net SMTP Sendmail 8.14.4/8.14.4; Wed 18 Apr 2012 03:00:02 -0700

    ```


    Of course, the dates and version numbers vary.


    # Configure Host-Based and User-Based Security for the Service


    Host-based security is already configured for the default SMTP communications
    channel, TCP port 25. In other words, the default firewall blocks communications
    through that port. Of course, to allow access from a limited number of hosts,
    modify the firewall with the following entry in the /etc/sysconfig/iptables file:


    ```

    -A INPUT -m state --state NEW -m tcp -p tcp -s 192.168.122.0/24 --dport 25 -j
    ACCEPT

    ```


    If you use the Firewall Configuration tool, set up this line in your own file
    in the "Custom Rules" section, so it isn''t overwritten if you make changes with
    that tool.


    For Postfix, you can set user- and host-based security in the /etc/postfix/access
    file. The following sample entries show how you can set up Postfix to accept and
    reject access from users, IP address blocks, and domain names. Additional details
    are available in the default version of the file, which includes a commented version
    of the appropriate man page.'
  merge: -1
  pgno: 243
- img_proc: true
  md: '```

    michael@ REJECT

    192.168.122 OK

    blackhat.example.net REJECT

    ```


    In addition, you should modify a couple of directives in the main Postfix configuration
    file, /etc/postfix/main.cf. The following directives are suggestions based on
    the VMs configured for this book:


    ```

    hostname = gamma.example.net

    mydomain = example.net

    destination = $mydomain, $hostname, localhost.$mydomain, localhost

    mynetworks = 192.168.122.0/24, 127.0.0.0/8

    ```


    In addition, you can limit access to authorized usernames with the following directive:


    ```

    smtpd_sender_restrictions = permit_sasl_authenticated, reject

    ```


    For more information, see the README-Postfix-SASL-RedHat.txt file in the /usr/share/doc/postfix-2.6.directory.


    For sendmail, you can modify the /etc/mail/access file in a similar fashion to
    /etc/postfix/access. The default entries support access from the localhost system.
    To support access from a network, add an entry like the following:


    ```

    Connect:192.168.122 RELAY

    ```


    In addition, you want to comment out the following directive in the main sendmail
    macro configuration file, /etc/mail/sendmail.cf. Doing this also limits access
    to the localhost system:


    ```

    dnl DAEMON_OPTIONS("Port=smtp,Addr=127.0.0.1,Name=MTA") dnl

    ```


    If you''ve installed sendmail, you can also use the TCP Wrappers files to configure
    user-and host-based security, as discussed in Chapter 10 of the Study Guide.


    # Configure a Mail Transfer Agent (MTA) to Accept Inbound E-mail from Other Systems


    For the most part, this section summarizes steps described earlier, with the focus
    on what you would do to configure Postfix or sendmail to accept inbound e-mail
    from other systems, meaning systems other than the localhost.'
  merge: -1
  pgno: 244
- img_proc: true
  md: 'In both cases, you need to make sure to open TCP port 25 in any existing local
    firewall before each service can accept inbound e-mail from other systems.

    Postfix is already configured for basic operation for the local system. To set
    it up to accept inbound e-mail from other systems, you also need to take the following
    steps.


    +   1. Make sure Postfix (and not sendmail) is running.

    2. Include the IP address(es)/address block(s) of desired systems in the /etc/postfix/access
    file, in the format specified in the associated manual.

    3. Edit the /etc/postfix/main.cf file, and edit the myhostname, mydomain, inet_interfaces,
    and myynetworks directives.


    Also noted earlier is sendmail is already configured for basic operation when
    installed. To set up alternative service to accept inbound e-mail, you should
    take the following steps:


    +   1. Make sure sendmail (and not Postfix) is running.

    2. Include the IP address(es)/address block(s) of desired systems in the /etc/mail/access
    file, in the same format as shown for the localhost system.

    3. Edit the /etc/mail/sendmail.mc file, and comment out the DAEMON_OPTIONS(''Port=Addr=127.0.0.1,
    Name=MTA'')dnl directive.

    4. Once the desired changes are made, execute the /etc/mail/make script to process
    all files in the /etc/mail/ directory. Doing this processes changes from sendmail.mc
    into the actual sendmail configuration file, along with any other files that you
    changed in the /etc/mail/ directory.


    # # Configure an MTA to Forward (Relay) E-mail Through a Smart Host


    A "smart host" MTA can forward e-mail to other e-mail services. If you want to
    rely on e-mail services configured by someone else such as an ISP, you''ll want
    to configure the local MTA as a smart host.

    To set up a smart host on a Postfix server, include a forwarding address in the
    main.cf file in the /etc/postfix/ directory. You can set up that address with
    the relayhost directive. Substitute accordingly for the external.example.com system:


    ```

    relayhost = external.example.com

    ```'
  merge: -1
  pgno: 245
- img_proc: true
  md: 'In addition, you want to make sure that all e-mail sent to users on the local
    system is properly forwarded through the /etc/aliases file. For example, the following
    line would forward administrative e-mails to a regular user on the example.net
    network:


    ```

    root:      michael@example.net

    ```


    The /etc/aliases file is used by both Postfix and sendmail. Don''t forget to apply
    the newialases command to process the file into a database by either service.
    To configure a sendmail smart host, modify the following directive in the sendmail.mc
    file from the /etc/mail directory:


    ```

    define(`SMART_HOST`, `smtp.your.provider`) dnl

    ```


    For the same external.example.com remote MTA, change the line to:


    ```

    define(`SMART_HOST`, `external.example.com`) dnl

    ```


    # CERTIFICATION SUMMARY


    Red Hat supports sendmail on RHEL 6. When installed, it supersedes Postfix. You
    can configure it through a macro configuration file, sendmail.mc, in the /etc/mail
    directory. As with Postfix, it''s already configured for basic operation for the
    local system. You can comment out one directive in sendmail.mc to open it up to
    other systems. To set it up as a smart host relay, you can define the SMART_HOST
    directive in that same macro file.'
  merge: -1
  pgno: 246
