  md: 'List, Create, Delete, and Set Partition Type for Primary, Extended, and Logical
    Partitions


    # Add New Partitions, Logical Volumes, and Swap to a System Non-Destructively


    Since this objective is associated with adding space to a system non-destructively,
    it''s fair to assume you need to know how to configure space on storage media
    that is unallocated and unpartitioned. Creating partitions is a straightforward
    process.

    Logical volumes can be built from partitions, as described later in this chapter.
    Swap space can be configured from either a partition or a logical volume. In other
    words, to learn this objective, you need to know how to


    +   - Run a utility such as fdisk, parted, or the GUI Disk Utility to create a
    partition from empty space.

    - Configure partitions appropriately for logical volumes and swap space.

    - Set up physical volumes, volume groups, and logical volumes from existing empty
    partitions.


    Users of GParted may be disappointed, as it is not included with RHEL 6. But in
    my opinion, the Disk Utility available with the palimpsest command is at least
    as good. Other objectives address what you need to do to change partition types,
    to set up logical volumes, to configure swap space, to format partitions and volumes,
    and finally, to set them up to boot automatically.


    # List, Create, Delete, and Set Partition Type for Primary, Extended, and Logical
    Partitions


    The objective listed in the title is a mouthful. But it makes sense. Before any
    changes, you should know what partitions have already been configured. To list
    currently configured partitions, you could run either of the following commands.
    To be sure to do so as the administrative user, as regular users don''t have such
    privileges.


    ```

    # fdisk -l

    # parted -l

    ```


    To create a partition, you need access with fdisk, parted, or the GUI Disk Utility,
    as the root administrative user. You can configure up to four primary partitions
    on'
  merge: -1
  pgno: 146
- img_proc: true
  md: '# 112 Chapter 6: Linux Filesystem Administration


    most storage devices. One primary partition can be reallocated as an extended
    partition. That extended partition can then be subdivided into logical partitions.
    The same tools that allow you to create a partition also allow you to delete partitions.
    Just protect and back up any important data before deleting any partition.


    > Be careful with parted and the GUI Disk Utility. Any changes made with these
    tools are immediately written to disk.


    # Create and Remove Physical Volumes, Assign Physical Volumes to Volume Groups,
    and Create and Delete Logical Volumes


    This objective lists the sequence associated with the configuration of a logical
    volume. Briefly, to create a logical volume, you take the general steps:


    +   1. Create a partition; make sure the LVM partition type is set.

    2. Initialize that partition for use by a volume group with the pvcreate command.
    That command creates a physical volume (PV).

    3. Assign one or more PVs to a volume group (VG) with the vgcreate command.

    4. Create a logical volume with the lvcreate command. You can create it from available
    space in the VG, based on a size with the -L switch.


    Of course, the objective suggests you should also know how to reverse the process.
    To delete an LV, you can use the lvremove command.


    Before you can remove a PV, you need to unassign it from an existing VG. One way
    to do so is with the vgreduce command. You can then remove the PV with the pvmremove
    command. That partition is then available for other purposes.


    You can also use the GUI Logical Volume Management tool, available from the System
    Administration menu (or the system-config-lvm command). It''s an excellent tool
    that supports the functionality of each of these commands.'
  merge: -1
  pgno: 147
- img_proc: true
  md: '# Extend Existing Unencrypted ext4-formatted Logical Volumes


    Sometimes, you''ve just got to increase the space available to an LV. If you''re
    working with a production system, it''s important to back up things first. Life
    is simpler, however, if the data isn''t that important. In that case, you take
    the following general steps to extend an LV:


    +   1. Unmount the current file system. If the file system is mounted on /abc,
    run the following command:


    # ummount /abc


    2. Run the vgs command. If sufficient space is available in the VG, skip to step
    6.

    3. Create a vgs partition, and set it to the LVM partition type.

    4. Set up the PV with the pvcreate command.

    5. Use the vgxtend command to include the new PV in the VG.

    6. Use the lveend -L command to extend the LV to the amount of space required.
    The following example extends the LV on the noted device to 3GB (You can substitute
    /dev/mapper/vg_00-lv_00 if desired.)


    # lveend -L 3000M /dev/vg_00/lv_00


    7. Now you can resize the formatted volume. To resize the format to match the
    new size of the LV on this particular device, run the following command:


    # resize2fs /dev/vg_00/lv_00


    8. You may be prompted to check the file system with the e2fsck command. In this
    case, first run the e2fsck -f /dev/vg_00/lv_00 command to force a filesystem check.

    9. Finally, you can remount the filesystem device on the original directory (/abc)
    that you unmounted in step 1.'
  merge: -1
  pgno: 148
- img_proc: true
  md: '# Create, Mount, and Use ext2, ext3, and ext4 File Systems


    As suggested by the title, this objective requires three basic steps. To create
    a file system, you need to format it. To make a file system useful, you need to
    mount it. Once mounted, you should be able to use normal commands to read from
    and write to that file system.


    There''s one basic command associated with creating a file system: mkfs. Variations
    on this command support the creation of the ext2, ext3, and other file systems.
    RHEL 6 supports the use of the mkfs.ext2, mkfs.ext3, and mkfs.ext4 commands for
    that purpose. Alternatively, the mkfs -t ext4 works just as well for the default
    ext4 file system. For example, if you''ve just created a /dev/sda9 partition,
    you can create an ext4 file system on that partition with the following command:


    ```

    # mkfs -t ext4 /dev/sda9

    ```


    You can then mount a file system with the mount command. You can mount that freshly
    formatted file system on a hypothetical/shared directory as follows:


    ```

    # mount /dev/sda9 /shared

    ```


    While technically you''re supposed to specify the filesystem format with the mount
    -t ext4 file system is the default for RHEL 6. You can mount it with other options;
    for example, the following command mounts the noted file system in read-only mode:


    ```

    # mount -o ro /dev/sda9 /shared

    ```


    Once mounted in a directory, you should be able to use the formatted file system
    in the same way as you use any other directory.


    An implicit part of this objective is the preparation of additional swap space.
    As an example, if you''ve configured a partition or LV for swap space, the mkswap
    command formats and the swapon command activates the space. Of course, you should
    remember to configure all of these systems in /etc/fstab to ensure they''re after
    reboot.'
  merge: -1
  pgno: 149
- img_proc: true
  md: '# Mount and Unmount CIFS and NFS Network File Systems


    Before you can mount a shared CIFS (Common Internet File System) or an NFS (Network
    File System), it actually has to be shared. The configuration of these services
    are an RHCE skill discussed in Chapters 15 and 16 of the Study Guide. If you share
    a directory using one of these services, you need to make sure the appropriate
    ports are open in any existing firewall. That process has been simplified in the
    Firewall Configuration tool, as the Trusted Services section supports “one-click”
    configuration of appropriate ports for each service.


    Before you mount a CIFS or NFS directory, you need to know what’s being shared.
    The following commands list shared directories from the noted system:


    ```

    $ smbclient -L gamma.example.net

    $ showmount -e gamma.example.net

    ```


    Once an appropriate directory is shared, you can connect to it from a remote location
    with a mount command. The following commands mount a /test directory shared via
    CIFS and NFS from the noted remote system:


    ```

    # mount -t cifs //gamma.example.net/test -mnt -o

    username=testester

    # mount -t nfs gamma.example.net:/test /net

    ```


    The CIFS share assumes that tester has an account on the gamma.example.net system
    and has been included in the CIFS user database. The associated command prompts
    for a password.


    The unmount command works on CIFSs and NFSs too. If the unmount command doesn’t
    work, the -l switch can sometimes help.


    # Configure Systems to Mount File Systems at Boot by Universally Unique ID (UUID)
    or Label


    To mount a file system during the boot process, you should make sure it’s configured
    in the /etc/fstab file. The simplest mount is by device; for example, the following
    line in /etc/fstab is one way to set up the top-root directory (/) in that file:


    ```

    /dev/vda2      ext4      defaults      1 1

    ```'
  merge: -1
