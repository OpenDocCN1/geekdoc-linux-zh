    # Locate and Interpret System Log Files


    The RHCSA objective is associated with local logs, as configured with the rsyslog
    daemon. There are corresponding objectives for the RHCE exam that address system
    log files transmitted and received over a network.

    nFor all logs, you need to understand the basic logging facilities (authpriv,
    cron, kernel, mail, news, user, and uctp), and their associated services. Logging
    data from each facility may be collected from one or more priorities (in ascending
    order): debug, info, notice, warn, err, crit, alert, emerg.

    Although standard system logs are stored in the /var/log directory, each service
    can be configured to control its log files. You should at least understand the
    functionality of each log file. A few significant log files and directories are
    described in Table 9-2.


    | TABLE 9-2 | Log Files | Description |

    |---|---||

    | Standard Red Hat Log Files | audit/ | Includes the audit.log file, associated
    with SELinux |

    | boot.log | Associated with services that start and shut down processes |

    | btmp | Lists failed login attempts; readable with the utmpdump btmp command
    |

    | cron | Collects information from scripts run by the cron daemon |

    | dmesg | Includes basic boot messages |

    | maillog | Collects log messages related to e-mail servers |

    | messages | Includes messages from other services as defined in /etc/syslog.conf
    |

    | rpm | Current list of installed RPM packages |

    | secure | Lists login and access messages |

    | setroubleshoot/ | Directory of messages associated with the SELinux troubleshooting
    tool |

    | spooler | Shows a log file that might include critical messages |

    | Xorg.0.log | Notes setup messages for the X Window System; may include configuration
    problems |

    | yum.log | Specifies packages installed, updated, and erased with yum |'
