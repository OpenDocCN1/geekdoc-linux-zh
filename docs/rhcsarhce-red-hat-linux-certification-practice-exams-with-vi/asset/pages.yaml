  md: '# Introduction xxvii


    Before signing up, read current Red Hat policies, available at www.redhat.com/training/policy/.
    Be aware: Red Hat has sometimes canceled exams for low attendance. In a limited
    number of locations, Red Hat supports "Individual Exam Sessions" on a more flexible
    schedule. For more information, see www.redhat.com/training/certifications/exam-kiosk.html.


    # Final Preparations


    The Red Hat exams are grueling. Once you have the skills, the most important thing
    that you can take to the exam is a clear head. If you''re tired or frantic, you
    may miss the easy solutions that are often available. Get the sleep you need before
    the exam. Eat a good breakfast. Bring snacks that can keep your mind in top condition.
    The RHCSA exam is two-and-a-half hours long. In many cases, Red Hat makes it possible
    for candidates to take both exams in the same day. Although a terrific convenience
    for those who have to travel to Red Hat exam facilities (in over 40 cities in
    North America), taking the two exams in the same day is like running two world-class
    marathons.


    # RHCSA and RHCE Exam Readiness Checklists


    The following Exam Readiness Checklists list each official objective on the RHCSA
    and RHCE exams, and specify the corresponding chapters where the objectives are
    covered. The checklists in this book differ from Exam Readiness Checklists in
    the Study Guide in two respects. First, the section titles in each chapter of
    this book match the wording of each official exam objective as closely as possible,
    as opposed to the Study Guide where the section titles in each chapter are unique
    to that book alone. Second, the following checklists reflect some minor changes
    made to the Red Hat objectives since the Study Guide was released. (For example,
    NTP is now solely covered in the RHCE exam.)


