  md: '# Chapter I: Prepare for Red Hat Hands-on Certifications


    The format of this book and chapter is different from other Practice Exams in
    the McGraw-Hill series. Each chapter will include a brief overview of several
    different objectives on the Red Hat Certified System Administrator (RHCSA) and
    Red Hat Certified Engineer (RHCE) exams. This chapter starts with a description
    of the exams. It continues with an overview of the 64-bit hardware required to
    set up the virtual machine (VM) covered by the RHCSA exam. It also includes instructions
    for how to load the preconfigured VMs compressed on the DVD.


    The Red Hat exams are an advanced challenge. While this book provides labs and
    sample tests to help you prepare for the RHCSA and RHCE exams, it provides minimal
    explanation of exam objectives. If you wanted additional information, I encourage
    you to start with the RHCSA/RHCE Red Hat Linux Study Guide (Exams EX200 & EX300),
    6th Edition. In addition, Red Hat offers several courses to help prepare for these
    exams, as described in the front matter.


    To prepare for the Red Hat exams, you need a 64-bit system that can support hardware-based
    virtualization. The objectives for the Red Hat exams specify virtualization. Red
    Hat''s default virtual machine (VM) solution is the Kernel-based Virtual Machine
    (KVM). Red Hat offers KVM software that can host VMs only on its 64-bit releases.
    (As options that support "nested" virtualization are free, they have not been
