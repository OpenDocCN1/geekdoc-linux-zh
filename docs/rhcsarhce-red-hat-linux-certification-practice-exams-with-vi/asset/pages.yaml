    # Lab 2


    This lab is just tricky. If you run the yum groupinstall "Backup Server" command,
    install just one of the packages in that group. You need to install the other
    packages in group individually. One way to identify the packages in that group
    is to use the yum groupinfo "Backup Server" command.


    # Lab 3


    Given the standard configuration of yum-related packages, all you need to do is
    add three lines to a file in the /etc/yum.repos.d directory. You can give any
    legal name to that file, as long as it has a .repo extension. Assuming you''ve
