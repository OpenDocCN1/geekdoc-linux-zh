    looks, as you''ll need to make sure that partition is not indexed in /etc/fstab.
    The rest of the process should be straightforward, as you can create physical
    volumes with the pvcreate command, set up a volume group from that space with
    the vgcreate command, and specify a logical volume of 200MB with the lvcreate
    -L 200M command. To identify the UUID, run the dump2fs command on the device file
    for the logical volume. You can then use the UUID during process (Did you remember
    to create the /vol directory, didn''t you?)


