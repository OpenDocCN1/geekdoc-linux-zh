    # Virtual and Physical Systems


    It''s possible to install a substantial number of VMs on a single physical system.
    If those systems are dedicated to different services, they load the physical system
    at different times. Such loads make it possible to "overbook" the RAM and other
    resources of the physical system.


    For our purposes, there is no real difference whether the installation is performed
    on a physical or a virtual system. The software functions in essentially the same
    way. As long as IP forwarding is enabled on the physical host system, networking
    on the virtual systems works in the same way as well. To make sure, open the /etc/sysctl.conf
    file, and make sure the following option is active, by setting it to 1. Most guests
    should already know that 1 is synonymous for "on" for boolean directives such
    as net.ipv4.ip_forward.


    ```

    # Controls IP packet forwarding

    net.ipv4.ip_forward = 1

    ```


    This directive makes sure IP forwarding is implemented the next time the system
    is booted, in the following directory: /proc/sys/net/ipv4/ip_forward. The corresponding
    directive for IPv6 networking is net.ipv6.conf.all.forwarding. One way to implement
    these changes without a reboot is with the following command:


    ```

    # echo "1" > /proc/sys/net/ipv4/ip_forward

    ```


    Unless IP forwarding is configured on the physical host system, the VMs are unable
    to access outside networks.


    In addition, you''ll need to set up the virtual network adapter as a trusted interface
    in the firewall. You''ll do so shortly, after installing KVM.


    # Installation Options


    Even beginning Linux users can install RHEL 6 from a CD/DVD. While this section
    addresses some of the options associated with installation, it is focused on the
    creation of that baseline system that can be used to set up other custom RHEL
    6 systems, including the installation of KVM.


    The steps described in this section assume installation on a physical system from
    a DVD, and that you know how to boot from that media. In addition, these'
  merge: -1
  pgno: 49
- img_proc: true
  md: 'steps assume that you understand the basics of Linux device files, at least
    as they relate to partitions. For example, you should already know that the /dev/sda1
    represents the first partition on the first regular drive on a system.


    The steps described in this chapter are modestly different if you are installing
    RHEL 6 over a network from an FTP or HTTP server. The steps associated with a
    network installation, as well as an explanation of Linux device files for partitions,
    are described in the Study Guide.


    As the VMs depicted in Figure 1-1 are already available on the DVD, this book
    does not describe the installation process within a KVM-based VM. However, there
    will be a lab on the topic in Chapter 2.


    # Boot Media


    When installing RHEL 6, the simplest option is to boot it from the RHEL 6 DVD.
    Rebuild distributions such as CentOS and Scientific Linux include extra packages
    and, therefore, supply two DVDs. As RHEL does not offer a live media option at
    the time, you should ignore the corresponding live media options (Live CD, DVD,
    or USB) available for rebuild distributions. Other options such as network boot
    support installation over a network from an FTP or HTTP server.


    # Booting the RHEL 6 Installation


    You can boot a target system from the installation DVD. After a few files are
    opened and decompressed, an RHEL installation screen should appear with at least
    the following options:


    +   - Install or upgrade an existing system

    - Install system with basic video driver

    - Rescue installed system

    - Boot from local drive


    The first option should work for most users. If there is trouble with the graphics
    after the first option, rebooting the system and work with the second option,
    which specifies a standard Video Electronics Standard Association (VESA) adapter
    associated with older Super Video Graphics Association (SVGA) monitors.


    For simplicity, I''ll focus on a graphical installation on a physical host system.
    To start that installation, select the Install Or Upgrade An Existing System option.'
