- img_proc: true
  md: 'Of course, the objective UUIDs or labels. A UUID is what you see by default
    in RHEL 6. It may appear similar to the following:


    ```

    UUID=c55e95e0-bc00-4e40-8a9b-97e5d34e3d09 / ext4 defaults 1 1

    ```


    If you just formatted a new file system, the dump2fs command can help identify
    the UUID for the associated device. The following command isolates the UUID for
    the noted /dev/vda2 device:


    ```

    dump2fs /dev/vda2 | grep UUID

    ```


    The "label" included in the objective refers to the way /etc/fstab was normally
    configured for RHEL 5. You can set up labels for RHEL 6 with the help of the e2label
    command. The following command sets up a label for the /dev/vda2 partition:


    ```

    e2label /dev/vda2 /top

    ```


    You can then noted the entry in /etc/fstab to


    ```

    LABEL=/top ext4 defaults 1 1

    ```


    It doesn''t matter if the /top directory actually exists, as it''s just a label.


    # Create and Configure LUKS-encrypted Partitions and Logical Volumes to Prompt
    for Password and Mount a Decrypted File System at Boot


    Black-hat hackers have been known to steal or copy computer storage devices. The
    Linux Unified Key Setup (LUKS) is a disk encryption specification that can help
    protect the data on such devices. When configuring a partition or LV for LUKS,
    be prepared with a passphrase. While it''s easiest to install a LUKS-encrypted
    partition/LV during the installation process, you may not get that opportunity
    during an exam.


    The first step is to load the dm_crypt and dm_mod modules. One way to do so is
    with the modprobe dm_crypt command. If successful, you should see the following
    modules in the output to the lsmod | grep dm_command:


    ```

    dm_crypt 13022 0

    dm_mod 81500 3 dm_crypt,dm_mirror,dm_log

    ```'
