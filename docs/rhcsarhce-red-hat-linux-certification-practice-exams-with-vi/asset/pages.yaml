  md: '# 138 Chapter 8: User Administration


    As suggested by the title, this chapter is focused on the administration of users
    and groups. The objective associated with multiuser logins is tangentially related
    to user configuration. If you''ve mastered the objectives associated with this
    chapter, you understand how to manage users and passwords. You know how to set
    up specialized groups, along with dedicated directories configured for collaboration.
    Finally, you know how to configure a client to refer to a remote LDAP service
    for user and group information.


    Although the focus here is on the command line, you can perform most of these
    tasks with the GUI User Manager tool. One way to start the tool from a command
    line in the GUI is with the system-config-users command.


    # Log In and Switch Users in Multiuser Runlevels


    This objective should be straightforward even for users with a few days of Linux
    experience at the command line. First, there are four standard runlevels associated
    with logins of multiple users: 2, 3, 4, and 5. If a GUI login manager (and GUI
    desktop) is installed, user/password logins are straightforward for any computer
    user. These logins are associated with runlevel 5. By default, these logins are
    associated with the first virtual terminal. In general, you can access different
    virtual terminals with the CTRL+ALT+Fn key, where n is a number between 1 and
    6. The CTRL key is not required if you''re already in a console login screen,
    with a prompt similar to what''s shown:


    Scientific Linux release 6.2 (Carbon)

    Kernel 2.6.32-220.el16.x86_64 on an x86_64


    gamma login:


    You can log in on this screen, just as you would log into the GUI with a configured
    username and password.


    To switch users in the GNOME desktop, click System | Log Out user. In the window
    that appears, click Switch User. You''re taken to the original GUI login manager.
    Despite what you just clicked, you see that the current user is still logged in.
    In any jobs currently being run by that user continue.


    To switch users at the command line, switch to a different console. You see another
    login screen for the second user. The first user is still logged in.'
