  md: '# Chapter 16: More File-Sharing Services


    While other services are required to support NFS, the /etc/init.d/nfs script includes
    commands that start those other services.


    # Configure the Service for Basic Operation


    For NFS, if the appropriate services are running, you all have to do is configure
    a shared directory in the /etc/exports file and export the share. The default
    /etc/ exports is blank; options are simple. For example, the following line shares
    the /test directory as read-only on all systems:


    ```

    /test *(ro)

    ```


    You can then run either the /etc/init.d/nfs reload or exportfs -r commands to
    implement the share. Of course, you need to set up the firewall and appropriate
    access restrictions, but those are subjects for other objectives.

    Be careful, as an extra space, after a comma, could invalidate some or all of
    the settings in a line in the /etc/exports files.

    For vsFTP service, the process is simpler, as the default configuration already
    works for basic operation. Anonymous-only users can log in and download files
    from the /var/ftp/pub directory. Be careful though. If you copy files to the /var/ftp/pub
    directory, those files might overwrite the root ownership and SELinux contexts
    of the directory. Unless those contexts are also set to public_content_t (or public_content_rw_t),
    that could even prevent FTP clients from reading the contents of the directory.


    Nevertheless, the "user-based" security objective also applies to vsFTP. The default
    options within the /etc/vsftpd/vsftpd.conf support authenticated access to user
    home directories.


    # Configure Host-Based and User-Based Security for the Service


    For NFS, user-based security is based on a common set of users and groups on servers
    and clients. You can set this up with a little care in the files of the Shadow
    Password Suite, with the help of the LDAP (Lightweight Directory Access Protocol)
    server,


    ![](img/ad9f3468206ad4765a06e762bd96b965_291_0.png)'
  merge: -1
  pgno: 291
- img_proc: true
  md: '# Configure Anonymous-Only Download for an FTP Server 257


    with is beyond the scope of either certification. The Shadow Password Suite and
    LDAP clients are covered in Chapter 8 of the Study Guide.


    For host-based security, if you stick with NFS version 4, host-based security
    is relatively easy to configure. You can do so in the /etc/exports file; for example,
    the following line would limit the ability to mount the /test directory share
    to systems on the 192.168.122.0 network:


    ```

    /test 192.168.122.0/24 (ro)

    ```


    Just be careful; if you have a space between the IP address and the (ro), access
    would be allowed to all hosts. If you prefer configuring host-based NFS security,
    activate the following directives in the /etc/sysconfig/nfs file:


    ```

    MOUNT_NFS_V2="no"

    MOUNT_NFS_V3="no"

    RPCNFDSARGS="-N 2 -N 3"

    ```


    You can then regulate access for NFSv4 over TCP port 2049.


    For the vsftp service, you can set up user-based security in the ftpusers file
    in the /etc/vsftpd directory. With the help of settings in /etc/pam.d/vsftpd,
    the ftpusers file includes all users who aren''t allowed to access the service.


    For vsftp, you can set up host-based security fairly easily with the help of iptables-based
    firewalls, as communication proceeds over TCP port 21. As the /usr/sbin/vsftpd
    daemon also uses TCP Wrappers libraries, you can also set up security with the
    help of the /etc/hosts.allow and /etc/hosts.deny files.


    # Configure Anonymous-Only Download for an FTP Server


    This objective is actually a bit more complex than it sounds. Anonymous downloads
    are enabled in the default vsftpd.conf file, courtesy of the following directive:


    ```

    anonymous_enable = yes

    ```


    Although anonymous downloads are enabled in the default configuration of vsFTP,
    access by regular users is also allowed. To disable access for regular users,
    delete the following directive from the vsftpd.conf file:


    ```

    local_enable = yes

    ```'
