  md: '# Lab Answers 127


    Now you can format system /dev/sda. If you''re paying attention, note that the
    requirement is to format the ext3 file system. One way to do this is with the
    following command:


    To set it up on a permanent basis, add a line like the following to /etc/fstab:


    ```

    /dev/sda /dir2 ext3 defaults 1 2

    ```


    # Lab 5


    To create a label for the LV (or any volume), use the e2label command. It doesn''t
    matter whether you use the /dev/mapper/vg1-lv1 or /dev/vg1/lv1 devices, as they''re
    both soft-linked to the same file. I run the following command:


    ```

    # e2label /dev/mapper/vg1-lv1 logvol

    ```


    and then confirm with the e2label /dev/vg1/lv1 command. I then set it up in /etc/fstab:


    ```

    UUID=logvol /dir1 ext4 defaults 1 2

    ```


    Next, if the UUID of the /dev/sda partition has been formatted to the ext3 file
    system. I could do this with the blkid or the dumppefs /dev/sda | grep UUID commands.
    I then set it up in /etc/fstab in the following:


    ```

    UUID=550ad7db-0001-4ac5-bd14-c6f7ff9b943b /dir2 ext3 defaults 1 2

    ```


    This UUID is unique to my system; yours will be different.


    # Lab 6


    Since you''ve been told not to worry about saving data, you can proceed to encrypt
    the LV, /dev/mapper/vg1-lv1, with the following command:


    ```

    # cryptsetup luksFormat /dev/mapper/vg1-lv1

    ```


    During the execution process for this command, you''re asked to confirm by typing
    an uppercase YES, along with the desired passphrase. Because you haven''t been
    told to set up a UUID, you can keep it simple and just set up a basic name. (You
    may not tell everything.) I arbitrarily used the word basic1 for this purpose.
    The following command sets up a device file named basic1 in the /dev/mapper directory:


    ```

    # cryptsetup luksOpen /dev/mapper/vg1-lv1 basic1

    ```


    You can then set up the encrypted device in /etc/fstab by:


    ```

    basic1 /dev/mapper/vg1-lv1 none

    ```'
