    the system may appear unbootable. (It happened to me when some crumbs got stuck
    in my keyboard.) That happens when a system expects a passphrase for a LUKS-encrypted
    partition. If you encounter that situation, take the following basic steps (details
    may vary):


    +   1. At the GRUB menu, open the kernel command line.


    +   2. Add init/bin/sh to the end of the kernel command line. The system will
    mount the top-level root directory (/) volume in read-only mode.


    +   3. Run the mount -o remount,rw / command to make the top-level root directory
    writable.


    +   4. Edit the /etc/fstab file to comment out or delete the entry associated
    with the LUKS-encrypted partition. Edit the /etc/crypttab file to comment out
    or delete the associated entry.


    +   5. Power down the system. (Commands like shutdown and reboot don''t work from
    the way the system was booted with inits/bin/sh.) In the Virtual Machine Manager
    for the system, click Virtual Machine | Shut Down || Force Off.


    +   6. You should now be able to boot the system normally; you won''t be prompted
    for the LUKS passphrase.


