  md: '# 254 Chapter 16: File-Sharing Services


    His chapter covers two RHCE-level network services: the Network File System (NFS)
    and the File Transfer Protocol (FTP) server. As with other services, this chapter
    covers the five common objectives for network services. For the purposes of this
    chapter, I''ve added "NFS" and "FTP" to each objective as appropriate.


    The requirements for FTP services are not different from the corresponding objectives
    for the RHCSA. This chapter assumes you''ll set up anonymous-only downloads from
    a nonstandard directory. The requirements for NFS services are functionally equivalent
    to those for Samba. As the NFS configuration file is simpler, the steps needed
    to meet those requirements are also simpler. Just be aware that RHEL 6 does not
    include GUI tools for these services.


    # Install the Packages Needed to Provide the Service


    The packages associated with the NFS and FTP services are straightforward. The
    basic installation of the gamma.example.net system includes nfs-utils and nfs4-acl-utils
    packages. The main NFS configuration file, /etc/exports, is included in the RPM
    named setup, which includes the files of the Shadow Password Suite, which is fundamental
    to Linux. So there''s a good chance the packages required for version 4 of the
    NFS server are already installed. If necessary, just run the following command:


    ```

    # yum install nfs-utils nfs4-acl-tools

    ```


    If you''re working with NFS versions 2 or 3, you want to install the portreserve,
    quota, and rpbind packages.

    RHEL 6 includes one package associated with FTP services, vsftpd. It''s the default
    secure FTP (vsFTP) service and is simple to install with the following command:


    ```

    # yum install vsftpd

    ```


    # Configure SELinux to Support the Service


    This is just the brief of overviews of the SELinux booleans and file types associated
    with the NFS and FTP services. For NFS, no special SELinux file types are required
    on shared directories. For FTP, two file types are commonly used: public_content_t
    is for read-only files and public_content_rw_t is for read-write'
  merge: -1
  pgno: 289
- img_proc: true
  md: 'files. As read-write would apply to FTP uploads, that is beyond the scope of
    the related objective, to “configure anonymous-only download.” So all you have
    to do when configuring a new directory for anonymous-only downloads is to run
    a command such as the following:


    ```

    # chchon -R t public_content_t /new/dir

    ```


    If you want a full list of NFS booleans, run the ls /selinux/booleans grep nfs
    command. From this list, three NFS booleans, which are all enabled by default,
    are directly related to the configuration of the service:


    +   - nfs_export_all_ro Enables NFS sharing of directories in read-only mode

    - nfs_export_all_rw Enables NFS sharing of directories in read-write mode

    - use_nfs_home_dirs Supports the configuration of home directories mounted from
    a remote NFS server.


    If a security administrator or an exam requires you to disable all read-write
    NFS shares, all you need to do is disable the nfs_export_all_rw boolean. You can
    get a similar list of FTP server-related booleans with the ls /selinux/booleans
    grep ftp command. Those that relate directly to the vsFTP server are described
    here. To preserve an “anonymous-only” download configuration for the FTP server,
    you may want to make sure that one or more of the following booleans stay disabled:


    +   - allow_ftp_anon_write Supports anonymous-only uploads on directories labeled
    with the public_content_rw_t file type.

    - allow_ftp_full_access Enables access by regular users configured for the FTP
    server

    - ftp_home_dir Allows regular users to log into their home directories on the
    FTP server


    # Configure the Service to Start When the System Is Booted


    It’s simple to set up both the FTP and NFS services to start when RHEL 6 is booted.
    All you need to do is run the following commands:


    ```

    # chkconfig nfs on

    # chkconfig vsftpd on

    ```'
