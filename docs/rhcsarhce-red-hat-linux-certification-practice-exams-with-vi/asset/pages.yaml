    # Configure System to Authenticate Using Kerberos


    Unfortunately, it is not a simple matter to set up a Kerberos server on RHEL 6,
    as it requires the configuration of an authoritative DNS server. For the purpose
    of this book, it is sufficient to rely on the prompts available in the Authentication
    Configuration tool to understand how to authenticate and connect using Kerberos.
    If you need to set up Kerberos without LDAP (Lightweight Directory Access Protocol),
    use the text-based console tool. The GUI tool follows you to set up Kerberos with
    LDAP. As LDAP clients are associated with the RHCSA, you not necessarily see both
    requirements for the RHCE, as you can set Kerberos with the reportedly insecure
    alternative, the Network Information Service (NIS). To set up a Kerberos client,
    you need the following information:


    +   * Realm Normally to the capitalized domain name, such as `EXAMPLE.NET`.


    +   * Key Distribution Center (KDC) Usually associated with the Fully Qualified
    Domain Name (FQDN) or IP address of the Kerberos server.


    +   * Kerberos Administrative Server While this server is frequently set to the
    same system as the KDC, it''s where the kadmind daemon is running.'
  merge: -1
