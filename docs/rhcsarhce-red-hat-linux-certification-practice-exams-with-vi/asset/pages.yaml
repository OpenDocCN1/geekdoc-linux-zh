  md: '# Default Security Settings


    When RHEL 6 is installed, there are default settings associated with SELinux and
    iptables-based firewalls. This section is just reference information for a default
    installation; for more information, see the _Study Guide.


    First, SELinux is enabled in enforcing mode by default. You can confirm the setting
    with the sestatus command, which should lead to the following output:


    ```

    SELinux status:      enabled

    SELinuxfs mount:     /selinux

    Current mode:         enforcing

    Mode from config file: enforcing

    Policy version:       24

    Policy from config file: targeted

    ```


    If you want detailed information about the current iptables command, examine the
    /etc/sysconfig/iptables file. That file is used by the iptables service, courtesy
    of the /etc/init.d/iptables script. The following line from that file allows traffic
    through port 22 access from the outside.


    ```

    -A INPUT -m state --state NEW -m tcp --dport 22 -j ACCEPT

    ```


    Port 22 is the default port for the Secure Shell (SSH) server, which supports
    remote administration of the local system. If there’s a good network connection,
    you’ll be able to connect remotely to this system. If the local IP address is
    192.168.122.20, you can connect remotely to user tester’s account with the following
    command:


    ```

    # ssh tester@192.168.122.20

    ```


    One advantage of the Firewall Configuration tool is in the configuration of the
    connection-tracking module used for FTP services. When you set up a local FTP
    server and allow access with the Firewall Configuration tool, it includes the
    following module in the iptables-config file in the /etc/sysconfig directory:


    ```

    IPTABLES MODULES="nf_conntrack_ftp"

    ```


    If you edit the firewall configuration manually, you may need to add this module
    to the iptables-config file.


    You also need to set up the firewall in a couple of special ways for the VMs.
    First, on the physical system, you should confirm the identity of the virtual
    network device. To do so, run the ifconfig command. Unless you changed defaults,
    that device should be named virbr0, associated with IP address 192.168.122.1.
    Here’s how it looks on my system:'
