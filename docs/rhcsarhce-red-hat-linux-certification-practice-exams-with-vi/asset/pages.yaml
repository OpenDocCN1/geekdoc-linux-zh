  md: '# Create and Configure set-GID Directories for Collaboration


    in both the /etc/group and /etc/gshadow files or with the help of the GUI User
    Manager.


    # Create and Configure set-GID Directories for Collaboration


    If you''ve created a specialized group, you can also create a dedicated directory
    for that group with specialized permissions. When done correctly, members of that
    group have full access to files in specialized directory.


    For example, if you''ve created the group named special earlier in this chapter,
    you could take steps similar to the ones to create and configure a "set-GID" directory.


    +   1. Create an appropriate dedicated directory. As it would be configured like
    a regular user''s home directory, it would be appropriate to set it up as a /home
    subdirectory. One way to do this is with the mkdir /home/special command.

    2. Set appropriate group ownership. The following command gives a user such as
    promgr1 ownership of that directory, with privileges for members of that group:

    3. Configure appropriate permissions; the following command sets up the set-GID
    bit, along with full read/write/execute permissions for the group owner of that
    directory:


    ```

    # chmod promgr1:special /home/special

    ```


    ```

    # chmod 2770 /home/special

    ```


    An alternative to the first 2 in the chmod 2770 is chmod g+. In other words, the
    noted chmod command activates the set-GID bit. Any files created in that directory
    automatically are assigned group ownership based on the group owner of that directory.


    In other words, if a member of the group named special saves a work file to the
    /home/special directory, special becomes the group owner of that file. The directory
    is now ready for collaboration among the members of the special group.'
