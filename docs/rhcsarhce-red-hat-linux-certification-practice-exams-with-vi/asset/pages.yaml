  md: '# Chapter I: Prepare for Red Hat Hands-on Certifications


    # RAM Requirements


    This chapter assumes that you''ll install RHEL 6 four times on the same system:
    once on the physical host, and once each on the three virtual machines. Although
    4GB is a reasonable minimum for such a configuration, I''ve written this book
    on a laptop with 8GB of RAM.


    But the RAM requirements for individual systems aren''t that great. While it''s
    possible to run RHEL 6 on each, the RAM memory requirements are driven by the
    needs of the Red Hat installer. For basic Intel/AMD-based 32- and 64-bit architectures,
    Red Hat officially requires 512MB of RAM and recommends at least 1GB of RAM per
    system. But don''t forget to add it all together. Take the RAM for the three VMs,
    and then add the required for the physical system.


    # Hard Drive Options


    Before a computer can start Linux, the BIOS or UEFI has to recognize the hard
    drives that are connected to the system. It should also be able to read the Master
    Boot Record (MBR), the first 512 bytes on drive. When Linux is installed, the
    MBR on one of the first two hard drives should include a pointer to the bootloader.
    The BIOS or UEFI can set up and initialize that hard drive, read the MBR, and
    then read the GRUB bootloader. The system can read the contents of GRUB and then
    load Linux boot files as specified in the associated configuration file.


    # Get Red Hat Enterprise Linux


    The RHCSA and RHCE exams are based on your knowledge of RHEL. Some of the requirements
    are based on RHEL software that has been built only for "standard" 64-bit computers.
    To get RHEL 6, you can go in one of two basic directions. You can get an official
    copy of RHEL 6, or you can download an option known as a "rebuild" distribution.


    To get an official copy of RHEL, you need a subscription. That costs money. The
    benefit is that you get a copy of the operating system that''s actually used for
    the Red Hat exams. While trial subscriptions and academic discounts are available,
    those options may take more effort than the alternative.'
