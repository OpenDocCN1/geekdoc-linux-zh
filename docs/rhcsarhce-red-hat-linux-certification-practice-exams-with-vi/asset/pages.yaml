  md: '# Provide NFS Network Shares Suitable for Group Collaboration


    The configuration of an NFS network share for a group requires some coordination.
    You need to set up the same usernames and groups on both systems. Furthermore,
    you need to make sure the user ID and group ID numbers of the corresponding accounts
    match perfectly.


    For that reason, it''s best to have a network database of these users and groups.
    Such databases can be configured on an LDAP server. But since that''s not part
    of either exam objective, that option may not be available to you.


    In any case, this may provide the opportunity to practice what you learned in
    Chapter 8 of the Study Guide. Namely, it allows you to practice creating users,
    specialized groups, and dedicated directories with appropriate ownership and permissions.


    When you''ve set up on both the NFS server and client, you''ll be ready to set
    up an NFS shared directory, suited for collaboration by the users who are members
    of the target group.


    # CERTIFICATION SUMMARY


    The focus of this chapter is on two file-sharing services. As NFS is native to
    Linux and Unix computers, it''s efficient. Although Linux supports NFSv2, NFSv3,
    and NFSv4, the latest version is actually simplest in several ways. NFSv4 only
    requires an open TCP port 2049; earlier versions of NFS required several other
    open ports. In any case, the main configuration file for sharing a directory via
    NFS is /etc/exports.


    RHEL 6 uses one FTP server, vsFTP. While the RHCE objectives specify configuration
    of anonymous-only downloads, they also specify host- and user-based security.
    So be prepared to configure vsFTP in both ways, based on the contents of the /etc/vsftpd/vsftpd.conf
    configuration. Anonymous-only users are taken to the /var/ftp directory based
    on the configuration of the user named ftp. Special FTP directories should be
    configured with the public_content_t file type.'
