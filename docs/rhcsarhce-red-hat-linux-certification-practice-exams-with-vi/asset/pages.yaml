  md: '# 286 Appendix A: Prepare a System for the Sample Exams


    andy Russell, Red Hat''s Director of Certification, stated in a 2009 blog entry
    that the Red Hat exams no longer require "a bare-metal installation." In other
    words, when you sit down for a Red Hat exam today, preinstalled systems are provided
    for you.


    As noted in Chapter 1, the DVD for this book includes compressed versions of three
    virtual machines (VMs) suited for this purpose. In fact, you can find four sample
    exams on the gamma.example.net VM, in the /home/tester/Desktop/SampleExams directory.
    Yes, this forces you to use the Kernel-based Virtual Machine (KVM) system with
    only the 64-bit version of RHEL 6.


    As there are five RHCSA objectives directly related to VMs, it''s important that
    you know how to use the Red Hat VM solution. This is an excellent time to start
    fresh with the VMs installed in Chapter 1. But to do so, you have to delete the
    existing versions of all three VMs on the example.net network (hosts gamma, whitehat,
    and blackhat).


    To delete a system from the GUI Virtual Machine Manager, take the following steps:


    +   1. Highlight the target VM.

    2. Click Edit | Delete.

    3. In the Delete Confirmation window that appears, activate the Delete Associated
    Storage Files option, and then click Delete.


    Now you can repeat the steps described in Chapter 1 to unpack and reload the original
    three VMs from the DVD. (If space is tight, you may want to wait until the RHCE
    chapters, starting with Chapter 10, to reload the blackhat.example.net system.)
    If you just need some quick reminders on the reload process, you can unpack and
    install the VMs using the following guidelines:


    +   * Use the tar xvPf command to unpack the VMs. The P switch makes sure the
    disk files are unpacked to the original directory, in this case, /var/lib/libvirt/images.


    +   * Using the Virtual Machine Manager wizard, select Import Existing Disk Image
    and specify 768MB of RAM.


    +   * Unless you''re skipping the RHCSA exam, don''t change the hardware address
    of the network card for any of the three systems. (Yes, it''ll be one thing that
    you do during the RHCSA sample exams.)'
  merge: -1
  pgno: 321
- img_proc: true
  md: '# Basic Sample Exam System Requirements 287


    ![](img/ad9f3468206ad4765a06e762bd96b965_322_0.png)


    # Basic Sample Exam System Requirements


    A test system for RHEL 6 requires more. There is no requirement for a physical
    "bare-metal" installation in the objectives for either the RCSA or the RHCE exam.
    However, for the RHCSA, you do need to "configure a physical machine to host virtual
    guests." As the default RHEL 6 virtual machine solution (KVM) can only expect
    to be installed from its 64-bit release, you should have 64-bit hardware.


    You can expect to "install Red Hat Enterprise Linux systems as virtual guests."
    That''s an implicit requirement for a "bare-metal" installation on a VM. With
    those objectives in mind, you can set up a test system based on the following
    requirements:


    +   - Installation on physical 64-bit hardware.

    - A dual-boot configuration with another operating system is acceptable.

    - Red Hat does not support Intel Itanium CPUs.'
  merge: -1
  pgno: 322
- img_proc: true
  md: '# 288 Appendix A: Prepare a System for the Sample Exams


    +   - Sufficient hard drive space. Based on the requirements in Chapter 1 (and
    shown in Figure 1-1), you want at least 80GB total space for the volume that includes
    the physical RHEL 6 system, along with the virtual guests. Would be better, if
    you only make sure you have room for virtual installation.


    Since the Study Guide was released, there are now moderately affordable options
    for installing a virtual machine within a virtual machine, such as VMware Workstation
    8.0. I do not need that configuration for this book.


    One of the RHCSA objectives is to "configure a physical machine to host virtual
    guests." For that purpose, you need to know how to install KVM on an existing
    RHEL 6 system. But since you''ve probably already unpacked a fresh copy of the
    three example VMs, you may not want to do that. Just remember, for some reason
    you actually do have to install KVM during a production situation such as an,
    run the following command:


    ```

    # ym groupinstall Virtualization "Virtualization Client" \n"Virtualization Platform"

    ```


    Once installation is complete, the system is ready for the RHCSA exam. Although
    Internet access is not allowed on any major certification exam, it''s acceptable
    for the purpose of these sample exams. If you prefer a more "pure" exam environment,
    refer to Chapter 7, Lab 3, which includes instructions on how to create a local
    repository based on the contents of the installation DVD.


    For the sample RHCSA exams, you''ll do most of your work from the gamma.example.net
    system. You''ll use the whitehat.example.net system to confirm network access
    to installed services as needed.


    ![](img/ad9f3468206ad4765a06e762bd96b965_323_0.png)


    watch Although you could also use the physical host system as a client for the
    gamma.example.net VM, the whitehat.example.net system is better for this purpose.
    You may need to install tools on the whitehat system, which can be a useful exercise.'
