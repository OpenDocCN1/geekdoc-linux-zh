  md: '# 130 Chapter 7: Package Management


    Although only two objectives are associated with this chapter, the first one is
    especially important. You may need to know how to install several different packages
    in support of other RHCSA objectives. To that end, it helps you know how to use
    the rpm and yum commands in some default. Implicitly, that also means you should
    know how to configure repositories in the /etc/yum.conf file and supporting directories
    (/etc/yum and /etc/yum.repos.d).


    # Install and Update Software Packages from Red Hat Network, a Remote Repository,
    or from the Local File System


    Let''s break this objective into different components. Install and update are
    two different methods for installing software packages. They both apply to the
    two commands associated with the management of Red Hat packages: rpm and yum.
    You can install and update with both commands; the options are straightforward.
    For rpm, the -i installs, the -F updates and for yum, the install switch installs,
    and the update switch updates a package if it''s already installed.\ don''t need
    a connection to the Red Hat Network (RHN). The yum works in the same way as the
    RHN and the remote repositories associated with Scientific Linux and CentOS. However,
    there are subtle differences in the configuration files. You can use the rpm command
    to install a package from the local file system. Alternatively, you can set up
    a local repository using HTTP or FTP servers described in Chapter 1. If you need
    a file named file.repo in the 4/etc/yum.repos d directory. For example, if you
    have a default Apache HTTP server configured on /var/www/html/ on IP address 192.168.122.1,
    you could include the following lines in the file.repo:


    ```

    [mine]

    name=test repo

    baseurl=http://192.168.122.1/

    ```


    You''re welcome to substitute as desired for the italicized entries. For repositories
    for the RHN are configured with an account at rhn.redhat.com, subscribed systems
    are automatically connected to Red Hat''s main repositories for installation packages
    and updates. That''s functionally equivalent to the main and updates repositories
    common in many rebuild distributions.


    The gamma.example.net VM is configured with an mh.repo file in the /etc/yum.repos.d
    directory. It includes options that activate access to the repository and takes
    advantage of GPG keys in the /etc/pki/rpm-gpg directory to verify the authenticity
    of such packages. If you want to deactivate the mh.repo repository, set enabled=0.


    ![](img/ad9f3468206ad4765a06e762bd96b965_165_0.png)'
  merge: -1
