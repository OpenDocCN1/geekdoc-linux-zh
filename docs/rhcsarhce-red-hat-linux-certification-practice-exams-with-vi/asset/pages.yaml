  md: '# Lab Answers 91


    The next time the system boots, it automatically incorporates ACL capabilities
    into the /home directory filesystem. You could implement it prior to reboot with
    a command like the following:


    ```

    # mount -o remount,acl /home

    ```


    Yes, it''s possible that the default configuration of the /home directory already
    has ACL a default mount option. If /home is mounted on /dev/vda3, you could confirm
    that by running dump2fs /dev/vda3 | grep acl command. But you also need to know
    how to set up ACLs in /etc/fstab.


    # Lab 3


    Assuming you''ve run Lab 2 as directed, ACLs are now available for the /home directory
    filesystem. In the /home/tester/Desktop/ChapterLabs directory, you''ll have a
    number of different files. If you want to focus on a specific file, focus on testaudit.


    To support directory access from other users, you need to set the execute bit
    on all subdirectories. The /home directory already has that bit for other users.
    One way to set the execute bit for the other directories in line is with the following
    command, which sets the execute bit, recursively, for user tester2, starting with
    the /home/tester directory and all subdirectories.


    ```

    # setfacl -R -m u:tester2:x /home/tester

    ```


    Per the conditions stated in the lab, it is acceptable to set the regular execute
    bit on the noted directories with the regular chmod command. But that is a security
    risk as it allows all users to see what exists in the /home/tester directory.


    Of course, you also need to set read privileges for the user named tester2. One
    way to do so is with the following command:


    ```

    setfacl -m u:tester2:r /home/tester/Desktop/ChapterLabs/testaudit.log

    ```


    You should be able to test the result from the tester2 account.


