  md: '# Get Red Hat Enterprise Linux


    also a download available for a network boot CD. These downloads are in ISO format,
    with an .iso extension. Such files can be burned to appropriate media, using standard
    tools such as Brasero in the GNOME desktop, a variation on the cdrecord command,
    or even corresponding tools on Microsoft systems. Alternatively, you can set up
    a VM where the virtual CD/DVD drive hardware points directly to the ISO file.
    Unless you purchase an actual box subscription, the burning or other use of these
    ISO files is your responsibility.


    An ISO file is an image file that can be burned to CD/DVD media. The actual acronym
    is irrelevant, as it is based on a political compromise.


    # Third-Party Rebuilds


    You don''t have to pay for operating system support to prepare for Red Hat exams.
    You don''t have to live with a limited text subscription. To comply with the General
    Public License (GPL) and other applicable open source licenses, Red Hat releases
    the source code for just about every RHEL package at ftp.redhat.com. However,
    the GPL only requires that Red Hat release the source code. Red Hat interprets
    licenses in a way that means they don''t have to release the binary packages compiled
    from that source code.


    The description of the GPL and trademark law in this book is not a legal opinion
    and is not intended as legal advice.


    Under trademark law, Red Hat can prevent others from releasing software with its
    trademarks, such as its Fedora symbol. Nevertheless, the GPL, as an “open source”
    license, gives anyone the right to compile that source code. If they make changes,
    all they need to is release their changes under the same license. And that''s
    how third parties such as CentOS and Scientific Linux take the source code, remove
    the trademarks, and build the software into their own rebuild distributions.


    The source code is released in Source RPM format, which means the RPM packages
    can be built using various rpm (and rpmbuild) commands. However, the build process
    for a distribution, even from source code, is a tricky process. But once complete,
    the rebuild has the same functionality as RHEL. Red Hat releases its source code
    when it releases updates. And the developers behind rebuild distributions follow
    these releases to keep their repositories up to date. Here''s a bit about two
    of the major options for rebuild distributions:'
