  md: '# 220 Chapter 14: The Apache Web Server


    This chapter is focused on the Apache web server, which may be the most important
    server software on the Internet. According to the Netcraft (www.netcraft.com)
    survey, which tracks the web servers associated with virtually every site on the
    Internet, Apache is currently used by more sites than all other web servers combined.


    While there are nine objectives related to Apache, this chapter is focused on
    the configuration of Apache at a relatively basic level. While a little knowledge
    of scripting is helpful to satisfy the Common Gateway Interface (CGI) scripting
    objective, it is not required. There are plenty of simple scripts available online
    (and even on a default RHEL 6 system) to demonstrate the basic concepts associated
    with Apache.


    The main configuration files for Apache are httpd.conf and ssl.conf, which you
    can find in /etc/httpd/conf and /etc/conf.d directories. When you make changes,
    use the http -t command to check file syntax, and the http -S command to run virtual
    hosts.


    If you use the elinks text-based browser to test a web page, just remember to
    include the http:// or https:// in front of the target IP address or uniform resource
    locator (URL).


    # Install the Packages Needed to Provide the Service


    Although the Apache web server requires just one package (httpd), you need more.
    For secure web services, you need the mod_ssl package. For documentation, just
    in case you forget the code for a sample CGI script, you may want the httpd-manual
    package. For simplicity, it may be fastest to install the Web Server package group
    with the following command:


    ```

    # yum groupinstall "Web Server"

    ```


    This command also installs other packages that might be useful under different
    circumstances; the relevant mandatory and default packages from the “Web Server”
    package group are shown in Table 14-1.'
  merge: -1
  pgno: 255
- img_proc: true
  md: '| TABLE 14-I |

    | Package | Description |

    | --- | --- |

    | Mandatory and Default Packages in the Web Server Group | httpd | Installs the
    main Apache web server |

    | | httpd-manual | Includes a searchable Apache manual in /var/www/manual directory
    |

    | | crypto-utils | Adds tools to generate and manage SSL certificates and keys
    |

    | | mod_perl | Incorporates a PERL language interpreter into Apache |

    | | mod_ssl | Adds Secure Sockets Layer (SSL)/Transport Layer Security (TLS) support
    |

    | | mod_wsgi | Supports a web server gateway interface for Python applications
    |

    | | webalalizer | Installs a web server log analysis program |


    # # Configure SELinux to Support the Service


    As a service that is often used to interface with the public, Apache should always
    be considered a potential security risk. To limit that risk, a substantial number
    of SELinux options are associated with Apache, related to the file contexts of
    different directories as well as booleans, that permit or prohibit Apache-based
    functionality. The file contexts in Table 14-2 are somewhat descriptive. Just
    be prepared to set up the same contexts in other directories. With 26 SELinux
    booleans related the Apache web server, you can do a lot to secure a system and
    prevent problems. These booleans are described briefly in Table 14-3. The first
    six in the list are active by default.


    | TABLE 14-2 |

    | Context | Description |

    | --- | --- |

    | SELinux File Types for Apache | httpd_config_t | Supports configuration files,
    such as those in the /etc/httpd directory |

    | | httpd_modules_t | Supports directories with loadable modules, including those
    in the /usr/lib64/httpd modules directory |

    | | httpd_log_t | Works for files in log directories as /var/log/httpd |

    | | httpd_sys_context_t | Sets up the data files for a web server, such as HTML
    pages |

    | | httpd_sys_content_ra_t | Supports data where Apache reads and appends to the
    file |

    | | httpd_sys_content_rw_t | Supports data where Apache reads and writes to the
    file |

    | | httpd_sys_script_exec_t | Allows the Apache service to access executable scripts'
  merge: -1
  pgno: 256
- img_proc: true
  md: '# 222 Chapter 14: The Apache Web Server


    | TABLE 14-3 SELinux Booleans for Apache |

    | Boolean | Description |

    | httpd_builtin_scripting | Supports the use of scripts in directories with the
    httpd_t process context associated with Apache |

    | httpd_dbus_avahi | Allows Apache to work with automated IP address configuration
    |

    | httpd_enable_cgi | Enables access to run CGI scripts, if the files are properly
    labeled with the httpd_sys_script_exec_t file type |

    | httpd_tty_comm | Supports access to a terminal; needed by Apache to access SSL
    certificates |

    | httpd_unified | Allows a single security domain for HTTP-related content |

    | xguest_connect_network | Enables access from secured guest users |

    | allow_httpd_anon_write | Supports writing to files labeled with the public_content_rw_t
    file type |

    | allow_httpd_mod_auth_ntlm_winbind | Enables access to Microsoft authentication
    databases, in conjunction with the mod_auth_ntlm_winbind module |

    | allow_httpd_mod_auth_pam | Enables access to PAM authentication modules, in
    cooperation with the mod_auth_pam_module |

    | allow_httpd_sys_script_anon_write | Supports access by scripts to public_content_rw_t
    files |

    | httpd_can_check_spam | Works with web-based e-mail applications to check for
    spam |

    | httpd_can_network_connect | Supports access by Apache scripts/modules to remote
    connections |

    | httpd_can_network_connect_cobbler | Enables access by Apache scripts/modules
    to the Cobbler installation server |

    | httpd_can_network_connect_db | Allows Apache scripts/modules to connect to a
    database server |

    | httpd_can_network_memcache | Enables HTTP memory caching access; originally
    set up for a translation server |

    | httpd_can_network_relay | Supports the use of the HTTP service as a relay server
    |

    | httpd_can_sendmail | Allows the use of HTTP-based e-mail services, such as (but
    not necessarily) sendmail |

    | httpd_enable_homedir | Configures access via HTTP files in user home directories;
    requires the httpd_sys_content_t file context |

    | httpd_execmem | Supports access from HTTP modules to executable memory regions
    |

    | httpd_read_user_content | Enables access to scripts from user home directories
    |

    | httpd_setrlimit | Allows Apache to modify maximum number of file descriptors
    |

    | httpd_ssi_exec | Allows Apache to access Server Side Include (SSI) scripts;
    similar to httpd_enable_cgi |'
