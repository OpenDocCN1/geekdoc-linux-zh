    # LAB ANSWERS


    # Lab I


    This lab is slightly tricky, as it does not require any direct configuration of
    Postfix or sendmail. All it requires are changes to the /etc/aliases file, which
    is used by both SMTP services. Add the following entries to that file:


    ```

    testuser: genius@example.net

    root: genius@example.net

    ```


    Of course, you also need to process the file with the newaliases command to create
    a new or updated /etc/aliases.db file.

    If you want to check the result, you can use a command-line client such as mut
    or mail. You''ll need to create a user named genius. Then, if you send a test
    e-mail to the local root user, the message should be received by user genius,
    as the domain for the VMs is example.net.


    # Lab 2


    First, to enable access from more than the localhost, you should modify the inet_interfaces
    directive in /etc/postfix/main.cf to:


    ```

    inet_interfaces = all

    ```


    Next, to set up the limitations on the domains, open the /etc/postfix/access file
    and include the following lines:


    ```

    blackhat.example.net REJECT

    example.net OK

    ```


    You could set up equivalent functionality with appropriate options in the firewall.


    # Lab 3


    To configure a smart host in Postfix, you want to add the relayhost directive
    to the main.cf file in the /etc/postfix directory. For the parameters given in
    the Lab, if the physical host is located on system kauai.example.net, add the
    following directive:


    ```

    relayhost = kauai.example.net

    ```'
