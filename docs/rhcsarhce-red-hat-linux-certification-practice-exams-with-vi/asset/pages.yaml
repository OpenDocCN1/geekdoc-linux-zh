  md: '# Chapter I: Prepare for Red Hat Hands-on Certifications


    # # The RHCSA and RHCE Exams


    The first Red Hat exams were given in 1999. And they''ve evolved since then. Until
    2003, there was actually a multiple-choice component to the RHCE exam. At that
    time, the three-part exam was 6.5 hours long.


    In 2009, Red Hat removed the requirement to install RHEL on a bare-metal system.
    They''ve refused the requirement for installation on a VM. In addition, there
    is no longer a separate troubleshooting section on either exam.


    The RHCSA was introduced with the release of RHEL 6, as a replacement for the
    Red Hat Certified Technician (RHCT) exam. RHCT was a complete subset of the RHCE.
    The RHCSA is different. Although the topics are closely related, they are separate
    from those now listed for the RHCE.


    ![](img/ad9f3468206ad4765a06e762bd96b965_39_0.png)


    Red Hat provides "pre-assessment" tests for Red Hat RHCSA and RHCE Exam Prep courses.They
    correspond to the RH134 and RH254 courses,These tests are available through the
    Red Hat web pages


    for each course. Red Hat requires contact information before providing those pre-assessment
    tests. In addition, you can take the pre-assessment tests provided at http://www.mhprofessional.com/product?php?cat=39&isbn=007180160X.


    # ## The Exam Experience


    Red Hat''s certification tests are hands-on exams. As such, they are respected
    throughout the industry as a sign of genuine practical knowledge. When you pass
    a Red Hat exam, you will stand head and shoulders above the candidate who has
    passed only a "standard" multiple-choice certification exam.


    When start time, you''ll be faced with a live system. You''ll get actual configuration
    problems associated with the items listed in the exam objectives for each certification.
    Naturally, this book is dedicated to helping you master the skills associated
    with those objectives.


    While you won''t have Internet access to the exam, you will have access to online
    documentation such as man and info pages as well as documentation in the /usr/share/doc/
    directories, assuming packages are installed.


    ![](img/ad9f3468206ad4765a06e762bd96b965_39_1.png)'
  merge: -1
  pgno: 39
- img_proc: true
  md: 'In addition, Red Hat provides the exam in electronic format. While the basic
    instructions may be in a local language such as English, the RHCSA and RHCE exams
    are available in 12 different languages: English, Simplified Chinese, Traditional
    Chinese, Dutch, French, Italian, Japanese, Portuguese, Russian, Spanish, and Turkish.
    (If you''re unsure, contact Red Hat training at 1-866-626-2994, or via.redhat.com/training/).


    Red Hat also has prep courses for exams. The outlines for those courses are available
    from www.redhat.com. While this book is not intended as a substitute for such
    courses, it is consistent with the outline of those courses. This book covers
    the objectives associated with each of these exams.


    ![](img/ad9f3468206ad4765a06e762bd96b965_40_0.png)


    # The RHCSA Exam


    The RHCSA allows you to demonstrate your ability to configure live physical and
    virtual systems for networking, security, custom file systems, package updates,
    user management, and more. In essence, the RHCSA exam covers skills required to
    configure and administer a Linux workstation in the enterprise.


    You have two and a half hours to complete the tasks on the RHCSA exam. You complete
    the tasks by configuring a live RHEL system. Any changes that are made must survive
    a reboot. When you''ve completed the given tasks, the person grading the exam
    will see if the system is configured to meet the requirements. For example, if
    you''re told to ''create, delete, and modify local user accounts,'' it doesn''t
    matter if the associated configuration file has been modified with the vi editor
    or the Graphical User Manager tool. As long as you don''t cheat, it''s the results
    that matter. Chapters 1 through 9 focus on coverage of the RHCSA exam.


    # The RHCE Exam


    The RHCE exam tests your ability to configure live physical and virtual servers
    to configure network services such as Apache, vFTP, the Network File System (NFS),
    Samba, remote logging, and more. It also tests your ability to handle complex
    configuration options associated with Security Enhanced Linux (SELinux), firewalls,
    networking, and more. In essence, if you pass the RHCE exam, hiring managers will
    know that you''re qualified to help manage their enterprises of Linux systems.'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# Chapter I: Prepare for Red Hat Hands-on Certifications


    The RHCE exam lasts two hours. When you sit down to take the exam, you are given
    tasks to perform on a live RHEL system. As with the RHCSA, any changes that are
    made must survive a reboot. In any case, it doesn''t matter if you''ve configured
    the associated configuration file with the nano editor or a GUI tool. As long
    as you don''t cheat, it''s the results that matter.


    The topics in the Red Hat preparation courses go beyond those listed in the Red
    Hat Exam Preparation Guide. While such topics are not currently part of the exam,
    they may be included in future versions of the Red Hat exams.


    Although the objectives for the RHCE exam are covered in Chapters 10 through 17,
    you should also read this chapter to install the VMs from the DVD for the test
    network.


    # Evolving Requirements


    The requirements for the Red Hat Hat exams are subject to change. You can see
    that in the differences between the RHCT and the RHCSA. You can see that in the
    changes to the exam format, where bare-metal installations are no longer required.
    In fact, that change happened over two years into the life of RHEL 5. Changes
    also occurred in the first month after RHEL 6 was released. So when you''re preparing
    for the RHCSA and/or RHCE exams, watch the associated exam objectives carefully.
    In addition, Red Hat announced its most recent format changes through the WordPress
    blog publishing site, at http://redhatcertification.wordpress.com.


    # Basic Hardware Requirements


    Now it''s time to explore in detail the hardware that Red Hat Enterprise Linux
    can handle. While some manufacturers now include their own Linux hardware drivers,
    most Linux hardware support comes from third parties, starting with the work of
    volunteers. Fortunately, there is a vast community of Linux users, many of whom
    produce drivers for Linux and distribute freely on the Internet. If a certain
    piece of hardware is popular, you can be certain that Linux support for that piece
    of hardware will pop up somewhere on the Internet and will be incorporated into
    various Linux distributions, including Red Hat Enterprise Linux.'
