  md: '# 186 Chapter II: System Services and SELinux


    # Lab 2


    While the requirements of this lab are relatively trivial, it could be time consuming
    to run a command like chconfigservice --level 4 off on every applicable service.
    This is when the ntsys tool, available from a package of the same name, can be
    helpful. The following command can help you toggle the default at runlevel 4:


    ```

    # ntsysv --level 4

    ```


    In the low-level graphical screen that appears, you can turn off each service
    at runlevel 4 relatively quickly. To confirm success, run the chconfig --list
    command. You should see the following entry associated with every service:


    ```

    4:off

    ```


    # Lab 3


    If successful, you''ll see the following output when you run the ls -Zd /ftp and
    ls -Zd /ftp/pub commands:


    ```

    drwx-xr-x. root root system_u:object_r:public_content_t:s0 /ftp/

    drwx-xr-x. root root system_u:object_r:public_content_t:s0 /ftp/pub/

    ```


    Perhaps the quickest way to set up these contexts on the noted directories is
    with the following command:


    ```

    # chcon -R --reference=/var/ftp /ftp

    ```


    Of course, you also need to change the default context. One way to do this is
    with the following commands:


    ```

    # semanage fcontext -s system_u -t public_content_t /ftp

    # semanage fcontext -a system_u -t public_content_t /ftp/pub

    ```


    If successful, you''ll see the following entries in the file /contexts.local file,
    in the /etc/selinux/targeted/contexts/files directory:


    ```

    /ftp system_u:object_r:public_content_t:s0

    /ftp/pub system_u:object_r:public_content_t:s0

    ```


    # Lab 4


    On the client system (whitehat.example.net) from the testurer account, run the
