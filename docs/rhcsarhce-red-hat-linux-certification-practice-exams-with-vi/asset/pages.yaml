- img_proc: true
  md: 'Be aware of the files in the /etc/init directory and what they do. For those
    who are converting from RHEL 5, these files have taken over the functionality
    of everything but the default runlevel from the /etc/initab file.


    # Configure Network Services to Start Automatically at Boot


    In my opinion, this objective is not precise. Rarely would you want to start networking
    and a network service such as the FTP server when booting into single-user mode.
    On the other hand, you would typically want networking available in at least runlevels
    3 and 5, which correspond to fully featured logins in the text and graphical-based
    consoles, respectively. In addition, for security, it''s best to keep the number
    of active network services to a minimum.


    The chconfig command makes this process convenient. For example, if you want to
    configure the vsFTP service to start automatically at boot, you could run the
    following command:


    ```

    # chconfig vsftpd on

    ```


    This command applies to all reasonable runlevels; to confirm, run the chconfig
    --list vsftpd server is a service that starts automatically during the boot process
    in runlevels 2, 3, 4, and 5. It is not started in runlevel 0 (shutdown), runlevel
    1 (single-user mode), or runlevel 6 (reboot).


    ```

    vsftpd 0:off 1:off 2:on 3:on 4:on 5:on 6:off

    ```


    If you need to be more specific about the boot runlevel for network services,
    the chconfig command still works. For example, the following commands set the
    noted service to start only in runlevels 3 and 5:


    ```

    # chconfig vsftpd off

    # chconfig --level 35 vsftpd on

    ```


    Of course, you could use the console or GUI Service Configuration tool to make
    these changes to a variety of network services.'
