  md: '# A Default Configuration FTP Server 35


    While it''s simplest to install KVM during the installation process, Randy Russell,
    Red Hat''s Director of Certification, has written that Red Hat exams are no longer
    given on “bare-metal” systems. In other words, you need to know how to install
    KVM on a live system.


    Nevertheless, this chapter describes how you can install KVM during the installation
    process. In other words, if you have trouble with the labs, this chapter provides
    "fail-safe" instructions so you''ll have VMs for the remainder of the book. This
    is necessary to allow you to run all other labs in this book. However, you get
    a chance to set up KVM on a preinstalled system during one of the others. Here''s
    a hint for you: the relevant package groups are Visualization, Visualization Client,
    and Virtualization Platform. If you forget these names, you can list them with
    the following command:


    ```

    # yum grouplist | grep Virtual

    ```


    The output also shows the Visualization Tools package group, which is not required.
    Of course, you can install these packages with the help of the yum groupinstall
    command or with the Add/Remove Software tool in the GUI. While many other excellent
    VM solutions are available, don''t use them when preparing for a Red Hat exam.
    Red Hat''s one and virtualization solution for RHEL 6 is KVM. Use it. Learn it.
    That knowledge of KVM will serve you well in your career.


    # A Default Configuration FTP Server


    The exact wording of the objective is to “Configure a system to run a default
    configuration FTP server.” Let’s break down that objective. First, “default configuration”
    suggests that no changes are required to the configuration file that is installed
    with the FTP server package. Second “configure a system” suggests changes may
    be required to the software around the FTP server.


    When RHEL 6 was released, the wording of the objective was subtly different: “deploy
    file sharing services.” In other words, Red Hat believes it is important to know
    how to set up an FTP server to actually share files.


    Red Hat includes one package for FTP services in RHEL 6, vsftpd. It is based on
    the very secure FTP daemon. By default, it serves files from /var/ftp directory.
    It includes the /var/ftp/pub directory for publishing files. While the default
    configuration reads files from these directories, it can also read files from
    associated subdirectories.


    When you configure a system to accommodate FTP, you may need to add directories,
    modify firewalls, and adjust the SELinux contexts associated with those'
  merge: -1
  pgno: 70
- img_proc: true
  md: 'files and directories. Firewalls are fairly straightforward, especially with
    the help of the firewall configuration tool. Since the objective specifies the
    default configuration, you don''t have to be concerned about nonstandard ports
    for FTP, at least during the RHCSA exam. In other words, preconfigured options
    in the Firewall Configuration tool can enable access to that FTP server from external
    systems. Just be aware, as suggested earlier, the FTP option in the firewall configuration
    tool adds the nf_conntrack_fpt module to the IPTABLES_MODULES directive in the
    /etc/sysconfig/iptables-config file.


    Finally, don''t let SELinux scare you. As long as you know how to read the SELinux
    contexts of files and directories, you can set SELinux contexts of any files and
    subdirectories that you may add.


    # A Default Configuration HTTP Server


    The wording and history of this objective is quite similar to the previous one
    for the FTP server. The earlier version of the directive, to deploy a file-sharing
    service, was relevant to both the FTP and HTTP services.


    The only HTTP server included with RHEL 6 is the Apache Web Server. While some
    rebuild distributions may include alternatives, focus your studies on Apache.


    Based on the "default configuration," for Apache, you won''t have to make any
    changes to the httpd.conf file in the /etc/httpd/conf directory. You can use the
    same Firewall Configuration tool to enable external access to the HTTP web server.
    While the SELinux settings in the /var/www/html directory are slightly different,
    you can use commands like -Z to identify the default SELinux contexts, and change
    them in any configured subdirectory.


    Of course, the Apache Web Server is an entirely different animal from any FTP
    server. The defaults mean when you navigate to the hostname or IP address of the
    server, it brings up the standard Apache HTTP Server Test Page, similar to that
    shown in Figure 1-19.


    But to set up a system for file sharing, you have to go further. And you don''t
    have to make any changes to the default configuration to do so. All you need to
    do is add a directory to the default, include files that you want to share, and
    let users know where to navigate. For example, if you set up a /var/www/html/os
    directory with files, users can navigate to it in their browsers at http://hostname/os
    URL. If there are errors with this or the FTP service, check the SELinux contexts
    of the files that are being shared, as well as the provisions in the firewall.'
