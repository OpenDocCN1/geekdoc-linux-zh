  md: '# Additional Resources


    Some readers will want to go further. Of course, the first “additional resource”
    that I recommend is the companion Study Guide.


    If you want to go even further, Red Hat has excellent documentation on RHEL 6.
    Much of what I learned about RHEL 6 comes from the documents available at http://docs.redhat.com/docs/en-US/Red_Hat_Enterprise_Linux/.
    For our purposes, these are the most important of these guides:


    +   - Installation Guide As the Red Hat exams are given on preconfigured systems,
    the Installation Guide is somewhat less important, but it includes key information
    on Kickstart.


    +   - Deployment Guide The Deployment Guide is perhaps the most important with
    respect to Red Hat recommendations on how services can be configured for basic
    operation.


    +   - Security-Enhanced Linux The Security Enhanced Linux Guide details the options
    that can help further secure your systems.


    # Some Pointers


    Once you''ve finished reading this book, set aside some time to a thorough review.
    You might want to return to the book several times and make use of all the methods
    it offers for reviewing the material:


    +   - Retake the Self Tests. Focus on the labs, as there are no multiple-choice
    (or fill-in-the-blank) questions on the Red Hat exams. I have included fill-in-the-blank
    questions to test your mastery of the practical material in each chapter.


    +   - Solve the Labs again. Lab questions provide the essence of a hands-on exam.
    Furthermore, if you know how to solve practical lab problems, you''ll be ahead
    of the competition in a job search. While getting certified as an RHCSA and RHCE
    is great, the objective for most of you is to get a better job.'
