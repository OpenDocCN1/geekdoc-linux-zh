  md: '# Change Passwords and Adjust Password Aging for Local User Accounts


    # Create, Delete, and Modify Local Users Accounts


    The essence of user (and group) accounts on a Linux system rests in the shadow
    password suite. The information from that suite is contained in the passwd, shadow,
    group, and gshadow files in the /etc directory. To verify characteristics for
    users and groups, it can help to know each component in these files.


    You can create new users with the usermadd command. When you run a command like
    useradd1, default options are set in the /etc/login.defs file. If you know the
    options for these commands, you can set users for nonstandard groups, set up temporary
    accounts, define different shells, and more.


    You can delete users with the usdel command. As the home directories of deleted
    users are retained by default, you should be aware of the usdel -r command, which
    deletes those home directories and their contents, along with any mailbox file
    that might exist in the /var/mail directory.


    You can modify user information directly from the shadow password suite files
    or with the usermod command. With the right options, you can modify the information
    contained within the files of the shadow password suite. In many cases, it''s
    better to use commands, as multiple files can be affected.


    Just remember, when you create a new user, the user private group scheme means
    that user is the exclusive member of his or her own group. By default, the user
    and group have the same name and ID number.


    One implicit part of this objective is the way regular users are given administrative
    privileges in the /etc/sudoers file.


    # Change Passwords and Adjust Password Aging for Local User Accounts


    Every user has the right to change the password for his or her account with the
    passwd command. The administrative user has the right to change the password for
    any user with the passwd username command.


    Password aging is a security component. If a black-hat hacker gets hold of your
    password database, or applies social engineering techniques to specific users,
    passwords may eventually be compromised. Aging can be employed to force users
    to change their passwords on a periodic basis.'
  merge: -1
  pgno: 174
