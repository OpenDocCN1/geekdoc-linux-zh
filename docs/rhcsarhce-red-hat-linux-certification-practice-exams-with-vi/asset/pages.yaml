    # Lab I


    This is a straightforward lab testing your skills with ownership and permissions.
    If successful, you''ll see something similar to the following output to the ls
    -l /shared/test1 command:


    ```

    -rw-r--r-- 1 tester root 0 Feb 21 12:08 test1

    ```


    Since I created the test file with the touch command, it has no content and is,
    therefore, 0 bytes, as shown in the output. It''s acceptable if the file is of
    some different size. It''s also acceptable if the group owner of the file is other
    than root. (Yes, the file is writable by the users tester and root, but it should
    be understood that the root user is all-powerful).


    # Lab 2


    To set up any filesystem ACLs, you should set it up in the /etc/fstab directory.
    Technically, since home is already mounted without ACLs in /etc/fstab, you could
    also set up a mount - remount /home in a file /etc/rc.local. The most efficient
    way to set up /home in the /etc/fstab for the gamma.example.net system is to set
    it in /etc/fstab. In that file, you will see an entry like:


    ```

