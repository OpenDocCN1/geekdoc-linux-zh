  md: '# 242 Chapter 15: The Samba File Server


    # Configure the Service to Start When the System Is Booted


    While this may seem repetitive, it''s important to make sure every service that
    you configure is booted in standard runlevels. For Samba, two services are in
    question: the main Samba service controlled by the /etc/init.d/smb script and
    the NetBIOS Name controlled by the /etc/init.d/nmb script. The following commands
    make sure that Samba and the NetBIOS Name services start in runlevels 3 and 5:


    ```

    #Chkconfig --level 35 smb on

    #Chkconfig --level 35 nmb on

    ```


    Alternatively, the following commands make sure that both services start in runlevels
    2, 3, 4, and 5:


    ```

    #Chkconfig smb on

    #Chkconfig nmb on

    ```


    Of course, you can make sure these services are running before a reboot with the
    following commands:


    ```

    # /etc/init.d/smb start

    # /etc/init.d/nmb start

    ```


    # Configure the Service for Basic Operation


    Once Samba and the corresponding NetBIOS name services are running, the default
    configuration of Samba is already set up for basic operation—sort of. Given the
    basic [printers] stanza in the smb.conf configuration file, it supports access
    to printers configured via the Common Unix Printing System (CUPS) service.


    But to actually access those printers, or any shared directory in Samba, you have
    to set up a user authentication database. The default “trivial database” is configured
    with the following directive:


    ```

    passdb backend = tdsamba

    ```


    You could connect the trivial database to a Lightweight Directory Access Protocol
    (LDAP) server, but the details go beyond the “basic operation” required by the
    objective. You can set up the default database with the smbpasswd command, based
    on users configured locally in /etc/passwd. The following command adds the'
  merge: -1
  pgno: 277
- img_proc: true
  md: '# Configure Host-Based and User-Based Security for the Service 243


    user named testuser, prompting twice for a password (which may differ from the
    Linux password):


    ```

    $ smbpasswd -a testuser

    ```


    This command sets up users and passwords in a binary file, passdb.tdb, in the
    /var/lib/samba/private directory. You can then review shares available to user
    testuser with the following command, which prompts for that password:


    ```

    $ smbclient \localhost -U testuser

    ```


    You''ll see the testuser share in the output. You can then mount the share on
    a directory such as /mnt with the following command, which prompts for the testuser
    Samba password:


    ```

    $ mount.cifs //localhost/testuser /mnt -o username=testuser

    ```


    You might see a "Permission denied" error when trying to read the /mnt directory.
    That''s due to a SELinux boolean. Run the following command, and you''ll be able
    to read the contents of the testuser home directory with the ls /mnt command:


    ```

    $ setsebool -P samba_enable_home_dirs 1

    ```


    You can set up shares in other directories in a similar fashion; commented templates
    are available in the default smb.conf file. Be aware that you may need to set
    up the samba_share_t file type and possibly one or more the booleans shown in
    Table 15-1.


    If you make any changes to the Samba configuration file, run the testpart to check
    the syntax. To see how it looks from a client such as blackhat.example.net, run
    the testpart /etc/samba/smb.conf client blackhat.example.net command. (You may
    substitute an IP address.)


    # Configure Host-Based and User-Based Security for the Service


    You''ve already reviewed the basics of user-based security in Samba. For access
    to user-based shares, those users have to be registered in some Samba-aware user
    database such as passwd.tdb. If you set up user-based security, don''t forget
    to include'
  merge: -1
  pgno: 278
- img_proc: true
  md: '# 244 Chapter 15: The Samba Server


    such users with the smbpasswd -a username command. Just you are, you could override
    user-based security with the following directive:


    ```

    public = yes

    ```


    If you do up users, you can limit access among these users with the valid users
    directive. For example, the following directive limits access to users randy and
    nancy:


    ```

    valid users = randy nancy

    ```


    To set up access to outside systems, you have to open up four ports in the local
    firewall: UDP ports 137 and 138, along with TCP ports 139 and 445. The Firewall
    Configuration tool automates this process; when you select Samba as a "Trusted
    Service," the tool adds the following directives to the /etc/sysconfig/iptables
    file:


    ```

    -A INPUT -m state --state NEW -m udp -p udp --dport 137 -j ACCEPT

    -A INPUT -m state --state NEW -m udp -p udp --dport 138 -j ACCEPT

    -A INPUT -m state --state NEW -m tcp -p tcp --dport 139 -j ACCEPT

    -A INPUT -m state --state NEW -m tcp -p tcp --dport 445 -j ACCEPT

    ```


    If desired, you can use these commands as a template for a configuration firewall
    rule that limits access by IP address. To limit access to systems on the 192.168.122.0
    network, you could include -s 192.168.122.0/24 before the --dport option.


    Alternatively, you can set up limits in appropriate stanzas in the smb.conf file.
    For example, the following directive limits access to all systems on the 192.168.122.0/24,
    except the system on IP address 192.168.122.240:


    ```

    hosts allow = 192.168.122.

    hosts deny = 192.168.122.240

    ```


    # Provide Network Shares to Specific Clients


    This objective is setting up a Samba share of some hypothetical directory, limited
    to contain hosts. For the purpose of this chapter, you set up a share in the /linux
    directory. Populate it with a few files so you can verify success. Now set up
    a stanza in the smb.conf file. The following lines call it share named [linux],
    with a comment that appears in the output to a client-side smclient command.


    ```

    [linux]

    comment = Shared samba directory

    path = /linux

    ```'
  merge: -1
  pgno: 279
- img_proc: true
  md: '# Provide Network Shares Suitable for Group Collaboration 245


    You''ll want to add more to limit the share to a specific client. For example,
    the following line would limit access to systems on the .example.net network,
    except the blackhat.example.net system (feel free to substitute IP addresses):


    ```

    hosts allow = .example.net EXCEPT blackhat.example.net

    ```


    Of course, you also have to take the following actions with respect to local firewalls
    and SELinux booleans:


    +   * Allow access through the firewall; if you''ve limited access in the Samba
    configuration file with the hosts allow directive, all you need to make Samba
    a “Trusted Service” in the Firewall Configuration tool.

    * Set appropriate SELinux contexts on the shared directory, along with the files
    contained there; one way to do this is with the chcon -R -t samba_share_t /linux
    command.


    # Provide Network Shares Suitable for Group Collaboration


    While groups can be configured in a substantial number of ways on a Microsoft-based
    network, it''s usually best to keep the requirements as simple as possible. The
    default smb.conf configuration file already includes a comment share stanza pretrained
    for group collaboration. When combined with the configuration requirements associated
    with a group directory, you can set up a Samba network share suitable for group
    collaboration. You may use the following steps as a checklist to set up that share.


    +   * Set up a new group; make any desired users members of that group. For this
    example, call it group1. Set it up with standard user and group management commands
    described in Chapter 8. Don''t forget to set up a stanza for the share, such as:

    [testshare]

    * Create an appropriate /home directory such as /home/samba, configured with 2770
    permissions. Limit access to and give group ownership of the directory to group1.


    ```

    path = /home/samba

    valid users = @group1

    ```'
  merge: -1
  pgno: 280
- img_proc: true
  md: '# 246 Chapter 15: The Samba File Server


    3. Alternatively, the following directives limit access if ownership has already
    been properly configured:


    ```

    directory mask = 2770

    create mask = 2770

    ```


    4. Set up the samba_share_t file type on that directory, along with the files
    contained therein. Make sure that it''s reflected on a permanent basis with the
    semanage fcontent command. (For an explanation of how these commands are used,
    see Chapter 11 of the Study Guide.)


    5. Check the syntax with the testparam command.


    6. Make sure subject users are included in both the Linux and Samba password authentication
    databases.


    7. Reload the revised Samba configuration file with the /etc/init.d/smb reload
    command.


    # CERTIFICATION SUMMARY


    While the only package associated with the CIFS file server package group is samba,
    it also requires several other packages as dependencies, including samba-common
    for configuration files and samba-client for client utilities. Samba includes
    two service scripts in the /etc/init.d directory, smb and nmb, both of which must
    be set as active in appropriate runlevels during the boot process.


    Shared Samba files can be configured with the samba_share_t file type. Shared
    Samba home directories can work if you activate the samba_enable_home_dirs boolean.
    Samba communicates over UDP ports 137 and 138, along with TCP ports 139 and 445.


    Although Samba users must exist in a Linux user database, you also need to create
    a separate Samba database for each user with the smpasswd command. Once you''ve
    configured the Samba configuration file /etc/samba/smb.conf, you can test the
    syntax with the testparam command. You can even test how the configuration file
    appears to external systems with the appropriate switches. If you''re setting
    up a Samba share for a group, you can leverage an existing special group, if it''s
    configured with appropriate ownership and permissions, as discussed in Chapter
    8 of the Study Guide.'
