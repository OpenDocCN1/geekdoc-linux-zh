  md: '# # INTRODUCTION


    # # The Red Hat Exam Challenge


    This introduction covers the reasons for pursuing industry-recognized certification,
    explains the importance of your RHCSA or RHCE certification, and prepares you
    for taking the actual examinations. It gives you a few pointers on how to prepare,
    what to expect, and what to do on exam day.


    This book covers every published exam objective at the time of writing. For the
    latest objectives, see www.redhat.com/training/courses/ex200/examobjective and
    www.redhat.com/training/courses/ex300/examobjective. Red Hat has also published
    a syllabus for its prep courses for these exams, described shortly. While the
    published exam objectives are accurate, the prep course syll provide additional
    information. Each Red Hat prep course provides an excellent grounding in systems
    administration, network administration, security, and more. To that end, this
    book includes coverage based on the public syllabus of Red Hat courses RH124,
    RH134/RH135, and RH254/RH255, described later.


    Nevertheless, this book is not intended to be a substitute for any Red Hat course.


    # # Leaping Ahead of the Competition!


    Red Hat''s RHCSA and RHCE certification exams are hands-on exams. As such, they
    are respected throughout the industry as evidence of genuine practical knowledge.
    If you pass, you will be head and shoulders above the candidate who has passed
    only a "standard" multiple-choice certification exam.


    Red Hat has offered its hands-on exams since 1999. They''ve evolved over the years.
    As detailed in Chapter 1, the RHCSA is a 2.5-hour exam, and the RHCE is now a
    2.0-hour exam. The requirements are detailed in the Exam Readiness Checklist list
    in this introduction. While the passing score for these exams is not currently
    published, it was at one time 70 percent for the relevant Red Hat exams on RHEL
    5. Published third-party reports suggest that passing score has not changed.


    # # Why a Hands-On Exam?


    Most certifications today are based on multiple-choice exams. These types of exams
    are relatively inexpensive to set up and easy to proctor. Unfortunately, many
    people'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# xiv RHCSA/RHCE Red Hat Linux Certification Practice Exams with Virtual Machines


    without real-world skills are good at taking multiple-choice exams. In some cases,
    the answers to these multiple-choice exams are already available online. This
    results in problems on the job with "certified" engineers, who have an image as
    "paper tigers" and do not have any real-world skills.


    In response, Red Hat wanted to develop a certification program that matters. In
    my opinion, they have succeeded with the RHCSA, the RHCE, and their other advanced
    certifications.


    Linux administrators sometimes have to install Linux on a computer or virtual
    machine. In fact, the RHCSA includes several objectives on this subject. Depending
    on the configuration, they may need to install Linux from a central source through
    a network. Installing Linux is not enough to make it useful. Administrators need
    to know how to configure Linux: add users, install and configure services, create
    firewalls, and more.


    ![](img/ad9f3468206ad4765a06e762bd96b965_25_0.png)


    The RHCSA and RHCE exams are Red Hat exams. Knowledge of Unix or a Linux distribution
    such as Ubuntu is certainly helpful, as well as experience with services like
    Apache, SMB, NFS, DNS, iptables, and SSH. But it is important to know how to set
    up, configure, install,


    and debug these services under Red Hat Enterprise Linux (or rebuild distributions
    that use the same source code, such as Scientific Linux, CentOS, or Oracle Linux).
    Do not use Fedora or Ubuntu Linux to study for the Red Hat exams.


    # Prepare for the RHCSA and RHCE Exams


    With the release of RHEL 6, Red Hat has introduced the RHCSA as a replacement
    for the RHCT. The topics associated with the RHCSA are now independent of the
    RHCE. Yes, there is some overlap. For example, SELinux is covered on both exams.
    The coverage is different. The RHCSA and RHCE certifications are based on separate
    exams.


    The RHCSA is now the entry-level Red Hat certification. While you can take the
    RHCE exam first, Red Hat won''t award you an award unless you''ve passed the RHCSA
    exam. Some candidates take both exams on the same day. As discussed in Chapter
    1, Red Hat has also publicly stated that their exams are now "presented electronically."
    This includes (most) labs and samples in electronic format on the first VM, available
    in compressed format, on the DVD that accompanies this book.'
