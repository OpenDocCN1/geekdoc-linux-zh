  md: '# The Point Releases Don''t Matter


    Red Hat releases "point" updates to all of its enterprise Linux versions. There
    is no significant difference among these releases. All RHEL 6 releases include
    kernel version 2.6.32. All commands, tools, and utilities have the same intended
    functionality throughout the RHEL 6 lifecycle. While third-party software such
    as the Firefox web browser may change, that has no effect on the Red Hat exam
    objectives.


    So if you can''t get the latest point release of RHEL 6 or a rebuild distribution,
    don''t worry about it.


    > Yes, version 2.6.32 sounds "old" compared to current "stable" releases in the
    3.2 and later series. Rest assured, Red Hat maintains the RHEL 6 kernel in different
    ways. And the stability of the "older" kernel promotes reliability on mission-critical
    systems.


    ![](img/ad9f3468206ad4765a06e762bd96b965_44_0.png)


    # The Choices


    If you don''t need the same "look and feel" as RHEL to prepare for an exam, third-party
    rebuilds as CentOS and Scientific Linux are available. As such, "rebuilds" use
    the same source code as RHEL, and they are functionally almost identical to RHEL.
    They''ve been built from the source code released by Red Hat under open source
    licenses. They''re different in three basic ways:


    +   - No Red Hat trademarks. It means a rebuild distribution has a different "look"
    than RHEL.

    - RHN. That''s not a problem, as the associated administrative commands work in
    essentially the same way for rebuild distributions without access to the RHN.

    - Additional files in the /etc/yum.repos.d directory to configure connections
    to remote repositories.


    With these limits in mind, rebuild distributions such as CentOS 6 and Scientific
    Linux 6 work in the same way as RHEL 6. They have the same file structure as RHEL
    6. They include the same tools, which function identically to how they function
    in a genuine copy of RHEL 6.'
