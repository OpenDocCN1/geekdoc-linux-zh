    Red Hat presents its exams electronically. For that reason, the exams in this
    book are available from the companion CD, in the SampleExams/ subdirectory. This
    exam is in the file named RHCE_practice_exam2 and is available in .txt format.


    In most cases, there is no one solution, no single method to solve a problem or
    install a service. There are a nearly infinite number of options with Linux, so
    I can''t cover all possible scenarios.


    Don''t proceed to the next page until you''re finished with the sample exam!'
  merge: -1
