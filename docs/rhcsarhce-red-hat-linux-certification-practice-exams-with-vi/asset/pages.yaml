  md: "# RHCSA Sample Exam 2 Discussion\n\nIn this discussion, I'll describe one way\
    \ to check your work to meet the requirements listed for the RHCSA Sample Exam\
    \ 2.\n\n+   1. One way to see if SELinux is in permissive mode is to run the sestatus\
    \ command. Enforcing mode is the default, as set in the /etc/sysconfig/selinux\
    \ file. To make sure permissive mode is set, you have to change that default.\n\
    2. When encrypting a new partition, remember the following basic steps:\n   a)\
    \ Create a partition; call it /dev/sda2.\n   b) Randomize the content of the partition\
    \ with a command like dd if=/dev/urandom of=/dev/sda2.\n   c) Set up the new filesystem\
    \ with the cryptsetup luksFormat /dev/sda2 command, in this case, with the I will\
    \ pass! passphrase.\n   d) Give that new system a name using the cryptsetup luksOpen\
    \ /dev/sda2 test1 command (you may substitute a different name for test1) Format\
    \ the new encrypted volume, /dev/mapper/test1, to the ext3 file system with a\
    \ command like mkfs.ext3.\n   f) Test a mount of the new encrypted volume on the\
    \ /encrypt directory. When satisfied, configure it in /etc/fstab.\n\n+   3. As\
    \ discussed in Chapter 9 of the Study Guide, one way to set up VNC services with\
    \ VMs is by installing the Tiger VNC server on the VM. Once installed, you need\
    \ to configure the /etc/sysconfig/vncservers file. The following entries set up\
    \ access to the GUI desktop for tester:\n\n```\nVNCSERVERS=\"2:testuser\"\nVNCERARGS[2]=\"\
    -geometry 800x600\"\n```\n\nThen open ports 5900 and 5901 in the firewall, and\
    \ log into the tester account. As that user, you can run the vncserver :1 command\
    \ to enable access over the noted pair of ports using TCP. You'll be prompted\
    \ for a password. (If you followed the instructions in the sample exam, the password\
    \ is mcgraw.) Once complete, you can install a VNC client on the physical host,\
    \ and verify access to the gamma.example.net system."
  merge: -1
