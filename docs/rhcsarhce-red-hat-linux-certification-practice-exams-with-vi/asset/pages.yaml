- img_proc: true
  md: '# Lab 4


    First, you can confirm that access to the SSH server is regulated by TCP Wrappers
    with the following command:


    ```

    # ldd /usr/bin/sshd | grep libwrap.so.0

    ```


    The TCP Wrappers files that regulate access are /etc/hosts.allow and /etc/hosts.deny.
    There are several different combinations of directives that prohibit access from
    just the blackhat system. One way to do this is to add the following directive
    to the /etc/hosts.deny file on the gamma.example.net system:


    ```

    sshd : 192.168.122.240

    ```


    Of course, you could prohibit access via the iptables-based firewall. Assuming
    you''ve retained the default TCP port 22, you could add the following rule before
    the rule accepts connections from other systems:


    ```

    -A INPUT -m state --state NEW -m tcp -p tcp -s 192.168.122.240 \n--dport 22 -j
    REJECT

    ```


    However, TCP Wrappers is also an important security tool. At some point, you may
    be asked to use both systems to create a layered security model.


    # Lab 5


    There are two basic ways to meet the requirements of this lab. You could set up
    DenUsers (or perhaps DenyGroups) directives for the users listed in the /etc/vsftd/ftpusers
    file. That is a longer, but straightforward process.


    Using the method I personally prefer, I took the following steps:


    +   1. Copy the /etc/vsftd/ftpusers file to the /etc/sshd directory. While not
    required, I renamed that file to sshusers.


    +   2. Navigate to the /etc/pam.d directory in two different consoles. Open the
    vsftpd and sshd files in that directory. The vsftpd file includes the following
    directive to the points I noted:


    ```

    auth required pam_listfile.so item=user sense=deny \nfile=/etc/vsftd/ftpusers
    onerr=succeed

    ```


    +   3. I copied the line shown to the /etc/pam.d/sshd file, as the second auth
    directive. Of course, I changed the file reference to file=/etc/ssh/sshusers.


    +   4. As authentication procedures via PAM, the changes should be implemented
    automatically. In this case, you can test the result with the root administrative
    user. If successful, that user won''t be able to log into the SSH server, locally
    or remotely.'
  merge: -1
  pgno: 208
- img_proc: true
  md: '# Lab 6


    You can set this up either via iptables and/or TCP Wrappers. With iptables, you
    can do so with a reference to the standard IPT server port port 21, with the following
    directives:


    ```

    -A INPUT -m state --state NEW -m tcp -p tcp -s 192.168.122.240 \

    --dport 21 -j REJECT


    -A INPUT -m state --state NEW -m tcp -p tcp -s 192.168.122.0/24 \

    --dport 21 -j ACCEPT

    ```


    Remember, rules in iptables chains are considered in order. It is, therefore,
    important to set up the REJECT rule first.


    Alternatively, you can set this up via TCP Wrappers in the /etc/hosts.allow and
    /etc/hosts.deny files. Add the following entry to /etc/hosts.allow:


    ```

    vsftpd : 192.168.122. EXCEPT 192.168.122.240

    ```


    and the following entry to /etc/hosts.deny:


    ```

    vsftpd : ALL

    ```'
  merge: -1
