- img_proc: true
  md: '# 272 Chapter 17: Administrative Services: DNS, FTP, and Logging


    # Configure the Service to Start Whennthe System Is Booted


    By this point in the book, you should be quite familiar with the commands needed
    to activate a service in appropriate runlevels. For the purpose of this chapter,
    the following is a list of services that you should inspect to make sure they''re
    appropriately configured to "start when the system is booted":


    ```

    # chkconfig --list named

    # chkconfig --list nptpd

    # chkconfig --list ntpdate

    # chkconfig --list rsyslog

    # chkconfig --list sysstat

    ```


    The output should show all of these services, at least those you''re required
    to configure, active in at least runlevels 3 and 5.


    # Configure the Service for Basic Operation


    Four services are covered in this chapter. When installed, the configuration files
    for each one them are already configured for basic operation. Assuming you set
    them to start at appropriate runlevels, they''re already configured for basic
    operation under the following conditions:


    +   - **System status** The sysstat service is configured to log system accounting
    every ten minutes. If you want a daily summary of the results a bit early, say
    within the couple of hours associated with an exam, you could modify the specified
    time for generating that report in the sysstat script in /etc/cron.d directory.


    +   - **Logging** The RHEL 6 system logging service, rsyslog, is configured to
    log events from the local system. To configure it as a server or client, you need
    to make changes to the /etc/rsyslog.conf file described earlier in this chapter.


    +   - **NTP services** If you activate the ntp service, the default configuration
    in the /etc/ntp.conf file includes NTP servers to synchronize the local clock.


    +   - **DNS** The default /etc/named.conf file installed from the package named
    bind is configured as a caching-only name server.'
  merge: -1
  pgno: 307
- img_proc: true
  md: '# Configure Host-Based and User-Based Security for the Service


    User-based security is not supported for any of the services discussed in this
    chapter. On the other hand, host-based security is supported for the relevant
    network services: System logging, NTP, and DNS.

    You can configure host-based security for these services with the help of standard
    iptables-based firewalls and the communication port defined for these services.
    The default port numbers for system logging, NTP, and DNS are 514, 123, and 53,
    respectively.


    As discussed with other services in this book, you could set up host-based security
    in the Firewall Configuration tool, with the help of a custom rule. You might
    combine host-based security for all three of these services with the following
    lines in a single file:


    ```

    -A INPUT -m state --state NEW -m tcp -p tcp -s 192.168.122.0/24 --dport 514 -j

    ACCEPT

    -A INPUT -m state --state NEW -m tcp -p tcp -s 192.168.122.0/24 --dport 123 -j

    ACCEPT

    -A INPUT -m state --state NEW -m tcp -p tcp -s 192.168.122.0/24 --dport 53 -j

    ACCEPT

    -A INPUT -m state --state NEW -m udp -p udp -s 192.168.122.0/24 --dport 53 -j

    ACCEPT

    ```


    # Configure a Caching-Only Name Server


    As suggested earlier, a caching-only name server is already configured based on
    the default installation of the bind package. But that installation is only good
    for the local system. Look at the /etc/named.conf file. The following directive
    specifies the IPv4 address to which the system listens:


    ```

    listen-on port 53 { 127.0.0.1; };

    ```


    To extend that directive to the network, you need to add the IP address of the
    network card. The following entry works for the gamma.example.net system:


    ```

    listen-on port 53 { 127.0.0.1; 192.168.122.20; };

    ```


    The noted entry also indicates why DNS servers are typically installed on systems
    with fixed IP addresses. If you were to specify a host name, it would have to
    look for'
