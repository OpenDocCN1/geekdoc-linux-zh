  md: "# Configure Host-Based and User-Based Security for the Service\n\nWith all\
    \ other services, you can configure host-based security with the help of iptables-based\
    \ firewalls. To allow access to Apache, you normally have to set up access through\
    \ ports 80 and 443, which corresponds to regular (HTTP) and secure (HTTPS) services.\
    \ These ports are configured with the following Listen directives in the httpd.conf\
    \ and ssl.conf configuration files.\n\n```\nListen 80\nListen 443\n```\n\nFor\
    \ systems with multiple network cards, you can further limit access by specifying\
    \ the IP address of the target network card:\n\n```\nListen 192.168.122.20:80\n\
    Listen 192.168.122.20:443\n```\n\nHost-based security can be configured more specifically\
    \ in Apache configuration files. In stanzas that support access to directories\
    \ and virtual sites, you can configure access limits starting with the Order deny,allow\
    \ or Order allow,deny directive. You can then include directives such as the following\
    \ for domain names:\n\n```\nAllow from admin.example.com\nDeny from example.com\n\
    ```\n\nYou could also apply such limits to IP addresses. One example is shown\
    \ here:\n\n```\nDeny from 192.168.122.240\nAllow from 192.168.122.122\n```\n\n\
    In support of user-based security, you can set up different types of authentication\
    \ based on the AuthType Basic directive. The following stanza configures an \"\
    Account Information Required\" window that appears when users try to connect to\
    \ the associated URL:\n\n```\n<Directory \"/var/www/html/protect\">\n  AuthType\
    \ Basic\n  AuthName \"Account Information Required\"\n  AuthUserFile /etc/httpd/acctinfo\n\
    \  Require user tester\n</Directory>\n```"
  merge: -1
  pgno: 259
- img_proc: true
  md: '# Configure a Virtual Host


    You can set up the account file with the htpasswd command. If desired, you could
    organize such users into groups and use the AuthGroupFile and Require group directives
    as appropriate.


    # Configure a Virtual Host


    Virtual hosts are used to configure multiple web sites on a single Apache server,
    using a single IP address. The default Apache configuration file includes the
    following sample virtual host container:


    ```

    #<VirtualHost *:80>

    # ServerAdmin webmaster@dummy-host.example.com

    # DocumentRoot /www/dummy-host.example.com

    # ServerName dummy-host.example.com

    # ErrorLog logs/dummy-host.example.com-error_log

    # CustomLog logs/dummy-host.example.com-access_log common

    #</VirtualHost>

    ```


    Of course, you need to activate the desired directives from this container and
    revise obtain options such as the URL and directories for the requirements of
    the subject web site. In addition, make sure that target directories have the
    same SELinux contexts as the default /var/www/html and the same default contexts
    in the file_contents file in the /etc/selinux/targeted/contexts/files directory.
    For the noted directives, commands are:


    ```

    # chcon -R -u system_u -t httpd_sys_content_t \

    /www/dummy-host.example.com

    # semanage fcontext -a s system_u -t httpd_sys_content_t

    /www/dummy-host.example.com

    ```


    To activate name-based virtual hosts, you also need to activate the following
    directive:


    ```

    #NameVirtualHost *:80

    ```


    For secure virtual hosts, you would need to add a corresponding NameVirtualHost*:443
    directive. For clarity, you should include it in the ssl.conf file. Just be aware,
    all information in ssl.conf is automatically included in the Apache configuration
    courtesy of the Include conf.* directive. A similar template for secure virtual
    hosts exists in the ssl.conf file in the <VirtualHost_default_:443> container.
    Just remember to substitute an asterisk (*) for _default_in in any such containers
    that you create.'
  merge: -1
  pgno: 260
