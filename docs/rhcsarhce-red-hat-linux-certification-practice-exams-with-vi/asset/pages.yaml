  md: '# Introduction


    Work with Red Hat Enterprise Linux. Install it on a computer that you don''t need
    for any other purpose. Configure the services described in this book. Find different
    ways to secure each of these services. Test the results from systems inside and
    outside a network.


    As you read this book, you have the opportunity to practice configuring RHEL in
    a number of different ways. With three different VMs available on the DVD, you
    get to test these options with different network services. Then you can work with
    the different network services. Testing your work becomes especially important
    when verifying the security features that are required on an exam, or in a production
    network.


    # Red Hat Certification Program


    Red Hat offers several courses that can help you prepare for the RHSA and RHCE.
    Most of these courses are four or five days long. In some cases, the courses are
    offered electronically.


    These aren''t the only Red Hat courses available; there are a number of others
    related to the Red Hat Certified Architect (RHCA), Red Hat Certified Virtualization
    Administrator (RHCVA), Red Hat Certified Datacenter Specialist (RHCDS), and Red
    Hat Certified Security Specialist (RHCSS) certifications. But study this first;
    the RHSA and RHCE are prerequisites for all Red Hat certifications but the RHCA.


    # Should You Take an RHSA/RHCE Course?


    This book is not intended as a substitute for any particular Red Hat RHSA or RHCE
    prep course. However, the topics in this book are based in part on the topics
    listed in the course outlines provided at www.redhat.com/courses. By design, these
    may help Linux users qualify as real-world administrators and can also be used
    as such. Just remember, Red Hat can change these topics and course outlines at
    any time, monitor www.redhat.com for the latest updates. Table 1 describes those
    courses associated with the RHSA and RHCE exams.


    The courses given by Red Hat are excellent. The Red Hat instructors who teach
    these courses are highly skilled. If you have the skills, it is the best way to
    prepare for the RHSA and RHCE exams. If you feel the need for classroom instruction,
    read this book, and take the appropriate course.


    If you''re not sure you''re ready for the course or book, navigate to www.mhprofessional.com/product.php?cat=39&isbn=007180160X
    and take the pre-assessment test. It''s different from the Red Hat pre-assessment,
    as it includes'
