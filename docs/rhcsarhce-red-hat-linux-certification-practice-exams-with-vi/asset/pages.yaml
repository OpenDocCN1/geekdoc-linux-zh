  md: '# 240 Chapter 15: The Samba File Server


    When properly configured, Samba can make a Linux system work seamlessly on a Microsoft-based
    file-sharing network. Samba is the Linux implementation of current Microsoft file-sharing
    protocols, starting with the Server Message Block (SMB) system and upgraded to
    support the Common Internet File System (CIFS). Samba is used on all Unix-based
    operating systems, including Linux.


    While Red Hat no longer includes a GUI tool to configure Samba, it does include
    a web-based tool in its optional repository, the Samba Web Administration Tool
    (SWAT). It''s available from the samba-swat package.


    # Install the Packages Needed tonProvide the Service


    The Red Hat implementation of the Samba service is simple. There''s one mandatory
    package associated with the CIFS file server package group: samba. So all you
    have to do to install the packages needed to provide the service is to run the
    following command:


    ```

    # yum install samba

    ```


    With dependencies, this command also installs the samba-client, samba-common,
    and samba-winbind-clients packages. Pay attention to the configuration files in
    the /etc/samba directory, along with commands like mbstatus, smbcontrol, smbpasswd,
    and the smb and nmb scripts in the /etc/init.d directory.


    If you want to install SWAT, run the following command:


    ```

    # yum install samba-swat

    ```


    Just be aware that because it''s part of RHEL 6 optional repository, Red Hat is
    under no obligation to make this tool available during an exam. Focus your studies
    on the Samba configuration files, especially /etc/samba/smb.conf.


    # Configure SELinux to Support the Service


    With other network services, Samba comes with risks. The different booleans shown
    in Table 15-1 are designed to minimize the risks in case of a security breach.'
  merge: -1
