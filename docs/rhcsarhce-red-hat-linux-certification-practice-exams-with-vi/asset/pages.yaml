  md: '# 96 Chapter 5: The Boot Process


    As suggested by the title, the RHCSA objectives described in this chapter are
    based on various events that happen during the boot process and, by implication,
    shutdown process as well. The chapter can be summed up by the first objective,
    based on what you can do to “boot, reboot, and shut down a system normally.” Even
    though RHEL 6 incorporates the Upstart system, it still uses elements known to
    the older SysInit system, runlevels. One key runlevel is known as single-user
    mode, which can be used to gain administrative-level access to a system.


    You can configure network services to any configured runlevel. Such services start
    when the boot process moves to runlevel. Finally, this chapter covers the system
    bootloader. Although other bootloaders exist for Linux, RHEL 6 is dedicated to
    the older version of the Grand Unified Bootloader (GRUB), 0.97. Those of you who
    have read the Study Guide may have noticed the NTP coverage at the end of Chapter
    5. Because of changes to the Red Hat objectives, information is covered in Chapter
    17. In addition, the Study Guide includes coverage of basic network configuration.
    Since it is not directly tied to a specific objective on the Red Hat exams, I''ve
    left that information out of this book.


    # Boot, Reboot, and Shut Down a System Normally


    As suggested by the title, this objective includes three components. The boot
    process starts when a system is powered up. Power-On Self-Test (POST) is complete,
    the boot process continues through the Basic Input/Output System (BIOS) or the
    newer UEFI Extensible Firmware Interface (UEFI).


    Next, the BIOS or UEFI looks for a bootloader on the Master Boot Record (MBR)
    of a connected hard drive. For RHEL 6, that’s the Grand Unified Bootloader (GRUB).
    While some other Linux distributions use GRUB version 2.0, RHEL 6 uses GRUB version
    0.97, controlled directly from the /boot/grub/grub.conf file.


    To understand how the Linux boot process works, you should understand the details
    of a GRUB configuration file. The following excerpt cites the contents of a GRUB
    configuration file:


    ```

    default=0

    timeout=5

    ```'
