  md: '# Chapter 4: RHCSA-Level Security Options


    The objectives at the heart of this chapter are focused on security. They start
    with the basic read, write, and execute permissions on a file, as they relate
    to user and group owners. They include features such as Access Control Lists (ACLs),
    and go on fundamental skills associated with Security Enhanced Linux (SELinux).
    If you''re comfortable with the objectives and labs in this chapter, you should
    be confident in your knowledge of Red Hat objectives as they relate to basic security.


    # List, Set, and Change Standard ugo/rwx Permissions


    The basic ownership and permissions associated with Linux files are known as discretionary
    access controls. The discretion is in the permissions, where ugo represents the
    three groups of owners associated with a file: users, groups, and others. In contrast,
    rwx represents the three basic permissions associated with a file: read, write,
    and execute.


    Each group of owners may be assigned a different set of rwx permissions. For example,
    the following output suggests the user account that owns the config file has read,
    write, and execute permissions on that file. In contrast, users who are members
    of the proctors group have read permissions. All other users have just read permissions
    on file named config. Here is an example output from the ls -l config command:


    ```

    -rwxr-xr--. 1 michael proctors 1754132 Jan 14 2011 config

    ```


    You should be aware of what you might see in the output for the ls command, as
    it relates to different types of files, different user and group owners, as well
    as special user and super group ID (SUID and SGID) permissions.


    Finally, you should understand that the default set of permissions on a file and/or
    a directory are determined by the value of umask, which is normally set to different
    values for regular users and the root administrative user. Other key commands
    associated with this objective are chmod, chown, and chgrp. You may also appreciate
    the specialized file attributes that are shown with the lsattr command, which
    can be changed with the chatter command.'
  merge: -1
  pgno: 113
- img_proc: true
  md: '# Diagnose and Correct File Permission Problems 79


    # Diagnose and Correct File Permission Problems


    With the commands described in the previous section, you should know how to diagnose
    and correct any problems that may exist with file permissions and, by implication,
    file ownership.


    Some file permission problems are straightforward. For example, if you want to
    edit a file that is already owned by your user account, write permissions are
    required on that file. You can set such permissions as needed with the `chmod`
    command. To correct such problems, you need to know the formats that can be used
    with the `chmod` command, such as octal format or by user. For example, while
    the following command sets read permissions for all users on the local file named:


    ```

    chmod 444 config

    ```


    this next command adds read permissions for all users on that same file, without
    overriding any other write or execute permissions that might already exist on
    ''that file:


    ```

    chmod a+r config

    ```


    If you see the following error message when trying to delete a file, the first
    issue that you should check is permissions and then ownership of that file.


    ```

    rm: cannot remove `local.conf`: Operation not permitted

    ```


    However, that file can also be protected by the "immutable" bit, which prevents
    even the root administrative user from directly deleting that file. Of course,
    that root user can use the immutable bit with the help of the `chattr` command.
    But that forces the root user to see what attribute bits are set on a file with
    the `lsattr` command.


    If you want to transfer ownership of files to another user, the `chown` command
    can be helpful. The `chgrp` command performs the same function for the group owners
    of a file. The `chown` command can be used to change the user and group owners
    of a file simultaneously.'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# Create and Manage Access Control Lists (ACLs)


    With ACLs, you can set up custom permissions on a file. But ACLs work only on
    filesystems with the acl option. Once active, you can read the ACLs of a file
    with the getfacl command. You may note that the baseline ACLs for a file match
    its read, write, and execute permissions.


    To make ACLs work, you need to set them on a directory and target files. Review
    the switches for the setfacl command in Table 4-1.


    To make sure you understand ACLs, try configuring a file in a home directory for
    one user. Set up access for a second user. Try limiting access to files in the
    /etc directory to that same user. Once you''ve confirmed success, make sure you
    know how to restore the original ACL settings for the target files and directories.


    # Configure Firewall Settings Using system-config-firewall or iptables


    The system-config-firewall command starts a firewall configuration tool. While
    the look and feel of the tool vary depending on whether you''re working from the
    console or the GUI, they have essentially the same functionality. In addition,
    these tools are front ends to the iptables command. As the effect of iptables
    is limited to IPv4 networks, you can limit your focus to firewalls as they relate
    to IPv4


    | Table 4-I | Switch | Description |

    |---|---||

    | Switches for the setfacl Command | -b (--remove-all) | Removes all ACL entries;
    retains standard ugo/rwx permissions |

    | | -k | Deletes ACL entries |

    | | -m | Modifies the ACL of a file, normally with a specific user (u) or group
    (g) |

    | | -n (--mask) | Omits the mask in recalculating permissions |

    | | -R | Applies changes recursively |

    | | -x | Removes a specific ACL entry |'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# Set Enforcing and Permissive Modes for SELinux


    Although firewall rules are based on TCP/IP ports as defined in the /etc/services
    file, they can also be configured to limit access by transport-level protocol,
    IP address, network device, and more. The default firewall for RHEL 6 supports
    access to a local SSH server.


    In most cases, all you need to use is the Firewall Configuration tool. In its
    Trusted Sections section, it includes options that help you configure access to
    a variety of services on the local system. Other options in this tool are more
    closely associated with RHCE objectives. If you need to use a specialized rule,
    the tool includes a Custom Rules section that supports access to a custom configuration
    file beyond /etc/sysconfig/iptables.


    Some users know the iptables command inside and out. If you configure firewall
    rules in your sleep, just remember to save any rules that you configure to the
    /etc/sysconfig/iptables file. The iptables-save command can list currently implemented
    rules. If you forward it to the noted file, the same rules will run the next time
    your system is booted. Of course, you should remember that iptables is also another
    network service, and you need to make sure it runs when you boot to standard runlevels.


    ![](img/ad9f3468206ad4765a06e762bd96b965_116_0.png)


    One way to test the characteristics of a firewall is with the nmap and telnet
    commands. The nmap command can test open ports from a remote system. The telnet
    command can test access to individual services on a specific port. Just be aware
    of the use of such tools on systems administered by others may be subject to legal
    restrictions.


    # Set Enforcing and Permissive Modes for SELLinux


    SELinux has an undeserved reputation for difficulty. Red Hat has done a lot of
    work to make SELinux easier to manage. As someone who is studying the RHCSA objectives,
    you shouldn''t be intimidated by SELinux. This first of five SELinux-based RHCSA
    objectives are straightforward. There are three modes available for SELinux: enforcing,
    permissive, and disabled.


    In enforcing mode, rule violations can stop a service from working. For example,
    if the SELinux contexts on a file server described in Chapter 1 aren''t appropriate,
    users can''t download files over that server.'
  merge: -1
  pgno: 116
- img_proc: true
  md: '# Chapter 4: RHCSA-Level Security Options


    In permissive mode, users can download those files, but audit messages will be
    sent to the /var/log/audit directory. For current SELinux settings, run the sestatus
    command. Normally, you see the following output:


    SELinux status: enabled

    SELinux mount: /selinux

    Current mode: enforcing

    Mode from config file: enforcing

    Policy version: 24

    Policy from config file: targeted


    If you change the SELinux status from disabled to enabled, you have to reboot
    to implement the change. The relabling process associated with enabling SELinux
    may add several minutes to the time required to reboot the system.


    You could change the post-reboot status of SELinux in the /etc/sysconfig/selinux
    file with the SELINUX directive. As noted in the file comments, it can be set
    to enforcing, permissive or disabled. As the focus is on targeted policies, it''s
    fair to expect SELINUXTYPE=targeted. If you want to change the status of SELinux
    before a reboot, you can run the setenforce permissive or setenforce enforcing
    commands.


    If you want SELinux configuration and error analysis tools, install the associated
    processes. One way to do so is with the following command:


    ```

    # yum install policycoreutils-gui setools-gui setbleshoot-server

    ```


    While the command focuses on GUI tools, it also installs related command-line
    tools. With most other Linux GUI tools, they''re front ends to what you''d run
    at the command-line interface.


    # List and Identify SELinux File and Process Context


    The operation of SELinux is secured by its contexts. As suggested by the objective,
    SELinux contexts apply to both files and processes. To review the SELinux contexts
    of files in the current directory, run the ls -Z command. To review the SELinux
    contexts of all running processes, run the ps -eZ command.'
  merge: -1
  pgno: 117
- img_proc: true
  md: '# Restore Default File Contexts


    Much of the work of SELinux is in the configuration of file contexts. As you can
    see from this sample output of the ls -Z command, there are four categories of
    file contexts: user, role, type, and level, as defined in Table 4-2.


    drwrxr-xr-x. root root system_u:object_r:httpd_sys_content_t:s0


    While the output from the ps -Z command may appear more complex, the output lists
    the the same categories of SELinux contexts as shown in Table 4-2. While most
    desktop process contexts are not defined, service contexts are frequently defined
    with an appropriate file-type label. For example, kernel contexts may be associated
    with the kernel_t file type.


    # Restore Default File Contexts


    The large number of SELinux file contexts, especially file types, it can be helpful
    to know how to restore a default file context. The key command for this objective
    is restorecon.


    The default file contexts in most directories is defined in a file_contexts file,
    in the /etc/selinux/targeted/contexts directory. Although you could edit this
    file directly, by adding special file contexts to the file_contexts.local file
    in the same directory, The SELinux Administration tool that you can start with
    the system-config-selinux command has a File Labeling section that implements
    changes in the file_contexts.local file. Alternately, you could use the semanage
    fcontext -a command to implement those changes, as described in one of the RHCE
    objectives in Chapter 11.


    The restorecon -F command is frequently applied to individual files or the contents
    of entire directories. It looks for the contexts as defined in the aforementioned
    files in the /etc/selinux/targeted/contexts directory.


    | Table 4-2 | Context | Description |

    |---|---|---|

    | SELinux File Contexts | user | Typically intended for system_u or unconfined_u.
    |

    | | role | While intended for role-based access control, most files are set to
    the object_r role. Many processes are associated with a system_r role. |

    | | type | Highly customized—different file types are normally configured for
    different services. |

    | | level | Associated with multilevel security; except many different levels
    of security sensitivity in the future |'
  merge: -1
  pgno: 118
- img_proc: true
  md: '# 84 Chapter 4: RHCSA-Level Security Options


    While the file_contexts file doesn''t directly address all directories, subdirectories
    are assumed to inherit the default context of higher level directories. For example,
    the /srv directory is configured with system_u, object_r, var_t, and so contexts.
    If you create a /srv/www subdirectory, it inherits those same contexts.


    # Use Boolean Settings to Modify System SELinux Settings


    Boolean settings are associated with the functionality of a number of services.
    To get a taste of what SELinux booleans can do, review the files in the /selinux/booleans
    directory. This is a virtual directory, filled with options that can be enabled.
    For example, the virt_use_usb boolean supports access from KVM-based VMs to USB
    devices that may be connected to the host system. Read the contents of that file
    with the following command:


    ```

    $ getsebool virt_use_usb

    ```


    Unless the default has been changed, you should see virt_use_usb ---> on the output,
    which means the boolean is active. If you want a full list of active and disabled
    booleans, run the getsebool -a command.


    While some SELinux options are further explained in man pages such as ftpd_selinux,
    standard documentation isn''t available for SELinux boolean. However, that''s
    one area where the SELinux Administration tool, shown in Figure 4-1, can make
    life easier. In figure, the SELinux category is highlighted, the file from the
    /selinux/booleans directory is shown, with a description and module. For example,
    the explanation for the virt_use_usb boolean is "Allow virt to use USB devices,"
    on the virt module.


    # Diagnose and Address Routine SELinux Policy Violations


    When a service has a problem, and you''re certain that the configuration of the
    service is correct, the next step is to check the audit.log file in the /var/lib/audit
    directory. Files in this directory are filled when SELinux identifies actions
    that violate SELinux policies. The contents of this file may seem cryptic. And
    it includes all SELinux messages, successes along with failures. While the seaudit
    command, by default, opens a GUI view of recent "denied" messages, the contents
    are still cryptic.'
  merge: -1
