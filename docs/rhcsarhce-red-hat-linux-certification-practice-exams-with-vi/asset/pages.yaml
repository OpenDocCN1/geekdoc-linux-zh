  md: '# Use /proc/sys and sysctl to Modify and Set Kernel Run-Time Parameters


    | TABLE 12-1 | Operator | Description |

    |---|---|---|n| Test Operators for Shell Scripts | -d | Looks to see if the file
    is a directory |

    | | -e | Asks if the file exists |

    | | -eq | Checks for equality of the noted variables or values |

    | | -f | Works if the file is a regular file |

    | | -ge | Looks to see if the first value is greater than or equal to the second
    |

    | | -le | Looks to see if the first value is less than or equal to the second
    |

    | | -lt | Looks to see if the first value is less than the second |

    | | -ne | Looks to see if the first value is not equal to the second |

    | | -r | Checks the file for read permissions |

    | | -s | Checks to see if the size of the file is greater than zero |

    | | -w | Inspects the file for write permissions |

    | | -x | Looks to the file for execute permissions |

    | | || / && | Asks if the previous expression is false / true |


    # Use /proc/sys and sysctl to Modify and Set Kernel Run-Time Parameters


    Kernel run-time parameters are dynamically loaded during the boot process, usually
    to the /proc/sys directory. You can edit specific files after the boot process
    is complete, or you can edit the /etc/sysctl.conf file to make sure preferred
    options are loaded during the boot process.


    For example, you can set IPv4 Forwarding in one of two ways. You could edit the
    appropriate file directly with the following command:


    ```

    # echo "1" > /proc/sys/net/ipv4/ip_forward

    ```


    Alternatively, you could edit the directive in the /etc/sysctl.conf file, an action
    that would survive a reboot:


    ```

    net.ipv4.ip_forward = 1

    ```


    Other kernel run-time parameters of interest are listed in Table 12-2. If a parameter
    is not already in the /etc/sysctl.conf file, just add it. Remember, kernel parameters
    are stored in the /proc/sys directory. The parameters shown may be found'
  merge: -1
  pgno: 226
