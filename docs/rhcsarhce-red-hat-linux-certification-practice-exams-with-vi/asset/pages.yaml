- img_proc: true
  md: '# 190 Chapter 12: RHCE Administrative Tasks


    Wile most of the RHCE objectives are focused on the configuration of different
    services, the objectives covered in this chapter are focused on different administrative
    tasks. As an administrator, you need to know how to create shell scripts. You
    can modify the kernel interacts with other Linux components by modifying files
    in the /proc/sys directory and the /etc/sysconf file.


    To take full advantage of RHEL 6, you should know how to create an RPM. With that
    custom RPM, you can install custom files on the systems that you administer. RHEL
    6 is built to work with remote storage. When you configure an iSCSI initiator,
    you demonstrate the ability to connect to one major type of network storage. When
    you set up a system as a Kerberos client, you are connecting it to a more secure
    network. And sometimes, you just need to set up a special route for network communications.


    # Use Shell Scripting to Automate System Maintenance Tasks


    RHEL 6 includes examples of scripts that you can create to automate your own system
    maintenance tasks. You can find these scripts in various /etc/cron.* directories.
    You can see the format used to schedule a script in the /etc/crontab file (minute,
    hour, day of month, month, day of week, username, command). To set up a shell
    script, you should start that script with the desired shell, such as bash:


    ```

    #!/bin/bash

    ```


    The shell may not be required if you''re using the script only to schedule a simple
    command. Don''t forget to use the full path to command. Otherwise, you may need
    to set up operators of some sort, such as the following conditionals: if and test.
    Depending on whether the conditionals are met, the script may follow up with then
    and else. Some scripts include loops with do and done.


    In general, scripts start by specifying some sort of condition, such as:


    ```

    [ ! -f /var/cache/man/whatis ]

    ```


    The character that looks like an exclamation point (!) is known as a bang, which
    in Linux means "anything but." The -f checks for a regular file. In other words,
    if the conditional is satisfied, if the /var/cache/man/whatis file is not a regular
    file. You should know some of the other conditional operators, including those
    in Table 12-1.'
  merge: -1
  pgno: 225
