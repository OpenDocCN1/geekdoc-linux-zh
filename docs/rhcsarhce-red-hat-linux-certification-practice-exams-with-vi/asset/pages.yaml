    \ the following rule to the local firewall:\n\n```\n-A INPUT -p icmp -m icmp --icmp-type\
    \ echo-request -j REJECT \\\n  --reject-with-icmp-host-prohibited\n```\n\n# Lab\
    \ 3\n\nMost of you know that port 22 is the standard port for the SSH service.\
    \ Black-hat hackers may scan systems, looking for open port. One way to promote\
    \ security is through obscurity. One way to implement obscurity is to set up nonstandard\
    \ ports for critical services.\n\nWhile you could set up SSH clients to use the\
    \ nonstandard port automatically, that can be a pain to implement on a variety\
    \ of clients. One simpler way to set up \"obscurity\" is by port forwarding. The\
    \ Configuration tool makes it easy. If you set up port forwarding on the physical\
    \ host system from the virtual network device, you can redirect traffic from port\
    \ 22 to the designated port 13579. When implemented with the Firewall Configuration\
    \ tool, it adds the following prerouting rules to the firewall:\n\n```\n-A PREROUTING\
    \ -i eth0 -p tcp --dport 22 -j MARK --set-mark 0x64 COMMIT\n-A PREROUTING -i eth0\
    \ -p tcp --dport 22 -m mark --mark 0x64 -j DNAT \\\n  --to-destination:13579\n\
    ```\n\nIt modifies the standard input firewall rule to:\n\n```\n-A INPUT -i eth0\
    \ -m state --state NEW -m tcp -p tcp --dport 13579 \\\n  -m mark --mark 0x64 -j\
    \ ACCEPT\n```\n\nIf you've made changes to the SSH server configuration, you should\
    \ now be able to log into the SSH server normally from other systems on the network.\n\
    For future, you may want to restore the original configuration. To do so, you\
    \ would:\n\n+   Delete the specified three rules that forward traffic from port\
    \ 22 to port 13579 in the local firewall.\n\n+   Delete the Port 13579 directive\
    \ in the sshd_config file in the /etc/ssh directory, and then reload the service\
    \ with a command like /etc/init.d/sshd reload."
  merge: -1
