  md: '# Chapter 3: Fundamental Command-Line Skills


    he questions and lab exercises in this chapter are focused on basic skills. Many
    of these skills were actually listed as "prerequisites" in the Red Hat objectives
    for RHEL 5. While these objectives have been incorporated into the main body of
    the topics covered by the RHCSA, they are still skills associated with users who
    are newer to Linux. For that reason, these skills are also covered in little detail
    in the Study Guide.


    # Access a Shell Prompt and Issue Commands with Correct Syntax


    As suggested by the title, you need to know how to access a shell prompt. You
    can run command-line commands from that prompt. Many experienced Linux users administer
    their systems from that prompt. Access to that prompt is trivial for these users.


    The default shell for most of the Linux distributions, including RHEL 6, is bash,
    short for the Bourne-Again Shell. You can access it directly by logging into the
    text console. You can also access it from the GUI by opening one of several available
    command-line screens, such as clicking Applications | System Tools | Terminal.
    The default version of this terminal is associated with GNOME, known as gnome-terminal.


    Normally, six consoles are available on RHEL 6 systems. You can switch between
    consoles by pressing CTRL-ALT plus the function key associated with the console.
    For example, the CTRL-ALT-F2 combination moves to the second virtual console.


    When the GUI is installed, RHEL 6 assigns it to the first virtual console. While
    the bash shell is the default, several other shells are available in RHEL 6, such
    as the ksh, dash, tsh, and 2sh shells. Commands described in this book assume
    the use of the bash shell. Users who run other shells may expect differences in
    syntax for many commands.


    When you log into a shell, either from a command-line console or through a GUI
    option such as the gnome-terminal, it first checks with the /etc/passwd file.
    The default shell for your user account, as defined in that file, determines the
    default shell.'
  merge: -1
  pgno: 97
- img_proc: true
  md: '# Create, Delete, Copy, and Move Files and Directories 63


    # Use Input/Output Redirection


    With the quantity of data available, administrators often think of it as a stream
    that can be redirected. In fact, data is already segregated into different streams
    for regular output and errors. As a certified administrator, you should be able
    to redirect data from a file as input to another program. Should you know how
    to redirect the output of a program to a file for later analysis and processing.
    To end that, standard input/output redirection operators are listed in Table 3-1.


    # Create, Delete, Copy, and Move Files and Directories


    The objective noted is straightforward, as each action can be associated with
    specific commands. But first, you should already realize that everything in Linux
    is represented as a file. Directories are simply a version of a file that can
    contain other files. This summary is very brief; most of the commands listed can
    include a significant number of switches and options.


    If a file does not already exist, the `touch filename` command creates it. If
    a directory does not already exist, the `mkdir dirname` command creates it.


    The `rm file1` command deletes files. The `rm dir dir1/` command deletes that
    directory, if it is empty. The `rm -r dir1/` command deletes that directory, with
    the files contained therein, recursively.


    The `cp file1 file2` command takes an existing file1 and copies the contents to
    file2. If file2 already exists, it is overwritten. The `-r` switch also works
    recursively to help copy directories.


    | TABLE 3-I | Operator | Description |

    |---|---|---|

    | Redirection Operators | command < file | Takes the content from the file to
    the right of the arrow as input |

    | | command > file | Sends standard output to the noted file; overwrites existing
    data |

    | | command >> file | Appends standard output to the end of file |

    | command 2 > file | Sends standard error messages to the noted file; overwrites
    existing data |

    | | command 2 >> file | Appends standard error to the end of the file |

    | | command1 | command2 | Redirects the output from command1 as standard input
    to command2 |'
  merge: -1
  pgno: 98
- img_proc: true
  md: '# Chapter 3: Fundamental Command-Line Skills


    The `mv file1 file2` command takes an existing file1, copies the contents to the
    file2, and then deletes file1. If file2 already exists, the contents are overwritten.


    While you can create files and directories in the GUI with the help of file browsers
    such as Nautilus, the options are all “front-ends” to the noted commands.


    # Create Hard and Soft Links


    File links are useful in a number of ways. They can support access from different
    volumes. For example, RHEL 6 includes a soft link for the GRUB (Grand Unified
    Bootloader) configuration file, grub.conf. Although it is normally stored in the
    /boot/ directory, it is also available in the /etc directory, courtesy of a soft
    link. You can confirm that from the following output to the -l /etc/grub.conf
    command:


    ```

    lrwwxr-wx 1 root root 22 Jan 20 05:30 /etc/grub.conf ->

    ../boot/grub/grub.conf

    ```


    For examples of hard-linked files, look at the scripts in the /etc/init.d and
    the /etc/rc.init.d directory. You may note that the files in each directory have
    the same name. If you use the -i to identify identically file name, you will find
    that each set of files has the same inode number. In other words, a hard-linked
    file points to the same location on a volume from two different directories.


    The following command creates a hard link from the /etc/samba/smb.conf to the
    /tmp:


    ```

    # 1 ln /etc/samba/smb.conf /tmp/

    ```


    In contrast, the following command creates a soft link from the /home/michael/RHCEBook/Ch1.doc
    file to a file of the same name in the /home/elizabeth directory:


    ```

    # 1 ln -s /home/michael/RHCEBook/Ch1.doc /home/elizabeth

    ```


    # Use grep and Regular Expressions to Analyze Text


    As suggested by the title, grep is just one command that can be used to analyze
    the text in a file. Such commands can sort the contents of text files (yes, sort
    is a command), analyze the difference between two different files, count the amount
    of data in a file, substitute for common elements of text, and even manipulate
    text as it were a database. The following is just a single example of each relevant
    command.'
  merge: -1
  pgno: 99
- img_proc: true
  md: '# Locate, Read, and Use System Documentation 65


    First, the following grep command identifies all users who are configured to log
    into the bash shell by default:


    ```

    $ grep bash /etc/passwd

    ```


    Some text files are long. If someone has made a change to a text file, you can
    use the diff command to compare it to a backup. The following command compares
    the hypothetical config.txt file from two different locations:


    ```

    $ diff backup/config.txt /etc/config.txt

    ```


    The wc command can identify count statistics from a text file; the following command
    identifies the number of lines, words, and characters in the /etc/passwd file:


    ```

    $ wc /etc/passwd

    ```


    The sed is a stream editor that supports the substitution of one set of text for
    another. The following command substitutes ksh for all instances of bash in the
    /etc/passwd file, and writes the output to the local testpass:


    ```

    $ sed ''s/bash/ksh/g'' /etc/passwd > testpass

    ```


    Finally, the awk is a type of database manipulation tool. Unlike the grep command,
    awk supports searches in a specific column. The following example looks through
    the first column for instances of tp, such as ftp and ntp:


    ```

    $ awk ''/tp/ (print $1)'' /etc/passwd

    ```


    # Locate, Read, and Use System Documentation


    Start by looking at the full objective: "Locate, read, and use system documentation
    using man, info, and files in /usr/share/doc." That''s a pretty straightforward
    summary of system documentation available on an RHEL 6 system, if the right packages
    are installed. One of the first lessons for Linux user is to read the man page
    for more information on a command. While the info pages for commands aren''t as
    extensive, those that are available have more information. The files in the /usr/share/doc
    directory include documentation for all installed packages. In many cases, this
    documentation includes licenses, author information, and basic "readme" about
    the software.'
  merge: -1
