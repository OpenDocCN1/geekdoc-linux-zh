    # Lab 2


    This is a multipart lab. While you could conceivably set host-based access limits
    within the Apache configuration files, it''s too easy to make a mistake and set
    the limit only on a certain directory. But if you can do that, great! It is one
    way to meet the requirements set out in this lab.


    In my opinion, the most straightforward way to set up host-based access limits
    is with the iptables-based firewall. The following rule rejects packets from the
    noted IP address on port 80 and then accepts them.


    ```

    -A INPUT -m state --state NEW -m tcp -p tcp -s 192.168.122.240 --dport 80 -j REJECT

    -A INPUT -m state --state NEW -m tcp -p tcp -s 192.168.122.0/24 --dport 80 -j
    ACCEPT

    ```


    Of course, there are three questions. You could repeat these with commands with
    ports 443 and 8080, or you could just specify --dport 443,8080 in each of the
    commands shown here.


    You also need to make sure that Apache is running and will start upon reboot.
    You also need to make sure the Listen 80 and Listen 443 directives are enabled
    in httpd.conf and ssl.conf files, respectively. A logical place is right after
    the Listen 80 directive. To confirm success, you could run the nmap 192.168.122.20
    command from both the whitehat and blackexample.net systems (which correspond
    to IP addresses 192.168.122.130 and 192.168.122.240). Of course, the ports should
    be visible only from the whitehat.example.net system.


    # Lab 3


    This lab requires you to create virtual hosts. A logical place to configure the
    containers for such hosts is in httpd.conf. The steps are similar to the corresponding
    lab in the Study Guide:


    +   1. First, don''t change the ServerRoot directive. It sets the default directory
    for the Apache server. Any files and directories not otherwise configured—or configured
    as a relative directory—are set relative to ServerRoot.


    +   2. Set the NameHost directive to the port (80) associated with HTTP. For name-based
    virtual hosts, you wouldn''t specify an IP address.


    +   3. Create two VirtualHost containers with settings appropriate for the alpha.example.net
    and beta.example.net systems.


    +   4. Assign the ServerAdmin to the e-mail address of the appropriate administrator,
    perhaps testester@example.net.'
