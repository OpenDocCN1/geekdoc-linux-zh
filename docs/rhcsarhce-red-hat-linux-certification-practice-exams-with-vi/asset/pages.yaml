  md: '# Build a Simple RPM that Packages a Single File


    | TABLE 2-3 | Directive | Description |

    |---|---|---|

    | **Key Parameters in the newpackage.spec File** | Name | Becomes the name of
    the RPM package |

    | | Version | Sets the version number for the RPM, such as 1.0. |

    | | Release | Appends to the version number; %1?(dist) represents 1.el6. |

    | | Summary | Adds information about the RPM; actual verage is for documentation
    only. |

    | | Group | Specifies the package group; can be set to Miscellaneous. |

    | | License | Lists the name of the license for the RPM, possibly the GPL. |

    | | URL | Notes the website address associated with the package; usually lists
    the website of the developers. |

    | | Source0 | Specifies the compressed package to convert. |

    | | BuildRoot | Specifies the assumed root directory for the RPM build; the defaults
    work. |

    | | BuildArch | Includes the architecture, such as i86, x86_64, and noarch. |

    | | BuildRequires | Adds dependencies, not required for an RPM with a single file;
    you may wish to comment them out. |

    | | %description | Includes a developer-generated description. |

    | | %prep | Notes commands associated with preparing the source code. |

    | | %setup -q | Runs a macro that unpacks the archive from the rpmbuild/SOURCES
    directory. |

    | | %build | Includes scripts to configure and make the source code (with the
    %configure and make %?(_smp_flags) directives), which is not needed for an RPM
    with a single file; you''ll likely comment these out. |

    | | %install | Includes commands to clean and install; for this RPM, it applies
    to the single file; see related comments in this section. |

    | | %clean | Cleans the source code after the RPM is built; no changes are required.
    |

    | | %files | Defines the directory and file owner for the installed RPM. |

    | | %changelog | Specifies the changes between versions. |


    You''ll want to add a couple of options to the %install and %files sections. The
    %install section in the newspec.spec template includes default commands; changes
    are shown in bold.


    ```

    rm -rf RPM BUILD_ROOT

    #make install DESTDIR=$RPM_BUILD_ROOT

    ```'
