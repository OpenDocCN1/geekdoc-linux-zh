  md: '# 276 Chapter 17: Administrative Services: DNS, FTP, and Logging


    To enable communication with peers, look at the first two directives in the file,
    and note the noeper and noquery options, which, by default, apply to both IPv4
    and IPv6 communication:


    ```

    restrict default kod modify notrap noeper noquery

    restrict -6 default kod modify notrap noeper noquery

    ```


    To enable peers, you should remove the noeper and noquery options:


    ```

    restrict default kod modify notrap

    restrict -6 default kod modify notrap

    ```


    The next restrict directive provides unrestricted access to the local system:


    ```

    restrict 127.0.0.1

    restrict -6 ::1

    ```


    Other restrict directives are allowed; you could add the following directive to
    support access from other systems on the local network:


    ```

    restrict 192.168.122.0 mask 255.255.255.0 modify notrap

    ```


    The modify option prevents clients on the noted network from modifying the local
    FTP server. The notrap option disables remote logging; if you''re told to allow
    logging to remote systems, remove that option.


    # CERTIFICATION SUMMARY


    This chapter briefly addresses the configuration of four different services. When
    the sysstat service is installed, you can get system utilization reports. Some
    are collected automatically with the help of the sysstat script in the /etc/cron.d
    directory.


    When the rsyslog-syslog service is installed, you can set up logging clients and
    servers in the /etc/syslog.conf file. You can configure such communication over
    port 514; the file accommodates both TCP and UDP protocols.


    When the ntpdate service is installed alone, you can set up an NTP client, synchronizing
    with servers listed in the /etc/ntp/step-tickers file. If the NTP server is also
    installed, the client defaults to the servers listed in /etc/ntp.conf. Alternatively,
    you can specify peer NTP servers with the peer directive. Just make sure to use
    the noeper option from the restrict directives at the beginning of the file.


    The default installation of the DNS service supports a caching-only name server
    for the localhost system. It''s configured in named.conf, normally in the /etc
    directory. To configure it for a network, you need to add the IP address of the
    local network card to the listen-on directive and the network address in the allow-query
    directive.'
  merge: -1
