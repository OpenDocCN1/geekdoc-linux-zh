  md: '# 152 Chapter 9: RHCSA-Level System Administration Tasks


    This is the final chapter associated with RHCSA exam objectives. As such, it''s
    a "catch-all" chapter of sorts that addresses those administrative tasks not covered
    in other chapters. While most remote administration is done at the command line,
    there are times when the GUI case associated with Virtual Network Computing (VNC)
    can help. Other tasks include package and process management, administrative task
    scheduling, and local system file management.


    # Access Remote Systems Using VNC


    If you''ve read the objectives carefully, you''ll note the objective includes
    SSH. Well, that part of the objective was covered in Chapter 2. In addition, you
    may already know more about VNC than you think, it''s the standard viewer for
    KVM-based virtual machines.


    When properly configured, you can use VNC to see the GUI that a user sees. With
    that window, you can even help that user from a remote location. One way to set
    it up on a client is with the vinagre, tigervnc, and tigervnc-server packages.


    To enable access to a VNC server, you should open at least TCP ports 5900 and
    5901. If you''re setting up VNC for a second user, you also need to open up TCP
    port 5902; a third user requires TCP port 5903, and so on.


    If you want to demonstrate the use of VNC on a system such as gamma.example.net,
    close any existing graphical window for that system. The gamma.example.net client
    is still running; closing that graphical window prevents "feedback" issues.


    This is one task where you''ll want to run a client from the physical host system.
    Although you can run a VNC client from within a KVM system, it can lead to strange
    effects.


    # Archive, Compress, Unpack, and Uncompress Files Using tar, star, gzip, and bzip2


    Before there were RPMs, Linux software packages were delivered via compressed
    archives. Files were collected in a single archive with the tar command and then
    compressed with the gzip or bzip2 commands. Of course, you can incorporate either
    compression algorithms into the tar command.'
  merge: -1
