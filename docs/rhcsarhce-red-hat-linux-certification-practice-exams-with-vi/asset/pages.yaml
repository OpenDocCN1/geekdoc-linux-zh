  md: '# 268 Chapter 17: Administrative Services: DNS, FTP, and Logging


    T his chapter gives you a chance to configure four administrative services: the
    Domain Name System (DNS), the Network Time Protocol (NTP), system activity reports,
    and system logging services. The first two are listed as network services.


    The DNS requirements for the RHCE aren''t that complex, especially as the objectives
    suggest that "candidates" are not expected to configure master or slave nameservers."
    The package associated with NTP works for servers and clients. System activity
    reports can be configured as a specialized cron job. System logging services support
    the configuration of a central logging server.


    # Produce and Deliver Reports on System Utilization (Processor, Memory, Disk,
    and Network)


    One responsibility of many systems administrators is monitoring system utilization.
    In the context of the noted RHCE objective, that includes questions on CPU load,
    RAM memory utilization, free disk space, and network congestion. While you can
    get a snapshot of this information with commands like top, df, and fdisk, you
    can meet this objective by configuring the system status service, systat. The
    systat service collects relevant data in log files in the /var/log/sa directory.


    Default system status reports are configured as a cron job in the systat file
    in the /etc/cron.d directory. The first line specifies a job''s run every ten
    minutes, collects statistics related to the use of swap space, and provides the
    information in a file named sard in /var/log/sa directory, where dd is the numeric
    day of the month.


    ```

    /10 * * * root /usr/lib64/sa/sa -S DIS 1 1

    ```


    The last line, courtesy of sa2 -A command, creates a daily report in a file named
    sard, also in the /var/log/sa directory. For example, the sat29 file would represent
    information collected on the 29th of the month. As it is text format, open it
    up. Look at the activity collected every day at 11:53 p.m.


    ```

    53 23 * * root /usr/lib64/sa/sa2 -A

    ```


    You could be asked to modify these system status jobs in some way. As noted in
    the main page for the sar command, the -A is equivalent to a whole host of options:
    "equivalent to specifying -bBdqrRSuvWy -I SUM -I XALL -n ALL -u ALL -P ALL."'
  merge: -1
  pgno: 303
- img_proc: true
  md: '# Configure a System to Log to a Remote System 269


    If you''re asked to prepare a focused system status report, you can do this with
    the sad command, which uses the reports generated by sar commands, such as sal
    and sa2. One example is shown in the sar man page; it takes the log file from
    the first of the month. The double-dash (-n) uses sar command options, in this
    case for RAM (-r) and network device (-n DEV) usage.


    ```

    # sad -d /var/log/sa/sa21 -- -r n DEV

    ```


    In contrast, the following command includes CPU utilization (-u), with activity
    by block device associated with device names as sa (-dp):


    ```

    # sad -d /var/log/sa/sa21 -- -u -r -dp -n DEV

    ```


    # Configure a System to Log to a Remote System


    Whereas local logs are associated with the RHCSA, as described in Chapter 9, the
    RHCE includes two objectives associated with the transmission of log files over
    a network. This objective is based on the configuration of a system as a network
    logging client that transmits such information to a remote system, and assumes
    you''ve installed the syslog package, the system logging daemon.

    The /etc/rsyslog.conf file includes a handy group of commented commands that can
    be used to configure a logging client as a client that forwards log information
    to some specified logging server. As suggested by the comments in the file, these
    rules essentially belong there. To activate a logging client, remove the pound
    sign (#) from front of all but the second to last line (that starts with remote
    host is):


    ```

    $$WorkDirectory /var/spool/rsyslog # where to place spool files

    $$$ActionFileNameFrule1 unique name prefix for spool files

    $$$ActionQueueMaxDiskSpace 1g lg space limit (use as much as possible)

    $$$ActionQueueSaveOnShutdown on # save messages to disk on shutdown

    $$$ActionQueueType LinkedList # run asynchronously

    $$$ActionResumeRetryCount -1 # infinite retries if host is down

    # remote host is: name:/port, e.g. 192.168.0.1:514, port optional

    #*.* @@@remote-host:514

    ```


    To set up a logging client, change the last line; the following example sends
    all logs (*.*), using TCP (@@), to IP address 192.168.122.1, over port 514:


    ```

    *.* @@@192.168.122.1:514

    ```


    ![](img/ad9f3468206ad4765a06e762bd96b965_304_0.png)'
  merge: -1
  pgno: 304
- img_proc: true
  md: '# 270 Chapter 17: Administrative Services: DNS, FTP, and Logging


    The following entry, in contrast, sends messages related to cron jobs, over UDP
    (@) port 514 to the same IP address:


    cron.* @192.168.122.1:514


    # Configure a System to Accept Logging from a Remote System


    The configuration of a system logging server is simpler, with respect to the changes
    required in the /etc/rsyslog.conf configuration file. All you need to do is activate
    one of the following pairs of directives. As suggested by their names, the following
    commented directives, if activated, would listen on UDP port 514:


    ```

    $ModLoad imdup.so

    $$UDPServerRun 514

    ```


    In contrast, the two commented directives are associated with TCP port 514:


    ```

    $ModLoad imtcp.so

    $$InputTCPServerRun 514

    ```


    Of course, you have to make sure the associated port in the local logging server
    firewall is open. If you use the Firewall Configuration tool, be aware that port
    514 is not associated with any standard “trusted service." As such, you would
    need to set up a custom rule with a directive such as the following for TCP port
    514:


    ```

    -A INPUT -m state --state NEW -m tcp -p tcp --dport 514 -j ACCEPT

    ```


    In production, system logging servers may require huge resources. For example,
    the logs from enterprise-level websites can easily consume gigabytes of data every
    day. Imagine the space required for a logging server associated with a group of
    web servers working in parallel.'
