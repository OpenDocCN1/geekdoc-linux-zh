- img_proc: true
  md: '# Certification Summary


    There are two types of networked file systems: NFS and CIFS. The following line
    specifies an NFS version 4 share, /shared1 from server svr1, mounted on /dir4,
    with 8192 blocks of data to be read and written per transmission, with a client
    that waits 1.4 seconds for the connection to be completed, with a connection that
    may be interrupted. The 0 0 disables archiving and filesystem checks.


    ```

    svrl:/share /dir4 nfs4 size=8192,wize=8192,time=14,intr 0 0

    ```


    The format for a shared CIFS directory is a bit different. Using the same parameters,
    the following supports access over a properly shared CIFS connection. Yes, the
    username and password are shown in clear text, which is why you can substitute
    an option like credentials=/etc/cifs for the noted username and password.


    ```

    //svrl:/share /dir4 rw,username=testuser,password=rhcert 0 0

    ```


    If you boot and forget the passphrase for the encrypted volume, add the init=/bin/sh
    option to the end of the kernel command line in the GRUB menu. You should then
    be able, with a few tricks, to mount volumes and make changes in read/write mode.


    # CERTIFICATION SUMMARY


    This chapter is focused on the file system. If you''re a master of the topics
    in this chapter, you know how to create a regular Linux partition, swap partition,
    and space that can be built into an LV. That means you how to set up these partition
    types, as well as primary, extended, and logical partitions.


    Of course, LVs go further. You should know that partitions can be set up in PVs,
    which can then be assembled into VGs. You can then allocate desired space to the
    LV. If LV is not big enough, you can add more PVs, include them in a larger VG,
    and allocate the additional space in a larger LV.


    Whatever file systems you configure, you need to know how to format them to the
    ext2, ext3, ext4, and the Linux file systems. Once formatted, you should be able
    to set them, as well as networked NFSs/CIFSs, in /etc/fstab. In your vein, you
    may substitute a label or a UUID for the filesystem device file.


    Finally, you should be able to handle LUKS-encrypted volumes. When you use the
    cryptsetup command on a partition or LV and set up the /dev/mapper device file
    in the /etc/cryptsetup file, you can then configure device in /etc/fstab. When
    successful, you''ll be prompted for an associated passphrase during the boot process.


