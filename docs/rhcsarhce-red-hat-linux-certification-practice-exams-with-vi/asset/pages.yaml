  md: '9. To set up a second partition as swap space, you need to make sure the partition
    is set to a Linux swap type. You then format it with the mkswap command, activate
    it with the swap command, and make sure it runs the next time system boots by
    adding it to the /etc/fstab file. If successful, you''ll see both the existing
    and new swap partition active in the /proc/swaps file.


    10. One way to set the noted parameters on user tester2 is with the change -E
    2017-03-15 -M 21 tester2 command; confirm with the change -l tester2 command.


    11. You can set up access to a specific directory of another user with the help
    of ACLs. The following two commands provide minimal ACLs required to give user
    tester2 access to files in the noted directory.


    ```

    # setfacl -R -m u:tester2:x /home/tester2

    # setfacl -R -m u:tester2:r /home/tester2/Desktop/ChapterLabs/*

    ```


    The tester2 user must know the full path to the generic files for this to work.


    12. There are a number of ways to set up a cron job; given the specific timing,
    you''ll want to set it up with appropriate time settings in a file in the /etc/cron.d
    directory. (You could also set it up as a cron job by a regular user.) In either
    case, the delete command would be associated using a command like this:


    ```

    0 1 * * 0 /bin/rm /encrypt/

    ```


    13. The /home/super directory should be owned by the group supervisors. You should
    set 2770 permissions on that directory. Use a command like chgrp supervisors /home/super
    to set appropriate group ownership. Make sure users super1, super2, and super3
    are members of the supervisors group.


    14. Assuming you have a network connection, the simplest way to install the amanda
    RPM is with the yum install amanda command.


    15. Finally, instead of just powering down the system as directed, you should
    reboot, and make sure the changes you''ve made are active. You can''t expect full
    credit, for example, if the FTP server isn''t running upon reboot.'
