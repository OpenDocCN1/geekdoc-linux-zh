  md: '# # Start, Stop, and Check the Status of Network Services


    On the surface, starting, stopping, and checking the status of a network service
    is simple. Associated scripts in the /etc/init.d directory support these options,
    and sometimes more. The following commands perform each function on the network
    service.


    ```

    # /etc/init.d/network start

    # /etc/init.d/network stop

    # /etc/init.d/network status

    ```


    The service command supports the same functionality; for example, the following
    service displays the current status of the vsFTP server:


    +   # service vsftpd status


    But sometimes, you have to go a bit further. A network service may be running,
    yet still be inaccessible in some fashion. If a network service is stopped, perhaps
    networking is not working for some other reason, such as a misconfigured firewall
    or SELinux boolean. To that end, you need to know how to use commands like ifconfig,
    ping, route, and traceroute. The actual configuration of a network is covered
    in the final objective in this chapter.


    However, you should not forget the /etc/sysconfig/network file. The following
    option activates networking with the help of the /etc/init.d/network script.


    ```

    NETWORKING=yes

    ```


    # # Configure Networking and Hostname Resolution


    As suggested by the title, this is two interrelated topics. Whereas network configuration
    is associated with the network addresses of a system and a network, hostnames
    are associated with the human-readable names of the system and network. The full
    objective states: “Configure networking and hostname resolution statically or
    dynamically.” In other words, you need to know how to set up both IP'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# 68 Chapter 3: Fundamental Command-Line Skills


    addresses and hostnames to some constant (static), or to take IP addresses and
    hostnames from a remote server, normally a Dynamic Host Configuration Protocol
    (DHCP) server. This objective, as originally written for the RHCSA, were more
    detailed:


    +   * Manage network devices: understand basic IP networking/routing, configure
    IP addresses/default route statically or dynamically.

    * Manage name resolution: set local hostname, configure /etc/hosts, configure
    for using DNS server.


    The first network configuration file is /etc/sysconfig/network. As stated earlier,
    that file allows you to activate networking with the NETWORKING=yes directive.
    It also includes the hostname for the system. Configuration files for individual
    network cards are stored in the /etc/sysconfig/network-scripts directory. The
    key files are associated with network card devices; for example, the ifcfg-eth0
    file sets configuration for the eth0 network device. it can be set to access information
    from a DHCP server, or it can include static IP address information. The format
    of the /etc/hosts file includes IP addresses with hostnames and fully qualified
    domain names; it''s effectively a static database.


    Hostname resolution, which determines how a system finds an IP address, is configured
    first in the /etc/nsswitch.conf file. The following means that the local system
    looks first in the /etc/hosts file and then looks for IP address information from
    a DNS server:


    ```

    hosts files dns

    ```


    You can configure the DNS servers to be searched in the /etc/resol.conf file.
    The following directive in that file points to the DNS server configured on the
    noted IP address:


    nameserver 192.168.122.1


    You can edit these files directly, or you can use the RHEL 6 network configuration
    tools. To start the console-based tool, run the system-config-network command.
    To start the GUI-based Network Connections tool, run the nm-connection-editor
    command.'
