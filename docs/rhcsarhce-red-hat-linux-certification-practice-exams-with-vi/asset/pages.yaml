    # # LAB ANSWERS


    # ## Lab I


    To minimize confusion, you could start the gamma.example.net system without opening
    the standard KVM window. One way to do this is with the `virsh start gamma.example.net`
    command. You can then connect to and administer the gamma system via SSH.


    You can verify success in this lab by running a VNC client such as the Remote
    Desktop Viewer or the TigerVNC Viewer from the physical host system to start the
    active GUI for the gamma.example.net system.


    To do so, you need to make sure the following conditions are met:


    +   - The VNC server is running from the user account.

    - Appropriate TCP ports are open, at least 5900 and 5901 for the first user.

    - The VNC server is configured in the `/etc/sysconfig/vncservers` file.

    - You''ve started the VNC server from a target user''s account. For example, from
    the tester account, you can run the `vncserver :1` command to enable access over
    the given TCP ports.


    Be aware, the Remote Desktop server configuration tool has problems with KVM-based
    VMs. This is not a bug, at least in my personal opinion, as KVM-based VMs already
    use VNC for normal operation. For the purpose of this lab, the TigerVNC server
    is the preferred method for configuring VNC on a KVM-based VM. If successful,
    you should be able to connect from the physical host with the TigerVNC client.
    Based on the conditions stated, you connect to the GUI on the tester account by
    navigating to 192.168.122.20:1.


    # ## Lab 2


    Before starting this lab, you may need to install the `star` command, available
    from an RPM of the same name. While the `star` command preserves ACLs and SELinux
    settings, the `tar` command does not.


    You can create the archive with the `star` command; one command that saves both
    ACLs and SELinux contexts:


    ```

    # star -xattr -H=exastar -c -f=homebackup /home/

    ```


    You can then compress the archive with the `gzip` or `bzip2` commands and then
    transfer that archive to the `/var/backup` directory. The `gzip` and `bzip2` commands
    each add appropriate extensions (.gz or .bz2) to the given file.'
