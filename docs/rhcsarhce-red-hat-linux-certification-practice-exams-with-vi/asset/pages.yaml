  md: '# RHCE Sample Exam I Discussion


    In this discussion, I describe one way to check your work to meet the requirements
    listed for this sample exam. Because there is no one way to set up a Red Hat Enterprise
    Linux configuration, there is no one right answer for the listed requirements.
    But there are some general things to remember. You need to make sure changes work
    after a reboot. For the RHCE, you need to make sure the services you set up are
    active at the appropriate levels. For example, if you are configuring Samba, it
    should be active for at least runlevels 3 and 5.


    +   1. The first task is essentially the default for both SELinux and iptables-based
    firewalls. SELinux should be in enforcement mode, and the iptables-based firewall
    is enabled by default. You can check this with the sestatus and iptables -L commands.


    +   2. This is a two-step process, run on gamma as a logging server and whitehat
    as a logging client. Both can be configured in their respective /etc/syslog.conf
    files. Make sure to open port 514 on the gamma iptables-based firewall, with the
    protocol that you configure for purpose (TCP or UDP).

    The changes to the syslog.conf file on gamma are simple. Pick TCP or UDP, and
    activate the appropriate directive related to "syslog reflection."

    The changes to the syslog.conf file on whitehat are slightly more complex in the
    remote logging section at the bottom of the file. You can activate all of the
    commented directives in this section. Just remember to substitute the host name
    or IP address for the remote-host directive. If you set up TCP communication,
    the double @@ is okay; if you''re using UDP, make it a single @ .


    +   3. If you set up this route with the Network Connections tool, you should
    see a route-eth0 file in the /etc/sysconfig/network-scripts directory, with three
    lines similar to this:

    ADDRESS=10.20.30.0

    NETMASK=255.255.255.0

    GATEWAY=192.168.122.1


    +   4. You should be able to use the Virtual Host stanza template at the end of
    the httpd.conf file in the /etc/httpd/conf directory as a model. You need to match
    the SELinux contexts in the /www/auahu and /www/maui to /var/www/html. Don''t
    forget to update the file_contexts file with the help of the semanage'
  merge: -1
  pgno: 340
- img_proc: true
  md: '# 306 Appendix D: RHCE Sample I


    fcontext command. Include index.html files in both the /www/oahu/ /www/maui directories,
    that give the noted message. Text format is acceptable; no HTML formatting is
    required. You also have to include oahu.example.net and maui.net in the /etc/hosts
    file for the noted systems. Of course, you need to open port 80 in the firewall
    of the gamma system as well.


    +   5. If you don''t know a scripting language, you can look up the Perl-based
    hello script in the Apache manual. Because you installed Apache to item 4, you
    should be able to install the httpd-manual RPM and navigate to http://gamma.example.net/manual
    to start it. Once, you can set up your oahu.pl and maui.pl scripts, give them
    755 permissions, set them up in corresponding cgi-bin/subdirectories with appropriate
    SELinux file types, and configure appropriate options in the Apache configuration
    file. You should be able to run the scripts by browser by navigating to the noted
    URLs.


    +   6. To set up the /pub/ftp directory as the default for anonymous-only-downloads,
    you need to create the directory, copy the noted files to that directory, set
    it as the home directory for the ftp user, and give it (along with the files therein)
    the same SELinux contexts as /var/ftp/pub.


    +   7. The Samba server will be configured with a /home/masters directory, set
    with the samba_share_t type label. You can limit users with the allow users directive
    in the smb.conf configuration file stanza associated with the /home/masters directory.
    To prevent access from blackhat, you can set up a hosts deny directive, or modify
    the firewall to block the associated IP address (192.168.122.240).


    +   8. To enable home directories in Samba, you need to activate the samba_enable_home_dirs
    boolean. You can then edit the [homes] stanza in the smb.conf file to add a valid
    users = tester user SSH.


    +   9. The simplest way to implement the limits on SSH is sshd_config file in
    the /etc/ssh directory. Just add PermitRootLogin no and AllowUsers tester directives
    to that file.


    +   10. You have two options for SMTP servers: Postfix and sendmail. If you stay
    with the default, Postfix, make several changes to the main.cf file in the /etc/postfix
    directory:


    ```

    myhostname = gamma.example.net

    mydomain = example.net

