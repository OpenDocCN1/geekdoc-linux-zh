  md: '# Lab 3


    Just a few changes are required to configure a system logging server. To set up
    UDP communications, open the /etc/rsyslog.conf file and activate the following
    directives:


    ```

    $ModLoad imdup.so

    $UDPServerRun 514

    ```


    Of course, access requires an open port 514 in a local firewall. You can set up
    a custom rule, such as the following, with the Firewall Configuration tool, using
    the IP address of the whitehat.example.net system.


    ```

    -A INPUT -m state --state NEW -m udp -p udp -s 192.168.122.130 --dport -j ACCEPT
    ACCEPT

    ```


    Don''t forget to make sure the rsyslog service is running and set to start at
    appropriate levels on reboot with a command like chconfig rsyslog on.


    # Lab 4


    On the whitehat.example.net, you can take advantage of the default version of
    the /etc/rsyslog.conf file. For the purpose of this, I''ve activated all lines,
    modified the final line to match that of the gamma.example.net system, and set
    a single symbol to make the use of the UDP protocol.


    ```

    $WorkDirectory /var/sppl/rsyslog # where to place spool files

    $ActionQueueFileName # unique name prefix for spool files

    $ActionQueueMaxDiskSpace 1g # 1gb space limit (use as much as possible)

    $ActionQueueSaveOnShutdown # save messages to disk on shutdown

    $ActionQueueType LinkedList run asynchronously

    $ActionResumeRetryCount -1 # infinite retries if host is down

    *.* @192.168.122.20:514

    ```


    Don''t forget to make sure the rsyslog service is running and set to start at
    appropriate levels on this client system.


    # Lab 5


    In this lab, you have the benefit of the /etc/named.conf configuration file. All
    you need to do is modifying the directives to include the IP address of the network
    adapter on the gamma.example.net system:


    ```

    listen-on port 53 { 127.0.0.1; 192.168.122.20; };

    ```


    Modify the allow-query directive to include the local IP network address:


    ```

    allow-query { localhost; 192.168.122.0/24; };

    ```'
