    to dozen errors. In my experience, suggested solutions don''t always work. In
    the opinion of this author, the GUI SELinux Troubleshoot Browser is less useful
    in version 6.2 than it was in version 6.0. It does not display SELinux alerts
    unless it deduces that SELinux is the problem with near absolute certainty. So
    it''s best to scroll through the text output of the sealert command. You can then
    make better decisions with respect to the problems that may arise with SELinux.


    # CERTIFICATION SUMMARY


    There are four basic RHCSA-level security layers on an RHEL 6 system. The first
    layer is based on the discretionary access controls associated with files. Those
    read, write, and execute permissions may vary depending on the user owner, the
    group owner, and other users.


    The second layer of security is based on ACLs. For systems that have been mounted
    with the acl option, you can set read, write, and execute permissions for specific
    users and groups. These permissions can support either specialized access from
    a specific user such as a manager or a specialized level of security for users
    who should have limited levels of access. Remember to set the appropriate execute
    bit on any directory for you want to set an ACL.


    The third layer of security is based on the firewall. By default, RHEL 6 blocks
    all but the most essential access from external systems. The one service that
    is open through the firewall is SSH. The Firewall Configuration tool makes it
    relatively easy to set up other ports.


    The fourth layer of security described in this chapter relates to SELinux. One
    objective suggests that you must be ready to set up SELinux in enforcing or permissive
    mode. At the RHCSA level, the essence of SELinux is based on labels for each file,
    as well as boolean options. You can set labels with the chcon command and restore
    them to the default with the restorecon command. The key troubleshooting command
    is sealert -a, which can process the logs in /var/log/audit directory into something
    more useful, often including suggested commands that may address any SELinux issues.'
  merge: -1
