  md: '# Basic Hardware Requirements


    # Hardware Compatibility


    If you only have 32-bit systems available, be prepared to spend some money. KVM
    is the default VM solution for RHEL 6. Red Hat has built KVM server packages only
    for 64-bit systems. Fortunately, most PCs and servers today meet this requirement.
    Even the lowly i3 CPU can handle 64-bit operating systems. There are even 64-bit
    versions of the Intel Atom CPU common on network systems. Similar comparisons
    can be made for CPUs from Advanced Micro Devices.

    If you''re planning to configure VMs on RHEL 6, be sure to choose an architecture
    that supports hardware-assisted virtualization, along with Basic/Output System
    (BIOS) or Universal Extensible Firmware Interface (UEFI) menu options that allow
    you to activate it. Such a configuration, which can allow, will have either the
    vmx (Intel) or svm (AMD) flag in the /proc/cpuinfo file.


    on the

    job


    If you''re about to purchase a new system, see if you can try it out at the "store"
    with one of the "Live CD" distributions. Both CentOS and Scientific Linux have
    one available based on RHEL 6 source code. If allowed by store personnel, review
    the BIOS or UEFI menus, and enable hardware-assisted virtualization. Boot the
    system from Live CD (or DVD). Once booted, you should be able to access the /proc/cpuinfo
    file from the command line. A system configured to support hardware-assisted virtualization
    has the vmx or svm flag in that file.


    In any case, you shouldn''t assume Linux will install or run flawlessly on any
    computer, especially if the system in question is a state-of-the-art laptop computer.
    (And you need a 64-bit system to prepare for the Red Hat exams.) Laptops are often
    designed with proprietary configurations that work with Linux only after some
    reverse engineering. For example, when I installed RHEL 6 on a brand-name business
    laptop built in 2010, I had to do a bit of extra work to make the wireless adapter
    work with RHEL 6. (These issues were addressed by the time I installed CentOS-6
    on my laptop in 2012.1.)


    Even when a manufacturer creates a device for a CPU platform, it may not work
    with Linux. Therefore, it''s important to know the basic architecture of a computer.
    But strictly speaking, if you want hardware compatible and supported by Red Hat,
    consult the hardware compatibility list at http://hardware.redhat.com/hcl/.'
