  md: '# SELF TEST ANSWERS


    # Boot, Reboot, and Shut Down a System Normally


    +   1. The runlevel associated with shutting down a Linux system is 0. In contrast,
    runlevel 6 is associated with rebooting.


    # Boot Systems into Different Runlevels Manually


    +   2. The runlevel associated with the GUI is 5, but that''s just the default,
    as configured in the predf.conf file in the /etc/init directory.


    # Use Single-User Mode to Gain Access to a System


    +   3. No password is necessary to enter single-user mode during the boot process.
    It''s a “backdoor” that may be a security issue, which is a good reason to password
    protect the GRUB bootloader.


    # Configure Systems to Boot Into a Specific Runlevel Automatically


    +   4. The full path to the configuration file with the default runlevel is /etc/inittab.
    Although a legacy file, it''s still in use for RHEL 6.


    # Configure Network Services to Start Automatically at Boot


    +   5. The simplest command to ensure that networking starts automatically in
    all normal runlevels is chconfig network. Variations such as chconfig network
    --level 2345 are also acceptable.


    +   6. The simplest command to ensure that networking does not start in any runlevel
    is chconfig network off. As with question 5, there are variations that also work.


    # Modify the System Bootloader


    +   7. The directive in the GRUB configuration file that hides the boot menu is
    hiddenmenu.


    +   8. The directive in the GRUB configuration file that identifies the initial
    RAM disk is initrd.'
