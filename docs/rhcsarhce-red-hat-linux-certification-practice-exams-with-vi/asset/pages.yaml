  md: '# 282 Chapter 17: Administrative Services: DNS, FTP, and Logging


    Configure a special firewall rule for DNS communication to the caching-only nameserver
    on this system; to do so, enter the following options for the iptables command
    as a custom rule, added with a file in the Firewall Configuration tool:


    ```

    -A INPUT -m state --state NEW -m tcp -p tcp -s 192.168.122.130 --dport

    53 -j ACCEPT

    -A INPUT -m state --state NEW -m udp -p udp -s 192.168.122.130 --dport

    53 -j ACCEPT

    ```


    Variations that accept communication from only the noted IP address are acceptable.
    You should be able to test the result from all three systems. A command like the
    following should work only from the gamma.example.net and whitehat.example.net
    systems:


    ```

    $ dig @192.168.122.20 mhededucation.com

    ```


    Of course, you need to make sure the named service is running and active on reboot.
    If desired, you could also set up nameserver in the /etc/resolv.conf file for
    each noted system, but that''s not a requirement for this lab.


    # Lab 6


    This is a two-step lab. Despite the wording in the lab, you have to set up the
    gamma.example.net NTP server in the /etc/ntp.conf file, remove the nopeer and
    noquery options from the first restrict directive.


    Then you need to specify the restrict option for the local network, as follows:


    ```

    restrict 192.168.122.0 mask 255.255.255.0 nomodify not

    ```


    You need to set up servers for synchronization. The commented server directives
    are sufficient for this purpose; if they''re not active, as shown here, make them
    active by removing the pound sign (#):


    ```

    # server 0.rhel.pool.ntp.org

    # server 1.rhel.pool.ntp.org

    # server 2.rhel.pool.ntp.org

    ```


    Save the result, and restart the NTP service. Check the result with the ntpq -p
    command. If successful, you''ll see output from three different NTP servers.


    Now you can go to the NTP client on the whitehat.example.net system. Disable the
    NTP service with commands like /etc/init.d/ntpd stop and chkconfig ntpd off. Then
    add the following line to the step-tickers file in /etc/ntp directory:


    ```

    gamma.example.net

    ```'
