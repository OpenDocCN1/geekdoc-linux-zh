  md: '# 258 Chapter 16: More File-Sharing Services


    It is true, however, that user access to home directories isn''t allowed unless
    enable the following SELinux boolean:


    ```

    ftp_home_dir

    ```


    But in the system that you get in production (or on an exam), boolean might already
    be active. And if you''ve been told to configure SELinux in permissive mode, vsFTP
    ignores this boolean.


    # Provide NFS Network Shares to Specific Clients


    The steps you take to meet this objective have already been outlined in the section
    on host-based security. You can set up a shared directory with different parameters
    for each client. For example, the line in /etc/exports file shares the /common
    directory with two clients in different ways:


    +   /common whitehat.example.net (ro) blackhat.example.net (rw)


    You can share additional directories with other clients in a similar fashion;
    the following example shares the /share directory with two clients using IP addresses:


    +   /share 192.168.122.130 (rw) 192.168.122.240 (ro)


    Depending on the situation, you may be asked to specify something other than read-only
    limits. Several other parameters are included in Table 16-1.


    | Table 16-1 | Parameter | Functional Description |

    |---|---|---|

    | NFS /etc/exports Options | no_subtree_check | Disables subtree checks, which
    prevents clients from checking higher-level directories of mounted shares |

    | | sync | Syncs write operations on request |

    | | no_wdelay | Forces immediate data writes |

    | | hide | Hide subdirectories; if export related directories such as /mnt/mnt,
    clients must mount /mnt/mnt separately |

    | | no_root_squash | Gives root user privileges locally on the shared directory
    |

    | | all_squash | Maps all client users as anonymous |

    | | anonuid=userid | Specifies a local user ID for anonymous users |

    | | anongid=groupid | Specifies local group ID for anonymous groups |'
