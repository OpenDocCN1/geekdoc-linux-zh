  md: 'Certification Summary


    # CERTIFICATION SUMMARY


    This chapter addressed objectives related to the administration of groups and
    users. Logging in is a basic skill. If you know how to switch users in the GUI
    or in different consoles, different users can run programs simultaneously on the
    same system.


    But you first need to create users, locally. Commands like **useradd**, **userdel**,
    and **usermod** can help you create, delete, and modify local accounts. Selected
    accounts can be configured with varying administrative privileges based on options
    in the /etc/sudoers files. The **passwd** and **ch** commands can be used to change
    passwords and modify password aging requirements. The **groupadd**, **groupdel**,
    and **groupmod** commands can help you create, delete, and modify groups. You
    can also edit the /etc/group and /etc/gshadow files to configure group membership.


    For a specialized group of users, you can create a dedicated group directory.
    When configured with the set-GID bit, it supports collaboration between members
    of that group. That-GID bit assigns group ownership to any files copied to that
    dedicated directory.


    Finally, you need to know how to set up a system as an LDAP client. The Authentication
    Configuration tool may be the most efficient way to make that happen.'
