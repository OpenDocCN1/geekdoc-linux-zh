  md: '# Modify the System Bootloader


    The system bootloader is GRUB. To modify GRUB, you need the grub.conf configuration
    file in the /boot/grub directory. A soft link to this file is available in the
    /etc directory.


    When you install a new kernel properly, it should automatically add a new stanza
    to the bootloader. That stanza will appear as a new option in the GRUB menu; this
    situation is covered in Chapter 7 of the Study Guide.


    An excerpt of a GRUB configuration file was shown earlier in this chapter. If
    you know how to modify the system bootloader, you understand the implications
    of changing each line in the file. The implications are briefly described in Table
    5-2; each line starts with a GRUB command, as shown in the left column.


    | Command | Effect of a Change |

    |---|---|

    | default | Points to a stanza to boot by default |

    | timeout | Specifies the time to wait before booting the default stanza |

    | splashimage | Notes the graphical splash screen to show during the boot process
    |

    | hiddenmenu | Hides the GRUB menu unless a key is pushed during the timeout period
    |

    | password | Specifies the password that protects the GRUB menu from changes |

    | title | Notes the stanza label shown from the main GRUB menu |

    | root | Points to the hard drive and partition with boot files |

    | kernel | Loads the kernel, specifies the file system with the top-level root
    directory, and adds boot options, potentially including the runlevel |

    | initrd | Loads the initial RAM disk |'
  merge: -1
