    # Signing Up for the RHCSA/RHCE Course andor Exam


    Red Hat provides convenient web-based registration systems for the courses and
    test. To sign up for any of the Red Hat courses or exams, navigate to www.redhat.com/training/courses,
    and select the desired course or exam. As shown in Table 1, exams may be taken
    as their own independent course. For example, the RHCSA and RHCE exams are associated
    with courses EX200 and EX300, respectively. Exams may also be taken as part of
    an online or instructor-led course. Alternatively, contact Red Hat Enrollment
    Central at training@redhat.com or (866) 626-2994.

    Discounts may be available for candidates who have been previously certified as
    an RHCT or RHCE. Current discounts are shown at https://listman.redhat.com/training/specials/.
    Remember to present any “offer code” before paying for the desired exam.'
