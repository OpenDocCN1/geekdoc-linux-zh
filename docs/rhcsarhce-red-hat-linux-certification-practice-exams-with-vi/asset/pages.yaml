    # Create and Edit Text Files


    Even though it''s available for RHEL 6, don''t use the OpenOffice.org Writer to
    edit text configuration files. It is far too easy to save the file accidentally
    in binary format. If you make a mistake with a critical configuration file, you
    could render the system unbootable.


    While there is no guarantee you''ll have access to the GUI, it is notable that
    an earlier version of the RHCA objectives included a reference to the gedit editor,
    part of the GNOME desktop environment. If the default GNOME desktop environment
    is installed, you can install the gedit package, and then access the editor from
    the Applications | Accessories menu.


    The use of the gedit editor is trivial for Linux users with any experience. Just
    be prepared to run alternatives such as vi or nano if the GUI is not available.
    While you don''t need to become an expert on either editor, you should know how
    to do at least three things with one of the editors:


    +   - Quit without saving; if you make a mistake, that can help you start fresh.

    - Go into and exit from edit mode.

    - Save changes into the current or a different file.'
