  md: '# RHCSA Sample Exam I Discussion


    # RHCSA Sample Exam I Discussion


    In this discussion, I describe one way to check your work to meet the requirements
    listed for the RHCSA exam.


    +   1. One way to see if SELinux is in enforcing mode is to run the sestatus command.

    2. Using the find command, you should be able to locate the gamma.hardware file
    in the /usr/share/doc/book-1.0.0 directory. If you''ve updated the file database
    with the /etc/cron.daily/mlocate.cron script, you could do the same with the locate
    command.

    To change the hardware address of a network card on a VM, you need to know how
    to manage it.

    One way to do so is from the Virtual Machine Manager. Double-click the gamma.example.net
    system. In the GUI window that opens, click View Details. You should be able to
    remove the existing Network Interface Card (shown by its acronym, NIC). Then click
    Add Hardware; when the Add New Virtual Hardware window appears, click Network.

    You should then be able to specify the address from the gamma.hardware file. If
    successful, you''ll see the eth0 device with the static 192.168.122.20 IP address
    in the output to the ifconfig command.

    3. The one FTP server native to RHEL 6 is the vsFTP service. If it''s installed
    and set to start in appropriate runlevels, you should be able to see it in the
    output to the chconfig --list vsftpd command.

    4. At minimum, you should be able to least verify the operation of the Kickstart
    file that you create. The following command is one example that assumes the vsFTP
    server has a Kickstart file named ks.cfg configured on the gamma system, and an
    installation server is configured on the physical host at 192.168.122.1:


    ```

    virt-install -n testsystem.example.net -r 768 --disk \\

    path=/var/lib/libvirt/images/testsystem.example.net.img,size=6 \\

    -1 ftp://192.168.122.1/pub/os \\

    -x "ks=ftp://192.168.122.20/pub/ks.cfg"

    ```'
