  md: '# Chapter 10: A Security Primer


    His chapter provides a brief summary of some of the firewall-based security options

    available for RHEL 6.Advanced SELinux concepts are addressed in Chapter II.


    These options start with iptables-based firewalls; iptables also helps protect

    systems within internal networks with the help of Network Address Translation

    (NAT).


    In principle, it''s best to start with systems configured with a minimal number
    of

    services. Such bastion systems are easier to secure. With solutions such as KVM,

    easier than to set up custom secure systems for each major service.


    As you start work on

    RHCE-related objectives, you may want

    take a few minutes to reset your VMs. If

    you do so with the instructions in Chapter

    I, you can now set the hardware addresses

    of the network cards to match those listed

    in Table 1-2. As there are multiple methods


    for setting up those hardware addresses,

    and there are five RHCSA objectives

    related to VMs, I leave that to process you.

    (Hint: I have described a couple of methods

    for setting up those hardware addresses in

    the RHCSA chapters of this book.)


    # Use iptables to Implement Packet

    Filtering and Configure Network Address

    Translation (NAT)


    The current Linux implementation of firewalls is based on the iptables and ip6tables

    commands. These commands include three basic options: filter, nat, and mangle.

    The mangle option can be ignored in the context of the RHCSA objectives. The

    default filter option matches a pattern such as a protocol or IP address to a
    packet.

    When the pattern matches, the associated iptables command specifies the action
    to

    take with that packet.'
  merge: -1
  pgno: 199
- img_proc: true
  md: '# Configure Host-Based and User-Based Security for the Service 165


    The nat option configures Network Address Translation, which modifies the headers
    of networked packets so a request from an internal system looks like it'' coming
    from another system, normally a router.


    Most iptables-based firewall rules are based on the filter option, where rules
    are taken together in chains. To list the currently active firewall rules, list
    them with the iptables -L command. If you want to empty firewall rules from the
    current system, flush them with the iptables -F command. You can add a rule to
    the end of a chain with the iptables -A command; when a number or pattern is specified,
    you can delete a rule with the iptables -D command. (The ip6tables works in a
    similar fashion.)


    Of course, you''ll want to specify a pattern; options -s ip_address can specify
    the source IP address (or network address). In the same fashion, and option -d
    ip_address can set a pattern for the destination IP address.


    You can also specify protocols and port numbers. For example, -m tcp -p tcp --dport
    22 looks for Transmissionmission Control Protocol (TCP) packets sent to port 22.
    In fact, that''s one default rule for RHEL 6, which supports remote access to
    the Secure Shell (SSH) service. Putting it all together, take this option from
    the /etc/sysconfig/iptables files:


    ```

    -A INPUT -m state --state NEW -m tcp -p tcp --dport 22 -j ACCEPT

    ```


    This is an input rule for new packets that match the TCP protocol over port 22.
    In this case, such packets are accepted (ACCEPT). Alternatively, they could be
    dropped (DROP) or rejected (REJECT). They can also be logged (LOG).


    If you use the Firewall Configuration tool, use it for all iptables-based rules.
    One hint: it is worth taking some time to learn how to set up custom rules with
    this tool. You can set up custom rules in files other than iptables and ip6tables
    in the /etc/sysconfig directory.


    # Configure Host-Based and User-Based Security for the Service


    The RHCE objectives cover the following services: HTTP/HTTPS, DNS, FTP, NFS, SMB,
    SMTP, SSH, and NTP. You can limit access to each of these services by host. Several
    of these services can be secured by user. You get a chance to configure such security
    in the labs in later chapters.


    Host- and user-based security can also be configured in other ways. You can set
    up host-based security on specific ports based on iptables firewall rules. Some
    services'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# 166 Chapter 10: A Security Primer


    include configuration files in the /etc/xinetd.d directory and can be regulated
    with the help of the Extended Internet Services Daemon, xinetd. Other services
    are associated with the TCP Wrappers library file, libwrap.so.0, and can be regulated
    with the help of the hosts.allow and hosts.deny files in the /etc directory.


    To see if TCP Wrappers can be used to secure a service, the library dependencies
    command (ldd) can help. For example, if you run the ldd /usr/sbin/vsftpd grep
    libwrap.so.0 command, you should see the following 64-bit output to confirm:


    ```

    libwrap.so.0 => /lib64/libwrap.so.0

    ```


    Remember, TCP Wrappers searches for /etc/hosts.allow first. If a rule allows access
    is configured, any related rule in /etc/hosts.deny is ignored. The following is
    a sample of a rule that might be configured in each file:


    ```

    sshd : ALL EXCEPT 192.168.122.130

    ```


    If you added this rule to /etc/hosts.deny, access would be allowed only from the
    noted IP address, which corresponds to the whitehat.example.net system. User-based
    access can also be configured with the help of PAM, based on files in the /etc/pam.d
    directory. The following entry from /etc/pam.d/vsftpd illustrates the rule that
    denies access from users listed in the /etc/vsftpd/ftpasswd users:


    ```

    auth required pam_listfile.so item=user sense=deny \

    file=/etc/vsftpd/ftpasswd onerr=succeed

    ```


    If you understand the command line, you''ll realize that the backslash shown above
    escapes the meaning of the carriage return, which serves as the functional equivalent
    of a line break. Sure, the line is in a configuration file; unfortunately, a backslash
    also works in that particular file.


    To interpret, PAM uses an authentication management (auth) test. The system is
    required to pass the test to continue. The rule that follows is based on the pam_listfile.so
    library in the /lib64/security directory. Details on how the library works are
    available in the pam_listfile manual page. The item=user option specifies that
    PAM will check for the user. If there is a match, that user should be denied access
    (sense=deny). The file is /etc/vsftpd/ftpasswd. If the file can''t be opened,
    the user is allowed access (onerr=succeed).


    ![](img/ad9f3468206ad4765a06e762bd96b965_201_0.png)'
  merge: -1
