  md: '# Configure the Service for Basic Operation 223


    TABLE 14-3 SELinux Booleans for Apache (continued)

    | Boolean | Description |

    | httpd_tmp_exec | Supports those Apache-based scripts that require access to
    the /tmp directory |

    | httpd_use_cifs | Enables Apache to access shared Samba directories when labeled
