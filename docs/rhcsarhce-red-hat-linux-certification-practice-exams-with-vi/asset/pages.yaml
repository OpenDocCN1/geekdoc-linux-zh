  md: '# Update the Kernel Package Appropriately to Ensure a Bootable System


    ![](img/ad9f3468206ad4765a06e762bd96b965_166_0.png)


    For all objectives, you can refer to a more-in-depth discussion in the Study Guide,
    also known as the RHCSA/RHCE Red Hat Linux Certification Study Guide (Exams EX200
    & EX300), 6th Edition.


    As I''m limited to a one-page description of each objective in this book, make
    sure you know the yum install, yum update, yum search, yum info, yum clean, yum
    erase, yum groupplist, yum groupinfo, and yum groupinstall commands. In addition,
    the yum-config-manager command displays all current parameters for each repository.
    Finally, the GNOME Add/Remove Software tool is a front-end to the yum command.


    # Update the Kernel Package Appropriately to Ensure a Bootable System


    This objective, as written, is just a little tricky. To ensure a bootable system,
    you should always install and never update a kernel package. Updated kernels don''t
    work with every system 100 percent of the time. However, if you run the rpm -U
    option with an existing kernel, it overwrites that kernel. So if that updated
    kernel does not work, for whatever reason, then you''re out of luck. (Actually,
    you could use the rescue mode from the Installation DVD and reinstall an older
    version of the kernel, but the process is intricate.)


    If successful, you''ll see at least two kernels in the /boot directory, along
    with at least two options in the GRUB bootloader file: /boot/grub/grub.conf. You
    can confirm it from the version numbers of the kernels that are listed, in the
    two stanzas associated with booting.


    Fortunately, the default settings for the yum update kernel installs kernels as
    well. Because that''s the default installonlypkgs option for yum is set to prevent
    upgrades. Nevertheless, it''s a better practice to run the yum install kernel
    command to update a kernel. You never know when someone might disable this particular
    default.


    If you want to practice the rpm command on a new kernel, use the yumdownloader
    kernel command. It downloads the RPM for the latest available version of the kernel
    to the local directory. You may also want to download a specific, perhaps an older,
    version; the yumdownloader-2.6.32-220.el6.x86_64 command downloads the RPM for
    that particular version of the kernel.'
