    # Lab 3


    Remember, there are two steps to this process. First, you need to extend the LV
    with the lvext command, then you can expand the formatted space using the resize2fs
    command. Since there is sufficient space in the VG, you don''t need to add a PV
    to this area. All you need to do is extend the LV with the following command:


    ```

    # lvextend -L 500M /dev/mapper/vg1-lv1

    ```


    You could also specify the /dev/vg1/lv1 device file. But first, you should check
    the associated file system with the following:


    ```

    # e2fsck -f /dev/mapper/vg1-lv1

    ```


    You can then extend the formatted volume over the whole length of the file system
    with the following command:


    ```

    # resize2fs /dev/mapper/vg1-lv1

    ```


    # Lab 4


    To unallocate the swap space created in Lab 1, run the swapoff /dev/sda1 command.
    In addition, you wouldn''t want Linux to look for that swap partition in the boot
    process, so you also want to delete the swap reference to that partition in the
    /etc/fstab file.


    In addition, you''ll want to change the flag on the partition from Linux swap
    to a regular Linux partition. When complete, you''ll see the following excerpt
