  md: '# CERTIFICATION SUMMARY


    The iptables command is a key security feature of Linux, based on IPv4 networks.
    Rules configured in the /etc/sysconfig/iptables file can be used to check the
    headers of each network packet. Depending on characteristics such as network device,
    protocol, IP address, and port number, packets can be accepted, rejected, or dropped.
    For IPv6 networks, the corresponding command is iptables, configured in the /etc/sysconfig/ip6tables
    file. These commands can also be used in Network Address Translation to help protect
    the identity of systems on a private network.


    User- and host-based security is another Linux security feature. Most of the services
    associated with the RHCE can be configured with both user- and host-based security.
    Some services can be secured with the help of the Extended Internet Services Daemon,
    xinetd. Other services that depend on the TCP Wrappers library can be secured
    with rules in the /etc/hosts.allow and /etc/hosts.deny files, in that order. User-based
    security can be enhanced with PAM; one example of user-based security resides
    in the /etc/pam.d/vsftpd configuration file.'
  merge: -1
