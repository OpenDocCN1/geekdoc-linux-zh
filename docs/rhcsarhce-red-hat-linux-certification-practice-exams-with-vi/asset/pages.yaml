    # Lab I


    You could easily use fdisk, parted, or the GUI Disk Utility to start this lab
    by creating a partition of 400MB. It''s understood that these tools are not precise;
    for example, if I ran the parted -I command after creating a 400MB partition,
    I got the following output:


    | Number Start End Size Type Flags |

    | 1 | 32.3kB 428MB 428MB | primary linux-swap (v1) | |


    The difference in size between 428MB and 400MB is trivial for these purposes.
    Of course, to set it up as additional swap space, you need to format it properly.
    If this partition /dev/sda1, run the following-commands:


    ```

    # mkswap /dev/sda1

    # swapon /dev/sda1

    ```


    You can confirm in the /proc/swaps file. Of, to make sure the changes survive
    a reboot, you need to add an entry in /etc/fstab. If UUIDs are required, you can
    identify them with a command like blkid; otherwise, you can include a simple entry
    such as:


    ```

    /dev/sda1 swap swap defaults 0 0

    ```


    # Lab 2


    Yes, the remaining space on the second virtual drive is small, about 600MB. However,
    when you create two partitions on this drive, you get a chance to practice the
    steps required to configure an LV. You can use any of the disk management tools
    described in Lab 1 to create the additional partitions. Although you can use the
    GUI Logical Volume Management tool to perform these tasks, I cite the command-line
    options that you can use to meet the requirements of this lab. I assume the two
    additional partitions are device files, /dev/sda2 and /dev/sda3. Your device files
    may be different. If so, substitute accordingly.


    +   1. Create partitions /dev/sda2 and /dev/sda3 using one of the disk management
    tools described in Lab 1. Together, these two partitions should add up to at least
    500MB. Make sure they''re set to the LVM volume type.


    +   2. Run the pvcreate /dev/sda2 /dev/sda3 to set up PVs. If desired, run pvs
