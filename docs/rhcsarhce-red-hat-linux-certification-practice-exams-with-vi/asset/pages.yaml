  md: 'If you need to generate a "self-signed" security certificate, navigate to the
    /etc/pki/tls/certs directory. The following command starts a console-based wizard
    that helps you generate a certificate for the gamma.example.net system:


    ```

    # genkey gamma.example.net

    ```


    To use the certificate that''s generated, you need to modify the SSLCertificateFile
    and SSLKeyFile directives to the location of the gamma.example.net.crt and gamma.example.net
    key files, respectively.


    # Configure Private Directories


    In this context, private directories on a web site are configured for every individual
    user. As a model, a default stanza is already available to configure access to
    user home directories, in the following container:


    ```

    #Directory /home/*/public_html>

    ```


    But before activating this stanza, you have to deal with two other directives.
    Access to user home directories is disabled, by default, in two ways. First, in
    the httpd.conf file, you find the following directive that disables such access
    directly:


    ```

    UserDir Disabled

    ```


    Second, the same stanza includes the following commented directive, which activates
    access to user home directories, in the public_html/ subdirectory:


    ```

    #UserDir public_html

    ```


    Normally CGI scripts are disabled by default accessing home directories via Apache,
    with the IncludesNoExec directive at the end of this line:


    ```

    Options MultiViews Indexes SymLinksIfOwnerMatch IncludesNoExec

    ```


    To configure Apache-based private access to a home directory, give it 701 permissions.
    That make file lists in that directory readable by all users.


    Alternatively, you could set up executable Access Control List (ACL) permissions
    for the Apache user. In either case, you also have to activate the httpd_enable_homedirs
    SELinux boolean.'
  merge: -1
  pgno: 261
- img_proc: true
  md: '# Deploy a Basic CGI Application


    If you don''t know programming, don''t panic. You don''t need to know how code
    to meet this objective. If you''ve installed the httpd-manual RPM described earlier,
    you can search for more information in Apache documentation. Of course, the httpd-manual
    RPM may or may not be available during a Red Hat exam.


    Apache''s use of CGI scripts for the default web site depends on two directives
    in the httpd.conf file:


    ```

    LoadModule cgi_module modules/mod_cgi.so

    ScriptAlias /cgi-bin/ "/var/www/cgi-bin/"

    ```


    In the default Apache server configuration, on a gamma.example.net system, you
    can run scripts from the http://gamma.example.net/cgi-bin URL.


    If you want to set Perl scripts in a dedicated directory, or even on a virtual
    host, include the following directives in the appropriate directory container:


    +   Options ExecCGI

    AddHandler cgi-script .pl


    I''ve selected Perl arbitrarily. I intend no disrespect to users who prefer other
    scripting languages. Scripts associated with different languages may have different
    file extensions. In the Apache documentation, in the "Writing a CGI Program" section,
    you can find code for a simple Perl script:


    ```

    #!/usr/bin/perl

    print "Content-type: text/html\n\n"

    print "Hello, World!"

    ```


    Make sure the file has 755 permissions, supporting execution by all users; after
    all, it''s a web site. If you want to limit access to the script, you can do so
    with user and group restrictions described elsewhere in this chapter.


    # Configure Group-Managed Content


    The process used to set up private directories for a group in Apache is similar
    to the process used to set up a private group directory described in Chapter 8.
    Start with the stanza created earlier in the section on user- and host-based security.'
  merge: -1
  pgno: 262
- img_proc: true
  md: '# 228 Chapter 14: The Apache Web Server


    You have to go just a bit further with a group directory shared via an Apache
    server. Set up a regular user as the owner. You can then create a group with the
    desired users. Make sure the group directory (and files therein) are set up with
    appropriate user and group ownership.


    For this purpose, you can set up this directory in the httpd.conf configuration
    file in a fashion similar to a shared user home directory. After all, a shared
    group directory is normally also configured as a subdirectory of/home.


    You want to set world-executable permissions on the directory, or at least ACL-based
    permissions accessible to the user name apache. You can then use the httppasswd
    command to set up users. Pointing to an authorized group requires an UserFile,
    an GroupFile, and a Require group directive. The format of the group file can
    be simple: the following entry sets up an analyst group made of users nerd1 and
    nerd2:


    ```

    analyst: nerd1 nerd2

    ```


    # CERTIFICATION SUMMARY


    The Apache web server is conceivably the most important server software associated
    with RHEL 6. As one of the requirements of the RHCSA is to configure Apache in
    its default configuration, the RHCE goes further. Associated packages are available
    in the “Web Server” package file. Apache can be controlled with the help of a
    number of different SELinux file contexts and booleans.


    Apache is normally controlled with the help of the apachectl, you can use commands
    like hkconfig to make sure it starts during the boot process into normal runlevels.
    While host-based security can be controlled through the firewall, user- and host-based
    security can be enhanced within the Apache configuration files.


    To see of Apache’s capabilities, you should know how to set up virtual hosts,
    using both the HTTP and HTTPS protocols. You need to know how to configure private
    directories protected by passwords. Those private directories can be extended
    to groups for group-managed content. Finally, options such as ExecCGI and AddHandler
    cgi-script .pl enable the use of Perl scripts in desired Apache containers.'
  merge: -1
