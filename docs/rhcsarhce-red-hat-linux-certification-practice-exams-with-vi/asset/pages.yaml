  md: '# Mount, Unmount, and Use LUKS-encrypted File Systems 117


    To create a LUKS-encrypted partition, take the following basic steps:


    +   1. Create a new partition. If directed to set up an LV, take the steps required
    to set it up from empty space on available PVs and VGs. Add the partition to PVs
    if necessary.

    2. Apply the cryptsetup command to the partition; enter a passphrase when prompted.

    3. If required, set up a UUID for the encrypted device; the following example
    writes the UUID to a text file:

    4. The following command, which prompts for a passphrase, maps the encrypted partition
    to the UUID. If you''re not using UUIDs, skip to step 5.

    5. Alternatively, the following command skips UUIDs and sets up a device label:

    6. Now format the encrypted device with a command like mkfs.ext4; the device file
    should be available in the /dev/mapper directory.


    ```

    # cryptsetup luksFormat /dev/sda

    ```


    ```

    # cryptsetup luksUUID /dev/sda > textfile

    ```


    ```

    # cryptsetup luksOpen /dev/sda `cat textfile`

    ```


    ```

    # cryptsetup luksOpen /dev/sda notUUID

    ```


    Your LUKS volume is now ready for the next two objectives. Don''t reboot yet,
    or you''ll lose the work that you''ve done to create this volume.


    # Mount, Unmount, and Use LUKS-encrypted File Systems


    On the surface, this objective is simple. If you''ve already created a LUKS-encrypted
    file system in the previous objective, all you need to do is apply the mount and
    umount commands to the associated device file in the /dev/mapper directory.


    However, that''s not enough. If you rebooted now, the dm_crypt module wouldn''t
    even be loaded. To set up the LUKS-encrypted file system properly, you would need
    to configure the /etc/crypttab file. Each encrypted volume gets one line in that
    file, using the following format:


    device unformatted volume passphrase_file options'
  merge: -1
  pgno: 152
- img_proc: true
  md: '# 118 Chapter 6: Linux Filesystem Administration


    The device is the file created earlier in the /dev/mapper directory. The unformatted
    volume may be the partition or the LV that has been encrypted. The passphrase_file
    can be configured with 600 permissions; if you substitute none in this column,
    RHEL 6 prompts for the passphrase during the boot process. No options are required;
    I normally keep this entry empty. If you want to go beyond "basic operation" the
    crypttab map page details available options.


    For the device, you either use the UUID created with the cryptsetup luksUUID or
    the plain device file created with the cryptsetup luksOpen command.


    If you want to practice creating encrypted volumes, and want to reuse a device
    currently configured in the /dev/mapper directory, run the cryptsetup luksClose
    command, where device is the name of a file in /dev mapper. You can then rerun
    the cryptsetup commands on the same partition or volume.


    ![](img/ad9f3468206ad4765a06e762bd96b965_153_0.png)


    # Configure Systems to Mount ext4, LUKS-encrypted, and Network File Systems Automatically


    Automatic mounts are associated with the /etc/fstab configuration file, so for
    this objective, you need to know how to configure all three types of file systems
    in /etc/ fstab. First, a standard ext4 file system is straightforward. You could
    set it up with partitions or LV devices:


    | /dev/sda1 ext4 defaults 1 2 |

    | /dev/vg_00/lv_00 /dir2 ext4 defaults 1 2 |


    Of course, you could substitute the UUID for each device. A similar configuration
    works for newly configured swap space; for example, if you run mkswap /dev/sda2,
    the following line ensures space is used after the next boot:


    | /dev/sda2 swap swap defaults 0 0 |


    As for LUKS-encrypted file systems, the process is similar. You could use the
    UUID, or you could specify the device file from the /dev/mapper directory. The
    following is one example of how it would appear in /etc/fstab:


    | /dev/mapper/test /dir3 ext4 defaults 1 2 |'
  merge: -1
