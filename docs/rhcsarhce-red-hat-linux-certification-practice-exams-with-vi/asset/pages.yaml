  md: '# 196 Chapter 12: RHCE Administrative Tasks


    +   - Whether to use DNS to resolve hosts to Kerberos Realms If there''s a trusted
    DNS server on the local network, activate this option. It takes over the search
    for the Realm.


    +   - Whether to use DNS to find a KDC for a Realm If there''s a trusted DNS server
    on the local network, activate this option. It takes over the search for the KDC
    and Kerberos administrative server.


    The information, as configured, is added to the sssd.conf file in the /etc/sssd
    directory. It becomes part of the System Security Services Daemon, controlled
    by the /etc/init.d/sssd script. In addition, it adds sss (which represents System
    Security Services) to the passwd, shadow and group directives in the /etc/nwitch.conf
    file. When the local system looks for authentication information, it first checks
    local files and then the databases configured in the sssd.conf file.


    # Route IP Traffic and Create Static Routes


    The titled objective implicitly includes two tasks:


    +   - Create a default route. When more than one network card is available, you
    need to know how to set up a route over one specific card. Default routes typically
    carry traffic to larger networks such as the Internet.


    +   - Create a special route. Sometimes you need to set up a specialized route
    between certain systems or networks.


    Before proceeding, you should check the current routing table. One way to do so
    is with the route -n or netstat -rn commands. Both commands should present the
    same output. For IPv4 networks, the default route is associated with a destination
    address of 0.0.0.0. If that route does not yet exist, and you want to direct traffic
    through IP address 192.168.122.1 (which should correspond to the virbr0 device
    on the physical host system), run the following command:


    ```

    # route add default gw 192.168.122.1

    ```


    On most systems, that information should already be embedded in the ifcfg-eth0
    configuration file in the /etc/sysconfig/network-scripts directory (the device
    name may vary from eth0). Of course, you may have to discover that information
    through a bit of troubleshooting.'
