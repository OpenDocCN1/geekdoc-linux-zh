  md: '# Configure Systems to Boot Into a Specific Runlevel Automatically


    This objective offers an excellent opportunity to review available runlevels.
    The major runlevels are listed in the /etc/initabb configuration file, which is
    also where you configure the boot runlevel. The following directive specifies
    normal system booting into runlevel 5:


    ```

    id:5:initdefault

    ```


    You can change 5 to any legal runlevel. Basic runlevels are shown in Table 5-1.
    Each of these runlevels is associated with scripts in the /etc/rc.d directories
    where n corresponds to the numeric runlevel.


    If you''re having trouble booting into RHEL 6, two other runlevels are available.
    When you reach the GRUB menu, you can append them to the kernel command options:


    +   - Boots normally, but does not run the scripts in the /etc/rc1.d/ directory.

    - init=/bin/sh Boots without loading init-related options. It mounts only the
    top-level root directory (/) in read-only mode.


    | Runlevel | Description |

    | --- | --- |

    | 0 | Halt. |

    | 1 | Single-user mode, for maintenance and repair. |

    | 2 | Multiuser, with some network services. |

    | 3 | Multiuser, with networking. |

    | 4 | Normally unused (but available). |

    | 5 | X11, defaults to a GUI login screen; brings the user to a GUI desktop, with
    networking. |

    | 6 | Reboot (never set initdefault in /etc/initabb to this value). |'
  merge: -1
