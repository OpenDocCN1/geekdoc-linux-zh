  md: "# Configure SELinux to Support the Service 241\n\nOnly Samba-related boolean\
    \ (qemu_use_cifs) is enabled by default. To get some of the features associated\
    \ with Samba, you may need to activate some of the other booleans. The booleans\
    \ in the table are grouped by functionality.\n\nSELinux is also associated with\
    \ file types. Normally, Samba can share only those files and directories labeled\
    \ with the samba_share_t file type. The exception is when either the samba_export_all_ro\
    \ or samba_export_all_rw boolean is enabled.\n\nIf you set a shared directory\
    \ with the samba_share_t file type, you will want to set up the file_contexts.local\
    \ file in /etc/selinux/targeted/contexts/files directory with a command such as\
    \ the following:\n\n```\n# semanage fcontext -a t samba_share_t /share\n```\n\n\
    | TABLE 5-1 Boolean Description |\n|---|---|\n| Samba Booleans | allow_samba_anon_write\
    \ Allows Samba clients to write to directories configured with the public_content_rw_t\
    \ SELinux setting |\n samba_export_all_ro | Enables read-only access to shared\
    \ directories, including those without the samba_share_t file-type label |\n samba_export_all_rw\
    \ | Enables read/write access to shared directories, even those without the samba_share_t\
    \ file-type label |\n samba_create_home_dirs | Lets Samba create home directories,\
    \ normally for outside users |\n samba_enable_home_dirs | Supports the use of\
