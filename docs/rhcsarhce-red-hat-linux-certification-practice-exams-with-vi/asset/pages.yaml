  md: '# Preface xix


    ```

    # virt-install -n other.example.org -r 768 --disk \

    -path=/var/lib/libvirt/images/other.example.org.img \

    -1 ftp=//192.168.122.1/pub/inst \

    -x ks=ftp://192.168.122.1/pub/ks1.cfg

    ```


    Just be aware that the backslash doesn''t work with every command.


    Sometimes, the differences are subtle. Sometimes, you need to type in a command
    or a response to a question at a command line. In that case, you''ll see an instruction
    such as type y. Alternatively, some menus require a key press; for instance, you
    may be asked to press F to access a password prompt. In that case, the letter
    p is not added when you press that letter. In addition, the A, despite its appearances,
    is in lowercase. In contrast, the A is uppercase version of that letter.


    One area where some publishers have trouble is with the double-dash. Some publishing
    programs change the double-dash to an "em-dash". But that be double-dash is common
    in many Linux commands. For example, the following command lists all packages
    currently installed on the local system:


    ```

    # rpm --all

    ```


    When I ran this command on RHEL 6 system, it listed 1300 packages.

    In contrast, the following command lists all files in all packages on the local
    system:


    ```

    # rpm --query -all

    ```


    When I ran this command on RHEL 6 system, it listed 133,000 files, a rather different
    result. So pay attention to the dashes, and rest assured that the team who produced
    this book took care to make sure that double-dashes are shown as is!


