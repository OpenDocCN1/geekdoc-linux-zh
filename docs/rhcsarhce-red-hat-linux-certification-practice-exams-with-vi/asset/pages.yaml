  md: '# Access a Virtual Machine’s Console


    There are two basic methods available to access a virtual machine''s console.
    You can do so from the GUI, from the Virtual Network Computing (VNC) windows that
    open when you double-click a selected VM in the Virtual Machine Manager. You can
    also do so with the help of SSH, as noted in the following section.


    # Access Remote Systems Using SSH


    If you''re reading carefully, this is just half of the objective. The requirement
    is to “access remote systems using SSH and VNC." The VNC part of this objective
    is addressed in Chapter 9.


    The Secure Shell (SSH) is important in Linux systems administration. It''s installed
    by default in minimal installations of RHEL 6. The default firewall configured
    for RHEL 6 includes a rule that allows access through port 22, which is the standard
    for SSH.


    SSH includes several configuration files. For the system, you can find them in
    the /etc/ssh directory. As the RHCSA is more focused on the workstation, learn
    the options in the client configuration file, ssh_config.


