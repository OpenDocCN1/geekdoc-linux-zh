    Edit the Apache SSL configuration file:

    $ sudo nano /etc/apache2/sites-available/default-ssl.crt


    Update the configuration to use the new certificates:


    SSLCertificateFile /etc/ssl/certs/alphaproject.crt

    SSLCertificateKeyFile /etc/ssl/private/alphaproject.key


    Restart the Apache server to apply the changes:

    $ sudo systemctl restart apache2


    With the self-signed certificate and encrypted private key, the Apache server
    for AlphaProject is now up to use SSL/TLS, guaranteeing secure HTTPS connections.
    This configuration prevents eavesdropping and tampering with data transmitted
    between clients and the server.


    # Summary


    This chapter taught you how to better secure your Linux systems with the necessary
    tools and techniques. In the first part of the chapter, we looked at two powerful
    tools for managing firewall rules, iptables and firewalld. In it, the configuration
    steps for these tools to manage traffic and prevent unauthorized access were laid
    out in detail. The section on implementing AppArmor, we covered how to set up
    and enforce AppArmor policies, and we also introduced the idea of using security
    profiles to limit the capabilities of applications.


    Following this, the chapter delves further into the topic of conducting security
    audits using Lynis. We then covered the basics of installing and configuring Lynis,
    as well as how to run security audits and understand the resultant information
    to fix vulnerabilities. We also went over how to apply patches and security updates
    on a regular basis, using Lynis and the Linux command line, to keep the system
    safe and secure.


    While introducing Snort, we covered its features and how it can help with intrusion
    detection and prevention. You will find detailed instructions on how to set up
    Snort to monitor your network traffic and identify possible intrusions. The section
    on monitoring system logs for security emphasized the importance of centralized
    log collection and automated log pulling, showcasing how to use Snort for security
    monitoring and assessment.


    Different methods for securing SSH access were detailed, such as enabling key-based
    authentication, changing the default SSH port, enabling two-factor authentication,
    and disabling root login. In order to set up a secure communication channel, we
    covered how to configure VPNs for, specifically going over an OpenVPN server and
    client. Finally, the chapter demonstrated how to generate and encrypt certificates
    using OpenSSL and configure them for AlphaProject, covering management and encryption.

