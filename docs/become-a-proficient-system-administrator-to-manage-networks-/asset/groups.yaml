    # Configuring VPNs for Secure Connections


    # Introduction to VPNs


    Virtual Private Networks (VPNs) create a secure connection between your local
    network and remote networks over the internet. This is particularly useful for
    AlphaProject, where secure remote access is necessary. VPNs use encryption to
    secure data transmitted over public networks, ensuring that only authorized users
    can access the network. OpenVPN is a popular open-source VPN solution that supports
    both client-server and peer-to-peer configurations. In this section, we will configure
    an OpenVPN server and client to establish a secure connection.


    # Setting up OpenVPN Server


    To set up an OpenVPN server on your Ubuntu system, follow these steps:


    Install OpenVPN and Easy-RSA


    First, install OpenVPN and Easy-RSA, a toolkit for managing SSL/TLS certificates:


    ```

    $ sudo apt update

    $ sudo apt install openvpn easy-rsa

    ```


    # Configure Easy-RSA


    Copy the Easy-RSA scripts to a new directory and navigate to it:

    $ make-cd ~/openvpn-ca

    $ cd ~/openvpn-ca


    Edit the vars file to set your CA variables:

    Set the following values according to your requirements:

    set_var EASYRSA_REQ_COUNTRY "US"

    set_var EASYRSA_REQ_PROVINCE "California"

    set_var EASYRSA_REQ_CITY "San Francisco"

    set_var EASYRSA_REQ_ORG "AlphaProject"

    set_var EASYRSA_REQ_EMAIL "admin@alphaproject.com"

    set_var EASYRSA_REQ_OU "AlphaProject VPN"


    # Build the CA


    Source the vars file and clean up any existing keys:

    $ source vars

    $ ./clean-all

    Build the Certificate Authority (CA):

    $ ./easyrsa build-ca

    Follow the prompts to set the CA password and generate the CA certificate.


    # Generate Server Certificate and Key


    ```

    $ ./easyrsa gen-req server nopass

    $ ./easyrsa sign-req server server

    ```


    # Generate Diffie-Hellman Parameters


    ```

    $ ./easyrsa gen-dh

    ```


    # Generate Client Certificate and Key


    ```

    $ ./easyrsa gen-req client1 nopass

    $ ./easyrsa sign-req client1 client1

    ```


    # Configure OpenVPN


    Create a directory to store the server configuration files:

    $ sudo mkdir -p /etc/openvpn/server

    Copy the generated files to the OpenVPN directory:

    $ sudo cp pki/ca.crt pki/private/server.key pki/issued/server.crt pki/dh.pem /etc/openvpn/server


    Create the OpenVPN server configuration file:

    $ sudo nano /etc/openvpn/server/server.conf

    Add the following configuration:

    port 1194

    proto udp

    dev tun


    ```

    ca ca.crt

    cert server.crt

    key server.key

    dh dh.pem

    server 10.8.0.0 255.255.255.255

    ifconfig-pool-persist ipp.txt

    push "redirect-gateway def1 bypass-dhcp"

    push "dhcp-option DNS 8.8.8.8"

    push "dhcp-option DNS 8.8.4.4"

    keepalive 10 120

    cipher AES-256-CBC

    ```


    user nobody

    group nogroup


    persist-key

    persist-tun

    status openvpn-status.log

    verb 3


    # Enable IP Forwarding


    Enable IP forwarding to allow traffic to flow between the VPN and the internet:

    $ sudo nano /etc/sysctl.conf

    Uncomment the following line:

    net.ipv4.ip_forward=1

    Apply the changes:

    $ sudo sysctl -p


    # Configure UFW


    Allow OpenVPN traffic through the firewall and configure NAT

    $ sudo ufw allow 1194/udp

    $ sudo nano /etc/ufw/before.rules

    Add the following rules at the top of the file:

    *nat

    :POSTROUTING ACCEPT [0:0]

    :POSTROUTING DROP [0:0]

    -A POSTROUTING -s 10.8.0.0/24 -o eth0 -j MASQUERADE


    COMMIT


    Enable UFW:

    $ sudo ufw enable


    # Restart UFW

    $sudo ufw restart


    # Start OpenVPN

    $ sudo systemctl start openvpn@server


    # Enable OpenVPN

    $ sudo systemctl enable openvpn@server


    # Configuring OpenVPN Client


    Create a configuration file for the client:

    $ sudo nano /etc/openvpn/client/client.ovpn


    Add the following configuration:

    ```

    client

    resolv-

    proto udp

    dev tun

    ca ca.crt

    cert client.crt

    key client.key

    tls-auth ta.key 0

    remote server 1194

    nobind

    persist-key

    persist-tun

    verb 3

    ```


    # Connect to VPN


    To connect to the VPN, run the following command:

    $ sudo openvpn --config /etc/openvpn/client/client.ovpn

