    # Perform Network Diagnosis


    System administrators rely on network diagnostics to keep their networks running
    smoothly and reliably. Connectivity issues, packet loss, latency, and other network-related
    problems can impact the overall performance of systems and applications. Performing
    a network diagnostic can assist in discovering the main cause of these problems.
    When diagnosing a network, it is also important to use a variety of tools and
    techniques to examine network activity, identify problems, and apply fixes.


    # Importance of Network Diagnosis


    For AlphaProject or any IT environment, maintaining optimal network performance
    is essential. Network diagnosis allows system administrators to:'
- md: '

    Determine if devices can communicate with each other over the network.

    - Understand delays and data loss in network communication.

    - Identify the route taken by packets from the source to the destination.

    - Detect unauthorized access and potential threats.

    - Make adjustments to improve speed and efficiency.


    ## Exploring ‘ping’


    The ping command is a simple yet powerful tool for diagnosing network connectivity
    issues. It sends ICMP (Internet Control Message Protocol) Echo Request packets
    to a target host and waits for Echo Reply packets. This helps verify if the target
    host is reachable and measures the round-trip time.


    ## Basic ‘ping’ Usage


    To check if a host is reachable, use the ping command followed by the IP address
    or hostname of the target.


    ```

    $ ping 192.168.1.1

    ```

    Following is the sample output:

    PING 192.168.1.1 (192.168.1.1) 56(84) bytes of data.

    64 bytes from 192.168.1.1: icmp_seq=1 ttl=0.234 ms

    64 bytes from 192.168.1.1: icmp_seq=2 ttl=0.218 ms

    64 bytes from 192.168.1.1: icmp_seq=3 ttl=0.211 ms


    ## Specifying the Number of Packets


    Use the -c option to specify the number of packets to send.


    ```

    $ ping -c 4 192.168.1.1

    ```


    ## Continuous Ping


    To continuously ping a host until interrupted, use the ping command without the
    -c option.


    ```

    $ ping alphaproject.local

    ```


    ## Ping with Interval


    Use the -i option to set the interval between packets.


    ```

    $ ping -i 2 192.168.1.1

    ```


    ## Ping with Packet Size


    Use the -s option to specify the size of the packets.


    ```

    $ ping -s 1000 192.168.1.1

    ```


    ## Interpreting ‘ping’ Results


    - Round-Trip Time (RTT): Indicates the time taken for a packet to travel to the
    target and back.

    - Packet Loss: Shows the percentage of packets lost during transmission.

    - TTL (Time to Live): Indicates the number of hops a packet can make before being
    discarded.


    ## Sample Program: Diagnosing Network Connectivity Issues


    To diagnose network connectivity issues within AlphaProject, perform the following
    steps:


    ### Ping the Gateway


    Check if the gateway is reachable.


    ```

    $ ping -c 4 192.168.1.1

    ```


    ### Ping Internal Hosts


    Ping other devices within the AlphaProject network.


    ```

    $ ping -c 4 10.0.0.101

    $ ping -c 4 10.0.0.102

    ```


    ### Ping External Hosts


    Check connectivity to external hosts, such as DNS servers or external websites.


    ```

    $ ping -c 4 8.8.8.8

    $ ping -c 4 google.com

    ```


    ## Exploring ‘traceroute’


    The traceroute command traces the path packets take from the source to the destination,
    displaying each hop along the route. This helps identify where delays or failures
    occur in the network.


    ## Installing ‘traceroute’


    ```

    $ sudo apt update

    $ sudo apt install traceroute

    ```


    ## Basic ‘traceroute’ Usage


    To trace the route to a destination, use the traceroute command followed by the
    IP address or hostname.


    ```

    $ traceroute 192.168.1.1

    ```

    Following the sample output:

    traceroute to 192.168.1.1 (192.168.1.1), 30 hops max, 60 byte packets

    1 10.0.0.1 (10.0.0.1) 0.123 ms 0.098 ms 0.089 ms

    2 192.168.1.1 (192.168.1.1) 0.234 ms 0.218 ms 0.211 ms


    ## Specifying Maximum Number of Hops


    Use the -m option to set the maximum number of hops.

    $ traceroute -m 20 8.8.8.8


    ## Using ICMP Instead of UDP


    By default, traceroute uses UDP packets. Use the -I option to use ICMP packets.

    $ traceroute -I 192.168.1.1


    ## Setting the Packet Size


    Use the -s option to specify the size of the packets.

    $ traceroute -s 1000 8.8.8.8


    ## Interpreting ‘traceroute’ Results


    - Hop Count: The number of hops from the source to the destination.

    - Round-Trip Time (RTT): The time taken for packets to travel to each hop and
    back.

    - Star (*): Indicates that the packet timed out or the router is not responding.


    ## Sample Program: Diagnosing Network Path Issues


    To diagnose network path issues within AlphaProject, perform the following steps:


    ### Trace the Route to the Gateway


    Check the route to the gateway.

    $ traceroute 192.168.1.1


    ### Trace the Route to Internal Hosts


    Trace the route to other devices within the AlphaProject network.

    $ traceroute 10.0.0.101

    $ traceroute 10.0.0.102


    ### Trace the Route to External Hosts


    Check the route to external hosts, such as DNS servers or external websites.


    ```

    $ traceroute 8.8.8.8

    $ traceroute google.com

    ```


    ## Combine ‘ping’ and ‘traceroute''


    Using both ping and traceroute provides a comprehensive view of network connectivity
    and path issues.


    ### Start with ‘ping’


    Begin by pinging the target host to check basic connectivity and measure round-trip
    time.


    ```

    $ ping -c 4 192.168.1.1

    $ ping -c 4 8.8.8.8

    ```


    ### Use “traceroute for Path Analysis


    If ping reveals high latency or packet loss, use traceroute to identify where
    along the route the issue occurs.


    ```

    $ traceroute 192.168.1.1

    $ traceroute 8.8.8.8

    ```


    Consider a scenario where users report slow network performance when accessing
    external resources. Follow the below steps to diagnose the issue:


    - Ping External DNS Server

    - Check the connectivity and latency to an external DNS server.

    - $ ping -c 4 8.8.8.8

    - Trace the Route to External DNS Server

    - Analyze the path to the external DNS server to identify any bottlenecks or delays.


    ```

    $ traceroute 8.8.8.8

    ```


    - Ping Internal Gateway

    Verify the internal network performance by pinging the gateway.


    ```

    $ ping -c 4 192.168.1.1

    ```


    - Trace the Route to Internal Gateway

    Check the path to the internal gateway for any issues.


    ```

    $ traceroute 192.168.1.1

    ```


    ## Analyze Results


    If ping to the external DNS server shows high latency or packet loss, and traceroute
    reveals delays at specific hops, the issue may lie with an intermediate network
    device or ISP.


    If ping and traceroute results are normal, the internal network is likely functioning
    correctly.


    Both, Ping and traceroute diagnostics work together to help pinpoint the source
    and nature of network problems. As a result, issues may be more precisely identified
    and addressed, leading to AlphaProject''s optimal network performance.


