    ## 实现 AppArmor


    ### AppArmor 简介


    AppArmor 是一种 Linux 安全模块（LSM），通过将程序限制在预定义的规则范围内提供了一种限制程序能力的机制。AppArmor 通过对应用程序实施访问控制策略，来防止它们访问未经允许的资源。


    AppArmor 使用配置文件（profiles）来限制应用程序的能力。配置文件指定了应用程序可以访问的资源，例如文件、目录、网络套字和其他系统资源。通过定义和强制这些配置，AppArmor
    有助于将应用程序限制在预期操作范围内，减少安全风险。


    AppArmor 的用途：


