    /usr/bin/webapp {

    # Allow read-only access to the web directory

    /var/www/html/ r,

    # Deny access to sensitive directories

    deny /home/** rw,

    deny /etc/** rw,

    deny /var/log/** rw,

    }

    ```

    Enforce the profile:

    $ sudo aa-enforce /etc/apparmor.d/usr.bin.webapp


