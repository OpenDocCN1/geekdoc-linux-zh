    \ ### 由 Alembic 自动生成的命令 - 请调整！ ###\n    op.drop_table('projects')\n    op.drop_table('users')\n\
    \    # ### end Alembic commands ###\n```\n\n### 应用迁移\n\n将迁移应用数据库：\n$ alembic upgrade\
    \ head\n此命令将数据库模式更新为匹配模型的现状。\n\n## 系统间迁移数据库\n\n要将数据库迁移到外部系统，首先导出当前数据库：\n$ pg_dump\
