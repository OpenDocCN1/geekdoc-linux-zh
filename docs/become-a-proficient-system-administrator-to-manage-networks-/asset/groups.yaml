    # Exploring Wireshark


    Wireshark is an advanced network protocol analyzer that captures and displays
    data packets for in-depth assessment. It has a graphical user interface that makes
    it easy to understand network data and supports multiple protocols. A network
    packet analyzer is like a voltmeter for electrical cables; it measures current
    and voltage but at a higher level, allowing it to see what''s going on inside
    a network cable.


    These tools were either highly exclusive or prohibitively costly in earlier days.
    But that was before the release of Wireshark. Being both free and open source,
    Wireshark has quickly become one of the most popular and effective packet analyzers
    on the market.


    # Installing Wireshark


    To install Wireshark on Ubuntu, use the following commands:


    ```

    $ sudo apt update

    ```


    ```

    $ sudo apt install wireshark

    ```


    During the installation, you may be prompted to allow non-superusers to capture
    packets. Select ''Yes'' and continue.


    # Adding Your User to the Wireshark Group


    To allow your user to capture packets without root privileges, add your user to
    the wireshark group:


    ```

    $ sudo usermod -aG wireshark $(whoami)

    ```


    Log out and log back in for the changes to take effect.


    # Starting Wireshark


    Launch Wireshark from the application menu or by typing the following command
    in the terminal:


    ```

    $ wireshark

    ```


    # Capturing Packets with Wireshark


    When Wireshark starts, you will see a list of available network interfaces. Follow
    these steps to start capturing packets:


    - Select the desired network interface (e.g., eth0)

    - Click the "Start" button to begin capturing packets.


    Wireshark will start capturing packets on the selected interface and display them
    in real-time.


    # Filtering Captured Traffic


    Wireshark allows you to apply filters to focus on specific types of traffic. Some
    common filters include:


    Filter by IP Address:


    ```

    ip.addr == 192.168.1.1

    ```


    Filter by Protocol:


    - tcp

    - udp

    - icmp


    Filter by Port Number:


    ```

    tcp.port == 80

    udp.port == 53

    ```


    # Analyzing Packets and Saving Capture


    Click on a packet in the capture window to view its details. The packet details
    pane displays information about the packet''s layers, such as Ethernet, IP, TCP,
    and application layer protocols.


    To save a capture for later analysis:


    - Click File > Save

    - Choose a location and file name, then click Save


    To load a saved capture:


    - Click File > Open

    - Select the capture file and click Open


    # Sample Program: Network Traffic Analysis using Wireshark


    We shall now perform a network traffic analysis for AlphaProject using Wireshark.


    # Start Wireshark


    Open Wireshark and select the network interface you want to monitor (e.g., eth0).
    Click "Start" to begin capturing packets.


    # Generate Network Traffic


    To generate network traffic, you can use commands like ping and curl.


    Ping an External Host:

    $ ping -c 4 google.com


    Fetch a Web Page:

    $ curl -O http://gitforgits


    # Apply Filters in Wireshark


    To focus on the traffic generated by the ping command, apply an ICMP filter:


    Type icmp in the filter bar and press Enter.


    To focus on the HTTP traffic generated by the curl command, apply an HTTP filter:


    Type http in the filter bar and press Enter.


    # Analyze Packets and Save Capture


    Click on a packet to view its details. For example, an ICMP packet will show the
    source and destination IP addresses, ICMP type, and code.


    And now, save the capture for future reference:


    - Click File > Save

    - Choose a location and file name, then click Save


    # Advanced Wireshark Features


    Wireshark offers several advanced features for detailed network analysis:


    Following TCP Streams


    To follow a TCP stream, right-click on a TCP packet and select Follow > TCP


    Wireshark will display the entire conversation between the client and server,
    making it easier to analyze data exchanges.


    # Using Display Filters


    Display filters refine the view to show only specific packets. Some useful display
    filters include:


    - Show HTTP Traffic:

    http

    - Show DNS Traffic:

    dns

    - Show ARP Traffic:

    arp

    - Show Traffic Between Two IPs:

    ip.src == 192.168.1.100 && ip.dst == 192.168.1.200


    # Creating Custom Profiles


    Wireshark allows you to create custom profiles with specific settings and filters:


    - Click Edit > Configuration Profiles

    - Enter a profile name and configure the settings as needed.


    Switch between profiles.


    # Exporting Data


    To export data:


    - Click File > Export

    - Choose a location and file name, then click Export


    Wireshark also provides command-line tools for analysis.


    # Troubleshooting Issues


    Misconfigurations, malfunctioning hardware, outdated software are just a few potential
    causes. To effectively troubleshoot, one must first recognize the symptoms, isolate
    the source, and finally implement solutions.


    # Common Network Issues


    Dropped connections or intermittent connectivity.

    IP Address Conflicts: Multiple devices assigned the same IP.

    DNS Resolution Failures: Inability to resolve domain names to IP addresses.

    Slow Network Performance: High latency, packet loss, and slow transfer rates.

    Service Failures: Network services (e.g., DHCP, DNS) not functioning.

    Firewall Issues: Incorrect firewall rules blocking legitimate traffic.

    Routing Problems: Incorrect or missing routes causing communication failures.

    Security Incidents: Unauthorized access.


    # Tools for Troubleshooting Network Issues


    - Ping: Tests connectivity to a host.

    - Traceroute: Traces the path packets take to a destination.

    - ifconfig/ip: Displays network interface configurations and statistics.

    - netstat/ss: Shows network connections and listening ports.

    - lookup/dig: Troubleshoot DNS resolution.

    - Tcpdump: Captures and analyzes network packets.

    - Nmap: Scans for open ports and services.

    - Systemctl: Manages system services.

    - Journalctl: View system logs.


