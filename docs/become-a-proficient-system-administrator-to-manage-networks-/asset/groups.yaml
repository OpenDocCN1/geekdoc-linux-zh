    # Tracking Network Performance


    ## Overview


    Monitoring network performance is crucial for ensuring that applications run smoothly
    and efficiently. Following are the key commands for Tracking Network Performance:


    - ping: Checks the reachability of a host and measures round-trip time for messages
    sent from the originating host to a destination computer.

    - traceroute: Traces the route packets take to reach a network host.

    - iftop: Displays bandwidth usage on an interface by host.

    - netstat: Displays network connections, routing tables, interface statistics,
    masquerade connections, and multicast memberships.

    - vnstat: a network traffic monitor for logging and analyzing network traffic
    usage.


    In this section, we will learn some of the best Linux commands for tracking network
    performance, and we then learn how to use these commands to monitor various aspects
    of the network performance for AlphaProject.


    ## Using ''ping'' to Check Network Connectivity


    ping is a basic network utility that tests the reachability of a host on an IP
    network and measures the round-trip time for messages.

    To check the connectivity to a host, run:


    ```bash

    $ ping www.gitforgets.com

    ```


    Following is the desired output:


    PING (93.184.216.34): 56 data bytes 64 bytes from 93.184.216.34: icmp_seq=0 ttl=56
    time=13.3 ms 64 bytes from 93.184.216.34: icmp_seq=1 ttl=56 time=12.9 ms 64 bytes
    from 93.184.216.34: icmp_seq=2 ttl=56 time=13.0 ms


    Wherein:


    - icmp_seq: Sequence number of the message.

    - ttl: Time to live.

    - time: Round-trip time.


    This output shows the latency (time) in milliseconds for packets to reach the
    host and return. Consistently high times or packet loss indicates network issues.


    ## Using ‘traceroute’ to Trace Network Paths


    traceroute shows the path packets take to reach a network host, which helps diagnose
    routing issues.

    Run traceroute Command:

    ```bash

    $ traceroute www.gitforge.com

    ```

    Following is the desired output:

    traceroute to (93.184.216.34), 30 hops max, 60 byte packets 1 router.local (192.168.1.1)
    1.223 ms 1.173 ms 1.157 ms 2 10.0.0.1 (10.0.0.1) 2.432 ms 2.427 ms 2.418 ms 3
    172.16.0.1 (172.16.0.1) 15.367 ms 15.537 ms 15.524 ms 4 example.net (93.184.216.34)
    13.343 ms 13.320 ms 13.301


    In the above output, each line shows a hop in the path, including the router IP
    and round-trip time. Delays or timeouts at specific hops can indicate where issues
    occur.


    ## Using ‘iftop’ to Monitor Bandwidth Usage


    iftop is a real-time console-based network monitoring tool. To begin with, install
    iftop:

    ```bash

    $ sudo apt-get install iftop

    ```

    Run iftop command:

    ```bash

    $ sudo iftop

    ```

    Following is the desired output:


    ```

    interface eth0 => dst. <= src 192.168.1.2:49152 => 93.184.216.34:80 4.00Kb 4.00Kb
    4.00Kb

    192.168.1.2:49152 <= 93.184.216.34:80 3.00Kb 3.00Kb 3.00Kb TX: cum: 4.00Kb peak:
    4.00Kb rates: 4.00Kb 4.00Kb

    RX: cum: 3.00Kb peak: 3.00Kb rates: 3.00Kb 3.00Kb

    TOTAL: cum: 7.00Kb peak: 7.00Kb rates: 7.00Kb 7.00Kb

    ```


    In the above iftop output,

    TX: Transmit rates.

    RX: Receive rates.

    TOTAL: Combined traffic. This output helps identify which hosts are using the
    most bandwidth.


    ## Using ‘netstat’ to Display Network Statistics


    netstat provides network statistics and details about connections.

    ```bash

    $ netstat -tuln

    ```

    Following is the desired output:

    ```

    Active Internet connections (only servers) Proto Recv-Q Send-Q Local Address Foreign
    Address State

    tcp 0 0 0.0.0.0:22 0.0.0.0:* LISTEN

    tcp6 0 0 :::80 :::*: LISTEN

    udp 0 0 0.0.0.0:123 0.0.0.0*

    udp6 0 0 :::123 :::*:

    ```


    In the above netstat output,

    - Proto: Protocol (TCP, UDP).

    - Recv-Q: Receive queue.

    - Send-Q: Send queue.

    - Local Address: Local IP and port.

    - Foreign Address: Remote IP and port.

    - State: Connection state (LISTEN, ESTABLISHED, etc.).


    This output shows active connections and listening ports.


    ## Using ‘vnstat’ to Monitor Network Traffic


    vnstat logs network traffic and provides statistics on usage. To begin with, install
    vnstat:

    ```bash

    $ sudo apt-get install vnstat

    ```

    Initialize vnstat:

    ```bash

    $ sudo vnstat -u -i eth0

    ```

    Run vnstat command:

    ```bash

    $ vnstat

    ```

    Following is the desired output:


    ```

    rx / tx / total / estimated eth0: Apr ''24 1.95 GiB / 1.23 GiB / 3.18 GiB / 3.51
    GiB today 50.34 MiB / 30.20 MiB / 80.54 MiB / 101.2 MiB

    ```


    In the below vnstat output,

    - rx: Received data.

    - tx: Transmitted data.

    - total: Combined traffic.

    - estimated: Estimated traffic for the period.


    This output provides an overview of network usage over time.


