    ## Managing Task Automation with ‘cron’ and ‘anacron’


    ### Introduction to ‘anacron’


    In system administration, scheduling tasks to run automatically at specified intervals
    is essential for maintaining system performance and consistency. While cron is
    used for scheduling tasks that need to run at precise times or intervals, anacron
    is useful for running tasks that need to be executed periodically, but not necessarily
    at specific times. anacron is a task scheduler that is designed for systems that
    are not always running.


    Unlike cron which requires the system to be up at the time the task is scheduled,
    anacron ensures that periodic tasks are run even if the system was down at the
    scheduled time. It is ideal for laptops, desktops, or any systems that do not
    run continuously. The anacron configuration files are typically located in


    ## Writing Automation Scripts with ‘cron’


    To edit the crontab file for scheduling tasks:


    $ crontab -e


    Hourly Task:

    0 * * * * /path/to/hourly_task.sh


    This entry schedules the hourly_task.sh script to run at the beginning of every
    hour.


    Weekly Task:

    0 2 * * 0 /path/to/weekly_task.sh


    This entry schedules the weekly_task.sh script to run every Sunday at 2 AM.


    Yearly Task:

    0 0 1 * * /path/to/yearly_task.sh


    This entry schedules the yearly_task.sh script to run at midnight January 1st
    every year.


    Following is the sample script:

    ```bash

    #!/bin/bash

    # hourly_task.sh

    echo "Hourly task executed at $(date)" >> /var/log/hourly_task.log

    ```


    Sometimes tasks need to run asynchronously without blocking other operations.
    This can be achieved using & to run tasks in the background.

    ```bash

    #!/bin/bash

    # async_task.sh

    (sleep 30; echo "Async task completed at $(date)" >> /var/log/async_task.log)
    &

    ```


    ## Writing Automation Scripts with ‘anacron’


    Edit the /etc/anacontab file to schedule tasks:

    $ sudo nano /etc/anacontab


    Example Entries:


    Daily Task:

    + 1 5 cron.daily run-parts /etc/cron.daily


    This entry schedules all scripts in /etc/cron.daily to run 5 minutes after anacron
    starts if they haven''t been run in the last day.


    Weekly Task:

    + 7 10 cron.weekly run-parts /etc/cron.weekly


    This entry schedules all scripts in /etc/cron.weekly to run 10 minutes after anacron
    starts if they haven''t been run in the last week.


    Monthly Task:

    + @monthly 15 cron.monthly run-parts /etc/cron.monthly


    This entry schedules all scripts in /etc/cron.monthly to run 15 minutes after
    anacron starts if they haven''t been run in the last month.


    Following is the sample script:


    ```bash

    #!/bin/bash

    # daily_task.sh

    echo "Daily task executed at $(date)" >> /var/log/daily_task.log

    ```


