    # Configuring Firewalls'
- md: '

    The configuration of firewalls is a crucial task for securing your network because
    it allows you to regulate the traffic that is coming into and going out of your
    network based on the security rules that you have already established. Continuing
    on the last section''s introduction to iptables and this section will show how
    to configure firewalls in the context of AlphaProject.


    + Following are the tasks Involved in Configuring Firewalls:

    - Establish rules to allow or block traffic based on IP addresses, ports, and
    protocols.

    - Assign network interfaces to specific zones with varying levels of trust.

    - Set up rules for translating private IP addresses to public IP addresses.

    - Implement logging to monitor traffic and troubleshoot issues.

    - Ensure that the firewall rules are working as expected without disrupting legitimate
    traffic.


    ## Configuring ‘iptables’ for AlphaProject


    We will configure iptables to secure the AlphaProject network by defining some
    following basic rules:


    ### Allow SSH Access


    To allow SSH access on port 22, add the following rule:

    `$ sudo iptables -A INPUT -p tcp --dport 22 -j ACCEPT`


    ### Allow HTTP and HTTPS Traffic


    To allow HTTP and HTTPS traffic on ports 80 and 443, add these rules:


    ```

    $ sudo iptables -A INPUT -p tcp --dport 80 -j ACCEPT

    $ sudo iptables -A INPUT -p tcp --dport 443 -j ACCEPT

    ```


    ### Allow Localhost Traffic


    Allow all traffic on the loopback interface


    ```

    $ sudo iptables -A INPUT -i lo -j ACCEPT

    ```


    ### Drop All Other Incoming Traffic


    To drop all other incoming traffic, add a default deny rule at the end:


    ```

    $ sudo iptables -P INPUT DROP

    $ sudo iptables -A INPUT -j DROP

    ```


    ### Save and Restore Rules


    To save the current iptables rules so they persist after a reboot, use the iptables-save
    command:


    ```

    $ sudo iptables-save > /etc/iptables/rules.v4

    To restore the rules, use the command:

    $ sudo iptables-restore < /etc/iptables/rules.v4

    ```


    ## Configuring ‘firewalld’ for AlphaProject


    Now we shall configure firewalld to secure the AlphaProject network. We will use
    zones to define trust levels and assign interfaces accordingly as below:


    ### Start and Enable firewalld


    Ensure that firewalld is running and enabled to start at boot:


    ```

    $ sudo systemctl start firewalld

    $ sudo systemctl enable firewalld

    ```


    ### Check the Default Zone


    Check the default zone for new connections and interfaces:


    ```

    $ sudo firewall-cmd --get-default-zone

    ```


    ### Assign Interface to a Zone


    Assign the eth0 interface to the public zone:


    ```

    $ sudo firewall-cmd --zone=public --change-interface=eth0 --permanent

    ```


    ### Allow SSH Access


    To allow SSH access in the public zone:


    ```

    $ sudo firewall-cmd --zone=public --add-service=ssh --permanent

    ```


    ### Allow HTTP and HTTPS Traffic


    To allow HTTP and HTTPS traffic in the public zone:


    ```

    $ sudo firewall-cmd --zone=public --add-service=http --permanent

    $ sudo firewall-cmd --zone=public --add-service=https --permanent

    ```


    ### Allow Localhost Traffic


    By default, firewalld allows all traffic on the loopback interface. Verify this
    configuration:


    ```

    $ sudo firewall-cmd --zone=trusted --list-all

    ```


    ### Reload Firewall Rules


    Reload the firewall rules to apply the changes:


    ```

    $ sudo firewall-cmd --reload

    ```


    ### Verify the Configuration


    List the rules in the public zone to verify the configuration:


    ```

    $ sudo firewall-cmd --zone=public --list-all

    ```


