    # Defining and Enforcing AppArmor Policies


    AppArmor profiles define the security policies for applications. These profiles
    can be created manually or generated using tools provided by AppArmor.


    # Create a Profile for a Specific Application


    We shall create a profile for a sample application, First, locate the application
    binary:

    $ which example-app

    Assuming the application is located at /usr/bin/example-app, create a profile
    for it:


    ```bash

    $ sudo aa-genprof /usr/bin/example-app

    ```


    # Define-the-Profile


    This command will start the AppArmor profiling mode, where you can define the
    policy interactively.


    Run the application to generate log entries:

    $ sudo /usr/bin/example-app


    AppArmor will monitor the application''s behavior and generate profile entries.
    After running the application, finish the profile generation:

    $ sudo aa-logprof


    Follow the prompts to define the permissions for the application. Once done, the
    profile will be enforced.


    # Enforce the Profile


    Ensure the profile is enforced:

    $ sudo aa-enforce /etc/apparmor.d/usr.bin.example-app

    Verify the profile status:

    $ sudo apparmor_status


    # Role-Based Access Control (RBAC)


    AppArmor supports RBAC, allowing you to define roles and assign permissions to
    users and applications.

    Define roles and assign permissions using AppArmor profiles. For example, create
    a profile for a web server role:

    /etc/apparmor.d/usr.sbin.apache2

    Edit the profile to define the permissions:


    ```bash

    # Include common includes for apache2

    #include

    /usr/sbin/apache2 {

    # Enforce read-only access to the web directory

    /var/www/html/ r,

    # Allow apache to read configuration files

    /etc/apache2/** r,

    # Allow apache to write to log files

    /var/log/apache2/** rw,


    # access to any other files or directories

    deny /home/** rw,

    deny /etc/** rw,

    }

    ```

    Apply and enforce the role:

    $ sudo aa-enforce /etc/apparmor.d/usr/sbin.apache2


    # Integrating AppArmor with PAM


    AppArmor can be integrated with PAM to enhance user authentication and access
    control.

    Edit the PAM configuration file for SSH, typically located at

    $ sudo nano /etc/pam.d/sshd

    Add the following line to integrate AppArmor:

    auth required pam_apparmor.so

    Create a profile for PAM modules, such as to define access control policies for
    SSH sessions.


    ```bash

    # Include common includes for sshd

    #include

    /usr/sbin/sshd {

    # Allow read access to SSH configuration files

    /etc/ssh/sshd_config r,

    # Allow sshd to execute its binary

    /usr/sbin/sshd ix,

    # Deny access to other sensitive files

    deny /etc/passwd rw,

    deny /etc/shadow rw,

    }

    ```

    Enforce the profile:

    $ sudo aa-enforce /etc/apparmor.d/usr.sbin.sshd


