    In this section, we will learn the key infrastructure resources monitored by sysadmins,
    introduce tools like vmstat and demonstrate how to calculate and monitor usage.


    ## Tools for Monitoring CPU and Memory Usage


    vmstat is a versatile tool that provides a snapshot of system performance, including
    CPU and memory usage. It offers a real-time view of various system metrics and
    is useful for identifying performance issues. top and htop are interactive tools
    that display real-time system information. They provide detailed views of processes,
    CPU, memory usage, and more. mpstat is another tool that provides CPU usage statistics,
    which can be useful for monitoring multi-processor systems.


    ### Using ‘vmstat’ to Monitor CPU and Memory Usage


    Ensure vmstat is installed on your system:


    ```bash

    $ sudo apt update && sudo apt install sysstat

    ```


    Run vmstat to see the output:


    ```

    $ vmstat 5 5

    ```


    ```

    This command runs vmstat with a 5-second interval, printing 5 reports.

    procs ----------memory----------swap-----io--system-----

    cpu----r b swpd pd free buff cache si so bo in cs us id wa st 1 0 0

    12345 6789 12345 0 0 1 2 10 20 5 9 3 0

    ```


    The columns in the output represent various metrics:


    - procs: r (processes running), b (processes blocked).

    - memory: swpd (swap used), free (free memory), buff (buffer memory), cache (cached
    memory).

    - swap: si (swap in), so (swap out).

    - io: bi (blocks in), bo (blocks out).

    - system: in (interrupts per second), cs (context switches per second).

    - cpu: us (user time), sy (system time), id (idle time), wa (wait time), st (steal
    time).


    CPU usage is represented by the us and st columns. High values in us and sy indicate
    heavy CPU usage by user and system processes, respectively. A high value indicates
    significant I/O wait time, which could be a performance bottleneck. Following
    is the desired output of Analysis:


    ```

    ------cpu------ us sy id wa st 5 2 90 3 0

    ```


    In the above given snippet, the CPU is 90% idle, 5% used by user processes, 2%
    by system processes, and 3% waiting for I/O operations. Memory usage is shown
    in the buff and cache columns. Monitoring these values helps identify potential
    memory shortages or inefficiencies. Following is the desired output of Analysis:


    ```

    ----------memory---------- swpd free buff cache 0 12345 6789 12345

    ```


    In the above code, free shows the available memory, buff the buffer memory, and
    cache the cached memory.


    ## Using ‘top’ and htop for Real-Time Monitoring


    Run top to view real-time system performance:


    ```bash

    $ top

    ```


    The top command provides a dynamic view of system performance, displaying processes,
    CPU, and memory usage. Following is the desired output:


    ```

    top - 15:29:03 up 1:29, 1 user, load average: 0.14, 0.19, 0.21 Tasks: 115 total,
    1 running, 114 sleeping, 0 stopped, 0 zombie %Cpu(s): 3.0 us, 1.0 sy, 0.0 ni,
    95.0 id, 1.0 wa, 0.0 hi, 0.0 si, 0.0 KiB Mem : 2048576 total, 198432 free, 543672
    used, 1301472 buff/cache KiB Swap: 2097148 total, 2097148 free, 0 used. 978112
    avail USER PR NI VIRT RES SHR S %CPU %MEM TIME+ COMMAND 123 root 20 0 162708 2624
    1300 S 0.7 0.1 0.00:32 bash 456 postgres 20 0 262476 11236 9056 S 0.3 0.5 0.02:05

    ```


    - %Cpu(s): Displays CPU usage by user system nice idle I/O wait hardware interrupts
    soft interrupts and steal.

    - KiB Mem: Shows total, free, used, and buffer/cache memory.

    - KiB Swap: Shows total, free, and used swap memory.

    - Processes: Lists active processes, with columns for PID, user, priority, nice
    value, virtual memory, resident memory, shared memory, state, CPU usage, memory
    usage, and command.


    Then, install htop for an enhanced, interactive view:


    ```bash

    $ sudo apt install htop

    ```


    htop provides a more user-friendly interface with color-coded metrics, making
    it easier to monitor CPU and memory usage. Following is the desired output:


    ```

    [ 1.6%] Tasks: 115, 1 running [2 0.0%] Load average: 0.14 0.19 0.21 Mem[|||543M/2.0G]
    Uptime: 133 Swp[0K/2.0G] PID USER PR VIRT RES SHR S CPU% %MEM% TIME+ Command 123
    root 20 0 162708 2624 1300 S 0.7 0.1 0.00:32 bash 456 postgres 20 0 262476 11236
    9056 S 0.3 0.5 0.02:05

    ```


    ### Using ‘mpstat’ for Detailed CPU Usage


    Ensure mpstat is installed:


    ```bash

    $ sudo apt install sysstat

    ```


    Run mpstat to get detailed CPU statistics:


    ```bash

    $ mpstat -P ALL 5 5

    ```


    This command shows CPU usage for all processors every 5 seconds. Following is
    the desired output:


    ```

    11:04:27 AM CPU %usr %nice %sys %iowait %irq %soft %steal %guest %idle

    11:04:32 AM 0.64 0.05 0.09 0.01 0.00 1.83 0.00 97.61

    ```


    In the above output,

    - %usr: User time.

    - %nice: Nice time.

    - %sys: System time.

    - %iowait: I/O wait time.

    - %irq: Hardware interrupt time.

    - %soft: Software interrupt time.

    - %steal: Steal time.

    - %guest: Guest time.

    - %idle: Idle time.


    ## Sample Program: Monitoring System Resources


    We shall monitor CPU and memory usage using vmstat:


    ```bash

    $ vmstat 5 5

    ```


    Analyze the output to identify CPU and memory patterns. Run top for a real-time
    view:


