    ## 使用‘cron’编写自动化脚本


    编辑 crontab 文件以调度任务：


    $ crontab -e


    每小时任务：

    0 * * * * /path/to/hourly_task.sh


    此条目调度 `hourly_task.sh` 脚本在每小时开始时运行。


    每周任务：

    0 2 * * 0 /path/to/weekly_task.sh


    此条目调度 `weekly_task.sh` 脚本在每周日凌晨 2 点运行。


    每年任务：

    0 0 1 * * /path/to/yearly_task.sh


    此条目调度 `yearly_task.sh` 脚本在每年1 月 1 日午夜运行。


    以下是示例脚本：

