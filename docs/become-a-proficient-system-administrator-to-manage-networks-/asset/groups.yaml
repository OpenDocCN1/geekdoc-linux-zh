    ## Securing Database Systems


    ## Overview


    Securing database systems is essential to protect sensitive data from unauthorized
    access and potential breaches. Database security involves implementing measures
    to safeguard data, control access, and ensure that only authorized users can perform
    specific actions. This includes setting proper authentication, managing access
    permissions, encrypting data, and monitoring for suspicious activities.


    ## Authentication and Access Control


    ### Strong Password Policies


    Ensure all users have strong passwords. PostgreSQL can enforce password policies
    through:


    Edit the file to require password authentication:

    $ sudo nano /etc/postgresql/12/main/pg_hba.conf


    Ensure the following entries use md5 or scram-sha-256 for password hashing:


    - host all 127.0.0.1/32 scram-sha-256

    - host all ::1/128 scram-sha-256


    Restart the PostgreSQL service to apply the changes:

    $ sudo systemctl restart postgresql


    ### Role-Based Access Control


    Create roles with specific privileges and assign users to these roles.

    ```sql

    CREATE ROLE read_only;

    GRANT CONNECT ON DATABASE alphaproject_db TO read_only;

    GRANT USAGE ON SCHEMA public TO read_only;

    GRANT SELECT ON ALL TABLES IN SCHEMA public TO read_only;

    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO read_only;

    ```


    Assign Users to the Role

    ```sql

    GRANT read_only TO some_user;

    ```


    ## Network Security


    ### Configuring Firewall


    Use iptables or ufw to restrict access to the PostgreSQL server. To limit PostgreSQL
    to accept connections only from the localhost:

    $ sudo ufw allow from 127.0.0.1 to any port 5432


    ### Encryption


    Encrypt traffic between the PostgreSQL server and clients to protect data in transit.
    Generate a self-signed SSL certificate and key:

    $ sudo openssl req -new -x509 -days 365 -nodes -out /etc/ssl/certs/postgresql.crt
    -keyout /etc/ssl/private/postgresql.key

    $ sudo chmod 600 /etc/ssl/private/postgresql.key


    ```ini

    Configure PostgreSQL to Use SSL by editing the postgresql.conf file to enable
    SSL:

    $ sudo nano /etc/postgresql/12/main/postgresql.conf

    Ensure the following settings are configured:

    ssl = on

    ssl_cert_file = ''/etc/ssl/certs/postgresql.crt''

    ssl_key_file = ''/etc/ssl/private/postgresql.key''

    ```


    Restart the PostgreSQL service:

    $ sudo systemctl restart postgresql


    ## Data Encryption


    ### Encrypting Data at Rest


    Encrypt the database files on disk to protect data if the physical storage is
    compromised. Use LUKS (Linux Unified Key Setup) to encrypt the file system where
    PostgreSQL data is stored.

    $ sudo cryptsetup luksFormat /dev/sdX

    $ sudo cryptsetup luksOpen /dev/sdX encrypted_data

    $ sudo mkfs.ext4 /dev/mapper/encrypted_data

    $ sudo mount /dev/mapper/encrypted_data /var/lib/postgresql


    ### Column-Level Encryption


    Use PostgreSQL''s built-in functions or extensions to encrypt specific columns.
    Install the pgcrypto extension if not already installed:

    $ sudo -u postgres psql -c "CREATE EXTENSION pgcrypto;"


    Encrypt sensitive data when inserting:

    ```sql

    INSERT INTO users (username, password, email)

    VALUES (''john_doe'', crypt(''password123'', gen_salt(''bf'')), ''john_doe@gitforge.com'');

    ```

    Decrypt data when querying:

    ```sql

    SELECT username, email, (password = crypt(''password123'', password)) AS password_match

    FROM users

    WHERE username = ''john_doe'';

    ```


    ## Monitoring and Auditing


    ### Logging


    Enable detailed logging to track access and changes to the database.

    Edit the postgresql.conf file to configure logging:


    ```bash

    $ sudo nano /etc/postgresql/12/main/postgresql.conf

    ```

    Set the following parameters:

    ```ini

    logging_collector = on

    log_directory = ''pg_log''

    log_filename = ''postgresql-%a.log''

    log_statement = ''all''

    log_duration = on

    ```


    Restart the PostgreSQL service:

    $ sudo systemctl restart postgresql


    ### Using Audit Extensions


    Install and configure audit extensions such as pgaudit to monitor and log database
    activities.


    Install the pgaudit extension:

    $ sudo apt-get install postgresql-12-pgaudit


    Edit the postgresql.conf file to load the pgaudit and configure auditing:

    ```ini

    shared_preload_libraries = ''pgaudit''

    pgaudit.log = ''all''

    ```

