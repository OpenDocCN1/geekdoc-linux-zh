    # Disabling Root Login


    Disabling root login prevents attackers from directly accessing the root account,
    which has the highest privileges.

    Open the SSH configuration file:


    ```

    $ sudo nano /etc/ssh/sshd_config

    ```


    Find the following line and set it to

    PermitRootLogin no

    Restart the SSH service to apply the changes:

    $ systemctl restart sshd


    # Using Key-Based Authentication


    Key-based authentication provides a more secure method of logging into SSH than
    password authentication.

    Generate a key pair on the client machine:


    ```

    $ ssh-keygen -t rsa -b 4096

    ```'
