    # Chapter 6: Automation and Scripting'
  - '[PAGE 267]


    # Introduction


    Shell scripting is a powerful tool for system administrators, and this chapter
    will introduce you to it. Shell scripting is introduced in this chapter with an
    introduction that covers the basics and how important it is for automating routine
    tasks. Using variables and control structures, you will learn to develop basic
    scripts that can handle diverse system operations efficiently and dynamically.


    Moving on to the next topic, "automating system tasks," this chapter delves into
    the ins and outs of cron and anac script scheduling and management, allowing users
    to set up automatic job execution at predetermined times. We will learn how to
    use awk and sed to process text and show how these tools can make it easier to
    change and analyze text files.


    Also covered is how to create scripts for system audits, so you can keep an eye
    on your system''s security and health and report back to your boss as necessary.
    We will go over ways to automate resource management and show you how to write
    scripts that efficiently handle things like memory, storage space, and CPU. At
    last, the chapter will go over the process of making backup and recovery scripts,
    which will make sure that important data is backed up automatically and can be
    readily recovered in the event that data loss occurs.


    # Shell Scripting Overview'
- md: "\nThere are a lot of benefits to shell scripting, and it helps system administrators\
    \ manage and automate activities much more efficiently.\nAutomation is the main\
    \ advantage of shell scripting. It helps system administrators to reduce human\
    \ error and manual intervention by automating repetitive processes. System administration\
    \ becomes more consistent and productive as a result. Shell scripting also makes\
    \ it easier to run complicated command sequences that would be tedious to run\
    \ by hand.\n\n## Advantages of Shell Scripting\n\n- Automate routine tasks like\
    \ backups, system updates, and user management.\n- Execute multiple commands in\
    \ sequence without manual intervention, saving time and effort.\n- Ensure that\
    \ tasks are performed the same way every time, reducing the chance of errors.\n\
    - Handle complex tasks that involve multiple steps and dependencies.\n- Tailor\
    \ scripts to meet specific administrative needs and workflows.\n- Easily scale\
    \ operations across multiple systems by deploying scripts across servers.\n\n\
    ## Automation Scripting Use-Cases\n\n### Backup and Recovery\n\nShell scripting\
    \ can automate the backup of critical data, reducing the risk of data loss and\
    \ ensuring that backups are performed consistently. A script can be scheduled\
    \ to run at regular intervals, creating backups and storing them securely.\n\n\
    Following the sample script:\n\n```bash\n#!/bin/bash\nBACKUP_DIR=\"backup\"\n\
    SOURCE_DIR=\"data\"\nTIMESTAMP=$(date +%F)\nBACKUP_FILE=\"$BACKUP_DIR/backup-$TIMESTAMP.tar.gz\"\
    \ntar -czf $BACKUP_FILE $SOURCE_DIR\necho \"Backup created at\\n$BACKUP_FILE\"\
    \n```\n\nThis script compresses the contents of the /data directory into a tarball\
    \ and stores it in the /backup directory with a timestamp.\n\n### System Updates\n\
    \nKeeping the system and software up-to-date is crucial for security and performance.\
    \ Shell scripts can automate the update process, ensuring that updates are applied\
    \ regularly without manual intervention.\n\nFollowing is the sample script:\n\n\
    ```bash\n#!/bin/bash\napt-get update\napt-get upgrade -y\necho \"System updated\
    \ on\\n$(date)\"\n```\n\nThis script updates the package list and upgrades all\
    \ installed packages, logging the update time.\n\n### User Management\n\nManaging\
    \ user accounts can be automated to streamline the process adding, modifying,\
    \ and removing users. This is particularly useful in environments with high user\
    \ turnover or where user settings need to be standardized.\n\nFollowing is the\
    \ sample script:\n\n```bash\n#!/bin/bash\nUSERNAME=$1\nPASSWORD=$2\nif [ \"$USERNAME\"\
    \ &>/dev/null; then\n    echo \"User $USERNAME already exists\"\nelse\n    useradd\
    \ -m $USERNAME\n    echo \"$USERNAME:$PASSWORD\" | chpasswd\n    echo \"User $USERNAME\
    \ created\"\nfi\n```\n\nThis script creates a new user with a specified username\
    \ and password if the user does not already exist.\n\n### Resource Monitoring\n\
    \nRegularly monitoring system resources helps prevent issues before they become\
    \ critical. Scripts can be used to check resource usage and send alerts if usage\
    \ exceeds certain thresholds.\n\nFollowing the sample script:\n\n```bash\n#!/bin/bash\n\
    THRESHOLD=80\nUSAGE=$(df / | grep | awk '{print $5}' | sed 's/%//')\nif [ $USAGE\
    \ -gt $THRESHOLD ]; then\n    echo \"Disk usage is above $THRESHOLD% on ($hostname)\"\
    \ | mail -s \"Disk Usage Alert\" admin@gitforgets.com\nfi\n```\n\nThis script\
    \ checks the disk usage of the root filesystem and sends an email alert if usage\
    \ exceeds 80%.\n\n### Log Management\n\nLogs are essential for diagnosing issues\
    \ and auditing system activities. Automating log management ensures that logs\
    \ are rotated, compressed, and archived, freeing up disk space and keeping the\
    \ system organized.\n\nFollowing is the sample script:\n\n```bash\n#!/bin/bash\n\
    LOG_DIR=\"/var/log/myapp\"\nARCHIVE_DIR=\"/var/log/archive\"\nfind $LOG_DIR -type\
    \ f -mtime +30 -exec gzip {} \\;\nfind $LOG_DIR -type f -name \"*.gz\" -exec mv\
    \ {} $ARCHIVE_DIR/ \\;\n```\n\nThis script compresses log files older than 30\
    \ days and moves them to an archive directory.\n\n### Task Scheduling\n\nShell\
    \ scripts can be scheduled using cron to perform regular maintenance tasks, ensuring\
    \ the system remains in optimal condition without requiring manual intervention.\n\
    \nFollowing is the sample script of Cron Job:\n`0 2 * * /path/to/backup.sh`\n\
    This cron job schedules the backup script to run daily at 2 AM.\n\n## Sample Program:\
    \ Automating Daily Report Generation\n\nA common task for system administrators\
    \ is generating daily reports on system health and performance. This can be automated\
    \ using shell scripting.\n\nFollowing is the sample daily report script:\n```bash\n\
    #!/bin/bash\nREPORT_FILE=\"/var/reports/daily-report-$(date +%F).txt\"\necho \"\
    System Report for $(date)\" > $REPORT_FILE\necho \"Disk Usage:\" >> $REPORT_FILE\n\
    echo \"\" >> $REPORT_FILE\necho \"Memory Usage:\" >> $REPORT_FILE\necho \"\" >>\
    \ $REPORT_FILE\nfree -m >> $REPORT_FILE\necho \"\" >> $REPORT_FILE\necho \"Top\
    \ Processes:\" >> $REPORT_FILE\ntop -b -n 1 | head -n 20 >> $REPORT_FILE\necho\
    \ \"\" >> $REPORT_FILE\necho \"Network Usage:\" >> $REPORT_FILE\nvnstat -d >>\
    \ $REPORT_FILE\necho \"End of Report\" >> $REPORT_FILE\n```\n\nThis script generates\
    \ a comprehensive report on disk usage, memory usage, top processes, and network\
    \ usage, and saves it to a file with a timestamp.\n\n## Writing Basic Automation\
    \ Scripts\n\nWriting basic scripts is the first step toward automating tasks in\
    \ a Linux environment. In this section, we will cover writing simple automation\
    \ scripts for the AlphaProject, including multiple scenarios to demonstrate different\
    \ aspects of shell scripting.\n\n### Scenario 1: Automating a Directory Backup\n\
    \nA common task is backing up a directory to ensure data is safe. We will create\
    \ a script to automate this process for AlphaProject.\nFollowing is the backup\
    \ script:\n\n```bash\n#!/bin/bash\n# Backup script for AlphaProject\nSOURCE_DIR=\"\
    /var/www/alphapro\"\nBACKUP_DIR=\"backup\"\nTIMESTAMP=$(date +%Y%m%d%H%M%S)\n\
    BACKUP_FILE=\"$BACKUP_DIR/backup-$TIMESTAMP.tar.gz\"\n\necho \"Starting backup\
    \ of $SOURCE_DIR\"\nmkdir -p $BACKUP_DIR\ntar -czf $BACKUP_FILE $SOURCE_DIR\n\
    echo \"Backup completed successfully!\"\n```\n\nIn the above code snippet,\nVariables:\
    \ Define source and backup directories, and create a timestamp for the backup\
    \ file.\nCommands: mkdir -p Create the backup directory if it doesn't exist; tar\
    \ -czf Compress the source directory into a tar.gz file.\n\nRunning the script:\n\
    $ chmod +x backup.sh\n./backup.sh\nFollowing is the output:\nStarting backup of\
    \ /var/www/alphapro to /backup/backup-20240520120000.tar.gz\nBackup completed\
    \ successfully!\n\n### Scenario 2: System Update\n\nUpdating the system regularly\
    \ is crucial. We will create a script to automate system updates.\nFollowing is\
    \ the system update script:\n\n```bash\n#!/bin/bash\n# System update script\n\
    echo \"Updating system packages\"\nsudo apt-get update\nsudo apt-get upgrade -y\n\
    echo \"System update successfully!\"\n```\n\nIn the above code snippet,\nCommands:\
    \ sudo apt-get Update the package list; sudo apt-get upgrade Upgrade all installed\
    \ packages automatically.\n\nRunning the script:\n$ chmod +x update.sh\n./update.sh\n\
    Following is the output:\nUpdating system packages ... System update successfully!\n\
    \n### Scenario 3: Disk Usage Monitoring\n\nMonitoring disk usage helps prevent\
    \ issues. We will create a script to check disk usage and alert if it exceeds\
    \ a threshold.\nFollowing is the disk usage script:\n\n```bash\n#!/bin/bash\n\
    # Disk usage monitoring script\nTHRESHOLD=80\nUSAGE=$(df / | grep | awk '{print\
    \ $5}' | sed 's/%//')\nif [ $USAGE -gt $THRESHOLD ]; then\n    echo \"Disk usage\
    \ is above $THRESHOLD% on ($hostname)\" | mail -s \"Disk Usage Alert\" admin@gitforgets.com\n\
    fi\n```\n\nIn the above code snippet,\nVariables: Define the usage threshold.\n\
    Commands: df Check disk usage of the root filesystem; grep Filter the output for\
    \ the root filesystem; awk Extract the usage percentage; sed Remove the percentage\
    \ sign.\n\n### Scenario 4: User Account Management\n\nManaging user accounts can\
    \ be automated. We will create a script to add a new user and set a password.\n"
  mdcn: "\nShell 脚本有很多益处，它可以帮助系统管理员更高效地管理和自动化活动。\n自动化是 shell 脚本的主要优势。它通过自动化重复过程，帮助系统管理员减少人为错误和人工干预。结果是系统管理变得更加一致且高效。Shell\
    \ 脚本还让运行手动执行繁琐的复杂命令序列变得更容易。\n\n## Shell 脚本的优势\n\n-   自动化备份、系统更新和用户管理等例行任务。\n-\
    \   在无需人工干预的情况下顺序执行多个命令，节省时间和精力。\n-   确保任务每次都以相同的方式执行，减少错误概率。\n-   处理涉及多个步骤和依赖关系的复杂任务。\n\
    -   定制脚本以满足特定的管理需求和工作流。\n-   通过在多个服务器上部署脚本，轻松扩展跨系统的操作。\n\n## 自动化脚本用例\n\n### 备份与恢复\n\
    \nShell 脚本可以实现关键数据的备份，降低数据丢失的风险并确保备份的一致性。可以安排脚本按定期间隔运行，创建备份并安全地存储。\n\n参考示例脚本：\n\
    \n```bash\n#!/bin/bash\nBACKUP_DIR=\"backup\"\nSOURCE_DIR=\"data\"\nTIMESTAMP=$(date\
    \ +%F)\nBACKUP_FILE=\"$BACKUP_DIR/backup-$TIMESTAMP.tar.gz\"\ntar -czf $BACKUP_FILE\
    \ $SOURCE_DIR\necho \"Backup created at\\n$BACKUP_FILE\"\n```\n\n此脚本将 `/data`\
    \ 目录的内容压缩成 tar 包，并带有时间戳存储在 `/backup` 目录。\n\n### 系统更新\n\n保持系统和软件更新对于安全和性能至关重要。Shell\
    \ 脚本可以自动化更新过程，确保在没有人工干预的情况下定期应用更新。\n\n以下是示例脚本：\n\n```bash\n#!/bin/bash\napt-get\
    \ update\napt-get upgrade -y\necho \"System updated on\\n$(date)\"\n```\n\n此脚本更新软件包列表并升级所有已安装的包，记录更新时间。\n\
    \n### 用户管理\n\n用户账户的管理可以自动化，以简化添加、修改和删除用户的过程。这在用户流转率高或或需要标准化用户设置的环境中特别有用。\n\n以下是示例脚本：\n\
    \n```bash\n#!/bin/bash\nUSERNAME=$1\nPASSWORD=$2\nif [ \"$USERNAME\" &>/dev/null;\
    \ then\n    echo \"User $USERNAME already exists\"\nelse\n    useradd -m $USERNAME\n\
    \    echo \"$USERNAME:$PASSWORD\" | chpasswd\n    echo \"User $USERNAME created\"\
