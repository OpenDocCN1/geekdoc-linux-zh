    taceroute: Traces the route packets take to reach a network host.

    iftop: Displays bandwidth usage on an interface by host.

    netstat: Displays network connections, routing tables, interface statistics, masquerade
    connections, and multicast memberships.

    vnstat: A network traffic monitor for logging and analyzing network traffic usage.


    In this section, we will learn some of the best Linux commands for tracking network
    performance, including and We then learn how to use these commands to monitor
