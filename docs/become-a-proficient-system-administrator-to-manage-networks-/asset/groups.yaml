    # Custom Kernel Modules


    # Writing a Simple Kernel Module


    Kernel modules extend the functionality of the kernel without the need to reboot
    the system. Given below is how to write a simple “Hello World” kernel module.


    ```

    Create Module Source File:

    // hello.c #include #include static int __init_hello_init(void) {

    printk(KERN_INFO"Hello, World!\n"); return 0; } static void _exit hello_exit(void)
    { printk(KERN_INFO"Goodbye, World!\n"); }

    module_init(hello_init); module_exit(hello_exit);

    MODULE_LICENSE("GPL"); MODULE_AUTHOR("Author Name");

    MODULE_DESCRIPTION("A simple Hello Kernel Module");

    ```


    ```

    Create Makefile:

    # obj-m += hello.o all: make -C /lib/modules/$(shell uname -r)/build M=$(PWD)
    clean: make -C /lib/modules/$(shell uname -r)/build M=$(PWD) clean

    ```


    Compile the Module:

    $ make


    Insert the Module:

    $ sudo insmod hello.ko $ dmesg | tail'
