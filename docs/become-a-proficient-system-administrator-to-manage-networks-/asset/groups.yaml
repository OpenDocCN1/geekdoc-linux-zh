    Type: $NOTIFICATIONTYPE$\nService: $SERVICEDESC$\nHost: $HOSTNAME$\nAddress: $HOSTADDRESS$\nState:
    $SERVICESTATE$\nDate: $LONGDATETIME$\nAdditional Info:\n\n$SERVICEOUTPUT$\n" |
