    \ DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO nagios_user;\n\
    \\q\n```\n\n# Configure Nagios to Use the PostgreSQL Plugin\n\nEdit the Nagios\
    \ configuration to add commands for monitoring PostgreSQL. Open the commands.cfg\
    \ file:\n```\n$ sudo nano /etc/nagios/commands.cfg\n```\n\nAdd the following command\
    \ definition for monitoring PostgreSQL:\n```\ndefine command {\n    command_name\
    \    check_postgresql\n    command_line    /var/lib/nagios/plugins/check_postgresql\
    \ -U nagios_user -h localhost -d alphaproject_db\n    max_check_interval 10\n\
