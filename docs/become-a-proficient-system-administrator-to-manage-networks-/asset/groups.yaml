    \ /etc/prometheus /var/lib/prometheus\nsudo wget https://github.com/prometheus/releases/download/v2.26.0/prometheus-2.26.0.linux-amd64.tar.gz\n\
    sudo tar -xf prometheus-2.26.0.linux-amd64.tar.gz\nsudo cp prometheus-2.26.0.linux-amd64/prometheus\
    \ /usr/local/bin/\nsudo cp prometheus-2.26.0.linux-amd64/promtool /usr/local/bin/\n\
    sudo cp -r prometheus-2.26.0.linux-amd64/consoles /etc/prometheus\nsudo cp -r\
    \ prometheus-2.26.0.linux-amd64/console_libraries /etc/prometheus\nsudo cp prometheus-2.26.0.linux-amd64/prometheus.yml\
    \ /etc/prometheus\nsudo chown -R prometheus:/etc/prometheus /var/lib/prometheus\n\
    sudo nano /etc/systemd/system/prometheus.service\n```\n\nPrometheus 服务文件：\n```ini\n\
    [Unit]\nDescription=Prometheus\nAfter=network-online.target\nAfter=network-online.target\n\
    \n[Service]\nUser=prometheus\nGroup=prometheus\nType=simple\nExecStart=/usr/local/bin/prometheus\
    \ --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path /var/lib/prometheus/\n\
    \n[Install]\nWantedBy=multi-user.target\n```\n\n启动 Prometheus：\n```bash\nsudo\
    \ systemctl daemon-reload\nsudo systemctl start prometheus\nsudo systemctl enable\
    \ prometheus\n```\n\n安装 Grafana：\n```bash\nwget http://dl.grafana.com/oss/release/grafana_7.4.3_amd64.deb\n\
    sudo dpkg -i grafana_7.4.3_amd64.deb\nsudo systemctl start grafana-server\nsudo\
    \ systemctl enable grafana-server\n```\n\n配置 Grafana 使用 Prometheus：\n\n- 登录 Grafana：默认端口为\
    \ 3000 (http://your_server_ip:3000)。\n- 添加数据源：在 Grafana 中，进入 Configuration ->\
    \ Data Sources -> Add data source -> Prometheus。\n- 设置 URL：指向你的 Prometheus 服务器\
    \ (http://localhost:9090)。\n\n### 确保高可用性和冗余\n\n为数据库设置复制以确保可用性和冗余。以 MySQL 为例：\n\
    \n在主服务器上：\n```sql\nCREATE USER 'replicator'@'%'' IDENTIFIED BY 'password';\nGRANT\
    \ REPLICATION SLAVE ON *.* TO 'replicator'@'%';\nFLUSH PRIVILEGES;\n```\n\n在从服务器上：\n\
    ```sql\nCHANGE MASTER TO MASTER_HOST='master_ip',\nMASTER_USER='replicator',\n\
    MASTER_PASSWORD='password',\nMASTER_LOG_FILE='mysql-bin.00001',\nMASTER_LOG_POS=120;\n\
    START SLAVE;\n```\n\n通过测试确保故障转移方法能够处理真实故障。\n\n安装 Keepalived：\n```bash\nsudo apt\
