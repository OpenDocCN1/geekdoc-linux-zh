    # Performing Database Migrations


    The management of data and schema changes throughout time necessitates database
    migrations. Developers can use them to apply updates in stages, make sure everything
    is consistent across environments, and upgrade or transfer databases. Here, we
    will show you how to use a tool that makes database migrations easier, explain
    why they''re necessary, and go over some practical steps to migrate your databases.


    # Why Database Migration?


    Database migrations are crucial for several reasons:


    As applications evolve, the database schema must also adapt to accommodate new
    features, improve performance, or correct design flaws. Migrations enable tracking
    of database changes over time, ensuring that all environments (development, testing,
    production) remain consistent. Migrations provide mechanisms to revert changes
    if necessary, ensuring data integrity and reducing downtime during updates. Migrations
    facilitate collaboration among team members by providing a clear history of database
    changes and allowing multiple developers to work on the same database schema.


    # Installing and Setting up Alembic'
- md: "\nAlembic is a lightweight database migration tool for use with SQLAlchemy,\
    \ the database toolkit ORM for Python. Alembic is designed to work with databases\
    \ supported by SQLAlchemy, including PostgreSQL. It provides a straightforward\
    \ way to manage database schema changes through versioned migration scripts.\n\
    \nLet us now look at getting this Alembic feed into our system:\n\n## Install\
    \ Alembic\n\nFirst, install Alembic using pip:\n\n```\n$ pip install alembic\n\
    ```\n\n## Initialize Alembic\n\nNavigate to your project directory and initialize\
    \ Alembic:\n$ alembic init alembic\nThis command creates an alembic directory\
    \ and a configuration file\n\n## Configure Alembic\n\n```ini\nEdit the alembic.ini\
    \ file to configure the database connection string:\n[alembic]\n# path to migration\
    \ scripts\nscript_location = alembic\n[loggers]\nkeys = root,sqlalchemy,alembic\n\
    [handlers]\nkeys = console\n```\n\n```ini\n[formatters]\nkeys = generic\n[logger_root]\n\
    level = WARN\nhandlers = console\nqualname =\n[logger_sqlalchemy]\nlevel = WARN\n\
    handlers =\nqualname = sqlalchemy.engine\npropagate = 0\n[logger_alembic]\nlevel\
    \ = INFO\nhandlers =\nqualname = alembic\npropagate = 0\n[handler_console]\nclass\
    \ = StreamHandler\nargs = (sys.stderr,)\nlevel = NOTSET\nformatter = generic\n\
    [formatter_generic]\nformat = %(asctime)s %(levelname)s -5s [%(name)s] %(message)s\n\
    sqlalchemy.url = postgresql://alphaproject_user:yourpassword@localhost/alphaproject_db\n\
    ```\n\n## Edit the Environment Script\n\nUpdate the alembic/env.py file to connect\
    \ Alembic with the SQLAlchemy models:\n\n```python\nfrom sqlalchemy import engine_from_config,\
    \ pool\nfrom logging.config import fileConfig\nfrom alembic import context\n#\
    \ Import your SQLAlchemy models\nfrom your_project.models import Base\n# this\
    \ is the Alembic Config object, which provides\n# access to the values within\
    \ the .ini file in use.\nconfig = context.config\n# Interpret the config file\
    \ for Python logging.\n# This line sets up loggers basically.\nfileConfig(config.config_file_name)\n\
    # add your model's MetaData object here\n# for 'autogenerate' support\n```\n\n\
    ```python\ntarget_metadata = Base.metadata\ndef run_migrations_offline():\n  \
    \  \"\"\"Run migrations in 'offline' mode.\"\"\"\n    url = config.get_main_option(\"\
    sqlalchemy.url\")\n    context.configure(url=url, target_metadata=target_metadata,\n\
    \                     literal_binds=True)\n    with context.begin_transaction():\n\
    \        context.run_migrations()\n\ndef run_migrations_online():\n    \"\"\"\
    Run migrations in 'online' mode.\"\"\"\n    connectable = engine_from_config(\n\
    \        config.get_section(config.config_ini_section),\n        prefix=\"sqlalchemy\"\
    ,\n        poolclass=pool.NullPool)\n    with connectable.connect() as connection:\n\
    \        context.configure(connection=connection,\n                          target_metadata=target_metadata)\n\
    \        with context.begin_transaction():\n```\n\n```python\n        context.run_migrations()\n\
    \    if context.is_offline_mode():\n        run_migrations_offline()\n    else:\n\
    \        run_migrations_online()\n```\n\n## Creating and Applying Migrations\n\
    \n### Create a New Migration\n\nGenerate a new migration script:\n$ alembic revision\
    \ --autogenerate -m \"Initial migration\"\n\nThis command creates a new migration\
    \ script in the alembic/versions directory. The script will include the necessary\
    \ changes to apply to the database schema based on the current state of the SQLAlchemy\
    \ models.\n\n### Edit the Migration Script\n\nReview and edit the generated migration\
    \ script if necessary. The script will have upgrade and downgrade functions to\
    \ apply and revert changes.\nFollowing the sample migration script:\n\n```python\n\
    \"\"\"Initial migration\nRevision ID: 1234567890ab\nRevises:\nCreate Date: 2024-05-28\
    \ 12:00:00.000000\n\"\"\"\n\nfrom alembic import op\nimport sqlalchemy as sa\n\
    # revision identifiers, used by Alembic.\n```\n\n```python\nrevision = '1234567890ab'\n\
    down_revision = None\nbranch_labels = None\ndepends_on = None\ndef upgrade():\n\
    \    # ### commands generated by Alembic - please adjust! ###\n    op.create_table('users',\n\
    \        sa.Column('id', sa.Integer(), nullable=False),\n        sa.Column('username',\
    \ sa.String(length=50), nullable=False),\n        sa.Column('password', sa.String(length=255),\
    \ nullable=False),\n        sa.Column('email', sa.String(length=100), nullable=False),\n\
    \        sa.Column('created_at', sa.TIMESTAMP(), server_default=sa.func.now(),\
    \ nullable=True),\n        sa.PrimaryKeyConstraint('id'),\n        sa.UniqueConstraint('email'),\n\
    \        sa.UniqueConstraint('username')\n    )\n    op.create_table('projects',\n\
    \        sa.Column('id', sa.Integer(), nullable=False),\n        sa.Column('name',\
    \ sa.String(length=100), nullable=False),\n        sa.Column('description', sa.Text(),\
    \ nullable=True),\n        sa.Column('start_date', sa.Date(), nullable=True),\n\
    \        sa.Column('end_date', sa.Date(), nullable=True),\n        sa.Column('created_by',\
    \ sa.Integer(), nullable=False),\n        sa.Column('created_at', sa.TIMESTAMP(),\
    \ server_default=sa.func.now(), nullable=True),\n        sa.ForeignKeyConstraint(['created_by'],\
    \ ['users.id']),\n        sa.PrimaryKeyConstraint('id')\n    )\n    # Additional\
    \ tables and constraints...\n    # ### end Alembic commands ###\n```\n\n```python\n\
    def downgrade():\n    # ### commands auto generated by Alembic - please adjust!\
    \ ###\n    op.drop_table('projects')\n    op.drop_table('users')\n    # ### end\
    \ Alembic commands ###\n```\n\n### Apply the Migration\n\nApply the migration\
    \ to the database:\n$ alembic upgrade head\nThis command updates the database\
    \ schema to match the current state of the models.\n\n## Migrating Databases between\
    \ Systems\n\nTo migrate the database to an external system, first, export the\
    \ current database:\n$ pg_dump -U alphaproject_user -h localhost -F c -b -v /path/to/backup/alphaproject.db\
    \ alphaproject_db\nThis command creates a backup file in the custom format. Then,\
    \ transfer the backup file to the external system.\n"
  mdcn: "\n\nAlembic 是一个轻量级的数据库迁移工具，用于 SQLAlchemy（Python 的数据库工具包 ORM）。Alembic 设计用于用于与\
    \ SQLAlchemy 支持的数据库工作，包括 PostgreSQL。它提供了一种简单的方法，通过版本化的迁移脚本来管理数据库模式的更改。\n\n现在让我们来看看如何将这个\
    \ Alembic 引入到我们的系统中：\n\n## 安装 Alembic\n\n首先，使用 pip 安装 Alembic：\n\n```\n$ pip install\
    \ alembic\n```\n\n## 初始化 Alembic\n\n进入你的项目目录并初始化 Alembic：\n$ alembic init alembic\n\
    此命令会创建一个 alembic 目录和一个配置文件\n\n## 配置 Alembic\n\n```ini\n编辑 alembic.ini 文件以配置数据库连接字符串：\n\
    [alembic]\n# 迁移脚本的路径\nscript_location = alembic\n[loggers]\nkeys = root,sqlalchemy,alembic\n\
    [handlers]\nkeys = console\n```\n\n```ini\n[formatters]\nkeys = generic\n[logger_root]\n\
    level = WARN\nhandlers = console\nqualname =\n[logger_sqlalchemy]\nlevel = WARN\n\
    handlers =\nqualname = sqlalchemy.engine\npropagate = 0\n[logger_alembic]\nlevel\
    \ = INFO\nhandlers =\nqualname = alembic\npropagate = 0\n[handler_console]\nclass\
    \ = StreamHandler\nargs = (sys.stderr,)\nlevel = NOTSET\nformatter = generic\n\
    [formatter_generic]\nformat = %(asctime)s %(levelname)s -5s [%(name)s] %(message)s\n\
    sqlalchemy.url = postgresql://alphaproject_user:yourpassword@localhost/alphaproject_db\n\
    ```\n\n## 编辑环境脚本\n\n更新 alembic/env.py 文件以将 Alembic 与 SQLAlchemy 模型连接：\n\n```python\n\
    from sqlalchemy import engine_from_config, pool\nfrom logging.config import fileConfig\n\
    from alembic import context\n# 导入你的 SQLAlchemy 模型\nfrom your_project.models import\
    \ Base\n# 这是 Alembic 配置对象，它提供了\n# 对正在使用的 .ini 文件中值的访问。\nconfig = context.config\n\
    # 为 Python 日志解析配置文件。\n# 这一行基本上设置了日志记录器。\nfileConfig(config.config_file_name)\n\
    # 在此处添加你的模型的 MetaData 对象\n# 以支持 'autogenerate'\n```\n\n```python\ntarget_metadata\
    \ = Base.metadata\ndef run_migrations_offline():\n    \"\"\"在“离线”模式下运行迁移\"\"\"\
    \n    url = config.get_main_option(\"sqlalchemy.url\")\n    context.configure(url=url,\
    \ target_metadata=target_metadata,\n                     literal_binds=True)\n\
    \    with context.begin_transaction():\n        context.run_migrations()\n\ndef\
    \ run_migrations_online():\n    \"\"\"在“在线”模式下运行迁移\"\"\"\n    connectable = engine_from_config(\n\
    \        config.get_section(config.config_ini_section),\n        prefix=\"sqlalchemy\"\
    ,\n        poolclass=pool.NullPool)\n    with connectable.connect() as connection:\n\
    \        context.configure(connection=connection,\n                          target_metadata=target_metadata)\n\
    \        with context.begin_transaction():\n```\n\n```python\n        context.run_migrations()\n\
    \    if context.is_offline_mode():\n        run_migrations_offline()\n    else:\n\
    \        run_migrations_online()\n```\n\n## 创建并应用迁移\n\n### 创建新迁移\n\n生成一个新的迁移脚本：\n\
    $ alembic revision --autogenerate -m \"Initial migration\"\n\n此命令在 alembic/versions\
    \ 目录下创建一个新的迁移脚本。该脚本将根据 SQLAlchemy 模型的现状包含应用到数据库模式的必要更改。\n\n### 编辑迁移脚本\n\n根据需要，检查并编辑生成的迁移脚本。脚本将包含\
    \ upgrade 和 downgrade 函数用于应用和撤销更改。\n参考示例迁移脚本：\n\n```python\n\"\"\"Initial migration\n\
