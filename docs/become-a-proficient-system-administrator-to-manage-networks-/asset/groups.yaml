    Zabbix 和 Nagios 为 AlphaProject 设置通知和告警，并配置触发器。


    ## 在 Nagios 中配置触发器


    Nagios 中的触发器通过返回 critical、warning 或 OK 状态的服务检查定义。这些检查被配置用于监控磁盘空间、CPU 负载、内存使用率等各种参数。


    ## 定义服务检查


    编辑 Nagios 配置文件以定义服务检查。例如，检查磁盘空间：


    ```

    $ sudo nano /usr/local/nagios/etc/objects/alphaproject.cfg

    添加以下服务定义：

    ```

    define service { use generic-service host_name alphaproject_server

    service_description Disk Space check_command check_disk!20%%!10%%/ }

    ```


    check_command：指定要运行的命令，在这种情况下，告警和严重阈值分别为 20% 和 10%。


    ## 定义通知选项


    定义谁接收通知以及如何接收。这可以在 contacts 文件中设置：

    $ sudo nano /usr/local/nagios/etc/objects/contacts.cfg

    添加联系人定义：


    ```

    define contact { contact_name admin alias Admin admin@gitforge.com service_notification_period
    24x7 service_notification_options w,u,c,r service_notification_commands notify-by-email
    }

    ```


    ## 配置通知命令


    编辑命令配置文件定义如何发送通知：

    $ sudo nano /usr/local/nagios/etc/objects/commands.cfg

    添加通知命令：

    ```

    define command { command_name-notify-by-email

    command_line = /usr/bin/printf "%b" ***** ***** ***** Nagios*****\nNotification
    Type: $NOTIFICATIONTYPE$\nService: $SERVICEDESC$\nHost: $HOSTNAME$\nAddress: $HOSTADDRESS$\nState:
    $SERVICESTATE$\nDate: $LONGDATETIME$\nAdditional Info:\n\n$SERVICEOUTPUT$\n" |
    /usr/bin -s "Nagios Service Alert: $HOSTNAME/$SERVICEDESC is $SERVICESTATE $CONTACTEMAIL$"
    }

    ```


    ## 重启 Nagios


    通过重启 Nagios 应用配置更改：

    $ systemctl restart nagios


