    # Monitoring CPU and Memory Usage


    # Overview


    Monitoring CPU and memory usage is vital for system administrators to ensure the
    smooth operation of Linux systems. It involves tracking how system resources are
    utilized and identifying potential performance bottlenecks. Following are the
    key Infrastructure Resources monitored by Sysadmins:


    CPU Usage: The percentage of the CPU being used by processes. High CPU usage can
    indicate heavy workloads or inefficient processes. Memory Usage: The amount of
    RAM being used by the system. Monitoring memory helps prevent issues like swapping,
    which can degrade performance.

    Disk I/: The rate at which data is read from or written to disk. High disk I/O
    can be a bottleneck, especially for applications requiring fast data access.

    Network Usage: The amount of data being transmitted and received over network
    interfaces. Monitoring network traffic helps identify bandwidth issues and potential
    bottlenecks.'
