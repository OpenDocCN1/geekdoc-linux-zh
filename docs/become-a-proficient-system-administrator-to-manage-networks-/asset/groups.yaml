    $ top

    ```


    Observe processes consuming the most CPU and memory, and identify any bottlenecks.
    Run htop for an interactive view:


    ```bash

    $ htop

    ```


    Use htop to navigate and manage processes, providing a clear picture of resource
    usage. Run mpstat for detailed usage:


    ```bash

    $ mpstat -P ALL 5 5

    ```


    Analyze the output to understand CPU utilization across all processors. These
    commands and tools allow system administrators to keep an eye on memory and CPU
    utilization, which helps keep projects running smoothly. In order to manage system
    resources proactively, it is necessary to conduct continuous monitoring to detect
    problems early.


    ## Disk Space Monitoring and Management


    Effective disk space monitoring and management are critical for maintaining system
    performance and avoiding issues related to insufficient storage. Following are
    the key commands for Disk Space Monitoring and Management:


    - df: Displays the amount of disk space used and available on file systems.

    - du: Estimates file usage.

    - lsblk: Lists information about block devices.

    - ncdu: A disk usage analyzer with an ncurses interface (useful for a more interactive
    experience).


    In this section, we will learn Linux commands like df and du that are essential
    for disk space monitoring and management and also learn to use these commands
    to perform various tasks.


    ### Using ‘df’ to Monitor Disk Space


    df is a straightforward command that provides a summary of disk space usage across
    all mounted file systems. Run df (-h: Provides human-readable format, e.g., in
    GB, MB).


    ```bash

    $ df -h

    ```


    Following is the desired output:


    ```

    Filesystem      Size  Avail Use% Mounted on

    udev            1.9G      1.9G   0% /dev

    tmpfs           394M  393M   1% /run

    sda1            50G       20G  43% /

    tmpfs           2.0G      25M   2% /dev/shm

    tmpfs           5.0M      5.0M   0% /run/lock

    tmpfs           394M     44K   1% /run/user/1000

    ```


    Analyze df Output:

    - Filesystem: The name of each file system.

    - Size: Total size of the file system.

    - Used: Space used on the file system.

    - Avail: Available space on the file system.

    - Use%: Percentage of used space.

    - Mounted on: The directory where the file system is mounted.


    ### Using ''du'' to Estimate File Space Usage


    du is used to check the space usage of directories and files. Run du Command to
    get a summary of disk usage in the current directory:


    - -s: Provides a summary for each argument.

    - -h: Provides human-readable format.


    ```bash

    $ du -sh *

    ```


    Following is the desired output:

    ```

    20M logs 3.1G var 1.2G home 5.5M etc

    ```


