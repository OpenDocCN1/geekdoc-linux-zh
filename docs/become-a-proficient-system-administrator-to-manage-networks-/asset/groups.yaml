    ## Managing Packages with ‘apt’


    Package management is essential for installing, updating, and removing software.
    In Debian-based systems, apt is used, while Red Hat-based systems use yum.


    ### Update Package Lists:


    ```

    $ sudo apt update

    $ sudo yum check-update

    ```


    ### Install Packages:


    ```

    $ sudo apt install apache2

    $ sudo yum install httpd

    ```


    ### Upgrade Packages:


    ```

    $ sudo apt upgrade

    $ sudo yum update

    ```


    ### Remove Packages:


    ```

    $ sudo apt remove apache2

    $ sudo yum remove httpd

    ```


    ## Using ‘systemd’ for Service Management


    Systemd is a system and service manager for Linux, responsible for initializing
    the system, managing system services, and handling system resources.


    ### Start a Service:


    ```

    $ sudo systemctl start apache2

    ```


    ### Stop a Service:


    ```

    $ sudo systemctl stop apache2

    ```


    ### Enable a Service:


    ```

    $ sudo systemctl enable apache2

    ```


    ### Disable a Service:


    ```

    $ sudo systemctl disable apache2

    ```


    ### Check Service Status:


    ```

    $ sudo systemctl status apache2

    ```


    ## Scheduling Tasks with ‘crontab’


    Cron jobs are used to schedule repetitive tasks. The crontab command allows you
    to manage cron jobs.


    ### Edit Crontab:


    ```

    $ crontab -e

    ```


    Add a cron job to run a script every day at midnight

    0 0 * * /projects/AlphaProject/script.sh


    ### List Crontab:


    ```

    $ crontab -l

    ```


    ## # Automating Tasks with ‘at’ and ‘batch’


    The at and batch commands are used for one-time task scheduling.


    ### Schedule a Task with:


    ```

    $ echo "/projects/AlphaProject/script.sh" | at 02:00

    ```


    ### View Scheduled at Jobs:


    ```

    $ atq

    ```


    ### Remove Scheduled at Job:


    ```

    $ atrm job_number

    ```


    ### Schedule a Batch Job:


    ```

    $ echo "/projects/AlphaProject/script.sh" | batch

    ```


    ## # Managing User Profiles and Permissions


    Managing user profiles and permissions ensures secure access control.


    ### Create a User:


    ```

    $ sudo useradd -m -s /bin/bash user1

    $ sudo passwd user1

    ```


    ### Add User to Group:


    ```

    $ sudo usermod -aG sudo user1

    ```


    ### Modify User Profile:


    ```

    $ sudo usermod -d /home/newdir user1

    ```


    ### Set File Permissions:


    ```

    $ chmod 755 /projects/AlphaProject/file.txt

    ```


    ### Change File Ownership:


    ```

    $ chown user1:developers /projects/AlphaProject/file.txt

    ```


    ### Implementing ACLs (Access Control Lists)


    ACLs provide more granular control over file permissions.


    ### Set ACL for a User:


    ```

    $ sudo setfacl -m u:user1:rwx /projects/AlphaProject/file.txt

    ```


    ### View ACLs:


    ```

    $ getfacl /projects/AlphaProject/file.txt

    ```


    ## # Working with Pluggable Authentication Modules (PAM)


    PAM allows you to manage authentication and security policies.


    ### Configure PAM for SSH


    Edit:


    ```

    auth required pam_google_authenticator.so

    ```


    ### Set Password Quality


    Edit:


    ```

    password requisite pam_pwquality.so retry=3 minlen=12 dcredit=-1 ucredit=-1 ocredit=-1
    lcredit=-1

    ```


    By getting yourself well acquainted and practiced around these essentials, you
    will be sufficiently comfortable to dive into the advanced topics aimed to teach
