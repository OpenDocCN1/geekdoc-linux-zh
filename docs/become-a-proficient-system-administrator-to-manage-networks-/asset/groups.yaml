    # Up and Running with Kubernetes


    # Kubernetes Overview


    Kubernetes, often referred to as K8s, is an open-source platform designed to automate
    the deployment, scaling, and management of containerized applications. Developed
    by Google, Kubernetes revolutionized the way applications are deployed and managed,
    providing a robust framework for running distributed systems resilently.


    # Key Features of Kubernetes:


    +   Kubernetes can manage your deployment to ensure that your application is always
    running the latest version.

    - Restarts containers that fail, replaces and reschedules them when nodes die,
    kills containers that don''t respond to user-defined health checks, and doesn''t
    advertise them to clients until they are ready to serve.


    Scale your application up and down with a simple command, with a UI, or automatically
    based on CPU usage.


    No need to modify your application to use an unfamiliar service discovery mechanism.


    Automatically mount the storage system of your choice, whether from local storage,
    a public cloud provider, or a network storage system.'
- md: "\n# Installing and Configuring Kubernetes\n\nTo set up Kubernetes on your existing\
    \ development environment, follow these steps:\n\n## Installing Docker\n\nKubernetes\
    \ uses Docker as its container runtime.\n\n```bash\n$ sudo apt update\n$ sudo\
    \ apt install -y apt-transport-https ca-certificates curl software-properties-common\n\
    curl -fsSL https://download.repository.com/linux/ubuntu/gpg | sudo apt-key add\
    \ -\n$ sudo apt-add-repository \"deb [arch=amd64] https://download.docker.com/linux/ubuntu\
    \ $(lsb_release -cs) stable\"\n$ sudo apt update\n$ sudo apt install -y docker-ce\n\
    $ sudo systemctl enable docker\n$ sudo systemctl start docker\n```\n\n## Installing\
    \ kubectl\n\nkube helps you set up a Kubernetes cluster, kubelet runs on all the\
    \ machines in your cluster and does things like starting pods and containers,\
    \ and kubectl is the command-line tool to interact with your cluster.\n\n```bash\n\
    $ sudo apt update\n$ sudo apt install -y apt-transport-https curl\n$ curl -s https://packages.cloud.google.com/apt/doc/apt-key.gpg\
    \ | sudo apt-key add -\n$ sudo apt-add-repository \"deb http://apt.kubernetes.io/kubernetes-xenial\
    \ main\"\n$ sudo apt update\n$ sudo apt install -y kubeadm kubectl\n$ sudo apt-mark\
    \ hold kubelet kubeadm kubectl\n```\n\n## Initializing Master Node\n\nRun the\
    \ following command on the master node to initialize the Kubernetes cluster:\n\
    \n```bash\n$ sudo kubeadm init --pod-network-cidr=192.168.0.0/0\n```\n\nAfter\
    \ running this command, you will see a kubeadm join command in the output. Save\
    \ this command as it will be used to join worker nodes to the cluster.\n\n## Setting\
    \ up kubectl for Master Node\n\nTo start using your cluster, you need to set up\
    \ the kubectl configuration:\n\n```bash\n$ mkdir -p $HOME/.kube\n$ sudo cp -i\
    \ /etc/kubernetes/admin.conf $HOME/.kube/config\n$ sudo chown $(id -u):$(id -g)\
    \ $HOME/.kube/config\n$HOME/.kube/config\n```\n\n## Installing Pod Network Add-on\n\
    \nA pod network allows communication between the nodes in the cluster. For this,\
    \ we will use Calico:\n\n```bash\n$ kubectl apply -f https://docs.projectcalico.org/manifests/calico.yaml\n\
    ```\n\n## Joining Worker Nodes\n\nRun the kubeadm join command you saved earlier\
    \ on each worker node to join them to the cluster:\n\n```bash\n$ sudo kubeadm\
    \ join <IP>:6443 --token --discovery-token-ca-cert-hash sha256:<HASH>\n```\n\n\
    ## Verifying Cluster\n\nCheck the status of your nodes:\n\n```bash\n$ kubectl\
    \ get nodes\n```\n\nYou should see the master and worker nodes listed with a Ready\
    \ status.\n\n## Deploying an Application\n\nNow, we shall deploy a simple Nginx\
    \ application to verify the setup.\n\nCreating a Deployment:\n```bash\n$ kubectl\
    \ create deployment nginx --image=nginx\n```\n\nExposing the Deployment:\n```bash\n\
    $ kubectl expose deployment nginx --port=80 --type=NodePort\n```\n\nChecking the\
    \ Deployment:\n```bash\n$ kubectl get pods\n$ kubectl get svc\n```\n\nAccess the\
    \ Nginx application using the NodePort value displayed in the service details.\n\
    \n## Scaling the Application\n\nTo demonstrate Kubernetes’ scaling capabilities,\
    \ scale the Nginx deployment:\n\n```bash\n$ kubectl scale deployment nginx --replicas=3\n\
    $ kubectl get pods\n```\n\nYou may observe that Kubernetes has launched extra\
    \ Nginx pods. Once the cluster is configured, it becomes easy to deploy, expose,\
    \ and grow applications. This highlights the flexibility and power of Kubernetes\
    \ in managing distributed systems on a wide scale.\n\n## Setting up and Managing\
    \ Clusters\n\n## Exploring Clusters\n\nA cluster is a collection of computers\
    \ that share resources and operate as an integrated whole. In order to guarantee\
    \ high availability, redundancy, and improved performance, clusters are utilized.\
    \ One or more worker nodes and one or more master nodes make up a cluster in Kubernetes.\
    \ Workers take care of workloads, while the master node oversees all of the worker\
    \ nodes and the containers (pods) that operate on them.\n\nComponents of a Kubernetes\
    \ Cluster:\n\n- Master Node: The control plane that manages the cluster.\n   \
    \ - kube-apiserver: Exposes the Kubernetes API.\n    - etcd: A distributed key-value\
    \ store used for configuration data.\n    - kube-scheduler: Schedules the pods\
    \ on the worker nodes.\n    - kube-controller-manager: Runs controller processes\
    \ to regulate the state of the cluster.\n    - cloud-controller-manager: Manages\
    \ cloud-specific controller logic.\n- Worker Nodes: Execute the containers.\n\
    \    - kubelet: Ensures that containers are running in a pod.\n    - kube-proxy:\
    \ Maintains network rules for pod communication.\n- Container Runtime: Runs the\
    \ containers (e.g., Docker).\n\n## Sample Program: Setting up and Managing Clusters\n\
    \n## Preparing the Infrastructure\n\nEnsure you have multiple machines (virtual\
    \ or physical) ready to be part of the cluster. For this example, we shall assume\
    \ you have three machines: one master and two worker nodes. And, ensure the following:\n\
    \n- All nodes should be running Ubuntu 18.04 or later.\n- Each node should have\
    \ a static IP address.\n- Ensure that the machines can communicate with each other\
    \ over the network.\n\n## Installing Docker\n\nInstall Docker on all nodes (master\
    \ and worker nodes):\n\n```bash\n$ sudo apt update\n$ sudo apt install -y apt-transport-https\
    \ ca-certificates curl software-properties-common\ncurl -fsSL https://download.docker.com/linux/ubuntu/gpg\
    \ | sudo apt-key add -\n$ sudo add-apt-repository \"deb [arch=amd64] https://download.docker.com/linux/ubuntu\
    \ $(lsb_release -cs) stable\"\n$ sudo apt update\n$ sudo apt install -y docker-ce\n\
    $ sudo systemctl enable docker\n$ sudo systemctl start docker\n```\n"
