    # Exploring Wireshark


    Wireshark is an advanced network protocol analyzer that captures and displays
    data packets for in-depth assessment. It has a graphical user interface that makes
    it easy to understand network data and supports multiple protocols. A network
    packet analyzer is like a voltmeter for electrical cables; it measures current
    and voltage but at a higher level, allowing it to see what''s going on inside
    a network cable.


    These tools were either highly exclusive or prohibitively costly in earlier days.
    But that was before the release of Wireshark. Being both free and open source,
    Wireshark has quickly become one of the most popular and effective packet analyzers
    on the market.'
