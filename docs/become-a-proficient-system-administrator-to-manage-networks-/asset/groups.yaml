    ## 监控 CPU 和内存使用的的工具


    `vmstat` 是一个多功能工具，可提供系统性能的快照，包括 CPU 和内存使用情况。它提供了各种系统指标的实时视图，对于识别性能问题非常有帮助。`top`
    和 `htop` 是交互式工具，可显示实时系统信息。它们提供了进程、CPU、内存使用等的详细视图。`mpstat` 是另一个提供 CPU 使用率统计的工具，对于监控多处理器系统非常有用处。


    ### 使用 ‘vmstat’ 监控 CPU 和内存使用


    确保你的系统中已安装了 `vmstat`：


    ```bash

    $ sudo apt update && sudo apt install sysstat

    ```


