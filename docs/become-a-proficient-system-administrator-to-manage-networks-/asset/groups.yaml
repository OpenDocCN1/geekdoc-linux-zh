    $ sudo nano /usr/local/nagios/etc/objects/commands.cfg

    Add the following command definition to monitor log files:

    def command { command_name check_log command_line

    /usr/local/nagios/libexec/check_logfiles -f /path/to/logfile -p/pattern/to/match
    }

    ```


    Edit the Nagios service file to define a service that uses the check_log command.

