    Add a simple rule to detect ICMP ping requests:

    alert icmp any any -> $HOME_NET any (msg:"ICMP Ping detected"; sid:1000001; rev:1);


    # Test Snort Configuration


    Test the Snort configuration to ensure there are no syntax errors:

    $ sudo sniff -T -c /etc/snort/snort.conf


    # Run Snort in NIDS Mode


    Start Snort in network intrusion detection mode:

    $ sudo sniff -A console -c /etc/snort/snort.conf -i eth0

    Snort will start monitoring network traffic and display alerts on the console
    for any packets that match the defined rules.


