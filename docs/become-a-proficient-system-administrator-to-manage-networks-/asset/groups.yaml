    ```


    Assign Users to the Role

    GRANT read_only TO some_user;


    # Network Security


    # Configuring Firewall


    Use iptables or ufw to restrict access to the PostgreSQL server. To limit PostgreSQL
    to accept connections only from the localhost:

    $ sudo ufw allow from 127.0.0.1 to any port 5432


    # Encryption


    Encrypt traffic between the PostgreSQL server and clients to protect data in transit.
    Generate a self-signed SSL certificate and key:

    $ sudo openssl req -new -x509 -days 365 -nodes -out /etc/ssl/certs/postgresql.crt
    -keyout /etc/ssl/private/postgresql.key

    $ sudo chmod 600 /etc/ssl/private/postgresql.key


    ```

    Configure PostgreSQL to Use SSL by editing the postgresql.conf file to enable
    SSL:

    $ sudo nano /etc/postgresql/12/main/postgresql.conf

    Ensure the following settings are configured:

    ssl = on

    ssl_cert_file = ''/etc/ssl/certs/postgresql.crt''

    ssl_key_file = ''/etc/ssl/private/postgresql.key''

    ```'
