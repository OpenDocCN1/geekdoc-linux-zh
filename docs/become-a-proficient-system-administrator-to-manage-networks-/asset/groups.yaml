    ## Using ‘top’ and ‘htop’ for System Monitoring


    System administrators monitor various aspects of a system to ensure its smooth
    operation and to prevent potential issues. Key aspects include CPU usage, memory
    usage, disk I/O, network activity, and process management. Monitoring these parameters
    helps in identifying performance bottlenecks, diagnosing issues, and optimizing
    system resources.


    Following are the key aspects monitored by Sysadmins:


    - CPU Usage: Tracks the percentage of CPU being used by processes.

    - Memory Usage: Monitors the amount of RAM used, available, and the swap space
    utilization.

    - Disk I/O: Observes the rate of data being read from and written to disk.

    - Network Activity: Measures data transmission and reception rates over network
    interfaces.

    - Process Management: Lists active processes, their resource usage, and status.


    ### Using ‘top’ for System Monitoring


    top is a powerful command-line tool that provides a real-time view of system performance,
    displaying various metrics related to CPU, memory, and processes.


    ### Run top Command


    ```

    $ top

    ```


    top - 10:34:18 10 days, 23:17, 1 user, load average: 0.05, 0.11, 0.09

    Tasks: 125 total, 1 running, 124 sleeping, 0 stopped, 0 zombie %Cpu(s):

    1.0 us, 0.5 sy, 0. ni, 98.0 id, 0.5 wa, 0.0 hi, 0.0 si, 0.0 KiB Mem :

    2048576 total, 498072 free, 745392 used, 805112 buff/cache KiB Swap:

    2097148 total, 2097148 free, 0 used. 1105161 avail Mem PID PR

    NI VIRT RES SHR S %CPU %MEM TIME+ COMMAND 897 root 20 0

    162708 2624 S 0.7 0.1 0:00:32 bash 1243 postgres 20 0

    26476

    11236 9056 S 0.3 0.5 0.0205 postgres


    In the above output,

    CPU Usage: %Cpu(s) section shows the percentage of CPU time in various states:


    - us (user): Time spent on user processes.

    - sy (system): Time spent on system processes.

    - id (idle): When CPU is idle.

    - wa (iowait): Time spent waiting for I/O operations.


    Memory Usage: KiB Mem section shows total, free, used, and buffer/cache memory.


    Swap Usage: KiB Swap section shows total, free, and used swap memory.


    Processes: Lists processes with columns PID, user, priority, nice value, virtual
    memory, resident memory, shared memory, state, CPU usage, memory usage, and command.


    To interact with top:


    - Press q to quit.

    - Press h for help.

    - Press M to sort processes by memory usage.

    - Press P to sort processes by CPU usage.


    ### Using ‘htop’ for Enhanced System Monitoring


    htop is an interactive process viewer with a more user-friendly interface compared
    to top. It provides a color-coded display of system metrics and allows for easier
    navigation and process management.


    ### Install htop

    $ sudo apt-get install htop


    ### Run htop command

    $ htop


    Following is the desired output:


    ```

    1 [ 1.6%] 1 running 2 [ 0.0%] Load average: 0.05 0.11

    0.09 Mem[||||||||745M/2.0G] Uptime: 10 days, 23:17 Swp [0K/2.0G]

    PID USER PRI NI VI RES SHR S CPU% MEM% TIME+ Command

    897 root 20 0 162M 2.5M S 0.7 0.1 0:00.32 bash 1243 postgres 20 0

    262M 11.2M 9.0M S 0.3 0.5 0:02.05 postgres

    ```


    In the above htop output,

    CPU Bars: Display the usage of each CPU core.

    Memory and Swap Bars: Show the current usage of RAM and swap.

    Load Average: Shows system load averages for the past 1, 5, and 15 minutes.

    Uptime: Indicates how long the system has been running.

    Processes: Lists processes with additional details such as CPU% and MEM% usage.


    - To interact with htop,

    - Press F6 to sort columns.

    - Press F5 to toggle tree view.

    - Press F9 to kill a process.

    - Press F10 to quit.


    ## Sample Program: Implement System Monitoring


    ## Example 1: Monitoring CPU and Memory Usage with ‘top’


    Run top to monitor the overall CPU and memory usage of AlphaProject:

    $ top

    Observe the %Cpu(s) and KiB Mem sections to ensure that the CPU and memory are
    not being overutilized. For instance, if the us or sy values are consistently
    high, it might indicate that the system is under heavy load.


    ## Example 2: Identifying High Resource Usage with Htop


    To get a more interactive view of resource usage:

    $ htop

    Use the arrow keys to scroll through the list of processes and identify any processes
    that are consuming an unusually high amount of CPU or memory. For example, if
    you notice a process using a high percentage of memory, you can further assess
    that process to determine if it is behaving as expected.


    ## Example 3: Managing Processes with ‘top’


    If you identify a process that is consuming too many resources and you need to
    stop it, you can use top to kill the process:


    - Press k within the top interface.

    - Enter the PID of the process you want to kill.

    - Confirm by pressing Enter


    ## Example 4: Managing Processes with htop


    Similarly, in htop you can kill a process more interactively:


    - Press F9 to kill the process.

    - Select the signal to send (e.g., SIGKILL) and press Enter.


    ## Example 5: Monitoring Specific Resources


    To monitor the CPU usage specifically:

    $ top -o %CPU

    To monitor the memory usage specifically:

    $ top -o %MEM


    In htop press F6 and select %CPU or %MEM to sort processes accordingly.


    By using top, system administrators can effectively monitor and manage the performance
    of the system running AlphaProject. These tools provide real-time insights into
    CPU and memory usage, allowing for proactive management of system resources and
    quick identification of potential performance issues.


    ## Monitoring with Nagios and Zabbix


    ### Introduction to Zabbix


    Zabbix is an enterprise-level monitoring platform designed to monitor and track
    the performance and availability of network servers, devices, and other IT resources.
    It provides real-time monitoring, data collection, and analysis capabilities.
    Unlike Nagios, which primarily uses plugins for monitoring, Zabbix offers a more
    integrated solution with a web-based interface, built-in visualization tools,
    and advanced features such as automatic discovery and distributed monitoring.


    ### Nagios with Zabbix


    While Nagios excels in its simplicity and flexibility with plugins, Zabbix offers
    a comprehensive, integrated monitoring solution. Using both together can leverage
    the strengths of each:


    - Nagios: Best for quick setup and extensive use of plugins.

    - Zabbix: Ideal for detailed performance analysis, real-time data visualization,
    and advanced features like trend prediction.


    ## Installing and Configuring Zabbix


    ### Install Zabbix Server and Frontend


    Update your package lists and install the Zabbix repository:


    ```

    $ sudo apt update

    $ sudo apt install wget

    $ sudo wget https://repo.zabbix.com/zabbix/6.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_6.0-1+ubuntu20.04_all.deb

    $ sudo dpkg -i zabbix-release_6.0-1+ubuntu20.04_all.deb

    $ sudo apt update

    ```


    Install the Zabbix server, frontend, and agent:

    $ sudo apt install zabbix-server-mysql zabbix-frontend-php zabbix-apache-conf
    zabbix-agent


    ### Configure the Zabbix Database


    Create the initial database and user:

    $ sudo mysql -uroot -p

    mysql> create database zabbix character set utf8mb4 coll utf8mb4_bin;

    mysql> create user zabbix@localhost identified by ''yourpassword'';

    mysql> grant all privileges on zabbix.* to zabbix@localhost;

    mysql> quit;


    Import the initial schema and data:

    $ sudo zcat /usr/share/doc/zabbix-server-mysql*/create.sql.gz | mysql -uzabbix
    -p


    ### Configure the Zabbix Server


    Edit the Zabbix server configuration file:

    $ sudo nano /etc/zabbix/zabbix_server.conf

    Set the database connection parameters:

    DBName=zabbix DBUser=zabbix DBPassword=yourpassword


    ### Configure PHP for Zabbix Frontend


    Edit the PHP configuration for Zabbix:

    $ sudo nano /etc/zabbix/apache.conf


    Adjust the timezone setting:

    php_value date.timezone Europe/London

    Restart the Apache server:

    $ sudo systemctl restart apache2

    Start the Zabbix server and agent processes:


    ```

    $ sudo systemctl restart zabbix-server zabbix-agent

    $ sudo systemctl enable zabbix-server zabbix-agent

    ```

