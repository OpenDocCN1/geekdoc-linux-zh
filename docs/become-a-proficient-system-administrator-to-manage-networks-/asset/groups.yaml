    # Set Network Variables


    In the configuration file, set the network variables for your environment. For
    AlphaProject, define the HOME_NET and EXTERNAL_NET variables:


    ```

    var HOME_NET 192.168.1.0/24

    var EXTERNAL_NET any

    ```


    # Configure Preprocessors


    Snort preprocessors enhance its detection capabilities. Ensure the following preprocessors
    are enabled in the configuration file:

    processor stream5_global: track_tcp yes, track_udp yes

    processor stream5_tcp: policy linux, timeout 30, min_ttl 10, max_tcp 8192, require_3whs
    180, overlap_limit 10, small_segments 3 bytes 150

    processor stream5_udp: timeout 30

    processor stream5_icmp: timeout 30

    processor http_inspect: global iis_unicode_map unicode.map 1252

    processor http_inspect_server: server default profile all ports { 80 8080 }


    # Include Snort Rules


    Snort rules are located in the /etc/snort/rules/ directory. Ensure the rules are
    included in the configuration file:

    include $RULE_PATH/local.rules

    include $RULE_PATH/community.rules'
