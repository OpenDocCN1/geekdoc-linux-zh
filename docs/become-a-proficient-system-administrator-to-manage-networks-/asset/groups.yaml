    ## Sample Program: Firewall Configuration for AlphaProject


    We shall implement a comprehensive firewall configuration for AlphaProject, covering
    both iptables and firewalld.


    + Allow SSH, HTTP, and HTTPS Traffic

    $ sudo iptables -A INPUT -p tcp --dport 22 -j ACCEPT

    $sudo iptables -A INPUT -p tcp --dport 80 -j ACCEPT

    $sudo iptables -A INPUT -p tcp --dport 443 -j ACCEPT


    + Allow Established and Related Connections

    $sudo iptables -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT


    + Allow Loopback Traffic

    $sudo iptables -A INPUT -i lo -j ACCEPT


    + Log and Drop Incoming Traffic

    $sudo iptables -A INPUT -j LOG --log-prefix "iptables-dropped: "

    $sudo iptables -A INPUT -j DROP


    By default, iptables allows all outgoing traffic. Ensure this with:

    $sudo iptables -P OUTPUT ACCEPT


    + Save the Configuration

    $sudo iptables-save > /etc/iptables/rules.v4


    ### Start and Enable firewalld


    $sudo systemctl start firewalld

    $sudo systemctl enable firewalld


    Set the default zone to

    $sudo firewall-cmd --set-default-zone=public


    Assign Interface to Public Zone

    $sudo firewall-cmd --zone=public --change-interface=eth0 --permanent


    ### Allow SSH, HTTP, and HTTPS Services

    $sudo firewall-cmd --zone=public --add-service=ssh --permanent

    $sudo firewall-cmd --zone=public --add-service=http --permanent

    $sudo firewall-cmd --zone=public --add-service=https --permanent


    Add a rule to allow established and related connections:

    $sudo firewall-cmd --zone=public --add-rich-rule=''rule family="ipv4" service
    name="ssh" accept'' --permanent

    $sudo firewall-cmd --zone=public --add-rich-rule=''rule family="ipv4" service
    name="http" accept'' --permanent

    $sudo firewall-cmd --zone=public --add-rich-rule=''rule family="ipv4" service
    name="https" accept'' --permanent


    Add a rule to log and drop other incoming traffic:

    $sudo firewall-cmd --zone=public --add-rich-rule=''rule family="ipv4" log prefix="firewalld-dropped:
    " level="info" drop'' --permanent


    By default, firewalld allows all outgoing traffic. Verify this configuration:

    $sudo firewall-cmd --zone=public --list-all


    Reload the firewall rules to apply the changes:

    $sudo firewall-cmd --reload


    List the rules in the public zone to verify the configuration:

    $sudo firewall-cmd --zone=public --list-all


