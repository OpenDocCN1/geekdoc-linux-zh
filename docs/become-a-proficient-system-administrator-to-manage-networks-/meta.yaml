  md: 'Forward and Reverse Reaction Rates of Formation of ICl


    At 2300°C in a 1.00 L flask initially containing 1.00 mol ICl, the system reaches
    equilibrium with 0.830 mol ICl. Calculate the equilibrium constant.


    +   - 2ICl(g) ⇌ I₂(g) + Cl₂(g)

    - Keq = 0.0110 at 2300°C


    Write the expression for the equilibrium constant Kc for the forward reaction
    and the reverse reaction at 2300°C.


    # Kc = [I₂][Cl₂] / [ICl]²


    # K''c = [ICl]² / ([I₂][Cl₂])


    Solve for the equilibrium constant using the ICE table:


    ICl initial = 1.00 mol, ICl equilibrium = 0.830 mol

    Change in ICl = 1.00 - 0.830 = 0.170 mol

    Moles of I₂ formed = 0.170 / 2 = 0.0850 mol

    Moles of Cl₂ formed = 0.0850 mol


    |   | ICl | I₂ | Cl₂ |

    |---|-----|-----|------|

    | Initial (mol/L) | 1.00 | 0 | 0 |

    | Change (mol/L) | -0.170 | +0.0850 | +0.0850 |

    | Equilibrium (mol/L) | 0.830 | 0.0850 | 0.0850 |


    Calculate the equilibrium constant:


    Kc = (0.0850)(0.0850) / (0.830)²


    Kc = 0.007225 / 0.6889


    Kc ≈ 0.0105 ≈ 0.0110


    Kc for reverse = 1/Kc (forward) = 1/0.0110 ≈ 90.9'
  merge: -1
