  md: '# Set Network Variables


    In the configuration file, set the network variables for your environment. For
    AlphaProject, define the HOME_NET and EXTERNAL_NET variables:


    ```

    var HOME_NET 192.168.1.0/24

    var EXTERNAL_NET any

    ```


    # Configure Preprocessors


    Snort preprocessors enhance its detection capabilities. Ensure the following preprocessors
    are enabled in the configuration file:


    ```

    preprocessor stream5_global: track_tcp yes, track_udp yes

    preprocessor stream5_tcp: policy linux, timeout 30, min_ttl 10, max_tcp 8192,
    require_3whs 180, overlap_limit 10, small_segments 3 bytes 150

    preprocessor stream5_udp: timeout 30

    preprocessor stream5_icmp: timeout 30

