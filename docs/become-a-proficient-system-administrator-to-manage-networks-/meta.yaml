  md: '# Verifying Load Balancer Configuration


    To ensure the load balancer is working correctly, access the HAProxy statistics
    page or use curl to simulate traffic.


    ```

    $ for i in {1..10}; do curl -I http://; done

    ```


    Observe the distribution of requests across the back-end servers.


    # Advanced Load Balancing


    # Using Least Connections Algorithm


    Modify the backend section in the HAProxy configuration to use the least connections
    algorithm:


    ```

    backend http_back balance leastconn server web1 192.168.1.101:80 check server
    web2 192.168.1.102:80 check

    ```


    # Load Balancing with SSL Termination


    To handle SSL termination at the load balancer, update the HAProxy configuration:


    ```

    frontend https_front bind *:443 ssl crt /etc/haproxy/certs/site.pem default_backend
    http_back backend http_back balance roundrobin server web1 192.168.1.101:80 check
    server web2 192.168.1.102:80 check

    ```


    # Generate SSL Certificates


    Use Let''s Encrypt or OpenSSL to generate SSL certificates. Following is the example
    with Let''s Encrypt:'
  merge: -1
  pgno: 323
- img_proc: false
  md: '```

    $ sudo apt-get install certbot $ sudo certbot certonly --standalone -d yourdomain.com

    ```


    Update the bind directive in HAProxy to point to the generated certificates.


    # Health Checks and Failover


    HAProxy performs health checks to ensure back-end servers are available. If a
    server fails the health check, it is automatically removed from the pool.


    Following is the sample health check configuration:


    ```

    backend http_back balance roundrobin server web1 192.168.1.101:80 check fall 3
    rise 2 server web2 192.168.1.102:80 check fall 3 rise 2

    ```


    In the above code snippet,


    +   - check: Enables health checks.

    - fall 3: Server is considered down after 3 consecutive failed health checks.

    - rise 2: Server is considered up after 2 consecutive successful health checks.


    # Monitoring and Managing Load Balancer


    Viewing HAProxy Logs:


    Logs are configured in the global section of the HAProxy configuration. To view
    HAProxy logs:


    ```

    $ tail -f /var/log/haproxy.log

    ```


