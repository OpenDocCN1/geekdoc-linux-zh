    from a backup file created by pg_dump itself.


    # Performing Backup


    # Install PostgreSQL Tools


    Ensure that PostgreSQL and its tools are installed on your system:

    $ sudo apt update

    $ sudo apt install postgresql postgresql-contrib


    # Backup the Database


    Use pg_dump to create a backup of the PostgreSQL database. There are different
    backup formats available:


    +   - Plain SQL Script: This format creates a SQL script file that contains all
    the SQL commands needed to recreate the database.

    - Custom Format: This format is specific to pg_restore and allows for selective
    restoration of database objects.

    - Directory Format: This format creates a directory with one file per database
    object, also allowing selective restoration.


    For this example, we will use the custom format to create backup, which provides
    more flexibility during the restore process as below:

    $ pg_dump -U alphaproject_user -h localhost -F c -b -v -f /path/to/backup/alphaproject_db.backup
    alphaproject_db

