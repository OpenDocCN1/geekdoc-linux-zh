    # Using ''top'' and ''htop'' for System Monitoring


    System administrators monitor various aspects of a system to ensure its smooth
    operation and to prevent potential issues. Key aspects include CPU usage, memory
    usage, disk I/O, network activity, and process management. Monitoring these parameters
    helps in identifying performance bottlenecks, diagnosing issues, and optimizing
    system resources.


    Following are the key aspects monitored by Sysadmins:


    +   - **CPU Usage**: Tracks the percentage of CPU being used by processes.

    - **Memory Usage**: Monitors the amount of RAM used, available, and the swap space
    utilization.

    - **Disk I/O**: Observes the rate of data being read from and written to disk.

    - **Network Activity**: Measures data transmission and reception rates over network
    interfaces.

    - **Process Management**: Lists active processes, their resource usage, and status.


    # Using ''top'' for System Monitoring


    top is a powerful command-line tool that provides a real-time view of system performance,
    displaying various metrics related to CPU, memory, and processes.


    Run top Command


    ```

    $ top

    ```


    Following is the desired output:'
