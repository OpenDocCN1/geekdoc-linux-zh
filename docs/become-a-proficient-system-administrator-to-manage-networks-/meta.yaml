    # Securing SSH Access


    Secure Shell (SSH) is a protocol used for secure remote login and other secure
    network services over an insecure network. While SSH provides a secure channel,
    it can still be a target for attacks such as brute force attempts, man-in-the-middle
    attacks, and unauthorized access.'
