    # Configuring Snort for Intrusion Detection


    We have already installed and configured Snort in the previous sections. We shall
    now configure Snort to detect specific types of intrusions.


    # Define Detection Rules


    Snort uses rules to detect patterns of malicious activity. These rules specify
    the conditions under which an alert should be generated. Rules consist of a header
    and options, where the header defines the rule''s action, protocol, source and
    destination IPs, and ports, and the options specify the content to match.


    Following is the sample rule to detect SSH brute force attacks:


    ```

    alert tcp any any -> $HOME_NET 22 (msg:"SSH Brute Force Attempt"; flow:to_server,established;
    detection_filter:track by_src, count 5, seconds 120; sid:1000002; rev:1;)

    ```


    In the above snippet,


    alert specifies that Snort should generate an alert.'
  merge: -1
