    - -h: Specifies the host.

    - -F c: Specifies the custom format.

    - -b: Includes large objects in the dump.

    - -v: Enables verbose mode.

    - -f: Specifies the output file.


    # Verify the Backup


    To ensure the backup was successful, check the output file:


