- img_proc: false
  md: '# Backup Script


    Think if we want to automate the backup of the AlphaProject directory to ensure
    data is regularly saved.


    Following is the backup script:


    ```

    #!/bin/bash # automated_backup.sh

    SOURCE_DIR="/var/www/alphaproject"

    BACKUP_DIR="/backup/alphaproject" TIMESTAMP=$(date +%Y%m%d%H%M%S)

    BACKUP_FILE="$BACKUP_DIR/backup-$TIMESTAMP.tar.gz"

    LOGFILE="/var/log/backup.log" echo "Backup started at $(date)" >> $LOGFILE # Create
    backup directory if it doesn''t exist mkdir -p $BACKUP_DIR # Perform the backup
    tar -czf $BACKUP_FILE $SOURCE_DIR # Check if the backup was successful if [ $?
    -eq 0 ]; then echo "Backup completed successfully at $(date)" >> $LOGFILE else
    echo "Backup failed at $(date)" >> $LOGFILE exit 1 fi # Clean up old backups (older
    than 7 days) find $BACKUP_DIR -type f -mtime +7 -name "*.tar.gz" -exec rm {} \;
    echo "Old backups cleaned up at $(date)" >> $LOGFILE

    ```


    In the above code snippet,


    Variables: Define source directory, backup directory, timestamp, and log file.


    Commands:


    mkdir -p Ensure the backup directory exists.


    tar -czf $BACKUP_FILE Create a compressed archive of the source directory.


    find $BACKUP_DIR -type f -mtime +7 -name "*.tar.gz" -exec rm {} Delete backups
    older than 7 days.'
