  md: 'task scheduler that is designed for systems that are not always running. Unlike
    which requires the system to be up at the time the task is scheduled, anacron
    ensures that periodic tasks are run even if the system was down at the scheduled
    time. It is ideal for laptops, desktops, or any systems that do not run continuously.
    The anacron configuration files are typically located in


    # Writing Automation Scripts with ''cron''


    To edit the crontab file for scheduling tasks:


    $ crontab -e


    Hourly Task:


    0 * * * * /path/to/hourly_task.sh


    This entry schedules the hourly_task.sh script to run at the beginning of every
    hour.


    Weekly Task:


    0 2 * * 0 /path/to/weekly_task.sh


    This entry schedules the weekly_task.sh script to run every Sunday at 2 AM.


    Yearly Task:


    0 0 1 1 * /path/to/yearly_task.sh


    This entry schedules the yearly_task.sh script to run at midnight on January 1st
    every year.


    Following is the sample script:


    #!/bin/bash # hourly_task.sh echo "Hourly task executed at $(date)" >> /var/log/hourly_task.log


    Sometimes tasks need to run asynchronously without blocking other operations.
    This can be achieved using & to run tasks in the background.


    #!/bin/bash # async_task.sh (sleep 30; echo "Async task completed at $(date)"
    >> /var/log/async_task.log) &'
