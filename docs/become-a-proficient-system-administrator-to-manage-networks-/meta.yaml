- img_proc: false
  md: 'tcp indicates the rule applies to TCP packets.

    any any -> $HOME_NET 22 matches any source IP and port to destination IPs in $HOME_NET
    on port 22 (SSH).

    msg provides a message for the alert; detection_filter limits alerts to repeated
    attempts; sid is the rule identifier; rev is the rule revision.


    # Add Rules to Local Rules File


    ```

    Edit the local.rules file to add custom detection rules:

    $ sudo nano /etc/snort/rules/local.rules

