  md: '# Configuring IP Addresses and Routing


    Prior to a network that can be used for internal or external communication, IP
    addresses and routing must be configured. Here, we will show you how to navigate
    when it comes to configuring IP addresses and routing, so you can get your network
    talking to each other and the outside world in no time.


    # Configuring IP Addresses


    IP addresses are unique identifiers assigned to each device on a network, allowing
    them to communicate. Following is the example of how you can configure IP addresses
    on your Linux system.


    # Assigning Static IP Address


    To assign a static IP address, you can use the ip command. The below code snippet
    configures a static IP address on the eth0 interface.


    ```

    $ sudo ip addr add 192.168.1.100/24 dev eth0

    ```


    This command assigns the IP address 192.168.1.100 with a subnet mask of 255.255.255.0
    to the eth0 interface.


    # Removing IP Address


    If you need to remove an IP address, use the following command:


    ```

    $ sudo ip addr del 192.168.1.100/24 dev eth0

    ```


