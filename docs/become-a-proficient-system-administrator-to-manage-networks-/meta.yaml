  md: '# Installing and Configuring Kubernetes


    To set up Kubernetes on your existing development environment, follow these steps:


    # Installing Docker


    Kubernetes uses Docker as its container runtime.


    ```

    $ sudo apt update

    $ sudo apt install -y apt-transport-https ca-certificates curl software-properties-common

    $ curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo apt-key add -

    $ sudo add-apt-repository "deb [arch=amd64] https://download.docker.com/linux/ubuntu
    $(lsb_release -cs) stable"

    $ sudo apt update

    $ sudo apt install -y docker-ce

    $ sudo systemctl enable docker

    $ sudo systemctl start docker

    ```


    # Installing and kubectl


    kubeadm helps you set up a Kubernetes cluster, kubelet runs on all the machines
    in your cluster and does things like starting pods and containers, and kubectl
    is the command-line tool to interact with your cluster.


    ```

    $ sudo apt update

    $ sudo apt install -y apt-transport-https curl

    $ curl -s https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo apt-key
