    # ## High Availability Clustering


    High Availability (HA) clustering ensures that if one node fails, another can
    take over its workload.


    # ### Install and Configure HA Cluster


    Use tools like Pacemaker and Corosync to set up an HA cluster.


    ```

    $ sudo apt-get install pacemaker corosync

    ```


    Edit the Corosync configuration file:


    ```

    $ sudo nano /etc/corosync/corosync.conf

    ```


    Following is the sample configuration:


    ```

    totem { version: 2 secauth: on threads: 0 interface { ringnumber: 0 bindnetaddr:
    192.168.1.0 mcastaddr: 239.255.1.1 mcastport: 5405 } }

    quorum { provider: corosync_votequorum two_node: 1 }

    ```


    Start and enable the services:'
  merge: -1
  pgno: 259
- img_proc: false
  md: '```

    $ sudo systemctl start corosync $ sudo systemctl start pacemaker $ sudo systemctl
    enable corosync $ sudo systemctl enable pacemaker

    ```


    Add nodes to the cluster:


    ```

    $ sudo pcs cluster auth node1 node2 $ sudo pcs cluster setup --name mycluster
    node1 node2 $ sudo pcs cluster start --all

    ```


    # Create Resources and Constraints


    Create resources for the services you want to maintain high availability for,
    such as a web server.


    ```

    $ sudo pcs resource create WebServer ocf:heartbeat:apache configfile=/etc/apache2/apache2.conf
    op monitor interval=30s

    ```


    Set constraints to ensure the resource runs on only one node at a time:


    ```

    $ sudo pcs constraint colocation add WebServer with WebServer-clone INFINITY $
    sudo pcs constraint order WebServer then WebServer-clone

    ```


    # Load Balancing


    Load balancing distributes incoming network traffic across multiple servers to
    ensure no single server becomes overwhelmed.


    Install HAProxy:


    ```

    $ sudo apt-get install haproxy

    ```


    Configure HAProxy to balance traffic between backend servers:


    ```

    $ sudo nano /etc/haproxy/haproxy.cfg

    ```


    Following is the sample configuration:


    ```

    frontend http_front bind *:80 stats uri /haproxy?stats default_backend http_back
    backend http_back balance roundrobin server server1 192.168.1.101:80 check server
    server2 192.168.1.102:80 check

    ```


    Restart HAProxy:


    ```

    $ sudo systemctl restart haproxy

    ```'
  merge: -1
  pgno: 260
- img_proc: false
  md: '# Redundant Systems


    Implementing redundant systems ensures that if one component fails, another can
    take over without service interruption.


    # Set Redundant Servers


    Ensure critical services are running on multiple servers. For example, to replicate
    a database across multiple nodes, edit the MySQL configuration on the master server:


    $ sudo nano /etc/mysql/mysql.conf.d/mysqld.cnf


    Add the following lines:


    ```

    [mysqld] log_bin = /var/log/mysql/mysql-bin.log server_id = 1 binlog_do_db = mydatabase

    ```


    Restart MySQL:


    $ sudo systemctl restart mysql


    On the slave server, edit the MySQL configuration:


    $ sudo nano /etc/mysql/mysql.conf.d/mysqld.cnf


    Add the following lines:


    ```

    [mysqld] server_id = 2

    ```


    Restart MySQL:


    $ sudo systemctl restart mysql


    # Configure Replication


    On the master server, create a replication user:


    ```

    mysql> CREATE USER ''replicator''@''%'' IDENTIFIED BY ''password'';

    mysql> GRANT REPLICATION SLAVE ON *.* TO ''replicator''@''%'';

    ```'
  merge: -1
  pgno: 261
- img_proc: false
  md: 'On the slave server, set up replication:


    ```

    mysql> CHANGE MASTER TO MASTER_HOST=''master_ip'', MASTER_USER=''replicator'',
    MASTER_PASSWORD=''password'', MASTER_LOG_FILE=''mysql-bin.000001'', MASTER_LOG_POS=0;

    mysql> START SLAVE;

    ```


    Check the replication status:


    ```

    mysql> SHOW SLAVE STATUS\G

    ```


    # Automated Failover


    Automated failover ensures that if a primary system fails, a backup system can
    take over automatically. To begin with, first install Keepalived as repeated in
    one of the previous chapter:


    ```

    $ sudo apt-get install keepalived

    ```


    Configure Keepalived on both the primary and backup servers:


    ```

    $ sudo nano /etc/keepalived/keepalived.conf

    ```


    Following is the sample configuration for the primary server:


    ```

    vrrp_script chk_haproxy { script "killall -0 haproxy" interval 2 }

    vrrp_instance VI_1 { interface eth0 state MASTER virtual_router_id 51 priority
    100 advert_int 1 authentication { auth_type PASS auth_pass 1234 } virtual_ipaddress
    { 192.168.1.100 } track_script { chk_haproxy } }

    ```


    Following is the sample configuration for the backup server:


    ```

    vrrp_script chk_haproxy { script "killall -0 haproxy" interval 2 }

    vrrp_instance VI_1 { interface eth0 state BACKUP virtual_router_id 51 priority
    90 advert_int 1 authentication { auth_type PASS auth_pass 1234 } virtual_ipaddress
    { 192.168.1.100 } track_script { chk_haproxy } }

    ```


    Restart Keepalived:


    ```

    $ sudo systemctl restart keepalived

    ```


