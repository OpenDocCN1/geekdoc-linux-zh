  md: '# Selecting the Installation Type for Fedora


    If the installer finds Fedora on your hard disk, it asks whether you want to upgrade
    or install a new version. The instructions in this chapter are for a new installation.


    A Linux computer can serve many purposes. The next screen displayed allows you
    to select a type of installation for your computer. The choices are shown in Figure
    4-7.


    # Figure 4-7. Installation type screen in Fedora Core.


    ![](img/8fd2e743227b42de3b4152272123250b_62_0.png)


    Select one of the following:


    +   - **Personal Desktop** provides a desktop and a selection of desktop applications.
    This removes all existing Linux software on your hard disk, but leaves any Windows
    software in place.

    - **Workstation** includes the applications provided by Desktop and adds tools
    for software developers and system administrators.

    - **Server** is not designed for desktop use. This choice will remove all other
    software, including Windows, from your hard disk.'
