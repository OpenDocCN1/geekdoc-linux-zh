  md: '# Mozilla Message Filters


    You can set up a set of rules that direct incoming email into folders, rather
    than into your inbox. If you receive a lot of mail, organizing your email is very
    helpful. Click Tools. Message Filters. The window in Figure 17-7 opens.


    # Figure 17-7. Mozilla message filters window.


    ![](img/8fd2e743227b42de3b4152272123250b_352_0.png)


    The window shows a list of the current filterssets of rules.


    You can create a new filter, delete a filter, or edit an existing filter. You
    can also change the order of the filters in the list using Move Up and Move Down.


    Each filter has one or more rules in it. Rules test whether incoming email meets
    specific criteria. If the message matches, it handles as defined by the rule.
    For instance, a rule might light for messages coming from mom@home.com and send
    any messages from that into the "Family" folder.


    You can log the action of your filters. Click Filter Log. Check "Enable the Filter
    Log."


    Click Run Now to apply the filters to the filter selected in the drop-down list
    at the bottom of the window. Any messages found that match an existing filter
    are handled immediately.


    Creating a message filter is discussed in the next section.'
  merge: -1
