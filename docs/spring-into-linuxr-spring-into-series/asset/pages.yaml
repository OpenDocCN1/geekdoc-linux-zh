- img_proc: true
  md: '# Using Templates


    A template is a blueprint for a document. A template contains the styles to be
    used in the document and content that may contain the text, graphics, and any
    other content you desire. For instance, a memo template can contain the spacing
    desired, the styles, and the memo headers so that the user only needs to fill
    in the specific information for the headers, such as the date and subject. In
    fact, a field can be included that automatically fills in the current date for
    the user. A monthly report template might include a table with titles so that
    only the cells need to be filled.


    To create a document from a template, click File New->Templates and Documents.
    The window in Figure 11-3 opens.


    # Figure 11-3. Template window.


    ![](img/8fd2e743227b42de3b4152272123250b_230_0.png)


    Notice that the Templates icon is selected in the left pane. When the window first
    opens, a list of categories (folders) is shown in the middle pane. Double-click
    a category to see the templates. The figure shows the templates in the Default
    category. Highlight a template to see its properties or a preview in the right
    pane. The two buttons above the right pane switch between preview and properties.
    The figure shows the properties of the template named Default.


    Double-click the template to open a document based on the template. The default
    template is used to create a text document when you select New->Text Document.
    You can designate any template to be the default template, later in this chapter.'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# Creating Templates


    To create a template, you just create a document with all the content you want,
    such as memo headers, footers, titles, company logo, etc., and all the styles
    you need. Then save the document as a template by clicking File and selecting
    Templates->Save. Every document that you create using the template is associated
    with the template; the template name is shown in the properties window (File->Properties).
    If you change a template style and then open a document that was created using
    the unchanged template, a dialog box informs you that the styles have changed,
    asking you want to change the document to match the current styles.


    # NOTE


    If you save the template using File->Save As->Template, the documents created
    from the template aren''t associated with it and aren''t automatically updated
    when the template is changed.


    To change a template, click File and select Templates->Edit.


    Templates must be located in the template folders. To see where the templates
    are located, click Tools to select Options. Click the Paths tab to see a list
    of paths where files are located. Find the path to Templates. The path might look
    like the following:


    ```

    /opt/OpenOffice.org/share/templates/English/;home/OpenOffice.orgl/user/template.

    ```


    The template location above specifies two directories, separated by a semicolon.
    You can edit this path to store templates in a different or an additional location.


    You can create a new folder by clicking File and selecting Templates->Organize
    to open the organizer. Highlight any folder in the left pane. Click Commands and
    select New. The new folder is untitled. Type a new name and press Enter.


    The default is used when you create a new text document. You can edit the template
    name or select a different template to be the default. To specify a template as
    the default, open the organizer and highlight the template you want to be the
    default (It must be in the default template folder.). Click Commands Set as Default
    Template.


    A printer is included in a template. To define a printer, open the organizer,
    highlight the template Commands and then click Printer Settings.


    You can copy styles from one template to another. In the organizer, set both panes
    to Templates, using the drop-down menus between panes. Double-click the template,
    and then click the Styles icon to see the styles. To move a style, drag a style
    from one template to a template in the other pane. Hold the Ctrl key while dragging
    to copy the style.'
  merge: -1
