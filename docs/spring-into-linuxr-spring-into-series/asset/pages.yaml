  md: '# diff (compare two text files)


    Compares the contents of two text files. Displays the lines that are different.


    ```

    Format: diff fileordinal1 fileordinal2

    Examples: diff prog1 prog2

    diff prog1 /home/jane/dir1

    diff /home/jane /home/jane/dir1

    ```


    Compares prog1 to prog2. In the second example, compares prog1 to /home/jane/dir1/prog1
    if it exists. In the third example, compares all files that exist in both directories.


    Displays the lines that differ between the two files. < indicates lines from the
    first file; > indicates lines from the second file. For example:


    ```

    cat fileA

