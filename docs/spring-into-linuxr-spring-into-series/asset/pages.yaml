  md: '# # Tabbed Browsing in Mozilla


    Tabbed browsing in Mozilla allows you to keep more than one Web page open in a
    single browser window. You use its tab to bring a Web page forward.


    Tabbed browsing is shown in Figure 15-4. Figure 15-5 shows the tabbed browsing
    section of Figure 15-4.


    # ## Figure 15-5. Mozilla tabs.


    ![](img/8fd2e743227b42de3b4152272123250b_313_0.png)


    The Fedora project page is open in Figure 15-4. Figure 15-5 shows the title of
    the Fedora Web page. Note the top of figure. There are three tabs. The tabs display
    the title for the Web page, the title that appears in the Web page title bar,
    as much of the title as space allows.


    The first tab is currently the Fedora Project tab. The second tab shows Janet
    Valade''s Home Page. The third tab shows RealPlayer 10. If you click this tab,
    you see the home page. The third tab shows RealPlayer Web page displays.


    To see another Web page, you can replace one of the current tabs in the Web page
    or open a new tab. When a tab is selected and the Web page is visible, you can
    type a URL to open a new Web in the selected tab. For instance, with the Fedora
    Web page open, you can type a URL into the location box and the New page will
    replace the Fedora Web page, still in the current tab.


    To open a new tab, right-click a blank space on the bar on which the tabs display.
    Select New Tab. A new tab opens in the current browser window. The new tab will
