  md: '# Graphics in Documents


    OpenOffice Writer provides two methods for adding graphics to your document. As
    in Word, you can add graphics by:


    +   - **Inserting**: Inserting a graphic contained in another file.


    +   - **Drawing**: Using Writer''s built-in tools to draw directly in the document.


    You can insert graphics from a file using two methods:


    +   - **Embed**: Inserting the graphic into the document. When you embed the graphic,
    it''s always part of the document. You don''t need to be concerned with a separate
    graphics file. Embedding is often preferred when you need to send the document
    to others. When you copy and paste a graphic, it is automatically embedded.


    +   - **Link**: The graphic is not included inside the file. Rather, a link to
    the graphics file is included in the document. The document is much smaller without
    the embedded graphic. In addition, when the graphic file is updated, the graphic
    in the document is also updated. No need to insert the new graphic.


    You can insert a graphic directly into a document or into a frame. A frame is
    useful for keeping the graphic and its caption together. A graphic or a frame
    can be anchored to a page location, a paragraph, or a character. When the page/paragraph/character
    moves, the graphic/frame moves with it, with the same orientation.


    If you want to put your graphic into a frame, insert the frame first, and then
    insert the graphic inside the frame. To insert a graphic into a document or frame,
    click Insert and select Graphics->From File. A window opens where you can browse
    the graphic to the file. To link, rather than embed it, check the Link at the
    bottom of the window. Preview is also available to be checked.


    To add a caption to a graphic, select the graphic, click Insert, and select Caption.
    The screen to the right appears. Select a Category or type a new one (e.g., Figure).
    Type the caption text. A caption appears at the top. The number is added automatically.
    The graphic is put into a frame when a caption is added, which keeps the caption
    and graphic together when they move.'
  merge: -1
  pgno: 241
- img_proc: true
  md: '![](img/8fd2e743227b42de3b4152272123250b_242_0.png)


    You can change the graphic in several ways. When it''s selected, drag it around
    to move it or drag its handles in or out to resize it. Right-click to see options
    for changing the alignment, put the graphic text behind, change its anchor, or
    allow text to wrap around it. Or select Graphics from the right-click menu to
    see a window with many options, similar to the window in Figure 11-6.


    ![](img/8fd2e743227b42de3b4152272123250b_242_1.png)


    You can create a drawing directly on a page or in a frame. The drawing tools are
    provided on a fly-out toolbar, on the right, opened by long-clicking the menu
    draw icon, shown on the left. Click the shape you want to draw. The cursor changes
    shape. Click a location in the document and use the mouse to draw the shape. Each
    shape is an individual figure, but several figures can be grouped to create a
    finely complicated drawing. You can also add text to the drawing with the text
    tool on the Draw toolbar.


    ![](img/8fd2e743227b42de3b4152272123250b_242_2.png)


    When a drawing is selected, the object toolbar provides icons for drawing features,
    as shown in Figure 11-7.


    # Figure 11-7. Drawing object toolbar.


    [View full size image]


    ![](img/8fd2e743227b42de3b4152272123250b_242_3.png)


    You can change the style (arrowheads, dashes, etc.), the width, and the color
    of the lines. You can set a color that will fill in the shapes, such as circles.
    You can change the anchor for the drawing, such as a page, paragraph, or character.


    Shapes have one larger handle than the others. When the mouse pointer is moved
    over the large handle, it changes into a hand. When the hand drags the handle,
    the corners of a rectangle are rounded.'
  merge: -1
  pgno: 242
- img_proc: true
  md: 'You can select more than one figure at once. Select one drawing. Then, Shift-click
    one or more additional drawings. The handles will change to bracket all the selected
    figures.


    You can align figures vertically or horizontally. Select all the figures to be
    aligned. Click the icon on the far right on the object toolbar. A menu of alignment
    options displays. You can align the top, bottom, or middle of the figures.


    You can group figures together, so they move together. Select the drawings to
    be grouped. Right-click the selected drawings and select Group->Group. If you
    select a group of figures and right-click, you can select Ungroup, which breaks
    the group back into individual figures, Edit, which allows you to change an individual
