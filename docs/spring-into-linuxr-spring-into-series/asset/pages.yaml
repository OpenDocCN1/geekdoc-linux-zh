  md: '# Exclude a Set of Literal Characters ([ ^] )


    You can put a set of literal characters inside square brackets, preceded by a
    circumflex (^). The pattern matches only if none of the set of characters is found.


    | Regular Expression | Match | Not a Match |

    | --- | --- | --- |

    | a[bcd]ef | axef, akef | abef, acef, adef, axk |

    | a[b-d]ef | axef, akef | abef, acef, adef, axk |'
