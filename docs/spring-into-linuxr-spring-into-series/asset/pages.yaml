  md: '# Command-Line Syntax


    Type commands on the command line, following the command prompt. When you press
    <Enter> after typing the command, the command is executed. While the command is
    executing, no system prompt displays. When the command finishes running, the system
    prompt displays, indicating that the shell is ready to accept another command.


    # Tip


    While a command is executing, you can stop it by pressing <Ctrl+c>.


    A command consists of the command, options, and arguments in the following format:


    ```

    commandname options arguments

    ```


    where


    +   * Commandname is the name of the command.

    * Options are keywords that affect command execution. Options consist of one character,
    preceded by a hyphen (-), or a character string (--). The hyphens tell the shell
    that the next characters are an option. For most commands, options are optional.

    * Arguments are information that the command uses during execution. For instance,
    a command may process a file, so you need to pass the name of the file as an argument.
    You can pass as many arguments as the command needs. All commands require arguments.
    Some commands require default values when you don''t pass the arguments. If an
    argument includes spaces or special characters, enclose it with quotes on the
    command line, so that the shell knows it''s one argument, rather than two.


    The following command shows a name, an option, and an argument:


    ```

    ls -l /home/janet

    ```


    The ls command lists the files in a directory. The argument is a path to a directory;
    the files in the directory specified by the argument (ls) are displayed on the
    screen. However, ls is a command that doesn''t require an argument, using a default
    when you don''t pass an argument. If you don''t include a directory name, the
    ls command lists the files in the current directory.


    The -l is one of many options you can use with the ls command to determine the
    information displayed'
  merge: -1
