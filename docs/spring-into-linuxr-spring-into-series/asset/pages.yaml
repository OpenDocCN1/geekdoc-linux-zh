  md: '# Examining Your Hard Drive


    If you don''t know which partitions are available, you can use Windows Administrative
    Tools to find out. On Windows XP, select Start -> Control Panel -> Administrative
    Tools -> Computer Management -> Disk Management. The window shown in Figure 3-1
    displays, showing the hard disks and their partitions.


