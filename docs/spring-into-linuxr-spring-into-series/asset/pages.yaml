  md: '# Browsing with Mozilla


    A Mozilla browser window open to fedora.redhat.com is shown in Figure 15-4.


    # Figure 15-4. Mozilla.


    ![](img/8fd2e743227b42de3b4152272123250b_309_0.png)


    To go to a Web page, type your URL into the location bar. To overwrite the current
    address, click the icon at the beginning of the location bar; then type the URL.


    You can search using the location bar. Search in terms and click Search to run
    a Google search. The results display in the sidebar.


    You can change the settings for Mozilla. Click Edit and select Preferences. Click
    Appearance to change fonts and colors. Click Navigator to change Mozilla behavior.
    In the Navigator windows, you can set your home page, set Mozilla to be your default
    browser, select which buttons are on the toolbars, change the search engine, and
    set many other options.


    You can copy or save all or part of a Web page using the Edit menu. You can print
    the page from the Print button.'
  merge: -1
