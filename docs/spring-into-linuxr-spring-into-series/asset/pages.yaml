  md: '# Editing the Command Line


    Several command-line features assist you with entering commands. For instance,
    wildcards are available, the same wildcards that you can use with Windows. The
    asterisk (*) can be substituted for a string of characters and a question mark
    (?) can be substituted for a single character. Thus, the following command lists
    filenames that include var and end with a single character:


    ```

    ls *var?

    xvar1

    Study_varA

    ```


    File and directory names are completed for when you press the Tab key. As soon
    as you have typed enough of the name so that it refers to only one file, press
    the Tab and the remainder of the filename is filled in the command line.


    The shell stores a history of the commands you enter. You can see it by typing
    history, which lists the commands, adding a line number at the start of each line.


    You can repeat using commands that begin with an exclamation point:


    +   * !! Repeats the last command entered.

    * !string Type an exclamation point, followed by one or more letters that begin
    a command. The last command that begins with the letters is repeated. For instance,
    if you type !c, the last command that begins with c is repeated.

    * !n Type the !, followed by a line number. The command shown on that line in
    the history is repeated. For instance, if you type !6, the command on line six
    of the history is repeated.


    You can also repeat a command using the up-arrow key. Each time you press <up
    arrow>, the previous command displays. Continue to press <up arrow> until you
    reach the command you want to repeat.


    You can edit the previous command and reenter it using ^old^*new. The command
    will replace string1 with string2 in the first command that just executed:


    ```

    srot test.txt

    ro^or

    ```


    As shown, you accidentally typed srot, when you mean to type sort. The second
    line tells the shell to re-enter the command, changing ro to or.'
  merge: -1
  pgno: 154
- img_proc: true
  md: '# # Command-Line Help


    Linux provides several commands that give help with the details of its many commands:


    +   - **help**: Gives a list of the shell commands, a subset of Linux commands
    including `cd`, `alias`, `bg`, `jobs`, and others. Type `helpcommand` for details.


    +   - **man**: The man (manual) pages document all the programs on Linux. To see
    the details of any command, type `mancommand`. If you don''t know the name of
    the command, you can search all descriptions using the `-k` option. For example,
    if you type `man -k copy`, a list of all commands that copy in their descriptions
    displays


    +   - **info**: A program that displays online documentation via a hierarchical
    menu of topics that you can select. In addition, related information is hyperlinked.
    Info often contains information that is more complete, with more conceptual information,
    than the man pages. When you type info with no arguments, the top-level man displays.
    If you know a topic name, you can type `infopickname`.


    +   - **help option**: Many programs have an option that displays information
    about using the program. It''s worth a try to type the program name, followed
    by either `-h` or `--help`. For instance, typing `info --help` displays a brief
    help file.


    Man pages are divided into numbered sections, based on the type of command, such
    as executable programs, system calls, or games. Most of the commands you are interested
    in learning Linux are in section 1Executable programs or shell commands. If you
    specify the section number, the `man` command does not need to search all the
    man pages, only one section, speeding the command considerably. For instance,
    you might use the following command to look up all the available options for `ls`
    command:


    ```

    man ls

    ```


    Software is installed on Linux, the associated help, man, and/or info files are
    installed in the appropriate location. The `man` command looks for files in a
    specific directory, in subdirectories for each section. To see where the man pages
    are located, type `manpath` at the command line.'
  merge: -1
  pgno: 155
