- img_proc: true
  md: '# Your First Login


    The first time you log in to your system after installation, Linux may require
    some post-installation setup. For example, Fedora creates a user account when
    you first log in to your new system. Mandrake and SuSE create user accounts during
    installation, but Fedora only creates a root account, waiting until now to create
    a user account.


    The first time you log in Mandrake, it runs a procedure called Mandrakfirsttime
    Wizard. The first screen introduces the wizard, stating that it will help you:


    +   - Configure the basic setup of your desktop in a few steps.

    - Register your product in order to easily open a Mandrakelub account and benefit
    rapidly from all its products and services.


    The next screen in the wizard displays a Choose Desktop button. When you click
    it, a list of possible desktops drops down. KDE is default, but you can select
    another. After you select a desktop, a screen allows you to select one of several
    themes. A theme is a unified set of colors and images that integrate all parts
    of the desktop into a single look and feel, including the window borders, fonts,
    icons, etc. A demo screen shows the appearance of the default Galaxy 2 theme.
    If you check a different theme, appearance of the demo screen will change, showing
    the new theme. When the demo shows the appearance you like best, click Next.


    Mandrakfirsttime Wizard also helps you set up and configure a Mandrakelub account.
    Mandrakelub offers software downloads, forums, special discounts, and other benefits
    for a small monthly fee. The first month is free so you can try it out.


    When the wizard finishes, the desktop displays with a welcoming message. Click
    Close to close the welcome message without closing the desktop. Uncheck "Open
    on startup" when you no longer want to see this screen every time your computer
    starts.


    During your first login, SuSE also displays a welcome message with links to the
    SuSE home page.'
  merge: -1
  pgno: 117
- img_proc: true
  md: '# Anatomy of a Desktop


    Most desktops have common basic components, as shown in Figure 6-3. This desktop
    should look fairly familiar to Windows users.


    # Figure 6-3. Desktop.


    ![](img/8fd2e743227b42de3b4152272123250b_118_0.png)


    The desktop workspace contains icons, in this case two icons, that perform actions
    when clicked, just as Windows desktop icons do. You can customize the desktoppadding,
    removing, and rearranging icons. Handling icons is discussed in this chapter.


    The panel (sometimes called kicker) is the bar across the bottom of your desktop.
    The panel can be moved to the left, right, or top. You can have more than one
    panel.


    In Figure 6-3, the left side of the panel contains several icons. You can customize
    these iconsadding and removing them from the panel. To the right of the panel
    is a four-button pagerbuttons that you can click to open alternative virtual desktops,
    explained in this chapter. To the right of the pager is a section, where application
    buttons appear when an application is running. To the right of the taskbar are
    icons for useful system tools. A clock displays on the far right of the panel.
    You can reorganize the paneladding, removing, moving the objects on it.'
  merge: -1
  pgno: 118
- img_proc: true
  md: '# KDE and GNOME Desktops


    The two most popular desktops, KDE and GNOME, are discussed in this book. KDE
    and GNOME look are very similar. Figure 6-4 shows the KDE and GNOME desktops provided
    by Fedora.


    # Figure 6-4. KDE and GNOME desktops for Fedora.


    ![](img/8fd2e743227b42de3b4152272123250b_119_0.png)


    KDE and GNOME for Fedora are very similar. Both have "trash" and "home" icons,
    GNOME has two additional icons. The panel has the same icons. One reason look
    so similar is that both desktops are very customizable. Thus, the Fedora desktops
    are both configured in a manner deemed useful by the Fedora developers. Desktops
    configured for different distributions can be customized differently, but still
    are very similar. KDE desktops distributed with Fedora and Mandrake are shown
    in Figure 6-5.


    # Figure 6-5. KDE desktops for Fedora and Mandrake.


    ![](img/8fd2e743227b42de3b4152272123250b_119_1.png)'
