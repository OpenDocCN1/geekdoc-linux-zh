  md: "# tar (copy files into or restore files from an archive file)\n\nTar is a utility\
    \ to create an archive file, called a tarball. Files can be added to the archive\
    \ file using tar. The action of tar depends on the options used.\n\n```\nFormat:\
    \    tar options tar filelist\nExamples: tar -cf newarch.tar *\n           tar\
    \ -xf oldarch\n```\n\nThe first example creates a new archive file called newarch\
    \ and stores all files in the current directory in the new archive. It's customary\
    \ to name the file with a .tar extension. The second example extracts all the\
    \ files in the archive oldarch. After extraction, the files are in the current\
    \ directory and the archive is still there also.\n\nTar has two types of options.\
    \ One from the function options is required, determining the action tar performs.\
    \ The second table lists normal options, totally optional.\n\n| Required options\
    \ | What It Does | |\n| --- | --- | --- |\n| -A | Add another archive to the end\
    \ of the current archive | |\n| -c | Create a new archive | |\n| -d | Compare\
    \ archived files with source files and report differences | |\n| -delete | Remove\
    \ file from archive file | |\n| -r | Append files to end of archive file | |\n\
    | -t | Display names of files in archive | |\n| -u | Add files if not already\
    \ in archive or if they have been modified | |\n| -x | Extract files from the\
    \ archive | |\n\n| Opt | What It Does | Examples |\n| --- | --- | --- |\n| -f\
    \ file | Use specified archive file. | tar -xf projarch.tar |\n| -j | Compress\
    \ files with bzip2 before storing in archive file | tar -cjf arc.tar * |\n| -k\
    \ | Do not overwrite existing files with extracted files | tar -xkf projarc.tar\
    \ |"
  merge: -1
  pgno: 485
