  md: '# Creating the Root Account for Fedora


    Users must have an account to use Linux. When you boot, your first screen will
    ask you to log in to an account. A root account is required. The root user is
    often called the super user. Other user accounts are usually installed as well.
    Accounts are discussed in detail Chapter 8.


    In this screen, shown in Figure 4-14, you create the root account. Other accounts
    are created later.


    # Figure 4-14. Root password screen in Fedora Core 2.


    ![](img/8fd2e743227b42de3b4152272123250b_70_0.png)


    Type a password for the root account. Type the same password twice, to be sure
    that you don''t make a mistake. It''s extremely important that you remember this
    password. You can''t make any changes to your Linux system without the root account.
    Even if you install accounts later and you can log in to a user account, you can''t
    do many things that need to be done unless you can use the root account.


    Choose your password to be as secure as possible, easy to remember but not to
    guess:


    +   - Use at least 8 characters.

    - Use one or more of each of the following: uppercase letters, lowercase letters,
    numerals, and punctuation marks.'
  merge: -1
