  md: '# Chapter 4. Installation


    Installing software involves more than copying the software onto a hard disk.
    The software must be configured with the information it needs to perform its job.
    An operating system is complex software, which requires considerable information
    to perform its job. Most software, including operating systems, comes with an
    installation program. To install the software, you run the installation program,
    which asks questions and installs the software, configuring it with the information
    obtained during the installation procedure.


    If you have installed software on a Windows machine, you know that the installation
    procedure asks you questions, such as where you want the software installed and
    what is your registration number. After you answer the questions, the installation
    program installs the software based on the information you provided.


    Most Linux distributions come with an installation program that installs the software
    based on information obtained during the installation procedure. Information is
    obtained both by probing the computer hardware for information and by asking questions.


    The installation procedures for Fedora, Mandrake, and SuSE, the three major Linux
    distributions discussed in this book, have been developed and refined to be easy
    to use. Installation for these distributions is described in detail in this chapter.'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# Installation Overview


    The Linux installation procedure performs two tasks:


    +   - Gathers information

    - Installs Linux


    To install correctly, the Linux installation procedure needs the following information:


    +   - **Local information**: The language the user prefers to use. The local time
    zone.

    - **Hardware information**: Linux communicates with the computer hardwareto display
    information on the monitor, to send documents to the printer, to store data in
    file on the hard disk, send information via the modem, to communicate correctly,
    Linux needs to know which hardware is installed, including the type of monitor,
    type of printer, and so on.

    - **Where to install Linux**: Is Linux to be installed on the entire hard disk
    or part of it? Is sharing the disk with another operating system? Is this a new
    installation or is it replacing a previous Linux installation? Chapter 3.

    - **Accounts**: Linux requires users to have accounts before they can use the
    computer. The accounts are created during installation. Accounts are discussed
    in Chapter 8.

    - **Software**: Which software packages to install? Most distributions contain
    hundreds or thousands of packages. Not all the packages need to be, or even be
    installed.

    - **Network settings**: To communicate across a network, Linux needs to know what
    type of network and network connection is to be. Networks are discussed in detail
    in Chapter 16.


    Any Linux distribution needs to be installed in Linux. In old days, the person
    installing Linux needed to provide the information. Thus, the person needed to
    be knowledgeable, especially about the hardware. Over time, many Linux distributions
    have developed installation procedures to make the installation process much easier.
    The installation procedure can obtain much of the information needed by probing
    the computer hardware and settings.


    The three distributions (Fedora, Mandatory, SUSE) discussed in this book provide
    installation procedures that are quite easy to follow. The three distributions
    take different approaches to collecting information.


    +   - **Fedora**: The installer steps through each bit of information needed,
    asking questions if it needs too screen for the keyboard, or for the mouse, etc.

    - **SUSE**: Begins by probing the computer, gathering information, and making
    estimates for all the settings. It showed the estimated settings in a screen.
    You can accept or change the settings.

    - **Mandrake**: As questions one by like Fedora. However, at the end of the questions,
    a screen is displayed showing the settings, similar to the SUSE screen, giving
    you the opportunity to change any settings.


    After the information is collected, the software is installed. Installation consists
    of the following:'
  merge: -1
  pgno: 54
- img_proc: true
  md: '+   - Configuring the software based on the information gathered

    - Copying the programs to the appropriate locations on the hard disk.


    Fedora and Mandrake copy all the software packages at once. SuSE installs a basic
    system, reboots, and then uses the basic system to install the remaining software.


    The Linux installation may take an hour or more, depending on the distribution
    and the amount of software installed. It''s okay to let the installation wait
    in the middle of installation, but if you stop the process, for instance by shutting
    off your computer, you will have to start over from the beginning.


