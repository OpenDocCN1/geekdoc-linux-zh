- img_proc: true
  md: '# # Autocorrection


    As you enter or edit content, OpenOffice Writer assists you by changing text that
    it identifies as incorrect. You may find some or all of its actions annoying.
    You can change the settings to stop or modify the objectionable click. Click Tools
    and select Autocorrect. A window opens with the following tabs:


    +   - **Options**: A list of corrections you can check and uncheck, such as "Capitalize
    the first letter of sentence."

    - **Replace**: A table of character strings and words or symbols that replace
    them when they occur. For instance, if you type hte, Writer writes it to the.
    You can add further errors to the table. Just type the error and its correction
    in the top boxes and click New. You can remove a correction by highlighting it
    and clicking Delete.

    - **Exceptions**: Lists of exceptions for two of Writer''s autocorrection features.
    The two features sometimes correct unfortunate errors, but other times create
    errors. You can turn the corrections off in the Options tab. Or, you can modify
    the corrections using Exceptions tab.


    +   - Uppercase first letter of sentence: The end of the sentence is identified
    by the period. However, this can result in the first letter after an abbreviation
    being changed to uppercase, not what you want. Writer maintains a list of abbreviations.
    After the abbreviations are not changed to uppercase. You can add abbreviations
    to this list. And remove them.

    - Lowercase second letter: When Writer sees the first two characters of a word
    in uppercase, it changes the letters to lowercase, assuming that it''s an error.
    Sometimes, the uppercase letters are intended. Writer maintains a list of words
    that begin with two uppercase letters, such as CDs and PCs. The second letters
    are not changed to lowercase for these words. You can add words to this list.
    And remove them.


    +   - Word Completion: A list of frequently used words. When you type three letters
    that match one of these words, Writer completes the word for you. You can disable
    the feature in the Word Completion tab. Or, you can add words to the list. Or
    remove words.'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# Spell Checking


    OpenOffice Writer provides a spell checker and thesaurus, similar to Word. Both
    are found on the Tools menu. When the spellchecker finds an incorrect word, the
    window in Figure 11-4 opens.


    # Figure 11-4. Spellcheck window.


    ![](img/8fd2e743227b42de3b4152272123250b_236_0.png)


    You can replace the word or ignore it. You can look for a word in the thesaurus.
    You can add the word to the dictionary by clicking Add.


    To change the settings for the spell checker, click Options. A list of options,
    such as "Check words with numbers" and "Check uppercase words," that you can check
    and uncheck displays.


    Several dictionaries are installed with Writer, depending on the settings chosen
    during installation. You can add dictionaries for other languages. To add a dictionary,
    click File and select Autopilot. Install new dictionaries. A list of available
    dictionaries displays. Select the language you want to display installation instructions.
    You can create and use custom dictionaries.


    OpenOffice provides custom dictionaries that you can edit. You can also create
    new dictionaries of your own. A custom dictionary is useful for specific words
    that you don''t want to add to your main dictionary. To edit or create dictionaries,
    click Tools and select Options. Click the + by Language Settings and select Writing
    Aids. The window in Figure 11-5 opens.'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# Figure 11-5. Edit dictionaries window.


    ![](img/8fd2e743227b42de3b4152272123250b_237_0.png)


    The second list box contains the user-defined dictionaries. To create a new dictionary,
    click New. Type a name for the dictionary you prompted. Put a check in the box
    by the new dictionary so that it''s used in a spell check. At this point, it''s
    empty.


    To add words to a dictionary, highlight it and click Edit. A window opens with
    a list box showing the words currently in the dictionary. Type a word into the
    text box labeled Word and click New to add the word to the dictionary. You can
    delete words from the dictionary by highlighting a word and clicking Delete.


    A spell checker doesn''t find words that are used incorrectly, as long as they
    are spelled correctly. You may want to manually check certain words in your document
    that often get used incorrectly, such as your/or to/too. You can create an exception
    dictionary containing words that want the spell checker to mark incorrect, even
    if they are spelled correctly. To do so, create a new dictionary as described
    above. When the window above prompts for the dictionary name, check the "Exception"
    box. Any words added to this dictionary will be marked incorrect by the spell
    checker.


    ![](img/8fd2e743227b42de3b4152272123250b_237_1.png)


    ![](img/8fd2e743227b42de3b4152272123250b_237_2.png)'
  merge: -1
