  md: '# # Summary


    All information on Linux is organized into files. All information, without exception.
    Some files you might need to know about and manage are data files, programs, image
    files, and configuration files. Although you usually create and make files with
    applications, on some occasions you need to create, copy, move, delete, and otherwise
    manage files directly.


    Files are located in directories, also called folders, organized in a hierarchical
    file system. Each account has a home directory where it can store files. Each
    file is uniquely identified by an absolute file path, which lists all the directories
    beneath / (the top directory root) and the file.


    Each file has properties, such as its name, location, size, and date created.
    Each file is protected by a system of permissions that define whether only the
    user owner, the group owner, or anyone can access it and what each can do with
    it.


    You can create and delete files. You can examine and change the properties and
    permissions of a file from the desktop or from the command line. You can edit
    file contents using text editors. This chapter explains how to do the:


    +   * Examine and change file permissions

    * Examine and change owners and groups

    * Associate file types with applications

    * Find files

    * Create directories, files, and links

    * Copy, rename, move, and delete files and directories

    * Edit the contents of text files


    Chapter 10 discusses programs and applications. In particular, you find out how
    to install and update software on your Linux system.'
  merge: -1
  pgno: 206
- img_proc: true
  md: '# Chapter 10. Applications and Programs


    All information on Linux is organized into files. Programs and applications are
    no exception. Programs are files that contain instructions that Linux follows
    to perform tasks. Applications are one or more programs that perform work. The
    word processing document that you create is stored in a file. The word processing
    application that you use to create and store the file is also stored in a file
    program. Or more likely, many programs working together.


    A program can be quite simple, with one instruction that tells Linux to display
    "Hello World" on the screen. An application may be quite complex, such as a word
    processing application programs contain the instructions that tell Linux what
    to do when you click a button or type a word. The instructions may be complex,
    with many tasks being performed at once, but the principle is the same as the
    simple program that displays Hello World. The program contains instructions that
    Linux follows.


    This chapter discusses programs and applications. Information on running programs,
    starting applications, and managing software applications is included.'
  merge: -1
  pgno: 207
- img_proc: true
  md: '# Programs


    Programs are files containing instructions that the computer executes. However,
    computers require instructions in machine language, not in a language that humans
    use. The solution is interpreters and compilers translate a human-readable file
    into machine language that the computer can execute.


    Programming languages are the languages that humans use to write programs. Programming
    languages differ. Each has a detailed syntax that allows a compiler to recognize
    its instructions and convert them to machine language. Some popular languages
    for writing programs are C, C++, Java, and Perl.


    The file that contains the instructions in a programming language is called the
    source code. The source code is converted by a compiler or interpreter specific
    to the language. Interpreters convert the program and execute it immediately.
    Compilers save the program in machine language so that the program doesn''t have
    to be converted every time it runs. The saved program is a binary file (a file
    the computer understands), called the executable. Some compilers understand more
    than one language.


    Programs in executable files are run by typing the program name. The name includes
    the path. For instance, a program you write and compile in your own directory
    runs when you:


    ```

    ./programname

    ```


    Programmers will find an open source C and C++ compiler developed by GNU available
    on most Linux systems. A simple command that compiles a C program is:


    ```

    gcc -o myprogram myprogram.c

    ```


    The -o option provides a name for the executable file. The source code is in the
    file myprogram.c. After gcc compiles it, you can type ./myprogram to run the program.
    The compiler has many options. Type man gcc to see more information about the
    gcc compiler.


    Most Linux systems also include Perl and Python, two source languages. Many administrators
    use Perl to write programs to manage their Linux systems. Shell scripts are also
    frequently used by system administrators. Shell scripts, discussed in Chapter
    19, are programs containing Linux commands.


    Programs can''t execute unless their permissions include x for the account types
    that are to execute them. Even the owner can''t execute a program without x permissions.'
  merge: -1
  pgno: 208
- img_proc: true
  md: '# Linux Commands


    Linux commands are programs, developed by GNU or other projects, and included
    with the Linux distribution. You can see some Linux commands by typing:


    ```

    ls /bin

    ```


    The output includes many of the Linux commands you use. For instance, the `ls`
    command used above to show what''s in the bin directory runs a program stored
    in the bin directory, as shown in the output from the `ls` command. The commands
    are binary files. To see the file type, enter:


    ```

    file /bin/ls

    /bin/ls: ELF 32-bit LSB 80386 version...

    ```


    This is an executable. If you tried to display it on the screen with something
    like `cat /bin/ls`, the output would be garbage.


    You can run this program by typing `ls` at any command line. You don''t need to
    use the path because the program is on the system path. When you type any command
    at the command line, Linux searches the system path and executes the first program
    it finds that matches the command you typed. You can see the system path by typing:


    ```

    echo $PATH

    /usr/kerberos/bin:/usr/local/bin:/usr/bin:/bin:/usr/X11R6/bin:/home/janeet/bin

    ```


    The system path is a series of directory paths, separated by colons (:). Notice
    that the directories are named bin, which stands for binary. The name is not required,
    just custom. Different distributions use different paths. This is the path for
    a Fedora user account. The root account has a different path, directories containing
    system administration commands. The following is the path for a SuSE user account:


    ```

    [View full width]

    /home/janeet/bin:/usr/local/bin:/usr/bin:/usr/X11R6/bin:/usr/games:/gnome:/opt/ojde3/bin:/usr/lib/java/gre/bin

    ```


    You can add commands to your Linux system by copying a program into any directory
    on the system path! You can add commands you write or yourself or commands you
    download from the Internet. It is customary to put commands added by the user
    in /usr/local/bin or /usr/bin. SuSE provides a default bin directory in the home
    directory that can be used for commands you want to run yourself or perhaps only
    to a few other accounts.'
  merge: -1
