- img_proc: true
  md: '# # Live CDs


    A Live CD is a CD that can run a computer. You can boot from the CD and have a
    working Linux computer, running from the CD. You can use the Linux tools and applications
    without installing anything on the hard disk. The Live CD can contain many applications
    by using on-the-fly decompression techniques. Linux on the Live CDs can access
    floppy disk and CD drives, printers, and other hardware. Live CDs are used for
    the following:


    +   - Evaluation: You can try Linux. You can see how it works/or learn to use
    it without installing anything on your hard disk.

    - Testing: You can test a computer with Linux before purchasing it.

    - Portability: You can move your Linux from computer to computer easily. You can
    bring your Linux with you and use it wherever there''s a computer. You can use
    your office application wherever you are. Or you can use the Live CD for demonstration
    or training purposes.


    Some Live CDs include installation software. You can boot Linux from the CD and
    try it out. Then, if you like it, you can install it on your hard disk from the
    running Linux.


    The following are some popular Live CDs:


    +   - Knoppix: A Debian-based distribution with excellent hardware detection.
    Knoppix provides the KDE desktop and many applications, including Konqueror Web
    browser, OpenOffice, GIMP, and many more. With decompression, Knoppix holds 2GB
    of software. www.knoppix.com (Typing www.knoppix.org gets you a German page.)

    - Mandrake Move: Provides a complete Mandrake Linux system on a bootable CD. Applications
    enable you to create and edit office documents, listen to music, access the Internet,
    and more. Data and configuration files can be stored on a USB key for use with
    the CD. In addition, Mandrake Move enables you to read data from another CD. www.mandrakesoft.com/products/mandrakemove

    - MEPIS: Provides a bootable CD as the installer. You can boot and run MEPIS from
    the CD to try it out. The bootable CD includes an installer, so you can install
    Linux onto your hard disk from the same CD. MEPIS was the first to combine a Live
    CD with an installer. www.MEpis.org'
  merge: -1
