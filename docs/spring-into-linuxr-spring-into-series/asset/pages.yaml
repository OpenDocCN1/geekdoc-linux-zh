  md: "# # If Statements\n\nIf statements test conditions and execute commands when\
    \ the condition is true. The if statement has the following general format:\n\n\
    ```\nif [ condition ]\nthen\n  commands\nelif [ condition ]\nthen\n  commands\n\
    else\n  commands\nfi\n```\n\nIf statements begins with if and ends with fi (if\
    \ spelled backward). All three parts are not required. Only the if section is\
    \ required. The elif (elseif) and the else sections are optional. Also, notice\
    \ that the if section and the elif section start with then, but the else section\
    \ does not. You can use more than one elif section, but only one if and else section\
    \ is allowed. An if statement can be as simple as:\n\n```\nif [ $x -eq 1 ]\nthen\n\
    \  echo Hello\nfi\n```\n\nA more complex statement is:\n\n```\nif [ $day = \"\
    Saturday\" -o $day = \"Sunday\" ]\nthen\n  echo Sleep in\nelif [ $day = \"Monday\"\
    \ ]\nthen\n  echo Call in sick\nelse\n  echo Go to work\nfi\n```\n\nYou can nest\
    \ if statements inside of if statements, as follows:\n\n```\nif [ $city = \"Miami\"\
    \ ]\nthen\n```"
