  md: '# Preface


    I am not only a writer of technical books, I am also a consumer of technical books.
    I like learning from books. All the information is pulled together for me, arranged
    in a logical learning sequence by someone who understands the subject. I learn
    much faster when a good book on the subject is available. This applies to all
    areas of my life, not just computing. I have a library that includes how-to books
    for everything I have ever tried to dofrom meditating to playing the guitar to
    fixing my dryer to growing herbs.


    This book is the I needed when I was learning Linux. The essential information
    is inside, organized into compact chunsa lot of information in a small space.
    This book is too small to be a good doorstop or stepping stool to the top shelf,
    but just right for getting up and productive with Linux in no time at all.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Who Should Read This Book?


    The book is meant for computer users who are new to Linux. Your understanding
    of computer concepts and experience with another operating system allows you to
    grasp the Linux information quickly. You do not need to be told how to press the
    power switch. You are way beyond this. You can get your work done on Windows (or
    Mac or UNIX); you just need a quick start guide for working on Linux.


    It is not impossible to learn Linux from this book without a background in computersjust
    difficult. The book assumes an understanding of concepts and computer use that
    you may not possess. However, if you appreciate a book that assumes you can understand
    quickly and delivers information in a compact form, without distractions and repetitive
    explanations, give this one a try. It might work for you.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# How Is This Book Organized?


    This book is organized in 19 chapters. Each chapter focuses on a topic, providing
    an overview and how-information. The chapters are as follows:


    +   - **Chapter 1**, Understanding Open Source Software: Describes open source
    beliefs and practices. How they differ from the beliefs and practices prevalent
    with proprietary software.

    - **Chapter 2**, Choosing a Linux Distribution: Provides the information needed
    to choose among the many Linux flavors.

    - **Chapter 3**, Getting Ready to Install Linux: Instructions for preparing your
    computer for a Linux install.

    - **Chapter 4**, **Installation**: Installation steps.

    - **Chapter 5**, Interacting with Linux: How to get work done using the two major
    desktops KDE and GNOME.

    - **Chapter 6**, Using Your Desktop: How to enter commands directly into Linux,
    without the desktop.

    - **Chapter 8**, **Linux Accounts**: No work can be done on a Linux system without
    a Linux account. This chapter describes how to create accounts and associated
    information, as with passwords, owners, groups, and so forth.

    - **Chapter 9**, File Management: How to create, copy, rename, delete, and otherwise
    manage Linux files.

    - **Chapter 10**, Applications and Programs: How to download, install, and run
    Linux applications and programs.

    - **Chapter 11**, Word Processing: How to use the OpenOffice word processing application.

    - **Chapter 12**, Spreadsheets: How to use the OpenOffice spreadsheet application.

    - **Chapter 13**, Graphics: How to create, edit, and manipulate different types
    of graphics files.

    - **Chapter 14**, Printing: How to set up and use a printer on Linux.

    - **Chapter 15**, The Internet: How to access and browse the Internet.

    - **Chapter 16**, Multimedia: How to play sound and video files on Linux.

    - **Chapter 17**, Email, Messaging, and News: How to communicate with other people
    over the Internet.

    - **Chapter 18**, Editing Text Files: How to create and edit text files, such
    as HTML files, program source code, and Linux configuration files.

    - **Chapter 19**, Shell Scripts: How to write and use shell scripts.'
