  md: '# Summary


    Text files are files that contain only text characters, with no formatting information.
    HTML files, program source code, and many Linux configuration files are text files.
    Although you can edit text files with a word processor, it''s generally simpler
    to use a text editor application that has only the features necessary to edit
    text.


    This chapter provides instructions for using two editors: Kate, a GUI editor;
    and vi, a command-line editor. Instructions are provided for basic editing, such
    as deleting and inserting text. Some features useful for programmers are also
    described.


    Kate is very similar to Notepad. Editing in Kate will feel familiar to Windows
    users. The methods of inserting, deleting, opening files, and saving files are
    similar. vi, however, is a command-line editor. Its procedures for inserting,
    deleting, and other editing of text will be new to many users. Because it''s unfamiliar,
    a sample editing session is provided for vi.


    One type of text file that you create and edit with a text editor is a program
    or shell script. Each line is an instruction to be executed by the computer. A
    useful type of script is a shell script. You can write a script that contains
    Linux commands, executed one by one when the script is run. Chapter 19 describes
    how to write shell scripts.'
  merge: -1
  pgno: 386
- img_proc: true
  md: '# Chapter 19. Shell Scripts


    Shell scripts are text files containing commands. The use of commands at the command-line
    interface is explained in Chapter 7, including their syntax and capabilities.
    The same commands, using the syntax, can be stored in a shell script. When you
    run the script, the commands are executed, by one, starting from the beginning,
    just as if you were typing them directly into the shell, one by one. Often you
    can save yourself a great deal of typing by putting commands you enter frequently
    into shell scripts.


    Shell scripts are often used to perform routine system maintenance tasks. For
    instance, you might write a shell script that backs up specific files to another
    computer on your network. Or you might want to rename all the files in your directory.
    Or you might want to edit all the files on your company Web site by changing your
    company address from an old address to a new address.


    This chapter explains how to write shell scripts. This chapter is an introduction
    to shell scripts that doesn''t begin to show the advanced power provided by shell
    scripts. You can learn how to create uncomplicated shell scripts for everyday
    tasks; if you want to do advanced shell scripting, however, you need to read a
    more complete treatment of the subject. Complete books are written about shell
    scripting.


    Commands are not explained in this chapter. Chapter 7 explains the syntax of using
    commands. Appendix B provides a reference, with details, of the most useful commands.'
  merge: -1
  pgno: 387
- img_proc: true
  md: '# A Simple Shell Script


    A shell script is a text file containing a series of commands that execute in
    sequence when the script is run. Shell scripts allow you to run several commands
    at once. Create the following simple shell script in a text editor (using text
    text editors is discussed in Chapter 18) and save it with the name dir2file:


    ```

    #!/bin/bash

    # Script Name: dir2file - A simple shell script that saves a directory listing
    in a file.

    ls -l dirlist

    echo Directory is saved

    ```


    The first two lines are not commands, so they don''t run. The lines begin with
    a pound sign (#), also called a hash mark, which don''t execute. The first line
    tells Linux what program to use to run this script. In this case, the line (often
    called the shebang) calls the Bash shell. The first line of a Perl script would
    call Perl, rather than the shell. In this case, you could run the program without
    the shebang, b the script is clearer with the line.


    The second line is a comment. It is, to note. The shell ignores comments.


    The last two lines are commands that the shell script execute. The lines are exactly
    the same commands that you would enter out. Chapter 7 explains how to use the
    command-line interface. Appendix B is a reference of commands. In this script,
    the ls and the echo command are used. The ls command saves a long listing of the
    directory in a file named dirlist. When the ls finishes, the echo command displays
    "Directory is saved" on the screen.


    The script must have execute permissions in order to run. (Permissions are discussed
    in Chapter 9.) The following commands change and check the file permission, giving
    execute permission to the file owner:


    ```

    ls -l dir2file

    rw-r--r-- 1 janet   79 2005-01-09 15:57 dir2file

    chmod u+x dir2file

    ls -l dir2file

    rw-r--r-- 1 janet   79 2005-01-09 15:59 dir2file

    ```


    Now you can run the program as follows and see the output.


    ```

    ./dir2file

    Directory is saved

    ```


    If you list your directory, now you see file dirlist in your directory. If you
    display the file dirlist to the screen (cat dirlist), you see that it contains
    the output of ls -l.'
  merge: -1
  pgno: 388
