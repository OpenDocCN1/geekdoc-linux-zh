  md: '# Configuring Mozilla Email


    Many email actions can be configured. Mozilla provides two different types of
    configuration. One group of settings is for the software in general. Another group
    of settings is specific to the email account you are using.


    To change settings for a specific account, highlight the account in the sidebar.
    Click Edit. Select Mail & Newsgroup Account Settings. Some settings you can change
    are:


    +   - Signature: Content that is added to every outgoing message. Create a text
    file containing the signature for every message. Highlight an account. Check "Attach
    this signature." The path to the signature file or Choose to browse to the file.


    +   - Server Names: Change the name of the incoming server. Click Server Settings.


    +   - Downloads: Set how often messages are fetched from the incoming server.
    Default is when you open the software and every 10 minutes. Click Server Settings.


    +   - Return Receipts: You can customize return receipts for this account. Specify
    whether to request them and what to do with receipt requests the account receives.
    Click Return Receipts.


    To change settings for the email software for all accounts, click Edit and select
    Preferences. Double-click Mail & Newsgroups to expand the category. Some settings
    you can change are:


    +   - Window Layout: Choose between two layouts, as follows:


    ![](img/8fd2e743227b42de3b4152272123250b_347_0.png)


    +   - Spell Check: Check spelling of outgoing mail when you click Send. Opens
    a window when an error is detected that allows you to correct the spelling.


    +   - Address Autocomplete: When typing addresses, Mozilla matches your typing
    to entries in your address book and completes the address when it finds a match.
    Click Addressing.


    +   - Return Receipts: Specify whether to request them and what to do with receipt
    requests the account receives. Click Return Receipts.'
