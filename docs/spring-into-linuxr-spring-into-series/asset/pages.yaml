  md: '# Logging In


    To access your desktop, you must log in using a Linux account. When you power
    on your computer, the process goes as follows:


    +   1. The computer boots up.


    ![](img/8fd2e743227b42de3b4152272123250b_114_0.png)


    +   2. The computer prompts you to log in.


    +   3. You log in to an account, typing your password.


    +   4. The desktop displays.


    After the computer boots (Step 1), you see a login screen. The login screens for
    Fedora Core, Mandrake, and SuSE are shown in Figure 6-1.


    # Figure 6-1. Login screens.


    ![](img/8fd2e743227b42de3b4152272123250b_114_1.png)'
  merge: -1
  pgno: 114
- img_proc: true
  md: '![](img/8fd2e743227b42de3b4152272123250b_115_0.png)


    Notice that Mandrake and SuSE give you a choice of accounts. In this case, only
    one account (janet) is available. If more accounts were installed, they would
    also be on the login screen. Accounts discussed in Chapter 8.


    Select an account by clicking it. In SuSE, the account name appears in the Login
    field. Type the password in the Password field and click Go! to log in. In Mandrake,
    a second screen appears, as shown in Figure 6-2.


    # Figure 6-2. Second login screen for Mandrake.'
  merge: -1
  pgno: 115
- img_proc: true
  md: 'Many Linux do click password to log in.


    Fedora requires you to type the name of the account. When you type the account
    name and press <Enter>, the `username` field changes to the `password` field,
    asking for the password. Type the password and press <Enter> to log in.


    Many distributions allow you to select which desktop to use when you log in. Of
    course, you can only select among the desktops that you installed. KDE and GNOME
    are discussed in this book, but other desktops are available and were possibly
    installed by default during installation. For instance, notice in Figure 6-2 that
