  md: '# Printing


    Most printing is done using the application that created the file. The Print button
    in the application sends the file to the default printer. When you press the Print
    button, you see a window that looks very like the print window on Windows, where
    you can select a printer, pages to print, number of copies, and other options.


    The KDE desktop provides kprinter, an application that prints to printers or to
    PDF files. If you can''t find it in the main menu, select Run and type kprinter.
    In the window that opens, click Expand to see the window in Figure 14-5.


    # Figure 14-5. kprinter window.


    ![](img/8fd2e743227b42de3b4152272123250b_295_0.png)'
