  md: '# Creating Accounts for Mandrake


    Users must have an account to use Linux. A root account, often called the super
    user, is required. At least one other account is also required. Accounts are discussed
    in detail Chapter 8. The user account creation screen is shown in Figure 4-23.


    # Figure 4-23. Account creation screen for Mandrake 10.


    ![](img/8fd2e743227b42de3b4152272123250b_83_0.png)


    Mandrake first creates the root account. The screen to create the root account
    does not include the Real name and User name fields, because the account is necessarily
    named root. Type a password for the root account. Type the same password twice,
    to be sure that you don''t make a mistake. It''s extremely important that you
    remember this password. You can''t make changes to your Linux system without the
    root account.


    Select your passwords carefully to maintain the security of your system. Passwords
    should be at least 8 characters, a mix of letters and numerals, and should not
    be words that are found in the dictionary.


    After you create the root account, you must create at least one user account for
    your own use. You can create as many accounts as you want. You should create an
    account for each person who is going to use the computer.


    Pressing Accept displays the screen again so you can enter another user account.
    When you created all the accounts you need, press Next.'
