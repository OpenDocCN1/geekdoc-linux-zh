  md: '# # Organizing the Desktop


    Your desktop can be organized to suit your individual work style. Quick access
    to applications is provided by icons on the desktop. Application icons on the
    panel provide access when the desktop is covered by open windows. Many useful
    utilities can reside on the panel, as the clock and an icon minimizes all windows
    at once. Icons for locations, such as Home, or files, such as also hard


    You can drag applications and locations onto the desktop or panel. Find the application
    and highlight it on the menu. Open the directory. Use the mouse to drag the application
    or directory to the desired location.


    In addition, a menu of items specifically for the panel is available. Right-click
    directly on the menu andselect Add to panel to see such items as Accessories or
    Amusements. Highlight the desired item on the menu or drag it onto the panel.


    You can drag the icons on your desktop wherever you want. You can arrange all
    icons at once from the desktop menu. In GNOME, right-click the desktop and select
    Clean Up by Name to arrange the icons in alphabetical order starting from the
    upper-left. From the KDE desktop menu, select Icons to line them vertically or
    horizontally or sort them by name, size, or type.


    To move objects on the panel, right-click the icon and select Move. Drag the object
    to its new panel using the mouse. On the KDE panel, objects, such as the taskbar
    and the pager, are moved specific to the object.


    If you click the small arrow to the left of the taskbar, a menu specific to the
    entire taskbar opens with items you can select, including Move Taskbar.


    # Figure 6-15. Section of KDE panel.


    ![](img/8fd2e743227b42de3b4152272123250b_136_0.png)'
  merge: -1
