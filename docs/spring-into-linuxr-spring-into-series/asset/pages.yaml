  md: '# Red Hat/Fedora


    Even if you have no experience with Linux, you''ve probably heard of Red Hatmost
    well-known commercial version of Linux. Red Hat has recently undergone organizational
    changes. Free Red Hat Linux has been replaced by Fedora Core, released by the
    Fedora project, which is initiated, supported, and contributed by Red Hat. Fedora
    is an open source developer project with testing, participation, and feedback.
    Information on Fedora is available at fedhat.com. Red Hat now only sells Red Hat
    Enterprise commercial software for organization-wide use, emphasizing stability,
    reliability, and comfort.


    You can''t buy Fedora from Red Hat. Red Hat only sells Red Hat Enterprise, a commercial
    version of Linux. To obtain Fedora, you download files from the Fedora Project
    site: fedora.redhat.com/download/. The files are images of CDs, which you can
    write to CD or install disk. Installation is discussed in Chapter 4. However,
    the files are large and downloading over a dial-up connection is painful. You
    can purchase installation CDs through various vendors. The vendors don''t provide
    a nice boxed of software and manuals, just as you receive when you purchase Windows
    or a commercial distribution of Linux; they list of vendors is available at fed.redhat.com/download/vendors.html.


    Fedora features include the following:


    +   * **Multiple desktops:** Provides both GNOME and KDE. KDE is the default.

    * **Software updates:** Red Hat provides up2date that keeps track of your current
    versions and automatically installs updates for you when they become available.

    * **System utilities:** Provides system tools developed by the Fedora project.
    Tools have an easy-to-use graphical interface, as well as a text-based interface.
    The names begin with redhat-config-network.

    * **Installation procedure:** Provides either graphical or text interface for
    the installation procedure, using its own installer Anaconda. The installation
    procedure detects and configures the system hardware. Red provides Kickstart,
    a utility that allows scripted, unattended installation useful for system administrators.

    * **Well supported:** One of the best supported distributions. Red Hat maintained
    a mailing list at www.redhat.com/mailing/listinfo/fedora-list. Also try the Fedora
    Forum at fedforum.org and the Fedora Forum on Questions at www.linuxquestions.org/questions/forumid=35.'
  merge: -1
