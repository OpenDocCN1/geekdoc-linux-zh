  md: '# Configuring the Installed SuSE System


    The next screens add network connections and user accounts to your Linux system:


    +   1. Network Settings: Suggested settings are shown in a screen similar to the
    summary screen in Figure 4-39. You can change the settings by clicking Change.
    If you are on a company network, the network administrator can tell you which
    settings to use. Most DSL or cable modem connections use DHCP. If you don''t know
    which settings to use, accept the SuSE suggestions or check Configuration. These
    settings can be changed later, after your system is installed.

    2. Network Configuration: If you set up a network connection in screen 1, the
    network is configured, displaying its progress in a screen with a status bar.

    3. Network Test: Tests the network. If the connection is okay, any available software
    updates are downloaded.

