  md: '# # Applications


    Applications are programs. Most of the applications you use for your work are
    large, complex applications like word processors, spreadsheets, or databases.
    Many applications are installed when your system is installed. You can install
    a new application when you need it. Installing applications is discussed later
    in this chapter.


    Different Linux distributions include different software, hundreds or thousands
    of applications. The distribution defines a default set of software to install.
    You can modify the set during installation, installing more, fewer, or different
    applications.


    Most distributions install a set of common applications. The Linux commands are
    installed. Utilities for administering your system are installed. A desktop is
    usually installed. Certain types of applications are installed, although different
    distributions may select different specific applications. For instance, all applications
    will install a text editor, but might install different text editors. Most distributions
    include a word processor, usually OpenOffice, and a graphics application, usually
    Gimp.


    An application is a program, or group of programs, so it''s started by typing
    a program name. When you click a menu item or an icon to start an application,
    the program name is sent to Linux. For instance, when you click OpenOffice Writer
    on the menu, oowriter, the name of the program, is sent to Linux.


    You can add or remove applications on the main menu. Right-click the main menu
    icon and select Menu Editor. The window on the right displays, with the current
    menu in the left pane.'
