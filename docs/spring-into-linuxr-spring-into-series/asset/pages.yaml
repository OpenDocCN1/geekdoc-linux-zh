    reasons, the password does not display on the screen.

    6. System Configuration: Configuration is written to the system, displaying its
    progress in a status bar.

    7. Release Notes: Displays release notes for you to read.

    8. Hardware Configuration: Suggested settings are shown in a screen similar to
    the summary screen in Figure 4-31. You can change the settings by clicking the
