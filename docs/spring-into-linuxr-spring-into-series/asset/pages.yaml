- img_proc: true
  md: 'pathname specifies the directory where the search should start. It''s common
    to use dot to mean the current directory and subdirectories or / to search the
    entire system. conditions sets the search parameters. Many conditions are available.
    You can use more than one in a command. Some conditions are shown in Table 9-1.


    # Table 9-1. Parameters for Use with the find Command


    | Parameter | Means | Example |

    | --- | --- | --- |

    | -print | | Display the matches on the screen. | -print |

    | -name filename | Pattern to match filenames. | find . -name "**" |

    | -group name | Files owned by the specified group. | find . -group janet |

    | -user name | Files owned by the user. | find . -user janet |

    | -atime +n/-n/n | Last access time is more than, less, or exactly n days ago.
    | find . -atime +5 |

    | -ctime +n/-n/n | Last changed time is more than, less, or exactly n days ago.
    | find . -ctime -5 |

    | -size nc | Files n characters long. | find . -size 100c |

    | -empty | Files that are empty. | -empty |


    For example, the following command searches the entire file system for all files
    beginning with, owned by janet, and accessed less than 3 days ago.


    ```

    find /name "chapter*" -user janet -atime -3

    ```


    The grep command searches the contents of files. It has the general format:


    ```

    grep options pattern files

    ```


    grep searches the contents of the specified files for the pattern. It outputs
    any matches found. The options specify the operation of grep, such as -c, which
    instructs grep to output a counted of matched lines, rather than the entire line,
    and -v, which outputs the lines that don''t match, rather than the lines that
    do. The pattern can be a string of characters or a regular expression used to
    match strings, such as all that begin with uppercase A or all lines that contain
    a number. Regular expressions are explained in Appendix A. The grep command is
    explained in more detail in Chapter 7 and Appendix B.'
