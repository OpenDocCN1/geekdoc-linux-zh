  md: '# # Diagramming with Dia


    Dia is designed for diagramming, such as organizational charts or network diagrams.
    Dia creates graphic images with shapes and lines, similar to Visio. You insert
    shapes and connect them with lines.


    Dia may be available on the main menu. In Fedora, it is available in the graphics
    submenu. If it''s not on your system, you can download it from www.gnome.org/projects/dia.
