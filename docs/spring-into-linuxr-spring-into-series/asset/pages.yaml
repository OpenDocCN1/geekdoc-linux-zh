  md: '# Summary


    Some thought, and perhaps some work, is necessary to prepare for Linux.


    +   - Check your hardware to be sure your CPU is powerful enough, that you have
    enough memory, and that you have enough hard disk space. You also need to check
    that your hardware, such as video card, monitor, modem, printer, etc. are compatible
    with Linux.

    - Obtain the Linux distribution you plan to install. Either purchase or download
    it.

    - Decide whether to install Linux alone on your computer or together with another
    operating system, such as Windows. You can install each operating system on a
    separate section of the hard drive, called a partition.

    - Prepare your hard disk for the system you plan to install. If you plan to install
    Linux alongside Windows, Windows needs to be installed first. Use Windows to examine
    your hard disk to see whether a partition exists suitable for installing Linux.
    If not, you can make room for Linux installation or during installation.

    - Set up your computer so that it boots from the CD drive.


    When your computer is ready for Linux, install using the instructions in Chapter
