  md: '# Booting from the CD or from a Floppy


    To install the CDs that you have purchased/written, you need to boot from your
    CD drive. Most computers are set up so that they try to boot in the following
    order:


    +   1. **From the floppy**: If a bootable disk is in the floppy drive, the computer
    boots from the disk.

    2. **From the CD drive**: If a bootable CD is in the drive, the computer boots
    from the CD.

    3. **From the hard drive**: If no floppy or CD is found, the computer attempts
    to boot from the hard drive.


    Test your computer boots from the CD by putting a CD in the drive and turning
    on the computer. The boot order may be different, with the hard drive coming before
    the CD. The boot order can be changed using the setup program. The manual for
    your motherboard explains how to use the setup program. In general, you enter
    the motherboard setup when your computer first boots by pressing a specific key,
    such as the Del. Instructions, as "Press Del to enter Setup," display on the screen.
    Enter the boot options menu and change the order, usually using the tab or arrow
    keys. To save the new settings when leaving the setup program.


    Some older computers or laptops may refuse to boot from the CD, requiring you
    to make a boot floppy to start the installation. Most distributions provide a
    method for making a boot floppy on a Windows system; the procedure may differ,
    however, so read the documentation for information. To make a boot floppy for
    Mandrake:


    +   1. Start itibaren. The program is located on the first CD in the directory
    dosutils. Click the program or its name in a command prompt window. A user interface
    appears after a short wait.


    +   2. Select Image File. In most cases, the image file should be ..\image\cdrom.img.


    +   3. Put a floppy disk into the floppy drive.


    +   4. Make sure the floppy disk selected is correct. \A: is usually correct.


    +   5. Click Write.


    After creating the floppy, you can boot your computer with the floppy, which starts
    the installation. The installation will then continue using the CDs.


    # NOTE


    Fedora Core 1 provides a very similar procedure. However, starting with Fedora
    2, the dosutils directory is no longer provided on the CDs.'
