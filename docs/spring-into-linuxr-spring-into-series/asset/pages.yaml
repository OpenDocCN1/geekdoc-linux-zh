  md: '# Saving and Printing


    OpenOffice Calc uses XML to store its documents. XML is a widely used, standard
    format for storing information in an application-independent format. An OpenOffice
    Calc spreadsheet is stored in a file with an .ods extension. The file, however,
    is not a zip archive containing several files required for managing an XML document.
    An .xml file cannot be opened in another Office application.


    You can save your document as other types of files:


    +   - Microsoft Excel: All versions of Excel back to Excel 5.0. All sheets are
    saved. (.xls extension)


    +   - StarCalc: Spreadsheet application published by Sun. OpenOffice evolved from
    StarOffice. (.sdc extension)


    +   - dBASE: Spreadsheet data is formatted as a dBASE file. (.dbf extension)


    +   - Data Interchange Format: A format for exchanging files between spreadsheet
    applications. (.dif extension)


    +   - SYLK: A text file commonly used to exchange tabular, spreadsheet type data
    between spreadsheet applications. (.slk extension)


    +   - Text: File that contains only the content, without any formatting. (.txt
    extension)


    +   - HTML: File that contains HTML code (.html extension)


    Calc can read Excel spreadsheets. Although Calc can open the document, some advanced
    or complex elements may not be converted correctly. The simpler the document,
    the more likely it is to convert without problem.


    You can turn on a view that shows where your pages break. Click View Select Page
    Break Preview. Pages start new when you print. You can insert manual page breaks
    from the menu.


    You can print part of your spreadsheet. Select the cells to print, click Format,
    and select Page Ranges->Define. You can print a row or column of labels on each
    page. Highlight the row or column to be repeated. Click Insert and select Names->Define.
    Type a name for the highlighted area and click Add. Select the name you added
    to the list box, click More, and check "Repeat Column" or "Repeat Row."


    You can prevent the printing of cells. Highlight the cells. Right-click a highlighted
    cell and select Format Cells. Click the Cell Protection tab. Click "Hide when
    printing."


    You can save your documents in PDF format. Click File. Export as PDF.'
  merge: -1
  pgno: 260
- img_proc: true
  md: '# Summary


    Spreadsheet applications are widely used. Calc is the spreadsheet application
    in OpenOffice. It has functionality equal to Microsoft Excel, the leading spreadsheet
    application.


    OpenOffice Calc uses XML to store its documents. XML is a widely used, standard
    format for storing information in an application-independent format. OpenOffice
    Calc can read Excel files. Excel can''t read OpenOffice Calc files in XML format,
    but OpenOffice Calc can save documents in Excel format, so that Excel can open
    them. Calc also reads and writes documents in formats, such as HTML and SYLK,
    that are general formats, allowing the exchange of spreadsheets among applications.


    This chapter describes how to:


    +   * Create a spreadsheet

    * Format cells and pages

    * Edit a spreadsheet

    * Use formulas and functions

    * Save and print spreadsheets


    The next chapter discusses the use of graphics on Linux, including drawing, presentation
    graphics, and pictures. Drawing and presentation graphics are created using the
    OpenOffice applications Impress and Draw.'
  merge: -1
  pgno: 261
- img_proc: true
  md: '# Chapter 13. Graphics


    Linux has graphics tools for the most common needs:


    +   - **Pictures**: Applications can create and edit graphics files containing
    digital images. You can create the pictures in the graphic application or you
    can edit a picture contained in another file. For instance, you can edit a picture
    taken with a digital camera or a scanner. On Linux, the most powerful, full-featured
    application for creating or editing pictures is the GIMP (GNU Image Management
    Program). The GIMP offers similar functionality to Photoshop.

    - **Diagrams**: Drawings are comprised of shapes and lines connecting the shapes.
    Organizational charts and network diagrams are composed of shapes and lines. Dia
    is a diagramming program, similar to Visio.

    - **Drawings**: Drawings are line art, usually just black and white. Cartoons
    and logos are commonly made with a drawing application. OpenOffice provides an
    called Draw that allows you to create and edit drawings. You can draw directly
    in OpenOffice documents, as described in Chapter 11. Or, you can export drawings
    made using Draw in general graphics formats that can be used by other graphics
    applications.

    - **Presentation Graphics**: Creating slides that accompany talks and presentations
    is a common use of graphics. OpenOffice provides the Impress application for creating
    slides, comparable to using PowerPoint in MS Office.


    The source of your graphics can be original art or drawings that you create. It
    can also be photographs that you take yourself. If you are using art or photographs
    originated by someone else, you need to be sure you can legally use the picture.
    Pictures are copyrighted by default and can''t be used without permission.


    Archives of pictures are available on the Web. Some pictures need to be purchased;
    some free. You need to read the information accompanying any pictures you wish
    to use. If explicit permission is not provided for public use, you need to get
    specific permission from the copyright owner.'
  merge: -1
  pgno: 262
- img_proc: true
  md: '# Graphics File Formats


    Graphics files contain information that describes images. An application must
    be able to interpret graphics formats in order to read or display a graphics file.
    A text editor or a word processing program can''t correctly open a graphics file
    to produce a picture, although you can insert graphics files into OpenOffice documents.


    The information stored in a graphics file can be in one of several formats, with
    different purposes. Usually the file has an extension that identifies the type
    of format. Graphics applications save files with the appropriate extension. However,
    because Linux recognizes file types by information inside the file, rather than
    by the extension, when using a Linux application, you might see a message stating
    that the file extension does not match the file format. Some common formats are
    shown in Table 13-1.


    # Table 13-1. Graphics File Formats


    | Ext | Name | Used for | Advantages/Disadvantages |

    | --- | --- | --- | --- |

    | .bmp | MS Windows bitmap format | MS Windows graphics | Recognized by most Windows
    applications. |

    | .gif | Graphics Interchange | Web page images: line drawings, cartoons | Better
    quality than .jpg for images 256 or fewer colors. Used for animated graphics.
    |

    | .jpg | Format Joint Photographic Experts Group Portable | Most used for Web
    page images: photographs, art | Better quality for photographs than .gif. Smaller
    size than .png. |

    | .png | Network Graphics | General graphic images; recognized by browsers | Newer
    format designed to replace .gif. A universal format with no patent restrictions.
    Smaller size than .gif. Better transparency support. No animation support |

    | .tif | Tagged-Image File Format | Popular for graphics exchanged between operating
    systems | Early type that was designed to be hardware and OS independent. The
    new .png format is better suited to exchange in many environments. |


    You can convert files from one format to another. You can read a file in an application
    and use Save to save the file in a different format. If you want to convert quickly,
    without editing, use the convert command at the command line. For example, to
    convert an existing .gif file to a .jpg file, use:'
  merge: -1
  pgno: 263
- img_proc: true
  md: '```

    convert rose.gif rose.jpg

    ```


    # BBL


    PREV NEXT'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# Viewing Graphics Files


    Image can only be displayed by applications that can interpret the information
    in a graphics file. The application must understand the specific format the graphic
    file is stored in. An application may understand .jpg files, but not .bmp files.


    Konqueror can display most graphics formats. Konqueror can display thumbnails
    of the graphics files when it displays the files in a directory. Thumbnails are
    small versions of the image. To configure Konqueror to display thumbnails, check
    View and select Preview to see the submenu shown on the right. Select Show Previews,
    check or uncheck the types of previews you want to see. For graphics thumbnails,
    check Pictures and Images.


    ![](img/8fd2e743227b42de3b4152272123250b_265_0.png)


    With previews on, thumbnails of most graphics file display, but not all. For instance,
    thumbnails of .bmp files and .tif files are not shown. However, this doesn''t
    mean that Konqueror can''t render the graphics format. If you double-click the
    file for a .bmp or .tif file, the image displays in the Konqueror window.


    Graphics file extensions are associated with applications, as described in Chapter
    9. To see which application is associated with a particular file type, highlight
    a file with the extension, right-click, and select Edit File Type. You can see,
    and change, the application that opens the file with the given extension.


    Konqueror can interpret most graphics types, but not all. For instance, Konqueror
    can''t interpret .svg files, a graphics file type that uses XML. If you double-click
    an .svg icon, it opens in the application associated with the .svg file type,
    usually sodipodi.'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# # Scanning Documents


    If you have a scanner, you can scan documents in Linux. You can scan two types
    of documents:


    +   - **Images**: A document is scanned and stored in a graphics file format.
    The image must be viewed with software that can display graphics. The image is
    a picture of the document.

    - **Text**: A document that contains text can be converted into a text document.
    Using a process called optical character recognition (OCR), the characters that
    are scanned are read as letters and stored in a text file. OCR doesn''t get the
    100% correct. Its accuracy depends on the quality of the document being scanned.
    However, if you need to edit a document, it''s often faster to scan and edit the
    OCR errors than to type the document from scratch.


    Scanning on Linux, an open source raster image scan database of scanners that
    is an official part of the KDE Graphics Package. Kooka uses the SANE (Scanner
    Access Now Easy) library. Kooka provides OCR, as well as scanning documents in
    image format.


    The SANE website allows you to search by manufacturer and model to determine whether
    the scanner is supported (www.sane-project.org/cgi-bin/driver.pl). If possible,
    check for scanner support before starting a scan.


    If you want to use OCR on your scanner, additional software is required. You may
    need to install it. Check your distribution software for a package called. If
    you can''t find it on your system or your installation CDs, you can install a
    package from jocr.sourceforge.net. Chapter 10 for information on installing packages.


    Start Kooka, in the graphics or multimedia submenus, or select Run and type kooka.
    When Kooka starts, it scans your system for scanners and provides a list of scanners
    found. Select the scanner you want to use.


    When Kooka is open, look at the bottom-left section for your scanner settings.
    What you can change on the scanner you are using. You can usually set color and
    resolution and other options. You may have experiment with settings to obtain
    the best scan. Higher resolution can improve the image, but can result in large
    image files. The default is 72 for a scanner display, for Web images. However,
    if the document is text that you want to transcribe using OCR, choose a higher
    resolution.


    Preview the picture first. Click Scan when the document is in the scanner. When
    it''s been scanned, click the Preview in the image preview view, you can select
    a section of the picture to scan, rather than the whole picture. Select the section
    to scan with the mouse. Click ImageCanvas and select Create from selection. When
    you are satisfied with the preview, click Final Scan.


    When the final scan is complete, a window (on the right) opens where you can select
    the graphics format for the image. A description of a format displays when you
    highlight a format from the list box.'
  merge: -1
  pgno: 266
- img_proc: true
  md: '# Kooka Save Assistant - Kooka


    ![](img/8fd2e743227b42de3b4152272123250b_267_0.png)


    If you check the "Don''t ask again" box below the list box, Kooka will save all
    future images in the selected format. Click the format in the future, click Settings
    and select Configure Kooka->Save Image->Always show memory assistant.


    Click OK when you have selected the desired format.


    The final image displays in the right section of the Kooka window. Right-click
    the image to see View Options, such as Scale to zoom, or Rotate Image.


    You can click the Gallery tab to see a list of the images you have scanned. When
    you are ready to save a scanned image, right-click its name in the gallery and
    select Save Image.


    If the image you scanned is a document that you want to transcribe using OCR,
    click ImageCanvas and select OCR image. A window allows you to change some settings
    details. Again, you may need to experiment to get the best results. You can start
    with the defaults. Click OCR. The process may take a little time. When it''s finished,
    a window showing the output from the OCR process, with an editing window appears.
    You can try different settings for more accurate results.


    When you are satisfied with the OCR output, click Open in Kate. Kate is a KDE
    text editor, described in Chapter 18. Kate can be used to edit the file if necessary,
    including checking the file with the spell checker, useful for finding the OCR
    errors in the file. You can save the file from Kate as a text file. You can open
    it in any text editor or word processor for further use or editing.'
