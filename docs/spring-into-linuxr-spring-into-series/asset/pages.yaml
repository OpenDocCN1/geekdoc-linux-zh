  md: '# Spam


    Spam, called junk mail by Mozilla, is unsolicited mail that shows up in your mailbox.
    Most people prefer not to receive spam. However, most people prefer spam to not
    receiving legitimate mail. Consequently, spam filters must balance between letting
    too much mail through, missing some spam, and not enough mail through, thereby
    identifying "real" as spam (false positives).


    Mozilla includes a Bayesian spam filter. This type of spam control looks at a
    sample of real mail and a sample of junk mail and uses statistical analysis of
    the contents of the messages to identify spam. Consequently, the more messages
    of junk/non-junk status it has, the better it gets at recognizing spam.


    The Mozilla mail controls must be "trained" before use. You should identify as
    large a sample of mail as possible. To mark the messages, highlight them. Click
    Message. Mark->as not junk. Junk mail is marked with a blue trash can. You can
    also mark mail as junk by clicking the round icon in the Junk column, something
    that can happen accidentally when you click a message to read it. Junk mail handles
    both junk and non messages to analyze.


    Junk mail controls, on the right, are opened by highlighting an account, clicking
    Tools and selecting Junk Mail Controls. Check or uncheck the box to enable junk
    mail handling.


    Junk Mail Controls

    Account: [jalade@eoni.com] [Junk Mail Log]

    Junk mail controls evaluate your incoming messages and identify those that are
    most likely to be junk mail, or unsolicited mail. A junk icon is displayed if
    the message is identified as junk.

    Junk mail controls can be fine-tuned using the Junk Mail toolbar button to mark
    junk messages appropriately.

    ☑ Enable mail controls

    ☑ Do not mark messages as junk mail if the sender is in my address book:

    Personal Address Book

    ☑ Moving messages determined to be junk mail to:

    ☑ "Junk" folder [jalade@eoni.com]

    ☐ Other: Junk on Local Folders

    ☑ Automatically delete junk messages older than 14 days from this folder

    ☐ When I manually mark messages as Junk:

    ☐ Move them to the "Junk" folder

    ☐ Delete them

    [OK] [Cancel] [Help]


    Check whether you want to mark mail as junk when it comes from a sender in your
    address book. Although junk mail may not come from a familiar address, a virus
    very well might mail itself from a familiar address.'
  merge: -1
