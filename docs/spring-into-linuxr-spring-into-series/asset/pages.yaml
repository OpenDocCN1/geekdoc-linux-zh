- img_proc: true
  md: '# # Installing Packages Using RPM


    RPM is a command-line utility that is included with almost all distributions.
    RPM maintains a database that keeps track of the packages and versions installed.
    If a package is not available on your distribution Web site, you can find and
    download it, described earlier in this chapter. After it''s downloaded, you can
    use the rpm commands to install the software.


    RPM includes the package name, version, and the type of machine. For instance,
    a MySQL database server rpm could be named MySQL-server-4.1.7-0.1386.rpm. It''s
    packaged for i386 machines, meaning almost any Intel or AMD computer. Download
    the package to the directory where RPMs are stored on your system.


    To install an RPM, change to the directory where the RPM file is stored and type:


    ```

    rpm -Uvh filename

    ```


    For instance:


    ```

    rpm -Uvh MySQL-server-4.1.7-0.1386.rpm

    ```


    RPM will tell you if the package is already installed. It will check the dependencies
    before it installs and display an error message for any missing dependencies,
    such as:


    ```

    Error: Failed dependencies: dependencypackagename >=5.3 needed by packageName

    ```


    The message means the package (packageName) is dependent on dependencypackagename,
    version 5.3 or newer. You need to download and install the missing package before
    you install your new package.


    Using the -U options installs or updates, whichever is appropriate. You can use
    an -i option for install all. The -v options results in informative output. The
    -h option results in a status report, a line of ***


    You can display information about packages by typing:


    ```

    rpm -qi packageName

    rpm -qip packageName

    (for installed packages)

    (for packages not installed)

    ```'
  merge: -1
