  md: '# Special Characters and Quotes


    Shell scripts can take advantage of the special meanings given to certain characters.
    Useful special characters are:


    +   * Represents any string of characters in a filename. Used alone, * results
    in a list of all filenames in the current directory, except filenames that begin
    with a dot.


    +   * Represents a single character in a filename. Using file? would result in
    a list of filenames containing file1, file3, and but not file10, file20, etc.


    +   * [...] A substitution list that contains a set of characters to avoid. For
    instance, if you used file[xyz], the resulting list would include filex and filey,
    but not fileq.


    +   * A substitution list that contains a set of characters to avoid. For instance,
    the list generated using file[xyz] would include file and filet, but not filex
    orz.


    +   $ Sign the beginning of a variable name.


    You can turn off the meaning of special characters by enclosing them in quotes.
    Double quotes and single quotes have different effects. Double quotes turn off
    some special characters, but allow the substitution of variables values. Single
    quotes turn off all special characters, allowing no variable substitution, as
    shown by the following commands:


    ```

    city="San Diego"

    echo $city "$city" ''$city''

    San Diego San Diego $city

    ```


    You can see, the single quotes turn off the $ and the literal characters between
    the quotes. You can tell the shell to treat a special character as a literal by
    preceding it with a back slash, as follows:


    ```

    echo \$city

    $city

    ```'
  merge: -1
  pgno: 395
- img_proc: true
  md: '# Flow Control


    Flow execution in a script flows from the first line to the last. However, it''s
    possible to change the order of statement execution. The shell provides two types
    of commands that change the order of statement execution:


    +   - Conditional statements: The commands in a conditional statement execute
    only when a condition is found to be true. Some commands do not execute when the
    script runs because the condition under they execute never occurs. By executing
    statements only when certain conditions are met, the script provides more flexibility
    to respond to varying conditions. For instance, the script can delete junk files
    if today is Friday, but not if today is Monday.

    - The shell provides two conditional statements:


    +   - if statement: Tests one or more conditions. Executes commands when a condition
    is true. You can define alternate sections to execute when none of the conditions
    are true.

    - case statement: Sets up alternative sections in the case statement, each section
    containing a set of commands. A pattern is set for each section. The case statement
    tests a string. The case statement then executes the commands in the section where
    the string matches the section pattern.


    +   - Loops: The commands in a loop repeat. The commands can repeat as many times
    as needed. For instance, the script can process each file in a directory using
    the same commands. The commands repeat once for each file. Or, a loop can be set
    to repeat a number of times, such as 10 times.

    - The shell provides three useful looping statements:


    +   - for loop: The commands in a loop are set to repeat as long as a condition
    is true. Often used to set up a loop that repeats a specified number of times.

    - while loop: The commands in a while loop continue to repeat as long as a specified
    condition is true.

    - until loop: The commands in an until loop continue to repeat until a condition
    is true.'
  merge: -1
  pgno: 396
- img_proc: true
  md: '# Testing Conditions


    The shell provides a test command for testing conditions. The test commands test
    expressions to see whether the expression is true, as follows:


    ```

    test $age -eq 21

    [ $age -eq 21 ]

    ```


    The two statements are equivalent. This chapter uses the second format. A space
    is required before and after each square bracket. The test returns true if $age
    equals 21.


    Table 19-1 lists the options you can use for test values.


    # Table 19-1. Options for Use When Testing Expressions


    | Option | Tests for | Example |

    |---|---| equal text strings | [ $name = "John" ] |

    | != | non equal text strings | [ $name != $name2 ] |

    | -eq | equal integers | [ $age -eq $adult ] |

    | -gt | integer1 is greater than integer2 | [ $age -gt 20 ] |

    | -ge | integer1 is greater or equal to integer2 | [ $age -ge 21 ] |

    | -lt | integer1 is less than integer2 | [ $age -lt 18 ] |

    | -le | integer1 is less than equal to integer2 | [ $age -le 17 ] |

    | -ne | non equal integers | [ $age ne $age2 ] |

    | -n | string longer than 0 | [ -n $name ] |

    | -z | string with 0 characters | [ -z $name ] |


    The test command can also be used to test file characteristics. Table 19-2 lists
    the most useful options for testing files.


    # Table 19-2. Options for Use When Testing Files


    | Option | Tests for | Example |

    |---|---||

    | -nt | file1 newer than file2 | [ test1 -nt test2 ] |'
  merge: -1
  pgno: 397
- img_proc: true
  md: '| Option | Tests for | Example |

    | --- | --- | --- |

    | -ot | file1 older than file2 | [ test1 -ot test2 ] |

    | -d | file exists is a directory | [-d $dirname |

    | -f | file exists and is a regular file | [-f $filename |

    | -r | file exists is readable | [-r $filename |

    | -s | file exists and has a size greater than 0 | [-s test2 |

    | -w | file exists and is writable | [-w $filename |

    | -x | file exists and is executable | [-x $filename |


    You can test for the negative of any expression by putting an exclamation mark
    at the beginning of the test, as follows:


    ```

    [ $name = "Sam" ]

    ```


    This condition is true if $name does not equal Sam. It can equal anything.

    A condition can consist of more than one expression. The options for testing multiple
    expressions are:


    ```

    -o (or)

    -a (and)

    ```


    The -o tests whether either one of the two expressions it connects is true. The
    -a tests whether both of the expressions it connects are true. For instance:


    ```

    [ $age -le 50 -a $age -gt 30 ]

    ```


    For this condition to test true, both expressions must be true. This condition
    tests for age 3150. You can test several conditions, as follows:


    ```

    [ $ age -lt 50 -a $name = "John" -a $weight -eq 200 ]

    ```'
  merge: -1
