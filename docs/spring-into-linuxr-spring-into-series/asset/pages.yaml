  md: '# Screen Shots


    You can use software to take a picture of the screen and store it in a graphics
    file. You can use Ksnapshot for this. For KDE, open Ksnapshot from the main menu
    in Graphics or Utilities. Ksnapshot may be on the GNOME main menu. If you do not,
    select Run from the main menu and Ksnapshot opens with the window shown in Figure
    13-3.


    Figure 13-3. Ksnapshot window.


    ![](img/8fd2e743227b42de3b4152272123250b_271_0.png)


    When Ksnapshot opens, it takes a picture of the screen, displaying the snapshot
    in the Current Snapshot section. The current snapshot in the figure shows a Linux
    desktop. You can print or save the snapshot. The snapshots are saved in .png format.


    You can change the settings and take another snapshot. You can set a delay, so
    you have time to display software on the screen that you are in the shot. You
    can set it to grab only the window containing the pointer, rather than the complete
    screen. When the settings has changed, click New Snapshot. Ksnapshot closes its
    window. Click the window you want to take a picture of. Ksnapshot opens with the
    new snapshot preview.


    If you''re going to edit the snapshot, you can take a snapshot directly in GIMP.
    When GIMP is running, click File and select Acquire->Screen Shot. Check "Single
    Window" or "Whole Screen.\ OK. The screen opens in GIMP, where you can edit and/
    save it.'
  merge: -1
