  md: '# Chapter 3. Getting Ready to Install Linux


    Some thought, and perhaps some work, is necessary to prepare for Linux. Before
    you begin the installation of Linux, you need to do the following:


    +   - Check your hardware: Linux requires certain minimum hardware resources.
    In addition, Linux needs to communicate with your hardware, such as your monitor
    and your mouse. You can check your hardware to ensure that it''s compatible with
    your Linux distribution.

    - Obtain the Linux software: The easiest way to obtain Linux is to purchase it.
    When you purchase a Linux distribution, CDs with Linux ready arrive on your doorstep.
    On the other hand, the quickest way to obtain Linux is to download it from the
    distribution Web site. However, you must copy the downloaded files onto a CD.

    - Plan your preferred operating system: Linux can be installed alone on your computer
    or can be installed together with another operating system, such as Windows.

    - Prepare your computer for multiple operating systems: If you plan to run more
    than one operating system, you need to prepare separate sections of the hard disk,
    partitions, for each operating system.

    - Set up your computer to boot from the CD drive: To install Linux from the CDs,
    you need to boot your computer from the CD drive. You need to determine whether
    your computer can boot from the CD. If it doesn''t, you can change its settings
    so that it does boot from the CD. Or, you can boot from a floppy disk.'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# Hardware Requirements


    Linux requires certain hardware resources. Different Linux distributions have
    different requirements. Some Linux distributions were developed specifically to
    be installed in a very small space or on old or unusual computers. However, this
    book provides information for complete Linux distributions, including desktops
    and general applications, as of office or graphics applications. Therefore, the
    hardware considerations discussed in this section refer to complete Linux distributions,
    such as Fedora, Mandrake, and SuSE. General requirements are as follows:


    +   **Computer type**: Pentium class computer equivalent to Pentium II with a
    speed of 400MHz or better.

    **Memory**: The memory requirements suggested by Fedora as a minimum of 192MB
    with 256MB recommended. SuSE gives 128MB as the minimum with 256MB recommended.
    Mandrake gives 64MB as the minimum, with 128MB or more recommended.

    **Hard disk space**: As with most software, Linux distributions get larger as
    they improve and add features. For instance, Mandrake 9.2 requires 100MB for a
    minimum installation, with 1GB recommended; whereas Mandrake 10 requires 500MB,
    with 1GB recommended. It''s best to check the Web site for the hard disk requirements
    of the Linux distribution and version you want to install.


    The number and type of packages is also a consideration. In fact, some minimal
    installations may not include space for all the packages you need. Even minimal
    installations are stripped down that they are barely usable. Even a usable installation
    can provide different package sets with installation. For instance, Fedora allows
    you to select an installation type during the install process. The Personal Desktop
    type installs fewer packages than the Workstation type. Thus, Personal Desktop
    requires 2.3GB, whereas Workstation requires 3GB. For most purposes, you should
    try to allow at least 2GB if possible.


    In addition, you may need to include some extra space in your installation. You
    may want to add packages later. You also need room for the data you add. And Linux
    requires some empty space (5%) for its own use.'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# Hardware Compatibility


    The Linux operating system is a collection of programs that run a computer. To
    perform its job, it needs to communicate with the computer hardware so that it
    can store information on the hard disk, display information on the screen, send
    data to the printer, and perform other tasks. Thus, Linux needs to know what type
    of hardware is on your system so that it can communicate with the hardware.


    In the early days of Linux, the person installing the software needed to provide
    Linux with the hardware information needed, which meant that the person needed
    to be knowledgeable about the hardware. Consequently, Linux developed the reputation
    of being difficult to install, not to be attempted by a novice. However, in recent
    times, this is no longer the case. Extensive hardware is no longer required


    Recent Linux installation procedures can identify the hardware in your computer
    quite accurately by probing the computer. Occasionally, if your hardware is very
    unusual or new, the installation procedure might not be able to recognize it.
    You can check any hardware compatibility at the distribution Web site before you
    start the installation. Fedora, Mandrake, and SuSE maintain databases where you
    can search for your hardware to see whether it is compatible (hardware.redhat.com;
    cdb.subuse.de/; www.linux-mandrake.com/en/hardware.php3).


    You can be doubly prepared during installation if you gather information about
    your hardware, in case you need it. The best solution is to gather the manuals
    for your hardware, such as the manual for your monitor and modem. If you don''t
    have the manuals, you can easily get the information you need one of the following
    ways:


    +   **Windows:** If you are installing Linux on a computer that already has Windows
    installed, you can find the name of your hardware from the Windows Control Panel.
    For instance, in Windows XP, go to Start->Control Panel->Administrative Tools->Computer
    Management->Device Manager. You see a list of hardware on your computer. You don''t
    need to know all those things are. But, if you click modem or mice, it will list
    what kind of modem or mouse you have. If you double-click the specific modem name,
    it gives you a screen showing the properties of the


    +   **From the Web:** Go to the Web page for the hardware manufacturer, find the
    model that matches yours, and look at the specification page for the product.'
  merge: -1
  pgno: 39
