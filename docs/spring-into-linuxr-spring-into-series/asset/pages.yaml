- img_proc: true
  md: '# Match a String of Characters (+) (*) ( { n })


    You can match a string of one or more characters by adding a plus (+) after the
    character.


    You can match a string of zero or more characters by adding an asterisk (*) after
    the character.


    You can match a string of a specified number of characters by adding curly brackets
    enclosing a number { n } after the character.


    You can specify a range of repetitions with two numbers enclosed in curly brackets.


    | Regular Expression | Match | Not a Match |

    | --- | --- | --- |

    | ab+c | abc, abbc, abbbc | ac, axc |

    | ab*c | ac, abc, abbbc | axc |

    | ab{3} c | abbbbc | abc, abc, abbbbc |

    | ab(2,3) c | abbbbc | ac, abc, abbbbc |

    | a[bc]+d | abd, abccd, abbcccd | abd, acd, axd |

    | a(bc)*d | ad, abcd, abcbcd | abd, acd, axd |

    | ^+$ | a, aaa (any line with one or more characters in it) | (a blank line) |'
  merge: -1
  pgno: 419
- img_proc: true
  md: '# # Match One of Alternate Literal Strings ((|))


    You can put a set of literal strings, each separated by a pipe bar (|), between
    parentheses. The string matches if it contains any one of the alternate literal
    strings.


    | Regular Expression | Match | Not a Match |

    |---|---|---|

    | a(bc|def)x | abcx, adex, afgx | ax, abx, abcdex |

    | I(love)carrots | I love carrots | I like carrots


    Many special characters and literal characters can be mixed together to form a
    regular expression. Really long, complex regular expressions can be built to match
    any conceivable string.


    A special character is sometimes part of literal string. If you want to include
    special characters in a regular expression to be treated as literal characters,
    you insert a backslash (\) in front of the special character. For example, look
    at the following two regular expressions:


    ```

    ^.$\$

    \.\.$

    ```


    The first pattern matches a line that has one character on it, any character.
    The second expression matches a line that has one dot on it. The \. in front of
    the dot makes it into a literal dot, rather than a special character that represents
    any one character. Using a \ in front of a special character is escaping the character.'
  merge: -1
  pgno: 420
- img_proc: true
  md: '# Using Regular Expressions


    How you use regular expression depends on the specific application you''re using.
    In most languages, such as Perl or PHP, you use a function in the language that
    compares the regular expression to a string, returning a value meaning the string
    matched or didn''t match. In many applications with a GUI, such as OpenOffice,
    you type the regular expression into a field. Each application has its own method
    for regular expression input.


    In many cases, you use characters to indicate the beginning and end of the regular
    expression. The characters that specify the beginning and end are called delimiters.
    In some applications, you can specify what delimiter you want to use. Forward
    slashes (/) and quotation marks are often used as delimiters.'
  merge: -1
  pgno: 421
- img_proc: true
  md: '# Examples


    This provides some practical examples of regular expressions. Double quotes are
    used as the delimiter for these examples.


    The following regular expression matches any word of normal text:


    ```

    "[A-Za-z] [a-z]* "

    ```


    The regular expression contains a space at the end, after the " , to indicate
    the end of the word.

    Two regular expressions that match phone numbers:


    ```

    ^\(([0-9]{3}\) [0-9]{3}-[0-9]{4}\$

    ```


    Matches phone numbers of the format (nnn) nnn-nnnn. Notice the parentheses are
    escaped. A more flexible regular expression might be:


    ```

    ^[0-9]( -)\{7,20}\$

    ```


    Matches a string that can contain numbers, parens, spaces, and dots. The string
    must be at least 7 characters long but not more than 20 characters.

    To match a zip code, including zip+4, use:


    ```

    ^[0-9]{5} (\-[0-9]{4})?$\$

    ```


    Matches a string of five numbers in the first section ([0-9]{5} ). The rest of
    the regular expression is enclosed in parentheses, making it a single unit that
    matches the +4 part. A ? after the parenthesis makes the entire +4 section optional.


    The following regular expression matches a common email address.


    ```

    ^.+\@\.(com|net)\$

    ```


    The regular expression includes a literal @ sign. A \ escapes the dot, making
    it a literal dot. Only .com and .net email addresses are accepted by this regular
