  md: '# SuSE


    (pronounced sueh) has a desktop focus. The SuSE developers have developed an easy-to-use
    installer and simple configuration tools. SuSE has the best documentation of any
    distribution, thorough and understandable.


    SuSE is developed privately, not publicly. The software is not available during
    the development process. It''s developed by the SuSE developers, depending on
    sales of boxed sets for its revenue. SuSE includes some commercial software, in
    addition to the free open source software. Two boxed sets are available:


    +   **Personal**: A version that provides the essentials for a desktop user, including
    office applications, email software, Internet applications, and others. The documentation
    includes only an installation guide. The user''s guide is only available online.


    +   **Professional**: A version that includes more software. It provides server
    and network utilities and development tools, in addition to personal desktop applications.
    It includes a printed user''s guide and an administrator''s guide.


    SuSE also provides business software such as an enterprise server.


    SuSE provides the opportunity to install its software free of charge directly
    from FTP. The FTP version is mainly the same, except some of the commercial software
    included on the CDs is removed. This is not something you want to do via a dial-up
    connection.


    SuSE features include the following:


    +   **Multiple desktops**: Provides both GNOME and KDE. KDE is the default.


    +   **Linux with Windows**: SuSE Linux installs alongside a Windows system. The
    installation procedure will make room for the Linux system on the hard disk in
    the space (partition) where Windows is already installed by resizing the Windows
    space.


    +   **Well supported**: SuSE supports a very active mailing list at [http://www.suse.co.uk/uk/private/support/online_html#help/mailinglists/index.html].
    Several forums are available at forums.suselinuxsupport.de/, as general questions,
    install problems, and network problems. Try the SuSE forum at Linux Forums at
    [http://www.linuxforums.org/forum/forum.php?f=36].'
