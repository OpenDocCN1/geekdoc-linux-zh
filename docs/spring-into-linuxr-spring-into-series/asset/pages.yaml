  md: "# Editing and Saving Files with vi\n\nvi operates in one of two modes. it behaves\
    \ differently, depending on which mode it's:\n\n+   **Normal mode**: The characters\
    \ you type are editing commands that perform operations on your file, such as\
    \ moving the cursor, deleting a character or a line, etc. There are two types\
    \ of commands:\n  - **Keys sequences**: Pressing keys issues commands to vi. For\
    \ instance, pressing x deletes the character after the cursor.\n  - **Command\
    \ line**: Pressing a semicolon allows you to type commands with arguments.\n \
    \ - **Insert mode**: When you type, the characters are inserted into the file.\
    \ Typing certain commands, as in <i> (the insert command), puts vi into Insert\
    \ mode. Pressing the <Esc> key ends Insert mode, returning to normal mode.\n\n\
    vi opens in Normal mode. vi changes to insert mode when you enter a command that\
    \ inserts text into a file. It changes vi to insert mode and allows you to type\
    \ text into the vi stays in insert mode until you press <Esc>, which ends Insert\
    \ mode and returns to Normal mode. Another command that changes vi to insert mode\
    \ is <a>, the append command, which allows you to insert text after the cursor.\n\
    \nIn Normal mode, keys are commands. Most the commands are one key, although some\
    \ require a two key sequence. Almost all the commands allow you to type a number\
    \ before the command. The command is repeated the number of times specified by\
    \ the number. For instance, <dd> is the command to delete a line. <3dd> deletes\
    \ 3 lines. If you enter no number before the command, the number 1 is assumed.\n\
    \nA small set of vi commands is described in this chapter. This is sufficient\
    \ for most editing tasks. However, vi has many abilities not presented here. If\
    \ you often edit at the command line, you will appreciate learning more of vi's\
    \ capabilities. See the vi (or vim) documentation on your system for complete\
    \ documentation.\n\nAfter adding/editing the file content as described in the\
    \ remainder of this chapter, save the file by pressing <zz> (notice that ZZ is\
    \ uppercase). You can close a file without saving any changes by typing:\n\n```\n\
    :q!\n```\n\nYou can save a file without exiting vi the command :w."
  merge: -1
  pgno: 379
- img_proc: true
  md: '# # Moving Around a File in vi


    Usually, you can use the arrow keys on your keyboard to move around the open file
    in vi. In some cases, such as a very old or very minimal Linux installation, the
    arrow keys don''t operate.


    You can always move around your file using the key commands in [Table 18-1].


    # ### Table 18-1. Commands for Moving Around in a File


    | Key | What It Does |

    |--- |--- |

    | j | Moves down one line. |

    | k | Moves up one line. |

    | l | Moves one character to the right. |

    | h | Moves one character to the left. |

    | G | Moves to the last line of the file. |

    | L | Moves to the last line on the screen. |

    | Ctrl-d | Moves down one screen. |

    | Ctrl-u | Moves up one screen. |

    | :n | Moves the cursor to n. For instance, :1 moves to the first line of the
    file. |

    | $ | Moves to the end of the current line. |

    | ^ | Moves to the first non-space character in the current line. |

    | 0 (zero) | Moves to the beginning of the line. |

    | w | Moves to the beginning of the next word. |

    | b | Moves to the beginning of the previous word. |

    | e | Moves to the end of the word. |


    # ### NOTE


    Be sure to use the correct case. vi is sensitive. It doesn''t see a and A as the
    same command.


    In addition to the commands to move the cursor, you can move to specific text
    characters or strings searching for them. You can search for a character in a
    line using the `f` (find) command. The syntax is `fx`, where `x` is the character
    to find. For instance, `fh` moves to the next `h`.'
  merge: -1
