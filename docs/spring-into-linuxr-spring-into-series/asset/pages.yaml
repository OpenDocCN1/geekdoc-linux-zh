- img_proc: true
  md: '# Mozilla Menus and IE Toolbars


    The menu is similar to the IE menu bar, except Mozilla says Bookmarks rather than
    Favorites. The Mozilla Windows menu is where you can open the other applications
    in the suite, such as email or address book. The Go menu is similar to History
    in IE.


    There are two toolbars. The usual buttons for back, forward, search, home, etc.
    are on the toolbars. You can select the items you want on your toolbars by clicking
    Edit and selecting Preferences. Click Navigation. In the bottom section of the
    page, check the items you want on your toolbarsHome, Search, Print, Bookmarks,
    and Go.


    The second toolbar is the personal toolbar, a place for you to store frequently
    used Web pages. The bookmarks on the personal toolbar are Red Hat Web pages, added
    by the Fedora developers. If you download and install Mozilla yourself, links
    tomozilla.org and mozillaZine appear on the personal toolbar.


    You can customize the personal toolbar completely. You can add a bookmark to your
    personal toolbar. Copy a bookmark or a folder of bookmarks from your bookmark
    drop-down list and paste it onto the personal toolbar. You can also add a bookmark
    to the personal toolbar from any open Web page. Drag the icon at the beginning
    of the location bar to the personal toolbar.


    You can delete any bookmark from the personal toolbar. Right-click the bookmark
    and select Delete.


    You can hide any toolbar by clicking the small triangle on the left side of the
    toolbar. Click the triangle again to redraw the toolbar. You can totally remove
    a toolbar, including the triangle section, by clicking View and selecting Show/Hide.


    The status bar appears at the bottom of the browser. The left section of the status
    bar is the component bar. Buttons for switching to other applications in the Mozilla
    suite, such as email or the address book, are found on the component bar. The
    component bar is not found on Firefox because Firefox is not suite.'
  merge: -1
  pgno: 310
- img_proc: true
  md: '# Mozilla Sidebar


    The Mozilla sidebar is an area where you can keep the items you use often. Each
    item is accessed using a tab. If the sidebar is not available, click View and
    select Show/Hide->Sidebar. You can add or remove items from the sidebar.


    By default, the sidebar contains default items: Search, Bookmarks, and History.
    If you click a tab, the features for the item open in the sidebar. For instance,
    if you click the Search tab, the features of the search function open in the window
    on the right. You see a field where you enter search terms Click a search engine
    in the drop-down list (Google is currently selected). Click Search. The search
    results display in the sidebar. Click a result to open the Web page in the browser
    window. The sidebar retains the search results for your use.


    ![](img/8fd2e743227b42de3b4152272123250b_311_0.png)


    If you click Bookmarks tab, all your bookmarks are available in the sidebar (shown
    in Figure 15-4). You can open a bookmarked page by clicking it. The History tab
    is similar, listing pages you have previously visited.


    You can add items to your sidebarnews, weather, address book, stock quotes, FedEx,
    many others. Or you can remove items. Click Tabs in the upper corner of the sidebar.
    Select Customize Sidebar. The window below opens.


    The left pane shows available tabs. The right pane shows the current sidebar tabs.
    To add a tab to the'
