  md: '# Chapter 8. Linux Accounts


    Linux is a multi-user operating system that allows many users to work on the same
    computer, at the same time. For this work, each user''s work must be kept separate.
    One user can''t be allowed to interfere with another''s work, either accidentally
    or with evil intentions. A system that allowed your rival to delete the report
    you spent writing would not be very popular. Linux accounts keep users'' work
    private and protected.


    You may be the only person working on your computer. If so, user accounts may
    seem unnecessary to you. Nevertheless, you can''t work on Linux without an account.
    So, at least one account is required. Accounts help protect you from unauthorized
    access from the Internet, as well as unauthorized access from your desk chair.


    You will see accounts on your system that you didn''t create. These are special
    accounts that run system and application processes. Some are created during installation.
    Others are created by the installation process when you install a software application.
    However, these are not accounts that you are likely to log in to. Only a system
    administrator is likely to need to understand or work with special accounts.'
  merge: -1
  pgno: 165
- img_proc: true
  md: '# Account Types


    All accounts are not equal. Each account has a set of privilege seta of actions
    it is allowed to perform. There are two types of accounts:


    +   **Root**: The root account, called the super user, is allowed to do anything.
    It can access every file, directory, and program on the system. Every Linux system
    must have a root account.

    * **User**: User accounts are more restricted. Unless given additional permissions,
    user accounts can only access directories and run programs that were created using
    the account itself.


    During installation, a root account, and probably one or more user accounts, were
    created and given passwords. Don''t forget the root password. You must use the
    root account to make changes to the system. Root can add new accounts at any time.


    It is wise to log in and use your user account most of the time. In fact, don''t
    use the root account unless you really need to. The root account has unlimited
    power that allows you to make disastrous mistakes.


    User accounts can be temporarily given root privileges. If you need to perform
    a task that requires privileges while logged in to your user account desktop,
    you can enter the root password and perform the task. For instance, if you open
    main menu->System Settings and select Users and Groups or for Root Password while
    logged in to your user account, you will be prompted with the window shown in
    Figure 8-1.


    # Figure 8-1. Root password prompt.


    ![](img/8fd2e743227b42de3b4152272123250b_166_0.png)


    When working in the shell in a terminal window, you can change from one account
    into any other account, as long as you know the password. Change account using:


    ```

    su accountname

    ```'
  merge: -1
