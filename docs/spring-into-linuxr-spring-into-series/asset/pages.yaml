  md: '# Chapter 1. Understanding Open Source Software


    If this is your first venture into open open source software, you need to understand
    open source beliefs and practices. If you come from a background in Windows and/or
    other commercial, proprietary software, you''ll find that the open source viewpoint
    is quite different from the viewpoint of proprietary software vendors. Open source
    software is developed and distributed differently. Your procedures for obtaining
    the software and its updates are very different. Your methods of obtaining support
    for your use of the open source community of software are different, as well.
    This chapter explains the philosophy and practices of the open source community
    of software developers and users.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# # Open Source Software


    Open source means exactly what the source of the software may be open, available
    to everyone, not secret. The source code is the program code that produces the
    functionality of the software (that is, the underlying program code that makes
    a spell checker check spelling and an address book store addresses). The source
    code is written in a programming language, such as C or Java. Many people know
    this language. Therefore, anyone who knows the source knows how the program does
    its job.


    Open source software provides the source with the software. The source is considered
    to be free, as in free speech. Anyone is free to use the program for any purpose,
    to modify the program, or redistribute the program. No permission required.


    The alternative to open source software is proprietary softwarewhich is exclusively
    owned by one or more individuals or a company. The owner''s permission is required
    for any use of the software. Many commercial software companies make a profit
    by owning the software and charging customers to use it. For those of us, the
    software is the company''s product. The source code is the trade secret, basis
    for its hopes of profit, an asset to be guarded. Much of the commercial software
    you are familiar with, such as Windows, MS Office, and Photoshop, is proprietary
    software. The company provides the software to those who pay for it in a format
    (binary code) that hides the source code. The users can see what the software
    does (e.g., incorrect spelling) but not know how the software accomplishes the
    task.


    Open source software development is organized as a project. Volunteer developers,
    often located throughout the world, coordinate their work via the Internet. Open
    source projects communicate with their users, and the world, via a project Web
    site where the software is available for download. The Web also provides information
    about the software and its developers, documentation for the software, a database
    and procedures for entering reports into the database, mailing lists or forums
    where users can discuss the software, and other related information.


    Open source development is open. That is, the software is posted on the Web as
    it is being developed, available for any interested person to work on. The users
    are a diverse group, with varying uses for the software and levels of skill in
    using the software, who have direct access to the developers through the Web site.
    The result is quick identification of bugs and problems, feedback on useful and
    not-so-useful features, bugs fixed by users, and suggestions for new features
    and/or implementation.


    Open proponents believe that software produced by this processcommonly, with a
    great deal of testing, input, review, criticism, and discussions higher-quality
    software. The fact that developers are motivated by interest, rather than by employment
    considerations, is believed to increase quality. Some open source has succeeded
    well. Apache is probably the best known success story, a classic open source project
