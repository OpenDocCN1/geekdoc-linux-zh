  md: '# What''s Unusual About This Book?


    This booklike like the other books in the Spring Into ... Series provides the
    following eccentricities:


    +   * Each topic is explained in a discrete one- or two-page unit called a "chunk.\n*
    Each chunk builds on the previous chunks in that chapter.

    * Most chunks contain one or more examples. I learn best from examples. I don''t
    think my style is unique. I believe I have company in my appreciation for examples.

    * The heading for each chunk appears in the table of contents. The small chunk
    size means the chunk heading pinpoints small amounts of information. Finding information
    is so easy.


    Information is packed densely in each chunk. I have toiled to make each word contribute
    to your understanding of Linux. The result is focussedinformationinformation you
    can find when you need it.'
