  md: '# Digital Cameras


    Konqueror is the simplest way to move pictures from your camera to your computer.
    Konqueror uses a package called gphoto2, which is usually installed on your Linux
    system, to read pictures from your camera.


    Linux provides support for many digital cameras. To see whether your camera is
    supported, open a terminal and type:


    ```

    gphoto2 --list-cameras

    ```


    A long list of cameras displays (currently more than 400). If you don''t find
    your camera listed, check the Web site (gphoto.sourceforge.net) for the most recent
    version. If a newer version is available, install it. Installing packages is discussed
    in Chapter 10.


    To move your pictures, connect your USB digital camera to your computer. Instructions
    should be provided with your camera. On many Linux distributions, a camera icon
    appears on your desktop when you connect your camera. If you double-click the
    icon, you see your camera directories and can copy files to your disk.


    If the camera icon doesn''t appear, you can navigate to the pictures using Konqueror.
    Open Konqueror with the navigation panel open. If the navigation panel is not
    displayed, click Window and select Show Navigation Panel.


    Type the following into the Location field:


    ```

    camera/:

    ```


    An icon for your digital camera appears in the main window. Click the icon to
    see the folders related to your camera. Navigate to your photo directories. Copy
    the picture files or drag and drop them into a folder in your navigation window
    on the left.'
  merge: -1
