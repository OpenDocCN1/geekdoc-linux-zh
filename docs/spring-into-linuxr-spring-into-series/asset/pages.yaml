  md: '# Logging Out


    Powering off your machine without logging out and shutting down properly can cause
    problems. Linux may be in the middle of some background activities necessary to
    run your computer and may not be able to finish its tasks.


    To select, Log Out on the main menu or on the desktop menu displayed when you
    right-click on the desktop. In most cases, a window with at least three choices
    displays, similar to the SuSE window shown in Figure 6-20.


    # Figure 6-20. SuSE logout window.


    ![](img/8fd2e743227b42de3b4152272123250b_141_0.png)


    One choice is usually Log Out, or in this case Login as different user. Selecting
    this choice logs out this session, but displays a login screen so you can log
    in as a different user (or with a different desktop). Linux is not shut down.
    A second restarts (reboots) the computer. Linux is shut down without unless your
    assistance.


    A third choice is Shut Down, or Turn off computer. This closes everything. The
    computer may power itself off or display a message that it is ready to be powered
    off.


    Power down is not necessary. Linux can run indefinitely without process. It saves
    time and maybe it is better for the computer. If you are reluctant to leave the
    computer because it''s possible for someone to access it, you can lock the screen
    so that no one can use it without the password. To lock the screen, select Lock
    screen from the main menu. If anyone tries to use the computer with a locked screen,
    a password prompt displays and the computer can''t be used until the password
    is entered.'
  merge: -1
