- img_proc: true
  md: 'Name, you can select the printer. You can also select Print to File (PDF).
    The folder to the right of the list box allows you to browse for the files to
    print. Click tabs to select pages to print, number of copies, and schedule a time
    for the job to print.


    You can send a file to printer from the command line with the following command:


    ```

    lpr -Pname filename

    ```


    name is the name of the print queue, such as Laser. If you leave the -P option
    out, the file is sent to the default print queue.


    ![](img/8fd2e743227b42de3b4152272123250b_296_0.png)'
