  md: '# # Copying, Renaming, and Moving Files


    Conqueror allows you to copy, rename, and move directories and files. When you
    copy or move a directory, all its contents are copied or moved as well.


    Highlight a directory or file to be copied or moved. Use the **Ctrl** key or the
    **Shift** key with the mouse to select more than one icon. Right-click your highlighted
    icon(s) and select **Cut** or **Copy** to copy the file(s) onto the clipboard,
    or to the Windows clipboard. When you **Paste** the file(s) wherever it''s needed.
    Select **Rename** to give the file a new name. **Copy to** and **Move to** provide
    a list of directories where you can create a new copy of the file. Select **Copy
    Here** in the target directory.


    You can also copy or move a file by dragging it to a new location. For instance,
    you can highlight a file icon in the right pane of Conqueror and use your mouse
    to drag it to any folder in the left pane of Conqueror. Or to a directory that''s
    open in another window. Or to an application''s open in another window.


    You can copy, rename, and move directories and files at the command line using
    the `cp` and `mv` commands. To copy or move a file, type:


    ```

    cp path/sourcename path/targetname (copies a file)

    cp -r path/sourcename path/targetname (copies a directory)

    mv path/sourcename path/targetname (moves a file or directory)

    ```


    After a `cp` command, two copies of the directory or file exist, with two different
    names. After a `mv` command, the source directory or file is gone, only the new
    copy, `targetname`, exists. Thus, `mv` functions as a rename command. The basic
    rules are:


    +   * If *targetname* doesn''t exist, a copy of *sourcename* is created and given
    the name *targetname*.

    * If *targetname* exists and is a file, it is overwritten if *sourcename* is a
    file, but not copied at all if *sourcename* is a directory.

    * If *targetname* exists and is a directory, a copy of *sourcename* is written
    into *targetname* and given its original name


    To copy or move files, your account needs to have write permissions to the directory
    where you are copying or moving the file or directory.'
  merge: -1
  pgno: 202
- img_proc: true
  md: '# Viewing and Editing Text Files


    Text files are files that contain only text characters, with no formatting information.
    Text files contain information in ASCII code, a code that is understood by most
    applications. HTML files, program source code, and many Linux configuration files
    are stored in text files. Although you can view and edit the contents of text
    files with a word processor, it''s generally quicker and simpler to edit them
    in a text editor that has only the features necessary to edit text. Some text
    editors:


    +   - **Kate:** A basic text editor with a GUI interface, similar to Notepad.
    Kate is discussed in full detail in Chapter 18.

    - **KWrite:** A text editor similar to Kate, with a few more useful features,
    such as a spell checker. KWrite is the default editor for KDE. When double-click
    a text file, it opens in KWrite.

    - **Emacs:** A popular editor, developed by GNU, with advanced features for programmers.


    +   - **vi:** A command-based text editor, useful at the command line. *vi* is
    installed on every Linux and UNIX system, regardless of what other text editors
    are installed. *vi* is described in detail in Chapter 18. Many Linux distributions
    provide an updated version of *vi* called *vim*. Any commands that work also work
    in *vim*.


    You can look at the contents of a file at the command line without opening the
    file in a text editor with


    ```

    cat filename

    ```


    The entire file contents display on the screen at once. You can display the contents
    one screen at a time with the following command:


    ```

    less filename

    ```


    Output pauses after one screen displays. Press `<space>` to display the next page.
    Press `<q>` to quit the command, stopping the output.


    Linux provides two applications for automating repetitive text editing:


    +   - **sed:** A powerful, fast search and replace utility. Your search term can
    be a pattern (regular expression, discussed in Appendix A). sed can process many
    large files in seconds.

    - **gawk:** A simple, limited purpose scripting language. gawk processes each
    line in the file, rearranging, removing, and/or adding text as directed.'
  merge: -1
  pgno: 203
- img_proc: true
  md: '# Deleting Files and Directories


    To delete a file or directory in Konqueror, highlight the icon and right-click.
    Select either Move to Trash or Delete. Move to trash is the safer option because
    the file can be retrieved from the trash so long as the trash hasn''t been emptied.
    Files that are deleted are not retrievable.


    Konqueror allows you to delete a file or directory by using your mouse to drag
    it into the trash on your desktop.


    To delete a file from the command line, type:


    ```

    rm filename

    ```


    You can use wildcards (e.g., ch* or ch?) to delete more than one file at a time.
    Be very cautious using wildcards. Linux allows you to issue a command like the
    following:


    ```

    rm *

    ```


    It deletes all the files in the current directory. It''s easy to make a disastrous
    mistake using wildcards. Listing the files with the wildcard, such as with:


    ```

    ls *

    ```


    shows the files that will be deleted. It''s worth a few seconds to be careful.

    To remove a directory, use the command:


    ```

    rmdir dirname

    ```


    However


    ```

    rm -r dirname

    ```


    This will remove dirname and all its contents, including nested directories. This
    command deserves a caution. Be sure you know what''s in the directory and that
    you want to delete it before issuing this'
  merge: -1
