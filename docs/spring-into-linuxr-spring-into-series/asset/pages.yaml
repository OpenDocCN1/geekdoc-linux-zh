  md: '# Installing from the Distribution Web Site


    Distribution RPMs are provided on most distribution Web sites. Most distributions
    provide utilities you can use to install software from the Web site. Fedora includes
    YUM, a command-line utility used to connect to the Red Hat site and to download
    and install packages. Fedora also includes Update, a utility that provides a graphical
    interface to YUM. Update is installed during Fedora installation and requires
    you to be registered with the Red Hat site.


    +   * Update requires a connection to the Internet. It provides an icon on your
    desktop panel, shown that notifies you of your update status. The blue icon with
    the check on it indicates that all packages on your system are up-to-date. If
    the icon is red, with an exclamation point, there are updates available for your
    system. A tool tip with status displays when you move the mouse pointer over the
    icon.


    For update2, right-click the status icon. Launch Update. An information screen
    displays. When you click Forward, a screen displays shows the channels you can
    update. One channel should be Fedora Core. Be sure that at least one channel is
    checked. Click Forward. A screen for selecting software you don''t update displays.
    By default, it exempts the kernel. You can add any other software you don''t want
    to update.


    Update connects to the Red Hat site and displays a list of available packagespackages
    that are not installed or are newer than your current installed packages. Or you
    can check "Select All" to update all your packages. Update checks the dependencies
    for the packages you check to install and installs any needed packages. Update
    displays a message when it is finishing installations.


    SUSE installs and updates packages using YaST, the same YaST that is used to install
    packages from the distribution CDs. Open Main Menu. System->YaST. Click Online
    Update. YaST selects the closest Web site for your updates. You can select Configure
    Fully Update to have YaST find and install any updates automatically, daily, without
    your intervention.


    Mandrake also provides updates from a Web site. Access the Mandrake Control Center
    from main menu->System->Configuration->Configure your computer. Click the Software
    Management icon. Click Updates. A screen displays the list of software available
    for installation, with descriptions.'
