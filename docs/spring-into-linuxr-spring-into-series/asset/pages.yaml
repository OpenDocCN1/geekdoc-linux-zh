  md: '# Changing Image Size in GIMP


    You can change image size in one of three ways:


    +   - **Crop**: Keep part of an image and discard the rest.

    - **Scale**: Change the size of an image, keeping all the content of the image.
    For instance, if you scale the image smaller, all parts of the image shrink to
    fit the new image size.

    - **Resize**: Change the size of the window, while keeping the image the same
    size. This is generally used to make the window larger, thereby making room to
    add new elements to the image.


    To crop an image, you select the section you want to keep and throw away the rest.
    Use a tool from the toolbox to select the part of the image to keep. For instance,
    click the first tool to use the tool that selects a rectangular section of the
    image. Then, move your mouse to the image window. The mouse pointer shows a rectangle
    beside the pointer, so you know which tool is active. Click and drag the mouse
    to enclose the image section you want to keep. To remove the selection right-click
    and select `Selection-None`.


    Click `Image` on the image menu bar and select `Crop to Selection`. The image
    outside of your selection disappears. You can undo a crop to return the cropped
    part of the image.


    To scale an image, click `Image` and select `Scale Image`. A dialog window opens
    that allows you to specify the width and height for the new size. Or, in the ratio
    fields, you can specify the percentage to scale by, as .60 (60%) or 1.5 (150%).
    By default, the ratio of width remains the same. If you want to change the shape
    of the image, click the link icon to the right of the ratio fields. It separates
    into two links. Then you can set the height and width independently.


    To resize an image, click `Image` and select `Canvas Size`. A dialog window opens,
    similar to the scale image dialog window. You can set the width and height of
    the window. If you resize the window smaller, you can only see part of the image
    in the window. If you resize the window larger, extra space is added to the window
    where you can add elements to the image.'
  merge: -1
  pgno: 282
- img_proc: true
  md: '# Removing Elements from an Image in GIMP


    The simplest way to remove an element from the image is to use the eraser tool.
    However, erasing part of the image leaves an empty space where the element was
    removed. A better way to remove an element from an image is to cover it up. You
    can select a section of the image and cover it with a plain color or a pattern
    using the bucket fill tool tiptoing paint in the toolbox. The section is filled
    with a color from the foreground/background colors, whichever you select.


    However, the element to be removed with a solid color is seldom solution. In most
    cases, the element is on grass, water, snow, or other backgrounds. The element
    being needs to be covered by its background. For instance, in Figure 13-7, there
    is a telephone pole in the background, between the camera and a distant house
    with snow, a house, and the sky as it. You can remove the telephone pole by covering
    the bottom section with the color of the snow, the middle section with the color
    of the house, and the top part with the color of the sky.


    The clone tool in GIMP toolbox is useful for covering elements with their background.
    The clone tool copies a section of a picture from one place and adds it in a different
    place. Thus, you can copy a section of the background and place it over the element
    to be removed.


    The clone icon in the toolbox looks like a ruler. It''s in the bottom row of the
    tool icons shown in the section, "The GIMP Toolbox," earlier in this chapter.
    When you click the clone tool button, the clone options display in the bottom
    section of the toolbox. The brush size determines the size of the section that
    is copied. Click Brush to select a brush size.


    To move a section of the image from one location to another, follow these steps:


    +   1. Ctrl-click the section to serve as the source. A section matching the brush
    size is selected.

    2. Move the mouse pointer to the element you want to cover.

    3. Move the new location. The source section replaces the target section. If you
    hold the click down and drag the mouse around, a corresponding section from the
    source area is copied to the target area.


    With practice, any figure in an image can be removed by covering it up with the
    background behind so that the replacement looks natural.'
  merge: -1
  pgno: 283
- img_proc: true
  md: '# Adding Elements to an Image in the GIMP


    Elements can be added directly into your image, using tools from the toolbox and
    items from the menu. However, it''s usually better to add a layer to your image
    and add elements on the new layer. Adding a layer is like adding a page to a image.
    The new layer doesn''t affect the existing image; it just places a new layer on
    top of the existing image. You can add elements on the new layer.


    The new layer can be the size of the image, smaller, or larger. Smaller layers
    are useful when you add small elements. For instance, you can add a bird to the
    sky by adding a bird size width for the figure on it. You can drag the new layer
    around the image to position it. You can scale the image to match the scale of
    the image. And, at any time, you can delete the new layer, deleting the new elements,
    returning the image to its original condition.


    To add a layer, click Layer and select New, which opens the window on the right.
    You can give the layer a meaningful name. Two fields allow you to enter the figure
    width and height. The default displays is the image size. You can type a width
    and height for the layer. The bottom section selects the fill for the new layer.
    It can be transparent, which means you can see the contents of the layer beneath
    it. Or, you can make the layer a solid color, either white or the foreground or
    background color shown in the GIMP toolbox. You can then add content to the new
    layer.


    ![](img/8fd2e743227b42de3b4152272123250b_284_0.png)


    You can paste a figure from another image into the image. In the image being copied,
    click Edit and select Copy to copy the entire image, or if a section of the image
    is selected, copy selection. Move the mouse pointer to the image where you want
    to add the figure and click Edit and select Paste. The copied section is added
    to the image as a floating layer, which can be moved. You can position the pasted
    figure and anchor it as the active layer. Or you can convert the floating image
    to a new layer. Click Layers and select either Anchor Layer or New Layer. Nothing
    else can be worked on until you set the selection.


    When you save your image, save it as a GIMP file (.xcf) to save the layer information.
    If you save it in a different format, you may lose part of the file information.
    If you need a different format, save a copy. Before you save as a .gif or .jpg,
    you need to merge the layers. Click Layers and select'
  merge: -1
