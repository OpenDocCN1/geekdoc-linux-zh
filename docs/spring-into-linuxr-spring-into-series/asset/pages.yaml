  md: '# The GIMP Toolbox


    When you start the GIMP, it opens the toolbox, shown on the right. The top section
    of the toolbox contains a set of tools, activated by clicking an icon. There are
    tools you use to select a section of the image and tools that change the image.
    For instance, the first tool selects a rectangular section of the image. Other
    tools include a paintbrush, a pencil, an eraser, a tool that adds text to the
    image, tools that change colors, and more. In this image, the paintbrush is selected.
    When you click an icon, the mouse pointer changes into an associated shape. You
    then use the mouse to edit the image in the window.


    ![](img/8fd2e743227b42de3b4152272123250b_280_0.png)


    The left section below the tool icons is used to select colors you can use, in
    this case gray (foreground),'
  merge: -1
  pgno: 280
- img_proc: true
  md: 'and white (background). To change a color, double-click one of the colored
    squares.


    The right section allows you to open a section for setting brush options, a section
    for setting patterns, and a section for selecting a gradient.


    The bottom section of the toolbox displays options related to the tool chosen.
    In the figure, the paintbrush is chosen. The options in the lower box apply to
    the paintbrush, such as Opacity and Brush size. If you click the space by Brush,
    you can select different brush sizes. If the text tool were chosen, the bottom
    section would offer text options, such as font type and size.


    The first button of the four bottom buttons sets the selected options to be the
    default. The second button restores the most recently saved defaults. The button
    on the right restores the defaults to the values set by the software developers.


    ![](img/8fd2e743227b42de3b4152272123250b_281_0.png)'
