- img_proc: true
  md: '# Email Software


    Some email software available on Linux is:


    +   **Evolution**: An open source email package. Evolution is very similar to
    Outlook. Those with experience with Outlook or Outlook Express will feel at home
    in Evolution. Evolution has an integrated calendar and address book. Like Outlook,
    ones in the sidebar provide access to Inbox, Calendar, Tasks, and Contacts. Evolution,
    available from Novell, is usually installed by default. For more information,
    see www.novell.com/products/desktop/features/evolution.html.


    **KMail**: An application that is part of the KDE desktop environment. KMail is
    only available as part of KDE, not in a separate package.


    **Mozilla**: a suite of applications, including a full-featured email application.
    Mozilla is included by default on many Linux distributions. However, not Mozilla
    installations include the email application. For instance, Fedora installs Mozilla
    by default without the email application. You can add it later from the installation
    CD, as discussed in Chapter 1.


    **Thunderbird**: The next generation Mozilla email software. Thunderbird is email
    software, not a suite. It''s faster and easier than Mozilla. Thunderbird runs
    on Windows, as well as Linux. Currently, Thunderbird is not included in most distributions,
    so you must download and install it yourself. Installing software is discussed
    in Chapter 10. (www.mozilla.org)


    **Netscape**: Based on the Mozilla mail client. Similar functionality to Thunderbird,
    as well.


    This chapter discusses Mozilla email. Most of the information applies to Thunderbird,
    as well. Thunderbird has basically the same features, plus some additional features,
    but they may be found in a different location. For instance, Mozilla settings
    are found in `Edit`$\rightarrow$`Preferences`; Thunderbird settings are found
    in `Tools`$\rightarrow$`Options`. Most of the information applies to Netscape,
    as well.


    It''s not necessary to use email software on Linux. If you prefer to use Webmail,
    Webmail refers to an email account that you access through your browser, such
    as Yahoo! or Hotmail email account. The email software and messages reside on
    a computer on the Internet. From your browser, you log in to read, send email,
    get addresses from your address book, etc. Webmail is unrelated to your operating
    system. You can use a Webmail account easily from Linux or Windows.'
  merge: -1
  pgno: 343
