  md: '# # Chapter 6. Using Your Desktop


    Linux provides two basic types of interface for you to use when working with your
    computer: GUI (graphical user interface) and CLI (command-line interface). An
    overview of the interface types is provided in Chapter 5. In this chapter, the
    most common type of interface, a GUI called a desktop, is discussed in detail.
    The CLI is discussed in detail in Chapter 7.


    Linux can start without a desktop, but most users prefer to have Linux with a
    desktop. The installation instructions provided in Chapter 4 result in a desktop
    environment at startup. A desktop interface functions as that of your desk, supplying
    an empty workspace and a set of tools.


    Different distributions provide different desktops, but most users prefer KDE
    (K Desktop Environment) and GNOME (GNU Network Object Model Environment)the Two
    of Linux desktops. The default desktop differs by distribution. For instance,
    Fedora defaults to GNOME, and Mandrake/SuSE defaults to KDE. However, you can
    change the default once you decide which desktop you prefer.


    KDE and GNOME are open source software, each developed in a project of its own.
    New versions are released independently of Linux releases or the release of any
    specific Linux distribution. As a result, different distributions include different
    KDE and/or GNOME versions. In addition, KDE and GNOME are very configurable. Almost
    everything about them can be changed. Consequently, KDE and GNOME don''t look
    exactly the same in different distributions or versions of distributions.


    When using this book, remember that your KDE or GNOME may not look exactly like
    the book. Most of the figures in the book are Fedora Core 2 (KDE 3.2/GNOME 2.6)
    and Mandrake 10 (KDE 3.2/GNOME 2.4). Your version may be older or newer. Because
    your KDE and GNOME may not always look and behave exactly as shown in the book,
    it''s best to consider the instructions in this chapter as suggestions, rather
    than an exact map. It provides clues to the most likely places to find configuration
    tools, but not necessarily a detailed route.


    This chapter describes the contents of your desktop and how to use them. Then,
    when you are comfortable with the default appearance and behavior of your Linux,
    you find out how to change everything.'
