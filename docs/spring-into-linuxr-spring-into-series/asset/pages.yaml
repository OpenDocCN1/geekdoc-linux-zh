  md: '# Configuring Multiple Virtual Desktops


    Not only does Linux allow you to configure almost everything about your desktop,
    it also allows you to have multiple desktops, each configured differently. You
    can have one desktop that you use for your financial work and another configured
    for your art projects. The desktops can have different applications available,
    with any other configuration changes that are appropriate for the desktop functionality.


    Multiple desktops are also called virtual desktops. The section of the panel related
    to virtual desktops is shown in [Figure 6-17]().


    # Figure 6-17. Section of KDE panel.


    ![](img/8fd2e743227b42de3b4152272123250b_139_0.png)


    The object with four squares, called the pager, represents the virtual desktops
    available. Square 1, representing desktop 1 is white, meaning desktop 1 is in
    use. Notice that desktop 2 and desktop 4 show open applications, whereas desktop
    1 and desktop 3 do not. The taskbar shows two open applications, which represents
    the applications on all windows. A clicked number to go to the specific desktop.
    Click an application button on the taskbar to go to the application wherever it''s
    open. If it''s on a different desktop, the desktop opens.


    Applications can be moved easily from one desktop to another. When the upper-left
    corner arrow in an open application, you see a menu that includes the items shown
    in [Figure 6-18]().


    # Figure 6-18. Section of KDE panel.


    | Put on All Workspaces |

    | Move to Workspace 1 |

    | Move to Workspace 2 |

    | Move to Workspace 3 |

    | Move to Workspace 4 |


    Select the appropriate item to move the application from one desktop to another
    or to desktops.


    Although the pager shows four desktops, you can actually have more if you need
    them. To set up more desktops, right-click on the desktop and select Configure
    Desktop. Select Multiple Windows from the left pane. The window in [Figure 6-19]()
    opens.'
  merge: -1
