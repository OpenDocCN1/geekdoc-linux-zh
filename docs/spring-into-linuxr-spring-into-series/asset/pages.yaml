  md: '# File Types


    Although Linux handles other types of files (such as block device), this chapter
    only discusses ordinary, also called normal, files and symbolic links. Ordinary
    files include data, configuration, text, graphics, directories, and other files.
    Links are filenames that only point to another file. Ordinary files are categorized
    by the information they contain. Linux desktops and applications recognize file
    types by the file extension, as Windows recognizes .doc as MS Word files.


    File extensions are associated with an application. When double-click a file,
    the file extension determines which application the file is opened in. A document
    with a .sxw extension is opened in OpenOffice. New applications usually create
    associations for their file extensions during installation.


    You can change the associations if necessary. To add or edit an association, highlight
    a file with the extension, right-click, and select Edit File Type to see the screen
    on the right. The top pane shows .HTML, .htm, and .HTM being opened by Konqueror.
    Click Add to add an extension using a pattern, such as .abcdef. Linux extensions
    can be any number of characters, not just three.


    ![](img/8fd2e743227b42de3b4152272123250b_195_0.png)


    More than one application can be listed in the lower pane. For instance, you could
    add Mozilla before Konqueror. The file is opened in Mozilla if possible; if not,
    the file opens in Konqueror. Clicking the Add button displays a list of applications
    to select from.


    Whereas desktops and applications recognize extensions, Linux doesn''t. It looks
    inside a file to'
