  md: "# rename (rename series of files)\n\nRenames files by changing part of the\
    \ filename. Useful for changing several similar filenames at one time.\n\n```\n\
    Format:    rename currentname new files\nExamples:  rename rep oldrep rep*\n \
    \          rename doc projdoc *doc*\n```\n\nChanges the first string to the second\
    \ string in all files that match the pattern. The first example changes files\
    \ named rep1.doc, rep2.doc, rep3.doc, and so on to new names oldrep.doc, oldrep2.doc,\
    \ oldrep3.doc, and so forth. The second example renames all files with doc anywhere\
    \ in their names to projdoc; for instance, newdoc1 becomes newprojdoc1, newdoc2\
    \ becomes newprojdoc2, and so on."
