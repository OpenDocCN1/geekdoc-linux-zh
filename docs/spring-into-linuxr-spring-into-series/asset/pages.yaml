    To create or modify a style, click Format on the menu bar and select Style Catalog.
    The window in Figure 11-2 opens.


    # Figure 11-2. Styles window.


    ![](img/8fd2e743227b42de3b4152272123250b_229_0.png)


    As Default is currently selected, the settings for the default style are shown
    in the screen that opens when you press New or Modify. Different windows, depending
    on the type of style you are modifying or creating. Modify makes changes to the
    selected style. New creates a new style with the settings of the current style.
    After you make the modifications, you give the new style a new name. After using,
    you have the same style plus the new style with different settings. After using
    new, you have the same style with the old settings plus the new style with the
    new settings.


    Clicking Organizer allows you to copy styles from one template to another. Templates
    are discussed later in this chapter.'
  merge: -1
