  md: '# The Panel


    The panels for the desktops are shown in Figure 6-6. The KDE panel is the top
    panel; the GNOME is the bottom panel.


    # Figure 6-6. KDE and GNOME panels for Fedora


    ![](img/8fd2e743227b42de3b4152272123250b_121_0.png)


    The panels have the five components, from left to right:


    +   **Icon bar:** The section on the left that contains application icons. It''s
    also called the application launcher. Clicking an icon starts animation. Moving
    the mouse pointer over an icon displays the application name in a tool tip.

    **Pager:** The four-pane window that switches between virtual desktops.

    **Taskbar:** A section that contains items for any open applications. The KDE
    panel shows one open applicationopenX Settings. The GNOME panel shows two open
    applicationsOpenOffice and the Mozilla browser. Clicking an application on the
    panel opens it if it is minimized and brings it to the top of the open applications
    on the desktop.

    **System tray:** The section on the right that contains icons for useful system
    applications that you access directly on the panel, rather than in a window. The
    clock is farthest on the right. If you move the mouse pointer over the clock,
    the date displays in a tool tip. If you click the clock, a one-month calendar
    displays. You can move forward or backward through the calendar in monthly or
    yearly jumps. If you right-click on the clock, a menu displays allows you to perform
    tasks, as adjusting the date and changing the time. This type of application is
    called an applet.

    **Panel-hiding button:** The little arrow on the end(s) of the panel. Clicking
    the arrow causes the panel to slide off the desktop, leaving only a little arrow
    that you can click to bring the panel back onto the desktop.


    Notice the leftmost icon is the red fedora that opens the main menu, discussed
    earlier in this chapter.'
  merge: -1
