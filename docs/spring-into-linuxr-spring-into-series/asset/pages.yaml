  md: "# For Loops\n\nA for loop repeats commands once for each item in a list of\
    \ arguments. The general format of a for loop is:\n\n```\nfor index in list\n\
    do\n    commands\ndone\n```\n\nThe index is a variable name. It takes on a value\
    \ from the list with each iteration of the loop. The list of arguments through\
    \ which for loops. A simple for loop is:\n\n```\nfor name in John Sam Paul\ndo\n\
    \    echo $name\ndone\n```\n\nItems in the list can be separated by a space or\
    \ by the end of a line.\n\nYou can provide the for loop with list of arguments\
