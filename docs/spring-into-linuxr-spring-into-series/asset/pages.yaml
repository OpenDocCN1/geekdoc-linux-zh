- img_proc: true
  md: '# # Chapter 14. Printing


    Printing on Linux, as on Windows, requires a printer driver that is specific to
    the printer connected to your computer. The printer driver sends the information
    from the computer to the printer in the format that particular particular printer
    understands. Therefore, Linux needs to know the manufacturer and model of the
    printer, so that the correct printer drivers are used.


    A printer can be connected directly to your computer. If your computer is connected
    to a LAN (local area network), you can send files to a printer that is connected
    to another computer on the LAN or directly to the LAN. You specify the type of
    connection when you install the printer.


    Files sent to the printer are sent to a queue that is associated with the printer.
    The printer job waits in the queue until its turn to print. You can create more
    than one queue to a printer, although you are unlikely to need to. If a printer
    is a network printer, print jobs from more than one computer on the network can
    be sent to the same queue.


    The software that handles printing for most Linux systems is called CUPS (Common
    UNIX Printing System), CUPS handles all the details from clicking the Print button
    on the application to passing the data to the printer in an understandable format.
    LPRng is another printing system available on most Linux systems, but it''s rare
    that you would choose to use it rather than CUPS.'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# Installing Your Printer on Fedora


    On Linux, files to be printed are first sent to a queue, where they await their
    turn to print on a specific printer. Before you can use your printer, you need
    to set up at least one queue for the printer. Most Linux distributions provide
    a utility with a GUI that makes it easy to set up your printer.


    Before you start installing your printer, be sure it''s connected to the computer
    and turned on, that Linux can recognize it. You must use the root account.


    On the Fedora main menu, select System Settings->Printing. The window in Figure
    14-1 displays.


    # Figure 14-1. Printer configuration window.


    ![](img/8fd2e743227b42de3b4152272123250b_290_0.png)


    If the configuration window opens, it displays any printers currently configured.
    In this figure, no printers are currently shown. Click New to start printer installation.
    In the print queue windows, click Forward to move to the next window or Back to
    return to a previous window.


    +   1. An Add Printer queue opens.

    2. A window requests the name and description for the printer. A short name that
    you can remember. A description with more information if you have more than one
    queue, so you can identify which is which.

    3. A Queue type window opens. Select the appropriate item from the "Select a queue
    type" dropdown-list at the top.


    r

    3. A Queue type window opens. Select the appropriate item from the "Select a queue
    type" dropdown-list at the top. If your printer is connected to your computer,
    select Locally-connected. Other choices might be Networked Windows (the printer
    is connected to a Windows computer on the same network or Networked CUPS (the
    printer is connected directly to the network, rather than to a specific computer).


    The list shows the printer connections found of the type selected. For instance,
    if Locally-connected is chosen, you may see /dev/lp0.'
  merge: -1
