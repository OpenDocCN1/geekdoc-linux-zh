    Alice Brown

    one

    John Huang

    ```


    ```

    cat fileB

    Bob Smith

    Alice in Wonderland

    John Huang

    ```


    ```

    diff fileA fileB

    <John Smith

    <Alice Brown

    --

    >Bob Smith

    >Alice in Wonderland

    ```


    | Opt | What It Does | Example |

    |---|---|---|

    | -b | Treat groups of blanks as one | diff -b file file2 |

    | -B | Ignore blank lines | diff -B prog1 prog2 |

    | -c | Display 3 lines surrounding each changed line | diff -c file /home/jane
    |'
