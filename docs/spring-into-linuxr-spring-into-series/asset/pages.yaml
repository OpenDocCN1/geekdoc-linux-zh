  md: '# The Gallery


    OpenWriter provides a gallery to organize your graphic and sound files. Writer
    includes several objects in the gallery and you can add files to it. To access
    the gallery, Click Tools and select Gallery. The gallery opens at the top of your
    document, between the toolbars, as shown in Figure 11-8.


    # Figure 11-8. The gallery.


    ![](img/8fd2e743227b42de3b4152272123250b_244_0.png)


    When you select a theme, the graphics are shown in the right pane. You can select
    any object and drag it into your document.


    Graphic files can be added to the gallery without being moved into the Gallery
    directory. To add graphics to the gallery, click New Theme or highlight a theme,
    right-click, and select Properties. Click Find Files to locate the directory that
    contains the graphic you want to add. When you select a directory, all the graphic
    files in the directory are shown in the list box. Highlight the filename and click
    Add. Or, click Add All.


    Two buttons at the top of the gallery, to the right of the New Theme, allow you
    to switch the gallery display by icons, as shown, or a listing that includes the
    path to the file of the gallery object.'
  merge: -1
