  md: '# Creating a Message Filter in Mozilla


    When you click New in the window shown in Figure 17-7, the window in 17-8 opens.


    The conditions to match are set up in the top pane. The first field specifies
    what to match, such as subject, sender, body, date. The second field specifies
    a type of match, such as contains, doesn''t contain, begins with, ends with. In
    the third field, type the characters for the match. For instance, a match might
    be Body contains big raise. To add another match condition, More. If you have
    more than one match condition, check "Match all of the following" or "Match any
    of the following."


    The bottom panel specifies what to do when a match is found. A common choice is
    to move the message into a folder. Click "Move to folder" and indicate which folder.
    The drop-down list allows you to select any existing folder. You can click New
    Folder to create a folder for messages that match this filter. Other actions for
    handling messages that match are to flag the message, mark the message, or change
    its priority.


    Enter a name for the filter in the Filter Name field at the top. Enter any name
    that''s meaningful to you.


    You can also create a filter from a message. Right-click the From line of the
    open message and select Create Filter from Message.'
  merge: -1
