  md: '# Summary


    Graphic images are stored in files one of several graphic formats. .bmp (mainly
    used for Windows files), .gif, .jpg, .png (3 formats for Web images), and .tif
    (used for exchanging graphics files between operating systems). To view a graphic
    image on the screen, you must use an application that understands the specific
    graphic format. Konqueror can understand and display most graphic formats.


    Images are obtained from several sources. This chapter discusses how to obtain
    images from the following sources:


    +   - Scanner: Describes scanning using the Kooka application

    - Digital camera: Describes moving pictures from the camera to the computer using
    Konqueror

    - Screen shots: Shows how to take screen shots using Ksnapshot or the GIMP

    - Creating using an application: You can create your own images. Or you may need
    to edit images. This chapter describes how to create and edit three types of graphics
    using applications that are installed on almost all Linux distributions:


    +   - Drawings: Describes how to create and edit drawings using OpenOffice Draw

    - Presentation Graphics: Describes how to create and edit slide shows using OpenOffice
    Impress

    - Pictures: Describes how to create and edit images using the GIMP'
  merge: -1
