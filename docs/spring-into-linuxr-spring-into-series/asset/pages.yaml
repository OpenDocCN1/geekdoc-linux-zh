  md: '# Newsgroups


    Newsgroups are discussion groups on the Internet provided by Usenet. Each newsgroup
    is devoted to a specific topic, any topic you can think of and many that would
    never occur to you. A newsgroup is analogous to a public message board for a specific
    subject. Anyone can post a message to the newsgroup. Anyone can read all the messages
    posted. Anyone can respond to any message, posting a response.


    Newsgroups are available two ways:


    +   - Web site: Many Web sites offer access to newsgroups. Using your browser,
    you read and post messages at the Web site. Some sites offer a subset of newsgroups.
    Others let you read, but not post. Some Web sites change for newsgroup access.


    For example, Google provides access to Usenet Newsgroups. On the Google search
    page, click Groups. One choice on the resulting page is All Usenet Newsgroups.
    You can read the public messages. If you want to post to a newsgroup, you need
    to create a Google account.


    +   - Newsgroup server: You can receive newsgroups directly from a newsgroup server.
    Many ISPs provide a newsgroup server, although only a subset of available newsgroups.
    Large organizations might provide one. Or, you can independently purchase a access
    to a newsgroup server for a monthly fee from a Usenet news service, such as www.newshosting.com
    and www.easynews.com.


    To access Usenet groups directly from a server, you need newsreader application
    software on your computer. Mozilla provides a newsreader. It can be quite convenient
    to receive and post newsgroup messages in the same application that handles email
    messages. The rest of this section describes using Mozilla to read newsgroup postings.


    Using Mozilla mail, newsgroups postings arrive in your mail window looking very
    similar to email messages. Before you read and post messages, two steps are required:


    +   1. Create a newsgroup account.


    +   2. Subscribe to newsgroups of interest.


    To create a newsgroup account, click File and select New->Account. The screen
    shown in Figure 17-1 opens. Newsgroup. The new account procedure requests the
    needed information of the newsgroup server you want to use.


    To subscribe to newsgroups, highlight the newsgroup account in the Mozilla sidebar.
    Click File. Click Subscribe. The window in Figure 17-11 opens.


    # Figure 17-11. Newsgroups subscribe window.'
