  md: '# # The Command-Line Interface on Linux


    The command-line interface (CLI) is a text environment in which you type commands
    for Linux to execute and Linux displays messages in response. In the CLI, you
    use the keyboard, rather than the mouse, to send instructions to Linux. When you
    are working with the CLI, you are interacting with a program called a shell. The
    shell accepts your commands, processes them, and passes them into the kernel,
    the part of Linux where the basic work takes place. Linux offers a choice of several
    shells, but this book provides only information for Bash, the most popular shell.


    Linux can boot directly into a command-line environment. You see a screen that
    is mainly, waiting for your input. Rather than seeing a login window, you use
    your account ID and password on a blank command line. In this type of setup, you
    use the CLI exclusively. Users with this type of setup don''t generally use the
    desktop at all.


    Often, users want to use the GUI for certain tasks. These users set up Linux to
    boot to the desktop. When they want to use the CLI, they can open a CLI window.

    The is easier to use than the CLI. On the desktop, you select tasks from menus.
    In the CLI, you need to type the command. It is up to you to know which command,
    how it''s spelled, what arguments and options produce the desired effects, and
    how to interpret the text output. However, the CLI has some advantages that make
    its use attractive in some situations:


    +   * Faster execution: The GUI brings with it a certain amount of overhead, as
    drawing graphics on the screen, which takes time. When you type commands directly
    into the CLI, commands execute without the GUI overhead.


    +   * Shorter command entry: In some cases, typing a command takes less time than
    navigating through menus. Often, file management and other system tasks can be
    entered more quickly at the command line by using menus. In addition, the CLI
    allows you to chain commands together, resulting in a single output, in a way
    not possible in menus.


    +   * Fewer resources: The GUI requires disk space, memory, and other computer
    resources. When running Linux on an overpowered computer, running without the
    GUI might be necessary.


    +   * More functionality: Some commands and options to commands are not available
    on a menu. They can only be executed from the command line.


    Using the command-line interface is discussed in detail Chapter 7.'
  merge: -1
  pgno: 110
- img_proc: true
  md: '# Choosing the Interface


    The installation procedure for most Linux distributions provides the opportunity
    for you to select the software you want to install. In general, there''s a default
    set of applications, or perhaps different sets of applications, that you can choose
    from. In addition, you probably have the opportunity to include or remove any
    applications from the set being installed.


    During Fedora installation, for example, a screen is displayed that lists the
    default set of packages, including GNOME, to be installed. The screen gives you
    the choice to install the default set or to customize the software packages to
    be installed. If you select customize, a screen allows you to check and uncheck
    software packages. GNOME is checked by default. You can check KDE in addition
    to GNOME or instead of GNOME. You can even uncheck both.


    If you installed GNOME or KDE, your system boots to the installed desktop. If
    you installed both, most distributions provide the opportunity to select which
    desktop you want when you log in. Neither desktop was installed, your computer
    will enter the command-line environment when you log in.


    If your computer boots into a GUI and you want to boot into the CLI, or vice versa,
    you can change the default boot interface by editing a file called initab. Linux
    reads this file for instructions when it starts up. You need to locate this file,
    probably in /etc. Chapter 9 tells you how to find files. To change your interface,
    you need to edit the following line in initab (Chapter 18 discusses editing text
    files):


    ```

    id:initdefault:

    ```


    n is a number that causes Linux to boot to the GUI or the CLI; 5 signals the GUI
    and 3 signals the CLI. Change n to the number for your preferred interface.'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# Summary


    Linux is an operating system that runs your computer. When you work on your computer,
    the interface provides the communication between you and the Linux kernel, the
    part of Linux where the low-level work takes place. The kernel communicates directly
    with the hardware to save files on the hard disk, send data streams to the printer,
    send information out onto the network, and other basic tasks. Your instructions
    are accepted by the interface, processed, and passed into the kernel. Linux provides
    two types of interface that you can use for instructions: a graphical user interface
    (GUI) and a command-line interface (CLI).


    The GUI provides graphical images that can be selected with the mouse. One popular
    GUI is desktop, made popular by Windows. A desktop is designed to represent the
    top of your office desk work space with tools on it. Linux offers two popular
    desktop environments: GNOME (GNU Network Object Model Environment) and KDE (K
    Desktop Environment). Because both emulate a desktop, they are similar in many
    ways. Both resemble Windows and provide the same features, such as windows, icons,
    menus, etc. The differences between GNOME and KDE are mainly in the administrative
    utilities, the tools for configuration, and the default applications for installation
    with the desktop. Which desktop you use is mainly a matter of personal preference.
    You may want to try both GNOME and KDE before you decide. A desktop is discussed
    in Chapter 6.


    The CLI is a text environment. You type commands for Linux to execute and Linux
    displays text messages in response. When you are working with the CLI, you are
    interacting with a program called a shell. The shell accepts your commands, processes
    them, and passes them into the kernel. Using the command-line interface is discussed
    in Chapter 7.


    Linux can open a desktop at startup or boot directly to a command-line environment.
    Most users prefer Linux to start with a desktop. When the user wants to use the
    command line, he or she opens a CLI window.'
