  md: '# Creating Shortcuts for Long Commands


    You might have a long command that you type often. If so, you can create a short
    alias for the long command, so that you don''t have to type the long command every
    time you need it. You can type the short alias instead.


    For instance, the following command creates the alias listall aliases for the
    four ls commands:


    ```

    alias listall=''ls /home/janet; ls /home/kim; ls /home/george; \

    ls /home/sam''

    ```


    You can now type listall to display the files in all four directories.'
