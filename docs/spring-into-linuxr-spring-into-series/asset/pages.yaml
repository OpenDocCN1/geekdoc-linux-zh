- img_proc: true
  md: "# Infinite Loops\n\nLoops can be infinite loops. That is, loops that continue\
    \ repeating forever. Infinite loops are seldom written deliberately. They usually\
    \ result from a scripting error. No one is immune.\n\nThe following program results\
    \ in an infinite loop:\n\n```\n#!/bin/bash\nwhile [ $n -lt 10 ]\ndo\n n=0\necho\
    \ $n\nlet n=$n+1\ndone\n```\n\nThe output from this program is:\n\n```\n0\n0\n\
    0\n0\n...\n```\n\ncontinuing forever because infinite mistake $n is set to 0 at\
    \ the beginning of each loop. Therefore, $n will never become equal to 0. So,\
    \ the loop will never stop.\n\nAnother scripting mistake is to leave out the statement\
    \ that increments the value being tested. For instance, if you left out the let\
    \ command in the above script, you would create an infinite loop.\n\nYou can stop\
    \ an infinite loop with <Ctrl-c>. Perhaps more than one <Ctrl-c>. It should break\
    \ out of the script. Also, a <Ctrl-z> works. It stops the script. Sometimes the\
    \ output will continue to display for time, but it will stop shortly."
  merge: -1
