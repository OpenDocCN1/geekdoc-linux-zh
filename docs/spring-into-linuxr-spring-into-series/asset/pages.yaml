    \ of the date command.\n\n```\n#!/bin/bash\n# Script name: splitdate - outputs\
    \ parts of the date in a column\nfor part in `date'\ndo\n    echo $part\ndone\n\
    ```\n\nWhen you run the script, you see:\n\n```\n./splitdate\nMon\nJan\n10\n15:02:34\n\
