  md: "# find (find finds)\n\nSearches specified directories for files or groups of\
    \ files.\n\n```\nFormat:    find directories conditions\nExamples:  find /home/janet\
    \ -name \"file*.txt\" -print\n           find . -type d -print\n```\n\nThe first\
    \ example searches the directory /home/janet, and all its subdirectories, for\
    \ any files that begin with file and end with .txt. The second example searches\
    \ the current directory, and its subdirectories, for directories and displays\
    \ their names.\n\nRather than options, find uses conditions that are listed after\
    \ the argument (the path to search). Some conditions are:\n\n| Condition | What\
    \ It Does | Example |\n|---|---|---|n| -amin +n|-n|n | Find files with last access\
    \ date more than, less than, or n minutes ago | find -amin +30 |\n| -anewer |\
    \ Find files accessed more recently than file | find -anewer report6 |\n| -atime\
    \ +n|-n|n | Find files with last access date more than, less than, or n days ago\
    \ | find -atime -5 |\n| -cmin +n|-n|n | Find files with last changed date more\
    \ than, less than, or n minutes ago | find -ctime +5 |\n| -cewer | Find files\
    \ changed more recently than file | find -cewer report8 |\n| -ctime +n|-n|n |\
    \ Find files with last changed date more than, less than, or n days ago | find\
    \ -ctime +5 |\n| -group group | Find files owned by this group | find -group janet\
    \ |\n| -iname n | Find files that match pattern. Ignore case. | find -iname A\
    \ |\n| -maxdepth n | Search only n levels of subdirectories | find -maxdepth 2\
    \ |\n| -mindepth n | Search only deeper than n levels | find -mindepth 2 |\n|\
    \ -mtime +n|-n|n | Find files with last modified date more than, less than, or\
    \ n minutes ago | find -mtime 5 |"
