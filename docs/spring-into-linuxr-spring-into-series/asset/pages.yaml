  md: '# Editing the Spreadsheet Content


    The process of adding and editing spreadsheet content are familiar. Type numbers,
    text, or formulas into cells; delete cell contents with <Backspace> or <Del>;
    replace text by highlighting it and typing new over it. The Edit menu contains
    familiar items, such as copy, paste, and find and replace. You can insert a row
    or a column by clicking-a number or letter. You can insert cells by clicking-a
    cell.


    Calc provides an automatic fill feature. When you select a cell, the lower-right
    corner shows a small box. If you drag box some cells, the contents of the cell
    are inserted into all cells highlighted. If the cell contains a number or a month,
    the value is incremented in each cell.


    When you split your spreadsheet, either horizontally or vertically, you can edit
    two parts of spreadsheet at once. Highlight any cell (except A1) in row 1 to split
    vertically or in column A to split horizontally. Click View. Split Window. The
    window splits at the selected cell. You can drag to resize the window. To return
    to a single window, select View->Split Window again.


    You can make any selection of rows or columns or non-scrolling to keep the labels
    on the screen. Click Window. Select a cell below the row that you don''t want
    to scroll and to the right of the column that you don''t want to scroll. Click
    Window. Select Freeze. For instance, if you select B2, both row 1 and column A
    will stay on the screen when you scroll. If you select cell A2, only row 1 will
    stay on the screen.


    OpenOffice provides a Navigator, a tool for moving around the spreadsheet and
    moving elements of the spreadsheet to different locations. Use of the Navigator
    is described in Chapter 11, in the section "Editing Document Contents."


    You can add graphics to a spreadsheet, just as you can to a document. Graphics
    can be inserted from another file or draw directly into the spreadsheet using
    the OpenOffice drawing tools. Graphics in spreadsheets are handled the same as
    graphics in word processing documents, as described in Chapter 11.


    You can create and edit charts in your spreadsheet. Highlight the cells you want
    to include in the chart. Click Insert. Select Chart. A wizard opens that allows
    you to select the type of chart (bar chart, pie chart, etc.), labels, and other
    features and creates changes to provide the spreadsheet, the main toolbar (on
    the left) you can double-click several buttons that change the appearance of the
    chart. For more changes, you can double-click any element in the chart to see
    an element-specific window that allows you to change the borders, colors, fonts,
    labels, transparency, etc.'
  merge: -1
  pgno: 257
- img_proc: true
  md: '# Formulas and Functions


    In any other spreadsheet, Calc lets you enter formulas. Formulas can add (+),
    subtract (-), multiply (*), divide (/), or raise to a power (^n). They can include
    greater than (>), less than (<), greater than equal to (>=), less than equal to
    (<=), or not equal to (<).


    To enter a formula, select a cell and type =. All formulas must begin with an
    equal sign. Type the formula following the =.


    Many functions are available that assist in entering formulas. Functions accept
    a range of cells indicated by a colon (:), such as B2:B5, and a series of cells
    indicated by a semicolon (;), such as B2;B4;B8. For instance, you can add the
    cells B3, B4, and B5:


    ```

    =SUM(B3:B5)

    ```


    Sum is such a popular function that it has a button on the formula toolbar middle
    icon shown on the right. Select the cell where the sum should go and click the
    Sum icon. Calc will guess the range of cells to sum, selecting them with a blue
    box. You can change the range by dragging the corner handle of the blue box.


    You can find the function you need by clicking the first icon shown on the toolbar
    above, before the Sum icon. The window in Figure 12-4 opens.


    # Figure 12-4. Functions window.


    [View full size image]'
  merge: -1
  pgno: 258
- img_proc: true
  md: 'The functions are shown in the list box, by category. When you double-click
    a function, fields are available to enter the numbers or cell names needed.


    ![](img/8fd2e743227b42de3b4152272123250b_259_0.png)'
  merge: -1
