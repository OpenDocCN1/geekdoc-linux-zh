  md: '# # Configuring the Terminal Window


    You can configure the terminal window to your liking. You can change the colors,
    the font size, the opening window size, the sounds, and other characteristics
    of the terminal window. Both KDE and Gnome allow configuration, but the method
    used to make changes differs.


    The terminal window has a menu across the top. The Settings drop-down menu where
    you can change your window settings is on the right. You can show or hide the
    Menubar (top) and the Toolbar (bottom). You can have the Scrollbar on either the
    left or right side. You can change the window size to full screen or can select
    the Size menu item to specify a window size. If you select Font, you see a menu
    that allows you to change the font size. History allows you to set your options
    for the history list of commands that you have executed. Schema, the highlighted
    item, allows you to set your text and background colors.


