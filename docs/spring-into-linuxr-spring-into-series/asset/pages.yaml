  md: '# Planning Your Computer System


    Linux can be installed alone on your computer or be installed together with another
    operating system, such as Windows. If it''s installed with another operating system,
    you see a menu when you start your computer that enables you to choose which operating
    system you want to boot. This type of system is called a dual-boot system, or
    multiple-boot if you have more than two operating systems. Your first decision
    is whether you want Linux running on your computer or together with another operating
    system. Reasons for running more than one operating system include the following:


    +   - To learn systems.

    - To learn Linux without giving you Windows.

    - To use operating system specific applications. Application software can''t run
    on both Windows and Linux, although some software has two versonance on Linux
    and one that runs on Windows. You may want to use one application that runs on
    Linux and another that runs on Windows.

    - To test applications on both systems. If you develop a computer application,
    you can test it whether it runs on both systems.


    A dual-boot system has the following disadvantages:


    +   - Slower to boot up. It goes through the process of displaying the boot menu
    each time.

    - Less disk space for each operating system.

    - More maintenance required. An operating system requires maintenance, such as
    updating to newer versions and updating software. Two systems require more maintenance
    work than one system.

    - More organization required. If you work on two different systems, you need to
    organize your work so that you have what you need where you need it. Invariably,
    the file you need for application is stored under the other application.


    If you plan to have only Linux installed on your computer, your preparation is
    easy. You don''t need to prepare your hard disk at all. If you plan to run Linux
    together with another operating system, you need to prepare your hard disk. See
    the next section for information on running Linux and Windows together.'
  merge: -1
  pgno: 43
- img_proc: true
  md: '# Running Linux with Windows


    You can install Linux and Windows on your computer, although only one operating
    system is running the computer at any given time. A menu is displayed allowing
    you to select which operating system to boot. Each operating system is installed
    in a separate section of your hard disk, called a partition.


    To install Windows on your hard drive, you need to have Windows already installed
    in a partition and enough free space on your hard disk. Thus, When Windows is
    installed, you can install it in a partition that does not take up your entire
    hard disk, leaving room for Linux. The Windows installation instructions will
    tell you how to do this. For example, when installing Windows XP on a hard with
    no existing version of Windows, you will see a screen that displays the partitions,
    giving you choices where Windows can be installed. The only partition is probably
    "unpartitioned space" showing your entire hard disk. Select the "Create a new
    partition from unpartitioned space." When the new partition is displayed, select
    a partition size that is smaller than your hard disk, leaving room for Linux.


    When you install Windows 2000 or XP, you can select the type of file system for
    the Windows partition. NTFS and FAT32 are the most common types. Although NTFS
    has many advantages (such as, security and efficiency), it has disadvantages in
    a dual-boot system. In this time, it''s difficult for Linux to read/write an NTFS
    file system, preventing file sharing between the partitions. In addition, NTFS
    file systems can''t be resized easily if you want to make room for another partition.
    For a dual-boot Linux, FAT32 may be preferable.


    If Windows is already installed on your computer taking the hard disk, you need
    to resize the Windows partition to a smaller size to make room for Linux. You
    can do this with a utility on the Linux CD called FIPS. However, FIPS cannot resize
    a Windows XP NTFS partition. As of this writing, the solutions are to purchase
    Partition Magic, which can resize it, or to install Mandrake Linux, which can
    resize the Windows partition during installation, making room for it. Another
    suggestion is to install an additional hard disk and install Linux there. If the
    partition is not a Windows XP partition, see the section [Making Room for Linux
    Before Installation](# in this chapter.


    If you don''t know one or two hard disks or how your hard disk is partitioned,
    you can use Windows Administrative Tools to look at your hard drive, as described
    in the following section, [Examining Your Hard Drive](#).'
  merge: -1
