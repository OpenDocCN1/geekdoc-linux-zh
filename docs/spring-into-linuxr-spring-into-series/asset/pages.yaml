  md: '# File Permissions


    Because Linux is a multi-user system, directories and files need to be protected
    from unauthorized use. Each directory and file has associated permissions, settings
    that determine who can access the file and what they can do with it.


    Permissions to the file are given to three types of user accounts:


    +   - Owner: The account that owns the file

    - Group: Members of a group that owns the file

    - All users: All accounts on the system


    Users can be given permission to one or more of three things to the file:


    +   - Read: Look at the contents of the file

    - Write: Save the file to the hard disk

    - Execute: Run the file or enter the directory


    The permissions can be given in any combination. For instance, file1 might have
    permission as follows:


    +   - Owner: Read, write, execute

    - Group: Read, execute

    - All users: Read


    The owner can look at, edit, save, and run the file. Members of the group can
    only look at and run the file, but they cannot change it. Everyone on the system
    can look at the contents of the file. Remember that a directory is simply a file,
    so directories can be given the same type of permissions as a file.


    File permissions are often displayed in a shorthand format as:


    ```

    rwx--r--

    ```


    The r, w, and x stand for read, write, and execute, as described earlier in this
    section. The 9 characters represent three groups of three: rwx r-- and r--. The
    first group displays the permissions for the owner, the second is the permissions
    for the group, and the third is the permissions for everyone. In this case, the
    owner can read, write, and execute the file, but the group and all users can only
    read the file, not write/execute it. Only the owner or the root account can change
    file permissions.'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# # Changing Permissions


    You can change the permissions for a file using the Properties screen shown in
    Figure 9-2. To open the permission screen, right-click the file to be changed
    and select Properties. Then, click the Permissions tab.


    # ## Figure 9-2. File information.


    ![](img/8fd2e743227b42de3b4152272123250b_191_0.png)


    The screen shows the permissions for each of the three types of accounts. If you
    click the button for a particular account type, you see three choices: Forbidden,
    Can Read, and Can Read & Write. If you want to execute permission to the file,
    check the Execute box. When the settings are right, click OK.


    On the command line, the chmod command is used to change the permissions. The
    format is one of the following:


    ```

    chmod accounttypes+permissions filename

    chmod accounttypes-permissions filename

    chmod accounttypes=permissions filename

    ```


    The three account types are indicated by letters: u for user, g for group, c for
    others, and a for all account types. The permissions are r, w, and x, as discussed
    previously. The three symbols that assign permissions are + (plus) to add permissions,
    - (minus) to remove permissions, and = (equal) to set new permissions. Thus, one
    command might be:'
  merge: -1
  pgno: 191
- img_proc: true
  md: '```

    chmod g+w file1

    ```


    The command gives write permission to the group for a file named file1. It doesn''t
    change any other permissions for the file. If the group already had read permission,
    it still has read permission. Another command might be:


    ```

    chmod g-w file1

    ```


    The command removes write permission to the group for the file without changing
    any other permissions for the file. Another command might be:


    ```

    chmod go=x file1

    ```


    The command execute permission to group and all accounts on the file. Group and
    all other accounts are not given read or write permissions. Because u was not
    specified in this command, the permissions for the owner are not changed. You
    can set all permissions at once using:


    ```

    chmod a=r file2

    ```


    The a means all user three account types. All user accounts on the system can
    now look at the contents of file2. However, they can''t write or execute it.'
  merge: -1
  pgno: 192
