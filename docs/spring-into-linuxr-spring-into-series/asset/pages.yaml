  md: "# Working on the Desktop\n\nThe desktop is a workspace with some tools sitting\
    \ on it. When you want to perform a task, you start an application that opens\
    \ in a window on the desktop. You can open many windows at once, each performing\
    \ different tasks, using the same or different applications.\n\nYour desktop offers\
    \ many features to assist you. Many of the following features will be familiar\
    \ to Windows:\n\n+   - **Icons**: You can click icons on the desktop or panel\
    \ to start applications or go to locations. In most distributions, the desktop\
    \ icons activate with a double-click and panel icons activate with a single-click.\
    \ However, this is configurable and some distributions start icons with a single-click.\
    \ You can add, remove, or reorganize icons on the desktop, discussed later in\
    \ this chapter.\n- **Menus**: Linux provides a main menu and many component-specific\
    \ menus. You can add, remove, or edit menu items. When you install a new application,\
    \ a menu item is usually added to the main menu.\n    - **Main menu**: Contains\
    \ available applications and utilities as menu items or items on submenus, similar\
    \ to the start menu on Windows. The main menu is opened by clicking an icon on\
    \ the panel, usually the leftmost. The main menu is a large K for KDE and a foot\
    \ for GNOME. However, distributions use their own logo as the menu icon, such\
    \ as the red hat on Fedora and the green dragon head on SuSE.\n    - **Component-specific\
    \ menu**: Menus to a component open when you right-click the component. If you\
    \ right-click on the desktop background, you see one menu; if you right-click\
    \ on the panel, you see a different menu. If you right-click inside an open window,\
    \ you see still another menu. The menus contains selections that are specific\
    \ to the object.\n- **Tool tips**: Information that displays when you move the\
    \ mouse pointer over an object and it holds for a short time, called hovering.\
    \ You can turn tips on and off.\n- **Windows manipulation**: Windows can be moved,\
    \ minimized, maximized, resized, moved out of the way, or closed.\n    - **Move**:\
    \ Click the top bar of the window and drag the window around the desktop using\
    \ the mouse. Click the button in the upper-left corner and select move.\n    -\
    \ **Resize**: Drag the sides or corners of the window using the mouse. To maximize\
    \ the window to full-screen size, click the middle button in the upper-right corner.\n\
    \    - **Move out of the way**: Double-click the title bar of the window. The\
    \ window rolls up like a window shade. To unroll, double-click the rolled window.\
    \ Click the button in the upper-right corner to minimize the window. If your panel\
    \ has the Show desktop icon, click it to"
  merge: -1
  pgno: 122
- img_proc: true
  md: 'minimize all open windows at once. If the Show desktop icon isn''t present,
    you can add it to the panel, as described later in this chapter.


    +   - Close: Click the x button in the upper-right corner or select close from
    the upper-left drop-menu.


    +   - **Look and feel**: The look and feel of the Linux desktop is very configurable.
    For instance, the desktop background displays a default appearance provided by
    the distribution. The background for Fedora, Mandrake, and SuSE is blue. Fedora
    and Mandrake include logos on the background. However, you can change this background
    to any color, pattern, design, or picture that you want.


    You can change the appearance of all elements of the desktop, such as the window
    borders and title bar and the panel. Linux users often configure their desktop
    with thema unified set of colors and images, even sounds, that integrate all parts
    of the desktop into a single look and feel. Some themes are included with your
    distribution that you can use. Others are available for download from the Web.
    Some people develop their own theme.


    Some behavior of desktop components can also be changed. For instance, icons can
    be configured to activate with a single-click or a double-click. Windows can become
    active when clicked or when the mouse pointer passes over them. Tool tipsinformation
    that displays when the mouse pointer passes over a componentcan be on or off.


    Remember that almost everything is configurable. This section describes the usual
    behavior of desktop components. However, most appearance and behavior is configurable.
    Any distribution might decide to configure your desktop differently. A previous
    user of your system might have changed some features. If the behavior of your
    system is different from the description in this chapter, you can change it to
    your preferred appearance or behavior. Configuring Linux is described later in
    this chapter.


    ![](img/8fd2e743227b42de3b4152272123250b_123_0.png)'
  merge: -1
  pgno: 123
