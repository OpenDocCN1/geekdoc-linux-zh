  md: '# Finding Files


    Linux has excellent file-finding utilities for both the desktop and the command
    line. On the KDE desktop, open the main menu and select Find Files. Or in Konqueror,
    click Tools and select Find Files. The screen in Figure 9-3 opens with blank fields.


    # Figure 9-3. File-finding utility.


    ![](img/8fd2e743227b42de3b4152272123250b_197_0.png)


    Typing *test* for the filename finds all files with test in the name starts *
    is a wildcard meaning any string. Browsing or to /home/jan starts the search in
    the directory. "Include subdirectories" is checked. When you click the Find button,
    files display in the bottom pane. Four directories and four files are found. Two
    of the files and two of the directories are in the subdirectory.


    Clicking the Contents tab displays a screen where you can select the type of file
    and the file contents to search for, such as "Hello World." Clicking the Properties
    tab allows you to search by last date, file size, owner, or group. When you click
    Find, the parameters set in all three tabs are used in the search. GNOME has a
    search utility with very similarity, also accessed from the main menu.


    From the command line, you can use the find command to find files by filename
    or properties and the grep command to find files by content. The find command
    syntax is:


    ```

    find pathname conditions

    ```'
