  md: '# Summary


    Programs and applications on Linux are organized into files. Programs are files
    that contain instructions Linux follows to perform tasks. Applications are one
    or more programs that perform work. A program can be quite simple or complicated,
    but the principle is the same. The program contains instructions that Linux follows.


    You can write programs yourself or use programs and applications developed by
    others. Different Linux distributions include different software, hundreds or
    thousands of applications. The distribution defines a default set of software
    to install. You can modify the set during installation, installing more, fewer,
    or different applications. Or, you can download and install applications after
    Linux is installed to add new software or to update the software you''re using.


    This chapter explains:


    +   * What programs are and how to run them

    * How to use and add Linux commands

    * The formats in which applications are available

    * How to install applications from CDs and from the application Web site

    * How to find application packages on the Internet

    * How to use RPM

    * How to install applications from source code


    The next chapter discusses the most used applicationword processing. OpenOffice,
    an office suite like Microsoft Office, is introduced. Instructions for creating
    and editing documents and using advanced word processing features are provided.'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# Chapter 11. Word Processing


    I think I can safely assume that you are acquainted with word processing. It''s
    the most widely used application among computer users. Word processing is used
    to create documents as simple as a letter or as complex as a corporate report,
    a newsletter, or a legal document. The leading word processors are Microsoft Word
    and WordPerfect.


    OpenOffice is an office suite, similar to Microsoft Office or WordPerfect Office.
    OpenOffice Writer is the word processor in OpenOffice. It has functionality equal
    to either of the leading word processors. It includes all the advanced features,
    such as spell checking, mail merge, storing graphics in the document, drawing
    in the document, and others.


    Word processing applications store both the content of the document and the information
    needed for formatting the text. A word processing file includes information about
    margins, text size, intents, font style and type, and many other things. Different
    word processing documents store the formatting information differently. Consequently,
    one word processing application can''t open documents from another word processing
    program. However, most word processors provide features that allow the exchange
    of documents with major word processors. For instance, Word can convert WordPerfect
    files, and vice versa.


    OpenOffice Writer can read Word files. In fact, it converts Word files more successfully
    than any other application. Word can''t read OpenOffice files in Writer format,
    but OpenOffice Writer can save documents in Word format, so that Word can open
    them. Writer also reads and writes documents in other formats, such as HTML and
    RTF, that are general formats, allowing document exchange with other word processing
    applications. Read more about document formats "Document File Formats."'
  merge: -1
  pgno: 224
