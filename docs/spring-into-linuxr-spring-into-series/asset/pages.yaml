    but you can change it. GNOME is in the list because it was specifically added
    during the installation, as shown in Chapter 4. Failsafe starts Linux without
    a desktop, just with the CLI, discussed in Chapter 7.


    Session type:


    | KDE |

    | KDE |

    | GNOME |

    | IceWM |

    | Default |

    | Failsafe |


    Notice that all three login screens in Figure 6-1 provide a button (Shutdown,
    Halt) that allows you to stop the login if you want.


    ![](img/8fd2e743227b42de3b4152272123250b_116_0.png)'
