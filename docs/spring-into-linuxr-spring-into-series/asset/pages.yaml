  md: '# From the Series Editor


    Barry J. Rosenberg


    A few years ago, I found myself in a new job in which I had to master many new
    skills in a very short time. I didn''t have to become an instant expert, but I
    did have to become instantly competent.


    Photograph courtesy of Ed Raduns


    ![](img/8fd2e743227b42de3b4152272123250b_11_0.png)


    I went to the bookstore but was shocked by how much the publishing world had changed.
    At a place where wit and intelligence had once been celebrated, dummies were now
    venerated. What happened?


    Well, I made a few phone calls, got Aunt Barbara to sew up a few costumes, and
    convinced Uncle Ed to let us the barn as a stage. Or wait... that was a different
    problem. Actually, I made a few phone calls and got some really talented people
    to write books that clever people wouldn''t be ashamed to read. We called the
    series “Spring Into...” because all the good names were already taken.


    With Spring Into..., we feel that we''ve created the perfect series for busy professionals.
    However, there''s rubwe can''t be sure until you tell us. Maybe we''re hitting
    the ball out of the park and straight through the uplights, bending it like Beckham,
    and nding nothing but net. On the other hand, maybe we''ve simply spun a twisted
    ball of cliches. Only you can tell us. Therefore, if anythingpositive or negatives
    on your mind about these books, please email me at


    barry.rosenberg@awl.com


    I promise not to add you to any email lists, spam you, or perform immoral acts
    with your address.


    Sincerely,'
