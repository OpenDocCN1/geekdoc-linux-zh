  md: '# # Forgotten Root Password


    Forgetting your root password is not an insurmountable problem. You can enter
    a new root password by booting your computer in single user mode. This is a special
    mode of operation, used mainly by system administrators for specific tasks. You
    can use this to recover from a lost root password.


    You enter single-user mode when the system starts, from the boot loader screen.
    The Fedora boot loader is shown in Figure 4-18. Notice that it includes some directions:
    ''e'' to edit the command before booting. To enter single-user mode:


    +   While the boot loader screen displays, press <e>. The contents of a configuration
    file are displayed, similar to the following example.


    ```

    root (hd0,0)

    kernel /vmlinuz-2.42.12-2115.npt1 ro=LABEL=/ rhgb

    initrd /initrd-2.42.12-2115.npt1.img

    ```


    +   Use the arrow keys to move to the kernel line.


    +   Press <e> to edit the line.


    +   Add the word single to the end of the line, as follows, and then press <Enter>
    to save the change:


    ```

    grub edit kernel /vmlinuz-2.42.12-2115.npt1 ro=LABEL=/ rhgb single

    ```


    +   Press <Enter> to boot.


    In Mandrake, you can enter single user mode by choosing Failsafe at the boot loader.
    For other distributions, read the documentation. If you use LILO inside GRUB,
    type linux single at the boot prompt.


    When your system finishes booting, it displays a prompt. If it asks for a login,
    enter root. At this point, you can change your root password. Type:


    ```

    passwd root

    ```


    Enter the new password twice when prompted. Then type:


    ```

    reboot

    ```'
  merge: -1
