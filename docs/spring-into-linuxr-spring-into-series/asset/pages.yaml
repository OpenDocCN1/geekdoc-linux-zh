- img_proc: true
  md: '# Document File Formats


    OpenOffice Writer uses XML to store its documents. XML is a widely used, standard
    format for storing information in an application-independent format. An OpenOffice
    Writer document is stored in a file with an .swx extension. The file, however,
    is not a single file; it is a zip archive containing several files required for
    managing an XML document. An .swx file cannot be opened in another word processor.


    You can save your document as other types of files:


    +   - Microsoft Word: All versions of Word back to Word 6.0, with a .doc extension.

    - RTF: A format that most word processing applications understand, for transferring
    programs between applications. If you are unsure what application might need to
    open the document, you can use RTF. The file is saved with an .rtf extension.

    - StarOffice: Word processing application published by Sun. OpenOffice evolved
    from StarOffice. File is saved with an .sdw extension.

    - Text: File that contains only the content, without any formatting. It is given
    a .txt extension.

    - HTML: Document is saved as a file containing HTML code, with a .html extension.


    If you routinely exchange documents with Word users, you can set Writer to save
    documents in Word format by default. Click Tools. Select Options. Click the plus
    sign (+) to Load/Save. Click General. In the Always save as drop-down list, select
    the file format you prefer.


    Writer can read files formatted as Word documents. When you open the file, Writer
    recognizes it as a Word document and opens it correctly. Although Writer can open
    the document, some advanced or complex elements may not be converted correctly.
    The simpler the document, the more it is to convert without problem. Some elements
    that may be converted incorrectly and require manual correction are AutoShapes,
    revision marks, OLE objects, form fields, indices, tables, frames, multicolumn
    formatting, hyperlinks, bookmarks, Microsoft WordArt graphics, and animated characters/text.


    You can save your documents in PDF format. Click File. Select Export as PDF.'
  merge: -1
  pgno: 246
- img_proc: true
  md: '# Tracking Changes


    If one or more people are working with you to produce a document, you can mark
    all the changes you make in the document so your collaborator(s) can see what
    you have done. You can also add notes to the document.


    To mark changes, click Edit and select Changes->Record. Start marking changes,
    but whether you see the revision depends on whether Show is checked. Click Edit
    and select Changes->Show to toggle on or off.


    You can change the ways revisions are marked. Click Tools. Select Options. Click
    the sign (+) beside Text Documents. Click Changes. The window in Figure 11-9 opens.


    # Figure 11-9. Changes options.


    ![](img/8fd2e743227b42de3b4152272123250b_247_0.png)


    You can change the ways insertions or deletions are marked. Note that Color is
    By Author. This means that each author''s revisions are marked in a different
    color.


    You can add notes and/or comments. A comment is associated with a specific revision;
    a note is added anywhere in the document. To add a comment, click on a revision
    mark, click Edit, and select Changes->Comment. A window opens where you can type
    a comment. Click OK. The comment displays in a tool tip when the mouse pointer
    moves over the revision mark.


    To add a link, click any text in the document. Click Insert. Select Note. Type
    the type. Click Author if desired. Click OK. The location of the note is marked
    in yellow. If you move the mouse pointer over the yellow marker, the note appears
    in a tool tip.'
  merge: -1
  pgno: 247
- img_proc: true
  md: 'Changes can be accepted or rejected. When a change is accepted, the revision
    mark is removed from the document, the change history can no longer be recovered.
    When a change is rejected, it''s removed from the document. That is, inserted
    text is removed or removed text is put back in. Click Edit Changes->Accept or
    Reject. The window in Figure 11-10 opens.


    # Figure 11-10. Accept or Reject Changes window.


    ![](img/8fd2e743227b42de3b4152272123250b_248_0.png)


    You can accept or reject a single change or all changes at once. Click the Filters
    to display only specific changes, such as changes by an author or changes by date.


    To stop recording changes, toggle record by selecting Edit->Changes->Record again.


    You can merge two documents into one document, with the changes from both documents
    marked in the merged document. Click Edit and select Changes->Merge Document.
    Select the document to merge. The changes in the selected document are merged
    into the current open document. You can merge additional documents if needed.
    Select Changes->Merge Document and select a document as many times as necessary,
    until all documents, are merged into the current document.


    If you have two versions of the document, you can compare the documents to find
    the changes between them. Click Edit and Compare Document. Select a document to
    compare to the current document. The window in Figure 11-10 opens, showing all
    inserts and deletions. In addition, the revision marks are added to the current
    document, now looks as if it were edited with track changes to produce the document
    it was compared to. The changes can now be accepted or rejected individually or
    all at once.'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# Summary


    OpenOffice is an office suite, similar to Microsoft Office or WordPerfect Office.
    The word processing application in the suite is called Writer. It''s possible
    to exchange documents between Writer and Microsoft Word. Writer can read Word
    files. Word can''t read Writer files, but Writer can write files in Word format.
    The exchange is not necessarily perfect. Sometimes information is not interpreted
    correctly. Most file content is converted successfully. The simpler the document,
    the more likely it is to convert successfully.


    Writer is similar to Word. People familiar with Word will feel at home in Writer.
    However, not everything is exactly the same. Writer has almost all the functionality
    of Word, but the features are not always found at the same location or activated
    in exactly the same manner. This chapter explains how to use the following features
    in Writer:


    +   * Styles

    * Templates

    * Autocorrection

    * Spell checking

    * Tables

    * Columns

    * Frames

    * Graphics

    * Tracking changes


    Another popular application in the OpenOffice Suite is the spreadsheet application.
    OpenOffice Calc is described in Chapter 12.'
  merge: -1
  pgno: 249
- img_proc: true
  md: '# # Chapter 12. Spreadsheets


    Spreadsheet applications are widely used. Spreadsheets organize data into rows
    and columns. You can enter numbers into the spreadsheet and perform mathematical
    operations on them, simple operations or very complex operations. Spreadsheets
    facilitate analysis and "what if" questions. You can also enter text datacolum
    or row labels, comments, notes, etc. Spreadsheets can be simple or extremely complex.


    Calc is the spreadsheet application in OpenOffice. It has functionality equal
    to Microsoft Excel, the includes all the advanced features, such as functions,
    charts, storing graphics in the document, drawing in the document, and others.


    Spreadsheet applications store both the content of the spreadsheet and the information
    needed for formatting it. A spreadsheet file includes information about margins,
    text size, indents, font style and type, colors, and many other things. Different
    spreadsheet files store the formatting information application. Consequently,
    one spreadsheet can''t open files from another application. However, most spreadsheet
    applications provide features that allow the exchange of spreadsheets with major
    applications. For instance, Excel can convert Lotus, QuattroPro, and dBASE files.


    OpenOffice Calc can read Excel files. Excel can''t read OpenOffice Calc files
    in Calc format, but Excel can open them. Calc also reads and writes documents
    in formats, such as HTML and SYLK, that are general formats, allowing the exchange
    of spreadsheets among applications. Read more about document formats in the section
    "Saving and Printing."'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# Creating a Spreadsheet


    When you start OpenOffice Calc from the main menu (Office->OpenOffice Calc), the
    window shown in Figure 12-1 opens.


    # Figure 12-1. OpenOffice Calc.


    ![](img/8fd2e743227b42de3b4152272123250b_251_0.png)


    It opens with a blank spreadsheet, ready for you to enter content.


    You can create a new spreadsheet at any point in OpenOffice, when you are in Calc
    or when you are in Writer, by clicking File and New->Spreadsheet.


    Each spreadsheet is created with three pages, or sheets, named Sheet1, Sheet2,
    and Sheet3 by default. You can change the name of the sheet by right-clicking
    the tab for the sheet, at the bottom of the screen, and selecting Rename Sheet.
    You can add more sheets if they aren''t enough. Click Insert and select Sheet.


    The box on the right of the window is the Stylist. It''s used to apply cell and
    page styles. Styles are discussed later in this chapter.'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# Menus and Toolbars


    The menu and toolbars at the top of the OpenOffice Calc window look very much
    like the Excel menu and toolbars. The menu bar offers the same choices as Excel.


    Like Excel, the top toolbar, called the function bar, performs actions, such as
    open, save, print, copy, and undo. The field on the left shows the URL to the
    spreadsheet currently open. You can type a URL directly into this box to open
    a file.


    Also like Excel, the second toolbar, called the object toolbar, contains icons
    for the object currently selected. The default toolbar contains formatting choices,
    such as font size, color, and number formats. If you select a different object,
    such as a graphic, the object toolbar changes to provide more useful icons. The
    third toolbar provides a place to enter formulas, also similar to Excel.


    Unlike Excel, another toolbar, called the main toolbar, displays down the left
    side of the window. It provides quick access to features such as insert, scroll,
    spellcheck, or sorting.


    Calc provides fly-out toolbars. An arrow pointing down or on an icon indicates
    a fly-out toolbar is available. To access the toolbar, long-click the icon (press
    the mouse button and hold down). The second icon on the main toolbar is the `Insert
    Cell` button. Notice the arrow pointing to the right. Long-clicking the fly-out
    toolbar shown on the right. To select an item on a fly-out toolbar, slide the
    mouse to the desired icon and release the button. You can tear-off the toolbar
    and move it anywhere on the screen.


    ![](img/8fd2e743227b42de3b4152272123250b_252_0.png)


    Tool tips, on, by default, display information about each button. You can get
    more information about each button by clicking `Help` and selecting `Extended
    Tips`.


    All menus and toolbars are configurable. You can select toolbars to display in
    the `View` menu. Select `Toolbars` and click a toolbar name to display or remove
    the toolbar. You can add, remove, reorganize items on the toolbars. Click `View`
    and select `Toolbars-> Customize`.'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# Formatting Cells


    OpenOffice Calc has two formatting options:


    +   * **Manual formatting**: Formatting by highlighting cells, columns, rows and
    clicking toolbar buttons. You can also format manually from the Format menu. You
    can format cells (font, size, color, number format) or pages (background, headers/footers,
    etc.).

    * **Styles**: Styles are collections of formatting that you can apply to one or
    more component of your spreadsheet. In Calc, you can create cell or page styles.
    Calc comes with built-in styles that you can use as is or modify and use. Creating
    and applying styles is discussed later in this chapter.


    Styles allow you to make a formatting change to an entire spreadsheet easily.
    For instance, if you use a default cell style that specifies one font, you can
    change the font in the entire spreadsheet just by changing the font for the default
    style. Styles also can be shared with co-workers for company-wide standard spreadsheets.


    First, select the cells to be formatted. You can select a single cell by clicking
    it, a row or a column by clicking the letter or number, or any rectangular section
    of cells by dragging the mouse across the cells.


    To format from the Format menu, select Cells to see the window in Figure 12-2,
    which allows you to set many formatting optionsnumber, alignment, borders, etc.


    # Figure 12-2. Cell formatting window.


    ![](img/8fd2e743227b42de3b4152272123250b_253_0.png)'
  merge: -1
  pgno: 253
- img_proc: true
  md: '![](img/8fd2e743227b42de3b4152272123250b_254_0.png)


    To move the height of rows and columns with the mouse. Move the mouse pointer
    over the line between two letters or numbers. The pointer turns into line. Drag
    the line to make the row or column larger or smaller. You can also format width
    and height from the Format menu. Select Column to set the column width or Row
    to select the row height.


    Quick formatting is available from the object toolbar. You can set the font and
    size with the drop-down lists. You can click icons for bold, italics, and underline,
    set colors for text and background, aligns the contents of the cells vertically
    and horizontally, and turns borders on off. You can format numbers as percentages
    or change the number of decimal places by clicking the icon repeatedly.


    OpenOffice Calc is installed with built-in styles. To apply styles, use the Stylist
    list box in Figure-12 that provides available styles, listed by type. The two
    icons above the list box show the list between cell and page. To apply a style
    to the cell, double-click the desired style in list.


    To create or modify a style, click Format on the menu bar and select Style Catalog.
    The Style Catalog window opens (in Figure 11-2), in which you can create or modify
    styles. When you press New or Modify, the window shown in Figure 12-2 displays,
    the values for the currently selected style. Modify makes changes to the selected
    style. New creates a new style with the styles of the current style. After you
    make the modifications you need, provide a name for the new style. After using
    modify, you have the same style with different settings. After using new, you
    have the same style with the old plus new with the new styles.


    You can apply conditional formatting to cells. Click Format and select Conditional
    Formatting. You can apply styles to cells based on the values in the cell. For
    instance, you can direct Calc to apply style "large" to cells whose value is higher
    than 100.


    Stored formatscollections of shading, colors, and bordersare available for you
    to the the'
  merge: -1
  pgno: 254
- img_proc: true
  md: 'highlighted section of your spreadsheet. You can highlight the complete spreadsheet.
    Click the Autofromat button to see a list of predefined formats that you can select.
    You can add formats to your Autofromat choices, but you must add them using OpenOffice
    Writer. See the Tables and Columns section Chapter 11.


    You can combine two or more cells into one cell. Select the cells you want to
    combine. Click Format. Select Merge Cells->Define.


    ![](img/8fd2e743227b42de3b4152272123250b_255_0.png)'
