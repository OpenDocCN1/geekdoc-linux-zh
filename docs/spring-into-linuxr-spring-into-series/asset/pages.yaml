  md: '# Chapter 7. Using the Command Line


    The command line is a blank line where you type a command. No icons, menus, no
    buttons. Well, not totally blank. A few characters, the system prompt, display
    at the beginning of the line, followed by a blinking square, called a cursor.
    If you haven''t worked in DOS or at the command prompt in Windows, a command-line
    interface (CLI) may be new territory for you.


    The blinking cursor signals that the shell is waiting for you to type a command.
    The shell, a computer program, provides the interface between you and the part
    of Linux that executes the command. The shell provides the command line where
    you enter the command, accepts your input, interprets it, and executes the resulting
    command. Several shells are available for Linux. The default shell is called Bash.
    Bash stands for Bourne shell, because Bash is a descendant of an ancestor called
    the Bourne shell. Only the Bash is discussed here. You are unlikely to need to
    use a different shell unless you become a system administrator or an advanced
    programmer.


    The shell communicates with the kernel, the core of Linux. All the computer magic
    occurs in the kernel. It''s the kernel that transfers data to and from the peripherals
    (printer, screen, mouse), writes files to the hard disk, sends data across the
    network, and all the other low-level tasks that make a computer work. It is not
    the function of this book to explain the workings of the kernel. Perhaps some
    of you will delve into this magic after you learn the basics, but most of you
    will not.


    Many Linux users can perform all their required tasks from the desktop, without
    using the command line. However, working directly in the shell is almost always
    faster. In addition, the command line provides more functionality. Some tasks
    that are difficult or impossible to accomplish from the desktop become simple
    when working in the shell. Even for parallel functions, commands often have many
    more options, providing more functionality than the desktop feature performs a
    similar function. System administrators and programmers need to work in the shell
    frequently. After you become familiar with the shell, you may find it faster and
    easier to work in the shell for many of your tasks.


    Many of the command descriptions in this chapter refer to files and directories.
    If you''re unfamiliar with these terms, they are explained in detail Chapter 9.'
  merge: -1
  pgno: 143
- img_proc: true
  md: '# Entering Commands


    To use the command line, you can open a terminal window, also sometimes called
    the console, in which you can work directly in the shell. This is similar to opening
    a DOS or Command Prompt Window in Windows.


    Some distributions provide an icon on the panel that you can click to open a terminal
    window. The icon includes a monitor screen. Others don''t provide a terminal icon.
    Usually the desktop menu (right-click on the desktop) includes an item to open
    the terminal window. You can always find it on the main menu, either as a main
    menu item or on a sub menu under system.


    The terminal window displays the system prompt, followed by the cursor, showing
    that it''s waiting for you to enter a command.


    When you type a command and press <Enter>, the command executes.


    The system prompt is configurable. Different distributions of Linux set different
    system prompts during installation. It might be as simple as $, or contain added
    useful information. The system prompt in Figure 7-1 provides extra informationthe
    current account (janet@localhost) and directory (janet). This prompt is set during
    the installation of Fedora, Mandrake, and other distributions.


    # Figure 7-1. Open KDE terminal window.


    ![](img/8fd2e743227b42de3b4152272123250b_144_0.png)'
