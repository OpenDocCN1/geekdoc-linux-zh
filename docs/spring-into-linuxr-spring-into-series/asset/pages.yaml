  md: '# Mandrake


    Mandrake Linux is particularly oriented Linux novices and home users. Mandrake
    focuses on user-friendly graphical installation and utilities. It''s the easiest
    distribution to install, allowing successful installation by users without any
    Linux experience. It''s very competent at recognizing hardware during the installation
    process.


    Mandrake has two major versions:


    +   - Mandrake Distribution: The stable, official Mandrake Distribution is available
    for download from the Web site (mandrakelinux.com) in files that are CD images
    (ISO files). It''s also available in three boxed sets:


    +   - Discovery: A simplified package that provides the essentials for a desktop
    user, with automated installation process and a handcrafted selection of applications.
    It includes 2 CDs and a manual.


    +   - Power Pack: An advanced desktop package that provides thousands of open
    source and commercial applications. It includes 6 CDs and 2 manuals.


    +   - Power Pack Plus: An advanced package that provides a powerful desktop plus
    the server tools necessary to create and manage a small to medium size network.
    It includes 8 CDs, 1 DVD, and 2 manuals.


    +   - Cookie: The development version of Mandrake Linux is constantly evolving.
    New packages can appear daily. It''s released frequently for testing, bug reporting,
    and feedback. When a cooker version is deemed ready, it''s frozen, meaning no
    new features are added, only bug fixes, and it becomes the beta for the official
    Mandrake Distribution.


    If you want the cutting-edge software, install Cooker. If you like your software
    a little more stable, install the official Distribution.


    Mandrake features include the following:


    +   - Multiple desktops: Provides both GNOME and KDE. KDE is the default.


    +   - Mandrake Club: Provides help forums and others. Provides early software
    downloads. Provides extra software. Requires a small fee to join.


    +   - Mandrake Experts: A Web site (www.mandrakeexpert.com) where volunteer experts
    answer questions. A list of experts is available. Or post your question publicly
    for any to choose. Phone consultation with experts is possible.'
  merge: -1
