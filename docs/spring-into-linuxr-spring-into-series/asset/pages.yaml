  md: '# The Basics of Variables and Arrays


    Variables are containers that have names and hold information, numbers or text.
    Variable names can consist of letters, numbers, and underscores (_). The name
    can begin with a letter or an underscore, but not a number. To create a variable,
    store information in it. The following are valid commands that store information:


    ```

    var1=3

    _var2=Hello

    full_name="John Smith"

    ```


    No space is allowed before or after the =. Notice the first two commands do not
    use quotes around the information. The third command requires quotes because it
    includes a space. Without quotes, the shell would store John and See as a new
    command.


    When you use a variable value, you precede the variable name with a $ , such as:


    ```

    echo $_var

    Hello

    ```


    You can set one variable equal to another as follows:


    ```

    new_name=$full_name

    echo $new_name

    John Smith

    ```


    The simple script from the previous section is modified below to use a variable:


    ```

    #!/bin/bash

    # Script Name: dir2file - A simple shell script that saves a directory listing
    in a file

    status="Directory is saved"

    ls -l > dirlist

    echo $status

    ```


    When you run this script, the output is identical to the output in the previous
    section.


    You can store groups of values under a single variable name, useful when values
    are related. Complex variables that store groups of values are called arrays.
    For instance, you might set up the following array'
  merge: -1
  pgno: 390
- img_proc: true
  md: '```

    full_name[1]=John

    full_name{2}=Smith

    ```


    When you use the value of an array, enclose the name in curly brackets, as follows:


    ```

    echo \${full_name{2}}

    ```


    ![](img/8fd2e743227b42de3b4152272123250b_391_0.png)'
  merge: -1
  pgno: 391
- img_proc: true
  md: '# Reading Data into Variables


    You can store data into a variable from one of the following sources:


    +   - Assigning a value in the script using the equal sign (=). This method is
    discussed in the previous section.

    - Storing the output of a command using back ticks (``).

    - Passing the information on the command line when starting the script.

    - Prompting the user to enter data with the read command.


    This section describes how to read data into variables using these methods.


    The previous section discussed assigning simple values using the equal sign. You
    can also store arithmetic calculations in a variable using the `let` command,
    as follows:


    ```

    let sum=3+4

    let total=total+1

    let sum=$n1+$n2-3

    ```


    You can add (+), subtract (-), multiply (*), or divide (/). You can use modulus
    (%), which returns the remainder of a division (8%5 = 3).


    You can store the output of a command using back ticks, as follows:


    ```

    today=`date''

    ```


    The shell executes the `date` command, storing the output in `today`, as shown
    below:


    ```

    echo $today

    Sun Jan 9 15:37:45 PST 2005

    ```


    You can pass variable values on the command line when you start the script, as
    follows:


    ```

    ./dir2file 21 33 44

    ```


    The values are stored in built-in shell script variables that are numbered, starting
    with $0. The above'
  merge: -1
  pgno: 392
- img_proc: true
  md: 'command results in the following variables:


    ```

    echo $0

    dir2file

    echo $1

    21

    echo $2

    33

    echo $3

    44

    ```


    The first information item read from the command line is the name of the script,
    which is store

    in $0.


    The simple script from the previous section is modified below to use information
    input at the command

    line:


    ```

    #!/bin/bash

    # Script Name: dir2file - A simple shell script that saves a directory listing
    in a fil.

    ls -l > dirlist

    echo $1

    ```


    To pass in the value for the variable $1, run the script as follows:


    ```

    ./dir2file "Directory is saved"

    Directory is saved

    ```


    The same script is modified below to request information from the user:


    ```

    #!/bin/bash

    # Script Name: dir2file - A simple shell script that saves a directory listing
    in a fil.

    echo -n "Enter text: "

    read status

    ls -l > dirlist

    echo $status

    ```


    When the script reaches the third line (echo -n), it echoes the text. When it
    reaches the next line (read),

    waits for input from the keyboard. When the user presses <Enter>, the remaining
    two lines are executed.

    The session looks follows:


    ```

    ./dir2file

    Enter text: Directory is saved

    Directory is saved

    ```'
