  md: '# # Chapter 16. Multimedia


    Multimedia refers to digital sound and video. The possible uses for sound and
    video on computers is boundlessfrom playing CDs and DVDs to communicating over
    distances with sound and video to providing virtual tours that speaks and understands
    human languages. This is an application area that is growing and changing rapidly.
    Yesterday something was impossible; today it''s feasible.


    Sound and video are everywhere. Web excursions frequently encounter sound or video
    that you want to explore. Although working with multimedia files is much easier
    than it is used to, be for Windows and Linux, it can still be problematic on occasion.
    You are more likely to encounter problems in this area than any other.


    This chapter describes more common uses of multimedia files. Most of the applications
    discussed in this chapter work easily out of the box. Some are included with Linux
    and some need to be installed. Software for more advanced multimedia applications,
    useful for musicians and videomakers, is available, as sound recorders, video
    editors, and so forth. Advanced applications are not discussed in this See linux-sound.org
    for more information.


    One problem unique to open source software is the legal status of MP3. MP3 encoding
    (writing music into an MP3 file) is a patented product. Software that can encode
    in MP3 format must pay license fees, a requirement not compatible with open source
    licensing. Therefore, Linux applications that can''t include any MP3 encoders
    without paying license fees. Some Linux distributions include applications that
    can encode several types of files, including MP3 files, with the MP3 encoding
    disabled. Or don''t include... Using MP3 encoding software for personal use, if
    you don''t sell any MP3s, is believed to be perfectly legal. Licensing is applied
    to the developers of the encoders, not the users. see more at http://www.mp3licensing.com/


    However, an open source file format, Ogg Verbis, is available with better sound
    quality for a given comparison than MP3. If you''re saving sound files for use
    on your Linux system, Ogg Verbis is a better choice than MP3.'
  merge: -1
  pgno: 319
- img_proc: true
  md: '# # Configuring Your Sound Card


    In most cases, your sound card was detected and configured during installation.
    It may have been tested, as well, during installation. If you are unsure whether
    your sound card was properly detected and configured, you can test it using the
    configuration procedures for your distribution, usually found on the main menu.


    +   - Fedora: select Settings->Soundcard Detection. Fedora probes for your sound
    card and displays a screen showing which card it detected. The window includes
    a Play test sound button.

    - Mandrake: select Configure your computer->Hardware->Hardware. The HardDrape
    application shows all the detected hardware in the left pane. Click the entry
    for a sound card to see details in the right pane.

    - SuSE: select System->YaST. Click Hardware in the left pane and Sound to detect
    and configure the sound card. Mandrake probes for a sound card, then opens a window
    listing the detected sound card. Buttons are available to add a sound card and
    configure options.


    If your sound card is not listed, you may need to locate and install a driver
    for your sound card. Your sound card may not be supported. Check the Web for your
    Linux distribution to see whether the sound card is supported. Perhaps you need
    to download a driver. Also check the manufacturer''s website for information.


    Most distributions provide a mixer application that allows you to configure the
    sound. In Fedora, the main menu and select Sound &->Volume Control. The window
    of Figure 16-1 opens.


    # ## Figure 16-1. Fedora volume control.


    ![](img/8fd2e743227b42de3b4152272123250b_320_0.png)


    In Mandrake, open the main menu and select Multimedia->Sound->Kmix. In SuSE, in
    the open'
  merge: -1
  pgno: 320
- img_proc: true
  md: window, click Volume.
  merge: -1
  pgno: 321
- img_proc: true
  md: '# Playing Audio CDs


    Most Linux distributions install with a CD player. The player starts automatically
    when a CD is put into the drive. Or, often an icon for a CD player is in your
    system tray on the desktop panel. Or start a CD player from the main menu.


    Two common CD players are:


    +   - CD Player: A simple CD player, often the default CD player in GNOME. It
    opens in the following window.


    ![](img/8fd2e743227b42de3b4152272123250b_322_0.png)


    The player includes the usual play/pause, stop, rewind, fast forward, previous
    track, next track, and eject buttons. When a CD is playing, the name of the CD
    that''s playing is usually displayed.


    +   - KsCD: The KDE simple CD Player is usually the default CD player on KDE desktops.
    It opens in the following window.


    ![](img/8fd2e743227b42de3b4152272123250b_322_1.png)


    In addition to the value slider and the stop, play/pause and other buttons, the
    Random button tells KsCD to play the tracks on the CD in random order. The Loop
    button creates a loop that repeats the CD.


    The Extras button lets you Configure KsCD. A window opens where you can select
    colors. You can check "Show icon in the system tray." You can specify "Autoplay
    when CD inserted," "Eject CD when finished playing," and/or "Stop playing CD on
    Exit." The latter is important because the'
  merge: -1
  pgno: 322
- img_proc: true
  md: CD keeps playing until "Stopped," even if the CD player window is closed.
  merge: -1
  pgno: 323
- img_proc: true
  md: '# Downloading Music


    Many legal music files are available on the Web. There are sites that offer free
    downloads and sites that charge for downloading, either by the song or a monthly
    fee. Many performers offer music downloads for free on their Web sites.


    Most music files from the Web are in MP3 format. MP3 is one of the most popular
    sound formats for music because it combines good compression (small files) with
    high quality. MP3 files generally compress file size to approximately a megabyte
    per minute. MP3 files are actually MPEG (Moving Pictures Experts Group) files
    in a format that encodes sound.


    Many Linux distributions do not provide an application that plays MP3 files, so
    you need to install one yourself. Two multimedia sound applications that play
    MP3 format, as well as other formats, such as WAV files, are:


    +   * Xms: Xms (X Multimedia System) is installed by default on many Linux distributions.
    However, in some distributions, such as Fedora Core, MP3 support is disabled.
    You can install a version with MP3 support to make xmms more useful for playing
    music from your hard disk. You can download and install xmms from www.xmms.org.
    Installing software is discussed in Chapter 10.

    * Rhythmbox: The default music player for GNOME on Fedora. Rhythmbox stores a
    list that you can set up to play in order or randomly. However, on Fedora, Rhythmbox
    doesn''t include support for MP3. You can add MP3 support from www.rhythmbox.org.
    Installing software is discussed in Chapter 10.'
  merge: -1
  pgno: 324
- img_proc: true
