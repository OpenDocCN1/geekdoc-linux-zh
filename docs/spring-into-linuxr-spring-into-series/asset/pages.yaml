- img_proc: true
  md: '# Managing Print Jobs


    Print jobs sit in the queue until it''s their turn to print. They remain in the
    queue until the entire file is sent to the printer. Even a reboot may not remove
    a print job from the queue. You can look at the print queues and manage the jobs
    in the queue from the KDE Control Center. Open the Center from the main menu.
    Click Peripherals. Click Printers. Or, if you are unable to locate the print manager
    in the main menu, click Run and type kjobviewer. The window in Figure 14-6 opens.


    # Figure 14-6. Print job manager.


    ![](img/8fd2e743227b42de3b4152272123250b_297_0.png)


    The print job in the figure shows a status of Processing, meaning it''s printing.
    In most cases, the job prints. Nothing else is needed. However, occasionally a
    print job may show a status of Error. A job can encounter problems and be unable
    to print. Or, sometimes a job gets garbled output to the printer, often using
    huge amounts of paper. The print manager allows you to remove print jobs from
    the queue. You can also add and resume jobs, send a job to the printer, restart
    a job, raise or lower the priority of a job, and other management tasks.


    You can check print queues from the command line with the command:


    ```

    lpq

    Laser is ready

    no entries

    ```


    lpq shows no jobs are in the print queue. You can use an -1 option to get additional
    information. You can remove a print job with:'
  merge: -1
  pgno: 297
- img_proc: true
  md: '```

    lprm jobid

    ```


    You can also find out information about the queues with `lpstat` (see [Appendix
    B).'
  merge: -1
  pgno: 298
- img_proc: true
  md: '# Summary


    Files sent to the printer are sent to a queue that is associated with the printer.
    The print job waits in the queue until its turn to print. You can create more
    than one queue to a printer, although you are unlikely to need to. If a printer
    is a network printer, print jobs from more than one computer on the network can
    be sent to the same queue.


    The software that handles printing for most Linux systems is called CUPS (Common
    UNIX Printing System). CUPS handles all the details from clicking the Print button
    on the application to passing the data to the printer in an understandable format.


    This chapter describes how to:


    +   * Install a printer in Fedora, Mandrake, and SuSE

    * Send files to the printer from the desktop and from the command line

    * Manage print jobs in the queue


    Chapter 15 describes how to connect to the Internet and how to access resources
    on the World Wide Web.'
  merge: -1
  pgno: 299
- img_proc: true
  md: '# Chapter 15. The Internet


    An Internet connection is standard for most computers today. I believe I can assume
    that you have experience using the Internet, probably with Microsoft Internet
    Explorer. Your Linux system can access the Internet. The process is basically
    the same:


    +   1. Set up a connection to the Internet. You may have set up your connection
    during installation. not, you can set it up now.

    2. Access the Internet using a browser.


    If you are using a computer at work, you are probably connected to your company
    network. The first step above is handled by your company. However, you can connect
    to the Internet from your home computer. In the past, connecting from Linux was
    difficult. More recently, many Linux distributions designed utilities that make
    connection as simple as it is for Windows.'
  merge: -1
  pgno: 300
- img_proc: true
  md: '# Accessing the Internet


    To connect to the Internet, you need networking hardware and access to the Internet.
    Access is provided in one of the following ways:


    +   - Office LAN: A work computer is connected to a company LAN. You may need
    to configure your connection in Linux, or this may be automatic. Your system administrator
    will provide you with the information you need. Or, your IT department may configure
    the connection. The LAN to the Internet is handled by the company.

    - Home broadband: A home computer is connected via broadband cable, DSL, or wireless
    services, provided by a cable or phone company or an independent Internet service
    provider (ISP). Your broadband connection needs to be configured with your connection
    information. You may have done this installation. If not, you cannot do it. The
    information is provided by your ISP.


    Some service providers install software on your computer that you run to connect
    to the Internet. If so, the service provider may or not support Linux. Discuss
    Linux with the service provider. However, many broadband connections are now "always
    on" connections. The connection opens when your computer boots and you can use
    it any time. It doesn''t matter if the connection is made from Linux or another
    operating system.


    +   - Home dial-up: A home computer is connected via phone line and a modem. Many
    ISPs provide software that you install and use via the dial number. Not all ISPs
    support Linux. If the software they provide don''t run on Linux, you may not be
    able to connect from Linux using the specific ISP. You need to discuss this with
    the ISP before signing on their service. Or, if you are already using an ISP,
    you may need to find a new one.


    Broadband connections are more expensive, generally, than dial-up connections.
    However, with more and graphic and multimedia content on the Web, the gain is
    more worth the cost. Usually broadband costs a modest amount more than dial-up.
    Broadband can be up to 50 times the speed of dial-up connections. Waiting for
    large graphics to download over dial-up connections can be painful.'
  merge: -1
  pgno: 301
- img_proc: true
  md: '# Hardware for Accessing the Internet


    Connecting to the Internet requires that either a modem (dial-up) or an Ethernet
    port is installed in your computer. In addition, a broadband connection requires
    additional hardware.


    +   - **Model:** All computers in the last few years include a 56K modem. Most
    hardware modems are detected by Linux. You can check the Web site for your distribution
    to be sure your modem is supported.


    Soft modems, also called Winmodems, require Linux drivers to work. Winmodems are
    becoming more and more popular with computer manufacturers because they cost less.
    Newer laptops usually come with Winmodems. More and more vendors are providing
    Linux drivers, as projects developing Linux drivers are making progress. As time
    moves, Winmodems become less of a problem. At the present time, life will be simpler
    if you don''t have a Winmodem. Information on using Winmodems with Linux is available
    at linmodems.org and walbran.org/sean/linux/linmodem-howto.html.


    +   - **Ethernet port:** Your computer may or not include an Ethernet port, either
    on a separate card (network interface card (NIC)) or built in the motherboard.
    To use a broadband connection, you need an Ethernet port. Many broadband service
    providers, such as cable companies, install a NIC if it''s needed as part of the
    broadband setup. Linux can detect the port. Check the Web site for your Linux
    distribution to be sure yours is supported.


    +   - **Broadband hardware:** Broadband connections require hardware between your
    computer and the broadband source. Each type requires a different setup.


    +   - Cable modem: The cable modem signal is transported on the cable that brings
    in your TV signal. A cable modem, not a phone modem, is connected to your Ethernet
    port and to the cable to translate the signal.


    +   - DSL: A DSL modem, provided by your DSL provider, is connected to your Ethernet
    port and to your phone line. It is not a phone modem.


    +   - Wireless: Wireless service requires a hardware unit that includes the electronics
    and antenna for receiving and transmitting the wireless signals, usually installed
    outside. A cable runs from the unit to your Ethernet port.


    After you have the required hardware, you need to set up your network connection,
    providing some information. For instance, for a dial-up connection, you provide
    the phone number. The information needed provided by your service provider. Most
    Linux distributions include a GUI utility for setting up network connections.'
  merge: -1
  pgno: 302
- img_proc: true
  md: '# Checking Your Network Connections


    Your connection may have been set up during installation. The quickest way to
    test a connection is to try it. If you have a broadband connection, try your browser.
    Or, dial your ISP using your dial-up connection. Or, you can check your network
    connections using utilities provided with your Linux distribution.


    To see your network connection setup on Fedora, open the main menu and select
    System Settings->Network. Figure 15-1 shows the Network Configuration window.


    # Figure 15-1. Network Configuration on Fedora.


    ![](img/8fd2e743227b42de3b4152272123250b_303_0.png)


    The window on the left in Figure 15-1 shows the network devices that are set up.
    In this case, it shows one active network connection on device eth0. If it is
    an Ethernet connection, the computer is set up for a broadband connection. If
    you double-click the entry, a window opens showing the device configuration.


    If you click the Hardware tab, the window on the right opens up. In this case,
    Linux found one NIC and one modem. If you double-click an entry, you can see the
    configuration of the hardware.


    The Linux system represented by Figure 15-1 detects a modem, but no network device
    is configured to use the modem. You can configure a connection for the modem.
    If the NIC and your broadband were connected during Linux installation, your system
    is probably configured to use the NIC. You can add a connection device at any
    time. A device is discussed in the next section.'
  merge: -1
  pgno: 303
- img_proc: true
  md: '# # Adding a Dial-Up Network Connection


    If your modem is installed and Linux recognizes it, but you cannot reach the Internet,
    you can configure a network connection using the window opened in Figure 15-1.
    Click New Select Modem to see the window shown in Figure 15-2.


    # ## Figure 15-2. Modem configuration on Fedora.


    ![](img/8fd2e743227b42de3b4152272123250b_304_0.png)


    Don''t select a country. Enter the information you received from your ISP or system
    administrator. "Provider name" is a label of choice for this connection.


    When you click Forward, a window opens with two choices: "Automatically obtain
    IP Address Settings" or "Statically set IP address." This information is provided
    by your ISP. After this screen, your modem connection is configured. The Network
    Configuration window Figure 15-1 will show a new line for the modem. The status
    is shown as Inactive. Click Activate to change the status to activate.


    You can add an icon to panel to start your connection. In the main menu, select
    System Settings. Right-click Network and select Add This Launcher to Panel.


    If you have a problem, your modem setup may be inaccurate. In the hardware window
    Figure 15-1, right side), highlight the modem and click Edit. You can change modem
    configuration there. The modem probably shows as /dev/modem. This might be incorrect.
    If you are also running Windows COM2, /dev/tty1, see where the modem is installed.
    If it''s COM1, /dev/tty0 on Linux; /dev/ttyS etc.'
  merge: -1
  pgno: 304
- img_proc: true
  md: 'More information on setting up your modem can be found in the Modem How To,
    found at www.tldp.org.


    ![](img/8fd2e743227b42de3b4152272123250b_305_0.png)


    ![](img/8fd2e743227b42de3b4152272123250b_305_1.png)'
