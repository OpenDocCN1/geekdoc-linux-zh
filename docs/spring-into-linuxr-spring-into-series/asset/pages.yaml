  md: '# The sort Command


    If you want to sort the contents of a plain text file, you can bring it into your
    word processor and sort it. However, Linux has a sort command that is much faster
    and often easier to use. The command to sort a file named unsorted.txt is:


    ```

    sort unsorted.txt

    ```


    The unsorted and sorted contents of the file are below:


    | Unsorted | Sorted |

    | --- | --- |

    | Little Boy Blue | |

    | Jack Horner | Little Bo Peep |

    | Little Bo Peep | Little Boy Blue


    This is the simplest form of sort, which is sufficient for many needs. In addition,
    the sort command has several options which affect the sorting procedure. Table
    7-5 shows the most useful options.


    # Table 7-5. Options for the sort Command


    | Option | What it does |

    | --- | --- |

    | -filename | Save the output in the specified file |

    | -r | Sort in reverse order |

    | -u | Remove identical lines |

    | -k | Specify which key to sort |

    | -t | Define a character to separate the keys in the text line


    More complicated sorts are possible using the -k and -t options. These options
    allow you to specify exactly which line to sort, rather than just sorting from
    the beginning of the line. Instance, you could use the following command:


    ```

    sort k2 t" " unsorted.txt

    ```'
