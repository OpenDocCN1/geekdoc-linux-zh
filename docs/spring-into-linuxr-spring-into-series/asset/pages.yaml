- img_proc: true
  md: "# # Chapter 9. File Management\n\nAll information on Linux is organized into\
    \ files. All information, without exception. A file is the mechanism that Linux\
    \ uses to store information. You are most likely to need to know about and manage\
    \ files that contain the following types of information:\n\n+   * **Data files:**\
    \ Files that contain information stored on the computer. Two types of data files\
    \ are:\n    * * **Application-specific files:** Information created by a specific\
    \ application, stored in a format that only the application can interpret. Creating,\
    \ changing, storing, or printing the data file must be done using the application.\
    \ The documents created by many word processing applications are stored in an\
    \ application-specific file.\n    * * **Text files:** Information stored in a\
    \ common format (ASCII) that most applications can read. Linux system commands\
    \ can read and modify the file. Your word processor allows you to specifically\
    \ save your file as text, even though the default is an application-specific file.\n\
    \n+   * **Programs and applications:** Files that contain instructions. When you\
    \ run a program, Linux reads the instructions in the file and performs the tasks\
    \ as directed.\n\n+   * **Image files:** Files that contain pictures. You need\
    \ to use software that understands graphic content to see or modify these files.\
    \ Graphics files are described in Chapter 14.\n\n+   * **Configuration files:**\
    \ Files that contain information used by an application to perform its work. For\
    \ instance, the settings for your desktop are stored in a configuration file.\
    \ When your desktop starts, it reads the file to see what color the background\
    \ is, what kind of fonts to use.\n\nIn many cases, you create and manipulate data\
    \ using an application. The application manages the files; you only need to know\
    \ the data filename. However, on occasion, you need to work with files directly.\
    \ This chapter describes how files are stored and how to create, copy, move, delete,\
    \ and otherwise them."
  merge: -1
  pgno: 181
- img_proc: true
  md: '# # File Organization


    Files are organized into directories, also called folders. Windows users are probably
    familiar with folders. A directory can contain files and other directories, as
    many as needed. A directory can even be empty, containing no files or directories.


    # ## NOTE


    Because all information on Linux is stored in files, a directory is actually a
    file that contains the information needed to access the files assigned to it.


    Directories are organized in a hierarchy upon their hard disk, called a file system.
    Although technically the directories can be named and organized in any manner
    desired, most Linux systems are organized in the accepted Linux way. The top directory
    is called root, designated by a forward slash (/).


    When a user account is created, it''s assigned a home directory. For instance,
    the account janet is assigned a home directory named janet. Home directories are
    located in a directory named the root directory /home. Many directories are in
    the /home directory, one for each user account, as such:


    ```

    /home/janet

    home/kim

    home/theboss

    ```


    The directory names above include the names of the directories above them. This
    designation is called the path. The path is from root to janet. If a file named
    test is in the directory janet, the path is /home/janet, so that the complete
    name to locate the file is /home/janet/test.


    The home directory for the powerful root account is separate from other users,
    in /root.


    You can use shortcuts in the path. A dot represents the current directory; two
    dots represent the one immediately above the current directory. For instance,
    in the directory /home/janet, the dot directory is janet and the dot directory
    is home.


    The location of a file in the file system includes the path. You can have two
    files with the same name long as they are located in different directories.


    The entire path from the root directory is called the absolute path. It refers
    to the total path needed to locate the filepath from / to the file. A file can
    also be located by its relative pathth from the current location to the file.
    For instance, if you are located in the /home/janet, the relative path to the
    file test is janet/testpath from /home to the file.


    Shortcuts are useful in relative paths. For instance, if you are located in /home/janet,
    the path to /home/kim can be specified as ..kim.'
  merge: -1
  pgno: 182
- img_proc: true
