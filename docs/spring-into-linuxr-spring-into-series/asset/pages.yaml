  md: '# Configuring the Desktop


    You can change many settings for both the desktop and the panel. In fact, many
    people go to lengths to express their creativity with their desktops. Some creative
    desktops can be seen at www.lynxucs.org/index.php?p=featured.


    Almost everything about your desktop is configurable. Some changes are made in
    desktop and panel menus and on the kde menu. In some cases, a setting can be changed
    by more than one method. In general, KDE and GNOME provide different, often similar,
    procedures for configuring your desktop.


    Specific instructions for the most frequently changed settings are provided in
    this chapter. However, space is not available to provide instructions for all
    possible desktop configurations. If you want to make a change to your desktop
    and find instructions in this book, it doesn''t mean the change is impossible.
    It is probably.


    In KDE, many changes can be made in the KDE Control Center, accessed from the
    main menu, directly or through the Preferences submenu. When you start the KDE
    Control Center, you see a screen similar to the one shown in Figure 6-7.


    # Figure 6-7. KDE Control Center.


    ![](img/8fd2e743227b42de3b4152272123250b_124_0.png)'
