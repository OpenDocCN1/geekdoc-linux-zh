    Displays a file to the screen. It displays one screen, and waits. The less command
    is a newer version of the more command, less has both options and commands. Commands
    are typed while less is running, displaying the file. Commands are similar to
    vi commands. Pressing a key when less has displayed a full screen of text and
    is waiting for input tells less what to display.


    ```

    Format: less filename

    Examples: less file.txt

    ```


    The less command has many more commands and options than the more command.


    | Opt | What It Does | Examples |

    | --- | --- | --- |

    | ? | Display help file | less ? |

    | -m | Display a long prompt | less -m |

    | -pattern | Start display where first pattern is found | less +pa* |


    | Command | What It Does |

    | --- | --- |

    | <space> | Display next screen |

    | n<Enter> | Display the next n lines; default is one line |

    | /pattern | Search for pattern |

    | = | Print current line number |

    | b | Skip backward one screen of text |

    | f | Skip forward two screens of text |

    | n | Repeat last search |

    | q | Stop displaying files |'
  merge: -1
  pgno: 465
