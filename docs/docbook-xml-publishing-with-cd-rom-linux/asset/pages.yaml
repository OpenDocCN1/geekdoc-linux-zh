- pgno: 330
  md: "# PartInfo\n\nThe PartInfo element contains meta-information about a part.\n\
    \nThe PartInfo element uses common attributes.\n\nSee the BookInfo element for\
    \ an example.\n\n# PrefaceInfo\n\nThe PrefaceInfo element contains meta-information\
    \ about a preface.\n\nThe PrefaceInfo element uses common attributes.\n\nSee the\
    \ BookInfo element for an example.\n\n# RefentryInfo\n\nThe RefentryInfo element\
    \ contains meta-information about a reference entry.\n\nThe RefentryInfo element\
