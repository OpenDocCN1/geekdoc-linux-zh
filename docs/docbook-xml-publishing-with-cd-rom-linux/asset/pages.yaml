    # Parsing Documents with SGMLtools and SGMLtools


    After you install SGMLtools or SGMLtools, parsing documents with them is easy.
    For the purpose of these examples, assume you have a file named book.sgml that
    you want to export to different file formats.


    The syntax for both SGMLtools and SGMLtools-Lite is the same, and these commands
    should work with both, barring incompatibilities in future versions of SGMLtools-Lite.


    # Rendering PostScript with SGMLtools-Lite


    To convert your document to PostScript, run the following command:


    ```

    sgmltools -b ps book.sgml

    ```


    Provided that no serious errors exist in the file, you will get a PostScript suitable
    for printing. If you have a special stylesheet you''d like to apply, use this
    syntax:


    ```

    sgmltools -b ps -d stylesheets.dsl book.sgml

    ```


    This tells sgmltools to use a different stylesheet than the default stylesheets.
    The -b option is for backend, it tells SGMLtools what format to output.


    As you can see in Figure 6.6, the PostScript version of this document is very
    professional-looking, even with just the default stylesheets. Note that you get
    page numbers and an index generated automatically instead of your having to do
    it manually.


    # Rendering DVI with SGMLtools


    SGMLtools can also render output in the DVI, or device-independent, format usually
    generated from LaTeX or TeX. The benefit of doing this is that there are tools
    that can convert from DVI to formats such as PDF.


    To get a DVI file from a DocBook document, as shown in Figure 6.7, use the following
    syntax:


    ```

    sgmltools -b dvi book.sgml

    ```'
