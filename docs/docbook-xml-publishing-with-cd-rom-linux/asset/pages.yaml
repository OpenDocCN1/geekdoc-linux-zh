    # Creating a Revision


    Now you want to create the first revision of the file. To do that, you use the
    check-in command for RCS, ci. (Isn''t it nice the way UNIX-style commands are
    short and easy to type?)


    Make a test file with a few lines of text in your favorite editor, and save it
