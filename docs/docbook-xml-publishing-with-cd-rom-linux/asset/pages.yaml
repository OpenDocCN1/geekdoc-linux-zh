    Figure 10.1 Jade''s error message for an invalid attribute


    # The DocBook Character Entities


    The DocBook Character Entities file is dbcent.mod. This file doesn''t contain
    much information directly; rather, it calls the various files that have the ISO
    character entities'' information. If you don''t have the ISO entities on your
    system when you parse a DocBook document, you will get a whole bunch of errors.


    # The DocBook Catalog


    All the DocBook Catalog information is contained in the docbook.cat for use in
    building your own catalog system files. The information here can be useful in
    debugging if you have Jade/OpenJade errors related to catalog files.


    # DocBook SGML Declarations


    The docbook.dtd file contains all of DocBook''s SGML declarations. When you see
    errors like the one in Figure 10.2, which complain about a missing tag but its
    declaration does not permit this, this is where the declaration not to omit tags
    is located.'
  merge: -1
