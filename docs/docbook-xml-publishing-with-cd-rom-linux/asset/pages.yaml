  md: '# Finding Out More about DecBook


    File View Search Bookmarks Help Debug QA


    ![](img/81f56bf497dbf7f7582072400d12cb42_386_0.png)


    Linux is a free Unix-like operating system created by Linus Torvalds with the
    assistance of many people around the world. The source code for Linux is freely
    available to anyone who wants to learn more about the operating system that is
    running on their computer.


    Linux''s mission is to get people to use Linux. Linus Torvalds says we''re the
    first to make it free and we want to get you to use it too. You can download it,
    install it, and tell your friends.


    There are also other open-source operating systems like BSD, which includes FreeBSD
    and OpenBSD. These are also all UNIX-like OS that have the best of all worlds,
    just different from Linux.


    Figure C.13 The Linux Online Web site


    If you''re not already using Linux or one of the BSDs, I hope that you will check
    out and see what they have to offer. I''ve been using Linux for almost five years
    now, and I wish that I had started sooner!


    There''s not a huge amount of difference between Linux and FreeBSD, NetBSD, or
    OpenBSD, especially compared to the difference between them and Windows or the
    MacOS. They''re all free, UNIX-like OSes that run on a variety of hardware, including
    Intel-based PCs. Linux is the most popular, but they all have great features to
    offer. They are also very powerful, make great use of hardware, and are extremely
    stable. Not only that, a huge amount of free software is available for those OSEs
    that would cost thousands (yes, I said thousands) of dollars for other OSes.


    Give one of ''em a whirl. You will be glad you did. Even if you decide that they''re
    not for you, you will know more about them than you did before, and you will know
    that you made a conscious decision to use whatever OS you''re using.


    ![](img/81f56bf497dbf7f7582072400d12cb42_386_1.png)'
  merge: -1
  img_proc: true
- pgno: 387
  md: '# Open Source Publishing Resources


    DocBook isn''t the only game in town. Now I happen to think that it'' the best
    game in town, but it''s not the only one. In the Open Source world is a variety
    of typesetting languages and other tools for typesetting that I think should know
    about.


    Typesetting languages are much different in theory and practice from a markup
    language like DocBook. As mentioned before, DocBook markup is concerned with the
    structure and content of the document, not the physical presentation.


    However, if you''re a presentation maniac or you just absolutely have to control
    over every pixel, you will want to look into typesetting languages like Tex or
    LaTeX. They''re not easy, and they''re not WYSIWYG, but they certainly provide
    fine-grained control over the look and feel of your document.


    ![](img/81f56bf497dbf7f7582072400d12cb42_387_0.png)


    I would like to point out that I''m not going to provide resources for commercial
    programs like Adobe Illustrator or QuarkX. They do enough marketing that I''m
    sure you''ve heard of them often if you''ve looked for typesetting solutions for
    the MacOS or Windows. However, most of the Open Source projects aren''t backed
    by big companies with a lot of capital to publish them. It doesn''t mean that
    the software isn''t great, but it does mean that you won''t be seeing dual-page
    ad spreads in MacUser magazine or anything like that.


    I''m not necessarily recommending any of these programs or languages, you, but
    it never hurts to know what the alternatives are.


    # Typesetting Languages


    If you''re interested in trying your hand at a typesetting language, Tex and LaTeX
    are the best two available. Luckily, a fair amount of free software is also available
    to work with Tex and LaTeX, so the value proposition is good.


    Beware, Tex and LaTeX are not for the faint of heart. If you looked at DocBook
    markup and thought, "Hmm, this might be tricky," you will probably'
  merge: -1
  img_proc: true
- pgno: 388
  md: '# Open Source Publishing Resources


    look at TeX file and think, “I’m in real trouble now.” TeX is powerful, but it’s
    not what I would call user-friendly.


    The best place to start is with the man himself, Donald E. Knuth. He is the man
    who invented TeX, and he is also one of the most respected people in computer
    science. His books are considered classics in computer science. Knuth''s home
    page is hosted on Stanford University''s Web server at http://www-cs-faculty.Stanford.EDU/~knuth/
    (see Figure C.14).


    The Comprehensive TeX Archive Network (CTAN) includes a comprehensive listing
    of all available TeX software (see Figure C.15). Not much documentation here,
    but the software you can eat. You can find the CTAN Web Interface at http://www.ctan.org/.


    The LaTeX Project page provides quite a few resources for the LaTeX beginner (see
    Figure C.16). If you''re looking for a foundation to build on with LaTeX, this
    is where to go: http://www.latex-project.org.


    ![](img/81f56bf497dbf7f7582072400d12cb42_388_0.png)


    Figure C.14 Donald Knuth''s home page'
