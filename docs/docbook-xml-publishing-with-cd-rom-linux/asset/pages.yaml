- pgno: 29
  md: '# Differences between SGML and XML DocBook


    SGML and XML DTDs are designed to be fully compatible. However, SGML allows some
    shortcuts—better known as minimization—that are not allowed in XML. Because the
    goal of this book is to bring you up to speed with both SGML and XML DocBook,
    I won''t demonstrate any of the minimizations in this book. No need to start bad
    habits!


    Another difference between SGML and XML is case-sensitivity. SGML allows for uppercase,
    lowercase, and mixed-case elements and attributes. <Sect>, <sect1>, and <sect>
    are all valid markup when working with SGML, but only lowercase elements and attributes
    are valid with the DocBook XML DTD. The reason for this is that XML is designed
    so that a well-formed XML document can be parsed without a DTD. Even there is
    a DTD for XML DocBook, XML tools should be able to work with a DocBook XML document
    without a DTD.


    > The SGML specification from the W3C does not require elements to be lowercase,
    but it does require that elements used as they are defined in the DTD. The DocBook
    DTD defines all elements in lowercase for simplicity.


    Keywords, on the other hand, must be uppercase to be considered valid with XML.
    If this seems confusing, don''t worry. If you follow the conventions and examples
    in this book, you''ll be fine. All the examples in the book have been designed
    to be XML and SGML DTD compatible. Remember, valid XML is also valid SGML, but
    the reverse is not true. Designing documents to be compatible with both, even
    if you are using the SGML DTDs now, can save you headaches later.


    When you have settled on SGML or XML, you will start your document with one of
    the declarations.


    # Using the SGML DTD


    To declare a document using the SGML DTD, use the following markup:


    ```

    <DOCTYPE root element PUBLIC "-//OASIS//DTD DocBook V4.1//EN">

    ```


    I''ll break this down into the basic components so that it''s easier to understand.


    ![](img/81f56bf497dbf7f7582072400d12cb42_29_0.png)


    +   In a DocBook document, keywords are used to designate sections that should
    receive special handling. For instance, the CDATA keyword is used to indicate
    that within a certain section marked should not be processed.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Creating DocBook Documents


    The DOCTYPE declaration should be the first tag in every DocBook document. SGML
    requires this element so that any parsing application can identify the type of
    document it is working with and what DTD it is going to validate the document.


    The DOCTYPE tag is followed by attributes that further define the type of document,
    including the DTD and the root element of the document.


    # The Root Element


    When you think of a root, what do you picture? What the designers of SGML want
    you to picture is a structure similar to a tree. The root element, like the roots
    of a tree, is the beginning of a structure. The root element is the foundation
    of the document. You can find all the valid root element types in Appendix B,
    "DocBook Element Reference."


    # Public and System Identifiers


    To use a DTD, an application must be able to find it. If a document has a public
    DTD, the application looks to a catalog file to resolve the name of the DTD to
    find the actual file, in this case:


    ```

    // ANSI//DocBook V4.1//EN

    ```


    On this system would resolve


    ```

    /usr/share/sgml/dtd/docbook/4.1/docbook.dtd

    ```


    By declaring a system identifier, you bypass the need to lookup a catalog file
    and simply tell the application exactly the file containing the DTD. If I use
    a system identifier instead of a public identifier, my declaration would look
    like this:


    ```

    <DOCTYPE root element SYSTEM "/usr/share/sgml/dtd/docbook/4.1/docbook.dtd">

    ```


    If you prefer, you can use both public and system identifier, but you must use
    at least one of them. Chapter 6, "Parsing DocBook," goes into more detail about
    the jaunty-gritty details of using DTDs.


    # Using the XML DTD


    Technically, as mentioned earlier, XML documents do not require a DTD. However,
    because you''re working with a specific DTD (DocBook), you will


    ![](img/81f56bf497dbf7f7582072400d12cb42_30_0.png)


    You might be wondering what it means to say that document is parsed. Originally,
    parse was a linguistic term for dividing words or phrases into components and
    analyzing them. If you have been studying grammar school, you were parsing the
    sentences. The same is true in computer applications. Applications download the
    document into component parts for further processing. For instance, it has to
    parse HTML document before it can display the document in human-readable format.
    A parsing application forms validation, which is to say it also checks whether
    your document conforms to the DTD and is properly structured.'
