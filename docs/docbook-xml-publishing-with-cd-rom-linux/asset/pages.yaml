- pgno: 134
  md: 'If you have a document with multiple chapters and such, SGML-tools will generate
    one main page with an index of links to the various chapters and links for navigation
    at the top and bottom of each page.


    As you can see from Figure 5.8, the standard HTML output from SGML-Tools is clean,
    a little plain but serviceable. You''re not looking for flashy pages anyway because
    you''re probably more concerned with the substance and structure of the document
    than that presentation.


    The HTML output by SGMLTools is perfectly valid, at least, according to any Web
    browser I''ve ever used to view it. However, SGMLTools is a bit on the homely
    side, to say the least. Figure 5.9 shows an example of the output from SGMLTools.
    As you can see, it''s rough. It also relies heavily on formatting tags such as
    the Font element and other elements now deprecated by the World Wide Web Consortium
