- pgno: 180
  md: '# Using TkCVS


    To start TkCVS, run the tkCVS command. TkCVS first checks to see what the CVSROOT
    environment variable is; if it''s not set, you will get an error message. Be sure
    to set the environment variable before running TkCVS. To set the CVSROOT environment
    variable, run the following command.


    ```

    export CVSROOT="/mnt/cvsroot/

    ```


    or if you are using C shell:


    ```

    setenv CVSROOT /mnt/cvsroot

    ```


    When TkCVS starts up, it opens as a file manager (see Figure 7.11). You can open
    and view text files with it and change directories just like any standard GUI
    manager.


    # Getting to Know TkCVS


    TkCVS is easy to understand. The menus at the top of the TkCVS tool bar control
    file operations, CVS reports, TkCVS options, and movement history.


    ![](img/81f56bf497dbf7f7582072400d12cb42_180_0.png)


    Figure 7.11 TkCVS'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# Chapter 7: Collaborative Work with DocBook


    There''s also a decent help menu with instructions on how to use the various features
    of TkCVS.


    What the buttons at the bottom of the TkCVS window do is not obvious, but if you
    hover your mouse over one of them for a second, it gives you a description of
    the button (see Figure 7.12).


    # Committing Files with TkCVS


    To commit files with TkCVS, browse to the directory you want to commit into CVS.
    Click the large button to the right of the application; it is the picture of a
    folder with several red dots underneath it (see Figure 7.13).


    # Checking Out Files from TkCVS


    To check out files from the CVS repository, and you will have a list of options
    from which to choose (see Figure 7.14).


    ![](img/81f56bf497dbf7f7582072400d12cb42_181_0.png)


    Figure 7.12 A TkCVS button description'
