- pgno: 225
  md: '# Chapter 9: Using Vim


    normally. Whatever file is currently active can be written to or closed without
    changing the other file(s) that may be open. For instance, if you quit index.sgml
    without saving, it does not close the book.sgml file or change it in any way.
    It simply returns to a single pane window with one file open.


    # Inserting Another File


    Often when using DocBook, you will want to start a new document with a pre-existing
    template. By starting Vim with the new filename and then reading in the contents
    of another file, you can save a little time.


    To insert the contents of another file into the current buffer at the cursor position,
    follow these steps:


    +   1. Enter vi command mode by pressing Esc.

    2. Enter the last line mode by typing the colon (:).

    3. Use the following syntax to tell vi the name of the file to open:


    `:r filename`


    or for a file not in the current directory:


    `:r/directory/filename`


    This procedure inserts the contents of the named file into the current buffer.
    You can use this feature for cutting and pasting files, or for inserting system
    files into another file for editing or modifying.


    ![](img/81f56bf497dbf7f7582072400d12cb42_225_0.png)


    > Unless you really know what you''re doing, it''s much smarter to always edit
    a copy of a system configuration file rather than the original file. Actually,
    even if you do know what you''re doing, it''s still safer. If you don''t, editing
    an original file is nearly suicidal.


    # Summary


    If you''re interested in learning about the more advanced features available,
    try using either the Vim man pages or some of the Web sites dedicated to Vim or
    vi clones. You can find a listing of those sites and other great resource sites
    in Appendix D,"More DocBook Resources." I think that you will find yourself addicted
    to Vim if you give it a try!'
  merge: -1
