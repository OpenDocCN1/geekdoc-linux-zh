- pgno: 48
  md: '# The Ackno Element


    The Ackno element indicates an acknowledgment within the body of the article.
    The contents of the Ackno element may be set off from regular body text. Note
    that the Ackno element cannot be nested within the Para element, only within the
    Article element as demonstrated in the example below.


    ```

    <article>

    <ackno>

    <para>

    Before I start the article, I would like to thank everyone who helped make it
    possible. A big thanks to everyone at Prima and Linux Magazine.

    </para>

    </ackno>

    </article>

    <para>

    ```


    # The Attribution Element


    As we all know, it is very important to give credit where credit is due. The Attribution
    element is used to indicate the source of a quotation set off as either a BlockQuote
    element or an Epigraph element. This element is particularly useful when writing
    academic papers, as a stylesheet can be designed to automatically format attributes
    in the proper citation format. This is a simple example of a Attribution.


    ```

    <blockquote>

    <attribution>John Lennon</attribution>

    Life is what happens when you''re busy making other plans.

    </blockquote>

    ```


    > The Attribution element is unusual in that it cannot be contained within the
    Para element. It is used only within the BlockQuote or Epigraph elements, which
    do not have to be contained in a Para element.


    ![](img/81f56bf497dbf7f7582072400d12cb42_48_0.png)


    # The Author Element


    As covered earlier in this chapter, the Author element contains information about
    the author of the article.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Chapter 2: Writing a Technical Article


    # The AuthorBlurb Element


    Usually, when an article is published, there is a short bio or other information
    about the author. The AuthorBlurb element contains this sort of information and
    can be located just about anywhere in the document. The example here shows it
    nested within the Article element because that seems the most logical spot to
    me.


    ```

    <article>

    <authorblurb>

    <para>Joe "Zonker" Brockmeier is a world-famous author and frequently delusions
    of grandeur.</para>

    </authorblurb>

    </article>

    ```


    # The BlockQuote Element


    Often, in an article or technical paper it is necessary to set off a quotation
    as a block of text unto itself. The BlockQuote element is used to set off a quote
    and can be used outside the Para element. The BlockQuote element comes in particularly
    handy when you are writing articles for academic journals or scholarly papers.
    The example below is from one of my favorite authors, Mark Twain. I''m sure we
    would have loved DocBook if it were available to him when he was writing. Figure
    2.3 shows what a BlockQuote looks like when rendered into HTML.


    ```

    <section>

    <blockquote>

    <attribution>Mark Twain</attribution>

    There are gold men, and tin men, and copper men, and leaden men, and steel men,
    and so on-each has the limitations of his nature, his heredities, his training,
    and his environment. You can build engines out of each of these metals, and they
    will all perform, but you must not require the weak ones to do equal work with
    the strong ones. In each case, to get the best results, you must free the metal
    from its obstructing prejudicial ones by education-smelting, refining, and so

    </blockquote>

    </section>

    ```'
  merge: -1
  img_proc: true
- pgno: 50
  md: '![](img/81f56bf497dbf7f7582072400d12cb42_50_0.png)


    Figure 2.3 The BlockQuote element rendered in HTML


    # # The Caution Element


    The Caution element is used to create a callout section with a caution to the
    reader of the article. Depending on the output medium, the Caution element may
    create a box set off from other text or perhaps adds a yellow sign with an exclamation
    point to emphasize caution. The following example also includes a title for the
    Caution element. Although this isn''t necessary, it is recommended.


    ```

    <caution>

    <title>Watch out for misplaced tags!</title>

    <para>If you don''t nest your elements properly, your document will not parse
    properly and will cause you a great deal of frustration</para>

    </caution>

    ```


    The Copyright element should be used at the beginning of the article to indicate
    the copyright holder of the article itself. It does not refer to copyrights'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'used in the text of the article. Those are covered by the Trademark element.

    The following example includes the copyright holder and the year of the copyright.


    ```

    <!DOCTYPE article "-//OASIS/DTD DocBook V4.0//EN">

    <copyright>

    <year>2000</year>

    <holder>Prima Publishing</holder>

    </copyright>

    <article> ...

    ```


    While this isn''t directly related to DocBook, it might be worthwhile to mention
    that it is a good idea to affix a copyright notice to any work you produce. Copyright
    is granted when a work is produced, not when it is registered. Though it is a
    good idea to apply copyright when you produce a significant work, it is not necessary
    to get the rights to the work.


    ![](img/81f56bf497dbf7f7582072400d12cb42_51_0.png)


    # The Email Element


    The Email element is used to denote an e-mail address. Depending on the output
    medium, the text will be formatted differently or, in the case of a hypertext
    document, create a link to the given e-mail address (see Figure 2.4). This example
    shows the Email element nested within the Para element, though there are a number
    of other elements that Email may be nested in as well.


    ```

    <para>

    You can reach me at <email>jbrockmeier@earthlink.net</email>

    </para>

    ```


    # The Figure Element


    The Figure element is one of the elements that enable you to include an image
    in your document. The Figure element automatically numbers itself when used, so
    each figure is numbered consecutively in the document without your explicitly
    having to number them. This is a very basic example of the Figure element; see
    Chapter 3 for more on using images with DocBook.


    ```

    <figure>

    <title>A very useful figure</title>

    ```'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Standard Tags


    ![](img/81f56bf497dbf7f7582072400d12cb42_52_0.png)


    Figure 2.4 Email element output in HTML


    <graphic fileref="images.d/figure2\></graphic>

    </figure>


    In this example, the figure is titled "A very useful figure,\" and the Graphic
    element specifies the name of the file to use for the figure—figure2 in the images.d
