    # # Installing RCS


    RCS is easy to install. Download the tarfile from the RCS home page and unpack
    it in an appropriate directory by eding to the directory and running the following
    commands:


    ```

    gzip -cd rcs-*.tar.gz | tar -xvf -

    ```


    That will create a directory rcs-XX.XX (where XX is the version number). Next
    cd into that directory and run ./configure. If you are not root on the system,
    you might want to run ./configure --prefix=$HOME to build the software install
    in your home directory. Next run make followed by make install. If you are not
    installing to your home directory and you are not root, you will have to su before
    the make step.


    If you prefer packaged versions of applications, there are both RPM and Debian
    packages available for your distribution to download, if you don''t have your
    CDs. For RPM versions, visit http://www.rpmfind.net/ and search for RCS. You will
    receive a list of RPMs for source, binaries, development, and other platforms
    (Alpha, Sparc, etc.). You can search for Debian packages at http://www.debian.org/dist/packages.
    With the packaged versions, you can install it by using the appropriate package
    manager options.


    ![](img/81f56bf497dbf7f7582072400d12cb42_166_0.png)


    # # Basic RCS


    RCS is easy to use, especially the basic commands. To start with, cd to the directory
    you''re going to be working in. Usually, I like to maintain a directory for each
    project I''m working on, under a /Writing directory.


    I try to keep one top-level directory, such as /Writing or something equally obvious,
    so that I know what to tar and gzip when I''m making a backup.


    ![](img/81f56bf497dbf7f7582072400d12cb42_166_1.png)


    After you cp to the proper directory, you create an RCS directory for RCS to store
    revisions.


    Run mkdir RCS, and RCS will use that directory to store any revisions you save
    in that directory. You must create an RCS directory in any directory containing
    files that are going to be managed with RCS.


    ![](img/81f56bf497dbf7f7582072400d12cb42_166_2.png)'
