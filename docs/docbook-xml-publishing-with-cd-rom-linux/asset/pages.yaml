  md: "# Declaring a Book\n\nthe declared entities with an ampersand (&) and a semicolon\
    \ (;). Rather than include the entire text of the book in one file, you split\
    \ it into a number of files, which you declare as entities and then call from\
    \ the main book.sgml file. For instance, instead of including the text of the\
    \ preface, you simply include a reference to the preface. When the document is\
    \ parsed, the parser will read the line &preface; as \"include the system document\
    \ preface.sgml and parse it\"\n\nThe XML declaration is nearly the same. Figure\
    \ 4.3 shows how the declaration looks for the XML document.\n\n```\n<xml version=\"\
    1.0\"?>\n<!DOCTYPE book PUBLIC \"//OASIS//DTD DocBook XML V4.1//EN\"\n  \"//file:///user/share/xml/docbook/4.1/docbookx.dtd\"\
    > [\n  <!ENTITY preface SYSTEM \"preface.xml\">\n  <!ENTITY chapter1 SYSTEM \"\
    chapter1.xml\">\n  <!ENTITY chapter2 SYSTEM \"chapter2.xml\">\n  <!ENTITY chapter3\
    \ SYSTEM \"chapter3.xml\">\n  <!ENTITY chapter4 SYSTEM \"chapter4.xml\">\n  <!ENTITY\
    \ index SYSTEM \"index.xml\">\n  <!ENTITY glossary SYSTEM \"glossary.xml\">\n\
    \  <!ENTITY appendix SYSTEM \"appendix.xml\">\n  <!ENTITY bibliography SYSTEM\
    \ \"bibliography.xml\">\n]\n\n<book>\n  &preface;\n  &chapter1;\n  &chapter2;\n\
    \  &chapter3;\n  &chapter4;\n  &index;\n  &glossary;\n  &appendix;\n  &bibliography;\n\
    </book>\n```\n\nThat's all there is to the declaration for a document with the\
    \ Book document type. The Book element and the entities called from within the\
    \ Book element in the example are not part of the declaration itself but are included\
    \ to illustrate what a DocBook book will look like."
