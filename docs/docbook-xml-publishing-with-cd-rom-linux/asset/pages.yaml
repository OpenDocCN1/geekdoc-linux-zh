- pgno: 223
  md: 'That covers most of the basic capabilities of vi. It might take a few days
    of playing around with the keystrokes to navigate and do basic operations within
    vi, but but after you become acquainted with it, you will find that you can get
    around quite quickly and be very productive in vi.


    # Using Vim''s Online Help


    One good thing to remember is that if you''re getting stuck using Vim, and you
    don''t want to dig out a big book, try Vim''s online help feature.


    To get into the help feature, simply press F1, or get into last line mode and
    type help.


    After you''re in help, you can navigate normally, or if you find a topic that''s
    "between bars," like this:


    ```

    |set-option|

    ```


    position the cursor on that text, and press Ctrl+] to jump to that help topic.


    # Opening Files with Vim


    Opening a tile with Vim is pretty straightforward. Typing Vim filename either
    opens an existing file or creates a file if there was not a file by that name
    previously.


    You can also start at a specific part of a file by using one of the following
    methods. Typing Vim +102 filename opens the named file and places the cursor at
    the beginning of line 102. You can also search the file for the first instance
    of a term using Vim +term filename. This uses Vim''s capability to place the cursor
    at the first instance of the search keyword.


    # Advanced Vim


    This chapter mostly has covered very basic functions within Vim. The advanced
    functions of Vim can be, and have been, the subject of entire books. Because DocBook
    is our focus, I won''t attempt to cover all the features of Vim here. However,
    in the following sections I will discuss a few features that shouldn''t be overlooked.


    # Searching Text with Vim


    To search through a file for instances of a string of text, you must be in Vim''s
    last line mode. Instead of using the colon, however, you use either the forward'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'slash (/) or question mark (?) to search through the text. Here are some of
    the commands you can use to search through Vim.


    +   * /text. vi searches forward through the file or buffer for text.

    * ?text. vi searches backward through the file or buffer for text.

    * n. vi searches forward for the next occurrence of the previous search term.

    * N. vi searches backward for the next occurrence of the previous term.


    # Searching and Replacing with Vim


    If you''ve just written a manual for your company''s hot product, and management
    agrees to change the name, don''t fret. You can use Vim''s search and replace
    functions to scour for the old name and replace it with the new one. No problem.
    However, there are no functions within Vim that will give the management folks
    a clue. Sorry, it''s just a text editor.


    Vim allows for advanced search and replace and other simple text editing functions.
    You can search and replace with Vim, enter the last line mode by typing a colon.
    Then enter the search term, replacement text, like this:

    %s/original/replacement/gc


    The preceding command tells Vim to search for the original text and replace it
    with replacement if found, but to ask for confirmation first. The character is
    a separator. The g in the command tells Vim that it is a global search and replace,
    and you want to replace all instances of the first term with the second term.
    The e in the command tells Vim that you want to confirm before replacing the first
    text for the second.


    # Editing Multiple Files Simultaneously


    As discussed in Chapter 4, "Preparing a Book with DocBook," you will often be
    working with multiple files that will eventually be collated into one whole document
    for posting, printing, or whatever. Often, it would be a good thing to edit two
    or more files at the same time. Luckily, Vim makes this fairly easy. If you''re
    Vim editing book.sgml and want to simultaneously edit the index.sgml file located
    in the same directory, enter line mode and type split index.sgml.


    Vim splits the current window and opens the index.sgml file in the other half
    of the window. To switch between files, press Ctrl+w and then press the arrow
    key in the direction of the appropriate file. You can write and quit files'
  merge: -1
