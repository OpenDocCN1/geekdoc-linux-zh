  md: '# Chapter 10: Customizing DocBook


    ```

    <-end of trademark.attlist->>

    <-end of trademark.module->

    ```


    That probably looks confusing, but it''s just verbose. I will break it down so

    that it makes more sense.


    ```

    <!ENTITY trademark.module "INCLUDE">

    [: %trademark.module; [

    <!ENTITY local.trademark.attrib "%role.attrib;">

    ```


    This is the Entity declaration, which tells a parser that there is an entity

    named Trademark and that it should be included. The third and fourth lines

    are declaring an attribute for the Trademark element Role.


    The next 11 lines let the parser know which elements can occur as child ele-\ments
    of the Trademark element. Some elements are declared as groups, such

    as the tech group of elements. Other elements, such as the InlineGraphic,

    are are explicitly declared.


    The final section of the Trademark declaration defines the attributes for

    Trademark, including acceptable values for the Class attribute.


    The practical uphot of all this information is for Jade, or whatever parsing

    tool you''re using, can give you an error message like the one in Figure 10.1,

    sould you use an invalid attribute.


    As you can see in Figure 10.1, the DocBook DTD is intricate. It''s not that

    this stuff is complicated, certainly no more difficult than speaking English.

    However, as we know, the English language is made up of many rules we

    ave to understand before you can speak, at least intelligently. When you

    write a DTD, it''s very similar to creating a language, so if you attempt to alter

    the language, you have to be very careful.


    # The DocBook Hierarchy


    Although most elements in DocBook are contained in the Information Pool

    module, dbpool.mod, all the hierarchical elements in DocBook are contained

    in the DocBook hierarchy module, dbhier.mod. If you want to get informa-

    on any hierarchical elements in DocBook, such as the Sect element or

    the Book element, look in this file. The structure and syntax of the file are

    same as the others, but for organizational purposes, the DocBook Technical

    Committee has segregated hierarchical content into this file.'
