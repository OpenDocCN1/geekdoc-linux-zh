- pgno: 129
  md: '# Chapter 5: Making Online Documents


    xref, which you can''t use again in the document because you do, it will cause
    parsing problems.


    However, because you''re probably writing an entire section about the XRef element,
    you want to use ID values that relate to the topic they describe—just as you would
    use descriptive variable names when programming, you want to use descriptive names
    in your ID attribute values.


    Because I couldn''t reuse xref, I used xref.example, which is perfectly valid
    because it is also unique within the document. If you''re writing an entire section
    on a particular topic, I would suggest using a simple descriptor like xref for
    the ID value of the top-level of the document hierarchy and then using derivatives
    of that value for the rest of the section. This helps as your documents become
    more and more complex, if you use values that are easy to remember and flow logically.
    I would not recommend simply using chapter or sections or any type of numbering
    scheme. If you become dependent on a numbering scheme, you will find yourself
    redoing a lot of markup when you add an extra section or otherwise revise the
    document. Remember that the ID attribute''s values are not seen within the finished
    documents, so you can be relatively verbose and descriptive with your ID values.


    # Using the Link Element


    The Link element behaves more like the Anchor element from HTML markup than the
    other linking elements used in DocBook. The Link element is used in a similar
    fashion to the XRef element, but it is not an empty element. This can be useful
    if you want to link to something with a Title element but do not want to use that
    title for the link text.


    The syntax of the Link element is as follows:


    ```

    <sect2 id="link">

    <title>Using Link Elements</title>

    <para>

    Some Web sites, <link linkend="website">like this one</link>, are examples of
    excellent Web design.

    </para>

    </sect2>

    <sect2 id="website">

    <title>Themes.org</title>

    <para>

    ```'
  merge: -1
