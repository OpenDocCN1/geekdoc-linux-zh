  md: '# Chapter 8: Using Emacs


    ![](img/81f56bf497dbf7f7582072400d12cb42_187_0.png)


    A macro, in computer, is a set of saved instructions that can be recalled with
    a single command or keystroke. Emacs wasn''t a true unto itself, but a set of
    macros for the editor TECO (Tape Editor and Corrector) for ITS (Incompatible Timesharing)
    operating system on the PDP-10 computer. Emacs first came into existence in 1976,
    a while ago for a computer program whose history behind Emacs is quite interesting,
    but, outside the scope of this book. More on the history behind Emacs FAQ at http://www.geekrill.com/emacs/index.html,
    or check out the entries in jargon at http://www.tuxedo.com/esr/jargon/entry/EMACS.html


    One of the most popular text editors for creating documents with DocBook Emacs,
    short for Editing Macros. Originally created by Richard Stallman at M.I.T., Emacs
    is a set of macros that eventually evolved into a full-fledged program named GNU
    Emacs.


    One of the oldest wars in the Linux/UNIX community is the schism between clones
    and Emacs. Proponents of each editor tend to be loyal to their choice of editor
    and somewhat derogatory of the other. It''s a matter of taste. Each text editor
    has features and properties that some love and others do not. I leave it to you
    to decide, and I recommend if you have never used one, try both and see which
    one suits your working habits best. For those who prefer clones, the next chapter
    discusses the use of Vim to edit DocBooks.


    # Getting Emacs


    The first step, of course, is to install Emacs on your system. If you are running
    a Linux distribution, or the BSDs, or any other UNIX-type OS, you probably have
    Emacs installed already. To find out whether you have Emacs, just open an xterm,
    or log in to a console and type emacs. You should get a screen that looks like
    Figure 8.1.


    If you haven''t installed Emacs, read on. I''ll cover the installation process
    for Linux and UNIX-type operating systems, Windows systems, and the MacOS.


    To get source or binaries for GNU Emacs on Linux or UNIX-type OS, visit the GNU
    Emacs home page for a list of mirrors for GNU Emacs and other GNU software, at
    http://www.gnu.org/software/emacs/emacs.html (see Figure 8.2).


    You can also find GNU Emacs on the CD-ROM that comes with this book in source
    form, RPM, Debian packages, and tgz files.


    > The Linux install instructions are also helpful when you decide to upgrade your
    GNU Emacs installation.'
  merge: -1
  img_proc: true
