- pgno: 375
  md: 'DocBook Publishing explains as thoroughly as possible how to work with DocBook.
    However, many topics are associated with DocBook (and publishing)—such as SGML,
    XML, Open Source, and editors—but there just isn''t room to cover everything relating
    to DocBook. In this appendix, I provide several resources for you, in case you''d
    like to strike out on your own and learn more about these topics.


    # Finding Out More about DocBook


    Plenty of information about DocBook is there out on the Web. Many organizations
    are using DocBook, especially Open Source projects such as the Linux Documentation
    Project, the GNOME and KDE projects, and many others. If you need to find sample
    documents and stylesheets, these are great places to store.


    XML is taking off as well, and you can find a wealth of information about XML
    on the Web to help you get up and running using XML for all sorts of fun and exciting
    projects.


    # DocBook Resources


    The best place to get up-to-date information about DocBook is the OASIS DocBook
    page (see Figure C.1) at http://oasis.oasis-open/docbook.


    The DocBook Technical Committee oversees the DocBook updates and revisions, so
    its site, OASIS, is the best place to check for a new version of DocBook or news
    about DocBook. The site also posts minutes from the technical committee''s meetings,
    if DocBook is important to your business or organization, you might want to follow
    what''s going on.


    The OASIS page also provides a list of tools, commercial and otherwise, that are
    available for use with DocBook. Finally, if you''re looking for a place to ask
    questions (or answer them), you can sign up for DocBook mailing lists. The mailing
    lists are low-traffic but occasionally contain good insights into using DocBook.


    The official documentation for DocBook is DocBook: The Definitive Guide, published
    by O''Reilly and Associates. DocBook: The Definitive Guide is also'
  merge: -1
  img_proc: true
- pgno: 376
  md: '# Finding Out More about DocBook


    ![](img/81f56bf497dbf7f7582072400d12cb42_376_0.png)


    Figure C.1 The OASIS DocBook page


    published on the Web and is available for free download for personal use (see
    Figure C.2). At the time of this writing, the printed book is slightly out of
    date, focusing on DocBook version 3.1. However, it is in the process of revision,
    and drafts can also be found on the Web: http://www.docbook.org/.


    O''Reilly deserves kudos for its role in creating and supporting the DocBook DTD
    and for making the book freely available on the Web. DocBook: The Definitive Guide
    is an excellent technical reference, and I encourage anyone who finds the online
    version useful to purchase the book as well.


    # SGML Resources


    SGML has been around for years, so entirely too many sites have information about
    SGML to list them all. I''ve picked a handful of sites to get you started.


    My favorite SGML resource on the Web is Robin Cover''s SGML page (see Figure C.3).
    This is one of the most comprehensive SGML resources on the Web, be sure to check
    it out at http://www.oasis-open.org/cover/general.html.'
