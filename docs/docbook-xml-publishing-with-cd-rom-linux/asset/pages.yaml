- pgno: 323
  md: '# Link


    The Link element holds information for a link that will be created by the processing
    system. For URLs, use ULink.


    The Link element accepts the following attributes:


    +   - **Enderm.** Accepts a CDATA value with no default and is not required. The
    Enderm value, if given, is the element displayed as the link.

    - **Linkend.** Accepts an IDREF value, has no default, but is required.

    - **Type.** Accepts an IDREF value, has no default, and is not required.


    Example:


    ```

    <sect1>

    <para>This <link linkend=sent2>link</link> is linked to the title "Here" in the
    next section.</para>

    <sect id=sent2><title title=Here</title>

    <para>...</para>

    </sect>

    </sect1>

    ```


    # OLink


    The OLink element holds information that accesses a link through a third-party
    element.


    The OLink element accepts the following attributes in addition to the common attributes:


    +   - **LinkMode.** Accepts an IDREF value, has no default, and is not required.

    - **LocalInfo.** Accepts a CDATA value, has no default, and is not required.

    - **TargetDocEnt.** Gives the name of an ENTITY and has no default.

    - **Type.** Accepts an IDREF value, has no default, and is not required.


    Example: Due to the unusual nature of the OLink element and its possible exclusion
    in future versions of DocBook, we cannot provide an example.


    # ULink


    The ULink element holds information for a URL.


    The ULink element accepts the following attributes in addition to the common attributes:


    +   - **Type.** Accepts a CDATA value, has no default, and is not required.

    - **URL.** Accepts a CDATA value, has no default, but is required.'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'Use this syntax if you want the URL to reproduce in plain text or similar formats:


    <link url="http://www.slashdot.org/>http://www.slashdot.org</link>


    # XRef


    The XRef element holds a reference to another portion of a document.

    The XRef element accepts the following attributes:


    +   - Endterm. accepts a CDATA value with no default and is not required. Endterm
    value, if given, is the element displayed as the link.

    - Linkend. Accepts an IDREF value, has no default value, but is required.


    Example:


    ```

    <sect1>

    <para>Review the following sections</para>

    <itemized list>

    <listitem><para>Section 1<xref linkend="sec1\></para></listitem>

    <listitem><para>Section 2<xref linkend="sec2\></para></listitem>

    </itemized list>

    </sect2 id="sec1">

    <title>Section 1</title>

    <para>This is text for Section 1</para>

    </sect2>

    <sect2 id="sec2">

    <title>Section 2</title>

    <para>This is text for Section 2</para>

    </sect2>

    </sect1>

    ```


    # Media Elements


    DocBook deals with a number of media formats, as well as plain text. If your document
    is going to make use of sound or video, you will want to check these out.


    # AudioObject


    The AudioObject element holds information and meta-information about audio referenced
    in a DocBook document.


    The AudioObject element uses common attributes.'
