    SGML menu, and the other PGML menus, are not associated with hot keys but have
    to be accessed via the menus.


    # ## The Modify Menu


    The Modify Menu in PGML mode allows the user to expand elements and references
    to make character references and various other changes to elements and their attributes
    (see Figure 8.17).


    # ## The Markup Menu


    The menu that will probably be most of use while you are editing DocBook is the
    Markup menu available under PGML mode (see Figure 8.17). The Markup menu allows
    you to insert elements and their end tags automatically, depending on tags are
    valid at that point in the document. This saves a lot of time and trouble when
    you get in the habit of using it.


    To end the current element, use the command C-c / , which should be easy to remember
    because all end tags use the / character.


    The Markup menu also gives users the ability to insert attributes in their tags.'
