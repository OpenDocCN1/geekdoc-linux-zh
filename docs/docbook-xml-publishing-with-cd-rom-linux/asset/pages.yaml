    # Working with the Part Element


    Sometimes it is useful to organize the chapters of a book by parts. For example,
    if you were writing a book about the American Revolution, you might have several
    chapters about specific events leading up to the American Revolution, followed-by
    chapters about battles of the Revolution and other noteworthy events that took
    place during the Revolution. Finally, you would probably have several more chapters
    that cover the aftermath of the American Revolution.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# Declaring Book 75


    To make the book easier to follow, you could organize the chapters into distinctive
    parts composed of chapters with related topics, or you could organize the book
    chronologically. Also, you could just divide it into even parts of three chapters
    each.


    The Part element can contain most other elements, with the exception of the Set
    element or the Book element. The Part element can only be nested directly under
    the Book element (It can be nested under the Set element but only within the Book
    element. You won''t find a part of a book as part of a set.)


    The Part element is simple to use. In this example, shown in Figure 4.7, the Part
    element contains the chapter files declared as entities in the first example:


    ```

    <!DOCTYPE book PUBLIC "-//ASIS//DTD DocBook V4.1//EN" [

    <!ENTITY preface SYSTEM "preface.sgml">

    <!ENTITY chapter1 SYSTEM "chapter1.sgml">

    <!ENTITY chapter2 SYSTEM "chapter2.sgml">

    <!ENTITY chapter3 SYSTEM "chapter3.sgml">

    <!ENTITY chapter4 SYSTEM "chapter4.sgml">

    <!ENTITY index SYSTEM "index.sgml">

    <!ENTITY glossary SYSTEM "glossary.sgml">

    <!ENTITY appendix SYSTEM "appendix.sgml">

    <!ENTITY bibliography SYSTEM "bibliography.sgml">

    ]

    <book>

    <part label="Part I: Introduction and Forward">

    &preface;

    </part>

    <part label="Part II: Chapters">

    &chapter1;

    &chapter2;

    &chapter3;

    &chapter4;

    </part>

    <part label="Part III: Index and Appendices">

    &index;

    &glossary;

    &appendix;

    &bibliography;

    </part>

    </book>

    ```'
  merge: -1
  img_proc: true
- pgno: 101
