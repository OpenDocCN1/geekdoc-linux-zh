  md: '# ToEntry


    The ToEntry element is used for any entry in a table of contents.

    The ToEntry element accepts the following attributes in addition to the common
    attributes:


    +   - Linkend. Accepts an IDREF value, has no default value, and is not required.

    - Pagenum. Accepts a CDATA value, has no default, and is not required.


    Example:

    See TOC element example.


    # ToCfront


    The ToCfront element contains any reference in a table of contents to front matter,
    such as a prefix or introduction.

    The ToCfront element accepts the following attributes in addition to the common
    attributes:


    +   - Label. Accepts a CDATA value, has no default value, and is not required.

    - Linkend. Accepts an IDREF value, has no default value, and is not required.

    - Pagenum. Accepts a CDATA value, has no default, and is not required.


    Example:

    See TOC element example.


    # ToClevel1


    The ToClevel1 element contains a reference to a level 1 section in a table of
    contents.

    The ToClevel1 element uses common attributes.

    Example:

    See TOC element example.


    # ToClevel2


    The ToClevel2 element contains a reference to a level 2 section in a table of
    contents.

    The ToClevel2 element uses common attributes.'
