    # Using Vim SGML and DocBook Syntax


    Now that you have a running version of Vim, it''s time to get the syntax files
    for DocBook.


    > If you do a great deal of programming or coding of HTML, you will probably be
    able to find a Vim syntax file that suits your needs. There are syntax files for
    HTML, C, Python, Perl, SGML, and many other languages available.


    You can find Vim syntax files at http://www.vim.org/lang.html or by simply looking
    on the CD-ROM included with this book.'
