- pgno: 96
  md: '# Declaring a Book


    As you see from this example, you can include quite a bit of information about
    your book using the BookInfo element and its children. I would encourage you to
    include as much as possible from the beginning; you never know when it will come
    in handy to have the information available in your document.


    You might be surprised to note that there is no Lastname element. Instead, DocBook
    uses the surname element because it is more useful. In some cultures the surname,
    or family name, is not placed last.


    The OtherName element can be used for middle names, nicknames, or whatever. You
    should probably consult authors before bestowing a nickname on them, or make sure
    that they don''t know where you live. If you or one of the authors or editors
    have an honorific title, you can include it using the Honorific element. Because
    this is a free-form element, you can include any title you want. Usually, the
    element is used for people with Dr. in front of their names, Professor, or any
    other honorary title. Lovemonkey would be a valid title, although not recommended.


    The ISBN element is for including the International Standard Book Number. Almost
    all books have published an ISBN, which makes ordering books much simpler than
    trying to track down a book by title or author. There might be 200 books by John
    Q. Smith titled I Hate My Parents for Giving Me This Name, but each has a unique
    ISBN. If you''re not going to be selling or distributing your book, you probably
    won''t need an ISBN.


    > You will make grammarians and picky people happy by not referring to ISBNs as
    ISBN numbers. ISBN number is redundant the phrase that makes up the acronym includes
    the word number. If you use ISBN in your document, be sure to enclose it in the
    Acronym element.


    ![](img/81f56bf497dbf7f7582072400d12cb42_96_0.png)


    The InvNumber element is used to include a part number for the book. Bits of information
    such as the ISBN or part number are not always displayed when the document is
    rendered. Some stylesheets ignore information for printed output because it is
    mainly for administrative purposes.


    For other valid elements within the BookInfo element, please see Appendix B, "DocBook
    Element Reference."'
  merge: -1
  img_proc: true
- pgno: 97
  md: "# Making the Book's Dedication\n\nAlmost all books contain a dedication to\
    \ someone. Perhaps the author wants to thank him or her eighth-grade English teacher,\
    \ mom, or current spouse. (If you have a spouse, I would highly recommend including\
    \ him or her in the book's dedication. It's much cheaper than a divorce lawyer.)\
    \ The Dedication element is the proper wrapper for a book's dedication.\n\nThe\
    \ following is an example of a basic book dedication (see Figure 4.5). Note that\
    \ the text of the dedication is contained in a Para element and that the only\
    \ valid parent element for the Dedication element is the Book element. This means\
    \ that the Dedication element cannot be nested within any other element.\n\n```\n\
    <book>\n<bookinfo>\n  <firstname>Joe</firstname>\n  <lastname>Zonker</lastname>\n\
    \  <surname>Brockmeier</surname>\n</bookinfo>\n<copyright>\n  <holder>Prima Publishing</holder>\n\
    \  <year>2001</year>\n</copyright>\n<dedication>\n  <para>\n    This book is dedicated\
    \ to my dog.\n  </para>\n</dedication>\n</book>\n```\n\n# The Preface Element\n\
    \nAnother component found in most books is the preface. Just like the first 20\
    \ minutes at work, no one jumps directly into a book without fiddling around a\
    \ bit. The preface gives the author an opportunity to explain to the reader the\
    \ goals of the book and what to expect on the pages that follow. It also gives\
    \ college students something to skim the morning before the semester final"
  merge: -1
  img_proc: true
- pgno: 98
  md: "# DocBook Publishing\n\n![](img/81f56bf497dbf7f7582072400d12cb42_98_0.png)\n\
    \nwhen they haven't read the textbook, so be kind and include at least a brief\
    \ synopsis of the text.\n\nThe Preface element is used for any introductory matter\
    \ in a DocBook book. This may include a preface, an introduction, chapter introductions,\
    \ a forward written by someone else, epilogues, and other such material. Depending\
    \ on your stylesheets, the preface may or may not be formatted differently than\
    \ a regular chapter.\n\nThe Preface element may be contained within the Book or\
    \ Part elements not within any other elements. See Appendix B for all possible\
    \ child elements for the Preface element. I will cover the Part element in more\
    \ detail next.\n\nThe following example contains a very brief forward to a book,\
    \ a title for the forward, and the name of the forward's author (see Figure 4.6):\n\
    \n```\n<book>\n<preface>\n  <title>Read with Caution</title>\n```"
  merge: -1
  img_proc: true
