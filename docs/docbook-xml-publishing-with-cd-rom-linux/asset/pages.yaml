  img_proc: true
- pgno: 325
  md: "# Appendix B: DocBook Element Reference\n\nExample:\n\n```\n<!DOCTYPE mediaobject\
    \ PUBLIC \"//OASIS//DTD DocBook V4.1//EN\">\n<mediaobject>\n<audioobject>\n  <objectinfo>Pronouncing\
    \ Linux</objectinfo>\n  <audiata fileref=\"english.au\"></audiata>\n</audioobject>\n\
    </mediaobject>\n```\n\n# Caption\n\nThe Caption element provides a caption for\
    \ a figure or other graphical element in DocBook.\n\nThe Caption element uses\
    \ common attributes.\n\nExample:\n\n```\n<caption>This is a caption. Groovy, huh?</caption>\n\
    ```\n\n# Figure\n\nThe Figure element is used for a figure displayed with a title.\n\
    \nThe Figure element accepts the following attributes in addition to the common\
    \ attributes:\n\n+   - Float. Accepts a NUMBER value with a default of 0 and is\
    \ not required.\n- Label. Accepts a CDATA value, has no default, and is not required.\n\
    - PgWide. Accepts a NUMBER value, has no default, and is not required.\n\nExample:\n\
    \n```\n<figure>\n<title>Jade's Error Message for Invalid Attribute</title>\n<screenshot>\n\
    <graphic fileref=\"ch10/10-01*\"></graphic>\n</screenshot>\n</figure>\n```\n\n\
    # GraphicCO\n\nThe GraphicCO element references a graphic that has callout areas.\
    \ GraphicCO is going to be phased out and replaced by MediaObjectCO in version\
    \ 5.0 of DocBook.\n\nThe GraphicCO element accepts common attributes.\n\nSee the\
    \ MediaObjectCO example for usage."
  merge: -1
  img_proc: true
- pgno: 326
  md: "# ImageData\n\nThe ImageData element holds information about an image, such\
    \ as the filename or type of image.\n\nThe ImageData element accepts the following\
    \ attributes:\n\n+   * Align\n* Depth\n* EntityRef\n* FileRef\n* Format\n* ScaleFit\n\
    \nExample:\n\n```\n<!DOCTYPE mediaobject PUBLIC \"//OASIS//DTD DocBook V4.1//EN\"\
    >\n<mediaobject>\n <imageobject>\n  <imagedata fileref=\"images/tux.gif\" format=\"\
    gif*\">\n </imageobject>\n</mediaobject>\n```\n\n# ImageObject\n\nThe ImageObject\
    \ element holds information about an image, including meta-information.\n\nThe\
    \ ImageObject element uses common attributes.\n\nExample:\n\nSee ImageData element\
    \ example.\n\n# ImageObjectCO\n\nThe ImageObjectCO element holds image information\
    \ for an image with callouts. The ImageObjectCO element is deprecated and is to\
    \ be replaced in DocBook 5.0 by the MediaObjectCO element.\n\nThe ImageObjectCO\
    \ element uses common attributes.\n\nSee the MediaObjectCO example for usage.\n\
    \n# InlineMediaObject\n\nThe InlineMediaObject element holds information about\
    \ any in-line media—images, audio, or video.\n\nThe InlineMediaObject element\
    \ uses common attributes."
  merge: -1
  img_proc: true
