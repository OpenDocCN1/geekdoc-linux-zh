- pgno: 189
  md: '# Linux and UNIX


    To compile GNU Emacs from scratch, download the source code from the GNU site,
    or grab it from the CD-ROM. You must log in as root—if you don''t have the root
    password for your computer, see your system administrator.(And while you are at
    it, ask your sys admin why or she didn''t install Emacs!) Copy the tarball into
    your /tmp directory, and log in as root:


    ```

    su

    cd /tmp/

    t -zxvf emacs-20.7.tar.gz

    cd emacs-20.7/

    ./configure

    make

    make install

    ```


    You should see messages like those shown in Figure 8.3 while Emacs is compiling.
    Note that the name of the directory in this example is dependent on the version
    number. If the version number of Emacs has changed, the name of the archive and
    directory will change as well.


    ![](img/81f56bf497dbf7f7582072400d12cb42_189_0.png)'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# Emacs on Win32


    To get Emacs for Windows 9x or NT, you can find precompiled binary versions on
    the CD-ROM or check for later versions at http://ftp.gnu.org/gnu/windows/emacs/latest/


    You will find several files in this directory; the one to grab is the full, precompiled
    version of Emacs. It will be named something like emacs-20.7-fullbin-i386.zip,
    but the 20.7 will change as version numbers change. The Web page specifically
    says that these Emacs run on Windows NT, 95, and 98, but no word on whether Emacs
    runs on Windows 2000 or Windows Millennium Edition (Windows ME). If you are running
    2000 or ME, give this a shot—it''s unlikely that your computer will burst into
    flames.


    Unzip the file with WinZip or whatever program you prefer for unzipping Zip files.


    In case you''re wondering the name of the file, 20.7 is the version number, fullbin
    is short for full binary (meaning the entire program in executable form), i386
    is shorthand for machines with Intel processors in the x86 family, and finally,
    zip indicates that it is a Zip file.


    There are no spaces in the filename characters not valid in UNIX type operating
    systems. That''s a good thing to remember if you''re swapping DocBook files with
    folks on Linux or other UNIX-type OSes.


    Figure 8.4 shows the GNU Emacs on Windows FAQ at http://www.gnu.org/software/emacs/windows/ntemacs.html.


    To run Emacs under Windows (see Figure 8.5), just double-click on the emacs.exe
    file.


    # MacOS


    Finally, if you''re running the MacOS, you don''t have to be left out in the cold.
    There''s a port of Emacs for the MacOS as well. I included the MacOS port on the
    CD-ROM, and you can find new versions at http://mac-emacs.sourceforge.net/index.html
    (see Figure 8.6).


    ![](img/81f56bf497dbf7f7582072400d12cb42_190_0.png)'
