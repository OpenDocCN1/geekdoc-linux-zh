    # SimPara


    The SimPara element is similar to the Para element but is more restrictive about
    the types of elements that may be nested within.


    The SimPara element uses common attributes.


    Example:


    ```

    <!DOCTYPE simpara PUBLIC "//OASIS//DTD DocBook V4.1//EN">

    <simpara>This is simple, huh?</simpara>

    ```


    # SimpleSect


    The SimpleSect element is a section of a DocBook document that has no subsection.


    The SimpleSect element uses common attributes.


    Example:


    ```

    <!DOCTYPE sect1 PUBLIC "//OASIS//DTD DocBook V4.1//EN">

    <sect1><title>Our Elements</title>

    <para>There are lots and lots of DocBook elements.</para>

    <simplesect><title>Structure Elements</title>

    <para>FormalPara is a Structure Element.</para>

    </simplesect>

    </sect1>

    ```


    # ToC


    The TOC element begins a table of contents in a DocBook document.


    The TOC element accepts the following attribute in addition to the common attributes:


    +   - PageNum. Accepts a CDATA value, has no default, and is not required.'
