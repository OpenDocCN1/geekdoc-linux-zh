    # The Easy Way Out


    One of the things my Dad taught me was to look for the easiest way to do something
    and get the right result. Whether that means finding the easiest way to cut a
    piece of lumber or do something on the computer, I took that bit of advice to
    heart.


    If you''re in an office or company with a large number of users who are going
    to be creating DocBook documents and rendering output from them, installing DocBook
    and all the appropriate tools on each computer may not be the answer.


    If you happen to have an older computer laying around, a Pentium or Pentium II
    computer with a 3 or 4 GB hard drive, at least 64 MB of RAM, and an Ethernet card,
    you can turn it into a DocBook processing monster.


    Any Linux distribution is sufficient, but I''d recommend Debian/Linux for this
    task—and here''s why: Debian is a wonderful package management tool called the
    Advanced Package Tool (APT). It makes installing any program that''s been packaged
    for Debian a snap, especially DocBook''s DTD and all of the requisite tools to
    create DocBook documents, including PSGML.


    You''ll find plenty of installation and usage information for Debian at http://www.debian.org/doc/


    Once you have Debian installed, you probably have SGMLtools for the DocBook DTDs
    installed. If not, it''s easy to do.


    You should have a file called sources.list in the /etc/apt/ directory. Log in
    as root and edit that file to contain a line like this:


    ```

    deb ftp://ftp.us.debian.org/debian stable main non-free

    ```


    This line should be appropriate for anyone in the United States. It tells the
    apt-get program where to check for packages—in this case, the FTP server ftp.us.debian.org—and
    to check the stable distribution of Debian for'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'requested packages. If you''re located elsewhere, you might want to visit the
    Debian Project''s Web site and find a closer FTP mirror.


    To install DocBook, SGMLtools, and other necessary files for working with DocBook,
    log in to a xterm or console as root and type


    ```

    apt-get update

    ```


    As long as your computer is hooked up to the Network, it will then connect to
    the server, and get the current list of packages. Then type


    ```

    apt-get install task-sgml

    ```


    This will fetch all of the necessary packages and install them for you. Once this
    is done, all you need to do is create user accounts for each person who is creating
    DocBook documents and let them have FTP or SSH access to the computer with all
    of the DocBook tools installed. This will allow your users to create DocBook documents
    in any text editor on any operating system; all they need is access to the DocBook
    system.


    # Making and Installing a Catalog File


    As mentioned in Chapter 1, "Getting Started," you need catalog files to translate
    the Public Declarations to actual files on your system. This is necessary so that
    the parsing and rendering software can find the DTD and stylesheets. Without access
    to those files, tools such as Jade (discussed later in the chapter) are stumped—they
    have no idea whether your file is valid SGML or XML and how to process it if it.


    Although this might seem strange—having to install stylesheets and DTDs to process
    documents in DocBook—remember that most tools that process DocBook are also capable
    of processing other SGML or XML documents. Parsing programs like Jade and OpenJade
    were designed to take a DTD—any valid DTD—and stylesheets and produce output.
    They weren''t designed exclusively with DocBook in mind. Front ends make SGMLtools
    using Jade and OpenJade easier, but they only pass more complicated commands to
    Jade or OpenJade. They still depend on accurate catalog files.


    ![](img/81f56bf497dbf7f7582072400d12cb42_146_0.png)'
