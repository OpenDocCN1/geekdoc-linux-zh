- pgno: 87
  md: 'his chapter walks through creating a book with DocBook. Specifically, you will
    look at the most common appropriate elements used within a DocBook Book element.
    If you''re preparing a book with DocBook, you will find examples of all necessary
    structural elements for a book within this chapter, as well as examples of elements
    commonly used in a book, thrown in for good measure.


    A Book is a document type within DocBook. Each DocBook document must start with
    a document type element; common elements include Book, Article, Set, and Chapter.
    When a document is declared to be a Book, the Book element is the top-level, or
    root, element. A Book often has several elements that contain a Preface, a Dedication,
    Chapters, an Index, and other components. Nearly every DocBook element is valid
    within the Book element, with the exception of the set element.


    > When I say that nearly all elements are valid within the Book element, I mean
    that they fit somewhere in the hierarchy below the Book element. They might not
    be valid directly under the Book element, but they are valid nested within an
    element that is valid within the Book element. For example, the Sect element cannot
    be used directly beneath the Book element, but it might be used under the Chapter
    element, which is valid


    ![](img/81f56bf497dbf7f7582072400d12cb42_87_0.png)


    A DocBook element can be used regardless of the medium in which you eventually
    intend to distribute the book. Although we traditionally think of a book as being
    a collection of dead-tree pages bound within a cover, a DocBook Book can also
    be output and distributed as HTML, PDF, or even plain text. This can be particularly
    useful if you are distributing software, for instance. Many software manuals,
    frankly, go unread.


    Although it would be a very bad idea not to include documentation with a piece
    of software, why spend the money on printing a manual with your software when
    you can include documentation in electronic format? The users going to be at the
    computer when they need the documentation anyway. Why not include a format that
    is searchable and easier to browse on the computer?'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'Note that it''s probably a bad idea to eschew the printed documentation if
    it relates to setting up the computer in the first place. This also allows for
    easier distribution of your software. It is everything in electronic format, you
    you can distribute your software via download, avoiding altogether the costs of
    printing, software media, and boxes.


    Of course, including only electronic documentation does preclude your users''
    reading your documents on long car trips or in the bathroom, but think of all
    the trees you will be saving!


    ![](img/81f56bf497dbf7f7582072400d12cb42_88_0.png)


    # Planning for a Book


    Writing a book requires much planning—at least, that''s what my editors tell me.
    It sounds like a logical theory, so I''m willing to go with it. Before you start
    writing, you will want to do some planning. If you''re writing a technical book,
    you will probably want to commit to a proposed table of contents and write to
    that.


    DocBook, because it is highly concerned with structure, is helpful in these prewriting
    sessions. Write your outline using DocBook structure elements such as the Part,
    Chapter, and Sect1 through Sect5 elements. When you have roughly laid out your
    book down to the sect5 level, perhaps with a few Para elements sketched in, you''re
    ready to start writing. DocBook can be a very handy tool before you start serious
    writing. DocBook is designed to make authors think about structure, so use it
    to its fullest.


    If you can''t map out a book to that level of detail, you probably need to do
    more research and planning before sitting down to write. As an editor, you can
    require an author to lay out his or her book to that level of detail giving the
    go-ahead to start writing.


    # Dealing with Multiple Files


    Although it''s possible to have all the contents of a Book in one file, it''s
    certainly more convenient to separate the Chapter elements into different files.
    This is much more manageable, particularly if one author is not writing all the
    chapters. When you look at the first example of a document declaration for a book,
    notice that each of the book''s chapters is its own file.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# Chapter 4: Preparing a Book with DocBook


    Also, if your book will contain images, it''s a good idea to plan for them at
    the beginning of the project. You don''t have to decide exactly what images you''re
    going to include, but it helps to know what procedure you''re going to use and
    what formats you''ll work in. Decide which kinds of output you will want to create,
    and save your images in the appropriate formats. Also, for management purposes,
    save images in separate directories by chapter or section, and come up with a
    naming scheme that can be used to organize the images by chapter and number. Figure
    4.1 shows files from a work in progress.


    If you haven''t read it yet, Chapter 3, "Using Images," deals with images in greater
    detail.


    > When you create images, save them first in a format that can easily be converted
    to other formats without loss of picture quality—such as EPS or Photoshop''s PSD
    format. You might only be doing an online document now, but at some later date
    you might want to create a print version. If all you have are JPG files, you''re
    not going to have the quality necessary to create attractive images in print.


    ![](img/81f56bf497dbf7f7582072400d12cb42_89_0.png)


    ![](img/81f56bf497dbf7f7582072400d12cb42_89_1.png)


    Figure 4.1 Organizing images and files by chapter'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# Declaring a Book


    Finally, if more than one person is working on a book simultaneously, it''s a
    good idea to implement a centralized version-control system. a system that allows
    people to check out and check in materials while maintaining the original files
    allows multiple people to work on the same files while keeping the originals for
    later reference. You might find that you want to undo some changes made by an
    editor or another author. Having the old versions of the files makes this much
    easier. You can learn more about version control systems and the Free Software
    CVS program in Chapter 7, "Collaborative Work."


    There are many version control systems, but CVS is one of the most popular versions
    available. It also has the virtue of being Free Software and several GUI front
    ends to make life simpler for those who aren''t fond of the command line.


    ![](img/81f56bf497dbf7f7582072400d12cb42_90_0.png)


    # Declaring a Book


    In DocBook, the first step in producing a book or any DocBook document is to declare
    your document type. I cover document types extensively in Chapter 1, "Getting
    Started," so if you''re not comfortable with document declarations, you might
    want to return to Chapter 1 and review a bit. This is a simple declaration for
    a book with a preface, four chapters, an index, a glossary, an appendix, and a
    bibliography (see Figure 4.2). You will name your file book.sgml, or book.xml
    if you''re working with XML.


    ```

    <!DOCTYPE book "-//OASIS//DTD DocBook V4.1//EN">

    <!ENTITY preface SYSTEM "preface.sgml">

    <!ENTITY chapter2 SYSTEM "chapter2.sgml">

    <!ENTITY chapter3 SYSTEM "chapter3.sgml">

    <!ENTITY chapter4 SYSTEM "chapter4.sgml">

    <!ENTITY index SYSTEM "index.sgml">

    <!ENTITY glossary SYSTEM "glossary.sgml">

    <!ENTITY appendix SYSTEM "appendix.sgml">

    <!ENTITY bibliography SYSTEM "bibliography.sgml">


    <book>

    &preface;

    &chapter1;

    ```'
  merge: -1
  img_proc: true
