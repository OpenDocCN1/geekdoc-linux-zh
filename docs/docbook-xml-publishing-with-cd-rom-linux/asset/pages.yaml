    # # Summary


    This chapter explains the basics of DocBook in very general terms. In the rest
    of the book, I''ll take these building blocks and show you how to create DocBook
    documents and create output from them. Although some of the concepts in this chapter
    might seem complex, if you work with DocBook for a short while, they will become
    much easier to grasp.


    You will probably also find that you don''t have to memorize most of the information
    here. Usually, you will need only a small percentage of the elements and features
    of DocBook to create useful documents. DocBook has a huge number of elements to
