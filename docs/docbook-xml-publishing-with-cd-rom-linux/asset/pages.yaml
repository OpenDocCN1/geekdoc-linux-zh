    | Including images in DocBook documents is a hefty topic all by itself. Get the
    full scoop on images, check out Chapter 3, "Using Images." |


    ![](img/81f56bf497dbf7f7582072400d12cb42_52_1.png)


    # The Filename Element


    When writing technical articles about computers, you will probably have to refer
    to the specific name of a file from time to time. Generally, text specified with
    the Filename element is in a different font or typeface in the final output document
    to distinguish it from the regular text. As shown in the next example, the Filename
    element may be used alone or with an optional class'
