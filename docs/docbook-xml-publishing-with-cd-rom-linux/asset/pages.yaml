- pgno: 35
  md: 'it is also valid to further describe the <sect1> element by using the label
    attribute, like this:


    ```

    <sect1="1.1">

    ```


    Using the label attribute can give the document more meaningful structure later
    when the document is processed and the section is identified as part 1.1 of the
    printed (or online) document. You do not have to choose a numeric label, however.
    You can just easily call that John if you want to, and the next three sections
    can be Paul, George, and Ringo.


    More than likely, you will find that the DocBook set of elements is rich enough
    that it won''t be necessary to make up elements; most possible cases have already
    been handled by existing elements. However, if you absolutely have to add an element
    for one reason or another, it can be done. Chapter 10, "Customizing DocBook,"
    for more information on how to tailor DocBook to your specific needs.


    I don''t recommend adding elements to DocBook. However, there is a simplified
    DocBook DTD that contains a subset of the DocBook elements for those authors who
    don''t want the entire set of DocBook elements. I cover the simplified DTD in
    Chapter 10, "Customizing DocBook."


    Next you will see what an element looks like in a document and what each bit means.


    # Anatomy of Markup Elements


    If you haven''t spent much time with HTML or a computer language, DocBook markup
    might look scary at first. It is, after all, designed to press a lot of information
    into a small space. Like any type of jargon, it is generally confusing to the
    uninitiated.


    Each element is represented by a start tag and an end tag,


    Here is an example of a normal element, with attributes:


    ```

    <trademark class="registered">Linux</trademark>

    ```


    The first part of the element, the start tag, begins with the < and is closed
    with the > symbol. The first word after the < is the element itself, and anything
    after that is an attribute of that element. In this case, class is the attribute,
    and registered is the value of the attribute. Some times the


    ![](img/81f56bf497dbf7f7582072400d12cb42_35_0.png)'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# Understanding DocBook Markup


    of an attribute is predefined; other times it is freeform. Appendix B explains
    each element, which attributes (if any) it takes, and their possible values.


    The > character ends the start tag. After that is the content of the element,
    until the end tag, which begins with </ and signals the end of the element.


    There is one type of element that has only one tag and the empty element. So-called
    empty elements are both a start and end tag unto themselves. An empty element
    is one element that does not enclose any markup content, such as the ImageData
    element. The ImageData element provides all the information necessary as an attribute
    of the element and does not enclose other content.


    If you''re dealing with an empty element, it will contain all the information
    necessary within the beginning element. There are a few possible ways to express
    empty elements. When working with SGML, you can type an empty element like this:


    ```

    <emptyelement attribute="empty\></emptyelement>

    ```


    or like this:


    ```

    <emptyelement attribute="empty"/>

    ```


    With XML, an empty element is expressed like this:


    ```

    <emptyelement attribute="empty"/>

    ```


    This is one of the ways that SGML and XML are not quite compatible in their markup.


    | < and > characters are reserved for denoting elements in DocBook markup. That
    means that if you want to output a document with one of those characters, you
    must use the escape characters for them. If you want to use the right angle bracket,
    also called the greater-than symbol, the &gt;. &lt; escape code is used for the
    less-symbol. |


    ![](img/81f56bf497dbf7f7582072400d12cb42_36_0.png)


    # DocBook Comments


    DocBook was created to be shared by multiple authors and because DocBook markup
    can become complex, you have the ability to add comments in your markup that will
    not be processed by the parser. If you see a line that begins with the markup
    :- and ends with the markup -> (see Figure 1.3), it is a comment.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# Chapter 1: Getting Started


    ![](img/81f56bf497dbf7f7582072400d12cb42_37_0.png)


    Figure 1.3 A DocBook comment


    It''s a good idea to use comments to communicate with other authors and edi-tors
    on a project or to remind yourself exactly what the markup in a partic-ular complicated
    section does. You might be surprised how something seems obvious becomes completely
    confusing in six months, when you''ve for-got why you did it in a particular way.


    > I often use comments to leave notes for myself in documents, such as "Revise
    this when the next version comes out" or "Don''t forget to add more detail in
    this section later." You will also find many comments in the templates on the
    CD-ROM that explain exactly certain markup do and how you can modify it for your
    own nefarious purposes.


    ![](img/81f56bf497dbf7f7582072400d12cb42_37_1.png)


    # Stylesheets — What They Are and How to Use Them


    The DTD describes all the elements that can be used in a markup language, their
    possible attributes, and so on. However, what a DTD does not is to describe the
    content of elements should look like when the document is published in one form
    or another.


    The look and feel of a document is described by stylesheets. A stylesheet gives
    an application the necessary information to create a finished HTML., Post-Script,
    PDF, audio, braille, or other type of document (see Figure 1.4).'
  merge: -1
