    # Checking Out a File


    If you want to edit the testfile.txt file, you must check it out of RCS to be
    able to work with it. To do that, you use the co command.


    In addition to checking the file out of RCS, you lock it so that no new revisions
    can be committed until you''ve checked in your latest revision. At the shell prompt,
    type in co -1 filename.txt. Provided that everything is correct, RCS will give
    you positive feedback, as shown in Figure 7.4.'
