    # Jade — James'' DSSSL Engine


    Jade, for James'' DSSSL Engine, is a collection of tools that implement the DSSSL-style
    language. Jade is required by SGMLtools-Lite and other programs to parse DocBook
    files.


    Jade is available on both UNIX-type operating systems and Win32 systems, but there
    are no ports for the MacOS that I''m aware of. However, if you are in a mixed
    environment of Windows, Linux, and Macs, you can use SSH or Telnet to do your
    work on a Linux machine from your.


    Win32 is any of saying the versions of Windows32 that make use of its Win32 API.
    This includes Windows 95, 98, NT, Millennium, and 2000.


    # Installing Jade on UNIX-type Systems


    Jade might already be installed on your system if you''re running Linux or one
    of the BSDs. If not, grab the source from the Jade Web site at http://www.jclar.com/jade/
    or off the CD-ROM for this book.


    You will get Jade in a tar-gzip file. Copy that file to the /tmp directory and
    uncompress it as shown in the code example and Figure 6.3.


    ```

    cp jade-1.2.1.tar.gz

    tar -zvf jade-1.2.1.tar.gz

    c jade-1.2.1/

    ./configure

    make

    make install

    ```


    If you prefer to install binaries, you can find RPMs and Debian Packages on the
    CD-ROM as well. Instructions for installation of the RPMs and Debs are located
    on the CD-ROM with each.


    # Installing Jade on Win32


