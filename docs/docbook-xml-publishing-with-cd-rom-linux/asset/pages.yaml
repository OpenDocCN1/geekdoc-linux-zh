    happen, but I check the site to see whether there are any corrections. I will
    also post updates on new developments with DocBook and other related technologies
    so that you can keep up to date with DocBook easily.


    If you have questions or corrections for me, please send them to ZonkerBooks.net,
    and I''ll try to respond and fix any errors for the next edition of this book.


    There''s also a section for my other book, also published by Prima Publishing,
    Install, Configure, and Customize Slackware Linux. If you''re new to the whole
    Linux thing, it is well worth picking up.'
