    # Part


    The Part element starts a part of a book. A part is typically a collection of
    several chapters. If you have introductory text to include, see the PartIntro
    element.


    The Part element accepts the following attributes in addition to the common attributes:


    +   - Label. Accepts a CDATA value, has no default, and is not required.

    - Status. Accepts a CDATA value, has no default value, and is not required.


    Example:


    ```

    <!DOCTYPE part PUBLIC "//OASIS//DTD DocBook V4.1//EN" [

    <!ENTITY chapter4 SYSTEM "chapter4.sgml">

    <!ENTITY chapter5 SYSTEM "chapter5.sgml">

    ]

    <part status="draft" label="Neat">

    <partintro>

    <para>This is an introduction to a DocBook Part</para>

    </partintro>

    &chapter4;

    &chapter5;

    </part>

    ```


    # Partintro


    The PartIntro element holds introductory text for a book part. The Part element
    may not contain a Part element directly, so if the part is to contain any introductory
    text, it must be nested within the PartIntro element. (See Part.)'
