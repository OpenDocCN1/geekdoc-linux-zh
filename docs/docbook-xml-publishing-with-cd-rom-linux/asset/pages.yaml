- pgno: 204
  md: '# How to Save Time with Emacs — Emacs PSGML Mode


    # Editing DocBook in Emacs


    Move from the Fundamental mode to the PSGML mode in Emacs, type M-x sgml-mode.
    If all the files are in the right places, you should now be in PSGML mode (see
    Figure 8.14).


    The PSGML mode offers some advantages for marking up DocBook documents. You will
    note that when you enter the PSGML mode, you have additional menus to work with
    that are specifically concerned with SGML.


    Using the menus in PSGML mode, you can insert elements and attributes, hide the
    markup to look only at the text, and even validate the document and look for errors.


    # The SGML Menu


    The SGML menu in PSGML mode allows you to list valid tags by context, validate
    the current document, and toggle the warning log to see the kind of errors in
    your document (see Figure 8.15). Many functions available in the


    ![](img/81f56bf497dbf7f7582072400d12cb42_204_0.png)'
  merge: -1
