    Robin Cover provides not only great SGML resources but also an awesome XML resource
    page (see Figure C.8). The XML Cover Pages, as it is called, includes resources
    for XML, XSL, CSS, and XLink, recent news and developments, and probably the most
    extensive SGML/XML bibliography you will ever see. The Cover Pages are part of
    the OASIS Web at http://www.oasis-open.org/cover/


    Finally, XML.com is a site with plenty of XML resources and feature articles about
    XML and its uses (see Figure C.9). This is a must-read for XML users. The featured
    articles alone are worth a visit, and if you''re just now finding out about this
    XML stuff, you can browse through the article archive and get up to speed. XML.com
    is located at http://www.xml.com/


    # Other Open Source Software and Stuff


    You''ve probably noticed that I''ve mentioned Linux, FreeBSD, NetBSD, OpenBSD,
    and other Open Source and Free Software projects in this book. Even though you
    can use DocBook on Windows, the MacOS, and other operating systems, its strongest
    user is in the Open Source world.'
