- pgno: 59
  md: '# Chapter 3: Using Images


    We''ve all probably heard the saying "A picture is worth a thousand words." Strictly
    speaking, this isn''t entirely true—I''ve never had an editor who was willing
    to accept two pictures in place of a 2,000 word article, for instance. However,
    it is true that images and figures are often helpful in documentation.


    This chapter explains how you use DocBook markup to include images in your DocBook
    documents, how you create tables using DocBook markup, and how you prepare documents
    with images for multiple output formats. It also briefly looks at using MathML,
    a markup language for mathematical equations that can be used with DocBook XML,
    and gives a brief overview of using TeX and LaTeX for figures and equations with
    DocBook SGML...


    It might also be a good time to note that DocBook is not appropriate for. While
    DocBook is excellent for books, technical articles, online documentation, and
    many others, it isn''t a replacement for programs like QuarkPress or Adobe Illustrator.
    You won''t be able to do super-fancy tricks with text or do exotic things with
    graphics you see in Rolling Stone or other graphics-intensive magazines. If you''re
    working in that kind of environment, it still makes sense to have authors submit
    work in DocBook, but do the layout in the program of your choice.


    > TeX, pronounced "tech," is a typesetting program written by legendary hacker
    Donald Knuth. LaTeX, pronounced "la-tech," is a collection of macros that are
    designed to make typesetting with TeX much easier, allowing the author to concentrate
    more on the document structure and content than on the presentation. (Sounds a
    little like DocBook, doesn''t it?) Just because TeX and LaTeX are used specifically
    for typesetting doesn''t mean they''re WYSIWYG programs or that they''re easy
    to use. TeX markup makes DocBook markup look like a piece of cake.


    ![](img/81f56bf497dbf7f7582072400d12cb42_59_0.png)


    Including images in your documentation is easy with DocBook and helps you convey
    your message with even more clarity, so let''s get to work.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# Types of Images


    DocBook is not picky about the types of images you use. However, before you create
    image files, you must decide which types of formats you''d like to output. If
    you''re aiming for Web publication, you work with files that can be viewed with
    a Web browser—JPEG, GIF, or PNG files. If you''re planning to create PostScript
    files for printing, you work with Encapsulated PostScript files, also known as
    EPS. EPS files are also the preferred file format for creating PDF files.


    DocBook doesn''t care about the types of images you specify because it doesn''t
    worry about your output medium. That''s a job for—no, Superman (sorry, comics
    fans!)—whatever program you use to parse and render DocBook. Remember, you can
    use DocBook to create any type of output you imagine—as long as you or someone
    else has written a program that can parse and render output in your preferred
    format. Theoretically, you could use sound files of images if you had a program
    that outputs audio. Does that sound silly? If you realize the same DocBook markup
    creates Web pages and prints documents can also be used to create braille output
    or even audio output for blind readers.


    ![](img/81f56bf497dbf7f7582072400d12cb42_60_0.png)


    With the increased emphasis on multimedia Web content, I should point out that
    you''re not limited to static image files. Chapter 5, “Making Online Documents,”
    covers including multimedia files in your documents for use on the Web.


    # Preparing for Web Publication


    Right now there are two dominant graphics formats on the Web, and another rapidly
    gaining popularity. The old-school formats are JPEG and GIF files. PNG is the
    up-and-coming format that''s taking the Web by storm. (Okay, maybe not “by storm,”
    but it sounds more dramatic that way.) JPEG is pronounced jay-peg and stands for
    Joint Photographic Experts Group, which is the group of folks who came up with
    the JPEG standard in the first place.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Chapter 3: Using Images


    # JPEG


    JPEG images are smaller files produced by compressing the image data and leaving
    some of the image information based on the known limitations of the human eye.
    This is called a loss image format because it loses some of the image information
    in the process of compression. Basically, the algorithm tries to omit data that
    is harder to perceive as missing. One advantage to the JPEG standard is that you
    can decide how much to compress the image and, therefore, what type of quality
    you will get from the image. Although JPEGs are not suitable for publication,
    they are suitable for use on the Web.


    There''s not quite room to go into JPEGs in great detail in this book, but the
    way they are created is interesting, at least, if you are a computer geek like
    me. If you want to find out more about JPEGs visit the JPEG FAQ index at http://www.faqs.org/faqs/jpeg-faq.


    You will learn everything you want to know about JPEGs but were afraid to ask.


    ![](img/81f56bf497dbf7f7582072400d12cb42_61_0.png)


    Almost any photo-manipulation program can produce JPEGs of Web-ready quality.
    Adobe Photoshop, Adobe Illustrator, The GIMP, PaintShop Pro, and many others can
    produce an image suitable for using on the Web.


    Usually, JPEGs are saved with the extension .jpg or .jpeg. For conformity, all
    images in examples and document templates use three-letter extensions in lowercase
    format. When you are parsing and rendering DocBook documents, it''s common to
    get errors because the case of the image name differs from the markup and the
    real filename. Chapter 7, "Collaborative Work," gives some tips for preventing
    that type of confusion when working with multiple authors on a document.


    JPEGs are supported by just any browser that supports images, so it shouldn''t
    be worisomeome if you''re producing a site that will be viewed with older browsers.


    # GIF


    The GIF format is the other common format on the Web. GIF is usually pronounced
    jiff, but many variations abound. GIF stands for Graphical Interchange Format.'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'The GIF format is a raster data type and tends to be slightly smaller and of
    lower quality than JPEG. The main advantages of the GIF format are that GIFs can
    have animated, as well as static, images and that GIF images allow transparency,
    whereas JPEGs do not. GIFs are also widely accepted as JPEG images in browser
    compatibility. GIFs do not allow a full color palette, however; they are limited
    to 256 colors.


    GIF files are a product of a patented algorithm, LZW compression. LZW stands for
    Lempel, Ziv, and the inventors of the compression. Unfortunately, Unisys, the
    holder of the patent for GIF files, has decided to take an unusual stance with
    regard to its patent. Unisys feels that it should receive invalid licensing fees
    for its patent from commercial programs that output the GIF format and, also,
    from Web masters who use GIFs on their Web site.


    Most of the Internet community is outraged not only because Unisys is asking for
    this fee but because the price is $5,000 per license. I''m not aware of any sites
    being shut down for using GIFs, but I see no reason to tempt fate fate when other
    suitable image formats are available.


    For more information about the LZW/GIF patent issue, visit http://www.burnallgif.org/
    (see Figure 3.1).


    Because of the controversial nature of GIFs, I do not use them in any examples
    in this book. I mention them simply because so many people already have GIF images,
    but I do not encourage their use in production until the patent expires or Unisys
    changes its policies.


    Because of the patenting issues with GIFs, the PNG format was invented. I''ll
    cover that one next. If you have some GIF images that you need to convert to PNG
    format, you can find suitable tools for the job on the Portable Network Graphics
    Web site at http://www.libpng.org/pub/png/pngapcv.html.


    # PNG


    PNG, pronounced ping, stands for Portable Network Graphics, or PNGs Not GIF, depending
    on whom you ask. PNG development started partly because of Unisys''s licensing
    policy but also because many people thought there was room for improvement over
    GIFs.


    ![](img/81f56bf497dbf7f7582072400d12cb42_62_0.png)'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Chapter 3: Using Images


    ![](img/81f56bf497dbf7f7582072400d12cb42_63_0.png)


    The drawback to using PNG images is the question of software and browser support.
    PNGs are supported by the latest versions of Netscape Navigator and Internet Explorer,
    but older versions may not handle PNGs well or at all. Some features of PNGs (transparency,
    for example) may also be unavailable in certain browsers. If you are catering
    to Netscape or Internet Explorer versions-3 or earlier, it is probably best to
    stick with JPEGs. If you are certain that your audience is to be users with newer
    browsers, use PNGs with confidence.


    By the same token, if you''re using early versions of Adobe Photoshop or image-manipulating
    programs, you may not have support for saving graphics in the PNG format.


    PNGs offer the best of both worlds: a non-lossy image format that has a small
    image size, offers transparency, and supports indexed-color, grayscale, and truecolor
    images (see Figure 3.2).


    To test your browser, point it at this URL: http://www.w3.org/Graphics/PNG/inline
    alpha.html.


    Now that you know what your options are, you will look at using DocBook markup
    to include images in documents.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Types of Images


    ![](img/81f56bf497dbf7f7582072400d12cb42_64_0.png)


    Figure 3.2 An example of a PNG image in a fully compliant browser


    # Marking Up Images for the Web


    A number of different elements can be used in DocBook to include images, but many
    of them are now deprecated.


    DocBook is developed, the OASIS Technical Committee occasionally decides that
    something can be better done than it is currently being or that new technologies
    indicate a need to do something differently. The committee makes changes in the
    DocBook DTD to reflect that.

    However, the policy is to avoid drastic changes in the DTD in a short period of
    time. An element that is to be eliminated will be supported, but its discouraged.
    This keeps incompatibilities between major versions of DocBook at a minimum.

    Although you still can use deprecated elements, such as when you get an older
    DocBook document from someone else, I avoid using them in this book to minimize
    confusion and avoid starting bad habits.


    > A deprecated element is still valid but is being phased out in favor of a new
    element or simply being eliminated.


    ![](img/81f56bf497dbf7f7582072400d12cb42_64_1.png)'
  merge: -1
  img_proc: true
- pgno: 65
  md: "# Chapter 3: Using Images\n\nThe three elements I use here to include a graphic\
    \ in a document are the MediaObject, ImageObject, and ImageData. Unlike HTML,\
    \ it isn't sufficient to stick in an img element and let it go at that. The MediaObject\
    \ element isn't limited to graphics, and may also contain an AudioObject element\
    \ and/or a VideoObject element.\n\nThe MediaObject element may also contain the\
    \ TextObject element and its child element, the Phrase element, but not alone.\
    \ The TextObject and Phrase combination have to be used in conjunction with the\
    \ ImageObject, AudioObject, or VideoObject element. The TextObject should not\
    \ be confused with the Caption element, which is used to produce a standard caption\
    \ for addition to the image, not alternative text for display in place of the\
    \ image.\n\nRight now, you are concerned only with the use of the ImageObject\
    \ element in conjunction with the TextObject and Phrase pair to produce output\
    \ for the Web.\n\nIn a typical Web page, you will see this markup to display an\
    \ image with native text, in case the browser does not support images or they\
    \ are turned off:\n\n```\n<img src=\"image.jpg\" alt=\"This is an image\">\n```\n\
    \nThis produces the output shown in Figure 3.3.\n\nIf viewed in a text-only browser,\
    \ such as Lynx, you will see the output shown in Figure 3.4, instead.\n\nTo render\
    \ this output in HTML, you must include all the necessary information in DocBook\
    \ markup, as shown in Figure 3.5.\n\n```\n<mediaobject>\n<imageobject>\n<imagedata\
    \ fileref=\"image.jpg\">\n</imageobject>\n<textobject>\n<phrase>\n is an image.\
    \ If you could view images, you would see a nifty image!\n</phrase>\n</textobject>\n\
    </mediaobject>\n```"
  merge: -1
