- pgno: 311
  md: "# Contrib\n\nThe Contrib element holds the contribution information for a contributor\
    \ to a document. The Contrib element lists the contributions made to the document,\
    \ not the name of the contributor.\n\nThe Contrib element uses common attributes.\n\
    \nExample:\n\n```\n<editor>\n  <firstname>Kara</firstname>\n  <surname>Pritchard</surname>\n\
    \  <contrib>Technical editing and co-author</contrib>\n</editor>\n```\n\n# Copyright\n\
    \nThe Copyright element holds the elements that make up the copyright information\
    \ for the document.\n\nThe Copyright element uses common attributes.\n\nExample:\n\
    \n```\n<copyright>\n  <holder>\n    <author>...</author>\n    <corpname>Prima\
    \ Publishing</corpname>\n  </holder>\n  <year>2001</year>\n</copyright>\n```\n\
    \n# CorpAuthor\n\nThe CorpAuthor is used when a corporation, not an individual,\
    \ is given credit for a document.\n\nThe CorpAuthor element uses common attributes.\n\
    \nExample:\n\n```\n<synopsis>\n  <corpauthor>Sun Microsystems</corpauthor>\n \
    \ ...\n</synopsis>\n```"
  merge: -1
  img_proc: true
- pgno: 312
  md: "# CorpName\n\nThe CorpName element holds the name of a corporation, used in\
    \ meta-information only. The CorpName element is not used in inline markup to\
    \ designate corporations, only in meta-informational elements, such as the *Info\
    \ elements.\n\nThe CorpName element uses common attributes.\n\nExample:\n\nSee\
    \ Copyright element example.\n\n# Country\n\nThe Country element holds the name\
    \ of a country as a child to the Address element.\n\nThe Country element uses\
    \ common attributes.\n\nExample:\n\n```\n<country>USA</country>\n```\n\n# Date\n\
    \nThe Date element holds date information. Note that the Date element is not used\
    \ to mark up all dates that appear in a document, only those that appear in meta-information\
    \ or reference elements.\n\nThe Date element uses common attributes.\n\nExample:\n\
    \n```\n<date>February 23, 1970</date>\n```\n\n# Edition\n\nThe Edition element\
    \ holds edition information about a document.\n\nThe Edition element uses common\
    \ attributes.\n\nExample:\n\n```\n<!DOCTYPE bookinfo PUBLIC \"OASIS//DTD DocBook\
    \ V4.1//EN\">\n<bookinfo>\n  <title>...</title>\n  <authorgroup>...</authorgroup>\n\
    \  <edition>DocBook Publishing V1.0</edition>\n  <copyright>...</copyright>\n\
    </bookinfo>\n```"
  merge: -1
  img_proc: true
- pgno: 313
  md: "# Editor\n\nThe Editor element holds information about the editor of a DocBook\
    \ document or cited work.\n\nThe Editor element uses common attributes.\n\nExamples:\n\
    \nSee Contrib element sample.\n\n# Epigraph\n\nThe Epigraph element holds an epigraph\
    \ for a chapter, a section, or another DocBook element.\n\nThe Epigraph element\
    \ uses common attributes.\n\nExample:\n\n```\n<!DOCTYPE chapter PUBLIC \"//OASIS//DTD\
    \ DocBook V4.1//EN\">\n<chapter>\n  <title>...</title>\n  <epigraph>\n    <attribution>Einstein</attribution>\n\
    \    <para>Mathematics deals exclusively with the relations of concepts to each\
    \ other without consideration of their relation to experience.</para>\n  </epigraph>\n\
    </chapter>\n```\n\n# FirstName\n\nThe FirstName element holds the first name of\
    \ an author, an editor, or other meta-information element. The FirstName element\
    \ isn't used to designate every first name mentioned in the text of a document.\n\
    \nThe FirstName element uses common attributes.\n\nExample:\n\n```\n<firstname>Joe</firstname>\n\
    ```\n\n# Footnote\n\nThe Footnote element creates a footnote. The Footnote element\
    \ is very convenient for authors because it requires no special formatting or\
    \ worries about placement of the footnote in layout. Simply use the Footnote element\
    \ in-line text you want to footnote, and the processing system will handle setting\
    \ it off from the text."
  merge: -1
  img_proc: true
- pgno: 314
