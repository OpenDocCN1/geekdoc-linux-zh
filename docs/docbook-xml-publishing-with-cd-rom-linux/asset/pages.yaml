    Linux system boots to the <prompt>LILO</prompt> prompt.</para>

    ```


    # Property


    The Property element indicates a system property, such as the color of the background,
    the width of a scrollbar, or any other property of the system.


    The Property element uses common attributes.


    Example:


    ```

    <para>The default <property>background</property> of my xterm black.</para>

    ```


    # Replaceable


    The Replaceable element indicates that text inside the markup is replaceable.
    This element is good for describing the syntax of a command or any other operation
    where there are variable elements the user can replace.


    The Replaceable element uses common attributes.


    Example:


    ```

    <para>To change your password, enter <command>passwd</command><replaceable>username</replaceable>
    at the command prompt.</para>

    ```


    # ReturnValue


    The Return element indicates a value returned by a user action, function, or command.


    The ReturnValue element uses common attributes.'
