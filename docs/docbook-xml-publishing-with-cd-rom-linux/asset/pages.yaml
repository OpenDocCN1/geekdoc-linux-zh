- pgno: 239
  md: '# Understanding XSL


    XSL consists of three technologies rolled into one:


    +   - XSL Formating Objects (XSL-FO). A language for transforming XML documents
    and the vocabulary for specifying formatting

    - XSL Transformations (XSLT). A language for transforming an XML document into
    another XML document

    - XPath. A language for addressing parts of an XML document


    The XSLT and XPath technologies are still "candidate recommendations" with the
    W3C, so they''re not fully mature yet. However, with things moving at Internet
    speed, many developers are already building solutions with the specifications
    given in the candidate recommendation. Most applications for XSLT and XPath are
    still more or less theoretical. The information in the recommendations as it relates
    to this book is probably stable. However, there is the possibility that specifics
    will change when the final drafts are released.


    For the most part, I will ignore the XPath language because we''re concerned with
    the formatting aspects. For that, I''ll be talking almost exclusively about XSL.


    # Customizing Stylesheets on the Web


    Is all this too complicated or time consuming to mess with? Well, now there''s
    a better way. Norman Walsh, genius that he is, has come up with a Web-based form
    for building a custom stylesheet with XSL online. That''s right, it''s mostly
    point and click, and you can develop your own stylesheet using a form.


    You can find Norman''s Stylesheet Customization Form online at http://www.nwalsh.com/docbook/xsl/custom-html.html.
    The site warns that it''s a beta release, but it seems to work fine. It might
    be official by the time this book is in your hands.


    ![](img/81f56bf497dbf7f7582072400d12cb42_239_0.png)


    > Norman Walsh comes up with so much great that I have to wonder whether he really
    exists, or is "Norman Walsh" a collective or something. It would explain a lot.
    Great work, though.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# Is It Possible to Transform DocBook XML

    Other XML Formats?


    At some point you might want to transform your DocBook XML document

    into XML data for another application. Because XML was designed with

    data interchange in mind, the W3C has created a technology called XSL\nTransformations.
    With XSL Transformations, also known as XSLT, it''s also

    possible to take a DocBook XML document and convert it into another

    XML format.


    # What is XSLT?


    XSLT is used to convert a document that conforms to a particular XML

    DTD into a document that conforms to another XML DTD. XSLT can

    work with XSL or separately. You can find the W3C''s XSLT Recommenda-

    here: http://www.w3.org/TR/xslt.html.


    It''s important to note that XSLT is a language, not an application. That

    means that you need a parser that supports XSLT to transform documents, in

    adition to XSLT stylesheets. There aren''t a huge number of these yet,

    yet you can find an Open Source tool to do the job if you''re using Perl.

    The XML::XSLT Perl module is a possible solution. You can find the

    XML::XSLT project on SourceForge at http://xmlxslt.sourceforge.net/


    The XSLT technology is still in developmental stages, so we won''t spend a lot

    of time on it in this book. However, if you have a need to transform DocBook

    into another XML format, be sure to check out XSLT. The XSLT 2.0 speci-

    cification is being worked on now, so you might want to follow the develop-

    ment, and possibly get involved.


    # Summary


    In this chapter, I covered the ways in which DocBook can be customized.

    Both the DocBook DTD and stylesheets can be customized, depending on

    your needs. In most cases, though, you should avoid the customization of

    DocBook unless absolutely necessary.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# Chapter 10: Customizing DocBook


    With DocBook taking two divergent paths at this time


    Although XSL is primarily targeted at Web output, you can produce printed documents
    using XSL as well. DocBook 5.0 primarily focuses on XML, although there will continue
    to be an SGML DTD, and DSSL isn''t going away any time soon. Which solution you
    choose depends entirely on what you need to use DocBook for. If you''re primarily
    focused on printed documents and using DocBook for creating content for traditional
    publishing, you might want to go with SGML. SGML still has the edge in terms of
    compliant tools and documentation. However, if you''re looking to the future,
    XML and the related technologies are probably the way to go. The final decision,
    of course, is up to you.'
  merge: -1
  img_proc: true
