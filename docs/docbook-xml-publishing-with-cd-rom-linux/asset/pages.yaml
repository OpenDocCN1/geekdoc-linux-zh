- pgno: 55
  md: '# Chapter 2: Writing a Technical Article


    ```

    <para>First item</para>

    </listitem>

    <listitem>

    <para>Second item</para>

    </listitem>

    <listitem>

    <para>etc...</para>

    </listitem>

    </orderedlist>

    ```


    One of the wonderful things about DocBook is the way that the markup language
    enables you to concentrate on the text rather than worry numbering a list of items
    or performing other tedious tasks.


    ![](img/81f56bf497dbf7f7582072400d12cb42_55_0.png)


    # The Quote Element


    Unlike the BlockQuote covered earlier in this chapter, the Quote element is meant
    for inline quotes—basically, quotes used within the Para elements, as opposed
    to longer quotes that are set off on their own as block quotes. It can also set
    phrases in quotes. It would be possible to enter the character entities for quotation
    marks instead, but you would lose some flexibility by doing that way, and the
    Quote element is easier to type as well. This is a simple example of a quote element.


    ```

    <para>

    <quote>This is the best book on DocBook I''ve ever seen,</quote>

    said the reviewer.

    </para>

    ```


    # The Tip Element


    The Tip element sets off a block of text from the main body of the text. This
    element is used to set off a tip from the author to call attention to the material
    contained within it. The Tip element is very similar to the Note, Caution, and
    Warning elements. It is up to the author to determine which elements to use under
    which circumstances. The next example is a simple demonstration of the Tip element.
    Note that the Para element is nested within the Tip element, and not the other
    way round.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '```

    <tip>

    <para>

    It''s probably not a good idea to make a wookie angry.

    </para>

    </tip>

    ```


    # ## The Title Element


    The Title element is not used to name the title of a book, film, or other media.
    Instead, the Title element is used in conjunction with other elements, such as
    the Sect elements and the Caution, Warning, and other callout elements. The Title
    element is used to designate a title for a particular section of a document. See
    one of the elements already mentioned for an example of the Title element in use.


    # ## The Trademark Element


    The Trademark element is used in the body of a document to indicate a trademark-marked
    or copyrighted work. The Trademark element is not used to indicate the copyright
    of the article. To indicate copyright information for the article itself, use
    the Copyright element. Note that the Trademark element has an optional Class attribute,
    which is used in the example.


    ```

    <para>

    <trademark class="registered">Linux</trademark> is a registered trademark of Linus
    Torvalds.

    </para>

    ```


    # ## The Warning Element


    The Warning element is another callout element. Use the Warning element to indicate
    dangerous tasks or procedures within your article. The following example contains
    some good advice that your Mom probably gave you as a kid.


    ```

    <warning>

    <title>Running with Scissors</title>

    <para>It''s a really bad idea to run with scissors, so don''t do it!

    </para>

    </warning>

    ```


    If you haven''t found a tag you''re looking for, feel free to check Appendix B,
    which is all about DocBook elements.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Preparing for Publication


    When you''ve finished your article and checked it twice for syntax errors, you''re
    just about ready to publish the document. Make sure that any and all of the images
    referred to in the text are available and in the proper format. For Web, you must
    have the images in JPEG or GIF format; for PDF or PostScript, you must have the
    images in EPS format. See Chapter 3 for more on images.


    Be sure that the document has the end seet and Article tags so that it will parse
    correctly. It is easy to overlook simple things like that when doing a complex
    document.


    The next step to publishing a DocBook document is parsing it and getting the appropriate
    output. If you''re ready to roll, skip ahead to Chapter 6, “Parsing DocBook,”
    to walk through getting output from your DocBook document.


    # Summary


    In this chapter I''ve covered the basics of using DocBook markup to create an
    article. As you can see, creating a DocBook document isn''t much harder than writing
    a document in a word processor. It is simply a matter of using the DocBook markup
    to create structure or to indicate special information. You don''t need to worry
    about formatting while writing at all, really. Leave that to the stylesheets.
    In the next chapters you''ll look at more complex documents, using images, and
    getting usable output from a DocBook file.'
  merge: -1
  img_proc: true
