- pgno: 227
  md: 'In this chapter, I talk about customizing DocBook to do your nefarious business.
    As discussed in earlier chapters, DocBook is technically just the DTD, but we
    are using it as a reference to all the tools necessary to produce a document and
    render it with DocBook—namely, the DSSL or XML processor, the DocBook DTD, and
    stylesheets of some kind. (I''ll talk about that in a bit).


    This chapter covers customizing both the DocBook DTD (or Schema) and the default
    stylesheets to produce custom output from a DocBook document. It also covers the
    Document Style Semantics and Language (DSSL) and XSL Transformations (XSLT), although
    not in great depth.


    It''s possible to do useful work with DocBook without customizing the default
    stylesheets. For many purposes, the default stylesheets are sufficient. Although
    not gorgeous, the output is clean and easy to read. (No insult intended to the
    folks who put it together!)


    On the other hand, maybe you want to add a little spice to to your finished product.
    That''s where the customization comes in, and I''ll talk about a little later
    in the chapter.


    # Customizing the DocBook DTD


    It''s also possible, even recommended, to work with the DocBook DTD with-making
    any changes.


    Because DocBook is the DTD, or the DTD is DocBook, customizing the DTD essentially
    makes it cease to be DocBook. That is, when you create a document using a different
    DTD, you''re no longer working with something that is fully compatible with the
    DocBook DTD.


    # Ramifications of Customizing the DocBook DTD


    Whether this is a big problem depends mostly on your plans for your DocBook document.
    Are you creating documentation only for use in in-house, with no plans to distribute
    it to the outside world?'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# Customizing the DocBook DTD


    Be sure to think this through. If you think there''s a slight chance you might
    want to share documents with another source in the future, keep the DocBook DTD.
    If it''s a personal project, such as your Web page or a college paper that you
    know full will be forever lost to the sands of time the instant you graduate,
    it''s probably no big deal. If you''re writing technical documents for a company
    or a research paper that will someday pave the way to a cancer cure, you can assume
    that the portability of DocBook will be important someday.


    ![](img/81f56bf497dbf7f7582072400d12cb42_228_0.png)


    If you have no plans to distribute this documentation, it''s not a big deal because
    compatibility isnt important to you. You won''t have to worry about the logistics
    of distributing your customized DTD with the document to everyone who share your
    document.


    On the other hand, if you''re going to be working with a document that you plan
    to share with others, in your DocBook form, you must think very hard before you
    customize the DTD. If you customize the DTD, you will have to make sure that everyone
    receives a copy of the DTD. If you make changes to that DTD later on, you will
    have to update everyone''s copy yet again.


    Also, although this is a small point, after you change the DTD, you can''t call
    it DocBook anymore. The DocBook Technical Committee asks that no one distribute
    a changed DTD under the name Oasis DocBook. If you do, a large, scary man might
    show up at your door. Okay, not really, but it could cause some serious compatibility
    issues.


    > Although the DocBook Technical Committee isn''t likely to send any thugs to
    enforce, the DocBook license restrict distributing a modified DTD under the same
    name as the regular DocBook DTDs. You''re free to make any modification you want,
    as long as you don''t distribute it as official DocBook.


    ![](img/81f56bf497dbf7f7582072400d12cb42_228_1.png)


    If you customize the DocBook DTD, it should be labeled Variant, Subset, or Extension,
    depending on the modifications you''ve made to the DTD.


    Modifications that reduce the number of elements should be labeled Subset. This
    is logical because you''re distributing a DTD that makes use of a subset of the
    DocBook elements. Any change that adds elements to the DocBook'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# Chapter 10: Customizing DocBook


    DTD should be labeled Extension, and any other changes to the DTD

    should be labeled Variant.


    To give an example, the declaration for a DocBook book normally looks like

    is this.


    ```

    <!DOCTYPE book PUBLIC "-//OASIS//DTD DocBook V4.1//EN">

    ```


    However, if you add five elements to the DocBook DTD and want to dis-

    tribute the DTD, it should look something like this.


    ```

    <!DOCTYPE book PUBLIC "-//ZENKER//DTD DocBook V4.1-Extension//EN">

    ```


    Basically, all that needs to be done is to change the name of the DTD’s owner

    from Oasis to whatever name is appropriate and to label the version number.

    This will tell anyone who’s interested that your DTD is based on the Oasis

    DTD, not the official DTD. They will also know not to try to use the regu-\lar
    DTD.


    # Reasons to Customize the DTD


    There are valid reasons to customize the DocBook DTD. As a matter of fact,

    Norman Walsh himself publishes a modified DocBook DTD.


    # Simplified DocBook


    The modified DTD is called Simplified DocBook and has a small subset of

    t elements contained in the regular DocBook DTD. How small? The

    regular DocBook DTD comprises more than 300 elements, whereas the

    Simplified DocBook DTD comprises 105 elements.


    Unlike the full DTD, the Simplified DocBook DTD has only one top-level

    element, the Article element.


    If you’re interested in trying out the Simplified DTD, you can find the latest

    version at Norman Walsh’s Web site at http://www.nwalsh.com/docbook/

    simple/index.html. Please note that the Simplified DTD is an XML DTD.

    Elements that are part of the subset appear in Appendix B, “DocBook Ele-ment Reference."


    # Reasons Not to Customize


    Aside from laziness, there are several reasons not to customize the DocBook

    DTD. The most important reason is portability. After you customize thenDTD, it
    becomes difficult to share with others and to keep current with the

    latest versions of DocBook.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# Customizing the DocBook DTD 205


    Releases of DocBook don''t happen every day, but regularly enough to make staying
    current a pain if you have to customize a DTD every time one is released. If you
    fail to keep current, your documents become less and less portable.


    Having said all that, if you are interested in learning a lot about SGML XML and
    getting your hands dirty, so to speak, the DocBook DTD is a great sandbox to play
    in. The DTD is freely available for you to work with, and you can gain a lot of
    knowledge by playing with the DocBook DTD and customizing it to learn how it works.
    I wouldn''t recommend doing it with important projects, but as a learning tool,
    this a great place to start. You will know that you truly understand SGML when
    you can easily read and modify the DocBook DTD.


    ![](img/81f56bf497dbf7f7582072400d12cb42_230_0.png)


    Of course, I suppose that the portability and maintenance issues come down to
    laziness at some point. DocBook enables you to avoid the hassle of mucking about
    with the DTD by providing a ready-made, mature DTD that''s been banged for almost
    a decade.


    # A guide to the DocBook DTD Structure


    Because this book is about using DocBook, and not about the nitty-gritty internals,
    I won''t spend long on this topic. This is some serious geekiness that should
    be approached with caution, and if SGML and XML theory and syntax aren''t your
    bag, with a whole lot of caffeine.


    If you''ve looked at the DocBook DTD included with this book, checked it out,
    or found it nestled away in the bowels of your Linux distribution, you''ve noticed
    that DocBook''s DTD is not just one file. The DocBook DTD, version 4.1.x, is distributed
    as nine files that form the DTD.


    Actually, the DocBook DTD is distributed as 14 files when you include the change
    logs that explain earlier versions of DocBook, a README file, and a file explaining
    expected changes from 4.1.x DocBook to 5.0 DocBook. The DTD proper is nine files,
    though. The XML DTD is the same but is also distributed with XML versions of the
    ISO''s entity sets, which are not maintained by the DocBook Technical Committee.


    ![](img/81f56bf497dbf7f7582072400d12cb42_230_1.png)'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# Chapter 10: Customizing DocBook


    # The DocBook Driver


    The first version of DocBook, 1.0, was just one lone DTD. It contained everything
    that you need to know about DocBook and was easy to read on its own.


    The current version of DocBook is split into separate files to make it easier
    to maintain. The main file is docbook.dtd which calls the rest of the files that
    make up the DocBook DTD when processed.


    ![](img/81f56bf497dbf7f7582072400d12cb42_231_0.png)


    The rest of the files are modules that contain bits of DocBook, as well as the
    SGML entity sets. The entity sets are part of DocBook, but they are required and
    called from the DocBook DTD.


    The Formal Public Identifier identified in the document declaration. It is the
    part of the declaration that identifies the owner of the DTD, and a description
    of it, and what line gauges it in. For example: //-// DTD DocBook V4.1//EN is
    not a DocBook-specific contingency; the FPI is part of the ISO standard.


    # The Exception to the Rule


    One file distributed with the DocBook DTD is kosher to modify without making a
    change in the DocBook Formal Public Identifier (FPI). That''s the general entities
    module, dbgenent.mod.


    Say that you want to add an entity like your company name or program to the entities
    you''re fed up typing Global Mega Corporation Central Division Office or something
    equally RSI-inducing (Repetitive Strain Injury).


    The file you modify is the dbgenent.mod file. It is designed to have extra entities
    added to it. To add an entity, open the file and add a line like:


    ```

    <ENTITY companyname "Global Mega Corporation Central Division Office">

    ```


    Then, any time you type &companyname;, it will automatically be expanded to Global
    Mega Corporation Central Division Office, and you will save your self from RSL.


    # The Table DTD


    The CALS Table model is one of the files distributed with DocBook as cals-tbl.dtd.
    This is the DTD that describes table markup that DocBook uses. It is not a product
    of the DocBook Technical Committee. The CALS Table model was created by the United
    States of Defense as a standard for the exchange of electronic data between commercial
    suppliers.


    # DocBook Elements


    The majority of DocBook elements are declared in the DocBook Information Pool-module,
    dbpool.mod. This file contains most of the objects and elements used in DocBook.
    As mentioned previously, the table elements are declared'
  merge: -1
  img_proc: true
