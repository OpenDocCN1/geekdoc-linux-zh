- pgno: 32
  md: 'It is optional to declare a public identifier but generally a good idea to
    do so.

    All examples in this book include both, as well as all the XML DocBook tem-

    plates located on the CD-ROM.


    # Understanding DocBook Markup


    DocBook markup might look daunting at first, especially if you are new to

    markup languages. The next section of this chapter explains the “physical"

    aspects of DocBook markup so that you can easily read DocBook markup and

    learn to write it as.


    # Document Division


    Documents are often divided into distinct parts to better organize and pre-

    sent material. Sometimes they are even divided into separate parts for

    ease of distribution when the amount of material warrants separate volumes.

    DocBook makes provisions for both logical divisions and physical divisions.

    You will take a brief look at these types of divisions in this section and then

    learn about division of material in more detail in Chapter 4, “Preparing

    Book with DocBook.


    # Logical Division


    A logical division in DocBook is indicated with markup such as the Sect 1

    element, which indicates the beginning or end of a level 1 section; the Chap-

    ter element, which indicates the beginning or end of a chapter; or even the

    set element, which is used to enclose a group of book elements. You can have

    all these elements present within one file, or you can separate them into dif-

    erent files, depending on how you prefer to work with material.


    # Physical Division


    DocBook also deals with the physical division of documents by providing a

    means to include a number of files in the document declaration, rather than

    try to manage a huge file with an entire book or set of books. DocBook allows

    you to include another file by using a call to an external entity.


    If you''re anxious to learn all about how to deal with document divisions, check

    out Chapter 4, where you will find the fun and exciting ways to work with

    book-sized documents.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Chapter 1: Getting Started


    # What Are Entities Anyway


    Now, when I talk about an entity in DocBook parlance, I''m not talking about those
    mysterious villains who make appearances in Star Trek episodes. An entity is a
    reference to a bit of information or data. An entity can be internal or external,
    and you can save an enormous amount of time by learning to use entities. Say that
    you''re writing a document for the Enormously Huge Corporation of Software Stuff
    but don''t want to type that name every time you refer to the company. Instead,
    at the beginning of your document, you declare the entity using code:


    ```

    <!ENTITY huge "Enormously Huge Corporation of Software Stuff">


    Now, to have the name of the company magically inserted in your document, simply
    type &huge;& and it will be expanded into Enormously Huge Corporation of Software
    Stuff in the final output.


    If you''re writing a book, you can separate each chapter into separate files and
    call them from the book declaration like this:


    <!DOCTYPE book PUBLIC "-//OASIS//DTD DocBook V4.1//EN" [

    <!ENTITY intro SYSTEM "intro.sgml">

    <!ENTITY docbookch1 SYSTEM DocBookCh1.sgml>


    <!ENTITY appendixxd SYSTEM AppendixD.sgml>


    book>

    &intro;

    &docbookch1;


    &appendixxd;

    </book>

    ```


    This will include all the chapter files when the document is parsed and output,
    without having your to maintain one big file. Pretty neat, huh? Figure 1.2 shows
    what the DTD looks like with several entities included.


    # Elements


    I have used the term element already, so perhaps it''s time to step back and see
    exactly what it means to refer to an element in DocBook lingo.'
  merge: -1
  img_proc: true
