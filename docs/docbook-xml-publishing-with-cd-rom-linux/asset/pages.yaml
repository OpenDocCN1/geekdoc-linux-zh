- pgno: 84
  md: "# Marking Up Tables and Figures\n\n```\n<!DOCTYPE PUBLIC \"-//OASIS//DTD/DocBook\
    \ MathML Module V1.0beta3//EN\"\n\"http://www.oasis-open.org/docbook/xml/mathml/1.0beta2/dbmathml.dtd\"\
    >\n```\n\nYou must also install the MathML DTD for Jade or OpenJade to be able\
    \ to process MathML markup.\n\nMathML allows for two types of markup: presentational\
    \ and semantic. Presentational tags explicitly spell out how the equation should\
    \ look. Semantic tags, on the other hand, specify the structure and leave it to\
    \ stylesheets to create the presentation.\n\nHere is an example of semantic markup,\
    \ taken from the W3C's page on MathML:\n\n```\n<apply>\n <apply>\n  <power/>\n\
    \   <ci>x</ci>\n   <cn>2</cn>\n  </apply>\n  <apply>\n   <times/>\n   <cn>4</cn>\n\
    \   <ci>x</ci>\n  </apply>\n  <cn>4</cn>\n</apply>\n```\n\nThe presentational\
    \ markup for the same output looks like this:\n\n```\n<mrow>\n <row>\n  <msup><mi>x</mi>\
    \ <mn>2</mn></msup> <mo>+</mo>\n  <row>\n   <mn>4</mn>\n   <mo>&invisibletimes;</mo>\n\
    \   <mi>x</mi>\n  </row>\n <mo>++</mo>\n <mn>4</mn>\n </row>\n <mo>=</mo>\n <mn>0</mn>\n\
    </mrow>\n```"
  merge: -1
