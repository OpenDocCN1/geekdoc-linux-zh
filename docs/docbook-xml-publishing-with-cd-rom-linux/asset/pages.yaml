    ```


    The BookInfo element is valid only within the Book element itself. You cannot
    not use the BookInfo element within any other element. None of the information
    included in the BookInfo element is required; you do not have to have an author,
    copyright holder, or year. The BookInfo element can contain list or as much information
    as you see fit to include.


    For a more complicated example, you will create a BookInfo entry for a book with
    multiple authors and an editor and include edition information, the ISBN, and
    the part number of the book.


    ![](img/81f56bf497dbf7f7582072400d12cb42_94_0.png)


