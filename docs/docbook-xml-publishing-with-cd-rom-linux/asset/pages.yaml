  md: "# Customizing the DocBook DTD\n\n(define %output-dir \"index.html\")\n\n<style-specification-body>\n\
    </style-specification>\n<external-specification id=\"docbook\" document=\"dbstyle\"\
    >\n</style-sheet>\n\nThis is a simple change. In fact, in all those lines of text,\
    \ you're making only one change:\n\n(define %output-dir \"index.html\")\n\nIf\
    \ you've ever processed a DocBook document into HTML, you've probably noticed\
    \ that it writes into a directory with the same name as the SGML or XML file you're\
    \ processing. For instance, book.sgml becomes book/, and the resulting document\
    \ files have weird names like book.html and x231.html. The purpose of this modification\
    \ is to have the HTML written out to the standard index.html.\n\n# XML and Stylesheets\n\
    \nXML has its own stylesheet language, so if DSSL isn't your bag, you will be\
    \ happy to know that you have an alternative.\n\nFor online documents, XML can\
    \ use Ext Stylesheet Language (XSL) or Cascading Style Sheets (CSS). In a nutshell,\
    \ stylesheets work by defining the formatting for an element separately from the\
    \ element itself. For instance, one stylesheet might declare that all text in\
    \ the HTML paragraph element should be 14-point text in a typeface with no serifs.\
    \ A stylesheet for a Web site for senior citizens might want to bump that up to\
    \ 22-point text. The first stylesheet would look like this:\n\n```\n<style type=\"\
    text/css\">\n  body (font-size: 14pt; font-family: sans-serif)\n</style>\n```\n\
    \nIf you've done any kind of Web development, you probably have a good understanding\
    \ of CSS already.\n\nXSL actually makes use of CSS, but it's more than that. I'll\
    \ talk about XSL for the remainder of the chapter. If you want to find out more\
