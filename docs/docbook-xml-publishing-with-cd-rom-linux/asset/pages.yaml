- pgno: 192
  md: '# GNU Emacs 20.6 for Mac OS Release d5


    This is the home page of GNU Emacs 20.6 for Mac OS. Emacs 20.6 for Mac OS implements
    many of

    Emacs''s features (see screenshot #1). This version adds support for fonts (screenshot
    #2) and international

    character set support (screenshot #3).


    It is distributed under the GNU Public License in hopes that others may contribute
    to its development. For a list of

    features it already supports and other questions you may have, please see the
    FAQ file.


    # Obtaining Files


    +   Release d5 is distributed in three forms- source-only, binary, and full distributions:

    - The source distribution is for developers who have access to the GNU Emacs 20.6
    source distribution.

    With this distribution, you can patch the access to source distribution, prepare
    the projects, and build

    run Emacs.

    - The binary distribution is a pre-built distribution for users who wish to run
    Emacs but not build it.

    - The full distribution contains all of the GNU Emacs 20.6 standard distribution
    with the patches applied

    and prepared and built.


    All distributions are Mac Binary II self-signing disk images (.DMG) files. The
    Mac Binary II format

    requires decompressing. Ensure you have Disk Utility installed.


    ![](img/81f56bf497dbf7f7582072400d12cb42_192_0.png)


    You can also sign up for a mailing list for users of Emacs for the MacOS and

    a a list for developers if you want to hack away at Emacs.


    To use Emacs for the MacOS, you need MacOS 8.1 or later.


    Now that you have installed GNU Emacs on the operating system of your

    choice, you can start using it.


    # Basic Emacs Guide


    Before jumping into editing DocBook files with Emacs, take a moment for

    an introduction to Emacs basics. There''s quite a bit to Emacs, so I cannot

    cover all the functionality available in Emacs. It would take an entire book to

    do that, maybe two (it has a lot of functions!). However, you will learn all the

    basics of text editing so that you can work comfortably with DocBook.


    # Key Conventions


    There are two ways to do things in Emacs, via menus or hot-key combina-

    tions. In this section, you will concentrate on the hot-key combinations'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'because they''re the most common way of getting things done in Emacs. The following
    is a quick reference to the key conventions used in this chapter:


    +   - C. The Control key

    - M. The Meta key, usually the Alt key on your keyboard

    - ESC. The Escape key

    - DEL. The Delete key, often mapped to your Backspace key, as well as the Delete
    key in Emacs

    - C- or M-. The Control or Meta key and another key


    Often Emacs commands consist of two hot-key combinations. For instance, the combination
    C-x C-c (read as Control-x Control-c) exits Emacs. Note that the meta key is usually
    mapped to the Alt key or the Windows key on some newer keyboards.


    To start Emacs, either type emacs in a terminal window, or double-click on the
    Emacs icon—depending on which operating system you''re using. For the most part,
    the instructions in this chapter refer to the Linux version of Emacs. However,
    because Emacs uses the same key bindings across platforms, it shouldn''t be a
    problem.


    If you''re using Emacs on the MacOS or Windows, Emacs simply runs in its own program
    window like any other program. In Linux, you can run Emacs at the console or in
    X. If you run Emacs, you can choose to start Emacs within a terminal window or
    as a separate window with menus with mouse support.


    > When you start Emacs, you will note that it mentions a scratch buffer and refers
    to each file as a buffer. Like Vim, Emacs considers each open file to be in a
    buffer—a space in memory until it is saved to disk—which is more accurate than
    your thinking that you are working on the file itself. When Emacs opens a file,
    it is making a copy in memory that you can safely tinker with, and no changes
    are made until you tell Emacs to save the file. At that point, the differences
    between the buffer you''re working in and the file saved on disk are reconciled,
    and the file is written to disk—either over the existing file or as a new file.


    ![](img/81f56bf497dbf7f7582072400d12cb42_193_0.png)


    To start Emacs at a console, type emacs. Within X, you can start Emacs by typing
    emacs in an xterm, and a special Emacs window like that shown in Figure 8.7 will
    appear.'
  merge: -1
  img_proc: true
