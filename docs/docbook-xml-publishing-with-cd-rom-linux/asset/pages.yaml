    ```

    gzip -cd tkcvs-6.4.tar.gz | tar -xvf -

    cd tkcvs-6.4/

    su

    ./doinstall.tcl

    ```


    If everything is working correctly, you should see the TkCVS Installer box as
    displayed in Figure 7.10.


    The installation defaults should be fine, so go ahead and press the Install button.


    ![](img/81f56bf497dbf7f7582072400d12cb42_179_1.png)'
