    para>if you need a footnote, simply declare the footnote in the text where you
    want it to appear like this:<footnote><para>This is a footnote that will appear
    in the text when rendered.</para></footnote></para>


    # FootnoteRef


    The FootnoteRef element is used for creating a link or reference to a footnote.

    The FootnoteRef element accepts the following attributes in addition to the:


    +   - Label. Accepts a CDATA value, has no default value, and is not required.

    - Linkend. Accepts an IDREF value, has no default value, and is not


    ```

    <!DOCTYPE element PUBLIC "-//W3C//DTD DocBook V4.4//EN">

    <group collected>

    <root>

    <entry id="footnote1"><para>This is the first

    ```


    The ForeignPhrase element designates a foreign phrase in the text. This allows
    the processing system to format foreign phrases differently than the rest of the
    text by making them stand out.


    The ForeignPhrase element uses common attributes'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# Highlights


    The Highlights element presents the highlights or summary of an element.


    The Highlights element uses common attributes.


    Example:


    ```

    <!DOCTYPE chapter PUBLIC "//OASIS//DTD DocBook V4.1//EN">

    <chapter><title>My First Chapter</title>

    <highlights>

    <para>

    This chapter is going to talk about all the years of my life, including

    <itemizedlist>

    <item><para>Year 1</para></item>

    <item><para>Year 2</para></item>

    </itemizedlist>

    </para>

    </highlights>

    </chapter>

    ```


    # Holder


    The Holder element contains information about a copyright holder.


    The Holder element uses common attributes.


    Example:


    ```

    <holder>

    <lastname>Prima</lastname>

    </holder>

    ```


    # Honorific


    The Honorific element contains a title such as Dr. or Professor or any title that
    should be attached to someone''s name. This is used only with meta-information
    elements, not with in-line text. For instance, if you are using the Author element
    and writing about someone with a Ph.D., you use the Honorific element. How-ever,
    it is not necessary to use this element when writing Dr. in the document itself.


    The Honorific element uses common attributes.


    Example:


    ```

    <author>

    <firstname>Kara</firstname>

    <surname>Pritchard</surname>

    <honorific>Mrs.</honorific>

    ```'
  merge: -1
  img_proc: true
- pgno: 316
  md: "# IssueNum\n\nIssueNum element refers to the issue number of a cited work or\
    \ the document itself, depending on the context in which it is used.\n\nThe IssueNum\
    \ element uses common attributes.\n\nExample:\n\n```\n<!DOCTYPE article PUBLIC\
    \ //OASIS//DTD DocBook V4.1//EN>\n<article>\n<artheader>\n  <author>...</author>\n\
    \  <volum>1</volumen>\n  <issuenumber>1</issuenumber>\n  <pubdate>2001</pubdate>\n\
    \  <title>...</title>\n</artheader>\n<para>...</para>\n</article>\n```\n\n# LegalNotice\n\
    \nThe LegalNotice element contains a legal notice of some type.\n\nThe LegalNotice\
    \ element uses common attributes.\n\nExample:\n\n```\n<legalnotice>\n<para>Don't\
    \ reproduce this in any medium or you'll be gnawed to death by angry lawyers.</para>\n\
    </legalnotice>\n```\n\n# Lineage\n\nThe Lineage element name is misleading. It\
    \ designates titles such as Sr. or Jr.\n\nThe Lineage element uses common attributes.\n\
    \nExample:\n\n```\n<author>\n  <firstname>Theodore</firstname>\n  <surname>Graddy</surname>\n\
    \  <lineage>Jr.</lineage>\n  <othername>Dad</othername>\n</author>\n```"
  merge: -1
  img_proc: true
- pgno: 317
  md: "# OrgDiv\n\nThe OrgDiv element holds the division name of a company or organization.\
    \ It is used only in conjunction with the Affiliation element.\n\nThe OrgDiv element\
    \ uses common attributes.\n\nExample:\n\n```\n<affiliation>\n  <jobtitle>Director\
    \ or Exam Development</jobtitle>\n  <orgname>Linux Professional Institute</orgname>\n\
    \  <orgdiv>Exam Development</orgdiv>\n</affiliation>\n```\n\n# OrgName\n\nThe\
    \ OrgName element contains the name of an organization.\n\nThe OrgName element\
    \ uses common attributes.\n\nExample:\n\n```\n<orgname>Red Cross</orgname>\n```\n\
    \n# OtherAddr\n\nThe OtherAddr element holds address information for which there\
    \ are no appropriate elements.\n\nThe OtherAddr element uses common attributes.\n\
    \nExample:\n\n```\n<address>\n  Kara Pritchard\n  <street>42 Yourstreet C</street>\n\
    \  <otheraddr>\n    <city>...</city>, <state>...</state> <postcode>...</postcode>\n\
    \  </otheraddr>\n</address>\n```\n\n# OtherCredit\n\nThe OtherCredit element holds\
    \ information about other contributors to a document.\n\nThe OtherCredit element\
    \ uses common attributes.\n\nExample:\n\n```\n<!DOCTYPE artheader PUBLIC \"//OASIS/DTD\
    \ DocBook V4.1//EN\">\n<artheader>\n```"
  merge: -1
  img_proc: true
- pgno: 318
  md: "# Element Reference 293\n\n```\n<title>DocBook Publishing</title>\n<author>\n\
    \  <firstname>Joe</firstname>\n  <surname>Brockmeier</surname>\n</author>\n<othercredit>\n\
    \  <firstname>Kara</firstname>\n  <surname>Pritchard</surname>\n  <contrib>Tech\
    \ Editor turned Co-author</contrib>\n</othercredit>\n</artheader>\n```\n\n# OtherName\n\
    \nThe OtherName element is a handy catchall for use when listing author names\
    \ who have nicknames or middle names that should be included. Note that if it\
    \ is a nickname and you want to have the nickname appear in quotes, you must write\
    \ it as such.\n\nThe OtherName element uses common attributes.\n\nExample:\n\n\
    ```\n<author>\n  <firstname>Kara</firstname>\n  <surname>Pritchard</surname>\n\
    \  <othername>O' Lady</othername>\n</author>\n```\n\n# PageNums\n\nThe PageNums\
    \ element contain page number information for a cited work.\n\nThe PageNums element\
    \ uses common attributes.\n\nExample:\n\n```\n<pagenums>55-102</pagenums>\n```\n\
    \n# Phone\n\nThe Phone element holds, surprisingly, a phone number.\n\nThe Phone\
    \ element uses common attributes.\n\nExample:\n\n```\n<phone>555-555-FAKE</phone>\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 319
  md: '# POB


    The POB element holds post office box information.


    The POB element uses common attributes.


    Example:


    ```

    <address>

    Kara Pritchard

    <pob>PO Box 42</pob>

    <city>...</city>, <state>CA</state><postcode>...</postcode>

    </address>

    ```


    # PostCode


    The PostCode element holds a Zip code or other postal code information, depending
    on the country. It is used with the Address element.


    The PostCode element uses common attributes.


    Example:


    ```

    <postcode>80015</postcode>

    ```


    # PubDate


    The PubDate element holds information about the publication date of a document
    or cited work.


    The PubDate element uses common attributes.


    Example:


    See IssueNum example.


    # Publisher


    The Publisher element holds information about a publisher of a cited work or the
    current DocBook document.


    The Publisher element uses common attributes.


    Example:


    ```

    <publisher>

    <publishername>Prima Publishing</publishername>

    <address>...</address>

    </publisher>

    ```'
  merge: -1
  img_proc: true
- pgno: 320
  md: "# PublisherName\n\nThe PublisherName element holds the name of the publisher.\n\
    \nThe PublisherName element uses common attributes.\n\nExample:\n\nSee PublisherName\
    \ element example.\n\n# Quote\n\nThe Quote element holds a quotation used in-line.\
    \ The Quote element is used for shorter quotations that appear in the text, not\
    \ longer quotations that are broken out from the text, such as a BlockQuote.\n\
    \nThe Quote element uses common attributes.\n\nExample:\n\n```\n<quote>Clothes\
    \ make the man. Naked people have little or no influence in society.\\</quote>\n\
    ```\n\n# SeriesInfo\n\nThe SeriesInfo element holds information about the series\
    \ containing a book.\n\nThe SeriesInfo element uses common attributes.\n\nExample:\n\
    \n```\n<seriesinfo>\n  <title>DocBook Publishing</title>\n  <seriesvolumes>1</seriesvolumes>\n\
    \  <editor>\n    <firstname>Melody</firstname>\n    <surname>Layne</surname>\n\
    \  </editor>\n  <publisher>...</publisher>\n</seriesinfo>\n```\n\n# SeriesVolNums\n\
    \nThe SeriesVolNums element holds information about volume numbers for a series.\n\
    \nThe SeriesVolNums element uses common attributes.\n\nExample:\n\nSee SeriesInfo\
    \ element example."
  merge: -1
  img_proc: true
- pgno: 321
  md: "# ShortAffil\n\nThe ShortAffil element is used for abbreviated affiliation\
    \ information about an author or contributor in meta-information.\n\nThe ShortAffil\
    \ element uses common attributes.\n\nExample:\n\n```\n<affiliation>\n  <shortaffil>LPI</shortaffil>\n\
    \  <jobtitle>Director of Exam Development</jobtitle>\n  <orgname>Linux Professional\
    \ Institute</orgname>\n</affiliation>\n```\n\n# State\n\nThe State element holds\
    \ the state name in an address. The State element can also be used to hold the\
    \ name of a province.\n\nThe State element uses common attributes.\n\nExample:\n\
    \nSee Address element example.\n\n# Street\n\nThe Street element holds street\
    \ information in an address.\n\nThe Street element uses common attributes.\n\n\
    Example:\n\nSee the Address element example.\n\n# Trademark\n\nThe Trademark element\
    \ holds trademark information cited in the text of a document itself.\n\nThe Trademark\
    \ element accepts the following attribute in addition to the common attributes:\n\
    \n+   * Class. Accepts one of the following values:\n  * Copyright\n  * Registered\n\
    \  * Service\n  * Trade"
  merge: -1
  img_proc: true
- pgno: 322
  md: '# Element Reference


    # 297


    Example:


    When writing, I really love to drink <tm class="registered">Coke</tm> and eat
    gummi bears.


    # Year


    The Year element holds a year.


    The Year element uses common attributes.


    Example:


    <year>2001</year>


    # Web/Linking Elements


    # Alt


    The Alt element provides alternative text for a graphic element.


    The Alt element uses common attributes.


    Example:


    <alt>You''d see an image here if your browser displayed them</alt>


    # Email


    The Email element holds an e-mail address.


    The Email element uses common attributes.


    Example:


    <email>kara@luci.org</email>


    # Graphic


    The Graphic element calls a graphical element that is displayed outside the text
    flow. Note that the Graphic element is essentially an empty element.


    The Graphic element accepts the following attributes:


    +   - Align

    - Depth

    - EntityRef

    - FileRef

    - Format

    - Scale

    - SrcCredit

    - ScaleFit


    Example:


    <graphic fileref="image.tiff"></graphic>'
