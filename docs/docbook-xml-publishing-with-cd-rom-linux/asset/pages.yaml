    \ following attributes in addition to the common attributes:\n\n+   - Label. Accepts\
    \ a CDATA value, no default value, and is not required.\n- RenderAs. Accepts one\
    \ of the following values:\n  - Sect1\n  - Sect2\n  - Sect3\n  - Sect5\n\nThe\
