- pgno: 5
  md: '# Acknowledgments


    ne of the perks of being the author of a book is that you get to publicly acknowledge
    the people who have contributed to your success. There aren''t many professions
    that allow you to do that, and I feel pretty lucky having the opportunity.


    Naturally, I''d like to thank my family and friends. David, Brad, and Shawn, for
    being awesome little brothers. My friend Denise and her family, thanks for being
    a wonderful second family.


    All of my friends in Denver and elsewhere, Jim, Bonnie, Suzanne, Jason, Barb,
    Chuck, Jeremy, Hannah, Jo, Emily, Adam, Lara, Bob...you all make life much more


    I''d also like to thank the folks at Prima, of course, for making this book possible.
    Kim and Melody, thanks for being the nicest editors in the world.


    > —Joe "Zonker" Brockmeier


    First, I all like to extend special thanks to the community of Linux developers,
    supporters, and activists who are responsible for the opportunities I have today.
    Without their work and dedication I would never have had the freedom to pursue
    my career and contribute to this community.


    I would like to thank Zonker for asking me to work on this book with him, originally
    as an editor and then as a co-author. His expertise in DocBook has been quite
    a resource, and he has been great fun to work with.


    In addition, I would like to thank the Prima staff I''ve worked with, Melody Layne
    and Kim Pulspker, for giving me the opportunity to work with a new publisher.
    Their patience and pursuit for quality technical resources should be commended.


    A personal thank you to my husband, Steven Pritchard, who is my unsung hero, the
    built-in technical editor for all my works. His support and encouragement keeps
    me going.


    > —Kara Pritchard'
  merge: -1
  img_proc: true
- pgno: 6
  md: '# About the Authors


    OE "ZONKER" BROCKMEIER is a long-time user of Linux and other Free and Open Source
    software. Zonker is a contributing editor for Linux Magazine and UnixReview.com,
    and has had articles published in Sys Admin, Enterprise Linux Magazine, ComputerEdge,
    and IBM''s DeveloperWorks.


    KARA PRITCHARD is currently the Director of Exam Development for the Linux Professional
    Institute, working to develop the standard for Linux certification. As an independent
    consultant, Kara has been promoting the use of Linux in both corporate and educational
    facilities since late 1995. She published her first book, RHCE Exam Cram, in 1999
    (2nd ed. 2000). Kara runs the Linux Users Groups resource project at http://www.linuxusersgroups.org/.
    You can contact her at kara@luci.org.'
  merge: -1
  img_proc: true
