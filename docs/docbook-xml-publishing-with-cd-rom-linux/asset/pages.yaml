- pgno: 23
  md: '# Introduction


    # DocBook and Open Source


    A number of Open Source projects are DocBook, most notably, the Linux Documentation
    Project, which has switched from the Linux DTD to DocBook.


    Because DocBook is an open standard—portable across platforms and designed to
    output HTML, PostScript, RTF, PDF, ASCII text, and several other file formats—it
    is ideal for projects that want printable documents, online documents, and electronic
    documents that look exactly like printed documents.


    # Buzzword


    # SGML/XML


    Metalanguage is a definition or description of language, a language used to talk
    about language. The rules of English grammar could be described as metanguage,
    language that enables us to understand word usage in the English language. Meta
    is a prefix that, depending on context, refers either to change (as in phosphorus)
    or, to information technology, to some more comprehensive (as in metadata).


    You''ve probably heard the terms SGML and XML a few times but might be confused
    about what they are. SGML stands for Standard Generalized Markup Language, and
    XML is the Extensible Markup Language. To make things even murkier for the beginner,
    XML is often taken as a separate technology, but in reality, XML is a subset of
    SGML.


    What are SGML and XML? SGML is a metanguage used to define rules for how a document
    can be described. SGML DTDs spell out what allowable markup is and how it is to
    use. For example, HTML is an SGML DTD. In HTML, the DTD is the full description
    of the HTML language, and it offers information about HTML markup. If you''ve
    ever used XML, you know that the DTD tells a browser `<b>` makes text bold, `<i>`
    makes text italic, and `<img>` describes the attributes of an image—including
    where the image can be found and possibly the height, width, and alignment for
    the text. However, because the DTD does not describe a `<wohoo>` tag, browsers
    will probably ignore it or render it poorly.


    XML, as mentioned before, is a subset of SGML. XML is an official recommendation
    from the W3C—the World Web Consortium, the organization responsible for HTML specifications.
    XML is actually a set of specifications for documentation that are designed to
    be SGML-compatible, human and machine readable, and Web friendly, making the creation
    of documents easy. That''s a tall order, but the W3C has been successful in creating
    a recommendation that is being adopted even before the final specification is
    approved.


    XML is used for a number of tasks. Microsoft is using XML to some extent in its
    Office file formats, many programs use XML configuration files, and quite a few
    companies use XML to exchange data with one another for business-to-business transactions
    over the Internet. That''s just a few of XMLs other roles, aside the XML DocBook
    DTD.


    ![](img/81f56bf497dbf7f7582072400d12cb42_23_0.png)'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# What Is DocBook?


    For more information on XML, check out Appendix C, “MoreDocBook Resources,

    for more XML resources.


    # Markup Languages


    We''ve mentioned already that XML, HTML, and SGML are markup languages.

    What does that mean?


    A markup language is a set of elements used to describe how data should be handled.

    For instance, as mentioned earlier in the chapter, the HTML `<b><b>` tags tell
    a

    browser how to handle text that is enclosed within those tags: Make it bold. DocBook

    is an SGML DTD that describes the use of all HTML tags. A well-formed

    HTML document fits completely within the definition of the HTML DTD, and no

    elements in the document are missed or not present in the HTML DTD.


    DocBook is also a markup language. We explained what a markup language is but

    not necessarily what its benefits are. A markup language enables the author to
    specify\what a piece of text is supposed to be—bold, italic, emphasized, code,
    a level-one

    header, and so on—without worrying about how text is formatted. It allows for

    abstraction, basically, and removes the author from dealing with formatting

    directly.


    # SGML


    The SGML DTD for DocBook is the most widely used, and for quite some time the

    SGML was the only official DTD for DocBook.


    Although standards organizations like to emphasize whether something is the

    official standard, in practice this doesn''t amount enough to make much. HTML,
    for

    example, has a standard that is approved by the W3C. However, the actual

    practice is that Microsoft Internet Explorer, Netscape Navigator, and many

    other browsers support that are deprecated. They don''t support tags

    that are part of the official standard and also support proprietary tags

    invent by their research companies in their quest to rule the Web and

    make their browsers the dominant browser.


    The rush to start adopting XML has not been hindered because it is not an

    official standard (at least


    Although it would be a wonderful world if everyone agreed to follow the

    standards these organizations put out, that''s unlikely to happen anytime


    # Buzzword


    Well-formed means that a document does not stray from the standard set by a DTD.
    The term appears throughout this book documents that are not formed and likely
    to be rendered properly. Learning to create-formed DocBook documents according
    to either the SGML or XML DTD is the focus of this work. We do not describe any
    of the shortcuts available in the SGML DocBook DTD because they do not work with
    each DocBook parser. Therefore, we would lose the portability of DocBook by using
    them.


    ![](img/81f56bf497dbf7f7582072400d12cb42_24_0.png)


    > NOTE'
  merge: -1
