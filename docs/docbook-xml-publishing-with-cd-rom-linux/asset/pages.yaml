    \n```\n<article>\n  <articleinfo>\n    <title>Really Awesome Article</title>\n\
    \    <author>\n      <firstname>Joe</firstname>\n      <lastname>Zonker</lastname>\n\
    \      <surname>Brockmeier</surname>\n    </author>\n  </articleinfo>\n</article>\n\
    ```\n\nThis is straightforward. The Author element contains information about\
    \ the author, and the Title element contains information about the title of the\
    \ article. Everything contained within the articleinfo element is information\
    \ about the article document. No surprises there, I hope. One thing that is important\
    \ to note, however, is the order of the elements. The Firstname and Surname elements\
    \ must be within the Author element because the Author element is the parent element.\
    \ The following, for example, would not be valid.\n\n```\n<article>\n  <author>\n\
    \    <firstname>Joe</firstname>\n    <lastname>Zonker</lastname>\n  </author>\n\
    \  <surname>Brockmeier</surname>\n</article>\n```\n\nIf you get errors when parsing\
    \ documents, be sure to check the syntax of the elements in your document. Often,\
    \ you will find that the problem is as simple as a misplaced element.\n\nSo far,\
    \ this isn't a terribly exciting article, so you should probably go putting in\
    \ a bit of content now. Here's what an extremely short DocBook article would look\
    \ like.\n\n```\n<!DOCTYPE article PUBLIC \"-//OASIS//DTD DocBook V4.0//EN\">\n\
    <article>\n<articleinfo>\n```"
