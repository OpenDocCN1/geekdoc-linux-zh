  md: '# Chapter 5: Making Online Documents


    ![](img/81f56bf497dbf7f7582072400d12cb42_135_0.png)


    Figure 5.9 Code generated by SGMMLTools


    # Using HTML Tidy


    HTML Tidy is an application provided by the W3C that, well, tidies HTML. HTML
    Tidy was not written with DocBook HTML output in mind but works amazingly well
    with it. Actually, HTML Tidy was developed to fix small errors in the HTML syntax
    and to make HTML files easier to read.


    > If you''re a word processor who likes to output documents to HTML, run HTML
    Tidy on them. It will do wonders for the output. Most HTML rendered by word processors
    is indescribably ugly, even if it renders properly in a Web browser.


    HTML Tidy is available for just about any computing platform known to man. HTML
    Tidy supports Windows (all flavors), the MacOS, Linux, UNIX, BeOS, Solaris, and
    many more. If you''re using it to produce DocBook, odds are that HTML Tidy will
    run on it. Even better, the price is right—there''s no license'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'fee for HTML Tidy. It''s provided to help make the World (Wide Web) a bet-ter
    place.


    You can download the appropriate version of HTML Tidy from this site, http://www.w3.org/People/Raggett/tidy/.
    Just look for the appropriate file for your operating system. If you are using
    Linux, Windows, or the MacOS, there are versions on the book''s CD-ROM for you.
    You can also download source code, if you''re so inclined.


    Now that you have HTML Tidy, I will give an example of how to use it. Use Tidy
    from the command line, use the following command to run Tidy on the index.html
    file and write any errors to a file:


    ```

    tidy -f err.txt -m index.html

    ```


    Unless there are terrible errors in your file, Tidy will run and update the index.html
    file. Tidy will clean up the syntax, reduce extraneous white space, and add cascading
    stylesheets to get rid of deprecated elements.


    In Figure 5.10, you can see your file before HTML Tidy. Figure 5.11 shows your
    file after running HTML Tidy.


    ![](img/81f56bf497dbf7f7582072400d12cb42_136_0.png)


    Figure 5.10 An ugly HTML file'
  merge: -1
  img_proc: true
