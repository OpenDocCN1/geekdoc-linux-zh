  md: '# Setting Revision Numbers Manually


    RCS usually sets the revision numbers for a file automatically. However, at times
    you might want to set the revision number of a file manually, instance, when you''re
    working on a project as a technical editor and have access to the author''s RCS.


    There''s no point in editing a file the author has not yet finished, even if he''s
    checked in the latest revision. One way to make sure that this doesn''t happen
    is to edit only files that have reached a certain revision number, such as 1.0
    or something like that. By default, RCS sets revisions automatically, and they
    might not be in sync with your defaulting scheme. To fix that, check in the file
    like this:


    ```

    ci -r1.0 filename.scm

    ```


    This way, you can specify the revision number, beginning at the revision with
    which you want to start.


    # Numbering Conventions


    RCS lets you give a file revision number lower than 1.0 but does not accept a
    revision number like 1.01. Instead, it increments number to 1.1. If you want to
    have a revision number than 1.1 but higher than 1.0, using a numbering convention
    like 1.0.1. Also, RCS does not allow you to check in a revision of a file that''s
    lower than the current version. If 1.0 is already checked in, you can''t check
    in a of 0.9, even if you specify manually.


    # The Concurrent Versions System (CVS)


    The Concurrent Versions System builds on the GNU Revision Control System to manage
    a collection of directories (branches) that contain file revisions, instead of
    just one directory like RCS.


    With CVS, users maintain their own private copies of the files they work with
    while the CVS repository holds all the files, directories, and control files.


    # What Is CVS?


    CVS is designed for distributed software projects of larger scope than RCS handles.
    One of the differences between CVS and RCS is that CVS does not expect file locking
    by default and several users may work on, and make changes to, the same file.
    CVS coordinates the changes in the files when a'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'user commits a file back to the CVS repository. CVS merges the changes automatically
    unless there is an obvious conflict, in which case CVS reports it to the user
    to fix.


    # The Client/Server Model


    The other major difference, and it''s a biggie, between RCS and CVS is that CVS
    operates on a client and server model and is designed to work across networks
    rather than just on the local machine. This makes life much easier for people
    who are all working in separate locations, at least in terms of committing and
    retrieving the latest versions of files. Don''t think, you are unable to use CVS
    on a single machine with multiple users. Your server and your clients may be located
    physically on the same hardware.


    # Installing CVS


    If CVS is not already installed on your system, you can grab the source or binaries
    from the CVShome.org Web site at http://www.cvhome.org/. To find out whether CVS
    is already on your system, type cvs --version and you will see output as shown
    in Figure 7.7 if CVS is already installed.


    ![](img/81f56bf497dbf7f7582072400d12cb42_173_0.png)'
  merge: -1
