  md: '# Revision Control for Loners


    If you''re going to do a project by yourself, you might want to use revision control
    anyway. I''ve found that even for small articles or projects, it''s nice to be
    able to roll back a version or two when I''ve deleted a paragraph or 10 paragraphs
    that I later decide to include in the piece. It''s much simpler to use a version
    control system, after you become used to it, than to keep dozens files in a directory,
    labeled article1.sgml, article1.sgml.old, article1.sgml.bak, and so forth.


    # The GNU Revision Control System (RCS)


    The GNU Revision Control System is usually part of a default Linux installation.
    Odds are, if you have a Linux system, you have it installed already. To find out,
    type rcs -V at a shell prompt. You should see something like RCS version 5.7.
    RCS 5.7 is the latest version of RCS available at the time of this writing. If
    you don''t have RCS or want to get a newer version, visit the RCS Web site at
    http://www.cs.purdue.edu/homes/RCS/. The official page for RCS is at http://www.gnu.org/software/rcs/rcs.html
    (see Figure 7.1).


