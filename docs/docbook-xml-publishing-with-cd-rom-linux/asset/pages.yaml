  md: 'The Glossary element accepts the following attribute in addition to the common
    attributes:


    +   - Status. Accepts a CDATA value, has no default value, and is not required.


    Example:


    ```

    <!DOCTYPE glossary PUBLIC //OASIS//DTD DocBook V4.1//EN">

    <glossary><title>My Glossary</title>

    <glossentry id="foo"><glossterm>foo</glsterm>

