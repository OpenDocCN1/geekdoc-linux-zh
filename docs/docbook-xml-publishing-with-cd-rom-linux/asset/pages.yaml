  md: '# Appendix B: DocBook Element Reference


    # Parameter


    The Parameter element indicates a value passed to a command or function or as
    an option.


    The Parameter element uses these attributes in addition to common attributes:


    +   - Class. Type of parameter.

    - MoreInfo. Accepts a value of either None or RefEntry, with the default value,
    and is not required.


    Example:


    ```

    <para>Use the <parameter>-l</parameter> parameter with the <command>ls</command>
    command to retrieve a listing of directory files with full details in Unix.</para>

    ```


    # Procedure


    The Procedure element holds a list of steps to be performed.


    The Procedure element uses common attributes.


    Example:


    ```

    <procedure><title>Making Scrambled Eggs</title>

    <step><para>Break two eggs in a bowl/</para></step>

    <step><para>Whip eggs with a whisk or fork/</para></step>

    <substeps><para>Whip in small amount of milk</para></substeps>

    <step><para>Add Beaten eggs to a hot skillet with oil/</para></step>

    <step><para>Using spatula, stir eggs until desired consistency/</para></step>

    </procedure>

    ```


    # Programminglist


    The ProgramListing element contains a listing from a program. It contains part
    or all of a program verbatim and indicates that the contents of the element must
    be reproduced as-is.


    The ProgramListing uses common attributes.


    Example:


    ```

    <programlisting>

    <![CDATA[

    <?php echo "The Current Date and Time is: <br>";

    echo date("g:i A 1, F j Y.");?>

    ]]>

    </programlisting>

    ```'
  merge: -1
  img_proc: true
- pgno: 348
  md: '# Prompt


    The Prompt element indicates the character or characters that make up a command-line
    prompt.


