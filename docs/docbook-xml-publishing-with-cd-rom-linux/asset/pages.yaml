- pgno: 27
  md: '# Chapter 1: Getting Started


    Now that all the introductory stuff is out of the way, it''s time to get started
    with DocBook. The purpose of this chapter is to prepare you for writing DocBook
    documents. This chapter covers the major differences between SGML and XML Doc,
    how to use the DocBook DTD, and how to read DocBook markup so that it doesn''t
    look like a foreign language. We''ll also talk briefly about stylesheets, which
    are used to give a DocBook document its "look and feel."


    Unlike the majority of this book, the material in this chapter is mostly foundation
    for the hands-on type material later in the book. It might seem slow, so you might
    prefer to start with one of the other chapters and refer back to this chapter
    when you get stuck.


    # Creating DocBook Documents


    Creating DocBook documents is simple. All you need in the way of tools is a text
    editor and perhaps an image or photo editing tool if you want to produce documents
    with images.


    # SGML or XML?


    The first thing to do is to choose the DTD or Schema you''re going to use; the
    document declaration comes before anything else when you''re writing a document.
    In some cases, this might already be chosen for you by a manager or editor. If
    you''re the manager or editor, however, you will have to make an educated decision
    about which DTD is best for you, from a practical and financial standpoint.


    If your company or project is largely concerned with print-only publications,
    then you may want to pick SGML because the number of applications that are available
    for SGML like Adobe FrameMaker+SGML or WordPerfect. On the other hand, XML is
    probably better suited for Web-based publishing because it was developed primarily
    for electronic data exchange.


    As of DocBook version 4.0, there are two official versions of the DocBook DTD:
    the SGML DTD and the XML DTD. The XML DTD has been around for a while, but the
    4.0 version of the XML DTD was the first "official"'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Creating DocBook Documents


    release of an XML DTD. It''s likely that there will soon be an "official" XML
    Schema for DocBook as well.


    Chapter 11 covers XML Schemas in detail, though they aren''t used in examples
    throughout the rest of the book. The reason for this is that the first experimental
    DocBook Schema was only recently introduced. The XML Schema is not yet wide in
    use. However, Chapter 11 added because I felt that the topic should not be ignored
    completely and XML Schemas are likely to play an important role in DocBook development
    of the future.


    ![](img/81f56bf497dbf7f7582072400d12cb42_28_0.png)


    The SGML DocBook DTD has been around longer (since 1991, in one form or another)
    and has more supporting tools and documentation. If you''re going to be sharing
    documents with other organizations or companies that are using DocBook, the tools
    that they are using the SGML DTD and tools that are already available. If that''s
    the case, you will want to stay the course and use the SGML DTD, unless you''re
    willing to convert documentation to XML. This can be more trouble than it''s worth,
    unless you need features provided by XML.


    On the other hand, if you''re using DocBook for the first time and you''re going
    to be setting a standard, XML is probably the way to go. XML is one of today''s
    technologies and it looks as though XML is capturing the hearts and minds of IT
    professionals in a way that SGML never did. XML while learning DocBook could have
    some positive side effects later on because you will pick much about XML that
    will apply to technologies beyond DocBook.


    Delving into all the benefits of XML and SGML is beyond the scope of this humble
    book about DocBook. However, XML and SGML are both fascinating topics you will
    probably want to examine in more depth after you''ve tackled DocBook. To help
    you on your quest for knowledge, some links to resources that you will get can
    be found in Appendix D, "More DocBook Resources." Enjoy!


    ![](img/81f56bf497dbf7f7582072400d12cb42_28_1.png)


    XML is designed from the ground up for use on the Web. Using XML opens up the
    possibility of using DocBook documents for more than just standard publishing.'
