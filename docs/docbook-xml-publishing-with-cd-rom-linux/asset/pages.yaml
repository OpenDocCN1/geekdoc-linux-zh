- pgno: 382
  md: '# Finding Out More about DocBook


    ![](img/81f56bf497dbf7f7582072400d12cb42_382_0.png)


    Figure C.9 The XML.com home page


    Why is that? Well, probably because the DocBook DTD itself is freely available
    and a great number of Open Source tools are available for working with DocBook.
    DocBook also lends itself quite well to the collaborative environment in which
    Open Source software is developed. In addition, it was easy to work with DocBook
    with the tools available early on with Linux and other Open Source OSes there
    were office suites and such. By the time StarOffice, Applix, and AbiWord came
    on the scene, people had been using SGML to produce documentation under Linux
    for some time.


    Numerous Open Source projects are using DocBook for their documentation. A few
    of them have created some great references, and here I''ve listed the best I''ve
    found.


    The Debian Project makes an SGML/XML HOWTO (see Figure C.10) available for anyone
    who''d like to produce documentation for the Debian Project. This HOWTO is interesting
    because it includes information on working with the Linux and DebianDoc DTDs,
    as well as DocBook''s DTD. You can find the latest version at http://www.debian.org/-bort/SGML-HOWTO/potato/howto.html.'
