    # Marking Up Tables and Figures


    Tables and illustrative figures are very important to technical documentation.
    The reason I''ve separated tables and figures from the rest of the graphic elements
    is because they can be created with DocBook markup instead of a separate program.
    DocBook is good, but it can''t produce an 8x10 colored picture, with circles and
    arrows on the back of each one. It, however, create tables and some figures, using
    a little help from TeX/LaTeX or MathML in the case of XML. DocBook.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# Making Tables


    If you''ve created tables in HTML, you know that they can become complicated when
    you''re making a table that''s more than one or two rows. Unfortunately, DocBook
    markup is slightly more complicated than the HTML markup to create tables, and
    there are more options. Don''t worry, I''ll show them all and try to make it as
    simple as possible.


    I should mention, you can cheat when including a table or figure. Just because
    you can create a table or figure with DocBook markup doesn''t mean that you have
    to. If your output formats are limited to print output and Web output, you can
    get away with including the table or figure as a graphic. However, the advantage
    of making tables with DocBook markup is that you will be able to output to other
    formats that can''t handle included graphics, such as plain-text format.


    ![](img/81f56bf497dbf7f7582072400d12cb42_78_0.png)


    # Table Markup


    DocBook markup has a couple of elements to create tables. There are the aptly
    named Table element and the popular InformalTable element. The Table and InformalTable
    elements are virtually the same, except that the Table element has a title, and
    the InformalTable does not. No title, therefore informal—get it? Actually, other
    than listing a list with a table in the text, there is a good reason for making
    a distinction between formal and informal tables. If tables include a title, then
    an index or listing of all tables can be automatically generated when rendering
    DocBook output. Nifty, isn''t it?


    You can create a table-like structure using the SimpleList element because it
    allows you to specify vertical or horizontal columns. However, this is a kludge
    and should not be used in place of a true table, if that''s what you need. Remember,
    the idea behind DocBook markup is not to concern you with the look of the document
    but with the structure. If, indeed, you have a simple list, use that element.
    If your information is really a table, use that instead. The SimpleList element
    is covered in more detail in Appendix B, “DocBook Element Reference."


    ![](img/81f56bf497dbf7f7582072400d12cb42_78_1.png)'
  merge: -1
  img_proc: true
- pgno: 79
  md: "Now you will look at a small table to see how to create a table in your document.\n\
    \n```\n<table>\n<title>Example Table</title>\n<tgroup cols=\"2\">\n  <thead>\n\
    \  <row>\n    <entry>Column 1</entry>\n    <entry>Column 2</entry>\n  </row>\n\
    \  </head>\n  <tbody>\n  <row>\n    <entry>This is a cell in the table</entry>\n\
    \    <entry>So is this!</entry>\n  </row>\n  <row>\n    <entry>Column 1 Row 2</entry>\n\
    \    <entry>Column 2 Row 2: This is easy!</entry>\n  </row>\n  </tbody>\n</tgroup>\n\
    </table>\n```\n\nAs you can see, the markup to create a table in DocBook, shown\
    \ in Figure 3.14, is more complicated than the markup in HTML, shown in Figure\
    \ 3.15. However, it's all easy to remember after you've made a few tables.\n\n\
    The Table or InformalTable element begins a table. The tgroup element holds the\
    \ actual content elements of the Table or InformalTable element. The tgroup and\
    \ Table and InformalTable elements are not optional.\n\nThe head, tbody, and tfoot\
    \ elements indicate a heading, body, or footer section of the table, respectively.\
    \ The head and tfoot elements are not required in a table, but the tbody element\
    \ is.\n\nThe row element holds the rows in a table, whereas the entry element\
    \ actually holds the information content in the rows."
  merge: -1
  img_proc: true
