- pgno: 93
  md: "# Chapter 4: Preparing a Book with DocBook\n\n![](img/81f56bf497dbf7f7582072400d12cb42_93_0.png)\n\
    \n4.3 The XML declaration in Emacs\n\n# The BookInfo Element\n\nThere is some\
    \ other information you will probably want to include about the book, things such\
    \ as the title of the book, the name of the author or authors, the copyright holder,\
    \ and other meta information about the book itself. To do that, you start with\
    \ the BookInfo element.\n\nYou will look at two examples of the BookInfo element,\
    \ a simple one and a more complex example that illustrates the range of information\
    \ you can include within the BookInfo element.\n\nThe first example is for a book\
    \ with only one author and includes a copyright holder and the year of the copyright\
    \ (see Figure 4.4):\n\n```\n<book>\n<bookinfo>\n<title>DocBook Publishing</title>\n\
    <author>\n  <firstname>Joe</firstname>\n```"
