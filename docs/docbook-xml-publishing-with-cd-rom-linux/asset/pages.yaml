- pgno: 25
  md: 'The version of the SGML DTD used in this book is 4.1. If you get hold of documents
    written with earlier versions of DocBook, the DocBook.org Web site does archive
    earlier versions of the DTD—mostly for historical purposes. If you are using a
    Linux distribution that comes with DocBook DTDs and stylesheets already-installed,
    check whether they''re the latest version. If you are using something from the
    3.x series, you will need to upgrade because there are incompatibilities between
    major versions of the DocBook DTD.


    # # XML and the Future


    If you are brand new to DocBook and SGML, we heartily recommend that you think
    about using the XML DTD instead of the SGML DTD. It isn''t that the XML DTD is
    better; rather, it seems that more organizations are standardizing XML technologies.
    Theoretically, other than minor differences, the XML and SGML versions are the
    same, so it is also possible to learn both, if necessary, without too many headaches.


    The XML DTD version described in this book is 4.1.2. Although there are previous
    versions, 4.0 was the first official version of the XML DocBook DTD released by
    the DocBook Technical Committee of OASIS.


    > > Quite frankly, when you start dealing with XML, SGML, and standards organizations,
    things become hideously complicated. Standards hinge on other standards; the documentation
    is jargon filled and agonizing to read. The whole purpose of this book is to help
    you approach DocBook in a complete but user-friendly manner that negates the need
    to slog through documentation that would put an insomniac to sleep.


    ![](img/81f56bf497dbf7f7582072400d12cb42_25_0.png)


    Now that you have whetted your appetite to learn more about DocBook, it''s time
    to move on to the real thing. We hope that you enjoy using DocBook and find this
    book an easy read. If you have questions, comments, or concerns, feel free to
    write to Zonker at jbrockmeier@earthlink.net. He can''t promise that he''ll respond
    to all inquiries, but he promises that he will read them all.'
