- pgno: 174
  md: '# The Concurrent Versions System [CVS] 149


    CVS, like RCS, is easy to install from source. Download the tarfile from the CVS
    home page and unpack it in an appropriate directory by cd''ing to the directory
    and running the following commands


    ```

    gzip -cd cvs-*.tar.gz | tar xvf -

    ```


    That will create a directory cvs-X.XX (where X.XX is the version number). Next
    cd into that directory and run ./configure. If you are not root on the system,
    you might want to run ./configure --prefix=$HOME to build the software-install
    in your own home directory. Next run make followed by make. If you are not installing
    to your home directory and you are not root, you will have to su before the make
    step.


    You will find prepackaged RPMs and Debian files to install CVS, but you can download
    source or binaries for Linux. To obtain a prepackaged version of CVS, you can
    install from your distribution CVS or download from multiple websites. For RPM
    packages, search for CVS at http://www.rpmfind.net/. For Debian packages, you
    can search for CVS at http://www.debian.org/dist/ You can then install the packages
    with your appropriate package manager.


    # Basic CVS


    CVS is more complicated than RCS but not difficult. All CVS commands follow this
    format:


    ```

    cvs [cvs-option] command [cvs-command option] filename

    ```


    This is probably different from commands you normally use, because it combines
    two commands in one. You start every CVS command with cvs and then any CVS options;
    next, the operation you''d like to perform, followed by any options that operation
    takes; and finally, the filename with which you''re working. A real CVS command
    looks like this:


    ```

    cvs commit filename

    ```


    This command simply tells CVS to commit a file into the CVS repository and make
    it a new revision even if no changes occurred since the last one. In addition
    to full command-line names, such as commit, CVS offers abbreviated equivalents.
    For instance, cvs ci filename is the equivalent to cvs commit filename.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# Creating a CVS Repository


    Before you do anything with CVS, you have to create a repository for your files.
    Because you''re setting up a repository for multiple users, you should set up
    the directory somewhere other than in your home directory. For example, you could
    dedicate an entire drive to your CVS repository and set up your repository as
    its own mountpoint in /mnt/cvroot. The CVS root directory has to be readable and
    writeable to anyone accessing it, because they might need to create a lock file.
    Be careful that the CVS root directory is the only writable directory.


    Before you run the command to make the CVS repository, you must create the directory.
    For example, if you are going to make the directory /mnt/cvroot CVS repository,
    you must create it first. If you''re planning to allow multiple users on the system
    to have access to the CVS repository, you must set up appropriate groups and ownership
    permissions to allow proper read/write access to your directories. First create
    a new group on your system (our example is using the group cvs). Then, to set
    up the repository, run the following commands:


    ```

    cd /mnt

    mkdir cvroot

    chgrp cvs -R cvroot

    chmod g+w -R cvroot

    ```


    Now that you have the directory you''re going to use, run the CVS init command
    to set up the directory as a repository, like this:


    ```

    cvs -d /mnt/cvroot init

    ```


    Now the directory should be set up, and a CVSROOT directory should be created
    under the /mnt/cvroot directory with all the necessary control files.

    The examples in the following sections specify the CVSROOT directory by using
    cvs -d /mnt/cvroot with each command. If you prefer, you can set the shell environment
    variable for CVSROOT so you do not have to specify -mnt/cvroot in each command
    as the following examples show. To set your environment variable, run export CVSROOT=/mnt/cvroot,
    or if you''re a C shell user, set CVSROOT=/mnt/cvroot. To check that you properly
    set your environment variable, run echo $CVSROOT. If your CVSROOT variable is
    properly configured, you''ll see the output as shown in Figure 7.8.'
  merge: -1
  img_proc: true
