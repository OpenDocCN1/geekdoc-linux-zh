    Example:


    ```

    <para>This is how you would mark an <sgmltag class="element">element</sgmltag>
    using the <sgmltag class="element">SGMLTag</sgmltag>element.</para>

    ```


    # Step


    The Step element indicates a step in a procedure.


    The Step element uses common attributes.


    Example:


    See the Procedure element example.


    # Symbol


    The Symbol element indicates a name that will be replaced with a value.


    The Symbol element accepts the Class attribute in addition to the common attributes.


    Example:


    ```

    <para>The <symbol>$</symbol> symbol is used to represent a dollar amount.</para>

    ```'
  merge: -1
  img_proc: true
- pgno: 351
  md: '# SynopFragment


    The SynopFragment element indicates a fragment of a CmdSynopsis.


    The SynopFragment element uses common attributes.


    Example:


    ```

    <cmdsynopsis>

    <command>foo</command>

    <arg>-bar</arg>

    <group choice="*opt">

    <arg>-help</arg>

    <arg>-verbose</arg>

    </group>

    <synopragment id="markup">

    <group choice="*">

    <arg>--xml</arg>

    <arg>-none</arg>

    <arg>-sgml</arg>

    </group>

    </synopragment>

    </cmdsynopsis>

    ```


    # SynopFragmentRef


    The SynopFragmentRef element provides a reference for a SynopFragment.


    The SynopFragmentRef uses common attributes.


    Example:


    See SynopFragment element example.


    # SystemItem


    The SystemItem element indicates an item or a term from the computer system.


    The SystemItem element uses these attributes in addition to the common attributes.


    +   - Class

    - MoreInfo


    Example:


    ```

    <para>The primary name server for Prima Publishing is

    <systemitem>ns1.primapub.com</systemitem></para>

    ```'
  merge: -1
  img_proc: true
- pgno: 352
  md: '# Token


    The Token element indicates a bit of information from the computer system.

    The Token element uses common attributes.


    # Type


    The Type element indicates the data type of a value.

    The Type element uses common attributes.

    Example:


    ```

    <para>The <function>ctime()</function>, <function>gmtime()</function> and <function>localtime()</function>
    functions all take an argument of data type <type>time_t</type> which represents
    calendar time.

    ```


    # UserInput


    The UserInput element indicates input that should be entered by the user who is
    reading the data.

    The UserInput element uses common attributes.

    Example:


    ```

    <para>Now type in <userInput>username</userInput>.</para>

    ```


    # VarArgs


    The VarArgs element indicates possible arguments. When run through many processing
    systems, this element produces something like (. .). The VarArgs element is an
    empty element.

    The VarArgs element uses common attributes.


    # VariableList


    The VariableList element contains a list of terms. The VariableList element contains
    one or more of the VarListEntry elements.

    The VariableList uses common attributes.'
  merge: -1
  img_proc: true
- pgno: 353
  md: 'Example:


    ```

    <variablelist>

    <varlistentry><term>HTML</term>

    <listItem><para>Hyper Text Transport Protocol</para></listItem>

    </varlistentry>

    ```


    # VarListEntry


    The VarListEntry is a child element to the VariableList element. It contains a
    possible variable.


    The VarListEntry element uses common attributes.


    Example:


    See VariableList element example.


    # VarName


    The VarName element indicates the name of a variable.


    The VarName element uses common attributes.


    Example:


    <para><varname>$_</varname> variable in Perl is the default input and patern-searching
    space.</para>


    # Void


    The Void element is an empty element used to indicate a void, meaning the function
    has no arguments.


    The Void element uses common attributes.


    Example:


    ```

    <funcdef>int <function>pause</function></funcdef>

    void>

    ```


    # Literal Layout Elements


    Although DocBook is primarily structural markup, some elements are used for Literal
    layout. Sometimes you do have to indicate a page break, for instance.


    # BeginPage


    The BeginPage element indicates where a page should begin.'
  merge: -1
  img_proc: true
- pgno: 354
  md: '# Element Reference


    # 329


    The BeginPage element accepts the Pagenum attribute in addition to the common
    attributes.


    Example:


    ```

    <beginpage pagenum="300">

    ```


    # BlockQuote


    The BlockQuote element indicates a quote that should be set off from the rest
    of the text. Usually, any quote that is three or more lines should be enclosed
    in a BlockQuote.


    The BlockQuote element uses common attributes.


    Example:


    ```

    <para>A quote from "Mythical Man Month": </para>

    <blockquote><attribution>Frederick Brooks Jr.</attribution>

    <para>As the system comes up, the component builders will grow from time to appear,
    bearing hot versions of their pieces -- faster, smaller, more complete,or putatively
    buggy. The replacement of a working component by a new component requires the
    same systematic testing procedure that adding a new component does, although it
    should require less time, for more complete and efficient test cases will usually
    be available.</para>

    </blockquote>

    ```


    # BridgeHead


    The BridgeHead element creates a heading that has no text associated with it.


    The BridgeHead element uses this attribute in addition to common attributes.


    +   - RenderAs. Identifies how to render the BridgeHead.


    Example:


    ```

    <chapter>

    <bridgehead rederas="sect1"> Header</bridgehead>

    <para>...</para>

    </chapter>

    ```


    # Callout


    The Callout element indicates a callout of some sort.'
  merge: -1
  img_proc: true
- pgno: 355
  md: '# Appendix B: DocBook Element Reference


    The Callout element uses this required attribute in addition to common attributes.


    +   - AreaRefs


    Example:


    ```

    <Calloutlist>

    <title>My Comments</TITLE>

    <callout arearefs="opinion1">

    <para>This guy is a doofus</para>

    </callout>

    </CALLOUTLIST>

    ```


    # Calloutlist


    The CalloutList element contains a list of the Callout element.


    The CalloutList element uses common attributes.


    Example:


    See Callout element example.


    # Caution


    The Caution element indicates a block of text that should be set off from the
    rest of the text to draw attention to its contents. With most formatting systems,
    the Caution element also causes a caution graphic of some sort to be displayed
    with the Caution element.


    The Caution element uses common attributes.


    Example:


    ```

    <caut>

    <para>Don''t run with scissors</para>

    </caut>

    ```


    # CO


    The CO element indicates the position of a callout inline.


    The CO element uses common attributes.


    See the MediaObjectCO element for examples.'
  merge: -1
  img_proc: true
- pgno: 356
  md: '# Element Reference


    # 31


    # Emphasis


    The Emphasis element indicates text that should be emphasized in some way. This
    is better than markup such as HTML, which allows for italic or bold text to be
    called directly. Both italic and boldface are lost when the text is read through
    a text-to-speech device or is rendered in plain text.


    The Emphasis element uses common attributes.


    Example:


    ```

    <para>I am <emphasis>really</emphasis> tired.</para>

    ```


    # Equation


    The Equation element indicates an equation.


    The Equation element accepts the following attribute in addition to the common
    attributes:


    +   - Label. Accepts a CDATA value, has no default value, and is not required


    Example:


    ```

    <equation><title>Pythagorean Theorem</title>

    <alt>a^2 + b^2 = c^2</alt>

    <graphic fileref="equations/pythagorean.gif"></graphic>

    </equation>

    ```


    # Important


    Like the Caution element, the Important element indicates text that should be
    set off from the main body as important.


    The Important element uses common attributes.


    Example:


    ```

    <important>

    <para>Never judge a book by its cover.</para>

    </important>

    ```


    # InlineEquation


    The InlineEquation element indicates an element that should be displayed in the
    main body of text.


    The InlineEquation element uses common attributes.'
  merge: -1
  img_proc: true
- pgno: 357
  md: '# Appendix B: DocBook Element Reference


    Example:


    <para>The Pythagorean Theorem is:

    <inlineequation>

    <alt="a^2 + b^2 = c^2\</alt>

    <graphic fileref="equations/pythagorean.gif*"></graphic>

    </inlineequation>

    </para>


    # ItemizedList


    The ItemizedList element contains a list of items marked with a bullet or other
    designated marker. This is somewhat different from the OrderedList element, which
    contains a list that is sequentially labeled.


    The ItemizedList element uses these attributes in addition to the common attributes.


    +   - Spacing. Accepts either Compact or Normal as a value, has no default value,
    and is not required.

    - Mark. Accepts bullet, dash, or other symbol, and is not required.


    Example:


    <listitemized mark=dash>

    <listitem><para>HTML</para></listitem>

    <listitem><para>SGML</para></listitem>

    <listitem><para>XML</para></listitem>

    </listized>


    # literallayout


    The LiteralLayout element indicates text that should be displayed as-is. White
    space and line breaks should be rendered exactly as they are between the LiteralLayout
    markup tags.


    The LiteralLayout element uses common attributes.


    Example:


    <literallayout>

    If you wanted to have a section

    with spacing and linebreaks wherever you want

    you use literallayout.

    </literallayout>'
  merge: -1
  img_proc: true
- pgno: 358
  md: "# Note\n\nThe Note element indicates text that should be set off from the main\
    \ body as a note.\n\nThe Note element uses common attributes.\n\nExample:\n\n\
    ```\n<note>\n  <para>This is a note.</para>\n</note>\n```\n\n# OrderedList\n\n\
    The OrderedList element contains a list of items that are sequentially enumerated.\
    \ This is different from the ItemizedList element, which separates the items in\
    \ the list with a bullet or another designated symbol other than a sequential\
    \ designator.\n\nThe OrderedList element accepts the following attributes in addition\
    \ to the common attributes:\n\n+   - Continuation. Accepts one of two values:\n\
    \  - Continues\n  - Restarts\nnThe default is Restarts. The Continuation attribute\
    \ is not required.\n- InheritNum. Accepts either Ignore or Inher as a value, has\
    \ the default value Inher, and is not required.\n- Numeration. Accepts one of\
    \ the following values, has no default value, and is not required.\n  - Arabic\n\
    \  - LowerAlpha\n  - LowerRoman\n  - UpperAlpha\n  - UpperRoman\n- Spacing. Accepts\
    \ either Compact or Normal as a value, has no default value, and is not required.\n\
    \nExample:\n\n```\n<orderedlist numberation=\"Upperroman\">\n  <item><para>Chapter\
    \ 1</para></item>\n  <item><para>Chapter 2</para></item>\n</orderedlist>\n```"
  merge: -1
  img_proc: true
- pgno: 359
  md: "# Sidebar\n\nThe Sidebar element indicates that the information contained inside\
    \ the Sidebar markup should be displayed as a sidebar set off from the main text,\
    \ if the processing system allows that.\n\nThe Sidebar element uses common attributes.\n\
    \nExample:\n\n```\n<para>...</para>\n<sidebar><title>My Sidebar</title>\n<para>This\
    \ is a sidebar.</para>\n</sidebar>\n<para>...</para>\n```\n\n# SimpleList\n\n\
    The SimpleList element contains a list that contains a simple list.\n\nThe SimpleList\
    \ element uses these attributes in addition to common attributes.\n\n+   - Columns.\
    \ Accepts number of columns to display list. Default is 1.\n- Type. Sets column\
    \ type, vertical, horizontal, in-line. The default is Vertical. \n\nExample:\n\
    \n```\n<para>My phone keypad looks like this:\n<simplelist type=horiz columns=3>\n\
    <member>1</member>\n<member>2</member>\n<member>3</member>\n<member>4</member>\n\
    ...\n</simplelist>\n<para></para>\n```\n\n# Tip\n\nThe Tip element indicates information\
    \ that should be set off from the main body of text as a tip.\n\nThe Tip element\
    \ uses common attributes.\n\nExample:\n\n```\n<tip>\n<para>If I had any useful\
    \ tips for you, I'd put them here.</para>\n</tip>\n```"
  merge: -1
  img_proc: true
- pgno: 360
  md: "# Warning\n\nThe Warning element indicates text that should be set off from\
    \ the main body of text as a warning to readers.\n\nThe Warning element uses common\
    \ attributes.\n\nExample:\n\n```\n<warning>Using <command>:q</command> in <application>vi</application>\n\
    will not save changes to your text file and exit!</warning>\n```\n\n# Indexing\
    \ Elements\n\nDocBook contains a rich set of indexing elements for anyone who\
    \ wants to create his or own index using DocBook markup, or if used correctly\
    \ and the processing system supports it, to have the processing system generate\
    \ the index automatically.\n\n# Index\n\nThe Index element holds the markup for\
    \ a DocBook index.\n\nThe Index element uses common attributes.\n\nExample:\n\n\
    ```\n<index><title>Index</title>\n<indexdiv><title>Cc</title>\n<indexentry>\n\
    \  <primaryye>Class networks, 65</primaryye>\n  <secondary>A, 65, 80</secondary>\n\
    \  <secondary>B, 65, 66, 80</secondary>\n</indexentry>\n</indexdiv>\n</index>\n\
    ```\n\n# IndexDiv\n\nThe IndexDiv element indicates a division in the index.\n\
    \nThe IndexDiv element uses common attributes.\n\nExample:\n\nSee Index element\
    \ example."
  merge: -1
  img_proc: true
- pgno: 361
  md: "# IndexEntry\n\nThe IndexEntry indicates an entry in the index that can contain\
    \ PrimaryIE, SecondaryIE, and other child elements.\n\nThe IndexEntry element\
    \ uses common attributes.\n\nExample:\n\nSee Index element example.\n\n# IndexTerm\n\
    \nThe IndexTerm element indicates terms that should be indexed. The IndexTerm\
    \ element is not included in the index markup but is in-line in the regular text.\n\
    \nThe IndexTerm uses common attributes.\n\nExample:\n\n```\n<para>I use only Linux\
    \ <idexterm><primary>Operating System</primary><secondary>Open Source</secondary></idexterm>\
    \ on my computers.</para>\n```\n\n# ItemSet\n\nThe ItemSet is used in the meta-information\
    \ of a document to indicate a group of IndexTerms.\n\nThe ItemSet element uses\
    \ common attributes.\n\nExample:\n\n```\n<chapter>\n<docinfo>\n  <itemset>\n \
    \   <idexterm><primary>DocBook</primary></idexterm>\n    <idexterm><primary>SGML</primary></idexterm>\n\
    \  </itemset>\n</docinfo>\n</chapter>\n```\n\n# Subject\n\nThe Subject element\
    \ indicates a term that describes a document.\n\nThe Subject element accepts the\
    \ following attribute in addition to the common attribute:\n\n+   - Weight. Accepts\
    \ a NUMBER value, has no default, and is not required."
  merge: -1
  img_proc: true
- pgno: 362
  md: 'Example:


    ```

    <subjectset>

    <subject><subjectterm>DocBook</subjectterm></subject>

    <subject><subjectterm>XML</subjectterm></subject>

    </subjectset>

    ```


    # SubjectSet


    The SubjectSet element contains one or more of the Subject elements.


    The SubjectSet element accepts the following attribute in addition to the mon
    attributes:


    +   - Scheme. Accepts a NAME value, has no default value, and is not required.


    Example:


    See Subject element example.


    # SubjectTerm


    The SubjectTerm element holds a term that describes a document. The SubjectTerm
    is a child element of the Subject element.


    The SubjectTerm element uses common attributes.


    Example:


    See Subject element example.


    # Table Elements


    The Table elements used in DocBook correspond with the CALS table model.


    # Colspec


    The Colspec element gives the specifications for a column in a table.


    The Colspec element accepts the following attributes:


    +   - Align. Accepts one of the following values:

    - Center

    - Char

    - Left

    - Justify

    - Right


    There is no default value, and the Align attribute is not required.'
  merge: -1
  img_proc: true
- pgno: 363
  md: '# Appendix B: DocBook Element Reference


    +   - Char. Accepts a CDATA value, has no default, and is not required.

    - Charoff. Accepts a NUTOKEN value, has no default, and is not required.

    - Colnum. Accepts a NUMBER value, has no default, and is not required.

    - Colname. Accepts a NMTOKEN value, has no default value, and is not required.

    - Colwidth. Accepts a CDATA value, has no default value, and is not required.

    - Rowsep. Accepts a NUMBER value, has no default value, and is not required.


    Example:


    See Table element example.


    # Entry


    The Entry element holds the information for an entry in a Docbook.


    The Entry element accepts the following values:


    +   - Align. Accepts one of the following values:

    - Center

    - Char

    - Left

    - Justify

    - Right


    The Align attribute has no default value and is not required.


    +   - Char. Accepts a CDATA value, has no default, and is not required.

    - Charoff. Accepts a NUTOKEN value and has no default. It is not required.

    - Colname. Accepts a NMTOKEN value, has no default, and is not required.

    - Colsep. Accepts a NUMBER value, has no default value, and is not required.

    - Namest. Accepts a NMTOKEN value, has no default, and is not required.

    - Rotate. Accepts a NUMBER value, has no default value, and is not required.

    - Rowsep. Accepts a NUMBER value, has no default value, and is not required.


    +   - Valign. Accepts one of the following values:


    +   - Bottom

    - Middle

    - Top


    The Valign attribute has no default value and is not required.


    Example:


    See Table element example.'
  merge: -1
  img_proc: true
- pgno: 364
  md: "# Entrytbl\n\nThe Entrytbl element can be used in place of the Entry element.\n\
    \nThe Entrytbl element accepts the following values:\n\n+   - Align. Accepts one\
    \ of the following values:\n  - Center\n  - Char\n  - Left\n  - Justify\n  - Right\n\
    \nThe Align attribute has no default value and is not required.\n- Char. Accepts\
    \ a CDATA value, no default, and is not required.\n- Charoff. Accepts a NUTOKEN\
    \ value, no default, and is not required.\n- Colname. Accepts a NMTOKEN value,\
    \ no default, and is not required.\n- Colsep. Accepts a NUMBER value, no default\
    \ value, and is not required.\n- Namest. Accepts a NMTOKEN value, no default,\
    \ and is not required.\n- Rotate. Accepts a NUMBER value, no default value, and\
    \ is not required.\n- Rowsep. Accepts a NUMBER value, no default value, and is\
    \ not required.\n\nExample:\n\n```\n<tbody>\n  <row>\n    <entrytbl cols=\"1\"\
    \ align=\"left\" colnum=\"1\" colname=\"coll\">\n      <head>\n        <row>\n\
    \          <ENTRY>FIRST</ENTRY>\n          <ENTRY>LAST</ENTRY>\n          <ENTRY>M.\
    \ I. </ENTRY>\n        </row>\n      </head>\n    </row>\n</body>\n```\n\n# InformalTable\n\
    \nThe InformalTable element indicates a table in casual dress. Actually, kidding,\
    \ it's a table without a title.\n\nThe InformalTable element accepts the following\
    \ attributes:\n\n+   - Colsep\n  - Label\n  - Frame\n- Orient\n  - Pgwide\n  -\
    \ Rowsep\n- Shortentry\n  - ToCenter"
  merge: -1
  img_proc: true
- pgno: 365
  md: "# Example:\n\n```\n<informtable>\n<tgroup cols=\"3\">\n<colspec align=\"left\"\
    \ colnum=\"1\">\n<thead>\n<row>\n  <entry>First Name</entry>\n  <entry>Last Name</entry>\n\
    \  <entry>Middle Initial</entry>\n</row>\n</thead>\n</tgroup>\n</informtable>\n\
    ```\n\n# Row\n\nThe Row element indicates a row in a DocBook table.\nThe Row element\
    \ accepts the following attributes:\n\n+   - Rowsep. Accepts a NUMBER value, has\
    \ no default value, and is not required.\n- Valign. Accepts one of the following\
    \ values:\n  - Bottom\n  - Middle\n  - Top\nThe Valign attribute is not required\
    \ and has no default value.\n\nExample:\n\nSee InformalTable element example.\n\
    \n# Spanspec\n\nThe Spanspec element provides information for columns in a table\
    \ that span more than one column. This allows a cell to take up more than one\
    \ column.\nThe Spanspec element accepts the following attributes:\n\n+   - Align\n\
    - Char\n- Charoff\n- Colsep\n- Nameend\n- Namest\n- Rowsep\n- Spanname\n\nExample:\n\
    \n```\n<spanspec spanname=header namest=col1 nameend=col2 align=\"left\">\n```"
  merge: -1
  img_proc: true
- pgno: 366
  md: "# Table\n\nThe Table element indicates a DocBook table with a title.\n\nThe\
    \ Table element accepts the following attributes:\n\n+   - Colsep\n- Label\n-\
    \ Frame\n- Orient\n- Prowide\n- Rowsep\n- Shortentry\n- ToCentry\n\nExample:\n\
    \n```\n<table frame=\"all\"><title>My First Table</title>\n<tgroup cols=\"5\"\
    \ align=\"left colsep=1 rowspan=1>\n<colspec colname=col1>\n<colspec colname=col2>\n\
    <head>\n<row>\n  <entry>FIRST</entry>\n  <entry>LAST</entry>\n  <entry>M.I</entry>\n\
    \  <entry>D.O.B.</entry>\n  <entry>SSN</entry>\n</row>\n</head>\n<tfoot>n<row>\n\
    \  <entry>n1</entry>\n  <entry>n2</entry>\n  <entry>n3</entry>\n  <entry>d1</entry>\n\
    \  <entry>s1</entry>\n</row>\n</tfoot>\n<tbody>\n<row>\n  <entry>Kara</entry>\n\
    \  <entry>Pritchard</entry>\n  <entry>J</entry>\n  <entry>8-23-00</entry>\n  <entry>123-45-6789</entry>\n\
    </row>\n</tbody>\n</tgroup>\n</table>\n```"
  merge: -1
  img_proc: true
- pgno: 367
  md: "# TBody\n\nThe TBody element holds rows of a table or an informal table in\
    \ a DocBook document.\n\nThe TBody element accepts the following attribute:\n\n\
    +   * Valign. Accepts one of the following values:\n  * Bottom\n  * Middle\n \
    \ * Top\n\nThe Valign attribute has no default value and is not required.\n\n\
    Example:\n\nSee Table element example.\n\n# TFoot\n\nThe TFoot element holds any\
    \ footer information about a table.\n\nThe TFoot element accepts the following\
    \ attribute:\n\n+   * Valign. Accepts one of the following values:\n  * Bottom\n\
    \  * Middle\n  * Top\n\nThe Valign attribute has no default value and is not required.\n\
    \nExample:\n\nSee Table element example.\n\n# TGroup\n\nThe TGroup element holds\
    \ the information for all or part of a table.\n\nThe TGroup element accepts the\
    \ following attribute:\n\n+   * Align. Accepts one of the following values:\n\
    \  * Center\n  * Char\n  * Left\n  * Justify\n  * Right\n\nThe Align attribute\
    \ has no default value and is not required.\n\n* Char. Accepts a CDATA value,\
    \ has no default, and is not required.\n\n* Charoff. Accepts a NUTOKEN value,\
    \ has no default, and is not required."
  merge: -1
  img_proc: true
- pgno: 368
  md: "# Element Reference 343\n\n+   - Colname. Accepts a NMTOKEN value, has no default,\
    \ and is not required.\n- Colsep. Accepts a NUMBER value, no default value, and\
    \ is not required.\n- Rowsep. Accepts a NUMBER value, no default value, and is\
    \ not required.\n\nExample:\n\nSee Table element example.\n\n# THead\n\nThe THead\
