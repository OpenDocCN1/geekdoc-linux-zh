  md: '# Introduction


    Welcome to DocBook Publishing, a book for anyone who would like to learn about
    DocBook. You don''t have to be a computer guru or technical whiz, and this book
    is user friendly and fun. We hope that you will enjoy reading it as we have enjoyed
    writing it.


    # About This Book


    DocBook Publishing is a gentle guide to use DocBook to create nearly any type
    of documentation or publication. We decided to write a book about DocBook for
    two reasons. First, we are convinced that DocBook is an excellent solution for
    anyone who needs to produce publications that will be distributed in a variety
    of media. Unfortunately, DocBook is not as well known as it could be, outside
    of a very small group who mostly use it professionally. We will, at length, talk
    about the respective merits of DocBook versus other methods of production, but
    basically we are hooked on it, and we''d like to see more people hooked as well.
    We''re hoping that this book will be a good resource to make the transition to
    DocBook easier and encourage people to consider DocBook over other, less elegant,
    solutions.


    Second, we have found that very little user-friendly documentation is available
    for DocBook, and that''s a shame. Without the information on how to use the wonderful
    set of tools, known collectively as DocBook, the majority of users who could benefit
    pass it over. We''re hoping that the book you''re holding in your hands will provide
    all the information you need in order to be productive in DocBook and that the
    reading won''t be too painful. We have tried to avoid-jargonizing, and where jargon
    is absolutely unavoidable, we have provided explanations that make sense.


    # Why Use DocBook?


    Why should you use DocBook? Maybe you shouldn''t—that is, if you don''t need to
    produce professional-quality documentation or if you want to continue learning
    the intricacies of word processors and stay on the upgrade treadmill forever.
    However, if you would like to use a markup language that enables you to think
    about the writing instead of the formatting, read on.


    DocBook has advantages over word processors and typesetting programs in that it
    is extremely portable and much more flexible than your average word processor.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Portability


    nYou can produce raw SGML and XML DocBook documents in any text editor or word
    processor on any platform. It''s not necessary to read a proprietary document
    format to exchange DocBook files—all you need is the ability to read and produce
    plain ASCII text. No computing platforms are incapable of doing that. In fact,
    you could (if you were insane to want to) produce a fully compliant DocBook document
    on a Palm Pilot.


    With existing tools, you can export DocBook documents to RTF, PostScript, HTML,
    ASCII, PDF, DVI, and possibly other formats. There is really no limitation on
    the type of files you can create with DocBook. If, for example, Microsoft decided
    to support DocBook, it could use DocBook as a file format for Word or simply import
    DocBook files into Word. The specification is completely open and available to
    everyone, and it was designed with portability in mind.


    # Flexibility


    When creating documents, you will find DocBook very flexible. Want to write a
    Web page? No problem. Want to author a book and send it to the printer without
    missing about a typesetting program? No problem. Want to create a Web page, PDF
    brochures, and a printed manual? No problem. Want to restore ''57 Chevy in the
    garage and increase your sex appeal? Okay, there are a few limits.


    Later in the book we discuss how you can change DocBook tools or stylesheets to
    get exactly the output you want. It''s entirely possible to customize DocBook
    to fit your needs.


    # Who Should Read This Book


    For whom did we write this book? Admittedly, not for everyone. Some folks don''t
    need the powerner and flexibility of DocBook, and that''s okay. Heck, some people—horror
    of horrors—don''t use a computer on a regular basis. However, DocBook is appropriate
    for a large number of users, many of whom have never heard of DocBook or believe
    it''s too complicated to learn. DocBook is not much more difficult to learn than
    HTML, and it''s much more flexible.


    > DocBook will look familiar if you''ve worked with HTML at all. That''s because
    HTML and DocBook are both subsets of SGML. If you''ve already dabbled with HTML
    successfully, have no fear. DocBook is just as easy.


    ![](img/81f56bf497dbf7f7582072400d12cb42_18_0.png)'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Introduction


    In a moment, we''ll give a more in-depth summary of the groups who can benefit
    from DocBook. Suffice to say that if you''re currently producing any serious volume
    of written material on a computer, you''d likely benefit from DocBook. It doesn''t
    have to be technical documentation, although DocBook is excellent at that. Any
    written material that is intended for publication in some form is a candidate
    for DocBook. User manuals, news stories, recipe books, poetry, prose, electronic
    brochures—DocBook handles a multitude of tasks very well. The nice thing is that
    you only have to learn the bits about DocBook that apply to you. You don''t need
    to learn how, for instance, to create tables and figures in DocBook if you''re
    going to publish a book of poetry with it. You don''t need to fuss with making
    an index if you''re just writing articles.


    In a nutshell, DocBook lends itself to many types of documents that are typically
    prepared in word processors or typesetting programs. Unfortunately, these programs
    are limited in scope and designed to produce only one or two types of output.
    They also require the author to concentrate too much on the program, which distracts
    from the document itself.


    # Authors and Technical Writers


    People who write professionally should take the time to look into DocBook. Technical
    writers, in particular, will benefit from the features of DocBook because it was
    originally designed for technical documentation. It allows authors to work with
    indexes, glossaries, tables, figures, and other components of documents by using
    a markup language that does not require attention to the actual physical presentation.


    Moreover, the features that make DocBook attractive to technical writers also
    make DocBook ideal for writing tasks of all flavors.


    # Students and Instructors


    Writing academic papers requires a great deal of formatting that takes away from
    concentrating on the writing itself. Each word processor has its own way of dealing
    with formatting, each slightly different.


    We don''t think that we''re all in thinking that worry about formatting detracts
    from writing. Footnotes, block quotes, italic, and other formatting necessities
    are something that have to be relearn in each word processor. With DocBook you
    can specify, for instance, that a section of a paper is a block quote, and it
    will format accordingly, without the distraction of learning a word processing
    program.


    Chapter 2, "Writing a Technical Article," covers specifics of DocBook that will
    come handy for those writing academic papers to be published in print or electronically.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Software Developers


    DocBook is ideal for software developers who are working on documentation as they
    write software. Because DocBook does not require a word processor, developers
    who work in a text editor such as vi or Emacs can work on documentation simultaneously.


    DocBook also provides markup elements specifically suited for documenting about
    any type of software. Chapter 7, "Collaborative Work," walks you through using
    DocBook on collaborative projects, including how to use DocBook with CVS. If Vim
    is your favorite text editor, Chapter 8, "Using Vim," shows how you Vim syntax
    highlighting and other features making editing DocBook files. If Emacs is your
    editor of choice, Chapter 9, "Using Emacs" walks you through all the advanced
    Emacs features designed to simplify editing DocBook documents.


    # Who Should Not Read This Book


    Okay, DocBook is not for everyone. It''s true—some writing tasks don''t require
    the power and flexibility of DocBook. You probably don''t need DocBook to write
    a letter or make up a grocery list. If you don''t do a lot of writing, you probably
    won''t have to use a markup language to handle your formatting. Although we don''t
    think DocBook is particularly complicated, using DocBook to write a letter or
    do very simple documents is like using a shotgun to kill flies.


    Make no mistake—learning DocBook will require an investment of time and effort.
    If you don''t have to produce professional or academic-quality documents, you
    probably don''t need DocBook.


    # Conventions


    The following is a list of conventions that you will find in DocBook Publishing.
    On the CD-ROM you will find the DocBook template to create this book, and you
    will also find sample code that you can compare with the book to see how we marked
    up the chapters.


    > Cautions generally tell you how to avoid problems.


    ![](img/81f56bf497dbf7f7582072400d12cb42_20_0.png)'
  merge: -1
  img_proc: true
