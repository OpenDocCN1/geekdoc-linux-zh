- pgno: 271
  md: "# Database Markup\n\nIf you're writing a manual on working with a database,\
    \ such as MySQL, \n\nWhen naming your database in the text, you would want to\
    \ use the Database element. The Database element is used to identify the name\
    \ of an existing database or part of a database. For instance, if you are working\
    \ with a MySQL database that you've created bigdaddy then you would use the Database\
    \ element with it. However, you wouldn't use the Database element with the name\
    \ MySQL, because it is the name of an application, not the name of a particular\
    \ database. DocBook does have an Application element, however, that you do to\
    \ indicate the name of a particular application such as MySQL, PostgreSQL, or\
    \ any other application. \n\nHere is an example of the Database and Application\
    \ elements; see 12.10 for output.\n\n```\n<!DOCTYPE article PUBLIC \"//OASIS//DTD\
    \ DocBook V4.1//EN\">\n<article>\n<title>Using MySQL</title>\n<para>If you want\
    \ to work with a <application>MySQL</application> database, type in the following\
    \ command at the shell prompt:</para>\n<para><command>mysql -u username -p</command></para>\n\
    <para>prompt&gt;prompt&gt; <input>use <database>bigdaddy</database><input></para></n\n\
    </article>\n```\n\n# Hardware Markup\n\nWhen referring to a piece of hardware\
    \ in a technical manual, you can use the Hardware element to indicate a particular\
    \ piece of hardware. For instance, if you were discussing how to upgrade a computer\
    \ you might have a paragraph that looks like this.\n\n<para>Power down the computer\
    \ and remove the case. Be sure that you discharge any static by touching the case\
    \ before coming in contact with the <hardware>motherboard</hardware>. Remove the\
    \ old <hardware>video card</hardware> from the <hardware>AGP slot</hardware>.\
    \ Insert the <productname>AGP Monster Card</productname> into the free slot.</para>"
  merge: -1
  img_proc: true
- pgno: 272
  md: '![](img/81f56bf497dbf7f7582072400d12cb42_272_0.png)


    Figure 12.10 Output of the Database and Application elements


    The Hardware element is fairly generic. There aren''t elements for specific types
    of hardware like SCSI cards or hard drives. As shown in the previous example,
    you might wish to use the ProductName element when referencing a specific name
    brand of hardware.


    # Summary


    In this chapter you''ve looked at some of DocBook''s more common elements for
    writing technical documents. There are other elements that you might use in a
    technical document, but these are some of the elements that you''ll use over and
    over again.


    As you can see, the markup isn''t difficult. Don''t try to memorize all of the
    elements when you start working with DocBook. In time you''ll memorize the ones
    you need frequently, and the ones that aren''t important you can look up when
    you need them. It might seem like an overwhelming amount of material now, but
    after working with DocBook for a little while it will become'
  merge: -1
  img_proc: true
- pgno: 273
  md: second nature, just like riding a bike or driving a car. By using the elements
    that DocBook provides for technical documentation you'll find that you can produce
    very professional-looking documents that are easier to follow.
  merge: -1
  img_proc: true
