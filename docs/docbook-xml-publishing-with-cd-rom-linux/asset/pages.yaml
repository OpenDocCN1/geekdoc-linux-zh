    \ if the receiver is versed in the jargon as well. If not, then the\nreader or\
    \ listener starts to slack-jawed and get a glazed look before they\\lose interest\
    \ entirely. This is bad when trying to communicate to a new audi-\nience, but\
    \ it is a great way to get rid of boring people at parties or other func-\tions.\
    \ Extra points if you're a coroner, or know some coroner jargon.\nYou could cut\
    \ a swath in the crowd to the food and drinks faster than a hot\nknife through\
    \ butter. This probably does not work at coroner conventions,\nthough.\n\nBecause\
    \ DocBook deals with a matter of technologies, any discussion of\nDocBook invariably\
    \ requires a smattering of jargon that can't be avoided. I've\ntried to be sure\
    \ to explain new terms as I introduce them in the book, but\nfrom time to time\
    \ it might be inconvenient to do so, or you might not read\nt particular chapter\
    \ in which the term is introduced. To makes a bit\nless confusing. I have included\
    \ this glossary to help nail down the really import-\ntant, or really obscure,\
    \ terms used in DocBook Publishing.\n\nWhen you see terms in bold in this glossary,\
    \ that means they are also defined\nhere, so you can refer to those terms as well\
    \ if you're unclear as to their\nmeaning.\n\nANSI. The American National Standards\
    \ Institute. The American National\nStandards Institute is a private, nonprofit\
    \ membership organization sup-\nported by private and public sector organizations\
    \ that works with mem-\bers to develop standards for industries.\n\nASCII. The\
    \ American Standard Code of Information Interchange. The\nacronym is usually pronounced\
    \ ASCII-ee. The ASCII standard has been\naround since 1968. It is a 7-bit code\
    \ character that is becoming\nlengthy but still widely used.\n\nAttribute. Used\
    \ to further define the content of an element. Attributes are\nusually optional\
    \ but may be required with some elements."
  merge: -1
  img_proc: true
- pgno: 276
  md: 'Cascading Style Sheets (CSS). Used to define the "look and feel" (style) of
    XML and HTML documents. The cascading stylesheet specification is developed by
    the World Wide Web Consortium (W3C). Currently, there are W3C recommendations
    for CSS levels 1 and 2, and the W3C is working on a level 3 draft. You can find
    out more about CSS on the W3C site at http://www.w3.org/Style/CSS/


    Catalog File. Used to resolve public identifiers to local files. The catalog file
    contains information about where the DocBook DTD and other associated files can
    be found.


    CDATA. Character data, which can have several different meanings. When used in
    a marked section of a document it is a type of data in SGML and XML that includes
    characters normally recognized as markup, but the data is not processed. A CDATA
    section is indicated like this:


    ```

    <![CDATA[

    character data goes here

    ]]>

    ```


    Any content is allowed in a CDATA section, with the exception of the string ]>,
    which tells a parser that the CDATA section has ended.


    CDATA is also a data type for elements, meaning that an element may contain character
    data, or it can be the type of data accepted by an attribute within an element.


    Child Element (or Children). Elements that occur within other elements are sometimes
    referred to as their children because they are dependent on the placement of the
    parent element. Element children are nested within other elements and may cause
    parse errors if they occur outside their parent element.


    CLI. Command-line interface. Examples of a CLI are the Linux Bash shell and MS-DOS
    command prompt. It is possible to access the command-line interface in a GUI through
    the use of an xterm or DOS window.


    Comment. Specially marked text in DocBook markup or programming code that is ignored
    by a parser or compiler and is for the benefit of the author or programmer.


    CSS. See Cascading Style Sheets.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# Appendix A: DocBook Glossary


    DSSL. See the Document Style Semantics and Specification Language.


    DOCTYPE. Specifies the root element of a document. The DOCTYPE is indicated the
    document declaration at the beginning of a document. All SGML documents and most
    XML documents begin with a declaration.


    Document Style Semantics and Specification Language (DSSL). Used to specify formatting
    of an SGML or XML document. ISO standard 10179:1996 defines DSSL.


    Document Type Definition (DTD). Defines the structure and data elements for documents.
    DTDs are used with SGML, HTML, and XML. There are DocBook DTDs for SGML and XML.


    DTD. See Document Type Definition.


    Electronic Data Interchange (EDI). An ANSI standard for exchanging business data.


    Element. Part of SGML and XML markup defines document content. The meaning of
    an SGML or XML element is defined by the TTD of the document. DocBook documents
    are parsed by programs such as Jade or OpenJade, which interpret the elements
    and their attributes the DTD and stylesheets to produce output in HTML. PostScript,
    PDF, and other formats.


    Emacs. A text editor with a huge number of features, including content-sensitive
    editing, e-mail and newsgroup support, a Web browser, and its own Lisp interpreter.
    Emacs is short for Editor Macros. Richard M. Stallman (RMS, for short) began work
    on the first version of Emacs in 1976 at M.I.T. Emacs is part of the GNU project
    and a popular editor for working with DocBook.


    End Tag. Markup indicating the end of an element.


    Entity. A name or reference to a bit or type of data. In the body of a document
    containing DocBook markup, entities begin with the ampersand (&) and end with
    a semicolon (;). Entities are classified as internal or external. They are declared
    in the DTD or document declaration, with the following markup for internal entities:


    ```

    <!ENTITY entity_name "Entity text">

    External entities are declared like this:

    <!ENTITY entity_name SYSTEM "entity.sqml">

    ```'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'Escape Character. A substitute character for a reserved character in SGML or
    XML. For instance, the < and > characters are reserved for indicating markup.
    The escape characters (sometimes escape codes) for these characters are &lt; and
    &gt;, which produce the < and > characters when the document is processed to create
    output.


    FAQ Frequently Asked Questions, pronounced FAQ. A FAQ is a document that attempts
    to answer asked questions. Usually posted or included with a download in the hopes
    that it will save the author time answering redundant or irritating questions.


    GNU. A recursive acronym for GNU''s Not Unix. The GNU project is a project of
    the Free Software Foundation, designed to produce a free replacement for UNIX.
    The GNU project provides many tools for the Linux and the FreeBSD, NetBSD, and
    OpenBSD operating systems. GNU software is provided under the GPL


    GPL General Public License. The license used and promoted by the Free Software
    Foundation. The GPL is frequently referred to as Copyleft because it is similar
    to a regular copyright but gives the rights to software to all people rather than
    restrict them. (This is not the same as placing software in the public domain,
    because it does place restrictions on use of the software. Namely, software licensed
    under the GPL cannot be placed under another license that restricts use of or
    code by anyone else.) You can find more information about the GPL at http://www.fsf.org/


    Grep. The program grep searches a file for a line or lines in the file that match
    a pattern specified on the command line. The program grep, and its variants, are
    available on most UNIX-type operating systems. In hacker-speak, grep is also a
    generic term for searching for something, as in "I grepped the entire house but
    still couldn''t find my car keys. Turns out, I left them in my car."


    GUI. Graphical user interface, pronounced gooey. Once exotic, GUIs are the norm.
    See also CLI.


    HTML. Hypertext Markup Language. HTML is actually an SGML DTD produced by the
    W3C. HTML markup looks very similar to DocBook markup, although the actual elements
    are different. DocBook documents can be used to produce HTML.'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# Appendix A: DocBook Glossary


    IETF. The Internet Engineering Task Force. The IETF publishes a number of RFCs,
    some of which affect work done on XML by the W3C, particularly the RFCs on URLs
    and URIs.


    ISO. International Organization for Standardization. Contrary to popular belief,
    ISO is not an acronym for the name of the organization. Rather, ISO is taken from
    the Greek word *isos*, which means equal. The ISO produces a wide variety of standards,
    including the SGML model.


    ISO 8879:1986: The ISO document that provides the specifications for SGML.


    Jade. The James'' DSSSL Engine, an implementation of the DSSSL-style language.
    Jade is used in conjunction with DocBook to produce output. Jade is available
    on the CD-ROM that comes with this book, or you can find newer versions at http://www.jcelark.com/jade/.


    Keyword. A word or parameter that is a reserved name.


    Linux. An operating system. Technically, Linux is just the kernel of the operating
    system, but a typical Linux distribution includes the Linux kernel, GNU tools,
    and various other programs that make up a usable system.


    Lisp. A programming language used extensively with Emacs.


    Markup. The instructions inserted in a text file to indicate how a document should
    be displayed. Markup gives information about a document''s structure and content.


    MathML. The Mathematical Markup Language. Based on XML, a language to describe
    mathematical expressions.


    Metadata. The description of language. SGML, and XML are meta-languages because
    they are languages used to describe other language.


    Minimization. The use of shortened tags when doing SGML markup. SGML allows minimization
    of markup, but XML does not.


    Nested. Elements that reside within other elements are also referred to as nested
    elements. Child elements are nested within parent elements. If an element is supposed
    to be nested within another element and is mistakenly placed outside that element,
    it will produce validation errors.'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# DocBook Glossary 255


    Normative. Parts of a reference that provide guidelines and specifications.

    The W3C recommendation for XML is considered a normative document.


    Non-normative. Non-normative documents are those that do not provide specifications
    but rather provide examples and expansion of the specifications laid down by normative
    documents. (This book would be considered a non-normative document.)


    Nsgmls. A validating parser that parses an SGML document and checks for errors.
    Ngmls is a command-line program included with James Clark''s SP.


    OASIS. The Organization for the Advancement of Structured Information Standards.
    OASIS is a multinational concern that creates specifications based on open standards
    such as SGML and XML. The most recent versions of DocBook were created by an OASIS
    Technical Committee. You can find OASIS on the Web at http://www.oasis-open.org/


    OpenJade. A project based on James Clark''s code. OpenJade is essentially an extension
    of Jade.


    Open Source. Software that is placed under a license that allows free distribution,
    requires the accessibility of source code, allows derived works, and does not
    discriminate against persons or groups or against specific uses. You can find
    the full Open Source definition at http://www.opensource.org/osd.html


    Note that Open Source is not the same as Free Software as defined by the Free
    Software Foundation.


    Parent Element. An element in DocBook markup has one or more children. An element
    can be both a parent and child element.


    Parser. A program that parses DocBook.


    Perl. The Practical Extraction and Reporting Language, created by Larry Wall.
    A scripting language used on nearly all operating systems. Perl is often referred
    to as the duct tape of the Internet because of its popularity with system administrators
    and Webmasters.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# Appendix A: DocBook Glossary


    **Public Identifiers.** A unique name for a document that resolves to a particular
    document on any given system with the proper catalog file.


    **PCDATA.** *Parsable character data.* Content contained in an element is considered
    PCDATA.


    **RCDATA.** *Replacable character data.* References within an RCDATA section are
    recognized, but markup is not processed.


    **Reserved Name.** A syntactic literal that is a *keyword* defined in the DTD
    and cannot be used for other purposes in the document.


    **RFC.** Request for Comment. RFCs are published by the IETF and define various
    technologies used on the Internet. The specifications for URIs and URLs are defined
    by RFCs.


    **Root Element.** Also known as the document element, the top-level *tag* in a
    document.


    **Screenshot.** A capture of the information or display output from a computer.
    Often used in technical manuals or books like this one.


    **SGML.** Standard Generalized Markup Language. A *metanguage* used to define
    a markup language as HTML, XML, or DocBook. SGML is defined by *ISO 8879*.


    **SGMLtools.** Now called SGML-lite, an Open Source project that provides a front
    end for creating output from DocBook documents with Jade or OpenJade.


    **SP.** SGML Parser, written by James Clark. Contains the *nsml* program and is
    freely distributed in source code and binary format.


    **Start Tag.** Marking the beginning of an element.


    **Stylesheet.** A document or file that defines the layout for a type of document.
    CSS, DSSL, and XSL are stylesheet formats. Stylesheets are used in conjunction
    with other tools to produce output from DocBook documents. The use of multiple
    stylesheets enables an author to create multiple output formats from one DocBook
    document.


    **Syntax.** The rules that define the construction of a language. An SGML or XML
    DTD defines the syntax of a document. Syntax rules are similar to a grammar for
    a markup language.


    **System Identifiers.** Specify a file or resource located on a computer.'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'Tag. Markup indicating an element in an SGML or XML, document.


    **Text Editor.** A program that works with plain-text files and does not perform
    extensive formatting on a text file. The most popular text editors are Emacs and
    vi its clones.


    **Tidy.** A small program that "cleans up" HTML and makes it more readable, as
    well as checks and fixes errors in syntax. Tidy also replaces deprecated HTML
    formatting tags with cascading stylesheets. Tidy is often used to clean HTML code
    produced by SGMLtools.


    **Unicode.** The Unicode Worldwide Character Standard is a system for handling
    written texts of many diverse languages. Unicode includes support for the majority
    of written languages in the world, unlike ASCII, which is limited.


    **UNIX.** An operating system originally developed in Bell Labs, UNIX was first
    released in 1969. It was designed to be a portable operating system, rather than
    lock into one particular hardware design, as many operating systems did originally
    available today are UNIX variants or are designed to be like UNIX, including Linux,
    FreeBSD, NetBSD, OpenBSD, Solaris, AIX, HP-UX, and others.


    **URI.** Uniform resource indicator, defined by RFC 1630. A URI specifies the
    protocol to access a resource, the machine that it is located on, and the specific
    name of the file on the computer within the directory structure.


    **URL.** Uniform resource locator, defined by RFC 1738. URLs are a subset of URIs
    and are usually referred to as addresses as on the Internet.


    **Validation.** Comparison of a document to its DTD. A document is validated when
    it is checked against its DTD to check for proper use of elements and syntax.


    **Variable.** A value that can change and is often used as a placeholder for future
    data.


    **Vi.** A text editor originally developed by Bill Joy, vi is what is known as
    a modal editor because it can operate in one of two modes: insert mode or command
    mode. The regular alphabetic keys are used for commands, and the mode toggled
    with the Esc key. The original vi is somewhat outdated, but many clones are popular
    on UNIX-type operating systems, such as Linux.'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'Vim. The most popular of vi clones. Vim maintains compatibility with most of
    the features of the original by default but also has many features that the original
    lacks, including syntax highlighting and multiple editing buffers


    W3C. The World Wide Web Consortium. The W3C promotes many Web standards, including
    HTML, XML, XHTML, CSS, and MathML. The W3C is vendor neutral, and the standards
    it maintains are freely available, unlike ISO standards


    Whitespace. The blank space in text documents, including blanks, tab stops and
    spaces between words


    Word Processor. A program that produces formatted output and visually operates
    on a WYSIWYG principle. Word processors save files in a proprietary document format
    that cannot be opened by tools like DocBook, Microsoft Word, Corel WordPerfect,
    and Adobe Word are examples of word processors


    WYSIWYG. What You See Is What You Get. WYSIWYG editors allow the user to define
    exactly what a document looks like while creating it, displaying the document
    as it will appear when printed


    XML. The Extensible Markup Language. Yes, it should probably be XML but computer
    geeks really like the letter X. XML is a representation of XML as a subset of
    SGML and is designed for sharing data over the Internet and to overcome the shortcomings
    of HTML


    XSL. The Extensible Stylesheet Language. XSL stylesheets provide the rules for
    a document''s presentation and, independent of its content'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# Appendix B: DocBook Element Reference'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'When learning DocBook, we had a terrible time trying to figure out the best
    element for a specific purpose. We found that, although the existing documentation
    was very thorough and accurate, it wasn''t exactly organized in a user-friendly
    fashion. It was almost as if you already had to work to make use of the documentation—the
    sort of chicken and the egg conundrum that drives newbies insane, or at least
    frustrates them a bit.


    When we started to write a book about DocBook, we decided that we wanted to do
    things differently. Take, for example, this appendix. We could have simply dropped
    all the elements available in DocBook into the appendix, provided some information
    about each, and called it a reference, and that would have been some what useful.


    However, we felt that it would be much more helpful to the user to organize the
    elements by function rather than in alphabetical order. The reason for this is
    simple: if you know what an element does already, you''re less likely to look
    it up. The most common need is to find an element that fulfills a specific purpose.
    Never fear, though. You can look up the elements using the name in the back of
    this appendix if you just need a little more information on an element with which
    you are already familiar.


    These are not official categories, simply a logical ordering of elements for reference
    purposes. Some elements in DocBook don''t fit into these categories, so we''ve
    included a miscellaneous category. Also, some elements can fit into one or more
    categories.


    # DocBook Elements 101


    There are a ton of elements, more than 300 of them. Unless your document is particularly
    complicated, it''s quite possible that you will never use more than a small fraction
    of the entire set.


    If the idea of more than 300 elements is intimidating to you, you can always simplify
    a bit and try out Norman Walsh''s simplified DocBook DTD instead. The simplified
    DTD is available on the CD-ROM included with this book or from Norman Walsh''s
    site at http://www.nwalsh.com/. Elements that are part of the simplified DocBook
    set appear at the end of the chapter.'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# # How to Read the Element Reference


    The element reference is a guide to the DocBook elements. Each element topic has
    an element description, the element attributes, the valid values for each attribute,
    and a usage example.


    # ## Attribute Types


    Each DocBook attribute accepts a value that is one of several types. Each of these
    types is a particular form of data that the parser will accept as valid information.
    These are basically data types, similar to data types that are used in computer
    programming languages.


    The DocBook SGML and XML DTD accept a limited number of data types. If you require
    a wider range of data types for your application or document, you can look into
    the DocBook XML Schema that is under development. The XML Schema specification
    by the W3C allows for a wide variety of data types, far more than the XML or SGML
    DTDs. The XML Schema proposal contains too many data types to explore here, particularly
    because the DocBook XML is still in the development stages and not widely used.


    # ### CDATA


    The CDATA data type is a string of characters that can include spaces, punctuation,
    and assorted characters that are not valid in other data types.


    # ### ENTITY


    An ENTITY is the name of a declared SGML or XML entity. The ENTITY may be declared
    in the DTD or in the document itself.


    # ### ID


    The ID data type is a unique name within the document. It declares the unique
    name called by IDREF and IDREFS.


    # ### IDREF


    The IDREF data type refers to an ID declared elsewhere in a document. The IDREF
    must be unique, but it is acceptable for several IDREFS to refer to an ID value.


    # ### IDREFS


    The IDREFS data type refers to more than one ID separated by a space.'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# NAME


    The NAME data type holds a name that begins with an alphabetic character it might
    contain numbers or punctuation.


    # NAMES


    The NAMES data type holds a list of NAMES in a space-separated list.


    # NUMBER


    The NUMBER data type holds a number and may begin with a hyphen character for
    negative numbers. The NUMBER type may include a decimal point.


    # NMTOKEN


    The NMTOKEN data type is similar to the CDATA data type, but it may not hold punctuation
    or spaces. It may contain only name characters.


    # NMTOKENS


    The NMTOKENS data type holds a group of one or more NMTOKENS.


    # NMUTOKEN


    The NMUTOK data type may contain numbers, hyphens, or decimal points. It should
    not be confused with the NMTOK data type.


    # Common Attributes


    Certain attributes are common to every DocBook element. Rather than repeat them
    with each element, we list them here for convenience. You should note these are
    not required attributes, but simply are applicable to all DocBook elements. Note
    that each element in this element reference lists Common Attributes in the attribute
    list. Please refer to this list of attributes for each listing.


    # Arch


    The Arch attribute indicates the computer hardware to which the element is referring.
    This attribute is gerente not to all DocBook elements but to many elements that
    deal with programming.


    The Arch attribute accepts a CDATA string as a value, has has no default value,
    and is not required.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# Condition


    The Condition attribute is new to DocBook 4.0. Condition is a general-purpose
    attribute without any predefined values. The Condition attribute accepts CDATA
    values, has no default value, and is not required.


    # Conformance


    The Conformance attribute refers to any standard to which the target of the element
    is conformant. This refers to any standard, such as the ISO standards or other
    named standards. The Conformance attribute accepts a NMTOKENS string as a value,
    has no default value, and is not required.


    # ID


    The ID attribute provides a unique string of text as an identifier for an element.
    It accepts any unique string of text that begins with an alphabetic character.
    Each ID attribute within a document must be unique. Some elements require the
    ID attribute.


    # Lang


    The Lang attribute holds a language code that indicates an element’s language
    type. This attribute tells the parser which character set to use. It accepts a
    CDATA string as a value and is not required.


    # OS


    The OS attribute indicates the operating system to which the contents of an element
    are referring. This attribute is not applicable to all elements but is useful
    for many elements dealing with describing program elements or programming. The
    OS attribute accepts a CDATA string as a value, has no default value, and is not
    required.


    # Remap


    The Remap attribute indicates the name of an element’s content in earlier versions
    of DocBook or other markup languages. This attribute accepts a CDATA string as
    a value, has no default value, and is not required. The Remap attribute can be
    used with any element that needs to be mapped to an element in another markup
    specification.'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# Role


    The Role attribute classifies an element. It accepts a CDATA string as a value
    and has no default value. The Role attribute is not required.


    # Revision


    The Revision attribute indicates the revision number of the document containing
    the element. The Revision attribute is not used to refer to the element''s contents
    but to the document of which the element is part. The Revision attribute accepts
    a CDATA string as a value and has no default value. It is not relevant to all
    elements.


    # RevisionFlag


    The RevisionFlag attribute designates the revision status of a document. The RevisionFlag
    is not fine-grained and is not recommended as a substitute for a revision management
    system. This attribute has four possible values:


    +   - Added

    - Delete

    - Changed

    - Off


    The default value is Off. The RevisionFlag attribute is never required.


    # Security


    The Security attribute was added to the DocBook 4.0 specification. This attribute
    allows an element to be marked Secret or any other user-defined security scheme.
    The Security attribute accepts a CDATA value and has no value.


    # UserLevel


    The UserLevel attribute designates the level of expertise for which the contents
    of the element are targeted. For instance, a stylesheet could be written that
    produces one set of output for any Para element designated beginner and ignores
    any Para element designated advanced, or vice versa. The UserLevel attribute is
    not predefined. It accepts a CDATA value, has no default value, and is not required.


    # Vendor


    The Vendor attribute refers to the vendor of the product to which the element’s
    content refers. For instance, an element that contains the name of a software'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# Element Reference


    package or piece of hardware could have an attribute that refers to the vendor
    of the software or hardware. The Vendor attribute accepts CDATA string as a value,
    has no default value, and is not required. It is probably not much of use outside
    technical documentation or for the use of DocBook for print publishing.


    # XRefLabel


    The XRefLabel attribute provides a target for the XRef element. When the XRef
    element is used to link to another element in a DocBook document, the XRefLabel
    should be used as a target to which the element can link. The XRefLabel is particularly
    useful for documents that are going to be rendered in an electronic medium such
    as HTML or PDF. This attribute accepts CDATA string as a value, and each XRefLabel
    should be unique within a document. The XRefLabel is not required for any elements,
    but the XRef tag must have a target to which it can link.


    # Element Reference


    As we mentioned before, there are more than 300 DocBook elements. for easier consumption
    we have organized the elements for this section into twelve categories. These
    categories include document types, document structures, attribution and citation,
    Web, media, meta-information, program and operating systems, literal layout, indexing,
    table, reference, and obsolete. You will find that some elements belong to multiple
    categories and have been referenced to in other sections.


    # Document Type Elements


    The DocBook document elements are top-level elements that are often used to separate
    a document into segments, such as chapters, articles, and so forth.


    # Appendix


    The Appendix element declares an appendix, a supplemental addition to the document
    (such as this supplemental element reference in DocBook Publishing). The Appendix
    element can be used as a sub-element of the Article or Book element.


    The Appendix element accepts the following attributes in addition to the common
    attributes:


    +   * Label

    * Status'
  merge: -1
  img_proc: true
- pgno: 291
  md: "# Appendix B: DocBook Element Reference\n\nExample:\n\n```\n<!DOCTYPE appendix\
    \ PUBLIC-//OASIS//DTD DocBook V4.1//EN\">\n<appendix label=\"B\" status=\"draft\"\
    >\n  <appendixinfo>\n    <title>Appendix B</title>\n  </appendixinfo>\n  <para>...</para>\n\
    </appendix>\n```\n\n# Article\n\nThe Article element declares an Article document\
    \ type. Usually, Article is the document type chosen for stand-alone documents\
    \ such as articles or academic papers that are not going to be related to other\
    \ DocBook documents.\n\nThe Article element accepts the following attributes in\
    \ addition to the common attributes:\n\n+   - Class. Has no default value and\
    \ is not required. May contain the following five possible CDATA values:\n- FAQ\n\
    - JournalArticle\n- ProductSheet\n- TechReport\n- WhitePaper\n\nParentBook. May\
    \ contain an IDREF value that refers to a parent book, has no default value, and\
    \ is not required.\n\nExample:\n\n```\n<!DOCTYPE article-//OASIS//DTD DocBook\
    \ V4.1//EN\">\n<article>\n  <articleinfo>...</articleinfo>\n  <para>...</para>\n\
    </article>\n```\n\n# Bibliography\n\nThe Bibliography element starts a bibliography,\
    \ a detailed listing of books and other published materials typically used as\
    \ a reference for the document.\n\nThe Bibliography element accepts the following\
    \ attribute in addition to the common attributes:\n\n+   - Status. Accepts a CDATA\
    \ value, has no default value, and is not required."
