  md: '# Types of Images


    and render DocBook files into different formats know enough to ignore data they
    don''t need. I''m sure that they all ignore extraneous data, but I''ll stick with
    most programs in case one out there I''ve tried doesn''t do this.


    # Creating PostScript and PDF Output


    When preparing a DocBook document for print publication, the markup for including
    images is the same, but the images themselves are different.


    # Encapsulated PostScript


    The Encapsulated PostScript (EPS) image format is used when exporting PDF or PostScript
    files. The programs you use to produce output from Doc-Book documents, Jade or
    OpenJade, do not convert JPEG, PNG, or GIF images into EPS format for inclusion
    in PostScript or PDF files. If you want to export one of those formats, you must
    provide an EPS file for graphics, as well as a JPEG, GIF, or PNG file for HTML
    output.


    > In chapter 6, "Parsing DocBook," you will look in greater detail at the various
    tools for converting DocBook into different formats. Note that Jade and OpenJade
    do not try to include images in RTF and plain-text output.


    ![](img/81f56bf497dbf7f7582072400d12cb42_68_0.png)


    EPS files are a graphic format based on PostScript. As you probably already know,
    PostScript is a language originally designed for printing. However, encapsulated
    PostScript files are not necessarily designed for printing on their own; they
    are actually graphic files in the PostScript language. EPS files can be ASCII
    or binary files, depending on the program that creates them. Occasionally, you
    will find programs that output EPS files that are not strictly EPS. Therefore,
    it''s a good idea to test an EPS file and try it with Jade or OpenJade before
    you go into a project depending on EPS files that do not work with your chosen
    rendering program.


    The markup for including an EPS image is the same as the markup for including
    JPEGs or PNGs, except that you specify EPS filenames instead. There are a few
    ways to handle multiple output formats. One is to use markup like that shown in
    Figure 3.6.


    ```

    <mediaobject>

    <imageobject>

    ```'
  merge: -1
  img_proc: true
