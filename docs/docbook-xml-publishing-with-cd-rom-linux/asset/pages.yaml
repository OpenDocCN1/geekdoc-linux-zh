- pgno: 104
  md: '# Book Structure Elements


    I''ll be talking a lot about elements that aren''t so much concerned with the
    content of a DocBook document as the structure. I''ve already touched on a few
    of them; the Sect element and the Book element are structural in nature. However,
    the Sect elements that I''ll be covering in a bit are solely concerned with the
    structure of the documents.


    # Working with Navigational Elements


    Why think about structure, other than the reasons already mentioned in this chapter?
    Well, DocBook documents derive their formatting from stylesheets, which format
    each element of a document according to its structure or content. For example,
    the Title element contained within a Sect1 element is probably going to be formatted
    differently than a Title element contained within the Sect2 or Sect5 elements.


    These elements become navigational elements when the document is rendered for
    publication. In a printed book, the titles are in the table of contents as section
    headers; in HTML the elements become navigational elements quite literally. You
    can click on them and jump to the section you describe. It''s important to pay
    close attention to structure so that at this point readers can navigate your document
    easily and find the information for which they''re looking.


    # Working with Sections


    I have already mentioned quite a few times that DocBook is very concerned with
    the structure of a document. Nowhere is this more evident than the number of elements
    dedicated to the hierarchy of sections in a document. DocBook has seven, yes,
    seven elements that are concerned with sections of a document. Five of these elements
    have been briefly touched on already, the Sect1 through Sect5 elements. DocBook
    also has a SimpleS element and a Section element that do not have specific levels.


    This is a list of all the section elements, including the informational elements:


    +   - Sect1

    - Sect1Info

    - Sect2

    - Sect2Info'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# Chapter 4: Preparing a Book with DocBook


    +   - Sect3

    - Sect3Info

    - Sect4

    - Sect4Info

    - Sect5

    - Sect5Info

    - SimpleSect

    - Section

    - BridgeHead


    The SectInfo used in Sect5 elements contain meta information about the section
    in which they are located. For instance, if you want to include meta information
    about part of a DocBook document that is contained within a sect1 element, use
    the sect1 element. The SectInfo element cannot be used in any of the other sections
    and replaces the DocInfo element in older DocBook documents. It might also bear
    mentioning that the SectInfo element contains meta information only about the
    sect1 in which it is contained, not all sect1 elements throughout the document.


    The SimpleSect element is a section element that contains no subsections, although
    it may be a subsection of another sect element. For instance, the following example
    would be valid:


    ```

    <sect1>

    <title>Example Section</title>

    <para>

    This is an example of a Sect1 element containing a SimpleSect element.

    </para>

    <simplesect>

    <title>SimpleSect Title</title>

    <para>

    The SimpleSect element may contain a Title element and a Para element, but it
    may not contain another Sect element.

    </para>

    </simplesect>

    </sect1>

    ```


    However, if another section element was nested within the SimpleSect element,
    it would not be valid. For a full list of valid child elements for the SimpleSect
    element, consult Appendix B.'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'A chapter or another document may contain multiple Sect2 elements, which may
    also contain multiple Sect3 elements, and so on. However, DocBook is strict about
    maintaining the hierarchy of Sect elements. You may not skip Sect elements. For
    example, it is not valid to nest a Sect3 element in a Sect1 element directly.
    The following is a valid example of the hierarchy of Sect elements, including
    the SimpleSect element (see Figure 4.8):


    ```

    <chapter>

    <section>

    <para>

    You can include a Section element in a Chapter element but not within any of the
    Sect1 through Sect5 elements or the SimpleSect element.

    </para>

    <sect1>

    <para>

    This is a Sect1 element.

    </para>

    <sect2>

    <para>

    This is a Sect2 element.

    </para>

    <simplesect>

    <para>

    This is a SimpleSect element, which can be placed under any of the Sect elements,
    but not the Section element. Note that you have to close the SimpleSect element
    before the next element.

    </para>

    </simplesect>

    <sect3>

    <para>

    This is a Sect3 element.

    </para>

    </sect3>

    <sect3>

    <para>

    This is another Sect3 element, which also contains a Sect4 and Sect5 element.
    Note that we do not close this element until after the Sect4 and Sect5 elements
    are closed, but don''t forget to close the Para element.

    </para>

    ```'
  merge: -1
  img_proc: true
