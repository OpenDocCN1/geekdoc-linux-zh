- pgno: 121
  md: 'If you plan to output HTML from DocBook, you will want to read this chapter.
    Here are tips and tricks for making the most of DocBook for online documents and
    articles. You will also learn how to clean up the auto-generated HTML with Tidy.


    # Creating Online Documentation


    Creating documents for display online is not much different from creating documents
    for print which is concerned. Remember, DocBook is designed to enable the author
    to create a structured document that is portable and can be rendered into many
    formats.


    However, you can do some things to make the output even better. For example, including
    URLs, e-mail addresses, and using the xref tag will make your online documents
    more navigable and more useful.


    # Including Links with DocBook


    One of the wonderful things about hypertext is your ability to link to other sections
    of a document or to other documents or sites in your text. The old days of cumbersome
    footnotes and references are gone. Rather than use a footnote with a pointer to
    a section in the back of the book that leads you to a page in another book (which
    you may or not have), you can simply link to the resource, and let the reader
    zap straight to it.


    Having said that, I will show how you can include links in your documents and
    make the most of DocBook''s capabilities.


    The elements you will be working with are


    +   * Anchor

    * CiteTitle

    * Link

    * OLink

    * ULink

    * XRef'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# Creating Online Documentation


    To start, let''s say that you want to do something very basic—include a link in
    your document to a Web site. This is almost as easy in DocBook markup as it is
    in HTML markup.


    > You could also consider Email a link, but I will deal with that case separately.


    ![](img/81f56bf497dbf7f7582072400d12cb42_122_0.png)


    To include a basic link to another site in your document, you use the Ulink and
    CiteTitle elements. The Ulink element contains the URI or URL. The CiteTitle element
    is not specifically concerned with links but with any cited title of a work—such
    as a book, poem, song, white paper, or Web site.


    In this example, you''re including a link to the official DocBook Web site. Remember,
    it''s a good idea to include this information even if you don''t plan to render
    your document in HTML. The information will be available if you decide to do it
    later, without your having to go back and re-edit the entire document, and the
    link will appear in the printed document as—at least, as long as you''re using
    the default stylesheets.


    ```

    <para>

    <ulink url=http://www.oasis-open.org/docbook/>

    <citetitle>The Official DocBook Website</citetitle>

    </ulink>

    </para>

    ```


    The Ulink element needs to be nested within the Para element or one of its parent
    elements. For a complete list of parent elements for the Ulink element, see Appendix
    B, "DocBook Reference."


    The URL attribute is required to generate a hyperlink when the document is rendered
    into HTML.


    > Although you''re mostly concerned with HTML in this chapter, because it is the
    dominant medium for the Web at the time of this writing, it is possible that the
    other types of output will take full advantage of hyperlinks as well. For instance,
    more than likely there will be stylesheets to output XHTML in the near future
    as browsers support XHTML. Remember, DocBook can be used to generate just about
