    \ <title>The Lorax Strikes Back: The Unpublished Tales of Dr. Seuss</title>\n\
    \ <publisher>\n  <publishername>Random House</publishername>\n </publisher>\n\
    \ <copyright>\n  <year>2001</year>\n  <holder>Random House</holder>\n </bibentry>\n\
    </bibliography>\n```\n\nIt's straightforward. All the elements included in the\
    \ Bibliography element are elements you've already encountered in other elements\
    \ and uses. If you are going to output an MLA or APA format bibliography, you\
    \ must also include the Address and City elements under the Publisher element.\
    \ Obviously, if the book has multiple authors and editors, you can add the proper\
    \ markup for those as well.\n\n# Summary\n\nIn this chapter you've looked extensively\
    \ at elements used in making a DocBook book. A DocBook book can be simple and\
    \ include very few elements, or it can be a complex affair with multiple files,\
    \ glossaries, appendices, reference pages, prefaces, and many other sorts of components.\
    \ The larger and more complex the project the more you can use of DocBook's unique\n\
    \n![](img/81f56bf497dbf7f7582072400d12cb42_118_0.png)"
