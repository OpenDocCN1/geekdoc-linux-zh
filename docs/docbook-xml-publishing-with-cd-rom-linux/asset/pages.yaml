- pgno: 304
  md: '# Attribution and Citation Elements


    # Ackno


    The ackno element holds an acknowledgment for an article. It takes the place of
    a preface or an introduction in an article.


    The ackno element uses common attributes.


    Example:


    ```

    <!DOCTYPE article PUBLIC "//OASIS/DTD DocBook V4.1//EN">

    <article>

    <para>...</para>

    <ackno>Thank-you Zonker for giving us all these examples</ackno>

    </article>

    ```


    # Acronym


    The Acronym element holds an acronym, such as GNOME or KDE.


    The Acronym element uses common attributes.


    Example:


    ```

    <para>I wish I worked for the <acronym>CIA</acronym></para>

    ```


    # Address


    The Address element holds an address, usually a container for the elements that
    make up someone''s entire postal address.


    The Address element accepts the following attribute in addition to the common
    attributes:


    +   - Format. Accepts one default value, LineSpecific, which indicates that the
    processing system should keep white space intact when rendering the address.


    Example:


    ```

    <para>Here''s my address:

    <address>

    Steven and Kara Pritchard

    <street>42 Wishing Lane</street>

    <city>Notgunna Tellya</city>, <state>CA</state>

    <keycode>12345-4242</keycode>

    <country>USA</country>

    </address>

    </para>

    ```'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# Affiliation


    The Affiliation element holds the organization information for an individual,
    a group, or an institution to which an author might be connected, for instance.


    The Affiliation element uses common attributes.


    Example:


    ```

    <author>

    <firstname>Tony</firstname>

    <surname>Soprano</surname>

    <affiliation>New Jersey Mob</affiliation>

    </author>

    ```


    # ArtPageNums


    The ArtPageNums element holds the page numbers of an article that is being referenced.
    It can also be used in an article that is being published, but which page numbers
    it is going to be is more difficult when writing the document.


    The ArtPageNums element uses common attributes.


    Example:


    ```

    <!DOCTYPE article PUBLIC "//ASIS//DTD DocBook V4.1//EN">

    <article>

    <header>

    <artpagenums>1-25</artpagenums>

    </header>

    </article>

    ```


    # Attribution


    The Attribution element holds the attribution information for a quote.


    The Attribution element uses common attributes.


    Example:


    ```

    <!DOCTYPE blockquote "//ASIS//DTD DocBook V4.1//EN">

    <blockquote>

    <attribution>Eric S. Raymond</attribution>

    <literallayout>May the Source be With You</literallayout>

    </blockquote>

    ```'
  merge: -1
  img_proc: true
- pgno: 306
  md: "# Author\n\nThe Author element holds information about an author. Note that\
    \ the Author element does not hold the information directly, but it is broken\
    \ down into elements such as FirstName, Surname, and OtherName.\n\nThe Author\
    \ element uses common attributes.\n\nExample:\n\n```\n<author>\n  <firstname>Joe</firstname>\n\
    \  <othername>Zonker</othername>\n  <surname>Brockmeier</surname>\n</author>\n\
    ```\n\n# AuthorBlur\n\nThe AuthorBlur element contains a biography for an author\
    \ or other information relating to an author.\n\nThe AuthorBlur element uses common\
    \ attributes.\n\nExample:\n\n```\n<author>\n  <firstname>Joe</firstname>\n  <othername>Zonker</othername>\n\
    \  <surname>Brockmeier</surname>\n  <authorblur>\n    <para>\"Zonker\" Brockmeier\
    \ is a big fan of Linux and Movies. We're not quite sure how they're related...</para>\n\
    \  </authorblur>\n</author>\n```\n\n# AuthorGroup\n\nThe AuthorGroup element holds\
    \ information about multiple authors.\n\nThe AuthorGroup element uses common attributes.\n\
    \nExample:\n\n```\n<!DOCTYPE authorgroup PUBLIC \"%ASIS//DTD DocBook V4.1//EN\"\
    >\n<authorgroup>\n  <author>...</author>\n  <editor>...</editor>\n</authorgroup>\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 307
  md: "# AuthorInitials\n\nSelf-explanatory, the AuthorInitials element holds an author's\
    \ initials or other brief reference to an author.\n\nThe AuthorInitials element\
    \ uses common attributes.\n\nExample:\n\n```\n<author>\n  <firstname>Kara</firstname>\n\
    \  <surname>Pritchard</surname>\n  <authorinitials>KP</authorinitials>\n</author>\n\
    ```\n\n# BlockQuote\n\nThe BlockQuote element holds a longer quote or citation\
    \ that is set off from the text.\n\nThe BlockQuote element uses common attributes.\n\
    \nExample:\n\n```\n<blockquote>\n  <attribution>Lloyd Dobler</attribution>\n \
    \ <para>I don't want to sell anything, buy anything, or process anything as a\
    \ career. I don't want to sell anything bought or processed, or buy anything sold\
    \ or processed, or process anything sold, bought, or processed, or repair anything\
    \ sold, bought, or processed. You know, as a career, I don't want to do that.</para>\n\
    </blockquote\n```\n\n# Citation\n\nThe Citation element makes a reference to a\
    \ book or publication in the text of the document. The Citation element is used\
    \ with citations in the body of the document. If you want to cite a work in a\
    \ bibliography, see the BiblioEntry element.\n\nThe Citation element uses common\
    \ attributes.\n\nExample:\n\n```\n<!DOCTYPE para PUBLIC \"//OASIS//DTD DocBook\
    \ V4.1//EN\">\n<para>\n  See <citation>DocBook Publishing</citation> for more\
    \ help on DocBook.\n</para>\n```"
  merge: -1
  img_proc: true
- pgno: 308
  md: "# CiteRefEntry\n\nCiteRefEntry element cites a reference page, as opposed to\
    \ the Citation element, which cites a book or publication.\n\nThe CiteRefEntry\
    \ uses common attributes.\n\nExample:\n\n```\n<para>If you want to learn more\
    \ about the <command>ls</command> you might want to refer to the <citerefentry><reftitle>ls</reftitle></citerefentry>\
    \ man page or GNU entry.</para>\n```\n\n# CiteTitle\n\nThe CiteTitle element holds\
    \ the title of a cited work and is used in conjunction with many other elements,\
    \ including the Citation and ULink elements.\n\nThe CiteTitle element accepts\
    \ the following attribute in addition to the mon attributes:\n\n+   - URL. Accepts\
    \ a CDATA value of any valid URL.\n\nExample:\n\n```\n<ul url=\"http://www.yahoo.com/\"\
    ><cititle>Yahoo!</cititle></ul>\n```\n\n# Collab\n\nThe Collab element holds information\
    \ about a collaborator on a document.\n\nThe Collab element uses common attributes.\n\
    \nExample:\n\n```\n<book>\n<bookinfo>\n  <title>DocBook Publishing</title>\n \
    \ <authorgroup>\n    <collab>Joe Brockmeier</collab>\n  </collab>\n    <collab>Kara\
    \ Pritchard</collabname>\n  </authorgroup>\n</bookinfo>\n...\n</book>\n```"
  merge: -1
  img_proc: true
- pgno: 309
  md: '# ColLabName


    The CollabName element holds the name of a collaborator.


    The CollabName element uses common attributes.


    Example:


    See Collab element example.


    # ConfDates


    The ConfDates element holds the dates of a conference and is often used for holding
    information about a conference at which a document was presented. For instance,
    if a DocBook article was written for a conference held from August 1 to August
    3, 2000, that information could be listed using this element. This element can
    also be used for discussing a conference in the text of a document.


    The ConfDates element uses common attributes.


    Example:


    See ConfGroup example below.


    # ConfGroup


    The ConfGroup element holds other elements that provide information about a conference.


    The ConfGroup element uses common attributes.


    ```

    <!DOCTYPE confgroup PUBLIC //OASIS//DTD DocBook V4.1//EN>

    <confgroup>

    <confdates>March 29, 2001</confdates>

    <conftitle>Denver 2001</conftitle>

    <confnum>2</confnum>

    <address>Denver, Colorado USA</address>

    <confsponsor>Linux Weekly News</confsponsor>

    </confgroup>

    ```


    # ConfNum


    The ConfNum element holds the conference number and is useful when a conference
    is held regularly.


    The ConfNum element uses common attributes.


    Example:


    See ConfGroup element example.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# ConfSponsor


    The ConfSponsor element holds the information about a conference sponsor.


    The ConfSponsor element uses common attributes.


    Example:


    See ConfGroup element example.


    # ConfTitle


    The ConfTitle element holds the title of a conference.


    The ConfTitle element uses common attributes.


    Example:


    See ConfGroup element example.


    # ContractNum


    The ContractNum element holds the document’s contract number.


    The ContractNum element uses common attributes.


    Example:


    See ContractSponsor element example.


    # ContractSponsor


    The ContractSponsor element holds the name of the company or organization that
    has contracted for the document.


    The ContractSponsor element uses common attributes.


    Example:


    ```

    <!DOCTYPE article PUBLIC //OASIS/DTD DocBook V4.1//EN>

    <article>

    <header>

    <title>Kara''s Todo Document</title>

    <contractsponsor>The Kara Group, Inc.</contractsponsor>

    <contractnum>2001-03-17a</contractnum>

    <pubnumber>...</pubnumber>

    <corauthor>Some Writing Group, Inc.</corauthor>

    </header>

    </article>

    ```'
