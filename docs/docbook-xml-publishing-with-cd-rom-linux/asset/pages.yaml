- pgno: 139
  md: '# Summary


    This chapter covers the aspects of writing DocBook for output to HTML. In particular,
    the chapter focuses on linking between various parts of the document and resources
    located on the Web.


    Even if you don''t plan to output to HTML for online now, I very much encourage
    you to write your documents as if you are going to. Although it might take longer,
    it will save you a great deal of time later. If you try to go back and “webalize”
    your documents after the fact, you won''t remember everything you wrote (not as
    well), and the links to resources in the document will be lost.


    It doesn''t hurt a document being output to PostScript to have the extra elements
    necessary for HTML output, but it is a big pain to convert the document later.'
  merge: -1
  img_proc: true
