    # Document Structure Elements


    The elements listed in the document structure category deal with the hierarch
    structure of a DocBook document.


    # FormalPara


    The FormalPara element is used for paragraphs that are to have a title. (The Para
    element does not allow a Title element).


    The FormalPara element uses common attributes.


    Example:


    ```

    <!DOCTYPE formalpara PUBLIC "//OASIS//DTD DocBook V4.1//EN">

    <formalpara...><title>My First Paragraph</title>

    <para>...</para>

    </formalpara>

    ```


    # Para


    The Para element is used for standard paragraphs. Note that if you want a title
    for your paragraph, you must use the FormalPara element.


    The Para element uses common attributes.


    Example:


    ```

    <!DOCTYPE para PUBLIC "//OASIS//DTD DocBook V4.1//EN">

    <para>

    ```


    The Para element is used for standard paragraphs. Note that if you want a title
    for your paragraph, you must use the FormalPara element.

    </para>


    # Sect1


    The Sect1 element begins a level 1 section in a document. The Sect1 element may
    contain a Sect2 element directly but not a Sect3 or lower.


    The Sect1 element accepts the following attributes in addition to the common attributes:


    +   - Label. Accepts a CDATA value, has no default value, and is not required.'
  merge: -1
  img_proc: true
