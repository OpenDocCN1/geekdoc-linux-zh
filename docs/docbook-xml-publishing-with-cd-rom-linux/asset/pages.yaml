    Figure 3.17 shows the MathML markup in Vim.

    Fully covering MathML markup is beyond the scope of this book, but you can find
    a tutorial and the entire specification on the W3C''s site at http://www.w3.org/TR/2001/REC-MathML/


    # Summary


    Including images, figures, tables, and equations makes your documents come alive
    for those who are more visually oriented. Be sure to plan your strategy for including
    images before starting a large project. DocBook is fairly flexible in what you
    can do graphically, so be sure that you take full advantage of its capabilities.'
