    # XML Resources


    XML is really, really taking off. I''ve mentioned this before, but it bears repeating.
    The resources I''ve listed here are the best ones as of the writing of this book.
    I fully expect that more wonderful resources will become available, so be to do
    a little hunting on your own for sites that might pop up in the future.


    The best place to go for information is usually straight to the source. In this
    case, the source for information on XML is the World Web Consortium (W3C). They''re
    the folks who have come up with the standard. Okay, technically, it''s a recommendation,
    not a standard, but let''s not get picky here. You can find information on XML,
    XSL, CSS, MathML, and other related technologies on the W3C''s Web site (see Figure
    C.7) at http://www.w3c.org/


