- pgno: 183
  md: '# Chapter 7: Collaborative Work with DocBook


    # Viewing Revision Logs


    A really neat feature of TkCVS is your ability to view the revision log of a file
    or directory. With command-line CVS, you can get the same information, but TkCVS
    makes it much easier to read by making it graphical. It''s like a family tree
    for file revision, very handy.


    To view a revision log, select a file in the left pane of TkCVS, and then click
    the button that looks like a tree branch at the bottom of the TkCVS window, shown
    in Figure 7.15.


    # More about TkCVS


    TkCVS does much more than the basics you need for using it with DocBook. If you
    want to find out more about TkCVS for use as a developer, try the online help
    that comes with TkCVS, or visit the TkCVS Web site at http://www.twobarleycorns.net/tkcvs.html.


    ![](img/81f56bf497dbf7f7582072400d12cb42_183_0.png)


    Figure 7.15 Viewing revision logs'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# Other GUI Clients for CVS


    As we discussed earlier in this chapter, while we focus our examples and instructions
    on the clients for Linux, there are other Open Source clients available for Linux
    and for other operating systems. To experiment with other clients, visit the Web
    sites listed below. Please note that with the speed of development, this list
    is nowhere near complete, or may have outdated links by the time you read this
    book.


    +   - Cervisia. KDE Client for Linux—http://cervisia.sourceforge.net

    - gCVS. HP-UX, Linux, MacOS, Windows—http://www.arachne.org/software/gcvs/

    - jCVS. Java—http://www.jcvs.org/

    - LinCVS. Linux—http://www.lincvs.org/

    - MacCVS Pro. MacOS—http://www.maccvs.org/

    - NetBeans. Java—http://www.netbeans.org/


    # Summary


    This chapter provides an overview of the GNU Revision Control System and Concurrent
    Versions System for revision control with DocBook. Both RCS and CVS are book-worthy
    topics of their own, and this chapter only touches the surface of their capabilities.
    However, you have enough information to utilize either RCS or CVS for collaborative
    DocBook projects.


    This chapter also touches on managing and interacting with CVS using the TkCVS
    GUI client. TkCVS is freely available, and I encourage you to download and give
    it a try. If TkCVS isn''t for you, plenty of GUI clients not listed above are
    also available for Linux and other platforms in various stages of development.
    Check Freshmeat at http://www.freshmeat.net/ for other CVS clients that are Open
    Source.'
  merge: -1
  img_proc: true
