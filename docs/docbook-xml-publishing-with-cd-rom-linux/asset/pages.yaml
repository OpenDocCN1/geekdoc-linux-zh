- pgno: 161
  md: '# Chapter 7: Collaborative Work with DocBook


    Writing a book or technical manual is often a collaborative process. For instance,
    on many books you have multiple people involved including authors, project editors,
    technical editors, technical reviewers, and copy editors. Needless to say, all
    these kindly souls have different ideas of what should be, or shouldn''t be, in
    the text. This can create serious confusion, if not outright chaos.


    To manage such a project, you must implement some method to the madness. Overall,
    in a situation such as the one we''re discussing here, a professional book development
    project, the project editor will track changes, comments, and suggestions between
    all participating individuals and implement the most appropriate ones in the final
    product. Other projects, however, such as corporate internal documentation, Open
    Source development documentation, or even educational material development, may
    not have such luxuries as editors available. To make these projects manageable,
    and the professional editors more efficient, a method of document tracking should
    be used. In this chapter, we will discuss various options for revision control,
    such as the GNU Revision Control System (RCS) and the Concurrent Versions System
    (CVS).


    # You Still Need Backups


    Now is as good time as any to point out that, the fact that both RCS and CVS make
    backup copies of files, it''s best practice to regularly make a backup of your
    files on some kind of removable media, such as a Zip disk, tape drive, or even
    to a writeable CD-ROM. With this practice in place, even if your hard drive goes
    to the great junkyard in the sky, your data in a CVS repository is still housed
    and your colleagues won''t feel the need to strangle you for having to rewrite
    all of your work because your cat dumped the gold-fish bowl onto your computer.


    In all seriousness, even if your CVS repository is on a remote server with a talented
    system administrator taking conscientious care of backups, it''s a good idea to
    have a backup system for files on your local machine. Even one day of work is
    a lot to lose.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# What Is Revision Control?


    # # What Is Revision Control?


    During the the development process, software gets a revision number. Every time
    a change is made, such as new features or bug fixes, the program gets a new revision
    number. Sometimes you''ll find this revision number in commercial software as
    the release version of the software, whereas other times you''ll find the revision
    number in the release number or service pack number. Revision numbers are typically
    more obvious in the case of Open Source development because there are frequent
    updates between major releases, which each have their own revision number.


    Revision control is the practice of maintaining older versions of the code base
    to allow developers to "roll back" to earlier versions of the code base if changes
    introduce new and worse bugs, or just to allow for maintenance of an older version
    of the code base while a new version is started.


    Revision control software automates the process, making it easier for developers
    (both software and documentation) to keep track of which revision is most current
    and which changes have been made between versions. If you''re wondering what all
    this talk of programming versions and bug fixes has to do with managing a documentation
    project with DocBook, the overall process and benefits are the same. If you consider
    that a project editor or main author can allow all contributors to work on the
    same text simultaneously, each contributor will have his own release version,
    and if the editor or main author does not approve of the new release, the older
    version can be used. Through comment features the editors can track who is changing
    what, when, and who has permission to change what.


    # # Going to the Library


    In simple terms, you can compare version control systems to a library system.
    Like a library, content, whether it''s text documentation or programming code,
    is checked out for viewing (and editing) and checked in allow the librarian to
    keep track of the content and take care of it for other library card holders to
    use. With DocBook, Bob (library card holder) can start writing his program or
    save it to a file (library book). He can then check in the first revision of the
    code to a repository (librarian). When he''s ready to start again, he can check
    out the code from the system. Depending on the version control system he is using,
    RCS or CVS, Bob''s file may be locked so other library card holders are unable
    to change the content until Bob checks the code back in.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# Getting a Lock on It


    If you are using the RCS version control system, your checked out file is locked
    (unless you only check out to read, and not edit, the file). Locking the file
    prevents others from checking in a revision of the file while you have it out.
    The practical upshot of locking the file means that when one person has the file
    and is making changes, no else can contribute changes for version until it is
    unlocked. The latest copy of the file can be checked out for someone else to compile
    or read, but that person cannot commit changes to it.


    This might sound like a pain, but for simple projects, or projects with only a
    couple contributors, file-locking may be easier for whoever is managing the project.
    If you consider a scenario with just one writer and editor working on a project,
    the writer can start a draft and check it in to the RCS. If done properly, the
    editor can check out the file and make changes, comments, revisions, or whatnot
    to the copy. While this is going on, the file is locked so that the author cannot
    check out the file and make any revisions until the editor has checked the revision
    back in and vice versa.


    This assures that both parties are working, if you will excuse the expression,
    on the same page. It would be a nightmare scenario if the editor spent the part
    of his or her weekend making changes and edits and on Monday the author posted
    a completely different draft.


    This scenario can be prevented with a little more work and a complex program such
    as CVS. CVS manages changes. If two or more people try to commit changes that
    conflict with one another, CVS notifies the user of the offending change. This
    allows the contributor or editor to manually view and change the text without
    overwriting someone''s work. For larger projects with more contributors, file
    locking can become time consuming, not allowing various contributors to work at
    the same time; therefore a non-locking system, as CVS, is more practical.


    # Using Revision Control Programs


    For the general purpose of this book, we assume that everyone involved in using
    a Linux system or, at least, has access to one. This doesn''t mean that you have
    to be using Linux to write and edit your files, just that the revision control
    systems, RCS and CVS, reside on Linux or UNIX servers.


    If you are working with another OS over your desktop, such as Microsoft Windows
    or MacOS, but still have access to a Linux- (or UNIX-) based'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'server running CVS, you can either ftp files to the Linux server, or you can
    use a local CVS client. Free GPL graphical CVS clients can be found for Microsoft
    Windows or Macintosh at http://www.wincvs/.


    Although strictly DocBook-related, it''s still worth mentioning that using unencrypted
    methods to move files about is a Very Bad Idea as a general rule. FTP is a very
    insecure method of transport these days. If you need to use FTP instead of SSH
    and SCP, use logins and passwords that are exclusive to FTP.


    For instance, if your system login is bobsmith, you don''t want to use that for
    FTP. Instead, set up (or have your system administrator set up) an account as
    book or editor for FTP files back and forth. The permissions for the FTP account
    should be such that they are allowed to do only FTP. If someone snoops the FTP
    password, he or she cannot, without further effort, log in to a shell on the system.


    ![](img/81f56bf497dbf7f7582072400d12cb42_164_0.png)


    You should always remember that revision control is a great substitute for e-mailing
    code or copy back and forth, but it is not a substitute for good communication.
    For best practice purposes, when planning a revision control system, set up a
    regular communication schedule to discuss any major issue between your contributors.


    Another item to consider if you choose to implement a version control system.
    RCS and CVS were both developed to deal specifically with text files. If your
    project includes graphical figures, you will have to design or implement a different
    system to manage them. CVS can also handle binary files allowing you to manage
    multiple revisions with the only limitation being you cannot diff against the
    files.


    # Revision Control for Group Projects


    As we''ve already discussed, the benefits of version control systems are aimed
    at large projects, typically with multiple contributors. Whether you opt for the
    simple, direct solution of RCS, allowing you to simply manage the project files,
    or a more complex solution with CVS, allowing you to have multiple people working
    from multiple branches of code simultaneously, in the long run you will have more
    efficiently completed your project.'
