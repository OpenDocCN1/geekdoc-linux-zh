- pgno: 110
  md: '# Book Structure Elements


    The Reference element contains the RefEntry and RefS elements, which contain the
    actual contents of the reference. The RefS1 element is confusing because its name
    implies other RefS elements exist. However, that is not the case; RefS1 is the
    only reference section level. I''m not sure why the DocBook committee chose to
    name it in that manner.


    If you are creating a technical reference or something similar, you will find
    the Reference element and its children to be quite useful.


    # Creating an Index


    Indexing a document is a big deal. In the publishing industry there are folks
    who make a living doing nothing but indexing documents. It''s an actual science,
    or as some would have it, an art.


    > Even the book that you hold in your hands now was professionally indexed. Although
    DocBook contains many tools that help automate the process of producing and publishing
    a book, nothing compares to the ability of a real human being to make editorial
    decisions. The bean counters might have wished to automate one more job, but DocBook
    parsers just aren''t savvy enough to do a good job of indexing a book thoroughly
    and intelligently.


    ![](img/81f56bf497dbf7f7582072400d12cb42_110_0.png)


    You can include an Index element in a Chapter, an Article, or under several other
    elements. However, if you''re developing an index for an entire book, it might
    be best to develop it as its own document and include it as shown in the first
    example in this chapter.


    The following example shows a simple index with two entries, to give the feel
    of the markup for the Index element. The index is developed as its own document
    in this example, even you would probably include a two-entry index within another
    document normally.


    ```

    <!DOCTYPE type PUBLIC-//OASIS//DTD DocBook V4.1//EN">

    <index>

    <indexinfo>

    <editor>

    <firstname>P.K.</firstname>

    <surname>Une</surname>

    </editor>

    </index>

    ```'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# Chapter 4: Preparing a Book with DocBook


    ```

    <title>Sample Index</title>

    <indexentry>

    <primary>Index 100-101, 201</primary>

    <secondary>elements, 200</secondary>

    <secondary>keywords, 203</secondary>

    <seealso>DocBook Elements</seealso>

    </indexentry>

    <indexentry>

    <primary>IndexEntry 102, 200</primary>

    <secondary>elements, 200</secondary>

    </indexentry>

    ```


    This probably looks intimidating at first. Many elements are bouncing around here,
    so I will break it down a bit at a time.


    All the index information is contained within the Index element itself. The next
    element is the DocInfo element, which is similar to the other info elements available
    in DocBook 4.x.


    > Before DocBook 4.x, the DocInfo element was the catchall for meta information
    about a component of a DocBook document. In 4.x, DocInfo has been replaced with
    more specific elements that provide meta information about specific components
    of a DocBook document. The new elements include AppendixInfo, ArticleInfo, Bibliography-Info,
    ChapterInfo, and so. See Appendix B for the full list of new elements. If you
    are converting a DocBook 3.x document to 4.x, you must replace DocInfo elements
    with more specific elements.


    ![](img/81f56bf497dbf7f7582072400d12cb42_111_0.png)


    The DocInfo element is optional, but it is probably a good idea to include all
    the information you have available, for the benefit of the reader and to give
    credit to the indexer as well. I used the Editor element for the name of a fictitious
    indexer. Unfortunately, DocBook does not have an indexer element at this time.


    The next element is the Title element, which you''ve used quite a few times in
    other contexts, so the syntax for the Title element is the same as in the other
    examples covered so far. It''s probably a good idea to include a simple title
    with your index, at least Index or something similar.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# Book Structure Elements


    The actual information for each entry in the index is contained in the appropriately
    named IndexEntry element. The first index reference is contained within the PrimaryIE
    element. Usually, there is only one PrimaryIE element in each IndexEntry element,
    but it is possible to include more than one. The SecondaryIE element contains
    information about less relevant entries in the text concerning the IndexEntry.
    As you can see, it''s also possible to have multiple instances of that element
    within an IndexEntry element.


    Each PrimaryIE, SecondaryIE, and TertiaryIE contains the terms and page numbers
    for that IndexEntry. Figure 4.11 is an example of an index generated by SGMLtools
    in HTML.


    However, marking text by hand seems like very difficult work. The good news is
    that it''s possible to automate generating an index in DocBook if you use the
    proper markup when creating your document, and if your parser and rendering programs
    support doing so.


    The elements used to generate an index automatically are different from the elements
    used to do so by hand. If you want to generate the index from markup placed in
    the text rather than create an index from scratch, you use the IndexTerm element.


    ![](img/81f56bf497dbf7f7582072400d12cb42_112_0.png)


    Figure 4.11 The index rendered in HTML.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Chapter 4: Preparing a Book with DocBook


    The simplest way of using the IndexTerm element is to place it in the section
    of text you like de indexed. However, the IndexTerm doesn''t quite work as you
    might expect. Instead of simply enclosing a term used in the text with the IndexTerm
    element, the IndexTerm element is text that is not processed and rendered with
    the rest of the text. That is to say that the output of your document will not
    contain the IndexTerm information.


    Instead, you add the IndexTerm markup to existing text. This example shows how
    to add an IndexTerm entry in a paragraph about DocBook.


    Even though this method of indexing is easier, you will probably want to have
    a professional indexer go through the text and the indexing, or you should at
    buy a book on indexing and read through it to get more background on indexing.


    ![](img/81f56bf497dbf7f7582072400d12cb42_113_0.png)


    ```

    <sect2>

    <title>Indexes in DocBook</title>

    <para>

    <indexterm><primary>Indexing</primary><secondary>Index Element</secondary></indexterm>

    Indexing a document is a big deal. In the

    <indexterm>

    <primary>Indexing</primary><secondary>Publishing</secondary></indexterm>

    publishing industry there are folks who make a living doing nothing indexing documents.
    It''s an actual science, or some would have it, an art.</para>

    </sect2>

    ```


    The IndexTerm allows for Primary, Secondary, and Tertiary elements, as well as
    the See and SeeAlso elements. For more on these elements and their use, see Appendix
    B.


    # Creating the Table of Contents


    If you''re using SGML tools or a similar program to parse and render your DocBook
    document, you''re in for a pleasant surprise—a table of contents is generated
    automatically when you render your document. This means no plowing through the
    document trying to figure out which page each section'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'begins on and then writing a table of contents that will change if many revisions
    are made. Nope, it''s generated-on-the-fly each time you process the document
    to create output.


    However, I''ll include a brief example of a table of contents so that you can
    see the work you''re avoiding. The elements used to create this table of contents
    are Toc, TocPart, Tocchap, and Toentry. Although this is helpful to understand,
    I''ve always found the table of contents generated-on-the-fly to be good enough,
    as long as you include the Title element for each Sect and Chapter and similar
    elements.


    ```

    <toc>

    <tocpart>

    <tocchap>

    <tocentry pagenum="1">How to make a TOC</tocentry>

    <tocentry pagenum="2">How to avoid making a TOC</tocentry>

    </tocchap>

    </tocpart>

    </toc>

    ```


    # # Creating a Glossary


    If you use many unfamiliar terms or jargon in your book, you should include a
    glossary to which readers can refer. Any technical reference worth its salt (and
    many other types of books) includes a glossary. The Glossary element can be contained
    within a Chapter element (or any of the Sect1 through Sect5 elements), the Book
    element, and if you have several entries for a glossary, you might want to set
    it off in its own file, similar to the examples for the Chapter elements in this
    chapter.


    Glossaries with more than a few entries should probably make use of the Gloss
    element, which allows the glossary to be divided into manageable divisions. Generally,
    I would recommend divying up your glossary alphabetically, unless there is a more
    logical way to divide it.


    The following example shows a DocBook glossary with two logical divisions and
    a few sample entries. Of course, a real glossary would be much heft than this,
    but this should be sufficient to give you an idea of what the markup looks like
    for the Glossary element and its children. Figure 4.12 shows the glossary rendered
    in HTML.


    ```

    <!DOCTYPE glossary PUBLIC "//OASIS//DTD DocBook V4.1//EN">

    <glossary>

    ```'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# Chapter 4: Preparing a Book with DocBook


    ```

    <glossaryinfo>

    <editor><firstname>Joe</firstname><othername>"Zonker"</othername><surname>Brockmeier</surname></editor></glossaryinfo>

    ```


    ```

    <title>Really Neat Sample Glossary</title>

    <para>You can include an introduction to the glossary if you like like.</para>

    <div>

    <title>A</title>

    <glossentry>

    <glosssterm>Abstract</glosssterm>

    <glossdef>

    <para>The Abstract element contains information about an article, book, or other
    work. An abstract is a brief summary or description of the contents of a work.</para>

    </glossdef>

    </glossentry>

    </div>

    ```


    ```

    <div>

    <title>B</title>

    <glossentry>

    <glosssterm>Book</glosssterm>

    <glossdef>

    <para>The Book element contains all the components of a DocBook book.</para>

    </glossdef>

    </glossentry>

    </div>

    ```


    The Glossary element contains the GlossDiv, GlossEntry, GlossTerm, and GlossDef
    elements. Again, using the GlossDiv element is optional on whether your document
    is large enough to be divided. The GlossEntry element starts a new entry in your
    glossary; the GlossTerm element contains the term being defined in this glossary
    entry. The GlossDef element contains the actual definition of the GlossTerm. Be
    sure to nest the elements properly, as shown in the preceding example, or your
    parser will produce a number of errors.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# Book Structure Elements


    ![](img/81f56bf497dbf7f7582072400d12cb42_116_0.png)


    # Really Neat Sample Glossary


    You can include an introduction to the glossary if you like:


    # Abstract


    The Abstract element contains information about an article, book, or other work.
    An abstract is a brief summary or description of the contents of a work.


    # Book


    The Book element contains all the components of a DocBook.


    Figure 4.12 A glossary in HTML


    The GlossInfo element is also optional. As with other info elements, you can include
    a wide range of information using the GlossInfo element.


    # Creating an Appendix


    Appendices often appear in technical and reference works and include information
    from the text of the book but in a distilled and more concise form.


    As with this book, most of the information found in the appendix is in the text
    of the book itself, although some is not. However, it can be very inconvenient
    having to thumb through the book''s examples to find out how the Book element
    is used and the appropriate syntax. Therefore, there''s an appendix dealing with
    all the DocBook elements. It is easy to browse and more complete than would be
    readable in the body of the book. However boring, for example, to have a full
    and complete reference of all possible permutations of the Book element in the
    text of the book, but how much useful when collated and as a reference in an appendix.


    A DocBook need not include an appendix to be valid, but it is useful for the reader
    with certain types of books. There is also no limit on or minimum'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# Chapter 4: Preparing a Book with DocBook


    of appendixes in a DocBook book. As the following example shows, the Appendix
    element is used in the same way as the Chapter element. The only valid parent
    elements for an appendix are the Article, Book, and Part elements. An appendix
    may not be included in a chapter, for example.


    ```

    <!DOCTYPE appendix PUBLIC "-//OAS//DTD DocBook V4.1//EN">

    <appendix>

    <title>This is an Appendix.</title>

    <para>Not too difficult, is itit</para>

    </appendix>

    ```


    Not much to that at all, there is. As of DocBook version 4.x, the Appendix element
    may also contain an AppendixInfo element if you want to include meta information
    about the appendix. Also, just as with the Chapter element, you can include a
    number of other elements within an appendix, including a Sidebar, a Table, an
    Itemizedlist, and many others. See Appendix B for the full list of potential child
    elements.


    ![](img/81f56bf497dbf7f7582072400d12cb42_117_0.png)


    > You should familiarize yourself with the appropriate child elements for each
    other element. Sometimes it jogs your memory to include further information about
    something you have forgotten. For instance, the Sidebar element is valid within
    the Appendix element, which might remind you to include a sidebar about something
    in the appendix you have forgotten or have structured differently.


    # Creating a Bibliography


    The last major element I''m going to talk about in this chapter is the Bibliography
    element. A bibliography, if you''re not familiar with one, includes information
    about books used for reference in writing an article or book or perhaps books
    that are suggested reading.


    If you''ve ever written college term papers, you''re probably painfully familiar
    with bibliographies. The nice thing about the Bibliography element and its children
    is that if yourประเทศไทย is set up to output in the proper formats, it is much
    easier to generate a bibliography in MLA or APA formats than in a traditional
    word processor. All you have to do is fill in the proper elements, and the processing
    program should do the rest. I''ll talk more about stylesheets in Chapter 10, "Customizing
    DocBook"'
  merge: -1
  img_proc: true
- pgno: 118
  md: "MLA stands for the Modern Language Association, and APA stands for the American\
    \ Psychological Association. If you've never had to format a paper in one of these\
    \ formats, you're quite a lucky person.\n\nA sample bibliography would look like\
    \ this:\n\n```\n<!DOCTYPE bibliography PUBLIC \"-//OASIS//DTD DocBook V4.1//EN\"\
    >\n<bibliography>\n <bibentry>\n <author>\n  <firstname>Theodore</firstname>\n\
