- pgno: 390
  md: '# # Typesetting Programs


    The two Open Source programs for typesetting that I would recommend taking a look
    at are ImPress and LyX. ImPress is an Illustrator-like program for Linux that
    produces output in PostScript. LyX is a semi-WYSIWYG program that produces LaTeX
    output, from a friendly front end.


    ImPress is a vector-based program written in Tcl/Tk and licensed under the GPL.
    It is in a late beta stage but seems usable and stable to me. I haven''t used
    ImPress for serious production, but when testing it, I didn''t have any crashes
    or issues. ImPress could be used to produce typeset documents or to produce PostScript
    figures for inclusion with DocBook documents. It should run on any system that
    has a Tcl/Tk interpreter. You can find ImPress at http://www.ntlog.org/~cox/impress/
    (see Figure C.17).


    LyX is a program that tries to simplify the interface between the user and LaTeX.
    It is a decent program that can be used to produce LaTeX output for publishing
    or just to create LaTeX for use with DocBook documents. There are versions of
    LyX for Linux and UNIX variants, Windows, and OS/2. For a good look at LyX, visit
    the LyX home page at http://www.lyx.org/ (see Figure C.18).


    ![](img/81f56bf497dbf7f7582072400d12cb42_390_0.png)


    Figure C.17 The ImPress typesetting program'
