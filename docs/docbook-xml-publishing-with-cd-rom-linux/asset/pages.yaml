- pgno: 217
  md: "# Chapter 9: Using Vim\n\n> It might be worth checking the Vim.org Web site\
    \ to see whether there are newer versions of the syntax files on the Vim.org Web\
    \ site, as the existing DocBook syntax file is somewhat outdated. (It is written\
    \ for DocBook 3.0/LinuxDoc.).\n\n![](img/81f56bf497dbf7f7582072400d12cb42_217_0.png)\n\
    \n# Installing Syntax Files\n\nIf you're lucky, your system administrator has\
    \ been kind enough to install your syntax files and everything for you. If you\
    \ are your own system administrator, however, you may need to install the syntax\
    \ files on your own.\n\nCopy the docbook.vim and sgml.vim files to the default\
    \ /syntax directory. On your system, the /syntax directory is located in /usr/share/vim/vim56/syntax/—but\
    \ this might differ depending on your distribution.\n\nAfter you've copied the\
    \ syntax files to the syntax directory, you will want to edit the .vimrc file\
    \ to get Vim to automagically use the docbook.vim.\n\nIn your home directory,\
    \ start Vim with the following command:\n\n```\nvim .vimrc\n```\n\nYou'll want\
    \ to add the following lines to your .vimrc file:\n\n```\nset syntax=on\nlet color\
    \ = \"true\"\n\nif has(\"syntax\")\n    if color == \"true\"\n        \" This\
    \ will switch colors ON\n        so $($VIMRUNTIME)/syntax/syntax.vim\nelse\n \
    \       \" this switches colors OFF\n        syntax off\n        set t_Co=0\n\
    endif\n```\n\nAfter you've added these lines to your .vimrc file, you should be\
    \ able to restart Vim, and whenever you edit DocBook files ending with .sgml or\
    \ .xml, you'll have color highlighting."
  merge: -1
  img_proc: true
- pgno: 218
  md: '# Using Vim SGML and DocBook Syntax 193


    # Basic Vim


    Learning Vim will take a bit of practice, but after you''ve got the hang of it
    while you will find that you can be quite productive. This section isn''t DocBook
    specific; it''s only included only for the convenience of those who haven''t gotten
    the hang of Vim.


    ![](img/81f56bf497dbf7f7582072400d12cb42_218_0.png)


    When you edit text in Vim, whether you''re creating a new file or editing an existing
    one; the text is stored in a buffer—space in memory—you write the changes to a
    file or discard them. If you start Vim without opening a file to edit, it creates
    an empty buffer which you begin working. Vim also stores files in a buffer, rather
    than working directly on them, and changes to the file after a command is written.
    The practical upset is that you can save it under a different name to avoid changes
    to the.


    # Modal Editors


    Vim, like vi, is what known as a modal editor. While using Vim, you are either
    in the command mode or the insert mode, but unlike most text editors, you can''t
    use both modes at the same time. Vim is designed to enable the user to keep his
    or her hands on the home keys of the keyboard while using the editor. This design
    enables users to improve their typing speed greatly because their hands don''t
    have to leave the keys, and thus, a user spends less time trying to use odd keys,
    such as function keys or mode. Users can delete, cut, paste, search, navigate,
    and more, by using the standard keys. This requires that the program differentiate
    when the user is in an insert or append mode and when the user is in a command
    mode.


    Actually, some would say that Vim has three modes: insert mode, command mode,
    and ex mode—or as the "Getting Started" from the Linux Documentation Project calls
    it, the last line mode (ex commands from the entered on the bottom of the screen).
    Many commands in vi are actually associated with the ex editor. Vim combines vi
    and ex into one handy. However, if ever comes up in a game of Trivial Pursuit,
    you will be prepared.


    # Starting Vim


    To begin, put around in Vim a little bit to get the hang of it. Vim (vi should
    work, too) at the shell prompt, either at the console or in an xterm or its equivalent.
    Figure 9.4 shows Vim starting up. After you enter an empty buffer, you can type
    to begin inserting text. You are now in insert mode. To leave the insert mode
    and return to command mode, press the Esc key.'
