- pgno: 81
  md: 'You might have noticed that some of the names of the table elements aren''t
    consistent with the names of most DocBook elements. Specifically, they aren''t
    referred to with an initial uppercase letter the way that DocBook elements. This
    is keeping consistent with the way that the elements are described in the CALS
    specification. Remember, the DocBook Technical Committee didn''t come up with
    all of the table elements; they use a different specification that was already
    in popular usage.


    The same markup applies to InformalTable element, but it does not have a title.


    It is possible to include a subtable within a table by using the Entrytbl element
    has has a required attribute, the column attribute, called Cols. The next example
    shows a table with a subtable.


    ```

    <!DOCTYPE article PUBLIC "//OASIS//DTD DocBook V3.1//EN">

    <article>

    <table frame=all><title>Sample Table</title>

    <tgroup cols=2 align=left colspan=1 rowspan=1>

    <tbody>

    <row>

    <entry>Column 1</entry>

    <entry>Column 2</entry>

    </row>

    <row>

    <entrytbl cols=1>

    <tbody>

    <row>

    <entry>This is a sub-table</entry>

    </row>

    </tbody>

    </entrytbl>

    </tgroup>

    </table>

    </article>

    ```


    The Table and InformalTable elements are different from most DocBook markup because
    they allow for so much specification of exactly how the table should look—which
    is not what structured markup is all about. It''s important to remember that not
    all output formats support all specifications. If you'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'output to plain-text format, for example, it will be very limited in the ways
    it can display table information beyond the bare basics. This is also true, to
    a lesser extent, of HTML and RTF. The PostScript and PDF formats should be able
    to realize any formatting options fully. If the look of the table is very important,
    it might be best to include an image of the table rather than rely on markup.


    For more information on the CALS Table Model, you can check the documentation
    found on the OASIS Web site at this URL:

    http://www.oasis-open.org/html/a502.htm


    ![](img/81f56bf497dbf7f7582072400d12cb42_82_0.png)


    # Making and Including Figures and Equations


    There are a few ways you can go about including figures and equations in DocBook
    documents. I''ve already talked about including standard images created in programs
    like Adobe Photoshop and The GIMP. In the next section you will look at making
    figures and equations with markup.


    # Using LaTeX for Figures and Equations


    Because LaTeX is a complicated markup language, I''m going to cheat here. Rather
    than try to give you a full tutorial on LaTeX, which is well beyond the scope
    of this book, I''ll share a nifty Open Source tool with you that can use to generate
    LaTeX.


    LyX is a program that allows you to create LaTeX markup, DVI output, and even
    PostScript output. Even better, LyX has great features for working with mathematical
    equations.


    ![](img/81f56bf497dbf7f7582072400d12cb42_82_1.png)


    As you can see in Figure 3.16, LyX comes loaded for bear create equations.

    How do you use these wonderful toys with DocBook? One way is to use LyX to create
    a PostScript file for inclusion with your document. However, as mentioned before,
    you must have an Encapsulated PostScript file to include as an image, not a plain
    PostScript file. If you generate a PostScript file, you must use something like
    The GIMP or Adobe Photoshop to convert the PostScript file to EPS. This might
    seem like a lot of steps, but does guarantee that your equation will look exactly
    as you want to. You will also have the advantage of being able to convert PostScript
    files to other image formats for output to HTML or other formats.


    > DVI, or Device Independent, is a printable file created from LaTeX or TeX. DVI
    is produced as an intermediate format by Jade or OpenJade to create PostScript
    or other files.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Chapter 3: Using Images


    ![](img/81f56bf497dbf7f7582072400d12cb42_83_0.png)


    Figure 3.16 The LyX Math Panel


    The other method is to create LaTeX output from LyX and create a LaTeX version
    of your DocBook document, cutting and pasting the figure into the document before
    processing the LaTeX file for final output. You will look at this procedure in
    more detail in Chapter 6, “Parsing DocBook”. Finally, if you’re using the DocBook
    XML DTD, you can export LaTeX to MathML using LaTeX2HTML, WebEQ and WebTeX. This
    is complicated, but it can be done. An excellent tutorial, as well as all the
    necessary software, is located at http://www.geom.umn.edu/~ross/webtex/webtex/


    # Using MathML for Mathematical Equations


    If you’re using the XML DTD, you have the option of including MathML equations
    in your DocBook document. MathML is a markup language for mathematical and scientific
    content. Mainly, MathML is designed for sharing equations via the Web; it is not
    as concerned with print and other forms of output. However, with the appropriate
    use of stylesheets, there’s no reason that MathML cannot produce excellent print
    output as well.


    To include MathML markup in your document, use the following declaration:'
  merge: -1
