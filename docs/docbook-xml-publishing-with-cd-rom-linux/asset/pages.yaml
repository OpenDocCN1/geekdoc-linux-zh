- pgno: 207
  md: '# The View Menu


    The View menu allows you to toggle the types of views you have of your document.
    Sometimes all the elements and attributes get in the way of the actual writing,
    so you just want to read the plain text. No problem! The View menu allows you
    to hide or show tags and attributes while you''re working so that you can work
    more efficiently.


    Figure 8.18 is the before, and Figure 8.19 is the after. Notice how much easier
    it is to read the document in Figure 8.19—and all the information is still there.
    Emacs is hiding it for the time being.


    # The DTD Menu


    The DTD menu gives you all kinds of information on the current DTD and elements
    within the DTD (see Figure 8.20). You can use the DTD menu to list all valid elements
    for a DTD, the valid attributes and the elements with which they correspond, and
    the content that can appear in elements—including the other elements that can
    occur within them.


    ![](img/81f56bf497dbf7f7582072400d12cb42_207_0.png)


    Figure 8.10 The DocBook document with all elements visible'
  merge: -1
