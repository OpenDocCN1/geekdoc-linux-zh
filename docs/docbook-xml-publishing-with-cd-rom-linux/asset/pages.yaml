    # Obsolete Elements from Previous Versions


    Some elements from DocBook version 3.0 are no longer valid DocBook elements. If
    you need to maintain a document that was written in DocBook 3 or or'
  merge: -1
  img_proc: true
- pgno: 372
  md: 'earlier, you must remove these elements and replace them with elements that
    are

    used in DocBook 4.


    Don''t panic, though. Only a few elements from version 3 are obsolete, so it

    shouldn''t be difficult to upgrade to version 4.


    # ArtHeader


    The ArtHeader element has been replaced in DocBook version 4 with the

    ArticleInfo element.


    # BookBiblio


    The BookBiblio element has been removed. There is no replacement.


    # Comment


    The Comment element has been replaced by the Remark element in DocBook

    version 4.


    # DocInfo


    The DocInfo element has been split into a number of more specific elements:

    AppendixInfo, BibliographyInfo, ChapterInfo, GlossaryInfo, IndexInfo,

    PartInfo, PrefaceInfo, RefentryInfo, ReferenceInfo, SetIndexInfo, and

    SidebarInfo.


    # InterfaceDefinition


    The InterfaceDefinition element has been removed. There is no replacement.


    # SeriesInfo


    The SeriesInfo element has been removed. There is no replacement.


    # Future Versions of DocBook


    The DocBook Technical Committee has a rough road map for DocBook version

    5.0 at this time, but it might be some time before that specification is presented

    to OASIS, and even longer before it is the official version of DocBook.


    There was some talk of moving to XML for version 5.0, but it looks as

    there has been enough interest in SGML that there will be a DocBook 5.0

    SGML version as well. However, the emphasis in the future will be XML.

    As mentioned earlier in the book, all things being equal, it''s probably best
    to start

    any new DocBook projects with XML, barring a compelling reason to use SGML

    instead.'
  merge: -1
  img_proc: true
