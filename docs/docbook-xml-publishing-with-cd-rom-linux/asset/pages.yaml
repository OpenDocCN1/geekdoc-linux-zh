- pgno: 53
  md: '# Chapter 2: Writing a Technical Article


    attribute. The class attribute has three possible values: Directory, HeaderFile
    and SymLink.


    ```

    <para>

    Now open the file <filename>passwd</filename> in the <filename

    class="directory">*/etc/</filename> directory.

    </para>

    ```


    The filename element enables you to further specify certain classes of names:
