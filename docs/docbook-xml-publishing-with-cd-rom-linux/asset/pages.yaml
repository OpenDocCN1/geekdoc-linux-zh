- pgno: 125
  md: '# Linking within a Document


    One of the most useful features in HTML is your ability to create relative links
    within a document to other portions of the document. DocBook markup also enables
    you to create links within your document to other portions of your document, but
    they''re not straightforward as the system used in HTML markup.


    In HTML you can simply use an anchor element for both the link and the target.
    The XRef attribute for the Anchor element generates the link, and the Name attribute
    provides a target for the link. In DocBook markup, you can use several elements
    to generate internal links.


    The elements used for links within a document are Anchor, Link, and XRef. XRef
    is capable of doing more than just generating a link to other text, however. With
    the XRef element, you can also pull text from other DocBook elements. For instance,
    you can use the Title attribute from the Chapter element. The XRef element uses
    the ID attribute from other elements.


    The Anchor element is used to provide a reference point for the XRef element when
    another element with an ID attribute to link to not exist.


    > Remember, when using an ID attribute, it must be unique within the document.
    you can use chapter2 and chapter3 as values for the ID attribute for two consecutive
    chapters, preferably Chapters 2 and 3, but you would not use the value chapter
    twice.


    Although the ID attribute must be unique, there can be multiple pointers to one
    ID—for example, if you have this markup:


    ```

    <chapter id="introduction">

    <title>Introduction</title>

    </chapter>

    ```


    You can have this markup at the end of every other chapter:


    ```

    <para>

    <xref linkend="introduction">

    </para>

    ```


    which would generate a link to the beginning of the Introduction.


    ![](img/81f56bf497dbf7f7582072400d12cb42_125_0.png)'
  merge: -1
  img_proc: true
- pgno: 126
  md: "# Creating Online Documentation\n\n# How XRef Works\n\nXRef pulls the information\
    \ needed from the ID attribute and the Title element, or if the element does not\
    \ contain a child element, it uses the XRefLabel attribute. If an element does\
    \ not support the Title child element or the XRefLabel attribute, you must use\
    \ the Anchor element, which can be located virtually anywhere within a document,\
    \ as long as it is nested within one of its parent elements.\n\nYour head swimming\
    \ from confusing jargon? Are child and parent elements and attributes confusing\
    \ you? If you skipped the Introduction, now might be a good time to backtrack\
    \ and skim through it. You can also check out Appendix A, \"DocBook Glossary,\"\
    \ if you are just a little fuzzy on the terms.\n\nIf you feel confused, don't\
    \ think you're alone: DocBook wasn't created with user-friendliness in. The concepts\
    \ behind DocBook aren't impossible to get a handle on, but it might help to take\
    \ a breather occasionally and absorb what you've covered.\n\nDocBook markup is\
    \ literally another language, admittedly a limited one based on English but still\
    \ a foreign tongue. Everyone knows that it takes patience and time to pick up\
    \ a foreign language; the same goes for DocBook. The downside to DocBook, compared\
    \ with real languages, is that there's nowhere you can go to immerse yourself\
    \ in the spoken language, and there's no native cuisine for DocBook either—unless\
    \ you count native geek foods such as pizza, Chinese takeout, and any caffeinated\
    \ beverage.\n\n![](img/81f56bf497dbf7f7582072400d12cb42_126_0.png)\n\nNOTE\n\n\
    To use XRef to link to a section within your document, you do something like the\
    \ following:\n\n```\n<sect1 id=\"xref\">\n  <title>Using XRef</title>\n\n</sect1>\n\
    <xref linkend=\"xref\">\n```"
  merge: -1
  img_proc: true
- pgno: 127
  md: '# Chapter 5: Making Online Documents


    ![](img/81f56bf497dbf7f7582072400d12cb42_127_0.png)


    Figure 5.4 An XRef link


    The LinkEnd attribute value xref that is called by the XRef element will correspond
    to the ID attribute value xref when the document is parsed. If you are creating
    an HTML document, you will get output like that shown in Figure 5.4.


    Note that the XRef element is an empty element. If you were using the DocBook
    XML DTD, you would use this markup for the XRef element instead:


    ```

    <xref linkend="xref"/>

    ```


    The only difference in the markup is the closing / character. However, it will
    cause errors if the / character is missing.


    If you''re rendering your document in PostScript, RTP, or other print formats,
    your markup will look like that shown in Figure 5.5.


    # Using the Anchor Element


    Note that unlike a link in HTML, you do not have to supply the descriptive text
    for the link—the text is derived from the Title element instead. If you''re using
    the XRef element, you supply the descriptive text for the link with the XRefLabel
    attribute.'
