- pgno: 243
  md: '# Chapter 11: XML Schema and DocBook XML


    In this chapter you will look at XML Schema. An XML Schema takes the

    place of the Document Type Definition, or DTD. Although they are sim-

    ilar, XML Schemas and SGML DTDs have a few important differences

    you should understand.


    Please note that the XML Schema Recommendation and DocBook

    XML Schema are not final, so some specifications might change. However, I

    wanted to include the most up-to-date information in this book—not an easy

    task when writing about technologies that change so quickly. I also consid-

    erit it important to include a chapter on Schema, finished or not, it

    is already in use. Be sure to visit the World Wide Web Consortiums Web site

    for updates and the latest version of the XML Schema Candidate Recom-

    mendment. As XML Schema matures, more and more information will

    come available, and probably a book or two.


    It''s possible to write an entire book on XML Schema, but this chapter gives

    brief overview so that you will be armed with enough information to utilize

    t DocBook XML Schema when it is finalized. XML Schema is a complex

    specification, but because you are dealing with a very limited scope, this chap-

    ter shouldn''t be intimidating.


    Remember that XML was designed with the intention of sharing informa-

    tover the Web. Although SGML and the SGML DTDs can be adapted

    somewhat for that sort of task, they aren''t well suited to exchanging data over

    the Web. In particular, DTDs do not provide a rich set of data-requisite

    for exchanging information. Although DTDs are ideal for publishing and

    contain the necessary data types for that use, SGML was never designed for

    the type of transactions which XML is capable. Hence, XML Schema is

    being developed to take the place of the DTD for XML.


    # What Is an XML Schema?


    The simplest definition of the XML Schema specification is to say that the

    Schema defines a document. The XML Schema, like a DTD, provides the

    rules and structure (or grammar) for a document. It defines the elements and'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# How Does a Schema Differ from a DTD?


    attributes that may be used in a document. The document Schema also specifies
    the data types of elements and attributes with great specificity, something DTD
    does not do.


    # How Does a Schema Differ from a DTD?


    You might remember from earlier chapters, the DTD defines the markup language
    used in a document and is also used by a parser to validate the document. The
    DTD is, essentially, the grammar or rules that define the structure of documents.
    The DocBook DTD, for example, determines which elements and attributes are valid
    in DocBook and how they may be used.


    For instance, the Book element may be contained within a Set element but not within
    a Sec element. That''s defined within the DocBook DTD.


    However, not defined within the DocBook DTD is the number of characters that may
    be used for the Title element and whether the type of data used for the Title
    element has to be a string, an integer, or other possible data types. These limit
    your ability to use XML with programming languages or databases.


    Another thing not specified in a DTD, but of great use to programmers, is the
    number of occurrences an element may have. For instance, there is no limit on
    the number of occurrences of the InvPart element within the ObjectInfo element
    in the DocBook DTD. There''s no way to specify a certain number of minimum or
    maximum times for that element to appear, so you could have a document that has
    an ObjectInfo element but no InvPartNumber. If you wanted, you could also have
    20 of them without being in error.


    Obviously, there''s a very good reason for someone who is importing XML data with
    part numbers to want one part number for every object, and no more than one part
    number for every object. Therefore, XML Schema allows that kind of fine-grained
    control.


    # XML Schema Data Types


    A plethora of data types are available when you use XML Schema. The XML Schema
    specification has a rich set of built-in data types that are predefined, as well
    as capable of combining data types to make custom data types out of the built-in
    data types.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# Chapter 11: XML Schema and DocBook XML


    You will look at some built-in data types and an example so that you can familiarize
    yourself with them. Note that because the DocBook XML Schema is already developed
    for you, you yourself don''t have to give DocBook elements or attributes data
    types. However, it''s useful to understand the data types so that if you create
    an application that makes use of the DocBook XML Schema, you can make use of these
    data types.


    I''m not going to go into great detail about each data type or its specifications.
    This is just an overview so that you can get a feel for the types of information
    with which XML Schema is designed to work. Also, remember that this is not a final
    specification; some data types might change between the time this is written and
    the time XML Schema is finalized. For the latest information, visit the W3C''s
    XML Schema home page (shown in Figure 11.1).


    # Text


    The most familiar use of XML (and DocBook) is to create documentation, so, of
    course, there has to be a set of data types that handle text.


    ![](img/81f56bf497dbf7f7582072400d12cb42_245_0.png)


    Figure 11.1 The XML Schema home page'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# How Does a Schema Differ from a DTD?


    Three main data types for holding text are built in to XML Schema:


    +   - string

    - CDATA

    - token


    If you''re familiar with programming, you know that a string is a group of alphanumeric
    characters. The CDATA data type is already familiar because even the DTD supports
    that data type. The token data type handles character data but is more restrictive
    than the string and CDATA data types. A token cannot hold two or more spaces in
    a row, or carriage feeds or tab characters.


    > Without getting bogged down in details, it might be of interest to note that
    the token data type is derived from the CDATA data type, but it is defined by
    its restrictions. In other words, the token data type is a subset of the CDATA
    data type. Many of the built-in Schema data types are derived from other data
    types but are more restrictive about what they may contain. The original data
    type is known as a primitive data type.


    ![](img/81f56bf497dbf7f7582072400d12cb42_246_0.png)


    NOTE


    # Numeric Data Types


    The Schema specification allows for a number of numeric data types:


    +   - decimal

    - float

    - double

    - binary

    - integer

    - nonPositiveInteger

    - negativeInteger

    - long

    - int

    - short

    - byte

    - unsignedbyte

    - unsignedInt

    - unsignedLong

    - unsignedShort'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'As you can see, that''s a rich array of numeric data types. If you''re familiar
    with programming languages, data types such as double, float, and int familiar
    to you, no doubt. The need for these data types in DocBook is not great, but the
    need for them in XML Schema. Many programmers want to be able to exchange data
    over the Web that can then be imported into programs that have to know exactly
    what type of data they are working with.


    # Time


    The XML Schema specification also contains a rich variety of data types for working
    with time. Again, this might be overkill for writing a technical paper with DocBook
    but can prove to be valuable if your company or organization decides to standardize
    on DocBook for data exchange. It may be possible to extend the DocBook specification
    to use it for exchange of data beyond just papers and books. See Chapter 12, “Using
    DocBook for Inventory Control,” for an example of using DocBook in an ordering
    system.


    Here''s a list of the time data types:


    +   * time

    * timePeriod

    * timeInstant

    * date

    * month

    * year

    * century

    * recurringDay

    * recurringDate


    The time data types allow anything as nonspecific as expressing the year or even
    the century to the ultra-specific, as as in the case of the time data type that
    is down to the second.


    # Language


    The XML Schema data types also include the language data type, which allows for
    the language data types as defined by RFC 1766. (See Appendix C. “More DocBook
    Resources,” for more information on looking up RFCs.)'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# How Does a Schema Differ from a DTD?


    <para>

    <alink url="http://www.w3.org/"><cite>World Wide Web Consortium</cite></alink>.
    This is an example of a URI in a document. The URL attribute of the Ulink element
    contains a valid URI.

    </para>


    ![](img/81f56bf497dbf7f7582072400d12cb42_248_0.png)


    Figure 11.2 An example of a URI in a document


    # Reference


    Another important data type that doesn''t quite fit in the string or CDATA data
    types is the URL. If you recall, URIs are the Uniform Resource Identifiers. These
    are very important to DocBook and XML. The XML Schema specification allows for
    a URIReference type, which can contain a URI or URL. Figure 11.2 shows a URI in
    a document.


    There are a number of other data types, too numerous to discuss here. However,
    you must understand that data typing is very important to XML Schema. When the
    XML DocBook Schema becomes more commonly used, it will be necessary to understand
    which data types you can use with each element.


    # Elements and Attributes


    Elements and attributes behave mostly as they do with a DTD. You use elements
    to define the data contained within them and attributes to further define the
    element.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# Chapter 11: XML Schema and DocBook


    However, in XML Schema some elements are not allowed to contain attributes. Elements
    that have a simple data type (such as the decimal data type) are, by definition,
    not supposed to contain attributes.


    This is different from the DTD and from what you might be used to already with
    DocBook. All elements in DocBook may contain attributes.


    # Defining an Element


    How do you know which an element can contain? It''s within the Schema specification
    for the element. Take a quick look at reading the element definition from an imaginary
    Schema that defines a simple element.


    You will specify a simple element first, and then you will specify a few more
    complex elements to get the full picture. The first element is the Para element
    containing any data that can be in a paragraph.


    ```

    <xsd:schema xmlns:xsd="http://www.w3.org/2000/08/XMLSchema">

    <xsd:annotation>

    <xsd:documentation>

    This is a sample documentation

    </xsd:documentation>

    </xsd:annotation>

    <xsd:element name="para" type="CDATA"/>

    </xsd:schema>

    ```


    The first thing you might have noticed is the format—each part of the Schema declaration
    begins with <xsd:, which stands for Schema declaration.


    Another thing you might have noticed is the annotation and documentation elements.
    XML Schema allows for documentation of itself as it goes along. This means that
    when writing a Schema, the author of the Schema can add documentation explaining
    the elements that are defined as they are included. This is exciting because it
    allows for self-generating documentation. Simply run the Schema through a parser
    with the proper stylesheet, and it can generate its own documentation. Nifty,
    isn''t it?


    Finally, the element declaration itself is simple. The <xsd:element markup lets
    you know that you are declaring an element. The Name attribute tells you the name
    the element will have, and the Type attribute defines the type of data the element
    can have. Because you want to allow just about anything in the Paragraph element,
    you specify the CDATA data type, covered earlier in the chapter. **'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'Now for a slightly complex set of elements. This example defines an element
    containing two other elements. Note that the top-level element itself contains
    only other elements, not data.


    ```

    <xsd:schema xmlns:xsd="http://www.w3.org/2001/08/xml-schema">

    <xsd:annotation>

    <xsd:documentation>

    This is a sample Schema for more complex elements.

    </xsd:documentation>

    </xsd:annotation>

    <xsd:complexType name="ComplexElement">

    <xsd:sequence>

    <xsd:element name="SimpleElement1" type="xsd:string"/>

    <xsd:element name="SimpleElement2" type="xsd:decimal"/>

    </xsd:sequence>

    </xsd:complexType>

    <!-- This is a comment -->

    </xsd:schema>

    ```


    As you look at this example, you will notice that the format is basically the
    same. However, the ComplexType element contains an xsd:sequence that defines the
    sequence of elements contained within the Complex element. If you see a MinOccurs
    or MaxOccurs attribute, you know that the elements must occur within the Complex
    element a specific number of times or the document will not be valid within the
    Schema.


    Note that even within the XML Schema documents, HTML-style comments are valid.


    The purpose of this section is not to get started on writing your own Schema.
    Norman Walsh and the DocBook Technical Committee will be doing that. However,
    you might have to read an XML Schema to make use of the DocBook XML Schema as
    it enters widespread usage.


    # The DocBook XML Schema


    The DocBook XML Schema is not yet final and isn''t ready for production use at
    the time of this writing. Furthermore, none of the tools that you used to process
    DocBook are geared to utilize the Schema for DocBook.


    The first (alpha) release of the DocBook XML Schema was announced on November
    8, 2000, to the DocBook mailing list. Not much documentation'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# Chapter 11: XML Schema and DocBook XML


    exists yet for the DocBook Schema, nor are there any tools for working with the
    Schema. However, it''s valuable to follow the development and be ready for using
    the Schema when it arrives.


    You can find the latest versions of the DocBook Schema on the Sun Web site, at
    least for now. The URL is http://www.sun.com/xml/developers/docbook/ (see Figure
    11.3).


    # Validating the XML Schema


    If you''re trying your hand at creating DocBook documents that conform to the
    XML Schema, not many tools are available at this time to validate the Schema or
    your efforts at making a valid document. However, there is an online resource
    for checking your documents, provided that your Schema is available online. The
    World Wide Consortium offers this resource at http://www.w3.org/2000/06/webdata/xsv
    (see Figure 11.4).


    ![](img/81f56bf497dbf7f7582072400d12cb42_251_0.png)


    Figure 11.3 The DocBook XML Schema home page'
  merge: -1
  img_proc: true
- pgno: 252
  md: '![](img/81f56bf497dbf7f7582072400d12cb42_252_0.png)


    # ## 11.4 The XSV validator


    # # Summary


    In this chapter you''ve looked at the XML Schema specification and how it relates
    to DocBook XML. Although Schema is still in its developmental stage, the larval
    stage of a specification, it is likely to become a very important technology as
    XML picks up steam and is used in more and more applications.


    If you''re deploying DocBook XML solutions, or any XML solution for that matter,
    you will want to develop an understanding of Schema so that you can utilize the
    technology in the near future.


    The DocBook XML Schema, in particular, is not currently in practical use. There
    are no parsers or tools that work with the DocBook XML Schema, so for now you
    must stick with the DocBook XML DTD if you''re using XML. In the near future,
    however, it may be possible to switch to the XML Schema'
