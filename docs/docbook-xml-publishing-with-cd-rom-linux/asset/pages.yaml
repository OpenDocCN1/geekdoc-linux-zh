- pgno: 103
  md: '# Chapter 4: Preparing a Book with DocBook


    My personal rule of thumb is that if you can’t read all the way through in the
    time it takes you to listen to "Sgt. Pepper’s Lonely Heart’s Club Band," it’s
    too long. I’m referring to the Beatles’ classic album, not the horrible abomination
    wrought upon the world by the Bee Gees in the late 70s. Some things just never
    should have been done, and most of them occurred in the 70s.


    ![](img/81f56bf497dbf7f7582072400d12cb42_103_0.png)


    Here’s a sample Chapter declaration. The name of the sample chapter file will
    be chapter1.sgml, or chapter1.xml if you’re working with DocBook XML.


    ```

    <!DOCTYPE chapter SYSTEM "chapter1.sgml" PUBLIC "-//OASIS//DTD DocBook XML V3.1//EN">

    <chapter>


    </chapter>

    ```


    To declare an XML chapter, use the following declaration. Note that it is much
    the same as the SGML declaration but includes the XML statement first and has
    both a public and system identifier. If you’ve forgotten the difference between
    a public and system identifier, you might want to skim Chapter 1 again or check
    the glossary.


    ```

    <?xml version="1.0"?>

    <!DOCTYPE chapter PUBLIC "-//OASIS//DTD DocBook XML V4.1//EN"

    "file:///usr/share/xml/docbook/4.1/docbookx.dtd">

    <chapter>


    </chapter>

    ```


    A chapter element does not contain any text itself. Actual content is contained
    within Para elements, which are usually nested within one of the Sect1-5 elements
    (I’ll cover these shortly).


    # The ChapterInfo Element


    You might want to include some meta information about the chapter, such as who
    wrote it, keywords describing the content of the chapter, or maybe an abstract.
    The ChapterInfo element replaces the much overworked DocInfo element from DocBook
    version 3.x. If you’re converting an older document from DocBook 3.x to 4.x, you
    replace any instance of the DocInfo element describing a chapter with the ChapterInfo
    element.'
