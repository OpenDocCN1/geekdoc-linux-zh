- pgno: 41
  md: '# Chapter 2: Writing a Technical Article


    In Chapter 1, "Getting Started," I covered some basics of DocBook. Now I''ll take
    you step by step through the process of creating a technical article with DocBook.
    Although DocBook is used primarily for documentation, there''s no reason not to
    use it for any type of article, short story, college paper, or text. This chapter
    is your guide to creating your own article-type documents. With DocBook, you can
    create one master document that can be converted into a number of formats suitable
    for printing, online, or sharing electronically. One DocBook file can be converted
    into plain text, PDF, HTML, PostScript, DVI, or RTF.


    For the purposes of this chapter, do not concentrate on the type of editor used
    to create your DocBook document. Instead, I focus on the basics of writing a short
    article with DocBook. Because it would not be possible to demonstrate every tag
    you use in a document, I try to focus on the most comprehensive list of DocBook
    elements appears in Appendix B, "DocBook Element Reference."


    ![](img/81f56bf497dbf7f7582072400d12cb42_41_0.png)


    Now it''s time to start creating a DocBook article. I will assume that you are
    creating a stand-alone document without appendices, indexes, or other additional
    files. For more complex documents, we see Chapter 4, which covers larger projects.


    By firing up your favorite editor or word processor to create a new file. Differences
    between the SGML and XML DocBook standards are noted in the chapter as they occur.


    Remember that although you can create DocBook files in word processors, you must
    be sure to save the files as plain text. If you save a DocBook file in Microsoft
    Word format, you will end up with a file that cannot be properly parsed. It''s
    perfectly okay to use Microsoft Word to write the document if that''s what you''re
    comfortable with, but the file format has to be plain text. Editors such as vi,
    Emacs, or Windows Notepad save the files as plain text by default.


    ![](img/81f56bf497dbf7f7582072400d12cb42_41_1.png)'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Article Elements


    Articles aren''t much different from other types of DocBook documents, but some
    elements are specific to articles. Now might be a good time to point out that
    if you''re writing the article in SGML but plan on porting it to XML at some point
    in the future, you should keep all elements lowercase to maintain compatibility.


    # Declaring an Article


    Call the file Article.sgm (or Article.xml) if you''re going to use XML) and begin
    by declaring the document type:


    ```

    <DOCTYPE article PUBLIC "-//OASIS//DTD DocBook V4.0//EN">

    <article>

    </article>

    ```


    To declare an XML DocBook document, use


    ```

    <?xml version="1.0"?>

    <!DOCTYPE article PUBLIC "-//OASIS//DTD DocBook XML V4.0bet//EN">

    "http://www.oasis.org/docbook/xml/4.0/docbook.dtd">

    <article>

    </article>

    ```


    By declaring the document as an article, the parser knows what type of document
    it is working with. The declaration also states which version of the DocBook DTD
    is being used (see Figures 2.1 and 2.2). This is important because of the changes
    between each version of DocBook might cause problems if the parser doesn''t know
    what it''s dealing with. The <article> elements begin and end the article.


    Although DocBook elements might look similar to HTML tags, remember that DocBook
    parsers are much more demanding than your average Web browser. You can get away
    with not declaring an HTML document or even skipping some required tags, but DocBook
    is not quite forgiving. Be careful to include all required elements and use them
    in their proper order.


    ![](img/81f56bf497dbf7f7582072400d12cb42_42_0.png)'
  merge: -1
  img_proc: true
