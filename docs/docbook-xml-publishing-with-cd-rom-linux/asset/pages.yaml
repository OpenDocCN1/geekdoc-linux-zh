    Figure 10.2 A Jade error


    # DocBook Notations


    The dbnott.mod file contains the notations for DocBook. This includes references
    to most types of binary graphics files.


    # Customizing Stylesheets


    If you want to get a different look and feel out of DocBook, it isn''t necessary
    to change the DTD in any way. The look and feel of your output is determined by
    the stylesheet, not the DTD, as mentioned earlier.


    The nice thing about DocBook is that it allows separation of structure and content
    from display. In fact, DocBook makes it easier to display the same information
    in different ways without reformatting any of the document itself. Simply by switching
    the stylesheets, you can completely change the look or medium of the output. This
    is one area where DocBook has an advantage over GUI tools such as Microsoft Word.
    Although Word does a'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# Customizing the DocBook DTO


    multitude of nifty reformat, it isn''t possible to write a document in Word and
    have it completely reformat your document by the type of information contained
    in it. For instance, with DocBook, you can create a stylesheet that displays information
    contained only in the Author and Editor elements. Word would be stumpied by this
    request because it doesn''t distinguish the content in a document that way.


    > It''s my pet theory that all these years, Microsoft Word contains at least one
    feature no one has ever used and several features about the majority of folks
    working on Word have no idea.


    ![](img/81f56bf497dbf7f7582072400d12cb42_236_0.png)


    # Understanding DSSSL


    Okay, you''re probably looking at the acronym and thinking that it has to be really
    hard to rate an FLA (Five-Letter Acronym) instead of the standard TLA (Three-Letter
    Acronym). Don''t worry, the Document Style Semantics and Specification Language
    isn''t any worse than other technologies you''ve looked at. It just has a verbose
    title.


    DSSSL is a style language. It''s a derivative of the Scheme and Lisp programming
    languages, which is why it has so many parentheses.


    > An older programmer I used to know once that Lisp should actually stand for
    Lots of Insidiousous Parentheses. If you program in Lisp, you will find yourself
    touch-typing the parenthesis key, if nothing else.


    ![](img/81f56bf497dbf7f7582072400d12cb42_236_1.png)


    A full overview of DSSSL is well beyond the scope of this book. DSSSL is a very
    full-featured language. However, I will provide a few examples of customizing
    a stylesheet to get you started.


    # Making Changes to Existing Stylesheets


    Usually, it''s better to make changes to existing stylesheets than to try to write
    them from scratch. Remember, DocBook has more than 300 elements, and you don''t
    want to be writing a stylesheet from scratch to support more than 300 elements
    and their attributes.'
  merge: -1
  img_proc: true
- pgno: 237
  md: "# Chapter 18: Customizing DocBook\n\n# Other Stylesheets\n\nIn addition to\
    \ the stylesheets distributed with DocBook, several other stylesheets are freely\
    \ available. KDE, GNOME, Debian, FreeBSD, and a few other projects on the Web\
    \ have made customized DocBook stylesheets available. Although you might still\
    \ need to customize them further, especially if you're not writing about one those\
    \ projects, you might find that one of those organizations has a closer look and\
    \ feel than the default DocBook stylesheets. Looking over the code to their فريبي\
    \ will also make the concepts clearer than if you just look at the DocBook stylesheets.\n\
    \n# Writing a Local Stylesheet\n\nTo customize the DocBook stylesheets, you can\
    \ either modify the stylesheets as they are or create a localized driver file\
    \ that makes your modifications and relies on the unmodified DocBook default stylesheets\
    \ for the rest.\n\nWriting a local stylesheet is much more sensible because it\
    \ is more easily managed. Rather than wade through the stylesheets that are included,\
    \ you simply write an add-on that works with the stylesheets and is a much smaller\
    \ and more manageable file.\n\nTo start with, you want to have a document declaration,\
    \ just like a regular DocBook document. It should look something like this.\n\n\
    ```\n<DOCTYPE style-sheet PUBLIC \"-//Zonker's Stylish Sheet//EN\" [\n  <ENTITY\
    \ dbstyle PUBLIC \"-//Norman Walsh//DOCUMENT DocBook Print\nStylesheets//EN\"\
    \ CDATA DSSL>\n```\n\nNothing you haven't seen before, at least to some extent.\
    \ Instead of a DocBook element, you use a stylesheet for the declaration, and\
    \ you fill in your information for the Formal Public Identifier.\n\nThen you fill\
    \ in the document little with a modification to the DocBook stylesheets:\n\n```\n\
    <DOCTYPE style-sheet PUBLIC \"-//Zonker's Stylish Sheet//EN\" [\n  <ENTITY dbstyle\
    \ PUBLIC \"-//Norman Walsh//DOCUMENT DocBook Print\nStylesheets//EN\" CDATA DSSL>\n\
    \  <style-sheet>\n  <style-specification use=\"docbook\">\n  <style-specification-body>\n\
    ```"
