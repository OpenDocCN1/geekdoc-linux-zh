- pgno: 333
  md: '# Appendix B: DocBook Element Reference


    # Application


    The Application element indicates the name of an application in a document.

    The Application element uses common attributes.


    Example:

    <para><application>Jade</application>is a popular application for using DocBook.</para>


    # Arg


    The Arg element is used to mark up an argument to a command.

    The Arg element accepts the following attributes in addition to the common attributes:


    +   - Choice

    - Rep


    Example:

    <command>ls</command>

    <arg>-l</arg>

    <arg>-a</arg>


    # ClassSynopsis


    The ClassSynopsis element indicates information about a class in a programming
    language.

    The ClassSynopsis element accepts the following attributes in addition to the
    common attributes:


    +   - CmdLength

    - Label

    - SepChar


    Example:

    <classsynopsis language="perl">

    <classname>...</classname>

    <classsynopsisinfo>...</classsynopsisinfo>

    </classsynopsis>


    # CmdSynopsis


    The CmdSynopsis element provides information about the use of a command, including
    the command''s arguments and syntax.'
