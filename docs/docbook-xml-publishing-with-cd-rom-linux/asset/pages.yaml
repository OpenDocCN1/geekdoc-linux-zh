    If you''re using only one directory, it''s probably a good idea. If you have than
    one project going at a time, it''s probably just going to cause problems.


    The next bit is the command you''re actually running, import. This is telling
    that you''d like to import the files in the directory under the module name sample.
    This means that the checked in files will be in /mmn/cvsroot/sample/, the vendag
    for this module is Kara, and the release is A2. The -m flag is telling CVS to
    write New Example Files as the log for this import to the repository. If you leave
