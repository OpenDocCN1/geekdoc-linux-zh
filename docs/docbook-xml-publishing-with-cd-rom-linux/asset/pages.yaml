- pgno: 143
  md: '# Chapter 6: Parsing DocBook


    In addition to the XML DTD and stylesheets, there are also DTDs and examples on
    the site for EBNF, HTML forms, and MathML.


    > EBNF is an extension to the XML DocBook DTD used to create diagrams in the extended
    Backus-Naur form (EBNF). It is new to versions 4.1.2 and later of the XML DTD.


    If you do not require EBNF, HTML forms, or MathML, you may not need download those
    files unless you receive documents with that sort of markup in them.


    When you use the DocBook XML DTD, you must also have the XML ISO Entity sets,
    which are distributed separately on the DocBook site at http://www.docbook.org/xml/4.1.2/ent/
    (see Figure 6.2). The DocBook Technical Committee does not create or maintain
    the ISO Entity sets but provides them out of necessity.


    ![](img/81f56bf497dbf7f7582072400d12cb42_143_0.png)


    Figure 6.2 The DocBook XML DTD page'
