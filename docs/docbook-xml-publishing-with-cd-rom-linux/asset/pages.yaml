- pgno: 71
  md: '# Chapter 3: Using Images


    means an exhaustive list of available Open Source and Free Software programs.
    These are the tools I''ve found useful, and they cover the bases for working with
    images under Linux. Whether you''re making your own images, taking pictures with
    a digital camera, or scanning in existing images with a scanner, these four programs
    should have you covered. If you''re a graphics buff, you might want to visit Freshmeat
    (http://www.freshmeat.net/) and check out the wide selection of graphics programs
    available for Linux.


    You might have noticed that between Free Software and Open Source software in
    the preceding paragraphs. That''s because there is a difference, at least to the
    detail-oriented. Richard M. Stallman, head of the Free Software Foundation, objects
    to use the term Open Source referring to software licensed under the General Public
    License. Although GPL-led software does meet the definition of Open Source, not
    all Open Source is truly free. To avoid lumpsing free with non-free (by Stallman''s
    definition) software, he prefers the term Free Software, even if it gives the
    wrong impression to some people. Remember, the Free in Free Software is not about
    price; it''s freedom. Although these types of rhetorical discussions make some
    heads sway, they''re very important to others. If you''d like to learn more about
    Open Source and Free Software, visit the Free Software Foundation''s Web site
    at http://www.fsf.org/ and the Open Source Initiative''s site at http://www.opensource.org/


    ![](img/81f56bf497dbf7f7582072400d12cb42_71_0.png)


    # The GIMP


    The GIMP is one of the most popular free software tools around. GIMP stands for
    the GNU Image Manipulation Program, which is exactly what it is. It''s licensed
    under the GPL and available for most Linux and UNIX-type platforms. Also, ports
    are being developed for OS/2 and the Win32 platform.


    The GIMP started as an Adobe Photoshop clone, so if you''re familiar with Photoshop,
    it shouldn''t take long to get the hang of the GIMP. They''re not exactly alike;
    each has different features and tools, but if you''ve used Photoshop, switching
    to the GIMP will be easy. (The reverse is also true, suppose.) As an added bonus,
    the GIMP opens a huge number of file formats, including Paint Shop Pro and Photoshop
    files. If you''re collaborating with an artist using Photoshop or Paint Shop Pro,
    you might be able to swap images in the native PSD format.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'GIMP may not handle files saved with the very latest revision of Photoshop
    or Paint Shop Pro or any program with a proprietary image format. Generally, developers
    have to reverse-engineer the file formats, which takes time, and each new release
    of a commercial program usually brings new additions, extensions, or changes to
    the file format, which require further tweaking. Therefore, the version of the
    GIMP you''re using might not have been fully tweaked. Before you begin a huge
    project, run a few tests with a variety of features, colors, and layers of a similar
    size and color depth to the files you expect to create during production. This
    will save you enormous headaches down the road.


    ![](img/81f56bf497dbf7f7582072400d12cb42_72_0.png)


    If you''re using Linux, odds are that you have already installed The GIMP. If
    you open an xterm, type GIMP, and press Enter, you should see The GIMP starting
    up (see Figure 3.8). Note that you to type GIMP and not GIMP because Linux or
    any UNIX-type OS is case-sensitive.


    The GIMP can create EPS files, JPEGs, GIFs, PostScript files, and TIFFs, to a
    name of the file it can save. (More than likely, by the time you read this, it
    will read and save two or three more filetypes).


    ![](img/81f56bf497dbf7f7582072400d12cb42_72_1.png)


    Figure 3.8 The GIMP version 1.1.26'
  merge: -1
