- pgno: 211
  md: 'Vim, short for Vi Improved, is one of the most popular text editors for Linux-type
    and Free UNIX-type operating systems. Vim is a vi clone, but is not quite identical.
    Vim has added features that are not available in the original vi. This chapter
    will show you how to work with DocBook in Vim and covers some of the basics of
    Vim in case you haven''t used a vi-like editor before. It is not a comprehensive
    guide to the Vim text editor, but an overview to get you up and running with DocBook
    in Vim.


    Not only is vi a text editor, but it''s also capable of editing binary files—if
    that''s the sort of thing you''re into. Also, vi has the distinction of being
    a part of the POSIX 1003.2 specification for shell utilities. Most vi clones conform,
    more or less, to this standard.


    ![](img/81f56bf497dbf7f7582072400d12cb42_211_0.png)


    The original vi text editor was available on BSD, written by Bill Joy, and enjoyed
    unquestioned superiority until the scene in or around 1984 (very Orwellian). The
    original vi did not have anywhere near the enormous number of features that Vim
    and vi clones have. If you are a UNIX guru who has actually used another version
    of vi, you will find that Vim is mostly compatible with vi but includes many features.


    It also bears mentioning that the original vi is not actually available for Linux
    or most of the platforms Vim supports.


    Vim is not the only vi clone. There are a multitude of vi clones that approximate
    the functionality of the original vi, with additional functionality. However,
    Vim is probably the most popular vi clone, and the syntax-highlighting features
    of Vim make it ideal for editing DocBook documents. However, if you want to explore
    other vi clones, Appendix D, "More DocBook Resources," can point you towards a
    few other vi clones that you can try out.


    ![](img/81f56bf497dbf7f7582072400d12cb42_211_1.png)


    As a matter of fact, Vim is my preferred text editor. It took a little while to
    get used to, but Vim''s features make it ideal for writing prose or code. I should'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# Getting Vim


    be fair and mention Vim is not the only text editor with special features for
    working with DocBook. Emacs has the PSGML mode, which is ideally suited for working
    with DocBook. In fact, many people feel that Emacs and PSGML are the ideal combination
    for working with DocBook. It is also worth mentioning that Emacs has more features
    than Vim for working with DocBook. However, with the additional features come
    additional complexity, which may not be worth the effort if you have another editor
    that you''re already comfortable with. Chapter 8, “Using Emacs”, covers all the
    ins and outs of working with DocBook in Emacs.


    Some of the advanced features of Vim include


    +   - Color syntax highlighting


    +   - Multi level undo


    +   - Multiple windows. Edit two or more files in Vim at a time.


    +   - Online help


    +   - Word completion


    +   - Command-line-history


    +   - Advanced search and replace


    Another advantage of Vim is that it is available for just about every computing
    platform known to humankind. Vim runs on Linux, FreeBSD, OpenBSD, NetBSD, Windows
    NT and 9x, the Amiga, macOS, and BeOS, just to name a few. If you happen to use
    Linux at home and Windows at work, you can still enjoy the benefits of Vim in
    both environments.


    ![](img/81f56bf497dbf7f7582072400d12cb42_212_0.png)


    > I have actually tried this I don''t do any development work on Microsoft platforms,
    but apparently Vim can be integrated with Microsoft Developer Studio through OLE.
    For Windows developers who have developed *NIX operating systems in the past,
    this should be very useful.


    # Getting Vim


    If you don''t have Vim on your computer, you will have to visit the Vim home page
    to get the necessary files to run Vim. Most of you probably already have Vim installed
    on your system.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# Linux/UNIX


    Almost every Linux and *BSD distribution includes Vim in the standard installs.
    However, if you don''t have Vim, or you have a really outdated version of Vim,
    you can get a copy of the latest version from http://www.vim.org/download.html
    (see Figure 9.1).


    To find precompiled binaries of Vim, visit the Vim binaries page at http://www.vim.org/binaries.html.


    To compile Vim from source, you will need to download three files from one of
    the FTP sites. First are the standard source files that are used to compile a
    binary, next are the runtime files that are used by Vim, and the last is a collection
    of extra files that are used by Vim. So you will have


    +   * vim-x.xx-src.tar.gz Source

    * vim-x.xx-rt.tar.gz Runtime

    * vim-x.xx-extra.tar.gz Extra


    Where x.xx is the version number, be sure to download the latest version.


    ![](img/81f56bf497dbf7f7582072400d12cb42_213_0.png)


    Figure 9.1 The Vim download page'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'After you have all the necessary files, move them to the /tmp directory (or
    wherever you like to work with source files), and unzip and untar the files. Follow
    these steps:


    +   1. Execute the following command to become root:


    ```

    su -

    tar -xvvf vim-x.xx.src.tar.gz

    tar -xvvf vim-x.xx.tr.tar.gz

    tar -xvvf vim-x.xx.extra.tar.gz

    ```


    +   2. Then unzip and untar the files:


    +   3. After you have exploded the packages, you need to change directories to
    the new directory with the Vim source and other necessary files.


    ```

    cd vim-x.xx

    ```


    +   4. After you have entered the new directory, configure and “make” the source
    files.


    ```

    ./configure

    make

    make install

    ```


    > The above instructions should run on any Linux distribution, as well as just
    about any UNIX variant. However, I do not have access to all the various flavors
    of Linux, BSD, and UNIX to actually compiling Vim on. If you run into issues,
    be sure to check the Vim Web site for more information. Also, I''d appreciate
    an e-mail regarding your experiences on various other flavors of UNIX, to include
    in future versions of this book.


    ![](img/81f56bf497dbf7f7582072400d12cb42_214_0.png)


    After you''ve got Vim installed, simply type vim to start Vim.


    # Windows and DOS


    Vim also comes in Windows and MS-DOS versions. You can find Vim for Windows or
    MS-DOS on mirror sites in the /packages/vim/pc directory.


    To install Vim for Windows, you will need to grab the runtime files, as well as
    a precompiled binary for the appropriate system.'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'Unfortunately, Vim versions for Windows tend to lag behind the versions for
    UNIX and Linux systems. At the time of this writing, Vim 5.7 is available for
    Linux, and 5.4 is the latest available version for Windows/DOS. Likely, this is
    because the majority of Vim users are on the Linux- and UNIX- type systems.


    # # MacOS


    Vim users on the MacOS need only to grab the appropriate *.sit file for their
    Mac. Currently, there are PPC and 68K versions of Vim 5.6 available.


    You can find Vim for the MacOS at http://www.symatico.ca/dany.stamant/vim/ (see
    Figure 9.2).


    The Mac version of Vim is pretty much current, and it operates the same way as
    Vim on other platforms. Figure 9.3 shows Vim running on the MacOS. However, some
    of the functionality that Vim has on UNIX-type platforms


    ![](img/81f56bf497dbf7f7582072400d12cb42_215_0.png)


    Figure 9.2 The MacVim home page'
  merge: -1
