    ### 免受 MalDuino 侵害


    作为击键注入设备，`MalDuino` 属于更广泛的 USB 设备，被称为 `BadUSBs`。它们能够通过利用控制台输入作为与 PC 交互的受信任策略，来完成几种不当行为。然而，你可以采取哪些简单的行动来监控并防范
    `MalDuino`？你可以通过以下 3 种方法减轻或防止 `BadUSB` 攻击的危险：


    #### 锁定管理员权限

    无论你是否担心 `BadUSB` 攻击，执行此项操作都非常有价值。如果你需要对管理员级别进行更改，只需在 `Windows 10` 上对需要管理员权限的更改简要回答“是”或“否”。无论该人员是否是管理员，你都会发现给予他人这种程度的控制是错误且毫无意义的。在交宫殿钥匙之前，你可以通过存储库级更改进行修改，使操作系统要求你的管理员密码。


    #### Duckhunt

    此程序适用于 `Windows`。`GitHub` 上有一个小型应用程序可以作为一种次要防御措施运行。它会持续监控你按键录入的速度。当它识别出异常的输入速度时，它会阻止所有的
    `HID` 设备。然而，连接刚开始时的前几个字符几乎肯定可以穿透，这是它唯一的缺点。


    #### 物理保护

    这是一种通用的安排，不要让未经授权的设备连接到你的系统至关重要。你可以投入一些端口阻塞设备来从根本上阻止对 USB 端口的所有访问。你可能需要根据基础情况进一步查看。无论如何，在公共场所你可以利用它来防止任何攻击。


    ### 第 15 章：Kismet


    作为一种远程入侵检测系统，`kismet` 是一种无线场漫游工具、嗅探器、设备发现器和远程网络管理器。虽然 `kismet` 的功能取决于硬件设备（例如，作为特定捕获硬件的
    `RTLSDR`），它还可以与某些特定的特征无线电设备、`蓝牙` 接口和 `Wi-Fi` 接口配合。在 `WSL` 架构下，`kismet` 可以在 `Windows`
    上运行，但在 `OS X` 和 `Linux` 上运行良好。`Kismet` 支持 `蓝牙` 和 `Wi-Fi` 接口以及 `Linux` 上的其他硬件设备。隐含的
    `Wi-Fi` 接口使其能够在 `OS X` 上工作，并在 `Windows 10` 上处理远程信号。


    #### 使用 Kismet 监控 Wi-Fi 用户活动

    通过视线和定向 `Wi-Fi` 无线电线，可以识别穿过家中墙壁的 Wi-Fi 信号，即使它们经过加密。人们可以从这些数据中获取大量信息，例如附近的设备制造商、住者的动态以及他们当时使用的网络。对于固定目标，在特定情况下使用
    `kismet` 可以获得更详尽的数据。随后，它更擅长显示设备之间的长期连接，而不仅仅是寻找外面的通道。当我们使用 `kismet` 监控用户时，其魅力在于信号洞察策略，通过它传输的信号，我们想要了解那些看不见的东西。在这里，`Wi-Fi`
    是我们管理的对象，而某人拥有的设备、活动、关联设备和开关是我们试图看到的东西。这极大地激发了你的想象。


    如果你发现别人能看出你是在用电脑还是玩 `PlayStation`，以及你是否在家，你将倾向于关闭闲置设备的 `Wi-Fi` 并切换到有线网络。利用远程网络，他们使用
    `kismet` 静静地检查每个可用的 `Wi-Fi` 信道，将其放入屏幕模式以执行某些神奇操作。你可以看到自动化信号包，这些包是远程 `APs` 每秒通信几次的包。此外，还有尚未关联的测试包和从关联设备交换的数据包。`Kismet`
    可以可视化与特定网络设备的操作以及网络本身。


    #### 我们能从 Wi-Fi 中获得什么

    无论如何，我们如何应对这种情况？当你识别出一个需要监控的网络后，你可以进入调查其详细信息。你可能需要搜索细节，例如某人设备或硬件的网络连接或关联。你实际上会想知道某些设备的配置类型，以及特定标记对不同配置类型的识别。不仅是笔记本电脑和手机对你是透明的，你还会看到具有此类配置的关联设备或
    3D 打印机。


    目前，这类人的很大程度上依赖这些数据的可用性。对于一个需要通过搜索远程范围内所有家庭来寻找昂贵设备的罪犯来说，这非常有帮助。利用监听攻击，你可以定点一个或完全避开一个，因为
    `kismet` 可以识别远程监控摄像头。此外，当家里没人时，我们无疑可以推断出来，因为我们很容易看到客户设备何时使用数据、消失和出现。同样，通过利用 `Wi-Fi`
    信号信息，程序员可以在一个区域进行无线漫游来整合 `GPS` 信息。这样做，当程序员收集地图时，远程网络的每个地址对他们来说都是可能的。基本上，由于现在有
    `Google` 和 `Wigle Wifi` 规划的网络，此类信息可能存在。在某些地区，对于可疑远程活动的位置，人们也可以将其作为本地监控。


    #### 必备工具

    有几点需要遵循本指南。你需要 `kismet` 来运行 `Linux` 环境，而为了检查，你还需要一个与 `Kali` 兼容的远程网络。在这里，我们将研究最稳定的最新版本，尽管像
    `macOS` 的无线网卡也可以运行。如果你想让它在树莓派上运行，`kismet` 完全可以在 `Kali-Pi` 上像虚拟机一样工作。


