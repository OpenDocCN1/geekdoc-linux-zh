  trans: "\n\n*   通过向网站产生大量流量来关闭网站\n*   获取信用卡信息\n*   获取密码\n*   窃取秘密\n\n无论是通过扰乱旧有的事物还是为了自己的利益获取数据，黑客们一直在不停地忙碌。他们总会有关于他们的新闻传出，在某个时刻，你可能正在思考黑客到底在做什么。他们通过获取密码不断进入框架。对于他们来说，要破坏组织的安全性，第一步是发现秘密短语。因此，为了让任何人都难以破解你的秘密短语，经常更改它们非常有帮助。为了让你理解个人在检查他们时黑客在做什么，这里有一些你最可能听到的关键术语：\n\
    \n*   `Trojan horse`：这种方法给人一种有用程序的印象，客户会被诱骗点击并打开它。然而，此类客户的 PC 可能会受到无法预见的攻击，这些攻击可以在后台运行或不被察觉。由于这些攻击通过秘密技术潜入\
    \ PC（例如，伪装成真实的程序），因此很难被识别。无论如何，当`特洛木马`进入框架时，它可以打开次要通道和不同的功能，帮助黑客获取所需的数据。\n*  \
    \ `Session hijacking`：此过程包括黑客在通过网络连接进行的真实信息传输中嵌入恶意信息包。\n*   `Script kiddie`：这些是不成熟或年轻的黑客，他们利用黑客的工具同时伪装成真正的黑客。这些人通常不会花很多时间思考如何进行攻击。他们只需要完成攻击，但他们实际上并没有经常考虑与之相关的基础知识或他们需要使用的代码。在等条件下，他们将直接采用现有的某些工具和项目，并利用这些来处理问题。他们只需要完成黑客攻击并获得数据，而无需苦苦学习过程中的任何策略。\n\
    *   `Root kit`：入侵者可以利用这种工具组合在你的框架上伪装并扩大其对框架的权限。\n*   `Root access`：对于任何处理框架的黑客来说，`root\
    \ access` 是最高级别的权限。`root access` 是真正的黑客最渴望获得的 PC 框架权限。\n*   `Email worm`：黑客利用看起来普通的电子邮件向毫无防备的受害者发送小程序或加载了病毒的内容。\n\
    *   `Denial-of-service attack`：黑客利用这种技术用虚假流量淹没网站，从而阻止该实体的运行或破坏其处理正常流量的能力。这会降低特定组织的工作效率，并让合法用户难以通过任何方式进入框架。这让黑客有机会在那个组织上留下特洛木马、次要通道或其他其他东西。\n\
    \    *   `Distributed Denial of Service`：这种方式有些独特，因为它会使用多一台 PC 进行攻击。在 `DoS` 中，黑客只使用一台\
    \ PC，防火墙通常可以识别该 `IP address` 并停止允许来自该地址的帮助。在 `DDoS` 中，黑客使用多个 PC 执行该循环，这使得防火墙更难停止攻击。\n\
    *   `Buffer overflow`：黑客通过使应用程序支持过载来向框架发送恶意指令利用这种策略。\n*   `Back door`：黑客利用这条秘密通道获得\
    \ PC 框架的许可。欺骗、感染和各种恶意软件可以进入并利用此选项帮助他们进入框架，并根据意愿无限次返回和转发。如果你正尝试保护自己的 PC 或另一个框架，请确保在完全完成后修复一切，以确保没有留给黑客绕过的潜在次要通道。\n\
    \n## 防范黑客攻击\n\n黑客是一个持续影响国家及其居民安全的危险威胁。在个人层面，当黑客清空某人的全部合法资金储备时，可能会导致无法估量的经济损失。同样，在层级层面的信息窃取可能导致长远影响和巨大的经济损失。阻止并防御这种可怕的威胁是至关重要的。你可以做很多很多事情来确保保护自己的组织免受黑客的侵害。做好良好的设置并对你组织的运作方式保持警惕，对于将黑客挡在外非常重要。为了应对可能想要进入你组织的黑客，你可以采取的各种准备措施包括：\n\
    \n1.  对你使用的信息保持谨慎。我们在本手册中调查的大多数攻击都是通过电子邮件实施的。这并非总是如此。但是，如果你对打开的某些信息（特别是链接）保持警惕，你就可以避开许多此类黑客攻击。\n\
    2.  选择一些更难破解或通过暴力攻击攻破的强密码。选择长密码，使用字母、数字和符号的组合，并且不要与你相关或易于猜测的密码。许多黑客会从尝试攻击你的密码开始，因为这是安全性的一个薄弱环节。你可以通过一个强力密码来解决这个问题。\n\
    3.  进行渗透测试以寻找框架中的某些漏洞。我们稍后会研究如何进行渗透测试，但这是一种识别黑客可能尝试利用进入你组织的极佳方法。自己进行测试将有助于保持安全。\n\
    4.  经常更改密码。当你经常更改秘密短语时，黑客很难思考它是什么，或利用其他破解密码的策略来克服密码。\n5.  不要向任何其他人提供有关组织的信息。关于你组织的任何重要和敏感数据都应该保密并隐藏。考虑你组织的人越多，数据泄露的可能性就越大，黑客也会想要利用这些信息。\n\
    6.  考虑在你交易中发送给其他的数据进行加密。这使得任何没有正确密钥的人无法阅读你发送的任何数据，无论这些数据是否被截获。\n7.  选择一个强大的安全协议来确保你的组织安全。确保你不要使用\
    \ `WEP` 选项，因为这个选项更容易被黑客破解。虽然 `WPA` 和 `WPA2` 仍然是易受攻击的选择，但它们稳固得多，并可以在过程中保持你更安全。\n\
    8.  使用反恶意软件和防病毒程序。这将使得黑客试图发送你电脑的任何攻击更难通过。\n\n"
