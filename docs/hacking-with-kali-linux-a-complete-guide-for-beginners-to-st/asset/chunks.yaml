    - 桌面通知

    - 为了更快加载 Metasploit，有了原生的 Ruby `2.0`

    - 新的分类和菜单

    - 新的用户界面


    他们很好地优化了 Kali `2.0`，与之前的 Backtrack/Kali 版本相比；设计非常流畅。由于它的布局简洁且清晰，给人一种一切触手可及的感觉。为了配置你的
    Kali，你可以按照以下方法操作，我们将检查它的部分组件。


    ## 桌面概述

    再次，你所需的所有工作在工作区可用，那里感觉和看起来都很棒。


    ### Apache Web 服务器

    目前，他们似乎已经从 Kali `2.0` 中删除了 Apache Web 工作者的重启、启动和停止管理图标。事实上，如果你需要从终端命令行启动它们，可能需要使用下面的命令：


    - 重启——你可以使用 `/etc/init.d/apache2 restart` 或 `service apache2 restart`

    - 停止——你可以使用 `/etc/init.d/apache2 stop` 或 `service apache2 stop`

    - 启动——你可以使用 `/etc/init.d/apache2 start` 或 `service apache2 start`


    你会看到 Kali `1` 关于默认网站主页的变化，因为你现在可以运行 Kali 的 Web 服务器了。现在，在名为 `HTTP` 的文件夹中，根站点还有一层。在这种情况下，当你使用
    Apache 工作者时，你不再使用旧的注册 `/var/www/`，而是可以将你的网站文件夹或页面放入目录 `/var/www/HTML/` 中。


    ### 屏幕录制

    你现在可以使用屏幕录制了，因为 Kali `2.0` 中有一个内置的屏幕录制功能。你可以连续记录你的安全测试操作。


    ### 位置菜单

    在你的 Kali 内部，你可以在“位置”菜单找到不同区域的链接。


    ### 工作空间

    之前的 Backtrack/Linux 版本中也有工作空间。工作空间是你完全不知道工作空间时可以使用额外工作区域屏幕。对于你打开的每一个窗口，你可以使用“快捷键”获取它们的概览。如果你有触摸屏，还可以打开工作空间菜单。在工作空间之间，你有移动特定运行项目的能力。


    ### 自动最小化窗口

    有时，某些窗口会消失或自动限制，这是新 Kali `2.0` 的另一个新特性。在最喜欢的栏上，相关图标的一侧，当窗口被最小化时，你会看到一个白圈。点击一次终端图标将显示主终端窗口，点击两次则两个最小化的终端窗口都会恢复。同样，要查看最小化的窗口，你可以按下
