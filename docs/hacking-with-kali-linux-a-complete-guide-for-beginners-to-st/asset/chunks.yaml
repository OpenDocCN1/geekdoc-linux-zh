    # 防火墙类型


    尽管这两种形式都是合理的，你可以将防火墙作为设备或程序存在。通过端口应用程序和端口号，你可以在 PC 上通过建立产品防火墙程序来引导流量，同时你可以在通道和你的组织之间引入设备防火墙类型。最为人知的防火墙类型是包过滤防火墙（filtering
    firewalls），如果它们没有与设置的安全规则集协调，它们会在检查完数据包后阻止其通过。这些防火墙类型背后的动机是根据 IP 地址对数据包的目标和源进行拆分。如果数据包与防火墙上的“允许”规则匹配，则它被信任为进入组织。


    无状态和有状态是数据过滤防火墙的两种分类。对于程序员来说，显而易见的是无状态防火墙，因为它们需要通过独立于彼此的包检查来进行设置。然而，有状态防火墙通常会安全得多，因为它们会记住最近通过的数据包信息。虽然数据过滤防火墙最终只提供非常基本的保护且通常会非常乏力，但实际上它们可能是有效的。例如，对于它们来说，判断数据包来源应用程序的敌意影响是非常困难的。这样，如果防火墙允许了一个恶意请求，那么就没有机会让防火墙知道何时从一个误判的受信源删除数据集。那些准备好识别此类危险的是中级和尖端防火墙。


    ## SMLI，有状态多层检测防火墙


    当这些防火墙考虑受信数据包时，它们在应用层、传输层和网络层处理数据包。同样，如果它们独立通过该层，SMLI 只在分析完整个数据包后才允许其通过，这是下一代防火墙（NGFW）的常见特征。它们通过判断连接状态并查看数据包，确保所有启动的交互仅在受信源之间发生。


    ## NAT，网络地址转换防火墙


    这些防火墙在利用单一 IP 地址与网络交互时通过允许几个具有自主组织地址的设备来隐藏单一的 IP 地址。总的来说，它们提供了攻击提供了更强大的保护，因为攻击者在检查组织的
    IP 地址时无法获取具体的细节。这些防火墙建立在外部流量和一组带有中间防火墙的计算机之间，与 NAT 防火墙相似。


    ## 代理防火墙


    在应用级，这些防火墙将网络隔离开。它们被部署在两个终端系统之间，类似于基础防火墙。防火墙应该从客户处获取请求并使用一组安全策略进行评估，然后对其进行阻止或允许。基本上，像
    `FTP` 和 `HTTP` 这样的第 7 层协议被视为替代防火墙，为了识别恶意流量，它们同时使用深度数据包检查和有状态检查。


    ## NGFW，下一代防火墙


    这些防火墙将额外功能与传统防火墙的创新相结合，例如杀毒病毒、入侵防御系统、加密流量分析等。基本上，它集成了 `DPI`（深度数据包检测）的集成。深度数据包检测是在实际数据包内部检查信息，而查看数据包头部是基本防火墙只看的内容。通过这种机制，用户可以成功地阻止、分类和识别带有恶意信息的数据包。


    # 第 12 章：获取用户信息：Maltego、爬虫、Shodan/Censys.io


    Maltego 作为一个科学和开源应用程序，揭示了数据是如何相互关联的。某些数据类型之间的连接有助于识别模糊的关系，同时为他们的连接提供更好的全局视图。当你使用
    `maltego` 时，你会发现连接和个人之间的联系，例如共同好友、社交简介、网站和具有累积数据连接的组织。如果你计划收集有关任何基础设施的数据，你可能需要收集网络节点、`DNS`
    名称和区域之间的关联。


    ## Maltego 架构


    种子工人（Seed workers）通过 `HTTPS` 以 `XML` 格式从 `maltego` 客户端获取请求。然后，是 `TAS` 工在专家组织获取请求之前从种子工人获取请求。`maltego`
    客户端将获得请求的结果。为了更高的安全性，你可能需要考虑拥有自己的 `TAS` 工。目前，基础模块和专业模块是 `maltego` 的两种类型，模块的可用性是这两个工作者之间的两个主要区别。`CTAS`
    是基础工人拥有的，而在专业工人中，你会看到 `PTTAS`、`SQLTAS` 和 `CTAS`。


    在 `maltego` 内部，你可以使用 `PTTAS` 执行一些渗透测试相关的任务，包括标准抓取、端口扫描等。同样，通过 `SQLTAS` `TAS` 可以访问
    `SQL` 数据集。你也可以在使用该模块执行运行各种 `SQL` 查询后获取结果。`Postgress`、`Oracle`、`DB2`、`MSSQL` 和
    `MySQL` 是支持的类型。然后，可用的公开截断是业务 `TAS` 中包含的变化。


    ## 启动 Maltego


    对于任何人开始 `maltego`，你将进入应用程序并搜索 `backtrack`。从那里，你将获得数据收集并进入组织分析，在那里你将看到 `DNS` 调查。之后，你将进入
    `maltego`。如果你对它感兴趣，会被提示注册你的产品。如果你已经注册了账户，可能需要包含你的电子邮件地址和密钥。在你登录账户后，它将刷新更改。


    点击“检查”选项卡查看更改的结果，并从范围内；你可以选择你的理想选择。在范围内，你将看到两个重要的分类，即本地和框架。此外，不同的元素可以带入范围内，例如
    `Shodan` 元素。通过它们的标记，你可以通过像 `Shodan` 这样的网络爬虫发现特定的开关、端口、工人等。


