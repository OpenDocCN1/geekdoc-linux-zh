    # 第 19 章：使用 Tor、代理链和 VPN 进行安全和匿名操作


    在某些情况下，你可能想要接入网络并完成你需要的工作，而不会让其他人有机会追踪你在哪里。在网上保持安全和匿名是许多人在工作中关注的重点，而且某些情况下很难确保这一点。


    当你运行此帮助程序时，部分较大的信息（类似于 Google Ads 和其他选项）将不会通过并执行它们所需的流量分析，它们也不会通过并收集关于你在网上活动倾向的信息。这使得程序员追踪数据也变得更加困难。


    ## 什么是 Tor


    Tor 网络的有趣之处在于它将通过遍布全球的成千上万志愿者。当进入此组织时，你使用的信息将被成加密的数据包。此时，与我们传统的网络连接完全不同， Tor 将准备好移除头部的一部分，这对于帮助我们了解发送者的数据至关重要，例如最初发送此消息的操作系统。


    最后， Tor 将准备好加密我们用于封装的剩余数据。这是我们用于网络的标准连接不会使用的。此时，我们的数据包（经过加密和修改）将通过许多被称为“传输”（transfers）的志愿者，向最终目标移动。数据包在组织中的这种间接方式将使其更难追踪。每个传输部分将仅解密足够的覆盖层以识别信息来自哪只，以及它需要将包发送到哪个手。传输随后准备好用另一种覆盖封装并再次发送。虽然这种策略并非
    100% 准确，但它将使你的数据比我们看到的网络连接安全得多。


    ## 使用代理链（Proxy Chains）


    我们在这里使用的另一种确保我们的数据在途中免受伤害的方案是使用这些中间链。这将使程序员发现我们以及我们正在做什么变得困难得多。它将使用一个中间机器，其 IP
    地址将是留在另一个框架上的，而不是我们自己的。

