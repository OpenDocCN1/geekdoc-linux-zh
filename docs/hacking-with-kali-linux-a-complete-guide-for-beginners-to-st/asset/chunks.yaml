    - `社交媒体爬取`：通过网络抓取从 `Twitter` 等基于网络的媒体网站收集信息，以发现最新动态。

    - `收集电子邮件地址`：一些协会利用网络抓取来收集电子邮件地址，并在收集后通过电子邮件广告发送大量信息。

    - `价格比较`：为了研究物品价格，`ParseHub` 等管理工具利用网络抓取从在线购物网站获取数据。


    从网站中提取海量数据是一个“网络抓取”的过程。网站上的信息是无序的，为了使其具有组织化的结构，需要通过网络抓取收集这些非结构化信息来完成工作。编写代码、使用
    `APIs` 和在线管理工具是抓取网站的各种方法。某些网站允许网络抓取，而另一些网站如果我们需要合法操作，则是不允许的。你可能需要查看网站的 `robots.txt`
    文件，以确定该网站是否允许网络抓取。


    ## Shodan 和 Censys


    我们正生活在物联网时代。从道路监控摄像头、交通信号管理框架到家庭 WiFi 关，与互联网关联的事物无处不在我们的生活中。此外，由于它们拥有连接，我们可以在网上和现实世界中发现它们中的每一个。在
    `Google` 帮助你在网上寻找所需信息的同时，你也可以通过一些常用的网络爬虫追踪这些关联设备。我们不邀请 `Shodan` 和 `Censys` 呢！


    由于物联网已经存在了 7 年，物联网领域的首席（也是主要的网络爬虫）是 `shodan`。这个名字的灵感来自一个极其强大的人工智能，名为 `Shodan`，它是
    PC 游戏系列《系统冲击》中的反派。尽管它有破坏伤害的能力，但 `shodan` 实际上并不那么无敌。尽管如此，在我们继续那些糟糕的消息之前，你需要了解网络索引是如何工作的。


    `Shodan` 通常就像一个在整个区域漫步时敲击他看到的每一个门的人。不过，他面对的是整个世界而不是某个城市，也不是敲击每一个 `IPv4` 地址。如果你获得关于某个特定区域或特定类型门的信息，这个人就会拥有一些数据并将其提供给你。他会告诉你门的数量、响应这些门的人以及他们的特征。此外，关于这些物联网，你可以从
    `shodan` 获取它们的数据，包括是否存在你可以使用的 Web 接口、其类型以及名称。虽然通常非常简单，但你应该相信使用 `shodan`，因为它并不是完全免费的。


    此外由于某些门没有锁，你可能会发现敲击某些门并没有什么特别奇怪的。此外，对于捣破坏者来说，闯入可能对任何人来说都是可行的。一些使用默认密码和登录的框架，包括
    `IP cameras` 和未受保护的开关，是物联网领域中这些门的典型。当你弄清楚了如何在进入它们的 Web 接口后进行排序时，你会发现自己获得了密钥和登录的完全访问权限。此外，由于你可以轻松地在制造商网站上找到这些关于密码和登录的默认数据，这一切现在不再是什么高深科学了。此外，如果有
    `IP camera` 的帮助，只要它是 `IP camera`，你就可以处理甚至看到一切。此外，如果是一个开关，你还可以修改设置。如果是婴儿监视器，你甚至可以使用报警语音与脆弱的孩子交谈。这一切取决于你的道德准则。


    ## 第 13 章：在 Raspberry Pi 等便携设备上运行 Kali Linux


    然而，测试组织、模拟记录或破解 WiFi 密码通常是非常有趣的。无论如何，如果你把表演带出去，你可能需要一个有效的便携设备。因此，`Raspberry Pi`
    和 `Kali Linux` 诞生了。他们将 `Kali Linux` 设计为用于网络渗透测试的工作框架。为了让你测试蓝牙漏洞、模拟组织、破解 WiFi 密码以及许多其他内容，你有机会在
    PC 上运行它。你需要意识到，如果你使用这些信息闯入加密网络，你可能会被指控犯下违法并因违反《计算机安全法》而被捕。你只需要使用这些信息来玩玩你控制的网络，为了你的学习，或者基本上将其用于正途。现在，由于我们已经广泛讨论了
    `Kali Linux`，为了不重复你之前阅读过的所有内容，我们的重点将放在如何构建我们的 `Raspberry Pi` 以及我们将使用的版本。因此，我们开始吧！


    要使用 `Raspberry Pi`，它们不需要太大的力量就可以将其作为信用卡大小的小电脑。你将拥有一个超紧凑的系统测试设备，结合 `Kali Linux`
    和 `Raspberry Pi`，你可以轻松地随带去任何地方。


    ### 必需物品


    - 为了进行初始设置，你需要一台 PC

    - 获取一个带有触摸板的小型、小型远程控制台，可以放入小包中

    - 如果你随身携带 `Raspberry Pi`，通常会非常有用。在这种情况下，一个壳是可以的，但可选

    - 一个新型号的触摸屏对于 `Raspberry Pi 2` 或更更新的版本是必要的；它不适合 8 GB 的 SD 卡

    - 一个 Wi-Fi 卡

    - 你会喜欢几个使用手机手机 USB 部分的外部 5V 电池。因此，你需要一组电池

    - Model 2 或 B/B+ 版本的 `Raspberry Pi`。虽然引入 `Raspberry Pi 2` 需要一些额外的步骤，但如果你不想经历那些步骤，可能需要使用
    Model B+。


    ### 第 1 步：在 Raspberry Pi 上安装 Kali


    对于 `Raspberry Pi`，下载并引入 `Kali Linux` 的触摸屏功能是你应该做的主要工作。为 `Raspberry Pi` 引入其他操作系统的设置过程非常常规。这里有一个快速方法：


    #### 将 Kali 安装到 Windows SD 卡


    1. 对于你的设备，你应该下载 `Kali Linux Raspberry Pi`。你可以为 Raspberry Pi 2 获取 `Pi 2` 版本，为型号
    B/B++ 获取 `TFT` 版本。在里面，你将解压 `.img` 文件。你应该注意这里，因为对于 `Raspberry Pi`，如果你不使用触摸屏版本，你应该下载
    `Kali Linux` 的标准版本。

    2. 在下载 `Win32DiskImager` 后，你应该在内部解压出应用程序（`.exe`）。

