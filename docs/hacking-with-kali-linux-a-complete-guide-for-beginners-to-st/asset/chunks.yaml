    作为一个典型的工具，Nmap 既可以通过图形界面也可以通过命令行界面访问。此外，为了执行扫描，Nmap 使用了多种策略，其中包括 FTP 标志过滤、TCP
    回路 ident 检查、`TCP associate()` 检查等。


    ## nmap 的有效使用


    由于我们区分了开发过滤和基础、简单的扫描，目标机器的操作极度依赖于 Nmap 的使用。为了让我们通过绕过入侵防御/发现程序和防火墙获得正确的结果，需要使用高级策略。


    你将在下方看到一些基本命令的用法模型：在目标框架上，如果你计划扫描某个特定端口，例如，仅对目标 PC 上的 Telnet、FTP 和 HTTP 进行过滤，你将需要相关的边界来使用
    map 命令。同样，如果你想要扫描的 IP 范围包含在你拥有的某份记录文件中，你应该在命令行中调用该文件。另一种情况是，由于通常存在危险，如果你需要扫描整个子网，可能需要排除特定的
    IP 地址。因此，在使用 map 命令时使用排除边界。如果你想查看正在扫描的主机完整列表，应该在命令中添加 `-SL` 参数。


    ## 使用 Massscan 扫描大量主机


    长期以来，大规模扫描一直存在，渗透测试人员从地球的一端到另一端都在使用它。此外，masscan 作为扫描设备可以发送高达 100 万个数据包。Masscan
    使用自定义的 IP/TCP 栈，并通过多个集合和使用不同字符串的数据包进行并发传输。


    你可以利用 mass scan 快速识别大量主机。根据该工具作者的说法，基本上 mass scan 可以在 6 分钟内扫描整个互联网。此外，由于其传输速度快，他们也将
    mass scan 用于压力测试。任何人要达到这些高速率，都需要特殊的驱动程序，如 NIC 和 `PF_RING`。由于它的工作方式类似于 Nmap，这使其成为一个非常有用的工具。


    ### Massscan 特性


    * 自定义 IP/TCP 栈

    * 基础漏洞扫描，例如心血漏洞 Banner 抓取

    * Nmap 风格的目标选项和 Nmap 风格输出

    * 极速端口扫描：传输速度每秒高达 10M 数据包（需要 `PF_RING` 驱动程序和具备能力的 NIC）


    ### Masscan 的用途


    * 用于知识或兴趣性互联网枚举的随机扫描

    * 组织内多个子网的枚举

    * 大量主机的枚举

    * 用于网络制图，masscan 可以作为第一种探测工具


    ### Hping3 作为数据包生成器和网络扫描工具


    作为 Antirez 分发的 IP/TCP 协议免费分析器和数据包生成器，希望 是一种网络检查工具。对于网络安全，hping3 是一种分析器，对于网络和防火墙的安全测试和检查，它是真正的工具之一。他们还利用它滥用空闲过滤策略，该策略目前在
    Nmap 安全扫描器中已有其实现。作为 IP/TCP 数据包的分析器/构造代理，命令行在网络检查工具 hoping 中配置。然而，当 hoping 可以实现比发送
    ICMP 回显请求更多时，`ping(8)` Unix 命令提供了接口。它的特点包括在加密通道之间发送数据包的能力、拥有 traceroute 模式，以及对
    RAW-IP、ICMP、UDP 和 TCP 协议的支持。以前，他们仅将 hoping 作为网络检查工具。现在，少数小组在某些习惯中使用它测试主机和网络。


    ### hping 网络扫描工具的一些用途


    * 网络扫描工具

    * 使用 Tk 界面，易于使用网络实用程序* 原型 IDS 系统

    * 仿真环境中的安全和网络研究

    * 复杂的 IP/TCP 行为

    * 概念漏洞证明

    * 自动化防火墙测试

    * 编写与 IP/TCP 安全和测试相关的实际应用程序

    * 学习 IP/TCP

    * 网络研究

    * 对已识别的 IP/TCP 栈漏洞进行利用测试 IDSes

    * 测试防火墙规则

    * 执行空闲扫描（在 nmap 中有易于实现的用户界面）

    * 使用标准实用程序网络扫描工具来探测/ping/traceroute 位于拦截尝试的防火墙后的主机

    * 学习 IP/TCP 的学生也可以通过 hping 获得足够的知识

    * 审计 IP/TCP 栈

    * 远程运行时间猜测

    * 远程操作系统指纹识别

    * 高级 traceroute，支持所有支持的协议手动路径 MTU 发现

    * 使用分片、TOS 和其他协议进行网络测试

    * 高级端口扫描

    * 防火墙测试'
