    # 使用 Wireshark 保护网络安全与监控


    对于组织安全专家来说，工具箱中最不可思议的资产可能过于被称为 `Wireshark` 的工具，个人也曾称其为 `Ethereal`。通过多个层级，从包括单个数据包到会话数据，`Wireshark`
    可以作为一个组织级数据包分析器，在查看组织内部流量时检查流量的细微之处。`Wireshark` 可以调查设备组织中的安全问题，并通过其深度和灵活性审查来剖析安全事件。由于它是免费的，`Wireshark`
    的性价比更是不可比拟！


    ## 安装 Wireshark


    安装 Wireshark 就像 ABC 一样简单。对于 Mac OS X 或 Windows，你可以下载二进制版本。同样，对于大多数类型的 Unix/Linux，可以通过标准的程序分发框架获取
    `Wireshark`。此外，在其他操作系统上，可以获取源代码进行编译。


    对于 Windows 版本，创建 `Wireshark` 的小组是基于 `WinPcap` 数据包捕获库构建的。此外，如果你在 Windows 环境中没有有效安装
    `WinPcap` 且正在使用 Windows，你可能需要安装它才能运行。这里有一个提示：在运行 `Wireshark` 安装程序之前，你可以利用控制面板中的“添加/删除程序”通过手动操作删除旧版本的
    `WinPcap`。


    安装过程与基于向导的分组非常相似，使用两个主要提示：启动时，它会询问你是否准备启动 `WinPcap` 网络数据包过滤器 `NPF` 管理，以及你是否需要安装
    `WinPcap`。为了捕获数据包，你可以选择上一个选项，即使你没有管理员权限也将允许。只有当你启用了这项功能时，你才会真正想要运行 `Wireshark`。


