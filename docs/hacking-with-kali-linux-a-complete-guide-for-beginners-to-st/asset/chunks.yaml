    7. 当你点击“compose”（制作）按钮后，只需静候 `Win32DiskImager` 就会完成神奇的操作。等完成后安全弹出 SD 卡后，你就可以将其插入到树莓派中了。


    ## 在 OS X SD 卡上安装 Kali


    1. 为了在你的设备上运行它，你最初需要下载好 `Kali Linux Raspberry Pi` 镜像。对于 `Raspberry Pi 2` 请选择 `Pi
    2` 版本，对于 `B/B++` 型号请选择 `TFT` 版本。无论你使用的是哪种显示器，下载适用于 `Raspberry Pi` 的标准版 `Kali Linux`
    都是基础的。


    2. 对于你引入的 `OS X` 版本，在下载完 `RPi-sd card manufacturer` 并打开程序后，请选择相应的适配。


    3. 使用读卡器将你的 SD 卡插入 `Mac` 中。


    4. 随后，你可以打开 `RPi-sd card developer`。此时会弹出一个简短窗口让你选择 `Raspbian` 镜像。选择你之前下载的文件就是你需要选择的内容。


    5. 接着，另一个窗口会询问 SD 卡的挂载情况。由于你之前插入时它已经挂载，所以你只需点击“proceed”（继续）即可。此时会列出 SD 卡选项。如果你刚刚插入过一张，将通过检查且不会在列表中看到其他项。如果没有，请点击你需要使用的卡片。


    6. 然后，你将输入组织密码并按回车键。


    7. 如果 SD 卡发生弹出，你会看到另一个窗口。由于程序需要创建一个立即副本，它需要进行卸载；这很正常。如果在 `Finder` 中无法再访问 SD 卡，你应该双击它。这里有一个警告表达式：**永远不要**直接从
    USB 端口拔掉它。在你确定后，可以点击继续。


    8. `RPi-sd card manufacturer` 将完成 SD 卡的准备工作。安全弹出后，你就可以将其插入到 `Raspberry Pi` 设备中了。


    ## 第 2 ：显示器连接


    触摸屏与 `Raspberry Pi` 通用的输入/输出接口完美工作。你可以在理想状态了解它的工作原理，因为在角处就是 `Raspberry Pi` 的引脚布局。将其插入树莓派的显示接口中。


    ## 第 3 ：连接所有设备并启动


    在此阶段，你应该通过显示器连接所有设备。将你的 `Wi-Fi` 适配器连接到 USB 端口。从现在起，将 Pi 接入电池组。在这里，你可能会遇到一个复杂且缓慢的启动周期。如果需要一些时间，请不要慌。首先，在启动循环开始的一段时间内，你会看到一个白屏。最后，登录界面将欢迎你的到来。为了让屏幕工作，如果你使用的是
    `Raspberry Pi 2`，你可能需要进行某些类型的配置。如果你使用的是 `B+`，你可能只需要跳到下一步。对于当前的 `Raspberry Pi 2`，为了让屏幕运行可能需要一些必要的步骤。首次启动时，你会看到一个白色的启动屏幕。尽管如此，让屏幕工作并不困难。令人惊讶的是，Pi
    连接可能不需要 `HDMI` 屏幕，或者跳过这一部分，你可能需要 `SSH` 访问。此时，为了启动你的 Pi，只需同时连接这两项即可。


    ## 第 4 ：登录时启用 Wi-Fi


    为了使用 `Kali Linux` 内部的工具，你需要在登录时启用 `Wi-Fi` 卡。树莓派会自动识别你的 `Wi-Fi` 卡。无论如何，进入你的网络是至关重要的。随后
    `Kali Linux` 的 UI 应该会被加载。最后，在参与任何其他操作之前，你应该更改设备的密码。如果不这样做，你的设备可能会被具有黑客能力的人控制。


    ## 第 14 章：MalDuino


    `MalDuino` 作为一个由 `Arduino` 控制的 USB 设备，具有控制台注入的能力。通电时，`MalDuino` 将以超人的速度模拟控制台命令。`MalDuino`
    的潜力是无限，因为你可以调整工作区域背景或获取交互式 shell。此外，`MalDuino` 对于黑客、专家和渗透分析师来说非常好用。`MalDuino`
    旨在提供最好的 `BadUSB` 体验。此外，利用开源库，他们通过 `Arduino IDE` 对 `Malduino` 进行编程修改。你可以将 `DuckyScript`
    中编写的内容转换为 `Malduino` 能理解的代码。对于他们来说，编写它就像使用 `Arduino` 一样简单；这使得资深 `Arduino` 爱好者对其编程可行，同时也对新手友好。`MalDuino`
    有两个版本：`Lite` 和 `Elite`。


    ### Elite


    你可以从卡中选择想要运行的内容，因为这个版本有四个 `DIP switches` 和一个 `Micro-SD` 卡，而且它大得多。同样，你可以独立对 `Micro-SD`
    卡存储的按键注入内容进行编程，而无需每次都耗费固件。这一过程与 `Lite` 版本相反，后者在需要运行其他内容时需要刷写。你可以完全丢、重用或重建这些特性中的任何一个，因为它们是直接通过修改
    `Arduino` 得到的两个 `MalDuinos`。尽管你可能有几个引脚需要处理，但你也可以买一个并真的非常喜欢把它当作标准的 `Arduino` 使用。你会被邀请参加众筹活动，特别是考虑到它提供的机会。


    ### Lite


    `Lite` 版本包含一个离开 USB 连接器的切换器，这种形式非常小。你可以通过开关和 `LED` 显示处理完成的信号在编程模式和运行模式之间切换。由于其
    `32KB` 的本地内存对于大多数内容来说空间很大，`Lite` 可以存储内容。你可以使用内容转换器将内容转换为 `malduino compatible
    code`，因为你可以使用文本编辑器编写内容。随后，通过 `Arduino IDE` 你也可以传输内容。利用背部的开关，在拔掉 `MalDuino Lite`
    后，你可以将 `Lite` 切换到就绪模式。现在你可以开始使用它了！


    ## 硬件


    `Elite` 型的主体尺寸约为 `4.6 cm x 1.1 cm`（通常为 `1.8 in x 0.43 in`），你可以使用旧外壳它。对于 `Micro-SD`
    卡和 `DIP switches`，你可能需要为它们开几个孔。你可能会意识到它出带的固件可能是你在练习了一些 `RTFM`（阅读手册）并玩过开关后对引脚进行的某种
    QC 测试。取决于开关的开启情况，这些特性使 `MalDuino` 的输出变为 1 到 4。


    ## 设置


    在设置 `MalDuino` 时，你的 `Arduino IDE` 不仅应该已安装，而且是最新的。由于他们将 Elite 修改为运行在 `8 MHz` 和
    `3.3 V` 的 `Sparkfun Pro Micro`，你需要引入 `Sparkfun` 模块并打开开发板管理器。随后，在线的 `Malduino Script
    Converter` 是你的下一个重点，因为它有许多用途，例如：


    *   供你导入到 `IDE`，它会自动生成 `Arduino` 项目

    *   你可以自由选择键盘布局的语言

    *   在 `Elite` 和 `Lite` 版本之间，你可以通过它转换脚本

