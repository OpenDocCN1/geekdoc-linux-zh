    ## DoS、拒绝服务攻击和 DDoS 分布式拒绝服务攻击


    当框架的资源无法响应支持需求时，意味着拒绝服务攻击已经击垮了此类框架。然而，由于攻击者控制着他们在无数其他宿主机器上污染的恶意程序，`DDoS` 攻击同样是针对框架资源的进行的。攻击者不会通过拒绝服务来获取直接利润，这与他们为了增加或获取访问权限而创建的攻击完全不同。`DoS`
    攻击了攻击者的部分需求。尽管如此，如果被攻击的资源在业务竞争对手处有一个位置，对于攻击者来说可能有真正的优势。同样，为了让攻击者发动另一种攻击，他们通常会引发
    `DoS` 攻击以使框架断开。以下是一些不同类型的 `DDoS` 和 `DoS` 攻击：


    ### 尸肉网络


    为了让程序员执行 `DDoS` 攻击，他们利用 `botnets` 使用恶意软件操纵大量的框架。此外，为了对目标框架发动攻击，他们利用这些 `bots` 或僵尸框架。在大多数情况下，这些将超过目标框架的处理限制和数据传输能力。此外，由于
    `botnets` 的区域非常分散，追踪这些 `DDoS` 攻击可能非常困难。尸肉网络的管理可以通过以下方式实现：


    *   利用黑洞过滤。在进入安全网络之前，丢弃干扰流量。需要 `Border Gateway Protocol`（边界关协议）的主机向 `ISP` 交换机发布路由更新，以防识别
    `DDoS` 攻击。在后续跳转中，`null0` 接口将接收所有奔向工作者的流量。

    *   为了拒绝来自伪造地址的流量，利用 `RFC3704` 过滤，可以根据正确的源组织来跟踪该流量。例如，来自无效地址列表（bogon list）地址的数据包将被
    `RFC3704` 过滤丢弃。


    ### 死亡之 Ping（Ping of Death Attack）


    `Ping of death` 攻击利用超过 `65,535` 字节限制的 `IP` 大小通过 `IP` 包 ping 目标框架。攻击者会分割 `IP` 包，因为不允许这种大小的
    `IP` 包。，当目标框架重组数据包时，可能会导致不同的意外或支持洪水。当你使用防火墙时，你可以阻止 `ping of death` 攻击，因为分割过的 `IP`
    包将会被检查最大 own。


    ### 呆鱼攻击（Smurf Attack）


    攻击者通过这种攻击利用 `ICMP` 以及通过 `IP` 欺骗用流量淹没目标组织。攻击者专注于利用 `ICMP` 回显请求进行 `IP` 地址的传输。在这种情况下，这些
    `ICMP` 请求源于伪造受害的位置。例如，为了让攻击者通信地址 `10.255.255.255`，如果目标受害者地址是 `10.0.0.10`，攻击者将伪造一个来自
    `10.0.0.10` 的 `ICMP` 回显请求。范围内的所有 `IP` 都会收到这个请求，这将导致组织瘫痪，因为每一个响应都返回到 `10.0.0.10`。这种策略不仅可以产生大量的网络阻塞，还可以被自动化，因为它是很可能重复的。你可能需要在交换机上禁用
    `IP` 协调传输以保护你的设备免受此类攻击。


    ### 泪滴攻击（Teardrop Attack）


    攻击者通过使连续的 `Internet Protocol` 数据包的字段重叠来利用这种策略。尽管这可能会失败，但在循环循环期间，被攻击的框架会尝试重组数据包。此时，框架最终会由于混乱而崩溃。你可能需要禁用端口
    `445` 和 `139` 并禁用 `SMBv2`，以在没有补丁的情况下防范这种攻击。


    ### TCP SYN 洪水攻击（TCP SYN Flood Attack）


    攻击者在 `TCP` 会话建立握手期间通过滥用空闲空间来利用这种攻击。目标框架的内存队列会被来自攻击者设备的连接请求淹没。任何情况下，当目标框架响应这些请求时，它并没有做出反应。由于一直在等待攻击者的响应，循环将导致目标框架崩溃。最后，当连接队列满时，它会导致框架变得不可用或崩溃。为了应对
    `TCP SYN flood` 攻击，这里有一些避免措施：


    *   在打开连接上，缩短超时时间并增加连接队列的大小。

