    通过这种方式，当你确认分区中的更改后，安装程序将完成文件系统的安装交互。由于这个过程可能需要几分钟，安装将自动完成。如果你想获取未来的更新和程序，框架会在引入基本文件后询问组织镜像的设置。如果你需要使用
    Kali 的存储库，请确保已启用了此功能。随后，将配置软件包管理员的连接文件。接下来的一个将是你将被提示引入 `GRUB` 引导加载程序。选择“是”，并且由于启动
    Kali 需要它，你将选择一个设备将引导加载程序的重要数据写入硬盘。当向磁盘写写 `GRUB` 的安装完成后，点击“继续”按钮完成安装。此时，将引入最后阶段的显式文件。此时，请为自己感到高兴，因为你的探索
    Kali Linux 之之旅刚刚开始，由于你已经成功引入了 Kali。


