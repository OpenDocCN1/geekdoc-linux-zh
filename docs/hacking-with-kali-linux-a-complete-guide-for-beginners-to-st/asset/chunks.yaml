    此外，由于在动态攻击之前进行潜伏侦听需要攻击者获取有关部署良好单元的信息，因此与发现动态单元相比，识别无关的侦听攻击更为根本。为了防止被窃听，最好的防范措施是信息加密。


    ### XSS，跨站脚本攻击

    对于在用户的互联网浏览器中运行可脚本应用程序或内容的情况，`XSS` 攻击利用的是外部网络资产。基本上，攻击者将通过向网站的信息库中注入有效负载来利用恶意的
    `JavaScript`。通过将攻击者的有效负载作为 `HTML` 主体的一部分，当受害者从网站请求页面时，网站会将页面通信给受害者的程序并执行恶意内容。例如，攻击者可以利用攻击者工作人员处理的令牌，在向受害者发送该令牌后移除它以进行会话劫持。当他们利用
    `XSS` 滥用更大的漏洞时，可能会导致最危险的结果。攻击者可以远程处理并访问受害者的机器，收集发现的网络数据、截取屏幕或记录击键，并通过这些漏洞获取令牌。由于网页上
    `JavaScript` 的应用广泛，它是最常被处理的；同时，在 `Flash`、`ActiveX` 和 `VBScript` 中，他们也可以利用 `XSS`。工程师可以在
    `HTTP` 请求返回给客户端之前对客户端信息进行消毒，以防止 `XSS` 攻击。此外，在向客户端返回任何内容之前，至关重要的是确保所有信息都已经过提取、过滤和验证，包括搜索过程中问题边界的估计。特殊字符如
    `>`、`<`、`/` 和 `?`、空格可以转换为各自的 URL 编码形式 `HTML`。客户端可以选择禁用客户端内容的选项。


    ### SQL 注入攻击

    对于由数据库驱动的网站，一个基本问题是 `SQL` 注入。当恶作者从客户端到服务器通过信息表单向数据库执行 `SQL` 查询时，就会发生交互。为了运行预定义的
    `SQL` 指令，将 `SQL` 命令嵌入信息表单输入中是可行的，例如密码或登录字段。通过有效的 `SQL` 注入，数据集中的敏感信息可能会被滥用。同样，它还可以向工作框架发布命令、恢复给定文档的内容、执行关闭数据库等组织活动，并调整（删除、更新或添加）数据集信息。例如，网站上的
    Web 结构可以引用客户端记录，然后使用动态 `SQL` 提取关联账户数据并发送到数据库。这种交互可能为任何攻击者留下漏洞，尽管对于正确输入登录号的客户端来说，这种操作是正常的。在面对此类网络安全防御攻击的漏洞时，信息平面和控制平面之间没有特殊区别。因此，如果网站使用动态
    `SQL`，`SQL` 注入大部分情况下有效。此外，由于成熟实用界面的常见，`SQL` 注入在 `ASP` 和 `PHP` 应用程序中非常普遍。此外，由于自动接口的可用性，更容易被有效滥用的
    `SQL` 注入是 `ASP.NET` 和 `J2EE`。在您的数据库中，应用最小权限模型来保护自己免受 `SQL` 注入攻击。在编写循环和定义的查询时，至重要的是不要包含任何高权限
    `SQL`。此外，为了防止注入攻击，您需要一个执行代码的健壮数据库。同样，在应用程序级别，根据白名单对输入信息进行验证是必要的。


    ### 密码攻击

    获取密码通常是成功率最高且简单的攻击方法，因为密码是验证客户端访问数据框架最常用的系统。通过内部和外部猜测、访问密码数据集、利用社交工程、通过嗅探与组织的连接获取解码后的密码，或检查个人的工作区域，攻击者可以获得个人的密码。然后，他们可以使用精确或不规则的方法来执行最后的策略。


    *   利用字典攻击，攻击尝试通过使用常用密码的字典引用来访问客户端的组织或电脑。攻击者可能会在对常用的密码引用应用了类似的加密后分析结果，因为他们复制了一份包含密码的混淆文档。

    *   攻击者可能认为在以不规则的方式处理各种密码后，一个密钥将会有效。这种循环被称为 `Brute-power`（暴力破解）。当攻击者利用个人的休闲活动、职位、工作、姓名和类似术语来确定与个人相关的密码时，这种交互对他们来说通常是智能的。

