    # 第 9 章：如何组织 Kali Linux


    Kali `2.0` 在 Offensive Security 经过十年的开发后发布。此外，在所有的 Kali/Backtrack 版本中，最简单用的是 Kali
    `2.0`。如果你习惯于第一个 Kali，那么新的 Kali 有一些新特性。尽管如此，没有比这更好的了！他们完全简化并重新设计了菜单，并支持图标，处理了大量工具。以下是关于
    Kali `2.0`的一些新事物：


