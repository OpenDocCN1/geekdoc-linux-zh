    # 安装过程


    ## 第一步：安装 VMware

    首先，某种虚拟化程序对于运行 Kali Linux 是基础的。对于某些个人来说，他们更倾向于使用 `VMware`，尽管他们也可以使用 Oracle 的 `VirtualBox`
    作为可选方案之一。安装完成后，从应用程序管理器中启动 `VMware`。


    ## 第二步：下载 Kali Linux 和镜像完整性检查

    当你访问官方下载页面下载 Kali Linux 时，可以选择最适合你需求的版本。此外，下载页面上有一些十六进制数字，它们并不重要。此外，由于 Kali Linux
    的设计目的是用于安全相关的任务，因此对下载的镜像进行完整性检查是非常必要的。应该检查该文件的 `SHA-256` 标记，并与下载网站上显示的标记进行比对。


    ## 第三步：启动新虚拟机

    当你进入 `VMware Workstation Pro` 的落地页时，你将点击“创建新的虚拟机”按钮。在配置虚拟机详细信息之前，你可能已经在选择 Kali
    Linux 的 `iso` 文件后选择了宿主机操作系统。选择 Kali Linux VM 来启动虚拟机，然后点击带有“开启电源”字样的绿色按钮。你会看到机器正在启动！


    ## 安装过程

    在机器启动后，`GRUB` 菜单将简要提示选择你偏好的安装方法。在继续之前，选择“图形化安装”。你将被带到另一个页面，被要求选择控制台格式、国家地区以及你喜欢的语言。随后，在完成本地信息后，加载程序将根据引入的其他部分设计你组织的相关设置。此时，在安装过程中，安装程序会提示输入区域和主机名。在继续安装之前，你应该提供合适的环境信息。当你为
    Kali Linux 机器设置了密码后，即可点击继续。这里有一个重要的提示：确保你妥善保存你的密钥！在你设置好密码后，安装程序会提示你设置时间区域。


