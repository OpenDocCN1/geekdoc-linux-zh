    勒索软件、木马程序、间谍软件、蠕病毒和感染是攻击者用于控制组织或电脑的常规策略的一部分。为了收集秘密信息，他们利用 `Trojans` 和 `spyware`；而为了破坏或伪造框架或记录，他们使用
    `worms` 或感染。客户的所有数据会被 `ransomware` 加密，攻击者会等待机会这样做，并为了获得访问加密数据的权限，他们会要求支付费用。看似真实的下载可能包含恶意软件载荷，他们利用这一点和随机邮件连接来传播有害代码。


    无论规模大小，所有企业对网络保护都有合理的需求。最近，政府、金融、制造业和医疗行业是遭受网络攻击最频繁的行业。由于这些行业收集医疗和财务信息，其中一些领域对网络犯罪分子更有吸引力。无论如何，他们也可以关注所有利用网络进行客户攻击、企业机密活动和客户信息管理的组织。


    世界比以往更加依赖技术。因此，计算机信息生成呈爆炸式增长。今天，政府和组织利用计算机存储大量信息，并在不同组织之间将其发送到不同的计算机。设备及其隐藏系统中存在漏洞，一旦被滥用，就会破坏组织的运营和完整性。对于任何企业而言，数据泄露都可能是毁灭性的结果。由于缺乏合作伙伴和买家的信任，数据泄露可能会破坏组织的声誉。组织可能会因为缺乏关键信息（例如专利技术或源文件）而失去优势。此外，由于违反数据安全准则，数据泄露可能会影响企业收入。一次数据泄露给受影响企业带来的平均成本约为
    360 万美元。对于组织来说，实施良好的网络安全策略是非常重要的，而具有重大新闻价值的数据泄露事件随处可见。


    ## 网络安全的发展


    传统网络安全的重点是在特定的边界周围执行保护防护措施。`BYOD`（自带设备）和远程办公人员是新的赋能因素，这些因素扩大了攻击面，降低了数字活动的可感知性并打破了边界。今天，尽管安全支出达到了记录性水平，但攻击事件仍在快速增加。


    重点是针对全球组织的人为驱动在线安全。这是另一种方法，它不再关注数量不断增加威胁，而是关注客户行为的变化。在信息所在的地方，人为驱动的网络安全将安全控制扩展到每一个框架中，并对终端用户在任何情况下与信息的交互提供洞察，因为此时不再仅由组织负责。最终，为了减少风险识别和分析时间，并专注于和发现最真实的威胁，这种方法旨在识别行为异常。


    ## 保护终端用户


    究竟，网络安全为框架和客户提供了哪些安全措施？首先，为了加密记录、消息和其他关键信息，网络安全依赖于加密算法。这种程序不仅可以防止盗窃或意外丢失，还能保护传输过程中的数据。同样，终端用户会通过安全程序检查电脑是否存在恶意代码片段，隔离这些代码，然后将其从系统中删除。


    对于伪装在 `MBR`（主引导记录）中的恶意代码，其特定目的是擦除或加密电脑硬盘上的数据，安全项目在识别出它们后也可以消除它们。此外，电子安全协议还强调对持续进行持续检测。为了监控某些程序及其代码的行为，以防止每次执行都会改变形状的
    `Trojans` 和感染（即变态和多态恶意软件），他们使用了社会工程和启发式算法。从组织的角度来看，安全项目可以将潜在的恶意项目限制在虚拟沙箱中，以便更有可能识别新感染并分析其行为。此外，随着网络安全专家发现对抗新威胁的新方法，安全程序也在不断开发新的防护措施。


    ## 第 3 章：网络攻击类型


    利用几种策略来删除、修改或获取数据或信息框架，任何针对本地、计算机设备、基础设施或计算机数据系统的敌对活动都是网络攻击。在这里，这里是今天的一些基础网络攻击：


    ### 生日攻击


    生日攻击的创建是针对哈希计算的，人们利用这些计算来验证数字标记、程序或消息的完整性。准备好的哈希函数消息会创建一个固定长度的 `MD`（消息摘要），它与消息本身的长度无关。消息具有该
    `MD` 的特定属性。发现两个不同消息的概率是生日攻击的依据，当这两个消息被哈希函数处理时会产生相同的 `MD`。如果攻击者确定了与客户消息具有相同 `MD`
    的消息，就可以将客户的消息替换为自己的。此外，无论他们是否查看 `MD`，接收者都不会发现这种替换。


    ### 窃听攻击


    攻击者捕获组织的流量以进行窃听攻击。对于客户可能发送的某些秘密数据（例如信用卡号和密码），攻击者可以通过监听获取这些信息。窃听攻击者分为两种，分别是主动和被动：


    *   **主动窃听**：通过向发射器发送查询，攻击者伪装成合法的单元并有效地窃取数据。他们称这种交互为更改、过滤或测试。

    *   **被动窃听**：当攻击者监听组织中的消息传输时，他们将获取数据。

