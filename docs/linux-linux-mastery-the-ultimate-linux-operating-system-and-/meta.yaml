    # Introduction


    I want to thank you and congratulate you for downloading the book, "*Linux Mastery*
    - The Ultimate Linux Operating System and Command Line Mastery Guide"


    While not as popular as Windows—at least, for some—Linux is definitely one of
    the most reliable Operating Systems around—and the best part about it is that
    it’s free, so you don’t really have to pay for anything just to get it, and you
    also wouldn’t have to go for counterfeit types of Operating Systems just because
    you could not pay for the legal copy. More than anything, Linux can be used for
    a variety of applications. Whether you’re opting to create a better system for
    business, or just want to be more creative and play around with things, Linux
    can help you do a great job.


    This book contains proven steps and strategies on how to make use of Linux, whether
    for work or play, understand the commands that you have to use, choose distributions,
    and understand exactly why Linux matters—and more.


    Surely, after reading this book, you’ll be adept about Linux—and you will have
    an easy time using it for your needs.


    Read this book now, and find out how!


    Thanks again for downloading this book, I hope you enjoy it!


    # Chapter 1 What Is Linux?


    So, what is Linux, actually?


    For starters, Linux is a free and open-source Operating System, based on UNIX
    and POSIX codes. In short, it is free to download, and free to use, and was originally
    based on the paradigm of Intel x86. In fact, out of all Operating Systems, Linux
    has the largest base that has been installed, compared to the rest. This is why
    a computer or device that works on Linux works fast, and are sometimes even compared
    to those amazing supercomputers! This is because Linux gets to be tailored to
    any kind of system where it''s being used for—compared to other operating systems
    that work best on a certain kind of device alone. This so happens because of the
    so-called open source software collaboration that can support various kinds of
    libraries and directories.


    ![](img/ec7dfe85b118052677f219cf769aed44_6_0.png)


    http://cdn1.mos.techradar.futurecdn.net//art/software/Linux/Best%20distro/linux-distros-im-650-80.jpg


    ## Early Beginnings


    Back in 1969, the UNIX Operating System—also known as the forefather of Linux—was
    created at the AT & T Bell Laboratories, with C-Programming basics, and high availability
    of languages that could be used for porting purposes. With that kind of background,
    this OS became the most relied-on operating system of business and school administrators.


    However, certain controversies happened when an anti-trust case prevented UNIX
    from continually being used for businesses, but since its developers—and its supporters—believed
    that there''s still more to UNIX than what people think, they decided to develop
    the GNU Kernel—and it was because of this that Linux finally came to fruition.


    ### Enter Linux


    With the help of its principal author, Linus Torvalds, and his principle of finding
    a truly functional Operating System that everyone can use, he decided to work
    on the GNU Kernel. He wanted something that people, whether they''re professionals
    or just wanting to use the computer and other devices for entertainment, could
    really use. He then began to upload files created from the Kernel to the FTP Server,
    and wanted to call it "Freax", but his collaborators and other professionals at
    the time didn''t think it was a good idea, and so playing with his name, Linux
    was born in 1991!


    1. To create an Open-Source Programming Language, so it would be free, and everyone
    would be able to contribute to its development;

    2. To create something that’s as good as its predecessors and competitors, but
    make sure that it is easy to understand, and that it is intuitive;

    3. To create a programming language that would be useful for everyday tasks, and;

    4. To simply create a programming language that could be compared to plain English,
    when readability is concerned.


    When it was first published (to be used) in 1991 as Version 0.9.0, core datatypes,
    functions, and inheritance such as *str*, *dict*, and *list* were already available.
    In 1994, Version 1.0 was released and it involved *reduce*, *filter*, *map*, and
    *lambda*, amongst others, and in 1995, Van Rossum continued to work on developing
    Linux while at the *Corporation for National Research Initiatives* in Virginia!


    In 2000, the *BeOpen Linux Labs* team was established, and Version 1.6 of the
    language was put out, with important bug-fixes. Another version called Version
    2.0 was released in 2008, followed by 3.0—which could coexist with the other!


    ## Linux Now


    Today, Linux is partly responsible for helping the world work like it should.
    From people who only work with computers at home, to larger feats such as NASA
    using Linux-powered computers, it is no surprise why Linux is getting the attention
    of many—and today, you have the chance to learn about it, and more!


    # Chapter 2 Why Linux?—The Benefits of Linux


    Apart from what was mentioned earlier, why is it that you have to choose Linux?
    What exactly can you get from it?


    Well, there are loads of advantages that you can get if you choose to use Linux
    as your Operating System, some of which are as follows:


    ## Amazing Security


    One of the best things that people love about Linux is that compared to other
    operating systems, it is quite secure. You wouldn''t have to buy those costly
    anti-virus systems because on its own, Linux could do all the virus and security
    checks that you need, and in fact, you will learn a lot about this in the last
    chapter of this book.


    What you have to understand is that since Linux is an open source system, even
    if some programmers can create bugs or anything that might be "harmful" to your
    computer, you can expect that a counter-attack is just within reach. In fact,
    if you can research or study about it, you might even create one yourself.


    ## Great Hardware, and Software, too


    If you''re one of those people who still use those big, clunky, old computers,
    or if your computer doesn''t have much memory or processing power, you''d be glad
    to know that Linux could work for it, too. In fact—and in relation to what was
    mentioned above—even if your computer does not have a firewall or any of those
    "safety precautions", you can still expect it to work without fail—mainly because
    Linux was really created to "work", and not to give you so many ridiculous problems.


    Now, when it comes to software, Linux also has a lot to offer. While Windows offers
    one version for each app—for example, *Text Editor*, *Microsoft Word*, *Windows
    Movie Maker*, Linux has hundreds and thousands of options that you can choose
    from—and that you can get for free. So, say, you''re going to search for a text
    editor, you can just search for that, and guess what? A lot of options will be
    presented to you, so you can choose the one you''re most comfortable with, and
    the one you think would yield the best results. This also means that Linux Software
    has greater usability and readability, therefore, it won''t be alienating to anyone
    the way software from other operating systems are—especially if you have to pay
    a lot for them!


    ## You Have the "Power of Choice"


    As aforementioned, you have the choice to decide on what kind of software you
    like to use. You also have the choice to design your desktop or device the way
    you want, simply by using Linux. It makes the act of using the computer or any
    device you have more personalized—more like something you''d feel comfortable
    with, and one that would be quite manageable for you.


    The problem with other Operating Systems is that somehow, they feel so hard to
    maneuver'
