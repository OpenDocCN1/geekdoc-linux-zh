    # **There are different devices, files, and folders.**


    Linux is not Windows—it is far from that. Of course, seeing a different bunch
    of files and folders onscreen might be confusing at first, but do remember that
    even if the names or the looks are different, they work in the same paradigm—albeit
    in a much improved manner.


    ![](img/ec7dfe85b118052677f219cf769aed44_18_1.png)


    http://cdn.mos.cms.futurecdn.net/b2ec717d872a45911ffdbc770ad46310-650-80.png

    Basically, the file system starts with the root, also known as a “simple path”—or
    where everything stems from, and where they go. So, in case you’re traveling and
    you get to bring your laptop with you, you can choose one port for files on the
    go, and another for files at home—and this would not disintegrate your system.
    This is good because it is less confusing, and it allows you to focus.


    Apart from the root and the ports, things look a bit the same as you’re used to,
    but you might also notice that they’re cleaner now, or that they are easier on
    the eyes. These file extensions are meant to help you as a user, which means that
    while they may be confusing on the get-go, you won’t have a hard time trying to
    learn about them—and you’d appreciate them sooner or later.'
