    ## Built-in String Method


    - **Zfill (width)**. Left-pads original string with zeros.

    - **Upper ()**. Turns lowercase letters into uppercase.

    - **Translate (table, deletechars="")** Turns string into translation table.

    - **Title ()**. Turns string into titlecard version, which means uppercase becomes
    lowercase and vice-versa.

    - **Swapcase ()**. All letters in the string will be inverted.

    - **Strip ([chars])**. Performs rstrip() and lstrip() on each string.

    - **Startswith (str, beg=0, end=len (string))**. Checks whether string is string
    itself or subset of string.

    - **Splitlines (num=string.count(''\n''))**. Returns each of the line with new
    strings.

    - **Split (str="", num=string.count (str))**. Splits the strings into delimeters.

    - **Rjust (width, [,fillchar])**. This gives you space-padded strings.

    - **Rindex (str, beg=0, end=len(string))**. This is just like index but with backward
    string.

    - **Replace (old, new [max])**. This replaces current string with max occurrences.

    - **Max (str)**. This returns max character alphabetical string.

    - **Join (seq)**. This merges representations of the strings.

    - **Isdecimal()**. If Unicode string contains decimal characters, value returns
    as true; false otherwise.

    - **Find (str, beg=0, end=len(string))**. This checks whether str is on string
    or on subsequent string.

    - **Expandtabs (tabsize = 8)**. Strings and tabs are then placed in multiple spaces.

    - **Encode (suffix, beg=0, end=len(string))**. This runs an encoded version of
    each string.

    - **Decode (encoding UTF-8, errors=strict)**. The codec registered for encoding
    will be used for this method, and you’d get a default string.

    - **Count (str, beg=0, end=len(string))**. This counts the number of times a string
    appears and begins indexing.

    - **Center (width, fillchar)**. Along with the original string, this’ll give you
    a space-padded string consuming the total width of the columns.

    - **Capitalize()**. This basically capitalizes the first letter of the string.


