    # # Chapter 2 Why Linux?—The Benefits of Linux


    Apart from what was mentioned earlier, why is it that you have to choose Linux?
    What exactly can you get from it?


    Well, there are loads of advantages that you can get if you choose to use Linux
    as your Operating System, some of which are as follows:


    ## Amazing Security


    One of the best things that people love about Linux is that compared to other
    operating systems, it is quite secure. You wouldn''t have to buy those costly
    anti-virus systems because on its own, Linux could do all the virus and security
    checks that you need, and in fact, you will learn a lot about this in the last
    chapter of this book.


    What you have to understand is that since Linux is an open source system, even
    if some programmers can create bugs or anything that might be "harmful" to your
    computer, you can expect that a counter-attack is just within reach. In fact,
    if you can research or study about it, you might even create one yourself.


    ## Great Hardware, and Software, too


    If you''re one of those people who still use those big, clunky, old computers,
    or if you computer doesn''t have much memory or processing power, you''d be glad
    to know that Linux could work for it, too. In fact—and in relation to what was
    mentioned above—even if your computer does not have firewall or any of those "safety
    precautions", you can still expect it to work without fail—mainly because Linux
    was really created to "work", and not to give you so many ridiculous problems.


    Now, when it comes to software, Linux also has a lot to offer. While Windows offers
    one version for each app—for example, *Text Editor*, *Microsoft Word*, *Windows
    Movie Maker*, Linux has hundreds and thousands of options that you can choose
    from—and that you can get for free. So, say, you''re going to search for a text
    editor, you can just search for that, and guess what? A lot of options will be
    presented to you, so you can choose the one you''re most comfortable with, and
    the one you think would yield the best results. This also means that Linux Software
    has greater usability and readability, therefore, it won''t be alienating to anyone
    the way software from other operating systems are—especially if you have to pay
    a lot for them!


    ## You Have the "Power of Choice"


    As aforementioned, you have the choice to decide on what kind of software you
    like to use. You also have the choice to design your desktop or device the way
    you want, simply by using Linux. It makes the act of using the computer or any
    device you have more personalized—more like something you''d feel comfortable
    with, and one that would be quite manageable for you.


    The problem with other Operating Systems is that somehow, they feel so hard to
    maneuver'
- md: '# Flexibility


    Flexibility is also one of the best things about Linux. With Linux, you won’t
    have to deal with hoop-jumping, piracies, scams, or anything that would make it
    hard for you to “take control” of any given situation. It also has forums that
    you can join to think about security and other issues, if those are bothering
    you, or are making you confused.


    # Multiple Program Paradigms


    Linux also supports various program paradigms, such as:


    **Object-Oriented Programming.** This makes use of the concept of objects, such
    as fields, data, and data structures and their attributes.


    **Imperative Programming.** Meanwhile, Imperative Programming involves the use
    of statements to modify the state of a program. Simply put, it deals with how
    the program achieves its result, as opposed to what the program should achieve.


    **Functional Programming.** And, finally, Linux also deals with functional programming,
    or the paradigm that deals with mathematical computations and functions to develop
    an outcome.


    # It’s Compatible for Most Devices!


    You do not have to buy a new device just to use Linux. Again, and as mentioned
    earlier, it might even work for old computers—which is amazing because some people
    have issues when it comes to letting their old computers and devices go—and that’s
    something you would not feel for this one. Its kernels work for old and new devices,
    so there’s no need to upgrade anything or buy something new.


    # It’s Easy to Use and Understand


    Sometimes, it’s so hard to find a product or a service that really, ultimately
    works well for you. But, when it comes to Linux, that happens almost instantly—and
    that’s amazing especially if you’re new to the whole open-source paradigm!


    # And, It Gives You Lots of Choices!


    Linux is all about helping you make the most out of what’s installed in your computer.
    It is not alienating. If you don’t like something, it gives you the chance to
    look for something else—find something better. And with that in mind, it becomes
    easier for you to do what you should—and make use of it in the manner that you
    know is best for you.


    ## Chapter 3 Choosing a Distribution


    The next thing you have to do is choose your own Linux Distribution. Basically,
    these are just the different versions of Linux that you can choose from, and yes,
    all of them are the same, when it comes to being Operating Systems, but they differ
    when it comes to aesthetics, and the way they “work”.


    Basically, there are various distributions to choose from, but there are seven
    that are the most trusted, and these are:


    ### Ubuntu


    ![](img/ec7dfe85b118052677f219cf769aed44_12_0.png)


    Ubuntu is possibly one of the most popular distributions of Linux, and is deemed
    to be the best to choose if you’re new to Linux, or have not tried it before.
    Ubuntu has amazing easy-to-install repositories, and is quite customizable—perfect
    for art and media practitioners, or those who are just extremely careful about
    what they see onscreen. The problem with Ubuntu is that compared to other distributions,
    it does not work as great with mobile devices—which can be a bit of a problem,
    especially if you’re the type who’s on your mobile device all the time.


    ### Solus


    ![](img/ec7dfe85b118052677f219cf769aed44_12_1.png)


    Solus has that modern feel, and is in fact, somewhat new as it was released only
    in 2012—a time when Ubuntu was mostly used in schools and businesses. Some say
    that the best thing about Solus is its aesthetic feel, because it really has that
    elegant, nice-to-look-at feel to it. One thing, though, is that there aren’t too
    many “Solus Communities” around yet, so if you get to have problems with this
    distribution, you might have to look for the solution yourself.


    ### Mint Cinnamon


    ![](img/ec7dfe85b118052677f219cf769aed44_13_0.png)


    Such a fresh-sounding name, isn’t it? Well, Mint Cinnamon actually has that fresh
    and light feel as it mostly makes use of white and gray for aesthetics. It’s quite
    the minimalist distribution of Linux—perfect for people who do not like seeing
    a lot of pizzazz and anything too colorful on their screens. The best thing is
    that its repositories are the same as Ubuntu’s, so you won’t have much of a hard
    time trying to understand them, and its UI is also less-demanding—so it wouldn’t
    be too taxing on your computer, and on you who’s going to be using it. Mint Cinnamon
    is also deemed to be great for beginners, because as aforementioned, there’s not
    much to understand about it—and you really don’t have to give yourself a hard
    time for it, too.


    ### Ubuntu Studio


    ![](img/ec7dfe85b118052677f219cf769aed44_13_1.png)


    As the name suggests, this incarnation of Linux is perfect for producers, musicians,
    sound engineers, designers, and artists who need to work with various kinds of
    multimedia, and who need computers or devices that are tailored for that purpose—Ubuntu
    Studio definitely makes that easy. Having been around since 2007, this one has
    a multi-track, digital recorder and sequencer named “Ardour” that’s being relied
    on by many artists around the globe. The best thing about the said recorder is
    that it synthesizes guitar and other instruments that have been used, making sure
    that your final output would be really pleasing to the ears, and not at all hard
    to deal with. Therefore, you’d get to create projects that are of professional
    quality—without spending much for it.


    ### Arch Linux


    ![](img/ec7dfe85b118052677f219cf769aed44_14_0.png)


    This one is deemed to be perfect for professionals because it is something that
    you have to work with and customize on your own. In fact, it does not even come
    with as many applications as other distributions do, which means that you do have
    to know what you’re doing. With this, you have to apply the “Keep it Short and
    Simple” philosophy, because downloading too much might just make you confused.
    Find what you really want, and then prune or get rid of those you feel won’t matter
    to you, so that your screen won’t be too cramped, and so you can make the most
    out of this distribution. However, what’s good about it is that you may learn
    a lot, so even if you may have a bit of a hard time in the beginning, rest assured,
    you’d get past that, and experience what Arch Linux really is about!


    ### Chrome OS


    ![](img/ec7dfe85b118052677f219cf769aed44_14_1.png)


    It’s said that this is one of the main and closest renditions of the early Linux
    GNU Kernel, but that it has actually exceeded expectations, and is proving to
    be one of the most reliable Linux distributions. It has since then been repurposed
    into a working environment on its own, mostly because it’s used to make certain
    Google Apps, and works fast even if you use applications that take up much space,
    such as *Photoshop*. It will make your work much more manageable, but the issue
    is that there are certain applications that are not available on this distribution
    that you can find in other Linux distributions. It’s also the kind of distribution
    that works better offline, so that could be hassle if you’re always connected
    to the web, but you can make certain updates or upgrades with minimal fees, anyway.


    ### Elementary OS


    ![](img/ec7dfe85b118052677f219cf769aed44_15_0.png)


    And finally, there’s the Elementary Distribution. Not only is it one of the most
    aesthetically-pleasing versions of Linux, it’s also highly functional, and some
    say has that resemblance to the Mac—perfect for multimedia artists and those who
    work with high-end applications, as well. In fact, it may as well be your perfect
    Windows or Mac replacement, in the event that you are looking for something new
    that you can rely on quite well. It also has an amazing line of pre-installed
    apps, and even a custom web-browser that can really personalize the way you use
    Linux.'
