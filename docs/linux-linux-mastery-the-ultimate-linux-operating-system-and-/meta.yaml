  md: '# # Chapter 1 What Is Linux?


    So, what is Linux, actually?


    For starters, Linux is a free and open-source Operating System, based on UNIX
    and PSOIX codes. In short, it is free to download, and free to use, and was originally
    based on the paradigm of Intel x86. In fact, out of all Operating Systems, Linux
    has the largest base that has been installed, compared to the rest. This is why
    a computer or device that works on Linux works fast, and are sometimes even compared
    to those amazing supercomputers! This is because Linux gets to be tailored to
    any kind of system where it''s being used for—compared to other operating systems
    that work best on a certain kind of device alone. This so happens because of the
    so-called open source software collaboration that can support various kinds of
    libraries and directories.


    ![](img/ec7dfe85b118052677f219cf769aed44_6_0.png)


    http://cdn1.mos.techradar.futurecdn.net//art/software/Linux/Best%20distro/linux-distros-im-650-80.jpg


    # ## Early Beginnings


    Back in 1969, the UNIX Operating System—also known as the forefather of Linux—was
    created at the AT & T Bell Laboratories, with C-Programming basics, and high availability
    of languages that could be used for porting purposes. With that kind of background,
    this OS became the most relied-on operating system of business and school administrators.


    However, certain controversies happened when an anti-trust case prevented UNIX
    from continually being used for businesses, but since its developers—and its supporters—believed
    that there''s still more to UNIX than what people think, they decided to develop
    the GNU Kernel—and it was because of this that LINUX finally came to fruition.


    # ### Enter Linux


    With the help of its principal author, Linus Trovalds, and his principle of finding
    a truly functional Operating System that everyone can use, he decided to work
    on the GNU Kernel. He wanted something that people, whether they''re professionals
    or just wanting to use the computer and other devices for entertainment, could
    really use. He then began to upload files created from the Kernel to the FTP Server,
    and wanted to call it "Freax", but his collaborators and other professionals at
    the time didn''t think it was a good idea, and so'
  merge: -1
  pgno: 6
- img_proc: true
  md: 'playing with his name, Linux was born in 1991!


    +   1. To create an Open-Source Programming Language, so it would be free, and
    everyone would be able to contribute to its development;

    2. To create something that’s as good as its predecessors and competitors, but
    make sure that it is easy to understand, and that it is intuitive;

    3. To create a programming language that would be useful for everyday tasks, and;

    4. To simply create a programming language that could be compared to plain English,
    when readability is concerned.


    When it was first published (to be used) in 1991 as Version 0.9.0, core datatypes,
    functions, and inheritance such as *str*, *dict*, and *list* were already available.
    In 1994, Version 1.0 was released and it involved *reduce*, *filter*, *map*, and
    *lambda*, amongst others, and in 1995, Van Rossum continued to work on developing
    Linux while at the *Corporation for National Research Initiatives* in Virginia!


    In 2000, the *BeOpen Linux Labs* team was established, and Version 1.6 of the
    language was put out, with important bug-fixes. Another version called Version
    2.0 was released in 2008, followed by 3.0—which could coexist with the other!


    # Linux Now


    Today, Linux is partly responsible for helping the world work like it should.
    From people who only work with computers at home, to larger feats such as NASA
    using Linux-powered computers, it is no surprise why Linux is getting the attention
    of many—and today, you have the chance to learn about it, and more!'
