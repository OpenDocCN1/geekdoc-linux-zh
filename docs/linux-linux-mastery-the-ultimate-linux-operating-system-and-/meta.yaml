    有三种类型的循环，它们是：

    - **For 循环。** 这是指语句被执行多次，并且代码被缩写。

    - **While 循环。** 这是指当条件为真时，语句或语句组会被重复执行。

    - **嵌套循环。** 这意味着你在第一个循环内部或上方使用循环。


    你还可以使用循环控制语句，例如：

    - **Continue 语句。** 这使得循环跳过其剩余部分并重置回其原始形式。

    - **Break 语句。** 这在终止循环之前转移语句执行，并立即返回到其他循环。例如：

    - **Pass 语句。** 当你不想出于语法原因执行代码或命令时，这就是所谓的 pass 语句。


    ## 元组


    元组类似于列表数据，但它由许多用逗号分隔的值组成，并且用圆括号 () 而不是方括号括起来。元组也不能被更新。


    ## 数据类型转换


    - **Unichr (x).** 最后，使用此命令，你将获得一个 Unicode 字符。

    - **Tuple (t).** 将 x 转换为元组。

    - **Str (x).** 将 x 转换为字符串表示形式。

