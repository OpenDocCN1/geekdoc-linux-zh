    ## 应用层目录


    应用层目录封装了提供交换应用程序的服务所使用的协议。这还包括主机配置协议、路由服务和网络支持服务。例如文件传输协议（FTP）、超文本传输协议（HTTP）和动态主机配置协议（DHCP）。通过这种方式，你可以根据所使用的协议来降低数据传输量。


    应用层还将传输层目录视为一个稳定的网络，其中的黑盒允许整个应用程序内的通信发生，同时确保应用程序每个部分的关键特性仍能尽可能强大地运行。应用层目录发生的任何情况都不会影响传输层和网络层，因为流量通常不会检查上述层。然而，有时对于NAT（网络地址转换器）来说，考虑应用程序的有效载荷并确保一切顺利运行是至关重要的。


    ![](img/ec7dfe85b118052677f219cf769aed44_50_0.png)


    http://www.linuxjournal.com/files/linuxjournal.com/linuxjournal/articles/059/5918/5918f1.


    ## 链路层目录


    网络方法在链路层内定义。其范围包括中间路由器以及主机网络，包括用于描述网络拓扑结构的协议，并且数据报也因不同的目标和假设以及严格的分层而明显。这意味着你可以在任何硬件网络技术之上实现Linux。


    借助链路层，数据包可以轻松移动并可以接收驱动程序卡数据包，这也意味着该层对应于OSI模型。


    ## 网络层目录


    基本上，网络层目录的工作方式是负责发送正确的数据包，并确保它们能够跨越多个网络移动。其主要功能是：


    - 1. **数据包路由**。这完全是关于将数据包从目的地的源发送到需要使用它们的地方。唯一的协议号用于标识这些数据包。

    - 2. **主机识别和寻址**。借助分层的IP系统，可以实现这一点。


    ## 目录 5 到 10


    这些用于解析主机，因为它们在语法 *LinuxConnector::resolvehostname()* 下工作，并且它们能够借助 *getaddridinfo()*
    函数转换IP地址和主机名。这比仅仅使用 *gethostname()* 好得多，因为它被称为安全线程。


    ## 目录 13 到 15


    这些行统称为 *LinuxConnector::resolvehost*。它们能够将名称字符串和DNS主机转换为IP地址，以便做出的每个假设都可以转换为不同的网络地址。


    ## 目录 16


    这是 *socket()* 的第一个参数，以便你可以选择通信网络的特定协议族。应使用 *SOCK_STREAM* 和 *PF_INET*，因为它们配合得很好。


    ## 目录 17 到 20


    这些被称为 *connect::passing()*，因为它借助 *sockaddr_in* 指针将用户指向正确的结构。它将帮助你了解结构的长度，以便你不会将其与程序和网络本身的其他功能混淆。


    ## 第 28 到 34 行


    这些使用 *listen()* 函数。基本上，你可以发起TCP请求并让它们排队，以支持网络的参与分支。不过，某些操作系统不支持此功能，但你可以尝试使用 *m_listening*
    函数。


    ## 第 23 到 27 行


    这些能够通过返回正确的消息/bind()值来绑定监听套接字。


    ## 第 20 到 21 行


    这些允许你监听IP并在某些连接结束后突然搜索连接。但是，你可以通过使用 _SO_REUSEADDR_ 函数来禁用此功能。


    ## 第 21 到 32 行


    这为你提供了来自客户端的无限且持续数量的连接，也有助于你处理大量来自它们的数据。它使用语法 _LinuxAcceptor::start_，你也可以在其中处理来自客户端的大量数据。当没有可用的客户端——以及服务器——时，会出现零（0）。


    ## 第 12 到 20 行


    这些通过 _TCPAcceptor_ 函数为你提供命令行参数。请注意，你必须指定IP地址，服务器才能开始建立连接。


    ## 第 5 到 10 行


    这些行将帮助你意识到服务器将开始监听IP端口，并且在重要的IP地址之间会有一条命令行。当用户尝试调用错误信息时，将显示错误消息。


    ## 第 13 到 18 行


    通过这些，你将知道服务器是否正在监听，因为它使用 _m_address_。它还将字节排序并转换，防止在监听过程中出现套接字故障。


    ## 第 9 到 12 行


    这些将帮助你使用 _PF_INET_ 协议在网络中初始化新的套接字。TCP端口也将按顺序就位。


    ## 第 7 行


    这将帮助你为套接字创建描述，以便你可以为不同的套接字创建不同的调用。


    ## 第 3 到 10 行


    同时，如果你试图接受来自客户端的连接，这些行将派上用场。对于这些，_TCPAcceptor::accept_ 语法非常有用。这样，你可以在一个线程中获得所有合格的函数，而不会感到困惑。


    ## 封装目录


    现在，为了给Linux提供其急需的抽象层，需要进行封装。它与协议套件的功能划分保持一致，以便每一层都能被正确地封装和处理。


    请注意，位于层之上的那些是用户应用程序本身密切使用的。但是，没有单一的架构模型必须遵循，尤其是当您拥有定义不太明确的模型（如OSI模型）时。这就是它与其他互联网协议，特别是早期协议的主要区别。


    # 第 9 章 管理和安全


    为了帮助你获得更好的安全性，并确保你的操作系统始终处于“健康”状态，最好注意以下给定的命令：


    ## 用户数据报协议


    这是互联网协议套件的重要成员。它提供无连接传输，这种方式实际上可以是可靠的，并且不会以任何方式破坏网络协议。它们非常适合容易丢弃数据包的时间敏感型应用。用户数据报协议还具有以下特点：


    - 1. 它能够向网络提供数据报；

    - 2. 它是面向事务的，适用于网络时间协议和域名系统；

    - 3. 它适用于单向通信，适合服务发现和广播信息；

    - 4. 它适用于实时应用程序（如 *Twitter*、*Snapchat*、*Periscope* 等），因为它减少了传输延迟。它也适用于VOIP应用程序（如
    *Skype*），并适用于一些游戏；

    - 5. 它适用于大量客户端，并且是无状态的。它也适用于流媒体应用程序；

    - 6. 它非常适合引导，因为它简单且无状态。


    它还适用于八位字节0到4，在某些情况下甚至适用于20到160。


    ## 跨平台


    你还可以为Linux进行跨平台编程。为此，你必须记住以下几点：


    - 1. 应使用 *windows.h* 和 *winsock.h* 作为头文件。

    - 2. 必须使用 *closesocket()* 而不是 *close()*。

    - 3. 使用 *Send()* 和 *Receive()*，而不是read()或write()。

    - 4. 使用 *WSAStartup()* 来初始化库。


    ## 别名协议


    Linux的另一个重要协议，可以将请求的服务和消息发送到路由器，并且也有自己的协议号。区别在于它从IPv4报头开始，通常只是被称为“1”。它也适用于八位字节0到4，其中：


    - 1. 代码 = 控制消息 | ICMP子类型

    - 2. 类型 = 控制消息 | ICMP子类型


    # 数据传输规则


    2. 数据应按顺序到达；

    3. 数据应包括流量拥塞控制；

    4. 丢弃或丢失的数据包必须重新发送；

    5. 重复的数据必须丢弃。


    当这种情况发生时，你可以预期即使是最新的流控制协议也能在网络中正常工作。然而，你不必依赖无连接数据报，因为正如其名称所示，它们不提供正确的连接——并且相当不可靠。

