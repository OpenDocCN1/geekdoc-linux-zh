  md: '# # Chapter 3 Choosing a Distribution


    The next thing you have to do is choose your own Linux Distribution. Basically,
    these are just the different versions of Linux that you can choose from, and yes,
    all of them are the same, when it comes to being Operating Systems, but they differ
    when it comes to aesthetics, and the way they “work”.


    Basically, there are various distributions to choose from, but there are seven
    that are the most trusted, and these are:


    # ## Ubuntu


    ![](img/ec7dfe85b118052677f219cf769aed44_12_0.png)


    Ubuntu is possibly one of the most popular distributions of Linux, and is deemed
    to be the best to choose if you’re new to Linux, or have not tried it before.
    Ubuntu has amazing easy-to-install repositories, and is quite customizable—perfect
    for art and media practitioners, or those who are just extremely careful about
    what they see onscreen. The problem with Ubuntu is that compared to other distributions,
    it does not work as great with mobile devices—which can be a bit of a problem,
    especially if you’re the type who’s on your mobile device all the time.


    # ## Souls


    ![](img/ec7dfe85b118052677f219cf769aed44_12_1.png)'
