    You can also make use of the following numerical types:


    1. Int (signed integers)

    2. Complex (complex numbers)

    3. Float (floating real point values)

    4. Long (long integers; could be hexadecimal and octal)


    ### Lists


    Linux also allows you to create lists that could be enclosed in brackets {[]}.
    They are like the same lists used in C Language, but are definitely easier to
    make. Again, make use of slice operators ([] or [:]), and start with indexes of
    0. You can concentrate the strings by using the plus sign (+) and repeat by using
    the asterisk (*).


    ### Dictionaries


    In Linux, Dictionaries are considered as hash tables or associative arrays. They
    are filled up with numbers and strings. They are enclosed by curly braces {{}}
    and values are assigned by square braces [].


