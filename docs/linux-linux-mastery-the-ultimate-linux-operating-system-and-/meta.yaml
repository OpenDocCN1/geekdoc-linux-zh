    ## 第六章 工作与娱乐中使用Linux


    如前所述，Linux可用于多种应用——既能胜任工作，也能用于娱乐。


    ### 工作用途


    从严肃层面来看，Linux可用于超级计算机。事实上，自过去的超级计算机“地球模拟器”退役后，所有超级计算机均采用Linux操作系统。美国国家航空航天局（NASA）也为其所有计算机和应用使用Linux——因此，它确实有助于拉近地球与太空的距离，并帮助许多人更深入地了解宇宙！在一些办公室中，Linux被用于帮助创建高效的输入输出系统——避免了其他操作系统带来的迟缓。


    Linux也适用于嵌入式系统或任何使用“实时”机制的设备。例如，如果你想观看“电视”但没有电视机，只能使用像*BusyBox*这样的设备，那么你可以预期，真实电视屏幕上播放的内容也会被BusyBox实时捕捉！这意味着你不会错过任何内容——因此，如果你是媒体从业者，这绝对能为你的工作提供帮助。


    Linux也被用于一些移动设备，以确保虚拟化变得简单且普及，并帮助用户获得最佳的虚拟体验——非常适合在广告中使用增强现实技术的广告商。此外，Linux也用于大多数服务器，特别是那些在LYCE和LYME下运行的动态站点，以及使用LAMP的站点。它也适用于云计算，以及管理服务和基础设施等。


    ### 娱乐用途


    当然，Linux也非常适合用于娱乐目的！它可以作为人机交互设备，也是在Android和其他移动设备上玩你最喜欢游戏的地方，因为Linux可以成为一个出色的游戏平台，像*Valve*这样的游戏巨头从2012年开始就选择Linux作为其应用程序的平台。著名的Steam也使用Linux，并帮助用户了解它实际上并不疏远——它可以帮助人们更快、更愉快地玩游戏。


    简而言之，Linux几乎适用于你需要的任何事情——因此，尝试一下它并无坏处。


    ## 第七章 了解命令


    有各种各样的命令可以让你使用Linux的方式更加简单高效。你可以在下面了解更多。


