    it first. To make that happen, here’s what you have to do:


    Download the latest version from the official website. ([https://www.linux.org/](https://www.linux.org/)).


    There, you will find an MSI Package—just double click the file and follow the
    installation procedure that you will see onscreen. Take note that even if you
    already have another version of Linux on your system, you can still download a
    new one as it installs in a new path, with the number of Linux versions that you
    have. (i.e., C:\Linux\27) This would not get in conflict with the other versions
    you have.


    Add directories to PATH for it to easily be found. (i.e., C:\Linux\27 to PATH,
    etc)


