    # 引言


    我要感谢您并祝贺您下载了《*Linux Mastery* - 终极 Linux 操作系统与命令行精通指南》。


    虽然 Linux 不像 Windows 那样流行——至少对某些人来说如此——但它绝对是最可靠的操作系统之一，而且最棒的是它是免费的，因此您无需为获取它支付任何费用，也无需因为买不起正版而去购买盗版操作系统。最重要的是，Linux
    可用于各种应用。无论您是想为企业创建一个更好的系统，还是只想更有创意地玩玩，Linux 都能帮助您出色地完成工作。


    本书包含经过验证的步骤和策略，教你如何利用 Linux——无论工作还是娱乐、理解必须使用的命令、选择发行版，以及理解 Linux 为何重要——等等。


    可以肯定的是，阅读本书后，您将熟练掌握 Linux，并能轻松地将其用于您的需求。


    现在就读这本书，找出答案吧！


    再次感谢您下载本书，希望您喜欢！


    # 第 1 章 什么是 Linux？


    那么，Linux 到底是什么？


    首先，Linux 是一个免费的、基于 UNIX 和 POSIX 代码的开源操作系统。简而言之，它免费下载、免费使用，最初基于 Intel x86 架构。事实上，在所有操作系统中，Linux
    的安装基数是最大的。这就是为什么在 Linux 上运行的计算机或设备速度快，有时甚至能与那些神奇的超级计算机相媲美！这是因为 Linux 可以针对任何使用它的系统进行定制——而其他操作系统通常只在某种特定设备上才能最佳运行。这得益于所谓的开源软件协作，它可以支持各种库和目录。


    ![](img/ec7dfe85b118052677f219cf769aed44_6_0.png)


    http://cdn1.mos.techradar.futurecdn.net//art/software/Linux/Best%20distro/linux-distros-im-650-80.jpg


    ## 早期起源


    早在 1969 年，UNIX 操作系统——也被称为 Linux 的鼻祖——诞生于 AT & T 贝尔实验室，以 C 语言编程为基础，并拥有可用于移植目的的丰富语言。凭借这种背景，该操作系统成为了商业和学校管理员最依赖的操作系统。


    然而，当一项反垄断案件阻止 UNIX 在企业中持续使用时，发生了一些争议，但由于其开发者——以及支持者——相信 UNIX 还有更多潜力，他们决定开发 GNU
    内核——正是因为如此，Linux 最终得以实现。


    ### Linux 的诞生


    在其主要作者 Linus Torvalds 及其寻找真正实用的、人人可用的操作系统的原则的帮助下，他决定研究 GNU 内核。他想要一些人们——无论他们是专业人士还是只想使用电脑和其他设备进行娱乐——真正能用的东西。然后他开始将内核创建的文件上传到
    FTP 服务器，并想称之为 "Freax"，但当时他的合作者和其他专业人士认为这不是个好主意，于是玩了一下自己的名字，Linux 于 1991 年诞生了！


    1. 创建一种开源编程语言，使其免费，并且每个人都能为其开发做出贡献；

    2. 创建与其前身和竞争对手一样好，但确保易于理解且直观的东西；

    3. 创建一种对日常任务有用的编程语言，以及；

    4. 简单地创建一种在可读性方面可与纯英文相媲美的编程语言。


    当它在 1991 年首次发布（供使用）为版本 0.9.0 时，核心数据类型、函数和继承如 *str*、*dict* 和 *list* 就已经可用。1994
    年，发布了 1.0 版本，其中包含了 *reduce*、*filter*、*map* 和 *lambda* 等功能。1995 年，Van Rossum 继续在弗吉尼亚州的*国家研究倡议公司*开发
    Linux！


    2000 年，*BeOpen Linux Labs* 团队成立，并发布了该语言的 1.6 版本，包含重要的错误修复。另一个名为 2.0 版本的版本于 2008
    年发布，随后是 3.0 版本——它可以与其他版本共存！


    ## 如今的 Linux


    今天，Linux 在一定程度上帮助世界如常运转方面功不可没。从只在家里使用电脑的人，到更大的壮举，如 NASA 使用 Linux 驱动的计算机，Linux
    越来越受到关注也就不足为奇了——而今天，您有机会了解它以及更多内容！


    # 第 2 章 为什么选择 Linux？— Linux 的优势


    除了前面提到的内容，为什么必须选择 Linux？您究竟能从中获得什么？


    嗯，如果您选择使用 Linux 作为操作系统，您可以获得很多优势，其中一些如下：


    ## 出色的安全性


    人们喜欢 Linux 的最佳特性之一是，与其他操作系统相比，它相当安全。您无需购买那些昂贵的防病毒系统，因为 Linux 本身就能完成您所需的所有病毒和安全检查，事实上，您将在本书的最后一章中了解到很多相关知识。


    您需要理解的是，由于 Linux 是一个开源系统，即使一些程序员可能会创建对您的计算机“有害”的漏洞或其他东西，您可以预期反攻击措施近在咫尺。事实上，如果您能研究或学习它，您甚至可能自己创建一个。


    ## 优秀的硬件和软件兼容性


    如果您是那些仍在使用笨重、老旧电脑的人之一，或者您的电脑没有太多内存或处理能力，您会很高兴知道 Linux 也能为其工作。事实上——与上面提到的有关——即使您的电脑没有防火墙或任何“安全预防措施”，您仍然可以期望它无故障地工作——主要是因为
    Linux 真正被创造出来是为了“工作”，而不是给您带来那么多荒谬的问题。


    现在，说到软件，Linux 也有很多选择。虽然 Windows 为每个应用程序提供一个版本——例如 *Text Editor*、*Microsoft Word*、*Windows
    Movie Maker*，Linux 有成百上千个供您选择的选项——而且是免费的。所以，比如说，您要搜索一个文本编辑器，您只需搜索一下，猜猜会怎样？会有很多选项呈现给您，这样您就可以选择最顺手的，以及您认为能产生最佳效果的那个。这也意味着
    Linux 软件具有更高的可用性和可读性，因此，它不会像其他操作系统的软件那样让人感到陌生——尤其是当您需要为它们支付很多钱时！


    ## 您拥有“选择权”


    如前所述，您可以选择决定使用什么样的软件。您还可以选择通过使用 Linux 来设计您的桌面或设备。它使使用电脑或您拥有的任何设备的行为更加个性化——更像是您会感到舒适的东西，并且对您来说相当容易管理。


    其他操作系统的问题在于，不知何故，它们感觉如此难以操控

    '
