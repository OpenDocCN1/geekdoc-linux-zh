  mdcn: "\n## 互联网消息协议\n\n你必须理解的是，Linux 是一个开放系统互连（OSI）互联网模型，这意味着它通过*套接字（sockets）*来工作。为了建立连接，你需要利用监听套接字，以便主机能够发起调用——或者换句话说，建立连接。\n\
    \n通过输入 *listen ()*，用户将能够在程序中执行 *accept ()* 阻塞操作。这会 *binds ()* 将程序连接在一起，使其成为一个整体。现在，为了更清楚地说明问题，你必须理解互联网的基本模型。\n\
    \n互联网模型结合了会话层、表示层和应用层以及 TCP 的端口，为 `bind()` 的发生铺平了道路。现在，你还必须等待发送方和接收方的响应。这使得请求和消息的交换能够轻松进行，直到连接关闭。如果操作得当，发送方和接收方就不用担心消息未发送或通信中断。\n\
    \n然后，连接可以包含在一个线程中，这样网络理解起来就不会太复杂。这样，也可以创建正确的协议栈。\n\n## 处理传输\n\n这为 IP 网络及其包含的各种网络之间提供了经过错误检查、有序且可靠的八位字节流。这用于电子邮件以及大部分万维网。这也是一种潜在的无连接协议，通过处理已传输的数据来工作。它从八位字节\
    \ 0 到 160 工作，包含源端口和目标端口。它还包含序列号和确认号。\n\n数据偏移量也是保留的，与窗口大小、校验和以及紧急指针一起。\n\n基本上，你可以记住以下几点：\n\
    \n-   1. 16 位标识源端口；\n    2. 16 位也标识接收端口；\n    3. 4 位以 32 位字指定数据头；\n    4. 32 位标识确认号；\n\
    \    5. 9 位包含 9 位标志；\n    6. 3 位定义为将来使用而保留的数据。\n\n其他位定义了你可以使用此操作系统为你的应用程序或网站创建的选项。\n\
    \n## 主机解析\n\n关于这一点，你必须记住的一件事是使用语法 *gethostname()*，以便标准库可以进行正确的调用。当你尝试查找程序某个部分的名称并希望将其用于更大的应用程序时，也会发生这种情况。它几乎与\
    \ Python 相同，因为你可以用这种方式编写代码。\n\n## Linux 套接字\n\n你必须理解的是，Linux 是一个开放系统互连（OSI）互联网模型，这意味着它通过*套接字（sockets）*来工作。为了建立连接，你需要利用监听套接字，以便主机能够发起调用——或者换句话说，建立连接。\n\
    \n通过输入 *listen ()*，用户将能够在程序中执行 *accept ()* 阻塞操作。这会 *binds ()* 将程序连接在一起，使其成为一个整体。对此，你可以记住以下内容：\n\
    \n| | | | | | |\n|---|---|---|---|---|---|\n| 服务器：socket() | bind() | listen()\
    \ | accept() | read() | write() | read() |\n| 发送请求：write() | read() | | | | |\
    \ |\n| 接收回复：write() | read() | | | | | |\n| 建立连接：connect | accept() | | | | |\
    \ |\n| 关闭连接：close() | read() | | | | | |\n| 客户端：socket() | connect | write() |\
    \ read() | close() | | |\n\n## Linux 互联网协议\n\n互联网协议的核心是在网络中提供边界，以及允许互联网网络发生的报文中继。\n\
    \n其结构涉及*报头*和*有效负载*，其中报头是主要的 IP 地址，并在某些参数的帮助下连接接口。路由前缀和网络指定也涉及其中，内部或外部网关协议也是如此。可靠性也依赖于端到端协议，但大多数情况下，你可以期望框架如下：\n\
    \n| UDP 报头 | UDP 数据 | 传输层 |\n|---|---|---|\n| IP 报头 | IP 数据 | 互联网层 |\n| 帧报头 |\
    \ 帧数据 | 帧尾 | 链路层 |\n| 数据 | 应用层 | |\n\n## 获取对等信息\n\n为了获取对等信息，你必须确保同时返回 TCP 和 IP\
    \ 信息。这样，你可以确保服务器和客户端都连接到网络。你还可以使用 *getpeername()* 套接字，以便当信息可用时，可以轻松捕获并保存。这为 Linux\
    \ 中涉及的各种方法提供了正确发送和接收的数据，并包含适当的套接字描述符并授予程序中其他部分的权限。有些甚至可能被认为是私有的，以改善用户体验。\n为了接收信息，让套接字\
    \ *TCPAcceptor::accept()* 在网络中盛行。这样，你可以区分来自服务器和客户端的操作。\n\n## 构造与析构\n\n这些连接到套接字的描述符，允许对等\
    \ TCP 端口和对等 IP 地址显示在屏幕上。请注意，这不使用其他语言，除了 C++，这与 Linux 中的同类产品不同。\n析构函数随后能够关闭你建立的任何连接。例如，如果你想注销你的一个社交网络账户，你之所以能够做到，是因为析构函数的存在。\n\
    \n## Linux 和 SMTP 客户端\n\n至于 SMTP 客户端，你可以预期它涉及一些与上面相同的特性——只需做一些调整。你还应该记住，这一切都是关于打开套接字、打开输入和输出流、读取和写入套接字，最后清理客户端端口。你还必须知道它涉及以下内容：\n\
    \n-   1. **数据报通信。** 这意味着当你门户向各个客户端和服务器发送数据报时，本地套接字将始终工作。\n    2. **Linux 通信。**\
    \ 这一次，涉及流和数据报通信。\n    3. **编程套接字。** 当然，你可以预期你将以正确的方式编程套接字！\n\n## 回显客户端设置\n\n在\
    \ Linux 中，回显客户端通过在 `socket()` 内插入参数来工作，因为这意味着你将能够与 `PF_INET` 函数一起使用 IP，以便它们都可以进入\
    \ TCP 套接字。要设置正确的客户端结构，只需记住你需要对之前的代码进行一些调整。\n\n## IO 网络模型\n\n为了获取对等信息，你必须确保同时返回\
    \ TCP 和 IP 信息。这样，你可以确保服务器和客户端都连接到网络。你还可以使用 `getpeername()` 套接字，以便当信息可用时，可以轻松捕获并保存。\n\
    \n为了接收信息，让套接字 `LinuxAcceptor::accept()` 在网络中盛行。这样，你可以区分来自服务器和客户端的操作。\n\n## Linux\
    \ 及其套接字\n\n你还必须理解，你可以主要用 C 语言编写 Linux 程序，因为它们都涉及套接字的使用。套接字就像一座桥梁，将客户端绑定到端口，并负责向服务器发送正确的请求，同时等待其响应。最后，完成数据的发送和接收。\n\
    \n同时，Linux 套接字还能够为服务器创建一个套接字，然后将其自身绑定到端口。在那个阶段，你可以开始监听客户端流量，因为它在增长。你也可以在那时等待客户端，最后，看到数据的发送和接收发生。它的其他功能如下：\n\
    \n**socket_description.** 这允许客户端和服务器的描述显示在屏幕上。\n\n**write buffer.** 这描述了需要发送的数据。\n\
    \n**write buffer length.** 为了写入缓冲区长度，你将必须看到字符串的输出。\n\n**client_socket.** 套接字描述也将显示在顶部。\n\
    \n**address.** 这用于连接函数，以便 `address_len` 位于顶部。\n\n**address_len.** 如果第二个参数为空，这将出现在屏幕上。\n\
    \n**return.** 这有助于返回客户端和套接字的描述。这也使得客户端和服务器之间的交互变得容易。\n\n**server_socket.** 这是位于顶部的套接字的描述。\n\
    \n**backlog.** 这是尚未处理的请求数量。\n\n你也可以时不时地加上个人评论——但绝对不是所有时候！\n"
