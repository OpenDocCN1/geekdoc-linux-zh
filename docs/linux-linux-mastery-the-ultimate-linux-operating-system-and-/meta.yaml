    **who**

    打印当前登录的所有用户名。


    **while**

    执行命令。


    **which**

    在用户的$path中搜索程序文件。


    **whereis**

    在用户的$path、手册页和源文件中搜索程序。


    **wget**

    通过HTTP、HTTPS或FTP检索网页或文件。


    **wc**

    打印字节、单词和行数。


    **watch**

    定期执行/显示程序。


