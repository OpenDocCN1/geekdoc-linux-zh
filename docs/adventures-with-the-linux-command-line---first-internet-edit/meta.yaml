  md: '# **! pattern**


    It is also possible to negate a pattern, so that only records that do not match
    a specified pattern are selected.


    # **pattern, pattern**


    Two patterns separated by a comma is called a *range pattern*. With it, once the
    first pattern is matched, every subsequent record matches until the second pattern
    is matched. Thus, this type of pattern will select a range of records. Let''s
    imagine that we have a list of records and that the first field in each record
    contains a sequential record number:


    ```

    0001    field  field  field

    0002    field  field  field

    0003    field  field  field

    ```


    and so on. And let''s say that we want to extract records 0050 through 0100, inclusive.
    To do so, we could use a range pattern like this:


    ```

    $1 == "0050", $1 == "0100"

    ```


    # **Fields and Records**


    The AWK language is so useful because of its ability to automatically separate
    fields and records. While the default is to separate records by newlines and fields
    by whitespace, this can be adjusted. The `/etc/passwd` file, for example, does
    not separate its fields with whitespace; rather, it uses colons (:). AWK has a
    built in variable named FS (field separator) that defines the delimiter separating
    fields in a record. Here is an AWK program that will list the user ID and the
    user''s name from the file:


    ```

    BEGIN { FS = ":" }

    { print $1, $5 }

    ```


    This program has two pattern/action pairs. The first action is performed before
    the first record is read and sets the input field separator to be the colon character.


    The second pair contains only an action and no pattern. This will match every
    record. The action prints the first and fifth fields from each record.


    The FS variable may contain a regular expression, so really powerful methods can
    be used to separate fields.


    Records are normally separated by newlines, but this can be adjusted too. The
    built-in variable RS (record separator) defines how records are delimited. A common
    type of record consists of multiple lines of data separated by one or more blank
