  md: '# ## 12 Coding Standards Part 1: Our Own


    Most computer programming is done by organizations and teams. Some programs are
    developed by lone individuals within a team and others by collaborative groups.
    In order to promote program quality, many organizations develop formal programming
    guidelines called *coding standards* that define specific technical and stylistic
    coding practices to help ensure code quality and consistency.


    In this adventure, we''re going to develop our own shell script coding standard
    to be known henceforth as the *LinuxCommand Bash Script Coding Style Guide*. The
    Source adventure is a suggested prerequisite for this adventure.


    Roaming around the Internet, we can find lots of articles about "proper" shell
    script standards and practices. Some are listed in the "Further Reading" section
    at the end of this adventure. While the scripts presented in TLCL do not follow
    any particular standard (instead, they present common practice from different
    historical perspectives), their design promotes several important ideas:


    +   1. **Write cleanly and simply.** Look for the simplest and most easily understood
    solutions to problems.

    2. **Use modern idioms, but be aware of the old ones.** It''s important that scripts
    fit within common practice so that experienced people can easily understand them.

    3. **Be careful and defensive.** Follow Murphy''s Law: anything that can go wrong
    eventually will.

    4. **Document your work.**

    5. **There are lots of ways to do things, but some ways are better than others.**


    Coding standards generally support the same goals, but with more specificity.


    In reviewing the Internet''s take on shell scripting standards, one might notice
    a certain undercurrent of hostility towards using the shell as a programming medium
    at all. Why is this?


    Most programmers don''t learn the shell at the beginning of their programming
    careers; instead, they learn it (haphazardly) after they have learned one or more
    traditional programming languages. Compared to most programming languages, the
    shell is an odd beast that seems, to many, a chaotic mess. This is largely due
    to the shell''s unique role as both a command line interpreter and a scripting
    language.


    As with all programming languages, the shell has its particular strengths and
    weaknesses. The shell is good at solving certain kinds of problems, and not so
    good at others. Like all good artists, we need to understand the bounds of our
    medium.'
  merge: -1
