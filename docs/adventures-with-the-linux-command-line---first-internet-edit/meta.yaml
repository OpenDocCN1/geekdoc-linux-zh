  pgno: 120
- img_proc: false
  md: "language extension for this problem), but it's not pretty. It is best to avoid\
    \ trying to read this type of file.\n\n# **Convert a File Into TSV Format**\n\n\
    A frequently available alternative to the CSV file is the TSV (tab separated value)\
    \ file. This file format uses tab charachers as the field separators:\n\n```\n\
    awk 'BEGIN {OFS=\"\\t\"} {print $1,$2,$3,$4,$5}' random_table.dat\n```\n\nAgain,\
    \ writing these files is easy to do. We just set the output field separator to\
    \ a tab character. In regards to reading, most applications that write CSV files\
    \ can also write TSV files. Using TSV files avoids the embedded comma problem\
    \ we often see when attempting to read CSV files.\n\n# **Print the Total for Each\
    \ Row**\n\nIf all we need to do is some simple addition, this is easily done:\n\
    \n```\nawk '\n{\n    t = $1 + $2 + $3 + $4 + $5\n    printf(\"%s = %6d\\n\", $0,\
    \ t)\n}\n' random_table.dat\n```\n\n# **Print the Total for Each Column**\n\n\
    Adding up the column is pretty easy, too. In this example, we use a loop and array\
    \ to maintain running totals for each of the five columns in our data file:\n\n\
    ```\nawk '\n{\n    for (i = 1; i <= 5; i++) {\n        t[i] += $i\n    }\n   \
    \ print\n}\nEND {\n    print \"  ===\"\n    for (i = 1; i <= 5; i++) {\n     \
    \   printf(\"  %7d\", t[i])\n    }\n    printf(\"\\n\", \"\")\n}\n' random_table.dat\n\
    ```\n\n# **Print the Minimum and Maximum Value in Column 1**\n\n```\nawk '\nBEGIN\
