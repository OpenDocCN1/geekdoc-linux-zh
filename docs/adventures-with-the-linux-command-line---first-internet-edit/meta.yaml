    and it will display the name. To see the entire set of available color schemes,
    type :colo followed by a space, then the tab key. This will trigger vim’s autocomplete
    and we should see the first name in the list. Subsequent use of the tab key will
    cycle through the list and we can try each one.


    The ‘desert’ color scheme looks pretty good with shell scripts, so let’s add this
