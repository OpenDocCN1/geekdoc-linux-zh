  md: 'This will ensure that an existing table of saved rows will persist, even if
    we reload the trigger.


    After creating the table, we create a trigger called `backup_row_before_delete`
    to copy data from the `Package_Files` table to the `PF_Backup` table just before
    any row in `Package_Files` is deleted.


    In order to reference data that might be used by the trigger, SQL provides the
    `NEW` reference for new data that is inserted or updated, and the `OLD` reference
    for previous data that is updated or deleted. In our example, we use the `OLD`
    reference to refer to the data about to be deleted.


    # Performing Backups


    Since SQLite uses an ordinary file to store each database (as opposed to the exotic
    methods used by some other systems), we can use regular command line tools such
    as `cp` to perform database backups. There is an interesting SQL method we can
    use, too. The `.dump` dot command will produce a stream of SQL statements that
    will fully reproduce the database including tables, views, triggers, etc. To output
    the database this way, we need only do the following:


    ```

    sqlite> .dump

    ```


    The stream will appear on standard output or we can use the `.output` dot command
    to direct the stream to the file of our choice.


    One interesting application of this technique would be to combine tables from
    multiple databases into one. For example, let''s imagine we had several Raspberry
    Pi computers each performing data logging of an external sensor. We could collect
    dumps from each machine and combine all of the tables into a single database for
    data analysis and reporting.


