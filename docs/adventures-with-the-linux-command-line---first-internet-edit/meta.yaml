    *Configured xterm*


    A complete list of the Xresources configuration values for `xterm` appears in
    its man page.


    While `xterm` does not appear to have menus, it actually has 3 different ones,
    which are made visible by holding the `Ctrl` key and pressing a mouse button.
    Different menus appear according to which button is pressed. The scroll bar on
    the side of the terminal has a behavior like ancient X applications. Hint: after
    enabling the scroll bar with the menu, use the middle mouse button to drag the
    slider.


    Though `xterm` offers neither tabs nor profiles, it does have one strange extra
    feature: it can display a Tektronix 4014 graphics terminal emulator window. The
    Tektronix 4014 was an early and very expensive storage tube graphics display that
    was popular with computer aided design systems in the 1970s. It''s extremely obscure
    today. The normal xterm text window is called the VT window. The name comes from
    the DEC VT220, a popular computer terminal of the same period. `xterm`, and most
    terminals today, emulate this terminal to a certain extent. `xterm` is not quite
    the same as the VT terminal, and it has its own specific `terminfo` entry (see
    the tput adventure for some background on'
