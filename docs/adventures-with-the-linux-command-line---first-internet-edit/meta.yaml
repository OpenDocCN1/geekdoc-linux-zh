  md: "```\nCREATE PROCEDURE procudure_name\nAS\n    [block of SQL code];\n```\n\n\
    Parameters can be passed to stored procedures. Here is an example:\n\n```\nCREATE\
    \ PROCEDURE list_pkg_files @package VARCHAR(60)\nAS\n    SELECT package_name,\
    \ file\n    FROM Package_Files\n    WHERE package_name = @package;\n```\n\nTo\
    \ call this procedure, we would do this:\n\n```\nEXEC list_package_files @package\
    \ = 'bash';\n```\n\nUnfortunately, SQLite does not support stored procedures.\
    \ It does, however, support the second method of code storage, triggers.\n\nTriggers\
    \ are stored blocks of code that are automatically called when some event occurs\
    \ and a specified condition is met. Triggers are typically used to perform certain\
    \ maintenance tasks to keep the database in good working order.\n\nTriggers can\
    \ be set to activate before, after, or instead of the execution of INSERT, DELETE,\
    \ or UPDATE statements. In the example below, we will have a trigger activate\
    \ before a DELETE is performed on the Package_Files table.\n\n```\n/*\n    trigger_demo.sql\n\
    \n    Trigger demo where we create a \"trash can\" for the\n    Package_Files\
    \ table and set a trigger to copy rows\n    to the PF_Backup table just before\
    \ they are deleted\n    from Package_Files.\n*/\n\n-- Create backup table with\
    \ the same schema as Package_Files\n\nCREATE TABLE IF NOT EXISTS PF_Backup (\n\
    \    package_name VARCHAR(60),\n    file         VARCHAR(120),\n    size_bytes\
    \   INTEGER\n);\n\n-- Define trigger to copy rows into PF_Backup as they are\n\
    -- deleted from Package_Files\n\nCREATE TRIGGER backup_row_before_delete\nBEFORE\
    \ DELETE ON Package_Files\nBEGIN\n    INSERT INTO PF_Backup\n    VALUES (OLD.package_name,\
    \ OLD.file, OLD.size_bytes);\nEND;\n```\n\nThe first thing we do is create a table\
    \ to hold our deleted rows. We use a slightly different form of the CREATE TABLE\
    \ statement to create the table only if it does not already exist."
