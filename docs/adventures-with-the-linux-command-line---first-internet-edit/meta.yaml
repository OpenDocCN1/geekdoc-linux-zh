  md: "An index is a data structure the database maintains that speeds up database\
    \ searches. It's a sorted list of rows in a table ordered by elements in one or\
    \ more columns. Without an index, a table is sorted according to values in a hidden\
    \ column called `rowid`. The values in this column are integers that start with\
    \ 1 and increment each time a row is added to the table. Here we see a query that\
    \ selects the 100th row from the `Package_Stats` table.\n\n```\nsqlite> .header\
    \ on\nsqlite> .mode column\nsqlite> .width 20 -5 -8 -8 -8 -8\nsqlite> SELECT *\
    \ FROM Package_Stats WHERE rowid = 100;\npackage_name         count tot_size \
    \ min_size max_size avg_size\n-------------------- ----- --------- -------- --------\
    \ ---------\ncups-server-common     595  1996400        0   370070  3355.294\n\
    ```\n\nOur database server can locate this row in the table very quickly because\
    \ it already knows where to find the 100th row. However, if we want to search\
    \ for the row that contains package name `cups-server-common`, SQLite must examine\
    \ every row in the table to locate the matching row. To facilitate performance\
    \ tuning, SQLite provides a way to see what search strategy is used during a query.\n\
    \n```\nsqlite> .width -8 -5 -4 55\nsqlite> EXPLAIN QUERY PLAN\n   ...> SELECT\
    \ * FROM Package_Stats WHERE package_name = 'cups-server-common';\nselectid order\
    \ from detail\n-------- ----- --- --------------------------------------------------\n\
    \       0     0   0 SCAN TABLE Package_Stats\n```\n\nWe can see from the `SCAN\
    \ TABLE Package_Stats` the SQLite performs a sequential search of the table during\
    \ this query.\n\nTo create an index to allow faster searches of `package_name`\
    \ we can do the following:\n\n```\nsqlite> CREATE INDEX idx_package_name\n   ...>\
    \ ON Package_Stats (package_name);\n```\n\nAfter doing this, we'll look at the\
    \ query plan and see the difference.\n\n```\nsqlite> EXPLAIN QUERY PLAN\n   ...>\
    \ SELECT * FROM Package_Stats WHERE package_name = 'cups-server-common';\n selectid\
    \ order from detail\n--------- ----- --- --------------------------------------------------\n\
    \       0     0   0 SEARCH TABLE Package_Stats USING INDEX idx_package_name\n\
    ```\n\nHereafter, when we search the table for a package name, SQLite will use\
    \ the index to directly get to the row rather than looking at every row searching\
    \ for a match. So why don't we just index everything? The reason we don't is that\
    \ indexes impose overhead every time a row is inserted, deleted, or updated since\
    \ the indexes must be kept up to date. Indexes are best used on tables that are\
    \ read more often than written to.\n\nWe probably won't see much of a performance\
    \ improvement when searching the `Package_Stats` table because it's just not that\
    \ big, but on a large table the improvement can be substantial."
