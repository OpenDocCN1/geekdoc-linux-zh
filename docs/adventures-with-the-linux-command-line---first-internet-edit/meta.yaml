    # Controlling the Output


    As we can see from the output above, the default format is fine for further processing
    by tools such as `awk`, but it leaves a lot to be desired when it comes to being
    read by humans. We can adjust the output format with some dot commands. We''ll
    also add the `LIMIT` clause to the end of our query to output just 10 rows.


    ```

    sqlite> .headers on

    sqlite> .mode column

    sqlite> SELECT * FROM Package_Descriptions LIMIT 10;

    package_name description

    ----------- -------------------------------------------------------

    a2ps GNU a2ps - ''Anything to PostScript'' converter and pretty-printer

    accountsserv query and manipulate user account information

    acl Access control list utilities

    acpi-support scripts for handling many ACPI events

    acpid Advanced Configuration and Power Interface event daemon

    adduser add and remove users and groups

    adium-theme- Adium message style for Ubuntu

    adwaita-icon default icon theme of GNOME (small subset)

    aisleriot GNOME solitaire card game collection

    alsa-base ALSA driver configuration files

    ```


    By using the `.headers on` and `.mode column` dot commands, we add the column
    headings and change the output to column format. These settings stay in effect
    until we change them. The `.mode` dot command has a number of interesting possible
