    \ need to do this, but there are some cases where this might be handy. For example,\
    \ if we wanted to insert one file inside of another, we could use the `getline`\
    \ function in AWK. Here's an example that adds a header and footer to an existing\
    \ body text file:\n\n```\nawk '\nBEGIN {\n    while (getline <\"header.txt\" >\
    \ 0) {\n        print $0\n    }\n}\n{print}\nEND {\n    while (getline <\"footer.txt\"\
    \ > 0) {\n        print $0\n    }\n}\n' < body.txt > finished_file.txt\n```\n\n\
    `getline` is quite flexible and can be used in a variety of ways:\n\n# **getline**\n\
    \nIn its most basic form, `getline` reads the next record from the current input\
    \ stream. `$0`, `NF`, `NR`, and `FNR` are set.\n\n# **getline var**\n\nReads the\
    \ next record from the current input stream and assigns its contents to the variable\
    \ `var`. `var`, `NR`, and `FNR` are set.\n\n# **getline <file**\n\nReads a record\
    \ from *file*. `$0` and `NF` are set. It's important to check for errors when\
    \ reading from files. In the earlier example above, we specified a while loop\
    \ as follows:\n\n```\nwhile (getline <\"header.txt\" > 0)\n```\n\nAs we can see,\
    \ `getline` is reading from the file `header.txt`, but what does the \"> 0\" mean?\
    \ The answer is that, like most functions, `getline` returns a value. A positive\
    \ value means success, zero means EOF (end of file), and a negative value means\
    \ some other file-related problem, such as file not found has occurred. If we\
    \ did not check the return value, we might end up with an infinite loop."
