    \ + 1\n```\n\n# User Defined Functions\n\nIn addition to the built-in string and\
    \ arithmetic functions, AWK supports user-defined functions much like the shell.\
    \ The mechanism for passing parameters is different, and more like traditional\
    \ languages such as C.\n\n***Defining a function***\n\nA typical function definition\
    \ looks like this:\n\n```\nfunction name(parameter-list) {\n    statements\n```"
  merge: -1
  pgno: 118
- img_proc: false
  md: "```\nreturn expression\n}\n```\n\nWe use the keyword `function` followed by\
    \ the name of the function to be defined. The name must be immediately followed\
    \ by the opening left parenthesis of the parameter list. The parameter list may\
    \ contain zero or more comma-separated parameters. A brace delimited code block\
    \ follows with one or more statements. To specify what is returned by the function,\
    \ the `return` statement is used, followed by an expression containing the value\
    \ to be returned. If we were to convert our previous dice rolling example into\
    \ a function, it would look like this:\n\n```\nfunction dice_roll() {\n    return\
    \ int(6 * rand()) + 1\n}\n```\n\nFurther, if we wanted to generalize our function\
    \ to support different possible maximum values, we could code this:\n\n```\nfunction\
    \ rand_integer(max) {\n    return int(max * rand()) + 1\n}\n```\n\nand then change\
    \ `dice_roll` to make use of our generalized function:\n\n```\nfunction dice_roll()\
    \ {\n    return rand_integer(6)\n}\n```\n\n# Passing Parameters to Functions\n\
    \nAs we saw in the example above, we pass parameters to the function, and they\
    \ are operated upon within the body of the function. Parameters fall into two\
    \ general classes. First, there are the *scalar variables*, such as strings and\
    \ numbers. Second are the arrays. This distinction is important in AWK because\
    \ of the way that parameters are passed to functions. Scalar variables are *passed\
    \ by value*, meaning that a copy of the variable is created and given to the function.\
    \ This means that scalar variables act as local variables within the function\
    \ and are destroyed once the function exits. Array variables, on the other hand,\
    \ are *passed by reference* meaning that a pointer to the array's starting position\
    \ in memory is passed to the function. This means that the array is not treated\
    \ as a local variable and that any change made to the array persists once the\
    \ program exits the function. This concept of passed by value versus passed by\
    \ reference shows up in a lot of programming languages so it's important to understand\
    \ it.\n\n# Local Variables\n\nOne interesting limitation of AWK is that we cannot\
    \ declare local variables within the body of a function. There is a workaround\
    \ for this problem. We can add variables to the parameter list. Since all scalar\
    \ variables in the parameter list are passed by value, they will be treated as\
    \ if they are local variables. This does not apply to arrays, since they are always\
    \ passed by reference. Unlike many other languages, AWK does not enforce the parameter\
    \ list, thus we can add parameters that are not used by the caller of the function."
  merge: -1
  pgno: 119
- img_proc: false
  md: "In most other languages, the number and type of parameters passed during a\
    \ function call must match the parameter list specified by the function's declaration.\n\
    \nBy convention, additional parameters used as local variables in the function\
    \ are preceded by additional spaces in the parameter list like so:\n\n```\nfunction\
    \ my_funct(param1, param2, param3,    local1, local2)\n```\n\nThese additional\
    \ spaces have no meaning to the language, they are there for the benefit of the\
    \ human reading the code.\n\nLet's try some short AWK programs on some numbers.\
    \ First we need some data. Here's a little AWK program that produces a table of\
    \ random integers:\n\n```\n# random_table.awk - generate table of random numbers\n\
    \nfunction rand_integer(max) {\n    return int(max * rand()) + 1\n}\n\nBEGIN {\n\
    \    srand()\n    for (i = 0; i < 100; i++) {\n        for (j = 0; j < 5; j++)\
    \ {\n            printf(\"%5d\", rand_integer(99999))\n        }\n        printf(\"\
    \\n\", \"\")\n    }\n}\n```\n\nIf we store this in a file, we can run it like\
    \ so:\n\n```\nme@linuxbox ~ $ awk -f random_table.awk > random_table.dat\n```\n\
    \nAnd it should produce a file containing 100 rows of 5 columns of random integers.\n\
    \n# Convert a File Into CSV Format\n\nOne of AWK's many strengths is file format\
    \ conversion. Here we will convert our neatly arranged columns of numbers into\
    \ a CSV (comma separated values) file.\n\n```\nawk 'BEGIN {OFS=\",\"} {print $1,$2,$3,$4,$5}'\
    \ random_table.dat\n```\n\nThis is a very easy conversion. All we need to do is\
    \ change the output field separator (OFS) and then print all of the individual\
    \ fields. While it is very easy to write a CSV file, reading one can be tricky.\
    \ In some cases, applications that write CSV files (including many popular spreadsheet\
    \ programs) will create lines like this:\n\n```\nword1, \"word2a, word2b\", word3\n\
    ```\n\nNotice the embedded comma in the second field. This throws the simple AWK\
    \ solution (FS=\",\") out the window. Parsing this kind of file can be done (gawk,\
    \ in fact has a"
