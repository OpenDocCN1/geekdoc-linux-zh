  md: "on most modern commercial Unix systems. During installation is it often symlinked\
    \ to `ksh`.\n\n```\n#!/usr/bin/ksh\n\n# longest-word.ksh : find longest string\
    \ in a file\n\nfor i; do\n  if [[ -r \"$i\" ]]; then\n    max_word=\n    max_len=0\n\
    \    for j in $(strings \"$i\"); do\n      len=${#j}\n      if (( len > max_len\
    \ )); then\n        max_len=$len\n        max_word=$j\n      fi\n    done\n  \
    \  print \"$i: '$max_word' ($max_len characters)\"\n  fi\ndone\n```\n\nAs we can\
    \ see in this example, `ksh` syntax is very close to `bash`. The one visible difference\
    \ is the `print` command used in place of `echo`. Korn shell has `echo` too, but\
    \ `print` is the preferred Korn shell command for outputting text. Another subtle\
    \ difference is the way that pipelines work in `ksh`. As we learned in Chapter\
    \ 28 of TLCL, a construct such as:\n\n```\n#!/bin/bash\nstr=\"\"\necho \"foo\"\
    \ | read str\necho $str\n```\n\nalways produces an empty result because, in `bash`\
    \ pipelines, each command in a pipeline is executed in a subshell, so its data\
    \ is destroyed when the subshell exits. In this example, the final command (`read`)\
    \ is in a subshell, and thus `str` remains empty in the parent process.\n\nIn\
    \ `ksh`, the internal organization of pipelines is different. When we do this\
    \ in `ksh`:\n\n```\n#!/usr/bin/ksh\nstr=\"\"\necho \"foo\" | read str\necho $str\n\
    ```\n\nThe output is \"foo\" because in the `ksh` pipeline, the `echo` is in the\
    \ subshell rather than the `read`.\n\n# ## zsh - Z Shell\n\nAt first glance, the\
    \ Z shell does not differ very much from `bash` when it comes to scripting:\n\n\
    ```\n#!/bin/zsh\n\n# longest-word.zsh : find longest string in a file\n```"
