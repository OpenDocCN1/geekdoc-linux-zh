    All the files are human-readable text, so feel free to give them a look. The data
    sets in the archive are the `.tsv` files. These are tab-separated value files.
    The first one is the `package_descriptions.tsv` file. This contains two columns
    of data; a package name and a package description. The second file, named `package_files.txv`,
    has three columns: a package name, the name of a file installed by the package
    and the size of the file.


    # Starting sqlite3


    To launch SQLite, we simply issue the command `sqlite3` followed optionally by
    the name of a file to hold our database of tables. If we do not supply a file
    name, SQLite will create a temporary database in memory.


    ```

    me@linuxbox:~/adventure-sql$ sqlite3

    SQLite version 3.22.0 2018-01-22 18:45:57

    Enter ".help" for usage hints.

    Connected to a transient in-memory database.

    Use ".open FILENAME" to reopen on a persistent database.

    sqlite>

    ```


    When loading is complete, SQLite will present a prompt where we can enter commands.
    Commands can be either SQL statements or *dot commands* that are used to control
    SQLite itself. To see a list of the available dot commands, we enter `.help` at
    the prompt.


    ```

    sqlite> .help

    ```


    There are only a few of the dot commands that will be of interest to us and they
    deal mainly with how output is formatted. To exit `sqlite3`, we enter the dot
    command `.quit` at the prompt.


    ```

    sqlite> .quit

    ```


    Though we can interact directly with the `sqlite3` program using the `sqlite>`
    prompt, `sqlite3` can also accept streams of dot commands and SQL statements through
    standard input. This is how SQLite is most often used.


