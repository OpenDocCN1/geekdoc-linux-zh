  md: '# # Customizing tmux


    As we would expect, tmux is *extremely* configurable. When tmux starts, it reads
    the files `/etc/tmux.conf` and `~/.tmux.conf` if they exist. It is also possible
    to start tmux with the `-f` option and specify an alternate configuration file.
    This way, we can have multiple custom configurations.


    The number of configuration commands is extensive, just as it is with screen.
    The tmux man page has the full list.


    As an example, here is a hypothetical configuration file that changes the command
    prefix key from `Ctrl-b` to `Ctrl-a` and creates a new session with 4 windows:


    ```

    # Sample tmux.conf file


    # Change the command prefix from Ctrl-b to Ctrl-a

    unbind-key C-b

    set-option -g prefix C-a

    bind-key C-a send-prefix


    #####

    # Create session with 4 windows

    #####


    # Create session and first window

    new-session -d -s MySession


    # Create second window and vertically split it

    new-window

    split-window -d -h


    # Create third window (and name it) running Midnight Commander

    new-window -d -n MdnghtCmdr mc


    # Create fourth window (and name it) running htop

    new-window -d -n htop htop


    # Give focus to the first window in the session

    select-window -t 0

    ```


    Since this configuration creates a new session, we should launch tmux by entering
    the command `tmux attach` to avoid the default behavior of automatically creating
    a new session. Otherwise, we end up with an additional and unwanted session.


    Here’s a useful configuration file that remaps the keys used to create panes and
    changes copy and paste to behave more like `vim`.


    ```

    # Change bindings for pane-splitting from " and % to | and -

    unbind ''"''

    unbind %

    bind | split-window -h

    bind - split-window -v


    # Enable mouse control (clickable windows, panes, resizable panes)

    set -g mouse on


    # Set color support to allow visual mode highlighting to work in vim

    ```'
  merge: -1
