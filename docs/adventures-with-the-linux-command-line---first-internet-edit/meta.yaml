  md: '+   - **-h, -help** The help option displays the help message we saw above.
    The help option is mutually exclusive with the other `new_script` options and
    after the help message is displayed, `new_script` exits.

    - **-q, -quiet** The quiet option causes `new_script` to become non-interactive
    and to output a base template without customization. In this mode, `new_script`
    will output its script template to standard output if no output script file is
    specified.

    - **-s, -root** The superuser option adds a routine to the template that requires
    the script to be run by the superuser. If a non-privileged user attempts to run
    the resulting script, it will display an error message and terminate.


    # ## Creating Our First Template


    Let''s make a template to demonstrate how `new_script` works and what it can do.
    First, we''ll launch `new_script` and give it the name of a script we want to
    create.


    ```

    me@linuxbox:~$ new_script new_script-demo


    -----------------------------------------------------

    ** Welcome to new_script version 3.5.3 **

    -----------------------------------------------------


    File ''new_script-demo'' exists. Overwrite [y/n] > y

    ```


    We''ll be greeted with a welcome message. If the script already exists, we are
    prompted to overwrite. If we had not specified a script file name, we would be
    prompted for one.


    ```

    -----------------------------------------------------

    ** Comment Block **


    The purpose is a one line description of what the script does.

    -----------------------------------------------------


    The purpose of the script is to: > demonstrate the new_script template


    -----------------------------------------------------


    The script may be licensed in one of two ways:

    1. All rights reserved (default) or

    2. GNU GPL version 3 (preferred).

    -----------------------------------------------------


    Include GPL license header [y/n]? > y

    ```


    The first information `new_script` asks for are the purpose of the script and
    how it is licensed. Later, when we examine the finished template below, we''ll
    see that `new_script` figures out the author''s name and email address, as well
    as the copyright date.


    ```

    -----------------------------------------------------

    ** Privileges **


    The template may optionally include code that will prevent it from

    running if the user does not have superuser (root) privileges.

    -----------------------------------------------------

    ```'
