    \            fi\n        done\n        print \"$i: '$max_word' ($max_len characters)\"\
    \n    fi\ndone\n```\n\nIt runs scripts the same way that `bash` does. This is\
    \ to be expected, as `zsh` is intended to be a drop-in replacement for `bash`\
    \ in most cases. A couple of things to note however. First, `zsh` handles pipelines\
    \ like the Korn shell does; the last command in a pipeline is executed in the\
    \ current shell. Second, in `zsh`, the first element of an array is index 1, not\
    \ 0 as it in `bash` and `ksh`.\n\nWhere `zsh` does differ significantly is in\
    \ the number of bells and whistles it provides for interactive use (some of which\
    \ can be applied to scripting as well). Let's take a look at a few:\n\n# **Tab\
    \ Completion**\n\nMany kinds of tab completion are supported by `zsh`. These include\
    \ command names, command options, and arguments.\n\nWhen using the `cd` command,\
    \ repeatedly pressing the tab key first displays a list of the available directories,\
    \ then begins to cycle through them. For example:\n\n```\nme@linuxbox ~ $ cd <tab>\n\
    \nme@linuxbox ~ $ cd <tab>\nDesktop/    Documents/    Downloads/    Music/   \
    \ Pictures/    Public/\nTemplates/    Videos/\n\nme@linuxbox ~ $ cd Desktop/<tab>\n\
    Desktop/    Documents/    Downloads/    Music/    Pictures/    Public/\nTemplates/\
    \    Videos/\n\nme@linuxbox ~ $ cd Documents/\nDesktop/    Documents/    Downloads/\
    \    Music/    Pictures/    Public/\nTemplates/    Videos/\n```\n\n`zsh` can be\
    \ configured to display a highlighted selector on the list of directories, and\
    \ we can use the arrow keys to directly move the highlight to the desired entry\
    \ in the list to select it.\n\nWe can also switch directories by replacing one\
    \ part of a path name with another:\n\n```\nme@linuxbox ~ $ cd /usr/local/share\n\
    ```\n\n148 Other Shells"
