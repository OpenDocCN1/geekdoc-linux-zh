    Regular expressions are most often used in patterns, but they are also used in
    some of the built-in variables such as FS and RS, and they have various roles
    in the string functions which we will discuss shortly.

    Let’s try using some simple regular expressions to tally the different file types
    in our directory listing (we’ll make clever use of an associative array too).


    ```

    ls -l /usr/bin | awk ''

    $1 ~ /^-/ {t["Regular Files"]++}

    $1 ~ /^d/ {t["Directories"]++}

    $1 ~ /^l/ {t["Symbolic Links"]++}

    END {for (i in t) print i ":\t" t[i]}

    ''

    ```


    In this program, we use regular expressions to identify the first character of
    the first field and increment the corresponding element in array t. Since we can
    use strings as array indexes in AWK, we spell out the file type as the index.
    This makes printing the results in the END action easy, as we only have to traverse
    the array with `for (i in t)` to obtain both the name and the accumulated total
    for each type.


    # Output Functions


    **print expr1, expr2, expr3,...**

    As we have seen, `print` accepts a comma-separated list of arguments. An argument
    can be any valid expression; however, if an expression contains a relational operator,
    the entire argument list must be enclosed in parentheses.

    The commas are important, because they tell AWK to separate output items with
    the output field separator (OFS). If omitted, AWK will interpret the members of
    the argument list as a single expression of string concatenation.


    **printf(format, expr1, expr2, expr3,...)**

    In AWK, `printf` is like the corresponding shell built-in (see TLCL Chapter 21
    for details). It formats its list of arguments based the contents of a *format
    string*. Here is an example where we output a list of files and their sizes in
    kilobytes:


    ```

    ls -l /usr/bin | awk ''{printf("%-30s%8.2fK\n", $9, $5 / 1024)}''

    ```


    # Writing to Files and Pipelines


    In addition to sending output to stdout, we can also send output to files and
    pipelines.


    ```

    ls -l /usr/bin | awk ''

    $1 ~ /^-/ {print $0 > "regfiles.txt"}

    $1 ~ /^d/ {print $0 > "directories.txt"}

    ''

    ```'
