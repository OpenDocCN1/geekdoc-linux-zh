  md: "Now let’s delete the rows in the `Package_Files` table.\n\n```\nsqlite> DELETE\
    \ FROM Package_Files WHERE package_name = 'sqlite3';\n```\n\nWe can confirm the\
    \ deletion by running our query again and we see an empty result.\n\n```\nsqlite>\
    \ .header on\nsqlite> .mode column\nsqlite> .width 12 50 -10\nsqlite> SELECT *\
    \ FROM Package_Files WHERE package_name = 'sqlite3';\nsqlite>\n```\n\nSince we\
    \ saved an SQL stream that can restore the deleted rows, we can now put them back\
    \ in the table. The `.read` dot command can read the stream and execute it as\
    \ though it came from standard input.\n\n```\nsqlite> .read insert_sqlite3.sql\n\
    ```\n\nNow when we run our query, we see that the rows have been restored.\n\n\
    ```\nsqlite> SELECT * FROM Package_Files WHERE package_name = 'sqlite3';\npackage_name\
    \ file                                      size_bytes\n----------- ----------------------------------------\
    \ ----------\nsqlite3      /usr/bin/sqlldiff                                1103280\n\
    sqlite3      /usr/bin/sqlite3                                 1260976\nsqlite3\
    \      /usr/share/doc/sqlite3/copyright                   1261\nsqlite3      /usr/share/man/man1/sqlite3.1.gz\
    \                   3596\nsqlite3      /usr/share/doc/sqlite3/changelog.Debian.gz\
    \           35\n```\n\n# **Adding and Deleting Columns**\n\nSQL provides the `ALTER\
    \ TABLE` statement to modify table’s schema. To demonstrate this, we will add\
    \ a couple of columns to the `Package_Descriptions` table and fill them with values\
    \ calculated from the `Package_Files` table. We’ll place the necessary SQL in\
    \ the `add_column.sql` file.\n\n```\n-- add_column.sql\n\n-- Add and populate\
    \ columns to Package_Descriptions\n\nALTER TABLE Package_Descriptions ADD COLUMN\
    \ files INTEGER;\nALTER TABLE Package_Descriptions ADD COLUMN size INTEGER;\n\n\
    UPDATE Package_Descriptions\n   SET files = (SELECT COUNT(file)\n            \
    \      FROM Package_Files\n                 WHERE Package_Files.package_name =\n\
    \                       Package_Descriptions.package_name),\n       size = (SELECT\
    \ SUM(size_bytes)\n                 FROM Package_Files\n                WHERE\
    \ Package_Files.package_name =\n                      Package_Descriptions.package_name);\n\
    ```\n\nWe’ll execute the statements and examine resulting schema.\n\n```\nsqlite>\
    \ .read add_column.sql\nsqlite> .schema\nCREATE TABLE Package_Descriptions (\n\
    \    package_name VARCHAR(60),\n```"
