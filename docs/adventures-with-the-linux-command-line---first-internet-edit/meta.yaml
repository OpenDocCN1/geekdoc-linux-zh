  md: 'the first thing that happens is that the output stream is started by either
    creating *file* or, if *file* already exists, truncating it to zero length. This
    means that if *command* completely fails or doesn''t even exist, *file* will end
    up with zero length. This can be a safety issue for new users who might overwrite
    (or truncate) a valuable file.


    To avoid this, we can do one of two things. First we can use the “>>” operator
    instead of “>” so that output will be appended to the end of *file* rather than
    the beginning. Second, we can set the “noclobber” shell option which prevents
    redirection from overwriting an existing file. To activate this, we enter:


    ```

    set -o noclobber

    ```


    Once we set this option, attempts to overwrite an existing file will cause the
    following error:


    ```

    bash: file: cannot overwrite existing file

    ```


    The effect of the `noclobber` option can be overridden by using the `>|` redirection
    operator like so:


    ```

    command >| file

    ```


    To turn off the noclobber option we enter this command:


    ```

    set +o noclobber

    ```


