  md: '# # 8 Power Terminals


    Over the course of our many lessons and adventures, we have learned a lot about
    the shell, and explored many of the common command line utilities found on Linux
    systems. There is, however, one program we have overlooked, and it may be among
    the most important and most frequently used of them all– our terminal emulator.


    In this adventure, we are going to dig into these essential tools and look at
    a few of the different terminal programs and the many interesting things we can
    do with them.


    # ## A Typical Modern Terminal


    Graphical desktop environments like GNOME, KDE, LXDE, XFCE, etc. all include terminal
    emulators as standard equipment. We can think of this as a safety feature because,
    if the desktop environment suffers from some lack of functionality (and they all
    do), we can still access the shell and actually get stuff done.


    Modern terminal emulators are quite flexible and can be configured in many ways:


    ![](bbox=[0.18, 0.431, 0.813, 0.776])


    *gnome-terminal preferences dialog*


    # ### Size


    Terminal emulators display a window that can be adjusted to any size from the
    sublime to the ridiculous. Many terminals allow configuration of a default size.'
  merge: -1
  pgno: 124
- img_proc: false
  md: 'The “normal” size for a terminal is 80 columns by 24 rows. These dimensions
    were inherited from the size of common hardware terminals, which, in turn, were
    influenced by the format of IBM punch cards (80 columns by 12 rows). Some applications
    expect 80 by 24 to be the minimum size, and will not display properly when the
    size is smaller. Making the terminal larger, on the other hand, is preferable
    in most situations, particularly when it comes to terminal height. 80 columns
    is a good width for reading text, but having additional height provides us with
    more context when working at the command line.


    Another common width is 132 columns, derived from the width of wide fan-fold computer
    paper. Though this is too wide for comfortable reading of straight text (for example,
    a man page), it’s fine for other purposes, such as viewing log files.


    The 80-column default width has implications for the shell scripts and other text-based
    programs we write. We should format our printed output to fit within the limits
    of an 80-character line for best effect.


    # Tabs


    A single terminal window with the ability to contain several different shell sessions
    is a valuable feature found in most modern terminal emulators. This is accomplished
    through the use of *tabs*.


    ![](bbox=[0.18, 0.517, 0.815, 0.85])


    *gnome-terminal with tabs*


    116 Power Terminals'
  merge: -1
  pgno: 125
- img_proc: false
  md: 'Tabs are a fairly recent addition to terminal emulators, first appearing around
    2003 in both GNOME''s `gnome-terminal` and KDE''s `konsole`.


    # Profiles


    Another feature found in some modern terminals is multiple configuration profiles.
    With this feature, we can have separate configurations for different tasks. For
    example, if we are responsible for maintaining a remote server, we might have
    a separate profile for the terminal that we use to manage it.


    # Fonts, Colors, and Backgrounds


    Most terminal emulators allow us to select fonts, colors, and backgrounds for
    our terminal sessions. The three most important criteria for selecting fonts,
    colors, and backgrounds are: 1. legibility, 2. legibility, and 3. legibility.
    Many people post screen shots of their Linux desktops online, and there is a great
    fascination with “stylish” fonts, faint colors, and pseudo-transparent terminal
    windows, but we use our terminals for very serious things, so we should treat
    our terminals very seriously, too. No one wants to make a mistake while administering
    a system because they misread something on the screen. Choose wisely.


    # *Past Favorites*


    When the first graphical environments began appearing for Unix in the mid-1980s,
    terminal emulators were among the first applications that were developed. After
    all, the GUIs of the time had very little functionality and people still needed
    to do their work. Besides, the graphical desktop allowed users to display multiple
    terminal windows- a powerful advantage at the time.


    # xterm


    The granddaddy of all graphical terminals is `xterm`, the standard terminal emulator
    for the X Window System. Originally released in 1984, it''s still under active
    maintenance. Since it is a standard part of X, it is included in many Linux distributions.
    `xterm` was very influential, and most modern terminal programs emulate its behavior
    in one way or another.'
  merge: -1
  pgno: 126
- img_proc: false
  md: '![](bbox=[0.14, 0.11, 0.81, 0.49])


    *xterm with default configuration*


    In its default configuration, `xterm` looks rather small and pathetic, but almost
    everything about `xterm` is configurable. When we say "configurable," we don''t
    mean there is a pretty "Preferences" dialog. This is Unix! Like many early X applications,
    it relies on an Xresources file for its configuration. This file can be either
    global (`/etc/X11/Xresources`) or local to the user (`~/.Xresources`). Each item
    in this file consists of an application class and a setting. If we create the
    file `~/.Xresources` with the following content:


    ```

    XTerm.vt100.geometry: 80x35

    XTerm.vt100.faceName: Liberation Mono:size=11

    XTerm.vt100.cursorBlink: true

    ```


    then we get a terminal like this:'
