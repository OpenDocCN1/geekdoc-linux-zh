    # Displaying a buffer in a tab


    We can open files in tabs, too. It works much like the `:e` command. To open a
    file in a tab, we type `:tabe` followed by the name of the file.


    Switching tabs is easy. To cycle through the tabs forward, we type `gt`. To cycle
    backwards, we type `gT`. If mouse support is enabled, tabs can be selected by
    clicking on them and new tabs can be opened by double clicking on the tab bar
    at the top of the screen.


    It''s also possible to start vim with multiple files loaded in tabs by adding
    the `-p` option to the command line. For example:


    ```

    [me@linuxbox ~]$ vim -p file1 file2

    ```


    To close tabs, we use `:q` command just like closing a vim window. When only one
    tab remains, vim leaves tabbed mode and the display returns to its usual state.


    There are a lot of tab-related features in vim. See the help topic for full details.


    **Help topics:** `tabpage`


