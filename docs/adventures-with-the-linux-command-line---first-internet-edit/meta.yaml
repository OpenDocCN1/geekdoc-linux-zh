    and then clear the screen. Terminals that do not support bce always erase to the
    default color (usually black).


    To solve this problem, our this script creates a long string of spaces that will
    fill the screen. On terminal types that do not support bce (for example, screen)
    the background color is set, the cursor is moved to the home position and then
    the string of spaces is drawn to fill the screen with the desired background color.


    # Summing Up


    Using tput, we can easily add visual enhancements to our scripts. While it’s important
    not to get carried away, lest we end up with a garish, blinking mess, adding text
    effects and color can increase the visual appeal of our work and improve the readability
    of information we present to our users.


    # Further Reading


    +   - The terminfo man page contains the entire list of terminal capabilities
    defined terminfo database.

    - On most systems, the `/lib/terminfo` and `/usr/share/terminfo` directories contain
    the all of the terminals supported by terminfo.

    - [Bash Hacker''s Wiki](https://wiki.bash-hackers.org/) has a good entry on the
    subject of text effects using `tput`. The page also has some interesting example
    scripts.

    - [Greg''s Wiki](http://mywiki.wooledge.org/) contains useful information about
    setting text colors using `tput`.

    - [Bash Prompt HOWTO](https://tldp.org/HOWTO/Bash-Prompt-HOWTO/) discusses using
    `tput` to apply text effects to the shell prompt.'
