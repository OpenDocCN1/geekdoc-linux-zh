  md: "What's more, this list of directories might be useful to other programs, too.\
    \ For example, we could have a file restoration script called `restore_me` that\
    \ restores files from the backup server to the backup client system. If this were\
    \ the case, we would then have twice as many scripts to maintain. A much better\
    \ way handle this issue would be to create a configuration file to define the\
    \ `BACKUP_DIR` constant and source it into our scripts at run time.\n\nHere's\
    \ how we could do it.\n\nFirst, we will create a configuration file named `back_me_up.cfg`\
    \ and place it somewhere sensible. Since the `back_me_up` and `restore_me` scripts\
    \ are used on a system-wide basis (as would most backup programs), we will treat\
    \ them like locally installed system resources. Thus, we would put them in the\
    \ `/usr/local/sbin` directory and the configuration file in `/usr/local/etc`.\
    \ The configuration file would contain the following:\n\n```\n# Configuration\
    \ file for the back_me_up program\nBACKUP_DIRS=\"/etc /usr/local /home\"\n```\n\
    \nWhile our configuration file must contain valid shell syntax, since its contents\
    \ are executed by the shell, it differs from a real shell script in two regards.\
    \ First, it does not require a shebang to indicate which shell executes it, and\
    \ second, the file does not need executable permissions. It only needs to be readable\
    \ by the shell.\n\nNext, we would add the following code to the `back_me_up` and\
    \ `restore_me` scripts to source our configuration file:\n\n```\nCONFIG_FILE=/usr/local/etc/back_me_up.cfg\n\
