  md: "While this seems really complicated, it's not really that bad. To change our\
    \ image resizing entry to only appear when the currently selected file has the\
    \ extension `.jpg` or `.JPG`, we would add one line to the beginning of the entry\
    \ (regular expressions are used in this example):\n\n```\n#   Resize an image\
    \ using convert\n+ f \\.jpg$ | f \\.JPG$\nR   Resize image to fit within 800 pixel\
    \ bounding square\n    size=800\n    convert \"%f\" -resize ${size}x${size} \"\
    %b-${size}.%x\"\n```\n\nThe conditional begins with `+` meaning that it's an addition\
    \ condition. It is followed by two sub-conditions. The `|` separating them signifies\
    \ an “or” relationship between the two. So, the finished conditional means “display\
    \ this entry if the selected file name ends with `.jpg` or the selected file name\
    \ ends with `.JPG`.”\n\nThe default menu file contains many more examples of conditionals.\
    \ It's worth a look.\n\n# Summing Up\n\nEven though it takes a little time to\
    \ learn, Midnight Commander offers a lot of features and facilities that make\
    \ file management easier when using the command line. This is particularly true\
    \ when operating on a remote system where a graphical user interface may not be\
    \ available. The user menu feature is especially good for specialized file management\
    \ tasks. With a little configuration, Midnight Commander can become a powerful\
    \ tool in our command line arsenal.\n\n# Further Reading\n\n+   - The *Midnight\
    \ Commander man page* is extensive and discusses even more features than we have\
    \ covered here.\n- [midnight-commander.org](http://midnight-commander.org) is\
    \ the official site for the project."
