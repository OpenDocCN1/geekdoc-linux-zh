  md: "# Changing to Another Shell\n\nNow that we have learned a little about the\
    \ different shells available for Linux, how can we experiment with them? First,\
    \ we can simply enter the name of the shell from our `bash` prompt. This will\
    \ launch the second shell as a child process of `bash`:\n\n```\nme@linuxbox ~\
    \ $ tcsh\n%\n```\n\nHere we have launched `tcsh` from the `bash` prompt and are\
    \ presented with the default `tcsh` prompt, a percent sign. Since we have not\
    \ yet created any startup files for the new shell, we get a very bare-bones environment.\
    \ Each shell has its own configuration file(s) for interactive use just as `bash`\
    \ has the `.bashrc` file to configure its interactive sessions.\n\nHere is a table\
    \ that lists the configuration files for each of the shells when used as an interactive\
    \ (i.e., not a login) shell:\n\n| Shell | Configuration File(s) |\n| :--- | :---\
    \ |\n| `dash` | User-defined by setting the ENV variable in `~/.profile` |\n|\
    \ `bash` | `~/.bashrc` |\n| `ksh` | `~/.kshrc` |\n| `tcsh` | `~/.tchrc` |\n| `zsh`\
    \ | `~/.zshrc` |\n\n*Interactive shell configuration files*\n\nWe'll need to consult\
    \ the respective shell's man page (always a fun exercise!) to see the complete\
    \ list of shell features. Most shells also include additional documentation and\
    \ example configuration files in the `/usr/share/doc` directory.\n\nTo exit our\
    \ temporary shell, we simply enter the `exit` command:\n\n```\n% exit\nme@linuxbox\
    \ ~ $\n```\n\nOnce we are done with our experimentation and configuration, we\
    \ can change our default shell from `bash` to our new shell by using the `chsh`\
    \ command. For example, to change from `bash` to `zsh`, we could do this:\n\n\
    ```\nme@linuxbox ~ $ chsh\npassword:\nChanging the login shell for me\nEnter the\
    \ new value, or press ENTER for the default\n    Login Shell [/bin/bash]: /usr/bin/zsh\n\
    ~ 23:30:40\n$\n```\n\nWe are prompted for our password and then prompted for the\
    \ name of the new shell whose name must appear in the `/etc/shells` file. This\
    \ is a safety precaution to prevent an invalid name from being specified and thus\
    \ preventing us from logging in again. That would be bad.\n\n152 Other Shells"
