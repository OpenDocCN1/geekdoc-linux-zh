  md: "As we recall from TLCL, shell functions are miniature shell scripts that we\
    \ can add to our `.bashrc` file to perform anything that we may otherwise do with\
    \ a shell script. Here is an example function that displays a quick snapshot of\
    \ a system's health:\n\n```\nstatus() {\n    { echo -e \"\\nuptime:\"\n      uptime\n\
    \      echo -e \"\\ndisk space:\"\n      df -h 2> /dev/null\n      echo -e \"\\\
    ninodes:\"\n      df -i 2> /dev/null\n      echo -e \"\\nblock devices:\"\n  \
    \    blkid\n      echo -e \"\\nmemory:\"\n      free -m\n      if [[ -r /var/log/syslog\
    \ ]]; then\n        echo -e \"\\nsyslog:\"\n        tail /var/log/syslog\n   \
    \   fi\n      if [[ -r /var/log/messages ]]; then\n        echo -e \"\\nmessages:\"\
    \n        tail /var/log/messages\n      fi\n    } | less\n}\n```\n\nUnlike aliases,\
    \ shell functions can accept positional parameters:\n\n```\nparams() {\n    local\
    \ argc=0\n    while [[ -n $1 ]]; do\n        argc=$((++argc))\n        echo \"\
    Argument $argc = $1\"\n        shift\n    done\n}\n```\n\n# **Command Line Editing**\n\
    \nAliases and shell functions are all well and good, provided we know in advance\
    \ the operations we wish to perform, but what about the rest of the time? Most\
    \ command line operations we perform are on-the-fly, so other techniques are needed.\n\
    \nAs we saw in Chapter 8 of TLCL, the bash shell includes a library called *readline*\
    \ to handle keyboard input during interactive shell sessions. This includes text\
    \ typed at the shell prompt and keyboard input using the `read` builtin when the\
    \ `-e` option is specified. The readline library supports a large number of commands\
    \ that can be used to edit what we type at the command line. Since readline is\
    \ from the GNU project, many of the commands are taken from the emacs text editor."
