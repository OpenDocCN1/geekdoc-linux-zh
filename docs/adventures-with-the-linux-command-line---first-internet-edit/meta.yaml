  md: "We can see the index when we examine the table’s schema.\n\n```\nsqlite> .schema\
    \ Package_Stats\nCREATE TABLE Package_Stats (\n    package_name  VARCHAR(60),\n\
    \    count          INTEGER,\n    tot_size       INTEGER,\n    min_size      \
    \ INTEGER,\n    max_size       INTEGER,\n    avg_size       REAL\n);\nCREATE INDEX\
    \ idx_package_name\nON Package_Stats (package_name);\n```\n\nSQLite also has a\
    \ dot command.\n\n```\nsqlite> .indexes\nidx_package_name\n```\n\nAnother benefit\
    \ of using an index is that it’s kept in sorted order (that’s how it performs\
    \ searches quickly). The side effect is that when an index is used during a query\
    \ the results of the query will be sorted as well. To demonstrate, we’ll create\
    \ another index for the `Package_Stats` table, this time using the `tot_size`\
    \ column. Notice that when we perform a select based on that column, the results\
    \ are in ascending order.\n\n```\nsqlite> CREATE INDEX idx_tot_size\n   ...> ON\
    \ Package_Stats (tot_size);\nsqlite> .width 20 -5 -10 -8 -8 -8\nsqlite> SELECT\
    \ * FROM Package_Stats\n   ...> WHERE tot_size > 100000000;\npackage_name    \
    \      count   tot_size min_size max_size avg_size\n-------------------- ------\
    \ -------- -------- -------- --------\ninkscape               1025 127507308 \
    \       0 19599216 124397.3\nlibreoffice-core        119 135106135       26  66158968\
    \ 1135345.\nlinux-modules-extra-   4172 165884678     1292  4216105 39761.42\n\
    linux-modules-extra-   4173 165921470     1292  4216105 39760.71\nthunderbird\
    \              69 180861838       27 12163098 2621186.\nfirefox              \
    \    74 203393773       23 12408360 2748564.\ngoogle-chrome-stable    100 235727530\
