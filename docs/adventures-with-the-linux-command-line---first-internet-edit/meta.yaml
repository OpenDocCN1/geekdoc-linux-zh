  md: "There are many different terminal types defined in the terminfo database and\
    \ there are many terminal capnames. The terminfo man page contains a complete\
    \ list. Note, however, that in general practice, there are only a relative handful\
    \ of capnames supported by all of the terminal types we are likely to encounter\
    \ on Linux systems.\n\n# *Reading Terminal Attributes*\n\nFor the following capnames,\
    \ `tput` outputs a value to stdout:\n\n| Capname | Description |\n|---------|-------------|\n\
    | `longname` | Full name of the terminal type |\n| `lines` | Number of lines in\
    \ the terminal |\n| `cols` | Number of columns in the terminal |\n| `colors` |\
    \ Number of colors available |\n\n*Capability names*\n\nThe `lines` and `cols`\
    \ values are dynamic. That is, they are updated as the size of the terminal window\
    \ changes. Here is a handy alias that creates a command to view the current size\
    \ of our terminal window:\n\n```\nalias term_size=`echo \"Rows=$(tput lines) Cols=$(tput\
    \ cols)\"`\n```\n\nIf we define this alias and execute it, we will see the size\
    \ of the current terminal displayed. If we then change the size of the terminal\
    \ window and execute the alias a second time, we will see the values have been\
    \ updated.\n\nOne interesting feature we can use in our scripts is the SIGWINCH\
    \ signal. This signal is sent each time the terminal window is resized. We can\
    \ include a signal handler (i.e., a trap) in our scripts to detect this signal\
    \ and act upon it:\n\n```\n#!/bin/bash\n# term_size2 - Dynamically display terminal\
    \ window size\n\nredraw() {\n    clear\n    echo \"Width = $(tput cols) Height\
    \ = $(tput lines)\"\n}\n\ntrap redraw WINCH\n\nredraw\nwhile true; do\n    :\n\
    done\n```\n\nWith this script, we start an empty infinite loop, but since we set\
    \ a trap for the SIGWINCH signal, each time the terminal window is resized the\
    \ trap is triggered and the new terminal size is displayed. To exit this script,\
    \ we type `Ctrl-c`."
