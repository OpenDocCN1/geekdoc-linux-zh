    # Deleting Rows


    Deleting rows is pretty easy in SQL. There is a `DELETE` statement with a `WHERE`
    clause to specify a target. We''ll demonstrate that, but first there''s a nifty
    trick that SQLite supports.


    We can change the output mode to write out `INSERT` statements. Let''s try it
    out.


    ```

    sqlite> .mode insert Package_Files

    ```


    If we use this `.mode` setting, we tell SQLite that we want `INSERT` statements
    directed at the specified table, in this case, `Package_Files`. Once we set this
    output mode, we can see the result.


    ```

    sqlite> SELECT * FROM Package_Files WHERE package_name = ''sqlite3'';

    INSERT INTO Package_Files VALUES(''sqlite3'',''/usr/bin/sqldiff'',1103380);

    INSERT INTO Package_Files VALUES(''sqlite3'',''/usr/bin/sqlite3'',1261076);

    INSERT INTO Package_Files VALUES(''sqlite3'',''/usr/share/doc/sqlite3/copyright'',1

    361);

    INSERT INTO Package_Files VALUES(''sqlite3'',''/usr/share/man/man1/sqlite3.1.gz'',3

    696);

    INSERT INTO Package_Files VALUES(''sqlite3'',''/usr/share/doc/sqlite3/changelog.De

    bian.gz'',135);

    ```


    We''ll repeat this `SELECT`, but first we''ll change the output from standard
    output to a file named `insert_sqlite3.sql`.


    ```

    sqlite> .output insert_sqlite3.sql

    sqlite> select * from Package_Files where package_name = ''sqlite3'';

    ```


    This will write the stream of `INSERT` statements to the specified file. Next
    we''ll set the output back to standard output by issuing the `.output` dot command
    without an output file name.


    ```

    sqlite> .output

    ```'
