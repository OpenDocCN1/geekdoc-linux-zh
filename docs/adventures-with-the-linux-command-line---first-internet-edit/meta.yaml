  md: 'If temporary files cannot be avoided, care must be taken to create them safely.
    We must consider, for example, what happens if there is more than one instance
    of the script running at the same time. For security reasons, if a temporary file
    is placed in a world-writable directory (such as `/tmp`) we must ensure the file
    name is unpredictable. A good way to create temporary file is by using the `mktemp`
    command as follows:


    ```

    TEMPFILE="$(mktemp /tmp/"$PROGNAME".$$.XXXXXXXX)"

    ```


    In this example, a temporary file will be created in the `/tmp` directory with
    the name consisting of the script''s name followed by its process ID (PID) and
    10 random characters.


    For temporary files belonging to a regular user, the `/tmp` directory should be
    avoided in favor of the user''s home directory.


    # **ShellCheck is Your Friend**


    There is a program available in most distribution repositories called `shellcheck`
    that performs analysis of shell scripts and will detect many kinds of faults and
    poor scripting practices. It is well worth using it to check the quality of scripts.
    To use it with a script that has a shebang, we simply do this:


    ```

    shellcheck my_script

    ```


    ShellCheck will automatically detect which shell dialect to use based on the shebang.
    For shell script code that does not contain a shebang, such as function libraries,
    we use ShellCheck this way:


    ```

    shellcheck -s bash my_library

    ```


    Use the `-s` option to specify the desired shell dialect. More information about
    ShellCheck can be found at its website [http://www.shellcheck.net](http://www.shellcheck.net).


    # **Summing Up**


    We covered a lot of ground in this adventure, specifying a complete set of technical
    and stylistic features. Using this coding standard, we can now write some serious
    production-quality scripts. However, the complexity of this standard does impose
    some cost in terms of development time and effort.


    In Part 2, we will examine a program from LinuxCommand.org called `new_script`,
    a bash script template generator that will greatly facilitate writing scripts
    that conform to our new coding standard.


    # **Further Reading**


    Here are some links to shell scripting coding standards. They range from the lax
    to the obsessive. Reading them all is a good idea in order to get a sense of the
    community''s'
