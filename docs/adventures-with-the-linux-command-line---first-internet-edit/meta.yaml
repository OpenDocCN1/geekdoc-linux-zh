  md: '![](bbox=[0.18, 0.1, 0.82, 0.4])


    Regions


    Using multiple regions is very convenient when working with large terminal displays.
    For example, if we split the display into two horizontal regions, we can edit
    a script in one region and perform testing of the script in the other. Or we could
    read a man page in one region and try out a command in the other.


    There are two commands for deleting regions: `Ctrl-a Q` removes all regions except
    the current one, and `Ctrl-a X` removes the current region. Note that removing
    a region does not remove its associated window. Windows continue to exist until
    they are destroyed.


    # Detaching Sessions


    Perhaps the most interesting feature of screen is its ability to detach a session
    from the terminal itself. Just as it is able to display its windows on any region
    of the terminal, screen can also display its windows on any terminal or no terminal
    at all.


    For example, we could start a screen session on one computer, say at the office,
    detach the session from the local terminal, go home and log into our office computer
    remotely, and reattach the screen session to our home computer''s terminal. During
    the intervening time, all jobs on our office computer have continued to execute.


    There are a number of commands used to manage this process.


    +   - `screen -list` lists the screen sessions running on a system. If there is
    more than one session running, the `pid.tty.host` string shown in the listing
    can be appended to the `-d/-D` and `-r/-R` options below to specify a particular
    session.'
  merge: -1
  pgno: 43
- img_proc: false
  md: "+   - `screen -d -r` detaches a screen session from the previous terminal and\
    \ reattaches it to the current terminal.\n- `screen -D -R` detaches a screen session\
    \ from the previous terminal, logs the user off the old terminal and attaches\
    \ the session to the new terminal creating a new session if no session existed.\
    \ According to the screen documentation, this is the author’s favorite.\n\nThe\
    \ `-d/-D` and `-r/-R` options can be used independently, but they are most often\
    \ used together to detach and reattach an existing screen session in a single\
    \ step.\n\nWe can demonstrate this process by opening two terminals. Launch screen\
    \ on the first terminal and create a few windows. Now, go to the second terminal\
    \ and enter the command `screen -D -R`. This will the cause the first terminal\
    \ to vanish (the user is logged off) and the screen session to move to the second\
    \ terminal fully intact.\n\n# Customizing Screen\n\nLike many of the interactive\
    \ GNU utilities, screen is very customizable. During invocation, screen reads\
    \ the `/etc/screenrc` and `~/.screenrc` files if they exist. While the list of\
    \ customizable features is extensive (many having to do with terminal display\
    \ control on a variety of Unix and Unix-like platforms), we will concern ourselves\
    \ with key bindings and startup session configuration since these are the most\
    \ commonly used.\n\nFirst, let’s look a sample `.screenrc` file:\n\n```\n# This\
    \ is a comment\n\n# Set some key bindings\n\nbind k            # Un-bind the \"\
    k\" key (set it to do nothing)\nbind K kill        # Make `Ctrl-a K` destroy the\
    \ current window\nbind } history     # Make `Ctrl-a }` copy and paste the current\n\
    \                  # command line\n\n# Define windows 7, 8, and 9 at startup\n\
    screen -t \"mdnght cmdr\" 7 mc\nscreen -t htop 8 htop\nscreen -t syslog 9 tailf\
    \ /var/log/syslog\n```\n\nAs we can see, the format is pretty simple. The `bind`\
    \ directive is followed by the key and the screen command it is to be bound to.\
    \ A complete list of the screen commands can found in the screen man page. All\
    \ of the screen commands we have discussed so far are simply key bindings like\
    \ those in the example above. We can redefine them at will.\n\nThe three lines\
    \ at the end of our example `.screenrc` file create windows at startup. The commands\
    \ set the window title (the `-t` option), a window number, and a command for the\
    \ window to contain. This way, we can set up a screen session to be automatically\
    \ built"
