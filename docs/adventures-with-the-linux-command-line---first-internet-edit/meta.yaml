  md: '![](bbox=[0.175, 0.105, 0.815, 0.415])


    Text marked for copying


    # Multiple Regions


    GNU screen can also divide the terminal display into separate regions, each providing
    a view of a screen window. This allows us to view 2 or more windows at the same
    time. To split the terminal horizontally, type the command `Ctrl-a S`, to split
    it vertically, type `Ctrl-a |`. Newly created regions are empty (i.e., they are
    not associated with a window). To display a window in a region, first move the
    focus to the new region by typing `Ctrl-a Tab` and then either create a new window,
    or chose an existing window to display using any of the window selection commands
    we have already discussed. Regions may be further subdivided to smaller regions
    and we can even display the same window in more than one region.'
