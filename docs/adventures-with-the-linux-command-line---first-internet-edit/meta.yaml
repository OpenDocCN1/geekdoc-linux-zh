  md: "# # Joins\n\nA join is a method by which we perform a query and produce a result\
    \ that combines the data from two tables. SQLite supports several types of joins\
    \ but we're going to focus on the most commonly used type called an inner join.\
    \ We can think of an inner join as the intersection of two tables. In the example\
    \ below, a file called `join_demo.sql`, we will produce a query result that matches\
    \ our earlier example when we added columns to the `Package_Descriptions` table.\n\
    \n```\n-- join_demo.sql\n\n-- Demonstrate join by selecting columns from 2 tables\n\
    \n.header on\n.mode column\n.width 20 35 -5 -10\n\nSELECT Package_Descriptions.package_name\
    \ AS Package,\n       description AS Description,\n       count AS Files,\n  \
    \     tot_size AS Size\n  FROM Package_Descriptions\n INNER JOIN Package_Stats\n\
    \        ON Package_Descriptions.package_name =\n           Package_Stats.package_name\n\
    \ LIMIT 10;\n```\n\nThe results of this query are as follows:\n\n| Package | Description\
    \ | Files | Size |\n| --- | --- | --- | --- |\n| a2ps | GNU a2ps - 'Anything to\
    \ PostScript' | 299 | 3455890 |\n| accountsservice | query and manipulate user\
    \ account i | 19 | 261704 |\n| acl | Access control list utilities | 11 | 91106\
    \ |\n| acpi-support | scripts for handling many ACPI even | 18 | 13896 |\n| acpid\
    \ | Advanced Configuration and Power In | 19 | 86126 |\n| adduser | add and remove\
    \ users and groups | 81 | 246658 |\n| adium-theme-ubuntu | Adium message style\
    \ for Ubuntu | 137 | 126759 |\n| adwaita-icon-theme | default icon theme of GNOME\
    \ (small | 1127 | 4848678 |\n| aisleriot | GNOME solitaire card game collectio\
    \ | 316 | 1890864 |\n| alsa-base | ALSA driver configuration files | 42 | 195295\
    \ |\n\nIf we break down this query, we see that it starts out as we expect, then\
    \ it is followed by the `INNER JOIN` statement. The `INNER` keyword is optional\
    \ as an inner join is the default. After the `INNER JOIN` we have to specify the\
    \ relationship on which the join is based. In this example, we are looking for\
    \ matching instances of the `package_name` in both tables. Any expression my be\
    \ used to convey the table relationship, provided that the result of the expression\
    \ is true or false.\n\nSince `package_name` is a column in both the `Package_Descriptions`\
    \ and `Package_Stats` tables, we must precede it with the name of the respective\
    \ table to avoid ambiguity."
