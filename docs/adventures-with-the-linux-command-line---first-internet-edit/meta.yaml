  md: '# ## 14 SQL


    Okay kids, gird your grid for a big one.


    The world as we know it is powered by data. Data, in turn, is stored in databases.
    Most everything we use computers for involves using data stored in some kind of
    database. When we talk about storing large amounts of data, we often mean *relational
    database management systems* (RDBMS). Banks, insurance companies, most every accounting
    system, and many, many websites use relational databases to store and organize
    their data.


    The idea of relational data storage is generally credited to English computer
    scientist and IBM researcher E. F. Cobb, who proposed it in a paper in 1970. In
    the years that followed, a number of software companies built relational database
    systems with varying degrees of success. Around 1973, IBM developed a simplified
    and flexible method of managing relational databases called *Structured Query
    Language* (SQL, often pronounced "sequel"). Today the combination of RDBMS and
    SQL is a huge industry, generating many billions of dollars every year.


    Relational databases are important to the history of Linux as well. It was the
    availability of open source database programs (such as MySQL) and web servers
    (most notably, Apache) that led to an explosion of Linux adoption in the early
    days of the world wide web.


    In this adventure, we''re going to study the fundamentals of relational databases
    and use a popular command line program to create and manage a database of our
    own. The AWK adventure is a suggested prerequisite.


    # ### *A Little Theory: Tables, Schemas, and Keys*


    Before we can delve into SQL we have to look at what relational databases are
    and how they work.


    # ### Tables


    Simply put, a relational database is one or more *tables* containing columns and
    rows. Technically, the columns are known as *attributes* and the rows as *tuples*,
    but most often they are simply called columns and rows. In many ways, a table
    resembles the familiar spreadsheet. In fact, spreadsheet programs are often used
    to prepare and edit database tables. Each column contains data of a consistent
    type, for example, one column might consist of integers and another column strings.
    A table can contain any number of rows.'
  merge: -1
  pgno: 228
- img_proc: false
  md: '# Schemas


    The design of a database is called its *schema* and it can be simple, containing
    just a single table or two, or it can be complex, containing many tables with
    complex interrelationships between them.


    Let’s imagine a database for a bookstore consisting of three tables. The first
    is called `Customers`, the second is called `Items`, and the third is called `Sales`.
    The `Customers` table will have multiple rows with each row containing information
    about one customer. The columns include a customer number, first and last names,
    and the customer’s address. Here is such a table with just some made-up names:


    ```

    Cust First   Last     Street                      City           ST

    ---- ------- -------- --------------------------- -------------- --

    0001 Richard Stollman 1 Outonthe Street             Boston         MA

    0002 Eric    Roymond  2 Amendment Road             Bunker Hill    PA

    0003 Bruce   Porens   420 Middleville Drive Anytown         US

    ```


    The `Items` table lists our books and contains the item number, title, author,
    and price.


    ```

    Item Title                               Author           Price

    ---- -------------------------------------- ---------------- -----

    1001 Winning Friends and Influencing People Dale Carnegie  14.95

    1002 The Communist Manifesto              Marx & Engels    00.00

    1003 Atlas Shrugged                       Ayn Rand         99.99

    ```


    As we go about selling items in our imaginary bookstore, we generate rows in the
    `Sales` table. Each sale generates a row containing the customer number, date
    and time of the sale, the item number, the quantity sold, and the total amount
    of the sale.


    ```

    Cust Date_Time     Item Quan  Total

    ---- --------------- ---- ---- -------

    0002 202006150931 1003    1  99.99

    0001 202006151108 1002    1   0.00

    0003 202006151820 1001   10 149.50

    ```


    # Keys


    Now we might be wondering what the `Cust` and `Item` columns are for. They serve
    as *keys*. Keys are values that serve to uniquely identify a table row and to
    facilitate interrelationships between tables. Keys have some special properties.
    They must be both unique (that is, they can appear only once in a table and specifically
    identify a row) and they must also be immutable (they can never change). If they
    can’t meet these requirements, they cannot be keys. Some database implementations
    have methods of enforcing these requirements during table creation and keys can
    be formally specified. In the case of our bookstore database, the `Cust` column
    contains the keys for the `Customers` table and the `Item` column contains the
    keys for the `Items` table.


    Knowing this about keys, we can now understand why the `Sales` table works the
    way it does. We can see for example that row 1 of the `Sales` table tells us that
    customer `0002` purchased 1 copy of item `1003` for $99.99. So why do we need
    special values for the'
  merge: -1
  pgno: 229
- img_proc: false
  md: 'keys? Why not, for instance, just use the customer’s name as the key? It’s
    because we can’t guarantee that the name won’t change, or that two people might
    have the same name. We can guarantee that an arbitrarily assigned value like our
    customer number is unique and immutable.


    # Database Engines/Servers


    There are a number of database servers available for Linux. The two most prominent
    are MySQL (and its fork MariaDB) and PostgreSQL. These database servers implement
    *client/server architecture*, a concept that became a hot topic in the 1990s.
    Database servers of this type run as server processes and clients connect to them
    over a network connection and send SQL statements for the server to carry out.
    The results of the database operations are returned to the client program for
    further processing and presentation. Many web sites use this architecture with
    a web server sending SQL statements to a separate database server to dynamically
    create web pages as needed. The famous *LAMP stack* consisting of Linux, Apache
    web server, MySQL, and PHP powered much of the early web.


    For purposes of this adventure, setting up database servers such as MySQL and
    PostgreSQL is too complicated to cover here since, among other things, they support
    multiple concurrent users and their attendant security controls. It’s more than
    we need for just learning SQL.


    # sqlite3


    The database server we will be using is SQLite. SQLite is a library that can be
    used with applications to provide a high-level of SQL functionality. It’s very
    popular with the embedded systems crowd. It saves application developers the trouble
    of writing custom solutions to their data storage and management tasks. In addition
    to the library, SQLite provides a command line tool for directly interacting with
    SQLite databases. Also, since it accepts SQL from standard input (as well as it
    own command line interface) and sends its results to standard output, it’s ideal
    for use in our shell scripts.


    SQLite is available from most Linux distribution repositories. Installation is
    easy, for example:


    ```

    me@linuxbox:~$ sudo apt install sqlite3

    ```


    # Building a Playground


    Let’s build a playground and play with some real data. On the LinuxCommand.org
    site there is a archive we can download that will do the trick.


    ```

    me@linuxbox:~$ cd

    me@linuxbox:~$ curl -c http://linuxcommand.org/adventure-sql.tgz

    me@linuxbox:~$ tar xzf adventure-sql.tgz

    me@linuxbox:~$ cd adventure-sql

    ```'
