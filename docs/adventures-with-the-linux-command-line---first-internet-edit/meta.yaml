  md: "# **Functions**\n\nFunction definitions should appear next in the script. They\
    \ should follow an order that indicates their hierarchy; that is, functions should\
    \ be ordered so they are defined before they are called. For example, if `funct_b`\
    \ calls `funct_a`, function `funct_a` should be defined ahead of `func_b`.\n\n\
    Functions should have the following form:\n\n```\nfunc_b {\n\n    local v1=\"\
    $1\"\n    local v2=\"$2\"\n\n    command1\n    command2\n    return\n}\n```\n\n\
    Positional parameters passed to a function should be assigned to local variables\
    \ with descriptive names to clarify how the parameters are used. Unless there\
    \ is a good reason, all functions should end with a `return` statement with an\
    \ exit status as required.\n\nEach function defined in a code library should be\
    \ preceded by a short comment block that lists the function's name, purpose, and\
    \ positional parameters.\n\n# **Program Body**\n\nThe final section of a script\
    \ is the program body, where we get to do what we came here to do. In this section\
    \ we handle such things as positional parameter processing, acquisition and validation\
    \ of required input, processing, and output.\n\nA common practice is to write\
    \ the program body as a very simple abstraction of the program, so that the basic\
    \ program flow is easy to understand and most of the fussy bits are placed in\
    \ functions defined above the program body.\n\nThe end of the program body should\
    \ include some means of housekeeping, to do such things as removing temporary\
    \ files. All scripts should return a useful exit status.\n\n# ## Formatting and\
    \ Visual Style\n\nGood visual layout makes scripts easier to read and understand.\
    \ It's important to make formatting consistent so it creates a reliable visual\
    \ language for the code.\n\n# **Line Length**\n\nIn order to improve readability\
    \ and to display properly in small terminal windows, line length should be limited\
    \ to 80 characters. Line continuation characters should be used to break long\
    \ lines, with each subsequent line indented one level from the first. For example:"
