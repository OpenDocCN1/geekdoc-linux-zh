    # Cutting and Pasting


    As with `vim`, cutting and pasting in readline are referred to as "killing" and
    "yanking." The clipboard is called the *kill-ring* and is implemented as a *circular
    buffer*. This means that it contains multiple entries (i.e., each kill adds a
    new entry). The latest entry is referred to as the "top" entry. It is possible
    to "rotate" the kill-ring to bring the previous entry to the top and delete the
    latest entry. However, this feature is rarely used.


    Mostly, the kill commands are used to simply delete text rather than save it for
    later yanking.'
