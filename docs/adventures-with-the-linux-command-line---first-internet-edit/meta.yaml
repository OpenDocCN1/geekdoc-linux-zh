  md: "# For RPM-based Systems (RHEL, CentOS, Fedora)\n\nThe `mk_package_descriptions-rpm`\
    \ script:\n\n```\n#!/bin/bash\n\n# mk_package_descriptions-rpm - Output tsv list\
    \ of installed Fedora/CentOS\n#                                 packages on standard\
    \ output\n\nwhile read package; do\n    description=$(dnf info \"$package\" \\\
    \n      | awk '$1 == \"Summary\" { gsub(/Summary\\s*:\\s+/, \"\"); print $0; exit\
    \ }')\n    printf \"%s\\t%s\\n\" \\\n      \"$package\" \\\n      \"$description\"\
    \ndone < <( dnf list installed | awk 'NF == 3 { print $1 }' )\n```\n\nThe `mk_package_files-rpm`\
