    [[ \"$pathname\" =~ ^[./].*$ ]] || pathname=\"./$pathname\"\n```\n\n# [[ ... ]]\
    \ vs. [ ... ]\n\nUnless a script must run in a POSIX-compatible environment, use\
    \ `[[ ... ]]` rather than `[ ... ]` when performing conditional tests. Unlike\
    \ the `[` and `test` bash builtins, `[[ ... ]]` is part of shell syntax, not a\
    \ command. This means it can handle its internal elements (test conditions) in\
    \ a more robust fashion, as pathname expansion and word splitting do not occur.\
    \ Also, `[[ ... ]]` adds some additional capabilities such as `=~` to perform\
