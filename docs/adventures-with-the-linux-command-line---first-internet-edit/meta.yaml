  md: '# ## The User Menu


    So far we have avoided discussion of the mysterious F2 command. This is the user
    menu, which may be Midnight Commander''s most powerful and useful feature. The
    user menu is, as the name suggests, a menu of user-defined commands.


    When we press the F2 key, Midnight Commander looks for a file named .mc.menu in
    the current directory. If the file does not exist, Midnight Commander looks for
    ~/.config/mc/menu. If that file does not exist, then Midnight Commander falls
    back to a system-wide menu file named /usr/share/mc/mc.menu.


    The neat thing about this scheme is that each directory can have its own set of
    user menu commands, so that we can create commands appropriate to the contents
    of the current directory. For example, if we have a "Pictures" directory, we can
    create commands for processing images; if we have a directory full of HTML files,
    we can create commands for managing a web site, and so on.


    So, after we press F2 the first time, we are presented with the default user menu
    that looks something like this:


    ![](bbox=[0.176, 0.447, 0.819, 0.746])


    *The User Menu*


    # ## Editing the User Menu


    The default user menu contains several example entries. These are by no means
    set in stone. We are encouraged to edit the menu and create our own entries. The
    menu file is ordinary text and it can be edited with any text editor, but Midnight
    Commander provides'
  merge: -1
