    \ applied to text selected in visual mode or used in conjunction with either movement\
    \ commands or text object selections. For example:\n\n```\ngUis\tConvert the current\
    \ sentence to upper case\nguf:\tConvert text from the cursor position to the next\
    \ ':'\n\tcharacter on the current line\n```\n\n# File Format Conversion\n\nOnce\
    \ in a while, we are inflicted with a text file that was created on a DOS/Windows\
    \ system. These files will contain an extra carriage return at the end of each\
    \ line. Vim will indicate this after loading the file by displaying a “DOS” message\
    \ at the bottom of the editing window. To correct this annoying condition, do\
    \ the following:\n\n```\n:set fileformat=unix\n:w\n```\n\nThe file will be rewritten\
    \ in the correct format.\n\nHelp topics: 'textwidth' gq 'fileformat' ~ gu gU\n\
    \n# Macros\n\nText editing sometimes means we get stuck with a tedious repetitive\
    \ editing task where we do the same set of operations over and over again. This\
    \ is the bane of every computer user. Fortunately, vim provides us a way to record\
    \ a sequence of operations we can later playback as needed. These recordings are\
    \ called *macros*.\n\nTo create a macro, we begin recording by typing `q` followed\
    \ by a single letter. The character typed after the `q` becomes the name of the\
    \ macro. After we start recording, everything we type gets stored in the macro.\
    \ To conclude recording, we type `q` again.\n\nTo demonstrate, let’s consider\
    \ our comment block again. To create a macro that will remove a comment symbol\
    \ from the beginning of the line, we would do this: move to the first line in\
    \ the comment block and type the following command:\n\n```\nqa^xxjq\n```\n\nLet’s\
    \ break down what this sequence does:\n\n```\nqa\tStart recording macro \"a\"\n\
    ^\tMove to the first non-whitespace character in the line\nxx\tDelete the first\
    \ two characters under the cursor\nj\tMove down one line\n```\n\n172 Vim, with\
    \ Vigor"
