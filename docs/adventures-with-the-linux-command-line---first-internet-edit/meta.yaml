  md: '# # 4 More Redirection


    As we learned in Chapter 6 of TLCL, I/O redirection is one of the most useful
    and powerful features of the shell. With redirection, our commands can send and
    receive streams of data to and from files and devices, as well as allow us to
    connect different programs together into pipelines.


    In this adventure, we will look at redirection in a little more depth to see how
    it works and to discover some additional features and useful redirection techniques.


    # ## *What''s Really Going On*


    Whenever a new program is run on the system, the kernel creates a table of *file
    descriptors* for the program to use. File descriptors are pointers to files. By
    convention, the first 3 entries in the table (descriptors 0, 1, and 2) are used
    as standard input (stdin), standard output (stdout), and standard error (stderr).
    Initially, all three descriptors point to the terminal device (which the system
    treats as a read/write file), so that standard input comes from the keyboard and
    standard output and standard error go to the terminal display.


    When a program is started as a child process of another (for instance, when we
    run an executable program in the shell), the newly launched program inherits a
    copy of the parent''s file descriptor table. Redirection is the process of manipulating
    the file descriptors so that input and output can be routed from/to different
    files.


    The shell hides the presence of file descriptors in common redirections such as:


    ```

    command > file

    ```


    Here we redirect standard output to a file, but the full syntax of the redirection
    operator includes an optional file descriptor. We could write the above statement
    this way and it would have exactly the same effect:


    ```

    command 1> file

    ```


    As a convenience, the shell assumes we want to redirect standard output if the
    file descriptor is omitted. Likewise, the following two statements are equivalent
    when referring to standard input:


    ```

    command < file


    command 0< file

    ```'
