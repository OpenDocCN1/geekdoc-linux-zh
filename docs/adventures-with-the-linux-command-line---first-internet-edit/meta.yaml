  md: "# Views\n\nThe join example above is a pretty useful query for our tables,\
    \ but due to its complexity it’s best executed from a file rather than as an ad\
    \ hoc query. SQL addresses this issue by providing a feature called *views* that\
    \ allows a complex query to be stored in the database and used to produce a virtual\
    \ table that can be used with simple query commands. In the following example\
    \ we will create a view using our `INNER JOIN` query above to create a virtual\
    \ table called `Stats` that we can use as the target of subsequent queries.\n\n\
    ```\n-- view_demo.sql\n\nDROP VIEW IF EXISTS Stats;\nCREATE VIEW Stats\nAS\n \
    \   SELECT Package_Descriptions.package_name AS Package,\n           description\
    \ AS Description,\n           count AS Files,\n           tot_size AS Size\n \
    \   FROM Package_Descriptions\n    INNER JOIN Package_Stats\n           ON Package_Descriptions.package_name\
    \ =\n              Package_Stats.package_name\n    ORDER BY Package;\n```\n\n\
    Once our view is created, we can treat `Stats` as just another table in our database\
    \ even though it does not really exist as such.\n\n```\nsqlite> .header on\nsqlite>\
    \ .mode column\nsqlite> .width 20 35 -5 -10\nsqlite> SELECT * FROM Stats LIMIT\
    \ 10;\nPackage                 Description                             Files \
    \ Size\n----------------------  ---------------------------------------  -----\
    \  --------\na2ps                    GNU a2ps - 'Anything to PostScript'     \
    \ 299    3455890\naccountsservice         query and manipulate user account i\
    \       19    261704\nacl                     Access control list utilities  \
    \           11    91106\nacpi-support            scripts for handling many ACPI\
    \ even       18    13896\nacpid                   Advanced Configuration and Power\
    \ In       19    86126\nadduser                 add and remove users and groups\
    \           81    246658\nadium-theme-ubuntu      Adium message style for Ubuntu\
    \           137    126759\nadwaita-icon-theme      default icon theme of GNOME\
    \ (small      1127    4848678\naisleriot               GNOME solitaire card game\
    \ collectio      316    1890864\nalsa-base               ALSA driver configuration\
    \ files           42    195295\n```\n\nTo delete a view we use the `DROP VIEW`\
    \ statement as follows:\n\n```\nsqlite> DROP VIEW Stats;\n```\n\n# Indexes\n\n\
    It’s been said that the three most important features of a database system are\
    \ “performance, performance, and performance.” While this in not exactly true\
    \ (things like data integrity and reliability are important, too), complex operations\
    \ on large databases can get really slow, so it’s important to make things as\
    \ fast as we can. One feature we can take advantage of are *indexes*."
