  md: '# 7 AWK


    One of the great things we can do in the shell is embed other programming languages
    within the body of our scripts. We have seen hints of this with the stream editor
    `sed`, and the arbitrary precision calculator program `bc`. By using the shell’s
    single quoting mechanism to isolate text from shell expansion, we can freely express
    other programming languages, provided we have a suitable language interpreter
    to execute them.


    In this adventure, we are going to look at one such program, `awk`.


    # History


    The AWK programming language is truly one of the classic tools used in Unix. It
    dates back to the very earliest days of the Unix tradition. It was originally
    developed in the late 1970’s at AT&T Bell Telephone Laboratories by Alfred Aho,
    Peter Weinberger, and Brian Kernighan. The name “AWK” comes from the last names
    of the three authors. It underwent major improvements in 1985 with the release
    of `nawk` or “new awk.” It is that version that we still use today, though it
    is usually just called `awk`.


    # Availability


    `awk` is a standard program found in most every Linux distribution. Two free/open
    source versions of the program are in common use. One is called `mawk` (short
    for Mike’s awk, named for its original author, Mike Brennan) and `gawk` (GNU awk).
    Both versions fully implement the 1985 `nawk` standard as well as add a variety
    of extensions. For our purposes, either version is fine, since we will be focusing
    on the traditional `nawk` features. In most distributions, the name `awk` is symbolically
    linked to either `mawk` or `gawk`.


    # So, What’s it Good For?


    Though AWK is fairly general purpose, it is really designed to create *filters*,
    that is, programs that accept standard input, transform data, and send it to standard
    output. In particular, AWK is very good at processing *columnar* data. This makes
    it a good choice for developing report generators, and tools that are used to
    re-format data. Since it has strong regular expression support, it’s good for
    very small text extraction and reformatting problems, too. Like `sed`, many AWK
    programs are just one line long.


    In recent years, AWK has fallen a bit out of fashion, being supplanted by other,
    newer, interpreted languages such as *Perl* and *python*, but AWK still has some
    advantages:


    +   - It’s easy to learn. The language is not overly complex and has a syntax
    much like the C programming language, so learning it will be useful in the future
    when we study other languages and tools.

    - It really excels at a solving certain types of problems.'
