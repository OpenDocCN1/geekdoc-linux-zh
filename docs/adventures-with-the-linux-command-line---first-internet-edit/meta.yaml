  md: "```\ncommand1 && short_command\ncommand2 \\\n    || long_command \"$param1\"\
    \ \"$param2\" \"$param3\"\n```\n\n# Coding Practices\n\nIn order to achieve our\
    \ goal of writing robust, easily maintained scripts, our coding standard recommends\
    \ the following coding practices.\n\n# Commenting\n\nGood code commenting is vital\
    \ for script maintenance. The purpose of commenting to is to explain vital facts\
    \ about a program. If a script is to have any durability, we must anticipate that\
    \ someone (even if it's just the author) will revisit the script at a later date\
    \ and will need a refresher on how the script works. Do not comment code that\
    \ is obvious and easily understood; rather, explain the difficult to understand\
    \ parts. Rule of thumb: the more time a chunk of code takes to design and write,\
    \ the more commenting it will likely need to explain it.\n\nFunction libraries\
    \ are a special case. Each function in a library should be preceded by a comment\
    \ block that documents its purpose and its positional parameters.\n\nA common\
    \ type of comment points to where future additions and changes are needed. These\
    \ are called \"todo\" comments and are typically written like this:\n\n```\n#\
    \ TODO Fix this routine so it can do this better\n```\n\nThese comments begin\
    \ with the string `TODO` so they can be found easily using a text editor's search\
    \ feature.\n\n# Shell Builtins vs. External Programs\n\nWhere possible, use bash\
    \ builtins rather than external commands. For example, the `basename` and `dirname`\
    \ programs can be replaced by parameter expansions to strip leading or trailing\
    \ strings from pathnames. Compared to external programs, shell builtins use fewer\
    \ resources and execute much faster.\n\n# Variable Expansion and Quoting\n\nDouble\
    \ quotes must be used to manage word splitting during parameter expansion. This\
    \ is particularly important when working with filenames. Assume that every variable,\
    \ parameter expansion, and command substitution may contain embedded spaces, newlines,\
    \ etc. There are situations where quoting is not needed (for example, within `[[\
    \ ... ]]`) but we use double quotes anyway, because it doesn't hurt anything and\
    \ it's easier to always quote variables than remembering all the special cases\
    \ where it is not required.\n\n```\na=\"$var\"\n```"
