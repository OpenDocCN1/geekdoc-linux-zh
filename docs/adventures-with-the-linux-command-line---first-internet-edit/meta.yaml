    smkx=\E[?1h\E=, smso=\E[3m, smul=\E[4m, tbc=\E[3g,

    ```


    The example above is the terminfo entry for the terminal type "screen". What we
    see in the output of `infocmp` is a comma-separated list of *terminal capability
    names* or *capnames*. Some of the capabilities are standalone - like the first
    few in the list - while others are assigned cryptic values. Standalone terminal
    capabilities indicate something the terminal can do. For example, the capability
    "am" indicates the terminal has an automatic right margin. Terminal capabilities
    with assigned values contain strings, which are interpreted as commands by the
    terminal. The values starting with "\E" (which represents the escape character)
    are sequences of control codes that cause the terminal to perform an action such
    as moving the cursor to a specified location, or setting the text color.


    The `tput` command can be used to test for a particular capability or to output
    the assigned value. Here are some examples:


    ```

    tput longname

    ```


    This outputs the full name of the current terminal type. We can specify another
    terminal type by including the `-T` option. Here, we will ask for the full name
    of the terminal type named "screen":


    ```

    tput -T screen longname

    ```


    We can inquire values from the terminfo database, like the number of supported
    colors and the number of columns in the current terminal:


    ```

    tput colors

    tput cols

    ```


    We can test for particular capability. For example, to see if the current terminal
    supports "bce" (background color erase - meaning that clearing or erasing text
    will be done using the currently defined background color) we type:


    ```

    tput bce && echo "True"

    ```


    We can send instructions to the terminal. For example, to move the cursor to the
    position 20 characters to the right and 5 rows down:


    ```

    tput cup 5 20

    ```


    64 tput'
