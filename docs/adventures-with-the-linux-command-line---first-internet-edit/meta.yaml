  md: '![](bbox=[0.178, 0.109, 0.818, 0.405])


    *Text marked for copying*


    As with the digital clock, we return to normal mode by typing "q". Now we can
    paste our copied text by typing `Ctrl-b ]`.


    # ## Detaching Sessions


    With tmux it''s easier to manage multiple sessions than with screen. First, we
    can give sessions descriptive names, either during creation, as we saw with our
    "PaneDemo" example above, or by renaming an existing session with `Ctrl-b $`.
    Second, it''s easy to switch sessions on-the-fly by typing `Ctrl-b s` and choosing
    a session from the presented list.


    While we are in a session, we can type `Ctrl-b d` to detach it and, in essence,
    put tmux into the background. This is useful if we want to create new a session
    by entering the `tmux new` command.


    If we start a new terminal (or log in from a remote terminal) and wish to attach
    an existing session to it, we can issue the command `tmux ls` to display a list
    of available sessions. To attach a session, we enter the command `tmux attach
    -d -t <session_name>`. The "-d" option causes the session to be detached from
    its previous terminal. Without this option, the session will be attached to both
    its previous terminal and the new terminal. If only one session is running, a
    `tmux attach` will connect to it and leave any existing connections intact.'
