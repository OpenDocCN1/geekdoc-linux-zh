  md: '# **How it Works**


    The structure of an AWK program is somewhat unique among programming languages.
    Programs consist of a series of one or more *pattern* and *action* pairs. Before
    we get into that though, let''s look at what the typical AWK program does.


    We already know that the typical AWK program acts as a filter. It reads data from
    standard input, and outputs filtered data on standard output. It reads data one
    *record* at a time. By default, a record is a line of text terminated by a newline
    character. Each time a record is read, AWK automatically separates the record
    into *fields*. Fields are, again by default, separated by whitespace. Each field
    is assigned to a variable, which is given a numeric name. Variable $1 is the first
    field, $2 is the second field, and so on. $0 signifies the entire record. In addition,
    a variable named NF is set containing the number of fields detected in the record.


    Pattern/action pairs are tests and corresponding actions to be performed on each
    record. If the pattern is true, then the action is performed. When the list of
    patterns is exhausted, the AWK program reads the next record and the process is
    repeated.


    Let''s try a really simple case. We''ll filter the output of an `ls` command:


    ```

    me@linuxbox ~ $ ls -l /usr/bin | awk ''{print $0}''

    ```


    The AWK program is contained within the single quotes following the `awk` command.
    Single quotes are important because we do not want the shell to attempt any expansion
    on the AWK program, since its syntax has nothing to do with the shell. For example,
    `$0` represents the value of the entire record the AWK program read on standard
    input. In AWK, the `$` means "field" and is not a trigger for parameter expansion
    as it is in the shell.


    Our example program consists of a single action with no pattern present. This
    is allowed and it means that every record matches the pattern. When we run this
    command, it simply outputs every line of input much like the `cat` command.


    If we look at a typical line of output from `ls -l`, we see that it consists of
    9 fields, each separated from its neighbor by one or more whitespace characters:


    ```

    -rwxr-xr-x 1 root root     265 Apr 17  2012 zxpdf

    ```


    Let''s add a pattern to our program so it will only print lines with more than
    9 fields:


    ```

    me@linuxbox ~ $ ls -l /usr/bin | awk ''NF > 9 {print $0}''

    ```


    We now see a list of symbolic links in `/usr/bin` since those directory listings
    contain more than 9 fields. This pattern will also match entries with file names
    containing embedded spaces, since they too will have more than 9 fields.'
