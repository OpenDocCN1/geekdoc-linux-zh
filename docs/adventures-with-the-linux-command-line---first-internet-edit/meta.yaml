  md: '# # Getting Help


    Vim has an extensive built-in help system. If we start vim:


    ```

    [me@linuxbox ~]$ vi

    ```


    and enter the command:


    ```

    :help

    ```


    It will appear at the top of the display.


    ![](bbox=[0.176, 0.257, 0.816, 0.571])


    *Vim help window*


    Though help is extensive and very useful, it immediately presents a problem because
    it creates a split in the display. This is a rather advanced feature that needs
    some explanation.


    Vim can divide the display into multiple panes, which in vim parlance are called
    windows. These are very useful when working with multiple files and other vim
    features such as help. When the display is divided this way, we can toggle between
    the windows by typing `Ctrl-w` twice. We can manipulate vim windows with the following
    commands:


    | Command | Description |

    |---|---|

    | `:split` | Create a new window |

    | `Ctrl-w Ctrl-w` | Toggle between windows |

    | `Ctrl-w _` | Enlarge the active window |

    | `Ctrl-w =` | Make windows the same size |

    | `:close` | Close active window |

    | `:only` | Close all other windows |


    156 Vim, with Vigor'
