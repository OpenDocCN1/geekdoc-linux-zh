  md: '![](bbox=[0.18, 0.108, 0.82, 0.449])


    *urxvt with default configuration*


    Like `xterm`, `rxvt` uses Xresources to control its configuration. The default
    `rxvt` configuration is very spare. Adding the following settings to our Xresources
    file will make it more palatable (`urxvt` shown):


    ```

    URxvt.geometry: 80x35

    URxvt.saveLines: 10000

