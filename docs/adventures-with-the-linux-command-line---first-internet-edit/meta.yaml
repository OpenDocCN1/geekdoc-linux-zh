  md: "# **Traps**\n\nIn addition to a normal exit and an error exit, a script can\
    \ also terminate when it receives a signal. For some scripts, this is an important\
    \ issue because if they exit in an unexpected manner, they may leave the system\
    \ in an undesirable state. To avoid this problem, we include traps to intercept\
    \ signals and perform cleanup procedures before the scripts exits. The three signals\
    \ of greatest importance are SIGINT (which occurs when Ctrl-c is typed) and SIGTERM\
    \ (which occurs when the system is shut down or rebooted) and SIGHUP (when a terminal\
    \ connection is terminated). Below is a set of traps to manage the SIGINT, SIGTERM,\
    \ and SIGHUP signals.\n\n```\n# Trap signals\ntrap \"signal_exit TERM\" TERM HUP\n\
    trap \"signal_exit INT\"  INT\n```\n\nDue to the syntactic limitations of the\
    \ `trap` builtin, it is best to use a separate function to act on the trapped\
    \ signal. Below is a function that handles the signal exit.\n\n```\nsignal_exit()\
    \ {  # Handle trapped signals\n\n    local signal=\"$1\"\n\n    case \"$signal\"\
    \ in\n        INT)\n            error_exit \"Program interrupted by user\"\n \
    \           ;;\n        TERM)\n            printf \"\\n%s\\n\" \"$PROGNAME: Program\
    \ terminated\" >&2\n            graceful_exit\n            ;;\n        *)\n  \
    \          error_exit \"$PROGNAME: Terminating on unknown signal\"\n         \
    \   ;;\n    esac\n}\n```\n\nWe use a `case` statement to provide different outcomes\
    \ depending on the signal received. In this example, we also see a call to a `graceful_exit`\
    \ function that could provide needed cleanup before the script terminates.\n\n\
    # **Temporary Files**\n\nWherever possible, temporary files should be avoided.\
    \ In many cases, process substitution can be used instead. Doing it this way will\
    \ reduce file clutter, run faster, and in some cases be more secure.\n\n```\n\
    # Rather than this:\ncommand1 > \"$TEMPFILE\"\n.\n.\n.\ncommand2 < \"$TEMPFILE\"\
    \n\n# Consider this:\ncommand2 < <(command1)\n```"
  merge: -1
