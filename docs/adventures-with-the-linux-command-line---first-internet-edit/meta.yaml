  md: '# # 6 dialog


    If we look at contemporary software, we might be surprised to learn that the majority
    of code in most programs today has very little to do with the real work for which
    the program was intended. Rather, the majority of code is used to create the user
    interface. Modern graphical programs need large amounts of CPU time and memory
    for their sophisticated eye candy. This helps explain why command line programs
    usually use so little memory and CPU compared to their GUI counterparts.


    Still, the command line interface is often inconvenient. If only there were some
    way to emulate common graphical user interface features on a text display.


    In this adventure, we’re going to look at `dialog`, a program that does just that.
    It displays various kinds of *dialog boxes* that we can incorporate into our shell
    scripts to give them a much friendlier face. `dialog` dates back a number of years
    and is now just one member of a family of programs that attempt to solve the user
    interface problem for command line users. The More Redirection adventure is a
    suggested prerequisite to this adventure.


    # ## Features


    `dialog` is a fairly large and complex program (it has almost 100 command line
    options), but compared to the typical graphical user interface, it’s a real lightweight.
    Still, it is capable of many user interface tricks. With `dialog`, we can generate
    the following types of dialog boxes (version 1.2 shown):


    | Dialog | Option | Description |

    | --- | --- | --- |

    | Build List | `--buildlist` | Displays two lists, side-by-side. The list on the
    left contains unselected items, the list on the right selected items. The user
    can move items from one list to the other. |

    | Calendar | `--calendar` | Displays a calendar and allow the user to select a
    date. |

    | Checklist | `--checklist` | Presents a list of choices and allow the user to
    select one or more items. |

    | Directory Select | `--dselect` | Displays a directory selection dialog. |

    | Edit Box | `--editbox` | Displays a rudimentary text file editor. |

    | Form | `--form` | Allows the user to enter text into multiple fields. |

    | File Select | `--fselect` | A file selection dialog. |

    | Gauge | `--gauge` | Displays a progress indicator showing the percentage of
    completion. |

    | Info Box | `--infobox` | Displays a message (with an optional timed pause) and
    terminates. |

    | Input Box | `--inputbox` | Prompts the user to enter/edit a text field. |

    | Menu Box | `--menubox` | Displays a list of choices. |'
  merge: -1
