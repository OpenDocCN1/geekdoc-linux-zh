- img_proc: false
  md: "a menu editing feature found in the \"Command\" pulldown menu. The entry is\
    \ called \"Edit menu file.\"\n\nIf we select this entry, Midnight Commander offers\
    \ us a choice of \"Local\" and \"User.\" The Local entry allows us to edit the\
    \ `.mc.menu` file in the current directory while selecting User will cause us\
    \ to edit the `~/.config/mc/menu` file. Note that if we select Local and the current\
    \ directory does not contain a menu file, Midnight Commander will copy the default\
    \ menu file into current directory as a starting point for our editing.\n\n# Menu\
    \ File Format\n\nSome parts of the user menu file format are pretty simple; other\
    \ parts, not so much. We'll start with the simple parts first.\n\nA menu file\
    \ consists of one or more entries. Each entry contains:\n\n+   - A single character\
    \ (usually a letter) that will act as a hot key for the entry when the menu is\
    \ displayed.\n- Following the hot key, on the same line, is the description of\
    \ the menu entry as it will appear on the menu.\n- On the following lines are\
    \ one or more commands to be performed when the menu entry is selected. These\
    \ are ordinary shell commands. Any number of commands may be specified, so quite\
    \ sophisticated operations are possible. Each command must be indented by at least\
    \ one space or tab.\n- A blank line to separate one menu entry from the next.\n\
    - Comments may appear on their own lines. Each comment line starts with a # character.\n\
    \nHere is an example user menu entry that creates an HTML template in the current\
    \ directory:\n\n```\n# Create a new HTML file\n\nH   Create a new HTML file\n\
    \    { echo \"<html>\"\n    echo \"\\t<head>\\n\\t</head>\"\n    echo \"\\t<body>\\\
    n\\t</body>\"\n    echo \"</html>\"; }  > new_page.html\n```\n\nNotice the absence\
    \ of the `-e` option on the `echo` commands used in this example. Normally, the\
    \ `-e` option is required to interpret the backslash escape sequences like `\\\
    t` and `\\n`. The reason they are omitted here is that Midnight Commander does\
    \ not use `bash` as the shell when it executes user menu commands. It uses `sh`\
    \ instead. Different distributions use different shell programs to emulate `sh`.\
    \ For example, Red Hat-based distributions use `bash` but Debian-based distributions\
    \ like Ubuntu and Raspberry Pi OS"
