  md: '# What the Shell is Good At


    +   - The shell is a powerful glue for connecting thousands of command line programs
    together into solutions to a variety of data processing and system administration
    problems.

    - The shell is adept at *batch processing*. In the early days of computing, programs
    were not interactive; that is, they started, they carried out their tasks, and
    they ended. This style of programming dominated computing until the early 1960s
    when disk storage and virtual memory made timesharing and interactive programs
    possible. Those of us who remember MS-DOS will recall that it had a limp substitute
    for shell scripts called batch files.


    # What the Shell is Not So Good At


    +   - The shell does not excel with programs requiring a lot of user interaction.
    Yes, the shell does have the `read` command and we could use `dialog`, but let''s
    face it, the shell is not very good at this.

    - The shell is not suitable for implementing algorithms requiring complex data
    structures. While the shell does have integers, strings, and one dimensional arrays
    (which can be associative), it doesn''t support anything beyond that. For example,
    it doesn''t have structures, enumerated or Boolean types, or even floating point
    numbers.


    # **A Coding Standard of Our Own**


    Keeping the points above in mind, let''s make our own shell script coding standard.
    It will be an amalgam of various published standards, along with a dash of the
    author''s own humble wisdom on the subject. As the name implies, the *LinuxCommand
    Bash Script Coding Style Guide* coding standard will be very `bash` specific and
    as such, it will use some features that are not found in strictly POSIX complaint
    shells.


    # Script Naming, Location, and Permissions


    Like other executables, shell script file names should not include an extension.
    Shared libraries of shell code which are not standalone executables should have
    the extension `.sh` if the code is portable across multiple shells (for example
    `bash` and `zsh`) or `.bash` if the code is bash-specific.


    For ease of execution, scripts should be placed in a directory listed in the user''s
    `PATH`. The `~/bin` directory is a good location for personal scripts as most
    Linux distributions support this out of the box. Scripts intended for use by all
    users should be located in the `/usr/local/bin` directory. System administration
    scripts (ones intended for the


    196 Coding Standards Part 1: Our Own'
