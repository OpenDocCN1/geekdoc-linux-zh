- img_proc: false
  md: 'After executing this command, pressing the Q key in normal mode will cause
    the normal mode sequence gqip to be performed.


    The `nnoremap` command is one of the `noremap` commands, the safe version of `map`
    command. The members of this family include:


    ```

    noremap     Map key regardless of mode

    nnoremap    Map normal mode key

    inoremap    Map insert mode key

    cnoremap    Map command mode key

    ```


    Most of the time we will be remapping normal mode keys, so the `nnoremap` command
    will be the used most often. Here is another example:


    ```

    :nnoremap S :split<Return>

    ```


    This command maps the s key to enter command mode, type the `split` command and
    a carriage return. The “<Return>” is called a *key notation*. For non-printable
    characters, vim has a representation that can be used to indicate the key when
    we specifying mapping. To see the entire list of possible codes, enter:


    ```

    :h key-notation

    ```


    So how do we know which keys are available for remapping assignment? As vim uses
    almost every key for something, we have to make a judgment call as to what native
    functionality we are willing to give up to get the mapping we want. In the case
    of the Q key, which we used in our first example, it is normally used to invoke
    ex mode, a very rarely used feature. There are many such cases in vim; we just
    have to be selective. It is best to check the key first by doing something like:


    ```

    :h Q

    ```


    to see how a key is being used before we apply our own mapping.

    To make mappings permanent, we can add these mapping commands to our `.vimrc`
    file:


    ```

    nnoremap Q gqip

    nnoremap S :split<Return>

    ```


    **Help topics:** `:map key-notation`


    # Snippets


    Mapping is not restricted to single characters. We can use sequences too. This
    is often helpful when we want to create a number of easily remembered, related
    commands of our own design. Take for example, inserting boilerplate text into
    a document. If we had a collection of these snippets, we might want to uniquely
    name them but have a common structure to the name for easily recollection.


    We added the GPL notice to the comment block at the beginning of our script. As
    this is rather tedious to type, and we might to use it again, it makes a good
    candidate for being a snippet.'
