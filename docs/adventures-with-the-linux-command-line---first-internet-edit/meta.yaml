  md: '# # 1 Midnight Commander


    At the beginning of Chapter 4 in TLCL there is a discussion of GUI-based file
    managers versus the traditional command line tools for file manipulation such
    as `cp`, `mv`, and `rm`. While many common file manipulations are easily done
    with a graphical file manager, the command line tools provide additional power
    and flexibility.


    In this adventure we will look at Midnight Commander, a character-based directory
    browser and file manager that bridges the two worlds of the familiar graphical
    file manager and the common command line tools.


    The design of Midnight Commander is based on a common concept in file managers:
    dual directory panes where the listings of two directories are shown at the same
    time. The idea is that files are moved or copied from the directory shown in one
    pane to the directory shown in the other. Midnight Commander can do this, and
    much, much more.


    # ## *Features*


    Midnight Commander is quite powerful and boasts an extensive set of features:


    +   - Performs all the common file and directory manipulations such as copying,
    moving, renaming, linking, and deleting.

    - Allows manipulation of file and directory permissions.

    - Can treat remote systems (via FTP or SSH) as though they were local directories.

    - Can treat archive files (like .tar and .zip) as though they were local directories.

    - Allows creation of a user-defined "hotlist" of frequently used directories.

    - Can search for files based on file name or file contents, and treat the search
    results like a directory.


    # ## *Availability*


    [Midnight Commander](http://midnight-commander.org) is part of the GNU project.
    It is installed by default in some Linux distributions, and is almost always available
    in every distribution''s software repositories as the package "mc".


    # ## *Invocation*


    To start Midnight Commander, enter the command `mc` followed optionally by either
    1 or 2 directories to browse at start up.'
  merge: -1
  pgno: 10
- img_proc: false
  md: "# ## Screen Layout\n\n![](bbox=[0.17, 0.132, 0.808, 0.398])\n\n*Midnight Commander\
    \ screen layout*\n\n+   1. **Left and Right Directory Panels**\n\n   The center\
    \ portion of the screen is dominated by two large *directory panels*. One of the\
    \ two panels (called the *current panel*) is active at any one time. To change\
    \ which panel is the current panel, press the `Tab` key.\n\n2. **Function Key\
    \ Labels**\n\n   The bottom line on the display contains function key (F1-F10)\
    \ shortcuts to the most commonly used functions.\n\n3. **Menu Bar**\n\n   The\
    \ top line of the display contains a set of pull-down menus. These can be activated\
    \ by pressing the `F9` key.\n\n4. **Command Line**\n\n   Just above the function\
    \ key labels there is a shell prompt. Commands can be entered in the usual manner.\
    \ One especially useful command is `cd` followed by a directory pathname. This\
    \ will change the directory shown in the current directory panel.\n\n5. **Mini-Status\
    \ Line**\n\n   At the very bottom of the directory panel and above the command\
    \ line is the *mini-status line*. This area is used to display supplemental information\
    \ about the currently selected item such as the targets of symbolic links."
  merge: -1
