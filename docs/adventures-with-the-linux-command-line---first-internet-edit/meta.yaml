  md: '*Termux displaying builtin shell commands*


    We can have dot files (like `.bashrc`) and even write shell scripts and compile
    and debug programs in Termux. Pretty neat.


    When executing `ssh`, Termux looks like a "xterm-256color" terminal to remote
    systems.


    # Chrome/Chrome OS


    Google makes a decent SSH client for Chrome and Chrome OS (which is Linux, too,
    after all) that allows logging on to remote systems. Called Secure Shell, it uses
    hterm (HTML Terminal, a terminal emulator written in JavaScript) combined with
    an SSH client. To remote systems, it looks like a "xterm-256color" terminal. It
    works pretty well, but lacks some features that advanced SSH users may need.


    Secure Shell is available at the Chrome Web Store.


    ![](bbox=[0.184, 0.379, 0.811, 0.704])


    *Secure Shell running on Chrome OS*


    # Summing Up


    Given that our terminal emulators are among our most vital tools, they should
    command more of our attention. There are many different terminal programs with
    potentially interesting and helpful features, many of which, most users rarely,
    if ever, use. This is a shame since many of these features are truly *useful*
    to the busy command line user. We have looked at a few of the ways these features
    can be applied to our daily routine, but there are certainly many more.'
