    \ of files given\n                      as arguments\n--preserve-root       --\
    \ do not remove / (default)\n--recursive     -R -r -- remove directories and their\
    \ contents\n                      recursively\n--verbose       -v    -- explain\
    \ what is being done\n--version             -- output version information and\
    \ exit\n```\n\nThis displays a list of options for the command, and like the `cd`\
    \ command, repeatedly pressing `tab` causes `zsh` to cycle through the available\
    \ options.\n\n# ## Pathname Expansion\n\nThe Z shell provides several powerful\
    \ additions to pathname expansion that can save steps when specifying files as\
    \ command arguments.\n\nWe can use \"**\" to cause recursive expansion. For example,\
    \ if we wanted to list every file name ending with `.txt` in our home directory\
    \ and its subdirectories, we would have to do this in **bash**:\n\n```\nme@linuxbox\
    \ ~ $ find . -name \"*.txt\" | sort\n```\n\nIn **zsh**, we could do this:\n\n\
    ```\nme@linuxbox ~ $ ls **/*.txt\n```\n\nand get the same result.\n\nAnd if that\
    \ weren't cool enough, we can also add *qualifiers* to the wildcard to perform\
    \ many of the same tests as the `find` command. For example:\n\n```\nme@linuxbox\
