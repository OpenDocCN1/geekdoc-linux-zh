  md: '# # 9 Other Shells


    While we have spent a great deal of time learning the bash shell, it''s not the
    only "game in town." Unix has had several popular shells and almost all are available
    for Linux, too. In this adventure, we will look at some of these, mostly for their
    historical significance. With a couple of possible exceptions, there is very little
    reason to switch, as bash is a pretty good shell. Some of these alternate shells
    are still popular on other Unix and Unix-like systems, but are rarely used in
    Linux except when compatibility with other systems is required.


    # ## *The Evolution of Shells*


    The first Unix shell was developed in 1971 by Ken Thompson who, along with Dennis
    Richie, created Unix at AT&T Bell Telephone Laboratories. The *Thompson shell*
    introduced many of the core ideas that we see in shells today. These include I/O
    redirection, pipelines, and the ability to place processes in the background.
    This early shell was intended only for interactive use, not for use as a programming
    language.


    The Thompson shell was followed in 1975 by the *Mashey shell*, written by John
    Mashey. This shell extended the Thompson shell to support shell scripting by including
    variables, a built-in if/then/else, and other rudimentary flow control constructs.


    At this point we come to a big split in shell design philosophies. In 1978 Steve
    Bourne created the *Bourne shell*. The following year, Bill Joy (the original
    author of `vi`) released the *C shell*.


    The Bourne shell added a lot of features that greatly improved shell scripting.
    These included flow control structures, better variables, command substitutions,
    and here scripts. The Bourne shell contains much of the functionality that we
    see in the bash shell today.


    On the other hand, the C shell was designed to improve interactive use by adding
    command history and job control. The C shell, as its name would imply, uses a
    syntax that mimics the C programming language. C language programmers abounded
    in the Unix community, so many preferred this style. Ironically, the C shell is
    not very good at scripting. For example, it lacks user defined functions and the
    shell''s parser (the portion of the shell that reads and figures out what the
    script is saying) suffers from serious limitations.


    In 1983, in an effort to improve the Bourne shell, David Korn released the *Korn
    shell*. Command history, job control, associative arrays, vi and Emacs style command
    editing are among the features that were added. In the 1993 release (known as
    `ksh93`), floating point arithmetic was added. The Korn shell was good for both
    interactive use and'
  merge: -1
  pgno: 152
- img_proc: false
  md: "scripting. Unfortunately, the Korn shell was proprietary software distributed\
    \ under license from AT&T. This changed in 2000 when it was released under an\
    \ open source license.\n\nWhen POSIX standardized the shell for use on Unix systems,\
    \ it specified a subset of the Korn shell that would be largely compatible with\
    \ the earlier Bourne shell. As a result, most Bourne-type shells now conform to\
    \ the POSIX standard, but include various extensions.\n\nPartially in response\
    \ to the proprietary licensing of the Korn shell, the GNU project developed `bash`,\
    \ which includes many Korn shell features. The first version, written by Brian\
    \ Fox was released in 1989 and is today maintained by Chet Ramey. Bash is best\
    \ known as the default shell in most Linux distributions. It is also the default\
    \ shell in versions of macOS; however, due to Apple’s obsession with secrecy and\
    \ lock-down, they refuse to update `bash` to version 4 because of provisions in\
    \ the GNU GPLv3.\n\nSince the development of `bash`, one new shell has emerged\
    \ that is gaining traction among Linux and MacOS users. It’s the *Z shell* (zsh).\
    \ Sometimes described as “the Emacs of shells” because of its large feature set,\
    \ `zsh` adds a number of features to enhance interactive use.\n\n# Modern Implementations\n\
    \nModern Linux users have a variety of shell programs from which to choose. Of\
    \ course, the overwhelming favorite is `bash`, since it is the default shell supplied\
    \ with most Linux distributions. That said, users migrating from other Unix and\
    \ Unix-like systems may be more comfortable with other shells. There is also the\
    \ issue of portability. If a script is required to run on multiple Unix-like systems,\
    \ then care must be taken to either: 1) make sure that all the systems are running\
    \ the same shell program, or 2) write a script that conforms to the POSIX standard,\
    \ since most modern Bourne shell derivatives are POSIX complaint.\n\n# A Reference\
    \ Script\n\nIn order to compare the various shell dialects, we’ll start with this\
    \ `bash` script taken from Chapter 33 of TLCL:\n\n```\n#!/bin/bash\n\n# longest-word\
    \ : find longest string in a file\n\nfor i; do\n  if [[ -r \"$i\" ]]; then\n \
    \   max_word=\n    max_len=0\n    for j in $(strings \"$i\"); do\n      len=${#j}\n\
    \      if (( len > max_len )); then\n        max_len=$len\n```"
