    --hide-control-chars               --version

    --human-readable                   --width=

    ```


    An option can be completed by typing a partial option followed by `Tab`. For example,
    typing "ls –ver" then `Tab` will complete to "ls –version".


    The bash-completion system is interesting in its own right as it is implemented
    by a series of shell scripts that make use of the `complete` and `compgen` bash
    builtins. The main body of the work is done by the `/etc/bash_completion` (or
    `/usr/share/bash-completion/bash_completion` in newer versions) script along with
    additional scripts for individual programs in either the `/etc/bash-completion.d`
    directory or the `/usr/share/bash-completion/completions` directory. These scripts
    are good examples of advanced scripting technique and are worthy of study.


