  md: '# **Tabs**


    Busy terminal users will often find themselves working in multiple terminal sessions
    at once. It may be to perform operations on several machines at the same time,
    or to manage a complex set of tasks on a single system. This problem can be addressed
    either by opening multiple terminal windows, or by having multiple tabs in a single
    window.


    The File menu in `gnome-terminal` offers both choices (well, in older versions
    anyway). In newer versions, use the keyboard shortcut `Ctrl-Shift-T` to open a
    tab. Tabs can be rearranged with the mouse, or can be dragged out of the window
    to create a new window. With `gnome-terminal`, we can even drag a tab from one
    terminal window to another.


    # ***Keyboard Shortcuts***


    Since, in an ideal universe, we never lift our fingers from the keyboard, we need
    ways of controlling our terminal without resorting to a mouse. Fortunately, `gnome-terminal`
    offers a large set of keyboard shortcuts for common operations. Here are some
    of the most useful ones, defined by default:


    | Shortcut | Action |

    |----------|--------|

    | Ctrl-Shift-N | New Window |

    | Ctrl-Shift-W | Close Window |

    | F11 | View terminal full screen |

    | Shift-PgUp | Scroll up |

    | Shift-PgDn | Scroll down |

    | Shift-Home | Scroll to the beginning |

    | Shift-End | Scroll to the end |

    | Ctrl-Shift-T | New Tab |

    | Ctrl-Shift-Q | Close Tab |

    | Ctrl-PgUp | Next Tab |

    | Ctrl-PgDn | Previous Tab |

    | Alt-n | Where n is a number in the range of 1 to 9, go to tab n |


    *Gnome-terminal keyboard shortcuts*


    Keyboard shortcuts are also user configurable.


    While it is well known that `Ctrl-c` and `Ctrl-v` cannot be used in the terminal
    window to perform copy and paste, `Ctrl-Shift-C` and `Ctrl-Shift-V` will work
    in their place with `gnome-terminal`.


