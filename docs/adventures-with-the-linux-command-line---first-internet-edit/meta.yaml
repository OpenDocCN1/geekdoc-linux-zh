  md: "tcsh. Compared to csh, tcsh added additional command history features, Emacs\
    \ and vi-style command line editing, spelling correction, and other improvements\
    \ intended for interactive use. Early versions of Apple's OS X used tcsh as the\
    \ default shell. It is still the default root shell on several BSD distributions.\n\
    \ntcsh, like the C shell, is not POSIX compliant as we can see here:\n\n```\n\
    #!/usr/bin/tcsh\n\n# longest-word.tcsh : find longest string in a file\n\nforeach\
    \ i ($argv)\n    set max_word=\"\"\n    set max_len=0\n    foreach j (`strings\
    \ $i`)\n        set len=$%j\n        if ($len > $max_len) then\n            set\
    \ max_word=$j\n            set max_len=$len\n        endif\n    end\n    echo\
    \ \"$i : $max_word ($max_len characters)\"\nend\n```\n\nOur tcsh version of the\
    \ script demonstrates many differences from Bourne style syntax. In C shell, most\
    \ of the flow control statements are different. We see for example, that the outer\
    \ loop starts with a foreach statement incrementing the variable i with succeeding\
    \ values from the word list $argv. argv, taken from the C programming language,\
    \ refers to an array containing the list of command line arguments.\n\nWhile this\
    \ simple script works, tcsh is not very capable when things get more complicated.\
    \ It has two major weaknesses. First, it does not support user-defined functions.\
    \ As a workaround, separate scripts can be called from the main script to carry\
    \ out the individual functions. Second, many complex constructs easily accomplished\
    \ with the POSIX shell, such as:\n\n```\n{ if [[ \"$a\" ]]; then\n    grep \"\
    string1\"\n  else\n    grep \"string2\"\n  fi\n} < file.txt\n```\n\nare not possible\
    \ because the C shell parser cannot handle redirection with flow control statements.\
    \ The parser also makes quoting very troublesome.\n\n# ksh - Korn Shell\n\nThe\
    \ Korn shell comes in several different flavors. Basically, there are two groups,\
    \ ksh88 and ksh93, reflecting the year of their release. There is a public domain\
    \ version of ksh88 called pdksh, and more official versions of both ksh88 and\
    \ ksh93. All three are available for Linux. ksh93 would be the preferred version\
    \ for most users, as it is the version found"
