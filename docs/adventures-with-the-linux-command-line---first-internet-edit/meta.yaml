    # Creating and Deleting Tables


    The first 2 lines of our SQL stream deletes any existing table named `Package_Descriptions`
    and creates a new table with that name. The `DROP TABLE` statement deletes a table.
    The optional `IF EXISTS` clause is used to prevent errors if the table does not
    already exist. There are a lot of optional clauses in SQL. The `CREATE TABLE`
    statement defines a new table. As we can see, this table will have 2 columns.
    The first column, `package_name` is defined to be a variable length string up
    to 60 characters long. `VARCHAR` is one of the available data types we can define.
    Here are some of the common data types supported by SQL databases:


    | Data Type | Description |

    |---|---|

    | INTEGER | Integer |

    | CHAR(n) | Fixed length string |

    | VARCHAR(n) | Variable length string |

    | NUMERIC | Decimal numbers |

    | REAL | Floating point numbers |

    | DATETIME | Date and time values |


    *Common SQL data types*


    # Data Types


    SQL databases support many types of data. Unfortunately, this varies by vendor.
    Even in cases where two databases share the same data type name, the actual meaning
    of the data type can differ. Data types in SQLite, unlike other SQL databases,
    are not rigidly fixed. Values in SQLite are *dynamically typed*. While SQLite
    allows many of the common data types found in other databases to be specified,
    it actually only supports 4 general types of data storage.


    | Data Type | Description |

    |---|---|

    | INTEGER | Signed integers using 1, 2, 3, 4, 6, or 8 bytes as needed |

    | REAL | 8-byte IEEE floating point numbers |

    | TEXT | Text strings |

    | BLOB | Binary large objects (for example JPEG, or MP3 files) |


    *SQLite data types*


    In our example above, we specified `VARCHAR` as the data type for our columns.
    SQLite is perfectly happy with this, but it actually stores the values in these
    columns as just `TEXT`. It ignores the length restrictions set in the data type
    specification. SQLite is extremely'
