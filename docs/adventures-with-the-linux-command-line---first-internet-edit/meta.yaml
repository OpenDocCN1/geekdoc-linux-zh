  md: '# Duplicating File Descriptors


    It is sometimes desirable to write more than one output stream (for example standard
    output and standard error) to the same file. To do this, we would write something
    like this:


    `command > file 2>&1`


    We''ll add the assumed file descriptor to the first redirection to make things
    a little clearer:


    `command 1> file 2>&1`


    This is an example of *duplication*. When we read this statement, we see that
    file descriptor 1 is changed from pointing to the terminal device to instead pointing
    to *file*. This is followed by the second redirection that causes file descriptor
    2 to be a duplicate (i.e., it points to the same file) of file descriptor 1. When
    we look at things this way, it''s easy to see why the order of redirections is
    important. For example, if we reverse the order:


    `command 2>&1 1> file`


    file descriptor 2 becomes a duplicate of file descriptor 1 (which points to the
    terminal) and then file descriptor 1 is set to point to *file*. The final result
    is file descriptor 1 points to *file* while file descriptor 2 still points to
    the terminal.


    # exec


    Before we go any farther, we need to take a brief detour and talk about a shell
    builtin that we didn''t cover in TLCL. This builtin is named `exec` and it does
    some interesting things. Its main purpose is to terminate the shell and launch
    another program in its place. This is often used in startup scripts that initiate
    system services. However, it is not common in scripts used for other purposes.


    Usage of `exec` is described below:


    ```

    exec [program] [redirections]

    ```


    *program* is the name of the program that will start and take the place of the
    shell. *redirections* are the redirections to be used by the new program.


    One feature of `exec` is useful for our study of redirection. If *program* is
    omitted, any specified redirections are performed on the current shell. For example,
    if we included this near the beginning of a script:


    ```

    exec 1> output.txt

    ```


    from that point on, every command using standard output would send its data to
    `output.txt`. It should be noted that if this trick is performed by a script,
    it is no longer'
