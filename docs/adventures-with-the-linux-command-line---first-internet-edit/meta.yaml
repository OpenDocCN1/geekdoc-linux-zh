  md: '# # 2 Terminal Multiplexers


    It''s easy to take the terminal for granted. After all, modern terminal emulators
    like gnome-terminal, konsole, and the others included with Linux desktop environments
    are feature-rich applications that satisfy most of our needs. But sometimes we
    need more. We need to have multiple shell sessions running in a single terminal.
    We need to display more than one application in a single terminal. We need to
    move a running terminal session from one computer to another. In short, we need
    a *terminal multiplexer*.


    Terminal multiplexers are programs that can perform these amazing feats. In this
    adventure, we will look at three examples: GNU screen, tmux, and byobu.


    # ## Some Historical Context


    If we were to go back in time to say, the mid-1980s, we might find ourselves staring
    at a computer terminal; a box with an 80-column wide, 24-line high display and
    a keyboard connected to a shared, central Unix computer via an RS-232 serial connection
    and, possibly, an acoustic-coupler modem and a telephone handset. On the display
    screen there might be a shell prompt not unlike the prompt we see today during
    a Linux terminal session. However, unlike today, the computer terminal of the
    1980s did not have multiple windows or tabs to display multiple applications or
    shell sessions. We only had one screen and that was it. Terminal multiplexers
    were originally developed to help address this limitation. A terminal multiplexer
    allows multiple sessions and applications to be displayed and managed on a single
    screen. While modern desktop environments and terminal emulator programs support
    multiple windows and tabbed terminal sessions, which mitigate the need of terminal
    multiplexers for some purposes, terminal multiplexers still offer some features
    that will greatly enhance our command-line experience.


    # ## GNU Screen


    GNU screen goes way back. First developed in 1987, screen appears to be the first
    program of its type and it defined the basic feature set found in all subsequent
    terminal multiplexers.


    # ### Availability


    As its name implies, GNU screen is part of the GNU Project. Though it is rarely
    installed by default, it is available in most distribution repositories as the
    package “screen”.


    # ### Invocation


    We can start using GNU screen by simply entering the `screen` command at the shell
    prompt. Once the command is launched, we will be presented with a shell prompt.'
  merge: -1
  pgno: 38
- img_proc: false
  md: '# # Multiple Windows


    At this point, screen is running and has created its first *window*. The terminology
    used by screen is a little confusing. It is best to think of it this way: screen
    manages a *session* consisting of one or more *windows* each containing a shell
    or other program. Furthermore, screen can divide a terminal display into multiple
    *regions*, each displaying the contents of a window.


    Whew! This will start to make sense as we move forward.


    In any case, we have screen running now, and it''s displaying its first window.
    Let''s enter a command in the current window:


    ```

    me@linuxbox: ~ $ top

    ```


    ![](bbox=[0.186, 0.328, 0.813, 0.616])


    *Initial screen window*


    So far, so good. Now, let''s create another window. To do this, we type `Ctrl-a`
    followed by the character "c". Our terminal screen should clear and we should
    see a new shell prompt. So what just happened to our first window with `top` running
    in it? It''s still there, running in the background. We can return to the first
    window by typing `Ctrl-a p` (think "p" for "previous").


    Before we go any further, let''s talk about the keyboard. Controlling screen is
    pretty simple. Every command consists of `Ctrl-a` (called the "command prefix"
    or "escape sequence") followed by another character. We have already seen two
    such commands: `Ctrl-a c` to create a new window, and `Ctrl-a p` to switch from
    the current window to the previous one. Typing the command `Ctrl-a ?` will display
    a list of all the commands.'
  merge: -1
  pgno: 39
- img_proc: false
  md: 'GNU screen has several commands for switching from one window to another. Like
    the “previous” command, there is a “next” command `Ctrl-a n`. Windows are numbered,
    starting with 0, and may be chosen directly by typing `Ctrl-a` followed by a numeral
    from 0 to 9. It is also possible list all the windows by typing `Ctrl-a "`. This
    command will display a list of windows, where we can choose a window.


    ![](bbox=[0.18, 0.21, 0.81, 0.52])


    *Screen window list*


    As we can see, windows have names. The default name for a window is the name of
    the program the window was running at the time of its creation, hence both of
    our windows are named “bash”. Let’s change that. Since we are running `top` in
    our first window, let’s make its name reflect that. Switch to the first window
    using any of the methods we have discussed, and type the command `Ctrl-a A` and
    we will be prompted for a window name. Simple.


    Okay, so we have created some windows, how do we destroy them? A window is destroyed
    whenever we terminate the program running in it. After all windows are destroyed,
    screen itself will terminate. Since both of our windows are running bash, we need
    only exit each respective shell to end our screen session. In the case of a program
    that refuses to terminate gracefully, `Ctrl-a k` will do the trick.


    Let’s terminate the shell running `top` by typing `q` to exit `top` and then enter
    `exit` to terminate `bash`, thereby destroying the first window. We are now taken
    to the remaining window still running its own copy of `bash`. We can confirm this
    by typing `Ctrl-a "` to view the window list again.'
  merge: -1
  pgno: 40
- img_proc: false
  md: 'It''s possible to create windows and run programs without an underlying shell.
    To do this, we enter `screen` followed by the name of the program we wish to run,
    for example:


    ```

    me@linuxbox: ~ $ screen vim ~/.bashrc

    ```


    We can even do this in a screen window. Issuing a `screen` command in a screen
    window does not invoke a new copy of screen. It tells the existing instance of
    screen to carry out an operation like creating a new window.


    # Copy and Paste


    Given that GNU screen was developed for systems that have neither a graphical
    user interface nor a mouse, it makes sense that screen would provide a way of
    copying text from one screen window to another. It does this by entering what
    is called *scrollback mode*. In this mode, screen allows the text cursor to move
    freely throughout the current window and through the contents of the *scrollback
    buffer*, which contains previous contents of the window.


    We start scrollback mode by typing `Ctrl-a [`. In scrollback mode we can use the
    arrow keys and the `Page Up` and `Page Down` keys to navigate the scrollback buffer.
    To copy text, we first need to mark the beginning and end of the text we want
    to copy. This is done by moving the text cursor to the beginning of the desired
    text and pressing the space bar. Next, we move the cursor to the end of the desired
    text (which is highlighted as we move the cursor) and press the space bar again
    to mark the end of the text to be copied. Marking text exits scrollback mode and
    copies the marked text into screen''s internal buffer. We can now paste the text
    into any screen window. To do this, we go to the desired window and type `Ctrl-a
    ]`.'
  merge: -1
  pgno: 41
