    # ## Registers


    We are no doubt familiar with the idea of copying and pasting in text editors.
    With vim, we know `y` performs a yank (copy) of the selected text, while `p` and
    `P` each paste text at the current cursor location. The way vim does this involves
    the use of *registers*.


    Registers are named areas of memory where vim stores text. We can think of them
    as a series of string variables. Vim uses one particular set to store text that
    we delete, but there are others that we can use to store text and restore it as
    we desire. It''s like having a multi-element clipboard.


    To refer to a register, we type `"` followed by a lowercase letter or a digit
    (though these have a special use), for example:


    ```

    "a

    ```


    refers to the register named "a". To place something in the register, we follow
    the register with an operation like "yank to end of the line":


    ```

    "ay$

    ```


    To recall the contents of a register, we follow the name of the register with
    a paste operation like so:


    ```

    "ap

    ```'
