  md: 'We can use any lowercase letter to name a mark. Now, the clever among us will
    remember that we set marks in both the `.vimrc` file, and the `sh.vim` file but
    we used uppercase letters.


    Yes we did, because they''re special. They''re called *file marks* and they let
    us set a mark in a file that vim will remember between sessions. Since we set
    the V mark in the `.vimrc` file and the S mark in `sh.vim` file, if we ever type:


