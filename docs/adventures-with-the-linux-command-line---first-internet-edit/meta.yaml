  md: 'superuser) should be placed in `/usr/local/sbin`. Shared code can be located
    in any subdirectory of the user''s home directory. Shared code intended for use
    system wide should be placed in `/usr/local/lib` unless the shared code specifies
    only configuration settings, in which case it should be located in `/usr/local/etc`.


    Executable code must be both readable and executable to be used, thus the permission
    setting for shell scripts should be 755, 750 or 700 depending on security requirements.
    Shared code need only be readable, thus the permissions for shared code should
    be 644, 640, or 600.


    # Structure


    A shell script is divided into five sections. They are:


    +   1. The shebang

    2. The comment block

    3. Constants

    4. Functions

    5. Program body


    # The Shebang


    The first line of a script should be a shebang in either of the following forms:


    ```

    #!/bin/bash

    ```


    Or


    ```

    #!/usr/bin/env bash

    ```


    The second form is used in cases where the script is intended for use on a non-Linux
    system (such as macOS). The `env` command will search the user''s `PATH` for a
    `bash` executable and launch the first instance it finds. Of the two forms, the
    first is preferred, as its results are less ambiguous.


    # The Comment Block


    The first bit of documentation to appear in the script is the comment block. This
    set of comments should include the name of the script and its author, any necessary
    copyright and licensing information, a brief description of the script''s purpose,
    and its command line options and arguments.


    It is also useful to include version information and a revision history. Here
    is an example of a fully populated comment block. The exact visual style of the
    block is undefined and is left to the programmer''s discretion.


    ```

    # ---------------------------------------------------------------------------

    # new_script - Bash shell script template generator

    ```'
