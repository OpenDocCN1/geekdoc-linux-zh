  md: '# Operators


    | Type | Operators |

    | :--- | :--- |

    | Assignment | = += -= *= /= %= ^= ++ -- |

    | Relational | < > <= >= == != |

    | Arithmetic | + - * / % ^ |

    | Matching | ~ !~ |

    | Array | in |

    | Logical | || && |


    # Arithmetic and logical operators


    These operators behave like those in the shell; however, unlike the shell, which
    is limited to integer arithmetic, AWK arithmetic is floating point. This makes
    AWK a good way to do more complex arithmetic than the shell alone.


    Arithmetic and logical expressions can be used in both patterns and actions. Here''s
    an example that counts the number of lines containing exactly 9 fields:


    ```

    ls -l /usr/bin | awk ''NF == 9 {count++} END {print count}''

    ```


    This AWK program consists of 2 pattern/action pairs. The first one matches lines
    where the number of fields is equal to 9. The action creates and increments a
    variable named `count`. Each time a line with exactly 9 fields is encountered
    in the input stream, `count` is incremented by 1.


    The second pair matches when the end of the input stream is reached and the resulting
    action prints the final value of `count`.


    Using this basic form, let''s try something a little more useful; a program that
    calculates the total size of the files in the list:


    ```

    ls -l /usr/bin | awk ''NF >=9 {total += $5} END {print total}''

    ```


    Here is a slight variation (with shortened variable names to make it a little
    more concise) that calculates the average size of the files:


    ```

    ls -l /usr/bin | awk ''NF >=9 {c++; t += $5} END {print t / c}''

    ```


    # Flow Control


    AWK has many of the same flow control statements that we''ve seen previously in
    the shell (with the notable exception of case, though we can think of an AWK program
    as one big case statement inside a loop) but the syntax more closely resembles
    that of the C programming language. Actions in AWK often contain complex logic
    consisting of various statements and flow control instructions. A statement in
    this context can be a simple statement like:


    ```

    a = a + 1

    ```


    Or a compound statement enclosed in braces such as:


    ```

    {a = a + 1; b = b * a}

    ```'
