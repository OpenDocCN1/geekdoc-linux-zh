    # **Termux**


    The Termux app for Android is unexpectedly amazing. It goes beyond being merely
    an SSH client; it provides a full shell environment on Android without having
    to root the device.


    After installation, there is a minimal base system with a shell (`bash`) and many
    of the most common utilities. Initially, these utilities are the ones built into
    `busybox` (a compact set of utilities joined into a single program that is often
    used in embedded systems to save space), but the `apt` package management program
    (like on Debian/Ubuntu) is provided to allow installation of a wide variety of
    Linux programs.'
