  md: "use `dash` instead. `dash` is a compact shell program that is `sh` compatible\
    \ but lacks many of the features found in `bash`. The `dash` man page describes\
    \ the features of that shell.\n\nThis command will reveal which program is actually\
    \ providing the `sh` emulation (i.e., is symbolically linked to `sh`):\n\n```\n\
    me@linuxbox ~ $ ls -l /bin/sh\n```\n\n# Macros\n\nWith that bit of silliness out\
    \ of the way, let's look at how we can get a user menu entry to act on currently\
    \ selected or tagged files. First, it helps to understand a little about how Midnight\
    \ Commander executes user menu commands. It's done by writing the commands to\
    \ a file (essentially a shell script) and then launching `sh` to execute the contents\
    \ of the file. During the process of writing the file, Midnight Commander performs\
    \ *macro substitution*, replacing embedded symbols in the menu entry with alternate\
    \ values. These macros are single alphabetic characters preceded by a percent\
    \ sign. When Midnight Commander encounters one of these macros, it substitutes\
    \ the value the macro represents. Here are the most commonly used macros:\n\n\
    | Macro | Meaning |\n|---|---|\n| %f | Selected file's name |\n| %x | Selected\
    \ file's extension |\n| %b | Selected file's name stripped of extension (basename)\
    \ |\n| %d | Name of the current directory |\n| %t | The list of tagged files |\n\
    | %s | If files are tagged, they are used, else the selected file is used. |\n\
    \n*List of common macros*\n\nLet's say we wanted to create a user menu entry that\
    \ would resize a JPEG image using the ever-handy `convert` program from the ImageMagick\
    \ suite. Using macros, we could write a menu entry like this, which would act\
    \ on the currently selected file:\n\n```\n# Resize an image using convert\n\n\
    R Resize image to fit within 800 pixel bounding square\n  size=800\n  convert\
    \ \"%f\" -resize ${size}x${size} \"%b-${size}.%x\"\n```\n\nUsing the `%b` and\
    \ `%x` macros, we are able to construct a new output file name for the resized\
