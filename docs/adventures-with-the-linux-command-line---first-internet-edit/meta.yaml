    *Browsing the examples with Midnight Commander*


    # ## How it Works


    On the surface, `dialog` appears straightforward. We launch `dialog` followed
    by one or more common options (options that apply regardless of the desired dialog
    box) and then the box option and its associated parameters. The tricky part of
    using `dialog` is getting data out of it.


    The data that `dialog` takes in (such as a string entered into a input box) is
    normally returned on standard error. This is because `dialog` uses standard output
    to display text on the terminal when it is drawing the dialog box itself. There
    are a couple of techniques we can use to handle the returned data. Let''s take
    a look at them.


    # ## Method 1: Store the Results in a Temporary File


    The first method is to use a temporary file. The sample programs supplied with
    `dialog` provide some examples (this script has been modified from the original
    for clarity):


    ```

