  md: '# Using the Keyboard and Mouse


    Being a character-based application with a lot of features means Midnight Commander
    has a lot of keyboard commands, some of which it shares with other applications;
    others are unique. This makes Midnight Commander a bit challenging to learn. Fortunately,
    Midnight Commander also supports mouse input on most terminal emulators (and on
    the console if the gpm package is installed), so it’s easy to pick up the basics.
    Learning the keyboard commands is needed to take full advantage of the program’s
    features, however.


    Another issue when using the keyboard with Midnight Commander is interference
    from the window manager and the terminal emulator itself. Many of the function
    keys and Alt-key combinations that Midnight Commander uses are intercepted for
    other purposes by the terminal and window manager.


    To work around this problem, Midnight Commander allows the `Esc` key to function
    as a Meta-key. In cases where a function key or Alt-key combination is not available
    due to interference from outside programs, use the `Esc` key instead. For example,
    to input the `F1` key, press and release the `Esc` key followed by the “1” key
    (use “0” for `F10`). The same method works with troublesome Alt-key combinations.
    For example, to enter `Alt-t`, press and release the `Esc` key followed by the
    “t” key. To close dialog boxes in Midnight Commander, press the `Esc` key twice.


    # Navigation and Browsing


    Before we start performing file operations, it’s important to learn how to use
    the directory panels and navigate the file system.


    As we can see, there are two directory panels, the left panel and the right panel.
    At any one time, one of the panels is active and is called the *current panel*.
    The other panel is conveniently called the *other panel* in the Midnight Commander
    documentation.


    The current panel can be identified by the highlighted bar in the directory listing,
    which can be moved up and down with the arrow keys, `PgUp`, `PgDn`, etc. Any file
    or directory which is highlighted is said to be *selected*.


    Select a directory and press `Enter`. The current directory panel will change
    to the selected directory. Highlighting the topmost item in the listing selects
    the parent directory. It is also possible to change directories directly on the
    command line below the directory panels. To do so, simply enter `cd` followed
    by a path name as usual.


    Pressing the `Tab` key switches the current panel.'
  merge: -1
  pgno: 12
- img_proc: false
  md: '# Changing the Listing Format


    The directory listing can be displayed in several different formats. Pressing
    `Alt-t` cycles through them. There is a dual column format, a format resembling
    the output of `ls -l`, and others.


    There is also an “information mode.” This will display detailed file system information
    in the other panel about the selected item in the current panel. To invoke this
    mode, type `Ctrl-x i`. To return the other panel to its normal state, type `Ctrl-x
    i` again.


    ![](bbox=[0.18, 0.267, 0.816, 0.557])


    *Directory panel in information mode*


    # Setting the Directory on the Other Panel


    It is often useful to select a directory in the current panel and have its contents
    listed on the other panel; for example, when moving files from a parent directory
    into a subdirectory. To do this, select a directory and type `Alt-o`. To force
    the other panel to list the same directory as the current panel, type `Alt-i`.


    # The Directory Hotlist


    Midnight Commander can store a list of frequently visited directories. This “hotlist”
    can displayed by pressing `Ctrl-\`.'
  merge: -1
  pgno: 13
- img_proc: false
  md: '![](bbox=[0.177, 0.109, 0.818, 0.404])


    # Directory hotlist


    To add a directory to the hotlist while browsing, select a directory and type
    `Ctrl-x h`.


    # Directory History


    Each directory panel maintains a list of directories that it has displayed. To
    access this list, type `Alt-H`. From the list, a directory can be selected for
    browsing. Even without the history list display, we can traverse the history list
    forward and backward by using the `Alt-u` and `Alt-y` keys respectively.


    # Using the Mouse


    We can perform many Midnight Commander operations using the mouse. A directory
    panel item can be selected by clicking on it and a directory can be opened by
    double clicking. Likewise, the function key labels and menu bar items can be activated
    by clicking on them. What is not so apparent is that the directory history can
    be accessed and traversed. At the top of each directory panel there are small
    arrows (circled in the image below). Clicking on them will show the directory
    history (the up arrow) and move forward and backward through the history list
    (the right and left arrows).


    There is also an arrow to the extreme lower right edge of the command line which
    reveals the command line history.'
  merge: -1
  pgno: 14
- img_proc: false
  md: '![](bbox=[0.179, 0.109, 0.82, 0.402])


    *Directory and command line history mouse controls*


    # ## Viewing and Editing Files


    An activity often performed while directory browsing is examining the content
    of files. Midnight Commander provides a capable file viewer which can be accessed
    by selecting a file and pressing the `F3` key.


    ![](bbox=[0.179, 0.551, 0.82, 0.846])


    *File viewer*'
  merge: -1
  pgno: 15
- img_proc: false
  md: 'As we can see, when the file viewer is active, the function key labels at the
    bottom of the screen change to reveal viewer features. Files can be searched and
    the viewer can quickly go to any position in the file. Most importantly, files
    can be viewed in either ASCII (regular text) or hexadecimal, for those cases when
    we need a really detailed view.


    ![](bbox=[0.176, 0.203, 0.823, 0.547])


    File viewer in hexadecimal mode


    It is also possible to put the other panel into “quick view” mode to view the
    currently selected file. This is especially nice if we are browsing a directory
    full of text files and want to rapidly view the files, as each time a new file
    is selected in the current panel, it’s instantly displayed in the other. To start
    quick view mode, type `Ctrl-x q`.'
  merge: -1
  pgno: 16
- img_proc: false
  md: '![](bbox=[0.18, 0.1, 0.82, 0.4])


    # Quick view mode


    Once in quick view mode, we can press `Tab` and the focus changes to the other
    panel in quick view mode. This will change the function key labels to a subset
    of the full file viewer. To exit the quick view mode, press `Tab` to return to
    the directory panel and press `Alt-i`.


    # Editing


    Since we are already viewing files, we will probably want to start editing them
    too. Midnight Commander accommodates us with the `F4` key, which invokes a text
    editor loaded with the selected file. Midnight Commander can work with the editor
    of your choice. On Debian-based systems we are prompted to make a selection the
    first time we press `F4`. Debian suggests `nano` as the default selection, but
    various flavors of `vim` are also available along with Midnight Commander''s own
    built-in editor, `mcedit`. We can try out `mcedit` on its own at the command line
    for a taste of this editor.'
  merge: -1
  pgno: 17
- img_proc: false
  md: '![](bbox=[0.176, 0.108, 0.82, 0.405])


    mcedit


    # ## Tagging Files


    We have already seen how to select a file in the current directory panel by simply
    moving the highlight, but operating on a single file is not of much use. After
    all, we can perform those kinds of operations more easily by entering commands
    directly on the command line. However, we often want to operate on multiple files.
    This can be accomplished through *tagging*. When a file is tagged, it is marked
    for some later operation such as copying. This is why we choose to use a file
    manager like Midnight Commander. When one or more files are tagged, file operations
    (such as copying) are performed on the tagged files and selection has no effect.


    # ## Tagging Individual Files


    To tag an individual file or directory, select it and press the `Insert` key.
    To untag it, press the `Insert` key again.


    # ## Tagging Groups of Files


    To tag a group of files or directories according to a selection criteria, such
    as a wildcard pattern, press the + key. This will display a dialog where the pattern
    may be specified.'
  merge: -1
  pgno: 18
- img_proc: false
  md: '![](bbox=[0.178, 0.108, 0.818, 0.404])


    *File tagging dialog*


    This dialog stores a history of patterns. To traverse it, use Ctrl up and down
    arrows.


    It is also possible to un-tag a group of files. Pressing the `/` key will cause
    a pattern entry dialog to display.


    # *We Need a Playground*


    To explore the basic file manipulation features of Midnight Commander, we need
    a "playground" like we had in Chapter 4 of TLCL.


    # **Creating Directories**


    The first step in creating a playground is creating a directory called, aptly
    enough, `playground`. First, we will navigate to our home directory, then press
    the F7 key.'
  merge: -1
  pgno: 19
- img_proc: false
  md: '![](bbox=[0.177, 0.103, 0.823, 0.407])


    *Create Directory dialog*


    Type “playground” into the dialog and press `Enter`. Next, we want the other panel
    to display the contents of the playground directory. To do this, highlight the
    `playground` directory and press `Alt-o`.


    Now let’s put some files into our playground. Press `Tab` to switch the current
    panel to the playground directory panel. We’ll create a couple of subdirectories
    by repeating what we did to create `playground`. Create subdirectories `dir1`
    and `dir2`. Finally, using the command line, we will create a few files:


    ```

    me@linuxbox: ~/playground $ touch file1 file2 "ugly file"

    ```'
