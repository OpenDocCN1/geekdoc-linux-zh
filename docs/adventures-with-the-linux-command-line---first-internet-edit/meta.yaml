    exec 1> ~/foo1.txt

    echo "Boo."


    # End of script

    ```


    and tried to invoke it with redirection:


    ```

    me@linuxbox ~ $ ./exec-test > ~/foo2.txt

    ```


    the attempted redirection would have no effect. The word "Boo" would still be
    written to the file `foo1.txt`, not `foo2.txt` as specified on the command line.
    This is because the redirection performed inside the script via `exec` is performed
    after the redirection on the command line, and thus, takes precedence.


