    # Mapping


    Like many interactive command line programs, vim allows users to remap keys to
    customize vim’s behavior. It has a specific command for this, `map`, that allows
    a key to be assigned the function of another key or a sequence of keys. Further,
    vim allows us to say that a key is to be remapped only in a certain mode, for
    example only in normal mode but not in insert nor command modes.


    Before we go on, we should point out that use of the `map` command is discouraged.
    It can create nasty side effects in some situations. Vim provides another set
    of mapping commands that are safer to use.


    Earlier, we looked at the paragraph reformatting command sequence `gqip`, which
    means “format in paragraph.” To demonstrate a useful remapping, we will map the
    `Q` key to generate this sequence. We can do this by entering:


    ```

    :nnoremap Q gqip

    ```'
