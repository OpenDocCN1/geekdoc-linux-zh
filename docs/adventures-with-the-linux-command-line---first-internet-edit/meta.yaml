    \ the `new_script` help message, so use that as a guide for context. Keep responses\
    \ clear and concise.\n\n```\nOption 1:\n  Enter short option name [a-z] (Enter\
    \ to end) -> a\n  Description of option -----------------------------> the first\
    \ option named 'a'\n  Enter long option name (optional) ----------------> option_a\n\
    \  Enter option argument (if any) ------------------->\n\nOption 2:\n  Enter short\
    \ option name [a-z] (Enter to end) -> b\n  Description of option ----------------------------->\
    \ the second option named 'b'\n  Enter long option name (optional) ---------------->\
    \ option_b\n  Enter option argument (if any) -------------------> b_argument\n\
    \  Description of argument (if any)------------------> argument for option 'b'\n\
    \nOption 3:\n  Enter short option name [a-z] (Enter to end) ->\n```\n\nBy entering\
    \ nothing at the short option prompt, `new_script` ends the input of the command\
    \ options and writes the template. We're done!\n\nA note about short option names:\
    \ `new_script` will accept any value, not just lowercase letters. This includes\
    \ uppercase letters, numerals, etc. Use good judgment.\n\nA note about long option\
    \ names and option arguments: long option names and option arguments must be valid\
    \ bash variable names. If they are not, `new_script` will attempt correct them,\
    \ If there are embedded spaces, they will be replaced with underscores. Anything\
    \ else will cause `no_script` to replace the name with a calculated default value\
