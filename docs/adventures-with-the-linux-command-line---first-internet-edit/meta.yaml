    # Constants


    After the comment block, we define the constants used by the script. As we recall,
    constants are variables that have a fixed value. They are used to define values
    that are used in various locations in the script. Constants simplify script maintenance
    by eliminating hard coded values scattered throughout the code. By placing this
    section at the top, changes to the script can be made more easily.


    There are two constants that every script should include. First, a constant that
    contains the name of the program, for example:


    ```

    PROGNAME=${0##*/}

    ```


    This value is useful for such things as help and error messages. In the example
    above, the name of the program is calculated from the first word on the command
    line that invoked the script ($0) with any leading path name stripped off. By
    calculating it this way, if the name of the script file ever changes, the constant
    will automatically contain the new name.


    The second constant that should be included contains the script''s version number.
    Like the `PROGNAME` constant, this value is useful in help and error messages.


    ```

    VERSION="3.5"

    ```


    Constants should also be defined for numerical values such as maximum or minimum
    limits used in calculations, as well as for the names of files or directories
    used by, or acted upon, by the script.'
