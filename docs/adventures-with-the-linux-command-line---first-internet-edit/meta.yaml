  md: '+   - `--no-collapse` prevents `dialog` from reformatting message text. Use
    this when the exact presentation of the text is needed.

    - `--backtitle` sets the title of the background under the dialog box.

    - `--clear` clears the background of any previous dialog box.

    - `--cancel-label` sets the string displayed on the "cancel" button. In this script,
    it is set to "Exit" since that is a better description of the action taken when
    it is selected.


    # **Limitations**


    While it''s true that `dialog` can produce many kinds of dialog boxes, care must
    be taken to remember that `dialog` has significant limitations. Some of the dialog
    boxes have rather odd behaviors compared to their traditional GUI counterparts.
    For example, the edit box used to edit text files cannot perform cut and paste
    and files to be edited cannot contain tab characters. The behavior of the file
    box is more akin to the shell''s tab completion feature than to a GUI file selector.


    # **Summing Up**


    The shell is not really intended for large, interactive programs, but using `dialog`
    can make small to moderate interactive programs possible. It provides a useful
    variety of dialog boxes, allowing many types of user interactions which would
    be very difficult to implement with the shell alone. If we keep our expectations
    modest, `dialog` can be a great tool.


    # **Further Reading**


    +   - The `dialog` man page is well-written and contains a complete listing of
    its numerous options.

    - `dialog` normally includes a large set of example programs which can be found
    in the `/usr/share/doc/dialog` directory.

    - The `dialog` project home page can be found at [https://invisible-island.net/dialog/](https://invisible-island.net/dialog/)'
