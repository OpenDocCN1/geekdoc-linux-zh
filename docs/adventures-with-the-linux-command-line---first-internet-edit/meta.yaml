    string, it returns a formatted string containing the list of expressions to the
    caller. Use this function to assign a formatted string to a variable:


    ```

    area_code = "800"

    exchange = "555"

    number = "1212"

    phone_number = sprintf("(%s) %s-%s", area_code, exchange, number)

