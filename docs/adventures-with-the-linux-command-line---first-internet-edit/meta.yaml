    AWK supports an expression that''s useful for testing membership in an array:


    ```

    (var in array)

    ```


    where *var* is an index value and *array* is an array variable. Using this expression
    tests if the index *var* exists in the specified array. This method of testing
    for array membership avoids the problem of inadvertently creating the index by
    testing it with methods such as:


    ```

    if (array[var] != "")

    ```


    When the test is attempted this way, the array element `var` is created, since
    AWK creates variables simply by their use. When the `(var in array)` form is used,
    no variable is created.


    To test for array membership in a multi-dimensional array, the following syntax
    is used:


    ```

    ((var1,var2) in array)

    ```


    # ## *for ( expression ; expression ; expression ) statement*


    The *for* loop in AWK closely resembles the corresponding one in the C programming
    language. It is comprised of 3 expressions. The first expression is usually used
    to initialize a counter variable, the second defines when the loop is completed,
    and the third defines how the loop is incremented or advanced at each iteration.
    Here is a demonstration using a for loop to print fields in reverse order:


    ```

    ls -l | awk ''{s = ""; for (i = NF; i > 0; i--) s = s $i OFS; print s}''

    ```


    In this example we create an empty string named `s`, then begin a loop that starts
    with the number of fields in the current input line (`i = NF`) and counts down
    (`i--`) until we reach the first field (`i > 0`). Each iteration of the loop causes
    the current field and the output field separator to be concatenated to the string
    `s` (`s  = s $i OFS`). After the loop concludes, we print the resulting value
    of string `s`.


    # ## *for ( var in array ) statement*


    AWK has a special flow control statement for traversing the indexes of an array.
    Here is an example of what it does:


    ```

    awk ''BEGIN {for (i=0; i<10; i++) a[i]="foo"; for (i in a) print i}''

    ```


    In this program, we have a single BEGIN pattern/action that performs the entire
    exercise without the need for an input stream. We first create an array `a` and
    add 10 elements, each containing the string "foo". Next, we use `for (i in a)`
    to loop through all the indexes in the array and print each index. It is important
    to note that the order of the arrays in memory is *implementation dependent*,
    meaning that it could be anything, so we cannot rely on the results being in any
    particular order. We''ll look at how to address this problem a little later.'
