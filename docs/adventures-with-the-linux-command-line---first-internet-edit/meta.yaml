    If we return to the buffer containing our shell script, we should see the effects
    of our `sh.vim` file. When syntax highlighting is turned on (`:syn on` will do
    the trick) it assumes the current color scheme. Vim ships with a bunch of different
    ones. To see the name of the current scheme, type this command:'
