  md: '![](bbox=[0.145, 0.095, 0.855, 0.395])


    # Copy dialog


    To see Midnight Commander''s default behavior, just press `Enter` and `file1`
    is copied into directory `dir1` (i.e., the file is copied from the directory displayed
    in current panel to the directory displayed in the other panel).


    That was straightforward, but what if we want to copy `file2` to a file in `dir1`
    named `file3`? To do this, we select `file2` and press F5 again and enter the
    new filename into the Copy dialog:'
  merge: -1
  pgno: 22
- img_proc: false
  md: '![](bbox=[0.178, 0.107, 0.813, 0.403])


    # Renaming a file during copy


    Again, this is pretty straightforward. But let’s say we tagged a group of files
    and wanted to copy and rename them as they are copied (or moved). How would we
    do that? Midnight Commander provides a way of doing it, but it’s a little strange.


    The secret is the source mask in the copy dialog. At first glance, it appears
    that the source mask is simply a file selection wildcard, but first appearances
    can be deceiving. The mask does filter files as we would expect, but only in a
    limited way. Unlike the range of wildcards available in the shell, the wildcards
    in the source mask are limited to “?” (for matching single characters) and “*”
    (for matching multiple characters). What’s more, the wildcards have a special
    property.


