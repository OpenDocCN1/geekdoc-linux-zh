    URxvt.background: black

    URxvt.secondaryScroll: true

    URxvt.font: xft:liberation mono:size=11

    URxvt.cursorBlink: true

    ```


    # ## *Modern Power Terminals*


    Most modern graphical desktop environments include a terminal emulator program.
    Some are more feature-rich than others. Let''s look at some of the most powerful
    and popular ones.


    # ### gnome-terminal


    The default terminal application for GNOME and its derivatives is `gnome-terminal`.
    Possibly the world''s most popular terminal app, it''s a good, full-featured program.
    It has many features we expect in modern terminals, like multiple tabs and profile
    support. It also allows many kinds of customization.'
