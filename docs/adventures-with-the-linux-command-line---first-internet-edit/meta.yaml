  md: '# Text Formatting


    Let''s say we wanted to add a license header to the beginning of our script. This
    would consist of a comment block near the top of the file that includes the text
    of the copyright notice.


    We''ll move to line 3 of our script and add the text, but before we start, let''s
    tell vim how long we want the lines of text to be. First we''ll ask vim what the
    current setting is:


    ```

    :set tw?

    ```


    Vim should respond:


    ```

    textwidth=0

    ```


    "tw" is short for `textwidth`, the length of lines setting. A value of zero means
    that vim is not enforcing a limit on line length. Let''s set textwidth to another
    value:


    ```

    :set tw=75

    ```


    Vim will now wrap lines (at word boundaries) when the length of a line exceeds
    this value.


    # Formatting Paragraphs


    Normally, we wouldn''t want to set a text width while writing code (though keeping
    line length below 80 characters is a good practice), but for this task it will
    be useful.


    So let''s add our text. Type this in:


    ```

    # This program is free software: you can redistribute it and/or modify it

    # under the terms of the GNU General Public License as published by the

    # Free Software Foundation, either version 3 of the License, or (at your

    # option) any later version.


    # This program is distributed in the hope that it will be useful, but

    # WITHOUT ANY WARRANTY; without even the implied warranty of

    # MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the GNU General

    # Public License at <http://www.gnu.org/licenses/> for more details.

    ```


    Notice the magic of vim as we type. Each time the length of the line reaches the
    text width, vim automatically starts a new line including, the comment symbol.
    While the filetype is set for shell scripting, vim understands certain things
    about shell syntax and tries to help. Very handy.


    Now let''s say we were not happy with the length of these lines, or that we have
    edited the text in such a way that some of the lines are either too long or too
    short to maintain our well-formatted text. Wouldn''t be great is we could reformat
    our comment block? Well, we can. Very easily, in fact.


    To demonstrate, let''s change the text width to 65 characters:


    ```

    :set tw=65

    ```'
