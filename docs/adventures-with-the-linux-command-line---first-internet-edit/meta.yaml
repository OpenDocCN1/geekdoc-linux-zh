  md: "Indentation is accomplished in one of two ways; either by inserting tab characters\
    \ or by inserting a sequence of spaces. To understand the difference, we have\
    \ to go way back in time to typewriters and teletype machines.\n\nIn the beginning,\
    \ there were typewriters. On a typewriter, in order to make indenting the first\
    \ line of a paragraph easier, someone invented a mechanical device that would\
    \ move the carriage over a set amount of space. Over time, these devices became\
    \ more sophisticated and allowed multiple tab stops to be set. When teletype machines\
    \ came about, they implemented tabs with a specific ASCII character called HT\
    \ (horizontal tab, code 9) which, by default, was rendered by moving the cursor\
    \ to the next character position evenly divisible by 8.\n\nIn the early days of\
    \ computing, when memory was precious, it made sense to conserve space in text\
    \ files by using tab characters to avoid having to pad the text file with spaces.\n\
    \nUsing tab characters creates a problem, though. Since a tab character has no\
    \ intrinsic width (it only signifies the desire to move to the next tab stop),\
    \ it's up to the receiving program to render the tab with some defined width.\
    \ This means that a file containing tabs could be rendered in different ways in\
    \ different programs and in different contexts.\n\nSince memory is no longer expensive,\
    \ and using tabs creates this rendering confusion, modern practice calls for spaces\
    \ instead of tabs to perform indentation (though this remains somewhat controversial).\
    \ Vim provides a number of options for setting tabs and indentation. An excerpt\
    \ from the help file for the `tabstop` option explains the ways vim can treat\
    \ tabs:\n\n```\nThere are four main ways to use tabs in Vim:\n\n1. Always keep\
    \ 'tabstop' at 8, set 'softtabstop' and\n   'shiftwidth' to 4 (or 3 or whatever\
    \ you prefer) and use\n   'noexpandtab'.  Then Vim will use a mix of tabs and\n\
    \   spaces, but typing <Tab> and <BS> will behave like a tab\n   appears every\
    \ 4 (or 3) characters.\n\n2. Set 'tabstop' and 'shiftwidth' to whatever you prefer\n\
    \   and use 'expandtab'.  This way you will always insert\n   spaces.  The formatting\
    \ will never be messed up when\n   'tabstop' is changed.\n\n3. Set 'tabstop' and\
    \ 'shiftwidth' to whatever you prefer and\n   use a |modeline| to set these values\
    \ when editing the\n   file again.  Only works when using Vim to edit the file.\n\
    \n4. Always set 'tabstop' and 'shiftwidth' to the same value,\n   and 'noexpandtab'.\
    \  This should then work (for initial\n   indents only) for any tabstop setting\
    \ that people use.\n   It might be nice to have tabs after the first non-blank\n\
    \   inserted as spaces if you do this though.  Otherwise,\n   aligned comments\
    \ will be wrong when 'tabstop' is\n   changed.\n```"
