  md: "operation that could leave the system in an undesirable state, provide a way\
    \ to return the system to useful condition before the script exits.\n\nBash offers\
    \ a setting that will to attempt handle errors automatically, which simply means\
    \ that with this setting enabled, a script will terminate if any command (with\
    \ some necessary exceptions) returns a non-zero exit status. To invoke this setting,\
    \ we place the command `set -e` near the beginning of the script. Several bash\
    \ coding standards insist on using this feature along with a couple of related\
    \ settings, `set -u` which terminates a script if there is an uninitialized variable,\
    \ and `set -o PIPEFAIL` which causes script termination if any element in a pipeline\
    \ fails.\n\nUsing these features is not recommended. It is better to design proper\
    \ error handling and not rely on `set -e` as a substitute for good coding practices.\n\
    \nThe *Bash FAQ #105* provides the following opinion on this:\n\n> `set -e` was\
    \ an attempt to add “automatic error detection” to the shell. Its goal was to\
    \ cause the shell to abort any time an error occurred, so you don’t have to put\
    \ `|| exit 1` after each important command.\n\nThat goal is non-trivial, because\
    \ many commands intentionally return non-zero. For example,\n\n```\nif [ -d /foo\
    \ ]; then ...; else ...; fi\n```\n\nClearly we don’t want to abort when the `[\
    \ -d /foo ]` command returns non-zero (because the directory does not exist) –\
    \ our script wants to handle that in the else part. So the implementors decided\
    \ to make a bunch of special rules, like “commands that are part of an if test\
    \ are immune”, or “commands in a pipeline, other than the last one, are immune.”\n\
    \nThese rules are extremely convoluted, and they still fail to catch even some\
    \ remarkably simple cases. Even worse, the rules change from one Bash version\
    \ to another, as bash attempts to track the extremely slippery POSIX definition\
    \ of this “feature.” When a subshell is involved, it gets worse still – the behavior\
    \ changes depending on whether bash is invoked in POSIX mode.\n\n# **Command Line\
    \ Options and Arguments**\n\nWhen possible, scripts should support both short\
    \ and long option names. For example, a “help” feature should be supported by\
    \ both the `-h` and `--help` options. Dual options can be implemented with code\
    \ such as this:\n\n```\n# Parse command line\nwhile [[ -n \"$1\" ]]; do\n  case\
    \ $1 in\n    -h | --help)\n```"
