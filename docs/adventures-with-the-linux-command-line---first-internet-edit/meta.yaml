  md: 'This configuration will automatically wrap lines at word boundaries once the
    line length exceeds 75 characters, and will set tabs to 4 spaces wide. Remember
    that when `textwidth` is non-zero, vim will automatically constrain line length,
    and we can use the `gqip` command to reformat paragraphs to the specified width.


    # Spell Checking


    When we write text, it''s handy to perform spell checking while we type. Fortunately,
    vim can do this, too. If we add the following lines to our `text.vim` file, vim
    will help fix those pesky spelling mistakes:


    ```

    setlocal spelllang=en_us

    setlocal dictionary=/usr/share/dict/words

    setlocal spell

    ```


    The first line defines the language for spell checking, in this case US English.
    Next, we specify the dictionary file to use. Most Linux distributions include
    this list of words, but other dictionary files can be used. The final line turns
    on the spell checker. When active, the spell checker highlights misspelled words
    (that is, any word not found in the dictionary) as we type.


    ![](bbox=[0.18, 0.43, 0.82, 0.75])


    Correcting misspelled words is pretty easy. Vim provides the following commands:


    ```

    ]s         Next misspelled word

    [s         Previous misspelled word

    z=         Display suggested corrections

    zg         Add word to personal dictionary

    ```


    To correct a misspelling, we place the cursor on the highlighted word and type:'
