    # ## Terminals for Other Platforms


    # ### Android


    While we might not think of an Android phone or tablet as a Linux computer, it
    actually is, and we can get terminal apps for it which are useful for administering
    remote systems.


    # ### Connectbot


    Connectbot is a secure shell client for Android. With it, we can log into any
    system running an SSH server. To the remote system, Connectbot looks like a terminal
    using the GNU Screen terminal type.


    One problem with using a terminal emulator on Android is the limitations of the
    native Google keyboard. It does not have all the keys required to make full use
    of a terminal session. Fortunately, there are alternate keyboards that we can
    use on Android. A really good one is Hacker''s Keyboard by Klaus Weidner. It supports
    all the normal keys, `Ctrl`, `Alt`, `F1-F10`, arrows, `PgUp`, `PgDn`, etc. Very
    handy when working with `vi` on a phone.'
