  md: '# # 11 source


    Most programming languages permit programmers to specify external files to be
    included within their programs. This is often used to add "boilerplate" code to
    programs for such things as defining standard constants and referencing external
    library function definitions.


    Bash (along with `ksh` and `zsh`) has a builtin command, `source`, that implements
    this feature. We looked at `source` briefly when we worked with the `.profile`
    and `.bashrc` files used to establish the shell environment.


    In this adventure, we will look at `source` again and discover the ways it can
    make our scripts more powerful and easier to maintain.


    To recap, `source` reads a specified file and executes the commands within it
    using the current shell. It works both with the interactive command line and within
    a script. Using the command line for example, we can reload the `.bashrc` file
    by executing the following command:


    ```

    me@linuxbox: ~$ source ~/.bashrc

    ```


    Note that the `source` command can be abbreviated by a single dot character like
    so:


    ```

    me@linuxbox: ~$ . ~/.bashrc

    ```


    When `source` is used on the command line, the commands in the file are treated
    as if they are being typed directly at the keyboard. In a shell script, the commands
    are treated as though they are part of the script.


    # ## Configuration Files


    During our exploration of the Linux ecosystem, we have seen that many programs
    rely on configuration files. Most of these are simple text files just like our
    bash shell scripts. By using `source`, we can easily create configuration files
    for our shell scripts as well.


    Consider this example. Let''s imagine that we have several computers on our network
    that need to get backed up on a regular basis and that a central backup server
    is used to store the files from these various systems. On each of the backup client
    systems we have a script called `back_me_up` that copies the files over the network.
    Let''s further imagine that each client system needs to back up a different set
    directories.


    To implement this, we might define a constant in the `back_me_up` script like
    this:


    ```

    BACKUP_DIRS="/etc /usr/local /home"

    ```


    However, doing it this way will require that we maintain a separate version of
    the script for each client. This will make maintaining the script much more laborious,
    as any future improvement to the script will have to be applied to each copy of
    the script individually.'
