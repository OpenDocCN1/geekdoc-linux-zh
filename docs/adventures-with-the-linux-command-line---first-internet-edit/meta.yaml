  md: '# Suffix Aliases


    What''s more


    ```

    me@linuxbox ~ $ alias -s txt=''less''

    ```


    Then we can just type the name of a text file, and it will be opened by the application
    specified by the alias:


    ```

    me@linuxbox ~ $ dir-list.txt

    ```


    How cool is that?


    # Improved History Search


    `zsh` adds a neat trick to history searching. In `bash` (and `zsh` too) we can
    perform a reverse incremental history search by typing `Ctrl-r`, and each subsequent
    keystroke will refine the search. `zsh` goes one better by allowing us to simply
    type a few letters of the desired search string on the command line and then press
    up-arrow. It moves back through the history to find the first match, and each
    time we press the up-arrow, the next match is displayed.


    # Environment Variable Editing


    `zsh` provides a shell builtin called `vared` for editing shell variables. For
    example, if we wanted to make a quick change to our `PATH` variable we can do
    this:


    ```

    me@linuxbox ~ $ vared PATH

    ```


    and the contents of the `PATH` variable appear in the command editor, so we can
    make a change and press Enter and the change takes effect.


    # Frameworks


    We have only touched on a few of the features available in `zsh`. It has a lot.
    But with a large feature set comes complexity, and configuring `zsh` to take advantage
    of its full potential can be daunting. Heck, its man page is a only a table of
    contents to the other 10+ man pages that cover various topics. Fortunately, communities
    have sprung up to provide *frameworks* that supply ready-to-use configurations
    and add-ons for `zsh`. By far, the most popular of these is Oh-My-Zsh, a project
    led by Robby Russell.


    Oh-My-Zsh is a large collection of configuration files, plugins, aliases, and
    themes. It offers support for tailoring `zsh` for many types of common tasks,
    particularly software development and system administration.'
