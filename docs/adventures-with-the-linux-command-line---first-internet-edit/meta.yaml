  md: '# General Purpose Libraries


    Since we hope to become prolific script writers, it makes sense over time, to
    build a library of common code that our future scripts could potentially use.
    When undertaking such a project, it''s wise to write high quality functions for
    the library, as the code may get heavy use. It''s important to test carefully,
    include a lot of error handling, and fully document the functions. After all,
    the goal here is to save time writing good scripts, so invest the time up front
    to save time later.


    # Let''s Not Forget .bashrc


    `source` can be a powerful tool for coordinating the configuration of small sets
    of machines. For large sets, there are more powerful tools, but `source` works
    fine if the job is not too big.


    We''ve worked with the `.bashrc` file before and added things like aliases and
    a few shell functions. However, when we work with multiple systems (for example,
    a small network), it might be a good idea to create a common configuration file
    to align all of the systems. To demonstrate, let''s create a file called `.mynetworkrc.sh`
    and place all of the common aliases and shell function we would expect on every
    machine. To use this file, we would add this one line of code to `.bashrc`:


    ```

    [[ -r ~/.mynetworkrc.sh ]] && source ~/.mynetworkrc.sh

    ```


    The advantage of doing it this way is that we won''t have to cut and paste large
    sections of code every time we configure a new machine or perform an operating
    system upgrade. We just copy the `.mynetwrokrc.sh` file to the new machine and
    add one line to `.bashrc`.


    We can even go further and create a host-specific configuration file that the
    `.mynetworkrc.sh` file will source. This would be handy if we need to override
    something in `.mynetworkrc.sh` on a particular host. We can do this by creating
    a configuration file with a file name based on the system''s host name. For example,
    if our system''s host name is `linuxbox1` we could create a configuration file
    named `.linuxbox1rc.sh` and add this line of code to the `.mynetworkrc.sh` file:


    ```

    [[ -r ~/.$(hostname)rc.sh ]] && source ~/.$(hostname)rc.sh

    ```


    By using the `hostname` command we are able to build a file name that is specific
    to a particular host.


    So, what could we put in our `.mynetworkrc.sh` file? Here are some ideas:


    ```

    ### Aliases ###


    # Reload the .mynetworkrc.sh file. Handy after editing.

    alias reload=''source ~/.mynetworkrc.sh''


    # Get a root shell

    ```'
