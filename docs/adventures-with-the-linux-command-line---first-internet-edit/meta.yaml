    # Power Features


    Beyond basic file manipulation, Midnight Commander offers a number of additional
    features, some of which are very interesting.


    # Virtual File Systems


    Midnight Commander can treat some types of archive files and remote hosts as though
    they are local file systems. Using the `cd` command at the shell prompt, we can
    access these.


    For example, we can look at the contents of tar files. To try this out, let''s
    create a compressed tar file containing the files in the `/etc` directory. We
    can do this by entering this command at the shell prompt:


    ```

    me@linuxbox ~ $ tar czf etc.tgz /etc

    ```


    Once this command completes (there will be some "permission denied" errors but
    these don''t matter for our purposes), the file `etc.tgz` will appear among the
    files in the current panel. If we select this file and press `Enter`, the contents
    of the archive will be displayed in the current panel. Notice that the shell prompt
    does not change as it does with ordinary directories. This is because while the
    current panel is displaying a list of files like before, Midnight Commander cannot
    treat the virtual file system in the same way as a real one. For example, we cannot
    delete files from the tar archive, but we can copy files from the archive to the
    real file system.'
