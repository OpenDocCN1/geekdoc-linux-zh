- img_proc: false
  md: '![](bbox=[0.173, 0.106, 0.817, 0.412])


    # Multiple panes


    We can terminate the clock display by typing `q`. If we move to the first window
    by typing `Ctrl-b 0`, we see that the panes remain associated with Window1 and
    have no effect on Window0.


    Returning to Window1, let’s adjust the size of the panes. We do this by typing
    `Ctrl-b Alt-arrow` to move the boundary up or down by 5 lines. Typing `Ctrl-b
    Ctrl-arrow` will move the boundary by 1 line.


    It’s possible to break a pane out into a new window of its own. This is done by
    typing `Ctrl-b !`.


    `Ctrl-b x` is used to destroy a pane. Note that, unlike screen, destroying a pane
    in tmux also destroys the pseudo-terminal running within it, along with any associated
    programs.


    # Copy Mode


    Like screen, tmux has a copy mode. It is invoked by typing `Ctrl-b [`. In copy
    mode, we can move the cursor freely within the scrollback buffer. To mark text
    for copying, we first type `Ctrl-space` to begin selection, then move the cursor
    to make our selection. Finally, we type `Alt-w` to copy the selected text.


    Admittedly, this procedure is a little awkward. A little later we’ll customize
    tmux to make the copy mode act more like the vim’s visual copying mode.'
