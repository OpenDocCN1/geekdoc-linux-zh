  md: "```\nmax_word=$j\nfi\ndone\necho \"$i: '$max_word' ($max_len characters)\"\n\
    fi\ndone\n```\n\n# dash - Debian Almquist Shell\n\nThe Debian Almquist shell is\
    \ Debian’s adaptation of the *Almquist shell* (ash) originally written in the\
    \ 1980s by Kenneth Almquist. The ash shell is the default shell on several of\
    \ the BSD flavors of Unix. `dash`, like its ancestor `ash`, has the advantage\
    \ of being small and fast; however, it achieves this by forgoing conveniences\
    \ intended for interactive use such as command history and editing. It also lacks\
    \ some builtin commands, relying instead on external programs. Its main use is\
    \ the execution of shell scripts, particularly during system startup. On Debian\
    \ and related distributions such as Ubuntu, `dash` is linked to `/bin/sh`, the\
    \ shell used to run the system initialization scripts.\n\n`dash` is a POSIX compliant\
    \ shell, so it supports Bourne shell syntax with a few additional Korn shell features:\n\
    \n```\n#!/bin/dash\n\n# longest-word.dash : find longest string in a file\n\n\
    for i; do\n    if [ -r \"$i\" ]; then\n        max_word=\n        max_len=0\n\
    \        for j in ${strings \"$i\"}; do\n            len=${#j}\n            if\
    \ [ $len -gt $max_len ]; then\n                max_len=$len\n                max_word=$j\n\
    \            fi\n        done\n        echo \"$i: '$max_word' ($max_len characters)\"\
    \n    fi\ndone\n```\n\nHere we see that the dash script is mostly the same as\
    \ the `bash` reference script, but we do see some differences. For one thing,\
    \ `dash` does not support the `[[` syntax for conditional tests; it uses the older\
    \ Bourne shell syntax. The POSIX specification is also missing the `((expression))`\
    \ syntax for arithmetic expansion, nor does it support brace expansion. `dash`\
    \ and the POSIX specification do support the `$(cmd)` syntax for command substitution\
    \ in addition to the older `` `cmd` `` syntax.\n\n# tcsh - TENEX C Shell\n\nThe\
    \ `tcsh` program was developed in the early 1980s by Ken Greer as an enhanced\
    \ replacement for the original `csh` program. The name TENEX comes from the operating\
    \ system of the same name, which was influential in the design of the interactive\
    \ features in"
