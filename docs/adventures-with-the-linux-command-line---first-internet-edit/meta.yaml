    linux-firmware         1938 331497257        6 19922416 171051.2\n```\n\nTo delete\
    \ our indexes, we use the `DROP INDEX` statement.\n\n```\nsqlite> DROP INDEX idx_package_name;\n\
    sqlite> DROP INDEX idx_tot_size;\n```\n\n# **Triggers and Stored Procedures**\n\
    \nAs we saw earlier during our discussion of views, SQL allow us to store SQL\
    \ code in the database. Besides views, SQL provides for two other ways of storing\
    \ code. These two methods are *stored procedures* and *triggers*. Stored procedures,\
    \ as the name implies, allows a block of SQL statements to be stored and treated\
    \ as a subroutine available to other SQL programs, or for use during ad hoc interactions\
    \ with the database. Creating a stored procedure is done with this syntax:\n\n\
    240 SQL"
