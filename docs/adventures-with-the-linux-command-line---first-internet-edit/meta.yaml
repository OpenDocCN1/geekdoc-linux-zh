  md: '# # File System Management and Navigation


    We know that we can load files into vim by specifying them on the command line
    when we initially invoke vim, and that we can load files from within vim with
    the `:edit` and `:read` commands. But vim also provides more advanced ways of
    working with the file system.


    # ## netrw


    When we load the filetype plugin (as we have set up our `.vimrc` file to do),
    vim also loads another plugin called *netrw*. This plugin can, as its name suggests,
    read and write files from the local file system and from remote systems over the
    network. In this adventure, we’re going concern ourselves with using netrw as
    a local file browser.


    To start the browser in the current window, we use the `:Ex` (short for `:Explore`)
    command. To start the browser in a split window, we use the amusingly named `:Sex`
    (short for `:Sexplore`) command. The browser looks like this:


    ![](bbox=[0.18, 0.41, 0.81, 0.725])


    *File browser*


    At the top, we have the banner which provides some clues to the browser’s operation,
    followed by a vertical list of directories and files. We can toggle the banner
    on and off with `Shift-i` and cycle through available listing views by pressing
    the `i` key. The sort order (name, time, size) may be changed with `s` key.'
  merge: -1
