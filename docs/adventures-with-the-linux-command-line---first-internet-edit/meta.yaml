  md: 'will only display the files whose names end in `.txt` and are symbolic links.


    There are many supported qualifiers and they may be combined to perform very fine

    grained file selection. Here are some examples:


    | Qualifier | Description | Example |

    |-----------|-------------|---------|

    | `.` | Regular files | `ls *(.)` |

    | `/` | Directories | `ls *(/)` |

    | `@` | Symbolic links | `ls *(@)` |

    | `*` | Executable files | `ls *(*)` |

    | `F` | Non-empty ("full") directories | `ls *(F)` |

    | `/^F` | Empty directories | `ls *(/^F)` |

    | `mn` | Modified exactly *n* days ago | `ls *(m5)` |

    | `m-n` | Modified less than *n* days ago | `ls *(m-5)` |

    | `m+n` | Modified more than *n* days ago | `ls *(m+5)` |

    | `L0` | Empty (zero length) file | `ls *(L0)` |

    | `LM+n` | File larger than *n* megabytes | `ls *(LM+5)` |

    | `LK-n` | File smaller than *n* kilobytes | `ls *(LK-100)` |


    *Z shell pathname expansions*


    # Global Aliases


    Z shell provides more powerful aliases. With `zsh` we can define an alias in the
    usual way,

    such as:


    ```

    me@linuxbox ~ $ alias vi=''/usr/bin/vim''

    ```


    and it will behave just as it would in `bash`. But we can also define a *global
    alias* that can

    be used at any position on the command line, not just at the beginning. For example,
    we

    can define a commonly used file name as an alias:


    ```

    me@linuxbox ~ $ alias -g LOG=''/var/log/syslog''

    ```


    and then use it anywhere on a command line:


    ```

    me@linuxbox ~ $ less LOG

    ```


    The use of an uppercase alias name is not a requirement, it''s just a custom to
    make its use

    easier to see. We can also use global aliases to define common redirections:


    ```

    me@linuxbox ~ $ alias -g L=''| less"

    ```


    or


    ```

    me@linuxbox ~ $ alias -g W=''| wc -l''

    ```


    Then we can do things like this:


    ```

    me@linuxbox ~ $ cat LOG W

    ```


    to display the number of lines in `/var/log/syslog`.'
