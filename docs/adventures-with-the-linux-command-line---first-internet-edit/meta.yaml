    directory. If it exists, the package is installed.


    The bash-completion package adds support for many command line programs, allowing
    us to perform completion on both command options and arguments. The `ls` command
    is a good example. If we type "ls –" then the `Tab` key a couple of times, we
    will see a list of possible options to the command:


