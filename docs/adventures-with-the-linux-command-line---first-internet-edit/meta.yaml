  md: "# # Invocation\n\nThere are three ways we can run an AWK program. We have already\
    \ seen how to embed a program in a shell script by enclosing it inside single\
    \ quotes. The second way is to place the awk script in its own file and call it\
    \ from the `awk` program like so:\n\n```\nawk -f program_file\n```\n\nLastly,\
    \ we can use the `shebang` mechanism to make the AWK script a standalone program\
    \ like a shell script:\n\n```\n#!/usr/bin/awk -f\n\n# Print a directory report\n\
    \nBEGIN {\n    print \"Directory Report\"\n    print \"==================\"\n\
    }\n\nNF > 9 {\n    print $9, \"is a symbolic link to\", $NF\n}\n\nEND {\n    print\
    \ \"==================\"\n    print \"End Of Report\"\n}\n```\n\n# # The Language\n\
    \nLet's take a look at the features and syntax of AWK programs.\n\n# ## Program\
    \ Format\n\nThe formatting rules for AWK programs are pretty simple. Actions consist\
    \ of one or more statements surrounded by braces ({}) with the starting brace\
    \ appearing on the same line as the pattern. Blank lines are ignored. Comments\
    \ begin with a pound sign (#) and may appear at the end of any line. Long statements\
    \ may be broken into multiple lines using line continuation characters (a backslash\
    \ followed immediately by a newline). Lists of parameters separated by commas\
    \ may be broken after any comma. Here is an example:\n\n```\nBEGIN { # The action's\
    \ opening brace must be on same line as the pattern\n\n  # Blank lines are ignored\n\
    \n  # Line continuation characters can be used to break long lines\n  print \\\
    \n    $1, # Parameter lists may be broken by commas\n    $2, # Comments can appear\
    \ at the end of any line\n    $3\n\n  # Multiple statements can appear on one\
    \ line if separated by\n  # a semicolon\n  print \"String 1\"; print \"String\
    \ 2\"\n```\n\n94 AWK"
