  md: '# 10 Vim, with Vigor


    TLCL Chapter 12 taught us the basic skills necessary to use the vim text editor.
    However, we barely scratched the surface of its capabilities. Vim is a very powerful
    program. In fact, it''s safe to say that vim can do anything. It''s just a question
    of figuring out how. In this adventure, we will acquire an intermediate level
    of skill in this popular tool. In particular, we will look at ways to improve
    our productivity writing shell programs, configuration files, and documentation.
    Even better, after we get the hang of some of these additional features, using
    vim is actually fun.


    In this adventure, we will look at some of the features that make vim so popular
    among developers and administrators. The community supporting vim is large and
    vigorous. Because vim is extremely rich in features and scriptable, there are
    many plugins and add-ons available. However, we are going to restrict ourselves
    to stock vim and the plugins that normally ship with it.


    A note about nomenclature: in TLCL we used the terms “command”, “insert”, and
    “ex” to identify the three primary modes of vim. We did this to match the traditional
    modes of vim''s ancestor, vi. Since this is an all-vim adventure, we will switch
    to the names used in the vim documentation which are *normal*, *insert*, and *command*.


    # Let''s Get Started


    First, we need to be sure we are running the full version of vim. Many distributions
    only ship with an abbreviated version. To get the full version, install the “vim”
    package if it''s not already installed. This is also be a good time to add an
    alias to the .bashrc file to make “vi” run vim (some distributions symbolically
    link ‘vi’ to vim, so this step might not be needed).


    ```

    alias vi=''vim''

    ```


    Next, let''s create a minimal .vimrc, its main configuration file.


    ```

    [me@linuxbox ~]$ vi ~/.vimrc

    ```


    Edit the file so it contains these two lines:


    ```

    set nocompatible

    filetype plugin on

    ```


    This will ensure that vim is not restricted to the vi feature set, and load a
    standard plugin that lets vim recognize different file types. After inserting
    the two lines of text, return to normal mode and (just for fun) type lowercase
    ‘m’ followed by uppercase ‘V’.


    ```

    mV

    ```


    Nothing will appear to happen, and that''s OK. We''ll come back to that later.
    Save the file and exit vim.


    ```

    :wq

    ```'
  merge: -1
