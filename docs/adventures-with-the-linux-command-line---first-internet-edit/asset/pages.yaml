    fields[1] = "800"

    fields[2] = "555"

    fields[3] = "1212"

    ```


    # printf(fmt, exprs)


    This function behaves like printf, except instead of outputting a formatted string,
    it returns a formatted string containing the list of expressions to the caller.
    Use this function to assign a formatted string to a variable:


    ```

    area_code = "800"

    change = "555"

    number = "1212"

    phone_number = printf("(%s) %s-%s", area_code, exchange, number)

    ```


    # sub(s, t, l)


    Behaves like gsub, except only the leftmost caution replacement is made. Like
