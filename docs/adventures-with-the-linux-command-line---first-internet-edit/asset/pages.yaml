  md: "tcsh. Compared to csh, tcsh added additional command history features, Emacs\
    \ and vi-style command editing editing, spelling correction, other improvements\
    \ intended for interactive use. Early versions of Apple's OS used tcsh as the\
    \ default shell. It is still the default root shell on several BSD distributions.\n\
    \ntcsh, like the C shell, is not POSIX compliant as we can see here:\n\n```\n\
    #!/usr/bin/tcsh\n\n# longest-word.tcsh : find longest string in a file\n\nforeach\
    \ i ($argv)\n    set max_word=\"\"\n    set max_len=0\n    foreach j ($strings\
    \ $i)\n        set len=$j\n        if [$len > $max_len] then\n            set\
    \ max_word=$j\n            set max_len=$len\n        fi\n    end\necho \"$1 $max_word\
    \ ($max_len characters)\"\"\n```\n\nOur tcsh version of the script demonstrates\
    \ many differences from Bourne syntax. In C shell, most of the flow control statements\
    \ are different. We see for example, that the outer loop starts with a foreach\
    \ statement incrementing the variable $i with succeeding values from the list\
    \ $argv.argv, taken from the C programming language, refers to an array containing\
    \ the list of command arguments.\n\nWhile this script works, tcsh is not very\
    \ capable when things get complicated. It has two major weaknesses. First, it\
    \ does not support user-defined functions. As a workaround, separate scripts can\
    \ be called from the main script to carry out the individual functions. Second,\
    \ many complex constructs is easily accomplished with the POSIX shell, such as:\n\
    \n```\n{ if [ \"Sa\" ]; then\ngrep \"string1\"\nelse\ngrep \"string2\"\nfi\n}<\
    \ file.txt\n```\n\nare not possible because the C shell parser cannot handle redirection\
    \ with flow control statements. The parser also allows making quoting very troublesome.\n\
    \n# ksh - Korn Shell\n\nThe Korn shell comes in several different flavors. Basically,\
    \ there are two groups, ksh88 and ksh93, reflecting the year of their release.\
    \ There is a public domain version of ksh88 pdksh, and more official versions\
    \ of both ksh88 and ksh93. All three are available for Linux. ksh93 would be the\
    \ preferred version for most users, as it is the version found\n\n144 Other Shells"
  merge: -1
  img_proc: true
- pgno: 156
  md: "on most modern commercial Unix systems. During installation it is often symlinked\
    \ to\nksh.\n\n```\n#!/usr/bin/ksh\n\n# longest-word.ksh : find longest string\
    \ in a file\n\nfor i; do\n  if [[ -r \"$i\" ]]; then\n    max_word=\n    max_len=0\n\
    \    for j in ${strings[@]}; do\n      if (( ${#j} > $max_len )); then\n     \
    \   max_len=${#j}\n        max_word=$j\n      fi\n    done\n    print \"$i: $max_word'\
    \ ($max_len characters)\"\n  fi\ndone\n```\n\nAs we can see in this example, ksh\
    \ syntax is very close to bash. The one visible\ndifference is the print command\
    \ used in place of echo. Korn shell has echo echo, too,\nprint is the preferred\
    \ Korn shell for outputting text. Another subtle difference\nis the pipelines\
    \ work in ksh. As we learned in Chapter 28 of TLCL, a construct\nsuch as:\n\n\
    ```\n#!/bin/bash\nstr=\"foo\"\necho \"foo\" | read str\necho $str\n```\n\nalways\
    \ produces an empty result, in bash pipelines, each command in a pipeline\nis\
    \ executed in a subshell, so its data is destroyed when the subshell exits. In\
    \ this example,\nt final command (read) is in a subshell, and thus remains empty\
    \ in the parent\nprocess.\n\nIn ksh, the internal organization of pipelines is\
    \ different. When we do this in ksh:\n\n```\n#!/usr/bin/ksh\nstr=\"\"\necho \"\
    foo\" | read str\necho $str\n```\n\nThe output is “foo” because the ksh pipeline,\
    \ the echo is in the subshell rather than the\nread.\n\n# zsh - Z Shell\n\nAt\
    \ first glance, the Z shell does not differ very much from bash when it comes\
    \ to\nscripting.\n\n```\n#!/bin/zsh\n\n# longest-word.zsh : find longest string\
    \ in a file\n```"
