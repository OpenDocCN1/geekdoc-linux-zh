    # Renaming a file during copy


    Again, this is pretty straightforward. But let''s say we tagged a group of files
    and wanted to copy and rename them as they are copied (or move). How would we
    do that? Midnight Commander provides a way of doing it, but it''s a little strange.


    The secret is using source mask in the copy. At first, it appears that the source
    mask is a selection wildcard, but first appearances can be deceiving. The mask
    filters files as we expect, but only in a limited way. Unlike the range of wildcards
    available in the shell, the wildcards in the source mask are limited to "?" (for
    matching single characters) and "*" (for matching multiple characters). What''s
    more, wildcards have a special property.


    It works like this: let''s say we want to copy (or move) it to dir with an embedded
    space such as "ugly file" and want to use "* instead. Using the source mask, we
    could enter the mask "* which means the source file name into two blocks of text
    separated by a space. This wildcard pattern will match the ugly file, since its
    name consists of two strings of characters separated by a space. Midnight Commander
    will associate each block of text with a number starting at 1, so block 1 will
    contain "ugly" and block 2 contain "file". Each block can be referred to by a
    number with regular expression grouping. To create a new file name for our target
    without the embedded space, we would specify "1\2" in the "to" field of the copy
    dialog like so:


    14 Midnight Commander'
  merge: -1
  img_proc: true
- pgno: 24
  md: '![](img/9aafc495f4afbc0a97de2b31a0d13f46_24_0.png)


    Using grouping


    +   * wildcard behaves the same way. If we make the source mask "???? ????" (which
    matches the file ugly file), we have eight pieces of text that can rearrange at
    file. For example, we could make the "to" mask "\7\6\5\4\3\2\1", and the resulting
    file name would be "elifylgu". Pretty.


    Midnight Commander can also perform case conversion on file names. In this case,
    we include some additional escape sequences in the to:


    +   * \u Converts the next character to uppercase.

    * \U Converts all characters to uppercase until another sequence is encountered.

    * \l Converts the next character to lowercase.

    * \L Converts all characters to lowercase until another sequence is encountered.


    So if we wanted to change the name ugly file to camel case, we could use the mask
    "\u\L\u\L\2" and would get the name UglyFile.


