    :${DIALOG_ITEM_HELP=4}\n:${DIALOG_ESC=255}\n\n# Duplicate (make a backup copy)\
    \ of file descriptor\n# on descriptor 3\nexec 3>&1\n\n# Generate the dialog box\
    \ while running dialog in a subshell\nresult=$(dialog \\\n  --title \"INPUT BOX\
    \ \\\n  --clear \\\n  --inputbox \\\\)\n```"
