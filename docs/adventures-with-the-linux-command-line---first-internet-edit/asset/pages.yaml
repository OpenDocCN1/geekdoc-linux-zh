- pgno: 69
  md: '```

    exec 3> /dev/tty # open fd 3 and point to controlling terminal

    ```


    ```

    count=0

    while read; # read line from stdin

    echo "SREPLY" # send line to stdout

    ((count++))

    printf "\b\b\b\b\b%06d" $count >&3

    done

    echo "&- Lines Counted" >&3

    ```


    This program copies input to standard output, but it displays a running count
    of the lines that it has copied. If we invoke it, we can see it in action:


    ```

    ~me:linuxbox ~ $ find /usr/share | ./counter-exec ~ ~/find_list.txt

    ```


    In this pipeline, we generate a list of files using find, and then count them
    before writing the list in a file named find list.txt.


    The script works by reading a line from the standard input and writing the REPLY
    variable (which contains the line of text from read) to standard output. The printf
    format specifier contains a series of six backspaces and a formatted integer that
    is always six digits padded with leading zeros.


    # /dev/tty


    The mysterious part of the script above is the exec. The exec is used to open
    a file using file descriptor 3 which is set to point to /dev/tty./dev/tty is one
    of several special files that we can access from the shell. Special files are
    usually "real" files in the sense that they are files that exists on a physical
    disk. Rather, they are virtual files in the /proc directory. The dev/tty is a
    device that always points to a program''s controlling terminal, that is the terminal
    that is responsible for launching the program. If we run the command ps ax on
    our system, we will see a list of every process. The top of the list is a column
    labeled "TTY" (short for Teletype) reflecting its historical roots) that contains
    the name of the controlling terminal. Most entries in this column will contain
    "? meaning that the process has no controlling terminal (the process was not launched
    interactively), but others will contain a name like "pts/1" which refers to the
    device /dev/pts/1. The term "tty" means pseudo-terminal, the type of terminal
    used by terminal emulators rather actual physical.


    # Noclobber


    When the shell encounters a command with output redirection, as is:


    ```

    command > file

    ```


    60 More Redirection'
