    # # Registers


    We are no doubt familiar with the idea of copying and pasting in text editors.
    With vim,

    we know y performs a yank (copy) of the selected text, while p and P each paste
    text at

    the current cursor location. The way vim does this involves the use of **registers**.


    Registers are named areas of memory where vim stores text. We can think of them
    as a

    string of variables. Vim uses one particular set to store that we delete, but
    there

    others that we can use to store and restore it as we desire. It''s like having
    a multi-

    element clipboard.


    To refer to a register, we type " followed by a lowercase letter or a digit (though

    have a special use), for example:


    "a


    refers to the register named "a". To place something in the register, we follow
    the register

    with an operation "yank to end of the line:


    "ay$


    To recall the contents of a register, we follow the name of the register with
    a paste

    operation like so:


    "ap


    Vim, with Vigor 173'
