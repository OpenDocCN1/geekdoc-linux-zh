- pgno: 204
  md: '# 12 Coding Standards Part 1: Our Own


    Most computer programming is done by organizations and teams. Some programs are
    developed by lone individuals within a team and others by collaborative groups.
    In order to promote program quality, many organizations develop formal programming
    guidelines called coding standards that define specific and stylistic coding practices
    to help ensure quality and consistency.


    In this adventure, we are going to develop our own shell script coding standard
    to be known henceforth the LinuxCommand Bash Script Coding Style Guide. The source
    adventure is a necessary prerequisite for this adventure.


    Roaming around the Internet, we can find lots of articles about "proper" shell
    script standards and practices. Some are listed in the "Further Reading" at the
    end of this adventure. While the scripts presented in TLCL do not follow any particular
    standard (instead, they present common practice from historical perspectives),
    their design promotes several important ideas:


    +   - Write cleanly and simply. Look for the simplest and most easily understood
    solutions to problems.


    +   - Use modern idioms, but be aware of the old ones. It''s important that scripts
    fit within common practice so that experienced people can easily understand them.


    +   - Be careful and defensive. Follow Murphy''s Law: anything that can go wrong
    eventually.


    +   - Document your work.


    +   - There are lots of ways to do this, but some are better than others.


    Coding standards generally support the same goals, but with more specificity.


    In reviewing the Internet''s take on shell scripting standards, one might notice
    a certain undercurrent of hostility towards the shell as a programming medium
    at all. Why is this?


    Most programmers don''t learn the shell at the beginning of their programming
    careers; instead, they learn it (haphazardly) after they have learned one or more
    traditional programming languages. Compared to most programming languages, the
    shell is an odd beast that, to many, a chaotic mess. This is largely due to the
    shell''s unique role as both a command line interpreter and a scripting language.


    As with all programming languages, the shell has its particular strengths and
    weaknesses. The shell is good at solving certain kinds of problems, and not so
    good at others. Like all good artists, we need to understand the bounds of our
    medium.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# What the Shell is Good At


    +   - The shell is a powerful glue for connecting thousands of command line programs
    together into solutions to a variety of data processing and system administration
    problems.


    +   - The shell is adept at batch processing. In the early days of computing,
    programs were not interactive; that is, they started, they carried out their tasks,
    and ended. This style of programming dominated computing until the early 1960s
    when disk storage and virtual memory made timesharing and interactive programs
    possible. Those of us remember MS-DOS will recall that it had a limp substitute
    for shell scripts called batch files.


    # What the Shell is Not So Good At


    +   - The shell does not excel with programs requiring a lot of user interaction.
    Yes, the shell has the read command and we could use dialog, but let''s face it,
    the shell is not very good at this.


    +   - The shell is not suitable for implementing algorithms requiring complex
    structures. While the shell has integers, strings, and one dimensional arrays
    (which can be associative), it doesn''t support anything beyond that. For example,
    it doesn''t have structures, enumerated Boolean types, or floating point numbers.


    # A Coding Standard of Our Own


    Keeping the points above in mind, let''s make our own shell script coding standard.
    It will be an amalgam of published standards, along with a dash of the author''s
    own humble wisdom on the subject. As the name implies, LinuxCommand Bash Script
    Style coding standard will be very bash specific and as such, it will use some
    features that are not found in strictly POSIX complaint shells.


    # Script Naming, Location, and Permissions


    Like others, executable script file names should not include an extension. Shared
    libraries of shell code which are not standalone executables have the extension
    .sh if the code is portable across multiple shells (for example bash and zsh)
    .bash if the code is bash-specific.


    For ease of execution, scripts should be placed in a directory listed in the user''s
    PATH. The /bin directory is a good location for personal scripts as most Linux
    distributions support this out of the box. Scripts intended for by all users should
    be located in /usr/local/bin directory. System administration scripts (ones intended
    for the


    196 Coding Standards Part 1: Our Own'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'superuser) should be placed in /usr/local/sbin. Shared code can be located
    in any subdirectly of the user''s home directory. Shared code intended for system
    wide should be placed in /usr/local/lib unless the shared code specifies only
    configuration settings, in which case it should be located in /usr/local/etc.


    Executable code must be readable and executable to be used, thus the permission
    setting for shell scripts should be 755, 750 or 700 depending on security requirements.
    Shared code need only be readable, thus the permissions for shared code should
    be 644, 640, or 600.


    # Structure


    A script is divided into five sections. They are:


    +   1. The shebang

    2. The comment block

    3. Constants

    4. Functions

    5. Program body


    # The Shebang


    The first line of a script should be a shebang in either of the following forms:


    ```

    #!/bin/bash

    ```


    Or


    ```

    #!/usr/bin/env bash

    ```


    The second form is used in cases where the script is intended for use on a non-Linux
    system (such as macOS). The env command will search the user''s PATH for a bash
    executable and launch the first instance it finds. Of the two forms, the first
    is preferred as its results are less ambiguous.


    # The Comment Block


    The first bit of documentation to appear in the script is the comment block. This
    set of comments should include the name of the script and its author, any necessary
    copyright and licensing information, a brief description of the script''s purpose,
    and its command line options and arguments.


    It is also useful to include version information and a revision history. Here
    is an example of a fully populated comment block. The exact visual style of the
    block is undefined and is left to the programmer''s discretion.


    ```

    # ----------------------------------------------------------------------

    # new_script - Bash script template generator

    ```'
