- pgno: 105
  md: '# ! pattern


    It is also possible to negate a pattern, so that only records that do not match
    a specified pattern are selected.


    # pattern, pattern


    Two patterns separated by a comma can call a range pattern. With it, once the
    first pattern is matched, every subsequent record matches until the second pattern
    is matched. Thus, this type of pattern will select a list of records. Let''s imagine
    that we have a list of records and that the first field in each record contains
    a sequential number:


    ```

    0001 field field field

    0002 field field field

    0003 field field field

    ```


    and so on. And let''s say that we want to extract records 0050 through 0100, inclusive.
    To do so, we use a range pattern like this:


    ```

    $1 == "0050", $1 == "0100"

    ```


    # Fields and Records


    The AWK language is so useful because of its ability to automatically separate
    fields and records by newlines and whitespace, this can be adjusted. The /etc/passwd
    file, for example, does not separate its fields with whitespace; AWK has a built
    in variable named FS (field separator) that defines the delimiter separating fields
    in a record. Here is an AWK program that will list the user ID and the user''s
    name from the file:


    ```

    BEGIN { FS = ":" }

    print $1, $5

    ```


    This program has two pattern/action pairs. The first action is performed before
    the first record is read and sets the input separator to be the colon character.


    Second pair contains only an action and no pattern. This will match every record.
    The action prints the first and fifth fields from each record.


    The FS variable may contain a regular expression, so really powerful methods can
    be used to separate fields.


    Records are normally separated by newlines, but this can be adjusted too. The
    built in variable RS (record separator) defines how records are delimited. A common
    type of record consists of multiple lines separated by one or more blank lines.
    AWK has a shortcut for specifying the record separator in this case. We define
    RS to be an empty string:


    ```

    RS = """

    ```'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'Note when this is done, newlines, in addition to any other specified characters,
    will always be treated as field separators regardless of how the FS variable is
    set. When we process multi-line records, we will often want to treat each line
    as a separate field, so doing this is often desirable:


    ```

    BEGIN { FS = "\n"; RS = "" }

    ```


    # Variables and Data Types


    AWK treats data as either a string or a number, depending on its context. This
    can sometimes become an issue with numbers. AWK will often treat numbers as strings
    unless something specifically "numeric" is done with them.


    We can force AWK to treat a string of digits as a number by performing some arithmetic
    on it. It is most easily done by adding zero to the number:


    ```

    n = 105 + 0

    ```


    Likewise, we can get AWK to treat a string of digits as a string by concatenating
    an empty string:


    ```

    s = 105 ""

    ```


    String concatenation in AWK is performed using a space character as an operator
    - an unusual feature of the language.


    Variables are created as they are encountered in AWK (no prior declaration is
    required), just like the shell. Variable names in AWK follow the same rules as
    the shell. Names may consist of letters, numbers, and underscore characters. Like
    the shell, the first character of a variable name must not be a number. Variable
    names are case sensitive.


    # Built-in Variables


    We have already looked at a few of AWK''s built-in variables. Here is a list of
    the most useful ones:


    # FS - Field separator


    This variable contains a regular expression that is used to separate a record
    into fields. initial value separates fields with whitespace. AWK supports a shortcut
    to return this variable to its original value:


    ```

    FS = " ""

    ```


    The value of FS can also be set using the -F option on the command line. For example,
    we can quickly extract the user name and UID fields from the /etc/passwd file
    like this:


    ```

    awk -F: ''(print $1, $3)'' /etc/passwd

    ```'
