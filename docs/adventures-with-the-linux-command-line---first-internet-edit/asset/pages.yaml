    # # How it Works


    On the surface, dialog appears straightforward. We launch dialog followed by one
    or more common options (that apply regardless of the desired dialog) and then
    the box option and its associated parameters. The tricky part of using dialog
    is getting data out of it.


    The data that dialog takes in (such as a string entered into an input box) is
    normally returned on standard error. This is because dialog uses standard output
    to display text on the terminal when there are a couple of techniques we can use
    to handle the return value. Let''s take a look at them.


    # # Method 1: Store the Results in a Temporary File


    The first method is to use a temporary file. The sample programs supplied with
    dialog provide some examples (this script has been modified from the original
    for clarity):


    ```

    #!/bin/bash


    # inputbox - demonstrate the input box with a temporary file


    # Define the dialog exit status codes

    :$DIALOG_OK=0

    :$DIALOG_CANCEL=1

    :$DIALOG_HELP=2

    :$DIALOG_EXTRA=3

    :$DIALOG_ITEM_HELP=4

    :$DIALOG_ESC=255

    ```'
