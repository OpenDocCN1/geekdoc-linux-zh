  md: '# Views


    The join example above is a pretty useful query for our tables, but due to its
    complexity it''s best executed from a file rather than an ad hoc query. SQL addresses
    this issue by providing a feature that allows a complex query to be stored in
    the database and used to produce a virtual table that can be used with simple
    query commands. In the following example we will create a view using our INNER
    JOIN query to create a virtual table Stats that we can use as the target of subsequent
    queries.


    ```

    -- view_demo.sql


    DROP VIEW IF EXISTS Stats;

    CREATE VIEW Stats

    AS

    SELECT Package_Descriptions.package_name AS Package,

    description AS Description,

    count Files,

    tot_size AS Size

    FROM Package_Descriptions

    INNER JOIN Stats

    ON Package_Descriptions.package_name =

    Package_Stats.package_name

    ORDER BY Package;

    ```


    Once we create it, we can treat Stats as just another table in our database even
    though it does not really exist.


    | Description | Files | Size |

    |---|---|---|

    | ''Anything to PostScript'' query and manage user i | 299 | 3455890 |

    | Access control list utilities | 19 | 261704 |

    | scripts for handling many ACPI event | 11 | 91106 |

    | Advanced configuration and Power In | 18 | 86126 |

    | admin release notes | 81 | 246658 |

    | Adium message style for Ubuntu | 137 | 126759 |

    | default icon of GNOME (small | 1127 | 484868 |

    | GNOME solitaire card game collectio | 316 | 1890864 |

    | ALSA driver configuration files | 42 | 195295 |


    To delete a view we use the DROP VIEW statement as follows:


    ```

    sqlite> DROP VIEW Stats;

    ```


    # Indexes


    It''s been said that the most important features of a database system are "performance,
    performance, and performance." While this is not exactly true (things like data
    integrity and reliability are important), complex operations on large databases
    can get really slow, so it''s important to make things as fast as we can. One
    feature we can take advantage of is indexes.


    # SQL'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'An index is a data structure the database maintains that speeds up database
    searches. It''s a sorted list of rows in a table ordered by elements in one or
    more columns. Without an index, a table is sorted by values in a hidden column
    called rowid. The values in this column are integers that start with 1 and increment
    each time a row is added to the table. Here we see a query that selects the 100th
    row from the Package_Stats table.


    ```

    sqlite>.header

    sqlite>.mode column

    sqlite>.width 20 -5 -8 -0 -8

    sql> SELECT * FROM Package_Stats WHERE rowid = 100;

    package_name      count  min_size  max_size avg_size

    cups-server-common  595 1996400 0 370070 3355.294

    ```


    Our database can locate this row in the table very quickly because it already
    knows where to find the 100th row. However, if we want to search for the row that
    contains package name cups-server-common SQLite must examine every row in the
    table to locate the matching row. To facilitate performance tuning, SQLite provides
    a way to see what strategy is used during a query.


    ```

    sqlite>.width -8 -5 -4 5

    sqlite> EXPLAIN QUERY PLAN

    ...> SELECT * FROM Package_Stats WHERE package_name = ''cups-server-common'';

    selectid  order  from  detail

    0  0  0  SCAN Table Package_Stats

    ```


    We can see the SCAN Table Package_Stats SQLite performs a sequential scan of the
    table during this query.


    To create an index to allow faster searches of package_name we can do the following:


    ```

    sqlite> CREATE INDEX idx_package_name

    ...> ON Package_Stats (package_name);

    ```


    After doing this, we''ll look at the query plan and see the difference.


    ```

    sqlite> EXPLAIN QUERY PLAN

    ...> SELECT * FROM Package_Stats WHERE package_name = ''cups-server-common'';

    selectid  order  from  detail

    0  0  0  SEARCH Table Package_Stats USING INDEX idx_package_name

    ```


    Hereafter when we search for a package name, SQLite will use the index to get
    directly to the row rather than looking at every row for a match. Why don''t we
    just index everything? The reason is that indexes impose overhead every time a
    row is inserted, deleted, or updated since indexes must be kept up to date. Indexes
    are used on tables that are read more than written to.


    We probably won''t see much of a performance improvement when searching the Package_Stats
    table because it''s not that big, but on a large table the improvement could be
    substantial.'
  merge: -1
  img_proc: true
- pgno: 249
  md: "We can see the index when we examine the table.schema.\n\n```\nsqlite> .schema\
    \ Package_Stats\nCREATE TABLE Package_Stats (\n  package_name VARCHAR(60),\n \
    \ count        INTEGER,\n  tot_size     INTEGER,\n  min_size     INTEGER,\n  max_size\
    \     INTEGER,\n  avg_size     REAL\n);\nCREATE INDEX Idx_package_name\nOn Package_Stats\
    \ (package_name);\n```\n\nSQLite also has a command.\n\n```\nsqlite> .indexes\n\
    idx_package_name\n```\n\nAnother benefit of using an index is that it's sorted\
    \ order (that is how it performs searches quickly). The side effect is that when\
    \ an index is used during the query results of the query will be sorted as well.\
