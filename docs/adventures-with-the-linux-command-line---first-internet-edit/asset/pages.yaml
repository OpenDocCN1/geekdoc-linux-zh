    # # Power Features


    Beyond basic file manipulation, Midnight Commander offers a number of additional
    features, some which are very interesting.


    # # Virtual File Systems


    Midnight Commander can treat some types of archive files and hosts as though they
    are local files. Using the `cd` command at the shell prompt, we can access these.


    For example, we can look at the contents of tar. To try this out, let''s create
    a compressed file containing the files in the `/etc` directory. We can do this
    by entering the command at the shell prompt:


    ```

    me@linux ~ tar cfg etc.tgz /etc

    ```


    Once this command creates (there will be "permission denied" errors but these
    don''t matter for our purposes), the file `etc.tgz` will appear among the files
    in the current panel. If we select this file and press `Enter`, the contents of
    the archive will be displayed in the current panel. Notice that the prompt does
    not change as it does with ordinary directories. This is because the current panel
    is displaying a list of files like before, Midnight Commander cannot treat the
    virtual file system in the same way as a real. For example, we cannot delete files
    from the tar archive, but we can copy files from the archive to the real file
    system.


    18 Midnight Commander'
