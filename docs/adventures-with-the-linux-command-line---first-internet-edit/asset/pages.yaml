  md: '# 14 SQL


    Okay kids, grid your grid for a big one.


    The world as we know it is powered by data. Data, in turn, is stored in databases.
    Most everything we use computers for involves using data stored in some kind of
    database. When we talk about storing large amounts of data, we often mean relational
    management systems (RDBMS). Banks, insurance companies, most every accounting
    system, and many, many websites use relational databases to store and organize
    their data.


    The idea of relational data storage is generally credited to English computer
    scientist and IBM researcher E. F. Cobb, who proposed it in a paper in 1970. In
    the years that followed, a number of software companies built relational databases
    with varying degrees of success. Around 1973, IBM developed a simplified and flexible
    method of managing relational databases called Structured Query Language (SQL),
    often pronounced "sequel". Today the combination of RDBMS and SQL is a huge industry,
    generating billions of dollars every year.


    Relational databases are important to the history of Linux as well. It was the
    availability of open source database programs (such as MySQL) and web servers
    (most notably, Apache) that led to an explosion of Linux adoption in the early
    days of the world wide web.


    In this adventure, we''re going to study the fundamentals of relational databases
    and use a popular command line program to create and manage a database of our
    own. The AWK adventure is a suggested prerequisite.


    # A Little Theory: Tables, Schemas, and Keys


    Before we delve into SQL we have to look at what relational databases are and
    how they work.


    # Tables


    Simply put, a relational database is one or more tables containing columns and
    rows. Technically, the columns are known as attributes and the rows as tuples,
    but most often they are simply called columns and rows. In many ways, a table
    represents the familiar spreadsheet. In fact, spreadsheet programs are often used
    to prepare and edit database tables. Each column contains data of a consistent
    type, for example, one column might consist of integers and another column strings.
    A table can contain any number of rows.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# Schemas


    The design of a database is called its *schema* and it can be simple, containing
    just a single table or two, or it can be complex, containing many tables with
    complex interrelations between them.


    Let''s imagine a database for a bookstore consisting of three tables. The first
    is called *Customers*, the second is called *Items*, and the third is called *Sales*.
    The *Customers* table will have multiple rows with each row containing information
    about one customer. The columns include a customer number, first and last names,
    and the customer''s address. Here is such a table with some made-up names:


    The *Items* table lists our books and contains the item number, author, and price.


    | First | Last | Street | City | ST |

    |---|---|---|---|--|

    | 0001 | Richard | Stollman | 1 Ontowne Street | Boston | MA |

    | 0002 | Eric | | | 2 Amendment Road | Bunker | PA |

    | 0003 | Bruce | Porens | 42 Middleville | Anytown | US |


    | Item | Title | Author | Price |

    |---|---|---|--|

    | 1001 | Winning Friends and Influencing People | Dale Carnegie | 14.95 |

    | 1002 | The Communist Manifesto | Marx & Engels | 00.00 |

    | 1003 | Atlas Shrugged | Ayn Rand | 99.99 |


    As we go selling items in our imaginary bookstore, we generate rows in the *Sales*
    table. Each sale generates a row containing the customer number, date and time
    of the sale, the item number, the quantity, and the total amount of all.


    | Cust | Date | Item | Quan | Total |

    |---|---|---|---|--|

    | 0002 | 202006150931 | 1003 | 1 | 99.99 |

    | 0001 | 202006151108 | 1002 | 1 | 0.00 |

    | 0003 | 202006151820 | 1001 | 10 | 14.90 |


    # Keys


    Now we are wondering what the *Cust* and *Item* columns are for. They serve as
    keys to uniquely identify a row and facilitate interrelations between tables.
    Keys have some special properties. They must be unique (they can appear only once
    in a table and specifically identify a row) and must be immutable (they can never
    change). If they can''t meet these requirements, they cannot be keys. Some database
    implementations have methods of enforcing these requirements during creation and
    keys can be formally specified. In the case of our bookstore database, the *Cust*
    column contains the keys for the *Customers* table and the *Item* column contains
    the keys for the *Items* table.


    Knowing about keys, we can now understand why the *Sales* table works the way
    it does. We can see for example that row 1 of the *Sales* table tells us that
    customer 0002 purchased 1 copy of item 103 for $99.99. Why do we need special
    values for the


