  md: 'terminfo). Terminals set an environment variable named TERM that is used by
    X and terminfo to identify the terminal type, and thus send it the correct control
    codes. To see the current value of the TERM variable, we can do this:


    ```

    me@linuxbox ~$ echo $TERM

    ```


    Even if we use a modern terminal, such as gnome-terminal, we will notice that
    the TERM variable is often set to "xterm" or "xterm-color". That''s how much influence
    xterm had. We still use it as the standard.


    # rxvt


    By the standards of the time, xterm was a heavyweight program but, as time went
    by, some of its features were rarely used such as the Tektronix emulation. Around
    1990, in an attempt to create a simpler, lighter terminal emulator, Robert Nano
    wrote rxvt as part of the FVWM window manager, an early desktop environment for
    Unix-like systems.


    rxvt has a smaller feature set than xterm and emulates the DEC VT102 terminal
    rather than the more advanced VT220. rxvt sets the TERM variable to "rxvt", which
    is widely supported. Like xterm, rxvt has menus that are displayed by holding
    the Ctrl key and pressing different mouse buttons.


    rxvt is still under active maintenance, and there is a popular modern implementation
    forked from the original called urxvt () by Mark Lehmann, which supports Unicode
    (multi-byte characters to express a wider range of written languages than ASCII).
    One interesting feature in urxvt is a daemon mode that allows launching multiple
    terminal windows all sharing the same instance of the program- a potential memory
    saver.'
