- pgno: 44
  md: "+   - screen -d detaches a screen session from the previous terminal and reattaches\
    \ it to the current terminal.\n\n+   - screen -D detaches a screen session from\
    \ the previous terminal, logs the user off the old terminal and attaches the session\
    \ to the new terminal creating a new session if no session existed. According\
    \ to the screen documentation, this is the author's favorite.\n\nThe -d/-D and\
    \ -r/-R options can be used independently, but they are most often used together\
    \ to detach and reattach an existing screen session in a single step.\n\nWe can\
    \ demonstrate this process by opening two terminals. Launch screen on the first\
    \ terminal and create a few windows. Now, go to the second terminal and enter\
    \ the command screen -D -R. This will cause the first terminal to vanish (the\
    \ user is logged off) and the screen session to move to the second terminal fully\
    \ intact.\n\n# Customizing Screen\n\nLike the interactive GNU utilities, screen\
    \ is customizable. During invocation, screen reads the /etc/screenrc and ~/.screenrc\
    \ files that exist. While the list of customizable features is extensive (many\
    \ having to do with terminal display control on a variety of Unix and Linux-like\
    \ platforms), we will concern ourselves key bindings and startup session configuration\
    \ since these are the most used.\n\nFirst, let's look at a sample .screenrc file:\n\
    \n```\n# This is a comment\n\n# Set some key bindings\n\nbind k           # Un-bind\
    \ the \"k\" key (set it to do nothing)\nbind K kill      # 'Ctrl-a K' destroy\
    \ the current window\nbind ) history  # 'Ctrl-a -' copy and paste the current\n\
    \                 # command line\n\n# Define windows 7, 8, and 9 at startup\n\
    screen -t \"mdnght cmdr\" 7 mc\nscreen -t htop 8 htop\nscreen -t 9 tail /var/log/syslog\n\
    ```\n\nAs we can see, the format is pretty simple. The bind directive is followed\
    \ by the key and the command it is to be bound. A complete list of the commands\
    \ found in the screen man page. All of the screen commands we have discussed so\
    \ far are simply key bindings like those in the example. We can redefine them\
    \ all.\n\nThe three lines at the end of our example .screenrc create windows at\
    \ startup. The commands set the window title (the -t option), a window number,\
    \ and a command for the window to contain. This way, we can set up a screen session\
    \ to be automatically built"
