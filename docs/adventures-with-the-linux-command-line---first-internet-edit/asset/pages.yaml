    Directory and command line mouse controls


    # Viewing and Editing Files


    An activity performed while directory browsing is examining the content of files.

    Midnight Commander provides a capable file viewer which can be accessed by selecting
    and pressing the F3 key.


    ```

    /home/me/.bashrc 649/3383

    # /usr/share/doc/bash/examples/startup-files (in the package bash-doc)

    # for examples


    # If not running interactively, do not do anything

    [ -z $PS1 ] && return


    # Don''t duplicate lines or starting with space in the history.

    # See bash(1) for more options

    history


    # append to the History file, don''t overwrite it

    sopt -s historyappend


    # for setting history length HISTSIZE and HISTFILES in bash(1)

    HISTSIZE=1000

    HISTSIZE=2000


    # check the window size after each command, and if necessary,

    # update the values of LINES COLUMNS.

    shopt -s winsize

    1Help 2Unrap 3Quit 4Hex 5Goto 6Search 7Raw 8Format 90Quit

    ```


    File viewer


    Midnight Commander'
  merge: -1
  img_proc: true
