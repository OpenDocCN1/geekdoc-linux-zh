- pgno: 202
  md: "control.\" A run-control file is generally kind of script or configuration\
    \ file that prepares an environment for a program to use. In the case of .bashrc\
    \ for example, it’s a script that prepares a user’s bash shell environment.\n\n\
    # Security Considerations and Other Subtleties\n\nEven though sourced files are\
    \ not directly executable, they do contain code that will be executed by anything\
    \ that sources them. It is important, therefore, that permissions be set to allow\
    \ writing only by their owners.\n\n```\nme@linuxbox:~$ sudo chmod 644 /usr/local/etc/back_me_up.cfg\n\
    ```\n\nIf a sourced file contains confidential information (/etc/as a backup program\
    \ might), set the permissions to 600.\n\nWhile bash, ksh, and zsh all have the\
    \ source builtin, dash and all strictly POSIX compatible shells support only the\
    \ single dot ().\n\nIf the name argument given to source does not contain a /\
    \ character, the directories listed in the PATH variable are searched for the\
    \ specified file. For security reasons, it’s probably not a idea to rely on it.\
    \ Always specify a explicit path name.\n\nAnother subtlety has to do with positional\
    \ parameters. source executes its commands in the current shell environment, this\
    \ includes the positional parameters a script was given as well. This is fine\
    \ in most cases; however, if source is used within a shell function and that function\
    \ has its own positional parameters, source will ignore them and use the shell’s\
    \ environment instead. To overcome this, positional parameters may be specified\
    \ after the file name. Consider the following script:\n\n```\n#!/bin/bash\n\n\
    # foo_script\nsource ~/foo.sh\n\nfoo() {\n  source ~/foo.sh\n}\n```\n\nfoo \"\
    string2\"\n\nfoo.sh contains this one line of code:\necho $1\n\nWe expect to see\
    \ the following output:\nme@linuxbox: ~ foo_script string1\nstring1\nstring2\n\
    \nBut, what we actually get is this:\n\nsource 193"
  merge: -1
  img_proc: true
- pgno: 203
  md: "```\nme@linuxbox: ~$ foo_script stringl\nstringl\nstringl\n```\n\nThis is because\
    \ source uses the shell environment script was given, not the one that exists\
    \ when the function called. To correct this, we need to write our script this\
    \ way:\n\n```\n#!/bin/bash\n\n# foo_script\n\nsource ~/foo.sh\n\nfoo() {\n  source\
    \ ~/foo.sh \"$1\"\n}\n\nfoo \"string2\"\n```\n\nBy adding the desired parameter\
    \ to the source command within the function foo, we are able to get the desired\
    \ behavior. Yes, it's subtle.\n\n# Summing Up\n\nBy using source, we can greatly\
    \ reduce the effort needed to maintain our bash scripts particularly when we are\
    \ deploying them across multiple machines. It also allows us to effectively reuse\
    \ code with function libraries that all of our scripts can share. Finally, we\
    \ can use source to build much more capable shell environments for our day to\
    \ day command line use.\n\n# Further Reading\n\n+   - A Wikipedia article on the\
    \ dot command from which the source builtin is derived: https://en.wikipedia.org/wiki/Dot_(command)\n\
    \n+   - Another article about run-commands: https://en.wikipedia.org/wiki/Run_commands"
