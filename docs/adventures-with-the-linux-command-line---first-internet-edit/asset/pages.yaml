- pgno: 28
  md: 'Virtual file systems can also treat remote file systems as local directories.
    In most versions of Midnight Commander, both FTP and FISH (Files transferred over
    SHell) protocols are supported and, in some versions, SMB/CIFS as well.


    As an example, let''s look at the software library FTP at Georgia Tech, a popular
    repository for Linux software. Its name is ftp.glib.gatech.edu. To connect with
    /pub directory on this site and browse its files, we enter the \ cd command:


    ```

    me@linuxbox ~ $ cd ftp://ftp.glib.gatech.edu/pub

    ```


    Since we don''t have permission on this site, we cannot modify any files there,
    but we can copy files from the remote server to our local file system.


    The FISH protocol is simple. It can be used to communicate with any Unix-like
    system that runs a secure shell (SSH). If we have write permissions on the remote
    server, we can operate on the remote system''s files as if they were local. This
    is extremely handy for performing remote administration. The cd command for FISH
    protocol looks like:


    ```

    me@linuxbox ~ $ cd sh://user@remotehost/dir

    ```


