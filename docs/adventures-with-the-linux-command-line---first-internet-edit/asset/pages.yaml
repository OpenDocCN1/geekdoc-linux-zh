- pgno: 38
  md: '# 2 Terminal Multiplexers


    It''s easy to take the terminal for granted. After all, modern terminal emulators
    like gnome-terminal, konsole, and the others included with Linux desktop environments
    are feature-rich applications that satisfy most of our needs. But sometimes we
    need more. We need to have multiple sessions running in a single terminal. We
    need to display more than one application in a single terminal. We need to move
    a running terminal session from one computer to another. In short, we need a terminal
    multiplexer.


    Terminal multiplexers are programs that can perform these amazing feats. In this
    adventure, we will look at three examples: GNU screen, tmux, and byobyu.


    # Some Historical Context


    If we were to go back in time, the mid-1980s, we might find ourselves staring
    at a computer terminal; with an 80-column width, 24-line high display and a keyboard
    connected to a shared, central Unix computer with an RS-232 serial connection
    and, perhaps, an acoustic-coupler modem and a telephone handset. On the display
    screen there might be a prompt unlike the prompt we see today in a Linux session.
    However, unlike today, the computer of the 1980s did not have multiple windows
    or tabs to display multiple applications or shell sessions. We had only one screen
    and that was it. Terminal multiplexers were originally developed to help address
    this limitation. A terminal multiplexer allows multiple sessions and applications
    to be displayed and managed on a single screen. While modern desktop environments
    and terminal emulator programs support multiple windows and tabbed terminal sessions,
    which mitigate the need of terminal multiplexers for some purposes, terminal multiplexers
    will still offer some features that will greatly enhance our command-line experience.


    # GNU Screen


    GNU screen goes way back. First developed in 1987, screen appears to be the first
    program of its type and define the basic feature set found in all subsequent terminal
    multiplexers.


    # Availability


    As its name implies, GNU screen is part of the GNU Project. Though it is rarely
    installed by default, it is available in most distribution repositories as the
    package “screen”.


    # Invocation


    We can start using GNU screen by simply entering the screen command at the shell
    prompt. Once the command is launched, we will be presented with a shell prompt.'
  merge: -1
  img_proc: true
