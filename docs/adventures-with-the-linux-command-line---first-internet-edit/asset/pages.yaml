    AWK has many of the same flow control statements that we''ve seen previously in
    the shell (with the exception of case, though we can think of an AWK program as
    one big case statement inside a loop) but the syntax closely resembles that of
    the C programming language. Actions in AWK often contain complex logic consisting
    of various statements and flow control instructions. A statement in this context
    can be a simple statement like:


    ```

    a = a + 1

    ```


    Or a compound statement enclosed in braces such as:


    ```

    { a = a + 1; b = b * a

    ```


