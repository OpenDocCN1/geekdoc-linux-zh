- pgno: 196
  md: '# 11 source


    Most programming languages permit programmers to specify external files to be
    included within their programs. This is often used to add "boilerplate" code to
    programs for such things as defining standard constants and referencing external
    library function definitions.


    Bash (along with ksh and zsh) has a builtin command line, source, that implements
    this feature. We looked at source briefly when we worked with the .profile and
    .bashrc files used to establish the shell environment.


    In this adventure, we will look at source again and discover the ways it can make
    our scripts more powerful and easier to maintain.


    To recap, source reads a specified file and executes the commands within it using
    the current shell. It works with the interactive command line and within a script.
    Using the command line for example, we can reload the .bashrc file by executing
    the following command:


    ```

    linuxbox: ~ source ~/.bashrc

    ```


    Note that the source command can be abbreviated by a single dot character like
    so:


    ```

    linuxbox: ~ .~bashrc

    ```


    When source is used on the command line, the commands in the file are treated
    as if they are being typed directly at the keyboard. In a shell script, the commands
    are treated as though they are part of the script.


    # Configuration Files


    During our exploration of the Linux ecosystem, we have seen that many programs
    rely on configuration files. Most of these are simple text files just like our
    shell scripts. By using source, we can easily create configuration files for our
    shell scripts as well.


    Consider this example. Let''s imagine that we have several computers on our network
    that need to get backed up on a regular basis and that a central backup server
    is used to store the files from various systems. On each of the backup client
    systems we have a script called back_me_up that copies the files over the network.
    Let''s further imagine that each client system needs to back up a different set
    directories.


    To implement this, we must define a constant in the back_me_up script like this:


    ```

    BACKUP_DIRS="/etc /usr/local /home"

    ```


    However, doing it this way will require that we maintain a separate version of
    the script for each client. This will make maintaining the script much more laborious,
    as any future improvement to the script will have to be applied to each copy of
    the script individually.'
  merge: -1
  img_proc: true
- pgno: 197
  md: "What's more, this list of directories might be useful to other programs, too.\
    \ For example, we could have a file restoration script called restore_me that\
    \ restores files from the backup server to the backup client system. If this were\
    \ the case, we would then have twice as many scripts to maintain. A much better\
    \ way handle this issue would be to create a configuration file to define the\
    \ BACKUP_DIR constant and store it into our scripts at run time.\n\nHere's how\
    \ we could do it.\n\nFirst, we would create a configuration file named back_me.cfg\
    \ and place it somewhere sensible. Since the back_me_up and restore_me scripts\
    \ are used on a system-wide basis (as most backup programs), we will treat them\
    \ as locally installed resources. Then, we would put them in the /usr/local/sbin\
    \ directory and\n\n```\n# Configuration file for the back_me_up program\nBACKUP_DIR=/etc\
    \ /usr/local /home/\n```\n\nWhile our configuration file must contain valid shell\
    \ syntax, since its contents are executed by the shell, it differs from a real\
    \ script in two regards. First, it does not require a shebang to which execute\
    \ it, and second, the file does not need executable permissions. It only needs\
    \ to be readable by the shell.\n\nNext, we would add the following code to the\
    \ back_me_up and restore_me scripts to our configuration file:\n\n```\nCONFIG_FILE=/usr/local/etc/back_me_up.cfg\n\
    \nif [[ -f \"$CONFIG_FILE\" ]]; then\n    source \"$CONFIG_FILE\"\nelelse\n  \
    \  echo \"Cannot read configuration file!\" >&2\n    exit 1\nfi\n```\n\n# Function\
    \ Libraries\n\nIn addition to the configuration shared by both the back_me_up\
    \ and restore_me scripts, there could be code shared between the two programs.\
    \ For example, it makes sense to have a shared function to display error messages:\n\
    \n```\n# Send message to std error\n# Options:    none\n# Arguments:  1 error_message\n\
    # Notes:      Use this function to report errors to standard error. Does\n   \
