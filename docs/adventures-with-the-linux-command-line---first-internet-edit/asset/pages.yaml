  md: '# split(s, a, fs)


    Splits string into fields and stores each field in an element of array a. Fields
    are split according to field separator fs. For example, if we wanted to break
    a phone number such as 800-555-1212 into 3 fields separated by the "-" character
    we could do this:


    ```

    phone="800-555-1212"

    split(phone, fields, "-")

    ```


