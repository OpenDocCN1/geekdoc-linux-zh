  md: '# Loading Output From a Command Into the Buffer


    Let''s edit an old friend. If we don''t have a copy to edit, we can make one.
    First we''ll

    open a buffer:


    ```

    :e dir-list.txt

    ```


    Next, we''ll load the buffer with some appropriate text:


    ```

    :r ! ls -l /usr/bin

    ```


    This will read the results of the specified external command into our buffer.


    # Running an External Command on the Current File


    Let''s save our file and then run an external command on it:


    ```

    :w wc -1 %

    ```


    Here we tell vim to execute the wc command on the current file dir-list.txt. This
    does

    not affect the current buffer, just the file when we specify it with the % symbol.


    # Using an External Command to Filter the Current Buffer


    Let''s apply a filter to the text. To do this, we need to select some text. The
    easiest way to

    do this is with visual mode:


    ```

    ggVG

    ```


    This will move the cursor to the beginning of the file and enter visual mode then
    move to

    t end of the file, selecting the entire buffer.


    We''ll filter the selection to remove everything except lines containing the string
    "zip"

    When we start entering a command after performing a visual selection, the presence
    of

    t selection will be indicated this way:


    ```

    '':<,''

    ```


    This actually signifies a range. We could easily specify a pair of line numbers
    such

    as 1, 100 instead. To complete our command, we add our filter:


    ```

    '':<,'' | grep zip

    ```


    We are not limited to a single command. We can also specify pipelines, for example:


    ```

    '':<,'' | grep zip | sort

    ```


    After running this command, our buffer contains a small selection of files, each

    containing the letters "zip" in the name.


    # Help topics::: ! filter'
  merge: -1
  img_proc: true
