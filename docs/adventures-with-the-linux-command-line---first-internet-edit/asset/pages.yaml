  md: '# Text Formatting


    Let''s say we wanted to add a license header to the beginning of our script. This
    would consist of a comment block near the top of the file that includes the text
    of the copyright notice.


    We''ll move to line 3 of our script and add the text, but before we start, let''s
    tell vim how long the lines of text to be. First we''ll ask vim what the current
    setting is:


