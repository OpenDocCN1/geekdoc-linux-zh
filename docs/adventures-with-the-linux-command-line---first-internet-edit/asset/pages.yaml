- pgno: 216
  md: "# Traps\n\nIn addition to a normal exit and an error exit, a script can also\
    \ terminate when it receives a signal. For some scripts, this is an important\
    \ issue if they exit in an unexpected manner, they may leave the system in an\
    \ undesirable state. To avoid this problem, we include traps to intercept signals\
    \ and perform cleanup procedures before the scripts exit. The three signals of\
    \ greatest importance are SIGINT (which occurs when Ctrl-c is typed) and SIGTERM\
    \ (which occurs when the system is shut down or rebooted) and SIGHUP (when a terminal\
    \ is terminated). Below is a set of traps to manage the SIGINT, SIGTERM, and SIGHUP\
    \ signals.\n\n```\n# Trap signals\ntrap \"signal exit TERM\" TERM HUP\ntrap \"\
    signal exit INT\" INT\n```\n\nDue to the syntactic limitations of the trap builtin,\
    \ it is best to use a separate function to act on the signal. Below is a function\
    \ that handles the signal exit.\n\n```\nsignal_exit() { # Handled signals\n  local\
    \ signal=\"$1\"\n  case \"$signal\" in\n    INT)\n      error_exit \"Program interrupted\
    \ by user\"\n      ;;\n    TERM)\n      printf \"\\n\\n\" \"$PROGNAME: Program\
    \ terminated\" >&2\n      graceful_exit\n      ;;\n    *)\n      error_exit \"\
    $PROGNAME: Termating on unknown signal\"\n      ;;\n  esac\n}\n```\n\nWe use a\
    \ case statement to provide different outcomes depending on the signal. In this\
    \ example, we also see a graceful_exit function that could provide needed cleanup\
    \ before the script terminates.\n\n# Temporary Files\n\nWherever possible, temporary\
    \ files should be avoided. In many cases, process substitution can be used instead.\
    \ Doing this way will reduce file clutter, run faster, and in some cases can be\
    \ more secure.\n\n```\n# Rather than this:\ncommand1 > \"TEMPFILE\"\n.\ncommand2\
    \ < \"$TEMPFILE\"\n\n# Consider this:\ncommand2 < <(command1)\n```"
  merge: -1
  img_proc: true
- pgno: 217
  md: 'If temporary files cannot be avoided, care must be taken to create them safely.
    We must consider, for example, what happens if there is more than one instance
    of the script running at the same time. For security reasons, if a temporary file
    is placed in a world-writable directory (such as /tmp) we must ensure the file
    name is unpredictable. A good way to create temporary files is by using the mktemp
    command as follows:


    ```

    TEMPFILE=$mktemp /tmp/$PROGRAMNAME.\$.XXXXXXXXXX

    ```


    In this example, a temporary file will be created in the /tmp directory with the
    name consisting of the script''s name followed by its ID (PID) and 10 random characters.


    For temporary files belonging to a regular user, the /tmp directory should be
    avoided in favor of the user''s home directory.


    # ShellCheck is Your Friend


    There is a program available in most distribution repositories called shellcheck
    that performs analysis of shell scripts and will detect many kinds of faults and
    poor scripting practices. It is well worth it to check the quality of scripts.
    To use it with a script that has a shebang, we simply do this:


    ```

    shellcheck my_script

    ```


    ShellCheck will automatically detect which dialect it uses based on the shebang.
    For shell script code that does not contain a shebang, such as function libraries,
    we use ShellCheck this way:


    ```

    shellcheck -s bash my_library

    ```


    Use the -s option to specify the desired shell dialect. More information about
    ShellCheck is found at its http://www.shellcheck.net.


    # Summing Up


    We covered a lot of ground in this adventure, specifying a complete set of technical
    and stylistic features. Using this coding standard, we can now write some production-quality
    scripts. However, the complexity of this standard does impose some cost in terms
    of development time and effort.


    In Part 2, we will examine a program from LinuxCommand.org called new_script,
    a bash script template generator that will greatly facilitate writing scripts
    that conform to our coding standard.


