    # Mapping


    Like many interactive command line programs, vim allows users to remap keys to
    customize vim behavior. It has a specific command for this, map, allows a key
    to be assigned the function of any other key or a sequence of keys. Further, vim
    allows us to say that a key is to be remapped in a certain mode, for example in
    normal mode but not in insert command mode.


    Before we go on, we should point out that the use of the map command is discouraged.
    It can create nasty side effects in some situations. Vim provides another set
    of mapping commands that are safe to use.


    Earlier, we looked at the paragraph reformatting sequence gqip, To demonstrate
    a useful remapping, we will map the Q key to generate this sequence. We can do
    this by entering:


    ```

    :nnoremap Q gqip

    ```'
