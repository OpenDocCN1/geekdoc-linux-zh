- pgno: 70
  md: 'the first thing that happens is that the output stream is started by either
    creating file, or if file already exists, truncating it to zero length. This means
    that command completely fails or doesn''t even exist, file will end up with zero
    length. This can be a safety issue for new users who might overwrite (or truncate)
    a valuable file.


    To avoid this, we can do one of two things. First we can use the “>>” operator
    instead of \> so that output will be appended to the end of file rather than the
    beginning. Second, we can set the “noclobber” shell option which prevents redirection
    from overwriting an existing file. To activate this, we enter:


    ```

    set -o noclobber

    ```


    Once we set this option, attempts to overwrite an existing file will cause the
    following error:


    ```

    bash: file cannot overwrite existing file

    ```


    The effect of the noclobber option can be overridden by using the >| redirection
    operator like so:


    ```

    command > file

    ```


    To turn off the noclobber option we enter this command:


    ```

    set +o noclobber

    ```


    # Summing Up


    While this adventure may be on the “interesting” side than the “fun” side, it
    does provide useful insight into how redirection actually works and some of the
    interesting ways we can use it. In a later adventure, we will put this new knowledge
    to work expanding our scripts.


    # Further Reading


    +   - A good visual tutorial can be found at The Bash Hackers Wiki: https://wiki.bash-hackers.org/howto/redirection_tutorial


    +   - For a little back on file descriptors, see this Wikipedia article: https://en.wikipedia.org/wiki/File_descriptor


    +   - This Linux article covers redirection using exec to manage redirection:
    https://www.linuxjournal.com/content/bash-redire-using-exec


    +   - The Linux Command Line covers redirection in Chapters 6 (main), 25 (here
    documents), 28 (here strings), and 36 (command grouping, subshells, substitution,
    named pipes).


    +   - The REDIRECTION section of the bash man page, of course, has all the details.'
