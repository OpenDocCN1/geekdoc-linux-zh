- pgno: 230
  md: 'keys? Why not, for instance, just use the customer''s name as the key? It''s
    because we can''t guarantee the name won''t change, or that two people might have
    the same name. We can guarantee that an arbitrarily assigned value like our customer
    number is unique and immutable.


    # Database Engines/Servers


    There are a number of database servers available for Linux. The two most prominent
    MySQL (and its fork MariaDB) and PostgreSQL. These database servers implement
    client/server architecture, a concept that became a hot topic in the 1990s. Database
    servers of this type run as server processes and connect to them over a network
    connection and send SQL statements to the server to carry out. The results of
    the database operations are returned to the client program for further processing
    and presentation. Many web sites use this architecture with a web server sending
    SQL statements to a separate database to dynamically create web pages as needed.
    The famous LAMP stack consisting of Linux, Apache web server, MySQL, and PHP powered
    much of the early.


    For purposes of this adventure, setting up database servers such as MySQL and
    PostgreSQL is too complicated to cover here since, among others, they support
    multiple concurrent users and their attendant security controls. It''s more than
    we need for learning SQL.


    # sqlite3


    The database we will be using is SQLite. SQLite is a library that can be used
    with applications to provide a high-level of SQL functionality. It''s very popular
    with the embedded systems crowd. It saves developers the trouble of writing custom
    solutions to their data storage and management tasks. In addition to the library,
    SQLite provides a command line tool for directly interacting with SQLite databases.
    Also, it accepts SQL from standard input (as well as its own command line interface)
    and sends its results to standard output, it''s ideal for use in our shell scripts.


    SQLite is available from most Linux repositories. Installation is easy, for:


    ```

    me@linuxbox:-$ sudo apt install sqlite3

    ```


    # Building a Playground


    Let''s build a playground with some real data. On the LinuxCommand.org site there
    is an archive we can download that will do trick.


    ```

    me@linuxbox:-$ cd

    me@linuxbox:-$ curl -c http://linuxcommand.org/adventure-sql.tgz

    me@linuxbox:-$ tar xzf adventure-sql.tgz

    me@linuxbox:-$ cd adventure-sql

    ```'
