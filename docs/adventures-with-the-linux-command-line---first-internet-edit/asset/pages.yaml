- pgno: 246
  md: "# Joins\n\nA join is a method by which we perform a query and produce a result\
    \ that combines the data from two tables. SQL supports several types of joins\
    \ but we're going to focus on the most commonly used type called inner join. We\
    \ can think of an inner join as the intersection of two tables. In the example\
    \ below, a file join_demo.sql, we will produce a query result that matches our\
    \ earlier example when we added columns to the Package_Descriptions table.\n\n\
    ```\n```sql\n-- join_demo.sql\n-- Demonstrate join by selecting columns from 2\
    \ tables\n\n.header on\n.mode column\n.width 20 35 -10\n\nSELECT Package_Descriptions.package_name\
    \ AS Package,\n    description AS Description,\n    count AS Files,\n    tot_size\
    \ AS Size\nFROM Package_Descriptions\nINNER JOIN Package_Stats\nON Package_Descriptions.package_name\
    \ = Package_Stats.package_name\n```\n```\n\nThe results of this query are as follows:\n\
    \n| Package | Description | Files | Size |\n|---|---|---|--|\n| a2ps | GNU a2ps\
    \ - 'Anything to PostScript' | 29 | 3455890 |\n| accountservice | query and manipulate\
    \ user account i | 19 | 2617044 |\n| acl | Access control list utilities | 11\
    \ | 91016 |\n| acpi-support | scripts for handling many ACPI event | 18 | 13896\
    \ |\n| acpid | Advanced Configuration and Power In | 19 | 86126 |\n| aduser |\
    \ add and remove users and groups | 81 | 2465658 |\n| adium-theme-ubuntu | theme\
    \ style Ubuntu | 137 | 126759 |\n| adwaita-icon-theme | default icon of GNOME\
    \ (small) | 1127 | 4848678 |\n| aliserot | GNOME solitaire game collecto | 316\
    \ | 1890864 |\n| albase | ASA driver configuration file | 42 | 195295 |\n\nIf\
    \ we break this down query, we see that it is out as we expect, and it is followed\
    \ by the INNER JOIN statement. The INNER JOIN is optional as an inner join is\
    \ the default. After the INNER JOIN we have to specify the relationship on which\
    \ the join is based. In this example, we are looking for matching instances of\
    \ the package_name in both tables. Any expression we use to convey the table relation,\
    \ provided that the result of the expression is true or false.\n\nSince package_name\
    \ is a column in both the Package_Descriptions and Package_Stats tables, we must\
    \ precede it with the name of the respective table to avoid ambiguity."
