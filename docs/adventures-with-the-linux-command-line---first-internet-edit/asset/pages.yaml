  md: "```\nreturn expression\n}\n```\n\nWe use the keyword function followed by the\
    \ name of the function to be defined. The name must be immediately followed by\
    \ the opening parenthesis of the parameter list. The parameter list may contain\
    \ zero or more comma-separated parameters. A brace delimited block follows one\
    \ or more statements. To specify what is returned by the function, the return\
    \ statement is used, followed by an expression containing the value to be returned.\
    \ If we were to convert our previous dice rolling into a function, it would look\
    \ like this:\n\n```\nfunction dice_roll() {\n    return int(6 * rand()) + 1\n\
    }\n```\n\nFurther, if we wanted to generalize our function to support different\
    \ possible maximum values, we could code this:\n\n```\nfunction rand_integer(max)\
    \ {\n    return int(max * rand()) + 1\n}\n```\n\nand then dice_roll() to make\
    \ use of our generalized function:\n\n```\nfunction dice_roll() {\n    return\
    \ rand_integer(6)\n}\n```\n\n# Passing Parameters to Functions\n\nAs we saw in\
    \ the example above, we pass parameters to the function, and they are operated\
    \ upon the body of the function. Parameters fall into two general classes. First,\
    \ there are the scalar variables, such as strings and numbers. Second are the\
    \ arrays. This distinction is important in AWK because of the way that parameters\
    \ are passed to functions. Scalar variables are passed by value, meaning a copy\
    \ of the variable is created and given to the function. This means that scalar\
    \ variables act as local variables within the function and are destroyed once\
    \ the function exits. Arrays, on the other hand, are passed by reference meaning\
    \ that a pointer to the array's starting position in memory is passed to the function.\
    \ This means that the array is not treated as a local variable and that any change\
    \ made to the array persists once the program exits. This concept of passed by\
    \ value versus passed shows up in a lot of programming languages so it's important\
    \ to understand it.\n\n# Local Variables\n\nOne interesting limit of AWK is that\
    \ we cannot declare local variables within the body of a function. There is a\
    \ workaround for this problem. We can add variables to the parameter list. Since\
    \ all scalar variables in the parameter list are passed by value, they will be\
    \ treated as if they are local variables. This does not apply to arrays, since\
    \ they are always passed by reference. Unlike many other languages, AWK does not\
    \ enforce the parameter list, thus we can add parameters that are not used by\
    \ the caller of the function.\n\n110 AWK"
  merge: -1
