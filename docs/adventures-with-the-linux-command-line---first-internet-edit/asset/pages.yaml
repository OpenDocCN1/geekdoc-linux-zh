- pgno: 160
  md: '# Suffix Aliases


    What''s more, we can define aliases to act like an “open with...” by defining
    a suffix alias. For example, we can define an alias that says all files end with
    “.txt” should be viewed with:


    ```

    me@linuxbox ~ alias -s txt=''less''

    ```


    Then we just type the name of a text file, and it will be opened by the application
    specified by the aliases:


    ```

    me@linuxbox ~ dir-list.txt

    ```


    How cool is that?


    # Improved History Search


    zsh adds a neat trick to history searching. bash (and zsh too) we can perform
    a reverse incremental history search by typing Ctrl-r, and each subsequent keystroke
    will refine the search. zsh gets one better by simply typing a few letters of
    the desired search string on the command line and press up-arrow. It moves back
    through the history to find the first match, and each time we press the up-arrow,
    the next match is displayed.


    # Environment Variable Editing


    zsh provides a builtin called varied for editing shell variables. For example,
    if we wanted to make a quick change to our PATH variable we can do this:


    ```

    me@linuxbox ~ $ varied PATH

    ```


    and the contents of the PATH variable appear in the command editor, so we can
    make a change and press Enter and the change takes effect.


    # Frameworks


    We have only touched a few of the features available in zsh. It has a lot. But
    with a large set touches complexity, and configuring zsh to take advantage of
    its full potential can be daunting. Her, man page is only a table of contents
    to the other 10+ pages that cover various topics. Fortunately, communities have
    sprung up to provide frameworks that supply ready-to-use configurations and add-ons
    for zsh. By far, the most popular of these is Oh-My-Zsh, a project led by Robby
    Russell.


    Oh-My-Zsh is a large collection of configuration files, aliases, and themes. It
    offers support for tailoring zsh for many types of common tasks, particularly
    software development and system administration.'
  merge: -1
  img_proc: true
- pgno: 161
  md: "# Changing to Another Shell\n\nNow that we have learned a little about the\
    \ different shells available for Linux, how can we experiment with them? First,\
    \ we can simply enter the name of the shell from our bash prompt. This will launch\
    \ the second shell as a child process of bash:\n\n```\nme@linuxbox ~ $ tschn%\n\
    ```\n\nHere we have launched tsch from the bash prompt and are presented with\
    \ the default tsch prompt, a percent sign. Since we have not created any setup\
    \ files for the new shell, we get a few bare-bones environment. Each shell has\
    \ its own configuration file(s) for interactive use as bash has .bashrc file to\
    \ configure its interactive sessions.\n\nHere is a table that lists the configuration\
    \ files for the shells when used as an interactive (i.e., not a login):\n\n| Shell\
    \ | Configuration File(s) |\n| --- | --- |\n| dash | User-defined by setting the\
    \ ENV variable in ~/.profile |\n| bash | ~/.bashrc |\n| ksh | ~/.kshrc |\n| tsch\
    \ | ~/.tchrc |\n| zsh | ~/.zshrc |\n\n# Interactive shell configuration files\n\
    \nWe need to consult the respective shell's man page (always a fun!) to see the\
    \ complete list of features. Most shells also include additional documentation\
    \ and example configuration files in the /usr/share/doc directory.\n\nTo exit\
    \ our temporary shell, we simply enter the exit command:\n\n```\n% exit\nme@linuxbox\
    \ ~ $\n```\n\nOnce we are done with our experimentation and configuration, we\
    \ can change the default shell from bash to our new shell by using the chsh command.\
    \ For example, to change from bash to zsh, we could do:\n\n```\nme@linuxbox ~\
    \ $ tsch\npassword:\nChanging the login shell for me\nEnter the new value, or\
    \ press ENTER for the default\n  Login Shell [/bin/bash]: /usr/bin/zsh\n$\n```\n\
    \nWe are prompted for our password and then prompted for the name of the new shell\
    \ whose name must appear in the /etc/shells file. This is a safety precaution\
    \ to prevent an invalid name from being specified and thus preventing us from\
    \ logging in again. That would be bad.\n\n# Other Shells"
  merge: -1
  img_proc: true
- pgno: 162
  md: '# Summing Up


    Because of the growing popularity of Linux among Unix-like operating systems,
    bash has become the world’s predominant shell program. It has many of the best
    features of earlier shells and a few tricks of its. However, light weight and
    quick script execution is needed (for example, in embedded systems), dash is a
    good choice. Likewise, if working with other Unix systems is required, ksh or
    tsh will provide the necessary compatibility. For the adventurous among us, the
    advanced interactive features of zsh can enhance our day-to-day shell experience.


    # Further Reading


    Shells and their history:


    +   A history of Unix shells from IBM Developer Works:

    https://developer.ibm.com/tutorials/l-linux-shells/


    +   A comparison of bash and tsch syntax by Joe Linoff: http://joelinoff.com/blog/page_id=235


    +   Tom Christensen’s “Csh Programming Considered Harmful” explains the many ways
    that csh bugs out when scripting:

