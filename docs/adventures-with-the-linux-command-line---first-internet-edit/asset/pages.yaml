    # Coding Practices


    In order to achieve our goal of writing robust, easily maintained scripts, our
    coding

    standard recommends the following coding practices.


    # Commenting


    Good commenting is vital for script maintenance. The purpose of commenting is
    to

    explain vital facts about a program. If a script is to have any durability, we
    must

    anticipate that someone (even if it''s just the author) will revisit the script
    at a later date

    and need a refresher on how the script works. Do not comment code that is obvious\and
    easily understood; rather, explain the difficult to understand parts. Rule of
    thumb: the

    more time you spend a chunk of code to design and write, the more the commenting
    will likely

    need to explain.


    Function libraries are a special case. Each function in a library should be preceded
    by a

    comment block that documents its purpose and its positional parameters.


    A common type of comment points where future additions and changes are needed.

    These are called "todo" comments and are typically written like this:


    ```

    # TODO Fix this routine so it can do this better

    ```


    These comments begin with the string TODO so they can be found easily using a
    text

    editor''s search feature.


    # Shell Builtins vs. External Programs


    Where possible, use bash builtins rather than external commands. For example,
    the

    basename and dirname programs can be replaced by parameter expansions to strip

    leading or trailing strings from pathname. Compared to external programs, shell
    builtins

    use fewer resources and execute much faster.


    # Variable Expansion and Quoting


    ```

    a="$var"

    ```


    202 Coding Standards Part 1: Our Own'
