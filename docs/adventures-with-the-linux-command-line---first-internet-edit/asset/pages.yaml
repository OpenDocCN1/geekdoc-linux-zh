- pgno: 107
  md: '# NF - Number of fields


    This variable updates each time a record is read. We can easily access the last
    field in the record by referring to $NF.


    # NR - Record number


    This variable increments each time a record is read, thus it contains the total
    number of records from the input stream. Using this variable, we could easily
    simulate a wc -l command with:


    ```

    awk ''END (print NR)''

    ```


    or number the lines in a file with:


    ```

    awk ''{print NR, $0}''

    ```


    # OFS - Output field separator


    This string is used to separate fields when printing output. The default is a
    single space. This setting can be changed by reformatting data. For example, we
    could easily change a table of values to a CSV (comma separated values) by setting
    OFS to equal ",". To demonstrate, here is a program that reads our directory listing
    and outputs a CSV stream:


    ```

    ls -l | awk ''BEGIN OFS = ","

    NF = 9 (print $1,$2,$3,$4,$5,$6,$7,$8,$9)''

    ```


    We set the pattern to match input lines containing 9 fields. This eliminates symbolic
    links and other weird field names from the data to be processed.


    Each line of the resulting output would resemble this:


    ```

    -rwxr-xr-x,1,root,root,100984,Jan,11,2015,a2p

    ```


    If we had omitted OFS, the print statement would use the default value (a single
    space):


    ```

    ls -l | awk ''NF = 9 (print $1,$2,$3,$4,$5,$6,$7,$8,$9)''

    ```


    Which result in each line of output resembling this:


    ```

    -rwxr-xr-x 1  root  root 100984 Jan 11 2015 a2p

    ```


    # ORS - Output record separator


    This string is used to separate records when printing output. The default is a
    newline character. We could use this variable to easily double-space a file by
    setting ORS to equal two newlines:


    ```

    ls -l | awk ''BEGIN {ORS = "\n\n" {print}''

    ```


    98 AWK'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# RS - Record separator


    When reading input, AWK interprets this string as the end of record marker. The
    default value is a newline.


    # FILENAME


    If AWK is reading its input from a file specified on the command line, then this
    variable contains the name of the file.


    # FNR - File record number


    When reading input from a file specified on the command line, AWK sets this variable
    to the number of the record read from that file.


    # Arrays


    Single-dimensional arrays are supported in AWK. Data contained in array elements
    may be either numbers or strings. Array indexes may also be either strings (for
    associative arrays) or numbers.


    Assigning values to array elements is done like this:


    | a[1] = 5 | # Numeric index |

    | a("five") = 5 | # String index |


    Though AWK only supports single dimension arrays (like bash), it provides a mechanism
    to simulate multi-dimensional arrays. When assigning an array index, it is possible
    to use this form to represent more than one dimension:


    ```

    a[j,k] = "foo"

    ```


    When AWK sees this construct, it builds an index consisting of the strings j and
    k separated by the contents of the built-in variable SUBSEP. By default, SUBSEP
    is set to "034" (character 34 octal, 28 decimal). This ASCII control code is fairly
    obscure and unlikely to appear in ordinary text, so it is perfectly safe for use
    in AWK.


    Note that both awk and gawk implement language extensions to support multi-dimensional
    arrays in a formal way. Consult their respective documentation for details. If
    a portability is needed, use the method rather than the implementation-


    We can delete arrays and array elements this way:


    | delete[i] # delete a single element |

    | delete a # delete array a |


    # Arithmetic and Logical Expressions


    AWK supports a pretty complete set of arithmetic and logical operators:'
