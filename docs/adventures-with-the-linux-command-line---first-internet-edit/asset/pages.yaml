  md: 'early days weren''t any firm standards, and partly commercial. Each database
    vendor wanted to make it hard for customers to migrate to competing products so
    each vendor added unique extensions and features to the language to promote the
    dreaded “vendor lock-in” for their product. SQLite supports most of standard SQL
    (but not all of it) and it adds a few unique features.


    # Creating and Deleting Tables


    The first 2 lines of our SQL stream deletes any existing table named `Package_Descriptions`
    and creates a new table with that name. The `DROP TABLE` statement deletes a table.
    The optional `IF EXISTS` clause is used to prevent errors if the table does not
    already exist. There are a lot of optional clauses in SQL. The `CREATE TABLE`
    statement defines a new table. As we can see, this will have 2 columns. The first
    column, `package_name` is defined as a variable string up to 60 characters long.
    `VARCHAR` Text strings Here are some of the common data types supported by SQL
    databases:


    | Data Type | Description |

    | --- | --- |

    | INTEGER | Integer |

    | CHAR(n) | Fixed length string |

    | VARCHAR(n) | Variable length string |

    | NUMERIC | Decimal numbers |

    | REAL | Floating point numbers |

    | DATETIME | Date and time values |


    Common SQL data types


    # Data Types


    SQL databases support many types of data. Unfortunately, this varies by vendor.
    Even in cases where two databases share the same data type name, the actual meaning
    of the data type can differ. Data types in SQLite are dynamically typed. While
    other SQL databases, SQLite are not rigidly fixed. Values in SQLite allows many
    of the common data types found in other databases to be specified, it actually
    only supports 4 general types of data storage.


    | Data Type | Description |

    | --- | --- |

    | INTEGER | Signed integers using 1, 2, 3, 4, 6, or 8 as needed |

    | REAL | 8-byte IEEE floating point numbers |

    | TEXT | Text strings |

    | BLOB | Binary large objects (for example JPEG, or MP3 files) |


    SQLite data types


    In our example above, we specified `VARCHAR` as the data type for our columns.
    SQLite is perfectly happy with this, but it actually stores the values in these
    columns as just `TEXT`. It ignores the length restrictions in the data type specification.
    SQLite is extremely


