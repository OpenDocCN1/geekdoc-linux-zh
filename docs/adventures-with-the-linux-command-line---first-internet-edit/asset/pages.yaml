    # byobu


    byobu (pronounced "BEE-oh-boo") from the Japanese word for "a folding, decorative,
    multi-panel screen" is not a terminal multiplexer se, but rather, it is a wrapper
    around either GNU screen or tmux (the default is tmux). It aims to create a simplified
    user interface with an emphasis on presenting useful system information on the
    status bar.


    # Availability


    byobu was originally developed by Canonical employee Dustin Kirkland, and as such
    is usually found in Ubuntu and other Debian-based distributions. Recent versions
    are more portable than the initial release, and it is beginning to appear in a
    wider range of distributions. It is distributed as the package "byobu".


    # Invocation


    byobu can be launched simply by entering the command byobu followed optionally
    by any options and commands to be passed to the backend terminal multiplexer (i.e.,
    tmux or screen). For this adventure, we will confines our discussion to the tmux
    backend as it supports a larger feature set.'
