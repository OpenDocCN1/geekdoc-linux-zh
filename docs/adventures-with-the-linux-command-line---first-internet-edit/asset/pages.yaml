    The loop in AWK closely resembles the one in the C programming language. The first
    expression is usually used to initialize a counter variable, the second defines
    when the loop is completed, and the third defines how the loop is incremented
    or advanced at each iteration. Here is a demonstration using a loop to print fields
    in reverse order:


    ```

    ls -l | awk ''{s=""; for (i=NF; i>0; i--) s=$i OFS; print s}''

    ```


    In this example we create an empty string s, then begin a loop that starts with
    the number of fields in the current input line (i=NF) and counts down (--) until
    we reach the first field (i>0). Each iteration of the loop counts the current
    field and the output separator to be concatenated to the string s (s = s OFS).
    After the loop concludes, we print the resulting value of string s.


