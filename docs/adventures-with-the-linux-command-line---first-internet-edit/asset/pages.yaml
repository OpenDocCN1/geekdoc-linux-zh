    \ FROM Package_Descriptions WHERE package_name = 'sqlite3';\npackage_name description\
    \ size ----\n\nsqlite3 Command line interface for SQLite 3 5 2396948\n\nSQL provides\
    \ another ALTER TABLE statement for deleting columns from a table. It has the\
    \ following form:\n\n```\nALTER TABLE table_name DROP COLUMN column_name;\n```\n\
    \nUnfortunately, SQLite does not support this so we have to do the hard way. This\
    \ is accomplished in four steps:\n\n+   1. Create a temporary table with the desired\
    \ schema.\n2. Copy the columns we want to keep into the temporary table.\n3. Drop\
    \ the original table.\n4. Rename the temporary table.\n\nHere is a file drop_column.sql\
    \ that does the job.\n\n```\n-- drop_column.sql\n\n-- Remove extra columns from\
    \ Package_Descriptions\n\nBEGIN TRANSACTION;\n\n-- Create new table with temporary\
    \ name\n\nDROP TABLE IF EXISTS temp;\nCREATE TABLE temp (\n  package_name VARCHAR(60),\n\
    \  description VARCHAR(120));\n\n-- Copy columns we want into new table\n\nINSERT\
    \ INTO temp\n  (package_name, description)\nSELECT package_name, description\n\
    FROM Package_Descriptions);\n\n-- Get rid of old table and rename the new replacement\
    \ table\n\nDROP TABLE Package_Descriptions;\n\nALTER TABLE temp RENAME TO Package_Descriptions;\n\
    ```\n\nCOMMIT;\nWe again use the alternate form of the INSERT statement for copying\
    \ values from one table to another. We copy the package_name and description columns\
    \ from the Package_Descriptions table to the correspondingly named columns in\
    \ the temp table.\n\n# 236 SQL"
