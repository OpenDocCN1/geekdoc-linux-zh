- pgno: 40
  md: 'GNU screen has several commands for switching from one window to another. Like
    the “previous” command, there is a “next” command Ctrl-a n. Windows are numbered,
    starting with 0, and may be chosen directly by typing Ctrl-a followed by a numeral
    from 0 to 9. It is also possible list all the windows by typing Ctrl-a k. This
    command will display a list of windows, where we can choose a window.


    | Name | Flags |

    |---|---|

    | 0 bash | |

    | 1 bash | S |


    ![](img/9aafc495f4afbc0a97de2b31a0d13f46_40_0.png)


    Screen window list


    As we can see, windows have names. The default name for a window is the name of
    the program it was running at the time of its creation, hence both of our windows
    are named “bash”. Let’s change that. Since we are running top in our first window,
    let’s make its name reflect gracefully. Switch to the first window using any of
    the methods we have discussed, and type the command Ctrl-a A and we will be prompted
    for a window name. Simple.


    Okay, so we have created windows, how do we destroy them? A window is destroyed
    whenever we terminate the program running in it. After all windows are destroyed,
    screen itself will terminate. Since both of our windows are running bash, we need
    only exit each respective shell to end our screen session. In the case of a program
    that refuses to terminate gracefully, Ctrl-a k will do the trick.


    Let’s terminate the shell running top by q to exit top and then enter exit to
    terminate bash, destroying the first window. We are now taken to the remaining
    window still running its own copy of bash. We can confirm this by typing Ctrl-a
    k to view the window list again.


    Terminal Multiplexers 31'
  merge: -1
