    \ one:\n\n```\nerror_exit() {\n    local error_message=\"$1\"\n    printf \"%s\\\
    n\" \"${PRAGONAME}:${error_message}-Unknown Error\"\" >&2\n    exit 1\n}\n```\n\
    \nWe can call the error message function to report an error like this:\n\n```\n\
    command || error_exit \"command failed in line $LINENO\"\n```\n\nThe shell variable\
    \ LINENO is included in the error message passed to the function. This will contain\
    \ the line number where the error occurred.\n\n+   4. Clean up the mess. When\
