- pgno: 185
  md: 'After executing this command, pressing the q key in normal mode will cause
    the normal mode sequence gqip to be performed.


    The nnoremap command is one of the noremap commands, the safe version of map command.
    The members of this family include:


    | | |

    |---||

    | noremap | Map key regardless of mode

    | nnoremap | Map normal mode key

    | inoremap | Map insert mode key

    | cnoremap | Map command mode key |


    Most of the time we will be remapping normal mode keys, the nnoremap command will
    be the most often used. Here is another example:


    ```

    :nnoremap S:split<Return>

    ```


    This command maps the s key to enter command mode, the split command and a carriage
    return. The "<Return>" is called a key notation. For non-printable characters,
    vim has a representation that can be used to indicate the key when specifying
    mapping. To see the entire list of possible codes, enter:


    ```

    :h key-notation

    ```


    So do we know which keys are available for remapping assignment? As vim almost
    ever every key for something, we have to make a judgment call as to what native
    functionality we are willing to give up to get the mapping we want. In the case
    of the Q key, which we used in our first example, it is normally used to invoke
    mode, a rarely used feature. There are many such cases in vim; we just have to
    be selective. It is best to check the first key by doing something like:


    ```

    :h Q

    ```


    to see how a key is being used before we apply our own mapping.


    To make mappings permanent, we can add these mapping commands to our .vimrc file:


    ```

    nnoremap Q ggip

    noremap S :split<Return>

    ```


    Help topics: :map key-notation


    # Snippets


    Mapping is not restricted to single characters. We can use sequences too. This
    is often helpful when we want to create a name of easily remembered, related commands
    of our own design. For example, inserting boilerplate text into a document. If
    we had a collection of these snippets, we might want to uniquely name them but
    have a common structure for the name for easily recollection.


    We added the GPL notice to the comment block at the beginning of our script. As
    this is rather tedious to type, and we might want to use it again, it makes a
    good candidate for being a snippet.


    176 Vim, with Vigor'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'To do this, we''ll first go out to the shell and create a directory to store
    our snippet text files. It doesn''t matter where we put the snippet files, but
    in the interest of keeping all the vim stuff together, we''ll put them with our
    other vim-related files.


    ```

    :sh

    me@linux~$ mkdir ~/.vim/snippets

    me@linux~$ exit

    ```


    Next, we''ll copy the license by highlighting the text in visual mode and yanking
    it. To create the snippet file, we''ll open a new buffer:


    ```

    :e ~/.vim/snippets/gpl.sh

    ```


    Thus creating a new file called gpl.sh. Finally, we''ll paste the copied text
    into our new file and save it:


    ```

    :w

    ```


    Now that we have our snippet file in place, we are ready to define our mapping:


    ```

    :nnoremap ,GPL : r ~/.vim/snippets/gpl.sh<Return>

    ```


    We map "GPL," to a command that will cause vim to read the snippet file in the
    current buffer. The leading command is used as a leader character. The comma is
    a rarely used command that is usually safe to remap. Using a leader character
    will reduce the number of actual vim commands we remap if we create a lot of snippets.


    As we add mappings, it''s useful to know what they all are. To display a list
    of mappings, we use :map command followed by no arguments:


    ```

    :map

    ```


    Once we are satisfied with our mapping, we can add it to one of our vim configuration
    files. If we want it to be global (that is, applies to all types of files), we
    could put it in our .vimrc file like this:


    ```

    nnoremap ,GPL : r ~/.vim/snippets/gpl.sh<Return>

    ```


    If, on the other hand, we want it to be specific to a particular file type, we
    would put it in the appropriate file like ~/.vim/ftplugin/sh.vim like this:


    ```

    nnoremap <buffer>,GPL : r ~/.vim/snippets/gpl.sh<Return>

    ```


    In this case, we add the special argument <buffer> to make the mapping local to
    the current buffer containing the particular file type.


    Help topics: :map <buffer>


    # Finishing Our Script


    With all that we have learned so far, it should be pretty easy to go ahead and
    finish our script:


    ```

    #! /bin/bash

    ```


    Vim, with Vigor 177'
