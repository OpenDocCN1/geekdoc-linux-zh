- pgno: 55
  md: '# Detaching Sessions


    To detach a session and log off, press the F6 key. To detach without logging off,
    type Shift-F6. To attach, simply enter the byobu command and the previous session
    will be reattached. If more than one session is running, we are prompted to select
    a session. While we are in a session, we use Alt-Up and Alt-Down to move from
    session to session.


    # Customizing byobu


    The local configuration file for byobu is located in either ~/.byobu/tmux.conf
    or ~/.config/byobu/tmux.conf, depending on the distribution. If one doesn''t work,
    try the other. The configuration details are the same as for tmux.


    # Summing Up


    We have seen how a terminal multiplexer can enhance our command-line experience
    by providing multiple windows and sessions, as well as multiple regions on a single
    terminal display. So, which one to choose? GNU screen has the benefit of being
    almost universally available, which is now considered as obsolete. tmux is modern
    and well supported by active development. byobu builds on the success of tmux
    with a simplified user interface, but if we rely on applications that need access
    to the keyboard function keys, byobu becomes quite tedious. Fortunately, Linux
    distributions make all three available, it''s easy to try them all and see which
    one satisfies the needs at hand.


    # Further Reading


    The man pages for screen and tmux are richly detailed. Worth reading. The man
    page for byobu is somewhat simpler.


    # GNU Screen


    +   - Official site: https://www.gnu.org/software/screen/

    - A helpful entry in the Arch Wiki: https://wiki.archlinux.org/index.php/GNU_Screen

    - A Google search for "screenrc" yields many sample .screenrc files

    - Also look for sample files in /usr/share/doc/screen/examples


    # tmux


    +   - Official site: https://www.gigastudio.com.ua

    - The tmux FAQ: https://github.com/tmux/tmux/wiki/FAQ

    - A helpful entry in the Arch Wiki: https://wiki.archlinux.org/index.php/tmux

    - A Google search for "tmux.conf" yields many sample .tmux.conf files

    - Also look for sample files in /usr/share/doc/tmux/examples


    46 Terminal Multiplexers'
