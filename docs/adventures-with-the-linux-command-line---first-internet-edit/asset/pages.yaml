    \ of tab completion are supported by zsh. These include command names, command\
    \ options, and arguments.\n\nWhen using the cd command, repeatedly pressing the\
    \ tab key first displays a list of the available directories, then begins to cycle\
    \ through them. For example:\n\n```\nme@linux ~ $ cd <tab>\n```\n\n```\nme@linux\
    \ ~ $ cd <tab>\nDocuments/ Downloads/ Music/ Pictures/ Public/\nDesktop/ Videos/\n\
    me@linux ~ $ cd Desktop/<tab>\nDocuments/ Downloads/ Music/ Pictures/ Public/\n\
    Templates/ Videos/\nme@linux ~ $ cd Documents/\nDocuments/ Downloads/ Music/ Pictures/\
    \ Public/\nTemplates/ Videos/\n```\n\nzsh can be configured to display a highlighted\
    \ selector on the list of directories, and one can use the arrow keys to directly\
    \ highlight the entry in the list to select it.\n\nWe can also switch directories\
    \ by replacing one part of a path name with another:\n\n```\nme@linux ~ $ cd /usr/local/share\n\
    ```\n\n# 148 Other Shells"
