    # xterm with default configuration


    In its default configuration, xterm looks rather small and pathetic, but almost
    everything about xterm is configurable. When we say "configurable," we don''t
    mean there there is a pretty "Preferences" dialog. This is Unix! Like many early
    X applications, it relies on an XResources file for its configuration. This file
    can be either global (/etc/X11/XResources) or local to the user (~/.XResources).
    Each item in this file consists of an application class and a setting. If we create
    the file ~/.XResources with the following content:


    ```

    XTerm.vt100.geometry: 8x35

    XTerm.vt100.faceName: Liberation Mono:size=11

    XTerm.vt100.cursorBlink: true

    ```


