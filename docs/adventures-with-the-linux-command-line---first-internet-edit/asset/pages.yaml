    \ DROP INDEX idx_package_name;\nsqlite> DROP INDEX idx_tot_size;\n```\n\n# Triggers\
    \ and Stored Procedures\n\nAs we early during our discussion of views, SQL allow\
    \ us to store SQL code in the database. Besides views, SQL provides for two other\
    \ ways of storing code. These two methods are stored procedures and triggers.\
    \ Stored procedures, as the name implies, allows a block of SQL statements to\
    \ be stored and treated as a variable available to other programs, or for use\
    \ ad hoc interactions with the database. Creating a stored procedure, for use\
    \ with syntax:\n\n240 SQL"
