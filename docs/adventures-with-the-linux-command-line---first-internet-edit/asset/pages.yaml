- pgno: 164
  md: '# 10 Vim, with Vigor


    TLCL Chapter 12 taught us the basic skills necessary to use the vim editor. However,
    we barely scratched the surface of its capabilities. Vim is a very powerful program.
    In fact, it''s safe to say that vim can do anything. It''s just a question of
    figuring out how. In this adventure, we will acquire an intermediate level of
    skill in this popular tool. In particular, we will look at ways to improve our
    productivity writing shell programs, configuration files, and documentation. Even
    better, after we get the hang of some of these additional features, using vim
    is actually fun.


    In this adventure, we will look at some of the features that make vim popular
    among developers and administrators. The community supporting vim is large and
    vigorous. Because vim is extremely rich in features and scriptable, there are
    many plugins and addons available. However, we are going to restrict ourselves
    to stock vim and that normally ship with it.


    A note about nomenclature: In TLCL we used the terms "command", "insert", and
    "ex" to identify the three primary modes of vim. We did this to match the traditional
    modes of vim''s ancestor. Since this is an all-vim adventure, we will switch to
    the names used in the documentation which are *normal*, *insert*, and *command*.


    # Let''s Get Started


    First, we need to be sure we are running the full version of vim. Many distributions
    only ship with an abbreviated version. To get the full version, install the "vim"
    package if it''s not already installed. This is also a good time to add an alias
    to the .bashrc file to make "vi" run vim (some distributions linking ''vi'' to
    ''vim'', so this might not be needed).


    Next, let''s create a minimal .vimrc, its configuration file.


    ```

    alias vi=''vim''

    [me@linuxbox ~]$ vi ~/.vimrc

    ```


    Edit the file so it contains two lines:


    ```

    set compatible

    filetype plugin on

    ```


    This will ensure that vim is not restricted to the vi feature set, and load a
    standard plugin that lets vim recognize different file types. After inserting
    the two lines of text, return to normal mode and (just for fun) type ''m'' followed
    by uppercase ''V''.


    ```

    mV

    ```


    Nothing will appear to happen, and that''s OK. We''ll come back to that later.
    Save the file and exit vim.


    ```

    :wq

    ```'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# # Getting Help


    Vim has an extensive built-in help system. If we want vim:


    ```

    [me@linuxbox ~]$ vi

    ```


    and enter the command:


    ```

    :help

    ```


    It will appear at the top of the display.


    ![](img/9aafc495f4afbc0a97de2b31a0d13f46_165_0.png)


    Vim help window


    Though is extensive and very useful, it immediately presents a problem because
    it creates a split in the display. This is a rather advanced feature that needs
    some explanation.


    Vim can divide the display into multiple panes, which in vim parlance are called
    windows. These are very useful when working with multiple files and other vim
    features as help. When help is displayed this way, we can toggle the windows by
    typing Ctrl-w twice. We can manipulate vim windows with the following commands:


    ```

    :split      Create a new window

    Ctrl-w Ctrl-w Toggle between windows

    Ctrl-w       Enlarge the active window

    Ctrl-w =    Make the windows the same size

    :close      Close active window

    :only       Close all other windows

    ```


    156 Vim, with Vigor'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'When working with files, it''s important to note that "closing" a window (with
    either q :close) does not remove the buffer containing the window''s content;
    we can recall it at any time. However, when we close the final window, vim terminates.


    To exit, make sure the cursor is in the help window and enter the quit command.


    ```

    :q

    ```


    But enough about windows, let''s get back to help. If we scroll around the initial
    help file, we see it a hypertext document full of links to various topics and
    it begins with the commands we need to navigate the help system. This is all well
    and good, but it''s not the most interesting way to use.


    The best way is to type :h followed by the topic we are interested in. The fact
    we don''t have to type out "help" reveals that most commands can be abbreviated.
    This saves a lot of work. Frequently used commands, like help, can be shortened
    to their smallest non-ambiguous form. are often shortened to a single character
    but the system of abbreviations is unpredictable, so we have to use help to find
    them. For the remainder of this adventure, we will try to use the shortest available
    form.


    There is an important table near the beginning of the initial help file:


    | WHAT | PREPEND | EXAMPLE |

    | Normal mode command | (nothing) | :help x |

    | Visual mode command | v | :help v_u |

    | Insert mode command | i | :help i <Esc> |

    | Command-line command | : | :help :quit |

    | Command-line editing | c | :help c <Del> |

    | Vim command argument | | :help r |

    | Option | | :help filepath |


    Search for help: Type ":help word", then hit CTRL-D to see matching help entries
    for "word".


    This table describes how we ask for help in particular contexts. With the normal
    mode ''i'' which invokes insert mode. We''re familiar with the case of such a
    command, we simply type:


    ```

    :h i

    ```


    to display its help page. For command commands, we precede the command with '':'',
    for example:


    ```

    :h :q

    ```


    gets help with the :quit command.


    There are other contexts for modes we have yet to cover. We''ll get to those in
    a little bit.


    As we go along, free to use help to learn more about the commands we discuss.
    As this adventure goes on, the text will include help topics to explore.'
