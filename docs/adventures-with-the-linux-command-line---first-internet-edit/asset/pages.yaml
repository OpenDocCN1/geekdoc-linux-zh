    # Marks and File Marks


    We know there are various ways of moving around document in vim. For example,
    to get to the top, we can type:


    ```

    gg

    ```


    To go to the bottom we can type:


    ```

    G

    ```


    Vim (and real vi for matter) also allows us to mark an arbitrary location within
    a document that we can recall at will. To demonstrate this, go to the top of the
    script and type:


    ```

    ma

    ```


    Next, go to the bottom of the document and type:


    ```

    mb

    ```


    We have just set two marks, the first called “a” and the second called “b”. To
    recall a mark, we precede the name of the mark with the '' character, like so
    and we are taken to the top of the file again:


    ```

    ''a

    ```'
