- pgno: 64
  md: "generally available for others. To check for the package, examine the /etc/bash-completion.d\
    \ directory. If it exists, the package is installed.\n\nThe bash-completion package\
    \ adds support for many command line programs, allowing us to perform completion\
    \ on both command options and arguments. The ls command is a good example. If\
    \ we type \"ls -\" then the Tab key of commands, we will see a list of possible\
    \ options to the command:\n\n```\nme@linux: ~$ ls      --ignore=\n  --all    \
    \             --ignore-backups\n  --all-all             --indicator-style=\n \
    \ --author              --inode\n  --block-size=         --literal\n  --classify\
    \            --no-group\n  --color               --numeric-guid\n  --context \
    \            --quote-name\n  --dereference         --quoting-style=\n  --dereference-command-line\
    \ --recursive\n  --dereference-command-line-symlink-to-dir --reverse\n  --directory\
    \           --show-control-chars\n  --dired               --size\n  --escape \
    \             --sort\n  --file-type           --sort=\n  --format            \
    \  --tabsize=\n  --group-directories-first --time=\n  --help                --time-style=\n\
    \  --hide                --version\n  --hide-control-chars --width=\n--human-readable\n\
    ```\n\nAn option can be completed by typing a partial option followed by Tab.\
    \ For example, typing \"ls -ver\" then Tab will complete to \"ls -version\".\n\
    \nThe bash-completion system is interesting in its own right as it is implemented\
    \ by a series of shell scripts that make use of the complete and compgen bash\
    \ builtins. The main body of the work is done by the /etc/bash_completion (or\
    \ /usr/share/bash-completion in newer versions) script along additional scripts\
    \ for individual programs in either the /etc/bash-completion.d directory or the\
    \ /usr/share/bash-completion/completions directory. These scripts are examples\
    \ of advanced scripting technique and worth of study.\n\n# Summing Up\n\nThis\
    \ adventure is a lot to take in and it might not seem all useful at first, but\
    \ as we continue to gain experience and practice with the command line, learning\
    \ these labor-saving tricks will save us a lot of time and effort."
