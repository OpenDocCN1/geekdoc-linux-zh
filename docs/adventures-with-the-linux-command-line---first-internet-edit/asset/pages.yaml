  md: '# 5 tput


    While the command line environment is certainly powerful, it can be somewhat lacking
    when it comes to visual appeal. Our terminals cannot create the rich environment
    of the graphical user interface, but it doesn''t mean we are doomed to always
    look at characters on a plain background.


    In this adventure, we will look at tput, a command used to manipulate our terminal.
    We can change the color of text, apply effects, and generally brighten things
    up. More importantly, we can use tput to improve the human factors of our scripts.
    For example, we can use color and text effects to better present information to
    our users.


    # Availability


    tput is part of the ncurses package and is supplied with most Linux distributions.


    # What it Does/How it Works


    Long ago, when computers were centralized, interactive computer users communicated
    with remote systems using a physical terminal or a terminal emulator program running
    on some other system. In their heyday, there were many kinds of terminals and
    all used different sequences of control characters to manage their screens and
    keyboards.


    When we start a terminal session on our Linux system, the terminal emulator sets
    the TERM variable with the name of a terminal type. If we examine TERM, we can
    see this:


    ```

    @linuxbox~$ echo $TERM

    xterm

    ```


    In this example, our terminal type is "xterm" suggesting that our terminal behaves
    like the classic X terminal emulator program xterm. Other common terminal types
    are "linux" for the console, and "screen" used by multiplexers like screen and
    tmux. While we will encounter these 3 types most often, there are in fact, thousands
    of different types. Our Linux system contains a database called term that describes
    them. We can examine a terminal type using the infocmp followed by a terminal
    name:


    ```

    @linuxbox~$ infocmp

    # Reconstructed via infocmp from file: /lib/terminfo/s/screen

    VT100/ANSI X64 virtual terminal,

    am, km, mir, msgr, xeni

    colors#8,lines#24,pairs#6,

    asc++=..*afgaghijkjllmnnooppqqrssttuuvwwwxxxyz({|})~

    bel=G; blink=\[5m,bold=\[25m,cbit=\E[2J,civis=\E[225,

    clr=\E[H]\E[J,cnorm=\E[34h]\E[25h,cr=M;

    cr=\E[1%p1dB,tr=\E[1plnd,ncub=-H;

    cud=\E[1%p1dB,cud=-J,cup=\E[1%p1DC,cup=\E[C,

    c=\E[1%p1d$p2dH,cuu=\E[1%p1da,cuu=\EM,

    ```'
