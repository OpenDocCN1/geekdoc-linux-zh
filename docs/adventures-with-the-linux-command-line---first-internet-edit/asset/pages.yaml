    # # Limitations


    While it''s true that dialog can produce many kinds of dialog boxes, care must
    be taken to remember that dialog has significant limitations. Some of the dialog
    boxes have other behavior compared to their traditional GUI counterparts. For
    example, the edit box used to edit text files cannot perform cut and paste and
    files to be edited cannot contain tabs. The behavior of the file box is more akin
    to the shell''s completion feature than to a GUI selector.


    # # Summing Up


    The shell is not really intended for large, interactive programs, but using dialog
    can make small to moderate interactive programs. It provides a useful variety
    of dialog boxes, allowing many types of user interactions which would be very
    difficult to implement with the shell alone. If we keep our expectations modest,
    dialog can be a great tool.


    # # Further Reading


    +   - The dialog page is well-written and contains a complete listing of its numerous
    options.


    +   - dialog normally includes a large set of example programs which can be found
    in the /usr/share/doc/dialog directory.


