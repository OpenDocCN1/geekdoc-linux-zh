  md: '```

    me@linux share $ cd bin

    me@linux bin $ pwd

    /usr/local/bin

    ```


    Pathnames can be abbreviated as long as they are unambiguous. If we type:


    ```

    me@linux ~ $ ls /usr/share<tab>

    ```


    zsh will expand it into:


    ```

    me@linux ~ $ ls /usr/local/share/

    ```


    That can save a lot of typing! Arguments are provided for many commands. To invoke
    this feature, we type the command and the leading dash for an option, then hit
    the key:


    ```

    me@linux ~ $ rm <-tab>

    --force ignore nonexistent files, never prompt

    --help display help message and exit

    -i prompt before removal

    -i prompt when removing many files

    --interactive prompt under condition (defaulting to always)

    --preserve-root do not treat / specially

    --one-file-system stay within file systems of given as arguments

    --preserve-root do not remove / (default)

    --recursive -R r remove directories and their contents recursively

    --verbose explain what is being done

    --v output version information and exit

    ```


    This displays a list of options for the command, and like the cd command, repeatedly
    pressing tab zsh to cycle through the options.


    # Pathname Expansion


    The shell provides several powerful additions to pathname expansion that can save
    steps when specifying file command arguments.

    We can use "** to cause recursive expansion. For example, if we wanted to list
    every file ending with .txt in our home directory and subdirectories, we would
    have to do this in bash:


    ```

    me@linux $ find -name "*.txt" | sort

    ```


    In zsh, we could do this:


    ```

    me@linux ~ $ ls *//*.txt

    ```


    and get the same result.

    And if that were not cool enough, we can also add qualifiers to the wildcard to
    perform many of the tests with the find command. For example:


    ```

    me@linux ~ $ **/*.txt(@)

    ```'
  merge: -1
  img_proc: true
- pgno: 159
  md: "will only display the files whose names end in .txt and symbolic links.\n\n\
    There are many supported qualifiers and they may be combined to perform very fine\
    \ grained file selection. Here are some examples:\n\n| Qualifier | Description\
    \ | |\n| --- | --- | |\n| - | Regular files | ls *.txt (.) |\n| / | Directories\
    \ | ls *.txt (/) |\n| @ | Symbolic links | ls *.txt (@) |\n| * | Executable files\
    \ | ls * (*) |\n| F | Non-empty (\"full\") directories | ls * (^F) |\n| ^F | Empty\
    \ directories | ls * (m) |\n| mn | Modified n days ago | ls * (m-5) |\n| m-n |\
    \ Modified less than n days | ls * (m+5) |\n| m+n | Modified more than n days\
    \ | ls * (L0) |\n| L0 | Empty (zero length) file | ls * (LM+5) |\n| LK-n | File\
    \ smaller than n kilobytes | ls * (LK-100) |\n\n# Z pathname expansions\n\n# Global\
    \ Aliases\n\nZ shell provides powerful aliases. With zsh we can define an alias\
    \ in the usual way, such as:\n\n```\nme@linuxbox ~ alias vi=/usr/bin/vim\n```\n\
    \nand it will behave just as it would in bash. But we can also define a global\
    \ alias that can be used at any position on the command line, not just at the\
    \ beginning. For example, we define a commonly used name as an alias:\n\n```\n\
    me@linuxbox ~ alias -g LOG='/var/log/syslog' \n```\n\nand then use it anywhere\
    \ on a command line:\n\n```\nme@linuxbox ~ $ less LOG\n```\n\nThe use of an uppercase\
    \ alias name is not a requirement, it's just a custom to make it easier to see.\
    \ We can also use global aliases to define common redirections:\n\n```\nme@linuxbox\
    \ ~ $ alias -g L='| less \"\n```\n\nor\n\n```\nme@linuxbox ~ $ alias -g W='| wc\
    \ -l'\n```\n\nThen we can do things like this:\n\n```\nme@linuxbox ~ $ cat LOG\
    \ W\n```\n\nto display the number of lines in /var/log/syslog.\n\n# 150 Other\
    \ Shells"
