    # but WITHOUT ANY WARRANTY; without the implied warranty of

    # MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE. See the

    # GNU General Public license at http://www.gnu.org/licenses/\n# more details.


    # Usage: new script [ -h|--help]

    # new script [-q|--quiet] [-s|--root] [script]


    # Revision history:

    # 2024-04-02 Updated to new coding standard (3.5)

    # 2019-05-09 Added support for shell scripting libraries (3.4)

    # 2015-05-14 Minor cleansups by Shellcheck (3.3)

    # 2014-12-21 Minor formatting corrections (3.2)

    # 2014-12-12 Version cleansups (3.1)

    # 2012-05-14 Created


    # Constants


    After the comment block, we define the constants used by the script. As we recall,
    constants are variables that have a fixed value. They are used to define values
    that are used in various locations in the script. Constants simplify script maintenance
    by eliminating hardcoded values scattered throughout the code. By placing this
    section at the top, the script can be made more easily.


    There are two constants that every script should include. First, a constant that
    contains the name of the program, and for example:


    ```

    PROGRAMNAME=$$(0 */)

    ```


    This value is useful for such things as help and error messages. In the example
    above, the name of the program is calculated from the first word on the command
    line that invoked the script ($) with any leading path stripped off. By calculating
    the name of the script file ever, the constant will automatically contain the
    new name.


    The second constant that should be included contains the script''s version number.
    Like the PROGRAMNAME constant, this value is useful in help and error messages.


    ```

    VERSION="3.5"

    ```


    Constants should also be defined for numerical values such as maximum or minimum
    limits used in calculations, as well as for the names of files or directories
    used by, or acted upon, by the script.


