- pgno: 33
  md: 'a menu editing feature found in the "Command" pulldown menu. The entry is called
    "Edit menu file."


    If we select this entry, Midnight Commander offers us a choice of "Local" and
    "User." The Local entry allows us to edit the .mc.menu file in the current directory
    while selecting User will call us to edit the ~/.config/mc/menu file. Note that
    if we select Local and the current directory does not contain a menu file, Midnight
    Commander will copy the default menu file into current directory as a starting
    point for our editing.


    # Menu File Format


    Some parts of the user menu file are pretty simple; other parts, not so much.
    We''ll start with the first parts.


    A menu file consists of one or more entries. Each entry contains:


    +   A single character (usually a letter) that will act as a hot key for the entry
    when the menu is displayed.


    +   Following the hot key, on the same line, is the description of the menu entry
    as it will appear on the menu.


    +   On the following lines are one or more commands to be performed when the menu
    is selected. These are ordinary shell commands. Any number of commands may be
    specified, so sophisticated options are possible. Each command must be indented
    by at least one space or tab.


    +   A blank line to separate one menu entry from the next.


    +   Comments may appear on their own lines. Each comment line starts with a #
    character.


    Here is an example user menu entry that creates an HTML template in the current
    directory:


    ```

    # Create a new HTML file

    H Create a new HTML file

    echo "<html>\n\t<head>"

    echo "\t<body>\n\t</body>"

    echo "</html>" > new_page.html

    ```


    Notice the absence of the -e option on the echo commands used in this example.
    Normally, the -e option is required to interpret the backslash escape sequences
    like \t and \n. The reason they omitted is that Midnight Commander does not use
    bash as the shell when it executes menu commands. It uses sh instead. Different
    distributions use different shell programs to emulate sh . For example, Red-based
    distributions use bash from Debian-based distributions like Ubuntu and Raspberry
    Pi


    24 Midnight Commander'
  merge: -1
  img_proc: true
