- pgno: 250
  md: "```\nCREATE PROCEDURE procedure_name\nAS\n[block of SQL code];\n```\n\nParameters\
    \ can be passed to stored procedures. Here is an example:\n\n```\nCREATE PROCEDURE\
    \ list_pkg_files @package VARCHAR(60)\nAS\nSELECT package_name, file\nFROM package_Files\n\
    WHERE package_name = @package;\n```\n\nTo call this procedure, we would do:\n\n\
    ```\nEXEC list_pkg_files @package = 'bash';\n```\n\nUnfortunately, SQLite does\
    \ not support stored procedures. It does, however, support the second method of\
    \ code storage, triggers.\n\nTriggers are stored blocks of code that are automatically\
    \ called when some event occurs and a specified condition is met. Triggers are\
    \ typically used to perform certain maintenance tasks to keep the database in\
    \ working order.\n\nTriggers can be set to activate, before, or after the execution\
    \ of INSERT, DELETE, or UPDATE statements. In the example below, we will have\
    \ a trigger activate before a DELETE is performed on the Package_Files table.\n\
    \n```\n/*\ntigger_demo.sql\n\nTrigger demo we create a \"trash can\" for the\n\
    Package_Files table and set a trigger to copy rows\nto the PF_Backup table just\
    \ before they are deleted\nfrom Package_Files.\n*/\n\n-- Create backup table with\
    \ the same schema as Package_Files\n\nCREATE TABLE IF NOT EXISTS PF_Backup (\n\
    \    package_name VARCHAR(60),\n    file VARCHAR(120),\n    size_bytes INTEGER\n\
    );\n\n-- Define trigger to copy rows into PF_Backup as they are\n-- deleted from\
    \ Package_Files\n\nCREATE TRIGGER backup_row_before_delete\nBEFORE DELETE ON Package_Files\n\
    BEGIN\n    INSERT INTO PF_Backup\n    VALUES (OLD.package_name, OLD.file, OLD.size_bytes);\n\
    END;\n```\n\nThe first thing we do create is a table to hold our deleted rows.\
    \ We use a slightly different form of the CREATE TABLE statement to create the\
    \ table only if it does not already exist."
  merge: -1
  img_proc: true
- pgno: 251
  md: 'This will ensure that an existing table of saved rows will persist, even if
    we reload the trigger.


    After creating the table, we create a trigger called backup_row_before_delete
    to copy data from the Package_Files to the PF_Backup table just before any row
    in Package_Files is deleted.


    In order to reference data that might be used by the trigger, SQL provides the
    NEW reference for new data that is inserted or updated, and the OLD reference
    for previous data that is updated or deleted. In our example, we use the OLD reference
    to refer to the data about to be deleted.


    # Performing Backups


    Since SQLite uses an ordinary file to store each database (as opposed to the exotic
    methods used by other systems), we can use regular command line tools like cp
    to perform database backups. There is an interesting SQL method we can use, too.
    the .dump command will produce a stream of SQL statements that will reproduce
    the database including tables, views, triggers, etc. To output the database this
    way, we need only the following:


    ```

    sqlite> .dump

    ```


    The stream will appear on standard output or we can use the .output command to
    direct the stream to the file of our choice.


    One interesting application of this technique would be to combine multiple databases
    into one. For example, let''s imagine we had several Raspberry Pi computers each
    performing data logging of an external sensor. We could collect dumps from each
    machine and combine all of the tables into a single database for data analysis
    and reporting.


