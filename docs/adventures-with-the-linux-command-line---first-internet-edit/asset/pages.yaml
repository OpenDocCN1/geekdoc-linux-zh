  md: '# Dialog Option Description


    | Dialog Box | Option | Description |

    | :--- | :--- | :--- |

    | Message Box | --msgbox | Displays a text message and waits for the user to respond.
    |

    | Password Box | --password | Similar to an input box, but hides the user’s entry.
    |

    | Pause | --pause | Displays a text message and a countdown timer. The dialog
    terminates when the timer runs out or when the user presses the OK or Cancel button.
    |

    | Program Box | --programbox | Displays the output of a piped command. When the
    command completes, the dialog waits for the user to press an OK button. |

    | Progress Box | --progressbar | Similar to the program box except the dialog
    terminates when the piped command completes, rather than waiting for the user
    to press OK. |

    | Radio List Box | --radiolist | Displays a list of choices and allows the user
    to select a single item. Any previously selected item becomes unselected. |

    | Range Box | --rangebox | Allows the user to select a numerical value from within
    a specified range using a keyboard-based slider. |

    | Tail Box | --tailbox | Displays a text file with real-time updates. Works like
    the command `tail -f`. |

    | Text Box | --textbox | A simple text file viewer. Supports many of the same
    keyboard commands as `less`. |

    | Time Box | --timebox | A dialog for entering a time of day. |

    | Tree View | --treeview | Displays a list of items in a tree-shaped hierarchy.
    |

    | Yes/No Box | --yesno | Displays a message and gives the user a chance to respond
    with either “Yes” or “No.” |


