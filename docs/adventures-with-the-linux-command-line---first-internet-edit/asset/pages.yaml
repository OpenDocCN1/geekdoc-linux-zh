  img_proc: true
- pgno: 174
  md: 'Indentation is accomplished in one of two ways; either by inserting tab characters
    or by inserting a sequence of spaces. To understand the difference, we have to
    go back in time to typewriters and teletype machines.


    In the beginning, there were typewriters. On a typewriter, in order to indenting
    the first line of a paragraph easier, someone invented a mechanical device that
    would move the carriage over a set amount of space. Over time, these devices became
    more sophisticated and allowed multiple tab stops to be set. When teletype machines
    came about, they implemented tabs with a specific ASCII character HT (horizontal
    tab, code 9) which, by default, was rendered by moving the cursor to the next
    position evenly by 8.


    In the early days of computing, when memory was precious, it made sense to conserve
    space in text files using tab characters to avoid padding the text file with spaces.


    Using tab characters creates a problem, though. Since a tab character has no intrinsic
    width (it only signifies the desire to move to the next tab), it''s up to the
    receiving program to render the tab with defined width. This means a file containing
    tabs could be rendered in different ways in different programs and in different
    contexts.


    Since memory is no longer expensive, and using tabs creates this rendering confusion,
    modern practice calls for spaces instead of tabs to perform indentation (though
    this remains somewhat controversial). Vim provides a number of options for setting
    tabs and indentation. An excerpt from the help file for the tabstop explains why
    Vim can treat tabs:


    There are four ways to use tabs in Vim:


    +   1. Always keep ''tabstop'' at 8, set ''softtabstop'' and ''shiftwidth'' to
    4 (or 3 or whatever you prefer) and use ''noexpandtab''. Then Vim will use a mix
    of tabs and spaces, using <Tab> and <BS> will behave like a tab appears every
    4 (or 3) characters.

    2. Set ''tabstop'' and ''shiftwidth'' to whatever you prefer and use ''expandtab''.
    This way will always insert spaces. The formatting will never be messed up when
    ''tabstop'' is changed.

    3. Set ''tabstop'' and ''shiftwidth'' to whatever you prefer and use a :modeline
    to set these values when editing the file again. Only work when using Vim to edit
    the file.

    4. Always set ''tabstop'' and ''shiftwidth'' to the same value, and ''noexpandtab''.
    This should work (initial indents only) for any tabstop setting that people use.
    It might be nice to have tabs after the first non-blank inserted as spaces if
    you do this though. Otherwise, aligned comments will be wrong when ''tabstop''
    is changed.


    Vim, with Vigor 165'
  merge: -1
  img_proc: true
- pgno: 175
  md: "# Indentation Settings For Scripts\n\nFor our purposes, we will use method\
    \ 2 and add the following lines to our sh.vim file to set tabs to indent 2 spaces.\
    \ This is a popular setting specified in some shell script coding standards.\n\
    \n```\nsetlocal tabstop=2\nsetlocal shiftwidth=2\nsetlocal expandtab\nsetlocal\
    \ softtabstop=2\nsetlocal autindent\nsetlocal smartindent\n```\n\nIn addition\
    \ to the tabs, we also included the autindent and smartindent settings, which\
    \ we write blocks of code.\n\nAfter adding the indentation settings to our sh.vim\
    \ file, we'll add more lines to our shell script (type this in to see how it behaves):\n\
    \n```\n# /bin/bash\n\n This is a shell script to demonstrate features in vim.\n\
    # It doesn't really do anything, it just shows what we can do.\n\n# Constants\n\
    A=1\nB=2\n\nif [ \"$A\" == \"$B\" ]; then\n  echo \"This shows how smartindent\
    \ works.\\n  echo \"This shows how autindent works.\\n  echo \"A and B match.\"\
    \nelse\n  echo \"A and B do not match.\"\nfi\n\nafunction() {\n  cmd1\n  cmd2\n\
    }\n\nif [ -e file ]]; then\n  cmd1\n  cmd2\nfi\n```\n\nAs we type these additional\
    \ lines into our script, we notice that vim can now automatically provide indentation\
    \ as needed. The autindent option causes vim to repeat the previous line's indent\
    \ when the smartindent option provides indentation for certain program structures\
    \ like the function and if statements. This saves a lot of time while coding and\
    \ ensures our code stays nice and neat.\n\nIf we find others editing an existing\
    \ script with an indentation scheme differing from our current settings, vim can\
    \ convert the file. This is done by typing:\n\n```\n:retab\n```\n\n166 Vim, with\
    \ Vigor"
