- pgno: 168
  md: 'filetype=


    For the curious, we can ask for help like this to get more information:


    ```

    :h :set

    :h ''ft''

    ```


    To see all the current option settings, we can do this and the entire list will
    appear:


    ```

    :set

    ```


    Since we want our new file to be treated as a shell script, we can set the filetype
    manually:


    ```

    :set ft=sh

    ```


    Next, let''s enter insert mode and type the first couple of lines in our script:


    ```

    #!/bin/bash

    ```


    Exit insert mode by pressing the Esc key and save the file:


    ```

    :w

    ```


    Now that our file contains the shebang on the first line, the filetype plugin
    will recognize the file as a shell script when it is loaded.


    # Using the Shell


    One thing we can do with filetypes is create a configuration file for each of
    the supported types. Normally, these are placed in the ~/.vim/ft directory. To
    do this, we need to create the directory.


    We don''t have leave vim to do this; we can launch a shell from within vim. This
    is easily done by entering the command:


    ```

    :sh

    ```


    After doing this, a prompt will appear and we can enter our shell command:


    ```

    [me@linuxbox ~]$ mkdir -p ~/.vim/ftplugin

    ```


    When we''re done with the shell, we return to vim by exiting the shell:


    ```

    [me@linuxbox ~]$ exit

    ```


    Now that we have a place for our configuration file to live, let''s create it.
    We''ll open a new file:


    ```

    :e ~/.vim/ftplugin/sh.vim

    ```


    The filename sh.vim is required.


    Help topics: :sh


    Vim, with Vigor 159'
