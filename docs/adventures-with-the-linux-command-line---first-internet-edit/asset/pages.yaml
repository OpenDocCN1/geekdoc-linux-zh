  md: "```\nsqlite .mode column\nsqlite .header off\nsqlite SELECT 'String 1', 'String\
    \ 2';\nstring 1 string 2\n```\n\nAs we saw before, SELECT can produce calculated\
    \ values.\n\n```\nsqlite>.header on\nsqlite SELECT 2 + 2;\n2 + 2\n$\nSELECT COUNT(file),\
    \ AVG(size_bytes) FROM Package_Files;\ncount(file) avg(size_bytes)\n-------------------------------------------\n\
    153506 33370.3488658424\n```\n\nTo make complicated expressions more readable,\
    \ we can assign their results by aliases using the AS clause.\n\n```\nSELECT COUNT(file)\
    \ AS Files,\n...> AVG(size_bytes) AS 'Average Size'\n... FROM Package_Files;\n\
    ... Average Size\n-------------------------------------------\n153506 33370.3488658424\n\
    ```\n\nAn important feature of SELECT is ability to produce results by combining\
    \ data from multiple tables. This process is done by performing joins and subqueries.\
    \ joins a little later, but now let's count on subqueries. SELECT allows us to\
    \ include another SELECT statement as an output. To demonstrate this, we produce\
    \ a table that includes columns for package name, number of files in the package,\
    \ and the total size of the package. The SELECT statement to do this is rather\
    \ formidable. We will open our text editor and create a file named subquery_demol.sql\
    \ with the following:\n\n```\n-- subquery_demol.sql\n\n-- Query to list 20 packages\
    \ with the greatest number of files\n\n.mode column\n.header on\n.width 20 40\
    \ 10 10\nSELECT package_name, description,\n(SELECT COUNT(file)\n    FROM Package_Files\n\
    \    WHERE Package_Descriptions.package_name = Package_Files.package_name),\n\
    \    (SELECT SUM(size_bytes)\n    FROM Package_Files\n    WHERE Package_Descriptions.package_name\
    \ = Package_Files.package_name)\nAS size\nFROM Package_Descriptions ORDER BY files\
    \ DESC LIMIT 20;\n```\n\nWe'll run this query and view the results.\n\n```\nme@linuxbox:~/adventure-sql$\
    \ sqlite3 adv-sql.sql < subquery_demol.sql\npackage_name description size\n-----------------------------------------------------------\n\
    ```\n\n# 230 SQL"
