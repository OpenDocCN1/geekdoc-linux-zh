  md: "# Buffers\n\nBefore we start editing our new file, let's look at what vim is\
    \ doing. Each file that we edit is stored in a buffer. We can look the current\
    \ list of buffers this way: \n\n```\n:ls\n```\n\nThis will display the list. There\
    \ are several ways that we can switch buffers. The first way is to cycle between\
    \ them:\n\n```\n:bn\n```\n\nThis command (short for :bnext) cycles through the\
    \ buffer list, wrapping around at the end. Likewise, there is a :bp (:previous)\
    \ command which cycles through the buffer list backwards. We can also select a\
    \ buffer by number:\n\n```\n:b 2\n```\n\nWe can cycle back to our new buffer and\
    \ add this line to our configuration file:\n\n```\nsetlocal number\n```\n\nThis\
    \ will turn on line numbering each time we load a shell script. Notice that the\
    \ setlocal command rather than set. This is because set will apply an option globally,\
    \ whereas the setlocal command only applies the option to the current buffer.\
    \ This will prevent settings conflicts when we edit multiple files of different\
    \ types.\n\nWe can also control syntax highlighting while we're here. We can turn\
    \ it on with:\n\n```\nsyntax on\n```\n\nOr turn it off with:\n\n```\nsyntax off\n\
    ```\n\nWe'll save this file, now before we do, let's type mS (lowercase m uppercase\
    \ S), similar to what we did when we saved our initial .vimrc.\n\nHelp topics:\
    \ :ls :buffers :bnext :previous :setlocal 'number' :syntax\n\n# Tabs\n\nBefore\
    \ we leave the subject of buffers, let's take a look at possible way of using\
    \ them. We have already discussed splits and windows, but recent versions of vim\
    \ include a useful alternative called tabs. As the name suggests, this feature\
    \ allows each buffer to appear in its own tab.\n\nTo create a new tab, we type\
    \ the following command:\n\n```\n:tabnew\n```"
