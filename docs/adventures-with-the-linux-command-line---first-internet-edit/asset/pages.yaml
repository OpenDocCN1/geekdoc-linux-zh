    \ to selected text in visual mode or used in conjunction with motion commands\
    \ or text selections. For example:\n\n```\nguis   Convert the current sentence\
    \ to upper case\nguf:   Convert text from the cursor position to the next ':'\n\
    \       character on the current line\n```\n\n# File Format Conversion\n\nOnce\
    \ a while, we are afflicted with a text file that was created or used in a DOS/Windows\
    \ system. These files will contain an extra carriage return at the end of each\
    \ line. Vim will indicate this after loading the file by displaying a \"DOS\"\
    \ message at the bottom of the editing window. To correct this annoying condition,\
    \ do the following:\n\n```\n:set fileformat=unix\n```\n\nThe file will be rewritten\
    \ in the correct format.\n\nHelp topics: 'textwidth' gq 'fileformat' ~ gu gU\n\
    \n# Macros\n\nText editing sometimes means we get stuck with a tedious repetitive\
    \ editing task where we do the same set of operations over and again again. This\
    \ is the bane of every computer user. Fortunately, vim provides us a way to record\
    \ a sequence of operations we can later playback as. These recordings are called\
    \ macros.\n\nTo create a macro, we begin recording typing q followed by a single\
    \ letter. The character typed after q becomes the name of the macro. After start\
    \ recording, everything we gets gets in the macro. To conclude, we type q again.\n\
    \nTo demonstrate, let's consider our block comment. To create a macro that will\
    \ remove a character symbol from the beginning of the line, we would do this:\
    \ move to the first line in the comment block and type the following command:\n\
    \nLet's break down what this sequence:\n\n| qa | Start recording macro \"a\" |\n\
    | ^ | Move to the first non-whitespace character in the current line |\n| xx |\
    \ Delete the first two characters under the cursor |\n| j | Move down one line\
    \ |\n\n172 Vim, with Vitor"
