  md: 'when we start screen which contains a complete multi-window, command-line environment
    running all of our favorite programs.


    # tmux


    Despite its continuing popularity, GNU screen has been criticized for its code
    complexity (to the point of being "unmaintainable") and its resource consumption.
    In addition, it is reported that screen is no longer actively developed. In response
    to these concerns, a newer program, tmux, has attracted widespread attention.


    tmux is modern, friendlier, more efficient, and generally superior to screen in
    most ways. Conceptually, tmux is very similar to screen in that it also supports
    the concept of sessions, windows and regions (called *panes* in tmux). In fact,
    it even shares a few keyboard commands with screen.


    # Availability


    tmux is widely available, though not as widely as screen. It’s available for most
    distribution repositories. The package name is “tmux”.


    # Invocation


    The program is invoked with the command `tmux new` to create a new session. We
    can optionally add `-s <session_name>` to assign a name to the new session and
    `-n <window_name>` to assign a name to the first window. If no option the `new`
    command is supplied, the `new` itself may be omitted; it will be assumed. Here
    is an example:


    ```

    me@linuxbox: ~ $ tmux new -s "my session" -n "window 1"

    ```


    Once the program starts, we are presented with a shell prompt and a pretty status
    bar at the bottom of the window.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '![](img/9aafc495f4afbc0a97de2b31a0d13f46_46_0.png)


    Initial tmux window


    # Multiple Windows


    tmux uses the keyboard in a similar fashion to screen, but rather than using Ctrl-a
    as the command prefix, tmux uses Ctrl-b. This is good since Ctrl-a is used when
    editing the command line in bash to move the cursor to the beginning of the line.


    Here are the basic commands for creating windows and navigating them:


    | Command | Description |

    | --- | --- |

    | Ctrl-b ? | Show the list of key bindings (i.e., help) |

    | Ctrl-b c | Create a new window |

    | Ctrl-b n | Go to next window |

    | Ctrl-b p | Go to previous window |

    | Ctrl-b 0 | Go to window 0. Numbers 1-9 are similar. |

    | Ctrl-b w | Show window list. The status bar lists windows, too. |

    | Ctrl-b , | Rename the current window |


    tmux window commands


    # Multiple Panes


    Like screen, tmux can divide the terminal display into sections called panes.
    However, unlike the implementation of regions in screen, panes in tmux do not
    merely provide viewports to various windows. In tmux they are complete pseudo-terminals
    associated with the window. Thus a single tmux window can contain multiple terminals.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Command Description


    | Command | Description |

    | --- | --- |

    | Ctrl-b " | Split pane horizontally |

    | Ctrl-b % | Split pane vertically |

    | Ctrl-b arrow | Move to adjoining pane |

    | Ctrl-b Ctrl-arrow | Resize pane by 1 character |

    | Ctrl-b Alt-arrow | Resize pane by 5 characters |

    | Ctrl-b x | Destroy current pane |


    # tmux pane commands


    We can demonstrate the behavior of panes by creating a session and a couple of
    windows. First, we will create a session, name it, and name the initial window:


    ```

    @linuxbox: ~ $ tmux new -s PaneDemo -n Window0

    ```


    Next, we will create a second window and give it a name:


    ```

    @linuxbox: ~ $ tmux new -n Window1

    ```


    We could have done this second step with Ctrl-b commands, but seeing the command-line
    method prepares us for something up a little later.


    Assuming that all has gone well, now we find ourselves in a tmux session named
    "PaneDemo" and a window named "Window1". Now we will split the window in two horizontally
    by typing Ctrl-b ". We will have only two windows (Window0 and Window1), but now
    we have two prompts on Window1. We can switch back and forth between the two panes
    by typing Ctrl-b followed by up arrow or down arrow.


    Just for fun, let''s type Ctrl-b t and a digital clock appears in the current
    pane. It''s just a cute thing that tmux can do.'
