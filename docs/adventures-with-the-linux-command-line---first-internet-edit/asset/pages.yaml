  md: "# getline var <file var\n\nReads the next record from *file* and assigns its\
    \ contents to the variable *var*. Only *var* is set.\n\n# command | getline\n\n\
    Reads the next record from the output of *command*. $0 and NF are set. Here is\
    \ an example where we use AWK to parse the output of the *date* command:\n\n```\n\
    awk '\nBEGIN {\n  \"date\" | getline\n  print $4\n}\n```\n\n# command | getline\
    \ var\n\nReads the next record from the output of *command* and assigns its contents\
    \ to the variable *var*. Only *var* is set.\n\n# String Functions\n\nAs one would\
    \ expect, AWK has many functions used to manipulate strings and what's more, many\
    \ of them support regular expressions. This makes AWK's string handling very powerful.\n\
    \n# gsub(r, s, t)\n\nGlobally replaces any substring matching regular expression\
    \ *r* contained within the target string *t* with string *s*. The target string\
    \ is optional. If omitted, $0 is used as the target string. The function returns\
    \ the number of substitutions.\n\n# index(s1, s2)\n\nReturns the leftmost position\
    \ of string *s2* within string *s1*. If *s2* does not appear within *s1*, the\
    \ function returns 0.\n\n# length(s)\n\nReturns the number of characters in string\
    \ *s.\n\n# match(s, r)\n\nReturns the leftmost position of a substring matching\
    \ regular expression *r* within string *s*. Returns 0 if no match is found. This\
    \ function also sets the internal variables RSTART and RLENGTH."
