  md: "has removed the colon for the expansion. This changes the meaning of the expansion\
    \ to mean that a default value is set only if the parameter is unset rather than\
    \ unset or empty.\n\nThe next part of the example creates a temporary file named\
    \ tmp_file by using the tempfile command, which is a program used to create a\
    \ temporary file in a secure manner. Next, we set a trap to make sure that the\
    \ temporary file is deleted if the program is unintended. Neatness counts!\n\n\
    At last, we get to the dialog command itself. We start off setting a title for\
    \ the input box and specify the --clear option to tell dialog that we erase any\
    \ previous dialog box from the screen. Next, we indicate the type of dialog box\
    \ we want and its required arguments. These include the title to be displayed\
    \ above the input field, and the desired height and width of the box. Though we\
    \ could also specify zero for both values and dialog will attempt to automatically\
    \ determine the correct size.\n\nSince dialog normally outputs its results to\
    \ standard error, we redirect its descriptor to our temporary file for storage.\n\
    \nThe last thing we have to do is collect the exit status of the command in a\
    \ variable (return_value) so that we can figure out button the user pressed to\
    \ terminate the dialog box. At the end of the script, we look at this value and\
    \ act correctly.\n\n# Method 2: Use Command Substitution and Redirection\n\nThe\
    \ second method of receiving data from dialog involves redirection. In the script\
    \ that follows, we pass the results from dialog to a variable rather than a file.\
    \ To do this, we need to perform some redirection.\n\n```\n#!/bin/bash\n\n# inputbox\
    \ - demonstrate the input dialog box with redirection\n\n# Define the dialog exit\
