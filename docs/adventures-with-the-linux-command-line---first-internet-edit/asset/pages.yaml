- pgno: 10
  md: '# # Midnight Commander


    At the beginning of Chapter 4 in TLCL there is a discussion of GUI-based file
    managers versus the traditional command line tools for file manipulation as `cp,
    mv, and rm`. While many common file manipulations are easily done with a graphical
    file manager, the command line tools provide additional power and flexibility.


    In this adventure we will look at Midnight Commander, a character-based directory
    browser and file manager that bridges the two worlds of the familiar graphical
    file manager and the command line tools.


    The design of Midnight Commander is based on a common concept in file managers:
    dual directory panes where the listings of two directories are shown at the same
    time. The idea is that files are moved or copied from the directory shown in one
    pane to the directory shown in the other. Midnight Commander can do this, and
    much, much more.


    # ## Features


    Midnight Commander is quite powerful and boasts an extensive set of features:


    +   - Performs all the common file and directory manipulations such as copying,
    renaming, linking, and deleting.

    - Allows manipulation of file and directory permissions.

    - Can treat remote systems (via FTP or SSH) as though they were local directories.

    - Can treat archive files (like .tar and .zip) as though they were local directories.

    - Allows creation of a user-defined "hotlist" of frequently used directories.

    - Can search for files based on file name or file contents, and treat the search
    results like a directory.


    # ## Availability


    Midnight Commander is part of the GNU project. It is installed by default in some
    Linux distributions, and is almost always available in every distribution''s software
    repositories as the package `mc`.


    # ## Invocation


    To start Midnight Commander, enter the command `mc` followed optionally by either
    1 or 2 directories to browse at start.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Screen Layout


    ![](img/9aafc495f4afbc0a97de2b31a0d13f46_11_0.png)


    Midnight Commander screen layout


    +   1. Left and Right Directory Panels


    The center portion of the screen is dominated by two large directory panels (called
    the current panel) is active at any one time. To change which is the current panel,
    press the Tab key.


    +   2. Function Key Labels


    The bottom line on the display contains function key (F1-F10) shortcuts to the
    most commonly functions.


    +   3. Menu Bar


    The top line of the display contains a set of pull-down menus. These can be activated
    by pressing the F9 key.


    +   4. Command Line


    Just after the function key labels is a shell prompt. Commands can be entered
    in the usual manner. One especially useful command is cd followed by a directory
    pathname. This will change the directory shown in the current directory panel.


    +   5. Mini-Status Line


    At the very bottom of the directory panel and the command line is the mini-status
    line. This area is used to display supplemental information about the currently
    selected item such as the targets of symbolic links.


    Midnight Commander'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# # Using the Keyboard and Mouse


    Being a character-based application with a lot of features means Midnight Commander
    has a lot of keyboard commands, some of which it shares with other applications;
    others are unique. This makes Midnight Commander a challenging to learn. Fortunately,
    Midnight Commander also supports mouse input on most terminal emulators (and on
    the console if the gpm package is installed), it''s easy to pick up the basics.
    Learning the keyboard commands is needed to take full advantage of the program''s
    features.


    Another issue when using the keyboard with Midnight Commander is interference
    from the window manager and the terminal emulator itself. Many of the function
    keys and Alt-key combinations Midnight Commander uses are intercepted for other
    purposes by the terminal and window manager.


    To work around this problem, Midnight Commander allows the Esc key to function
    as a Meta-key. In cases where a function key or Alt-key combination is not available
    due to interference from outside programs, use the Esc key instead. For example,
    to input the F1 key, release the "1" key ("0" for F10). The same method works
    with troublesome Alt-key combinations. For example, to enter Alt-t, and release
    the Esc key followed by the "t" key. Close dialog boxes in Midnight Commander,
    press the Esc key twice.


    # # Navigation and Browsing


    Before we start performing file operations, it''s important to learn how to use
    the directory panels and navigate the file system.


    As we can see, there are two directory panels, the any one time, one of the panels
    is active and is called the *current panel*. The other panel is conveniently called
    the *other panel* in the Midnight Commander documentation.


    The current panel can be identified by the highlighted bar in the directory listing,
    which can be moved up and down with the arrow keys, PgUp, PgDn, etc. Any file
    or directory which is highlighted is to be *selected*.


    Select a directory and press `Enter`. The current directory will change to the
    selected directory. Highlighting the topmost item in the listing selects the panel
    directory. It is also possible to change directories directly on the command line
    below the directory panels. To do so, simply enter `cd` followed by a path name
    as usual.


    Pressing the `Tab` key switches the current panel.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Changing the Listing Format


    The directory listing can be displayed in different formats. Pressing Alt-t cycles
    through them. There is a dual column format, resembling the output of `ls -1`,
    and others.


    There is also an "information mode." This will display detailed file system information
    in the other panel about the selected item in the current panel. To invoke this,
    type Ctrl-i. To restore the other panel to its normal state, type Ctrl-x again.


    | Left | File | Command | Options | Right |

    | --- | --- | --- | --- | --- |

    | Name | Size | Modify | Time | Information Midnight Commander 4.0 |

    | /.cache | 4096 | Feb 3 | 13:32 | File: .bash_history |

    | /.config | 4096 | Feb 3 | 13:32 | Location: 8300h:27C8ih |

    | /.local | 4096 | Feb 3 | 13:32 | -rw------- (060) |

    | /Documents | 4096 | Feb 3 | 13:32 | Links: 1 |

    | /Pictures | 4096 | Feb 3 | 13:32 | Owner: me |

    | .bash_history | 376 | Feb 3 | 13:24 | Size: 376 (blocks) |

    | .bash_logout | 220 | Feb 3 | 13:24 | Modified: Feb 4 00:55 |

    | .bashrc | 68 | Feb 3 | 13:44 | Accessed: Feb 3 13:45 |

    | .lesshst | 675 | Feb 3 | 13:24 | Device: rootfs |

    | .profile | 646 | Feb 3 | 13:54 | Type: rootfs |

    | .viminfo | | | | Free space: 300M/587M (51%) |


    > Hint: You can specify the username when doing fps: `cd ftp://user@machine.edu`nMidnightLinux
    1 Help 2 Menu 3 View 4 Copy 5 GenName 7 Mkdir 8 Delete 9 Quit 10 Quit


    Directory panel in information mode


    # Setting the Directory on the Other Panel


    It is often useful to select a directory in the current panel and have its contents
    listed on the other panel; for example, when moving files from a parent directory
    into a subdirectory. To do this, select a directory and press Alt-o. To force
    the other panel to list the same directory as the current panel, type Alt-1.


    # The Directory Hotlist


    Midnight Commander can store a list of frequently visited directories. This "hotlist"
    can be displayed by pressing Ctrl-\\.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '![](img/9aafc495f4afbc0a97de2b31a0d13f46_14_0.png)


    Directory hotlist

    To add a directory to the hotlist while browsing, select a directory and type
    Ctrl-x h.


    # Directory History


    Each directory panel maintains a list of directories that it has displayed. To
    access this

    list, type Alt-H. From the list, a directory can be selected for browsing. Even
    without the

    history list display, we can traverse the history list forward and backward using
    the

    Alt-u and Alt-y keys respectively.


    # Using the Mouse


    We can perform many Midnight Commander operations using the mouse. A directory

    panel can be selected by clicking on it and a directory can be opened by double

    clicking. The function keys and menu bar items can be activated by

    clicking on them. It is not so apparent that the directory history can be accessed
    and

    traversed. At the top of each directory panel there are small arrows (circled
    in the image

    below). Clicking on them will show the directory history (the up arrow) and move

    forward and backward through the history list (the right and left arrows).


    There is also an arrow to the extreme lower right edge of the command line which
    reveals

    t command line history.'
  merge: -1
  img_proc: true
