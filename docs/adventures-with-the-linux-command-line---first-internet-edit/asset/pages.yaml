- pgno: 173
  md: 'We can use a lowercase letter to name a mark. Now, the clever among us will
    remember that we set marks in both the .vimrc file, and the sh.vim file but we
    used uppercase letters.


    Yes we did, they''re special. They''re called file marks and they let us set a
    mark in a file that will remember between sessions. Since we set the V mark in
    the .vim file and the S mark in sh.vim file, if we type:


    ```

    ''v

    ```


    vim will immediately take you to start even if vim has to load the file to do
    it. By doing this to .vimrc and sh.vim, we''re set up to edit our configuration
    files anytime we get another bright idea about customizing vim.


    **Help topics:** m


    # Visual Mode


    Among the best features that vim adds to vi is visual mode. This mode allows us
    to visually select text in our document. If we type:


    ```

    v

    ```


    An indicator will appear at the bottom of the screen showing that we have entered
    this mode. While in visual mode, when we move the cursor (using any of the available
    movement commands), the text is visually highlighted and selected. Once this is
    done we can apply any normal editing commands on the selected text such as c (change),
    d (delete), and y (yank). Typing v a second time will exit visual mode. If we
    type:


    ```

    v

    ```


    we again enter visual mode, but this time selection is done on a line-by-line
    basis rather by individual characters. This is handy when cutting and copying
    blocks of code.


    There is a third way of using visual mode. If we type:


    ```

    Ctrl-v

    ```


    we are able to select rectangular blocks of text by columns. For example, we could
    select a column from a table.


    **Help topics:** v ^


    # Indentation


    We''re going to continue working on our shell script, but first we need to talk
    a little about indentation. As we know, indentation is used in programming to
    help communicate program structure. The shell does not require any particular
    style of indentation; it''s purely for the benefit of the humans trying to read
    the code. However, some other languages, such as Python, require indentation to
    express program structure.


    Vim, with Vigor'
