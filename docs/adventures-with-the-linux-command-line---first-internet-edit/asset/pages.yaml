  md: '+   - **h,--help** The help option displays the help message we saw above.
    The help option is mutually exclusive with the other `new_script` options and
    after the help message is displayed, `new_script` exits.


    +   - **q,--quiet** The quiet option causes `new_script` to become non-interactive
    and to output a base template without customization. In this mode, `new_script`
    will output its script template to standard output if no script file is specified.


    +   - **s,--root** The superuser option adds a routine to the template that requires
    the script to be run by the superuser. If a non-privileged user attempts to run
    the resulting script, it will display an error message and terminate.


