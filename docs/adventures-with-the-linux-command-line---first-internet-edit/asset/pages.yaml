  md: '# The User Menu


    So far we have avoided discussion of the mysterious F2 command. This is the user
    menu, which may be Midnight Commander''s most powerful and useful feature. The
    user menu is, as the name suggests, a menu of user-defined commands.


    When we press the F2 key, Midnight Commander looks for a file named .mc.menu in
    the current directory. If the file does not exist, Midnight Commander looks for
    ~/.config/mc/menu. If file does not exist, then Midnight Commander falls back
    to a system-wide menu file named /usr/share/mc/mc.menu.


    The next thing about this is that each directory can have its own set of user
    commands, so that we can create commands to the contents of the current directory.
    For example, if we have a "Pictures" directory, we can create commands for processing
    images; if we have a directory full of HTML files, we can create commands for
    managing a web site, and so on.


