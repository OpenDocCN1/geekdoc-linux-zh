  md: '. .tables dot command displays a list of tables in the database while the .schema
    dot command lists the statements used to create the specified table.


    Next, we''ll get into some real SQL using SELECT, probably the most frequently
    used SQL statement.


    ```

    sqlite> SELECT * FROM Package_Descriptions;

    a2ps (GNU) a2ps ''Anything to PostScript'' converter and pretty-printer

    accountserver-query and manipulate user account information

    acl control utilities

    acpi-support scripts for handling many ACPI events

    acpidid Advanced Configuration and Power Interface event daemon

    adduser remove users and groups

    adium-theme-abuntu Adium message style for Ubuntu

    adwaita-icon-theme default icon theme of GNOME (small subset)

    alaislerot solitaire card game collection

    alsa-base ALSA driver configuration files

    ```


    This is the simplest form of the SELECT statement. The syntax is the word SELECT
    followed by a list of columns or calculated values, and a FROM clause specifying
    the source of the data. This example uses * which means every column. Alternately,
    we could explicitly name the columns, like so:


    ```

    sqlite> SELECT package_name, description FROM Package_Descriptions

    ```


    And achieve the same result.


    # Controlling the Output


    As we can see from the output above, the default format is fine to be desired
    when it comes to being read by humans. We can adjust the output format with some
    commands. We''ll also add the LIMIT clause to the end of our query to output 10
    rows.


    ```

    sqlite> .headers on

    sqlite> .mode column

    sqlite> SELECT * FROM Package_Descriptions LIMIT 10;

    package_name      description

    -----------------

    a2ps               GNU a2ps ''Anything to PostScript'' converter and pretty-printer

    accountserver-query and manipulate user account information

    acl

    acpi-support scripts for handling many ACPI events

    acpidid Advanced Configuration and Power Interface event daemon

    adduser remove users and groups

    adium-theme-abuntu Adium message style for Ubuntu

    adwaita-icon default icon theme of GNOME (small subset)

    alaislerot GNOME solitaire card game collection

    alsa-base ALSA driver configuration files

    ```


    By using the .headers and .mode column commands, we add the column headings and
    change the output format. These settings stay in effect until we change them.
    The .mode dot command has a number of interesting possible settings.


