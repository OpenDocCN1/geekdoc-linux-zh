    # Arithmetic and logical operators


    These operators behave like those in the shell; however, unlike the shell, which
    is limited to integer arithmetic, AWK arithmetic is floating point. This makes
    AWK a good way to do more complex arithmetic than the shell.


    Arithmetic and logical expressions can be used in both patterns and actions. Here''s
    an example that counts the number of lines containing exactly 9 fields:


    ```

    ls -1 /usr/bin | awk ''NF = 9 (count++) END print count''

    ```


    This AWK program consists of 2 pattern/action. The first matches lines where the
    number of fields is equal to 9. The action creates and increments a variable named
    count. Each time a line with exactly 9 fields is encountered in the input stream,
    count is incremented by 1.


    The second part matches when the end of the input stream is reached and the resulting
    action prints the final value of count.


    Using this basic form, let''s try something little more useful; a program that
    calculates the total size of the files in the list:


    ```

    ls -1 /usr/bin | awk ''NF >9 (total += $5) END print total''

    ```


    Here is a slight variation (with shortened variable names to make it a little
    more concise) that calculates the average size of the files:


    ```

    ls -1 /usr/bin | awk ''NF>=9 (c++; t += $5) END print t / c''

    ```


