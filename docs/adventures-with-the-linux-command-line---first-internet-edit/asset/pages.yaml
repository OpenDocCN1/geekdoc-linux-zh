    # Subshells


    We may, at any time, move from the Midnight Commander to a full shell session
    and back again by pressing Ctrl-o. The subshell is a copy of our normal shell,
    whatever environment our use shell establishes (aliases, shell functions, prompt
    strings, etc.) will be present in the sub-shell as well. If we start a long-running
    command in the sub-shell and press Ctrl-o, the command is suspended until we return
    to the sub-shell. Note that once a command is suspended, Midnight Commander cannot
    execute any further external commands until the suspended command terminates.


