  md: "# 13 Coding Standards Part 2: new_script\n\nIn Part 1, we created a coding\
    \ standard that will assist us when writing serious, production-quality scripts.\
    \ The only problem is the standard is rather complicated, and writing a script\
    \ that conforms to it can get a bit tedious. Any time we want to write a \"good\"\
    \ script, we have to do a lot of rote, mechanical work to include such things\
    \ as error handlers, traps, help message functions, etc.\n\nOver to this, many\
    \ programmers rely on script templates that contain much of this routine coding.\
    \ In this adventure, we're going to look at a program called new_script from LinuxCommand.org\
    \ that creates templates for bash scripts. Unlike static templates, new_script\
    \ custom generates templates that include usage and help messages, as well as\
    \ a parser for the script's desired command options and arguments. Using new_script\
    \ saves a lot of time and helps us even the most casual script a well-crafted\
    \ and robust program.\n\n# Installing new_script\n\nTo install new_script, download\
    \ it from LinuxCommand.org, move it to a directory in your PATH, and set it to\
    \ be executable.\n\n```\nme@linuxbox:~$ curl -O http://linuxcommand.org/new_script.bash\n\
    me@linuxbox:~$ mv new_script.bash /bin/new_script\nme@linuxbox:~$ chmod +x /bin/new_script\n\
    ```\n\nAfter installing, we can test it by:\n\n```\nme@linuxbox:~$ new_script\
    \ --help\n```\n\nIf the installation was successful, we will see the help message:\n\
    \n```\nnew_script 3.5.3\nBash shell template generator.\n\nUsage: new_script [-h|--help]\n\
    new_script [-q|--quiet] [-s|--root] [script]\n\nOptions:\n  -h, --help      Display\
    \ this help message and exit.\n  -q, --quiet     Quiet mode. No prompting. Outputs\
    \ default script.\n  -s, --root      Output script requires root privileges to\
    \ run.\n```\n\n# Options and Arguments\n\nNormally, new_script is run without\
    \ options. It will prompt the user for a variety of information that it will use\
    \ to construct the script template. If an output script file name is not specified,\
    \ the user will be prompted for one. For some special cases, the following options\
    \ are supported:"
