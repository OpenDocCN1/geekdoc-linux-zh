    # while ( expression ) statement


    do statement while ( expression )

    Theile and do loops in AWK are pretty straightforward. We determine a condition
    that must be maintained for the loop to continue. We can demonstrate this using
    our field reversal program (we''ll type it out in multiple lines to make the logic
    easier to follow):


    ```

    ls -l | awk {

    s = ""

    i = NF

    while (i > 0) {

    s = $i OFS

    i--

    }

    print s

    }

    ```


    The do loop is similar to the while loop; however the do loop will always execute
    its statement at least once, whereas the while loop will only execute its statement
    if the initial condition is met.


    # break

    continue

    next


    The break, continue, and next keywords are used to "escape" from loops. break
    and continue behave like their corresponding commands in the shell. continue tells
    AWK to stop and continue with the next iteration of the current loop. break tells
    AWK to exit the current loop entirely. the next keyword tells AWK to skip the
    remainder of the current program and begin processing the next record of input.


    # exit expression


    As with the shell, we can tell AWK to exit and provide an optional expression
    that sets AWK''s exit status.


