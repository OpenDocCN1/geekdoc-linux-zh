  md: "While this seems really complicated, it's not really that bad. To change our\
    \ image resizing entry to only appear when the currently selected file has the\
    \ extension .jpg or JPG, we would add one line to the beginning of the entry (regular\
    \ expressions are used in this example):\n\n```\n# Resize image using convert\n\
    + f \\.jpg | f \\.JPG\n R Resize image within 800 pixel bounding square\n size=800\n\
    \ convert \"%f\" -resize ${size}x${size} \"%b-${size}.%x\"\n```\n\nThe conditional\
    \ begins with + meaning that it's an addition condition. It is followed by two\
    \ sub-conditions. The | separating them signifies an \"or\" relationship between\
    \ the two. So, the finished conditional means \"display this entry if the selected\
    \ file name ends with .jpg or the selected file name ends with .JPG.\"\n\nThe\
    \ default menu file contains many examples of conditionals. It's worth to know.\n\
    \n# Summing Up\n\nEven though it takes a little to learn, Midnight Commander offers\
