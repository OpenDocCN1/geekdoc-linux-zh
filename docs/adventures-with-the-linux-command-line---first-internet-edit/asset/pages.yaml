  md: 'Oh, and while we''re on the subject of command mode, now is a good time to
    point out that command mode has command line history similar to the shell. After
    typing '':'' we can use the up and down arrows to scroll through past commands.


    **Help topics:** :split :close :only ^w


    # Starting a Script


    In order to demonstrate features in vim, we''re going to write a shell script.
    What it does is not important, in fact, it won''t do anything at all except show
    how we can edit scripts. To begin, let''s start vim with the name of an non-existent
    script file:


    ```

    [me@linuxbox ~]$ vi focript

    ```


    and we will get our familiar "new file" window:


    ![](img/9aafc495f4afbc0a97de2b31a0d13f46_167_0.png)


    New file


    # Setting the Filetype


    At this point vim has no idea what kind of file we are creating. If we had named
    the filescript.sh the filetype plugin would have determined that we were editing
    a shell script. We can verify this by asking vim what the current filetype is:


    ```

    :set ft?

    ```


    When we use the set command this way, it displays the current value of an option—in
    this case the ft (short for filetype) option. It should respond with the following
    indicating that the ft option is unset:


    158 Vim, with Vigor'
