    ```


    # Macros


    With that bit of silliness out of the way, let''s look at how we can get a user
    menu entry to act on currently selected or tagged files. First, it helps to understand
    a little about how Midnight Commander executes user menu commands. It''s by writing
    the commands to a file (essentially a shell script) and then launching sh to execute
    the contents of the file. During the process of writing the file, Midnight Commander
    performs macro substitution, replacing embedded symbols in the menu entry with
    alternate values. These macros are single alph characters preceded by a percent
    sign. When Midnight Commander encounters one of these, it substitutes the value
    macro represents. Here are the most commonly used:


    | Macro | Meaning |

    | :--- | :--- |

    | %f | Selected file''s name |

    | %x | Selected file''s extension |

    | %b | Selected name''s stripped of extension (basename) |

    | %d | Name of the current directory |

    | %t | The list of tagged files |

    | %s | If files are tagged, they are used, else the selected file is used. |


    List of common macros


    Let''s say we wanted to create a user menu entry that would resize a JPEG image
    using the ever-hand convert program from the ImageMagick suite. Using macros,
    we could write a menu entry like this, which would act on the currently selected
    file:


    ```

    # Resize an image using convert

    Resize to fit within 800 pixel bounding square

    size=800

    convert "%f" -resize ${size}x${size} "%b-${size}.*"

    ```


    Using the %b and %x macros, we are able to construct a new output file name for
    the resized image. There is still one potential problem with this menu entry.
    It''s possible to run the menu command on a directory, or a non-image file (Doing
    so would not be good).


    We could include some extra code to ensure that %f is actually the name of an
    image file, but Midnight Commander also provides a method for only displaying
    menu entries appropriate to the currently selected (or tagged) file(s).'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# Conditionals


    Midnight Commander supports two types of conditionals that affect the behavior
    of a menu entry. The first, called an addition conditional determines if a menu
    entry is displayed. The second, default conditional sets the default entry on
    a menu.


    A conditional is added to a menu entry just before the first line. A conditional
    starts with either a += (for an addition) or a =(for a default) followed by one
    or more sub-conditions. Sub-conditions are separated by either i (meaning) or
    by & (meaning) and allowing us to express some complex logic. It is also possible
    to have a combined addition and default conditional by beginning the conditional
    with +=. Separate conditionals, one addition and one default, are also permitted
    preceding a menu entry.


    Let''s look at sub-conditions. They consist of one of the following:


    | Sub-condition | Description |

    | f pattern | Match currently selected file |

    | F pattern | Match last selected in other panel |

    | d pattern | Match currently selected directory |

    | D pattern | Match last selected directory in other panel |

    | t type | Type of currently selected file |

    | Type | Type of last selected file in other panel |

    | x filename | File executable |

    | ! sub-condition | Negate result of sub-condition |


    +   - List of sub-conditions


    pattern is either a shell pattern (i.e., wildcards) or a regular expression according
    to the global setting configured in the Options/Configuration dialog. This setting
    can be overridden by adding shell_patterns=0 as the first line of the menu file.
    A value of 1 uses shell patterns, while a value of 0 forces regular expressions
    instead.


    type is one or more of the following:


    | Type | Description |

    | r | regular file |

    | d | directory |

    | n | not a directory |

    | l | link |

    | x | executable file |

    | t | tagged |

    | c | character device |

    | b | block device |

    | f | FIFO (pipe) |

    | s | socket |


    +   - List of file types'
  merge: -1
  img_proc: true
