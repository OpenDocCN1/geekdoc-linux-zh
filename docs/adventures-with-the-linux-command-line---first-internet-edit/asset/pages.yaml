- pgno: 66
  md: '# 4 More Redirection


    As we learned in Chapter 6 of TLCL, I/O redirection is one of the most useful
    and powerful features of the shell. With redirection, our commands can send and
    receive streams of data to and from files and devices, as well as allow us to
    connect different programs together into pipelines.


    In this adventure, we will look at redirection in a little more depth to see how
    it works and to discover some additional features and useful redirection techniques.


    # What''s Really Going On


    Whenever a new program is run on the system, the kernel creates a table of file
    descriptors for the program to use. File descriptors are pointers to files. By
    convention, the first three in the descriptors (0, 1, and 2) are used as standard
    input (stdin), standard output (stdout), and standard error (stderr). Initially,
    all three descriptors point to the terminal device (which the system treats as
    a read/write file), so that standard input comes from the keyboard and standard
    output and standard error go to the terminal display.


    When a program is started as a child process of another (for instance, when we
    run an executable program in the shell), the newly launched program inherits a
    copy of the parent''s file descriptor table. Redirection is the process of manipulating
    the file descriptors so that input and output can be routed from/to different
    files.


    The shell hides the presence of file descriptors in common redirections such as:


    ```

    command > file

    ```


    Here we redirect standard output to a file, but the full syntax of the redirection
    operator includes an optional file descriptor. We could write the above statement
    this way and would have exactly the same effect:


    ```

    command 1 > file

    ```


    As a convenience, the shell assumes we want to redirect standard output if the
    file descriptor is omitted. Likewise, the following two statements are equivalent
    when referring to standard input:


    ```

    command < file

    ```


    ```

    command 0< file

    ```'
  merge: -1
  img_proc: true
- pgno: 67
  md: "# Duplicating File Descriptors\n\nIt is sometimes desirable to write more one\
    \ output stream (for example standard\noutput and standard error) to the same\
    \ file. To do this, we would write something like\nthis:\n\n```\ncommand > file\
    \ 2>&1\n```\n\nWe'll add the assumed file descriptor to the first redirection\
    \ to make things a little clearer:\n\n```\ncommand 1> file 2>&1\n```\n\nThis is\
    \ an example of duplication. When we read this statement, we see that file\ndescriptor\
    \ 1 is changed from redirection to the terminal device instead of pointing to\
    \ file.\nThis is followed by the second redirection that causes file descriptor\
    \ 2 to be a duplicate\n(i.e., points to the same file) of file descriptor 1. When\
    \ we look at this, it's\neasy to see how the order of redirections is important.\
    \ For example, if we reverse the\norder:\n\n```\ncommand 2>&1 1> file\n```\n\n\
    file descriptor 2 becomes a duplicate of file descriptor 1 (which points to the\
    \ terminal)\n then file descriptor 1 is set to point to file. The final result\
    \ is file descriptor 1 points to\nfile while file descriptor 2 still points to\
    \ the terminal.\n\n# exec\n\nBefore we go any further, we need to take a brief\
    \ detour and talk about a shell builtin that\nwe didn't cover in TLCL. This builtin\
    \ is named exec and it does some interesting things.\nIts main purpose is to terminate\
    \ the shell and launch another program in its place. This is\noften used in startup\
    \ scripts that initiate system services. However, it is not common in\nscripts\
    \ used for other purposes.\n\nUsage of exec is described below:\n\n```\nexec [program]\
    \ [redirections]\n```\n\nprogram is the name of the program that will start and\
    \ take the place of the shell.\nredirections are the redirections to be used by\
    \ the new program.\n\nOne feature of exec is useful for our study of redirection.\
    \ If program is omitted, any\nspecific redirections are performed on the current\
    \ shell. For example, if we included this\nbeginning of a script:\n\n```\nexec\
    \ 1> output.txt\n```\n\nfrom that point on, every command using standard output\
    \ would send its data to\noutput.txt. It should be noted that if this trick is\
    \ performed by a script, it is no longer\n\n58 More Redirection"
