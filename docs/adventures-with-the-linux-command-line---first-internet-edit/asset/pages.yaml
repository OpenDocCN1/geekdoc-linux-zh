    # # Tagging Files


    We have already seen how to select a file in the current directory panel by simply
    moving the highlight, but operating on a single file is not of much use. After
    all, we can perform those kinds of operations more easily by entering commands
    directly to the command line. However, we often want to operate on multiple files
    through tagging. When a file is tagged, it is marked for some later operation
    such as copying. This is why we choose to use a file manager like Midnight Commander.
    When one or more files are tagged, file operations (such as copying) are performed
    on the tagged files and selection has no effect.


    # # Tagging Individual Files


    To tag an individual file or directory, select it and press the `Insert` key.
    To untag it, press the `Insert` key again.


    # # Tagging Groups of Files


    To tag a group of files or directories according to a selection criteria, such
    as a wildcard pattern, press the + key. This will display a dialog where the pattern
    may be specified.


