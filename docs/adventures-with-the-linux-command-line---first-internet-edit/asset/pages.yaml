- pgno: 100
  md: '# 7 AWK


    One of the great things we can do in the shell is embed other programming languages
    within the body of our scripts. We have seen hints of this with the stream editor
    sed, and the arbitrary precision calculator program bc. By using the shell''s
    single quoting mechanism to isolate text from shell expansion, we can freely express
    other programming languages, provided we have a suitable language interpreter
    to execute them.


    In this adventure, we are going to look at one program, awk.


    # History


    The AWK programming language is truly one of the classic tools used in Unix. It
    dates back to the very earliest days of the Unix tradition. It was originally
    developed in the late 1970s at AT&T Bell Telephone Laboratories by Alfred Abo,
    Peter Weinberger, and Brian Kernighan. The name “AWK” comes from the last names
    of the three authors. It underwent many improvements in 1985 with the release
    of nawk or “new awk”. It is the version that we use today, though it is usually
    just called.


    # Availability


    awk is a standard program found in every Linux distribution. Two free/open source
    versions of the program are in common use. One is mawk (short for Mike''s awk,
    named for its author, Mike Brennan) and gawk (GNU awk). Both versions implement
    the 1985 nawk standard as well as a variety of extensions. For our purposes, either
    version is fine, since we will be focusing on the traditional nawk features. In
    most distributions, the awk is symbolically linked to either mawk or gawk.


    # So, What''s it Good For?


    Though AWK is fairly general purpose, it is designed to create filters, that accept
    standard input, transform data, and send it to output. In particular, AWK is good
    at processing columnar data. This makes it a good choice for developing report
    generators, and tools that are used to re-format data. Since it has regular expression
    support, it''s good for very small text extraction and reformatting programs,
    too. Like sed, any AWK programs are just one line long.


    In recent years, AWK has been a bit out of fashion, supplanted by other, interpreted
    languages such as Perl and python, but AWK still has some advantages:


    +   - It''s easy to learn. The language is not overly complex and has a syntax
    like C learning it will be useful in the future when we study other languages
    and tools.


    +   - It really excels at solving certain types of problems.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# How it Works


    The structure of an AWK program is somewhat unique among programming languages.
    Programs consist of a series of one or more pattern and action pairs. Before we
    get into that though, let''s look at what the AWK program does.


    We already know that the typical AWK program acts as a filter. It reads data from
    standard input, and outputs data on standard output. It reads data one record
    at a time. By default, a record is a line of text terminated by a newline character.
    Each time a record is read, AWK automatically separates the record into fields.
    Fields are, by default, by whitespace. Each field is assigned to a variable, which
    is given a numeric name. Variable $1 is the first field, $2 is the second field,
    and so on. $0 signifies the entire record. In addition, a variable named NF is
    set containing the number of fields detected in the record.


    Pattern/action pairs are tests and corresponding actions to be performed on each
    record. If the pattern is true, then the action is performed. When the list of
    patterns is exhausted, the AWK program reads the next record and the process is
    repeated.


    Let''s try a really simple case. We''ll filter the output of an ls command:


    ```

    linuxbox ~ $ ls -l /usr/bin | awk ''print $0''

    ```


    The AWK program is contained within the single quotes following the awk command.
    Single quotes are important because we do not want the shell to attempt any expansion
    on the AWK program, since its syntax has nothing to do with the shell. For example,
    $0 represents the value of the entire record AWK program read on standard input.
    In AWK, the $ means "field" and is not a trigger for parameter expansion as it
    is in the shell.


    Our example program consists of a single action with no pattern present. This
    is allowed and that every record matches the pattern. When we run this, it simply
    outputs every line of input like the cat command.


    If we look at a typical line of output from ls, we see that it consists of 9 fields,
    each separated by its one or more whitespace characters:


    ```

    -rwxr-xr-x 1 root root      265 Apr 17 2012 zxpdf

    ```


    Let''s add a pattern to our program so it will only print lines with more than
    9 fields:


    ```

    linuxbox ~ $ ls -l /usr/bin | awk ''NF > 9 (print $0)

    ```


    We now see a list of symbolic links in /usr/bin since those directory listings
    contain more than 9 entries. This pattern will also match entries with file names
    containing embedded spaces, they too will have more than 9 fields.


    # 12 AWK'
  merge: -1
  img_proc: true
- pgno: 102
  md: "# Special Patterns\n\nPatterns in AWK can have many forms. There are conditional\
    \ expressions like we have just seen. There are also regular expressions, as we\
    \ would expect. There are two special patterns called BEGIN and END. The BEGIN\
    \ pattern carries out its corresponding action before the first record is read.\
    \ This is useful for initializing variables, or printing headers at the beginning\
    \ of output. Likewise, the END pattern performs its corresponding action after\
    \ the last record is read from the input file. This is good for outputting summaries\
    \ once the input has been processed.\n\nLet's try a more elaborate example. We'll\
    \ assume for the moment that the directory does not contain any files with embedded\
    \ spaces (though this is never a safe assumption). We could use the following\
    \ script to list symbolic links:\n\n```\n#!/bin/bash\n\n# Print a directory report\n\
    s -l /usr/bin | awk '\nBEGIN {\n    print \"Directory Report\"\n    print \"====================\"\
    \n}\n\nNF > 9 {\n    print $9, \"is a symbolic link to\", $NF\n}\n\nEND {\n  \
    \  print \"====================\"\n    print \"End Of Report\"\n}'\n```\n\nIn\
    \ this example, we have 3 pattern/action pairs in our AWK program. The first is\
    \ a BEGIN pattern and its action prints the report header. We can spread the action\
    \ over several lines, though the opening brace “{” of the action must appear on\
    \ the same line as the pattern.\n\nThe second pattern tests the current record\
    \ to see if it contains more than 9 fields, and if true, the 9th field is printed,\
    \ followed by some text and the final field in the record. Notice how this was\
    \ done. The NF variable is preceded by a “$”, thus it refers to the NFth field\
    \ rather than the value of NF itself.\n\nLastly, we have an END pattern. Its corresponding\
    \ prints the “End Of Report” message once all the lines of input have been read."
  merge: -1
  img_proc: true
- pgno: 103
  md: "# Invocation\n\nThere are three ways we can run an AWK program. We have already\
    \ seen how to embed a program in a shell script by enclosing it inside single\
    \ quotes. The second way is to place the awk script in its own file and call it\
    \ from the awk program like so:\n\n```\nawk -f program_file\n```\n\nLastly, we\
    \ use the shebang mechanism to make the AWK script a standalone program like a\
    \ shell script:\n\n```\n#!/usr/bin/awk -f\n\n# Print a directory report\nBEGIN\
    \ {\n    print \"Directory Report\"\n    print \"====================\"\n}\nNF\
    \ > 9 {\n    print $9, \"is a symbolic link to\", $NF\n}\nEND {\n    print \"\
    ====================\"\n    print \"End Of Report\"\n}\n```\n\n# The Language\n\
    \nLet's take a look at the features and syntax of AWK programs.\n\n# Program Format\n\
    \nThe formatting rules for AWK programs are pretty simple. Actions consist of\
    \ one or more statements surrounded by braces {} with the starting brace appearing\
    \ on the same line as the pattern. Blank lines are ignored. Comments begin with\
    \ a pound sign (#) and appear at the end of any line. Long statements can be broken\
    \ into multiple lines using continuation characters (a backslash followed immediately\
    \ by a newline). Lists of parameters separated by commas can be broken after any\
    \ comma. Here is an example:\n\n```\nBEGIN { The action's opening brace must be\
    \ on same line as the pattern\n\n# Blank lines are ignored\n\n# Line continuation\
    \ characters can be used to break long lines \\\n\\\n$1, # Parameter lists may\
    \ be broken by commas,\n$2, # Comments can appear at the end of any line\n$3\n\
    \n# Multiple statements can appear on one line if separated by\n# a semicolon\n\
    print \"String 1\"; print \"String 2\"\n```"
