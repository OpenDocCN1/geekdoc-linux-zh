  md: '# Termux displaying builtin shell commands


    We can have dot files (like `.bashrc`) and even write shell scripts and compile
    and debug programs in Termux. Pretty neat.


    When executing `ssh`, Termux looks like `xterm-256color` terminal to remote systems.


    # Chrome/Chrome OS


    Google makes a decent SSH client for Chrome and Chrome OS (which is Linux, too,
    after all) that allows logging to remote systems. Called Secure Shell, it uses
    him (HTML Terminal, a terminal emulator written in JavaScript) combined with an
    SSH client. To remote systems, it looks like “xterm-256color” terminal. It works
    pretty well, but lacks some features that advanced SSH users need.


    Secure Shell is available at the Chrome Web Store.


    ![](img/9aafc495f4afbc0a97de2b31a0d13f46_148_0.png)


    Secure Shell running on Chrome OS


    # Summing Up


    Given that our terminal emulators are among our most vital tools, they should
    command more of our attention. There are many different terminal programs with
    potentially interesting and helpful features, of which most used rarely, if ever,
    to use. This is a shame since many of these features are truly *useful* to the
    busy command line user. We have looked at a few of the ways these features can
    be applied to our daily routine, but there are certainly many more.'
  merge: -1
  img_proc: true
