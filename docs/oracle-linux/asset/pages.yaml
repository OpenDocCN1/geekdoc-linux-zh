    Figure 6.2 – Simple website


    Next, repeat the process on the other web server. Once that system is up, we will
    set up the load balancer.


    # NOTE


    If you are using http (TLS/SSL) on your server, don''t forget to enable https
    in your local firewalls as well.


    # Load balancer


    For the single load-balancer system, we will need to install HAProxy. This is
    done using the dnf command as root:


    ```

    dnf install -y haproxy

    ```


    We need to open up port 80 in the firewall with the following command:


    ```

    firewall-cmd --permanent --add-service=http; firewall-cmd --reload

    ```


    We will need to edit the config file. The config file is located in /etc/happroxy/happroxy.cfg.


    The config file has two main sections, global and defaults. There can only be
    a single global section in the config file. This is where TLS/SSL config data,
    the logging configuration, and the user and group settings for the user running
    haproxy. By default, haproxy runs as the user haproxy with the group haproxy.
    For most cases, the global section should not need to be changed. An example is
    seen in the following figure:'
  merge: -1
  pgno: 197
- img_proc: true
  md: '# Global settings


    ```

    global

    # to have these messages end up in /var/log/hapxy.log you will

    # need to:

    #n# 1) configure syslog to accept network log events. This is done

    # by adding the ''-r'' option to the SYSLOGD_OPTIONS in

    # /etc/sysconfig/syslog

    #n# 2) configure local2 events to go to the /var/log/hapxy.log

    # file. A line like the following can be added to

    # /etc/sysconfig/syslog

    #n# local2.*               /var/log/hapxy.log

    log local2

    chroot /var/lib/hapxy

    pid /var/run/hapxy.pid

    maxconn 4000

    user hapxy

    group hapxy

    daemon hapxy

    # turn on stats unix socket

    stats /var/lib/hapxy-policies

    # utilize system-wide crypto-ciphers PROFILE-SYSTEM

    ssl-default-bind-ciphers PROFILE-SYSTEM

    ssl-default-server-ciphers PROFILE-SYSTEM

    ```


    Figure 6.3 - HAProxy global settings


    The next section, called the defaults section, is where you will make most of
    your edits. This is built using three sections: frontend, backend, and listen.


    The frontend section listens on all IP addresses and ports that are defined. This
    is what users connect to. A HAProxy server can have multiple frontend sections,
    though each needs a unique name and IP/port combination.


    The backend section defines the servers being load balanced, defining the load-balancing
    method as well as the servers and ports where traffic is sent to. A HAProxy server
    can have multiple backend sections, though each needs a unique name.


    The listen section is used to define how you can monitor the load balancer, with
    the port, URI, and authentication information needed to monitor HAProxy. Normally,
    you will have one listen section.'
