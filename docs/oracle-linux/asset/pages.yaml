  md: "Using a Compose file, you are able to control the startup order of your containers\
    \ using condition attributes. A nice way to ensure your database is up and running\
    \ (ready to accept connections) is to configure a health check against the database.\
    \ Once the health check succeeds, the database container will become healthy.\
    \ The application that requires the database can be configured not to start until\
    \ the database container enters a healthy state. This can be done using the `depends_on`\
    \ option.\n\nIf you wanted to add a health check to a PostgreSQL database, you\
    \ could configure that with following:\n\n```\nhealthcheck:\n  test: pg_isready\n\
    \  start_period: 5s\n  interval: 5s\n  timeout: 5s\n  retries: 5\n```\n\nThen,\
    \ for the application, you would simply specify the service name (in this example,\
    \ wikijs-db):\n\n```\ndepends_on:\n  wikijs-db:\n    condition: service_healthy\n\
    ```\n\nWhen these options are properly configured, you will no longer see repeated\
    \ connection failures as the application tries to connect to a database that isn't\
    \ ready, because the application container won't even start until the database\
    \ is healthy.\n\n# Tying it all together\n\nNow that we've discussed these database\
