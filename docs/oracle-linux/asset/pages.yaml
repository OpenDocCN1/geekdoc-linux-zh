    # Controlling the chaos


    Patching is a certain word to many, comfort to some, and necessary to all. There
    is certainly a rational fear regarding patching on when to patch, how to patch,
    and what to patch. The who, what, where, when, and how words apply here too. These
    concerns are legitimate; I mean who wants to patch? It can be messy, and it''s
    time-consuming. We may not be able to mitigate the concerns, but we can shorten
    the time taken to automate. This is one aspect where automation helps to speed
    up operations, and ease the frustration of having patch multiple environments.'
  merge: -1
  pgno: 429
- img_proc: true
  md: 'A common automation question is, "What can we do to minimize what we can, and
    what do we have to do manually?" The concept that we''ll be able to create a playbook
    for anything and automate everything is not realistic. Firstly, there are some
    things we wouldn''t want to automate, and that depends on who you work for, or
    your organization''s policies and standard operating procedures (SOPs) toward
    automation. I''ve worked with certain defense contractors and agencies that have
    multiple boards voting on what automations are allowed, and they were very particular
    on what was and wasn''t approved. However, overall, automation is a great equalizer
    in saving us time and energy.


    This recipe will walk through patching at a high level and help you understand
    how automation can go beyond, saving time and energy by automating repeatable
    steps.


    # Getting ready


    Before we institute any playbooks, we have to make sure we have all the prerequisites
    in place, including writing the playbook itself. In this case, we will write a
    basic playbook, update the YUM repository on two servers, and reboot those servers
    after the update is complete. This can be expanded into multiple OSs, kernels,
    and/or application patching – the sky’s the limit.


