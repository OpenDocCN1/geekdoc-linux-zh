  md: '# Access best practices & alternatives


    Using long-term credentials like access keys to improve your security. Consider
    using cases and alternatives.


    +   - Command Line Interface (CLI)

    You plan use this access key to enable the AWS CLI to access your AWS account.


    +   - Local code

    You plan use this access key to enable application code in a local development
    environment to access your AWS account.


    +   - Application running on AWS service

    You plan use this access key to enable application code running on an AWS service
    like EC2, Amazon ECS, AWS Lambda to access your AWS account.


    +   - Third-party service

    You plan use this access key to enable access for a third-party service that monitors
    or manages your AWS resources.


    +   - Application running outside AWS

    You plan use this access key to enable an application running on an on-premises
    host, or to use a local AWS client or third-party AWS plugin.


    +   - Other

    You your case is not listed here.


    > Alternatives recommended

    + AWS CloudShell, a browser-based CLI to run commands. Learn more

    + Use the AWS CLI V2 and enable authentication through a user in IAM Identity
    Center. Learn more


