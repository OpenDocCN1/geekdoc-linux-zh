  md: "For the same frontend, we will be listening on port 80 of the lb1 system, called\
    \ www_app, and will define this IP/port combination to use the www_servers backend.\n\
    \n# frontend\n\nThe frontend section of the HAProxy configuration file offers\
    \ various options for managing traffic behavior. These options can be used to\
    \ control the traffic on a frontend. Here are some used frontend options:\n\n\
    +   - bind: Defines the IP address and port which the frontend will listen for\
    \ incoming traffic. For example, bind *:80 listens on all IP addresses on port\
    \ 80.\n- mode: Specifies the mode of the frontend, as http, tcp, or ssl. For HTTP\
    \ traffic, use mode http. If you want to load balance a generic TCP port, use\
    \ mode tcp.\n- option: Enables or disables options for the frontend. Some commonly\
    \ used options are as follows:\n  - option httplog: Enables HTTP request/response\
    \ logging\n  - option dontnull: Prevents logging of requests with missing or empty\
    \ user-agent strings\n  - option forwardfor: Adds the client's IP address to the\
    \ HTTP request headers when using HTTP proxy mode\n  - option http-server-close:\
