    What does GRUB configuration do? It alters the OS and boots kernels. For example,
    let''s look at what changing the serial connection details accomplishes. We''re
    getting a little offcenter here; it''s impossible to understand how HCI works
    in worse-case scenarios. Imagine you can''t reach your server; the network is
    down, but the server is green and up. You can use a serial connection as a back
    door. The following `console` edit instructs the OS to allow an out-of-band connection
    to the VM:


    ```

    GRUB_TIMEOUT=5

    GRUB_DISTRIBUTOR="$6(sed ''s, release .*,$s/g'' /etc/system-release)"

    GRUB_DEFAULT=saved

    GRUB_DISABLE_SUBMENU=true

    GRUB_TERMINAL_OUTPUT="console"

    GRUB_DISABLE_RECOVERY="true"

    GRUB_ENABLE_BLSFG="true"


    GRUB_TIMEOUT=5

    GRUB_DISTRIBUTOR="$6(sed ''s, release .*,$s/g'' /etc/system-release)"

    GRUB_DEFAULT=saved

    GRUB_DISABLE_SUBMENU=true

    GRUB_TERMINAL="serial console"

    GRUB_TERMINAL_OUTPUT="console"

    GRUB_CMDLINE_LINUX="console console=ty80,115200"

    GRUB_DISABLE_RECOVERY="true"

    GRUB_ENABLE_BLSFG="true"

    GRUB_SERIAL_COMMAND="serial --unit=0 -speed=115200"

    ```'
