    # Validating adherence to a compliance policy


    Securing systems is much more than encrypting data at rest or in motion. Many
    configuration files should be checked, along with other common security settings.
    This can be done automatically with Security Content Automation Protocol (SCAP)
    files. SCAP is a standardized framework that is used to automate the process of
    maintaining the security of computer systems. It is a suite of specifications
    that provide a standardized approach to security automation, enabling organizations
    to implement consistent and repeatable security practices across their IT infrastructure.


    SCAP defines a common language for communicating security-related information,
    which allows security tools and products from different vendors to work together
    seamlessly. It includes a set of standards and guidelines for creating and sharing
    security content, such as vulnerability data, security checklists, and configuration
    baselines. Some of the key components of SCAP include the Common Vulnerabilities
    and Exposures (CVE) database, which is used to identify and track known security
    vulnerabilities, and the Common Configuration Enumeration (CCE) database, which
    provides a standardized method for identifying configuration settings that are
    relevant to security.


    The easiest way to do this is to use a tool OpenSCAP, which comes with Oracle
    Linux.


    # Getting ready


    As with the other test, we will need an Oracle Linux system to play with. Nothing
    else is required other than the ability for the system to access a dnf repository
    to install additional packages.


    # How to do it...


    The first step is to install OpenSCAP, usually by installing the entire suite
    of tools:


    +   - scap-workbench: A GUI

    - openscap-scanner: Scans systems

    - openscap: The OpenSCAP core

    - openscap-utils: Several command-line tools for scanning systems and containers

    - scap-security-guide: Commonly used SCAP files'
