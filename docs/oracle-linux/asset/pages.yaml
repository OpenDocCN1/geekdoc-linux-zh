- img_proc: true
  md: 'Secure Boot will establish a chain of trust by following this process:


    +   1. First, the first-stage bootloader (shim) is signed by Oracle and Microsoft
    is authenticated; then, it loads the GRUB 2 loader.


    +   2. The GRUB 2 bootloader validates the kernel signature signed by Oracle and
    authenticates it before loading and executing the kernel.


    +   3. The kernel signed by Oracle is authenticated and executed. Secure Boot
    loads signed/authenticated kernel modules only (for example, all kernel modules
    included with the kernel RPM and those used with Oracle Ksplice have the corresponding
    Oracle signatures and the signed/authenticated kernel module running,, or would
    not be loaded).


    Now that we have covered some basics of Secure Boot, let''s learn how to sign
    kernel modules by it. First, if you can sign a module, you will need to install
    several required packages, including the source for the kernel. Furthermore, you
    will need to create a signing certificate for a key pair. The private key is used
    to sign the kernel module, and a public key is also added to Secure Boot to a
    kernel keyring to allow the system to verify the signature.


    # Getting ready


    The first step is to install the UEK development libraries. This is done with
    the following command:


    ```

    [root@demo2 ~]# dnf install kernel-uek-devel-$(uname -r)`

    ```


    # NOTE


    While you can run dnf install kernel-uek-devel, adding the uname to the command
    makes sure that you install the devel packages for the kernel you are currently
    running. Also, don''t forget to make sure your devel packages are updated after
    you patch.


    As a good practice, it is always recommended to update the system to ensure that
    you have the most recent kernel and related packages available:


    ```

    [root@demo2 ~]# dnf - update

    ```


    This update can take some time, depending on when you last patched the system.


    If you are using the UEK, the kernel headers required to compile kernel modules
    are available in the kernel-uek-devel. When using the UEFI Secure Boot functionality,
    Oracle recommends installing and using the UEK. When installing the UEK, also
    install the devel packages. uname -r is added to the command to make sure correct
    headers are installed. This is important if you are not running on the latest
    kernel version. If you are using the RHCK, use kernel-devel instead of kernel-uek-devel.


    It is time to install the utilities required to perform the module signing operations
    (openssl, keyutils, mokutil, and pesign):'
