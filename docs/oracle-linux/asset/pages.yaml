    # Buildah and Skopeo – Podman’s friends with benefits


    The title of this chapter mentions Podman and Friends. Well, up until this point,
    you have probably noticed we didn’t talk about Podman’s friends. Podman brings
    a couple of companions to facilitate all your container management needs. These
    buddies of Podman are otherwise known as Buildah and Skopeo.


    Where Podman is primarily focused on running containers, Buildah focuses on building
    them, and Skopeo focuses on handling images and transferring them to/from remote
    container registries.


    # Getting ready


    We will require the following:


    +   - Oracle Linux

    - Podman

    - Buildah

    - Skopeo


    # How to do it...


    In this recipe, we’ll explore the basic usage of Buildah and Skopeo to reveal
    how these two friends of Podman can enhance your experience and workflow when
    dealing with containers.


    # Building container images with Buildah


    While Podman can be used for basic container image builds, Buildah is a utility
    that is fully focused on building OCI-compliant images. Not only can Buildah be
    used to build images from a Containerfile or Dockerfile, but it can also nearly
    change existing container images.


    First things first, let’s see how Buildah can be used to build images from a Containerfile.
    With Podman, we build images using the podman build -t <image_name>. When we call
    on Podman to perform a build, it is actually using a subset of Buildah’s functionality
    to build the image. To use Buildah directly, we only need to use a slightly different
    command. For example, let’s say we have a file named Containerfile with the following
    content:'
