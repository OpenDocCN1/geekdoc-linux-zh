    Ksplice also allows for automatic updates. They can be enabled or disabled by
    simply touching a file, or removing a file. If the /etc/utrack/disable file exists,
    Ksplice will not automatically update the system when you reboot. If the file
    is not there, Ksplice will check on reboot for any new KIDs and apply them. You
    can also modify this by updating the upgrade config file. This is covered later
    in this chapter.


    # How it works...


    When you are using Ksplice with internet access, the client connects to the Oracle
    ULN Ksplice system, and downloads and the required updates.


    # Using Ksplice with no internet access


    Not all systems have internet access. Then, it''s possible to use Ksplice against
    a local patch repository.


    # Getting ready'
