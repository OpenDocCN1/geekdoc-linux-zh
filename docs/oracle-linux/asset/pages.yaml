    \ automatically be downloaded when the `cron` job runs.\n\n# Creating a new RPM\
    \ package\n\nWhile Oracle provides a large number of RPMs, sometimes you just\
    \ need to create a custom RPM package that allows you to deploy your own software.\
    \ Creating an RPM file is easy to do!\n\n# Getting ready\n\nTo do this, you will\
    \ need a development system, running Oracle Linux 8, with access to the **Extra\
    \ Packages for Enterprise Linux (EPEL)** channel. It is highly recommended to\
    \ have a dedicated system to build RPMs on, and not to build RPM on production\
    \ systems. You will also need a system to testing the RPM on.\n\n> NOTE\n\nDepending\
    \ on the package being built, you may need additional channels, such as CodeReady\
    \ or Distro Builder.\n\n are a few things we need to do first – mainly, installing\
    \ the RPM developer tools. In order to do this, we will need to add the EPEL repo\
    \ to the system\n\nWhile most of the recipes in this book use the `root` user\
    \ for most of the work, this recipe will only use root for the installation of\
    \ the software. Perform the next few steps as `root`.\n\nTo add the EPEL repo,\
    \ run the following command:\n\n```\ndnf install oracle-epel-release-el8\n```\n\
    \n```\ndnf config-manager --enable ol8_developer_EPEL\ndf config-manager --enable\
    \ ol8_codeready_builder\ndf config-manager --enable ol8_distro_builder\n```\n\n\
    Next, we will install the basic utilities to build `rpm` files. Running the following\
    \ command to install these:\n\n```\ndnf install -y rpm-build yum-utils rpmdevtools\n\
    ```\n\nIf you are pulling software from Git, you may need to install `git` and\
    \ `git-lfs` (**Git Large File Storage**) software. The `gcc`, `make` and `python3-service-identity`\
    \ RPMs are also common. You can install all of these with the following command:"
