- img_proc: true
  md: 'Btrfs can do so much than the older XFS technology. This includes subvolumes,
    snapshots, and quotas. Btrfs subvolumes are an exceptional tool that allows users
    to create multiple snapshots or subfiles within a single Btrfs filesystem. These
    subvolumes are displayed as distinct directories in the filesystem hierarchy,
    which utilize the same storage space and can be managed independently.


    The flexibility and versatility of subvolumes make them ideal for various purposes,
    such as creating backups or isolating parts of the filesystem for easier management.
    Snapshots are particularly useful since they offer read-only copies of the filesystem
    at a specific point in time. With snapshots, users can restore files or entire
    subvolumes to a previous state or easily create replicable backups that can be
    moved to another system.


    Subvolumes also enable users to manage disk space more efficiently. For example,
    users can create a subvolume for a specific application or project and restrict
    its usage to a certain amount to prevent it from using too much space on the filesystem.
    Additionally, subvolumes can be used to implement access controls by assigning
    different permissions to different subvolumes or creating separate subvolumes
    for different users or groups. This recipe will go over how to do all of this.


    # Getting ready


    This recipe will require a Btrfs filesystem, and will use the data filesystem
    created in the previous recipe for the examples.


    # How to do it...


    In this recipe, we will do the following:


    +   1. Create a subvolume in /data and mount it.

    2. Set a quota on the subvolume.

    3. Create a snapshot.

    4. Enable compression.


    Creating a subvolume is straightforward and is done by using the btrfs command
    and specifying the full path to the subvolume:


    ```

    btrfs subvolume create /data/vol1

    ```


    Once created, simply add it to fstab, this time declaring the subvolume name in
    the fourth column. This is seen in the following screenshot, where /data/vol1
    is mounted using subvolume vol1:'
  merge: -1
  pgno: 140
- img_proc: true
  md: '```

