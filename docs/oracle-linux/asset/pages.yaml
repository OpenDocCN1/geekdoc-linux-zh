  md: '# 6 Eliminating All the SPOFs! An Exercise in Redundancy


    It''s crucial to have redundancy in your DR architecture to ensure smooth operations.
    Eliminating Single Points of Failure (SPOFs) is a common way to achieve this.
    Implementing High-Availability (HA) technology is one way to eliminate SPOFs.
    HA technology is crucial because it helps maintain operational continuity, enhance
    performance, improve reliability, facilitate Disaster Recovery (DR), build customer
    trust, and comply with regulations. With HA technology, minimizing downtime and
    ensuring continuous service availability is possible, contributing to overall
    success and competitiveness in today''s technology-driven world.


    # NOTE


    What about DR? We are not covering the failure of data centers in this chapter.
    That being said, the approach to implementing DR is very different from HA. When
    running in the cloud, look for such services as Oracle Full Stack Disaster Recovery
    Service that automate the DR process for the elite tech stack.


    The recipes in this chapter will help you eliminate SPOFs in your environment.
    We''ll start with a general overview of what HA is, as well as availability, and
    get into examples of how you can add redundancy to your application. The four
    most common technologies that are used to help eliminate SPOFs in applications
    are HAProxy, Corosync, Pacemaker, and ClusterFS. Each of these provide a specific
    set of features to help make an application highly available:


    +   - HAProxy: This is a load balancer, and allows you to balance web workloads
    between servers

    - Corosync: This is a communication system that enables communication to implement
    HA within applications

    - Pacemaker: Pacemaker is an open source resource manager that is used to build
    small and large clusters

    - ClusterFS: This is a scalable network filesystem that allows multiple nodes
    to read and write data to the same storage at the same time


    The following recipes will help you implement these common HA technologies. This
    includes everything from load-balancing applications and clustering applications
    to clustered storage and redundant networking:


    +   - Getting 99.999% availability and beyond

    - Load balancing a website

    - Making HAProxy highly available with Keepalived

    - HA clustering for all with Corosync and Pacemaker

    - Sharing a filesystem across multiple machines – cluster or distribute?'
  merge: -1
  pgno: 189
- img_proc: true
  md: '+   - Generating, configuring, and monitoring Ethernet traffic over bond


    # # Technical requirements


    For most of these recipes, you will need a pair of Oracle Linux 8 systems. As
    with most of these recipes, a VM on your desktop using a desktop virtualization
    product such as Oracle VirtualBox is recommended. A small VM is fine, with two
    cores, 2 GB RAM, and a few gigabytes of disk space. You will also need some additional
    disks assigned to the VM, ideally at least five sized disks. Before you start,
    patch your system to the latest packages available. This only takes a few minutes
    and can save a ton of time when troubleshooting issues that are caused by a bug.


    Many of the recipes in this book have their related configuration files available
    on GitHub https://github.com/PacktPublishing/Oracle-Linux-Cookbook.


    # # Getting 99.9999% availability and beyond


    This recipe will discuss the differences between DR and HA and how to architect
    HA solutions. Before we get into it, let''s refine the definition of a failure
    a few key terms:


    +   - High availability, or HA: This means protecting from the failure of a single
    component. Think of this as protecting against the failure of a system.

    - Disaster recovery, or DR: This is the failure of the data center or cloud region.

    - Availability nines: When referring to *nines of availability*, it is a way to
    quantify the uptime or reliability of a system by specifying the number of nines
    in the uptime percentage. Each *nine* represents a decimal place in the uptime
    percentage.


    Here’s a breakdown of the most commonly used *nines* and their corresponding uptime
    percentages, assuming 24x7x365 operations:


    | Nines | Downtime per Year | Downtime per Month |

    | 99 | 3d 14h 56m 18s | 7h 14m 41s |

    | 99.9 | 8h 41m 38s | 43m 28s |

    | 99.99 | 52m 10s | 4m 21s |

    | 99.999 | 5m 13s | 26s |

    | 99.9999 | 31s | 2.6s |


    Table 6.1 – Nines downtime'
  merge: -1
  pgno: 190
- img_proc: true
  md: 'In the preceding table, each additional nine for the uptime percentage signifies
    a higher level of availability and a reduced tolerance for downtime. Achieving
    higher numbers of nines typically requires implementing redundant systems, failover
    mechanisms, and rigorous maintenance practices to minimize downtime and ensure
    continuous operation. In addition, when setting up a Service-Level Agreement (SLA),
    you can also uptime during business hours and exclude maintenance. For example,
    using a working schedule of Monday through Friday with 12 working hours a day,
    and 10 holidays off per year, the matrix would look very different!


    | Nines | Downtime per Year | Downtime per Month |

    | 99 | 1d 7h 2m 58s | 2h 35m 14s |

    | 99.9 | 3h 6m 18s | 15m 31s |

    | 99.99 | 1m 38s | 1m 33s |

    | 99.999 | 1m 52s | 9s |

    | 99.9999 | 11s | 1s |


    Table 6.2 – Business hours downtime


    # NOTE


    When setting SLAs with the business, carefully understand the differences between
    including maintenance windows and operational hours within the SLA.


    # Getting ready


    When designing HA systems, there are several considerations that need to be taken
    into account to ensure the system is resilient and can handle failures. Here are
    some key considerations:


    +   - **Redundancy:** Having redundancy in HA systems is essential. It requires
    replicating components or whole systems to eliminate potential SPOFs. At different
    levels, such as hardware, software, and network infrastructure. To minimize the
    impact of localized failures, it''s crucial to distribute redundant components
    across different physical locations.


    +   - **Failover and load balancing:** It is important for HA systems to be equipped
    with failover mechanisms that enable automatic switching to a backup system whenever
    a failure occurs. One way to achieve this is through replicating data and services
    across multiple servers, coupled with the use of load-balancing techniques that
    ensure the even distribution of workload. With load balancing, traffic can be
    easily redirected to available servers in the event of a server failure.


    +   - **Scalability:** When designing HA systems, it is important to ensure that
    they can handle increased workloads and scale effortlessly. This can be achieved
    through horizontal scaling, which entails adding more servers to distribute the
    load, or vertical scaling.'
  merge: -1
  pgno: 191
- img_proc: true
  md: 'which involves adding resources to existing servers. Additionally, the system
    should be capable of dynamically adjusting resource allocation based on demand
    to prevent overloading.


    +   - Data replication and backup: Maintaining data integrity and availability
    is crucial for HA systems. To ensure that data can be accessed in case of a system
    failure, it is essential to replicate data across multiple storage systems or
    databases. Additionally, performing backups is vital to safeguard against data
    loss or corruption.


    +   - Fault tolerance: Systems used for highly available architectures should
    have fault tolerance, which means they must be able to function even if specific
    components or subsystems malfunction. Achieving this requires creating a system
    that can manage errors with ease, recover automatically, and ensure continuity
    of service.


    +   - Disaster recovery: Having a DR plan is crucial for HA systems to defend
    against catastrophic events such as natural disasters or widespread outages. This
    plan entails generating off-site backups, setting up secondary data centers, and
    relying on cloud-based services to guarantee continuity, amid extreme situations.


    +   - Documentation and testing: It is crucial to document the system architecture,
    configurations, and to effectively troubleshoot and maintain the HA system. Regular
    testing, such as failover tests, load testing, and DR drills, plays a significant
    role in identifying potential issues and ensuring the system operates as intended
    in various scenarios.


    +   - Cost and complexity: Designing, implementing, and maintaining HA systems
    can be both complex and costly. It is important to carefully consider the available
    budget, as well as the expertise and resources required to effectively manage
    and monitor the system.


    By addressing these considerations, you can design a robust and resilient HA system
    that ensures HA, fault tolerance, and continuity of critical services.


    # How to do it...


    As a rule, you should pick the right technology for the right subsystem and application.


    When aiming to achieve HA for a web application, the first step is to place a
    load balancer in front of the web servers. This enables scaling of the application
    while also offering some fault tolerance for these systems. However, attention
    should also be given to the data tier, which can be addressed by clustering the
    database or building a cluster capable of running the database, depending on the
    limitations of the database technology.


    If you are utilizing a technology such as Oracle Database, you have the option
    to establish a database-specific cluster known as Oracle Real Application Clusters
    (Oracle RAC). This cluster allows for both scalability and availability. With
    RAC, the database remains accessible for queries as long as one is online. Other
    databases may utilize their own exclusive clustering technology (such as MySQL
    Cluster), you may opt to utilize generic cluster technologies such as Pacemaker
    for cluster management and Corync for inter-cluster communications. This approach
    presents the advantage of enabling almost any technology to be made highly available
    in a Linux environment.'
  merge: -1
  pgno: 192
- img_proc: true
  md: 'You can achieve HA in storage by implementing filesystems across the entire
    cluster. Gluster allows you to mount a filesystem across multiple servers, while
    at the same time replicating the storage across servers. This provides both scalability
    and reliability at the filesystem level.


    Finally, the network is a common point of failure, and using network bonding technologies
    can enable both HA as well as scaling abilities. This works by combining at least
    two network ports into a single virtual port.


    # NOTE


    The best HA architectures mix these approaches to cover the entire technology
    stack.


    # Load balancing as a website


    Nowadays, most applications are web-based, whether it''s a traditional web interface
    or a RESTful API. The first tier is typically set up for HA using a load balancer.
    A balancer is a system that distributes incoming traffic or workload across multiple
    servers or resources. Its main goal is to optimize resource utilization, improve
    performance, and ensure the reliability and availability of applications or services.
    When multiple servers are involved in serving a particular application or service,
    a load balancer acts as an intermediary between the client and the server. It
    receives incoming requests from clients and intelligently distributes them across
    the available servers based on various algorithms, such as round-robin, least
    connections, or weighted distribution.


    The load balancer is responsible for ensuring the servers'' optimal health and
    performance by redirecting traffic from overloaded or problematic servers. This
    distribution of workloads helps to prevent any server from getting overwhelmed,
    enhancing response time and overall system capacity and scalability.


    # NOTE


    While a load balancer can help distribute the workloads, the actual server load
    is based on other factors, so do not expect all servers to have the same utilization
    of CPU, RAM, and so on.


    Load balancers not only distribute traffic but also offer advanced features, such
    as SSL termination, session persistence, caching, and content routing. They are
    extensively used in web applications, cloud-based services, and other environments
    that demand HA and scalability.


    One of the most popular load balancers is HAProxy.


    HAProxy is a great open source load-balancer option. Standing for High Availability
    Proxy, HAProxy is widely used due to its excellent performance and ability to
    improve the availability and scalability of applications. Operating at the application
    layer (Layer 7) of the OSI model, this software is able to make routing decisions
    based on specific application-level health information, such as'
  merge: -1
  pgno: 193
- img_proc: true
  md: 'HTTP headers and cookies. Compared to traditional network-level (Layer 4) load
    balancers, HAProxy allows for more advanced load-balancing and traffic-routing
    capabilities.


    Some key features and capabilities of HAProxy include the following:


    +   - **Load balancing**: With HAProxy, incoming traffic can be evenly distributed
    across multiple servers using various algorithms, such as round-robin, least connections,
    and source IP, among others.

    - **High availability**: One of the beneficial features of HAProxy is its ability
    to support active-passive failover setups. In the event the active server becomes
    unstable, a standby server will take over. Additionally, it also has the capability
    to monitor the health of servers and make automatic adjustments to the load-balancing
    pool by adding or removing servers.

    - **Proxying**: One of HAProxy''s primary functions is to act as a reverse proxy,
    which involves receiving client requests and directing them to the correct backend
    servers. Additionally, it can function as a forward proxy by intercepting client
    requests and directing them to external servers.

    - **SSL/TLS termination**: With HAProxy, SSL/TLS encryption and decryption can
    be efficiently managed, taking the load off of the backend servers.

    - **Session persistence**: HAProxy is capable of preserving session affinity by
    routing follow-up requests from a client to the same backend server, thus guaranteeing
    the proper operation of session-based applications.

    - **Health checks and monitoring**: To guarantee the availability and optimal
    performance of backend servers, HAProxy conducts routine health checks. It has
    the ability to identify failed servers and exclude them from the load-balancing
    pool.

    - **Logging and statistics**: With HAProxy, administrators can effectively monitor
    and analyze traffic patterns, performance metrics, and error conditions. Its detailed
    logging and statistics feature makes this possible.


    HAProxy can be deployed on various operating systems and is often used in high-traffic
    web environments, cloud infrastructure, and containerized deployments. Its versatility
    and extensive feature set make it a powerful tool for managing and optimizing
    application traffic and open source-based load balancers.


    For this recipe, we will put HAProxy (as the load balancer) and two identical
    web servers to balance traffic to:'
