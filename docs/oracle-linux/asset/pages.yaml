  md: "Run your playbook:\n\n[ocm@olan-target-1 ~]$ ansible-playbook -i inventory\
    \ pact.yml\n********************************************************************************\n\
    PLAY [all] *****************************************************************\n\
    TASK [Gathering Facts] [WARNING]: Platform on host olam-target-2 is using the\
    \ discovered Python interpreter at /usr/bin/python, but future installation of\
    \ another Python interpreter could change this. See https://docs.ansible.com/ansible/2.14.2/reference/inventory_discovery.html\
    \ for more information.\nok: [olan-target-2]\nTASK [Print message]\nok: [olan-target-2]\
    \ => {\n  \"msg\": \"Hello from Packt Oracle Linux # Cookbook\"\n}\nPLAY RECAP\
    \ *****************************************************************\nolam-target-2:\
    \ ok=2 changed=0 unreachable=0 failed=0 skipped=0\nignored=0\n\n# # Set it and\
    \ forget it\n\nIn Ansible playbooks, loops provide flexibility and efficiency\
    \ to automate Oracle Linux environments through OLAM. Users can define dictionaries\
    \ in their playbooks and use loop statements. Dictionaries are like books, with\
    \ all your infrastructure or applications in lists, and can be used to define\
    \ variables in an automation. This allows a set of tasks to be executed for each\
    \ item in the loop, reducing the need for repetitive coding and making playbooks\
    \ more concise and manageable.\n\nFor instance, if you want to install multiple\
    \ packages on a group of Oracle Linux servers without loops, you would need to\
    \ write separate tasks for each package and server. However, by using loops in\
    \ OLAM with Ansible, you can define a list of packages and a list of servers and\
    \ iterate over them, installing the packages on each server in a single task.\n\
    \n# # Getting ready\n\nIn the previous recipe, we've seen that OLAM has additional\
    \ features and capabilities to enhance automation capabilities, through either\
    \ the web-based UI or the command line. Users can granularly and visually define\
    \ and manage their automation workflows, simplifying the process of creating and\
    \ managing complex automation tasks. Furthermore, this provides a centralized\
    \ platform to manage and monitor the execution of Ansible playbooks.\n\nIn the\
    \ following example, we have two sample servers, the same target-1 and target-2\
    \ servers from the previous recipe, and we need to change the permissions of a\
    \ specific user on both servers. Without loops, we would need to write separate\
    \ tasks for each server, resulting in redundant code. However, by utilizing loops,\
    \ we can simplify the playbook and make it more efficient."
  merge: -1
  pgno: 447
- img_proc: true
  md: "In this example, we will start by defining the playbook's name and the target\
    \ hosts, using the hosts directive. We will also set become as true, indicating\
    \ that the playbook should run with administrative privileges.\n\n```\n```yaml\n\
    name: Change User Permissions\nhosts: server_group\nbecome: true\nvars:\n  target_users:\n\
    \    - user1\n    - user2\ntasks:\n  - name: Change user permissions\n    file:\n\
    \      path: /home/{{ item }}/documents\n      owner: {{ item }}\n      group:\
    \ {{ item }}\n      mode: \"0755\"\n    with_items: \"{{ target_users }}\"\n```\n\
    ```\n\nNext, we define a variable, target_users, which contains a list of users\
    \ whom we want to change permissions. In this case, we use user1 and user2 as\
    \ our target users.\n\nThe tasks section contains a single task Change user permissions.\
    \ This task uses the file module to change the ownership, group, and mode of the\
    \ specified directory.\n\nThe with_items loop is used to iterate over the target_users\
    \ list. Each iteration of the loop sets the item variable to the current user\
    \ used from the list. This is then used in the path, owner, and group parameters\
    \ of the file module.\n\nBy using this, the playbook will execute the task for\
    \ each user in the target_users list, effectively changing the permissions for\
    \ both user and folder permissions.\n\n```\n```yaml\nname: Change user permissions\n\
    hosts: all\ntasks:\n  - name: Change permissions for users\n    file:\n      path:\
    \ /path/to/directory\n      owner: \"{{ item }}\"\n      state: directory\nloop:\
    \ \"{{ users }}\"\n```\n```\n\nIn the preceding example, file is used to change\
