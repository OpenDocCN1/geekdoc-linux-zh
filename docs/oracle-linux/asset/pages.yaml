    \ I can certainly see advantages to using Skopeo, especially when\nworking with\
    \ larger images and/or needing to inspect images in an automated CI pipeline.\n\
    \n# Handling remote images with Skopeo\n\nSkopeo can also be used to transfer\
    \ images from one remote container repository to\nanother, without needing to\
    \ pull/download it locally. The syntax is similar to the standard Linux\ncp command.\
    \ In cp, we use cp <source> <destination>, and with Skopeo we use skopeo copy\n\
    <source> <destination>. As an example, if we want to copy the pandoc/core image\
    \ from one\nregistry to another, we need to do this in:\n\n```\nskopeo copy docker://docker.io/pandoc/core:latest\
    \ example.com/pandoc/core:latest\n```\n\nLikewise, we can also transfer it to\
    \ our local Podman container storage through the use of\ncontainers-storage prefix,\
    \ for example:\n\n```\nskopeo copy docker://docker.io/pandoc/core:latest containers-storage:pandoc/core:latest\n\
    ```\n\nAdditionally, if we wanted to specify some other location, we could simply\
    \ use the dir prefix\nfollowed by the path. But in this case, be sure paths exist\
    \ prior omit any characters that are\nincompatible with the Linux filesystem,\
    \ for example:\n\n```\nmkdir -p $(pwd)/pandoc/core\nskopeo copy docker://docker.io/pandoc/core:latest\
    \ dir:$(pwd)/pandoc/core\n```"
  merge: -1
  pgno: 378
- img_proc: true
  md: 'Lastly, Skopeo can also be used to delete images from remote repositories or
    from local container storage. To do this, simply run the following:


    ```

    skopeo delete containers-storage:pandoc:core:latest

    ```'
