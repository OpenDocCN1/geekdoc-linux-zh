    +   - **services**: cockpit dhcpv6-client ssh: This line lists the services that
    are allowed to access the firewall zone. In this example, incoming traffic for
    the cockpit, dhcpv6-client, and ssh services are allowed.


    +   - **ports**: This line shows the TCP and UDP ports that are allowed to access
    the firewall zone. If no ports are defined, this line will be blank.


    +   - **protocols**: This line shows protocols, such as TCP/UDP/ICMP, that are
    managed at a protocol level.


    +   - **forward**: no: This line indicates whether forwarding is enabled or disabled
    for the firewall zone.


    +   - **masquerade**: no: This line indicates whether masquerading is enabled
    or disabled for the firewall zone. Masquerading allows packets from one network
    to appear as if they come from another.


    +   - **forward-ports**: This line shows which forwarded ports are defined for
    the firewall zone. Forwarded ports allow incoming traffic on a specific port to
    be redirected to a different port or IP address.


    +   - **source-ports**: This line shows any source ports that are defined for
    the firewall zone. Source ports allow incoming traffic from a specific port to
    be redirected to a different port or IP address.


    +   - **icmp-blocks**: This line displays any Internet Control Message Protocol
    (ICMP) packets that are blocked by the firewall. ICMP packets are used for network
    diagnostics and troubleshooting.


    +   - **rich rules**: This line shows any rules that are defined for the firewall
    zone. Rich rules allow more complex rules to be defined using a syntax that is
    similar to the iptables syntax.


    Adding new rules is easy to do. A rule can be added using the service name (found
    in the /etc/services) or the port number. The most common task is to add a common
    user service, such as mysql. This is done by adding the --add-service option to
    the command. When the service is added, the configuration will not survive a reboot
    unless the --permanent option is added. Some common examples are:


    ```

    firewall-cmd --permanent --add-service=http

    firewall-cmd --permanent --add-service=imap

    firewall-cmd --permanent --add-service=pop

    firewall-cmd --permanent --add-service=mysql

    ```


    Additionally, you can specify the protocol and port to allow the service. The
    following are examples of adding TCP or UDP ports:


    ```

    firewall-cmd --permanent --add-port=1521/TCP

    firewall-cmd --permanent --add-port=6900/UDP

    ```


    You can also remove a port or service by using the --remove-port or --remove-service
    options:


    ```

    firewall-cmd --permanent --remove-service=pop

    firewall-cmd --permanent --remove-port=6900/UDP

    ```'
