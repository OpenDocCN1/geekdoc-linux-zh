  md: "In this recipe, we're going to use Packer to start from source media (such\
    \ as an ISO) to create our very own Vagrant box from scratch.\n\n# Getting started\n\
    \nYou will need the following for this recipe:\n\n+   - Oracle Linux\n- Oracle\
    \ VM VirtualBox\n- Packer\n\nRefer to the Technical requirements section at the\
    \ beginning of this chapter if you need help installing Oracle VM VirtualBox and\
    \ Packer.\n\n# How to do it...\n\nMore than that, you can search the Vagrant catalog\
    \ and find pre-made Vagrantfiles containing the operating system you're looking\
    \ for. But what happens if we is not there? Or Maybe you don't trust the author\
    \ of the Vagrantfile and/or you simply prefer to create your own. You can do this\
    \ manually, or you can do this entirely with code; by leveraging Packer. In this\
    \ recipe, we'll use Packer to make a fresh Vagrant box from the Oracle Linux 8.8\
    \ source ISO. At a high level, Packer will download the ISO image for the operating\
    \ system we wish to use, it will then spin up a VM using Oracle VM VirtualBox\
    \ and install the VM. Afterward, it will export the VM in Open Virtualization\
    \ Format (OVF). Finally, it will compress this file and convert it into a Vagrant\
    \ box.\n\n# Oracle Linux 8 kickstart file\n\n+   1. For this might, you'll need\
    \ to create a kickstart file to automate the installation of the ISO. You can\
    \ create your own, or use one from the Oracle Linux Image Tools found in the official\
    \ Oracle Linux repository on GitHub. For this recipe, I'll be using one from the\
    \ Oracle Linux Image Tools\n\n```\nhttps://github.com/oracle/oracle-linux/blob/main/oracle-linux-image-tools/dist/ol8-slim/ol8-ks.cfg\n\
    ```\n\n+   2. Now, to start with this we'll create a new directory ol8-vagrant.\
    \ In this directory, create a Packer file and name it vagrant-ol8.pkr.hcl, and\
    \ go ahead and create a folder called and place the kickstart file there. Once\
    \ this is done, your file structure should look like:\n\n```\nvagrant-ol8\n  ├──\
    \ http\n  |     └── ol8-ks.cfg\n  └── vagrant-ol8.pkr.hcl\n```"
