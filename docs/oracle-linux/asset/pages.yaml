    Here, the installed kernel is patched in the same way, replacing the 5.4.17-2136.302.7.2.1.el8aarch64,
    but the effective kernel that has been Kspliced is a newer kernel at version 5.4.17-2136.306.1.3.el8uek.
    This is normal behavior with Ksplice.


