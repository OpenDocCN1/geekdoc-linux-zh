  md: '# Entrypoint


    The entrypoint of a container defines what command the container will run by default.
    You can find the entrypoint of a container by specifying the `inspect` command
    and piping that to `jq` to extract only the entrypoint.


    First, pull the image if you don''t already have it on your system:


    ```

    $ podman pull docker.io/pandoc/core

    ```


    Now let''s inspect the output and run `jq -r` to query for the entrypoint:


    ```

    $ podman image inspect pandoc/core | jq -r ''.[Config.Entrypoint[0]''

    ```


    **Bonus:** Let''s assume we do not have jq installed on our computer. In this
    case, we can pipe the output of an inspect to a container that contains jq:


    ```

    $ podman image inspect pandoc/core | podman run -i --rm stedolan/jq -r ''.[Config.Entrypoint[]]''

    ```


    In either case, the output of this command will be `/usr/local/bin/pandoc`.\This
    tells us that the default command executed will be `/usr/local/bin/pandoc`.


    Sometimes, a container''s entrypoint might be a script. For example, you might
    check for the entrypoint and learn the entrypoint is `docker-entrypoint.sh`. You
    can reveal more about this file by overriding the entrypoint and using `cat` to
    see the contents of the file. For example, let''s say we want to inspect the `node`
    container image:


    ```

    $ podman image inspect node | jq -r ''.[Config.Entrypoint[]]''

    ```


    We would find that the entrypoint is `docker-entrypoint.sh`.


    Now, let''s override the entrypoint to examine the contents of this file:


    ```

    $ podman run --rm --entrypoint=/bin/bash node -c ''cat docker-entrypoint.sh''

    ```


    In this case, the output is the:


    ```

    cat: docker-entrypoint.sh: No such file or directory

    ```


    This is because of the `node` image, the `docker-entrypoint.sh` file is not in
    the working directory; instead, it is in the path. So, we''ll try another way
    to examine this file:


    ```

    $ podman run --rm --entrypoint=/bin/bash node -c ''$(which docker-entrypoint.sh)''

    ```


    The output will be as follows:'
