  md: '![](img/110fa0d6324f0893fff03cee6394144d_501_0.png)


    Figure 13.61 – Image selection


    After you choose your VM, you must configure the format in export the VM. We''re
    going to expand the **Format** dropdown, as shown in the following screenshot.
    The format being chosen is Oracle Cloud Infrastructure, as we''re migrating our
    VM to OCI. As a side note, exports aren''t only for OCI. You can export a VM as
    an OVF to a myriad of platforms, for example, VMware, OLVM, KVM, HyperV or AWS.
    As mentioned at the beginning of this recipe, OVF and OVA both reflect somewhat
    the same concept: they say, "here''s an exported environment and here''s how to
    put it back together." There are, however, differences between OVF and OVA. OVA
    can be viewed as a group of files making up an environment, with an attached manifest
    identifying the files and how they are used. OVA is a single file; consider it
    in a box, an already-built environment ready to be imported. Both can be used
    outside of OCI, but in this case, we''re going to concentrate on an OCI export
    using `.ova` as the file extension.'
