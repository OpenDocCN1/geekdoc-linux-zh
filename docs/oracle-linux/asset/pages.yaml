- img_proc: true
  md: "become the interface between your hardware and the operating system, replacing\
    \ legacy BIOS firmware that was previously the industry default. A feature of\
    \ UEFI is Secure Boot, which ensures that your system boots by only using software\
    \ trusted by the hardware manufacturer of your system. In addition, it provides\
    \ a verification mechanism (by verifying each piece of boot software using cryptographic\
    \ checksums and signatures) to ensure that the code is launched is by validating\
    \ the boot loader before executing it (even before loading the operating system).\
    \ If the feature is available, UEFI systems can also boot in legacy BIOS mode\
    \ via a compatibility support module.\n\n# Getting ready\n\nTo boot in UEFI mode,\
    \ Oracle Linux requires the UEFI firmware to be present during the system installation\
    \ as it is detected at time. A GPT is automatically set up, creating an ESP at\
    \ /boot/efi mount, which contains the files needed for the UEFI booting. GPT is\
    \ a way of storing information on a drive that includes information such as partitions\
    \ begin and end on a physical disk. GPT't suffer from MBR's limits, such as the\
    \ number of partitions and the drivers' size, with size limits depending on the\
    \ operating system and its filesystems. Note that GPT is the type of partition\
    \ table required by UEFI and was initiated by Intel.\n\n# MBR versus GPT\n\nWhen\
    \ it comes to partitioning schemes on storage devices such as hard drives and\
    \ solid-state drives, MBR and GPT are two distinct options. To help distinguish\
    \ between the two, here are the primary differences in capacity:\n\n+   - Partitioning\
    \ capacity:\n  - MBR: Your computer's MBR allows either four primary partitions\
    \ or three primary partitions and one extended partition, which can further divided\
    \ into multiple logical partitions. However, it does have a capacity restriction\
    \ of a maximum size of 2 TB.\n  - GPT: By default, GPT can support up to 128 partitions\
    \ and is not limited in terms of partition count. Additionally, it can accommodate\
    \ larger sizes of up to 9.4 ZB.\n\n+   - Compatibility:\n  - MBR: MBR provides\
    \ improved compatibility with legacy systems and operating systems. It is widely\
    \ supported by BIOS-based computers, as well as old versions of Windows and Linux.\n\
    \  - GPT: Modern systems, especially those utilizing UEFI instead of BIOS, exhibit\
    \ better compatibility with GPT. This partitioning scheme is backed by most contemporary\
    \ operating systems, such as Windows, macOS, and Linux."
