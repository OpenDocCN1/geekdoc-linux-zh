    Once done, perform a normal dnf update and reboot the system. This dnf update
    is required to

    the Ksplice-aware user libraries are loaded; it is only required the first time
    Ksplice is used.


    Once the server is rebooted, Ksplice can be used to patch user libraries and the
    kernel.


    To see what updates are available for the kernel, you can run the Ksplice kernel
    upgrade command,

    passing -n for no action:


    ```

    ksplice -n kernel upgrade

    ```


    The output from this command is seen in the following screenshot:


    ```

    root@arm2 ~# ksplice kernel upgrade

    Effective kernel version is 5.4.17-2136.306.1.3.el8uek

    The following steps will be taken:

    Install [juh90lc4c] CVE-2021-4034: Privilege escalation in pkexec.

    root@arm2 ~#

    root@arm2 ~#

    root@arm2 ~#

    ```


    > Figure 7 - Ksplice available updates


    In this system, only one update is available, patching CVE-2021-4034. To splice
    the system, run the

    same command, replacing -n with -y to say yes to applying to the kernel path:


    ```

    root@arm2 ~# ksplice -y kernel upgrade

    The following steps will be taken:

    Install [juh90lc4c] CVE-2021-4034: Privilege escalation in pkexec.

    Installing [juh90lc4c] CVE-2021-4034: Privilege escalation in pkexec.

    Your kernel is fully up to date.

    Effective kernel version is 5.4.17-2136.306.1.3.el8uek

    root@arm2 ~#

    ```


    > Figure 7.8 – Ksplice updating the kernel


    Here, you can see that the CVE patch has now taken place without a reboot!


    The kernel that has been patched is referred to the effective kernel. When you
    use the ksplice

    kernel -r command in Ksplice, it displays the effective kernel version, which
    indicates the

    current security status of the kernel based on the applied patches. This version
    varies from

    the initially booted kernel and is meant to reflect the present condition of the
    kernel regarding

    any potential security threats or major issues.


    You can now validate that your effective kernel is by using the following Ksplice
    kernel command:


    ```

    kspl kernel show

    ```'
