    Once we understand the platform, we need to make another decision on what version
    to use. Sometimes you may be able to download older versions and you want to verify
    that the release will be supported. At the time of writing, while release 6 can
    be downloaded, support is available if you have purchased Extended Support, which
    is only available until June 2024.


    # NOTE


    Extended Support from Oracle allows you to pay a fee in order to get support,
    including patches and fixes for critical security issues and select high-impact
    critical bugs. This support does not cover all RPMs. Given this, you may want
    to reconsider downloading and older versions of Linux and avoid delaying upgrading
    the OS past the point of it being generally available. The value of Extended Support
    is that it can give you time to upgrade applications that require older versions
    of Oracle Linux.


    Before you pick a release, check with your application to verify the version is
    supported. There are differences between the major number (7 versus 8, etc.) and
    some software may not be available on all major release numbers. Example is Oracle
    Linux Automation Manager (this gives you centralized Ansible control, based the
    AWX project, and is almost identical to Tower from Red Hat), which requires Oracle
    Linux 8. Another example is Oracle Linux Manager (aka Spacewalk), which requires
    Oracle Linux 7 for the server.


    # NOTE


    Since Oracle Linux tracks Red Hat Enterprise Linux, the major and minor numbers
    are identical. Oracle Linux 7.10 is the same as Red Hat Enterprise Linux 7.10.


    # Burning an ISO so it''s bootable'
