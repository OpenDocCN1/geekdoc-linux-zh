  md: '# 9


    # Keeping the Data Safe – Securing a System


    No one wants to be the headline news story, especially when their data is stolen.
    One of the best ways to help protect your data is to secure the operating system
    and its services. Securing is often compared to an onion, as there are multiple
    layers that are difficult to peel open, each providing defense against bad actors.
    When bad actors attack your data, it''s not always to steal; it''s often to change
    it as well. To make matters worse, when you move to the cloud, you have to protect
    not only against internal threats, such as rogue contractors or employees, and
    external threats, such as hackers attacking the systems, but you also have to
    protect your data cloud provider as well. In security, you never know who is the
    bad actor!


    It is not just protecting your systems against bad actors; many industries also
    require a security stance. This is common with healthcare, which often requires
    security controls for compliance with the Health Insurance Portability and Accountability
    Act (HIPAA). Businesses that process credit cards must meet the Payment Card Data
    Security Standard (PCI-DSS) principles, and many governmental organizations must
    implement security standards to be compliant with the Federal Risk and Authorization
    Management Program (FedRAMP) for their cloud workloads.


    # NOTE


    Security teams have their own language! The term "bad actors" refers to hackers
    — the folks trying to modify or steal the data. They do this by attacking the
    systems against attack surfaces, basic system components, and services that are
    reachable by the bad guys.


    When you secure systems, you must cover more than just one attack surface. These
    attack surfaces can be at rest, data in motion, services such as HTTP or the Linux
    kernel. You also need to use tools that can help identify how the system is configured
    to best protect the data. In this chapter, the goal is to give you several recipes
    to help you identify and protect your data.


    We will cover the following main recipes in this chapter:


    +   - Signing Git commits with GPG

    - Encrypting all web traffic

    - Encrypting all data at rest

    - Validating adherence to a compliance policy

    - Port protection and restricting network access

    - Keeping SELinux active'
  merge: -1
  pgno: 302
- img_proc: true
  md: '# Technical requirements


    For this recipe, you will need an Oracle Linux 8 system. As with most of recipes,
    a VM on your desktop using a desktop virtualization product as Oracle VirtualBox
    is recommended. A small VM with 2 cores, 2 GB RAM, and a few free gigabytes of
    disk space is fine. Ideally, before you start, you should update your system to
    the latest packages available. This only takes a few minutes and can save you
    ton of time when troubleshooting issues caused by a bug.


    Many of the recipes in this book have their related configuration files available
    in GitHub at https://github.com/PacktPublishing/Oracle-Linux-Cookbook.


    # Signing Git commits with GPG


    This recipe will show you how to digitally sign Git commits and RPM packages using
    a GNU Privacy Guard (GPG) keypair. A GPG keypair consists of two parts: the public
    key and the private key.


    This is done by creating a GPG keypair and using it to sign Git commits and RPM
    packages.


    # Getting ready


    In order to work with GPG and Git, you first need to install a few packages. Normally
    GPG is installed by default when the package gnupg2 is installed.


    Git should be installed using dnf install git -y.


    # How to do it...


    The first step is to create a GPG key if you do not already have one. Key will
    be used to sign your Git commits and RPM packages. To work with the GPG key, you
    can use the gpg or gpg2 commands; both are the same thing, as gpg links via gpg2.


    The GPG key is created via the command line:


    ```

    [erik@018 ~]$ gpg2 --gen-key

    ```


    The command will ask for some information, mainly your real name and email address.
    After you enter the information and continue, it will also ask you to set a passphrase
    to the key. Do not forget the passphrase! If you do, the key will become unusable
    and you will lose all data encrypted with the key. You can choose not to use a
    passphrase, but if you do, this will be asked to verify several times. The output
    of the key creation should be similar to the following screenshot:'
