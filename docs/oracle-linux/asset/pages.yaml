  md: "The following command reloads GRUB. As we can't edit GRUB directly, we edit\
    \ it through a configuration file, and use this to execute edits on GRUB. This\
    \ tells down the OS that we're ready to reload and have entered new data:\n\n\
    ```\n[root@small-ol18 ~]# grub2-mkconfig -o /boot/grub.cfg\n```\n\nSince we edited\
    \ GRUB and made a couple of other OS changes, it's good to get a fresh start with\
    \ things:\n\n```\n[root@small-ol18 network-scripts#] reboot\n```\n\nGoing through\
    \ these configuration changes can be confusing. When it comes to down, we're narrowing\
    \ the differences between OCI-born instances the instance we're configuring in\
    \ this recipe. The GRUB changes are getting the environment ready to operate within\
    \ the OCI tenancy.\n\nThere are a few more steps you'll have to configure on your\
    \ host machine for connectivity between VirtualBox and OCI. The very VirtualBox\
    \ communicates with OCI through an Application Programming Interface (API). This\
    \ connectivity requires public and private API keys to be created, and that public\
    \ key to be uploaded to OCI.\n\nThere are several steps in the authentication\
    \ between VirtualBox and OCI. The following are the components, and their OCID/outputs\
    \ are will be needed for connectivity to OCI:\n\n+   - OCI account:\n  - Tenancy\n\
    \  - Compartment\n  - VCN\n  - Storage bucket\n  - API keys\n\n+   - VirtualBox\
    \ – make sure to create and capture the required keys, as shown after this list:\n\
    \  - API keys\n\n+   - Host OS (your computer) – make sure to create and capture\
    \ the required keys, as detailed after this list:\n  - API keys\n\nPrivate and\
    \ public keys are the gateway components to sharing information from one environment\
    \ with another. A public key can be shared and used as an encryption method to\
    \ keep a packet. The private key is kept local, is not shared beyond that user,\
    \ and is used to decrypt the packet. When placed together, the private and public\
    \ keys create a lockbox, keeping the packets flowing between two systems secret\
    \ in transit. openssl is used to generate the keys, both public and private."
