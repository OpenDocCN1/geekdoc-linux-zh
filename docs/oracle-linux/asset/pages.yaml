  md: '# Revisiting Modules and AppStreams


    In this chapter, we''re going to learn more about **modules and application streams
    (AppStreams)**. We went over over the new organization of repositories and the
    concept of modularity in [Chapter 5, Software Management with DNF](), but now
    we''re going to be tapping into the true power of AppStreams with the following
    recipes:


    +   * Searching and listing AppStream modules

    * Installing applications and development tools via AppStream

    * Using AppStreams to install different versions of software

    * Removing packages via AppStream


    # Technical requirements


    The concept of AppStreams is new and was introduced in Oracle Linux 8. With that
    being said, as long as you are running Oracle Linux 8, you will have all that''s
    needed to follow along in this chapter.


    # Searching and listing AppStream modules


    First things first, let''s review the list of commands that pertain to modules:


    +   * **disable**: Disable a module with all its streams

    * **enable**: Enable a module stream

    * **info**: Print detailed information about a module

    * **install**: Install a module profile, including its packages

    * **list**: List all modules, profiles, and states

    * **provide**: List modular packages

    * **remove**: Remove installed module profiles and their packages

    * **repository**: List packages belonging to a module

    * **reset**: Reset a module

    * **switch-to**: Switch a module to a stream and distrosync RPM packages

    * **update**: Update packages associated with an active stream'
  merge: -1
