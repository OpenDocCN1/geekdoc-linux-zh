  md: '# 7


    # Oracle Linux 8 – Patching Doesn’t Have to Mean Rebooting


    I''ve rebooted when patching for my entire life, why change now?


    Since Linux was released back in 1991, when the kernel was patched, you had to
    reboot the system. At the time, even the IBM main that dominated corporate IT
    needed to be rebooted when patched, so it was considered normal for all other
    systems to be rebooted when patched. This process appeared to work fine for almost
    the next 20 years, but the seeds of change were planted in 2005 when a Massachusetts
    Institute of Technology (MIT) student came up with a simple question. *If you
    could patch without rebooting the system?* His team came up with an answer in
    2009 when Ksplice was released, enabling the ability to patch a Linux kernel while
    the system was running.


    In this chapter, we will cover why you should start using Ksplice and how it is
    used to improve the security of your system.


    This chapter contains the following recipes:


    +   - Setting up Ksplice with internet access

    - Using Ksplice with no internet access

    - Installing and enabling Known Exploit deactivation


    # Setting up Ksplice with internet access


    Before we get into the recipe, let’s understand what’s all the fuss around Ksplice.


    # What’s all the fuss about Ksplice?


    The first question is, *Why is this important to IT, and more importantly, to
    defending the applications running on the servers?* Before we get to that, you
    first need to understand the process that hackers use to compromise systems.


    The basic process includes three stages: reconnaissance, gaining access, and then
    maintaining access. Once a system is compromised, the process is repeated on other
    systems on the network:'
  merge: -1
  pgno: 235
- img_proc: true
  md: '![](img/110fa0d6324f0893fff03cee6394144d_236_0.png)


    Figure 7.1 – Security life cycle


    In the first phase, **reconnaissance**, hackers use a variety of methods to scan
    the system for vulnerabilities. Often, this attacking phase starts after hackers
    have gained access to a low-level support account that has access to the server.
    Once there, it is a trivial task to look at the kernel version and identify what
    vulnerabilities the kernel is susceptible to. Oracle offers a free site (https://ksplice.oracle.com/inspector)
    that lets you easily check the vulnerabilities of the kernel. The results of such
    a check are shown in *Figure 7.2*.'
