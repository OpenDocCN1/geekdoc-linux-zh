    Table 5.1 - OnCalendar example date rules


    RandomizedDelaySec is also an important setting. This will add a random delay
    to the clock, which is helpful in enterprise environments where large numbers
    of systems are running. Having 200 servers hitting a YUM repo at 6 A.M. can be
    a little overwhelming to the server. Adding a randomized delay in /etc/dnf/automatic.conf
    of 600 seconds would spread the load across a few minutes.


    DNF is an upgraded version of YUM, with a few enhancements. As seen in the recipe,
    it has a few tricks up its sleeve, but it still does a great job of providing
    an easy way for admins to install and patch software on an Oracle Linux system.


    # Using the DNF time machine


    DNF has a time machine built into it! This isn’t just a way to look back through
    the cosmos; it actually allows you to see the history of what was installed and
    also allows you to roll back a single change, or all changes up to a point.


    # Getting ready


    To do this, you will need a test system, running Oracle Linux 8, with access to
    an RPM repo.


    # How to do it...


    When DNF installs software, it keeps a history of all the actions performed. This
    includes upgrades to the software, installed software, and removal of the software.
    The `dnf history` command shows this history:'
