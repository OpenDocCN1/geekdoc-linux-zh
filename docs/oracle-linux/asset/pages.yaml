    # DevOps Automation Tools – Terraform, Ansible, Packer, and More


    What good is an operating system if it doesn''t cater to developers? After all,
    an operating system that''s easy to develop on to enjoy a much stronger ecosystem
    than one that does. You''ll be happy to learn that Oracle Linux plays very nicely
    with developers, and this chapter is all about common tools that will make your
    life easier when setting out to work on your next project.


    There are countless development tools that work well on Oracle Linux, the ones
    we''re focusing on in this chapter are all about automation. We''ll be talking
    about automating cloud infrastructure, automating the operating system build cycle,
    automating system administrators’ tasks, and automating the launching of virtual
    machines for development purposes.


    In this chapter, we''re going to cover the following recipes:


    +   * Do once manually – rinse and repeat with Terraform

    * Creating portable roles for Ansible

    * Managing secrets with Ansible Vault

    * Cooking up the perfect lab environment with Vagrant

    * Using Packer to modify source images

    * Pack it up, pack it in, let me begin, err, umm… build


    # Technical requirements


    We''re covering a lot of technologies in this chapter. Let''s prepare your machine
    so that you can conveniently follow along with the recipes:


    # Ansible


    For Oracle Linux 8, we can install Ansible by leveraging the Oracle Linux Automation
    Manager repository, so let''s install the repository first, and then we''ll install
    Ansible:


    ```

    $ sudo dnf install -y oracleinux-automation-manager-release-el8

    $ sudo dnf install -y ansible

    ```'
  merge: -1
  pgno: 257
- img_proc: true
  md: '# Packer, Vagrant, and Terraform


    Packer is a tool used for automating the creation of machine images, Vagrant is
    used for managing the lifecycle of virtual machines, and Terraform is an infrastructure-as-code
    tool. Packer, Vagrant, and Terraform are all products of HashiCorp, but they work
    well on Oracle Linux.


    We’re going to install Packer, Vagrant, and Terraform directly from HashiCorp:


    ```

    $ sudo dnf install -y dnf-plugins-core

    $ sudo dnf config-manager --add-repo

    https://rpm.releases.hashicorp.com/RHEL/hashicorp.repo

    $ sudo dnf install -y packer vagrant terraform

    ```


    Once that’s finished, let’s go ahead and install Oracle VM VirtualBox, as we’ll
    be using VirtualBox with Packer:


    ```

    $ sudo dnf install -y oracleinux-developer-release-el8

    $ sudo dnf install -y VirtualBox-7.0

    ```


    Finally, with Terraform, we’ll also want to create an Oracle Cloud Infrastructure
    (OCI) account. If you prefer, you may opt to use a different cloud, but use OCI
    if you want to follow this tutorial directly.


    # IMPORTANT NOTE


    Be sure to remember your Cloud Account Name as this is an important detail required
    in order to access your OCI account.


    # Downloading the source code


    The source code for the recipes in this chapter can be found at https://github.com/PackPublishing/Oracle-Linux-Cookbook/tree/main/ch8.


    # Do it once manually – rinse and repeat with Terraform


    Terraform is an infrastructure-as-code (IaC) tool that lets you build, change,
    and version infrastructure safely and efficiently. This recipe will provide a
    general overview of a good technique for automating the ugly with Terraform. What
    do I mean by ugly? Well, it’s anything that’s being done manually. We want to
    cut out the manual steps and automate as much as possible. In the case of Terraform
    specifically, this means we’re no longer need to click around a hundred different
    menu settings. Instead, we’re defining our infrastructure as code. This results
    in faster and more consistent'
  merge: -1
  pgno: 258
- img_proc: true
  md: 'deployments. Additionally, it''s also much easier to make changes to your infrastructure
    since it can all be edited via code.


    # Getting started


    You will need the following for this recipe:


    +   - Oracle Linux

    - Terraform


    Refer to the *Technical requirements* section at the beginning of this chapter
    if you need help installing Terraform.


    # How to do it...


    Any time you set out to automate something, it''s always a good idea to have a
    solid grasp on what needs to be done under the hood. You can guess what that means?
    Yep, you''ve got to perform all the manual steps at least once before trying to
    automate it.


    # First, do it once manually...


    The goal for this recipe is to use Terraform to deploy a single VM in the cloud.
    It''s an easy enough task, but before we jump into how this can be done using
    code, it''s generally best to do it manually first. So, with that said, let''s
    go ahead and deploy a virtual machine using the OCI web GUI:


    +   1. Log in to the Oracle Cloud Infrastructure Console (https://cloud.oracle.com/).'
