  md: "# backend\n\nWhen using HAProxy, the backend options play a crucial role in\
    \ configuring the behavior of backend servers and the routing of traffic toward\
    \ them. These options are specifically designated within the backend section of\
    \ the HAProxy configuration file. Here are some frequently utilized backend options:\n\
    \n+   - mode: Specifies the mode of the backend, such as http, tcp, or ssl. For\
    \ HTTP traffic, use http mode.\n- balance: Defines the load-balancing algorithm\
    \ to distribute traffic across backend servers. Common options include the following:\n\
    \  - balance roundrobin: Configures requests to be distributed in a round-robin\
    \ fashion to each server in sequence\n  - balance leastconn: Traffic is sent to\
    \ the server with the lowest number of active connections\n  - balance source:\
    \ Based on a hash of the client's IP address, traffic is directed to a specific\
    \ server consistently\n\n+   - server: Defines the backend servers and their addresses,\
    \ ports, and optimal parameters.\n- timeout: Configures various timeouts for the\
    \ backend:\n  - timeout server: Sets the maximum allowed time for the server to\
    \ respond to a request\n  - timeout tunnel: Configures the maximum time allowed\
    \ to establish a tunnel (used in TCP mode)\n\n+   - http-request and http-response:\
    \ Similar to frontend options, these are used to add custom HTTP request/response\
    \ headers or perform specific actions based on HTTP request/response data.\n-\
    \ cookie: Configures sticky session persistence using cookies. It allows the backend\
    \ server to be selected based on a specific cookie value from the client.\n\n\
    +   - check: Enables health checks for backend servers to determine their availability.\
    \ If a server fails the health check, HAProxy stops traffic to it until it recovers.\n\
    \n+   - option: Enables or disables specific options for the backend. Some commonly\
    \ used options include the following:\n  - option httpchk: Enables health checks\
    \ instead of TCP health checks\n  - option redispatch: Allows HAProxy to reselect\
    \ a server if the connection to the selected server fails\n\n+   - errorfile:\
    \ Specifies a file to use as a custom error page for backend server errors.\n\n\
    In the sample backend, it is defined as www_servers and will use roundrobin load\
    \ balancing against web1 and web2 servers:\n\n```\nfrontend www_app\nbind :80\n\
    default_backend  www_servers\n```\n\nFigure 6.4 – Example frontend"
