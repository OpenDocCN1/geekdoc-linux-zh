    # BenchBoot — improving boot security and integrity


    BenchBoot is a GitHub-community and cross-platform framework integrity that grew
    from an idea by Apertus Solutions in 2014 to deal with the limitations of using
    boot to launch for the OpenX project and other contributors, such as Oracle (Intel),
    3mdep (AMD), and Citrix (https://github.com/BenchBoot). Its primary purpose is
    to expand the mechanism of security and integrity of the boot process by a standard
    and unified approach (between Xen, KVM, Linux, BSDs, and proprietary kernels).
    A common location where you will see this is using Oracle''s shielded instances.


    # Getting ready


    One of the main features of BenchBoot is launching Launch. This feature enables
    the Linux kernel to be dynamically loaded by AMD and by introducing an intermediate
    phase to the boot launch. Unlike first-launch scenarios, such as the bootstrap
    used by open source dynamic tools like XHMF, OSLO, OpenText Secure, and boot,
    BenchBoot provides the ability to launch kernel upgrades through a key. You could
    then launch an integrity kernel that dynamically inspect the system and integrity
    of the platform before persisting yearly to a diskless embedded environment during
    a shutdown.'
  merge: -1
  pgno: 114
- img_proc: true
  md: 'introduced intermediate phase includes an intermediate loader called TrenchBoot
    Loader that various bootstrap solutions can launch. TrenchBoot Loader contains
    the TrenchBoot Security Engine, which implements integrity processing. Please
    refer to the following diagram:


    ![](img/110fa0d6324f0893fff03cee6394144d_115_0.png)


    Figure 3.17 – TrenchBoot process overview


    Oracle has added more TrenchBoot support to the Oracle Linux kernel to enable
    a Secure Boot for the Linux kernel for multiple use cases, such as two-factor
    authentication (2FA) for laptops or crowdsourcing integrity handling; this option
    is the best choice.


    NOTE


    You can see some of Oracle’s efforts by reading the kernel.org archive at https://lore.kernel.org/lkml/2023050415023.835096-1-ross.philson@oracle.com/.


    # How it works...


    The TrenchBoot Loader is composed of well-known components such as Linux and u-root.
    Let’s take a closer look at the main components within:


    +   - A TrenchBoot-enabled kernel with integrated TrenchBoot u-root initramfs

    - Integrated TrenchBoot Security Engine as an extension to u-root'
  merge: -1
  pgno: 115
- img_proc: true
  md: '+   • A new image that can be launched by the boot loader


    This build process is shown in the following diagram:


    ![](img/110fa0d6324f0893fff03cee6394144d_116_0.png)


    Figure 3.18 – TrenchBoot image process


    The main benefits of using TrenchBoot are as follows:


    +   • **Secure boot**: TrenchBoot provides a Secure boot process that ensures
    that only trusted software is executed on the system. This prevents the execution
    of malicious software that could compromise the system.


    +   • **Runtime integrity**: TrenchBoot ensures that the system remains secure
    after booting by verifying the integrity of the software and data at runtime.
    It utilizes technologies such as Intel SGX and AMD SEV to provide hardware-based
    isolation and attestation.


    +   • **Protection against attacks**: TrenchBoot provides protection against various
    types of attacks, including firmware attacks, malware, and kernel rootkits.


    +   • **Platform-agnostic**: TrenchBoot is platform-agnostic and can be used on
    different hardware platforms, including x86, Arm, RISC-V.


    +   • **Open source**: TrenchBoot is an open source project, which means that
    anyone can inspect the code and contribute to its development. This makes TrenchBoot
    more transparent and trustworthy.


