    # ## Serving up the boot – TFTPD


    TFTP is used for simple file transfers over the network. This is most often used
    to load the initial bootloader for an OS, or some firmware updates for embedded
    devices and older hardware. In the the context of the PXE server, the TFTP system
    is used for the initial bootloader.


    # ## Getting ready'
  merge: -1
  pgno: 68
- img_proc: true
  md: 'Set up a TFTP server, you will need an Oracle Linux 8 VM running in your environment.
    The server should be on the same network subnet that the systems being built are
    using. Ideally, you should also have enough space for several boot files. Normally,
    5 GB is enough data space.


    # How to do it...


