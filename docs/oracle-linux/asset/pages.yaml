    # Signing the module


    The sign-file utility ensures the module is signed correctly for the kernel. This
    utility is provided within the kernel source. The following instructions assume
    that you are signing a module for the currently running kernel. If you intend
    to sign a module for a different kernel, you must provide the path to the sign-file
    utility within the correct kernel version source. If you do not use the right
    utility, the signature type for your module may not align correctly with the expected
    signature type.


    To sign the module, run the sign-file utility for your currently running kernel
    and provide it with the path to your private key and the public key that you created
    for the purpose of signing your modules (for example, I''ve used a module called
    hello):


    ```

    [root@demo2 ~#] sudo /usr/src/kernels/$5 $(uname -r)/scripts/sign-file sha512

    /etc/ssl/certs/pubkey.key \/

    > /etc/ssl/certs/pubkey.der /lib/modules/$(uname -r)/extra/hello.ko

    ```


    Note that the module should be installed into /lib/modules/, and you will need
    to provide the correct path to the module.


    # Updating the Machine Owner Key database


    Machine Owner Key (MOK) is a security feature designed to protect the boot process
    of a computer system from unauthorized modifications or attacks. It is typically
    used in systems that support UEFI and Secure Boot, which require all bootloaders
    and kernel modules to be signed by trusted entities.


    The MOK database is stored in a non-volatile memory location within the system''s
    firmware and contains a list of keys allowed to sign the bootloaders and kernel
    modules. Each key in the MOK database is associated with a unique identifier and
    is used to verify the digital signature of the bootloaders and kernel modules.
    If a digital signature is not valid, the boot process continues and the software
    is not loaded. If a digital signature is not valid, the boot process is halted
    and the system will not boot.


    To enroll an MOK key, you must manually do so on each target system using the
    UEFI system console.


    Because the key that you created is not included in the UEFI Secure Boot key database,
    you must enroll in the MOK database in the shim using the mokutil command:'
