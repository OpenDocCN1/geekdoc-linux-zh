    # Generating, configuring, and monitoring Ethernet traffic over bond


    When bare-metal servers as dedicated hosts or Linux systems that have virtual
    machines using the KVM hypervisor, the network can be a weak point. Fortunately,
    this can be resolved by implementing Ethernet bonding, also known as network bonding,
    or Network Interface Card (NIC) bonding. It is a technology in Linux that allows
    you to combine multiple NICs into a single logical interface. This logical interface,
    known as a bond or bonded interface, provides increased network bandwidth, fault
    tolerance, and load balancing. These are summarized as follows:


    +   - Load Balancing: distributes network traffic across multiple NICs, increasing
    bandwidth. Various algorithms, such as round-robin, active-backup, and XOR, can
    be used depending on specific requirements.

    - Fault tolerance: In the event of an NIC or network link failure, Ethernet bonding
    can automatically switch to another active NIC. This provides redundancy and fault
    tolerance, ensuring network connectivity remains available even if one NIC becomes
    unavailable.'
  merge: -1
  pgno: 227
- img_proc: true
  md: '+   Link aggregation: Bonding can be used to create link aggregation groups
    (LAGs) or NIC teams, which enhance bandwidth and redundancy in HA setups.


    In this recipe, we will configure bonding, and then show some common tools that
    will allow you to both monitor and generate Ethernet traffic over the bond.


    Additionally, there are a few technologies you need to be familiar with.


    # MAC


    A Media Access Control (MAC) address is a hardware identifier assigned to network
    interfaces such as Ethernet and Wi-Fi adapters for communication on a local network.
    It is hardcoded into the network hardware during manufacturing and is used at
    the data link layer (Layer 2) of the OSI model. One of the most important features
    of MAC addresses is that they be unique. Each MAC address is meant to be globally
    unique, and manufacturers bear the responsibility of ensuring that no two interfaces
    have the same MAC address, though this can be a challenging task to accomplish
    in practice, especially in virtualized environments. This can be an issue with
    networking, as duplicate MAC addresses on any network will cause issues. Additionally,
    many of bonding modes rely on MAC addresses to load balance traffic.


    # Bonding modes


    Bonding modes refer to the various strategies or algorithms used to determine
    how network traffic is distributed across the network interfaces that have been
    aggregated into a bonded interface using the Linux driver. These modes control
    the load-balancing and failover behavior of the bonded interface. The choice of
    bonding mode depends on your network requirements and goals. Here are some common
    Linux bonding modes:


    +   **balance-rr**: In this mode, outgoing network traffic is distributed evenly
    across the available network interfaces in roundrobin fashion. It is a simple
    load-balancing mode that provides improved outbound performance but does not consider
    the state of the interfaces, which can lead to uneven traffic distribution. Occasionally,
    this mode does not work well with some switching systems.


    +   **active-backup**: A commonly used mode; is often referred to as failover
    mode, this mode has a primary interface, while others remain standby. If the primary
    interface fails, the next available interface is automatically activated to ensure
    continuity. This mode provides reliability and is one of the easiest to get working
    in any environment.


    +   **balance-xor**: This mode utilizes a straightforward XOR operation to maintain
    a balance between the transmission and reception of data. The process involves
    distributing traffic based on the MAC addresses of the source and destination.
    It guarantees that both endpoints always take the same path. The primary purpose
    of this mode is to ensure fault tolerance. Occasionally, this mode does not work
    well with some switching systems.


    +   **balance-tlb**: When operating in this mode, the outgoing traffic is distributed
    among all available interfaces based on their current load. However, incoming
    traffic is not actively balanced, and it is only received by the active interface.
    This mode is particularly useful when the switch does not support Link Aggregation
    Control Protocol (LACP). Occasionally, this mode does not work well with some
    switching systems.'
  merge: -1
  pgno: 228
- img_proc: true
  md: 'balance-alb: This mode actively balances incoming and outgoing traffic by considering
    the availability and load of each interface. Occasionally, this mode does not
    work well with some switching systems.


    # LACP


    All of the preceding modes can operate without any changes to the switches that
    the server is connected to. However, there is another mode that is more commonly
    used, called LACP. LACP is the most complex mode used to aggregate multiple network
    connections, as Ethernet, into a single high-bandwidth link. This process is commonly
    known as link aggregation, NIC teaming, or bonding. LACP is defined by the IEEE
    802.3ad standard and is frequently used in enterprise and data center environments
    to ensure network performance, redundancy, and fault tolerance.


    To utilize LACP, switches must be configured to use it. As an administrator, it
    is essential to communicate your configuration requirements to ensure that the
    switch is configured in a compatible mode. The configuration must match on both
    ends for LACP to work. Most enterprise-grade switches and server NICs provide
    LACP support. Key characteristics and features of LACP include the following:


    +   - Aggregated links: LACP enables the aggregation of multiple physical network
    links into a single logical link, which appears as a single interface to network
    devices.

    - Increased bandwidth: Aggregating multiple links with LACP can boost network
    bandwidth for bandwidth-intensive applications and server-to-switch connections.
    However, each MAC-to-MAC connection is usually limited to the speed of a single
    member of the aggregated link. If you have a host with two 1 Gb/s in the link,
    you will likely be unable to get more than 1 Gb/s of communication between the
    host and client.

    - Load balancing: LACP can redistribute network traffic across aggregated links
    using various load-balancing algorithms, preventing network congestion on a single
    link while optimizing network utilization.

    - Fault tolerance: In addition to providing increasing bandwidth, LACP also offers
    redundancy and fault-tolerance capabilities. If one link fails, LACP can automatically
    redirect traffic to the active links, minimizing downtime and ensuring network
    availability.

    - Dynamic protocol: LACP is a dynamic protocol that dynamically negotiates and
    establishes link aggregations between network devices using LACP frames.

    - Modes: LACP supports two modes of operation:


    +   - Active mode: In active mode, the device actively sends LACP frames to negotiate
    and establish link aggregations.

    - Passive mode: In passive mode, the device listens for LACP frames but does not
    actively send them. It relies on the other end configured in active mode to initiate
    the aggregation.


    LACP is commonly used in scenarios where HA and network performance are critical,
    such as server-to-switch connections, inter-switch links, and connections to Storage
    Area Networks (SANs).


    It allows organizations to make efficient use of available network resources and
    improve network reliability.'
