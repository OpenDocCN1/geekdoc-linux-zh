  md: '# 4


    # Creating and Managing Single-Instance Filesystems


    Without data, there is no reason for a system to exist, and with that thought,
    the data has to live somewhere. In this chapter, we will cover the two most popular
    filesystems used to manage data that is local to the server: B-Tree File System
    (Btrfs, pronounced Butter FS) and eExtended File System (XFS, pronounced X FS).


    These are single-instance filesystems, which are basically filesystems that are
    only mounted on a single server at any one time. There are also multi-instance
    filesystems that are mounted on multiple systems at the same time. Oracle Cluster
    File System version 2 (OCFS2) and Global File System 2 (GFS2). All of these examples
    use shared storage for the underlying storage.


    Additionally, there is Ceph, which is not an acronym, but instead a reference
    to cephalopod. This is because Ceph is a distributed architecture that stores
    data on nodes of a Ceph cluster. This allows Ceph to offer scalable storage with
    some additional complexity. Gl is another example of a distributed filesystem.


    # NOTE


    Why not ZFS? Because Btrfs and XFS are built into the Oracle Linux Unbreakable
    Enterprise Kernel (UEK), and ZFS is not available outside of third-party repositories.


    We will cover the following recipes that will help you understand and manage local
    filesystems:


    +   * What you need to know about local filesystems

    * Btrfs - creating, resizing, and monitoring

    * Btrfs - subvolumes, snapshots, quotas, and more

    * Protecting data with mdadm - a software RAID solution

    * Playing with logical volume management

    * XFS - creating, modifying, and more


    # Technical requirements


    For this recipe, you will need an Oracle Linux 8 system. As with most of these
    recipes, a VM on your desktop using a desktop virtualization product such as Oracle
    VirtualBox is recommended. A small VM with two cores, 2 GB RAM, and a few gigabytes
    of disk space is fine. You will also'
  merge: -1
  pgno: 123
- img_proc: true
  md: 'need additional disks assigned to the VM, ideally at least five equally sized
    disks. Ideally, before you start, patch your system to the latest packages available.
    This only takes a few minutes and can save a ton of time when troubleshooting
    issues caused by a bug.


    Many of the recipes in this book have related configuration files available on
    GitHub, located at https://github.com/PackPublishing/Oracle-Linux-Cookbook.


    # What you need to know about local filesystems


    This recipe will discuss the differences between local and remote filesystems,
    as well as the core differences between Btrfs and ZFS.


    The backbone of an operating system (OS) is the local filesystem. It enables efficient
    storage and management of files and directories on a computer or server using
    a hierarchical structure. This structure allows users and programs to easily create,
    modify, and access files on local device storage such as disks, solid-state drives,
    and storage logical units (LUNs) from a local storage area network (SAN) or cloud
    provider. These filesystems are designed specifically for local folder management
    efficiency, protecting files from accidental deletion or corruption. They come
    equipped with features such as file permissions, ownership, and access control,
    which provide users with utmost security and privacy. In comparison to remote
    filesystems, local filesystems offer superior performance, though files are not
    available on other systems unless paired with a remote filesystem technology.
    Notable examples of linux filesystems include Btrfs, XFS, ext4, fat32, and even
    ZFS.


    # NOTE


    ZFS is a local filesystem, it is not included in the kernel and needs to be added
    using software from https://fslinux.org.


    A remote filesystem allows you to access files and directories on a remote server
    through a network. This system provides the convenience of accessing and manipulating
    files on a remote machine as if they were stored locally, eliminating the need
    to transfer them personally. Remote filesystems are widely used in distributed
    computing environments where multiple computers or servers need to share data
    and resources. They are also valuable in cloud computing and web hosting environments
    where data is stored remotely and accessed over the internet. However, it''s important
    to note that using remote filesystems can impact performance when sharing files
    between multiple servers over a network.


    Examples of remote filesystems include Network File System (NFS), Server Message
    Block (SMB), and Common Internet File System (CIFS), which are widely used in
    Unix, Linux, and'
  merge: -1
  pgno: 124
- img_proc: true
  md: 'Windows environments, respectively. Other popular filesystems include s3fs,
    which allows users to access files securely over cloud-based object storage.


    For optimal performance when managing MySQL, Postgres, and Oracle databases, it''s
    highly recommended to utilize local filesystems instead of network filesystems.
    This strategy can also be effectively applied to the OS.


    # Getting ready


    You need to understand the core differences between the two filesystems. The XFS
    filesystem is surprisingly much older than many admins realize. It started back
    in 1993, as the filesystem for the Silicon Graphics IRIX OS, and was ported to
    Linux in 2001. Btrfs is newer, being developed in 2007 (as an open source project)
    for Linux. Btrfs is also more than a filesystem, as it includes the volume manager,
    data redundancy, and filesystem functionality in one technology.


    With XFS, you need to combine it with a logical volume manager for dynamic volumes
    and also redundant array of inexpensive disks (RAID) technology (most commonly
    configured with the mdadm command) to provide fault tolerance.


    | Type | Description | Performance | Redundancy | Capacity |

    | RAID 0 | Striping across disks | Best | None | 100% |

    | RAID 1 | Mirror two disks | Good | 1 drive failure | 50% |

    | RAID 10 | Mirrored then striped, min of 4 disks | Almost the best | 1 drive
    failure | 50% |

    | RAID1C3 | 3 copies of the metadata, min of 3 disks | Average | 2 drive failures
    | 66% |

    | RAID1C4 | 4 copies of the metadata, min of 4 disks | Lowest | 3 drive failures
    | 75% |


    Table 4.1 – Btrfs RAID options'
  merge: -1
  pgno: 125
- img_proc: true
  md: 'Both systems have the same limitation for the maximum filesize size of 8 exabytes?
    But Btrfs adds features such as snapshots, transparent compression, integrated
    checksum-based data integrity, and rollback capabilities. XFS is not left out
    though, with higher performance through I/O threads and more bandwidth, though
    these advantages may not be realized once you integrate XFS with an LVM and RAID
    technology. One other major difference is that Btrfs requires that you use the
    UEK and Red Hat Compatible Kernels (RHCKs).


    # How to do it...


    Oracle Linux by default uses the XFS filesystem, but when doing the installation,
    you can use Btrfs as the root filesystem. If you want to use XFS as the boot filesystem,
    install it as you normally would. If you want to use Btrfs, then you should continue.


    # NOTE


    Your boot filesystem can be different from the data filesystems on the server.
    You can easily have the root use XFS and the data filesystem use Btrfs, or vice
    versa.


    The easiest way to run Btrfs is to pick it when doing an installation using the
    UEK boot disk. This will let you choose Btrfs as the destination filesystem. When
    running the install, select **Install Destination**, and then select a custom
    storage configuration. This will then give you the manual partitioning option
    where you can use the dropdown and select **Btrfs**, as seen in the following
    screenshot:'
  merge: -1
  pgno: 126
