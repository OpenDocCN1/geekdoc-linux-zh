  md: 'Note that the version of the running kernel and the installed kernel will not
    match! This is because when Ksplices the kernel, it splices the RAM of the running
    kernel with the new code. It patches the kernel (and selected user space libraries)
    but has the effect of *uname* no longer matching the effective kernel:


    ```

    Effective kernel version 5.4.17-2136.306.1.3.el8uek

    [root@vm]#] uname -a

    Linux 5.4.17-2136.302.7.2.1.el8uek.aarch64 #2 SMP Tue Jan 18 12:11:39 PST 2022
    aarch64 aarch64 aarch64 GNU/Linux

    [root@vm]# #

    ```


