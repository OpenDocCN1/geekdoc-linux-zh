- img_proc: true
  md: 'The output gives several columns of information for each key:


    +   - sec: indicates that the key is a secret key.

    - rsa2048/4096/...: This column shows the algorithm and key length used by the
    key. For example, rsa2048 indicates that the key uses the RSA algorithm with a
    key length of 2048 bits. If the long format is used, this will also contain the
    key fingerprint after the length.

    - [creation date]: This column shows the date on which the key was created.

    - [expiration date]: If the key has an expiration date, it will be shown in this
    column. If not, this column will be empty.

    - [uid]: This column shows the user ID associated with the key. This is usually
    the name and email address of the key''s owner.

    - [ssb]: This column indicates that the key has a corresponding subkey (i.e.,
    a separate key for encryption, signing, or authentication).

    - [expires]: If the subkey has an expiration date, it will be shown in this column.
    If not, this column will be empty.


    The key fingerprint is a shortened digital representation of the fact your public
    key was sent to without tampering. The key ID format for the GPG command is a
    16-character hexadecimal string that uniquely identifies a public or private key
    in GPG. It is often used to refer to a specific key when working with GPG.


    The long key ID is derived from the full 40-character fingerprint of the key.
    The fingerprint is a cryptographic hash of the key''s public material, and it
    is used to verify the authenticity of the key. The long key ID is the last 16
    characters of the fingerprint.


    Now you have a key, we need to import it into Git. In the following example, we
    will use the key E921BF9E922221B6 to import it, we will use the following command:


    ```

    git config --global user.signingkey E921BF9E922221B6


    Then, we can set Git to sign all commits by default using the following command:


    git config --global commit.pgpsign true

    ```


    # How it works...


    Git can sign both commits and tags using the GPG key. Be careful with Git though,
    as it isn''t consistent. git tag uses -s to sign tags, but git commit uses -s
    to add the developers certificate of origin (DCO) signed-off line to the commit
    and -s signs the commit using GPG.


    To set up a new key, we will use the Git tag -s $TAG -m $TAG_DESCRIPTION:


