  md: "After we've completed the prerequisites, we're ready to move on to the installation.\
    \ Remember that the firewall ports, enabling the YUM repositories and Postgres,\
    \ and enabling them are important. Without these prerequisites, we will not be\
    \ able to move forward and the installation will fail:\n\n+   1. The first step\
    \ is to install the AWX user. Remember AWX is the foundation that OLAM is built\
    \ on, so this is really important:\n\n```\n[ocp@olar-test ~]$ sudo -u postgres\
    \ -c \"createuser -S -P awx\"\nEnter password for new role: welcome\nEnter it\
    \ again: welcome\n```\n\n+   2. Now, we've installed the database engine, we're\
    \ ready to install that, as shown here:\n\n```\n[ocp@olar-test ~]$ sudo -u postgres\
    \ -c \"createdb -O awx awx\"\n```\n\n+   3. After the install, we want to edit\
    \ the config file:\n\n```\n[root@olar-test ~]$ vi /var/lib/postgresql/data/pg_hba.conf\n\
    ```\n\n+   4. Do you remember when we defined the password variables? Here, we're\
    \ noticing that in the host-based authentication config file, highlighted in the\
    \ snippet above. After we're finished, we'll want to make sure to set the configuration:\n\
    \n```\n# TYPE DATABASE USER ADDRESS METHOD\n# \"local\" is for Unix socket connections\n\
    local        all                               \n# IPv4 connections:\nhost   \
    \      all                                     127.0.0.1/32    ident\n# IPv6 connections:\n\
    host         all                                     ::/128                  \
    \ ident\n# Allow replication connections from localhost, by a user with a\n# replication\
    \ privilege\nlocal        replication all                                 peer\n\
    host         replication all                           127.0.0.1/32    ident\n\
    host         replication all                           ::/128                \
    \   ident\nhost all      all                             0.0.0.0/0           \
    \    scram-sha-256\n```\n\n+   5. Now, we're going to edit the config (mapping\
    \ addresses to a public IP in the set of addresses - that is, your virtual machine.\
    \ The section is between question marks - **OCI NAT Address**:\n\n```\n[root@olar-test\
    \ ~]$ vi /var/lib/postgresql/data/postgresql.conf\n---\n# CONNECTIONS AND AUTHENTICATION\n\
    ---\n# Connection Settings.\nlisten_addresses = 'OCI NAT Address' - IP address\
    \ in config\n#listen_addresses = 'localhost' # What IP address (es) to listen\
    \ on:\n```\n\n+   6. After editing that file, make sure to save and exit the configuration.\
    \ After you have saved the file, you'll need to restart postgres to make sure\
    \ your changes have been committed:\n\n```\n[root@olar-test ~]$ systemctl restart\
