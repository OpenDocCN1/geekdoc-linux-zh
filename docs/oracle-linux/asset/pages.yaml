  md: 'SYSTEM: These are system-level parameters:


    +   - Installation Destination: This is the destination for the install. This
    includes the initial filesystem layout.


    +   - KDUMP: This allows you to set up kdump, a kernel crash dump tool that writes
    system information to disk for

    analysis later.


    +   - Network & Host Name: This is where you set the hostname and network information.


    +   - Security Policy: This enables a more secure installation, allowing you to
    start with a system that meets

    security standards such as STIG and PCI-DSS.


    USER SETTINGS: This is where you can set users, groups, and passwords:


    +   - Root Password: This sets the initial root password


