    # How it works...


    A manual boot process is fairly simple to do. Once booted, on the INSTALLATION
    SUMMARY screen, you have many options:


    +   - LOCALIZATION: This is where you can set settings for country-specific options
    language, keyboard type, and more:


    +   - Keyboard: This allows you to set what keyboard is used. You can use non-US
    keyboards.


    +   - Language Support: This sets the language used.


    +   - Time and Date: This sets the system, as well as the Network Time Protocol
    (NTP) servers to be used to automatically synchronize the time.


    +   - SOFTWARE: This sets the software sources and what software groups or packages
    will be installed:


    +   - Installation Source: This sets the source and software being installed


    +   - Software Selection: This sets what software groups and packages are being
    installed'
