- img_proc: true
  md: 'Btrfs snapshots are highly useful copies of a Btrfs filesystem, capturing a
    specific point in time. Through a seamless copy-on-write process, these snapshots
    separate any changes made to the filesystem from the snapshot itself. These make
    them ideal for different purposes, such as creating backups, testing software
    configurations, and providing an effortless way to undo updates. Additionally,
    backups can be created rapidly with minimal storage space, as the snapshots only
    store the differences between the current state of the filesystem and the state
    at the moment the snapshot was taken. To create a Btrfs snapshot, you can use
    the btrfs subvolume snapshot command, specifying the subvolume you want to snapshot
    and the name and location of the snapshot:


    ```

    btrfs subvolume snapshot /data/vol1 /data/backup/vol1_backup1

    ```


    This command creates a read-only snapshot of the /data/vol1 subvolume and saves
    it as a separate subvolume in the /data/backup directory.


    Don''t worry if you''ve already taken a snapshot – you can easily revert the filesystem
    to its exact state at time using the Btrfs rollback feature. With Btrfs snapshot
    rollback, you can restore your Btrfs filesystem to a previous state by simply
    selecting a snapshot. Rolling back to a snapshot discards all changes to the filesystem
    since the snapshot was taken and restores the filesystem to the state it was when
    the snapshot was created.


    To roll back a Btrfs snapshot, you can use the btrfs subvolume snapshot command
    with the -r option, which specifies the snapshot that should be used for:


    ```

    btrfs subvolume snapshot -r /data/backups/vol1_backup1 /data/vol

    ```


    This command rolls back /data/vol to the state it was in when the /data/backup/vol1_backup1
    snapshot was created.


    It is important to note that rolling back a snapshot will discard any changes
    to the filesystem since the snapshot was taken. However, this feature is extremely
    useful when you want to fully revert the filesystem to a previous state. Btrfs
    snapshots provide a simple and effective solution for data management and protection,
    allowing for effortless backup creation and easy restoration of prior filesystem
    versions.


    # NOTE


    Automatic snapshots can be enabled so a dnf transaction will create a snapshot.
    This is done by the dnf-plugin-snapper tool. More information can be found here:
    https://docs.oracle.com/en/operating-systems/oracle-linux/fsadmin/ManagingTheBtrfsFileSystem.html#snapper-btrfs.


    This section will cover how to enable compression using the Btrfs filesystem.
    Btrfs compression is a powerful feature that allows you to compress data in real
    time while writing it to the filesystem. This'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'feature can significantly reduce storage space, making it ideal for filesystems
    that store vast amounts of data, as media archives and backup systems. Additionally,
    it''s beneficial for systems with limited storage space, such as mobile devices
    and embedded systems.


    Btrfs uses various compression algorithms to compress data while writing to the
    filesystem. The compressed data is then stored on the disk and automatically decompressed
    on the fly when accessed. This process is seamless to the applications accessing
    the data, there''s no need for them to be aware of the compression process as
    Btrfs handles three compression algorithms, **zlib**, **lzo**, and **zstd**, each
    with its own strengths and weaknesses:


    +   - zlib: This is a well used general-purpose compression algorithm that provides
    good compression ratios but be relatively slow, especially at higher compression
    levels. It is suitable for compressing general-purpose data and text files.


    +   - lzo: This is a lightweight compression algorithm that provides good compression
    ratios and is relatively fast. It is suitable for compressing data that is already
    compressed, such as media files and archives.


    +   - zstd: This is a newer compression algorithm that provides a good balance
    between compression ratio and speed. It is suitable for compressing a wide range
    of data types, including text, media files, and archives.


    The choice of compression algorithm depends on the specific use case and performance
    requirements.


    To enable compression on a filesystem, you can use the **btrfs property** command
    to set the compression to zstd


    ```

    btrfs property set /data/vol zstd

    ```


    When compression is enabled, new data written to the filesystem is compressed.
    However, you can also use the **defragment** command to compress the data that
    was on the filesystem before compression was enabled. To do this on a subvolume,
    you will also need to recursively run the command using the **-r** option with
    the **-c** option to compress data:


    ```

    btrfs filesystem defragment -rc /data/vol

    ```


    # There''s more...


    Compression efficiency will vary, depending on the data and algorithm used. Let''s
    first check how much space we have, using the following command:


    ```

    [root@btrfs vol]# btrfs filesystem usage /data/vol | grep Data | grep Used Data,RAID1C:
    Size:1.00GB, Used:0.00B (0.00%)

    ```


    Now, let''s create a 2 GB file with random data:


    ```

    head -c 2G </dev/urandom > /data/vol/test1

    ```'
  merge: -1
  pgno: 143
- img_proc: true
  md: 'Next, we can use the df and du commands to compare the space consumed and the
    space used:


    ```

    df -h /data/voll

    du -hd0 /data/voll

    ```


    The sample outputs for these commands are as follows:


    ```

    [root@btrfs vol]# df -h /data/voll

    Filesystem Size Used Avail Use% Mounted on

    /dev/sda 30G 2G 28G 1% /data/voll

    [root@btrfs vol]# du -hd0 /data/voll

    2.0G /data/voll

    [root@btrfs vol]#

    ```


    Here, we can see 2 GB is used (via the du command), and also 2 GB (via the df
    command) is actually consumed. So, for random data file, we can benefit from the
    compression.


    Let''s delete the file now, instead of:


    ```

    rm /data/voll/test1

    ```


    To speed up things, let defragment and rebalance the volume. This is needed to
    actually free up space from the deleted file now,


    ```

    [root@btrfs vol]# btrfs filesystem defragment -rc /data/voll

    [root@btrfs vol]# btrfs filesystem balance /data

    Done, had to relocate 4 out of 4 chunks

    [root@btrfs vol]#

    ```


    Now, with a file of repeating data, we will see more compression. To create a
    2 GB file with repeating data, run the following command:


    ```

    yes "repeating text" | head -c 2G >test2

    ```


    Now, we repeat the same df and du commands as before, but we will see very different:


    ```

    [root@btrfs vol]# df -h /data/voll

    Filesystem Size Used Avail Use% Mounted on

    /dev/sda 30G 62M 29G 1% /data/voll

    [root@btrfs vol]# du -hd0 /data/voll

    2.0G /data/voll

    [root@btrfs vol]#

    ```


    Here, we see 4 GB is allocated, but only 62 MB is actually used! That''s a huge
    benefit from the compression.


    # Protecting data with mdadm – a software RAID solution


    Modern computing systems rely on RAID technology to ensure data integrity, availability,
    and performance. By distributing data across multiple disks in various configurations,
    RAID provides'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'fault tolerance, allowing systems to continue functioning even if one or more
    disks fail. This redundancy is critical to prevent data loss and minimize downtime.


    Moreover, RAID configurations such as striping and mirroring can significantly
    improve read and write performance by allowing data to be accessed in parallel
    with multiple disks. As data volume and importance count to increase in today''s
    digital world, RAID plays a vital role in protecting, optimizing, and maintaining
    storage system reliability. The easiest way to do this when not using Btrfs with
    Oracle Linux 8 is to use a tool mdadm.


    # Getting ready


    mdadm is a software utility for managing and configuring RAID arrays in Linux
    systems. It stands for multiple device administration and is commonly used to
    create, manage, monitor, and maintain RAID arrays. These arrays leverage a kernel
    driver multiple device (MD). mdadm allows users to create various RAID levels,
    including RAID 0, RAID 1, RAID 5, RAID 6, RAID 0+1, and RAID 10, using a combination
    of multiple physical disks:


    | Type | Description | Notes |

    |---|---||

    | RAID | Spanning | No redundancy or performance advantages. |

    | RAID-0 | Striping | No redundancy, but better performance versus RAID. |

    | RAID-1 | Mirroring | Mirrored redundancy, but no performance advantage in write
    workloads. Read workloads may improve. |

    | RAID-5 | Striping with double parity | Redundancy and good. Can lose one disk
    without data loss. Recommended to use at least four disks. |

    | RAID-6 | Striping with triple parity | Redundancy and good. Can lose two disks
    without data loss. Recommended to use at least five disks. |

    | RAID 0+1 | Mirroring of striped disks | Great performance, but generally considered
    the best for redundancy, and recovering a lost disk takes a long time. This requires
    at least four disks. |

    | RAID 10 | Striping of mirrored | Most expensive option, but generally considered
    the best for redundancy, and rebuild time. This requires at least four disks.
    |'
  merge: -1
  pgno: 145
- img_proc: true
  md: '# Table 4.2 – MD RAID options


    # # NOTE


    It''s not uncommon to confuse JBOD (just a box of disks) enclosure with a RAID
    enclosure. JBOD is a simple disk enclosure with no hardware RAID. A RAID disk
    enclosure has a hardware controller that offloads all the RAID logic for the disks
    within the enclosure. For this example, hardware RAID is not being used, only
    JBOD. All the RAID logic is being performed by Oracle Linux.


    mdadm is an essential tool for administrators to create, modify, and monitor RAID
    arrays. It allows users to add or remove disks from an existing array, perform
    data operations, and configure various parameters such as RAID level and spare
    disks. With its command-line interface, mdadm provides flexibility in managing
    and maintaining disk redundancy and performance. It is a reliable and robust solution
    that optimizes storage performance, ensures data redundancy, and maintains high
    availability of data. mdadm is normally installed when Oracle Linux is installed.


    # # How to do it...


    Creating an MD device is fairly simple. Before you create the device, you need
    to plan a few things in advance:


    +   - What type of RAID will you use? As mentioned previously, the MD kernel driver
    supports many types of RAID algorithms. You need to pick one before running the
    command. This maps to the -level option.

    - How many disks will you be using? Most RAID types use even numbers of disks,
    but you still need to know how many disks will be used for data. This maps to
    the -raid-devices option.

    - Will you configure a hot spare? Hot spares are a great option when systems need
    to automatically rebuild the data if a device fails. It is uncommon in remote
    locations to have many hot spares. When picking hot spares, the required space
    versus how long it will take for a replacement to be installed. This maps to the
    -spare-devices option.

    - What is the number of the MD device? Traditionally, you start with 0 and work
    your way up, but track the tracks so you do not accidentally use the device. This
    maps to /dev/md#.

    - What are the paths to the drives that you are going to use? They are /dev/sd#,
    /dev/nvme#, or even /dev/vdb#.


    In the following example, we will create a RAID-5 array with one hot spare. The
    device being used is /dev/sd[bcdef] and this is the /dev/md0 device:


    ```

    mdadm --create /dev/md0 --level=5 --raid-devices=4 --spare-devices=1 /dev/sd[bcdef]

    ```


    You can quickly check the status by calling the /proc/mdstat file:'
  merge: -1
  pgno: 146
