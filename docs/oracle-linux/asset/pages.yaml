    # # OLAM isn’t fantasy football, but they both use playbooks


    Most of us know about fantasy football, where we follow teams, draft players,
    and bet on winners and losers. We''re not betting anything here, other than when
    our environment will work, but we are using something called a playbook. Consider
    a playbook much like that used by a football coach to train their team; it''s
    the same concept. We are predefining an environment and an event, and programmatically
    architecting it in the way we tell it, creating or changing the environment we
    are defining, or even reclaiming resources (taking back CPU, RAM, and disk space
    from decommissioned environments). Whatever we define within the constraints of
    OLAM, we can execute.


    In order to create our playbook, we need to figure out who, what, where, when,
    and maybe even why:


    +   - Who – What resources groups are we targeting?

    - What – What kind of resources are we targeting? A VM? A physical machine?

    - Where – Where are these resources located? In a CSP, VM farm, or physical server?'
  merge: -1
  pgno: 415
- img_proc: true
  md: '+   - When - When are we going to execute the environment? Is it event-based
    (meaning do we clear disk space when a log fills up /tmp)?


    +   - Why - Why are we targeting this environment? Is it a database server and
    logs are maxing out disk space, a web server is utilized, or an event is having
    a repeat effect?


    A playbook can be triggered in many ways. In AIOps, we focus on triggers; these
    can be an SNMP trap, agent-based triggers (such as a full disk, as shown previously),
    or a directed event from a platform. Let''s return to the other four variables
    – who, what, where, and when; who is which environment, what is machines are used,
    where is the location of the environment(s), and when is when this playbook will
    run, and whether it will be triggered or run at a certain time. All or any of
    these are plausible and will be gradually defined.


    ![](img/110fa0d6324f0893fff03cee6394144d_416_0.png)


    Figure 12.39 - Playbooks and their touch points


    # # Getting ready


    Getting ready to build your own playbooks and/or utilize existing ones isn’t the
    monumental task it seems. In this recipe, we’ll explore adding a Git repository
    to OLAM instance. This is done for a few reasons:


    +   - Version control - control your code, who edits it, and the versions you''re
    on. Remember that things change, infrastructure and OS versions. You want to keep
    track of changes in your playbooks so that you can adjust to the changes.


    +   - Keeping track of your playbooks – save them, collaborate, and share. You
    can share your templates and reuse them. Remember that one of the most important
    reasons why automation is so useful is repetition, limiting the need for human
    interaction in repetitive steps.'
  merge: -1
  pgno: 416
- img_proc: true
