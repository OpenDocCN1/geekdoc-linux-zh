    We will use these files later to encrypt the communication.


    # How to do it...


    Now that all the prep work has been completed on each of the nodes, we will create
    the trusted storage pools and encrypt the communications. This will have everything
    ready to create volumes, where data is stored and shared.


    A trusted storage pool in Gluster refers to a setup where a cluster of Gluster
    servers, referred to as storage nodes or peers, have established trust among themselves
    to work together within a cluster. This trust is established through a trusted
    storage pool configuration that typically involves the following steps:


    +   - Authentication: Various methods, such as SSH keys, certificates, or shared
    secrets, can be used to authenticate nodes in the trusted storage pool. This ensures
    that only authorized servers are part of the storage cluster.


    +   - Authorization: After nodes are authenticated, they authorize each other
    to access and manage specific data within the Cluster storage cluster. The authorization
    settings determine which nodes have read and write access to particular volumes
    or bricks within the cluster.


    +   - Communication: Members of the trusted storage pool communicate over a secure
    network to replicate data, synchronize metadata, and other cluster-related operations,
    ensuring that the storage functions cohesively.


    +   - Data integrity: It is possible to add more storage nodes to the trusted
    pool, which enhances storage capacity and performance. The trusted nature of the
    pool makes it easy for new nodes to join the cluster and contribute to its resources.


    In Gluster, a trusted storage pool is a crucial element as it lays the foundation
    for the fault-tolerant and distributed nature of the filesystem. It guarantees
    that all nodes within the cluster can work seamlessly and securely in collaboration
    with each other. The following steps will walk you through how to create GlusterFS
    on two hosts.'
