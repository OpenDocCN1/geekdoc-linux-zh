  md: 'gluster volume create data gluster(1,2):/data/gluster/volumes/bricks/datal


    +   - Replicated: Files are copied across bricks for HA in replicated volumes.
    An example command to build a replicated volume is the following:


    ```

    gluster volume create data replica 2

    gluster(1,2):/data/gluster/volumes/bricks/datal

    ```


    +   - Distributed: Distributed files across bricks in the volume for improved
    read performance, HA, and reliability. When creating a distributed volume, the
    number of nodes should be a multiple of the number of bricks. An example command
    to build a distributed volume is the following:


    ```

    gluster volume create data replica 2

    gluster(1,2,3,4):/data/gluster/volumes/bricks/datal

    ```


    +   - Dispersed: This volume utilizes erasure coding to effectively protect against
    disk or server failures. Dispersed volume allows encoded data across multiple
    bricks in the volume while adding redundancy to ensure reliability. Dispersed
    volume allows for customizability reliability levels with minimal space. A dispersed
    volume must have at least six bricks. An example command to build a dispersed
    volume is the following:


    ```

    gluster volume create data disperse 3 redundancy 1 \

    gluster(1,2,3):/data/gluster/volumes/bricks/datal

    ```


    +   - Dispersed: Distributed data across bricks, providing the same benefits of
    replicated volumes but using dispersed storage. A dispersed volume must have at
    least six bricks. An example command to build a distributed dispersed volume is
    the following:


    ```

    gluster volume create data disperse 3 redundancy 1 \

    gluster(1,2,3,4,5,6):/data/gluster/volumes/bricks/datal

    ```


    When adding bricks to a volume, you can put more than one brick on a Gluster node.
    Simply define the additional brick in the command. In this example, a distributed
    dispersed volume is created, by putting two bricks on each node:


    ```

    gluster volume create data disperse 3 redundancy 1 \

    gluster(1,2,3):/data/gluster/volumes/bricks/datal \

    gluster(1,2,3):/data/gluster/volumes/bricks/datal2

    ```


    Volumes can be stopped with the gluster stop volume volumename. An example to
    stop the data volume is the following:


    ```

    gluster stop volume datal

    ```


