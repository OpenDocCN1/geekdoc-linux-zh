    useful tasks.


    This recipe will walk you through the process of creating useful utilities leveraging
    containers. The basic principle of containers encourages we formulate our containers
    to do only one thing – that is, to provide some form of utility and nothing more.
    You should not create a container that does too much. With that being said, most
    container images already exist to provide a useful utility. In this recipe, we
    are going to look at examples of containers that serve a useful purpose, and we''re
    going to explore how to make use of this.


    # # Getting ready


    We will require the following:


    +   - Oracle Linux

    - Podman


    # # How to do it...


    The main intention of this recipe is to show how we can use containers to achieve
    a function without installing additional packages on our local machine. Once you
    have Podman installed on your local machine, you can tap into an entire ecosystem
    of useful packages and utilities without installing more packages – instead, you
    simply run a container that contains those packages, or, alternatively, you create
    a new container and install the desired packages.


    Why would anyone prefer to this? For starters, it allows you to minimize the number
    of packages and dependencies you''re installing on your host machine. With fewer
    packages, you reduce your attack surface in terms of security. Additionally, your
    operating system''s repositories might be limited to access certain packages,
    or it might not have access to the latest versions. Instead of going through the
    effort of adding potentially untrusted repositories to install the packages you
    need, why not simply launch a container that contains everything you need for
    the specific function you''re trying to achieve?


    Before we try to tap into the true potential of containers, we first need to discuss
    a few important concepts that will make this process a bit easier.'
