    > Figure 1.1 – x86_64 ISOs


    +   **AArch64:** This is what you need when using Oracle Linux on Arm servers,
    such as Raspberry Pi, or Ampere''s high-performance cloud-native processor CPUs.
    A cloud-native processor is a term for a CPU specifically designed for running
    cloud-native applications, optimized for lower power consumption with a more scalable
    architecture.


    Running Oracle Linux on Arm is a very interesting option, as the application building
    blocks such as Java, Apache, Python, and Podman run using the same software versions
    that the x86 architectures use. All of these building blocks run identically to
    how they do on the x86 architecture, making the switch to Arm using Oracle Linux
    really easy for the adopters. The advantage of Arm is it at a lower cost and higher
    density, offering a very attractive cost/performance story, enabling organizations
    to easily lower costs while improving performance. The currently available matrix
    of options for downloading Oracle ISOs from the download site can be found in
    the following:'
