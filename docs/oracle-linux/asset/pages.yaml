    # How it works...


    Ksplice is a tool that allows Linux systems to stay current with security fixes
    and vital updates without requiring reboots. This is especially beneficial for
    servers and settings that need to stay up and running with little downtime. It''s
    worth noting that while Ksplice can handle many patches, some changes may be too
    intricate to apply in a live environment and will require a traditional reboot-based
    update.


    # Installing and enabling Known Exploit Detection


    One of the most critical things to secure your system (and, more importantly,
    the data in your system) is to implement the ability to detect when the bad guys
    are trying to break in. Ksplice has a unique feature Known Exploit Detection (KED)
    that will report on known attacks against the kernel. Normally, only exploits
    that allow the hacker to access additional privileges are instrumented for KED
    and, for these to trigger, the kernel should already have been spliced for the
    vulnerability.


    # Getting ready


    To do this, you will need a test system running Oracle Linux 8, with Ksplice set
    up.


    # How to do it...'
