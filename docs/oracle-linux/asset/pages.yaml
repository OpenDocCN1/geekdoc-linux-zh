  md: '![](img/110fa0d6324f0893fff03cee6394144d_317_0.png)


    10. Next, we need to configure the device to decrypt the drive on boot. We first
    need to pull the new UUID of the encrypted drive:


    ```

    root@clevis ~# blkid -s UUID /dev/sdb

    /dev/sdb UUID="218ec8bc-2508-4e34-a569-1e8d3783874e"

    ```


    11. Next, let''s enable the Clevis service:


    ```

    systemctl enable clevis-luks-askpass.path

    ```


    12. Now, we need to add to /etc/crypttab. The crypttab file contains a list of
    all encrypted drives:


    ```

    echo "encryptedUUID 218ec8bc-2508-4e34-a569-1e8d3783874e _netdev" | sudo tee -a
    /etc/crypttab

    ```


    13. Next, we will update the /etc/fstab file for the filesystem, changing the
    default to _netdev. This will allow the device to mount after the other non-encrypted
    filesystems.


    14. The /etc/fstab should look similar to the following screenshot, with the UUID
    of the encrypted drive mounting as a _netdev:


    ```

    root@clevis ~# more /etc/fstab

    # /etc/fstab

    # Created by anaconda on Tue Apr 4 15:07:11 2023

    # Accessible filesystems, are maintained under ''/dev/disk/''.

    # See man pages fstab(5), findfs(8), mount(8) and or blkid(8) for more info.

    # After editing the file, run ''systemctl daemon-reload''

    # units generated from the file.

    /dev/mapper/ol-root / xfs defaults 0 0

    UUID=801b816a-e6c9-c364-4c1c-1960901fe22 /home xfs defaults 0 0

    /dev/mapper/ol-home /home xfs defaults 0 0

    /dev/mapper/ol-var /var xfs defaults 0 0

    /dev/mapper/ol-log /var xfs defaults 0 0

    /dev/mapper/ol-swap none swap defaults 0 0

    UUID=5ecf63f1-f2d4-4c32-af1f-62d2e3eb390f /data xfs _netdev 0 0

    root@clevis ~#

    ```


    ![](img/110fa0d6324f0893fff03cee6394144d_317_1.png)


    # How it works...


    Clevis and Tang are both software tools that are used to unlock and decrypt drives
    automatically during the boot process of a Linux system.


    Here is a brief of how they work:


    +   1. During the boot, this prompt prompts the user for a passphrase to unlock
    and decrypt the disk.

    2. With Clevis and Tang, this prompt is replaced with an automated process that
    unlocks and decrypts the disk using a network-based key.'
  merge: -1
  pgno: 317
- img_proc: true
  md: '3. Clevis and Tang work together to create a binding between the encrypted
    disk and the key server. This binding is based on a policy that specifies the
    conditions under which the disk can be unlocked.


    4. When the system boots, it contacts the key server and requests the decryption
    key for the encrypted disk. The key server checks the policy to determine whether
    the conditions for unlocking the disk have been met.


    5. If the policy conditions are met, the key server sends the decryption key to
    the system, which then uses it to unlock and decrypt the disk.


    6. If the policy conditions are not met, the key server denies the request for
    the decryption key, and the disk remains locked.


    # There''s more...


    Optionally, you can also modify the system to allow an admin to manually enter
    the initial password when the system boots. To do this, install `clevis-dracut`:


    ```

    dnf install -y clevis-dracut

    ```


    Then, rebuild the boot files:


    ```

    dracut -fv

    ```


    When the system boots, you will have the opportunity to enter the passphrase manually:


    ![](img/110fa0d6324f0893fff03cee6394144d_318_0.png)'
