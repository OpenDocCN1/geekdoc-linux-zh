  md: '# 3


    # Exploring the Various Boot Options and Kernels in Oracle Linux


    This chapter will teach you about boot and its options, kernels, and more. You
    will also learn about exciting opportunities, tools, and applications to make
    your life easier and more enjoyable. For example, you will learn how to change
    your booting kernel and remove and reinstall a kernel on your system. You will
    even learn how to use the boot process to switch between Linux kernels.


    Booting involves more than just loading the operating system; it also helps secure
    the system using Secure Boot or TrenchBoot.


    This chapter has the following recipes:


    +   * Kernel basics – UEK and RHCK

    * Playing with UEFI

    * Playing with Secure Boot

    * TrenchBoot – improving boot security and integrity

    * Removing the RHCK


    # Kernel basics – UEK and RHCK


    Before we get started with UEK and RHCK, let''s understand what is a Linux kernel.
    A Linux kernel release refers to an updated version of the core component of the
    Linux operating system. Its main function is to act as a bridge between the hardware
    and software layers of a computer. The Linux kernel is a collaborative development
    effort by a large community of developers worldwide, with Linux Torvalds as the
    original creator and official maintainer of the mainline kernel. These kernel
    updates are introduced periodically to provide new features, improvements, bug
    fixes, security patches, and hardware support.


    Kernel releases are assigned a version number that consists of three components:
    major version, minor version, and patch level. For instance, a kernel version
    is represented as X.Y.Z, where X represents the major version, Y is the minor
    version, and Z is the patch level. The major version is usually incremented for
    significant changes that may affect compatibility, while the minor version and
    patch level represent incremental updates and bug fixes.'
  merge: -1
  pgno: 95
- img_proc: true
  md: 'Linux kernel releases are distributed as source code, and various distributions
    or operating systems based on Linux typically package and distribute their own
    versions of the kernel, incorporating it into their respective releases. In addition,
    users who want to compile and install the kernel directly on their systems can
    access the source code. The following table shows the Linux mainline releases
    for Linux 7, 8, and 9.


    | OS Version | RHCK Release | Latest UEK Release |

    | Linux 7 | Linux 3.x | UEK 6/Linux 5.4 |

    | Linux 8 | Linux 4.x | UEK 7/Linux 5.15 |

    | Linux 9 | Linux 5.14 | UEK 7/Linux 5.15 |


    Table 3.1 – Available Kernel options by release


    # # Kernel basics – UEK and RHCK


    With a fresh installation of Oracle Linux, the Unbreakable Enterprise Kernel (UEK)
    is the default. However, in some cases, you may want to switch to the Red Hat
    Compatible Kernel (RHCK).


    The default kernel might not be the correct version to use in some scenarios:


    +   - UEK releases based on newer kernels than the RHCK version, which is the
    standard for Red servers. With Oracle Linux, you have the option to use the UEK,
    which provides a more up-to-date kernel.

    - The current kernel version might be incompatible with your particular hardware.
    A UEK system will boot on new hardware, while the older RHCK will not. An example
    of this is UEK 7, which supports the Microsoft Azure Network Adapter (MANA), whereas
    UEK 6 does not.

    - Suppose a UEK beta or preliminary release is installed on the system. In that
    case, UEK needs to be monitored to ensure that the kernel is used only if intentionally
    and manually selected by the kernel by an administrator.

    - The UEK for Linux provides many advantages, such as significant performance
    improvements and new features. The Linux operating system is a modular system
    in which kernel interacts with the hardware and controls schedules access to resources
    on behalf of applications. Most applications run in what is called user space
    and only a stable set of system libraries to ask for kernel services. The exceptions
    are applications that directly access the kernel, most commonly security applications.

    - Installing the UEK does not change system libraries as glibc, which is the interface
    that nearly all applications, including Oracle Database, use. The glibc version
    is the same whether you run Oracle Linux with the UEK or with the RHCK. This is
    not limited to just glibc, but is the case for all system libraries, such as libssl,
    libc, and libcrypt.


    # NOTE


    Multiple versions of the UEK may be available for any baseline operating system.
    Choosing the version of the UEK is up to the application team and must reflect
    any compatibility requirements.'
  merge: -1
  pgno: 96
- img_proc: true
  md: 'These examples and similar cases require you to switch between kernel types.
    In older releases, managing the default kernel was performed by configuring the
    GRUB boot loader. However, with Oracle Linux 8 and later, you should use the grubby
    command to control and manage the configuration for booting the kernel. grubby
    is part of the Grand Bootloader version 2 (GRUB 2) boot loader, which is available
    from the GNU project. GRUB is the default bootloader for many Linux distributions
    on the market. After loading it into memory, it transfers control to the operating
    kernel.


    GRUB 2 is the default bootloader program used on Oracle Linux, and it can load
    many different operating systems, including Microsoft Windows.


    # Getting ready


    Let''s start looking deeper at the process to better understand it.


    # The boot process


    You have an understanding of how Oracle Linux boot options help you troubleshoot
    problems encountered when booting the system. This knowledge is beneficial when
    using new hardware or cloud environments.


    As an Oracle Linux system boots, it performs many tasks that may change depending
    on the type of firmware your hardware uses to handle the system boot. It could
    be Unified Extensible Firmware Interface (UEFI) firmware or legacy BIOS firmware.
    The legacy Basic Input/Output System (BIOS) firmware is a legacy boot process
    that uses BIOS firmware. The BIOS maintains a list of bootable devices and the
    order of devices from which a boot is attempted. This data is stored in a Complementary
    Metal-Oxide Semiconductor (CMOS) chip on the system, requiring a battery to keep
    the settings when the system is powered. Systems using BIOS boot are generally
    old systems, although even a modern system may still use a BIOS. A more popular
    option on modern servers is UEFI-based firmware. It manages the boot process on
    a server but stores the boot process (initialization and startup) in a boot loader
    executable .efi file in a particular partition of the system''s drive. Using the
    .efi file gives you more control of the boot process, including the ability to
    take advantage of new security features. An example of a new security feature
    is Secure Boot, which is covered in this chapter.


    # The UEFI-based booting sequence


    The following sequence order is used by UEFI-based hardware:


    +   1. The system first performs a power-on-test (POST), which identifies the
    system''s configuration and all possible boot identifiers.'
  merge: -1
  pgno: 97
- img_proc: true
  md: '2. UEFI searches for a GUID Partition Table (GPT) with a specific Globally
    Unique Identifier (GUID) that identifies it as the EFI System Partition (ESP),
    containing Extensible Firmware Interface (EFI) applications as booters. If there
    are multiple boot devices, the UEFI boot manager determines the appropriate ESP
    based on the order defined in the boot manager. With the efibootmgr tool, you
    can specify a different order if you not use the default.


    3. The UEFI boot manager checks whether Secure Boot is enabled. If Secure Boot
    is not installed, the boot manager requests the GRUB 2 loader on ESP. Otherwise,
    the boot manager requests a certificate from the boot loader and validates this
    against keys stored in the UEFI Secure Boot database. The environment is configured
    to perform a two-stage boot process, and shim to handle the certificate validation
    process.efi application is responsible for the certification is loaded before
    loading the GRUB 2 boot loader. If the certificate is valid, the boot loader runs
    and, in, validates the kernel that it is configured to load.


    The boot loader loads the vmlinux kernel into memory and creates a temporary RAM-based
    filesystem called tmpfs. This is then used to extract the contents of the initramfs
    image file. vmlinuz is the name of the bootable compressed Linux kernel executable.
    The initramfs filesystem embedded into the Linux kernel and loaded early in the
    boot process is called


    initramfs.


    4. Driver modules are loaded from the initramfs filesystem. These are needed to
    allow the access to the root filesystem.


    5. The system starts with the first process, systemend. All future processes spawn
    from this process. systemend process will always have a process ID of 1.


    6. The system process will run any additional processes defined for it. You can
    specify any other actions to be processed during the boot process by defining
    your system unit. This method is advised to be used instead of the /etc/rc. local
    file approach.


    # Legacy BIOS sequence


    Legacy BIOS booting hardware uses the following sequence:


    +   1. The system first performs a POST, which identifies the configuration of
    the system, tests memory, and identifies all possible boot devices.


    +   2. Once the BIOS identifies the boot device, it reads the first sector of
    the device, which is the Master Boot Record (MBR). The MBR contains the boot loader,
    which is a small program that is responsible for loading the operating system.
    The MBR reads the partition table, to determine the boot partition. Additionally,
    the MBR includes the pointer to the boot loader called GRUB 2. GRUB can then run
    on a device that GRUB is installed on or a separate device. This is helpful when
    multi-booting the same system with Linux and Windows.


    +   3. The boot loader loads the vmlinux kernel into memory and creates a temporary
    RAM-based filesystem called tmpfs. This is then used to extract the contents of
    the initramfs image file. vmlinuz is the name of the bootable compressed Linux
    kernel executable. The root filesystem embedded in the Linux kernel and loaded
    early in the boot process is called initramfs.


    +   4. Driver modules are loaded from the initramfs filesystem. These modules
    are needed to allow the access to the root filesystem.


    +   5. The kernel starts the systemd process.


    +   6. The systemd process runs any other processes defined for it. You can specify
    any additional actions to be processed during the boot process by defining your
    system unit. This method is recommended instead of the /etc/rc. local file approach.'
  merge: -1
  pgno: 98
