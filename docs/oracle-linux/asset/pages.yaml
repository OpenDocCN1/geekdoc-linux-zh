  md: "cloud provider may offer authentic encryption, it is important to remember\
    \ that if they can decrypt the data automatically, they also have access to the\
    \ keys. To truly protect your data, you need to encrypt the data with keys that\
    \ your cloud does not have access to. This can be done easily with Linux Unified\
    \ Key Setup (LUKS). Large organizations will also want to use Clevis, which enables\
    \ the automatic decryption of keys managed by a Tang server. The Tang server is\
    \ used to store and manage the encryption keys. In the cloud, this allows you\
    \ to manage your boot encryption without the cloud provider having access to your\
    \ keys. This process is called Network Bound Encryption (NBDE).\n\nNBDE is a security\
    \ feature used in Oracle Linux that provides disk encryption keys during the boot\
    \ process. NBDE is an extension of regular disk encryption and uses a network\
    \ server to store and provide the encryption keys to the local machine. Combined\
    \ with LUKS, this allows a local key (which requires a manual passphrase to use)\
    \ and an automatic key from the Tang server to decrypt the boot drive. This gives\
    \ you the simplicity of a secure automated boot, but in an emergency, you can\
    \ still boot without the Tang server.\n\n# Getting ready\n\nUnlike recipes, one\
    \ will need a minimum of two VMs: to act as the Tang server and the other to act\
    \ as a client. Both systems should be updated to the latest software.\n\n# How\
    \ to do it...\n\nIn this recipe, we will do the following:\n\n+   - Create a server\
    \ named *tang*:\n  - Install and configure a Tang server\n- Build another server\
    \ named *clevis*:\n  - Install and configure Clevis\n  - Configure LUKS with Clevis\
    \ to encrypt a data volume\n\n# Configuring a Tang server\n\nThe Tang server is\
    \ used by Oracle Linux to provide encryption keys during the boot process. Here's\
    \ a basic overview of how it operates:\n\n+   - During the boot process, the remote\
    \ system contacts the Tang server and requests an encryption key\n- The Tang server\
    \ generates a random encryption key and sends it back to the remote system"
