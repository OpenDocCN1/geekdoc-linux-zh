    As you can see in the preceding example, boot 0004 (Oracle Linux) is the boot
    entry used to start the currently system, called BootCurrent. BootOrder is the
    boot order in the boot manager; consequently, the boot manager will boot the first
    entry in the list. If it''s not successful, it will try the next entry, and so
    on. If you''re using UEFI on your system, efibootmgr is a handy command-tool that
    allows you to manage your EFI boot entries. With this utility, you can easily
    create, modify, and delete boot entries in the EFI boot manager.


    If you want to delete a boot entry, you can use the -b option. In this case, we
    will delete the CDROM record (0001) using the following command:


    ```

    efibootmgr -b 0001 -B

    ```


    You can also change the boot order with the -o option. In the following command,
    we will change the boot order to make the default boot:


    ```

    efibootmgr -o 0003,0004,0002

    ```


    Please use the man command to learn more about the efibootmgr command.


    # WARNING


    Be careful when changing the config. Accidentally changing the boot order to a
    device that is not bootable can put you in a situation where you are recovering
    the system. This is even more important if you are running in an environment where
    you do not have access to the console.


    # Playing with Secure Boot


    Secure Boot is an additional optional feature implemented in UEFI intended to
    help prevent malware execution during a boot process. To enable disable Secure
    Boot, you need to access your specific UEFI setup program. This is different for
    each system manufacturer. Check your system documentation to see how to access
    the UEFI configuration.


    The Secure Boot steps are identical to the regular UEFI booting but an important
    exception is that it requires the components to be signed and authenticated to
    be loaded and executed (private and public key pairs are used for authentication).
    It consists of two Roots of Trust (RoT) to build the transitive chain:


    +   - The verification RoT is responsible for the signature verification. The
    verification RoT is the launch RoT, which is what most referring to when speaking
    about Secure Boot, and it will lie on the flash drive as the RoT for storage to
    protect the key database. Verify only after the Driver Execution Environment (DXE)
    phase, not during the SECURITY (SEC) phase.

    - The measurement RoT is responsible for the measurement collection.'
