    This summarizes the bulk of the installation and configuration steps. Next, in
    order to make all of this work so that we can deploy and provision Oracle Linux
    Manager automatically using Vagrant, we will need to make some simple changes.
    All we really need to do is paste those steps into a Bash shell script and tell
    Vagrant to use a provisioner to run these commands on the box. Also, again, since
    automation cannot be interactive, we will need to add -y to all the yum commands.


    Therefore, to clean up and prepare them for Vagrant, our Bash script will look
    something like this:


    ```

    #!/bin/bash

    yum remove ita -y

    echo "exclude=ita*" >> /etc/yum.conf

    yum-config-manager --disable ol7 -y

    yum install oracle-release-el7 -y

    yum install oracle-linux-manager-server-release-el7 -y

    yum-config-manager --enable-el7 --optional-latest -y

    yum install spacewalk-schema-2.10.14-1.el7 spacewalk-setup-postgresql spacewalk-postgresql

    spacewalk-setup -utils -y --non-interactive --answer-file=/tmp/answer-file.txt

    ```


    # NOTE


    At some point while writing this recipe, an update was made to the spacewalk-schema
    package making it no longer compatible with PostgreSQL. This can be fixed by pinning
    the spacewalk-schema package to spacewalk-schema-2.10.14-1.el7 as shown in the
    preceding snippet.


