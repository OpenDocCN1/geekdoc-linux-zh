    location of that mount on the host system. For example, if you want to store your
    data in /mnt/hdd/podman/volumes/, you would simply need to specify this location
    as the source location. I prefer to my it as an environment variable called VOLUME_DIR
    so that I can reference it with $(VOLUME_DIR). Then when I specify creating a
    bind mount in the container, I simply use podman run -v $(VOLUME_DIR):/var/lib/mysql
    mysql:8-oracle. This will ensure that my data is stored in a predictable location
    on my system, and each container gets its dedicated folder within that path.


    # Initialization scripts


    Most containerized databases feature a way to facilitate the running of scripts
    after initial setup, which can be very handy. This is typically by allowing the
    user to mount a directory from the host machine that contains .sql and/or .docker-entrypoint-initdb.d
    directory of the container. The scripts are generally executed in alphabetical
    order and thus can be easily controlled by adding a prefix, for example, 01_users.sql,
    02_permissions.sql, 03_hostname.sh, and so forth:


    +   - The MySQL database:


    The MySQL database supports *.sh and *.sql scripts in the following mount points:


    /docker-entrypoint-initdb.d


    +   - The PostgreSQL database:

    nThe PostgreSQL database supports *.sh, *.sql, and *.sql.gz scripts in the following
    mount points:


    /docker-entrypoint-initdb.d


    +   - The MongoDB database:

    nThe MongoDB database supports *.sh and *.js scripts in the following mount points:


    /docker-entrypoint-initdb.d


    +   - The Oracle database:

    The Oracle database supports *.sh and *.sql scripts in the following mount points:


    - /opt/oracle/scripts/setup: Post-setup scripts

    - /opt/oracle/scripts/startup: Post-startup scripts

    - /docker-entrypoint-initdb.d: Symbolic link representing the aforementioned directories


