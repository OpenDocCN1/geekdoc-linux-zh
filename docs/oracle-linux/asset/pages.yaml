  md: '# Setting up the web server – HTTPD


    The next step for the PXE server is to install a web server. In this example,
    we will use Apache.

    Other web servers will also work, but Apache is one of the most common.


    # Getting ready


    To set up an HTTP server, you will need an Oracle Linux 8 VM running in your environment.
    The server’s IP address should be routable to the VMs we are using, and the firewall
    ports should allow HTTP/HTTPS traffic. Ideally, you should also have enough space
    for several ISO files.

    Normally, 20-30 GB is enough data space.


    # How to do it...


    Starting the install of the Apache HTTPD server is simple; just `yum install -y
    http`.

    Once the server is installed, copy the ISO file to a directory of your choice.
    In our example, OracleLinux-R8-U5-x86_64-dvd.iso is copied into `/root`, as seen
    in Figure 2.9.


    ```

    [root@pxe ~]# ls  initial-setup-ks.cfg  anaconda-ks.cfg OracleLinux-R8-U5-x86_64-dvd.iso

    [root@pxe ~]# #

    ```


    > Figure 2.9 – Oracle Linux ISO in /root


    The next step is to mount the ISO file in a directory under `docroot`. With the
    standard install of Apache, `docroot` is in `/var/www/html`, so a directory `ol8`
    is created. When the ISO is mounted, it is more efficient to use a loopback method.
    This allows an ISO file to be mounted as a normal filesystem. Next, using a loopback
    method, mount the ISO file to `/var/www/html/ol8` as the mount point using the
    following command:


    ```

    mount -o ro,loop /root/OracleLinux-R8-U5-x86_64-dvd.iso /var/www/html/ol8

    ```


    Once mounted, a `df` command will show the mounted filesystem. The entire chain
    of commands can be seen in the following screenshot, Figure 2.10.'
