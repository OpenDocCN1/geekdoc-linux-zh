    # Building a DNF/YUM mirror from ULN


    It is very common for admins to not enable internet access for the systems running
    in a secure network, like banking of Government networks. A local mirror of Oracle''s
    **Unbreakable Linux Network (ULN)** is a great way to allow systems to access
    patches without having to reach out across the internet to access them.


    # Getting ready


    To do this, you will need a YUM server running Oracle Linux 8. The local system
    should have internet access to reach the ULN servers via direct or a proxy. Only
    the system (often called a YUM server) synchronizing to ULN will require this
    access; all the systems using this system will not need access to the internet,
    they will use this system to access patches.


    The system is not CPU- or RAM-intensive — 2 cores and 4 GB of RAM are often more
    than enough for the server, but they will use a lot of disk space. You can check
    how much space is needed by running the `dnf repolist -v` command.


    A terabyte can go quickly, depending on how many repos the server is subscribed
    to. The good news on space is that high-performance storage is not required. You
    will need a valid support contract with Oracle, which is included in the support
    contract if you are running on Oracle servers. On my local repos, I keep the repo
    in /var and mount it as a separate filesystem under **Logical Volume Management
    (LVM)**. This way, additional space can easily be added when needed.


    Additionally, an HTTP server should be installed and you must ensure that the
    firewall ports are opened. If you need doing that, go back to Chapter 2, Installing
    with and without Automation Magic, where setting up an HTTP server is covered.


    # How to do it...


    To build the mirror, follow these steps:


    +   1. The first step is to validate that enough space is in `/var/`. For a small
    mirror, 600 GB is recommended as a starting point. Watch the disk space carefully,
    as it may be needed down the road. Larger mirrors can easily consume 2 TB.


    +   2. Next, install the `uln-yum-mirror` package using the `dnf install uln-yum-mirror
    -y` command. The **uln-yum-mirror** package includes the scripts that automate
    the replication of the Oracle ULN repository to a local server. Make sure that
    the system has access to the **ol8-addons** repo:'
