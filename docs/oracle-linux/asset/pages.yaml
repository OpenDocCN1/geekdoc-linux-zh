    The profiles of are included as follows:


    +   - ANSI-BP: ANSI-BP is a set of security recommendations developed by the French
    National Agency for the Security of Information Systems (ANSSI) to provide guidance
    on securing information systems. The ANSI-BP recommendations cover a wide range
