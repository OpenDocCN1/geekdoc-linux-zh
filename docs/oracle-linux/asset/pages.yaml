    \ Details on configuring the oracle-oci builder can be retrieved at https://developer.hashicorp.com/packer/plugins/builders/oracle/oci:\n\
    \n+   - There are numerous ways to do this. One way is to reference variables\
    \ for the authentication details directly in your .pkr.hcl file, like this:\n\n\
    ```\nsource \"oracle-oci\" \"example\" {\n  tenancy_oci         = `${var.tenancy_oci}`\n\
    \  compartment_oci     = `${var.compartment_oci}`\n  user_oci            = `${var.user_oci}`\n\
    \  fingerprint         = `${var.fingerprint}`\n  key_file            = `${var.key_file}`\n\
    \  subnet_oci          = `${var.subnet_oci}`\n  availability_domain = `${var.availability_domain}`\n\
    \  region              = `${var.region}`\n}\n```\n\nFigure 8.27 – Referencing\
    \ variables in Packer\n\n+   - Then, we need to declare all of those variables\
    \ in a file named variables.pkr.hcl. In this file, we declare the variable and\
    \ specify the type, as well as providing a description to explain the purpose\
    \ of the variable. Input the following into your variables.pkr.hcl file:"
