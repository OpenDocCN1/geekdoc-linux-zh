    # Cooking up the perfect lab environment with Vagrant


    Recently at work, I was tasked with preparing a demo of Oracle Linux Manager and
    showcasing several features of the software. This is an easy thing to do, but
    there are several barriers to entry that stand the way before you access the web
    GUI for Oracle Linux Manager.


    For starters, Oracle Linux Manager requires Oracle Linux 7; it''s not yet created
    on Oracle Linux 8. So, I set out to download the ISO for Oracle Linux 7 and proceed
    to create a VM in VirtualBox and installed the OS. I wanted to SSH into this,
    so I had to go into the settings menu for VM and configure port forwarding from
    the host to the guest. At this point, I was able to SSH in, and then followed
    the installation instructions for Oracle Linux Manager. It''s not bad setting
    things up, but there were several speed-bumps along the way. For instance, I needed
    to decide on a database to use. Oracle supports only Oracle Database for use with
    Oracle Linux Manager, but for the sake of brevity (and since this was also intended
    as a demonstration of Oracle Linux Manager), I decided to use PostgreSQL.


    With many manual steps, I''d be inclined to keep my newly created virtual machine
    and take care of it like a pet. They say containers are like cattle, and virtual
    machines are like pets. That is, until you start using tools like Vagrant. Vagrant
    does a good job making your virtual machines blend in with the cattle – thanks
    to how easy it is to recreate your virtual machines using Vagrant, you no longer
    need to care for them the way you had if you weren''t using Vagrant.


    This recipe will walk you through the process of creating a lab environment using
    Vagrant.


    # Getting ready


    You will need the following for this recipe:


    +   - Oracle Linux'
