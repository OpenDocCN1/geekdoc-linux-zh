    UUID=1d1c19d4-abbf-46c8-a93e-feb826f669 btrfs swap           0 0

    root@btrfs ~#

    ```


    Figure 4.15 - Subvolume in btrfs


    Now that we have the subvolume mounted, let''s add a quota to limit it to 5 GB.
    To do this, we first need to create quotas for the volume. This is done with the
    following command:


    ```

    btrfs quota enable /data

    ```


    Next, we need to assign a quota-limit to the subvolume. This will restrict the
    subvolume size defined. We do using the limit option, as seen in the following
    command:


    ```

    btrfs qgroup limit 5g /data/vol

    ```


    You can see what quotas are defined in a volume using the btrfs qgroup show command
    with the

    ref option:


    ```

    root@btrfs ~# btrfs qgroup show -ref /data/vol

    groupid         rfer        excl        max_rfer      max_excl

    -------------------------------------------------------------

    0/256            16.0KiB      16.0KiB      5.0GiB       none

    root@btrfs ~#

    ```


    Figure 4.16 - Set quotas


    Now that we have a quota set, let''s create a snapshot for backups. We need a
    place for the backups, so let''s create a subvolume for the backups with the following
    command:


    ```

    btrfs subvolume create /data/backup

    ```'
