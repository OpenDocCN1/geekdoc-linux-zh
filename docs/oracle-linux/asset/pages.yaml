- img_proc: true
  md: '+   - **Data distribution**: Data is distributed across the cluster in the
    way that improves both performance and reliability. Data can be distributed evenly
    or based on specific criteria.


    +   - **Automatic healing**: Gluster has a self-healing feature that automatically
    detects and repairs data inconsistencies or corrupted files.


    Gluster is often used in environments where large-scale, distributed storage is
    required, such as web servers, cloud computing, big data analytics, and media
    streaming services. It provides a cost-effective and flexible solution for managing
    data across a network of servers and storage devices.


    # Getting ready


    For this recipe, you will need two Oracle Linux 8 systems, each with access to
    YUM repos. For this exercise, we will call them gluster1 and gluster2. They are
    identical systems, each with 8 GB RAM, 4 vCPUs, and 100 GB of space. The filesystems
    have 50 GB, 5 GB in /home, and 8 GB in swap. The remaining space is unallocated.
    Additionally, for this example, each node will have a 100 GB LUN using Gluster
    data.


    # WARNING


    Having at least three nodes in a cluster is highly recommended to avoid split-brain
    clusters. Although a two-node cluster is possible, it poses a risk of corrupt
    data if the system ever splits its. Split-brain clusters are undesirable in distributed
    computing environments because they can result in data inconsistency, corruption,
    and operational issues. Split brain occurs when the nodes in a cluster lose connectivity
    or communication with each other, leading to the cluster''s division into multiple
    isolated nodes. Each node thinks it is the active or primary cluster, resulting
    in the potential for conflicts and data discrepancies.


    On each server, you will need to perform the following prep work:


    +   1. Create an XFS filesystem on the 100 GB LUN. This will be used to store
    the Gluster data, known as bricks. In the context of Gluster, a brick refers to
    a basic storage unit within the storage cluster. A cluster is made up of multiple
    bricks, which each essentially directs storage devices or where data is stored.
    Each brick represents a portion of the overall storage capacity of the cluster.


    +   2. Since we will use Gluster to manage the storage, we will not be using LVM
    on the filesystem. On these systems, `/dev/sdb` is the 100 GB LUN. The following
    commands are used to create and mount the filesystem:


    ```

    mkfs.xfs -i size=512 -L glusterfs /dev/sdb

    mkdir -p /data/glusterfs/volumes/bricks

    echo ''LABEL=glusterfs /data/glusterfs/volumes/bricks xfs defaults 0 0'' | sudo
    tee -a /etc/fstab

    mount -a

    ```


    +   3. When completed, check with a df df command to verify that the filesystem
    is mounted, as seen in the following example:'
