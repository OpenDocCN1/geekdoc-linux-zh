- img_proc: true
  md: 'To do this you will need a system, running Oracle Linux 8, with access to the
    internet.


    # How to do it...


    When using Ksplice, make sure each system matches for the operating system version,
    and the user-space libraries. Do not use an Oracle Linux 9 repo for an Oracle
    Linux 8 system. An example of what a system should look like can be seen in the
    following screenshot:


    ![](img/110fa0d6324f0893fff03cee6394144d_244_0.png)


    If you are using an proxy server, you will need to export some environmental variables
    to the proxy servers:


    | Name -> | Description |

    |---|---|

    | EPEL Modular Packages for Oracle Linux 8 (u8_64) | EPEL Modular Packages for
    creating test and development environments - Oracle Linux 8 (u8_64) |

    | EPEL Packages for creating test and development environments for Oracle Linux
    8 (u8_64) | EPEL Packages for creating test and development environments - Oracle
    Linux 8 (u8_64) |

    | Ksplice for Oracle Linux 8 (u8_64) | Ksplice clients, updates, and dependencies
    for Oracle Linux 8 (u8_64) |

    | Oracle Linux 8 Latest (u8_64) | Installation of the latest system packages released
    for Oracle Linux 8 (u8_64) including the latest erata packages (u8_64) |

    | Oracle Linux 8 BaseOS Latest (u8_64) | Base operating system package released
    for Oracle Linux 8 (u8_64) |

    | Unbreakable Enterprise Kernel Release for Oracle Linux 8 (u8_64) | Unbreakable
    Enterprise Kernel released for Oracle Linux 8 packages for Oracle Linux 8 (u8_64)
    |


    Figure 7 – Required channels


    ```

    sudo http_proxy=http://proxy_server_URL:http_port

    sudo https_proxy=http://proxy_server_URL:https_port

    sudo export http_proxy https_proxy

    ```


    Set proxy_server_URL to the proxy server, and http_port to the port the proxy
    server uses.


    Next, Ksplice will be installed using dnf. Both the ksplice and uptrack packages
    are:


    ```

    dnf install -y ksplice uptrack

    ```


    When the installation is complete, please verify that your system is seen in the
    ULN and that an access key has been populated in /etc/uptrack/uptrack.conf.


    The access key should be in the [Auth] section to look similar to this:'
