  md: '# 1


    # Oracle Linux 8 – Get It? Got It? Good!


    You finally made the choice to upgrade to the most secure and reliable Linux distribution
    and now need to learn a few tricks. What''s next? How do you get started? It''s
    time to go back to the basics and answer the question *How do you install Oracle
    Linux?


    Back in the old days, installing a Linux distribution was a simple task; simply
    ordered a CD-ROM, popped into your computer, and booted from the disk. Simple...
    effective... and a pain for many system administrators. Who wants to order a CD-ROM,
    or for that matter, who even uses CD-ROMs or DVDs, or even Blu-ray disks, anymore?
    Can''t you just boot from the network to install? To make it more complicated,
    what happens when you are in the cloud? Doesn''t the cloud do it for you? What
    about the CPU type, such as Arm or x86? How can you automate tasks?


    This chapter will provide insights into these questions and help you learn a few
    tricks to automate installing Oracle Linux, as well as some helpful troubleshooting
    tips if the installation does not go as planned.


    We will cover the main recipes in this chapter:


    +   - Oracle Linux 8 – which ISO is right? USB? Does anyone use DVDs?

    - Burning an ISO so it''s bootable

    - Two for the price of one – running Oracle Linux on Windows Subsystem for Linux
    (WSL)

    - Arm''s having for the future of IT – it''s not just a Raspberry Pi

    - Leaping from Oracle Linux 7 to 8

    - Migrating from CentOS to Oracle Linux


    # Technical requirements'
  merge: -1
