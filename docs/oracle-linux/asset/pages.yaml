    \ yes\nvars:\n  - ansible_python_interpreter: /usr/bin/python3\ntasks:\n  - name:\
    \ Get hostname\n    debug:\n      msg: '{{ ansible_hostname }}'\n    tags:\n \
    \     - always\n  - name: Ensure groups exists\n    ansible.builtin.group:\n \
    \     name: admins\n      state: present\n  - name: Ensure groups exists\n   \
    \ ansible.builtin.group:\n      name: developers\n      state: present\n  - name:\
    \ Create standard user and add to specific groups\n    ansible.builtin.user:\n\
    \      name: kerti\n      shell: /bin/bash\n      groups: admins,developers\n\
