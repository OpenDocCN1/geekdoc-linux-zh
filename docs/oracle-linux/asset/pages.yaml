    \ 1.2 level 5, 512K chunk, algorithm 2 [4/3] [UUU_]\n      =======....... recovery\
    \ = 61.7% (12943806/20954112) finish=1.8mi\ns speed=12824K/sec\nunused devices:\
    \ <none>\n[root@xfs ~]# \n```\n\n![](img/110fa0d6324f0893fff03cee6394144d_147_0.png)\n\
    \nThe last step, optional, is highly recommended. This will save the current config\
    \ to the mdadm configuration file. This helps the kernel assemble at boot. This\
    \ is done with the following command:\n\n```\nmdadm --examine --scan /etc/mdadm.conf\n\
    ```\n\n# How it works...\n\nNow, let's look at a few things about the MD device.\
    \ First, if we use the isblk command, we will see the disks used by md0 are now\
    \ identified as had0 as children. This is because md0 is a child of the actual\
