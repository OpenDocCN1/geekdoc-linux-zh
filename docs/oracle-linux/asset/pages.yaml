    # How to do it...


    First, let''s take a look at whole-file encryption. To begin, we''ll first need
    to define our Ansible host file in plain text.


    # Whole-file encryption


    Typically, an Ansible host will look something like this:


    ```

    # hosts

    [host1]

    192.168.2.70

    [host1:vars]

    ansible_user=admin

    ansible_password=B8-by-Y0dA

    ansible_connection=ssh

    ansible_shell_type=powershell

    [host2]

    192.168.2.71

    [host2:vars]

    ansible_user=admin

    ansible_password=B8-by-Y0dA

    ansible_connection=ssh

    ansible_shell_type=powershell

    ```


    You can encrypt the file by running the following in the terminal/console:


    ```

    $ ansible-vault encrypt hosts --ask-vault-pass

    New Vault password:

    Confirm New Vault password:

    Encryption successful

    ```


    I am using a randomly generated string as my vault password.


    Another way to encrypt the file is use a vault password file so you don''t have
    to input the password every time you encrypt/decrypt something. To do this, create
    a file name vault_password and paste only the vault password into it.'
