    # NOTE


    If SELinux was disabled for any amount of time, these contexts would not have
    been set while it was not running. There is a shortcut to get SELinux to re-label
    the entire filesystem hierarchy: `# touch /.autorelabel`


    Now reboot the machine. As SELinux starts, it will set all file and security contexts
    to the default for each type and location.


    # SELinux users


    SELinux users are labels used to classify different types of users in a Linux
    system. selinux users are an important part of SELinux security policies, which
    are used to confine the actions of a user to a specific set of resources on the
    system.


    There are several types of SELinux users:


    +   - **System users**: System users who are defined by the system and are used
    to run system services or daemons. These users are typically assigned a unique
    SELinux user label, which is used to confine the actions to a specific set of
    resources on the system.


    +   - **Login users**: Login users who are defined by the system and are used
    to log into the system. These users are typically assigned a unique SELinux user
    label, which is used to confine the actions of the user to a specific set of resources
    on the system.


    +   - **Staff users**: Staff users who are defined by the system and are used
    by staff members to perform their work. These users are typically assigned a unique
    SELinux user label, which is used to confine the actions of the user to a specific
    set of resources on the system.


    +   - **User-defined users**: User-defined users who are defined by the system
    administrator. These users are typically assigned a unique SELinux user label,
    which is used to confine the actions of the user to a specific set of resources
    on the system.


    Here are some of the commonly used SELinux commands:


    +   - **semage user**: This command is used to manage SELinux users and their
    properties. For example, to create a new SELinux user, you can use the command
    `semage user -a -R s0:s0:c0:c1023 -r s0 -L s0:c0:c1023 -P user -n username`


    +   - **semage login**: This command is used to manage SELinux login mappings,
    which map system users to SELinux users. For example, to create a new login mapping,
    you can use the command `semage login -a -s_u -r s0 username`


    +   - **semage staff**: This command is used to manage SELinux staff mappings,
    which map staff members to SELinux users. For example, to create a new staff mapping,
    you can use the command `semage staff -a -s_u -r s0 username`.


    +   - **semage sudo**: This command is used to manage SELinux sudo mappings, which
    map sudoers to SELinux users. For example, to create a new sudo mapping, you can
    use the command `semage sudo -a -R "s0:s0:c1023" -L s0:c0:c1023 -0 username`


    +   - **semage port**: This command is used to manage SELinux port mappings, which
    map ports to SELinux types. For example, to create a new port mapping, you can
    use the command `semage port -a -t http_port -p tcp 80`.'
