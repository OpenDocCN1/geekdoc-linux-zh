  md: 'So, now that we''ve gone over the usage of AppStreams, you might be asking
    yourself, “Didn’t we already have a similar capability with Software Collections?”
    The answer is yes, but there is a big difference between Software Collections
    and AppStreams.


    Where Software Collections provides Parallel Availability and Parallel Installability,
    AppStreams provides only Parallel Availability.


    According to the Fedora docs, *Parallel Availability means that more than one
    major release of a popular software project is available for installation.* And
    *Parallel Installability means that more than one major release of a software
    project can be installed on the same userspace.*


    Now you might be asking, “Wait, so you’re telling me that AppStreams is not as
    good as what we had before?” Well, exactly. It turns out that Parallel Installability
    isn''t all it cracked up to be. Although seems nice nice the surface to have the
    ability to install multiple versions of software on the same system, it is plagued
    with complications of requiring users to know they to do something extra in order
    to make use of the installed software or alternate version. For example, if you
    wanted to install multiple versions of Node.js, you would first need to enable
    the desired Software Collection for Node.js, and then you would also need to know
    where to look for and activate the specific version you want to use. In other
    words, you cannot simply use the alternate version of the software in the normal
    way because the packages would get installed in non-standard locations.


    AppStreams solves this because it does not allow for Parallel Installability;
    instead, it provides the capability of Parallel Availability. In other words,
    you install one and only one package at a time, and you use it like you normally.
    If you want a different version, well, simply enable a different stream.


    As a bonus, AppStreams is particularly useful when creating containers that are
    single-use by design. Having AppStreams means each container image is configured
    with the right version of the module, which is then globally available within
    the container. If you need multiple versions, just run multiple containers.


    AppStreams makes it much easier to install different versions of software, and
    the best thing is, if you know nothing about AppStreams, you can still use DNF
    the old-fashioned way and get your basic applications installed.'
  merge: -1
  pgno: 350
- img_proc: true
  md: '# Lions, Tigers, and Containers – Oh My! Podman and Friends


    These days, it''s all about containers. Docker made containers cool and brought
    them into the mainstream, and Podman is here to come to the rescue as an open
    source container runtime that is open and available to all. Oracle Linux 7 includes
    Oracle Container Runtime for Docker, whereas Oracle Linux 8 and beyond include
    Podman, Buildah, and Skopeo.


    With every new release, Podman closes the gap between it and Docker. With Podman
    v2.0, it began offering a fully compliant build that enables technologies such
    as docker-compose to work interchangeably with Podman. With Podman v4.1.0, you
    are now able to seamlessly mount the machine''s home directory into the Podman
    VM, making it available within volume mounts. This chapter is largely intended
    for users who have some basic experience with Docker and will help users understand
    the differences between Docker and Podman so that they can successfully migrate
    their workloads to this so-called “drop-in-replacement.” If you''re not familiar
    with Docker or are new to the concept of containers, it may be helpful to peruse
    the Get Started guide from Docker, which can be found here: https://docs.docker.com/get-started/.


    In this chapter, we''re going to cover the following recipes:


    +   - Ridding yourself of demons – err um demons, with Podman

