    # Oracle Linux in the cloud


    We could list all the CSPs here and apart their pros and cons, but ultimately,
    every CSP has a main competency. Oracle Linux does add to that competency, making
    the product stronger and more versatile. Like any other (open source) Linux distribution,
    Oracle Linux is a versatile and powerful OS. In the case of Oracle Linux, the
    OS was designed with elements that are compatible with RHEL, not to compete, but
    to add functionality as well as a portal into functionality beyond RHEL.


    The fluidity of Oracle Linux, much like RHEL, allows it to go beyond just being
    an OS. Oracle Linux extends the field, maximizing the Linux tools surrounding
    virtualization into VM management through Oracle Linux Virtualization Manager
    (OLIVM), cross-functionality into cloud platforms, and automation, just to name
    a few. What Oracle aims to do is to offer the functionality of an RHEL OS but
    go beyond and tie that OS into a global business network of toolsets to drive
    business success. Now, of which was mentioned at the beginning of this chapter.
    This recipe is about which CSPs are most compatible with Oracle Linux; however,
    understanding what and how the OS operates is integral to understanding which
    CSPs are compatible with Oracle Linux and thus maximizing its capability.


    Oracle supports and promotes open source technologies for business-critical environments.
    Oracle is a founding member of the Linux Foundation, Eclipse Foundation, and Java
    Community Process, and contributes significantly to open source projects. Oracle
    software with open source technologies offers high performance, reliability, and
    data security while reducing computing costs.


    The following diagram provides a cost-benefit analysis of Oracle Linux “Free”
    (the only paid component is support) versus RHEL with the extended features added
    on, as mentioned previously.'
  merge: -1
  pgno: 452
- img_proc: true
  md: '![](img/110fa0d6324f0893fff03cee6394144d_453_0.png)


    As with any Linux distribution, each CSP has its own flavor or choice of Linux
    platform. For instance, AWS has Amazon Linux 2 (AL2), Azure offers compatibility
    with anything RHEL or Ubuntu based, and Oracle has Oracle Linux, of course. There
    are so many differences between Ubuntu and Oracle Linux, AL2, and so on, but we''re
    not here to discuss the differences. Ultimately, all CSPs can run Linux distributions,
    but not all are optimized for Oracle Linux. With AWS and Azure, you have the option
    of Buying Your Own Support (BYOS) from Oracle (support includes access to patching,
    upgrades, and OS support) or using these services for free without tech support.
    With OCI Premier, support is included for free. The following diagram shows the
    main CSPs and their differing adoptions of Oracle Linux.'
