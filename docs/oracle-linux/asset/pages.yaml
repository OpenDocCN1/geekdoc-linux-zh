    \  3134373436363236223035383436333136363337313633333939393933363636333333333063\n\
    \  6234\n```\n\nFigure 8-4. Contents of secrets.yml\n\n# IMPORTANT\n\nYou may\
    \ notice the encrypted value changes every time you run the command, even when\
    \ you encrypt the same value\nusing the same password. The random salt changes\
    \ each time you encrypt it; this is by design, and the intent is to ensure\nthe\
