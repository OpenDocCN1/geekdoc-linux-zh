  md: '# NOTE


    It is highly recommended to always use the check option for your servers. If you
    do not run the checks, the system will send traffic to the server!


    # listen


    In HAProxy, the listen section is used to define a frontend and backend configuration
    together in one block, making it a convenient way to combine both. The listen
    section allows you to define options specific to the listening socket and when
    incoming traffic is handled. The following are some commonly used options in the
    listen section:


    +   - bind Defines the IP address and port on which HAProxy will listen for incoming
    traffic. For example, bind :80 listens on all IP addresses on port 80.

    - stats: Enables the HAProxy statistics page for monitoring and managing HAProxy.

    - stats enable Enables monitoring for HAProxy.

    - stats uri: Specifies the URI path for accessing the statistics page. For example,
    stats uri /happroxy_stats sets the statistics page to be accessible at http://your-happroxy-ip/happroxy_stats.

    - stats realm Sets the realm (authentication realm) for HTTP basic authentication
    when accessing the statistics page. This adds a layer of security to prevent unauthorized
    access.

    - stats auth Configures the username and password for HTTP basic authentication
    when accessing the statistics page. The format is stats auth username:password.

    - stats hide-version: Hides the HAProxy version number from the statistics page.
    This is useful when using dynamic server templates.

    - stats show-node: Displays the server node names on the statistics page.

    - stats refresh: Sets the interval (in milliseconds) for automatic refresh of
    the statistics page. For example, stats refresh 10 refreshes the page every 10
    seconds.

    - stats admin: Specifies the IP address and port for allowing administrative access
    to HAProxy statistics. It allows remote management using the statistics page.
    For example, stats admin localhost permits access only from the local machine.

    - stats maxconn: Limits the number of connections allowed to the statistics page.
    It helps to prevent overload and potential denial-of-service attacks.

    - errorfile: Specifies a file to use as a custom error page for frontend errors.


    For the sample listen section, we will define it as metrics, allowing admin access
    from 192.168.56.1. The user will use the username as admin and the password password
    to log in.


    ```

    backend www_servers

    balance roundrobin

    server web1 192.168.56.200:80 check

    server web2 192.168.56.201:80 check

    ```


