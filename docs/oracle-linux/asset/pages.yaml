  md: 'Once the volume is created, you can now use it for filesystems or storage for
    a logical volume manager.


    # Playing with logical volume management


    When it comes to filesystems, one of the biggest issues is their inflexibility
    when it comes to storage. Creating a volume on a disk means the space is locked
    in the volume, which also locks the size of the filesystem. However, Logical Volume
    Manager (LVM) provides a solution to this problem. LVM is a widely used tool in
    the field of computer storage management that acts as a layer of abstraction between
    physical storage devices, such as hard drives or SSDs, and the OS. This enables
    the flexible and efficient management of storage resources. LVM is especially
    valuable for Linux systems, as it offers a flexible and scalable storage management
    solution.


    With LVM, administrators can dynamically allocate and resize volumes without the
    need to repartition or disrupt the system. This flexibility is particularly useful
    in environments where storage requirements change frequently or where efficient
    resource allocation is needed. Additionally, LVM introduces the concept of volume
    groups, which act as logical containers for physical storage devices. By creating
    logical volumes within volume groups, administrators can easily allocate and manage
    storage, simplifying the management of storage resources in Linux systems and
    making it easier to organize and utilize storage resources effectively.


    With LVM, there are three core components of the storage:


    +   - **Physical volumes (PVs)**: These are the block-level devices that are used
    for storage. They can be physical disks, virtual disks (such as the MD devices
    created in the median recipe), or other block-level devices.

    - **Volume groups (VGs)**: These are groups of PVs that are combined into a single
    logical device. They can be a single device to start with, with new devices added
    to add capacity.

    - **Logical volumes (LVs)**: These are logical disks built into the VG. They are
    used to create filesystems and can be dynamically resized as needed.


    LVM, a VG, is a central component that acts as a logical container for one or
    more PVs. A VG is created by combining physical storage devices, such as hard
    drives or SSDs, into a single storage pool.


    In this recipe, we will show you how to initialize PVs, create a VG, and add LVs
    for future use by a filesystem. We will also show some of the basic management
    commands.


    # Getting ready'
  merge: -1
  pgno: 149
