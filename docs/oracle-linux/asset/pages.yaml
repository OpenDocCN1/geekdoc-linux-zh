    # How it works...


    The way this is the acme.sh script generates a temporary key file and places it
    in the .well-known/acme-challenge directory. The system then queries the internet
    to the server to get the file. If it can get to the file, the test and new keys
    are issued. It is important to monitor this, as third-party software or SELinux
    can impact your ability to get to the temporary key.


    Now that the certificate is set up, there is one task left to make this a refresh.
    You can easily have the system check daily for a new certificate by adding in
    the following cron job. As a note, you will need to adjust the location of the
    script based on where you installed it. In this case, it is installed in /home/acme/.acme.sh.


    ```

    0 * * * /home/acme/.acme.sh/acme.sh --cron /home/acme/.acme.sh > /dev/null

    ```


    # NOTE


    When using keys that automatically update, it is highly recommended to monitor
    your sites for SSL errors. Ideally, you are checking for SSL errors once an hour
    in case things break. Look the web server''s SSL logs and also run a check with
    a tool like wget or curl to verify that the site is running. Both wget and curl
    will fail with an error if the SSL key is invalid.


    # Encrypting all data at rest


    Encrypting your data in motion is great, but you also need to encrypt the data
    at rest. This is especially important in the cloud, where you are sharing storage
    with many other users. While your'
