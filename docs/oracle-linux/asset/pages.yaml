  md: 'block-sharing-reflink.


    With XFS, administrators can perform a broad range of filesystem operations while
    the filesystem is mounted and in use. This includes online resizing, enabling
    seamless expansion or contraction of filesystems without unmounting or disruption
    of services. These online administration capabilities XFS highly suitable for
    environments that demand continuous availability and minimal downtime. XFS also
    offers extensive support for extended attributes, **access-control lists (ACLs)**,
    and timestamps with nanosecond precision. These features provide flexibility in
    managing file metadata and enable the implementation of complex permission structures
    and custom metadata schemes.


    XFS is natively supported by the Linux kernel, a well-integrated and widely adopted
    choice for Linux distributions. It is the default filesystem in Oracle Linux and
    continues to benefit from ongoing development and improvement by Oracle and the
    Linux community. Additionally, XFS comes with a comprehensive set of tools for
    filesystem management and administration, making it an all-around top-notch option.


    # Getting ready


    The examples in this recipe will use the previously created `xffs` LV. XFS filesystems
    can be created on any block device.


    # How to do it...


    The most common way to create an XFS filesystem is to use the `mkfs.xfs` command
    with a single block device. This will place both the data and the journal on the
    same device:


    ```

    mkfs.xfs /dev/mapper/DATA-xf1

    ```


    Additionally, you can get more control using additional parameters:


    | Option | Description | Samples |

    |------|---|--- |

    | -L | This adds a label to the filesystem. | -L Test |

    | -b | This sets the block size. | -b 8192 |

    | -f | This is the force option. | -f |

    | -l | This sets the location and size for the journal. This is commonly | -l
    20m |'
