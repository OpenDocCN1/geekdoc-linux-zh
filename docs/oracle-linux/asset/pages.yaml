  md: '# Getting ready


    For this recipe, you will need three Oracle Linux 8 systems, each with access
    to yum repos. For this exercise, we will call them networking, client1, and client2.
    They are mostly identical systems, each with 8 GB RAM, 4 vCPUs, and 100 GB of
    drive space. The difference is that networking should have two network interfaces
    on the same network. The filesystems have 50 GB in /, 5 GB in /home, and 8 GB
    in swap. The remaining disk space is unallocated.


    # How to do it...


    While this can be done via the GUI, this recipe will cover doing this from the
    command line. As a note, when working on the main network connection to the server,
    you will be in the system console. Doing via a remote connection such as SSH can
    leave you in a situation where you lose access to the server. Here are the steps
    to configure a redundant connection.


    +   1. The first thing you will need to create the bond. In this example, we will
    create it using the balance-alb mode to best balance both incoming and outgoing
    traffic:

    ```bash

    mcli connection add type bond con-name "Bond 0" ifname bond0.options "mode=balance-alb"

    ```

    2. Next, we will configure the bond to DHCP. On production servers, you would
    normally use a manually configured IP address:

    ```bash

    mcli connection modify "Bond 0" ipv4.method auto

    ```

    3. Add the adapters that will be members of the bond. In this case, we will be
    using enp0s3 and enp0s8:


    # NOTE


    If you are adding a port to a bond that is already in use, you should delete that
    port now. In this case, enp0s3 was in use, so it was deleted with the following
    command:

    ```bash

    mcli connection add type ethernet slave-type bond con-name bond0-if1 ifname enp0s3
    master bond0

    mcli connection add type ethernet slave-type bond con-name bond0-if2 ifname enp0s8

    ```


    +   4. Now, we will start the connection and check the status:

    ```bash

    mcli connection up "Bond 0"

    mcli device

    ```


    When completed, the output of the nmcli device command should look like the following:'
