    ```

    $ oci-api-key.pem $

    ```


    Figure 13.28 – OpenSSL key creation


    After creating the preceding key, you need to change the permissions so the key
    can be used only by you. We''ll use chmod to configure these permissions and the
    key to be used by the user.


    ```

    $ chmod 600 oci-api-key.pem $

    ```


    Figure 13.29 – OpenSSL key permissions


    After creating the private key, we need to create the public key. This is the
    key you''ll be uploading to OCI VirtualBox and OCI can communicate with one another.
    We use the private key to create a public key so the two environments can communicate
    with another.


    ```

    $ api-key-public.pem writing RSA key $ openssl rsa -pubout -in oci-api-key.pem
    -out oci-key-public.pem $

    ```


    Figure 13.30 – Public key creation


    The next steps are to collect the data from your OCI account to enter the VirtualBox
    configuration. The information entered will help VirtualBox integrate, through
    the OCI API, the OCI tenancy and compartments through your VCN. Imagine this as
    building a highway between VirtualBox and OCI. The keys, both public and private,
    are the keys to the kingdom, allowing packets to traverse that highway.


    # How to do it...


    The following steps walk through uploading the public key and configuring VirtualBox
    to communicate with OCI:


    +   1. First, just as with any other CSP, we need to log in to our account.'
