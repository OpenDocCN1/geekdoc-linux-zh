    er error during the installation of the OS. In order to resolve this, I increased
    the memory to 2048. Also it has two CPUs just

    for measure.


    +   12. Finally, with the shutdown_command, we simply tell how to shut down the
    system gracefully once all provisioning

    is done. If this blank Packer will properly shut down the machine.


