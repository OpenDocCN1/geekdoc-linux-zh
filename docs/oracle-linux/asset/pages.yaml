    # NOTE


    There is easily another way to switch modules on the fly. If you set module_stream_switch
    to True in /etc/dnf/dnf.conf then you can install a different module using the
    switch-to syntax.


    Here is an example:


    ```

    echo "module_stream_switch=True" >> /etc/dnf/dnf.conf

    ```


