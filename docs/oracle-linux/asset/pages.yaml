    # It works...


    There is more you can do with Gluster. First, volumes have multiple options when
    you create them, each offering options for replication and distribution:


    +   * Distributed: When using distributed volumes, files are randomly distributed
    across the bricks in the volume. This type of volume is useful when the need is
    to scale storage, and redundancy is not necessary or is already provided by any
    hardware or software layers. However, it is important to note that disk or server
    failures can result in significant data loss, as the data is spread randomly across
    the bricks in the volume. An example command to build a distributed volume is
    the following:'
