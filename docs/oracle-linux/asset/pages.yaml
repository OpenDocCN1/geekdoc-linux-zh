    # Encrypting web traffic


    It''s important to encrypt the communication to and from your web servers. Even
    a simple blog or company with no login has several advantages of being encrypted:


    +   - Maintaining user trust: Encrypting your web with HTTPS helps establish trust
    between your website and your users.

    When a user sees the padlock icon in their browser indicating that the connection
    is secure, they can be more confident that their data is being transmitted securely.
    Browsers show sites that are not encrypted. Chrome and Edge browsers will show
    text as not next to the URL, or Mozilla''s red padlock.

    - SEO: Google states HTTPS is a ranking factor in their search algorithm. This
    means websites that use HTTPS may rank higher in search results than those that
    do not.

    - Browser warnings: Modern web browsers such as Chrome and Firefox now display
    warning messages when a user visits a non-HTTPS website that contains sensitive
    information. This can discourage users from using your website and negatively
    impact your business.


    # NOTE'
  merge: -1
  pgno: 306
- img_proc: true
  md: 'While SSL is a term that is commonly used, modern systems actually use Transport
    Layer Security (TLS) as the encryption technology. SSL, being an older technology,
    has some security flaws, which is why TLS was developed as an upgraded version
    of SSL. TLS addresses the existing vulnerabilities of SSL, making it a much safer
    option.


    Overall, encrypting web traffic with HTTPS is important for protecting sensitive
    data, maintaining user trust, and complying with regulations and standards. It
    is also becoming increasingly important for SEO and avoiding browser warnings
    that negatively impact your website''s reputation. It''s also easy to do and with
    free services such as Let''s Encrypt (https://letsencrypt.org/) and ZeroSSL (https://zerossl.com/).


    Let''s Encrypt and ZeroSSL provide free security certificates, including SSL/TLS
    certificates, that are used to encrypt web traffic, allowing for encrypted communication
    between web servers and web browsers. Let''s Encrypt was created to make it easier
    for website owners to obtain SSL/TLS certificates and enable HTTPS on their websites.
    Prior to Let''s Encrypt, obtaining SSL/TLS certificates was often a complicated
    and expensive process involving manual verification and payment to certificates
    for free. Let''s Encrypt streamlines this by automating the verification process
    and providing certificates for free.


    Let''s Encrypt certificates are trusted by all major browsers and operating systems.
    They are issued for a period of 90 days and can be renewed automatically using
    an automated client software. Let''s Encrypt also provides an Automated Certificate
    Management Environment (ACME) protocol that allows web servers to automate the
    process of obtaining, renewing, and revoking certificates.


    # Getting ready


    For this example, you will need a web server Oracle Linux. The server needs to
    be accessible over the internet so that the Let''s Encrypt system can verify the
    URL. In this example, I will be using a VM on Oracle Cloud, using their free tier
    of service. This is running on an Arm-based CPU with 2 cores and 12 GB RAM. Both
    ports 80 and 443 are opened up to this server. This process works the same regardless
    of processor type or cloud. The system is running Oracle Linux 8 with the latest
    patches.


    # How to do it...


    To do this, we need to do a few things:


    +   1. Install Apache with mod_ssl and all its requirements.

    2. Get acme.sh from Git.'
