  md: "For instance, logical volumes set up using LVM are mapped to device mapper\
    \ devices located in the /dev/mapper directory. Each logical volume has a corresponding\
    \ device mapper device entry that can be used to interact with the logical volume\
    \ as if it were a regular block device. The path for accessing it is /dev/mapper\
    \ followed by the VG-LV name. Thus, DATA-xfs1 is /dev/mapper/DATA-xfs1. You can\
    \ use the dmsetup ls to show all of the mapped:\n\n```\n[root@xfs #] dmsetup ls\n\
    DATA-xfs1 (252:5)\nhome (252:3)\nroot (252:0)\nswap (252:1)\nvar (252:2)\nvar_log\
    \ (252:4)\n[root@xfs #] \n```\n\nFigure 4.27 – dmsetup ls\n\n# XFS – creating,\
    \ modifying, and more\n\nXFS is a highly advanced and established filesystem that\
    \ boasts an array of benefits and features, making it an ideal option for a wide\
    \ range of use cases. XFS is designed to handle vast storage capacities, making\
    \ it suitable for environments with heavy data demands. It can support filesystems\
    \ and files up to 8 exabytes in size, allowing for the management of vast amounts\
    \ of data. This scalability makes XFS highly suitable for big data applications,\
    \ enterprise storage systems, and largescale storage deployments. XFS has exceptional\
    \ performance capabilities. It employs advanced techniques such as allocation-group-based\
    \ block mapping, delayed allocation, and asynchronous I/O, which optimize disk\
    \ I/O operations and overall throughput. XFS is particularly effective at handling\
    \ large files and tasks that require intensive read and write operations.\n\n\
    XFS incorporates data protection features to safeguard against corruption. It\
    \ employs checksumming for both metadata and data, allowing the filesystem to\
    \ detect and address data integrity issues. Additionally, XFS supports copy-on-write\
    \ (COW) snapshots, enabling point-in-time backups and data recovery operations.\
    \ XFS also uses a journaling mechanism that provides fast recovery in case of\
    \ system crashes or power failures. The journaling feature records modifications\
    \ to the filesystem metadata, ensuring the consistency and integrity of data.\
    \ This provides in faster boot times and improved reliability, as well as the\
    \ reduction of time required for filesystem checks during system startup.\n\n\
    # NOTE\n\nOracle actively contributes to many Linux technologies. The COW feature\
    \ was one example of an Oracle contribution to the community, keeping Linux free\
    \ and open source. For more info, refer to https://blogs.oracle.com/linux/post/xfs-data-"
