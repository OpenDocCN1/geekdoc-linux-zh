  md: '# Using AppStreams to install different versions of software


    Now, we''re going to expand on what we know about AppStreams, and instead of installing
    an application from the default module stream, we''re going to specify a different
    stream.


    # How to do it...


    There are multiple ways to do this: simply specifying the installation of a different
    stream will get the job done, or you can manually enable a different version.
    My preference is to specify the version as I install it because, in that case,
    the AppStream will automatically enable that version:


    ```

    # dnf module install nodejs:16

    ```


    NOTE


    If you already installed some version of an AppStream, it is best to remove the
    old one before resetting and installing a different version. This will be covered
    later.


