    # # How to do it...


    Before you start configuring Keepalived, you need to configure HAProxy on the
    second server. You can easily install HAProxy, open up the firewall ports, and
    copy the config file from the existing system.


    You can test this by simply pointing your browser to the second load balancer
    and seeing the app server.


    Next, we will start to configure Keepalived.


    For each load balancer, you will need to install Keepalived as the root user:


    ```

    dnf -y install keepalived

    ```


    Next, we will need to edit the Keepalived config file. This is found in `/etc/keepalived/keepalived.conf`.
    There are two major sections to edit, global_defs and vrpp_instance.


    global_defs is the global definition used by Keepalived. These settings are used
    by all vrrp_instance types configured in the system.


    There are several parameters that you will need to update:


    +   - notification_email: This is a list of email addresses that will be emailed
    when there is an event

    - notification_email_from_user: This is the sending email address

    - smtp_server: This is the SMTP relay server

    - router_id: This is a unique name for this Keepalived cluster


    For the sample, this section looks like the following:'
