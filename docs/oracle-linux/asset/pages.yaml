    # # Foreword


    This book is for systems administrators who are either interested in, looking
    to switch to, or have chosen Oracle Linux for their IT infrastructure. Welcome!


    Oracle Linux Cookbook brings together two great technologists (Erik Benner and
    Erik Thomsen) serving up a generous helping of Linux know-how that will have you
    hungry for more. The Eri share their combined knowledge and experience through
    easy-to-follow steps, troubleshooting tips, and tested best practices that can
    help you adopting and managing your Oracle Linux systems.


    I''ve had the pleasure of knowing Erik Benner for many years, as we''ve both worked
    with (in my case, at) Oracle since the mid-190s. Erik is well versed in core Oracle
    technologies, including Oracle Linux, Oracle Cloud, and Oracle Database. His experience
    in creating, delivering, and managing Oracle-based solutions spans government
    and commercial customers of all sizes, which means he''s deals with nearly everything
    imaginable when it comes to technology implementations—from those that deserved
    a Michelin star rating to those he''s to save from being undercooked catastrophes.


    A member of the Oracle Linux team, Erik B. Thomsen started his software career
    while active on duty in the US Air Force. There, he sought, out-of-the-box ways
    to solve problems, using database technology. He sharpened his skills at a global
    aerospace company where his passion for Linux and open source took him. He holds
    positions including a DBA, product manager, and DevOps engineer. Erik is passionate
    about delivering finely assembled technological solutions and writing through
    procedural documentation, akin to a masterful recipe. He has proved his mettle
    helping customers streamline processes and achieve outstanding results.


    Jonathan Spindel is a seasoned technologist and an Oracle subject matter expert,
    with more than 23 years of experience providing end-to-end management and delivering
    turnkey cloud solutions. This, coupled with his expertise in automation leads
    to high quality products and satisfied customers.


    Oracle Linux Cookbook covers a wide range of topics: from installation and upgrades
    to software management and storage to containers. Several Oracle Linux ingredients
    are detailed, such as the Unbreakable Enterprise Kernel, Red Hat Compatible Kernel,
    Btrfs, Leapp, and Podman. A chapter is dedicated to the use of Oracle Ksplice
    to help improve system security. Guides to building an Oracle Preboot Execution
    Environment (PXE) are provided and Application'
