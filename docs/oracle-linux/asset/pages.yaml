    # Port protection and restricting network access


    Oracle Linux has a firewall built into the distribution. This firewall is called
    firewalld, short for firewall daemon. firewalld is a dynamic firewall management
    tool used on Linux systems that provides a simple and consistent way to manage
    firewall rules across different distributions. It is designed to allow administrators
    to manage firewall rules in a flexible and efficient way.


    # Getting ready


    With the other test, we will need an Oracle Linux system to play with. Nothing
    else is required. The system is enabled by default on most installations. To check
    the status of the daemon, you can use systemctl command as follows:


    ```

