    # Playing with UEFI


    One way hackers can compromise systems is by attacking the security system before
    it boots. In order to prevent this, we must ensure the operating system boots
    only signed secure software in UEFI. With your bootloader or grub, we enforce
    your firmware. To solve this, a new method is required to boot systems, UEFI is
    implemented in the firmware and has'
