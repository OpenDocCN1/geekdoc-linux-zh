    \ and we will name the variable that identifies this password as admin_password.\n\
    \n```\n$ ansible-vault encrypt_string --password-file vault_password 'B@by-Y0dA'\
    \ --nname 'admin_password'\n```\n\nIn the terminal, you will enter your password\
    \ which is 'B@by-Y0dA' looks like:\n\n```\n$ ansible-vault encrypt_string --password-file\
    \ vault_password 'B@by-Y0dA' --name 'admin_password'\n$ ANSIBLE_VAULT;1:AES256\n\
    37352630616352663736273638232530362634362327302634304236326536323830306430\n61323838303936353133343533282836333333363624333434343632353536323236361136\n\
    31363837323136353236383336363833373835333732313632343639363948353646013036\n343333373232363035383436333136363337313633333939393933363636333333333039336463\n\
    3332\n```\n\nFigure 8-3. Encrypting secrets\n\n2. Next, we need to copy the output\
    \ of that into secrets.yml file (you could just append >> secrets.yml to the command\n\
    previously to copy the output to the file). Here's an example:\n\n```\n$ ansible-vault\
    \ encrypt_string --password-file vault_password 'B@by-Y0dA' --name 'admin_password'\
    \ >> secrets.yml\n```\n\nYour secrets.yml file should look like this:\n\n```\n\
    --- secrets.yml\nansible_password: |\n  $ANSIBLE_VAULT;1:AES256\n  66303623353036263337363834363336303436373830353135363435323316253030\n\
    \  3531383839393936333731313131313535353937373639393136383834323134303034323035\n\
