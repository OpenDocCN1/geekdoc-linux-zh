    In this example the output is informational, with no errors. This is uncommon.


    You can also use dnf history to uninstall a package. There are two ways to do
    this: rollback or undo.

    A rollback command will reverse all of the DNF transactions from the current point
    to the transaction ID specified. An undo command undoes changes in the ID identified.


    On the test system, you''ll see the installation of Nmap from 4/17/2022, which
    was done using the dnf history command 34:


