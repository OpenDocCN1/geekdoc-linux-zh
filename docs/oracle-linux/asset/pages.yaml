  md: '# Preface


    Enterprise Linux stands out as the premier choice for organizations seeking a
    robust, secure, and reliable operating system. In the realm of Linux distributions,
    Enterprise Linux, exemplified by distributions such as Oracle Linux and Rocky
    Linux, has earned its reputation as the go-to solution for businesses worldwide.
    This book explores the key reasons why Oracle Linux is considered the best distribution
    for enterprise environments and explores several technologies, including Oracle’s
    distribution, through a series of easy-to-follow, step-by-step examples called
    recipes. These recipes will teach you how to use technologies in key areas.


    Security is paramount in enterprise environments, and Oracle Linux has set the
    standard for robust security features. Features as Security-Enhanced Linux (SELinux),
    mandatory access control, and a proactive security patching system for no-downtime
    patching contribute to creating a secure environment. Regular security audits
    and prompt-downtime patching help mitigate vulnerabilities, making Oracle Linux
    a trusted choice for handling sensitive and mission-critical data.


    Enterprise Linux distributions are designed to scale seamlessly, whether on a
    single server or in a large-scale, clustered environment. Performance optimizations
    integrated into these distributions ensure that they can handle the demands of
    modern enterprise applications. Oracle Linux is the leader in performance, with
    the option to use Unbreakable Enterprise Kernel (UEK). This book covers how to
    install this option and shows several of the key features it brings to the table,
    such as the Btrfs filesystem. We also cover availability, with more easy-to-follow
    recipes that cover highly available storage and application clustering.


    Oracle Linux benefits from a vast ecosystem of software and applications that
    are certified and optimized for compatibility. This ecosystem includes database
    management systems, development tools, middleware, and enterprise applications,
    making it easier for organizations to build, deploy, and manage their software
    stacks. This book highlights some of these technologies that support DevOps and
    DevSec teams, such as Ansible and Podman.


    Oracle Linux stands as the best distribution for enterprise environments due to
    its rock-solid stability, robust security features, scalability, comprehensive
    support, compliance with industry standards, and a rich ecosystem. Whether managing
    critical workloads, securing sensitive data, or ensuring high-performance computing,
    Enterprise Linux continues to be the top choice for organizations aiming for a
    reliable and secure operating system.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Who this book is for


    This book is for Enterprise Linux admins, specifically admins that manage Oracle
    Enterprise Linux.

    Whether you are migrating from CentOS or building a new system, this book is full
    of useful tricks and tips. The author''s goal is to help you be a more productive
    admin, adding new technologies to your bag of tricks to make you stand out from
    the rest.


    This book is for Linux system administrators and developers of applications that
    run on Oracle Linux 8, so you should have a basic understanding of Linux administration
    and be comfortable with editing configuration files.'
