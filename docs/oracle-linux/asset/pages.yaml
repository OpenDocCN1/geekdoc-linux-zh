  md: '# How to do...


    1. Remove Docker by running the following command:


    ```

    $ sudo dnf remove -y docker-ce docker-cli-cli containerd.io docker-compose-plugin

    ```


    2. After this, you will be able to install Podman with the following:


    ```

    $ sudo dnf module install container-tools

    ```


    3. If you previously added your user to the docker group, you may go ahead and
    delete that group because it is no longer needed:


    ```

    $ sudo groupdel docker

    ```


    Now you''re running containers without the Docker daemon, and by default with
    Podman, you''re rootless.


    # Giving your containers a root canal


    Straight from the Docker documentation, you will find that “The Docker daemon
    binds to a Unix socket instead of a TCP port. By default this Unix socket is owned
    by the root user and other users can only access it using sudo. The Docker daemon
    always runs as the root user.”


    The documentation proceeds to instruct you how to add your user to the docker
    group in order to use Docker without using sudo. That sounds great, right? Well,
    the thing is, the docker group grants privileges equivalent to the root user.
    This can have dire consequences. For instance, any location on your host filesystem
    can be mounted into the container – and I do mean any! This includes the / (root)
    directory and the container can then alter your host filesystem without restrictions.
    But you get several other security vulnerabilities that are a direct result of
    this architecture, but you get the picture.


    What''s different about Podman is that by default, it runs rootless; in other
    words, you can run containers using Podman without root privileges. When I first
    heard this, I thought it meant the user in the container was not root, but that''s
    not really the case. Rootless containers simply mean that the user installing
    containers does not have root privileges. There are a few things to know about
    running a container without root privileges, and this recipe aims to instruct
    you how to run rootless containers, while at the same time explaining the differences
    between rootless and root.


    # Getting ready


    +   - Oracle Linux

    - Podman'
