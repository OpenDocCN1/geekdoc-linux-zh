    ```

    [Timer]

    Calendar=*-.* 6:00

    RandomizedDelaySec=60m

    Persistent=true

    ```


    ```

    [Install]

    WantedBy=timers.target

    [root]@08slice2 ~# #

    ```


    ![](img/110fa0d6324f0893fff03cee6394144d_162_0.png)


    In this file, the [Timer] stanza controls the time, as well as a randomized delay.
    To change when this runs, replace 6:00 with whatever time you want, in a 24-hour
    format. For example, if you want the check to run at 10 P.M., the time should
    be 22:00.


    Since this uses the standard OnCalendar function, you have other options. OnCalendar
    is a very flexible method; the following are some of the most commonly used examples:


    | OnCalendar | Description |

    |---|---|

    | DOW YYYY-MM-DD HH:MM:SS | Generic time formatting methods. |

    | *-.* 2:00 | Runs every day at 2:00 A.M. |

    | Weekly | Every Monday at midnight. |

    | Sat *-.* 2:00 | Every Saturday at 2:00 A.M. |

    | Sat | Every Saturday at midnight. |

    | Sun 2022-*-* | Every Sunday in 2022 at midnight. |

    | *-*-1,15 22:15 | The 1st and 15th of every month at 10:15 P.M. |'
