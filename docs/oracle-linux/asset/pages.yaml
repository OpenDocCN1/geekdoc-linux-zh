    After installation and the firewall has opened, we need to prepare the system
    by installing the bootloaders, preparing an Oracle Linux 8 TFTP location, and
    creating a boot menu.


    # NOTE


    This example is using a BIOS-based host. If you want to use a UEFI host, you will
    need to install grub2-efi and configure UEFI-specific parameters. The Oracle docs
    for this can be found at https://docs.oracle.com/en/operating-systems/oracle-linux/8/install/Creating-Network-InstallationSetup.html#uefi-clients.


    To install the bootloaders for BIOS-based installs, we will install the syslinux
    package. The syslinux package includes bootloaders for network booting (PXELINUX),
    Linux (ext2/ext3/ext4) or btrfs filesystems (EXTLINUX), MS-DOS filesystems (SYSLINUX),
    and bootable El Toro CD-ROMs (ISOLINUX). For network booting, we will be using
    PXELINUX.'
