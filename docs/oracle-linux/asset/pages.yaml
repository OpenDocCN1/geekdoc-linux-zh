    the information.


    +   - NIST-800 refers to a series of guidelines and standards for information
    security developed by the National Institute of Standards and Technology (NIST)
    in the United States. The NIST-800 series includes a set of publications that
    provide guidance on various aspects of information security, such as risk management,
    security controls, and incident response. The NIST-800 series is widely used by
    government agencies, private sector organizations, and others to improve the security
    of their information systems. The publications in the series are regularly updated
    to reflect changes in the threat landscape and advancements in security technology.


    +   - ACSC: The Australian Cyber Security Centre (ACSC) is a government agency
