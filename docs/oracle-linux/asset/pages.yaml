  md: '+   * [actions]: You can specifically disable notifications for a specific
    CVE. This is helpful if you have an accidental false positive on a system. To
    disable a CVE, add a line with the CVE and **ignore**. The default: parameter
    sets the default behavior for all CVE.


    # NOTE


    If you enable email notification, make sure your email subsystem is configured
    before enabling emails from KED.


    You can also test the system with the **log-known-exploit** command. This will
    log a test message in the kernel:


    ```

    /usr/sbin/log-known-exploit -f -d ; tail /var/log/messages

    ```


    The test event will look like the following in /var/log/messages:


    ```

    Apr 22 23:01:02 ol8splice2 /log-known-exploit[4192]: exploit attempt detected;
    id=CVE-2012-1234 pid=1337 uid=1000 comm=./dummy-exploit lost=0

    ```


    In the log, you will see the time, the CVE that was triggered, and also the **Process
    ID (PID)** and **User ID (UID)** of the process and user that triggered the event.


    # How it works...


    Ksplice installs a piece of tripwire code in the kernel for specific exploits,
    detecting when something tries to exploit the exploit. These triggers then kick
    off the notification subsystem, letting you know when an attack happens.'
