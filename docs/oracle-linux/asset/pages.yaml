    Figure 6.33 – Test with two different clients


    Here, we can see that both interfaces are being used for heavy network loads.
    This is happening because each client is using a different MAC address. If a third
    client were used, we would see it competing for traffic for one of the interfaces,
    potentially causing issues.


    This is an important factor to consider when bonding in environments where heavy
    network performance is required from multiple clients. When bonding, and you have
    random performance latency issues, monitor the ports. You might see some contention.
    One to address this is to add additional ports to the bond. You can upgrade the
    interfaces to units that can support more bandwidth.'
