  md: '# Installing with and without Automation Magic


    While you manually install Oracle Linux from a USB or an ISO image, at an enterprise
    level, it is more common to automate the installation. The Appendix – kickstart
    options at the end of this chapter covers the manual installation, which is easier
    to do when you have occasional installs.


    Most data center installs use an automated method, as this allows you to scale
    quickly.


    This chapter provides different recipes to build an operational Preboot Execution
    (PXE) pronounced pixie


    PXE booting is a technology developed by Intel. It allows systems with the appropriate
    ISO (or OS RPMs) to boot from the network, downloading all the required files
    from a server. While there are older methods, such as the bootstrap protocol (BOOTP),
    the industry has rapidly adopted PXE boot as the most common standard. While PXE
    booting started with Intel systems, ARM systems can also boot using TFTP. For
    the PXE boot process to work, you would normally have a DHCP server and a PXE
    server on the network. A high-level summary of the process can be seen in the
    following diagram:


    ![](img/110fa0d6324f0893fff03cee6394144d_56_0.png)


    Figure 2.1 – PXE boot process


    The following are each of the steps described at a high level:


    +   1. The PXE client will request an IP address from an available DHCP server.'
  merge: -1
  pgno: 56
- img_proc: true
  md: '2. The first DHCP server on the network to respond to the client will provide
    it with an IP address, network mask, DNS information, default route, and other
    required boot parameters.


    3. The PXE client will do boot discovery, looking for a PXE server. Optionally,
    the DHCP server can be configured to point to the PXE server to boot.


    4. The PXE server sends the network bootstrap program and IP on where to download
    the files. This enables the client to boot from the network to install OS.


    5. The PXE client requests media (RPMs and control files) as needed from an HTTPS
    server. HTTPS is not the only protocol required. NFS and FTP can also be used,
    although HTTPS is the most common method. The PXE system also sends the kickstart
    parameters to the client via the kickstart file. These parameters contain specifics
    to configure the system''s storage, network, and packages to be installed.


    6. The media server sends the installation to the PXE client, allowing an OS to
    be installed.


    # When configuring the PXE server in this case, there are three components:


    +   - DHCP server: assigns not IP addresses to servers as they boot but also important
    parameters that enable PXE boot.


    +   - Trivial File Transfer Protocol Daemon (TFTP): This 역시 as a TFTP server,
    allowing the bootloader to run on the client, starting the OS installation.


    +   - HyperText Transfer Protocol Daemon (HTTP): This is a web server and is used
    to host config files and RPMs used for the installation.


    # NOTE


    There are other options, such as using dnsmasq as a combined server that works
    as a DHCP server, a TFTP server (most commonly TFTPD), and a DNS forwarder. However,
    in many enterprise environments, separate systems are needed. As an example, a
    Microsoft DHCP server may already be used on the network.


    In this example, there are two logical servers running three different services,
    a DHCP server, a TFTP server on the first system. The second system is the PXE
    server and will also be the HTTP server used to serve the Red Hat Package Manager
    (RPM) files and control files required for the installation. Both systems are
    multihomed and will be running DHCP and PXE on their secondary interface. The
    systems also have static IP addresses on the secondary interfaces.


    We will cover the main recipes, which make up the PXE feast, in this chapter:


    +   - Automating the OS install with kickstart


    +   - DHCP server – more than just Ips


    +   - Setting up a web server – HTTPD


    +   - Serving the boot – TFTPD


    +   - Back in the day – a manual installation


    # NOTE


    A multihomed server is a system that is connected to multiple networks at the
    same time. This is often done in enterprise data centers to isolate systems, while
    at the same time allowing a controlled system allows some data to pass. It is
    possible to set up a PXE server on a single network.'
  merge: -1
  pgno: 57
- img_proc: true
  md: '# Technical requirements


    The easy way to create a new kickstart file requires building a new OS, as this
    process will automatically create the file, which can later be modified as needed.
    PXE environment also requires additional systems or VMs for DHCP and HTTPS server.
    Before you start, you will first need to download an ISO image. Using a desktop
    virtualization product as Oracle VM VirtualBox is recommended.


    The related configuration files for many of the recipes in this book are available
    on GitHub, https://github.com/PacktPublishing/Oracle-Linux-Cookbook.


    # Automating the OS install options with kickstart


    The kickstart file is one of the most important parts of automated install process.
    This file contains all the information required to automatically install and configure
    the OS. The kickstart file is a simple text file that contains the directions
    to allow an unattended installation.


    # Getting ready


    In order to work with kickstart files, you will need somewhere to build the system,
    such as Oracle VM VirtualBox. This system can be used to create your first kickstart
    file, as well as testing new kickstart files before moving them into the PXE environment.


    > NOTE


    Anaconda is the Oracle Linux installer. It can operate via an automated install
    using a kickstart file, or interactively via a graphical or text interface.


    # How to do it?


    While you can manually create a file from scratch, it is much easier to start
    with the file that Anaconda creates on installation. This kickstart file is created
    automatically when a manual is installed and saved on the new system in /root/anaconda-ks.cfg.
    This file can be easily edited and reused for future builds. Let''s look at the
    file by breaking it down into smaller sections. This system is a graphical installation.
    Other options are text or cmdline:


    > NOTE


    There are many options for kickstart, and they are listed in Appendix - kickstart
    options.


    ```

    #version=OL8

    ```'
