    # Creating portable roles for Ansible


    Before attempting to follow this recipe, I recommend having some basic knowledge
    of Ansible and how to write an Ansible playbook. If you''ve never written an Ansible
    playbook, I recommend following the Creating playbook guide from the official
    Ansible documentation. That can be found here: https://docs.ansible.com/ansible/latest/getting_started/get_started_playbook.html.


    In this recipe, you will learn how easy it is to move things around when using
    Ansible roles. When I first started using Ansible, I wrote my playbooks using
    tasks. This to me seemed like a logical approach at the time and was more akin
    to traditional scripting since everything happened in chronological order.


    The problem with writing playbooks in this way is that there are no clear dependencies,
    and the tasks are defined along with the hosts, all in the same file. If you wanted
    to move things to another playbook, you''d have to be careful to grab the dependencies
    with each task, and you might be repeating yourself unnecessarily tasks on their
    own are not reusable. As your playbooks become more complex or increase in size,
    you''ll eventually want something more portable for the sake of manageability.


    According to Red Hat, roles are designed to be self-contained portable units of
    automation.


    Organizing your tasks into roles will allow you to easily reuse them and share
    them with others. In fact, if you use Ansible Galaxy (https://galaxy.ansible.com/)
    you will find plenty of content in the form of pre-packaged units of work referred
    to in Ansible as roles and collections. It''s much easier to reuse and share Ansible
    roles as organized units of automation because they are decoupled from the rest
    of the Ansible playbook framework.


    If you''re a programmer, you can think of roles as functions or methods. Easy
    enough? Let''s get cooking!


    # Getting started


    For this recipe, you will need the following:


    +   - Oracle Linux

    - Ansible'
  merge: -1
  pgno: 272
- img_proc: true
  md: 'Refer to the Technical requirements section at the beginning of this chapter
    if you need installing Ansible.


    # How to do it...


    It''s not difficult to convert a series of tasks into roles. It''s really just
    a matter of stripping out the tasks and organizing them into categories that represent
    a role. This recipe aims to describe that process, and hopefully by the end, you
    will have a good understanding of how to do the same with your playbooks.


    # Original playbook


    To kick things off, let''s first take a look at a playbook that doesn''t leverage
    roles so we can dive into what needs to be done.


    A typical playbook that does not leverage roles something like this:'
