  md: 'Figure 10.15 – Output of dnf module list python*


    This seems weird at first, consider that Python is an integral part of the Oracle
    Linux operating system and each Oracle Linux release comes with a platform Python
    version. The specific platform Python version may differ for each Oracle Linux
    release, and the respective platform Python will be supported for the full lifespan
    of that version of Oracle Linux. For Oracle Linux 7, the platform Python version
    is 2.7 and is always installed, for Oracle Linux 8, the platform Python version
    is 3.6. In other words, Python 2.7 is supported for the full lifespan of Oracle
    Linux 7, and Python 3.6 is supported for the full lifespan of Oracle Linux 8.
    On Oracle Linux 8, the platform Python is exclusively intended for use by system
    utilities like Yum and DNF. For general purpose is not installed by default on
    Oracle Linux 8, and so is where AppStream modules come into play.


    You can install multiple versions of Python on Oracle Linux 8 by specifying the
    module correlating the desired version of Python. All of the Python modules can
    be installed and used simultaneously on the same machine, and you can specify
    which one you wish to use by typing out the version – for example, `python3.6
    --version`, `python3.8 --version`, and so on.


    By default, the `python3` command is always aliased to Python 3.6 if it is installed
    on the system, and that is because Python 3.6 is the platform Python version on
    Oracle Linux 8.


    # Removing packages via AppStream


    Removing packages via AppStream is straightforward. In general, all you need to
    do is instruct the package manager to remove instead of install. If the package
    manager finds a module that matches, it will proceed to remove the related packages.


    # How to do it...


