    # How it works...


    firewall is based on the netfilter framework, which is a set of hooks that allows
    network packets to be filtered by the kernel. This framework is used to implement
    the iptables firewall on many Linux systems. firewall provides a higher-level
    abstraction of the netfilter framework, allowing administrators to define rules
    in terms of services, ports, and protocols rather than directly manipulating iptables
    rules. One of the key advantages of firewall is its ability to define rules that
    match on both the source and destination IP address, as well as the protocol and
    port number. This allows more granular control over network traffic and makes
    it easier to define complex firewall policies.


    firewall also allows administrators to define firewall rules in terms of network
    zones. A zone is a set of network interfaces that are assigned a specific level
    of trust. For example, an administrator might define a public zone for network
    interfaces that are exposed to the internet and a trusted zone for network interfaces
    that are only accessible from trusted internal networks. Each zone can have its
    own set of firewall rules, allowing administrators to apply different policies
    to different network interfaces.


    # Keeping SELinux active


    SELinux, or Security-Enhanced Linux, is a security module that provides mandatory
    access control (MAC) policies in the Linux kernel. It is needed because it offers
    a higher level of security for Linux systems by enforcing strict rules on what
    processes and users can do on the system. By default, Linux uses discretionary
    access control (DAC), which means that any user or process can access any file
    or resource as long as they have the appropriate permissions. This can lead to
    security vulnerabilities, as any compromised process or user can potentially access
    and modify sensitive data or system files.


    SELinux adds an extra layer of security by enforcing mandatory access control
    policies that restrict access to files and resources based on the context of the
    process or user. This means that even if a process or user has the appropriate
    permissions, they will only be able to access resources that are explicitly allowed
    by the SELinux policy.'
  merge: -1
  pgno: 328
- img_proc: true
  md: 'This recipe will cover how to create a custom SELinux policy instead of disabling
    it and how to allow services to do things such as bind to low ports (<1024).


    # Getting ready


    As with the other test, we will need an Oracle Linux system to play with. Nothing
    else is required. The system is enabled by default on most installations. To see
    the status of SELinux, you can use the command getenforce. The command will return
    the current active state. There are three states:


    +   * enforcing SELinux is active and blocking activity that is not allowed

    * permissive - SELinux is enabled, but will not block any activity

    * disabled - SELinux is disabled


    Addition commands are available if you install the setools with dnf:


    ```

    dnf install -y setools-console

    ```


    You can also use the command sestatus to get more information about SELinux:


    ```

    [root@localhost8 ~]# sestatus

    SELinux status: enabled

    SELinux mount: /sys/fs/selinux

    SELinux root directory: /etc/selinux

    Loaded policy name: targeted

    CurrentByte mode: enforcing

    Mode from config file: enforcing

    Policy MLS unknown status: allowed

    Memory protection checking: actual (secure)

    Max kernel policy version: 31

    ```


    You can use the SELinux type to manage resources. SELinux types are labels to
    classify various resources in a system, such as processes, files, directories,
    and network ports. SELinux types are an important part of SELinux security policies,
    as they determine which processes and users can access specific resources on the
    system.


    There are several types of SELinux types, including the following:


    +   * User types: User types are used to define the security context of a user.
    They are also used to confine the actions of a user to a specific set of resources
    on the system.

    * Role types: Role types are used to define the security context of a role. They
    are also used to confine the actions of a user to a specific set of resources
    on the system.

    * Domain types: Domain types are used to define the security context of a process.
    Each process on the system is assigned a unique domain type, which determines
    which resources the process can access.

    * Type enforcement types: Type enforcement types are used to define the security
    context of a file or directory and confines the actions of a process to a specific
    set of resources on the system.'
  merge: -1
  pgno: 329
- img_proc: true
  md: 'Network port types: Network port types are used to define the security context
    of a network port. Network port types are used to restrict network access to specific
    ports or services on the system.


    In addition to these types, there are also several special types used by SELinux,
    such as the unconfined_t type, which is used for processes that are not confined
    by SELinux, and the system_u and root_t types, which are used for system resources
    and processes.


    # How to do it...


    The state of SELinux can be changed on the fly using the command setenforce with
    the parameters 1 or 0. Using it puts SELinux in enforcing mode, while 0 puts it
    into permissive mode.


    Additionally, you can edit the configuration file, /etc/selinux/config, and set
    the field SELinux by any one of the three states. This is the only way to disable
    SELinux.


    While disabling SELinux is tempting for many admins, it can be easily updated
    to allow the required behavior.


    SELinux also logs to the /var/log/audit/audit.log file by default.


    # How it works...


    SELinux has several layers of security managing files, ports, and kernel modules.
    They are all managed by the semanage command.


    # semanage


    semanage is a command-line tool used''s to manage SELinux policies in Linux systems.
    It is used to create, modify, or delete SELinux policies, as well as manage file
    contexts and network ports. Here are some common uses of the semanage command:


    +   - semanage can be used to manage file contexts, including adding or modifying
    contexts for specific files or directories. For example, you can add a new policy
    module with the following:


    ```

    semanage module -a kernelmodule.pp

    ```


    This will add the policy module kernelmodule.pp to the SELinux policy.


    +   - semanage fcontext -a -t httpd_sys_content_t ''/var/www/html/(.*)''

    This will add a new file context that allows the HTTPD process to access files
    and directories under /var/www/html.


