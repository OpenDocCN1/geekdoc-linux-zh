- img_proc: true
  md: '```

    #!/bin/bash


    # Prepare vagrant

    useradd -m vagrant

    usermod -aG sudo vagrant

    echo "vagrant:vagrant" | chpasswd

    echo "vagrant ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers.d/vagrant

    mkdir -p /home/vagrant/.ssh

    curl https://raw.githubusercontent.com/hashicorp/vagrant/main/keys/vagrant.pub
    >> /home/vagrant/.ssh/authorized_keys

    chmod 600 /home/vagrant/.ssh/authorized_keys

    chown vagrant:vagrant /home/vagrant/.ssh


    # Setup proxy access to the internet

    echo "UseDNS no" >> /etc/ssh/sshd_config


    # Install packages for VirtualBox Guest Additions

    df install -y kernel-devel kernel-headers gcc make perl


    # Install VirtualBox Guest Additions

    mkdir -p /mnt/iso

    mount -o loop /root/VBoxAdditions.iso /mnt/iso

    sh /mnt/iso/VBoxAdditions.run

    umount /mnt/iso

    rm -rf /root/VBoxAdditions


    # Clean up to reduce size of Vagrant box

    df remove -y kernel-devel-headers

    df clean all

    cat /dev/zero &/dev/null > /tmp/zero.fill

    rm -f /tmp/zero.fill

    ```


    Figure 8.9 - Contents of the vagrant-base.sh script


