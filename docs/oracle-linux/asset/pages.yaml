    +   7. We''ll set headless to "true" in order to prevent the virtual machine from
    starting the VirtualBox GUI. We increase the time

    sh_wait_timeout to ensure the operating system finish install and to get up and
    running. All of this is self-

    explaining; that is, unless we use http_directory.


    +   8. All you need to know is that we''ll leverage the http_directory as a convenient
    way to serve a directory using

    an HTTP server. It does so that the boot command can point to a kickstart file
    - which we''ve placed in the http_directory.

    http://{{ HTTP }}:{{ PORT }}/ol-8.cfg fetching the operating system exactly what
    it needs to reach the

    kickstart file. We don''t need to worry about the syntax of ({{ HTTP }}) and ({{
    PORT }}); these are just

    template variables that are provided by the Packer templating engine.


    +   9. For nic_type, the default is 8254EM, which equates to Intel PRO/100 MT
    Desktop. That''s a safe choice and is great

    when running operating systems, but Oracle Linux 8 is a modern operating system
    so we''re setting this to virtio. VirtIO is

    a-virtualized driver and will give us better networking in the VM.


    +   10. Now, on to boot_command, basically we need figure out what sequence of
    keys are required in order to send a

    boot command to the operating system at boot. In the case of Oracle Linux 8, we
    send keys of up and Tab, and then

    we instructions on where to find the kickstart file, and finally tell it to press
    Enter before installing the OS.


    +   11. For vboxname, I found that, by default, Packer tried to launch my VM with
