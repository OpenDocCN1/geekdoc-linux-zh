- img_proc: true
  md: '# What this book covers


    +   Chapter 1, Oracle Linux 8 – Get It Go? Good!, covers how you can get Oracle
    Linux, upgrade Oracle Linux versions, and run them on ARM systems and the cloud!


    +   Chapter 2, Installing with and without Automation Magic, is where we automate
    the installation of Oracle Linux with PXE and kickstart the process.


    +   Chapter 3, Exploring the Various Boot Options and Kernels in Oracle Linux,
    explores what a kernel is and how UEK is different.


    +   Chapter 4, Creating and Managing Single-Instance Filesystems, provides tricks
    and tips to manage Btrfs, xfs, and RAID.


    +   Chapter 5, Software Management with DNF, we will look at how to build local
    reaps, make custom RPMs, and better leverage DNF.


    +   Chapter 6, Eliminate All SPOFs! An Exercise in Redundancy, covers eliminating
    single points of failure through load balancing, proxies, clusters, and network
    redundancy


    +   Chapter 7, Oracle Linux 8 – Patching Doesn’t Have to Mean Rebooting, covers
    how to patch rebooting. we will also look at what Splice is and why you should
    be using it.


    +   Chapter 8, DevOps Automation Tools – Terraform, Ansible, Packer, and More,
    looks at automating the management with Terraform, Vagrant, and Packer.


    +   Chapter 9, Keeping the Data Safe – Securing a System, looks at how to keep
    out of the news by securing your systems. We will cover encrypting your data,
    using SELinux, scanning for vulnerabilities, and managing GPG keys for things.


    +   Chapter 10, Revisiting Modules and AppStreams, looks at how AppStreams has
    changed software deployment and modernizing application deployments.


    +   Chapter 11, Lions, Tigers, and Containers – Oh My! Podman and Friends, looks
    at what Podman is, how to use it as a Docker replacement, and how to use Podman,
    Buildah, and Skopeo to facilitate your containerized needs.


    +   Chapter 12, Navigating Ansible Waters, covers everything Ansible, from deploying
    Ansible at the enterprise level with Oracle Linux Automation Manager (OLAM) to
    writing playbooks.


    +   Chapter 13, Let’s All Go to the Cloud, moves us to the cloud, where we will
    look at building custom images for AWS and OCI, as well as how to build VMs in
    the cloud.'
  merge: -1
