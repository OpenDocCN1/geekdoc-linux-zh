  md: 'dnf install -y git git-lfs make gcc python3-service-identity


    # How to do it...


    Now that we have all the tools installed, we will switch to your non-root user:


    +   1. Make a directory for the RPM. Here, we will have a source file for the
    software, plus all of the files and directories required to make an RPM. In my
    case, I am putting everything in /home/erik/.

    2. Next, we need to make the RPM directory tree. This is done by running the rpmdev-settree
    command. Once you run the command, the tree is created in $HOME under rpmbuild


    ```

    [erik@ol8 rpmmubuild]$ pwd

    /home/erik/rpmbuild

    [erik@ol8 rpmmubuild]$ ls

    BUILD RPMS SOURCES SPECS SRPMS

    [erik@ol8 rpmmubuild]$ $

    ```


    > Figure 5.26 - The rpmbuild directories


    Five directories are also built, each with a specific purpose:


    +   - BUILD: This is where binaries are saved after being compiled.

    - RPMS: RPMs are created here, with rpm files ready for use. There will be subdirectories
    for different CPU architectures.

    - SOURCES: This is where the source code is put, usually a tar file.

    - SPECS: This is where the .spec file lives.

    - SRPMS: Source RPMs are built here — usually packages containing the source code
    for the software.


    3. Create a simple Bash shell script to distribute as an RPM. This will live in
    the xzyzy directory in the rpmbuild directory. A simple Bash script is also created:


    ```

    [erik@ol8 xzyzy]$ pwd

    /home/erik/rpmbuild/xzyzy

    [erik@ol8 xzyzy]$ more xzyzy.sh

    #!/bin/bash

    echo "Nothing Happens"

    [erik@ol8 xzyzy]$ $

    ```'
