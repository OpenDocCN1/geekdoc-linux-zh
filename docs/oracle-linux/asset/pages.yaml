    # Converting a Markdown file to docx using pandoc


    In this example, let''s imagine we have a document that we to convert to another
    type. There are many tools we can leverage to do this, but one such tool comes
    to mind pandoc. Rather than installing pandoc on my local machine, I''ll simply
    run the pandoc/core container, which has pandoc preinstalled. The entrypoint in
    the pandoc container is /bash/pandoc. This means that anything after the specification
    of the container image will automatically append the pandoc command inside the
    container.


    We can run --help the pandoc/core command to learn how to use the utility, for
    example:


    ```

    $ podman run --rm pandoc/core --help

    ```


    From that (you can also view the man page maintained here: https://linux.die.net/man/1/pandoc),
    I now have some insight into how to use pandoc. In this case, I can use the pandoc
    command within the container by mounting my working directory into the container
    and specifying my source document and what I want to output, for example:


    ```

    $ podman run --rm -v $(pwd)/:data pandoc/core -s input.md -o output.docx

    ```


    Since the working directory inside the container is /data, and since I have that
    mounted to my host system, if the container creates a new file inside that directory,
    I will be able to find the output on my host system. Cool!


