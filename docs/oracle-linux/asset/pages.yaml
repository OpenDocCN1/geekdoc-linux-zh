    # How to do it...


    Create a configuration file that OpenSSL can use to obtain default values when
    generating your certificates. You can create this file at any location, but it
    is useful to keep it with the rest of your OpenSSL configuration in /etc/ssl/x509.conf.
    The file should look similar to the following:


    ```

    [ req ]ndefault_bits = 4096

    distinguished_name = req_distinguished_name

    prompt = no

    stringMask = utf8

    x509 extensions = extensions

    [ req_distinguished_name ]

    O = Module Signing Example

    CN = Module Signing Example Key

    mailAddress = first.last@example.com

    [ extensions ]

    basicConstraints=critical,CA=FALSE

    keyUsage=codeSigning

    extendedKeyUsage =hash

    subjectKeyIdentifier=keyid

    ```


    You should edit the o, CN, and emailAddress field to be more appropriate. Note
    that in the extensions section of the configuration, the keyUsage field is set
    as digitalSignature.


    Additionally, the extendedKeyUsage option is set to codeSigning for compatibility
    with key verification tools.


    2. Generate a new key pair using this configuration:


    ```

    [root@demo2 ~]# openssl req -x509 -new -nodes -utf8 -sha512 -days 3650 -batch

    config /etc/ssl/x509.conf -outform DER -out /etc/ssl/certs/pubkey.der -keyout

    /etc/ssl/certs/priv.key

    Generating a RSA private key

    ****

    ****

    writing new private key to ''/etc/ssl/certs/priv.key''

    [root@demo2 ~]#

    ```


    This signing certificate is valid for 10 years (3,650 days). Ensure that the keys
    are adequately protected. This can be done by copying the keys off the server
    and storing them in a secure location. Placing the keys on a USB stick and putting
    that in a desk drawer is not a secure location. A locked location, such as a safe.'
