    # NOTE


    *prelink* is installed, revert the pre-linked binaries to their original state
    (**prelink -au**) and then uninstall *prelink* (**dnf remove prelink -y**). While
    not used, *prelink* is not compatible with Ksplice.


    Now that you have an understanding of why you need to use Ksplice and the basics
    of how it works, let''s get to the recipe.


    The easiest way to use Ksplice is to allow each system to access the Oracle Ksplice
    service directly. This is called online mode. This can be done via an internet
    proxy, direct access, or by running the systems in OCI.


    # Getting ready'
  merge: -1
