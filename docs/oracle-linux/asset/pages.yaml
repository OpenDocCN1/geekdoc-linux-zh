    # Look beyond automation


    Before we can create any resources, we need to have a place to create those resources.
    In this case, we''re using OCI as our incubator, so obviously, we need to add
    OCI to our OLAM instance. In order to do this, we need to create credentials to
    allow OLAM to access OCI. This doesn''t stop at OCI. OLAM is your doorway into
    hybrid cloud solutions. We can deploy on-premises solutions through virtualization
    fabrics and HCI solutions such as VxRail, VMware, OpenStack. We won''t be covering
    hybrid cloud solutions in this recipe, although we did cover cloud in past recipes,
    as migrating a virtual machine as a template into OCI or uploading an image to
    create an AMI image in AWS. These techniques can also be used in hybrid cloud
    scenarios, working with and moving workloads'' ingress and egress to cloud service
    providers (CSPs). As you can see, the possibilities are there, and they are endless.


    To delve a little further in IaC (Infrastructure as Code), we have to look at
    the definition of infrastructure as a service. Take a step back and reframe the
    way you think about infrastructure, and then reconstruct it in your head as moving
    numbers, fields, and landscapes. That''s IaC is; it''s an ever-evolving landscape
    that keeps on changing its definition to match what the end state is.'
  merge: -1
  pgno: 438
- img_proc: true
  md: 'you ever played the game Tetris? IaC looks and feels like Tetris, although
    in this case, we win every time; we''re just fitting pieces next to one another,
    creating an environment that matches what we need it to look like. There are so
    many different variables we can use to transform our everyday tasks into IaC –
    for example, expanding capacity, storage, and/or network. For instance, imagine
    we have virtual machine A, an image for web servers. We have two web servers deployed
    for a small university. That has challenges during general admissions periods
    and needs to expand seamlessly. We use autoscaling or workload expansion to implement
    new web servers, supplementing the university’s needs until the requirement expires.
    These examples are a little more intensive than the example in this recipe, but
    it’s essential to see the value of code as we move along this freeway of change
    in an evolving IT landscape.


    # Getting ready


    Ansible provides building blocks for platform configuration and managing compute
    instances. In this recipe, we''re going to take a different look at Ansible, and
    we''ll see how to use it to write a playbook to instantiate a new virtual machine
    in OCI. We''re going to learn the basics of playbooks, beyond using the predefined
    Oracle basics we explored a couple of recipes ago, to discover the benefits of
    IaC through Ansible, and we''ll also learn how to create a foundation for Ansible
    to be used in the form of playbooks. Lastly, you''ll learn how to create playbooks
    and configure and manage resources on OCI.


    To start, we need to configure our environment. This includes connecting our OLAM
    instance to OCI. This will allow us to execute our playbook in our OCI tenancy.


