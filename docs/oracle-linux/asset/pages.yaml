  md: 'Detection technology. This effectively turns every system using Ksplice to
    a free intrusion detection system for the kernel.


    In the next phase, gaining access, the hacker exploits the vulnerability, gaining
    access to the data. This is often done weeks after the initial discovery phase.
    Hackers take their time; they do this to run under the radar, and they know that
    most environments are only patched on a quarterly basis at best. Additionally,
    many attacks come from inside the organization, from people who have limited access
    to systems as part of their normal role. Ksplice disrupts this pattern, enabling
    the system to easily patch daily, closing the window of opportunity for the hacker.


    In the last phase, the hackers maintain access, often using the same vulnerability
    to continually mine the system for data. Ksplice allows this to also shut down,
    as it closes the vulnerability post-patch but also shuts down the exploit for
    the attack while in progress. This is an important feature of Ksplice: the ability
    to patch the kernel and close the exploit while the exploit is being used. This
    shuts down the exploit mid-flight, significantly enhancing the system''s security.


    Now, about patching effort – once a quarter at best? Kernel patches are released
    almost daily, yet systems can remain unpatched for almost a quarter of the year
    or more. This gives attackers a huge window of opportunity to compromise your
    systems. Not only is scheduling a challenge for most mission-critical systems
    but the patch process itself is very time- and labor-intensive. Let''s look at
    why this is the case. As seen in the following diagram, there are many steps required
    to patch a server:'
  merge: -1
  pgno: 238
- img_proc: true
  md: '![](img/110fa0d6324f0893fff03cee6394144d_239_0.png)


    Figure 7.3 – Legacy patch process


    The following list provides a short description of each of these steps:


    +   1. **Block users from accessing the application**: Disable load balancers
    or disable user logins to the application so users do not accidentally corrupt
    data.

    2. **Shut down the application**: Shut down the databases, application servers,
    schedulers, load balancers, and so on. This is to prepare for the operating system
    reboot.

    3. **Sanity reboot the servers**: Perform a reboot of the servers, with no other
    changes made. This is to verify that the servers can perform a clean reboot. In
    this step, a snapshot is made of the app servers.

    4. **Restart the application**: Start the application back up to verify that it
    is working. This is to verify the sanity reboot.

    5. **Test post sanity reboot**: Often, some changes get made to the application
    and/or its infrastructure that can cause issues with the application. This verifies
    that there is a good system before the patches are applied.

    6. **Shut down the application**: Shut everything down again to prepare for the
    patching.

    7. **Patch the servers**: Applying the operating system patches.

    8. **Reboot post patch**: Reboot so the patches take effect.

    9. **Restart the application**: Restart the application again.

    10. **Test the application**: Test the application, and verify all all is good.

    11. **Let users back in**: Allow users back into the application.


    # NOTE'
  merge: -1
  pgno: 239
- img_proc: true
  md: 'Not every organization follows the full path process, skipping steps to save
    some time. While this can save some time in the short term, all it takes is one
    patch cycle where changes were made to the application and/or its infrastructure
    between patch cycles to make for a very bad, long night, or worse, long days.


    As you can see, properly patching takes a lot of time, and the more complex the
    application, the more people and time are required for each patch cycle. Most
    of this time and effort is caused due to the reboot required.


    When you avoid the reboot, the patch process is significantly simplified; as shown
    in the following diagram, there are only two steps!


    ![](img/110fa0d6324f0893fff03cee6394144d_240_0.png)


    Figure 7.4 – Ksplice patching process


    The following list provides a short description of these two steps:


    +   * **Ksplice the servers**: Apply the kernel and user space patches with ksplice.

    * **Testing**: Test the application


    By using Ksplice, your team can save a ton of time, reduce late nights, and improve
    security. Best of all, it''s easy to set up and use!


    # Discovering Ksplice


    Ksplice is easy to configure. There are a few concepts and points you need to
    understand before Kplicing your servers:


    +   * If your servers are running on **Oracle Cloud Infrastructure (OCI)**, using
    Oracle''s default platform images, all the Ksplice preparation work and access
    to the Ksplice repo is already performed to support online Ksplice usage. Systems
    will also need a route (usually with a NAT gateway) to the Ksplice endpoint. This
    is automatically set up when using the **Virtual Cloud Network (VCN)** wizard.

    * If you are using Autonomous Linux on OCL, your systems are already Kpliced automatically.

    * There are two Ksplice clients: the legacy Uptrack client and the Enhanced client.'
  merge: -1
  pgno: 240
- img_proc: true
  md: 'You do not need internet access to use Kplice; you can use specially built
    Kplice .rpm files using the offline mode. This will require that you mirror the
    ULN Kplice repos on a local YUM server. This was covered in Chapter 5.


    The Enhanced client and the Uptrack client allow you to Kplice the kernel, the
    Enhanced client also offers the ability to Kplice user space libraries, KVM hypervisors,
    and Arm-based systems and offers Known Exploit Detection on x86_64 platforms.
    Most new users should use the Enhanced client.


    The older Uptrack client does not offer the advantages of the Enhanced client,
    but it does the ability to patch some non-Oracle Linux systems.


    Kplice offers two different modes: the online mode and the offline mode. The online
    mode requires each system to register to the Oracle ULN but offers a Kplice web
    interface, for advanced automation and the ability to patch a Xen hypervisor.
    However, since this requires every system to not only register with ULN but also
    for internet access, many system administrators use the offline


    The offline mode allows the system to use Kplice without internet access. This
    is most often used by Enterprise and Government environments where all servers
    do not have internet access. In these cases, the most common method is to set
    up a ULN mirror, giving that system access to the internet, and the local Oracle
    Linux servers will pull from that mirror to use Kplice:


    ![](img/110fa0d6324f0893fff03cee6394144d_241_0.png)


    Figure 7.5 – Kplice offline mode using RPMs'
  merge: -1
  pgno: 241
- img_proc: true
  md: 'With the offline mode, only the local ULN mirror needs to be able to access
    the Oracle ULN, via the HTTPS protocol. This can be done via a basic firewall
    rule or a more advanced proxy server. Once the ULN mirror is registered and synced
    from the ULN, the servers behind the firewall pull their RPMs via HTTP/HTTPS from
    the ULN mirror. There are a couple of advantages to the offline mode: less bandwidth
    is used for the internet and every client needs to be registered. Of course, having
    no API, there are some limitations with more advanced automation.


    Regardless of what mode is used, the clients must have access to a few specific
    Ksplice channels. The following table describes the channels that are available
    for Ksplice in Oracle Linux:


    | Channel Name | Enhanced Client | Channel Label | Description |

    | --- | --- | --- | --- |

    | Ksplice for Oracle Linux 7 (x86_64) | Optional | ol7_x86_64_kspline | Ksplice
    RPMs for Oracle Linux 7 on x86_64 systems |

    | Ksplice for Oracle Linux 7 (aarch64) | Optional | ol7_aarch64_kspline | Ksplice
    RPMs for Oracle Linux 7 on aarch64 systems |

    | Ksplice for Oracle Linux 8 (x86_64) | Optional | ol8_x86_64_kspline | Ksplice
    RPMs for Oracle Linux 8 on x86_64 systems |

    | Ksplice for Oracle Linux 8 (aarch64) | Optional | ol8_aarch64_kspline | Ksplice
    RPMs for Linux 8 on aarch64 systems |

    | Ksplice-aware user space packages for Oracle Linux 7 (x86_64) | Required | ol7_x86_64_userspace_kspline
    | Latest Ksplice-aware user space packages for Oracle Linux 7 (x86_64) |'
