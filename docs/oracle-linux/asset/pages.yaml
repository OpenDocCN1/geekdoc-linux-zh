    \  smtp_connect timeout 30\n  router id ORACLE_LINUX8\n  vrrp_skip_check_adv_addr\n\
    \  vrrp_strict\n  vrrip_garp_interval 50\n  vrrip_gna_interval 50\n}\n```\n\n\
