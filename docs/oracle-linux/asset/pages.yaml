    # Making Docker Desktop more manageable with Portainer


    Portainer is a container management platform, as mentioned in the introduction
    to this chapter. Portainer was originally designed as a UI for Docker, but now
    it supports several other container environments as well. With over 1 million
    users and a significant presence on GitHub, Portainer offers two versions: the
    free and open Community Edition (CE) and a Enterprise Edition (EE). In this recipe,
    we will be working with the free and open source version.


    If you prefer managing your containers through a GUI, Portainer is an excellent
    option. While CLI commands and API endpoints are great for development, a GUI
    is often more user-friendly for producing applications. With Portainer, you can
    easily monitor endpoints and grant team members access to a shared deployment
    environment. The following figure shows how Portainer offers a UI clear over the
    Docker CLI, making it easier for the layman and seasoned engineer to navigate
    container management.'
