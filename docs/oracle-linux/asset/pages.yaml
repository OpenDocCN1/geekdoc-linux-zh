  md: '# How to do it...


    Building from the last recipe, in which we examined nodejs, let’s go ahead and
    install it. There’s

    more than one way to do this. You can enable the module and use the standard dnf
    install

    [package(s)] command to install the packages:


    ```

    # dnf module enable nodejs

    # dnf install nodejs npm

    ```


    You can also use the standard dnf commands without specifying modules and the
    default module will

    get enabled as part of the transaction:


    ```

    # dnf install nodejs npm

    Or, the preferred way is to tap directly into the set of dnf module commands and
    simply run dnf

    module install [module name(s)]:

    ```


    ```

    # dnf module install nodejs

    ```


    The output is in the following screenshot:


    ![](img/110fa0d6324f0893fff03cee6394144d_337_0.png)


    Figure 1.6 – Output of dnf module install nodejs


    What you get is in the latest of the default AppStream (if nothing is enabled),
    but for some reason you

    wanted an older version in the stream, you can select that by appending a colon
    and the version to

    end of the command. For example, if I didn’t want the latest, and wanted the version
    before

    it, I would type this:


    ```

    # dnf module install nodejs:10:80300201011819659

    ```'
