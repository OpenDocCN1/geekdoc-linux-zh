  md: '# Software Management with DNF


    Without packages, a fresh Linux installation is about as useful as a car with
    no tires! You need to be able to add software to the system to make it useful.
    This can be done in several ways. Back in the old days (I am a true grey-bearded
    Unix/Linux guy), you used to download the source files and then build and install
    them manually. On occasion, you could prebuilt packages, often, the dependencies
    that were required would take hours to run down manually. In 1997, along came
    Red Hat Package Manager (RPM) files. These really simplified the process, as all
    you needed to track down all the RPMs needed to install an application, and off
    you went.


    Then, the applications started getting more complex; an example is the Apache
    HTTP server – all of its optional features from 2-3 RPMs to a dozen, plus all
    the required dependencies. Tracking down all the RPMs and their dependencies became
    a chore... and mismatched versions, chaos quickly took control. To a screeching
    halt Yellowdog Updater, Modified (YUM) was released in 2003. Now you could have
    a centralized location for all of the RPMs, with an easy way to install and patch
    the packages and all of the dependencies. Red Hat Enterprise Linux (RHEL) moved
    to YUM, and life was good.


    # NOTE


    > YUM replaced Yellowdog Update Program (YUP), which was the original tool used
    by Yellowdog Linux for the installer. Yellowdog Linux was a distribution built
    for the POWER? CPU used on the PlayStation 3 and IBM systems and was CentOS/RHEL
    based. While it died in 2012, it lives on YUM.


    This chapter contains the following:


    +   - What have they done to YUM, moving to DNF?

    - Using the DNF time machine

    - Building a DNF/YUM mirror from ULN

    - Creating a new RPM package'
  merge: -1
  pgno: 158
- img_proc: true
  md: '# What have they done to YUM, moving to DNF?


    YUM was good – it worked and it allowed to easily install and patch software.
    You could even use it to roll back a bad installation. So, what happened to it?
    Why was DNF released? What is DNF and how hard will it be to learn a new tool?


    First, DNF stands for Dandified YUM and is a rewrite of the YUM software. It was
    released in 2013 in Fedora 18 and was built to address many issues that YUM was
    starting to face.


    The two most common problems with YUM were performance and RAM usage:


    +   - **Poor performance:** YUM had performance issues. A lot of this was caused
    by dependency resolution, the process in which all packages and their dependencies
    are put. This process could take as long as 10 minutes. DNF moved to livsort,
    which significantly decreased the time to resolve complex dependencies. This is
    now more common that ever, with some applications requiring 30+ RPMs.

    - **High RAM usage:** YUM used a lot of RAM; this really started to become an
    issue with RHEL/CentOS 7, with smaller servers running out of RAM while updating.


    # Getting ready


    DNF changes are not just in performance; there are also some key differences in
    its behavior. In order to test these changes, you may need an Oracle Linux 8 system
    and access to all the free repos, such as https://yum.oracle.com. You may also
    want to be running Oracle Linux in a virtualized environment where you can leverage
    snapshots to keep copies of the OS before and after a change. Oracle VM VirtualBox
    is a great way to do this.


    # How to do it...


    For the most part, DNF and YUM work the same: `dnf install` and `yum install`
    appear to work the same way, with DNF being faster. The same applies to `dnf upgrade`
    and `yum upgrade`, so you probably know the basics.


    In YUM, `update` and `upgrade` have slightly different behaviors, with `yum update`
    removing the older packages from the system. With DNF, both `update` and `upgrade`
    will update the installed software but the `upgrade` option will also remove the
    obsolete packages. Additionally, the `auto-remove` option will remove packages
    that are no longer required by the system.


    NOTE


    Starting with Oracle Linux 8, the `yum` command is a symbolic link (symlink) to
    the `dnf` command.'
  merge: -1
  pgno: 159
- img_proc: true
  md: 'At this point in the development of DNF, most of the commands are the same,
    but DNF does have a few tricks up its sleeve, such as automatically running an
    update.


    # DNF automatic updates


    You can set DNS to run automatically. To do this, install the dnf-automatic package,
    and enable the service with the following commands:


    ```

    yum install dnf-automatic

    systemctl enable dnf-automatic.timer

    systemctl start dnf-automatic.timer

    ```


    Next, edit the /etc/dnf/automatic.conf file. There are a few tricks in this file.
    You can override whether patches are applied when downloaded by setting the apply_updates
    parameter to yes. This will force patches to be applied when the job runs.


    Don''t forget to set the system_name parameter so that emails and notifications
    will have the correct name.


    You can also set the system to email you a report of what was installed. Set up
    email in the [email] stanza. If using an email relay, make sure it does not require
    authentication, or add that to the configuration if needed.


    As a final trick, you can change the emit_via parameter from stdout to motd. When
    set to motd, the system motd file is updated to reflect what patches were installed.
    When users log in to the system, they will see a complete list of what patches
    were installed and when, as shown in the following screenshot:'
  merge: -1
  pgno: 160
