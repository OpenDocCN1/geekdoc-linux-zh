    # Leaping from Oracle Linux 7 to 8


    A challenge system admins often face is what to do when you have an older OS deployed
    and it’s about to reach the day when support ends. It happens, and it’s not fun.
    This will put you in a position to reinstall the new OS on new systems, and migrate
    your workload over. For many systems, there is a better way known as Leapp.


    Leapp allows you to upgrade your OS from Oracle Linux 7 to Oracle Linux 8. There
    is no need to reinstall on every system. Leaping consists of two phases:


    +   - A pre-upgrade phase that checks the system to determine whether the software
    can be upgraded


    +   - A second phase that actually performs the upgrade


    Sounds good. But there are a few things you need to know.


    # Getting ready


