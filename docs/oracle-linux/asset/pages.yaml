  md: "Figure 8.18 – Long playbook without roles\n\n# NOTE\n\nThe screenshot fades\
    \ out at the end because it's a long playbook and the entire contents of the playbook\
    \ are not important.\n\nThis playbook automates several tasks. First, it creates\
    \ a standard user if they do not already exist, then it installs Podman via the\
    \ container-tools AppStream module, which launches a NGINX container, and then\
    \ eventually proceeds to upgrading all the packages on the system and checking\
    \ whether the system needs to be rebooted.\n\nAs you can see from this example,\
    \ if you write all your tasks directly into a playbook, it doesn't take long for\
    \ that file to become massive and unwieldy. Before long, you will find yourself\
    \ repeating preparatory tasks throughout, and you'll likely add hash marks at\
    \ the beginning of each line for unnecessary tasks, which will make the automation\
    \ see it as a comment rather than code – you might even find yourself toggling\
    \ between disabling and enabling tasks in order to target a specific task when\
    \ running the playbook. This can become overwhelming, and if you're not careful,\
    \ you might end up removing bits of code when you don't need them (even though\
    \ you need them). Roles offer a better way to organize your playbooks. In fact,\
    \ you can write as many roles as you want, and neatly clean them in the playbook\
    \ – this makes the playbook far easier to read and maintain over time.\n\n# Creating\
    \ a role\n\nIn Ansible, roles are organized under the roles directory. You create\
    \ a folder under roles, and whatever you name the folder will become the name\
    \ of the role. Then under that folder, you create a minimum of one folder called\
    \ tasks, which should contain a main.yml file defining the primary tasks that\
    \ the role will perform:\n\n+   1. Let's break things up and create a role for\
    \ our users by creating a users folder in the roles directory.\n\nYour directory\
    \ structure should look like this:\n\n```\nplaybook.yml\nroles\n  └── users\n\
    \      ├── files\n      │   └── wallpaper.jpg\n      └── tasks\n          └──\
    \ main.yml\n```\n\n+   2. Now, create a main.yml file in the tasks directory,\
    \ and let's port our user-related tasks over into that file."
  merge: -1
  pgno: 275
