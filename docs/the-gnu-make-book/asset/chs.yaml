  \n算术库函数以两种形式出现：每种函数的一种形式接收整数作为参数，另一种形式接收编码后的参数（`x`）。\n\n算术库函数以两种形式出现：每种函数的一种形式接收整数作为参数，另一种形式接收编码后的参数（`x`）。\n\
