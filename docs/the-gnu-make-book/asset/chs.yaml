  ### int_decode\n\n`int_decode` 函数接收一个 `x` 表示的数字并返回其整数：\n\n```\nint_decode\n\n参数:\
  \ 1: x 表示的数字\n返回:   该数字对应的整数\n```\n\n### int_encode\n\n`int_encode` 是 `int_decode`\
  \ 的相反：它接收一个整数并返回 `x` 表示：\n\n```\nint_encode\n\n参数: 1: 可读的整数\n返回:   x 表示的字符串\n```\n\
  \n### int_plus\n\n`int_plus` 将两个 `x` 表示的数字相加并返回它们的和：\n\n```\nint_plus\n\n参数: 1:\
  \ x 表示的数字\n       2: 另一个 x 表示的数字\n返回:   x 表示的和的结果\n```\n\n### plus\n\n要进行整数加法，使用\
  \ `plus` 函数，它在 `x` 表示之间转换并调用 `int_plus`：\n\n```\nplus (wrapped version of int_plus)\n\
  \n参数: 1: 整数\n       2: 另一个整数\n返回:   两个整数的和\n```\n\n### int_subtract\n\n`int_subtract`\
  \ 减去两个 `x` 表示的数字并返回其差的 `x` 表示：\n\n```\nint_subtract\n\n参数: 1: x 表示的数字\n       2:\
  \ 另一个 x 表示的数字\n返回:   x 表示的差的结果\n```\n\n### subtract\n\n要进行整数减法，使用 `subtract` 函数，它在\
  \ `x` 表示之间转换并调用 `int_subtract`：\n\n```\nsubtract (wrapped version of int_subtract)\n\
  \n参数: 1: 整数\n       2: 另一个整数\n返回:   两个整数的差\n```\n\n### int_multiply\n\n`int_multiply`\
  \ 乘以两个处于 `x` 表示的数字：\n\n```\nint_multiply\n\n参数: 1: x 表示的数字\n       2: 另一个 x 表示的数字\n\
  返回:   x 表示的乘积的结果\n```\n\n### multiply\n\n`multiply` 将乘以两个整数并返回它们的乘积。它自动在 `x` 表示之间转换并调用\
  \ `int_multiply`：\n\n```\nmultiply (wrapped version of int_multiply)\n\n参数: 1: 整数\n\
  \       2: 另一个整数\n返回:   两个整数的乘积\n```\n\n### int_divide\n\n`int_divide` 将一个数字除以另一个；两者都以\
  \ `x` 表示，结果亦是：\n\n\n\n\n\n```\nint_divide\nArguments: 1: 一个 x 表示法下的数字\n        \
  \   2: 另一个 x 表示法下的数字\nReturns:   参数 1 除以参数 2 在 x 表示法下的 \n           整数除法结果\n```\n\
  \n### ### divide\n\n`divide` 函数调用 `int_divide` 对两个十进制整数进行除法，并自动在 `x`-表示法之间转换：\n\n\
  ```\ndivide (wrapped version of int_divide)\n\nArguments: 1: 一个整数\n           2:\
  \ 另一个整数\nReturns:   第一个参数除以第二个参数的整数除法\n```\n\n### ### int_max and int_min\n\n`int_max`\
  \ 和 `int_min` 分别返回两个 x-表示法数字的极大值和最小值：\n\n```\nint_max, int_min\n\nArguments: 1:\
  \ 一个 x 表示法下的数字\n           2: 另一个 x 表示法下的数字\nReturns:   其参数在 x 表示法下的最大值或最小值\n```\n\
  \n### ### max and min\n\n`int_max` 和 `int_min` 的十进制整数等效函数是 `max` 和 `min`；它们会自动在\
  \ x-表示法之间转换：\n\n```\nmax, min\n\nArguments: 1: 一个整数\n           2: 另一个整数\nReturns:\
  \   其整数参数的最大值或最小值\n```\n\n### ### int_inc\n\n`int_inc` 是一个短小的辅助函数，仅用于向 x-表示法下的数字加\
  \ 1：\n\n```\nint_inc\n\nArguments: 1: 一个 x 表示法下的数字\nReturns:   x 表示法下加了 1 的数字\n\
  ```\n\n### ### inc\n\n`inc` 函数向十进制整数加 1：\n\n```\ninc\n\nArguments: 1: 一个整数\nReturns:\
  \   加了 1 的参数\n```\n\n### ### int_dec\n\n`int_inc` 的相反函数是 `int_dec`：它将一个数字减 1：\n\n\
  ```\nint_dec\n\nArguments: 1: 一个 x 表示法下的数字\nReturns:   x 表示法下减了 1 的数字\n```\n\n###\
  \ ### dec\n\n`dec` 函数将十进制整数减减 1：\n\n```\ndec\n\nArguments: 1: 一个整数\nReturns:   减了\
  \ 1 的参数\n```\n\n### ### int_double\n\n`double` 和 `halve` 函数（以及对应的 `int_double` 和\
  \ `int_halve`）是为了性能考虑而提供的。如果你乘以 2 或除以 2，这些函数会比乘和除法更快。\n\n`int_double` 将一个整数翻倍：\n\
  \n```\nint_double\n\nArguments: 1: 一个 x 表示法下的数字\nReturns:   x 表示法下翻倍 (* 2) 的数字\n\
  ```\n\n### ### double\n\n`double` 将一个十进制整数翻倍：\n\n```\ndouble\n\nArguments: 1: 一个整数\n\
  Returns:   整数乘以 2\n```\n\n在内部，它会转换为 `x`-表示法并调用 `int_double`。\n\n### ### int_halve\n\
  \n你可以通过对 x-表示法下的数字调用 `int_halve` 来执行除 2 的整数除法：\n\n```\nint_halve\n\nArguments: 1:\
  \ 一个 x 表示法下的数字\nReturns:   x 表示法下减 (/ 2) 的数字\n```\n\n### ### halve\n\n最后，还有 `halve`：\n\
  \n```\nhalve\n\nArguments: 1: 一个整数\nReturns:   除以 2 的整数\n```\n\n这是 `int_halve` 的十进制整数等效函数。\n\
  \n## ### 整数比较函数\n\n所有整数比较函数都返回 `$(true)` 或 `$(false)`：\n\n```\nint_gt, int_gte,\
  \ int_lt, int_lte, int_eq, int_ne\n\nArguments: 两个要比较的 x 表示法数字\nReturns:   $(true)\
  \ 或 $(false)\n\nint_gt  第一个参数大于第二个参数\nint_gte 第一个参数大于等于第二个参数\nint_lt  第一个参数小于第二个参数\n\
  int_lte 第一个参数小于等于第二个参数\nint_eq  第一个参数在数值上等于第二个参数\nint_ne  第一个参数在数值上不等于第二个参数\n```\n\
  \n这些可以用于 GNU `make` 和 GMSL 函数，也可以用于期望布尔值值的指令（例如 GMSL 逻辑运算符）。\n\n但你更有可能使用这些版本的比较函数：\n\
  \n```\ngt, gte, lt, lte, eq, ne\n\nArguments: 两个要比较的整数\nReturns:   $(true) 或 $(false)\n\
  \nint_gt  第一个参数大于第二个参数\nint_gte 第一个参数大于等于第二个参数\nint_lt  第一个参数小于第二个参数\nint_lte 第一个参数小于等于第二个参数\n\
  int_eq  第一个参数在数值上等于第二个参数\nint_ne  第一个参数在数值上不等于第二个参数\n```\n\n这些函数的操作是对十进制整数，而不是 GMSL\
  \ 使用的内部 `x`-表示法。\n\n## ### 杂项整数函数\n\n你可能不会对 GNU `make` 算术进行任何高级操作，但这里详细介绍的杂项函数涉及进制转换和数值序列的生成。它们有时是有用的。\n\
  \n### ### sequence\n\n你使用 `sequence` 函数来生成数字序列：\n\n```\nsequence\n\nArguments: 1:\
  \ 一个整数\n           2: 一个整数\nReturns:   如果 arg1 >= arg2 则返回序列 [arg1 arg2]；如果 arg2\
  \ > arg1 则返回 [arg2 arg1]\n```\n\n例如，`$(call sequence,10,15)` 返回 `10 15`。\n\n###\
  \ ### dec2hex, dec2bin, and decoct\n\n`dec2hex`、`dec2bin` 和 `decoct` 函数在十进制、二进制和八进制之间进行转换：\n\
  \n```\ndec2hex, dec2bin, decoct\n\nArguments: 1: 一个整数\nReturns:   转换为十六进制、二进制或八进制的整数\n\
  ```\n\n例如，`$(call dechex,42)` 返回 `2a`。\n\n### ### repeat and pad\n\n有了 `repeat`，我们只需要一种方法将字符串填充到某些字符长度。`pad`\
  \ 函数实现了这一点：\n\n```\npad = $(call repeat,$1,$(call subtract,$2,$(call strlen,$3)))$3\n\
  \npadded2hex = $(call pad,0,$2,$(call dechex,$1))\n```\n\n它的三个参数是填充字符、填充输出的总字符宽度以及要填充的字符串。例如，`$(call\
  \ pad,0,4,2a)` 将返回 `002a`。从这里可以很容易定义一个 `padded2hex`。\n\n正如你预期的，`$(call padded2hex,42,8)`\
  \ 返回 `0000002a`。\n\n## ### 列表操作函数\n\n在 GNU `make` 和 GMSL 术语中，列表是带有空白符分隔的字符字符串。GNU\
  \ `make` 处理列表的内置函数以及 GMSL 函数都将多个空格视为单个空格。因此，列表 `1 2 3` 和 `1  2 3` 是相同的。\n\n我将在接下来的章节中详细介绍一些列表操作函数。这些函数在用法上比其他函数更复杂，并且通常出现在函数式语言中。\n\
  \n\n\n\n\n### 使用 map 对列表应用函数\n\n当你使用 GNU `make` 函数（无论是内置函数还是你自定义的）时，你实际上是在使用一种简单的函数式语言进行编程。在函数式编程中，通常有一个\
  \ `map` 函数，它可以将一个函数应用于列表的每一个元素上。GMSL 定义 `map` 正是为了实现这一功能。例如：\n\n```\nSRCS := src/FOO.c\
  \ src/SUBMODULE/bar.c src/foo.c\nNORMALIZED := $(call uniq,$(call map,lc,$(SRCS)))\n\
  ```\n\n假设 `SRCS` 中有一组文件名列表（可能指定了路径），这将确保所有文件名都转换为小写，然后应用 `uniq` 函数来获取唯一的源文件列表。\n\
  \n这里使用了 GMSL 函数 `lc` 将 `SRCS` 中的每个文件名转换为小写。你可以对内置函数和用户定义函数同时使用 `map` 函数。在这里，`NORMALIZED`\
  \ 的结果将是 `src/foo.c src/submodule/bar.c`。\n\n`map` 的另一个用可能是获取每个源文件的大小的大小：\n\n```\n\
  size = $(firstword $(shell wc -c $1))\n\nSOURCE_SIZES := $(call map,size,$(SRCS))\n\
  ```\n\n在这里我们定义了一个 `size` 函数，它使用 `$(shell)` 调用 `wc`，然后将其应用到 `SRCS` 中的每个文件。\n\n在这里，`SOURCE_SIZES`\
  \ 可能类似于 `1538 1481`，每个源文件对应一个元素。\n\n### 一个 reduce 函数\n\n函数式语言中的另一个常用函数是 `reduce`。`reduce`\
  \ 将一个接受两个参数的函数应用于列表的连续元素，并将函数的返回值传递给下一次调用。GMSL 没有内置的 `reduce` 函数，但你可以很容易地定义它：\n\n\
  ```\nreduce = $(if $2,$(call $0,$1,$(call rest,$2),$(call $1,$3,$(firstword $2))),$3)\n\
  ```\n\n### 使用 reduce 求数字列表\n\n将 `reduce` 与 `plus` 函数结合，你可以轻松地创建一个 GNU `make` 函数来对数字列表求和：\n\
  \n```\nsum-list = $(call reduce,plus,$1,0)\n```\n\n`sum-list` 函数接收一个参数，即数字列表，并返回这些数字之和。它向\
  \ `reduce` 传递了三个内容：为列表中的每个元素调用的函数名称（在此情况下为 `plus`）、数字列表以及一个起始数字（在此情况下为 `0`）。\n\n\
  以下是它的工作原理。假设调用了 `$(call sum-list,1 2 3 4 5)`。将执行以下 `plus` 的调用序列：\n\n```\n$(call\
  \ plus,1,0) 返回 1\n$(call plus,1,2) 返回 3\n$(call plus,3,3) 返回 6\n$(call plus,6,4)\
  \ 返回 10\n$(call plus,10,5) 返回 15\n```\n\n第一次调用使用列表的第一个元素和起始数字 `0`。随后的调用使用列表中的下一个元素和上一次调用\
  \ `plus` 的结果。\n\n你可以将 `sum-list` 与 `SOURCE_SIZES` 变量结合，获取源代码的总大小：\n\n```\nTOTAL_SIZE\
  \ := $(call sum-list,$(SOURCE_SIZES))\n```\n\n在这种情况下，`TOTAL_SIZE` 将是 `3019`。\n\n\
  ### 在两对列表上映射函数\n\nGMSL 为列表定义的另一个有趣函数是 `pairmap`。它接受三个参数：两个列表（长度应相同）和一个函数。该函数被依次应用于每个列表的第一个元素、第二个元素、第三个元素，依此类推。\n\
  \n假设 `SRCS` 包含一个源文件列表。使用我们定义的 `size` 函数结合 `map`，定义了 `SOURCE_SIZES`，它包含了每个源文件的大小列表。使用\
  \ `pairmap`，我们可以将两个列表压缩在一起，输出每个文件名及其大小：\n\n```\nzip = $1:$2\n\nSOURCES_WITH_SIZES\
  \ := $(call pairmap,zip,$(SRCS),$(SOURCE_SIZES))\n```\n\n`zip` 函数被依次应用于源文件名和大小，并生成一个用冒号分隔文件名及其大小的字符串。使用本节中的示例文件和大小，`SOURCES_WITH_SIZES`\
  \ 将是 `src/foo.c:1538 src/submodule/bar.c:1481`。\n\n### first\n\n`first` 接收一个列表并返回其第一个元素：\n\
  \n```\nfirst\n\n参数: 1: 一个列表\n返回值:   返回列表的第一个元素\n```\n\n注意 `first` 与 GNU `make` 函数\
  \ `$(firstword)` 是相同的。\n\n### last\n\n`last` 函数返回列表的最后一个元素：\n\n```\nlast\n\n参数:\
  \ 1: 一个列表\n返回值:   返回列表的最后一个元素\n```\n\nGNU `make` 3.81 了 `$(lastword)`，其工作方式与 `last`\
  \ 相同。\n\n### rest\n\n`rest` 函数几乎是 `first` 的相反。它返回列表除第一个元素以外的所有内容：\n\n```\nrest\n\
  \n参数: 1: 一个列表\n返回值:   移除了第一个元素的列表\n```\n\n### chop\n\n要移除列表的最后一个元素，请使用 `chop`：\n\
  \n```\nchop\n\n参数: 1: 一个列表\n返回值:   移除了最后一个元素的列表\n```\n\n### map\n\n`map` 遍历列表并在每个元素上调用函数：\n\
  \n```\nmap\n\n参数\n1: 要调用的函数\n2: 列表\n返回值:   应用函数后的列表\n```\n\n### pairmap\n\n`pairmap`\
  \ 类似于 `map`，但它作用于一对列表：\n\n```\npairmap\n\n参数\n1: 要调用的函数\n2: 第一个列表\n3: 第二个列表\n返回值:\
  \   对对应用函数后的列表\n```\n\n### leq\n\n`leq` 列表相等函数在列表仅有空格不同时会正确返回 `$(true)`：\n\n```\n\
  leq\n\n参数: 1: 要比较的列表...\n2: 此列表\n返回值:   如果列表相同则返回 true\n```\n\n例如，`leq` 认为 `1 2\
  \ 3` 和 `1 2 3` 是相同的。\n\n### lne\n\n`lne` 是 `leq` 的相反：当两个列表不等时返回 `$(true)`：\n\n```\n\
  lne\n\n参数: 1: 要比较的列表...\n2: 此列表\n返回值:   如果列表不同则返回 true\n```\n\n### reverse\n\n`reverse`\
  \ 一个列表可能是用的（因为可以反向传递给 `$(foreach)`）：\n\n```\nreverse\n\n参数: 1: 要反转的列表\n返回值:   反转后的列表\n\
  ```\n\n### uniq\n\n内置的 `$(sort)`会对列表去重，但它是在排序的同时完成的。GMSL 的 `uniq` 函数在去重的同时保留了元素出现的顺序：\n\
  \n```\nuniq\n\n参数: 1: 要去重的列表\n返回值:   保留原始顺序的去重列表\n```\n\n例如，`$(call uniq,a c b a\
  \ c b)` 将返回 `a c b`。\n\n### length\n\n获取列表中元素的数量，调用 `length`：\n\n```\nlength\n\n\
  参数: 1: 一个列表\n返回值:   列表元素的数量\n```\n\n`length` 函数与 GNU `$(words)` 函数相同。\n\n## 字符串处理函数\n\
  \n字符串是任何字符的序列，包括空格。字符串相等（和字符串不等）函数 `seq` 对于包含空格或仅由空格组成的字符串也有效。例如：\n\n```\n# space\
  \ 包含空格字符\n\nspace :=\nspace +=\n\n# tab 包含制表符\n\ntab :=→  # 需要保护制表符\n\n$(info $(call\
  \ seq,White Space,White Space))\n$(info $(call seq,White$(space)Space,White Space))\n\
  $(info $(call sne,White$(space)Space,White$(tab)Space))\n$(info $(call seq,$(tab),$(tab)))\n\
  $(info $(call sne,$(tab),$(space)))\n```\n\n这输出五次 `T`，表示每次调用 `seq` 或 `sne` 都返回了\
  \ `$(true)`。\n\n与列表处理函数一样，我将在后续章节中详细介绍几个更复杂的函数。\n\n### 将 CSV 数据拆分为 GNU make 列表\n\
  \n\n\n\n你可以使用 `split` 函数将 CSV 格式的值转换为 GNU `make` 列表。例如，通过逗号进行分割可以将一个 CSV 行转换为一个列表，并从该列表中提取出单独的项目：\n\
  \n```\nCSV_LINE := src/foo.c,gcc,-Wall\n\ncomma := ,\nFIELDS := $(call split,$(comma),$(CSV_LINE))\n\
  \n$(info Compile '$(word 1,$(FIELDS))' using compiler '$(word 2,$(FIELDS))' with\
  \ \\\noptions '$(word 3,$(FIELDS))')\n```\n\n注意变量 `comma` 被定义为包含一个逗号字符，以便在 `$(call)`\
  \ 调用 `split` 函数时使用。这个技巧在 第 1 章 中被讨论过。\n\n### 从目录列表创建 PATH\n\n`merge` 函数是 `split`\
  \ 的相反操作：它通过某些字符分隔列表项，从列表生成一个字符串。例如，要将目录列表转换为适用于 `PATH` 的形式（通常由冒号分隔），可以如下所示定义 `list-to-path`：\n\
  \n```\nDIRS := /usr/bin /usr/sbin /usr/local/bin /home/me/bin\n\nlist-to-path =\
  \ $(call merge,:,$1)\n\n$(info $(call list-to-path,$(DIRS)))\n```\n\n输出为 `/usr/bin:/usr/sbin:/usr/local/bin:/home/me/bin`。\n\
  \n### 使用 tr 翻译字符\n\n最复杂的字符串函数是 `tr`，它的操作类似于 shell 程序 `tr`。它将一组字符集合中的每个字符转换为第二个列表中对应的字符。GMSL\
  \ 定义了一些用于 `tr` 的常用字符类（class）。例如，它定义了名为 `[A-Z]` 和 `[a-z]` 的变量（是的，它们的名字确实就是这样），它们包含了大写字母和小写字母。\n\
  \n我们可以使用 `tr` 创建一个将文本转换为黑客语（leet-speak）的函数：\n\n```\nleet = $(call tr,A E I O L T,4\
  \ 3 1 0 1 7,$1)\n\n$(info $(call leet,I AM AN ELITE GNU MAKE HAXOR))\n```\n\n输出为\
  \ `1 4M 4N 31173 GNU M4K3 H4X0R`。\n\n### seq\n\n命名稍显误导的 `seq` 函数用于测试两个字符串是否相等：\n\
  \n```\nseq\n\nArguments: 1: 一个用于比较的字符串...\n           2: ...此字符串\nReturns:   如果两个字符串相同，则返回\
  \ $(true)\n```\n\n### sne\n\n相反的，即字符串不相等，通过 `sne` 进行测试：\n\n```\nsne\n\nArguments:\
  \ 1: 一个用于比较的字符串...\n           2: ...此字符串\nReturns:   如果两个字符串不相同，则返回 $(true)\n```\n\
  \n### streln\n\n`length` 函数获取列表的长度；字符串对应的等函数是 `strlen`：\n\n```\nstrlen\n\nArguments:\
  \ 1: 一个字符串\nReturns:   字符串的长度\n```\n\n### substr\n\n可以使用 `substr` 函数提取子字符串：\n\n\
  ```\nsubstr\n\nArguments: 1: 一个字符串\n           2: 起始偏移量（第一个字符为 1）\n           3:\
  \ 结束偏移量（包含该位置）\nReturns:   一个子字符串\n```\n\n注意在 GMSL 中，字符串从位置 1 开始，而不是 0。\n\n### split\n\
  \n要将字符串分割为列表，使用 `split` 函数：\n\n```\nsplit\n\nArguments: 1: 用于分割的字符\n           2:\
  \ 要分割的字符串\nReturns:   一个在第一个参数指定的分割字符处用空格分隔的列表\n```\n\n注意，如果字符串中包含空格，结果可能不符合预期。GNU\
  \ `make` 使用空格作为列表分隔符，这使得处理空格和列表变得非常困难。关于 GNU `make` 处理空格的更多信息，请参见 第 4 章。\n\n###\
  \ merge\n\n`merge` 是 `split` 的相反操作。它接收一个列表并输出一个在每个列表元素之间插入字符的字符串：\n\n```\nmerge\n\
  \nArguments: 1: 放在字段之间的字符\n           2: 要合并为字符串的列表\nReturns:   单个字符串，列表元素由第一个参数中的字符分隔\n\
  ```\n\n### tr\n\n你使用 `tr` 函数翻译单个字符，它是创建 `uc` 和 `lc` 函数的构建模块：\n\n```\ntr\n\nArguments:\
  \ 1: 要翻译的字符列表 \n           2: 翻译后的字符列表\n           3: 要翻译的文本\nReturns:   翻译字符后的文本\n\
  ```\n\n### uc\n\n`uc` 对字母 a-z 执行简单的大写转换：\n\n```\nuc\n\nArguments: 1: 要转换为大写的文本\n\
  Returns:   大写形式的文本\n```\n\n### lc\n\n最后，我们还有 `lc`：\n\n```\nlc\n\nArguments: 1: 要转换为小写的文本\n\
  Returns:   小写形式的文本\n```\n\n这对字母 A-Z 执行简单的小写转换。\n\n## 集合操作函数\n\n集合由排序且去重复的列表表示。要从列表创建集合，请使用\
  \ `set_create` 或从 `empty_set` 开始并使用 `set_insert` 插入单个元素。空集由变量 `empty_set` 定义。\n\n\
  例如，一个 Makefile 可以在使用 从目录列表创建 PATH 中讨论的标记技术来跟踪它所创建的所有目录。\n\n### set_create\n\n通过\
  \ `set_create` 创建一个集合：\n\n```\nset_create\n\nArguments: 1: 元素列表\nReturns:   新创建的集合\n\
  ```\n\n它接收一个列表并返回一个集合。注意集合可能包含空格。\n\n### set_insert\n\n一旦创建了集合，可以使用 `set_insert`\
  \ 向其添加元素：\n\n```\nset_insert\n\nArguments: 1: 要插入集合的单个元素\n           2: 集合\nReturns:\
  \   插入元素后的集合\n```\n\n### set_remove\n\n调用 `set_remove` 从集合中删除元素：\n\n```\nset_remove\n\
  \nArguments: 1: 要从集合删除的单个元素\n           2: 集合\nReturns:   删除元素后的集合\n```\n\n当元素不存在时，从集合移除也不会报错。\n\
  \n### set_is_member\n\n要测试元素是否为集合的成员，调用 `set_is_member`。它返回一个指示元素是否存在的布尔值：\n\n```\n\
  set_is_member\n\nArguments: 1: 单个元素\n           2: 集合\nReturns:   如果元素在集合中，则返回 $(true)\n\
  ```\n\n### set_union\n\n通过对两个集合调用 `set_union` 函数来合并它们。返回合并后的集合：\n\n```\nset_union\n\
  \nArguments: 1: 集合\n           2: 集合\nReturns:   两个集合的并集\n```\n\n### set_intersection\n\
  \n要确定两个集合的公共元素，使用 `set_intersection`。它返回两个集合中都存在的元素集合：\n\n```\nset_intersection\n\
  \nArguments: 1: 集合\n           2: 集合\nReturns:   两个集合的交集\n```\n\n### set_is_subset\n\
  \n有时需要知道一个集合是否是另一个的子集，可以通过调用 `set_is_subset` 来测试：\n\n```\nset_is_subset\n\nArguments:\
  \ 1: 集合\n           2: 集合\nReturns:   如果第一个集合是第二个集合的子集，则返回 $(true)\n```\n\n`set_is_subset`\
  \ 返回一个指示第一个集合是否为第二个集合子集的布尔值。\n\n### set_equal\n\n要确定两个集合是否相等，调用 `set_equal`：\n\n\
  ```\nset_equal\n\nArguments: 1: 集合\n           2: 集合\nReturns:   如果两个集合相同，则返回 $(true)\n\
  ```\n\n如果两个集合完全相同，`set_equal` 返回 `$(true)`。\n\n\n\n\n\n`associative array`（关联数组）将一个键值（不包含空格的字符串）映射到单个值（任何字符串）。关联数组有时被称为映射（maps）甚至哈希表（尽管这是一个实现细节，且\
  \ GMSL 关联数组并没有使用哈希）。\n\n你可以将关联数组作为`lookup tables`（查找表）。例如：\n\n```\nC_FILES := $(wildcard\
  \ *.c)\n\nget-size = $(call first,$(shell wc -c $1))\n$(foreach c,$(C_FILES),$(call\
  \ set,c_files,$c,$(call get-size,$c)))\n\n$(info All the C files: $(call keys,c_files))\n\
  $(info foo.c has size $(call get,c_files,foo.c))\n```\n\n这个短小的 makefile 获取当前目录下所有\
  \ `.c` 文件列表及其大小，然后创建一个从文件名到其大小的关联数组。\n\n`get-size` 函数使用 `wc` 获取文件的字节数。`C_FILES`\
  \ 变量包含当前目录下所有的 `.c` 文件。`$(foreach)` 使用 GMSL 的 `set` 函数在名为 `c_files` 的关联数组中设置每个 `.c`\
  \ 文件与其大小之间的映射关系。\n\n以下是运行示例：\n\n```\n$ make\nAll the C files: bar.c foo.c foo.c\n\
  has size 551\n```\n\n第一行是找到的所有 `.c` 文件列表；它是使用 `keys` 函数获取关联数组中的所有键打印的。第二行是通过 `get`\
  \ 查询 `foo.c` 的长度得到的。\n\n### set\n\nGMSL 内部跟踪命名的关联数组，但没有必要显式创建它们。只需调用 `set` 来向数组添加元素，如果数组不存在，则会自动创建。请注意，数组的键不能包含空格。\n\
  \n```\nset\n\nArguments: 1: 关联数组名称\n           2: 要关联的键值\n           3: 与键关联的值\n\
  Returns:   无\n```\n\n### get\n\n要从关联数组中检索一个项，请调用 `get`。如果键不存在，`get` 将返回一个空字符串。\n\
  \n```\nget\n\nArguments: 1: 关联数组名称\n           2: 要检索的键\nReturns:   数组中该键所存储的值\n\
  ```\n\n### keys\n\n`keys` 函数返回关联数组中存在的所有键的列表。你可以配合 `$(foreach)` 使用它遍历关联数组：\n\n```\n\
  keys\n\nArguments: 1: 关联数组名称\nReturns:   数组中所有定义键的列表\n```\n\n### defined\n\n要测试键是否存在于关联数组中，请调用\
  \ `defined`：\n\n```\ndefined\n\nArguments: 1: 关联数组名称\n           2: 要测试的键\nReturns:\
  \   如果键已定义（即非空），返回 $(true)\n```\n\n`defined` 返回一个布尔值，指示该键是否已定义。\n\n## Named Stacks（命名栈）\n\
  \n`stack`（栈）是字符串的有序列表（不包含空格）。在 GMSL 中，栈存储在内部，并且像关联数组一样拥有名称。例如：\n\n```\ntraverse-tree\
  \ = $(foreach d,$(patsubst %/.,%,$(wildcard $1/*/.)),  \\\n$(call push,dirs,$d)$(call\
  \ traverse-tree,$d))\n\n$(call traverse-tree,sources)\n\ndump-tree = $(if $(call\
  \ sne,$(call depth,dirs),0),$(call pop,dirs) \\\n$(call dump-tree))\n\n$(info $(call\
  \ dump-tree))\n```\n\n这个短小的 makefile 使用栈来跟踪目录树。\n\n### traverse-tree\n\n`traverse-tree`\
  \ 函数使用 `$(wildcard)` 函数查找参数（存储在 `$1` 中）的所有子目录（查找目录下始终存在的 `.` 文件）。它使用 `$(patsubst)`\
  \ 函数去掉 `$(wildcard)` 返回的每个值结尾的 `/.`，以获取完整的目录名。\n\n在进入该目录之前，它会将找到的目录推入名为 `dirs` 的栈。\n\
  \n### dump-tree\n\n`dump-tree` 函数从 `dirs` 栈中 `pop` 项，直到没有剩余（直到 `depth` 变为 `0`）。\n\
  \n示例 6-1 显示了一个目录结构。\n\n示例 6-1. 目录结构\n\n```\n$ ls -R sources\nsources:\nbar  foo\n\
  \nsources/bar:\nbarsub\nsources/bar/barsub:\n\nsources/foo:\nsubdir  subdir2\n\n\
  sources/foo/subdir:\nsubsubdir\n\nsources/foo/subdir/subsubdir:\n\nsources/foo/subdir2:\n\
  ```\n\n如果 `sources` 下存在此目录结构，makefile 将输出：\n\n```\nsources/foo sources/foo/subdir2\
  \ sources/foo/subdir sources/foo/subdir/\nsubsubdir sources/bar sources/bar/barsub\n\
  ```\n\n如果希望以深度优先的方式的方式遍历目录树，可以使用栈函数来定义 `dfs`，它会搜索目录树并构建一个包含按深度优先顺序排列目录的 `dirs` 栈：\n\
  \n```\n__dfs = $(if $(call sne,$(call depth,work),0),$(call push,dirs,$(call depth,work))\n\
  ```\n\n\n\n\n\n# 表 6-1. GMSL 常量\n\n| 常量 | 值 | 用途 |\n| --- | --- | --- |\n| `true`\
  \ | `T` | 布尔值 true |\n| `false` | (空字符串) | 布尔值 false |\n| `gmsl_version` | `1 1\
  \ 7` | 当前 GMSL 版本号（主版本、次要版本、修订版本） |\n\n你可以通过将它们封装在 `$()` 或 `${}` 中，像访问普通 GNU `make`\
  \ 变量一样访问这些常量。\n\n## gmsl_compatible\n\n你已经在检查 GMSL 版本 中了解过 `gmsl_compatible` 函数：\n\
  \n```\ngmsl_compatible\n\n参数: 包含所需库版本号（主、次要\n           修订版本）的列表\n返回值: 如果库的当前版本与请求的版本号兼容，则返回\
  \ $(true)，否则返回 $(false)\n```\n\n在第 1 章 中，你见过一个使用目标为 `print-%` 的模式规则来输出变量值的配方。由于这个规则非常有用，GMSL\
  \ 定义了它自己的 `gmsl-print-%` 目标，你可以用它来打印包含 GMSL 的 Makefile 中定义的任何变量的值。\n\n例如：\n\n```\n\
  include gmsl\n\nFOO := foo bar baz\nall:\n```\n\n## gmsl-print-%\n\n`gmsl-print-%`\
  \ 可用于打印任何 Makefile 变量，包括 GMSL 内部的变量。例如，`make gmsl-print-gmsl_version` 会打印当前的 GMSL\
  \ 版本。\n\n```\ngmsl-print-% (目标不是函数)\n\n参数: % 应该替换为你想要打印的变量名\n动作: 打印与 % 匹配的变量及其值\n\
  ```\n\n## assert\n\n正如在 Makefile 断言 中讨论过的样，在 Makefile 中使用断言可能是很有用的。GMSL 提供了两个断言函数：`assert`\
  \ 和 `assert_exists`。\n\n```\nassert\n\n参数: 1: 必须为真的布尔值，否则断言将失败\n       2: 随断言一起打印的消息\n\
  返回值: 无\n```\n\n## assert_exists\n\n为了断言单个文件或目录是否存在，GMSL 提供了 `assert_exists` 函数：\n\
  \n```\nassert_exists\n\n参数: 1: 必须存在的文件名，如果缺失则将生成断言\n返回值: 无\n```\n\n## 环境变量\n\n表\
  \ 6-2 显示了 GMSL 环境变量（或命令行覆盖），这些变量控制着各种功能位。\n\n### 表 6-2. GMSL 环境变量\n\n| 变量 | 用途 |\n\
  | --- | --- |\n| `GMSL_NO_WARNINGS` | 如果设置，则阻止 GMSL 输出警告信息。例如，算术函数可能会产生下溢警告。 |\n\
  | `GMSL_NO_ERRORS` | 如果设置，则阻止 GMSL 生成致命错误：除以零或断言失败是致命的。 |\n| `GMSL_TRACE` | 启用函数追踪。对\
  \ GMSL 函数的调用将导致名称和参数被追踪。请参见追踪变量值 获取关于 Makefile 追踪的讨论。 |\n\n这些环境变量都可以在环境或命令行中设置。\n\
  \n例如，这个 Makefile 包含一个始终失败的断言，这将停止 `make` 进程：\n\n```\ninclude gmsl\n\n$(call assert,$(false),Always\
  \ fail)\n\nall:\n```\n\n设置 `GMSL_NO_ERRORS` 可以防止断言停止 `make` 进程。在这种情况下，`assert` 的输出会被隐藏，且\
  \ `make` 将继续进行：\n\n```\n$ make\nMakefile:5: *** GNU Make Standard Library: Assertion\
  \ failure: Always fail.\nStop.\n$ make GMSL_NO_ERRORS=1\nmake: Nothing to be done\
  \ for 'all'.\n```\n\n在 Makefile 中放置几个恰当的 GMSL 断言可以产生巨大影响。通过检查 Makefile 的先决条件（例如特定文件是否存在或编译器是否具有特定版本号），负责的\
