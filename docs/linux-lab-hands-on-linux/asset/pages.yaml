  md: '# C Appendix: YUM Repository Server


    # About YUM


    YUM or Yellowdog Updater Modified is an interactive, automated update program
    which can be used for maintaining system using rpm. Yum is an automatic updater
    and package installer/remover for rpm systems. It automatically computes dependencies
    and figures out what things should occur to install packages. Yum makes it easier
    to maintain groups of machines without having to manually update each one using
    rpm.


    # About Repository


    A repository is a collection of list of rpm[s]. It contain various information
    regarding the rpm like its dependencies etc


    # Why to use Yum if I can install RPM using rpm command?


    Well if you want to install RPM you have to make sure that its dependencies are
    also installed. But this is not in the case of YUM you can simply install package
    with its dependencies. YUM take care of your all install things. Also update feature
    is not available in the rpm installation method but it is available in yum.


    # Key features of YUM


    +   - Multiple Repositories

    +   - Simple config file

    +   - Correct dependency calculation

    +   - Fast operation

    +   - rpm-consistent behavior

    +   - comps.xml group support, including multiple repository groups

    +   - Simple interface


    # Creating Your Own Repository from CD/DVD (Server Side Configuration)


    +   - Step#1: Perquisites

    +     - Linux Distribution CDs or DVD

    +     - Free space on Hard Disk ( Minimum 4.0 GB)'
