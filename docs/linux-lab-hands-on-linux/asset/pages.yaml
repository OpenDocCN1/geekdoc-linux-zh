    # Red Hat Package Manager


    Following are the two main characteristics of RPM:


    +   - RPM file: Comprised all the files essential to run a specific program, and
    the important scripts to carry out the installation on its own.

    +   - RPM tool: Carries out common management of all the RPM packages, which are
    installed on a particular host.


    +   - **Installing Software through Command Line Interface**


    The following points should be kept in mind while installing software through
    command line interface:


