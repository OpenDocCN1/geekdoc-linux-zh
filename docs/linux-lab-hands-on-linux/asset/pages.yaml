  md: '# 17 LAB: Apache Web Server


    **OBJECTIVES**


    1.  Installing and configuring Apache (httpd) Server

    2.  Understanding Virtual Hosting: Name-based and IP-based


    **REQUIREMENTS**


    P-IV class PC, 1-GB RAM, 80 GB HDD, NIC with FC6 or RHEL-5 and Linux Distribution
    CDs/DVD.


    **CONCEPT**


    A Web Server provides the ability to host websites or take advantage of web based
    applications. In the simplest terms it is a place where a website that can be
    viewed through the Internet browser resides. In Fedora 10 Linux, you learn about
    the Apache Web server which is one of the most popular Web servers on the Web
    right now and its benefit is that it is free. It also has a lot of features that
    make it very extensible and useful for many different types of Web sites. This
    Web server is used for personal Web pages up to enterprise level sites.


    The Apache server is a powerful, efficient, and extensible Web server. It uses
    httpd daemon, which is Apache Hyper Text Transfer Protocol (HTTP) server program.
    It is designed to be run as a standalone daemon process. Apache Web server supports
    virtual hosting on which you can host multiple website on single Apache server.


    FC-6 and RHEL-5 ships Apache with default configuration that is ready to meet
    most basic web-serving requirement.


    # Configuration Files at Server Side


    | Path | Description |

    | :--- | :--- |

    | /etc/httpd/conf/httpd.conf | Main server configuration file. |

    | /var/www/html/ | Web Server Document Directory |


    > DNS needs to correctly setup so that browser from client machine can access
    website on the Apache server by using URL.


    +   - **Steps to Install and Configure HTTP Server**

    +       Perform the following steps to install and configuring HTTP server:

    +       1.  Installing the Apache Package'
