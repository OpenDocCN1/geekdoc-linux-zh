- pgno: 272
  md: '# A  Appendix: Linux Firewalls


    +   - Aim:To convert a Linux server into:

    +     - A firewall while simultaneously being your home website''s mail, web and
    DNS server.

    +     - A router that will use NAT and port forwarding to both protect your home
    network and have another web server on your home network while sharing the public
    IP address of your firewall.


    Tools: Netfilter is a very important part of the linux kernel. It provides security,
    packet mangleing and manipulation. The iptables is a frontend of the netfilter,
    which "tells" the kernel what the user wants to do with the IP packets arriving
    into, passing through, or leaving the linux box.


    Netfilter has a few tables, each containing a default set of rules, which are
    called chains. The default table loaded in the kernel is the filter tables, which
    contains three chains: INPUT, FORWARD and OUTPUT.


    Another type of tables provided by netfilters are NAT and Mangle tables. Which
    are used for Naterwork address translation and changing the parameter in IP header
    of the packet.


    # Installation of Iptables Package


    Before you begin, you need to make sure that the iptables software RPM is installed.
    When searching for the RPMs, remember that the filename usually starts with the
    software package name by a version number, as in iptables-1.2.9-1.0.i386.rpm.


    ```

    ```

    [root@netmon tmp]#rpm -qa|grep iptables

    [root@netmon tmp]#rpm -qI iptables

    ```

    ```


    You can start, stop, and restart iptables after booting by using the commands:


    ```

    ```

    [root@netmon tmp]# service iptables start

    [root@netmon tmp]# service iptables stop

    [root@netmon tmp]# service iptables restart

    ```

    ```


    To get iptables configured to start at boot, use the chkconfig command:


    ```

    ```

    [root@netmon tmp]# chkconfig iptables on

    Iptables - Commands

    ```

    ```


    List the rules of chain -iptables -L CHAIN e.g iptables -L INPUT


    ```

    ```

    Create new chain - N chainname

    Flush a chain i.e delete all the rules - iptables -F

    append rules to chain - iptables -A

    delete a rule from a chain -iptables -D

    ```

    ```'
  merge: -1
  img_proc: true
