- pgno: 187
  md: '```

    auth_param basic credentialsttl 2 hours

    auth_param basic casesensitive off

    Also find out your ACL section and append/modify

    acl ncsa_users proxy_auth REQUIRED

    http_access allow ncsa_users

    ```


    Save and close the file.


    Where.


    +   auth_param basic program /usr/lib/squid/ncsa_auth /etc/squid/passwd : Specifies
    squid password file and helper program location


    +   auth_param basic children 5 : Contains the number of authenticator processes
    to spawn.


    +   auth_param basic realm Squid proxy-caching web server : Contains the part
    of the text the user will see when prompted their username and password


    +   auth_param basic credentialsttl 2 hours : Specifies how long squid assumes
    an externally validated username:password pair is valid for - in other words how
    often the helper program is called for that user with password prompt. It is set
    to 2 hours.


    +   auth_param basic casesensitive off : Specifies if usernames are case sensitive.
    It can be on or off only


    +   acl ncsa_users proxy_auth REQUIRED : Requires any authenticated user will
    match the ACL named ncsa_users


    +   http_access allow ncsa_users : Allows proxy access only if user is successfully
    authenticated.


    Type the following command to restart the Squid server.


    ```

    root@netmon tmp]#/etc/init.d/squid restart

    ```


    Let’s now learn to monitor the Squid proxy server.


    # Monitoring Squid proxy server


    # Logging


    Log files can be found in /var/log/squid


    See access log file /var/log/squid/access.log:


    +   [root@netmon tmp]#tail -f /var/log/squid/access.logAbove command will monitor
    all incoming request and log them to /var/log/squid/access.log file. Now if somebody
    accessing a website through browser, squid will log information.


    +   Tools: Various tools can be used to analyze these log files. One such tool
    is Webalizer. Webalizer gives useful statistics in with graphs. The following
    is a simple Webalizer example:


    ```

    [root@netmon tmp]#/usr/bin/webalizer -F squid /var/log/squid./access.log

    ```


    Webalizer will process the logfile and place the results in /var/lib/webalizer/.
    To view the results type:


    ```

    [root@netmon tmp]#mozilla /var/lib/webalizer/index.html

    ```'
