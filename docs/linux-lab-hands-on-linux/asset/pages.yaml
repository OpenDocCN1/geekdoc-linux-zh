  md: '# 20 LAB: Kernerl Services and Recompileation


    **OBJECTIVES**

    1. Understanding Kernel Concepts

    2. Understanding how to compile the kernel

    3. Patching the kernel

    4. Configuring the boot loader GRUB


    **REQUIREMENTS**

    P-IV class PCs with installed Fedora/RHEL, Linux distribution CDs/DVD.


    **CONCEPTS**

    The Linux kernel is the core of the Linux operating system. The Linux kernel is
    used by seriel of Unix-like operating systems. It is the first part of the operating
    system which is load into memory during booting (system startup), and it remains
    there until the session is expire, because its services are required to work with
    the Linux. GRUB is the default GNU boot loader, which comes with Linux. This boot
    loader resides on your system hard disk and start Linux when you start your PC.
    It is the first thing that appears after the booting of your computer.


    # Understanding Kernel Concepts


    +   ☐ Kernel types: Monolithic versus modular

    +   ☐ Reasons to build a new kernel

    +   ☐ Reasons not to build a new kernel


    A monolithic kernel is one in which support for all hardware, network protocols,
    and file systems is built within a single file.


    A modular kernel is the standard for most distributions, because they allow a
    kernel to run on wide variety of hardware.


    Systems with monolithic kernels may boot faster than the systems with modular
    kernels. It uses constant amount of memory (RAM).


    In modular kernels, modules are loaded on demand, so they are memory efficient.


    Following are the reasons to build a new kernel:


    +   ☐ To optimize as a router, not a host

    +   ☐ To reconfigure the page size to change the allocation of memory addresses
    between kernel and user space'
