- pgno: 65
  md: '+   u: Shows user name and process start time

    +   U: Shows processes being run by a specific user

    +   w: Shows processes associated with a specified tty device

    +   a-Group: Shows all processes belonging to a particular group

    +   T: Shows all processes associated with this terminal

    +   t: Shows processes belonging to a specific terminal

    +   C: Shows all process associated with a specific command


    # The kill Command


    The kill command is used on Linux and other Unix-like operating systems to terminate
    processes without having to log out or reboot (i.e., restart) the computer.


    Now, if you want to terminate, for example, the emacs process you need to look
    up the process identifier (PID) in the preceding listing (3216), and provide the
    following command:


    ```

    $ kill -9 3216

    ```


    The -9 ensures execution of the process for which you access the command..


    A convenient short cut to give the kill command is the Alt-Ctrl-Esc key combination,
    which allows you to simply click the application that you want to kill.


    # The killall Command


    The killall commandis used to kill process by name. killall sends a signal to
    all processes running any of the specified commands.


    let’s the user specify a process by name.


    For example, to kill all instances of Netscape, type the following command:


    +   - killall netscape


    You should remain careful while using the killall command. Let’s say you’re using
    instances of the Emacs editor, running to edit the file foo.txt and /etc/passwd.
    If you want to kill the instances of Emacs used to edit foo.txt. Both the instance
    of Emacs used to edit foo.txt and /etc/passwd will be terminated when you use
    the command kill emacs.


    Let’s summarize the main points of the Lab.


    # Summary


    In this Linux lab, you learned to various type of process in Linux and various
    commands used in the Linux to identify process identification number and till
    the process.'
