    # Controlling Modules Intelligently


    Many modules depend on other modules to be present. A database of module dependencies
    can be generated with depmod command. This command seldom needs to be run manually,
    because the default rc.sysinit script is configured to run the command at system
    boot. The modprobe command can be used to load kernel modules, with three improvement
    over insmod listed as follows:


    +   - modprobe loads any underlying modules required by a given module

    +   - modprobe consults /etc/conf.modules for default module parameters

    +   - modprobe can try list of modules, and when it loads a module successfully,
    it will cease trying other list


