  md: '# 262 ▶ Appendix A


    +   6. This is an expansion on the previous example:


    ```

    `iptables -A FORWARD -s 0/0 -i eth0 -d 172.16.1.58 -o eth1 -p TCP \

    -sport 1024:65535 -m multiport --dports 80,443 -j ACCEPT


    iptables -A FORWARD -d 0/0 -o eth0 -s 172.16.1.58 -i eth1 -p TCP \

    -m state --state ESTABLISHED -j ACCEPT`

    ```


    Here iptables is being configured to allow the firewall to accept TCP packets
    to be routed when they enter on interface eth0 from any IP address destined for
    IP address of 172.16.1.58 that is reachable via interface eth1. The source port
    is in the range 1024 to 65535 and the destination ports are port 80 (www/http)
    and 443 (https). The return packets from 172.16.1.58 are allowed to be accepted
    too. Instead of stating the source and destination ports, you can simply allow
    packets related to established connections using the -m state and --state ESTABLISHED
    options.


    # ■ Allowing DNS Access To Your Firewall


    ```

    `iptables -A OUTPUT -p udp -o eth0 --dport 53 -sport 1024:65535 \

    -j ACCEPT


    iptables -A INPUT -p udp -i eth0 --sport 53 --dport 1024:65535 \

    -j ACCEPT`

    ```


    # ■ Allowing WWW And SSH Access To Your Firewall


    ```

    `iptables -A OUTPUT -o eth0 -m state --state ESTABLISHED,RELATED \

    -j ACCEPT


    iptables -A INPUT -p tcp -i eth0 --dport 22 --sport 1024:65535 \

    -m state --state NEW -j ACCEPT


    iptables -A INPUT -p tcp -i eth0 --dport 80 --sport 1024:65535 \

    -m state --state NEW -j ACCEPT`

    ```


    # ■ Allowing Your Firewall To Access The Internet


    ```

    `iptables -A OUTPUT -j ACCEPT -m state \

    --state NEW,ESTABLISHED,RELATED -o eth0 -p tcp \

    -m multiport --dports 80,443 --sport 1024:65535


    iptables -A INPUT -j ACCEPT -m state --state ESTABLISHED,RELATED \

    -i eth0 -p tcp`

    ```


    # ■ Allow Your Home Network To Access The Firewall


    In this example, eth1 is directly connected to a home network using IP addresses
    from the 172.16.1.0 network. All traffic between this network and the firewall
    is simplistically assumed to be trusted and allowed.


    Further rules will be needed for the interface connected to the Internet to allow
    only specific ports, types of connections and possibly even remote servers to
    have access to your firewall and home network.


    ```

    `iptables -A INPUT -j ACCEPT -p all -s 172.16.1.0/24 -i eth1

    iptables -A OUTPUT -j ACCEPT -p all -d 172.16.1.0/24 -o eth1`

    ```'
