  md: "# 16 LAB: Netwrokt File System Protocot (NFS)\n\n**OBJECTIVES** To install\
    \ and configure NFS protocol server and client.\n\n**REQUIREMENTS** P-IV class\
    \ PC with Fedora/RHEL and Linux distribution CD/DVD.\n\n**CONCEPT** NFS is a distributed\
    \ filesystem. An NFS server has one or more files systems that are mounted by\
    \ NFS clients. NFS file systems are mounted using the standard UNIX mount command.\
    \ All Unix utilities work just as well with NFS-mounted files as they do with\
    \ files on local disks.\nNFS stands for Netwrokt File System and it is the standard\
    \ method to share files between the Linux and Unix-like systems. The systems administrator\
    \ has to define the directories that need to be activated or exported for access\
    \ by the NFS clients on the NFS server. In addition, it defines both the NFS server\
    \ and the subset of its exported directories on the clients.\n\n# ## Important\
    \ NFS Daemons\n\nThe NFS server requires the following specific daemons and utilities:\n\
    \n+   portmap: Refers to the primary daemon on which all the others rely. It manages\
    \ connections for applications that use the RPC specification. By default, portmap\
    \ listens to TCP port 111 on which an initial connection is made. This is then\
    \ used to negotiate a range of TCP ports, usually above port 1024, to be used\
    \ for subsequent data transfers. You need to run portmap on both the NFS server\
    \ and client.\n+   \n+    nfs: Starts the RPC processes needed to serve shared\
    \ NFS file systems. The nfs daemon is run on the NFS server only.\n+   \n+   \
    \ nfslock: Allows the NFS clients to lock files on the server via RPC processes.\
    \ The nfslock daemon needs to be run on both the NFS server and client.\n+   \n\
    +    netfs: Allows RPC processes run on NFS clients to mount NFS file systems.\
    \ The netfs daemon is run on the NFS client only.\n\n# ### Steps to Install and\
    \ Configure NFS Server/Client\n\nPerform the following NFS steps to install and\
    \ configure NFS server/client:\n1. Installing nfs\n\nRed Hat Linux installs nfs\
    \ by default and it also gets activated by default when the system boots. Run\
    \ the following commands to check whether the nfs related packages are installed\
    \ or not."
  merge: -1
  img_proc: true
