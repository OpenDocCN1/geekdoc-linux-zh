    # ## TCP/IP Configuration Addresses


    The following are the different addresses used in TCP/IP configuration:


    +   - **Host address**: Represents the IP address of your system; it has a network
    part to identify the network you are on and a host part to identify your own system.

    +   - **Network address**: Represents the IP address of your network.

    +   - **Broadcast address**: Represents the IP address for sending messages to
    all hosts on your network at once.

    +   - **Gateway address**: Represents the IP address of your gateway system, if
    you have one (usually the network part of your host IP address with the host part
    set to 1).

    +   - **Domain name server addresses**: Represents the IP addresses of domain
    name servers your network uses.

    +   - **Netmask**: Determines the network and host parts of your IP address.


    Interface Configuration


    # ## Configuring NIC''s IP Address


    When we have many computers on a network, you need way to identify each one uniquely.
    In TCP/IP networking, the address assigned to each computer is known as IP address.
    IP address is the logical address used to communicate with people, computers,
    and devices and gather information. IP address is used to send and receive information
    from one host to another through a physical medium such as, cable on the network.
    An IP address is a unique 32 bit logically assigned binary number of four octets,
    which is represented in dotted decimal notation, designated to a particular device.
    Hosts and routers (a device used to determine the destination of a data packet)
    used in the TCP/IP protocol suite are identified by the IP address. The IP address
    is also divided into classes and each class has its specific range. The IP address
    consists of two parts, which are as follows:


    +   - **Network ID**: Identifies the network to which the host is connected. Network
    ID is the same for all the hosts on a particular network.

    +   - **Host ID**: Identifies the host on the network. Host ID is different for
    different hosts on the network.


    **Table 1 : Division of IP Addresses**


    | IP Address   | Network ID | Host ID |

    |:-------------|:-----------|:--------|

    | 193.168.75.38 | 193.168.75 | 38      |

    | 130.11.45.90 | 130.11     | 45.90   |

    | 125.25.210.12 | 125        | 25.21.12|'
  merge: -1
  img_proc: true
- pgno: 119
  md: "Each pair of numbers written in decimal notation in an IP address is called\
    \ an octet. In the example **192.168.75.38** 192 is the first octet, 168 is the\
    \ second octet, 75 is the third octet, and 38 is the fourth octet. The following\
    \ are the rules regarding the identification of IP address:\n\n+   An IP address\
    \ cannot be duplicated  \n+   All Host bits cannot be set to zero  \n+   All Host\
    \ bits cannot be set to one  \n+   **127** cannot be taken as the first octet\
    \ because it is reserved as a loopback address (address that acts as a test mechanism\
    \ for network devices and protocols).\n\nAn IP address is used as an ID to communicate\
    \ on the network, similar to a student who requires an ID to get access to the\
    \ services in the university. It is a basic protocol to get connected to the network.\
    \ Generally, an IP address is assigned to the Network Interface Card (NIC) rather\
    \ to the device (computer). An IP address may be either permanent or temporary\
    \ for a particular device. The following are the two types of IP addresses:\n\n\
    +   **Dynamic IP address**: Refers to the IP address assigned to the devices that\
    \ requires temporary connectivity to the network or devices communicating through\
    \ the network for a short period. Dynamic IP address uses DHCP (Dynamic Host Configuration\
    \ Protocol) for assigning the IP address.  \n+   **Static IP address**: Refers\
    \ to the IP address assigned to a device that requires permanent connectivity\
    \ on the network. Static IP address is the semi-permanent IP address.\n\nYou have\
    \ learned about IP addresses, in this section. Now let’s discuss about the classification\
    \ of IP addresses.\n\n# Classification of IP Addresses\n\nAs already discussed,\
    \ IP address specifies a unique ID to access the network. It defines IP addresses\
    \ into five types of classes: A, B, C, D, and E. The first four bits of an IP\
    \ address determines the class into which an IP address fits.\n\nThe following\
    \ list shows the various IP address classes as per the variation of the first,\
    \ second, third or fourth bit of an IP address:\n\n+   If the first bit is zero,\
    \ the IP address belongs to Class A address.  \n+   If the first bit is one and\
    \ if second bit is zero, the IP address belongs to Class B address.  \n+   If\
    \ the first two bits are one and if the third bit is zero, the IP address belongs\
    \ to Class C address.  \n+   If the first three bits are one and if the fourth\
    \ bit is zero, the IP address belongs to Class D address.  \n+   If all the four\
    \ bits are one, the IP address belongs to Class E address.\n\nThe following table\
    \ shows the classification of IP addresses:\n\n**Table 2: Types of IP Addresses**\n\
    | Class | Network ID | Host ID |\n| :--- | :--- | :--- |\n| A | 0 (7 bits) | 24\
    \ bits |\n| B | 10 (14 (bits)) | 16 bits |\n| C | 110 (21 bits) | 8 bits |"
  merge: -1
  img_proc: true
- pgno: 120
  md: "| | | |\n|---|---|---|\n| D | 1110 | Multicast |\n| E | 11110 | Future use\
