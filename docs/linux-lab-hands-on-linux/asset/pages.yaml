- pgno: 85
  md: "```\n`[root@netmon tmp]# init 0`\n```\n\nFedora also has a shutdown command,\
    \ which can be used to the same effect. It often prompts you as to whether you\
    \ are sure you want to execute the command, which can be avoided with the -y switch.\
    \ The -h switch forces the system to halt, and the first argument tells it how\
    \ long to wait before starting the procedure, in this case 0 minutes. You can\
    \ also specify shutting down at a specific time of the day; please refer to the\
    \ man pages for details. Another advantage of the shutdown command is that it\
    \ warns people that the shutdown is going to occur:\n\n```\n``` \n[root@netmon\
    \ tmp]# shutdown -hy 0 \n  Broadcast message from root (pts/0) \n  ----- \nThe\
    \ system is going down for system halt NOW! \n[root@netmon tmp]# ```\n```\n\n\
    # ## Rebooting the System\n\nUse the following commands to reboot the system:\n\
    \n+   - shutdown -r\n+   - reboot\n+   - init 6\n\nYou can also use the following\
    \ init command to reboot the system immediately by entering runlevel 6:\n\n```\n\
    `[root@netmon tmp]# init 6`\n```\n\nThe following reboot command has the same\
    \ effect, but it also sends a warning message to all users:\n\n```\n`[root@netmon\
    \ tmp]# reboot`\n```\n\nBroadcast message from root (pts/0) is shown as follows:\n\
    \n```\n``` \n  The system is going down for reboot NOW! \n  [root@netmon tmp]#\
    \ ```\n```\n\nMore graceful reboots can be done with the shutdown command by using\
    \ the -r switch and specifying a delay, which, in this case, is 10 minutes:\n\n\
    ```\n``` \n[root@netmon root]# shutdown -ry 10 \n  Broadcast message from root\
    \ (pts/0) : \n  The system is going DOWN for reboot in 10 minutes! \n  Broadcast\
    \ message from root (pts/0) : ```\n```"
  merge: -1
  img_proc: true
- pgno: 86
  md: "```\nThe system is going DOWN for reboot in 9 minutes!  \n…  \nBroadcast message\
    \ from root (pts/0):  \nThe system is going down for reboot NOW!\n```\n\n# ##\
    \ Entering Single-user Mode\n\nSome activities require you to force the system\
    \ to log off all users, third-party applications, and networking so that only\
    \ the systems administrator has access to the system from the VGA console. Another\
    \ reason is the recovery of your root password.\n\n# ## Switching to Single-user\
    \ Mode\n\nWhen the system is running normally, this can be done by using the init\
    \ command to enter runlevel 1. It is best to do this from the console, because\
    \ if you do it from a remote terminal session you’ll be logged out:\n\n```\n[root@netmon\
    \ root]# init 1  \n…  \n[root@netmon tmp]# shutdown 1  \nBroadcast message from\
    \ root (pts/0):  \n \n  \nThe system is going DOWN to maintenance mode in 1 minute!\
    \  \nBroadcast message from root (pts/0):  \n \n  \nThe system is going down to\
    \ maintenance mode NOW!\n```\n\n# ## Entering Single-user Mode at the Grub Splash\
    \ Screen\n\nYou can enter single-user mode directly after turning on the power\
    \ to your system:\n\n+   1. Power on your system.\n\n+   2. When the Linux logo\
    \ screen appears, the one which allows you to select the various installed kernels\
    \ on the system, type the letter a for “append.” You will get a prompt like this\
    \ to add boot options to the boot string found in your grub.conf file: grub append>\
    \ ro root=LABEL=/\n\n+   3. Add a 1 to the end of the string:\n\n```\ngrub append>\
    \ ro root=LABEL=/ 1\n```\n\n+   4. Press enter. The system will continue to boot,\
    \ but will go straight to the root # prompt without first asking for a username\
    \ and password.\n\n# ## Reverting to Your Default runlevel from Single-user Mode\n\
    \nThe exit command forces the system to exit runlevel 1 and revert to the default\
    \ runlevel for the system. You can also use the init command (for example, init\
    \ 3 and init 5) to alter this default behavior:"
  merge: -1
  img_proc: true
