    # ■ Steps to Install and configure DNS Server/Client


    # ♦ Client Side


    +   1. Edit /etc/resolv.conf

    +   nameserver {ip address of DNS server}


    For example, nameserver 172.16.20.1


    Table 1 is displaying keywords of /etc/resolv.conf


    | Keywords in /etc/resolv.conf | Value |

    | :--- | :--- |

    | nameserver | IP address of your DNS name server. There should be only one entry
    per nameserver keyword. If there is more than one name server, use multiple nameserver
    lines |

    | Domain | The local domain name to be used by default. If the server is netmon.split.ac.in,
    then the entry would just be split.ac.in. |

    | Search | If you refer to another server just by its name without the domain
    added on, DNS on your client appends the server name to each domain in this list
    and does a DNS lookup on each to get the remote server''s IP address. This is
    a time-saving feature, enabling you to refer to servers in the same domain by
    only their server name without having to specify the domain. The domains in this
    list must be separated by spaces. |



