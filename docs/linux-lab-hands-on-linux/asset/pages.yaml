- pgno: 71
  md: '# Understanding Process Scheduling


    Process scheduling is the core of the Linux operating system. The process scheduler
    has the following responsibilities:


    +   Allows processes to create new copies of the process which are save in the
    memory.

    +   Determines which process will have access to the CPU and effect the transfer
    between running processes

    +   Receives interrupts and route them to the appropriate kernel subsystem

    +   Sends signals to user processes

    +   Manages the timer hardware

    +   Cleans up process resources when a processes finishes executing


    The process scheduler also provides support for dynamically loaded modules. These
    modules represent kernel functionality that can be loaded after the kernel starts
    executing. This loadable module functionality is used by the virtual file system
    and the network interface.

    Let''s summarize the main points of the Linux lab regarding memory management.


    # Summary


    In this lab, you learned about the virtual memory. Then, you explored about different
    types of caches. You also learned the concept of page allocation and de-allocation.
    In addition, you learned the concepts such as, memory mapping and managing memory.
    You get aquaint with demand paging. In the end, you also learned process scheduling.'
  merge: -1
