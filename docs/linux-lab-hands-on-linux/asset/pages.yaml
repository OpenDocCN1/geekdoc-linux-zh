    \  1. P-IV class PC\n+   2. You can run Scilab using a variety of OS\n\n# CONCEPT\n\
    \nSCILAB is freely distributed and open source scientific software used to develop\
    \ engineering and scientific applications. It is based on a numerical, programming,\
    \ and graphics environment. SCILAB performs the same function like other environments\
    \ such as, numerical, programming, and graphics environment but these environments\
    \ are different syntactical wise. SCILAB is currently being used in educational\
    \ and industrial environments around the world.\n\nScilab includes hundreds of\
    \ mathematical functions with the possibility to add interactive programs from\
    \ various languages, such as C and Portran. It has sophisticated data structures\
    \ including lists, polynomials, rational functions, and linear systems, an interpreter,\
    \ and a high level programming language.\n\n# Installing SCILAB\n\n**Step#1: Check\
    \ for the requirements to install Scilab are as follows:**\n\n- for the source\
    \ version: Requires approximately 130Mb of disk storage to unpack and install\
    \ (all sources included). You need X Window (X11R4, X11R5 or X11R6, C compiler\
    \ and Fortran compiler (e.g. f2c or g77 or Visual C++ for Windows systems).\n\
    - for the binary version: Requires the minimum memory for running SCILAB (without\
    \ sources) of 40 Mb when decompressed. These versions are partially statically\
    \ linked and in principle do not require a fortran compiler.\n\n**Step#2: Install\
