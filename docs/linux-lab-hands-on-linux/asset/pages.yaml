- pgno: 244
  md: '# 24 LAB: Java Programming in Linux


    # OBJECTIVES


    Creating Java Program


    # REQUIREMENTS


    You require the following prerequisites to write a Java program:


    +   1. The Java 2, Platform, Standard Edition (J2SE), formerly known as the Java
    Development Kit (JDK).

    +       Download the Linux version. Ensure you download the SDK, not the JRE (the
    JRE is included in the SDK/J2SE).


    +   2. A text editor

    +       In Linux, you can use various editors such as Vi, Emacs, Pico, nano to
    write a Java program. In this lab, we use the nano editor.


    # CONCEPTS


    Java is an operating system independent platform for software development. It
    consists of a programming language, utility programs, and run time environment.
    A Java program can be developed on one computer and run on any other computer
    with the correct run time environment. In general, older Java programs can run
    on newer run time environments. Java has gained popularity with the development
    of the Internet because when you program for the Web using Java, it is not necessary
    for you to know the operating system that is installed in user''s system. With
    the Java programming language, you can take advantage of the "Write once, run
    anywhere" paradigm. This implies that when you compile your Java program, you
    need not to generate instructions for one specific platform. Instead, you need
    to generate Java byte code, which means instructions for the Java Virtual Machine
    (Java VM). It does not matter what platform the users use if Java VM is installed
    on their systems as Java VM understand byte codes.


    # Types of Java Programs


    +   * **Applet:** Refers to a Java program that is designed to be embedded on
    a web page. An applet cannot run without a Web browser.


    +   * **Servlet:** Refers to a Java program that is designed to be run on a server.
    A servlet cannot run without a Web server.


    +   * **Java application:** Refers to a Java program that can run itself.

    +   You can use the following instructions to program a Java application on a
    Linux platform.'
  merge: -1
  img_proc: true
- pgno: 245
  md: "# Creating Your First Java Program\n\nLet's perform the following steps to\
    \ create a Java program that accepts two numbers and then compute print the result:\n\
    \n+   1. Create a Java source file.\n+   2. Compile the source file into a byte\
    \ code file.\n+   3. Run the program contained in the byte code file\n\nLet's\
    \ now learn how to create, compile, and run a Java program.\n\n# Create a Java\
    \ Source File\n\nA source file contains text written in the Java programming language.\
    \ You can use any text editor to create and edit source files.\n\n+   1. Bring\
    \ up a shell (sometimes called terminal) window.\n\nWhen the prompt first appears,\
    \ your current directory is usually your home directory. You can change your current\
    \ directory to your home directory at any time by typing `cd` at the prompt and\
    \ then pressing enter.\n\nThe Java files you create should be kept in a separate\
    \ directory. You can create a directory by using the command `mkdir`. For example,\
    \ to create the directory `java` in your home directory, you first need to change\
    \ your current directory to your home directory by entering the following command:\n\
    \n```\n```\ncd\n```\n```\n\nThen, you need to enter the following command:\n\n\
    ```\n```\nmkdir java\n```\n```\n\nYou need to enter the following command to change\
    \ your current directory to this new directory:\n\n```\n```\n% cd java\n```\n\
    ```\n\nNow, you can start creating your source file.\n\n+   2. Start an editor\
    \ (nano in our case) by typing the name of the editor at the prompt and then press\
    \ enter. at the prompt and pressing enter.\n+   \n+      When an editor is started,\
    \ it displays a new blank buffer where you need to type your code.\n\n+   3. Type\
    \ the Java code.\n\n+   4. Save the code by typing Ctrl-O in the editor. You can\
    \ specify the desired file name (in our case, we have specified `simple.java`)\
    \ preceded by the directory in which you want the file to save. If you wish to\
    \ save `sample.java` in the directory `/home/Mahendra/java`, then you would type:\n\
    \n```\n```\n/home/Mahendra/java/sample.java and press enter.\n```\n```\n\n+  \
    \ 5. Type Ctrl-X to exit nano."
  merge: -1
  img_proc: true
- pgno: 246
  md: '# Compile the Source File


    The Java compiler, Javac, compiles the source file and translates its text into
    instructions that the Java Virtual Machine (Java VM) can understand. The compiler
    then stores these instructions into a byte code file.


    +   1. Now, bring up another shell window. Change your current directory to the
    directory where your file is located to compile your source file. For example,
    if your source directory is /home/Mahendra/java, you would type the following
    command at the prompt and press return

    +      `cd /home/smith/java`


    If you enter pwd at the prompt, you see the current directory, which in this example
    has been changed to /home/smith/java.


    If you enter ls at the prompt, you see your file: sample.java.


    +   1. Type the following command and then press Return to compile your file:

    +      `javac sample.java`


    After compiling if you see the following error message:


    ```

    javac: Command not found

    ```


    Then, it means Linux is not able to find the Java compiler, Javac.


    +   1. You can locate the javac compiler in Linux by typing the path where you
    have installed the Java 2 Platform Suppose: you have installed the Java 2 Platform
    (J2SE) in /usr/java/jdk1.4. In this case, you can type the following command at
    the prompt and press Return:

    +      `/usr/java/jdk1.4/javac sample.java`


    The compiler now has generated a Java byte code file, sample.class.


    +   1. At the prompt, type ls to verify the new file is there.


    # Run the Program


    The Java VM is implemented by a Java interpreter called java. This interpreter
    translates the byte codes into instructions that can be understood by your computer.


    +   1. In the same directory, enter at the prompt:

    +      `java sample`


    When you run the program you need to enter two numbers when the black command
    line window appears. The program should then write out those two numbers plus
    the percentage computed by the program.


    If you receive the following error message:


    +   Exception in thread "main" java.lang.NoClassDefFoundError:sample

    +   Then it means, Java cannot find your byte code file, sample.class.'
  merge: -1
  img_proc: true
