    \ specifies the IP addresses of the DNS servers and the search domain. Unless\
    \ configured to do otherwise, the network initialization scripts populate this\
    \ file.\n\n# /etc/sysconfig/network\n\nThis file specifies routing and host information\
    \ for all network interfaces. For more information about this file and the directives\
