  md: "```\n```bash\n$ y=${x#*inet_addr:}\n```\n```\n\nBut, while gobbling text from\
    \ the left, this search would stop at the IP address of eth0, not the desired\
    \ interface. So I can specify it this way:\n\n```\n```bash\n$ y=${x#*lo *inet_addr:}\n\
    ```\n```\n\nAs a last step I'll trim off all remaining text to the right:\n\n\
    ```\n```bash\n$ y=${y%% *}\n```\n```\n\n# ## Leaving only the Desired Address\n\
    \nIt seems that the *#* and *%* operators and their variants are able to accept\
    \ a rather complex argument and sort through the content of large strings, including\
    \ strings with line breaks. This means I can use the shell to directly filter\
    \ content in some simple cases where I might have considered using sed or Perl.\n\
    \n# ## Bash Version 3\n\nI have always thought the inability to test for the presence\
    \ of a string or pattern (without using grep, sed or something similar) was a\
    \ conspicuous weakness in shell programming. Bash version 3, present on most current\
    \ Linux distributions, addresses this lack by allowing regular expression matching.\n\
    \nLet's say we need to establish whether variable $x appears to be a social security\
    \ number:\n\n```\n```bash\nif [[ $x =~ [0-9]{3}-[0-9]{2}-[0-9]{4} ]]\nthen\n\t\
    # process SSN\nelse\n\t# print error message\nfi\n```\n```\n\nNotice the Perlish\
    \ *\"=~\"* syntax and that the regular expression appears within *double brackets.*\
    \ A substantial number of regular expression metacharacters are supported, but\
    \ not some of the Perl-specific extensions like \\w, \\d and \\s. Another Bash\
    \ 3 feature is an improved brace expansion operator:\n\n```\n```bash\n$ echo {a..z}\n\
    a b c d e f g h i j k l m n o p q r s t u v w x y z\nfor n in {0..5}\ndo\n\techo\
    \ $n\ndone\n0\n1\n2\n3\n4\n5\n```\n```"
