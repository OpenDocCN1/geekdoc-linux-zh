  md: '# ## D Appendix: TCL Examples Scripts


    # ### Stop-n-wait Protocol TCL Script


    The stop-n-wait" (sometimes known as "positive acknowledgement with retransmission")
    is the fundamental technique to provide reliable transfer under unreliable packet
    delivery system. After transmitting one packet, the sender waits for an acknowledgment
    (ACK) from the receiver before transmitting the next one. In this way, the sender
    can recognize that the previous packet is transmitted successfully and we could
    say "stop-n-wait" guarantees reliable transfer between nodes.


    ```

    # stop and wait protocol in normal situation

    # features : labeling, annotation, nam-graph, and window size monitoring

    set ns [new Simulator]

    set n0 [$ns node]

    set n1 [$ns node]

    $ns at 0.0 "$n0 label Sender"

    $ns at 0.0 "$n1 label Receiver"

    set nf [open AI-stop-n-wait.nam w]

