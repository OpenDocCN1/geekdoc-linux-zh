  md: "# # Appendix: SELinux Security Policies and Context\n\nSecurity Enhanced Linux\
    \ (SELinux) enhancements developed by the US Federal National Security Agency\
    \ (NSA) are included with Fedora Core beginning with version 3 and Red Hat Enterprise\
    \ Linux version 4. The fine-grained access control architecture is supported in\
    \ the Linux kernel. Both “type” enforcement and Role Based Access Control (RBAC)\
    \ are supported. System processes and files (including socket descriptors, IPCs,\
    \ devices) are each assigned a collection of security attributes known as a security\
    \ context.\nSecurity Goals:\n- Protect the system from the users\n- Protect the\
    \ users from each other\n- Protect the files from scripts/programs\nThe following\
    \ RPM packages comprise SELinux:\n- selinux-policy-strict\n- selinux-policy-strict-sources:\
    \ Configuration files\n- selinux-policy-targeted\n- selinux-policy-targeted-sources:\
    \ Configuration files\n- libselinux: Library which provides a set of interfaces\
    \ for security-aware applications to get and set process and file security contexts.\n\
    - selinux-doc\nConfiguration file: `/etc/selinux/config`\n\n```\n```\n# This file\
    \ controls the state of SELinux on the system.\n# SELINUX= can take one of these\
    \ three values:\n#\t\tenforcing - SELinux security policy is enforced.\n#\t\t\
    permissive - SELinux prints warnings instead of enforcing.\n#\t\tdisabled - SELinux\
    \ is fully disabled.\nSELINUX=enforcing\n# SELINUXTYPE= type of policy in use.\
    \ Possible values are:\n#\t\ttargeted - Only targeted network daemons are protected.\n\
    #\t\tstrict - Full SELinux protection.\nSELINUXTYPE=targeted\n```\n```\n\nOne\
    \ may turn off the SELinux features by setting: `SELINUX=disabled` (Requires reboot\
    \ to read new configuration.)\nDirect setting of enforcement:\n- Enforce:\n  \
    \  - Use command: `setenforce 1` (Alter SELinux enforcement while kernel is running.)\n\
    \    - OR\n    - `echo 1 > /selinux/enforce`"
