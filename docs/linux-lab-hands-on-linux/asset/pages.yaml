  md: "# Filtering Specifications layer 2 and layer 3 Match Criteria\n\n| iptables\
    \ command Switch | Description |\n| :--- | :--- |\n| -t <table> | If you don't\
    \ specify a table, then the filter table is assumed. As discussed before, the\
    \ possible built-in tables include: filter, nat, mangle |\n| -j <target> | Jump\
    \ to the specified target chain when the packet matches the current rule. |\n\
    | -A | Append rule to end of a chain |\n| -F | Flush. Deletes all the rules in\
    \ the selected table |\n| -p <protocol-type> | Match protocol. Types include,\
    \ icmp, tcp, udp, and all |\n| -s <ip-address> | Match source IP address (Filtering\
    \ Specification Layer3) |\n| -d <ip-address> | Match destination IP address (Filtering\
    \ Specification Layer3) |\n| -i <interface-name> | Match \"input\" interface on\
    \ which the packet enters. (Filtering Specification Layer 2) |\n| -o <interface-name>\
    \ | Match \"output\" interface on which the packet exits (Filtering Specification\
    \ Layer 2) |\n\n+   1. In this command switches example\n+   \n+      iptables\
    \ -A INPUT -s 0/0 -i eth0 -d 172.16.1.1 -p TCP -j ACCEPT\n\niptables is being\
    \ configured to allow the firewall to accept TCP packets coming in on interface\
    \ eth0 from any IP address destined for the firewall's IP address of 172.16.1.1.\
    \ The 0/0 representation of an IP address means any.\n\n# Filtering Specifications\
    \ Layer 4 Match Criteria\n\n| Switch | Description |\n| :--- | :--- |\n| -p tcp\
    \ --sport <port> | TCP source port. Can be a single value or a range in the format:\
    \ start-port-number:end-port-number |\n| -p tcp --dport <port> | TCP destination\
    \ port. Can be a single value or a range in the format: start-port-number:end-port-number\
    \ |\n| -p tcp --syn | Used to identify a new TCP connection request. ! --syn means,\
    \ not a new connection request |\n| -p udp --sport <port> | UDP source port. Can\
    \ be a single value or a range in the format: start-port-number:end-port-number\
    \ |\n| -p udp --dport <port> | UDP destination port. Can be a single value or\
    \ a range in the format: start-port-number:end-port-number |\n\n+   2. In this\
    \ example:\n+   \n+      iptables -A FORWARD -s 0/0 -i eth0 -d 192.168.1.58 -o\
    \ eth1 -p TCP \\\n+         --sport 1024:65535 --dport 80 -j ACCEPT\n\niptables\
    \ is being configured to allow the firewall to accept TCP packets for routing\
    \ when they enter on interface eth0 from any IP address and are destined for an\
    \ IP address of 192.168.1.58 that is reachable via interface eth1. The source\
    \ port is in the range 1024 to 65535 and the destination port is port 80 (www/http)."
