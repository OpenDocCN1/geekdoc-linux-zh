    2.6.26-10

    2.6.26.x even-numbered minor-versions imply that the kernel is a part of the stable
    development branch.

    2.3.x odd-numbered minor versions imply that the kernel is development.


    # Kernel RPMs


    +   kernel-version.i386.rpm: Represents the precompiled kernel and modules

    +   kernel-source-version.i386.rpm: Represents the kernel source (less headers
