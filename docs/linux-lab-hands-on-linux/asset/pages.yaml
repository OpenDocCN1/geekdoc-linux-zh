- pgno: 36
  md: '# 02

    LAB: Advanced Linux Installation (Network and Dual-Boot)


    OBJECTIVES


    +   1.  Learn to set a Linux installed server.

    +   2.  Learn to install Linux over the network from image Server.

    +   3.  Learn to install network on your Linux operating system.

    +   4.  Learn about Dual-Booting Linux.


    REQUIREMENTS


    +   1.  Two Standard PCs with Intel or compatible Configuration

    +   2.  Linux Distributions (Fedora Core/RHEL) CDs or a DVD OR

    +   3.  CD- ISO images (typically 4 to 5) or single DVD- ISO image of Linux Distribution


    CONCEPT


    During the network based installation of a Linux operating system we need to understand
    the TCP/IP configuration of our system as we can be asked for IP and network addresses.
    You can input the IP address and netmask of device either manually or through
    a Dynamic Host Configuration Protocol (DHCP). You can also add the address of
    Default gateway and primary name server. Basic process outline in this lab are
    as follows.


    +   1.  Our the network installation is a client Server Architectcre.

    +   2.  We are creating the server where we store Linux distribution Directories
    (For HTTP and FTP) and Linux ISO images (for NFS)

    +   3.  Then we configure client by providing topological correct IP address so
    that it can access installation images on server and then install Linux on its
    own machine.


    # **Setting up an Installation Image Server**


    If you have a LAN connection from your computer to a computer which has a CD/DVD-ROM
    drive and about 4 GB of disk space and it offers NFS, FTP, or Web services (http),
    you can install Linux from that server.


    For setting up a Linux Installation Image server, you need to create an Installation
    directory (Distribution) where installation images are stored and need to configure
    different server services so that it allows to share installation images. Our
    machine act as a client, it will connect to the installation Image server and
    access that share to install Linux in its own machine..'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'First of all, let''s perform the following steps to create an installation
    image Server:


    +   1.  Setting up FTP and HTTP Server as Installation Image Server

    +       Creating Installation Directory (Distribution)for FTP and HTTP Server:

    +   2.  Because there are three or more CDs in the Linux distribution (Red Hat
    and Fedora). You must install all the contents of available CDs in the same directory
    structure on the server''s hard disk.


    ```

    # mkdir /tmp/rh

    # mount /mnt/cdrom                                  With first CD inserted

    # cp -r /mnt/cdrom/* /tmp/rh/

    # umount /mnt/cdrom; eject /mnt/cdrom

    # mount /mnt/cdrom                                    With second CD inserted

    # cp -r /mnt/cdrom/* /tmp/rh/

    # umount /mnt/cdrom; eject /mnt/cdrom

    # mount /mnt/cdrom                                    With third CD inserted

    # cp -r /mnt/cdrom/* /tmp/rh/

    # umount /mnt/cdrom; eject /mnt/cdrom

    ```


    Just type y when it asks to overwrite some files. The distribution directory must
    contain at least RPMS and base directories, which must include all necessary software
    packages.


    After creating an installation directory, now let''s configure different servers
    required to set up the Linux install image server.


    # ## Setting up NFS as Installation Image Server


    # ■  Creating ISO images


    Create ISO images of the installation CDs, and place them in the /distro/fc6 directory
    as discussed below. This requires about 4GB space as well. You can download the
    ISO images from the Fedora Web site or use the Fedora CDs. If you create the ISO
    files from the given CDs, they must have the same file names as the ones you can
    download from the Fedora Web site.


    ```

    Create a directory distro for Linux distribution under / directory.

    [root@netmon tmp]# mkdir /distro

    [root@netmon tmp]# mkdir /distro/fc6

    ```


    For the first CD, the code you need is:


    ```

    [root@netmon tmp]# cd /distro/fc6

    [root@netmon fc6]# dd if=/dev/cdrom of=FC6-i386-disc1.iso bs=32k

    ...

    [root@netmon fc6]# eject cdrom

    ```


    For the second CD, use:


    ```

