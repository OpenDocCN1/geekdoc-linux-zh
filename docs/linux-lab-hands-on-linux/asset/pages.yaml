    \ section of squid.conf\n#\nhttp_access allow our_network\n```\n\n# ## Squid proxy\
    \ authentication using ncsa_auth helper\n\nFor fine control you may need to use\
    \ Squid proxy server authentication. This will only allow authorized users to\
    \ use proxy server.\n\nYou need to use proxy_auth ACLs to configure ncsa_auth\
    \ module. Browsers send the user’s authentication in the Authorization request\
