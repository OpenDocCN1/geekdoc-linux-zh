    Let’s discuss how to manage rc scripts by hand and by using chkconfig.


    # Managing rc Scripts by Hand


    If you want to configure which services need to be started at boot time, you need
    to edit the rc scripts for the appropriate run level. If you ever need to restart
    a service that is started from an rc directory, you can run its startup script
    with the restart option. This procedure enables all the proper steps to be followed
    (configuration files read, lock files released, and so forth) when the service
    starts up again. So to restart syslog, for example, run the following command
    from the rc directory:


    ```

    ```

    [root@netmon rc3.d]# ./Sl2syslog restart

    Shutting down kernel logger: [  OK  ]

    Shutting

    Down system logger: [  OK  ]

    Starting system logger: [  OK  ]

    Starting kernel logger: [  OK  ]

    ```

    ```


    # Managing rc Scripts Using chkconfig


    Red Hat Linux has a useful tool called chkconfig that helps the system administrator
    manage rc scripts and xinetd configuration files without manipulating them directly.
    It is inspired by the chkconfig command included in the IRIX operating system.


    Type chkconfig --list to see all the services chkconfig knows about, and whether
    they are stopped or started in each runlevel. An abridged example output is shown
    in the following'
