- pgno: 157
  md: "# Time to Live Value\n\nThe very first entry in the zone file is usually the\
    \ zone's time to live (TTL) value. Caching DNS servers cache the responses to\
    \ their queries from authoritative DNS servers. The authoritative servers not\
    \ only provide the DNS answer but also provide the information's time to live,\
    \ which is the period for which it's valid.\n\nThe purpose of a TTL is to reduce\
    \ the number of DNS queries the authoritative DNS server has to answer. If the\
    \ TTL is set to three days, then caching servers use the original stored response\
    \ for three days before making the query again.\n\n# DNS Resource Records\n\n\
    The rest of the records in a zone file are usually BIND resource records. They\
    \ define the nature of the DNS information in your zone files that's presented\
    \ to querying DNS clients. They all have the general format:\n\n# Name Class Type\
    \ Data\n\nThere are different types of records for mail (MX), forward lookups\
    \ (A), reverse lookups (PTR), aliases (CNAME), and overall zone definitions, Start\
    \ of Authority (SOA). The data portion is formatted according to the record type\
    \ and may consist of several values separated by spaces. Similarly, the name is\
    \ also subject to interpretation based on this factor.\n\n# The SOA Record\n\n\
    The first resource record is the Start of Authority (SOA) record, which contains\
    \ general administrative and control information about the domain. It has the\
    \ format:\n\n```\nName Class Type Name-Server Email-Address Serial-No Refresh\
    \ Retry Expiry Minimum-TTL\n\n@     IN    SOA ns1.split.ac.in.  hostmaster.split.ac.in.\
    \ ( \n                              2004100801 ; serial #\n                  \
    \            4H         ; refresh\n                              1H         ;\
    \ retry\n                              1w         ; expiry\n                 \
    \             1d  )      ; minimum\n```\n\n> In the above figure Name - @, Class\
    \ – IN (Internet Class) Type-SOA, Name-Server – ns1.split.ac.in., email-Address-hostmaster.split.ac.in.,\
    \ Serial No-2004100801, Refresh-4H, retry-1W, Minimum –TTL-1D\n\n# Troubleshooting\
    \ Bind\n\nOne of the most common culprits of BIND problems is incorrectly located\
    \ in chroot files. If you have the BIND chroot package installed, make sure that\
    \ the configuration files are located in the chroot directory.\n\nFollowing is\
    \ a quick list of errors that indicate your files may not be located correctly.\n\
    \n+   - The named daemon starts without loading any zone files. Here is a sample\
    \ of the /var/log/messages file that shows that named doesn't load them:\n\n```\n\
    Nov  9 17:35:41 netmon named[1211]: starting BIND 9.2.3 -u named -t\n/var/named/chroot\n\
    Nov  9 17:35:41 netmon named[1211]: using 1 CPU\nNov  9 17:35:41 netmon named[1211]:\
    \ loading configuration from\n```"
  merge: -1
  img_proc: true
