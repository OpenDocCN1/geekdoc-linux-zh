- pgno: 16
  md: '# Linux Installation


    according to the requirement can choose from the various distribution packages
    to be installed alongwith installation of Linux operating system. Some of the
    commonly used distribution packages are:


    +   □  Fedora:  Provides you with the graphical interface and configuration tools.  Fedora
    is used for general-purpose distribution. It is a distribution package that is
    suitable for both server as well as desktop applications.

    +   □  Knoppix:  Provides you with efficient compression mechanism and automatic
    hardware detection. One of the advantages of Knoppix is that it is a live-CD distribution
    (refers to distribution package that can be run directly from a CD and does not
    require a hard drive for its installation).

    +   □  Mandriva:  Uses a RPM based package management alongwith a urpmi tool and
    configuration tools.

    +   □  Suse:  Refers to a distribution package that is used for desktop installations.
    Suse consists of configuration tool such as, YaST and is a stable distribution
    package.

    +   □  Debian:  Refers to a non-commercial project that is based on Open-Source
    philosophy. Debian provides three branches: Stable (refers to latest release),
    Unstable (refers to branch that is in perpetual evolution), and Testing (represents
    the next release to be).

    +   □  Ubuntu:  Refers to a distribution package based on Unstable branch of Debian
    distribution. Features of Ubuntu distribution of Linux includes fast release cycle,
    up to date and numerous packages, fast download mirrors, great documentation.


    Linux installation involves a number of steps. Red Hat/Fedora Core supports several
    methods to install Linux. You can install Linux from local and network or Internet
    sources. The examples of local sources are CD-ROM and hard disk and the examples
    of network or Internet sources are Red Hat/FC support NFS, FTP, and HTTP installations.


    # Learning about Hardware Requirements


    The minimum hardware requirements to install a standard Linux on an Intel-based
    PC are as follows:


    +   □  A 32-bit Intel-based or Pentium-class personal computer.

    +   □  A CD-ROM or DVD-ROM drive (if you are using the DVD-ROM).

    +   □  The standard installation of basic software packages normally takes 3GB
    of hard disk space, plus 256MB to 512 MB for swap space, depending on the amount
    of RAM memory you have.


    +   1.  Recommended/Suggested Hardware Setup: Standard P-IV class PC, with 1GB
    RAM, and 80 GB HDD with NIC. (for Dual/Multi Boot Systems and Virtualization)

    +   2.  It should be kept in mind that Linux can run on far less on a minimum
    installation (as little as 100MB and 16MB swap).

    +   3.  You can install Linux on i386 Intel, Apple Macintosh and 64bit AMD processors.
    For that download the i386 images for 32 Intel Processors; PPC images for Apple
    Macintosh and x86_64 for 64 bit AMD Processors.'
  merge: -1
  img_proc: true
