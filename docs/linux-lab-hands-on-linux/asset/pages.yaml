- pgno: 74
  md: '# 07 | LAB: Linux Startup and Shutdown


    +   1. Understanding the Boot Process

    +   2. Exploring the Boot Sequence

    +   3. Dealing with Runlevels and Initialization Process

    +   4. Exploring the SysV Start Scripts

    +   5. Managing Runlevels Services

    +   6. Shutting down the System and Rebooting


    REQUIREMENTS: P4 class PC, 1-GB RAM, 80 GB HDD, NIC, with installed FC6 or RHEL-5.


    The process by which a computer is turned on and the Linux/UNIX operating system
    starts functioning is called booting. It consists of the following steps:


    +   - Finding the kernel of the operating system. How this is achieved is usually
    particular to the type of hardware used by the computer.

    +   - Starting the kernel operation and particularly looking for all the hardware
    devices that are connected to the machine.

    +   - Starting the processes that include a number of steps to configure various
    services necessary for the system to work.


    # Exploring Boot Sequence


    The following are the boot sequence...


    +   - Basic Input/Output System (BIOS) Initialization

    +   - Master Boot Recorder (MBR) Boot Loader

    +   - Kernel Initialization

    +   - init Initialization


    Let’s discuss these sequences in the following sections.


    +   - BIOS Initialization


    +   - Peripherals detected

    +   - Boot device selected

    +   - First Sector of boot device read and executed'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# # BIOS-Starting the Boot Process


    BIOS is the interface between the hardware and the software on a very basic level.
    BIOS provides the basic set of instructions used by the operating system. A successful
    boot depends on the BIOS, which provides the lowest level of interface to peripheral
    device and controls. BIOS first runs a power on self-test (POST), and then it
    looks for peripherals and a device to boot from. The hardware configuration information
    is permanently stored in a small area (usually 64 bytes) of Complementary Metal
    Oxide Semiconductor (CMOS). CMOS is powered by small battery located in your motherboard.
    This battery allows CMOS to retain its settings even when the computer is turned
    off and disconnect from power.


    At the end of POST, a boot device is selected from the list of detected boot devices.
    Any modern BIOS will allow you to set the desired order of preference for the
    boot device from a list. Boot devices can include: the floppy drive, hard drive,
    CD-ROM, network interface, Zip drive or other removable media.


    The BIOS reads and executes the first physical sector of the chosen boot media
    on the system. Usually this is contained in the first 512 bytes of the HD.


    +   - MBR


    When allocating disk space for the partitions, the first sector, or data unit,
    for each partition is always reserved for programmable code used in booting. The
    very first sector of the hard disk is reserved for the same purpose and is called
    the **master boot record (MBR)**. When booting from a hard disk, the PC system
    BIOS loads and executes the boot loader code in the MBR. The MBR then needs to
    know which partitions on the disk have boot loader code specific to their operating
    systems in their boot sectors and then attempts to boot one of them.


    +   - GRUB Linux Boot Loader


    Fedora/Red Hat Linux is supplied with the GRUB boot loader; therefore, it cannot
    entirely fit in the 512 bytes of the MBR. The GRUB MBR boot loader merely searches
    for a special **boot partition** and loads a **second stage boot loader**. The
    second stage boot loader then reads the data in the /boot/grub/grub.conf configuration
    file, which lists all the available operating systems and their booting parameters.
    When data reading from the grub.conf file is complete, the second stage boot loader
    then displays the familiar Fedora branded splash screen that lists all the configured
    operating system kernels for your choice. Grub is versatile boot loader and can
    be configured to support booting into many different operating systems, such as
    Windows and FreeBSD.


    The grub.conf file for a system that can boot both Fedora Linux and Windows XP
    is given as follows:


    ```

    default=0

    timeout=10

    splashimage=(hd0,0)/grub/splash.xpm.gz

    title Fedora Core (2.6.8-20)

    root (hd0,0)

    kernel /vmlinuz-2.6.8-20 ro root=LABEL=/

    initrd /initrd-2.6.8-20.img

    title Windows XP

    rootnoverify (hd0,1)

    chainloader +1

    ```'
  merge: -1
  img_proc: true
- pgno: 76
  md: "# ## Kernel Initialization\n\nVarious functions performed by the kernel at\
    \ the time of booting are listed as follows:\n\n+   - Device detection\n+   -\
    \ Device driver initialization\n+   - Mount root filesystem read only\n+   - Loads\
    \ initial process (usually *init*)\n\n# ### Examining kernel Initialization\n\n\
    Although, they generate good output, much of the kernel initialization activities\
    \ take place so quickly that if you do not watch carefully during boot, you may\
    \ miss them. A good way to “freeze time” and examine this output is to view /var/log/dmesg\
    \ , which contains a snapshot of these kernel messages taken after control is\
    \ passed to *init*. Review of this output will reveal the basic initialization\
    \ steps of the Linux kernel:\n\nDevice drivers compiled into the kernel are called,\
    \ and will attempt to locate their corresponding devices. If successful in locating\
    \ the device, the driver will initialize and usually log output to the kernel\
    \ message buffer.\n\nIf essential (needed for boot) drivers have been compiled\
    \ as modules instead of into the kernel, then they must be included in an *initrd*\
    \ image, which is then temporarily mounted by the kernel on a RAM disk to make\
    \ modules available for the initialization process.\n\nAfter all the essentials\
    \ drivers are loaded, the kernel will mount the root filesystem read-only.\n\n\
    The first process is then loaded (usually *init*) and control passed from the\
    \ kernel to init process.\n\n# ## init Initialization\n\nVarious tasks performed\
    \ by the init process are listed as follows:\n\n+   - init reads its config :\
    \ /etc/inittab\n+     - initial run-level\n+     - system initialization scripts\n\
    +     - run-level specific script directories\n+     - trap certain key sequences\n\
    +     - define UPS power fail/restore scripts\n+     - spawm gettys on virtual\
    \ consoles\n+     - initialize X in run-level 5\n\ninit is the parent of all processes.\
    \ This is easily shown by running the *pstree* command\n\n```\n```\n[root @netmon\
    \ opt]#pstree\ninit+---apmd\n  |-atd\n  |-automount\n  |-crond---crond\n  |-gdm---X\n\
    ```\n\n```"
  merge: -1
  img_proc: true
- pgno: 77
  md: 'Since *init* is the first process, it will always have a PID of number 1.


    The file */etc/inittab* contains the information on how *init* should set up the
    system in every run-level. If a the*/etc/inittab* file is missing or seriously
    corrupt, you will not able to boot any of the standard run-levels (0-6) and will
    need to use single or emergency mode instead.


    The /sbin/init program does some system checks, such as verifying the integrity
    of the file systems, and starts vital programs needed for the operating system
    to function properly. It then inspects the */etc/inittab* file to determine Linux’s
    overall mode of operation or runlevel. Table 1 lists valid runlevels:


    Table 1: Showing Linux Runlevels

    | Mode/Runlevel | Directory | Runlevel Description |

    | --- | --- | --- |

    | 0 | /etc/rc.d/rc0.d | Halt |

    | 1 | /etc/rc.d/rc1.d | Single-user mode |

    | 2 | /etc/rc.d/rc2.d | Not used (user-definable) |

    | 3 | /etc/rc.d/rc3.d | Full multiuser mode (no GUI interface) |

    | 4 | /etc/rc.d/rc4.d | Not used (user-definable) |

    | 5 | /etc/rc.d/rc5.d | Full multiuser mode (with GUI interface) |

    | 6 | /etc/rc.d/rc6.d | Reboot |


    Based on the selected runlevel, the init process executes the startup scripts
    located in subdirectories of the */etc/rc.d* directory. Scripts used for runlevels
    0 to 6 are located in subdirectories */etc/rc.d/rc0.d* through */etc/rc.d/rc6.d*,
    respectively.


    The following is a directory listing of the scripts in the */etc/rc.d/rc3.d* directory:


    ```

    [root@netmon tmp]# ls /etc/rc.d/rc3.d

    K051nnd k20rwhod k50xinetd k74ypserv

    K921pysadm S60lpd

    K08wmare K25squid K54pxe K74yxprfd K92upsd S83iscsi

    K09junkbuster K28am K55routed K75gated K961rda S90crond

    K10fontcastie k30mserv K61ldap K75nets K95kudzu S90xfs

    K121msqld

    K30sendmi K65ident K846ppd S06reconfig S91atalik

    K15gpm K34yppasswd K65kadmin k84ospsf6d S081ptabless95anacon

    K15httpl k35sm K65procpspr K84ospsd S10network S97rhnsd

    K15postgresql S35vncserver K65krp524 k84ripd s12syslog S991local

    K16varpd K40lms-4nvk K65krp5kdc K84riprnd S17keytabIe S93local

    K20bootparam K45arpwatch K73xpybind k85zebra

    S20random S99wine

    K2Onfs k45nand K74app k86fnflock S28autofs

    K20restart k46radvd K74nsd K87portmp S40atd

    K20rusersd k50smnd K74ntpd K911sdsn S55sshd

    K20rwatld k50tux K74nps K921pchans S56rawdevices

    [root@netmon opt]#ls /etc/rc.d/rc3.d/

    ```


    The S scripts are started in this order until they have all been started. When
    the system shuts down, the corresponding K, or kill scripts are run to shut down
    the services started from the rc directory. In general, every S script should
    have a corresponding K script to kill the service at shutdown. If you can''t find
    the corresponding K script in the startup directory, it is'
