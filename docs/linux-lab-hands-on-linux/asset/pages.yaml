  md: '![](img/f3b9cff79e19317416c12eaf5ded7245_20_0.png)


    # General Description of Naming Disks and Devices


    Linux treats a device as a file in the /dev directory, where the hard disk names
    start with /dev.


    Table 1 lists the device name for hard disk and floppy drive names


    Table 1: Hard Disk and Floppy Drive Names


    | Name | Description |

    | :--- | :--- |

    | /dev/hda | First Integrated Drive Electronics (IDE) hard drive (the C: drive
    in DOS and Windows) connected to the first IDE controller as the master drive.
    |

    | /dev/hdb | Second (IDE) hard drive connected to the first IDE controller as
    the slave drive. |

    | /dev/hdc | First (IDE) hard drive connected to the second IDE controller as
    the master drive. |

    | /dev/hdd | Second (IDE) hard drive connected to the second IDE controller as
    the slave drive. |

    | /dev/sda | First Small Computer System Interface (SCSI) drive and SATA. |

    | /dev/sdb | Second SCSI drive. |

    | /dev/fd0 | First floppy drive (the A: drive in DOS). |

    | /dev/fd1 | Second floppy drive (the B: drive in DOS). |


    # Mounting a File System on a Device


    In Linux, you use a physical disk partition by associating it with a specific
    part of the file system. This arrangement is a hierarchical directory, which is
    also known as directory tree. If you have more than one disk partition, you can
    use all of them in Linux under a single'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'directory tree. All you have to do is to decide which part of the Linux directory
    tree should be located on each partition. This process is known as mounting a
    file system on a device (disk partition is a device) in Linux.


    The term mount point refers to the directory you associate with a disk partition
    or any other device.


    # ■ Understanding the Swap Partition


    Most advanced operating systems support the concept of virtual memory, where your
    system’s hard disk functions as an extension of the physical memory (RAM). It
    is called as swap space. When the operating system runs out of physical memory,
    it can move (or swap out) the contents of currently unneeded parts of RAM to swap
    partition in hard disk to make room for a program that needs more memory. When
    the operating system needs to access any thing in the swapped out data, it has
    to find something else to swap out and then it swaps in the required data from
    disk. This process of swapping data back and forth between the RAM and the disk
    is also known as paging.


    As you know that the disk is much slower than RAM, the system’s performance is
    slower when it performs a lot of paging. However, virtual memory enables you to
    run programs that you otherwise cannot run. Linux supports virtual memory and
    can make use of a swap partition. When you create the Linux partitions, you should
    also create a swap partition.


    You can easily create a swap partition by using the Disk Druid utility program,
    described in the next section.


    # ■ Preparing Disk Partitions for Linux


    It is important to note that minimum two partitions need to be created for Linux
    installations which are as follows:


    +   □ The First Partition is / (root partition). Minimum size of the root partition
    varies from 2GB to 8GB depends on installation of software packages.


    +   □ The Second Partition is SWAP partition (virtual drive), recommended size
    of this partition is twice of RAM size or 1 GB whichever more.


    We can have /boot, /var, and /home as separate partitions.


    As shown in figure 5, disk druid displays partition information in the following
    fields


    +   □ Mount Point: Indicates the directory where the partition is mounted. For
    example, if you have only one partition for the entire Linux file system, the
    mount point is the root directory (/). For the swap partition, this field shows
    <Swap> . If this field appears as <not set >, you have to specify a mount point,
    which you can do by selecting the partition and clicking the Edit button.


    +   □ Device: Refers to the partition’s device name. For example, hda1 is the
    first partition on the first IDE drive.


    +   □ Requested field: Shows how much space the partition has. For example, if
    the partition has 256MB of space, this field appears as 256M.


    +   □ Actual field: Shows the amount of disk space the partition is using. Usually,
    the Requested and Actual fields are the same, but they may differ for partitions
    that can grow in size.


    +   □ Type field: Shows the partition’s type, such as Linux Native or DOS. If
    there are no partitions defined, the table in the Partitions list is empty. You
    have to add new partitions'
  merge: -1
  img_proc: true
