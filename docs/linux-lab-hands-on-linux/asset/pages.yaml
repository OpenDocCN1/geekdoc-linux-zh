- pgno: 68
  md: '# 06 LAB: Memory Management


    # OBJECTIVES


    +   1.  Understanding Virtual Memory

    +   2.  Exploring Caches

    +   3.  Understanding Page Allocation and Deallocation

    +   4.  Understanding Memory Mapping

    +   5.  Managing Memory

    +   6.  Understanding Demand Paging

    +   7.  Understanding Process Scheduling


    # REQUIREMENTS


    The Computer must be installed with Linux operating system (Any distribution such
    as Fedora or Rhat).


    # CONCEPT


    The memory management subsystem is one of the most important parts of the operating
    system. Since the early days of computing, there has been a need for more memory
    than exists physically in a system. Strategies have been developed to overcome
    this limitation and the most successful of these is virtual memory. Virtual memory
    makes the system appear to have more memory than it actually has by sharing it
    between competing processes as they need it.


    Let''s now learn about the virtual memory in detail:


    # Understanding Virtual Memory


    Linux supports virtual memory that is, using a disk as an extension of RAM so
    that the effective size of usable memory grows correspondingly. The kernel will
    write the contents of a currently unused block of memory to the hard disk so that
    the memory can be used for another purpose. When the original contents are needed
    again they are read back into memory. This is all made completely transparent
    to the user; programs running under Linux only see the larger amount of memory
    available and don''t notice that parts of them reside on the disk from time to
    time. Of course reading and writing the hard disk is slower (on the order of a
    thousand times slower) than using real memory so the programs don''t run as fast.
    The part of the hard disk that is used as virtual memory is called the swap space.
    Let''s learn about the caches concept.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# **Exploring Caches**


    If you were to implement a system using the above theoretical model then it would
    work, but not particularly efficiently. Both operating system and processor designers
    try hard to extract more performance from the system. Apart from making the processors,
    memory and so on faster the best approach is to maintain caches of useful information
    and data that make some operations faster. Linux uses a number of memory management
    related caches:


    # **Buffer Cache**


    The buffer cache contains data buffers that are used by the block device drivers.
    These buffers are of fixed sizes (for example 512 bytes) and contain blocks of
    information that have either been read from a block device or are being written
    to it. A block device is one that can only be accessed by reading and writing
    fixed sized blocks of data. All hard disks are block devices. The buffer cache
    is indexed via the device identifier and the desired block number and is used
    to quickly find a block of data. Block devices are only ever accessed via the
    buffer cache. If data can be found in the buffer cache then it does not need to
    be read from the physical block device, for example a hard disk, and access to
    it is much faster.


    # **Page Cache**


    This is used to speed up access to images and data on disk. It is used to cache
    the logical contents of a file a page at a time and is accessed via the file and
    offset within the file. As pages are read into memory from disk, they are cached
    in the page cache.


    # **Swap Cache**


    Swap files stores only the modified pages regarding the files executed by the
    user. If these pages are not modified after they have been written to the swap
    file then the next time the page is swapped out there is no need to write it to
    the swap file as the page is already in the swap file. Instead the page can simply
    be discarded. In a heavily swapping system this saves many unnecessary and costly
    disk operations


    Let’s now learn about page allocation and de-allocation.


    # **Understanding Page Allocation and De-allocation**


    There are many demands on the physical pages in the system. For example, when
    an image is loaded into memory the operating system needs to allocate pages. These
    will be free when the image has finished executing and is unloaded. Another use
    for physical pages is to hold kernel specific data structures such as the page
    tables themselves. The mechanisms and data structures used for page allocation
    and de-allocation are perhaps the most critical in maintaining the efficiency
    of the virtual memory subsystem.


    # **Understanding Memory mapping**


    Memory mapping refers to a process of linking an executing image file with processes
    of virtual address space. During this process, executable images are not brought
    directly into physical memory of the processes. The parts of the program are referenced
    by the running application, the image is brought into memory from the executable
    image. Memory mapping can be of different types. One such type is kernel virtual
    mapping provides a direct 1 to 1'
  merge: -1
  img_proc: true
