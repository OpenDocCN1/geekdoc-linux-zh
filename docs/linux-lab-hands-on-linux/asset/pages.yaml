    # Running TCL Scripts in NS 2


    NS 2 is a discrete event simulator written in C++, with an OTCL interpreter shell
    as the user interface that allows the input model files (TCL scripts) to be executed.
    Most network elements in NS 2 simulator are developed as classes, in object-oriented
    fashion. The simulator supports a class hierarchy in C++, and a very similar class
    hierarchy in OTCL. NS 2 provides substantial support for simulation of TCP, routing
    algorithms, queuing algorithms, and multicast protocols over wired and wireless
    (local and satellite) networks. It is freely distributed, and its source code
    is also available for free. Following command is used to run the "tcl" script
    in NS-2:


