- pgno: 238
  md: "Please study this example carefully, and refer to the reference materials in\
    \ **Useful Links** to understand some of the methods.\n\n# ## Creating and Using\
    \ Arrays\n\n+   Shell arrays are relatively easy to construct. Example:\n\n```\n\
    ```\narray=(red green blue yellow magenta)\nlen=${#array[*]}\necho \"The array\
    \ has $len members. They are:\"\ni=0\nwhile [ $i -lt $len ]; do\n    echo \"$i:\
    \ ${array[$i]}\"\n    let i++\ndone\n```\n```\n\nRun this example:\n\n```\n```\n\
    $ ./myscript.sh\nThe array has 5 members. They are:\n0: red\n1: green\n2: blue\n\
    3: yellow\n4: magenta\n```\n```\n\nYou can replace one line of the script and\
    \ run it again to view the different output.\n\n```\n```\narray=(\\`ls\\`)\n```\n\
    ```\n\nSee what difference this makes (and think of all kinds of lists you might\
    \ create for this line).\n\n# ### Strings and Substrings\n\n+   It is useful to\
    \ take strings apart and put them together in different ways. Here is how to select\
    \ a substring from a string:\n\n```\n```\nstring=\"this is a substring test\"\n\
    substring=${string:10:9}\n```\n```\n\nIn this example, the *variable* \"substring\"\
    \ contains the *word* \"substring\". Remember this rule:\n\n```\n```\nsubstring=${string_variable_name:starting_position:length}\n\
    ```\n```\n\nThe string starting position is zero-based.\n\nSearching and Replacing\
    \ Substrings within Strings\n\n+   In this method, you can replace one or more\
    \ instances of a string with another string. The following is the basic syntax:\n\
    \n```\n```\nalpha=\"This is a test string in which the word `test\" is replaced.\"\
    \nbeta=\"${alpha/test/replace}\"\n```\n```"
  merge: -1
  img_proc: true
- pgno: 239
  md: "The string \"beta\" now contains an edited version of the original string in\
    \ which the first case of the word \"test\" has been replaced by \"replace\".\
    \ To replace all cases, not just the first, use this syntax:\n\n```\nbeta=\"${alpha//test/replace}\"\
    \n```\n\nNote the double \"/\" symbol.\n\nHere is an example in which we replace\
    \ one string with another in a multi-line block of text:\n\n```\nlist=\"cricket\
    \ frog cat dog\"\npoem=\"I wanna be a x\\\\\nA x is what I'd love to be\\\\\n\
    If I became a x\\\\\nHow happy I would be.\\n\"\nfor critter in $list; do\n  \
    \  echo -e ${poem//x/$critter}\ndone\n```\n\nRun this example:\n\n```\n$ ./myscript.sh\n\
    I wanna be a cricket\nA cricket is what I'd love to be\nIf I became a cricket\n\
    How happy I would be.\nI wanna be a frog\nA frog is what I'd love to be\nIf I\
    \ became a frog\nHow happy I would be.\nI wanna be a cat\nA cat is what I'd love\
    \ to be\nIf I became a cat\nHow happy I would be.\nI wanna be a dog\nA dog is\
    \ what I'd love to be\nIf I became a dog\nHow happy I would be.\n```\n\nSilly\
    \ example, huh? It should be obvious that this search & replace capability could\
    \ have many more useful purposes.\n\n# **Some Useful String Operations**\n\nHere\
