  md: '+   3.  iptables -A OUTPUT -p icmp --icmp-type echo-request -j ACCEPT


    ```

    ```code

    iptables -A INPUT -p icmp --icmp-type echo-reply -j ACCEPT

    ```

    ```


    iptables is being configured to allow the firewall to send ICMP echo-requests
    (pings) and in turn, accept the expected ICMP echo-replies.


    +   4.  Consider another example


    ```

    ```code

    iptables -A INPUT -p icmp --icmp-type echo-request \\

    -m limit --limit 1/s -i eth0 -j ACCEPT

    ```

    ```


    The limit feature in iptables specifies the maximum average number of matches
    to allow per second. You can specify time intervals in the format /second, /minute,
    /hour, or /day, or you can use abbreviations so that 3/second is the same as 3/s.


    In this example, ICMP echo requests are restricted to no more than one per second.
    When tuned correctly, this feature allows you to filter unusually high volumes
    of traffic that characterize denial of service (DOS) attacks and Internet worms.


    ```

    ```code

    iptables -A INPUT -p tcp --syn -m limit --limit 5/s -i eth0 -j ACCEPT

    ```

    ```


    You can expand on the limit feature of iptables to reduce your vulnerability to
    certain types of denial of service attack. Here a defense for SYN flood attacks
    was created by limiting the acceptance of TCP segments with the SYN bit set to
    no more than five per second.


    # Common Extended Match Criteria


    | Switch | Description |

    | :--- | :--- |

    | -m multiport --sports <port, port> | A variety of TCP/UDP source ports separated
    by commas. Unlike when -m isn''t used, they do not have to be within a range.
    |

    | -m multiport --dports <port, port> | A variety of TCP/UDP destination ports
    separated by commas. Unlike when -m isn''t used, they do not have to be within
    a range. |

    | -m multiport --ports <port, port> | A variety of TCP/UDP ports separated by
    commas. Source and destination ports are assumed to be the same and they do not
    have to be within a range. |

    | -m --state <state> | The most frequently tested states are:


    ESTABLISHED: The packet is part of a connection that has seen packets in both
    directions


    NEW: The packet is the start of a new connection


    RELATED: The packet is starting a new secondary connection. This is a common feature
    of such protocols such as an FTP data transfer, or an ICMP error.


    INVALID: The packet couldn''t be identified. Could be due to insufficient system
    resources, or ICMP errors that don''t match an existing data flow. |'
  merge: -1
