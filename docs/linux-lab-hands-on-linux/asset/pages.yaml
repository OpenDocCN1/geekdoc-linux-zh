    Let''s summarize the main points of the Lab.


    # ## Summary


    The squid is an Internet proxy server used within a network to distribute an internet
    connection to all the computers within the network. One central computer is connected
    to the internet through any means (WAN technology), runs squid, and thus acts
    as the firewall to the internet. Because it is a proxy, it has the capabilities
    to log all user actions such as the URLs visited. Many features can be configured
    in squid.'
