- pgno: 284
  md: 'result will back off for certain duration, resulting in collision detection.
    This protocol solves the hidden terminal problem, even though two sender nodes
    may be out of range of each other, but they both are in the range of the receiver
    they want to send the data packets to. Hence, when receiver responds to one node
    with a CTS packet, it will be heard by the other sender node too and it will defer
    transmission. In our animation, we have 3 nodes 0, 1, 2.


    We see how the nodes behave in the following 3 cases:


    +   ▶ Case 1: (No Contention) ------- Only one node (Node 2) sends data and therefore
    there is no contention


    +   ▶ Case 2: (BACKOFF DUE TO RTS)


    Both sender nodes, nodes 0 and 2 are in range of each other, but node 1 is out
    of range of node 2. When node 2 wants to send data to node 0 and node 0 wants
    to send data to node 1. In this case, both nodes 0 and 2 do carrier sense. Node
    0 then sends RTS packet to nodes 1 and 2. Node 2 backs off after hearing this
    RTS packet. Node 1 sends a CTS to Node 0 and Node 0 performs its data transmission,
    at the end of which, node 2 again does a carrier sense and performs its data transmission,
    finding the medium free.


    +   ▶ Case 3: (BACKOFF AGAIN DUE TO RTS)


    Both sender nodes 0 and 2 are in range of each other and in range of node 1. So,
    they can all hear each other''s RTS and CTS packets. In this case, when node 2
    wants to send data to node 1 at the same time that node 0 wants to send data to
    node 1, node 2 hears the RTS from node 0 and backs off, thus deferring its transmission
    till node 0 finishes its transmission and hence avoiding collision at the receiver.


    +   ▶ Case 4: BACKOFF DUE TO CTS


    Both sender nodes 0 and 2 are out of range of each other but are in range of node
    1, the receiver. In this case, nodes are not able to hear each other''s RTS packets,
    but are able to hear CTS packet from the receiver and hence backs off, deferring
    transmission till the other node finishes transmission.


