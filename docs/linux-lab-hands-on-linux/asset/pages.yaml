    After configuring MySQL server, let''s now learn how to work with MySQL database.


    # Working with MySQL Databases


    # Creating a Database with MySQL


    Within an interactive mysql session, you can create and modify databases and tables.
    If you are not already connected to a mysql session, type the following command
    (assuming the mysql user name of root):


    ```

    [root@netmon opt] #mysql -u root -p

    Enter password: ******

    mysql>

    ```


    The general steps for creating a MySQL database include creating the database
    name, identifying the new database as the current database, creating tables, and
    adding data to the tables are as follows:


    +   1. For creating a new database name, use the CREATE DATABASE command at the
    mysql> prompt. For example, to create a database named allusers, type the following
    command:


    ```

    mysql> CREATE DATABASE allusers;

    ```


    This action creates a database called allusers in the /var/lib/mysql directory.'
