    # ### Learning Installation Methods


    The following installation methods are available:


    +   - **CD-ROM**: Installing from a set of installation CDs is the most direct
    method. Insert the media into the system, make sure the BIOS is configured to
    boot from the CD.

    +   - **Hard Drive**: Installing from the hard drive requires the ISO images of
    the installation CDs to be on a hard drive partition accessible by the installation
    program (formatted as ext2, ext3, or vfat). It also requires a boot CD created
    from the boot.iso image that is found on the first installation CD.

    +   - **Network Install (via NFS, FTP, or HTTP)**: This method also requires a
    boot CD created from the boot.iso image or PXE boot. After booting, select a preferred
    network installation method, such as NFS, FTP, or HTTP. The installation source
    must be available to the system using the selected network protocol.

    +   - **Kickstart**: Kickstart is the name of the Red Hat scripted installation
    method. A kickstartformatted script is written, the installation program is started
    with a boot CD or via PXE and then given the location of the kickstart file.


    # ### Starting the Linux Installation


    You can start your installation from a bootable CD/DVD-ROM of Linux distribution.
    Make sure your BIOS is set to boot from the CD-ROM as a first boot device.


    +   1. PC is booted with first Linux CD and you will get installation screen as
