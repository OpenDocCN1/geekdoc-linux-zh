- pgno: 142
  md: "# 13 | LAB: File Transfer Protocool (FTP) Server\n\n**OBJECTIVES**  \nTo configure\
    \ Linux FTP server (public FTP and private FTP) using the FTP (VSFTPD) daemon,\
    \ which is very secure.\n\n**REQUIREMENTS**  \nP-IV class PC, 1-GB RAM, 80 GB\
    \ HDD, NIC, with FC6 or RHEL-5 and Linux installed.\n\n**CONCEPT**  \nThe File\
    \ Transfer Protocool (FTP) is an established protocol to copy files between servers\
    \ over the Internet.\n\nIn FC-6 or RHEL-5, you can use the FTP program as it is\
    \ designed to be secure, stable, fast, and scalable.\n\nFTP relies on a pair of\
    \ TCP ports. It operates using two TCP ports 20 and 21. Port 21 is known as control\
    \ port. All commands and the response of the FTP server, go over the control port.\
    \ Port 20 is known as data port that is used for all subsequent data transfers\
    \ between the client and server.\n\nThe FTP server is used to download a file\
    \ from the server or upload a file to the server. It is a software application\
    \ that runs the File Transfer Protocool (FTP) and transfers files over the internet.\
    \ The FTP server is the secure way of sharing file with the help of a client-server\
    \ model. A popular, and very secure, FTP server available for almost all Linux\
    \ systems is vsftpd (Very Secure FTP). Installing and setting up vsftpd in a Linux\
    \ environment is a simple process.\n\nA FTP server attempts to authenticate users\
    \ that request to use it. You can configure your FTP server to accept requests\
    \ only from users who have an account on the system running the FTP server (User\
    \ Access FTP). Alternatively, you can configure the FTP server to accept requests\
    \ from anyone, with the help of service known as anonymous FTP.\n\n# Anonyomus\
    \ FTP\n\nAnonyomus FTP is the selection of Web sites that need to exchange files\
    \ with numerous unknown remote users. Users can log in as a user ftp or as a user\
    \ anonymous to get access to the ftp site. By default the root directory of anonymous\
    \ ftp server is set as /var/ftp/pub. It only allows download services to the anonymous\
    \ user by default.\n\n# User Access FTP\n\nUsers with account on the system can\
    \ connect via ftp and login by using their username and password. They can download\
    \ any file and also they can upload file to any directory on FTP server, provided\
    \ they will have write access to that directory"
  merge: -1
  img_proc: true
- pgno: 143
  md: '# Configuration Files of FTP Server (vsftpd daemon)


    The examples of configuration files are as follows:


    +   □ Package: vsftpd

    +   □ Daemon: /usr/sbin/vsftpd

    +   □ Script: /etc/init.d/vsftpd

    +   □ Configuration: /etc/vsftpd/vsftpd.conf, /etc/vsftpd.ftpusers, /etc/pam.d/vsftpd

    +   □ Log: /var/log/xferlog


    # Steps to Install and Configure the FTP Server


    Perform the following steps to install and configure the FTP server (vsftpd daemon):


    # Installing the VSVFTP Daemon


    Search for the file .rpm extension. (Check with Linux distribution CD or DVD).


    Type the following command to install the FTP server:


    ```

    -[root@netmon tmp]# rpm -ivh vsftpd-1.5.6-i386.rpm

    ```


    # Starting the VSVFTP Daemon


    Use the following commands to start, stop, and restart VSVFTP after booting:


    ```

    [root@netmon tmp]# service vsftpd start

    [root@netmon tmp]# service vsftpd stop

    [root@netmon tmp]# service vsftpd restart

    ```


    Use the following chkconfig command to start VSVFTP at boot time.


    ```

    [root@netmon tmp]# chkconfig --level 345 vsftpd on

    ```


    # Testing the Status of VSVFTP


    You can always test whether the VSVFTP process is running by using the netstat
    command, which lists all the TCP and UDP ports on which the server is listening
    for traffic. The succeeding example shows the following output:


    ```

    [root@netmon root]# netstat -a | grep ftp|grep tcp:21

    ```


    ![](img/f3b9cff79e19317416c12eaf5ded7245_143_0.png)


    ```

    [root@netmon root]#

    ```'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'File Transfer Protocol (FTP) Server


    # ■ Edit the vsftpd.conf file


    The vsftpd.conf file uses a number of default settings that you need to know:


    The configuration file is fairly straightforward as you can see in the code snippet:


    ```

    # Allow anonymous FTP?

    anonymous_enable=YES

    # Uncomment this to allow local users to log in. local_enable=YES

    # Uncomment this to enable any form of FTP write command.

    # (Needed even if you want local users to be able to upload files)

    write_enable=YES

    # Uncomment this to allow the anonymous FTP user to upload files. This only

    # has an effect if global write enable is activated. Also, you will

    # obviously need to create a directory writable by the FTP user.

    anon_upload_enable=YES

    # Uncomment this if you want the anonymous FTP user to be able to create

    # new directories.

    anon_mkdir_write_enable=YES

    # Activate logging of uploads/downloads. xferlog_enable=YES

    # You may override where the log file goes if you like.

    # The default is shown# below.

    xferlog_file=/var/log/vsftpd.log

    # The directory which vsftpd will try to change

    # into after an anonymous login. (Default = /var/ftp)

    anon_root=/data/directory

    ```


    To activate or deactivate a feature, remove or add the # at the beginning of the
    appropriate line. Descriptions on this and more can be found in the vsftpd.conf
    man (manual) pages.


    The following points explain the configuration of VSFTPD:


    +   - **VSFTPD runs as an anonymous FTP server:** By default Anonymous FTP Services
    is always on. You can set the configuration file''s anonymous_enable directive
    to no to disable this feature. You''ll also need to simultaneously enable local
    users to be able to log in by removing the comment symbol (#) before the local_enable
    instruction.


    +   - **VSFTPD allows only anonymous FTP downloads to remote users, not uploads
    from them:** You can change this by modifying the anon_upload_enable directive
    shown above.


    +   - **VSFTPD doesn''t allow anonymous users to create directories on your FTP
    server:** You can change this by modifying the anon_mkdir_write_enable directive.


    +   - **VSFTPD logs FTP access to the /var/log/vsftpd.log log file:** You can
    change this by modifying the xferlog_file directive.


    # ■ Change FTP Greeting Banner


    Change the default greeting banner in the vsftpd.conf file to make it harder for
    malicious users to determine the type of system you have. The directive in this
    file is:


    ```

    ftpd_banner= Welcome to S.P.I.T. FTP site

    ```'
  merge: -1
  img_proc: true
