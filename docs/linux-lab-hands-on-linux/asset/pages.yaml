- pgno: 14
  md: '# 01 | LAB: Linux Installation


    **OBJECTIVES**


    +   1. Learning about hardware requirements

    +   2. Learning installation methods

    +   3. Learning the pre-installation procedure

    +   4. Starting the installation

    +   5. Configuring Linux installation

    +   6. Selecting packages to install


    **REQUIREMENTS**


    +   1. A Standard PC (Intel or compatible) Configuration

    +   2. Linux distributions (Fedora Core/RHEL) CDs or a DVDs

    +   3. ISO images CD (typically 4 to 5) or single ISO DVD image of Linux Distribution.


    **CONCEPT**


    Linux is an UNIX based operating system created by Linus Torvalds. It is freely-distributable
    and open source operating system. Open source refers to a program in which the
    source code is freely available on the Internet. This source code is open to modification
    by anyone who uses it. It has only one condition to be followed that changes made
    to the original source code are to be redistributed over the Internet. The Linux
    operating system can be installed on any system, which uses x86-compatible microprocessors.


    The most obvious advantage of using Linux is the fact that it is free to obtain,
    while Microsoft are available for a large amount and sometimes with recurring
    fee. Microsoft licenses typically are only allowed to be installed on a single
    computer, whereas a Linux distribution can be installed on any number of computers,
    free of cost.


    UNIX is a multiuser and multitasking operating system, which was developed by
    Bell Laboratories in 1969. It is a trademark that is purely governed by The Open
    Group conforming to a specification that is known as The Single UNIX Specification.
    This specification defines the names of the interfaces and behavior of all the
    mandatory functions such as, memory locking, priority scheduling, and shared memory,
    performed by Portable Operating System Interface (POSIX) Realtime Extensions developed
    by Institute of Electrical and Electronic Engineers (IEEE). UNIX as an operating
    system is commonly used in workstations as compared to the domain of usage of
    personal computers, mainly due to the features such as portability, flexibility,
    and power. Apart from these one of the main reason of UNIX been commonly used
    is its networking capability because unlike other operating systems no additional
    software is'
  merge: -1
  img_proc: true
- pgno: 15
  md: "# **2 ▶ Lab 1**\n\nrequired to get access on network.\n\nUNIX and UNIX like\
    \ operating systems are capable of running on different hardware components because\
    \ these operating systems are created using machine independent language. Simplicity,\
    \ Ability to Focus, Reusable components, Filters, Open File Formats, and Flexibility,\
    \ are some of the characteristics that are shared by UNIX programs and operating\
    \ systems.\n\nLinux is self-sufficient operating system based on Linux kernel.\
    \ A Linux kernel is a central component that manages system's resources (communication\
    \ between hardware and software components). Linux is a multiuser and multitasking\
    \ operating system, which means multiple users are able to log in and each user\
    \ can simultaneously perform multiple tasks. Linux is the most common example\
    \ of free and open source software (refers to the software of which the source\
    \ code is used, freely modified, and redistributed by anyone under the terms of\
    \ the GNU public license and other available free licenses). Linux enables the\
    \ users to work with either using different interfaces such as, Command Line Interface\
    \ (CLI) and Graphical User Interface (GUI), or through controls attached with\
    \ the hardware. K Desktop Environment (KDE) and GNOME are the two commonly used\
    \ and popular GUI used in Linux.\n\nSome of the computer characteristics managed\
    \ by Linux are Processor (by scheduling and prioritizing multiple tasks), Memory\
    \ (by moving processes that exceed the available memory to Swap space), Devices\
    \ (by supporting various hardware devices and also manages the size of kernel),\
    \ File systems (by managing different file system formats such as, VFAT,NTFS,\
    \ or Linux ext3), Security (by providing restricted user access).\n\nFollowing\
    \ are the common features of Linux:\n\n+   1. **No constant rebooting:** Provides\
    \ you with the functionality of installing and removing new software without rebooting\
    \ computer.\n+   \n+   2. **Start/ stop services:** Enables you to start and stop\
    \ individual services such as, Web, file, and e-mail services, without either\
    \ rebooting of computer or interrupting the work of any user and file or process.\n\
    +   \n+   3. **Portable software:** Modifies an application or driver to make\
    \ it work on different computer architecture or operating system.\n+   \n+   Downloadable\
    \ applications: Helps you to download and install the required application with\
    \ a single command with the help of tools such as, apt, rpm, and yum.\n+   \n\
    +   4. **No settings hidden in code or registries:** Provides you the ability\
    \ to modify the code according to the requirement because Linux is open source\
    \ software.\n+   \n+   5. **Freedom:** Provides you with the freedom to choose\
    \ any Linux distribution, access to source code, and also you can add or remove\
