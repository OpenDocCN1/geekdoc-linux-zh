- pgno: 150
  md: '# 14 LAB: Domain Name System


    **OBJECTIVES**


    To install and configure DNS server.


    **REQUIREMENTS**


    P4 class PC, 1-GB RAM, 80 GB HDD, NIC with FC6 or RHEL-5 installed.


    **CONCEPT**


    DNS is a facility provided by the TCP/IP that allows you to remember only the
    name of a site instead of the large and lengthy IP address. It is a client/server
    based architecture that functions at the Application Layer. Nowadays, the use
    of Internet services is widespread. The name of a site you type in the address
    bar is converted into an IP address. Suppose, the DNS utility was not available
    and you wanted to search for information on any topic from Google. In that case,
    you had to type 216.239.51.10 instead of typing www.google.com.


    Domain name space is designed based on the Hierarchical name space. An inverted
    tree structure with the root at its top is shown in Fig Linux-5.6. Starting from
    0 (root level) to 127 (highest level), a tree can have a maximum of 128 levels.
    The names in the DNS are not case-sensitive; for example, express is treated the
    same as Express or EXPRESS.


    An example of domain name space is shown below:


    ![](img/f3b9cff79e19317416c12eaf5ded7245_150_0.png)


    FC6 and RHEL-5 provide the named daemon, which is Berkeley Internet Name Domain
    (BIND).'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# # Authoritative DNS Server


    Authoritative servers provide the definitive information for your DNS domain,
    such as the names of servers and Web sites in it. There are 13 root authoritative
    DNS servers (super dupe r authorities) as shown in figure 1


    ![](img/f3b9cff79e19317416c12eaf5ded7245_151_0.png)


    ▲ Figure 1


    These root servers know all the authoritative DNS servers for all the main domains—.com,
    .net, and the rest. This layer of servers keep track of all the DNS servers that
    Web site systems administrators have assigned for their sub domains.


    For example, when you register your domain apple.com, you are actually inserting
    a record on the .com DNS server that points to the authoritative DNS server, which
    you have assigned for your domain.


    # # Caching Name Server


    Caching nameserver provides name lookup for client programs such as web browsers
    by contacting other name servers. This information is cached in local storage
    in case it is requested in near future.


    If you want to host your own website with full control of all the web domains
    and your ISP provides you with a fixed IP address then authoritative DNS server
    is the answer.


    # DNS Testing of DNS Interrogation at DNS client


    DNS Server (named) resolves or maps fully qualified domain name such as www.spit.ac.in
    to an ip address. This is also called forward lookup. Also it resolves or map
    ip address to Fully qualify domain name. This is called as reverse lookup.


    There are a number of commands you can use to do these lookups. Linux uses the
    host and nslookup command as DNS client side program, but Windows uses nslookup
    as DNS client side program.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# The host Command


    The host command accepts arguments that are either fully qualified domain names
    or the IP addresses of the servers while providing results. Following is the syntax
    to perform a forward lookup:


    Syntax:


    ```

    ```text

    [root@netmon tmp]# host www.spit.ac.in

    www.spit.ac.in has address 202.22.21.20

    [root@netmon tmp]#

    ```

    ```


    Following is the syntax to perform a reverse lookup:


    Syntax:


    ```

    ```text

    [root@netmon tmp]# host 202.22.21.20

    20.21.22.202.in-addr.arpa domain name www.spit.ac.in.

    [root@netmon tmp]#

    ```

    ```


    # The nslookup Command


    The nslookup command provides the same result on Windows PCs. To perform forward
    lookup:


    ```

    ```text

    C:\> nslookup www.spit.ac.in

    Server:  nsi.spit.ac.in

    Address:  202.22.21.20


    Non-authoritative answer:

    Name:  www.spit.ac.in

    Address:  202.22.21.20


    C:\>

    ```

    ```


    To perform a reverse lookup:


    ```

    ```text

    C:\> nslookup 202.22.21.20

    Server:  nsi.spit.ac.in

    Address:  192.168.1.200


    Name:  20.21.22.202.www.spit.ac.in

    Address:  202.21.22.20

    C:\>

    ```

    ```


    # Configuration files


    Following are the list of important configuration files on client and server side.
    Client side:


    ```

    ```text

    /etc/nsswitch.conf To determine the order in which to query name services

    /etc/resolve.conf To mention whois your DNS server

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'Server Side:


    | Config Path | Description |

    | :--- | :--- |

    | /var/named/chroot/etc/named.conf | Main DNS configuration file that list location
    and name of the zone files to be used for your desired website domains. |

    | /var/named/chroot/var/named/... (name of the forward zone file) | maps domain
    name to ip addresses |

    | /var/named/chroot/var/named/... (name of the reverse zone file ) | ipaddresses
    to domain name. |

