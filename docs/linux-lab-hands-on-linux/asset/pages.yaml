- pgno: 57
  md: '# Working with Linux-supported File Systems


    **■ Controlling Filesystem Mounting and Unmounting**


    +   1. **Mounting Filesystems**


    +   * In a Linux system contains entirely arbitrary data when installing. A partition
    contains a filesystem (a way of organising data into files and directories in
    which one filesystem is made the **root filesystem** (the root directory on that
    filesystem becomes the directory named /) and other filesystems can be **mounted**
    (the root directory of that filesystem is grafted onto a directory of the root
    filesystem)).

    +   * The directory grafted onto is called the **mount point**.


    +   2. **Mounting a Filesystem using the mount command**


    +   * The important filesystems are mounted at boot-up; however, other filesystems
    can be mounted or unmounted at any time

    +   * The mount command is used to mount a filesystem

    +   * You usually need to have a root user (administrator) permission to mount
    a filesystem.

    +   * For example, many systems are configured so that it will mount the content
    of the machine’s CD-ROM drive under the directory /mnt/cdrom.


    ```

    $  mount  /mnt/cdrom

    ```


    +   3. **Mounting Other Filesystems**


    +   * mount /dev/sdb3 /mnt/extra mounts the filesystem stored in the /dev/sdb3
    device on the mount point /mnt/extra

    +   * You may occasionally need to specify the filesystem type explicitly for
    which the syntax is:


    ```

    #  mount  -t  vfat  /dev/hdd1  /mnt/windows

    ```


    +   * Allowable filesystem types are listed in the mount(8) manpage

    +   * Run mount without any options to see a list of the filesystems currently
    mounted


    +   4. **Unmounting a Filesystem using the umount command**


    +   * A filesystem can be unmounted by using the umount command

    +   * umount /mnt/extra unmounts whatever is on the /mnt/extra mount point

    +   * umount /dev/sdb3 unmounts the filesystem in the /dev/sdb3 device, wherever
    it is mounted

    +   * You normally need to have a root permission to unmount a filesystem

    +   * It’s also impossible to unmount a ‘busy’ filesystem

    +       * A filesystem is busy if a process has a file on it open

    +       * Or if a process has a directory within it as its current directory


    +   5. **Configuring mount: /etc/fstab**


    +   * The /etc/fstab file contains information about filesystems that are known
    to the system administrator'
  merge: -1
  img_proc: true
- pgno: 58
  md: '+   • Specifying a filesystem in /etc/fstab makes it possible to use its mount
    point as the only argument to mount

    +   • /etc/fstab also configures the filesystems that should be mounted at boot-up

    +   • Each line in /etc/fstab describes one filesystem and on each line six columns
    are present.


    +   6. Sample /etc/fstab

    +   • A/etc/fstab file looks like as follows:


    Table 2: /etc/fstab

    | # device | mount-point | type | options (dump) pass-no |

    | :------- | :--------- | :--- | :------------------- |

    | /dev/hda3 | / | ext2 | defaults | 1 | 1 |

    | /dev/hda1 | /boot | ext2 | defaults | 1 | 2 |

    | /dev/hda5 | /usr | ext2 | defaults | 1 | 2 |

    | /dev/hdb1 | /usr/local | ext2 | defaults | 1 | 2 |

    | /dev/hdb2 | /home | ext2 | defaults | 1 | 2 |

    | none | /proc | proc | defaults | 0 | 0 |

    | /dev/sdc0 | /mnt/cdrom | iso9660 | noauto,users,ro | 0 | 0 |

    | /dev/fd0 | /mnt/floppy | auto | noauto,users | 0 | 0 |


    +   7. Filesystem Types

    +   • The network filesystems includes nfs (Unix-specific) and smbfs (Windows
    or Samba)


    Table 3: Common filesystem

    | Type | Usage |

    | :--- | :----- |

    | ext2 | Refers to the standard Linux filesystem |

    | iso9660 | Refers to the filesystems used on CD ROM |

    | proc | Refers to the way a kernel report to system information to user processes
    |

    | vfat | Refers to the filesystems used by Windows 95 |


    +   8. Mount Options: Mount options are those options that are used in /etc/fstab
    and are separated by comma. These options are used with -o on the mount command
    line to perform specific functions.


    Table 4: Common Mount Options

    | Option | Description |

    | :----- | :---------- |

    | noauto | Prevents the filesystem being mounted at bootup. Useful for removable
    media |

    | ro | Mounts the filesystem as read-only |

    | Users | Lets non-root users mount and unmount this filesystem |

    | user | Refers to like users, but non-root users can only unmount filesystems
    that they themselves mounted. |'
