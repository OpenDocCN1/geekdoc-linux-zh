    # Determining the Default Boot Runlevel


    The default boot runlevel is set in the file /etc/inittab with the initdefault
    variable. When it is set to 3, the system boots up with the text interface on
    the VGA console; when set to 5, you get the GUI console.


    The following is a snippet of the file (delete the initdefault line you don’t
    need):


    ```

    # default runlevel. The runlevels used by RHS are:

    # 0 - halt (Do NOT set initdefault to this)

    # 1 - Single user mode

    # 2 - Multiuser, without NFS (The same as 3, if you do not have networking)

    # 3 - Full multiuser mode

    # 4 - unused

    # 5 - X11

    # 6 - reboot (Do NOT set initdefault to this)

    #

    id:3:3:initdefault: # Console Text Mode

    id:5:5:initdefault: # Console GUI Mode

    ```


    Changing initdefault from 3 to 5, or vice versa, has an effect on your next reboot.
    See the following section on how to get a GUI login all the time until the next
    reboot.


    Don’t set the initdefault value to 6 or your system will constantly reboot. Setting
    it to 0 will never allow it to start!


    # Getting a GUI Console


    You have two main options if your system comes up in a text terminal mode on the
    VGA console and you want to get the GUI console. The following are the options:


    Manual Method: You can start the X terminal GUI application each time you need
    it by running the following startx command at the VGA console:


    ```

    [root@netmon tmp]# startx

    ```


    Remember that when you log out you will get the regular text-based console again.


    Automatic Method: You can start Linux automatically at the X terminal GUI console
    for every login attempt until your next reboot by using the init command. You
    will need to edit your initdefault variable in your /etc/inittab file, as mentioned
    in the preceding section, to keep this functionality even after you reboot.


    ```

    [root@netmon tmp]# init 5

    ```


    When the CPU capacity or available memory on your server is low or you want to
    maximize all system resources, you might want to operate in text mode runlevel
    3 most of the time, using the GUI only as necessary with the startx command.


    Servers that double as personal workstations, or servers that might have to be
    operated for an extended period of time by relatively nontechnical staff, may
    need to be run at runlevel 5 all'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'the time through the init 5 command. Remember you can make runlevel 5 permanent
    even after a reboot by editing the /etc/inittab file.


    # Using Virtual Consoles


    By default, Linux runs six virtual console or TTY sessions running on the VGA
    console. These consoles are defined by the mingetty statements in the /etc/inittab
    file. The X terminal GUI console creates its own virtual console by using the
    first available TTY that is not controlled by mingetty. This makes the GUI run
    as number 7:


    +   - You can step through each virtual console session by using the Ctrl-Alt-F1
    through F6 key sequence. You’ll get a new login prompt for each attempt.

    +   - You can get the GUI login with the sequence Ctl-Alt-F7, only in runlevel
    5, or if the GUI is running after launching startx.


    # Managing the init Scripts (SysV Start Scripts)


    Init scripts determine which programs start up at boot time. Red Hat and other
    Unix distributions have different runlevels, so there are a different set of programs
    that are started at each runlevel. Usually, Red Hat Linux starts up in multiuser
    mode with networking turned on. The following are some of the available runlevels:


    +   - \# 0 --- Halt

    +   - \# 1 --- Single-user mode

    +   - \# 2 --- Multiuser mode, without networking

    +   - \# 3 --- Full multiuser mode

    +   - \# 4 --- Not used

    +   - \# 5 --- Full multiuser mode (with an X-based login screen)

    +   - \# 6 --- Reboot


    The system boots into the default runlevel set in /etc/inittab. In Red Hat Linux,
    the default boot level is 3.When booting into an X-windows login, the default
    boot level is 5.


    ```

    #

    #

    inittab  This file describes how the INIT process should set up

    #

    the system in a certain run-level.

    #

    # Author: Miquel van

    smorenburg, <miquels@sdrinkel.nl.mugnet.org>

    # Modified for RHS Linux by Marc Ewing and Donnie Barnes

    #

    # Default runlevel. The runlevels used by RHS are:

    #  0 - halt (Do NOT set initdefault to this)

    #  1 - Single user mode

    #  2 - Multiuser, without NFS (The same as 3, if you do not have networking)

    #  3 - Full multiuser mode

    #  4 - unused

    #  5 - X11

    #  6 - reboot (Do NOT set initdefault to this)

    #

    id:5:initdefault:

    #System initialization.

    s1::sysinit:/etc/rc.d/rc.sysinit

    10:0:wait:/etc/rc.d/rc 0

    ```'
  merge: -1
  img_proc: true
