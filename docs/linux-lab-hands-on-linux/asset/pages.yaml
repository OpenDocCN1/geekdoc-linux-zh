- pgno: 289
  md: "# # Linux Lab: Hands on Linux\n\nLinux Lab: Hands on Linux is a perfect guide\
    \ for all those people who want to master Linux. This unique book provides step-by-step\
    \ practical tutorials on different aspects of Linux in easy-to-understand language.\
    \ Ready-to-use commands and code snippets along with descriptive illustrations\
    \ are among many of the value added features of this book.\n\n# The book covers:\n\
    \n+   - **INSTALLATION OF LINUX:** Normal Installation with Dual Boot procedure\
    \ and Network based Installation\n+   - **LINUX SYSTEM ADMINISTRATION:** User\
    \ Administration, Process Management, Memory Management, File System Management,\
    \ Disk Management, Installation of Software, working with Editors and Backup and\
    \ Restore\n+   - **LINUX NETWORK ADMINISTRATION:** Configuring TCP/IP Addresses,\
    \ Configuring NIC, Setting Default Gateway, Hostname Configuration, GUI Configuration\
    \ Tools, Networking Commands and Utilities\n+   - **LINUX SERVER ADMINISTRATION:**\
    \ Installation and Configuration of TELNET, SSH, FTP, Apache Web Server, NFS Server,\
    \ DNS, DHCP, SQUID proxy\n+   - **DATABASE MANAGEMENT:** Installing MySQL, Configuring\
    \ MySQL, Adding Data to MySQL Database Table, Sorting Data, Updating and Deleting\
    \ Records, Taking Backup of Database\n+   - **KERNEL CONFIGURATION:** Different\
    \ Kernel Modules, Kernel Version Naming Conventions, Kernel Compilation, Patching\
    \ Kernel, and Booting the Custom Kernel\n+   - **LINUX ENGINEERING TOOLS:** Installing\
    \ and Using Network Simulator, Running TCL Scripts on NS2, and Installing and\
    \ Using SCILAB\n+   - **PROGRAMMING IN LINUX:** Shell Scripting, Java Programming\
    \ in Linux, C Programming in Linux, and C++ Programming in Linux\n\n# About the\
    \ Authors\n\nDAYANAND AMBAWADE is an Assst. Professor in Sardar Patel Institute\
    \ of Technology at Mumbai. He received a M.Tech. from Indian Institute of Technology,\
    \ Bombay. He has 12 years academic and industry experience. His research interest\
    \ includes Computer Networks & Security, Mobile Wireless Networks & Open Source\
    \ Software (OSS). He has delivered and conducted seminars/workshop at various\
    \ STTP and Conferences. He has published papers in International Conferences.\
    \ He is a fellow of IETE, member of IEEE and LM-ISTE.\n\nDEVEN N. SHAH is working\
    \ with Sardar Patel Institute of Technology, Mumbai. He has 14 years of academic\
    \ and industry experience. He has worked as a technical consultant in various\
    \ computer institutes. He has received Best Faculty award from IBM US in 2007.\
    \ He has also been nominated for the Faculty award for the year 2008-09. Presently,\
    \ he is working with a France-based university for a joint research program; and\
    \ is pursuing research on Service Oriented Architecture.\n\n**CATEGORY:**  \n\
    **Engineering**  \n\n**USER LEVEL:**  \n**Beginner to Intermediate**\n\n![](img/f3b9cff79e19317416c12eaf5ded7245_289_0.png)\n\
