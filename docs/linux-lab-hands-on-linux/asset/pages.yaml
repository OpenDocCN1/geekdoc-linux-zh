    # ■ Stopping a TELNET Server at Boot Time


    You can deactivate TELNET even after the next reboot by using the chkconfig command.
    The syntax to use the chkconfig command is as follows: ]


    [root@netmon tmp]# chkconfig --level 35 telnet off


    # ■ Let TELNET Allow Connections from Trusted Addresses


    +   1. Add a list of trusted servers to the /etc/xinetd.d/telnet file separated
    by spaces:

    +   # default: on

    +   # description: The telnet server serves telnet sessions

    +   # unencrypted username/password pairs for authentication.

    +   service telnet

    +   {

    +   flags = REUSE

    +   socket_type = stream

    +   wait = no

    +   user = root

    +   server = /usr/sbin/in.telnetd

    +   log_on_failure += USERID

    +   disable = no

    +   only_from = 172.16.1.100 127.0.0.1

    +   }


    This is the entire process to allow connections from trusted addresses. Let’s
    perform the following commands to restart TELNET.

    2. Restart TELNET by using the following command:

    [root@netmon tmp]# chkconfig --level 35 telnet off

    [root@netmon tmp]# chkconfig --level 35 telnet on


    +   3. Test the TELNET session. Clients that are not on the trusted list get the
    message “Connection closed by foreign host.”'
