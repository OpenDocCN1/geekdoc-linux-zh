    netmom login:

    ```

    ```


    # ## Root Password Recovery


    Sometimes you might forget the root password, or the previous systems administrator
    might move on to a new job without giving it to you. To recover the root password,
    perform the following steps:


    +   1. Go to the VGA console and press Ctrl-Alt-Del. The system will then shut
    down in an orderly fashion.

    +   2. Reboot the system and enter single-user mode.

    +   3. When at the command prompt, change your password. Single-user mode assumes
    that the person at the console is the systems administrator root, so you don''t
    have to specify a root username.

    +   4. Return to your default runlevel by using the exit command.


    # ## Grand Unified Bootloader (GRUB)


    The Grand Unified Bootloader (GRUB) is a multi-boot boot loader. With many distributions,
    it is now the default boot loader. GRUB offers extensive compatibility with a
    variety of operating systems. Users can select operating systems to run from a
    menu interface displayed when a system boots up. Use arrow keys to move to an
    entry and press ENTER. Type e to edit a command, letting you change kernel arguments
    or specify a different kernel. The c command places you in a command line interface.
    Provided your system BIOS supports very large drives, GRUB can boot from anywhere
    on them. Linux and Unix operating systems are known as multi-boot operating systems
    and take arguments passed to them at boot time.


    GRUB configuration is held in the /etc/grub.conf file. You only need to make your
    entries and GRUB will automatically read them when you reboot. There are several
    options you can set, such as the timeout period and the background image to use.
    You can specify a system to boot by creating a title entry for it, beginning with
    the term title. You then have to specify where the operating system kernel or
    program is located, which hard drive and what partition on that hard drive. This
    information is listed in parentheses following the root option. Numbering starts
    from 0, not 1, and hard drives are indicated with an hd prefix, whether they are
    IDE or SCSI hard drives. So root(hd0,2) references the first hard drive (hda)
    and the third partition on that hard drive (hda3). For Linux systems, you will
    also have to use the kernel option to indicate the kernel program to run, using
    the full pathname and any options the kernel may need. The RAM disk is indicated
    by the initrd option.


    ```

    ```

    title Red Hat Linux (2.6.18-20)

    root (hd0,2)

    kernel /boot/vmlinuz-2.6.18-20 ro root=/dev/hda3

    initrd /boot/initrd-2.6.18-20.img

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 88
  md: "For another operating system such as Windows, you would use the **rootnoverify**\
    \ option to specify where Windows is installed. This option instructs GRUB not\
    \ to try to mount the partition. Use the **imageactive** and **chainloader** +1\
    \ options to allow GRUB to access it. The **chainloader** option tells GRUB to\
    \ use another boot program for that operating system. The number indicates the\
    \ sector on the partition where the boot program is located—for example, +1 indicates\
    \ the first sector.\n\n```\n```\n    title windows XP\n    rootnoverify (hd0,0)\n\
    \    imageactive\n    chainloader +1\n```\n```\n\nWindows systems will all want\
    \ to boot from the first partition on the first disk. This becomes a problem if\
    \ you want to install several versions of Windows on different partitions or install\
    \ Windows on a partition other than the first one. GRUB lets you work around this\
    \ by letting you hide other partitions in line, and then unhiding the one you\
    \ want, making it appear to be the first partition. In this example, the first\
    \ partition is hidden, and the second is unhidden. This assumes there is a Windows\
    \ system on the second partition on the first hard drive (hd0,1). Now that the\
    \ first partition is hidden, the second one appears as the first partition.\n\n\
    ```\n```\nhide (hd0,0)\nunhide (hd0,1)\nrootnoverify (hd0,1)\n```\n```\n\nA sample\
    \ **grub.conf** file follows with entries for both Linux and Windows. Notice that\
    \ kernel parameters are listed in the **kernel** option as arguments to the kernel.\n\
    \n```\n```\n/etc/grub.conf\n\n    grub.conf generated by anaconda\n    #\n   \
    \ #boot=/dev/hda\n    default=0\n    timeout=30\n    splashimage=(hd0,2)/boot/grub/splash.xpm.gz\n\
    \    title Red Hat Linux (2.4.7-10)\n        root (hd0,2)\n        kernel /boot/vmlinuz-2.4.7-10\
    \ ro root=/dev/hda3 hdc=ide-scsi\n        initrd /boot/initrd-2.4.7-10.img\n \
    \   title Windows XP\n        rootnoverify (hd0,0)\n        imageactive\n\n  \
    \      chainloader +1\n```\n```\n\nLet's summarize key points learned in this\
    \ Lab\n\n# ### Summary\n\nIn this Lab you learn about commands to shut down and\
    \ reboot the system. You also learn the process of switching to single-user mode,\
    \ entering single-user mode at the GRUB splash screen, and reverting to default\
    \ runlevel from single-user mode. Towards the end of the Lab you learn to recover\
    \ the Root password."
  merge: -1
  img_proc: true
