  md: '# 19 | LAB: Database Server (MySQL) Configuration


    OBJECTIVES


    +   1. Installing and Starting MySQL Database Server.

    +   2. Configuring the MySQL server

    +   3. Working with MySQL databases

    +   4. Displaying MySQL databases

    +   5. Making changes to tables and records


    REQUIREMENTS


    A Standard P-IV class PC with installed FC6 or RHEL-5 and Linux Distribution CDs/DVD.


    CONCEPT


    This lab explains the basic steps of configuring MySQL for use with a MySQL-based
    application in which the application runs on the same server as the database.


    # MySQL Client/Server Packages


    The following software packages are required for configuration of MySQL Server/Client:


    +   - **mysql**: Refers to the software package that contains a lot of MySQL client
    programs (in/usr/bin), several client shared libraries, the default MySQL configuration
    file (/etc/my.cnf), a few sample configuration files, files to support different
    languages, and documentation.

    +   - **mysql-server**: Refers to the software package that contains the MySQL
    server daemon (mysqld) and the mysqld startup script (/etc/init.d/mysqld). The
    package also creates various administrative files and directories needed to set
    up the MySQL databases.

    +   - **mysql-devel**: Refers to the software package that contains libraries
    and header files required for developing MySQL applications.


    # Additional Packages


    Additional packages available to add functionality to your MySQL databases include:


    +   - **php-mysql**: Refers to the package that contains a shared library to allow
    PHP applications access to MySQL databases'
  merge: -1
  img_proc: true
