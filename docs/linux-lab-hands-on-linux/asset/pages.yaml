  md: '# ## 15 LAB: Dynamic Host Configuration Protocol Server


    **OBJECTIVES**


    1.  To install and configure DHCP server

    2.  Assignment of fixed IP addresses to Servers

    3.  Configure client for DHCP


    **REQUIREMENTS**


    P-IV class PC, with installed Fedora/RHEL, with NIC, Linux distribution CD/DVD
    etc.


    **CONCEPT**


    Each computer in the TCP/IP network must have IP address, subnetmask, IP address
    of gateway and, IP address of a DNS server. The DHCP server is used to send these
    basic configurations automatically to the computers in the network.


    DHCP is a client-server protocol. The DHCP server assigns two types of address
    leases, manual and dynamic. In manual lease, the DHCP server explicitly assigns
    an IP address manually by associating a client hardware address with specific
    IP address. Whereas in dynamic lease, DHCP assigns any available IP address to
    the client from range of IP address mentioned in a configuration file.


    # ### Configuration Files


    The server side configuration files are as follows:


    +   □ /etc/dhcpd.conf: Main configuration file of DHCP server.

    +   □ /var/lib/dhcp/dhcpd.leases: Stores the leased clients IP addresses details

    +   □ /usr/share/doc/dhcp-version//dhcpd.conf.sample: Sample DHCP configuration
    file

    +   Client Side:

    +   □ /etc/sysconfig/network-scripts/ifcfg-eth0: change to DHCP


    # ■ Steps to Install and configure DHCP Server:


    1.  Install the DHCP package by using the following command:


    ```

    [root@netmon tmp]$ rpm -ivh dhcp-3.0.1-1.i386.rpm

    ```


    2.  Copy sample file by using the following command:


    ```

    [root@netmon tmp]# cp /usr/share/doc/dhcp-3.0pl1/dhcpd.conf.sample

    /etc/dhcpd.conf

    ```'
  merge: -1
  img_proc: true
