    **Security** Enhanced Linux (SELinux) enhancements developed by the US Federal
    National Security Agency (NSA) are included with Fedora Core beginning with version
    3 and Red Hat Enterprise Linux version 4. The fine-grained access control architecture
    is supported in the Linux kernel. Both *type* enforcement and **Role Based Access
