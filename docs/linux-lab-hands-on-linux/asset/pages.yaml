- pgno: 116
  md: '# LAB: Linux Network Configuration


    # OBJECTIVES


    +   1. Network Configuration

    +   2. Ethernet Configuration

    +   3. Activate/Shutdown network interface card (NIC)

    +   4. IP Aliasing

    +   5. NIC Speed configuration

    +   6. IP Forwarding


    # REQUIREMENTS


    P-IV class PC, 1-GB RAM, 80 GB HDD, NIC, with PC6 or RHEL-5.


    # CONCEPT


    Transmission Control Protocol/Internet Protocol (TCP/IP) is the two way communication
    protocol, which is used to send and receive data from one computer to the other
    over a network. TCP/IP uses the client/server model of communication in which
    a user (client) requests the host computer (server) for services, thereby establishing
    communication. A TCP/IP protocol is not just a single networking protocol but
    a collection of protocols, which are used for defining the standards for working
    of the Internet. An IP address is used in a TCP/IP network. You can fully understand
    the concept of TCP/IP networking in terms of a layered model with five layers.
    Each layer in TCP/IP model is responsible for performing a particular tasks. This
    model describes the flow of data between the physical connection to the network
    and the end-user application.


    Linux is a complete network operating system. This lab covers TCP/IP networking
    and system configuration basics. Linux can support multiple network devices. The
    device names are numbered, which begin at zero and count upwards. For example,
    a computer running two ethernet cards will have two devices labeled as /dev/eth0
    and /dev/eth1.


    # TCP/IP Network Configuration Files


    The primary network configuration files are as follows:


    +   *   /etc/hosts

    +   *   /etc/resolv.conf

    +   *   /etc/sysconfig/network

    +   *   /etc/sysconfig/network-scripts/ifcfg- <interface-name>'
  merge: -1
  img_proc: true
- pgno: 117
  md: "+   ☐ /etc/host.conf  \n+   ☐ /etc/nss.conf  \n+   ☐ /etc/sysctl.conf  \n+\
    \   ☐ /etc/services  \n+   ☐ /etc/protocols  \n+   ☐ /etc/sysconfig/networking\
    \  \n+   ☐ /etc/modprobe.conf\n\nLet’s discuss these files in detail in the following\
    \ sections.\n\n# /etc/hosts\n\nThe main purpose of this file is to resolve hostnames\
