    # # Access Control Lists


    You can limit users’ ability to browse the Internet with access control lists
    (ACLs). Each ACL line defines a particular type of activity, such as an access
    time or source network; they are then linked to an http_access statement that
    tells Squid whether or not to deny or allow traffic that matches the ACL.


    Squid matches each Web access request it receives by checking the http_access
    list from top to bottom. If it finds a match, it enforces the allow or deny statement
    and stops reading further. You have to be careful not to place a deny statement
    in the list that blocks a similar allow statement below it. The final http_access
    statement denies everything, so it is best to place new http_access statements
    above it.


    Let’s now learn to restrict Web access by time.


    # ## Restricting Web Access by Time


    You can create access control lists with time parameters. For example, you can
    allow only business hour access from the home network:


    ```

    #

    # Add this to the bottom of the ACL section of squid.conf

    #

    ```'
