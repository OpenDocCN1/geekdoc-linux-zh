    \ options.\n\n# /etc/nss.conf\n\nThe nss.conf is used for Name Switch Service\
    \ configuration. It defines order of name resolution options.\n\n# /etc/sysconfig/networking\n\
    \nThis file holds network configuration files managed by redhat-config-network.\n\
    \n# /etc/sysctl.conf\n\nThe above file is used for IP forwarding configuration.\n\
    \n# /etc/services\n\nIt lists available network services, such as FTP and Telnet,\
