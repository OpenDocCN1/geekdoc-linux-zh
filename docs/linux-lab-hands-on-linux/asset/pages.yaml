    # Configuring NFS on the client


    To configure NFS on the client first you need to start the NFS application, then
    create a directory to mount the directories of the NFS server that you exported
    via the /etc/exports file, and finally mount the directory of the NFS server on
    your local directory, or mount point.


    # Starting NFS on the Client


    The following steps help you to configure NFS on the client:


    +   i. Use the chkconfig command to configure the required NFS and RPC portmap
    daemons to start at boot. Activate nfslock to lock the files and reduce the risk
    of corrupted data. The syntax to use the chkconfig command is as follows:


    ```

    [root@netex tmp]# chkconfig --level 35 netfs on

    [root@netex tmp]# chkconfig --level 35 nfslock on

    [root@netex tmp]# chkconfig --level 35 portmap on

    ```


    +   ii. Use the init scripts in the /etc/init.d directory to start the NFS and
    RPC portmap daemons. As on the server, the examples use the start option, but
    you can also stop and restart the processes with the stop and restart options.
    The syntax to start NFS and RPC portmap daemons is as follows:


    ```

    [root@netex tmp]# service portmap start

    [root@netex tmp]# service netfs start

    [root@netex tmp]# service nfslock start

    ```


    +   iii. Test whether NFS is running correctly with the rpcinfo command. The listing
    of running RPC programs must include status, portmapper, and nlockmgr commands.


    ```

    [root@netex root]# rpcinfo -p

    [root@netex root]#

    ```


    # Manually Mounting NFS File Systems


    It is a manual process. In this case, you''re mounting the /distro/rhel5 directory
    as an NFS-type file system on the /mnt/nfs mount point. The NFS server is Netmon
    whose IP address is 172.16.1.100.


    The syntax to mount NFS file systems manually is as follows:


    ```

    [root@netex tmp]# mkdir /mnt/nfs

    [root@netex tmp]# ls /mnt/nfs

    [root@netex tmp]# mount -t nfs 172.16.1.100:/distro/rhel5 /mnt/nfs

    ```'
