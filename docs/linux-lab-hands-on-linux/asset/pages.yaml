  md: '# 18 LAB: Configuring Proxy Server (SQUID)


    # **OBJECTIVES**


    +   1. Install and configure Squid proxy server.

    +   2. Restriction Web Access by IP and Time

    +   3. Squid Proxy Server Authentification

    +   4. Monitoring Squid Proxy Server


    **REQUIREMENTS**

    P-IV class PC, 1-GB RAM, 80 GB HDD, NIC, with installed FC6 or RHEL-S etc.


    **CONCEPT**

    A proxy server sits between a web server and a web client (browser) and acts as
    a gateway between the two. There are many advantages to having a proxy server.


    The main ones are:


    +   - Security: The ability to allow or deny access to external web servers using
    Access Control Lists (ACL''s)

    +   - Accounting: Logging all of your clients access to the internet. Reports
    and statistics can be generated from these logs

    +   - Caching: Frequently accessed pages are cached locally and shared by all
    local web clients. This saves on bandwidth on your internet connection.


    Let''s learn about Squid files and directory.


    # SQUID Files and Directory


    +   - /etc/squid/ Contains the Squid configuration in file in /etc/squid directory.

    +   - /var/spool/squid Contains the Squid cache in /var/spool/ directory.

    +   - /var/log/squid Contains the Log in /var/log/ Squid directory.


    Let''s now learn about the Squid proxy server in detail:


    # SQUID Proxy Server


    Squid is a high-performance caching proxy server. Proxy servers are used to cache
    data streams such as FTP, HTTP and gopher. Network clients can then be directed
    to the proxy server to aid in pulling up cached HTTP documents.

    Users configure their Web browsers to use the Squid proxy server instead of going
    to the Web directly. The Squid server then checks its Web cache for the Web information
    requested by the'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'user. It returns any matching information that it finds in its cache. If it
    does not find any, it goes to the Web to find it on behalf of the user. Once it
    locates the information, Squid populates its cache with that information and also
    forwards it to the user’s Web browser.


    This reduces the amount of data accessed from the Web. Another advantage is that
    you can configure your firewall to accept HTTP Web traffic from the Squid server
    only and no one else. Squid can then be configured to request usernames and passwords
    for each user that uses its services. This provides simple access control to the
    Internet.


    Let’s now learn about installing Squid proxy server:


    # # Installing Squid Proxy Server


    For installing the Squid proxy server you need to use the RPM package. Let’s install
    the Squid proxy server using the Squid package.


    # ## ■ Install the Squid Package


    Check Linux distribution CD/DVD for Squid rpm package.


    ```

    `[root@netmon tmp]# rpm -Uvh squid-ver-release-arch.rpm`

    ```


    This command installs the Squid package. Let’s now learn to start the Squid server.


    # ## ■ Starting Squid


    The chkconfig configures Squid to start at boot:


    ```

    `root@netmon tmp]# chkconfig --level 35 squid on`

    ```


    This command is used to start the Squid services. Let’s now learn to start, stop
    and restart the Squid services after booting.


    Use the service command to start, stop, and restart Squid after booting:


    ```

    ```text

    [root@netmon tmp]# service squid start

    [root@netmon tmp]# service squid stop

    [root@netmon tmp]# service squid restart

    ```

    ```


    You can test whether the Squid process is running with the pgrep command:


    ```

    `[root@netmon tmp]# pgrep squid`

    ```


    You should get a response of plain old process ID numbers.


    # ## SQUID Basic Configuration


    The squid basic configuration file is stored in the squid.conf in /etc/squid directory.
    Let’s now learn the Squid configuration.


    +   - The /etc/squid/squid.conf File

    +   - Squid configuration file located at /etc/squid/squid.conf.'
