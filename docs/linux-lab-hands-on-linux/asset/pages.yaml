    \nIn a Wireless network topology, when not all nodes are within each other's range,\
    \ carrier sense only provides information about collisions at the sender, not\
    \ at the receiver. This leads to problems like \"hidden terminal\" (where two\
    \ sender nodes out of range of each other transmit packets at the same time, to\
    \ the same receiver, resulting in collisions at the receiver). To solve such problems,\
    \ control packets (RTS & CTS) are used, as an alternative to the carrier sense\
    \ protocol. When a node wants to transmit packets, it first sends a RTS (Request\
    \ To Send) packet to the receiver. All nodes within the sender's range receive\
    \ this RTS packet. Every node hearing the RTS packet will defer transmission.\
    \ If receiver is not receiving data from any other node, it responds with a CTS\
    \ (Clear To Send) packet. This packet is again received by every node within receivers\
    \ range. So all nodes in the range defer transmission. Sender node sends the data\
    \ packet after receiving CTS. If sender node does not hear the CTS, it will time-out\
    \ and schedule retransmission of RTS. On receiving the data packet, receiver sends\
    \ an ACK to the sender. Link layer ACKs are used to facilitate recovery from collision\
    \ faster. RTS and CTS packets are very short, hence their collision is very less\
    \ likely.If RTS packets from 2 sender nodes collide at the receiver, sender nodes\
    \ will not receive a CTS packet and the nodes, as a"
