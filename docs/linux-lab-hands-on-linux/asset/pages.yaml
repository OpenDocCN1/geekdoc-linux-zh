    # ## Configuring nfs on the Server


    Both the NFS server and client have to have parts of the NFS package installed
    and running. The server needs portmap, nfs, and nfslock, as well as a correctly
    configured /etc/exports file.


    # ### The /etc/exports File


    The /etc/exports file is the main NFS configuration file that consists of two
    columns. The first column lists the directories you want to make available to
    the network, whereas the second column has two parts. The first part lists the
    networks or DNS domains that can get access to the directory, and the second part
    lists NFS options in brackets.


    ```

    ```text

    /etc/exports

    /data/files *(ro, sync)

    /home 172.16.1.0/24(rw, sync)

    /distro/rhel5 172.16.1.200/32(rw, sync)

    ```

    ```


    After configuring your /etc/exports file, you need to activate the settings, but
    first make sure that NFS is running correctly.


    The following points help you to configure an NFS server:


    +   i. Use the chkconfig command to configure the required nfs and RPC portmap
    daemons to start at boot. Following is the syntax to use chkconfig command:


    ```

    ```text

    [root@netmon tmp]# chkconfig --level 35 nfs on

    [root@netmon tmp]# chkconfig --level 35 nfslock on

    [root@netmon tmp]# chkconfig --level 35 portmap on

    ```

    ```


    +   ii. Use the init scripts in the /etc/init.d directory to start the nfs and
    RPC portmap daemons. The following examples use the start option, but when needed,
    you can also stop and restart the processes with the stop and restart options.


    ```

    ```text

    [root@netmon tmp]# service portmap start

    [root@netmon tmp]# service nfs start

    [root@netmon tmp]# service nfslock start

    ```

    ```


    +   iii. Test whether NFS is running correctly with the rpcinfo command. You should
    get a listing of running RPC programs that must include mountd, portmapper, nfs,
    and nlockmgr.'
  merge: -1
