  md: '# LAB: Installation and Demonstration of Network Simulator (NS-2)


    # **OBJECTIVES**


    +   1.  Installing NS 2 on Linux system

    +   2.  Running TCL Scripts in NS 2

    +   3.  Starting Network Animator

    +   4.  Demonstrating the of Examples of NS 2


    # **REQUIREMENTS**


    Installed RHEL-5.1 Linux or Fedora Core-6, ns-allinone-2.34.tar.gz (RHELS) and
    ns-allinone-2.31.tar.gz (FC-6) packages


    # **CONCEPT**


    NS 2 is an open-source simulation tool that runs on Linux. It is a discreet event
    simulator targeted at networking research and provides substantial support for
    the simulation of routing, multicast protocols and IP protocols, such as UDP,
    TCP, RTP and SRM over wired and wireless (local and satellite) networks. It has
    many advantages that make it a useful tool, such as support for multiple protocols
    and the capability of graphically detailing network traffic. Additionally, NS
    2 supports several algorithms in routing and queueing. LAN routing and broadcasts
    are part of routing algorithms. Queueing algorithms include fair queueing, deficit
    round-robin and FIFO.


    # ### **Advantages of NS 2**


    +   *   Simulate different scenarios with existing protocols (TCP/UDP)

    +   *   Wired Routing protocols - Distance Vector and Link State (with the link
    state patch)

    +   *   Ad-Hoc Routing protocols - DSR, AODV, TORA

    +   *   You can modify NS 2 to implement your own versions of the preceding protocols
    or even code totally new protocols

    +   *   Graphic visualization - using "NAM" (Network Animator)

    +   *   NS 2 can also be used to write applications, such as FTP, ECHO


    # ### **■ Platforms used for NS2**


    NS2 is available on several platforms such as FreeBSD, Linux, SunOS and Solaris.
    NS2 also runs on Windows.'
  merge: -1
  img_proc: true
