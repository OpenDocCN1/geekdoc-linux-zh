    # Adding FTP Users with Read-Only Access to a Shared Directory


    This example is for, when anonymous FTP is not desired and ftp access need to
    provide to the group of trusted users with read-only access to shared directory.


    Perform the following steps to add FTP users with read-only access to a shared
    directory:


    +   Disable anonymous FTP


    ```

    # Allow anonymous FTP?

    # anonymous_enable=YES

    ```


    +   Enable individual logins


    ```

    # uncomment this to allow local users to log in. local_enable=YES


    After modifying `/etc/vsftpd.conf` as above mentioned steps, start VSFTP.


    `[root@netmon tmp]# service vsftpd start`

    ```


    +   Create a user group and shared directory. In this case, use `/home/share-resource`
    and a user group name of share-resource for the remote users.


    ```

    `[root@netmon tmp]# groupadd share-resource`

    `[root@netmon tmp]# mkdir /home/share-docs`

    ```


    +   Make the directory accessible to the share-resource group.


    ```

    `[root@netmon tmp]# chmod 750 /home/share-docs`

    `[root@netmon tmp]# chown root:share-resource /home/share-docs`

    ```


    +   Add users, and make their default directory `/home/share-docs`.


    ```

    `[root@netmon tmp]# useradd -g share-resource -d /home/share-docs aday a`

    ```


    +   Copy files to be downloaded by your users into the `/home/share-docs` directory.


    +   Change the permissions of the files in the `/home/share-docs` directory to
    read-only access by the group.'
