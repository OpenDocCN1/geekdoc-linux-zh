    # POSIX Threads Cancellation


    POSIX threads can be terminated in a variety of ways. Thread cancellation is a
    function that allows a thread to terminate another thread in cancellation is in
    a controlled manner. The thread that is to be cancelled can control how this happens.
    The thread that wants to perform a cancellation against another thread sends a
    cancellation request to that thread. How the cancelled thread notices the cancellation
    request is determined by whether cancellation state and type are in effect.


    If the cancellation state of a thread is disabled, any cancellation requests are
    held until cancellation is enabled again. If the cancellation state of a thread
    is enabled, the cancellation type of a thread can specify the behavior of the
    thread. Two settings are possible. Deferred cancellation means the thread will
    not cancel until it reaches a cancellation point. If the cancellation type is
    set to asynchronous cancellation, cancellation can occur at any time. A cancellation
    point occurs when certain pthread and non-pthread functions are called. Some functions
    act depending on conditions or actions taken inside the functions. Table 1.4 lists
    the cancellation points defined by Solaris:


    | Table 1.4 Cancellation Points Defined by Solaris |

    |---|---|

    | alo_suspend | close |

    | creat | fsync |

    | mq_receive | mq_send |

    | msync | nanosleep |

    | open | pause |

    | pthread_cond_timedwait | pthread_cond_wait |

    | pthread_join | pthread_setcancel |

    | pthread_setcanceltype | pthread_testcancel |

    | read | sem_wait |

    | sigwaitinfo | sigsuspend |

    | sigtimedwait | sigwait |

    | sleep | system |

    | tcdrainwait | waitpid |

    | write | |

    | fcntl (when specifying F_SETLW as the command) | |'
