  md: '# Working with Memory


    +   - ANSI C Memory Routines........ 156

    - The Microsoft Windows Virtual Memory Management Routines........ 159

    - The Microsoft Windows Heap Routines........ 177

    - Additional Memory Management Functions in Solaris........ 181


    Memory is not as much of a premium system resource as it once was. Memory capacity
    has increased significantly and become less expensive. With the advent of the
    32-bit and 64-bit address spaces, it is relatively straightforward to write software
    without any concern of running out of memory. Space-saving techniques such as
    overlays are becoming things of the past. More of concern today are efficiency,
    performance, and level of control. These attributes can be accomplished using
    the memory management API and system service level routines. There may be circumstances
    in which memory utilization is dynamic and storage does not have to be maintained
    on a permanent basis. After being used, memory can be returned to the system so
    it is available to other system processes. There may also be circumstances in
    which it is more efficient to share memory among processes rather than having
    multiple allocations of storage. Both Microsoft Windows and UNIX provide system
    services that support these kinds of operations.'
