    The NT file system (NTFS) replaces the Windows 95/98 FAT (file allocation table)
    and offers a number of improvements over the FAT, as follows:


    +   - Long names are supported as well as the 8.3 names.

    - Supports access control lists (ACLs) for better file access security.

    - File compression is integrated.

    - Supports file names based on Unicode.(Unicode is a 16-character encoding scheme
    that allows file names to be specified in a wide variety of foreign alphabets
    and languages)

    - Supports incredibly large files, approximately 16 billion bytes in size.


    Each file on an NTFS disk is stored on the hard drive in one or more clusters.
    These clusters represent predefined storage spaces that can range in size from
    512 to 64 KB. Cluster sizes vary depending on the overall size of the disk. The
    smallest files occupy a single cluster. This may seem like a waste of resources,
    but it is a tradeoff of efficient disk utilization and performance. The general
    rule of thumb is, the larger the disk capacity the larger the cluster size. Although
    it is not always possible, NTFS tries to allocate storage for a file as continuously
    as it can; however, file clusters are generally spread around the disk. When a
    file is created using NTFS, an entry is created in a special file called the master
    file table (MFT). The entry contains information on where to find all the clusters
    of the file.


    Clusters also play a major role in how a FAT file system works. In a FAT environment,
    when you write a new file to a hard disk, the file is stored in one or more clusters
    that are not necessarily next to each other. The operating system creates a FAT
    entry for a new file, where records where each cluster is located and its sequential
    order. Upon reading the operating system reassembles the file from the clusters
    and puts it together as an entire file you can read it. Until Windows 95 OSR2
    (OEM Release 2), MS DOS and Windows FAT entries were 16 bit, allowing for a hard
    disk size of up to 128 MB with a 2,048-byte cluster size. With 32-bit FAT entry
    support in Windows 95 OSR2, the largest hard disk that can be supported is two
    terabytes.'
