    # Managing Access Tokens


    Several routines are available that allow a user to manage access tokens. Table
    7.1 lists some of these routines. An access token is an object that describes
    the security context of a process or thread. The information in a token includes
    the identity and privileges of the user account associated with the process or
    thread. When a user logs on, the system verifies the user''s password by comparing
    it with information stored in a security database. If the password is authenticated,
    the system produces an access token. Every process executed by this user has a
    copy of this access token.


    | Table 7.1 Microsoft Windows Access Token Management APIs |

    | API Name | Function Definition |

    | AdjustTokenPrivileges | Enables or disables privileges in the token. |

    | DuplicateToken | Creates a new access token that duplicates one already in existence.
    |

    | GetTokenInformation | Retrieves information about the token. |

    | OpenThreadToken | Opens a token associated with a thread. |

