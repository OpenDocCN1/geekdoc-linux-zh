  md: "# Concurrency Control Functions in the Win32 API\n\nindicating the name of\
    \ the mutex object. The name is typically represented as a character string enclosed\
    \ in double quotes. The mutex name may also be passed as zero, in which case the\
    \ mutex object is created without a name and can only be used locally within the\
    \ process.\n\nThe Win32 API provides another routine for accessing a mutex already\
    \ created, called OpenMutex, which has the following calling sequence:\n\n```\n\
    HANDLE OpenMutex (\n    DWORD accessFlag,\n    BOOL inheritFlag,\n    LPCTSTR\
    \ mutexName);\n```\n\nArgument accessFlag specifies Windows NT 2000 access rights\
    \ and can be set to MUTEX_ALL_ACCESS or to SYNCHRONIZE. The setting of SYNCHRONIZE\
    \ allows the use of the mutex in any of the wait functions to acquire ownership\
