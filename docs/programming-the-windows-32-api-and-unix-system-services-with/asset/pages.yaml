  md: '# Chapter 3 Preparing for the Unexpected


    The signal mask also can be controlled by using the sigsetops functions. All of
    these functions use an argument representing a signal mask set. The functions
    have the following calling sequences:


    ```

    sigymetset(sigset_t set);

    ```


    ```

    sigfillset(sigset_t *set);

    ```


    ```

    sigaddset(sigset_t *set, int signo);

    ```


    ```

    sigdelset(sigset_t *set, int signo);

    ```


    ```

    sigismember(sigset_t *set, int signo);

    ```


    The argument sigset_t *set represents a signal mask that will go into effect immediately
    (except for sigismember). The signal mask ramifications are as follow:


    +   - sigymetset Unblock all signals.

    - sigfillset Block all signals.

    - sigaddset Add the signal signo to the mask sigset_t *set so now it is blocked.

    - sigdelset Remove the signal signo from the mask sigset_t *set so that it is
    unblocked.

    - sigismember Upon successful completion, return a value of 1 if the specified
    signal is a member of the specified set, or a value of 0 if it is not.


    The concept of the UNIX signal masks (and how to use them) is perhaps one of the
    most confusing to understand. The reader should realize that both sigprocmask
    and the sigsetops functions can be used interchangeably. The sigsetops functions
    are quick and easy. If you need to maintain signal context, sigprocmask is more
    useful. Also, the sigsetops functions have process-wide consequences, whereas
    sigprocmask is specific to a thread in a multithreaded environment.


