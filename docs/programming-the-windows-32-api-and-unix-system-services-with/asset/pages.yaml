    structures maintained by the heap manager are in a consistent state. This routine
    can also be used to validate a single memory block within a specified heap, without
    checking the validity of the entire heap. Routine returns a non-zero value


    UINT HeapCompact (

    HANDLE hHeap,

    DWORD dwFlags);

    The function attempts to compact a specified heap. It compacts the heap by coalescing
    adjacent free blocks of memory and decommitting large free blocks of memory.


    BOOL HeapLock (

