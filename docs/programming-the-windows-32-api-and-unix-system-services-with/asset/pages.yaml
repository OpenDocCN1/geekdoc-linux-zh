  md: '# About the CD-ROM


    The CD-ROM included with The Win32 API and UNIX System Services contains all sample
    programs from the book arranged in folders named for the chapter in which they
    can be found. Program files are named exam-y-z, which is interpreted as follows:


    | exam | Part of filename, short for example |

    | x | Chapter number |

    | y | Example number |

    | z | File type, c or cpp |


    For example, file exam-1-cpp represents program example #1 from Chapter 1 and
    is a C++ (.cpp) type of file. Build instructions for the programs can be found
    in the Readme.doc file on the CD-ROM.


    The CD-ROM can be used on Microsoft Windows® 95 98 NT/2000®, Sun Microsystems
    SunOS® 5.5.1 or greater, and Red Hat® Linux V6.1 or greater.


    # License Agreement


    Use of the software accompanying The Win32 API and UNIX System Services is subject
    to the terms of the License Agreement and Limited Warranty, found on the previous
    two pages.


    # Technical Support


    Prentice Hall does not offer technical support for any of the programs on the
    CD-ROM. However, if the CD-ROM is damaged, you may obtain a replacement copy by
    sending an email that describes the problem to: disc_exchange@prennhall.com.'
