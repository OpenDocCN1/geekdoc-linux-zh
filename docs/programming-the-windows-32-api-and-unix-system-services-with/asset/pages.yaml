  md: "# Concurrency Control Functions in the Win32 API\n\n# 53\n\n# Events\n\nAn\
    \ event object can be used to indicate a particular event has occurred. Event\
    \ objects are created by calling the CreateEvent routine as follows:\n\n```\n\
    HANDLE CreateEvent (\n    LPSECURITY_ATTRIBUTES securityAttr,\n    BOOL manualReset,\n\
    \    BOOL initState,\n    LPCTSTR name );\n```\n\nThe securityAttr argument specifies\
    \ a security attributes valid only for Windows NT 2000. The manualReset is a boolean\
    \ argument that specifies a particular kind of behavior about this event object.\
    \ When an event object is set, it is considered signaled; when it is reset, it\
    \ is considered nonsignaled. When the manualReset argument is set to TRUE, the\
    \ event object is a manualreset event object. Once a manual-reset event object\
    \ becomes set, it is the caller's responsibility to reset the event object by\
    \ calling the ResetEvent routine. If this argument is FALSE, the event object\
    \ is called an auto-reset event object and will automatically become reset after\
    \ a single waiting thread has been released. The initialState is a boolean argument\
    \ that specifies the initial state of the event object. If TRUE, the event object\
    \ is created in a set state; if FALSE, the event object is created in a reset\
    \ state. The name argument points to a null-terminated string specifying the name\
    \ of the event object. This argument can be omitted, in which case a NULL name\
    \ is associated with this event object.\n\nIf the event object has already been\
    \ created, routine OpenEvent can be used to access the event object as follows:\n\
    \n```\nHANDLE OpenEvent (\n    DWORD access,\n    BOOL inheritFlag,\n    LPCTSTR\
    \ name );\n```\n\nThe access argument has the following implications for Windows\
    \ NT/2000:\n\n| Value | Meaning |\n| --- | --- |\n| EVENT_ALL_ACCESS | All access\
    \ flags specified for semaphore |\n| EVENT_MODIFY_STATE | Event handle can be\
    \ used in a SetEvent or ResetEvent call to modify event state |\n| SYNCHRONIZE\
    \ | Enables event handle to be used in any wait function for the event to be signaled\
    \ |\n\nAn event object is put into the set state by calling the SetEvent routine,\
