  md: '# Microsoft Windows Named Pipes


    Named pipes provide for a connection-oriented communication path between two processes.
    Unlike mailslots, named pipes can communicate over wide-area networks.


    THE CreateNamedPipe API


    A named pipe is created in the server process by calling the CreateNamedPipe call,
    which has the following sequence:


    ```

    HANDLE CreateNamedPipe(

    LPCTCTSTR name,

    DWORD openmode,

    DWORD pipodem,

    DWORD maxinstances,

    DWORD outbufsize,

    DWORD inbufsize,

    DWORD deftimout,

    LPSECURITY_ATTRIBUTES secattr

    );

    ```


    The name argument is a pointer to the null-terminated string that uniquely identifies
    the pipe. The string name must have the following syntax:

    \\.\pipename


    The pipename section can include any character other than a backslash, including
    numbers and special characters. The entire pipe name string can be up to 256 characters
    long. Pipe names are not case-sensitive. The openmode argument characterizes the
    access mode, through-mode, overlapped mode, and security mode of the pipe, according
    to Table 6.3.


    The pipe argument specifies the type, read, and wait modes of the pipe handle.
    Table 6.4 lists the different values possible for pipe.

    The instances argument represents the maximum number of instances (copies) that
    can be created for this pipe. The same number must be specified for all instances.
    The number of pipe instances that can be created is limited only by the availability
    of system resources. The outbufsize and inbufsize represent the number of bytes
    to reserve for the output and input buffers. The actual buffer size reserved for
    each end of the named pipe is either the system default, the minimum or maximum,
    or the specified size rounded up to the next allocation boundary. The deftimout
    argument indicates the timeout value in milliseconds if the WaitNamedPipe function
    specifies WAIT_USE_DEFAULT, which must be the same for all instances of the pipe.
    The secattr argument specifies the security attributes structure affiliated with
    the named pipe. Details of this argument are discussed in Chapter 7.'
