    \ *mp);\n```\n\n```\nint pthread_mutex_unlock(pthread_mutex_t *mp);\n```\n\n```\n\
    int pthread_mutex_destroy(pthread_mutex_t *mp);\n```\n\nFor a mutex to be used,\
