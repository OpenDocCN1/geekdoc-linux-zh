    \ Adjustment Values |\n|---|n| THREAD_PRIORITY_HIGHEST | +2 |\n| THREAD_PRIORITY_ABOVE_NORMAL\
    \ | +1 |\n| THREAD_PRIORITY_NORMAL | +0 |\n| THREAD_PRIORITY_BELOW_NORMAL | -1\
    \ |\n| THREAD_PRIORITY_LOWEST | -2 |\n\nThe SetThreadPriority function is called\
    \ as follows:\n\n```\nSetThreadPriority (\n  HANDLE thread, INT priority );\n\
    ```\n\nThe thread argument contains the handle of the thread whose priority is\
