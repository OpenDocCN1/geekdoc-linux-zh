  md: "# Structured Exception Handling\n\nStructured exception handling (SEH) is actually\
    \ a facility provided by the compiler rather than by the operating system. Furthermore,\
    \ the syntax used to specify SEH is not industry-standard, although the form used\
    \ by Microsoft is practically de facto. The examples demonstrated here are relative\
    \ to Microsoft Visual C/++. A comprehensive discussion of SEH is beyond the scope\
    \ of this book. However, a short overview of two kinds of SEH will be discussed:\
    \ termination handlers and exception handlers.\n\n# SEH: Termination Handlers\n\
    \nTermination handlers are bodies of code that are guaranteed to be executed.\
    \ Termination handlers are implemented by specifying a try-finally block as follows:\n\
    \n```\n// Code executed before try-finally block\n\n__try{\n    Code you suspect\
    \ a premature exit may occur\n    ...\n}\n__finally{\n    This section of code\
    \ is guaranteed to be executed\n    ...\n}\n```\n\n// Code possibly executed after\
    \ try ... finally block\n\nThe try block delineates the suspect area of code where\
    \ a premature exit may occur. If an attempt to exit occurs in the try block, the\
    \ code in the finally block will execute first: then the exit from the try block\
    \ will happen. If no exit is attempted from the try block, execution will naturally\
    \ flow into the finally block. An exit from a try block is manifested by execution\
    \ of a return, goto, continue, break, or exception occurring in a function call.\
    \ A situation in which a termination handler can be really valuable is ensuring\
    \ that housekeeping actions take place in a multithreaded environment, such as\
    \ releasing a mutex. Imagine the consequences of prematurely exiting from an area\
    \ of code in which a call to ReleaseMutex is done. Failure to release the mutex\
    \ would cause a devastating hang in the program. The programmer should understand\
    \ that the compiler needs to add a considerable amount of code to make termination\
    \ handlers work, therefore, explicit exits from the try block should be avoided.\
    \ Example 3-7 illustrates a termination handler. Consider the consequences in\
    \ Example 3-7 if the ReleaseSemaphore was not executed."
