    ```

    int semop(int sid, struct sembuf(*ops)[], int nops);

    ```


    Argument sid represents the semaphore id obtained from a call to semget. Argument
    ops is a pointer to the array of semaphoreoperation structures. The last argument,
    nops, is the number of such structures in the array. A semaphore-operation structure
    appears as follows:


    ```

    short sem_num  /* The semaphore number */

    short sem_op   /* The semaphore operation */

    short sem_flg   /* Operation flags */

    ```


    Basically, if sem_op is set to a negative value, that amount is subtracted from
    the value of the semaphore designated by the sem_num argument. This is similar
    to the function WAIT(S) or P(S). If sem_op is a positive value, that is added
    to the value of the semaphore designated by the sem_num argument. This is similar
    to the function SIGNAL(S) or V(S).


    Routine semctl can be used to interrogate or change certain characteristics, such
    as its owner, time it was last, and permissions. This routine can also be used
    to determine how many processes are waiting on a particular semaphore and the
    ID of the last process that changed it. The calling sequence to semctl is as follows:


    ```

    int semctl(int sid, int semnum, int cmd, [semun]);

    ```


    Argument sid represents the semaphore id obtained from having called semget. semnum
    represents the semaphore for which the function represents the cmd argument is
    to be performed. Table 2,3 represents some of the values to which the argument
    cmd can be set.


    | TABLE 2.3 Sample Settings for the semctl Command Argument |

    |---||

    | GETVAL | Return the value of this semaphore |

    | SETVAL | Set the value of this semaphore to a value indicated in semnum argument
    |

    | IPC_RMID | Remove the semaphore indicated by the specified semaphore identifier
    from the system and destroy the set of semaphores and data structure associated
    with it |'
