    the memory allocation routines. The routine msize is not available in UNIX.


    The program in Example 5-1 first allocates 4,000 bytes of memory (1,000 ints,
    as an int is 4 bytes). A reallocation is performed next using realloc, allocating
    another 4,000 bytes, making the total allocation 8,000 bytes. The calloc returns
    a completely different memory address pointer. This call is self-contained by
    observing the number of bytes allocated and does not'
