- img_proc: true
  md: '# Chapter 3 Preparing for the Unexpected


    the I O to complete. Our program can go on doing other useful work and then be
    automatically notified that the I O operation has completed.


    I O is one example of an asynchronous event for which a routine can be activated
    upon its occurrence. Other examples include timer expirations, child process terminations,
    and terminal keyword activity.


    Solaris, Red Hat Linux, and Microsoft Windows provide mechanisms for dealing with
    these kinds of situations. UNIX uses signals as the primary means for handling
    recognition of events, while Microsoft Windows uses asynchronous procedure calls
    (APCs). Although signals can be used with Microsoft Visual C++, their implementation
    is limited.


    Other conditions for which a handler can be provided are those in which a process
    terminates or when a process is forking processes. Termination handlers can be
    established in Microsoft Windows by using the _onexit or atex routines and the
    _cry__finally block extensions to the Visual C++ compiler. The atex routine is
    an ANSI standard and functions in an identical manner to UNIX. Fork handlers are
    available only in the UNIX environment and are used implicitly to perform various
    housekeeping functions when fork processes are created.


    # UNIX Signals


    A signal is an asynchronous notification of an event. A signal is said to be generated
    for or sent to a process when the event associated with that signal first occurs.
    Examples of such events include hardware faults


    +   * The thread is blocked in a call to sigwait.


    +   * The thread has a signal mask that does not include the type of signal generated.


    Signal masks and the sigwait routine will be discussed later. The kind of response
    given by a process to a signal is determined by the disposition of the signal.
    All threads in a process share the disposition of the signal. Signal disposition
    stays in effect until it is explicitly changed. The three default signal dispositions
    for a process are as follows:


    +   * Process will terminate when the signal is delivered


    +   * Process will terminate as well produce a core dump image of itself


    +   * Process will stop.'
