  md: "# The Microsoft Windows Virtual Memory Management Routines 163\n\nminqueryset\
    \ and maxqueryset to the value of 0xFFFFFFFF causes the virtual memory manager\
    \ to trim the working set of the process to 0, causing the process to be swapped\
    \ out of memory. In Windows NT 2000, the PROCESS_SET_QUOTA right is required to\
    \ use this routine. Understand that setting a process's working set does not guarantee\
    \ the requested memory will be reserved. Depending on the current memory demand\
    \ in the system, the working set of the process can still be reduced. Calling\
    \ VirtualLock is the only way to guarantee pages will not be swapped out.\n\n\
    # The VirtualUnlock Routine\n\nRoutine VirtualUnlock is used to unlock a specified\
    \ range of pages in the virtual address space of a process, enabling the system\
    \ to swap the pages out of memory to the paging file if necessary. Routine VirtualUnlock\
    \ has the following calling sequence:\n\n```\nBOOL VirtualUnlock (\n  LPVOID address,\n\
    \  DWORD size);\n```\n\nArgument address is a pointer to the base address of the\
    \ region of pages to be unlocked. Argument size specifies the amount of memory\
    \ in bytes that is to be unlocked.\n\n# The VirtualProtect Routine\n\nRoutine\
    \ VirtualProtect is used to change the access protection on a region of committed\
    \ pages in the virtual address space of the calling process. Routine VirtualProtect\
    \ has the following calling sequence:\n\n```\nBOOL VirtualProtect (\n  LPVOID\
    \ address,\n  DWORD size,\n  DWORD newprotect,\n  DWORD oldprotect);\n```\n\n\
    Argument address specifies the base address of the region of pages whose access\
    \ protection attributes are to be changed. The pages cannot span adjacent regions\
    \ that were allocated by separate calls to VirtualAlloc or VirtualAllocEx. The\
    \ size argument specifies the size in bytes of the region affected by the access\
    \ protection attribute change. Argument newprotect indicates the new protection,\
    \ as described in Table 5.3. The oldprotect argument is a pointer to a variable\
    \ that the routine sets to the previous access protection value of the first page\
    \ in the specified region of pages. All pages must be committed for VirtualProtect\
    \ to work."
