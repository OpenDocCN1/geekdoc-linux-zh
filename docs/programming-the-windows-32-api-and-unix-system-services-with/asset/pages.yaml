    # File Attributes using stat, fstat, and lstat


    The stat, fstat, and lstat functions obtain information about a particular file
    and have the following calling sequence:


    ```

    int stat(const char *path, struct stat *buf);

    ```


    ```

    int lstat(const char *path, struct stat *buf);

    ```


    ```

    int fstat(int fild, struct stat *buf);

    ```


    The stat function obtains information about the file pointed to by path.

    Read, write, or execute permission of the named file is not required, but all
    directories listed in the path name leading to the file must be searchable.

    lstat function obtains file attributes similar to stat, except when the named
    file is a symbolic link; in that case lstat returns information about the link,
    whereas stat returns information about the file link references.

    The fstat function obtains information about an open file known by the file descriptor
    fild, from a successful open function. Argument buf is a pointer to a stat structure
    into which information is placed concerning the file. The contents of the structure
    pointed to by buf include the following members:'
