    # BIG-ENDIAN VERSUS LITTLE-ENDIAN


    One concern when working with heterogeneous machine architectures is how accurately
    certain data will be interpreted when transmitted from one machine to another.
    The accuracy concern is related to what order data are referenced in memory. Although
    most machines are byte-address-oriented, the order in which the bytes are referred
    to can be different. Any data that takes more than a byte to hold under this discrimination:
    shorts, integers, floating point numbers, and so forth. The classic definition
    of what is being described here is called big-endian and little-endian, which
    have the following definitions:


    +   Little-endian describes a computer architecture in which, within a given 16
    or 32-bit word, bytes at lower addresses have lower significance (the word is
    stored ''little-endian-first''). The PDP-11, VAX families of computers, Intel
    microprocessors, and a lot of communications and networking hardware are little-endian.


    +   Big-endian describes a computer architecture in which, within a multitude
    numeric representation, the most significant byte has the lowest address (the
    word is stored ''big-endian-first''). The majority of processors, including the
    IBM 370 family, the PDP-10, the Motorola processor families, and most of various
    RISC designs in mid-1993, are big-endian.


    Several service routines are provided that convert data in native form to network-byte
    order which is big-endian. The routines and their calling sequence are as follows:


    ```

    u_long intohl() / * Unsigned long integer /

    u_long hostlong / * to network byte order */

    ```


    ```

    u_short shorts() / * Unsigned short integer /

    u_short hostshort / * to network byte order */

    ```


    ```

    u_long ntohl() / * Network byte order /

    u_long netlong / * to unsigned long integer */

    ```'
