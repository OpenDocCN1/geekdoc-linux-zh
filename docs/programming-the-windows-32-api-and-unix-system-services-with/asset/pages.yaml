    # chmod & group


    The chmod routine is used to change the access permission mode of a file and has
    the following calling sequence:


    ```

    int chmod ( const char *path, mode_t mode );

    ```


    Argument path specifies the file whose mode is being adjusted. Argument mode represents
    a bit pattern that is interpreted as described in Table 7.9.


    | Symbol | Octal Mask | Meaning |

    |---|---|---|

    | S_ISUID | 0400 | Set user-id on execution. |

    | S_ISGID | 0200 | Set group-id on execution if = 7, 5, 3, or 1; enable mandatory
    file/record locking if = is 6, 4, 2, or 0. |

    | S_ISVTX | 01000 | Save text image after execution. |

    | S_IRWXU | 00700 | Read, write, and execute by owner. |

    | S_IRUSR | 00400 | Read by owner. |

    | S_IWUSR | 00200 | Write by owner. |

    | S_IXUSR | 00100 | Execute (search directory) by owner. |

    | S_IRWXG | 00070 | Read, write, and execute by group. |

    | S_IRGRP | 00040 | Read by group. |

    | S_IWGRP | 00020 | Write by group. |

    | S_IXGRP | 00010 | Execute by group. |

    | S_IRXO | 00007 | Read, write, and execute by others. |

    | S_IROTH | 00004 | Read by others. |

    | S_IWOTH | 00002 | Write by others. |

    | S_IXOTH | 00001 | Execute by others. |'
