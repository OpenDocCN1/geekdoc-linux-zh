  md: '# Connectionless-Oriented Client-Server Architecture


    A family of routines is used to accomplish connectionless-oriented socket communication
    between two processes. Table 6.8 illustrates the steps and what routines are used.


    | Table 6.8 UDP Socket Client-Server Steps and Routines Involved |

    | Server | Client |

    | Create a socket | Create a socket |

    | socket | socket |

    | Assign name to socket | |

    | Perform data transmission | Perform data transmission |

    | recvfrom | recvfrom |

    | sendto | sendto |

    | Housekeeping | Housekeeping |

    | closesocket | closesocket |


    Note that there is no step to guarantee a connection, as was in connection-oriented
    communication with the listen and accept calls. Two other routines are used for
    UDP communications: recvfrom and sendto. The recvfrom from routine blocks until
    a UDP packet arrives on the port. The UNIX routine recvfrom advertises that it
    can also work in a connection-oriented environment; however, it is more commonly
