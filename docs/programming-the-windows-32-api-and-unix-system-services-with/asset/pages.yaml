  md: "# 12 chapter 1 Processes and Threads\n\n# TABLE 1.1 Win32 API Thread Priority\
    \ Classes\n\n| | |\n|---| IDLE_PRIORITY_CLASS | 4 |\n| NORMAL_PRIORITY_CLASS |\
    \ 7 for background, 9 for foreground |\n| HIGH_PRIORITY_CLASS | 13 |\n| REALTIME_PRIORITY_CLASS\
    \ | 24 |\n\nOnce a thread is created under a priority class, it executes at the\
    \ indi-based priority. Threads by default are created in the NORMAL priority class\
    \ and will run at either priority 7 or 9, depending on whether they are in the\
    \ background or foreground (locus of control). Threads can be created under other\
    \ priority classes; however, caution is advised since executing at certain priorities\
    \ may compromise the overall functionality of the system. For IDLE, NORMAL_, and\
    \ HIGH_PRIORITY_CLASS processes, the system dynamically boosts a thread's base\
    \ priority level when events occur that are important to the thread. REALTIME_PRIORITY_CLASS\
    \ processes do not receive dynamic boosts. Priority classes and boosts can be\
    \ managed by the following calls:\n\n```\nBOOL SetPriorityClass (\n    HANDLE\
    \ hProcess,\n    DWORD Class);\n\nDWORD GetPriorityClass (\n    HANDLE hProcess);\n\
    \nBOOL GetThreadPriorityBoost (\n    HANDLE Thread,\n    PBOOL State);\n\nBOOL\
    \ SetThreadPriorityBoost (\n    HANDLE Thread,\n    PBOOL State);\n```\n\nThe\
    \ handle of the process in which the current thread is running is required to\
