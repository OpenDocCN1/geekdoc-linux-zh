    # Sample Microsoft Windows VMM Program


    Example 5-3 demonstrates the use of the Microsoft Windows Virtual Memory Management
    API calls. The programs are best run on a Windows NT 2000 platform, since not
    all of the VMM options are available in Windows 95-98. Two programs are involved:
    vmaction, which solicits commands from the user to perform various memory management
    functions; and vmstatus, which actually performs the memory functions and displays
    the current memory management environment. Two programs are used to make it easier
    to read the status output in a separate window. Also, the status output is produced
    from the process performing the memory management functions, since the region
    address from the VirtualAlloc call is context-sensitive to the calling process.
    Two MS-DOS commands start, vmstatus up in one, then vmaction in the other. Program
    vmstatus will report all activity in its window. No error checking is performed
    when making the VMM calls; therefore, it is possible to experiment with freeing
    up more memory than has committed, or unlocking more pages than have locked.


