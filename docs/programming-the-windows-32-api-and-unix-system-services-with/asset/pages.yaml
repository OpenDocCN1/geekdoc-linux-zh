    \ can be used to determine the current priority of the specified thread. In Windows\
    \ NT/2000, the THREAD_QUERY_INFORMATION privilege is required to use this function.\
    \ The value returned by GetThreadPriority is a relative value and must be combined\
    \ with the known base class priority to get the actual priority of the thread.\n\
    \n# Working with Fibers in Microsoft Windows\n\nA fiber is an unbounded, user-mode\
    \ sequence of code that gets scheduled according to a user-defined scheduling\
    \ algorithm. Unbounded threads in the UNIX world will also be discussed in the\
    \ \"POSIX Thread scheduling\" section. A process may consist of multiple fibers,\
    \ just as it can consist of multiple threads A major difference between threads\
    \ and fibers is that threads execute concurrently, but only one fiber at a time\
    \ is permitted to execute, even on multiprocessor hardware. The fiber mechanism\
    \ is available in Windows NT 2000."
