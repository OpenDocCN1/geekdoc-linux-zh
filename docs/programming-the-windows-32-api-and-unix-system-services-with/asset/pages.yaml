  md: '# ANSI C Memory Routines


    The ANSI C routines traditionally found in UNIX are also supported by Microsoft
    Windows. These routines perform rudimentary memory management storage functions.
    The routines are described as follow:


    ```

    *memblock = void *malloc( size_t size );

    ```


    ```

    *memblock = void *calloc( size_t num, size_t size );

    ```


    ```

    void free ( void *memblock );

    ```


    ```

    *memblock = void *realloc( size_t size );

    ```


    ```

    *memblock = void *alloca( size_t size );

    ```


    The ANSI memory allocation routines are described in Table 5.1.


    | Table 5.1 The ANSI C Memory Allocation Routine Function Descriptions |

    | Routine | Description of Function |

    | malloc | Returns a void pointer *memblock to the allocated space of least size,
    or NULL if there is insufficient memory available; memory area is not initialized
    |

    | calloc | Allocates arrays in memory of size bytes each initialized to 0; returns
    NULL if there is insufficient memory available. |

    | free | Deallocates a region of memory allocated by malloc. calloc, or realloc.
    |

    | realloc | Changes the size of the block pointed to by memblock and returns a
    pointer to the (possibly moved) block The Contents will be unchanged to the lesser
    of the new and old sizes. Returns NULL if there is insufficient memory available.
    |

    | alloca | Allocates bytes in the stack frame of the caller returning a void pointer
    *memblock to the allocated block. This space is freed when the caller returns.
    Returns NULL if there is insufficient memory available. |


