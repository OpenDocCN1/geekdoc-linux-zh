    \ has one more argument than VirtualFree: the handle of the process in which the\
    \ action is to occur.\n\n# The VirtualLock Routine\n\nThe VirtualLock routine\
    \ can be used to specify a memory region of a process's virtual address space\
    \ that will not incur a page fault. VirtualLock has the following calling sequence:\n\
    \n```\nBOOL VirtualLock (\n  LPVOID address,\n  DWORD size \\);\n```\n\nArgument\
    \ address represents the base address of the region of pages to be locked, and\
    \ size is the size of the region in bytes to be locked. The intent of this routine\
    \ is to improve performance by alleviating the frequency of page fault, the opposite\
    \ effect can occur if too many pages are locked down. Locking down too many pages\
    \ can cause less RAM to be available in the system. The maximum default number\
    \ of pages a process can lock down is 30.\n\n# The SetProcessWorkingSetSize Routine\n\
    \nIf a program requires more pages to be locked, it must call the SetProcessWorkingSetSize\
    \ function, which has the following calling sequence:\n\nThe working set of a\
    \ process is the set of memory pages currently visible to the process in physical\
    \ memory. Argument represents the handle of the process whose working set will\
    \ be set. Argument minworkset specifies to the virtual memory manager to keep\
    \ at least this much memory resident in the process whenever the process is executing.\
    \ Argument maxworkset specifies to the virtual memory manager to keep no more\
    \ than this much memory resident in the process whenever the process is executing.\
    \ Setting arguments"
