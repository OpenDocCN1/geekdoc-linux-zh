    argument specifies an optional argument that can be passed to the callback function.
    The cancelflag argument points to a boolean variable that can be used to cancel
    the operation. If this flag is set to TRUE during the copy operation, the operation
    is canceled. The copyflags argument can be set to a combination, as illustrated
    in 4.4.


    | Table 4.4 Routine CopyEx copyflags |

    | COPY_FILE_FAIL_IF_EXISTS | The copy operation fails immediately if the target
    file already exists |

    | COPY_FILE_RESTARTABLE | Progress of the copy is tracked in the target file in
    case the copy fails. The failed copy can be restarted at a later time by specifying
    the values for currentfile and newfilename as used in the call that failed |


