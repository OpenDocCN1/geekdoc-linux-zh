    # POSIX Condition Variables


    Occasionally, a thread running within a mutex needs to wait for an event, in which
    case it blocks. When a thread is waiting for another thread to communicate status,
    it uses a condition variable along with a mutex. Several condition variables may
    be used by threads to signal one another when a task is complete, which allows
    the next waiting thread to take ownership of the mutex.


    A condition variable enables threads to atomically test a condition under the
    protection of a mutual exclusion lock (mutex) until the condition is satisfied.
    If the condition is not true, the thread blocks on the condition variable and
    atomically releases the mutex that is waiting for the condition to change. If
    another thread changes the condition, it may wake up other waiting threads by
    signaling the associated condition variable. Any waiting threads that are reawakened
    will acquire the mutex and evaluate the condition. The logic used for waiting
    for a condition variable to be set is as follows:'
