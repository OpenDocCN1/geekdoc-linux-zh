  md: "# Concurrency Control Functions in the Win32 API\n\nAs with other Win32 create\
    \ calls, all of the concurrency routines return a handle to an object if the call\
    \ is successful. Although they were discussed in Chapter 1, threads and processes\
    \ also can be used as concurrency objects. The Win32 API relies on an object being\
    \ signaled or unsignaled to use it for synchronization purposes. Different objects\
    \ become signaled or unsignaled for different reasons. Table 2.1 lists several\
    \ Win32 objects and the reasons they may become signaled.\n\nTable 2.1 Win32 Objects\
    \ with Reasons for Becoming Signaled\n| Win32 Object | Reason for becoming signaled\
    \ |\n|---|---|\n| Thread | Terminated |\n| Process | Terminated |\n| Mutex | Was\
    \ released |\n| Semaphore | Value becomes > 0 |\n| Event | Explicitly signaled\
    \ |\n| Overlapped file I/O | File I/O completes |\n\nKey functions used when performing\
    \ synchronization are WaitForSingleObject and WaitForMultipleObjects, the calling\
    \ sequences for which follow:\n\n```\nDWORD WaitForSingleObject (\n  HANDLE object,\n\
    \  DWORD timeout\n);\nDWORD WaitForMultipleObjects (\n  DWORD numObjs,\n  CONST\
    \ HANDLE * arrayObjs,\n  BOOL howowait,\n  DWORD timeout\n);\n```\n\nIn Windows\
    \ NT 2000, the handles of the objects must have SYNCHRONIZE access. The routine\
    \ WaitForSingleObject waits for one object to be signaled, whereas WaitForMultipleObjects\
    \ waits for an array of numObjs to be signaled. Understand that this array of\
    \ handles can be a mixture of all sorts of objects that can become signaled. It\
    \ is not impossible to wait for a combination of threads, processes, mutexes,\
    \ or semaphores to become signaled in one call to WaitForMultipleObjects. The\
    \ howowait argument is set to TRUE if the caller desires to wait for all of the\
    \ object handles to become signaled; setting this argument to FALSE allows the\
    \ routine to return any of the object handles report back becoming signaled. The\
    \ timeout value specified in both of these calls indicates how long to wait for\
    \ the objects to become signaled, as follows:"
