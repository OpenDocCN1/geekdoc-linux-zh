    The lock data structure contains all the following data elements:


    +   - short 1_type; /* lock operation type */

    - short 1_whence; /* lock base indicator */

    - off_t 1_start; /* starting offset from base */

    - off_t 1_len; /* lock length; 1_len == 0 means until end of file */

    - long 1_sysid; /* system ID running process holding lock */

    - pid_t 1_pid; /* process ID of holding lock */


    Note the data elements specifying which byte to start and to what extent to perform
    locking within a file. Since the entire file is being locked in this discussion,
    elements—specifically lock\_1\_whence, lock\_1\_start, and lock\_1\_len—will be
    set to 0. Example 2-9 demonstrates the use of the fcnt routine and how file locking
    can be used to perform synchronization. Two programs are illustrated: fcnt1 and
    fcnt12; fcnt12 executes fcnt2. Program fcnt11 will establish an exclusive lock
    for 10 seconds on the file as an argument upon execution. Program fcnt12 attempts
    to acquire a shared lock on the file and indicates its attempt to do so for the
    entire length of time fcnt11 has the exclusive lock in place. Once fcnt11 changes
    the mode to shared, fcnt12 is allowed to establish a lock on the file.


