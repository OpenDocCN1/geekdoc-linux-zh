    # UNIX Signal Handling in Microsoft Windows


    Microsoft Windows Visual C/C++ offers UNIX-like signal capability, supplying basically
    the routines signal and raise. The routine signal is reminiscent of the former
    UNIX signal call, which has been superseded by the POSIX sigaction. Routine signal
    has the following calling sequence:


    ```

    signal (int sig, void *func, int subcode);

    ```


    Argument sig represents the signal value and subcode must be of the following:


    | SIGABRT | Abnormal termination |

    | SIGFPE | Floating-point error |

    | SIGILL | Illegal instruction |

    | SIGINT | CTRL-C interrupt |

    | SIGSEGV | Illegal storage access |

    | SIGTERM | Termination request |


    Be careful if using SIGINT, which is not supported by Windows 95, or NT. When
    a CTRL-C interrupt occurs, a new thread is created to handle the interrupt, which
    is not at all the desired effect, especially if you are writing a portable application
    for a UNIX environment. Argument subcode is an optional subcode affiliated with
    the signal number. The func argument can be set to one of the following:


    +   * The action of a handler that will be executed when sig signal is delivered

    * SIG_DFL, perform default signal disposition action for sig

    * SIG_IGN, ignore sig'
