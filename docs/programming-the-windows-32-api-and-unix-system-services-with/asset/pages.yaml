    memory from storage that can be managed specifically by a family of memory management
    routines. There are many heap routines. The following section categorizes several
    of the routines that are typically related in use.


    ```

    GetProcessHeap, HeapAlloc, HeapReAlloc, HeapSize, and HeapFree

    ```


    Routine GetProcessHeap gets the handle of the heap of the calling process and
    has the following calling sequence:


    ```

    HANDLE GetProcessHeap (VOID);

    ```'
