    # SEH: Exception Handlers


    Exception handlers are used to capture execution malfuncs such as divides by 0,
    floating-point overflows, and addressing errors. Exception handlers are implemented
    with a try-except block as follows:


    ```

    // Code executed before try ... except block

    __try{

    Code you suspect an exception may occur

    ...

    }

    __except (exception filter)

    {

    This section of code may execute on behalf of the exception condition occurring
    depending on the exception filter

    ...

    }

    // Code executed after exception block occurs or if no exception occurs

    ```


    The try-except block is different from the try-finally block in that the except
    may not necessarily execute. If no exception occurs, or depending on the outcome
    of the exception filter, the code in the except block is ignored. The exception
    filter outcome can be one of the following:


    +   - own_EXECUTE_HANDLER

    - own_CONTINUE_SEARCH

    - own_CONTINUE_EXECUTION

    - Output from an evaluation function


    Table 3.2 indicates what action occurs, depending on the exception filter evaluation.


    Example 3-8 demonstrates the basic idea of an exception handler. The sample code
    from Example 3-7 is used, but, instead of a break statement and a try-finally
    block, an arithmetic divide by 0 and a try-except block have been put'
