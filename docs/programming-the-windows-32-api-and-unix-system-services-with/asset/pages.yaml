    \ system ACL in a specified security descriptor. |\n| SetSecurityDescriptorDacl\
    \ | Sets information in a discretionary ACL. If a discretionary ACL is already\
    \ present in the security descriptor, it is replaced. |\n| SetSecurityDescriptorSacl\
    \ | Sets information in a system ACL. If a system ACL is present in the security\
    \ descriptor, it is replaced. |\n| InitializeSecurityDescriptor | Initializes\
    \ a new security descriptor. |\n\n# GetKernelObjectSecurity\n\nThis routine is\
    \ used to retrieve copy of the security descriptor protecting a kernel object\
    \ and has the following calling sequence:\n\n```\nBOOL GetKernelObjectSecurity(\n\
    \    HANDLE handle,\n    SECURITY_INFORMATION requestedinfo,\n    PSECURITY_DESCRIPTOR\
    \ secdesc,\n    DWORD len,\n    LPDWORD lenreturned\n);\n```\n\nArgument handle\
