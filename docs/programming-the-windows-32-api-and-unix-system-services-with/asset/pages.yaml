  md: '# 204 Chapter 6 Networking and Other Communication Mechanisms


    The Transport Control Protocol (TCP) is the connection-oriented protocol and can
    work between two end-points over a wide area.


    In either case, a few concepts should be clear before attempting to use these
    facilities. A socket is a key component to perform this kind of communications.
    The most commonly used socket interface is that developed at Berkeley in the early
    1980s. A socket represents a data structure used to create a channel to send and
    receive data between different processes. A socket can also be thought of as a
    communication end-point.


    This section of the chapter discusses writing client and server programs. A TCP
    server must create a socket, bind the socket to a port, and allow the port to
    begin listening to universally accepted connections. A client must create a socket
    and connect it to a port on a different machine.


    Two types of sockets are typically used: stream and datagram. Table 6.6


    | Table 6.6 Description of Two Major Socket Types |

    | Socket Type | Description |

    | Stream | 1. Provides reliable communications.

    2. Communication is full-duplex.

    3. Logical connection is created prior to data transmission and maintained by
    each end of the connection.

    4. Data are processed in order, in the same sequence that they are sent. |

    | Datagram | 1. Is potentially unreliable.

    2. Communication is full-duplex.

    3. No logical connection is established prior to data transmission.

    4. Each datagram is processed independently. |


    # Connection-Oriented Client-Server Architecture


    A family of routines is used to accomplish connection-oriented socket communication
    between two processes. Table 6.7 illustrates the steps and what routines are used.


    A socket is created by calling the socket routine, which has the following calling
    sequence:


    ```

    int socket(int domain, int type, int protocol);

    ```


    Argument domain specifies the network address family to which the socket will
    be associated. Two values are typically AF_UNIX or AF_INET. AF_UNIX addressing
    uses UNIX pathways to identify these sockets are useful for communications between
    processes on the same machine. AF_INET addressing uses Internet addresses, which
    are'
