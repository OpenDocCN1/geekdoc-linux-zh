    # The setjmp and siglongjmp Routines


    The setjmp and siglongjmp are the POSIX versions of the former setjmp and longjmp
    routines. These act like a goto statement. The setjmp is used to remember a location
    and context in a program, whereas the siglongjmp is used to transfer control back
    to that point with the saved context. The text referred here is primarily the
    current contents of the general purpose registers and stack environment. Sometimes
    it is convenient to transfer control like this out of a signal handler rather
    than letting the return occur from the handler. The calling sequence to these
    routines is as follows:


    ```

    int setjmp(sigjmp_buf env, int savemask);

    ```


    ```

    void siglongjmp(sigjmp_buf env, int val);

    ```'
