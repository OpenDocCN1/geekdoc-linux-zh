  md: '# Processes and Threads


    CHAPTER OBJECTIVES


    +   - Creating Threads in Microsoft Windows........ 2

    - Creating Processes in Microsoft Windows........ 16

    - Creating POSIX Threads in UNIX........ 20

    - The Linux _clone() Routine........ 40


    Processes and threads can be created and managed in a variety of ways on both
    Microsoft Windows and UNIX platforms. Microsoft Windows 95, 98, and NT, processes
    and threads are created and controlled by using the Win32 API. Solaris and Linux
    Red Hat UNIX both have libraries that support POSIX threads.


    It is important to understand the concept of processes and threads. A process
    can be considered single-threaded or multithreaded. Processes have traditionally
    been thought of as processes consisting of a single thread of execution. A single-threaded
    process performs a series of tasks, one at a time, during its execution lifecycle.
    A single-threaded process might perform an initialization loop here, then go to
    call a subroutine and return, perform a terminate. A multithreaded process consists
    of more than one thread of execution occurring at the same time. One way to appreciate
    how a multithreaded process works is to imagine your single-threaded program making
    a series of calls to various subroutines. In a multithreaded program, each call
    to one of these subroutines creates a separate thread of execution, like a small
    process within a process. Threads are sometimes'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Chapter 1 Processes and Threads


    referred as lightweight processes (LWPs). And, just like subroutines, threads
    share the same memory space and have access to globally defined data. Sometimes
    it''s easier to imagine a real-life scenario when trying to understand a multithreaded
    application. Suppose you wanted to paint the interior of your house. You want
    to paint the living room, the kitchen, and two bedrooms. If you were doing the
    job yourself—or, in other words, you would probably start by painting the living
    room, then the kitchen, then one bedroom, and finally the other bedroom. It would
    probably take you a day to each room. Now suppose you acquired three friends to
    do the kitchen and two bedrooms while you do the living room. Now you have a multithreaded
    application where each friend and you are acting as separate threads. Instead
    of taking four days, you finish all four rooms in one day.


    Multithreaded applications can be configured in several different ways. One type
    of application can be designed so that each thread has a very distinct function.
    For example, you could design an application such that one thread is waiting for
    an IO response from a terminal screen, another is sorting data in a disk file,
    and another is waiting for the other two to finish before it can complete its
    task. Another type of application can be designed so there are multiple instances
    of the same thread. This kind of configuration is convenient when all the threads
    are working toward a common goal. Consider a multithreaded program that would
    determine the first 1,000 prime numbers. You could create a collection of threads
    that all be computing the next prime number concurrently. All of the code for
    these threads would be identical, since they are all performing the exact same
    function.


    # Creating Threads in Microsoft Windows


    Threads are created similarly in Microsoft Windows 95, 98, and NT using the CreateThread
    Win32 API call, which has the following calling sequence:


    ```

    HANDLE CreateThread(

    LPSECURITY_ATTRIBUTES lpAttributes,

    DWORD dwStackSize,

    LPTHREAD_START_ROUTINE lpStartAddress,

    LPVOID lpParameter,

    DWORD dwCreationFlags,

    LPWORD lpThreadId

    )

    ```


    A thread is considered an object by the Win32 API, and a handle is returned upon
    its successful creation. This handle can be used in other Win32 API functions
    to control the thread. The lpThreadAttributes refers to a'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Creating Threads in Microsoft Windows


    used to define security characteristics about the thread. This security data structure
    can be set up to define who can access this thread and what actions they can specifically
    perform against it. For now, we will perform NULL in our examples for the argument
    and discuss security issues in Chapter 7. All the Win32 API creation calls contain
    this argument. The security functions are available only in Windows NT 2000.


    The dwStackSize argument is used to indicate the initial size of a stack data
    structure that is context-specific to this thread. A value of NULL is generally
    passed to the call requesting the default stack size. The stack memory is allocated
    from the process when the thread is created and given back to the system when
    the thread terminates. The stack can grow in size if necessary during the execution
    lifetime of the thread.


    The lpStartAddress argument specifies the entry point name of the thread routine
    and is typically prototyped as:


    ```

    DWORD WINAPI ThreadFunction(LPVOID);

    ```


    ```

    void ThreadFunction()

    ```


    In a single-threaded application you would consider this a subroutine point.


    Although a thread can access data shared in a globally defined area, the lpParameter
    argument represents a 32-bit value that can optionally be passed to the thread.
    (Example 1-2 demonstrates the use of this argument.)


    TheCreationFlags argument specifies additional flags that control the creation
    of the thread. The CREATE_SUSPENDED flag is the only value currently supported
    and causes the thread to be created in a suspended state. The thread cannot run
    again until the ResumeThread function is called. If this value is NULL, the thread
    runs immediately upon being created.


    The lpThreadId is a pointer to a 32-bit value that is returned representing the
    system id assigned to the thread.


    As with Win32 API objects, a thread object remains in the system until a CloseHandle
    call is performed. CloseHandle has the following calling sequence:


    ```

    BOOL CloseHandle ( HANDLE Object );

    ```


    Argument Object is the handle of the object that is closed.


    If a thread is using any of the C runtime libraries or is relying on information
    from shared system variables such as errno, the routines _beginthread or _beginthreadex
    should be used. These routines care of reentrancy and memory leak problems that
    can occur with CreateThread. The calling sequences to _beginthread and _beginthreadex
    are as follow:'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# 4 Chapter 1 Processes and Threads


    ```

    unsigned long _beginthread (

    void (   _cdecl *start_address ) ( void *),

    unsigned stack_size,

    void *arglist

    );


    unsigned long _beginthreadex (

    void *security, unsigned stack_size,

    unsigned (   _stdcall *start_address ) ( void *),

    void *arglist,

    unsigned initflag,

    unsigned *thrdaddr

    );

    ```


    The_beginthread call requires three arguments: the thread entry point, the initial
    stack size, and an optional thread entry point. __cdecl *start_address ) ( void
    *) is the only required argument. The _beginthreadex call is similar to the Create-Thread
    call. The process.h header and one of the multithreaded runtime libraries are
    required to build programs with the _beginthread routines. You can call _endthread
    or _endthreadex explicitly to terminate a thread in this fashion. Terminating
    a thread with a call to _endthread or _endthreadex ensures proper recovery of
    resources allocated for the thread. _endthread automatically closes the thread
    handle in contrast to _endthreadex, which does not. Therefore, when using _beginthread
    and _endthread, do not call the Win32 API routines CloseHandle or ExitThread.
    The calling sequence for _endthread and _endthreadex is as follows:


    ```

    void _endthread(void);

    _endthreadex (unsigned valret );

    ```


    Argument retval is the thread exit code. To build with _beginthread or _endthread
    in Visual C C++, be sure to set the C/C++ project settings category to CodeGeneration
    and use the debug multithreaded library.


    # Sample Threads Program


    Example 1-1 shows the code of a program that demonstrates threads. The program
    consists of three threads that increment the values of three shared variables
    as counters. The program begins by starting the three threads, Threadktr1, Threadktr2,
    and Threadktr3, then waits for someone to hit the RETURN key, at which time it
