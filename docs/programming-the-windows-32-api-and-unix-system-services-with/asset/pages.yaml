    in the Microsoft world, Windows NT and 2000 contain all of the security features,
    whereas Windows 95 and 98 do not support any of these functions.


    # Microsoft Windows Security: Access Tokens and Security Descriptors


    After years with virtually no security mechanism for the MS-DOS and Windows environments,
    Microsoft designed an extremely comprehensive environment within Windows NT 2000.
    Security in Windows NT 2000 is based on two components, which play together to
    form an all-inclusive method of protecting system resources. One of these components
    is called an access token and is typically created when a user logs into the system.
    The access token can be thought of as a key, just like a key you would use to
    unlock a door. The other component is the security descriptor, which acts as a
    lock on a system object. By using the access token as a key, the “fit” of the
    key into the security descriptor determines what actions are allowed on the object.
    Not only can specific actions be controlled on the object, but an auditing trail
    can be created as well. An access token actually identifies the following:


    +   * the security identity (SID) for the user''s account,

    * SIDs for the groups of which the user is a member,

    * a logon SID that identifies the current logon,

    * a list of the privileges held by either the user or the user''s groups,

    * an owner SID,

    * the default discretionary ACL the system uses when the user creates a secure
    object without specifying a security descriptor.

    * the source of the access token,

    * whether the token is a primary or impersonation token,

    * current impersonation levels, and

    * other statistics.


    Access tokens can come in two forms: the primary access token and the impersonation
    access token. An impersonation access token is created to capture the security
    information affiliated with a client process, allowing a server to “impersonate”
    the client process in security operations.'
