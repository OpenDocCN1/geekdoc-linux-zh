    > Networking is an integral part of all computer systems today. As interprocess
    communication is a close cousin to networking, it will be discussed in this chapter
    as well. The distinction is worthy; since some forms of interprocess communication
    do not rely on a network using a protocol such as TCP/IP.


    Both UNIX and Microsoft Windows provide many facilities for performing networking
    and interprocess communication tasks. By using the winsock library in Windows,
    it is possible to flexibly code TCP or UDP-oriented client-server programs that
    run between UNIX and Microsoft Windows environments.

    Network communications can take place in a connection-oriented manner as well
    as a connectionless-oriented communication is very much like depositing a letter
    in the mailbox and assuming it will get to the recipient, although there really
    is no guarantee. Connectionoriented communication is more like what happens when
    you talk over the telephone: You have a guaranteed communication path, and you
    know with whom you are communicating. The communication facilities discussed in'
