    The name argument is a character string containing the name of the file to be
    accessed. The next argument, flags, is an integer that specifies how the file
    is to be opened. This argument can be set to many values, but some of the frequently
    used values are:


    +   - O_RDONLY Open for reading only.

    - O_WRONLY Open for writing only.

    - O_RDWR Open for reading and writing.

    - O_CREAT If it exists, this argument has no effect except noted under O_EXCL;
    otherwise, the file is created.

    - O_EXCL If O_CREAT and O_EXCL are set, open fails if the file exists. The check
    for the existence of the file if it does not exist is atomic with respect to other
    processes executing opening the same filename in the same directory with O_EXCL
    and O_CREAT set if the effect is undefined.


    The perms argument describes permissions and, for our discussion, will be set
