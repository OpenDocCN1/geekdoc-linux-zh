    \ I/O has completed. Notice the 0 argument in the WaitSingleObject, which means\
    \ an immediate return occurs. The status returned from WaitSingleObject indicates\
    \ the status of the event object. As long as a timeout is passed (WAIT_TIMEOUT\
    \ back, WaitForSingleObject will be continuously called.\n\n# USING APCS WITH\
    \ ReadFile and WriteFile\n\nAs discussed in Chapter 3, asynchronous procedure\
    \ calls (APCs) can be convenient devices for making program execution more efficient.\
    \ Keeping this in mind, with regard to doing reads and writes to a file, rather\
    \ than wait for I/O to complete, your program can go on doing useful work and\
    \ be automatically notified when the I/O is complete. The Ex forms of ReadFile\
    \ and WriteFile have one more argument that provides for the specification of\
    \ an APC routine address. This APC routine is executed when the I/O is complete,\
    \ be reminded that the thread must be placed into an alertable state, or the APC\
    \ routine will never execute. The calling sequence for ReadFile as follows:\n\n\
    ```\nBOOL ReadFileEx (\n    HANDLE file,\n    LVOID buffer,\n    DWORD bytestoread,\n\
    \    DWORD bytesread,\n    LPOVERAPPED overlap,\n    LPOVERAPPED_COMPLETION_ROUTINE\
    \ apc)\n```\n\nThe completion routine has the following entry-point specification:\n\
    \n```\nVOID WINAPI CompletionRoute(\n    DWORD error,\n    DWORD transferred,\n\
    \    LPOVERAPPED overlapped)\n```\n\nThe error parameter can be set to one of\
    \ the following values:\n\n```\nSuccess\nERROR_HANDLE_EOF ReadFileEx tried to\
    \ read past end of the file\n```\n\nThe transferred parameter will contain the\
    \ number of bytes transferred, or 0 if there was an error. The overlapped parameter\
    \ points to the overlapped structure specified in the asynchronous I/O routines.\
    \ When the overlap structure is passed in this manner, Windows does not use the\
