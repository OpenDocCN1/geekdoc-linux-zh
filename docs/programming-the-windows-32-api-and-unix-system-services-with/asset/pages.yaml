    # POSIX Thread Scheduling


    Thread scheduling can be controlled by specifying four different attributes:


    +   1) contentionscope

    2) inheritedched

    3) schedpolicy

    4) schedparam


    Thread scheduling scope can be established in two different modes, called bounded
    and unbounded. A bounded thread competes with threads systemwide for the CPU,
    while unbounded threads compete only within the context of their parent process.
    The operating system kernel is responsible for scheduling bounded threads, while
    unbounded threads are scheduled by a mechanism built into your process. Whether
    a thread is bounded or unbounded is controlled by one of four thread attributes
    contentionscope. Attribute contention can be set to PTHREAD_SCOPE_PROCESS for
    an unbounded thread or to PTHREAD_SCOPE_SYSTEM for a bounded thread. An application
    can be written that contains both bounded and unbounded threads. A thread can
    inherit a scheduling policy and associated attributes by using the inherited attribute.
    If inheritedsch is set to PTHREAD_INHERIT_SCHED, the scheduling policy and associated
    attributes are inherited from creating the thread; if it is set to PTHREAD_EXPLICIT_SCHED,
    the scheduling policy and associated attributes of the new thread are obtained
    from the schedpolicy and schedparam arguments. Attribute schedpolicy can be set
    to any one of the values described in Table 1.3.


    | POSIX-Scheduling Policy | Policy Scheduling Behavior |

    | --- | --- |

    | SCHED FIFO | System keeps a list of threads containing a particular priority
    value: a thread ready to execute is placed on the tail of its priority list; system
    chooses the thread from the head of the highest priority list; thread executes
    until one of the following occurs. |


    +   1) terminates,

    2) it goes into a wait for state for something, or

    5) it is preempted by a higher priority'
