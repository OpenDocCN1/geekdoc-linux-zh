  md: "# The VirtualQuery Routine\n\nRoutine VirtualQuery is used to provide information\
    \ about a range of pages in the virtual address space of the calling process and\
    \ has the following call-sequence:\n\n```\nDWORD VirtualQuery (\n    LPVOID address,\n\
    \    MEMORY_BASIC_INFORMATION buffer,\n    DWORD bufiz);\n```\n\nArgument address\
    \ represents the base address of the region of pages for which the query is performed.\
    \ The address range is rounded down to the next page boundary. Argument buffer\
    \ is a pointer to a MEMORY_BASIC_INFORMATION structure which the query is returned,\
    \ and bufiz is the size of this buffer in bytes. VirtualQuery determines the attributes\
    \ of the first page in the region and scans subsequent pages until the entire\
    \ address range is scanned, or until a page with a non-matching set of attributes\
    \ is encountered. VirtualQuery relies on the following criteria to be in effect\
    \ for the region of pages scanned: etc.\n\n+   * The state of all the pages are\
    \ the same: MEM_COMMIT, MEM_RESERVE.\n* All pages in the region are the result\
    \ of a single call to VirtualAlloc.\n* The access attribute for all the pages\
    \ is the same: PAGE_READWRITE, etc.\n\nRoutine VirtualQueryEx also exists to scan\
    \ a region of pages in another process's address space. As with all the other\
    \ Ex forms of the virtual memory management routines, an additional first argument\
    \ specifies the handle of the process whose address space is to be queried. The\
    \ MEMORY_BASIC_INFORMATION structure has the following layout:\n\n```\ntypedef\
    \ struct MEMORY_BASIC_INFORMATION {\n    PVOID address,\n    allocbaseaddress,\n\
    \    PVOID\n    DWORD allocprot,\n    DWORD regsize,\n    DWORD state,\n    DWORD\
    \ type);\n} MEMORY_BASIC_INFORMATION;\ntypef MEMORY_BASIC_INFORMATION *PMEMORY_BASIC_INFORMATION;\n\
    ```\n\nTable 5.5 describes the meaning of all elements that are part of the MEMORY_BASIC_INFORMATION\
    \ structure."
