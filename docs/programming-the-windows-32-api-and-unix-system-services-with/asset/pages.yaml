    \ for file\");\n\n    while ((n = read(fd, str, 100)) > 0)\n        write(1, str,\
    \ n);\n\n    close(fd);}\n```\n\nThis program can be run from a command line in\
    \ UNIX with a single argument specifying a file name. For example, if the program\
