    TABLE 6.4 Value Definitions for pipemode Argument Used with the CreateNamedPipe
    API


    | Mode | Meaning |

    |---|---|

    | Type PIPE_TYPE_BYTE | Data are written to the pipe as a stream of bytes.This
    mode cannot be used with PIPE_READMODE_MESSAGE. |

    | PIPE_TYPE_MESSAGE | Data are written to the pipe as a stream of messages.This
    mode can be used with either PIPE_READMODE_MESSAGE or PIPE_READMODE_BYTE. |

    | Read Mode PIPE_READMODE_BYTE | Data are read from the pipe as a stream of bytes.This
    mode can be used with either PIPE_TYPE_MESSAGE or PIPE_TYPE_BYTE. |

    | PIPE_READMODE_MESSAGE | Data are read from the pipe as a stream of messages.This
    mode can be used only if PIPE_TYPE_MESSAGE is also specified. |


    Wait Mode


    +   - PIPE_WAIT: Blocking mode is enabled. When the pipe handle is specified in
    the ReadFile,WriteFile or ConnectNamedPipe function, the operations are not completed
    until there is data to read, all data are written, or a client is connected.Use
    of this mode can wait indefinitely in situations for a client process to perform
    an action

    - PIPE_NOWAY: Nonblocking mode is enabled. In this mode,ReadFile,WriteFile and
    ConnectNamedPipe always return immediately.This mode is not to be used achieve
    asynchronous I/O with named pipes


