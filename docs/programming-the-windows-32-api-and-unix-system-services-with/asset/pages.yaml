    | Value of psared | Meaning |

    |---|---|n| 0 | Cannot be shared with other processes. only by threads within
    the process |

    | *0 | Can be shared by threads in other processes |


    Once a semaphore is initialized from having called sem_init(), routines sem_wait()
    and sem_post() are used around the critical section code:

    sem_wait(sem_t *sem); /* P(S) or Wait(S)


    # Critical section code


    sem_post(sem_t *sem); /* V(S) or Signal(S)

    The sem_trywait() routine is be used to conditionally acquire a semaphore. Upon
    calling this routine, the semaphore will be acquired if it is available—if, its
    value is greater than 0. If the semaphore is not available, its value is less
    than or equal to 0; this routine will return a -1 and will set the errno variable
    to BUSY.


    Routine sem_getvalue() returns the current value of the semaphore. Caution is
    advised here, since this value may change from other concurrent sem_wait() or
    sem_post() calls. Example 2-5 is a recreation of the producer consumer scenario
    with Visual C/C++ in Microsoft Windows in Example 2-3.


