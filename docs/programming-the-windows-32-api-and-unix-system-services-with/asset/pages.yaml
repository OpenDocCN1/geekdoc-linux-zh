  md: "# Microsoft Windows Overview of FAT and NTFS\n\n# The CreateFile, ReadFile,\
    \ and WriteFile Routines\n\nCreateFile, ReadFile, and WriteFile are the Win32\
    \ API routines for creating, referencing, and performing I/ O to files. The calling\
    \ sequences for Read-File and WriteFile are identical. except for the implications\
    \ of the direction of the data transfer. ReadFile and WriteFile both require a\
    \ file handle obtained from a call to CreateFile, which has the following calling\
    \ sequence:\n\n```\nCreateFile (\n    LPCTSTR filename,\n    DWORD access,\n \
    \   DWORD mode,\n    LPSECURITY_ATTRIBUTES secattr,\n    DWORD createaction\n\
    \    DWORD flag,\n    HANDLE templatefile );\n```\n\nThe CreateFile function is\
    \ more robust and does more than create a file; it actually creates or opens files,\
    \ pipes, mails, several other objects and returns a handle that can be used to\
    \ access the object. For the focus of this chapter, argument filename points to\
    \ a null-terminated string that specifies the name of the file. Argument access\
    \ specifies the desired type of access to the file as follows:\n\n+   0\nCan query\
    \ file attributes\nGENERIC_READ Can read from the file and move file pointer\n\
    GENERIC_WRITE Can write to the file and move file pointer\n\nThe mode argument\
    \ is used to indicate how the file can be shared and can be set to a combination\
    \ of the following:\n\n+   FILE_SHARE_DELETE Works for Windows NT/ 2000. Subsequent\
    \ operations on the object will succeed only if delete access is requested.\n\
    FILE_SHARE_READ Subsequent operations on the object will succeed only if read\
    \ access is requested.\nFILE_SHARE_WRITE Subsequent operations on the object will\
    \ succeed only if write access is requested.\n\nThe secattr argument refers to\
    \ a security attributes structure valid only in Windows and Windows 2000. Information\
    \ about the security attributes argument will be discussed in Chapter 7. The createaction\
    \ specifies which action to take on files that exist, and which action to take\
    \ when files do not exist. Argument createaction must be set to one of the following\
    \ values:"
