  md: "These functions are performed atomically and can be represented mathematically\
    \ as follows:\n\n```\nP(S) or Wait(S):    if ( S <= 0 ) then wait here;\n    \
    \                           else\n                               S := S - 1;\n\
    ```\n\n```\nV(S) or Signal(S):   S := S + 1;\n```\n\nThe idea here is that the\
    \ user would precede the critical section by calling P(S), and upon exiting the\
    \ critical section would call V(S). The semaphore variable (S) must also be initialized\
    \ to value. If S is initialized to 1, the value of S changes from 0 to 1 and is\
    \ therefore referred to as a binary semaphore. S can be initialized to any positive\
    \ integer value and, in this case, it is called a counting semaphore. Notice how\
    \ the logic of the mathematical function of P(S) allocating a fixed number of\
    \ shared resources. Once the semaphore value becomes 0, the calling thread is\
    \ made to wait until the value of the semaphore becomes greater than 0.\n\nSemaphores\
    \ in the Win32 API are created with the CreateSemaphore routine as follows:\n\n\
    ```\nHANDLE CreateSemaphore (\nLPSECURITY_ATTRIBUTES LpsSemaphoreAttr,\nLONG initCount,\n\
    LONG maxCount,\nLPCTSTR name );\n```\n\nThe security attributes argument points\
    \ to a structure valid only in Windows NT/2000. The initCount argument specifies\
    \ an initial count for the semaphore object. The value must be greater than or\
    \ equal to 0 and less than equal to maxCount. A semaphore is signaled when its\
    \ count is greater than 0 and non-signaled when it is 0. Whenever a wait function\
    \ releases a thread that was waiting for the semaphore, the semaphore count is\
    \ decreased by 1. The count is increased by a specified amount by calling the\
    \ ReleaseSemaphore function, which is explained below. The name argument points\
    \ to a null-terminated string specifying the name of the semaphore object. This\
    \ argument can be omitted, in which case the semaphore is given a null name.\n\
    \nIf the semaphore has already been created, the OpenSemaphore routine can be\
    \ used to enable multiple processes to open handles of the same semaphore object.\
    \ It is called as follows:\n\n```\nHANDLE OpenSemaphore (\nWORD Access,\nBOOL\
    \ InheritFlag,\nLPCTSTR Name );\n```\n\nThe access argument specifies Windows\
    \ NT/2000 access rights and can be set to any of the following three values:"
