  md: 'A process can do one of the following to change the disposition of the signal:


    +   - It can ignore the signal—that is, act like it has never occurred.

    - It can catch the signal and execute a handler routine.

    - It can block the signal—that is, not recognize it right now but maybe

    process it later.


    Be careful to understand the difference between a blocked signal and an ignored
    one. Ignored signals are discarded upon delivery; blocked signals are held off
    until they are unlocked. In a multithreaded environment, signals can be blocked
    and unlocked on a per-thread basis. The signal mask defines which signals are
    blocked and which are unlocked for a process. How the signal mask is defined and
    a signal handler routine is specified in the following sections. Table 3.1 lists
    some classic signals and their characteristics.


    | Signal Name | Signal Description | Default Disposition |

    | --- | --- | --- |

    | SIGINT | Interrupt (CTRL-C) | Exit |

    | SIGILL | Illegal instruction | Core dump |

    | SIGFPE | Arithmetic exception | Core dump |

    | SIGKILL | Killed | Exit |

    | SIGBUS | Bus error | Core dump |

    | SIGALRM | Alarm clock | Exit |

    | SIGTERM | Terminated | Exit |

    | SIGUSR1 | User signal 1 | Exit |

    | SIGSEGV | Segmentation fault | Core dump |

    | SIGCHLD | Child status change | Ignored |


    # Establishing a UNIX Signal Handler


    A signal handler is one to handle the disposition of a signal. The handler is
    established by calling routine sigaction, which has the following calling sequence:


    ```

    sigaction (signum, &curact, &oldact);

    ```


