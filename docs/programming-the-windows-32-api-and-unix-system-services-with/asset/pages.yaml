    \ in fd[0], and the descriptor associated with the write end of the pipe is stored\
    \ in fd[1]. The following are rules that apply to a process using an unnamed pipe:\n\
    \n+   Reading rules...\n- If a process reads from a pipe whose write end is closed,\
    \ it will receive an end-of-file indication; read will return a 0.\n- If a process\
    \ reads from a pipe whose write end is still open and there is no data to read,\
    \ it will sleep until some data become present.\n- If a process attempts to read\
    \ more data than exist in the pipe, all data are returned along with the actual\
    \ byte count.\n\n+   - If the process attempts to write to a pipe whose read end\
    \ has been closed, the write will generate a SIGPIPE signal and cause the process\
    \ to terminate.\n- If the pipe can accommodate the amount of data being written\
    \ by a process, the write operation is guaranteed to complete without being preempted\
    \ by another process.\n- If the pipe is unable to accommodate the amount of data\
    \ being written by a process, the write operation is not guaranteed to complete\
    \ without being preempted by another process.\n\nUnnamed pipes are available only\
    \ within the context of the process that creates them. The pipe functions are\
    \ like a first-in-first-out queue. A process writing to a pipe places data into\
    \ one end of the queue, and a process reading from the pipe removes data from\
