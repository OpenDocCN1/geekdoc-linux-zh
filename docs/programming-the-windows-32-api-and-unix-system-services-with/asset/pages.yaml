    \ PROCLOCK | Lock text and data segments into memory. |\n| TXTLOCK | Lock text\
    \ segment into memory. |\n| DATLOCK | Lock data segment into memory. |\n| UNLOCK\
    \ | Remove locks. |\n\n# The IPC Shared Memory Routines\n\nUNIX provides a family\
    \ of routines that are part of the Interprocess Communication (IPC) library: shget,\
    \ shmctl, shm, and shmat. Example 4-14 in the last chapter demonstrated the use\
    \ of ftok, shmat, shget, and shmctl. These routines are based on an identifier\
    \ obtained from specifying a key, which is passed to the shget call, that has\
    \ the following calling sequence:\n\n```\nint shget(\n  key_t key,\n  size_t size,\n\
    \  int shmflg)\n```\n\nArgument can be set to IPC_PRIVATE or to some unique value.\
    \ Mentioned previously, key is set to a return value from the ftok routine. Any\
    \ process can access itself with this shared memory area as long as permissions\
    \ are appropriate. Argument size represents the minimum number of bytes that the\
    \ shared memory area will be. The shmflag argument represents the permissions\
    \ bits afflicted with the shared memory segment. Routine shmat attaches the shared\
    \ memory segment associated with the shared memory identifier specified by shmid.\
    \ Although routine shmat was used in Example 4-14, it was not described there.\
    \ Its discussion being more meaningful in this chapter. has the following calling\
    \ sequence:\n\n```\nvoid shmat(\n  int shmid,\n  const void *shmadr,\n  int shmflag)\n\
    ```"
