    \ value that identifies the security information being requested, as described\
    \ in Table 7.6. If the secdesc and len arguments are set to NULL, the GetKernelObjectSecurity\
    \ routine may be called to retrieve the buffer size required to receive the specific\
    \ descriptor information desired."
