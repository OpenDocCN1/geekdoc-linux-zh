  md: '# Microsoft Windows Security: Access Tokens and Security Descriptors 225


    A security identifier (SID) is a value used to identify an account. Each account
    has a unique SID issued by an authority, such as a Windows NT/2000 server domain,
    and stored in a security database. Each time a user logs on, the system retrieves
    the user''s SID from the database and places it in the user''s access token. The
    system uses the SID in the user''s access token to identify the user in all subsequent
    interactions with Windows 2000 security. When a SID has been used as the unique
    identifier for a user or group, it cannot ever be used to identify another user.


    The security descriptor identifies the owner and the primary group to which he
    belongs. The security descriptor can also contain access control lists (ACLs).
    An ACL is a list of security protections that applies to an object. An entry in
    an ACL is an access control entry, or ACE. There are two types of ACLs: discretionary
    and system. A discretionary ACL is controlled by the owner of the object and specifies
    the particular users or groups who can access the object. A system ACL controls
    the generation of audit measures for attempts to access a securable object. The
    ability to get or set an object''s system ACL is typically controlled by system
    administrators. Some of the objects on which security descriptors can be applied


    +   * threads

    * processes

    * files (on an NTFS volume)

    * mutexes

    * semaphores

    * events

    * registry keys, and

    * mailsorts


    An ACE is composed of three pieces of information: the SID, the access mask, and
    the ACE header. The SID is the really who knows who you are. The ACE header determines
    the type of access control entry, whether access allowed or access denied. The
    access mask is a 32-bit value that determines what actions the user can perform
    on the object. The access mask is broken down into different fields that translate
    into what kind of access is allowed or denied. These fields represent generic,
    standard, and specific rights (not to be confused with privileges). These rights
    change from object to object and are set up using system-defined symbols. For
    example, rights associated with actions that could be performed against a file
    would control whether an individual user could read, write or execute the file.
    Example 7-1 demonstrates the use of some basic security APIs.


