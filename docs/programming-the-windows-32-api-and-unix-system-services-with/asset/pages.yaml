  md: "# Chapter 2 Controlling Concurrent Activity\n\n| Argument Value | Result |\n\
    | --- | --- |\n| A positive integer value $n$ | Wait $n$ milliseconds for object(s)\
    \ to become signaled |\n| INFINITE | Wait forever for object(s) to become signaled\
    \ |\n| 0 | Return immediately with status |\n\nThe status from these calls can\
    \ be any one of the following:\n\n+   - WAIT_FAILED An error occurred\n- WAIT_TIMEOUT\
    \ Specified timeout period (timeout) elapsed\n- WAIT_OBJECT_0 Object(s) successfully\
    \ signaled\n- WAIT_ABANDONED Thread owning a mutex died before calling ReleaseMutex\n\
    \n# Muxes\n\nA mutex is a concurrency construct that can be owned or not owned.\
    \ A thread will attempt to gain ownership of a mutex. Once the mutex is owned\
    \ by a thread, any other thread that tries to gain ownership of this mutex will\
    \ be made to wait. Several threads may attempt to gain ownership of the mutex\
    \ simultaneously. When the owning thread releases the mutex, the system will arbitrarily\
    \ give the mutex to one of the threads waiting to own it. Therefore, the protocol\
    \ for using a mutex to coordinate concurrent activity is as:\n\n> GAIN OWNERSHIP\
    \ OF MUTEX\n...\nPERFORM CRITICAL SECTION CODE\n...\nRELEASE MUTEX\n\nA mutex\
    \ under the Win32 API is created with the CreateMutex routine, as follows:\n\n\
    ```\nHANDLE CreateMutex (\n    LPSECURITY_ATTRIBUTES security,\n    BOOL initialOwner,\n\
    \    LPCTSTR mutexName);\n```\n\nArgument refers to a security attribute structure\
    \ valid only in Windows NT/2000. For Windows 95, 98 programs, NULL or zero is\
    \ passed here. The initialOwner boolean argument indicates whether the creating\
    \ thread will become the immediate owner of the mutex object. If set to TRUE,\
    \ the calling thread will be the initial owner of the mutex object. If set to\
    \ FALSE, the ownership is up for grabs. Argument mutexName is a null-terminated\
    \ string"
