  md: "# 186 Chapter 5 Working with Memory\n\nIf argument shmad is equal to (void\
    \ *) 0, the segment is attached to the first available address as selected by\
    \ the system and is the typical choice. Argument shmflg is used to specify access\
    \ permissions. Two flags, SHM_SHARE_MMU and SHM_RND, can be affiliated with argument\
    \ shmflg and cause the shmat to behave according to Table 5.14.\n\n| Table 5.14\
    \ Determining the Attachment Address Using Routine shmat |\n| Value of shaddr\
    \ | SHM_SHARE_MMU Set? | SHM_RND Set? | Address Attached |\n| (void *) 0 | Yes\
    \ | n/a | First available address |\n| (void *) 0 | No | n/a | First available\
    \ address |\n| 0 | n/a | Yes | Nearest page address (shmat=% SHMLBA) |\n| 0 |\
    \ m/a | No | Address given |\n\nThe value SHMLBA in Table 5.14 is a system-defined\
    \ constant representing the page size. In Example 5-5, all arguments to shmat\
    \ are 0. Routine shmat is used to allocate a shared area of memory in which the\
    \ mutex and condition variable descriptors are placed to allow access by the two\
    \ processes shmem1 and shmem2 Another routine related to this IPC shared memory\
    \ routine is shmdt, detach shared memory region, which has the following calling\
    \ sequence:\n\n```\nint shmdt (\n  char *shmaddr );\n```\n\nArgument shmaddr represents\
    \ the area of memory that will be detached. Routine shmctl1 can be used to perform\
    \ other functions and has the following calling sequence:\n\n```\nint shmctl1\
    \ (\n  int shmid,\n  int cmd,\n  struct shmid_ds *buf );\n```\n\nArgument shmid\
    \ is the identifier returned from the shmget call. Argument cmd_id is usually\
    \ set to one of the values specified in Table 5.15.\n\nUsing routine shmctl with\
    \ the IPC_RMID command is important since the shared memory data structures do\
    \ not go away automatically when a process exits and can take up considerable\
    \ memory space enough of them left behind. Example 5-4 illustrates the use of\
    \ the ipcs command with the -m switch, which displays information about all shared\
