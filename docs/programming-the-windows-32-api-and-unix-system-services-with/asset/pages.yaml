    \nRoutine FirstChangeNotification is called first and establishes the immediate\
    \ change notification filter conditions. FirstChangeNotification also returns\
    \ a change notification handle that can be used in subsequent calls. Argument\
    \ dirpath indicates the directory area in which change notification is to occur.\
    \ The subtreeflag is set to TRUE if it is to monitor any subdirectories. The filterflags\
    \ argument can be set to any combination, as illustrated in Table 4.2.\n\n| Table\
    \ 4.2 Routine FirstChangeNotification Filter Flag Settings |\n| Filter Name |\
    \ Notification Implications for Watched Directory or Subtree |\n| FILE_NOTIFY_CHANGE_FILE_NAME\
    \ | A change can include renaming, creating, or deleting a filename. |\n| FILE_NOTIFY_CHANGE_DIR_NAME\
    \ | A change can include creating or deleting a directory |"
