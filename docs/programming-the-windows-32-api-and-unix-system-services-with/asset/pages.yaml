    ```\n\n# C++ Exception Handling\n\nException handling is available in C++ on both\
    \ the Microsoft Windows and UNIX platforms. Three keywords are used: try, catch,\
    \ and throw. The try keyword is used with a set of curly braces ({}) to delineate\
    \ a section of code to be suspected of generating an exception condition. The\
    \ exception condition occurs on behalf of an exception being thrown; hence the\
    \ use of the throw statement. The catch keyword is is used with a set of curly\
    \ braces to delineate a body of code designed to handle the exception condition.\
    \ The catch keyword accepts a single argument that is specifically data-typed\
    \ to the thrown exception condition. If the data-type does not agree with the\
    \ type specified in the catch statement, another catch block will be sought that\
    \ matches the data-type. A default, or catch-all, statement can be specified by\
    \ passing three periods as arguments. Once the code in the catch block is executed,\
    \ the program is terminated. It is not always the desired case; the idea is to\
    \ keep the program running despite an error condition. Example 3-9 demonstrates\
    \ the use of the try-catch-throw statement in a function return. The exception\
