  md: "# 242 Chapter 7 Protecting System Resources\n\n+   - an owner (SID),\n- a primary\
    \ group (SID),\n- a discretionary ACL, and\n- a system ACL\n\nA security descriptor\
    \ can be in absolute or self-relative form. In self-relative form, all members\
    \ of the structure are located contiguously in memory. In absolute form, the structure\
    \ contains only pointers to the members.\n\n| Table 7.5 | Microsoft Windows Security\
    \ Descriptor Management APIs |\n| API Name | Function Definition |\n| GetSecurityDescriptorDacl\
    \ | Retrieves a pointer to the discretionary ACL in a specified security descriptor.\
    \ |\n| GetKernelObjectSecurity | Retrieves a copy of the security descriptor protecting\
