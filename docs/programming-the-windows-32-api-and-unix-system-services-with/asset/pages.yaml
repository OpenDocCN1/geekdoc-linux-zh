    \ the use of pthread_once in conjunction with the threads thread-specific data\
    \ routines.\n\n# Scheduling Processes in UNIX: Using the fork(), exec() and wait()\
    \ Routines\n\nThe fork() routine is unique to the UNIX environment and provides\
    \ a means of starting another thread of execution. At the point in a program where\
    \ fork() is called, a complete replica of the program is created. Execution in\
    \ the replica begins at the same very fork() call. The fork() routine is designed\
    \ to indicate if it is being called from the replica or from the original parent\
    \ program. Routine fork() will return a zero if it is being called from the replica\
    \ and the pid of the replica if it is called from the parent. A common implementation\
    \ of the fork() routine uses the exec() routine. The exec() routine is used to\
    \ run a program different from the replica. One of the arguments to exec() is\
    \ the name of a program that will completely replace the replica. The new executing\
    \ image maintains the same pid (system unique identifier) that was associated\
    \ with the replica. There are several forms of the exec() routine:\n\n```\nint\
    \ exec(char* path, char* arg0, char* arg1, ... char* argn);\nint execv(char* path,\
    \ char* arg0, char* arg1, ... char* argn);\nint execcl(char* path, char* arg0,\
    \ char* arg1, ... char* argn, NULL);\nint execvp(char* path, char* arg0, char*\
    \ arg1, ... char* argn);\n```\n\nRoutine execve() is the same as execv(), and\
    \ execy() is the same as execpl(), except that exec() and execy() require the\
    \ absolute or relative pathname of the executable file to be supplied, whereas\
    \ exec() and execvp() use the shell $PATH environment to determine the path. Figure\
    \ 1-1 illustrates how the fork/exec combination works."
