  md: '# Concurrency Control Functions in UNIX


    UNIX contains a collection of concurrency routines that allow the creation of
    the following mechanisms:


    +   - Semaphores

    - Condition variables

    - RW locks


    Semaphores are discussed in two varieties, POSIX and System V. Both are available
    on Solaris and Red Hat Linux. The System V semaphores work rather differently
    than the POSIX variety; they are less straightforward to use but provide certain
    functionality not available with the POSIX semaphores. Mutexes and RW locks control
    access to shared resources by allowing threads to acquire a lock. The protocol
    understood here is once a lock is acquired, the thread can proceed to execute
    the code in its critical section. Any other threads that are trying to acquire
    the lock at this time are suspended. When the thread is finished in its critical
    section, it releases the lock to allow any other threads to acquire it. Mutexes
    and RW locks both work on this premise. However, RW locks can access to a shared
    resource in read or write mode. (See the "POSIX Condition Variables" section for
    more details.)


    # Semaphores—POSIX Threads Version


    The POSIX threads semaphore routines are available in both the Sun Solaris and
    Red Hat Linux environments and require semaphore.h. The calling sequences are
    as follow:


    ```

    int sem_init(sem_t *sem, int pshared, unsigned int value);


    int sem_wait(sem_t *sem);


    int sem_trywait(sem_t *sem);


    int sem_post(sem_t *sem);


    int sem_getvalue(sem_t *sem, int sval);


    int sem_destroy(sem_t *sem);

    ```


    The sem_init() function is used to initialize an unnamed semaphore referred to
    by sem to value. Argument value refers to how many resources require synchronized
    access. This semaphore may be used in subsequent calls to sem_wait(), sem_trywait(),
    sem_post(), and sem_destroy(). This semaphore remains available until it is destroyed.
    Argument pshared is interpreted in Table 2.2'
