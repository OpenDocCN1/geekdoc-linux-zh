    Sometimes it is necessary for an application to react to an unexpected event.
    This event might happen at any point during the execution of the application.
    How does the system environment react to something like this? One real-life corollary
    is a person speaking on the telephone when the doorbell rings. The telephone conversation
    is temporarily suspended while the door is answered. Upon returning to the telephone,
    the individual resumes the conversation almost as if nothing had interrupted it
    in the first place.


    If this circumstance is translated to a computer environment, we can observe the
    following scenario as one example. Imagine we have a program that performs I/O
    to a disk. As part of our I/O specification in writing our program, we are going
    to specify certain information that is going to inform the system that, when this
    I/O statement has completed, we want a particular routine to be executed. The
    facility of this is that there is no need to wait for'
  merge: -1
