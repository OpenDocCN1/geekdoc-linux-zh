    \ Don't reserve swap space.\n\nIf MAP_PRIVATE is specified, write references will\
    \ change the memory object. Either the initial write reference will create a private\
    \ copy of the memory object and redirect the mapping to the copy. The private\
    \ copy is not created until the first write; until then, other users who have\
    \ the object mapped MAP_SHARED can change the object. Either MAP_SHARED or MAP_PRIVATE\
    \ must be specified, but not both. Do not use the MAP_FIXED option. MAP_NORESERVE\
    \ specifies that no swap space be reserved for a mapping. Without this, the creation\
    \ of a writable MAP_PRIVATE reserves swap space equal to the size of the mapping;\
    \ when the mapping is written into, the reserved space is employed to hold private\
    \ copies of the data.\n\nTo unmap pages of memory mapped with mmap, the routine\
