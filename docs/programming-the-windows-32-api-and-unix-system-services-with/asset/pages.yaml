    A file is a named collection of data, and a file system is generally considered
    the entity working through the operating system to make file management easy.
    Today, data contained in files can represent a vast spectrum of information. With
    the advent of such technologies as multimedia, file data is composed of information
    that can produce sound and pictures. A DVD is a good example of this kind of technology.
    A DVD can contain several copies of an entire motion picture, consisting of several
    large files. Critical everyday business transactions are carried out by interfacing
    with huge, complex databases. Interfacing with such file data requires much more
    sophisticated operations, beyond those found in the conventional read, write,
    rename, and delete operations. Contemporary file systems must be able to deal
    with data of this nature.


    With the advent of multiprocessing systems, file access becomes more sophisticated,
