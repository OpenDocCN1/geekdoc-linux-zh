  md: '# Controlling Concurrency Activity


    # CHAPTER OBJECTIVES


    +   - Concurrency Control Functions in the Win32 API........ 44

    - Concurrency Control Functions in UNIX........ 56


    > The ability to run a multithreaded process that incurs a variety of asynchronous
    concurrency activity requires a mechanism for controlling execution behavior and
    access to shared resources. Microsoft Windows, Sun''s Solaris, and Red Hat Linux
    provide a robust collection of functions that help perform this kind of control.


    The need for this kind of control can be demonstrated by running the program in
    Example 2-1. This program spawns four threads that add 2,500,000 to a global counter.
    When the threads are finished, the counter should contain a value of 10,000,000.
    The program in Example 2-1 is a classic demonstration of not preserving mutual
    exclusion. When the program is run, various results other than 10,000,000 are
    produced because there is no control over how the shared data variable counter
    is incremented. Only one thread should be allowed to increment and store the new
    value of counter, mutual exclusion must be preserved during the time that the
    data variable counter is being incremented. The program statements that are executed
    this time are also referred to as the critical section. We need to control when
    critical section code is executed. By using the concurrency functions described
    in this chapter, mutual exclusion in situations such as demonstrated in Example
    2-1 can be preserved and the proper result can be obtained.'
