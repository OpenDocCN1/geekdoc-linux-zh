  md: "# Operating Systems\nMicrosoft\nUNIX\n\n# Donald Merusi\n\n# Programming\n\
    Win32 API and UNIX\nSystem Services\n\nLearn to program for Windows* and UNIX\
    \ the same way\ny you use them: side by side\n\nMost organizations today rely\
    \ on a hybrid combination of systems\nto meet all the needs of the enterprise.\
    \ Programmers need to\ncreate parallel functionalities and interrelated tools\
    \ to maximize\nt efficiency of these heterogeneous systems.\n\nProgramming the\
    \ Win32 API and UNIX System Services\ngo subject by subject, comparing the functionality\
    \ of Microsoft*\nWindows 95, 98, NT*, and 2000 with similar features in Solaris*\n\
    and Red Hat Linux* Version 6.1. The real-world examples and\ndoing ongoing case\
    \ studies illustrate the material for quick com-\nprehension and application,\
    \ while cookbook-style presentations make\n a reference.\n\n+   * Compares functionality\
    \ across the board\n\n+   * Includes threads, concurrency, exception\nhandling,\
    \ file systems, networks, and\nsecurity\n\n+   * Perfect for integrations or migrations\n\
    \n+   * Includes Solaris V2.6 and Red Hat Linux\nVersion 6.1\n\nThis book is ideal\
    \ for users of one who want to become\nfamiliar with the other and, of course,\
    \ it is critically important for\nanyone who must integrate the two **Programming\
    \ Win32\nAPI and UNIX System Services** is must reading for all serious\nprofessional\
    \ experience programmers.\n\n![](img/f695f18c0d67c9e5570e6451c8aefb95_323_0.png)\n\
    \nAbout the CD-ROM\nThe CD-ROM contains all the source code examples\nfrom the\
    \ book.\n\nAbout the Author\nALD MERUSI is a leading technical consultant for\
    \ a major\nNew England corporation involved with the Microsoft Windows\nand UNIX\
    \ environments. He is also a faculty member at\nRensselaer at Hartford.\n\n# MICROSOFT\
    \ TECHNOLOGIES SERIES\n\nPRENT HALL\nUpper Saddle River, NJ 07458\nwww.phpht.com\n\
    \n![](img/f695f18c0d67c9e5570e6451c8aefb95_323_1.png)\n\n$49.99 U.S.\n$75.00 Canada\n\
