    \ aclcnt)) == 0)\n        perror(\"acltotext error\");\n\n    printf(\"%d acl\
    \ entries found ...\\n\", aclcnt);\n    printf(\"%s\\n\", acltext);\n}\n\n```\n\
    \nThe code in Example 7–6 must be built with the -lsec option.\n\n# Other UNIX\
    \ Security Functions\n\nBoth Solaris and Red Hat Linux provide several other security-related-functions\
    \ that can be used to control access to file information, including chown, chmod,\
    \ setuid, getuid, and setgid.\n\n# Getting and Setting User IDs and Group IDs\n\
    \nSeveral routines are used to control the group-id and user-id in a UNIX environment.\
    \ The setuid function can be used to set the real user-id, the effective user-id,\
    \ and the saved user-id of the calling process. Routine setgid performs the same\
    \ action, but for the group-id. At login, the real user-id, the effective user-id,\
    \ and the saved user-id of the login process are set to the login-id of the user\
    \ responsible for the creation of the process. The same principle applies to group-ids.\
    \ The effective user-id and group-id are used to determine file access permissions.\
    \ If the file executed is a set-user-file, the effective user-id of the process\
    \ are set to the owner of the file executed. The same principle applies for a\
    \ file executed with the group-id bit set."
