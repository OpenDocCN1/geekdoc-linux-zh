  md: '# Chapter 6 Networking and Other Communication Mechanisms


    | TABLE 6.10 UNIX Message Queue System Limitations |

    | System Limit | Meaning |

    | MSGQNI | Maximum number of message queues that may exist at any time in the
    system |

    | MSGMAX | Maximum number of bytes of data allowed for a message |

    | MSGQNB | Maximum number of bytes of all messages allowed in a queue |

    | MSGQTL | Maximum number of messages in all queues allowed in the system |


    Four routines are available for manipulating message queues:


    +   - msgget Create a message queue; obtain an identifier.

    - msgsnd Send a message to a message queue.

    - msgrcv Receive a message from a message queue.

    - msgctl Query the control data of a message queue.


    As other IPC families, a unique key identifier must be obtained to initialize
    a message queue. The ftok routine returns a unique key, which can then be used
    in the msgget routine, which has the following calling sequence:


    ```

    int msgget ( key_t key, int flag );

    ```


    Argument key will contain the unique key identifier value. Argument flag should
    contain the symbol IPC_CREAT OR the desired access permission mask.


    Routines msgrcv and msgsnd are used to send and receive data from the message
    queue and have the following calling sequence:


    ```

    int msgsnd ( int mqid, const void * msgptr, int len, int flag );

    int msgrcv ( int mqid, void * msgptr, int len, int flag );

    ```


    Argument mqid is the identifier value returned from having called the msgget routine.
    Argument msgptr is a pointer to an object that contains the actual message text
    and a message type. Argument len is the size in bytes of the message text field
    pointed to by argument msgptr. Argument flag has meaning as described in Table
    6.11.


    Routine msgctl can be used to query and control data of a message queue and has
    the following calling sequence:


    ```

    int msgctl ( int mqid, int cmd, struct mqid_ds * mbufptr );

    ```'
