    \ will return the number of bytes actually read or written. Argument fildes represents\
    \ the file descriptor obtained from the open call. Argument buf is a pointer to\
    \ a data storage area, and nbytes is the number of bytes transferred by the I/O\
    \ transaction. A file opened by descriptor is closed using the close routine,\
    \ as follows:\n\n```\nclose (int fildes);\n```\n\nExample +1 demonstrates the\
    \ use of the open, read, write, and close routines.\n\n# Example 4-1 Using the\
