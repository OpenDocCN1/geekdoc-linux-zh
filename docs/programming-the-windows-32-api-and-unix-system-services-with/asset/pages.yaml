  md: '# Chapter 4 Managing Files and File Systems


    ```

    short 1_type; /* lock operation type */

    short 1_whence; /* lock base indicator */

    off_t 1_start; /* starting offset from base * */

    off_t 1_len; /* lock length; len == 0 means until end of file * */

    long 1_sysid; /* system ID running process holding lock */

    pid_t 1_pid; /* process ID of process holding lock */

    ```


    Element 1_type can be set to indicate the type of lock: F_WRLCK for an exclusive
    lock and F_RDLOCK for a shared lock. An exclusive lock will prevent any other
    lock requests to be set, whereas a shared lock will allow other shared locks to
    occur. The value of 1_whence is SEEK_SET, SEEK_CUR, or SEEK_END, to indicate the
    relative offset 1_start will be measured from the start of the file, current position,
    or end of the file. The value of 1_len is the number of consecutive bytes to be
    locked. The 1_sysid and 1_pid elements can generally be ignored. Example 4-11
    shows two programs—fcntl1 and fcnt2—that demonstrate the use of the fcntl function.
    Program fcnt1 runs program fcnt2 via a fork/exec call and is invoked as follows:


    fcntl1 file.name


    In this case, file.name is the name of a file that exists; otherwise, fcnt1 will
    produce an error. fcnt1 will attempt to open file.name read and write use the
    file descriptor in the fcntl call. Rather than locking a specific portion of the
    file, fcnt1 locks the entire file, making the use of fcnt1 similar to a mutex.
    The exclusive lock (F_WRLCK) is held for 10 seconds. After 10 seconds have elapsed,
    fcnt1 changes the exclusive lock to a shared lock (F_RDLOCK) and exits. fcnt2
    attempts to access the file in read-only mode and then makes up to 20 attempts
    to establish a shared lock on the file. fcnt2 will get the lock once fcnt1 changes
    its lock to shared. Example 4-12 illustrates the code for fcnt1 and fcnt2 and
    subsequent output.


