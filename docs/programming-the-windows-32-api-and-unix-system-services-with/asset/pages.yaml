    | r | Read permission. |\n| w | Write permission. |\n| x | Execute permission.\
    \ |\n - | No access. |\n\nACLs are best observed by looking at a listing from\
    \ the getacl command, which produces the following display from being used on\
    \ a file testacl.txt.\n\n```\n% getacl testacl.txt\n\n# file: testacl.txt\n# owner:\
    \ donm\n# group: faculty\nuser::rw-\nuser:dave:r-- #effective:r--\nuser:jcm:r-x\
    \ #effective:r--\ngroup:r-- #effective:r--\ngroup:osp:-W- #effective:r--\nmask:-\n\
    other:--\n```\n\nNo default ACL information is displayed for this file. It is\
    \ possible to determine the effect this ACL has on accessing this file by referring\
    \ to Table 7-8. The owner and owning group of this file are indicated at the beginning\
    \ ACL listing for this file. The default user access allows both reading and writing.\
    \ Next there are specific access limitations for users jem and dave. User jem\
    \ can only read and execute this file, and dave can only read this file. The default\
    \ group access is read-only; however, members of the group osp can only write\
    \ to this file. The mask entry represents the maximum permissions allowed to any\
    \ user except the file owner and to any group entries, including the owning group.\
    \ The other entries cover everything not already included in the access control.\
    \ ACLs like that shown above can be read and established under program control.\
    \ The code fragment in-which can be used to perform the actions of getacl from\
    \ a program level."
