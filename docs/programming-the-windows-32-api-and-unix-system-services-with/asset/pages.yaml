    \    LPCSTR newfilename,\n    DWORD flags);\n```\n\nThe moveflags argument can\
    \ be set to any combination, as described in Table 4.3.\n\n# Table 4.3 Routine\
    \ MoveFile moveflags\n\n| MOVEFILE_COPY_ALLOWED | If a file is moved to a different\
    \ volume, the move operation is performed by performing a CopyFile and DeleteFile.\
    \ |\n| MOVEFILE_DELAY_UNTIL_REBOOT | Valid only in Windows/2000. File move is\
    \ not performed until the system is rebooted. |\n| MOVEFILE_REPLACE_EXISTING |\
    \ Ordinarily, the file operation requires that the new file name not exist; this\
    \ option overrides that condition. |\n| MOVEFILE_WRITE_THROUGH | Valid only in\
    \ Windows/2000. This guarantees the file is moved; disk caches are flushed. |\n\
    \nFiles can be programmatically copied by using the CopyFile or CopyEx routines.\
