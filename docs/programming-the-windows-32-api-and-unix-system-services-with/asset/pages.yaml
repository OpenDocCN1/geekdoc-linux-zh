  md: '# 14 (chapter 1) Processes and Threads


    Only fibers can execute fibers. The system creates a fiber by calling either ConvertThreadToFiber
    or CreateFiber. These calls differ only in that CreateFiber does not begin executing
    the fiber that was created. To do that the application must call SwitchToFiber.
    Fibers are terminated by calling DeleteFiber. ConvertThreadToFiber has the following
    calling sequence:


    ```

    LPVOID ConvertThreadToFiber (

    LPVOID lpParameter );

    ```


    Argument lpParameter specifies a single variable that is passed to the fiber.
    The fiber can retrieve this value by using the GetFiberData function. Calling
    ConvertThreadToFiber makes the thread currently executing fiber and creates an
    area where state information about the fiber is maintained. This state information
    also includes the lpParameter argument. ConvertThread-ToFiber also returns an
    address pointer to the fiber once it is created.


    The CreateFiber function allocates a fiber object, assigns a stack, and sets up
    execution to begin at the specified start address, which is usually the fiber
    function. This function does not schedule the fiber, the caller must use the SwitchToFiber
    routine to do that. CreateFiber has the following calling sequence:


    ```

    LPVOID CreateFiber (

    DWORD dwStackSize,

    LPFIBER_START_ROUTINE lpStartAddress,

    LPVOID lpParameter );

    ```


    Argument lpParameter is an optional argument that can be passed to the fiber.
    CreateFiber also returns an address pointer of the fiber once it is created. Routine
    SwitchToFiber has the following calling sequence:


    ```

    VOID SwitchToFiber (

    LPVOID lpFiber );

    ```


    Argument lpFiber is a pointer to a fiber to switch. Routine DeleteFiber should
    be called to delete all data associated with the fiber. If the running fiber calls
    DeleteFiber, an ExitThread is also performed and the thread terminates. Unpredictable
    results can occur if the fiber is terminated by another thread. Routine DeleteFiber
    has the following calling sequence:


    ```

    VOID DeleteFiber (

    LPVOID lpFiber );

    ```


    Argument lpFiber is a pointer to the fiber to be deleted. Example 1-5 demonstrates
    the use of fibers in a pseudo-code template.

    Example 1-5 first changes the primary thread into a primary fiber by calling ConvertThreadToFiber.
    Until it does that it cannot schedule any fibers. Two fibers are then set up,
    called FiberA and FiberB. A fiber is finally scheduled at the SwitchToFiber call
