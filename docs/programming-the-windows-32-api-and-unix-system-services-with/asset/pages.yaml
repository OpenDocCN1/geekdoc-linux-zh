    the following calling sequence:


    ```

    off_t lseek(int fildes, off_t offset, int whence);

    ```


    The lseek function sets the file pointer associated with the open file descriptor
    by fildes as follows:


    +   * If whence is SEEK_SET, the pointer is set to offset bytes from the beginning
    of the file.

    * If whence is SEEK_CUR, the pointer is set to its current location plus offset.

    * If whence is SEEK_END, the pointer is set to the size of the file plus offset.


    The lseek function allows the file pointer to set beyond the existing data in
    the file. If data are written at this point, subsequent reads in the gap between
    the previous end of data and the newly written data will return bytes of 0 until
    data are written into the gap.


    # File Mapping in UNIX


    File-mapping operations can be accomplished in UNIX using the mmap, munmap, and
    msync routines. Routine mmap establishes a mapping between a process''s address
    space and a virtual memory object. The call sequence is as follows:


    ```

    #include <sys/mman.h>


    void *mmap(

    void addr,       /* Location of virtual address mapped */

    size_t len,      /* Length of mapped region in bytes */

    int prot,         /* Access permission granted to mapped region */

    int flags,        /* More mapped region interpretation settings */

    int fildes,       /* Descriptor of file being mapped */

    off_t offset);   /* Byte offset within file to begin mapping */

    ```


    The addr argument is usually set to 0, which indicates the system will pick a
    virtual address to map for. The prot argument can be set to a combination of one
    of the following:


    +   PROT_READ    Pages can be read.

    PROT_WRITE   Pages can be written.

    PROT_EXEC    Pages can be executed.

    PROT_NONE    Pages cannot be accessed.'
