  md: "# The Microsoft Windows Virtual Memory Management Routines\n\nMicrosoft Windows\
    \ provides a family of routines that allow a programmer to control the nature\
    \ of the virtual memory environment. Although designed to manage specific aspects\
    \ of the Windows memory environment, the virtual memory management (VMM) routines\
    \ are conceptually the same as the ANSI and C++ memory allocation routines, allowing\
    \ for the dynamic allocation and release of memory. Allocation is based on the\
    \ operation of reserving and committing memory, which will be discussed next.\n\
    \nThe basic principle of virtual memory management is that the entire process\
    \ is not required to be present in memory at the same time, only the portions\
    \ needed for the current execution requirement. As execution proceeds, new portions\
    \ of it are brought into memory and other portions are removed from memory. Sometimes\
    \ the removed portions need to be saved away because they contain data that must\
    \ be preserved. Windows stages a process in a special system file called the paging\
    \ file. That portion of process address space represented in the paging file is\
    \ considered be committed. It is also possible to reserve a portion of the address\
    \ space without using the paging file. In this case, the system will keep other\
    \ processes from using the reserved address range, but it will not be possible\
    \ to use these addresses until they are committed.\n\n# The VirtualAlloc Routine\n\
    \nThe VirtualAlloc routine is used to reserve and commit a region of pages in\
    \ the virtual address space of the calling process. Memory allocated by this routine\
    \ is initialized to 0 unless the MEM_RESET flag is set, as discussed below. Routine\
    \ VirtualAlloc has the following sequence:\n\n```\nLPVOID VirtualAlloc (\n  DWORD\
    \ address,\n  DWORD size,\n  DWORD alloctype,\n  DWORD protect );\n```\n\nArgument\
    \ address specifies the starting address of the region to allocate. Typically,\
    \ NULL is passed for this argument, allowing the system to determine where to\
    \ allocate the region. Argument size indicates the size in bytes of the region.\
    \ If NULL is passed for this argument, the value is rounded up to the next page\
    \ boundary. The GetSystemInfo routine can be used to determine the page size on\
    \ the host computer. Argument alloctype specifies the type of allocation, as described\
    \ in Table 5.2."
