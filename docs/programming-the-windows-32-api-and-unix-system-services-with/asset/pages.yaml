  md: '# Chapter 5 Working with Memory


    | Table 5.2 | Routine VirtualAlloc Allocation Type Descriptions |

    | Allocation Name | Meaning |

    | MEM_COMMIT | Allocates physical storage in memory or in the paging file on disk
    for the specified region of pages. |

    | MEM_RESERVE | Reserves a range of virtual address space without allocating any
    physical memory. The paging file is not used. |

    | MEM_RESET | For Windows NT/2000 only: declares contents of the address range
    no longer important. |

    | MEM_TOP_DOWN | Allocate memory at the highest possible address. |


    The allocation types described in Table 5.2 can be specified in any combination.
    The *protect* argument specifies the type of access protection in effect for the
    address range of the region. Table 5.3 briefly describes the meaning of each of
    the possible flags.


    | Table 5.3 | Routine VirtualAlloc Protection Flag Arguments Definitions |

    | Protection Flag | Meaning |

    | PAGE_READONLY | Enables read access only to the committed region. |

    | PAGE_READWRITE | Enables both read and write access to the committed region.
    |

    | PAGE_EXECUTE | Enables execute access to the committed region. |

    | PAGE_EXECUTE_READ | Enables execute and read access to the committed region.
    |

    | PAGE_EXECUTE_READWRITE | Enables execute, and write access to the committed
    region. |

    | PAGE_GUARD | Any attempt to read or write to page region causes an exception
    |

    | PAGE_NOACCESS | Disables all access to the committed page region |

    | PAGE_NOCACHE | Disables caching of committed page region . |


    Windows 95.98 supports only the PAGE_NOACCESS, PAGE_READONLY, and PAGE_READWRITE
    protection flags. Also, the PAGE_GUARD and PAGE_NOCACHE can be used only when
    reserving memory.

    Routine VirtualAlloc can be called subsequent times, to reserve a range of pages,
    then to commit portions of the reserved region. The address range of memory can
    be reserved only once; however, it can be committed many times.'
