  md: '# Chapter 5 Working with Memory


    The functions lock and unlock the range of pages identified by the addr, addr
    len arguments. If two different processes lock the same page, the page will remain
    locked until both processes remove their locks. Locks do not nest; however, operations
    on the same address in the same process will all be removed with a single unlock.
    Locks established with mlock are not inherited by a child process after a fork
    call. Because of the impact on system resources, the use of mlock and munlock
    is restricted to processes with super privileges.


    # The getpagesize Routine


    Routine getpagesize calculates the number of bytes in a page and has the following
    calling sequence:


    ```

    int pagesize = getpagesize(void);

    ```


    The page size is a system page size and need not to be the same as the underlying
    hardware page size.


    # The mlock and munlock Routines


    The mlock routine locks in memory all pages mapped by the address space and has
    the following calling sequence:


    ```

    int mlock ( int flags );nint munlock ( void );

    ```


    The flags argument can be set to MCL_CURRENT, which means to lock all current
    mappings, or to MCL_FUTURE, indicating to lock all future mappings.


    # The mprotect Routine


    The mprotect routine is used to set memory protection on a specified range of
    pages and has the following calling sequence:


    ```

    int mprotect(

    void addr,

    size_t len,

    int prot);

    ```


    Memory protection is established for pages in the range addr, addr + len. The
    prot argument can be set to any combination of the following:


    +   - PRO_READ Page can be read

    - PRO_WRITE Page can be written

    - PRO_EXEC Page can be executed.

    - PRO_NONE Page cannot be accessed'
