  md: "# Microsoft Windows Security: Access Tokens and Security Descriptors\n\nTABLE\
    \ 7.6 GetKernelObjectSecurity requestedinfo SECURITY_INFORMATION Structure Bit\
    \ Values\n\n| SECURITY_INFORMATION Structure Value | Indicates... |\n| OWNER_SECURITY_INFORMATION\
    \ | The owner identifier of the object is being referenced. |\n| GROUP_SECURITY_INFORMATION\
    \ | The primary group identifier of the object is being referenced. |\n| DACL_SECURITY_INFORMATION\
    \ | The discretionary ACL of the object is being referenced. |\n| SACL_SECURITY_INFORMATION\
    \ | The system ACL of the object is being referenced. |\n\nArgument secdesc points\
    \ to a buffer the function fills with a copy of the security descriptor of the\
    \ specified object. The calling process must have the right to view the aspects\
    \ of the object's security status. The structure is returned in self-relative\
    \ format—that is, all members of the structure are located contiguously in memory.\
    \ The len argument specifies the size, in bytes, of the buffer pointed to by secdesc\
    \ parameter. Argument len points to a variable set to 0 if the descriptor is copied\
    \ successfully. If the buffer is too small for the security descriptor, this variable\
    \ receives the number of bytes written. If this variable's value is greater than\
    \ the value of len parameter when the function returns, none of the security descriptor\
    \ is copied to the buffer.\n\nGetSecurityDescriptorDACL AND GetSecurityDescriptorsACL\n\
    Routine GetSecurityDescriptorACL retrieves a pointer to the discretionary ACL\
    \ in the specified security descriptor and has the following calling sequence:\n\
    \n```\nBOOL GetSecurityDescriptorDACL(\n    SECURITY_DESCRIPTOR seces,\n    LPVOID\
    \ daclpresent,\n    PACL *dacl,\n    LPVOID *dacldefault\n);\n```\n\nArgument\
    \ secdesc points to the SECURITY_DESCRIPTOR structure containing the discretionary\
    \ ACL. The function returns a pointer to it. Argument daclpresent points to a\
    \ flag in the function sets to indicate the presence of a discretionary ACL in\
    \ the specified security descriptor. If this parameter is TRUE, the security descriptor\
    \ contains a discretionary ACL and the remaining input parameters in this function\
    \ receive valid values. If this parameter is FALSE, the security descriptor does\
    \ not contain a discretionary ACL and the remaining output parameters do not receive\
    \ valid values. Argument dacl points to the address of the security descriptor's\
