  md: '# Basic Windows Communication 199


    | TABLE 6.3 The openmode Argument Settings for the CreateNamedPipe API |

    | Mode | Meaning |

    | Access Modes^1 | |

    | PIPE_ACCESS_DUPLEX | The pipe is bidirectional; both server and client processes
    can read from and write to the pipe. This mode gives the server the equivalent
    of GENERIC_READ | GENERIC_WRITE access to the pipe. The client can specify GENERIC_READ
    or GENERIC_WRITE, or both, when it connects to the pipe using the CreateFile function
    |

    | PIPE_ACCESS_INBOUND | The flow of data in the pipe goes from client to server
    only. This mode gives the server the equivalent of GENERIC_READ access to the
    pipe. The client must specify GENERIC_WRITE when connecting to the pipe |

    | PIPE_ACCESS_OUTBOUND | The flow of data in the pipe goes from server to client
    only. This mode gives the server the equivalent of GENERIC_WRITE access to the
    pipe. The client must specify GENERIC_READ access when connecting to the pipe
    |


    # **Write-Through and Overlapped Modes^2**


    FILE_FLAG_WRITE_THROUGH Write-through mode is enabled. This mode affects write
    operations on byte-type pipes, and only when the client and server processes are
    on different computers. If this mode is enabled, functions writing to a named
    pipe do not return until the material written is transmitted across the network
    and is in the pipe on the remote computer.


    FILE_FLAG_OVERLAPPED Overlapped mode is enabled. If this mode is enabled, functions
    performing read, write, and connect operations that may take a significant time
    to be completed return immediately. This mode enables the thread that started
    the operation to perform other operations while the time-consuming operation executes
    in the background.


    # **Security Access Modes^2**


    WRITE_DAC The caller will have write access to the named pipe''s discretionary
    access list (ACL). (ACLs will be discussed in the next chapter).


    WRITE_OWNER The caller will have write access to the named pipe''s owner.


    ACCESS_SYSTEM_SECURITY The caller will have write access to the named pipe''s
    SACL (SACLs will be discussed in the next chapter).


    +   1. Must be the same for all instances of the pipe.

    2. Can be different for various instances of the pipe.


