  md: '# The Linux _clone() Routine


    The _clone() routine is unique to Linux and is similar to the UNIX fork() routine.
    Routine _clone() allows the child process to share parts of its execution context
    with its parent process, including memory space, references to files and signals.
    The _clone() routine requires the sched.h header file. _clone() has the following
    calling sequence:


    ```

    int _clone(int *fn)(void *arg, void *stack, int flags, void *arg)

    ```


    When the child process is created, the function passed by fi is executed. The
    arg argument immediately following fi in the calling sequence is passed back to
    the fi function. The child process that runs fi. When terminates, execution returns
    to the child process. The low byte of the flags argument indicates the number
    of the signal sent to the parent when the child dies. The flags argument can also
    be bitwise-ored with one or more of the constants described in Table 1.5:


    | TABLE 1.5 | Settings for flags Argument in Linux _clone() Routine |

    |---|---|

    | CLONE_VM | If set, parent and child processes run in the same memory space |

    | CLONE_FS | If set, parent and child processes share the same file system information
    including:

    | - 1. the file system root,

    | - 2. current working directory, and

    | - 3. umask operations |

    | CLONE_FILES | If set, parent and child processes share the same file descriptor
    table:

    | - 1. Files created in either the parent or child are available to each other.

    | - 2. If either parent or child closes a file, the other process is affected.

    | - 3. If either parent or child changes associated flags, the other process is
    affected |

    | CLONE_SIGHAND | If set, parent and child processes share the same table of signal
    handler; signal behavior changes are also shared. If not set, child inherits a
    copy of signal handlers but subsequent calls to signal_action() are mutually exclusive
    of the parent |

    | CLONE_PID | If set, the child process is created with the same process ID as
    the parent, otherwise, the child process will be given a unique ID |'
