    \ to look at your code may not know/remember the syntax you are using.\n\n###\
    \ **Aligning Text with the `printf` Command**\n\nSince `awk` is a programming\
    \ language inside a single command, it also has its own way of producing formatted\
    \ output via the `printf` command.\n\n[Listing 5.1](#chap5.xhtml_li5-1) displays\
    \ the contents of `columns2.txt` and [Listing 5.2](#chap5.xhtml_li5-2) displays\
    \ the contents of the shell script `AlignColumns1.sh,` which shows you how to\
