    Third, the contents of any shell script can be as simple as a single command,
    or can comprise hundreds of lines of bash commands. In general, the more interesting
    shell scripts involve a combination of several bash commands. A learning tip:
    since there are usually several ways to produce the desired result, it’s helpful
    to read other people’s shell scripts to learn how to combine commands in useful
    ways.


    ## What Is Unix?


    Unix is an operating system created by Ken Thompson in the early 1970s, and today
    there are several variants available, such as HP/UX for HP machines and AIX for
    IBM machines. Linus Torvalds developed the Linux operating system during the 1990s,
    and many Linux commands are the same as their `bash` counterparts (but differences
    exist, often in the commands for system administrators). The Mac OS X operating
    system is based on AT&T Unix.


    Unix has a rich and storied history, and if you are really interested in learning
    about its past, you can read online articles and also Wikipedia. This book foregoes
    those details and focuses on helping you quickly learn how to become productive
    with various commands.


    ## Available Shell Types


    The original Unix shell is the Bourne shell, which was written in the mid-1970s
    by Stephen R. Bourne. In addition, the Bourne shell was the first shell to appear
    on `bash` systems, and you will sometimes hear “the shell” as a reference to the
    Bourne shell. The Bourne shell is a `POSIX` standard shell, usually installed
    as `/bin/sh` on most versions of Unix, whose default prompt is the `$` character.
    Consequently, Bourne shell scripts will execute on almost every version of Unix.
    In essence, the AT&T branches of Unix support the Bourne shell `(sh)`, `bash`,
    Korn shell `(ksh)`, `tsh`, and `zsh`.


    However, there is also the `BSD` branch of Unix that uses the “C” shell `(csh)`,
    whose default prompt is the `%` character. In general, shell scripts written for
    `csh` will not execute on AT&T branches of Unix, unless the `csh` shell is also
    installed on those machines (and vice versa).


    The Bourne shell is the most “unadorned” in the sense that it lacks some commands
    that are available in the other shells, such as `history`, `noclobber`, and so
    forth. The various subcategories for the Bourne Shell are listed as follows:


    - Bourne shell `(sh)`

    - Korn shell `(ksh)`

    - Bourne Again shell `(bash)`

    - POSIX shell `(sh)`


    The different C-type shells follow:


    - C shell `(csh)`

    - TENEX/TOPS C shell `(tcsh)`


    While the commands and the shell scripts in this book are based on the `bash`
    shell, many of the commands also work in other shells (and if not, those other
    shells have a similar command to accomplish the same goal). Performing an Internet
    search for “how do I do `<bash command>` in `<shell name>`” will often get you
    an answer. Sometimes the command is essentially the same, but with slightly different
    syntax, and typing `man <command>` in a command shell can provide useful information.


    ## What Is bash?


    `bash` is an acronym for “Bourne Again Shell,” which has its roots in the Bourne
    shell created by Stephen R. Bourne. Shell scripts based on the Bourne shell will
    execute in `bash`, but the converse is not true. The `bash` shell provides additional
    features that are unavailable in the Bourne shell, such as support for arrays
    (discussed later in this chapter).


    On Mac OS X, the `/bin` directory contains the following executable shells:


    ```

    -r-xr-xr-x   1  root   wheel   1377872   Apr 28  2017 /bin/ksh

    -r-xr-xr-x   1  root   wheel    630464   Apr 28  2017 /bin/sh

    -rwxr-xr-x   1  root   wheel    375632   Apr 28  2017 /bin/csh

    -rwxr-xr-x   1  root   wheel    592656   Apr 28  2017 /bin/zsh

    -r-xr-xr-x   1  root   wheel    626272   Apr 28  2017 /bin/bash

    ```


    In case you’re interested, a nice comparison matrix of the support for various
    features among the preceding shells is here:

    https://stackoverflow.com/questions/5725296/difference-between-sh-and-bash.


    Something else that might surprise you: in some environments the Bourne shell
    `sh` *is* the Bash shell, which you can check by typing the following command:


    ```

    sh  --version

    GNU bash, version 3.2.57(1)-release (x86_64-apple-darwin16)

    Copyright (C) 2007 Free Software Foundation, Inc.

    ```


    If you are new to the command line (be it Mac, Linux, or PCs), please read the
    Preface, which provides some useful guidelines for accessing command shells.


    ### Getting Help for `bash` Commands


    If you want to see the options for a specific `bash` command, specify the `-?`
    switch. For example, `cat -?` displays the available options for the `cat` command.
    You can invoke the `man` command to see a description of a `bash` command and
    its options:


    ```

    man  cat

    ```


    Keep in mind that the `man` command produces terse explanations, and if those
    explanations are not clear enough, you can.


    ## Navigating Around


    The `man` command produces terse explanations, and if those explanations are not
    clear enough, you can.


    ### The `history` Command


    The `man` command produces terse explanations, and if those explanations are not
    clear enough, you can. (Wait, the source text has some repetition/fragmentation
    here, I will clean up the logical flow based on the provided text''s intended
    structure).


    The `history` command displays the history of commands you executed, as shown
    here:


    ```

    history

    ```


    A sample output of the preceding command is:


    ```

    1202   cat  longfile.txt >file2.txt

    1203   vi  longfile.txt

    1204   cat  longfile.txt |fold-40

    1205   cat  longfile.txt |fold-30

    1206   cat  longfile.txt |fold-50

    1207   cat  longfile.txt |fold-45

    1208   vi  longfile.txt

    1209   history

    1210   cd /Library/Developer/CommandLineTools/usr/include/c++

    1211   cd /tmp

    1212   cd $HOME/Desktop

    1213   history

    ```


    Now you can return to the directory in line `1210` with the following command:


    ```

    !1210

    ```


    The command `!cd` will search backward through the history of commands to find
    the first command that matches the `cd` command: in this case, line `1212` is
    the first match. If there weren’t any `cd` commands between the current command
    and the command in `1210`, then `!1210` and `!cd` will have the same effect.


    **NOTE**


    Be careful with the “!” option with bash commands, because the command that matches
    the “!” might not be the one you intended, so it’s safer to use the `history`
    command and then explicitly specify the correct number (in that history) when
    you invoke the “!” operator.


    ### Listing Filenames with the `ls` Command


    The `ls` command is for listing filenames, and there are many switches available
    that you can use, as shown in this section. For example, the `ls` command displays
    the following filenames (the actual display depends on the font size and the width
    of the command shell) on my Mac:


    ```

    apple-care.txt     iphonemeetup.txt    outfile.txt      ssl-

    instructions.txt  checkin-commands.txt   kyrgyzstan.txt

    output.txt

    ```

