    \n```\n x=\"ghi abc Ghi 123 #def5 123z\" echo \"Only words:\"\necho $x |tr -s\
    \ ' ' '\\n' | awk -F\" \" '\n{\n  if($0 ~ /^[a-zA-Z]+$/) { print $0 }\n}\n' |\
    \ sort | uniq\necho\necho \"Only integers:\"\necho $x |tr -s ' ' '\\n' | awk -F\"\
    \ \" '\n{\n  if($0 ~ /^[0-9]+$/) { print $0 }\n}\n' | sort | uniq\necho\necho\
    \ \"Only alphanumeric words:\"\necho $x |tr -s ' ' '\\n' | awk -F\" \" '\n{\n\
    \  if($0 ~ /^[0-9a-zA-Z]+$/) { print $0 }\n}\n' | sort | uniq\necho\n```\n\n[Listing\
    \ 5.41](#chap5.xhtml_li5-41) starts by initializing the variable `x`:\n\n```\n\
    \ x=\"ghi abc Ghi 123 #def5 123z\"\n```\n\nThe next step is to split `x` into\
    \ words:\n\n```\n echo $x |tr -s ' ' '\\n'\n```\n\nThe output is here:\n\n```\n\
    \ ghi\nabc\nGhi\n123\n#def5\n123z\n```\n\nThe third step is to invoke `awk` and\
    \ check for words that match the regular expression `^[a-zA-Z]+$`, which matches\
    \ any string consisting of one or more uppercase and/or lowercase letters (and\
    \ nothing else):\n\n```\n if($0 ~ /^[a-zA-Z]+$/) { print $0 }\n```\n\nThe output\
