    \ 脚本 `rainfall2.sh` 的内容，该脚本将多个 CSV 文件对应字段中的数字相并显示结果。\n\n### Listing A.28: rainfall2.sh\n\
    \n```bash\n # => 计算多个文件的行平均值\n#columns in rain.csv:\n#DOW,inches of rain, degrees\
