    \n```\n FILES: rain1.csv rain2.csv rain3.csv zain1.csv zain2.csv\nzain3.csv\n\n\
    DAY INCHES DEGREES HUMIDITY\n\n  1 0.37   66.33    24.33\n\n  2 0.05   67.33 \
    \   25.33\n\n  3 0.46   71.67    16.00\n\n  4 0.18   79.33    29.67\n\n  5 0.45\
    \   70.33    29.67\n\n  6 0.16   79.00    30.00\n\n  7 0.27   74.00    30.33\n\
    ```\n\n### **Calculating Combinations of Field Values**\n\n[Listing A.33](#appendix.xhtml_liA-33)\
    \ displays the contents of the shell script `linear-combo.sh` that computes various\
    \ linear combinations of the columns in multiple datasets and displays one combined\
    \ dataset as the output.\n\n##### ***LISTING A.33: linear-combo.sh***\n\n```\n\
    \ # => combinations of columns\n\nawk -F',' '\n\n{\n\n  $2 += $3 * 2 + $4 / 2\n\
    \n  $3 += $4 / 3 + $2 * $2 / 10\n\n  $4 += $2 + $3\n\n  $1 += $2 * 3 - $4 / 10\n\
    \n  printf(\"%d,%.2f,%.2f,%.2f\\n\",$1,$2,$3,$4)\n\n}\n\n' rain?.csv\n```\n\n\
    [Listing A.33](#appendix.xhtml_liA-33) processes the values of the datasets `rain1.csv,\
    \ rain2\\.` `csv`, and `rain3.csv` whose contents are shown earlier in this section.\
    \ The key observation to make is that the sequence of calculations in the calculations\
    \ in the body of the `awk` statement involved inter-dependencies.\n\nSpecifically,\
    \ the value of `$2` is a linear combination of the values of `$3` and `$4`. Next,\
    \ the value of `$3` is a linear combination of the value of `$4` and `$2`, where\
    \ the latter is *not* the original value from the datasets, but its calculated\
    \ value. Third, the value of `$4` is a linear combination of `$2` and of `$3`,\
    \ both of which are calculated values and not the values in the datasets. Finally,\
    \ the value of `$1` is a linear combination of the newly calculated values for\
    \ `$2` and `$4`.\n\nAs you can see, `awk` provides the flexibility to specify\
    \ practically any combination of calculations (including non-linear combinations)\
    \ in a very simple and sequential fashion. The output of [Listing A.33](#appendix.xhtml_liA-33)\
    \ is here:\n\n```\n 194,113.60,1348.50,1477.10\n\n196,116.12,1407.72,1539.84\n\
    \n204,135.19,1895.97,2041.16\n\n187,183.75,3470.07,3676.82\n\n202,122.68,1567.70,1707.38\n\
    \n194,175.23,3160.89,3370.12\n\n207,142.84,2113.33,2277.17\n\n201,138.00,1975.40,2137.40\n\
    \n202,140.52,2046.92,2212.44\n\n201,159.59,2628.23,2806.82\n\n203,146.15,2211.32,2385.47\n\
    \n203,152.08,2391.83,2579.91\n\n199,169.63,2964.10,3156.73\n\n206,148.74,2288.69,2462.43\n\
    \n183,184.00,3479.93,3697.93\n\n182,185.52,3537.43,3757.95\n\n200,160.59,2660.25,2839.84\n\
    \n179,191.15,3752.50,3981.65\n\n178,193.08,3826.99,4056.07\n\n195,174.63,3139.56,3347.19\n\
    \n173,198.74,4052.76,4296.50\n```\n\n### **Summary**\n\nIn this appendix, you\
    \ saw examples of how to use some useful and versatile `bash` commands. First\
    \ you saw examples of shell scripts for various tasks involving recursion, such\
    \ as computing the GCD (greatest common divisor) and the LCM (lowest common multiple)\
    \ of two positive integers, the Fibonacci value of a positive integer, and also\
    \ the prime divisors of a positive integer.\n\nNext you saw a `bash` script with\
    \ the `grep` command, a `while` loop, and other constructs that append data to\
    \ a log file, with logic to determine when to exit the `bash` script. In addition,\
    \ you learned how to use the `grep` command to simulate a simple relational database.\n\
    \nIn the final portion of this Appendix you learned how to use `awk` to process\
    \ records that span multiple lines, how to compute column sums and averages involving\
    \ multiple datasets, and how to use `awk` -related functions such as `gsub()`\
    \ and `split()`. Finally, you learned how to dynamically calculate various combinations\
    \ of columns of numbers from multiple datasets.\n\n## INDEX\n\n**A**\n\n`abc.sh`,\
