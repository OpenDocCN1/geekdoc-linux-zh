    \n![](img/square.jpg)删除重复项、前缀出现次数并按数字排序。\n\n### `sed` 中的反向引用\n\n在描述 `grep` 的章节中，你学习了反向引用，`sed`\
    \ 命令也提供了类似的功能。主要的区别在于，反向引用也可以用于命令的替换部分。\n\n接下来的 `sed` 命令匹配连续的 “a” 字母并打印出其中的四个：\n\
    \n```\n echo \"aa\" |sed -n \"s#\\([a-z]\\)\\1#\\1\\1\\1\\1#p\"\n```\n\n前述代码段的输出在此：\n\
    \naaaa\n\n接下来的 `sed` 命令将所有重复的字母对替换为字母 `aa:`：\n\n```\n echo \"aa/bb/cc\" |sed -n\
    \ \"s#\\(aa\\)/\\(bb\\)/\\(cc\\)#\\1/\\1/\\1/#p\"\n```\n\n上一个 `sed` 命令的输出在此（注意末尾的\
    \ “`/” 字符）：\n\n```\n aa/aa/aa/\n```\n\n接下来的命令在四位数数字中插入逗号：\n\n```\n echo \"1234\"\
    \ |sed -n \"s@\\([0-9]\\)\\([0-9]\\)\\([0-9]\\\n([0-9]\\)@\\1,\\2\\3\\4@p\"\n\
    ```\n\n上一个 `sed` 命令使用 `@` 字符作为分隔符。字符类 `[0-9]` 匹配单个数字。由于输入字符串 `1234` 有四个数字，字符类\
    \ `[0-9]` 重复了 4 次，每个数字的值被存储在 `\\1`、`\\2`、`\\3` 和 `\\4` 中。上一个 `sed` 命令的输出在此：\n\n\
    ```\n 1,234\n```\n\n一个更通用的可以在五位数数字中插入逗号的 `sed` 表达式在此：\n\n```\n echo \"12345\"\
    \ | sed 's/\\([0-9]\\{3\\}\\)$/,\\1/g;s/^,//'\n```\n\n上一个命令的输出在此：\n\n```\n 12,345\n\
    ```\n\n### 在数据集中仅显示“纯”单词\n\n在上一章中，我们使用 `egrep` 命令解决了此任务，本节将向你展示如何使用 `sed` 命令解决此任务。为了简单起见，让我们处理一个文本字符串，这样我们可以在实现解决方案的过程中看到中间结果。该方法与之前显示的统计唯一单词的代码块类似。让我们如下初始化变量\
    \ `x`：\n\n```\n x=\"ghi abc Ghi 123 #def5 123z\"\n```\n\n第一步是通过将空格替换为换行符将 `x`\
    \ 分分为每行一个单词：\n\n```\n echo $x |tr -s ' ' '\\n'\n```\n\n输出在此：\n\n```\n ghi\nabc\n\
    Ghi\n123\n#def5\n123z\n```\n\n第二步是使用正则表达式 `^[a-zA-Z]+` 调用 `old`，它匹配由一个或多个大写和小小写字母组成的任何字符串（不包含任何其他内容）。注意在\
    \ `sed` 中需要 `-E` 选项来解析这种正则表达式，因为它使用了一些在 `sed` 新奇时不可用的较新/现代的正则表达式语法。\n\n```\n echo\
    \ $x |tr -s ' ' '\\n' |sed -nE \"s/(^[a-zA-Z]\n[a-zA-Z]*$)/\\1/p\"\n```\n\n输出在此：\n\
    \n```\n ghi\nabc\nGhi\n```\n\n如果你也想对输出进行排序并只打印唯一单词，将结果传递给 `sort` 和 `uniq` 命令：\n\
    \n```\n echo $x |tr -s ' ' '\\n' |sed -nE \"s/(^[a-zA-Z]\n[a-zA-Z]*$)/\\1/p\"\
    |sort|uniq\n```\n\n输出在此：\n\n```\n Ghi\nabc\nghi\n```\n\n如果你只想提取变量 `x` 中的整数，使用此命令：\n\
    \n```\n echo $x |tr -s ' ' '\\n' |sed -nE \"s/(^[a-zA-Z]\n[a-zA-Z]*$)/\\1/p\"\
    |sort|uniq\n```\n"
- fmt: "\nPrint the section of lines between `world6` and `six` of `data4.txt` with\
    \ this command:\n\n```\nsed -n '/world6/,/six/p' < data4.txt\n```\n\nThe output\
    \ is here:\n\n```\n hello world6 three\n           hello world4 four\nline five\n\
    line six\n```\n\nPrint the contents of `data4.txt` and duplicate the section of\
    \ lines between `world6` and `six` with this command:\n\n```\nsed '/world6/,/six/p'\
    \ < data4.txt\n```\n\nThe output is here:\n\n```\n hello world4\n   hello world5\
    \ two\nhello world6 three\nhello world6 three\n          hello world4 four\n \
    \         hello world4 four\nline five\nline five\nline six\nline six\nline seven\n\
    ```\n\nDelete the even-numbered lines in `data4.txt` with this command:\n\n```\n\
    sed 'n;d;' <data4.txt\n```\n\nThe output is here:\n\n```\n hello world4\n hello\
    \ world6 three\nline five\nline seven\n```\n\nReplace letters `a` through `m`\
    \ with a “`,`” with this command:\n\n```\nsed \"s/[a-m]/,/g\" <data4.txt\n```\n\
    \nThe output is here:\n\n```\n ,,,,o wor,,4\n    ,,,,o wor,,5 two\n,,,,o wor,,6\
    \ t,r,,\n           ,,,,o wor,,4 ,our\n,,n, ,,v,\n,,n, s,x\n,,n, s,v,n\n```\n\n\
    Replace letters `a` through `m` with the characters “`,@#`” with this command:\n\
    \n```\nsed \"s/[a-m]/,@#/g\" <data4.txt\n```\n\nThe output is here:\n\n```\n ,@#,@#,@#,@#o\
    \ wor,@#,@#4\n    ,@#,@#,@#,@#o wor,@#,@#5 two\n ,@#,@#,@#,@#o wor,@#,@#6 t,@#r,@#,@#\n\
    \         ,@#,@#,@#,@#o wor,@#,@#4 ,@#our\n,@#,@#n,@# ,@#,@#v,@#\n,@#,@#n,@# s,@#x\n\
    ,@#,@#n,@# s,@#v,@#n\n```\n\nThe `sed` command does not recognize escape sequences\
    \ such as `\\t`, which means that you must literally insert a tab on your console.\
    \ In the case of the `bash` shell, enter the control character `^V` and then press\
    \ the `<TAB>` key in order to insert a `<TAB>` character.\n\nDelete the tab characters\
    \ in `data4.txt` with this command:\n\n```\nsed 's/ //g' <data4.txt\n```\n\nThe\
    \ output is here:\n\n```\n hello world4\nhello world5 two\n hello world6 three\n\
    hello world4 four\nline five\nline six\nline seven\n```\n\nDelete the tab characters\
    \ and blank spaces in `data4.txt` with this command:\n\n```\nsed 's/ //g' <data4.txt\n\
    ```\n\nThe output is here:\n\n```\nhelloworld4\nhelloworld5two\nhelloworld6three\n\
    helloworld4four\nlinefive\nlinesix\nlineseven\n```\n\nReplace every line of `data4.txt`\
    \ with the word `pasta` with this command:\n\n```\nsed 's/.*/\\pasta/' < data4.txt\n\
    ```\n\nThe output is here:\n\n```\npasta\npasta\npasta\npasta\npasta\npasta\n\
    pasta\n```\n\nInsert two blank lines after the third line and one blank line after\
    \ the fifth line in `data4.txt` with this command:\n\n```\nsed '3G;3G;5G' < data4.txt\n\
    ```\n\nThe output is here:\n\n```\n hello world4\n   hello world5 two\nhello world6\
    \ three\n\n       hello world4 four\nline five\n\nline six\nline seven\n```\n\n\
    Insert a blank line after every line of `data4.txt` with this command:\n\n```\n\
    sed G < data4.txt\n```\n\nThe output is here:\n\n```\n hello world4\n\n    hello\
    \ world5 two\n\nhello world6 three\n\n       hello world4 four\n\nline five\n\n\
    line six\n\nline seven\n```\n\nInsert a blank line after every other line of `data4.txt`\
    \ with this command:\n\n```\nsed n\\;G < data4.txt\n```\n\nThe output is here:\n\
    \n```\n hello world4\n   hello world5 two\n hello world6 three\n        hello\
    \ world4 four\nline five\nline six\n\nline seven\n```\n\nReverse the lines in\
    \ `data4.txt` with this command:\n\n```\nsed '1! G; h;$!d' < data4.txt\n```\n\n\
    The output of the preceding `sed` command is here:\n\n```\nline seven\nline six\n\
    line five\n         hello world4 four\n hello world6 three\n    hello world5 two\n\
    \   hello world4\n```\n\n### Summary\n\nThis chapter introduced you to the `sed`\
    \ utility, illustrating the basic tasks of data transformation: allowing additions,\
    \ removal, and mutation of data by matching individual patterns, or matching the\
    \ position of the rows in a file, or a combination of the two.\n\nMoreover, we\
    \ showed that `sed` not only uses regular expressions to match data, similar to\
    \ the `grep` command, but can also use regular expressions to describe how to\
    \ transform the data. Finally, there was a list of examples showing both the versatility\
    \ of the `sed` command, and hopefully communicating the sense that it is an even\
    \ more flexible and powerful utility than we can show.\n"
