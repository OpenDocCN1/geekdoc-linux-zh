    You can use the pair of metacharacters `.*` to find the occurrences of two words
    that are separated by an arbitrary number of intermediate characters.


    The following command finds all lines that contain the strings `one` and `three`
    with any number of intermediate characters:


    ```bash

    grep "one.*three" columns4.txt

    one two three

    ```


    You can “invert” the preceding result by using the `-v` switch, as shown here:


    ```bash

    grep –v "one.*three" columns4.txt

    123 ONE TWO

    456 three four

    ONE TWO THREE FOUR

    five 123 six

    four five

    ```


    The following command finds all lines that contain the strings `one` and `three`
    with any number of intermediate characters, where the match involves a case-insensitive
    comparison:


    ```bash

    grep −i "one.*three" columns4.txt

    ONE TWO THREE FOUR

    one two three

    ```


    You can “invert” the preceding result by using the `-v` switch, as shown here:


    ```bash

    grep –iv "one.*three" columns4.txt

    123 ONE TWO

    456 three four

    five 123 six

    four five

    ```


    Sometimes you need to search a file for the presence of either of two strings.
    For example, the following command finds the files that contain `start` or `end`:


    ```bash

    grep −l ''start\|end'' *

    ABC2.txt

    ABC4.sh

    abc3.sh

    ```


    Later in the chapter you will see how to find files that contain a pair of strings
    via the `grep` and `xargs` commands.


    ## Character Classes and the `grep` Command


    This section contains some simple one-line commands that combine the `grep` command
    with character classes.


    ```bash

    echo "abc" | grep ''[:alpha:]''

    abc

    echo "123" | grep ''[:alpha:]''

    (returns nothing, no match)

    echo "abc123" | grep ''[:alpha:]''

    abc123

    echo "abc" | grep ''[:alnum:]''

    abc

    echo "123" | grep ''[:alnum:]''

    (returns nothing, no match)

    echo "abc123" | grep ''[:alnum:]''

    abc123

    echo "123" | grep ''[:alnum:]''

    (returns nothing, no match)

    echo "abc123" | grep ''[:alnum:]''

    abc123

    echo "abc" | grep ''[0-9]''

    (returns nothing, no match)

    echo "123" | grep ''[0-9]''

    123

    echo "abc123" | grep ''[0-9]''

    abc123

    echo "abc123" | grep -w ''[0-9]''

    (returns nothing, no match)

    ```


    ## Working with the –c Option in `grep`


    Consider a scenario in which a directory (such as a log directory) has files created
    by an outside program. Your task is to write a shell script that determines which
    (if any) of the files that contain two occurrences of a string, after which additional
    processing is performed on the matching files (e.g., use email to send log files
    containing two or more error messages to a system administrator for investigation).


    One solution involves the `-c` option for `grep`, followed by additional invocations
    of the `grep` command.


    The command snippets in this section assume the following data files whose contents
    are shown below.


    The file `hello1.txt` contains the following:


    ```bash

    hello world1

    ```


    The file `hello2.txt` contains the following:


    ```

    hello world2

    hello world2 second time

    ```


    The file `hello3.txt` contains the following:


    ```

    hello world3

    hello world3 two

    hello world3 three

    ```


    Now launch the following commands: (`2>/dev/null` keeps warnings and errors caused
    by empty directories from cluttering up the output):


    ```bash

    grep -c hello hello*txt 2>/dev/null

    hello1.txt:1

    hello2.txt:2

    hello3.txt:3

    grep -l hello hello*txt 2>/dev/null

    hello1.txt

    hello2.txt

    hello3.txt

    grep -c hello hello*txt 2>/dev/null |grep ":2$"

    hello2.txt:2

    ```


    Note how we use the “ends with” `$` metacharacter to grab just the files that
    have exactly two matches. We also use the colon `:2$` rather than just `2$` to
    prevent grabbing files that have 12, 32, or 142 matches (which would end in `:12`,
    `:32`, and `:142`).


    What if we wanted to show “two or more” (as in the “2 or more errors in a log”)?
    You would instead use the invert (`-v`) command to exclude counts of exactly 0
    or exactly 1.


    ```bash

    grep -c hello hello*txt 2>/dev/null |grep -v '':[0-1]$''

    hello2.txt:2

    hello3.txt:3

    ```


    In a real-world application, you would want to strip off everything after the
    colon to return only the filenames. There are many ways to do so, but we’ll use
    the `cut` command we learned in [Chapter 1](#chap1.xhtml).


    ## Matching a Range of Lines


    In [Chapter 1](#chap1.xhtml) you saw how to find files that contain a pair of
    strings via the `grep` and `xargs` commands. Now suppose you want to search a
    range of lines. For instance, the following command displays lines 9 through 15
    of `longfile.txt` that contain `and:`:


    ```bash

    cat longfile.txt |head -15|tail -9 |grep "$$"

    ```


    The output is here (without the line number because we are not using `cat -n`):


    ```

    and each line

    and if you

    ```


    Recall that the “use the file name(s) in the command, instead of using `cat` to
    display the file first” style is more efficient:


    ```bash

    head -15 longfile.txt |tail -9 |grep "$$"

    and each line

    and if you

    ```


    However, the `head` command does not display the line numbers of a text file,
    so the “cat first” (`cat -n` adds line numbers) style is used in the earlier examples
    when you want to see the line numbers, even though this style is less efficient.
    Basically you only want to add an extra command to a pipe if it is adding value,
    otherwise it’s better to start with a direct call to the files you are trying
    to process with the first command in the pipe, assuming the command syntax is
    capable of reading in filenames.


    The use of whitespace is safer if you are looking for something at the beginning
    or end of a line. This is a common approach when reading contents of log files
    or other structured text where the first word is often important (a tag like `ERROR`
    or `Warning`, a numeric code or a date). This command displays the lines that
    start with the word `and:`:


    ```bash

    cat longfile.txt |head -15|tail -9 |grep "^and"

    ```


    The output is here:


    ```

    and each line

    and if you

    ```


    Note that the preceding command excludes lines that end in “and” because they
    do not have the whitespace. You could remedy this situation with an “OR” operator
    including both:


    ```bash

    cat -n longfile.txt |head -15|tail -9 |grep "$$"

    ```


    Hence, if you really want to match a specific word, it’s best to use the `-w`
    tag, which is smart enough to handle the variations:


    ```bash

    cat -n longfile.txt |head -15|tail -9 |grep -w "and"

    ```


    However, the preceding allows “command” back into the mix.


    ## Using Back References in the `grep` Command


    The `grep` command allows you to reference a set of characters that match a regular
    expression placed inside a pair of parentheses. For `grep` to parse the parentheses
    correctly, each has to be preceded with the escape character `\.`.


    For example, `grep` ''a\(.\)`'' uses the `.` regular expression to match ab or
    `a3` but not `3a` or `ba.`

