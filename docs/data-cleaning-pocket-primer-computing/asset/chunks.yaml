    \ 1 oswaldcampesato2 staff 195 Sep 28 2017 Divisors.py\n-rw-r--r-- 1 oswaldcampesato2\
    \ staff 267 Sep 28 2017 Divisors2.py\n```\n\n### Metacharacters and the `grep`\
    \ Command\n\nThe fundamental building blocks are the regular expressions that\
    \ match a single character. Most characters, including all letters and digits,\
    \ are regular expressions that match themselves. Any meta-character with special\
    \ meaning may be quoted by preceding it with a backslash.\n\nA regular expression\
    \ may be followed by one of several repetition operators, as shown below.\n\n\
    `. ` matches any single character.\n\n`?` indicates that the preceding item is\
    \ optional and will be matched at most once: `Z?` matches `Z` or `ZZ`.\n\n`*`\
    \ indicates that the preceding item will be matched zero or more times: `Z*` matches\
    \ `Z`, `ZZ`, `ZZZ`, and so forth.\n\n`+` indicates that the preceding item will\
    \ be matched one or more times: `Z+` matches `ZZ`, `ZZZ`, and so forth.\n\n`{n}`\
    \ indicates that the preceding item is matched exactly `n` times: `Z{3}` matches\
    \ `ZZZ`.\n\n`{n,}` indicates that the preceding item is matched n or more times:\
    \ `Z{3,}` matches `ZZZ`, `ZZZZ`, and so forth.\n\n`{,m}` indicates that the preceding\
    \ item is matched at most `m` times: `Z{,3}` matches `Z`, `ZZ`, and `ZZZ`.\n\n\
    `{n,m}` indicates that the preceding item is matched at least `n` times, but not\
    \ more than `m` times: `Z{2,4}` matches `ZZ`, `ZZZ`, and `ZZZZ`.\n\nThe empty\
    \ regular expression matches the empty string (i.e., a line in the input stream\
    \ with no data). Two regular expressions may be joined by the infix operator `|`.\
    \ When used in this manner, the infix operator behaves exactly like a logical\
    \ “OR” statement, which directs the `grep` command to return any line that matches\
    \ either regular expression.\n\n### Escaping Metacharacters with the `grep` Command\n\
    \n[Listing 3.1 displays the contents of `lines.txt`, which contains lines with\
    \ words and metacharacters.\n\n#### LISTING 3.1 lines.txt\n\n```\n abcd\nab\n\
    abc\ncd\ndefg\n.*.\n..\n```\n\nThe following `grep` command lists the lines of\
    \ length 2 (using the `^` begin with and `$` end with operators to restrict length)\
    \ in `lines.txt`:\n\n```\n grep '^..$' lines.txt\n```\n\nThe following command\
    \ lists the lines of length two in `lines.txt` that contain two dots (the backslash\
    \ tells `grep` to interpret the dots as actual dots, not as metacharacters):\n\
    \n```\n grep '^\\.\\.$' lines.txt\n```\n\nThe result is shown here:\n\n```\n ab\n\
    cd\n..\n```\n\nThe following command also displays lines of length two that begin\
    \ and end with a dot (the `*` matches any text of any length, including no text\
    \ at all, and is used as a metacharacter because it is not preceded with a backslash):\n\
    \n```\n grep '^\\.*\\.$' lines.txt\n```\n\nThe following command lists the lines\
    \ that contain a period, followed by an asterisk, and then another period (the\
    \ `^*` is now a character that must be matched because it is preceded by a backslash):\n\
    \n```\n grep '^\\.\\*\\.$' lines.txt\n```\n\n### Useful Options for the `grep`\
    \ Command\n\nThere are many types of pattern matching possibilities with the `grep`\
    \ command, and this section contains an eclectic mix of such commands that handle\
    \ common scenarios.\n\nIn the following examples we have four text files (two\
    \ `.sh` and two `.txt`) and two Word documents in a directory. The string `abc`\
    \ is found on one line in `abc1.txt` and three lines in `abc3.sh`. The string\
    \ `ABC` is found on 2 lines in `ABC2.txt` and 4 lines in `ABC4.sh`. Notice that\
    \ `abc` is not found in `ABC` files, and `ABC` is not found in `abc` files.\n\n\
    ```\n ls *\nABC.doc  ABC4.sh        abc1.txt        ABC2.txt   abc.doc\nabc3.sh\n\
    ```\n\nThe following code snippet searches for occurrences of the string `abc`\
    \ in all the files in the current directory that have `sh` as a suffix:\n\n```\n\
    \ grep abc *sh\nabc3.sh:abc at start\nabc3.sh:ends with -abc\nabc3.sh:the abc\
    \ is in the middle\n```\n\nThe `-c` option counts the number of occurrences of\
    \ a string (note that even though `ABC4.sh` has no matches, it still counts them\
    \ and returns zero):\n\n```\n grep –c abc *sh\n```\n\nThe output of the preceding\
    \ command is here:\n\n```\n ABC4.sh:0\nabc3.sh:3\n```\n\nThe `-e` option lets\
    \ you match patterns that would otherwise cause syntax problems (the `–` character\
    \ normally is interpreted as an argument for `grep`):\n\n```\n grep –e \"-abc\"\
    \ *sh\nabc3.sh:ends with -abc\n```\n\nThe `-e` option also lets you match multiple\
    \ patterns.\n\n```\n grep –e \"-abc\" -e \"comment\" *sh\nABC4.sh:# ABC in a comment\n\
    abc3.sh:ends with -abc\n```\n\nThe `-i` option is to perform a case insensitive\
    \ match:\n\n```\n grep –i abc *sh\nABC4.sh:ABC at start\nABC4.sh:ends with ABC\n\
    ABC4.sh:the ABC is in the middle\nABC4.sh:# ABC in a comment\nabc3.sh:abc at start\n\
    abc3.sh:ends with -abc\nabc3.sh:the abc is in the middle\n```\n\nThe `-v` option\
    \ “inverts” the matching string, which means that the matching string is not displayed:\n\
    \n```\n grep –v abc *sh\nABC4.sh:ABC at start\nABC4.sh:ends with ABC\nABC4.sh:the\
    \ ABC is in the middle\nABC4.sh:# ABC in a comment\n```\n"
