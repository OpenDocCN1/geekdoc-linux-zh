  trans: "\n\n运行 Listing A.32 的输出如下：\n\n```\n FILES: rain1.csv rain2.csv rain3.csv\
    \ zain1.csv zain2.csv\nzain3.csv\n\nDAY INCHES DEGREES HUMIDITY\n\n  1 0.37  \
    \ 66.33    24.33\n\n  2 0.05   67.33    25.33\n\n  3 0.46   71.67    16.00\n\n\
    \  4 0.18   79.33    29.67\n\n  5 0.45   70.33    29.67\n\n  6 0.16   79.00  \
    \  30.00\n\n  7 0.27   74.00    30.33\n```\n\n### 计算字段值的组合\n\nListing A.33 显示了壳脚本\
    \ `linear-combo.sh` 的内容，该脚本计算多个数据集中列的各种线性组合，并将一个合并后的数据集作为输出。\n\n#### Listing A.33:\
    \ linear-combo.sh\n\n```\n # => combinations of columns\n\nawk -F',' '\n\n{\n\n\
    \  $2 += $3 * 2 + $4 / 2\n\n  $3 += $4 / 3 + $2 * $2 / 10\n\n  $4 += $2 + $3\n\
    \n  $1 += $2 * 3 - $4 / 10\n\n  printf(\"%d,%.2f,%.2f,%.2f\\n\",$1,$2,$3,$4)\n\
    \n}\n\n' rain?.csv\n```\n\nListing A.33 处理了数据集 `rain1.csv`、`rain2.csv` 和 `rain3.csv`\
    \ 的值，这些内容在本节前面已经显示过。关键的观察结果是，`awk` 语句体中的计算序列涉及相互依赖。\n\n具体而言，`$2` 的值是 `$3` 和 `$4`\
    \ 值的线性组合。接下来，`$3` 的值是 `$4` 和 `$2` 值的线性组合，其中后者不是数据集中的原始值，而是其计算值。第三，`$4` 的值是 `$2`\
    \ 和 `$3` 的线性组合，这两者都是计算出的值，而不是数据集中的值。最后，`$1` 的值是新计算出的 `$2` 和 `$4` 值的线性组合。\n\n如你所见，`awk`\
    \ 提供了灵活性，以非常简单且顺序的方式指定几乎任何计算组合（包括非线性组合）。Listing A.33 的输出如下：\n\n```\n 194,113.60,1348.50,1477.10\n\
    \n196,116.12,1407.72,1539.84\n\n204,135.19,1895.97,2041.16\n\n187,183.75,3470.07,3676.82\n\
    \n202,122.68,1567.70,1707.38\n\n194,175.23,3160.89,3370.12\n\n207,142.84,2113.33,2277.17\n\
    \n201,138.00,1975.40,2137.40\n\n202,140.52,2046.92,2212.44\n\n201,159.59,2628.23,2806.82\n\
    \n203,146.15,2211.32,2385.47\n\n203,152.08,2391.83,2579.91\n\n199,169.63,2964.10,3156.73\n\
    \n206,148.74,2288.69,2462.43\n\n183,184.00,3479.93,3697.93\n\n182,185.52,3537.43,3757.95\n\
    \n200,160.59,2660.25,2839.84\n\n179,191.15,3752.50,3981.65\n\n178,193.08,3826.99,4056.07\n\
    \n195,174.63,3139.56,3347.19\n\n173,198.74,4052.76,4296.50\n### 总结\n\n在本附录中，你看到了如何使用一些实用且多用途的\
    \ `bash` 命令的示例。首先，你看到了用于各种任务的壳脚本示例，例如计算两个正整数的 `GCD`（最大公约数）和 `LCM`（最小公倍数）、一个正整数的斐波那契值，以及一个正整数的质因数。接下来，你看到了一个带有\
    \ `grep` 命令、`while` 循环和其他构造的 `bash` 脚本，它可以将数据追加到日志文件中，并带有判断何时退出 `bash` 脚本的逻辑。此外，你学习了如何使用\
    \ `grep` 命令来模拟一个简单的数据库。在附录的最后部分，你学习了如何使用 `awk` 处理跨多行的记录，如何计算涉及多个数据集的列和和平均值，以及如何使用\
    \ `awk` 相关的函数如 `gsub()` 和 `split()`。最后，你学习了如何动态计算多个数据集的列组合。\n\n## 索引\n\n#### A\n\
