    As you can see, the preceding output displays four non-empty lines, and as we\
    \ saw in the previous `grep` command, line #3 is an empty line.\n\n### **Using\
    \ Keys to Search Datasets**\n\nData is often organized around unique values (typically\
    \ numbers) in order to distinguish otherwise similar things: for example, `John\
    \ Smith` the *manager* must not be confused with `John Smith` the *programmer*\
    \ in an employee dataset. Hence, each record is assigned a unique number that\
