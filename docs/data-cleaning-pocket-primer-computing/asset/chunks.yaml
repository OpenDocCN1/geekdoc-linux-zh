    \n[Listing 2.7](#chap2.xhtml_li2-7) sets the value of `IFS` to an empty string,\
    \ which is required for this shell script to work correctly (try running this\
    \ script without setting `IFS` and see what happens). The body of this script\
    \ contains a while loop that reads each line from the input file called `datacolumns1.txt`\
    \ and sets the `pound` variable equal to “” if a line does not start with the\
    \ “#” character OR sets the `pound` variable equal to the entire line if it does\
    \ start with the “#” character. This is a simple technique for “filtering” lines\
    \ based on their initial character.\n\nThe `if` statement executes for lines that\
    \ do not start with a “#” character, and the variables `empid`, `fname`, and `lname`\
    \ are initialized to the characters in columns 3 through 9, then 11 through 19,\
    \ and then 21 through 29, respectively. The values of those three variables are\
    \ printed each time they are initialized. As you can see, these variables are\
    \ initialized by a combination of the `echo` command and the `cut` command, and\
    \ the value of `IFS` is required in order to ensure that the `echo` command does\
    \ not remove blank spaces.\n\nThe output from [Listing 2.7](#chap2.xhtml_li2-7)\
    \ is shown below:\n\n```\n line:   1000   Jane   Edwards\nempid: 1000\nfname:\
    \ Jane\nlname: Edwards\n--------------\nline:   2000   Tom    Smith\nempid: 2000\n\
    fname: Tom\nlname: Smith\n--------------\nline:   3000   Dave   Del Ray\nempid:\
    \ 3000\nfname: Dave\nlname: Del Ray\n--------------\n```\n\n### Working with Uneven\
    \ Rows in Datasets\n\n[Listing 2.8](#chap2.xhtml_li2-8) displays the contents\
    \ of the dataset `uneven.txt` that contains rows with a different number of columns.\
    \ [Listing 2.9](#chap2.xhtml_li2-9) displays the contents of the `bash` script\
    \ `uneven.sh` that illustrates how to generate a dataset whose rows have the same\
    \ number of columns.\n\n##### LISTING 2.8 uneven.txt\n\n```\n abc1 abc2 abc3 abc4\n\
    abc5 abc6\nabc1 abc2 abc3 abc4\nabc5 abc6\n```\n\n##### LISTING 2.9 uneven.sh\n\
    \n```\n inputfile=\"uneven.txt\"\noutputfile=\"even2.txt\"\n\n# ==> four fields\
    \ per line\n\n#method #1: four fields per line\ncat $inputfile | xargs -n 4 >$outputfile\n\
    \n#method #2: two equal rows\n#xargs -L 2 <$inputfile > $outputfile\n\necho \"\
    input file:\"\ncat $inputfile\n\necho \"output file:\"\ncat $outputfile\n```\n\
    \n[Listing 2.9](#chap2.xhtml_li2-9) contains two techniques for realigning the\
    \ input file so that the output appears with four columns in each row. As you\
    \ can see, both techniques involve the `xargs` command (which is an interesting\
    \ use of the `xargs` command).\n\nLaunch the code in [Listing 2.9](#chap2.xhtml_li2-9)\
    \ and you will see the following output:\n\n```\n abc1 abc2 abc3 abc4\nabc5 abc6\
    \ abc1 abc2\nabc3 abc4 abc5 abc6\n```\n\n### Working with Functions in Shell Scripts\n\
    \nA shell function can be defined by using the keyword `function`, followed by\
    \ the name of the function (specified by you) and a pair of round parentheses,\
    \ followed by a pair of curly braces that contain shell commands. The general\
    \ form is shown here:\n\n```\n function fname()\n{\n   statements;\n}\n```\n\n\
    An alternate method of defining a shell function is shown here:\n\n```\n fname()\n\
    {\n   statements;\n}\n```\n\nA function can be invoked by its name:\n\n```\nfname()\n\
    ```\n\nArguments can be passed to functions and can be accessed by the shell:\n\
    \n```\narg1 arg2\n```\n\n[Listing 2.10](#chap2.xhtml_li2-10) displays the contents\
    \ of `checkuser.sh`, which illustrates how to prompt users for a first name and\
    \ a last name.\n\n##### LISTING 2.10 checkuser.sh\n\n```\n#!/bin/bash\n\n # empid:\
    \ 03-09\n# fname: 11-20\n# lname: 21-30\nIFS=''\ninputfile=\"datacolumns1.txt\"\
    \n\nwhile read line\ndo\n  pound=\"`echo $line |grep '^#'`\"\n\n  if [ x\"$pound\"\
    \ == x\"\" ]\n  then\n    echo \"line: $line\"\n    empid=`echo \"$line\" |cut\
    \ -c3-9`\n    echo \"empid: $empid\"\n\n    fname=`echo \"$line\" |cut -c11-19`\n\
    \    echo \"fname: $fname\"\n\n    lname=`echo \"$line\" |cut -c21-29`\n    echo\
    \ \"lname: $lname\"\n    echo \"--------------\"\n  fi\ndone < $inputfile\n```\n\
    \nThe `if` statement executes for lines that do not start with a “#” character,\
    \ and the variables `empid`, `fname`, and `lname` are initialized to the characters\
    \ in columns 3 through 9, then 11 through 19, and then 21 through 29, respectively.\
    \ The values of those three variables are printed each time they are initialized.\
    \ As you can see, these variables are initialized by a combination of the `echo`\
    \ command and the `cut` command, and the value of `IFS` is required in order to\
    \ ensure that the `echo` command does not remove blank spaces.\n\n[Listing 2.10](#chap2.xhtml_li2-10)\
    \ contains the following: which sets the value of `IFS` to an empty string, which\
    \ is required for this shell script to work correctly (try running this script\
    \ without setting `IFS` and see what happens). The body of this script contains\
    \ a while loop that reads each line from the input file called `datacolumns1.txt`\
    \ and sets the `pound` variable equal to “” if a line does not start with the\
    \ “#” character OR sets the `pound` variable equal to the entire line if it does\
    \ start with the “#” character. This is a simple technique for “filtering” lines\
    \ based on their initial character.\n\nThe output from [Listing 2.10](#chap2.xhtml_li2-10)\
    \ is shown below:\n\nThe function returns the 1 if the first argument is John\
    \ and the second argument is Smith.\n\ncheckUser $fname $lname\n\nThe function\
    \ returns 1 if the first argument is John and the second argument is Smith.\n\n\
    Wait, the function says `checkUser $fname $lname returns 1 if the first argument\
    \ is John and the second argument is Smith.\n\nWhat about using command substitution\
    \ in order to invoke the function `checkUser`? To find out what would happen,\
    \ let’s add the following snippet to the bottom of [Listing 2.10](#chap2.xhtml_li2-10):\n\
    \n```\nresult=`checkUser $fname $lname`\necho \"result = $result\"\n```\n\nLaunch\
    \ the modified version of [Listing 2.10](#chap2.xhtml_li2-10), provide the same\
    \ input values of `John` and `Smith`, and compare the following result:\n\n```\n\
    \ line:   1000   Jane   Edwards\nempid: 1000\nfname: Jane\nlname: Edwards\n--------------\n\
    line: 2000   Tom    Smith\nempid: 2000\nfname: Tom\nlname: Smith\n--------------\n\
    line:   3000   Dave   Del Ray\nempid: 3000\nfname: Dave\nlname: Del Ray\n--------------\n\
    ```\n\n### Recursion and Shell Scripts\n\nThis section contains several examples\
    \ of shell scripts with recursion, which is a topic that occurs in many programming\
    \ languages. Although you probably won’t need to write many scripts that use recursion,\
    \ it’s worthwhile to learn this concept, especially if you plan to study other\
    \ languages.\n\nIf you already understand recursion, then the scripts in this\
    \ section will be straightforward. In particular, you will learn how to calculate\
    \ the factorial value of a positive integer. In case you are interested, the Appendix\
    \ contains bash scripts for calculating the Fibonacci number of a positive integer,\
    \ as well as bash scripts for calculating the greatest common divisor (GCD) and\
    \ the least common multiple (LCM) of two positive integers.\n\n[Listing 2.11](#chap2.xhtml_li2-11)\
    \ displays the contents of `Factorial.sh` that computes the factorial value of\
    \ a positive integer.\n\n```\n #!/bin/sh\n\nfactorial()\n{\n\n   if [ \"$1\" -gt\
    \ 1 ]\n   then\n      decr=`expr $1 - 1`\n      result=`factorial $decr`\n   \
    \   product=`expr $1 \\* $result`\n      echo $product\n   else\n      # we have\
    \ reached 1:\n      echo 1\n   fi\n}\necho \"Enter a number: \"\nread num\n\n\
    # add code to ensure it's a positive integer\n\necho \"$num! = `factorial $num`\"\
    \n```\n"
