    第三，任何 shell 脚本的内容都可以简单到只有一条命令，也可以由数百行 bash 命令组成。通常情况下，越有趣的 shell 脚本涉及到多个 bash
    命令的组合。一个学习建议：由于通常有多种方法可以实现所需的结果，因此阅读他人的 shell 脚本来学习如何以有用的方式组合命令很有帮助。


    ## 什么是 Unix？


    Unix 是 Ken Thompson 在 20 世纪 70 年代初创建的操作系统，今天有多个变体，例如用于 HP 机器的 HP/UX 和用于 IBM 机器的
    AIX。Linus Torvalds 在 20 世纪 90 年代开发了 Linux 操作系统，许多 Linux 命令与其对应的 `bash` 版本命令是相同的（但存在差异，通常体现在系统管理员的命令上）。Mac
    OS X 操作系统基于 AT&T Unix。


    Unix 拥有丰富且历史悠久的历史，如果你真的对学习它的过去感兴趣，可以阅读在线文章以及维基百科。本书跳过了这些细节，专注于帮助你快速学会如何使用各种命令来提高工作效率。


    ## 可用的 Shell 类型


    原始的 Unix shell 是 Bourne shell，由 Stephen R. Bourne 在 20 世纪 70 年代中期编写。此外，Bourne
    shell 是第一个出现在 `bash` 系统上的 shell，你有时会听到用“the shell”来指代 Bourne shell。Bourne shell
    是一个 `POSIX` 标准 shell，通常在大多数版本的 Unix 上被安装为 `/bin/sh`，其默认提示符是 `$` 字符。因此，Bourne shell
    脚本将可以在几乎每一个版本的 Unix 上。从本质上说，AT&T 系 Unix 支持 Bourne shell `(sh)`、`bash`、Korn shell
    `(ksh)`、`tsh` 和 `zsh`。


    然而，Unix 还有一个 `BSD` 分支，使用“C” shell `(csh)`，其默认提示符是 `%` 字符。通常，为 `csh` 编写的 shell
    脚本不会在 AT&T 分系的 Unix 上执行，除非这些机器上也安装了 `csh` shell（反之亦然）。


    Bourne shell 在某种意义上是最“原始”的，因为它缺少了其他 shell 中提供的某些命令，例如 `history`、`noclobber` 等。Bourne
    Shell 的各种子类列如下：


    - Bourne shell `(sh)`

    - Korn shell `(ksh)`

    - Bourne Again shell `(bash)`

    - POSIX shell `(sh)`


    不同的 C 类 shell 如下：


    - C shell `(csh)`

    - TENEX/TOPS C shell `(tcsh)`


    虽然书中的命令和 shell 脚本是基于 `bash` shell 的，但许多命令在其他 shell 中同样有效（如果无效，其他 shell 也有类似的命令来实现相同的目标）。在互联网上搜索“我如何在
    `<shell name>` 中执行 `<bash command>`”通常能给你一个答案。有时命令在本质上是相同的，但语法略有不同，在命令 shell 中输入
    `man <command>` 可以提供有用信息。


    ## 什么是 bash？


    `bash` 是“Bourne Again Shell”的缩写，它的根源于 Stephen R. Bourne 创建的 Bourne shell。基于 Bourne
    shell 的 shell 脚本将在 `bash` 中执行，但反之则不然。`bash` shell 提供了 Bourne shell 中不可直接的额外功能，例如对数组的支持（在本章稍后讨论）。


    在 Mac OS X 上，`/bin` 目录包含以下可执行的 shell：


    ```

    -r-xr-xr-x   1  root   wheel   1377872   Apr 28  2017 /bin/ksh

    -r-xr-xr-x   1  root   wheel    630464   Apr 28  2017 /bin/sh

    -rwxr-xr-x   1  root   wheel    375632   Apr 28  2017 /bin/csh

    -rwxr-xr-x   1  root   wheel    592656   Apr 28  2017 /bin/zsh

    -r-xr-xr-x   1  root   wheel    626272   Apr 28  2017 /bin/bash

    ```


    如果你感兴趣，这里有一个关于上述 shell 对各种功能支持的对比矩阵：

    https://stackoverflow.com/questions/5725296/difference-between-sh-and-bash.


    还有可能让你惊讶的事是：在某些环境中，Bourne shell `sh` *确实就是* Bash shell，你可以通过输入以下命令来检查：


    ```

    sh  --version

    GNU bash, version 3.2.57(1)-release (x86_64-apple-darwin16)

    Copyright (C) 2007 Free Software Foundation, Inc.

    ```


    如果你是命令行界面的新手（无论是 Mac、Linux 还是 PC），请阅读前言，它提供了一些访问命令 shell 的有用指南。


    ### 获取 `bash` 命令的帮助


    如果你想查看特定 `bash` 命令的选项，请指定 `-?` 开关。例如，`cat -?` 会显示 `cat` 命令的可用选项。你可以调用 `man` 命令来查看
    `bash` 命令及其选项的描述：


    ```

    man  cat

    ```


    请记住，`man` 命令产生的解释是简短的，如果这些解释不够清楚，你可以。


    ## 导航


    `man` 命令产生简短的解释，如果这些解释不够清楚，你可以。


    ### `history` 命令


    `man` 命令产生简短的解释，如果这些解释不够清楚，你可以。


    `history` 命令显示你执行的命令历史，如下：


    ```

    history

    ```


    上述命令的示例输出是：


    ```

    1202   cat longfile.txt >file2.txt

    1203   vi  longfile.txt

    1204   cat longfile.txt |fold-40

    1205   cat longfile.txt |fold-30

    1206   cat longfile.txt |fold-50

    1207   cat longfile.txt |fold-45

    1208   vi  longfile.txt

    1209   history

    1210   cd /Library/Developer/CommandLineTools/usr/include/c++

    1211   cd /tmp

    1212   cd $HOME/Desktop

    1213   history

    ```


    现在你可以使用以下命令返回 1210 行的目录：


    ```

    !1210

    ```


    `!cd` 命令会在命令历史中反向搜索第一个匹配的 `cd` 命令：在这种情况下，1212 行是第一个匹配项。如果当前命令与 1210 行命令之间没有 `cd`
    命令，那么 `!1210` 和 `!cd` 将产生相同的效果。


    **注意**


    在使用 bash 命令的“!” 选项时要小心，因为匹配“!”的命令可能不是你预期的，因此安全的方法是使用 `history` 命令，然后在调用“!”运算符时显式地指定正确的数字。


    ### 使用 `ls` 命令列出文件名


    `ls` 命令用于列出文件名，有许多可用的开关可以使用，如本节所示。例如，`ls` 命令在我的 Mac 上显示以下文件名（实际显示取决于字体大小和命令 shell
    的宽度）：


    ```

    apple-care.txt     iphonemeetup.txt    outfile.txt      ssl-

    instructions.txt     checkin-commands.txt   kyrgyzstan.txt

    output.txt

    ```

