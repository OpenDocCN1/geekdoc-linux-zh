    \ that start with the word `and:`\n\n```\n cat longfile.txt |head -15|tail -9\
    \ | grep \"^and \"\n```\n\nThe output is here (without the line number because\
    \ we are not using “`cat -n`”):\n\n```\n and each line\nand if you\n```\n\nRecall\
    \ that the “use the file name(s) in the command, instead of using `cat` to display\
    \ the file first” style is more efficient:\n\n```\n head -15 longfile.txt |tail\
    \ -9 | grep \"^and \"\nand each line\nand if you\n```\n\nHowever, the `head` command\
    \ does not display the line numbers of a text file, so the “cat first” (`cat -n`\
    \ adds line numbers) style is used in the earlier examples when you want to see\
    \ the line numbers, even though this style is less efficient. Basically, you only\
    \ want to add an extra command to a pipe if it is adding value, otherwise it’s\
    \ better to start with a direct call to the files you are trying to process with\
    \ the first command in the pipe, assuming the command syntax is capable of reading\
    \ in filenames.\n\n### **Using Back References in the `grep` Command**\n\nThe\
    \ `grep` command allows you to reference a set of characters that match a regular\
    \ expression placed inside a pair of parentheses. For `grep` to parse the parentheses\
    \ correctly, each has to be preceded with the escape character “\\.”\n\nFor example,\
    \ `grep` '`a\\(.\\)`' uses the “.” regular expression to match ab or “`a3`” but\
    \ not “`3a`” or “`ba.`”"
