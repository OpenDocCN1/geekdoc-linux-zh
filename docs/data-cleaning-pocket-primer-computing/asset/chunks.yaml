  trans: "\n正如我们之前在其他命令中看到的，直接使用 `sed` 命令读取文件总是比通过其他命令进行管道传输更高效。你可以从另一个命令向它“喂送”数据，前提是该命令添加了价值（例如添加行号、删除空行或其他类似的有帮助的操作）。\n\
    \n`-n` 选项会抑制所有输出，而 `p` 选项会打印匹配的行。如果你省略了 `-n` 选项，则每一行都会被打印，而 `p` 选项会导致匹配的行被再次打印。因此，你可以执行以下命令：\n\
    \n```\n sed \"/3/p\" numbers.txt\n```\n\n输出（冒号右侧的数据）如下。注意，冒号左侧的标签显示了数据的来源，用来说说明\
    \ `sed` “一次处理一行”的行为。\n\n```\n Basic stream output :1\nBasic stream output :2\n\
    Basic stream output :123\nPattern Matched text:123\nBasic stream output :3\nPattern\
    \ Matched text:3\nBasic stream output :five\nBasic stream output :4\n```\n\n还可以匹配两个模式并打印匹配行之间的所有内容：\n\
    \n```\n sed –n \"/123/,/five/p\" numbers.txt\n```\n\n上一个命令的输出（包含 123 到 five 之间的所有行）在这里：\n\
    \n```\n 123\n3\nfive\n```\n\n### 使用 `sed` 替换字符串模式\n\n本节中的示例说明了如何使用 `sed` 将现有文本模式替换为新文本。\n\
    \n```\n x=\"abc\"\necho $x |sed \"s/abc/def/\"\n```\n\n上一个代码段的输出在这里：\n\n```\n\
    \ def\n```\n\n在之前的命令中，你指示 `sed` 将第一个文本模式 `/abc` 替换为第二个模式 `/def`，并且没有后续的指令 `/`。\n\
    \n删除文本模式只需将第二个模式留空即可：\n\n```\n echo \"abcdefabc\" |sed \"s/abc//\"\n```\n\n结果在这里：\n\
    \n```\n defabc\n```\n\n如你所见，这只删除了模式的第一次出现。你可以通过添加“全局”终端指令 `/g` 来删除模式的所有出现情况：\n\
    \n```\n echo \"abcdefabc\" |sed \"s/abc//g\"\n```\n\n上一个命令的结果在这里：\n\n```\n def\n\
    ```\n\n注意，我们通过此命令直接在主流上操作，因为我们没有使用 `-n` 标记。你也可以使用 `-n` 抑制主流并使用终端 `p`（打印）指令打印替换内容，从而达到相同的输出：\n\
    \n```\n echo \"abcdefabc\" |sed -n \"s/abc//gp\"\ndef\n```\n\n对于替换操作，两种语法均可，但对于其他命令来说并不总是如此。\n\
    \n你还可以使用数字元字符作为你的正则表达式匹配模式来删除数字而不是字母（参考第 1 章）：\n\n```\n ls svcc1234.txt |sed \"\
    s/[0-9]//g\"\nls svcc1234.txt |sed –n \"s/[0-9]//gp\"\n```\n\n上述两个命令中任一的结果在这里：\n\
    \n```\n svcc.txt\n```\n\n记得文件 `columns4.txt` 包含以下文本：\n\n```\n 123 ONE TWO\n456\
    \ three four\nONE TWO THREE FOUR\nfive 123 six\none two three\nfour five\n```\n\
    \n接下来的 `sed` 命令被指示识别 1 到 3（包含边界）之间的行 `/1,3`，并从输出中删除 `d` ：\n\n```\n cat columns4.txt\
    \ | sed \"1,3d\"\n```\n\n输出在这里：\n\n```\n five\n23 six\none two three\nfour five\n\
    ```\n\n接下来的 `sed` 命令删除了一个范围范围，从匹配 `123` 的行开始，一直持续到文件中直到匹配 `five` 的行（同时也删除了所有中间行）。该语法在之前的示例中应该常见：\n\
    \n```\n sed \"/123/,/five/d\" columns4.txt\n```\n\n输出在这里：\n\n```\n one two three\n\
    four five\n```\n\n#### 替换字符串或文件中的元音\n\n以下代码段展示了使用 `sed` 命令替换字符串中多个元音是多么简单：\n\n\
    ```\n echo \"hello\" | sed \"s/[aeio]/g\"\n```\n\n上一个代码段的输出在这里：\n\n```\n Hull\n\
    ```\n\n#### 从字符串中删除多个数字和字母\n\n假设我们有一个变量 `x`，定义如下：\n\n```\n x=\"a123\"\n```\n\n\
    记得整数由一个或多个数字组成，因此 `[0-9]+` 匹配一个或多个数字。然而，你需要指定表达式 `[0-9]*` 来删除 `x` 中的每个数字：\n\n\
    ```\n echo $x | sed \"s/[0-9]//g\"\n```\n\n上一个命令的输出在这里：\n\n```\n a\n```\n\n接下来的命令删除了\
    \ `x` 中的所有小写字母：\n\n```\n echo $x | sed \"s/[a-z]//g\"\n```\n\n上一个命令的输出在这里：\n\n\
    ```\n 123\n```\n\n接下来的命令删除了 `x` 中的所有大小写字母：\n\n```\n echo $x | sed \"s/[a-zA-Z]//g\"\
    \n```\n\n上一个命令的输出在这里：\n\n```\n 123\n```\n\n#### 使用 `sed` 进行搜索和替换\n\n上一节展示了如何根据起始行和结束行，使用数字范围或字符串对来删除文本文件中的范围行。由于删除只是将匹配内容替换为空结果，现在应该很清楚，替换涉及填充命令的该部分以实现你想要的结果。本节包含了各种示例，说明了如何获得精确的替换。\n\
    \n以下示例说明了如何在 `sed` 中将 `abc` 转换为大写的 `ABC`：\n\n```\n echo \"abc\" |sed \"s/abc/ABC/\"\
    \n```\n\n上一个命令的输出在这里（仅对 `abc` 的一种情况有效）：\n\n```\n ABC\n```\n\n下一个示例显示了上一个命令的输出在这里（`/g`\
    \ 意味着作用于 `abc` 的所有情况）：\n\n```\n ABCdefABC\n```\n\n接的 `sed` 表达式执行了三个连续替换，使用 `-e`\
    \ 将它们连接起来。它将正好一个（第一个）`a` 更改为 `A`，一个 `b` 更改为 `B`，一个 `c` 更改为 `C`：\n\n```\n echo\
    \ \"abcde\" |sed -e \"s/a/A/\" -e \"s/b/B/\" -e \"s/c/C/\"\n```\n\n上一个命令的输出在这里：\n\
    \n```\n ABCde\n```\n\n显然，你可以使用下面的 `sed` 表达式将三个替换合并为一个替换：\n\n```\n echo \"abcde\"\
    \ |sed \"s/abc/ABC/\"\n```\n\n尽管如此，当你需要执行无法合并为单个替换的更复杂的替换时，`-e` 开关是有用的。\n\n`/`\
    \ 并不是 `sed` 支持的唯一分隔符，这在字符串包含 `/` 字符时非常有用。例如，你可以通过此命令反转 `/aa/bb/cc/` 的顺序：\n\n```\n\
    \ echo \"/aa/bb/cc\" |sed -n \"s#/aa/bb/cc#/cc/bb/aa/#p\"\n```\n\n上一个 `sed` 命令的输出在这里：\n\
    \n```\n /cc/bb/aa/\n```\n\n以下示例说明了如何使用 `w` 终端命令指令将 `sed` 的输出同时写入标准输出以及命名为 `upper1`\
    \ 的文件（如果匹配成功）：\n\n```\n echo \"abcdefabc\" |sed \"s/abc/ABC/wupper1\"\nABCdefabc\n\
    ```\n\n如果你检查文本文件 `upper1` 的内容，你会发现它包含了与屏幕显示的相同字符串 `ABCdefabc`。我们之前在打印 (`p`) 终端指令中注意到的这种双流行为是不寻常的，但有时有用。更常见的是直接使用\
    \ `>` 语法将标准输出发送到文件，如下所示（两种语法对替换操作都有效），但在那种情况下没有内容写入终端屏幕。之前的语法允许同时进行两者：\n\n```\n\
    \ echo \"abcdefabc\" | sed \"s/abc/ABC/\" > upper1\necho \"abcdefabc\" | sed -n\
    \ \"s/abc/ABC/p\" > upper1\n```\n\n列表 4.1 显示了 `update2.sh` 的内容，它将当前目录下后缀为 `txt`\
    \ 的文件中的字符串 `hello` 替换为字符串 `goodbye`。\n\n##### *列表 4.1 update2.sh*\n\n```\n for\
    \ f in `ls *txt`\ndo\n  newfile=\"${f}_new\"\n  cat $f | sed -n \"s/hello/goodbye/gp\"\
    \ > $newfile\n  mv $newfile $f\ndone\n```\n"
- fmt: "\n[Listing 4.1](#chap4.xhtml_li4-1) contains a `for` loop that iterates over\
    \ the list of text files with the `txt` suffix. For each such file, initialize\
    \ the variable `newfile` that is created by appending the string `_new` to the\
    \ first file (represented by the variable `f`). Next, replace the occurrences\
    \ of `hello` with the string `goodbye` in each file `f`, and redirect the output\
    \ to `$newfile`. Finally, rename `$newfile` to `$f` using the `mv` command.\n\n\
    If you want to perform the update in matching files in all subdirectories, replace\
    \ the “for” statement with the following:\n\n```\nfor f in `find . –print |grep\
    \ \"txt$\"`\n```\n\n### Datasets with Multiple Delimiters\n\n[Listing 4.2](#chap4.xhtml_li4-2)\
    \ displays the contents of the dataset `delim1.txt`, which contains multiple delimiters\
    \ `|`, `:`, and `^`. [Listing 4.3](#chap4.xhtml_li4-3) displays the contents of\
    \ `delimiter1.sh`, which illustrates how to replace the various delimiters in\
    \ `delimiter1.txt` with a single comma delimiter `,`.\n\n#### LISTING 4.2 delimiter1.txt\n\
    \n```\n1000|Jane:Edwards^Sales\n2000|Tom:Smith^Development\n3000|Dave:Del Ray^Marketing\n\
    ```\n\n#### LISTING 4.3 delimiter1.sh\n\n```\ninputfile=\"delimiter1.txt\"\ncat\
    \ $inputfile | sed -e 's/:/,/' -e 's/|/,/' -e 's/\\^/,/'\n```\n\nAs you can see,\
    \ the second line in [Listing 4.3](#chap4.xhtml_li4-3) is simple yet very powerful:\
    \ you can extend the `sed` command with as many delimiters as you require in order\
    \ to create a dataset with a single delimiter between values. The output from\
    \ [Listing 4.3](#chap4.xhtml_li4-3) is shown here:\n\n```\n1000,Jane,Edwards,Sales\n\
    2000,Tom,Smith,Development\n3000,Dave,Del Ray,Marketing\n```\n\nDo keep in mind\
    \ that this kind of transformation can be a bit unsafe unless you have checked\
    \ that your new delimiter is not already in use. For that a `grep` command is\
    \ useful (you want result to be zero):\n\n```\ngrep -c ',' $inputfile\n0\n```\n\
    \n### Useful Switches in `sed`\n\nThe three command line switches `-n`, `-e`,\
    \ and `-i` are useful when you specify them with the `sed` command.\n\nAs a review,\
    \ specify `-n` when you want to suppress the printing of the basic stream output:\n\
    \n```\nsed -n 's/foo/bar/'\n```\n\nSpecify `-n` and end with `/p` when you want\
    \ to match the result only:\n\n```\nsed -n 's/foo/bar/p'\n```\n\nWe briefly touched\
    \ on using `-e` to do multiple substitutions, but it can also be used to combine\
    \ other commands. this syntax lets us separate the commands in the last example:\n\
    \n```\nsed -n -e 's/foo/bar/' -e 'p'\n```\n\nA more advanced example that hints\
    \ at the flexibility of `sed` involves the insertion of a character after a fixed\
    \ number of positions. For example, consider the following code snippet:\n\n```\n\
    echo \"ABCDEFGHIJKLMNOPQRSTUVWXYZ\" | sed \"s/.\\{3\\}/&\\n/g\"\n```\n\nThe output\
    \ from the preceding command is here:\n\n```\nABCnDEFnGHInJKLnMNOnPQRnSTUnVWnYZ\n\
    ```\n\nWhile the above example does not seem especially useful, consider a large\
    \ text stream with no line breaks (everything on one line). You could use something\
    \ like this to insert newline characters, or something else to break the data\
    \ into easier to process chunks. It is possible to work through exactly what `sed`\
    \ is doing by looking at each element of the command and comparing it to the output,\
    \ even if you don’t know the syntax (Tip: sometimes you will encounter very complex\
    \ instructions for `sed` without any documentation in the code: try not to be\
    \ that person when coding.)\n\nThe output is changing after every three characters\
    \ and we know dot (`.`) matches any single character, so `.{3}` must be telling\
    \ it to do that (with escape slashes `\\` because brackets are a special character\
    \ for `sed`, and it won’t interpret it properly if we just leave it as `.{3`.\
    \ The `n` is clear enough in the replacement column, so `&` must be somehow telling\
    \ it to insert a character instead of replacing it. The terminal `g` command of\
    \ course means to repeat. To clarify and confirm those guesses, take what you\
    \ could infer and perform an Internet search.\n\n### Working with Datasets\n\n\
    The `sed` utility is very useful for manipulating the contents of text files.\
    \ For example, you can print ranges of lines, and subsets of lines that match\
    \ a regular expression. You can also perform search-and-replace on the lines in\
    \ a text file. this section contains examples that illustrate how to perform such\
    \ functionality.\n\n#### Printing Lines\n\n[Listing 4.4](#chap4.xhtml_li4-4) displays\
    \ the contents of `test4.txt` (doubled-spaced lines) that are used for several\
    \ examples in this section.\n\n##### LISTING 4.4 test4.txt\n\n```\nabc\n\ndef\n\
    \nabc\n\nabc\n```\n\nThe following code snippet prints the first 3 lines in `test4.txt`\
    \ (we used this syntax before when deleting rows; it is equally useful for printing):\n\
    \n```\ncat test4.txt |sed -n \"1,3p\"\n```\n\nThe output of the preceding code\
    \ snippet is here (the second line is blank):\n\n```\nabc\n\ndef\n```\n\nThe following\
    \ code snippet prints lines 3 through 5 in `test4.txt:`\n\n```\ncat test4.txt\
    \ |sed -n \"3,5p\"\n```\n\nThe output of the preceding code snippet is here:\n\
    \n```\ndef\n\nabc\n```\n\nThe following code snippet takes advantage of the basic\
    \ output stream and the second match stream to duplicate every line (including\
    \ blank lines) in `test4.txt:`\n\n```\ncat test4.txt |sed \"p\"\n```\n\nThe output\
    \ of the preceding code snippet is here:\n\n```\nabc\nabc\n\ndef\ndef\n\nabc\n\
    abc\n\nabc\nabc\n```\n\nThe following code snippet prints the first three lines\
    \ and then capitalizes the string `abc`, duplicating `ABC` in the final output\
    \ because we did not use `-n` and did end with `/p` in the second `sed` command.\
    \ Remember that `/p` only prints the text that matched the `sed` command.\n\n\
    ```\ncat test4.txt |sed -n \"1,3p\"\n```\n\n#### Character Classes and `sed`\n\
    \nYou can also use regular expressions with `sed`. As a reminder, here are the\
    \ contents of `columns4.txt:`\n\n```\n123 ONE TWO\n456 THREE FOUR\none two\n \n\
    ```\n\nAs our first example involving character classes, the following code snippet\
    \ illustrates how to match lines that contain numbers:\n\n```\ncat columns4.txt\
    \ | sed -n '/[0-9]/p'\n```\n\nThe output from the preceding snippet is here:\n\
    \n```\n123\none two\n```\n\nThe following code snippet illustrates how to match\
    \ lines that contain lowercase letters:\n\n```\ncat columns4.txt | sed -n '/[a-z]/p'\n\
    ```\n\nThe output from the preceding snippet is here:\n\n```\n123 ONE TWO\n456\
    \ THREE FOUR\n```\n\nThe following code snippet illustrates how to match lines\
    \ that contain the numbers 4, 5, or 6:\n\n```\ncat columns4.txt | sed -n '/[4-6]/p'\n\
    ```\n\nThe output from the preceding snippet is here:\n\n```\n456 THREE FOUR\n\
    ```\n\nThe following code snippet illustrates how to match lines that start with\
    \ any two characters followed by `EE`:\n\n```\ncat columns4.txt | sed -n '/^.\\\
    {2\\}EE*/p'\n```\n\nThe output from the preceding snippet is here:\n\n```\nONE\
    \ TWO THREE\n```\n\n#### Removing Control Characters\n\n[Listing 4.5](#chap4.xhtml_li4-5)\
    \ displays the contents of `controlchars.txt` that we used before in [Chapter\
    \ 2](#chap2.xhtml). Control characters of any kind can be removed by `sed` just\
    \ like any other character.\n\n##### LISTING 4.5 controlchars.txt\n\n```\n1 carriage\
    \ return^M\n2 carriage return^M\n1 tab character^I\n```\n\nThe following command\
    \ removes the carriage return and the tab characters from the text file `ControlChars.txt:`\n\
    \n```\ncat ControlChars.txt | sed \"s/^M//\" |sed \"s/   //\"\n```\n\nYou cannot\
    \ see the tab character in the second `sed` command in the preceding code snippet;\
    \ however, if you redirect the output to the file `nocontrol1.txt`, you can see\
    \ that there are no embedded control characters in this new file by typing the\
    \ following command:\n\n```\ncat –t nocontrol1.txt\n```\n"
