  trans: "\n\n如果你也想对输出进行排序并只打印唯一的单词，可以使用此命令：\n\n```\n echo $x |tr -s ' ' '\\n' |egrep\
    \ \"^[a-zA-Z]+$\" |sort | uniq\n```\n\n输出结果如下：\n\n```\n 123\n123z\nGhi\nabc\n\
    ghi\n```\n\n如果你只想从变量 `x` 中提取整数，可以使用此命令：\n\n```\n echo $x |tr -s ' ' '\\n' |egrep\
    \ \"^[0-9]+$\" |sort | uniq\n```\n\n输出结果如下：\n\n```\n 123\n```\n\n如果你想从变量 `x` 中提取字母数字单词，可以使用此命令：\n\
    \n```\n echo $x |tr -s ' ' '\\n' |egrep \"^[a-zA-Z0-9]+$\" |sort | uniq\n```\n\
    \n输出结果如下：\n\n```\n 123\n123z\nGhi\nabc \nghi\n```\n\n注意，ASCII 排序序列将数字放在大写字母之前，而大写字母又在小写字母之前，原因如下：0\
    \ 到 9 是十六进制值 `0x30` 到 `0x39`，A–Z 大写字母是十六进制 `0x41` 到 `0x5a`，a–z 小写字母是十六进制 `0x61`\
    \ 到 `0x7a`。\n\n现在你可以将 `echo $x` 替换为数据集，以便从集中仅检索字母字符串。\n\n### `fgrep` 命令\n\n`fgrep`（“快速\
    \ grep”）与 `grep –F` 相同，虽然 `fgrep` 已被弃用，但它仍然被支持，以便允许依赖它的历史应用程序在不修改的情况下运行。此外，某些旧系统可能不支持\
    \ `grep` 命令的 –F 选项，因此它们使用 `fgrep` 命令。如果你真的想学习更多关于 `fgrep` 命令的知识，可以在互联网上搜索教程。\n\
    \n### 简单用例\n\n本节中的代码示例展示了如何使用 `grep` 命令在数据集中查找特定行，然后“合并”行对以创建一个新的数据集。这与关系型数据库中的“join”命令非常相似。列出\
    \ 3.7 显示了文件 `test1.csv` 的内容，该文件包含了初始数据集。\n\n#### 列出 3.7 test1.csv\n\n```\n F1,F2,F3,M0,M1,M2,M3,M4,M5,M6,M7,M8,M9,M10,M11,M12\n\
    1,KLM,,1.4,,0.8,,1.2,,1.1,,,2.2,,,1.4\n1,KLMAB,,0.05,,0.04,,0.05,,0.04,,,0.07,,,0.05\n\
    1,TP,,7.4,,7.7,,7.6,,7.6,,,8.0,,,7.3\n1,XYZ,,4.03,3.96,,3.99,,3.84,4.12,,,,4.04,,\n\
    2,KLM,,0.9,0.7,,0.6,,0.8,0.5,,,,0.5,,\n2,KLMAB,,0.04,0.04,,0.03,,0.04,0.03,,,,0.03,,\n\
    2,EGFR,,99,99,,99,,99,99,,,,99,,\n2,TP,,6.6,6.7,,6.9,,6.6,7.1,,,,7.0,,\n3,KLM,,0.9,0.1,,0.5,,0.7,,0.7,,,0.9,,\n\
    3,KLMAB,,0.04,0.01,,0.02,,0.03,,0.03,,,0.03,,\n3,PLT,,224,248,,228,,251,,273,,,206,,\n\
    3,XYZ,,4.36,4.28,,4.58,,4.39,,4.85,,,4.47,,\n3,RDW,,13.6,13.7,,13.8,,14.1,,14.0,,,13.4,,\n\
    3,WBC,,3.9,6.5,,5.0,,4.7,,3.7,,,3.9,,\n3,A1C,,5.5,5.6,,5.7,,5.6,,5.5,,,5.3,,\n\
    4,KLM,,1.2,,0.6,,0.8,0.7,,,0.9,,,1.0,\n4,TP,,7.6,,7.8,,7.6,7.3,,,7.7,,,7.7,\n\
    5,KLM,,0.7,,0.8,,1.0,0.8,,0.5,,,1.1,,\n5,KLM,,0.03,,0.03,,0.04,0.04,,0.02,,,0.04,,\n\
    5,TP,,7.0,,7.4,,7.3,7.6,,7.3,,,7.5,,\n5,XYZ,,4.73,,4.48,,4.49,4.40,,,4.59,,,4.63,\n\
    ```\n\n列出 3.8 显示了文件 `joinlines.sh` 的内容，说明了如何合并 `joinlines.csv` 中的行对。\n\n#### 列出\
    \ 3.8 joinlines.sh\n\n```\n inputfile=\"test1.csv\"\noutputfile=\"joinedlines.csv\"\
    \ntmpfile2=\"tmpfile\"\n```\n\n```\n # 匹配模式:\nklm1=1,KLM,\nklm5=5,KLM,\nxyz1=1,XYZ,\n\
    xyz5=5,XYZ,\n```\n\n```\n # 输出:\nklm1,xyz1\n#klm5,xyz5\n```\n\n```\n # 步骤 1：与\
    \ CSV 文件匹配模式:\nklm1line=\"grep $klm1 $inputfile\"\nklm5line=\"grep $klm5 $inputfile\"\
    \nxyz1line=\"grep $xyz1 $inputfile\"\n# $xyz5 匹配 2 行 (我们想要第一行):\ngrep $xyz5 $inputfile\
    \ >tmpfile2\nxyz5line=\"head -1 $tmpfile2\"\nklm1line=\"echo $klm1line\"\nklm5line=\"\
    echo $klm5line\"\nxyz1line=\"echo $xyz1line\"\nxyz5line=\"echo $xyz5line\"\n```\n\
    \n```\n # 步骤 3：创建摘要文件:\necho \"$klm1line\" |tr -d '\\n' >outputfile\necho \"$xyz1line\"\
    \ >>outputfile\necho \"$klm5line\" |tr -d '\\n' >>outputfile\necho \"$xyz5line\"\
    \ >>outputfile\n```\n\n如你所见，本节的任务可以通过 `grep` 命令轻松解决。请注意，还需要额外的数据清洗来处理输出中的空字段。\n\
    \n### 总结\n\n本章向你展示了如何使用 `grep` 工具，这是一个非常强大的 Unix 命令，用于在文本字段中搜索字符串。你学习了 `grep`\
    \ 命令的各种选项，以及如何使用这些选项在文件中查找字符串模式的示例。接下来，你学习了 `egrep`，它是 `grep` 命令的一个变体。\n\n###\
    \ 使用 `sed` 转换数据\n\n## 第 4 章：使用 `sed` 转换数据\n\n在前面的章节中，我们学习了如何通过 `grep` 来缩小数据集。在本章中，我们将学习如何使用\
    \ `sed` 工具来转换数据，`sed` 的全称是“流编辑器”。\n\n本章的第一部分包含了 `sed` 命令的基本示例，例如替换和删除。本章的第二部分讨论了\
    \ `sed` 的各种可用选项，以及如何使用它们来处理特定的数据。在最后部分，你将看到如何结合正则表达式来实现复杂的任务。\n\n### 什么是 `sed`\
    \ 命令？\n\n`sed` 的名称全称为“流编辑器”，该工具的许多命令源自 `ed`（`ed` 是第一个行编辑器）。`sed` 命令是一个非交互式的流编辑器，可以通过脚本自动化编辑。这种像在编辑器内部一样处理整个数据流（类似于\
    \ `grep` 的行为）的能力在现代编程语言中并不常见。`sed` 的一些常见用途包括：打印匹配行、删除匹配行以及查找/替换字符串。\n\n### 使用\
    \ `sed` 匹配字符串模式\n\n`sed` 命令要求你指定一个字符串以匹配文件中的行。例如，假设文件 `numbers.txt` 包含以下行：\n\n\
    ```\n 1\n2\n123\n3\nfive\n4\n```\n\n以下 `sed` 命令打印所有包含字符串 3 的行：\n\n```\n cat numbers.txt\
    \ |sed –n \"/3/p\"\n```\n\n另一种产生相同结果的方法：\n\n```\n sed –n \"/3/p\" numbers.txt\n\
    ```\n\n"
- fmt: "As we saw earlier with other commands, it is always more efficient to just\
    \ read in the file using the `sed` command than to pipe it in with a different\
    \ command. You can “feed” it data from another command, provided that other command\
    \ adds value (such as adding line numbers, removing blank lines, or other similar\
    \ helpful activities).\n\nThe `-n` option suppresses all output, and the `p` option\
    \ prints the matching line. If you omit the `-n` option, then every line is printed,\
    \ and the `p` option causes the matching line to be printed again. Hence, you\
    \ can issue the following command:\n\n```\n sed \"/3/p\" numbers.txt\n```\n\n\
    The output (the data to the right of the colon) is as follows. Note that the labels\
    \ to the left of the colon show the source of the data, to illustrate the “one\
    \ row at a time” behavior of `sed`.\n\n```\n Basic stream output :1\nBasic stream\
    \ output :2\nBasic stream output :123\nPattern Matched text:123\nBasic stream\
    \ output :3\nPattern Matched text:3\nBasic stream output :five\nBasic stream output\
    \ :4\n```\n\nIt is also possible to match two patterns and print everything between\
    \ the lines that match:\n\n```\n sed –n \"/123/,/five/p\" numbers.txt\n```\n\n\
    The output of the preceding command (all lines between 123 and five, inclusive)\
    \ is here:\n\n```\n 123\n3\nfive\n```\n\n### Substituting String Patterns Using\
    \ `sed`\n\nThe examples in this section illustrate how to use `sed` to substitute\
    \ new text for an existing text pattern.\n\n```\n x=\"abc\"\necho $x |sed \"s/abc/def/\"\
    \n```\n\nThe output of the preceding code snippet is here:\n\n```\n def\n```\n\
    \nIn the prior command you have instructed `sed` to substitute `s` the first text\
    \ pattern `/abc` with the second pattern `/def` and no further instructions `/`.\n\
    \nDeleting a text pattern is simply a matter of leaving the second pattern empty:\n\
    \n```\n echo \"abcdefabc\" |sed \"s/abc//\"\n```\n\nThe result is here:\n\n```\n\
    \ defabc\n```\n\nAs you see, this only removes the first occurrence of the pattern.\
    \ You can remove all the occurrences of the pattern by adding the “global” terminal\
    \ instruction `/g`:\n\n```\n echo \"abcdefabc\" |sed \"s/abc//g\"\n```\n\nThe\
    \ result of the preceding command is here:\n\n```\n def\n```\n\nNote that we are\
    \ operating directly on the main stream with this command, as we are not using\
    \ the `-n` tag. You can also suppress the main stream with `-n` and print the\
    \ substitution, achieving the same output if you use the terminal `p` (print)\
    \ instruction:\n\n```\n echo \"abcdefabc\" |sed -n \"s/abc//gp\"\ndef\n```\n\n\
    For substitutions, either syntax will do, but that is not always true of other\
    \ commands.\n\nYou can also remove digits instead of letters, by using the numeric\
    \ metacharacters as your regular expression match pattern (from [Chapter 1](#chap1.xhtml)):\n\
    \n```\n ls svcc1234.txt |sed \"s/[0-9]//g\"\nls svcc1234.txt |sed –n \"s/[0-9]//gp\"\
    \n```\n\nThe result of either of the two preceding commands is here:\n\n```\n\
    \ svcc.txt\n```\n\nRecall that the file `columns4.txt` contains the following\
    \ text:\n\n```\n 123 ONE TWO\n456 three four\nONE TWO THREE FOUR\nfive 123 six\n\
    one two three\nfour five\n```\n\nThe following `sed` command is instructed to\
    \ identify the rows between 1 and 3, inclusive `/1,3`, and delete `d` them from\
    \ the output:\n\n```\n cat columns4.txt | sed \"1,3d\"\n```\n\nThe output is here:\n\
    \n```\n five\n23 six\none two three\nfour five\n```\n\nThe following `sed` command\
    \ deletes a range of lines, starting from the line that matches `123` and continuing\
    \ through the file until reaching the line that matches `five` (and also deleting\
    \ all intermediate lines). The syntax should be familiar from the earlier example:\n\
    \n```\n sed \"/123/,/five/d\" columns4.txt\n```\n\nThe output is here:\n\n```\n\
    \ one two three\nfour five\n```\n\n#### Replacing Vowels from a String or a File\n\
    \nThe following code snippet shows how simple it is to replace multiple vowels\
    \ from a string using the `sed` command:\n\n```\n echo \"hello\" | sed \"s/[aeio]/g\"\
    \n```\n\nThe output from the preceding code snippet is here:\n\n```\n Hull\n```\n\
    \n#### Deleting Multiple Digits and Letters from a String\n\nSuppose that we have\
    \ variable `x` that is defined as follows:\n\n```\n x=\"a123\"\n```\n\nRecall\
    \ that an integer consists of one or more digits, so `[0-9]+` matches one or more\
    \ digits. However, you need to specify expression `[0-9]*` in order to remove\
    \ every number from `x`:\n\n```\n echo $x | sed \"s/[0-9]//g\"\n```\n\nThe output\
    \ of the preceding command is here:\n\n```\n a\n```\n\nThe following command removes\
    \ all lowercase letters from `x`:\n\n```\n echo $x | sed \"s/[a-z]//g\"\n```\n\
    \nThe output of the preceding command is here:\n\n```\n 123\n```\n\nThe following\
    \ command removes all lowercase and uppercase letters from `x`:\n\n```\n echo\
    \ $x | sed \"s/[a-zA-Z]//g\"\n```\n\nThe output of the preceding command is here:\n\
    \n```\n 123\n```\n\n### Search and Replace with `sed`\n\nThe previous section\
    \ showed you how to delete a range of rows of a text file, based on a start line\
    \ and end line, using either a numeric range or a pair of strings. As deleting\
    \ is just substituting an empty result for what you match, it should now be clear\
    \ that replace involves populating that part of the command with something that\
    \ achieves your desired outcome. This section contains various examples that illustrate\
    \ how to get the exact substitution.\n\nThe following examples illustrate how\
    \ to convert `abc` to uppercase `ABC` in `sed`:\n\n```\n echo \"abc\" |sed \"\
    s/abc/ABC/\"\n```\n\nThe output of the preceding command is here (which only works\
    \ on one case of `abc`):\n\n```\n ABC\n```\n\nThe following example shows the\
    \ output of the preceding command is here (`/g` means works on every case of `abc`):\n\
    \n```\n ABCdefABC\n```\n\nThe following `sed` expression performs three consecutive\
    \ substitutions, using `-e` to string them together. It changes exactly one (the\
    \ first) `a` to `A`, one `b` to `B`, one `c` to `C`:\n\n```\n echo \"abcde\" |sed\
    \ -e \"s/a/A/\" -e \"s/b/B/\" -e \"s/c/C/\"\n```\n\nThe output of the preceding\
    \ command is here:\n\n```\n ABCde\n```\n\nObviously, you can use the following\
    \ `sed` expression that combines the three substitutions into one substitution:\n\
    \n```\n echo \"abcde\" |sed \"s/abc/ABC/\"\n```\n\nNevertheless, the `-e` switch\
    \ is useful when you need to perform more complex substitutions that cannot be\
    \ combined into a single substitution.\n\nThe `/` character is not the only delimiter\
    \ that `sed` supports, which is useful when strings contain the `/` character.\
    \ For example, you can reverse the order of `/aa/bb/cc/` with this command:\n\n\
    ```\n echo \"/aa/bb/cc\" |sed -n \"s#/aa/bb/cc#/cc/bb/aa/#p\"\n```\n\nThe output\
    \ of the preceding `sed` command is here:\n\n```\n /cc/bb/aa/\n```\n\nThe following\
    \ examples illustrate how to use the `w` terminal command instruction to write\
    \ the `sed` output to both standard output and also to a named file `upper1` if\
    \ the match succeeds:\n\n```\n echo \"abcdefabc\" |sed \"s/abc/ABC/wupper1\"\n\
    ABCdefabc\n```\n\nIf you examine the contents of the text file `upper1` you will\
    \ see that it contains the same string `ABCdefabc` that is displayed on the screen.\
    \ This two-stream behavior that we noticed earlier with the print (`p`) terminal\
    \ command is unusual, but sometimes useful. It is more common to simply send the\
    \ standard output to a file using the `>` syntax, as shown in the following (both\
    \ syntaxes work for a replace operation), but in that case nothing is written\
    \ to the terminal screen. The previous syntax allows both at the same time:\n\n\
    ```\n echo \"abcdefabc\" | sed \"s/abc/ABC/\" > upper1\necho \"abcdefabc\" | sed\
    \ -n \"s/abc/ABC/p\" > upper1\n```\n\n[Listing 4.1](#chap4.xhtml_li4-1) displays\
    \ the contents of `update2.sh` that replace the occurrence of the string `hello`\
    \ with the string `goodbye` in the files with the suffix `txt` in the current\
    \ directory.\n\n##### *LISTING 4.1 update2.sh*\n\n```\n for f in `ls *txt`\ndo\n\
    \  newfile=\"${f}_new\"\n  cat $f | sed -n \"s/hello/goodbye/gp\" > $newfile\n\
    \  mv $newfile $f\ndone\n```"
