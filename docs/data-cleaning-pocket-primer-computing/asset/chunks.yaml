    \ some commands that are available in the other shells, such as `history, noclobber`,\
    \ and so forth. The various subcategories for the Bourne Shell are listed as follows:\n\
    \nBourne shell `(sh)`\n\nKorn shell `(ksh)`\n\nBourne Again shell `(bash)`\n\n\
    POSIX shell `(sh)`\n\nThe different C-type shells follow:\n\nC shell `(csh)`\n\
    \nTENEX/TOPS C shell `(tcsh)`\n\nWhile the commands and the shell scripts in this\
    \ book are based on the `bash` shell, many of the commands also work in other\
    \ shells (and if not, those other shells have a similar command to accomplish\
    \ the same goal). Performing an Internet search for “how do I do <bash command>\
    \ in <shell name>” will often get you an answer. Sometimes the command is essentially\
    \ the same, but with slightly different syntax, and typing “man <command>” in\
    \ a command shell can provide useful information.\n\n### **What Is bash?**\n\n\
    Bash is an acronym for “Bourne Again Shell,” which has its roots in the Bourne\
    \ shell created by Stephen R. Bourne. Shell scripts based on the Bourne shell\
    \ will execute in `bash`, but the converse is not true. The `bash` shell provides\
    \ additional features that are unavailable in the Bourne shell, such as support\
    \ for arrays (discussed later in this chapter).\n\nOn Mac OS X, the `/bin` directory\
    \ contains the following executable shells:\n\n```\n -r-xr-xr-x   1  root   wheel\
    \   1377872   Apr 28  2017 /bin/ksh\n-r-xr-xr-x   1  root   wheel    630464  \
    \ Apr 28  2017 /bin/sh\n-rwxr-xr-x   1  root   wheel    375632   Apr 28  2017\
    \ /bin/csh\n-rwxr-xr-x   1  root   wheel    592656   Apr 28  2017 /bin/zsh\n-r-xr-xr-x\
    \   1  root   wheel    626272   Apr 28  2017 /bin/bash\n```\n\nIn case you’re\
    \ interested, a nice comparison matrix of the support for various features among\
    \ the preceding shells is here:\n\n*https://stackoverflow.com/questions/5725296/difference-between-sh-and-bash.*\n\
    \nSomething else that might surprise you: in some environments the Bourne shell\
    \ `sh` *is* the Bash shell, which you can check by typing the following command:\n\
    \n```\n sh  --version\nGNU bash, version 3.2.57(1)-release (x86_64-apple-darwin16)\n\
    Copyright (C) 2007 Free Software Foundation, Inc.\n```\n\nIf you are new to the\
    \ command line (be it Mac, Linux, or PCs), please read the Preface, which provides\
    \ some useful guidelines for accessing command shells.\n\n#### **Getting Help\
    \ for `bash` Commands**\n\nIf you want to see the options for a specific bash\
    \ command, specify the `-?` switch. For example, `cat -?` displays the available\
    \ options for the `cat` command. You can invoke the `man` command to see a description\
    \ of a `bash` command and its options:\n\n```\n man  cat\n```\n\nKeep in mind\
    \ that the `man` command produces terse explanations, and if those explanations\
    \ are not clear enough, you can search for online code samples that provide more\
    \ details.\n\n#### **Navigating Around Directories**\n\nIn a command shell you\
    \ will often perform basic operations, such as displaying (or changing) the current\
    \ directory, listing the contents of a directory, displaying the contents of a\
    \ file, and so forth. The following set of commands shows you how to perform these\
    \ operations, and you can execute a subset of these comments in the sequence that\
    \ is relevant to you. Options for some of the commands in this section (such as\
    \ the `ls` command) are described in greater detail later in this chapter.\n\n\
    A frequently used Bash command is `pwd` (“print working directory”), which displays\
    \ the current directory, as shown here:\n\n```\n pwd\n```\n\nThe output of the\
    \ preceding command might look something like this:\n\n```\n /Users/jsmith\n```\n\
    \nUse the `cd` (“change directory”) command to go to a specific directory. For\
    \ example, type the command `cd /Users/jsmith/Mail` or `cd Mail` if you are already\
    \ in the `/Users/jsmith` directory. You can navigate to your home directory with\
    \ either of these commands:\n\n```\n $   cd   $HOME\n$   cd\n```\n\nOne convenient\
    \ way to return to the previous directory is the command `cd` –. Keep in mind\
    \ that the `cd` command on Windows merely displays the current directory (which\
    \ differs from the Unix `cd` command).\n\n#### **The `history` Command**\n\nThe\
    \ `history` command displays the `history` of commands that you executed in the\
    \ current command shell, as shown here:\n\n```\n history\n```\n\nA sample output\
    \ of the preceding command is here:\n\n```\n 1202   cat  longfile.txt > longfile2.txt\n\
    \  1203   vi  longfile2.txt\n  1204   cat  longfile2.txt  |fold  -40\n  1205 \
    \  cat  longfile2.txt  |fold  -30\n  1206   cat  longfile2.txt  |fold  -50\n \
    \ 1207   cat  longfile2.txt  |fold  -45\n  1208   vi  longfile2.txt\n  1209  \
    \ history\n  1210   cd  /Library/Developer/CommandLineTools/usr/include/c++/\n\
    \  1211   cd  /tmp\n  1212   cd $HOME/Desktop\n  1213   history\n```\n\nNow you\
    \ can return to the directory in line `1210` with the following command:\n\n```\n\
    \ !1210\n```\n\nThe command `!cd` will search backward through the history of\
    \ commands to find the first command that matches the `cd` command: in this case,\
    \ line `1212` is the first match. If there weren’t any intervening `cd` commands\
    \ between the current command and the command in line `1210`, then `!1210` and\
    \ `!cd` will have the same effect.\n\n**NOTE**\n\n*Be careful with the “!” option\
    \ with bash commands, because the command that matches the “!” might not be the\
    \ one you intended, so it’s safer to use the `history` command and then explicitly\
    \ specify the correct number (in that history) when you invoke the “!” operator.*\n\
    \n### **Listing Filenames with the `ls` Command**\n\nThe `ls` command is for listing\
    \ filenames, and there are many switches available that you can use, as shown\
    \ in this section. For example, the `ls` command displays the following filenames\
    \ (the actual display depends on the font size and the width of the command shell)\
    \ on my Mac:\n\n```\n apple-care.txt     iphonemeetup.txt    outfile.txt     \
    \ ssl-\ninstructions.txt  checkin-commands.txt   kyrgyzstan.txt\noutput.txt\n\
    ```"
