    ```\n grep –c abc *sh\n```\n\nThe output of the preceding command is here:\n\n\
    ```\n ABC4.sh:0\nabc3.sh:3\n```\n\nThe “`-e`” option lets you match patterns that\
    \ would otherwise cause syntax problems (the “–” character normally is interpreted\
    \ as an argument for `grep`):\n\n```\n grep –e \"-abc\" *sh\nabc3.sh:ends with\
    \ -abc\n```\n\nThe “`-e`” option also lets you match multiple patterns.\n\n```\n\
    \ grep –e \"-abc\" -e \"comment\" *sh\nABC4.sh:# ABC in a comment\nabc3.sh:ends\
