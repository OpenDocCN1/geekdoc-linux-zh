    \ create the file `findsvg`. `sh` whose contents are the preceding loop, and then\
    \ invoke this command:\n\n```\n ./findsvg.sh 1>1 2>2\n```\n\nNotice that the preceding\
    \ command redirects error message (2>) to the file 2 and the results of the jar/grep\
    \ command (1>) to the file 1\\. See the Appendix for another example of searching\
    \ zip files for SVG documents.\n\n### **Checking for a Unique Key Value**\n\n\
    Sometimes you need to check for the existence of a string (such as a key) in a\
    \ text file, and then perform additional processing based on its existence. However,\
    \ do not assume that the existence of a string means that that string only occurs\
    \ once. As a simple example, suppose the file mykeys.txt has the following content:\n\
    \n```\n 2000\n22000\n10000\n3000\n```\n\nSuppose that you search for the string\
    \ 2000, which you can do with `findkey.sh`, whose contents are displayed in [Listing\
    \ 3.6](#chap3.xhtml_li3-6).\n\n##### ***LISTING 3.6 findkey.sh***\n\n```\n key=\"\
    2000\"\nif [ \"`grep $key mykeys.txt`\" != \"\" ]\nthen\n foundkey=true\nelse\n\
    \ foundkey=false\nfi\necho \"current key = $key\"\necho \"found key = $foundkey\"\
    \n```\n\n[Listing 3.6](#chap3.xhtml_li3-6) contains if/else conditional logic\
    \ to determine whether or not the file `mykeys.txt` contains the value of `$key`\
    \ (which is initialized as 2000). Launch the code in [Listing 3.6](#chap3.xhtml_li3-6)\
    \ and you will see the following output:\n\n```\n current key = 2000\nfound key\
    \   = true\nlinecount   = 2\n```\n\nWhile the key value of 2000 does exist in\
    \ `mykeys.txt,` you can see that it matches two lines in `mykeys.txt.` However,\
    \ if `mykeys.txt` were part of a file with 100,000 (or more) lines, it’s not obvious\
    \ that the value of 2000 matches more than one line. In this dataset, 2000 and\
    \ 22000 both match, and you can prevent the extra matching line with this code\
    \ snippet:\n\n```\n grep –w $key\n```\n\nThus, in files that have duplicate lines,\
    \ you can count the number of lines that match the key via the preceding code\
    \ snippet. Another way to do so involves the use of `wc –l,` which displays the\
    \ line count.\n\n#### **Redirecting Error Messages**\n\nAnother scenario involves\
    \ the use of the `xargs` command with the `grep` command, which can result in\
    \ “no such . . .” error messages:\n\n```\n find . –print |xargs grep –il abc\n\
    ```\n\nMake sure to redirect errors using the following variant:\n\n```\n find\
    \ . –print |xargs grep –il abc 2>/dev/null\n```\n\n### **The `egrep` Command and\
    \ the `fgrep` Command**\n\nThe `egrep` command is an Extended `grep` that supports\
    \ added `grep` features like “+” (1 or more occurrence of previous character),\
    \ “?” (0 or 1 occurrence of previous character), and “|” (alternate matching).\
    \ The `egrep` command is almost identical to the `grep -E,` along with some caveats\
    \ that are described here:\n\n*https://www.gnu.org/software/grep/manual/html_node/Basic-vs-Extended.html.*\n\
    \nOne advantage of using the `egrep` command is that it’s easier to understand\
    \ the regular expressions than the corresponding expressions in `grep` (when it’s\
    \ combined with backward references).\n\nThe `egrep` (“extended `grep`”) command\
    \ supports extended regular expressions, as well as the pipe “|” in order to specify\
    \ multiple words in a search pattern. A match is successful if any of the words\
    \ in the search pattern appear, so you can think of the search pattern as an “any”\
    \ match. Thus, the pattern “`abc|def`” matches lines that contain either `abc`\
    \ or `def` (or both).\n\nFor example, the following code snippet enables you to\
    \ search for occurrences of the string `abc` as well as occurrences of the string\
    \ `def` in all files with the suffix `sh`:\n\n```\n egrep -w 'abc|def' *sh\n```\n\
    \nThe preceding `egrep` command is an “or” operation: a line matches if it contains\
    \ either abc *or* def.\n\nYou can also use metacharacters in `egrep` expressions.\
    \ For example, the following code snippet matches lines that start with `abc`\
    \ or end with four and a whitespace:\n\n```\n egrep '^123|four $' columns3.txt\n\
    ```\n\nA more detailed explanation of grep, egrep, and frep is here:\n\n*https://superuser.com/questions/508881/what-is-the-difference-between-grep-pgrep-egrep-fgrep.*\n\
    \n#### **Displaying “Pure” Words in a Dataset with `egrep`**\n\nFor simplicity,\
    \ let’s work with a text string, and that way we can see the intermediate results\
    \ as we work toward the solution. Let’s initialize the variable x as shown here:\n\
    \n```\n x=\"ghi abc Ghi 123 #def5 123z\"\n```\n\nThe first step is to split `x`\
    \ into words:\n\n```\n echo $x |tr -s ' ' '\\n'\n```\n\nThe output is here:\n\n\
    ```\n ghi\nabc\nGhi\n123\n#def5\n123z\n```\n\nThe second step is to invoke `egrep`\
    \ with the regular expression `^[a-zA-Z]+`, which matches any string consisting\
    \ of one or more uppercase and/or lowercase letters (and nothing else):\n\n```\n\
    \ echo $x |tr -s ' ' '\\n' |egrep \"^[a-zA-Z]+$\"\n```\n\nThe output is here:\n\
    \n```\n ghi\nabc\nGhi\n```"
