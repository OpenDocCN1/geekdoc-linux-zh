  trans: "\n\n`join` 命令恰好对两个文件进行操作，但它会将具有相同标记字段（通常是数字标签）的行拼接在一起，并将结果写入 `stdout`。要合并的文件应该按照标记字段进行排序，以确保匹配能够正常工作。列表\
    \ 2.1 和 列表 2.2 分别显示了 `1.data` 和 `2.data` 的内容。\n\n#### 列表 2.1 1.data\n\n```\n 100\
    \ Shoes\n200 Laces\n300 Socks\n```\n\n#### 列表 2.2 2.data\n\n```\n 100 $40.00\n\
    200 $1.00\n300 $2.00\n```\n\n现在运行以下命令：\n\n```\n join 1.data 2.data\n```\n\n输出如下：\n\
    \n1)100 Shoes $40.00\n\n2)200 Laces $1.00\n\n3)300 Socks $2.00\n\n### `fold` 命令\n\
    \n正如你从第 1 章所知，`fold` 命令允许你以固列宽显示一组行，本节包含更多示例。注意，该命令不考虑单词之间的空格：输出以类似于“报纸”风格列显示。\n\
    \n以下命令显示一组每行十个字符的行：\n\n```\n x=\"aa bb cc d e f g h i j kk ll mm nn\"\necho $x\
    \ |fold -10\n```\n\n上述代码段的输出如下：\n\n```\n aa bb cc d\n e f g h i\n j kk ll m\n\
    m nn\n```\n\n作为作为另一个例子，考虑以下代码段：\n\n```\n x=\"The quick brown fox jumps over the\
    \ fat lazy dog. \"\necho $x |fold -10\n```\n\n上述代码段的输出如下：\n\n```\n The quick\n\
    brown fox\njumps over\n the fat l\nazy dog.\n```\n\n### `split` 命令\n\n当你想要创建一个文件的一系列子文件时，`split`\
    \ 命令非常有用。默认情况下，子文件命名为 `xaa, xab, .` `.` `., xaz, xba, xbb, .` `.` `., xbz, .`\
    \ `.` `.` `xza, xzb, .` `.` `., xzz`。因此，`split` 命令最多创建 676 个文件 (=26x26)。每个文件的默认大小为\
    \ 1000 行。\n\n以下片段说明了如何调用 `split` 命令将 `abc.txt` 文件拆分为每个包含 500 行的文件：\n\n```\n split\
    \ -l 500 one-dl-course-outline.txt\n```\n\n如果文件 `abc.txt` 包含 501 到 1,000 行，则前面的命令将创建以下文件对：\n\
    \n```\n xaa\nxab\n```\n\n你还可以为创建的文件指定文件前缀，所示：\n\n```\n split -l 500 one-dl-course-outline.txt\
    \ shorter\n```\n\n上述命令创建了以下文件对：\n\n```\n shorterxaa\nshorterxab\n```\n\n### `sort`\
    \ 命令\n\n`sort` 命令对文本文件的行进行排序。例如，如果文本文件 `test2.txt` 包含以下行：\n\n```\n aa\ncc\nbb\n\
    ```\n\n下面的简单示例排序了 `test2.txt:` 中的行：\n\n```\n cat test2.txt |sort\n```\n\n上述代码段的输出如下：\n\
    \n```\n aa\nbb\ncc\n```\n\n`sort` 命令默认按字母顺序排列文本行。这里是 `sort` 命令的一些选项：\n\n```\n\
    \ 选项    描述\n-n      按数字排序（例如：10 将排在 2 之后），\n忽略空格和制表符。\n-r      反转排序顺序。\n-f   \
    \   将大写和小写混合排序。\n+x      排序时忽略前 x 个字段。\n```\n\n你可以使用 `sort` 命令根据文件大小显示目录中的文件，如下所示：\n\
    \n```\n -rw-r--r-- 1 ocampesato staff  11 Jan 06 19:21 outfile.txt\n-rw-r--r--\
    \ 1 ocampesato staff  12 Jan 06 19:21 output.txt\n-rwx------ 1 ocampesato staff\
    \  12 Jan 06 19:21 kyrgyzstan.txt\n-rwx------ 1 ocampesato staff  25 Jan 06 19:21\
    \ apple-care.txt\n-rwx------ 1 ocampesato staff 146 Jan 06 19:21 checkin-commands.txt\n\
    -rwx------ 1 ocampesato staff 176 Jan 06 19:21 ssl-instructions.txt\n-rwx------\
    \ 1 ocampesato staff 417 Jan 06 19:43 iphonemeetup.txt\n```\n\n`sort` 命令支持许多选项，这里总结了其中一些。\n\
    \n`sort –r` 命令按反时间顺序排序文件列表。`sort –n` 命令按数字数据排序，`sort –k` 命令按字段排序。例如，以下命令按文件大小显示目录中的文件详细列表：\n\
    \n```\n ls –l |sort –k 5\n```\n\n输出如下：\n\n```\n total 72\n-rwx------ 1 ocampesato\
    \ staff  12 Jan 06 20:46 kyrgyzstan.txt\n-rw-r--r-- 1 ocampesato staff  12 Jan\
    \ 06 20:46 output.txt\n-rw-r--r-- 1 ocampesato staff  14 Jan 06 20:46 outfile.txt\n\
    -rwx------ 1 ocampesato staff  25 Jan 06 20:46 apple-care.txt\n-rwxr-xr-x 1 ocampesato\
    \ staff  90 Jan 06 20:50 testvars.sh\n-rwxr-xr-x 1 ocampesato staff 100 Jan 06\
    \ 20:50 checkin-commands.txt\n-rwx------ 1 ocampesato staff 146 Jan 06 19:21 checkin-commands.txt\n\
    ```\n\n"
- fmt: "\nIn [Chapter 1](#chap1.xhtml) you learned that the `echo` command prints\
    \ a newline character whereas the `printf` statement does not print a newline\
    \ character (unless it is explicitly included). You can verify this fact for yourself\
    \ with this code snippet:\n\n```\n echo abcde | od -c\n0000000    a   b   c  \
    \ d   e   \\n\n0000006\nprintf abcde | od -c\n0000000    a   b   c   d   e\n0000005\n\
    ```\n\n### The `tr` Command\n\nThe `tr` command is a highly versatile command\
    \ that supports many operations. For example, the `tr` command enables you to\
    \ remove extraneous whitespaces in datasets, insert blank lines, print words on\
    \ separate lines, and also translate characters from one character set to another\
    \ character set (i.e., from uppercase to lowercase, and vice versa).\n\nThe following\
    \ command capitalizes the letters in the variable `x`:\n\n```\n x=\"abc def ghi\"\
    \necho $x | tr [a-z] [A-Z]\nABC DEF GHI\n```\n\nAnother way to convert from lowercase\
    \ to uppercase:\n\n```\n cat columns4.txt | tr '[:lower:]' '[:upper:]'\n```\n\n\
    In addition to upper and lower, you can use the `POSIX` character classes in the\
    \ `tr` command:\n\n- alnum: alphanumeric characters\n- alpha: alphabetic characters\n\
    - cntrl: control (non-printing) characters\n- digit: numeric characters\n- graph:\
    \ graphic characters\n- lower: lowercase alphabetic characters\n- print: printable\
    \ characters\n- punct: punctuation characters\n- space: whitespace characters\n\
    - upper: uppercase characters\n- xdigit: hexadecimal characters 0–9 A–F\n\nThe\
    \ following example removes white spaces in the variable `x` (initialized above):\n\
    \n```\n echo $x |tr -ds \" \" \"\"\nabcdefghi\n```\n\nThe following command prints\
    \ each word on a separate line:\n\n```\n echo \"a b c\" | tr -s \" \" \"\\012\"\
    \na\nb\nc\n```\n\nThe following command replaces commas “,” with a linefeed:\n\
    \n```\n echo \"a,b,c\" | tr -s \",\" \"\\n\"\na\nb\nc\n```\n\nThe following example\
    \ replaces the linefeed in each line with a blank space, which produces a single\
    \ line of output:\n\n```\n cat test4.txt |tr '\\n' ' '\n```\n\nThe output of the\
    \ preceding command is here:\n\n```\n abc  def  abc  abc\n```\n\nThe following\
    \ example removes the linefeed character at the end of each line of text in a\
    \ text file. As an illustration, [Listing 2.3](#chap2.xhtml_li2-3) displays the\
    \ contents of `abc2.txt`.\n\n##### Listing 2.3 abc2.txt\n\n```\n This is line\
    \ one\nThis is line two\nThis is line three\nFourth line\nFifth line\nThe sixth\
    \ line\nThe seventh line\n```\n\nThe following code snippet removes the linefeed\
    \ character in the text file `abc2.txt`:\n\n```\n tr -d '\\n' < abc2.txt\n```\n\
    \nThe output of the preceding `tr` code snippet is here:\n\n`This is line oneThis\
    \ is line twoThis is line threeFourth line-Fifth lineThe sixth lineThe seventh\
    \ line`\n\nAs you can see, the output is missing a blank space between consecutive\
    \ lines, which we can insert with this command:\n\n```\n tr -s '\\n' ' ' < abc2.txt\n\
    ```\n\nThe output of the modified version of the `tr` code snippet is here:\n\n\
    `This is line one This is line two This is line three Fourth line Fifth line The\
    \ sixth line The seventh line`\n\nYou can replace the linefeed character with\
    \ a period “.`” with this version of the `tr` command:\n\n```\n tr -s '\\n' '.'\
    \ < abc2.txt\n```\n\nThe output of the preceding version of the `tr` code snippet\
    \ is here:\n\n`This is line one.This is line two.This is line three.Fourth line.Fifth\
    \ line.The sixth line.The seventh line.`\n\nThe `tr` command with the `–s` option\
    \ works on a one-for-one basis, which means that the sequence “.” has the same\
    \ effect as the sequence “. `. As a sort of “preview,” we can add a blank space\
    \ after each period “.” by combining the `tr` command with the `sed` command (discussed\
    \ in [Chapter 4](#chap4.xhtml)), as shown here:\n\n```\n tr -s '\\n' '.' < abc2.txt\
    \ | sed 's/\\./\\. /g'\n```\n\nThe output of the preceding command is here:\n\n\
    `This is line one.` `This is line two.` `This is line three.` `Fourth line.` `Fifth\
    \ line.` `The sixth line.` `The seventh line.`\n\nThink of the preceding `sed`\
    \ snippet as follows: “whenever a ‘dot’ is encountered, replace it with a ‘dot’\
    \ followed by a space, and do this for every such occurrence.”\n\nYou can also\
    \ combine multiple commands using the Unix pipe symbol. For example, the following\
    \ command sorts the contents of [Listing 2.3](#chap2.xhtml_li2-3), retrieves the\
    \ “bottom” five lines of text, retrieves the lines of text that are unique, and\
    \ then converts the text to upper case letters,\n\n```\n cat abc2.txt |sort |tail\
    \ -5 | uniq | tr [a-z] [A-Z]\n```\n\nHere is the output from the preceding command\n\
    \n```\n THE SEVENTH LINE\nTHE SIXTH LINE\nTHIS IS LINE ONE\nTHIS IS LINE THREE\n\
    THIS IS LINE TWO\n```\n\nYou can also convert the first letter of a word to uppercase\
    \ (or lowercase) with the `tr` command, as shown here:\n\n```\n x=\"pizza\"\n\
    x=`echo ${x:0:1} | tr '[a-z]' '[A-Z]'`\n```\n\nA slightly longer (one extra line\
    \ of code) to convert the first letter to uppercase is shown here:\n\n```\n x=\"\
    pizza\"\nfirst=`echo $x|cut -c1|tr [a-z] [A-Z]`\nsecond=`echo $x|cut -c2`\necho\
    \ $first\n```\n\nHowever of the preceding code blocks are obscure (at least for\
    \ novices), so it’s probably better to use other tools, such as dataframes in\
    \ R. As you can see, it’s possible to combine multiple commands using the bash\
    \ pipe “|” in order to produce the desired output.\n\n### A Simple Use Case\n\n\
    The code in this section shows how to use the `tr` command in order to replace\
    \ the control character “^M” with a linefeed. [Listing 2.4](#chap2.xhtml_li2-4)\
    \ displays the contents of dataset `controlm.csv` that contains embedded characters.\n\
    \n##### Listing 2.4 controlm.csv\n\n```\n IDN,TEST,WEEK_MINUS1,WEEK0,WEEK1,WEEK2,WEEK3,WEEK4,WEEK10,\n\
    12,WEEK14,WEEK15,WEEK17,WEEK18,WEEK19,\n21^M,BASO,,1.4,,0.8,,1.2,,1.1,,,2.2,,,1.4\n\
    1,BASOAB,,0.05,,0.04,,0.05,,0.04,,,0.07,,,0.05^M,EOS,,6.1,,6.2,,7.5,,6.6,,,7.0,,,6.2^M,EOSAB,,0.22,,0.30,,0.27,,0.25,,,0.22,,,0.21^M,HCT,,35.0,,34.2,,34.6,,34.3,,,36.2,,,34.1^M,HGB,,11.8,,11.1,,11.5,,,12.1,,,\n\
    11.3^M,LYM,,36.7\n```\n\n[Listing 2.5](#chap2.xhtml_li2-5) displays the contents\
    \ of the file `controlm.sh` that illustrates how to remove the control characters\
    \ from `controlm.csv`.\n\n##### Listing 2.5 controlm.sh\n\n```\n inputfile=\"\
    controlm.csv\"\nremovectrlfile=\"removectrlfile\"\ntr -s '\\r' '\\n' < $inputfile\
    \ > $removectrlfile\n```\n\nFor convenience, [Listing 2.5](#chap2.xhtml_li2-5)\
    \ contains a variable for the input file and one for the output file, but you\
    \ can simplify the `tr` command in [Listing 2.5](#chap2.xhtml_li2-5) by using\
    \ hard-coded values for the filenames. The output from launching the shell script\
    \ in [Listing 2.5](#chap2.xhtml_li2-5) is here:\n\n```\n IDN,TEST,WEEK_MINUS1,WEEK0,WEEK1,WEEK2,WEEK3,WEEK4,WEEK10,\n\
    12,WEEK14,WEEK15,WEEK17,WEEK18,WEEK19,\n21\n1,BASO,,1.4,,0.8,,1.2,,1.1,,,2.2,,,1.4\n\
    1,BASOAB,,0.05,,0.04,,0.05,,0.04,,,0.07,,,0.05\n1,EOS,,6.1,,6.2,,7.5,,6.6,,,7.0,,,6.2\n\
    1,EOSAB,,0.22,,0.30,,0.27,,0.25,,,0.22,,,0.21\n```\n\nAs you can see, the task\
    \ in this section is very easily solved via the `tr` command. Note that additional\
    \ data cleaning is required in order to handle the empty fields in the output.\
    \ You can also replace the current delimiter “,” with a different delimiter, such\
    \ as a “|” symbol with the following command:\n\n```\n cat removectrlfile |tr\
    \ -s ',' '|' > pipedfile\n```\n\nThe resulting output is shown here:\n\n```\n\
    \ IDN|TEST|WEEK_MINUS1|WEEK0|WEEK1|WEEK2|WEEK3|WEEK4|WEEK10|\n12|WEEK14|WEEK15|WEEK17|WEEK18|WEEK19|WEEK21\n\
    1|BASO|1.4|0.8|1.2|1.1|2.2|1.4\n1|BASOAB|0.05|0.04|0.05|0.04|0.07|0.05\n1|EOS|6.1|6.2|7.5|6.6|7.0|6.2\n\
    1|EOSAB|0.22|0.30|0.27|0.25|0.22|0.21\n```\n\nIf you have a dataset with multiple\
    \ delimiters in arbitrary order in multiple files, you can replace those delimiters\
    \ with a single delimiter via the `sed` command, which is discussed in [Chapter\
    \ 4](#chap4.xhtml).\n\n### The `find` Command\n\nThe `find` command supports many\
    \ options, including one for printing (displaying) the files returned by the `find`\
    \ command, and another one for removing the files returned by the `find` command.\n"
