    a iphonemeetup.txt\na kyrgyzstan.txt\na outfile.txt\na output.txt\na ssl-instructions.txt\n\
    ```\n\nThe following command extracts the files that are in the tar file `testing.tar:`\n\
    \n```\ntar xvf testing.tar\n```\n\nThe following command displays the contents\
