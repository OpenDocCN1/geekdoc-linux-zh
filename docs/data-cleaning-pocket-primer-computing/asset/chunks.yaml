    \ to 0. The output from [Listing A.19](#appendix.xhtml_liA-19) is here:\n\n```\n\
    \ 15\n\n40\n\n25\n```\n\n### Using the split Function in awk\n\n[Listing A.20](#appendix.xhtml_liA-20)\
