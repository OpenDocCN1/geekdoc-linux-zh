    ```\n\n### Calculating Combinations of Field Values\n\n[Listing A.33](#appendix.xhtml_liA-33)\
    \ displays the contents of the shell script `linear-combo.sh` that computes various\
    \ linear combinations of the columns in multiple datasets and displays one combined\
    \ dataset as the output.\n\n#### Listing A.33: linear-combo.sh\n\n```\n # => combinations\
    \ of columns\n\nawk -F',' '\n\n{\n\n  $2 += $3 * 2 + $4 / 2\n\n  $3 += $4 / 3\
    \ + $2 * $2 / 10\n\n  $4 += $2 + $3\n\n  $1 += $2 * 3 - $4 / 10\n\n  printf(\"\
    %d,%.2f,%.2f,%.2f\\n\",$1,$2,$3,$4)\n\n}\n\n' rain?.csv\n```\n\n[Listing A.33](#appendix.xhtml_liA-33)\
    \ processes the values of the datasets `rain1.csv`, `rain2.csv`, and `rain3.csv`\
    \ whose contents are shown earlier in this section. The key observation to make\
    \ is that the sequence of calculations in the calculations in the body of the\
    \ `awk` statement involved inter-dependencies.\n\nSpecifically, the value of `$2`\
    \ is a linear combination of the values of `$3` and `$4`. Next, the value of `$3`\
    \ is a linear combination of the value of `$4` and `$2`, where the latter is not\
    \ the original value from the datasets, but its calculated value. Third, the value\
    \ of `$4` is a linear combination of `$2` and of `$3`, both of which are calculated\
    \ values and not the values in the datasets. Finally, the value of `$1` is a linear\
    \ combination of the newly calculated values for `$2` and `$4`.\n\nAs you can\
    \ see, `awk` provides the flexibility to specify practically any combination of\
    \ calculations (including non-linear combinations) in a very simple and sequential\
    \ fashion. The output of [Listing A.33](#appendix.xhtml_liA-33) is here:\n\n```\n\
