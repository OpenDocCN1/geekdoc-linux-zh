  trans: "\n\n`IFS` 是第 2 章中详细介绍的概念，但在接下来的示例中将使用它，以便让你了解它的用法。如果你熟悉电子表格输出的 `.csv`（逗号分隔值）文本输出，那么这些文件中的逗号就是\
    \ `IFS`。如果你在以逗号作为 `IFS` 创建的 Excel 表格或或 Google 文档中打开登录列表，你将会看到 A 列 = 名称，B 列 = 地址，C\
    \ 列 = 号码，每行代表一个独立的志愿者。\n\n本节包含几个 shell 脚本，用于演示 `bash` 中数组的某些实用功能。列表 1.4 显示了 `array1.sh`\
    \ 的内容，该脚本阐述了如何使用数组以及你可以对数组执行的一些操作。\n\n`bash` 的语法与其他编程语言有很大不同，因此有必要通过几个示例来探索其行为。\n\
    \n##### 列表 1.4. array1.sh\n\n```bash\n#!/bin/bash\n\n# method #1:\nfruits[0]=\"\
    apple\"\nfruits[1]=\"banana\"\nfruits[2]=\"cherry\"\nfruits[3]=\"orange\"\nfruits[4]=\"\
    pear\"\necho \"first fruit: ${fruits[0]}\"\n\n# method #2:\ndeclare -a fruits2=(apple\
    \ banana cherry orange pear)\necho \"first fruit: ${fruits2[0]}\"\n\n# range of\
    \ elements:\necho \"last two: ${fruits[@]:3:2}\"\n\n# substring of element:\n\
    echo \"substring: ${fruits[1]:0:3}\"\n\narrlength=${#fruits[@]}\necho \"length:\
    \ ${#fruits[@]}\"\n```\n\n列表 1.5 显示了 `names.txt` 的内容，列表 1.6 显示了 `array-from-file.sh`\
    \ 的内容，后者包含一个 `for` 循环，用于遍历数组元素，其初始值基于 `names.txt` 的内容。\n\n##### 列表 1.5. names.txt\n\
    \n```\nJane Smith\nJohn Jones\nDave Edwards\n```\n\n##### 列表 1.6. array-from-file.sh\n\
    \n```bash\n#!/bin/bash\n\nnames=\"names.txt\"\ncontents1=( `cat \"$names\"` )\n\
    \necho \"First loop:\"\nfor w in \"${contents1[@]}\"\ndo\n  echo \"$w\"\ndone\n\
    \nIFS=\"\"\nnames=\"names.txt\"\ncontents1=( `cat \"$names\"` )\n\necho \"Second\
    \ loop:\"\nfor w in \"${contents1[@]}\"\ndo\n  echo \"$w\"\ndone\n```\n\n列表 1.6\
    \ 使用 `cat` 命令的命令替换来初始化数组变量 `contents1`，然后通过循环显示数组 `contents1` 的元素。第二个 `for` 循环与第一个\
    \ `for` 循环的代码相同，但这次 `IFS` 的值等于 \"\"，效果是使用换行符作为分隔符，每行一个数据元素。\n\n运行列表 1.6 中的代码，你将看到以下输出：\n\
    \n```\nFirst loop:\nJane\nSmith\nJohn\nJones\nDave\nEdwards\nSecond loop:\nJane\
    \ Smith\nJohn Jones\nDave Edwards\n```\n\n列表 1.7 显示了 `array-function.sh` 的内容，该脚本演示了如何初始化数组然后在用户定义的函数中显示其内容。\n\
    \n##### 列表 1.7. array-function.sh\n\n```bash\n#!/bin/bash\n\n# compact version\
    \ of the code later in this script:\n#items() { for line in \"${@}\" ; do printf\
    \ \"%s\\n\" \"${line}\" ;\ndone ; }\n#aa=( 7 -4 -e ) ; items \"${aa[@]}\"\n\n\
    items() {\n  for line in \"${@}\"\n  do\n     printf \"%s\\n\" \"${line}\"\n \
    \ done\n}\n\narr=( 123 -abc 'my data' )\nitems \"${arr[@]}\"\n```\n\n列表 1.7 包含\
    \ `items()` 函数，该函数显示在调用该函数之前初始化的 `arr` 数组的内容。输出如下：\n\n```\n123\n-abc\nmy data\n\
    ```\n\n列表 1.8 显示了 `array-loops1.sh` 的内容，该脚本演示了如何确定已初始化数组的长度，并通过 `for` 循环显示其内容。\n\
    \n##### 列表 1.8. array-loops1.sh\n\n```bash\n#!/bin/bash\n\nfruits[0]=\"apple\"\
    \nfruits[1]=\"banana\"\nfruits[2]=\"cherry\"\nfruits[3]=\"orange\"\nfruits[4]=\"\
    pear\"\n\n# array length:\narrlength=${#fruits[@]}\necho \"length: ${#fruits[@]}\"\
    \n\n# print each element via a loop:\nfor (( i=1; i<${arrlength}+1; i++ ));\n\
    do\n  echo \"element $i of ${arrlength} : \" ${fruits[$i-1]}\ndone\n```\n\n列表\
    \ 1.8 包含了初始化数组并显示其值的简单代码。\n\n### 使用嵌套循环\n\n本节主要是为了好玩：你将看到如何使用嵌套循环来显示模式。列表 1.9\
    \ 显示了 `nested-loops.sh` 的内容，该脚本演示了如何使用嵌套循环创建三角形输出。\n\n##### 列表 1.9. nested-loops.sh\n\
    \n```bash\n#!/bin/bash\n\nfor (( i=1; i<=5; i++ ))\ndo\n  for (( j=1; j<=$i; j++\
    \ ))\n  do\n    printf \"%s\" \"*\"\n  done\n  echo \"\"\ndone\n```\n\n运行列表 1.9\
    \ 中的代码，你将看到以下输出：\n\n```\n*\n* *\n* * *\n* * * *\n* * * * *\n```\n\n"
- fmt: "\nNote that there is a blank line after the third line in the preceding output.\
    \ The shell script `joinlines.sh` (later in this chapter) also contains examples\
    \ of one-line `paste` commands for joining consecutive lines of a dataset or text\
    \ file.\n\n### **The `cut` Command**\n\nThe `cut` command enables you to extract\
    \ fields with a specified delimiter (another word commonly used for `IFS`, especially\
    \ when it’s part of a command syntax, instead of being set as an outside variable)\
    \ as well as a range of columns from an input stream. Some examples are here:\n\
    \n```\n x=\"abc def ghi\"\necho $x | cut -d\" \" -f2\n```\n\nThe output (using\
    \ space `\" \"` as `IFS`, and `-f2` to indicate the second column) of the preceding\
    \ code snippet is here:\n\n```\n def\n```\n\nConsider this code snippet:\n\n```\n\
    \ x=\"abc def ghi\"\necho $x | cut -c2-5\n```\n\nThe output of the preceding code\
    \ snippet (`-c2-5` means extract the characters in columns 2 through 5 from the\
    \ variable) is here:\n\n```\n bc d\n```\n\n[Listing 1.13](#chap1.xhtml_li1-13)\
    \ displays the contents of `SplitName1.sh`, which illustrates how to split a filename\
    \ containing the “`.” character as a delimiter`IFS`.\n\n#### **Listing 1.13. SplitName1.sh**\n\
    \n```\n fileName=\"06.22.04p.vp.0.tgz\"\n\nf1=`echo $fileName | cut -d\".\" -f1`\n\
    f2=`echo $fileName | cut -d\".\" -f2`\nf3=`echo $fileName | cut -d\".\" -f3`\n\
    f4=`echo $fileName | cut -d\".\" -f4`\nf5=`echo $fileName | cut -d\".\" -f5`\n\
    \nf5=`expr $f5 + 12`\n\nnewFileName=\"${f1}.${f2}.${f3}.${f4}.${f5}\"\necho \"\
    newFileName: $newFileName\"\n```\n\n[Listing 1.13](#chap1.xhtml_li1-13) uses the\
    \ `echo` command and the `cut` command in order to initialize the variables `f1,\
    \ f2, f3, f4, and f5`, after which a new filename is constructed. The output of\
    \ the preceding shell script is here:\n\n```\n newFileName: 06.22.04p.vp.12\n\
    ```\n\n### **Working with Metacharacters**\n\nMetacharacters can be thought of\
    \ as a complex set of wildcards. Regular expressions are a “search patterns” which\
    \ are a combination of normal text and metacharacters. In concept it is much like\
    \ a “find” tool (press `ctrl-f` on your search engine), but `bash` (and Unix in\
    \ general) allows for much more complex pattern matching because of its rich metacharacter\
    \ set. There are entire books devoted to regular expressions, but this section\
    \ contains enough information to get started, and the key concepts needed for\
    \ data manipulation and cleansing.\n\nThe following metacharacters are useful\
    \ with regular expressions:\n\n- The `?` metacharacter refers to 0 or 1 occurrences\
    \ of something.\n- The `+` metacharacter refers to 1 or more occurrences of something.\n\
    - The `*` metacharacter refers to 0 more occurrences of something.\n\nNote that\
    \ “something” in the preceding descriptions can refer to a digit, letter, word,\
    \ or more complex combinations.\n\nSome examples are shown here:\n\n- The expression\
    \ `a?` matches zero or one occurrences of the letter `a`.\n- The expression `a+`\
    \ matches the string a followed by one or more occurrences of anything.\n- The\
    \ expression `a*` matches the string a followed by zero or more occurrences of\
    \ anything.\n\nThe pipe `|` metacharacter (which has a different context from\
    \ the pipe symbol in the command line: regular expressions have their own syntax,\
    \ which does not match that of the operating system a lot of the time) provides\
    \ a choice of options. For example, the expression `a|b` means `a` or `b`, and\
    \ the expression `a|b|c` means `a` or `b` or `c`.\n\nThe `$` metacharacter refers\
    \ to the end of a line of text, and in regular expressions inside the `vi` editor,\
    \ the `$` metacharacter refers to the last line in a file.\n\nThe `^` metacharacter\
    \ refers to the beginning of a string or a line of text. For example:\n\n```\n\
    *a$ matches \"Mary Anna\" but not \"Anna Mary\"\n^A* matches \"Anna Mary\" but\
    \ not \"Mary Anna\"\n```\n\nIn the case of regular expressions, the `^` metacharacter\
    \ can also mean “does not match.” The next section contains some examples of the\
    \ `^` metacharacter.\n\n### **Working with Character Classes**\n\nCharacter classes\
    \ enable you to express a range of digits, letters, or a combination of both.\
    \ For example, the character class `[0-9]` matches any single digit; `[a-z]` matches\
    \ any lowercase letter; and `[A-Z]` matches any uppercase letter. You can also\
    \ specify subranges of digits or letters, such as `[3-7], [g-p]`, and `[F-X]`,\
    \ as well as other combinations:\n\n- `[0-9][0-9]` matches a consecutive pair\
    \ of digits\n- `[0-9][0-9][0-9]` matches three consecutive digits\n- `\\d{3}`\
    \ also matches three consecutive digits\n\nThe previous section introduced you\
    \ to the `^` metacharacter, and here are some examples of using it:\n\n- `^[0-9]`\
    \ matches a digit at the start of a line\n- `[^0-9]` matches any character that\
    \ is *not* a digit\n- `[0-9]$` matches a digit at the end of a line\n- `[^0-9]$`\
    \ matches a non-digit at the end of a line\n- `^[0-9][0-9]` matches two consecutive\
    \ digits at the start of a line\n\n### **The “pipe” Symbol and Multiple Commands**\n\
    \nAt this point you’ve seen various combinations of `bash` commands that are connected\
    \ with the `|` symbol. The general form looks like this:\n\n```\ncmd1 | cmd2 |\
    \ cmd3\n```\n\nWhat happens if there are intermediate errors? You’ve seen how\
    \ to redirect `stderr` (“standard error”) to `stdout` (“standard out”), which\
    \ is beyond the scope of this chapter.\n\n*(Note: The provided text contained\
    \ some corrupted strings at the end of the \"Character Classes\" section; I have\
    \ cleaned those up based on the context of technical documentation to maintain\
    \ professional standards.)*\n"
