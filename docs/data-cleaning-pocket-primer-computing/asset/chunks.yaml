- fmt: "\n[Listing 4.6](#chap4.xhtml_li4-6) displays the contents of `WordCountInFile.sh`,\
    \ which illustrates how to combine various `bash` commands in order to count the\
    \ words (and their occurrences) in a file.\n\n##### LISTING 4.6 wordcountinfile.sh\n\
    \n# The file is fed to the `tr` command, which changes uppercase to lowercase\n\
    \n# `sed` removes commas and periods, then changes whitespace to newlines\n\n\
    # `uniq` needs each word on its own line to count the words properly\n\n# `Uniq`\
    \ converts data to unique words and the number of times they appeared\n\n# The\
    \ final `sort` orders the data by the wordcount.\n\n```\n cat \"$1\" | xargs -n1\
    \ | tr A-Z a-z | \\\nsed -e 's/\\.//g' -e 's/\\,//g' -e 's/ /\\ /g' | \\\nsort\
    \ | uniq -c | sort -nr\n```\n\nThe previous command performs the following operations:\n\
    \n![](images/square.jpg)List each word in each line of the file,\n\n![](images/square.jpg)shift\
    \ characters to lowercase,\n\n![](images/square.jpg)filter out periods and commas,\n\
    \n![](images/square.jpg)change space between words to linefeed, and\n\n![](images/square.jpg)remove\
    \ duplicates, prefix occurrence count, and sort numerically.\n\n### Back References\
    \ in `sed`\n\nIn the chapter describing `grep` you learned about back references,\
    \ and similar functionality is available with the `sed` command. The main difference\
    \ is that the back references can also be used in the replacement section of the\
    \ command.\n\nThe following `sed` command matches the consecutive “a” letters\
    \ and prints four of them:\n\n```\n echo \"aa\" |sed -n \"s#\\([a-z]\\)\\1#\\\
    1\\1\\1\\1#p\"\n```\n\nThe output of the preceding code snippet is here:\n\naaaa\n\
    \nThe following `sed` command replaces all duplicate pairs of letters with the\
    \ letters `aa:`\n\n```\n echo \"aa/bb/cc\" |sed -n \"s#\\(aa\\)/\\(bb\\)/\\(cc\\\
    )#\\1/\\1/\\1/#p\"\n```\n\nThe output of the previous `sed` command is here (note\
    \ the trailing “`/`” character):\n\n```\n aa/aa/aa/\n```\n\nThe following command\
    \ inserts a comma in a four-digit number:\n\n```\n echo \"1234\" |sed -n \"s@\\\
    ([0-9]\\)\\([0-9]\\)\\([0-9]\\)\\\n([0-9]\\)@\\1,\\2\\3\\4@p\"\n```\n\nThe preceding\
    \ `sed` command uses the `@` character as a delimiter. The character class `[0-9]`\
    \ matches one single digit. Since there are four digits in the input string `1234`,\
    \ the character class `[0-9]` is repeated 4 times, and the value of each digit\
    \ is stored in `\\1`, `\\2`, `\\3`, and `\\4` . The output from the preceding\
    \ `sed` command is here:\n\n```\n 1,234\n```\n\nA more general `sed` expression\
    \ that can insert a comma in five-digit numbers is here:\n\n```\n echo \"12345\"\
    \ | sed 's/\\([0-9]\\{3\\}\\)$/,\\1/g;s/^,//'\n```\n\nThe output of the preceding\
    \ command is here:\n\n```\n 12,345\n```\n\n### Displaying Only “Pure” Words in\
    \ a Dataset\n\nIn the previous chapter we solved this task using the `egrep` command,\
    \ and this section shows you how to solve this task using the `sed` command. For\
    \ simplicity, let’s work with a text string, and that way we can see the intermediate\
    \ results as we work toward the solution. The approach will be similar to the\
    \ code block shown earlier that counted unique words. Let’s initialize the variable\
    \ `x` as shown here:\n\n```\n x=\"ghi abc Ghi 123 #def5 123z\"\n```\n\nThe first\
    \ step is to split `x` into one word per line by replacing space with newlines:\n\
    \n```\n echo $x |tr -s ' ' '\\n'\n```\n\nThe output is here:\n\n```\n ghi\nabc\n\
    Ghi\n123\n#def5\n123z\n```\n\nThe second step is to invoke `old` with the regular\
    \ expression `^[a-zA-Z]+`, which matches any string consisting of one or more\
    \ uppercase and/or lowercase letters (and nothing else). Note that the `-E` switch\
    \ is needed to parse this kind of regular expression in `sed`, as it uses some\
    \ of the newer/ modern regular expression syntax not available when `sed` was\
    \ new.\n\n```\n echo $x |tr -s ' ' '\\n' |sed -nE \"s/(^[a-zA-Z]\n[a-zA-Z]*$)/\\\
    1/p\"\n```\n\nThe output is here:\n\n```\n ghi\nabc\nGhi\n```\n\nIf you also want\
    \ to sort the output and print only the unique words, pipe the result to the `sort`\
    \ and `uniq` commands:\n\n```\n echo $x |tr -s ' ' '\\n' |sed -nE \"s/(^[a-zA-Z]\n\
    [a-zA-Z]*$)/\\1/p\"|sort|uniq\n```\n\nThe output is here:\n\n```\n Ghi\nabc\n\
    ghi\n```\n\nIf you want to extract only the integers in the variable `x`, use\
    \ this command:\n\n```\n echo $x |tr -s ' ' '\\n' |sed -nE \"s/(^[a-zA-Z]\n[a-zA-Z]*$)/\\\
