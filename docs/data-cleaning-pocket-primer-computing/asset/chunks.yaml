    \ the named file instead of overwriting the file. An example is here:\n\n```\n\
    find . –print |xargs grep \"sh$\" | tee /tmp/blue\n```\n\nThe preceding code snippet\
    \ redirects the list of all files in the current directory (and those in any subdirectories)\
    \ to the `xargs` command, which then searches—and prints—all the lines that end\
