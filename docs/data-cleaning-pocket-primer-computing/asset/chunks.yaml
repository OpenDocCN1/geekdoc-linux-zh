    lname: Smith\n--------------\nline:   3000   Dave   Del Ray\nempid: 3000\nfname:\
    \ Dave\nlname: Del Ray\n--------------\n```\n\n关于使用命令替换来调用函数 `checkuser` 会发生什么？\n\
