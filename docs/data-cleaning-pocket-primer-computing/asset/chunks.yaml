    \ .` –print` 命令会搜索所有子目录中的所有文件，你可以将输出管道到 `xargs grep hello`，以便找到所有文件中单词 `hello`\
    \ 的出现次数（这涉及到两个进程而不是一个进程）。\n\n你可以使用前一个代码段的输出将匹配的文件复制到另一个目录，如下所示：\n\n```\n cp `find\
    \ . –print |grep \"sh$\" | xargs grep –l abc` /tmp\n```\n\n或者，你可以使用 `grep` 命令将当前目录中的匹配文件（不包含任何子目录中的匹配文件）复制到另一个目录：\n\
    \n```\n cp `grep –l abc *sh` /tmp\n```\n\n另一种方法是使用“反引号”（back tick），这样你就可以获取额外信息：\n\
    \n```\n for file in `find . –print`\ndo\n    echo \"Processing the file: $file\"\
    \n    # 现在在此执行某些操作\ndone\n```\n\n请记住，如果你向 `xargs` 命令传递过多的文件名，将看到“文件过多”的错误消息。在这种情况下，尝试在\
    \ `xargs` 命令之前插入额外的 `grep` 命令，以减少被管道到 `xargs` 命令的文件数量。\n\n如果你使用 NodeJS 工作，你会知道\
    \ `node_modules` 目录包含大量文件。在大多数情况下，当你搜索字符串时可能想排除该目录中的文件，而“-v”选项是处理这种情况的理想选择。以下命令在搜索包含字符串\
    \ `src` 的 HTML 文件名的同时，排除 `node_modules` 目录中的文件，并将文件名重定向到文件 `src_list.txt`（同时将错误消息重定向到\
    \ `/dev/null`）：\n\n```\n find . –print |grep –v node |xargs grep –il src >src_list.txt\
    \ 2>/dev/null\n```\n\n你可以使用以下命令扩展前一个命令，搜索包含字符串 `src` 和字符串 `angular` 的 HTML 文件：\n\
    \n```\n find . –print |grep –v node |xargs grep –il src |xargs grep –il angular\
    \ >angular_list.txt 2>/dev/null\n```\n\n你可以使用以下 `grep` 和 `xargs` 的组合来找到同时包含 `xml`\
    \ 和 `defs` 的文件：\n\n```\n grep -l xml *svg |xargs grep -l def\n```\n\n前一个命令的变体将错误消息重定向到\
    \ `/dev/null`，如下所示：\n\n```\ngrep -l hello *txt 2>/dev/null | xargs grep -c hello\n\
    ```\n\n## 在 Zip 文件中搜索字符串\n\n至少有三种方法在一个或多个 zip 文件中搜索字符串。例如，假设你想确定哪些 zip 文件包含 SVG\
    \ 文档。\n\n第一种方法所示：\n\n```\n for f in `ls *zip`\ndo\n   echo \"Searching $f\"\n\
    \   jar tvf $f |grep \"svg$\"\ndone\n```\n\n当目录中有许多 zip 文件时，前一个循环的输出可能会非常冗长，在这种情况下，你需要向上滚动，并可能需要复制/粘贴实际包含\
    \ SVG 文档的文件名到单独的文件。更好的解决方案是将前一个循环放入 shell 并重定向其输出。例如，创建文件 `findsvg.sh`，其内容为前述的循环，然后调用此命令：\n\
    \n```\n ./findsvg.sh 1>1 2>2\n```\n\n注意，前一个命令将错误消息（`2>`）重定向到文件 2，并将 `jar/grep`\
    \ 命令的结果（`1>`）重定向到文件 1。参见附录中关于搜索 zip 文件中 SVG 文档的另一个示例。\n\n## 检查唯一键值\n\n有时你需要检查文本文件中是否存在某个字符串（如键），然后根据其存在性进行额外处理。然而，不要假设字符串的存在意味着该字符串只出现一次。作为一个简单的例子，假设文件\
    \ `mykeys.txt` 具有以下内容：\n\n```\n 2000\n22000\n10000\n3000\n```\n\n假设你搜索字符串 `2000`，你可以通过\
    \ `findkey.sh` 实现，其内容显示在[Listing 3.6]中。\n\n### 列表 3.6 findkey.sh\n\n```\n key=\"\
    2000\"\nif [ \"`grep $key mykeys.txt` != \"\" ]\nthen\n foundkey=true\nelse\n\
    \ foundkey=false\nfi\necho \"current key = $key\"\necho \"found key = $foundkey\"\
    \n```\n\n[Listing 3.6] 包含 if/else 条件逻辑，用于判断文件 `mykeys.txt` 是否包含 `$key` 的值（初始化为\
    \ 2000）。运行 [Listing 3.6] 中的代码，你将看到如下输出：\n\n```\n current key = 2000\nfound key\
    \   = true\nlinecount   = 2\n```\n\n虽然键值 2000 确实存在于 `mykeys.txt` 中，你可以看到它是匹配的。\n\
    \n## 重定向错误消息\n\n另一种场景涉及带有内容的 `xargs`：\n\n```\nfind . –print |xargs grep\n```\n\
    \n确保使用以下方法重定向错误：\n\n```\nfind . –print |xargs grep\n```\n\n## `egrep` 命令和 `fgrep`\n\
    \n`egrep` 命令几乎与 `grep` 相同，具有某些功能。\n\n## 使用 `egrep` 在数据集中显示“纯”单词\n\n为了简单起见，让我们处理一个文本字符串，这样我们就可以在解决方案的过程中看到中间结果。如下所示初始化变量\
    \ `x`：\n\n```\n x=\"ghi abc Ghi 123 #def5 123z\"\n```\n\n第一步是将 `x` 拆分为单词：\n\n\
    ```\n echo $x |tr -s ' ' '\\n'\n```\n\n输出如下：\n\n```\n ghi\nabc\nGhi\n123\n#def5\n\
    123z\n```\n\n第二步是使用正则表达式 `^[a-zA-Z]+` 调用 `egrep`，该表达式匹配由一个或多个大写和/或小写字母组成的字符串（不包含其他字符）：\n\
    \n```\n echo $x |tr -s ' ' '\\n' |egrep \"^[a-zA-Z]+$\"\n```\n\n输出如下：\n\n```\n\
    \ ghi\nabc\nGhi\n```\n\n"
