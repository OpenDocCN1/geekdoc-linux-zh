    \ four\nline five\nline six\n```\n\n使用以下命令打印 `data4.txt` 的内容并复制 `world6` 和 `six`\
    \ 之间的行部分：\n\n```\nsed '/world6/,/six/p' < data4.txt\n```\n\n输出如下：\n\n```\n hello\
    \ world4\n   hello world5 two\nhello world6 three\nhello world6 three\n      \
    \    hello world4 four\n          hello world4 four\nline five\nline five\nline\
    \ six\nline six\nline seven\n```\n\n使用以下命令删除 `data4.txt` 中的偶数行行：\n\n```\nsed 'n;d;'\
    \ <data4.txt\n```\n\n输出如下：\n\n```\n hello world4\n hello world6 three\nline five\n\
    line seven\n```\n\n使用以下命令将字母 `a` 到 `m` 替换为逗号“，”：\n\n```\nsed \"s/[a-m]/,/g\" <data4.txt\n\
    ```\n\n输出如下：\n\n```\n ,,,,o wor,,4\n    ,,,,o wor,,5 two\n,,,,o wor,,6 t,r,,\n\
    \           ,,,,o wor,,4 ,our\n,,n, ,,v,\n,,n, s,x\n,,n, s,v,n\n```\n\n使用以下命令将字母\
    \ `a` 到 `m` 替换为字符“`,@#”：\n\n```\nsed \"s/[a-m]/,@#/g\" <data4.txt\n```\n\n输出如下：\n\
    \n```\n ,@#,@#,@#,@#o wor,@#,@#4\n    ,@#,@#,@#,@#o wor,@#,@#5 two\n ,@#,@#,@#,@#o\
    \ wor,@#,@#6 t,@#r,@#,@#\n         ,@#,@#,@#,@#o wor,@#,@#4 ,@#our\n,@#,@#n,@#\
    \ ,@#,@#v,@#\n,@#,@#n,@# s,@#x\n,@#,@#n,@# s,@#v,@#n\n```\n\n`sed` 命令不识别如 `\\\
    t` 等转义序列，这意味着你必须在控制台中实际插入制表符。在 `bash` 壳中，输入控制字符 `^V` 然后按 `<TAB>` 键即可插入 `<TAB>`\
    \ 字符。\n\n使用以下命令删除 `data4.txt` 中的制表符：\n\n```\nsed 's/ //g' <data4.txt\n```\n\n\
    输出如下：\n\n```\n hello world4\nhello world5 two\n hello world6 three\nhello world4\
    \ four\nline five\nline six\nline seven\n```\n\n使用以下命令删除 `data4.txt` 中的制表符和空格：\n\
    \n```\nsed 's/ //g' <data4.txt\n```\n\n输出如下：\n\n```\nhelloworld4\nhelloworld5two\n\
    helloworld6three\nhelloworld4four\nlinefive\nlinesix\nlineseven\n```\n\n使用以下命令将\
    \ `data4.txt` 的每一行替换为单词 `pasta`：\n\n```\nsed 's/.*/\\pasta/' < data4.txt\n```\n\
    \n输出如下：\n\n```\npasta\npasta\npasta\npasta\npasta\npasta\npasta\n```\n\n使用以下命令在\
    \ `data4.txt` 的第三行之后插入两个空行，在第五行之后插入一个空行：\n\n```\nsed '3G;3G;5G' < data4.txt\n\
    ```\n\n输出如下：\n\n```\n hello world4\n   hello world5 two\nhello world6 three\n\n\
    \       hello world4 four\nline five\n\nline six\nline seven\n```\n\n使用以下命令在 `data4.txt`\
    \ 的每一行之后插入一个空行：\n\n```\nsed G < data4.txt\n```\n\n输出如下：\n\n```\n hello world4\n\
    \n    hello world5 two\n\nhello world6 three\n\n       hello world4 four\n\nline\
    \ five\n\nline six\n\nline seven\n```\n\n使用以下命令在 `data4.txt` 的每隔一行之后插入一个空行：\n\n\
    ```\nsed n\\;G < data4.txt\n```\n\n输出如下：\n\n```\n hello world4\n   hello world5\
    \ two\n hello world6 three\n        hello world4 four\nline five\nline six\n\n\
    line seven\n```\n\n使用以下命令反转 `data4.txt` 中的行：\n\n```\nsed '1! G; h;$!d' < data4.txt\n\
    ```\n\n上述 `sed` 命令的输出如下：\n\n```\nline seven\nline six\nline five\n         hello\
    \ world4 four\n hello world6 three\n    hello world5 two\n   hello world4\n```\n\
    \n### 总结\n\n本章向你介绍了 `sed` 工具，并说明了数据转换的基本任务：通过匹配单个模式、匹配文件中行的位置或两者的结合，允许数据的添加、删除和更改。\n\
    \n此外，我们展示了 `sed` 不仅像 `grep` 命令一样使用正则表达式来匹配数据，还可以使用正则表达式来描述如何转换这些数据。最后，一组示例展示了\
    \ `sed` 命令的多功能性，并希望传达出它是一个比我们所展示的更加灵活且强大的工具。\n\n"
- fmt: "\nYou can think of the field separators as delimiters/`IFS` we used in other\
    \ commands earlier. The record separators behave in a way similar to how `sed`\
    \ treats individual lines—for example `sed` can match or delete a range of lines\
    \ instead of matching or deleting something that matches a regular expression\
    \ (and the default `awk` record separator is the newline character, so by default\
    \ `awk` and `sed` have similar ability to manipulate and reference lines in a\
    \ text file).\n\nAs a simple example, you can print a blank line after each line\
    \ of a file by changing the `ORS,` from the default of one newline to two newlines,\
    \ as shown here:\n\n```\ncat columns.txt | awk 'BEGIN { ORS =\"\\n\\n\" } ; {\
    \ print $0 }'\n```\n\nOther built-in variables include `FILENAME` (the name of\
    \ the file that `awk` is currently reading), `FNR` (the current record number\
    \ in the current file), `NF` (the number of fields in the current input record),\
    \ and `NR` (the number of input records `awk` has processed since the beginning\
    \ of the program’s execution).\n\nConsult the online documentation for additional\
    \ information regarding these (and other) arguments for the `awk` command.\n\n\
    ## How Does the `awk` Command Work?\n\nThe `awk` command reads the input files\
    \ one record at a time (by default, one record is one line). If a record matches\
    \ a pattern, then an action is performed (otherwise no action is performed). If\
    \ the search pattern is not given, then `awk` performs the given actions for each\
    \ record of the input. The default behavior if no action is given is to print\
    \ all the records that match the given pattern. Finally, empty braces without\
    \ any action do nothing; that is, they will not perform the default printing operation.\
    \ Note that each statement in actions should be delimited by semicolons.\n\nIn\
    \ other to make the preceding paragraph more concrete, here are some simple examples\
    \ involving text strings and the `awk` command (the results are displayed after\
    \ each code snippet). The `-F` switch sets the field separator to whatever follows\
    \ it, in this case a space. Switches will often provide a shortcut to an action\
    \ that normally needs a command inside a `BEGIN{}` block:\n\n```\nx=\"a b c d\
    \ e\"\necho $x |awk -F\" \" '{print $1}'\na\necho $x |awk -F\" \" '{print NF}'\n\
    5\necho $x |awk -F\" \" '{print $0}'\na b c d e\necho $x |awk -F\" \" '{print\
    \ $3,1}'\nc\n```\n\nNow let’s change the `FS` (record separator) to an empty string\
    \ to calculate the length of a string, this time using `BEGIN{}` syntax:\n\n```\n\
    echo \"abc\" | awk 'BEGIN { FS = \"\" } { print NF }'\n3\n```\n\nThe following\
    \ example illustrates several equivalent ways to specify `test.txt` as the input\
    \ file for an `awk` command:\n\n```\nawk < test.txt '{ print $1 }'\nawk '{ print\
    \ $1 }' < test.txt\n```\n\nYet another way is shown here (but as we’ve discussed\
    \ earlier, can be inefficient, so only do it if `cat` command is adding value\
    \ in some way):\n\n```\ncat test.txt | awk '{ print $1 }'\n```\n\nThis simple\
    \ example of four ways to do the same task should illustrate why commenting `awk`\
    \ calls is always a good idea. The next person to look at your code may not remember\
    \ the syntax you are using.\n\n## Aligning Text with `printf` Command\n\nSince\
    \ `awk` is a programming language inside a single command, it also has its own\
    \ way of producing output via the `printf` command. `Listing 5.1` displays the\
    \ contents of `columns.txt` and `Listing 5.2` displays the contents of shell script\
    \ `Columns1.sh`, which shows you how to align columns in a text file.\n\n### Listing\
    \ 5.1 columns.txt\n\n```\none two\nthree four\none two three\nfive six\none two\
    \ three\nfour five\n```\n\n### Listing 5.2 Columns1.sh\n\n```\nawk '{\n     #\
    \ left-align $1 on 10-char column\n     # right-align $2 on 10-char column\n \
    \    # right-align $3 on 10-char column\n     # right-align $4 on 10-char column\n\
    \     printf(\"%-10s%10s%10s%10s\\n\", $1, $2, $3, $4)\n}' columns.txt\n```\n\n\
    `Listing 5.2` contains a `printf()` statement that displays the first four fields\
    \ of each row in the file `columns.txt`, where each field is 10 characters wide.\
    \ The output from launching the code in `Listing 5.2` is here:\n\n```\none   \
    \      two\nthree       four\none         three      four\nfive        six\n```\n\
    ```\n\n## Conditional Logic and Control Statements\n\nLike other programming languages,\
    \ `awk` provides support for conditional logic (`if/else`) and control statements\
    \ (`for`/`while` loops). `awk` is the only way to put conditional logic inside\
    \ a piped command stream without creating, installing, and adding to the path\
    \ a custom executable script. The following code block shows how to use `if/else`\
    \ logic:\n\n```\necho \"\" | awk '\nBEGIN { x = 10 }\n{\n  if (x % 2 == 0) {\n\
    \      print \"x is even\"\n  }\n  else {\n      print \"x is odd\"\n  }\n}\n\
    '\n```\n\nThe preceding code block initializes the variable `x` with the value\
    \ `10` and prints `x is even` if `x` is divisible by 2, otherwise it prints `x\
    \ is odd`.\n\n### The `while` Statement\n\nThe following code block illustrates\
    \ how to use a `while` loop in `awk`:\n\n```\necho \"\" | awk '\n{\n  x = 0\n\
    \  while(x < 4) {\n    print \"x:\",x\n    x = x + 1\n  }\n}\n'\n```\n\nThe preceding\
    \ code block generates the following output:\n\n```\nx:0\nx:1\nx:2\nx:3\n```\n\
    \nThe following code block illustrates how to use a `do while` loop in `awk`:\n\
    \n```\necho \"\" | awk '\n{\n  x = 0\n  do {\n    print \"x:\",x\n    x = x +\
    \ 1\n  } while(x < 4)\n}\n'\n```\n\nThe preceding code block generates the following\
    \ output:\n\n```\nx:0\nx:1\nx:2\nx:3\n```\n\n### A for loop in `awk`\n\n`Listing\
    \ 5.3` displays the contents of `Loop.sh`, which illustrates how to print a list\
    \ of numbers in a loop. Note that `i++` is another way of writing `i=i+1` in `awk`\
    \ (and most c-derived languages).\n\n### Listing 5.3 Loop.sh\n\n```\nawk '\nBEGIN\
    \ {}\n{\n   for(i=0; i<5; i++) {\n     printf(\"%3d\", i)\n   }\n}\nEND { print\
    \ \"\\n\" }\n'\n```\n\n`Listing 5.3` contains a `for` loop that prints numbers\
    \ on the same line via the `printf()` statement. Notice that a newline is printed\
    \ only in the `END` block of the code:\n\n```\n0 1 2 3 4\n```\n\n### A for loop\
    \ with `break` Statement\n\nThe following code block illustrates how to use a\
    \ `break` statement in a `for` loop in `awk`:\n\n```\necho \"\" | awk '\n{\n \
    \ for(x=1; x<4; x++) {\n     print \"x:\",x\n     if(x == 2) {\n        break;\n\
    \     }\n  }\n}\n'\n```\n\nThe preceding code block prints output only until the\
    \ variable `x` has the value `2`, after which the loop exits (because of the break\
    \ inside the conditional logic). The following output is displayed:\n\n```\nx:1\n\
    ```\n\n### The `next` and `continue` Statements\n\nThe following code snippet\
    \ illustrates how to use `next` and `continue` in a `for` loop in `awk`:\n\n```\n\
    awk '\n{\n   /expression1/ { var1 = 5; next }\n   /expression2/ { var2 = 7; next\
    \ }\n   /expression3/ { continue }\n     some other code block here\n}' somefile\n\
    ```\n\nWhen the current line matches `expression1,` then `var1` is assigned the\
    \ value `5` and `awk` reads the next input line: hence, `expression2` and `expression3`\
    \ will not be tested. If `expression1` does not match and `expression2` *does*\
    \ match, then `var2` is assigned the value `7` and then `awk` will read the next\
    \ input line. If only `expression3` results in a positive match, then `awk` skips\
    \ the remaining block of code and processes the next input line.\n"
