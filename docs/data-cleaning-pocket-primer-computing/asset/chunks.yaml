    \ file.\n\n### **The `cut` Command**\n\nThe `cut` command enables you to extract\
    \ fields with a specified delimiter (another word commonly used for `IFS`, especially\
    \ when it’s part of a command syntax, instead of being set as an outside variable)\
    \ as well as a range of columns from an input stream. Some examples are here:\n\
    \n```\n x=\"abc def ghi\"\necho $x | cut -d\" \" -f2\n```\n\nThe output (using\
    \ space `\" \"` as `IFS`, and `-f2` to indicate the second column) of the preceding\
    \ code snippet is here:\n\n```\n def\n```\n\nConsider this code snippet:\n\n```\n\
    \ x=\"abc def ghi\"\necho $x | cut -c2-5\n```\n\nThe output of the preceding code\
    \ snippet (`-c2-5` means extract the characters in columns 2 through 5 from the\
    \ variable) is here:\n\n```\n bc d\n```\n\n[Listing 1.13](#chap1.xhtml_li1-13)\
    \ displays the contents of `SplitName1.sh`, which illustrates how to split a filename\
    \ containing the “`.`” character as a delimiter`/IFS`.\n\n##### ***LISTING 1.13\\\
    . SplitName1.sh***\n\n```\n fileName=\"06.22.04p.vp.0.tgz\"\n\nf1=`echo $fileName\
    \ | cut -d\".\" -f1`\nf2=`echo $fileName | cut -d\".\" -f2`\nf3=`echo $fileName\
    \ | cut -d\".\" -f3`\nf4=`echo $fileName | cut -d\".\" -f4`\nf5=`echo $fileName\
    \ | cut -d\".\" -f5`\n\nf5=`expr $f5 + 12`\n\nnewFileName=\"${f1}.${f2}.${f3}.${f4}.${f5}\"\
    \necho \"newFileName: $newFileName\"\n```\n\n[Listing 1.13](#chap1.xhtml_li1-13)\
    \ uses the `echo` command and the `cut` command in order to initialize the variables\
    \ `f1, f2, f3, f4, and f5`, after which a new filename is constructed. The output\
    \ of the preceding shell script is here:\n\n```\n newFileName: 06.22.04p.vp.12\n\
    ```\n\n### **Working with Metacharacters**\n\nMetacharacters can be thought of\
    \ as a complex set of wildcards. Regular expressions are a “search patterns” which\
    \ are a combination of normal text and metacharacters. In concept it is much like\
    \ a “find” tool (press `ctrl-f` on your search engine), but `bash` (and Unix in\
    \ general) allows for much more complex pattern matching because of its rich metacharacter\
    \ set. There are entire books devoted to regular expressions, but this section\
    \ contains enough information to get started, and the key concepts needed for\
    \ data manipulation and cleansing.\n\nThe following metacharacters are useful\
    \ with regular expressions:\n\nThe ? metacharacter refers to 0 or 1 occurrences\
    \ of something.\n\nThe + metacharacter refers to 1 or more occurrences of something.\n\
    \nThe * metacharacter refers to 0 more occurrences of something.\n\nNote that\
    \ “something” in the preceding descriptions can refer to a digit, letter, word,\
    \ or more complex combinations.\n\nSome examples are shown here:\n\nThe expression\
    \ `a?` matches zero or one occurrences of the letter `a`.\n\nThe expression `a+`\
    \ matches the string a followed by one or more occurrences of anything.\n\nThe\
    \ expression `a*` matches the string a followed by zero or more occurrences of\
    \ anything.\n\nThe pipe “`|`” metacharacter (which has a different context from\
    \ the pipe symbol in the command line: regular expressions have their own syntax,\
    \ which does not match that of the operating system a lot of the time) provides\
    \ a choice of options. For example, the expression `a|b` means `a` or `b`, and\
    \ the expression `a|b|c` means `a` or `b` or `c`.\n\nThe “`$`” metacharacter refers\
    \ to the end of a line of text, and in regular expressions inside the `vi` editor,\
    \ the “`$`” metacharacter refers to the last line in a file.\n\nThe “`^`” metacharacter\
    \ refers to the beginning of a string or a line of text. For example:\n\n```\n\
    \ *a$ matches \"Mary Anna\" but not \"Anna Mary\"\n^A* matches \"Anna Mary\" but\
    \ not \"Mary Anna\"\n```\n\nIn the case of regular expressions, the “`^`” metacharacter\
    \ can also mean “does not match.” The next section contains some examples of the\
    \ “`^`” metacharacter.\n\n### **Working with Character Classes**\n\nCharacter\
    \ classes enable you to express a range of digits, letters, or a combination of\
    \ both. For example, the character class `[0-9]` matches any single digit; `[a-z]`\
    \ matches any lowercase letter; and `[A-Z]` matches any uppercase letter. You\
    \ can also specify subranges of digits or letters, such as `[3-7], [g-p]`, and\
    \ `[F-X]`, as well as other combinations:\n\n[0-9][0-9] matches a consecutive\
    \ pair of digits\n\n[0-9][0-9][0-9] matches three consecutive digits\n\n\\d{3}\
    \ also matches three consecutive digits\n\nThe previous section introduced you\
    \ to the “`^`” metacharacter, and here are some examples of using “`^`” with character\
    \ classes:\n\n1)^[a-z] matches any lowercase letter at the beginning of a line\
    \ of text\n\n2)^[^a-z] matches any line of text that does *not* start with a lowercase\
    \ letter\n\nBased on what you have learned thus far, you can understand the purpose\
    \ of the following regular expressions:\n\n3)([a-z]|[A-Z]): either a lowercase\
    \ letter or an uppercase letter\n\n4)(^[a-z][a-z]): an initial lowercase letter\
    \ followed by another lowercase letter\n\n5)(^[^a-z][A-Z]): anything other than\
    \ a lowercase letter followed by an uppercase letter\n\n[Chapter 4](#chap4.xhtml)\
    \ contains a section that discusses regular expressions, which combine character\
    \ classes and metacharacters in order to create sophisticated expressions for\
    \ matching complex string patterns (such as email addresses).\n\n### **The “pipe”\
    \ Symbol and Multiple Commands**\n\nAt this point you’ve seen various combinations\
    \ of `bash` commands that are connected with the “`|`” symbol. The general form\
    \ looks something like this:\n\n```\n cmd1 | cmd2 | cmd3 .... >mylist\n```\n\n\
    What happens if there are intermediate errors? You’ve seen how to redirect error\
    \ messages to `/dev/null`, and you can also redirect error messages to a text\
    \ file if you need to review them. Yet another option is to redirect `stderr`\
    \ (“standard error”) to `stdout` (“standard out”), which is beyond the scope of\
    \ this chapter.\n\nQuestion: can an intermediate error cause the entire “pipeline”\
    \ to fail? Unfortunately, this scenario can occur, and in general it’s a trial-and-error\
    \ process to debug long and complex commands that involve multiple pipe symbols.\n\
    \nNow consider the case where you need to redirect the output of multiple commands\
    \ to the same location. For example, the following commands display output on\
    \ the screen:\n\n```\n ls | sort; echo \"the contents of /tmp: \"; ls /tmp\n```\n\
    \nYou can easily redirect the output to a file with this command:\n\n```\n (ls\
    \ | sort; echo \"the contents of /tmp:\"; ls /tmp) > myfile1\n```\n\nHowever,\
    \ each of the preceding commands inside the parentheses spawns a subshell (which\
    \ is an extra process that consumes memory and cpu). You can avoid spawning subshells\
    \ by using {} instead of `()`, as shown here (and the whitespaces after { and\
    \ before } are required):\n\n```\n { ls | sort; echo \"the contents of /tmp:\"\
    ; ls /tmp } > myfile1\n```\n\nSuppose that you want to set a variable and execute\
    \ a command, and then invoke a second command via a pipe, as shown here:\n\n```\n\
    \ name=SMITH cmd1 | cmd2\n```\n\nUnfortunately, `cmd2` in the preceding code snippet\
    \ does not recognize the value of name, but there is a simple solution, as shown\
    \ here:\n\n```\n (name=SMITH cmd1) | cmd2\n```\n\nUse the double ampersand `&&`\
    \ symbol if you want to execute a command only if a prior command succeeds. For\
    \ example, the `cd` command only works if the `mkdir` command succeeds in the\
    \ following code snippet:\n\n```\n mkdir /tmp2/abc && cd /tmp2/abc\n```\n\nThe\
    \ preceding command will fail because (by default) the `/tmp2` does not exist.\
    \ On the other hand, the following command succeeds because the `–p` option ensures\
    \ that intermediate directories are created:\n\n```\n mkdir -p /tmp/abc/def &&\
    \ cd /tmp/abc && ls -l\n```\n\n### **A Simple Use Case**"
