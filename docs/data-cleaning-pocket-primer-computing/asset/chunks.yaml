  trans: "\n在第 1 章中你学习了 `echo` 命令会打印一个换行符，而 `printf` 语句不会打印换行符（除非显式包含）。你可以通过以下代码片段亲自验证这一事实：\n\
    \n```\n echo abcde | od -c\n0000000    a   b   c   d   e   \\n\n0000006\nprintf\
    \ abcde | od -c\n0000000    a   b   c   d   e\n0000005\n```\n\n### `tr` 命令\n\n\
    `tr` 命令是一个功能非常强大的命令，支持许多操作。例如，`tr` 命令允许你删除数据集中的多余空格、插入空行、分行打印单词，还可以将字符从一个字符集转换为另一个字符集（例如，从大写字母转为小写，反之亦然）。\n\
    \n以下命令将变量 `x` 中的字母大大写：\n\n```\n x=\"abc def ghi\"\necho $x | tr [a-z] [A-Z]\n\
    ABC DEF GHI\n```\n\n另一种从小写转换为大写的方法：\n\n```\n cat columns4.txt | tr '[:lower:]'\
    \ '[:upper:]'\n```\n\n除了大写和小写，你可以在 `tr` 命令中使用 `POSIX` 字符类：\n\n- alnum: 字母数字字符\n\
    - alpha: 字母字符\n- cntrl: 控制（非打印）字符\n- digit: 数字字符\n- graph: 图形字符\n- lower: 小写字母\n\
    - print: 可打印字符\n- punct: 标点符号字符\n- space: 空格字符\n- upper: 大写字符\n- xdigit: 十进制字符\
    \ 0–9 A–F\n\n以下示例删除了变量 `x`（上文初始化）中的空格：\n\n```\n echo $x |tr -ds \" \" \"\"\nabcdefghi\n\
    ```\n\n以下命令将每个单词打印在单独的一：\n\n```\n echo \"a b c\" | tr -s \" \" \"\\012\"\na\n\
    b\nc\n```\n\n以下命令将逗号 “，” 替换为换行符：\n\n```\n echo \"a,b,c\" | tr -s \",\" \"\\n\"\
    \na\nb\nc\n```\n\n以下示例将每行的换行符替换为空格，从而产生单行输出：\n\n```\n cat test4.txt |tr '\\n'\
    \ ' '\n```\n\n上一个命令的输出在这里：\n\n```\n abc  def  abc  abc\n```\n\n以下示例删除文本文件中每行末尾的换行符。作为说明，列表\
    \ 2.3 显示了 `abc2.txt` 的内容。\n\n##### 列表 2.3 abc2.txt\n\n```\n This is line one\n\
    This is line two\nThis is line three\nFourth line\nFifth line\nThe sixth line\n\
    The seventh line\n```\n\n以下代码片段删除文本文件 `abc2.txt` 中的换行符：\n\n```\n tr -d '\\n' <\
    \ abc2.txt\n```\n\n上一个 `tr` 代码片段的输出在这里：\n\n`This is line oneThis is line twoThis\
    \ is line threeFourth line-Fifth lineThe sixth lineThe seventh line`\n\n你可以看到，输出连续行之间缺少空格，我们可以通过此命令插入空格：\n\
    \n```\n tr -s '\\n' ' ' < abc2.txt\n```\n\n修改后的 `tr` 代码片段副本的输出在这里：\n\n`This is\
    \ line one This is line two This is line three Fourth line Fifth line The sixth\
    \ line The seventh line`\n\n你可以使用此版本的 `tr` 命令将换行符替换为句号 \".\"：\n\n```\n tr -s '\\\
    n' '.' < abc2.txt\n```\n\n上一个版本的 `tr` 代码片段的输出在这里：\n\n`This is line one.This is\
    \ line two.This is line three.Fourth line.Fifth line.The sixth line.The seventh\
    \ line.`\n\n带有 `–s` 选项的 `tr` 命令基于一对的基础上工作，这意味着序列 “.” 的效果与序列 “. ` 相同。作为一种“预览”，我们可以通过结合\
    \ `tr` 命令和 `sed` 命令（在第 4 章中讨论过），在每个句号 “.” 后添加一个空格，如下：\n\n```\n tr -s '\\n' '.'\
    \ < abc2.txt | sed 's/\\./\\. /g'\n```\n\n上一个命令的输出在这里：\n\n`This is line one.`\
    \ `This is line two.` `This is line three.` `Fourth line.` `Fifth line.` `The\
    \ sixth line.` `The seventh line.`\n\n可以将上一个 `sed` 片段理解为：“每当遇到‘点’，将其替换为‘点’后跟一个空格，并对每一个此类出现执行操作。”\n\
    \n你还可以使用 Unix 管道符号组合多个命令。例如，以下命令对列表 2.3 的内容进行排序，获取“最后”五行文本，获取唯一的行，然后将文本转换为大写字母：\n\
    \n```\n cat abc2.txt |sort |tail -5 | uniq | tr [a-z] [A-Z]\n```\n\n这里是上一个命令的输出：\n\
    \n```\n THE SEVENTH LINE\nTHE SIXTH LINE\nTHIS IS LINE ONE\nTHIS IS LINE THREE\n\
    THIS IS LINE TWO\n```\n\n你还可以使用 `tr` 命令将单词的首字母转换为大写（或小写），如下：\n\n```\n x=\"pizza\"\
    \nx=`echo ${x:0:1} | tr '[a-z]' '[A-Z]'\n```\n\n这里显示了稍长的代码（多出一行）将首字母转换为大写：\n\n\
    ```\n x=\"pizza\"\nfirst=`echo $x|cut -c1|tr [a-z] [A-Z]`\nsecond=`echo $x|cut\
    \ -c2`\necho $first\n```\n\n上述代码对于初学者来说比较晦涩，因此使用其他工具（如 R 中的数据框）可能更好。可以使用 bash\
    \ 管道 “|” 多个命令。\n\n### 简单用例\n\n本节的代码显示了如何使用 `tr` 命令将控制字符 “^M” 替换为换行符。列表 2.4 显示了包含嵌入字符的\
    \ `controlm.csv` 内容。\n\n##### 列表 2.4 controlm.csv\n\n```\n IDN,TEST,WEEK_MINUS1,WEEK0,WEEK1,WEEK2,WEEK3,WEEK4,WEEK10,\n\
    12,WEEK14,WEEK15,WEEK17,WEEK18,WEEK19,\n21^M,BASO,,1.4,,0.8,,1.2,,1.1,,,2.2,,,1.4\n\
    1,BASOAB,,0.05,,0.04,,0.05,,0.04,,,0.07,,,0.05\n^M,EOS,,6.1,,6.2,,7.5,,6.6,,,7.0,,,6.2\n\
    ^M,EOSAB,,0.22,,0.30,,0.27,,0.25,,,0.22,,,0.21\n^M,HCT,,35.0,,34.2,,34.6,,34.3,,,36.2,,,34.1\n\
    ^M,HGB,,11.8,,11.1,,11.5,,,12.1,,,\n11.3^M,LYM,,36.7\n```\n\n显示文件 `controlm.sh`\
    \ 内容，说明了如何从 `controlm.csv` 中移除控制字符。\n\n##### 列表 2.5 controlm.sh\n\n```\n inputfile=\"\
    controlm.csv\"\nremovectrlfile=\"removectrlfile\"\ntr -s '\\r' '\\n' < $inputfile\
    \ > $removectrlfile\n```\n\n为了方便起见，列表 2.5 包含输入文件和一个输出变量，但你可以通过使用硬编码的值来简化列表 2.5\
    \ 中的 `tr` 命令。运行该脚本的输出在这里：\n\n```\n IDN,TEST,WEEK_MINUS1,WEEK0,WEEK1,WEEK2,WEEK3,WEEK4,WEEK10,\n\
    12,WEEK14,WEEK15,WEEK17,WEEK18,WEEK19,\n21\n1,BASO,,1.4,,0.8,,1.2,,1.1,,,2.2,,,1.4\n\
    1,BASOAB,,0.05,,0.04,,0.05,,0.04,,,0.07,,,0.05\n1,EOS,,6.1,,6.2,,7.5,,6.6,,,7.0,,,6.2\n\
    1,EOSAB,,0.22,,0.30,,0.27,,0.25,,,0.22,,,0.21\n```\n\n你可以看到，本节的任务通过 `tr` 命令非常很容易地解决了。注意，需要额外的数据清洗来处理输出中的空字段。你还可以使用以下命令将当前的分隔符\
    \ “，” 替换为不同的分隔符，例如 “|”符号：\n\n```\n cat removectrlfile |tr -s ',' '|' > pipedfile\n\
    ```\n\n结果输出在这里：\n\n```\n IDN|TEST|WEEK_MINUS1|WEEK0|WEEK1|WEEK2|WEEK3|WEEK4|WEEK10|\n\
    12|WEEK14|WEEK15|WEEK17|WEEK18|WEEK19|WEEK21\n1|BASO|1.4|0.8|1.2|1.1|2.2|1.4\n\
    1|BASOAB|0.05|0.04|0.05|0.04|0.07|0.05\n1|EOS|6.1|6.2|7.5|6.6|7.0|6.2\n1|EOSAB|0.22|0.30|0.27|0.25|0.22|0.21\n\
    ```\n\n如果你有在多个文件中具有任意顺序的多个分隔符的数据集，可以通过 `sed` 命令将这些分隔符替换为单个分隔符，该命令在第 4 章中讨论过。\n\
    \n### `find` 命令\n\n`find` 命令支持许多选项，包括一个用于打印（显示）`find` 命令返回的文件，以及另一个用于删除 `find`\
    \ 命令返回的文件。\n\n"
- fmt: "\nIn addition, you can specify logical operators such as `AND` as well as\
    \ `OR` in a `find` command. You can also specify switches to find the files (if\
    \ any) that were created, accessed, or modified before (or after) a specific date.\n\
    \nSeveral examples are here:\n\n`find . –print` displays all the files (including\
    \ subdirectories)\n\n`find . –print |grep \"abc\"` displays all the files whose\
    \ names contain the string `abc`\n\n`find . –print |grep \"sh$\"` displays all\
    \ the files whose names have the suffix `sh`\n\n`find . –depth 2 –print` displays\
    \ all files of depth at most 2 (including subdirectories)\n\nYou can also specify\
    \ access times pertaining to files. For example, `atime`, `ctime,` and `mtime`\
    \ refer to the access time, creation time, and modification time of a file.\n\n\
    As another example, the following command finds all the files modified in less\
    \ than 2 days and prints the record count of each:\n\n```\n$ find . –mtime -2\
    \ –exec wc –l {} ;\n```\n\nYou can remove a set of files with the `find` command.\
    \ For example, you can remove all the files in the current directory tree that\
    \ have the suffix “m” as follows:\n\n```\nfind . –name \"*m$\" –print –exec rm\
    \ {}\n```\n\n#### NOTE\n\n*Be careful when you remove files: run the preceding\
    \ command without “exec rm {}`” to review the list of files before deleting them.*\n\
    \n### The `tee` Command\n\nThe `tee` command enables you to display output to\
    \ the screen and also redirect the output to a file at the same time. The `–a`\
    \ option will append subsequent output to the named file instead of overwriting\
    \ the file. An example is here:\n\n```\nfind . –print |xargs grep \"sh$\" | tee\
    \ /tmp/blue\n```\n\nThe preceding code snippet redirects the list of all files\
    \ in the current directory (and those in any subdirectories) to the `xargs` command,\
    \ which then searches—and prints—all the lines that end with the string “sh.”\
    \ The result is displayed on the screen and is also redirected to the file `/tmp/blue`.\n\
    \n```\nfind . –print |xargs grep \"^abc$\" | tee –a /tmp/blue\n```\n\nThe preceding\
    \ code snippet also redirects the list of all files in the current directory (and\
    \ those in any subdirectories) to the `xargs` command, which then searches—and\
    \ prints—all the lines that contain only the string “abc.” The result is displayed\
    \ on the screen and is also appended to the file `/tmp/blue`.\n\n### The File\
    \ Compression Commands\n\nBash supports various commands for compressing sets\
    \ of files, including the `tar`, `cpio`, `gzip`, and `gunzip` commands. The following\
    \ subsections contain simple examples of how to use these commands.\n\n#### The\
    \ `tar` Command\n\nThe `tar` command enables you to compress a set of files in\
    \ a directory, uncompress a tar file, and also display the contents of a tar file.\n\
    \nThe “c” option specifies “create,” the “f” option specifies “file,” and the\
    \ “v” option specifies “verbose.” For example, the following command creates a\
    \ compressed file called `testing.tar` and displays the files that are included\
    \ in `testing.tar` during the creation of this file:\n\n```\ntar cvf testing.tar\
    \ *.txt\n```\n\nThe compressed file `testing.tar` contains the files with the\
    \ suffix `txt` in the current directory, and you will see the following output:\n\
    \n```\na apple-care.txt\na checkin-commands.txt\na iphonemeetup.txt\na kyrgyzstan.txt\n\
    a outfile.txt\na output.txt\na ssl-instructions.txt\n```\n\nThe following command\
    \ extracts the files that are in the tar file `testing.tar:`\n\n```\ntar xvf testing.tar\n\
    ```\n\nThe following command displays the contents of a tar file without uncompressing\
    \ its contents:\n\n```\ntar tvf testing.tar\n```\n\nThe preceding command displays\
    \ the same output as the `ls –l` command that displays a long listing.\n\nThe\
    \ “z” option uses `gzip` compression. For example, the following command creates\
    \ a compressed file called `testing.tar.gz:`\n\n```\ntar czvf testing.tar.gz *.txt\n\
    ```\n\n#### The `cpio` Command\n\nThe `cpio` command provides further compression\
    \ after you create a tar file. For example, the following command creates the\
    \ file `archive.cpio:`\n\n```\nls file1 file2 file3 | cpio -ov > archive.cpio\n\
    ```\n\nThe `-o` option specifies an output file and the `-v` option specifies\
    \ verbose, which means that the files are displayed as they are placed in the\
    \ archive file. The `-I` option specifies input, and the `-d` option specifies\
    \ “display.”\n\nYou can combine other commands (such as the `find` command) with\
    \ the `cpio` command, an example of which is here:\n\n```\nfind . –name \".sh\"\
    \ | cpio -ov > shell-scripts.cpio\n```\n\nYou can display the contents of the\
    \ file `archive.cpio` with the following command:\n\n```\ncpio -id < archive.cpio\n\
    ```\n\nThe output of the preceding command is here:\n\n```\nfile1\nfile2\nfile3\n\
    1 block\n```\n\n#### The `gzip` and `gunzip` Commands\n\nThe `gzip` command creates\
    \ a compressed file. For example, the following command creates the compressed\
