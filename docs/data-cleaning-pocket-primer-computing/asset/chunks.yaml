    \n done\n\n echo \"Files containing $str:\"\n\n echo $foundlist| tr ' ' '\\n'\n\
    \n echo \"Files not containing $str:\"\n\n echo $notfoundlist |tr ' ' '\\n'\n\n\
    \ foundlist=\"\"\n\n notfoundlist=\"\"\n\ndone\n```\n\n[Listing A.6](#appendix.xhtml_liA-6)\
    \ first checks that at least one file is specified on the command line, and then\
    \ initializes the `zipfiles` variable with the list of zip files in the current\
    \ directory. If `zipfiles` is null, an appropriate message is displayed.\n\nThe\
    \ next section of [Listing A.6](#appendix.xhtml_liA-6) contains a `for` loop that\
    \ processes each argument that was specified at the command line. For each such\
    \ argument, another for loop will check for the names of the zip files that contain\
    \ that argument. If there is a match, then the variable `$foundlist` is updated,\
    \ otherwise the `$notfoundlist` variable is updated. When the inner loop has completed,\
    \ the names of the matching files and the non-matching files are displayed, and\
    \ then the outer loop is executed with the next command line argument.\n\nAlthough\
    \ the preceding explanation might seem complicated, a sample output from launching\
    \ [Listing A.6](#appendix.xhtml_liA-6) will clarify how the code works:\n\n```\n\
    \ ./searchstrings.sh svg abc\n\nChecking zip files for svg:\n\nFiles containing\
    \ svg:\n\nFiles not containing svg:\n\nshell-programming-manuscript.zip\n\nshell-progr-manuscript-0930-2013.zip\n\
    \nshell-progr-manuscript-0207-2015.zip\n\nshell-prog-manuscript.zip\n\nChecking\
    \ zip files for abc:\n\nFiles containing abc:\n\nFiles not containing abc:\n\n\
    shell-programming-manuscript.zip\n\nshell-progr-manuscript-0930-2013.zip\n\nshell-progr-manuscript-0207-2015.zip\n\
    \nshell-prog-manuscript.zip\n```\n\nIf you want to perform the search for zip\
    \ files in subdirectories, modify the loop as shown here:\n\n```\n for f in `find\
    \ . –print |grep \"zip$\"`\n\ndo\n\n   echo \"Searching $f…\"\n\n   unzip -v $f\
    \ |grep \"svg$\"\n\ndone \n```\n\nIf you have the Java SDK on your machine, you\
    \ can also use the `jar` command instead of the `unzip` command, as shown here:\n\
    \n```\n jar tvf $f |grep \"svg$\"\n```\n\n[Listing A.7](#appendix.xhtml_liA-7)\
    \ displays the contents of `skutotals.sh` that calculates the number of units\
    \ sold for each `SKU` in `skuvalues.txt.`\n\n##### ***LISTING A.7: skutotals.sh***\n\
    \n```\n SKUVALUES=\"skuvalues.txt\"\n\nSKUSOLD=\"skusold.txt\"\n\nfor sku in `cat\
    \ $SKUVALUES`\n\ndo\n\n  total=`cat $SKUSOLD |grep $sku | awk '{total += $2} END\n\
    {print total}'`\n\n  echo \"UNITS SOLD FOR SKU $sku: $total\"\n\ndone\n```\n\n\
    [Listing A.7](#appendix.xhtml_liA-7) contains a `for` loop that iterates through\
    \ the rows of the file `skuvalues.txt`, and passes those `SKU` values – one at\
    \ a time – to a command that involves the `cat, grep,` and `awk` commands. The\
    \ purpose of the latter combination of commands is to 1) find the matching lines\
    \ in `skusold.txt`, 2) compute the sum of the values of the numbers in the second\
    \ column, and 3) print the subtotal for the current `SKU`. In essence, this shell\
    \ script prints the subtotals for each `SKU` value.\n\nLaunch `skutotals.sh` and\
    \ you will see the following output:\n\n```\n UNITS SOLD FOR SKU 4520: 27\n\n\
    UNITS SOLD FOR SKU 5530: 17\n\nUNITS SOLD FOR SKU 6550: 8\n\nUNITS SOLD FOR SKU\
    \ 7200: 90\n\nUNITS SOLD FOR SKU 8000: 160 \n```"
