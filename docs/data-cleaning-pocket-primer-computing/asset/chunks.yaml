  trans: "\n\n命令 `ls -1`（数字“1”）以垂直列表的形式显示文件名：\n\n```\n apple-care.txt\ncheckin-commands.txt\n\
    iphonemeetup.txt\nkyrgyzstan.txt\noutfile.txt\noutput.txt\nssl-instructions.txt\n\
    ```\n\n命令 `ls -1`（字母“l”）以详细列表形式显示文件名：\n\n```\n total 56\n-rwx------  1 ocampesato\
    \ staff  25  Jan 06 19:21 apple-care.txt\n-rwx------  1 ocampesato staff 146 \
    \ Jan 06 19:21 checkin-commands.txt\n-rwx------  1 ocampesato staff 478  Jan 06\
    \ 19:21 iphonemeetup.txt\n-rwx------  1 ocampesato staff  12  Jan 06 19:21 kyrgyzstan.txt\n\
    -rw-r--r--  1 ocampesato staff  11  Jan 06 19:21 outfile.txt\n-rw-r--r--  1 ocampesato\
    \ staff  12  Jan 06 19:21 output.txt\n-rwx------  1 ocampesato staff 176  Jan\
    \ 06 19:21 ssl-instructions.txt\n```\n\n命令 `ls -1t`（字母“l”和“t”）显示按时间排序的详细列表：\n\n\
    ```\n total 56\n-rwx------1 ocampesato staff  25  Jan 06 19:21 apple-care.txt\n\
    -rwx------1 ocampesato staff 146  Jan 06 19:21 checkin-commands.txt\n-rwx------1\
    \ ocampesato staff 478  Jan 06 19:21 iphonemeetup.txt\n-rwx------1 ocampesato\
    \ staff  12  Jan 06 19:21 kyrgyzstan.txt\n-rw-r--r--1 ocampesato staff  11  Jan\
    \ 06 19:21 outfile.txt\n-rw-r--r--1 ocampesato staff  12  Jan 06 19:21 output.txt\n\
    -rwx------1 ocampesato staff  176 Jan 06 19:21 ssl-instructions.txt\n```\n\n命令\
    \ `ls -ltr`（字母“l”、“t”和“r”）显示按时间反序排列的文件名详细列表：\n\n```\n total 56\n-rwx------1 ocampesato\
    \ staff 176 Jan 06 19:21 ssl-instructions.txt\n-rw-r--r--1 ocampesato staff  12\
    \ Jan 06 19:21 output.txt\n-rw-r--r--1 ocampesato staff  11 Jan 06 19:21 outfile.txt\n\
    -rwx------1 ocampesato staff  12 Jan 06 19:21 kyrgyzstan.txt\n-rwx------1 ocampesato\
    \ staff 478 Jan 06 19:21 iphonemeetup.txt\n-rwx------1 ocampesato staff 146 Jan\
    \ 06 19:21 checkin-commands.txt\n-rwx------1 ocampesato staff  25 Jan 06 19:21\
    \ apple-care.txt\n```\n\n以下是对上述输出中所有列的描述：\n\n字体 第 #1 列：代表文件类型和赋予该文件的权限（见下文）\n\
    - 第 #2 列：显示文件或目录占用的内存块数\n- 第 #3 列：指示文件的所有者（Bash 用户）\n- 第 #4 列：代表所有组\n- 第 #5 列：代表以字节为的文件大小\n\
    - 第 #6 列：显示该文件的创建或最后修改日期\n- 第 #7 列：代表文件或目录名称\n\n在 `ls -l` 列表示例中，每个文件行都以 d、- 或\
    \ l 开头。这些字符表示所列出的文件类型。这些（以及其他）初始值描述如下：\n\n| - | 普通文件（ASCII 文本文件、二进制可执行文件或硬链接）\
    \ |\n| b | 块设备文件（如物理硬盘） |\n| c | 字符设备文件（如物理硬盘） |\n| d | 文件（包含其他文件和目录的列表） |\n|\
    \ l | 符号链接文件 |\n| p | 命名管道（进程间通信的机制） |\n| s | 套接字（用于进程间通信） |\n\n有关 `ls` 命令的更多详情，请咨询在线文档。\n\
    \n### 显示文件内容\n\n现在让我们看看如何显示文本文件中不同的行。你可以使用 `cat` 命令显示文件的全部内容，但先获取一些关于文件内容的信息更好。具体来说，请使用\
    \ `wc` 命令。\n\n### `wc` 命令\n\n`wc` 命令统计文件中行数、单词数和字节数。当你对文件运行 `wc` 时，它的输出如下所示：\n\
    \n```\n10 50 300 filename\n```\n\n输出分别代表行数、单词数和字节数。你可以配合 `wc` 的选项来仅统计其中之一：\n\n\
    - `wc -l`：统计行数\n- `wc -w`：统计单词数\n- `wc -c`：统计字节数\n\n你也可以对多个文件使用 `wc`：\n\n```\n\
    wc file1 file2\n```\n\n输出将显示每个文件的计数。\n\n### `head` 命令\n\n`head` 命令用于显示文件的开头部分。默认情况下，它显示前\
    \ 10 行。你可以使用 `-n` 选项指定要显示的行数：\n\n```bash\nhead -n 5 filename\n```\n\n这将显示 `filename`\
    \ 的前 5 行。\n\n### `tail` 命令\n\n`tail` 命令用于显示文件的尾部分。默认情况下，它显示最后 10 行。你可以使用 `-n`\
    \ 选项指定要显示的行数：\n\n```bash\ntail -n 5 filename\n```\n\n这将显示 `filename` 的后 5 行。\n\
    \n### `fold` 命令\n\n`fold` 命令用于在指定的宽度对文件中的行进行折行。\n\n```bash\nfold -w 20 filename\n\
    ```\n\n这将 `filename` 的行在 20 个字符处折行。\n\n"
- fmt: "\nThe `fold` command enables you to “fold” the lines in a text file, which\
    \ is useful for text files that contain long lines of text that you want to split\
    \ into shorter lines. For example, here are the contents of `longfile2.txt`:\n\
    \n```\n the contents of this long file are too long to see in a single\nscreen\
    \ and each line contains one or more words and if you\nuse the cat command the\
    \ file contents scroll off the screen so\nyou can use other commands such as the\
    \ head or tail or more\ncommands in conjunction with the pipe command that is\
    \ very\nuseful in Bash and is available in every shell including the\nbash shell\
    \ csh zsh ksh and Bourne shell\n```\n\nYou can “fold” the contents of `longfile2.txt`\
    \ into lines whose length is `45` (just as an example) with this command:\n\n\
    ```\n cat longfile2.txt |fold -45\n```\n\nThe output of the preceding command\
    \ is here:\n\n```\n the contents of this long file are too long t\no see in a\
    \ single screen and each line contai\nns one or more words and if you use the\
    \ cat c\nommand the file contents scroll off the scree\nn so you can use other\
    \ commands such as the h\nead or tail or more commands in conjunction w\nith the\
    \ pipe command that is very useful in U\nnix and is available in every shell including\n\
    \ the bash shell csh zsh ksh and Bourne shell\n```\n\nNotice that some words in\
    \ the preceding output are split based on the line width, and not “newspaper style.”\n\
    \nIn [Chapter 4](#chap4.xhtml) you will learn how to display the lines in a text\
    \ file that match a string or a pattern, and in [Chapter 5](#chap5.xhtml) you\
    \ will learn how to replace a string with another string in a text file.\n\n##\
    \ File Ownership: Owner, Group, and World\n\nBash files have `rwx` privileges,\
    \ where `r` = read privilege, `w` = write privilege, `x` = execute privilege can\
    \ be executed from the command line, simply by typing the file name (or the full\
    \ path to file name if the file is not in your current directory). Invoking an\
    \ executable file from the command line will cause the operating system to attempt\
    \ to execute commands inside the text file.\n\nUse the `chmod` command to set\
    \ permissions for files. For example, if you need to set the permission `rwx rw-\
    \ r--` for a file, use the following:\n\n```\n chmod u=rwx g=rw o=r filename\n\
    ```\n\nIn the preceding command the options `u`, `g`, and `o` represent user permissions,\
    \ group permissions, and other permissions, respectively.\n\nIn order to add additional\
    \ permissions on the current file, use `+` to add permission to user, group, or\
    \ others and use `-` to remove the permissions. For example, given a file with\
    \ the permissions `rwx rw- r--`, add the executable permission as follows:\n\n\
    ```\n chmod o+x filename\n```\n\nThis command adds the `x` permission for `others`.\n\
    \nAdd the executable permission to all permission categories—that is, for user,\
    \ group, and others—as follows:\n\n```\n chmod a+x filename\n```\n\nIn the preceding\
    \ command, the letter `a` means “all.”\n\nSpecify a `-` in order to remove any\
    \ permission, as shown here:\n\n```\n chmod a-x filename\n```\n\n## Hidden Files\n\
    \nA so-called “invisible” file is one whose first character is the dot or period\
    \ character (`.`). Bash programs (including the shell) use most of these files\
    \ to store configuration information. Some common examples of hidden files include\
    \ the following:\n\n.profile: the Bourne shell (sh) initialization script\n\n\
    .bash_profile: the bash shell (bash) initialization script\n\n.kshrc: the Korn\
    \ shell (ksh) initialization script\n\n.cshrc: the C shell (csh) initialization\
    \ script\n\n.rhosts: the remote shell configuration file\n\nTo list invisible\
    \ files, specify the `-a` option to `ls`:\n\n```\n ls -a\n.         .profile \
    \       docs        lib        test_results\n..        .rhosts         hosts \
    \      pub        users\n.emacs    bin             hw1         res.01     work\n\
    .exrc     ch07            hw2         res.02\n.kshrc    ch07.bak        hw3  \
    \       res.03\n```\n\nSingle dot `.`: This represents current directory.\n\n\
    Double dot `..`: This represents parent directory.\n\n## Handling Problematic\
    \ Filenames\n\nProblematic filenames contain one or more whitespaces, hidden (non-printing)\
    \ characters, or start with a dash (“-”) character.\n\nYou can use double quotes\
    \ to list filenames that contain whitespaces, or you can precede each whitespace\
    \ by a backslash (`\\`) character.\n\nFor example, if you have a file named `One\
    \ Space.txt`, you can use the `ls` command as follows:\n\n```\n ls -1 \"One Space.txt\"\
    \nls -l One\\ Space.txt\n```\n\nFilenames that start with a dash (“-”) character\
    \ are difficult to handle because the dash character is the prefix that specifies\
    \ options for bash commands. Consequently, if you have a file whose name is `–abc`,\
    \ then the command `ls –abc` will not work correctly, because the “-a” is interpreted\
    \ as a switch for the `ls` command (and there is no “a” option).\n\nIn most cases\
    \ the best solution to this type of file is to rename the file. This can be done\
    \ in your operating system if your client isn’t a Unix shell, or you can use the\
    \ following special syntax for the `mv` (“move”) command to rename the file. The\
    \ preceding two dashes tell `mv` to ignore the dash in the filename. An example\
    \ is here:\n\n`mv -- -abc.txt renamed-abc.txt`\n\n## Working with Environment\
    \ Variables\n\nThere are many built-in environment variables available, and the\
    \ following subsections discuss some of the more common variables.\n\n### The\
    \ `env` Command\n\nThe `env` (“environment”) command displays the variables that\
    \ are in your `bash` environment. An example of the output of the `env` command\
    \ is here:\n\n```\n SHELL=/bin/bash\nTERM=xterm-256color\nTMPDIR=/var/folders/73/39lngcln4dj_scmgvsv53g_w0000gn/T/\n\
    OLDPWD=/tmp\nTERM_SESSION_ID=63101060-9DF0-405E-84E1-EC56282F4803\nUSER=ocampesato\n\
    COMMAND_MODE=bash2003PATH=/opt/local/bin:/Users/ocampesato/\nandroid-sdk-mac_86/platform-tools:/Users/ocampesato/\n\
    android-sdk-mac_86/platform-tools:/usr/local/bin:\nPWD=/Users/ocampesato\nJAVA_HOME=/System/Library/JavaVirtualMachines/1.6.0.jdk/\n\
    Contents/Home\nLANG=en_US.UTF-8\nNODE_PATH=/usr/local/lib/node_modules\nHOME=/Users/ocampesato\n\
    LOGNAME=ocampesato\nSHELL=/bin/bash\nUSER=ocampesato\nDISPLAY=/tmp/launch-org.xquartz:0\n\
    ```\n\nSome interesting examples of setting an environment variable and also executing\
    \ a command are described here: *https://stackoverflow.com/questions/13998075/setting-environment-variable-for-one-call-in-bash-using-env.*\n\
    \n### Useful Environment Variables\n\nThis section discusses some important environment\
    \ variables, most of which you probably will not need to modify, it’s useful to\
    \ be aware of their existence and purpose.\n\nThe `HOME` variable contains the\
    \ absolute path of the user’s home directory.\n\nThe `HOSTNAME` variable specifies\
    \ the Internet name of the host.\n\nThe `LOGNAME` variable specifies the user’s\
    \ login name.\n\nThe `PATH` variable specifies the search path (see next subsection).\n\
    \nThe `SHELL` variable specifies the absolute path of the current shell.\n\nThe\
    \ `USER` variable specifies the user’s current username. This value might be different\
    \ than the login name if a superuser executes the `su` command to emulate another\
    \ user’s permissions.\n\n### Setting the `PATH` Environment Variable\n\nPrograms\
    \ and other executable files can live in many directories, so operating systems\
    \ provide a search path that lists the directories that the OS searches for executable\
    \ files. Adding a directory to your path means an executable file can be called\
    \ by just using the filename as a command, without having to call out its entire\
    \ path, just as if it resided in your working directory.\n\nThe path is stored\
    \ in an environment variable, which is a named string maintained by the operating\
    \ system. These variables contain information available to the command shell and\
    \ other programs.\n\nThe path variable is named `PATH` in `bash` or `Path` in\
    \ Windows (`bash` is case-sensitive; Windows is not).\n\nSetting the path in `bash/Linux:`\n\
    \n```\n export PATH=$HOME/anaconda:$PATH\n```\n"
