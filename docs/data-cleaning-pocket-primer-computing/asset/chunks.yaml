    \     factvalues[$i]=$result\n   done\n}\n\nprintf \"Enter a number: \"\nread\
    \ num\n\nfor (( i=1; i<=${num}; i++ ));\ndo\n  factvalues[$i]=1\ndone\n\nfactorial\
    \ $num\n\n# print each element via a loop:\nfor (( i=1; i<=${num}; i++ ));\ndo\n\
    \  echo \"Factorial of $i : \" ${factvalues[$i]}\ndone\n```\n\n[Listing 2.13](#chap2.xhtml_li2-13)\
    \ is very similar to the code in [Listing 2.12](#chap2.xhtml_li2-12): the key\
    \ difference is that intermediate factorial values are stored in the array `factvalues`.\
    \ Notice that initial loop that initializes the values in `factvalues:` doing\
    \ so makes the values global, so we don’t need to return anything from the `factorial()`\
    \ function.\n\nThe last portion of [Listing 2.13](#chap2.xhtml_li2-13) contains\
    \ a `for` loop that displays the intermediate factorial values as well as the\
    \ factorial of the user-provided input.\n\n### **Summary**\n\nThis chapter showed\
    \ you examples of how to use some useful and versatile `bash` commands. First\
    \ you learned about the bash commands `join, fold, split, sort`, and `uniq`. Next\
    \ you learned about the `find` command and the `xargs` command. You also learned\
    \ about various ways to use the `tr` command, which is also in the use case in\
    \ this chapter.\n\nThen you saw some compression-related commands, such as `cpio`\
    \ and `tar`, which help you create new compressed files and also help you examine\
    \ the contents of compressed files.\n\nIn addition, you learned how to extract\
    \ column ranges of data, as well as the usefulness of the `IFS` option. Finally,\
    \ you saw an example of a `bash` script for computing the factorial value of a\
    \ number via recursion.\n\n## CHAPTER 3\n\n## FILTERING DATA WITH **`grep`**\n\
    \nThis chapter introduces you to the versatile `grep` command, whose purpose is\
    \ to take a stream of text data and reduce it to only the parts that you care\
    \ about. The `grep` command is useful not only by itself, but also in conjunction\
    \ with other commands, especially the `find` command. This chapter contains many\
    \ short code samples that illustrate various options of the `grep` command. Some\
    \ code samples illustrate how to combine the `grep` command with commands from\
    \ previous chapters.\n\nThe first part of this chapter introduces the `grep` command\
    \ used in isolation, combined with the regular expression metacharacters (from\
    \ [Chapter 1](#chap1.xhtml)) and also with code snippets that illustrate how to\
    \ use some of the options of the `grep` command. Next you will learn how to match\
    \ ranges of lines, how to use the so-called “back references” in `grep,` and how\
    \ to “escape” metacharacters in `grep.`\n\nThe second part of this chapter shows\
    \ you how to use the `grep` command in order to find empty lines and common lines\
    \ in datasets, as well as how to use keys to match rows in datasets. Next you\
    \ will learn how to use character classes with the `grep` command, as well as\
    \ the backslash “\\” character, and how to specify multiple matching patterns.\
    \ Next you will learn how to combine the `grep` command with the `find` command\
    \ and the `xargs` command, which is useful for matching a pattern in files that\
    \ reside in different directories. This section also contains some examples of\
    \ common mistakes that people make with the `grep` command.\n\nThe third section\
    \ briefly discusses the `egrep` command and the `fgrep` command, which are related\
    \ commands that provide additional functionality that is unavailable in the standard\
    \ `grep` utility. The final section contains a use case that illustrates how to\
    \ use the `grep` command in order to find matching lines that are then merged\
    \ in order to create a new dataset.\n\n### **What Is the `grep` Command?**\n\n\
    The `grep` (“Global Regular Expression Print”) command is useful for finding substrings\
    \ in one or more files. Several examples are here:\n\n`grep abc *sh` displays\
    \ all the *lines* of `abc` in files with suffix `sh`\n\n`grep –i abc *sh` is the\
    \ same as the preceding query, but case-insensitive\n\n`grep –l abc *sh` displays\
    \ all the *filenames* with suffix `sh` that contain `abc`\n\n`grep –n abc *sh`\
    \ displays all the *line numbers* of the occurrences of the string `abc` in files\
    \ with suffix `sh`\n\nYou can perform logical `AND` and logical `OR` operations\
    \ with this syntax:\n\n`grep abc *sh | grep def` matches lines containing `abc`\
    \ AND `def`\n\n`grep \"abc\\|def\" *sh` matches lines containing `abc` OR `def`\n\
    \nYou can combine switches as well: the following command displays the names of\
    \ the files that contain the string `abc` (case insensitive):\n\n```\n grep –il\
    \ abc *sh\n```\n\nIn other words, the preceding command matches filenames that\
    \ contain `abc, Abc, ABc, ABC, abC,` and so forth.\n\nAnother (less efficient\
    \ way) to display the lines containing `abc` (case insensitive) is here:\n\n```\n\
    \ cat file1 |grep –i abc\n```\n\nThe preceding command involves two processes,\
    \ whereas the “grep using –l switch instead of cat to input the files you want”\
    \ approach involves a single process. The execution time is roughly the same for\
    \ small text files, but the execution time can become more significant if you\
    \ are working with multiple large text files.\n\nYou can combine the `sort` command,\
    \ the pipe symbol, and the `grep` command. For example, the following command\
    \ displays the files with a “`Jan`” date in increasing size:\n\n```\n ls -l |grep\
    \ \" Jan \" | sort -n\n```\n\nA sample output from the preceding command is here:"
