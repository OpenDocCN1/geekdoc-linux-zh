    要在 bash 的特定会话中将 `Python` 目录添加到路径：


    ```bash

    export PATH="$PATH:/usr/local/bin/python"

    ```


    在 Bourne shell 或 ksh shell 中输入此命令：


    ```bash

    PATH="$PATH:/usr/local/bin/python"

    ```


    **注意**


    `/usr/local/bin` 是 `Python` 可执行文件所在的位置


    ## 指定别名和环境变量


    以下命令定义了一个名为 `h1:` 的环境变量：


    ```bash

    h1=$HOME/test

    ```


    现在，如果你输入以下命令：


    ```bash

    echo $h1

    ```


    你会在 OS X 上看到以下输出：


    ```

    /Users/jsmith/test

    ```


    接下来的代码段向你展示如何设置别名 `ll`，使其显示目录的详细列表：


    ```bash

    alias ll="ls -l"

    ```


    以下三个别名定义涉及 `ls` 命令以及各种开关：


    ```bash

    alias ll="ls -l"

    alias lt="ls -lt"

    alias ltr="ls -ltr"

    ```


    作为一个示例，你可以将之前在本章节中看到的命令 `ls -ltr`（字母“l”、“t”和“r”）替换为别名 `ltr`，你将看到完全相同的按时间反序排列的文件详细列表（在此还原）：


    ```

    total 56

    -rwx------ 1 ocampesato staff 176 Jan 06 19:21 ssl-instructions.txt

    -rw-r--r-- 1 ocampesato staff  12 Jan 06 19:21 output.txt

    -rw-r--r-- 1 ocampesato staff  11 Jan 06 19:21 outfile.txt

    -rwx------ 1 ocampesato staff  12 Jan 06 19:21 kyrgyzstan.txt

    -rwx------ 1 ocampesato staff 478 Jan 06 19:21 iphonemeetup.txt

    -rwx------ 1 ocampesato staff 146 Jan 06 19:21 checkin-commands.txt

    -rwx------ 1 ocampesato staff  25 Jan 06 19:21 apple-care.txt

    ```


    你也可以定义一个包含 Bash 管道 (`|`) 符号的别名：


    ```bash

    alias ltrm="ls -ltr|more"

    ```


    同样地，你可以为目录相关的命令定义别名：


    ```bash

    alias ltd="ls -lt | grep ''^d''"

    alias ltdm="ls -lt | grep ''^d''|more"

    ```


    ## 查找可执行文件


    有多个命令可以通过搜索 `PATH` 环境变量中的目录来查找可执行文件（二进制文件或 shell 脚本）：`which`、`whence`、`whereis`
    和 `whatis`。这些命令的结果与 `which` 命令类似，如下文所述。


    `which` 命令提供你指定的任何可执行文件的完整路径；如果该可执行文件不在 `PATH` 环境变量指定的任何目录中，则返回一个空行。这对于判断特定命令或工具是否安装在系统上非常有用。


    ```bash

    which rm

    ```


    上一个命令的输出在此：


    ```

    /usr/bin/rm

    ```


    `whereis` 命令提供了你从 `where` 命令获得的信息，以及该可执行文件的 `man` 手页的位置：


    ```bash

    $whereis rm

    rm: /bin/rm /usr/share/man/man1/rm.1.bz2

    ```


    `whatis` 命令在 `whatis` 数据库中查找指定的命令，这对于识别系统命令和重要的配置文件非常有用。可以将其视为简版的“man”命令，它显示关于
    `bash` 命令的简洁细节（例如，输入 `man ls` 你将看到关于 `ls` 命令的几页解释）。


    ## 什么是 Shell 脚本？


    Shell 脚本包含 `bash` 命令，这些命令从上到下执行（即按照在 shell 脚本中出现的顺序），除非它们被定义在函数内部。特别是 shell 脚本中的用户定义函数是按照调用的顺序执行，而不是在脚本中出现的顺序。然而，你可以通过条件逻辑、case
    语句、循环和函数来更改命令执行的顺序。


    Shell 脚本可以包含你系统中可用的 `bash` 命令（但请注意某些命令需要 `sudo` 命令，而这又需要密码）。Shell 脚本的简单示例包括创建文件、从文件读取数据和更新文件内容的类文件命令。无论你的
    shell 脚本内容如何，它们都是“即时”解释的，因此没有创建二进制可执行文件的编译步骤。


    Shell 脚本的目的是自动化执行一组 `bash` 命令的过程，这样你就不需要从命令行手动执行它们。如果你需要从命令行执行一个简单的命令，那么可能不需要通过
    shell 脚本来完成：只需输入命令并按 `<RETURN>` 键即可。注意，`bash crontab` 工具允许你在不同的时间点调度 shell 脚本的执行（`crontab`
    工具不在本书的范围内）。


    你可能已经知道，注释在源代码中很重要。良好的 shell 脚本包含有意义的注释，以 `#` 开。


    ## 一个 Shell 脚本


    使用你喜欢的文本编辑器创建 `test.sh` 文件，内容如下：


    ```bash

    #!/bin/bash

    pwd

    ls

    mkdir /tmp

    touch /tmp/abc

    ls

    ```


    赋予该脚本可执行权限：


    ```bash

    chmod +x test.sh

    ```


    现在执行该脚本：


    ```bash

    ./test.sh

    ```


    输出将是：


    ```

    /tmp

    ... (tmp 列表)

    /tmp

    ... (包含 abc 的 tmp 列表)

    ```


