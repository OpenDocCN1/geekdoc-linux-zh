    \ **Summary**\n\nThis chapter introduced you to the `sed` utility, illustrating\
    \ the basic tasks of data transformation: allowing additions, removal, and mutation\
    \ of data by matching individual patterns, or matching the position of the rows\
    \ in a file, or a combination of the two.\n\nMoreover, we showed that `sed` not\
    \ only uses regular expressions to match data, similar to the `grep` command,\
    \ but can also use regular expressions to describe how to transform the data.\
    \ Finally, there was a list of examples showing both the versatility of the `sed`\
    \ command, and hopefully communicating the sense that it is an even more flexible\
    \ and powerful utility than we can show in a single chapter.\n\n## CHAPTER 5\n\
    \n## DOING EVERYTHING ELSE WITH **`awk`**\n\nThis chapter introduces you to the\
    \ `awk` command, which is a highly versatile utility for manipulating data and\
    \ restructuring datasets. In fact, this utility is so versatile that entire books\
    \ have been written about the `awk` utility. Awk is essentially an entire programming\
    \ language in a single command, which accepts standard input, gives standard output,\
    \ and uses regular expressions and metacharacters in the same way other Unix commands\
    \ do. This lets you plug it into other expressions and do almost anything, at\
    \ the cost of adding complexity to a command string that may already be doing\
    \ quite a lot already. It is almost always worthwhile to add a comment when using\
    \ `awk;` it is so versatile that it won’t be clear which of the many features\
    \ you are using at a glance.\n\nThe first part of this chapter provides a very\
    \ brief introduction of the `awk` command. You will learn about some built-in\
    \ variables for `awk,` and also how to manipulate string variables using `awk.`\
    \ Note that some of these string-related examples can also be handled using other\
    \ `bash` commands.\n\nThe second part of this chapter shows you conditional logic,\
    \ `while` loops, and `for` loops in `awk` in order to manipulate the rows and\
    \ columns in datasets. This section also shows you how to delete lines and merge\
    \ lines in datasets, and also how to print the contents of a file as a single\
    \ line of text. You will see how to “join” lines and groups of lines in datasets.\n\
    \nThe third section contains code samples that involve metacharacters (introduced\
    \ in [Chapter 1](#chap1.xhtml)) and character sets in `awk` commands. You will\
    \ also see how to use conditional logic in `awk` commands in order to determine\
    \ whether or not to print a line of text.\n\nThe fourth section illustrates how\
    \ to “split” a text string that contains multiple “.” characters as a delimiter,\
    \ followed by examples of `awk` to perform numeric calculations (such as addition,\
    \ subtraction, multiplication, and division) in files containing numeric data.\
    \ This section also shows you various numeric functions that are available in\
    \ `awk,` and also how to print text in a fixed set of columns.\n\nThe fifth section\
    \ explains how to align columns in a dataset and also how to align and merge columns\
    \ in a dataset. You will see how to delete columns, how to select a subset of\
    \ columns from a dataset, and how to work with multiline records in datasets.\
    \ This section contains some one-line `awk` commands that can be useful for manipulating\
    \ the contents of datasets.\n\nThe final section of this chapter has a pair of\
    \ use cases involving nested quotes and date formats in structured data sets.\n\
    \n### **The `awk` Command**\n\nThe `awk` (Aho, Weinberger, and Kernighan) command\
    \ has a C-like syntax, and you can use this utility to perform very complex operations\
    \ on numbers and text strings.\n\nAs a side comment, there is also the `gawk`\
    \ command which is GNU `awk,` as well as the `nawk` command which is “new” `awk`\
    \ (neither command is discussed in this book). One advantage of `nawk` is that\
    \ it allows you to set externally the value of an internal variable.\n\n#### **Built-In\
    \ Variables That Control `awk`**\n\nThe `awk` command provides variables that\
    \ you can change from their default values in order to control how `awk` performs\
    \ operations. Examples of such variables (and their default values) include: `FS\
    \ (\" \")`, `RS (\"\\n\"), OFS (\" \")`, `ORS (\"\\n\"), SUBSEP,` and `IGNORECASE.`\
    \ The variables `FS` and `RS` specify the field separator and record separator,\
    \ whereas the variables `OFS` and `ORS` specify the output field separator and\
    \ the output record separator, respectively."
