    \      *        four*           *          *\none         *         two*     \
    \ three*      four*\nfive        *         six*           *          *\none  \
    \       *         two*      three*          *\nfour        *        five*    \
    \       *          *\n```\n\nKeep in mind that `printf` is reasonably powerful\
    \ and as such has its own syntax, which is beyond the scope of this chapter. A\
    \ search online can find the manual pages and also discussions of “how to do X\
    \ with printf().”\n\n### **Conditional Logic and Control Statements**\n\nLike\
