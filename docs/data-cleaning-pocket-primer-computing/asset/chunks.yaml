  trans: "\n\nListing 2.11 包含带有条件逻辑的 `factorial()` 函数：如果第一个参数大于 1，则变量 `decr` 初始化为\
    \ `$1` 的值减 1，然后通过递归调用带有参数 `decr` 的 `factorial()` 函数来初始化 `result`。最后，此代码块将 `product`\
    \ 初始化为 `$1` 的值乘以 `result` 的值。注意，如果第一个参数不大于 1，则返回值 1。\n\nListing 2.11 的最后部分提示用户输入一个数字，然后计算并显示该数字的阶乘。为了简单起见，没有检查非整数值（你可以尝试自己添加该功能）。\n\
    \n## 阶乘值的迭代解\n\nListing 2.12 显示了 `Factorial2.sh` 的内容，它使用 `for` 循环计算正整数的阶乘。\n\n\
    ### LISTING 2.12 Factorial2.sh\n\n```\n#!/bin/bash\n\nfactorial()\n{\n   num=$1\n\
    \   result=1\n   for (( i=2; i<=${num}; i++ ));\n   do\n     result=$((${result}*$i))\n\
    \   done\n\n   echo $result\n}\n\nprintf \"Enter a number: \"\nread num\n\necho\
    \ \"$num! = `factorial $num`\"\n```\n\nListing 2.12 包含一个名为 `factorial()` 的函数，它将变量\
    \ `num` 初始化为传递给函数 `factorial()` 的第一个参数，随后初始化变量 `result` 为 1。Listing 2.12 的下一部分是一个\
    \ `for` 循环，迭代地将 `result` 的值与 2 到 `num` 之间的数字相乘，然后返回变量 `result` 的值。\n\nListing\
    \ 2.12 的最后部分提示用户输入一个数字，然后使用命令替换用用户提供调用函数 `factorial()`。注意，没有进行验证以确保输入值为非负整数。`echo`\
    \ 语句显示计算出的阶乘值。\n\nListing 2.13 显示了 `Factorial3.sh` 的内容，它使用 `for` 循环和一个用于跟踪中间阶乘值的数组来计算正整数的阶乘。\n\
    \n### LISTING 2.13 Factorial3.sh\n\n```\n#!/bin/bash\n\nfactorial()\n{\n   num=$1\n\
    \   result=1\n   for (( i=2; i<=${num}; i++ ));\n   do\n     result=$((${result}*$i))\n\
    \     factvalues[$i]=$result\n   done\n}\n\nprintf \"Enter a number: \"\nread\
    \ num\n\nfor (( i=1; i<=${num}; i++ ));\ndo\n  factvalues[$i]=1\ndone\n\nfactorial\
    \ $num\n\n# 通过循环打印每个元素：\nfor (( i=1; i<=${num}; i++ ));\ndo\n  echo \"Factorial\
    \ of $i : \" ${factvalues[$i]}\ndone\n```\n\nListing 2.13 与 Listing 2.12 中的代码非常相似：主要区别在于中间阶乘值存储在数组\
    \ `factvalues` 中。注意初始化 `factvalues:` 中值的初始循环，这样做使得这些值变为全局变量，因此我们不需要从 `factorial()`\
    \ 函数中返回任何内容。\n\nListing 2.13 的最后部分包含一个 `for` 循环，显示中间阶乘值以及用户提供的输入的阶乘。\n\n## 总结\n\
    \n本章向你展示了如何使用一些有用且多功能的 `bash` 命令的示例。首先，你学习了 `join`、`fold`、`split`、`sort` 和 `uniq`\
    \ 等 bash 命令。接下来，你学习了 `find` 命令和 `xargs` 命令。你还学习了使用 `tr` 命令的各种方法，它在本章的用例中也有涉及。\n\
    \n然后，你看到了一些与压缩相关的命令，如 `cpio` 和 `tar`，它们帮助你创建新的压缩文件，并帮助你检查压缩文件的内容。\n\n此外，你学习了如何提取数据的列范围，以及\
    \ `IFS` 选项的用处。最后，你看到了一个通过递归计算数字阶乘值的 `bash` 脚本示例。\n\n## 第 3 章\n\n## 使用 grep 过滤数据\n\
    \n本章向你介绍了功能强大的 `grep` 命令，其目的是获取一个文本数据流并将其简化为你感兴趣的部分。`grep` 命令单独使用很有用，与其他命令结合使用同样有用，特别是结合\
    \ `find` 命令。本章包含许多短代码示例，说明了 `grep` 命令的不同选项。某些代码示例演示了如何将 `grep` 命令与之前章节中的命令结合。\n\
    \n本章的第一部分介绍了孤立使用的 `grep` 命令，并结合了正则表达式元字符（来自第 1 章），还附带了如何将 `grep` 命令与之前章节的命令结合的代码片段。（注：原文此处有重复表述）。\n\
    \n"
