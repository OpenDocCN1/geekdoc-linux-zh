  trans: "\n\n```bash\n # NF 是当前记录中的字段数。\n\n# NR 是当前记录/行的数。\n\n#（不是文件中的记录数）。\n\n#\
    \ 在 END 块中（或文件的最后一行中）\n\n# 它是文件的行数。\n# R 语言解决方案：https://gist.github.com/dsparks/3693115\n\
    \necho \"Main diagonal:\"\n\nawk -F\",\" '{ for (i=0; i<=NF; i++) if (NR >= 1\
    \ && NR == i)\nprint $(i) }' diagonal.csv\n\necho \"Off diagonal:\"\n\nawk -F\"\
    ,\" '{print $(NF+1-NR)}' diagonal.csv\n\necho \"Main diagonal sum:\"\n\nawk -F\"\
    ,\" '\n\nBEGIN { sum = 0 }\n\n{\n\n   for (i=0; i<=NF; i++) { if (NR >= 1 && NR\
    \ == i) { sum += $i\n}  }\n\n}\n\nEND { printf (\"sum = %s\\n\",sum) }\n\n' diagonal.csv\n\
    \necho \"Off diagonal sum:\"\n\nawk -F\",\" '\n\nBEGIN { sum = 0 }\n\n{\n  for\
    \ (i=0; i<=NF; i++) { if(NR >= 1 && i+NR == NF+1) { sum += $i; } }\n\n}\n\nEND\
    \ { printf (\"sum = %s\\n\",sum) }\n\n' diagonal.csv\n```\n\nListing A.23 以一个\
    \ `awk` 命令开始，该命令包含一个匹配数据集中“对角”元素的循环，即第一条记录的第一个字段，第二个记录的第二个字段，第三条记录的第三字段，以此此类推。此匹配过程由\
    \ `for` 循环内部的条件逻辑处理。\n\nListing A.23 的第二部分包含一个 `awk` 命令，它使用一个简单的 print 语句打印数据集中的非对角线元素。\n\
    \nListing A.23 的第三部分包含一个 `awk` 命令，其逻辑与第一个 `awk` 命令相同，并计算对角线元素的累加和。\n\nListing\
    \ A.23 的第四部分包含一个 `awk` 命令，其逻辑与第一个 `awk` 命令相似，但有以下变化：\n\n```\n if(NR >= 1 && i+NR\
    \ == NF+1)\n```\n\n前面的逻辑使我们能够计算非对角线元素的累加和。运行 Listing A.23 的输出如下：\n\n```\n Main\
    \ diagonal:\n\n1\n\n4\n\n1\n\n2\n\n7\n\nOff diagonal:\n\n1\n\n2\n\n1\n\n4\n\n\
    1\n\nMain diagonal sum:\n\nsum = 15 Off diagonal sum:\n\nsum = 9\n```\n\nListing\
    \ A.24、Listing A.25 和 Listing A.26 显示了数据集 `rain1.csv`、`rain2.csv` 和 `rain3.csv.txt`\
    \ 的内容，这些数据集被在本节的多个 shell 脚本引用。\n\n### Listing A.24: rain1.csv\n\n```\n 1,0.10,53,15\n\
    2,0.12,54,16\n3,0.19,65,10\n4,0.25,86,23\n5,0.18,57,17\n6,0.23,79,34\n7,0.34,66,21\n\
    ```\n\n### Listing A.25: rain2.csv\n\n```\n 1,0.00,63,24\n2,0.02,64,25\n3,0.09,75,19\n\
    4,0.15,66,28\n5,0.08,67,36\n6,0.13,79,23\n7,0.24,68,25\n```\n\n### Listing A.26:\
    \ rain3.csv\n\n```\n 1,1.00,83,34\n2,0.02,84,35\n3,1.09,75,19\n4,0.15,86,38\n\
    5,1.08,87,36\n6,0.13,79,33\n7,0.24,88,45\n```\n\n### 来自多个数据集的数值 (1)\n\nListing\
    \ A.27 显示了 shell 脚本 `rainfall1.sh` 的内容，该脚本将多个 CSV 文件对应字段中的数字相并显示结果。\n\n### Listing\
    \ A.27: rainfall1.sh\n\n```bash\n # => 计算多个文件的列平均值\n#columns in rain.csv:\n#DOW,inches\
    \ of rain, degrees F, humidity (%)\n#files: rain1.csv, rain2.csv, rain3.csv\n\
    echo \"FILENAMES:\"\nls rain?.csv\nawk -F',' '\n{\n  inches+=$2\n  degrees+=$3\n\
    \  humidity+=$4\n}\nEND {\n  printf(\"FILENAME: %s\\n\", FILENAME)\n  printf(\"\
    inches: %.2f\\n\", inches/7)\n  printf(\"degrees: %.2f\\n\", degrees/7)\n  printf(\"\
    humidity: %.2f\\n\", humidity/7)\n}\n' rain?.csv\n```\n\nListing A.27 计算了 `rain?.csv`\
    \ 指定数据集中三列（即降雨量、华氏温度和湿度）的数字之和，在本例中，它由数据集 `rain1.csv`、`rain2.csv` 和 `rain3.csv`\
    \ 组成。因此，Listing A.27 可以处理多个数据集（`rain1.csv` 到 `rain3.csv`）。你可以通过以下表达式扩展此示例，以处理任何以\
    \ `rain` 字符串开头并以 `csv` 后缀结尾的数据集：\n\n```\nrain*.csv\n```\n\n运行 Listing A.27 的输出如下：\n\
    \n```\n FILENAMES:\nrain1.csv   rain2.csv   rain3.csv\ninches: 0.83\ndegrees:\
