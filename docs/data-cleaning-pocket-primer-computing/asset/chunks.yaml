    \ lines.txt\n```\n\n### **Useful Options for the `grep` Command**\n\nThere are\
    \ many types of pattern matching possibilities with the `grep` command, and this\
    \ section contains an eclectic mix of such commands that handle common scenarios.\n\
    \nIn the following examples we have four text files (two .sh and two .txt) and\
    \ two Word documents in a directory. The string `abc` is found on one line in\
    \ `abc1.txt` and three lines in `abc3.sh.` The string `ABC` is found on 2 lines\
