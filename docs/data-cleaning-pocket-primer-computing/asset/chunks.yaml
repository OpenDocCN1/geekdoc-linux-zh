    \ `grep` Command**\n\nThis section shows you how to combine the `grep` and `cut`\
    \ commands in order to keep track of a small database of customers, their purchases,\
    \ and the details of their purchases that are stored in three text files.\n\n\
    Keep in mind that there are many open source toolkits available that can greatly\
    \ facilitate working with relational data and non-relational data. Those toolkits\
    \ can be very robust and also minimize the amount of coding that is required.\n\
    \nMoreover, you can use the `join` command (discussed in [Chapter 2](#chap2.xhtml))\
    \ to perform SQL-like operations on datasets. Nevertheless, the real purpose of\
    \ this section is to illustrate some techniques with `grep` that might be useful\
    \ in your own shell scripts.\n\n[Listing A.11](#appendix.xhtml_liA-11) displays\
    \ the contents of the `MasterOrders.txt` text file.\n\n##### ***LISTING A.11:\
    \ MasterOrders.txt***\n\n```\n M10000 C1000 12/15/2012\n\nM11000 C2000 12/15/2012\n\
    \nM12000 C3000 12/15/2012 \n```\n\n[Listing A.12](#appendix.xhtml_liA-12) displays\
    \ the contents of the `Customers.txt` text file.\n\n##### ***LISTING A.12: Customers.txt***\n\
    \n```\n C1000 John Smith LosAltos California 94002\n\nC2000 Jane Davis MountainView\
    \ California 94043\n\nC3000 Billy Jones HalfMoonBay California 94040 \n```\n\n\
    [Listing A.13](#appendix.xhtml_liA-13) displays the contents of the `PurchaseOrders.txt`\
    \ text file.\n\n##### ***LISTING A.13: PurchaseOrders.txt***\n\n```\n C1000,\"\
    Radio\",54.99,2,\"01/22/2013\"\n\nC1000,\"DVD\",15.99,5,\"01/25/2013\"\n\nC2000,\"\
    Laptop\",650.00,1,\"01/24/2013\"\n\nC3000,\"CellPhone\",150.00,2,\"01/28/2013\"\
    \ \n```\n\n[Listing A.14](#appendix.xhtml_liA-14) displays the contents of the\
    \ `MasterOrders.sh` bash script.\n\n##### ***LISTING A.14: MasterOrders.sh***\n\
    \n```\n # initialize variables for the three main files\n\nMasterOrders=\"MasterOrders.txt\"\
    \n\nCustomerDetails=\"Customers.txt\"\n\nPurchaseOrders=\"PurchaseOrders.txt\"\
    \n\n# iterate through the \"master table\"\n\nfor mastCustId in `cat $MasterOrders\
    \ | cut -d\" \" -f2`\n\ndo\n\n  # get the customer information\n\n  custDetails=`grep\
    \ $mastCustId $CustomerDetails`\n\n  # get the id from the previous line\n\n \
    \ custDetailsId=`echo $custDetails | cut -d\" \" -f1`\n\n  # get the customer\
    \ PO from the PO file\n\n  custPO=`grep $custDetailsId $PurchaseOrders`\n\n  #\
    \ print the details of the customer\n\n  echo \"Customer $mastCustId:\"\n\n  echo\
    \ \"Customer Details: $custDetails\"\n\n  echo \"Purchase Orders: $custPO\"\n\n\
    \  echo \"----------------------\"\n\n  echo\n\ndone\n```\n\n[Listing A.14](#appendix.xhtml_liA-14)\
    \ initializes some variables for orders, details, and purchase-related datasets.\
    \ The next portion of [Listing A.14](#appendix.xhtml_liA-14) contains a `for`\
    \ loop that iterates through the id values in the `MasterOrders.txt` file and\
    \ uses each `id` to find the corresponding row in the `Customers.txt` file as\
    \ well as the corresponding row in the `PurchaseOrders.txt` file. Finally, the\
    \ bottom of the loop displays the details of the information that were retrieved\
    \ from the initial portion of the `for` loop. The output from [Listing A.14](#appendix.xhtml_liA-14)\
    \ is here:\n\n```\n Customer C1000:\n\nCustomer Details: C1000 John Smith LosAltos\
    \ California 94002\n\nPurchase Orders: C1000,\"Radio\",54.99,2,\"01/22/2013\"\n\
    \nC1000,\"DVD\",15.99,5,\"01/25/2013\"\n\n----------------------\n\nCustomer C2000:\n\
    \nCustomer Details: C2000 Jane Davis MountainView California\n94043\n\nPurchase\
    \ Orders: C2000,\"Laptop\",650.00,1,\"01/24/2013\"\n\n----------------------\n\
    \nCustomer C3000:\n\nCustomer Details: C3000 Billy Jones HalfMoonBay California\n\
    94040\n\nPurchase Orders: C3000,\"CellPhone\",150.00,2,\"01/28/2013\"\n\n----------------------\n\
    ```\n\n### **Checking Updates in a Logfile**\n\n[Listing A.15](#appendix.xhtml_liA-15)\
    \ displays the contents of `CheckLogUpdates.sh` that illustrates how to periodically\
    \ check the last line in a log file to determine the status of a system. This\
    \ shell script simulates the status of a system by appending a new row that is\
    \ based on the current timestamp. The shell script sleeps for a specified number\
    \ of seconds, and on the third iteration the script appends a row with an error\
    \ status in order to simulate an error. In the case of a shell script that is\
    \ monitoring a live system, the error code is obviously generated outside the\
    \ shell script.\n\n##### ***LISTING A.15: CheckLogUpdates.sh***"
