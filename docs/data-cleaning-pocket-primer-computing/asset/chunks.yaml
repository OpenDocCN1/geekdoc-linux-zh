  trans: "\n\n```\nawk ' $2 == 300 { print $1, $3 }' products.txt\n```\n\n上述代码段的输出如下：\n\
    \n```\nTablet new\nTablet used\n```\n\n以下代码段打印 `products.txt` 中以字符串 `Tablet:`\
    \ 开头的文本行的第一列和第三列：\n\n```\nawk '/^Tablet/ { print $1, $3 }' products.txt\n```\n\
    \n上述代码段的输出如下：\n\n```\nTablet new\nTablet used\n```\n\n### 使用 `awk` 分割文件名\n\n列表\
    \ 5.18 显示了 `SplitFilename2.sh,` 的内容，它阐明了如何分割一个包含`.` 字符的文件名，以便增加文件名中某个组件的数值。请注意，此代码仅适用于完全预期语法的文件名。你可以编写更复杂的代码来计算段数，或者简单地说“更改\
    \ `.zip` 之前的字段”，这只需要文件名的格式匹配最后两个部分（`<anystructure>.number.zip`）。\n\n#### 列表 5.18\
    \ SplitFilename2.sh\n\n```\necho \"05.20.144q.az.1.zip\" | awk -F\".\" '\n{\n\
    \  f5=$5 + 1\n  printf(\"%s.%s.%s.%s.%s.%s\",$1,$2,$3,$4,f5,$6)\n}'\n```\n\n列表\
    \ 5.18 的输出如下：\n\n```\n05.20.144q.az.2.zip\n```\n\n#### 使用后置算术运算符操作\n\n列表 5.19\
    \ 显示了 `mixednumbers.txt` 的内容，该文件包含后置运算符，这意味着负号（和/或正号）出现在列值的末尾，而不是数字的开头。\n\n####\
    \ 列表 5.19 mixednumbers.txt\n\n```\n324.000-|10|983.000-\n453.000-|30|298.000-\n\
    783.000-|20|347.000-\n```\n\n列表 5.20 显示了 `AddSubtract1.sh,` 的内容，它说明了如何对列表 5.19\
    \ 中的数字行求加。\n\n#### 列表 5.20 AddSubtract1.sh\n\n```\nmyFile=\"mixednumbers.txt\"\
    \nawk -F\"|\" '\nBEGIN { line = 0; total = 0 }\n{\n   split($1, arr, \"-\")\n\
    \   f1 = arr[1]\n   if($1 ~ /-/) { f1 = -f1 }\n   line += f1\n\n   split($2, arr,\
    \ \"-\")\n   f2 = arr[1]\n   if($2 ~ /-/) { f2 = -f2 }\n   line += f2\n\n   split($3,\
    \ arr, \"-\")\n   f3 = arr[1]\n   if($3 ~ /-/) { f3 = -f3 }\n   line += f3\n\n\
    \   printf(\"f1: %d f2: %d f3: %d line: %d\\n\",f1,f2,f3, line)\n   total += line\n\
    \   line = 0\n}\nEND { print \"Total: \",total }\n' $myfile\n```\n\n列表 5.20 的输出如下。在阅读后续的解释之前，尝试推导出这段代码在做什么：\n\
    \n```\nf1: -324 f2: 10 f3: -983 line: -1297\nf1: -453 f2: 30 f3: -298 line: -721\n\
    f1: -783 f2: 20 f3: -347 line: -1110\nTotal:  -3128\n```\n\n该代码假设我们知道文件的格式。对于给定记录中的每个字段，`split`\
    \ 函数返回一个长度为二的向量，其中第一个位置是数字，第二个位置为空值或破折号，之后第一个位置的数字被“捕获”到一个变量中。`if` 语句仅检查原始字段是否包含破折号。如果字段包含破折号，则数值变量变为负数，否则保持原样。然后它对行进行累加。\n\
    \n### `awk` 中的数值函数\n\n`int(x)` 函数返回数字的整数部分。如果该数字不是整数，它将处于两个整数之间。在这两个可能的整数中，函数将返回靠近零的那一个。这与四舍五入函数不同，后者选择更接近的整数。\n\
    \n例如，`int(3)` 是 3，`int(3.9)` 是 3，`int(-3.9)` 是 -3，`int(-3)` 也是 -3。这里是 `awk` 命令中\
    \ `int(x)` 函数的一个示例：\n\n```\nawk 'BEGIN {\n   print int(3)\n   print int(3.9)\n\
    \   print int(-3.9)\n   print int(-3)\n}'\n```\n\n### 单行 `awk` 命令\n\n本节代码引用了文本文件\
    \ `short1.txt,`，你可以为其填充任意数据。\n\n以下代码段打印每行并在前面加上该行的字段数：\n\n```\nawk '{print NF\
    \ \":\" $0}' short1.txt\n```\n\n打印每行的最右侧字段：\n\n```\nawk '{print $NF}' short1.txt\n\
    ```\n\n打印包含超过 2 个字段的行：\n\n```\nawk '{if(NF > 2) print }' short1.txt\n```\n\n如果当前行包含超过\
    \ 2 个字段，则打印最右侧字段的值：\n\n```\nawk '{if(NF > 2) print $NF }' short1.txt\n```\n\n"
- fmt: "\nAs you can see from the preceding code snippets, it’s easy to extract information\
    \ or subsets of rows and columns from text files using simple conditional logic\
    \ and built-in variables in the `awk` command.\n\n## Useful Short `awk` Scripts\n\
    \nThis section contains a set of short `awk` -based scripts for performing various\
    \ operations. Some of these scripts can also be used in other shell scripts to\
    \ perform more complex operations. [Listing 5.21](#chap5.xhtml_li5-21) displays\
    \ the contents of the file `data.txt`, which is used in various code samples in\
    \ this section.\n\n### LIST 5.21 data.txt\n\n```\n this is line one that contains\
    \ more than 40 characters\nthis is line two\nthis is line three that also contains\
    \ more than 40 characters\nfour\nthis is line six and the preceding line is empty\n\
    line eight and the preceding line is also empty\n```\n\nThe following code snippet\
    \ prints every line that is longer than 40 characters:\n\n```\n awk 'length($0)\
    \ > 40' data.txt\n```\n\nNow print the length of the longest line in `data.txt`:\n\
    \n```\n awk '{ if (x < length()) x = length() }\nEND { print \"maximum line length\
    \ is \" x }' < data.txt\n```\n\nThe input is processed by the `expand` utility\
    \ to change tabs into spaces, so the widths compared are actually the right-margin\
    \ columns.\n\nPrint every line that has at least one field:\n\n```\n awk 'NF >\
    \ 0' data.txt\n```\n\nThe preceding code snippet illustrates an easy way to delete\
    \ blank lines from a file (or rather, to create a new file similar to the old\
    \ file but from which the blank lines have been removed).\n\nPrint seven random\
    \ numbers from 0 to 100, inclusive:\n\n```\n awk 'BEGIN { for (i = 1; i <= 7;\
    \ i++)\nprint int(101 * rand()) }'\n```\n\nCount the lines in a file:\n\n```\n\
    \ awk 'END { print NR }' < data.txt\n```\n\nPrint the even-numbered lines in the\
    \ data file:\n\n```\n awk 'NR % 2 == 0' data.txt\n```\n\nIf you use the expression\
    \ `'NR % 2 == 1'` in the previous code snippet, the program would print the odd-numbered\
    \ lines.\n\nInsert a duplicate of every line in a text file:\n\n```\n awk '{print\
    \ $0, '\\n', $0}' < data.txt\n```\n\nInsert a duplicate of every line in a text\
    \ file and also remove blank lines:\n\n```\n awk '{print $0, \"\\n\", $0}' < data.txt\
    \ | awk 'NF > 0'\n```\n\nInsert a blank line after every line in a text file:\n\
    \n```\n awk '{print $0, \"\\n\"}' < data.txt\n```\n\n## Printing the Words in\
    \ a Text String in awk\n\n[Listing 5.22](#chap5.xhtml_li5-22) displays the contents\
    \ of `Fields2.sh,` which illustrates how to print the words in a text string using\
    \ the `awk` command.\n\n### LIST 5.22 Fields2.sh\n\n```\n echo \"a b c d e\"|\
    \ awk '\n{\n  for(i=1; i<=NF; i++) {\n     print \"Field \",i,\":$i\n}\n}\n'\n\
    ```\n\nThe output from [Listing 5.22](#chap5.xhtml_li5-22) is here:\n\n```\n Field\
    \  1 : a\nField  2 : b\nField  3 : c\nField  4 : d\nField  5 : e\n```\n\n## Count\
    \ Occurrences of a String in Specific Rows\n\n[Listing 5.23](#chap5.xhtml_li5-23)\
    \ and [Listing 5.24](#chap5.xhtml_li5-24) display the contents of `data1.csv`\
    \ and `data2.csv,` respectively, and [Listing 5.25](#chap5.xhtml_li5-25) displays\
    \ the contents of `checkrows.sh,` which illustrates how to count the number of\
    \ occurrences of the string “past” in column 3 in rows 2, 5, and 7.\n\n### LIST\
    \ 5.23 data1.csv\n\n```\n in,the,past,or,the,present\nfor,the,past,or,the,present\n\
    in,the,past,or,the,present\nfor,the,paste,or,the,future\nin,the,past,or,the,present\n\
    completely,unrelated,line1\nin,the,past,or,the,present\ncompletely,unrelated,line2\n\
    ```\n\n### LIST 5.24 data2.csv\n\n```\n in,the,past,or,the,present\ncompletely,unrelated,line1\n\
    for,the,past,or,the,present\ncompletely,unrelated,line2\nfor,the,paste,or,the,future\n\
    in,the,past,or,the,present\nin,the,past,or,the,present\ncompletely,unrelated,line3\n\
    ```\n\n### LIST 5.25 checkrows.sh\n\n```\n files=\"`ls data*.csv| tr '\\n' ' '`\"\
    \necho \"List of files: $files\"\nawk -F\",\" '\n( FNR==2 || FNR==5 || FNR==7\
    \ ) {\n    if ( $3 ~ \"past\" ) { count++ }\n}\nEND {\n    printf \"past: %d times\
    \ (INACT) \", count\n    printf \"in field 3 in lines 2/5/7\\n}' data*.csv\n```\n\
    \n[Listing 5.25](#chap5.xhtml_li5-25) looks for occurrences in the string `past`\
    \ in columns 2, 5, and 7 because of the following code snippet:\n\n```\n ( FNR==2\
    \ || FNR==5 || FNR==7 ) {\n    if ( $3 ~ \"past\" ) { count++ }\n}\n```\n\nIf\
    \ a match occurs, then the value of `count` is incremented. The `END` block reports\
    \ the number of times the string past was found in columns 2, 5, and 7. Note that\
    \ strings such as `paste` and `pasted` will match the string `past`. The output\
    \ from [Listing 5.25](#chap5.xhtml_li5-25) is here:\n\n```\n List of files: data1.csv\
    \ data2.csv\npast: matched 5 times (INACT) in field 3 in lines 2/5/7\n```\n\n\
    The shell script `checkrows2.sh` replaces the term `$3 ~ \"past\"` with the term\
    \ `$3 == \"past\"` in `checkrows.sh` in order to check for exact matches, which\
    \ produces the following output:\n\n```\n List of files: data1.csv data2.csv\n\
    past: matched 4 times (EXACT) in field 3 in lines 2/5/7\n```\n\n## Printing a\
    \ String in a Fixed Number of Columns\n\n[Listing 5.26](#chap5.xhtml_li5-26) displays\
    \ the contents of `FixedCount1.sh,` which illustrates how to print the words in\
    \ a text string using the `awk` command.\n\n### LIST 5.26 FixedCount1.sh\n\n```\n\
    \ echo \"aa cc dd ee gg hh\"| awk '\nBEGIN { colCount = 3 }\n{\n  for(i=1; i<=NF;\
    \ i++) {\n     printf(\"%s \", $i)\n     if(i % colCount == 0) {\n        print\
    \ \" \"\n      }\n  }\n}'\n```\n\nThe output from [Listing 5.26](#chap5.xhtml_li5-26)\
    \ is here:\n\n```\n aa cc\ndd ee\ngg hh\n```\n\n## Printing a Dataset in a Fixed\
    \ Number of Columns\n\n[Listing 5.27](#chap5.xhtml_li5-27) displays the contents\
    \ of `VariableColumns.txt` with lines of text that contain a different number\
    \ of columns.\n\n### LIST 5.27 VariableColumns.txt\n\n```\n this is line one\n\
    this is line number one\nthis is the third and final line\n```\n\n[Listing 5.28](#chap5.xhtml_li5-28)\
    \ displays the contents of `Fields3.sh,` which illustrates how to print the words\
    \ in a text string using the `awk` command.\n\n### LIST 5.28 Fields3.sh\n\n```\n\
    \ awk '{printf(\"%s \", $0)} | awk '\nBEGIN { columnCount = 3 }\n{\n  for(i=1;\
    \ i<=NF; i++) {\n     printf(\"%s \", $i)\n     if( i % columnCount == 0 )\n \
    \      print \" \"\n  }\n}' VariableColumns.txt\n```\n\nThe output from [Listing\
    \ 5.28](#chap5.xhtml_li5-28) is here:\n\n```\n this is line\none this is\nline\
    \ number one\nthis is the\nthird and final\nline\n```\n\n## Aligning Columns in\
    \ Datasets\n\nIf you have read the preceding two examples, the code sample in\
    \ this section is easy to understand: you will see how to realign columns of data\
    \ that are correct in terms of their content, but have been placed in different\
    \ rows (and therefore are misaligned). [Listing 5.29](#chap5.xhtml_li5-29) displays\
    \ the contents of `mixed-data.csv` with misaligned data values. In addition, the\
    \ first line and final line in [Listing 5.28](#chap5.xhtml_li5-28) are empty lines,\
    \ which will be removed by the shell script in this section.\n\n### LIST 5.29\
    \ mixed-data.csv\n\n```\n Sara, Jones, 1000, CA, Sally, Smith, 2000, IL,\nDave,\
    \ Jones, 3000, FL, John, Jones,\n4000, CA,\nDave, Jones, 5000, NY, Mike,\nJones,\
    \ 6000, NY, Tony, Jones, 7000, WA\n```\n\n[Listing 5.30](#chap5.xhtml_li5-30)\
    \ displays the contents of `mixed-data.sh,` which illustrates how to realign the\
    \ dataset in [Listing 5.29](#chap5.xhtml_li5-29).\n\n### LIST 5.30 mixed-data.sh\n\
    \n```\n #-----------------------------------------\n# 1) remove blank lines\n\
    # 2) remove line feeds\n# 3) print a LF after every fourth field\n# 4) remove\
    \ trailing ',' from each row\n#-----------------------------------------\ninputfile=\"\
    mixed-data.csv\"\ngrep -v \"^$\" $inputfile |awk -F\",\" '{printf(\"%s\",$0)}'\
    \ | awk '\nBEGIN { columnCount = 4 }\n{\n   for(i=1; i<=NF; i++) {\n     printf(\"\
    %s \", $i)\n     if( i % columnCount == 0) { print \"\" }\n   }\n}' > temp-columns\n\
    # 4) remove trailing ',' from output:\ncat temp-columns | sed 's/, $//' | sed\
    \ 's/ $//' > $outputfile\n```\n"
  raw: "As you can see from the preceding code snippets, it’s easy to extract information\
    \ or subsets of rows and columns from text files using simple conditional logic\
    \ and built-in variables in the `awk` command.\n\n### **Useful Short `awk` Scripts**\n\
    \nThis section contains a set of short `awk` -based scripts for performing various\
    \ operations. Some of these scripts can also be used in other shell scripts to\
    \ perform more complex operations. [Listing 5.21](#chap5.xhtml_li5-21) displays\
    \ the contents of the file `data.txt`, which is used in various code samples in\
    \ this section.\n\n##### ***LISTING 5.21 data.txt***\n\n```\n this is line one\
    \ that contains more than 40 characters\nthis is line two\nthis is line three\
    \ that also contains more than 40 characters\nfour\nthis is line six and the preceding\
    \ line is empty\nline eight and the preceding line is also empty\n```\n\nThe following\
    \ code snippet prints every line that is longer than 40 characters:\n\n```\n awk\
    \ 'length($0) > 40' data.txt\n```\n\nNow print the length of the longest line\
    \ in `data.txt:`\n\n```\n awk '{ if (x < length()) x = length() }\nEND { print\
    \ \"maximum line length is \" x }' < data.txt\n```\n\nThe input is processed by\
    \ the expand utility to change tabs into spaces, so the widths compared are actually\
    \ the right-margin columns.\n\nPrint every line that has at least one field:\n\
    \n```\n awk 'NF > 0' data.txt\n```\n\nThe preceding code snippet illustrates an\
    \ easy way to delete blank lines from a file (or rather, to create a new file\
    \ similar to the old file but from which the blank lines have been removed).\n\
    \nPrint seven random numbers from 0 to 100, inclusive:\n\n```\n awk 'BEGIN { for\
    \ (i = 1; i <= 7; i++)\nprint int(101 * rand()) }'\n```\n\nCount the lines in\
    \ a file:\n\n```\n awk 'END { print NR }' < data.txt\n```\n\nPrint the even-numbered\
    \ lines in the data file:\n\n```\n awk 'NR % 2 == 0' data.txt\n```\n\nIf you use\
    \ the expression `'NR % 2 == 1'` in the previous code snippet, the program would\
    \ print the odd-numbered lines.\n\nInsert a duplicate of every line in a text\
    \ file:\n\n```\n awk '{print $0, '\\n', $0}' < data.txt\n```\n\nInsert a duplicate\
    \ of every line in a text file and also remove blank lines:\n\n```\n awk '{print\
    \ $0, \"\\n\", $0}' < data.txt | awk 'NF > 0'\n```\n\nInsert a blank line after\
    \ every line in a text file:\n\n```\n awk '{print $0, \"\\n\"}' < data.txt\n```\n\
    \n### **Printing the Words in a Text String in awk**\n\n[Listing 5.22](#chap5.xhtml_li5-22)\
    \ displays the contents of `Fields2.sh,` which illustrates how to print the words\
    \ in a text string using the `awk` command.\n\n##### ***LISTING 5.22 Fields2.sh***\n\
    \n```\n echo \"a b c d e\"| awk '\n{\n  for(i=1; i<=NF; i++) {\n     print \"\
    Field \",i,\":\",$i\n}\n}\n'\n```\n\nThe output from [Listing 5.22](#chap5.xhtml_li5-22)\
    \ is here:\n\n```\n Field  1 : a\nField  2 : b\nField  3 : c\nField  4 : d\nField\
    \  5 : e\n```\n\n### **Count Occurrences of a String in Specific Rows**\n\n[Listing\
    \ 5.23](#chap5.xhtml_li5-23) and [Listing 5.24](#chap5.xhtml_li5-24) display the\
    \ contents `data1.csv` and `data2.csv,` respectively, and [Listing 5.25](#chap5.xhtml_li5-25)\
    \ displays the contents of `checkrows.sh,` which illustrates how to count the\
    \ number of occurrences of the string “past” in column 3 in rows 2, 5, and 7.\n\
    \n##### ***LISTING 5.23 data1.csv***\n\n```\n in,the,past,or,the,present\nfor,the,past,or,the,present\n\
    in,the,past,or,the,present\nfor,the,paste,or,the,future\nin,the,past,or,the,present\n\
    completely,unrelated,line1\nin,the,past,or,the,present\ncompletely,unrelated,line2\n\
    ```\n\n##### ***LISTING 5.24 data2.csv***\n\n```\n in,the,past,or,the,present\n\
    completely,unrelated,line1\nfor,the,past,or,the,present\ncompletely,unrelated,line2\n\
    for,the,paste,or,the,future\nin,the,past,or,the,present\nin,the,past,or,the,present\n\
    completely,unrelated,line3\n```\n\n##### ***LISTING 5.25 checkrows.sh***\n\n```\n\
    \ files=\"`ls data*.csv| tr '\\n' ' '`\"\necho \"List of files: $files\"\nawk\
    \ -F\",\" '\n( FNR==2 || FNR==5 || FNR==7 ) {\n    if ( $3 ~ \"past\" ) { count++\
    \ }\n}\nEND {\n    printf \"past: matched %d times (INEXACT) \", count\n    printf\
    \ \"in field 3 in lines 2/5/7\\n\"\n}' data*.csv\n```\n\n[Listing 5.25](#chap5.xhtml_li5-25)\
    \ looks for occurrences in the string `past` in columns 2, 5, and 7 because of\
    \ the following code snippet:\n\n```\n ( FNR==2 || FNR==5 || FNR==7 ) {\n    if\
    \ ( $3 ~ \"past\" ) { count++ }\n}\n```\n\nIf a match occurs, then the value of\
    \ count is incremented. The `END` block reports the number of times that the string\
    \ past was found in columns 2, 5, and 7. Note that strings such as `paste` and\
    \ `pasted` will match the string past. The output from [Listing 5.25](#chap5.xhtml_li5-25)\
    \ is here:\n\n```\n List of files: data1.csv data2.csv\npast: matched 5 times\
    \ (INEXACT) in field 3 in lines 2/5/7\n```\n\nThe shell script `checkrows2.sh`\
    \ replaces the term `$3 ~ \"past\"` with the term `$3 == \"past\"` in `checkrows.sh`\
    \ in order to check for exact matches, which produces the following output:\n\n\
    ```\n List of files: data1.csv data2.csv\npast: matched 4 times (EXACT) in field\
    \ 3 in lines 2/5/7\n```\n\n### **Printing a String in a Fixed Number of Columns**\n\
    \n[Listing 5.26](#chap5.xhtml_li5-26) displays the contents of `FixedFieldCount1.sh,`\
    \ which illustrates how to print the words in a text string using the `awk` command.\n\
    \n##### ***LISTING 5.26 FixedFieldCount1.sh***\n\n```\n echo \"aa bb cc dd ee\
    \ ff gg hh\"| awk '\nBEGIN { colCount = 3 }\n{\n  for(i=1; i<=NF; i++) {\n   \
    \  printf(\"%s \", $i)\n     if(i % colCount == 0) {\n        print \" \"\n  \
    \    }\n  }\n}\n'\n```\n\nThe output from [Listing 5.26](#chap5.xhtml_li5-26)\
    \ is here:\n\n```\n aa bb cc\ndd ee ff\ngg hh\n```\n\n### **Printing a Dataset\
    \ in a Fixed Number of Columns**\n\n[Listing 5.27](#chap5.xhtml_li5-27) displays\
    \ the contents of `VariableColumns.txt` with lines of text that contain a different\
    \ number of columns.\n\n##### ***LISTING 5.27 VariableColumns.txt***\n\n```\n\
    \ this is line one\nthis is line number one\nthis is the third and final line\n\
    ```\n\n[Listing 5.28](#chap5.xhtml_li5-28) displays the contents of `Fields3.sh,`\
    \ which illustrates how to print the words in a text string using the `awk` command.\n\
    \n##### ***LISTING 5.28 Fields3.sh***\n\n```\n awk '{printf(\"%s \", $0)}' | awk\
    \ '\nBEGIN { columnCount = 3 }\n{\n  for(i=1; i<=NF; i++) {\n     printf(\"%s\
    \ \", $i)\n     if( i % columnCount == 0 )\n       print \" \"\n  }\n}\n' VariableColumns.txt\n\
    ```\n\nThe output from [Listing 5.28](#chap5.xhtml_li5-28) is here:\n\n```\n this\
    \ is line\none this is\nline number one\nthis is the\nthird and final\nline\n\
    ```\n\n### **Aligning Columns in Datasets**\n\nIf you have read the preceding\
    \ two examples, the code sample in this section is easy to understand: you will\
    \ see how to realign columns of data that are correct in terms of their content,\
    \ but have been placed in different rows (and therefore are misaligned). [Listing\
    \ 5.29](#chap5.xhtml_li5-29) displays the contents of `mixed-data.csv` with misaligned\
    \ data values. In addition, the first line and final line in [Listing 5.28](#chap5.xhtml_li5-28)\
    \ are empty lines, which will be removed by the shell script in this section.\n\
    \n##### ***LISTING 5.29 mixed-data.csv***\n\n```\n Sara, Jones, 1000, CA, Sally,\
    \ Smith, 2000, IL,\nDave, Jones, 3000, FL, John, Jones,\n4000, CA,\nDave, Jones,\
    \ 5000, NY, Mike,\nJones, 6000, NY, Tony, Jones, 7000, WA\n```\n\n[Listing 5.30](#chap5.xhtml_li5-30)\
    \ displays the contents of `mixed-data.sh,` which illustrates how to realign the\
    \ dataset in [Listing 5.29](#chap5.xhtml_li5-29).\n\n##### ***LISTING 5.30 mixed-data.sh***\n\
    \n```\n #-----------------------------------------\n# 1) remove blank lines\n\
    # 2) remove line feeds\n# 3) print a LF after every fourth field\n# 4) remove\
    \ trailing ',' from each row\n#-----------------------------------------\ninputfile=\"\
    mixed-data.csv\"\ngrep -v \"^$\" $inputfile |awk -F\",\" '{printf(\"%s\",$0)}'\
    \ | awk '\nBEGIN { columnCount = 4 }\n{\n   for(i=1; i<=NF; i++) {\n     printf(\"\
    %s \", $i)\n     if( i % columnCount == 0) { print \"\" }\n   }\n}' > temp-columns\n\
    # 4) remove trailing ',' from output:\ncat temp-columns | sed 's/, $//' | sed\
    \ 's/ $//' > $outputfile\n```"
