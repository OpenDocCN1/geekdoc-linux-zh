  trans: "\n\nListing 2.6 显示了数据集 `datacolumns1.txt` 的内容，Listing 2.7 显示了 脚本 `datacolumns1.sh`\
    \ 的内容，该脚本演示了如何从 Listing 2.6 数据集中的一系列列提取数据。\n\n##### 列表 2.6 datacolumns1.txt\n\n\
    ```\n #23456789012345678901234567890#\n  1000   Jane   Edwards\n  2000   Tom \
    \   Smith\n  3000   Dave   Del Ray\n```\n\n##### 列表 2.7 datacolumns1.sh\n\n```\n\
    \ # empid: 03-09\n# fname: 11-20\n# lname: 21-30\nIFS=''\ninputfile=\"datacolumns1.txt\"\
    \n\nwhile read line\ndo\n  pound=\"`echo $line |grep '^#'`\"\n\n  if [ x\"$pound\"\
    \ == x\"\" ]\n  then\n    echo \"line: $line\"\n    empid=`echo \"$line\" |cut\
    \ -c3-9`\n    echo \"empid: $empid\"\n\n    fname=`echo \"$line\" |cut -c11-19`\n\
    \    echo \"fname: $fname\"\n\n    lname=`echo \"$line\" |cut -c21-29`\n    echo\
    \ \"lname: $lname\"\n    echo \"--------------\"\n  fi\ndone < $inputfile\n```\n\
    \nListing 2.7 将 `IFS` 的值设置为空字符串，这是该脚本正常运行的所需的（尝试在不设置 `IFS` 的情况下运行此脚本看看会发生什么）。脚本体包含一个\
    \ `while` 循环，读取名为 `datacolumns1.txt` 的输入文件的每一行，如果行不以“#”字符开头，则将 `pound` 变量设置为“”；如果以“#”字符开头，则将\
    \ `pound` 变量设置为整行。这是一种根据行首字符来“过滤”行的简单技术。\n\n`if` 语句会对不以“#”字符开头的行执行，变量 `empid`、`fname`\
    \ 和 `lname` 分别初始化为第 3 到 9 列、第 11 到 19 列以及第 21 到 29 列的字符。这三个变量的值每次初始化时都会打印。如你所见，这些变量是通过\
    \ `echo` 命令和 `cut` 命令组合初始化的，并且需要 `IFS` 的值来确保 `echo` 命令不会移除空格。\n\nListing 2.7 的输出所示：\n\
    \n```\n line:   1000   Jane   Edwards\nempid: 1000\nfname: Jane\nlname: Edwards\n\
    --------------\nline:   2000   Tom    Smith\nempid: 2000\nfname: Tom\nlname: Smith\n\
    --------------\nline:   3000   Dave   Del Ray\nempid: 3000\nfname: Dave\nlname:\
    \ Del Ray\n--------------\n```\n\n#### 处理数据集中的不均齐行\n\nListing 2.8 显示了数据集 `uneven.txt`\
    \ 的内容，该包含包含不同列数的行。Listing 2.9 显示了 `bash` 脚本 `uneven.sh` 的内容，它演示了如何生成一个行具有相同列数的数据集。\n\
    \n##### 列表 2.8 uneven.txt\n\n```\n abc1 abc2 abc3 abc4\nabc5 abc6\nabc1 abc2 abc3\
    \ abc4\nabc5 abc6\n```\n\n##### 列表 2.9 uneven.sh\n\n```\n inputfile=\"uneven.txt\"\
    \noutputfile=\"even2.txt\"\n\n# ==> 每行四个字段\n\n#method #1: 每行四个字段\ncat $inputfile\
    \ | xargs -n 4 >$outputfile\n\n#method #2: 两个等行\n#xargs -L 2 <$inputfile > $outputfile\n\
    \necho \"input file:\"\ncat $inputfile\n\necho \"output file:\"\ncat $outputfile\n\
    ```\n\nListing 2.9 包含了两种重新对齐输入文件的技术，使输出每行以四列的形式显示。如你所见，两种技术都涉及 `xargs` 命令（这是 `xargs`\
    \ 命令的一种有趣用法）。\n\n运行 Listing 2.9 中的代码，你将看到以下输出：\n\n```\n abc1 abc2 abc3 abc4\n\
    abc5 abc6 abc1 abc2\nabc3 abc4 abc5 abc6\n```\n\n#### 在 Shell 脚本中使用函数\n\nShell\
    \ 函数可以通过使用 `function` 关键字来定义，后跟函数名（由你指定）和一对圆括号，然后是一对包含 shell 命令的大括号。其通用形式所示如下：\n\
    \n```\n function fname()\n{\n   statements;\n}\n```\n\n另一种定义 Shell 函数的方法所示：\n\n\
    ```\n fname()\n{\n   statements;\n}\n```\n\n可以通过其名称调用 Shell 函数：\n\n```\nfname()\n\
    ```\n\n参数可以传递给函数并由 shell 访问：\n\n```\narg1 arg2\n```\n\nListing 2.10 显示了 `checkuser.sh`\
    \ 的内容，它演示了如何提示用户姓和姓。\n\n##### 列表 2.10 checkuser.sh\n\n```bash\n#!/bin/bash\n\n\
    \ # empid: 03-09\n# fname: 11-20\n# lname: 21-30\nIFS=''\ninputfile=\"datacolumns1.txt\"\
    \n\nwhile read line\ndo\n  pound=\"`echo $line |grep '^#'`\"\n\n  if [ x\"$pound\"\
    \ == x\"\" ]\n  then\n    echo \"line: $line\"\n    empid=`echo \"$line\" |cut\
    \ -c3-9`\n    echo \"empid: $empid\"\n\n    fname=`echo \"$line\" |cut -c11-19`\n\
    \    echo \"fname: $fname\"\n\n    lname=`echo \"$line\" |cut -c21-29`\n    echo\
    \ \"lname: $lname\"\n    echo \"--------------\"\n  fi\ndone < $inputfile\n```\n\
    \nListing 2.10 将 `IFS` 的值设置为空字符串，这是该脚本正常运行的所需的（尝试在不设置 `IFS` 的情况下运行此脚本看看会发生什么）。脚本体包含一个\
    \ `while` 循环，读取名为 `datacolumns1.txt` 的输入文件的每一行，如果行不以“#”字符开头，则将 `pound` 变量设置为“”；如果以“#”字符开头，则将\
    \ `pound` 变量设置为整行。这是一种根据行首字符来“过滤”行的简单技术。\n\n`if` 语句会对不以“#”字符开头的行执行，变量 `empid`、`fname`\
    \ 和 `lname` 分别初始化为第 3 到 9 列、第 11 到 19 列以及第 21 到 29 列的字符。这三个变量的值每次初始化时都会打印。如你所见，这些变量是通过\
    \ `echo` 命令和 `cut` 命令组合初始化的，并且需要 `IFS` 的值来确保 `echo` 命令不会移除空格。\n\nListing 2.10\
