    此外，你可以在 `find` 命令中指定逻辑运算符，如 `AND` 以及 `OR`。你还可以指定开关（switch）来查找在特定日期之前（或之后）创建、访问或修改的文件（如果有）。


    以下是几个示例：


    `find . –print` 显示所有文件（包括子目录）


    `find . –print |grep "abc"` 显示所有名称包含字符串 `abc` 的文件。


    `find . –print |grep "sh$"` 显示所有名称以 `sh` 结尾的文件。


    `find . –depth 2 –print` 显示深度最多为 2 的所有文件（包括子目录）。


    你还可以指定与文件相关的访问时间。例如，`atime`、`ctime` 和 `mtime` 分别指文件的访问时间、创建时间和修改时间。


    作为另一个示例，以下命令找到所有在 2 天内修改过的文件，并打印每个文件的记录行数：


    ```

    $ find . –mtime -2 –exec wc –l {} ;

    ```


    你可以使用 `find` 命令删除一组文件。例如，你可以按照如下方式删除当前目录树中所有后缀为“m”的文件：


    ```

    find . –name "*m$" –print –exec rm {}

    ```


    #### 注意


    *删除文件时要小心：在删除它们之前，请运行不带“exec rm {}”的前述命令以检查文件列表。*


    ### `tee` 命令


    `tee` 命令允许你将输出显示在屏幕上，同时将输出重定向到文件。`–a` 选项会将后续输出追加到指定文件中，而不是覆盖该文件。示例下：


    ```

    find . –print |xargs grep "sh$" | tee /tmp/blue

    ```


    上述代码段将当前目录中所有文件（以及任何子目录中的文件）的列表重定向到 `xargs` 命令，然后搜索并打印所有以字符串“sh”结尾的行。结果显示在屏幕上，并重定向到文件
    `/tmp/blue`。


    ```

    find . –print |xargs grep "^abc$" | tee –a /tmp/blue

    ```


    上述代码段还将当前目录中所有文件（以及任何子目录中的文件）的列表重定向到 `xargs` 命令，然后搜索并打印所有仅包含字符串“abc”的行。结果显示在屏幕上，并追加到文件
    `/tmp/blue`。


    ### 文件压缩命令


    Bash 支持多种压缩文件集的命令，包括 `tar`、`cpio`、`gzip` 和 `gunzip` 命令。以下子节包含如何使用这些命令的简单示例。


    #### `tar` 命令


    `tar` 命令允许你压缩目录中的一组文件、解压 tar 文件，并显示 tar 文件的内容。


    “c”选项指定“创建”（create），“f”选项指定“文件”（file），“v”选项指定“详细”（verbose）。例如，以下命令创建一个名为 `testing.tar`
    的压缩文件，并在创建文件期间显示 `testing.tar` 中包含的文件：


    ```

    tar cvf testing.tar *.txt

    ```


    压缩文件 `testing.tar` 包含当前目录下后缀为 `txt` 的文件，你将看到以下输出：


    ```

    a apple-care.txt

    a checkin-commands.txt

    a iphonemeetup.txt

    a kyrgyzstan.txt

    a outfile.txt

    a output.txt

    a ssl-instructions.txt

    ```


    以下命令提取 tar 文件 `testing.tar` 中的文件：


    ```

    tar xvf testing.tar

    ```


    以下命令在不解压内容的情况下显示 tar 文件的内容：


    ```

    tar tvf testing.tar

    ```


    上述命令显示的输出与 `ls –l` 命令（显示详细列表）的输出相同。


    “z”选项使用 `gzip` 压缩。例如，以下命令创建一个名为 `testing.tar.gz` 的压缩文件：


    ```

    tar czvf testing.tar.gz *.txt

    ```


    #### `cpio` 命令


    在创建 tar 文件后，`cpio` 命令提供了进一步的压缩。例如，以下命令创建文件 `archive.cpio`：


    ```

    ls file1 file2 file3 | cpio -ov > archive.cpio

    ```


    `-o`选项指定输出文件，`-v`选项指定详细，这意味着文件在置于存档文件时会被显示。`-I`选项指定输入，`-d`选项指定“显示”。


    你可以将其他命令（如 `find` 命令）与 `cpio` 命令结合，示例下：


    ```

    find . –name ".sh" | cpio -ov > shell-scripts.cpio

    ```


    你可以使用以下命令显示文件 `archive.cpio` 的内容：


    ```

    cpio -id < archive.cpio

    ```


    上述命令的输出如下：


    ```

    file1

    file2

    file3

    1 block

    ```


    #### `gzip` 和 `gunzip` 命令


    `gzip` 命令创建一个压缩文件。例如，以下命令创建压缩文件 `filename.gz`：


    ```

    gzip filename

    ```


    使用 `gunzip` 提取压缩文件 `filename.gz` 的内容：


    ```

    gunzip filename.gz

    ```


