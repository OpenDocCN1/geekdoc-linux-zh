    \n[Listing 5.6](#chap5.xhtml_li5-6) displays the contents of `columns.txt` and\
    \ [Listing 5.7](#chap5.xhtml_li5-7) displays the contents of `ColumnCount1.sh,`\
    \ which illustrates how to print the lines from the text file `columns.txt` that\
    \ have exactly two columns.\n\n##### ***LISTING 5.6 columns.txt***\n\n```\n one\
    \ two three\none two\none two three four\none\none three\none four\n```\n\n#####\
    \ ***LISTING 5.7 ColumnCount1.sh***\n\n```\n awk '\n{\n   if( NF == 2 ) { print\
    \ $0 }\n}\n' columns.txt\n```\n\n[Listing 5.7](#chap5.xhtml_li5-7) is straightforward:\
    \ if the current record number is even, then the current line is printed (i.e.,\
    \ odd-numbered rows are skipped). The output from launching the code in [Listing\
    \ 5.7](#chap5.xhtml_li5-7) is here:\n\n```\n one two\none three\none four\n```\n\
    \nIf you want to display the lines that do *not* contain 2 columns, use the following\
    \ code snippet:\n\n```\n if( NF != 2 ) { print $0 }\n```\n\n#### **Printing File\
    \ Contents as a Single Line**\n\nThe contents of `test4.txt` are here (note the\
    \ blank lines):\n\n```\n abc\ndef\nabc\nabc\n```\n\nThe following code snippet\
    \ illustrates how to print the contents of `test4\\.` `txt` as a single line:\n\
    \n```\n awk '{printf(\"%s\", $0)}' test4.txt\n```\n\nThe output of the preceding\
    \ code snippet is here. See if you can tell what is happening before reading the\
    \ explanation in the next paragraph:\n\n```\n Abcdefabcabc\n```\n\nExplanation:\
    \ `%s` here is the record separator syntax for `printf,` and having the end quote\
    \ after it means the record separator is the empty field “”. Our default record\
    \ separator for `awk` is \\n (newline); what the `printf` is doing is stripping\
    \ out all the newlines. The blank rows will vanish entirely, as all they have\
    \ is the newline, so the result is that any actual text will be merged together\
    \ with nothing between them. Had we added a space between the `%s` and the ending\
    \ quote, there would be a space between each character block, plus an extra space\
    \ for each newline.\n\nNotice how the following comment helps the comprehension\
    \ of the code snippet:\n\n```\n # Merging all text into a single line by removing\
    \ the newlines \nawk '{printf(\"%s\", $0)}' test4.txt\n```\n\n#### **Joining Groups\
    \ of Lines in a Text File**\n\n[Listing 5.8](#chap5.xhtml_li5-8) displays the\
    \ contents of `digits.txt` and [Listing 5.9](#chap5.xhtml_li5-9) displays the\
    \ contents of `digits.sh,` which “joins” three consecutive lines of text in the\
    \ file `digits.txt.`\n\n##### ***LISTING 5.8 digits.txt***\n\n```\n 1\n2\n3\n\
    4\n5\n6\n7\n8\n9\n```\n\n##### ***LISTING 5.9 digits.sh***\n\n```\n awk -F\" \"\
    \ '{\n  printf(\"%d\",$0)\n  if(NR % 3 == 0) { printf(\"\\n\") }\n}' digits.txt\n\
    ```\n\n[Listing 5.9](#chap5.xhtml_li5-9) prints three consecutive lines of text\
    \ on the same line, after which a linefeed is printed. This has the effect of\
    \ “joining” every three consecutive lines of text. The output from launching `digits.sh`\
    \ is here:\n\n```\n 123\n456\n789\n```\n\n#### **Joining Alternate Lines in a\
    \ Text File**\n\n[Listing 5.10](#chap5.xhtml_li5-10) displays the contents of\
    \ `columns2.txt` and [Listing 5.11](#chap5.xhtml_li5-11) displays the contents\
    \ of `JoinLines.sh,` which “joins” two consecutive lines of text in the file `columns2.txt.`\n\
    \n##### ***LISTING 5.10 columns2.txt***\n\n```\n one two\nthree four\none two\
    \ three four\nfive six\none two three\nfour five\n```\n\n##### ***LISTING 5.11\
    \ JoinLines.sh***\n\n```\n awk '\n{\n     printf(\"%s\",$0)\n     if( $1 !~ /one/)\
    \ { print \" \" }\n}\n' columns2.txt\n```\n\nThe output from launching [Listing\
    \ 5.11](#chap5.xhtml_li5-11) is here:\n\n```\n one two three four\none two three\
    \ four five six\none two three four five\n```\n\nNotice that the code in [Listing\
    \ 5.11](#chap5.xhtml_li5-11) depends on the presence of the string “one” as the\
    \ first field in alternating lines of text—we are merging based on matching a\
    \ simple pattern, instead of tying it to record combinations.\n\nTo merge each\
    \ pair of lines instead of merging based on matching a pattern, use the modified\
    \ code in [Listing 5.12](#chap5.xhtml_li5-12).\n\n##### ***LISTING 5.12 JoinLines2.sh***\n\
    \n```\n awk '\nBEGIN { count = 0 }\n{\n   printf(\"%s\",$0)\n   if( ++count %\
    \ 2 == 0) { print \" \" }\n} columns2.txt\n```\n\nYet another way to “join” consecutive\
    \ lines is shown in [Listing 5.13](#chap5.xhtml_li5-13), where the input file\
    \ and output file refer to files that you can populate with data. This is another\
    \ example of an `awk` command that might be a puzzle if encountered in a program\
    \ without a comment. It is doing exactly the same thing as [Listing 5.12](#chap5.xhtml_li5-12),\
    \ but its purpose is less obvious because of the more compact syntax.\n\n#####\
    \ ***LISTING 5.13 JoinLines2.sh***\n\n```\n inputfile=\"linepairs.csv\"\noutputfile=\"\
    linepairsjoined.csv\"\nawk ' NR%2 {printf \"%s,\", $0; next;}1' < $inputfile >\n\
    $outputfile\n```\n\n### **Matching with Metacharacters and Character Sets**\n\n\
    If we can match a simple pattern, by now you probably expect that you can also\
    \ match a regular expression, just as we did in `grep` and `sed.` [Listing 5.14](#chap5.xhtml_li5-14)\
    \ displays the contents of `Patterns1.sh,` which uses metacharacters to match\
    \ the beginning and the end of a line of text in the file `columns2.txt.`\n\n\
    ##### ***LISTING 5.14 Patterns1.sh***\n\n```\n awk '\n   /^f/    { print $1 }\n\
    \   /two $/ { print $1 }\n' columns2.txt\n```\n\nThe output from launching [Listing\
    \ 5.14](#chap5.xhtml_li5-14) is here:\n\n```\n one\nfive\nfour\n```\n\n[Listing\
    \ 5.15](#chap5.xhtml_li5-15) displays the contents of `RemoveColumns.txt` with\
    \ lines that contain a different number of columns.\n\n##### ***LISTING 5.15 columns3.txt***\n\
    \n```\n 123 one two\n456 three four\none two three four\nfive 123 six\none two\
    \ three\nfour five\n```\n\n[Listing 5.16](#chap5.xhtml_li5-16) displays the contents\
    \ of `MatchAlpha1.sh,` which matches text lines that start with alphabetic characters\
    \ as well as lines that contain numeric strings in the second column.\n\n#####\
    \ ***LISTING 5.16 MatchAlpha1.sh***\n\n```\n awk '\n{\n   if( $0 ~ /^[0-9]/) {\
    \ print $0 }\n   if( $0 ~ /^[a-z]+ [0-9]/) { print $0 }\n}\n' columns3.txt\n```\n\
    \nThe output from [Listing 5.16](#chap5.xhtml_li5-16) is here:\n\n```\n 123 one\
    \ two\n456 three four\nfive 123 six\n```\n\n### **Printing Lines Using Conditional\
    \ Logic**\n\n[Listing 5.17](#chap5.xhtml_li5-17) displays the contents of `products.txt,`\
    \ which contains three columns of information.\n\n##### ***LISTING 5.17 products.txt***\n\
    \n```\n MobilePhone  400    new\nTablet       300    new\nTablet       300   \
    \ used\nMobilePhone  200    used\nMobilePhone  100    used\n```\n\nThe following\
    \ code snippet prints the lines of text in `products.txt` whose second column\
    \ is greater than `300:`\n\n```\n awk '$2 > 300' products.txt\n```\n\nThe output\
    \ of the preceding code snippet is here:\n\n```\n MobilePhone 400 new\n```\n\n\
    The following code snippet prints the lines of text in `products.txt` whose product\
    \ is “new”:\n\n```\n awk '($3 == \"new\")' products.txt\n```\n\nThe output of\
    \ the preceding code snippet is here:\n\n```\n MobilePhone   400      new\nTablet\
    \        300      new\n```\n\nThe following code snippet prints the first and\
    \ third columns of the lines of text in `products.txt` whose cost equals `300:`"
