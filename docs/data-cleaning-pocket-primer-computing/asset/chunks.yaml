  trans: "\n\n```\n printf \"%-5s %-10s %-4s\\n\" ABC DEF GHI\nprintf \"%-5s %-10s\
    \ %-4.2f\\n\" ABC DEF 12.3456\n```\n\n将 shell 脚本设置为可执行，然后启动该脚本，你将看到如下输出：\n\n```\n\
    \ ABC     DEF           GHI\nABC     DEF           12.35\n```\n\n另一方面，如果你输入以下的一对命令：\n\
    \n```\n echo \"ABC DEF GHI\"\necho \"ABC DEF 12.3456\"\n```\n\n你将看到如下输出：\n\n```\n\
    \ ABC DEF GHI\nABC DEF 12.3456\n```\n\n关于 `printf` 语句和 `echo` 命令的详细（且非常长的）讨论可以在这里：\n\
    \n*https://unix.stackexchange.com/questions/65803/why-is-printf-better-than-echo.**\n\
    \n## `echo` 命令与空格\n\n`echo` 命令会保留变量中的空格，但在某些情况下，结果可能与你的预期不同。\n\n列表 1.1 显示了 `EchoCut.sh`\
    \ 的内容，说明了当 `echo` 命令与 `cut` 命令配合使用时可能差异。\n\n### 列表 1.1. EchoCut.sh\n\n```\n x1=\"\
    123    456    789\"\nx2=\"123 456 789\"\necho \"x1 = $x1\"\necho \"x2 = $x2\"\n\
    ```\n\n```\n x3=`echo $x1   | cut -c1-7`\nx4=`echo \"$x1\" | cut -c1-7`\nx5=`echo\
    \ $x2   | cut -c1-7`\necho \"x3 = $x3\"\necho \"x4 = $x4\"\necho \"x5 = $x5\"\n\
    ```\n\n运行列表 1.1 中的代码，你将看到如下输出：\n\n```\n x1 = 123   456 789\nx2 = 123 456 789\n\
    x3 = 123 456\nx4 = 123   4\nx5 = 123 456\n```\n\n`x3` 的值可能与你预期的不同：`123` 和 `456`\
    \ 之间只有一个空格，而不是变量 `x1` 定义中出现的三个空格。\n\n当你编写 shell 脚本来检查文本文件中特定列的值（例如工资文件和其他包含财务数据的文件）时，这个看似微不足道的细节非常重要。解决方案涉及使用双引号（有时会使用在第\
    \ 2 章中，反引号命令为 `` `ls *py` ``\n\n列表 1.2 显示了 `CommandSubst.sh` 的内容，该文件显示了目录下文件列表的子集。\n\
    \n### 列表 1.2. CommandSubst.sh\n\n```\n for f in `ls *py`\ndo\n  echo \"file is:\
    \ $f\"\ndone\n```\n\n列表 1.2 包含一个 `for` 循环，显示（当前目录下）带有“py”后缀的文件名。\n\n我的 MacBook\
    \ 上运行列表 1.2 的输出如下：\n\n```\n file is: CapitalizeList.py\nfile is: CompareStrings.py\n\
    file is: FixedColumnCount1.py\nfile is: FixedColumnWidth1.py\nfile is: LongestShortest1.py\n\
    file is: My2DMatrix.pyß\nfile is: PythonBash.py\nfile is: PythonBash2.py\nfile\
    \ is: StringChars1.py\nfile is: Triangular1.py\nfile is: Triangular2.py\nfile\
    \ is: Zip1.py\n```\n\n注意\n\n输出取决于你在执行 `CommandSubst.sh` 的目录中是否存在任何 `.py` 后缀的文件。\n\
    \n## 通过 shell 脚本设置环境变量\n\n使用 shell 脚本时一个非常重要的概念是：脚本内部设置的任何变量在脚本执行完毕将不再存在。规则如下：\n\
    \n![](img/square.jpg)如果变量在脚本中没有设置，但在脚本执行之前已经定义，那么该变量在脚本内部也将可用。\n\n![](img/square.)如果变量在脚本中被设置，它在变量设置后会覆盖任何同名的现有变量，但一旦脚本结束，该变量将恢复到它的旧值（如果在\
    \ shell 脚本外部不存在，则恢复为无值）。\n\n例如，如果一个变量在脚本中被设置，它在变量设置后会覆盖任何同名的现有变量，但一旦脚本结束，该变量将恢复到它的旧值（如果在\
    \ shell 脚本外部不存在，则恢复为无值）。\n\n（此处省略重复的示例段落）\n\n## 使用数组\n\n数组在数据管理中至关重要，并出现在各种范围内。常见的问题是将相关数据元素分组在一起，然后在行内引用它们。\n\
    \n例如，在志愿者活动中，你可能需要签到并提供你的姓名、地址和电话号码，以便他们以后就未来的活动联系你。这些相关数据可以被认为（并在 bash 中定义）为：\n\
    \n```\n volunteer[0] = name\n volunteer[1] = Address\n volunteer[2] = phone number\n\
    ```\n\n签到列表随后可以捕获为一个文件，该文件使用内部字段分隔符 IFS 使得每行代表一个志愿者，每个数据元素（姓名、地址、电话号码）都是独立的，便于后续\
    \ `bash` 脚本（或任何其他理解 `IFS` 概念的编程语言或程序）使用。\n\n"
- fmt: "\nThe `IFS` is a concept covered in detail in [Chapter 2](#chap2.xhtml), but\
    \ it will be used in the following examples so you get a taste of how it is used.\
    \ If you are familiar with `.csv` (comma separated value) text output from spreadsheets,\
    \ the comma in those files is the `IFS`. If you were to open the sign-in list\
    \ in an Excel spreadsheet or Google Doc created with commas as `IFS`, you would\
    \ have column A = name, column B = address, and column C = phone number, each\
    \ row a separate volunteer.\n\nThis section contains several shell scripts that\
    \ illustrate some useful features of arrays in `bash`. [Listing 1.4](#chap1.xhtml_li1-4)\
    \ displays the contents of `array1.sh`, which illustrates how to use an array\
    \ and some operations that you can perform on arrays.\n\nThe syntax in `bash`\
    \ is different enough from other programming languages that it’s worthwhile to\
    \ use several examples to explore its behavior.\n\n##### LISTING 1.4. array1.sh\n\
    \n```bash\n#!/bin/bash\n\n# method #1:\nfruits[0]=\"apple\"\nfruits[1]=\"banana\"\
    \nfruits[2]=\"cherry\"\nfruits[3]=\"orange\"\nfruits[4]=\"pear\"\necho \"first\
    \ fruit: ${fruits[0]}\"\n\n# method #2:\ndeclare -a fruits2=(apple banana cherry\
    \ orange pear)\necho \"first fruit: ${fruits2[0]}\"\n\n# range of elements:\n\
    echo \"last two: ${fruits[@]:3:2}\"\n\n# substring of element:\necho \"substring:\
    \ ${fruits[1]:0:3}\"\n\narrlength=${#fruits[@]}\necho \"length: ${#fruits[@]}\"\
    \n```\n\n[Listing 1.5](#chap1.xhtml_li1-5) displays the contents of `names.txt`\
    \ and [Listing 1.6](#chap1.xhtml_li1-6) displays the contents of `array-from-file.sh`,\
    \ which contains a `for` loop to iterate through the elements of an array whose\
    \ initial values are based on the contents of `names.txt`.\n\n##### LISTING 1.5.\
    \ names.txt\n\n```\nJane Smith\nJohn Jones\nDave Edwards\n```\n\n##### LISTING\
    \ 1.6. array-from-file.sh\n\n```bash\n#!/bin/bash\n\nnames=\"names.txt\"\ncontents1=(\
    \ `cat \"$names\"` )\n\necho \"First loop:\"\nfor w in \"${contents1[@]}\"\ndo\n\
    \  echo \"$w\"\ndone\n\nIFS=\"\"\nnames=\"names.txt\"\ncontents1=( `cat \"$names\"\
    ` )\n\necho \"Second loop:\"\nfor w in \"${contents1[@]}\"\ndo\n  echo \"$w\"\n\
    done\n```\n\n[Listing 1.6](#chap1.xhtml_li1-6) initializes the array variable\
    \ `contents1` by using command substitution with the `cat` command, followed by\
    \ a loop that displays elements of the array `contents1`. The second for loop\
    \ is the same code as the first for loop, but this time with the value of `IFS`\
    \ equal to \"\", which has the effect of using the newline as a separator, one\
    \ data element per row.\n\nLaunch the code in [Listing 1.6](#chap1.xhtml_li1-6)\
    \ and you will see the following output:\n\n```\nFirst loop:\nJane\nSmith\nJohn\n\
    Jones\nDave\nEdwards\nSecond loop:\nJane Smith\nJohn Jones\nDave Edwards\n```\n\
    \n[Listing 1.7](#chap1.xhtml_li1-7) displays the contents of `array-function.sh`,\
    \ which illustrates how to initialize an array and then display its contents in\
    \ a user-defined function.\n\n##### LISTING 1.7. array-function.sh\n\n```bash\n\
    #!/bin/bash\n\n# compact version of the code later in this script:\n#items() {\
    \ for line in \"${@}\" ; do printf \"%s\\n\" \"${line}\" ;\ndone ; }\n#aa=( 7\
    \ -4 -e ) ; items \"${aa[@]}\"\n\nitems() {\n  for line in \"${@}\"\n  do\n  \
    \   printf \"%s\\n\" \"${line}\"\n  done\n}\n\narr=( 123 -abc 'my data' )\nitems\
    \ \"${arr[@]}\"\n```\n\n[Listing 1.7](#chap1.xhtml_li1-7) contains the `items()`\
    \ function that displays the contents of the `arr` array that has been initialized\
    \ prior to invoking this function. The output is shown here:\n\n```\n123\n-abc\n\
    my data\n```\n\n[Listing 1.8](#chap1.xhtml_li1-8) displays the contents of `array-loops1.sh`,\
    \ which illustrates how to determine the length of an initialized array and then\
    \ display its contents via a for loop.\n\n##### LISTING 1.8. array-loops1.sh\n\
    \n```bash\n#!/bin/bash\n\nfruits[0]=\"apple\"\nfruits[1]=\"banana\"\nfruits[2]=\"\
    cherry\"\nfruits[3]=\"orange\"\nfruits[4]=\"pear\"\n\n# array length:\narrlength=${#fruits[@]}\n\
    echo \"length: ${#fruits[@]}\"\n\n# print each element via a loop:\nfor (( i=1;\
    \ i<${arrlength}+1; i++ ));\ndo\n  echo \"element $i of ${arrlength} : \" ${fruits[$i-1]}\n\
    done\n```\n\n[Listing 1.8](#chap1.xhtml_li1-8) contains straightforward code for\
    \ initializing an array and displaying its values.\n\n### Working with Nested\
    \ Loops\n\nThis section is mainly for fun: you will see how to use nested loops\
    \ to display a pattern. [Listing 1.9](#chap1.xhtml_li1-9) displays the contents\
    \ of `nested-loops.sh`, which illustrates how to use nested loops to create a\
    \ triangular output.\n\n##### LISTING 1.9. nested-loops.sh\n\n```bash\n#!/bin/bash\n\
    \nfor (( i=1; i<=5; i++ ))\ndo\n  for (( j=1; j<=$i; j++ ))\n  do\n    printf\
    \ \"%s\" \"*\"\n  done\n  echo \"\"\ndone\n```\n\nLaunch the code in [Listing\
    \ 1.9](#chap1.xhtml_li1-9) and you will see the following output:\n\n```\n*\n\
    * *\n* * *\n* * * *\n* * * * *\n```\n"
  raw: "The `IFS` is a concept covered in detail in [Chapter 2](#chap2.xhtml), but\
    \ it will be used in the following examples so you get a taste of how it is used.\
    \ If you are familiar with “.csv” (comma separated value) text output from spreadsheets,\
    \ the comma in those files is the `IFS`. If you were to open the sign-in list\
    \ in an Excel spreadsheet or Google Doc created with commas as `IFS`, you would\
    \ have column A = name, column B = address, and column C = phone number, each\
    \ row a separate volunteer.\n\nThis section contains several shell scripts that\
    \ illustrate some useful features of arrays in `bash`. [Listing 1.4](#chap1.xhtml_li1-4)\
    \ displays the contents of `array1.sh`, which illustrates how to use an array\
    \ and some operations that you can perform on arrays.\n\nThe syntax in bash is\
    \ different enough from other programming languages that it’s worthwhile to use\
    \ several examples to explore its behavior.\n\n##### ***LISTING 1.4\\. array1.sh***\n\
    \n```\n #!/bin/bash\n\n# method #1:\nfruits[0]=\"apple\"\nfruits[1]=\"banana\"\
    \nfruits[2]=\"cherry\"\nfruits[3]=\"orange\"\nfruits[4]=\"pear\"\necho \"first\
    \ fruit: ${fruits[0]}\"\n\n# method #2:\ndeclare -a fruits2=(apple banana cherry\
    \ orange pear)\necho \"first fruit: ${fruits2[0]}\"\n\n# range of elements:\n\
    echo \"last two: ${fruits[@]:3:2}\"\n\n# substring of element:\necho \"substring:\
    \ ${fruits[1]:0:3}\"\n\narrlength=${#fruits[@]}\necho \"length: ${#fruits[@]}\"\
    \n```\n\n[Listing 1.5](#chap1.xhtml_li1-5) displays the contents of `names.txt`\
    \ and [Listing 1.6](#chap1.xhtml_li1-6) displays the contents of `array-from-file.sh`,\
    \ which contains a `for` loop to iterate through the elements of an array whose\
    \ initial values are based on the contents of `names.txt`.\n\n##### ***LISTING\
    \ 1.5\\. names.txt***\n\n```\n Jane Smith\nJohn Jones\nDave Edwards\n```\n\n#####\
    \ ***LISTING 1.6\\. array-from-file.sh***\n\n```\n #!/bin/bash\n\nnames=\"names.txt\"\
    \ncontents1=( `cat \"$names\"` )\n\necho \"First loop:\"\nfor w in \"${contents1[@]}\"\
    \ndo\n  echo \"$w\"\ndone\n\nIFS=\"\"\nnames=\"names.txt\"\ncontents1=( `cat \"\
    $names\"` )\n\necho \"Second loop:\"\nfor w in \"${contents1[@]}\"\ndo\n  echo\
    \ \"$w\"\ndone\n```\n\n[Listing 1.6](#chap1.xhtml_li1-6) initializes the array\
    \ variable `contents1` by using command substitution with the `cat` command, followed\
    \ by a loop that displays elements of the array `contents1`. The second for loop\
    \ is the same code as the first for loop, but this time with the value of `IFS`\
    \ equal to “”, which has the effect of using the newline as a separator, one data\
    \ element per row.\n\nLaunch the code in [Listing 1.6](#chap1.xhtml_li1-6) and\
    \ you will see the following output:\n\n```\n First loop:\nJane\nSmith\nJohn\n\
    Jones\nDave\nEdwards\nSecond loop:\nJane Smith\nJohn Jones\nDave Edwards\n```\n\
    \n[Listing 1.7](#chap1.xhtml_li1-7) displays the contents of `array-function.sh`,\
    \ which illustrates how to initialize an array and then display its contents in\
    \ a user-defined function.\n\n##### ***LISTING 1.7\\. array-function.sh***\n\n\
    ```\n #!/bin/bash\n\n# compact version of the code later in this script:\n#items()\
    \ { for line in \"${@}\" ; do printf \"%s\\n\" \"${line}\" ;\ndone ; }\n#aa=(\
    \ 7 -4 -e ) ; items \"${aa[@]}\"\n\nitems() {\n  for line in \"${@}\"\n  do\n\
    \     printf \"%s\\n\" \"${line}\"\n  done\n}\n\narr=( 123 -abc 'my data' )\n\
    items \"${arr[@]}\"\n```\n\n[Listing 1.7](#chap1.xhtml_li1-7) contains the `items()`\
    \ function that displays the contents of the `arr` array that has been initialized\
    \ prior to invoking this function. The output is shown here:\n\n```\n 123\n-abc\n\
    my data\n```\n\n[Listing 1.8](#chap1.xhtml_li1-8) displays the contents of `array-loops1.sh`,\
    \ which illustrates how to determine the length of an initialized array and then\
    \ display its contents via a for loop.\n\n##### ***LISTING 1.8\\. array-loops1.sh***\n\
    \n```\n #!/bin/bash\n\nfruits[0]=\"apple\"\nfruits[1]=\"banana\"\nfruits[2]=\"\
    cherry\"\nfruits[3]=\"orange\"\nfruits[4]=\"pear\"\n\n# array length:\narrlength=${#fruits[@]}\n\
    echo \"length: ${#fruits[@]}\"\n\n# print each element via a loop:\nfor (( i=1;\
    \ i<${arrlength}+1; i++ ));\ndo\n  echo \"element $i of ${arrlength} : \" ${fruits[$i-1]}\n\
    done\n```\n\n[Listing 1.8](#chap1.xhtml_li1-8) contains straightforward code for\
    \ initializing an array and displaying its values.\n\n### **Working with Nested\
    \ Loops**\n\nThis section is mainly for fun: you will see how to use nested loops\
    \ to display a “triangular” output. [Listing 1.9](#chap1.xhtml_li1-9) displays\
    \ the contents of `nested-loops.sh`, which illustrates how to display an alternating\
    \ set of symbols in a triangular fashion.\n\n##### ***LISTING 1.9\\. nestedloops2.sh***\n\
    \n```\n #!/bin/bash\n\noutermax=10\nsymbols[0]=\"#\"\nsymbols[1]=\"@\"\n\nfor\
    \ (( i=1; i<${outermax}; i++ ));\ndo\n  for (( j=1; j<${i}; j++ ));\n  do\n  \
    \  printf \"%-2s\" ${symbols[($i+$j)%2]}\n  done\n  printf \"\\n\"\ndone\n\nfor\
    \ (( i=1; i<${outermax}; i++ ));\ndo\n  for (( j=${i}+1; j<${outermax}; j++ ));\n\
    \  do\n    printf \"%-2s\" ${symbols[($i+$j)%2]}\n  done\n  printf \"\\n\"\ndone\n\
    ```\n\n[Listing 1.9](#chap1.xhtml_li1-9) initializes some variables, followed\
    \ by a nested loop. The outer loop is “controlled” by the loop variable `i`, whereas\
    \ the inner loop (which depends on the value of `i`) is “controlled” by the loop\
    \ variable `j`. The key point to notice is how the following code snippet prints\
    \ alternating symbols in the symbols array, depending on whether or not the value\
    \ of `$i + $j` is even or odd:\n\n```\n printf \"%-2s\" ${symbols[($i+$j)%2]}\n\
    ```\n\nYou can easily generalize this code: if the symbols array contains `arrlength`\
    \ elements, then replace the preceding code snippet with the following:\n\n```\n\
    \ printf \"%-2s\" ${symbols[($i+$j)% $arrlength]}\n```\n\nLaunch the code in [Listing\
    \ 1.9](#chap1.xhtml_li1-9) and you will see the following output:\n\n```\n @\n\
    \      # @\n      @ # @\n      # @ # @\n      @ # @ # @\n      # @ # @ # @\n \
    \     @ # @ # @ # @\n      # @ # @ # @ # @\n      @ # @ # @ # @ #\n      @ # @\
    \ # @ # @\n      @ # @ # @ #\n      @ # @ # @\n      @ # @ #\n      @ # @\n  \
    \    @ #\n      @\n```\n\n### **The `paste` Command**\n\nThe `paste` command is\
    \ useful when you need to combine two files in a “pairwise” fashion. For example,\
    \ [Listing 1.10](#chap1.xhtml_li1-10) and [Listing 1.11](#chap1.xhtml_li1-11)\
    \ display the contents of the text files `list1` and `list2`, respectively. You\
    \ can think of `paste` as adding the contents of the second file as a new column\
    \ in the first file. In our first example, the first file has a list of files\
    \ to copy, and the second file has a list of files that are the destination for\
    \ the copy command. Paste then merges the two files into output that could then\
    \ be run to execute all the copy commands in one step.\n\n##### ***LISTING 1.10\\\
    . list1***\n\n```\n cp abc.sh\ncp abc2.sh\ncp abc3.sh\n```\n\n##### ***LISTING\
    \ 1.11\\. list2***\n\n```\n def.sh\ndef2.sh\ndef3.sh\n```\n\n[Listing 1.12](#chap1.xhtml_li1-12)\
    \ displays the result of invoking the following command:\n\n```\n paste list1\
    \ list2 >list1.sh\n```\n\n##### ***LISTING 1.12\\. list1.sh***\n\n```\n cp  abc.sh\
    \    def.sh\ncp  abc2.sh   def2.sh\ncp  abc3.sh   def3.sh\n```\n\n[Listing 1.12](#chap1.xhtml_li1-12)\
    \ contains three `cp` commands that are the result of invoking the paste command.\
    \ If you want to execute the commands in [Listing 1.12](#chap1.xhtml_li1-12),\
    \ make this shell script executable and then launch the script, as shown here:\n\
    \n```\n chmod +x list1.sh\n./list1.sh\n```\n\n#### **Inserting Blank Lines with\
    \ the `paste` Command**\n\nInstead of merging two equal length files, `paste`\
    \ can also be used to add the same thing to every line in a file. This example\
    \ inserts a blank line after every line in `names.txt` with this command:\n\n\
    ```\n paste -d'\\n' - /dev/null < names.txt\n```\n\nThe output is here:\n\n```\n\
    \ Jane Smith\n\nJohn Jones\n\nDave Edwards\n```\n\nInsert a blank line after every\
    \ other line in `names.txt` with this command:\n\n```\n paste -d'\\n' - - /dev/null\
    \ < names.txt\n```\n\nThe output is here:\n\n```\n Jane Smith\nJohn Jones\n\n\
    Dave Edwards\n```\n\nInsert a blank line after every third line in `names.txt`\
    \ with this command:\n\n```\n paste -d'\\n' - - - /dev/null < names.txt\n```\n\
    \nThe output is here:\n\n```\n Jane Smith\nJohn Jones\nDave Edwards\n```"
