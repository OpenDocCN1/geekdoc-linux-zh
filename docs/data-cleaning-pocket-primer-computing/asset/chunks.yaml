    \ Fibonacci Numbers**\n\n[Listing A.1](#appendix.xhtml_liA-1) displays the contents\
    \ of `Fibonacci.sh` that computes the Fibonacci value of a positive integer.\n\
    \n##### ***LISTING A.1: Fibonacci.sh***\n\n```\n #!/bin/sh\n\nLOGFILE=\"/tmp/a1\"\
    \n\nrm -f $LOGFILE 2>/dev/null\n\nfib()\n{\n    if [ \"$1\" -gt 3 ]\n\n    then\n\
    \necho \"1 = $1 2 = $2 3 = $3\" >> $LOGFILE\n\n      decr1=`expr $2 - 1`\n\n \
    \     decr2=`expr $3 - 1`\n\n      decr3=`expr $3 - 2`\n\necho \"d1 = $decr1 d2\
    \ = $decr2 d3 = $decr3\" >> $LOGFILE\n\n      fib1=`fib $2 $3 $decr2`\n\n    \
    \  fib2=`fib $3 $decr2 $decr3`\n\n      fib=`expr $fib1 + $fib2`\n\n      echo\
    \ $fib\n\n   else\n\n      if [ \"$1\" -eq 3 ]\n\n      then\n\n        echo 2\n\
    \n      else\n\n        echo 1\n\n      fi\n\n   fi\n\n}\n\necho \"Enter a number:\
    \ \"\n\nread num\n\n# add code to ensure it's a positive integer\n\nif [ \"$num\"\
    \ -lt 3 ]\n\nthen\n\n  echo \"fibonacci $num = 1\"\n\nelse\n\n  decr1=`expr $num\
    \ - 1`\n\n  decr2=`expr $num - 2`\n\n  echo \"fibonacci $num = `fib $num $decr1\
    \ $decr2`\"\n\nfi \n```\n\nIn case you don't already know, the Fibonacci sequence\
    \ is defined as follows:\n\n```\n F(1) = 1; F(2) = 2; and F(n) = F(n-1) + F(n-2)\
    \ for n >= 2.\n```\n\n[Listing A.1](#appendix.xhtml_liA-1) looks complicated,\
    \ but in a sense it \"extends\" the technique shown in [Listing 2.10](#chap2.xhtml_li2-10)\
    \ in [Chapter 2](#chap2.xhtml). In particular, the code for calculating factorial\
    \ values involves decrementing one variable, whereas calculating Fibonacci numbers\
    \ involves decrementing two variables (which are called `decr1` and `decr2` in\
    \ [Listing A.1](#appendix.xhtml_liA-1)) in order to make recursive invocations\
    \ of the `fib()` function.\n\n### **Calculating the GCD of Two Positive Integers**\n\
    \n[Listing A.2](#appendix.xhtml_liA-2) displays the contents of the shell script\
    \ `gcd.sh` that computes the greatest common divisor of two positive integers.\n\
    \n##### ***LISTING A.2 gcd.sh***\n\n```\n #!/bin/sh\n\nfunction gcd()\n\n{\n\n\
    \  if [ $1 -lt $2 ]\n\n  then\n\n    result=`gcd $2 $1`\n\n    echo $result\n\n\
    else\n\n  remainder=`expr $1 % $2`\n\n  if [ $remainder == 0 ]\n\n  then\n\n \
    \   echo $2\n\n  else\n\n    echo `gcd $2 $remainder`\n\n  fi\n\n fi\n\n}\n\n\
    a=\"4\"\n\nb=\"20\"\n\nresult=`gcd $a $b`\n\necho \"GCD of $a and $b = $result\"\
    \n\na=\"4\"\n\nb=\"22\"\n\nresult=`gcd $a $b`\n\necho \"GCD of $b and $a = $result\"\
    \n\na=\"20\"\n\nb=\"3\"\n\nresult=`gcd $a $b`\n\necho \"GCD of $b and $a = $result\"\
    \n\na=\"10\"\n\nb=\"10\"\n\nresult=`gcd $a $b`\n\necho \"GCD of $b and $a = $result\"\
    \n```\n\n[Listing A.2](#appendix.xhtml_liA-2) is a straightforward implementation\
    \ of the Euclidean algorithm (check Wikipedia for details) for finding the GCD\
    \ of two positive integers. The output from [Listing A.2](#appendix.xhtml_liA-2)\
    \ shows the GCD of 4 and 20, as shown here:\n\n```\n GCD of 4 and 20 = 4\n\nGCD\
    \ of 22 and 4 = 2\n\nGCD of 3 and 20 = 1\n\nGCD of 10 and 10 = 10\n```\n\n###\
    \ **Calculating the LCM of Two Positive Integers**\n\n[Listing A.3](#appendix.xhtml_liA-3)\
    \ displays the contents of the shell script `lcm.sh` that computes the lowest\
    \ common multiple (LCM) of two positive integers. This script contains the code\
    \ in the shell script `gcd.sh` in order to compute the LCM of two positive integers.\n\
    \n##### ***LISTING A.3: lcm.sh***\n\n```\n #!/bin/sh\n\nfunction gcd()\n\n{\n\n\
    \   if [ $1 -lt $2 ]\n\n   then\n\n     result=`gcd $2 $1`\n\n     echo $result\n\
    \n   else\n\n     remainder=`expr $1 % $2`\n\n     if [ $remainder == 0 ]\n\n\
    \     then\n\n       echo $2\n\n     else\n\n       result=`gcd $2 $remainder`\n\
    \n       echo $result\n\n     fi\n\n   fi\n\n}\n\nfunction lcm()\n\n{\n\n    \
    \ gcd1=`gcd $1 $2`\n\n     lcm1=`expr $1 / $gcd1`\n\n     lcm2=`expr $lcm1 \\\
    * $2`\n\n     echo $lcm2\n}\n\na=\"24\"\n\nb=\"10\"\n\nresult=`lcm $a $b`\n\n\
    echo \"The LCM of $a and $b = $result\"\n\na=\"10\"\n\nb=\"30\"\n\nresult=`lcm\
    \ $a $b`\n\necho \"The LCM of $a and $b = $result\"\n```"
