- fmt: "\nNote that `grep –R hello` also performs a search for the string `hello`\
    \ in all files, including subdirectories, and follows the “one process” recommendation.\
    \ On the other hand, the `find .` –print` command searches for all files in all\
    \ subdirectories, and you can pipe the output to `xargs grep hello` in order to\
    \ find the occurrences of the word `hello` in all files (which involves two processes\
    \ instead of one process).\n\nYou can use the output of the preceding code snippet\
    \ in order to copy the matching files to another directory, as shown here:\n\n\
    ```\n cp `find . –print |grep \"sh$\" | xargs grep –l abc` /tmp\n```\n\nAlternatively,\
    \ you can copy the matching files in the current directory (without matching files\
    \ in any subdirectories) to another directory with the `grep` command:\n\n```\n\
    \ cp `grep –l abc *sh` /tmp\n```\n\nYet another approach is to use “back tick”\
    \ so that you can obtain additional information:\n\n```\n for file in `find .\
    \ –print`\ndo\n    echo \"Processing the file: $file\"\n    # now do something\
    \ here\ndone\n```\n\nKeep in mind that if you pass too many filenames to the `xargs`\
    \ command you will see a “too many files” error message. In this situation, try\
    \ to insert additional `grep` commands prior to the `xargs` command in order to\
    \ reduce the number of files that are piped into the `xargs` command.\n\nIf you\
    \ work with NodeJS, you know that the `node_modules` directory contains a large\
    \ number of files. In most cases, you probably want to exclude the files in that\
    \ directory when you are searching for a string, and the “-v” option is ideal\
    \ for this situation. The following command excludes the files in the `node_modules`\
    \ directory while searching for the names of the HTML files that contain the string\
    \ `src` and redirecting the list of file names to the file `src_list.txt` (and\
    \ also redirecting error messages to `/dev/null`):\n\n```\n find . –print |grep\
    \ –v node |xargs grep –il src >src_list.txt 2>/dev/null\n```\n\nYou can extend\
    \ the preceding command to search for the HTML files that contain the string `src`\
    \ and the string `angular` with the following command:\n\n```\n find . –print\
    \ |grep –v node |xargs grep –il src |xargs grep –il angular >angular_list.txt\
    \ 2>/dev/null\n```\n\nYou can use the following combination of `grep` and `xargs`\
    \ to find the files that contain both `xml` and `defs`:\n\n```\n grep -l xml *svg\
    \ |xargs grep -l def\n```\n\nA variation of the preceding command redirects error\
    \ messages to `/dev/null`, as shown here:\n\n```\ngrep -l hello *txt 2>/dev/null\
    \ | xargs grep -c hello\n```\n\n## Searching Zip Files for a String\n\nThere are\
    \ at least three ways to search for a string in one or more zip files. As an example,\
    \ suppose that you want to determine which zip files contain SVG documents.\n\n\
    The first way is shown here:\n\n```\n for f in `ls *zip`\ndo\n   echo \"Searching\
    \ $f\"\n   jar tvf $f |grep \"svg$\"\ndone\n```\n\nWhen there are many zip files\
    \ in a directory, the output of the preceding loop can be very verbose, in which\
    \ case you need to scroll backward and probably copy/paste the names of the files\
    \ that actually contain SVG documents into a separate file. A better solution\
    \ is to put the preceding loop in a shell and redirect its output. For instance,\
    \ create the file `findsvg.sh` whose contents are the preceding loop, and then\
    \ invoke this command:\n\n```\n ./findsvg.sh 1>1 2>2\n```\n\nNotice that the preceding\
    \ command redirects error message (`2>`) to the file 2 and the results of the\
    \ `jar/grep` command (`1>`) to the file 1. See the Appendix for another example\
    \ of searching zip files for SVG documents.\n\n## Checking for a Unique Key Value\n\
    \nSometimes you need to check for the existence of a string (such as a key) in\
    \ a text file, and then perform additional processing based on its existence.\
    \ However, do not assume that the existence of a string means that that string\
    \ only occurs once. As a simple example, suppose the file `mykeys.txt` has the\
    \ following content:\n\n```\n 2000\n22000\n10000\n3000\n```\n\nSuppose that you\
    \ search for the string `2000`, which you can do with `findkey.sh`, whose contents\
    \ are displayed in [Listing 3.6].\n\n### Listing 3.6 findkey.sh\n\n```\n key=\"\
    2000\"\nif [ \"`grep $key mykeys.txt`\" != \"\" ]\nthen\n foundkey=true\nelse\n\
    \ foundkey=false\nfi\necho \"current key = $key\"\necho \"found key = $foundkey\"\
    \n```\n\n[Listing 3.6] contains if/else conditional logic to determine whether\
    \ or not the file `mykeys.txt` contains the value of `$key` (which is initialized\
    \ as 2000). Launch the code in [Listing 3.6] and you will see the following output:\n\
    \n```\n current key = 2000\nfound key   = true\nlinecount   = 2\n```\n\nWhile\
    \ the key value of 2000 does exist in `mykeys.txt`, you can see that it matches.\
    \ While the key value of 2000 does exist in `mykeys.txt`, you can see that it\
    \ matches. While the key value of 2000 does exist in `mykeys.txt`, you can see\
    \ that it matches.\n\n## Redirecting Error Messages\n\nAnother scenario involves\
    \ `xargs` with the following:\n\n```\nfind . –print |xargs grep\n```\n\nMake sure\
    \ to redirect errors using the following:\n\n```\nfind . –print |xargs grep\n\
    ```\n\n## The `egrep` Command and `fgrep`\n\nThe `egrep` command is almost identical\
    \ to `grep` with some features.\n\n## Displaying “Pure” Words in a Dataset with\
    \ `egrep`\n\nFor simplicity, let’s work with a text string, and that way we can\
    \ see the intermediate results as we work toward the solution. Let’s initialize\
    \ the variable `x` as shown here:\n\n```\n x=\"ghi abc Ghi 123 #def5 123z\"\n\
    ```\n\nThe first step is to split `x` into words:\n\n```\n echo $x |tr -s ' '\
    \ '\\n'\n```\n\nThe output is here:\n\n```\n ghi\nabc\nGhi\n123\n#def5\n123z\n\
    ```\n\nThe second step is to invoke `egrep` with the regular expression `^[a-zA-Z]+`,\
    \ which matches any string consisting of one or more uppercase and/or lowercase\
    \ letters (and nothing else):\n\n```\n echo $x |tr -s ' ' '\\n' |egrep \"^[a-zA-Z]+$\"\
    \n```\n\nThe output is here:\n\n```\n ghi\nabc\nGhi\n```\n"
