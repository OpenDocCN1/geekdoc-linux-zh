    \ command sorts the lines in a text file. For example, if the text file `test2.txt`\
    \ contains the following lines:\n\n```\n aa\ncc\nbb\n```\n\nThe following simple\
    \ example sorts the lines in `test2.txt:`\n\n```\n cat test2.txt |sort\n```\n\n\
    The output of the preceding code snippet is here:\n\n```\n aa\nbb\ncc\n```\n\n\
    The `sort` command arranges lines of text alphabetically by default. Some options\
    \ for the `sort` command are here:\n\n```\n Option  Description\n-n      Sort\
    \ numerically (example: 10 will sort after 2),\nignore blanks and tabs.\n-r  \
    \    Reverse the order of sort.\n-f      Sort upper- and lowercase together.\n\
    +x      Ignore first x fields when sorting.\n```\n\nYou can use the `sort` command\
    \ to display the files in a directory based on their file size, as shown here:\n\
    \n```\n -rw-r--r-- 1 ocampesato staff  11 Jan 06 19:21 outfile.txt\n-rw-r--r--\
    \ 1 ocampesato staff  12 Jan 06 19:21 output.txt\n-rwx------ 1 ocampesato staff\
    \  12 Jan 06 19:21 kyrgyzstan.txt\n-rwx------ 1 ocampesato staff  25 Jan 06 19:21\
    \ apple-care.txt\n-rwx------ 1 ocampesato staff 146 Jan 06 19:21 checkin-commands.txt\n\
    -rwx------ 1 ocampesato staff 176 Jan 06 19:21 ssl-instructions.txt\n-rwx------\
    \ 1 ocampesato staff 417 Jan 06 19:43 iphonemeetup.txt\n```\n\nThe `sort` command\
    \ supports many options, some of which are summarized here.\n\nThe `sort –r` command\
    \ sorts the list of files in reverse chronological order. The `sort –n` command\
    \ sorts on numeric data and `sort –k` command sorts on a field. For example, the\
    \ following command displays the long listing of the files in a directory that\
    \ are sorted by their file size:\n\n```\n ls –l |sort –k 5\n```\n\nThe output\
    \ is here:\n\n```\n total 72\n-rwx------ 1 ocampesato staff  12 Jan 06 20:46 kyrgyzstan.txt\n\
    -rw-r--r-- 1 ocampesato staff  12 Jan 06 20:46 output.txt\n-rw-r--r-- 1 ocampesato\
    \ staff  14 Jan 06 20:46 outfile.txt\n-rwx------ 1 ocampesato staff  25 Jan 06\
    \ 20:46 apple-care.txt\n-rwxr-xr-x 1 ocampesato staff  90 Jan 06 20:50 testvars.sh\n\
    -rwxr-xr-x 1 ocampesato staff 100 Jan 06 20:50 testvars2.sh\n-rwx------ 1 ocampesato\
    \ staff 146 Jan 06 20:46 checkin-commands.txt\n-rwx------ 1 ocampesato staff 176\
    \ Jan 06 20:46 ssl-instructions.txt\n-rwx------ 1 ocampesato staff 417 Jan 06\
    \ 20:46 iphonemeetup.txt\n```\n\nNotice that the file listing is sorted based\
    \ on the fifth column, which displays the file size of each file. You can sort\
    \ the files in a directory and display them from largest to smallest with this\
    \ command:\n\n```\n ls –l |sort –n\n```\n\nIn addition to sorting lists of files,\
    \ you can use the `sort` command to sort the contents of a file. For example,\
    \ suppose that the file `abc2.txt` contains the following:\n\n```\n This is line\
    \ one\nThis is line two\nThis is line one\nThis is line three\nFourth line\nFifth\
    \ line\nThe sixth line\nThe seventh line\n```\n\nThe following command sorts the\
    \ contents of `abc2.txt:`\n\n```\n sort abc2.txt\n```\n\nYou can sort the contents\
    \ of multiple files and redirect the output to another file:\n\n```\n sort outfile.txt\
    \ output.txt > sortedfile.txt\n```\n\nAn example of combining the commands `sort`\
    \ and `tail` is shown here:\n\n```\n cat abc2.txt |sort |tail -5\n```\n\nThe preceding\
    \ command sorts the contents of the file `abc2.txt` and then displays the final\
    \ five lines:\n\n```\n The seventh line\nThe sixth line\nThis is line one\nThis\
    \ is line one\nThis is line three\nThis is line two\n```\n\nAs you can see, the\
    \ preceding output contains two duplicate lines. The next section shows you how\
    \ to use the `uniq` command in order to remove duplicate lines.\n\n### **The `uniq`\
    \ Command**\n\nThe `uniq` command prints only the unique lines in a sorted text\
    \ file and omits duplicates. As a simple example, suppose the file `test3.txt`\
    \ contains the following lines:\n\n```\n abc\ndef\nabc\nabc\n```\n\nThe following\
    \ command displays the unique lines:\n\n```\n cat test3.txt |sort | uniq\n```\n\
    \nThe output of the preceding code snippet is here:\n\n```\n abc\ndef\n```\n\n\
    ### **How to Compare Files**\n\nThe `diff` command enables you to compare two\
    \ text files and the `cmp` command compares two binary files. For example, suppose\
    \ that the file `output.txt` contains these two lines:\n\n```\n Hello\nWorld\n\
    ```\n\nSuppose that the file `outfile.txt` contains these two lines:\n\n```\n\
    \ goodbye\nworld\n```\n\nThen the output of this command:\n\n```\n diff output.txt\
    \ outfile.txt\n```\n\nis shown here:\n\n```\n 1,2c1,2\n< Hello\n< World\n---\n\
    > goodbye\n> world\n```\n\nNote that the `diff` command performs a case-sensitive\
    \ text-based comparison, which means that the strings `Hello` and `hello` are\
    \ different.\n\n### **The `od` Command**\n\nThe `od` command displays an octal\
    \ dump of a file, which can be very helpful when you want to see embedded control\
    \ characters (such as tab characters) that are not normally visible on the screen.\
    \ This command contains many switches that you can see when you type `man od`.\n\
    \nAs a simple example, suppose that the file `abc.txt` contains one line of text\
    \ with the following three letters, separated by a tab character (which are not\
    \ visible here) between each pair of letters:\n\n```\n a       b       c\n```\n\
    \nThe following command displays the tab and newline characters in the file `abc.txt:`\n\
    \n```\n cat control1.txt |od -tc\n```\n\nThe preceding command generates the following\
    \ output:\n\n```\n 0000000    a   \\t   b   \\t   c   \\n\n0000006\n```\n\nIn\
    \ the special case of tabs, another way to see them is to use the following cat\
    \ command:\n\n```\n cat –t abc.txt\n```\n\nThe output from the preceding command\
    \ is here:\n\n```\n a^Ib^Ic\n```"
