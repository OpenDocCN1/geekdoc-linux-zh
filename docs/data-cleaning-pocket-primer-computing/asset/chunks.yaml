    \ contains 37 lines, 80 words, and 408 characters, which means that the file size\
    \ is actually quite small (despite its name).\n\n#### **The `cat` Command**\n\n\
    You can use the `cat` command to display the contents of `longfile.txt:`\n\n```\n\
    \ cat longfile.txt\n```\n\nThe preceding command displays the following text:\n\
    \n```\n the contents\nof this\nlong file\nare too long\nto see in a\nsingle screen\n\
    and each line\ncontains\none or\nmore words\nand if you\nuse the cat\ncommand\
    \ the\n(other lines are omitted)\n```\n\nAs another example, suppose that the\
    \ file `temp1` has the following contents:\n\n```\n this is line1 of temp1\nthis\
    \ is line2 of temp1\nthis is line3 of temp1\n```\n\nSuppose that the file `temp2`\
    \ has these contents:\n\n```\n this is line1 of temp2\nthis is line2 of temp2\n\
    ```\n\nNow type the following command that contains the `?` metacharacter (discussed\
    \ in detail later in this chapter):\n\n```\n cat temp?\n```\n\nThe output from\
    \ the preceding command is shown here:\n\n```\n this is line1 of temp1\nthis is\
    \ line2 of temp1\nthis is line3 of temp1\nthis is line1 of temp2\nthis is line2\
    \ of temp2\n```\n\n#### **The `head` and `tail` Commands**\n\nThe `head` command\
    \ displays the first ten lines of a text file (by default), an example of which\
    \ is here:\n\n```\n head longfile.txt\n```\n\nThe preceding command displays the\
    \ following text:\n\n```\n the contents\nof this\nlong file\nare too long\nto\
    \ see in a\nsingle screen\nand each line\ncontains\none or\nmore words\n```\n\n\
    The `head` command also provides an option to specify a different number of lines\
    \ to display, as shown here:\n\n```\n head -4 longfile.txt\n```\n\nThe preceding\
    \ command displays the following text:\n\n```\n the contents\nof this\nlong file\n\
    are too long\n```\n\nThe `tail` command displays the last ten lines (by default)\
    \ of a text file:\n\n```\n tail longfile.txt\n```\n\nThe preceding command displays\
    \ the following text:\n\n```\n is available\nin every shell\nincluding the\nbash\
    \ shell\ncsh\nzsh\nksh\nand Bourne shell\n```\n\n**NOTE**\n\n*The last two lines\
    \ in the preceding output are blank lines (not a typographical error in this page).*\n\
    \nSimilarly, the `tail` command allows you to specify a different number of lines\
    \ to display: `tail –4 longfile.txt` displays the last 4 lines of `longfile.txt.`\n\
    \nUse the `more` command to display a screenful of data, as shown here:\n\n```\n\
    \ more longfile.txt\n```\n\nPress the `<spacebar>` to view the next screenful\
    \ of data, and press the `<return>` key to see the next line of text in a file.\
    \ Incidentally, some people prefer the `less` command, which generates essentially\
    \ the same output as the `more` command. (A geeky joke: “What’s less? It’s more.”)\n\
    \n#### **The Pipe Symbol**\n\nA very useful feature of Bash is its support for\
    \ the pipe symbol (“`|`”) that enables you to “pipe” or redirect the output of\
    \ one command to become the input of another command. The pipe command is very\
    \ handy when you want to perform a sequence of operations involving various Bash\
    \ commands.\n\nFor example, the following code snippet combines the `head` command\
    \ with the `cat` command and the pipe (“`|`”) symbol:\n\n```\n cat longfile.txt|\
    \ head -2\n```\n\nA technical point: the preceding command creates two `bash`\
    \ processes (more about processes later), whereas the command `head -2 longfile.txt`\
    \ only creates a single `bash` process.\n\nYou can use the `head` and `tail` commands\
    \ in more interesting ways. For example, the following command sequence displays\
    \ lines 11 through 15 of `longfile.txt:`\n\n```\n head -15 longfile.txt |tail\
    \ -5\n```\n\nThe preceding command displays the following text:\n\n```\n and if\
    \ you\nuse the cat\ncommand the\nfile contents\nscroll\n```\n\nDisplay the line\
    \ numbers for the preceding output as follows:\n\n```\n cat –n longfile.txt |\
    \ head -15 | tail -5\n```\n\nThe preceding command displays the following text:\n\
    \n```\n 11       and if you\n      12       use the cat\n      13       command\
    \ the\n      14       file contents\n      15       scroll\n```\n\nYou won’t see\
    \ the “tab” character from the output, but it’s visible if you redirect the previous\
    \ command sequence to a file and then use the “-t” option with the `cat` command:\n\
    \n```\n cat  -n longfile.txt | head -15 | tail -5 > 1\ncat  -t 1\n     11^Iand\
    \ if you\n     12^Iuse the cat\n     13^Icommand the\n     14^Ifile contents\n\
    \     15^Iscroll\n```\n\n#### **The `fold` Command**"
