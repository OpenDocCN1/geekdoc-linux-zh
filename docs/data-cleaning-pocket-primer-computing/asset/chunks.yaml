    \n```\n 4520 12\n4520 15\n5530 5\n5530 12\n6550 0\n6550 8\n7200 50\n7200 10\n\
    7200 30\n8000 25\n8000 45\n8000 90\n```\n\n### **The Backslash Character and the\
    \ `grep` Command**\n\nThe “\\” character has a special interpretation when it’s\
    \ followed by the following characters:\n\n“`\\b`” = Match the empty string at\
    \ the edge of a word.\n\n“`\\B`” = Match the empty string provided it’s not at\
    \ the edge of a word, so:\n\n    “\\brat\\b” matches the separate word “rat” but\
    \ not “crate,” and\n\n    “\\Brat\\B” matches “crate” but not “furry rat.”\n\n\
    “`\\<`” = Match the empty string at the beginning of a word.\n\n“`\\>`” = Match\
    \ the empty string at the end of a word.\n\n“`\\w`” = Match word constituent,\
    \ it is a synonym for “[_[:alnum:]].”\n\n“`\\W`” = Match non-word constituent,\
    \ it is a synonym for “[^_[:alnum:]].”\n\n“`\\s`” = Match whitespace, it is a\
    \ synonym for “[[:space:]].”\n\n“`\\S`” = Match non-whitespace, it is a synonym\
    \ for “[^[:space:]].”\n\n### **Multiple Matches in the `grep` Command**\n\nIn\
    \ an earlier example you saw how to use the `–i` option to perform a case insensitive\
    \ match. However, you can also use the pipe “|” symbol to specify more than one\
    \ sequence of regular expressions.\n\nFor example, the following `grep` expression\
    \ matches any line that contains “one” as well as any line that contains “`ONE\
    \ TWO`”:\n\n```\n grep \"one\\|ONE TWO\" columns5.txt\n```\n\nThe output of the\
    \ preceding `grep` command is here:\n\n```\n one eno\nONE TWO OWT ENO\n```\n\n\
    Although the preceding `grep` command specifies a pair of character strings, you\
    \ can specify an arbitrary number of character sequences or regular expressions,\
    \ as long as you put \"`\\|`\" between each thing you want to match.\n\n### **The\
    \ `grep` Command and the `xargs` Command**\n\nThe `xargs` command is often used\
    \ in conjunction with the `find` command in bash. For example, you can search\
    \ for the files under the current directory (including subdirectories) that have\
    \ the `sh` suffix and then check which one of those files contains the string\
    \ `abc,` as shown here:\n\n```\n find . –print |grep \"sh$\" | xargs grep –l abc\n\
    ```\n\nA more useful combination of the `find` and `xargs` commands is shown here:\n\
    \n```\n find . -mtime -7 -name \"*.sh\" –print | xargs grep –l abc\n```\n\nThe\
    \ preceding command searches for all the files (including subdirectories) with\
    \ suffix “`sh`” that have not been modified in at least seven days, and pipes\
    \ that list to the `xargs` command, which displays the files that contain the\
    \ string `abc` (case insensitive).\n\nThe `find` command supports many options,\
    \ which can be combined via AND as well as OR in order to create very complex\
    \ expressions."
