  raw: "```\n printf \"%-5s %-10s %-4s\\n\" ABC DEF GHI\nprintf \"%-5s %-10s %-4.2f\\\
    n\" ABC DEF 12.3456\n```\n\nMake the shell script executable and then launch the\
    \ shell script, after which you will see the following output:\n\n```\n ABC  \
    \   DEF           GHI\nABC     DEF           12.35\n```\n\nOn the other hand,\
    \ if you type the following pair of commands:\n\n```\n echo \"ABC DEF GHI\"\n\
    echo \"ABC DEF 12.3456\"\n```\n\nyou will see the following output:\n\n```\n ABC\
    \ DEF GHI\nABC DEF 12.3456\n```\n\nA detailed (and very lengthy) discussion regarding\
    \ the `printf` statement and the `echo` command is here:\n\n*https://unix.stackexchange.com/questions/65803/why-is-printf-better-than-echo.*\n\
    \n### **The `echo` Command and Whitespaces**\n\nThe `echo` command preserves whitespaces\
    \ in variables, but in some cases the results might be different from your expectations.\n\
    \n[Listing 1.1](#chap1.xhtml_li1-1) displays the contents of `EchoCut.sh` that\
    \ illustrates the differences that can occur when the `echo` command is used with\
    \ the `cut` command.\n\n##### ***LISTING 1.1\\. EchoCut.sh***\n\n```\n x1=\"123\
    \    456    789\"\nx2=\"123 456 789\"\necho \"x1 = $x1\"\necho \"x2 = $x2\"\n\
    ```\n\n```\n x3=`echo $x1   | cut -c1-7`\nx4=`echo \"$x1\" | cut -c1-7`\nx5=`echo\
    \ $x2   | cut -c1-7`\necho \"x3 = $x3\"\necho \"x4 = $x4\"\necho \"x5 = $x5\"\n\
    ```\n\nLaunch the code in [Listing 1.1](#chap1.xhtml_li1-1) and you will see the\
    \ following output:\n\n```\n x1 = 123   456 789\nx2 = 123 456 789\nx3 = 123 456\n\
    x4 = 123   4\nx5 = 123 456\n```\n\nThe value of `x3` is probably different from\
    \ what you expected: there is only one blank space between `123` and `456` instead\
    \ of the three blank spaces that appear in the definition of the variable `x1`.\n\
    \nThis seemingly minor detail is important when you write shell scripts that check\
    \ the values contained in specific columns of text files, such as payroll files\
    \ and other files with financial data. The solution involves the use of double\
    \ quote marks (and sometimes the `IFS` variable that is discussed in [Chapter\
    \ 2](#chap2.xhtml)) that you can see in the definition of `x4`.\n\n### **Command\
    \ Substitution (“back tick”)**\n\nThe “back tick” or command substitution feature\
    \ of the Bourne shell is very powerful and enables you to combine multiple bash\
    \ commands. You can also write very compact and powerful (and complicated) shell\
    \ scripts with command substitution. The syntax is to simply precede and follow\
    \ your command with a “`” (back tick) character. In [Listing 1.2](#chap1.xhtml_li1-2),\
    \ the back tick command is `` `ls *py` ``\n\n[Listing 1.2](#chap1.xhtml_li1-2)\
    \ displays the contents of `CommandSubst.sh` that displays a subset of the list\
    \ of files in a directory.\n\n##### ***LISTING 1.2\\. CommandSubst.sh***\n\n```\n\
    \ for f in `ls *py`\ndo\n  echo \"file is: $f\"\ndone\n```\n\n[Listing 1.2](#chap1.xhtml_li1-2)\
    \ contains a `for` loop that displays the filenames (in the current directory)\
    \ that have a “py” suffix.\n\nThe output of [Listing 1.2](#chap1.xhtml_li1-2)\
    \ on my MacBook is here:\n\n```\n file is: CapitalizeList.py\nfile is: CompareStrings.py\n\
    file is: FixedColumnCount1.py\nfile is: FixedColumnWidth1.py\nfile is: LongestShortest1.py\n\
    file is: My2DMatrix.pyß\nfile is: PythonBash.py\nfile is: PythonBash2.py\nfile\
    \ is: StringChars1.py\nfile is: Triangular1.py\nfile is: Triangular2.py\nfile\
    \ is: Zip1.py\n```\n\n**NOTE**\n\n*The output depends on whether or not you have\
    \ any files with a `.py` suffix in the directory where you execute `CommandSubst.sh`.*\n\
    \n### **Setting Environment Variables via Shell Scripts**\n\nA very important\
    \ concept when using shell scripts is that any variables set inside the script\
    \ are no longer set when the script finishes executing. The rules are shown as\
    \ follows:\n\n![](images/square.jpg)If a variable isn’t set in a script, but is\
    \ already defined before the script is executed, that variable will also be available\
    \ inside the script.\n\n![](images/square.jpg)If a variable is set in a script,\
    \ it will override any existing variable with the same name after the variable\
    \ is set, but once the script ends, the variable will revert to its old value\
    \ (or to no value, if it did not exist outside the shell script).\n\nFor example,\
    \ if your `$HOME` directory is `/Users/jsmith`, but inside a script on row 10\
    \ you define `$HOME` to be `/Users/common/bin`, then the value of `$HOME` is initially\
    \ `/Users/jsmith` for rows 1–9, then becomes `/Users/common/bin` on row 10, and\
    \ maintains that value until the last command in the shell script is executed.\
    \ Then the value reverts to `/ Users/jsmith`.\n\nThe reason for this behavior\
    \ is related to how Unix structures its processes (known as “shells,” hence the\
    \ term “shell script”). That discussion is beyond the scope of this book.\n\n\
    Therefore, the default behavior is that if you set the value of a variable in\
    \ a shell script, then that variable (and its value) exist only for the duration\
    \ of the execution of the shell script. There is a simple “workaround” whereby\
    \ variables “hold” their values after a shell script has completed, and you’ll\
    \ learn how to do so in a subsequent section.\n\nJust to make sure that the distinction\
    \ is clear, consider [Listing 1.3](#chap1.xhtml_li1-3) that displays the contents\
    \ of the shell script `abc.sh`.\n\n##### ***LISTING 1.3\\. abc.sh***\n\n```\n\
    \ export x=\"123\"\necho \"inside abc.sh\"\necho \"x = $x\"\n```\n\nMake sure\
    \ that `abc.sh` is an executable shell script with the `chmod` command (as shown\
    \ earlier in this chapter) and then launch the following sequence of commands\
    \ from the command line:\n\n```\n export x=\"tom\"\necho \"x = $x\"\n./abc.sh\n\
    echo \"x = $x\"\n```\n\nThe output from the preceding commands is here:\n\n```\n\
    \ x = tom\ninside abc.sh\nx = 123\nx = tom\n```\n\nAs you can see, the value that\
    \ is assigned to the variable `x` is only for the duration of the process associated\
    \ with the shell script `abc.sh`. After execution has competed, the process terminates\
    \ and the value of `x` reverts to its original value. Fortunately, there is a\
    \ way to ensure that the values of variables in a shell script can be “set” for\
    \ the current shell, a technique called “sourcing” the shell script, as described\
    \ in the next section.\n\n#### **Sourcing or “Dotting” a Shell Script**\n\nNow\
    \ execute the following sequence of commands:\n\n```\n export x=\"tom smith\"\n\
    echo \"x = $x\"\n. abc.sh\necho \"x = $x\"\n```\n\nThe output from the preceding\
    \ commands is here:\n\n```\n x = \"tom smith\"\ninside abc.sh\nx = 123\nx = 123\n\
    ```\n\nIn the preceding code block, the value assigned to the variable `x` inside\
    \ the shell script `abc.sh` overrides its previously defined value because “sourcing”\
    \ (also called “dotting”) a shell script does not create a new process. Consequently,\
    \ if a shell script assigns a new value to an existing variable, that new value\
    \ is placed in the current environment and the previously defined value is lost.\n\
    \n### **Working with Arrays**\n\nArrays are critical to data management and appear\
    \ in a variety of real world contexts. It is a common problem to want to group\
    \ related data elements together, then reference it within a row.\n\nFor example,\
    \ at a volunteer event you might have to sign in and provide your name, address,\
    \ and phone number so they can contact you later for future events. That related\
    \ data could be thought of (and defined in bash) as:\n\n```\n volunteer[0] = name\n\
    volunteer[1] = Address\nvolunteer[2] = phone number\n```\n\nThe sign-in list could\
    \ be then captured as a file that used an internal field separator [`IFS`] to\
    \ make each row a volunteer, and each data element (name, address, phone number)\
    \ distinct, easy to use with a later `bash` script (or any other programming language\
    \ or program that understands the concept of `IFS`)."
