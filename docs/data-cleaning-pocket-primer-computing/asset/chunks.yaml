    To add the `Python` directory to the path for a particular session in bash:


    ```bash

    export PATH="$PATH:/usr/local/bin/python"

    ```


    In Bourne shell or ksh shell enter this command:


    ```bash

    PATH="$PATH:/usr/local/bin/python"

    ```


    **NOTE**


    `/usr/local/bin` is the location of the `Python` executable


    ## Specifying Aliases and Environment Variables


    The following command defines an environment variable called `h1:`:


    ```bash

    h1=$HOME/test

    ```


    Now if you enter the following command:


    ```bash

    echo $h1

    ```


    you will see the following output on OS X:


    ```

    /Users/jsmith/test

    ```


    The next code snippet shows you how to set the alias `ll` so that it displays
    a long listing of a directory:


    ```bash

    alias ll="ls -l"

    ```


    The following three alias definitions involve the `ls` command and various switches:


    ```bash

    alias ll="ls -l"

    alias lt="ls -lt"

    alias ltr="ls -ltr"

    ```


    As an example, you can replace the command `ls -ltr` (the letters “l,” “t,” and
    “r”) that you saw earlier in the chapter with the `ltr` alias, and you will see
    the same reversed time-based long listing of filenames (reproduced here):


    ```

    total 56

    -rwx------ 1 ocampesato staff 176 Jan 06 19:21 ssl-instructions.txt

    -rw-r--r-- 1 ocampesato staff  12 Jan 06 19:21 output.txt

    -rw-r--r-- 1 ocampesato staff  11 Jan 06 19:21 outfile.txt

    -rwx------ 1 ocampesato staff  12 Jan 06 19:21 kyrgyzstan.txt

    -rwx------ 1 ocampesato staff 478 Jan 06 19:21 iphonemeetup.txt

    -rwx------ 1 ocampesato staff 146 Jan 06 19:21 checkin-commands.txt

    -rwx------ 1 ocampesato staff  25 Jan 06 19:21 apple-care.txt

    ```


    You can also define an alias that contains the Bash pipe (`|`) symbol:


    ```bash

    alias ltrm="ls -ltr|more"

    ```


    In a similar manner, you can define aliases for directory related commands:


    ```bash

    alias ltd="ls -lt | grep ''^d''"

    alias ltdm="ls -lt | grep ''^d''|more"

    ```


    ## Finding Executable Files


    There are several commands available for finding executable files (binary files
    or shell scripts) by searching the directories in the `PATH` environment variable:
    `which`, `whence`, `whereis`, and `whatis`. These commands produce results similar
    to the `which` command, as discussed below.


    The `which` command gives the full path to whatever executable that you specify
    or a blank line if the executable is not in any directory that is specified in
    the `PATH` environment variable. This is useful for finding out whether a particular
    command or utility is installed on the system.


    ```bash

    which rm

    ```


    The output of the preceding command is here:


    ```

    /usr/bin/rm

    ```


    The `whereis` command provides the information that you get from the `where` command,
    and also the location of the `man` page of the executable:


    ```bash

    $whereis rm

    rm: /bin/rm /usr/share/man/man1/rm.1.bz2

    ```


    The `whatis` command looks up the specified command in the `whatis` database,
    which is useful for identifying system commands and important configuration files.
    Consider it a simplified “man” command, which displays concise details about `bash`
    commands (e.g., type `man ls` and you will see several pages of explanation regarding
    the `ls` command).


    ## What Are Shell Scripts?


    Shell scripts contain `bash` commands, which are executed sequentially from top
    to bottom (i.e., in the sequence that they appear in a shell script), unless they
    are defined inside a function. In particular, user-defined functions in shell
    scripts are executed in the order that they are invoked instead of in the order
    that they appear in the shell script. However, you can change the sequence in
    which commands are executed by using conditional logic, case statements, loops,
    and functions.


    ## Shell scripts can contain whatever `bash` commands are available on your system
    (but be aware that some commands require the `sudo` command, which in turn requires
    a password). Simple examples of shell scripts include file-related commands that
    create files, read data from files, and update the contents of files. Regardless
    of the contents of your shell scripts, they are interpreted “on the fly,” so there
    are no compilation steps that create a binary executable.


    The purpose of shell scripts is to automate the process of executing a set of
    `bash` commands so that you don’t need to execute them manually from the command
    line. If you need to execute a simple command from the command line, then it’s
    unlikely that you need to do so via a shell script: just type the command and
    press the `<RETURN>` key. Note that the `bash crontab` utility enables you to
    schedule the execution of shell scripts at various points in time (the `crontab`
    utility is outside the scope of this book).


    As you probably know, comments are important in source code. A good shell script
    contains meaningful comments, which are preceded by `#`.


    ## A Shell Script


    Create the file `test.sh` using your favorite text editor with the following contents:


    ```bash

    #!/bin/bash

    pwd

    ls

    mkdir /tmp

    touch /tmp/abc

    ls

    ```


    Make this script executable:


    ```bash

    chmod +x test.sh

    ```


    Now execute the script:


    ```bash

    ./test.sh

    ```


    The output will be:


    ```

    /tmp

    ... (list of /tmp)

    /tmp

    ... (list of /tmp including abc)

    ```

