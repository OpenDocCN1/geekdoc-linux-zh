    \ searches (\"looks inside\") zip files for the hard-coded string `svg`. If you\
    \ want to search for some other string in a set of zip files, then manually replace\
    \ this string with that other string. Alternatively, you can prompt users for\
    \ a search string so you don't need to make manual modifications to the shell\
    \ script.\n\nFor your convenience, [Listing A.6](#appendix.xhtml_liA-6) displays\
    \ the contents of `searchstrings.sh` that illustrates how to enter one or more\
    \ strings on the command line, in order to search for those strings in the zip\
    \ files in the current directory.\n\n##### ***LISTING A.6: searchstrings.sh***\n\
    \n```\n foundlist=\"\"\n\nnotfoundlist=\"\"\n\nif [ \"$#\" == 0 ]\n\nthen\n\n\
    \    echo \"Usage: $0 <string-list>\"\n\n    exit\n\nfi\n\n      zipfiles=`ls\
    \ *zip 2>/dev/null`\n\nif [ \"$zipfiles\" = \"\" ]\n\nthen\n\n     echo \"***\
    \ No zip files in `pwd` ***\"\n\n     exit\n\nfi\n\nfor str in \"$@\"\n\ndo\n\n\
    echo \"Checking zip files for $str:\"\n\nfor f in `ls *zip`\n\ndo\n\n  found=`unzip\
    \ -v $f |grep \"$str\"`\n\n  if [ \"$found\" != \"\" ]\n\n  then\n\n    foundlist=\"\
