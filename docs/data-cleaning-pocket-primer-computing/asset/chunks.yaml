    \n### **Useful Switches in `sed`**\n\nThe three command line switches `-n, -e`,\
    \ and `-i` are useful when you specify them with the `sed` command.\n\nAs a review,\
    \ specify `-n` when you want to suppress the printing of the basic stream output:\n\
    \n```\n sed -n 's/foo/bar/'\n```\n\nSpecify `-n` and end with `/p'` when you want\
    \ to match the result only:\n\n```\n sed -n 's/foo/bar/p'\n```\n\nWe briefly touched\
    \ on using `-e` to do multiple substitutions, but it can also be used to combine\
    \ other commands. This syntax lets us separate the commands in the last example:\n\
    \n```\n sed -n -e 's/foo/bar/' -e 'p'\n```\n\nA more advanced example that hints\
    \ at the flexibility of `sed` involves the insertion of a character after a fixed\
    \ number of positions. For example, consider the following code snippet:\n\n```\n\
    \ echo \"ABCDEFGHIJKLMNOPQRSTUVWXYZ\" | sed \"s/.\\{3\\}/&\\n/g\"\n```\n\nThe\
    \ output from the preceding command is here:\n\n```\n ABCnDEFnGHInJKLnMNOnPQRnSTUnVWXnYZ\n\
    ```\n\nWhile the above example does not seem especially useful, consider a large\
    \ text stream with no line breaks (everything on one line). You could use something\
    \ like this to insert newline characters, or something else to break the data\
    \ into easier to process chunks. It is possible to work through exactly what `sed`\
    \ is doing by looking at each element of the command and comparing it to the output,\
    \ even if you don’t know the syntax. (Tip: sometimes you will encounter very complex\
    \ instructions for `sed` without any documentation in the code: try not to be\
    \ that person when coding.)\n\nThe output is changing after every three characters\
    \ and we know dot (.) matches any single character, so .`{3}` must be telling\
    \ it to do that (with escape slashes \\ because brackets are a special character\
    \ for `sed`, and it won’t interpret it properly if we just leave it as .`{3}`.\
    \ The “`n`” is clear enough in the replacement column, so the “`&\\`” must be\
    \ somehow telling it to insert a character instead of replacing it. The terminal\
    \ g command of course means to repeat. To clarify and confirm those guesses, take\
    \ what you could infer and perform an Internet search.\n\n### **Working with Datasets**\n\
    \nThe `sed` utility is very useful for manipulating the contents of text files.\
    \ For example, you can print ranges of lines, and subsets of lines that match\
    \ a regular expression. You can also perform search-and-replace on the lines in\
    \ a text file. This section contains examples that illustrate how to perform such\
    \ functionality.\n\n#### **Printing Lines**\n\n[Listing 4.4](#chap4.xhtml_li4-4)\
    \ displays the contents of `test4.txt` (doubled-spaced lines) that are used for\
    \ several examples in this section.\n\n##### *LISTING 4.4 test4.txt*\n\n```\n\
    \ abc\n\ndef\n\nabc\n\nabc\n```\n\nThe following code snippet prints the first\
    \ 3 lines in `test4.txt` (we used this syntax before when deleting rows; it is\
    \ equally useful for printing):\n\n```\n cat test4.txt |sed -n \"1,3p\"\n```\n\
    \nThe output of the preceding code snippet is here (the second line is blank):\n\
    \n```\n abc\n\ndef\n```\n\nThe following code snippet prints lines 3 through 5\
    \ in `test4.txt:`\n\n```\n cat test4.txt |sed -n \"3,5p\"\n```\n\nThe output of\
    \ the preceding code snippet is here:\n\n```\n def\n\nabc\n```\n\nThe following\
    \ code snippet takes advantage of the basic output stream and the second match\
    \ stream to duplicate every line (including blank lines) in `test4.txt:`\n\n```\n\
    \ cat test4.txt |sed \"p\"\n```\n\nThe output of the preceding code snippet is\
    \ here:\n\n```\n abc\nabc\n\ndef\ndef\n\nabc\nabc\n\nabc\nabc\n```\n\nThe following\
    \ code snippet prints the first three lines and then capitalizes the string `abc`,\
    \ duplicating `ABC` in the final output because we did not use `-n` and did end\
    \ with `/p\"` in the second `sed` command. Remember that `/p\"` only prints the\
    \ text that matched the `sed` command, where the basic output prints the whole\
    \ file, which is why `def` does not get duplicated:\n\n```\n cat test4.txt |sed\
    \ -n \"1,3p\" |sed \"s/abc/ABC/p\"\nABC\nABC\n\ndef\n```\n\n#### **Character Classes\
    \ and `sed`**\n\nYou can also use regular expressions with `sed`. As a reminder,\
    \ here are the contents of `columns4.txt:`\n\n```\n 123 ONE TWO\n456 three four\n\
    ONE TWO THREE FOUR\nfive 123 six\none two three\nfour five\n```\n\nAs our first\
    \ example involving sed and character classes, the following code snippet illustrates\
    \ how to match lines that contain lowercase letters:\n\n```\n cat columns4.txt\
    \ | sed -n '/[0-9]/p'\n```\n\nThe output from the preceding snippet is here:\n\
    \n```\n one two three\none two\none two three four\none\none three\none four\n\
    ```\n\nThe following code snippet illustrates how to match lines that contain\
    \ lowercase letters:\n\n```\n cat columns4.txt | sed -n '/[a-z]/p'\n```\n\nThe\
    \ output from the preceding snippet is here:\n\n```\n 123 ONE TWO\n456 three four\n\
    five 123 six\n```\n\nThe following code snippet illustrates how to match lines\
    \ that contain the numbers 4, 5, or 6:\n\n```\n cat columns4.txt | sed -n '/[4-6]/p'\n\
    ```\n\nThe output from the preceding snippet is here:\n\n```\n 456 three four\n\
    ```\n\nThe following code snippet illustrates how to match lines that start with\
    \ any two characters followed by `EE:`\n\n```\n cat columns4.txt | sed -n '/^.\\\
    {2\\}EE*/p'\n```\n\nThe output from the preceding snippet is here:\n\n```\n ONE\
    \ TWO THREE FOUR\n```\n\n#### **Removing Control Characters**\n\n[Listing 4.5](#chap4.xhtml_li4-5)\
    \ displays the contents of `controlchars.txt` that we used before in [Chapter\
    \ 2](#chap2.xhtml). Control characters of any kind can be removed by `sed` just\
    \ like any other character.\n\n##### *LISTING 4.5 controlchars.txt*\n\n```\n 1\
    \ carriage return^M\n2 carriage return^M\n1 tab character^I\n```\n\nThe following\
    \ command removes the carriage return and the tab characters from the text file\
    \ `ControlChars.txt:`\n\n```\n cat controlChars.txt | sed \"s/^M//\" |sed \"s/\
    \   //\"\n```\n\nYou cannot see the tab character in the second `sed` command\
    \ in the preceding code snippet; however, if you redirect the output to the file\
    \ `nocontrol1.txt`, you can see that there are no embedded control characters\
    \ in this new file by typing the following command:\n\n```\n cat –t nocontrol1.txt\n\
    ```\n\n### **Counting Words in a Dataset**"
