  trans: "\n\n# 删除数据集中的交替行\n\nListing 5.4 显示了 `linepairs.csv` 的内容，Listing 5.5 显示了\
    \ `deletelines.sh` 的内容，这说明了如何打印数据集 `linepairs.csv` 中恰好两列的交替行。\n\n### 列表 5.4 linepairs.csv\n\
    ```\na,b,c,d\ne,f,g,h\n1,2,3,4\n5,6,7,8\n```\n\n### 列表 5.5 deletelines.sh\n```\n\
    inputfile=\"linepairs.csv\"\noutputfile=\"linepairsdeleted.csv\"\nawk ' NR%2 {printf\
    \ \"%s\", $0; print \"\"; next}' < $inputfile >\n$outputfile\n```\n\nListing 5.5\
    \ 检查当前记录数 `NR` 是否能被 2 整除，如果是，则打印当前行并跳过数据集中的下一行。输出被重定向到指定的输出文件，其内容如下：\n\n```\n\
    a,b,c,d\n1,2,3,4\n```\n\n一个稍微常见的任务涉及合并连续行，这是下一节的主题。\n\n# 合并数据集中的行\n\nListing 5.6\
    \ 显示了 `columns.txt` 的内容，Listing 5.7 显示了 `ColumnCount1.sh` 的内容，这说明了如何打印文本文件 `columns.txt`\
    \ 中恰好两列的行。\n\n### 列表 5.6 columns.txt\n```\none two three\none two\none two three\
    \ four\none\none three\none four\n```\n\n### 列表 5.7 ColumnCount1.sh\n```\nawk\n\
    {\n   if( NF == 2 ) { print $0 }\n}\n' columns.txt\n```\n\nListing 5.7 逻辑非常直观：如果当前记录数是偶数，则打印当前行（即跳过奇数行行）。运行\
    \ Listing 5.7 中的代码输出如下：\n\n```\none two\none three\none four\n```\n\n如果你想显示*不包含*\
    \ 2 列的行，请使用以下代码片段：\n\n```\nif( NF != 2 ) { print $0 }\n```\n\n## 将文件内容作为单行打印\n\
    \n`test4.txt` 的内容如下（注意空行）：\n\n```\nabc\ndef\nabc\nabc\n```\n\n以下代码片段说明了如何将 `test4.txt`\
    \ 的内容打印为单行：\n\n```\nawk '{printf(\"%s\", $0)}' test4.txt\n```\n\n上一个代码片段的输出在这里。在阅读下一段的解释之前，试着猜看发生了什么：\n\
    \n```\nAbdefabcabc\n```\n\n解释：这里的 `%s` 是 `printf,` 命令的记录分隔符语法，在它后面加上引号意味着记录分隔符是空字段\
    \ \"\"\"\"。`awk` 的默认记录分隔符是 `\\n`（换行符）；`printf` 正在做的是移除所有的换行符。空行将完全消失，因为它们只包含换行符，所以结果是任何实际文本都合并在一起，中间没有任何内容。如果我们在\
    \ `%s` 和结束引号之间添加一个空格，那么每个字符块之间将有一个空格，外加每个换行符额外多出一个空格。\n\n注意下面的注释是如何帮助理解代码片段的：\n\
    \n```\n# 通过移除换行符将所有文本合并为单行\nawk '{printf(\"%s\", $0)}' test4.txt\n```\n\n## 合并文本文件中的行组\n\
    \nListing 5.8 显示了 `digits.txt` 的内容，Listing 5.9 显示了 `digits.sh` 的内容，它“合并”了文件 `digits.txt`\
    \ 中的三行连续文本。\n\n### 列表 5.8 digits.txt\n```\n1\n2\n3\n4\n5\n6\n7\n8\n9\n```\n\n\
    ### 列表 5.9 digits.sh\n```\nawk -F\" \" '{\n  printf(\"%d\",$0)\n  if(NR % 3 ==\
    \ 0) { printf(\"\\n\") }\n}' digits.txt\n```\n\nListing 5.9 将三行连续文本打印在同一行，之后打印一个换行符。这产生了“合并”每三行连续文本的效果。运行\
    \ `digits.sh` 的输出如下：\n\n```\n123\n456\n789\n```\n\n## 合并文本文件中的交替行\n\nListing 5.10\
    \ 显示了 `columns2.txt` 的内容，Listing 5.11 显示了 `JoinLines.sh` 的内容，它“合并”了文件 `columns2.txt`\
    \ 中的两行连续文本。\n\n### 列表 5.10 columns2.txt\n```\none two\nthree four\nfive six\n\
    seven eight\n```\n\n### 列表 5.11 JoinLines.sh\n```\nawk\n{\n     printf.s\", $0)\n\
    \     if(NR % 2 == 0) { printf(\"\\n\") }\n}\n' columns2.txt\n```\n\n"
- fmt: "\n```\nawk ' $2 == 300 { print $1, $3 }' products.txt\n```\n\nThe output of\
    \ the preceding code snippet is here:\n\n```\nTablet new\nTablet used\n```\n\n\
    The following code snippet prints the first and third columns of the lines of\
    \ text in `products.txt` that start with the string `Tablet:`\n\n```\nawk '/^Tablet/\
    \ { print $1, $3 }' products.txt\n```\n\nThe output of the preceding code snippet\
    \ is here:\n\n```\nTablet new\nTablet used\n```\n\n### Splitting Filenames with\
    \ `awk`\n\n[Listing 5.18](#chap5.xhtml_li5-18) displays the contents of `SplitFilename2.sh,`\
    \ which illustrates how to split a filename containing the “`.` character in order\
    \ to increment the numeric value of one of the components of the filename. Note\
    \ that this code only works for a file name with exactly the expected syntax.\
    \ It is possible to write more complex code to count the number of segments, or\
    \ alternately to just say “change the field right before the `.zip`”, which would\
    \ only require that the filename have a format matching the final two sections\
    \ (`<anystructure>.number.zip`).\n\n#### LISTING 5.18 SplitFilename2.sh\n\n```\n\
    echo \"05.20.144q.az.1.zip\" | awk -F\".\" '\n{\n  f5=$5 + 1\n  printf(\"%s.%s.%s.%s.%s.%s\"\
    ,$1,$2,$3,$4,f5,$6)\n}'\n```\n\nThe output from [Listing 5.18](#chap5.xhtml_li5-18)\
    \ is here:\n\n```\n05.20.144q.az.2.zip\n```\n\n### Working with Postfix Arithmetic\
    \ Operators\n\n[Listing 5.19](#chap5.xhtml_li5-19) displays the contents of `mixednumbers.txt`\
    \ that contain postfix operators, which means numbers where the negative (and/or\
    \ positive) sign appears at the end of a column value instead of at the beginning\
    \ of the number.\n\n#### LISTING 5.19 mixednumbers.txt\n\n```\n324.000-|10|983.000-\n\
    453.000-|30|298.000-\n783.000-|20|347.000-\n```\n\n[Listing 5.20](#chap5.xhtml_li5-20)\
    \ displays the contents of `AddSubtract1.sh,` which illustrates how to add the\
    \ rows of numbers in [Listing 5.19](#chap5.xhtml_li5-19).\n\n#### LISTING 5.20\
    \ AddSubtract1.sh\n\n```\nmyFile=\"mixednumbers.txt\"\nawk -F\"|\" '\nBEGIN {\
    \ line = 0; total = 0 }\n{\n   split($1, arr, \"-\")\n   f1 = arr[1]\n   if($1\
    \ ~ /-/) { f1 = -f1 }\n   line += f1\n\n   split($2, arr, \"-\")\n   f2 = arr[1]\n\
    \   if($2 ~ /-/) { f2 = -f2 }\n   line += f2\n\n   split($3, arr, \"-\")\n   f3\
    \ = arr[1]\n   if($3 ~ /-/) { f3 = -f3 }\n   line += f3\n\n   printf(\"f1: %d\
    \ f2: %d f3: %d line: %d\\n\",f1,f2,f3, line)\n   total += line\n   line = 0\n\
    }\nEND { print \"Total: \",total }\n' $myfile\n```\n\nThe output from [Listing\
    \ 5.20](#chap5.xhtml_li5-20) is here. See if you can work out what the code is\
    \ doing before reading the explanation that follows:\n\n```\nf1: -324 f2: 10 f3:\
    \ -983 line: -1297\nf1: -453 f2: 30 f3: -298 line: -721\nf1: -783 f2: 20 f3: -347\
    \ line: -1110\nTotal:  -3128\n```\n\nThe code assumes we know the format of the\
    \ file. For each field in a given record, the `split` function returns a vector\
    \ of length two, where the first position = number, the second position either\
    \ an empty value or a dash, after which the first position number is “captured”\
    \ into a variable. The `if` statement just sees if the original field has a dash\
    \ in it. If the field has a dash, then the numeric variable is made negative,\
    \ otherwise it is left alone. Then it adds the line up.\n\n### Numeric Functions\
    \ in `awk`\n\nThe `int(x)` function returns the integer portion of a number. If\
    \ the number is not already an integer, it falls between two integers. Of the\
    \ two possible integers, the function will return the one closest to zero. This\
    \ is different from a rounding function, which chooses the closer integer.\n\n\
    For example, `int(3)` is 3, `int(3.9)` is 3, `int(-3.9)` is -3, and `int(-3)`\
    \ is `-3` as well. An example of the `int(x)` function in an `awk` command is\
    \ here:\n\n```\nawk 'BEGIN {\n   print int(3)\n   print int(3.9)\n   print int(-3.9)\n\
    \   print int(-3)\n}'\n```\n\n### One-Line `awk` Commands\n\nThe code snippets\
    \ in this section reference the text file `short1.txt,` which you can populate\
    \ with any data of your choice.\n\nThe following code snippet prints each line\
    \ preceded by the number of fields in each line:\n\n```\nawk '{print NF \":\"\
    \ $0}' short1.txt\n```\n\nPrint the right-most field in each line:\n\n```\nawk\
    \ '{print $NF}' short1.txt\n```\n\nPrint the lines that contain more than 2 fields:\n\
    \n```\nawk '{if(NF > 2) print }' short1.txt\n```\n\nPrint the value of the right-most\
    \ field if the current line contains more than 2 fields:\n\n```\nawk '{if(NF >\
    \ 2) print $NF }' short1.txt\n```\n"
  raw: "```\n awk ' $2 == 300 { print $1, $3 }' products.txt\n```\n\nThe output of\
    \ the preceding code snippet is here:\n\n```\n Tablet new\nTablet used\n```\n\n\
    The following code snippet prints the first and third columns of the lines of\
    \ text in `products.txt` that start with the string `Tablet:`\n\n```\n awk '/^Tablet/\
    \ { print $1, $3 }' products.txt\n```\n\nThe output of the preceding code snippet\
    \ is here:\n\n```\n Tablet new\nTablet used\n```\n\n### **Splitting Filenames\
    \ with `awk`**\n\n[Listing 5.18](#chap5.xhtml_li5-18) displays the contents of\
    \ `SplitFilename2.sh,` which illustrates how to split a filename containing the\
    \ “.” character in order to increment the numeric value of one of the components\
    \ of the filename. Note that this code only works for a file name with exactly\
    \ the expected syntax. It is possible to write more complex code to count the\
    \ number of segments, or alternately to just say “change the field right before\
    \ the .zip”, which would only require that the filename have a format matching\
    \ the final two sections (<anystructure>.number.zip).\n\n##### ***LISTING 5.18\
    \ SplitFilename2.sh***\n\n```\n echo \"05.20.144q.az.1.zip\" | awk -F\".\" '\n\
    {\n  f5=$5 + 1\n  printf(\"%s.%s.%s.%s.%s.%s\",$1,$2,$3,$4,f5,$6)\n}'\n```\n\n\
    The output from [Listing 5.18](#chap5.xhtml_li5-18) is here:\n\n```\n 05.20.144q.az.2.zip\n\
    ```\n\n### **Working with Postfix Arithmetic Operators**\n\n[Listing 5.19](#chap5.xhtml_li5-19)\
    \ displays the contents of `mixednumbers.txt` that contain postfix operators,\
    \ which means numbers where the negative (and/or positive) sign appears at the\
    \ end of a column value instead of at the beginning of the number.\n\n##### ***LISTING\
    \ 5.19 mixednumbers.txt***\n\n```\n 324.000-|10|983.000-\n453.000-|30|298.000-\n\
    783.000-|20|347.000-\n```\n\n[Listing 5.20](#chap5.xhtml_li5-20) displays the\
    \ contents of `AddSubtract1.sh,` which illustrates how to add the rows of numbers\
    \ in [Listing 5.19](#chap5.xhtml_li5-19).\n\n##### ***LISTING 5.20 AddSubtract1.sh***\n\
    \n```\n myFile=\"mixednumbers.txt\"\nawk -F\"|\" '\nBEGIN { line = 0; total =\
    \ 0 }\n{\n   split($1, arr, \"-\")\n   f1 = arr[1]\n   if($1 ~ /-/) { f1 = -f1\
    \ }\n   line += f1\n\n   split($2, arr, \"-\")\n   f2 = arr[1]\n   if($2 ~ /-/)\
    \ { f2 = -f2 }\n   line += f2\n\n   split($3, arr, \"-\")\n   f3 = arr[1]\n  \
    \ if($3 ~ /-/) { f3 = -f3 }\n   line += f3\n\n   printf(\"f1: %d f2: %d f3: %d\
    \ line: %d\\n\",f1,f2,f3, line)\n   total += line\n   line = 0\n}\nEND { print\
    \ \"Total: \",total }\n' $myfile\n```\n\nThe output from [Listing 5.20](#chap5.xhtml_li5-20)\
    \ is here. See if you can work out what the code is doing before reading the explanation\
    \ that follows:\n\n```\n f1: -324 f2: 10 f3: -983 line: -1297\nf1: -453 f2: 30\
    \ f3: -298 line: -721\nf1: -783 f2: 20 f3: -347 line: -1110\nTotal:  -3128\n```\n\
    \nThe code assumes we know the format of the file. For each field in a given record,\
    \ the `split` function returns a vector of length two, where the first position\
    \ = number, the second position either an empty value or a dash, after which the\
    \ first position number is “captured” into a variable. The `if` statement just\
    \ sees if the original field has a dash in it. If the field has a dash, then the\
    \ numeric variable is made negative, otherwise it is left alone. Then it adds\
    \ the line up.\n\n### **Numeric Functions in `awk`**\n\nThe `int(x)` function\
    \ returns the integer portion of a number. If the number is not already an integer,\
    \ it falls between two integers. Of the two possible integers, the function will\
    \ return the one closest to zero. This is different from a rounding function,\
    \ which chooses the closer integer.\n\nFor example, `int(3)` is 3, `int(3.9)`\
    \ is 3, `int(-3.9)` is -3, and `int(-3)` is `-3` as well. An example of the `int(x)`\
    \ function in an `awk` command is here:\n\n```\n awk 'BEGIN {\n   print int(3.534);\n\
    \   print int(4);\n   print int(-5.223);\n   print int(-5);\n}'\n```\n\nThe output\
    \ is here:\n\n```\n 3\n4\n-5\n-5\n```\n\nThe `exp(x)` function gives you the exponential\
    \ of `x`, or reports an error if x is out of range. The range of values `x` can\
    \ have depends on your machine’s floating point representation.\n\n```\n awk 'BEGIN{\n\
    \   print exp(123434346);\n   print exp(0);\n   print exp(-12);\n}'\n```\n\nThe\
    \ output is here:\n\n```\n inf\n1\n6.14421e-06\n```\n\nThe `log(x)` function gives\
    \ you the natural logarithm of `x,` if `x` is positive; otherwise, it reports\
    \ an error (`inf` means infinity and `nan` in output means “not a number”).\n\n\
    ```\n awk 'BEGIN{\n  print log(12);\n  print log(0);\n  print log(1);\n  print\
    \ log(-1);\n}'\n```\n\nThe output is here:\n\n```\n 2.48491\n-inf\n0\nnan\n```\n\
    \nThe `sin(x)` function gives you the sine of `x` and `cos(x)` gives you the cosine\
    \ of `x,` with `x` in radians:\n\n```\n awk 'BEGIN {\n   print cos(90);\n   print\
    \ cos(45);\n}'\n```\n\nThe output is here:\n\n```\n -0.448074\n0.525322\n```\n\
    \nThe `rand()` function gives you a random number. The values of `rand()` are\
    \ uniformly distributed between 0 and 1: the value is never 0 and never 1.\n\n\
    Often you want random integers instead. Here is a user-defined function you can\
    \ use to obtain a random, nonnegative integer less than n:\n\n```\n function randint(n)\
    \ {\n     return int(n * rand())\n}\n```\n\nThe product produces a random real\
    \ number greater than 0 and less than n. We then make it an integer (using int)\
    \ between 0 and n - 1.\n\nHere is an example where a similar function is used\
    \ to produce random integers between 1 and n:\n\n```\n awk '\n# Function to roll\
    \ a simulated die.\nfunction roll(n) { return 1 + int(rand() * n) }\n# Roll 3\
    \ six-sided dice and print total number of points.\n{\n      printf(\"%d points\\\
    n\", roll(6)+roll(6)+roll(6))\n}'\n```\n\nNote that `rand` starts generating numbers\
    \ from the same point (or “seed”) each time `awk` is invoked. Hence, a program\
    \ will produce the same results each time it is launched. If you want a program\
    \ to do different things each time it is used, you must change the seed to a value\
    \ that will be different in each run.\n\nUse the `srand(x)` function to set the\
    \ starting point, or seed, for generating random numbers to the value `x.` Each\
    \ seed value leads to a particular sequence of “random” numbers. Thus, if you\
    \ set the seed to the same value a second time, you will get the same sequence\
    \ of “random” numbers again. If you omit the argument x, as in `srand()`, then\
    \ the current date and time of day are used for a seed. This is how to obtain\
    \ random numbers that are truly unpredictable. The return value of `srand()` is\
    \ the previous seed. This makes it easy to keep track of the seeds for use in\
    \ consistently reproducing sequences of random numbers.\n\nThe `time()` function\
    \ (not in all versions of `awk`) returns the current time in seconds since January\
    \ 1, 1970\\. The function `ctime` (not in all versions of `awk`) takes a numeric\
    \ argument in seconds and returns a string representing the corresponding date,\
    \ suitable for printing or further processing.\n\nThe `sqrt(x)` function gives\
    \ you the positive square root of `x.` It reports an error if x is negative. Thus,\
    \ `sqrt(4)` is 2.\n\n```\n awk 'BEGIN{\n   print sqrt(16);\n   print sqrt(0);\n\
    \   print sqrt(-12);\n}'\n```\n\nThe output is here:\n\n```\n 4\n0\nnan\n```\n\
    \n### **One-Line `awk` Commands**\n\nThe code snippets in this section reference\
    \ the text file `short1.txt,` which you can populate with any data of your choice.\n\
    \nThe following code snippet prints each line preceded by the number of fields\
    \ in each line:\n\n```\n awk '{print NF \":\" $0}' short1.txt\n```\n\nPrint the\
    \ right-most field in each line:\n\n```\n awk '{print $NF}' short1.txt\n```\n\n\
    Print the lines that contain more than 2 fields:\n\n```\n awk '{if(NF > 2) print\
    \ }' short1.txt\n```\n\nPrint the value of the right-most field if the current\
    \ line contains more than 2 fields:\n\n```\n awk '{if(NF > 2) print $NF }' short1.txt\n\
    ```\n\nRemove leading and trailing whitespaces:\n\n```\n echo \" a b c \" | awk\
    \ '{gsub(/^[ \\t]+|[ \\t]+$/,\"\");print}'\n```\n\nPrint the first and third fields\
    \ in reverse order for the lines that contain at least `3` fields:\n\n```\n awk\
    \ '{if(NF > 2) print $3, $1}' short1.txt\n```\n\nPrint the lines that contain\
    \ the string one:\n\n```\n awk '{if(/one/) print }' *txt\n```"
