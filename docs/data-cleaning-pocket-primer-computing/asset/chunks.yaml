    \n## CHAPTER 4: TRANSFORMING DATA WITH `sed`\n\nIn the prior chapter, we learned\
    \ how to reduce a stream of data to only the contents that interested us. In this\
    \ chapter, we learn how to transform that data using the Unix `sed` utility, which\
    \ is an acronym for “stream editor.”\n\nThe first part of this chapter contains\
    \ basic examples of the `sed` command, such as replacing and deleting strings,\
    \ numbers, and letters. The second part of this chapter discusses various switches\
    \ that are available for the `sed` command, along with an example of replacing\
    \ multiple delimiters with a single delimiter in a dataset. In the final section\
    \ you will see a number of examples of how to perform stream-oriented processing\
    \ on datasets, bringing the capabilities of `sed` together with the commands and\
    \ regular expressions from prior chapters to accomplish difficult tasks with relatively\
    \ simple code.\n\n### What Is the `sed` Command?\n\nThe name `sed` is an acronym\
    \ for “stream editor,” and the utility derives many of its commands from the `ed`\
    \ line-editor (`ed` was the first UNIX text editor). The `sed` command is a “non-interactive”\
    \ stream-oriented editor that can be used to automate editing via shell scripts.\
    \ This ability to modify an entire stream of data (which can be the contents of\
    \ multiple files, in a manner similar to how `grep` behaves) as if you were inside\
    \ an editor is not common in modern programming languages. This behavior allows\
    \ some capabilities not easily duplicated elsewhere, while behaving exactly like\
    \ any other command (`grep`, `cat`, `ls`, `find`, and so forth) in how it can\
    \ accept data, output data, and pattern match with regular expressions.\n\nSome\
    \ of the more common uses for `sed` include: print matching lines, delete matching\
    \ lines, and find/replace matching strings or regular expressions.\n\n### The\
    \ `sed` Execution Cycle\n\nWhenever you invoke the `sed` command, an execution\
    \ cycle refers to various options that are specified and executed until the end\
    \ of the file/input is reached. Specifically, an execution cycle performs the\
    \ following steps:\n\n1. Reads an entire line from `stdin/file`.\n2. Removes any\
    \ trailing newline.\n3. Places the line in its pattern buffer.\n4. Modifies the\
    \ pattern buffer according to the supplied commands.\n5. Prints the pattern buffer\
    \ to `stdout`.\n\n### Matching String Patterns Using `sed`\n\nThe `sed` command\
    \ requires you to specify a string in order to match the lines in a file. For\
    \ example, suppose that the file `numbers.txt` contains the following lines:\n\
    \n```\n 1\n2\n123\n3\nfive\n4\n```\n\nThe following `sed` command prints all the\
    \ lines that contain the string 3:\n\n```\n cat numbers.txt |sed –n \"/3/p\"\n\
    ```\n\nAnother way to produce the same result:\n\n```\n sed –n \"/3/p\" numbers.txt\n\
    ```\n\nIn both cases the output of the preceding commands is as follows:\n\n```\n\
    \ 123\n3\n```\n"
