    ```\n\n### **Using a Semicolon to Separate Commands**\n\nYou can combine multiple\
    \ commands with a semicolon (“;”), as shown here:\n\n```\n cd /tmp; pwd; cd ~;\
    \ pwd\n```\n\nThe preceding code snippet navigates to the `/tmp` directory, prints\
    \ the full path to the current directory, returns to the previous directory, and\
    \ again prints the full path to the current directory. The output of the preceding\
    \ command is here:\n\n```\n /tmp\n/Users/jsmith\n```\n\nYou can use command substitution\
    \ (discussed in a later section) to assign the output to a variable, as shown\
    \ here:\n\n```\n x=`cd /tmp; pwd; cd ~; pwd`\necho $x\n```\n\nThe output of the\
    \ preceding snippet is here:\n\n```\n /tmp /Users/jsmith\n```\n\n### **The `printf`\
    \ Command and the echo Command**\n\nIn brief, use the `printf` command instead\
    \ of the `echo` command if you need to control the output format. One key difference\
    \ is that the `echo` command prints a newline character whereas the `printf` statement\
    \ does not print a newline character. Keep this point in mind when you see the\
    \ `printf` statement in the `awk` code samples in [Chapter 5](#chap5.xhtml).\n\
