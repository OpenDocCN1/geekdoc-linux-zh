  trans: "\n如从前面的代码段所示，使用 `awk` 命令中的简单条件逻辑和内置变量很容易从文本文件中提取信息或行列的子集。\n\n## 有用的短 `awk`\
    \ 脚本\n\n本节包含了一组基于 `awk` 的短脚本，用于执行各种操作。其中某些脚本也可以用于其他 shell 脚本，以执行更复杂的操作。列表 5.21\
    \ 显示了文件 `data.txt` 的内容，该文件在本节的各个代码示例中被使用。\n\n### LIST 5.21 data.txt\n\n```\n this\
    \ is line one that contains more than 40 characters\nthis is line two\nthis is\
    \ line three that also contains more than 40 characters\nfour\nthis is line six\
    \ and the preceding line is empty\nline eight and the preceding line is also empty\n\
    ```\n\n以下代码段打印所有超过 40 个字符的行：\n\n```\n awk 'length($0) > 40' data.txt\n```\n\n\
    现在打印 `data.txt` 中最长行的长度：\n\n```\n awk '{ if (x < length()) x = length() }\nEND\
    \ { print \"maximum line length is \" x }' < data.txt\n```\n\n输入通过 `expand` 工具进行处理，将制表符转换为空格，因此比较的宽度实际上是右边界列。\n\
    \n打印每个至少包含一个字段的行：\n\n```\n awk 'NF > 0' data.txt\n```\n\n上一个代码段说明了从文件中删除空行的简单方法（或者说，创建一个与旧文件相似但删除了空行的新文件）。\n\
    \n打印从 0 到 100（包含在内）的七个随机数：\n\n```\n awk 'BEGIN { for (i = 1; i <= 7; i++)\nprint\
    \ int(101 * rand()) }'\n```\n\n统计文件的行数：\n\n```\n awk 'END { print NR }' < data.txt\n\
    ```\n\n打印数据文件中的偶数行：\n\n```\n awk 'NR % 2 == 0' data.txt\n```\n\n如果你在前面的代码段中使用表达式\
    \ `'NR % 2 == 1'`，程序将打印奇数行。\n\n在文本文件中每行后面插入一个重复行：\n\n```\n awk '{print $0, '\\\
    n', $0}' < data.txt\n```\n\n在文本文件中每行后面插入一个重复行并删除空行：\n\n```\n awk '{print $0, \"\
    \\n\", $0}' < data.txt | awk 'NF > 0'\n```\n\n在文本文件的每行后面插入一个空行：\n\n```\n awk '{print\
    \ $0, \"\\n\"}' < data.txt\n```\n\n## 在 awk 中打印文本字符串中的单词\n\n列表 5.22 显示了 `Fields2.sh`\
    \ 内容，说明了如何使用 `awk` 命令打印文本字符串中的单词。\n\n### LIST 5.22 Fields2.sh\n\n```\n echo \"\
    a b c d e\"| awk '\n{\n  for(i=1; i<=NF; i++) {\n     print \"Field \",i,\":$i\n\
    }\n}\n'\n```\n\n列表 5.22 的输出如下：\n\n```\n Field  1 : a\nField  2 : b\nField  3 :\
    \ c\nField  4 : d\nField  5 : e\n```\n\n## 在特定行中统计字符串的出现次数\n\n列表 5.23 和 列表 5.24\
    \ 分别显示了 `data1.csv` 和 `data2.csv` 内容，列表 5.25 显示了 `checkrows.sh` 内容，说明了如何统计 2、5、7\
    \ 行第 3 列中字符串“past”的出现次数。\n\n### LIST 5.23 data1.csv\n\n```\n in,the,past,or,the,present\n\
    for,the,past,or,the,present\nin,the,past,or,the,present\nfor,the,paste,or,the,future\n\
    in,the,past,or,the,present\ncompletely,unrelated,line1\nin,the,past,or,the,present\n\
    completely,unrelated,line2\n```\n\n### LIST 5.24 data2.csv\n\n```\n in,the,past,or,the,present\n\
    completely,unrelated,line1\nfor,the,past,or,the,present\ncompletely,unrelated,line2\n\
    for,the,paste,or,the,future\nin,the,past,or,the,present\nin,the,past,or,the,present\n\
    completely,unrelated,line3\n```\n\n### LIST 5.25 checkrows.sh\n\n```\n files=\"\
    `ls data*.csv| tr '\\n' ' '`\"\necho \"List of files: $files\"\nawk -F\",\" '\n\
    ( FNR==2 || FNR==5 || FNR==7 ) {\n    if ( $3 ~ \"past\" ) { count++ }\n}\nEND\
    \ {\n    printf \"past: %d times (INACT) \", count\n    printf \"in field 3 in\
    \ lines 2/5/7\\n}' data*.csv\n```\n\n列表 5.25 因为由于以下代码段，它在第 2、5、7 列中查找字符串 `past`\
    \ 的出现情况：\n\n```\n ( FNR==2 || FNR==5 || FNR==7 ) {\n    if ( $3 ~ \"past\" ) {\
    \ count++ }\n}\n```\n\n如果发生匹配，则 `count` 的值加增。`END` 块报告在第 2、5、7 列中找到字符串 `past`\
    \ 的次数。注意，像 `paste` 和 `pasted` 字符串也会匹配字符串 `past`。列表 5.25 的输出如下：\n\n```\n List of\
    \ files: data1.csv data2.csv\npast: matched 5 times (INACT) in field 3 in lines\
    \ 2/5/7\n```\n\nshell 脚本 `checkrows2.sh` 将 `checkrows.sh` 中的术语 `$3 ~ \"past\"\
    ` 替换为 `$3 == \"past\"` 以进行精确匹配，这产生以下输出：\n\n```\n List of files: data1.csv data2.csv\n\
    past: matched 4 times (EXACT) in field 3 in lines 2/5/7\n```\n\n## 在固定列数的字符串中打印每行\n\
    \n列表 5.26 显示了 `FixedCount1.sh` 内容，说明了如何使用 `awk` 命令在字符串中打印每行。\n\n### LIST 5.26\
    \ FixedCount1.sh\n\n```\n echo \"this is line one that contains more than 40 characters\n\
    this is line two\nthis is line three that also contains more than 40 characters\n\
    four\nthis is line six and the preceding line is empty\nline eight and the preceding\
    \ line is also empty\" | tr ' ' '\\n' | awk '{print $0, \"\\n\", $0}'\n```\n\n\
    ```列表 5.26 的输出如下：\n\n```\n this is line one that contains more than 40 characters\n\
    this is line two\nthis is line three that also contains more than 40 characters\n\
    four\nthis is line six and the preceding line is empty\nline eight and the preceding\
    \ line is also empty\n```\n\n## 在固定列数的文本中打印单词\n\n列表 5.27 显示了 `VariableColumns.txt`\
    \ 内容，其包含不同列数的行。\n\n### LIST 5.27 VariableColumns.txt\n\n```\n this is line one\
    \ that contains more than 40 characters\nthis is line two\nthis is line three\
    \ that also contains more than 40 characters\nfour\nthis is line six and the preceding\
    \ line is empty\nline eight and the preceding line is also empty\n```\n\n列表 5.28\
    \ 显示了 `Fields3.sh` 内容，说明了如何使用 `awk` 命令在字符串中打印每行的单词。\n\n### LIST 5.28 Fields3.sh\n\
    \n```\n echo \"a b c d e\"| awk '\n{\n  for(i=1; i<=NF; i++) {\n     print \"\
    Field \",i,\":$i\n}\n}\n'\n```\n\n```列表 5.28 的输出如下：\n\n```\n Field  1 : a\nField\
    \  2 : b\nField  3 : c\nField  4 : d\nField  5 : e\n```\n\n## 在固定列数的文本集中对对\n\n\
    如果你已经阅读了前面的两个示例，本节的代码示例很容易理解：你将看到如何对齐那些内容正确但放置在不同行（因此未对齐）的数据。列表 5.29 显示了 `mixed-data.csv`\
    \ 中未对齐的值。此外，列表 5.28 中的第一行和最后一行是空行，它们将被本节的 shell 脚本删除。\n\n### LIST 5.29 mixed-data.csv\n\
    \n```\n in,the,past,or,the,present\nfor,the,past,or,the,present\nin,the,past,or,the,present\n\
    for,the,paste,or,the,future\nin,the,past,or,the,present\ncompletely,unrelated,line1\n\
    in,the,past,or,the,present\ncompletely,unrelated,line2\n```\n\n列表 5.30 显示了 `mixed-rows.sh`\
    \ 内容，说明了如何对齐列表 5.29 中的数据集。\n\n### LIST 5.30 mixed-rows.sh\n\n```\n #-----------------------------------------\n\
    # 1) 删除空行\n# 2) 移除换行符\n# 3) 每四个字段后打印换行符\n# 4) 移除每行末尾的逗号\n#-----------------------------------------\n\
    inputfile=\"mixed-data.csv\"\ngrep -v \"^$\" $inputfile |awk -F\",\" '{printf(\"\
    %s\",$0)}' | awk '\nBEGIN { columnCount = 4 }\n{\n   for(i=1; i<=NF; i++) {\n\
    \     printf(\"%s \", $i)\n     if( i % columnCount == 0) { print \"\" }\n   }\n\
    }' > temp-columns\n# 4) 移除输出末尾的逗号：\ncat temp-columns | sed 's/, $//' | sed 's/\
    \ $//' > $outputfile\n```\n"
- fmt: "\n[Listing 5.30](#chap5.xhtml_li5-30) starts with a `grep` command that removes\
    \ blank lines, followed by an `awk` command that prints the rows of the dataset\
    \ as a single line of text. The second `awk` command initializes the `columnCount`\
    \ variable with the value 4 in the `BEGIN` block, followed by a `for` loop that\
    \ iterates through the input fields. After four fields are printed on the same\
    \ output line, a linefeed is printed, which has the effect of realigning the input\
    \ dataset as an output dataset consisting of rows that have four fields. The output\
    \ from [Listing 5.30](#chap5.xhtml_li5-30) is here:\n\n```\n Sara, Jones, 1000,\
    \ CA\nSally, Smith, 2000, IL\nDave, Jones, 3000, FL\nJohn, Jones, 4000, CA\nDave,\
    \ Jones, 5000, NY\nMike, Jones, 6000, NY\nTony, Jones, 7000, WA\n```\n\n### Aligning\
    \ Columns and Multiple Rows in Datasets\n\nThe preceding section showed you how\
    \ to realign a dataset so that each row contains the same number of columns and\
    \ also represents a single data record. The code sample in this section illustrates\
    \ how to realign columns of data that are correct in terms of their content, and\
    \ also place two records in each line of the new dataset. [Listing 5.31](#chap5.xhtml_li5-31)\
    \ displays the contents of `mixed-data2.csv` with misaligned data values, followed\
    \ by [Listing 5.32](#chap5.xhtml_li5-32) that displays the contents of `aligned-data2.csv`\
    \ with the correctly formatted dataset.\n\n#### LISTING 5.31 mixed-data2.csv\n\
    \n```\n Sara, Jones, 1000, CA, Sally, Smith, 2000, IL,\nDave, Jones, 3000, FL,\
    \ John, Jones,\n4000, CA,\nDave, Jones, 5000, NY, Mike,\nJones, 6000, NY, Tony,\
    \ Jones, 7000, WA\n```\n\n#### LISTING 5.32 aligned-data2.csv\n\n```\n Sara, Jones,\
    \ 1000, CA, Sally, Smith, 2000, IL\nDave, Jones, 3000, FL, John, Jones, 4000,\
    \ CA\nDave, Jones, 5000, NY, Mike, Jones, 6000, NY\nTony, Jones, 7000, WA\n```\n\
    \n[Listing 5.33](#chap5.xhtml_li5-33) displays the contents of `mixed-data2.sh,`\
    \ which illustrates how to realign the dataset in Listing 5.31.\n\n#### LISTING\
    \ 5.33 mixed-data2.sh\n\n```bash\n #-----------------------------------------\n\
    # 1) remove blank lines\n# 2) remove line feeds\n# 3) print a LF after every 8\
    \ fields\n# 4) remove trailing ',' from each row\n#-----------------------------------------\n\
    inputfile=\"mixed-data2.txt\"\noutputfile=\"aligned-data2.txt\"\ngrep -v \"^$\"\
    \ $inputfile |awk -F\",\" '{printf(\"%s\",$0)}' | awk '\nBEGIN { columnCount =\
    \ 4; rowCount = 2; currRow = 0 }\n{\n   for(i=1; i<=NF; i++) {\n     printf(\"\
    %s \", $i)\n     if( i % columnCount == 0) { ++currRow }\n     if(currRow > 0\
    \ && currRow % rowCount == 0) {currRow = 0;\nprint \"\"}\n   }\n}' > temp-columns\n\
    # 4) remove trailing ',' from output:\ncat temp-columns | sed 's/, $//' | sed\
    \ 's/ $//' > $outputfile\n```\n\n[Listing 5.33](#chap5.xhtml_li5-33) is very similar\
    \ to [Listing 5.30](#chap5.xhtml_li5-30). The key idea is to print a linefeed\
    \ character after a pair of “normal” records have been processed, which is implemented\
    \ via the code that is shown in bold in [Listing 5.33](#chap5.xhtml_li5-33).\n\
    \nNow you can generalize [Listing 5.33](#chap5.xhtml_li5-33) very easily by changing\
    \ the initial value of the `rowCount` variable to any other positive integer,\
    \ and the code will work correctly without any further modification. For example,\
    \ if you initialize `rowCount` to the value `5,` then every row in the new dataset\
    \ (with the possible exception of the final output row) will contain 5 “normal”\
    \ data records.\n\n### Removing a Column from a Text File\n\n[Listing 5.34](#chap5.xhtml_li5-34)\
    \ displays the contents of `VariableColumns.txt` with lines of text that contain\
    \ a different number of columns.\n\n#### LISTING 5.34 VariableColumns.txt\n\n\
    ```\n this is line one\nthis is line number one\nthis is the third and final line\n\
    ```\n\n[Listing 5.35](#chap5.xhtml_li5-35) displays the contents of `RemoveColumn.sh`\
    \ that removes the first column from a text file.\n\n#### LISTING 5.35 RemoveColumn.sh\n\
    \n```bash\n awk '{ for (i=2; i<=NF; i++) printf \"%s \", $i; printf \"\\n\"; }'\n\
    products.txt\n```\n\nThe loop is between `2` and `NF,` which iterates over all\
    \ the fields except the first field. In addition, `printf` adds newlines. The\
    \ output of the preceding code snippet is:\n\n```\n400 new\n300 new\n200 used\n\
    100 used\n```\n\n### Subsets of Columns of Even Rows\n\n[Listing 5.35](#chap5.xhtml_li5-35)\
    \ showed you how to align the rows of a dataset, and the code sample in this section\
    \ illustrates how to extract a subset of the existing columns and a subset of\
    \ the rows. [Listing 5.3](#chap5.xhtml_li5-36) displays the contents of `sub-rows-cols.txt`\
    \ of the desired dataset that contains two columns from every row of the file\
    \ `aligned-data.txt`.\n\n#### LISTING 5.36 sub-rows-cols.txt\n\n```\n Sara, Jones,\
    \ 1000\nDave, Jones, 3000\nDave, Jones, 5000\nTony, Jones, 7000\n```\n\n[Listing\
    \ 5.37](#chap5.xhtml_li5-37) displays the contents of `sub-rows-cols.sh,` which\
    \ illustrates how to generate the dataset in [Listing 5.36]. Most of the code\
    \ is the same as [Listing 5.33](#chap5.xhtml_li5-33), with the new code shown\
    \ in bold.\n\n#### LISTING 5.37 sub-rows-cols.sh\n\n```bash\n #-----------------------------------------\n\
    # 1) remove blank lines\n# 2) remove line feeds\n# 3) print a LF after every field\n\
    # 4) remove trailing ',' from each row\n#-----------------------------------------\n\
    inputfile=\"mixed-data2.txt\"\ngrep -v \"^$\" $inputfile |awk -F\",\" '{printf(\"\
    %s\",$0)}' | awk '\nBEGIN { columnCount = 4 }\n{\n   for(i=1; i<=NF; i++) {\n\
    \     printf(\"%s \", $i)\n     if( i % columnCount == 0) { print \"\" }\n   }\n\
    }' > temp-columns\n# 4) remove trailing ',' from output:\ncat temp-columns | sed\
    \ 's/, $//' | sed 's/ $//' > $outputfile\n```\n\n[Listing 5.37](#chap5.xhtml_li5-37)\
    \ contains a new block of code that redirects the output of step #4 to a temporary\
    \ file `temp-columns` whose contents are processed by another `awk` command in\
    \ the last section of [Listing 5.37]. Notice that the `awk` command contains a\
    \ `BEGIN` block that initializes the variables `rowCount` and `currRow` with the\
    \ values 2 and 0, respectively.\n\nThe main block prints columns 1 and 3 of the\
    \ current line if the current row number is even, and then the value of `currRow`\
    \ is incremented. The output of this `awk` command is redirected to yet another\
    \ temporary file that is the input to the final code snippet, which uses the `cat`\
    \ command and two occurrences of the `sed` command in order to remove a trailing\
    \ “,” and a trailing space, as shown here:\n\n```\ncat temp-columns3 | sed 's/,\
    \ $//' | sed 's/ $//' > $outputfile\n```\n\nKeep in mind that there are other\
    \ ways to perform the functionality in [Listing 5.37](#chap5.xhtml_li5-37), and\
    \ the main purpose is to show you different techniques for combining various bash\
    \ commands.\n\n### Counting Word Frequency in Datasets\n\n[Listing 5.38](#chap5.xhtml_li5-38)\
    \ displays the contents of `WordCounts1.sh,` which illustrates how to count the\
    \ frequency of words in a file.\n\n#### LISTING 5.38 WordCounts1.sh\n\n```bash\n\
    \ awk '\n# Print list of word frequencies\n{\n    for (i = 1; i <= NF; i++)\n\
    \        freq[$i]++\n}\nEND {\n    for (word in freq)\n        printf \"%s\\t%d\\\
    n\", word, freq[word]\n}\n' columns2.txt\n```\n\n[Listing 5.38](#chap5.xhtml_li5-38)\
    \ contains a block of code that processes the lines in `columns2.txt.` Each time\
    \ that a word (of a line) is encountered, the code increments the number of occurrences\
    \ of that word in the hash table `freq.` The `END` block contains a `for` loop\
    \ that displays the number of occurrences of each word in `columns2.txt.`\n\n\
    The output from [Listing 5.38](#chap5.xhtml_li5-38) is here:\n\n```\n two    3\n\
    one    3\nthree  3\nsix    1\nfour   3\nfive   2\n```\n\n[Listing 5.39](#chap5.xhtml_li5-39)\
    \ displays the contents of `WordCounts2.sh,` which performs a case insensitive\
    \ word count.\n"
