    ## 前言：数据清洗口袋指南


    ### **目标是什么？**


    本书的目标是向读者介绍一套强大、灵活且免费的数据处理和清洗命令。这些命令在 unix/linux 环境下开发了数十年，但现在只需少量的环境配置，即可在任何操作系统上运行。虽然所有的示例和脚本都使用
    `bash` 命令集，但许多概念可以转换为其他形式的 shell 脚本（`ksh`, `sh`, `csh`），包括命令之间管道传输数据的概念、正则表达式替换以及
    `sed` 和 `awk` 命令。


    ### **这本书适合我吗？我将学什么？**


    本书旨在数据科学家、数据分析师以及其他执行数据清洗任务并具备 shell 编程基础的人士。

