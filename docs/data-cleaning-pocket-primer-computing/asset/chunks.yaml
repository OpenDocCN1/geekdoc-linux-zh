    ### Summary\n\nIn this appendix, you saw examples of how to use some useful and\
    \ versatile `bash` commands. First you saw examples of shell scripts for various\
    \ tasks such as computing the `GCD` (greatest common divisor) and the `LCM` (lowest\
    \ common multiple) of two positive integers, the Fibonacci value of a positive\
    \ integer, and also the prime divisors of a positive integer. Next you saw a `bash`\
    \ script with the `grep` command, a `while` loop, and other constructs that append\
    \ data to a log file, with logic to determine when to exit the `bash` script.\
    \ In addition, you learned how to use the `grep` command to simulate a simple\
    \ database. In the final portion of this Appendix you learned how to use `awk`\
    \ to process records that span multiple lines, how to compute column sums and\
    \ averages involving multiple datasets, and how to use `awk`-related functions\
    \ as `gsub()` and `split()`. Finally, you learned how to dynamically calculate\
    \ combinations of columns from multiple datasets.\n\n## INDEX\n\n#### A\n\n`abc.sh`,\
