    \ will revert to its old value (or to no value, if it did not exist outside the\
    \ shell script).\n\n## Working with Arrays\n\nArrays are critical to data management\
    \ and appear in a variety of real world contexts. It is a common problem to want\
    \ to group related data elements together, then reference it within a row.\n\n\
    For example, at a volunteer event you might have to sign in and provide your name,\
    \ address, and phone number so they can contact you later for future events. That\
