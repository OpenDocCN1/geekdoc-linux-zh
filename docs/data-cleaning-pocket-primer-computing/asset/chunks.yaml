  trans: "\n\n### 列表 5.39 WordCounts2.sh\n\n```\n awk '\n{\n    # convert everything\
    \ to lower case\n    $0 = tolower($0)\n    # remove punctuation\n   #gsub(/[^[:alnum:]_[:blank:]]/,\
    \ \"\", $0)\n    for(i=1; i<=NF; i++) {\n        freq[$i]++\n    }\n}\nEND {\n\
    \    for(word in freq) {\n       printf \"%s\\t%d\\n\", word, freq[word]\n   \
    \ }\n}\n' columns4.txt\n```\n\n列表 5.39 与 列表 5.38 几乎相同，仅增加了以下代码片段，该片段将每个输入行的文本转换为小写字母，如下所示：\n\
    \n```\n $0 = tolower($0)\n```\n\n列表 5.40 显示了 `columns4.txt` 的内容。\n\n### 列表 5.40\
    \ columns4.txt\n\n```\n 123 ONE TWO\n456 three four\nONE TWO THREE FOUR\nfive\
    \ 123 six\none two three\nfour five\n```\n\n使用 `columns4.txt` 运行 列表 5.39 的输出如下：\n\
    \n```\n 456     1\ntwo     3\none     3\nthree   3\nsix     1\n123     2\nfour\
    \    3\nfive    2\n```\n\n### 在数据集中仅显示“纯”单词\n\n为了简单起见，让我们处理一个文本字符串，这样我们就可以实现解决方案的过程中看到中间结果。这个示例在之前的章节中已经很熟悉，但现在我们看到\
    \ `awk` 是如何实现它的。\n\n列表 5.41 显示了 `onlywords.sh` 的内容，它包含三个 `awk` 命令，分别用于显示文本字符串中的单词、整数和字母数字字符串。\n\
    \n### 列表 5.41 onlywords.sh\n\n```\n x=\"ghi abc Ghi 123 #def5 123z\" echo \"Only\
    \ words:\"\necho $x |tr -s ' ' '\\n' | awk -F\" \" '\n{\n  if($0 ~ /^[a-zA-Z]+$/)\
    \ { print $0 }\n}\n' | sort | uniq\necho\necho \"Only integers:\"\necho $x |tr\
    \ -s ' ' '\\n' | awk -F\" \" '\n{\n  if($0 ~ /^[0-9]+$/) { print $0 }\n}\n' |\
    \ sort | uniq\necho\necho \"Only alphanumeric words:\"\necho $x |tr -s ' ' '\\\
    n' | awk -F\" \" '\n{\n  if($0 ~ /^[0-9a-zA-Z]+$/) { print $0 }\n}\n' | sort |\
    \ uniq\necho\n```\n\n列表 5.41 首先初始化变量 `x`：\n\n```\n x=\"ghi abc Ghi 123 #def5 123z\"\
    \n```\n\n下一步是将 `x` 拆分为单词：\n\n```\n echo $x |tr -s ' ' '\\n'\n```\n\n输出如下：\n\n\
    ```\n ghi\nabc\nGhi\n123\n#def5\n123z\n```\n\n第三步是调用 `awk` 并检查匹配正则表达式 `^[a-zA-Z]+$`\
    \ 的单词，该表达式匹配任何由一个或多个大写和或小写字母组成的字符串（不包含其他字符）：\n\n```\n if($0 ~ /^[a-zA-Z]+$/) {\
    \ print $0 }\n```\n\n输出如下：\n\n```\n ghi\nabc\nGhi\n```\n\n最后，如果你想对输出进行排序并只打印唯一的单词，可以将\
    \ `awk` 命令的输出重定向到 `sort` 命令和 `uniq` 命令。\n\n第二个 `awk` 命令使用正则表达式 `^[0-9]+` 来检查整数，第三个\
    \ `awk` 命令使用正则表达式 `^[0-9a-zA-Z]+` 来检查字母数字单词。运行 列表 5.37 的输出如下：\n\n```\n Only words:\n\
    Ghi\nabc\nghi\n```\n\n```\n Only integers:\n123\n```\n\n```\n Only alphanumeric\
    \ words:\n123\n123z\nGhi\nabc\nghi\n```\n\n现在，你可以用数据集替换变量 `x`，以便从该数据集中仅提取字母字符串。\n\
    \n### 在 `awk` 中处理多行记录\n\n列表 5.42 显示了 `employee.txt` 的内容，列表 5.43 显示了 `Employees.sh`\
    \ 的内容，它说明了如何合并文件中的文本行。\n\n### 列表 5.42 employees.txt\n\n```\n Name:  Jane Edwards\n\
    EmpId: 12345\nAddress: 123 Main Street Chicago Illinois\nName:  John Smith\nEmpId:\
    \ 23456\nAddress: 432 Lombard Avenue SF California\n```\n\n### 列表 5.43 employees.sh\n\
    \n```\n inputfile=\"employees.txt\"\noutputfile=\"employees.txt\"\nawk '\n{\n\
    \  if($0 ~ /^Name:/) {\n    x = substr($0,6)\n  }\n  if($0 ~ /^Empid:/) {\n  \
    \  x = x \",\" substr($0,8)\n  }\n  if($0 ~ /^Address:/) {\n    x = x \",\" substr($0,9)\n\
    \    print x\n  }\n}' $inputfile > $outputfile\n```\n\n运行 列表 5.43 代码的输出如下：\n\n\
    ```\n Jane Edwards,12345,123 Main Street Chicago Illinois\n```\n\n现在你已经看到了了大量的\
    \ `awk` 代码段和 shell 脚本，它们说明了可以在文件和数据集上执行的各种任务，现在准备好进行一些用法了。下一节显示了如何将多个分隔符替换为单个分隔符，第二个用法显示了如何处理字符串。\n\
    \n### 简单用法\n\n本节的代码示例显示了如何使用 `awk` 命令来重新格式化数据集中的日期字段，并更改新数据集中字段顺序。例如，给定原始数据集中的以下输入行：\n\
    \n```\n Jane,Smith,20140805234658\n```\n\n输出数据集中的重新格式化的行格式如下：\n\n```\n 2014-08-05\
    \ 23:46:58,Jane,Smith\n```\n\n列表 5.46 显示了文件 `dates2.csv` 的内容，它包含一个 `,` 分隔符三个字段。\n\
    \n### 列表 5.46 dates2.csv\n\n```\n Jane,Smith,20140805234658\nJack,Jones,20170805234652\n\
    Dave,Stone,20160805234655\nJohn,Smith,20130805234646\nJean,Davis,20140805234649\n\
    Thad,Smith,20150805234637\nJack,Pruit,20160805234638\n```\n\n列表 5.45 显示了文件 `delim1.sh`\
    \ 的内容，它说明了如何将 `delim1.csv` 中的分隔符替换为 `,` 字符。\n\n### 列表 5.45 delim1.sh\n\n```\n\
