- fmt: '

    The back reference `\n,` where `n` is a single digit, matches the substring previously
    matched by the `n`th parenthesized sub-expression of the regular expression. For
    example, `grep` ''\\(a\)\1`'' matches “aa” and `grep` ''\\(a\)\2`'' matches “aaa.”


    When used with alternation, if the group does not participate in the match, then
    the back reference makes the whole match fail. For example, `grep` ''\a\(.\)|b\1`''
    will not match `ba` or `ab` or `bb` (or anything else really).


    If you have more than one regular expression inside a pair of parentheses, they
    are referenced (from left to right) by `\1, `\2,` . . ., `\9:`.


    ```

    grep -e ''\([a-z]\)\([0-9]\)\1'' is the same as this command:

    grep -e ''\([a-z]\)\([0-9]\)\([a-z]\)''

    grep -e ''\([a-z]\)\([0-9]\)\2'' is the same as this command:

    grep -e ''\([a-z]\)\([0-9]\)\([0-9]\)''

    ```


    The easiest way to think of it is that the number (for example, `\2`) is a placeholder
    or variable that saves you from typing the longer regular expression it references.
    As regular expressions can get extremely complex, this often helps code clarity.


    You can match consecutive digits or characters using the pattern `\([0-9]\)\1.`.
    For example, the following command is a successful match because the string “1223”
    contains a pair of consecutive identical digits:


    ```

    echo "1223" | grep -e ''\([0-9]\)\1''

    ```


    Similarly, the following command is a successful match because the string “12223”
    contains three consecutive occurrences of the digit `2:`.


    ```

    echo "12223" | grep -e ''\([0-9]\)\1\1''

    ```


    You can check for the occurrence of two identical digits separated by any character
    with this expression:


    ```

    echo "12z23" | grep -e ''\([0-9]\).\1''

    ```


    In an analogous manner, you can test for the occurrence of duplicate letters,
    as shown here:


    ```

    echo "abbc" | grep -e ''\([a-z]\)\1''

    ```


    The following example matches an IP address, and does not use back references,
    just the `\d` and `\.` Regular expressions to match digits and periods are as
    follows:


    ```

    echo "192.168.125.103" | grep -e

    ''\(\d\d\d\)\.\(\d\d\d\)\.\(\d\d\d\)\.\(\d\d\d\)''

    ```


    If you want to allow for fewer than three digits, you can use the expression `{1,3},`
    which matches 1, 2, or 3 digits on the third block. In a situation where any of
    the four blocks might have fewer than three characters, you must use the following
    type of syntax in all four blocks:


    ```

    echo "192.168.5.103" | grep -e

    ''\(\d\d\d\)\.\(\d\d\d\)\.\(\d\)\{1,3\}\.\(\d\d\d\)''

    ```


    You can perform more complex matches using back references. [Listing 3.3] displays
    the contents of `columns5.txt,` which contains several lines that are palindromes
    (the same spelling from left-to-right as right-to-left). Note that the third line
    is an empty line.


    ##### Listing 3.3 columns5.txt


    ```

    one eno

    ONE ENO

    ONE TWO OWT ENO

    four five

    ```


    The following command finds all lines that are palindromes:


    ```

    grep -w -e ''\(.\)\(.\).*\2\1'' columns5.txt

    ```


    The output of the preceding command is here:


    ```

    one eno

    ONE ENO

    ONE TWO OWT ENO

    ```


    The idea is as follows: the first `\(.\)` matches a set of letters, followed by
    a second `\(.\)` that matches a set of letters, followed by any number of intermediate
    characters. The sequence `\2\1` reverses the order of the matching sets of letters
    specified by the two consecutive occurrences of `\(.\)`.


    ### Finding Empty Lines in Datasets


    Recall that the metacharacter `^` refers to the beginning of a line and the metacharacter
    `$` refers to the end of a line. Thus, an empty line consists of the sequence
    `^$`. You can find the single empty in `columns5.txt` with this command:


    ```

    grep -n "^$" columns5.txt

    ```


    The output of the preceding `grep` command is here (use the `-n` switch to display
    line numbers, as blank lines will not otherwise show in the output):


    ```

    3:

    ```


    More commonly the goal is to simply strip the empty lines from a file. We can
    do that just by inverting the prior query (and not showing the line numbers):


    ```

    grep -v "^$" columns5.txt

    one eno

    ONE ENO

    ONE TWO OWT ENO

    four five

    ```


    As you can see, the preceding output displays four non-empty lines, and as we
    saw in the previous `grep` command, line #3 is an empty line.


    ### Using Keys to Search Datasets


    Data is often organized around unique values (typically numbers) in order to distinguish
    otherwise similar things: for example, `John Smith` the *manager* must not be
    confused with `John Smith` the *programmer* in an employee dataset. Hence, each
    record is assigned a unique number that will be used for all queries related to
    employees. Moreover, their names are merely data elements of a given record, rather
    than a means of identifying a record that contains a particular person.


    With the preceding points in mind, suppose that you have a text file in which
    each line contains a single key value. In addition, another text file consists
    of one or more lines, where each line contains a key value followed by a quantity
    value.


