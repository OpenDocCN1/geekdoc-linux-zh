    \ common variables.\n\n#### **The `env` Command**\n\nThe `env` (“environment”)\
    \ command displays the variables that are in your `bash` environment. An example\
    \ of the output of the `env` command is here:\n\n```\n SHELL=/bin/bash\nTERM=xterm-256color\n\
    TMPDIR=/var/folders/73/39lngcln4dj_scmgvsv53g_w0000gn/T/\nOLDPWD=/tmp\nTERM_SESSION_ID=63101060-9DF0-405E-84E1-EC56282F4803\n\
    USER=ocampesato\nCOMMAND_MODE=bash2003PATH=/opt/local/bin:/Users/ocampesato/\n\
    android-sdk-mac_86/platform-tools:/Users/ocampesato/\nandroid-sdk-mac_86/tools:/usr/local/bin:\n\
    PWD=/Users/ocampesato\nJAVA_HOME=/System/Library/Java/JavaVirtualMachines/1.6.0.jdk/\n\
    Contents/Home\nLANG=en_US.UTF-8\nNODE_PATH=/usr/local/lib/node_modules\nHOME=/Users/ocampesato\n\
    LOGNAME=ocampesato\nDISPLAY=/tmp/launch-xnTgkE/org.macosforge.xquartz:0\nSECURITYSESSIONID=186a4\n\
    _=/usr/bin/env\n```\n\nSome interesting examples of setting an environment variable\
    \ and also executing a command are described here:\n\n*https://stackoverflow.com/questions/13998075/setting-environment\
    \ -variable-for-one-program-call-in-bash-using-env.*\n\n#### **Useful Environment\
    \ Variables**\n\nThis section discusses some important environment variables,\
    \ most of which you probably will not need to modify, but it’s useful to be aware\
    \ of the existence of these variables and their purpose.\n\nThe `HOME` variable\
    \ contains the absolute path of the user’s home directory.\n\nThe `HOSTNAME` variable\
    \ specifies the Internet name of the host.\n\nThe `LOGNAME` variable specifies\
    \ the user’s login name.\n\nThe `PATH` variable specifies the search path (see\
    \ next subsection).\n\nThe `SHELL` variable specifies the absolute path of the\
    \ current shell.\n\nThe `USER` specifies the user’s current username. This value\
    \ might be different than the login name if a superuser executes the `su` command\
    \ to emulate another user’s permissions.\n\n#### **Setting the `PATH` Environment\
    \ Variable**\n\nPrograms and other executable files can live in many directories,\
    \ so operating systems provide a search path that lists the directories that the\
    \ OS searches for executable files. Adding a directory to your path means an executable\
    \ file can be called by just using the filename as a command, without having to\
    \ call out its entire path, just as if it resided in your working directory.\n\
    \nThe path is stored in an environment variable, which is a named string maintained\
    \ by the operating system. These variables contain information available to the\
    \ command shell and other programs.\n\nThe path variable is named `PATH` in `bash`\
    \ or `Path` in Windows (`bash` is case-sensitive; Windows is not).\n\nSetting\
    \ the path in `bash/Linux:`\n\n```\n export PATH=$HOME/anaconda:$PATH\n```"
