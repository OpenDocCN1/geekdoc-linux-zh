    \n```\n apple-care.txt\ncheckin-commands.txt\niphonemeetup.txt\nkyrgyzstan.txt\n\
    outfile.txt\noutput.txt\nssl-instructions.txt\n```\n\nThe command `ls -1` (the\
    \ letter “l”) displays a long listing of filenames:\n\n```\n total 56\n-rwx------\
    \  1 ocampesato staff  25  Jan 06 19:21 apple-care.txt\n-rwx------  1 ocampesato\
    \ staff 146  Jan 06 19:21 checkin-commands.txt\n-rwx------  1 ocampesato staff\
    \ 478  Jan 06 19:21 iphonemeetup.txt\n-rwx------  1 ocampesato staff  12  Jan\
    \ 06 19:21 kyrgyzstan.txt\n-rw-r--r--  1 ocampesato staff  11  Jan 06 19:21 outfile.txt\n\
    -rw-r--r--  1 ocampesato staff  12  Jan 06 19:21 output.txt\n-rwx------  1 ocampesato\
    \ staff 176  Jan 06 19:21 ssl-instructions.txt\n```\n\nThe command `ls -1t` (the\
    \ letters “l” and “t”) display a time-based long listing:\n\n```\n total 56\n\
    -rwx------1 ocampesato staff  25  Jan 06 19:21 apple-care.txt\n-rwx------1 ocampesato\
    \ staff 146  Jan 06 19:21 checkin-commands.txt\n-rwx------1 ocampesato staff 478\
    \  Jan 06 19:21 iphonemeetup.txt\n-rwx------1 ocampesato staff  12  Jan 06 19:21\
    \ kyrgyzstan.txt\n-rw-r--r--1 ocampesato staff  11  Jan 06 19:21 outfile.txt\n\
    -rw-r--r--1 ocampesato staff  12  Jan 06 19:21 output.txt\n-rwx------1 ocampesato\
    \ staff  176 Jan 06 19:21 ssl-instructions.txt\n```\n\nThe command `ls -ltr` (the\
    \ letters “l”, “t”, and “r”) display a reversed time-based long listing of filenames:\n\
    \n```\n total 56\n-rwx------1 ocampesato staff 176 Jan 06 19:21 ssl-instructions.txt\n\
    -rw-r--r--1 ocampesato staff  12 Jan 06 19:21 output.txt\n-rw-r--r--1 ocampesato\
    \ staff  11 Jan 06 19:21 outfile.txt\n-rwx------1 ocampesato staff  12 Jan 06\
    \ 19:21 kyrgyzstan.txt\n-rwx------1 ocampesato staff 478 Jan 06 19:21 iphonemeetup.txt\n\
    -rwx------1 ocampesato staff 146 Jan 06 19:21 checkin-commands.txt\n-rwx------1\
    \ ocampesato staff  25 Jan 06 19:21 apple-care.txt\n```\n\nHere is the description\
    \ about all the listed columns in the preceding output:\n\n- Column #1: represents\
    \ file type and permission given on the file (see the following)\n- Column #2:\
    \ shows the number of memory blocks taken by the file or directory\n- Column #3:\
    \ indicates the (Bash user) owner of the file\n- Column #4: represents group of\
    \ the owner\n- Column #5: represents file size in bytes\n- Column #6: shows the\
    \ date and time when this file was created or last modified\n- Column #7: represents\
    \ file or directory name\n\nIn the `ls -l` listing example, every file line began\
    \ with a d, -, or l. These characters indicate the type of file that’s listed.\
    \ These (and other) initial values are described as follows:\n\n| - | Regular\
    \ file (ASCII text file, binary executable, or hard link) |\n| b | Block special\
    \ file (such as a physical hard drive) |\n| c | Character special file (such as\
    \ a physical hard drive) |\n| d | Directory file that contains a listing of other\
    \ files and directories |\n| l | Symbolic link file |\n| p | Named pipe (a mechanism\
    \ for interprocess communications) |\n| s | Socket (for interprocess communication)\
    \ |\n\nConsult online documentation for more details regarding the `ls` command.\n\
    \n### Displaying Contents of Files\n\nNow let’s see how to display different lines\
    \ of text in a text file. You can use the `cat` command to display the entire\
    \ contents of a file, but it’s a good idea to first get some information about\
    \ the file contents. Specifically, use the `wc` command.\n\n### The `wc` Command\n\
    \nThe `wc` command counts the number of lines, words, and bytes in a file. When\
    \ you run `wc` on a file, it outputs something like this:\n\n```\n10 50 300 filename\n\
    ```\n\nThe output output represents the number of lines, words, and bytes, respectively.\
    \ You can use options with `wc` to count only one of these:\n\n- `wc -l`: counts\
    \ the number of lines\n- `wc -w`: counts the number of words\n- `wc -c`: counts\
    \ the number of bytes\n\nYou can also use `wc` on multiple files:\n\n```\nwc file1\
    \ file2\n```\n\nThe output will show the counts for each file.\n\n### The `head`\
    \ Command\n\nThe `head` command is used to display the first part of a file. By\
    \ default, it shows the first 10 lines. You can use the `-n` option to specify\
    \ the number of lines to display:\n\n```bash\nhead -n 5 filename\n```\n\nThis\
    \ will display the first 5 lines of `filename`.\n\n### The `tail` Command\n\n\
    The `tail` command is used to display the last part of a file. By default, it\
    \ shows the last 10 lines. You can use the `-n` option to specify the number of\
    \ lines to display:\n\n```bash\ntail -n 5 filename\n```\n\nThis will display the\
    \ last 5 lines of `filename`.\n\n### The `fold` Command\n\nThe `fold` command\
    \ is used to wrap lines in a file at a specified width.\n\n```bash\nfold -w 20\
    \ filename\n```\n\nThis will wrap the lines of `filename` at 20 characters.\n"
