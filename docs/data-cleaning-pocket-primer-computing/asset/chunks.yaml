    ```\n SKUVALUES=\"skuvalues.txt\"\n\nSKUSOLD=\"skusold.txt\"\n\nSKUPRICES=\"skuprices.txt\"\
    \n\nfor sku in `cat $SKUVALUES`\n\ndo\n  skuprice=`grep $sku $SKUPRICES | cut\
    \ -d\" \" -f2`\n  subtotal=`cat $SKUSOLD |grep $sku | awk '{total += $2} END\n\
    {print total}'`\n  total=`echo \"$subtotal * $skuprice\" |bc`\n  echo \"AMOUNT\
    \ SOLD FOR SKU $sku: $total\"\ndone\n```\n\n[Listing A.9](#appendix.xhtml_liA-9)\
    \ contains a slight enhancement: instead of computing the subtotals of the number\
    \ of units for each `SKU`, the revenue for each `SKU` is computed, where the revenue\
    \ for each item equals the price of the `SKU` multiplied by the number of units\
    \ sold for the given `SKU`. Launch `skutotals2.sh` and you will see the following\
    \ output:\n\n```\n AMOUNT SOLD FOR SKU 4520: 94.50\n\nAMOUNT SOLD FOR SKU 5530:\
    \ 85.00\n\nAMOUNT SOLD FOR SKU 6550: 22.00\n\nAMOUNT SOLD FOR SKU 7200: 562.50\n\
    \nAMOUNT SOLD FOR SKU 8000: 560.00\n```\n\n[Listing A.10](#appendix.xhtml_liA-10)\
    \ displays the contents of `skutotals3.sh` that calculates the minimum, maximum,\
    \ average, and total number of units sold for each `SKU` in `skuvalues.txt`.\n\
    \n### LISTING A.10: skutotals3.sh\n```\n SKUVALUES=\"skuvalues.txt\"\n\nSKUSOLD=\"\
    skusold.txt\"\n\nTOTALS=\"totalspersku.txt\"\n\nrm -f $TOTALS 2>/dev/null\n\n\
    ##############################\n#calculate totals for each sku\n\n##############################\n\
    \nfor sku in `cat $SKUVALUES`\n\ndo\n   total=`cat $SKUSOLD |grep $sku | awk '{total\
    \ += $2} END\n{print total}'`\n   echo \"UNITS SOLD FOR SKU $sku: $total\"\n \
    \  echo \"$sku|$total\" >> $TOTALS\ndone\n\n##########################\n#calculate\
    \ max/min/average\n\n##########################\nawk -F\"|\" '\n   BEGIN {first\
    \ = 1;}\n   {if(first) { min = max= avg = sum = $2; first=0; next}}\n   { if($2\
    \ < min) { min = $2 }\n     if($2 > max) { max = $2 }\n     sum += $2\n   }\n\
    \   END {print \"Minimum = \",min\n        print \"Maximum = \",max\n        print\
    \ \"Average = \",avg\n        print \"Total = \",sum\n}\n' $TOTALS \n```\n\n[Listing\
    \ A.10](#appendix.xhtml_liA-10) initializes some variables, followed by a `for`\
