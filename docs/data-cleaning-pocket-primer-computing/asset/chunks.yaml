  trans: "\n我们可以扩展之前的 shell 脚本，以考虑每个 `SKU` 的不同价格。Listing A.8 显示了 `skuprices.txt` 的内容。\n\
    \n### 列表 A.8: skuprices.txt\n```\n 4520 3.50\n\n5530 5.00\n\n6550 2.75\n\n7200\
    \ 6.25\n\n8000 3.50\n```\n\nListing A.9 显示了 `skutotals2.sh` 的内容，该脚本扩展了 Listing\
    \ A.8 中的代码，以计算每个 `SKU` 的收入。\n\n### 列表 A.9: skutotals2.sh\n```\n SKUVALUES=\"skuvalues.txt\"\
    \n\nSKUSOLD=\"skusold.txt\"\n\nSKUPRICES=\"skuprices.txt\"\n\nfor sku in `cat\
    \ $SKUVALUES`\n\ndo\n  skuprice=`grep $sku $SKUPRICES | cut -d\" \" -f2`\n  subtotal=`cat\
    \ $SKUSOLD |grep $sku | awk '{total += $2} END\n{print total}'`\n  total=`echo\
    \ \"$subtotal * $skuprice\" |bc`\n  echo \"AMOUNT SOLD FOR SKU $sku: $total\"\n\
    done\n```\n\nListing A.9 包含一个微小的改进：不再计算每个 `SKU` 销售数量的小计，而是计算每个 `SKU` 的收入，其中每个项目的收入等于该\
    \ `SKU` 的价格乘以该给定 `SKU` 的销售数量。运行 `skutotals2.sh`，你将看到以下输出：\n\n```\n AMOUNT SOLD\
    \ FOR SKU 4520: 94.50\n\nAMOUNT SOLD FOR SKU 5530: 85.00\n\nAMOUNT SOLD FOR SKU\
    \ 6550: 22.00\n\nAMOUNT SOLD FOR SKU 7200: 562.50\n\nAMOUNT SOLD FOR SKU 8000:\
    \ 560.00\n```\n\nListing A.10 显示了 `skutotals3.sh` 的内容，它计算了 `skuvalues.txt` 中每个\
    \ `SKU` 销售数量的最小、最大、平均和总数。\n\n### 列表 A.10: skutotals3.sh\n```\n SKUVALUES=\"skuvalues.txt\"\
    \n\nSKUSOLD=\"skusold.txt\"\n\nTOTALS=\"totalspersku.txt\"\n\nrm -f $TOTALS 2>/dev/null\n\
    \n##############################\n#计算每个 sku 的总量\n\n##############################\n\
    \nfor sku in `cat $SKUVALUES`\n\ndo\n   total=`cat $SKUSOLD |grep $sku | awk '{total\
    \ += $2} END\n{print total}'`\n   echo \"UNITS SOLD FOR SKU $sku: $total\"\n \
    \  echo \"$sku|$total\" >> $TOTALS\ndone\n\n##########################\n\n#计算最大/最小/平均\n\
    \n##########################\nawk -F\"|\" '\n   BEGIN {first = 1;}\n   {if(first)\
    \ { min = max= avg = sum = $2; first=0; next}}\n   { if($2 < min) { min = $2 }\n\
    \     if($2 > max) { max = $2 }\n     sum += $2\n   }\n   END {print \"Minimum\
    \ = \",min\n        print \"Maximum = \",max\n        print \"Average = \",avg\n\
    \        print \"Total = \",sum\n}\n' $TOTALS \n```\n\nListing A.10 初始化了一些变量，紧接着是一个\
    \ `for` 循环，该循环调用 `awk` 命令来计算每个 `SKU` 值的的小计（即销售数量）。Listing A.10 的后续部分包含一个 `awk`\
    \ 命令，用于计算文件 `$TOTALS` 中 `SKU` 单位的最大、最小、平均值和总和。\n\n运行 Listing A.10 中的脚本文件，你将看到以下输出：\n\
    \n```\n UNITS SOLD FOR SKU 4520: 27\n\nUNITS SOLD FOR SKU 5530: 17\n\nUNITS SOLD\
    \ FOR SKU 6550: 8\n\nUNITS SOLD FOR SKU 7200: 90\n\nUNITS SOLD FOR SKU 8000: 160\n\
    \nMinimum = 8\n\nMaximum = 160\n\nAverage = 27\n\nTotal = 302\n```\n\n### 使用 `grep`\
    \ 命令模拟关系型数据\n\n本节向你展示如何结合 `grep` 和 `cut` 命令，以跟踪一个小型客户数据库、他们的购买情况以及存储在三个文本文件中的购买详情。\n\
    \n请记住，有很多开源工具包可用，它们可以极大地方便关系型数据和非关系型数据的工作。这些工具包可能非常健壮，并且可以减少所需的代码量。\n\n此外，你可以使用\
    \ `join` 命令（在第 2 章 中讨论过）对数据集执行类 SQL 的操作。尽管如此，本节的真实目的是演示一些 `grep` 的技巧，这些技术在你自己的脚本中可能会有用。\n\
    \nListing A.11 显示了 `skuprices.txt` 的内容。\n\n### 列表 A.11: skuprices.txt\n```\n 4520\
    \ 3.50\n\n5530 5.00\n\n6550 2.75\n\n7200 6.25\n\n8000 3.50\n```\n\nListing A.12\
    \ 显示了 `skutotals.txt` 的内容。\n\n### 列表 A.12: skutotals.txt\n```\n 4520 27\n\n5530\
    \ 17\n\n6550 8\n\n7200 90\n\n8000 160\n```\n等待，不）\n\nListing A.13 显示了 `skutotals2.sh`\
    \ 的内容。\n\n### 列表 A.13: skutotals2.sh\n```\n SKUVALUES=\"skuvalues.txt\"\n\nSKUSOLD=\"\
    skusold.txt\"\n\nSKUPRICES=\"skuprices.txt\"\n\nfor sku in `cat $SKUVALUES`\n\n\
    do\n  skuprice=`grep $sku $SKUPRICES | cut -d\" \" -f2`\n  subtotal=`cat $SKUSOLD\
    \ |grep $sku | awk '{total += $2} END\n{print total}'`\n  total=`echo \"$subtotal\
    \ * $skuprice\" |bc`\n  echo \"AMOUNT SOLD FOR SKU $sku: $total\"\ndone\n```\n\
    *（自纠：提示词中为后半部分提供的文本是重复/令人困惑的。我将严格遵循提供的文本，同时应用格式规则。）*\n\n"
