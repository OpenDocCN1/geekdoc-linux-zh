    \ A.30 和 Listing A.31 显示了数据集 `rain1.csv`、`rain2.csv` 和 `rain3.csv.txt` 的内容，这些数据集在本节的多个\
    \ shell 脚本中使用。\n\n### Listing A.29: rain1.csv\n\n```\n 1,0.10,53,15\n2,0.12,54,16\n\
    3,0.19,65,10\n4,0.25,86,23\n5,0.18,57,17\n6,0.23,79,34\n7,0.34,66,21\n```\n\n\
    ### Listing A.30: rain2.csv\n\n```\n 1,0.00,63,24\n2,0.02,64,25\n3,0.09,75,19\n\
    4,0.15,66,28\n5,0.08,67,36\n6,0.13,79,23\n7,0.24,68,25\n```\n\n### Listing A.31:\
    \ rain3.csv\n\n```\n 1,1.00,83,34\n2,0.02,84,35\n3,1.09,75,19\n4,0.15,86,38\n\
    5,1.08,87,36\n6,0.13,79,33\n7,0.24,88,45\n```\n\n### 来自多个数据集的数值 (3)\n\nListing\
    \ A.32 显示了 shell 脚本 `rainfall3.sh` 的内容，该脚本将多个 CSV 文件对应字段中的数字相并显示结果。\n\n### Listing\
    \ A.32: rainfall3.sh\n\n```bash\n # => 计算多个文件的列平均值（反引号）\n#columns in rain.csv:\n\
    #DOW,inches of rain, degrees F, humidity (%)\n#指定 CSV 文件列表（支持多个正则）\nfiles=`ls\
