    \ #%d : %s\\n\", i, $i\n   printf (\"\\n\")\n}' FPAT='(^,)|([^+\")' $inputfile\n\
    ```\n\n运行 [列表 5.44 中的 shell 脚本的输出如下：\n\n```\n LINE #1:\nfield5,field4,field3,\"\
    field2,foo,bar\",field1,field6,field7,\"fieldZ\"\n-------------------------\n\
    field #1 : field5\nfield #2 : field4\nfield #3 : field3\nfield #4 : \"field2,foo,bar\"\
    \nfield #5 : field1\nfield #6 : field6\nfield #7 : field7\nfield #8 : \"fieldZ\"\
    \nLINE #2:\nfname1,\"fname2,other,stuff\",fname3,\"fname4,foo,bar\",fname5\n-------------------------\n\
