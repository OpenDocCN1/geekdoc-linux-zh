    fname: Tom\nlname: Smith\n--------------\nline:   3000   Dave   Del Ray\nempid:\
    \ 3000\nfname: Dave\nlname: Del Ray\n--------------\n```\n\n#### 递归与 Shell 脚本\n\
    \n本节包含了几个带有递归的脚本示例，递归是许多编程语言中的一个主题。虽然你可能不需要编写使用递归的脚本，但学习这个概念是有用的，特别是如果你计划学习其他语言。如果你已经理解了递归，那么本节的脚本将非常简单。特别是你将学习如何计算正整数的阶。如果你感兴趣，附录包含了计算正整数斐波那契数的\
