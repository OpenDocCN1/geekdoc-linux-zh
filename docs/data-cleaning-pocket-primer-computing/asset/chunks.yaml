    \ depth.\n\n[Listing 5.44](#chap5.xhtml_li5-44) displays the contents of the file\
    \ `quotes3.csv,` which contains a “,” delimiter and multiple quoted fields.\n\n\
    ##### ***LISTING 5.44 quotes3.csv***\n\n```\n field5,field4,field3,\"field2,foo,bar\"\
    ,field1,field6,field7,\"fieldZ\"\nfname1,\"fname2,other,stuff\",fname3,\"fname4,foo,bar\"\
    ,fname5\n\"lname1,a,b\",\"lname2,c,d\",\"lname3,e,f\",\"lname4,foo,bar\",lname5\n\
    ```\n\n[Listing 5.45](#chap5.xhtml_li5-45) displays the contents of the file `delim1.sh,`\
    \ which illustrates how to replace the delimiters in `delim1.csv` with a “,” character.\n\
    \n##### ***LISTING 5.45 delim1.sh***\n\n```\n #inputfile=\"quotes1.csv\"\n#inputfile=\"\
    quotes2.csv\"\ninputfile=\"quotes3.csv\"\ngrep -v \"^$\" $inputfile | awk '\n\
    {\n   print \"LINE #\" NR \": \" $0\n   printf (\"-------------------------\\\
    n\")\n   for (i = 0; ++i <= NF;)\n     printf \"field #%d : %s\\n\", i, $i\n \
    \  printf (\"\\n\")\n}' FPAT='([^,]+)|(“[^”]+”)' < $inputfile\n```\n\nThe output\
    \ from launching the shell script in [Listing 5.44](#chap5.xhtml_li5-44) is here:\n\
    \n```\n LINE #1:\nfield5,field4,field3,\"field2,foo,bar\",field1,field6,field7,\"\
