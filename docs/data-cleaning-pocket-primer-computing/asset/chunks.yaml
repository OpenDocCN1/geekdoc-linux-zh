  trans: '


    你将学会如何使用各种 `bash` 命令，这些命令通常作为短 shell 脚本的一部分。这些章节还包含简单的用例，说明了如何执行涉及数据集的各种任务，例如交换两列数据集的顺序（第
    1 章）、删除文本文件中的控制字符（第 2 章）、查找特定行并合并它们（第 3 章）、重新格式数据集中的日期字段（第 5 章）、删除嵌套引号（第 5 章），以及附录中的补充代码示例。


    本书节省了你搜索相关代码示例并根据特定需求对其进行调整的时间，而这可能是一个非常耗时的过程。


    ### 代码示例是如何创建的？


    书中的代码示例是在运行了 OS X 10.12.6 (macOS Sierra) 的 Macbook Pro 上使用 `bash` 创建并测试的。关于其内容：代码示例主要源于作者编写的脚本，在某些情况下，代码示例也包含了来自在线论坛讨论的短代码段。需要记住的关键点是，代码示例遵循“四
    C”原则：在本书的规模范围内，它们尽可能做到清晰（Clear）、简洁（Concise）、完整（Complete）和正确（Correct）。


    ### 学习本书需要具备什么


    你需要对在 Unix 类环境中通过命令行工作有一定的熟悉程度。然而，这也涉及一些主观的先决条件，例如学习 shell 编程的意愿，以及阅读和理解代码示例的动力和自律。无论如何，如果你不确定是否能吸收书中的内容，可以快速浏览一下代码示例，以感受其复杂程度。


    ### 哪些 bash 命令是被排除在外的？


    不符合前一节所列出的任何标准的命令都未包含在本入门教程中。因此，本书不涵盖系统管理相关的命令（例如关闭机器、安排备份等）。章节中内容的目的是说明如何使用 `bash`
    命令处理数据集的常见数据清洗任务，之后你可以通过进一步阅读来加深知识。


    ### 我该如何设置命令行 shell？


    如果你是 Mac 用户，有三种方法可以实现。第一方法是使用 `Finder` 导航到 `Applications > Utilities`，然后双击 `Utilities`（实用工具）应用程序。接下来，如果你已经有一个可用的命令行
    shell，可以通过输入以下命令启动一个新的命令行 shell：


    ```

    open /Applications/Utilities/Terminal.app

    ```


    Mac 用户的第二种方法是在已经显示的命令行 shell 中，通过简单点击 `command+n` 在 Macbook 上打开一个新的命令行 shell，这样你的
    Mac 就会启动另一个命令行 shell。


    如果你是 PC 用户，可以安装 Cygwin（开源 [`cygwin.com/`](https://cygwin.com/））来模拟 `bash` 命令，或者使用其他工具包如
    MKS（一种商业产品）。请阅读描述下载和安装过程的在线文档。


    如果你使用 RStudio，可以通过导航到 Tools > Command Line 在 RStudio 内部启动命令行 shell，然后就可以运行 `bash`
    命令。注意，如果自定义别名定义在主启动文件（如 `.bash_login`）之外的文件中，则它们不会被自动设置。


    ### 完成本书后的“下一步”是什么？


    这个问题的答案差异很大，主要因为答案在很大程度上取决于你的目标。最好的答案是尝试将书中的新工具或技术应用到你关心的专业或个人问题及任务中。具体是什么内容取决于你是谁，因为数据科学家、经理、学生或开发人员的需求都是不一样的。此外，在你应对新的数据清洗或处理挑战时，记住你所学的内容。有时，知道某种技术是可能的会让寻找解决方案变得更容易，即使你必须重新阅读该章节以确记语法如何工作。


    如果你已经达到了此处所学知识的极限，并想获得这些命令的更深层次技术，有大量的出版物和在线资源描述了 `bash` shell、Unix 编程以及 `grep`、`sed`
    和 `awk` 命令。


    ## 技术评审员简介


    Bradley Shanrock-Solberg 在多个领域拥有 30 年的分析经验，涵盖了高速公路交通流、合同管理、保修与退货、物流、供应链、游戏机制、软件质量保证、异步消息系统、佣金与销售支持、订单到现金流程以及志愿者管理。Brad
    的职业生涯始于一家交通信息初创公司，随后担任了几年的业务分析师，之后在希捷科技（Seagate Technology）担任了 20 年的各种 IT 职位。自
    2015 年以来，Brad 在金山湾地区担任咨询数据科学家，帮助客户通过使用他们已经熟悉的工具从其拥有的数据中获取最大的价值。Brad 是认证六西格玛黑带专家，并拥有加州理工学院的工程与应用科学学学位。


    ## 第 1 章：引言


    本章为你介绍 `bash` shell。你将学习如何使用一些基础命令，例如在文件系统中导航、列出文件以及显示文件内容。本章内容密集，包含了多种杂杂的话题，以便让你为后续章节做好准备。如果你已经有一些
    shell 编程知识，可能可以快速浏览这个介绍性章节，并进入 第 2 章。


    本章的第一部分从对某些 Unix shell 的简要介绍开始，然后讨论文件、文件权限和目录。你还将学习如何创建文件和目录以及如何更改它们的权限。


    本章的第二部分介绍了简单的 shell 脚本以及如何使其可执行的指令。正如你所看到的，shell 脚本包含了 `bash` 命令（可选包含自定义函数），因此在创建
    shell 脚本之前学习 `bash` 命令是一个好主意。


    本章的第三部分讨论了两个实用的 bash 命令：`cut` 命令（用于从数据集中切割或提取列和字段）和 `paste` 命令（用于将文本或数据集垂直拼接在一起）。


    此外，本章的最后一部分将在前一节的内容（即 `cut` 命令和 `paste` 命令）应用于一个用例中，说明如何交换数据集中两列的顺序。正如你之后看到的，还有其他方法可以执行此任务，例如调用
    `awk` 命令（在第 5 章 中讨论）。


