  trans: "\n\nListing 5.30 从一个 `grep` 命令开始，该命令用于删除空行，随后是一个 `awk` 命令，它将数据集的每行打印为单行文本。第二个\
    \ `awk` 命令在 `BEGIN` 块中将变量 `columnCount` 初始化为值 4，随后是一个遍历输入字段的 `for` 循环。在同一行输出上打印了四个字段后，该程序会打印一个换行符，其效果是将输入数据集重新对齐为一个由每行包含四个字段组成的输出数据集。Listing\
    \ 5.30 的输出如下：\n\n```\n Sara, Jones, 1000, CA\nSally, Smith, 2000, IL\nDave, Jones,\
    \ 3000, FL\nJohn, Jones, 4000, CA\nDave, Jones, 5000, NY\nMike, Jones, 6000, NY\n\
    Tony, Jones, 7000, WA\n```\n\n### 对齐数据集中的列和多行\n\n上述章节向你展示了如何重新排列数据集，使每行包含相同数量的列并代表单个数据记录。本节中的代码示例说明了如何对齐内容正确的数据列，并在新数据集的每行中放置两个记录。Listing\
    \ 5.31 显示了带有未对齐数据值的 `mixed-data2.csv` 的内容，随后是 Listing 5.32 显示的格式正确数据集 `aligned-data2.csv`\
    \ 的内容。\n\n#### 列表 5.31 mixed-data2.csv\n\n```\n Sara, Jones, 1000, CA, Sally,\
    \ Smith, 2000, IL,\nDave, Jones, 3000, FL, John, Jones,\n4000, CA,\nDave, Jones,\
    \ 5000, NY, Mike,\nJones, 6000, NY, Tony, Jones, 7000, WA\n```\n\n#### 列表 5.32\
    \ aligned-data2.csv\n\n```\n Sara, Jones, 1000, CA, Sally, Smith, 2000, IL\nDave,\
    \ Jones, 3000, FL, John, Jones, 4000, CA\nDave, Jones, 5000, NY, Mike, Jones,\
    \ 6000, NY\nTony, Jones, 7000, WA\n```\n\nListing 5.33 显示了 `mixed-data2.sh` 的内容，它说明了如何重新对齐列表\
    \ 5.31 中的数据集。\n\n#### 列表 5.33 mixed-data2.sh\n\n```bash\n #-----------------------------------------\n\
    # 1) 删除空行\n# 2) 删除换行符\n# 3) 每 8 个字段后打印一个 LF\n# 4) 删除每行末尾的 ','\n#-----------------------------------------\n\
    inputfile=\"mixed-data2.txt\"\noutputfile=\"aligned-data2.txt\"\ngrep -v \"^$\"\
    \ $inputfile |awk -F\",\" '{printf(\"%s\",$0)}' | awk '\nBEGIN { columnCount =\
    \ 4; rowCount = 2; currRow = 0 }\n{\n   for(i=1; i<=NF; i++) {\n     printf(\"\
    %s \", $i)\n     if( i % columnCount == 0) { ++currRow }\n     if(currRow > 0\
    \ && currRow % rowCount == 0) {currRow = 0;\nprint \"\"}\n   }\n}' > temp-columns\n\
    # 4) 删除输出末尾的 ',':\ncat temp-columns | sed 's/, $//' | sed 's/ $//' > $outputfile\n\
    ```\n\nListing 5.33 与 Listing 5.30 非常相似。核心思想是在处理完一对“正常”记录后打印一个换行符，这是通过 Listing\
    \ 5.33 中**加粗显示**的代码实现的。\n\n现在你可以通过将 `rowCount` 变量的初始值更改为任何正整数来轻松地扩展 Listing 5.33，代码将在无需任何进一步修改的情况下正常工作。例如，如果你将\
    \ `rowCount` 初始化为值 `5`，那么新数据集中的每行（最后输出行可能除外）将包含 5 条“正常”数据记录。\n\n### 从文本文件中删除一列\n\
    \nListing 5.34 显示了 `VariableColumns.txt` 的内容，其中文本行包含不同数量的列。\n\n#### 列表 5.34 VariableColumns.txt\n\
    \n```\n this is line one\nthis is line number one\nthis is the third and final\
    \ line\n```\n\nListing 5.35 显示了 `RemoveColumn.sh` 的内容，该脚本从文本文件中删除第一列。\n\n####\
    \ 列表 5.35 RemoveColumn.sh\n\n```bash\n awk '{ for (i=2; i<=NF; i++) printf \"\
    %s \", $i }\n```\n\n`awk` 循环除了第一个字段外遍历所有字段。之前代码的输出是：\n\n```\n400\n300\n200\n```\n\
    \n### 文本文件的列列\n\nListing 5.35 向你展示了如何重新排列数据集，使每行包含相同数量的列并代表单个数据记录。本节中的代码示例说明了如何对齐内容正确的数据列，并在新数据集的每行中放置两个记录。Listing\
    \ 5.36 显示了 `aligned-data2.csv` 的内容，即格式正确的数据集。\n\nListing 5.37 显示了 `mixed-data2.sh`\
    \ 的内容，它说明了如何重新对齐列表 5.31 中的数据集。\n\n#### 列表 5.36-rows.txt\n\n```\n Sara, Jones,\
    \ 1000, CA, Sally, Smith, 2000, IL\nDave, Jones, 3000, FL, John, Jones, 4000,\
    \ CA\nDave, Jones, 5000, NY, Mike, Jones, 6000, NY\nTony, Jones, 7000, WA\n```\n\
    \n#### 列表 5.37--rows.sh\n\n```bash\n #-----------------------------------------\n\
    # 1) 删除空行\n# 2) 删除换行符\n# 3) 每 8 个字段后打印一个 LF\n# 4) 删除每行末尾的 ','\n#-----------------------------------------\n\
    inputfile=\"mixed-data2.txt\"\noutputfile=\"aligned-data2.txt\"\ngrep -v \"^$\"\
    \ $inputfile |awk -F\",\" '{printf(\"%s\",$0)}' | awk '\nBEGIN { columnCount =\
    \ 4; rowCount = 2; currRow = 0 }\n{\n   for(i=1; i<=NF; i++) {\n     printf(\"\
    %s \", $i)\n     if( i % columnCount == 0) { ++currRow }\n     if(currRow > 0\
    \ && currRow % rowCount == 0) {currRow = 0;\nprint \"\"}\n   }\n}' > temp-columns\n\
