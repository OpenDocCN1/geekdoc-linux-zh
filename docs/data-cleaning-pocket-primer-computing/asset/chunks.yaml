    \ of units sold) for each `SKU` value. The next portion of [Listing A.10](#appendix.xhtml_liA-10)\
    \ contains an `awk` command that calculates the maximum, minimum, average, and\
    \ sum for the `SKU` units in the files `$TOTALS`.\n\nLaunch the script file in\
    \ [Listing A.10](#appendix.xhtml_liA-10) and you will see the following output:\n\
    \n```\n UNITS SOLD FOR SKU 4520: 27\n\nUNITS SOLD FOR SKU 5530: 17\n\nUNITS SOLD\
    \ FOR SKU 6550: 8\n\nUNITS SOLD FOR SKU 7200: 90\n\nUNITS SOLD FOR SKU 8000: 160\n\
    \nMinimum = 8\n\nMaximum = 160\n\nAverage = 27\n\nTotal = 302\n```\n\n### Simulating\
