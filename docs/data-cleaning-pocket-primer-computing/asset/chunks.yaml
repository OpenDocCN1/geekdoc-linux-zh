- fmt: '

    You will acquire an understanding of how to use various `bash` commands, often
    as part of short shell scripts. The chapters also contain simple use cases that
    illustrate how to perform various tasks involving datasets, such as switching
    the order of a two-column dataset ([Chapter 1](#chap1.xhtml)), removing control
    characters in a text file ([Chapter 2](#chap2.xhtml)), find specific lines and
    merge them ([Chapter 3](#chap3.xhtml)), reformatting a date field in a dataset
    ([Chapter 5](#chap5.xhtml)), removing nested quotes ([Chapter 5](#chap5.xhtml)),
    along with supplemental code samples in the Appendix.


    This book saves you the time required to search for relevant code samples, adapting
    them to your specific needs, which is a potentially time-consuming process.


    ### How Were the Code Samples Created?


    The code samples in this book were created and tested using `bash` on a Macbook
    Pro with OS X 10.12.6 (macOS Sierra). Regarding their content: the code samples
    are derived primarily from scripts prepared by the author, and in some cases there
    are code samples that incorporate short sections of code from discussions in online
    forums. The key point to remember is that the code samples follow the “Four Cs”:
    they must be Clear, Concise, Complete, and Correct to the extent that it’s possible
    to do so, given the size of this book.


    ### What You Need to Know for This Book


    You need some familiarity with working from the command line in a Unixlike environment.
    However, there are subjective prerequisites, such as a desire to learn shell programming,
    along with the motivation and discipline to read and understand the code samples.
    In any case, if you’re not sure whether or not you can absorb the material in
    this book, glance through the code samples to get a feel for the level of complexity.


    ### Which bash Commands are Excluded?


    The commands that do not meet any of the criteria listed in the previous section
    are not included in this Primer. Consequently, there is no coverage of commands
    for system administration (e.g., shutting down a machine, scheduling backups,
    and so forth). The purpose of the material in the chapters is to illustrate how
    to use `bash` commands for handling common data cleaning tasks with datasets,
    after which you can do further reading to deepen your knowledge.


    ### How Do I Set Up a Command Shell?


    If you are a Mac user, there are three ways to do so. The first method is to use
    `Finder` to navigate to `Applications > Utilities` and then double click on the
    `Utilities` application. Next, if you already have a command shell available,
    you can launch a new command shell by typing the following command:


    ```

    open /Applications/Utilities/Terminal.app

    ```


    A second method for Mac users is to open a new command shell on a Macbook from
    a command shell that is already visible simply by clicking `command+n` in that
    command shell, and your Mac will launch another command shell.


    If you are a PC user, you can install Cygwin (open source [https://cygwin.com/](https://cygwin.com/))
    that simulates `bash` commands, or use another toolkit such as MKS (a commercial
    product). Please read the online documentation that describes the download and
    installation process.


    If you use RStudio, you launch a command shell inside of RStudio by navigating
    to Tools > Command Line, and then you can launch `bash` commands. Note that custom
    aliases are not automatically set if they are defined in a file other than the
    main start-up file (such as `.bash_login`).


    ### What Are the “Next Steps” after Finishing This Book?


    The answer to this question varies widely, mainly because the answer depends heavily
    on your objectives. The best answer is to try a new tool or technique from the
    book out on a problem or task you care about, professionally or personally. Precisely
    what that might be depends on who you are, as the needs of a data scientist, manager,
    student, or developer are all different. In addition, keep what you learned in
    mind as you tackle new data cleaning or manipulation challenges. Sometimes knowing
    a technique is possible makes finding a solution easier, even if you have to re-read
    the section to remember exactly how the syntax works.


    If you have reached the limits of what you have learned here and want to get further
    technical depth on these commands, there is a wide variety of literature published
    and online resources describing the `bash` shell, Unix programming, and the `grep`,
    `sed`, and `awk` commands.


    ## ABOUT THE TECHNICAL REVIEWER


    Bradley Shanrock-Solberg has 30 years of experience in analytics in domains as
    diverse as freeway traffic flow, contracts management, warranty & returns, logistics,
    supply chain, game mechanics, software quality assurance, asynchronous messaging
    systems, commissions & sales support, order-to-cash processes, and volunteer management.
    Brad’s career began at a traffic information startup, then he spent a few years
    as a business analyst, followed by 20 years in various IT roles at Seagate Technology.
    Since 2015, Brad has worked as a consulting data scientist in the San Francisco
    Bay area, helping clients learn to get the most value out of the data they own
    by using the tools they already understand. Brad is a certified Six Sigma Blackbelt
    and has a BS in engineering and applied science from the California Institute
    of Technology.


    ## CHAPTER 1: INTRODUCTION


    This chapter introduces you to the `bash` shell. You will learn how to use some
    basic commands, such as navigating around the file system, listing files, and
    displaying the contents of files. This chapter is dense and contains a very eclectic
    mix of topics to quickly prepare you for later chapters. If you already have some
    knowledge of shell programming, you can probably skim quickly through this introductory
    chapter and proceed to [Chapter 2](#chap2.xhtml).


    The first part of this chapter starts with a brief introduction to some Unix shells,
    and then discusses files, file permissions, and directories. You will also learn
    how to create files and directories and how to change their permissions.


    The second part of this chapter introduces simple shell scripts, along with instructions
    for making them executable. As you will see, shell scripts contain `bash` commands
    (and optionally contain user-defined functions), so it’s a good idea to learn
    about `bash` commands before you can create shell scripts.


    The third portion of this chapter discusses two useful bash commands: the `cut`
    command (for cutting or extracting columns and/or fields from a dataset) and the
    `paste` command (for “pasting” text or datasets together vertically).


    In addition, the final part of this chapter uses the material from the previous
    section (i.e., the `cut` command and `paste` command) in a use case that illustrates
    how to switch the order of two columns in a dataset. As you will see later, there
    are other ways to perform this task, such as invoking the `awk` command (discussed
    in [Chapter 5](#chap5.xhtml)).

