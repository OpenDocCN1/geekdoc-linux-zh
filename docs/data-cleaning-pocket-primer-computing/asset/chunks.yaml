    \ to parse the contents of a field in a record.\n\n#### LISTING A.20: genetics.txt\n\
    \n```\n #extract rows with 'gene' and print 'key' value\n\nxyz3    GTF2FF chro\
    \     55555   44444  Super=NR_55555\n\nxyz3    GTF2FF gene     77774   11111\n\
    key=XYZ123;NB=standard;Name=extra\n\nxyz3    GTF2FF exon     71874   12227=chr1\n\
    \nxyz3    GTF2FF exon     72613   12721  Super=NR_55555\n\nxyz3    GTF2FF exon\
    \     83221   14408  Super=NR_55555\n\nxyz3    GTF2FF gene     84362   29370\n\
    =NR_22222\n```\n\n#### LISTING A.21: genetics.sh\n\n```\n # required output:\n\
    \n#xyz3:77774:XYZ123\n\n#xyz3:84362:WASH7P\n\nawk -F\" \" '\n{\n  if( $3 == \"\
