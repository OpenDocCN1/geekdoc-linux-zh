    \ to the file `/tmp/blue`.\n\n```\nfind . –print |xargs grep \"^abc$\" | tee –a\
    \ /tmp/blue\n```\n\nThe preceding code snippet also redirects the list of all\
    \ files in the current directory (and those in any subdirectories) to the `xargs`\
    \ command, which then searches—and prints—all the lines that contain only the\
    \ string “abc.” The result is displayed on the screen and is also appended to\
    \ the file `/tmp/blue`.\n\n### The File Compression Commands\n\nBash supports\
    \ various commands for compressing sets of files, including the `tar`, `cpio`,\
