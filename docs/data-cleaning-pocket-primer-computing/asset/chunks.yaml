  trans: "\n你可以将字段分隔符理解为我们之前在其他命令中使用的分隔符/`IFS`。记录分隔符的行为与 `sed` 处理单独行的方式类似——例如，`sed`\
    \ 可以匹配或删除一个范围的行，而不是匹配或删除符合正则表达式的内容（而 `awk` 的默认记录分隔符是换行符，因此默认情况下，`awk` 和 `sed`\
    \ 具有相似的操作和引用文本文件中行的行的能力）。\n\n作为一个简单的示例，你可以通过将 `ORS,` 从默认的一个换行符改为两个换行符，从而在文件的每行之后都打印一个空行，如下所示：\n\
    \n```\ncat columns.txt | awk 'BEGIN { ORS =\"\\n\\n\" } ; { print $0 }'\n```\n\
    \n其他内置变量包括 `FILENAME`（`awk` 当前正在读取的文件名）、`FNR`（当前文件中当前记录数）、`NF`（当前输入记录中的字段数）以及\
    \ `NR`（自程序执行开始以来 `awk` 处理的输入记录总数）。\n\n请查阅在线文档以获取关于 `awk` 命令的这些（以及其他）参数的更多信息。\n\
    \n## `awk` 命令是如何工作的？\n\n`awk` 命令一次读取输入文件中的一个记录（默认情况下，一个记录为一行）。如果记录匹配模式，则执行相应的动作（否则不执行动作）。如果没有给出搜索模式，则\
    \ `awk` 将对输入的每条记录执行给定的动作。如果没有给出动作，默认行为是打印所有匹配给定模式的记录。最后，不带任何动作的空括号不起任何作用；也就是说，它们不会执行默认的打印操作。注意，动作中的每个语句都应该用分号隔开。\n\
    \n为了使上述段更具体，这里有一些涉及文本字符串和 `awk` 命令的简单示例（结果显示在每个代码段之后）。`-F` 关将字段分隔符设置为其后的任意内容，在本例中是空格。开关通常会为通常需要在\
    \ `BEGIN{}` 块内部执行命令的动作提供快捷方式：\n\n```\nx=\"a b c d e\"\necho $x |awk -F\" \" '{print\
    \ $1}'\na\necho $x |awk -F\" \" '{print NF}'\n5\necho $x |awk -F\" \" '{print\
    \ $0}'\na b c d e\necho $x |awk -F\" \" '{print $3,1}'\nc\n```\n\n现在让我们将 `FS`（记录分隔符）更改为空字符串以计算字符串的长度，这次使用\
    \ `BEGIN{}` 语法：\n\n```\necho \"abc\" | awk 'BEGIN { FS = \"\" } { print NF }'\n\
    3\n```\n\n以下示例说明了指定 `test.txt` 为 `awk` 命令输入文件的几种等效方法：\n\n```\nawk < test.txt '{\
    \ print $1 }'\nawk '{ print $1 }' < test.txt\n```\n\n这里显示了另一种方法（但正如我们之前讨论过的，可能是无效的，所以只有当\
    \ `cat` 命令在某些方面增加价值时才这样做）：\n\n```\ncat test.txt | awk '{ print $1 }'\n```\n\n\
    这个四种方式完成相同任务的简单示例说明了为什么注释 `awk` 调用始终是一个好主意。下一个查看你代码的人可能不记得你使用的语法。\n\n## 使用 `printf`\
    \ 命令对齐文本\n\n由于 `awk` 是单个命令内部的编程语言，它也有自己通过 `printf` 命令产生输出的方法。`Listing 5.1` 显示了\
    \ `columns.txt` 的内容，`Listing 5.2` 显示了 脚本 `Columns1.sh` 的内容，它向你展示了如何对齐文本中的列。\n\n\
    ### Listing 5.1 columns.txt\n\n```\none two\nthree four\none two three\nfive six\n\
    one two three\nfour five\n```\n\n### Listing 5.2 Columns1.sh\n\n```\nawk '{\n\
    \     # 在 10 字符列上左对齐 $1\n     # 在 10 字符列上右对齐 $2\n     # 在 10 字符列上右对齐 $3\n    \
    \ # 在 10 字符列上右对齐 $4\n     printf(\"%-10s%10s%10s%10s\\n\", $1, $2, $3, $4)\n}'\
    \ columns.txt\n```\n\n`Listing 5.2` 包含一个 `printf()` 语句，用于显示 `columns.txt` 文件中每行的前四个字段，每个字段宽度为\
    \ 10 个字符。运行 `Listing 5.2` 中代码的输出在此：\n\n```\none         two\nthree       four\n\
    one         three      four\nfive        six\n```\n```\n\n## 条件逻辑和控制语句\n\n与其他编程语言一样，`awk`\
    \ 提供对条件逻辑（`if/else`）和控制语句（`for`/`while` 循环）的支持。`awk` 是在管道命令流中使用条件逻辑而不创建、安装并添加到路径中的自定义可执行脚本的唯一方法。以下代码块显示了如何使用\
    \ `if/else` 逻辑：\n\n```\necho \"\" | awk '\nBEGIN { x = 10 }\n{\n  if (x % 2 ==\
    \ 0) {\n      print \"x is even\"\n  }\n  else {\n      print \"x is odd\"\n \
    \ }\n}\n'\n```\n\n上述代码块将变量 `x` 初始化为 `10`，如果 `x` 能被 2 整除，则打印 `x is even`，否则打印 `x\
    \ is odd`。\n\n### `while` 语句\n\n以下代码块说明了如何在 `awk` 中使用 `while` 循环：\n\n```\necho\
    \ \"\" | awk '\n{\n  x = 0\n  while(x < 4) {\n    print \"x:\",x\n    x = x +\
    \ 1\n  }\n}\n'\n```\n\n上述代码块生成了以下输出：\n\n```\nx:0\nx:1\nx:2\nx:3\n```\n\n以下代码块说明了如何在\
    \ `awk` 中使用 `do while` 循环：\n\n```\necho \"\" | awk '\n{\n  x = 0\n  do {\n   \
    \ print \"x:\",x\n    x = x + 1\n  } while(x < 4)\n}\n'\n```\n\n上述代码块生成了以下输出：\n\
    \n```\nx:0\nx:1\nx:2\nx:3\n```\n\n### `awk` 中的 for 循环\n\n`Listing 5.3` 显示了 `Loop.sh`\
    \ 的内容，它说明了如何在循环中打印数字列表。注意 `i++` 是 `awk`（以及大多数 C 类语言）中 `i=i+1` 的另一种写法。\n\n### Listing\
    \ 5.3 Loop.sh\n\n```\nawk '\nBEGIN {}\n{\n   for(i=0; i<5; i++) {\n     printf(\"\
    %3d\", i)\n   }\n}\nEND { print \"\\n\" }\n'\n```\n\n`Listing 5.3` 包含一个 `for`\
    \ 循环，通过 `printf()` 语句在同一行打印数字。注意只有在代码的 `END` 块中打印了换行符：\n\n```\n0 1 2 3 4\n```\n\
    \n### 带有 break 语句的 for 循环\n\n以下代码块说明了如何在 `awk` 的 `for` 循环中使用 `break` 语句：\n\n```\n\
    echo \"\" | awk '\n{\n  for(x=1; x<4; x++) {\n     print \"x:\",x\n     if(x ==\
    \ 2) {\n        break;\n     }\n  }\n}\n'\n```\n\n上述代码块一直输出直到变量 `x` 值为 `2`（因为条件逻辑内部有\
    \ `break`）。显示的输出为：\n\n```\nx:1\n```\n\n"
- fmt: "\n# Deleting Alternate Lines in Datasets\n\n[Listing 5.4](#chap5.xhtml_li5-4)\
    \ displays the contents of `linepairs.csv` and [Listing 5.5](#chap5.xhtml_li5-5)\
    \ displays the contents of `deletelines.sh`, which illustrates how to print alternating\
    \ lines from the dataset `linepairs.csv` that have exactly two columns.\n\n###\
    \ LISTING 5.4 linepairs.csv\n```\na,b,c,d\ne,f,g,h\n1,2,3,4\n5,6,7,8\n```\n\n\
    ### LISTING 5.5 deletelines.sh\n```\ninputfile=\"linepairs.csv\"\noutputfile=\"\
    linepairsdeleted.csv\"\nawk ' NR%2 {printf \"%s\", $0; print \"\"; next}' < $inputfile\
    \ >\n$outputfile\n```\n\n[Listing 5.5](#chap5.xhtml_li5-5) checks if the current\
    \ record number `NR` is divisible by 2, in which case it prints the current line\
    \ and skips the next line in the dataset. The output is redirected to the specified\
    \ output file, the contents of which are here:\n\n```\na,b,c,d\n1,2,3,4\n```\n\
    \nA slightly more common task involves merging consecutive lines, which is the\
    \ topic of the next section.\n\n# Merging Lines in Datasets\n\n[Listing 5.6](#chap5.xhtml_li5-6)\
    \ displays the contents of `columns.txt` and [Listing 5.7](#chap5.xhtml_li5-7)\
    \ displays the contents of `ColumnCount1.sh`, which illustrates how to print the\
    \ lines from the text file `columns.txt` that have exactly two columns.\n\n###\
    \ LISTING 5.6 columns.txt\n```\none two three\none two\none two three four\none\n\
    one three\none four\n```\n\n### LISTING 5.7 ColumnCount1.sh\n```\nawk\n{\n   if(\
    \ NF == 2 ) { print $0 }\n}\n' columns.txt\n```\n\n[Listing 5.7](#chap5.xhtml_li5-7)\
    \ is straightforward: if the current record number is even, then the current line\
    \ is printed (i.e., odd-numbered rows are skipped). The output from launching\
    \ the code in [Listing 5.7](#chap5.xhtml_li5-7) is here:\n\n```\none two\none\
    \ three\none four\n```\n\nIf you want to display the lines that do *not* contain\
    \ 2 columns, use the following code snippet:\n\n```\nif( NF != 2 ) { print $0\
    \ }\n```\n\n## Printing File Contents as a Single Line\n\nThe contents of `test4.txt`\
    \ are here (note the blank lines):\n\n```\nabc\ndef\nabc\nabc\n```\n\nThe following\
    \ code snippet illustrates how to print the contents of `test4.txt` as a single\
    \ line:\n\n```\nawk '{printf(\"%s\", $0)}' test4.txt\n```\n\nThe output of the\
    \ preceding code snippet is here. See if you can tell what is happening before\
    \ reading the explanation in the next paragraph:\n\n```\nAbdefabcabc\n```\n\n\
    Explanation: `%s` here is the record separator syntax for `printf,`, and having\
    \ the end quote after it means the record separator is the empty field \"\". Our\
    \ default record separator for `awk` is `\\n` (newline); what the `printf` is\
    \ doing is stripping out all the newlines. The blank rows will vanish entirely,\
    \ as all they have is the newline, so the result is that any actual text will\
    \ be merged together with nothing between them. Had we added a space between the\
    \ `%s` and the ending quote, there would be a space between each character block,\
    \ plus an extra space for each newline.\n\nNotice how the following comment helps\
    \ the comprehension of the code snippet:\n\n```\n# Merging all text into a single\
    \ line by removing the newlines \nawk '{printf(\"%s\", $0)}' test4.txt\n```\n\n\
    ## Joining Groups of Lines in a Text File\n\n[Listing 5.8](#chap5.xhtml_li5-8)\
    \ displays the contents of `digits.txt` and [Listing 5.9](#chap5.xhtml_li5-9)\
    \ displays the contents of `digits.sh`, which “joins” three consecutive lines\
    \ of text in the file `digits.txt`.\n\n### LISTING 5.8 digits.txt\n```\n1\n2\n\
    3\n4\n5\n6\n7\n8\n9\n```\n\n### LISTING 5.9 digits.sh\n```\nawk -F\" \" '{\n \
    \ printf(\"%d\",$0)\n  if(NR % 3 == 0) { printf(\"\\n\") }\n}' digits.txt\n```\n\
    \n[Listing 5.9](#chap5.xhtml_li5-9) prints three consecutive lines of text on\
    \ the same line, after which a linefeed is printed. This has the effect of “joining”\
    \ every three consecutive lines of text. The output from launching `digits.sh`\
    \ is here:\n\n```\n123\n456\n789\n```\n\n## Joining Alternate Lines in a Text\
    \ File\n\n[Listing 5.10](#chap5.xhtml_li5-10) displays the contents of `columns2.txt`\
    \ and [Listing 5.11](#chap5.xhtml_li5-11) displays the contents of `JoinLines.sh`,\
    \ which “joins” two consecutive lines of text in the file `columns2.txt`.\n\n\
    ### LISTING 5.10 columns2.txt\n```\none two\nthree four\nfive six\nseven eight\n\
    ```\n\n### LISTING 5.11 JoinLines.sh\n```\nawk\n{\n     printf.s\", $0)\n    \
    \ if(NR % 2 == 0) { printf(\"\\n\") }\n}\n' columns2.txt\n```\n"
  raw: "### **Deleting Alternate Lines in Datasets**\n\n[Listing 5.4](#chap5.xhtml_li5-4)\
    \ displays the contents of `linepairs.csv` and [Listing 5.5](#chap5.xhtml_li5-5)\
    \ displays the contents of `deletelines.sh,` which illustrates how to print alternating\
    \ lines from the dataset `linepairs.csv` that have exactly two columns.\n\n#####\
    \ ***LISTING 5.4 linepairs.csv***\n\n```\n a,b,c,d\ne,f,g,h\n1,2,3,4\n5,6,7,8\n\
    ```\n\n##### ***LISTING 5.5 deletelines.sh***\n\n```\n inputfile=\"linepairs.csv\"\
    \noutputfile=\"linepairsdeleted.csv\"\nawk ' NR%2 {printf \"%s\", $0; print \"\
    \"; next}' < $inputfile >\n$outputfile\n```\n\n[Listing 5.5](#chap5.xhtml_li5-5)\
    \ checks if the current record number `NR` is divisible by 2, in which case it\
    \ prints the current line and skips the next line in the dataset. The output is\
    \ redirected to the specified output file, the contents of which are here:\n\n\
    ```\n a,b,c,d\n1,2,3,4\n```\n\nA slightly more common task involves merging consecutive\
