    \ pair of lines is joined (between “g” and “h” and “9” and “10”). We can make\
    \ the necessary revision using the `sed` command (discussed in [Chapter 4](#chap4.xhtml)):\n\
    \n```\n cat $outputfile | sed \"s/ /,/g\" > $outputfile2\n```\n\nExamine the contents\
    \ of `$outputfile2` to see the result of the preceding code snippet.\n\n### **Another\
    \ Simple Use Case**\n\nThe code sample in this section shows you how to use the\
    \ `cut` and `paste` commands in order to reverse the order of two columns in a\
    \ dataset. Keep in mind that the purpose of the shell script in [Listing 1.17](#chap1.xhtml_li1-17)\
    \ is to help you get some practice for writing `bash` scripts. The better solution\
    \ involves a single line of code (shown at the end of this section).\n\n[Listing\
    \ 1.16](#chap1.xhtml_li1-16) displays the contents of `namepairs.csv`, which contains\
    \ the first name and last name of a set of people, and [Listing 1.17](#chap1.xhtml_li1-17)\
    \ contains `reversecolumns.sh`, which illustrates how to reverse these two columns.\n\
    \n##### ***LISTING 1.16\\. namepairs.csv***\n\n```\n Jane,Smith\nDave,Jones\n\
    Sara,Edwards\n```\n\n##### ***LISTING 1.17\\. reversecolums.sh***\n\n```\n inputfile=\"\
    namepairs.csv\"\noutputfile=\"reversenames.csv\"\nfnames=\"fnames\"\nlnames=\"\
    lnames\"\n\ncat $inputfile|cut -d\",\" -f1 > $fnames\ncat $inputfile|cut -d\"\
    ,\" -f2 > $lnames\n\npaste -d\",\" $lnames $fnames > $outputfile\n```\n\nThe contents\
    \ of the output file are shown here:\n\n```\n Smith,Jane\nJones,Dave\nEdwards,Sara\n\
    ```\n\nThe code in [Listing 1.17](#chap1.xhtml_li1-17) (after removing blank lines)\
    \ consists of seven lines of code that involves creating two extra intermediate\
    \ files. Unless you need those files, it’s a good idea to remove those two files\
    \ (which you can do with one `rm` command).\n\nAlthough [Listing 1.17](#chap1.xhtml_li1-17)\
    \ is straightforward, there is a simpler way to execute this task: use the `cat`\
    \ command and the `awk` command (discussed in detail in [Chapter 5](#chap5.xhtml)).\n\
    \nSpecifically, compare the contents of `reversecolumns.sh` with the following\
    \ single line of code that combines the cat command and the `awk` command in order\
    \ to generate the same output:\n\n```\n cat namepairs.txt |awk -F\",\" '{print\
    \ $2 \",\" $1}'\n```\n\nThe output from the preceding code snippet is here:\n\n\
    ```\n Smith,Jane\nJones,Dave\nEdwards,Sara\n```\n\nAs you can see, there is a\
    \ big difference in these two solutions. If you are unfamiliar with the `awk`\
    \ command, then obviously you would not have thought of the second solution. However,\
    \ the more you learn about `bash` commands and how to combine them, the more adept\
    \ you will become in terms of writing better shell scripts to solve data cleaning\
    \ tasks. Another important point: document the commands as they get more complex,\
    \ as they can be hard to interpret later by others, or even by yourself if enough\
    \ time has passed. A comment like the following can be extremely helpful to interpreting\
    \ code:\n\n```\n # This command reverses first and last names in namepairs.txt\n\
    cat namepairs.txt |awk -F\",\" '{print $2 \",\" $1}'\n```\n\n### **Summary**\n\
    \nThis chapter started with an introduction to some Unix shells, followed by a\
    \ brief discussion of files, file permissions, and directories. You also learned\
    \ how to create files and directories and how to change their permissions. Next\
    \ you learned about environment variables, how to set them, and also how to use\
    \ aliases. You also learned about “sourcing” (also called “dotting”) a shell script\
    \ and how this changes variable behavior from calling a shell script in the normal\
    \ fashion.\n\nNext you learned about the `cut` command (for cutting columns and/or\
    \ fields) and the `paste` command (for “pasting” test together vertically). Finally,\
    \ you saw two use cases, the first of which involved the `cut` command and `paste`\
    \ command to switch the order to two columns in a dataset, and the second showed\
    \ you another way to perform the same task using concepts from later chapters.\n\
    \n## CHAPTER 2\n\n## USEFUL COMMANDS\n\nThis chapter discusses various `bash`\
    \ commands that you can use when working with datasets, such as splitting, sorting,\
    \ and comparing datasets. You see examples of finding files in a directory and\
    \ then searching for strings in those files using the bash “pipe” command that\
    \ redirects the output of one bash command as the input of a second bash command.\n\
    \nThe first part of this chapter shows you how to merge, fold, and split datasets.\
    \ This section also shows you how to sort files and find unique lines in files\
    \ using the `sort` and `uniq` commands, respectively. The last portion explains\
    \ how to compare text files and binary files.\n\nThe second section introduces\
    \ you to the `find` command, which is a powerful command that supports many options.\
    \ For example, you can search for files in the current directory or in subdirectories;\
    \ you can search for files based on their creation date and last modification\
    \ date. One convenient combination is to “pipe” the output of the `find` command\
    \ to the `xargs` command in order to search files for a particular pattern. Next\
    \ you will see how to use the `tr` command, a tool which handles a lot of commonly\
    \ used text transformations such as capitalization or removal of whitespace. After\
    \ the section that discusses the `tr` command you will see a use case that shows\
    \ you how use the tr command in order to remove the `^M` control character from\
    \ a dataset.\n\nThe third section contains compression-related commands, such\
    \ as `cpio, tar,` and `bash` commands for managing files that are already compressed\
    \ (such as `zdiff, zcmp, zmore,` and so forth).\n\nThe fourth section introduces\
    \ you to the `IFS` option, which is useful for extracting data from a range of\
    \ columns in a dataset. You will also see how to use the `xargs` command in order\
    \ to “line up” the columns of a dataset so that all rows have the same number\
    \ of columns.\n\nThe fifth section shows you how to create shell scripts, which\
    \ contain `bash` commands that are executed sequentially, and also how to use\
    \ recursion in order to compute the factorial value of a positive integer. The\
    \ Appendix for this book contains additional shell scripts that use recursion\
    \ in order to calculate the GCD (greatest common divisor) and LCM (lowest common\
    \ multiple) of two positive integers, the Fibonacci value of a positive integer,\
    \ and also the prime divisors of a positive integer.\n\n### The `join` Command\n\
    \nThe `join` command allows you to merge two files in a meaningful fashion, which\
    \ essentially creates a simple version of a relational database."
