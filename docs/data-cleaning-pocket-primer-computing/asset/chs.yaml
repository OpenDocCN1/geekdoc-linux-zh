  \n### Listing A.28: rainfall2.sh\n\n```bash\n # => 计算多个文件的行平均值\n#columns in rain.csv:\n\
  #DOW,inches of rain, degrees F, humidity (%)\n#files: rain1.csv, rain2.csv, rain3.csv\n\
  awk -F',' '\n{\n   mon_rain[FNR]+=$2\n   mon_degrees[FNR]+=$3\n   mon_humidity[FNR]+=$4\n\
