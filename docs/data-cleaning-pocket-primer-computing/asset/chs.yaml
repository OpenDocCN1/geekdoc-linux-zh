  ^M,EOS,,6.1,,6.2,,7.5,,6.6,,,7.0,,,6.2\n^M,EOSAB,,0.22,,0.30,,0.27,,0.25,,,0.22,,,0.21\n\
  ^M,HGB,,11.8,,11.1,,11.5,,,12.1,,,\n11.3^M,LYM,,36.7\n```\n\n显示文件 `controlm.sh`\
  \ 内容，说明了如何从 `controlm.csv` 中移除控制字符。\n### 列表 2.5 controlm.sh\n\n```\n inputfile=\"\
  controlm.csv\"\nremovectrlfile=\"removectrlfile\"\n```\n\n为了方便起见，列表 2.5 包含输入文件和一个输出变量，但你可以通过使用硬编码的值来简化列表\
  \ 2.5 中的 `tr` 命令。运行该脚本的输出在这里：\n\n```\n12,WEEK14,WEEK15,WEEK17,WEEK18,WEEK19,\n21\n\
  1,BASO,,1.4,,0.8,,1.2,,1.1,,,2.2,,,1.4\n1,BASOAB,,0.05,,0.04,,0.05,,0.04,,,0.07,,,0.05\n\
  1,EOS,,6.1,,6.2,,7.5,,6.6,,,7.0,,,6.2\n```\n\n你可以看到，本节的任务通过 `tr` 命令非常很容易地解决了。注意，需要额外的数据清洗来处理输出中的空字段。你还可以使用以下命令将当前的分隔符\
  \ “，” 替换为不同的分隔符，例如 “|”符号：\n\n```\n```\n\n结果输出在这里：\n\n```\n12|WEEK14|WEEK15|WEEK17|WEEK18|WEEK19|WEEK21\n\
  1|BASO|1.4|0.8|1.2|1.1|2.2|1.4\n1|BASOAB|0.05|0.04|0.05|0.04|0.07|0.05\n1|EOS|6.1|6.2|7.5|6.6|7.0|6.2\n\
  1|EOSAB|0.22|0.30|0.27|0.25|0.22|0.21\n\n如果你有在多个文件中具有任意顺序的多个分隔符的数据集，可以通过 `sed` 命令将这些分隔符替换为单个分隔符，该命令在第\
  \ 4 章中讨论过。\n\n### `find` 命令\n\n\n\n\n\n\n\n以下是几个示例：\n\n`find . –print` 显示所有文件（包括子目录）\n\
  \n\n`find . –print |grep \"sh$\"` 显示所有名称以 `sh` 结尾的文件。\n\n`find . –depth 2 –print`\
  \ 显示深度最多为 2 的所有文件（包括子目录）。\n\n\n作为另一个示例，以下命令找到所有在 2 天内修改过的文件，并打印每个文件的记录行数：\n\n```\n\
  $ find . –mtime -2 –exec wc –l {} ;\n\n你可以使用 `find` 命令删除一组文件。例如，你可以按照如下方式删除当前目录树中所有后缀为“m”的文件：\n\
  \n```\nfind . –name \"*m$\" –print –exec rm {}\n\n### 注意\n\n*删除文件时要小心：在删除它们之前，请运行不带“exec\
  \ rm {}”的前述命令以检查文件列表。*\n\n\n`tee` 命令允许你将输出显示在屏幕上，同时将输出重定向到文件。`–a` 选项会将后续输出追加到指定文件中，而不是覆盖该文件。示例下：\n\
  \n```\nfind . –print |xargs grep \"sh$\" | tee /tmp/blue\n\n上述代码段将当前目录中所有文件（以及任何子目录中的文件）的列表重定向到\
  \ `xargs` 命令，然后搜索并打印所有以字符串“sh”结尾的行。结果显示在屏幕上，并重定向到文件 `/tmp/blue`。\n\n```\nfind .\
  \ –print |xargs grep \"^abc$\" | tee –a /tmp/blue\n\n上述代码段还将当前目录中所有文件（以及任何子目录中的文件）的列表重定向到\
  \ `xargs` 命令，然后搜索并打印所有仅包含字符串“abc”的行。结果显示在屏幕上，并追加到文件 `/tmp/blue`。\n\n## 文件压缩命令\n\n\
  \n### `tar` 命令\n\n`tar` 命令允许你压缩目录中的一组文件、解压 tar 文件，并显示 tar 文件的内容。\n\n\n```\ntar cvf\
  \ testing.tar *.txt\n```\n\n\n```\na apple-care.txt\na checkin-commands.txt\na iphonemeetup.txt\n\
  a outfile.txt\na output.txt\na ssl-instructions.txt\n```\n\n\n```\ntar xvf testing.tar\n\
  ```\n\n\n```\ntar tvf testing.tar\n```\n\n\n“z”选项使用 `gzip` 压缩。例如，以下命令创建一个名为 `testing.tar.gz`\
  \ 的压缩文件：\n\n```\ntar czvf testing.tar.gz *.txt\n\n### `cpio` 命令\n\n在创建 tar 文件后，`cpio`\
  \ 命令提供了进一步的压缩。例如，以下命令创建文件 `archive.cpio`：\n\nls file1 file2 file3 | cpio -ov > archive.cpio\n\
  ```\n\n`-o`选项指定输出文件，`-v`选项指定详细，这意味着文件在置于存档文件时会被显示。`-I`选项指定输入，`-d`选项指定“显示”。\n\n\n\
  ```\nfind . –name \".sh\" | cpio -ov > shell-scripts.cpio\n```\n\n\n```\ncpio -id\
  \ < archive.cpio\n```\n\n\n```\nfile1\nfile2\nfile3\n```\n\n### `gzip` 和 `gunzip`\
  \ 命令\n\n`gzip` 命令创建一个压缩文件。例如，以下命令创建压缩文件 `filename.gz`：\n```\ngzip filename\n```\n\
  \n使用 `gunzip` 提取压缩文件 `filename.gz` 的内容：\n```\ngunzip filename.gz\n```\n\n\n\n\n\
  Listing 2.6 显示了数据集 `datacolumns1.txt` 的内容，Listing 2.7 显示了 脚本 `datacolumns1.sh` 的内容，该脚本演示了如何从\
  \ Listing 2.6 数据集中的一系列列提取数据。\n\n### 列表 2.6 datacolumns1.txt\n```\n #23456789012345678901234567890#\n\
  \  1000   Jane   Edwards\n  2000   Tom    Smith\n  3000   Dave   Del Ray\n\n###\
  \ 列表 2.7 datacolumns1.sh\n\n```\n # empid: 03-09\n## lname: 21-30\nIFS=''\ninputfile=\"\
  datacolumns1.txt\"\n\nwhile read line\n  pound=\"`echo $line |grep '^#'`\"\n\n \
  \ if [ x\"$pound\" == x\"\" ]\n  then\n    echo \"line: $line\"\n    echo \"empid:\
  \ $empid\"\n\n    fname=`echo \"$line\" |cut -c11-19`\n    echo \"fname: $fname\"\
  \n\n    echo \"lname: $lname\"\n    echo \"--------------\"\n  fi\ndone < $inputfile\n\
  ```\nListing 2.7 将 `IFS` 的值设置为空字符串，这是该脚本正常运行的所需的（尝试在不设置 `IFS` 的情况下运行此脚本看看会发生什么）。脚本体包含一个\
  \ `while` 循环，读取名为 `datacolumns1.txt` 的输入文件的每一行，如果行不以“#”字符开头，则将 `pound` 变量设置为“”；如果以“#”字符开头，则将\
  \ `pound` 变量设置为整行。这是一种根据行首字符来“过滤”行的简单技术。\n\n`if` 语句会对不以“#”字符开头的行执行，变量 `empid`、`fname`\
  \ 和 `lname` 分别初始化为第 3 到 9 列、第 11 到 19 列以及第 21 到 29 列的字符。这三个变量的值每次初始化时都会打印。如你所见，这些变量是通过\
  \ `echo` 命令和 `cut` 命令组合初始化的，并且需要 `IFS` 的值来确保 `echo` 命令不会移除空格。\n\nListing 2.7 的输出所示：\n\
  ```\n line:   1000   Jane   Edwards\nempid: 1000\nfname: Jane\nlname: Edwards\n\
  line:   2000   Tom    Smith\nempid: 2000\nfname: Tom\nlname: Smith\n--------------\n\
  empid: 3000\nfname: Dave\nlname: Del Ray\n--------------\n```\n### 处理数据集中的不均齐行\n\
  \nListing 2.8 显示了数据集 `uneven.txt` 的内容，该包含包含不同列数的行。Listing 2.9 显示了 `bash` 脚本 `uneven.sh`\
  \ 的内容，它演示了如何生成一个行具有相同列数的数据集。\n\n### 列表 2.8 uneven.txt\n```\n abc1 abc2 abc3 abc4\n\
  abc5 abc6\nabc1 abc2 abc3 abc4\nabc5 abc6\n\n### 列表 2.9 uneven.sh\n\n```\n inputfile=\"\
  uneven.txt\"\n\n## ==> 每行四个字段\n\n#method #1: 每行四个字段\ncat $inputfile | xargs -n 4\
  \ >$outputfile\n#method #2: 两个等行\n#xargs -L 2 <$inputfile > $outputfile\n\necho\
  \ \"input file:\"\ncat $inputfile\necho \"output file:\"\ncat $outputfile\n```\n\
  \nListing 2.9 包含了两种重新对齐输入文件的技术，使输出每行以四列的形式显示。如你所见，两种技术都涉及 `xargs` 命令（这是 `xargs`\
  \ 命令的一种有趣用法）。\n运行 Listing 2.9 中的代码，你将看到以下输出：\n\n```\nabc5 abc6 abc1 abc2\nabc3 abc4\
  \ abc5 abc6\n```\n### 在 Shell 脚本中使用函数\n\nShell 函数可以通过使用 `function` 关键字来定义，后跟函数名（由你指定）和一对圆括号，然后是一对包含\
  \ shell 命令的大括号。其通用形式所示如下：\n\n```\n{\n}\n```\n\n另一种定义 Shell 函数的方法所示：\n\n fname()\n\
  {\n   statements;\n}\n```\n可以通过其名称调用 Shell 函数：\n\n```\nfname()\n```\n参数可以传递给函数并由\
  \ shell 访问：\n\n```\narg1 arg2\n```\nListing 2.10 显示了 `checkuser.sh` 的内容，它演示了如何提示用户姓和姓。\n\
  \n### 列表 2.10 checkuser.sh\n\n```bash\n\n # empid: 03-09\n## fname: 11-20\n## lname:\
  \ 21-30\nIFS=''\n\nwhile read line\ndo\n  pound=\"`echo $line |grep '^#'`\"\n\n\
  \  then\n    echo \"line: $line\"\n    empid=`echo \"$line\" |cut -c3-9`\n    echo\
  \ \"empid: $empid\"\n\n    echo \"fname: $fname\"\n\n    lname=`echo \"$line\" |cut\
  \ -c21-29`\n    echo \"lname: $lname\"\n    echo \"--------------\"\ndone < $inputfile\n\
  ```\n\nListing 2.10 将 `IFS` 的值设置为空字符串，这是该脚本正常运行的所需的（尝试在不设置 `IFS` 的情况下运行此脚本看看会发生什么）。脚本体包含一个\
  \ `while` 循环，读取名为 `datacolumns1.txt` 的输入文件的每一行，如果行不以“#”字符开头，则将 `pound` 变量设置为“”；如果以“#”字符开头，则将\
  \ `pound` 变量设置为整行。这是一种根据行首字符来“过滤”行的简单技术。\n\n\nListing 2.10 的输出所示：\n\n```\n line:\
  \   1000   Jane   Edwards\nfname: Jane\nlname: Edwards\n--------------\nempid: 2000\n\
  lname: Smith\n--------------\nline:   3000   Dave   Del Ray\nfname: Dave\nlname:\
  \ Del Ray\n--------------\n```\n\n\nListing 2.10 将 `IFS` 的值设置为空字符串，这是该脚本正常运行的所需的（尝试在不设置\
  \ `IFS` 的情况下运行此脚本看看会发生什么）。脚本体包含一个 `while` 循环，读取名为 `datacolumns1.txt` 的输入文件的每一行，如果行不以“#”字符开头，则将\
  \ `pound` 变量设置为“”；如果以“#”字符开头，则将 `pound` 变量设置为整行。这是一种根据行首字符来“过滤”行的简单技术。\n\n\n\n在\
  \ Listing 2.10 的底部添加以下代码：\n\n```\nresult=`checkuser $fname $lname`\n```\n\n运行修改后的\
  \ Listing 2.10，提供相同的输入值 `John` 和 `Smith`，并比较以下结果：\n```\n line:   1000   Jane   Edwards\n\
  empid: 1000\nlname: Edwards\n--------------\nline:   2000   Tom    Smith\nfname:\
  \ Tom\nlname: Smith\n--------------\nline:   3000   Dave   Del Ray\nempid: 3000\n\
  lname: Del Ray\n--------------\n```\n\n## 递归与 Shell 脚本\n本节包含了几个带有递归的脚本示例，递归是许多编程语言中的一个主题。虽然你可能不需要编写使用递归的脚本，但学习这个概念是有用的，特别是如果你计划学习其他语言。如果你已经理解了递归，那么本节的脚本将非常简单。特别是你将学习如何计算正整数的阶。如果你感兴趣，附录包含了计算正整数斐波那契数的\
  \ bash 脚本，以及计算两个正整数的最大公约数 (GCD) 和最小公倍数 (LCM) 的 bash 脚本。\n\nListing 2.11 显示了 `Factorial.sh`\
  \ 的内容，它计算正整数的阶。\n```\n #!/bin/sh\n\n{\n\n   if [ \"$1\" -gt 1 ]\n   then\n     \
  \ decr=`expr $1 - 1`\n      product=`expr $1 \\* $result`\n      echo $product\n\
  \   else\n      echo 1\n   fi\n}\necho \"Enter a number: \"\nread num\n## 添加代码以确保它是正整数\n\
  \necho \"$num! = `factorial $num`\"\n```\n\n\n\n\n\nListing 2.11 的最后部分提示用户输入一个数字，然后计算并显示该数字的阶乘。为了简单起见，没有检查非整数值（你可以尝试自己添加该功能）。\n\
  \n\n### LISTING 2.12 Factorial2.sh\n\n#!/bin/bash\n\nfactorial()\n   num=$1\n  \
  \ result=1\n   for (( i=2; i<=${num}; i++ ));\n   do\n     result=$((${result}*$i))\n\
  \n   echo $result\n}\nprintf \"Enter a number: \"\nread num\n\necho \"$num! = `factorial\
  \ $num`\"\n```\nListing 2.12 包含一个名为 `factorial()` 的函数，它将变量 `num` 初始化为传递给函数 `factorial()`\
  \ 的第一个参数，随后初始化变量 `result` 为 1。Listing 2.12 的下一部分是一个 `for` 循环，迭代地将 `result` 的值与 2\
  \ 到 `num` 之间的数字相乘，然后返回变量 `result` 的值。\n\nListing 2.12 的最后部分提示用户输入一个数字，然后使用命令替换用用户提供调用函数\
  \ `factorial()`。注意，没有进行验证以确保输入值为非负整数。`echo` 语句显示计算出的阶乘值。\nListing 2.13 显示了 `Factorial3.sh`\
  \ 的内容，它使用 `for` 循环和一个用于跟踪中间阶乘值的数组来计算正整数的阶乘。\n\n### LISTING 2.13 Factorial3.sh\n\n\
  ```\n\nfactorial()\n{\n   num=$1\n   result=1\n   do\n     result=$((${result}*$i))\n\
  \     factvalues[$i]=$result\n}\n\nprintf \"Enter a number: \"\n\nfor (( i=1; i<=${num};\
  \ i++ ));\ndo\n  factvalues[$i]=1\ndone\nfactorial $num\n\n## 通过循环打印每个元素：\nfor ((\
  \ i=1; i<=${num}; i++ ));\ndo\ndone\n```\n\n\nListing 2.13 的最后部分包含一个 `for` 循环，显示中间阶乘值以及用户提供的输入的阶乘。\n\
  \n\n本章向你展示了如何使用一些有用且多功能的 `bash` 命令的示例。首先，你学习了 `join`、`fold`、`split`、`sort` 和 `uniq`\
  \ 等 bash 命令。接下来，你学习了 `find` 命令和 `xargs` 命令。你还学习了使用 `tr` 命令的各种方法，它在本章的用例中也有涉及。\n\n\
  然后，你看到了一些与压缩相关的命令，如 `cpio` 和 `tar`，它们帮助你创建新的压缩文件，并帮助你检查压缩文件的内容。\n\n\n## 第 3 章\n\n\
  \n本章向你介绍了功能强大的 `grep` 命令，其目的是获取一个文本数据流并将其简化为你感兴趣的部分。`grep` 命令单独使用很有用，与其他命令结合使用同样有用，特别是结合\
  \ `find` 命令。本章包含许多短代码示例，说明了 `grep` 命令的不同选项。某些代码示例演示了如何将 `grep` 命令与之前章节中的命令结合。\n\n\
  本章的第一部分介绍了孤立使用的 `grep` 命令，并结合了正则表达式元字符（来自第 1 章），还附带了如何将 `grep` 命令与之前章节的命令结合的代码片段。（注：原文此处有重复表述）。\n\
  \n\n\n\n```\n -rw-r--r-- 1 oswaldcampesato2 staff   3 Sep 27 2017 abc.txt\n-rw-r--r--\
  \ 1 oswaldcampesato2 staff  27 Sep 28 2017 fiblist.txt\n-rw-r--r-- 1 oswaldcampesato2\
  \ staff  28 Sep 14 2017 dest\n-rw-r--r-- 1 oswaldcampesato2 staff  36 Sep 14 2017\
  \ source\n-rw-r--r-- 1 oswaldcampesato2 staff 267 Sep 28 2017 Divisors2.py\n```\n\
  \n### 元字符与 `grep` 命令\n\n\n正则表达式后面可以跟随几个重复运算符之一，如下所示\n\n`. ` 匹配任意单个字符。\n\n\n`*` 表示前面的项匹配零次或多次：`Z*`\
  \ 匹配 `Z`、`ZZ`、`ZZZ` 等。\n\n\n`{n}` 表示前面的项恰好匹配 `n` 次：`Z{3}` 匹配 `ZZZ`。\n\n`{n,}` 表示前面的项匹配\
  \ n 次或多次：`Z{3,}` 匹配 `ZZZ`、`ZZZZ` 等。\n\n\n`{n,m}` 表示前面的项至少匹配 `n` 次，但不超过 `m` 次：`Z{2,4}`\
  \ 匹配 `ZZ`、`ZZZ` 和 `ZZZZ`。\n\n\n### 使用 `grep` 命令转义元字符\n\n[列表 3.1 显示了 `lines.txt`\
  \ 的内容，其中包含了带有单词和元字符的行。\n\n\n```\n abcd\nab\nabc\ndefg\n.*.\n..\n\n接下来的 `grep` 命令列出了\
  \ `lines.txt` 中长度为 2 的行（使用 `^` 开始和 `$` 结束操作符来限制长度）：\n\n```\n grep '^..$' lines.txt\n\
  \n接下来的命令列出了 `lines.txt` 中长度为 2 且包含两个点的行（反斜杠告诉 `grep` 将点解释为实际的点，而不是元字符）：\n\n grep\
  \ '^\\.\\.$' lines.txt\n```\n\n\n```\n ab\ncd\n..\n\n接下来的命令还显示了以点开头和结尾的长度为 2 的行（`*`\
  \ 匹配任意长度的任意文本，包括没有任何文本，由于它前面没有反斜杠，因此被用作元字符）：\n\n```\n grep '^\\.*\\.$' lines.txt\n\
  \n接下来的命令列出了包含句点、紧跟星号、然后是另一个点的行（`\\*` 现在是一个必须匹配的字符，因为它的前面有反斜杠）：\n\n```\n grep '^\\\
  .\\*\\.$' lines.txt\n\n### `grep` 命令的实用选项\n\n\n在接下来的示例中，我们在一个目录中有四个文本文件（两个 `.sh`\
  \ 和两个 `.txt`）和两个 Word 文档。字符串 `abc` 出现在 `abc1.txt` 的的一行中，以及 `abc3.sh` 的三行中。字符串 `ABC`\
  \ 出现在 `ABC2.txt` 的 2 行中，以及 `ABC4.sh` 的 4 行中。注意在 `ABC` 文件中没有找到 `abc`，在 `abc` 文件也没有找到\
  \ `ABC`。\n\n```\n ls *\nabc3.sh\n```\n\n接下来的代码段在当前目录下搜索所有以 `sh` 为后缀的文件中字符串 `abc`\
  \ 的出现情况：\n\n grep abc *sh\nabc3.sh:abc at start\nabc3.sh:ends with -abc\nabc3.sh:the\
  \ abc is in the middle\n```\n`-c` 选项统计字符串出现的次数（注意，尽管 `ABC4.sh` 没有匹配项，但它仍然会计数并返回零）：\n\
  \n```\n grep –c abc *sh\n```\n上一个命令的输出如下：\n\n```\n ABC4.sh:0\nabc3.sh:3\n\n`-e`\
  \ 选项允许你匹配在 otherwise 会引起语法问题的模式（`-` 字符通常会被解释为 `grep` 的参数）：\n\n```\n grep –e \"-abc\"\
  \ *sh\n```\n\n`-e` 选项还允许你匹配多个模式。\n\n```\nABC4.sh:# ABC in a comment\nabc3.sh:ends\
  \ with -abc\n```\n`-i` 选项用于忽略大小写的匹配：\n\n```\n grep –i abc *sh\nABC4.sh:ABC at start\n\
  ABC4.sh:the ABC is in the middle\nABC4.sh:# ABC in a comment\nabc3.sh:abc at start\n\
  abc3.sh:ends with -abc\nabc3.sh:the abc is in the middle\n\n`-v` 选项“反转”匹配字符串，这意味着不显示匹配的字符串：\n\
  \n```\n grep –v abc *sh\nABC4.sh:ends with ABC\nABC4.sh:the ABC is in the middle\n\
  ABC4.sh:# ABC in a comment\n```\n\n\n\n\ngrep --color abc *sh\nabc3.sh:abc at start\n\
  abc3.sh:ends with −abc\nabc3.sh:the abc is in the middle\n```\n你可以使用元字符对 `.*` 来查找两个之间隔着任意数量中间字符的单词。\n\
  \n以下命令查找所有包含 `one` 和 `three` 字符串的行，中间可以有任意数量字符：\n\n```bash\none two three\n```\n\
  \n你可以使用 `-v` 选项来“反转”上述结果，如下所示：\n\ngrep –v \"one.*three\" columns4.txt\n123 ONE TWO\n\
  456 three four\nONE TWO THREE FOUR\nfive 123 six\n```\n\n以下命令查找所有包含 `one` 和 `three`\
  \ 字符串的行，中间可以有任意数量字符，且匹配涉及不区分大小写的比较：\n\n```bash\nONE TWO THREE FOUR\none two three\n\
  ```\n\n你可以使用 `-v` 选项来“反转”上述结果，如下所示：\n```bash\ngrep –iv \"one.*three\" columns4.txt\n\
  123 ONE TWO\n456 three four\nfive 123 six\n```\n\n有时你需要搜索文件以是否存在两个字符串中的一个。例如，以下命令找到包含\
  \ `start` 或 `end` 的文件：\n\n```bash\nABC2.txt\nABC4.sh\nabc3.sh\n```\n\n\n## 字符类与\
  \ `grep` 命令\n\n本节包含了一些简单的单行命令，将 `grep` 命令与字符类结合。\n\necho \"abc\" | grep '[:alpha:]'\n\
  abc\necho \"123\" | grep '[:alpha:]'\n(无返回，无匹配)\necho \"abc123\" | grep '[:alpha:]'\n\
  echo \"abc\" | grep '[:alnum:]'\nabc\necho \"123\" | grep '[:alnum:]'\n(无返回，无匹配)\n\
  echo \"abc123\" | grep '[:alnum:]'\necho \"123\" | grep '[:alnum:]'\n(无返回，无匹配)\n\
  echo \"abc123\" | grep '[:alnum:]'\nabc123\necho \"abc\" | grep '[0-9]'\necho \"\
  123\" | grep '[0-9]'\n123\necho \"abc123\" | grep '[0-9]'\nabc123\necho \"abc123\"\
  \ | grep -w '[0-9]'\n```\n\n## 在 `grep` 中使用 –c 选项\n\n考虑这样一种场景：一个目录（例如日志目录）中由外部程序创建的文件。你的任务是编写一个\
  \ shell 脚本，确定哪些包含两个字符串出现次数的文件（如果有的话），然后对匹配的文件进行额外处理（例如，使用电子邮件将包含两个或更多错误消息的日志发送给系统管理员进行调查）。\n\
  一种解决方案涉及使用 `grep` 的 `-c` 选项，随后再次调用 `grep` 命令。\n\n本节中的命令片段假设存在以下数据文件，内容内容所示。\n\n\
  文件 `hello1.txt` 内容如下：\n```bash\nhello world1\n```\n\n文件 `hello2.txt` 内容如下：\n```\n\
  hello world2\nhello world2 second time\n```\n\n\n```\nhello world3\nhello world3\
  \ two\nhello world3 three\n\n现在运行以下命令（`2>/dev/null` 防止空目录引起的警告和错误污染输出）：\n\n```bash\n\
  grep -c hello hello*txt 2>/dev/null\nhello2.txt:2\nhello3.txt:3\ngrep -l hello hello*txt\
  \ 2>/dev/null\nhello1.txt\nhello2.txt\ngrep -c hello hello*txt 2>/dev/null |grep\
  \ \":2$\"\nhello2.txt:2\n```\n\n注意我们如何使用“以...结尾”的元字符 `$` 来仅获取恰好有两个匹配项的文件。我们还使用冒号\
  \ `:2$` 而不仅仅是 `2$`，以防止获取到具有 12、32 或 142 个匹配项的文件（它们以 `:12`、`:32` 和 `:142` 结尾）。\n\
  如果我们想显示“两个或更多”（例如“日志中有 2 个或更多错误”）怎么办？你将使用反反 (`-v`) 命令来排除恰好为 0 或恰好为 1 的计数。\n\n```bash\n\
  grep -c hello hello*txt 2>/dev/null |grep -v ':[0-1]$'\nhello2.txt:2\n```\n\n在实际应用中，你想去掉冒号之后的所有内容以仅返回文件名。有很多方法可以实现，我们将使用第\
  \ 1 章中学学的 `cut` 命令。\n\n## 匹配行范围\n在第 1 章中，你学习了如何通过 `grep` 和 `xargs` 命令找到包含一对字符串的文件。现在假设你想搜索行范围。例如，以下命令显示\
  \ `longfile.txt` 中第 9 到 15 行包含 `and:` 的行：\n\n```bash\ncat longfile.txt |head -15|tail\
  \ -9 |grep \"$$\"\n```\n输出如下（因为我们没有使用 `cat -n`，所以没有行号）：\n\n```\nand each line\n\
  and if you\n\n记得“在命令中使用文件名，而不是先用 `cat` 显示文件”这种风格更高效：\n\n```bash\nhead -15 longfile.txt\
  \ |tail -9 |grep \"$$\"\nand if you\n```\n\n然而，`head` 命令不显示文本文件的行号，因此在需要查看行号时，早期的示例中使用了“先\
  \ cat”（`cat -n` 添加行号）的风格，尽管这种风格效率较低。基本上，只有当向管道中添加额外的命令有价值时才这样做，否则最好直接调用要处理的文件，假设命令语法可以读取文件名。\n\
  \n\n```bash\ncat longfile.txt |head -15|tail -9 |grep \"^and\"\n```\n\n\n```\nand\
  \ each line\nand if you\n```\n注意，上述命令排除了以“and”结尾的行，因为它们没有空格。你可以通过包含两者的“或”运算符解决这种情况：\n\
  \n```bash\ncat -n longfile.txt |head -15|tail -9 |grep \"$$\"\n```\n因此，如果你真的想匹配特定的单词，最好使用\
  \ `-w` 标签，它足够智能处理处理变化：\n\n```bash\ncat -n longfile.txt |head -15|tail -9 |grep -w\
  \ \"and\"\n```\n然而，前面的操作让“命令”变回了混合。\n\n## 在 `grep` 命令中使用反向引用\n\n`grep` 命令允许你引用放在括号内的正则表达式所匹配的字符集。为了让\
  \ `grep` 正确解析括号，每个括号前面都必须加上转义字符 `\\.`。\n例如，`grep` 'a\\(.\\)` 使用 `.` 正则表达式来匹配 ab\
  \ 或 `a3`，但不匹配 `3a` 或 `ba.`。\n\n\n\n\n反向引用 `\\n`（其中 `n` 是单个数字）匹配正则表达式中第 `n` 个括号分组子表达式之前匹配的子字符串。例如，`grep\
  \ '\\(a\\)\\1` 匹配“aa”，而 `grep '\\(a\\)\\2` 匹配“aaa”。\n\n当与选择分支（alternation）配合使用时，如果组没有参与匹配，则反向引用会导致整个匹配失败。例如，`grep\
  \ '\\a\\(.\\)|b\\1` 将不会匹配 `ba`、`ab` 或 `bb`（或者实际上任何其他内容）。\n\n如果你在括号内有多个正则表达式，它们可以通过\
  \ `\\1`、`\\2`、`. . .`、`\\9` 从左到右进行引用。\n```\ngrep -e '\\([a-z]\\)\\([0-9]\\)\\1'\
  \ 等同于此命令:\ngrep -e '\\([a-z]\\)\\([0-9]\\)\\([a-z]\\)'\ngrep -e '\\([a-z]\\)\\([0-9]\\\
  )\\2' 等同于此命令:\ngrep -e '\\([a-z]\\)\\([0-9]\\)\\([0-9]\\)'\n\n最简单的理解方式是，数字（例如 `\\\
  2`）是一个占位符或变量，可以避免你输入它所引用的长正则表达式。由于正则表达式可能会变得极其复杂，这通常有助于代码的清晰度。\n\n你可以使用模式 `\\([0-9]\\\
  )\\1` 来匹配连续的数字或字符。例如，以下命令能够成功匹配，因为字符串“1223”包含一对连续的相同数字：\n\necho \"1223\" | grep\
  \ -e '\\([0-9]\\)\\1'\n```\n\n同样地，以下命令能够成功匹配，因为字符串“12223”包含了三个连续出现的数字 `2`：。\n\n\
  echo \"12223\" | grep -e '\\([0-9]\\)\\1\\1'\n```\n\n你可以使用此表达式来检查被任何字符隔开的两个相同数字的出现：\n\
  \necho \"12z23\" | grep -e '\\([0-9]\\).\\1'\n```\n\n\n```\necho \"abbc\" | grep\
  \ -e '\\([a-z]\\)\\1'\n```\n\n\n```\necho \"192.168.125.103\" | grep -e\n'\\(\\\
  d\\d\\d\\)\\.\\(\\d\\d\\d\\)\\.\\(\\d\\d\\d\\)\\.\\(\\d\\d\\d\\)'\n```\n如果你允许少于三个数字，可以使用表达式\
  \ `{1,3}`，它匹配第三块中的 1、2 或 3 个数字。在四个块中任何可能少于三个字符的情况下，你必须在四个块中使用以下类型的语法：\n\n```\necho\
  \ \"192.168.5.103\" | grep -e\n'\\(\\d\\d\\d\\)\\.\\(\\d\\d\\d\\)\\.\\(\\d)\\{1,3\\\
  }\\.\\(\\d\\d\\d\\)'\n\n你可以使用反向引用执行更复杂的匹配。[列表 3.3] 显示了 `columns5.txt` 的内容，其中包含几行回文（从左到右和从右到左的拼写相同）。注意第三行是一个空行。\n\
  \n### 列表 3.3 columns5.txt\n\none eno\nONE ENO\nONE TWO OWT ENO\nfour five\n```\n\
  以下命令找到所有回文行：\n\n```\ngrep -w -e '\\(.\\)\\(.\\).*\\2\\1' columns5.txt\n```\n上一个命令的输出在这里：\n\
  \n```\none eno\nONE ENO\n```\n\n思路如下：第一个 `\\(.\\)` 匹配一组字母，紧接着是第二个 `\\(.\\)` 匹配一组字母，然后是任意数量的中间字符。序列\
  \ `\\2\\1` 反转了由两个连续出现的 `\\(.\\)` 指定的匹配字母组的顺序。\n\n### 在数据集中查找空行\n回想元字符 `^` 指行首，元字符\
  \ `$` 指行尾。因此，一个空行由序列 `^$` 组成。你可以通过此命令找到 `columns5.txt` 中的空行：\n\n```\ngrep -n \"\
  ^$\" columns5.txt\n```\n上一个 `grep` 命令的输出在这里（使用 `-n` 选项来显示行号，否则空行不会显示在输出中）：\n\n```\n\
  3:\n```\n更常见的目标是简单地从文件中删除空行。我们可以通过反转之前的查询来实现（并且不显示行号）：\n\n```\ngrep -v \"^$\" columns5.txt\n\
  one eno\nONE TWO OWT ENO\nfour five\n```\n\n如你所示，之前的输出显示了四个非空行，正如我们在之前的 `grep` 命令中看到的，第\
  \ 3 行是一个空行。\n### 使用键搜索数据集\n\n数据通常围绕唯一值（通常是数字）组织，以区分其他相似的内容：例如，在员工数据集中，*经理* `John\
  \ Smith` 不能与*程序员*的 `John Smith` 混淆。因此，每条记录都分配了一个唯一数字，用于所有与员工相关的查询。此外，他们的名字仅仅是给定记录的数据元素，而不是识别包含特定人员记录的手段。\n\
  \n考虑到上述点，假设你有一个文本文件，每行包含一个键值。此外，另一个文本文件由一个或多行组成，每行包含一个键值，后跟一个数量值。\n作为说明，列表 3.4]\
  \ 显示了 `skuvalues.txt` 的内容，列表 3.5] 显示了 `skusold.txt` 的内容。注意 `SKU` 是经常用于指单个产品配置的术语，包括其包装、标签等。\n\
  \n### 列表 3.4 skuvalues.txt\n\n### 列表 3.5 skusold.txt\n\n\n\n\n注意 `grep –R hello`\
  \ 也会在所有文件（包括子目录）中搜索字符串 `hello`，并遵循“单进程”的建议。另一方面，`find .` –print` 命令会搜索所有子目录中的所有文件，你可以将输出管道到\
  \ `xargs grep hello`，以便找到所有文件中单词 `hello` 的出现次数（这涉及到两个进程而不是一个进程）。\n你可以使用前一个代码段的输出将匹配的文件复制到另一个目录，如下所示：\n\
  \n```\n cp `find . –print |grep \"sh$\" | xargs grep –l abc` /tmp\n```\n或者，你可以使用\
  \ `grep` 命令将当前目录中的匹配文件（不包含任何子目录中的匹配文件）复制到另一个目录：\n\n```\n cp `grep –l abc *sh` /tmp\n\
  ```\n另一种方法是使用“反引号”（back tick），这样你就可以获取额外信息：\n\n```\n for file in `find . –print`\n\
  do\n    # 现在在此执行某些操作\ndone\n```\n\n请记住，如果你向 `xargs` 命令传递过多的文件名，将看到“文件过多”的错误消息。在这种情况下，尝试在\
  \ `xargs` 命令之前插入额外的 `grep` 命令，以减少被管道到 `xargs` 命令的文件数量。\n如果你使用 NodeJS 工作，你会知道 `node_modules`\
  \ 目录包含大量文件。在大多数情况下，当你搜索字符串时可能想排除该目录中的文件，而“-v”选项是处理这种情况的理想选择。以下命令在搜索包含字符串 `src` 的\
  \ HTML 文件名的同时，排除 `node_modules` 目录中的文件，并将文件名重定向到文件 `src_list.txt`（同时将错误消息重定向到 `/dev/null`）：\n\
  \n```\n find . –print |grep –v node |xargs grep –il src >src_list.txt 2>/dev/null\n\
  ```\n你可以使用以下命令扩展前一个命令，搜索包含字符串 `src` 和字符串 `angular` 的 HTML 文件：\n\n```\n find . –print\
  \ |grep –v node |xargs grep –il src |xargs grep –il angular >angular_list.txt 2>/dev/null\n\
  ```\n你可以使用以下 `grep` 和 `xargs` 的组合来找到同时包含 `xml` 和 `defs` 的文件：\n\n```\n grep -l xml\
  \ *svg |xargs grep -l def\n```\n前一个命令的变体将错误消息重定向到 `/dev/null`，如下所示：\n\n```\ngrep\
  \ -l hello *txt 2>/dev/null | xargs grep -c hello\n```\n## 在 Zip 文件中搜索字符串\n\n至少有三种方法在一个或多个\
  \ zip 文件中搜索字符串。例如，假设你想确定哪些 zip 文件包含 SVG 文档。\n\n第一种方法所示：\n```\ndo\n   echo \"Searching\
  \ $f\"\n   jar tvf $f |grep \"svg$\"\ndone\n```\n当目录中有许多 zip 文件时，前一个循环的输出可能会非常冗长，在这种情况下，你需要向上滚动，并可能需要复制/粘贴实际包含\
  \ SVG 文档的文件名到单独的文件。更好的解决方案是将前一个循环放入 shell 并重定向其输出。例如，创建文件 `findsvg.sh`，其内容为前述的循环，然后调用此命令：\n\
  \n```\n ./findsvg.sh 1>1 2>2\n```\n注意，前一个命令将错误消息（`2>`）重定向到文件 2，并将 `jar/grep` 命令的结果（`1>`）重定向到文件\
  \ 1。参见附录中关于搜索 zip 文件中 SVG 文档的另一个示例。\n\n## 检查唯一键值\n\n有时你需要检查文本文件中是否存在某个字符串（如键），然后根据其存在性进行额外处理。然而，不要假设字符串的存在意味着该字符串只出现一次。作为一个简单的例子，假设文件\
  \ `mykeys.txt` 具有以下内容：\n```\n 2000\n22000\n10000\n3000\n\n假设你搜索字符串 `2000`，你可以通过\
  \ `findkey.sh` 实现，其内容显示在[Listing 3.6]中。\n\n### 列表 3.6 findkey.sh\n\n key=\"2000\"\
  \nif [ \"`grep $key mykeys.txt` != \"\" ]\nthen\n foundkey=true\nelse\nfi\necho\
  \ \"current key = $key\"\necho \"found key = $foundkey\"\n```\n\n\n```\n current\
  \ key = 2000\nfound key   = true\nlinecount   = 2\n\n虽然键值 2000 确实存在于 `mykeys.txt`\
  \ 中，你可以看到它是匹配的。\n\n## 重定向错误消息\n\n\n```\nfind . –print |xargs grep\n```\n\n\n```\n\
  find . –print |xargs grep\n```\n\n\n`egrep` 命令几乎与 `grep` 相同，具有某些功能。\n\n## 使用 `egrep`\
  \ 在数据集中显示“纯”单词\n\n\n```\n x=\"ghi abc Ghi 123 #def5 123z\"\n```\n\n\n```\n echo\
  \ $x |tr -s ' ' '\\n'\n```\n\n\n```\n ghi\nabc\nGhi\n#def5\n123z\n```\n\n第二步是使用正则表达式\
  \ `^[a-zA-Z]+` 调用 `egrep`，该表达式匹配由一个或多个大写和/或小写字母组成的字符串（不包含其他字符）：\n```\n echo $x |tr\
  \ -s ' ' '\\n' |egrep \"^[a-zA-Z]+$\"\n```\n\n输出如下：\n\n```\n ghi\nabc\nGhi\n```\n\
  \n\n\n\n\n如果你也想对输出进行排序并只打印唯一的单词，可以使用此命令：\n\n```\n echo $x |tr -s ' ' '\\n' |egrep\
  \ \"^[a-zA-Z]+$\" |sort | uniq\n```\n\n输出结果如下：\n\n```\n 123\n123z\nGhi\nabc\nghi\n\
  ```\n\n如果你只想从变量 `x` 中提取整数，可以使用此命令：\n\n```\n echo $x |tr -s ' ' '\\n' |egrep \"^[0-9]+$\"\
  \ |sort | uniq\n```\n\n输出结果如下：\n\n```\n 123\n```\n\n如果你想从变量 `x` 中提取字母数字单词，可以使用此命令：\n\
  \n```\n echo $x |tr -s ' ' '\\n' |egrep \"^[a-zA-Z0-9]+$\" |sort | uniq\n```\n\n\
  输出结果如下：\n\n```\n 123\n123z\nGhi\nabc \nghi\n```\n\n注意，ASCII 排序序列将数字放在大写字母之前，而大写字母又在小写字母之前，原因如下：0\
  \ 到 9 是十六进制值 `0x30` 到 `0x39`，A–Z 大写字母是十六进制 `0x41` 到 `0x5a`，a–z 小写字母是十六进制 `0x61`\
  \ 到 `0x7a`。\n\n现在你可以将 `echo $x` 替换为数据集，以便从集中仅检索字母字符串。\n\n### `fgrep` 命令\n\n`fgrep`（“快速\
  \ grep”）与 `grep –F` 相同，虽然 `fgrep` 已被弃用，但它仍然被支持，以便允许依赖它的历史应用程序在不修改的情况下运行。此外，某些旧系统可能不支持\
  \ `grep` 命令的 –F 选项，因此它们使用 `fgrep` 命令。如果你真的想学习更多关于 `fgrep` 命令的知识，可以在互联网上搜索教程。\n\n\
  ### 简单用例\n\n本节中的代码示例展示了如何使用 `grep` 命令在数据集中查找特定行，然后“合并”行对以创建一个新的数据集。这与关系型数据库中的“join”命令非常相似。列出\
