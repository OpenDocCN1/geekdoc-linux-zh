  \ HUMITY\\n\")\n  for(i=1; i<=FNR; i++){\n    printf(\"%3d %-6.2f %-8.2f %-7.2f\\\
  n\",\n     i,mon_rain[i]/idx[i],mon_degrees[i]/idx[i],mon_humidity[i]/idx[i])\n\
  \  }\n}\n' `echo $files`\n```\n\nListing A.32 执行与 Listing A.28 相同的，不同之处在于：由变量 `files`\
  \ 指定的数据集是由正则表达式 `` `ls rain*csv zain*csv` `` 定义的。你可以修改此正则表达式以包含任何需要处理的文件。注意 Listing\
  \ A.32 中的最后一行代码使用了反引号替换来展开 `files` 变量定义中的正则表达式：\n\n```\n ' `echo $files`\n```\n\n\
  作为另一种变体，你可以指定一个包含文件名列表的文件——我们称其为 `filelist.txt`，然后按如下替换前面的行：\n\n```\n ' `cat filelist.txt`\n\
