  ### 总结\n\n本章向你展示了如何使用 `grep` 工具，这是一个非常强大的 Unix 命令，用于在文本字段中搜索字符串。你学习了 `grep` 命令的各种选项，以及如何使用这些选项在文件中查找字符串模式的示例。接下来，你学习了\
  \ `egrep`，它是 `grep` 命令的一个变体。\n\n### 使用 `sed` 转换数据\n\n## 第 4 章：使用 `sed` 转换数据\n\n\
  在前面的章节中，我们学习了如何通过 `grep` 来缩小数据集。在本章中，我们将学习如何使用 `sed` 工具来转换数据，`sed` 的全称是“流编辑器”。\n\
  \n本章的第一部分包含了 `sed` 命令的基本示例，例如替换和删除。本章的第二部分讨论了 `sed` 的各种可用选项，以及如何使用它们来处理特定的数据。在最后部分，你将看到如何结合正则表达式来实现复杂的任务。\n\
  \n### 什么是 `sed` 命令？\n\n`sed` 的名称全称为“流编辑器”，该工具的许多命令源自 `ed`（`ed` 是第一个行编辑器）。`sed` 命令是一个非交互式的流编辑器，可以通过脚本自动化编辑。这种像在编辑器内部一样处理整个数据流（类似于\
  \ `grep` 的行为）的能力在现代编程语言中并不常见。`sed` 的一些常见用途包括：打印匹配行、删除匹配行以及查找/替换字符串。\n\n### 使用 `sed`\
  \ 匹配字符串模式\n\n`sed` 命令要求你指定一个字符串以匹配文件中的行。例如，假设文件 `numbers.txt` 包含以下行：\n\n```\n 1\n\
  2\n123\n3\nfive\n4\n```\n\n以下 `sed` 命令打印所有包含字符串 3 的行：\n\n```\n cat numbers.txt |sed\
  \ –n \"/3/p\"\n```\n\n另一种产生相同结果的方法：\n\n```\n sed –n \"/3/p\" numbers.txt\n```\n\n\
  \n\n\n正如我们之前在其他命令中看到的，直接使用 `sed` 命令读取文件总是比通过其他命令进行管道传输更高效。你可以从另一个命令向它“喂送”数据，前提是该命令添加了价值（例如添加行号、删除空行或其他类似的有帮助的操作）。\n\
  \n`-n` 选项会抑制所有输出，而 `p` 选项会打印匹配的行。如果你省略了 `-n` 选项，则每一行都会被打印，而 `p` 选项会导致匹配的行被再次打印。因此，你可以执行以下命令：\n\
  \n```\n sed \"/3/p\" numbers.txt\n```\n\n输出（冒号右侧的数据）如下。注意，冒号左侧的标签显示了数据的来源，用来说说明\
  \ `sed` “一次处理一行”的行为。\n\n```\n Basic stream output :1\nBasic stream output :2\nBasic\
  \ stream output :123\nPattern Matched text:123\nBasic stream output :3\nPattern\
  \ Matched text:3\nBasic stream output :five\nBasic stream output :4\n```\n\n还可以匹配两个模式并打印匹配行之间的所有内容：\n\
  \n```\n sed –n \"/123/,/five/p\" numbers.txt\n```\n\n上一个命令的输出（包含 123 到 five 之间的所有行）在这里：\n\
  \n```\n 123\n3\nfive\n```\n\n### 使用 `sed` 替换字符串模式\n\n本节中的示例说明了如何使用 `sed` 将现有文本模式替换为新文本。\n\
  \n```\n x=\"abc\"\necho $x |sed \"s/abc/def/\"\n```\n\n上一个代码段的输出在这里：\n\n```\n def\n\
  ```\n\n在之前的命令中，你指示 `sed` 将第一个文本模式 `/abc` 替换为第二个模式 `/def`，并且没有后续的指令 `/`。\n\n删除文本模式只需将第二个模式留空即可：\n\
  \n```\n echo \"abcdefabc\" |sed \"s/abc//\"\n```\n\n结果在这里：\n\n```\n defabc\n```\n\
  \n如你所见，这只删除了模式的第一次出现。你可以通过添加“全局”终端指令 `/g` 来删除模式的所有出现情况：\n\n```\n echo \"abcdefabc\"\
  \ |sed \"s/abc//g\"\n```\n\n上一个命令的结果在这里：\n\n```\n def\n```\n\n注意，我们通过此命令直接在主流上操作，因为我们没有使用\
  \ `-n` 标记。你也可以使用 `-n` 抑制主流并使用终端 `p`（打印）指令打印替换内容，从而达到相同的输出：\n\n```\n echo \"abcdefabc\"\
  \ |sed -n \"s/abc//gp\"\ndef\n```\n\n对于替换操作，两种语法均可，但对于其他命令来说并不总是如此。\n\n你还可以使用数字元字符作为你的正则表达式匹配模式来删除数字而不是字母（参考第\
  \ 1 章）：\n\n```\n ls svcc1234.txt |sed \"s/[0-9]//g\"\nls svcc1234.txt |sed –n \"\
  s/[0-9]//gp\"\n```\n\n上述两个命令中任一的结果在这里：\n\n```\n svcc.txt\n```\n\n记得文件 `columns4.txt`\
  \ 包含以下文本：\n\n```\n 123 ONE TWO\n456 three four\nONE TWO THREE FOUR\nfive 123 six\n\
  one two three\nfour five\n```\n\n接下来的 `sed` 命令被指示识别 1 到 3（包含边界）之间的行 `/1,3`，并从输出中删除\
  \ `d` ：\n\n```\n cat columns4.txt | sed \"1,3d\"\n```\n\n输出在这里：\n\n```\n five\n\
  23 six\none two three\nfour five\n```\n\n接下来的 `sed` 命令删除了一个范围范围，从匹配 `123` 的行开始，一直持续到文件中直到匹配\
  \ `five` 的行（同时也删除了所有中间行）。该语法在之前的示例中应该常见：\n\n```\n sed \"/123/,/five/d\" columns4.txt\n\
  ```\n\n输出在这里：\n\n```\n one two three\nfour five\n```\n\n### 替换字符串或文件中的元音\n\n以下代码段展示了使用\
  \ `sed` 命令替换字符串中多个元音是多么简单：\n\n```\n echo \"hello\" | sed \"s/[aeio]/g\"\n```\n\n\
  上一个代码段的输出在这里：\n\n```\n Hull\n```\n\n### 从字符串中删除多个数字和字母\n\n假设我们有一个变量 `x`，定义如下：\n\n\
  ```\n x=\"a123\"\n```\n\n记得整数由一个或多个数字组成，因此 `[0-9]+` 匹配一个或多个数字。然而，你需要指定表达式 `[0-9]*`\
  \ 来删除 `x` 中的每个数字：\n\n```\n echo $x | sed \"s/[0-9]//g\"\n```\n\n上一个命令的输出在这里：\n\n\
  ```\n a\n```\n\n接下来的命令删除了 `x` 中的所有小写字母：\n\n```\n echo $x | sed \"s/[a-z]//g\"\n\
  ```\n\n上一个命令的输出在这里：\n\n```\n 123\n```\n\n接下来的命令删除了 `x` 中的所有大小写字母：\n\n```\n echo\
  \ $x | sed \"s/[a-zA-Z]//g\"\n```\n\n上一个命令的输出在这里：\n\n```\n 123\n```\n\n### 使用 `sed`\
  \ 进行搜索和替换\n\n上一节展示了如何根据起始行和结束行，使用数字范围或字符串对来删除文本文件中的范围行。由于删除只是将匹配内容替换为空结果，现在应该很清楚，替换涉及填充命令的该部分以实现你想要的结果。本节包含了各种示例，说明了如何获得精确的替换。\n\
  \n以下示例说明了如何在 `sed` 中将 `abc` 转换为大写的 `ABC`：\n\n```\n echo \"abc\" |sed \"s/abc/ABC/\"\
  \n```\n\n上一个命令的输出在这里（仅对 `abc` 的一种情况有效）：\n\n```\n ABC\n```\n\n下一个示例显示了上一个命令的输出在这里（`/g`\
  \ 意味着作用于 `abc` 的所有情况）：\n\n```\n ABCdefABC\n```\n\n接的 `sed` 表达式执行了三个连续替换，使用 `-e`\
  \ 将它们连接起来。它将正好一个（第一个）`a` 更改为 `A`，一个 `b` 更改为 `B`，一个 `c` 更改为 `C`：\n\n```\n echo \"\
  abcde\" |sed -e \"s/a/A/\" -e \"s/b/B/\" -e \"s/c/C/\"\n```\n\n上一个命令的输出在这里：\n\n\
  ```\n ABCde\n```\n\n显然，你可以使用下面的 `sed` 表达式将三个替换合并为一个替换：\n\n```\n echo \"abcde\" |sed\
  \ \"s/abc/ABC/\"\n```\n\n尽管如此，当你需要执行无法合并为单个替换的更复杂的替换时，`-e` 开关是有用的。\n\n`/` 并不是 `sed`\
  \ 支持的唯一分隔符，这在字符串包含 `/` 字符时非常有用。例如，你可以通过此命令反转 `/aa/bb/cc/` 的顺序：\n\n```\n echo \"\
  /aa/bb/cc\" |sed -n \"s#/aa/bb/cc#/cc/bb/aa/#p\"\n```\n\n上一个 `sed` 命令的输出在这里：\n\n\
  ```\n /cc/bb/aa/\n```\n\n以下示例说明了如何使用 `w` 终端命令指令将 `sed` 的输出同时写入标准输出以及命名为 `upper1`\
  \ 的文件（如果匹配成功）：\n\n```\n echo \"abcdefabc\" |sed \"s/abc/ABC/wupper1\"\nABCdefabc\n\
  ```\n\n如果你检查文本文件 `upper1` 的内容，你会发现它包含了与屏幕显示的相同字符串 `ABCdefabc`。我们之前在打印 (`p`) 终端指令中注意到的这种双流行为是不寻常的，但有时有用。更常见的是直接使用\
  \ `>` 语法将标准输出发送到文件，如下所示（两种语法对替换操作都有效），但在那种情况下没有内容写入终端屏幕。之前的语法允许同时进行两者：\n\n```\n\
  \ echo \"abcdefabc\" | sed \"s/abc/ABC/\" > upper1\necho \"abcdefabc\" | sed -n\
  \ \"s/abc/ABC/p\" > upper1\n```\n\n列表 4.1 显示了 `update2.sh` 的内容，它将当前目录下后缀为 `txt`\
  \ 的文件中的字符串 `hello` 替换为字符串 `goodbye`。\n\n##### *列表 4.1 update2.sh*\n\n```\n for f\
  \ in `ls *txt`\ndo\n  newfile=\"${f}_new\"\n  cat $f | sed -n \"s/hello/goodbye/gp\"\
  \ > $newfile\n  mv $newfile $f\ndone\n```\n\n\n\n\nListing 4.1 包含一个 `for` 循环，该循环遍历具有\
  \ `txt` 后缀的文本文件列表。对于此类文件，通过在第一个文件（由变量 `f` 表示）末尾附加字符串 `_new` 来初始化创建的变量 `newfile`。接下来，将每个文件\
  \ `f` 中的所有 `hello` 出现处替换为字符串 `goodbye`，并将输出重定向到 `$newfile`。最后，使用 `mv` 命令将 `$newfile`\
  \ 重命名为 `$f`。\n\n```。\n\n如果你想对所有子目录中的匹配文件执行此更新，请将“for”语句替换为以下内容：\n\n```\nfor f in\
  \ `find . –print |grep \"txt$\"`\n```\n\n### 具有多个分隔符的数据集\n\nListing 4.2 显示了数据集 `delim1.txt`\
  \ 的内容，该文件包含多个分隔符 `|`、`:` 和 `^`。Listing 4.3 显示了 `delimiter1.sh` 的内容，它说明了如何将 `delimiter1.txt`\
  \ 中的各种分隔符替换为单个逗号分隔符 `,`。\n\n### LISTING 4.2 delimiter1.txt\n\n```\n1000|Jane:Edwards^Sales\n\
  2000|Tom:Smith^Development\n3000|Dave:Del Ray^Marketing\n```\n\n### LISTING 4.3\
  \ delimiter1.sh\n\n```\ninputfile=\"delimiter1.txt\"\ncat $inputfile | sed -e 's/:/,/'\
  \ -e 's/|/,/' -e 's/\\^/,/'\n```\n\n如你所示，Listing 4.3 中的第二行简单却非常强大：你可以根据需要添加尽可能多的分隔符来扩展\
  \ `sed` 命令，以便创建一个在值之间使用单个分隔符的数据集。来自 Listing 4.3 的输出所示：\n\n```\n1000,Jane,Edwards,Sales\n\
  2000,Tom,Smith,Development\n3000,Dave,Del Ray,Marketing\n```\n\n请记住，除非你已经检查新分隔符未被占用，否则这种转换可能是不安全的。对于这一点，`grep`\
  \ 命令很有用（你希望结果为零）：\n\n```\ngrep -c ',' $inputfile\n0\n```\n\n### `sed` 中的实用开关\n\n\
  在使用 `sed` 命令时指定它们时，三个命令行开关 `-n`、`-e` 和 `-i` 是很有用的。\n\n作为回顾，当你想要抑制基本流输出的打印时，请指定 `-n`：\n\
  \n```\nsed -n 's/foo/bar/'\n```\n\n当你只想匹配结果时，指定 `-n` 并以 `/p` 结束：\n\n```\nsed -n\
  \ 's/foo/bar/p'\n```\n\n我们简要地提到了使用 `-e` 进行多次替换，但它也可以用于组合其他命令。这种语法允许我们分离上一个一个示例中的命令：\n\
  \n```\nsed -n -e 's/foo/bar/' -e 'p'\n```\n\n一个更高级的示例暗示了 `sed` 的灵活性，它涉及到在固定数量的位置后插入一个字符。例如，考虑以下代码段：\n\
  \n```\necho \"ABCDEFGHIJKLMNOPQRSTUVWXYZ\" | sed \"s/.\\{3\\}/&\\n/g\"\n```\n\n\
  前一个命令的输出在此：\n\n```\nABCnDEFnGHInJKLnMNOnPQRnSTUnVWnYZ\n```\n\n虽然上面的示例看起来并不特别有用，但考虑一个没有换行的巨大文本流（所有内容在一行）。你可以使用类似的内容来插入换行符，或其他将数据拆分为更易处理的块。通过查看命令的每个元素并与输出进行比较，可以完全理解\
  \ `sed` 到底在做什么，即使你不知道语法（提示：有时你会在代码中遇到没有任何文档说明的复杂 `sed` 指令：在编写代码时尽量不要成为那样的人）。\n\n\
  输出在每三个字符后发生变化，我们知道点号（`.`）匹配任何单个字符，因此 `.{3}` 一定是在告诉它这样做（使用转义斜杠 `\\` 是因为括号是 `sed`\
  \ 的特殊字符，如果只留为 `.{3`，它将无法正确解释）。替换列中的 `n` 足够清楚，因此 `&` 一定是以某种方式告诉它插入一个字符而不是替换它。终端的\
  \ `g` 命令当然意味着重复。为了澄清并确认这些猜测，根据你所推断的并进行互联网搜索。\n\n### 处理数据集\n\n`sed` 工具对于操作文本文件的内容非常有用。例如，你可以打印行范围，以及匹配正则表达式的行子集。你还可以对文本文件中的行执行搜索并替换。本节包含了包含了用于来说明如何执行此类功能的示例。\n\
  \n### 打印行\n\nListing 4.4 显示了 `test4.txt` 的内容（双倍行距行），它被用于本节中的几个示例。\n\n### LISTING\
  \ 4.4 test4.txt\n\n```\nabc\n\ndef\n\nabc\n\nabc\n```\n\n以下代码段打印 `test4.txt` 中的前\
  \ 3 行（我们之前删除行时使用过这种语法；它对于打印同样有用）：\n\n```\ncat test4.txt |sed -n \"1,3p\"\n```\n\n\
  前一个命令的输出如下（第二行是空的）：\n\n```\nabc\n\ndef\n```\n\n以下代码段打印 `test4.txt` 中的第 3 行到第 5 行：\n\
  \n```\ncat test4.txt |sed -n \"3,5p\"\n```\n\n前一个命令的输出如下：\n\n```\ndef\n\nabc\n```\n\
  \n以下代码段打印 `test4.txt` 中的所有行（包括空行）：\n\n```\ncat test4.txt |sed \"p\"\n```\n\n前一个命令的输出如下：\n\
  \n```\nabc\n\ndef\n\nabc\n\nabc\n```\n\n以下代码段打印 `test4.txt` 中的前 3 行：\n\n```\ncat\
  \ test4.txt |sed -n \"1,3p\"\n```\n\n前一个命令的输出如下：\n\n```\nabc\n\ndef\n\nabc\n```\n\
  \n以下代码段打印 `test4.txt` 中的第 3 行到第 5 行：\n\n```\ncat test4.txt |sed -n \"3,5p\"\n```\n\
  \n前一个命令的输出如下：\n\n```\ndef\n\nabc\n```\n\n以下代码段打印 `test4.txt` 中的所有行（包括空行）：\n\n```\n\
  cat test4.txt |sed \"p\"\n```\n\n前一个命令的输出如下：\n\n```\nabc\n\ndef\n\nabc\n\nabc\n\
  ```\n\n### 字符类与 `sed`\n\n你也可以在 `sed` 中使用正则表达式。作为提醒，这里是 `columns4.txt` 的内容：\n\n```\n\
  123 ONE TWO\n456 THREE FOUR\none two\n```\n\n作为涉及字符类的第一个示例，以下代码段说明了如何匹配包含数字的行：\n\
  \n```\ncat columns4.txt | sed -n '/[0-9]/p'\n```\n\n前一个命令的输出如下：\n\n```\n123\n```\n\
  \n以下代码段说明了如何匹配包含小写字母的行：\n\n```\ncat columns4.txt | sed -n '/[a-z]/p'\n```\n\n前一个命令的输出如下：\n\
  \n```\none two\n```\n\n以下代码段说明了如何匹配包含数字 4、5 或 6 的行：\n\n```\ncat columns4.txt | sed\
  \ -n '/[4-6]/p'\n```\n\n前一个命令的输出如下：\n\n```\n456\n```\n\n以下代码段说明了如何匹配以任意两个字符开头后跟\
  \ `EE` 的行：\n\n```\ncat columns4.txt | sed -n '/^.\\{2\\}EE*/p'\n```\n\n前一个命令的输出如下：\n\
  \n```\nONE TWO\n```\n\n#### 移除控制字符\n\n任何类型的控制字符都可以由 `sed` 像其他任何字符一样移除。我们在第 2 章中之前用过的\
  \ `controlchars.txt` 的内容如下：\n\n```\n1 carriage return^M\n2 carriage return^M\n1\
  \ tab character^I\n```\n\n以下命令从文本文件 `ControlChars.txt` 中移除回车和制表符：\n\n```\ncat ControlChars.txt\
  \ | sed \"s/^M//\" |sed \"s/   //\"\n```\n\n你在前一个代码段的第二个 `sed` 命令中无法看到制表符；但是，如果你将输出重定向到文件\
  \ `nocontrol1.txt`，可以通过输入以下命令查看该新文件中没有嵌入的控制字符：\n\n```\ncat –t nocontrol1.txt\n```\n\
  \n\n\n\nListing 4.6 显示了 `WordCountInFile.sh` 的内容，它展示了如何结合各种 `bash` 命令来统计文件中单词（及其出现次数）。\n\
  \n### 列表 4.6 wordcountinfile.sh\n\n# 文件被输入到 `tr` 命令，它将大写字母转换为小写\n\n# `sed` 移除逗号和句号，然后将空格替换为换行符\n\
  \n# `uniq` 需要每个单词单独占一行以便正确计数单词\n\n# `uniq` 将数据转换为唯一单词及其出现的次数\n\n# 最后的 `sort` 按单词计数对数据进行排序\n\
  \n```\n cat \"$1\" | xargs -n1 | tr A-Z a-z | \\\nsed -e 's/\\.//g' -e 's/\\,//g'\
  \ -e 's/ /\\ /g' | \\\nsort | uniq -c | sort -nr\n```\n\n上一个命令执行了以下操作：\n\n![](img/square.jpg)列出文件中每行的每个单词，\n\
  \n![](img/square.jpg)将字符转换为小写，\n\n![](img/square.jpg)过滤掉句号和逗号，\n\n![](img/square.jpg)将单词之间的空格更改为行符，以及\n\
  \n![](img/square.jpg)删除重复项、前缀出现次数并按数字排序。\n\n### `sed` 中的反向引用\n\n在描述 `grep` 的章节中，你学习了反向引用，`sed`\
  \ 命令也提供了类似的功能。主要的区别在于，反向引用也可以用于命令的替换部分。\n\n接下来的 `sed` 命令匹配连续的 “a” 字母并打印出其中的四个：\n\
  \n```\n echo \"aa\" |sed -n \"s#\\([a-z]\\)\\1#\\1\\1\\1\\1#p\"\n```\n\n前述代码段的输出在此：\n\
  \naaaa\n\n接下来的 `sed` 命令将所有重复的字母对替换为字母 `aa:`：\n\n```\n echo \"aa/bb/cc\" |sed -n\
  \ \"s#\\(aa\\)/\\(bb\\)/\\(cc\\)#\\1/\\1/\\1/#p\"\n```\n\n上一个 `sed` 命令的输出在此（注意末尾的\
  \ “`/” 字符）：\n\n```\n aa/aa/aa/\n```\n\n接下来的命令在四位数数字中插入逗号：\n\n```\n echo \"1234\"\
  \ |sed -n \"s@\\([0-9]\\)\\([0-9]\\)\\([0-9]\\\n([0-9]\\)@\\1,\\2\\3\\4@p\"\n```\n\
  \n上一个 `sed` 命令使用 `@` 字符作为分隔符。字符类 `[0-9]` 匹配单个数字。由于输入字符串 `1234` 有四个数字，字符类 `[0-9]`\
  \ 重复了 4 次，每个数字的值被存储在 `\\1`、`\\2`、`\\3` 和 `\\4` 中。上一个 `sed` 命令的输出在此：\n\n```\n 1,234\n\
  ```\n\n一个更通用的可以在五位数数字中插入逗号的 `sed` 表达式在此：\n\n```\n echo \"12345\" | sed 's/\\([0-9]\\\
  {3\\}\\)$/,\\1/g;s/^,//'\n```\n\n上一个命令的输出在此：\n\n```\n 12,345\n```\n\n### 在数据集中仅显示“纯”单词\n\
  \n在上一章中，我们使用 `egrep` 命令解决了此任务，本节将向你展示如何使用 `sed` 命令解决此任务。为了简单起见，让我们处理一个文本字符串，这样我们可以在实现解决方案的过程中看到中间结果。该方法与之前显示的统计唯一单词的代码块类似。让我们如下初始化变量\
  \ `x`：\n\n```\n x=\"ghi abc Ghi 123 #def5 123z\"\n```\n\n第一步是通过将空格替换为换行符将 `x` 分分为每行一个单词：\n\
  \n```\n echo $x |tr -s ' ' '\\n'\n```\n\n输出在此：\n\n```\n ghi\nabc\nGhi\n123\n#def5\n\
  123z\n```\n\n第二步是使用正则表达式 `^[a-zA-Z]+` 调用 `old`，它匹配由一个或多个大写和小小写字母组成的任何字符串（不包含任何其他内容）。注意在\
  \ `sed` 中需要 `-E` 选项来解析这种正则表达式，因为它使用了一些在 `sed` 新奇时不可用的较新/现代的正则表达式语法。\n\n```\n echo\
  \ $x |tr -s ' ' '\\n' |sed -nE \"s/(^[a-zA-Z]\n[a-zA-Z]*$)/\\1/p\"\n```\n\n输出在此：\n\
  \n```\n ghi\nabc\nGhi\n```\n\n如果你也想对输出进行排序并只打印唯一单词，将结果传递给 `sort` 和 `uniq` 命令：\n\n\
  ```\n echo $x |tr -s ' ' '\\n' |sed -nE \"s/(^[a-zA-Z]\n[a-zA-Z]*$)/\\1/p\"|sort|uniq\n\
  ```\n\n输出在此：\n\n```\n Ghi\nabc\nghi\n```\n\n如果你只想提取变量 `x` 中的整数，使用此命令：\n\n```\n echo\
  \ $x |tr -s ' ' '\\n' |sed -nE \"s/(^[a-zA-Z]\n[a-zA-Z]*$)/\\1/p\"|sort|uniq\n```\n\
  \n\n\n使用以下命令打印 `data4.txt` 中 `world6` 和 `six` 之间的行部分：\n\n```\nsed -n '/world6/,/six/p'\
  \ < data4.txt\n```\n\n输出如下：\n\n```\n hello world6 three\n           hello world4\
  \ four\nline five\nline six\n```\n\n使用以下命令打印 `data4.txt` 的内容并复制 `world6` 和 `six`\
  \ 之间的行部分：\n\n```\nsed '/world6/,/six/p' < data4.txt\n```\n\n输出如下：\n\n```\n hello\
  \ world4\n   hello world5 two\nhello world6 three\nhello world6 three\n        \
  \  hello world4 four\n          hello world4 four\nline five\nline five\nline six\n\
  line six\nline seven\n```\n\n使用以下命令删除 `data4.txt` 中的偶数行行：\n\n```\nsed 'n;d;' <data4.txt\n\
  ```\n\n输出如下：\n\n```\n hello world4\n hello world6 three\nline five\nline seven\n\
  ```\n\n使用以下命令将字母 `a` 到 `m` 替换为逗号“，”：\n\n```\nsed \"s/[a-m]/,/g\" <data4.txt\n```\n\
  \n输出如下：\n\n```\n ,,,,o wor,,4\n    ,,,,o wor,,5 two\n,,,,o wor,,6 t,r,,\n      \
  \     ,,,,o wor,,4 ,our\n,,n, ,,v,\n,,n, s,x\n,,n, s,v,n\n```\n\n使用以下命令将字母 `a` 到\
  \ `m` 替换为字符“`,@#”：\n\n```\nsed \"s/[a-m]/,@#/g\" <data4.txt\n```\n\n输出如下：\n\n```\n\
  \ ,@#,@#,@#,@#o wor,@#,@#4\n    ,@#,@#,@#,@#o wor,@#,@#5 two\n ,@#,@#,@#,@#o wor,@#,@#6\
  \ t,@#r,@#,@#\n         ,@#,@#,@#,@#o wor,@#,@#4 ,@#our\n,@#,@#n,@# ,@#,@#v,@#\n\
  ,@#,@#n,@# s,@#x\n,@#,@#n,@# s,@#v,@#n\n```\n\n`sed` 命令不识别如 `\\t` 等转义序列，这意味着你必须在控制台中实际插入制表符。在\
  \ `bash` 壳中，输入控制字符 `^V` 然后按 `<TAB>` 键即可插入 `<TAB>` 字符。\n\n使用以下命令删除 `data4.txt` 中的制表符：\n\
  \n```\nsed 's/ //g' <data4.txt\n```\n\n输出如下：\n\n```\n hello world4\nhello world5\
  \ two\n hello world6 three\nhello world4 four\nline five\nline six\nline seven\n\
  ```\n\n使用以下命令删除 `data4.txt` 中的制表符和空格：\n\n```\nsed 's/ //g' <data4.txt\n```\n\n输出如下：\n\
  \n```\nhelloworld4\nhelloworld5two\nhelloworld6three\nhelloworld4four\nlinefive\n\
  linesix\nlineseven\n```\n\n使用以下命令将 `data4.txt` 的每一行替换为单词 `pasta`：\n\n```\nsed 's/.*/\\\
  pasta/' < data4.txt\n```\n\n输出如下：\n\n```\npasta\npasta\npasta\npasta\npasta\npasta\n\
  pasta\n```\n\n使用以下命令在 `data4.txt` 的第三行之后插入两个空行，在第五行之后插入一个空行：\n\n```\nsed '3G;3G;5G'\
  \ < data4.txt\n```\n\n输出如下：\n\n```\n hello world4\n   hello world5 two\nhello world6\
  \ three\n\n       hello world4 four\nline five\n\nline six\nline seven\n```\n\n\
  使用以下命令在 `data4.txt` 的每一行之后插入一个空行：\n\n```\nsed G < data4.txt\n```\n\n输出如下：\n\n```\n\
  \ hello world4\n\n    hello world5 two\n\nhello world6 three\n\n       hello world4\
  \ four\n\nline five\n\nline six\n\nline seven\n```\n\n使用以下命令在 `data4.txt` 的每隔一行之后插入一个空行：\n\
  \n```\nsed n\\;G < data4.txt\n```\n\n输出如下：\n\n```\n hello world4\n   hello world5\
  \ two\n hello world6 three\n        hello world4 four\nline five\nline six\n\nline\
  \ seven\n```\n\n使用以下命令反转 `data4.txt` 中的行：\n\n```\nsed '1! G; h;$!d' < data4.txt\n\
  ```\n\n上述 `sed` 命令的输出如下：\n\n```\nline seven\nline six\nline five\n         hello\
  \ world4 four\n hello world6 three\n    hello world5 two\n   hello world4\n```\n\
  \n### 总结\n\n本章向你介绍了 `sed` 工具，并说明了数据转换的基本任务：通过匹配单个模式、匹配文件中行的位置或两者的结合，允许数据的添加、删除和更改。\n\
  \n此外，我们展示了 `sed` 不仅像 `grep` 命令一样使用正则表达式来匹配数据，还可以使用正则表达式来描述如何转换这些数据。最后，一组示例展示了 `sed`\
  \ 命令的多功能性，并希望传达出它是一个比我们所展示的更加灵活且强大的工具。\n\n\n\n\n你可以将字段分隔符理解为我们之前在其他命令中使用的分隔符/`IFS`。记录分隔符的行为与\
  \ `sed` 处理单独行的方式类似——例如，`sed` 可以匹配或删除一个范围的行，而不是匹配或删除符合正则表达式的内容（而 `awk` 的默认记录分隔符是换行符，因此默认情况下，`awk`\
  \ 和 `sed` 具有相似的操作和引用文本文件中行的行的能力）。\n\n作为一个简单的示例，你可以通过将 `ORS,` 从默认的一个换行符改为两个换行符，从而在文件的每行之后都打印一个空行，如下所示：\n\
  \n```\ncat columns.txt | awk 'BEGIN { ORS =\"\\n\\n\" } ; { print $0 }'\n```\n\n\
  其他内置变量包括 `FILENAME`（`awk` 当前正在读取的文件名）、`FNR`（当前文件中当前记录数）、`NF`（当前输入记录中的字段数）以及 `NR`（自程序执行开始以来\
  \ `awk` 处理的输入记录总数）。\n\n请查阅在线文档以获取关于 `awk` 命令的这些（以及其他）参数的更多信息。\n\n## `awk` 命令是如何工作的？\n\
  \n`awk` 命令一次读取输入文件中的一个记录（默认情况下，一个记录为一行）。如果记录匹配模式，则执行相应的动作（否则不执行动作）。如果没有给出搜索模式，则\
  \ `awk` 将对输入的每条记录执行给定的动作。如果没有给出动作，默认行为是打印所有匹配给定模式的记录。最后，不带任何动作的空括号不起任何作用；也就是说，它们不会执行默认的打印操作。注意，动作中的每个语句都应该用分号隔开。\n\
  \n为了使上述段更具体，这里有一些涉及文本字符串和 `awk` 命令的简单示例（结果显示在每个代码段之后）。`-F` 关将字段分隔符设置为其后的任意内容，在本例中是空格。开关通常会为通常需要在\
  \ `BEGIN{}` 块内部执行命令的动作提供快捷方式：\n\n```\nx=\"a b c d e\"\necho $x |awk -F\" \" '{print\
  \ $1}'\na\necho $x |awk -F\" \" '{print NF}'\n5\necho $x |awk -F\" \" '{print $0}'\n\
  a b c d e\necho $x |awk -F\" \" '{print $3,1}'\nc\n```\n\n现在让我们将 `FS`（记录分隔符）更改为空字符串以计算字符串的长度，这次使用\
  \ `BEGIN{}` 语法：\n\n```\necho \"abc\" | awk 'BEGIN { FS = \"\" } { print NF }'\n\
  3\n```\n\n以下示例说明了指定 `test.txt` 为 `awk` 命令输入文件的几种等效方法：\n\n```\nawk < test.txt '{\
  \ print $1 }'\nawk '{ print $1 }' < test.txt\n```\n\n这里显示了另一种方法（但正如我们之前讨论过的，可能是无效的，所以只有当\
  \ `cat` 命令在某些方面增加价值时才这样做）：\n\n```\ncat test.txt | awk '{ print $1 }'\n```\n\n这个四种方式完成相同任务的简单示例说明了为什么注释\
  \ `awk` 调用始终是一个好主意。下一个查看你代码的人可能不记得你使用的语法。\n\n## 使用 `printf` 命令对齐文本\n\n由于 `awk` 是单个命令内部的编程语言，它也有自己通过\
  \ `printf` 命令产生输出的方法。`Listing 5.1` 显示了 `columns.txt` 的内容，`Listing 5.2` 显示了 脚本 `Columns1.sh`\
  \ 的内容，它向你展示了如何对齐文本中的列。\n\n### Listing 5.1 columns.txt\n\n```\none two\nthree four\n\
  one two three\nfive six\none two three\nfour five\n```\n\n### Listing 5.2 Columns1.sh\n\
  \n```\nawk '{\n     # 在 10 字符列上左对齐 $1\n     # 在 10 字符列上右对齐 $2\n     # 在 10 字符列上右对齐\
  \ $3\n     # 在 10 字符列上右对齐 $4\n     printf(\"%-10s%10s%10s%10s\\n\", $1, $2, $3,\
  \ $4)\n}' columns.txt\n```\n\n`Listing 5.2` 包含一个 `printf()` 语句，用于显示 `columns.txt`\
  \ 文件中每行的前四个字段，每个字段宽度为 10 个字符。运行 `Listing 5.2` 中代码的输出在此：\n\n```\none         two\n\
  three       four\none         three      four\nfive        six\n```\n```\n\n## 条件逻辑和控制语句\n\
  \n与其他编程语言一样，`awk` 提供对条件逻辑（`if/else`）和控制语句（`for`/`while` 循环）的支持。`awk` 是在管道命令流中使用条件逻辑而不创建、安装并添加到路径中的自定义可执行脚本的唯一方法。以下代码块显示了如何使用\
  \ `if/else` 逻辑：\n\n```\necho \"\" | awk '\nBEGIN { x = 10 }\n{\n  if (x % 2 == 0)\
  \ {\n      print \"x is even\"\n  }\n  else {\n      print \"x is odd\"\n  }\n}\n\
  '\n```\n\n上述代码块将变量 `x` 初始化为 `10`，如果 `x` 能被 2 整除，则打印 `x is even`，否则打印 `x is odd`。\n\
  \n### `while` 语句\n\n以下代码块说明了如何在 `awk` 中使用 `while` 循环：\n\n```\necho \"\" | awk '\n\
  {\n  x = 0\n  while(x < 4) {\n    print \"x:\",x\n    x = x + 1\n  }\n}\n'\n```\n\
  \n上述代码块生成了以下输出：\n\n```\nx:0\nx:1\nx:2\nx:3\n```\n\n以下代码块说明了如何在 `awk` 中使用 `do while`\
  \ 循环：\n\n```\necho \"\" | awk '\n{\n  x = 0\n  do {\n    print \"x:\",x\n    x =\
  \ x + 1\n  } while(x < 4)\n}\n'\n```\n\n上述代码块生成了以下输出：\n\n```\nx:0\nx:1\nx:2\nx:3\n\
  ```\n\n### `awk` 中的 for 循环\n\n`Listing 5.3` 显示了 `Loop.sh` 的内容，它说明了如何在循环中打印数字列表。注意\
  \ `i++` 是 `awk`（以及大多数 C 类语言）中 `i=i+1` 的另一种写法。\n\n### Listing 5.3 Loop.sh\n\n```\n\
  awk '\nBEGIN {}\n{\n   for(i=0; i<5; i++) {\n     printf(\"%3d\", i)\n   }\n}\n\
  END { print \"\\n\" }\n'\n```\n\n`Listing 5.3` 包含一个 `for` 循环，通过 `printf()` 语句在同一行打印数字。注意只有在代码的\
  \ `END` 块中打印了换行符：\n\n```\n0 1 2 3 4\n```\n\n### 带有 break 语句的 for 循环\n\n以下代码块说明了如何在\
  \ `awk` 的 `for` 循环中使用 `break` 语句：\n\n```\necho \"\" | awk '\n{\n  for(x=1; x<4;\
  \ x++) {\n     print \"x:\",x\n     if(x == 2) {\n        break;\n     }\n  }\n\
  }\n'\n```\n\n上述代码块一直输出直到变量 `x` 值为 `2`（因为条件逻辑内部有 `break`）。显示的输出为：\n\n```\nx:1\n```\n\
  \n\n\n\n\n### 删除数据集中的交替行\n\nListing 5.4 显示了 `linepairs.csv` 的内容，Listing 5.5 显示了\
  \ `deletelines.sh` 的内容，这说明了如何打印数据集 `linepairs.csv` 中恰好两列的交替行。\n\n### 列表 5.4 linepairs.csv\n\
  ```\na,b,c,d\ne,f,g,h\n1,2,3,4\n5,6,7,8\n```\n\n### 列表 5.5 deletelines.sh\n```\n\
  inputfile=\"linepairs.csv\"\noutputfile=\"linepairsdeleted.csv\"\nawk ' NR%2 {printf\
  \ \"%s\", $0; print \"\"; next}' < $inputfile >\n$outputfile\n```\n\nListing 5.5\
  \ 检查当前记录数 `NR` 是否能被 2 整除，如果是，则打印当前行并跳过数据集中的下一行。输出被重定向到指定的输出文件，其内容如下：\n\n```\na,b,c,d\n\
  1,2,3,4\n```\n\n一个稍微常见的任务涉及合并连续行，这是下一节的主题。\n\n## 合并数据集中的行\n\nListing 5.6 显示了 `columns.txt`\
  \ 的内容，Listing 5.7 显示了 `ColumnCount1.sh` 的内容，这说明了如何打印文本文件 `columns.txt` 中恰好两列的行。\n\
  \n### 列表 5.6 columns.txt\n```\none two three\none two\none two three four\none\n\
  one three\none four\n```\n\n### 列表 5.7 ColumnCount1.sh\n```\nawk\n{\n   if( NF ==\
  \ 2 ) { print $0 }\n}\n' columns.txt\n```\n\nListing 5.7 逻辑非常直观：如果当前记录数是偶数，则打印当前行（即跳过奇数行行）。运行\
  \ Listing 5.7 中的代码输出如下：\n\n```\none two\none three\none four\n```\n\n如果你想显示*不包含*\
  \ 2 列的行，请使用以下代码片段：\n\n```\nif( NF != 2 ) { print $0 }\n```\n\n## 将文件内容作为单行打印\n\n\
  `test4.txt` 的内容如下（注意空行）：\n\n```\nabc\ndef\nabc\nabc\n```\n\n以下代码片段说明了如何将 `test4.txt`\
  \ 的内容打印为单行：\n\n```\nawk '{printf(\"%s\", $0)}' test4.txt\n```\n\n上一个代码片段的输出在这里。在阅读下一段的解释之前，试着猜看发生了什么：\n\
  \n```\nAbdefabcabc\n```\n\n解释：这里的 `%s` 是 `printf,` 命令的记录分隔符语法，在它后面加上引号意味着记录分隔符是空字段\
  \ \"\"\"\"。`awk` 的默认记录分隔符是 `\\n`（换行符）；`printf` 正在做的是移除所有的换行符。空行将完全消失，因为它们只包含换行符，所以结果是任何实际文本都合并在一起，中间没有任何内容。如果我们在\
  \ `%s` 和结束引号之间添加一个空格，那么每个字符块之间将有一个空格，外加每个换行符额外多出一个空格。\n\n注意下面的注释是如何帮助理解代码片段的：\n\n\
  ```\n# 通过移除换行符将所有文本合并为单行\nawk '{printf(\"%s\", $0)}' test4.txt\n```\n\n## 合并文本文件中的行组\n\
  \nListing 5.8 显示了 `digits.txt` 的内容，Listing 5.9 显示了 `digits.sh` 的内容，它“合并”了文件 `digits.txt`\
  \ 中的三行连续文本。\n\n### 列表 5.8 digits.txt\n```\n1\n2\n3\n4\n5\n6\n7\n8\n9\n```\n\n###\
  \ 列表 5.9 digits.sh\n```\nawk -F\" \" '{\n  printf(\"%d\",$0)\n  if(NR % 3 == 0)\
  \ { printf(\"\\n\") }\n}' digits.txt\n```\n\nListing 5.9 将三行连续文本打印在同一行，之后打印一个换行符。这产生了“合并”每三行连续文本的效果。运行\
  \ `digits.sh` 的输出如下：\n\n```\n123\n456\n789\n```\n\n## 合并文本文件中的交替行\n\nListing 5.10\
  \ 显示了 `columns2.txt` 的内容，Listing 5.11 显示了 `JoinLines.sh` 的内容，它“合并”了文件 `columns2.txt`\
  \ 中的两行连续文本。\n\n### 列表 5.10 columns2.txt\n```\none two\nthree four\nfive six\nseven\
  \ eight\n```\n\n### 列表 5.11 JoinLines.sh\n```\nawk\n{\n     printf.s\", $0)\n  \
  \   if(NR % 2 == 0) { printf(\"\\n\") }\n}\n' columns2.txt\n```\n\n\n\n\n\n```\n\
  awk ' $2 == 300 { print $1, $3 }' products.txt\n```\n\n上述代码段的输出如下：\n\n```\nTablet\
  \ new\nTablet used\n```\n\n以下代码段打印 `products.txt` 中以字符串 `Tablet:` 开头的文本行的第一列和第三列：\n\
  \n```\nawk '/^Tablet/ { print $1, $3 }' products.txt\n```\n\n上述代码段的输出如下：\n\n```\n\
  Tablet new\nTablet used\n```\n\n## 使用 `awk` 分割文件名\n\n列表 5.18 显示了 `SplitFilename2.sh,`\
  \ 的内容，它阐明了如何分割一个包含`.` 字符的文件名，以便增加文件名中某个组件的数值。请注意，此代码仅适用于完全预期语法的文件名。你可以编写更复杂的代码来计算段数，或者简单地说“更改\
  \ `.zip` 之前的字段”，这只需要文件名的格式匹配最后两个部分（`<anystructure>.number.zip`）。\n\n#### 列表 5.18\
  \ SplitFilename2.sh\n\n```\necho \"05.20.144q.az.1.zip\" | awk -F\".\" '\n{\n  f5=$5\
  \ + 1\n  printf(\"%s.%s.%s.%s.%s.%s\",$1,$2,$3,$4,f5,$6)\n}'\n```\n\n列表 5.18 的输出如下：\n\
  \n```\n05.20.144q.az.2.zip\n```\n\n#### 使用后置算术运算符操作\n\n列表 5.19 显示了 `mixednumbers.txt`\
  \ 的内容，该文件包含后置运算符，这意味着负号（和/或正号）出现在列值的末尾，而不是数字的开头。\n\n### 列表 5.19 mixednumbers.txt\n\
  \n```\n324.000-|10|983.000-\n453.000-|30|298.000-\n783.000-|20|347.000-\n```\n\n\
  列表 5.20 显示了 `AddSubtract1.sh,` 的内容，它说明了如何对列表 5.19 中的数字行求加。\n\n### 列表 5.20 AddSubtract1.sh\n\
  \n```\nmyFile=\"mixednumbers.txt\"\nawk -F\"|\" '\nBEGIN { line = 0; total = 0 }\n\
  {\n   split($1, arr, \"-\")\n   f1 = arr[1]\n   if($1 ~ /-/) { f1 = -f1 }\n   line\
  \ += f1\n\n   split($2, arr, \"-\")\n   f2 = arr[1]\n   if($2 ~ /-/) { f2 = -f2\
  \ }\n   line += f2\n\n   split($3, arr, \"-\")\n   f3 = arr[1]\n   if($3 ~ /-/)\
  \ { f3 = -f3 }\n   line += f3\n\n   printf(\"f1: %d f2: %d f3: %d line: %d\\n\"\
  ,f1,f2,f3, line)\n   total += line\n   line = 0\n}\nEND { print \"Total: \",total\
  \ }\n' $myfile\n```\n\n列表 5.20 的输出如下。在阅读后续的解释之前，尝试推导出这段代码在做什么：\n\n```\nf1: -324\
  \ f2: 10 f3: -983 line: -1297\nf1: -453 f2: 30 f3: -298 line: -721\nf1: -783 f2:\
  \ 20 f3: -347 line: -1110\nTotal:  -3128\n```\n\n该代码假设我们知道文件的格式。对于给定记录中的每个字段，`split`\
  \ 函数返回一个长度为二的向量，其中第一个位置是数字，第二个位置为空值或破折号，之后第一个位置的数字被“捕获”到一个变量中。`if` 语句仅检查原始字段是否包含破折号。如果字段包含破折号，则数值变量变为负数，否则保持原样。然后它对行进行累加。\n\
  \n## `awk` 中的数值函数\n\n`int(x)` 函数返回数字的整数部分。如果该数字不是整数，它将处于两个整数之间。在这两个可能的整数中，函数将返回靠近零的那一个。这与四舍五入函数不同，后者选择更接近的整数。\n\
  \n例如，`int(3)` 是 3，`int(3.9)` 是 3，`int(-3.9)` 是 -3，`int(-3)` 也是 -3。这里是 `awk` 命令中\
  \ `int(x)` 函数的一个示例：\n\n```\nawk 'BEGIN {\n   print int(3)\n   print int(3.9)\n \
  \  print int(-3.9)\n   print int(-3)\n}'\n```\n\n### 单行 `awk` 命令\n\n本节代码引用了文本文件\
  \ `short1.txt,`，你可以为其填充任意数据。\n\n以下代码段打印每行并在前面加上该行的字段数：\n\n```\nawk '{print NF \"\
  :\" $0}' short1.txt\n```\n\n打印每行的最右侧字段：\n\n```\nawk '{print $NF}' short1.txt\n```\n\
  \n打印包含超过 2 个字段的行：\n\n```\nawk '{if(NF > 2) print }' short1.txt\n```\n\n如果当前行包含超过\
  \ 2 个字段，则打印最右侧字段的值：\n\n```\nawk '{if(NF > 2) print $NF }' short1.txt\n```\n\n\n\n\
  \n如从前面的代码段所示，使用 `awk` 命令中的简单条件逻辑和内置变量很容易从文本文件中提取信息或行列的子集。\n\n## 有用的短 `awk` 脚本\n\n\
  本节包含了一组基于 `awk` 的短脚本，用于执行各种操作。其中某些脚本也可以用于其他 shell 脚本，以执行更复杂的操作。列表 5.21 显示了文件 `data.txt`\
  \ 的内容，该文件在本节的各个代码示例中被使用。\n\n### LIST 5.21 data.txt\n\n```\n this is line one that\
  \ contains more than 40 characters\nthis is line two\nthis is line three that also\
  \ contains more than 40 characters\nfour\nthis is line six and the preceding line\
  \ is empty\nline eight and the preceding line is also empty\n```\n\n以下代码段打印所有超过\
  \ 40 个字符的行：\n\n```\n awk 'length($0) > 40' data.txt\n```\n\n现在打印 `data.txt` 中最长行的长度：\n\
  \n```\n awk '{ if (x < length()) x = length() }\nEND { print \"maximum line length\
  \ is \" x }' < data.txt\n```\n\n输入通过 `expand` 工具进行处理，将制表符转换为空格，因此比较的宽度实际上是右边界列。\n\
  \n打印每个至少包含一个字段的行：\n\n```\n awk 'NF > 0' data.txt\n```\n\n上一个代码段说明了从文件中删除空行的简单方法（或者说，创建一个与旧文件相似但删除了空行的新文件）。\n\
  \n打印从 0 到 100（包含在内）的七个随机数：\n\n```\n awk 'BEGIN { for (i = 1; i <= 7; i++)\nprint\
  \ int(101 * rand()) }'\n```\n\n统计文件的行数：\n\n```\n awk 'END { print NR }' < data.txt\n\
  ```\n\n打印数据文件中的偶数行：\n\n```\n awk 'NR % 2 == 0' data.txt\n```\n\n如果你在前面的代码段中使用表达式\
  \ `'NR % 2 == 1'`，程序将打印奇数行。\n\n在文本文件中每行后面插入一个重复行：\n\n```\n awk '{print $0, '\\n',\
  \ $0}' < data.txt\n```\n\n在文本文件中每行后面插入一个重复行并删除空行：\n\n```\n awk '{print $0, \"\\\
  n\", $0}' < data.txt | awk 'NF > 0'\n```\n\n在文本文件的每行后面插入一个空行：\n\n```\n awk '{print\
  \ $0, \"\\n\"}' < data.txt\n```\n\n## 在 awk 中打印文本字符串中的单词\n\n列表 5.22 显示了 `Fields2.sh`\
  \ 内容，说明了如何使用 `awk` 命令打印文本字符串中的单词。\n\n### LIST 5.22 Fields2.sh\n\n```\n echo \"a\
  \ b c d e\"| awk '\n{\n  for(i=1; i<=NF; i++) {\n     print \"Field \",i,\":$i\n\
  }\n}\n'\n```\n\n列表 5.22 的输出如下：\n\n```\n Field  1 : a\nField  2 : b\nField  3 : c\n\
  Field  4 : d\nField  5 : e\n```\n\n## 在特定行中统计字符串的出现次数\n\n列表 5.23 和 列表 5.24 分别显示了\
  \ `data1.csv` 和 `data2.csv` 内容，列表 5.25 显示了 `checkrows.sh` 内容，说明了如何统计 2、5、7 行第 3\
  \ 列中字符串“past”的出现次数。\n\n### LIST 5.23 data1.csv\n\n```\n in,the,past,or,the,present\n\
  for,the,past,or,the,present\nin,the,past,or,the,present\nfor,the,paste,or,the,future\n\
  in,the,past,or,the,present\ncompletely,unrelated,line1\nin,the,past,or,the,present\n\
  completely,unrelated,line2\n```\n\n### LIST 5.24 data2.csv\n\n```\n in,the,past,or,the,present\n\
  completely,unrelated,line1\nfor,the,past,or,the,present\ncompletely,unrelated,line2\n\
  for,the,paste,or,the,future\nin,the,past,or,the,present\nin,the,past,or,the,present\n\
  completely,unrelated,line3\n```\n\n### LIST 5.25 checkrows.sh\n\n```\n files=\"\
  `ls data*.csv| tr '\\n' ' '`\"\necho \"List of files: $files\"\nawk -F\",\" '\n\
  ( FNR==2 || FNR==5 || FNR==7 ) {\n    if ( $3 ~ \"past\" ) { count++ }\n}\nEND {\n\
  \    printf \"past: %d times (INACT) \", count\n    printf \"in field 3 in lines\
  \ 2/5/7\\n}' data*.csv\n```\n\n列表 5.25 因为由于以下代码段，它在第 2、5、7 列中查找字符串 `past` 的出现情况：\n\
  \n```\n ( FNR==2 || FNR==5 || FNR==7 ) {\n    if ( $3 ~ \"past\" ) { count++ }\n\
  }\n```\n\n如果发生匹配，则 `count` 的值加增。`END` 块报告在第 2、5、7 列中找到字符串 `past` 的次数。注意，像 `paste`\
  \ 和 `pasted` 字符串也会匹配字符串 `past`。列表 5.25 的输出如下：\n\n```\n List of files: data1.csv\
  \ data2.csv\npast: matched 5 times (INACT) in field 3 in lines 2/5/7\n```\n\nshell\
  \ 脚本 `checkrows2.sh` 将 `checkrows.sh` 中的术语 `$3 ~ \"past\"` 替换为 `$3 == \"past\"`\
  \ 以进行精确匹配，这产生以下输出：\n\n```\n List of files: data1.csv data2.csv\npast: matched 4\
  \ times (EXACT) in field 3 in lines 2/5/7\n```\n\n## 在固定列数的字符串中打印每行\n\n列表 5.26 显示了\
  \ `FixedCount1.sh` 内容，说明了如何使用 `awk` 命令在字符串中打印每行。\n\n### LIST 5.26 FixedCount1.sh\n\
  \n```\n echo \"this is line one that contains more than 40 characters\nthis is line\
  \ two\nthis is line three that also contains more than 40 characters\nfour\nthis\
  \ is line six and the preceding line is empty\nline eight and the preceding line\
  \ is also empty\" | tr ' ' '\\n' | awk '{print $0, \"\\n\", $0}'\n```\n\n```列表 5.26\
  \ 的输出如下：\n\n```\n this is line one that contains more than 40 characters\nthis is\
  \ line two\nthis is line three that also contains more than 40 characters\nfour\n\
  this is line six and the preceding line is empty\nline eight and the preceding line\
  \ is also empty\n```\n\n## 在固定列数的文本中打印单词\n\n列表 5.27 显示了 `VariableColumns.txt` 内容，其包含不同列数的行。\n\
  \n### LIST 5.27 VariableColumns.txt\n\n```\n this is line one that contains more\
  \ than 40 characters\nthis is line two\nthis is line three that also contains more\
  \ than 40 characters\nfour\nthis is line six and the preceding line is empty\nline\
  \ eight and the preceding line is also empty\n```\n\n列表 5.28 显示了 `Fields3.sh` 内容，说明了如何使用\
  \ `awk` 命令在字符串中打印每行的单词。\n\n### LIST 5.28 Fields3.sh\n\n```\n echo \"a b c d e\"\
  | awk '\n{\n  for(i=1; i<=NF; i++) {\n     print \"Field \",i,\":$i\n}\n}\n'\n```\n\
  \n```列表 5.28 的输出如下：\n\n```\n Field  1 : a\nField  2 : b\nField  3 : c\nField  4\
  \ : d\nField  5 : e\n```\n\n## 在固定列数的文本集中对对\n\n如果你已经阅读了前面的两个示例，本节的代码示例很容易理解：你将看到如何对齐那些内容正确但放置在不同行（因此未对齐）的数据。列表\
  \ 5.29 显示了 `mixed-data.csv` 中未对齐的值。此外，列表 5.28 中的第一行和最后一行是空行，它们将被本节的 shell 脚本删除。\n\
  \n### LIST 5.29 mixed-data.csv\n\n```\n in,the,past,or,the,present\nfor,the,past,or,the,present\n\
  in,the,past,or,the,present\nfor,the,paste,or,the,future\nin,the,past,or,the,present\n\
  completely,unrelated,line1\nin,the,past,or,the,present\ncompletely,unrelated,line2\n\
  ```\n\n列表 5.30 显示了 `mixed-rows.sh` 内容，说明了如何对齐列表 5.29 中的数据集。\n\n### LIST 5.30 mixed-rows.sh\n\
  \n```\n #-----------------------------------------\n# 1) 删除空行\n# 2) 移除换行符\n# 3)\
  \ 每四个字段后打印换行符\n# 4) 移除每行末尾的逗号\n#-----------------------------------------\ninputfile=\"\
  mixed-data.csv\"\ngrep -v \"^$\" $inputfile |awk -F\",\" '{printf(\"%s\",$0)}' |\
  \ awk '\nBEGIN { columnCount = 4 }\n{\n   for(i=1; i<=NF; i++) {\n     printf(\"\
  %s \", $i)\n     if( i % columnCount == 0) { print \"\" }\n   }\n}' > temp-columns\n\
  # 4) 移除输出末尾的逗号：\ncat temp-columns | sed 's/, $//' | sed 's/ $//' > $outputfile\n\
  ```\n\n\n\n\nListing 5.30 从一个 `grep` 命令开始，该命令用于删除空行，随后是一个 `awk` 命令，它将数据集的每行打印为单行文本。第二个\
  \ `awk` 命令在 `BEGIN` 块中将变量 `columnCount` 初始化为值 4，随后是一个遍历输入字段的 `for` 循环。在同一行输出上打印了四个字段后，该程序会打印一个换行符，其效果是将输入数据集重新对齐为一个由每行包含四个字段组成的输出数据集。Listing\
  \ 5.30 的输出如下：\n\n```\n Sara, Jones, 1000, CA\nSally, Smith, 2000, IL\nDave, Jones,\
  \ 3000, FL\nJohn, Jones, 4000, CA\nDave, Jones, 5000, NY\nMike, Jones, 6000, NY\n\
  Tony, Jones, 7000, WA\n```\n\n## 对齐数据集中的列和多行\n\n上述章节向你展示了如何重新排列数据集，使每行包含相同数量的列并代表单个数据记录。本节中的代码示例说明了如何对齐内容正确的数据列，并在新数据集的每行中放置两个记录。Listing\
  \ 5.31 显示了带有未对齐数据值的 `mixed-data2.csv` 的内容，随后是 Listing 5.32 显示的格式正确数据集 `aligned-data2.csv`\
  \ 的内容。\n\n### 列表 5.31 mixed-data2.csv\n\n```\n Sara, Jones, 1000, CA, Sally, Smith,\
  \ 2000, IL,\nDave, Jones, 3000, FL, John, Jones,\n4000, CA,\nDave, Jones, 5000,\
  \ NY, Mike,\nJones, 6000, NY, Tony, Jones, 7000, WA\n```\n\n### 列表 5.32 aligned-data2.csv\n\
  \n```\n Sara, Jones, 1000, CA, Sally, Smith, 2000, IL\nDave, Jones, 3000, FL, John,\
  \ Jones, 4000, CA\nDave, Jones, 5000, NY, Mike, Jones, 6000, NY\nTony, Jones, 7000,\
  \ WA\n```\n\nListing 5.33 显示了 `mixed-data2.sh` 的内容，它说明了如何重新对齐列表 5.31 中的数据集。\n\n\
  ### 列表 5.33 mixed-data2.sh\n\n```bash\n #-----------------------------------------\n\
  # 1) 删除空行\n# 2) 删除换行符\n# 3) 每 8 个字段后打印一个 LF\n# 4) 删除每行末尾的 ','\n#-----------------------------------------\n\
  inputfile=\"mixed-data2.txt\"\noutputfile=\"aligned-data2.txt\"\ngrep -v \"^$\"\
  \ $inputfile |awk -F\",\" '{printf(\"%s\",$0)}' | awk '\nBEGIN { columnCount = 4;\
  \ rowCount = 2; currRow = 0 }\n{\n   for(i=1; i<=NF; i++) {\n     printf(\"%s \"\
  , $i)\n     if( i % columnCount == 0) { ++currRow }\n     if(currRow > 0 && currRow\
  \ % rowCount == 0) {currRow = 0;\nprint \"\"}\n   }\n}' > temp-columns\n# 4) 删除输出末尾的\
  \ ',':\ncat temp-columns | sed 's/, $//' | sed 's/ $//' > $outputfile\n```\n\nListing\
  \ 5.33 与 Listing 5.30 非常相似。核心思想是在处理完一对“正常”记录后打印一个换行符，这是通过 Listing 5.33 中**加粗显示**的代码实现的。\n\
  \n现在你可以通过将 `rowCount` 变量的初始值更改为任何正整数来轻松地扩展 Listing 5.33，代码将在无需任何进一步修改的情况下正常工作。例如，如果你将\
  \ `rowCount` 初始化为值 `5`，那么新数据集中的每行（最后输出行可能除外）将包含 5 条“正常”数据记录。\n\n### 从文本文件中删除一列\n\
  \nListing 5.34 显示了 `VariableColumns.txt` 的内容，其中文本行包含不同数量的列。\n\n### 列表 5.34 VariableColumns.txt\n\
  \n```\n this is line one\nthis is line number one\nthis is the third and final line\n\
  ```\n\nListing 5.35 显示了 `RemoveColumn.sh` 的内容，该脚本从文本文件中删除第一列。\n\n### 列表 5.35 RemoveColumn.sh\n\
  \n```bash\n awk '{ for (i=2; i<=NF; i++) printf \"%s \", $i }\n```\n\n`awk` 循环除了第一个字段外遍历所有字段。之前代码的输出是：\n\
  \n```\n400\n300\n200\n```\n\n### 文本文件的列列\n\nListing 5.35 向你展示了如何重新排列数据集，使每行包含相同数量的列并代表单个数据记录。本节中的代码示例说明了如何对齐内容正确的数据列，并在新数据集的每行中放置两个记录。Listing\
  \ 5.36 显示了 `aligned-data2.csv` 的内容，即格式正确的数据集。\n\nListing 5.37 显示了 `mixed-data2.sh`\
  \ 的内容，它说明了如何重新对齐列表 5.31 中的数据集。\n\n### 列表 5.36-rows.txt\n\n```\n Sara, Jones, 1000,\
  \ CA, Sally, Smith, 2000, IL\nDave, Jones, 3000, FL, John, Jones, 4000, CA\nDave,\
  \ Jones, 5000, NY, Mike, Jones, 6000, NY\nTony, Jones, 7000, WA\n```\n\n### 列表 5.37--rows.sh\n\
  \n```bash\n #-----------------------------------------\n# 1) 删除空行\n# 2) 删除换行符\n\
  # 3) 每 8 个字段后打印一个 LF\n# 4) 删除每行末尾的 ','\n#-----------------------------------------\n\
  inputfile=\"mixed-data2.txt\"\noutputfile=\"aligned-data2.txt\"\ngrep -v \"^$\"\
  \ $inputfile |awk -F\",\" '{printf(\"%s\",$0)}' | awk '\nBEGIN { columnCount = 4;\
  \ rowCount = 2; currRow = 0 }\n{\n   for(i=1; i<=NF; i++) {\n     printf(\"%s \"\
  , $i)\n     if( i % columnCount == 0) { ++currRow }\n     if(currRow > 0 && currRow\
  \ % rowCount == 0) {currRow = 0;\nprint \"\"}\n   }\n}' > temp-columns\n# 4) 删除输出末尾的\
  \ ',':\ncat temp-columns | sed 's/, $//' | sed 's/ $//' > $outputfile\n```\n\nListing\
  \ 5.33 与 Listing 5.30 非常相似。核心思想是在处理完一对“正常”记录后打印一个换行符，这是通过 Listing 5.33 中**加粗显示**的代码实现的。\n\
  \n现在你可以通过将 `rowCount` 变量的初始值更改为任何正整数来轻松地扩展 Listing 5.33，代码将在无需任何进一步修改的情况下正常工作。例如，如果你将\
  \ `rowCount` 初始化为值 `5`，那么新数据集中的每行（最后输出行可能除外）将包含 5 条“正常”数据记录。\n\n### 从文本文件中删除一列\n\
  \nListing 5.34 显示了 `VariableColumns.txt` 的内容，其中文本行包含不同数量的列。\n\n### 列表 5.34 VariableColumns.txt\n\
  \n```\n this is line one\nthis is line number one\nthis is the third and final line\n\
  ```\n\nListing 5.35 显示了 `RemoveColumn.sh` 的内容，该脚本从文本文件中删除第一列。\n\n### 列表 5.35 RemoveColumn.sh\n\
  \n```bash\n awk '{ for (i=2; i<=NF; i++) printf \"%s \", $i }\n```\n\n`awk` 循环除了第一个字段外遍历所有字段。之前代码的输出是：\n\
  \n```\n400\n300\n200\n```\n\n### 文本文件的列列\n\nListing 5.35 向你展示了如何重新排列数据集，使每行包含相同数量的列并代表单个数据记录。本节中的代码示例说明了如何对齐内容正确的数据列，并在新数据集的每行中放置两个记录。Listing\
  \ 5.36 显示了 `aligned-data2.csv` 的内容，即格式正确的数据集。\n\nListing 5.37 显示了 `mixed-data2.sh`\
  \ 的内容，它说明了如何重新对齐列表 5.31 中的数据集。\n\n### 列表 5.36-rows.txt\n\n```\n Sara, Jones, 1000,\
  \ CA, Sally, Smith, 2000, IL\nDave, Jones, 3000, FL, John, Jones, 4000, CA\nDave,\
  \ Jones, 5000, NY, Mike, Jones, 6000, NY\nTony, Jones, 7000, WA\n```\n\n### 列表 5.37--rows.sh\n\
