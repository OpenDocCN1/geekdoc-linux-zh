- "# 数据清洗口袋指南\n\n\n\n![](img/9781683922179.jpg)\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n### **目标是什么？**\n\n\n\n\n### 代码示例是如何创建的？\n\n\n\n不符合前一节所列出的任何标准的命令都未包含在本入门教程中。因此，本书不涵盖系统管理相关的命令（例如关闭机器、安排备份等）。章节中内容的目的是说明如何使用\
  \ `bash` 命令处理数据集的常见数据清洗任务，之后你可以通过进一步阅读来加深知识。\n### 我该如何设置命令行 shell？\n如果你是 Mac 用户，有三种方法可以实现。第一方法是使用\
  \ `Finder` 导航到 `Applications > Utilities`，然后双击 `Utilities`（实用工具）应用程序。接下来，如果你已经有一个可用的命令行\
  \ shell，可以通过输入以下命令启动一个新的命令行 shell：\n\nopen /Applications/Utilities/Terminal.app\n\
  ```\nMac 用户的第二种方法是在已经显示的命令行 shell 中，通过简单点击 `command+n` 在 Macbook 上打开一个新的命令行 shell，这样你的\
  \ Mac 就会启动另一个命令行 shell。\n如果你是 PC 用户，可以安装 Cygwin（开源 [`cygwin.com/`](https://cygwin.com/））来模拟\
  \ `bash` 命令，或者使用其他工具包如 MKS（一种商业产品）。请阅读描述下载和安装过程的在线文档。\n如果你使用 RStudio，可以通过导航到 Tools\
  \ > Command Line 在 RStudio 内部启动命令行 shell，然后就可以运行 `bash` 命令。注意，如果自定义别名定义在主启动文件（如\
  \ `.bash_login`）之外的文件中，则它们不会被自动设置。\n\n\n\n\n\n\n\n\n\n本章的第二部分介绍了简单的 shell 脚本以及如何使其可执行的指令。正如你所看到的，shell\
  \ 脚本包含了 `bash` 命令（可选包含自定义函数），因此在创建 shell 脚本之前学习 `bash` 命令是一个好主意。\n\n本章的第三部分讨论了两个实用的\
  \ bash 命令：`cut` 命令（用于从数据集中切割或提取列和字段）和 `paste` 命令（用于将文本或数据集垂直拼接在一起）。\n\n\n\n\n\n\
  第三，任何 shell 脚本的内容都可以简单到只有一条命令，也可以由数百行 bash 命令组成。通常情况下，越有趣的 shell 脚本涉及到多个 bash 命令的组合。一个学习建议：由于通常有多种方法可以实现所需的结果，因此阅读他人的\
  \ shell 脚本来学习如何以有用的方式组合命令很有帮助。\n## 什么是 Unix？\n\nUnix 是 Ken Thompson 在 20 世纪 70 年代初创建的操作系统，今天有多个变体，例如用于\
  \ HP 机器的 HP/UX 和用于 IBM 机器的 AIX。Linus Torvalds 在 20 世纪 90 年代开发了 Linux 操作系统，许多 Linux\
  \ 命令与其对应的 `bash` 版本命令是相同的（但存在差异，通常体现在系统管理员的命令上）。Mac OS X 操作系统基于 AT&T Unix。\n\nUnix\
  \ 拥有丰富且历史悠久的历史，如果你真的对学习它的过去感兴趣，可以阅读在线文章以及维基百科。本书跳过了这些细节，专注于帮助你快速学会如何使用各种命令来提高工作效率。\n\
  ## 可用的 Shell 类型\n\n原始的 Unix shell 是 Bourne shell，由 Stephen R. Bourne 在 20 世纪 70\
  \ 年代中期编写。此外，Bourne shell 是第一个出现在 `bash` 系统上的 shell，你有时会听到用“the shell”来指代 Bourne\
  \ shell。Bourne shell 是一个 `POSIX` 标准 shell，通常在大多数版本的 Unix 上被安装为 `/bin/sh`，其默认提示符是\
  \ `$` 字符。因此，Bourne shell 脚本将可以在几乎每一个版本的 Unix 上。从本质上说，AT&T 系 Unix 支持 Bourne shell\
  \ `(sh)`、`bash`、Korn shell `(ksh)`、`tsh` 和 `zsh`。\n\n然而，Unix 还有一个 `BSD` 分支，使用“C”\
  \ shell `(csh)`，其默认提示符是 `%` 字符。通常，为 `csh` 编写的 shell 脚本不会在 AT&T 分系的 Unix 上执行，除非这些机器上也安装了\
  \ `csh` shell（反之亦然）。\nBourne shell 在某种意义上是最“原始”的，因为它缺少了其他 shell 中提供的某些命令，例如 `history`、`noclobber`\
  \ 等。Bourne Shell 的各种子类列如下：\n\n- Bourne shell `(sh)`\n- Korn shell `(ksh)`\n- Bourne\
  \ Again shell `(bash)`\n\n不同的 C 类 shell 如下：\n\n- C shell `(csh)`\n- TENEX/TOPS C\
  \ shell `(tcsh)`\n虽然书中的命令和 shell 脚本是基于 `bash` shell 的，但许多命令在其他 shell 中同样有效（如果无效，其他\
  \ shell 也有类似的命令来实现相同的目标）。在互联网上搜索“我如何在 `<shell name>` 中执行 `<bash command>`”通常能给你一个答案。有时命令在本质上是相同的，但语法略有不同，在命令\
  \ shell 中输入 `man <command>` 可以提供有用信息。\n\n\n`bash` 是“Bourne Again Shell”的缩写，它的根源于\
  \ Stephen R. Bourne 创建的 Bourne shell。基于 Bourne shell 的 shell 脚本将在 `bash` 中执行，但反之则不然。`bash`\
  \ shell 提供了 Bourne shell 中不可直接的额外功能，例如对数组的支持（在本章稍后讨论）。\n\n在 Mac OS X 上，`/bin` 目录包含以下可执行的\
  \ shell：\n\n-r-xr-xr-x   1  root   wheel   1377872   Apr 28  2017 /bin/ksh\n-r-xr-xr-x\
  \   1  root   wheel    630464   Apr 28  2017 /bin/sh\n-rwxr-xr-x   1  root   wheel\
  \    375632   Apr 28  2017 /bin/csh\n-rwxr-xr-x   1  root   wheel    592656   Apr\
  \ 28  2017 /bin/zsh\n-r-xr-xr-x   1  root   wheel    626272   Apr 28  2017 /bin/bash\n\
  \n如果你感兴趣，这里有一个关于上述 shell 对各种功能支持的对比矩阵：\nhttps://stackoverflow.com/questions/5725296/difference-between-sh-and-bash.\n\
  \n\n```\nsh  --version\nGNU bash, version 3.2.57(1)-release (x86_64-apple-darwin16)\n\
  Copyright (C) 2007 Free Software Foundation, Inc.\n```\n\n\n### 获取 `bash` 命令的帮助\n\
  \n如果你想查看特定 `bash` 命令的选项，请指定 `-?` 开关。例如，`cat -?` 会显示 `cat` 命令的可用选项。你可以调用 `man` 命令来查看\
  \ `bash` 命令及其选项的描述：\n```\nman  cat\n```\n\n请记住，`man` 命令产生的解释是简短的，如果这些解释不够清楚，你可以。\n\
  \n\n`man` 命令产生简短的解释，如果这些解释不够清楚，你可以。\n\n\n`man` 命令产生简短的解释，如果这些解释不够清楚，你可以。\n\n`history`\
  \ 命令显示你执行的命令历史，如下：\n\nhistory\n```\n\n上述命令的示例输出是：\n\n```\n1203   vi  longfile.txt\n\
  1204   cat longfile.txt |fold-40\n1205   cat longfile.txt |fold-30\n1206   cat longfile.txt\
  \ |fold-50\n1207   cat longfile.txt |fold-45\n1209   history\n1210   cd /Library/Developer/CommandLineTools/usr/include/c++\n\
  1211   cd /tmp\n1212   cd $HOME/Desktop\n1213   history\n\n现在你可以使用以下命令返回 1210 行的目录：\n\
  \n```\n```\n\n`!cd` 命令会在命令历史中反向搜索第一个匹配的 `cd` 命令：在这种情况下，1212 行是第一个匹配项。如果当前命令与 1210\
  \ 行命令之间没有 `cd` 命令，那么 `!1210` 和 `!cd` 将产生相同的效果。\n\n\n在使用 bash 命令的“!” 选项时要小心，因为匹配“!”的命令可能不是你预期的，因此安全的方法是使用\
  \ `history` 命令，然后在调用“!”运算符时显式地指定正确的数字。\n\n\n`ls` 命令用于列出文件名，有许多可用的开关可以使用，如本节所示。例如，`ls`\
  \ 命令在我的 Mac 上显示以下文件名（实际显示取决于字体大小和命令 shell 的宽度）：\n\n```\napple-care.txt     iphonemeetup.txt\
  \    outfile.txt      ssl-\noutput.txt\n```\n\n\n\n\n命令 `ls -1`（数字“1”）以垂直列表的形式显示文件名：\n\
  ```\n apple-care.txt\ncheckin-commands.txt\niphonemeetup.txt\nkyrgyzstan.txt\noutfile.txt\n\
  output.txt\n```\n\n命令 `ls -1`（字母“l”）以详细列表形式显示文件名：\n\n```\n-rwx------  1 ocampesato\
  \ staff  25  Jan 06 19:21 apple-care.txt\n-rwx------  1 ocampesato staff 146  Jan\
  \ 06 19:21 checkin-commands.txt\n-rwx------  1 ocampesato staff 478  Jan 06 19:21\
  \ iphonemeetup.txt\n-rwx------  1 ocampesato staff  12  Jan 06 19:21 kyrgyzstan.txt\n\
  -rw-r--r--  1 ocampesato staff  11  Jan 06 19:21 outfile.txt\n-rwx------  1 ocampesato\
  \ staff 176  Jan 06 19:21 ssl-instructions.txt\n```\n\n命令 `ls -1t`（字母“l”和“t”）显示按时间排序的详细列表：\n\
  \n total 56\n-rwx------1 ocampesato staff  25  Jan 06 19:21 apple-care.txt\n-rwx------1\
  \ ocampesato staff 146  Jan 06 19:21 checkin-commands.txt\n-rwx------1 ocampesato\
  \ staff 478  Jan 06 19:21 iphonemeetup.txt\n-rwx------1 ocampesato staff  12  Jan\
  \ 06 19:21 kyrgyzstan.txt\n-rw-r--r--1 ocampesato staff  11  Jan 06 19:21 outfile.txt\n\
  -rw-r--r--1 ocampesato staff  12  Jan 06 19:21 output.txt\n```\n\n命令 `ls -ltr`（字母“l”、“t”和“r”）显示按时间反序排列的文件名详细列表：\n\
  \n```\n total 56\n-rwx------1 ocampesato staff 176 Jan 06 19:21 ssl-instructions.txt\n\
  -rw-r--r--1 ocampesato staff  11 Jan 06 19:21 outfile.txt\n-rwx------1 ocampesato\
  \ staff  12 Jan 06 19:21 kyrgyzstan.txt\n-rwx------1 ocampesato staff 478 Jan 06\
  \ 19:21 iphonemeetup.txt\n-rwx------1 ocampesato staff 146 Jan 06 19:21 checkin-commands.txt\n\
  -rwx------1 ocampesato staff  25 Jan 06 19:21 apple-care.txt\n```\n\n\n字体 第 #1 列：代表文件类型和赋予该文件的权限（见下文）\n\
  - 第 #2 列：显示文件或目录占用的内存块数\n- 第 #3 列：指示文件的所有者（Bash 用户）\n- 第 #4 列：代表所有组\n- 第 #5 列：代表以字节为的文件大小\n\
  - 第 #6 列：显示该文件的创建或最后修改日期\n\n在 `ls -l` 列表示例中，每个文件行都以 d、- 或 l 开头。这些字符表示所列出的文件类型。这些（以及其他）初始值描述如下：\n\
  \n| - | 普通文件（ASCII 文本文件、二进制可执行文件或硬链接） |\n| b | 块设备文件（如物理硬盘） |\n| d | 文件（包含其他文件和目录的列表）\
  \ |\n| l | 符号链接文件 |\n| p | 命名管道（进程间通信的机制） |\n| s | 套接字（用于进程间通信） |\n\n有关 `ls` 命令的更多详情，请咨询在线文档。\n\
  \n\n现在让我们看看如何显示文本文件中不同的行。你可以使用 `cat` 命令显示文件的全部内容，但先获取一些关于文件内容的信息更好。具体来说，请使用 `wc`\
  \ 命令。\n\n### `wc` 命令\n\n`wc` 命令统计文件中行数、单词数和字节数。当你对文件运行 `wc` 时，它的输出如下所示：\n\n10 50\
  \ 300 filename\n```\n\n输出分别代表行数、单词数和字节数。你可以配合 `wc` 的选项来仅统计其中之一：\n\n- `wc -l`：统计行数\n\
  - `wc -w`：统计单词数\n\n你也可以对多个文件使用 `wc`：\n\n```\nwc file1 file2\n\n输出将显示每个文件的计数。\n\n\
  ### `head` 命令\n\n`head` 命令用于显示文件的开头部分。默认情况下，它显示前 10 行。你可以使用 `-n` 选项指定要显示的行数：\n\n\
  head -n 5 filename\n```\n\n这将显示 `filename` 的前 5 行。\n\n### `tail` 命令\n\n\n```bash\n\
  tail -n 5 filename\n```\n\n\n### `fold` 命令\n\n`fold` 命令用于在指定的宽度对文件中的行进行折行。\n\n```bash\n\
  fold -w 20 filename\n\n这将 `filename` 的行在 20 个字符处折行。\n\n\n\n\n\n\n```\n the contents\
  \ of this long file are too long to see in a single\nscreen and each line contains\
  \ one or more words and if you\nuse the cat command the file contents scroll off\
  \ the screen so\nyou can use other commands such as the head or tail or more\ncommands\
  \ in conjunction with the pipe command that is very\nbash shell csh zsh ksh and\
  \ Bourne shell\n```\n\n你可以使用此命令将 `longfile2.txt` 的内容“折叠”为长度为 `45` 的行（仅为示例）：\n\n\
  ```\n cat longfile2.txt |fold -45\n```\n\n\n```\n the contents of this long file\
  \ are too long t\no see in a single screen and each line contai\nns one or more\
  \ words and if you use the cat c\nommand the file contents scroll off the scree\n\
  n so you can use other commands such as the h\nith the pipe command that is very\
  \ useful in U\nnix and is available in every shell including\n the bash shell csh\
  \ zsh ksh and Bourne shell\n```\n\n注意，上述输出中的某些单词是根据行宽分割的，而不是“报纸风格”。\n\n\n## 文件所有权：所有者、组和其他\n\
  \nBash 文件具有 `rwx` 权限，其中 `r` = 读取权限，`w` = 写入权限，`x` = 执行权限。通过直接输入文件名（如果文件不在当前目录中则输入完整路径）即可从命令行执行。从命令行调用可执行文件将导致操作系统尝试执行文本文件内部的命令。\n\
  \n使用 `chmod` 命令为文件设置权限。例如，如果你需要为文件设置 `rwx rw- r--` 权限，请使用以下命令：\n\n chmod u=rwx g=rw\
  \ o=r filename\n```\n\n在上述命令中，选项 `u`、`g` 和 `o` 分别代表用户权限、组权限和其他权限。\n\n为了在当前文件上添加额外权限，使用\
  \ `+` 为用户、组或其他人添加权限，使用 `-` 移除权限。例如，对于权限为 `rwx rw- r--` 的文件，按如下方式添加执行权限：\n\n chmod\
  \ o+x filename\n```\n\n此命令为“其他人”添加了 `x` 权限。\n\n按如下方式为所有权限类别（即用户、组和其他人）添加执行权限：\n\n\
  \ chmod a+x filename\n```\n\n在上述命令中，字母 `a` 表示“所有”。\n\n如所示，指定一个 `-` 来移除任何权限：\n\n\
  ```\n chmod a-x filename\n\n## 隐藏文件\n\n所谓的“不可见”文件是指第一个字符为点或句点（`.`）的文件。Bash 程序（包括\
  \ shell）使用这些文件中的大部分来存储配置信息。常见的隐藏文件示例包括：\n\n.profile: Bourne shell (sh) 初始化脚本\n\n\
  \n.kshrc: Korn shell (ksh) 初始化脚本\n\n.cshrc: C shell (csh) 初始化脚本\n\n.rhosts: 远程 shell\
  \ 配置文件\n\n要列出隐藏文件，向 `ls` 指定 `-a` 选项：\n\n ls -a\n.         .profile        docs \
  \       lib        test_results\n..        .rhosts         hosts       pub     \
  \   users\n.emacs    bin             hw1         res.01     work\n.exrc     ch07\
  \            hw2         res.02\n.kshrc    ch07.bak        hw3         res.03\n\
  ```\n\n单点 `.`: 代表当前目录。\n\n双点 `..`: 代表父目录。\n## 处理问题文件名\n\n问题的文件名包含一个或多个空格、隐藏（非打印）字符，或以连字符（“-”）开头。\n\
  \n你可以使用双引号列出包含空格的文件名，或者在每个空格前加上反斜杠字符（`\\`）。\n\n例如，如果你有一个名为 `One Space.txt` 的文件，可以如下使用\
  \ `ls` 命令：\n```\n ls -1 \"One Space.txt\"\nls -l One\\ Space.txt\n```\n\n以连字符（“-”）开头的的文件名很难处理，因为连字符是指定\
  \ bash 命令选项的前缀。因此，如果你有一个文件名为 `–abc` 的文件，那么命令 `ls –abc` 将无法正常工作，因为“-a”被解释为 `ls` 命令的开关（而没有\
  \ “a” 选项）。\n\n\n`mv -- -abc.txt renamed-abc.txt`\n\n## 使用环境变量\n\n有许多内置的环境变量可用，以下子节将讨论一些常见的变量。\n\
  \n\n`env`（“环境”）命令显示你的 `bash` 环境中的变量。`env` 命令输出示例如下：\n\n```\n SHELL=/bin/bash\nTERM=xterm-256color\n\
  TMPDIR=/var/folders/73/39lngcln4dj_scmgvsv53g_w0000gn/T/\nOLDPWD=/tmp\nTERM_SESSION_ID=63101060-9DF0-405E-84E1-EC56282F4803\n\
  COMMAND_MODE=bash2003PATH=/opt/local/bin:/Users/ocampesato/\nandroid-sdk-mac_86/platform-tools:/Users/ocampesato/\n\
  android-sdk-mac_86/platform-tools:/usr/local/bin:\nPWD=/Users/ocampesato\nJAVA_HOME=/System/Library/JavaVirtualMachines/1.6.0.jdk/\n\
  Contents/Home\nLANG=en_US.UTF-8\nHOME=/Users/ocampesato\nLOGNAME=ocampesato\nSHELL=/bin/bash\n\
  USER=ocampesato\nDISPLAY=/tmp/launch-org.xquartz:0\n```\n\n设置环境变量并执行命令的一些有趣示例在此：*https://stackoverflow.com/questions/13998075/setting-environment-variable-for-one-call-in-bash-using-env.*\n\
  \n\n本节讨论了一些重要的环境变量，你可能不需要修改它们，但了解它们的存在和用途是有用的。\n\n`HOME` 变量包含用户主目录的绝对路径。\n\n`HOSTNAME`\
  \ 变量指定主机的名称。\n\n\n`PATH` 变量指定搜索路径（见下一小节）。\n\n`SHELL` 变量指定当前 shell 的绝对路径。\n\n`USER`\
  \ 变量指定当前用户名。如果超级用户执行 `su` 命令来模拟另一个用户的权限，此值可能与登录名不同。\n\n\n程序和其他可执行文件可能位于许多目录，因此操作系统提供了一个搜索路径，列出了搜索可执行文件的目录。将目录添加到路径中意味着可以直接使用文件名作为调用可执行文件，就像它位于你的工作目录一样。\n\
  \n路径存储在环境变量中，环境变量是由操作系统维护的命名字符串。这些变量包含了命令行 shell 和其他程序可用的信息。\n\n路径变量在 `bash` 中名为\
  \ `PATH`，在 Windows 中名为 `Path`（`bash` 区分大小写；Windows 不区分）。\n\n\n```\n export PATH=$HOME/anaconda:$PATH\n\
  ```\n\n\n\n\n要在 bash 的特定会话中将 `Python` 目录添加到路径：\n\n```bash\nexport PATH=\"$PATH:/usr/local/bin/python\"\
  \n```\n\n\n```bash\nPATH=\"$PATH:/usr/local/bin/python\"\n```\n\n**注意**\n\n`/usr/local/bin`\
  \ 是 `Python` 可执行文件所在的位置\n\n\n以下命令定义了一个名为 `h1:` 的环境变量：\n\n```bash\nh1=$HOME/test\n\
  ```\n\n\n```bash\necho $h1\n```\n\n你会在 OS X 上看到以下输出：\n\n```\n/Users/jsmith/test\n\
