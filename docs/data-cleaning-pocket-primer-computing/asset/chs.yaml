  \nAMOUNT SOLD FOR SKU 5530: 85.00\n\nAMOUNT SOLD FOR SKU 6550: 22.00\n\nAMOUNT SOLD\
  \ FOR SKU 7200: 562.50\n\nAMOUNT SOLD FOR SKU 8000: 560.00\n```\n\nListing A.10\
  \ 显示了 `skutotals3.sh` 的内容，它计算了 `skuvalues.txt` 中每个 `SKU` 销售数量的最小、最大、平均和总数。\n\n###\
  \ 列表 A.10: skutotals3.sh\n```\n SKUVALUES=\"skuvalues.txt\"\n\nSKUSOLD=\"skusold.txt\"\
  \n\nTOTALS=\"totalspersku.txt\"\n\nrm -f $TOTALS 2>/dev/null\n\n##############################\n\
  #计算每个 sku 的总量\n\n##############################\n\nfor sku in `cat $SKUVALUES`\n\
  \ndo\n   total=`cat $SKUSOLD |grep $sku | awk '{total += $2} END\n{print total}'`\n\
  \   echo \"UNITS SOLD FOR SKU $sku: $total\"\n   echo \"$sku|$total\" >> $TOTALS\n\
  done\n\n##########################\n\n#计算最大/最小/平均\n\n##########################\n\
  awk -F\"|\" '\n   BEGIN {first = 1;}\n   {if(first) { min = max= avg = sum = $2;\
  \ first=0; next}}\n   { if($2 < min) { min = $2 }\n     if($2 > max) { max = $2\
  \ }\n     sum += $2\n   }\n   END {print \"Minimum = \",min\n        print \"Maximum\
  \ = \",max\n        print \"Average = \",avg\n        print \"Total = \",sum\n}\n\
  ' $TOTALS \n```\n\nListing A.10 初始化了一些变量，紧接着是一个 `for` 循环，该循环调用 `awk` 命令来计算每个 `SKU`\
  \ 值的的小计（即销售数量）。Listing A.10 的后续部分包含一个 `awk` 命令，用于计算文件 `$TOTALS` 中 `SKU` 单位的最大、最小、平均值和总和。\n\
  \n运行 Listing A.10 中的脚本文件，你将看到以下输出：\n\n```\n UNITS SOLD FOR SKU 4520: 27\n\nUNITS\
  \ SOLD FOR SKU 5530: 17\n\nUNITS SOLD FOR SKU 6550: 8\n\nUNITS SOLD FOR SKU 7200:\
  \ 90\n\nUNITS SOLD FOR SKU 8000: 160\n\nMinimum = 8\n\nMaximum = 160\n\nAverage\
  \ = 27\n\nTotal = 302\n```\n\n### 使用 `grep` 命令模拟关系型数据\n\n本节向你展示如何结合 `grep` 和 `cut`\
  \ 命令，以跟踪一个小型客户数据库、他们的购买情况以及存储在三个文本文件中的购买详情。\n\n请记住，有很多开源工具包可用，它们可以极大地方便关系型数据和非关系型数据的工作。这些工具包可能非常健壮，并且可以减少所需的代码量。\n\
