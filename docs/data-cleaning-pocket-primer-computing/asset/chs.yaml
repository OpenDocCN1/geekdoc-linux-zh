  \   79.33    29.67\n\n  5 0.45   70.33    29.67\n\n  6 0.16   79.00    30.00\n\n\
  \  7 0.27   74.00    30.33\n```\n\n### 计算字段值的组合\n\nListing A.33 显示了壳脚本 `linear-combo.sh`\
  \ 的内容，该脚本计算多个数据集中列的各种线性组合，并将一个合并后的数据集作为输出。\n\n#### Listing A.33: linear-combo.sh\n\
  \n```\n # => combinations of columns\n\nawk -F',' '\n\n{\n\n  $2 += $3 * 2 + $4\
  \ / 2\n\n  $3 += $4 / 3 + $2 * $2 / 10\n\n  $4 += $2 + $3\n\n  $1 += $2 * 3 - $4\
  \ / 10\n\n  printf(\"%d,%.2f,%.2f,%.2f\\n\",$1,$2,$3,$4)\n\n}\n\n' rain?.csv\n```\n\
  \nListing A.33 处理了数据集 `rain1.csv`、`rain2.csv` 和 `rain3.csv` 的值，这些内容在本节前面已经显示过。关键的观察结果是，`awk`\
  \ 语句体中的计算序列涉及相互依赖。\n\n具体而言，`$2` 的值是 `$3` 和 `$4` 值的线性组合。接下来，`$3` 的值是 `$4` 和 `$2`\
  \ 值的线性组合，其中后者不是数据集中的原始值，而是其计算值。第三，`$4` 的值是 `$2` 和 `$3` 的线性组合，这两者都是计算出的值，而不是数据集中的值。最后，`$1`\
  \ 的值是新计算出的 `$2` 和 `$4` 值的线性组合。\n\n如你所见，`awk` 提供了灵活性，以非常简单且顺序的方式指定几乎任何计算组合（包括非线性组合）。Listing\
