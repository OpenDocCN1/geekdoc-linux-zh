  ' rain?.csv\n```\n\nListing A.27 计算了 `rain?.csv` 指定数据集中三列（即降雨量、华氏温度和湿度）的数字之和，在本例中，它由数据集\
  \ `rain1.csv`、`rain2.csv` 和 `rain3.csv` 组成。因此，Listing A.27 可以处理多个数据集（`rain1.csv`\
  \ 到 `rain3.csv`）。你可以通过以下表达式扩展此示例，以处理任何以 `rain` 字符串开头并以 `csv` 后缀结尾的数据集：\n\n```\n\
  rain*.csv\n```\n\n运行 Listing A.27 的输出如下：\n\n```\n FILENAMES:\nrain1.csv   rain2.csv\
  \   rain3.csv\ninches: 0.83\ndegrees: 21.71\nhumidity: 79.43\n```\n\n### 来自多个数据集的数值\
