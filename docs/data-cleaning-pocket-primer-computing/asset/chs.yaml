  \ `gcd()` 函数。该函数是必要的，因为列表 A.3 的后续部分包含了 `lcm()` 函数，该函数调用 `gcd()` 函数，并通过一些乘法步骤来计算两个数的最小公倍数（LCM）。列表\
  \ A.3 的输出显示了 10 和 24 的最小公倍数，如下：\n\n```\n The LCM of 24 and 10 = 120\nThe LCM of\
  \ 10 and 30 = 30\n```\n\n### 计算素因子\n\n列表 A.4 显示了脚本 `Divisors2.sh` 的内容，该脚本计算一个正整数的素因数。\n\
  \n##### 列表 A.4: Divisors2.sh\n\n```\n #!/bin/sh\n\nfunction divisors()\n{\n   div=\"\
  2\"\n   num=\"$1\"\n   primes=\"\"\n   while (true)\n   do\n     remainder=`expr\
  \ $num % $div`\n     if [ $remainder == 0 ]\n     then\n      #echo \"divisor: $div\"\
  \n       primes=\"${primes} $div\"\n         num=`expr $num / $div`\n       else\n\
  \         div=`expr $div + 1`\n       fi\n       if [ $num -eq 1 ]\n       then\n\
  \         break\n       fi\n     done\n     # use 'echo' instead of 'return'\n \
  \    echo $primes\n}\n\nnum=\"12\"\nprimes=`divisors $num`\necho \"The prime divisors\
  \ of $num: $primes\"\n\nnum=\"768\"\nprimes=`divisors $num`\necho \"The prime divisors\
  \ of $num: $primes\"\n\nnum=\"12345\"\nprimes=`divisors $num`\necho \"The prime\
  \ divisors of $num: $primes\"\n\nnum=\"23768\"\nprimes=`divisors $num`\necho \"\
  The prime divisors of $num: $primes\" \n```\n\n列表 A.4 包含了 `divisors()` 函数，它主要由一个\
  \ `while` 循环组成，用于检查 `num`（初始化为 `$1` 的值）的因子。`div` 的初始值为 2，每当 `div` 整除 `num` 时，`div`\
  \ 的值就会追加到 `primes` 字符串中，并将 `num` 替换为 `num/div`。如果 `div` 不能整除 `num`，则 `div` 加 1。请注意，列表\
  \ A.4 中的 `while` 循环在 `num` 达到 1 时终止。\n\n列表 A.4 的输出显示了 12、768、12345 和 23768 的素因数，如下：\n\
  \n```\n The prime divisors of 12: 2 2 3\nThe prime divisors of 768: 2 2 2 2 2 2\
  \ 2 2 3\n\nThe prime divisors of 12345: 3 5 823\nThe prime divisors of 23768: 2\
  \ 2 2 2971 \n```\n\n12 和 678 的素因子在不到 1 秒内计算完成，但计算 12345 和 23768 的素因子要慢得多。\n\n###\
  \ 第 3 章示例\n\n本节的第一个示例说明了如何确定哪些 zip 文件包含 SVG 文档。本节的第二个示例展示了如何检查日志文件的条目（使用模拟值）。第三个代码示例展示了如何使用\
  \ `grep` 命令来模拟一个由三个“表”组成的关系型数据库，每个表由一个数据集表示。\n\n列表 A.5 显示了 `myzip.sh` 的内容，它生成两个文件列表：第一个列表包含包含\
  \ SVG 文档的 zip 文件名，第二个列表包含不包含 SVG 文档的 zip 文件名。\n\n##### 列表 A.5: myzip.sh\n\n```\n\
  \ foundlist=\"\"\nnotfoundlist=\"\"\n\nfor f in `ls *zip`\ndo\n  found=`unzip -v\
  \ $f |grep \"svg$\"`\n  if [ \"$found\" != \"\" ]\n  then\n   #echo \"$f contains\
  \ SVG documents:\"\n   #echo \"$found\"\n    foundlist=\"$f ${foundlist}\"\nelse\n\
  \    notfoundlist=\"$f ${notfoundlist}\"\n  fi\ndone\n\necho \"Files containing\
  \ SVG documents:\"\necho $foundlist| tr ' ' '\\n'\necho \"Files not containing SVG\
  \ documents:\"\necho $notfoundlist |tr ' ' '\\n' \n```\n\n列表 A.5 在 zip 文件中搜索硬编码的字符串\
  \ `svg`。如果你想在一组 zip 文件中搜索其他字符串，请手动将此字符串替换为另一个字符串。或者，你可以提示用户输入搜索字符串，这样就不需要对 shell\
  \ 脚本进行手动修改。\n\n为了方便起见，列表 A.6 显示了 `searchstrings.sh` 的内容，说明了如何在命令行输入字符串。\n\n#####\
  \ 列表 A.6: searchstrings.sh\n\n```\n foundlist=\"\"\nnotfoundlist=\"\"\n\nif [ $#\
  \ -eq 0 ]; then\n  echo \"Usage: $0 <string>\"\n  exit\nfi\n\nstr=$1\n\nfor f in\
  \ `ls *zip`\ndo\n  found=`unzip -v $f |grep \"$str$\"`\n  if [ \"$found\" != \"\"\
  \ ]\n  then\n    foundlist=\"$f ${foundlist}\"\nelse\n    notfoundlist=\"$f ${notfoundlist}\"\
  \n  fi\ndone\n\necho \"Files containing $str:\"\necho $foundlist| tr ' ' '\\n'\n\
  echo \"Files not containing $str:\"\necho $notfoundlist |tr ' ' '\\n'\n```\n\n\n\
  \n\n我们可以扩展之前的 shell 脚本，以考虑每个 `SKU` 的不同价格。Listing A.8 显示了 `skuprices.txt` 的内容。\n\n\
  ### 列表 A.8: skuprices.txt\n```\n 4520 3.50\n\n5530 5.00\n\n6550 2.75\n\n7200 6.25\n\
  \n8000 3.50\n```\n\nListing A.9 显示了 `skutotals2.sh` 的内容，该脚本扩展了 Listing A.8 中的代码，以计算每个\
  \ `SKU` 的收入。\n\n### 列表 A.9: skutotals2.sh\n```\n SKUVALUES=\"skuvalues.txt\"\n\n\
  SKUSOLD=\"skusold.txt\"\n\nSKUPRICES=\"skuprices.txt\"\n\nfor sku in `cat $SKUVALUES`\n\
