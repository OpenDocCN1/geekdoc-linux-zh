  Ghi\n123\n#def5\n123z\n```\n\n第三步是调用 `awk` 并检查匹配正则表达式 `^[a-zA-Z]+$` 的单词，该表达式匹配任何由一个或多个大写和或小写字母组成的字符串（不包含其他字符）：\n\
  \n```\n if($0 ~ /^[a-zA-Z]+$/) { print $0 }\n```\n\n输出如下：\n\n```\n ghi\nabc\nGhi\n\
  ```\n\n最后，如果你想对输出进行排序并只打印唯一的单词，可以将 `awk` 命令的输出重定向到 `sort` 命令和 `uniq` 命令。\n\n第二个\
  \ `awk` 命令使用正则表达式 `^[0-9]+` 来检查整数，第三个 `awk` 命令使用正则表达式 `^[0-9a-zA-Z]+` 来检查字母数字单词。运行\
