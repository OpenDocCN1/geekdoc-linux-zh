  \n173,198.74,4052.76,4296.50\n### 总结\n\n在本附录中，你看到了如何使用一些实用且多用途的 `bash` 命令的示例。首先，你看到了用于各种任务的壳脚本示例，例如计算两个正整数的\
  \ `GCD`（最大公约数）和 `LCM`（最小公倍数）、一个正整数的斐波那契值，以及一个正整数的质因数。接下来，你看到了一个带有 `grep` 命令、`while`\
  \ 循环和其他构造的 `bash` 脚本，它可以将数据追加到日志文件中，并带有判断何时退出 `bash` 脚本的逻辑。此外，你学习了如何使用 `grep` 命令来模拟一个简单的数据库。在附录的最后部分，你学习了如何使用\
  \ `awk` 处理跨多行的记录，如何计算涉及多个数据集的列和和平均值，以及如何使用 `awk` 相关的函数如 `gsub()` 和 `split()`。最后，你学习了如何动态计算多个数据集的列组合。\n\
