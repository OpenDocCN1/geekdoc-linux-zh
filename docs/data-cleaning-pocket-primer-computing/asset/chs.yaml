  \ ltd=\"ls -lt | grep '^d'\"\nalias ltdm=\"ls -lt | grep '^d'|more\"\n\n## 查找可执行文件\n\
  \n有多个命令可以通过搜索 `PATH` 环境变量中的目录来查找可执行文件（二进制文件或 shell 脚本）：`which`、`whence`、`whereis`\
  \ 和 `whatis`。这些命令的结果与 `which` 命令类似，如下文所述。\n\n`which` 命令提供你指定的任何可执行文件的完整路径；如果该可执行文件不在\
  \ `PATH` 环境变量指定的任何目录中，则返回一个空行。这对于判断特定命令或工具是否安装在系统上非常有用。\n\nwhich rm\n```\n\n上一个命令的输出在此：\n\
  \n```\n/usr/bin/rm\n\n`whereis` 命令提供了你从 `where` 命令获得的信息，以及该可执行文件的 `man` 手页的位置：\n\
  \n```bash\n$whereis rm\nrm: /bin/rm /usr/share/man/man1/rm.1.bz2\n```\n`whatis`\
  \ 命令在 `whatis` 数据库中查找指定的命令，这对于识别系统命令和重要的配置文件非常有用。可以将其视为简版的“man”命令，它显示关于 `bash` 命令的简洁细节（例如，输入\
  \ `man ls` 你将看到关于 `ls` 命令的几页解释）。\n\n## 什么是 Shell 脚本？\n\nShell 脚本包含 `bash` 命令，这些命令从上到下执行（即按照在\
  \ shell 脚本中出现的顺序），除非它们被定义在函数内部。特别是 shell 脚本中的用户定义函数是按照调用的顺序执行，而不是在脚本中出现的顺序。然而，你可以通过条件逻辑、case\
  \ 语句、循环和函数来更改命令执行的顺序。\n\nShell 脚本可以包含你系统中可用的 `bash` 命令（但请注意某些命令需要 `sudo` 命令，而这又需要密码）。Shell\
  \ 脚本的简单示例包括创建文件、从文件读取数据和更新文件内容的类文件命令。无论你的 shell 脚本内容如何，它们都是“即时”解释的，因此没有创建二进制可执行文件的编译步骤。\n\
  Shell 脚本的目的是自动化执行一组 `bash` 命令的过程，这样你就不需要从命令行手动执行它们。如果你需要从命令行执行一个简单的命令，那么可能不需要通过\
  \ shell 脚本来完成：只需输入命令并按 `<RETURN>` 键即可。注意，`bash crontab` 工具允许你在不同的时间点调度 shell 脚本的执行（`crontab`\
  \ 工具不在本书的范围内）。\n\n你可能已经知道，注释在源代码中很重要。良好的 shell 脚本包含有意义的注释，以 `#` 开。\n\n## 一个 Shell\
  \ 脚本\n\n使用你喜欢的文本编辑器创建 `test.sh` 文件，内容如下：\n```bash\n#!/bin/bash\npwd\nls\nmkdir /tmp\n\
  touch /tmp/abc\nls\n\n赋予该脚本可执行权限：\n\n```bash\nchmod +x test.sh\n```\n\n\n```bash\n\
  ./test.sh\n```\n\n输出将是：\n\n/tmp\n... (tmp 列表)\n/tmp\n... (包含 abc 的 tmp 列表)\n```\n\
  \n\n\n\n```\n printf \"%-5s %-10s %-4s\\n\" ABC DEF GHI\nprintf \"%-5s %-10s %-4.2f\\\
  n\" ABC DEF 12.3456\n```\n\n\n```\n ABC     DEF           GHI\nABC     DEF     \
  \      12.35\n```\n\n另一方面，如果你输入以下的一对命令：\n```\n echo \"ABC DEF GHI\"\necho \"ABC\
  \ DEF 12.3456\"\n```\n\n你将看到如下输出：\n\n ABC DEF GHI\nABC DEF 12.3456\n```\n\n关于 `printf`\
  \ 语句和 `echo` 命令的详细（且非常长的）讨论可以在这里：\n\n*https://unix.stackexchange.com/questions/65803/why-is-printf-better-than-echo.**\n\
  ## `echo` 命令与空格\n\n`echo` 命令会保留变量中的空格，但在某些情况下，结果可能与你的预期不同。\n\n列表 1.1 显示了 `EchoCut.sh`\
  \ 的内容，说明了当 `echo` 命令与 `cut` 命令配合使用时可能差异。\n\n### 列表 1.1. EchoCut.sh\n```\n x1=\"\
  123    456    789\"\nx2=\"123 456 789\"\necho \"x1 = $x1\"\necho \"x2 = $x2\"\n\
  ```\n\n x3=`echo $x1   | cut -c1-7`\nx4=`echo \"$x1\" | cut -c1-7`\nx5=`echo $x2\
  \   | cut -c1-7`\necho \"x3 = $x3\"\necho \"x4 = $x4\"\necho \"x5 = $x5\"\n```\n\
  运行列表 1.1 中的代码，你将看到如下输出：\n\n```\n x1 = 123   456 789\nx2 = 123 456 789\nx3 = 123\
  \ 456\nx4 = 123   4\n```\n\n`x3` 的值可能与你预期的不同：`123` 和 `456` 之间只有一个空格，而不是变量 `x1` 定义中出现的三个空格。\n\
  \n当你编写 shell 脚本来检查文本文件中特定列的值（例如工资文件和其他包含财务数据的文件）时，这个看似微不足道的细节非常重要。解决方案涉及使用双引号（有时会使用在第\
  \ 2 章中，反引号命令为 `` `ls *py` ``\n\n列表 1.2 显示了 `CommandSubst.sh` 的内容，该文件显示了目录下文件列表的子集。\n\
  ### 列表 1.2. CommandSubst.sh\n\n```\n for f in `ls *py`\ndo\n  echo \"file is: $f\"\
  \ndone\n\n列表 1.2 包含一个 `for` 循环，显示（当前目录下）带有“py”后缀的文件名。\n\n我的 MacBook 上运行列表 1.2 的输出如下：\n\
  \n```\n file is: CapitalizeList.py\nfile is: FixedColumnCount1.py\nfile is: FixedColumnWidth1.py\n\
  file is: LongestShortest1.py\nfile is: My2DMatrix.pyß\nfile is: PythonBash.py\n\
  file is: PythonBash2.py\nfile is: StringChars1.py\nfile is: Triangular2.py\nfile\
  \ is: Zip1.py\n```\n\n注意\n\n输出取决于你在执行 `CommandSubst.sh` 的目录中是否存在任何 `.py` 后缀的文件。\n\
  \n\n使用 shell 脚本时一个非常重要的概念是：脚本内部设置的任何变量在脚本执行完毕将不再存在。规则如下：\n\n![](img/square.jpg)如果变量在脚本中没有设置，但在脚本执行之前已经定义，那么该变量在脚本内部也将可用。\n\
  \n![](img/square.)如果变量在脚本中被设置，它在变量设置后会覆盖任何同名的现有变量，但一旦脚本结束，该变量将恢复到它的旧值（如果在 shell\
  \ 脚本外部不存在，则恢复为无值）。\n\n\n（此处省略重复的示例段落）\n\n## 使用数组\n\n数组在数据管理中至关重要，并出现在各种范围内。常见的问题是将相关数据元素分组在一起，然后在行内引用它们。\n\
  \n\n```\n volunteer[0] = name\n volunteer[1] = Address\n volunteer[2] = phone number\n\
  ```\n\n\n\n\n\n\n`IFS` 是第 2 章中详细介绍的概念，但在接下来的示例中将使用它，以便让你了解它的用法。如果你熟悉电子表格输出的 `.csv`（逗号分隔值）文本输出，那么这些文件中的逗号就是\
  \ `IFS`。如果你在以逗号作为 `IFS` 创建的 Excel 表格或或 Google 文档中打开登录列表，你将会看到 A 列 = 名称，B 列 = 地址，C\
  \ 列 = 号码，每行代表一个独立的志愿者。\n\n\n`bash` 的语法与其他编程语言有很大不同，因此有必要通过几个示例来探索其行为。\n\n### 列表\
  \ 1.4. array1.sh\n\n```bash\n#!/bin/bash\n## method #1:\nfruits[0]=\"apple\"\nfruits[1]=\"\
  banana\"\nfruits[2]=\"cherry\"\nfruits[3]=\"orange\"\nfruits[4]=\"pear\"\necho \"\
  first fruit: ${fruits[0]}\"\n### method #2:\ndeclare -a fruits2=(apple banana cherry\
  \ orange pear)\necho \"first fruit: ${fruits2[0]}\"\n\n### range of elements:\n\
  echo \"last two: ${fruits[@]:3:2}\"\n\necho \"substring: ${fruits[1]:0:3}\"\n\n\
  arrlength=${#fruits[@]}\necho \"length: ${#fruits[@]}\"\n```\n\n列表 1.5 显示了 `names.txt`\
  \ 的内容，列表 1.6 显示了 `array-from-file.sh` 的内容，后者包含一个 `for` 循环，用于遍历数组元素，其初始值基于 `names.txt`\
  \ 的内容。\n### 列表 1.5. names.txt\n\n```\nJane Smith\nJohn Jones\nDave Edwards\n```\n\
  ### 列表 1.6. array-from-file.sh\n```bash\n\nnames=\"names.txt\"\ncontents1=( `cat\
  \ \"$names\"` )\n\necho \"First loop:\"\nfor w in \"${contents1[@]}\"\n  echo \"\
  $w\"\ndone\n\nIFS=\"\"\nnames=\"names.txt\"\n\necho \"Second loop:\"\nfor w in \"\
  ${contents1[@]}\"\ndo\n  echo \"$w\"\ndone\n```\n列表 1.6 使用 `cat` 命令的命令替换来初始化数组变量\
  \ `contents1`，然后通过循环显示数组 `contents1` 的元素。第二个 `for` 循环与第一个 `for` 循环的代码相同，但这次 `IFS`\
  \ 的值等于 \"\"，效果是使用换行符作为分隔符，每行一个数据元素。\n\n运行列表 1.6 中的代码，你将看到以下输出：\n\n```\nFirst loop:\n\
  Jane\nJohn\nJones\nDave\nEdwards\nSecond loop:\nJane Smith\nJohn Jones\n```\n\n\
  列表 1.7 显示了 `array-function.sh` 的内容，该脚本演示了如何初始化数组然后在用户定义的函数中显示其内容。\n\n### 列表 1.7.\
