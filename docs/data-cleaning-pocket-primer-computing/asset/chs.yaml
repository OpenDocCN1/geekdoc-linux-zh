  \ # => 计算多个文件的列平均值（反引号）\n#columns in rain.csv:\n#DOW,inches of rain, degrees F,\
  \ humidity (%)\n#指定 CSV 文件列表（支持多个正则）\nfiles=`ls rain*csv zain*csv`\necho \"FILES:\
