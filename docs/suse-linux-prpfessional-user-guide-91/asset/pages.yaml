    # 4.4.2 Printer


    A Linux system manages printers through printer queues. Before any data is printed,
    it is sent to a printer queue for temporary storage. From there,'
  merge: -1
  pgno: 89
- img_proc: true
  md: '# 4 YaST — Configuration


    it is retrieved by a print spooler, which sends it to the printer device in the
    required order.


    However, for the most part this data is not available in a form that can be processed
    by the printer. A graphical image, for instance, first needs to be converted into
    a format the printer can understand. This conversion into a printer language is
    achieved with a printer filter, a program called by the print spooler to translate
    data as needed, the printer can handle it.


    # Some Standard Printer Languages


    +   - ASCII text


    Every normal printer should at least be able to print ASCII text directly. However,
    there are devices that cannot print ASCII text directly, but are able to handle
    one of the standard printer languages mentioned below.


    +   - PostScript


    PostScript is the established printer language on Unix and Linux systems. Many
    programs produce PostScript output that can then be printed by a PostScript printer.


    +   - PCL3, PCL4, PCL5e, PCL6, ESC/P, ESC/P2, and ESC/P raster


    If a PostScript printer is not available, the print filter can use the Ghostscript
    to convert PostScript data into one of these other standard printer languages.
    Ghostscript uses different drivers for different printers to make use of specific
    features, such as color settings, offered by the various models as much as possible.


    # Processing a Print Job


    +   1. The user or an application generates a new print job.


    +   2. The print data is temporarily stored in the print queue. The print spooler
    sends it from there to the printer filter.


    +   3. Now the print filter performs the following steps:


    +   (a) It determines the type of print data.


