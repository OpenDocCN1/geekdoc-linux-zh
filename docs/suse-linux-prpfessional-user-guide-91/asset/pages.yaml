  md: '# Example 2.1: /etc/fstab: Partition Data


    | /dev/sda1 | /data1 auto | noauto,user 0 0 |

    | /dev/sda8 | /data2 auto | noauto,user 0 0 |


    The partitions, regardless of whether they are Linux or FAT partitions, are specified
    with the options noauto and user. This allows any user to mount or unmount these
    partitions as needed. For security reasons, YaST does not automatically mount
    them except the exec option here, which is needed for executing programs from
    the respective location. However, to run programs from there, you can enter this
    option manually. This measure is necessary if you encounter system messages such
    as bad interpreter or Permission denied.


    Detailed background information and tips for partitioning are provided in the
    Administration Guide.


    # 2.5.6 Software


    SUSE LINUX contains a number of software packages for various application purposes.
    As it would be burdensome to select the needed packages by one one, SUSE LINUX
    offers three system types with various installation scopes. Depending on the available
    disk space, YaST selects one of these basic systems and displays it in the suggestion
    screen.


    +   - Minimum System (only recommended for special purposes)

    This installs the operating system with various services without the graphical
    user interface. The machine can only be operated by way of the ASCII consoles.
    This system type is especially suitable for server applications requiring direct
    user interaction.


    +   - Minimum Graphical System (without KDE)

    If you do not want the KDE desktop or if the disk space is insufficient, install
    this system. The installed system includes an elementary graphical user interface
    with terminal windows, but no real desktop with the usual functionality. You can
    use all programs that have their own graphical user interfaces (such as Netscape).
    No office programs are installed.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# Default System (with KDE and office package)


    +   - Default System


    This is the largest of all offered basic systems. It contains the KDE desktop
