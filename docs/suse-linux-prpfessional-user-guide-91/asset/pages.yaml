    # 2.5.10 Launching the Installation


    When satisfied with the installation settings, click ''Next'' to begin the installation.
    Confirm with ''Yes'' in the green dialog that opens. Installation usually takes
    between fifteen and thirty minutes, depending on system performance and the software
    selected.


    # 2.6 Finishing the Installation


    After completing the basic system setup and the installation of all selected software
    packages, provide a password for the account of the system administrator (the
    root user). Then configure your Internet access and network connection. With a
    working Internet connection, it is possible to update the system with security
    patches and software updates during. If desired, configure a name server for centralized
    user administration in a local network. Also configure any hardware devices, such
    as printers and scanners.


    # 2.6.1 root Password


    root is the name of the superuser, the administrator of the system. Unlike regular
    users, which may or not have permission to do certain things on the system, root
    has unlimited power to do anything; change the system configuration, install programs,
    and set up new hardware. If users forget their passwords or have other problems
    with the system, root can help. The root account should only be used for system
    administration, maintenance, and repair. Logging in as root for daily work is
    rather risky: a single mistake could lead to many system files being irretrievably
    lost.


    Figure 2.13 on the facing page shows the relevant dialog. For verification purposes,
    the password for root must be entered twice. Do not forget the root password.
    It cannot be retrieved later.'
