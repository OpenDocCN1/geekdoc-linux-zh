    the ISDN driver when the system is booted. With ‘Manual’, the ISDN driver must
    be initialized manually by the user root with rcisdn start. ‘Hotplug’ loads the
    driver when the PCMCIA card or USB device is connected. Complete all settings
    and click ‘OK’.


