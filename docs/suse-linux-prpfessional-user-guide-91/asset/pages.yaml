  md: 'the provider, and the provider’s phone number. Furthermore, enter the user
    name and the password assigned by your provider. Activate ‘Always ask for password’
    to be prompted for the password every time a connection is established.


    Enter the connection parameters in the final dialog:


    Dial-on-Demand’ Refer to Section 4.5.1 on page 96. Enter at least one name server
    to use dial-on-demand.


    Modify DNS when Connected This check box is activated by default. Accordingly,
    the name server is adjusted each time a dial-up connection is established. Deactivate
    this and specify static name servers for ‘Automatic Dial-Up’.


    Stupid Mode’ This option is activated by default. Input prompts by the dial-up
    server are ignored to facilitate the establishment of the connection.


    Activate Firewall’ Here, activate the SUSE Firewall to implement protection against
    intruders when connected to the Internet.


    Idle Time (seconds)’ Here, specify the period after which the connection should
    be terminated if there is no data transfer.


    IP Details With this button, enter the address configuration dialog. If your provider
    has not assigned a dynamic IP address, deactivate ‘Dynamic IP Address’ and enter
    the local IP address of your host and the remote IP address. Contact your provider
    for information about these settings. Leave the ‘Default Route’ setting active
    and exit the dialog with ‘OK’.


    Press ‘Next’ to return to the overview and view the configuration with ‘Finish’.


    # 4.5.4 DSL


    The YaST module ‘DSL’ in the category ‘Network Devices’ is designed for the configuration
    of DSL. Several dialogs enable you to enter the data for your DSL access. YaST
    supports the configuration of DSL based on the following protocols:


    +   - PPP over ethernet (PPPoE) — Germany'
  merge: -1
  pgno: 119
- img_proc: true
  md: '+   PPP over ATM (PPPoATM) — England


    +   CAPI for ADSL (Fritz cards)


    +   Tunnel protocol for point-to-point (PPTP) — Austria


    The configuration of your DSL access with PPPoE and PPTP is only possible if your
    network card is configured correctly. If this has not been done, select ‘Configure
    Network Cards’ to access the dialog for configuring your network card. See Figure
    4.5.2 on page 96. The DHCP protocol is not used for the automatic setup of IP
    addresses for DSL. Therefore, do not use ‘Automatic address setup (with DHCP)’.
    Instead, use a dummy IP address like 192.168.22.1. In ‘Subnet mask’, enter 255.255.255.0.
    For a stand-alone system, do not make any entries in the ‘Default gateway’ field.


    > Note values for the ‘IP address’ of your host and ‘Subnet mask’ are merely placeholders.
    They are not used for establishing a connection with DSL and are only needed for
    activating the network card.


    At the beginning of the configuration, as shown in Figure 4.18 on the following
    page, select the PPP mode and the ethernet card to which your modem is connected
    (usually eth0). With ‘Device Activation’, determine whether the DSL connection
    should be established automatically when the system is booted or established manually.
    Subsequently, select your country and provider. The contents of the following
    dialogs depend on the previously selected settings. If you are not sure about
    some options, read the detailed help texts in the dialogs.


    To use ‘Dial on demand’ (see Section 4.5.1 on page 96) for a stand-alone system,
    configure a DNS server. Today, most providers support dynamic DNS assignment,
    so a valid IP address of the name server is provided each time a connection is
    established. Nevertheless, a suitable dummy DNS must be entered in this dialog,
    such as 192.168.22.99. If you are not dynamically assigned a name server, specify
    the IP addresses of your provider’s name server here.


    Idle time-out (seconds)’ allows you to set an idle time after which the connection
    is terminated automatically. A value between 60 and 300 seconds is recommended.'
