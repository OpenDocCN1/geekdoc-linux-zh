  md: '# Scheduling with KOrganizer


    KOrganizer is a KDE application for scheduling and managing events and tasks.
    Because of the variety of ways in which the program can present your schedule,
    it is a very helpful tool for keeping track of deadlines, outstanding tasks, and
    appointments. It can also remind you of birthdays and meetings, if you enable
    this function.


