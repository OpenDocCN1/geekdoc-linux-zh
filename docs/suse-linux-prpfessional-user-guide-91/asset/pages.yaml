    # 7.7 Spreadsheets with OpenOffice.org Calc


    Calc is the spreadsheet module of OpenOffice.org. Use this application, for example,
    to handle your private or business accounting data. If Writer is already running,
    start Calc by selecting ''File'' -> ''New'' -> ''Spreadsheet''.


    After starting, Calc presents an empty spreadsheet divided into rows and columns.
    Rows are numbered from top to bottom and columns are lettered from left to right.
    The intersection of a row and a column marks the location of a cell, so each cell
    has a unique address coordinate. For instance, the address B3 refers to the second
    column (B) and the third row. This is also shown at the top to the left of the
