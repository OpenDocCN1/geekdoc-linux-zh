    # 17.5 Calendar


    # 17.5.1 Adding Appointments


    To add a new appointment to your calendar, click ''New Appointment''. Under the
    ''Appointment'' tab, enter the details for the appointment. Select a category,
    if desired, to searching and sorting later. Optionally set for Evolution to provide
    a reminder before your appointment under the ''Reminder'' tab. If the appointment
    occurs regularly, set under ''Recurrence''. Click ''Save and Close'' after all
    settings are made. The new appointment is then shown in your calendar.


    # 17.5.2 Scheduling a Meeting


    To schedule a meeting with other people, click ''New Appointment'' then select
    ''Actions'' -> ''Schedule Meeting''. Enter information for an appointment. Under
    ''Meeting'', add attendees. For those in ''Contacts'', click ''Invite Others...''
    and select attendees from the dialog. When finished, click ''Save and Close''.
    The attendees will be sent an e-mail about the scheduled meeting.'
  merge: -1
