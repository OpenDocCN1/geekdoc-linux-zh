    These guidelines can help develop a partitioning scheme for your system:


    +   - Under 500 MB:

    A swap partition and a root partition (/).

    - Between 500 MB and 4 GB:

    A small boot partition located within the first cylinders of the hard disk (/boot,
    at least 8 MB or 1 cylinder) to hold the kernel and the boot loader. Also create
    a swap partition of approximately 256 MB then use the rest for the root partition
    (/).

    - For more than 4 GB:

    Boot (/boot), swap, root (250 MB), home directories (/home) with about 200 MB
    for each user, and the rest for programs and data (/usr). You may also reserve
    an extra partition for /opt and /var.


    Some commercial programs install their data in /opt. If necessary, create a separate
    partition for /opt or make the root partition large enough. KDE and GNOME are
    also installed in /opt.


    > Note

    Things would be fine if your partitioning setup is similar to that proposed by
    YaST. This is usually a small partition for /boot at the beginning of the hard
