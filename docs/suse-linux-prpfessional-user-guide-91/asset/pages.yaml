  md: '# 5.1.5 The Panel


    The panel at the lower edge of the screen consists of several areas. By default,
    the icon for the main menu is located to the far left. Other icons are lined alongside
    it. The house icon provides quick access to your home directory with all subdirectories.
    The other icons start applications, such as OpenOffice.org, K-Mail, and the web
    browser Konqueror, if these programs were installed.


    Next to these are the numbered buttons with which to switch desktops. These multiple
    desktops enable you to organize your work if you use many programs simultaneously,
    as if you had several desks for various tasks.


    The taskbar is located next to the virtual desktops. All started applications
    are displayed in the taskbar. If you click a window title in the taskbar, the
    application is moved to the foreground. If it is already in the foreground, minimizing
    the application. If you click it, it reopens. Next to the taskbar, find applets,
    such as the clipboard Clipper, SuSEWatcher, and any other applications you have
    started. The clock keeps you track of the time.


    If you right-click an empty space in the panel, a menu providing the usual help
    and configuration options for the panel is displayed. Use the menu to change the
    size of the panel and add and remove applications. To add an application, search
    for the respective application in the menu and select it. Remove applications
    or applets by right-clicking the corresponding icon and selecting ''Remove'' from
    the displayed menu.


    # 5.1.6 The Main Menu


    Access the main menu by means of the icon to the far left of the panel. By default,
    this menu contains entries for logging out from the system, locking the screen,
    executing commands, and starting the quick browser and the bookmark manager. Use
    the file manager to display your home directory, search for files, or start the
    Control Center for the purpose of customizing the desktop. The other menu entries
    allow you to start a variety of programs sorted by subjects. The following section
    provides information about selected functions that you can start by means of the
    main menu. Detailed information about the Control Center is available in Section
    5.2 on page 141.


    Logout User You can log out from the system by means of this menu item. However,
    first you will be asked what should happen after the'
