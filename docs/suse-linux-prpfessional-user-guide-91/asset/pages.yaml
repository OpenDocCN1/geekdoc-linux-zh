    # ### Configuration with YaST


    To set up a printer, go to ''Hardware'' in the YaST Control Center then select
    ''Printer''. This opens the main printer configuration window in which the detected
    devices are listed in the upper part. The lower part lists queues already configured.
    If your printer was not detected, restart the autodetection. If it fails again,
    select ''Configure'' to configure the printer manually. Not every printer can
    be configured for both printing systems. Certain configurations are only supported
    by either CUPS or LPRng and lpdfilter. YaST informs you about this whenever necessary.


    > Note

    In SUSE LINUX, the default printing system is CUPS, but you can switch from CUPS
    to LPRng and back at any time. To do so, select ''Change'' > ''Advanced'' in the
    YaST printer configuration module. Then select either printing system and configure
    it.


    # ### Automatic Configuration


    YaST configures the printer automatically if these requirements are met:


