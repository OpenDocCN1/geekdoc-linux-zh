  md: '# Encryption with KGpg


    KGpg is an important component of the encryption infrastructure on your system.
    With the help of this program, generate and manage all needed keys, use its editor
    function for the quick creation and encryption of files, or use the applet in
    your panel to encrypt or decrypt by dragging and dropping. The generation and
    management of keys is required for other applications, such as KMail or Konqueror,
    to handle encrypted files or e-mail messages correctly. This chapter covers the
    basic functions needed for daily work with encrypted files.


    +   15.1 Key Management . . . . . . . . . . . . . . . . . 250

    15.2 The Key Server Dialog . . . . . . . . . . . . . . . . 253

    15.3 The Applet . . . . . . . . . . . . . . . . . . . 255

    15.4 For More Information . . . . . . . . . . . . . . 256'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# 15.1 Key Management


    This section covers operations needed for handling your digital key ring. Other
    programs, such as your mail program (KMail or Evolution), access the managed key
    data to process signed or encrypted contents.


    # 15.1.1 Generating a New Key Pair


    To be able to exchange encrypted messages with other users, first generate your
    own key pair. One part of it — the public key — is distributed to your communication
    partners, who can use it to encrypt the files or e-mail messages they send. The
    other part of the key pair — the secret key — is used to decrypt the encrypted
    contents.


    > Note The public key is intended for the public and is distributed to all of
    your communication partners. However, only you should have access to the secret
    key. Do not grant other users access to this data.


    Start KGPG from the main menu or with the command kpg command line. A padlock
    icon for KGPG appears in your panel. Click the icon to open the function menu.
    Select ''Open key manager''. Refer to Figure 15.1. Under ''Key'', access all options
    related to the generation or management of keys. To generate a new key pair for
    yourself, click ''Generate Key Pair'' (**Ctrl + N**).


    ![](img/705a076b108ea96be0c0695efb5556ce_269_0.png)


    Figure 15.1: The Key Manager'
  merge: -1
  pgno: 269
- img_proc: true
  md: '# 15


    In the following dialog, shown in Figure 15.2, enter your user name, your e-mail
    address, and an optional comment. The default setting for ''Expiration'' (Never
    — key pair is valid for an indefinite period) can be accepted unless you want
    your keys to expire after a certain time. The default settings for ''Key size''
    and ''Algorithm'' can be accepted as they are. Now, start the key generation with
    ''OK''. After this process is completed, the newly generated key appears in the
    overview window of the key manager.


    Encryption with GPG


    ![](img/705a076b108ea96be0c0695efb5556ce_270_0.png)


    Figure 15.2: Generating Keys


    # 1.1.2 Exporting the Public Key


    After generating your key pair, make the public key available to other users.
    This enables them to use it to encrypt or sign the messages or files they send
    you. To make the public key available for others, select ''Keys'' -> ''Export
    Public Key''. The dialog that opens offers three options:


    Export Public Key To Email Your public key is sent to a recipient of your choice
    by e-mail. If you activate this and confirm with ''OK'', the dialog for creating
    a new e-mail message with KMail appears. Enter the recipient and click ''Send''.
    The recipient will receive your key and can then send you encrypted contents.


    SUSE LINUX – User Guide 251'
