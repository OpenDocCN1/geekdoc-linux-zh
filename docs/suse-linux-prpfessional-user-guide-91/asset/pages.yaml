- img_proc: true
  md: 'Enable Sticky Keys Some keyboard shortcuts require that one key is kept pressed
    constantly (this applies to Alt, Ctrl or Shift) while the rest of the shortcut
    is typed. When “sticky” keys are used, the system regards those keys as pressed
    after hitting once. For an audible feedback each time a modifier key (Ctrl or
    Alt) is pressed, activate ‘Beep’ when modifier is pressed. If ‘Disable’ if two
    keys pressed together’ the keys do not stick anymore once two keys are pressed
    simultaneously. The system then assumes that the keyboard shortcut has been completely
    entered.


    Repeat Keys Activate ‘Repeat Keys’ to make settings for sliders for ‘Delay’ and
    ‘Speed’. This determines how long a key must be pressed for the automatic keyboard
    repeat function to be activated and at what speed the characters are then typed.


    Test the effect of the settings in the field at the bottom of the dialog window.
    Choose parameters that reflect your normal typing habits.


    Enable Slow Keys To prevent accidental typing, set a minimum limit that a key
    must be pressed and held before it is recognized as valid input by the system.
    Also determine whether audible feedback should be provided for keypress events,
    accepted keypresses, and the rejection of a keypress.


    Enable Bounce Keys To prevent double typing, set a minimum time limit for accepting
    two subsequent keypress events of the same key as the input of two individuals
    characters. If desired, activate audible feedback upon rejection of a keypress
    event.


    Toggle Keys It is possible to request audible feedback from the system when a
    keycap modifier is pressed.


    Mouse Activates the keyboard mouse — the mouse pointer is controlled with the
    arrow keys of the number pad. Use the sliders to set the maximum speed of the
    mouse pointer, the acceleration time until the maximum speed is reached, and the
    latency between the pressing of a key and the cursor movement.


    # 6.2.10 Keyboard Shortcuts


    Use this module to manage global keyboard combinations. It is possible to determine
    the keyboard combinations to use during text input and those objects on the desktop.'
  merge: -1
