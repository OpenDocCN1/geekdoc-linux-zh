  md: '# 7.1 The Quickstarter


    When started for the first time from the main menu (''Applications'' -> ''Accessories''
    -> ''More'' -> ''OpenOffice.org Quickstarter''), you will be asked whether the
    quickstart function of the program should be enabled. If you intend to use OpenOffice.org
    frequently and have enough RAM available, it can be useful.


    ![](img/705a076b108ea96be0c0695efb5556ce_205_0.png)


    Figure 7.1: The OpenOffice.org Quickstarter


    The Quickstarter icon appears in the desktop panel at the lower right edge of
    the screen. Right-clicking it displays a menu like the one shown in Figure 7.1,
    which gives access to a number of possibilities: directly start the individual
    OpenOffice.org application modules, quickly reopen the recently used files, create
    a new document from a template. Customize the Quickstarter settings by selecting
    ''Configure OpenOffice.org Quickstarter...''


    Once enabled, the Quickstarter is started automatically each time you log in to
    your desktop. To stop this from happening in the future, click ''Quit'' in the
    Quickstarter menu, shown in Figure 7.1.'
  merge: -1
