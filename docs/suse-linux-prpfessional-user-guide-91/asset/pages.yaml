    click. If you activate ‘Also Use SMB Information for Linux Authentication’, user
    authentication is conducted via the Samba server. After specifying all settings,
    click ‘Finish’ to complete the configuration.


    # 4.6.5 NTP Client


    NTP (Network Time Protocol) is a protocol for synchronizing the clocks of network
    hosts. In the respective YaST module, select a type with ‘Add’.'
