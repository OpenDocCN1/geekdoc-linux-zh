    Others prefer moving their complete forearm.


    +   - An alternative to the mouse is a track. Here, you move a ball inside a stationary
    casing to control the mouse pointer. In contrast to the mouse, the controll reduces
    the movements in the hand and arm.


    # 26.3 Links and Literature


    A great manual for staff members and superiors with many checklists and questionnaires
    that also take the mental strain into account: Burmester, M., Görner, C., Hacker,
    W., Kärcher, M. and others (1997). The SANUS Manual.'
