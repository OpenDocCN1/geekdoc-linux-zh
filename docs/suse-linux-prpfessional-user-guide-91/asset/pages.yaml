  md: '# 16.1 KMail and Kontakt


    KMail can be displayed along mbox with other applications in one window. This
    is done with the Kontact utility. Refer to 5.4.10 on page 164 for more details
    about this.


    # 16.2 Mail Formats


    KMail can save messages in the following formats:


    **mbox** This traditional UNIX format (the oldest) saves all messages in a single
    file. Directories are also simulated by means of individual files. The individuals
    mail can only be distinguished by the From line.


    MailDir In contrast to the mbox format, the MailDir format has a unique file name
    for every message. The messages are stored in the respective directories and can
    easily be identified and further processed. KMail uses the MailDir format (as
    the more convenient alternative) by default, but MailDir is not supported by many
    other e-mail programs. This can be a disadvantage if you want to switch to a different
    e-mail program later and still access your old e-mails. Processing old mails in
    mbox format is no problem, however, if you select MailDir. Just copy or move the
    files to the MailDir folder.


    # 16.3 Access Types


    KMail allows you to access your electronic mail in various ways. The access type
    largely depends on your Internet Service Provider (ISP) or mail server. The main
    access types are POP3 and IMAP.


    POP3 (Post Office Protocol Version 3)


    POP3 is a standardized procedure for receiving e-mail. A POP3 server stores the
    messages until the user retrieves them with a POP3 client (in this case, KMail).
    This method is used frequently by Internet Service Providers (ISPs).


    IMAP (Internet Message Access Protocol)


    With IMAP, e-mail messages can be received and administered on'
  merge: -1
  pgno: 277
- img_proc: true
  md: '# 16


    the server without downloading them to the hard disk. This is often used in internal
    networks as it allows access to mail from different computers.


    # Configuring KMail


    When KMail is started for the first time, a Mail folder is added to your home
    directory. This folder contains some basic mail directories (inbox, outbox, drafts,
    and trash). Go to ''Settings'' -> ''Configure KMail...'' to enter the information
    needed for sending and receiving messages. All configuration options can be accessed
    under ''Configure KMail'' (wrench icon).


    # 16.4.1 Defining Your User Identity


    You can manage several e-mail addresses (e.g., your private e-mail address and
    your business address) with KMail. Select from the defined identities when writing
    e-mail. To create a new identity profile, select ''New...'' and enter a name for
    the profile, such as ''Private'' or ''Office''.


    Click ''OK'' to proceed to a dialog in which some additional information. Under
    ''General'', enter your name, organization, and e-mail address. Under ''Advanced'',
    enter your OpenPGP key, specify a default BCC field or reply-to-address, and determine
    the folder in which your messages should be stored. Under ''Signature'', define
    a signature to use for every message. To use this feature, select ''Enable signature''.
    Insert the signature from a file, an input field, or a command output. Confirm
    your profile settings with ''OK''.


    # 16.4.2 Setting up Network Connections


    The settings under ''Network'' (in the ''Configure KMail'' menu) instruct KMail
    how to receive and send e-mail. There are two tabs, one each for sending and receiving
    mail. Many of these settings depending on the system and network in which your
    mail server is located. If you are not sure about the objects or items to select,
    consult your Internet service provider or system administrator.


    Sending Create outgoing mailboxes under the ''Send'' tab. ''Add'' gives the choice
    of either SMTP or sendmail. For most purposes, select SMTP'
  merge: -1
