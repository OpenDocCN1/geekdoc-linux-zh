  md: '# 25.1.3 Bash Functions


    There are two important functions of the shell that can make your work a lot easier:


    +   - The history function — Repeat a command that has been entered before, pressing
    Up until the previous command appears at the prompt. Move forward through the
    list of previously entered commands by pressing Down. To edit the command line,
    just move the cursor to the desired position using the arrow keys and start typing.
    Use Ctrl+R to search in the history.

    - The expansion function — Expand a name to its full length after typing its first
    letters until it can be uniquely identified. To do so, type the first letters
    then hit Tab. If there are several file names with the same letters, obtain a
    list of them by hitting Tab twice.


