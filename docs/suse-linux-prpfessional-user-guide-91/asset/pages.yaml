  md: '# 13


    # The Web Browser Galeon


    # The Web Browser Galeon


    Recently, the widely-used web browser has been transformed into a real jack-of-all-trades.
    The fact that today''s Internet applications feature such depth in integration
    and are heavily integrated into their corresponding desktop environments is almost
    taken for granted. Users of outdated machines soon feel the effects of this development.
    All-around browsers are often memory-eaters, sluggish in their operation, and
    occupy thirty megabytes on the hard disk.


    That is why the idea behind Galeon is to devote itself just to one assignment:
    the web and only the web. Galeon implements the speedy Gecko engine of the Mozilla
    browser and integrates this into a functional user interface. The application
    loads quickly and is one of the fastest browsers available.


    +   13.1 Optimized for the Web . . . . . . . . . . . . . . . . . . 238

    13.2 Efficient Surfing with Tabs . . . . . . . . . . . . . . . 239

    13.3 Smart Bookmarks . . . . . . . . . . . . . . . . . . . 239

    13.4 Settings and Controls . . . . . . . . . . . . . . . 239

    13.5 For More Information . . . . . . . . . . . . . . . . . . 239'
  merge: -1
  pgno: 256
