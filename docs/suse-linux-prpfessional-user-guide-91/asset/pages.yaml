  md: 'Select your monitor and graphics card. Usually, the monitor and graphics card
    are autodetected by the system. In this case, no manual settings are required.


    If your monitor is not autodetected, you will automatically be taken to the monitor
    selection dialog. Select your monitor from the extensive list of vendors or devices
    or manually enter the monitor values specified in the monitor manual. Alternatively,
    select one of the preconfigured VESA modes.


    After you click ‘Finish’ in the main window following the completion of the settings
    for your monitor and your graphics card, test your settings. This ensures that
    your configuration is suitable for your devices. If the image is not steady, terminate
    the test immediately by pressing (Esc) and reduce the refresh rate or color depth.
    Regardless of whether you run a test, all modifications are only activated when
    you restart the X server.


    # Display


    With ‘Edit configuration’ -> ‘Properties’, a window with the tabs ‘Monitor’, ‘Frequencies’,
    and ‘Expert’ appears.


    +   - ‘Monitor’ — In the left part of the window, select the vendor. In the right
    part, select your model. If you have floppy disks with Linux drivers for your
    monitor, install these by clicking ‘Driver disk’.

    - ‘Frequencies’ — Here, enter the horizontal and vertical frequencies for your
    screen. The vertical frequency is another designation for the image refresh rate.
    Normally, the acceptable value ranges are read from the model and entered here.
    Usually, they do not need to be changed.

    - ‘Expert’ — Here, enter some options for your screen. In the upper selection
    field, define the method to use for the calculation of the screen resolution and
    screen geometry. Do not change anything unless the monitor is addressed incorrectly
    and the display is not stable. Furthermore, you can change the size of the displayed
    image and activate the power saving mode DPMS.'
