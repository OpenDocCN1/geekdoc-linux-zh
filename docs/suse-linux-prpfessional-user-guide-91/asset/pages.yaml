  md: '# 2.6.7 Creating Local User Accounts


    When user accounts are created locally, any data related to user accounts (name,
    login, password, and so on) is stored and managed on this host. Linux is an operating
    system that allows several users to work on the same system at the same time.
    Each user needs a user account to log in to the system. By using user accounts,
    the system gains a lot in security. Regular users cannot change or delete files
    needed for the system to work properly. Similarly, the personal data of a given
    user cannot be modified, viewed, or tampered with by other users. Each user can
    set up his own working environment and find it unchanged when logging back in.


    ![](img/705a076b108ea96be0c0695efb5556ce_59_0.png)


    A user account can be created using the dialog shown in Figure 2.18. After entering
    the first name and last name, specify the user name (login). If you cannot think
    of a suitable user name, click ''Suggestion'' for the system to generate one automatically.


    Finally, enter a password for the user. Reenter it for confirmation (to ensure
    that you did not type something else by mistake). The user name tells the system
    who is a user and the password is used to verify this identity.'
  merge: -1
