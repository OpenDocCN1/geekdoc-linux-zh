- img_proc: true
  md: '# 17.1 Starting Evolution


    Start Evolution from the main menu or with evolution. When started for the first
    time, Evolution offers a configuration assistant. If it is not opened automatically,
    select ''Tools'' -> ''Settings'' -> ''Mail Accounts'' and click ''Add''. Click
    ''Next'' to access the assistant. Enter your name and your e-mail address in the
    respective fields. Additional addresses can be configured later. Click ''Next''.


    Select the appropriate e-mail format for this address in ''Server Type''. ''POP''
    is the most common format for downloading mail from a remote server. ''IMAP''
    works with mail folders on a special server. Obtain this information from your
    ISP or server administrator or other relevant fields displayed when the server
    type is selected. Click ''Next'' when finished.


    The next set of information to enter is mail delivery. This is used for all configured
    e-mail addresses. To submit outgoing e-mail on the local system, select ''Sendmail''.
    For a remote server, select ''SMTP''. Get the details from your ISP or server
    administrator. For SMTP, complete the other fields after selection. Click ''Next''
    when finished.


    By default, the e-mail address is used as the name to identify the account. Enter
    another name if desired. The field ''Make this your default account'' determines
    which account should be used as the default. The default account is the e-mail
    address initially selected for sending e-mail. Another account can be selected
    in the message composition window if desired. Click ''Next''.


    The time zone information from the next window is used for the calendar functions.
    It is important to select the correct time zone for using the appointment scheduling
    functions. Click the dot on the map for a city in your time zone. Selection zooms
    the display to that area and a change can be made if desired. When the correct
    time zone is displayed under ''Selection'', click ''Next''. In the next window,
    click ''Finish'' to save the data entered. Use ''Back'' to make changes.


    # 17.2 Importing E-Mail from Other Mail Programs


    Evolution can import e-mail from other e-mail programs, such as Netscape or KMail.
    To do so, select ''File'' -> ''Import...''. For KMail or mut,'
  merge: -1
