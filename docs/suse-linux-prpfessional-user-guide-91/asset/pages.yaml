- img_proc: true
  md: '# Export Public Key To Clipboard You can place your public key here before
    you continue to process it.


    # Export Public Key To File If you prefer to distribute your key as a file on
    a data medium instead of sending it by e-mail, click this option, confirm or change
    the path and name, and click ''OK''.


    To make your public key available to a wide audience, export it to one of the
    key servers on the Internet. For more information, refer to Section-15.2 on the
    facing page.


    # 15.1.3 Importing Keys


    If you receive a key in a file (for example, as an e-mail attachment), integrate
    it in your key ring with the feature ''Import Key'' and use it for encrypted communication
    with the sender. The procedure is similar to the procedure for exporting keys
    described above.


    # 15.1.4 Signing Keys


    Keys can be signed to guarantee authenticity and integrity. If you are absolutely
    sure an imported key belongs to the individual specified as the owner, express
    your trust in the authenticity of the key by means of your signature.


    > Note

    Encrypted communication is only secure to the extent that you can positively associate
    public keys in circulation with the specified user. By cross-checking and signing
    these keys, you contribute to the establishment of a trust.


    Select the key to sign in the key list. Select ''Keys'' -> ''Sign Key''. In the
    following dialog, designate the secret key to use for the signature. An alert
    reminds you to check the authenticity of this key before you sign it. If you have
    performed this check, click ''Yes'' and enter the password for the selected secret
    key in the next step. Other users can now check the signature by means of your
    public key.'
  merge: -1
