  md: '# Quick Installation


    In the best case, a few clicks are sufficient to install SUSE LINUX on your computer.
    If no Linux system was installed on your computer previously, your hard disk is
    partitioned, an installed Windows system is resized, a software selection is installed,
    and your hardware is configured automatically. If you do not like the suggestions
    of the system assistant YaST (Yet another Setup Tool) or have special requirements
    for your system, change the individual installation suggestions manually as described
    in Chapter 2 on page 11.


    +   - 1.1 Step One: The Start Screen . . . 6

    - 1.2 Step Two: Accept Suggestions . . . 6

    - 1.3 Step Three: Installation . . . 7

    - 1.4 Configuration . . . . . 7'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# 1.1 Step One: The Start Screen


    Turn on your computer and all connected hardware components and immediately insert
    CD 1 or the DVD in the respective drive. In the start screen, select an installation
    mode or boot an installed operating system. Following the successful installation,
    the CD only needs to be inserted in the drive occasionally to install additional
    software. As the CD can be forgotten during installation, the option to boot the
    installed system is preselected. For installation, use the arrow keys to select
    ''Installation''.


    > > Note

    > If your computer does not boot from CD 1 or the DVD, read Section 2.2 on page
    13.


    # 1.2 Step Two: Accept Suggestions


    After the system is booted from CD or DVD, the SUSE system assistant YaST is started.
    First, select the language for your system. The language setting is automatically
    adopted for the keyboard layout. Then YaST checks your system. If you already
    installed a SUSE LINUX version on your computer, the next dialog asks whether
    to install SUSE LINUX from scratch or perform an update of your previous system.


    If Linux was not installed on your computer previously or if you select ''New
    installation'', YaST checks all your hardware and list the result in the suggestion
    dialog, shown in Figure 1.1 on page 8. This dialog also displays the partitioning
    suggestion (possibly resizing) and the selected installation type. If installing
    Linux for the first time, accept these suggestions, which are usually suitable.


    The following messages and suggestions are displayed after the system check:


    +   - ''New installation'' is the default value here.


    +   - Keyboard The keyboard layout defaults to the selected language. This can
    easily be changed.


    +   - Mouse The detected mouse type is listed here.'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'Partitioning Suggests a suitable partitioning. If Windows 9x or ME (FAT32 file
    system) exists on the hard disk, the resizing rate is indicated.


    Software A default system with office applications is preset.


    Booting Determines where SUSE LINUX installs the boot manager. The Master Boot
    Record (MBR) of the first hard disk is the default setting.


    Time Zone Depending on the selected language settings, the time zone of the respective
    country is selected. Check this setting as many languages are used in several
    countries.


    Language Shows the language setting.


    Modify the YaST suggestions at any time by clicking the respective heading. The
    dialogs displayed enable detailed settings. The exact procedure is described in
    Chapter 2 on page 11. After the changes, you are returned to the overview and
    can proceed with the installation using the modified values by clicking ''Accept''.


    > Caution


    If the hardware was detected correctly, you do not need to change anything. Do
    not change the boot loader, partitioning, or hardware settings unless you know
    what you are doing.


    > Caution


    # 1.3 Step Three: Installation


    Before the installation begins, YaST asks in a green window whether to install
    with the current settings. Confirm the request with ''Yes'' to start the installation.
    Depending on the performance of your computer, installation of your system with
    a large selection of application packages takes approximately fifteen minutes.


    # 1.4 Configuration


    Following the installation, make some important settings before starting using
    SUSE LINUX (see Section 2.6 on page 34 for detailed instructions).'
  merge: -1
  pgno: 26
- img_proc: true
  md: '![](img/705a076b108ea96be0c0695efb5556ce_27_0.png)


    First, set a password for the system administrator (user `root`).This special
    user is always configured by YaST and is needed for system maintenance tasks.


    # Caution


    Remember the root password because you can only modify the system or install programs
    using the `root` identity.


    # Caution


    If a network card or other communication hardware (such as a modem or ISDN card)
    is found during the installation, these can now be configured and a connection
    can be established with the Internet or a local network (LAN). This enables use
    of various services during the remaining part of the procedure.


    For example, if you configure an Internet connection, you can perform an on-line
    update immediately. In this way, include the latest updates for your system.


    If you establish a connection with a local network, you can configure


    Figure 1.1: Suggestion Screen


    # 1.4. Configuration'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Quick installation


    name service such as NIS. YaST assumes that you will not manage any local users
    on your system.


    This is usually the case with commercial workstations, whose users are administered
    centrally (e.g., on a department server). If you do not configure a name service,
    set up local users intended for normal operations on the system.


    An additional hardware overview displays the detected screen, graphics card, and
