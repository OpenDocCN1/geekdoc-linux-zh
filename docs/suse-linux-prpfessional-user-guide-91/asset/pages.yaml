    +   - File System

    To format the partition immediately within the scope of the partition, specify
    one of the following file systems for the partition: ''Swap'', ''Ext2'', ''Ext3'',
    ''ReiserFS'', or ''JFS''.

    Swap is a special format that makes the partition use as virtual memory. Every
    system should have at least one swap partition of at least 128 MB (see note 2.5.5
    on the next page). ReiserFS is the default for Linux partitions. ReiserFS as well
    as JFS and Ext3 are journaling file systems. These file systems are to restore
    your system very quickly after a system crash, as processes are logged during
    the operation. Furthermore, ReiserFS is very fast in handling lots of small files.
    Ext2 is not a file system. It is rock solid and good for smaller partitions, as
    it does not require too much disk space for management.


