  md: '# ISDN Telecommunication


    Even in this age of the Internet and e-mail, traditional communication means like
    phone and fax are still important. The communication package-CapiSuite offers
    an ISDN-based solution for a computer-supported answering machine and fax.


    The following chapter explains how CapiSuite works. This is followed by a description
    of its configuration with YaST and a brief introduction to the usage of the system.


    +   18.1 Configuration . . . . . . . . . . . . . . . . . . 286

    18.2 Usage . . . . . . . . . . . . . . . . . . . . . . . 292'
  merge: -1
  pgno: 304
- img_proc: true
  md: 'CapiSuite is a daemon (a program that runs in the background) that provides
    basic telecommunication functions. The current version mainly offers functions
    for telephone and fax connections.


    For example, the system supports the establishment and termination of incoming
    and outgoing voice connections. Fax and audio files can then be sent and received
    over these connections. Some special functions, like the switching of a phone
    connection to a fax connection and the processing of DTMF (Dual Tone Multi Frequency
    — common touchhtone tones), are supported.


    However, the system does not constitute a complete application suite for certain
    tasks, such as an answering machine application. The actual application was written
    in the Python scripting language (a language especially suitable for beginners)
    and can thus be freely adjusted to your requirements. CapiSuite merely processes
    the provided scripts and executes the specified commands. This allows the creation
    of flexible solutions from a simple answering machine or fax program to a small
    call center (for which the system is still lacking some basic features).


    The CapiSuite package includes some ready-made scripts that enable a comfortable
    answering machine and fax solution. The following pages refer to the use of these
    scripts. Following the installation, details on the system as well as instructions
    for writing custom scripts are available in /usr/share/doc/packages/capisuite/manual/index.html
    and on the project page http://www.capisuite.de.


    # 18.1 Configuration


    CapiSuite makes use of the CAPI programming interface for ISDN hardware. Because
    this interface has only been available for Linux for a short time, suitable drivers
    are not yet available for all ISDN adapters. However, drivers are already available
    for ISDN adapters from AVM and can easily be installed and configured with YaST.
    Refer to the chapter on the ISDN configuration and the help texts of the


    YaST module for more information.


    Test the functionality of the CAPI driver by executing the command capinfo as
    the user root. If detailed information about the capabilities of the ISDN adapter
    is returned, the driver is installed correctly and CapiSuite can be installed
    and used.'
  merge: -1
  pgno: 305
- img_proc: true
  md: 'The CapiSuite package must be installed with YaST to be able to configure CapiSuite.
    More information about installing software is provided in the relevant section
    of the YaST chapter.


    # Caution —


    CapiSuite might not be included in the Personal Edition. This package is, in any
    case, available for download on the SUSE Internet servers. If needed, installation
    instructions are published on the web site of the CapiSuite project at http://www.capisuite.de.


    # Caution —


    Following the installation, YaST contains two modules for configuring the fax
    and answering machine functionality. These modules are described below.


    # 18.1.1 Configuring Fax Services


    The YaST module ‘Fax’ from the ‘Network Devices’ group contains a form with a
    user list and buttons for the processing of list entries. The list contains all
    the users already configured for the fax system. The CapiSuite scripts used here
    are multiuser and allow each user to send and receive faxes individually. The
    target number of an incoming call determines which user receives the fax. The
    list of this module is empty when it is started for the first time.


    If various users want to receive faxes with CapiSuite, it must be ensured that
    the associated phone numbers are all different and that all these numbers are
    also associated with the line to which the ISDN adapter is connected. This is
    of importance if you concurrently use an ISDN PBX.


    # Note —


    Use only the answering machine module if you intend to receive both fax messages
    and regular calls under one number, as this module includes the functionality
    for recognizing and receiving fax messages. See Section 18.1.2 over page 289.
    To be able to send fax messages, configure a suitable entry in the fax module,
    but leave the field for incoming numbers empty.


    # Note —


    Use the buttons under the list to edit or delete existing entries or create new
    entries. When editing or creating, a dialog opens in which to enter or modify
    the following data:'
