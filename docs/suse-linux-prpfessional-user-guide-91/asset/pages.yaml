- img_proc: true
  md: '# 7.2 Overview of the Application Modules


    OpenOffice.org comprises several application modules (subprograms), which are
    designed to interact with each other.


    Table 7.1: The OpenOffice.org Application Modules


    | Writer | Powerful word processor application |

    | --- | --- |

    | Calc | Spreadsheet application that includes a chart utility |

    | Draw | Drawing application for creating vector graphics |

    | Math | Application for generating mathematical formulas |

    | Impress | Application for creating presentations |


    The discussion in this chapter is focused on Writer and Calc. The other modules
    are only explained briefly. A full description of each module is available in
    the online help, described in Section 7.3).


    # 7.3 Getting Help


    Get help for OpenOffice.org at any time from the ‘Help’ menu. Depending on your
    selection, the depth and type of help provided vary. To get thoroughly acquainted
    with a topic, select ‘Help’ -> ‘Contents’. The help system provides information
    about each of the modules of OpenOffice.org (Writer, Calc, Impress, etc.).


    If you find this information too broad or overwhelming, try the ‘Help Agent’ instead,
    which offers help and tips as you perform different actions with OpenOffice.org.
    Select ‘Help’ -> ‘Help Agent’ to enable. If less information should be sufficient,
    try ‘Tips’ and ‘Extended Tips’. They enable the program’s tooltips — short information
    about the element to which the mouse is pointing. These items can easily be disabled
    later when you are more familiar with the program.'
  merge: -1
