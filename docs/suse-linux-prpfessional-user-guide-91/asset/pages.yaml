    If you have a SCSI CD-ROM drive, you need to change the setup of the SCSI BIOS.
    In the case of an Adaptec host adapter, for instance, open the setup by pressing
    Ctrl+A. After that, select ''Disk Utilities'', which displays the connected hardware
    components. Make a note of the SCSI ID for your CD-ROM drive. Exit the menu with
    Esc open ''Configuration Adapter'', select ''Boot Device Options'', enter the
    ID of the CD-ROM drive and press Enter again. Then press Enter twice to return
    to the start screen of the SCSI BIOS. Exit this screen and confirm with ''Yes''
    to boot.


    +   - Your CD-ROM drive may not be supported because it is an older model.


    # 2.2 The Boot screens


    ''From Hard Disk'' already the installed system. This item is selected by default
    because the CD is often forgotten in the drive. Select ''Installation'' with the
    arrow keys. This will load YaST and start the installation.


    The boot screen provides several options for starting from the CD. The options
    and the actions triggered by them are:


    +   - Boot from Hard Disk: Boots the system installed on the hard disk (the system
    normally booted when the machine is started). This option is preselected.


    +   - Installation: The normal installation mode. All modern hardware functions
    are enabled.


    +   - Installation — ACPI Disabled: If the normal installation fails, this may
    be due to lacking ACPI (Advanced Configuration and Power Interface) support of
    the system hardware. In this case, use this option to perform the installation
    without ACPI support.


    +   - Installation — Safe Settings: The DMA mode (for CD-ROM drives) and any critical
    power management functions are disabled. Experts can also use the command line
    to enter or change kernel parameters.'
