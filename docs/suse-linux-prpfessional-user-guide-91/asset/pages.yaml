- img_proc: true
  md: '> Note

    If you are not sure whether the features are active, open the ''Help'' menu. A
    checked menu item indicates that the corresponding help function is currently
    active.


    # 7.4 Converting Microsoft Office Documents


    OpenOffice.org is able to work with Microsoft Office documents. To convert such
    documents, select ''File'' -> ''AutoPilot'' -> ''Document Converter...''. Choose
    the file format from which to convert. After several StarOffice and Microsoft
    Office formats available. After selecting a format, click ''Next'' then specify
    which OpenOffice.org should look for documents to convert and in which directory
    the converted files should be placed. Before continuing, make sure all other settings
    are appropriate.


    > Note

    Documents from a Windows partition are usually in a subdirectory of /windows/.


    Click ''Next'' to see a summary of the actions to perform, which gives another
    opportunity to check whether all settings are correct. Finally, start the conversion
    by clicking ''Convert''.


    # 7.5 Changing the Global Settings


    Global settings can be changed by selecting ''Tools'' -> ''Options...''. This
    opens the window shown in Figure 7.2 on the facing page. A tree structure is used
    to display categories of settings.


    OpenOffice.org This entry covers various basic settings. This includes your user
    data, like your address and e-mail, import paths, and settings for printers and
    external programs.'
