    # 4.6.2 NFS Client and NFS Server


    You need these two tools only if you are located in a network. In this case, you
    have the possibility to operate a file server that can be accessed by members
    of your network. On this file server, you can make programs, files, or storage
    space available for users. Use the ''NFS Server'' module to set up your computer
    as an NFS server and determine the directories to export by the network users.
    The NFS server should be set up by an expert. To configure an NFS server, refer
    to the brief instructions in the Administration Guide.


    Subsequently, any user (with the needed permissions) can mount these directories
    in his own file tree. The easiest way to do this is by means of the ''NFS Client''
    module in which the user merely needs to enter the host name of the computer acting
    as NFS server and the mount point on his computer. To do this, select ''Add''
    in the first dialog and enter the needed data. See Figure 4.22.


