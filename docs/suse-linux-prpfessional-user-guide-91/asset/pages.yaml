- img_proc: true
  md: 'The recording of the personal welcome message is performed directly over the
    remote access feature of the answering machine. To access your answering machine
    remotely, call your associated number from any telephone. Enter the previously-defined
    PIN during the welcome message playback. Wait a few seconds if you mistype your
    PIN then try again after the beep. Shortly after having correctly entered the
    PIN, the answering machine gives the number of stored messages. You then have
    the choice of recording a new welcome message or listening to your stored messages.
    Follow the instructions given.


