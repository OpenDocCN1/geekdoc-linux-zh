    # 19.12 NoteEdit and MIDI Sequencers


    NoteEdit is one of the most comprehensive Linux applications for editing scores
    with a graphical interface. As the entered notes are sounded immediately by the
    selected MIDI device, even newcomers can easily prepare scores with NoteEdit.
    This program offers the entire range of music symbols for writing. With NoteEdit,
    even play and record MIDI files. The scores can be exported in several formats,
    including MusicTex and LilyPond.


    ![](img/705a076b108ea96be0c0695efb5556ce_347_0.png)


    > Figure 19.20: The Composition Editor NoteEdit


    Start the application with noteedit. A few examples can be found in /usr/doc/packages/noteedit/examples/,
    which can be opened with ''File'' -> ''Open''. Use ''TSE3'' -> ''TSE3 MIDI In''
    to import MIDI files. These are loaded into the editor with ''TSE3'' -> ''Score''.
    Set various options for the conversion in the ''Filter'' dialog box.


    ''Midi'' -> ''Devices'' allows selection of one of the ALSA MIDI devices configured
    in the system. This device is used for playback as well as for recording. The
    instrument, the MIDI channel, and many other parameters, such as the stereo panorama,
