    # 19.11.5 The MIDI Out Module


    The output of the MIDI events generated by a MIDI Out module is realized by the
    two readable MIDI ports of AlsaModularSynth in the left list of jackconnect. If
    several modules are used simultaneously, the MIDI events are merged accordingly.
    As both notation and controller events can be sent, the module can also be used
    to control all kinds of parameters via control voltage. To do this, the readable
    MIDI ports must be connected with the writable MIDI port. The example example_midout_controller.ams
    shows the change in an envelope with autogenerated controller events by opening
    the configuration dialog of the ENV module (ID 5) with the right mouse button.
    The option ''Follow MIDI'' in the ''Control Center'' should be deactivated while
    this patch is running.


    If you connect the readable MIDI ports of AlsaModularSynth with a MIDI sound generator,
    example_midout_note.ams plays scales controlled by an LFO. example_midout_note_velocity.ams
    shows that the velocity data can also be autogenerated. example_midout_random.ams
    generates random music with drums.


    # 19.11.6 Writing WAV Files with the WAV Out Module


    Using the WAV Out module, directly record the signals generated or processed by
    AlsaModularSynth as a WAV file in CD quality. In the configuration dialog of the
