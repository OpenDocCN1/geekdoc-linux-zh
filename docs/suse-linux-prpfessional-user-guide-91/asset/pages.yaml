    # 6.4.2 Managing Archives with File Roller


    In GNOME, manage file archives with File Roller. This application is applicable
    to handle archives of the following types: .tar, .tar.gz, .tgz, .tar.bz, .tar.bz2,
    .tar.z2, .zip, .lha, .rar, .lzh, .ear, .jar, and .war. Easily view archive contents
    from File Roller with other applications with File Roller supports drag and drop,
    without having to decompress the archives.'
