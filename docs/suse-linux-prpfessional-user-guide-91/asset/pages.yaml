  md: 'If you select the ‘Login as different user’, the login screen is displayed,
    allowing you or another user to log in to the system. You can also turn off or
    restart the computer. Confirm your selection with ‘OK’ or remain logged in by
    clicking ‘Cancel’.


    # Lock Screen


    If you leave your workstation, you can black your screen or start a screensaver.
    To restore the session view, enter your normal login password. In this way, make
    sure no one reads or manipulates your documents or e-mail messages.


    # Start New Session


    To start a second session with a graphical user interface on your machine, select
    ‘Start New Session’ from the main menu. Your current session remains active while
    you are taken to the login session. Log in. You can also start another window.
    Access the first session by pressing `Ctrl` + `Alt` + `F7`. Press `F8` instead
    of `F7` to access the new session. Additional sessions can be accessed by pressing
    `Ctrl` + `Alt` + `F9` to `F12`.


    # Run Command


    Enter a command in the dialog that opens. In this way, easily start applications
    whose name you know without having to navigate through the menu.


    # Bookmarks


    By this way, start the bookmark editor with ‘Edit Bookmarks’ to manage your bookmarks.
    If you select a bookmark from the menu, the browser starts and loads the desired
    URL.


    # Search


    ‘Search’ starts the program KFind. ‘Help’ to access the program manual, which
    provides information about all details. If you forget where a certain file is,
    enter it in the ‘Named’ field and start a search in your home directory. This
    default setting can be changed to a different directory, such as Documents, by
    clicking ‘Browse’. If you are not sure what the exact file name is, use wild cards.
    If you can remember that the file name contains the string blubb, simply enter
    *blubb*. This tells the program that blubb is preceded and followed by any characters.
    Use the tabs at the top left of the window to change to ‘Contents’ and ‘Properties’.
    In ‘Contents’, use ‘File type’ to limit the search to files or directories or
    for the content of the document. If you enter a keyword to find in ‘Containing
    text’, all texts containing this word are displayed. Click the desired file to
    load it directly. With ‘Save as...’, save the file under a new name in a different
    directory. The original file is retained. Search criteria can be specified for
    files that were modified or created recently or You can limit your search to files
    that belong to a specific user or group.'
  merge: -1
