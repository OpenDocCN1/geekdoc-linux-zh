  md: '# 4.5.5 ISDN


    This module enables the configuration of one or several ISDN cards in your system.
    If the ISDN card is not automatically detected by YaST, select the card manually.
    Theoretically, you can configure several interfaces. However, this is usually
    not necessary for home users, as providers can be configured for one interface.
    The following dialogs provide for the configuration of the various ISDN parameters
    for operating the card.


    The next dialog, shown in Figure 4.20 on the following page, is used for the ‘Selection’
    of ISDN protocol. The standard for Europe is ‘Euro-ISDN (EDSS1)’ (refer to scenarios
    1 and 2 below). ‘TR6’ is a protocol used by older or larger phone systems (refer
    to scenario 2 below). The standard setting for the US is ‘NII’. Select the country
    code from the selection box. In the adjacent input field, enter the area code
    for your location (e.g., 212 for New York). If necessary, enter the prefix for
    external calls.


