- img_proc: true
  md: 'The filter selection box is located at the top left under the menu bar. At
    start-up, the ''Selections'' filter is active. This filter groups the program
    packages by their application purpose, such as multimedia or office applications.
    The various groups of the Selections filter are listed under the filter selection
    box. The packages included in the selected system type are preselected. Click
    the respective check boxes to select or deselect entries for installation.


    The right right part of the window displays the individual packages included in
    the current selection. The leftmost table shows the current status of each package.
    Two status flags are especially relevant for the installation: Install (the box
    in front of the package name is checked) and Do Not Install (the box is empty).
    To select or deselect individual software packages, click the status box until
    the desired status is displayed.


    Alternatively, right-click the package line to access a pop-up menu listing various
    status options. However, the other status settings are not needed for the installation.
    They are described in detailed in Section 4.3.4 on page 59.


    # Other Filters


    Click the filter selection box to view the range of possible filters. The selection
    according to ''Package Groups'' can also be used for the installation. This filter
    sorts the program packages by subjects in a tree structure to the left. The more
    you expand the branches, the more specific the selection of packages is and the
    fewer packages that are displayed in the list of associated packages to the right.


    Use ''Search'' to search for a specific package. This is explained in detail in
    Section 4.3.4 on page 59.


    # Package Dependencies and Conflicts


    Instead of rewriting the same functions in each software package, programmers
    access the functions of other packages. For this reason, many packages require
    that other packages are installed for the programs to function. In rare cases,
    programs interfere with each other, causing conflicts. When selecting and deselecting
    software packages in this dialog, alerts about unresolved package dependencies
    or conflicts may be displayed. If you install SUSE LINUX for the first time or
    if you do not understand the alerts, read Section 4.3.4 on page 59, which provides
    detailed information about the operation of the package manager and a brief summary
    of the software organization in Linux.'
  merge: -1
