    the second drop-down menu. Enter `kde-user@kde.org` in

    the text field.


    +   6. In ''Filter actions'', select ''Move to Folder'' from the first drop-down

    menu. Select a second drop-down menu with the list of folders appears.

    Choose the folder to which the filtered messages should be moved if

    they meet the desired criteria. In this case, choose `kde-user` from the

