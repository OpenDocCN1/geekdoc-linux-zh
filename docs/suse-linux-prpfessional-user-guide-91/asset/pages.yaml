    # 19.11.3 AlsaModularSynth as a Synthesizer


    After using the MIDI patchbay to connect AlsaModularSynth with a master keyboard
    (keybd or an external keyboard), you can use the program as a synthesizer. If
    polyphony is not explicitly activated with the parameter --poly, AlsaModularSynth
    will be monphonic, just like its classical model. The envelope modules are triggered,
    as is often the case with analog synthesizers. This means that they are not restarted
    during legato play. This allows interesting phrasing. Multitriggering is activated
    by connecting the trigger output of the MCV module to the retrigger input port
    of the envelope module.


    A few LADSPA plug-ins greatly enhance the virtual analog sound of AlsaModularSynth.
    The plug-ins "Saw-VCO", "Mvclpf-3", "Mvclpf-4", and "Phaser1" by Anders deserve
    special attention. "Saw-VCO" is designed to resemble an analog saw-toothed wave
    generator. "Mvclpf-3" and "Mvclpf-4" are very realistic reconstructions of the
    filter cascade invented by R. A. Moog. These plug-ins represent a milestone in
    the digital reproduction of this legendary low-pass filter. An effect frequently
    featured


