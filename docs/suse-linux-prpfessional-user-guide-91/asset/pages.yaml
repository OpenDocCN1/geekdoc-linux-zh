    # 19.8 Compressing Audio Data


    Uncompressed audio data in CD quality consumes almost ten MB per minute. The MP3
    procedure was developed by Fraunhofer IIS for the purpose of drastically compressing
    data. Unfortunately, this procedure is patented. Therefore, companies that distribute
    MP3 encoders are required to pay license fees. The powerful MP3 encoder Lame is
    developed for Linux. Although the source code of Lame is under the GPL, SUSE is
    not allowed to include this encoder in our distribution. For more information
    about the legal situation, visit the project web page at http://lame.sourceforge.net.
    In some countries (including Germany and the USA), the use of Lame is permitted
    for research purposes only.


    Ogg Vorbis (package name vorbis-tools) is a free audio compression format that
    is now supported by the majority of audio players. The web page of the project
