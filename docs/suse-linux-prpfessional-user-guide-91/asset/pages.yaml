  md: '# 4.10 YaST2 in Text Mode (ncurses)


    YaST can also be controlled by means of a text-based terminal. This is especially
    useful in the case of systems that cannot run the X Window System or where X is
    unneeded, in dedicated server or firewall machines. It is also good for administrators
    remotely accessing a system.


    # 4.10.1 Controls


    The usage may be unfamiliar, but is very simple. Basically, the entire program
    can be controlled with `Tab`, `Alt` + `Tab`, `Space`, the arrow keys (↑) and (↓),
    and shortcuts. The YaST Control Center appears first, as shown in Figure 4.32.


    ![](img/705a076b108ea96be0c0695efb5556ce_148_0.png)


    Figure 4.32: The Main Window of YaST2 ncurses


    The left frame, which is surrounded by a thick white border, features the categories
    to which the various modules belong. The active category is indicated by a colored
    background. The right frame, which is surrounded by a thin white border, provides
    an overview of the modules contained in the active category. The bottom frame
    contains the buttons for ''Help'' and ''Exit''.


    When the YaST Control Center is started, the category ''Software'' is selected
    automatically. Use (↓) and (↑) to change the category. To start a module from
    the selected category, press (→). The module selection then appears with a thick
    border. Use (↓) and (↑) to select the desired module. Keep the arrow'
