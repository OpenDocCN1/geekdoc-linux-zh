- img_proc: true
  md: '# 24.3 Getting Started in GIMP


    # 24.3.1 Creating a New Image


    To create a new image, select ''File'' -> ''New'' or press Ctrl+N. This opens
    a dialog in which to make settings for the new image. If desired, use ''From Template''
    to select a template to base the new image. The GIMP includes a number of templates,
    ranging from an A4 size to a CD cover, from which to choose. To create a custom
    template, select ''File'' -> ''Dialogs'' -> Templates... and use the controls
    offered by the window that


    In the ''Image Size'' section, set the size of the image to create in pixels or
    another unit. GIMP defaults use inches as the other unit. Click the unit to select
    another unit from the list of available units. Changing the pixel size modifies
    the other size and vice versa. The ratio between pixels and a unit is in ''Resolution''.
    A resolution of 72 pixels per inch corresponds to screen display. It is sufficient
    for web page graphics. A higher resolution should be used for images to print.
    For most printers, a resolution of 300 pixels per inch results in an acceptable
    quality.


    In ''Image Type'', select whether the image should be in color ''RGB'' or ''grayscale''.
    For detailed information about image types, see Section 24.6.2 on page 371. Select
    the ''Fill Type'' for the new image. ''Foreground'' and ''Background'' use the
    colors selected in the toolbox. ''White'' uses a white background in the image.
    ''Transparent'' creates a clear checkerboard pattern. Enter a comment for the
    new image in ''Image Comment''.


    When the settings meet your needs, press ''OK''. To restore the default settings,
    press ''Reset'' aborts creation of a new image.


    # 24.3.2 Opening an Existing Image


    To open an existing image, select ''File'' -> ''Open'' or press Ctrl+O. In the
    dialog that opens, the current directory is listed above the center column. Available
    directories are listed in the left column. Double-click the directory to make
    it the current one .. moves up a level in the hierarchy.


    The center column shows the files available in the current directory. Click a
    file name to select it. If available, a preview of the selected file is shown
    in the right column. Alternatively, enter a name in the field towards the bottom.
    Press Tab while entering a name in the field attempts to'
  merge: -1
  pgno: 380
- img_proc: true
  md: 'complete the name. Available completions are then listed in the ''Folders''
    and ''Files'' columns. Select one or enter enough of the name to identify the
    file uniquely then press (Tab) again. Click ''OK'' to open the selected image.
    Press ''Cancel'' to skip opening an image.


    # 24.3.3 The Image Window


    The new or opened image appears in its own window. The menu bar of the top of
    the window provides access to all image functions. Alternatively, access the menu
    by right-clicking the image or clicking the small arrow-button the left corner
    of the rulers.


    ''File'' offers the standard file options, as ''Save'' and ''Print''. ''Close''
    closes the current image. ''Quit'' closes the entire application.


    With the items in the ''View'' menu, control the display of the image and the
    image window. ''New View'' opens a second window of the current image. Changes
    made in one view are reflected in all views of that image. Alternate views are
    useful for magnifying a part of an image for manipulation while seeing the complete
    image in another view. Adjust the magnification level of the current window with
    ''Zoom''. When ''Shrink Wrap'' is selected, the image window is resized to fit
    the current image exactly.


    # 24.4 Saving Images


    No image function is as important as ''File'' -> ''Save''. It is better to save
    too often than too rarely. Use ''File'' -> ''Save as'' to save with a new file
    name. It is a good idea to save image stages under different names or make backups
    in another directory so you can restore a previous state.


    When saving for the first time or using ''Save as'', a dialog opens in which a
    box centered above the two columns. Specify the file name and type. The current
    directory is shown in it. Select another directory by double-clicking it in ''Folders''.
    To save the image as an existing file, select it in ''Files''. Otherwise, enter
    a new name in the file at the bottom. It is recommended to leave ''Determine File
    Type'' set to ''By Extension''. With that setting, GIMP determines the file type
    based on the extension appended to the file name. The following file types are
    frequently useful:'
  merge: -1
  pgno: 381
- img_proc: true
  md: 'XCF This is the native format of The GIMP. It saves all layer and information
    along with the image itself. Even if you need an image in another format, it is
    usually a good idea to save a copy as XCF to simplify future modifications. Information
    about layers is available in Section 24.6.1 on page 370.


    PAT This is the format used for GIMP patterns. Saving an image in this format
    enables using the image as a fill in GIMP.


    JPG JPG or JPEG is a common format for photographs and web page graphics without
    transparency. Its compression method enables reduction of file sizes, but information
    is lost when compressing. It may be a good idea to use the preview option when
    adjusting the compression level. Levels of 85 percent to 75 percent often result
    in an acceptable image quality with reasonable compression. Saving a backup in
    lossless format, like XCF, is also recommended. If editing an image, save only
    the finished image as JPG. Repeatedly loading a JPG then saving can quickly result
    in poor image quality.


    GIF Although very popular in the past for graphics with transparency, GIF is also
    often used now because of license issues. GIF is also used for animated images.
    The format can only save indexed images. See Section 24.6.2 on page 371 for information
    about indexed images. The file size can often be small if only a few colors are
    used.


    PNG With its support for transparency, lossless compression, free ability, and
    increasing browser support, PNG is replacing GIF as the preferred format for web
    graphics with transparency. An added advantage is that PNG offers partial transparency,
    which is not offered by GIF. This enables smoother transitions from colored areas
    to transparent areas (aliasing).


    To save the image in the chosen format, press ''OK''. To abort, press ''Cancel''.
    If the image has features that cannot be saved in the chosen format, a dialog
    appears with choices for resolving the situation. Choosing ''Export'', if offered,
    normally gives the desired results. A window then opens with the options of the
    format. Reasonable default values are provided.'
  merge: -1
  pgno: 382
- img_proc: true
  md: '# # 24.5 Editing Images: Basics


    # ## 24.5.1 Changing the Image Size


    Once an image is scanned or a digital photograph is loaded from the camera, it
    is often necessary to modify the size for display on a web page or for printing.
    Images can easily be made smaller by scaling them or by cutting off parts of them.
    Making an image larger is much more problematic. Because of the nature of pixel
    graphics, quality is lost when an image is made larger. It is recommended to keep
    a copy of your original image before scaling.


    # ## Cropping an Image


    Cropping an image works like cutting the edges off a piece of paper. Select the
    crop tool from the toolbox (it resembles a scalpel) or with ''Tools'' -> ''Transform
    Tools'' -> ''Crop & Resize''. Click a starting corner and drag to outline the
    area to keep.


    Press ''Cancel'' to abort the crop. Press ''Crop'' to crop the image. The results
    of ''Resize'' are identical to those of ''Change Canvas Size'', described in Section
    24.5.1 on the facing page.


    # ## Scaling an Image


    Select ''Image'' -> ''Scale Image'' to change the size by entering it in ''New
    Width'' or ''New Height'' or by adjusting the ''Ratio''. To change the proportions
    of the image when scaling (this distorts the image), click the chain icon to the
    ratio fields to break the link between them. When those fields are linked, all
    values are changed proportionally when the value in one of the four fields is
    changed. When the link is broken, width and height can be adjusted independently
    of each other or the X and Y ratios can be adjusted individually.


    The values in the ''Print Size'' are independent of the pixel size. In that section,
    modify the image resolution by modifying the resulting image size'
  merge: -1
  pgno: 383
- img_proc: true
  md: 'when printed or modifying the resolution itself. Use the unit drop-down boxes
    to change the measuring unit.


    ''Interpolation'' is an expert option that controls the scale method. When finished
    adjusting the size, press ''OK'' to scale the image. ''Reset'' restores the original
    values. ''Cancel'' aborts the procedure.


    # Changing the Canvas Size


    Changing the canvas size is like putting a mat around an image. Even if the mat
    is smaller, the rest of the image is there, but you can only see part of it. If
    the mat is larger, you see the original image with extra space around it. To do
    this, select ''Image'' -> ''Canvas Size''.


    In the dialog that opens, enter the new size. By default, the width and height
    maintain the same proportions as the current image. To change this, click the
    chain icon to negate ''Ratio''. Enter the desired size in the height and width
    fields or adjust the ratios.


    After adjusting the size, determine how the existing image should be positioned
    in comparison to the new size. Use the offset values or drag the box inside the
    frame at the bottom. When satisfied with the changes, click ''OK'' to change the
    canvas size. Click ''Reset'' to restore the original values or ''Cancel'' to cancel
    the canvas resize.


    > The same results can be achieved using the ''Resize'' option of the crop tool.


    # 24.5.2 Selecting Parts of Images


    It is often useful to perform an image operation on only part of an image. To
    do this, the part of the image with which to work must be selected. Areas can
    be selected using the select tools available in the toolbox, using the quick mask,
    or combining different options. Selections can also be modified with the items
    under ''Select''. The selection is outlined with a dashed line, called marching
    ants.


    # Using the Select Tools


    The main select tools are rather easy to use. The paths tool, which can also be
    used for more than selecting, is more complicated so is not described'
  merge: -1
  pgno: 384
- img_proc: true
  md: 'here. In the tool options for the other select tools, determine whether the
    selection should replace, be added to, be subtracted from, or intersect with an
    existing selection.


    **Rectangular Select** This tool can be used to select rectangular or square areas.
    In the tool options, select among ''Free Select'', ''Fixed Select'', and ''Fixed
    Aspect Ratio'' to control the shape and size of the selection.


    **Elliptical Select** Use this to select elliptical or circular areas. The same
    options are available as with rectangular selection.


    **Lasso** Draw a selection area freehand with this tool by dragging the mouse
    over the image with the mouse button pressed. The end points will be connected
    with a straight line when you release the mouse. The area inside is then selected.


    **Magic Wand** This tools selects a region based on color similarities.


    **By Color** With select, all the pixels in the image with the same color as the
    clicked pixel.


    **Intelligent Scissors** Click a series of points in the image. As you click,
    the points are connected based on color differences.


    # **Using the Quick Mask**


    The quick mask is a way of selecting parts of an image using the paint tools.
    A good way to use it is to make a rough selection using the intelligent scissors
    or the lasso (freehand selection tool). Then activate the quick mask by pressing
    the small icon with the dashed box in the lower left corner.


    The quick mask displays the selection using an overlay of red. Areas shaded with
    red are not selected. Areas appearing as they did before the mask was activated
    are selected. To modify the selection, use the paint tools. Painting with white
    selects the painted pixels. Painting with black unselects pixels. Shades of gray
    (colors are treated as shades of gray) are a partial selection. Partial selection
    allows smooth transitions between selected and unselected areas.


    > Note To use a different color for displaying the quick mask, right-click the
    quick mask button then select ''Configure Color and Opacity'' from the menu. Click
    the colored box in the dialog that opens to select a new color.'
  merge: -1
  pgno: 385
- img_proc: true
  md: 'After using the paint tools to adjust the selection as desired, convert from
    the quick mask view back to the normal selection view by clicking the icon in
    the lower left corner of the image window (currently displaying a red box). The
    selection is again displayed with the marching ants.


    # 24.5.3 Applying and Removing Color


    Most image editing involves applying or removing color. By selecting a part of
    the image, limit where color can be applied or removed. When you select a tool
    and move the cursor onto an image, the cursor’s appearance changes to reflect
    the chosen tool. With many tools, an icon of the current tool is shown or an outline
    of the current brush is shown, allowing you to see exactly where you will be painting
    in the image and how large an area will be painted.


    # Selecting Colors


    By default, paint tools use the foreground color. However, this can be changed
    in the tool options of fill. To select the color, first click the display box
    of the foreground or background color, as desired.


    A dialog with four tabs opens. These tabs provide different color selection methods.
    The first tab, shown in Figure 24.2 on the next page, is described here. The new
    color is shown in ‘Current’. The previous color is shown in ‘Old’.


    The easiest way to select a color is using the colored areas in the boxes to the
    left. In the narrow vertical bar, click a color similar to the desired color.
    The larger box to the left then shows available nuances. Click the desired color.
    It is then shown in ‘Current’. If that is not what you want, try again.


    The arrow button to the right of ‘Current’ enables saving a number of possible
    colors. Click the arrow to copy the current color to the history. A color can
    also be selected by directly entering its hexadecimal code in ‘Hex Triplet’.


    The color selector defaults to selecting a color hue, which is easiest for a new
    user. By saturation, value, red, green, or blue, select the corresponding radio
    button to the right. The sliders and number fields can also be used to modify
    the currently selected color. Experiment with a bit to find out what works best
    for you.


    When the desired color is shown in ‘Current’, click ‘OK’. To restore the original
    values shown when the dialog was opened, click ‘Reset’. To abort changing the
    color, click ‘Cancel’.


    Manipulating Graphics with the GIMP


    # 24


    SUSE LINUX – User Guide


    367'
  merge: -1
  pgno: 386
- img_proc: true
  md: '![](img/705a076b108ea96be0c0695efb5556ce_387_0.png)


    Figure 24.2: The Basic Color Selector Dialog


    To select a color that already exists in your image, use the color picker tool,
    the icon for which eye dropper. With the tool options, select whether the foreground
    or background color should be selected. Then click a point in the image that shows
    the desired color. When the color is right, click ‘Close’ to close the tool''s
    dialog.


    # Painting and Erasing


    To paint and erase, use the tools from the toolbox. There are a number of options
    available to fine-tune each tool. Pressure sensitivity options apply only when
    a pressure-sensitive graphics tablet is used.

    The pencil, brush, airbrush, and eraser work much like their real-life equivalents.
    The ink tool works like a calligraphy pen. Paint by clicking and dragging. The
    bucket fill is a method of coloring areas of an image. It fills based on color
    boundaries in the image. Adjusting the threshold modifies its sensitivity to color
    changes.


    # Adding Text


    With the text tool, easily add text to an image. With the tool options, select
    the desired font, font size, color, justification, indent, and line spacing. Then
    click a starting point in the image. A small dialog opens in which to enter your
    text. Enter single or multiple lines of text then press ‘Close’.'
  merge: -1
  pgno: 387
- img_proc: true
  md: 'The tool creates text on a special layer. To work with the image after adding
    text layer, read Section 24.6.1 on the following page. When the text layer is
    active, it is possible to modify the text by clicking the image to reopen the
    entry dialog. Change the settings by modifying the tool options.


    # Retouching Images — The Clone Tool


    The clone tool is ideal for retouching images. It enables you to paint in an image
    using information from another part of the image. If desired, it can instead take
    information from a pattern.


    When retouching, it is usually a good idea to use a brush with soft edges. In
    this way, the modifications can blend better with the original image.


    To select the source point in the image, press and hold Ctrl while clicking the
    desired source point. Paint with the tool as usual. When you move the cursor while
    painting, the source point, marked by a cross, moves as well. If the ''Alignment''
    is set to ''No Aligned'' (the default setting), the source resets to the original
    when you release the mouse button.


    # 24.5.4 Adjusting Color Levels


    Images often need a little adjusting to get ideal print or display results. In
    many programs designed for inexperienced users, the brightness and contrast levels
    are modified. This can work and is also available in The GIMP, but better results
    can be obtained by adjusting the color levels.


    To do this, select ''Layer -> ''Colors'' -> ''Levels''. A dialog opens for controlling
    the levels in the image. Good results can usually be obtained by clicking ''Auto''.
    To make adjustments to all channels, use the dropper tools in ''All Channels''
    to pick black, gray, and white points from the image itself.


    To modify a channel individually, select the desired channel in ''Modify Levels
    for Channel''. Then drag the black, white, and middle markers in the slider in
    ''Input Levels''. Alternatively, use the dropper tools to select points in the
    image that should serve as the white, black, and gray points for that channel.


    If ''Preview'' is checked, the image shows a preview of how the image would look
    with the modifications applied. When the desired result is achieved, press ''OK''
    to apply the changes. With ''Reset'', restore the original settings. ''Cancel''
    aborts level adjustment.'
  merge: -1
  pgno: 388
- img_proc: true
  md: '# 24.5.5 Undoing Mistakes


    Most modifications made in The GIMP can be undone. To view a history of modifications,
    use the undo dialog included in the default window layout or open one from the
    toolbox menu with ''File'' -> ''Dialogs'' -> Undo History''.


    The dialog shows a base image and a series of editing changes that can be undone.
    Use the yellow arrow at the bottom left to undo changes. Use the green arrow at
    the right to redo an undo change. In this way, you can work back to the base image.
    If you undo a modification then make a new one, the undo modification cannot be
    undone.


    Changes can also be undone and redone with the ''Edit'' menu. Alternatively, use
    the shortcuts (Ctrl) + Z and (Ctrl) + Y.


    # 24.6 Editing Images: Advanced Features


    # 24.6.1 Layers


    Layers are a very important aspect of The GIMP. By drawing parts of your image
    on separate layers, change, move, or delete those parts without damaging the rest
    of the image. To understand how layers work, imagine an image created from a stack
    of transparent sheets. Different parts of the image are drawn on different sheets.
    The stack can be rearranged, changing which parts are on. Individual layers or
    groups of layers can shift position, moving sections of the image to other locations.
    New sheets can be added and set aside.


    Use the ''Layers'' dialog to view the available layers of an image. The text tool
    automatically creates special layers when used. The active layer is highlighted.
    The buttons at the bottom of the dialog offer a number of functions. More are
    available in the menu opened when a layer is right-clicked in the dialog. The
    two icons spaces before the image name are used for toggling image visibility
    (eye icon when visible) and for linking layers. Linked layers are marked with
    the chain icon and moved as a group.


    Only layers with transparency (an alpha channel) can be placed above other layers
    in a stack. To add this to a layer, right-click and select it from the menu.'
  merge: -1
  pgno: 389
- img_proc: true
  md: '# 24.6.2 Image Modes


    GIMP has three image modes — RGB, Grayscale, and Indexed. RGB is a normal color
    mode and is the best mode for editing most images. Grayscale is used for black-and-white
    images. Indexed limits the colors in the image to a number set. It is mainly used
    for GIF images. If you need an indexed image, it is normally best to edit the
    image in RGB then convert to indexed before saving. If you save to a format that
    requires an indexed image, GIMP offers to index the image when saving.


    # 24.6.3 Special Effects


    GIMP includes a wide range of filters and scripts for adding special effects to
    an image or making artistic manipulations. They are available in ''Filters'' and
    ''Script-fu''. Experimenting is the best way to find out what is available. ''Items''
