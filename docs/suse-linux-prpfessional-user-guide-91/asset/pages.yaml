    # ## 4.10.2 Restriction of Key Combinations


    If you have system-wide Alt key combinations when the X server is running, the
    Alt combinations in YaST might not work. Furthermore, keys like Alt or Shift might
    be occupied by the settings of the terminal.


    Replacing Alt with Esc: Alt shortcuts can be executed with Esc instead of Alt.
    For example, Esc-H replaces Alt-H.


    Replacing backward and forward navigation with Ctrl+F and Ctrl+B combinations
    are occupied by the window manager or the terminal, the combinations Ctrl+F (forward)
    and Ctrl+B (backward) should be used instead.


    Restricted function keys: The F keys are also used for functions. Certain function
    keys can be occupied by the terminal so might not be available for YaST. However,
    the Alt key combinations and the F keys should be fully available on a pure text
    console.


    The following paragraphs assume that the Alt key combinations are functional.


    # ## 4.10.3 Module Operation


    Navigating Buttons and Selection Lists


    Tab and Alt+Tab navigate among buttons and frames.


    Navigating in Selection Lists T and J navigate among the single items within an
    activated frame containing a selection list. These can, for instance, be the single
    modules of a module group in the control center.'
