  md: 'start the modem, ISDN, network, or DSL configuration of YaST to select a provider
    from a list.


    KInternet can do even more: if the option ‘Channel Bundling’ is activated in YaST,
    a second ISDN channel can be added to an existing connection with ‘Add link’.
    This doubles the transfer rate (although at a higher price). Activate channel
    bundling if you need to download large files. The activated channel bundling is
    evident from the red plus symbol at the top left corner of the KInternet icon.


    Users who want to establish Internet connections automatically can use dial on
