  md: 'The imported key then appears in the main overview of the key manager and is
    ready for use.


    ![](img/705a076b108ea96be0c0695efb5556ce_273_0.png)


    Figure 15.4: Hits and Import


    To avoid being asked repeatedly about whether you trust the key and assume this
    key is used by its authorized owner, edit the trust level of the newly imported
    key. By default, a newly imported key always appears with a “?” instead of a setting
    regarding the trust level.


    Right-click the newly imported key to access a small context menu for the key
    management. Select ‘Edit Key’. KGdg opens a text console in which to set the trust
    level by means of a few commands.


    At the prompt of the text console (Command >), enter trust. Now assign a value
    between 1 and 5 indicating how much you trust that the signers of the imported
    key have checked the true identity of the owner of this key. Enter the selected
    value at the prompt (Your decision?). If you are sure, enter 5. Answer the following
    question by entering y. Finally, quit to exit the console and return to the list
    of keys. The key now has the trust level Ultimate.


    # 15.2.2 Exporting Your Keys to a Key Server


    To export your key to one of the freely accessible key servers on the Internet,
    select ‘Export’ in the key server dialog. Designate the target server and the
    key to export by means of two drop-down menus. Then start the export with ‘Export’.'
