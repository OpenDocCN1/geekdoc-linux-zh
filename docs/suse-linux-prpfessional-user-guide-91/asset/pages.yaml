  md: '# 23.1 The Kooka Window


    Start Kooka from the main menu or enter the command kooka. When started, Kooka
    opens a three-frame window with a menu bar to the upper left and a toolbar directly
    below it. All windows can be freely readjusted or rearranged with the mouse. It
    is also possible to detach single frames from the Kooka window for deliberate
    placement on the desktop. To move the frames, click and drag the thin double line
    above the frame. Any frame, except the main window, can be placed within any other
    frame aligned to the left, right, top, bottom or centered. Centered windows have
    the same size, are stacked, and can be brought to the foreground with tabs.


    The ‘Image Viewer’ and the ‘Scan Preview’ frames share a window by default. Tabs
    allow switching between them. The left frame provides the gallery. It is a small
    file browser for accessing the scanned images. The frame to the lower right is
    shared by the OCR (optical character recognition) and the thumbnails, which can
    be loaded into the image viewer with a simple click of the mouse. See Figure 23.1
    on the next page.


    Selecting ‘Show Scan Parameters’ in the ‘Tool Views’ subentry of the ‘Settings’
    menu creates a third tab labeled ‘Scan Parameter’ next to the already existing
    ‘Image Viewer’ and ‘Scan Preview’ tabs in the main window. This is where the actual
    scanning parameters are set.


    # 23.2 The Preview


    A preview should always be created when the object to scan is smaller than the
    total scanning area. Set a few parameters to the left of the preview frame. Select
    the scanning size with ‘Custom’ or one of the standard formats. See Figure 23.2
    on page 354. The ‘Custom’ setting is the most flexible, because it allows selection
    of the desired area with the mouse. Once the settings have been made, request
    the preview of the image to scan by clicking ‘Preview Scan’ on ‘Scan Parameter’.


    # 23.3 The Final Scan


    If you selected ‘Custom’ for the scanning size, use the mouse to select the rectangular
    area to scan. The selected area is confined by a dotted border.'
  merge: -1
  pgno: 371
- img_proc: true
  md: '![](img/705a076b108ea96be0c0695efb5556ce_372_0.png)


    Figure 23.1: The Kooka Main Window


    Click ''Scan Parameter''. Choose between color and black-and-white scanning and
    set the resolution with the slider. See Figure 23.3 on page 355. The higher the
    resolution, the better the quality of the scanned image is. However, this also
    results in a correspondingly larger file and the scanning process can take a very
    long time at high resolutions. Activate ''Custom gamma table'' and click ''Edit''
    to change the settings for brightness, contrast, and gamma.


    Once all settings have been made, click ''Final Scan'' to scan the image. The
    scanned image is then displayed in the image viewer and as a thumbnail. When prompted,
    select the format in which to save the image. To save all the future images in
    that same format, check the corresponding box. Confirm with ''OK''.


    # 23.4 The Menus


    Some of the functions of the toolbar are also available in the ''File'' and ''Image''
    menus. Modify preference settings for Kooka in ''Settings''.


    File This menu to start the KPrinter assistant, to create a new folder for your
    images, and to save, delete, and close files. The OCR'
  merge: -1
  pgno: 372
- img_proc: true
  md: '![](img/705a076b108ea96be0c0695efb5556ce_373_0.png)


    results of a scanned text document can be saved here. Also use this menu to close
    Kooka.


    **Image** The ''Image'' menu allows starting a graphics application post-processing
    or optical character recognition of an image. The recognized text from an OCR
    operation is displayed in its own frame. Various tools for scanning, rotating,
    and flipping an image are available. These functions can also be accessed from
    the toolbar. The submenu ''Create From Selection'' allows saving an area of an
    image previously marked with the mouse.


    **Settings** ''Settings'' adjusts of the look and feel of Kooka. The toolbar and
    status bar can be switched on and off and keyboard shortcuts for menu entries
    can be defined. ''Configure Toolbars'' provides a list of all the functions available
    to the toolbar. ''Configure Kooka'' opens a configuration dialog in which to modify
    the look and feel of Kooka. Normally, the defaults are sufficient. In ''Tool Views'',
    enable and disable the thumbnail viewer, the preview, the gallery, the scanning
    parameters, and the OCR result window.


    **Help** The ''Help'' menu provides access to the online help manual for Kooka.
