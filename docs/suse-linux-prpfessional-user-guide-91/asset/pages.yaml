    # ### 4.3.4 Installing and Removing Software


    This module enables installation, uninstallation, and update of software on your
    machine.


    In Linux, software is available in the form of packages. Normally, a package contains
    everything needed for a program (such as an editor or a compiler). Usually, this
    includes the actual program, associated configuration files, and documentation.
    A package containing the source files for the respective program is normally available
    as well. The sources are not needed for running the program. However, you may
    want to install the sources to compile a custom version of the program. In Linux,
    this is possible and permitted.


    Some packages depend on other packages. This means that the software of the respective
    package only works properly if another package is installed (package dependency).
    Furthermore, the installation (not only the operation) of some packages is only
    possible if other packages are installed, perhaps because packages must be installed
    in the correct sequence. Moreover, there are some packages with identical or similar
    functionalities. If these packages use the same system resource, they should not
    be installed concurrently (package conflict). Dependencies and conflicts can occur
    between two or more packages and are sometimes very complex. The fact that a specific
    package version may be required for smooth interaction can make things even more
    complicated.


    All these factors must be taken into consideration when installing, uninstallation,
    and updating software. Fortunately, YaST provides an extremely efficient tool
    for this purpose: the installation module, usually referred to as the package
    manager. When the package manager is started, it examines the system and displays
    installed packages. If you select additional packages for installation, the package
    manager automatically checks'
  merge: -1
  pgno: 78
- img_proc: true
  md: 'dependencies and selects any other needed packages (resolution of dependencies).
    If you unknowingly select conflicting packages, the package manager indicates
    this and submits suggestions for solving the problem (resolution of conflicts).
    If a package needed by other installed packages is accidentally marked for deletion,
    the package manager issues an alert with detailed information and alternative
    solutions.


    Apart from these purely technical aspects, the package manager provides a well-structured
    overview of the range of packages in SUSE Linux. The packages are arranged by
    subjects and the display of these groups is restricted by means of suitable filters.
    Thus, the package manager facilitates the management of software packages and
    is a valuable tool for maintaining your system.


