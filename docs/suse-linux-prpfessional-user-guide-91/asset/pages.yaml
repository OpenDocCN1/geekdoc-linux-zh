    multihead dialog. Three modes are offered: ''Traditional'' (default), ''One screen
    (Xinerama)'', and ''Clone mode''.


    +   - Traditional multihead — Each monitor represents an individual unit. The
    mouse pointer can switch between the screens.

    - Cloned multihead — In this mode, all monitors display the same contents. The
    mouse is only visible on the main screen.

    - Xinerama multihead — All screens combine to form a single large screen. Program
    windows can be positioned freely on all screens or scaled to a size that fills
    more than one monitor.


    The layout of a multihead environment describes the arrangement of the relationship
    between the individual screens. By default, SaX2 configures a standard layout
    that follows the sequence of the detected graphics cards, arranging all screens
    in a row from left to right. In the ''Layout'' dial of the multihead tool, determine
    the way monitors are arranged by using the mouse to move the screen symbols in
    the grid. After you have completing the layout dialog, verify the new configuration
    by clicking ''Test''.


