    # 7.6 Word Processing with OpenOffice.org Writer


    # 7.6.1 Creating Texts with the AutoPilot


    To use a standard format and predefined elements for your own documents, try the
    AutoPilot. This is a small utility that lets you make some basic decisions then
    produces a ready-made document from a template. For instance, to create a business
    letter, select ''File'' -> ''AutoPilot'' then select ''Letter...''. This opens
    the dialog as shown in Figure 7.3 on the next page.


    Click ''Next'' in each page to proceed to the next one. To modify any previous
    entries, use ''Back''. When finished, click ''Create'' to generate the letter
    according to your specifications. Exit the dialog with ''Cancel''. Access a help
    document with ''Help''.


    When finished, click ''Create''. OpenOffice.org produces a letter according to
    your specifications. Now, compose the text (body) of the letter itself. AutoPilot
    is not limited to letters, but can also assist in the creation of agendas, memos,
    and presentations.'
