  md: '# 4.4.11 TV and Radio Cards


    After starting and initializing this YaST module, the ''TV and Radio Cards'' dialog
    appears. If your card was automatically detected, it is displayed at the top of
    the list. In this case, highlight the line with the mouse and select ''Configure''.
    If your card was not detected, select ''Other (not recognized)''. Press ''Configure''
    to proceed with the manual selection in which to select your card from the list
    of vendors and models.


    If you have already configured TV or radio cards, modifying existing configurations
    with ''Change''. In this case, a dialog presents a list of all configured cards.
    Select a card and start the manual configuration with ''Edit''.


    During the automatic hardware detection, YaST attempts to assign the correct tuner
    to your card. If you are not sure, simply keep the setting ''Default (recognized)''
    and check it works. If you are not able to see all channels, this might be due
    to a failure of the automatic detection of the tuner type. In this case, click
    ''Select Tuner'' and highlight the correct tuner in the list.


    If you are familiar with the technical details, you can use the expert dialog
    to specify settings for a TV or radio card. Select a kernel module and its parameters
    in this dialog. Also check all parameters of your TV card driver. To do this,
    select the respective parameters and enter the new value in the parameter line.
    Confirm the new values with ''Apply'' or restore the default values with ''Reset''.


    The dialog ''TV and Radio Cards, Audio'' enables you to connect your TV or radio
    card with the installed sound card. You must use a cable to connect the output
    of the TV or radio card with the external audio input of the sound card. This
    only works if the sound card is already configured and the external input is active.
    If you have not configured your sound card, select ''Configure Sound Card'' to
    go to the respective dialog, described in Section 4.4.10 on page 92.


    If your TV or radio card has speaker jacks, you can also connect the speakers
    directly without configuring the sound card. There are also TV cards without sound
    function, which do not require an audio configuration (e.g., for CCD cameras).


    # 4.5 Network Devices


    All the machines connected to the Internet form a large network in which various
    operating systems run with different hardware. The Internet uses'
  merge: -1
  pgno: 113
- img_proc: true
  md: 'a standard communication protocol that can be understood regardless of the
    hardware or software used. This is made possible by means of the Internet Protocol
    (IP) together with the Transmission Control Protocol (TCP), the User Datagram
    Protocol (UDP), and the Internet Control Message Protocol (ICMP). These protocols
    comprise the common language used by all machines on the Internet. The abbreviation
    for this is TCP/IP.


    Every machine on the Internet has an ID number — the IP address. It can only be
    addressed by TCP/IP with it. Normally, a machine also has a name. The Domain Name
    System (DNS) is responsible for converting the IP address to a name server. This
    particular service is offered by name servers. A machine or an application offering
    a service is called a server (for example, a DNS server) or a machine or application
    making of a service is called.


    Under TCP/IP, there are various standardized protocols for forwarding the appropriate
    TCP/IP data transfers to the given transmission method. For network connections
    via a network card, the ethernet protocol is used. For modem and ISDN telephones,
    the point-to-point protocol (PPP). For ADSL and T-DSL connections, the point-to-point
    over ethernet Protocol (PPPoE) is used.


    To establish an Internet connection, the ethernet, PPP, or PPPoE connection between
    your host and a host of the Internet provider must be established first. Then
    the TCP/IP connection must be established. Various standardized protocols work
    on top of TCP/IP for proper data transfer to the application:


    +   - The HyperText Transfer Protocol (HTTP) is used for the transfer of web sites
    in HyperText Markup Language (HTML).


    +   - The Simple Mail Transfer Protocol (SMTP) is responsible for sending e-mails
    to another machine and the Post Office Protocol (POP) for downloading e-mails
    from a mail server.


    +   - The File Transfer Protocol (FTP) is used to transfer files.


    For several application programs, such as a web browser and an e-mail program,
    to use the Internet connection at the same time, separate TCP/IP connections are
    used for each application. Large amounts of TCP/IP data are also divided into
    small packets, so HTTP packets from the web browser can be sent over its TCP/IP
    connection while alternating with SMTP or POP3 packet transfers from the e-mail
    program via other TCP/IP connections.'
  merge: -1
  pgno: 114
- img_proc: true
  md: 'As several applications use the same Internet connection, the IP address, which
    only identifies the machine, is not sufficient. A port number is needed to sort
    out which TCP/IP data belongs to which application. These standard services are
    usually provided on servers at the following port numbers:


    +   - DNS on port 53

    - HTTP on port 80

    - SMTP on port 25 and POP3 on port 110

    - FTP on ports 20 and 21


    The client can only use services if it addresses the correct port number on the
    server.


    # 4.5.1 Information about the Internet Dial-Up


    If you activate ''Dial on Demand'' or ''Automatic Dial-Up'' in the YaST modules,
    the Internet connection is established whenever necessary, for example, when an
    external URL is entered in the browser or when e-mail is sent and fetched. ''Dial
    on demand'' or ''automatic'' is only advisable if you have a flat rate for Internet
    access. With ''manual'', the computer only establishes a connection to the Internet
    when you want it to do so. Background processes, such as fetching e-mail in regular
    intervals, frequently establish connections to the Internet, which can be expensive.
    To connect to the Internet, you can use the KDE program KInternet, described in
    Section 5.4.1 on page 154.


    # 4.5.2 Network Card


    When the YaST module is started, an overview of the network configuration is displayed.
    The upper part of the dialog lists lists all network cards that were automatically
    detected or manually configured. If your card was detected correctly when the
    system was booted, the name of the card appears here. Devices that were not recognized
    are listed as ''Other'' (not detected). The lower part of the screen lists configured
    devices including the network type and the address. You can configure new network
    cards or modify the configuration of a configured device.


    96 4.5. Network Devices'
