  md: '# Partition


    Every hard disk has a partition table with space for four entries. Each entry
    in the partition table can be a primary partition or an extended partition. Only
    one extended partition entry is allowed, however.


    Primary partitions consist of a continuous range of cylinders (physical disk areas)
    assigned to a particular operating system. Using primary partitions, you could
    not set up more than four partitions per hard disk. Do not fit in the partition
    table.


    This is why extended partitions are used. Extended partitions are also continuous
    ranges of cylinders, but an extended partition may itself be subdivided into logical
    partitions. Logical partitions do not require entries in the partition table.
    In other words, an extended partition is a container for logical partitions.


    If you need more than four partitions, create an extended partition. This extended
    partition should span the entire remaining cylinder range. Then create multiple
    logical partitions within the extended partition. The maximum number of logical
    partitions is fifteen on SCSI disks and 63 on (E)IDE disks.


    It does not matter which type of partitions are used for Linux. Primary and logical
    partitions both work fine.


    # Required Disk Space


    The amount of hard disk space needed depends on the intended use of the system.
    Available space limits what applications can be installed. The following hints
    give some guidelines for space requirements:


    +   - Minimal system: 180 MB


    +   No graphical interface (X Window System) is installed, which means only console
    applications can be used. Also, only a very basic selection of software is installed.


    +   - Minimal system with graphical interface: 500 MB


    +   This includes X and some applications.


    +   - Graphical system with modern applications: between 1 GB and 2 GB This includes
    recent versions of graphical desktops, KDE and GNOME, and bigger application packages,
    such as OpenOffice.org and Netscape or Mozilla.


    +   - For downloading movies and music with Linux: 2 GB'
  merge: -1
