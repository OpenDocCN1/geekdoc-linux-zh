  md: '# # Manipulating Graphics with The GIMP


    The GIMP (The GNU Image Manipulation Program) is a program for creating and editing
    pixel graphics. In most aspects, its features are comparable to those of Adobe
    Photoshop and other commercial programs. Use it to resize and retouch photographs,
    design graphics for web pages, make covers for your custom CDs, or almost any
    other graphics project. It meets the needs of both amateurs and professionals.


    +   24.1 Graphics Formats . . . . . . . . . . . . . . . . . . . . . . 358

    24.2 Starting The GIMP . . . . . . . . . . . . . . . . . . . 358

    24.3 Getting Started in GIMP . . . . . . . . . . . . . . 361

    24.4 Saving Images . . . . . . . . . . . . . . . . . . . . . . 362

    24.5 Editing Images: Basics . . . . . . . . . . . . . . . 364

    24.6 Editing Images: Advanced Features . . . . . . . . 370

    24.7 Printing Images . . . . . . . . . . . . . . . . . . . 371

    24.8 Configuring GIMP . . . . . . . . . . . . . . . . . . . 371

    24.9 For More Information . . . . . . . . . . . . . . . . . 373'
  merge: -1
  pgno: 376
- img_proc: true
  md: 'Like many other Linux programs, The GIMP is developed as a cooperative effort
    of developers worldwide who volunteer their time and code to the project. The
    program is under constant development, so the version included in your SUSE LINUX
    may vary slightly from the version discussed here. The layout of the individual
    windows and window sections is especially likely to vary.


    The new 2.0 version offers many new features and an updated user interface. As
    many of these features and aspects of the user interface are mentioned, both new
    and experienced GIMP users can benefit from this chapter.


    The GIMP is an extremely complex program. Only a small range of features, tools,
    and menu items are discussed in this chapter. See Section 24.9 on page 373 for
    ideas of where to find more information about the program.


    # 24.1 Graphics Formats


    There are two main formats for graphics — pixel and vector. The GIMP works only
    with pixel graphics, which is the normal format for photographs and scanned images.
    Pixel graphics consist of small blocks of color that together create the entire
    image. The files can easily become large because of this. It is also not possible
    to increase the size of a pixel image without losing quality.


    Unlike pixel graphics, vector graphics do not store information for all-individual
    pixels. Instead, they store information about how image points, lines, or areas
    are grouped together. Vector images can also be scaled easily. The drawing application
    of OpenOffice.org, for example, uses this format.


    # 24.2 Starting The GIMP


    Starting GIMP from the main menu. Alternatively, enter gimp & in a command line.


    # 24.2.1 Initial Configuration


    When starting GIMP for the first time or the 2.0 version for the first time, a
    configuration wizard opens for preparatory configuration. The default'
  merge: -1
  pgno: 377
- img_proc: true
  md: 'settings are acceptable for most purposes. Press ‘Continue’ in each dialog
    unless you are familiar with the settings and prefer another setup.


    # 24.2.2 The Default Windows


    Three windows appear by default. They can be arranged on the screen, except the
    toolbox, closed if no longer needed. Closing the toolbox closes the application.
    In the default configuration, The GIMP saves your window layout when you exit.
    Dialogs left open reappear when you next start the program.


    # GIMP Tip of the Day


    This small window opens with useful tips and tricks each time the program starts.
    Reading the tips is recommended for new users. Uncheck ‘Show tip next time GIMP
    starts’ to disable it. This setting can also be changed in the preferences. Press
    ‘Close’ to close the window.


    # The Toolbox


    The main window of GIMP, shown in Figure 24.1 on the next page, contains the main
    controls of the application. Closing it exits the application. At the very top,
    the menu bar offers access to file functions, extensions, and help. Below that,
    find icons for the various tools. Hover the mouse over an icon to display information
    about it.


    The current foreground and background color are shown in two overlapping boxes.
    The default colors are black for the foreground and white for the background.
    Click the box to open a color selection dialog. Swap the foreground and background
    color with the bent arrow symbol to the upper right of the boxes. Use the black
    and white symbol to the lower left to reset the colors to the default.


    To the right, the current brush, pattern, and gradient are shown. Click the displayed
    one to access the selection dialog. The lower portion of the window contains the
    ‘Tool Options’ dialog. It allows configuration of various options for the current
    tool.


    # Layers, Channels, Paths, Undo


    In the first section, use the drop-down box to select the image to which the tabs
    refer. By clicking ‘Auto’, control whether the active image is chosen automatically.
    By default, ‘Auto’ is enabled.


    ![](img/705a076b108ea96be0c0695efb5556ce_378_0.png)'
  merge: -1
  pgno: 378
- img_proc: true
  md: '![](img/705a076b108ea96be0c0695efb5556ce_379_0.png)


    Layers’ shows the different layers in the current images and can be used to manipulate
    the layers. Information is available in Section 24.6.1 on page 370. ‘Channels’
    shows and can manipulate the color channels of the image.


    Paths are an advanced method of selecting parts of an image. They can also be
    used for drawing. ‘Paths’ shows the paths available for an image and provides
    access to path functions. ‘Undo’ shows a limited history of modifications made
    to the current image. Its use is described in Section 24.5.5 over page 370.


    The bottom portion of the window contains three tabs. With them, select the current
    brush, gradient, and pattern.'
  merge: -1
