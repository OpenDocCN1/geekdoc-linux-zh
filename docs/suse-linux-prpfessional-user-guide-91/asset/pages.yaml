    # Configuration for Applications


    Applications rely on the existing printer queues in the same way as any command-line
    tools do. There is usually no need to reconfigure the printer for a particular
    application and you should be able to print from applications using the available
    queues.


    # Printing from the Command Line


    Print from the command line using the command lpr -P filename, where filename
    is the name of the file to send to the printer. In this example, the default printer
    queue lpr is used, but the -P option allows you to another queue. For instance,
    the command lpr -Color filename tells the printing system to use the color queue.


    # Using the LPRng Printing System


    use the lpr command for printing. In the application, select the name of an existing
    queue (such as color) or enter the respective print command (such as lpr -Color)
    in the print dialog of the application.


