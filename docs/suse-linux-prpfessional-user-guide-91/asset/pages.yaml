- img_proc: true
  md: '‘Picture Options’ determines what processing steps should be applied to the
    selected image to adapt it optimally to the current screen resolution. The options
    are ‘Wallpaper’, ‘Centered’, ‘Scaled’, and ‘Stretched’.


    # 6.2.7 Font


    This module determines the font used for the desktop. In a second step, enable
    optional effects for the improvement of the font quality. The upper part of the
    dialog window shows the fonts selected for ‘Application font’, ‘Desktop font’,
    ‘Window title font’, and ‘Terminal font’. Click one of the buttons to open a selection
    dialog in which to set the font family, style, and size. The options for ‘Font
    Rendering’ and the additional configuration options accessible through ‘Details’
    are set to optimal values by default.


    # 6.2.8 Theme


    The style for all control elements on the desktop and of GNOME applications is
    set here. Choose from various preinstalled themes. Selecting a style in the list
    overview applies it automatically. ‘Details’ opens another dialog in which to
    customize the style of single desktop elements, like window content, border, and
    icons. Making changes and leaving the dialog with ‘Close’ switches the theme to
    ‘Custom theme’. Click ‘Save theme’ to save your modified theme to a custom name.
    The Internet and other sources provide many additional themes for GNOME as .tar.gz
    files. Install these with ‘Install theme’.


    # 6.2.9 Accessibility


    The settings of this module facilitate the use of the keyboard for users with
    motion impairments. The module consists of the three tabs ‘Basic’, ‘Filters’,
    and ‘Mouse’. Before modifying settings, activate ‘Enable keyboard accessibility
    features’.


    The keyboard accessibility functions can be deactivated automatically after a
    certain time. Set an appropriate time limit measured in seconds with the slider.
    The system can additionally provide audio feedback when the keyboard accessibility
    functions are activated and deactivated.'
