    # Boot Loader Configuration Options


    For less experienced users, the configuration with YaST is much easier than editing
    the files directly. Select an option and click ‘Edit’ to open a dialog in which
    to change the settings to your needs. Click ‘OK’ to confirm the changes and return
    to the main menu, where you can edit other options. The available options depend
    on the boot loader used. The following list introduces some options of the boot
    loader GRUB:


    +   **Boot Loader Type** Use this option to switch between GRUB and LILO. You
    will be taken to another dialog in which to specify the way in which this change
    should be performed. For instance, convert the GRUB configuration into a similar
    LILO configuration. However, some settings may be lost if no equivalent options
    are available. You can also create a new configuration from scratch or generate
    and edit a suggestion for a configuration. If you start the boot loader configuration
    in the running system, you can load the configuration from the hard disk. If you
    decide to return to the original boot loader, you can load its configuration by
    means of the last option. However, this possibility exists as long as you do not
    close the boot loader module.


    +   **Boot Loader Location** Use this dialog to define where to install the boot
    loader: in the master boot record (MBR), in the boot sector of the boot partition
    (if available), in the boot sector of the root partition, or on a floppy disk.
    Use ‘Others’ to specify a different location. Refer to the information about GRUB
    in the Administration Guide.


    +   **Boot Order** If your computer has more than one hard disk, specify the boot
    sequence of the disks as defined in the BIOS setup of the machine.'
