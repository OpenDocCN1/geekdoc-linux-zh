  md: '# Evolution: An E-Mail and Calendar Program


    Evolution is a groupware suite created by Ximian. It offers regular e-mail features
    along with extended features, like task lists and a calendar. The application
    also provides a complete address book, including the ability to send contact information
    to others in vCard format.


    +   17.1 Starting Evolution . . . . . . . . . . . . . . . . . . . . . . . . .
