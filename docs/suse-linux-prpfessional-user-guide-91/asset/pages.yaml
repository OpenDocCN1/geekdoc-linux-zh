  md: '# The GNOME Desktop


    GNOME (GNU Network Object Model Environment) is a fast Linux desktop. The aim
    of its development was to make the user interface more uniform while streamlining
    the various aspects of the look and feel. The basic components for window management
    and other components enable data sharing among various applications and are based
    on a uniform operating concept and help system.


    +   6.1 The Desktop . . . . . . . . . . . . . . . . . . . . . 170

    6.2 Settings . . . . . . . . . . . . . . . . . . . . . 172

    6.3 File Management with Nautilus . . . . . . . . 177

    6.4 Important Utilities . . . . . . . . . . . . . . . 179'
  merge: -1
  pgno: 188
- img_proc: true
  md: '# 6.1 The Desktop


    The most important elements of the GNOME desktop are the icons on the desktop,
    the panel at the lower border, and the desktop menu. The mouse is your most important
    tool.


    # 6.1.1 The Icons


    By default, the desktop features three symbols: your personal folder, the start
    dialog for the configuration of the desktop, and the trash can. If you double-click
    your personal folder, Nautilus starts and displays your home directory. More information
    about the use of Nautilus is available in Section 6.3 on page 177. All files deleted
    with Nautilus are sent to the trash can.


    Right-clicking an icon displays a menu offering file operations, like copying,
    cutting, or renaming. Selecting ''Properties'' from the menu displays a configuration
    dialog. The title of an icon as the icon itself can be changed with ''Custom icon''.
    The ''Emblems'' tab offers the possibility to add graphical descriptive symbols
    to the icon. The ''Permissions'' tab provides access to the access, read, and
    write permission settings for the file for the user, group, or others. The ''Notes''
    tab offers the management of comments. The menu for the trash can additionally
    features the ''Empty Trashcan'' option. This deletes its contents.


    To remove an icon from the desktop, simply move it into the trash can. However,
    be careful with this option — if you throw folder icons or file icons into the
    trash can, the actual data is deleted. If the icons represent represent to a file
    or to directory, only the links are deleted.


    To create a link on the desktop to a folder or file, access the object in Nautilus.
    Right-click the object and select ''Make Link''. Drag the link from the Nautilus
    window and drop it on the desktop.


    # 6.1.2 The Desktop Menu'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# 6.1.3 The Panel


    The panel contains the window icons of all started applications in the taskbar.
    If you click the name of a window in the taskbar, it is moved to the foreground.
    If the program is already in the foreground, a mouse click minimizes it. Clicking
    a minimized application opens the responsive window. Beside the taskbar, the ''Workspace
    Switcher'' provides access to additional work areas. These virtual desktops provide
    extra space in to arrange open applications and windows. For example, put an editor
    on one workspace, some on another, and your e-mail application and browser on
    third.


    If you right-click an empty spot in the panel, the menu opens, offering help,
    information, and commands for GNOME. Select ''Properties'' to open a configuration
    dialog in which to change the position and background of the panel. If desired,
    create additional panels or add launchers, tools, and various applets to the existing
    panels with ''Add to Panel''. Use drawers to organize your favorite applications
    or important documents. The contents are only displayed when the drawer is opened
    with a single click. Right-click the drawer and select ''Properties'' to modify
    its size and appearance. Click the icon to change. Remove panel elements by right-clicking
    the respective icons and selecting ''Remove''.


    # 6.1.4 The Main Menu


    Open the menu by means of the icon to the far left of the panel. Apart from the
    applications, which are organized in categories, find default functions, such
    as ''Log out'' and ''Log screen''. Use ''Open Recent'' to gain quick access to
    recent files. Use ''Search for Files'' to find files.


    With ''Run Program...'', enter and run a command, for example, for starting a
    program instead of navigating through the various program menus. From the main
    menu, you can also start the ''GNOME Control Center'' for configuring and installing
    additional software.


    # 6.1. Handling Floppy Disks, CDs, or DVDs


    To access floppy disks, CDs, or DVDs, insert the medium in the appropriate drive.
    Right-click an empty spot of the desktop and select the desired medium from the
    ''Drives'' list. CD icon appears. Double-clicking the icon launches Nautilus,
    which displays the contents of the medium. Copy files to your personal home directory
    by dragging and dropping. Copy files to a floppy disk in the same way.'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# Caution


    Do not simply remove floppy disks from the drive after using them. Floppy disks,
    CDs, and DVDs must always be unmounted from the system first. Close all Nautilus
    sessions still accessing the medium then right-click the icon for the medium and
    select ''eject'' from the menu. Then safely remove the floppy disk or CD (the
    tray opens automatically). The icon disappears from the desktop.


    Floppy disks can also be formatted from the floppy disk menu. In the dialog, choose
    the format and density of the floppy disk. In ''file system type'', choose between
    ''Linux native (ext2)'', the file system for Linux, and ''DOS (FAT)'', because
    Windows cannot access Linux file systems. Help provides some instructions for
    the tool.


    # 6.2 Settings


    The GNOME desktop can be customized according to your preferences and needs. Click
    the ''Start Here'' icon on the desktop. start Nautilus by right-clicking the desktop
    then selecting ''New Window''. Under ''Location:'', enter preferences://. Open
    the various configuration dials by double-clicking the respective icons.


    # Note


    In the individual modules, access specific help for the options with ''Help''.
    The system immediately adopts every change made in a configuration module.


    # 6.2.1 Keyboard


    In the ''Keyboard'' module, determine settings such as the repeat rate and sound
    events associated with your keyboard. The module consists of the ''Keyboard''
    and ''Audio'' tabs. Use the ''Audio'' tab to configure an audio signal for your
    keyboard. For audible notification when a wrong key is pressed, activate the corresponding
    radio button. Exit the ''Keyboard'' module with ''Close'' or go to the accessibility
    module with ''Accessibility''. The functionality of this module is described in
    Section 6.2.9 on page 175.'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# 6.2.2 Mouse Configuration


    The mouse configuration consists of three tabs: ''Buttons'', ''Cursor'', and ''Motion''.
    The configuration options of the ''Buttons'' tab refer to the ''Mouse Orientation''.
    Left-handed users should activate ''Left-handed mouse'' to swap the right and
    left mouse buttons. Use the slider to determine the maximum delay (in seconds)
    between two clicks that the system interprets as a double-click.


    The appearance and size of the cursor can be changed under the ''Cursor'' tab.
    Four different settings are available. Changes are not activated until the next
    login. Under ''Locate Pointer'', activate an option that causes the cursor to
    be highlighted when you press Ctrl, making it easier to find. Under ''Movement'',
    set the ''Acceleration'' and ''Sensitivity'' of the screen cursor.


    # 6.2.3 Menus and Toolbars


    The settings in this module affect the menus and toolbars of all GNOME-compatible
    applications. Select for toolbar icons to be displayed as ''Text Only'', ''Icons
    Only'', ''Text Beside Icons'', or ''Text Below Icons''. The default setting is
    ''Text Only''.


    Activate Toolbars can be detached and moved around to allow the detachment of
    the toolbar from all other window elements and allow its free positioning on the
    desktop. This makes a grabbing area appear on the left side of the toolbar. Clicking
    and holding this area relocates the toolbar.


    Every menu entry in any application menu can be displayed with the corresponding
    icon. Activating ''Show icons in menus'' tests the settings with the provided
    example menu.


    # 6.2.4 Screensaver


    The module for configuring the screensaver is subdivided into two tabs: ''Display
    Modes'' and ''Advanced''. Select the screensaver in ''Display Modes''. The ''Advanced''
    tab contains a few special options that normally do not need to be modified.


    Select the screen saver mode under the ''Display Modes'' tab. Choose from ''Random
    Screen Saver'' (random selection of screen savers from a customdefined list),
    ''Only One Screen Saver'', ''Blank Screen Only'', or ''Disable Screen Saver''.'
  merge: -1
  pgno: 192
- img_proc: true
  md: 'Select one or more screensavers from the list for the operating modes: ‘Only
    One Screen Saver’ or ‘Random Screen Saver’. The currently selected screensaver
    is displayed in the small preview window. The ‘Preview’ button launches a fullscreen
    preview of that screensaver, which can be aborted by pressing any key. Select
    the previous or following screensaver for preview by clicking the corresponding
    triangles above the selection list.


    In the last step, determine after how long the screen should be completely black
    (''Blank After''), the screensaver module should be changed (''Cycle After''),
    or the screen should be locked (''Lock Screen After''). All time references are
    given in minutes.


    # 6.2.5 Windows


    This module controls the behavior of application windows. Determine how the window
    should react to contact with the mouse pointer or its title and define the key
    to hold for moving an application window.


    When several application windows populate the desktop, the active one, by default,
    is the one clicked. Change this behavior by activating ‘Select windows when the
    mouse moves over them’. If desired, activate ‘Raise window after an interval’
    and adjust the latency with the slider. This activates a window only when the
    cursor was placed within the window for a time exceeding the set latency.


    Application windows can be shaded by double-clicking the title bar, leaving only
    the title bar visible. This saves space on the desktop and is the de facto behavior.
    It is alternatively possible to set windows to maximize when the title bar is
    double-clicked.


    With the radio buttons, select the modifier key to press for moving a window.
    The possible choices are `Ctrl`, `Alt`, and the `Windows` key.


    # 6.2.6 Background


    Determine a background for your desktop. By default, the changes made here are
    applied to all virtual desktop. If you do not want any background picture, click
    ‘No Picture’ and define a background style. The drop-down menu offers a horizontal
    gradient, a vertical gradient, or no gradient at all. Use ‘Color’ to define the
    desired colors in the color editor.


    To use an image file as a background picture, drag it from the file manager and
    drop it in ‘Select picture’. Alternatively, click ‘Select picture’ to open a dialog
    in which to select the desired image.'
  merge: -1
