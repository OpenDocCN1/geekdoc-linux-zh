    # 16.10 Filters


    Filters enable automatic processing of incoming messages and manual processing
    of selected messages in a folder. To filter selected messages to a specific folder,
    highlight the messages and (Ctrl+J) to activate existing filter rules or select
    ''Message'' -> ''Create Filter'' to create a new one. In doing so, all existing
    filter rules are applied to this message. There is no way to use only certain
    filters.


    # 16.10.1 Filter Rules


    A filter consists of one or several filter rules and filter actions. A filter
    rule can select messages according to criteria, such as the sender, content, or
    recipient. The respective filter action can perform tasks like moving, deleting,
    marking, or forwarding these messages.


    # 16.10.2 Examples of Filters


    Assume, for instance, to be subscribed to the KDE user list arrives (kde-user@kde.org).
    Whenever a message from the mailing list arrives, the message is moved into another
    folder. The following steps are necessary for creating this filter.


    +   1. Add a new folder as described in Section 16.7 on page 263. A name like
    kde-user/ can be assigned.

    2. First, find a way of identifying messages to filter. The messages of the KDE
    user list described in our example can be identified by the kde-user@kde.org address,
    found in the ''To:'' or ''Cc'': field.

    3. Click ''Settings'' -> ''Configure Filters''. The left side of the window that
    opens displays the existing filters. The right side is composed of two panels:
    filter rules and filter actions.


