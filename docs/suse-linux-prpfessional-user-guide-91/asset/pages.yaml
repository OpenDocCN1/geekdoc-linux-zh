    Figure 13.1: The Main Window in Galeon


    Galeon''s most essential navigation tools are available in the first toolbar.
    ''Next'' and ''Back'' flip through the history of visited Internet sites, as in
    other browsers. ''Reload'' updates the contents of a site. — a 1:1 display of
    the document. The connection or transfer from taking place. Zoom, the magnification
