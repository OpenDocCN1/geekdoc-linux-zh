    file name of the new archive in the input field below the file extension. Then
    determine the archive type with the drop-down menu above the main field. Exit
    the dialog with ''OK'' and return to the main view of File Roller. Now, add files
    to the archive by inserting files from the desktop or file manager with drag and
    by selecting ''Edit'' -> Add Files. In the following dialog, select one or several
    files (keep Ctrl pressed to select multiple files) or directories. If necessary,
    determine the following advanced options for the archive:


    Add if newer the archive already contains a file with the same name, the file
    is only added if it is newer than the one existing in the archive.


    Include subfolders To compress an entire directory, activate this option to include
    all subdirectories.


    Exclude backup files (*) Avoid unnecessary data trash by disabling the inclusion
    of backup copies when creating an archive.


    Exclude hidden files (*) Usually, hidden files- do not contain any data that are
    relevant for the user. By default, they are not included in the archive to reduce
    the amount of data.


    Exclude files This explicitly excludes certain files from the archive. This option
    is useful if you want to compress entire directories but exclude certain files
    from the archive. Instead of file names, you can also specify search patterns.


    Ignore case File Roller ignores different spellings of file names and extensions,
    like JPEG or jpeg.


    After completing the selection and configuration, exit the dialog. The archive
    created is available for further processing at the desired location. To decompress
