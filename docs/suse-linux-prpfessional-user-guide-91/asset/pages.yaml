  md: '# 9.2 Working with KPilot


    Synchronizing the data of KDE applications with those of the handheld computer
    is quite easy. Simply start KPilot then press the “HotSync” button on the cradle
    to start the sync operation.


    ![](img/705a076b108ea96be0c0695efb5556ce_234_0.png)


    Figure 9.5: The Main Window of KPilot


    # 9.2.1 Backing up Data from the Handheld


    To do a full backup, select ‘File’ -> ‘Backup’. The backup will be performed during
    the next sync operation. After that, switch back by selecting ‘File’ -> ‘HotSync’
    from the menu. Otherwise, the time-consuming full backup will be performed again
    during the next sync operation.


    After a full backup, all copies of the handheld’s programs and databases are found
    in ~/.kde/share/apps/kilot/DBBackup/<user>, where <user> is the name of the actual
    user as registered on the handheld.


    The two built-in KPilot viewers can be used for a quick lookup of addresses or
    memos, but they are not designed to actually manage this data. The KDE applications
    mentioned above are much more suited for these tasks.'
  merge: -1
  pgno: 234
- img_proc: true
  md: '#  9.2.2 Installing Programs on the Handheld


    The ‘File Installer’ module is an interesting and useful tool for the installation
    of handheld programs. These programs normally have the extension .prc and they
    are ready to start immediately after uploading them to the handheld. Before using
    such add-on programs, read their licenses as well as the instructions included.'
  merge: -1
