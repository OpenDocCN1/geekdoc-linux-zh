    #  Virtual Resolution


    Every desktop has a certain resolution that is displayed over the full screen
    of the monitor. Additionally, it is possible to set the resolution larger than
    the visible area of the screen. If you move the mouse beyond the margins of the
    desktop, the virtual part of the desktop is displayed on screen. This increases
    the available work space.


    The virtual resolution can be set in two different ways:


    +   - ‘Drag&Drop’ – Move the mouse pointer over the monitor image and the mouse
    will turn into crosshairs. Keep the left mouse button pressed and move the mouse
    to enlarge the raster image, which correspons to the virtual resolution. This
    method is best if you are not quite sure how much virtual space you want on your
    desktop.

    - ‘By selection from the pop-up menu’ — In the pop-up menu in the middle of the
    raster image, the currently used virtual resolution is displayed. To use one of
    the default virtual resolutions, select one from the menu.


