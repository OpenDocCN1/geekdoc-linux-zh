  md: '# 20.4 nxtvepg — The TV Magazine for Your PC


    From broadcasters, an EPG (Electronic Program Guide) is transmitted along with
    the video text signal. Easily view this electronic guide using the program nxtvepg.
    To do this, however, you must have a TV card supported by the DVB driver and be
    able to receive one of the channels broadcast with an EPG.


    With nxtvepg, the broadcasts are sorted according to channel and topic, such as
    ''movie'' and ''sport'', and filtered according to criteria, such as Live, Stereo,
    or Subtitle. Start the application via ''SUSE'' -> ''Multimedia'' -> ''Video''
    menu or at the command line with nxtvepg.


    # 20.4.1 Importing the EPG Database


    To set up and update the EPG database using the EPG signal, set the tuner of your
    TV card to a station that broadcasts EPG. This can be done using a TV application,
    such as movf or nxtvepg. Only one application at a time can access the tuner.


    If you set an EPG broadcaster in movf, nxtvepg immediately importing the current
    list of TV programs. The progress will be displayed.


    ![](img/705a076b108ea96be0c0695efb5556ce_354_0.png)


    Figure 20.2: The Electronic TV Magazine nxtvepg'
  merge: -1
  pgno: 354
- img_proc: true
  md: 'If you have not started a TV application, let nxtvepg search for EPG broadcasters.
    To do this, use ''Configure'' -> ''Provider scan''. ''Use .xatv'' is activated
    by default. This indicates that nxtvepg is accessing the broadcasters saved in
    this file.


    # Note


    If there are problems, check to see if the proper video source has been chosen
    under ''TV card input''.


    # Note


    Select from the EPG providers found in ''Configure'' -> ''Select Provider''. ''Configure''
    -> ''Merge Providers'' even creates flexible associations between the various
    provider databases.


    # 20.4.2 Sorting the Programs


    nxtvepg provides a convenient filter function for managing the most extensive
    program offerings. Activate a network selection list with ''Configure'' -> ''Show
    networks''. The ''Filter'' menu offers plenty of filter functions. Right-click
    the program list to open a special filter menu maintained in which to activate
    contextual filter functions.


    Of particular interest is the ''Navigate'' menu. This is built directly from the
    EPG data. It will appear in the language provided by the network.


    # 20.5 Webcam Operation with gqcam


    gqcam is a webcam application that assists in taking snapshots or automatic picture
    series with webcams. To use gqcam, your webcam must be supported by Video4Linux.
    Many USB webcams, like the Logitech Webcam Express, are automatically recognized.
    Grayscale and color cameras can be used. TV cards that support Video4Linux can
    also be used as an image source. An overview of the supported USB devices is maintained
    at http://www.linux-usb.org. A graphical user interface is not compulsory for
    gqcam can also run from the command line.


    # 20.5.1 Operation


    Connect your camera to the USB port of your computer before starting gqcam. The
    current picture of your webcam is automatically shown in the upper part of the
    application window. The lower part'
