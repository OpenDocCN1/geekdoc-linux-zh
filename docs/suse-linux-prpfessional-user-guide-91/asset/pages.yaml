    # 26.1.3 Good Lighting for Productive Work


    Generally speaking, workplace lighting does not come close to the intensity of
    light outdoors. This difference is unnoticed because the human faculty of perception
    is very flexible. The influence of lighting conditions on our efficiency is often
    underestimated. If the light is too bright, you cannot see what is on the screen.
    If it is too dark, sharpness of vision decreases. The wrong lighting overstrains
    the visual system and, eventually, causes symptoms of fatigue and stress.


    It is assumed that a combination of general lighting and individual work-station
    lighting is best. For the workstation at home, the combination of a high-powered
    ceiling lamp (500 watts, preferably with a dimmer) and one or two workplace lamps
    is recommended. The fluorescent lamps usually found in offices for general lighting
    should be supplemented by individual workstation lamps. The lighting should, however,
    not be too intense and individually adjustable. Stark contrasts should be avoided.
    Be careful with strong desk lamps. Good illumination is, unfortunately, very expensive
    and the minimum requirements of lighting can also be fulfilled with cheaper illumination
    layers.


    +   ■ It is important that you are exposed to daylight. A view outside is preferable.


    +   ■ General lighting is considered pleasant if it is not below 250 lx (usually
    500 lx is required, 1000 lx for an open plan office).


    +   ■ 500-750 lx should be emitted by the individual workstation light-ing. However,
    individual lamps are often problematic. If they are too strong, the contrast to
    the general lighting is too great. Harmonic, soft transitions are considered more
    pleasant.


    +   ■ The lighting should not flicker. In the case of worn-out fluorescent lamps,
    a flickering can sometimes be noticed from the corner of the eye.


    +   ■ Avoid dark shadows.


    +   ■ Ceiling lights should emit light diagonally from above. Lighting strips
    should be set perpendicular to the screen table. The line of sight at the screen
    table should run parallel to the lighting strips.'
  merge: -1
  pgno: 425
- img_proc: true
  md: 'Whether the lighting is considered to be pleasant depends on the color temperature
    and light color of the lamp type. Warm white or neutral white is recommended.


    The light requirement depends not only on the working task, but also on age: older
    people need more light. older people often have only a small lamp in their homes
    has nothing to do with their light requirement, but rather with the fact that
    they want to save electricity.


    A screen workstation requires optimum shielding against direct and reflex glare,
    especially when the line of sight is directly out the window or at a 45 degree
    angle to it. The built-in antiglare facilities should be variable. Under no circumstances
    should artificial illumination cause reflex glare on the screen.


    # 26.1.4 Optimum Climate


    The room climate determines our well-being to a great extent. Problems arise if
    it is too cold, warm, drafty, or too dry. Low relative humidity can lead to burning
    eyes, dry mucous membranes, skin irritation, and increased susceptibility to colds.
    Things get complicated when people work in the same room are accustomed to different
    base temperatures. For your well-being, it is important to observe the recommended
    basic values for temperature and humidity and to avoid strong air movement. The
    working material itself should not contribute to the increase of temperature.


    For activities in a sitting position or simple work, a room temperature of 20
    to 22 °C is recommended. In summer, the temperature should be 26 °C at the most.
    This value should be exceeded for a short time when the outdoor temperature is
    higher.


    A lot of equipment, as well as people, emit heat and influence room air conditions.
    This should be reduced as much as possible.


    The air humidity should be between 40 (sometimes 50) and 65 percent and should
    be checked. This value is especially affected by heating systems.


    Draft (possibly from open windows and doors or air conditioning) should not exceed
    0.1 to 0.15 m/s. Draft on individual parts of the body should be avoided.'
  merge: -1
  pgno: 426
- img_proc: true
  md: '+   - An air conditioner should be individually adjustable. It should be serviced
    regularly.


    +   - The windows should be able to be opened and have sunshades avoid glare effects.
    Sunlight can increase the room temperature considerably. Sunshades attached to
    the outside of the building provide the best protection.


    +   - Plants can improve room conditions and are therefore recommended in all
    cases. They increase the relative humidity and filter pollutants from the air.


    # 26.1.5 Noise Levels


    Noise is a physically powerful stress factor. Although it is often played down,
    too much noise makes you ill. Apart from health impairments, such as deafening
    hearing, vegetative disorders, and psychic changes, noise affects our ability
    to concentrate. Furthermore, discontent can reduce working motivation. The fact
    that proper noise abatement can possibly cost a lot of money is also problematic.


    A calm working environment improves efficiency. Work at terminal stations is often
    characterized as "mental activity". Therefore the maximum load value for scientific
    work or programming is 55 dB (A). The dB (A) represent a weighted evaluation of
    the acoustic pressure. The A-filter curve most resembles human perception. An
    increase of the sound level by 10 dB (A) is normally perceived as a duplication
    of volume.


    +   - Because mainly mental work is done at terminal workstations, quiet working
    materials should be used from the start.


    +   - The maximum limiting value for office work is 55 dB (A). With especially
    mental demands or necessary communication of language, as low as 35–45 dB (A)
    is required. This is the case, for instance, for specialized work, scientific
    work, or programming.


    +   - Furthermore, the evaluation level of a maximum of 55 dB (A) is important.
    If 70 dB (A) is measured for a quarter of an hour, the noise in the remaining
    time should be less than or equal to 55 dB (A).


    +   - Workstations can be equipped with partitions, sound-absorbing floors, appropriately
    wallpapered walls, curtains, and other sound-reducing features.'
  merge: -1
  pgno: 427
- img_proc: true
  md: '+   Loud working equipment, such as matrix printers, should be installed in
    sound-absorbing cases. The permissible noise levels for office equipment are determined
    in the DIN standards.


    +   An air conditioner should not increase the normal noise level.


    +   Strain caused by excessive noise can also be reduced by an organizational
    restructuring of work.


    # 26.2 Office Equipment


    # 26.2.1 Buying a Screen


    If you already have poor sharpness of vision, low-quality screens can make things
    worse. Apart from eye problems, tension, fatigue, and many other disorders can
    be caused.


    The latest technological developments are triton, or black-matrix, screens and
    TFT flat screens. Unfortunately, flat screens are still relatively expensive.
    There are extensive standards that regulate the readability of the depicted information.
    When buying a screen, it is recommended to study the extensive standards to avoid
    a wrong purchase. One thing is certain: a good screen is usually expensive. The
    normal tube screens do not last forever. They only retain their focus and contrast
    for a few years.


    +   All depicted characters should be sharply defined and clearly legible to the
    edges of the screen. A positive representation (dark characters on a light background,
    as in a book) is recommended.


    +   As the depicted characters must be large enough, a 17-inch monitor is recommended,
    at least for graphical user interfaces (like KDE). For the processing of CAD,
    layout, and graphics, it should be 21 inches.


    +   It is especially important that the screen does not flicker. In concrete terms,
    the minimum sync frequency with 15-inch monitors should be at least 73 Hz. However,
    85 Hz is recommended. For larger screens, such as 21-inch, 100 Hz is a good value.


    +   Luminosity and contrast should be variable. The focus of the characters should
    not differ with adjustments of brightness or contrast.


    +   The image should be free from distortion and show no color errors.'
  merge: -1
  pgno: 428
- img_proc: true
  md: '+   - To avoid reflex glare, a good antireflective coating of the screen-face
    is recommended.


    +   - The screen should be rotatable and inclinable. A vertical adjustment is
    recommended.


    +   - Colors make the displayed information easier to comprehend. However, the
    display of colors can also be straining for the eyes because different colors
    are refracted differently by the lenses. For red-colors, people are farsighted,
    but for blue-colors people are nearsighted. Older screens often have convergence
    errors — the three beams of the screen tube are no longer aligned precisely, so
    colored borders appear around letters, for example.


    +   - Electromagnetic radiation emitting from the screen should be kept to a minimum.


    # 26.2.2 Screen Location


    A screen put in the wrong place leads to a cramped posture at work, which can
    cause illnesses. A work table that has insufficient depth prevents the screen
    from being placed reasonably. The natural position of the head and arms is designed
    for work that lies in front of the body.


    Ergonomics specialists have developed their own guidelines for the “vision and
    gripping area.” These reject placing the screen to the side. An exception is only
    when the screen is rarely used. A reason for this placement is the fact that even
    the required minimum 80 cm worktable depth is insufficient in many working documents.
    Often the screen is placed — as shown in many PC pictures — on top of the computer
    case. This also leads to an unnatural posture. Observe yourself while you are
    reading. Are you looking straight ahead or slightly down?


    +   - Shoulder, keyboard, and screen should be in one line so you always look
    directly at the screen. This rule does not necessarily need to be observed all
    the time.


    +   - Ultimately, the workstation should be indually adapted to the person and
    the working task. Flexibility is the key. Easily movable, rotatable, and, ideally,
    screens that retract into the table are encouraged.


    +   - A comfortable visual distance varies individually. At least 50 cm is required.
    Some people need considerably more.'
  merge: -1
  pgno: 429
- img_proc: true
  md: '+   It is a good idea for users to look away from the screen from time to time.
    In this way, their eyes can adapt to a different distance.


    +   If a document is being copied, it should be at the same distance as the screen
    to avoid frequent changes of focus.


    +   The difference in luminance between the direct working area, the screen, and
    the immediately surrounding areas, such as the screen case, should not be more
    than three to one. For this reason, computer cases in offices are not black. The
    difference between the working area and the surroundings should not be more than
    ten to one.


    +   Shiny areas create large differences of luminance. This is why office furniture
    is not available in bright colors and has a matt surface.


    +   To minimize the reflex glare on the screen, the screen and the keyboard should
    be arranged so that the line of vision is parallel to window panes. The further
    the screen is away from the window, the better.


    +   The screen should not be directly under a lighting strip, but to the side
    of it. The line of vision should be parallel to the lighting strip.


    # 26.2.3 The Keyboard and the Wrists


    It is well-known that the keyboard arrangement derived from the typewriter is
    not necessarily ergonomic. During typing, the fingers, hands, arms, and shoulders
    are strained. The strain caused by a keyboard of inferior quality adds up over
    time. Unfortunately, the tiny movements produced while typing are very difficult
    to measure. Risk factors include the RSI syndrome.


    The keyboard is, without doubt, the most frequently-used computer input device.
    Therefore, it must be especially well-designed. Ergonomic specialists often cite
    the fact that the `Shift` and `Enter` keys are too small. Another basic problem
    is the cable, which is often too short, preventing a comfortable individual placement.
    Consider buying a wireless keyboard or extension for the cable.


    +   The keyboard should be separate from the screen. It should also be inclable,
    but set in a stable position (sufficiently large, rubber-coated feet).


    +   The middle key row should not be more than 30 mm above the surface of the
    table.'
  merge: -1
  pgno: 430
- img_proc: true
  md: '+   There should be room to rest your hands in front of the keyboard. If there
    is no built-in wrist pad, get one.


    +   The marking must contrast with the color of the plastic and be easy to read.
    The keyboard should have no intense color and a satin-matt finish.


    +   For the keyboard legend, a dark script on a light background is recommended.
    Black keys are not ergonomic.


    +   The form of the keys should enable light and accurate typing. The lift of
    key should be 2-4 mm and the working point should be distinctly felt. Here 50-80
    g is recommended as the force of the key depression stroke.


    +   Those who type a lot take regular breaks.


    +   Learning the touch system helps because the workload is distributed across
    all fingers.


    +   Split or individually separable keyboards are something to which you have
    to get accustomed, but nevertheless are an alternative worth considering. They
    have been constructed according to the latest ergonomic findings and are already
    recommended in some standards. They prevent wrist strain to the side.


    +   The keyboard of a notebook or laptop cannot correspond to the standards because
    of the crowded keys. A notebook should not be used as workstation equipment unless
    it is linked to an external keyboard and mouse.


    # 26.2.4 The Mouse


    Due to the advance of graphical user interfaces, users are practically forced
    to use a mouse. The intensive use of the mouse can cause not only fatigue, but
    also disorders in the hands, arms, and shoulders. An example of this is RSI. The
    danger increases when a “bad” mouse is used. So far, there are no commonly accepted
    standards for an ergonomic mouse. Often a PC is sold with the standard mouse.
    This mouse should certainly be examined closely. Is the mouse really suitable
    or should it be replaced by a better one? Have the dealer unpack several for you
    to try. The cable is probably too short. Ask the dealer to give you an extension.
    Evaluate your own mouse use. Can you reduce the use of the mouse? Many professional
    programs with a lot of interaction do without any mouse clicks. Learn how to use'
  merge: -1
  pgno: 431
- img_proc: true
  md: 'shortcuts to operate programs. It takes time to learn, but you can work up
    to four times as fast. Often a combination of mouse and keyboard operation is
    recommended.


    +   - The ergonomic mouse feels good in your hand. The keys should not be too
    close or too small. There are even mice for children''s hands.


    +   - Your fingers should be able to rest on the keys in a relaxed position.


    +   - The mouse should be next to the keyboard. Left-handed users have an advantage
    because the keyboard has several function keys and the numerical key between letter
    keys and a mouse on the right side. These extend the gripping distance. If you
    are left-handed, get a mouse for left-handers.


    +   - The cable should be long enough. If necessary, purchase an extension. A
