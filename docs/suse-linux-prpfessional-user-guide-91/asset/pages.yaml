    Figure 14.1: The Initial Browser Window


    In its default configuration, the window presented by the browser includes these
    elements: the actual document window, occupying the majority of the window, used
    to display web pages (although it may be empty at the outset), the menu bar, the
    navigation toolbar, and the personal toolbar. There is also a combined status
    and component bar at the bottom of the window. Finally, to the left of the document
    window, Mozilla provides a sidebar that contains a number of different tabs, each
    of them giving access to a particular task.


    When you right-click in the document window, Mozilla opens a context menu with
    a number of entries. Use this menu, for example, to add the current page to your
    bookmarks (‘Bookmark This Page’) or to view its source code (''View Page Source'').


