  md: '# Default Section


    With this option, by default, if no other entry is selected in the boot menu,
    the default system is booted after the time-out. Click this option and ‘Edit’
    to see a list of all boot entries. Then select one entry from the list and click
    ‘Set as Default’. Click ‘Edit’ to modify an entry. The dialog that opens allows
    changing the order of entries in the boot menu, adding, modifying, and deleting
    entries, and setting a default entry.


    # Available Sections


    The existing entries of the boot menu are listed under this option in the main
    window. If you select this option then click ‘Edit’, a dialog opens that is identical
    to the ‘Default Entry’ dialog.


    # Make Boot Loader Partition Active


    Use this option to activate the partition whose boot sector holds the boot loader,
    independently from the partition on which the directory with the helper files
    of the boot loader are stored (/boot or the root directory/).


    # Replace Code in MBR


    Specify whether to overwrite the MBR, which may be necessary if you have changed
    the location of the boot loader.


    # Backing up Files and Parts of Hard Disks


    Backs up the changed hard disk areas.


    # Add Saved MBR to Boot Loader Menu


    Adds the saved MBR to the boot loader menu.


    Using ‘Time-out’, define for how many seconds the boot loader should wait for
    entries before the default system is booted. A number of other options can be
    specified with ‘options’. However, the use of these options requires a deeper
    understanding and is not covered here. Refer to the relevant chapter in the Administration
    Guide and the manual pages of GRUB and LILO (man grub, man lilo, and man lilo.conf).
    Additionally, a detailed online manual for GRUB is available at http://www.gnu.org/software/grub/


    # 4.85 LVM


    The Logical Volume Manager (LVM) is a tool for individually partitioning hard
    disks by means of logical drives. As this is a genuine expert tool, no additional
    information is provided within the scope of this user guide. For information,
    refer to the Administration Guide.'
  merge: -1
  pgno: 142
- img_proc: true
