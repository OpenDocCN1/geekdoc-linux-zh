  md: '![](img/705a076b108ea96be0c0695efb5556ce_211_0.png)


    Figure 7.4: The Navigator in Writer


    # 7.6.4 Working with the Stylist


    The Stylist can help you format text in a number of ways. It can be opened or
    closed at any time by toggling ''Format'' -> ''Stylist'' or by pressing (F11).
    The dialog window of the Stylist is shown in Figure 7.5 on the facing page.


    If you set the drop-down list at the lower edge of the Stylist to ''Automatic'',
    OpenOffice.org tries to offer a selection of styles adapted to the task at hand.
    On the other hand, if you select ''All'', the Stylist offers all styles from the
    currently active group. Groups are selected with the buttons at the top. Text
    can be hard-formatted or soft-formatted:


    Hard Formatting Formatting properties are directly assigned to a text range and
    each property must be applied to each range is static and can only be changed
    manually. This is only recommended for short documents.


    Soft Formatting With this method, text is not formatted directly. It has a style
    applied to it. The style itself can be modified quite easily. Modifying a style
    automatically results in a formatting change of all the text to which it is assigned.
    This approach has many advantages for creating larger documents (these, books,
    and the like). Although not intuitive, it is very efficient and fast if the formatting
    needs to be changed extensively and consistently. Using this method makes it much
    easier to try different layouts with the document. Define the format of paragraphs,
    pages, and frames for a style and select fonts and numbering methods.'
