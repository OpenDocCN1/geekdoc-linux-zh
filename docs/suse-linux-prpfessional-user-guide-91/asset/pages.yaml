- img_proc: true
  md: '# 3.1 Starting YaST System Repair


    Because it cannot be assumed that a damaged system can boot by itself and a running
    system cannot be easily repaired, the YaST System Repair utility is run from the
    SUSE LINUX installation CD or DVD. Follow the steps outlined in Chapter 2 on page
    11 to get to the dial page offering the various installation options and select
    ''Repair Installed System''. See Figure 3.1.


    ![](img/705a076b108ea96be0c0695efb5556ce_65_0.png)


    Figure 3.1: Selecting the YaST System Repair Utility


    > Because the test and repair procedure is loaded from CD or DVD, it is essential
    to run it from an installation medium that exactly corresponds to your installed
    version of SUSE LINUX.


    In the next step, choose how the system repair should be performed. The following
    options are available and are described below:


    +   - Automatic repair

    - User-defined repair

    - Expert tools'
  merge: -1
  pgno: 65
- img_proc: true
  md: '# 3.2 Automatic Repair


    This method is best suited to restoring a damaged system with unknown cause. Selecting
    it starts an extensive analysis of the installed system, which will take some
    time due to the large amount of tests and examinations. The progress of the procedure
    is displayed at the bottom of the screen with two progress bars. The upper bar
    shows the progress of the currently running test. The lower bar shows the overall
    progress of the analysis process. The log window allows above tracking of the
    currently running activity and its test result. See Figure 3.2 on the following
    page. The following main tests are performed with every run. They contain, in
    turn, a number of individual subtests.


    Partition tables of all hard disks The validity and coherence of partition tables
    of all detected hard disks are checked.


    Swap partitions The swap partitions of the installed system are detected, tested,
    and offered for activation where applicable. The offer should be accepted for
    the sake of a higher system repair speed.


    File systems All detected file systems are subjected to a file system-specific
    check.


    Entries in the file /etc/fstab The entries in the file are checked for completeness
    and consistence. All valid partitions are mounted.


    Boot loader configuration The boot loader configuration of the installed system
    (GRUB or LILO) is checked for completeness and coherence. Boot and root devices
    are examined and the availability of the initrd modules is checked.


    Package database This checks whether all packages necessary for the operation
    of a minimal installation are present. While it is optionally possible to also
    analyze the base packages, this takes a long time because of their vast number.


    Whenever an error is encountered, the procedure is stopped and a dialog opens,
    offering details and possible solutions. It is not possible to describe all these
    cases. Read the notifications on the screen carefully and choose the desired action
    from the list options. It is also possible to decline the offered repair action
    in cases of doubt. The system remains unaltered in this and no repair is ever
    performed automatically without prompting the user.'
  merge: -1
  pgno: 66
- img_proc: true
  md: '![](img/705a076b108ea96be0c0695efb5556ce_67_0.png)


    # # 3.3 User-Defined Repair


    The automatic repair explained in the preceding section categorically performs
    all tests. This is useful if the extent of the system damage is unknown. However,
    if you already know what part of the system is affected, the range of the applied
    tests can be narrowed. Choosing ‘User-defined’ shows a list of test runs that
    are all marked for execution at first. The total range of tests matches that of
    automatic repair. If you already know where no damage is present, unmark the corresponding
    tests. Clicking ‘Continue’ then starts a narrower test procedure that probably
    has a significantly shorter running time.


    Not all test groups are applicable individually. The analysis of the fstab entries
    is always bound to an examination of the file systems, including existing swap
    partitions. YaST automatically satisfies such dependencies by selecting the smallest
    amount of necessary test runs.'
  merge: -1
  pgno: 67
- img_proc: true
  md: '# 3.4 Expert Tools


    If you are knowledgeable with SUSE LINUX and already have a very clear idea of
    what needs to be repaired in your system, directly apply the tools necessary for
    repairing it by choosing ‘Expert tools’.


    Install new boot loader starts the YaST boot loader configuration module. Details
    can be found in Section 4.8.4 on page 120


    Run partitioning tool This starts the expert partitioning tool in YaST. Details
    can be found in Section 2.5.5 on page 22


    Fix file system This allows checking the file systems of your installed system.
    You are first offered a selection of all detected partitions and can then choose
    the ones to check.


    Restore lost partitions It is possible to attempt a reconstruction of damaged
    partition tables. A list of detected hard disks is presented first for selection.
    Clicking ‘OK’ starts the examination. This can take a depending on the processing
    power and size of the hard disk.


    > Note

    The reconstruction of a partition table is tricky. YaST attempts to recognize
    lost partitions by analyzing the data sectors of the hard disk. The lost partitions
    are added to the rebuilt partition table upon successful recognition. This is,
    however, not successful in all imaginable cases.

    Note


    Save system settings to disk This allows saving important system files to a floppy
    disk. Should one of these files become damaged, it can be restored from disk.


    Check installed software This checks the consistency of the package database and
    the availability of the most important packages. Any damaged installed packages
    can be reinstalled with this tool.'
  merge: -1
