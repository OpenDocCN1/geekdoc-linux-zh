    To move a message into a folder, select the message to move. Right-click

    to open the context menu. Select ''Move to Folder...'' and, in the dialog that

    opens, the destination folder. Click ''OK'' to move the message. The message

    header in the original folder is shown with a line through it, meaning it is

    marked for deletion if that. The message is stored in the new folder.

    Messages can be copied in a similar manner.


    Manually moving a number of messages into different folders can be time-

    consuming. Filters can be used to automate this procedure.


    # 17.4.6 Filters


    Evolution offers a number of options for filtering e-mail. Filters can be used

    to move a message into a specific folder or delete a message. Messages

    can also be moved directly to the trash with it. There are two options

    for creating a new filter: creating a filter from scratch or creating a filter

    based on a message to filter. The latter is extremely useful for filtering mes-

    sages to a mailing list.


    # Setting up a Filter


    Select ''Tools'' -> ''Filters''. This dialog lists your existing filters, which
    can be

    edited or deleted. Click ''Add'' to create a new filter.


    Enter a name for the new filter in ''Rule Name''. Select the criteria to use for

    the filter. Options include sender, recipients, source account, subject, date,

    and status. The drop-box showing ''Contains'' provides a variety of options,

    which contains, and is not. Select the appropriate condition. Enter the

    text for which to search. Click ''Add criterion'' to add more filter criteria.

    Use ''Execute actions'' to determine if all or some of take the criteria must
    be

    met to apply the filter.


    In the lower part of the window, determine the action to take when the fil-

    ter criteria are met. Messages can, for example, be moved or copied to a

    folder or assigned a special color. When moving or copying, select the des-

    tination folder by clicking. In the folder that appears, select the folder.

    Use ''New'' to create a new folder. Click ''OK'' when the correct folder is-

    lected. When finished creating the filter, click ''OK''.


