  md: '# 25.2.6 Access Control Lists


    The traditional permission concept for Linux file system objects, such as files
    or directories, can be expanded by means of ACLs (access control lists). They
    allow the assignment of permissions to individual users or groups other than the
    original owner or owning group of a file system object.


    Files or directories bearing extended access permissions can be detected with
    a simple `ls -l` command:


    ```

    -rw-r---- 1 tux project3 14197 Jun 21 15:03 Roadmap

    ```


    The output of `ls` does not reveal much of a change compared to an `ls` on a file
    without an ACL. Roadmap is owned by tux belongs to the group project.3, tux holds
    both write and read access to this file and his group as well as all others have
    read access. The only difference that distinguishes this file from a file without
    an ACL is the + in the first column holding the permission bits.


    Get details about the ACL by executing `getfacl` Roadmap:


    ```

    # file: Roadmap

    # owner: tux

    # group: project3

    user:rw-

    user:jane-rw effective:r--

    group:r---

    group:django-rw effective:r--

    mask:r---

    other:-

    ```


    The first three lines of the output do not hold any information not available
    with `ls -l`. These lines only state file name, owner, and owning group. Lines
    4 to 9 hold the ACL entries. Conventional access permissions represent a subset
    of those possible when using ACLs. Our example ACL grants read and write access
    to the owner of the file as well as a user jane (lines 4 and 5). The conventional
    concept has been expanded access to an extra user. The same applies to the handling
    of group access. The owning group holds read permissions (line 6) and the group
    django holds read and write permissions. The mask entry in line 8 reduces the
    effective permissions for the user jane and the group django to read access. Other
    users and groups do not get any kind of access to the file (line 9).


    Only very basic information has been provided. Find further background information
    about ACLs in the Administration Guide.'
  merge: -1
  pgno: 411
