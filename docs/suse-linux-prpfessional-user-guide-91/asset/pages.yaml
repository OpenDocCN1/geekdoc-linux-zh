    chmod [options] mode file(s)


    Changes the access permissions.The mode parameter has three parts: group, access,
    and access type. group accepts the following characters:


    +   u user

    g group

    o others


    For access, grant access with + and deny it with -. The access type is controlled
    by the following options:


    +   r read

    w write

    x Execute — executing files or changing to the directory.

    s Set up bit — the application or program is started as if it were started by
    the owner of the file.


    As an alternative, a numeric code can be used. The four digits of the code are
    composed of the sum of the values 4, 2 and 1 — the decimal result of a binary
    mask. The first digit sets the user ID (SUID) (4), the set group ID (2), and the
    sticky (1) flags. The second digit defines the permissions of the owner of the
    file. The third digit defines the permissions of the group members and the last
    digit sets all other users. The read permission is set with 4, the write permission
    with 2, and the permission for executing a file is set with 1. The owner of a
    file would usually receive a 7 — the sum of all permissions.


