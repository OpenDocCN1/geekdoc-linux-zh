    # Changing the Installation Scope


    If you install the default system, there is usually no need to add or remove individual
    packages. This basic system consists of a software selection that meets requirements
    without any changes. If you have specific needs, modify this selection with the
    package manager. It offers various criteria for determining a selection from the
    numerous packages in SUSE LINUX.


    2.5. Installation Suggestion'
