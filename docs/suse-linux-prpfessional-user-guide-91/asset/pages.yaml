  md: '# ## 4.4.5 Hardware Information


    YaST detects hardware for the configuration of hardware components. The detected
    technical data is displayed in this screen. This is especially useful, for example,
    if you want to submit a support request for which you need information about your
    hardware.


    ![](img/705a076b108ea96be0c0695efb5556ce_108_0.png)


    Figure 4.15: Displaying Hardware Information


    # ## 4.4.6 IDE DMA Mode


    With this module, activate and deactivate the DMA mode for your IDE hard disks
    and your IDE CD and DVD drives in the installed system. This module does not have
    any effect on SCSI devices. DMA modes can substantially increase the performance
    and data transfer speed in your system.


    During the installation, the current SUSE LINUX kernel automatically activates
    DMA for hard disks but not for CD drives, as default DMA activation for all drives
    often caused problems with CD drives. If you want to activate DMA for your drives.
    If the drive supports the DMA mode without any problems, the data transfer rate
    of your drive can be increased by activating DMA.'
  merge: -1
  pgno: 108
- img_proc: true
  md: '> Note

    DMA (Direct Memory Access) means that your data can be transferred directly to
    the RAM, bypassing the processor control.


    # 4.4.7 Joystick


    Use this module to configure your joystick by selecting the manufacturer and the
    model from the displayed list. With ''Test'', check if your joystick responds
    correctly. The test dialog shows three charts for the analog axes of the joystick
    and marks for the four standard buttons. When you move the joystick or press the
    buttons, you should be able to see a reaction in the test dialog. As joysticks
    are usually connected to the sound card, you can also access this module from
    the sound card configuration.


    # 4.4.8 Mouse


    Configure your mouse with this YaST module. As the procedure for the selection
    of the mouse was already already explained within the scope of the user-defined
    installation, refer to Section 2.5.3 on page 18.


    # 4.4.9 Scanner


    If your scanner is connected and switched on, it should be detected automatically
    when this YaST module is started. In this case, the dialog for the installation
    of the scanner appears. If no scanner is detected, the manual configuration dialog
    appears. If you have already installed one or several scanners, a list of existing
    scanners can be modified or deleted. Press ''Add'' to configure a new device.


    Next, an installation is performed with default settings. If the installation
    is successful, a corresponding message will appear. Now, test your scanner by
    inserting a document and clicking ''Test''.


    # Scanner Not Detected


    Only supported scanners can be autodetected. Scanners connected to another network
    host will not be detected. The manual configuration distinguishes three types
    of scanners: USB scanners, SCSI scanners, and network scanners.'
