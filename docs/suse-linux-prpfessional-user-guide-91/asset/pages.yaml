  md: '# Address Management with KAddressBook


    KAddressBook provides quick and comfortable access to all address data of your
    contacts. As well as managing your local address data, KAddressBook can access,
    if available, a central LDAP server that hosts contact data for your entire department
    or your entire company. KAddressBook ports the import and export of vCard data,
    ensuring the smooth interaction with other programs.


    +   11.1 Creating a New Contact . . . . . . . . . . . 226

    11.2 Creating Address Lists . . . . . . . . . . . 227

    11.3 Searching Address Data . . . . . . . . . . 227

    11.4 Importing and Exporting Address Data . . . . . . 229'
