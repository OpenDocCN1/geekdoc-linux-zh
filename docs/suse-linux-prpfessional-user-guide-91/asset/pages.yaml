    To configure a specific sound, activate ''Use customized bell'' and use ''Browse...''
    to select a sound from the list.


    Visible bell For bells to be communicated visually, activate ''Use visible bell''.
    If no other modifications are performed, the screen is inverted when a system
    bell rings ''Invert screen'' is activated by default. The duration of the visual
    bell can be adjusted with the slider. Instead of the inversion, the screen can
    be set flash. To activate ''Flash screen'' and select a suitable color in the
    color editor by clicking the color bar.


    Sticky Keys Some shortcuts require a key to be held down (this is the case with
    `Alt`, `Ctrl`, and `Shift`) while the second part of the shortcut is entered.
    If sticky keys are used, the system considers these keys to be pressed continuously
    even if they are only pressed once.


    Slow Keys Here, determine if and to what extent the system delays the output of
    characters on the screen when a key is pressed. The longer the interval adjusted
    with the slider, the longer a key can be pressed without triggering a repeated
