- img_proc: true
  md: '# 5.1.7 The Windows


    The windows of all KDE applications have the same structure. The title bar features
    four buttons in the right corner. The question mark provides access to context
    help. If you click the question mark then an an icon of the application, a short
    help text is displayed. The button with the black dash minimizes the window. A
    minimized window is placed in the panel but not terminated. Display it and continue
    to use it by clicking the icon in the taskbar. The button with the square maximizes
    the window over the entire screen area. Another click on this symbol restores
    the window to its former size. X closes the window and terminates the application.


    Windows can be moved, enlarged, or downsized. Click the title bar and keep the
    left mouse button pressed to move the window on your screen. If you right-click
    the top bar, a configuration menu is displayed. To change the size of the window,
    move the mouse pointer along one of the four edges of the window until the mouse
