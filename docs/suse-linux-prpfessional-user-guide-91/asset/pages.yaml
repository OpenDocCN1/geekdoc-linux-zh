    from the first menu and ''contains'' in the second. Enter then the e-mail

    address to filter. Activate ''Applies to all''.


    +   3. Select the action to execute (move, delete, etc.).


    You have now created a filter that transfers all mails from Fred Johnson on

    the KDE user list as specified.


    # 16.10.3 Spam Filters


    While electronic mail has many advantages, it has a significant disadv-antage:
    spam. Unsolicited mass mailings, also known as spam, sent by the

    advertisement industry, clog your inbox and cause long trans-fer times. Filtering
    tools can separate the annoying ballast from important

    messages. SpamAssassin is such a tool that can be embedded into KMail.

    It relies on various built-in rules and has the ability to learn from its expe-rience
    with spam. The configuration of this useful application for KMail is described
    here.'
