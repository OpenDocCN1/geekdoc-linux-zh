  md: '# Help and Documentation


    The SUSE Help Center provides central access to the most important documentation
    resources on your system in searchable form. These resources include all manuals
    enclosed with your product, online help for the installed applications, and databases
    on hardware and software issues in connection with SUSE LINUX.


    # Using the SUSE Help Center


    When you start the SUSE Help Center for the first time from the main menu (''SUSE
    Help''), the view as shown in Figure A.1 on the following page is displayed. The
    dialog window consists of three main areas:


    **Menu Bar and Toolbar** The menu bar provides the main editing, navigation, and
    configuration options. ''File'' contains the option for printing the currently
    displayed content. Under ''Edit'', access the search function. ''Go'' contains
    all navigation possibilities: ''Home'' (home page of the Help Center), ''Back'',
    ''Forward'', and ''Last Search Result''. With ''Settings''-> ''Configure KDE Help
    Center'' -> ''Create Search Index'', generate a search index for all selected
    information sources. The toolbar contains three navigation icons (forward, back,
    home) and a printer icon for printing the current contents.


    **Navigation Area with Tabs** The navigation area in the left part of the window
    provides an input field for a quick search in selected information sources. Details
    regarding the search and the configuration of the search function in the ''Search''
    tab are presented in Section A on page 417. The ''Contents'' tab presents a tree
    view of all available and installed information sources. Click the book icons
    to open and browse the individual categories.'
  merge: -1
