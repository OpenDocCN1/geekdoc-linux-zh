  md: '# 2 Custom Installation


    Note If you have optimized virtual memory settings for Windows in such a way that
    a contiguous swap file is used with the same initial (minimum) and maximum size
    limit, consider another step. With these Windows settings, the resizing might
    have the effect that the swap file is split into many small parts scattered all
    over the FAT partition. Also, the entire swap file would need to be moved during
    resizing, which makes the process rather slow. It is therefore useful to unset
    these Windows optimizations for the time being and reenable them after the resizing
    has completed.


