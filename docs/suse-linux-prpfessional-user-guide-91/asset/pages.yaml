    # Supported Printers


    Because Linux printer drivers are not written by the maker of the hardware, it
    is crucial that the printer can be driven through one of the generally known languages.
    Normal printers understand at least one of these common languages. In the case
    of a GDI printer, however, the manufacturer has built a device that relies on
    its own special control sequences. Many inexpensive jet models belong to this
    group. A printer only runs out of the box under the versions of the operating
    systems for which the manufacturer has included a driver. As the device cannot
    be operated through one of the standard languages, it cannot be used with Linux
    or can only be used with difficulties.


    Nevertheless, a number of these printers are supported by SUSE LINUX. However,
    their use is often problematic and some features might not be available at all,
    for example, the printer could be limited to low monochrome printing. The following
    list includes the GDI models that can be directly configured with YaST. Because
