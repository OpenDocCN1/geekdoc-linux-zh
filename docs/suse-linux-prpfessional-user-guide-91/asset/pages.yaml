  md: '# # 3 YaST System Repair


    Despite its robustness, the SUSE LINUX system can be damaged by configuration
    blunders or other "accidents". While this is quite unlikely when logged in as
    a regular user, the superuser root is allowed to change all system files and configuration,
    making it possible for him to accidentally cause damage. There are good chances
    of putting the system back on track with the YaST System Repair in such a case.
    It is impossible to correct all imaginable defects, but many of the common problems
    can be solved.


    +   3.1 Starting YaST System Repair . . . . . . . . . . . . . 46

    3.2 Automatic Repair . . . . . . . . . . . . . . . . . 47

    3.3 User-Defined Repair . . . . . . . . . . . . . . . 48

    3.4 Expert Tools . . . . . . . . . . . . . . . . 49'
  merge: -1
