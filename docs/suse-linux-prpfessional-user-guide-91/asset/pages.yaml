- img_proc: true
  md: '# 6.3.2 File Management


    Nautilus supports dragging and dropping for managing files. To move files from
    one directory to another, use ''New Window'' from the context menu or the ''File''
    menu in Nautilus to open two windows. Access the path of the original location
    of the objects in one window and the destination path for those files in the second
    window. To move the files, drag the files from one window to the other and drop
    them there. Copying files is a little more complicated. Right-click the object
    to copy and select ''Duplicate''. Then move the copy to the new directory. The
    context menu that appears when right-clicking an object provides functions for
    renaming files and other tasks.


    # 6.3.3 Configuring Nautilus


    Nautilus retrieves its default font and other preferences from the desktop configuration.
    To set Nautilus-specific preferences, select ''Edit'' -> ''Preferences'' in Nautilus
    window. The configuration dialog offers four tabs: ''Views'', ''Behavior'', ''Icon
    Captions'', and ''Preview''.


    The ''Views'' dialog allows switching the ''Default View'' between ''Icon View''
    and ''List View''. A sorting order can be set for any of these options.


    The ''Behavior'' dialog allows switching single-click and double-click response
    and also sets the handling of executable files. These can either be started on
    activation or the content dialog. The operating mode of trash is also set here.
    Activate a confirmation dialog before deletion, if desired. ''Include a Delete
    command that bypasses trash'' can also be set. The files are immediately deleted
    if this option is activated.


    The ''Icon Captions'' dialog features three options for determining what information
    should be displayed for icons and how it should be displayed. In the ''Preview''
    dialog, select whether to activate preview thumbnails for certain file types.


    # 6.4 Important Utilities


    GNOME features a wealth of applets and applications. This section provides an
    introduction to the most useful and interesting, all of which are compatible with
    the GNOME configuration scheme.'
  merge: -1
  pgno: 198
