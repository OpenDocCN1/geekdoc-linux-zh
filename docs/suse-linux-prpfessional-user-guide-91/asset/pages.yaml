  md: '# 25.2 Users and Access Permissions


    Since its inception in the early 1990s, Linux has been developed as a multi-user
    system. Any number of users can work on it simultaneously. This resulted in some
    notable distinctions from the Microsoft end-user Windows operating systems.


    The most important distinguishing feature is the necessity for users to log in
    to the system before starting a session at their workstation. Each user has a
    user name with a corresponding password. This differentiation of users guarantees
    that unauthorized users cannot see files for which they do not have permission.
    Larger changes to the system, such as installing new programs, are usually impossible
    or restricted for normal users. The only *root* user, or *super user*, has the
    unrestricted capacity to make changes to the system and has unlimited access to
    all files. Those who use this concept wisely, only logging in with full root access
    when necessary, can cut back the risk of unintended loss of data. Because under
    normal circumstances only root can delete system files or format hard disks, the
    threat from the Trojan horse effect or by accidentally entering destructive commands
    can be significantly reduced.


    # 25.2.1 File System Permissions


    Basically, every file in a Linux file system belongs to a user and a group. Both
    of these proprietary groups and all others can be authorized to write, read, or
    execute these files.


    A group, in this case, can be defined as a set of connected users with certain
    collective rights. For example, call a group working on a certain project project3.
    Every user in a Linux system is a member of at least one proprietary group, normally
    users. There can be as many groups in a system as needed, but only root is to
    add groups. Every user can find out, with the command groups, of which he is a
    member.


    File Access The organization of permissions in the file system differs for files
    and directories. File permission information can be displayed with the command
    `ls -l`. The output could appear as in Output 25.1.


    Example 25.1: Sample Output Showing File Permissions


    ```

    -rw-r----- 1 tux project3 14197 Jun 21 15:03 Roadmap

    ```'
  merge: -1
  pgno: 406
- img_proc: true
  md: 'As shown in the third column, this file belongs to user tux. It is assigned
    to the group project 3. To discover the user permissions of the Roadmap file,
    the first column must be examined more closely.


    | Type | Users Permissions | Group Permissions | Permissions for Other Users |


    This column is comprised of one leading character followed by nine characters
    grouped in threes. The first of the letters stands for the type of file system
    component. The dash (&8211;) shows that this is a file. Directory (d), a link
    (l), a block device (b), or a character device could also be indicated.


    The next three characters follow a standard pattern. The first three characters
    refer to whether the file is readable (r) or not (&8211;). w in the middle symbolizes
    that the corresponding object can be edited and a dash (&8211;) means it is not
    possible to write to the file. An x in the third position denotes that the object
    can be executed. Because the file in this example is a text file and not one that
    is executable, access for this particular file is not needed.


    In this example, tux, as owner of the file Roadmap, read (r) and write access
    (w) to it, but cannot execute it (x). The members of the group project 3 can read
    the file, but cannot modify or execute it. Other users do not have any access
    to this file. Other permissions can be assigned by means of ACLs (Access Control
    Lists). See Section 25.2.6 on page 392 for details and refer to the chapter in
    the Administration Guide for further background information.


    Directory Permissions Access permissions for directories have the type d. For
    directories, the individual permissions have a slightly different meaning.


    # Example 25.2: Sample Output Showing Directory Permissions


    ```

    drwxrxr-x 1 tux3 35 Jun 21 15:15

    ProjectData

    ```


    In 25.2, the owner (tux) and the owning group (project 3) of the directory ProjectData
    are easy to recognize. In contrast to'
  merge: -1
