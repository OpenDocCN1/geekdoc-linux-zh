    # Pointer Acceleration and Pointer Threshold


    The pointer acceleration defines the relation between the speed of the input device
    (mouse) and the speed of the pointer on the screen. The higher the selected factor
    is, the more difficult it is to control the screen pointer. The threshold (in
    pixels) specifies the distance the pointer must cover before indicated pointer
    acceleration is activated. In this way, control the mouse pointer easily when
    covering small distances and cover large distances on the screen with small movements.


    Double Click Interval Here, set the maximum interval between two mouse clicks
    that should still be interpreted as a double-click.


