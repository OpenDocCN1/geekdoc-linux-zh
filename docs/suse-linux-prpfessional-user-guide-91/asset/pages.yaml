- img_proc: true
  md: 'This system can also be used to schedule a time that fits all attendees or
    to reserve resources. For more information about the scheduling functions, refer
    to the internal help.


    # 17.5.3 Adding Tasks


    Evolution helps to keep track of your tasks. To add a new task to your list, click
    ''New Task''. Enter summary information, due start dates, and a description. Enter
    task status and other information under ''Details''. Click ''Save and Close''
    to add the task to your list. Double-click the task to reopen the dialog and make
    changes or mark it as completed.


    # 17.6 Contacts


    # 17.6.1 Adding Contacts


    Along with the name and e-mail, Evolution can store other address and contact
    information about a person. The e-mail address of a sender can be quickly added
    by right-clicking the marked address in the message preview. Select ''Add to Contacts''
    and confirm the inclusion in the following pop-up. To enter more information,
    click ''Edit Full'' to open the contact editor. Otherwise, click ''OK''. If you
    have selected ''Edit Full'', click ''Save and Close'' to edit the contact editor
    when you are finished.


    To enter a completely new contact, click ''New Contact'' in the ''Contacts'' view.
    Enter all desired contact information. Click ''Save and Close'' when finished.


    # 17.6.2 Making a List


    If you frequently send e-mail messages to a group of people, make this easier
    by creating a list. Click ''New'' -> ''Contact List'' in the ''Contacts'' view.
    The contact list editor opens. Enter a name for the list. Add addresses by typing
    the address in the box and clicking ''Add'' or by dragging contacts from the ''Contacts''
    view and dropping them in. Toggle ''Hide addresses'' to see whether the recipients
    can see who has received the mail. Click ''Save and Close'' when finished. The
    list is now one of your contacts and appears in the composition window after the
    first few letters are typed.'
  merge: -1
  pgno: 301
- img_proc: true
  md: '# 17.6.3 Sharing Contacts


    To send contact information from your address book to another Evolution user,
    right-click the contact to share. Select ‘Forward Contact’. This sends the contact
    card as an attachment in an e-mail. Compose and send this message as usual. To
    add a contact you have been sent, to the contact in the e-mail message and click
    ‘Save in addressbook’ to add the complete contact card to your address book.


    # 17.7 Public Address Books in Evolution


    By means of the LDAP protocol, Evolution can access public address books, such
    as those used by SUSE LINUX Openexchange Server or Microsoft Exchange. Evolution
    offers full access to these address books—it can read them and add new entries.
    If you use SUSE LINUX in a large network (e.g., in your company), do not hesitate
    to make use of this possibility.


    +   Note


    > Some specific information about your network is required for configuring LDAP
    access. Obtain this information from the responsible system administrator.


    To configure access to an LDAP server from your workstation, select ‘Tools’ ->
    ‘Settings’ -> ‘Directory Servers’. Previously configured LDAP accesses are listed
    in the overview. Click ‘Add’ to add a new LDAP access. A configuration assistant
    starts, helping configure the LDAP access in a few seconds. Exit the welcome screen
    of the assistant with ‘Next’ and specify the following settings in the dialogs:


    **Server Information** Enter the server name and the login method for the LDAP
    server. The default method is anonymous access.


    **Connecting to the Server** Enter the port number and the security protocols
    (SSL or TLS) to use.


    **Searching the Directory** Enter the base search, the search range, the search
    duration, and possibly, a limitation of the displayed hits.


    **Display Name** In this last step, enter the name under which the selected server
    should appear in the list. Close the assistant with ‘Next’ and ‘Finish’.'
  merge: -1
  pgno: 302
