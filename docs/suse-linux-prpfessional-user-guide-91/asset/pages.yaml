  md: '# Welcome


    Congratulations for selecting SUSE LINUX. A few clicks are all that is needed
    to prepare the installation, which takes fifteen to twenty minutes. After configuring
    the users and their passwords and selecting the screen resolution, your SUSE LINUX
    system is ready for use. If you are familiar with earlier versions of SUSE LINUX,
    you will notice how the configuration with the system assistant YaST has expanded
    and simplified.

    The simple quick installation is explained first. If you have special wishes in
    connection with the programs to install, the partitioning of your hard disk, or
    other features, read the chapter about the custom installation. YaST additionally
    facilitates the configuration and administration of your hardware, Internet access,
    and system — without repeated reboots.

    Get to know the graphical desktop environments KDE and GNOME and learn how to
    adapt them to your personal preferences. The following sections introduce some
    very useful and interesting programs from the large range of applications, including
    office programs such as OpenOffice.org, web browsers, file managers, scanning
    tools, and image editing tools.

    Additionally find information about the SUSE help system and the available information
    sources containing further documentation. Also included are a list of frequently
    asked questions about SUSE LINUX and a glossary of the most important terms from
    the world of computers and Linux.


    # Changes in the User Guide


    The documentation of the previous version (SUSE LINUX 9.0) has been modified as
    follows:'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'The instructions for the installation and configuration with YaST have been
    updated.


    Due to new features, the following chapters have undergone substantial editing:


    +   - The KDE desktop: everything about KDE.


    The following chapters are new in this edition:


    +   - A section about Kopete, an instant messenger application, has been added.


    +   - A section explains the configuration of SPAMAssassin in KMail.


    +   - The section about gqcam shows how to create picture series with webpages.


    # Typographical Conventions


    The following typographical conventions are used in this book:


    +   - /etc/passwd: files or directories


    +   - (placeholder): replace the character string <placeholder> (including the
    angle brackets) with the actual value


    +   - PATH: an environment variable


    +   - 1s: commands


    +   - user: users


    +   - Alt: a key to press


    +   - ''File'': menu items, buttons


    # Acknowledgements


    With a lot of personal commitment, the Linux developers continue to promote the
    development of Linux. We would like to express our sincere gratitude for their
    efforts. Without them, this distribution would not exist. Additional thanks go
    to Frank Zappa and Pawar. Special thanks, of course, to LINUS TORVALDS.


    Have a lot of fun!


    Your SUSE Team'
  merge: -1
