  md: '# 19.1 The ALSA PCM Types


    As of 0.9 of the Advanced Linux Sound Architecture (ALSA), the concept for PCM
    devices was fundamentally modified and expanded. PCM is an acronym for "Pulse
    Code Modulation" and designates the output interfaces when relating to sound cards.
    The user can influence the way ALSA addresses the sound card by selecting a specific
    PCM type. The main PCM types are hw and plughw.


    To understand the difference between the two types, consider how a PCM device
    is opened. It must be opened with specific settings for at least the following
    parameters: sample format, sample frequency, number of channels (previously referred
    to as fragments), and size of a period. For example, an application may attempt
    to play a WAV file with a sample frequency of 44.1 kHz although the sound card
    does not support this frequency. In this case, ALSA can automatically convert
    the data in the plug-layer to a format supported by the sound card. The conversion
    affects the following parameters: sample format, sample frequency, and number
    of channels.


    Activate the plug-layer by selecting the PCM type plughw. If the PCM type hw is
    selected, ALSA tries to open the PCM devices directly with the parameters required
    by the application. The complete designator for a PCM device consists of the PCM
    type followed by a colon, the card number, and the device number, for example,
    plughw:0,0.


    The dmix output plug-in is a recent addition to the PCM types. It allows applications
    to share access to a PCM device on sound cards that do not support this natively.
    The complete identifier in this case is plug:dmix. More information about dmix
    can be found at http://alsa.opensrc.org/index.php?page=DmixPlugin.


    # 19.2 Mixers


    Mixers provide a convenient means of controlling the volume and balance of the
    sound output and input of computers. The main difference between the various mixers
    consists in the outer appearance of the user interface. Select one that best suits
    your needs.'
  merge: -1
  pgno: 319
