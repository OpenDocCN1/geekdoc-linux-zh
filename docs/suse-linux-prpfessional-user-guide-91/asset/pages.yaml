    Search in a remote LDAP directory


    To use this function, first configure an LDAP server in your network. Go to ''Settings''
    -> ''Configure KAddressBook'' -> ''LDAP'' to access a list of various LDAP servers.
    If no selection is offered, your system administrator for the name of the server,
    the port number, and the base DN. Enter this data in the dialog opened with ''Add
    Host''. Activate your settings with ''Apply'' and ''OK''. To start the actual
    search, click the magnifying glass icon in the upper toolbar. In the following
    dialog, select a search criterion (phone number, name, e-mail) and enter the search
    string in the adjacent input field. The result of your search appears in an overview
    below the search options. To integrate the retrieved entries in your address book,
    click the respective buttons. You can also send an e-mail message to all addresses
