  md: '# 21.1 Creating a Data CD


    Creating a data CD is easy. Go to ‘File’ -> ‘New Project’ -> ‘New Data Project’.
    The project view appears in the lower part of the window, as shown in Figure 21.1.
    Drag the desired directories or individual files from your home directory to the
    project folder and drop them there. Save the project under a name of your choice
    with ‘File’ -> ‘Save as’.


    ![](img/705a076b108ea96be0c0695efb5556ce_359_0.png)


    Welcome to K3b 0.111.5 - The CD/DVD Burning Facility


    > Figure 21.1: Creating a New Data CD


    Then select ‘Burn’ from the toolbar. A dialog with five tabs offering various
    options for writing the CD opens. See Figure 21.2 on page 342.


    # 21.2 Burning CDs


    The detected writer is displayed under ‘Device’ in the burning dialog. The burning
    speed in ‘Burning Speed’. The following options are offered here:'
  merge: -1
  pgno: 359
- img_proc: true
  md: 'Mode’ This option determines the laser writes a CD. The DAO (disk at once)
    mode, the laser is not deactivated while the CD is written. This mode is recommended
    for the creation of audio CDs. However, it is not supported by all CD writers.
    In the TA mode (track at one), a separate write process is applied for every individual
    track. The RAW mode is not used very often, as the writer does not perform any
    data corrections. The best setting is ‘automatic’, as it allows K3b to use the
    most suitable settings.


    ‘Simulate’ This function can be used to check if your system supports the selected
    writing speed. The writing is performed with the laser deactivated to test the
    system.


    ‘On the fly’ Burns the desired data without first creating an image file (do not
    use this feature on low-performance machines). An image file — also known as an
    ISO image — a file containing the entire CD content that is subsequently written
    to the CD exactly as it is.


    ‘Burnfree’ This option was formerly known as burn-proof. It helps to avoid underruns
    of a CD. If burnfree is selected, the CD writer will mark the current position
    and can return here in the event of a buffer underrun. However, this causes data
    gaps that are audible in audio CDs. It is preferable to select a suitable speed
    that avoids underruns.


    ‘Create Image File only’ This option creates an image file for this file under
    Temporary File. The image file can be written to CD at a later time. To do, use
    ‘Tools’ -> ‘Write ISO Image’. If option is used, all other options in this section
    are deactivated.


    The ‘Settings’ tab features options needed for the creation of CDs with multiple
    data or audio tracks (multisession CDs). In the ‘Name of Media’ tab, specify a
    name, description, publisher, and other details for the CD.

    Under ‘File system’, specify settings for the file system on the CD (Rock-Ridge,
    Joliet, UDF). Also determine how symbolic links, file permissions, and blanks
    are treated. In the ‘Advanced’ tab, experienced users can specify additional settings.


    # 21.3 Creating an Audio CD


    Basically, there are no significant differences between creating an audio CD and
    creating a data CD. Select ‘File’ -> ‘New Audio Project’. Drag and drop'
  merge: -1
  pgno: 360
- img_proc: true
  md: '![](img/705a076b108ea96be0c0695efb5556ce_361_0.png)


    Figure 21.2: Burning CDs with K3b


    the individual audio tracks to the project folder. The audio data must be in MP3,
