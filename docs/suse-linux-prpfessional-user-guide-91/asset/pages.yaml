  md: '# 20.1.2 From Silent Film to Sound Film


    The audio output of the TV card is connected to the line input of your sound card,
    to the speakers, or to an amplifier. Some TV cards can change the volume of the
    audio output. The volume can then be set with the sliders that appear after selecting
    ''Settings'' -> ''Slider''. This window also provides the sliders for brightness,
    contrast, and color.


    To use your sound card for audio playback, change the mixer settings using garmix,
    described in Section 19.2 on page 300. For sound cards meeting the AC97 specifications,
    set ''Input-MUX'' to ''Line''. The volume can then be adjusted with the ''Master''
    and ''Line'' sliders.


    # 20.1.3 Screen Proportions and Full-Screen Mode


    Most television images have a height and width ratio of 4:3. These proportions
    can be set with ''Tools'' -> ''Screen Dimensions''. If ''4:3'' is selected here
    (this is the default setting), the screen dimensions are retained automatically,
    when the display size is changed.

    With F or ''Tools'' -> ''Fullscreen'', switch to full-screen mode. If the TV image
    in full-screen mode is not scaled to the monitor size, some fine-tuning is required.
    Many graphics cards can scale the full-screen television image to the full monitor
    size without changing the graphical mode. If your card does not support this function,
    the graphics mode must be switched to 640x480 for the full-screen mode. Create
    the related configuration in ''Settings'' -> ''Configuration''. After restarting
    motv, the monitor mode is also changed if you have switched to full-screen mode.


    > The .xawtv file is created automatically and updated by clicking ''Settings''
    -> ''Save settings''. Here, the broadcasters are saved along with the configuration.
    More information about the configuration file can be found in the man page for
    xawtv.


    # 20.1.4 The Launcher Menu


    Use the launcher menu to start other applications to use motv. Start the audio
    mixer garmix and the video text application alevt, for example, using a keyboard
    shortcut. Applications to launch motv must be entered in the .xawtv file. The
    entries should look like this:'
  merge: -1
