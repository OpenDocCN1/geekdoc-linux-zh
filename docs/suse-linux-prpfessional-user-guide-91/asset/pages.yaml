  md: '# 5.1 Desktop Components


    The graphical desktop environment should not pose any problems for former Windows
    or Macintosh users. The main components are the icons on the desktop and the panel
    at the bottom of the screen. The mouse is your most important tool. Click a symbol
    or an icon once start the associated program or the file manager Konqueror. If
    you right-click an icon, different menus appear, depending on the program. As
    well as the icons, there are two desktop menus.


    # 5.1.1 The Desktop Menus


    If you middle-click the desktop (if your mouse only has two buttons, press both
    buttons at the same time), a window and desktop management menu are displayed.
    If you keep the mouse button pressed, select a menu item directly. Alternatively,
    release the mouse button and click the respective menu item.


    **Unclutter Windows** If you have several windows on your desktop, they are placed
    next to each other and aligned with the top left corner.


    **Cascade Windows** Starting from the top left corner, the windows on the desktop
    are placed on top of each other in such a way that only the top and left borders
    of the lower windows are visible.


    **Desktop 1** Desktop 1 is your default desktop. All open windows are listed under
    this menu item. Click windows to move them to the foreground.


    **additional desktop** You can use additional virtual desktops. Switch to another
    desktop with the menu or the panel. All functions are available on all desktops.
    This limits the number of programs and associated windows that need to be arranged
    on one desktop. These virtual desktops resemble additional desks in your office.


    If you right-click the desktop, a more complex menu is displayed, allowing you
    to customize your desktop.


    **Create New** Enables creation of new elements, such as directories, files, or
    URLs, on the desktop. A list of possible elements is provided for selection in
    a submenu.'
  merge: -1
  pgno: 153
- img_proc: true
  md: '**Bookmarks** This item opens the bookmark editor KEditBookmarks. With it,
    create, group, change, or delete bookmarks. The browser and file manager Konqueror
    can access these bookmarks.


    **Undo** This option allows you to undo the last action. For example, if you just
    created a new directory on the desktop, clicking this item reverts the creation
    to the directory disappears.


    **Paste** To have a desktop icon for a file or document, copy the icon from the
    file manager by right-clicking and selecting ‘Copy’ then moving the mouse to the
    desired location on the desktop. Right-click again and select ‘Paste’. The icon
    is now available on your desktop and can be moved by dragging it with the left
    mouse button pressed.


    **Icons** Rearranges the symbols on the desktop. You can also change the order
    of the icons.


    **Windows** The windows on the desktop are either placed on top of each other
    at the top left corner or next to each other.


    **Configure Desktop** This menu item starts a configuration dialog with which
    to configure the appearance of the desktop. Details about the configuration of
    the desktop are provided in Section 5.2 on page 141.


    **Help** Use this sub Come to open the KDE manual or write a bug report to the
    developers via the KDE web site. You can also start an information page about
    user.


    **Lock Screen** If you leave your workstation and do not log out, you should use
    this function to prevent others from gaining access to your files. Depending on
    the setting, the screen either turns black or a screensaver starts. To continue
    using the computer, enter your password.


    **Logout User** Log out from your system if you are not going to use the system
    for some time.


    # 5.1.2 The Trash Bin


    The trash bin is a directory for files marked for deletion. Drag icons from the
    file manager or the desktop to the trash bin icon by keeping the left mouse button
    pressed then release to drop them. Alternatively, right-click an icon and select
    ‘Move to Trash’ Click the trash bin icon to view its contents. You can retrieve
    an item from the trash if desired.'
  merge: -1
  pgno: 154
- img_proc: true
  md: 'Files removed with ''Delete'' are not moved to the trash bin, completely. To
    delete the files in the trash bin completely, right-click the trash bin icon and
    select ''Empty Trash Bin''.


    # 5.1.3 CD-ROM, DVD-ROM, and Floppy Disks


    If you click the floppy disk icon when a floppy disk is inserted, the file manager
    starts and displays the content of the floppy disk. Display a context menu with
    various options by right-clicking the individual icons on the floppy disk. It
    is also possible to move the icon to a different location, such as the desktop
    or your home directory, by simply keeping the left mouse button pressed and dragging
    it to the appropriate location. You will be asked whether you want to move or
    copy the floppy disk or create a link. You can also copy or move files from your
    home directory to the floppy disk.


    Right-click the floppy disk icon to access the content menu. ''Unmount'' is a
    very important option. Be sure to unmount the drive before removing the drive,
    as this is necessary to trigger the actual writing of the data to the floppy disk.


    The handling of CDs and DVDs is similar, with the only difference that these media
    are not writable. Nevertheless, you must unmount CD and DVD drives, because otherwise
    you will not be able to eject the CD. You can also select ''Eject'', which causes
    the medium to be unmounted and ejected. Both methods only work if the CD or DVD
    is no longer accessed and any file manager window displaying the content of the
    CD or DVD has closed.


    # 5.1.4 The Printer Icon


    Click the printer icon on the desktop to start KPrinter. This program enables
    you to adjust a number of settings and print jobs directly. The upper part of
    the main window, like that in Figure 5.1 on the facing page, shows the selected
    printer and allows selection of a different printer. Click the black arrow next
    to the printer name to display a list of all available printers and select the
    desired printer.


    To configure the selected printer, click ''Properties''. A configuration dialog
    like that in Figure 5.2 on page 138 opens, enabling you to change the paper format
    (e.g., from A4 to letter) or change between multiple paper trays. The latter is
    especially useful if one of the trays contains letterhead and another contains
    white paper.'
  merge: -1
