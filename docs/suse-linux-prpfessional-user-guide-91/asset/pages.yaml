  pgno: 408
- img_proc: true
  md: '# Changing Ownership Permissions


    Other important commands to control the ownership and permissions of the file
    system components are chown (change owner) chgrp (change group). The command chown
    can be used to transfer ownership of a file to another user. However, only root
    is permitted to perform this thing.Suppose the file Roadmap from Example 25.2
    on page 388 no longer belongs to tux, but to the user geeko. root should then
    enter chown geeko Roadmap.chgrp changes the group ownership of the file. However,
    the owner of the file must be a member of the new group. In this, the user from
    Output 25.1 on page 387 can switch the group ownership of the file Project4 with
    the command chgrp project4 ProjectData, as long as he is a member of this new
    group.


    # 25.2.3 The setuid Bit


    In certain situations, the access permissions may be too restrictive. Therefore,
    Linux has additional settings that enable the temporary change of the current
    user and group identity for a specific action.


    For example, the cdrecord program normally requires root permissions to access
    the writer for burning CDs (or DVDs). Thus, a normal user would not be able to
    create CDs, as it would be too dangerous to grant all users direct access to all
    devices. A possible solution to this problem is the setuid mechanism. setuid (user
    ID) is a special attribute that instructs the system to execute programs accordingly
    under a specific user ID. Consider the /usr/bin/cdrecord command:


    ```

    -rwx------ 1 root root 281356 2004-03-12 21:30 cdrecord

    ```


    Set the setuid bit with the command chmod u+s /usr/bin/cdrecord. Then, assign
    the cdrecord program to the group users with the command chgrp users /usr/bin/cdrecord.
    The following access permissions are granted:


    ```

    -rws------ 1 root users 281356 2004-03-12 21:30 cdrecord

    ```


    By means of the setuid bit, all users belonging to the group users can use the
    program. In effect, this means that the program is executed as root.'
  merge: -1
  pgno: 409
- img_proc: true
  md: '# 25


    # Working with the Shell


    # Caution


    Setting the setuid bit for a program makes your computer more vulnerable to attacks.
    Only do this in exceptional cases when you know the program well and are aware
    of the potential risks.


    # Caution


    # 25.2.4 The setuid Bit


    The setuid attribute applies to users. However, there is also an equivalent property
    for groups — the setgid attribute. A program for which this attribute was set
    runs under the group ID under it was saved, no matter which user starts it. Therefore,
    in a directory with the setgid bit, all newly created files and subdirectories
    are assigned to the group to which the directories belongs. Consider the following
    example directory:


    ```

    drwxwxr-x  2 root archive  48 Nov 19 17:12 backup

    ```


    Set the setuid bit with the command chmod g+s /test. Subsequently, the access
    permissions appear as follows:


    ```

    drwxrxr-x  2 root archive  48 Nov 19 17:12 backup

    ```


    # 25.2.5 The Sticky Bit


    There is also the sticky bit. It makes a difference whether it belongs to an executable
    program or a directory. A file marked in this way will be loaded to the RAM to
    avoid needing to get it from the hard disk each time it is used. This attribute
    is used rarely, as modern hard disks are fast enough. If this attribute is assigned
    to a directory, it prevents users from deleting each other''s files. Typical examples
    include the /tmp and /var/tmp directories:


    ```

    drwxrwxrwt  2 root root  1160 2002-11-19 17:15 /tmp

    ```


    SUSE LINUX – User Guide  391'
