    for most users. The YaST help text provides information about the three security
    levels. The setting ''Paranoid'' is extremely restrictive and can serve as the
    basic level of operation for administrator settings. If you select ''Paranoid'',
    generic programs might not work or work correctly, because you no longer have
    the permissions to access certain files. In this dialog, also define which user
    starts the updateddb program. This program, which automatically runs on a daily
    basis or after booting, generates a database (locateddb) where the location of
    each file on your computer is stored (locateddb can be searched by running the
    locate command). If you select ''Nobody'', any user can find only the paths in
    the database that can be seen by any other (unprivileged) user. If root is selected,
