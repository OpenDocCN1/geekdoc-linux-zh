- img_proc: true
  md: '# Preparations


    The actual software needs to be present before spam messages can be filtered.
    Run YaAST as user root and install the package spamassassin with the package manager
    (''Software'' → ''Software'').


    Then configure the system to activate the SpamAssassin service on start-up by
    opening the RunLevel editor in YaAST (''System''). Select the list of services
    for spam and select ''activate''. Confirm the choice with ''Finish''. This completes
    the SpamAssassin installation process.


    Create an additional folder in KMail (naming it spam) to store the messages messages
    classified as spam. If you already have collected spam, move as many of them as
    possible into this folder. This folder can be used as a training stock and allows
    the tool to decide which of your incoming messages should be classified as spam.


    # Spam Filtering


    KMail requires filters for spam processing:


    +   1. The first filter examines the size of a message. Select ''Settings'' →
    ''Configure filters...''. In the dialog that appear, create a new filter entry
    and name it SpamAssassin (modify the name, if desired). Select ''Size in bytes''
    as the filtering property and ''is less than'' as the qualifier. Set the threshold
    to ''30000''.

    Select ''pipe through application'' for ''filtering actions'' and enter spam in
    the field next to. The option ''abort processing here upon matching condition''
    must be deactivated. Confirm the first filter with ''Apply''.

    This filtering rule specifies that KMail passes only messages to spam whose size
    is less than 300 KB. It is possible to adjust threshold values. The processing
    time for messages rises, however, with increasing size threshold. SpamAssassin
    tests all messages for characteristics of spam and alters the message header by
    adding the line X-Spam-Status: YES. The second filter relies on this.


    +   2. Add a second filter to the list and name it SpamFilter. This filter moves
    the messages marked by SpamAssassin to the spam folder.

    Select ''<header field>'' as the property and ''contains'' as the qualifier. Enter
    ''X-Spam-Status: YES'' in the corresponding text field. Select ''filtering action''
    to ''file folder'' and select spam. Confirm with ''Apply''.


    KMail — The KDE Mail Application


    SUSE LINUX — User Guide 267'
  merge: -1
  pgno: 286
- img_proc: true
  md: 'These two filters should be placed in the described order at the top of the
    list. Any other filters can be placed below them.


    # Distinguishing Wanted and Unwanted Messages


    SpamAssassin ships with predefined rules that control the recognition of spam
    messages. It is possible for the tool to miss a message occasionally. This is
    where the rate of false negatives can be lowered by training SpamAssassin.


    The utility sa-learn is included for this purpose. If your messages are stored
    in the MailDir format (refer to Section 16.2 on page 258) run the following command:


    ```

    sa-learn --spam --dir ~/Mail/spam/cur/

    ```


    If your messages are stored in the mbox format, run the following command:


    ```

    sa-learn --mbox --spam ~/Mail/.spam.directory/*

    ```


    SpamAssassin returns the following message upon a successful spam recognition
    event:


    Learned from 15 message(s)


    Visit the site http://www.spamassassin.org or read the corresponding man page
    to discover more about this tool.


    # 16.11 Encrypting Mail with PGP or GnuPG


    You can encrypt outgoing e-mail with KMail. To encrypt your e-mail, first generate
    a key pair as described in Chapter 15 on page 249. Then log out and log in.


    With ''Settings'' -> ''Configure KMail...'' -> ''Security'' -> ''Crypto plugins''
    -> ''Configure'', determine in what cases and with which process your e-mail messages
    should be encrypted. The corresponding module (usually openspg) must be activated
    first. In ''path'', enter the file name of the crypto'
  merge: -1
  pgno: 287
- img_proc: true
  md: 'library. in the case of OpenPGP, this is /usr/lib/cryptplug/gpgme-openpgp.so./usr/lib/cryptplug/gpgme-smite.so
    is valid for smite. An asterisk in the displayed table marks the active module.
    If desired, select to be alerted when attempting to send an unencrypted e-mail.
    To encrypt any attachments as well, check ''Encrypt all message parts'' in ''Settings''
    -> ''Configure KMail...'' -> ''Security'' -> ''Crypto Plugins'' -> ''Con-figure''.


    After setting the preferences, click ''Identities'' (under ''Configure KMail'').
    Select the identity with which encrypted or signed messages should be sent and
    choose ''Change''. Select the ''Advanced'' tab in the dialog that opens. Click
    ''Change'' for ''OpenPGP key'' to display a selection box from which to choose
    the keys. Confirm with ''OK''. The encryption system is now ready.


    The public key must be made available to recipients of a signed message so they
    can verify its authenticity. It also needs to be accessible to enable others to
    send encrypted messages to the owner of the key. Public keys can be stored on
    a public key server, such as http://www.pgp.net.


    # 16.11.1 Signing Messages


    Create your messages as usual. Before sending the message, click the corresponding
    icon (second to last) in the toolbar of the window or choose ''Options'' -> ''sign
    message''. The message can be sent. To sign it, KMail must know your PGP password.
    However, if you have already provided the password, KMail signs the message without
    requesting any further information. The results of the PGP signing process can
    be reviewed in the SentMessages folder (or in the outbox if you did not use ''Send
    now''). Your, e-mail should be marked with the notice that it was signed by you.


    # 16.11.2 Checking the Signature of a Received Message


    If KMail is able to verify the signature of an e-mail, a green frame with the
    key ID is displayed. If the signature cannot be verified, a yellow frame with
    an alert is displayed. This means that you do not have a suitable public key for
    the signature.


    # 16.11.3 Sending Public Keys


    Create a message for the person who should receive your public key. Choose ''Attach''
    -> ''Attach Public Key''. The mail can then be sent. There'
  merge: -1
  pgno: 288
- img_proc: true
  md: 'is no guarantee that the recipient of a signed message receives the correct
    key. It is possible for the mail to be intercepted on the way to the recipient
    and signed with another key. Therefore, the recipient should check the attached
    key by comparing the finger print with a previously received value. Further information
    about this can be found in the PGP and GnuPG documentation.


    # 16.11.4 Decrypting Encrypted Messages


    In KMail, select the message to decrypt. Enter your password when prompted. KMail
    attempts to decrypt the message. If it was encrypted with your public key, KMail
    displays it in clear text. If not, you cannot read the e-mail message. KMail saves
    these e-mail messages encrypted to prevent anyone from reading them without your
    password.


    # 16.11.5 Encrypting Messages


    To send an encrypted message to a recipient for whom you have the public key,
    simply write the message in the ''Create Message'' window. Before sending the
    message, click the red key icon in the window''s toolbar. Now, the message can
    be sent. If KMail cannot find a key for the recipient, a list with all available
    keys is shown. Select the appropriate one from the list or abort the process.
    KMail also informs you if errors occur during the encryption process. You cannot
    read encrypted messages if you did not click ''Always encrypt to self'' in the
    ''Security'' tab.


    # 16.12 For More Information


    More information is available on the KMail home page at http://kmail.kde.org.'
