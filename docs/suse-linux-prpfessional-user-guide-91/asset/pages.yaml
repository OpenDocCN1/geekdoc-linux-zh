- img_proc: true
  md: '# 12.1 Opening Web Pages


    Simply enter a web address in the URL line, for example, suse.de. Konqueror displays
    the address. Writing the protocol (http://) at the beginning is optional, as it
    is recognized automatically by the program. This feature only works properly with
    web addresses, however. For FTP servers, enter ftp:// the beginning of the entry
    line.


    ![](img/705a076b108ea96be0c0695efb5556ce_253_0.png)


    Figure 12.1: The Browser Window of Konqueror


    # 12.2 Saving Web Pages and Graphics


    As in other browsers, you can save web pages. To this, select ‘Location’ -> ‘Save
    as...’ and specify a name for your HTML file. However, images will not be saved.
    To archive an entire web page including the images, select ‘Extras’ -> ‘Archive
    Web Page’. Konqueror suggests a file name you can usually accept. The file name
    ends with .war, the extension for'
  merge: -1
  pgno: 253
- img_proc: true
  md: 'web archives. To view the saved web archive later, simply click the respective
    file and the web page is displayed in Konqueror along with its images.


    # 12.3 Enhanced Web Browsing (Internet Keywords)


    Searching the web using Konqueror is very practical. Konqueror defines a number
    of search engines for you, all with a specific shortcut. To search for a certain
    topic on the Internet, enter the shortcut and the keyword separated by a colon.
    The relevant page containing the search results is then displayed.


    You can also define your own shortcuts. Simply select ''Settings'' -> ''Configure
    Konqueror'' -> ''Web Shortcuts''. A dialog appears in which to define your own
    abbreviations.


    # 12.4 Bookmarks


    If you frequently visit certain pages, it can be useful to save them as bookmarks.
    Use the ''Bookmark'' to save all important locations of web pages or directory
    links on your hard disk.


    To create a new bookmark in Konqueror, click ''Bookmarks'' -> ''Add Bookmark''.
    If you have already added some bookmarks, also see them in this menu. It is recommended
    to arrange your collection by subjects, grouped hierarchically. Create a new group
    for bookmarks with ''New Directory''. Open the bookmark editor by selecting ''Bookmarks''
    -> ''Edit Bookmarks...''. Use this program to organize, rearrange, and delete
    bookmarks.


    If you are using Netscape or Mozilla as additional browsers, it is necessary to
    recreate your bookmarks. ''File'' -> ''Import Netscape Bookmarks'' in the bookmark
    editor enables you to integrate your Netscape and Mozilla bookmarks into your
    most current collection. The reverse is also possible via ''Export as Netscape
    Bookmark''.


    Change your bookmarks by right-clicking the entry. A pop-up menu appears in which
    to select the desired action (cut, copy, delete, etc.). When you achieve the desired
    results, save with ''File'' -> ''Save''.


    To save your bookmark list and have instant access to it, make your bookmarks
    visible in Konqueror. Select ''Settings'' -> ''Show Bookmark Toolbar''.'
  merge: -1
  pgno: 254
- img_proc: true
  md: 'A bookmark panel is automatically displayed in the current Konqueror window.


    # 12.5 Java and JavaScript


    Do not confuse these two languages. Java is an object-oriented, platform-independent
    programming language from Sun Microsystems. It is frequently used for small programs
    (applets), which are executed over the Internet for things like online banking,
    chatting, and shopping. JavaScript is an interpreted scripting language mainly
    used for the dynamic structuring of web pages (e.g., for menus and other effects).


    Konqueror allows you to enable or disable these two language. This can even be
    done in a domain-specific way, which means that you can permit access for some
    hosts and block access for others. Java and JavaScript are often disabled for
    security reasons. Unfortunately, some web pages require JavaScript for correct
    display.'
  merge: -1
  pgno: 255
