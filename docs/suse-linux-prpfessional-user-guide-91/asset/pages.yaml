  md: '# 4.6.3 Configuration of a Samba Server


    Set up a Samba server to share resources such as files or printers with Windows
    hosts. In the first dialog, define the role of the Samba server. You can deactivate
    it, use it as a file and print server, or use it as a backup or primary domain
    controller. A file and print server makes directories and printers available.
    A domain controller enables its clients to log in to Windows domain. The primary
    domain controller uses another domain controller for authenticating the users.
    More information about Samba is available in the Administration Guide.


    After determining the, use the Windows domain or workgroup. Use ‘Browse’ to display
    all existing domains and workgroups. Under ‘Server Description’, enter a text
    to display to all clients. Use ‘Authentication Details’ to enter an advanced configuration
    dialog to set the user authentication mode. If you activate ‘smbpasswd’, all users
    and their passwords are saved in the file smpassword. If you use for LDAP, the
    user information is stored on an LDAP server. Specify the LDAP server by the server
    name, Base DN, and Administration DN. Detailed information about LDAP is available
    in the Administration Guide. Test the LDAP connection with the respect button.
    Enter the LDAP administration password when required to do so.


    Complete all settings and click ‘Next’. In the following dialog, define the resources.
    If you activate ‘Share homes’, the home directories of the users appear as Windows
    shares on the clients. If you activate ‘Share printers’, use ‘Select’ to share
    individual printers.


    # 4.6.4 Configuration of Samba Clients


    Configure a Samba client to access resources (files or printers) on the Samba
