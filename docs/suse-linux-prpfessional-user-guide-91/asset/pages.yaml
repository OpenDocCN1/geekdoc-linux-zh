  md: '# SUSE LINUX FAQ


    This section provides answers to frequently asked questions.


    +   1. I am the only person using my computer. Why do I always need to log in?

    Linux is a multiuser system. A user name and a password are necessary so Linux
    knows who is working with it. Only log in as root to make changes to your system
    (installing software or changing configuration). For everyday use, create a regular
    user. This prevents accidental damage to the installation.


    +   2. Where can I find the SUSE manuals in PDF or HTML format?

    Our manuals are also available on our CDs. The PDF files or HTML versions are
    available in the packages suselinux-adminguide_en and suselinux-userguide_en.
    In the installed system, go to the directory /usr/share/doc/packages/suselinux-adminguide_en/
    or /usr/share/doc/packages/suselinux-userguide_en.


    +   3. Where can I get more information about SUSE LINUX?

    Most of the information about the installation and features of SUSE LINUX is provided
    in the manuals. Documentation for applications is available in /usr/share/doc/packages/
    and the HowTos are located in /usr/share/doc/howto/en/. Read these files with
    a command like:

    less /usr/share/doc/howto/en/DOS-to-Linux-HOWTO.txt.gz


    Terminate the command by pressing Q.'
  merge: -1
  pgno: 438
- img_proc: true
  md: '# 4. Where can I get special tips or help?


    In Konqueror, enter the path /usr/share/doc/sdb/en/html/index.html to view our
    Support Database, which contains useful information. If this path does not exist,
    install the packages sdb and sdb_en. On the Internet, the most recent version
    at http://sdb.suse.de/en/sdb/html/


    # 5. How can I enter commands in KDE?


    Click the screen with shell icon in the panel to start the Bash shell. Select
    alternative terminals from the main menu. To run a single command, press `Alt`
    + `F2` then enter the command.


    # 6. I cannot find many programs in KDE.


    You can start all programs from a terminal window by entering the program name
    and pressing `Enter`.


    # 7. What is a mirror? Why should I not get these things from ftp.suse.com?


    As there are many users who need to retrieve things from the server at the same
    time, its capacity limit would be reached very quickly. For this reason, there
    are a number of other FTP servers that contain a duplicate of the SUSE server.
    These servers are referred to mirrors. Select a mirror in your vicinity (same
    country) to speed up the download. A list of mirror is available at http://www.suse.de/en/support/download/ftp/.


    # 8. I cannot find .exe files. Where are the applications?


    In Linux, executable files normally do not have file extensions. Many programs
    are located in /usr/bin and /usr/X11R/bin.


    # 9. How can I recognize executable files?


    The command `ls -l` returns all executable files in the directory /usr/bin/ in
    green. Also recognize them by the x in the first column.


    ```

    -rwxr-xr-x 1 root 64412 Jul 23 15:23 /usr/bin/ftp

    ```


    # 10. I want to remove Linux. How does this work?


    With fdisk, delete the Linux partitions. You might need to run fdisk in Linux.
    Afterwards, boot from the MS-DOS disk and run fdisk/MBR in DOS or Windows.'
  merge: -1
  pgno: 439
- img_proc: true
  md: '# 11. How can I access my CD?


    First mount the CD with the mount command. Information about this command can
    be found in Section 25.3.1 on page 397.


    # 12. I cannot get my CD out of the drive. What should I do now?


    First, unmount the CD with the mount command. More information about this can
    be found in Section 25.3.1 on page 398. In KDE, just right-click the CD-ROM icon
    and select ''Unmount Drive''. If YaST is running on your computer, exit it.


    # 13. How can find out how much space is available in Linux?


    With the df -hT command. See Section 25.3.2 on page 398.


    # 14. Can I copy and paste in Linux?


    Yes, this is possible. To copy and paste in the text mode, you must have gdm running.
    In the Windows System and in the text mode, highlight the text block by clicking
    and dragging with the left mouse button insert by clicking with the middle mouse
    button. The right mouse button has a special function in most programs and applications.


    # 15. Do I need to be afraid of a virus in Linux?


    In Linux, there have been serious viruses found. Also, viruses can-cause any serious
    damage if they are not activated by root. The only virus scanners available in
    Linux search e-mails for Windows viruses (if Linux is used as a router or server).
    Nevertheless, you should back up important data and configurations.


    # 16. Do I need to compile a kernel myself?


    No, this is usually unnecessary. The kernel has become so large that there are
    about eight hundred options to consider during the configuration. Because it is
    almost impossible to master all possible configurations and their effects, it
    is strongly discouraged for inexperienced users to recompile the kernel. Do so
    only at your own risk. In cases of custom compiled kernels, SUSE cannot provide
    any installation support.


    # 17. Where can I see the system messages?


    In a terminal window, enter tail -f /var/log/messages as root. Additional interesting
    programs relating to this one are top, procinfo, and xosiew. Use the command less
    /var/log/boot.msg to view the boot messages.'
  merge: -1
  pgno: 440
- img_proc: true
  md: '+   18. I cannot log in to my computer with telnet. I always get the answer
    Login incorrect.


    You are probably trying to log in as root. For security reasons, this is not possible
    via telnhof by default. With YaST, set up a normal user account. Log in with this
    user name. Then change to the user root with su. It is much better and safer,
    however, to use the program ssh instead of telnet. The ssh program uses encrypted,
    secure connections.


    +   19. How do I connect to the Internet in Linux?


    Section 5.4.1 on page 154 provides information about this.


    +   20. I found a bug in SUSE LINUX. Where should I report it?


    First, ascertain whether it is actually a bug in the program or just an error
    in operation or faulty configuration settings. Also read the documentation in
    /usr/share/doc/packages and /usr/share/doc/howto.a The bug may have already been
    discovered. Check in the support database at http://sdb.suse.de/sdb/en/html/.
    Enter a key or word your forward or backward via the History link. If it is really
    a bug, send a description of it by e-mail to feedback@suse.de.


    +   21. How can I install applications?


    Applications included in the SUSE LINUX CDs are best installed with YaST.


    Another possibility is to start YaST from the command line with yast -i package.
    Replace the placeholder (package) with the file name of the RPM package package
    (including the path). You can also specify multiple packages.


    +   22. I only have an application in source code. How can I install it?


    Some-how is required with some applications. Find more information in a good Linux
    book.


    Here a brief description: Decompress the archive with tar xzvf name.tar.gz, read
    the INSTALL files, and follow the instructions. Usually, the following command
    sequence needs to be executed: ./configure;make;make install. No installation
    support is available for the compilation or self-compiled programs.'
  merge: -1
  pgno: 441
- img_proc: true
  md: '# 23. Is my hardware supported?


    It is best to refer to the component database at http://hardwaredb.suse.de or
    http://cdb.suse.de. less /usr/share/doc/howto/en/Hardware-HOWTO.gz can also provide
    some information.


    # 24. How can I defragment my hard disk?


    Linux has an intelligent file system. This file system makes defragmentation superfluous,
    because it prevents fragments from occurring. Your partitions should not be more
    than ninety percent used. Use def -h to view information about used and available
    hard disk space.


    # 25. What is meant by partitioning?


    Partitioning is dividing the hard disk into smaller sections. For the default
    configuration, SUSE LINUX requires at least two partitions (one for Linux itself
    and one swap partition for the virtual memory).


    # 26. How much space do I need for Linux?


    This depends on how many and which packages you want to install. A standard installation
    with office applications requires about 1 GB. 2 GB is recommended if you want
    space for your own data as well. To install just everything, you need 3–6 GB,
    depending on the version.


    # 27. I need more space for Linux. How can I add another hard disk?


    To make more space available, integrate a new hard disk or parts of it (partitions)
    into your Linux system at any time. For example, if it turns out that you need
    more space in /opt, mount an additional hard disk partition to this directory.
    To do so, follow this procedure:


    +   (a) Install your hard disk following the instructions of the manufacturer
    then start Linux.


    +   (b) Log in as the root user.


    +   (c) Partition the new hard disk with fdisk. For further information, refer
    to the manual page of fdisk with man fdisk.


    +   (d) Format the partition with mke2fs /dev/hdb1.


    +   (e) Enter the following commands:


    ```

    cd /opt

    mkdir /opt2

    mount /dev/hdb1 /opt2

    cp -avx /opt2

    ```'
  merge: -1
  pgno: 442
- img_proc: true
  md: 'Check shut thoroughly to see whether all the data has been copied.

    Afterwards, move the old directory and add a new one — an

    empty mount point:


    ```

    mv /opt /opt.old

    mdir /opt

    ```


    Use an editor to add the new partitions in /etc/fstab. This

    could resemble the line in File B.1.


    # Example B.1: Sample Line in /etc/fstab for an Additional Partition

    /dev/hdb1 /opt ext2 defaults 1 2


    Now, shut down the computer and reboot.


    +   After rebooting, check that /dev/hdb1 has actually been

    mounted to /opt using the command mount. If everything is

    working as desired, remove the old data from /opt.old:

    cd /

    rm -fr opt.old


    28. My computer crashed. Can I just press the reset button without

    risking anything?


    If your computer no longer reacts to your mouse or keyboard, this

    does necessarily mean that your entire system has crashed. Possi-

    bly program is blocking the mouse or the keyboard, but all other

    programs are still running. If your machine can be accessed remotely

    (serial terminal, network), log in elsewhere and abort the response

    program with killall (program name). If this does not work, try

    killall -9 (program name).


    If this is not possible, try switching to another console using Ctrl-

    Alt-(F2) to kill the faulty process from there. If the computer does

    respond to any of the keys and network intervention is not possible,

    wait at least ten seconds before pressing reset to make sure there is no

    hard disk activity.


    29. How can I switch from a virtual text console to the graphical user

    interface?


    By default, there are six virtual text consoles that can be accessed with

    (Ctrl-Alt-F1) to (F6). Press Alt-F7 to go to the graphical user interface.'
  merge: -1
  pgno: 443
- img_proc: true
  md: '# Glossary


    access permissions


    The account is defined by the user name or login name and the password. The access
    permissions are generally set by the system administrator. The access permissions
    define to which user group the new user is assigned and the resulting permissions.


    account


    See access permissions.


    ACL (Access Control List)


    Extension of the permission concept for files and directories.


    ADSL (Asymmetric Digital Subscriber Line)


    Transmission procedure that transmits data about one hundred times faster than
    ISDN in the telephone network.


    AGP (Accelerated Graphics Port)


    A high-speed slot for graphics cards based on PCI, but offering a larger bandwidth.
    Furthermore, AGP graphics cards can revert directly (without routing around the
    processor) to the random access memory and main memory, in contrast to PCI models,
    to swap graphics data there.


    ATAPI (Advanced Technology Attachment Packet Interface)


    ATAPI is a type of CD-ROM drive that is connected to an (E)IDE controller. Apart
    from ATAPI drives, there are SCSI CD-ROM drives, handled by a SCSI controller,
    and proprietary CD-ROM drives that use their own controller or are connected to
    a sound card.'
  merge: -1
  pgno: 444
- img_proc: true
  md: '# backup


    A backup is a duplicate of data used to restore data that has been damaged or
    lost. Backups should be done regularly, especially important files.


    # bandwidth


    Maximum load capacity of a data channel.


    # BIOS


    Small component responsible for the initialization of important hardware processes.
    This essential procedure is complete when the boot menu appears on the screen.


    # bookmark


    A mostly personal collection of interesting web page or file references directly
    accessible in the browser.


    # booting


    The sequence of computer operations from power-up until the system is ready for
    use.


    # browser


    Program that searches and displays contents. Today it is mostly used for programs
    that graphically display contents of world wide web pages.


    # cache


    In relation to the main memory, it is rather small, but still a fast memory buffer.
    For example, open files are saved to the cache to spare the hard disk next time
    the file is loaded.


    # client


    Workstation in a computer network operated by a server.


    # command line


    Text-based mode of operating in which commands are entered at a prompt. A command
    line can be accessed from within a graphical environment as well as from virtual
    consoles.


    # console


    Formerly synonymous with terminal. In Linux, there are several virtual consoles
    that allows the screen to be used for several independent, parallel work sessions.'
  merge: -1
  pgno: 445
- img_proc: true
  md: '# CPU (Central Processing Unit)


    processor.


    # cursor


    The cursor is normally a block character that marks the place for input on a computer
    screen. This term also often refers to the symbol representing the location of
    the mouse in graphical interfaces.


    # daemon


    A daemon (disk and execution monitor) is a program that monitors in the background
    and comes into action when required. Daemons answer FTP or HTTP requests, for
    example, or control activity in PCMCIA slots.


    # DDC (Direct Display Channel)


    Communication standard between the monitor and the graphics card, which transmits
    various parameters, such as monitor name or resolution, to the graphics card.


    # directory


    Directories make up the structure of a file system. A directory lists file and
    directory names.


    # DNS (Domain Name System)


    A system that converts name-based addresses to TCP/IP addresses and vice versa.


    # driver


    A program between the operating system and the hardware that translates the communication
    between these two layers.


    # e-mail (electronic mail)


    The means of transporting mail electronically between registered users via a network.
    As normal mail (often referred to as snail mail), the address must be entered.
    In e-mail, it is in the form sender@sender''s-domain to recipient@recipient''s-domain.
    E-mail not lets you send text, but also sound files or pictures. It has many advantages:
    it is inexpensive and mail usually reaches its destination within minutes.


    # EIDE (Enhanced Integrated Drive Electronics)


    Improved IDE standard that allows hard disks with a size over 512 MB.'
  merge: -1
  pgno: 446
- img_proc: true
  md: '# environment


    A shell usually provides an environment in which the user can perform- temporary
    settings. These settings include path specifications for programs, the user name,
    the current path, and the appearance of prompts. The data is saved in an environment
    variable. The assignment of the environment variables is possible, for example,
    by means of the configuration files of the shell.


    # environment variable


    A position based on environment of the shell. Every environment variable- has
    a name that is usually capitalized. The variables are assigned values, such as
    path names.


    # ethernet


    Popular standard for less expansive computer networks.


    # EXT2 (Second Extended File System)


    EXT2 is the default file system used by Linux.


    # FAQ (Frequently Asked Questions)


    Widely-used acronym for documents providing answers to frequently-asked questions.


    # file system


    A file system is a system for structuring files. There are many file systems available,
    which differ (sometimes quite extremely) in performance and power.


    # firewall


    Protects a local network or host from unauthorized access from the Internet using
    various security measures.


    # free software


    See GNU.


    # FTP (file transfer protocol)


    A protocol based on TCP/IP for transferring files.


    # GNOME (GNU Network Object Model Environment)


    A user-friendly graphical desktop environment for Linux.'
  merge: -1
  pgno: 447
- img_proc: true
  md: '# GNU (GNU is Not Unix)


    GNU is a project of the Free Software Foundation (FSF). Closely linked to the
    GNU Project is the name of RICHARD STALLMAN (RMS). The aim of the GNU Project
    is to create a free Unix-compatible operating system free not so much in the sense
    of free of cost, but in the sense of freedom: having the right to obtain, modify,
    and change the software. To guarantee the freedom of the source code (the actual
    program code), every change of the original code must be free as well, so modifications
    of or additions to the original software cannot compromise this freedom in any
    way. Now classic GNU Manifesto (http://www.gnu.org/gnu/manifesto.html) explains
    many aspects of this thing. The GNU General Public License, or GPL (http://www.gnu.org/copyleft/gpl.html),
    and by the GNU Lesser General Public License, or LGPL (http://www.gnu.org/copyleft/gpl.html).In
    connection with the GNU Project, all Unix tools and utilities are being redeveloped
    and, in part, provided with more or enhanced functionalities. Even complex software
    systems, such as Linux kernel, subject to the GPL, profits from this project (especially
    from the tools), but should not be seen as the same thing.


    # GPL (GNU GENERAL PUBLIC LICENSE)


    See GNU.


    # home directory


    A directory in the Linux system that belongs to a specific user (usually in /home/<username>
    Except the superuser root, only the user has full access to his home directory.


    # host name


    Name of a machine in Linux, usually the name by which it can be reached on the
    network.


    # HTML (Hypertext Markup Language)


    The most important language used in the World Wide Web for designing the contents.
    The layout commands made available by HTML define how a document looks and how
    it is displayed in a browser.


    # HTTP (Hypertext Transfer Protocol)


    A protocol used between the browsers and Internet servers to transmit HTML pages
    over the World Wide Web.'
  merge: -1
  pgno: 448
- img_proc: true
  md: '# IDE (Integrated Drive Electronics)


    A widely-used hard disk standard in low-grade and middle-grade PCs.


    # Internet


    World-wide computer network based on TCP/IP, which is used by a very large population.


    # IP address


    A numerical 32-bit Internet address, appearing in four decimal series separated
    by periods (for example, 192.168.10.1), which is uniquely assigned to a machine
    connected to TCP/IP networks.


    # IRQ (Interrupt Request)


    A request to the operating system carried out by a hardware component or a program
    to assign it process capacity.


    # ISDN (Integrated Services Digital Network)


    A popular digital standard for high-speed data transferral over the telephone
    network.


    # KDE (K Desktop Environment)


    User-friendly graphical desktop environment for Linux.


    # kernel


    The kernel is the central core of the Linux operating system. It manages memory,
    contains the drivers that enable communication with the hardware, and handles
    processes and tasks. Applications run on top of the kernel.


    # LAN (local area network)


    A LAN is a local network and is usually rather fast.


    # LILO (Linux Loader)


    Small program installed in the boot sector of the hard disk that not only can
    start Linux, but other operating systems as well.


    # link


    A link is a pointer to a file, just as widely used in the Internet as the Linux
    file system. In Linux, there is a distinction between hard and symbolic links.
    While hard links refer to the exact position in the file system, the symbolic
    link only points to the respective name.'
  merge: -1
  pgno: 449
- img_proc: true
  md: '# Linux


    High performance UNIX-like operating system core distributed freely under the
    GPL (GNU). The name is an acronym (Linus unix) and refers to its creator, LINUS
    TORVALDS. Although the name, in a strict sense, only refers to the kernel itself,
    the popular understanding of the term Linux usually entails the entire system.


    # login


    Authentication of a user by user name and password to gain access to a computer
    system or network.


    # logout


    The procedure of closing down an interactive Linux session and getting back to
    the login prompt where you enter your user name and password.


    # main memory


    Physical memory of limited capacity that can be accessed rather quickly. This
    is often referred to as RAM, random access memory.


    # man pages


    Traditional documentation for Unix systems, which can be read using the command
    man.


    # MBR (master boot record)


    The first physical sector of the hard disk from which the content is loaded to
    the main memory and executed by the BIOS. This code then loads either the operating
    system from a hard disk partition or a more sophisticated boot loader, such as
    LILO.


    # MD5


    Algorithm for generating check sums.


    # mounting


    This describes the insertion of file systems into the directory tree of the system.


    # MP3


    Very efficient compression procedure for audio files that reduces the size by
    a factor of ten in contrast to an uncompressed audio file.'
  merge: -1
  pgno: 450
- img_proc: true
  md: '# multitasking


    Operating systems that can invoke more than one program simultaneously are called
    multitasking systems.


    # multier


    Enables more than one user to work simultaneously on the same system.


    # network


    The interconnection of several computers, accomplished normally using servers
    and clients.


    # NFS (Network File System)


    A protocol for accessing a file system shared over a network.


    # NIS (Network Information Service)


    A centralized data administration system in networks. User names and passwords
    can be simultaneously managed network-wide by NIS.


    # operating system


    Program that permanently runs in the background on a computer and enables basic
    system operations.


    # partition


    Logically-independent section of a hard disk, each possibly containing different
    file systems. In Windows, also known as drives.


    # path


    Unique description of a file''s position in a file system.


    # plug and play


    Automatic hardware component configuration technology. Resources, such as IRQ
    and DMA, are configured and managed separately from the system.


    # process


    In Linux, started programs or executable files run as processes, often referred
    to as tasks. Processes can be controlled by commands like top entered in the shell.'
  merge: -1
  pgno: 451
- img_proc: true
  md: '# processor


    The processor is the brain of every computer, working through and performing commands
    given by a user or a program in machine language. The processor has control over
    the entire system and is responsible for the actual performance of the computer.


    # prompt


    See command line.


    # protocol


    Standard specifically defined for regulating communication for hardware, software,
    or networks. There is a multitude of these standards. The most common examples
    are HTTP and FTP.


    # proxy


    Most commonly used cache by Internet providers that stores frequently requested
    contents in a database to allow other machines requesting those pages to load
    them directly from it. This process not only reduces the time it takes to download
    this but also conserves the available bandwidth.


    # RAM (Random Access Memory)


    See main memory.


    # ReiserFS


    A file system that logs its changes to a journal. Compared to Ext2, this features
    allows a file system to be restored very speedily. ReiserFS is optimized for small
    files.


    # root


    The user undertaking the configuration and maintenance of a complex computer system,
    such as a network. This system administrator is usually the only person who has
    access to all parts of the system (root permissions).


    # root directory


    The base directory of the file system that does not have any parent directory
    (all other directories have a parent directory). In UNIX, the root directory is
    represented as a /.


    # SCSI (Small Computer Systems Interface)


    Hard disk standard implemented in servers and other high-level machines because
    of its high-speed performance. See server.'
  merge: -1
  pgno: 452
- img_proc: true
  md: '# server


    A server is usually a rather powerful computer that offers services, such as HTTP,
    DNS, and FTP, or data to other machines connected via a network. There are also
    programs called servers, like the server.


    # shell


    An especially flexible command line often equipped with its own programming language.
    Examples of shells are Bash, sh, and tcsh.


    # SMTP (Simple Mail Transfer Protocol)


    for transferring e-mails.


    # SSL (Secure Socket Layer)


    Encryption procedure for transferring HTTP data.


    # superuser


    See root.


    # system administrator


    See root.


    # task


    See process.


    # TCP/IP


    Internet communication protocol finding increased use in local networks, known
    as intranets.


    # telnet


    Telnet is the protocol and command for communicating with other hosts. Normally,
    the user only sees telnet as a means for logging into a remote system.


    # terminal


    Formerly, the designation of a keyboard and monitor combination connected to a
    central computer. On workstations, this term is also used for programs that emulate
    a real terminal.


    # Tux


    Name of the Linux penguin (see http://www.sjbaker.org/tux/).'
  merge: -1
  pgno: 453
- img_proc: true
  md: '# UNIX


    UNIX is an operating system that is widely distributed, above all on workstations
    in networks. Since the beginning of the 1990s, there has been a freely available
    version for PCs: Linux.


    # URL (Uniform Resource Locator)


    Unique Internet address that contains the type (e.g., `http://`) and the name
    of the host (e.g., `www.suse.de`).


    # user account


    See access permissions.


    # user directory


    See home directory.


    # VESA (Video Electronics Standard Association)


    Industrial consortium that defines, among other things, important video standards.


    # wild card


    A wild card stands for one (symbol: ?) or more arbitrary characters (symbol: *).


    # wild cards


    Placeholder for one (symbol: ?) or more (symbol: *) unknown characters, most often
    used in commands (especially search commands).


    # window manager


    A window manager is the layer that interacts between the X Window System and the
    user. It is responsible, among other things, for your desktop display. There is
    a wide variety of window managers available, one of the most popular ones being
    kwm or KDE.


    # WWW (World Wide Web)


    Based on the HTTP protocol, this is a hyperlinked collection of documents, files,
    and images that can be viewed with a web browser.


    # X Window System


    The X Window System is the standard for graphical interfaces in Linux. It is simply
    the middle layer between the hardware and the window manager, such as KDE or GNOME.'
  merge: -1
  pgno: 454
- img_proc: true
  md: '# X11


    See X Window System.


    # YaST (Yet another Setup Tool)


    The SUSE LINUX system assistant.


    # YP


    See NIS.'
