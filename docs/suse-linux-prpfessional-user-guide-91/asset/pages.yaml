  md: '# 5.4 Important Utilities


    The following pages introduce a number of small KDE utilities intended to assist
    in daily work. These applications perform various tasks, such as managing your
    keys for encrypting and signing files and e-mail messages, managing your clipboard,
    formatting floppy disks, compressing and decompressing diverse file archive types,
    and sharing your desktop with other users.


    # 5.4.1 KInternet — Connecting to the Internet


    To surf the Internet or send and receive e-mail messages, connect a modem or ISDN
    or Ethernet card to your machine and configure it. This can be done with the help
    of the system assistant YaST. As soon as the respective device has been configured
    correctly, control the Internet dial-up with KInternet.


    On start-up, KDE loads KInternet. The program checks whether an Internet connection
    can be established. If this is possible, the application icon, a plug, automatically
    appears in the right part of the KDE panel. The following is an overview of the
    icons and their meanings:


    +   - Currently there is no connection to the Internet.

    - The connection is just being established or terminated.

    - The connection has been established.

    - Data is transmitted to or from the Internet.

    - An error has occurred. If a connection has already been configured with YaST,
    use ‘View Log ...’ to identify the reason for the error. The menu can be accessed
    by right-clicking the KInternet icon.

    - The connection is not yet active, but will be established as soon as a request
    is made.


    Right-click KInternet to access a menu for configuring KInternet. To configure
    your access, select ‘Settings ...’ -> ‘Configure with YaST ...’. After entering
    the root password, YaST is started. Depending on the access type'
