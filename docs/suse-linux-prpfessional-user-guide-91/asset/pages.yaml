    # 19.11 AlsaModularSynth — Synthesizer and Effect Processor


    AlsaModularSynth (from the package alsamodular) is a digital replica of an analog
    synthesizer. The program has a JACK interface and can load all kinds of LADSPA
    plug-ins. Thus, it can also be used as a versatile effect processor.


    Enter am to start AlsaModularSynth from the command line. The parameter -j activates
    the JACK mode, provided the JACK engine is running (See Section 19.5 on page 310).
    The required port connections can be established with JackConnect. Individual
    parts are generated for each PCM module in the JACK mode. AlsaModularSynth only
    appears in the list of JackConnect if at least one PCM module exists.


    The directory usr/doc/packages/alsamodular contains numerous example patches that
    demonstrate the various possibilities. Detailed documentation is available in
    the subdirectory html.


    # 19.11.1 Synthesizer Patch Examples


    The application package for AlsaModularSynth provides a selection of patch examples
    to allow the user to start working with the application right away. The folder
    demos is located in the directory /usr/share/doc/packages/alsamodular. A few autonomous
    patches are contained there generating interesting random sound loops. The files
    concerned begin with example_ams_demo. Patches containing scope and spectrum in
    their name feature modules whose visualization can be opened by right-clicking
    the module title. Experiment a little, for example, and experience how that the
    music changes when'
