    # 5.4.12 Font Administration with KFontint


    By default, True LINUX provides various fonts commonly available in different
    file formats (Bitmap, TrueType, etc.). These are commonly known as System Fonts.
    Users can install their own fonts from various collections on CD-ROM. User-installed
    fonts are, however, only visible and available to the corresponding user.


    The KDE control center provides a comfortable tool for administering system and
    user fonts. It is shown in Figure 5.13.


    ![](img/705a076b108ea96be0c0695efb5556ce_186_0.png)


