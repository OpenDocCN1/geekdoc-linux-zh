  md: '# Sychronizing a Handheld Computer with KPilot


    Handheld computers are in widespread use nowadays among users who need to have
    their schedules, to-do lists, and notes with them everywhere they go. Often users
    want the same data to be available both on the desktop and on the portable device.
    This is where KPilot comes in — it is a tool to synchronize data on a handheld
    with that used by the KDE applications KAddressBook, KOrganizer, and KNotes.


    +   9.1 Conduits Used by KPilot . . . . . . . . . . . . . . . . . 210

    9.2 Working with KPilot . . . . . . . . . . . . . . . . . . . . 215'
  merge: -1
  pgno: 228
- img_proc: true
  md: 'The main purpose of KPilot is to allow the sharing of data between the applications
    of a handheld computer and their KDE counterparts. KPilot comes with its own built-in
    memo viewer, address viewer, and file installer, but these cannot be used outside
    the KPilot environment. Independent KDE applications are available for all these
    functions except the file installer.


    For the communication between the handheld and the different desktop programs,
    KPilot relies on conduits. KPilot itself is the program that sees any data exchange
    between the two computer devices. Using a particular function of the handheld
    on your desktop computer requires that the corresponding conduit be enabled and
    configured. For the most part, these conduits are designed to interact with specific
    KDE programs, so in general they cannot be used with other desktop applications.


    The time synchronization conduit is special in there is no user-visible program
    for it. It is activated in the background with each sync operation, but should
    only be enabled on computers that use a network time server to correct their own
    time drift.


    When a synchronization is started, the conduits are activated one after another
    to carry out the data transfer. There are two sync methods:


    +   1. A HotSync operation only synchronizes the data for which conduits have
    been enabled.

    2. A backup operation performs a full backup of all data stored on the handheld.


    Some conduits need to open certain files during a sync operation, which means
    the corresponding program should not be running at the given time. Specifically,
    KOrganizer should not be running during a sync operation.


    # 9.1 Conduits Used by KPilot


    The conduits used by KPilot can be enabled and configured after selecting ''Settings''
    -> ''Configure Conduits...''. The following conduits are:


    KDE Addressbook Conduit This conduit handles the data exchange with the handheld''s
    address book. The KDE counterpart is KAddressBook. Start it from the main menu
    or with the command kaddressbook.'
  merge: -1
  pgno: 229
- img_proc: true
  md: 'KPilot Notes Conduit This conduit allows you to transfer notes created with
    KNotes to the handheld''s memo application. Start the KDE application from the
    main menu or with the command notes.


    KPilot Expenses Conduit This conduits allows you to transfer data from the handheld''s
    expenses program to the desktop computer. Data can be imported as a comma separated
    list (CSV format) or directly into a PostgreSQL or MySQL database table.


    KOrganizer Todo Conduit, KOrganizer Calendar Conduit These conduits are responsible
    for syncing with the to-do and calendar applications of the handheld. The desktop
    equivalent for these applications are KOrganizer. For more information, refer
    to Section 10 on page 217.


    Time Synchronization Conduit Enabling this conduit adjusts the handheld''s clock
    to that of the desktop computer during sync operation. This is only a good idea
    if the clock of the desktop computer itself is corrected by a server timer at
    fairly frequent intervals.


    | Available Conduits | Active conduits are on the left. Active conduits are on
    the right. Only active conduits can be configured. |

    |---|---|

    | KDE Addressbook Conduit | |

    | KOrganizer Calendar Conduit | |

    | KOrganizer Todo Conduit | |

    | KPilot Expenses Conduit | |

    | KPilot Notes Conduit | |

    | Time Synchronization Conduit |


    Figure 9.1: Configuration Dialog with the Available Conduits


    # 9.1.1 Configuring the Handheld Connection


    Apart from setting up the physical link, there is also some manual configuration
    necessary on the software side. The configuration depends on the type of cradle
    (docking unit) used with the handheld. There are basically two types of these:
    USB cradles and serial cradles. The connection can be'
  merge: -1
  pgno: 230
- img_proc: true
  md: 'configured either on a system-wide basis by the administrator (the root user)
    or by a regular user for his personal environment.


    # ## Configuring the Connection from within KPilot


    To set up the connection with the handheld cradle, select ''Settings'' -> ''KPilot...''.
    First, specify the correct device field under ''Pilot device''. If you have a
    USB cable, enter /dev/ttyUSB0. If you have a serial cradle connected to the first
    or second serial port, enter /dev/ttyS0 or /dev/ttyS1, respectively. The connection
    speed should normally be set to 57600. Also provide the user name set on the handheld
    in the corresponding field that the name actually matches the user name on the
    handheld when you first sync with it. The configuration dialog is shown in Figure
    9.2.


    | General | Address | DB Specials | Sync | About. |

    |---|---|---|---|--|

    | Device Options - | | | | |

    | Pilot device: /dev/ttyS0 | | | Speed: 57600 |

    | Pilot user: | | | | |

    | Startup Options - | | | | |

    | Start HotSync Daemon at login | | | | |

    | Show daemon in panel | | | | |

    | Stop daemon on exit | | | | | OK | |


    Figure 9.2: Configuring the Connection in KPilot


    # ## Creating a /dev/pilot Link


    There should be no need to create a /dev/pilot link if you have configured the
    cradle connection as a regular user. As a handheld cradle is normally connected
    to one specific computer, possibly with several users on it, it may still be useful
    to configure the connection with administrator permissions.'
  merge: -1
  pgno: 231
- img_proc: true
  md: '# # Note


    The following configuration steps require administrator permissions and cannot
    be performed from a regular user account. After completing the steps as described
    below, add users to the uucp group to allow them to use KPilot.


    USB Cradle To connect over a USB cradle, create a symbolic link from /dev/ttyUSB?
    to /dev/pilot. To so, first check which USB bus cradle is connected. If you do
    not have any other USB devices on the same bus, it can be safely assumed that
    this is /dev/ttyUSB0. In this case, the command to create the symbolic link ln
    -s /dev/ttyUSB0 /dev/pilot


    Serial Cradle First, to determine which port the cradle is connected. The device
    files for serial ports are named /dev/tty?, and just as USB ports, the counting
    starts from zero for the first port. To create a link for a cradle connected to
    the first serial port, enter the command: ln -s /dev/tty0 /dev/pilot


    # ## 9.1.2 Configuring the KAddressBook Conduit


    Initially, it should be sufficient to enable the KAddressBook conduit without
    changing any of the defaults. After the data has been synchronized for the first
    time, configure the details: what to do in case of conflicts, the way in backup
    databases are saved, and how certain fields as stored on the handheld should be
    assigned to the fields expected by KAddressBook.


    # ## 9.1.3 Managing To-Do Items and Events


    On the KDE desktop, to-do (tasks) and events (appointments) are managed with Organizer.
    Start the application from the main menu or with the command organizer. After
    enabling the calendar and the to-do conduit of KPilot, set some configuration
    options before using them.


    Organizer stores its files in the directory ~/.kde/share/apps/korganizer. However,
    given that the directory ~.kde begins with a dot, it may not be by the file selection
    dialog. In this case enter the complete path manually or explicitly toggle the
    display of hidden files (dots) in the file selection dialog. The default shortcut
    for this is F8.'
  merge: -1
