    # 4.4.10 Sound


    When the sound configuration tool is started, YaST tries to detect your sound
    card automatically. Configure one or multiple sound cards. To use multiple sound
    cards, start by selecting one of the cards to configure. Press ''Configure'' to
    enter the ''Setup'' dialog. ''Edit'' opens a dialog in which to edit previously
    configured sound cards. ''Finish'' saves the current settings and completes the
    sound configuration. If YaST is unable to detect your sound card automatically,
    press ''Add Sound Card'' in ''Sound Configuration'' to open a dialog in which
    to select a sound card and module.


    # Setup


    With ''Quick Automatic Setup'', you are not required to go through any of the
    further configuration steps and no sound test is performed. The sound card is
    configured automatically. With ''Normal Setup'', you have the possibility to adjust
    the output volume and play a test sound. With ''Options'', manually customize
    the sound card options.


    Set up your joystick by clicking the respective check box. Select the joystick
    type in the following dialog and click ''Next''. The same dialog appears when
    you click ''Joystick'' in the YaST Control Center.


    # Sound Card Volume


    Test your sound configuration in this test screen. Use ''+'' and ''-'' to adjust
    the volume. Start at about ten percent to avoid damage to your speakers or hearing.
    A test sound should be audible when you press ''Test''. If you cannot hear anything,
    increase the volume. Press ''Continue'' to complete the sound configuration. The
    volume setting will be saved.'
