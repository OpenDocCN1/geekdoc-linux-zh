  md: '# 15


    # Encryption with KPGp


    ![](img/705a076b108ea96be0c0695efb5556ce_274_0.png)


    Figure 15.5: Exporting a Key to a Key Server


    # 15.3 The Applet


    On-start, KGPG is available as an applet in the panel. Click the padlock icon
    with the left or middle mouse button to open a menu with all available functions.
    Apart from the options introduced above (‘Open key manager’, ‘Key server dialog’),
    find the options ‘Encrypt clipboard’ and ‘Decrypt clipboard’ as well as the option
    for opening the integrated editor. Right-click to open a menu for configuring
    and closing KGPG.


    # 15.3.1 Encrypting and Decrypting the Clipboard


    Files copied to the clipboard can easily be encrypted with a few clicks. Open
    the function overview by clicking the KGPG icon. Select ‘Encrypt clipboard’ and
    designate the key to use. A status message about the encryption procedure is displayed
    on the desktop. The encrypted contents can now be processed from the clipboard
    as needed. The decryption of board contents is just as easy. Simply open the function
    overview, select ‘Decrypt clipboard’, and enter the password associated with your
    secret key. The decrypted version is now available for processing in the clipboard
    and in the KGPG editor.


    SUSE LINUX – User Guide 255'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# 15.3.2 Encrypting and Decrypting by Dragging and Dropping


    To encrypt or decrypt files, click the icons on the desktop or in the file manager,
    drag them to the padlock in the panel, and drop them there. If the file is not
    encrypted, KGPG asks for the key to use. As soon as you have selected a key, the
    file is encrypted without further messages. In the file manager, encrypted files
    are designated with the suffix .asc and the padlock icon. These files can be decrypted
    by clicking the file icon, dragging it to the KGPG symbol in the panel, and dropping
    it. Then select whether the file should be decrypted or saved or displayed in
    the editor. If you select ''Decrypt and Save'', KGPG prompts for the password
    of your secret key and saves the decrypted file in the same directory as the encrypted
    file.


    # 15.3.3 The KGPG Editor


    Instead of creating contents for encryption in an external editor then encrypting
    the file with one of the methods described above, you can use the integrated editor
    of KGPG to create the file. Open the editor (context menu -> ''Open Editor''),
    enter the desired text, and click ''Encrypt''. Select the key to use and complete
    the encryption procedure. To decrypt files, select ''Decrypt'' and enter the password
    associated with the key.

    Generating and checking signatures is as easy as encrypting directly from the
    editor. Go to ''Signature'' ->''Generate Signature'' and select the file to sign
    from the file dialog. Then designate the secret key to use and enter the associated
    password. KGPG informs you about the successful generation of the signature. Files
    can also be signed from the editor by simply clicking ''Sign/verify''. To check
    a signed file, go to ''Signature'' -> Verify Signature'' and select the file to
    check in the following dialog. As soon as you confirm the selection, KGPG checks
    the signature and reports the result of the operation. Another possibility is
    to load the signed file into the editor and click ''Sign/verify''.


    # 15.4 For More Information


    For theoretical background information about the encryption method, refer to the
    brief and clear introduction on the GnuPG project pages at http://www.gnupg.org/documentation/howtos.html.
    This document also provides a list of further information sources.'
  merge: -1
  pgno: 275
