- img_proc: true
  md: '# 15.2 The Key Server Dialog


    Several Internet-based key servers offer the public keys of many users. To engage
    in encrypted communication with a large number of users, use these servers to
    distribute your public key. export your public key to one of these servers. Similarly,
    KPGp enables you to search one of these servers for the keys of certain people
    and import their public keys from the server.


    # 15.2.1 Importing a Key from a Key Server


    By means of the ''Import'' tab in the key server dialog, import public keys from
    one of the Internet-based key servers. Use the drop-down menu to select one of
    the preconfigured key servers and enter a search string address of the communication
    partner (e-mail address) or the ID of the key to find. When you click ''Search'',
    your system connects to the Internet and searches the specified key for a key
    that matches your specifications. Refer to Figure 15.3.


    | Import | Export | Key Servers |

    | --- | --- | --- |

    | Key server: | | |

    | htp://://pgp.mit.edu | | |

    | Text to search or ID of the key to import: | | |

    | [ ] | | |

    | Search | Import | |

    | Close | | |


    Figure 15.3: Search Screen for Importing a Key


    If your search on the key server is successful, a list of all retrieved server
    entries is displayed in a new window. Select the key to include in your key and
    click ''Import''. See Figure 15.4 on the following page. Confirm the following
    message with ''OK'' then exit the key server dialog with ''Close''.'
  merge: -1
