    can also be used to view and edit various different types of source code or HTML
    with syntax highlighting. This chapter provides a brief overview of the main features
    of KWrite, introducing the main menus and tools.


    +   8.1 The File Menu . . . . . . . . . . . . . . . . . . . . . 204

