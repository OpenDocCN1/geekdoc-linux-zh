    # Figure 11.3: Editing Distribution Lists


    Incremental search Use the drop-down menu to determine search details, such as
    the ''Given Name'', ''Family Name'', or ''Email Address''. As soon as you enter
    a character string in the adjacent input field, the data is searched by the selected
    criterion. The search result is displayed in the overview and in the detailed
