    # Windows Systems Installed on NTFS Partitions


    > By default, the Windows versions NT, 2000, 2000, and XP use the NTFS file system.
    Unlike FAT file systems, NTFS file systems can (currently) only be read from Linux.
    Therefore, you can read your Windows files from Linux, but you cannot edit them.
    If you want write access to your Windows data and do not need the NTFS file system,
