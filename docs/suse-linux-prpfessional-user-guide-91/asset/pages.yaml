- img_proc: true
  md: 'KAddressBook can be started independently from the main menu, from the appointment
    scheduler KOrganizer, or the mail program KMail. On start-up, the KDE Address
    Book window consists of three frames, shown in Figure 11.1. The top frame contains
    the menu and toolbars. The two lower frames contain the current list of contacts
    and the address data of the currently selected contact.


    ![](img/705a076b108ea96be0c0695efb5556ce_245_0.png)


    Figure 11.1: KAddressBook Main Window


    # 11.1 Creating a New Contact


    Open the contact editor with ''File'' -> ''New Contact'', the respective icon,
    or the entry in the toolbar. A dialog opens with two tabs to make your entries.
    Refer to Figure 11.2 on the next page.


    Enter all important information, including name, title, private and business addresses,
    phone numbers, e-mail addresses, and URLs, under the ''General'' tab. If desired,
    assign the contact to a category that can later be used for filtering the address
    view. Select a standard category (Family, Friend, Business, Customer, or School)
    or create a new category.


    The ''Details'' tab contains some additional information, such as birthdays and
    anniversaries, and offers the possibility to add comments for this contact. As
    soon as all required fields under these tabs are completed, save the data with
    ''OK''. The new contact then appears in a list of current contacts in the left
    part of the window.


    11.1. Creating a New Contact'
  merge: -1
