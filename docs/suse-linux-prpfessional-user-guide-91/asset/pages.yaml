    # Available Printing Systems


    SUSE supports two different printing systems:


    **LPRng and lpdfilter** This is a traditional printing system that consists of
    the printer LPRng and the printer filter lpdfilter. The entire configuration of
    this printing system is left to the system administrator. Regular users can only
    choose between the different print queues that have already been set up. To allow
    users to choose between different options for a given printer, a number of print
    queues must be defined, each with a different printer configuration.


    CUPS in the CU printing system, users can determine individual printing settings,
    the entire configuration of a queue is not defined by the system administrator.
    Rather, printer-specific settings are stored in a PPD (PostScript Printer Description)
    file for each queue and can be offered to users in a print dialog.


    Because of conflicts between these two printing systems, you cannot have both
    installed at the same time. More information about CUPS is available at http://www.cups.org/
    and in the Administration Guide.


    # Queues


    In most cases, more than one print queue is required. Different devices must be
    addressed through different print queues. The printer filter can be configured
    differently for each print queue. By having different queues for one printer,
    can be operated with a different set of options. However, this is not required
    when using the CUPS printing system, because CUPS allows users to set options
    individually for each print job.


    One standard configuration is sufficient for plain black-and-white printers, as
    most laser printers. However, color ink jet printers usually require at least
    two configurations (two queues):


