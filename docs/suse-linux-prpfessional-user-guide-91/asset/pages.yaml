- img_proc: true
  md: '# Sound Configuration


    Use ''Delete'' to remove a sound card. Existing entries of configured sound cards
    are deactivated in the file /etc/modules.conf. Click ''Options'' to open a dialog
    in which to customize the sound module options manually. In ''Volume'', configure
    the individual settings for the input and output of each sound card. ''Next''
    saves the new values and ''Back'' restores the default configuration. Under ''Add
    Sound Card...'', configure additional sound cards. If YaST detects another sound
    card, continue to ''Configure a Sound Card''. If YaST does not detect a sound
    card, automatically be directed to ''Manual Sound Card Selection''.


    If you create a CreativeBlaster Live or AWE sound card, automatically copy SF2
    fonts to your hard disk from the original SoundBl driver CD-ROM with ''Install
    Sound Fonts''. The sound fonts will be saved in the directory /usr/share/sfbank/


    Enable or disable the start-up of ALSA when booting the machine with ''Start ALSA''.
    For playback of MIDI files, activate ''Start Sequencer''. This way, the sound
    modules required for sequencer support are loaded along with ALSA modules.


    The volume and configuration of all sound cards installed will be saved when you
    click ''Finish''. The mixer settings are saved to the file /etc/asound.conf and
    the ALSA configuration data is appended at the end of the file /etc/modules.conf.


    # Configuring a Sound Card


    If multiple sound cards were detected, select your preferred card under ''List
    of Automatically Recognized...''. Continue to ''Setup'' with ''Next''. If the
    sound card was not automatically detected, click ''Select from List'' and, with
    ''Next'', proceed to ''Manual Sound Card Selection''.


    # Manual Sound Card Selection


    If sound card was not automatically detected, a list of sound card drivers and
    models are shown from which to choose. With ''All'', see the entire list of supported
    cards.


    Refer to your sound card documentation for the information required. A reference
    list of sound cards supported by ALSA with their corresponding sound modules is
    available in /usr/share/doc/packages/alsa/cards.txt and at http://www.alsa-project.org/~goemon/.
    After making your selection, click ''Next'' to return to ''Setup''.'
