    # 25.1.5 Wild Cards


    Another convenience offered by the shell is wild cards. There are four different
    types of these in Bash:


    +   * Matches exactly one arbitrary character


    +   * Matches any number of characters


    +   [set] Matches one of the characters from the group specified inside the square
    brackets, which is represented here by the string set


    +   [set] Matches one character other than those identified by set


    Assuming that your test directory contains the files Testfile1, Testfile2 and
    datafile, the command ls Testfile* lists the files Testfile1 and Testfile2. With
    ls Test*, the list will also include Testfile. The command ls *file shows all
    the sample files. Finally, you can use the set word to address all sample files
    whose last character is a number: ls Testfile[1-9].


    Of the four types of wild cards, the most inclusive one is the asterisk. It could
    be used to copy all files contained in one directory to another one or delete
    all files with one command. The command rm *fil*, for instance, would delete all
    files in the current directory whose name includes the string fil.'
