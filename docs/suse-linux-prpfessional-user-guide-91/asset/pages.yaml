    Support for Wireless Connections If you are located in a wireless LAN and your
    network card supports this connection type, use ''Wireless Device'' to access
    the ''Wireless Settings'' dialog in which to configure the operating mode, network
    name (ESSID), network ID (NWID), encryption key, and nickname. Press ''OK'' to
    complete the configuration of your card.


    # Kernel Module and Selection of the Network Card


    If your network card is a PCMCIA or USB device, activate the respective check
    boxes and exit the dialog with ''Next''. If not, select the network model with
    ''Select from list''. YaST automatically selects a suitable kernel module. Exit
    this dialog with ''Next''.


