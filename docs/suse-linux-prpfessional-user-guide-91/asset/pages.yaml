  md: 'the file access permissions from Section 25.2.1, the set reading permission
    (r) means that the contents of the directory can be shown. The write permission
    (w) means new files can be created. The executable permission (x) means the user
    can change to this directory. In the above example, the user uses tux as the members
    of the group project3 can change to the ProjectData directory (x), view the contents
    (r), and add new files to it (w). The rest of the users, on the other hand, are
    given less access. They may enter the directory (x) and browse through it (r),
    but not insert any new files (w).


    # 25.2.2 Modifying File Permissions


    The access permissions of a file or directory are changed by the owner and, of
    course, by root the command chmod, which must be entered together with the parameters
    specifying the changes to perform and the names of the respective files. Both
    parameters are comprised of


    +   1. the categories concerned

    - u (user) — owner of the file

    - g (group) — group that owns the file

    - o (others) — additional users (if no parameter is given, the changes apply to
    all categories)


    +   2. a character for deletion (&#8211;), setting (=), or insertion (+)


    +   3. the abbreviations


    +   - r — read

    - w — write

    - x — execute


    +   4. file name or names separated by spaces


    If, for example, the user tux in Example 25.2 on the facing page also wants to
    grant other users write (w) access to the directory ProjectData, he can do this
    using the command chmod +w ProjectData. If he wants to deny all users other than
    himself write permissions, he can do this by entering the command chmod -w ProjectData.
    To prohibit all users from adding a new file to the folder ProjectData, enter
    chmod -w ProjectData. Now, even the owner can write to the file without first
    reestablishing permissions.'
