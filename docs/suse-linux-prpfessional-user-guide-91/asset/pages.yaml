    panel.


    # 5.4.6 Formatting Floppy Disks with KFloppy


    KFloppy is the floppy disk formatter of KDE. Start the program from the main menu
    or from the command line with command kfloppy. KFloppy opens a dialog, shown in
    Figure 5.6 on the next, in which specify a number of settings. Under ''Floppy
    Drive'', select the primary or the secondary device, provided your machine has
    two floppy disk drives. The default setting for the size is ''3.5''''1.44 MB'',
    which is the most used floppy disk type. The setting for the file system is very
    important. Choose between the Linux format ext2 and MS-DOS. If you select MS-DOS,
    you will be able to read and write the floppy disk on a Windows machine.


    In the center, select ''Quick Format'' or ''Full Format''. The quick format procedure
    rewrites the file system and deletes all data. The full format procedure rewrites
    all tracks and sectors and is able to detect and mark bad sectors. Sectors marked
    as bad are not used for writing data. Select ''Verify Integrity'' to have the
    formatting checked and verified upon completion. If you activate ''Volume Label'',
    designate a name for the floppy disk in the input field below.'
