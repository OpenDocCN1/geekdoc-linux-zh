- img_proc: true
  md: '# 26.1 The Working Environment


    If ergonomics specialists examined the home workstations of computer users systematically,
    they would find many problems. Unfortunately, no standard has yet prevented individual
    users from buying so-called "special computer tables". The low-priced metal-tube
    frames with "practical rollers" (little stability),ergonomically retractable keyboard
    tray" (no wrist pad), "integrated PC case holder and printer stand under shelf"
    (little stacking space and times little legroom),swiveling mouse pad (unstable
    and insufficient working space), and "good view of the screen" (too close, too
    high) allow you to use a computer for short time only. They should not be used
    at professional terminal workstations as they hardly meet any criteria of the
    corresponding standards. You will not find much of this kind of computer furniture
    in professional computer equipment catalogs, because manufacturers indirectly
    keep an eye on the employees'' health by observing the minimum standards of computer
    workstations. These minimum standards should be improved.


    # 26.1.1 The Right Desk


    A table at the wrong height strains arm and back muscles. The resulting cramped
    posture especially strains the spine. Too little leg room can force an unnatural
    body posture and cause disorders to the blood supply.


    Choosing the right table is very easy. It should be as wide and deep as possible.
    An individual adjustment of the table height would be optimal. Working tables
    at which you can change between sitting and standing by turning the table into
    a writing stand, often just at the push of a button, a luxury, but changing between
    a sitting and standing position brings relief.


    +   * The flexible arrangement of working materials requires a table top of at
    least 160 x 80 cm.

    * Workstations made of several interlinked boards are recommended.

    * Tables that cannot be vertically adjusted must be between 72 cm. Tables that
    are vertically adjustable must be between 68 and 76 cm high.

    * Even more width is needed for certain working tasks, such as CAD workstations.
    When changing between screen work and other kinds of work, at least 200 cm is
    required.'
  merge: -1
  pgno: 423
- img_proc: true
  md: '# 26


    +   - There should be at least 60 cm leg room. Previous experience has shown,
    however, that this leg room is often too little.


    +   - When using large screens, tables should be 100 or 120 cm deep.


    +   - The table surface should not be in bright colors and should have minimal
    reflection. A lot of office furniture is available in a subdued grey tone.


    # 26.1.2 Sitting Correctly on the Right Working Chair


    Sitting in a working chair makes you sit in the same posture for a long time,
    unlike in an easy chair where you can move around easily. Constant sitting in
    the wrong position, such as bending forward or twisting to the side, can harm
    the respiratory and digestive organs. This leads to premature fatigue, circulatory
    disturbances, and backache resulting from overstraining the spine and the vertebrate
    disks. In extreme cases, years of sitting in the wrong position can lead to muscular
    and skeletal illnesses. Correct sitting means a frequent change of posture. Different
    parts of the body are then constantly used. Basically, it is a question of the
    correct adjustment. The height of your working chair is best when your forearms
    lying on the table are at right angles to your upper arms. You should be able
    to place your feet completely on the floor and your thighs and lower legs should
    also be at right angles. Gymnastic balls and balancing chairs offer an alternative
    to conventional seating arrangements.


    Unfortunately, a good chair, constructed according to ergonomic criteria, is relatively
    expensive, but the investment in your health is worth it. Important features of
    a good chair include:


    +   - a backrest reaching to the shoulder blades and with an adjustable kinetic
    resistance


    +   - support for the lumbar spine column


    +   - a seat that is also adjustable and can be tilted forwards or backwards


    +   - automatic regulation of backrest and seat to retain an ideal angle


    +   - springs that softly cushion the weight when sitting down


    +   - stability and rollers that are restrained when you stand


    +   - adjustable height of the seat (according to standards, 42 to 53 cm) and
    backrest


    Ergonomics in the Workplace


    SUSE LINUX – User Guide 405'
  merge: -1
