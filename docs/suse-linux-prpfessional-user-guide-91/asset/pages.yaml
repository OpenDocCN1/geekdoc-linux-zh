- img_proc: true
  md: '# 10.1 Starting KOrganizer


    Start KOrganizer from the main menu or with korganizer. The main window has several
    toolbars, a menu bar, the date navigator with a month view of the calendar, the
    main part displaying the currently selected calendar view, and a list containing
    all the current to-do items. All common program actions, such as saving, printing,
    and creating or deleting events, can be performed through the menus. See Figure
    10.1.


    ![](img/705a076b108ea96be0c0695efb5556ce_237_0.png)


    > Figure 10.1: The Main Window of KOrganizer


    KOrganizer can also be started in a windows containing other tools for office
    planning. More details are available in Section 5.4.10 on page 164.


    # 10.2 Configuring KOrganizer


    To configure KOrganizer, select ''Settings'' -> ''Configure KOrganizer...''. This
    opens a dialog in which you enter your name and e-mail address. When working with
    the program, the name is used to indicate who is the owner of a given to-do item
    or event. The e-mail address is used to identify the owner of the calendar. A
    user who is not the owner can read the calendar, but not modify it. ''Send copy
    to owner when mailing events'' should be enabled if you want to receive a copy
    of every e-mail sent out by the program (in your name) to the attendees of an
    event.


    For KOrganizer to save your scheduling items automatically when exiting, check
    ''Enable automatic saving of calendar''. This saves all changes'
  merge: -1
  pgno: 237
- img_proc: true
  md: 'automatically at a user-definable interval. To be prompted before any items
    are deleted, enable ''Confirm deletes''.


    Under ''Time & Date'', customize the defaults for working hours and appointments,
    define the default alarm time, and set your time zone. KOrganizer switches between
    winter and daylight savings time automatically.


    Under ''Fonts'', set your preferred font type and size for the different text
    fields of the program. Fonts can be selected for the day, the month view, and,
    under ''Agenda view'', for the day view, week view, and work week view.


    Under ''Colors'', set the colors that should be used to highlight events, to-items,
    and other elements. For instance, define that to-do items on the current day should
    be dark red and that overdue-to-do items should be light red.


    The other items of the preferences allow customization of the various views and
    the program''s group features. Under ''Group Scheduling'', provide additional
    e-mail addresses, which is useful if you are registered for certain event under
    a different address.


    ![](img/705a076b108ea96be0c0695efb5556ce_238_0.png)


    Figure 10.2: Configuring KOrganizer'
  merge: -1
  pgno: 238
- img_proc: true
  md: '# 10.3 Using the Calendar


    The calendar of KOrganizer can be displayed in a number of different views to
    show a certain month, day, week, or work week. There is also a view of the next
    three days. Details of these views can be configured with ''Settings'' -> ''Configure
    KOrganizer...'' under the ''Views'' item. Switch between the views with the ''Views''
    menu or by clicking the corresponding button in the toolbar.


    Existing event items can easily be modified with the mouse. One possibility is
    to change the start and end date or time by clicking the item''s upper or lower
    edge then dragging it to the desired position. In the day, week, and work week
    view, directly move an item to another time by clicking it then dragging to the
    new position. You can also move events outside the time of the current view. For
    instance, an item can be dragged to the date navigator to left. Even dragging
    an item to the date navigator of another KOrganizer window.


    # 10.3.1 Events


    To schedule a new event, select ''Actions'' -> ''New Event...''. Enter the details.
    Under ''Reminder'', specify the exact time (minutes, hours, or days in advance)
    at which the attendees should be remembered of the event. If an event recurs,
    specify the interval. Another way to create an event at a specific point in the
    calendar is to double-click the corresponding field in one of the program''s calendar
    views. This opens the same dialog window as available from the menu.


    Specify the attendees of an event by entering their data manually in the dialog
    or by inserting data from the address book. To enter such data manually, select
    ''New''. To import data from the address book, select ''Address Book...'' then
    the corresponding entry from the dialog.


    # 10.3.2 Attendees


    Participants for a schedule item are listed under ''Attendees'' in the item view.
    Sort the attendee list by clicking the column header of the value by to sort.
    To add an attendee for an item, click ''New''. Then enter the name in ''Name''
    and the e-mail address in the field below. Use ''Address Book...'' to query the
    address book and select entries from it. In ''Role'', define the function of an
    attendee (observer, chair, participant), which can'
  merge: -1
  pgno: 239
- img_proc: true
  md: '![](img/705a076b108ea96be0c0695efb5556ce_240_0.png)


    Figure 10.3: Scheduling with KOrganizer


    also be used to sort the list of attendees later. With ‘Status’, assign a status
    to an attendee, such as action needed, accepted, or completed. Change the status
    of an attendee at any time by selecting the attendee in the list and then choosing
    another status from the drop-down list. If you check ‘Request response’, the attendees
    receive an e-mail with the relevant schedule item.


    # 10.3.3 To-Do Items


    Create a new to-do item by selecting ‘Actions’ -> ‘New To-Do...’. In the dialog
    that opens, specify the exact start and date and time for the new task, its progress
    in percent, and its priority. If other people are involved, specify their details
    under ‘Attendees’. The created to-do item is then automatically included in the
    list left under ‘To-do items’. The ‘Summary’ column in this list shows the description.
    ‘Priority’ shows the value selected.


    # 10.3.4 Categories


    To manage your schedule, group events and to-dos according certain categories.
    Assign the scheduling items to one or several categories, for instance, if one
    of your items is to job training, you could assign it to both ‘Business’ and ‘Education’.
    Categories can be assigned in the dialogs for the creation of new events and to-dos
    after selecting ‘Categories...’. Create additional categories with ‘Edit Categories’.'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# 10.4 Printing


    Selecting ''File'' -> ''Print... . '' opens a dialog in which to define the calendar
    period to print and the type of view to use. To specify the period, enter the
    dates by hand or use the calendar available from the drop-downs. To use the print
    preview function, you must have KGhostView installed. Alternatively, specify a
    different PostScript viewer, such as gv, after selecting ''File'' -> ''Print...''
    -> ''Print...'' -> ''System Options... '' then going to the ''Preview'' item in
    the dialog.


    # 10.5 Address Book


    To store important contacts or to search for a contact, open the address book
    by selecting ''File'' -> ''Addressbook''. Make a new entry by selecting ''File''
    -> ''New Contact...''. The KDE address book application, although linked with
    KOrganizer, is an independent program. Learn more about it in Chapter 11 on page
    225.


    ![](img/705a076b108ea96be0c0695efb5556ce_241_0.png)


    222 10.4. Printing'
