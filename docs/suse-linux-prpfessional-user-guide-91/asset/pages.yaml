  md: '# 19.5 The JACK Audio Connection Kit


    Using the JACK Audio Connection Kit (packages named jack and qjackconnect), applications
    can exchange audio data with each other and with the sound card. This is only
    possible if the application has a JACK interface. JACK support has become a standard
    feature, so there are many applications that have needed the interface.


    | Readable Clients / Ports | Writeable Clients / Ports |

    | :--- | :--- |

    | -alsa_pcm | -alsa_pcm |

    | -capture_1 | -playback_1 |

    | -capture_2 | -playback_2 |

    | -ams_129_0 | -In_ID3_0 |

    | -Out_ID1_0 | -In_ID4_0 |

    | -Out_ID2_0 | -In_ID4_1 |

    | -Out_ID2_1 | -bridge-25018 |

    | -monitor_1 | -monitor_1 |

    | Connect | Disconnect | Show All Ports | Hide All Ports |

    | CPU load: 12.87 | Sample rate: 48000 |


    Figure 19.9: QJackConnect – a Patchbay for Jack


    To use JACK, first start the engine with jackd -d alsa -d hw:0. JACK was designed
    to achieve a low latency. With real-time priority. For more information, read
    the file /usr/share/doc/packages/jack/README.SUSE.


    The patchbay QJackConnect assists in tracking all JACK clients running in your
    system. Following the program launch with qjackconnect, the clients with readable
    ports are listed on the left side and the clients with writable ports are listed
    on the right. If no JACK clients were started, the lists initially display only
    the inputs and outputs of the sound card. The ports are displayed in a tree view
    under the client. Connect individual ports by selecting them from the lists and
    clicking ‘Connect’. Connect multiple ports simultaneously by selecting clients.'
