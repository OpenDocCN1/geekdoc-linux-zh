- img_proc: true
  md: '![](img/705a076b108ea96be0c0695efb5556ce_210_0.png)


    Figure 7.3: The OpenOffice.org AutoPilot


    # 7.6.2 Creating Texts without the AutoPilot


    Create a new document by selecting ''File'' -> ''New'' -> ''Text Document''. When
    editing a document, a second toolbar, called the object bar, is just below the
    standard function bar. Move the mouse pointer over an icon to get a short help
    text. Documents can also be formatted with the Stylist, which is described in
    Section 7.6.4 on the following page.


    # 7.6.3 Selecting Text


    To select, click the desired beginning of the selection, and keeping the mouse
    pressed, move the cursor towards the end of the range (which can be characters,
    lines, or entire paragraphs). Release the button at the end of the desired selection.
    While selected, text is displayed in-verted colors. Open a context menu by right-clicking
    the selection. Use the context menu to change the font, the font style, and other
    text properties. The Navigator displays information about the contents of a document.
    It also enables you to jump quickly to the different elements included. For example,
    use the Navigator to get a quick overview of all the chapters or to see a list
    of the images included in the document. Figure 7.4 on the next page shows the
    Navigator in action. The elements listed in the Navigator vary according to the
    document loaded in Writer. Open the Navigator by selecting ''Edit'' -> ''Navigator''.'
  merge: -1
