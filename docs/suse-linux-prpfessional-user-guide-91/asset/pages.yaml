  md: '# 17.4 E-Mail


    To configure the mail settings in Evolution, go to ''Shortcuts'' -> ''Inbox''.

    Then activate ''Tools'' -> ''Settings''.


    # 17.4.1 Configuring Accounts


    Evolution is capable of fetching e-mail from multiple mail accounts. The account
    from which to send e-mail can be selected when composing a message. To edit a
    current account, select the account in ''Settings'' -> ''Mail Accounts'' and click
    ''Edit''. To add a new account, click ''Add''. The configuration assistant described
    in Section 17.1 on page 274 opens. To delete an account, select it and click ''Delete''.


    To make an account the default for sending e-mail, select the desired account
    then press ''Default''. Disable fetching e-mail from an account, select the account
    then click ''Disable''. A disabled account can still be used as the address for
    sending, but that account is not checked for incoming-mail. If necessary, reactivate
    the account with ''Enable''.


    # 17.4.2 Mail Preferences


    Use ''Mail Preferences'' to select or disable the quote highlight color or how
    long after a message is marked as read. Also make settings regarding how images
    in HTML mail messages are handled.


    # 17.4.3 Creating Messages


    To compose a new message, click ''New'' -> ''Mail Message''. Replying to or forwarding
    a message opens the same message editor. Next to ''From'', select which account
    to send the message. In the recipient fields, enter an e-mail address or port
    of a name or address in your address book. Evolution can change what you enter
    in the address book, a selection list is displayed. Click the desired contact
    or complete your input by native. To select directly from the address book, click
    ''To'' or ''CC''. Evolution can send e-mail as plain text or HTML. To format HTML
    mail, in the toolbar. To send attachments, click ''Attach'' or ''Insert'' -> ''Attachment...''.


    To send your message, click ''Send''. If not to send it immediately, make another
    selection under ''File''. For example, save the message as a draft or send it
    later.


    ![](img/705a076b108ea96be0c0695efb5556ce_296_0.png)'
  merge: -1
  pgno: 296
- img_proc: true
  md: '# 17.4.4 Encrypted E-Mail and Signatures


    Evolution supports e-mail encryption with PGP. It can sign e-mail and check signed
    e-mail messages. To use these features, generate and manage keys with an external
    application, such as GPG or KGPG.


    When you receive signed e-mail from other users, a small padlock icon appears
    at the end of the message. If you click this, Evolution starts an external program
    (gpg) to check the signature. If the signature is valid, a green check mark appears
    next to the padlock symbol. If the signature is invalid, a broken padlock appears.


    The encryption and decryption of e-mail is just as easy as. After composing the
    e-mail message, select ''Security'' -> PGP encrypt'' and send the e-mail message.
    When you receive encrypted messages, a dialog opens to ask for the password of
    your secret key. Enter the passphrase to decrypt the e-mail message.


    # 17.4.5 Folders


    It is convenient to sort e-mail messages into a variety of folders. To view your
    folder tree, select ''View'' -> ''Folder Bar''. If accessing mail IMAP, the IMAP
    folders are also shown in this folder bar. For POP and most other formats, your
    folders are stored locally, sorted under ''Local Folders''. Your ''Contacts'',
    ''Calendar'', and ''Tasks'' are also treated as folders in view, but should not
    be used for sorting e-mail.


    Several folders are included by default. ''Inbox'' is where new messages are fetched
    from a server. ''Sent'' is used for saving copies of e-mail messages. ''Outbox''
    is temporary storage for e-mail that has not yet been sent. ''Drafts'' is used
    for saving unfinished e-mail messages. The ''Trash'' folder is intended for temporary
    storage of deleted items. The folder can be emptied automatically by activating
    the respective option under ''Tools'' -> ''Settings'' -> ''Mail Preferences''.


    New folders can be created under ''Local Folders'' or as subfolders of existing
    folders. Create as complex a folder hierarchy as desired. To create'
