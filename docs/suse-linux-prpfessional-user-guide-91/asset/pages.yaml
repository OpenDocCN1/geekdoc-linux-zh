  md: '# # The OpenOffice.org

    Office Suite


    OpenOffice.org is a powerful Linux office suite that offers tools for all types
    of office tasks, such as writing texts, working with spreadsheets, or creating
    graphics and presentations. With OpenOffice.org, use the same data across different
    computing platforms. You can also open and edit files in Microsoft Office formats
    then save them back to this format, needed. This chapter only covers the basic
    skills needed to get started with OpenOffice.org.


