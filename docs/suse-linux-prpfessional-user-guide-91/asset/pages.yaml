  md: '# Caution

    The software preselected for installation is based on long-standing experience
    and is usually suitable for the needs of most newcomers and advanced home users.
    In general, there is no need to change anything here. However, if you decide to
    select or deselect any packages, you should be awarere of the consequences. In
    particular, observe any warnings and avoid deselecting any packages of the base
    system.


    # Exiting the Software Selection


    When satisfied with your software selection and there are no more unresolved package
    dependencies or conflicts, click ‘Accept’ to apply your changes and exit the program.
    If this module is started in the installed system, the changes are applied immediately.
    During the installation, the changes are recorded internally and applied later
    when the actual installation starts.


    # 2.5.7 Boot Configuration (Boot Loader Installation)


    During the installation, YaST proposes a boot configuration for your system. Normally,
    you should leave these settings unchanged. However, if you need a custom setup,
    modify the proposal for your system.


    One possibility is to configure the boot mechanism to rely on a special boot floppy.
    Although this has the disadvantage of requiring the boot floppy in the drive for,
    it allows you to leave an existing boot mechanism untouched. This should not normally
    be necessary, however, because YaST can configure the boot loader to boot existing
    operating systems as well. Another possibility with the configuration is to change
    the location of the boot mechanism on the hard disk.


    To change the boot configuration proposed by YaST, select ‘Booting’ to open a
    dialog in which to change many details of the boot mechanism. For information,
    read Section 4.8.4 on page 120.


    > Note

    The boot method should only be changed by experienced computer users.'
