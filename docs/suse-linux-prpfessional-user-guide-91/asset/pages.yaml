    # 19

    Sound in Linux


    # 19.9 ALSA AND MIDI


    Apart from the possibility to play PCM data, many sound cards also offer MIDI
    functionality. The ALSA MIDI sequencer implements client architecture for routing
    MIDI data. You need the packages pmidi, aseqview, vkeybd, awesfx, snd_sf2, and
    alsatools.\Many sound cards have an external MIDI port for connecting MIDI devices,
    such as synthesizers, keyboards, and sound modules. If the MIDI port of the card
    is supported by ALSA, use a sequencer application, such as jazz, to record and
    play MIDI files. An overview of the MIDI devices provided by your card is available
    in the KDE Control Center under ''Sound & Multimedia'' -> ''System'' -> ''MIDI''.
    Also, determine the devices to use for playing MIDI files. On the command line,
    list the available MIDI devices and their internal ALSA port numbers with the
    command pmidi -1. For a Soundblaster Live!, the listing would appear as in Example
    19.1.


    Example 19.1: MIDI Devices of a Soundblaster Live!


    | Port | Client name | Port name |

    |---|---|--|

    | 72:0 | External MIDI 0 | MIDI 0-0 |

    | 73:0 | Emu10k WaveTable | Emu10k Port 0 |

    | 73:1 | Emu10k WaveTable | Emu10k Port 1 |

    | 73:2 | Emu10k WaveTable | Emu10k Port 2 |

    | 73:3 | Emu10k WaveTable | Emu10k Port 3 |


    The first column lists the internal port numbers by which the device is addressed
    by the ALSA driver. The other columns show the designation and port name of the
    device. Apart from the external MIDI port, several WaveTable ports are listed.
    Use a command like pmidi -p 73:0 mysong.mid to play a MIDI file over one of the
    listed ports.'
  merge: -1
  pgno: 334
- img_proc: true
  md: 'If a MIDI player is interrupted during playback, a continuous sound may persist.
    If this happens, run the all_notes_off script or restart ALSA as root with rcalsasound
    restart.


    Many sound cards (like Soundblaster AWE and Live!) have an internal WaveTable
    synthesizer that converts MIDI events into audible sounds. These MIDI events can
    be sent to the WaveTable synthesizer by an external MIDI keyboard or by a program,
    such as a MIDI player or sequencer. For Soundblaster AWE and Live! cards, the
    WaveTable synthesizer must be initialized with a sound font before any sound can
    be heard.


    # 19.9.1 Loading Sound Fonts: SB Live and AWE


    The package aeswf contains the sfxload command for loading sound fonts in Soundblaster
    AWE and Live! cards. Suitable sound font files are available on the driver CD
    of your sound card. The start-up of ALSA can automatically load the sound fonts
    required for the WaveTable synthesizer, provided the respective files were installed
    from the Creative driver using YAST. Currently, the script only works for one
    sound card. However, ALSA can easily manage up to eight sound cards.


    Sound fonts can be loaded with a command like sfxload -D <n> /usr/share/sfbank/8BMGSFSX.SF2
    (n) stands for the number of the sound card (0, 1, etc.). This may not be the
    number which the sound card was configured. This number is instead determined
    by the order in which the individual sound drivers are loaded.


    You can also load one of the sound fonts installed in /usr/share/sounds/sf2. The
    sound font Vintage_Dreams_Waves_v2.sf2 by I WILSON contains 128 analog synthesizer
    sounds and eight drum sets. It is suitable for SB AWE as well as SB Live! cards.
    The ROM sound font gull-rom.sf2 by SAMUEL COLLINS is only suitable for SB AWE
    cards. It provides an extended general MIDI bank for these cards. Review the copyright
    fights and the documentation in /usr/share/doc/packages/snd_sf2. More sound fonts
    are available at URLs such as http://www.hammersound.net.'
  merge: -1
