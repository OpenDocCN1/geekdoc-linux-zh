    the menu bar, the toolbar, and a number of shortcuts, you can right-click the
    opened document to access a context menu providing editor functions.


    KWrite supports the drag and drop functions of KDE, which means you can simply
    drag documents with the mouse from one application into another or paste data
    from the clipboard (see Section 5.4.4 on page 156). To edit a file which you have
    put an icon on the desktop, click the icon with the left button and hold the button
    while dragging it into the editor window. You can now edit the file as usual.
    Paste text from the clipboard by double-clicking. To edit or view the source code
    of HTML page, drag the URL into the editor window of KWrite, keeping the left
    button pressed.


