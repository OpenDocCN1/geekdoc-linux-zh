  md: '# Configuration of the Network Address


    Specify the address assignment method for your network card:


    # ‘Automatic Address Setup (with DHCP)’


    If a DHCP server exists in your network, automatically retrieve the configuration
    data for your network card. Activate the address assignment with DHCP if your
    DSL provider has not given you a static IP address for your system. Click ‘DHCP
    Client Options’ to access the client configuration. Here, specify whether the
    DHCP server should always respond to a broadcast. Additionally, you can specify
    an ID. By default, the host is identified by means of the hardware address of
    the network card. However, if you have several virtual machines using the same
    network card, distinguish them by means of various IDs.


    ‘Static Address Configuration’ If you have a static IP address, activate the respect
    checkbox. Enter the IP address and the correct subnet mask for your network. The
    preset value for the subnet mask will meet the requirements of a typical home
    network.


    Exit this dialog with ‘Next’ or configure the host name, network server, and routing.
    Refer to Sections 4.6.1 on page 107 and 4.6.6 on page 109.


    # Cable Modem


    In some countries (US, Austria), Internet access via cable modems has become relatively
    widespread. The cable subscriber gets a modem-like device from the ISP, which
    is connected to the TV cable network on one side and to the computer on the other
    using a 10BaseT (twisted pair) cable and a network card. As far as the computer
    is concerned, this is basically a permanent network with a static IP address.


    Following your provider’s specification, select either ‘Automatic Address Setup
    (with DHCP)’ or ‘Static Address Configuration’ for the configuration of your network
    card. Most providers use DHCP. A static IP address is generally included in a
    provider’s business package. In this case, the provider should have assigned a
    static IP address. Regarding the setup and configuration of cable modems, refer
    to the Support Database available online at http://sdb.suse.de/sdb/html/cmodem8.html.'
  merge: -1
