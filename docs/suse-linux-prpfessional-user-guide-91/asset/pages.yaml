    # 19.6.2 Editing Audio Files


    The ''AudioTrack'' menu can be opened to the left of each track and offers various
    views. One of them is ''Waveform DB'', which is not suitable for checking the
    signal tuning, as in this view the data is always adjusted to the maximum amplitude
    of the track.


    Depending on the application, various view formats for segment selections are
    offered under ''Set Selection Format''. With ''Snap-To-Mode'', the boundaries
    can automatically be adapted to the selected view format. For example, if you
    select ''PAL frames'' as the view format and ''Snap-To'', the boundaries will
    always be selected in multiples of frames.


    The many editing tools are all equipped with tool tips and should be quite easy
    to use. The ''Undo History'' function, which can be accessed with ''View'' ->
    ''History'', is a useful feature for viewing recent editing steps and undoing
    them by clicking the respective item in the list. Use ''Discard'' with caution,
    because it deletes editing steps from the list. Subsequently, these steps can
    no longer be undone.


    The built-in spectrum analyzer assists in quickly tracking down any noises. The
    view of the selected segment with ''View'' -> ''Plot Spectrum''. Select a logarithmic
    frequency scale in octaves with ''Log frequency''. If you move the mouse pointer
    within the spectrum, the frequencies are automatically displayed with the respective
    notes.


    Unwanted frequencies are best removed with ''Effect'' -> ''FFT Filter''. In connection
    with the filtering process, it may be necessary to readjust the signal amplitude
