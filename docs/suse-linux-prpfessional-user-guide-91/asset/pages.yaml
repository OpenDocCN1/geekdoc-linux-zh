  md: '# 17


    a new folder while in the ''Inbox'' view, select ''File'' -> ''Folder'' -> ''New

    Folder''. In the following dialog, enter a name for the new folder. Leave the

    ''Folder Type'' as ''Mail'' for a new mail storage folder. Use the mouse to de-

    termine the parent folder under which to place the new folder. Exit the dia-

