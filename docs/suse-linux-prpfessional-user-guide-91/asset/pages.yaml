  md: '# 4.8.7 Profile Manager (SCPM)


    The SCPM (System Configuration Profile Management) module offers the possibility
    of creating, managing, and switching among system configurations. This is especially
    useful for mobile computers that are used in different locations (in different
    networks) and by different users. Nevertheless, this feature is useful for stationary
    machines, as it enables the use of various hardware components or test configurations.
    Although the module with the accompanying help is easy to use, the configuration
    of profiles is a task that should performed by experts or system administrators.
    For more information about SCPM basics and handling, refer to the respective sections
    in the Administration Guide.


    # 4.8.8 Runlevel Editor


    SUSE LINUX can be operated in several runvels. By default, the system boots to
    runlevel 5, which offers multiuser mode, network access, and the graphical user
    interface (X Window System). The other runvels offer multiuser mode without network
    but X (runlevel 3), multiuser mode without network (runlevel 2), single-user mode
    (runlevel 1 and S), system halt (runlevel 0), and system reboot (runlevel 6).


    The various runvels are useful if problems are encountered with a particular service
    (X or network) in a higher runlevel. In this case, the system can be booted to
    a lower runlevel to repair the service. Many servers operate without a graphical
    user interface and must be booted in a runlevel without X, such as runlevel 3.


    Usually home users only need the standard runlevel (5). However, if the graphical
    user interface freezes at any time, you can restart the X Window system by switching
    to a text console with `Ctrl` + `Alt` + `F1`, logging in as root, and switching
    to runlevel 3 with the command `init 3`. This shuts down your X Window System,
    leaving you with a text console. To restart the graphical system, enter 5.


    In a default installation, runlevel 5 is selected. To start a different runlevel
    when the system is booted, change the default runlevel here. With ‘Runlevel properties’,
    determine which services are started in which runlevel.'
  merge: -1
  pgno: 144
- img_proc: true
  md: '> Caution

    Incorrect settings for system services and runlevels can render your system useless.
    To retain the operability of your system, consider the possible consequences before
    modifying any of these settings.


    For more information about the runlevels in SUSE LINUX, refer to the Administration
    Guide.


    # 4.8.9 Sysconfig Editor


    The directory /etc/sysconfig contains the files with the most important settings
    for SUSE LINUX (formerly centrally administered in the file) /etc/rc.config. The
    sysconfig editor displays all settings in a well-arranged format. The values can
    be modified and saved to the individual configuration files. Generally, manual
    editing is not necessary, as the files are automatically adapted when a package
    is installed or a service is configured.


    > Caution

    Do not edit the files in /etc/sysconfig if you do not know exactly what you are
    doing, as this could seriously inhibit the operability of your system.


    More information is provided in the Administration Guide.


    # 4.8.10 Time Zone Selection


    The time zone was already set during the installation, but you can make changes.
    Click your country or region in the list and select ''Local time'' or ''GMT''
    (Greenwich Mean Time). ''GMT'' is often used in Linux systems. Machines with additional
    operating systems, such as Microsoft Windows, mostly use local time.


    # 4.8.11 Language Selection


    Here, select the language for your Linux system. The language can be changed at
    any time. The language selected in YaST applies to the entire system, including
    YaST and the desktop environment KDE 3.'
  merge: -1
