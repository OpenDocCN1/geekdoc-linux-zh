    The job list consists of the job ID automatically assigned by the print system
    to identify the various jobs. The next column contains the login of the user who
    sent the job by the file name of the document. The status column indicates whether
    a job is still in the queue, currently printed or already completed. Next, the
    size of the document is displayed in kilobytes and number of pages. The default
    priority of 50 can be increased or reduced if necessary. Billing information can
