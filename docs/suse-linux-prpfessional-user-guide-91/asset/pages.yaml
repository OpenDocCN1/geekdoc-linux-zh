- img_proc: true
  md: '![](img/705a076b108ea96be0c0695efb5556ce_246_0.png)


    ''Miscellaneous'' allows adding a picture or logo to the selected contact. Other
    features, like the entering longitude and latitude of a location, are possible.


    # # 11.2 Creating Address Lists


    To generate lists from your address data, open the editor for distribution lists
    with ''Settings'' -> ''Toolbars'' -> ''Distribution Lists''. Use ''New List''
    to create one or several new lists under different names. The new entries appear
    in the drop-down menu at the top left corner of the editor. Select the desired
    list then drag and drop all desired contacts from the overview in the left part
    of the window to the list overview. Renaming and deleting lists is also possible
    here. See Figure 11.3 on the following page.


    # # 11.3 Searching Address Data


    Basically, KAddressBook offers three options for searching address data:'
