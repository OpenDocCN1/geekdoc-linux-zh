  md: '''Action'' The answering machine features various processing options for incoming
    messages. The default setting MailAndSave records a message, saves it in the system,
    and delivers it to the user by e-mail. The SaveOnly option can be chosen if the
    reception of e-mails is not desired. It merely saves the message to the hard disk.
    This option is only recommended for expert users. The None option completely deactivates
    the recording of messages. It plays the welcome message then hangs up.


    ''PIN'' Enter a personal identification number (PIN) for remote access. A numerical
    code of any length can be entered. If it is entered during playback of the welcome
    message, the user is taken to the remote access menu. The remote access feature
    is disabled if the field is left empty.


    ''OK'' accepts the changes. ''Cancel'' closes the dialog without applying any
    changes.


    # 18.2 Usage


    The following section briefly describes the use of the system. Following a short
    introduction to the reception of messages with the Linux mail system, a description
    is provided for the operation of the fax functionality and the answering machine.


    # 18.2.1 General Notes about Reception


    The development of CapeSuite heavily relied on already existing capabilities of
    Linux. This is why the delivery of incoming faxes and voice messages is handled
    by the internal Linux mail system instead of proprietary applications and protocols.

    This requires the configuration of a mail client for receiving local messages
    for each user of CapeSuite. For details, read the chapter about the mail program
    or the documentation provided with the application.


    Follow these steps to activate reception of local e-mail messages in KMail:


    +   - Start KMail as usual.

    - Select ''Settings'' -> ''Configure KMail'''
  merge: -1
  pgno: 311
- img_proc: true
  md: '# 18


    +   - Click the network icon in the list to the left.


    +   - Select the ‘Receiving’ tab.


    +   - Reception is already configured if an entry with the type local is already
    present in the list. The dialog can be closed with ‘Cancel’ in that case. If not,
    click ‘Add..''.


    +   - Select ‘Local mailbox’ from the list and confirm with ‘OK’.


    +   - Name the new account (for example, ‘local inbox’) by entering the name in
    the upper input field. All other settings can be left at their default values.


    +   - Then complete the configuration by clicking ‘OK’.


    If you have not disabled the sending of mail in the CapisSuite configuration,
    you will receive all incoming voice and fax messages in your e-mail program, where
    you can view them or listen to them as usual.


    # 18.2.2 Fax Operation


    Further instructions are necessary for receiving fax messages. As soon as a fax
    is received for a number assigned to a user, the message is stored in the system
    and delivered to the user as an e-mail with a PDF attachment (PDF is a common
    exchange format for documents and can be read in virtually all operating systems
    with Acrobat Reader from Adobe). The user can open, read, and print the document
    in his mail program.


    For backup purposes, every received document is also stored on the hard disk in
    /var/pool/capisuite/users/<username>/received/. This directory can be accessed
    if anything goes wrong during the e-mail transmission of any email message accidentally
    deleted. More information can be found in the Capisuite documentation in /usr/share/doc/packages/capisuite/index.html.


    The command line tool capuitefax is available for sending faxes. It accepts one
    or more target fax numbers and one or more documents in the PostScript format.
    This format is generated by most Linux applications when writing to a file.


    capuitefax supports parameters such as the following:


    -h or -help Returns a short summary of valid parameters.'
  merge: -1
  pgno: 312
- img_proc: true
  md: '-d <number> or -dialstring=<number>

    This parameter declares the target number to which the fax should be sent.


    -q or -quiet capisuitefax usually generates a few informative messages. This option
    suppresses this and only allows the display of possible error messages.


    The following command would send the two documents document1.ps and document2.ps
    to the target number 089123456:


    ```

    capisuitefax -d 089123456 document1.ps document2.ps

    ```


    capisuitefax converts the documents to the correct format and stores them together
    with a description file in a special folder from which they are fetched and sent
    by Capisuite. There can be a short delay between the execution of the command
    and the actual sending. The user is notified by e-mail when a fax message has
    been successfully sent or after the failure of a set number of attempts.


    In the standard desktop KDE, fax messages can easily be sent from any application
    with the help of the KDEPrintFax utility. Configure KDEPrintFax as follows:


    +   - Start KDEPrintFax. This can be done by pressing Alt+F2 and entering kdeprintfax.

    - Select ''Settings'' -> ''Configure KDEPrintFax''.

    - Click the ''System'' icon in the left pane.

    - As capisuitefax is largely compatible with the HylaFAX suite, select HylaFAX
    under ''Fax system''.

    - Set ''Command'' to /usr/bin/capisuitefax -d %number %files.

    - Finish the configuration by clicking ''OK'' and closing KDEPrintFax.


    ''Send to Fax'' is then available in the ''Print'' menu of any KDE application.
    Selecting it KDEPrintFax, which requests the target phone number and sends the
    fax.


    Non-KDE applications can also use this function if their print command can be
    set manually. In this case, replace lpr with kprinter. When you print a document,
    the KDE print menu will be displayed along with the possibility to transmit fax
    messages.'
