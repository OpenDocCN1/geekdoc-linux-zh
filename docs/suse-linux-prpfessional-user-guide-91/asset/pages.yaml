  md: '# Input Devices


    Mouse If the mouse already works, you do not need to do anything. However, if
    the mouse does not work, control it with the number pad of the keyboard as described
    in Section 4.4.4 on the page. The automatic detection fails, use this dialog to
    configure your mouse manually. Refer to the documentation of your mouse for a
    description of the model. Select your mouse from the list of supported mouse types
    and confirm by pressing ⑤ on the number pad.


    Keyboard Use the selection field at the top of this dialog to specify the kind
    of keyboard to use. Then select the language for the keyboard layout (the country-specific
    position of the keys). Use the test field to check if special characters are displayed
    correctly. The status of the check box used for activating and deactivating the
    accented letters depends on the respective language and does not need to be changed.
    Click ''Finish'' to apply the new settings to your system.


    Touchscreen Currently, XFree86 only supports Microtouch and Elo TouchSystems touchscreens.
    SaX2 can only autodetect the monitor, not the touchscreen. The touchscreen is
    treated as an input device. To configure the touchscreen, start SaX2 and select
    ''Input devices'' -> ''Add'' and add a touchscreen. Save the configuration by
    clicking ''Finish''. You do not need to test the configuration. Touchscreens feature
    a variety of options and usually must be calibrated first. Unfortunately, there
    is no general tool for this purpose in Linux. The standard configuration contains
    suitable default values for the dimensions of the touchscreen. Normally, no additional
    configuration is required.


    Graphics Tablet Currently, XFree86 only supports a limited number of graphics
    tablets. SaX2 enables the configuration of graphics tablets connected to the USB
    port or the serial port. From perspective, a graphics tablet is just an input
    device like a mouse. Start SaX2 and select ''Input devices'' -> ''Graphics tablet''.
    Click ''Add'', select the vendor from the following dialog, and add a graphics
    tablet from the selection list. Mark the check boxes to the right if you have
    connected a pen or eraser. If your tablet is connected to the serial port, verify
    the port. /dev/tty0 refers to the first serial port. /dev/tty1 refers to the second.
    Additional ports use similar notation. Save the configuration by clicking ''Finish''.'
