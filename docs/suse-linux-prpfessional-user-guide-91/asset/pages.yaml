    In ''Settings'' -> ''Configure KGet...'', set preferences for the connection,
    determine directories for specific file extensions, and specify other settings.


    # 5.4.3 SuSEWatcher


    SuSEWatcher is a program that is integrated in the system tray of the panel. It
    checks for new updates and new hardware. To be able to find any new updates, it
    requires an online connection. The program SuSEWatcher is located in the package
    kdebase3-SuSE. The status of SuSEWatcher is displayed by means of colorful icons
    in the panel.


    When you click the icon in the panel, a window opens, informing you about the
    status of your online updates and the availability of any new updates. You can
    also launch the check manually by clicking ''Check for updates''. Start the online
    update by selecting ''Start online update'' and entering the root password. The
    Yaast Online Update window is displayed.


    # 5.4.4 The Clipboard Klipper


    The KDE program Klipper serves as a clipboard for selected text, normally marked
    by keeping the left mouse button pressed. This text can be transferred to another
    application by moving the mouse pointer to the target location then pressing the
    middle mouse button (on a two-button mouse). The text is copied to the selected
    location from the clipboard.


    By default, Klipper is started when KDE is loaded and appears as a clipboard icon
