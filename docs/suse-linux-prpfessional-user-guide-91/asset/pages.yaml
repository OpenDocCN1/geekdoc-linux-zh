  md: '# Digital Cameras and Linux


    gPhoto 2.0 is a command-line program for communicating between the computer and
    a digital camera. It is compatible with several graphical interfaces (front-ends),
    including gtKam, Konqueror, Kamera, and Gno-Cam. This chapter covers the use of
    gtKam, Konqueror, and Digikam.


    +   22.1 Connecting to the Camera . . . . . . . . . . . . . 346

    22.2 Installing the Programs . . . . . . . . . . . . . . . 346

    22.3 Using Konqueror . . . . . . . . . . . . . . . . . 346

    22.4 Using gtKam . . . . . . . . . . . . . . . . . . . . . . . 347

    22.5 Using Digikam . . . . . . . . . . . . . . . . . . . . 348

    22.6 For More Information . . . . . . . . . . . . . . 349'
  merge: -1
  pgno: 364
- img_proc: true
  md: 'A comprehensive list of supported cameras is available at http://www.gphoto.org/cameras.html.
    If gphoto2 is installed, re-trive the list with the command gphoto2 --list-cameras.
    gphoto2 --help provides information about the available commands in the command-line
    interface.


    # 22.1 Connecting to the Camera


    The fastest and most convenient way to connect digital cameras to the computer
    is USB, provided the kernel, the camera, and the computer support USB. The standard
    SUSE kernel provides this support. A suitable cable is also required.


    > NotenUsing the USB connection can quickly drain your camera’s batteries. Consider
    using a power adapter.


    Simply connect the camera to the USB port and turn on the camera. You may need
    to switch your camera to a special data transfer mode. For this procedure, consult
    the manual of your digital camera.


    # 22.2 Installing the Programs


    Use YaST to install the gtikam package. The other required packages are selected
    automatically. Digikam is included in the default installation. If it is not installed,
    use YaST to install it, if desired. For more information about installing packages
    with YaST, refer to Section 4.3.4 on page 59.


    # 22.3 Using Konqueror


    KDE users can easily access digital cameras by means of the familiar Konqueror
    interface. Connect your camera to the USB port. A camera icon should appear on
    the desktop. Click this icon to open the camera in Konqueror. The camera can also
    be accessed by entering the URL camera: / in Konqueror. Navigate through the camera’s
    directory structure until the'
  merge: -1
  pgno: 365
- img_proc: true
  md: 'files are shown. Use the usual Konqueror file management features to copy the
    files as desired. More information about using Konqueror is available in Chapter
    12 on page 233.


    # 22.4 Using gtKam


    gtKam is a graphical interface for downloading and deleting pictures from the
    digital camera. To adjust or edit your pictures, use The GIMP as described in
    Chapter 24 on page 357.


    ![](img/705a076b108ea96be0c0695efb5556ce_366_0.png)


    > Figure 22.1: The Main Window of gtKam


    Connect your camera to the appropriate port and turn on the camera. Start gtKam
    with the command gtkam s. From the menu, select ''Camera'' -> ''Select Camera...''.
    In the dialog that opens, select the camera model or use ''Detect''. Select the
    appropriate port if the detection fails.

    The main gtKam window is divided into three sections — the menu and toolbars,
    the left pane with index settings and camera and directory selection, and the
    right pane for displaying an image listing with or without thumbnails. The icons
    in the toolbar provide the main functions needed. The disk icon saves the selected
    images. The trash icon deletes them. The icon with the paper and pencil icons
    opens the camera configuration options. The door icon exits the program.

    Your camera should be listed in the left pane. Use the plus sign (+) to the left
    to expand the tree display of the directory structure. Your exact directory structure
    depends on the camera type and model. Continue expanding'
  merge: -1
  pgno: 366
- img_proc: true
  md: 'until you reach the entries that cannot be expanded. These are the index listings
    of the pictures. Click an item to select it. If ''View Thumbnails'' is activated,
    the picture names and thumbnails are displayed in the right-window pane. Otherwise,
    the names and an icon are displayed.


    Images in the right pane can be selected or deselected by clicking them. Select
    all images using ''Select'' -> ''All'' or (Shift) + A. To save the images, use
    the disk icon in the toolbar, select ''File'' -> ''Save Selected Photos...'',
    or use the shortcut (Ctrl) + S. The ''Save'' dialog, shown in Figure 22.2 on page
    350, has a number of options. Under ''What to Save'', select whether to save the
    thumbnails, the images, or both. With ''Open image(s) with'', save the image and
    open it in another program. To open the images in The GIMP immediately, enter
    gimp. Using the file names suggested by the camera is recommended.


    # 22.5 Using Digikam


    Digikam byi Raju is a KDE program for downloading photographs from digital cameras.
    On start-up, Digikam presents a window with three sections: your home directory
    is displayed to the left, the photographs available in the camera are displayed
    to the right, and a list of cameras is displayed below.


    To set up a camera in Digikam, select ''Configure'' -> ''Setup''. A window displaying
    a list of supported cameras opens. First, try to autodetect the camera with ''Auto-Detect''.
    If this fails, browse the list for your model. If your camera model is not included
    in the list, try an older model. Normally, this should work.


    The path to your image folders (the location where your photographs are saved)
    can be specified in the same dialog out the ''General Settings'' tab. You can
    also determine the size of the thumbnails, the way file names are displayed, and
    some other settings.


    After your camera has been detected correctly and you have configured the program
    as desired, confirm with ''OK''. The name of your camera is then displayed at
    the bottom left in the main window. Double-click it or select ''Camera'' -> ''Connect''
    to Digikam to your camera. The thumbnails are displayed to the right. Right-click
    the image to open a pop-up menu with which to view, save, or delete the image
    or view its properties.


    Select all photographs to download from the camera by pressing the left mouse
    button or clicking individual photographs with (Shift) pressed. Selected photographs
    appear with inverted colors. Drag the selected pho'
