  md: '# Ergonomics in the Workplace


    This chapter is a short discussion of the ergonomic issues involved in the layout
    of computer workplaces. This text should not be seen as a substitute for studying
    the respective standards. No citations from these are are included here and footnotes
    with references to other literature are completely omitted to preserve readability.
    The items referred to in each section are mostly gathered from German literature
    and are almost always based on regulations and policies in the Federal Republic
    of Germany. This information is still useful in designing an ergonomic work area.


    +   26.1 The Working Environment . . . . . . . . . . . . 404

    26.2 Office Equipment . . . . . . . . . . . . . 409

    26.3 Links and Literature . . . . . . . . . . . . 413'
