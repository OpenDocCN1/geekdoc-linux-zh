    # 13.1 Optimized for the Web


    Galeon is primarily designed to make surfing the Internet as convenient as possible.
    In the default configuration, Galeon presents a second toolbar, enabling quick
    access to the popular Google search engine and its news and image search function.
    It can also offer access to an online dictionary and use the *bookmarks*. This
    is made possible by small JavaScript functions built into Galeon, for example,
    find out how current a page is or allow the Internet site to slowly scroll down
    the screen.'
  merge: -1
  pgno: 257
- img_proc: true
  md: '# 13.2 Efficient Surfing with Tabs


    Galeon can display multiple documents in a single application window. To open
    a link in a web site in the form of a new tab, right-click that link. Select ''Open
    in new tab'' in the pop-up menu. Create a fresh Galeon tab by clicking ''File''
    -> ''Open New Tab''. Click the tabs to switch the display.


    # 13.3 Smart Bookmarks


    Smart bookmarks give access to a site''s functions along with its address, searching
    the Internet for terms with Google. Enter the word in the input field after the
    Google icon. The result is displayed after a few seconds. To activate or create
    additional smart bookmarks, select ''Bookmarks'' -> ''Smart Bookmarks Toolbar''
    -> ''Folder actions'' -> ''Edit...''. A window opens in which to edit the bookmarks.
    To create a new bookmark, mark ''Smart Bookmarks Toolbar'' and select ''File''
    -> ''New item''. Enter a name in ''Name'' and the web address in ''URL''. The
    ''Smart URL'' field is a URL that contains a wild card for the entire string.
    For example, the smart URL for Google is http://www.google.com/search?q=%s. %s
    is the wild card. Save your bookmarks with ''File'' -> ''Save''.


    # 13.4 Settings and Controls


    Modify the configuration of the browser with ''Settings'' -> ''Preferences''.
    This dialog provides access to settings controlling both appearance and functionality.


    Galeon features built-in password management and cookie controls. It also has
    options that specify the web sites from which images may be downloaded. These
    options can be accessed through a single dialog via ''Tools'' -> ''Cookies'' ->
    ''View Cookies''.


    # 13.5 For More Information


    For more information about Galeon, see http://galeon.sourceforge.net. The GNOME
    home page http://www.gnome.org can also be helpful.'
  merge: -1
