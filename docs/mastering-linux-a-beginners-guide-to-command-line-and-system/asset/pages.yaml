  md: '# System Information:


    | Command | Function | Usage Example |

    | --- | --- | --- |

    | `uname` | Display system information | `uname -a` |

    | `top` | Display system processes | `top` |

    | `df` | Show disk space usage | `df -h` |

    | `free` | Display available memory | `free -h` |


    # Help and Manual:


    | Command | Function | Usage Example |

    | --- | --- | --- |

    | `man` | Display manual pages | `man ls` |

    | `--help` | Display command-specific help | `ls --help` |


