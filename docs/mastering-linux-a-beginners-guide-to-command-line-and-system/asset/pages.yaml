  md: '1. apt (Advanced Package Tool):


    Debian-Based Systems: apt is the go-to package manager for Debian-based distributions
    like Ubuntu.


    Features: It''s known for dependency resolution, simple usage, and a vast repository
    of software.


    Commands: Common commands include apt-get, apt-cache, and aptitude.


    2. yum (Yellowdog Updater Modified):


    Red Hat-Based Systems: yum was the package manager for older Red Hat-based systems
    like CentOS 6 and earlier versions.


    Features: It handled package dependencies, updates, and installations.


    Legacy: In newer Red Hat-based systems like CentOS 7 and 8, yum has been replaced
    by dnf.


    3. dnf (Dandified YUM):


    Modern Red Hat-Based Systems: dnf is the successor of yum in newer Red Hat-based
    distributions like CentOS 8 and Fedora.


    Features: It offers better performance, improved dependency resolution, and a
    cleaner command structure compared to yum.'
