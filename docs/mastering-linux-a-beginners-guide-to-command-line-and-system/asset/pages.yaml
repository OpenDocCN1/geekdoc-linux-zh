    # Basic Commands:


    | Command | Function | Usage Example |

    |---|---|--|

    | `ls` | List directory contents | `ls` |

    | `cd` | Change directory | `cd Documents` |

    | `pwd` | Print working directory | `pwd` |

    | `mkdir` | Make directory | `mkdir NewFolder` |

    | `touch` | Create a new file | `touch new_file.txt` |

    | `rm` | Remove/delete file or directory | `rm file.txt` |


    # File Manipulation:


    | Command | Function | Usage Example |

    |---|---|--|

    | `cat` | Concatenate and display file contents | `cat file.txt` |

    | `cp` | Copy files and directories | `cp file1.txt file2.txt` |

    | `mv` | Move/rename files and directories | `mv file1.txt new_directory/` |

    | `rm` | Remove/delete file or directory | `rm file.txt` |


    # File Permissions:


    | Command | Function | Usage Example |

    |---|---|--|

    | `chmod` | Change file permissions | `chmod +x file.sh` |

    | `chown` | Change file owner and group | `chown user:group file.txt` |'
  merge: -1
