    # LINUX COMMANDS FOR MONITORING OR DEBUGGING


    To scrutinize messages on a log file

    ```bash

    tail -f /var/log/messages

    ```


    To sum up profile system calls through command

    ```bash

    strace -c ls >/dev/null

    ```


    To note system calls made through command

    ```bash

    strace -f -e open ls >/dev/null

    ```


    To scrutinize what is written to stdout and stderr

    ```bash

    strace -f -e trace=write -e write=1,2 ls >/dev/null

    ```


    To list paths which process id that has open

    ```bash

    lsof -p $$

    ```


    To list procedures which have specified open path

    ```bash

    lsof ~

    ```


    To list library calls made through command

    ```bash

    ltrace -f -e getenv ls >/dev/null

    ```


    To display network traffic apart from ssh

    ```bash

    tcpdump not port 22

    ```


    To list procedures through % cpu usage

    ```bash

    ps -e -o pcpu,cpu,nice,state,cputime,args --sort pcpu | sed ''/^ 0.0 /d''

    ```


    To list procedures in hierarchy

    ```bash

    ps -e -o pid,args --forest

    ```


    To list procedures through mem (KB) usage

    ```bash

    ps -e -orss=,args= | sort -b -k1,1n | pr -TW$COLUMNS

    ```


    To list elapsed wall time for specific process IDs

    ```bash

    ps -p 1,$$ -o etime=

    ```


    To list all threads for specific processes

    ```bash

    ps -C firefox-bin -L -o pid,tid,pcpu,state

    ```


    To display system reboot history

    ```bash

    last reboot

    ```


    To show a changing process subtree

    ```bash

    watch -n.1 pstree -Uacp $$

    ```


    To display amount of remaining RAM

    ```bash

    free -m

    ```


    To monitor udev events to assists configure rules

    ```bash

    udevadm monitor

    ```


    To watch changeable data constantly

    ```bash

    watch -n.1 ''cat /proc/interrupts''

    ```


