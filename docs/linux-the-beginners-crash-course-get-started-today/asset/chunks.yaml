    ### The Kernel


    This is known to be one of the most important parts of the operating system. No
    operating system can function without this piece. It is the core of the operating
    system and controls the entire Processing Unit. The Kernel manages the remainder
    of the system. This part is also responsible for running memory as well as communicating
    with peripherals.


    ### The Boot loader


    As the name suggests, this is the software that controls the boot procedures of
    the laptop or computer. Many users would have noticed this as a splash screen
    popping up and then going to the boot.


    ### Desktop Environment


    This is known to be among one of the most creative and interesting programs. It
    is a puzzle that the users interact with. This program is also one of the most
    interactive pieces of the operating system. The system has a number of desktop
    environments to select from to their preferences, such as Cinnamon, KDE, Enlightenment,
    XFCE, Unity. Every desktop environment has a number of built-in applications like
    web browsers, games, tools, configurations.


    ### The Shell


    The shell is a program that controls the user’s interaction. It is a process that
    allows the user to take complete control over the computer through the commands
    they type in the text interface. It is not a part of the kernel but uses it to
    create files, perform programs and much more. In simple words, it is the program
    that takes all the commands from the keyboard to the operating system.


    ### Daemons


    This is a program that runs as a background procedure. This program is not under
    the direct control of the user. Daemons controls the background services such
    as sound, printing, etc. that start during the boot or after you have logged into
    the desktop. The processes under this program end with the letter D.


    ### Applications


    Where applications are concerned, the desktop environment does not offer the users
    with a number of options. Linux provides the users with millions of superior quality
    software titles, just like the MAC and Windows that can be installed. The modern
    distributions that are included in Linux include tools that are similar to the
    App-store. These applications centralize and also make the installation procedure
    simple for you.


    ### Graphical Server


    This is the system that holds half of the responsibility to display graphics on
    the screen. The Graphical Server is usually referred as X or the X server.

