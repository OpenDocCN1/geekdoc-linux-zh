    The liberty to run any program.


    The liberty to make changes to the programs according to your preference.


    You can even redistribute copies to help your loved ones.


    Lastly, you can distribute the copies of the modified version that you created
    to your loved ones.


    Thus, it is a community that is created by you, for you. This is known to be the
    simplest and most user-friendly operating system. It is all about freedom. Complete
    Linux installation can be done on your desktop or laptop as it does not involve
    a lot of complexities.


    Development


    The Linux operating system includes a number of development languages. Most of
    the distribution codes are created in C or C++ Languages. The rest of the codes
    are created with Perl, Java as well as Lisp. One of the most important parts of
    the Linux operating system, The Kernel has 95% C presence. The remaining part
    is used with other languages that make this part more diverse when compared to
    the other systems.


    There are a few developers that at present use text-based tools to develop the
    code. Linux is known to be the most versatile operating system and a strong integrated
    development environment. It is a platform that can help you generate money while
    being free of cost. Users can be certain that the Linux operating system can work
    best for them.


    Chapter 3: File Systems For Linux


    File systems are one of the layers underneath your operating system. This is something
    that is usually not considered unless one is faced with the plethora of alternatives
    in Linux. It is essential to know how to make a well-informed decision on which
    file system needs to be used.


    The landscape of the file systems support of Linux is completely different from
    that of OS X and Windows. As far as Windows and OS X are concerned, there is software
    that will add support for non-standard file systems. However, both operating systems
    can be installed on their native file system, and third party support is then
    added.


    On the other hand, Linux has an enormous range of supported file systems developed
    into the kernel. But the main question is how to know which file system to select
    at the time of installation. There are some of the very popular choices available.
    However, the choice completely depends on the requirements.


    What Is Journaling?


    Prior to going ahead with file system options, it is essential to first have a
    quick check on journaling. One of the significant things about journaling is that
    all of the modern file system makes use of journaling in one or another form,
    and on any desktop or laptop that you are setting up with Linux. This is where
    it is essential to use the journaling file system.


    Only when writing to disk, journaling is utilized. With this, the issue of disk
    corruption can be fixed at the time things are written to the hard drive and after
    that if the computer crashes or when there is a loss of power. The operating system,
    without the journal, will not be able to in know if the file was completely written
    to the disk.


    With the use of journaling, the file will first be written to the journal, enter
    it and then the journal will write a file to the disk when it is ready. After
    it has been successfully written to the disk, it will be removed from the journal,
    then punch out and the operation will be finished.


    In case there is a loss of power at the time of being written to the disk, the
    file system can check out the journal for all operations which have not been finished
    and remember where it left off.


    The major downside to journaling is that it will compromise some performance in
    substitute for stability. In order to write a file, there is lots of overhead.
    However, the file system will go around this overhead. This is possible through
    not writing the complete file to a journal. Rather than this, the file metadata,
    inode or disk location is recorded prior top actually being written to disk.


