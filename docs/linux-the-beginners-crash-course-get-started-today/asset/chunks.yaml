    Chapter 6: Linux Backup Techniques


    Accidents can happen anytime without any warning bells. So, it is extremely important
    to have a safe place to store the data with the use of other hosts, tapes, floppy
    disks as well as CDs.


    A reliable backup tool is something that is certainly not optional, and everyone
    should have one. This definitely does not imply that you need to spend a whole
    fortune on the backup to get a setup. A backup expense is one thing that you need
    to keep ready because you never know when the need will arise.


    There are a number of solutions available in the market. A few are cost effective
    and have minimal features, others are expensive and full of features. There are
    severalbackup solutions available for the Linux operating system and some popular
    and effective ones are mentioned below:


    *   Bacula


    *   Fwbackups


    *   Mondorescue


    *   Rsync


    *   Amanda


    *   Simple backup solution


    *   Back in time


    *   Box backup


    *   Arkeia


    *   Kbackup


    *   Areca backup


    *   Afbackup


    *   Tar


    *   Dump


    *   Cedar backup


    *   Duplicity


    *   Rsnapshot


    *   PING


    *   Partimage


    *   Clonezilla


    *   Zmanda


    *   Timevault


    *   Flyback


    *   AMANDA


    Below are somepointers that you need to know regarding the Linux backup techniques:


    *   Create, question and the unpack the file archives


    *   Make Java archives


    *   Encrypt your important data


    *   Write a CD


    *   Look for important data to use the other backup


    When choosing a backup for the Linux operating system, it is important for you
    to look for things such as auto-changers, backup media, open source software,
    data format, cross-platform support, volume shadow copy, reports and alerts, commercial
    support, deduplication, backup span multiple volumes, encryption data stream,
    etc.


    Chapter 7: Setting Up A Linux Printer


    One of the few pieces of hardware that lead to trouble with the Linux system is
    the printer. However, it is simple to check to see if your printer is supported
    or not. Once you know that the printer is supported, it will take only a few steps
    to get it work for you.


    There are a few very rare cases where you will find that the printer is not marked
    as functional, however, to be on the safer side it is good to stick to the general
    rule and that is to check the compatibility.'
