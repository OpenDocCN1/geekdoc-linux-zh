    # Linux Text Editors


    Linux has many of text editors available when it comes to simple text, structured
    text and programming languages. Here are some of the most popular listed, and
    all of these are available for a wide range of operating systems.


    ## Linux Text Editors For Plain Text


    Linux text editors for plain text are segregated into two categories that are
    graphical editors. The two categories are `GUI` and console text editors. The
    benefit of the `GUI` editor is that it is an intuitive user-friendly interface.
    On the other hand, the advantage of console text editor is the suitability for
    long distance network connection which may or may not offer appropriate bandwidth
    or reliability.


    ## Console Based Text Editors


    ### Emacs

    This text editor supports the concept that more is better. It is something that
    tries to support all features as far as possible. In case you want power then
    try `Emacs`. Through this, you can actually get unrestricted open files and sub-windows,
    shell access and immoral way with scripts you can call out the keywords, are defining
    features of `Emacs`.


    There are many variations of `Emacs` available that is suitable for major programming
    languages used for text highlighting of programming keywords as it is done for
    coding. When you have an `Emacs` session open you can write, code, email or also
    play arcade games.


    Along with that, `Emacs` has its own onboard assistance system with excessive
    capabilities that are comprised of the user-defined development of new commands
    that you will never require leaving. Some of the good things about this are that
    it is powerful, customizable and extensible. This allows you to express you own
    creativity.


    ### Jed

    `Jedis` one of the text editors that support menus and other `GUI` features in
    the console based terminal. This text editor mainly focuses on software development.
    One of the best features is that it is rich in Unicode mode.


    ### Pico

    The `Pico` text editor was developed to assist users in speeding their email along
    with the `pine` email system. This text editor has lots of commands available
    which is displayed at the bottom of the text editing area to help.


    ### Nano

    The `Nano` text editor is done over small and amazing design goals for making
    an open source version of `Pico`. There are some additional features such as search,
    replace and smooth scrolling. This editor also lets you use a mouse and other
    printer devices for positioning of the cursor or activate commands over the shortcuts
    bar at the bottom of the screen.


    ### Vim

    `Vim` is one of the console-based plain text editors that supports syntax highlighting
    and has many plug-ins for specialized features and configurations. It is one of
    the standard Linux editors. This has been a part of Linux from the beginning.
    It is possible to duct in and duct out in just a few seconds which rapidly changes
    the text files. More recent `Vim` extensions provide additional functionality
    comprising of new editing commands and mouse support and graphical versions.


    ## Graphical GUI Editors


    ### Gedit

    It is one of the default text editors for Linux `Gnome` desktop. It is the editor
    that has search and replace functionality, undo and redo and work with several
    structural languages. This is the one that supports syntax highlighting, a variety
    of plug-ins, printing, multi-language spell check, tabbed for multiple files,
    etc. An extra feature of this editor is that it comprises of automatically detecting
    and alerting you of changes to an open file through another application. It is
    a highly popular and efficient text editor and the limitations can be avoided
    through available plugins.


    ### NEdit

    It is one of the original Unix `GUI` text editors that are programmed in `Motif`.
    This is mainly a fundamental intuitive and simple to use `GUI` editor.


    ### Gvim

    Thisis the one that offers a `GUI` editor on the basis of the `vim` console editor.
    There are lots of features offered through this `GUI` text editor. However, it
    will still need knowledge regarding `vim` so that you do not run into trouble.


    ### Sublime

    `Sublime` is a commercial `GUI` text editor which features syntax highlighting,
    plain text, cross-platform, `C++` and `Python` language support and plain text.


    ### Tea

    It is the `Qt` based `GUI` text editor that supports cross platform, syntax highlighting,
    plain text, regular expression search and replace, file manager, programming language,
    etc.


    ## Structured Text Editors


    Structured text mainly refers to logical formatting and annotated text for representing
    program function or data schema. In this, there are two common formats available
    and they are `HTML` for text documents and `XML` for data representation.


    ### HTML Text Editors


    ### Amaya

    This is one of the fundamental and simple to use editor. In order to be complete,
    it will require more features.


    ### Kompozer

    This editor is a simple to use `GUI` `HTML` editor. There are a lotof features
    that this editor can offer, and it was renamed from `Nvu`.


    ### Quanta

    It is one of the editors that also offer support to programming languages such
    as `Python`, `SQL`, `Perl`, `PHP`, etc.


    ### Bluefish

    `Bluefish` text editor is one that also supports `XML` markup and also programming
    languages.


    ### Aptana

    `Aptana` is a `GUI` `HTML` editor that offers support for `VSS`, `Ruby`, `PHP`
    and `Javascript` that comprises of debugging. It is a cross platform and `java`
    based editor.


    ### Coffee Cup

    This is a commercial `HTML` editor, and it is developedin validation. It is the
    one that supports `HTML5` and `CSS3`.


    ### XML Editors


    ### Oxygen XML

    It is a commercial cross-platform `GUI` `XML` or `Eclipse` plug-in editor. For
    files of this kind, this has proved to be a capable editor with a clear validation
    warning and error messages.


    ### Eclipse

    This is the cross-platform `Java` IDE that supports `DTD` or `XSD` or `XSLT` or
    `XML`. It is one of the efficient editors. However, it is not good at verification
    of `XSD` and `XML`.


    ### Emacs nXML mode

    This editor allows a schema that is related to `XML` document that is being edited.
    It offers continuous support.


    ### Kate

    Knowing `Kate` is very easy. The learning curve is gentle in comparison to other
    known Linux text editors and comprises of the best features. This comprises of
    a span of text editor needs for basic text writing and integrated development
    environment. It is a `KDE` application that is good for `KDE` and also for `GNOME`
    users.


    Along with that, the Linux users that make use of `Windows` or Mac OSX` will be
    glad to know that this text editor will be able to run under these operating systems.
    With this text editor, `Window` or pane splitting is available, and there is a
    possibility of personalizing the functionality of this text editor for various
    kinds if projects.


    # Chapter 5: Linux Commands


    Linux commands are one of the biggest strengths of Linux based systems. The main
    reason behind this is that it makes it simple for the user to interact with their
    system. Linux commands also save resources of the system that is consumed by `GUIs`.
    For the slower systems, it is always better to be good with the command lines
    than GUI. Linux command lines offer flexibility, speed, and a great experience.
    Here are some of the Linux command lines references for some common operations
    that are tested on both `Fedora` and `Ubuntu`.


    ## LINUX COMMANDS FOR CD


    To save the copy of data cdrom:

    ```

    gzip < /dev/cdrom > cdrom.iso.gz

    ```


    To develop cdrom image for contents of dir:

    ```

    mkisofs -V LABEL -r dir | gzip > cdrom.iso.gz

    ```


    To clear CDRW:

    ```

    wodim dev=/dev/cdrom blank=fast

    ```


    To develop cdrom image at/dir/mnt for reading:

    ```

    mount -o loop cdrom.iso /mnt/dir

    ```


