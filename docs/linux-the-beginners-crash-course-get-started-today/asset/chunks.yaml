    ## Reiser4


    这个文件系统是由 Namesys 开发的，它是 ReiserFS 的继者。该文件系统支持 DARPA。让这个文件系统很强大的另一个点是它的多种功能。


    ### 这个文件系统可以做什么？


    它是一个利用“写时复制”、任何写入以及日志记录的系统。以下是该系统可以执行的一些操作：


    * 更好的小文件支持

    * 更快的目录处理

    * 更好的系统日志

    * 相比 `ReiserFS` 的巨大改进


    除此之外，还有其他功能，但简而言之，它相比 `ReiserFS` 有巨大的改进。


    ### 谁可以使用这个文件系统？


    如果有人正在寻找一种适用于多种用例的文件系统，`Reiser4` 是最佳选择。如果你想要一个支持写时复制、任何写入以及日志记录的机器，这是一个很好的选择。如果你不想使用各种类型的文件系统来完成任务，这是一个很好的选择。这适用于这种情况。


    ## 第 4 章：Linux 文本编辑器


    Linux 发行版由许多文本编辑器应用程序组成。这些应用程序可以用于开发文本文件或编辑系统配置文件。这些编辑器与文字处理程序类似。但通常它们的功能较少，只处理文本文件，并且可能不支持拼写检查检查。


    ### 为什么你应该使用文本编辑器


    Linux 是一个以文件为核心的操作系统，这意味着一切都是文件。所有的基础配置都是通过精心设计的文本文件在正确的位置通过正确的内容完成的。你可以找到许多图形化工具来配置
    Linux，但大多数工具只是在处理文件。


    文本文件需要你遵循特定的语法。漏掉一个简单的字符可能会让你的系统面临风险。对于此类文件使用文字处理器并不是一个好主意，这实际上会损坏你的文件并添加额外的格式信息。


