    # LINUX COMMANDS FOR SECURE SHELL (ssh)


    To run the command on `$HOST` as `$USER`. The default command will be `shell`


    ```bash

    ssh $USER@$HOST command

    ```


    To set up the public key for `$USER@$HOST` for the password-less log in


    ```bash

    ssh-copy-id $USER@$HOST

    ```


    To run the Ghrapical User Interface command on `$HOSTNAME` as `$USER`


    ```bash

    ssh -f -Y $USER@$HOSTNAME xeyes

    ```


    To promote the connections from `$HOST:1434` to `imap:143`


    ```bash

    ssh -R 1434:imap:143 root@$HOST

    ```


    To duplicate with the permissions to `$USER`''s home directory on `$HOST`


    ```bash

    scp -p -r $USER@$HOST: file dir/

    ```


    To promote the connections to `$HOSTNAME:8080` out to `$HOST:80`


    ```bash

    ssh -g -L 8080:localhost:80 root@$HOST

    ```


    Use quicker crypto for local LAN


    ```bash

    scp -c arcfour $USER@$LANHOST: bigfile

    ```


