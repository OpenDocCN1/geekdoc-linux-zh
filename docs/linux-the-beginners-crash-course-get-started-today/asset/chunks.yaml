    Linux 提供了几种主要的备系统。简要了解这些系统对你来说非常重要，因为这能让你根据特性了解在什么情况下可能或可能不想使用特定的文件系统。这并不意味着这些文件系统无法在其他情况下使用。这些实际上是一些建议，每种文件系统在某些领域都会脱颖而出。


    ## Ext4


    如果你之前安装过 Linux，很有可能在安装时看到过 `Ext4`。这背后有一个很好的原因，因为它几乎是所有可用 Linux 发行版的首选文件系统。事实是，很少有人会选择其他文件系统选项，然而
    `Ext4` 是几乎每个 Linux 用户的首选文件系统。


    ### 这个文件系统可以做什么？


    与过去的文件系统（如 `Ext2` 或 `Ext3`）相比，Extended 4 具有了人们预期的所有功能。该文件系统有很多增强。这个文件系统可以做很多事情。然而，这里是该文件系统能为你提供的一些最佳功能：


    * 日志校验和

    * 文件系统日志记录

    * 对 `Ext2` 和 `Ext3` 的向后兼容支持

    * 与之前的版本相比，增强了文件系统检查

    * 提供对大文件的支持

    * 多块文件分配

    * 空闲空间的的持续预分配


    ### 谁可以使用这个文件系统？


    `Ext4` 文件系统最适合那些寻找一个超稳定基础进行开发的人，或者那些寻找“即插即用”之物的人。它是一个不会为你的系统拍摄快照的系统，而且也没有最好的 SSD
    支持。不过，如果你的要求不是太大，那么用它也能运行良好。


    ## XFS


    `XFS` 是由 Silicon Graphics 创建的高端文件系统之一。它是一个专注于性能和速度的系统。涉及到并行输入/输出时，该文件系统的运行效果非常出色。这背后的原因是它专注于性能。它是能够处理海量数据的文件系统。事实是，该文件系统可以处理约
    300+ TB 的数据。


    ### 这个文件系统可以做什么？


    该文件系统是为高性能操作开发的经过测试的数据存储系统之一。该系统可以执行以下操作：


    * 文件系统日志记录

    * 直接 I/O

    * 保证速率 I/O

    * 在线碎片整理

    * 可更改的块大小

    * 快照

    * RAID 阵列的链分配

    * 在线调整大小


    ### 谁可以使用这个文件系统？


    对于那些寻找坚如磐石的文件系统的人来说，这是最好的。该系统自 1993 年以来一直存在，随着时间的推移，它变得完善得多。如果你有一个家用服务器并担心存储，那么考虑
    `XFS` 是一个不错的选择。这不仅适用于服务器。如果你是一个更高级的用户，这也可以是一个很好的选择。它没有稳定性问题。


    ## BtrFS


    这个用于 Linux 的文件系统是由 Oracle 创建的。它是较新的文件系统之一。Linux 公司认为它是不平衡的，因为它正处于开发阶段。该文件系统依赖于“写时复制”（copy
    on write）概念。这一概念意味着在数据被写入之前，系统拥有一份数据的副本。在数据被写入时，会创建一个副本。


    ### 这个文件系统可以做什么？


    通过 `BtrFS` 系统可以完成很多事情。以下是该系统可以做的一些事情：


    * 支持只读快照

    * 子卷

    * 文件克隆

    * 离线文件系统检查

    * 透明压缩

    * 在线碎片整理

    * 支持 `RAID 0`、`RAID1`、`RAID 1`、`RAID 5`、`RAID 6`


    ### 谁可以使用这个文件系统？


    对于那些寻找坚如磐石的文件系统的人来说，这是最好的。该系统自 1993 年以来一直存在，随着时间的推移，它变得完善得多。如果你有一个家用服务器并担心存储，那么考虑
    `XFS` 是一个不错的选择。这不仅适用于服务器。如果你是一个更高级的用户，这也可以是一个很好的选择。它没有稳定性问题。


