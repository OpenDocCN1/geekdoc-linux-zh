    ## Chapter 2: Choosing A Linux Distribution System


    ### Which distribution should you choose?


    Finding the distribution that suits your needs will depend on the answers to the
    following questions:


    *   How experienced are you in using computers?

    *   What do you like – traditional or a modern desktop interface?

    *   Desktop or a server?


    In case you possess average skills in using computers, then the latest and user-friendly
    distributions like Deepin, Ubuntu, and Linux Mint is the best choice. Fedora or
    Debian is the best option for all of those who possess above average computer
    skills. The distribution `Gentoo` is for all of the people who have mastered computers
    and are knowledgable about the system administration.


    Are you looking out for a server-only distribution? If that is the case, then
    you will have to decide whether you want only the desktop interface or would like
    to do it with the help of the command line. GUI interfaces are not installed on
    the Ubuntu server. This means that you need to have a strong understanding of
    Linux operating system. Using a command of `sudo apt-get install ubuntu-desktop`,
    you can install the GUI on the Ubuntu Server. Would you prefer a distribution
    that would offer you everything you require for the server? `CentOS` is the perfect
    choice for such a case. Or, do you prefer a desktop distribution and then add
