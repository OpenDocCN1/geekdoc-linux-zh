    这本书将作为你学习 Linux 的第一步提供良好的帮助。这是一个非常庞的话的话，当你开始使用它时，会有更多的想法、问题和挑战。如果你遇到复杂的问题，有大量的视频和在线参考资料供你使用。我强烈建议读者将此书存放在电脑上，并将其作为未来的参考。


