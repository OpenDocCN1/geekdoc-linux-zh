  raw: 'In order to check if your printer is supported or not, you can make use of
    Open Printing Database and search for your printer. With this, you can get an
    idea whether the printer is known to work entirely or partially.


    You can do this for your current printer. However, it will only give you an idea
    about how well the printer will work on Linux. This database can prove to be useful
    for you when you are searching for the new printer. On the basis of that, you
    can check out the models that work on Linux.


    Once you have the printer that the database says will work with Linux, you have
    three possible options available for getting it started. The three options available
    are plug and play, install a package from your distribution repositories, and
    get the driver from the manufacturer’s website.


    At times, the printer will work as soon as you plug it in. This is possible because
    the driver is already in the Linux Kernel or it can be due to the fact that the
    package that you would require is installed by default in your distribution. In
    case it does not work, then you will be required to install the package from your
    distribution repositories.


    At the time the printer is added through the printer configuration window, it
    should identify that the printer is attached and will automatically check out
    the package that comprises the needed driver.


