    ## How do you go about installing Linux?


    People think that installing the Linux operating system is a very tough task to
    do. In fact, it is known to have the simplest installations when compared to the
    other operating systems. Most of the Linux operating system versions offer you
    with the Live Distribution. This means that the installation can be done with
    the help of a CD or USB without making any huge changes in your hardware. Isn’t
    this just amazing? These distribution options provide you with the full functionality
    without having to install it forever.


    For example, following are the steps for Ubuntu Linux that will guide you through
    the installation process:


    - **Preparation**

    The first thing to ensure is that your machine meets the requirements. It might
    ask you whether you want to install third party software.

    - **Wireless setup**

    When you install the system on the laptop, you will have to connect to a network
    to ensure that download of third party software is successful.

    - **Hard drive allocation**

    This is the step where you need to choose the way you want the Linux operating
    system to be installed on your desktop or laptop. Are you going to go with dual
    booting? Then use the whole hard drive, upgrade the present installation.


    Choose the kind of installation you would prefer and then click on install now.


    - **Location**: choose location from map

    - **Keyboard setup**: choose the keyboard setup

    - **User setup**: type in your username and password to finish installation


    After these steps are followed, reboot and then it is ready to go! Installing
    Linux is known to be the simplest, as well as the safest, software when compared
    to other operating systems.


    ## What are the reasons to use the Linux operating system?


    Why would you want to learn a computing program that is completely different when
    the laptop, desktop, and other servers are shipped with the Operating System that
    works perfectly? This is the question that comes up in most of the users’ minds.
    Before you get an answer to this, there is one more question, is the operating
    system you are working on really working as perfectly as you wanted? Are you frequently
    battling with slowdowns, viruses, expensive repairs and malware? If yes, then
    it is the right time to free yourself from the constant frustration, as well as
    fear of losing your important data. Linux is the best solution for you and you
    need to start using this operating system at your earliest convenience.


    Linux is known to be an operating system that is most reliable. You get a reliable
    operating system by paying nothing, seriously. You can install Linux on as many
    laptops or desktops you want for free.


    When Linux is compared to the other servers such as Windows Server, the latter
    costs around $1200 and does not include the basics like Client Access License
    and also other licenses including mail server, web server, etc. the Linux Server
    is free and you do not have to pay a cent to use its reliable programs. It is
    free and also simple to install. When you have Linux as the operating system,
    you do not have to do babysitting every day. There is one service that needs restarting,
    upgrading,etc. and the other parts are not affected.


    This operating system is distributed under the open source license and mentioned
    below is a list of ideas that it follows:

    - The liberty to run any program.

    - The liberty to make changes to the programs according to your preference.

    - You can even redistribute copies to help your loved ones.

    - Lastly, you can distribute the copies of the modified version that you created
    to your loved ones.


    Thus, it is a community that is created by you, for you. This is known to be the
    simplest and most user-friendly operating system. It is all about freedom. Complete
    Linux installation can be done on your desktop or laptop as it does not involve
    a lot of complexities.


    ### Development


    The Linux operating system includes a number of development languages. Most of
    the distribution codes are created in `C` or `C++` Languages. The rest of the
    codes are created with `Perl`, `Java` as well as `Lisp`. One of the most important
    parts of the Linux operating system, The `Kernel` has 95% `C` presence. The remaining
    part is used with other languages that make this part more diverse when compared
    to the other systems.


    There are a few developers that at present use text-based tools to develop the
    code. Linux is known to be the most versatile operating system and a strong integrated
    development environment. It is a platform that can help you generate money while
    being free of cost. Users can be certain that the Linux operating system can work
    best for them.


    ## Chapter 3: File Systems For Linux


    File systems are one of the layers underneath your operating system. This is something
    that is usually not considered unless one is faced with the plethora of alternatives
    in Linux. It is essential to know how to make a well-informed decision on which
    file system needs to be used.


    The landscape of the file systems support of Linux is completely different from
    that of OS X and Windows. As far as Windows and OS X are concerned, there is software
    that will add support for non-standard file systems. However, both operating systems
    can be installed on their native file system, and third party support is then
    added.


    On the other hand, Linux has an enormous range of supported file systems developed
    into the kernel. But the main question is how to know which file system to select
    at the time of installation. There are some of the very popular choices available.
    However, the choice completely depends on the requirements.


    ### What Is Journaling?


    Prior to going ahead with file system options, it is essential to first have a
    quick check on journaling. One of the significant things about journaling is that
    all of the modern file system makes use of journaling in one or another form,
    and on any desktop or laptop that you are setting up with Linux. This is where
    it is essential to use the journaling file system.


    Only when writing to disk, journaling is utilized. With this, the issue of disk
    corruption can be fixed at the time things are written to the hard drive and after
    that if the computer crashes or when there is a loss of power. The operating system,
    without the journal, will not be able to know if the file was completely written
    to the disk.


    With the use of journaling, the file will first be written to the journal, enter
    it and then the journal will write a file to the disk when it is ready. After
    it has been successfully written to the disk, it will be removed from the journal,
    then punch out and the operation will be finished.


    In case there is a loss of power at the time of being written to the disk, the
    file system can check out the journal for all operations which have not been finished
    and remember where it left off.


    The major downside to journaling is that it will compromise some performance in
    substitute for stability. In order to write a file, there is lots of overhead.
    However, the file system will go around this overhead. This is possible through
    not writing the complete file to a journal. Rather than this, the file metadata,
    inode or disk location is recorded prior to actually being written to disk.

