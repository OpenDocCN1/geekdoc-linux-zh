    着色和高亮是在显示过程中完成的。这些更改是针对应该是纯文本的文本文件的。这是文字处理程序中无法获得的最优之一，而这是文本编辑所必需的。


    # Linux 文本编辑器


    在处理简单文本、结构化文本和编程语言方面，Linux 有许多文本编辑器可用。以下是列出的一些最流行的编辑器，所有这些编辑器都适用于多种操作系统。


    ## 用于纯文本的 Linux 文本编辑器


    Linux 纯文本文本编辑器分为两类：图形化编辑器。这两类分别是 `GUI` 编辑器和控制台文本编辑器。`GUI` 编辑器的优点是具有直观且友好的界面。另一方面，控制台文本编辑器的优势是适用于远程网络连接，这种连接可能提供相应的带宽或可靠性。


    ## 基于控制台的文本编辑器


    ### Emacs

    这款文本编辑器支持“多越多越好”的概念。它尝试尽可能地支持所有功能。如果你需要强大，请尝试 `Emacs`。通过它，你实际上可以获得不受限制的打开文件和子窗口、shell
    访问以及通过脚本调用关键字的奇妙方式，这些都是 `Emacs` 的定义特性。


    `Emacs` 有许多变体，适用于主要的编程语言，并用于编程关键字的文本高亮，就像编写代码时那样。当你打开一个 `Emacs` 会话时，你可以编写、编码、发送电子邮件，还可以玩街机游戏。


    此外，`Emacs` 拥有其内置的功能强大的辅助系统，由用户定义的新命令组成，你可能永远不需要离开。关于它的其中一些好的点是，它是强大、可定制且可扩展的。这允许你表达自己的创造力。


    ### Jed

    `Jed` 是基于控制台的终端中支持菜单和其他 `GUI` 特性的文本编辑器之一。这款文本编辑器主要关注软件开发。它最出特性之一是它具有丰富的 Unicode
    模式。


    ### Pico

    `Pico` 文本编辑器开发是为了帮助用户配合 `pine` 邮件系统提高电子邮件速度。这款文本编辑器有很多可用命令，显示在文本编辑区域的底部以帮助。


    ### Nano

    `Nano` 文本编辑器基于小巧而精妙的设计目标，旨在制作 `Pico` 的开源版本。它具有一些额外功能，如搜索、替换和平滑滚动。该编辑器还允许你使用鼠标和其他打印设备来确定光标位置，或通过屏幕底部的快捷栏激活命令。


    ### Vim

    `Vim` 是基于控制台的纯文本编辑器之一，支持语法高亮，并有许多用于特殊功能和配置的插件。它是 Linux 标准编辑器之一。它从一开始就是 Linux 的一部分。可以在几秒钟内进行输入和输出，快速更改文本文件。更最近的
    `Vim` 扩展提供了额外的功能，包括新的编辑命令、鼠标支持和图形版本。


    ## 图形 GUI 编辑器


    ### Gedit

    它是 Linux `Gnome` 桌面面的默认文本编辑器之一。它是具有搜索和替换功能、撤销和重做，并与多种结构化语言工作的编辑器。它支持语法高亮、各种插件、打印、多语言拼写检查、多文件标签等。该编辑器的额外功能是它能够自动检测并提醒你通过另一个应用程序对打开文件的更改。这是一个非常流行且高效的文本编辑器，可以通过可用插件避免局限性。


    ### NEdit

    它是原始 Unix `GUI` 文本编辑器之一，用 `Motif` 编写。这主要是一个基础、直观且易用的 `GUI` 编辑器。


    ### Gvim

    这是基于 `vim` 控制台编辑器提供 `GUI` 编辑器的版本。这个 `GUI` 文本编辑器提供了许多功能。然而，你仍然需要关于 `vim` 的知识以免遇到麻烦。


    ### Sublime

    `Sublime` 是一个商业 `GUI` 文本编辑器，具有语法高亮、纯文本、跨平台、`C++` 和 `Python` 语言支持。


    ### Tea

    它是基于 `Qt` 的 `GUI` 文本编辑器，支持跨平台、语法高亮、纯文本、正则表达式搜索和替换、文件管理器、编程语言等。


    ## 结构化文本编辑器


    结构化文本主要指用于表示程序函数或数据模式的逻辑格式化和注释文本。在这里，有两种常用格式，分别是用于文本文档的 `HTML` 和用于数据表示的 `XML`。


    ### HTML 文本编辑器


    ### Amaya

    这是一个基础且易用的编辑器之一。为了完善，它需要更多功能。


    ### Kompozer

    这款编辑器是一个易用的 `GUI` `HTML` 编辑器。该编辑器提供很多功能，它是从 `Nvu` 重命名而来的。


    ### Quanta

    它是同样支持 `Python`、`SQL`、`Perl`、`PHP` 等编程语言的编辑器之一。


    ### Bluefish

    `Bluefish` 文本编辑器也是支持 `XML` 标记和编程语言的编辑器。


    ### Aptana

    `Aptana` 是一个 `GUI` `HTML` 编辑器，提供对 `VSS`、`Ruby`、`PHP` 和 `Javascript` 的支持，包括调试。它是一个跨平台基于
    `java` 的编辑器。


    ### Coffee Cup

    这是一个商业 `HTML` 编辑器，用于验证。它是支持 `HTML5` 和 `CSS3` 的编辑器。


    ### XML 编辑器


    ### Oxygen XML

    这是一个商业跨平台 `GUI` `XML` 插件。它提供了清晰的验证警告和错误信息。


    ### Eclipse

    这是一个跨平台 `Java` IDE，支持 `DTD` 或 `XSD` 或 `XSLT` 或 `XML`。它是有效的编辑器。


    ### Emacs nXML 模式

    该编辑器为正在编辑的 `XML` 文档提供持续支持。


    ### Kate

    学习 `Kate` 非常简单。与其他熟悉的文本编辑器相比，它的学习曲线非常平缓。它包含了基础文本写作的需求。它是 `KDE` 应用程序，也适用于 `GNOME`
    用户。


