    发行版（The Distribution）被认为是操作系统的最高层。它是包含了上述所有层级的程序。由于内核是操作系统中最先安装的组件，因此发行版是最后安装。没有它，系统就是不完整的。发行版层的开发者决定了哪些系统工具、应用程序、内核和环境应该被包含在供用户使用。


    安装发行版并不复杂。可以通过包含特定安装软件和配置的 CD 光盘来完成。这一层通常由商业公司或专业人士维护。为了方便用户起见，最好的发行版会为他们提供一个非常出色的应用程序管理系统。该系统允许用户只需点击几次鼠标，即可找到并安装他们所需的应用程序。这一层让搜索变得简单，应用程序的安装只需几次点击即可完成。Linux
    有 350 种发行版供用户选择。以下列出了流行的 Linux 发行版：


    **Deepin（深度界面）

    *   Fedora

    *   Linux Mint

    *   Ubuntu Linux

    *   Debian

    *   Arch Linux

    *   OpenSUSE


    每一个发行版在显示器上都有不同的感受和外观。其中一些发行版具有现代的用户界面，如 Deepin、Ubuntu 等。而另一些则具有传统的环境，如 openSUSE。


    当你拥有了 Linux，你就拥有了所有的选择。但随着选择而来的还有困惑。既然 Linux 桌面有许多可用选项，哪一个最适合你呢？哪个桌面最符合用户习惯？在选择你的桌面目标时，并没有强制性的规则或测试需要你遵循。这完全取决于你的喜好和需求。当你详细查看桌面功能时，你会注意到桌面与用户之间确实存在某种联系。下面列出了几个
    Linux 桌面的细节：


    *   Ubuntu


    你想要一个连接到本地数据以及数百个远程源的现代界面吗？希望与社交媒体保持连接、想要快速访问购物网站等的用户会发现 Ubuntu 是最佳选择。那些希望在键盘上花费尽可能长时间的用户将更倾向于使用
    `Ubuntu Utility` 桌面。这种形式在与用户交互方面无疑非常高效。对于那些想要一切都触手可及，而不太在乎桌面感受和外观的用户来说，Ubuntu
    是最佳选择。


    *   GNOME 3


    对于想要在保持外观和感受新鲜的同时拥有现代桌面的用户可以选择 `GNOME 3`。它对扩展的桌面采用了极简主义的方法。在桌面上，你找不到许多项目，这带给你一种极交互的感觉。但当你打开启动器（dash）时，你会发现大量的交互项目。Ubuntu
    锁定了一些界面，而此选项允许进行调整。如果你正在寻找像 Ubuntu 那样具有现代感，但又有更多调整空间，那么 `GNOME 3` 就是为你准备的。


    *   KDE


    KDE 是一个为 Linux 操作系统提供的完整且开发的桌面环境。该环境为了功能已经进行过一些重大更改。因此，无论该环境做什么，它都做得非常出色。这个环境除了开始菜单、系统托盘和面板外没有别的。由于这个环境具有现代感，它仍然保留了一些
    Windows 时代的影子，准确地说是 XP/7。这个选项对于那些不喜欢变化的人非常完美。想要 Windows 设计的用户会喜欢这个环境，因为它与 Windows
    相似，但具有更现代的外观和简单的过渡。


    Enlightenment（启示）


    与其他相比，这是一个完全不同的环境。当你启动这个环境时，你会注意到变化。它非常不同，因为它没有启动面板和菜单，而是桌面菜单和独特的元素。然而，这个 Linux
    系统的环境无疑不是为所有人设计的。那些想要非常独特且开箱即用的简单环境的用户可以选择 Enlightenment。显然，所有的独特性都是带有代价的。这个桌面环境希望你在安装之前先了解它，这样你掌握它就不会太困难。喜欢折腾独特事物的人会喜欢这个
    Linux 桌面环境。Enlightenment 带有许多主题。这些主题不仅改变了桌面的颜色，还改变了一些细节。对于热爱变化并希望经常更改桌面屏幕的用户来说，它是完美的。


    *   Deepin


    Linux 操作系统环境的最新成员是 Deepin。在进入后不久，这种景观就成功吸引了很多人。它为桌面带来了惊叹的现代视觉效果和感受。这种景观的主要特点在于它将所有优秀的桌面整合在了一起。它有一个非常有吸引力且独特的控制面板。用户会喜欢探索这种新景观。他们会发现通过现代方式实现的惊人功能而感到高兴。寻找独特且简单景观的人可以使用它获得最佳体验。


    ## 第 2 章：选择 Linux 发行版系统


    ### 你应该选择哪种发行版？


    寻找适合你的发行版取决于对以下问题的回答：


    *   你使用电脑的经验如何？

    *   你喜欢什么——传统的还是现代的桌面界面？

    *   桌面还是服务器？


    如果你具备中等计算机使用技能，那么像 Deepin、Ubuntu 和 Linux Mint 这样最新且用户友发行版是最佳选择。对于所有拥有平均以上计算机技能的人来说，Fedora
    或 Debian 是最佳选择。`Gentoo` 发行版为那些精通计算机并了解系统管理的人准备的。


    你正在寻找仅限服务器的发行版吗？如果是那样，你必须决定是只需要桌面界面，还是想通过命令行来操作。Ubuntu 服务器没有安装图形界面（GUI）。这意味着你需要对
    Linux 系统有深入的。通过命令 `sudo apt-get install ubuntu-desktop`，你可以在 Ubuntu 上安装 GUI。你倾向于一个提供你所需服务器内容的发行版吗？`CentOS`
    是这种情况的完美选择。或者，你倾向于桌面发行版，然后根据喜好和需求添加内容？`Ubuntu Linux` 或 `Debian` 是正确的选择。


    以下是优秀的发行版为新用户提供的功能列表：


    #### 用户友好


    这是一个可以争论很久的点。因此，做法应该是选择一个发行版并开始使用，不需要过多的解释。如果需要提供详细说明，该发行版无疑不是用户友好的。例如，任何人不需要指导就可以开始使用
    Windows 7 桌面。这是每个 Linux 桌面应该考虑的。


    #### 应用程序商店


    人们现在越来越依赖手机版本，他们也需要习惯家庭电脑上的应用程序商店。


    #### 应用程序


    基础需求应该是预装的，用户不需要单独安装。现在的需求是什么，因为它们经常变化？下面列出了应该预装的应用程序：


    *   电子邮件

    *   音乐播放器

    *   办公套件

    *   浏览器


    要安装的应用程序列表取决于个人的需求。


