    There are a few of the major file systems available for Linux. It is essential
    for you to know briefly about these systems as it gives an idea about when you
    might and might not want to use the specific file system on the basis of the features.
    This does not imply that the file systems cannot be utilized in other cases. These
    are actually some suggestions where every file system will stand out.


    ## Ext4


    In case you have installed Linux prior, there are chances that you might have
    seen the `Ext4` while installation. There is one good reason behind this and that
    is because it is the file system of choice for almost all Linux distribution available.
    The fact is that there are few who choose other options for file systems, however,
    the `Ext4` is the file system of choice for almost every user of Linux.


    ### What can this file system do?


    Extended 4 has all that is expected in comparison to the past file systems interactions
    such as `Ext2` or `Ext3`. This file system has a lot of enhancements. There are
    a lot of things that this file system can do. However, here are some of the best
    things that this file system can do for you:


    * Journal checksums

    * File system journaling

    * Backward compatibility support for `Ext2` and `Ext3`

    * Enhanced file system checking in comparison to previous versions

    * Offers support for large files

    * Multi-block file allocation

    * Constant pre-allocation of free space


    ### Who can make use of this file system?


    The `Ext4` file system is best for the people that are in search of a super-stable
    base to develop upon, or for those searching for something that just works. It
    is the system that would not take a snapshot of your system, and it also does
    not have the best SSD support. However, in case your requirements are not too
    much, then you will just be to do well with it.


    ## XFS


    `XFS` is one of the high-end file systems created by Silicon Graphics. It is the
    system that specializes in performance and speed. When parallel input and output
    is concerned, this file system can run amazingly well. The reason behind this
    is that it concentrates on performance. It is the file system that can tackle
    an excessive amount of data. The fact is, this file system can handle around 300+
    terabytes of data.


    ### What can this file system do?


    This file system is one of the well-tested data storage systems developed for
    great performance operation. This system can do following things:


    * File system journaling

    * Direct I/O

    * Guaranteed rate I/O

    * Online defragmentation

    * Changeable block sizes

    * Snapshots

    * Lined allocation of RAID arrays

    * Online resizing


    ### Who can make use of this file system?


    Those that are searching for a rock solid file system, this is the best one. This
    system has been around since 1993 and overtime, it has become much better. In
    case you have a home server and you are concerned about the storage, then considering
    `XFS` can be a good option. This is not only for servers. In the case that you
    are a more advanced user, then this can also be a good option. This does not have
    a stability problem.


    ## BtrFS


    This file system for Linux is created through Oracle. This is one of the newer
    file systems. The Linux Company considers it as unbalanced, as it is in the development
    stage. This file system is dependent on the principle of ‘copy on write’ concept.
    This concept implies that the system has one single copy of data before the data
    has been written. At the time data has been written, there will be a copy made.


    ### What can this file system do?


    There are a lot of things can be done through `BtrFS` system. Here are some of
    the things this system can do:


    * Supports read-only snapshots

    * Subvolumes

    * File cloning

    * Offline file system check

    * Transparent compression

    * Online defragmentation

    * Support for `RAID 0`, `RAID1`, `RAID 1`, `RAID 5`, `RAID 6` and `RAID 10`


    ### Who can make use of this file system?


    The makers of `BtrFS` say that this file system is the next-generation replacement
    for other file systems available, but it is still a work in progress. There are
    a lot of great features for basic and advanced users. It is great for the people
    who want more from the file system and want to have their hands on a ‘copy on
    write’ way.


    ## Reiser4


    This is the file system that is a successor to `ReiserF5`, and it is developed
    by Namesys. The development of `Reiser4` was supported through the Linspire project
    and DARPA. Another thing that makes this file system great is its multitude of
    transaction models. There is not only one way through which data can be written,
    rather there are many.


    ### What can this file system do?


    It is the system that has an innovative ability to utilize various transaction
    models. This is the system that makes use of ‘copy-on write’ models, write anywhere,
    hybrid transaction model and journaling. Following are some of the things that
    this system can do:


    * Better support for smaller files

    * Faster handling of directories

    * Better system journaling through wandering logs

    * Huge improvement over `ReiserF5`


    Apart from this, there are other features also, but in short it can be said that
    it is a huge enhancement over `ReiserFS` with a lot of other features.


    ### Who can use this file system?


    If a person is searching to stretch one file system throughout the multiple use-cases,
    then `Reiser4` is the best option. This can be a good option if you want to have
    one machine with copy-on-write, another with write-anywhere and another with the
    hybrid transaction. It is a good choice if you do not want to utilize various
    kinds of file systems for completing the task. This is one of the best for this
    kind of cases. There are many file systems available for Linux. All of these serve
    a distinctive purpose for different users searching to solve issues.


    ## Chapter 4: Linux Text Editors


    Linux distributions are comprised of a number of applications, referred to as
    text editors. They can be used to develop text files or edit system configuration
    files. These editors are similar to word processing programs. However, normally
    it has fewer features, works only with text files and may or not support checking
    of spelling and formatting.


    ### Why You Should Use Text Editors


    Linux is a highly file-centric operating system which means that everything is
    a file. All fundamental configurations are done through carefully designed text
    files in the correct place with the correct content. You can find many graphical
    tools for configuring Linux However, the majority of these just twist files for
    you.


    The text files have a specific syntax that you need to follow. A simple character
    that is omitted can expose your system to risk. Using a word processor for this
    is not a good idea. This can actually corrupt your files with additional formatting
    information. File configuration does not require italic or bold fonts it just
    requires correct information.


    The same thing applies to the source code. Compilers are strict regarding syntax.
    Few of them also consider where the particular command is. Word processors will
    mess up the text position in the lines of code it is essential for you to have
    a clear understanding what is in the source code or configuration file, to know
    whether the system will understand exactly what you are writing.


    If you are considering coding, then you will want to use an Integrated Development
    Environment. With this, it can help you write code more efficiently because it
    can predict what you would like to type, suggest changes or also show your mistakes.
    This can color specific keywords and automatically place things in the correct
    place.

