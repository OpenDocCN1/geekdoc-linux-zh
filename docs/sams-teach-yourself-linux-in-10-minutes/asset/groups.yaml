    ## 第 8 课

    文本编辑


    在本节中，你将学习在 Linux 环境中编辑文件的基础。


    许多 Linux 程序使用文本文件作为输入，创建文本文件作为输出，或者是在文本文件中设置的配置命令和变量。为了更改这些文件的内容，你需要使用文本编辑器。


    事实上，大多数 Linux 软件并不知道文本文件与任何其他文件的区别。从操作系统的角度来看，文件就是文件。如果用户选择将某些文件视为包含文本，而另一些视为包含程序，那是用户自己的事情。这种对文件内容缺乏关注所产生的一个有趣的结果是：操作系统对于乐意让你使用文本编辑器编辑你的电子表格程序内容，就像它乐意让你尝试运行你的电子邮件一样感到乐意。当然，如果你真的对你的电子邮件设置了执行权限并尝试运行它，它几乎肯定会立即发生段错误（崩溃），但
    Linux 会尝试的。


    > 优势：如果你是一个程序员，你可能会发现这种缺乏区分是非常有用的。有时，你可能会发现一个需要细微更改的程序，例如纠正拼写错误或更改措。在这种情况下，有时将可执行文件加载到文本编辑器中直接在二进制文件中进行修正是最方便的。这并不是给胆小者的技巧，但有时，它是你需要的快速修复……而有时，它是你没有源码的软件的唯一修复方法。


    ![](img/a0e6136ea1c86032b26127d28a7bd962_89_0.png)


    如果你花很多时间与长期 Linux 用户讨论 Linux 编辑器，你会发现两种最常用的编辑器——vi 和 emacs 的用户之间存在着如战争般激烈的分歧。虽然这些编辑器在功能上实际上是相当互补的，并且都是你工具箱中非常有用的工具，但你最终会遇到许多坚持认为其中一个或另一个完全没用的用户。如果你听从他们的，你将剥夺了自己为某些任务寻求更好解决方案的机会。


    大多数 Linux 编辑器都拥有巨大的力量。例如，emacs 不仅包含它内置的编程语言，还可以为受困于纯文本终端的用户作为一个完整的窗口系统来运行。然而，本快速指南没有足够的空间来涵盖基础以上的内容。在掌握了这里介绍的简单任务后，感兴趣的读者应该去图书馆或书店，从介绍每种最流行的
    Linux 编辑器的几书中进行选择。


    ## 快速且粗暴的编辑：vi


    vi 是 Linux 中最通用的编辑器。一些用户将其读作 ve-eye；另一些人读作 vye。（似乎没有共识，但那些称它为 vye 的人仍然错误的！）vi
    不是一个容易的编辑器，也不是一个友好的编辑器。然而，它是一个启动快速、内存占用极小的编辑器，你会在每台 Linux 机器上找到它。


    由于它的无处不在，了解如何使用 vi


    1. 确定你想编辑的文件。

    2. 输入命令 `vi <filename>`。如果你愿意，也可以不带文件名启动 vi。


    启动 vi 后，它以两种模式运行：命令模式（Command mode）和插入模式（Insert mode）。


    在命令模式下，你可以控制删除和保存等操作。在插入模式下，你可以插入字符。这种区别起可能会让你困惑，但你会发现足够让它实用的东西。


    ### 表 8.1 常用 vi 命令


    | 模式 | 键(s) | 操作 |

    | :--- | :--- | :--- |

    | Command | l | 向右移动 |

    | Command | h | 向左移动 |

    | Command | j | 移动到下一行 |

    | Command | k | 移动到上一行 |

    | Command | x | 删除一个字符 |

    | Command | dd | 删除一整行 |

    | Command | a | 在行尾追加 |

    | Command | i | 进入插入模式 |

    | Command | :w | 保存文件 |


    ### 表 8.2 常用 vi 动作


    | 模式 | 键(s) | 操作 |

    | :--- | :--- | :--- |

    | Command | :q | 退出 |

    | Command | :q! | 不保存退出 |

    | Insert | Esc | 回到命令模式 |


    如果你需要使用 vi，你应该尝试以下操作：


    ```bash

    > vi myfile

    这是我的新文件

    这是我的文件的第二行

    这是一个测试

    这是我的文件的第四行<esc>dd

    这是我的文件的第三行<esc>A

    这是一个文件<esc>:wq!

    ```


    你的机器应该响应


    ```bash

    > cat myfile

    这是我的新文件

    这是我的文件的第二行

    ```


