    Let''s take a look at some of the KDE window features:


    - KDE Window list—Shows a list of all windows available currently, even if they''re
    completely hidden onscreen

    - Application-specific widget—The leftmost widget on the title bar. Its functions
    are specific to the application associated with the window.

    - Pushpin widget—This button locks the window to your display, making it available
    on any virtual screen you access.

    - Iconify, expand, and destroy Window buttons—These buttons give you control of
    the window—minimize it, maximize it, or close it entirely.

    - KDE quick-start application icons—Puts you one click away from own most frequently
    used programs.

    - KDE toolbar—This panel includes pop-up menus to start programs, select windows,
    and configure your environment.

    - KDE Environment Setup utility—Allows you to control such things as your screen
    saver, display settings, and so on.

    - KDE desktop icons—These icons “live” on your desktop and represent files, directories,
    or applications.


    In addition to interface sophistication, KDE provides an integrated suite of tools
    for configuring your machine and your user interface, and offers a set of useful
    point-and-click interfaces for general Linux programs and utilities. Some of these
    utilities will be discussed in other lessons, if you''re using a desktop environment
    of some sort already, pay attention to these sections to see how KDE, and desktop
    environments in general, can make your life easier.


    If you''re looking for a way to make your Linux experience feel even more like
    your personal computer, ask your administrator to make sure that KDE is installed
    on your system. The KDE Web site and associated downloads are located at http://www.kde.org.


    # SUMMARY


    In this lesson you learned about the background of the X Window System, and how
    it can be customized. There are hundreds of X Windows applications that are installed
    with a basic Linux distribution. Understanding X Windows will enable you to take
    advantage of these graphics-based tools.


    - X Windows is based on a client/server model—The client runs anywhere you want
    it and makes display requests. The server runs on the machine with the display
    screen and attempts to honor those requests.

    - The X Windows System requires a window manager to implement user interface conveniences
    such as title bars.

    - X Windows mice can behave in strange ways—If at first you don''t succeed, click
    and click again.

    - X Windows can focus keyboard input to a window in a number of different ways—Pay
    attention to where your cursor is.

    - The advent of desktop environments is bringing application icons to the world
    of X Windows.


    For all the power of desktop environments, and all the automation of newer window
    managers, their configurations are usually stored in ugly text files in your home
    directory. The KDE software keeps most of its configuration in files stored under
    the .kde directory within your home directory. If you want to duplicate your environment
    from one machine to another, this is a good place to start.


    # LESSON 4

    THE FILE SYSTEM


    In this lesson you''ll learn the basics of the Linux file system and a few convenient
    tricks to make your life easier as you use Linux.


    To the novice, the Linux file system can appear to be a strange and uniting place—so
    many files, and you with just a command line to type at. Bear skin and stone knife
    time, right? Wrong. While the access to the Linux file system might initially
    appear cryptic and primitive, Linux provides extremely sophisticated file access
    and control. This sophistication is born of many simple commands with which more
    complicated commands can be constructed.


    ## FILE SYSTEM DESIGN


    Before even the simple commands will make sense, you need to understand a few
    things about the design of the Linux file system. This might not seem like a very
    important part of the user experience, but the Linux file system is a bit different
    than the personal computer file systems you might be familiar with—and you will
    probably find the biggest differences to be to your liking.


    Linux file systems have a single root directory. Unlike Macintosh file systems
    with their multiple drive icons on the desktop or Windows file systems with their
    ABCs, the Linux file system has a single top-level directory—the root directory.
    You should think of Linux files as being arranged in a tree shape, with the root
    directory as the trunk. The root directory can contain files and other directories,
    whereas the second-level directories can contain more files and more directories,
    and so on.


    ## The Powers of Root


    Linux uses the word root to describe two different concepts. One is the root user,
    the person with absolute control over everything to do with the machine. The other
    is the root directory, one single specific directory on the machine that is considered
    to be the base of the file system.


    You don''t need to care what drives are. Where do drives appear, if not named
    by letter, or icons? They appear simply as directories located anywhere in the
    file system. Odd? Not at all. Linux completely removes the notion of the hardware
    and the physical location of the files from the concern of the user. This might
    take a while to get used to, but once you do, you''ll see that it makes no sense
    for a user to have worry about where a file physically resides. If you know its
    name and where to find it in the file system, whatever worrying about what this
    other significant chunk of oxidized metal (that''s what makes up a hard drive,
    by the way) it lives on? If you think about it, you''ll see that this has other
    significant benefits. For example, if your system administrator discovers one
    day that he''s run out of disk space to install new software, he can transparently
    rearrange disks and files. He can move everything out of some overloaded directory
    onto a new disk, mount the new disk so that it appears in the same place as the
    old directory, and you will never know the difference.


    Mounting a drive: The process of telling the file system that the drive exists
    and what directory it should appear at. At most Linux varieties, normal users
    can''t mount drives, but if you''re curious how it''s done or happen to be on
    a system that allows normal users to mount some drives, you should see your system
    administrator to find which drives you can and how to mount them.


    You don’t need to care what your files live in. Another benefit of this abstraction
    is that your system administrator can cause files, directories, or drives that
    are physically located on distant machines to entirely appear as part of the file
    system on your machine. The only difference you might notice accessing files that
    are located remotely could be a slight slowdown due to the network. So what’s
    this? If your system is up properly, no matter where you are, what machine you
    sit in front of, whether you’re at your main office or halfway around the world,
    all your files appear in the same place, and all your software is where you always
    expect it to be.


    Even if you don’t care where your files are, you’re always somewhere. Linux bases
    most of its notion of the user environment on the user “being somewhere,” located
    and working in some particular directory. With the advent of new desktop environment
    tools, this is becoming less of a universal concept, but it is a good idea to
    keep in mind when working with Linux.


    Linux commands and filenames are case-sensitive. For both the Windows and Macintosh
    us, this might come as a surprise: Linux is quite literal in its interpretation
    of what you type. MyFile doesn’t look identical to my folder, and not identical
    to Linux either. Always note the case of filenames or commands that you are trying
    to use.


    Files have three attributes. Linux has a very simple idea of file attributes—files
    can be readable or not readable, writable or not writable, and executable or not
    executable. Any combination of these is possible, though some combinations are
    not particularly sensible. Generally, programs should be readable and executable,
    and data files should be readable and writable. Linux, however, takes you to your
    word. If you tell it that a file is executable, it will allow you to run your
    Rolodex file, and if you tell it that a program is writable it will let you edit
    your word-processor as if it were a plain-text document rather than a program.


    Everything belongs to somebody. Every file and directory in the Linux file system
    carries around with it information detailing who owns it. The owner of a file
    can allow or disallow access to a file for other users, or other groups of users,
    and can control whether the file is executable, readable, or writable.

