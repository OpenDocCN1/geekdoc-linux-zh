- md: '

    Depending on the resources that are available, your system administrator might
    have chosen to forgo the installation of man pages on your Linux system. The amount
    of disk space used by the manual pages is not trivial, and in these cases, you''ll
    learn to appreciate the built-in help feature provided by many applications.


    ## ADDITIONAL DOCUMENTATION


    Linux distributions often come with a documentation directory filled with valuable
    information. Looking through the /usr/doc directory structure can reveal information
    that isn''t found anywhere else.


    ## PROGRAM SPECIFIC


    Documentation for specific programs is often installed off of the /usr/doc directory.
    To get a look at what is installed on your system, type cd /usr/doc then ls to
    display what is available. These commands are fully explained in Lesson 4, "The
    File System." For now, be aware that cd /usr/doc moves you to the /usr/doc directory,
    and ls lists the files in that directory. This is an area of the system that you
    should feel free to poke around. The information varies depending on the program
    itself. You might find information of the software''s authors, Web pages, and
    so on—whatever the programmers decided to include. For example, the files containing
    information available for the at command on my system can be seen here (my documentation
    is in the directory /usr/doc/at-3.1.7):

    >ls /usr/doc/at-3.1.7/


    - Changelog | Copyright | README | times


    You can use the cat, or less commands to quickly display the information you need.
    These commands are discussed in depth in Lesson 7, "Reading Files.".


    ```

    >more /usr/doc/at-3.1.7/Copyright

    ```


