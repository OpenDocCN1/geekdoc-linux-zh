    # LESSON 6


    The Power of rm


    The rm command is a very powerful command, and one that you should be just a bit
    afraid of. There is not a long-time Linux user alive who has not mistyped arguments
    to the rm command, and that watched in considerable dismay as a large fraction
    of his or her file system evaporates. The rm command can remove as precisely as
    a scalpel or as indiscriminately as a ton of dynamite. Be careful out there!


    Use the rm command to delete files, you should:


    - 1. Determine the file, or files, you want to delete.

    - 2. Issue the rm command as: rm <file1> <file2> <file3> ...


    You may simultaneously remove as many files as you want. For example, if you want
    to delete the files myfile and myotherfile, you would use the following rm command:


    ```

    > rm myfile myotherfile

    ```


    After issuing the rm command for the files you want to delete, you might be presented
    with a response such as


    remove myfile (y/n)?


    This is rm''s interactive mode, a protective measure of rm, designed to make certain
    that you really mean to delete the files that you specified (if you really want
    to, press y). Usually your system administrator will have configured your system
    so that rm operates in interactive mode by default. In Lesson 16, “Modifying the
    User Environment,” you will learn how to change this default, but you would be
    well-advised to leave it in interactive mode until you''ve decided that you''re
    comfortable with Linux.


    # OPTIONS TO rm


    The rm command supports several useful options:


    - 1. Interactive mode—Makes rm ask you to confirm the deletion of each file before
    it actually deletes it. As annoying as this seems, if your system administrator
    hasn’t configured your account to use rm in Interactive mode by default, you should
    get used to issuing the rm command as: `rm -i <file1> <file2>...`


    - 2. Force mode—Requests that rm carry deletions regardless of the file permissions.
    Remember, you can create files and set the permissions such that even you, as
    the owner, can’t read or write the file. If you don’t use force mode, rm will
    ask you if you want to override the permissions whenever it tries to delete files


    - 3. r, Recursive mode—A very powerful option to rm, the Recursive mode is not
    for the faint of heart. When you issue the rm command as: `rm -rf <directoryname>`,
    will recursively delete the directory and all its contents. If the directory contains
    other directories, they will be deleted in the same manner.


    # CREATING A DIRECTORY: mkdir


    Directories are useful for organizing files into sensible groupings. If you need
    to create a directory you should:


    - 1. Decide what you want to call the directory.

    - 2. Issue the mkdir command as: `mkdir <directoryname>`


    For example:

    › `mkdir fresh_new_directory`


    This creates a new directory named fresh_new_directory, which will be located
    in the current directory. Unfortunately, directory was misspelled, so you’ll need
    the next command as well. As with touch, you might need to use `rmdir` to [sic]create]
    a few extra directories so you can remove them with the next command, `rmdir`.


    # REMOVING A DIRECTORY: rmdir


    Old directories laying around you that no longer need aren’t very helpful for
    organization, occasionally you might need to delete one. The rmdir command deletes
    empty directories. To use it to delete a directory, you should:


    - 1. Decide which directory or directories you want out of your way.

    - 2. Issue the rmdir command as rmdir <directory1> <directory2> <directory3>....


    For example:

    > rmdir fresh_new_directory an_old_directory/fuzzykiwi


    This deletes the misspelled directory from the preceding example, as well as the
    directory named fuzzykidir that is located in the directory named an_old_directory.


    The rmdir command will not affect directories that aren’t empty, so it’s a convenient
    command to use to clean house if you’ve got a bunch of directories laying around.
    You can get it to try to delete everything in the current directory by issuing
    the following command:


    > rmdir *


    You’re not expected to understand this syntax yet—you’ll get to that in Lesson
    13, “Regular Expressions.” You’re also likely to get dozens of error messages
    in response to typing this command, but the end result of issuing rmdir in this
    fashion is that any empty directories in this directory will go away, and nothing
    else will be affected.


    # REMOVING FILES AND DIRECTORIES AT THE SAME TIME: rm -r


    Because the rmdir command only works on empty directories, you’ll eventually want
    to delete a directory as well as all its contents. For this, the rm command in
    Recursive mode is actually the solution. If you need to delete a directory and
    all its contents, you should:


    - 1. Determine the name of the directory you want to delete.

    - 2. Issue the rm command as rm -r <directoryname>


    For example, you type:

    > rm -r /priv/home/henry/junkdirectory


    This removes the directory /priv/home/henry/junkdirectory, and recursively removes
    all its contents.


    # WORKING WITH FILES IN THE SHELL


    If you manage to delete your current directory (not a fun thing to do), you''ll
    eventually end up getting error messages saying Cannot stat current directory,
    can''t stat and not found. How long it takes UNIX to figure out that you''re suddenly
    located “nowhere” depends on which commands you run, but you can always rescue
    the situation by typing: cd - / to get back to your home directory.


    # COPYING FILES: cp


    If you need to make copies of files, you will need the cp command. This command
    can either copy a single file to a new destination or copy one or more files to
    a directory.


    To use the cp command to make a copy of a single file, you need to:

    - Determine the source filename and the destination filename you''d like to copy
    it to.

    - Issue the cp command as cp <sourcefile> <destinationfile>


    To use the cp command to copy one or more files to a destination directory, you
    need to:

    - Determine all the source filenames and the name of the destination directory.
    The cp command doesn''t create the destination directory for you, so if it doesn''t
    exist, you''ll need to use the mkdir command first.

    - Issue the cp command as cp <source1> <source2> ... <destinationdir>


    Example:

    > cp myfile1 /priv/home/henry


    This copies the myfile1 from the current directory and places a copy in /priv/home/henry/myfile2.


    In its second form:

    >cp /etc/sendmail.cf /priv/home/henry/myfile1 /tmp


    The example here copies the file sendmail.cf from the directory /etc, the file
    myfile2 from the directory /priv/home/henry, and myfile1 from the current directory,
    and then places the copies to the directory /tmp.


    Remember that you don''t have to copy multiple files to use the “into a directory”
    version—just give it the filename and the destination directory.


    # COPYING DIRECTORIES: cp -r


    Just like the rm command has a Recursive mode for removing directories, the cp
    command has a Recursive mode for copying directories. If you issue the cp command
    with the -r option, it attempts to treat each of the source filenames as directories,
    and recursively copy them to the destination directory. To use the cp command
    in this way, you need to:


    - 1. Determine the names of the directories you''d like to copy.

    - 2. Issue the cp command as cp -r <source1> <source2> ... <destdir>.


    For example, if you were to issue the command:

    > cp -r /var/log/httpd/logs /tmp


    The cp command would create a new directory named in the directory /tmp, and makes
    a copy of the contents of the directory usr/local/httpd/logs in this new /tmp/logs
    directory.


    # MOVING FILES AND DIRECTORIES: mv


    If you simply need to move (rename) files, rather than copying them, you will
    want to use the mv command. This command uses the same two forms that the cp command
    does: the first moves (renames) a file from one name to another name, the second
    moves one or more files to a destination directory.


    To use the mv command to rename a single file, you should:


    - 1. Determine the current name of the file and the name you''d prefer it to have.

    - 2. Issue the mv command as mv <currentname> <newname>

