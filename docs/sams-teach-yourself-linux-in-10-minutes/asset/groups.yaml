    # MODIFYING THE USER ENVIRONMENT


    Working with Paths


    The current directory is usually left out of the path; including it is a bit of
    a security risk. If the current directory is in your path, you can potentially
    be fooled into executing arbitrary programs by naming them as common Linux commands
    and sneaking them into your directories. If you want to put the current directory
    in your path, always put it at the end of the path. That way normal Linux will
    be found before any Trojan horses that may have made their way into your system.


    If you''d like to see what your current path is, you can do so by using `echo
    PATH`. If it''s missing some paths you need, say the current directory and `/usr/local/bin`,
    you can add these by using the command `export PATH=$PATH:./usr/local/bin`.


    # USERS DEFAULTS: THE DOT FILES


    Your account configures certain features for you automatically when you log in
    and when you start shells. Programs other than the shell also use dot files to
    hold configuration information. Dot files are, literally, files with names starting
    with the `.` character, and you''re likely to find an abundance already populating
    your home directory. Some files are


    - .login and logout—As you might guess, files which are executed when you log
    in and when you log out, respectively. If you look in these files you will find
    that they are shell scripts which use commands you are already familiar with.
    The login shell script is typically used for things such as swapping sets of configuration
    files if you want to set multiple environments for yourself, and for doing other
    things that need to be handled automatically at login. The logout script is used
    much less frequently, but it can contain useful things you need to do at logout.
    What of sort use you make of the .login .logout files? How about adding commands
    that echo the date and time information into a file whenever you log in and out.
    If you''ve ever had to fill out a timesheet, you''ll find this one appealing.


    - .bashrc / .bash_profile—Shell scripts that are executed when you open bash.
    (Other shells will have their own scripts that execute at startup as well. Check
    with your shell''s documentation on this.). Again, you should be familiar with
    the syntax. In this file, you can put in commands that do things such as add custom
    paths to your environment, set environment variables, and set up any aliases you
    might be interested in.


    - .plan—A file that contains information that your system will send back to anyone
    who uses .plan file to contain contact information, feature quotes, and anecdotes.
    Put things in your plan that you would want people to see when they try to look
    you up from remote.


    - .Xdefaults—This file contains settings that are used by the server resource
    database. The syntax of this file is covered briefly in Lesson 3, “The Graphical
    User Interface.” In general you won''t need to modify this file, but you can configure
    many options regarding how the X server treats various programs and how X11 programs
    work here. If you choose to poke around in it, be sure to make a backup copy of
    it first, in case you have to put it back. After you have made a backup tough,
    don''t be afraid to make modifications. The syntax is straightforward, and if
    you''ve survived this far, you can probably figure out how to make most of the
    modifications you might want to try.


    You undoubtedly find that you have other dot files in your directories as well.
    Don''t be afraid to look in them. You''ll find most to be more readable than you
    might think. While it might be a bit intimidating at first, a large part of making
    Linux work for you is customizing your environment by modifying these files. Make
    backups first, but don''t be afraid to experiment—it''s half the joy of using
    Linux!


    # FIXING BROKEN TERMINALS: stty


    On occasion, you might find yourself in a command-line window that seems to have
    gone slightly nuts. The Delete key produces `?`, the Backspace key makes a `^`,
    and Ctrl+c produces `^`. If this happens to you, you need to reset the terminal
    parameters for erase and interrupt. To do this the following commands:


    - stty erase <delete>

    - stty intr ^C


    Note that in place of typing a control character directly, you can use `^<character>`
    to represent the character. You can also use erase Backspace if your keyboard
    layout makes Backspace more convenient than Delete. If your terminal gone completely
    insane and the Return key no longer seems to be working correctly, you can try
    using the command: `stty sane Ctrl+j`. This command will attempt to reset the
    terminal to its default settings, but isn''t guaranteed to work.


    # CHANGING KDE''S APPEARANCE


    KDE includes the capability to customize your desktop environment just as you
    would under Windows or Mac OS. You can set the background, screensaver, fonts,
    and other attributes of the windowing environment. The changes you make affect
    only your personal settings (they are not system wide), so feel free to customize
    to your heart''s content! A sampling of the different settings that you can use
    to customize your desktop are shown in Figure 16.1.


    To change KDE''s appearance:


    1. Click the main K toolbar menu item.

    2. Choose Settings from the menu.

    3. Select the property you want to change (Desktop, Sound, and forth).

    4. Choose any appropriate sub-property from the category you''ve chosen. (For
    example, choosing Desktop allows you to change colors, background, and fonts among
    others.)

    5. Make the changes you''d like, and then click the Apply or OK to set them.

    6. Enjoy!


    ![](img/a0a02222222228860321613_0.png)

    Figure 16.1 KDE offers a wide selection of configuration options.


    # SUMMARY


    In this lesson, you were introduced to modifying your environment by the use of
    aliases, environment variables, and configuration files. Making these modifications
    is what lets you make the environment your own.


    - Environment variables—Frequently used for specifying configuration options to
    a program, such as providing a pointer to a directory the system needs.

    - PATH variable—Keeps track of where the system searches for commands when you
    type. If a command exists on the system, but the path to the command is not in
    your PATH, it will not be found.

    - Aliases—A powerful feature of Linux shells. They allow you to rename commands,
    or cause commands to always use certain options when you issue them.

    - Dot files—Many programs use text files containing configuration information
    for control purposes. These files almost universally have filenames that start
    with a . They are the place to look for automating settings to your shell and
    configuring options for the windowing system.

    - stty—A command that can rescue your terminal session if something has caused
    it to begin oddly.


    Don’t be afraid to experiment. You’ve just made it through a lesson on modifying
    your user environment. Now go out and do it!


    # LESSON 17: PRINTING


    In this lesson you''ll learn how you can print requests (jobs) to a printer on
    your network.


    Setting up a printer varies from printer to printer and requires Super User (root)
    privileges, so is difficult to demonstrate this task in the book. Linux computers
    often speak to local servers that provide access to remote printers across a TCP/IP
    network. Luckily, local printers (directly connected) and remote printers are
    accessed in the same fashion, so it is possible to show you how you can use a
    printer in a generic fashion that will apply no matter how your system administrator
    has configured your computer.


    ## SENDING A PRINT JOB: lpr


    In Linux, multiple people can print at a single time. Because of this, when you
    send a print request to a printer, it is assigned a job number. If you need to
    cancel your print job, this number will be used to remove the job from the print
    queue. Only the person who owns a print job can remove it from the queue, unless
    you happen to be the super user, or root.


    > PostScript versus Non-PostScript The assumption is made throughout this lesson
    that you will be printing to a PostScript printer. It is possible, however, that
    your system might be configured to interpret PostScript using a rasterizer and
    print to a non-PostScript printer.

