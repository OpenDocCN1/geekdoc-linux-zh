    In this lesson, you learned the purpose of permissions, owners, and groups. You
    should now understand what is necessary to enable other users to access your files
    and how to collaborate on projects using group permissions. You might want to
    take a few minutes to talk to your system administrator to find out how or she
    has decided to manage groups. Also, you might want to request that groups be created
    which include other users that you want to share files with. Let''s take a look
    at some of the highlights from this lesson:


    - **Permissions**—File permissions control who can access a file and at what level
    they have to a file. The three levels of permissions are read, write, and execute.
    These permissions are applied to the owner, group, or world.

    - **chmod**—the chmod command changes the permissions for a file or directory.
    There are two methods of operation—symbolic and numeric. They both accomplish
    the same thing, whichever you feel comfortable with.

    - **chown**—Only the super user can change who owns a file. If you can convince
    your administrator to do so, chown will change the owner.

    - **chgrp**—You can change the group that a file belongs to with the chgrp command.
    You can only change the file to a group that you belong to.

