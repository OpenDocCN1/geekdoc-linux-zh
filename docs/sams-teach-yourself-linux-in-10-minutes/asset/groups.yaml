    # cat kiwi.txt food.txt


    Kiwis are small, brown, and fuzzy.

    They are good to eat.


    The contents of the two files are displayed onscreen, one after the other.

    Pretty easy, huh? The biggest problem you''ll have with cat is that files

    will scroll the screen if they are too large, but you''re about to learn a way
    around that.


    > Linux Shortcut: If you want to display all the files ending in TXT in the directory,
    you can use wildcards with any of the commands discussed in this lesson. The command
    cat *.txt shows everything in the current directory that ends with TXT.


    ## VIEWING A PAGE AT A TIME: more AND less


    The cat command is fine when you want to quickly show some information—but what
    about large files that scroll past a bit too quickly to read?

    Luckily, there are some utilities specifically created for reading files from
    the command line: less and more. These are often referred to by the generic term
    pagers, because they display files to your window or screen age at a time.


    ## USING more


    Like cat, use more all you need to do is type the command followed by the file
    or files you want to display.


    Example


    ```

    >more longfile.txt

    ```


    This displays the file longfile.txt. Showing the output of the command would be
    a waste of space, because the results are simply the contents of the file, shown
    one page at a time. Instead, there are some commands you can use from within more
    to control the process.


    - Spacebar—Advances the output to the next page.

    - q—Quits the more program, exiting to the command line.

    - s—Skips forward one line in the file. Use this to slowly advance through the
    file.

    - f—Skips an entire page in the file.

    - /*pattern>—Searches and jumps to a pattern or word in the file.

    - b—Scrolls back one page in the file.

    - ? or h—Displays help for the more command. Because you can use this while viewing
    a file, it’s probably the most important one to remember.


    more should be available on any Linux or UNIX computer that you use. If you’re
    lucky, your system might include (and modern Linux distributions do) less. Believe
    it or not, less is more.


    ## Using less


    less is a more modern pager than more, one of its main features is the capability
    to move around within files with less difficulty than more. Again, invoking less
    is identical to using cat and more; supply the files you want to view as arguments
    to the command.


    For example


    ```

    >less configFile.txt

    ```


    As with more, less will display dumpfile.txt a page at a time. Controlling less’s
    output is similar to more. There are several commands that allow you to move around
    within less.


    - Spacebar—Advances the output to the next page.

    - b—Backs up one page.

    - q—Quits out of the less program, exiting to the command line.

    - Up arrow—Scrolls up one line.

    - Down arrow—Scrolls down one line.

    - /<pattern>—Searches and jumps to a pattern or word in the file. This search
    is performed from the current point in the file to the bottom of the file.

    - ?<pattern>—Searches backward and jumps to a pattern or word in the file.

    - h—Displays help for the less command.


    Please keep in mind that this is not meant to be a comprehensive list of all the
    options that more and less support. In fact, if I were to write about all the
    options you can use with less, it would probably occupy 20 pages. This is meant
    to give you enough information to get started. Exploring is half the fun of using
    Linux!


    ## LESSON 7


    ## PEEKING AT PARTS OF A FILE: head AND tail


    There are some instances when you''re only interested in what is stored at the
    top or bottom of a file. (Really, it isn''t as crazy as it sounds!) Suppose you
    have a directory filled with saved email or newsgroup messages. Rather than displaying
    each message in its entirety, you might just want to see the header of the file,
    which contains the subject and sender address. To do this, you use the head command.
    Similarly, if you''re running a Web server and want to see the last few people
    who accessed your site, you can use tail to look at the end of your log file.


    ## USING head


    You should be noticing a common thread between all the programs we''ve looked
    at. To run them, all you need to do is supply the command followed by the file
    or files you want to view. The same holds true for head. By default, head displays
    the first 10 lines of each file you specify.


    For example


    ```

    >head news112.msg

    ```


