    # CREATING LINKS: LN


    The final file management utility you will learn about in this lesson is the command
    used for creating links or aliases to files. The ln command is used to create
    links to files so that one file can appear to be in multiple locations, and have
    multiple names.


    To see the utility of this command, consider the situation where you let your
    friends look at your daily schedule. Daily, or weekly as appropriate, you could
    create a new file with your schedule and name it with the current date. Because
    you wouldn''t want to constantly give your friends new filenames to check your
    schedule, you could just create a link named myschedule, which you would then
    point to file contained your current schedule. Your friends could always look
    at myschedule to get your schedule, and you could keep your daily planner neatly
    arranged.


    To use the ln command to create a link, you should


    1. Determine the name of the file to which you want a link. The ln command is
    willing to create links to nonexistent files, which isn''t particularly useful,
    so make you know the correct name of the file you want to link.

    2. Determine the alternative name by which you would be like to access the file.

    3. Use the ln command as `ln -s <realfilename> <alternatename>`. The -s option
    tells the system that this is a symbolic link. If you''re interested in learning
    about the difference between symbolic and hard links, check out the ln man page.


    For example, if you wanted to be able to easily browse your Web server log, you
    might issue the command


    ```

    > ln -s /var/log/httpd/access_log ~/weblog

    ```


    If you were to do this, you would create a link named myschedule in your home
    directory. This link would be an alternative name for the file /var/log/httpd/access_log.


    You could work with this link almost exactly as though it were the real file.
    If you try to read its contents, you will read the contents of the real file.
    If you try to modify or edit it, you will edit the contents of the real file.
    If you delete the link however, you will only delete the link; the real file will
    remain. If you ls -l the link, it will show up as a filename that points to another
    path so that you can tell the link apart from the real file.


    ```

    > ls -l ~/weblog

    ```


    ```

    lrwxr-xr-x 1 ray 7 Nov 28 1998 weblog ->/var/log/httpd/access_log

    ```


    > Web Server Tip: One useful place to use the ln command is when working with
    Web servers—if you''re not going to be using a Web server, ignore this tip. Many
    Web servers use symbolic links.


    # WORKING WITH FILES IN THE SHELL


    # LESSON 7

    # READING FILES


    This lesson introduces you to basic commands that you can use to read files on
    your computer.


    Your Linux computer can be used for hundreds of applications, but no matter what
    the use, you''re going to know how to do one simple task: read files. Most Linux
    applications use text-based configuration files, come with text-based instruction
    files, and store text-based log files. Undoubtedly, you''re going to want to tap
    into this information. Other than loading up a text editor or word processor,
    how can you do this? This lesson answers question by showing you what''s inside
    all those files.


    # VIEWING FILES ALL AT ONCE: CAT


    The simplest way to look at files is to use cat, the concatenate command. It is
    called concatenate because it adds to the output stream whatever is in the files
    it is given. You''ll learn more about the output stream in Lesson 12, "Input and
    Output." For now, understand that this is what will be displayed. cat allows you
    to quickly read your files. It displays the contents of all the filenames it is
    given, immediately after another. You can use cat along with a redirection operator
    (you''ll learn about those in Lesson 12) to create one file that holds the contents
    of several other files. For now, you''ll use cat to display a file.


    To display a file, supply cat with the file, or files you want to show as arguments
    to the command.


    # SUMMARY


    In this lesson, you learned a set of commands with which you can manage files.
    It is very important to remember that if you start with a single file, your destination
    should be a single file; and if you start with multiple files, your destination
    must be something that can hold multiple.


