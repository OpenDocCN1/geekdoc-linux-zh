    You should have received a copy of the GNU General Public License with this program.
    If not, write to the Free Software Foundation Inc., 675 Mass Ave, Cambridge, MA
    02139, USA.


    Nothing too exciting, but there''s no telling what you might learn if you poke
    around.


    ## HOWTO INFORMATION


    Documentation about individual programs is useful, but you might also be interested
    in how to complete certain tasks on your system, such as configuring a soundcard.
    Linux provides a comprehensive HOWTO database that contains information on everything,
    including configuring your system to use 3D accelerators or soundcards. The HOWTO
    files are located in the /usr/doc directory, in a subdirectory called /usr/doc/HOWTO.


    To see the available HOWTO files, list the HOWTO:


    ```

    >ls /usr/doc/HOWTO


    3Dfx-HOWTO

    AX25-HOWTO

    Access-HOWTO

    Alpha-HOWTO

    Assembly-HOWTO

    Benchmarking-HOWTO

    BootPrompt-HOWTO

    Bootdisk-HOWTO

    Busmouse-HOWTO

    CD-Writing-HOWTO

    ```


    Use more, less, or cat to display any of the files that might be of interest to
    you. For example, to display information on setting up a 3Dfx accelerator card,
    type the following:


    ```

    > /usr/doc/HOWTO/3dfx-HOWTO

    ```


    Complete configuration instructions will be displayed. There are a very large
    number of HOWTO files available, so you should be sure to check to see if a HOWTO
    help file is available for any problems you encounter.


    ## HTML HELP INFORMATION


    Much of the HOWTO information, as well as other documentation, is available in
    HTML format. Viewing the documentation in HTML format using the Lynx browser might
    be a more pleasant experience. You can use any browser you''d like to display
    the information. Lynx, however, is usable from the command line, and is extremely
    fast. The HTML version of the HOWTO documentation is located in the /usr/doc/HOWTO/other-formats/html.


    For example, to view the 3Dfx-HOWTO file in HTML format, you could do this


    ```

    >lynx /usr/doc/HOWTO/other-formats/html/3Dfx-HOWTO.html

    ```


    The text-based Lynx browser loads and displays the HTML formatted version of the
    3Dfx HOWTO document.


    > Format Varieties Documentation can come in formats other than plain text or
    HTML. If you stumble across a file ending in .ps, .eps, or something else that
    isn''t easily readable, check out the section, “File Formats,” in Lesson 7.


    ## OTHER INFORMATION SOURCES


    Linux is growing quickly, and so are the resources that provide support and information.
    Searching for Linux using any Web search engine will yield thousands of sites
    offering information on the subject. Here are a few Web sites and newsgroups that
    you might want to use as starting points for your search.


    ## THE LINUX HOME PAGE


    The Linux home page is an excellent starting point for anything related to the
    operating system. Links are provided to vendors, applications, events, and other
    Linux goodies. Check out their home page at http://www.linux.org/


    ## THE LINUX DOCUMENTATION PROJECT


    The Linux Documentation Project is a continuously updated collection of information
    related to Linux. The LDP contains FAQs (frequently asked questions), HOWTOs,
    and other documentation related to the installation and maintenance of Linux-based
    systems. You might have a copy of the LDP already installed on your system in
    the /usr/doc/LDP directory. To view the most current information, however, you
    should check the online LDP reference, which is located at http://sunsite.unc.edu/LDP/


    ## NEWSGROUPS


    Newsgroups provide a less structured approach to finding information, but you''ll
    be surprised by the amount of support you can get from complete strangers. Whatever
    your need, there is a Linux newsgroup that will provide answers. To get started,
    take a look at:


    - comp.os.linux.answers

    - comp.os.linux.setup

    - comp.os.linux.misc


    ## THE KDE HELP SYSTEM


    If you are using KDE for most of your day-to-day work, you''ll be glad to know
    that KDE has its own built-in HTML help system that is extremely well-integrated
    into the KDE environment.


    ## DOCUMENTATION AND FINDING HELP


    Tips of All Sorts If you don''t want to use the full-blown help system, KDE''s
    ToolTips might help you. ToolTips are quick blips of information that are displayed
    when you pass your cursor over. Not all applications support ToolTips, but if
    you don''t know what something does, pass your cursor over it, wait a few seconds,
    and see if one appears.


    Each application has its own Help menu that is laid out to the KDE specification,
    which maintains consistency across all applications.


    To access the Help viewer from within an application, select Contents from the
    Help menu.


    ![](a0e6136ea1c86032b6127d28a7bd962_32_0.png)


    KDE has an integrated HTML help system.


    The KDE Help viewer is a full-fledged HTML viewer. You can navigate through the
    help files by clicking the links, as you would in any web browser.


    > Tip Trick Up Your Sleeve — Because the KDE help and file browser is really an
    HTML browser, you can use the KDE browser to view any of the other HTML documentation.
    Type the URL of the file you want to view into the top of the browser window and
    press Enter.


    ## SUMMARY


    There are many resources available for Linux. Depending on your needs, you can
    approach your search for information several ways. The methods you should now
    be familiar with:


    - **Linux manual pages**—Use the **man** command to display full information about
    a specific command. The **apropos**, **man -k**, **man -f**, and **whatis** commands
    can display summary information and search for a specific type of command.

    - **Built-in help**—Many programs have built-in help that can be displayed with
    a command-line argument, usually **--help** or **-h**.

    - **/usr/doc directory**—Documentation for many programs and tasks is located
    in the /usr/doc directory. HTML-formatted information is also available in this
    directory.

    - **Online resources**—The Linux home page and Documentation Project provide excellent
    starting points when wading through the mountains of online Linux information.
    The comp.os.linux newsgroups are also extremely useful for hard-to-find answers.

