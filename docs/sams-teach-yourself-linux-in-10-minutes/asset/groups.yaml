    emacs 并没有提供一个供你快速过的示例，而是提供了自己的帮助和教程函数。总是鼓励新用户通过 emacs 教程来熟悉编辑器的功能，并学习如何向它寻求关于其他功能的帮助。


    要进入 emacs 教程，启动 emacs 并输入 `Ctrl+hi`（按住 Ctrl 键，按 h，松开 Ctrl 键，按 i）。如果你在 `Ctrl+h`
    之后输入 `?` 而不是 `i`，你会发现实际上有很多 `i` 的替代方案，这为你提供了大量类型的有用信息。现在，先看教程吧。如果你好奇，可能可以花几个月来探索其他选项。


    # KDE 内置编辑器


    KDE 提供了一个非常方便的点击式文本编辑器，包含了你可能在个人电脑编辑程序中预期的所有方便的鼠标功能。


    要激活 KDE 编辑器，点击 KDE 工具栏中的 K。现在，从弹出菜单中选择“Applications”（应用程序），然后从子菜单中选择“Editor”（编辑器）。将打开一个类似于图
    8.1 所示的窗口。


    # 文本编辑


    ![](img/a0e6136ea1c86032b26127d28a7bd962_96_0.png)


    图 8.1 KDE 有一个易用的内置编辑器。


    编辑器耐心：基于 X Windows 的应用程序启动可能需要几秒钟——而且没有旋转光标让你知道机器实际上正在执行你的要求。如果编辑器没有立即打开，请不要担心。如果你在它打开之前再次选择编辑器，最终你会运行两个编辑器。


    内置的 KDE 编辑器包含了你可能从基于 GUI 的编辑器中预期的所有正常的点点击式选择、复制、插入和删除功能。此外，它使用了 KDE 的数据位置抽象，因此你可以直接使用
    URL 从 FTP 或 网站打开文件。在图 8.1 中，你可以看到 KDE 文本编辑器的菜单之一被选中。在出现的下拉菜单上，可以看到其中几个方便的功能。


    # 总结


    在本节中，你结识了 Linux 平台上最受欢迎的两个文本编辑器：vi 和 emacs。对于这两个编辑器，最好的学习方法是在实践中学习，本节为你提供了执行文本编辑器中三个最重要任务所需的工具：启动编辑器、编辑文本以及在出错时优雅地退出。因为你已经学会了如何在
    vi 和 emacs 中不保存退出，所以不要害怕实验。你还学习了 KDE 的内置编辑器，作为旧版 Linux 世界中基于窗口的编辑器的替代方案。让我们回顾一下：


    - vi 编辑器对文件进行小修改既快速又方便——它有一个对初学者来说具有挑战性的用户界面。

    - emacs 编辑器强大且可扩展，但它的学习曲线更陡峭。

    - KDE 的内置编辑器是一个易于使用的 GUI 选项。


