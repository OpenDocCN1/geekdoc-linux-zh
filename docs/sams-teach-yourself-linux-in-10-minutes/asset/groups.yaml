    # LESSON 3


    ## THE GRAPHICAL USER INTERFACE


    In this lesson you will learn the basics of the X Windows GUI, along with enough
    information to get you started on configuring and customizing your environment.


    While Linux can be accessed via a command-line interface from the console, there
    is an easier way. On top of the command-line interface, a variety of graphical
    user interfaces (GUIs) are available. A few of these GUIs are proprietary, but
    the majority conform to an open-standard interface called the X Window System,
    or X Windows. Some manufacturers have extended the X Windows standard with proprietary
    enhancements, which can cause parts of the interface to be incompatible with remote
    display on other Linux, and UNIX systems. However, the general principles are
    similar, and a familiarity with one interface translates well to the others. If
    you can learn X Windows under Linux, you should have no problem applying that
    knowledge to commercial UNIX systems.


    ## X WINDOWS BASICS


    Unlike the Macintosh and MS-Windows deenvironments, X Windows is a system that
    provides a set of interface display functions. Linux provides a free distribution
    of X Windows called XFree86. Currently it supports the latest X Windows revision,
    6.2, and just about any video card that is available for the Intel platform.


    > X Marks the Spot: X Windows is usually referred to as X#, where # is the major
    revision number, or X#Rn where # is the major revision number and n is the minor
    revision. As of this writing, X11R6 is the current version, but it is generally
    referred to as X11—or, just X.


    X Windows provides facilities for programs to display windows, buttons, and other
    user-interactive widgets. The interface is actually implemented as a type of server
    program running on the computer. Client programs that want to make use of X Windows
    display functionality catch the server and make requests asking it to perform
    certain display functions. It does not matter to the client or server application
    whether they are running on the same machine or separated by miles of network—the
    client makes requests and the server tries to honor them.


    An additional difference between personal-computing window systems and X Windows
    is the fact that the look and feel of the interface is controlled by a separate
    program, rather than by the X Windows server. In the X Windows model, the server
    is responsible for handling client display requests, such as requests for displaying
    windows. Unless a client specifically draws a title bar for itself, X won''t give
    it one. A separate program must be run to create title bars and to actually manage
    user interactions, such as moving windows around, iconizing or minimizing windows,
    or providing application-dock functionality.


    ## STARTING X WINDOWS


    On Linux boxes, you, or the system administrator, might have configured X so that
    it starts automatically when the machine boots. If your system does not automatically
    start X, you will need to start it manually after you log in. The two most common
    ways to do this are the xinit program and startx shell script. Startx (and its
    variants) is usually a shell script that automates some of the calls to xinit,
    and would be a good place to start browsing if you''re curious about how things
    are done and what options are available. (Shell scripts are covered in Lesson
    14, "Basic Shell Scripting").


    After the X server itself starts, you will need to start some X applications.
    Usually, a default set of these is started by the automatic execution of the .xinitrc
    file located in your home directory. Some Linux distributions don''t use this
    file. Your system administrator can always change the default configuration. If
    you can''t locate .xinitrc, you might find that your system remembers which windows
    you have open and where they are positioned between logins "automagically."


    The .xinitrc file (if present) contains a series of lines similar to the following:

    ```sh

    #!/bin/sh

    xrdb -load $HOME/.X11defaults

    xscreensaver -timeout 10 &

    xterm -geometry 80x30+10+10 &

    ```


    If this in fact was your .xinitrc file, when you started X11, the .xinitrc file:


    - **Line 1**—Run itself via the bourne shell.

    - **Line 2**—Load the server resource database (discussed later in this lesson)
    from the file .X11defaults in your home directory.

    - **Line 3**—Start the xscreensaver command with a 10-minute timeout, and then
    place it in the background.

    - **Line 4**—Start an xterm (terminal), which is 80 characters wide by 30 characters
    high and place it 10 pixels from the top and left of your screen.


    You’ll see more examples of command-line options to X programs later in this lesson.


    ## USING X WINDOWS


    The look and feel of X Windows is mostly the responsibility of the particular
    window manager you''ve chosen to run. (You''ll learn more about window managers
    and some of their options later in this lesson.) It is likely that you''ll find
    a number of constants between the different window managers. Some of these consistent
    features will be familiar to anyone who has previously used a computer with a
    mouse: for example, pointing, clicking and dragging and dropping. A few managers,
    however, are likely to be new to users familiar with the Macintosh and MS-Windows
    environments. The significant things to remember are:


    - X is designed for a three-button mouse—Most X software makes use of the left
    button for pointing, clicking, and selection. The center button is used for UI
    general functions such as moving or resizing windows. X uses the right button
    for application-specific functions such as opening menus.

    - X is designed for a three-button mouse—Most X software makes use of the left
    button for pointing, clicking, and selection. The center button is used for UI
    general functions such as moving or resizing windows. X uses the right button
