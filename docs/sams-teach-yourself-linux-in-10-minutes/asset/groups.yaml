    # 查找包含单词或模式的文件


    Linux 中最强大的内置程序之一是 `grep`。`grep` 命令允许你快速在文件内容中搜索特定的单词或模式。它有三种模式：`grep`、`egrep`
    和 `fgrep`。这些版本之间的区别在于它们能够处理的正则表达式的复杂度。（正则表达式定义了一种文本模式，当不知道要搜索的特定单词或短语时，可以使用它来搜索文件。你将在第
    13 节“正则表达式”中学习更多相关内容。）`fgrep` 命令是三者中速度快的，但处理的复杂表达式最少。为了安全起见，你始终可以使用基础的 `grep`，它在每个系统的每种情况下效果都相同。那么，你如何使用这个奇妙的工具呢？给它提供要查找的单词或模式，以及它应该搜索的文件：


    - 选择你想定位的单词或短语。

    - 找到要搜索的文件名。如果它在另一个目录中，你必须指定完整路径。如果你需要，还可以使用通配符搜索多个文件。

    - 在命令提示符处输入 `grep <要查找的模式> <要搜索的文件或文件>`。


    例如：


    ```

    >grep "jray" *.txt

    8979-10.txt:<manager>=jray

    log.txt: Access by jray on 11/12/98

    kiwi.txt: jray loves to eat kiwi. But don''t think it would be

    ```


    此示例在任何以 `.txt` 结尾的文件中搜索 `jray`。它找到了三个包含该字符串的文件（`8979-10.txt`、`log.txt` 和 `kiwi.txt`）；每个文件名后面跟着包含
    `jray` 的文本。你可能考虑为 `grep` 添加两个选项：`-i` 用于忽略大小写，`-n` 用于显示每个文件中匹配项的行号。你可以将这些标志添加到命令行，紧跟在
    `grep` 命令之后。


    `grep` 是一个非常有价值的工具，当你以后学习正则表达式时，它会变得更有价值。记得回到这一节，测试你在第 13 节中将学到的内容。


    # 使用 KDE 查找功能


    对于运行 KDE 的用户，你会很高兴地发现它有一个内置的查找工具，提供了 `find` 和 `grep` 命令行版本的许多相同功能。KDE 为这些功能提供了一个友好的界面，对于任何在
    Mac OS 或 Windows 电脑上运行过搜索的人来说都会非常熟悉。KDE 查找工具如图 5.1 所示。


    ![](img/a0e6136ea1c86032b26127d28a7bd962_68_0.png)


    图 5.1 KDE 为 UNIX Find 和 Grep 工具提供了友好的界面。


    在 KDE 中搜索：


    1. 点击 K 工具栏图标调出 KDE 主查找。

    2. 选择“查找文件”（Find Files）。

    3. 从三个标签页之一选择合适的搜索标准。

    4. 点击查找工具栏中的放大镜图标来定位匹配的文件。


    查找文件工具中有三个不同的标签页，执行三种不同类型的搜索：


    - 名称与位置（Name & Location）——如果你正在搜索文件名，这是你需要使用的标签页。你可以输入部分文件名并为搜索提供起始目录。这等同于你之前使用的
    `find -name` 命令。

    - 修改日期（Date Modified）——就像你学过的 `find -mtime` 选项，“修改日期”标签页允许你根据修改日期搜索文件系统。


    # 第 5 节


    - 高级（Advanced）——高级选项允许你定位特定类型的文件，或在文件内容中搜索单词或短语。


    当然，你也可以继续使用 KDE 的命令行工具，但如果你更习惯于点击，那么知道有这个选项也是很好的。


    # 总结


    在基于 Linux 的计算机上，由于可搜索的文件和目录数量巨大，查找某些内容可能会有点困难。在这一节中，你学习了几种根据名称和属性定位文件的技术。你学习了如何在文件内容中搜索特定的单词或短语。


    - find——`find` 命令可以根据各种标准在整个 Linux 文件系统中搜索特定文件。你学习了如何使用它根据名称、创建日期和大小来查找文件。

    - locate——虽然有用，但 `find` 并不总是获取文件的有效方法。`locate` 命令搜索文件名数据库并立即返回所有匹配你搜索请求的内容。

    - whereas——如果你在寻找程序文件、源代码或页面，`whereas` 命令可能对你。`whereas` 搜索预设的常用文件位置列表，并快速返回找到的任何路径。

    - which——`which` 函数依赖于你的 `PATH` 变量。它会在你为特定文件名指定的路径中搜索。

    - grep(grep/egrep/grep)—`grep` 命令是搜索文件实际内容中特定单词或模式的强大方法。当配合正则表达式时，`grep` 命令的威力巨大。

    - KDE 查找工具——KDE 提供了一个易用的界面，包含了 `find` 和 `grep` 的许多功能。


    # 第 6 节


    # 在 Shell 中操作文件


    在这一节中，你将学习如何执行基本的文件维护，例如创建和删除文件及目录。


    你今天可能发现这些命令的用法不多，但在需要时了解它们很好。我们将从如何创建文件开始。


    # 操作文件和文件夹：命令行


    `touch` 命令用于更新文件的最后修改时间并设置为当前时间。这看起来像是一个奇怪的操作，但它是一个非常有用的工具。


    如果你需要更新文件的修改日期或创建一个空文件，请执行以下操作：


    1. 确定要更新或创建的文件名和文件名。

    2. 执行命令 `touch <filename> <filename>`。


    例如：


    ```

    > touch myfile

    ```


    如果 `myfile` 之前存在，它的最后修改日期现在设置为当前时间。如果 `myfile` 之前不存在，它现在将作为一个具有当前修改日期的空存在。


    当然，如果你想创建多个文件或更新多个文件的修改日期，你可以输入：


    ```

    > touch myfile myfile2 myfile

    ```


    结果是 `myfile`、`myfile2` 和 `myfile` 都将具有更新的修改日期或根据需要被创建。


    > touch 的额外用途

    touch 文件的一个有用副作用是：如果你尝试 touch 的文件不存在，touch 它将导致创建一个新的空文件。


    > 利用 touch 的优势

    你可能记得可以使用 `touch` 命令的一个地方是备份和归档软件。许多全系统备份程序默认只备份自上次备份以来修改的文件（这被称为增量备份）。如果你想确保某个文件被备份，即使你没有修改它，你也可以
    touch 该文件来更改修改日期，使其看起来是在你 touch 时被修改过的。


    # 删除文件：rm


    现在你已经知道了如何创建文件，也许是时候学习如何删除它了。`rm` 命令用于删除文件。


    '
