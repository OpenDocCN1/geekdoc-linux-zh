- md: "\n# LESSON 10\n## COMPRESSION AND ARCHIVING TOOLS\n\nIn this lesson you will\
    \ learn about the common Linux tools for compressing and archiving files. You\
    \ will also learn about a few tools you can use to keep tabs on your disk usage.\n\
    \nWhile conserving disk space has almost become a thing of the past, it is still\
    \ occasionally necessary to compress your files, or bundle them up for archival\
    \ purposes.\n\n## COMPRESSING FILES\n\n> an 80MB SCSI-1 drive cost $369 in 1988,\
    \ and a 20MB MFM replacement for a PC-AT recently found by a friend of the author\
    \ included its original packing receipt—a bill to the tune of $720! Today, $500\
    \ can buy 5GB or more of storage!\n\nWith today's extremely inexpensive hard drives,\
    \ the pressure to maximize disk usage efficiency is much lower than it has been\
    \ in the past, but in some environments such as schools, the pressure is still\
    \ present. If you happen to be using a system where disk space is a premium, you\
    \ can use the commands in the compression section of this lesson to reduce the\
    \ amount of space your files occupy, or to fit more stuff in the space you are\
    \ allowed. Even if disk space isn't a concern for you, there are occasions, such\
    \ as when sending files around via email or distributing them over the Internet,\
    \ when compressing files might be a wise choice.\n\nThere are three major compression\
    \ formats you are likely to encounter when using Linux: compressed files made\
    \ using the Linux program compress, zipped files made using Linux or PC versions\
    \ of the PKZip program, and gzipped files made using the gzip utility. Each of\
    \ these formats has a set of programs for compressing and uncompressing files.\
    \ Also appearing recently is the bzip2 compression utility, which, while fairly\
    \ new, looks very promising for tight compression.\n\n## USING compress/uncompress/zcat\n\
    \nThe creatively named compress command uses an older UNIX compression format\
    \ that is slowly dying out as the gzip format gains popularity. Files created\
    \ with the compress command have the file suffix Z. To use the compress command\
    \ to compress a file, issue the command as `compress <filename>`.\n\nThe equally\
    \ creatively named uncompress command uncompresses (surprise!) the results of\
    \ a compress command. To use the uncompress command, issue the command as `uncompress\
    \ <filename.Z>`.\n\nThe zcat command (with its slightly less intuitive name) is\
    \ a version of cat that reads compressed files rather than normal text files.\n\
    \nUsing zcat is as intuitive as compress and uncompress: `zcat <filename.Z>`.\
    \ To make zcat somewhat more useful if it's a large file you're trying to look\
    \ at, you can pipe the output into your preference of pager. To do this, issue\
    \ the command as `zcat <filename.Z> | more`. The vertical bar `|` is the Linux\
    \ pipe character—it pipes the output of the command preceding it into the input\
    \ of the command following it. (You'll learn more about this in Lesson 12, \"\
    Input and Output.\")\n\nFor example, if you have a compressed file named stuffed.Z,\
    \ and you want to read it without bothering to uncompress it first, you can type:\n\
    `zcat stuffed.Z | more`\n\nYour machine should respond by using more to page you\
    \ go through the document.\n\n## USING zip/unzip\n\nBased on the algorithm from\
    \ the PC standard PKZip program, the zip and unzip programs work exactly as you\
    \ would expect them to: `zip <filename>` to compress a file with zip, and `unzip\
    \ <filename.z>` to unzip the files.\n\nCreating files using the zip format (which\
    \ uses the suffix Z in Linux) for distribution to other Linux users is generally\
    \ not a good idea, as zip and unzip are not available to Linux users. (These utilities\
    \ are freeware—get your system administrator to install them if you need to access\
    \ to them.) If your target, however, is Macintosh or Windows users, zip is a format\
    \ that they should be able to read.\n\nBoth the zip and unzip programs have a\
    \ number of potentially useful options, a list of which can be displayed by issuing\
    \ either command followed by the option `-h`.\n\n## USING gzip/gunzip\n\nThe GNU\
    \ gzip suite was created in response to the realization that Linux's compress/uncompress\
    \ programs were based on proprietary algorithms and that this might someday entail\
    \ licensing fees. Again, the gzip/gunzip programs work essentially identically\
    \ to the compress/uncompress/zcat suite. Files compressed in the gzip format use\
    \ the suffix GZ, and are generally smaller than files compressed with compress.\
    \ If you'd like, you can use these commands to work with Z (compress) files.\n\
    \n> What's this BZ File? There is a new compression format that has a slightly\
    \ better compression ratio than gzip; these are identified by the BZ extension.\
    \ The commands to work with these files are bzip2 and bunzip2. The syntax is nearly\
    \ identical to gzip/gunzip, so you shouldn't have any problem dealing with them.\n\
    \n![](img/a0e6136ea1c86032b26127d28a7bd962_108_0.png)\n\n## bzip2/bunzip2\n\n\
    While a relatively new addition to the Linux/UNIX compression scene, the bzip2\
    \ compressor appears to produce better compression than either compress or gzip.\
    \ The syntax and options for bzip2 have intentionally been made similar to gzip,\
    \ so if you should encounter this program as it grows in popularity, you shouldn't\
    \ have any problem dealing with them.\n\n## MANAGING YOUR DISK USAGE\n\nIf you're\
    \ on a system where you need to worry about or are just curious about how space\
    \ your files are taking up, there are commands you can use:\n\n- ls: Turning back\
    \ to Lesson 4, \"The File System,\" you can use the ls command with -l to display\
    \ disk usage. If you need to scan quickly through files to see which ones are\
    \ taking up the most room, this is a quick way to do it.\n- find: In Lesson 5,\
    \ \"Finding Files,\" you were introduced to using the find command to find files\
    \ over a certain size. Similar in utility to the ls -l command for this purpose.\
    \ \n- df: Used by system administrators, the df command provides information about\
    \ disk usage. Depending on your version of Linux, you might have to give df different\
    \ options to get it to produce readable output, but the general form you'd be\
    \ interested in is df /. \n- du: Another system administrator type command, du\
    \ provides information about disk usage by directory. Again, different versions\
    \ of Linux use slightly different syntaxes, but the general form you will be most\
    \ interested in is du -s *.\n\n## ARCHIVING Files: tar\n\nIf you spend much time\
    \ using Linux systems, you are bound to run into tar files. Tar is short for tape\
    \ archive, though the tar command and its output are very rarely used for archiving\
    \ tape anymore. More sophisticated and more powerful programs have taken over\
    \ the job of archiving to tape, though the tar command remains a convenient and\
    \ useful tool for personal archiving and distribution of files.\n\nThe tar command,\
    \ in its simplest form, either creates or unpacks archive files. When creating\
    \ an archive, you provide tar with a filename for the archive and a list of files\
    \ to archive. The program then collects all the\n"
  mdcn: "\n\n# 第 10 \n## 压缩与归档工具\n\n在本节中，你将学习用于压缩和归档文件的常用 Linux 工具。你还将学习一些可以用于监控磁盘使用情况的工具。\n\
    \n虽然节省磁盘空间几乎已成为过去式，但有时仍然需要压缩文件，或者为了归档目的将它们打包。\n\n## 压缩文件\n\n> 1988 年，一个 80MB 的\
    \ SCSI-1 驱动器花费 369 美元，而作者的一位朋友最近为 PC-AT 找到 20MB MFM 替换品附带了原始包装收据——一张高达 720 美元的账单！今天，500\
    \ 美元就能买到 5GB 或更大的存储空间！\n\n由于如今硬盘极其廉价，最大化磁盘利用效率的压力已经比过去小得多，但在学校等某些环境中，压力依然存在。如果你恰好在使用一个磁盘空间非常宝贵的系统，可以使用本节压缩部分中的命令来减少文件占用的空间，或者在允许的空间内放入更多内容。即使磁盘空间对你来说不是问题，在某些情况下（例如通过电子邮件发送文件或在互联网上分发文件），压缩文件可能是一个明智的选择。\n\
    \n在使用 Linux 时，你可能会遇到三种主要的压缩格式：使用 Linux 程序 `compress` 创建的压缩文件、使用 Linux 或 PC 版本的\
    \ PKZip 程序创建的 zip 文件，以及使用 `gzip` 实用程序创建的 gzip 文件。每种格式都有一组用于压缩和解压缩文件的程序。最近还出现了\
    \ `bzip2` 压缩工具，它虽然很新，但在高压缩率方面看起来非常有前景。\n\n## 使用 compress/uncompress/zcat\n\n命名富有创意的\
    \ `compress` 命令使用一种较旧的 UNIX 压缩格式，随着 `gzip` 格式的流行，这种格式正在逐渐消失。使用 `compress` 命令创建的文件后缀名为\
    \ `Z`。要使用 `compress` 命令压缩文件，请执行命令 `compress <filename>`。\n\n同样命名富有创意的 `uncompress`\
    \ 命令用于解压缩（不出所料！）`compress` 命令的结果。要使用 `uncompress` 命令，请执行命令 `uncompress <filename.Z>`。\n\
    \n`zcat` 命令（其名字稍微不太直观）是 `cat` 的一个版本，用于读取压缩文件而不是普通文本文件。\n\n使用 `zcat` 与 `compress`\
    \ 和 `uncompress` 一样直观：`zcat <filename.Z>`。为了在查看大文件时让 `zcat` 更有用，你可以将输出通过到你喜欢的分页器。要这样做，请执行命令\
    \ `zcat <filename.Z> | more`。竖线 `|` 是 Linux 管道字符——它将前一个命令的输出传递给后一个命令的输入。（你将在第\
    \ 12 节“输入与输出”中学习更多内容。）\n\n例如如果你有一个名为 `stuffed.Z` 的压缩文件，并想在不先解压缩的情况下读取它，可以输入：\n\
    `zcat stuffed.Z | more`\n\n你的机器应该通过使用 `more` 来为你翻页文档。\n\n## 使用 zip/unzip\n\n基于\
    \ PC 标准 PKZip 程序的算法，`zip` 和 `unzip` 程序的工作方式完全符合你的预期：`zip <filename>` 用 zip 压缩文件，用\
    \ `unzip <filename.z>` 解压缩文件。\n\n使用 zip 格式（在 Linux 中使用后缀 `Z`）创建文件并分发给其他 Linux\
    \ 用户通常不是好主意，因为 Linux 用户可能无法使用 `zip` 和 `unzip`。（这些工具是免费软件——如果你需要它们，请让系统管理员安装它们）。但是，如果你的目标是\
    \ Macintosh 或 Windows 用户，zip 是他们应该能够读取的格式。\n\n`zip` 和 `unzip` 程序都有许多可能有选项，通过在执行任何命令后加上选项\
    \ `-h` 可以显示选项列表。\n\n## 使用 gzip/gunzip\n\nGNU `gzip` 套件的创建是因为人们意识到 Linux 的 `compress/uncompress`\
    \ 程序是基于专有算法的，这将来可能涉及许可费用。同样，`gzip/gunzip` 程序的工作方式与 `compress/uncompress/zcat`\
    \ 软件包件基本相同。以 gzip 格式压缩的文件使用后缀 `GZ`，并且通常比用 `compress` 压缩的文件小。如果你愿意，可以使用这些命令处理 `Z`（compress）文件。\n\
    \n> 什么是 BZ 文件？有一种新的压缩格式，其压缩率比 gzip 略好；这些文件通过 `BZ` 扩展名识别。处理这些文件的命令是 `bzip2` 和 `bunzip2`。语法与\
    \ `gzip/gunzip` 几乎相同，所以你处理它们时应该不会遇到问题。\n\n![](img/a0e6136ea1c86032b26127d28a7bd962_108_0.png)\n\
