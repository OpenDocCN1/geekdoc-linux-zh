    # 第 13 节


    ## 正则表达式


    在本节中，你将学习正则表达式的基础知识，以及如何将它们与 `grep` 命令配合使用。


    正则表达式是一件很棒的东西。阅读本节内容时，请接受这一事实，你就会一切顺利。正则表达式被用于许多编程语言和 Linux 命令中。它们虽然有一点深奥的色彩，但理解它们仍然是至关重要的。尽管在本节中，你将只会结合
    `grep` 命令查看正则表达式，但你可以将这些知识应用到几乎所有使用正则表达式的地方。掌握正则表达式需要时间。本节内容较短，应该仅作为该主题的介绍。


    ## 模式匹配


    正则表达式是一种指定字符模式的方法，然后可以将该模式与现有文本进行匹配。当你不确定自己在寻找什么内容时，可以使用它们来定位信息，或者它们也可以执行极其复杂的搜索和替换程序。Perl（实用提取和报告语言）编程语言大量使用了正则表达式，并被认为是创建动态
    Web 应用程序的最佳语言之一。


    ## 在 grep 中指定正则表达式


    在 `grep` 中，指定正则表达式的格式为 `grep <正则表达式> <文件名> <文件名> ....`。由于本节使用 `grep` 作为示例，请熟悉这种格式。其他程序有时要求在正则表达式的两边用
    `/` 隔开，但 `grep` 并非如此。


    ## 匹配单个和多个字符：AND 和 *


    由于正则表达式定义了一种匹配方法，这里是正则表达式的一些最常见部分以及它们如何被用于匹配示例模式。对于示例，我将使用一个名为 `sample.txt` 的文件（如果你想跟着操作，请使用第
    8 节“文本编辑”中的文本编辑器现在创建它），其内容如下：


    This is a test

    Kim Steinmetz

    (614) 555-0591

    (615) 555-0000

    1998

    1999

    1800

    1750


    点字符 (`.`) 可以用来匹配任何字符。例如，假设我不知道上一个文件中 Kim 姓氏的拼写。我可能会把 `i` 和 `e` 搞混。在这种情况下，我可以像这样使用
    `.`：


    ```

    > grep "St..nmetz" sample.txt

    ```


    Kim Steinmetz


    `St nmetz` 构成了正则表达式中一个明显的部分——它们与名字 Steinmetz 中的字母直接匹配。因为我不确定 `i` 还是 `e`，我简单地将它们替换为点，`grep`
    返回了我想要的行。


    星号 (`*`) 匹配模式（或模式部分的任意次数出现。假设我我知道 Kim 的姓氏以 `S` 开头并以 `z` 结尾。在这种情况下，我可以使用 `*` 配合
    `.` 来匹配 `S` 和 `z` 之间的任何内容：


    ```

    > grep "S.*z" sample.txt

    ```


    Kim Steinmetz


    果其然，效果很好！我猜我现在可以完全忘记她名字的拼法了，对吧？


    > 理解 *：需要注意的是，`*` 会匹配模式的任意次数出现，包括零次。这意味着表达式 `S.*z` 会很乐意匹配字符串 `Sz`。如果你的表达式出现了你没有计划的匹配项，这可能就是原因。


    \ 用于隔开特殊字符。某些字符被 shell 使用，因此必须使用 `\` 字符进行转义。你可能想在可能是特殊字符的字符前面使用 `\`。在大多数情况下，如果你不确定，使用
    `\` 也没有坏。例如，shell 通常期望你在带有空格的字符串周围加上双引号 `"`——它使用双引号来对字符串中的单词进行分组。如果你需要在文件中搜索包含双引号的行，你不能直接用
    `grep` 搜索 `\"`，而应该使用以下命令：


    ```

    > grep "\"special stuff\"" sample.txt

    ```


    在双引号前面使用 `\` 告诉 shell 不要尝试将双引号作为普通的包围字符进行常规解析，而是将其传递给 `grep` 命令进行处理。


    ## 在正则表达式中使用和取反范围：[] 和 ^


    你可能已经注意到我一直使用的 `sample.txt` 文件包含几个日期。假设我只想匹配落在 1700–1800 年之间的年份。为了做到这一点，我可以使用范围，它在正则表达式中指定为
    `[<起始点>-<结束点>]`。起始点和结束点可以是数字，也可以是字母表中的范围。


    例如


    ```

    > grep "[1-7][0-9]*" sample.txt

    ```

    1800

    1750

    ```


    我的模式说明，任何有效匹配必须以 `1` 开头，后面跟着 7–8 范围内的数字，然后是一个或多个 0–9 范围内的数字。范围可以帮助你从文件中提取某些值。你可以通过应用取反操作符来扩展范围的功能。


    脱符号 (`^`) 如果在范围指定的开头，则会取反范围。取反范围会得到与范围匹配项相反的结果。


    例如


    ```

    > grep "1[^7-8][0-9]*" sample.txt

    ```


    ```

    (614) 555-0591

    (615) 555-0000

    1998

    1999

    ```


    注意我现在匹配任何 1700 或 1800。


    ## 匹配行的开始和结束：^ 和 $


    为了唯一匹配示例中的年份，我可以使用行的开始和结束字符。这些字符通常被称为锚点，因为它们将模式锚定在行的开始或结束。由于 1998 和 1999 都在行的开头，这应该是很容易的。


    - ^ 在范围之外，`^` 字符匹配行的开始。

    - $ ——匹配行的结束。如果你的模式位于行尾，你可以将其锚定在该位置。


    例如


    ```

    > grep "1[^7-8][0-9]*" sample.txt

    ```


    ```

    1998

    1999

    ```


    这样就一样了。只返回两个日期，因为它们位于行的开头。电话号码不再匹配，因为匹配的部分不在行的开头。


    ## 正则表达式的用途


    你刚刚学习的只是你可以生成的正则表达式的一个非常小的子集。正则表达式可以用于许多不同的应用程序。例如，流编辑器，从文本流中替换文本模式。对数千个文件进行全局正则表达式搜索和替换而不是逐个编辑是非常棒的。当你使用
    shell 时，也可以使用完整正则表达式库的子集来指定文件名。


    例如，如果你有一组命名为 test1, test2, test3, test4, test5 的文件，并且你想将文件 3 到 5 复制到新目录，可以使用这样的正则表达式：


    ```

    >cp test[3-5] newdirectory

    ```


    你需要查阅你正在运行的 shell 的帮助页，以确定它支持哪些正则表达式。其他其他使用正则表达式的东西也是如此。然而，尽管正则表达式本身是相当标准的，但单个应用程序对它们的支持程度完全取决于应用程序。例如，Perl
    是一个应用程序（反过来是一个完整的编程环境），它大量使用了正则表达式。


    随着世界维网的日益流行，需要快速可靠地处理用户提供的信息。遗憾的是，很难控制用户在表单或其他交互式 Web 文档上提交什么信息。如果你打算进行 Web 编程，你会发现正则表达式是救命星草，并被用于从表单中提取数据将其转换为可用格式。如果你觉得这听起来感兴趣，我强烈建议研究
    Perl 编程语言。


