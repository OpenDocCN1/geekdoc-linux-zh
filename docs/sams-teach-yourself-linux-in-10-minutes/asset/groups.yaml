    ## 第 18 节

    ## 访问网络资源


    在本节中，你将学习 Linux 的另一个优势——网络连接性。


    你对 Linux 系统的“旋风之旅”几乎即将结束，但对于探索和学习 Linux 提供的各种功能来说还远未结束。


    Linux 在网络方面表现出色；通过适当的配置，你可以将 Linux 机器遍布全球，无论你登录到哪台计算机，你的用户环境、文件和程序都会出现，就像在家里的一样。


    就像你的家庭环境可以轻松分发到分散的机器上为你工作一样，你也可以从家中的机器将工作负载分配到这些机器上。本节将为你介绍一些允许这种工作负载分配的程序。


    ## telnet


    telnet 是一个简单的终端程序。在主要用途中，它允许你在远程机器上开启登录会话。要使用 telnet 命令，请执行 `telnet <remote machine>`
    命令，其中 `<remote machine>` 是 IP 地址或主机名。你应该会看到登录和密码提示，就像你正坐在远程机器的控制台上一样。


    telnet 特别说明：在 telnet 的登录和密码提示处，可能会遇到退格（Backspace）和删除（Delete）键无法正常工作的情况。不要担心；这仅表明远程机器还不知道你使用的是哪种终端。如果问题持续到登录会话，请参阅第
    16 节“修改用户环境”中的 `stty` 部分。


    ## rlogin


    rlogin 命令与 telnet 命令非常相似，不同在于它尝试连接时携带了一些用户信息。如果你的账户在几台机器上都是有效的，这些机器可能被设置为允许你在它们之间连接，而无需逐一登录。尝试使用命令
    `rlogin <remote machine>`。如果你运气好，你将进入远程机器上的一个 shell。如果你运气不好，将看到一个登录提示符；从那里开始，rlogin
    的功能与 telnet 完全相同。


    ## slog


    slog 命令是一个远程终端程序，为数据流提供强加密。如果你的机器运行着安全外壳（secure-shell）服务器，强烈建议你使用此命令。rlogin 和
    telnet 命令都会将你的登录和密码信息以及你输入的任何内容以明文形式通过网络发送。拥有少量易于获取破解软件的恶意用户可以嗅探你的账户。（请不要称他们为黑客。黑客是动作迅速、粗犷且才华横溢的程序员——他们不破解东西；破解者（crackers）才会。）


    要确认安全外壳服务器正在运行，并设置登录命令（在使用之前需要大量的配置），建议你联系系统管理员。他或她将非常乐意告诉你登录命令或任何替代方案，并帮助你提高系统安全性。


    ## rn/trn


    rn 和 trn 命令用于读取 Usenet 新闻组。由于全球网的影响，Usenet 新闻组已略微退居，，曾被认为是互联网的集体记忆。尽管 Web 在可见性上已经超过了新闻组，但新闻组作为以主题为导向的聊天室并提供近实时的交互，使其成为非常有用的帮助和信息来源。你可以使用
    rn 或 trn 命令访问从技术到深奥等的信息。rn 和 trn 命令按名称执行，并在内部同时支持单键命令和后接 `<Return>` 的多字符命令。以下是你在
    rn 或 trn 中需要了解命令。


    - 列出新闻组——`l <topic><Return>` 将列出包含该主题的所有新闻组。将你的主题保持为单词的一部分——例如用于计算机主题的 `comp`——直到你熟悉新闻组的命名规范。

    - 进入新闻组——`g <newsgroup name><Return>`，然后按照说明操作。

    - 获取帮助——`h —no<Return>` 将在程序的几乎任何位置提供相当丰富的上下文相关帮助。


    trn 命令是 rn 的稍微复杂一点的版本，提供了按主题线选择文章的功能，如果可用，你可能会更倾向于使用它。任一版本都可以通过命令行开关和配置文件进行高级配置。


    > 我的 trn 运行了，但似乎不起作用？你可能没有配置 NNTP（新闻）服务器。请查阅第 16 节关于如何设置 `NNTSPSERVER` 环境变量的示例。


    ## ftp


    ftp 命令为你提供了一种从未设置与你共享文件系统的远程机器检索文件的方法。如果你的机器运行着 FTP 服务器，你可能还可以用它将文件提供给世界其他地方。就此咨询你的系统管理员。


    要使用 ftp 命令，输入命令 `ftp server`，其中 `server` 是运行 FTP 服务器的远程机器的 IP 地址或主机名。如果你连接正确，将收到用户名和密码的提示。


    某些 FTP 服务器允许你在没有系统账户的情况下连接。对于这些服务器，请使用用户名 `anonymous`，并将你的电子邮件地址作为密码。


    连接到 FTP 站点后，你将能够通过 `cd` 和 `ls` 进行导航。使用命令 `get <filename>` 允许你检索文件，而 `put <filename>`
    允许你从你的目录发送文件到远程系统。


    > 损坏你的数据：某些 FTP 服务器在连接后如果不使用 `binary` 命令，将会损坏数据。FTP 服务器实际上会尝试修复 Linux 和 PC 类型机器处理文件中换行符方式的差异，但它们只是在与另一个机器通信时进行修补。如果在下载后发现文件损坏，请再次尝试，但在
    `get` 命令之前执行 `binary` 命令。


    ## Windows 连接性：smclient, smbmount


    如果你习惯使用 ftp，并且恰好连接到 Windows 网络，你可能想要查看 `smclient`。smclient 允许你像连接 FTP 站点一样连接到
    Windows 共享。你可以使用相同的 `cd`、`ls` 和 `put` 命令。遗憾的是，你无法直接交互服务器上的文件。为了这一点，你需要使用 `smbmount`
    将 Windows 共享挂载为本地驱动器。


    ![](img/a0e613ea1c8603226127d28a7bd962_174_0.png)


    无论你的 Windows 需要什么，Linux 都准备好提供连接。


    ## Web 浏览器：NETSCAPE, LYNX 和 KDE


    你有多种浏览器可用于访问全球网。让我们来看看几个。


    ## NETSCAPE


    Netscape 是在大多数 Linux 平台上提供的图形界面 Web 浏览器。它的功能与你可能熟悉的 Macintosh 或 PC 版本非常相似——指向、点击、根据需要重复。如果它在你的系统中可用，你应该可以通过
    X Windows 终端输入 `netscape` 来启动 Netscape。


    ## LYNX


    Lynx 是一个文本 Web 浏览器，适用于你在文本窗口的情况；使用 `lynx <URL>` 启动，你将获得 URL 所指页面的文本表示。对于你可能认为极其有限的市场来说，Lynx
    是一个功能异常全的浏览器。市场实际上比你想象的要大。Lynx 启动和加载页面的速度比图形浏览器快得多。这使得当你需要快速检查某些网页而不需要图形或等待时，它是一个方便的替代方案。


    ## KDE


    KDE 环境中的每个文件管理器窗口也是一个功能完整的 Web 浏览器。与其启动像 Netscape 这样重量级的程序，你可以在任何文件管理器窗口顶部的 URL
    行输入目标 URL，你将会被快速带到相应的网站。


    '
