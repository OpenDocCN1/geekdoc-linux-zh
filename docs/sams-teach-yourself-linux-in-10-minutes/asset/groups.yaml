- md: '

    The line print command (lpr) is the primary method for sending data to the printer.
    lpr essentially dumps data directly to the printer you specify. To use lpr, follow
    these steps:


    - Determine the name of the printer you want to use. This was probably set by
    your system administrator.


    - Choose the file you want to print. For the moment, only choose a text file.
    I will discuss a few other formats shortly.


    - Send the print job using lpr -P<printer name> <filename> .... If there is only
    one printer configured on your computer, you can use lpr <filename> ...


    For example:

    `>lpr -PHOD samplefile.txt`


    The result of this command is that the samplefile.txt is sent to the printer named
    HOD. (In you''re interested, HOD is my office printer, named the Heart of Darkness.)
    Depending on the load of the printer, the print job should be processed shortly.


    ### Printing More than One Copy

    If you need to print multiple copies of a document, you don''t need to separate
    separate print jobs. Instead, you can specify the number of copies directly as
    an option to the lpr command. Follow lpr with -<number of copies> to print many
    copies of each file in the job.


    There are a few file formats and special print cases that might require special
    attention from the print command. This special attention comes in the form of
    filters that are applied to the file and convert the information into a format
    that your printer can handle.


    - PS—PostScript files. PostScript files should be handled automatically by the
    lpr command. You can print them as would print a plain text file.


    - DVI—TeX files. Files from TeX contain special page layout instructions. You
    can use the -d option with lpr in order to print these files correctly.


    - TR—Toff files. This is the standard file format for man pages. If you''d like
    to print out a page, you can use the -t option.


    Text files with really long lines—If you are having problems printing text files
    and having lines run off the end of the page, you can have the files reformatted
    on-the-fly so that they fit. To do this, use -p with lpr.


    ## CHECKING THE STATUS OF A PRINT JOB: lpq


    After you''ve sent a job to the printer, chances you''ll want to check if it is
    done printing—especially if it is a network printer located on another floor in
    your building...or in another building altogether! To check the status of a job,
    you''ll want to look at the queue for the printer that you submitted the job.
    You do this with the lpq -p<printer name> command. Once again, if there is only
    a single printer on your system, you can issue lpq by itself.


    For example:


    `>lpq -PHOD`


    | Rank | Owner | Job | Files | Total Size |

    | :--- | :--- | :--- | :--- | :--- |

    | 1st | agroves | 27 | test.txt | 19 bytes |

    | 2nd | jray | 28 | samplefile.txt | 10021 bytes |


    This example shows that there are currently two jobs in the printer queue for
    HOD. One is owned by agroves, and one is owned by jray. Each job is ranked, which
    shows the order in which it will print. The names of the files being printed are
    also shown, as well as the size and job ID number.


    ## CANCELING A PRINT JOB: lprm


    At times you might find that you sent a print request to the printer, but didn''t
    actually mean to—perhaps you sent a 3,000 page encyclopedia file instead of the
    three page report you intended. Whatever the case, the lprm command allows you
    to remove items from the printer queue.


    If you need to use lprm, follow these steps:


    1. Use the lprm command to find the job ID number that you want to remove.

    2. Invoke lprm with the syntax lprm -P<printer name> <job ID>.


    For example, if I want to remove my job (job #28) from the queue in the preceding
    example, I would type:


    `>lprm -PHOD 28`


    To verify the results, use lpq to check the queue again:


    | Rank | Owner | Job | Files | Total Size |

    | :--- | :--- | :--- | :--- | :--- |

    | 1st | agroves | | 27 | test.txt | 19 bytes |


    My job is no longer in the queue, and will not be printed! Don''t worry if you
    happen to accidentally enter in someone''s print job ID; you can only cancel your
    own jobs.


    ### Canceling Your Jobs

    If you would like to remove all the pending print jobs that you have sent, you
    can use the - character in place of the job ID. This cancels anything that you''ve
    sent to the printer.


    ## PRETTY PRINTING: enscript


    If you''d like to do some fancy printing, you can use the enscript-command to
    convert your text files into PostScript, and add some flashy features. For instance,
    if you''d like to print two pages of text on a single side of paper, enscript
    can format your document correctly. It can also print banner information with
    each page to help you identify which file has been printed and which page number
    you are looking at. If your Linux distribution does not include enscript, check
    with one of the hundreds of Linux software sites, and you''re sure to find a copy.
    An excellent starting point is http://www.linux.org.


    To use enscript in its most basic form, do the following:


    - Choose your printer.

    - Choose the file that you want to print.

    - Run enscript like this: `encript -d <printer name> <filename> <filename>` ...


    For example, use enscript to print my samplefile.txt file, I would do this:


    `>encript -d HOD samplefile.txt`

    [ 1 pages * 1 copy ] sent to printer`


    Unlike lpr, enscript gives a bit of feedback on what is happening. Here it tells
    me that I''ve sent one page to the printer, and have requested the default number
    of copies: one. The output of this command, in its basic form, will be very similar
    to lpr. It simply dumps the file to the printer. The difference, however, is in
    command-line options that you can add to enscript to change the appearance of
    your printout. Here are a few of the options you can use:


    - Page range—Use the option `<start page><end page>` to print a range of pages,
    rather than everything.

    - Pretty source code—If you''re a programmer, enscript can print your source in
    an attractive format using -E.

    - Fancy header—If you''d like to easily identify the file and page number the
    text belongs to, you can ask enscript to print a header using -G.

    - Landscape mode—Rather than printing across the short dimension of your page,
    the -r option will rotate the page 90 degrees and print in Landscape mode.

    - Multiple columns—To print two pages of text per page, use the -2 option.

    - Highlight bars—If you''re reading source code or spreadsheet-type data, you
    might find it difficult to follow a line across the page. Use the -H option to
    print light highlight bars across the page.

    - Multiple copies—Using a slightly different syntax than lpr, encrypt can print
    multiple copies using the -n <number of copies>.


    ## SUMMARY


    In this lesson, you learned the commands you need to print from the command line.
    If you''re using an application in a KDE environment, it is actually using the
    same commands you''ve seen to send information to the printer. The suite of lpr,
    lpq, and lprm commands make up the basis for printing from Linux and UNIX computers.
    enscript is the icing on the cake. Let''s review the highlights for this lesson:


    - lpr—The command is used to send a file to the printer. If the file is of a type
    other than plain text, it can be processed by filter to correctly format the information
    for your printer.


    - lpq—When a print request is sent to the printer, either from lpr or encrypt,
    it is added to the print queue. The lpq function to display all pending print
    transactions, their corresponding IDs, and their owners.


    - lprm—If you''d like to remove a job from the print queue, lprm will do the trick.
    You can use lprm to remove a single print job or all the jobs that you have pending
    at the printer.


    - enscript—encrypt is a useful utility for doing fancy printing on your printer.
    It allows multiple pages of text per page, pretty graphics headers, and a variety
    of other goodies.

