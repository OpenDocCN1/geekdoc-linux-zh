    # OTHER TEXT AND FILE UTILITIES


    Kama 05

    Kim 99

    Will 78


    Everything is sorted as you would expect. Now, what if, instead of wanting to
    sort by the name, you want to sort by the number? To do this, you''d need to follow
    these steps:


    - 1. Figure out what column you want to sort by; you''ll inform sort of your decision
    by using +k<columnnumber> as an argument to the command.

    - 2. You also need to tell what character is separating the columns using -t option.
    In this case it''s a few spaces, so use -t " ".

    - 3. Lastly, because there are a varying number of spaces between the name and
    number, you''ll need to use ignore blanks -b to tell sort to count a group of
    spaces as a single space.


    For example


    ```

    >sort +2 -t " -b kiwi.txt

    ```


    ```

    Kama 05

    Jack 07

    John 21

    Will 78

    Joan 92

    Kim 99

    ```


    Bingo! It''s exactly what you were hoping for, right? Now the file is sorted by
    the numbers in the second column. sort has many options that you can explore on
    your own with the man pages, but you should see how it can be used to sort a variety
    of data stored in different formats.


    # CHOPPING UP FILES: split


    Suppose you need to email a huge file to a friend, but or her email system doesn''t
    support receiving messages as you''d like. Time to write a special splitting utility?
    Nope; it''s already done for you. The split command can cut up a file into whatever
    length segments you''d like, based on the number of lines in a file or the bytes.
    To use split


    # LESSON 9


    - 1. Choose your input file. For this example, I’m using kiwi.txt from the sort
    command.

    - 2. Determine the number of lines you want stored in each output file. You''ll
    specify this with -l <number of lines> as an option to the sort command. If you
    prefer to use the number of K or MB, you can use the -b option with k or m. For
    example, -l 3 divides a file into segments of three lines each. Using -b 10k returns
    in segments 10K in size. Lastly, -b 10m creates 10MB segments.

    - 3. Choose a base output filename for the results.

    - 4. Invoke sort using the syntax split <segmentoptions> <inputfile> <outputfile>


    For example


    ```

    >split -l 3 kiwi.txt kiwisplit

    >more kiwisplit*

    ```


    ```

    ::::::::::::

    kiwisplitaa

    ::::::::::::

    Joan 92

    Will 78

    John 21

    ::::::::::::

    kiwisplitab

    ::::::::::::

    Kim 99

    Kama 05

    Jack 07

    ```


    The kiwi.txt file from the previous example has been run through split and divided
    into two files of three lines each: kiwisplitaa and kiwisplitab. I displayed the
    contents of the files using the more command, because split does not offer feedback
    on completion.


    After your files are split to a reasonable size, you can transmit them to the
    pesky mail server, or whatever else you’d like. This is just another example of
    a built-in utility that will undoubtedly come in handy when you least expect it.


    To reassemble the files, use the cat command like this: cat <filename>* > <fullfile>.
    This will take all the files with the base name filename and stick them back together
    in fullfile.


    > Working with Output Files It''s frequently best to call output files things
    such as complete.file—something completely different than the <basename>, then
    move them to their destination or final filename. This avoids potential confusion
    in those cases where you''d really like your final filename to be just <basename>.


    # DIFFERENCES AND PATCHES: diff patch


    Something that you might be accustomed to is creating documents and sending out
    revisions. Unfortunately, most of the time you probably have to send out entire
    copies of new files when only a few words here and have changed. In the Linux
    community, there is a great deal of information exchange, and source code is passed
    back and forth constantly. Rather than always sending complete files, people reply
    on the diff and patch commands to transfer only whatever information has changed
    between files.


    # Using diff


    The diff function takes two files, an original template file and an updated file,
    and produces an output file that contains enough information to reconstruct the
    updated file given only the patch file and the template file. Assume I have the
    original file templatefile.txt, which has the contents:


    Now is the time for all good kiwis to come to the aid of puppies.


    I''ve distributed this file amongst all my coworkers. (This is just an example
    folks!) However, a few days later, I updated my file to a new file called updatedfile.txt,
    which looks like this:


    Now is the time for all good and bad kiwis to come to the aid of puppies and children.


    Rather than redistribute the new file updatedfile.txt to everyone, I can make
    a patch that contains all the changes between the original and the new file. To
    do this, I use the diff command with the following syntax:

    diff <template file> <updated file> > <patch file>. The patch file can have any
    filename you''d like.


    > Redirecting Output The standalone > in this example is used to redirect output
    to a specific file, which you name. You''ll learn more about this in Lesson 12,
    "Input and Output."


    For example


    ```

    >diff templatefile.txt updatedfile.txt > patchfile.txt

    ```


    The program will run and return a command line with no messages. If you''re interested
    in seeing what the patch file contains, feel free to take a look at it with cat
    or more. In this example, the resulting patch file is named patchfile.txt—you
    should distribute it to everyone who has the original templatefile.txt and who
    needs to update it.


    > File Comparisons The diff command is also useful when you want to know if two
    copies of the same file are identical or not. If you find yourself with multiple
    copies of similar files, diff is a fast way to find out they are identical, and
    if not, what changes have been made between them. If diff produces output, there
    are no differences between the files.


    # USING patch


    Now, the patch program comes into play. You invoke patch by giving it

    name of the file to patch, followed by the name of the patch file.


    For example


    ```

    >patch templatefile.txt patchfile.txt

    ```


    patch file `templatefile.txt`


    That''s all there is to it. The file templatefile.txt has now been updated

    is identical to updatedfile.txt. You can verify this by viewing platefile.txt.


    ```

    >cat templatefile.txt

    ```


    Now is the time for all good and bad

    kiwis to come to the aid of

    puppies.


    Yep! Pretty nifty. If you looked at the patch file, you might have noticed

    that it is the same size as updatedfile.txt, so why not just distribute

    the entire file instead of the patch?


    > Important Reminder Always remember to keep

    copy of your template file. In this example, I applied

    t to my template file, and my template file

    has now been updated. If all further patches are cre-

    ated from the updated file, no problem; I''m ready to.


    # SUMMARY


    I hope you found this lesson interesting. The commands you''ve learned should
    show you a bit of the power that is built into the Linux operating system. You''ve
    probably seen utilities like this on other desktop systems, they''ve been add-ons
    or pieces of commercial software. In the case of Linux, it''s all free, and there''s
    a whole lot more where this stuff came from! Let''s review what is discussed in
    this lesson:


    - **wc**—The command can provide quick character, line, and word counts for a
    single file or group of files.

    - **sort**—Sort enables you to sort information sorted on separate lines within
    a text file. It understands the notion of columns and fields of data, so you can
    use it to sort data in a variety of different formats.

    - **split**—If you have files that are a bit too large to handle when sending
    email, writing to a floppy, and so on, you can use the split command to chop them
    up into smaller files. split can create files containing a certain number of lines,
    kilobytes, or megabytes.

    - **diff/patch**—The combination of diff and patch enables you to distribute updates
    to documents, source code, and so on, in an efficient manner. Rather than sending
    entire copies of updated files, you can use diff to create patch files that only
    contain the changes between one version of a file and the next.

