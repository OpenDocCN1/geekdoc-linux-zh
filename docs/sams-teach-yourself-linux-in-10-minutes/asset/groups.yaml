    `<basename>` 的情况下可能产生的混淆。


    # 差异与补丁：diff patch


    你可能习惯于创建文档并发送修订版本。遗憾的是，大多数时候，当只有这里几个单词发生了变化时，你可能必须发送新文件的副本。在 Linux 社区中，有大量的信息交换，源代码不断地来回。人们并不总是发送完整文件，而是依靠
    `diff` 和 `patch` 命令仅传输文件之间发生任何信息。


    # 使用 diff


    `diff` 函数接受两个文件，一个原始模板文件和一个更新后的文件，并生成一个输出文件，该文件包含足够的信息，仅需补丁文件和模板文件即可重建更新后的文件。假设我有原始文件
    `templatefile.txt`，其内容如下：


    Now is the time for all good kiwis to come to the aid of puppies.


    我已将此文件分给了我的所有同事。（这只是一个例子，朋友们！）然而几天后，我将我的文件更新为名为 `updatedfile.txt` 的新文件，如下所示：


    Now is the time for all good and bad kiwis to come to the aid of puppies and children.


    与其向所有人重新发布新文件 `updatedfile.txt`，我可以创建一个包含原始文件和新文件之间所有更改的补丁。要做到这一点，我使用带有以下语法的 `diff`
    命令：`diff <template file> <updated file> > <patch file>`。补丁文件可以是你喜欢的文件名。


    > 重定向输出 此示例中独立的 `>` 用于将输出重定向到特定的文件，由你命名该文件。你将在第 12 课“输入与输出”中学习更多内容。


    例如


    ```

    >diff templatefile.txt updatedfile.txt > patchfile.txt

    ```


    `diff` 会产生输出，如果你对补丁包含的内容感兴趣，可以使用 `cat` 查看。`diff` 也适用于你想知道两个文件是否相同的时候。


    # 使用 patch


    现在，`patch` 程序派上用场。你通过提供要补丁的文件，后面跟上补丁文件名来调用它。


    例如


    ```

    >patch templatefile.txt patchfile.txt

    ```


    这就是全部。如果你查看了补丁文件，可能会发现它和 `updatedfile.txt` 大小相同，你可以通过 `cat` 来验证这一点。


    ```

    >cat templatefile.txt

    ```


    > 重要提醒 始终保留你的模板文件的副本。在本例中，我对模板文件应用了补丁，我的模板文件现在已经更新。如果后续的补丁都是从更新文件创建的，没问题；我准备好了。


    # 总结


    希望你觉得本课程有趣。你学到的命令向你展示了 Linux 操作系统内置部分的强大。你可能在其他桌面系统上见过这类工具，它们是插件或商业软件的一部分。在 Linux
    的情况下，它们都是免费的，而且这里还有很多内容！让我们回顾一下本课讨论的内容：


    - **wc**——该命令可以为单个文件或一组文件提供快速字符、行和单词计数。

    - **sort**——`sort` 允许你对文本文件中单独行的信息进行排序。它理解列和字段的概念，因此可以使用它来排序不同格式的数据。

    - **split**——如果你有的文件在发送邮件、写入软盘等时大到无法处理，可以使用 `split` 命令将它们切分成较小文件。`split` 可以创建包含特定行数、千字节或兆字节的文件。

    - **diff/patch**——`diff` 和 `patch` 的组合允许你以高效的方式分发文档、源代码等的更新。与其发送更新文件的完整副本，可以使用
    `diff` 创建补丁文件，仅包含文件一个版本到下一个版本之间的更改。


    '
