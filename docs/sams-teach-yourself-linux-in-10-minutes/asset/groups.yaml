  - '[PAGE 182]


    +   - The first column identifies the owner, group, and world permissions that
    are active for a file or directory. The first character will be a d if the file
    type is a directory. Normally this will be an -hen for a normal file. The remainder
    of the characters, as you might guess, stand for read, write, and execute (x).
    The first three characters (following the initial - or d character) are the active
    owner permissions, the second three characters are the group permissions, and
    the last are world permissions.


    +   - The third column is the file owner.


    +   - The fourth column is the group owner.


    In this example, the kiwi.tar file has read/write permissions for the owner, and
    read permissions active for the group and world. The owner of the file is jray
    and the group file belongs to test. The second file, magicalbeans.gz, has only
    read/write permissions for the owner, who is jray. The group that magical-beans.gz
    belongs to test, which has no permissions to operate on the file. The last file,
    kyit is actually a directory. The owner of kyit is jray, and the corresponding
    group is test. The owner and group both have full read, write, and execute permissions
    for this directory, whereas the world has read and execute.


    # CHANGING PERMISSIONS: chmod


    Now that you know what permissions are, you''d probably like to know how to change
    them! This is accomplished with the chmod command. There are two modes of operation
    that you can use with chmod: a quick-and-dirty mode and a more user-friendly method
    of setting permissions.


    The symbolic user-friendly mode uses easy-to-remember commands to set or unset
    permissions. To use this, do the following:


    +   - Pick a permission level. If you want to set permissions for the owner, this
    will be u. If you''d like to change permissions for the group, it is g. For world
