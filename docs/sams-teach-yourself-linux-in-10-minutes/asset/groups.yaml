    ## CHANGING DIRECTORIES: cd


    Now that you know how to find out where you are, and what’s around you, it’s time
    to wander a bit. To move from one directory to another use the Linux command cd.
    If you want to move from wherever you are currently to another directory


    - 1. Determine where you currently are (use the pwd command if you don’t already
    know).

    - 2. Pick a directory /you would like to go to (/usr/local for this example).

    - 3. Issue the cd command as cd <directory name>


    For example


    ```

    > pwd

    /home/ray/public_html

    > cd /usr/local

    > pwd

    /usr/local

    ```


    The final pwd shows /usr/local as the current directory, which is exactly what
    you wanted.


    ## pushd AND popd


    An even more powerful way of changing between directories is to make use of the
    directory stack.


    ![](img/a0e6136ea1c86032b26127d28a7bd962_56_0.png)


    > Stack In computer-speak, a stack is a type of data storage that works for data
    like a stack of dishes. With the dish stack, dishes can only be added to the pile
    or taken off the pile from the top, and the most recently added plate is the first
    to be removed. Data storage stacks work in exactly the same way. Data is pushed
    onto the stack, burying previous data, and popped off of the stack uncovering
    previous data.


    If you are currently in one directory and would like to change temporarily to
    another, there is an easy way to do it with two cd commands. By making use of
    the pushd command, you can place the current directory on the directory stack
    and change your current directory to the new directory. When you are ready to
    return to your previous directory, use popd to get your old directory back.


    If you would like to change from your current directory to another, and return
    automatically, make use of the pushd and popd commands as follows.


    - 1. Decide where you want to go.

    - 2. Issue the pushd command as pushd <directoryname>

    - 3. You will now be in your new directory and can work here for as long as you
    like. Your previous directory is waiting for you on the stack.

    - 4. When you are finished and want to return to your previous directory, issue
    the popd command as popd.


    For example


    ```

    > pwd

    /usr/local

    > pushd /var/log

    /var/log /usr/local

    > pwd

    /var/log

    ```


    ...now you can work here as long as you like.


    ```

    > popd

    /usr/local

    > pwd

    /usr/local

    ```


    You now know almost everything about navigating the Linux file system, but before
    going on to other topics there''s one additional variation that you should be
    aware of.


    ## ABSOLUTE AND RELATIVE PATHS


    Up to this point, all paths you have been working with have been absolute paths—that
    is, paths starting with the root directory and ending in a file or directory name.
    In real life you would quickly find this annoying, and Linux provides the concept
    of a relative path as well. Relative paths are relative to the current directory.
    For example, if you are in /usr/local, you can access a file in /var/log by typing
    ../log/filename. If you want to go to the root directory, you can type cd /..

