    并将它们打包成单个 tar 文件，你可以将其存储以备将来使用，或通过万维网、FTP 或电子邮件方便地分发。解压压缩包时，你为 tar 提供 tar 文件的文件名，它会将文件内容提取到当前目录中，并保留与打包时系统上完全相同的文件名、路径和内容。


    使用 tar 创建归档


    - 1. 确定你想要归档 tar 文件设置的名称——通常它应该具有 TAR 后缀。

    - 2. 确定你想包含在 tar 文件中的所有文件的文件名，或者更常见的是，确定你想要归档内容的目录名称。

    - 3. 执行 tar 命令，格式为 `tar -cvf <filename.tar> <files or directories>`。


    例如，如果你在当前目录下有一个名为 `lots-a-stuff` 的目录，你可以通过输入以下命令归档 `lots-a-stuff` 的所有内容（所有文件、所有目录以及所有目录中的所有文件等）：


    ```

    > tar -cvf lotsastuff.tar lots-a-stuff

    ```


    你的机器将做出响应（因为你提供了 `-v` 详细选项），告诉它正在放入归档的每一个文件，最后你将得到名为 `lotsastuff.tar` 的新文件。这个新文件将包含你
    `lots-a-stuff` 目录的所有内容，以及所有的目录结构和文件属性。


    要解压 tar 文件，执行命令 `tar -xvf <filename.tar>`。


    如果你将此文件交给朋友，你的朋友可以通过输入以下命令解压 tar 文件：


    ```

    > tar -xvf lotsastuff.tar

    ```


    在列出文件中所有内容（再次使用 `-v` 选项）后，你的朋友将在当前目录下拥有一个名为 `lots-a-stuff` 的新目录，它包含你 `lots-a-stuff`
    目录的完整内容。`lots-a-stuff` 目录中的任何子目录及其所有内容都会存在。


    ## 压缩与归档工具


    ### 礼貌使用 tar

    如果你不知道 tar 文件的内容，在解压之前使用 `tar -tvf tarfile.tar` 是一个好主意。`-t` 选项是显示（tell）选项，它要求
    tar 告诉你文件的内容而不是解压它。这是一种非常有用的方法，可以判断创建 tar 文件的人是否是一个礼貌的人（将所有内容放入一个目录然后对该目录进行打包），还是一个不礼貌的人（在打包之前没有将所有内容放在当前目录）；如果你遇到一个由不礼貌用户创建的
    tar 文件，并且错误地在不方便的地方（例如你的家目录）进行解压——tar 最终会将文件散落在你的整个家目录中。你将不得不手动找到所有文件并将它们放入子目录中，这有时是一个非常无味的过程。做一个礼貌的用户——不要打包文件；要打包目录。


