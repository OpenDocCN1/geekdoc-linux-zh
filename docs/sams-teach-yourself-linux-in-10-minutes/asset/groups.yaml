    -   Linux is case-sensitive—Pay careful attention to case, especially if you''re
    transferring files between a Linux machine and a personal computer.


    -   Linux files have attributes of readability, writeability, and executeability—You
    can set the attributes of a file that you want so that you cannot execute it,
    write it, and read it, but you do not want to do this.


    -   The pwd command tells you where you are.


    -   The ls command tells you what files are in a directory.


    -   The cd command takes you places.


    -   The pushd command remembers where you were, and the popd command takes you
    back again.


    -   Use relative paths when you can—If the directory is near your current directory,
    it’s much more convenient to use a relative path from your current directory than
    to use the absolute path from /.


    -   Remember that all these features and commands work together—Linux is about
    combining many small programs and features that do small parts of the job you
    need done into a convenient tool that performs precisely as you want it to.


    -   Desktop environments can make your life easier—They automate some of the routine
    day-to-day tasks and provide a friendly face for some of the more difficult ones.
    If your system doesn''t have KDE, don''t fret; chances are that KDE can be installed
    on it (if you''re nice enough to your system administrator), or it already comes
    with a nice desktop environment with comparable capabilities.


    ## LESSON 5


    ## FINDING FILES


    In this lesson you will learn to use some of the built-in Linux search tools to
    locate files.


    In Lesson 4, “The File System,” you learned how to list the files in directories
    and navigate from directory to directory. You probably also notice that there
    are a lot of files included in a standard Linux distribution. You’re certain to
    run into the situation where you know the name of a file you want to, but have
    no idea where its located. Rather than using the cd and ls commands to navigate
    your way through the entire file system, you can use some of Linux’s search utilities
    to help locate what you need.


    ### FINDING FILES


    In order to locate a file, you need to know something about it: a portion of its
    name, when it was created, or perhaps its size. Armed with these pieces of information,
    you can dispatch the find command and let it scour the file system looking for
    matches to your query.


    ### FINDING A FILE BY NAME


    The most common type of search is by file name. You’ve probably used a find command
    on other operating systems that works similarly. You supply the filename or portion
    of the file to be found, and the system returns a list of matches. To search for
    a file name, do the following:


    1. Determine the name of the file you want to search for. If you want to, you
    can include wildcards in the search for the filename.


    2. Choose a starting directory for the search. If you want to search the entire
    file system, the starting directory should be /.


    3. Invoke the find command as: `find <starting directory> -name <filename>`


    4. Depending on the speed and size of the file system you’re searching, be prepared
    to wait a while!


    Search Errors If you''re searching the entire file system, you''re likely to encounter
    errors such as:


    ```bash

    find: /home/ftp/bin: Permission denied

    find: /home/ftp/etc: Permission denied

    ```


    This is entirely normal, and shouldn''t be cause for alarm. The system is telling
    you that you''re trying to confine search files that are not yours. If you confine
    the search to your directory, which can be represented as ~, you will not see
    any of these errors.


    For example


    ```bash

    >find / -name sound

    /usr/src/linux-2.0.34/drivers/sound

    /usr/src/linux-2.0.35/drivers/sound

    /var/lock/subsystems/sound

    /etc/rc.d/init.d/sound

    ```


    The system has responded to my request by finding four different files named sound.
    Because I chose to search the entire file system, the search took over a minute;
    there are hundreds of directories and thousands of filenames that were just processed.


    ### FINDING A FILE BY DATE


    Imagine you just created a document file on the system but you can''t remember
    its name. How in the world can you find it? One possible solution is to search
    by time, finding files that are younger than a certain time. To search for a file
    by its creation date:


    1. Determine the relative age of your file in days.


    2. Choose a starting directory for the search. Remember, / searches the entire
    file system, while ~/ searches just personal directory.


    3. Invoke find using the -ctime option: `find <starting directory> -ctime <days
    old>`


    For example


    ```bash

    >find / - -ctime 2

    /home/jray/getip.c

    /home/jray/a.out

    /home/jray/getip2.c

    /home/jray/.saves-8395-postoffice

    ```


    Here, I searched my home directory for files that have been modified in the last
    two days (48 hours). Hopefully one of these four files is the one that I was trying
    to find.


    ### FIND A FILE BY SIZE


    The advantage of finding a file by size might not be immediately obvious until
    your system begins to run out of room. Linux and other UNIX-based operating systems
    often save a file called core when a program crashes. This is referred to as a
    core dump. The core file contains all the information in memory when the program
    crashed and can be used by the programmers to debug what went wrong. Usually they
    can be erased unless you''d like to try debugging the program yourself. The problem
    with these files is that they need to get written in directories that you might
    not be aware of, and silently consume drive space without you even knowing. Of
    course, you can search for large files that might have been created by some other
    process, but finding core files is one of the primary uses for this variation
    of find. To search by size:


    1. Choose a target file size to search for. Find files that are greater or equal
    to the size you choose.


    2. Choose a starting directory.


    3. Start the Find program using the -size option: `find <starting directory> -size<size>`


    For example


    ```bash

    >find / -size 1024k

    /home/jray/bochs/bochs-9805

    /home/jray/bochs/bochs-9806

    ```


    The system has returned two files: /home/jray/bochs/bochs-9805 and /home/jray/bochs/bochs-9806.
    These are files larger than 1024k.


    The system has responded to my request by finding four different files named sound.
    Because I chose to search the entire file system, the search took over a minute;
    there are hundreds of directories and thousands of filenames that were just processed.

