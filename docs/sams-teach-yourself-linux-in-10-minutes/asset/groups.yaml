    你的机器将通过定义变量 `test`，然后为你提供的每个文件运行 `tar` 命令。在 `foreach` 命令循环内部，你会注意到使用了表达式 `$test`。`foreach`
    会遍历你提供的文件名列表，并将每个文件名按顺序放入 `test` 变量中。若要在 shell 中使用变量的内容，在它前面加上 `$` 符号。例如，`foreach`
    首先将 `mydirectory` 放入 `test` 变量。然后它运行 `tar` 命令，shell 将 `test` 变量扩展为 `mydirectory`。实际执行的
    `tar` 命令看起来像：`tar -cvf mydirectory.tar mydirectory`。下一次 `foreach` 循环将 `yourdirectory`
    放入变量 `test`，重复该过程。


    你可以在 shell 中使用正则表达式，而不是使用 `foreach` 命令列出文件名。如果你在之前的例子中发现，你想要 tar 的所有目录实际上都有共同的名称——在本例中是
    `directory`。如果你想在不需要向 `foreach` 列出所有目录名称的情况下产生相同的结果，可以以 `foreach test (*directory)`
    的发布 `foreach` 命令。你可以使用在第 13 节“正则表达式”中学习过的匹配工具来匹配你想要的任何文件名集合。


    # 重命名多个文件


    你可能已经注意到 `mv` 命令无法完成某些非常方便的操作，例如用新名称而不是新位置来重命名多个文件——这是 `foreach` 的一个理想用场景。


    例如，假设你有一堆用于宠物项目的文件，它们的名称诸如 `brokenjunk.start`、`brokenjunk.today`、`brokenjunk.gif`
    等。你其其来的老板决定这很重要，你必须把这些文件交给开发部门，因为他们接下来要演示你的项目。这种情况永远不会发生在你身上，对吧？如果真的发生了，你可能想将你的文件重命名为稍微专业一点的内容。与其一个一个地重命名文件，你可以使用
    `foreach` 命令为你自动完成这项任务。在这种情况下，你输入：


    ```

    > foreach test (brokenjunk.*)

    > ? mv $test importantstuff.$test:e

    > ? end

    ```


    这部分你可能无法立即理解 `$test:e` 部分。它的意思是“扩展 `$test` 变量，并丢弃文件名中最后一个点之后的所有内容”——在这种情况下，就是使文件不同的部分（`start`、`today`
    等）。


    当然，对于三个文件来说这不是非常实用的命令，但如果你有一个包含数百个文件的项目，它可以为你节省大量的大量的打字时间。


    # 修改并替换原始文件


    可以使用 `foreach` 命令的另一个实用技巧是当你需要对许多文件中的每一个应用处理，并且你想在不创建新文件的情况下进行操作。


    假设你有一组图像文件，每个文件都有你想要裁剪掉边框，然后你想将它们缩小到较小的尺寸。如果假设的 `crop` 命令从 STDIN 接收文件并将数据写入 STDOUT，你可以像如下所示使用
    `foreach` 命令：


    ```

    > > foreach test (*.gif)

    crop < $test > holding

    mv holding $test

    ? end

    ```


    为什么不直接用 `crop $test > $test` 呢？因为你无法保证在读取文件时仍能对其进行写入——所以我们将结果存储在一个名为 `holding`
    的临时文件中。紧接着使用 `mv` 命令将临时文件移动回原始文件名。


    # 稍后执行：sleep


    一个停留一段时间的命令的用处可能并不显而易见，但你将在下一个示例中使用它。如果你确实遇到需要 shell 脚本暂停一段时间的情况，你可以使用 `sleep`
    命令。以 `sleep <seconds>` 发布 `sleep` 命令，shell 将停止直到指定的秒数过去；然后它将恢复执行之前正在做的任何操作。


    # 条件执行：while AND if


    如果你想在自动化的控制上变得更复杂，可以转向条件语句，只有在某些条件适用时才激活脚本的某些部分。


    要使用条件语句，你需要为语句创建一个测试条件。这个条件可以像你希望的那样复杂，但目前你应该坚持诸如“等于”之类的简单内容。


    # 使用 while


    `while` 命令语法为 `while (<condition>)`，在特定情况持续时执行操作。


    考虑这种情况：你感到非常孤独并想收到一些邮件。当你执行 `mail` 时，它告诉你的没有邮件。真是糟糕。所以，为了活跃你的心情，你写了一个可以发送邮件的小脚本。如果你真的想这样做，可以通过输入如下脚本：


    ```

    - set hopeful=`/mail` -cv No

    - while ($hopeful==0)

    ? echo "please send me" | mail myfriend@somewhere.com

    ? echo "please send me" | mailanotherfriend@elsewhere.com

    ? sleep 60

    ? set hopeful=`/mail` -cv No

    ? end

    ```


    这个愚的脚本使用 grep 统计不包含 No 的行，并将结果赋值给 hopeful。因为你没有邮件，mail 给你的唯一回复是 No（当然，假设你如此不幸以至于朋友回复“不，我们不回；走开！”）。如果存在包含
    No 的行，hopeful 不等于零，while 将终止。如果 hopeful 仍然为零，你朋友的邮箱很快就会满。


    # 使用 if


    该命令的工作方式与 `while` 命令非常相似，只是它不循环；它根据条件执行一个命令。`if` 的语法是 `if <condition> > <command>`。


    使用另一个愚的例子，如果你对没有邮件的事感到恼怒，并且讨厌看到 No 回复，你可以使用 shell 脚本来解决。你可以尝试创建一个名为 `checkmail`
    的 shell 脚本，内容如下：


    ```

    #!/bin/sh

    set foo=$(/bin/mail | grep -cv No)

    if ($foo -ne 0) echo "You poor guy"

    ```


    再次，它将使用 /bin/mail 来检查你是否有邮件，如果你没有邮件，你的电脑将同情你。


    # 总结


    Shell 脚本允许你添加功能并自定义你的环境。你可以选择创建复杂的程序，也可以仅仅是自动化你的日常重复性任务。让我们回顾本节的关键要点：


    - 你的 shell 脚本可以存储在文件中，允许你通过输入一个命令来执行许多命令。

    - 有许多不同的 shell——你的工作方式可能与呈现的不同，但可能具有类似的功能。如果没有，去换一个更好的 shell！你在本节中学习的内容适用于 csh，这是一种非常常用的用于编程脚本的
    shell。`foreach` 命令允许你对一组文件重复一组命令


