    in seeing what the patch file contains, feel free to take a look at it with cat
    or more. In this example, the resulting patch file is named patchfile.txt—you
    should distribute it to everyone who has the original templatefile.txt and who
    needs to update it.


    > File Comparisons The diff command is also useful when you want to know if two
    copies of the same file are identical or not. If you find yourself with multiple
    copies of similar files, diff is a fast way to find out they are identical, and
    if not, what changes have been made between them. If diff produces output, there
