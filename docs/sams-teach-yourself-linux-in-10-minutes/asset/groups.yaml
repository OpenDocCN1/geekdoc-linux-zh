    - **第 2 行**——设置一个关于窗口管理器处理 xbiff 的选项。它明确告诉系统，当 xbiff 需要通知你时如果它处于其他窗口后面，不要将其置于最前面。（记住，X11
    提供显示，而一个独立的程序提供窗口控制等功能的管理。）

    - **第 3 行**——告诉 xbiff 去哪里寻找它应该查看的邮箱。


    由于每个客户端支持的选项不同且允许窗口管理器进行不同程度的控制，你需要查阅每个客户端的文档来了解你可以配置什么以及你需要执行哪些操作。


    除了服务器资源数据库外，客户端通常具有可以控制客户端与 X11 交互的命令行。使用以下命令启动 xterm：


    ```

    > xterm -fg "black" -bg "white" -fn 6x10 -geometry 85x30+525+1

    ```


    在启动 xterm 的同时，此命令还将前景颜色设置为黑色，背景颜色设置为白色（在白色窗口上显示黑色文字），并告诉系统使用 6x10 点字体。它还设置了几何信息，即窗口宽
    85 个字符，高 30 个字符，并放置在屏幕左边缘 525 像素处，距离顶部 1 像素处。


    再次，不同的程序具有不同的可用选项，你的本地文档是获取你确切配置最新信息的最佳来源。


    # 窗口管理器


    由于 Windows 只提供了基础的用户界面组件功能，因此需要额外的程序来提供实用的用户界面。这个程序就是窗口管理器。根据你运行的 Linux 发行版，你可能有多个不同的窗口管理器可选。每个管理器提供略有不同的功能以及相应的优缺点。


    # twm


    最常见且功能最少的窗口管理器之一是 twm。图 3.1 显示了 twm 管理显示，提供了非常基本的窗口管理功能。遗憾的是，它几乎在所有的 Linux 实现中存在或可用。如果你在具有不同版本
    Linux 或 UNIX 的多平台环境中工作，你可能会发现 twm 非常方便，因为你的配置在所有机器上都是相同的。由于其简单性，twm 还提供了所有窗口管理器中用户扩展性最强的界面之一。如果你愿意，可以创建自己的标准按钮，这些按钮出现在窗口标题栏中并执行任意命令。你可以构建自己的弹出菜单、在光标进入窗口时自动执行命令、根据应用程序名称和类型自定义窗口管理器的颜色和动作，并进行许多其他自定义操作。要启动
    twm 窗口管理器，在启动 X 后执行 `twm`（你应该能够在你的 `.xinitrc` 中自动完成此操作）。所有这些自定义控制控制名为 `.twrc`，应位于你的主目录下。


    # 图标化活动应用程序


    # twm 标题栏


    ![](img/a0e6136ea1c86032b26127d28a7bd962_41_0.png)


    图标化/缩放按钮


    用户自定义按钮


    **图 3.1** twm 管理一个 X Windows 会话。


    如图 3.1 所示，twm 允许你同时打开多个窗口。在窗口分层期间，窗口可能会相互部分覆盖，你可以将输入焦点置于隐藏窗口，从而允许你在任何打开的窗口中工作。已图标化的活动应用程序可以点击后再次展开以恢复到正常大小。


    # 其他窗口管理器


    你可能会遇到的其他窗口管理器包括：


    - **mwm**——Motif 窗口管理器。许多商业窗口管理器基于 mwm，或正非常努力模拟 mwm。

    - **4dwm**——运行 IRIX 的 SGI 默认窗口管理器。


    # 图形用户界面 31


    - **tvtwm**——twm 的实验性扩展，包含设置虚拟屏幕的能力。

    - **afterstep**——一种流行的 Linux 窗口管理器，模拟 Next 操作系统的视觉效果和感受。

    - **fwm95**——没有人能真正确定这个 f 代表什么，但这个窗口管理器看起来与 Windows 95/98/NT 几乎相同。


    还有许多其他窗口管理器，你的机器上很可能会有多种供你选择。在研究了你的选项后，你可以开始构建一个符合你预期的感觉和行为的自定义环境。


    记住，窗口管理器提供了标题栏等用户界面功能。如果你发现自己面对一个看起来像图 3.2 的屏幕，那是因为没有运行窗口管理器（在启动 X 后运行 twm，或者它崩溃了）。你可以尝试启动（检查启动文件）。


    ![](img/a0e6136ea1c86032b26127d28a7bd962_42_0.png)


    图 3.2 丢失了窗口管理器。


    # 桌面环境


    历史上，窗口管理器仅用于管理屏幕。然而，一种新型应用程序正在出现，它不仅作为经典意义上的窗口管理器，还为用户提供额外的功能。这些桌面环境通常包括文件和目录的图标、使用图标启动应用程序的能力，以及用于计算机管理和配置的集成图形工具集。


    随着 Linux 厂商试图让他们的机器更易用，你可以预期这些桌面环境变得变得复杂，而且今天其功能强大程度已接近流行的个人电脑界面。


    虽然 Sun 和 SGI 等行业巨头带来了 OpenWindows 和 IRIX 桌面等重大产品，但最重贡献来自一个开发免费软件 KDE 的非营利协作努力。KDE
    是一种免费且可下载的桌面环境，兼容广泛的 Linux 发行版。


    # KDE


    KDE 代表 K Desktop Environment，根据作者说法，K 代表任何内容。KDE 仍在开发，在过去的两年中已发展成为 Linux 用户非常灵活且吸引人的环境。某些
    Linux 发行版（如 Caldera 的 OpenLinux）包含了 KDE。


    > 根据 KDE FAQ，KDE 目前支持 Linux、Solaris、FreeBSD、IRIX 和 HP-UX，并预计兼容任何使用 gnu gcc 编译器的系统。


