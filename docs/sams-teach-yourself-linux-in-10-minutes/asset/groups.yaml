    # LESSON 3


    # THE GRAPHICAL

    USER INTERFACE


    In this lesson you will learn the basics of the X Windows GUI, along with enough
    information to get you started on configuring and customizing your environment.


    While Linux can be accessed via a command-line interface from the console, there
    is an easier way. On top of the command-line interface, a variety of graphical
    user interfaces (GUIs) are available. A few of these GUIs are proprietary, but
    the majority conform to an open-standard interface called the X Window System,
    or X Windows. Some manufacturers have extended the X Windows standard with proprietary
    enhancements, which can cause parts of the interface to be incompatible with remote
    display on other Linux, and UNIX systems. However, the general principles are
    similar, and a familiarity with one interface translates well to the others. If
    you can learn X Windows under Linux, you should have no problem applying that
    knowledge to commercial UNIX systems.


    # X WINDOWS BASICS


    Unlike the Macintosh and MS-Windows environments, X Windows is a system that provides
    a set of interface display functions. Linux provides a free distribution of X
    Windows called XFree86. Currently it supports the latest X Windows revision, 6.2,
    and just about any video card that is available for the Intel platform.'
