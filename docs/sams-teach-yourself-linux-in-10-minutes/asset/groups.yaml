    # SUMMARY


    Linux has tons of built-in utilities. In this lesson, you learned about several
    of the programs that modify information related to your account profile, as well
    as a few utilities to monitor the state of your computer and who is currently
    using it. Take a look at what else is discussed in this lesson:


    +   - passwd/yppwd—The passwd command changes your account password. If you''re
    in an environment with networked Linux computers, you may have to use the yppwd
    command instead.


    +   - chsh—Use the shell command to change your current shell. If you don''t know
    which shell you want to switch to, you can use chsh -1 to list the available shells
    on your system.


    +   - finger—This command looks up personal information about an account on your
    computer or a remote computer. finger is sometimes disabled for security reasons,
    so you may not be able to use finger to get the results you expect.


    +   - chfn—Change information using this command. This lets you change your full
    name, as well as the office address and office/home phone numbers in your account
    profile.


    +   - date—Simple enough, date displays the current day and time on your computer.


    +   - uptime—The uptime command provides a summary of information about the state
    of your operating system, including the length of time it has online, the number
    of users logged on, and the average load on your system for the past 15 minutes.


    +   - who—lets you see all the users who are logged in to your computer, the date
    that they connected, and what network address they are connected from. If your
    machine seems slow, you might want to use who to find out where the processor
    is going.


    +   - Other utilities—There are far too many utilities on the system to cover
    them all in this book. Luckily, the man pages provide extensive documentation
    for most programs on the system. In addition, KDE has its own comprehensive documentation
    system.'
