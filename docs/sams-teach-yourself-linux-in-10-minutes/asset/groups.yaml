    # 总结


    在本节中，你了解了一些你不应该做或不能做的事情，理解你为什么不应该和不能做这些事，将使你与系统管理员的互动变得更加轻松。系统管理员的工作非常辛苦；他们必须在保持系统对所有用户正常运行（这有时要求他们表现得强硬且不灵活）与为个人用户创建工作所需的环境之间取得微妙的平衡。大多数人确实是希望系统能尽可能完美地为你运行，但许多人没有足够的时间来保持耐心。希望通过了解哪些会让你的系统管理员的生活变得更困难的事，以及为什么你不应该做这些事，能让你一直获得管理员的好感。现在，让我们回顾一下本节的其他一些要点：


    -   如果机器看起来正在运行 root shell（根用户终端），千万不要碰它。

    -


    除非显然没人知道某个硬盘未挂载，否则不要打扰 root（你的系统管理员）未挂载驱动器。

    -   未经管理员许可，绝不要关闭你机器的电源。

    -   root（管理用户）可以为你更改文件的所有权，但你应该考虑这是否真的必要，或者使用副本是否即可。


    ## 附录 A

    选择你的 Linux 发行版


    在安装 Linux 并开始使用之前，你必须做一个可能有点困惑的选择：你应该使用哪种 Linux 发行版？如果你在互联网上搜索 Linux 发行版，你会发现关于
    Red Hat、Caldera、Debian 以及许多其他版本的引用。随着 Linux 在用户和开发者中日益的普及，这个列表在未来几个月和几年内无疑继续增长。


    如果你没有 Linux 经验，选择一个适合你的版本注将是困难的。幸运的是，大多数发行版可以在 CD-ROM 上免费获得或以极低成本获得，因此你有机会在不花费数千美元的情况下测试几个。大多数人发现一个发行版后就会忠之不渝地用下去。其他人则会使用多个发行版的碎片拼凑出一个混合系统。这是你的操作系统；它由你做决定。


    > **什么是 Linux 发行版？** Linux 发行版仅仅是 Linux 操作系统的某种封装。就像汽车经销商在基础车型上添加可选配置一样，创建不同 Linux
    发行版的人也会向他们的版本中添加功能以使其具有吸引力。


    ## 选择你的 Linux 发行版


    ### 需要考虑的关键点




    版本——该发行版是否包含了最新的稳定 Linux 内核版本？（截至本文写作，2.0.36 是当前最新的发行内核，2.2.0 已指在眉角。）内核包含了 Linux
    运行所需的基本指令。低级系统问题，例如易受 TCP/IP 网络攻击的风险，通常是内核级的问题。新版本的内核会随着时间的推移而发布，以修复发现的任何问题。如果你选择了一个没有更新的发行版，你可能会发现自己需要手动升级内核——这对新用户来说可能是一项棘手的任务。


    升级简易性——在过去，升级 Linux 是检查是否有软件新版本、下载它、编译并安装的过程。这导致过时的文件留留在系统的隐藏目录中、丢失配置文件，并且总的来说就是令人头疼的问题。许多
    Linux 发行版现在都包含了分析你的系统并确定哪些文件需要升级的功能，然后自动执行升级。这让你保持最新的补丁和工具更新，并减少了你必须花在管理机器上的时间。


    包含的功能——在任何 Linux 发行版的底端，你都会找到预期的所有标准工具和精选。事实上，在大多数情况下，如果某个东西没有包含在内，没有理由你不在互联网上找到它，然后将其安装到你的系统中。然而，如果你正在处理数百台机器，这可能会非常不便。选择一个拥有最多吸引你的功能的发行版。你以后可以添加需要的内容，但最好从一个坚实的基础开始。


    支持——对许多人来说，这可能是最需要考虑的事情。如果你购买了全功能的 Linux 发行版，你会获得该软件的支持吗？从单一联系点获取技术信息和帮助的能力对于企业和个人来说都非常重要。与其选择一个让你自生自灭的产品，你可能更希望选择一个包含支持的版本。


    ## 一些流行的发行版


    在这里，我将快速查看几个 Linux 发行版，并对它们的一些功能进行简要概述。发行版从一个版本到另一个版本可能会发生巨大变化，因此你可能想自己研究一下它们，以找到最新发行版中包含或不包含什么——这可能与我写文章时提供的版本非常不同。


    ### 一些注意事项




    ![](img/a0e6136ea1c86032b26127d28a7bd962_195_0.png)


    -   你可以花费 50 美元以上购买的大多数 Linux 发行版在互联网上或廉价 CD-ROM 上也有免费提供。虽然这些版本相似，但廉价版本不包含任何形式的支持、打印文档或通常包含的商业软件。你完全自力更生。如果你想要完整的产品，请确保你购买的是盒装。

    -   Linux 发行版有自己的版本命名方案。例如，Red Hat 目前是 5.2 版本，而 Caldera OpenLinux 是 1.3 版本。然而，这两个产品都使用内核
    2.0.35。仅仅因为一个发行版的版本号较低，并不意味着它更旧或功能更弱。要确定，请对比内核版本，它们通常列在包装上。


    ## RED HAT LINUX


    Red Hat 是美国最流行的 Linux 版本，包含了各种附加包。其安装过程非常精简，并且可以很容易地通过网络进行。包含了用于图形化管理系统的工具。Red
    Hat 还开创并包含了 RPM 软件包系统，使得发行版本之间的升级变得只需点击按钮并等待几分钟。Red Hat 还为他们的完整产品提供服务。


    有关 Red Hat 发行版的更多信息，请访问 http://www.redhat.com。


    ## DEBIAN LINUX


    Debian Linux 发行版也是一种非常流行的非商业 Linux 发行版。支持由全球数百人组成的 Debian 开发社区提供。Debian 发行版是一个频繁更新的前沿发行版。Bug
    的跟踪和修复比许多商业发行版更快，甚至更快。Debian 还提供了自己的包管理系统，类似于 RPM，可以无缝地处理升级。Debian Linux 是所有发行版中最灵活的，但这种灵活性意味着新用户会遇到很多额外的复杂度。Debian
    Linux 最适合 Linux 或 UNIX 老兵使用。


    有关 Debian 的更多信息，请尝试 http://www.debian.org。


    ##


    Caldera 商业 Linux 包含了多个高端服务器，包括新的 Linux Sybase ASE (SQL) 服务器。Caldera 构建了类似于 Red
    Hat 的用户友好安装程序，同样使用 RPM 软件包管理器。OpenLinux 一个特别好的特性是它配备了 KDE，这为来自传统桌面操作系统的用户提供了完美的界面。它还提供了
    StarOffice 生产力套件，提供了 Office 95 连接以及非常相似的功能和特性。对于企业客户，Caldera 为 OpenLinux 提供了全面的培训课程、认证和支持服务。


    要了解更多关于 Caldera OpenLinux 的信息，请查看 http://www.calderasystems.com。


    '
