    # THE GRAPHICAL USER INTERFACE 27


    ![](img/a0e6136ea1c86032b26127d28a7bd962_38_0.png)


    If Your Input Vanishes If you''re typing and you notice that you''re typing isn''t
    appearing where you think it should be, chances you have your input focused in
    some other window. Check to make certain that your cursor is where it belongs,
    or if your system is configured for Click to Focus, ensure that you''ve clicked
    where you intend to type. It''s very easy to get confused when moving between
    platforms using different input methods.


    In X, the window manager or any other program can attach arbitrary commands to
    arbitrary user actions. For example, when a user right-clicks the title bar, a
    program might attach the action of displaying a menu. The window manager might
    pop up a variety of menus when the user left-, right-, or center-clicks in the
    background of the window system (or shift-left, shift-right, or shift-center clicks—the
    possibilities are endless). One popular terminal program, xterm, pops up its configuration
    menu when the user holds down the Ctrl key and left-, right-, or centerclicks
    in the window. Some window managers attach a standard menu with common commands
    as Close and Resize to each application''s title bar. Others attach these functions
    to pop-up menus or buttons in the title bar. Even among different releases of
    Linux you will find variations in program behavior; local configuration options
    can exert a significant influence over the interface. The best advice on how to
    find any particular option or command is to read the available documentation and
    to ask other users.


    Most window managers have the capability to iconize or minimize windows. Because
    the actual display of the client program''s windows isn''t handled by the client,
    the X server and window manager are free to make some useful contributions to
    the user experience. One of these contributions is when the client requests a
    window with particular characteristics, the server isn''t obliged to represent
    the window that way to the user. It is required only to treat it as though it
    had those characteristics. For example, this allows the server to scale the window
    arbitrarily, or to shrink it down and treat it as an icon. If you''re familiar
    with the idea of a taskbar or desktop dock, you can iconize windows that have
    been minimized, but you can store anywhere onscreen.'
