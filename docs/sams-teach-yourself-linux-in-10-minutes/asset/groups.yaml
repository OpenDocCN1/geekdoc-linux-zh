    you''re running `export DISPLAY=<machename>:0.0`.


    If you''ve run a program and it exits with a complaint like `ld.so: not found,
    you might have to set the `LD_LIBRARY_PATH` with a command such as `export LD_LIBRARY_PATH=/usr/local/lib.`.


    The possibilities are really endless—thankfully, making the settings a relatively
    painless process. Just remember that the settings you make in one shell do not
    affect other shells. You can have the same environment variable set to different
    values in different shells you''re running simultaneously if you need to access
    more than one configuration at a time.


    # Paths


    Another special shell variable is the PATH variable. It tells the shell where
    to look for programs to execute for you. Remember how long the find command took
    to find things in Lesson 5, “Finding Files”? You wouldn''t want it to take that
    long every time you try to execute a program, so you don''t want the system to
    search for everything on your machine to find a program. Instead, the shell keeps
    a short list of where to look for programs, and it searches these locations.


    You might notice that if you have a copy of a program in your current directory,
    in some cases the filename will result in a command not found error. This is because
    it''s common for the PATH variable to lack the current directory. You can either
    execute programs in the current directory by typing `./<programname>`, or by adding
    the current directory to your path.'
