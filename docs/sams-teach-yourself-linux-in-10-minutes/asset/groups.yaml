    # 电子邮件


    在你 Linux 账户中将使用的所有网络工具中，电子邮件可能是使用最频繁的一个。电子邮件让你与朋友和同事交流、交换文件并与全球各地的人联系。作为最常用的工具，电子邮件的地位实至名归，而且拥有可用最广泛的软件。大多数
    Linux 版本都至少带有两个不同的访问邮件程序，并且通常随着时间的推移安装了其他几个程序。以下是一些用于访问和处理电子邮件的常用程序：


    - mail——几乎几乎所有的 Linux 系统中，mail 是一个命令行驱动的邮件读取系统。它是一个非常简单的程序，没有许多自定义功能，但如果你不喜欢邮件过滤器或菜单驱动的界面，它既快速又方便使用。


    - pine 和 elm——这两者都是全屏邮件阅读程序，具有简单直观的菜单和配置选项。pine 程序比 elm 稍微强大一些，但对于希望在文本电子邮件阅读器中获得便利性的用户来说，两者都是很好的阅读器。


    - mh——邮件处理器（Mail Handler）。mh 程序包可能是可用软件包中最不直观的邮件读取包之一。它也是到目前为止最强大的。mh 的哲学与 Linux
    哲学非常相似——将手头的工作分解为最小的构建块，制作其中的每一个程序，并让用户将它们组合以实现任何所需的自定义配置。在你熟悉编写一些 shell 脚本之后，再选择
    mh 作为你的邮件阅读器，因为你必须构建自定义别名和脚本，mh 才能显示出真正的威力。


    - procmail——邮件处理器（Mail Processor）。procmail 程序设计用于对你的原始电子邮件进行复杂的自动处理。如果你想为你的账户添加邮件自动处理功能，你可能需要检查系统是否可用
    procmail。


    图形化电子邮件界面——许多桌面环境都提供图形化邮件；对于对点击便利性感兴趣的用户，请查看你的桌面环境软件。Netscape 也提供了一个电子邮件客户端，除非你的机器运行着
    POP3 服务器，否则它无法从你的 Linux 邮件池中读取。KDE 电子邮件客户端（相应命名为 Mail client）的示例如图 18.1 所示。


    ![](img/a0e6136ea1c86032b26127d28a7bd962_177_0.png)


