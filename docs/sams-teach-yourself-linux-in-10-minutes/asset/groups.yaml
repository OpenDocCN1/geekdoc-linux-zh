    现在你对你的命令将操作的对象有了一定的了解，可以开始学习在系统间穿梭所需的知识了。


    ## 导航文件系统


    处理 Linux 文件系统最基本的命令是在目录之间移动，以及查找其中包含哪些文件。但在这些目录之间切换之前，先知道自己在哪里是个好主意。


    ## 你在哪里？`pwd`


    `pwd`（显示当前工作目录）命令要求你的机器告诉你当前处于哪个目录中。每当你运行命令行时，它都处于文件系统的某个地方——输入 `pwd`，它就会告诉你所在的位置。


    例如


    ```

    > pwd

    /priv/home/ray/public_html/

    ```


    ![](img/a0e6136ea1c86032b26127d28a7bd962_50_0.png)


    > **路径细节**：`/priv/home/ray/public_html/` 是一个路径。路径最简单的解释是：从根目录到达当前文件或目录必须经过的最短目录集合。路径中的每个目录都由
    `/` 隔开。


    ## 主目录


    对于每个用户来说，有一个特定的目录是特殊目录。这就是你的主目录。从导航文件系统的角度来看，这个目录与任何其他目录都是相同的，但它具有特殊意义，因为当你登录时，它是你最初所在的地方。你可以预期主目录及其子目录下的任何内容都只属于你。为了让你的生活更方便，Linux
    不需要要求你记住主目录的路径。相反，它允许你将你的主目录称为 `~`，将任何人的主目录称为 `<username>`。


    现在你知道自己在哪里了，你可能可能想知道你身边有哪些文件。


    ## 列出文件


    实际上，Linux 允许你在任何地方列出文件（你没有权限的地方除外；关于权限的更多信息请参见 Linux 19，“权限”），但最方便列出文件的地方是“这里”——即你当前所在地。


    ## ls


    `ls` 命令用于列出文件。在不带参数运行时，`ls` 会列出当前目录（即 `pwd` 告诉你的目录）中的文件和子目录。


    例如


    ```

    > pwd

    /priv/home/ray/public_html/

    > ls

    cgi_bin          test.html

    images          vrml

    index.html

    ```


    这显示你的当前目录路径是 `/priv/home/ray/public_html`，该目录包含五个项目。你从这个列表中无法判断，但 cgi_bin、images
    和 vrml 是目录，而 index.html 和 test.html 是文件。


    > **基础知识**：在上面的示例中，你并不真的需要执行 `pwd` 命令来使用 `ls` 命令。包含该命令是为了清晰起见。如果你已经知道自己在文件系统中的位置，就没理由让计算机为你重复一遍。


    如果你想列出当前目录之外的目录中的文件（例如根目录中的文件），可以带目录选项执行 `ls` 命令。


    ## 文件系统


    1. 确定你想要列出的目录名称。

    2. 执行命令 `ls <目录名称>`。


    例如，如果你想列出根目录 `/` 的内容，你将输入：


    ```

    > ls / /

    CDROM lib

    bin priv

    core tmp

    dev vmlinux

    etc usr

    include var

    ```


    这里的所有项都是目录，除了 vmlinux（它是 Linux 最核心的软件部分）和 core（这是一个本该被丢弃的错误文件）。


    > **文件名事实**：记住 Linux 的文件名（以及命令）是大小写敏感的。Linux 排序时大写字母在小写字母之前。这就是为什么 CDROM 出现在 bin
    之前。


    如何判断它们是目录呢？使用 `ls` 在列表中请求更多信息，特别是“长格式”（long）选项。


    执行命令 `ls -l <目录名称>`。


    例如


    ```

    total 19

    drwxr-xr-x 2 root root 2048 Oct 21 07:46 bin -> /usr/bin

    drwxr-xr-x 2 root root 1024 Oct 15 14:28 boot

    -lrwxr-xr-x 2 root root 8503726 Oct 21 07:43 core

    drwxr-xr-x 2 root root 1382768 Oct 27 07:43 vmlinux

    drwxr-xr-x 3 root root 21504 Dec 2 16:56 dev

    drwxr-xr-x 29 root root 4096 Dec 2 17:05 etc

    drwxr-xr-x 16 root root 1024 Nov 25 18:10 home

    drwxr-xr-x 4 root root 2048 Oct 26 16:30 lib

    drwxr-xr-x 2 root root 12288 Jul 4 13:51 last+found

    drwxr-xr-x 2 root root 1024 May 7

    ```

    ...

    ```

    '
