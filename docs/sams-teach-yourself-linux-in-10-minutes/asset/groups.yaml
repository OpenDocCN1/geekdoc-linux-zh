    # LESSON 9

    OTHER TEXT AND FILE UTILITIES


    In this lesson you''ll round out your look at text utilities by learning how to
    perform some routine and not-so-routine tasks on text files.


    Some of what you''re going to see in this lesson might not seem to be useful,
