    # FINDING FILES CONTAIN A WORD OR PATTERN


    One of the most powerful built-in programs in Linux is grep. The grep command
    enables you to quickly search through the body of files for a particular word
    or pattern. It can search in three flavors: grep, egrep, and fgrep. The differences
    between these versions are based on the complexity of regular expressions they
    can handle.(Regular expressions define a pattern of text that can be used to search
    files when a specific word or phrase for search might not be known. You will learn
    more about regular expressions in Lesson 13, "Regular Expressions.") The fgrep
    command is the fastest of the three, but handles the least complex expressions.
    To be safe, you can always use plain grep, which should work the same in every
    case, on every system. So how do you use this wonderful tool? Give it the word
    or pattern to look for and the files it should search:


    +   - Choose the word or phrase you want to locate.


    +   - Find the filename to search. If it is in another directory, you must specify
    the entire pathname. You can also use wildcards to search multiple files, if you
    want.


    +   - Type grep <pattern to find> <file or files to search> at the command prompt.


    For example


    ```

    >grep "jray" *.txt

    8979-10.txt:<manager>=jray

    log.txt: Access by jray on 11/12/98

    kiwi.txt: jray loves to eat kiwi. But don''t think it would be

    ```


    This example searches for jray in any file that ends in .txt. It has turned up
    three files (8979-10.txt, log.txt, and kiwi.txt) that contain the string; each
    filename is followed by the text that contains jray. Two options you might want
    to consider adding to grep are -i to ignore case, and -n to display the line numbers
    of the match in each file. You might add these flags to the command line, immediately
    following the grep command.


    grep is an extremely valuable tool that will become even more valuable when you
    later learn about regular expressions. Remember to come back to this lesson to
    test some of the things you''ll learn in Lesson 13.'
