    # shutdown/reboot


    While personal computers are becoming increasingly picky about being shut down
    instead of simply turned off, Linux machines are more picky still. The difference,
    of course, goes back to the fact that Linux uses dozens of cooperating programs
    to form what appears as the operating system. Each of these programs could be
    in the process of modifying, moving, creating, or deleting files at any point
    in time. If you simply shut off the power to a Linux machine, you interrupt all
    these processes, and probably destroy any files you were working on. If the files
    were things such as word-processor documents, this would only be a minor problem.
    Unfortunately, Linux also moves around and updates files critical for the operating
    system. System shutting off the power to a Linux machine has the potential to
    completely corrupt the drives, leaving the system unusable—in short, don''t do
    it.


    To prevent this, Linux has a shutdown command and a reboot command, each with
    obvious goals. These two commands gracefully exit all running software, write
    disk-cache information to the drives, and complete their respective tasks. They
    are restricted to the root user for obvious reasons, yet Linux allows the console
    user to press Ctrl+Alt+Del. This doesn''t actually turn the machine off; it executes
    the shutdown command, as root, without requiring a password. Only use this in
    extreme emergencies. Other users could be using your machine, or your machine
    could be providing disk resources to other machines. Shutting down is likely to
    create havoc on your local network and will earn you a high position on your system
    administrator’s list of least favorite users.


    # chown


    The chown command is used to change the owner of a file from one account to another.
    Obviously, a normal user can''t use this command, but if you need this, your system
    administrator can do it for you. Remember, you can always get a copy of a file
    that you can read using the cp command—changing ownership might not be necessary.'
