- md: '

    # SUMMARY


    Regular expressions are an extremely flexible way of describing a pattern to be
    matched. Because many Linux applications, including the shell, support regular
    expressions, it is important to develop a general understanding of how they work
    and what they are good for. Let''s review:


    - . This matches any character. Use it whenever you aren''t sure what character
    will fall in a specific position.

    - Using the \* will match any number of occurrences of a specific pattern. You
    can use this in conjunction with . or ranges.

    - \SpecialSpecial characters need to be escaped using the \ character. If you
    need to use the quote character (*) in a pattern, for example, you''ll have to
    escape it.

    - Ranges—You can match ranges of numbers or letters to limit a pattern. Ranges
    are enclosed in brackets ([{}). To negate a range, ^ at the start of the range
    specification.

    - \^/$—These two special characters match the start and end of a line, respectively.
    They are commonly referred to as anchors because they anchor a pattern to a specific
    place on a line.

    - Regular expressions—These are used in many Linux programs and can be an extremely
    powerful tool. Read the man pages for your shell and other utilities in order
    to determine the extent to which they support regular expressions.


    ## LESSON 14

    ## BASIC SHELL SCRIPTING


    In this lesson, you will learn a bit more of the magic behind automation and customization
    using shell scripts.


    In Lesson 12, "Input and Output," you learned about pipes, and you probably began
    to see a bit of what makes Linux so powerful and configurable. What you probably
    didn''t realize is that using a pipe is only the very beginning of what Linux
    can do to customize and automate tasks. As you read through this lesson, you''ll
    see that pipes are only the smallest tip of the iceberg.


    Shell scripts are essentially programs written in the language of the shell. If
    you''re a user from the pre-Windows days of the PC, you''ll recognize shell scripts
    as being similar to BATCH files. Macintosh users, while not burdened by a command
    line in day-to-day life, should still see the similarity to the AppleScript and
    Frontier scripting languages. While anything larger than a few dozen lines of
    script would probably be better done in a language other than the shell, thinking
    of shell scripts as *little programs* does injustice to the flexibility and convenience
    that they provide the user.


    ## GETTING A LOT FOR A LITTLE: SHELL SCRIPTS


    You would usually create a shell script when you want to combine a set of actions
    that you routinely need to repeat into a single convenient action.


    For example, if you''re in the habit of coming in to work, sending all your coworkers
    an email message saying "Howdy Neighbor," firing a print job to print out the
    most recent 100 hits to your personal Web page, and then opening an xterm and
    reading a few newsgroups, you can save yourself some time and keystrokes by writing
    a little shell script to do all this automatically. You could put it all in a
    file and name something such as save-time-save-time, and in the future, you''d
    just have to come in to work and type save-time-save-time to automatically save
    yourself some time!


    Another instance of using shell scripts, or shell scripting techniques, is with
    some commands that can be used to automate tasks directly in the shell, without
    having to be put in a file. You will look primarily at these, because they''re
    easier to learn and more immediately useful. As you get more comfortable with
    Linux you''ll naturally gravitate to the idea of just putting what you''re typing
    in a file, and another shell script programmer will be born.


    ## SHELL SCRIPT FILES


    As mentioned earlier, shell scripts are small programs written in the same language
    that you use to talk to the shell. It only makes sense that you can do this with
    Linux—remember the Linux model of input and output? The shell really doesn''t
    care whether it is issuing commands to it, or if the commands are coming to it
    from some other source, such as a file.


    As a quick introduction to the sort of thing you can do with a shell script file,
    take the save-time-save-time example. If you wanted to write a shell script to
    do exactly this, you need to put together a few of the tools you''ve seen so far,
    and a few more that you haven''t yet. For your ed, here''s what to do:


    - Determine the name of your Web server log; here, /var/log/http/access_log is
    assumed.

    - Determine your username. (You''d better know this by now!) For the purposes
    of this example, you''re named Bob, and your email address is bob@very.important.com.

    - Figure out how to send email to a bunch of people with one command. This sort
    of behavior is generally frowned upon unless it''s for good reason, so you''ll
    just yourself email here.

