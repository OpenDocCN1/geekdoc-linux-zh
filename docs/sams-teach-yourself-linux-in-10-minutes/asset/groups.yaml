    你好，


    有一个适用于 KDE-1.0 的 VRML 查看器已可用：


    http://ftp.kde.org/pub/kde/unstable/apps/graphics/twirl/twirl-0.0.6.tgz


    遵循链接：


    图 18.1 KDE 环境提供了几个图形化网络客户端，包括一个电子邮件客户端。


    # .FORWARD 文件


    如果你想让进入账户的邮件自动发送到其他地方，可以使用 .forward 文件。.forward 文件不仅可以用于将你的邮件转发到另一个电子邮件地址，如果你想使用软件处理邮件，还可以将邮件转发到其他程序。


    # 访问网络资源


    .forward 文件的格式简单：


    要将邮件转发到另一个电子邮件地址，请在你的主目录下创建一个名为 .forward 的文件。在该文件中，输入包含你想要转发邮件的地址的单行。执行命令 `chmod
    644 ~/.forward` 来正确设置权限，即可完成。所有进入你账户的邮件将会被转发到新地址。


    要将邮件转发到程序进行自动处理，请在你的主目录下创建 .forward 文件。输入一行包含管道字符 `|` 后面跟上你想使用的程序路径。如上一个示例所示对文件运行
    `chmod`，即可完成。传入的邮件将被管道到你在 .forward 文件中放置的任何命令。


    # 总结


    在本节中，你学习了一些可以让你利用周围以及世界范围内网络资源的工具。当你探索 Linux 时，你会发现这真的只是一小部分，并且不断有新工具供你使用。其中一些是这里列出的命令的替代或或升级，另一些则是全新的。不要害怕尝试它们。以下是本节要点的快速回顾：


    - telnet-连接到远程机器；如果你在不同的机器上有不同的账户，你可能会发现自己频繁使用它。


    - rlogin-也连接到远程机器，但如果你工作的机器配置为允许你在不提供用户名或密码的情况下在它们登录，那么它比 telnet更有用。


    - login-为远程连接提供安全性。如果你有它，就使用它。随着每天都有人入侵 Linux ，网络正在变成一个非常可怕的地方。使用 login 提供的安全连接将保护你的网络流量免受窥视。


    - trn 和 rn——读取 Usenet 新闻组。新闻组可能很有趣且有助于寻找信息，但也可能消耗你大量的时间。


    - ftp-连接到远程服务器传输文件。


    - smclient-允许你访问远程 SMB 共享。


    - lynx-基于文本的网络浏览器。


    - w3m-用于 Linux 的图形化网络浏览器。


    - wget-一个从 Web 服务器检索内容的免费程序。


    - curl-一个与服务器传输或从服务器传输数据的命令行工具。

    '
