    # ENVIRONMENT VARIABLES


    As mentioned earlier in this book, most of the software you use, and the interface
    you work in when using Linux, is configured with seemingly cryptic text files.
    Other pieces of software are configured by special shell variables called environment
    variables. (You should remember shell variables from Lesson 14, "Basic Shell Scripting.")


    Environment variables are used by programs to pick specific pieces of information
    that are needed to run. For example, you might run across programs that want an
    environment variable that contains the path to their Help file information. Others
    use environment variables to contain custom settings for things such as window
    size or placement preferences. In the preceding aliases section, you might have
    noticed a program that wanted an environment variable to tell it what Internet
    host to contact.


    Environment variables aren''t set using the same syntax as regular shell variables,
    so instead of using set <variablename>=<value>, you would use the syntax export
    <variablename>=<value>.


    Consider the situation where a program that has to set the environment variable
    HELPFILE_LOC to the directory containing its help information. Unless this variable
    is set, it cant find the information it needs, and it won''t work properly. If
    you''ve found that the Help file is located in the directory /usr/local/helpstuff,
    you can set the variable need by using this command: export HELPFILE_LOC=/usr/local/helpstuff.


