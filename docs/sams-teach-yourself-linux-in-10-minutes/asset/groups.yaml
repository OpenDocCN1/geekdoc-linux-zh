    > ? end

    ```


    The part of this might not immediately understand the $test:e part. This says
    “expand the $test variable, and toss out everything except for the stuff after
    the last. in the filename”—In this case, the parts that make the files different
    (start, today, and so on).


    Of course, this isn’t a very useful command for three files, but if you’ve got
    a project with hundreds of files, it could save you a lot of typing.


    # MODIFYING AND REPLACING ORIGINALS


    Another useful trick that you can use the foreach command is for when you need
    to apply a process to each of the many files, and you want to do it without creating
    new files.


    Let''s say you have a collection of image files, each of which have a border that
    you want to crop off, and then you want to scale them to a smaller size. If the
    imaginary command crop took files on STDIN and wrote its data to STDOUT, you could
    use the foreach command similar to this:


    ```

    > > foreach test (*.gif)

    crop < $test > holding

    mv holding $test

    ? end

    ```


    Why not just crop $test > $test? Because you can''t be guaranteed that you can
    get writing to the file while you''re still reading from it—so you store the results
    in a temporary file named holding. Follow up by using the mv command to move the
    temporary file back to the original filename.


