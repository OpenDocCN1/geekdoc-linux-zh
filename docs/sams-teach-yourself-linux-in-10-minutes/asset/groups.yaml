    # # DIFFERENCES AND PATCHES: diff patch


    Something that you might be accustomed to is creating documents and sending out
    revisions. Unfortunately, most of the time you probably have to send out entire
    copies of new files when only a few words here and have changed. In the Linux
    community, there is a great deal of information exchange, and source code is passed
    back and forth constantly. Rather than always sending complete files, people reply
    on the diff and patch commands to transfer only whatever information has changed
    between files.


    # # Using diff


    The diff function takes two files, an original template file and an updated file,
    and produces an output file that contains enough information to reconstruct the
