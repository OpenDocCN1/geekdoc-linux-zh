- md: '

    ## LESSON 18

    ## ACCESSING NETWORK RESOURCES


    In this lesson you will learn about another strength of Linux—network connectivity.


    You''re now almost finished with your whirlwind tour of the Linux operating system,
    but nowhere near finished exploring and learning about the capabilities that Linux
    puts at your fingertips.


    Linux excels at networking; with the proper configuration, you can spread Linux
    machines around the globe, and at each computer you log in, your user environment,
    files, and programs will all appear, just as they would at home.


    With the same ease that your home environment can distribute itself to scattered
    machines to work for you, so you can distribute your workload to those same machines
    from your home machine. This lesson provides you with a survey of some of the
    programs that allow this distribution of workload.


    ## telnet


    telnet is a simple terminal program. In its primary use, it allows you to open
    a login session on a remote machine. To use the telnet command, issue the command
    as telnet <remote machine>, where <remote machine> is either an IP address or
    a hostname. You should be prompted with a login and password prompt just as though
    you were sitting at the console of the remote machine.


    telnet Particulars It''s not unusual to run into situations where Backspace and
    Delete don''t work properly at telnet''s login and password prompt. Don''t be
    alarmed; this is simply an indication that the remote machine doesn''t yet know
    what sort of terminal you''re using. If the problem persists into the login session,
    see the section on stty in Lesson 16, "Modifying the User Environment."


    ## rlogin


    The rlogin command is very similar to the telnet command, except that it carries
    some user information along with the attempt to connect. If your account is good
    on several machines, they might be set up to allow you to connect between them
    without having to log in each one. Try the rlogin command as rlogin <remote machine>.
    If you''re lucky, you''ll end up in a shell on the remote machine. If you''re
    not, you''ll be presented with a login prompt; from there, rlogin functions identically
    to telnet.


    ## slog


    the slog command is a remote terminal program that offers strong encryption of
    the data stream. If your machines have the secure-shell server running, you are
    strongly encouraged to use this command. Both the rlogin and telnet commands send
    your login and password information, as well as anything else you type, over the
    network in plain text. A malicious user with a small amount of easily available
    cracker software can sniff your account. (Please don''t call them hackers. Hackers
    are quick and dirty, and often brilliant programmers—they don''t break into things;
    crackers do.)


    To find out the secure shell server is running, and to set up the login command
    (which needs quite a bit of configuration before you can use it) you are advised
    to contact your system administrator. He or she will be more than happy to tell
    you about the login command or any alternatives and to help you increase system
    security.


    ## rn/trn


    the rn and trn commands read Usenet newsgroups. Retreating slightly into the background
    because of the World Wide Web, Usenet newsgroups once were considered to be the
    collective memory of the Net. Even though the Web has eclipsed newsgroups in terms
    of visibility, the fact that newsgroups function as topic-oriented chat rooms
    and provide almost real-time interaction makes them a useful source of help and
    information. You can use the rn or trn command to access information that ranges
    from the technical, to the sublime. The rn and trn commands are executed by name,
    and internally take both single-key commands and multi-character commands followed
    by <Return>. The following are the primary commands you need to know in rn or
    trn.


    - Listing Newsgroups—l <topic><Return> will list all newsgroups that contain that
    topic. Keep your topics small parts of words—such as comp for computer topics—until
    you become familiar with the newsgroup naming conventions.

    - Going to a newsgroup—g <newsgroup name><Return>, and then following the instructions.

    - For help—h —no<Return>, will bring rather copious context-sensitive help at
    almost any point in the program.


    the trn command is a slightly more sophisticated version of rn, offering article
    selection by subject thread, and you will probably prefer if it''s available.
    Either version can be highly configured with command-line switches and configuration
    files.


    > My trn Runs, but Doesn''t Seem to Work? You probably don''t have an NNTP (News)
    server configured. Check Lesson 16 for an example on how to set the NNTPSERVER
    environment variable.


    ## ftp


    the ftp command provides you with a way to retrieve files from remote machines
    that aren''t set up to share file systems with yours. If you machine is running
    an FTP server, you might be able to use it to provide your files to the rest of
    the world as well. Contact your system administrator about this.


    To use the ftp command, enter the command as `ftp server`, where the FTP server
    is the IP address or hostname of a remote machine running an FTP server. If you''ve
    connected properly, you''ll get a prompt for a username and password.


    Some FTP servers allow you to connect without an account on the system. For these,
    use the username `anonymous`, and give your email address as the password.


    After you''re connected to an FTP site, you will be able to cd and ls your way
    around. Using the command `get <filename>` allows you to retrieve a file, and
    put `<filename>` allows you to send one from your directory to the remote system.


    > Corrupting Your Data Some FTP servers will corrupt data unless you use the binary
    command after connected. FTP servers actually try to fix the difference between
    the way that Linux and PC-type machines handle carriage returns in files, but
    they just mending things up when talking to another Linux machine. If you end
    up with corrupted files after you''ve downloaded them, try again, but issue the
    binary command before the get command.


    ## WINDOWS CONNECTIVITY: smbclient, smbmount


    If you are comfortable using ftp, and you happen to have deal with a Windows-based
    network, you''ll want to look into the smbclient command. smbclient allows you
    to connect to a Windows Netshare as if it were an FTP site. You can use the same
    cd, ls, and put commands to navigate and interact with the file system. Unfortunately,
    you can only send and retrieve files from the shared resource—you cannot interact
    with files directly on the server. In order to do this, you''ll need to have the
    Super User setupmount to mount the Windows share as a local drive.


    ![](img/a0e6136ea1c86032b26127d28a7bd962_174_0.png)


    Whatever your Windows needs, however, Linux is ready to provide connectivity.


    ## WEB BROWSERS: NETSCAPE, LYNX, AND KDE


    You have a variety of browsers to use for accessing the World Wide Web. Let''s
    take a look at a few.


    ## NETSCAPE


    Netscape is the GUI-based Web browser that is available on the largest number
    of Linux platforms. It functions in much the same way as the Macintosh or PC versions
    you might be familiar with already—point, click, repeat as necessary. If it''s
    available on your system, you should be able to start Netscape by typing netscape
    from an X Windows terminal.


    ## LYNX


    Lynx is a text-based Web browser for times when you''re stuck in a text window;
    start it with lyn <URL>, and you will get a textual representation of the page
    that the URL points to. Lynx is a surprisingly full-featured browser for what
    you might think is an extremely limited market. The market is actually a bit bigger
    than you might think. Lynx starts and loads pages much faster than graphical-based
    browsers. This makes it a convenient alternative if you need to check some Web
    page quickly and don''t need the graphics or the wait.


    ## KDE


    Each file manager window in the KDE environment is also a full-function Web browser.
    Rather than starting a heavyweight program such as Netscape, you can type your
    destination URL into the URL line at the top of any file manager window, and you''ll
    quickly be taken to the appropriate Web site.

