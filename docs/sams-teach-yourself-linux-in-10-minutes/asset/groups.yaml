    You’ve probably noticed that the mv command can’t do some things that would be
    really convenient, as renaming multiple files with new names instead of new locations—an
    ideal problem for foreach.


    For example, imagine you have a bunch of files for a pet project, and they’re
    named things such as brokenjunk.start, brokenjunk.today, brokenjunk.gif, and so
    on. All your sudden boss decides that it’s important and you have to give these
    files to the development department because they want to demo your project next.
    This never happens to you, right? If it did, you might want to rename your files
    to something little more professional. Instead of renaming the files one by one,
    you can use the foreach command to automate the task for you. In this case you
    type


