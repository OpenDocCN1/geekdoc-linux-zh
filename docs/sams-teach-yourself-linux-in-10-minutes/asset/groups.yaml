    ## NAVIGATING THE FILE SYSTEM


    The most basic commands for dealing with the Linux file system are the ones for
    moving between directories and finding out what files are in them. Before moving
    between them though, it''s a good idea to know where you are.


    ## WHERE ARE YOU? `pwd`


    The `pwd` (present working directory) command asks your machine to tell you what
    directory you''re currently in. Any time you''re running a command line, it''s
    somewhere in the file system—type `pwd` and it tells you where.


    For example


    ```

    > pwd

    /priv/home/ray/public_html/

    ```


    ![](img/a0e6136ea1c86032b26127d28a7bd962_50_0.png)


    > **Path Particulars**: `/priv/home/ray/public_html/` is a path. The simplest
    explanation of a path is the shortest set of directories through which you must
    travel from the root directory to get to the current file or directory. Each directory
    in the path is separated by a / .


    ## THE HOME DIRECTORY


    To each user, one particular directory is a special directory. This is your home
    directory. From the standpoint of navigating the file system this directory is
    identical to any other, but it is significant because when you log in, it is where
    you will initially be. You can expect that anything or below your home directory
    belongs only to you. To make your life easier, Linux doesn''t require you to remember
    the path to your home directory. Instead, it allows you to refer to your home
    directory as ~, and to anyone''s home directory as `<username>`.


    Now that you know where you are, the next thing you might want to know is what
    files are with you.


    ## LISTING FILES


    Actually, Linux will let you list the files just anywhere (with the exception
    of places that you don''t have permission; more on permissions in Linux 19, “Permissions",
    but the easiest place to list files from is “here”—wherever currently happens
    to be.


    ## ls


    The `ls` command lists files. Issued without arguments, `ls` lists the files and
    subdirectories in the current directory (the same one `pwd` would tell you about).


    For example


    ```

    > pwd

    /priv/home/ray/public_html/

    > ls

    cgi_bin          test.html

    images          vrml

    index.html

    ```


    This shows that your current directory path is `/priv/home/ray/public_html`, and
    that this directory contains five things. You can''t tell from this listing, but
    cgi_bin, images, and vrml are directories, where index.html and test.html are
    files.


    > **Covering the Bases**: You didn''t really have to issue the `pwd` command to
    make use of the `ls` command in that example. It''s been included for the sake
    of clarity. if you already know where you are in the file system, there''s no
    reason to ask the computer to repeat it for you.


    If you''d like to list the files in some directory other than the current directory,
    for example the files in the root directory, you can issue the `ls` command with
    a directory option.


    ## The File System


    1. Determine the name of the directory you want to list.

    2. Issue the `ls` command as `<directory name>`


    For example, if you wanted to list the contents of the root directory `/`, you
    would type:


    ```

    > ls / /

    CDROM lib

    bin priv

    core tmp

    dev vmlinux

    etc usr

    include var

    ```


    Everything here is a directory, except vmlinux, which is the piece of software
    at the most basic heart of Linux, and core, which is an error file that really
    should be thrown away.


    > **Filename Facts**: Remember that Linux filenames, and consequently commands,
    are case-sensitive. Linux alphabetizes the capitals before the lowercase. This
    is why CDROM appears before bin.


    How can you tell that they are directories? Use `ls` to ask it for more information
    in the listing, specifically the “long” option.


    Issue the command as `ls -l <directory name>`


    For example


    ```

    total 19

    drwxr-xr-x 2 root root 2048 Oct 21 07:46 bin -> /usr/bin

    drwxr-xr-x 2 root root 1024 Oct 15 14:28 boot

    -lrwxr-xr-x 2 root root 8503726 Oct 21 07:43 core

    drwxr-xr-x 2 root root 1382768 Oct 27 07:43 vmlinux

    drwxr-xr-x 3 root root 21504 Dec 2 16:56 dev

    drwxr-xr-x 29 root root 4096 Dec 2 17:05 etc

    drwxr-xr-x 16 root root 1024 Nov 25 18:10 home

    drwxr-xr-x 4 root root 2048 Oct 26 16:30 lib

    drwxr-xr-x 2 root root 12288 Jul 4 13:51 last+found

    drwxr-xr-x 2 root root 1024 May 7

    ```

    ...

    ```

    total 19

    drwxr-xr-x 2 root root 2048 Oct 21 07:46 bin -> /usr/bin

    drwxr-xr-x 2 root root 1024 Oct 15 14:28 boot

    -lrwxr-xr-x 2 root root 8503726 Oct 21 07:43 core

    drwxr-xr-x 2 root root 1382768 Oct 27 07:43 vmlinux

