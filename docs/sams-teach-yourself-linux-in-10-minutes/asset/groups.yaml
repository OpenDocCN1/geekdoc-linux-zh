    Everything that you''ve run on your system in the previous lessons, and everything
    that you''re going to run in the rest of the lessons, has created processes on
    your system. Each command creates a process that the Linux operating system runs
    until it is finished or killed. Unlike some desktop operating systems, you can
    create processes that run entirely in the background or start and run in the middle
    of the night without even needing to be logged on to the computer.


    # MORE THAN ONE COMMAND AT A TIME


    Linux allows you to run more than a single command at a time. This capability
    is known as multitasking and is available on other operating systems as well.
    What makes Linux different is that mundane tasks operate in the background, even
    after you log out of the system.


    # PUTTING A COMMAND INTO THE BACKGROUND: &


    Making a command run in the background is simple: add an & to the end of the line
    containing the command.


    For example, suppose I am running a program to analyze my Web server log files
    called analog. Most log analysis takes some time for a busy Web server, so I really
    don''t want to wait around the command to finish. In order to run analog in the
    background, I could type


    ```

    >analog /var/log/httpd/access_log &

    [3] 32566

    >

    ```'
- md: '

    The results are a bit cryptic, but you should see that you returned to the command
    line, ready to go! The two numbers that are returned identify the process on the
    system. The first result, [3], identifies this as process number 3 that you''ve
    put in the background. The second number, 32566, is the process ID. Your Linux
    system potentially has hundreds of processes running on it; each one is assigned
    a unique number. Whatever your process happens to be assigned will be returned
    as the second result value.


    > Running More than One Command: To run several commands, one after the other,
    and put the whole group into the background, you can use this syntax: `(<command
    1>;<command 2>;<command 3>).`. This creates a new shell to execute the commands,
    and places it in the background. For example, if I wanted to run the analog utility
    on two files, I could do this: `/var/log/httpd/access_log; analog /var/log/httpd/new_access_log;`


    # SUSPENDING A COMMAND AND MOVING IT TO THE BACKGROUND: CTRL+Z AND bg


    If you happen to start a command without putting it into the background, you can
    still turn it into a background process if you want. Let''s assume I''ve started
    the analog command with the ampersand.


    For example


    ```

    >var/log/httpd/access_log

    ```


    To turn this into a background process, first press Ctrl+z to suspend the process.


    ```

    <Ctrl+z>

    [3]+ Stopped analog /var/log/httpd/access_log

    ```


    The analog command has now been suspended, and is assigned a process number 3.
    Remember, this is not the same as the process ID; it identifies the process number
    locally in your session, not globally to the system.


    To finish putting analog into the background, use the bg command followed by the
    local process number that you want to put into the background, as in bg <process
    number>. In this example, analog was assigned the process number 3, so that''s
    what I''ll use in conjunction with bg.


    ```

    > bg 3

    ```


    ```

    [3]+ analog /var/log/httpd/access_log &

    ```


    Linux responds by showing you that analog is now running with the & in the background,
    and you can continue using the system.


    # RETURNING A PROCESS TO THE FOREGROUND: fg


    What happens if a process is accidentally backgrounded, or if you''d like to return
    a process to the foreground to manually control it or check its status? In this
    case, you''d use the fg command and the process number to return that process
    to the foreground, with the syntax fg <process number>.


    For example, the analog process was assigned the local process number of 3 when
    it was put into the foreground. To bring it to the foreground, type


    ```

    > fg 3

    analog /var/log/httpd/access_log

    ```


    Now you''re in complete control of the analog process again, because it is running
    in the foreground.


    > Missing Process Number? What can you do if you''ve forgotten the local process
    number? Use the jobs command. The jobs command gives you a short listing of all
    your suspended and backgrounded processes, and their associated numbers.


    # LISTING THE RUNNING PROCESSES: ps


    If you really start using the background capabilities of Linux, at some point
    you''re going to find out what you have running. To do this, you can use the ps
    command. This command returns a list of all the processes that you currently own.


    For example


    ```

    >ps

    PID TTY STAT TIME COMMAND

    8832 TTY p1 R 0:00 ps -h

    30674 p1 S 0:00 /bin/login

    30675 p1 S 0:00 -bash

    31136 p1 T 0:00 analog /var/log/httpd/access_log

    ```


    These are all the commands that I currently running. The columns are the system
    process ID (PID), the controlling terminal, the status of the process (running,
    sleeping, and so on), and the process itself. These are just the processes that
    I own. If you''d like to see everything running, running ps ax, which lists all
    the users'' processes (-a) and processes that don''t have a controlling terminal
    (-x). The ps command has a huge number of options that can return tons of information.
    Take a look at the man page for more information. The primary concern right now
    is that you can list what you have running on the system and get your process
    IDs.


    # KILLING A PROCESS: kill, kill, kill!


    Killing might sound a bit harsh for ending a process, but it does sum up the result
    quite nicely. When you kill a process you stop whatever it is doing, no matter
    what. If you''re editing a file, you risk losing the entire file if you kill the
    process rather than exit out of it normally.


    # USING kill


    While the command kill is mainly used to stop processes, it can also be used to
    send signals to a process. Depending on the signal that you send, the process
    might reload its configuration files and reinitialize itself. This


    # PROCESSES 109


    is extremely nice when you''re running something such as a Web server and need
    to add a MIME-type or something without shutting down the server. To see a list
    of the signals that you can send using kill, invoke the command with kill -1.


    >kill -1


    - 1) SIGHUP 2) SIGINT 3) SIGQUIT 4) SIGKILL

    - 5) SIGTRAP 6) SIGIOT 7) SIGBUS 8) SIGFPE

    - 9) SIGKILL 10) SIGUSR1 11) SIGSEGV 12) SIGUSR2

    - 13) SIGPIPE 14) SIGALRM 15) SIGTERM 17) SIGCHLD

    - 18) SIGCONT 19) SIGSTOP 20) SIGTSTP

    - 22) SIGTOU 23) SIGURG 24) SIGXPU 25) SIGFSZ

    - 26) SIGVALRM 27) SIGPROF 28) SIGWINCH 29) SIGIO

    - 30) SIGPWR


    Documentation for the software you run on your system often includes information
    on the signals that it will respond to. The most important signals you''ll need
    are SIGHUP and SIGKILL. SIGHUP often forces a reload of configuration information
    for server processes. However, SIGKILL forces the command to quit...no matter
    what. To send one of the signals, use kill <<signal number> <process ID> <process
    ID>.


    For example, to kill process number 31136


    ```

    kill -9 31136

    []+ Killed      analog /var/log/httpd/access_log

    ```


    If you look at the process listing again, PID 31136 will be gone. It has been
    successfully killed.


    ```

    ps

    PID TTY STAT TIME COMMAND

    18303 p1 R 0:00 ps

    30674 p1 S 0:00 /bin/login -h

    --NEW9314217.columbus.here.com -p

    30675 p1 S 0:00 -bash

    ```


    Sure enough, kill has done away with process number 31136, and analog is no longer
    running on the system.


    # EXITING A SHELL TO KILL A PROCESS


    If you''ve backgrounded several processes, chances are you don''t need to explicitly
    kill them when you log out of the system. The shell will send a SIGHUP signal
    to all the processes you''ve started, which will probably


    kill them. If you''d like to create a process that will not be killed when you
    exit your shell, you can do this with nohup.


    # PREVENTING DEATH: nohup


    The nohup command can be prefixed to any command and will prevent- from being
    killed with the SIGHUP signal. As you might guess from the name, nohup allows
    no HUP, or hangup, signals from killing a process. For example, if I want to prevent
    my analog process from being killed when I exit the shell, I can run it like this:


    ```

    `nohup analog /var/log/httpd/access_log &

    nohup: appending output to `nohup.out`

    ```


    This will run my analog program in the background and prevent it from being killed
    when I exit my shell. The system also notes that any output the command will be
    stored in a file called nohup.out.


    # PROCESS PRIORITY: nice and renice


    Processes that run on Linux have different levels of priority. The amount of priority
    that a process is given can alter how long it takes to complete, aswell as how
    other processes on the system might take to run. Processes are given chunks of
    time on the computer''s CPU. The level of priority determines how many of these
    chunks a process gets. Its wise to run a very computationally intensive task that
    doesn''t need to be finished quickly and have use up all processor time on the
    computer.


    Priority levels on Linux range from -20–20, with the default level being 0. Although
    it might seem a bit backward, -20 is actually the highest priority process can
    have, while 20 is the lowest. To control process priority, you use the nice and
    renice commands.


    # Using nice


    nice is another command that is used as a prefix to the command you want to run.
    The syntax for nice is nice -n <priority> <command>. Continuing the analog example
    I''ve been using in this lesson, I''m going to run analog at the lowest priority
    level I can. Analyzing log files is not high priority task.

