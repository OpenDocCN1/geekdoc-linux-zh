    # bzip2/bunzip2


    While a relatively new addition to the Linux/UNIX compression scene, the bzip2
    compressor appears to produce better compression than either compress or gzip.
    The syntax and options for bzip2 have intentionally been made similar to gzip,
    so if you should encounter this program as it grows in popularity, you shouldn''t
    have too much figuring it out. Compression with bzip2 follows the gzip format:
    bzip2 <filename>, which produces the compressed file <filename.bz2>. Decompression
    is simply bunzip <filename.bz2>.


    The bzip2 compression and decompression utilities appear to be in development
    as this writing, so it would not be surprising to find that the commands evolve
    over time (bzip2 and .bz files are an update of a prior bzip program that made
    bz files). If you encounter these programs and need to do more than trivial compressions
    or decompressions, it is recommended that you consult your local man pages for
    more current information.


    # MANAGING YOUR DISK USAGE


    If you''re on a system where you need to worry about disk usage, have a disk quota
    that you must remain under, or are just curious about how much space your files
    are taking up, there are a Number of commands you can use to look at this data:


    +   - ls—Turning back to Lesson 4, "The File System," you can use the ls command
    with the -l option to display disk usage for a file or files. If you need to scan
    quickly through your files to see which ones are taking up the most room, this
    is a quick way to do it.


    +   - find—In Lesson 5, "Finding Files," you were introduced to using the find
    command to find files over a certain size. Size similar in utility to the ls -l
    command for this purpose, find -size # is a faster way to collect information
    on all files # kilobytes—you just have to know what # you''re looking for.


    +   - df—Used by system administrators, the df command provides information about
    disk usage. Depending on your'
  - '[PAGE 110]


    # COMPRESSION AND ARCHIVING TOOLS 99


    version of Linux, you might have to give df different options to get it to produce
    readable output, but the general form you''d be interested in is df /, which asks
    the file system to tell you about the usage of the drive that the current directory
    resides on. The response will usually be in the form of a logical device name
    that you can ignore, followed by information about the total capacity of the device,
    the percentage of storage in use on the device, and the mount point (path to the
    directory at which the device appears) for the device. You might have to try variations
    on df / or df -k /, or check your man pages to find the option that works on your
    version of Linux.


    +   - du—another system administrator type command, du provides information about
    disk usage by directory. Again, different versions of Linux use slightly different
    syntaxes, but the general form you will be most interested in is du -s *, which
    asks the file system to produce a disk usage summary for everything in the current
    directory. For each item in the current directory -s * will return a summary of
    the total disk space used by the contents of the files or directories. Depending
    on your version of Linux, you might or might not need to supply du with the -k
    flag to convert it show you the disk usage in kilobytes (otherwise it shows the
    disk usage in values of the file system''s native block-size—usually 512 bytes).


    # ARCHIVING Files: tar


    If you spend much time using Linux systems, you are bound to run into tar files.
    Tar is short for tape archive, though the tar command and its output are very
    rarely used for archiving tape anymore. More sophisticated and more powerful programs
    have taken over the job of archiving to tape, though the tar command remains a
    convenient and useful tool for personal archiving and distribution of files.


    The tar command, in its simplest form, either creates or unpacks archive files.
    When creating an archive, you provide tar with a filename for the archive and
    a list of files to archive. The program then collects all the'
- md: '

    and bundles them into a single tar file, which you can then store for future

    use or distribute conveniently via the World Wide Web, FTP, or email.

    When unpacking archives, you provide tar with the name of a tar file,

    and it extracts the contents of the file into the current directory, with the

    exact filenames, paths, and contents that existed on the system

    where it was tarred.


    To use tar to create an archive


    - 1. Determine the name you want for your archive tar file—normally it should
    have the suffix TAR.

    - 2. Determine the filenames of all the files you''d like to include in the tar
    file, or more normally, the name of a directory that you''d like to archive the
    contents of.

    - 3. Issue the tar command as tar -cvf <filename.tar> <files or directories>


    For example, if you have a directory named lots-a-stuff in the current directory,
    you could archive the entire contents of lots-a-stuff (all the files, all the
    directories, and all the files in all the directories, and so on) by typing


    ```

    > tar -cvf lotsastuff.tar lots-a-stuff

    ```


    Your machine would respond (because you gave it the -v, verbose option) by telling
    you about every file that it''s putting in the archive, and in the end you would
    have a new file named lotsastuff.tar. This new file would contain the entire contents
    of your lots-a-stuff directory, with all directory structure and file attribute
    interaction.


    To unpack a tar file, issue the command tar -xvf <filename.tar>.


    If you gave this file to a friend, your friend could then unpack the tar file
    by typing


    ```

    > tar -xvf lotsastuff.tar

    ```


    After a list of everything in the file (that -v option again) your friend would
    have a new directory named lots-a-stuff in his or her current directory, and it
    would contain the complete contents of your lots-a-stuff directory. Any subdirectories
    in your lots-a-stuff directory would be present, as well as all their contents.


    ## COMPRESSION AND ARCHIVING TOOLS


    ### Polite Use of tar

    If you don''t know what is in a tar file, it is a good idea to use tar -tvf tarfile.tar
    before unpacking it. The -t option is the tell option and asks tar to tell you
    about the contents of the file rather than unpacking it. This is a useful way
    to determine if the person who created the tar file was a nice person who put
    everything in a directory, and then tarred the directory; or if he she was an
    impolite person who did not put everything in the current directory before tarring;
    if you run into a tar file created by an impolite user, and make the mistake of
    untaring in an inconvenient place—your home directory, for example—tar will end
    up dribbling files all over your home directory. You will then be stuck finding
    all the files and putting them in a subdirectory by hand, sometimes a very tedious
    process. Be a polite user—don''t tar files; tar directories.


    ## PREPARING FOR EMAIL TRANSMISSION: uuencode/uudecode


    If you need to send your files to another user, you can do this easily by including
    them in an email message. PINE, for example, lets you attach a file by pressing
    Ctrl+J. If you don''t have PINE on your system, you can use the oldest encoding
    standard available, uuencode. This lets you encode files for transmission even
    on the most basic Linux installations. The uuencode program accepts any file as
    input, and it produces encoding of the file that can be included in an email message.
    The contents of this file look like random characters, but on the receiving end,
    the user can use the uuencode program to extract the original file. Because every
    email program is different, you''ll need to consult the documentation for your
    email client on how to include a file into a message. Here you''ll just learn
    how to create the uuencoded file from your original, and how to uudecode again
    on the other side.


    To use the uuencode command


    - 1. Determine the name of the file you want to encode for email transmission.

    - 2. Determine what you would like the file to call itself at the end.

    - 3. Issue the uuencode command as `uuencode <filename> > <callmethis> .filename.uue`
    (yes, you need to type the > before the <filename>.uue argument).


    Your computer should produce a file named `<filename>.uue` which contains the
    uuencoded version of the file.


    For example, if you have a file name sendtojoe, and you''d want to uuencode it,
    you could type


    ```

    > uuencode sendtojoe hije > joe.uue

    ```


    Your computer would produce a file name joe.uue, which when decoded by Joe would
    be named hije, and would contain the contents of your sendtojoe file.


    Now you can copy and paste, include, or do whatever you need to insert the file
    you just created into an email message, and send it wherever you like.


    Of course, if you receive a uuencoded file, you will need to know how to decode
    the file. Decoding a uuencoded file is extremely simple—issue the uuencode command
    as `uuencode <filename>.uue`.


    Your machine should produce a file in the current directory identical to the one
    originally uuencoded.


