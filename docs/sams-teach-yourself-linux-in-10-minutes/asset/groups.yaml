  - '[PAGE 153]


    # USING date


    The date command, as you might have guessed, returns the current date and time.
    If you have Super User privileges you can also use date to set the day and time
    on the computer. Ordinary user accounts do not have this capability.


    ```

    >date

    Mon Nov 30 01:15:17 EST 1998

    ```


    There''s nothing to it. You might be wondering why I would even take the space
    to cover such a command. The answer is simple: Without the command, how do you
    find out the current day and time information on your computer? KDE displays the
    information on its desktop, but outside of KDE, the date command will become very
    useful when you have stared at your screen for several hours and end all sense
    of time.


    # USING uptime


    uptime is another simple and useful command. It returns the current time, the
    number of users logged in to the system, how long the system has been running,
    and the amount of load that the system has been under. Just type uptime at the
    command prompt.


    ```

    >uptime

    ```


    ```

    1:20am up 2 days, 9:18, 2 users, load average:

    →1.10, 0.90, 0.10

    ```


    As you can see from this result, its 1:20 a.m. (yes, it really is!); my system
    has been running for 2 days, 9 hours, and 18 minutes since it was last rebooted.
    There are currently two users logged in to the system. The load average is comprised
    of three values: the first value is the load on the system over the past minute,
    the second is the average load over 10 minutes, and the third, over 15 minutes.
    These values are rarely higher than 1 or 2. If you see a system load average of
    anything over 5, your computer is really busy.'
  - '[PAGE 154]


    # USING who


    As you know, Linux is a multi-user system. This means that there can be several
    different users logged in at a time. If your system seems slow, you might want
    to check who is using the computer so you can run over to their desk and yell
    at them. To see who is logged on, use the who command.


    >who


    | jray | ttyp0 | Nov 29 16:35 (192.168.0.91) |

    | yort | ttyp1 | Nov 29 21:47 (192.168.0.211) |


    There are currently two users logged in to the system, who returns the username
    of each user logged in, as well as the name of the controlling terminal, the date
    and time they logged in, and the IP address they are connected from.


    > Tip If you don''t recognize one of the users connected to your system, remember
    the finger command. You can use it to find out more information about other users
    on the system.


    # OTHER COMMAND LINE AND KDE UTILITIES


    There are hundreds of other utilities available on your system for monitoring
    network connections, processing files, and even generating calendars (cal). If
    you''d like to explore, I suggest listing the files in the /usr/bin and /usr/local/bin
    directories and reading the man pages for anything that sounds interesting.


    The KDE environment provides its own utilities including a PIM (Personal Information
    Manager) called KArm, a floppy formatter called KFlopy, and a CD player called
    KCD, and so on. There is no way a single reference book can touch on all topics
    completely. Your best is to look through the file system and research the commands
    that look interesting. The extensive map page collection available for command-line
    utilities provides excellent reference information. KDE also provides comprehensive
    online help, which should make life pretty easy.'
