    > end

    ```


    Your machine will respond by defining the variable test, and then running the
    tar command for each file you gave to work with. Inside the foreach command loop,
    you will note the use of the expression $test. foreach goes through the list of
    filenames you gave, and puts each sequentially in the test variable. To use the
    contents of a variable in the shell, pull a $ sign before it. For example, foreach
    first puts mydirectory in the test variable. It then runs the tar command, and
    the shell expands the test variable to mydirectory. The tar command that gets
    actually looks like this: tar -cvf mydirectory.tar mydirectory. The next time
    the foreach loop puts yourdirectory in the variable test, and the process is repeated.


    You can use regular expressions in the shell instead of enumerating the filenames
    using the foreach command. If you notice in the previous example, all the directories
    you want to tar actually have part of their names in common—directory in this
    instance. If you want to produce the same results without having to enumerate
    all the directory names to foreach, you could issue the foreach command as foreach
