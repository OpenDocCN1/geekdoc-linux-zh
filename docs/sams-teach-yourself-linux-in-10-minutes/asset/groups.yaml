    # CONFIGURING X WINDOWS


    Most configuration of X Windows is handled by a server resource database. When
    a client makes a request of the server, the server checks this database to determine
    user preferences for that client. The server resource database is loaded on a
    per-user basis via the xrdb command, which should be executed automatically after
    starting X11. xrdb loads configuration information from a dot file, usually named
    .Xdefaults. .Xdefaults discussed in Lesson 16, “Modifying the User Environment.”
    .Xdefaults usually contain lines similar to the following:


    ```

    xbiff*onceOnly:                 on

    xbiff*wm_option.autoRaise:    off

    xbiff*mailBox:                  /usr/spool/mail/mymail

    ```


    If you included these lines in your .Xdefaults you would be telling your X server
    that if xbiff (an X11 program that notifies you when you have new mail) starts,
    it needs to set certain options.


    - **Line 1**—Sets an xbiff specific option regarding the frequency of ringing
    the bell to notify you.

    - **Line 2**—Sets an option regarding the window manager’s treatment of xbiff.
    It specifically tells the system not to run xbiff to the front if it’s behind
    other windows when it needs to notify you. (Remember, X11 provides the display
    and a separate program provides management of things such as window controls.)

    - **Line 3**—Tells xbiff where to find the mailbox that it’s supposed to look
    at.


    Because each client support different options and allows the window manager different
    levels of control, you’ll need to consult each client’s documentation to learn
    what you can configure and what you need to do it.


    In addition the server resources database, clients frequently have command-line
    options that can control the client’s interaction with X11. Start an xterm with
    the following command:


    ```

    > xterm -fg "black" -bg "white" -fn 6x10 -geometry 85x30+525+1

    ```


    While starting an xterm, this command also sets the foreground color to black,
    the background color to white (black text on a white window), and tells the system
    to use a 6x10 point font. It also sets the geometry information that the window
    is 85 characters wide and 30 characters high, and is placed 525 pixels from the
    left edge of the screen and 1 pixel down from the top.


    Again, different programs have different options available and your local documentation
    is your best source for up-to-date information on your exact configuration.


    # WINDOW MANAGERS


    Because Windows provides only rudimentary user interface component functionality,
    an additional program is required to provide a useful user interface. This program
    is the window manager. Depending on the distribution of Linux you are running,
    you might have a number of options for different window managers. Each provides
    slightly different features with accordingly strengths and weaknesses.


    # twm


    One of the most common and least-featured window managers is twm. twm, shown managing
    the display in Figure 3.1, provides very basic window management functions. Unfortunately,
    it is present or available on almost all Linux implementations. If you work in
    a multiplatform environment with different flavors of Linux or UNIX, you might
    find twm to be convenient, because your configuration can be identical on all
    the machines. For its simplicity, twm also provides one of the most user-extendable
    interfaces of all the window managers. If you like, you can create your own standard
    buttons that appear in your window title bars and execute arbitrary commands.
    You can build your own pop-up menus, automatically execute commands when the cursor
    enters windows, customize window manager colors and actions by application name
    and application type, and perform a host of other customizations. To start the
    twm window manager, execute twm after starting X (you should be able to do this
    automatically in your .xinitrc). The control file for all this customization is
    named .twrc and should be located in your home directory.


    # Iconized Active Applications


    # twm Title Bar


    ![](img/a0e6136ea1c86032b26127d28a7bd962_41_0.png)


    Iconize/Resize Buttons


    User-Defined Buttons


    **Figure 3.1** twm managing an X Windows session.


    As you can see in Figure 3.1, twm allows you to have a number of windows open
    at once. During window layering, windows might be partially covered by one another,
    you can focus input to the hidden windows, allowing you to work in any open window.
    Active applications that have been iconized can be clicked to be expanded once
    again to return to their normal size.


    # OTHER WINDOW MANAGERS


    Other window managers you might encounter include


    - **mwm**—The Motif window manager. Many commercial window managers are based
    on, or try very hard to emulate, mwm.

    - **4dwm**—The default window manager for SGIs running IRIX.


    # THE GRAPHICAL USER INTERFACE 31


    - **tvtwm**—An experimental extension of twm that includes the capability to set
    up virtual screens.

    - **afterstep**—A popular Linux window manager that emulates the look and feel
    of the Next operating system.

    - **fwm95**—No one can really agree that the f stands for, but this window manager
    looks almost identical to Windows 95/98/NT.


    There are many other window managers, and a variety will most likely be available
    to you for use on your machine. After you''ve investigated your options you can
    start building a custom environment that feels and behaves as you want it to.


    Remember, the window manager provides user interface features such as title bars.
    If you find yourself facing a screen that looks like Figure 3.2, it is because
    there is no window manager running (either it hasn''t started for some reason,
    or it has crashed). You can try typing a window twm if there is a terminal window
    open that is accepting keyboard input (directing keyboard input to a particular
    window is also a window manager function). If not, you''ll need to exit the X
    Window System and modify your startup files immediately after starting the X server.


    ![](img/a0e6136ea1c86032b26127d28a7bd962_42_0.png)


    FIGURE 3.2 This Windows session has lost its window manager.


    # DESKTOP ENVIRONMENTS


    Historically, window managers have only been used to manage the user''s screen.
    However, a new type of application is emerging and functions not only as a window
    manager in the classical sense, but also provides additional functionality to
    the user. These desktop environments typically provide sophisticated window management
    as well as a sort of desktop, which is reminiscent of the MS-Windows or Macintosh
    interface. The desktop frequently includes file management functionality, the
    capability to create and use icons to launch applications, and an integrated suite
    of graphical tools for the management and configuration of the computer.


    As Linux vendors try to make their machines more convenient to use, you can expect
    these desktop environments to become more sophisticated, and even today the power
    and simplicity are quickly approaching that of the popular personal computer interfaces.


    While some of the industry heavy-hitters like Sun and SGI have weighed in with
    significant offerings such as OpenWindows and the IRIX desktop, one of the most
    significant contributions is being made by a non-profit Internet collaborative
    effort that is developing the freeware product KDE. KDE is a freely available
    and downloadable desktop environment that is compatible with a wide range of Linux
    distributions.


    # KDE


    KDE stands for the K Desktop Environment, and according to the authors the K doesn''t
    stand for anything. KDE continues to be developed and within the past two years
    has matured into a very flexible and attractive environment for Linux users. Some
    distributions of Linux, such as Caldera''s OpenLinux, include KDE.


    > According to the KDE FAQ, KDE is currently known to support Linux, Solaris,
    FreeBSD, IRIX and HP-UX, and is expected to be compatible on almost anything that
    uses the gnu gcc compiler.


    # THE GRAPHICAL USER INTERFACE


    KDE provides a sophisticated window manager with convenient extensions such as
    multiple virtual screens, user-customizable menus, and a facility to automatically
    remember programs and their placement on the screen between login sessions.


    In addition, KDE provides a desktop environment that supports, among other things,
    icons for files and directories, an application dock, and a quick launch button
    bar. As you can see in Figure 3.3, the user interface that KDE provides is significantly
    more user-friendly than the twm (and other typical window manager) interfaces.


    ![](img/a0e6136ea1c86032b26127d28a7bd962_44_0.png)


    Figure 3.3 KDE makes X Windows friendly.


