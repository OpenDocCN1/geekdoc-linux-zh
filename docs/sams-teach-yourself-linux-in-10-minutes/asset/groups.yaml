    # # THE .FORWARD FILE


    If you want email that comes to your account to automatically send itself somewhere
    else, you can make use of the .forward file. Not only the .forward file be used
    to forward your email to another email address, but it can also be used to forward
    your email into other programs, if you want to use software to process your email.'
  - '[PAGE 178]


    # ACCESSING NETWORK RESOURCES


    The format of the .forward file is simple:


    To forward your email to another email address, create a file named .forward in
    your home directory. In this file, put a single line containing the address to
    which you''d like your mail forwarded. Execute the command chmod 644 ~/.forward
    to set the permissions properly and you''re finished. All email coming to your
    account will be forwarded to the new address


    To forward your email into a program for automatic processing, create the .forward
    file in your home directory. Put a single line containing the pipe character |
    followed by the path to the program you want to use. Run chmod on the file as
    the preceding example, and you''re done. Incoming email will be piped into whatever
    command you put in the .forward file.


    # SUMMARY


    In this lesson, you were introduced to a sampling of tools that let you make use
    of the network resources around you and around the world. As you explore Linux,
    you''ll find that this was really only a small sampling, and that there are new
    tools for you to use appearing constantly. Some will be replacements or upgrades
    for the commands outlined here, others will be completely new. Don''t be afraid
    to try them out. Here''s a quick review of this lesson''s key points:


    +   - telnet-Connects you to remote machines; if you have different accounts on
    different machines, you''ll probably find yourself using frequently.


    +   - rlogin-Also connects to remote machines, but is more useful than telnet
    if the machines you work on are configured to allow you to login between them
    without giving a username or password.


    +   - login-Provides security for remote connections. If you have it, use it.
    The network is becoming a very scary place with people breaking into Linux machines
    daily. Using the secure connection provided by login will protect your network
    traffic from prying eyes.'
  - '[PAGE 179]


    +   * trn and rn—Read Usenet newsgroups. Newsgroups can be a lot of fun and useful
    for finding information, but also can be a big drain on your time.


    +   * ftp—Connects you with FTP servers and lets you transfer files around the
    world.


    +   * smclient and smbmount—Allow you to interact with Windows-based file sharing
