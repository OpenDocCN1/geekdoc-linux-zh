    # SUMMARY


    Linux has tons of built-in utilities. In this lesson, you learned about several
    of the programs that modify information related to your account profile, as well
    as a few utilities to monitor the state of your computer and who is currently
    using it. Take a look at what else is discussed in this lesson:


    - passwd/yppwd—The passwd command changes your account password. If you''re in
    an environment with networked Linux computers, you may have to use the yppwd command
    instead.

    - chsh—Use the shell command to change your current shell. If you don''t know
    which shell you want to switch to, you can use chsh -1 to list the available shells
    on your system.

    - finger—This command looks up personal information about an account on your computer
    or a remote computer. finger is sometimes disabled for security reasons, so you
    may not be able to use finger to get the results you expect.

    - chfn—Change information using this command. This lets you change your full name,
    as well as the office address and office/home phone numbers in your account profile.

    - date—Simple enough, date displays the current day and time on your computer.

    - uptime—The uptime command provides a summary of information about the state
    of your operating system, including the length of time it has online, the number
    of users logged on, and the average load on your system for the past 15 minutes.

    - who—lets you see all the users who are logged in to your computer, the date
    that they connected, and what network address they are connected from. If your
    machine seems slow, you might want to use who to find out where the processor
    is going.

    - Other utilities—There are far too many utilities on the system to cover them
    all in this book. Luckily, the man pages provide extensive documentation for most
    programs on the system. In addition, KDE has its own comprehensive documentation
    system.


    # LESSON 16


    # MODIFYING THE USER ENVIRONMENT


    In this lesson, you''ll learn about the tools you need to modify your environment
    and the way that some commands work for you.


    There are a vast number of programs that all work together to create the Linux
    user experience; it''s because of that you''ll need to learn to use the tools
    from this lesson in conjunction with the documentation for your programs to make
    the modifications you desire.


    > Shell Assumption This lesson is going to assume that you''re using bash as your
    shell. If you are using a different shell, some of the syntax will need to be
    changed, but the ideas remain the same.


    # ALIASES


    One of the most useful features that shells provide to the user is the ability
    to create command aliases. Aliases are, quite simple, aliases. If for example,
    you''re a long-time DOS user, you might find yourself typing del instead of rm
    to delete files. Want to change this? Set an alias with the alias command. The
    syntax is alias <name> <command to run>. If you''d actually like to make that
    alias for del, you would type alias rm. After setting this alias, any time you
    type del, it will execute the rm command.


    More useful than simply renaming commands, you can use the alias command to create
    meta commands that enforce certain options. For example, it''s always a good idea
    to force rm to be in Interactive mode (rm -i). To do this with an alias, you can
    type alias rm ''rm -i'' (note the direction of the single quotes). Now whenever
    you type rm, it will actually execute rm -i instead.


    If you''d like to get really sophisticated with aliases, you can even build little
    multi-command scripts inside aliases. For example, consider the situation where
    you want to access two different news servers from your account. In this case,
    perhaps it''s a public server for regular Usenet newsgroups, and a corporate server
    for internal news. The trn commands only understand one news server at a time,
    and worse, save the "what I have" information in a file with a fixed name. What
    to do? Use the alias command to automate things for you. The following two aliases
    will solve your problem.


    - alias readcorporate export NNTPSERVER=server.big.company.com;

    ```bash

    cp ~/.corp-newsrc ~/.newsrc;

    trn;

    cp ~/.newsrc ~/.corp-newsrc

    ```

    - alias readpublic export NNTPSERVER=public.newsstand.com;

    ```bash

    cp ~/.public-newsrc ~/.newsrc;

    trn;

    cp ~/.newsrc ~/.public-newsrc

    ```


    # LESSON 16


    What do they do?


    - The first line of each sets an environment variable which tells trn where to
    look to get its news. More on this in the next section.

    - The second line of each copies a setting file to the file .newsrc in your home
    directory. The trn command uses the file .newsrc to keep track of what you''ve
    read and what is new news. If you''re using two servers with two different sets
    of newsgroups, you unfortunately can''t use the same .newsrc file, so you''ll
    need to keep two of them around and let the alias copy the correct one for when
    you need it.

    - The third line should be self-explanatory. The trn command reads Usenet newsgroups.
    A little more on this in Lesson 18, "Accessing Network Resources."

    - The fourth line might be a bit of a mystery at first, but it''s really quite
    simple as well. Because the trn command will update the .newsrc file with information
    on what you have read, you might want to use who to find out where the processor
    is going. Wait, checking context...


