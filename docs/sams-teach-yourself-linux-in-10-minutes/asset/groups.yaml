    Shell: /bin/bash

    On since Sun Nov 29 16:35 (EST) on typ0 from 192.168.0.91

    6 hours 47 minutes idle

    No mail.

    No Plan.

    ```


    There isn''t much of interest that is returned here. This is because I haven''t
    set any personal information yet. You can see, however, how long I''ve logged
    in to the system, as well as my real name and my home directory. I can add personal
    information to my account profile with chfn.


    # USING chfn


    The chfn command runs an interactive process that enables you to set some personal
    information for your account. Run chfn on a command line without any options.'
