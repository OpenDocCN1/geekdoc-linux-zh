    it starts automatically when the machine boots. If your system does not automatically
    start X, you will need to start it manually after you log in. The two most common
    ways to do this are the xinit program and startx shell script. Startx (and its
    variants) is usually a shell script that automates some of the calls to xinit,
    and would be a good place to start browsing if you''re curious about how things
    are done and what options are available. (Shell scripts are covered in Lesson
    14, “Basic Shell Scripting.\)'
