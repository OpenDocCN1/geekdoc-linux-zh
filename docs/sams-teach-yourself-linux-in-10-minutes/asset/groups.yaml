    # LESSON 15

    USER UTILITIES


    In this lesson, you will learn how to change your password, shell, and other Linux
    information.


    Linux provides a wealth of utilities that help you control the information that
    the system stores for your user account. In this lesson, you''ll see how to monitor
    the use of your system through some useful command-line utilities.


    ## CHANGING YOUR PASSWORD: passwd

    AND ypppasswd


    One of the most important things you''ll need to do in a networked environment
    is change your password. Passwords should generally be changed on a somewhat frequent
    basis in order to maintain a secure environment. There are two ways that a password
    can be changed. If you are in a networked environment you might have to use the
    ypppasswd which will update your password on all of the networked machines. The
    most obvious way of telling if this is the sort of environment you''re working
    in is if you can log in to multiple computers with the same username and password
    and access the same information. This is a common setup for Linux/UNIX computer
    labs. If your machine is an isolated Linux computer, just use the passwd command
    and you should be fine. Both operate in an identical manner; it is where the updated
    password is stored that is different.


    For example:


    ```

    >passwd

    Changing password for jray

    Old password: ******

    New password: ******

    Retype new Linux password: ******

    passwd: all authentication tokens updated successfully

    ```


    The passwords you type are not echoed to the display as you type them. I''ve included
    a few asterisks to show that typing is taking place. If the password change is
    successful, Linux will indicate that with the All authentication tokens updated
    successfully message. Linux, in some cases, will keep you from choosing certain
    passwords if they are too short, or based on words in its built-in dictionary
    file. You should choose passwords that are not based on common words and that
    mix letters, numbers, and letter cases.


    ## CHANGING YOUR SHELL: chsh


    In the beginning of this book, you learned that there are a variety of different
    shells that you can run. Now you''re going to learn how to change them. The chsh
    command lets you choose one of the shells that is registered for use on the machine.
    Before you actually change the shell, you might want to see the shells that are
    available on your computer. Do this with the chsh -l command.


    ```

    >chsh -l

    ```


    ```

    /bin/bash

    /bin/sh

    /bin/ash

    /bin/bsh

    /bin/tcsh

    /bin/csh

    /bin/ksh

    ```


    There are currently seven different shells that I can choose from. I''m going
    to go ahead and change to ksh from my current choice, bash.


    For example:


    ```

    >chsh

    Changing shell for jray. *****

    Password: *****

    New shell [/bin/bash]: /bin/ksh

    Shell changed.

    ```


    The next time I log in to Linux, I''ll be in ksh instead of bash. You probably
    won''t ever need to change your shell, unless the default shell on your system
    is the Bourne (sh). If you''d like to try other shells, feel free. You can always
    change back.


    ## GETTING AND CHANGING USER INFORMATION: finger and chfn


    Each user has a few pieces of information about his or her location stored as
    part of the system password file. This enables other users to quickly find the
    information necessary to contact them. The command that displays this user data
    is finger. Because the user information is stored when the user account is created,
    chances you don''t have any information set for your account. In order to change
    that, you''ll use chfn.


    ## USING finger


    Using the finger command is simple. Just use finger <username> to get information
    about a user who is local to your system. To get information about someone on
    a remote system, you can try finger <username>@<remote host>. Depending on how
    the remote host is configured and the type of remote host, it might or not work.


    For example:


    ```

    >jray@poisontooth.com


    [poisontooth.com]

    Login: jray

    Directory: /home/jray

    Shell: /bin/bash

    On since Sun Nov 29 16:35 (EST) on t0 from 192.168.0.91

    6 hours 47 minutes idle

    No mail.

    No Plan.

    ```


    There isn''t much of interest that is returned here. This is because I haven''t
    set any personal information yet. You can see, however, how long I''ve logged
    in to the system, as well as my real name and my home directory. I can add personal
    information to my account profile with chfn.


    ## USING chfn


    The chfn command runs an interactive process that enables you to set some personal
    information for your account. Run chfn on a command line without any options.


    ```

    >chfn

    Changing finger information for jray.

    Password: *****


    Name [John Ray]: John Ray

    Office [:]: 7789 Rhapsody Drive

    Office Phone [:]: (614) XXX-XXXX

    Home Phone [:]: (614) XXX-XXXX

    ```


    I can change or set my full name, my office address, and home and office phone
    numbers. There isn''t much of interest that is returned here. This is because
    I haven''t set any personal information yet. You can see, however, how long I''ve
    logged in to the system, as well as my real name and my home directory. I can
    add personal information to my account profile with chfn.


