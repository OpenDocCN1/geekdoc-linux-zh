- md: '

    # SUMMARY


    Your Linux computer is filled with tons of documentation and HOWTO files. Unfortunately,
    a HOWTO on how to read files isn''t going to do you much good. This lesson gives
    you a clear picture of the many different ways you can display files or portions
    of files. Following is a review of some of the key points from this lesson:


    - cat—The concatenate command displays all the files you specify, one does not
    pause at the end of pages.

    - more/less—more and less are known as pagers. They page through their input files,
    one screen at a time. less offers the capability to scroll backward through files,
    unlike more, which provides forward-only viewing.

    - head—Displays the first few lines of a file. This is useful when you''re trying
    to look at header information in files such as email messages.

    - tail—Views the end of a file. Used with the -f option, tail provides the capability
    of displaying a logfile as it is generated. Rather than each program needing its
    own monitoring utility, tail -f can be used instead.

    - Other file formats—Although most Linux information files are text- or HTML-based,
    there are other formats that you might encounter. This lesson looks briefly at
    some of those formats, and the programs that you can use to work with them.


    ## LESSON 8

    TEXT EDITING


    In this lesson, you will learn the basics of editing files in the Linux environment.


    Many Linux programs use text files as input, create text files as output, or are
    configured commands and variables set up in a text file. In order to change the
    contents of these files you need to use a text editor.


    As a matter of fact, most Linux software doesn''t know the difference between
    a text file and any other file. From the operating system''s point of view, files
    are files are files. If the user chooses to view some of them as containing text,
    and others as containing programs, that the the user''s business. An interesting
    consequence of this lack of concern over a file''s contents is that the operating
    system is just as happy to let you use a text editor to edit the contents of your
    spreadsheet program as it is to let you attempt to run your email. Of course,
    if you actually execute permission set on your email and try to run it, it''s
    almost certain to segmentation-fault (crash) immediately, but Linux will try.


    > Advantage If you are a programmer you might find this lack of a distinction
    to be useful. On occasion, you might find a program that needs a minor change,
    such as correction of a misspelling or a change of wording. In this instance,
    it is sometimes most convenient to load the executable file into a text editor
    and make the correction directly in the binary. This isn''t a trick for the faint
    of heart, but sometimes, it''s the quick fix you need...and sometimes it''s the
    only fix for software that you don''t have the source code for.


    ![](img/a0e6136ea1c86032b26127d28a7bd962_89_0.png)


    If you spend much time discussing Linux editors with long-time Linux users, you''ll
    find that there is a disagreement of warlike proportions between the users of
    the two most common editors—vi and emacs. While these editors are actually rather
    complementary in their functions and are both useful tools to have in your toolbox,
    chances''ll end up running into many users who insist that one or the other is
    completely useless. If you listen to them, you''ll be depriving yourself of the
    better solution to at some tasks.


    Most Linux editors have immense power. emacs, for example, contains not only its
    own built-in programming language, but can also function as a complete windowing
    system for users who are stuck on text-only terminals. However, there is not enough
    room in this quick guide to cover more than the basics. After mastering the simple
    tasks presented here, the interested reader should make a trip to the library
    or bookstore and choose from among the several books available on each of the
    most popular Linux editors.


    ## QUICK AND DIRTY EDITING: vi


    The vi is Linux''s most universal editor. Some users pronounce it ve-eye; others
    pronounce it vye. (There seems to be no consensus, but the people who call it
    vye are still wrong!) vi isn''t an easy editor, and it isn''t a friendly editor.
    What it is, however, is a quick-starting editor with very small memory footprint
    that you will find on every Linux machine.


    Because of its ubiquity, knowing to use vi


    1. Determine what file you want to edit.

    2. Issue the command as vi <filename>. vi can also be started without a filename
    if you prefer.


    After you start vi, it operates in two modes: Command mode and Insert mode.


    In Command mode, you have control of things such as deleting and saving. In Insert
    mode, you can insert characters. This distinction might be confusing at first,
    but you''ll find enough things to make it useful.


    ### Table 8.1 Common vi


    | Mode | KEY(s) | Action |

    | :--- | :--- | :--- |

    | Command | l | Move right |

    | Command | h | Move left |

    | Command | j | Move to next line |

    | Command | k | Move to previous line |

    | Command | x | Delete a character |

    | Command | dd | Delete an entire line |

    | Command | a | Append to the end of line |

    | Command | i | Enter Insert mode |

    | Command | :w | Save the file |


    ### Table 8.2 Common vi Actions


    | Mode | KEY(s) | Action |

    | :--- | :--- | :--- |

    | Command | :q | To exit |

    | Command | :q! | Quit without saving |

    | Insert | Esc | Back to Command mode


    If you need to use vi, you should try the following:


    ```bash

    > vi myfile

    This is my new file

    This is line two of new file

    This is a test

    This is line four of new file<esc>dd

    This is line three of new file<esc>A

    This is a new file<esc>:wq!

    ```


    Your machine should respond


    ```bash

    > cat myfile

    This is my new file

    This is line two of new file

    ```


    ## 82 LESSON 8


    This is line three of new file

    This is line four of new file


    ## THE KING OF EDITORS: emacs


    On the other end of the spectrum it vi''s odd syntax and tiny footprint is emacs.
    In certain circles it is thought that emacs is an acronym for “emacs makes a computer
    slow,” as emacs is certainly the editor of all editors. Including an email-reading
    client, a news-reading client, a programming language, and a name few of its features,
    emacs can certainly do anything that you want an editor to do. With today''s faster
    machines and almost unlimited memory, emacs might even be capable of doing its
    job fast enough that you don''t need a coffee break before it starts.


    From the point of view of the average user, emacs has a much more intuitive interface
    than vi. You are almost in Insert mode, and control functions are handled by using
    control-key sequences instead of a separate mode. To use of emacs, you need to


    - Determine the name of the file you want to edit.

    - Issue the emacs command as emacs <filename>.

    - The emacs editor can also be started without a filename if you want to create
    a new file.


    After you''ve started emacs, you''ll need to know some basics to make it useful.
    In the following list, whenever you see Ctrl hold down the Ctrl key and that character.
    You hardly need the list that follows because emacs starts up by immediately giving
    a list of ways to get it.

