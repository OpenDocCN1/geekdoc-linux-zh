    ## REDIRECTION


    To accommodate the user in its streams-of-information-based view of the world,
    Linux defines certain concepts to which programs must adhere. Specifically, Linux
    defines several information connections for every program, and allows the user
    to manipulate the source and destination of these connections.


    ## STDIN


    The input connection for a program is called STDIN (standard input). A program
    can expect the incoming data stream from the user (or whatever) will appear at
    STDIN.


    When you interact with a command-line-based program, the program is reading the
    data you are entering from STDIN. If you prefer not to enter the data by hand,
    you can put it in a file and redirect the file into the program''s STDIN.


    A program that you can use for an example is spell. The spell command finds misspellings.
    Given input on its STDIN, spell parses through it, checks the input against a
    dictionary, and returns any misspellings it finds. Issued from the command line,
    you can type


    - `> spell


    ```

    Now is the time for all good kiwis to

    come to this side of some very good Linux users

    <Ctrl+d>

    ```


    The Ctrl+d finishes the input, and spell gets to work, returning the following:


    -   time

    thie

    side


    As you might expect, each of the misspelled words is returned. At first glance,
    this might not appear to be a particularly useful program; however, the spell
    program doesn''t care whether it was typing the input to it, or whether the input
    came from a file.


    ## 118 LESSON 12


    ![](img/a0e6136ea1c86032b26127d28a7bd962_129_0.png)


    Working with spell: Actually, it''s more proper to think of the spell program
    as not caring whether the input comes from a file or if a user types it. The spell
    program was designed to work with input coming from a file or it just happens
    that because of the input/output model, it doesn''t mind if the input comes from
    a user instead. Many programs you''ll find on Linux fall into the same category—they
    are designed to take input or output to or from other programs and files. It is
    only the input/output model that allows user interaction with the software, and
    because of this, you will occasionally find the syntax with which some of these
    programs converse to be slightly odd. Just remember, they wer not really designed
    to talk to users.


    Use your favorite text editor to create a two-line file containing the same text
    you typed earlier, and then try spell by redirecting its STDIN. If you named your
    file reallydumbfile, you can run spell on it by typing


    ```

    spell < reallydumbfile

    ```


    time

    thie

    side


    The < character directs the contents of the file to the right of the character
    into the STDIN of the command to the left.


    ## STDOUT


    The output connection, which Linux provides for programs, is called STDOUT (standard
    output). Just as you can redirect STDIN from a file, if you want to send the output
    of a command to a file, you can also redirect STDOUT. The > character directs
    the STDOUT of the program to the left of the character into the contents of the
    file to the right of it. For example, if you like looking at the contents of your
    Web server log file, and you want to put the last 30 lines into a file named kiwis-logs
    so that you can edit them, you can use the following command:


    ```

    tail -30 /var/log/httpd/access_log > kiwis-logs

    ```


    This example directs the shell to create the file kiwis-logs and put the STDOUT
    from the tail command into it. If kiwis-logs already exists, the file is erased
    before the data is put into it.


    If some reason you collect the end of the log file periodically, you might want
    to have a complete archive of it. You can direct the shell to append the data
    to the file, rather than having it clear the first time. To do this, use the command
    as


    ```

    tail -30 /var/log/httpd/access_log >> kiwis-logs

    ```


    >> appends the STDOUT of the program to the left of the character pair into the
    file to the right of the character pair.


    Of course, you can combine these redirections; if you want to check your spelling
    and save the results in a file, you can return to your spell command like this:


    ```

    spell < reallydumbfile > reallydumbspellings

    ```


    ## STDERR


    To make your life easier, Linux actually has two different output streams of data
    that it defines for programs. The first, STDOUT, you already know about the second,
    STDERR, is used to allow the program to provide error messages to the user. If
    the user is redirecting STDOUT and the program can only put errors on STDOUT,
    the user might never see the errors because they will all go into the redirected
    file. Instead, programs can use STDERR for errors, and if the user has not redirected
    it, they can still see error messages and warnings while STDOUT is headed into
    another file or program.


    If you''d like to put STDERR into the same file in which you are storing STDOUT,
    use & instead of > in the command.


    ```

    spell < reallydumbfile & reallydumbspellings

    ```


    ## PIPES


    Not only can Linux redirect STDIN and STDOUT to and from files, but because these
    are data streams to Linux, it also allows you to pipe the output of one program
    into the input of another. To create a pipe, you use the | character.


    Consider the example of collecting the tail of Web logs. If you aren''t satisfied
    with just emailing it to your friends as in the previous example, you can use
    the pipe to save it to a file at the same time. You could use


    ```

    tail -30 /var/log/httpd/access_log | tee kiwis-logs | mail friend@somewhere.com

    ```


    This helps you if you want to save the tail of the file in kiwis-logs and send
    it to your friend. One immediately useful thing to do with pipes is to pipe the
    output of particularly verbose programs into a pager (more, or less). For example,
    if you''d like to page through an ls listing, you can pipe it into more:


    ```

    ls -laF | more

    ```


    You will see a particularly long listing of files. Because that''s a complete
    recursive listing of file system in long format, you''re not going to use that
    particular command too often. But any time you''d like to page through any output,
    you can pipe it into more (the pager you learned in Lesson 7, “Reading Files”).


    ## SPLITTING A PIPE: THE tee COMMAND


    On occasion, you might have a reason to direct STDOUT to a file while continuing
    to send it down a pipe to another program. In this case, you can use the tee command.


    Consider the now-becoming-tedious example of collecting the tail of Web logs.
    If you aren''t satisfied with just emailing it to your friends as in the previous
    example, you can use the tee command to save it to a file at the same time.


    ## SUMMARY


    In this lesson, you were introduced to the Linux model of process input and output,
    and to the easy way in which Linux allows the user to connect programs together
    to accomplish complex tasks.


    - Every program has a STDIN, a STDOUT, and a STDERR. Not all programs use them
    for user interaction (programs like Photoshop just dont lend themselves to command-line
    control), but for the vast majority that do, input and output connections can
    be manipulated.

    - You can provide the input data that a program expects on STDIN by hand, from
    a file, or from another program.

    - You can send the STDOUT and STDERR of a program into a file if you''d like to
    collect it for future use rather than view it as it is produced.

    - You can pipe the STDOUT of one program into the STDIN of another.

    - One immediately useful thing to do with pipes is to pipe the output of particularly
    verbose programs into a pager (more, or less).

