    # whereis


    The whereas command performs a quick search on a preset number of directories
    and returns paths to source code, binaries, and man pages for the file you specify.
    It is less useful as a general Find utility than find or locate, but might still
    come in hand.


    For example


    ```

    >whereis time

    time: /usr/bin/time /usr/include/time.h /usr/man/man2/time.2

    ->/usr/man/man/time.n

    ```


    The whereas command shows that the binary is located in /usr/bin/time, whereas
    the header file is in /usr/include/time.h. Two man pages are also returned. If
    you''re interested in finding where programs and their associated files are located
    on your machine, whereis might do the trick.


    # which


    Lastly, the which command can also help you locate files that are contained within
    one of the directories specified in your PATH environment variable. Lesson 16,
    "Modifying the User Environment," discusses how you can go about configuring this
    variable. You can invoke which like you did whereis; just supply a filename for
    it to find.


    For example


    ```

    >which time

    /usr/bin/time

    ```


    Linux returns the full path to the time command. which is the least configurable
    of the commands you''ve seen so far, but it is also the fastest. If you''re ever
    trying to remember where a program is located, give which a shot.'
- md: "\n# FINDING FILES CONTAIN A WORD OR PATTERN\n\nOne of the most powerful built-in\
    \ programs in Linux is grep. The grep command enables you to quickly search through\
    \ the body of files for a particular word or pattern. It can search in three flavors:\
    \ grep, egrep, and fgrep. The differences between these versions are based on\
    \ the complexity of regular expressions they can handle. (Regular expressions\
    \ define a pattern of text that can be used to search files when a specific word\
    \ or phrase for search might not be known. You will learn more about regular expressions\
    \ in Lesson 13, \"Regular Expressions.\") The fgrep command is the fastest of\
    \ the three, but handles the least complex expressions. To be safe, you can always\
    \ use plain grep, which should work the same in every case, on every system. So\
    \ how do you use this wonderful tool? Give it the word or pattern to look for\
    \ and the files it should search:\n\n- Choose the word or phrase you want to locate.\n\
    - Find the filename to search. If it is in another directory, you must specify\
    \ the entire pathname. You can also use wildcards to search multiple files, if\
    \ you want.\n- Type `grep <pattern to find> <file or files to search>` at the\
    \ command prompt.\n\nFor example:\n\n```\n>grep \"jray\" *.txt\n8979-10.txt:<manager>=jray\n\
    log.txt: Access by jray on 11/12/98\nkiwi.txt: jray loves to eat kiwi. But don't\
    \ think it would be\n```\n\nThis example searches for jray in any file that ends\
    \ in .txt. It has turned up three files (8979-10.txt, log.txt, and kiwi.txt) that\
    \ contain the string; each filename is followed by the text that contains jray.\
    \ Two options you might want to consider adding to grep are -i to ignore case,\
    \ and -n to display the line numbers of the match in each file. You might add\
    \ these flags to the command line, immediately following the grep command.\n\n\
    grep is an extremely valuable tool that will become even more valuable when you\
    \ later learn about regular expressions. Remember to come back to this lesson\
    \ to test some of the things you'll learn in Lesson 13.\n\n# USING THE KDE Find\
    \ FEATURE\n\nFor those of you who are running KDE, you'll be glad to know that\
    \ it has a built-in Find utility that offers many of the same features of the\
    \ command-line versions of find and grep. KDE has provided a friendly face to\
    \ these functions that would seem quite familiar to anyone who has run a search\
    \ under Mac OS or Windows computers. The KDE Find utility is shown in Figure 5.1.\n\
    \n![](img/a0e6136ea1c86032b26127d28a7bd962_68_0.png)\n\nFigure 5.1 KDE provides\
    \ a friendly interface to the UNIX Find and Grep utilities.\n\nTo search in KDE:\n\
    \n1. Click the K toolbar icon to bring up the main KDE find.\n2. Choose Find Files.\n\
    3. Select the appropriate search criteria from one of the three tabs.\n4. Click\
    \ the small Magnifying Glass icon in the Find utility bar to locate the matching\
    \ files.\n\nThere are three different tabs in the Find File utility that conduct\
    \ three different types of searches:\n\n- Name & Location—If you're searching\
