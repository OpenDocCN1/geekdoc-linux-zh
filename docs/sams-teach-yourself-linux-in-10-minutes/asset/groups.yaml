    # 引言


    # 所以你想学习 LINUX


    多年来，UNIX 被广泛认为网络操作系统。它为你可能已经熟悉的大多数互联网服务提供了支柱。随着互联网（以及整个网络）变得越来越普遍，对操作系统的需求也随之增加。然而问题在于，虽然传统的
    UNIX 版本提供了人们所需的功能，但它们的成本通常非常高。Linux 诞生了！


    Linux 是（你可能知道！）一个类 UNIX 的系统。它由林斯·托瓦尔斯（Linus Torvalds）开发，并在他的指导下持续开发。全球有数千人在为 Linux
    开发工作贡献力量。它与其他操作系统的不同之处在于，这些人开发 Linux 是因为他们想做，而不是因为这是他们的工作，也不是因为这是他们的职责。结果是一个备受喜爱的操作系统——而且它是完全免费的。


    Linux 根据 GNU 公共许可证（GNU Public License）发布，该许可证要求其源代码必须免费。等一下，不是有公司在销售 Linux 吗？是的，有很多。这些公司提供了增加了额外功能的
    Linux 版本，并包含了打印文档。尽管如此，这些商业版本通常作为完全免费下载提供（不含文档和支持）。


    除了免费之外，凭借其 UNIX 基础，Linux 还是一个非常强大的操作系统。它提供了保护内存、抢占式多处理和完整的多用户环境。你可以用它提供文件、网站和电子邮件——几乎是你想要的任何东西。与其他服务器操作系统不同，Linux
    的系统要求极低，可以在已被废弃的硬件上运行。此外，它运行在各种不同的系统上。Linux 并不是为每种电脑都配备一个专有系统，而是适应了许多不同类型的 CPU——从
    Alpha 到 Intel Pentium 再以及 IBM/Motorola PowerPC。这意味着你可以在你的 Mac 上运行与你在 Dell 或 Gateway
    上运行相同的系统……这难道不很奇妙吗？


    # 如何使用这本书


    对许多人来说，Linux 可能会让人感到有些畏。操作系统的力量在于命令行。UNIX，因此 Linux，对初学者来说可能是晦涩的。这正是本书大显身场的地方。《十分分钟自学
    Linux》（Teach Yourself Linux in 10 Minutes）以一种丰富且易于理解的方式向你介绍基础 Linux 命令。当你读完这本书时，你将熟练掌握命令行，并拥有通过
    Linux 丰富的内置帮助系统找到你可能需要的任何其他信息的知识。此外，你将学习 KDE 用户界面，这是一种优雅且功能强大的点点式操作环境，它正迅速成为 Linux
    的桌面标准。


    你可以将这本书粗略分为几个部分。前五节课让你熟悉 Linux 环境并导航 Linux 文件系统。下一组课程帮助你学习文件工具，随后的两组课程将为你提供操作
    Shell（外壳）和自定义环境的基础知识。最后两部分帮助你学习与外部世界通信，并让你了解 Linux 更高级的主题。我还包含了一个附录，提供了关于如何选择适合你的
    Linux 发行版的指导建议。


    我希望这本书能教你所需的技能，以释放这个世界上增长最快的操作系统之一：Linux 背后的力量。


    # 本书使用的符号约定


    本书使用了以下约定：


    - 你输入的信息将以**粗体等宽字体**显示。

    - 屏幕输出以等宽字体显示。

    - 菜单和菜单选项、你按的键以及你可能交互的按钮名称和其他屏幕组件将以**蓝色粗体**显示。

    - 回车键（Return key）与 **Enter** 键是同义词。


    此外，本书还使用了以下侧边栏来识别有用信息：


