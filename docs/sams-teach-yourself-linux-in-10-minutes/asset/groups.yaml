    Application-Specific Widget

    Pushwin Widget


    # Iconify button

    Expand Button

    Destroy Window Button


    # KDE Toolbar

    KDE Desktop Icons

    KDE Environment Setup Utility


    # Virtual Screens

    KDE Quick-Start Application

