- md: '

    # EMAIL


    Of all the network tools you''ll make use of from your Linux account, email is
    likely to be the most frequently used. Email lets communicate with your friends
    and colleagues, exchange files, and contact people all over the planet. It is
    fitting in its position as most used tool, email also has the widest range of
    software available. Most versions of Linux come with at least two different programs
    for accessing email, and frequently have a handful of others that have been installed
    over time. The following are some of the more commonly used programs for accessing
    and working with email:


    - mail—Found on almost all Linux systems, mail is a command-line driven mail reading
    system. It''s a fairly simple program without many customization features, but
    it''s fast, and convenient to use if you don''t fancy mail filters or a menu-driven
    interface.


    - pine and elm—These are both full-screen mail reading programs with simple and
    intuitive menus and configuration options. The pine program is somewhat more powerful
    than elm, but both are good readers for users who want convenience in a text-based
    email reader.


    - mh—The Mail Handler. The mh suite of programs must be close to not the least
    intuitive mail-reading package available. It is also, by far, the most powerful.
    The mh philosophy is very similar to the Linux philosophy—break the job at hand
    down into the smallest building blocks, make each of these programs, and let the
    user put them together to make any custom configuration desired. Choose only mh
    as your mail reader after you''ve become comfortable doing a bit of shell script
    programming, because you''ll have to construct custom aliases and scripts before
    mh will show its true power.


    - procmail—The Mail Processor. The procmail program is designed to do sophisticated
    automatic processing of your email as it is. If you would like to add automatic
    processing of your email to your account, you might want to check whether procmail
    is available on your system.


    Graphical email interfaces—Many desktop environments provide graphical emails;
    for the user interested in the point-and-click convenience, look to your desktop
    environment software. Netscape also provides an email client, and cannot read
    from your Linux mail spool unless your machine is running a POP3 server. An example
    of the KDE email client (appropriately named Mail client) is shown in Figure 18.1.


    ![](img/a0e6136ea1c86032b26127d28a7bd962_177_0.png)


    ANNOUNCE: twirl-0.0.6 available


    From: Karl Knuth <karl.knuth@magna.uni-heidelberg~kjstingen.de>

    To: kde-announce@apps.list.phyrox.uni-heidelbergberg.de

    Date: Sat, 18 Jul 1998 15:58:31 +0200 (CEST)


    Hi there,


    there is a VRML viewer for KDE-1.0 available from


    http://ftp.kde.org/pub/kde/unstable/apps/graphics/twirl/twirl-0.0.6.tgz


    Follow the link:


    Figure 18.1 The KDE environment provides several graphical network clients, including
    an email client.


    # THE .FORWARD FILE


    If you want email that comes to your account to automatically send itself somewhere
    else, you can make use of the .forward file. Not only the .forward file be used
    to forward your email to another email address, but it can also be used to forward
    your email into other programs, if you want to use software to process your email.


    # ACCESSING NETWORK RESOURCES


    The format of the .forward file is simple:


    To forward your email to another email address, create a file named .forward in
    your home directory. In this file, put a single line containing the address to
    which you''d like your mail forwarded. Execute the command chmod 644 ~/.forward
    to set the permissions properly and you''re finished. All email coming to your
    account will be forwarded to the new address.


    To forward your email into a program for automatic processing, create the .forward
    file in your home directory. Put a single line containing the pipe character |
    followed by the path to the program you want to use. Run chmod on the file as
    the preceding example, and you''re done. Incoming email will be piped into whatever
    command you put in the .forward file.


    # SUMMARY


    In this lesson, you were introduced to a sampling of tools that let you make use
    of the network resources around you and around the world. As you explore Linux,
    you''ll find that this was really only a small sampling, and that there are new
    tools for you to use appearing constantly. Some will be replacements or upgrades
    for the commands outlined here, others will be completely new. Don''t be afraid
    to try them out. Here''s a quick review of this lesson''s key points:


    - telnet-Connects you to remote machines; if you have different accounts on different
    machines, you''ll probably find yourself using frequently.


    - rlogin-Also connects to remote machines, but is more useful than telnet if the
    machines you work on are configured to allow you to login between them without
    giving a username or password.


    - login-Provides security for remote connections. If you have it, use it. The
    network is becoming a very scary place with people breaking into Linux machines
    daily. Using the secure connection provided by login will protect your network
    traffic from prying eyes.


    - trn and rn—Read Usenet newsgroups. Newsgroups can be a lot of fun and useful
    for finding information, but also can be a big drain on your time.


    - ftp—Connects you to remote servers to transfer files.


    - smclient—Allows you to access remote SMB shares.


    - lynx—A text-based web browser.


    - w3m—A graphical graphical web browser for Linux.


    - wget—A free program for retrieving content from web servers.


    - curl—A command-line tool for transferring data with or from a server.

