    # # LESSON 2

    # DOCUMENTATION AND FINDING HELP


    This lesson provides several methods of retrieving information about the built-in
    commands and capabilities of Linux.


    If you''ve poked around your Linux system a bit, you''ve probably noticed that
    there are literally thousands of different files and applications on your computer.
    You might find this to be a bit overwhelming at first, but the diversity and extensive
    capabilities of the operating system are part of its main attraction. If there
    is something you want to do, you can bet that Linux has a utility or combination
    of utilities that can help you get the job done. The biggest question on your
    mind is probably “How do I use this stuff?”


    # ## LINUX MANUAL PAGES


    The Linux manual, or *man*, pages are the quickest and easiest source for information
    on how to use the commands on your system. They provide information on what programs
    to do, how to use them, and other utilities that you might be interested in checking
    out. If you''re a programmer, man pages can also provide useful programming information.


    # ### man


    To display a *manual page*, use the *man* command. In its simplest form, you type
    *man* followed by the command you want to look up. Because man'
