    # LESSON 3


    > X Marks the Spot X Windows is usually referred to as X#, where # is the major
    revision number, or X#Rn where # is the major revision number and n is the minor
    revision. As of this writing, X11R6 is the current version, but it is generally
    referred to as X11—or, just X.


    X Windows provides facilities for programs to display windows, buttons, and other
    user-interactive widgets. The interface is actually implemented as a type of server
    program running on the computer. Client programs that want to make use of X Windows
    display functionality catch the server and make requests asking it to perform
    certain display functions. It does not matter to the client or server application
    whether they are running on the same machine or separated by miles of network—the
    client makes requests and the server tries to honor them.


    An additional difference between personal-computing window systems and X Windows
    is the fact that the look and feel of the interface is controlled by a separate
    program, rather than by the X Windows server. In the X Windows model, the server
    is responsible for handling client display requests, such as requests for displaying
    windows. Unless a client specifically draws a title bar for itself, X won''t give
    it one. A separate program must be run to create title bars and to actually manage
    user interactions, such as moving windows around, iconizing or minimizing windows,
    or providing application-dock functionality.


    # STARTING X WINDOWS


