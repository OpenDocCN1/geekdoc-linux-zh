    # LESSON 13


    ## REGULAR PRESSIONS


    In this lesson you will learn the basics behind regular expressions and how to
    use them with the grep command.


    Regular expressions are a wonderful thing. Accept that as a fact as you read through
    this lesson, and you will be fine. Regular expressions are used in many programming
    languages and in Linux commands. They are a bit on the esoteric side, but are
    extremely important to understand nonetheless. Although in this lesson, you will
    only be looking at the grep command in conjunction with regular expressions, you
    can apply this knowledge to most everything that uses regular expressions. Mastering
    regular expressions will take time. This lesson is rather short and should serve
    only as an introduction to the topic.


    ## PATTERN MATCHING


    Regular expressions are a method of specifying a pattern of characters that can
    then be matched against existing text. They can be used to locate information
    when you''re not sure what you''re looking for, or they can perform extremely
    complex search and replace procedures. The Perl (Practical Extraction and Report
    Language) programming language uses regular expressions to a great extent, and
    is considered one of the best languages for creating dynamic Web applications.


    ## SPECIFYING THE REGULAR EXPRESSION in grep


    The format for specifying the regular expression in grep is grep <regular expression>
    <filename> <filename> .... Because this lesson uses grep as its example, familiarize
    yourself with this format. Other programs sometimes require that the regular expression
    be set off with / on either side of it. This is not the case with grep.


    ## MATCHING SINGLE AND MULTIPLE CHARACTERS: AND *


    Given that a regular expression defines a method of matching, here are some of
    the most common parts of a regular expression and how they can be used to match
    a sample pattern. For the examples, I''m going to use a file name sample.txt (if
    you''d like to follow along, use a text editor from Lesson 8, "Text Editing,"
    to create it now) that looks like this:


    This is a test

    Kim Steinmetz

    (614) 555-0591

    (615) 555-0000

    1998

    1999

    1800

    1750


    The period character (.) can be used to match any character. For example, let''s
    assume that I don''t know how to spell Kim''s last name in the preceding file.
    There''s a good chance I would get the i and e mixed up. In that case, I could
    use . like this:


    ```

    > grep "St..nmetz" sample.txt

    ```


    Kim Steinmetz


    The St nmetz make up an obvious part of the regular expression—they match directly
    with the letters in the name Steinmetz. Because I was not sure about the i and
    e, I simply replaced them with periods, and grep returned the line I wanted.


    The asterisk (*) matches any number of occurrences of a pattern, or portion of
    a pattern. Suppose I all knew that Kim''s last name started with an S and ended
    with a z. In this case, I could use * in conjunction with to match anything between
    an S and a z:


    ```

    > grep "S.*z" sample.txt

    ```


    Kim Steinmetz


    Sure enough, that works well! I guess I can pretty much forget how to spell her
    name now, huh?


    > Figuring Out *: It is important to note that * will match any number of occurrences
    of a pattern, including zero. This means that the expression S.*z would happily
    match the string Sz. If your expression is turning-up matches that you hadn''t
    planned on, this might be why.


    \ to set off a special character. Some characters are used by the shell, so they
    must be escaped using the \ character. You might want to use \ in front of characters
    that might be special characters. In most cases it doesn''t hurt to use \ if you
    aren''t sure. For example, the shell usually expects you to put double quotes
    " around strings in space—it uses the double quote to group the words in the string.
    If you needed to search through your file for lines containing double quotes,
    you could not grep for \", instead you would use the following command:


    ```

    > grep "\"special stuff\"" sample.txt

    ```


    Using \ in front of the double quote tells the shell not to attempt to interpret
    the double quote normally as a surrounding character, but to pass it through to
    the grep command for processing.


    ## USING AND NEGATING RANGES IN A REGULAR EXPRESSION: [] AND ^


    You might have noticed that the sample.txt file I''ve been using a few dates inside.
    Suppose I only want to match the years that fall in the 1700–1800. To do this,
    I can use a range, which is specified in a regular expression as [<starting point>-<ending
    point>] The starting and ending points can be numbers or ranges within the alphabet.


    For example


    ```

    > grep "[1-7][0-9]**" sample.txt

    ```

    1800

    1750

    ```


    My pattern states that any valid matches must start with a 1 and be followed by
    a number in the range of 7–8, followed by one or several numbers in the range
    of 0–9. Ranges can help you pull certain values out of files. You can expand the
    capability of the range by applying the negation operator.


    The caret (^) negates a range if it is used at the start of the range specification.
    Negating a range makes the opposite of what the range matches.


    For example


    ```

    > grep "1[^7-8][0-9]*" sample.txt

    ```


    ```

    (614) 555-0591

    (615) 555-0000

    1998

    1999

    ```


    Notice that I now match anything that isn’t in the 1700 or 1800.


    ## MATCHING THE START AND END OF A LINE: ^ AND $


    In order to uniquely match the years in the sample, I can use the start and end
    of line characters. These characters are commonly called anchors because they
    anchor a pattern to the start or end of line. Since 1998 and 1999 are both at
    the beginning of a line, this should be easy.


    - ^Used outside of a range, the ^ character matches the start of line.

    - $ —matches the end of the line. If your pattern falls at the end of a line,
    you can anchor it in this position.


    For example


    ```

    > grep "1[^7-8][0-9]*" sample.txt

    ```


    ```

    1998

    1999

    ```


    That''s more like it. Only the two dates are returned, because they fall at the
    beginning of line. The phone numbers no longer match because the portion that
    did match is not at the start of line.


    ## USES FOR REGULAR EXPRESSIONS


    What you''ve just learned is only a very tiny subset of the regular expressions
    you can generate. Regular expressions can be used in a wide variety of different
    applications. For example, see, the stream editor, replace patterns of text from
    a stream of text on-fly. Being able to do a global regular expression search and
    replace on a thousand files rather editing each one individually is wonderful.
    When you are using the shell you can also use a subset of the complete regular
    expression library to specify filenames for operations.


    For example, if you have a group of files named test1, test2, test3, test4, test5,
    and you''d like to copy files 3 through 5 to a new directory, you could use a
    regular expression like this:


    ```

    >cp test[3-5] newdirectory

    ```


    You''ll need to consult the man pages for the shell you are running in to determine
    the regular expressions that it supports. The same goes to everything else that
    uses regular expressions. Unfortunately, though regular expressions themselves
    are pretty standard, the extent to which an individual application supports them
    is entirely up to application. Perl, for example, is an application (and, in turn,
    is a complete programming environment) that makes extensive use of regular expressions.


    With the growing popularity of the World Wide Web comes the need to user-supplied
    information quickly and reliably. Unfortunately, there is little control over
    what sort of information a user might submit on a form or other interactive Web
    document. If you intend to do Web programming, you will find that regular expressions
    are a lifesaver and be used to extract data from a form and turn it into a usable
    format. If this sounds interesting to you, I strongly suggest looking into the
    Perl programming language.

