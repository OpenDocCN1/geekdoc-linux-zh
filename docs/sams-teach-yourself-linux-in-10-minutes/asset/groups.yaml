    probably seen utilities like this before on other desktop systems, they''ve been
    add-ons or pieces of commercial software. In the case of Linux, it''s all free,
    and there''s a whole lot more where this stuff came from! Let''s review what is
    discussed in this lesson:


    +   - **wc**—The command can provide quick character, line, and word counts for
    a single file or group of files.

    - **sort**—Sort enables you to sort information sorted on separate lines within
    a text file. It understands the notion of columns and fields of data, so you can
    use it to sort data in a variety of different formats.

    - **split**—If you have files that are a bit too large to handle when sending
    email, writing to a floppy, and so on, you can use the split command to chop them
    up into smaller files. split can create files containing a certain number of lines,
    kilobytes, or megabytes.

    - **diff/patch**—The combination of diff and patch enables you to distribute updates
    to documents, source code, and so on, in an efficient manner. Rather than sending
