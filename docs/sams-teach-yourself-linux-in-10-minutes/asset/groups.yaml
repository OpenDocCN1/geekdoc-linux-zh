    # S.U.S.E. LINUX


    这是一个稳定且功能齐全的发行版，带有4张光盘的应用程序、源代码以及详尽的打印文档。S.u.s.E. 发行版使用 Red Hat RPM 管理系统以便于升级，并包含了其自身易于使用的管理工具。它还配备了由
    S.u.s.E. 开发的 X Windows 服务器，以支持最新级别的响应速度。对于图形化界面的用户，它还包含了 KDE 桌面环境。


    有关 S.u.s.E. 的更多信息，请访问 http://www.suse.com。


    # 有许多供选择……


    无论你选择哪种发行版，你都会发现其中你喜欢的特性，而这些在其他版本中并不包含。如果你在为公司做决定，可能想测试几个发行版支持服务的响应水平。在进一步研究不同的发行版时很难选出一个明显的胜者，由于
    Linux 开发的速度非常快，请查看此页面。如果你对进一步研究不同的发行版感兴趣，请查看 Linux 网站上的此页面：http://www.linuxhq.com/dist-index.html。


    幸运的是，Linux 商业发行版的成本远低于与主流操作系统竞争。花一份商业版 UNIX 或 NT 的钱，你可以拥有许多 Linux 发行版。花时间找到一个你喜欢的，并且包含了你可能需要的特性和软件。探索
