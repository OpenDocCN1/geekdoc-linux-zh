    # 第一节

    ## 入门


    在本节中，你将学习如何登录和注销电脑、操作 Linux 机器的基础知识，以及关于 Linux 功能的一些背景信息。


    ### 一些背景


    多年来，UNIX 操作系统获得了令人生畏和恐惧的声誉，通常运行在企业和大型组织中。


    Linux 改变了现状！它是一个诞生于计算机科学对某种追求的操作系统，它看起来和运行起来像 UNIX，但对个人非常友好。Linux 的出现推动了实用工具的发展，从服务器房推到了桌面。


    ### 登录过程


    为了登录你的电脑，你需要提供用户名和密码。你应该从管理员那里获得这些信息，或者在安装 Linux 软件时自行选择。当你输入信息后，Linux 会加载适用于你账户的配置，你就可以开始使用系统了。当你坐在电脑前，首先注意到的是输入用户名和密码时显示的屏幕因系统而异。如果你习惯
    Windows 95/98，这听起来可能像不同的用户，在某些方面确实如此。Windows 95/98 不保护文件；Linux 可以。


    # 所有权与权限


    Linux 有所有权权限的概念。文件属于个人用户，权限控制谁可以查看、编辑或运行系统文件。坦率地说，普通用户不需要担心所有权。如果你需要与系统的其他用户共享文件，你将查看第
    19 节“权限”。在你登录电脑后，在该会话期间创建的所有文件将属于你的账户。


    # 多用户


    除了控制和跟踪谁拥有什么，Linux 还允许多个用户同时访问系统。这与传统操作系统提供的桌面环境相比是一个巨大的变化。当你处理电子表格时，你的同事可能正在为一个工程项目运行一系列计算。许多不同的用户可以在同一台电脑上运行许多进程。第
    11 节“进程”解释了进程的概念以及如何管理它们。


    # 登录提示符


    为了登录你的电脑，你需要提供用户名和密码。你应该从管理员那里获得这些信息，或者在 Linux 软件安装期间自行选择。




