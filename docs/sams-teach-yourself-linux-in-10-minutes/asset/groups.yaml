    # GETTING AND CHANGING USER INFORMATION: finger and chfn


    Each user has a few pieces of information about his or her location stored as
    part of the system password file. This enables other users to quickly find the
    information necessary to contact them. The command that displays this user data
    is finger. Because the user information is stored when the user account is created,
    chances you don''t have any information set for your account. In order to change
    that, you''ll use chfn.


    # USING finger


    Using the finger command is simple. Just use finger <username> to get information
    about a user who is local to your system. To get information about someone on
    a remote system, you can try finger <username>@<remote host>. Depending on how
    the remote host is configured and the type of remote host, it might or not work.


    For example


    ```

    >jray@poisontooth.com


