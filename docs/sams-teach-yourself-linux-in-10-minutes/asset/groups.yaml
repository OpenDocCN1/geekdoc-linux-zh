    除了界面的复杂性外，KDE 还提供了一套集成工具，用于配置你的机器和用户界面，并为通用 Linux 程序和实用程序提供了一系列实用的点击式界面。这些实用程序中的一些将在其他课程中讨论；如果你已经在使用某种桌面环境，请关注这些章节，以查看
    KDE 以及通用桌面环境如何让你的生活变得更轻松。


    如果你正在寻找一种让你的 Linux 体验感觉更像你的个人电脑的方法，请要求你的管理员确保系统上安装了 KDE。KDE 网站及相关下载位于 http://www.kde.org。


    # 总结


    在本节中，你学习了 X 窗口系统的背景，以及如何对其进行自定义。基础 Linux 发行版中安装了数百个 X Windows 应用程序。理解 X Windows
    将使你能够利用这些基于图形的工具。


    - X Windows 基于客户端/服务器模型——客户端运行在你希望的任何地方并发出显示请求。服务器运行在带有显示器的机器上，并尝试执行这些请求。

    - X Windows 系统需要一个窗口管理器来实现标题栏等用户界面便利功能。

    - X Windows 鼠标行为可能很奇怪——如果起初没有成功，请点击并再试一次。

    - X Windows 可以以多种不同的方式将键盘输入聚焦到窗口——注意你的光标所在的位置。

    - 桌面环境的出现将应用程序图标带入 X Windows 世界。


    尽管桌面环境功能强大，且新的窗口管理器具有高度自动化，但它们的配置通常存储在你的主目录中简陋的文本文件中。KDE 软件将其大部分配置存储在你主目录下的 `.kde`
    目录中的文件中。如果你想将环境从一台机器复制到另一台机器，这是一个很好的起点。


    # 第 4 节

    文件系统


    在本节中，你将学习 Linux 文件系统的基础知识，以及在使用 Linux 时让生活更轻松的几个方便小技巧。


    对于初学者来说，Linux 文件系统看起来可能是一个奇怪而孤立的地方——有这么多文件，而你只有一个命令行可以输入。这感觉像是熊皮和石器时代，对吧？错特错。虽然对
    Linux 文件系统的访问最初可能看起来晦涩且原始，但 Linux 提供了极其复杂的文件访问和控制。这种复杂性源于许多简单的命令，通过这些命令可以构建出更复杂的命令。


    ## 文件系统设计


    在这些简单命令产生意义之前，你需要了解 Linux 文件系统设计的一些事情。这看起来可能不是用户体验中非常重要的部分，但 Linux 文件系统与你可能熟悉的个人电脑文件系统有所不同——你可能会发现最大的差异正合你心意。


    Linux 文件系统拥有单一根目录。与在桌上有多个驱动器图标的 Macintosh 文件系统或带有 ABC 盘符的 Windows 文件系统不同，Linux
    文件系统只有一个顶层目录——根目录。你应该将 Linux 文件想象成树形结构，以根目录为树干。根目录可以包含文件和其他目录，而二级目录又可以包含更多文件和更多目录，依此类推。


    ## 根的力量


    Linux 使用“root”一词来描述两个不同的概念。一个是根用户（root user），对机器的所有事务拥有绝对控制权的人；另一个是根目录（root directory），机器上的一个特定目录，被认为是文件系统的基础。


    你不需要关心驱动器是什么。如果驱动器不是用字母或图标命名，它们出现在哪里呢？它们仅仅显示为位于文件系统任何位置的目录。奇怪吗？一点也不奇怪。Linux 从用户的考虑中完全消除了硬件和文件物理位置的概念。这可能需要一段时间来适应，但一旦你习惯了，你就会发现用户担心文件物理上位于何处是没有意义的。如果你知道它的名字以及在文件系统中哪里找到它，那么何用担心它运行在哪个另一块重要的氧化金属（顺便说一下，这就是硬盘的组成部分）上呢？如果你认为……


    '
