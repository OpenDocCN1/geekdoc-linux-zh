    此命令将当前目录下的文件 `todays_mail` 移动到 `~/mymaildir` 目录下的 `June10.mail` 文件。（请记住，`mymaildir`
    是位于你家目录下的目录。）


    要使用 `mv` 命令将一个或多个文件移动到新位置，你应该：


    1. 确定你想要移动的所有文件的名称以及你想将它们移动到的目录名称。

    2. 执行命令 `mv <file1> <file2> ... <destinationdir>`。


    例如


    ``````

    > mv /usr/log/httpd/error_log /home/henry/myfile2 /tmp

    ```````


    此命令将来自 `/var/log/httpd` 目录的 `error_log` 文件和来自 `/home/henry` 目录的 `myfile2` 文件移动到
    `/tmp` 目录中。


    > mv 的局限性：`mv` 命令也可以用于移动和重命名目录，其语法与移动和重命名文件完全相同——只需提供目录名称而非文件名即可。

    遗憾的是，对于这项任务，它的功能比你可能想要的要有限。它不能在物理设备之间移动目录，因此每当偶尔尝试将目录从一个位置移动到另一个位置时，Linux 文件系统对物理设备的抽象就会给你带来麻烦，你会收到类似这样的错误信息：

    Can''t move directories across partitions（无法跨分区移动目录）

    如果发生这种情况，最简单的解决方法是使用拷贝命令，复制出错的目录，然后删除原始文件。


    # 创建链接：LN


    在本节中，你学习的最后一个文件管理工具是用于创建文件链接或别名的命令。`ln` 命令用于创建文件链接，使得一个文件可以出现在多个位置，并拥有多个名称。


    为了理解此命令的用途，考虑这种情况：你让朋友查看你的每日日程。每天（或根据情况每周），你可以创建一个包含你日程的新文件，并用当前日期命名。因为你不想不断给朋友提供新的文件名来检查日程，你只需要创建一个名为
    `myschedule` 的链接，然后将其指向包含你当前日程的文件。你的朋友可以随时查看 `myschedule` 来获取你的日程，而你可以保持每日计划的整整齐。


    要使用 `ln` 命令创建链接，你应该：


    1. 确定你想要为其创建链接的文件名称。`ln` 命令允许为不存在的文件创建链接，这并没有特别用，所以请确保你知道想要链接的文件的正确名称。

    2. 确定你想要访问该文件的替代名称。

    3. 使用命令 `ln -s <realfilename> <alternatename>`。`-s` 选项告诉系统这是一个符号链接（symbolic link）。如果你对学习符号链接和硬链接之间的区别感兴趣，请
    `ln` 的 man 页面。


    例如，如果你想方便地浏览 Web 服务器日志，可以执行命令：


    ```

    > ln -s /var/log/httpd/access_log ~/weblog

    ```


    如果你执行了此操作，将在你的家目录下创建一个名为 `weblog` 的链接。该链接将是文件 `/var/log/httpd/access_log` 的一个替代名称。


    你可以几乎完全像操作真实文件一样操作这个链接。如果你尝试读取它的内容，你读取将是真实文件的内容。如果你尝试修改或编辑它，你编辑将是真实文件的内容。但是，如果你删除了链接，你只会删除该链接；真实文件将保留。如果你使用
    `ls -l` 查看链接，它将显示为指向另一个路径的文件，以便你可以区分链接和真实文件。


    ```

    > ls -l ~/weblog

    ```


    ```

    lrwxr-xr-x 1 ray 7 Nov 28 1998 weblog ->/var/log/httpd/access_log

    ```


    > Web 服务器提示：使用 `ln` 命令的一个有用地方是在处理 Web 服务器时——如果你不打算使用 Web 服务器，请忽略此提示。许多 Web 服务器使用符号链接。


    # 在 Shell 中操作文件


    # 第 7 节

    # 读取文件


    本节向你介绍可以用于在计算机上读取文件的基本命令。


    你的 Linux 计算机可以用于数百种应用程序，但无论用途如何，你都将学会完成一项简单任务：读取文件。大多数 Linux 应用程序使用基于文本的配置文件、带有基于文本的指令文件并存储基于文本的日志文件。无疑，你会想要利用这些信息。除了加载文本编辑器或文字处理器之外，还能如何这样做？本节通过向你展示所有这些文件的内容来回答这个问题。


    # 一次性查看文件：CAT


    查看文件的最简单方法是使用 `cat`，即连接（concatenate）命令。它被称为连接是因为它会将给定的文件中的所有内容添加到输出流中。你将在第 12
    节“输入和输出”中学习更多关于输出流的知识。现在，只需这就是显示的内容。`cat` 允许你快速读取文件。它立即显示给定的所有文件名的内容，一个接一个。你可以将
    `cat` 与重定向操作符一起（你将在第 12 节学习它们），创建一个包含多个其他文件内容的文件。现在，你将使用 `cat` 显示文件。


    要显示文件，请将想要显示的文件或多个文件作为参数提供给 `cat`。


    # 总结


    在本节中，你学习了一组可以管理文件的命令。请记住，如果你从单个文件开始，你的目标应该是单个文件；而如果你从多个文件开始，你的目标必须是可以包含多个文件的对象。


    - touch：此命令将文件的修改日期设置为当前时间。这具有需要时创建空文件的效果。

    - rm：删除文件的命令。`-i` 选项会在你确定自己在做什么之前进行询问。

    - cp：拷贝一个或多个文件。如果你从多个文件开始，你的目标必须是目录。

    - mv：此命令的工作方式与 `cp` 非常相似，只是它重命名或移动文件。`mv` 命令不能跨硬件边界移动。如果发生这种情况，请向 `cp` 寻求帮助。

    - ln：创建文件访问替代名称的命令。当你需要一个事物出现在多个地方时，它是非常方便的。


