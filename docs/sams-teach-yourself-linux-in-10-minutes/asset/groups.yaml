    By this point, you know how to find out where you are, what files are in what
    directories, and how to move around to different directories. Now it''s time to
    learn a few tricks.


    #  FILENAME EXPANSION IN SUPPORTED SHELLS


    Some shells (tsh and bash being the most prevalent) support filename expansion.
    Essentially this is a way of getting the shell to do some of your typing for you.
    If your shell supports filename expansion, to use this feature you need to press
    the Tab key after typing the beginning (hopefully enough of the beginning to uniquely
    identify the file) of the filename or directory name. For example, if you want
    to edit a pre existing file myfile.dat, which is located in your current directory,
    you might issue the command: emacs mybi Tab (Emacs is an editor that is discussed
    in Lesson 8, "Text Editing") If you have no other files that start with characters
    mybi in the current directory, the shell will automatically complete the filename
    for you. the shell will beep at you, and you''ll have to type some more of the
    file name to make it unique before trying the Tab key again.


    Remember, all these techniques can be used together. If you''re working in /usr/local/bin
    and suddenly remember that you forgot to edit files in /usr/local/myincludes,
    you could get there with pushd ../myn Tab, and back again with popd.


    #  NAVIGATING THE FILE SYSTEM USING KDE


    If you find moving around the command line awkward, you''ll be happy to know that
    KDE provides a very user-friendly way to navigate the file system. Similar to
    Windows 98, KDE''s file management system is also based on the philosophy that
    "everything is a Web page." Each file manager window supports the full functionality
    of a normal Windows or'
  - '[PAGE 59]


    Mac OS window, but is also a full-fledged Web browser. Breaking slightly from
    the double-click model that you''re undoubtedly used to, KDE only requires a single-click
    to perform its actions.


    # SIMPLE KDE ACTIONS


    In KDE, files are represented with icons that usually indicate the file type.
    Directories are shown as folders. Double-clicking a directory is similar to using
    the cd command to get to that directory from the command line; a new window should
    open up to display the contents of directory.

    Figure 4.1 shows a KDE file manager.


    > Navigating Your Files Notice that the file manager displays the URL of the directory
    it is showing. Because each window is a Web browser, you can substitute a Web
    or FTP address into the URL field, and KDE will immediately take you there—assuming
    you have an Internet connection, or course!


    ![](img/a0e6136ea1c86032b26127d28a7bd962_59_0.png)


    Figure 4.1 KDE looks and acts similar to other popular desktop environments.'
  - '[PAGE 60]


    To move or copy files between locations, you can drag files from location to location
    as you''d expect. A pop-up menu appears at the end of the drag asking if you''d
    like to copy or move the files; this is an example of a contextual menu, which
    appears when an action is performed within a certain context.


    To delete files, drag the files you want to erase to the Trash icon. Click the
    icon with your right mouse button and choose Empty Trash Bin to complete the action.


    New folders can be created by right-clicking in the location where you want the
    folder to appear, and then choosing New from the pop-up textual menu and Folder
    from its submenu.


    > Getting Home If you need to get to your home directory in KDE, look for the
    icon of a folder with a little house on top of it. Clicking this opens a KDE file
    manager showing your home directory.


    If you spend a few minutes playing around KDE, you''ll find that its simplicity
    and elegance are on par with commercial desktop operating systems. If you''ve
    previously worked with personal computers, you might find it a bit difficult to
    believe, but in the world of Linux, most of the truly great software is user-written,
    community supported, based on open standards, and completely free, which scares
    the jeebees out of the big OS manufacturers.


    There''s quite a bit to explore, so, if you''re running a KDE system, take a few
    minutes to look around before you continue on to Lesson 5, "Finding Files."


