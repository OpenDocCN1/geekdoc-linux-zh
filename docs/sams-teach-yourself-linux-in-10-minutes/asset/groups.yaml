    +   You can position cursor keys in emacs using the arrow-key keypad and terminal
    combination in most every version of emacs. If the arrow keys don''t work, you
    can also position the cursor by using Ctrl+f to move forward, Ctrl+b to move backward,
    Ctrl+p to move to the previous line, and Ctrl+n to move to the next line. Newer
    versions of emacs also allow you to position the cursor using the mouse, but many
    users find this less convenient than pressing cursor keys.


    +   You can delete everything from the cursor to the end of the cursor line


    +   Ctrl+g is emacs’ “quit what you’re doing” command—if you’ve started a command
    and change your mind, use Ctrl+g.


    +   If you use Ctrl+k to delete a line or lines, you can press Ctrl+y to “yank”
    them back again.


    +   To save the file you''re currently editing, press Ctrl+x+Ctrl+s.


    +   To save the file to a new filename, press Ctrl+x+Ctrl+w<file-name>.


    +   To exit emacs, press Ctrl+x+Ctrl+c. If emacs proceeds to ask you about unsaved
    buffers, it’s because you have unsaved work. You can either go back and save your
    work, or answer Yes to the Quit Anyway? question and go about your business.


    # COMMAND BASICS


    Beyond the set of Ctrl+ commands available in emacs, there’s also an amazingly
    extensible set of commands that come into play if you use the Esc key. These commands
    are usually known as *emacs Meta commands*, though the machine with the Meta key
    from which they draw their name has long faded into history. While they’re too
    complicated and specific to cover in this book, access to many of the interesting
    emacs Meta commands is accomplished by pressing Esc+x, and then pressing a command
    of some sort, such as *info*, *what-line*, or *goto-line*. As a matter of fact,
    you can find many useful emacs commands by entering Esc+x, and then typing a few
    characters of the beginning of what you think the command might be named, followed
    by a space. The editor then gives you a list of all commands with similar names—frequently
    one that does what you want is on the list!


    One useful Meta command that you might want to try is start emacs, and type Esc+help+Spacebar
    (and a second space, if the first one results in the help you used being extended
    by a dash). This brings up a list of emacs commands that start with Help—including
    useful things such as Help for Help, a very good place to start.


    # The Emacs Tutorial


    Instead of a quick sample for you to go through, emacs provides its own help and
    tutorial functions. New users are always encouraged to take the emacs tutorial
    to introduce themselves to the features of the editor and learn how to ask it
    for help with other features.


    To enter the emacs tutorial, start emacs and type Ctrl+hi (hold the Ctrl key,
    press h, release the Ctrl key, and press i). If you type ? after the Ctrl+h instead
    of the i, you will see that there''s actually a world of alternatives to the i,
    which gives you a large range of different types of helpful information. For now,
    take the tutorial. If you''re curious, you can probably spend a few months exploring
    the other options.


    # KDE''S BUILT-IN EDITOR


    KDE provides a very convenient point-and-click text editor with all the convenient
    mouse-based functionality you have probably come to expect from personal computer
    editing programs.


    To activate the KDE editor, click the K in the KDE toolbar. Now, choose Applications
    from the pop-up menu and then Editor from its submenu. A window that looks like
    the one shown in Figure 8.1 will open.


    # TEXT EDITING


    ![](img/a0e6136ea1c86032b26127d28a7bd962_96_0.png)


    FIGURE 8.1 The KDE has an easy-to-use, built-in editor.


    Editor Patience Sometimes it takes a few seconds for X Windows-based applications
    to start—and there''s no spinning wheel cursor to let you know the machine is
    actually doing what you asked it to. Don''t worry if the editor doesn''t open
    immediately. If you select the editor again before it opens, you''ll eventually
    end up with two editors running.


    The built-in KDE editor includes all the normal point-and-click select, copy,
    insert, and delete features you would expect from a GUI-based editor. In addition,
    it uses KDE''s data-location abstraction, so you can open files directly from
    an FTP or Web site using its URL. In Figure 8.1, you can see one of the KDE text
    editor menus is selected. Several of these convenient features are visible on
    the drop-down menu that has appeared.


    # SUMMARY


    In this lesson, you were introduced to the two most popular text editors on the
    Linux platform: vi and emacs. It is best with both of these editors to learn by
    doing, and this lesson provides you with the tools necessary to do the three most
    important tasks in a text editor: start the editor, edit text, and exit gracefully
    if you miss. Because you know how to quit without saving from both vi and emacs,
    don''t be afraid to experiment. You also learned about KDE''s built-in-editor
    as a desktop environment alternative to the text window-based editors from the
    older Linux world. Let''s review:


    - The vi editor is fast and convenient for making small changes to files—It has
    a user interface that is challenging for beginners.

    - The emacs editor is powerful and extensible, but it has a steeper learning curve.

    - KDE''s built-in-editor is a user-friendly, GUI-based option.


    - The vi editor is fast and convenient for making small changes to files—It has
    a user interface that is challenging for beginners.

    - The emacs editor is powerful and extensible, but it has a steeper learning curve.

    - KDE''s built-in-editor is a user-friendly, GUI-based option.


    # LESSON 9

    OTHER TEXT AND FILE UTILITIES


    Some of what you''re going to see in this lesson might not seem useful, but used
    in conjunction with other commands it can be powerful. If you take up shell scripting,
    which is discussed in Lesson 14, you’ll appreciate that Linux includes utilities
    that make your life simpler.


    # COUNTING LINES, WORDS, AND CHARACTERS: WC


    If you''d like to get quick statistics about a text file, but don''t want to load
    it into a word processor, you can use the wc command to provide on the number
    of lines, words, and characters within a single file.


    To use wc, supply the name of a file you want analyzed, in the form wc <filename>.
    If you pass more than one filename to wc, all the files will be processed, and
    a grand total for everything will also be returned.


    For example


    ```

    >wc *.txt

    300 2799 16284 intro.txt

    4944 43494 257939 lesson7.txt

    5244 46293 274223 total

    ```


    In this example, we have processed all the text files in the current directory
    (intro.txt and lesson7.txt). Four columns of information are returned for each
    file. The first value is the number of lines in the file, the second is a count
    of the words in the file, and the third is the number of characters. The final
    column, of course, is the filename. If you want to limit the values to lines,
    words, or characters, you can use the -l, -w, or -c options respectively.


    > Uses for wc A common use I have for wc is to check the number of entries in
    my log files. For example, to see how many "hits" my Web server has received since
    the last time the log files were reset, I can use a command as wc -l /var/log/http/access_log.
    This returns the number of lines in my access log file. Because each line represents
    a hit, I can use wc to quickly count the hits.

