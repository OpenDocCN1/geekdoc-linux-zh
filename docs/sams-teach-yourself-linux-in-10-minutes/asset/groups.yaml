    # # LESSON 19


    # ## PERMISSIONS


    In this lesson, you will learn what permissions are, and how to change them.


    Linux file permissions might be something that you never have to deal with. But,
    if your system has multiple users and you want to share files with them, chances
    are you''ll need to know a bit about the concept of permissions and how to modify
    them.


    # ## OWNERS, GROUPS, AND PERMISSIONS


    The owner of a file is exactly what it sounds like—the person who owns the file.
    Each file has information stored with it that identifies the account that owns
    it. Files can be given to others by changing the owner information to match their
    username. In general, the person who creates a file is the person who owns it.


    Each file on the Linux system also has a secondary piece of information stored
    that records the group ownership of file. Groups are collections of users. By
    allowing a group to share ownership of files, multiple people can work together
    on a project and have their changes immediately available to other members of
    the group. By default, many Linux users have their own group that is the same
    as their account name. In this case, when a user creates a file, the default group
    is that user''s personal group. This is not necessarily the case on more traditional
    UNIX systems. The idea behind Linux machines having personal groups is that creating
    a user to encompass all the user accounts is a security risk.


    Permissions control what actions a user can perform on a file or directory. There
    are three basic actions, which are pretty much self-explanatory: read, write,
    and execute. Read permissions control whether or not someone can view a file.
    Write allows disallows changes to be made to a file. Execute permissions control
    whether or not a file can be run or'
  - '[PAGE 181]


    In the case of a directory, these change a bit. If a directory has execute permissions
    turned off, you cannot cd into the directory, view its contents, or write to it.
    It is effectively turned off. If read permissions are turned off, you can still
    create files in the directory and read them, but you cannot get a listing of what
    is in the directory. Lastly, if the write permission is turned off for a directory,
    you can view a listing of the contents and read files, but not create any new
    files.


    When permissions are applied to a file or folder, they are applied at three distinct
    levels: *owner, group, and world*. The owner permissions control what permissions
    the file owner has. Group permissions determine what actions can be performed
    by members of the same group that the file belongs to. Your system administrator
    can create new groups, or add you to be a member of a group. You can think of
    world permissions as a huge group that encompasses all *users* on your computer.
    If there is any sort of guest access to your computer, you can assume that any
    active world permissions apply to *anyone* who can access your computer.


    # CHECKING THE OWNER, GROUP, AND ASSOCIATED PERMISSIONS: ls -lg


    You''ve already used the ls command extensively, but you probably haven''t been
    paying much attention to the extended information it can return. If you run `ls
    -lg` to list your directories, you can see the owner, group, and associated permissions
    for any file.


    For example


    ```

    >ls -lg


    -rw-r-- 1 jray jray 2024 Oct 26 20:39 kiwi.tar

    -rw------ 1 jray test 1463882 Jul 2 11:33

    *magical-beans.gz

    drwxrxr-x 5 jray test 1024 Nov 5 12:25 kyitn

    ```


    The information you''re interested in here are the first, third, and fourth columns:'
- md: "\n- The first column identifies the owner, group, and world permissions that\
    \ are active for a file or directory. The first character will be a d if the file\
    \ type is a directory. Normally this will be an - for a normal file. The remainder\
    \ of the characters, as you might guess, stand for read, write, and execute (x).\
    \ The first three characters (following the initial - or d character) are the\
    \ active owner permissions, the second three characters are the group permissions,\
    \ and the last are world permissions.\n\n- The third column is the file owner.\n\
    \n- The fourth column is the group owner.\n\nIn this example, the kiwi.tar file\
    \ has read/write permissions for the owner, and read permissions active for the\
    \ group and world. The owner of the file is jray and the group file belongs to\
    \ test. The second file, magicalbeans.gz, has only read/write permissions for\
    \ the owner, who is jray. The group that magical-beans.gz belongs to test, which\
    \ has no permissions to operate on the file. The last file, kyit is actually a\
    \ directory. The owner of kyit is jray, and the corresponding group is test. The\
    \ owner and group both have full read, write, and execute permissions for this\
    \ directory, whereas the world has read and execute.\n\n## CHANGING PERMISSIONS:\
    \ chmod\n\nNow that you know what permissions are, you'd probably like to know\
    \ how to change them! This is accomplished with the chmod command. There are two\
    \ modes of operation that you can use with chmod: a quick-and-dirty mode and a\
    \ more user-friendly method of setting permissions.\n\nThe symbolic user-friendly\
    \ mode uses easy-to-remember commands to set or unset permissions. To use this,\
    \ do the following:\n\n- Pick a permission level. If you want to set permissions\
    \ for the owner, this will be u. If you'd like to change permissions for the group,\
    \ it is g. For world permissions, choose o. Lastly, if you'd like to affect all\
    \ the levels of permissions (owner, group, and world), use a.\n\n 2. Choose an\
    \ operation. Decide whether you want to set (turn on) or unset (turn off) a particular\
    \ level of permission. If you want to set a permission, the operation will be\
    \ +; if you want to unset a permission, it is -.\n\n 3. Choose the permission\
    \ itself. If you'd like to operate on the read permission, this will be r; for\
    \ write it is w, and execute it is x.\n\n 4. Issue the command in the following\
    \ manner:\n\n```\nchmod <permission level><operation><permission>\n<filename>\
    \ <filename> ....\n```\n\nFor example, I want to activate write permissions for\
    \ the magical-beans.gz file shown earlier:\n\n```\n-rw------ 1 jray test 1463882\
    \ Jul 2 11:33\nmagical-beans.gz\n\nchmod g+w magical-beans.gz\n```\n\nTo see this\
    \ worked, I'll run ls -lg on the filename.\n\n```\nls -lg magical-beans.gz\n```\n\
    \n```\n-rw------ 1 jray test 1463882 Jul 2 11:33\nmagical-beans.gz\n```\n\nSure\
    \ enough, write permissions are now active for the test group members.\n\nAlthough\
    \ this method for adjusting file permissions might be easy for some because of\
    \ its symbolic nature, there is another syntax that I find faster and easier.\
    \ This deals with setting the actual bit mask that controls bits can represent\
    \ each level of permissions. The first of these bits (from right to left) controls\
    \ the read, the second controls write, and the third controls execute.\n\nLook\
    \ at this way:\n\n- 010 - Read permission - The decimal equivalent of binary value\
    \ is 4.\n- 010 - Write permission - The decimal value for write is 2.\n- 001 -\
    \ Execute permission - The decimal representation is 1.\n\nUsing this technique,\
    \ you can easily set multiple permissions at once. For example, it's easy to see\
    \ that 110 is the combination of the read and write permissions. The decimal value\
    \ of this binary string is 6 (4+2). To use this method of setting a file's permissions,\
    \ you will set permissions for owner, group, and simultaneously—with three digits.\
    \ Each of these digits is the sum of the permissions that you'd like to set. The\
    \ first digit is the owner, the second is the group, and the third is the world.\n\
    \nFor example, suppose I want to set the owner to have full permissions, and the\
    \ group and world to have read and execute permissions. Full permissions are achieved\
    \ by adding all the permission values 4+2+1=7. Read and execute permissions are\
    \ a combination of 4+1=5. The three numbers I'll use to set this are 7, 5, and\
    \ 5, entered as a single three digit number-755. The syntax for this form of chmod\
    \ <permissions> <filename> ...\n\nFor example\n\n```\nchmod 755 magical-beans.gz\n\
    ls -lg magical-beans.gz\n\n-rw-xr-x-- 1 jray test 1463882 Jul 2 11:33 -> magical-beans.gz\n\
    ```\n\nAs I hoped, the owner has full read, write, and execute permissions. As\
    \ you become the group and world have read and execute permissions. As you become\
    \ experienced with permissions, you'll probably find that this second method is\
    \ the fastest to set permissions. Just remember read (4), write (2), and execute\
    \ (1), and you'll be fine.\n\n> **Changing Permissions at the Directory Level**:\
    \ If you want to change the permissions of an entire directory structure (all\
    \ the files and directories within a directory), you can use the command-line\
    \ option -R with the chmod command to recursively change everything within a directory.\n\
    \n## CHANGING A FILE’S OWNER: chown\n\nThis command isn’t going to do you much\
    \ good because it can only be used by the super user (root). If you need to change\
    \ the owner of a file, you should ask your system administrator to run this for\
    \ you. The syntax for chown is chown <new owner> <filename> <filename> . . .\n\
    \nFor example\n\n```\nchown agroves magical-beans.gz\nls -lg magical-beans.gz\n\
    ```\n\n```\n-rwxr-xr-x 1 agroves test 1463882 Jul 2 11:33\nmagical-beans.gz\n\
    ```\n\nThe file is now owned by the user agroves as opposed to jray, who has owned\
    \ it throughout this lesson.\n\n> **Another Way to Grant Ownership**: If, for\
    \ some reason, another user needs to own a file that you own, you can always give\
    \ them read permission and let them copy the file. The copy that is created will\
    \ be owned by the other user.\n\n## CHANGING A FILE’S GROUP: chgrp\n\nAlthough\
    \ you can’t change a file’s owner, you can change the group that a file belongs\
    \ to with the chgrp command. To do this, however, you must be a member of that\
    \ group. Your system administrator has the ability to create new groups and add\
    \ users to these groups. If you have questions about your own group membership(s),\
    \ ask your administrator how your account was configured.\n\nTo use chgrp, follow\
    \ these steps:\n\n1. Choose the file or files you want to change.\n2. Determine\
    \ the group that the file will now belong to.\n3. Change the file’s group using\
    \ chgrp <new group> <filename> <filename> . . .\n\nFor example\n\n```\nchgrp admins\
    \ magical-beans.gz\nls -lg magical-beans.gz\n-rw-xr-x 1 agroves admins 1463882\
    \ Jul 2 11:33\nmagical-beans.gz\n```\n\nThe magical-beans.gz file now belongs\
    \ to the group admins. Members of the group have read and execute permissions\
    \ for the file.\n\nThe most obvious use for chgrp is if you are collaborating\
    \ on a project. If you create a file that you want to share with other people,\
    \ you'll need to change the group of the file to be that all users belong to.\n\
    \n> **Running chgrp on a Directory**: The chgrp command, like chown, can also\
    \ be run recursively on a directory using the -R option. This is a big time saver\
    \ when you want to modify a bunch of files and directories at a time.\n\n## LOGGING\
    \ IN TO A NEW GROUP: new\n\nIf you're working on a project, you might not want\
    \ to constantly change the group of the files that you create; this would get\
    \ pretty monotonous if you are working with hundreds of files. Luckily, there\
    \ is a way to log in to a group you are aware of. This is done by way of the newgrp\
    \ command. All files that are created after executing this command will be under\
    \ the group membership that you've switched to. This change will persist until\
    \ you log out or use the newgrp command again. Use newgrp by typing newgrp <group>.\n\
    \nFor example\n\n```\nnewgrp admins\n```\n\nAfter this command is executed, all\
    \ further files that are created in this session will belong to the group admins.\n"
  mdcn: "\n\n- 第一列标识了文件或目录上激活的所有者、组和世界权限。如果文件类型是目录，第一个字符将为 `d`。通常对于普通文件，它将是 `-`。正如你可能猜的那样，其余字符代表读\
