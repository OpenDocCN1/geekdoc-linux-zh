    这会显示 `longfile.txt` 文件。显示命令的输出会浪费空间，因为结果只是文件的内容，一次显示一页。相反，你可以在 `more` 内部使用一些命令来控制过程。


    - 空格键将输出翻到下一页。

    - q—退出 `more` 程序，返回命令行。

    - s—跳过文件中的一行。用它来缓慢地翻阅文件。

    - f—跳过文件中的整页。

    - /*pattern>—搜索并跳转到文件中的某个模式或单词。

    - b—在文件中向上翻回一页。

    - ? 或 h—显示 `more` 命令的帮助信息。由于你可以在查看文件时使用它，这可能是最需要记住的命令。


    你使用的任何 Linux 或 UNIX 计算机上都应该有 `more`。如果你足够幸运，你的系统可能包含 `less`（现代 Linux 发行版确实包含了）。信不信由，`less`
    比 `more` 好。


    ## 使用 less


    `less` 是比 `more` 更现代的分页器，其主要功能之一是可以在文件中移动移动而比 `more` 容易得多。同样，调用 `less` 的与使用 `cat`
    和 `more` 相同；将你想查看的文件作为参数提供给命令。


    例如


    ```

    >less configFile.txt

    ```


    与 `more` 一样，`less` 会一次显示一次 `dumpfile.txt`。控制 `less` 的输出与 `more` 类似。有几个命令允许你在 `less`
    内部移动。


    - 空格键将输出翻到下一页。

    - b—向后退一页。

    - q—退出 `less` 程序，返回命令行。

    - 向上箭头—向上滚动一行。

    - 向箭头—向下滚动一行。

    - /<pattern>—搜索并跳转到文件中的某个模式或单词。此搜索是从文件的当前位置到文件末尾。

    - ?<pattern>—反向搜索并跳转到文件中的某个模式或单词。

    - h—显示 `less` 命令的帮助信息。


    请记住，这不是 `more` 和 `less` 支持的所有选项的完整列表。事实上，如果我写下所有可以使用 `less` 使用的选项，可能会占据 20 页。这只是为了给你足够的入门信息。探索是使用
    Linux 的乐趣的一半！


    ## 第 7 节


    ## 窥视文件的部分：head AND tail


    在某些情况下，你只对存储在文件顶部或底部的内容感兴趣。（真的，这听起来没那么疯狂！） 假设你有一个装满了保存的电子邮件或新闻组消息的目录。与其完整地显示每条消息，你可能只想查看文件头，其中包含主题和发件人地址。要做到这一点，你使用
    `head` 命令。同样，如果你正在运行 Web 服务器并想查看最后几个访问你网站的个人，可以使用 `tail` 查看日志文件的末尾。


    ## 使用 head


    你应该已经注意到我们过的过的程序之间存在一个共同点。要运行它们，你只需要提供命令，后跟你想查看的一个或多个文件。`head` 也是如此。默认情况下，`head`
    会显示你指定的每个文件的前 10 行。


    例如


    ```

    >head news112.msg

    ```


