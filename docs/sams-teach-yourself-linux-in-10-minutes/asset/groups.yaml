    # ABOUT THE AUTHOR


    John Ray is an award-winning Web application developer and systems administrator
    for The Ohio State University. He holds a computer engineering degree from OSU
    and oversees network operations for one of its colleges. There, he implemented
    a campus-wide database for maintaining TCP/IP information for a variety of machines.
    He has also created a beginning-level programming language known as Weaver, which
    is used in OSU''s Extension News database, as well as in several other high-end
    applications. For the past five years, John has used Linux exclusively for his
    programming efforts, and has championed its use for projects outside the University.
    He provides customized Linux- and UNIX-based TCP/IP programming solutions to businesses
    nationwide. You can reach him at: jray@poisontooth.co

