    # INTRODUCTION


    # So YOU WANT TO LEARN LINUX


    For years UNIX has been widely regarded as the network operating system. It provides
    the backbone for most of the Internet services that you are probably familiar
    with. As the Internet (and networks in general) has become more commonplace, the
    need for network operating systems has risen. The problem, however, is that while
    traditional versions of UNIX provide the facilities that people need, they generally
    come at a very high cost. Enter Linux!


    Linux is (as you probably know!) a UNIX work-like. It was developed by Linus Torvalds,
    and has continued development under his guidance. There are thousands of people
    worldwide who contribute to the Linux development effort. What makes this different
    from other operating systems is that these people work on Linux because they want
    to, not because it''s their job and not because it''s expected of them. The result
    is an operating system that is a focus of love—and it''s entirely free.


    Linux is distributed under the GNU Public License, which requires that its source
    code be free. Wait a second, aren''t there companies selling Linux? Yes, there
    are many. These companies provide distributions of Linux that have extra features
    added, and include printed documentation. Even so, these commercial distributions
    are usually available as a completely free download (without documentation and
    support).


    Besides being free, with its UNIX underpinnings, Linux is also a very powerful
    operating system. It offers protected memory, pre-emptive multitasking, and a
    full multi-user environment. You can use it to serve files, Web sites, and email—pretty
    much anything that you want. Unlike other server operating systems, Linux has
    very minimal system requirements and can run on hardware that has been delegated
    to the scrap heap. Furthermore, it operates on a wide range of different systems.
    Instead of a proprietary system for each kind of computer, Linux has been adapted
    for many different kinds of CPUs—from the Alpha to Intel Pentiums and IBM/Motorola
    PowerPCs. This means that you can run the same system on your Mac that you run
    on your Dell or Gateway...kind of nifty isnt it?


    # HOW TO USE THIS BOOK


    Linux can be a bit scary to many people. The power of the operating system lies
    in the command line. UNIX, and thus Linux, can appear cryptic to the beginner.
    That''s where this book comes in. Teach Yourself Linux in 10 Minutes introduces
    you to basic Linux commands in a way that is informative and easy to understand.
    By the time you finish this book, you will be comfortable with the command line
    and have the knowledge to find any other information you might need through Linux''s
    extensive built-in help system. In addition, you''ll learn about the KDE user
    interface, an elegant and high-powered point-and-click operating environment that
    is quickly becoming the desktop standard for Linux.


    You can loosely divide this book into various sections. The first five lessons
    familiarize you with the Linux environment and navigate the Linux file system.
    The next group of lessons help you to learn file utilities, and the two groups
    of lessons after that give you the basics of working with the shell and customizing
    your environment. The final two sections help you learn to communicate with the
    outside world and give you a look at Linux''s more advanced topics. I''ve also
    included an appendix with some guidance on selecting the Linux distribution that''s
    right for you.


    It is my hope that this book teaches you the skills you need to unleash the power
    behind one of the world''s fastest growing operating systems: Linux.


    # CONVENTIONS USED IN THIS BOOK


    This book uses the following conventions:


    - Information you type appears in **bold monospace** type.

    - Screen output is shown in monospace.

    - Menus and menu options, keys you press, and names of buttons and other screen
    components you might interact with appear in **bolded blue** type.

    - The Return key is synonymous with the **Enter** key.


    In addition, this book uses the following sidebars to identify helpful information:


    | |

    | :--- |

    | **Tips** lead you to shortcuts and solutions that can clear up confusion or
    save you time. |

    | **Cautions** help you avoid common pitfalls. |

    | **Plain English** explains new terms and definitions. |


    ![](img/a0e6136ea1c86032b26127d28a7bd962_15_0.png)


    # LESSON 1

    ## GETTING STARTED


    In this lesson, you''ll learn how to log in and out of your computer, the basics
    behind operating your Linux machine, and some background information on Linux
    functions.


    ### A LITTLE BACKGROUND


    Over the years, the UNIX operating system has gained the reputation of intimidating
    and scary away many people. It has traditionally lived on fairly expensive machines
    in corporations and large organizations.


    Linux has to change that landscape! It is an operating system that was born out
    of a computer science student''s quest for something that looked and acted like
    the UNIX operating system but was personal computer-friendly. Linux allows personal
    computers to work alongside expensive UNIX systems because it is essentially a
    re-implementation of the UNIX operating system from scratch.


    A growing interest in Linux has spurred the development of utilities to make the
    user''s life easier, and has aided in the push of Linux and other UNIX systems
    from the server room onto the desktop.


    ### THE LOGIN PROCESS


    The first thing you''ll notice when you sit down in front of your Linux computer
    is that you need to log in before you use it. Linux is a multi-user operating
    system, which means that multiple users can have their own accounts, programs,
    and settings stored separately on the same machine. If you''re used to Windows
    95/98/NT, this might sound similar to the concept of different users, and in some
    ways, it is. Windows 95/98 do not protect the user''s files from other people;
    they hide the files. Furthermore, Windows 95/98 do not allow multiple users to
    run programs simultaneously; Linux does.


    # OWNERSHIP AND PERMISSIONS


    Linux has the concept of ownership and permissions. Files are owned by individual
    users, and permissions control who may view, edit, or run files on the system.
    Frankly, there is little need for a casual user to worry about ownership. If there
    is a need to share files with other users on the system, you''ll want to take
    a look at Lesson 19, “Permissions.” After you''ve logged in to your computer,
    all files that are created during that session will be owned by your account.


    # MULTI-USER


    Besides controlling and tracking who owns what, Linux also allows multi-users
    to access the system simultaneously. This is a drastic change from the desktop
    environment offered by traditional operating systems. While you''re working on
    a spreadsheet, a coworker might be running a series of calculations for an engineering
    project. Many different processes can be run on a single computer by potentially
    hundreds of different users. Lesson 11, “Processes,” explains the concept of processes
    and how to manage them.


    # THE LOGIN PROMPT


    In order to log in to your computer, you need to supply a username and a password.
    You should have received these from your administrator, or you can choose one
    during the Linux software installation. After entering your information, Linux
    loads the appropriate configuration for your account and you are ready to start
    using the system. You''ll find the screen that is displayed when you enter your
    username and password varies from system, depending on the configuration. There
    are two categories that you might encounter: a graphical login screen or a text-based
    screen.


    > Watching Your P''s and Q''s Linux is case-sensitive. Usernames, passwords, and
    directory names are all affected. For example, if you choose a password HAPPY1,
    it is not the same as happy1, or even HAPPY1. If you know you''re typing your
    password correctly, but you still can''t log in, check your Caps Lock button!

