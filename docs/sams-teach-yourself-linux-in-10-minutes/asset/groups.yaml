    # 第 9 节

    其他文本和文件实用


    在本节中你看到的某些内容似乎并不有用，但与其他命令结合使用时会非常强大。如果你学习 Shell 脚本（将在第 14 节讨论），你将感谢 Linux 包含了让生活更简单的实用程序。


    # 计算行、单词和字符：WC


    如果你想对文本文件获取快速统计，但不想将其加载到文字处理程序中，可以使用 wc 命令提供单个文件的行、单词和字符计数。


    要使用 wc，请提供要分析的文件名，格式为 `wc <filename>`。如果你向 `wc` 传递多个文件名，所有文件都将被处理，并会返回一个总计。


    例如


    ```

    >wc *.txt

    300 2799 16284 intro.txt

    4944 43494 257939 lesson7.txt

    5244 46293 274223 total

    ```


    在这个示例中，我们处理了目录下所有的文本文件（intro.txt 和 lesson7.txt）。每个文件返回四列信息。第一个值是文件的行数，第二个是文件的单词数，第三个是字符数。最后一列当然是文件名。如果你想将值限制为行、单词或字符，可以分别使用
    `-l`、`-w` 或 `-c` 选项。


    > 用 wc 的用途：我常用 wc 来检查日志文件中的条目。例如，为了查看自上次重置日志文件以来我的 Web 服务器接收了多少次“访问”，可以使用命令 `wc
    -l /var/log/http/access_log`。这会返回我的访问日志文件的行数。因为每行代表一次访问，我我可以使用 wc 快速统计访问次数。


