    # 修改用户环境


    处理路径（Paths）


    当前目录通常不会包含在路径中；将其包含在内带来了一定的安全风险。如果当前目录在你的路径中，你可能会被欺骗，通过将程序命名为常见的 Linux 命令并将它们溜进你的目录，攻击者可以诱导你执行任意程序。如果你想将当前目录放入路径中，请务必将其放在路径的末尾。这样，正常的
    Linux 程序会在任何可能潜入你系统的木马程序之前被找到。


    如果你想查看当前的路径，可以使用 `echo PATH` 命令。如果路径中缺少了你需要的某些路径（例如当前目录和 `/usr/local/bin`），你可以通过命令
    `export PATH=$PATH:./usr/local/bin` 来添加这些路径。


    # 用户默认：点文件（Dot Files）


    当登录登录并启动 Shell 时，你的账户会自动为你配置某些功能。Shell 外的程序也使用点文件来存储配置信息。点文件字面意思就是以 `.` 字符开头的文件，你可能会发现你的家目录中已经存在大量的此类文件。某些文件包括：


    - .login 和 logout——正如你所猜的，这些是在你登录和注销时分别执行的文件。如果你查看这些文件，会发现它们是你已经熟悉的那些命令的 Shell
    脚本。登录 Shell 脚本通常用于在你为自己设置多个环境时切换配置文件集，以及处理其他需要在登录时自动完成的任务。注销脚本的使用频率低得多，但它可以包含你在注销时需要做的有用操作。你会如何利用
    .login 和 .logout 文件呢？比如在每次登录和注销时添加命令将日期时间信息输出到文件中。如果你曾经需要填过工勤表，你会发现这个方法很有吸引。


    - .bashrc / .bash_profile——在打开 bash 时执行的 Shell 脚本。（其他 Shell 也有各自在启动时执行的脚本，请查看你对应
    Shell 的文档）。同样，你应该熟悉其语法。在该文件中，你可以放置执行各种命令，例如为你的环境添加自定义路径、设置环境变量以及设置你感兴趣的任何别名（aliases）。


    - .plan——该文件包含某些信息，系统会返回给任何使用 .plan 文件的人，包括联系方式、特色名言和轶事。在你的 plan 中放置你希望别人在从远程查询你时看到的内容。


    - .Xdefaults——此文件包含服务器资源数据库使用的设置。该文件的语法在第3 节“图形用户界面”中有简要介绍。通常情况下你不需要修改此文件，但你可以在这里配置关于
    X 服务器如何处理各种程序以及 X11 程序如何工作的许多选项。如果你选择研究它，请务必先创建一个备份副本，以防你需要还原。在做好牢的备份后，不要害怕进行修改。其语法非常直观，如果你已经读到了这里，可能已经弄清楚如何实现你想要尝试的大多数修改。


    你无疑发现你的目录中也有其他点文件。不要害怕查看它们。你会发现大多数文件都比你想象的要易读。虽然刚开始可能有点令人生畏，但让 Linux 适用于你工作的很大程度上在于通过修改这些文件来定制你的环境。先做备份，但不要害怕实验——这是使用
    Linux 乐趣的一半！


    # 修复损坏终端：stty


    有时，你可能会发现自己处于一个似乎稍微出了一故障的命令行窗口中。删除键（Delete）产生 `?`，退格键（Backspace）产生 `^`，而 Ctrl+c
    产生 `^`。如果这种情况发生在你身上，你需要重置删除和中断的终端参数。要做到这一点，请执行以下命令：


    - stty erase <delete>

    - stty intr ^C


    注意，在直接输入控制字符的地方，可以使用 `^<character>` 来表示该字符。如果你的键盘布局让退格键比删除键更方便，也可以使用 `erase Backspace`。如果你的终端完全疯了，且回车键（Return）似乎不再正常工作，你可以尝试使用命令：`stty
    sane Ctrl+j`。此命令尝试将终端重置为默认设置，但不能保证有效。


    # 修改 KDE 外观


    KDE 包含了自定义桌面环境的能力，就像你在 Windows 或 Mac OS 下操作一样。你可以设置背景、屏幕保护程序、字体以及窗口环境的其他属性。你所做的更改仅影响你的个人设置（不是系统范围内的），所以请尽情定制吧！图
    16.1 显示了你可以用于定制桌面的不同设置示例。


    要更改 KDE 外观：


    1. 点击主 K 工具栏菜单项。

    2. 从菜单中选择设置（Settings）。

    3. 选择你想要更改的属性（桌面、声音等）。

    4. 从你选择的类别中选择任何合适的子属性。（例如，选择“桌面”允许你更改颜色、背景和字体等。）

    5. 做出你想要的更改，然后点击应用（Apply）或确定（OK）来设置它们。

    6. 享受吧！


    ![](img/a0a02222222228860321613_0.png)

    图 16.1 KDE 提供了广泛的选择。


    # 总结


    在本节中，你学习了如何通过使用别名、环境变量和配置文件来修改环境。进行这些修改让环境属于你自己。


    - 环境变量——经常用于为程序指定配置选项，例如指向系统所需的目录。

    - PATH 变量——跟踪系统在你输入命令时搜索的位置。如果命令存在于系统中，但命令路径不在 PATH 中，将无法找到。

    - 别名——Shell 的强大功能。它们允许你重命名命令，或在执行命令时始终使用某些选项。

    - 点文件——许多程序使用包含控制信息的文本文件。这些文件名几乎都以 . 开头。它们是自动化 Shell 设置和配置窗口系统选项的地方。

    - stty——当终端出现异常时可以拯救终端会话的命令。


    不要害怕实验。你刚刚完成了关于修改用户环境的课程。现在去尝试吧！


    # 第 17 节：打印


    在本节中，你将学习如何向网络上的打印机发送打印请求（作业）。


    设置打印机的设置因打印机而异，并且需要超级用户（root）权限，因此在书中演示这项任务很难。Linux 计算机通常与服务器通信，通过 TCP/IP 网络访问远程打印机。幸运的是，本地打印机（直接连接）和远程打印机的访问方式相同，因此我们可以向你展示如何通用地使用打印机，无论你的系统管理员如何配置计算机。


    ## 发送打印作业：lpr


    > PostScript 与非 PostScript 本节中的假设是你正在向 PostScript 打印机打印。然而，你的系统可能配置为使用栅化器解释 PostScript
    并打印到非 PostScript 打印机。


