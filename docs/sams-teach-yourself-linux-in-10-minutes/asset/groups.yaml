    Suppose, however, you''ve started a command with default priority that has been
    running for a day, and you have no idea when it''s going to finish. This sort
    of runtime is typical for many scientific and data analysis applications. You
    figure you might as well lower the priority and let it finish whenever it decides
    to. You can use renice to change the priority of a command that is already running.


    To do this, follow these steps:


    +   - First, you''ll need to get a listing of your processes and make a note of
    the PID that you want to change.


    +   - Issue the renice command using this syntax: renice <priority> <process ID>.


