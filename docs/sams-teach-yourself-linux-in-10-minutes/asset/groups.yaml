  - '[PAGE 17]


    # TEXT-BASED LOGIN


    The text-based screen varies based on the Linux distribution you are using. The
    Caldera OpenLinux prompt, for example, looks like this:


    ```

    Caldera OpenLinux(TM)

    Version 1.3

    Copyright 1996-1998 Caldera Systems, Inc.

    ```


    login:

    password:


    At the login prompt, type your username and press Return or Enter. The password
    prompt appears immediately afterward. When typing your password, the data won''t
    show onscreen in order to protect your account from prying eyes. If you successfully
    type both your username and password, you will reach a shell prompt and can begin
    issuing commands to the system. Don''t worry if you don''t know what to do next,
    you''ll learn how to do something productive shortly!


    > Oops! Don''t worry if you make a mistake logging in. The system will log the
    failed attempt to a security file. In the default configuration, Linux gives you
    another chance to log in. There''s no need to panic if you don''t get it right
    the first time; everyone makes mistakes.


    # GRAPHICAL LOGIN


    Instead of a text prompt, your machine might be configured with something a bit
    snazzier—a graphical screen where you can type your login information. This works
    exactly the same as the text-based system, but immediately launches you into the
    X Window environment. If you work exclusively in X Windows, you might want to
    ask your administrator to install KDM or XDM, which provide graphical login services.


    # THE LOGOUT PROCESS


    Now that you know how to log in to your system, let''s take a brief look at how
    to log out and why it''s important. You already know that your'
  - '[PAGE 18]


    computer can have multiple people using simultaneously and that it can have files
    owned by many different people. The login process identifies you to the system,
    and lets you control the computer using your username; the logout process reverses
    this. It closes any files that you might have open and shuts down any programs
    that you might have left running. If you remain logged in constantly, you could
    be exposing the system to security risks, or the processes you have left running
    slow down the computer for other users. It''s always best to log out of your computer
    when you''re finished using it.


    An important word of caution: You should never turn your computer off without
    running through the correct shutdown procedure. Pressing Control+Alt+Del makes
    your machine run through an appropriate shutdown. It''s best to do this from a
    login prompt so you don''t lose any files you''re working on. Lesson 20, “Privileged
    Commands,” demonstrates other methods of shutting down your system.


    # LOGGING OUT FROM A TEXT-BASED SESSION


    If you are not running a graphical session (there are no windows on your screen),
    the only command you need to log out is, not surprisingly, logout.


    In order to log out from a command prompt, type


    ```

    >logout

    ```


    The system will immediately return to the login prompt. That''s it. You''ve successfully
    logged out of the computer.


    # LOGGING OUT FROM A KDE SESSION


    If you logged in to the system through the KDE (K Desktop Environment) graphical
    interface, you can point and click your way out of the system as well. You''ll
    learn more about the KDE system in Lesson 3, “The Graphical User Interface.” To
    log out


    +   1. Click the K symbol to bring up the main KDE menu.

    2. Select Logout from the menu

    3. You will be prompted that KDE is ready to close your session. Click the Logout
    button to complete the process.'
  - '[PAGE 19]


    # THE UNIX AND LINUX COMMAND PROMPT


    You''re probably wondering what Linux is going to be if you all you can do is
    log in and out. Patience Linux can be a bit overwhelming approached too quickly.
    The power of UNIX, and thus Linux, comes from the wealth of built-in utilities
    and the way that processes can be combined to perform tasks that would require
    customized programming on other operating systems. For example, suppose you''re
    running a Web server on your Linux computer and you want to count the number of
    accesses from a machine named kiwi. If you''re a programmer, it wouldn''t be too
    difficult to write a program to do this, but you don''t need to! Instead, you
    could just enter a command as this one:


    ```

    > grep "kiwi" /var/log/http/access.log wc -1

    ```


    This counts the number of lines that contain kiwi in the Web server log file.
    Obviously you shouldn''t know this yet, but you will by the end of this book.
    When you are typing commands into Linux, you are typing them into what is known
    as a shell. For the old DOS users out there, a shell is equivalent to COMMAND.COM.
    If you remember the days of DOS, you probably remember different DOS shells that
    UNIX has a wide variety of shells that you can use, each offering a different
    set of capabilities. Besides giving the user a place to run commands, shells also
    provide a scripting language, much like a DOS batch file, but far more capable.
    Programs written using a shell are called shell scripts.


    # LOTS AND LOTS OF SHELLS


    There are numerous shells available for Linux. Most people try the different shells
    and choose one that they like. If you don''t plan on programming the shell, you''ll
    probably never need to change your shell. Lesson 15, "User Utilities," discusses
    the techniques you can use to switch to a different shell. Here is a quick overview
    of just a few of the different shells that are available, and the benefits they
    offer:


    +   - sh--This is the shell. It is available on any UNIX distribution that you
    might use, and it offers a simple scripting syntax. Most'
  - '[PAGE 20]


    # GETTING STARTED


    people use sh only when they are writing programs that must run on absolutely
    any UNIX machine.


    +   - csh—The C shell. (Yes, it''s pronounced sea shell.) The csh takes its name
    from the C programming language. The scripting environment that is offered by
    csh is similar to the C language, and offers enough flexibility to write lengthy
    customized scripts that run on most UNIX machines.


    +   - bash—Bash is a modern shell that has received most of the attention from
    the Linux community, and is included as the default shell on most Linux machines.
    Bash offers the same capabilities of csh, but it offers advanced features for
    the user as well as the programmer. Bash includes command and filename completion
    and an easily accessible command history that persistent across different login
    sessions.


    There are far more shells, but these three will probably make the bulk of any
    that you encounter. Don''t worry if you sit in front of a computer that is running
    a different shell—you can still operate the computer using the knowledge you''ll
    gain in this book. You might experience some differences in the scripting architecture,
    but you''re not going to be lost.


    # SHELL COMMAND SYNTAX


    Using a shell is as simple as typing the command you want to use and pressing
    Enter. There are a few rules, however, that might help if you are having trouble
    getting a command to work.


    +   - Commands are case-sensitive, and are usually lowercase. Unlike Windows,
    you cannot mix cases and still have a function; you must type the command exactly
    as it is stored on the system.


    +   - Frequently, the current directory isn''t included in your PATH environment
    variable. Your path includes the directories of all the commands that you can
    access by typing just the command''s name (you’ll find out how to modify this
    in Lesson 16—“Modifying the User Environment”). Because the current directory
    isn''t necessarily included, you might be in a directory that'
  - '[PAGE 21]


    # LESSON 1


    holds a program called parachute but you''ll find that you can''t run the program
    by typing parachute. In order to run the command, tell the system that the parachute
    command is in the same directory you are in by preceding it with /. Thus, parachute
    could be run by typing ./parachute inside its directory.


    > What''s with the . and / ? These characters represent the current directory
    (.) and the directory separator (/). / is essentially the path to the directory
    that you are currently in.


    +   - There are special symbols, commands, and the like, that might leave your
    shell in a state that seems unusable. This generally means that you''ve started
    some sort of process that is expecting input from you. There are three control
    characters that might help you regain control of your commands. To type one of
    these control characters, hold down the control key while pressing the corresponding
    letter:


    +   - Ctrl+d—ells the computer that you are finished sending input to a command.
    This is useful if you''ve accidentally started a program and can''t get out.


    +   - Ctrl+c—the UNIX “bbreak” character. This usually kills any program that
    is currently running, and then returns you to a command prompt.


    +   - Ctrl+z—This suspends the current process you were running and returns you
    to a command prompt. Logging out kills the suspended command.


    Don''t be afraid to try the commands discussed in this book and explore the system
    to find more. You''ll be amazed at what can be done with a little bit of typing.'
- md: "\n# SUMMARY\n\nThis lesson taught you a few very important skills that you\
    \ will need to begin using your Linux computer effectively. Although most of the\
    \ concepts introduced are relatively simple, they are important in understanding\
    \ how and why Linux operates the way it does.\n\n- Login—Logging in Linux allows\
    \ the system to identify you as a user and apply the appropriate ownership to\
    \ files you create and modify. Each user has his or her own environment and can\
    \ run programs simultaneously with other users.\n- Logout—Logging out of the computer\
    \ closes open files and ends processes that are owned by the current user. You\
    \ should always log out of the system when you are finished using it.\n- Command\
    \ line—The UNIX command line allows you to create complex functions by stringing\
    \ together a variety of built-in commands. What requires specialized software\
    \ on other systems can usually be accomplished using built-in UNIX utilities.\n\
    - Shells—There are many different types of shells that you can use. Depending\
    \ on your needs as a programmer and a user, you will need to evaluate the shell\
    \ features you find necessary and choose appropriately.\n- Using the command line—Commands\
    \ can be typed directly into a shell, as you would expect. Keep in mind that commands\
    \ are usually lowercase, and you might need to specify a path to the command if\
    \ it is not included in your PATH environment variable.\n\n![](img/a0e6136ea1c86032b26127d28a7bd962_23_0.png)\n\
    \n# LESSON 2\n# DOCUMENTATION AND FINDING HELP\n\nThis lesson provides several\
    \ methods of retrieving information about the built-in commands and capabilities\
    \ of Linux.\n\nIf you've poked around your Linux system a bit, you've probably\
    \ noticed that there are literally thousands of different files and applications\
    \ on your computer. You might find this to be a bit overwhelming at first, but\
    \ the diversity and extensive capabilities of the operating system are part of\
    \ its main attraction. If there is something you want to do, you can bet that\
    \ Linux has a utility or combination of utilities that can help you get the job\
    \ done. The biggest question on your mind is probably “How do I use this stuff?”\n\
    \n## LINUX MANUAL PAGES\n\nThe Linux manual, or *man*, pages are the quickest\
    \ and easiest source for information on how to use the commands on your system.\
    \ They provide information on what programs to do, how to use them, and other\
    \ utilities that you might be interested in checking out. If you're a programmer,\
    \ man pages can also provide useful programming information.\n\n### man\n\nTo\
    \ display a *manual page*, use the *man* command. In its simplest form, you type\
    \ *man* followed by the command you want to look up. Because man pages change\
    \ as software is updated, you might notice differences between man pages on different\
    \ versions of Linux.\n\nFor example, to look up the man page for the date command,\
    \ you would type\n\n# >man date\n\nDATE(1)\nNAME\n\ndate    - print or set the\
    \ system date and time\n\nSYNOPSIS\n\n```\ndate [-u] [-d datestr] [-s datestr]\
    \ [-utc] [-universal]\n[-date=datestr] [-set=datestr] [-help] [-version]\n[FORMAT]\
    \ [MMDDhhmm[[CC]YY.ss]]\n```\n\nDESCRIPTION\n\nThis manual page describes the\
    \ GNU version of date. date with no arguments prints the current time and date\
    \ (in the format of the '%c' directive described below). If given an argument\
    \ starts with a '+', it prints the current time and date in a format controlled\
    \ by that argument, which has the same format as the format string passed to `strftime`\
    \ function.\n\n> How do I Read the Rest? When you see an ... on your screen, that\
    \ means there's more text to be read. The pages won't scroll automatically, so\
    \ you'll need to push the Spacebar for additional text, and press q to quit the\
    \ page and return to the command line.\n\nThis is only a tiny subset of the information\
    \ that is returned via the man command, but enough to get the picture. You'll\
    \ find that using man pages to find out everything that is available on your system\
    \ going to take a bit of time. To speeds up, you can view a summary description\
    \ of a command using one of the following: man -f, man -k, whatis, or apropos,\
    \ followed by the name of the command you like to explore. Each of these functions\
    \ will return similar results, but there are two different ways the search is\
    \ performed.\n\n![](img/a0e6136ea1c86032b26127d28a7bd962_24_0.png)\n\n# man VARIATIONS,\
    \ apropos, whatis\n\nIf you know the command you'd like to look up, use man -f,\
    \ or whatis followed by the command name.\n\nFor example, to print a summary for\
    \ the date command\n\n- man -f date\n- date (1) - print or set the system date\
    \ and time\nEND\n\nA short description of what date does is returned. You'll need\
    \ to press q to return to the command line.\n\nIf you're not sure what you're\
    \ looking for, man -f and whatis will search the description of each available\
    \ command for matching keywords. If you experience any errors while running these\
    \ commands, it might be because the whatis database has been removed from your\
    \ system or has not been created. You'll need to contact your system administrator\
    \ and ask her or him to make whatis to generate the database files necessary to\
    \ use whatis. This is a function that affects protected areas of the system, it\
    \ is not available to most users.\n\nNow running whatis on the time command. This\
    \ should turn up several relevant entries.\n\n- time (2) - get time in seconds\n\
    - time (n) - Time the execution of a script\n- Time::Local (3) - efficiently compute\
    \ time from local and GMT time\n- Time::gmtime (3) - by-name interface to Perl's\
    \ built-in gmtime() function\n- Time::localtime (3) - by-name interface to Perl's\
    \ built-in localtime() function\n- Time::tm (3) - internal object used by Time::gmtime\
    \ and Time::localtime\nEND\n\nYou can see that the time keyword has turned up\
    \ six different entries in the whatis database. To return to the command prompt,\
    \ you'll need to press q.\n\n# DOCUMENTATION AND FINDING HELP\n\nWhat do the Extra\
    \ Letters and Numbers Mean? You notice that some commands are followed by a numeral\
    \ or letter. This is the section number for that command. For instance, time is\
    \ followed by both n and 2. This means there are two separate uses for time. To\
    \ learn information about each variations, we use man followed by the section\
    \ number. For example, man n or man 2. Lastly, if you're entirely unsure of what\
    \ you want and keyword search does not return anything, try apropos or man -k.\
    \ It searches the descriptions like whatis, but also displays partial matches\
    \ to the string.\n\n>apropos time\n\n- clock (3) - Determine time\n- clock (n)\
    \ - Obtain and manipulate\n- convdate (1) - convert time and numbers\n- date (1)\
    \ - print or set the system date and time\n- difftime (3) - calculate difference\n\
    - ftps (8) - close down the servers\n- kbdrate (8) - reset the keyboard rate\n\
    - ametail (1) - mailcap-based mail handling\n- sleep (2) - pause execution for\
    \ a specified time\n- utc (8) - print or set Coordinated Universal Time\n  - --help\
    \ - display this help and exit\n  - --version - output version information and...\n\
    \nThis command actually turned up over 70 matches on your system, far more than\
    \ whatis displayed. Try to be as specific as possible when you use apropos or\
    \ man -k or you might find yourself spending a great deal of wading through extraneous\
    \ information. Don't forget, the ... means there's more information to be accessed\
    \ by pressing the Spacebar. As before, pressing q returns you to the command prompt.\n\
    \n# BUILT-IN HELP\n\nMany of the Linux commands have a built-help that isn't as\
    \ verbose as the man pages, and it can be brought up in a jiffy. If you find that\
    \ you're constantly using the man pages to find the options that are available\
    \ for a specific command, and you might want to see if it has its own help summary.\
    \ If you've spent much time using the compression or archiving utilities, youll\
    \ know what I mean. For many commands help will provide the information you need.\
    \ In some cases, it might be as simple as --h. If the first one doesn't work,\
    \ try again. It's possible that built-in help is not available, so don't be surprised\
    \ if you run into cases where this doesn't work as you had hoped.\n\nTo view the\
    \ built-help for the date command, you would type\n\n```\n>date --help\nUsage:\
    \ date [OPTION]... [+FORMAT]\nor: date [OPTION] [MMDDhmmm[[CC]]YY]][.ss]\nDisplay\
    \ the current time in the given FORMAT, or set the\nsystem date.\n\n- -d, --date=STRING\
    \             display time described by STRING,\nnot 'now'\n- -f, --file=DATEFILE\
    \            like --date once for each line\nof DATEFILE\n- -r, --reference=FILE\
    \          display the last modification time\nof FILE\n- -R, --rfc-822      \
    \            output RFC-822 compliant date\nstring\n- -U, --utc, --universal \
    \        print or set Coordinated Universal\nTime\n  - --help                \
    \         display this help and exit\n  - --version                      output\
    \ version information and\n...\n```\n\nAlthough not as descriptive as the man\
    \ pages, the information is useful and to the point.\n"
  mdcn: "\n\n# 总结\n\n本节课程了你几个非常重要的技能，这些技能将帮助你开始有效地使用你的 Linux 计算机。虽然介绍的大部分概念相对简单，但它们对于理解\
    \ Linux 如何以及为何这样运行至关重要。\n\n- 登录（Login）——在 Linux 中登录允许系统将你识别为用户，并对你创建和修改的文件应用相应的所有权。每个用户都有自己的环境，并且可以与其他用户同时运行程序。\n\
    - 注销（Logout）——退出计算机会关闭打开的文件并结束当前用户的所有进程。在使用完系统后，你应该始终退出系统。\n- 命令行（Command line）——UNIX\
    \ 命令行允许你通过串联各种内置命令来创建复杂的函数。在其他系统中需要专门软件的功能，通常可以使用内置的 UNIX 工具完成。\n- Shell（Shells）——有许多不同类型的\
    \ Shell 可以使用。根据你作为程序员和用户的需求，你将评估你认为必要的 Shell 功能并进行恰当的选择。\n- 使用命令行——正如你预期的那样，可以直接在\
    \ Shell 中输入命令。请记住，命令通常是小写的，如果命令没有包含在 PATH 环境变量中，你可能需要指定该命令的路径。\n\n![](img/a0e6136ea1c86032b26127d28a7bd962_23_0.png)\n\
    \n# 第 2 Lesson\n# 文档与查找帮助\n\n本节课程提供了几种获取有关 Linux 内置命令和功能信息的方法。\n\n如果你对你的 Linux\
    \ 系统进行过研究，你可能注意到你的计算机上实际上有成千上万个不同的文件和应用程序。起初你可能会觉得这有些无从从，但操作系统的多样性和广泛的功能是其主要吸引力所在。如果你想做某些事情，你可以相信\
    \ Linux 有某个工具或工具组合可以帮助你完成工作。你脑海中最大的问题可能是“我该如何使用这些东西？”\n\n## Linux 手册页 (LINUX MANUAL\
    \ PAGES)\n\nLinux 手册（或 *man*）页是获取如何使用系统上命令信息的最快速、最简单的来源。它们提供了关于程序可以做什么、如何使用它们以及你可能感兴趣查看的其他工具的信息。如果你是程序员，man\
    \ 页还可以提供有用的编程信息。\n\n### man\n\n要显示*手册页*，请使用 *man* 命令。在最简单的形式下，你输入 *man* 后跟你想要查找的命令。因为\
    \ man 页随着软件的更新而变化，你可能会注意到不同版本的 Linux 的 man 页之间存在差异。\n\n例如，要查找 date 命令的手册页，你可以输入\n\
    \n# >man date\n\nDATE(1)\nNAME\n\ndate    - 打印或设置系统日期和时间\n\nSYNOPSIS\n\n```\n\
    date [-u] [-d datestr] [-s datestr] [-utc] [-universal]\n[-date=datestr] [-set=datestr]\
    \ [-help] [-version]\n[FORMAT] [MMDDhhmm[[CC]YY.ss]]\n```\n\nDESCRIPTION\n\n此手册页描述了\
    \ GNU 版本的 date。不带参数的 date 会打印当前时间和日期（采用下文描述的 '%c' 指令格式）。如果给出一个以 '+' 开头的参数，它将按照该参数控制的格式打印当前时间和日期，该格式与传递给\
    \ `strftime` 函数的格式字符串格式相同。\n\n> 我该如何阅读其余部分？当你在屏幕上看到 ... 时，这意味着有更多文本需要阅读。页面不会自动滚动，因此你需要按下空格键查看更多文本，并按\
    \ q 退出页面返回命令行。\n\n这只是通过 man 命令返回的信息的极小部分，但足够了解大致情况。你会发现，使用 man 页查找系统上所有可用内容将花费一些时间。为了加快速度，可以使用以下任之一查看命令的摘要描述：man\
    \ -f、man -k、whatis 或 apropos，后跟你想要探索的命令名称。这些功能都将返回相似的结果，但搜索执行有两种不同的方式。\n\n![](img/a0e6136ea1c86032b26127d28a7bd962_24_0.png)\n\
    \n# man 变体, apropos, whatis\n\n如果你知道想要查找的命令，请使用 man -f 或 whatis 后跟命令名。\n\n例如，打印\
    \ date 命令的摘要：\n\n- man -f date\n- date (1) - 打印或设置系统日期和时间\nEND\n\n将返回关于 date 作用的简短描述。你需要按\
    \ q 返回命令行。\n\n如果你不确定在找什么，man -f 和 whatis 将在每个可用命令的描述中搜索匹配关键词。如果你在运行这些命令时遇到任何错误，可能是因为系统从删除了\
    \ whatis 数据库或尚未创建。你需要联系你的系统管理员，让他或她运行 whatis 来生成使用 whatis 必需的数据库文件。这是一个影响系统保护区域的功能，大多数用户无法使用。\n\
    \n现在对 time 命令运行 whatis。这应该会出现几个相关的条目。\n\n- time (2) - 获取秒数的时间\n- time (n) - 脚本的执行计时\n\
    - Time::Local (3) - 从本地和 GMT 时间高效地计算时间\n- Time::gmtime (3) - 到 Perl 内置 gmtime()\
    \ 函数的命名接口\n- Time::localtime (3) - 到 Perl 内置 localtime() 函数的命名接口\n- Time::tm (3)\
