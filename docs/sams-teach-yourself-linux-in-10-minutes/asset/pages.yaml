  md: '# COMPRESSION AND ARCHIVING TOOLS


    Polite Use of tar If you don''t know what is in a tar file, it is a good idea
    to use tar -tvf tarfile.tar before unpacking it. The -t option is the tell option
    and asks tar to tell you about the contents of the file rather than unpacking
    it. This is a useful way to determine if the person who created the tar file was
    a nice person who put everything in a directory, and then tarred the directory;
    or if he she was an impolite person who did not put everything in the current
    directory before tarring; if you run into a tar file created by an impolite user,
    and make the mistake of untaring in an inconvenient place—your home directory,
    for example—tar will end up dribbling files all over your home directory. You
    will then be stuck finding all the files and putting them in a subdirectory by
    hand, sometimes a very tedious process. Be a polite user—don''t tar files; tar
    directories.


    # PREPARING FOR EMAIL

    TRANSMISSION: uuencode/uudecode


    If you need to send your files to another user, you can do this easily by including
    them in an email message. PINE, for example, lets you attach a file by pressing
    Ctrl+J. If you don''t have PINE on your system, you can use the oldest encoding
    standard available, uuencode. This lets you encode files for transmission even
    on the most basic Linux installations. The uuencode program accepts any file as
    input, and it produces encoding of the file that can be included in an email message.
    The contents of this file look like random characters, but on the receiving end,
    the user can use the uuencode program to extract the original file. Because every
    email program is different, you''ll need to consult the documentation for your
    email client on how to include a file into a message. Here you''ll just learn
    how to create the uuencoded file from your original, and how to uudecode again
    on the other side.'
