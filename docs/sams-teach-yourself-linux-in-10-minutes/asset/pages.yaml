    # # LESSON 2

    # DOCUMENTATION AND FINDING HELP


    This lesson provides several methods of retrieving information about the built-in
    commands and capabilities of Linux.


    If you''ve poked around your Linux system a bit, you''ve probably noticed that
    there are literally thousands of different files and applications on your computer.
    You might find this to be a bit overwhelming at first, but the diversity and extensive
    capabilities of the operating system are part of its main attraction. If there
    is something you want to do, you can bet that Linux has a utility or combination
    of utilities that can help you get the job done. The biggest question on your
    mind is probably “How do I use this stuff?”


    # ## LINUX MANUAL PAGES


    The Linux manual, or *man*, pages are the quickest and easiest source for information
    on how to use the commands on your system. They provide information on what programs
    to do, how to use them, and other utilities that you might be interested in checking
    out. If you''re a programmer, man pages can also provide useful programming information.


    # ### man


    To display a *manual page*, use the *man* command. In its simplest form, you type
    *man* followed by the command you want to look up. Because man'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'pages change as software is updated, you might notice differences

    bween man pages on different versions of Linux.


    For example, to look up the man page for the date command, you would

    type


    # >man date


    DATE(1)

    DATE(1)


    NAME


    date    - print or set the system date and time


    SYNOPSIS


    ```

    date [-u] [-d datestr] [-s datestr] [-utc] [-universal]

    [-date=datestr] [-set=datestr] [-help] [-version]

    [+FORMAT] [MMDDhhmm[[CC]YY.ss]]

    ```


    DESCRIPTION


    This manual page describes the GNU version of date. date

    with no arguments prints the current time and date (in the

    format of the ''%c'' directive described below). If given

    an argument starts with a ''+'', it prints the current

    time and date in a format controlled by that argument,

    which has the same format as the format string passed to

    t`strftime` function.


    > How do I Read the Rest? When you see an ... on your

    screen, that means there''s more text to be read. The

    pages won''t scroll automatically, so you''ll need

    to push the Spacebar for additional text, and press

    q to quit the page and return to the command line.


    This is only a tiny subset of the information that is returned via the man

    command, but enough to get the picture. You''ll find that using man

    pages to find out everything that is available on your system

    going to take a bit of time. To speeds up, you can view a summary

    description of a command using one of the following: man -f,

    man -k, whatis, or apropos, followed by the name of the command you

    like to explore. Each of these functions will return similar results, but

    there are two different ways the search is performed.


    ![](img/a0e6136ea1c86032b26127d28a7bd962_24_0.png)'
