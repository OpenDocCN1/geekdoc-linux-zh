  md: '# THE UNIX AND LINUX COMMAND PROMPT


    You''re probably wondering what Linux is going to be if you all you can do is
    log in and out. Patience Linux can be a bit overwhelming approached too quickly.
    The power of UNIX, and thus Linux, comes from the wealth of built-in utilities
    and the way that processes can be combined to perform tasks that would require
    customized programming on other operating systems. For example, suppose you''re
    running a Web server on your Linux computer and you want to count the number of
    accesses from a machine named kiwi. If you''re a programmer, it wouldn''t be too
    difficult to write a program to do this, but you don''t need to! Instead, you
    could just enter a command as this one:


    ```

    > grep "kiwi" /var/log/http/access.log wc -1

    ```


    This counts the number of lines that contain kiwi in the Web server log file.
    Obviously you shouldn''t know this yet, but you will by the end of this book.
    When you are typing commands into Linux, you are typing them into what is known
    as a shell. For the old DOS users out there, a shell is equivalent to COMMAND.COM.
    If you remember the days of DOS, you probably remember different DOS shells that
    UNIX has a wide variety of shells that you can use, each offering a different
    set of capabilities. Besides giving the user a place to run commands, shells also
    provide a scripting language, much like a DOS batch file, but far more capable.
    Programs written using a shell are called shell scripts.


    # LOTS AND LOTS OF SHELLS


    There are numerous shells available for Linux. Most people try the different shells
    and choose one that they like. If you don''t plan on programming the shell, you''ll
    probably never need to change your shell. Lesson 15, "User Utilities," discusses
    the techniques you can use to switch to a different shell. Here is a quick overview
    of just a few of the different shells that are available, and the benefits they
    offer:


    +   - sh--This is the shell. It is available on any UNIX distribution that you
    might use, and it offers a simple scripting syntax. Most'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# GETTING STARTED


    people use sh only when they are writing programs that must run on absolutely
    any UNIX machine.


    +   - csh—The C shell. (Yes, it''s pronounced sea shell.) The csh takes its name
    from the C programming language. The scripting environment that is offered by
    csh is similar to the C language, and offers enough flexibility to write lengthy
    customized scripts that run on most UNIX machines.


    +   - bash—Bash is a modern shell that has received most of the attention from
    the Linux community, and is included as the default shell on most Linux machines.
    Bash offers the same capabilities of csh, but it offers advanced features for
    the user as well as the programmer. Bash includes command and filename completion
    and an easily accessible command history that persistent across different login
    sessions.


    There are far more shells, but these three will probably make the bulk of any
    that you encounter. Don''t worry if you sit in front of a computer that is running
    a different shell—you can still operate the computer using the knowledge you''ll
    gain in this book. You might experience some differences in the scripting architecture,
    but you''re not going to be lost.


    # SHELL COMMAND SYNTAX


    Using a shell is as simple as typing the command you want to use and pressing
    Enter. There are a few rules, however, that might help if you are having trouble
    getting a command to work.


    +   - Commands are case-sensitive, and are usually lowercase. Unlike Windows,
    you cannot mix cases and still have a function; you must type the command exactly
    as it is stored on the system.


    +   - Frequently, the current directory isn''t included in your PATH environment
    variable. Your path includes the directories of all the commands that you can
    access by typing just the command''s name (you’ll find out how to modify this
    in Lesson 16—“Modifying the User Environment”). Because the current directory
    isn''t necessarily included, you might be in a directory that'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# LESSON 1


    holds a program called parachute but you''ll find that you can''t run the program
    by typing parachute. In order to run the command, tell the system that the parachute
    command is in the same directory you are in by preceding it with /. Thus, parachute
    could be run by typing ./parachute inside its directory.


    > What''s with the . and / ? These characters represent the current directory
    (.) and the directory separator (/). / is essentially the path to the directory
    that you are currently in.


    +   - There are special symbols, commands, and the like, that might leave your
    shell in a state that seems unusable. This generally means that you''ve started
    some sort of process that is expecting input from you. There are three control
    characters that might help you regain control of your commands. To type one of
    these control characters, hold down the control key while pressing the corresponding
    letter:


    +   - Ctrl+d—ells the computer that you are finished sending input to a command.
    This is useful if you''ve accidentally started a program and can''t get out.


    +   - Ctrl+c—the UNIX “bbreak” character. This usually kills any program that
    is currently running, and then returns you to a command prompt.


    +   - Ctrl+z—This suspends the current process you were running and returns you
    to a command prompt. Logging out kills the suspended command.


    Don''t be afraid to try the commands discussed in this book and explore the system
    to find more. You''ll be amazed at what can be done with a little bit of typing.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# SUMMARY


    This lesson taught you a few very important skills that you will need to begin
    using your Linux computer effectively. Although most of the concepts introduced
    are relatively simple, they are important in understanding how and why Linux operates
    the way it does.


    +   - Login—Logging in Linux allows the system to identify you as a user and apply
    the appropriate ownership to files you create and modify. Each user has his or
    her own environment and can run programs simultaneously with other users.


    +   - Logout—Logging out of the computer closes open files and ends processes
    that are owned by the current user. You should always log out of the system when
    you are finished using it.


    +   - Command line—The UNIX command line allows you to create complex functions
    by stringing together a variety of built-in commands. What requires specialized
    software on other systems can usually be accomplished using built-in UNIX utilities.


    +   - Shells—There are many different types of shells that you can use. Depending
    on your needs as a programmer and a user, you will need to evaluate the shell
    features you find necessary and choose appropriately.


    +   - Using the command line—Commands can be typed directly into a shell, as you
    would expect. Keep in mind that commands are usually lowercase, and you might
    need to specify a path to the command if it is not included in your PATH environment
    variable.'
  merge: -1
