  md: '5. Make the changes you''d like, and then click the Apply or OK to

    set them.


    6. Enjoy!


    ![](img/a0e6136ea1c86032b26127d28a7bd962_163_0.png)


    Figure 16.1 KDE offers a wide selection of custom configuration

    options.


    # SUMMARY


    In this lesson, you were introduced to the idea of modifying your environ-

    ment settings by the use of aliases, environment variables, and configura-

    tion files. Making these modifications is what lets you make the

    environment you work in your own. Let''s review what is covered in this

    lesson:


    +   - Environment variables—Frequently used for specifying single

    configuration options to a program, such as providing a pointer

    to a directory that the program needs.


    +   - PATH variable—Keeps track of where the system searches for

    commands when you type them. If a command exists on the sys-

    t, but the path to the command is not in your PATH variable, it

    will not be found when you type the command name.'
