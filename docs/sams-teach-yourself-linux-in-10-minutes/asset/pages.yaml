  md: '# bzip2/bunzip2


    While a relatively new addition to the Linux/UNIX compression scene, the bzip2
    compressor appears to produce better compression than either compress or gzip.
    The syntax and options for bzip2 have intentionally been made similar to gzip,
    so if you should encounter this program as it grows in popularity, you shouldn''t
    have too much figuring it out. Compression with bzip2 follows the gzip format:
    bzip2 <filename>, which produces the compressed file <filename.bz2>. Decompression
    is simply bunzip <filename.bz2>.


    The bzip2 compression and decompression utilities appear to be in development
    as this writing, so it would not be surprising to find that the commands evolve
    over time (bzip2 and .bz files are an update of a prior bzip program that made
    bz files). If you encounter these programs and need to do more than trivial compressions
    or decompressions, it is recommended that you consult your local man pages for
    more current information.


    # MANAGING YOUR DISK USAGE


    If you''re on a system where you need to worry about disk usage, have a disk quota
    that you must remain under, or are just curious about how much space your files
    are taking up, there are a Number of commands you can use to look at this data:


    +   - ls—Turning back to Lesson 4, "The File System," you can use the ls command
    with the -l option to display disk usage for a file or files. If you need to scan
    quickly through your files to see which ones are taking up the most room, this
    is a quick way to do it.


    +   - find—In Lesson 5, "Finding Files," you were introduced to using the find
    command to find files over a certain size. Size similar in utility to the ls -l
    command for this purpose, find -size # is a faster way to collect information
    on all files # kilobytes—you just have to know what # you''re looking for.


    +   - df—Used by system administrators, the df command provides information about
    disk usage. Depending on your'
  merge: -1
  pgno: 109
