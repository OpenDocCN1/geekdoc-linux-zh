  md: 'Use more, less, or cat to display any of the files that might be of interest
    to you. For example, to display information on setting up a 3Dfx accelera-tor
    card, type the following:


    ```

    > /usr/doc/HOWTO/3dfx-HOWTO

    ```


    Complete configuration instructions will be displayed. There are a very large
    number of HOWTO files available, so you should be sure to check to see if a HOWTO
    help file is available for any problems you encounter.


    # HTML HELP INFORMATION


    Much of the HOWTO information, as well as other documentation, is available in
    HTML format. Viewing the documentation in HTML format using the Lynx browser might
    be a more pleasant experience. You can use any browser you''d like to display
    the information. Lynx, however, is usable from the command line, and is extremely
    fast. The HTML version of the HOWTO documentation is located in the /usr/doc/HOWTO/other-formats/html.


    For example, to view the 3Dfx-HOWTO file in HTML format, you could do this


    ```

    >lynx /usr/doc/HOWTO/other-formats/html/3Dfx-HOWTO.html

    ```


    The text-based Lynx browser loads and displays the HTML formatted version of the
    3Dfx HOWTO document.


    > Format Varieties Documentation can come in formats other than plain text or
    HTML. If you stumble across a file ending in .ps, .eps, or something else that
    isn''t easily readable, check out the section, “File Formats,” in Lesson 7.


    # OTHER INFORMATION SOURCES


    Linux is growing quickly, and so are the resources that provide support and information.
    Searching for Linux using any Web search engine will'
  merge: -1
