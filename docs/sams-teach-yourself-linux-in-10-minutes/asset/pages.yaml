  md: 'The last 10 entries from my Web server log are displayed. Because the log file
    is around 50MB in size, it''s a good thing I don''t have to read through it with
    cat or more just to see what''s at the bottom! You can change the number of lines
    that tail displays by adding the -<number of lines>1 option.


    An extremely useful feature of tail is the capability to show files as they grow,
    rather than just showing the end of a file and exiting. Using the -f (follow)
    option with tail opens a file, displays the last 10 lines, and starts monitoring
    the file for new information. When a new line of data is written to the file,
    it is immediately displayed onscreen. To interactively monitor the Web server
    log from the previous example, I could use tail -f /var/log/httpd/access_log to
    see hits on my Web server as they occur. Press Ctrl+c exits this tail mode.


    # # Other File Formats


    Besides text files, you might encounter other documentation and README file formats
    on your Linux computer that you need to look at. Here is a brief summary.


    +   - GZ—This is a zipped (compressed) file. Some documentation might be stored
    in this format. Rather than unzipping the file, you can use zcat to display the
    file directly.

    - PS, EPS—These are PostScript files. If you look at these files, you''ll notice
    that you can read the contents, but there is a lot of extraneous formatting information.
    Check out the ghostscript (or gs) command if you need to view a PostScript file.

    - HTML—Obviously, HTML files. If you aren''t running the X Window System, you
    can read HTML files from the command line with the Lynx browser.

    - TEX—A formatted file. TeX is a page layout language that is sometimes used to
    store program documentation. Look to the tex utility to work with these files.


    That should cover most of the cases that you''ll encounter. Luckily, everything
    readable in Linux is stored as an HTML or text file. You''ll probably never need
    to worry about other formats.'
