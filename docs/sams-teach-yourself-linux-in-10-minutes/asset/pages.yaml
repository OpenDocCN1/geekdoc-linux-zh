  md: 'The KDE Help viewer is a full-fledged HTML viewer. You can navigate through
    the help files by clicking the links, as you would in any web browser.


    > > Tip Trick Up Your Sleeve — Because the KDE help and file browser is really
    just an HTML browser, you can use the KDE browser to view any of the other Linux
    HTML documentation. Type the URL of the file you want to view into the top of
    the browser window and press Enter.


    # # SUMMARY


    There are many resources available for Linux. Depending on your needs, you can
    approach your search for information several ways. The methods you should now
    be familiar with


    +   - **Linux manual pages**—Use the **man** command to display full information
    about a specific command. The **apropos**, **man -k**, **man -f**, and **whatis**
    commands can display summary information and search for a specific type of command.


    +   - **Built-in help**—Many programs have built-in help that can be displayed
    with a command-line argument, usually **--help** or **-h**.


    +   - **/usr/doc directory**—Documentation for many programs and tasks is located
    in the /usr/doc directory. HTML-formatted information is also available in this
    directory.


    +   - **Online resources**—The Linux home page and Documentation Project provide
    excellent starting points when wading through the mountains of online Linux information.
    The comp.os.linux newsgroups are also extremely useful for hard-to-find answers.


    +   - **KDE Help system**—KDE provides excellent built-in help for most of its
    applications. Simply select **Contents** from the Help menu that is located in
    each application.'
