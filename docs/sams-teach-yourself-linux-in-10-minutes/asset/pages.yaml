    else. These properties (permissions, owners, and groups) are discussed in depth
    in Lesson 19.

    - Shortly after the 10 characters of permission information is a small number—don''t
    worry much about this number, it is the number of hard links to a particular file.
    This is unimportant to everyone except the die-hard UNIX fans.

    - Each line contains root. This is the owner of the file or directory. In this
