  md: '# COMPRESSION AND ARCHIVING TOOLS


    # USING zip/unzip


    Based on the algorithm from the PC standard PKZip program, the zip and unzip programs
    work exactly as you would expect them to: zip <filename> to compress a file with
    zip, and unzip <filename.z> to unzip the files.


    Creating files using the zip format (which uses the suffix Z in Linux) for distribution
    to other Linux users is generally not a good idea, as zip and unzip are not available
    to Linux users. (These utilities are freeware—get your system administrator to
    install them if you need to access to them.) If your target, however, is Macintosh
    or Windows users, zip is a format that they should be able to read.


    Both the zip and unzip programs have a number of potentially useful options, a
    list of which can be displayed by issuing either command followed by the option
    -h.


    # USING gzip/gunzip


    The GNU gzip suite was created in response to the realization that Linux''s compress/uncompress
    programs were based on proprietary algorithms and that this might someday entail
    licensing fees. Again, the gzip/gunzip programs work essentially identically to
    the compress/uncompress/zcat suite. Files compressed in the gzip format use the
    suffix GZ, and are generally smaller than files compressed with compress. If you''d
    like, you can use these commands to work with Z (compress) files.


    > What''s this BZ File? There is a new compression format that has a slightly
    better compression ratio than gzip; these are identified by the BZ extension.
    The commands to work with these files are bzip2 and bunzip2. The syntax is nearly
    identical to gzip/gunzip, so you shouldn''t have any problem dealing with them.


    ![](img/a0e6136ea1c86032b26127d28a7bd962_108_0.png)'
