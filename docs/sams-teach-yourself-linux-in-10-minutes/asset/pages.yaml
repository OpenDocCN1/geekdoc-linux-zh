  md: '# EMAIL


    Of all the network tools you''ll make use of from your Linux account, email is
    likely to be the most frequently used. Email lets communicate with your friends
    and colleagues, exchange files, and contact people all over the planet. It is
    fitting in its position as most used tool, email also has the widest range of
    software available. Most versions of Linux come with at least two different programs
    for accessing email, and frequently have a handful of others that have been installed
    over time. The following are some of the more commonly used programs for accessing
    and working with email:


    +   - mail—Found on almost all Linux systems, mail is a command-line driven mail
    reading system. It''s a fairly simple program without many customization features,
    but it''s fast, and convenient to use if you don''t fancy mail filters or a menu-driven
    interface.


    +   - pine and elm—These are both full-screen mail reading programs with simple
    and intuitive menus and configuration options. The pine program is somewhat more
    powerful than elm, but both are good readers for users who want convenience in
    a text-based email reader.


    +   - mh—The Mail Handler. The mh suite of programs must be close to not the least
    intuitive mail-reading package available. It is also, by far, the most powerful.
    The mh philosophy is very similar to the Linux philosophy—break the job at hand
    down into the smallest building blocks, make each of these programs, and let the
    user put them together to make any custom configuration desired. Choose only mh
    as your mail reader after you''ve become comfortable doing a bit of shell script
    programming, because you''ll have to construct custom aliases and scripts before
    mh will show its true power.


    +   - procmail—The Mail Processor. The procmail program is designed to do sophisticated
    automatic processing of your email as it is. If you would like to add automatic
    processing of your email to your account, you might want to check whether procmail
    is available on your system.'
  merge: -1
