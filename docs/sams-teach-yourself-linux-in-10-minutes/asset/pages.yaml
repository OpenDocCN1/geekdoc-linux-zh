    # COUNTING LINES, WORDS, AND CHARACTERS: WC


    If you''d like to get quick statistics about a text file on your machine, but
    don''t want to load it into a word processor, you can use the wc command to provide
    information on the number of lines, words, and characters within a single file.


    To use wc, supply the name of a file you want analyzed, in the form wc <filename>.
    If you pass more than one filename to wc, all the files will be processed, and
    a grand total for everything will also be returned.


    For example


    ```

    >wc *.txt

