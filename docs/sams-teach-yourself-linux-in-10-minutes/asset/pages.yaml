  md: '# FINDING FILES CONTAIN A WORD OR PATTERN


    One of the most powerful built-in programs in Linux is grep. The grep command
    enables you to quickly search through the body of files for a particular word
    or pattern. It can search in three flavors: grep, egrep, and fgrep. The differences
    between these versions are based on the complexity of regular expressions they
    can handle.(Regular expressions define a pattern of text that can be used to search
    files when a specific word or phrase for search might not be known. You will learn
    more about regular expressions in Lesson 13, "Regular Expressions.") The fgrep
    command is the fastest of the three, but handles the least complex expressions.
    To be safe, you can always use plain grep, which should work the same in every
    case, on every system. So how do you use this wonderful tool? Give it the word
    or pattern to look for and the files it should search:


    +   - Choose the word or phrase you want to locate.


    +   - Find the filename to search. If it is in another directory, you must specify
    the entire pathname. You can also use wildcards to search multiple files, if you
    want.


    +   - Type grep <pattern to find> <file or files to search> at the command prompt.


    For example


    ```

    >grep "jray" *.txt

    8979-10.txt:<manager>=jray

    log.txt: Access by jray on 11/12/98

    kiwi.txt: jray loves to eat kiwi. But don''t think it would be

    ```


    This example searches for jray in any file that ends in .txt. It has turned up
    three files (8979-10.txt, log.txt, and kiwi.txt) that contain the string; each
    filename is followed by the text that contains jray. Two options you might want
    to consider adding to grep are -i to ignore case, and -n to display the line numbers
    of the match in each file. You might add these flags to the command line, immediately
    following the grep command.


    grep is an extremely valuable tool that will become even more valuable when you
    later learn about regular expressions. Remember to come back to this lesson to
    test some of the things you''ll learn in Lesson 13.'
  merge: -1
  pgno: 67
- img_proc: true
  md: '# USING THE KDE Find FEATURE


    For those of you who are running KDE, you''ll be glad to know that it has a built-in
    Find utility that offers many of the same features of the command-line versions
    of find and grep. KDE has provided a friendly face to these functions that would
    seem quite familiar to anyone who has run to run a search under Mac OS or Windows
    computers. The KDE Find utility is shown in Figure 5.1.


    ![](img/a0e6136ea1c86032b26127d28a7bd962_68_0.png)


    Figure 5.1 KDE provides a friendly interface to the UNIX Find and Grep utilities.


    To search in KDE


    +   1. Click the K toolbar icon to bring up the main KDE find.

    2. Choose Find Files.

    3. Select the appropriate search criteria from one of the three tabs.

    4. Click the small Magnifying Glass icon in the Find utility bar to locate the
    matching files.


    There are three different tabs in the Find File utility that conduct three different
    types of searches:


    +   - Name & Location—If you''re searching for a filename, this is the tab you
    need to use. You can type in a partial filename and supply a starting directory
    for the search. This is equivalent to the find -name command you used earlier.

    - Date Modified—Like the find -mtime option you''ve learned about, the Date Modified
    tab enables you to search your file system based on modification dates.'
  merge: -1
  pgno: 68
- img_proc: true
  md: '# 58 LESSON 5


    +   - Advanced—The advanced options let you locate files of a specific type or
    search the contents of files for a word or phrase.


    Of course you can continue to use the command-line utilities from KDE, but if
    you''re more comfortable with pointing and clicking, it''s nice to know you have
    that option.


    # SUMMARY


    Finding something on a Linux-based computer can be a bit difficult with the huge
    number of files and directories that are available to be searched. In this lesson,
    you learned several techniques for locating files based on their names and attributes.
    You learned how to search the contents of files for a particular word or phrase.


    +   - find—The find command can search the entire Linux file system for a particular
    file based on a variety of criteria. You learned how to use it to find files based
    on name, creation date, and size.

    - locate—Although useful, find isn''t always an efficient way to get to your files.
    The locate command searches a database of filenames and instantly returns everything
    that matches your search request.

    - whereas—If you''re looking for a program file, its source, or its pages, the
    whereas command might work for you. whereas searches a preset list of common file
    locations and quickly returns paths to anything it finds.

    - which—The which function is dependant on your PATH variable. It searches the
    paths that you have specified for a particular filename.

    - grep(grep/eg/grep)—The grep command is an extremely powerful method of searching
    the actual content of files for a particular word or pattern. The power of the
    grep command when coupled with regular expressions is incredible.

    - KDE Find utility—KDE provides an easy-to-use interface that encompasses many
    of the features of find and grep.'
  merge: -1
