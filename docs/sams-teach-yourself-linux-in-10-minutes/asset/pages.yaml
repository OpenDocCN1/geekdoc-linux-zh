    # STDERR


    To make your life easier, Linux actually has two different output streams

    of data that it defines for programs. The first, STDOUT, you already know

    about the second, STDERR, is used to allow the program to provide error

    messages to the user. If the user is redirecting STDOUT and the program

    can only put errors on STDOUT, the user might never see the errors

    because they will all go into the redirected file. Instead, programs can use

    STDERR for errors, and if the user has not redirected it, they can still see

    er messages and warnings while STDOUT is headed into another file

    or program.


    If you''d like to put STDERR into the same file in which you are storing

    STDOUT, use & instead of > in the command.


