    # pushd AND popd


    An even more powerful way of changing between directories is to make use of the
    directory stack.


    ![](img/a0e6136ea1c86032b26127d28a7bd962_56_0.png)


    > Stack In computer-speak, a stack is a type of data storage that works for data
    like a stack of dishes. With the dish stack, dishes can only be added to the pile
    or taken off the pile from the top, and the most recently added plate is the first
    to be removed. Data storage stacks work in exactly the same way. Data is pushed
    onto the stack, burying previous data, and popped off of the stack uncovering
    previous data.


    If you are currently in one directory and would like to change temporarily to
    another, there is an easy way to do it with two cd commands. By making use of
    the pushd command, you can place the current directory on the directory stack
    and change your current directory to the new directory. When you are ready to
    return to your previous directory, use popd to get your old directory back.


    If you would like to change from your current directory to another, and return
    automatically, make use of the pushd and popd commands as follows.'
