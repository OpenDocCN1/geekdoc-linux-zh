  md: '# DOCUMENTATION AND FINDING HELP


    Tips of All Sorts If you don''t want to use the full-blown help system, KDE''s
    ToolTips might help you. ToolTips are quick blips of information that are displayed
    when you pass your cursor over an icon or menu selection. Not all applications
    support ToolTips, but if you don''t know what something does, pass your cursor
