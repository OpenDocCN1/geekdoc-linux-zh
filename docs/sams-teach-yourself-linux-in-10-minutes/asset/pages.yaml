    - Next come details detailing the contents of the directory, one per item.

    - The 10 characters that look like random gibberish at the left of each line are
    actually the attribute information for the file. The first character of this tells
    you whether the line is for a directory—lines for which the first character is
    a for directories. Lines that start with a - are for normal files. Sharp observers
    will note that the lines for bin and var start with an 1. This indicates that
