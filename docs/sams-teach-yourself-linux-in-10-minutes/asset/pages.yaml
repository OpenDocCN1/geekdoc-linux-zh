    # SUMMARY


    In this lesson, you learned a set of commands with which you can manage and arrange
    your files in whatever fashion you desire.


    It is very important to remember that when you give a filename as an argument
    to a Linux command, the filename can be either a relative or absolute path to
    the file. If you give just the name of the file, you will be specifying in the
    current directory. If you give a path to the file (as in ../<filename>, or <directoryname>/<filename>)
    you will be specifying a relative path. Finally, you can always give the absolute
    path from the / directory to the file. Here''s a quick review of this lesson:


    +   touch—This command sets the modification date of the file to the current time.
    This has the effect of creating empty files if you need them for something.


    +   rm—The command removes files. The rm -i option until you are quite certain
    that you know what you are doing, and then keeping it for a while longer. Recursive
    rm running in Noninteractive mode can wipe out your entire'
