  md: 'Watch future examples carefully, as the pipe will appear in more useful contexts
    throughout the rest of this book.


    # SPLITTING A PIPE: THE tee COMMAND


    On occasion, you might have a reason to direct STDOUT to a file while continuing
    to send it down a pipe to another program. In this case, you can use the tee command.


    Consider the now-becoming-tedious example of collecting the tail of Web logs.
    If you aren''t satisfied with just emailing it to your friends as in the previous
    example, you can use the tee command to save it to a file at the same time. You
    could use


    ```

    tail -30 /var/log/httpd/access_log | tee kiwis-logs | mail friend@somewhere.com

    ```


    This helps you if you want to save the tail of the file in kiwis-logs and send
    it to annoy your friend.


    # SUMMARY


    In this lesson, you were introduced to the Linux model of process input and output,
    and to the easy way in which Linux allows the user to connect programs together
    to accomplish complex tasks.


    +   - Every program has a STDIN, a STDOUT, and a STDERR. Not all programs use
    them for user interaction (programs) such as Photoshop just don''t lend themselves
    to command-line control), but, for the vast majority that do, input and output
    connections can be manipulated.


    +   - You can provide the input data that a program expects on STDIN by hand,
    from a file, or from another program.


    +   - You can send the STDOUT and STDERR of a program into a file if you''d like
    to collect it for future use rather than view it as it is produced.


    +   - You can pipe the STDOUT of one program into the STDIN of another.


    +   - One immediately useful thing to do with pipes is to pipe the output of particularly
    verbose programs into a pager (more, or less).'
