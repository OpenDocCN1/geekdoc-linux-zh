  md: '# # LESSON 4

    THE FILE SYSTEM


    In this lesson you''ll learn the basics of the Linux file system and a few convenient
    tricks to make your life easier as you use Linux.


    To the novice, the Linux file system can appear to be a strange and uniting place—so
    many files, and you with just a command line to type at. Bear skin and stone knife
    time, right? Wrong. While the access to the Linux file system might initially
    appear cryptic and primitive, Linux provides extremely sophicated file access
    and control. This sophistication is born of many simple commands with which more
    complicated commands can be constructed.


    # ## FILE SYSTEM DESIGN


    Before even the simple commands will make sense, you need to understand a few
    things about the design of the Linux file system. This might not seem like a very
    important part of the user experience, but the Linux file system is a bit different
    than the personal computer file systems you might be familiar with—and you will
    probably find the biggest differences to be to your liking.


    Linux file systems have a single root directory. Unlike Macintosh file systems
    with their multiple drive icons on the desktop or Windows file systems with their
    ABCs, the Linux file system has a single top-level directory—the root directory.
    You should think of Linux files as being arranged in a tree shape, with the root
    directory as the trunk. The root directory can contain files and other directories,
    whereas the second-level directories can contain more files and more directories,
    and so on.'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# The Powers of Root Linux uses the word root to describe two different concepts.
    One is the root user, the person with absolute control over everything to do with
    the machine. The other is the root directory, one single specific directory on
    the machine that is considered to be the base of the file system.


    You don''t need to care what drives are. Where do drives appear, if not named
    by letter, or icons? They appear simply as directories located anywhere in the
    file system. Odd? Not at all. Linux completely removes the notion of the hardware
    and the physical location of the files from the concern of the user. This might
    take a while to get used to, but once you do, you''ll see that it makes no sense
    for a user to have worry about where a file physically resides. If you know its
    name and where to find it in the file system, whatever worrying about what de
    this other significant chunk of oxidized metal (that''s what makes up a hard drive,
    by the way) it lives on? If you think about it, you''ll see that this has other
    significant benefits. For example, if your system administrator discovers one
    day that he''s run out of disk space to install new software, he can transparently
    rearrange disks and files. He can move everything out of some overloaded directory
    onto a new disk, mount the new disk so that it appears in the same place as the
    old directory, and you will never know the difference.


    Mounting a drive The process of telling the file system that the drive exists
    and what directory it should appear at. At most Linux varieties, normal users
    can''t mount drives, but if you''re curious how it''s done or happen to be on
    a system that allows normal users to mount some drives, you should see your system
    administrator to find which drives you can and how to mount them.'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'You don’t need to care what your files live in. Another benefit of this abstraction
    is that your system administrator can cause files, directories, or drives that
    are physically located on distant machines to entirely as part of the file system
    on your machine. The only difference you might notice accessing files that are
    located remotely could be a slight slowdown due to the network. So what’s this?
    If your system is up properly, no matter where you are, what machine you sit in
    front of, whether you’re at your main office or halfway around the world, all
    your files appear in the same place, and all your software is where you always
    expect it to be.


    Even if you don’t care where your files are, you’re always somewhere. Linux bases
    most of its notion of the user environment on the user “being somewhere,” located
    and working in some particular directory. With the advent of new graphical desktop
    environment tools, this is becoming less of a universal concept, but it is a good
    idea to keep in mind when working with Linux.


    Linux commands and filenames are case-sensitive. For both the Windows and Macintosh
    us, this might come as a surprise: Linux is quite literal in its interpretation
    of what you type. MyFile doesn’t look identical to my folder, and not identical
    to Linux either. Always note the case of filenames or commands that you are trying
    to use.


    Files have three attributes. Linux has a very simple idea of file attributes—files
    can be readable or not readable, writable or not writable, and executable or not
    executable. Any combination of these is possible, though some combinations are
    not particularly sensible. Generally, programs should be readable and executable,
    and data files should be readable and writable. Linux, however, takes you to your
    word. If you tell it that a file is executable, it will allow you to run your
    Rolodex file, and if you tell it that a program is writable it will let you edit
    your word-processor as if it were a plain-text document rather than a program.


    Everything belongs to somebody. Every file and directory in the Linux file system
    carries around with it information detailing who owns it. The owner of a file
    can allow or disallow access to a file for other users, or other groups of users,
    and can control whether the file is executable, readable, or writable.'
  merge: -1
  pgno: 49
- img_proc: true
  md: 'Now you understand a bit about what your commands are going to be talking to,
    you can start learning what you need to know to get around.


    # NAVIGATING THE FILE SYSTEM


    The most basic commands for dealing with the Linux file system are the ones for
    moving between directories and finding out what files are in them. Before moving
    between them though, it''s a good idea to know where you are.


    # WHERE ARE YOU? `pwd"


    The `pwd` (present working directory) command asks your machine to tell you what
    directory you''re currently in. Any time you''re running a command line, it''s
    somewhere in the file system—type `pwd` and it tells you where.


    For example


    ```

    > pwd

    /priv/home/ray/public_html/

    ```


    ![](img/a0e6136ea1c86032b26127d28a7bd962_50_0.png)


    > Path Particulars `/priv/home/ray/public_html/` is a path. The simplest explanation
    of a path is the shortest set of directories through which you must travel from
    the root directory to get to the current file or directory. Each directory in
    the path is separated by a /


    # THE HOME DIRECTORY


    To each user, one particular directory is a special directory. This is your home
    directory. From the standpoint of navigating the file system this directory is
    identical to any other, but it is significant because when you log in, it is where
    you will initially be. You can expect that anything or below your home directory
    belongs only to you. To make your life easier, Linux doesn''t require you to remember
    the path to your home directory. Instead, it allows you to refer to your home
    directory as ~, and to anyone''s home directory as `<username>`.'
  merge: -1
  pgno: 50
- img_proc: true
  md: 'Now that you know where you are, the next thing you might want to

    know is what files are with you.


    # LISTING FILES


    Actually, Linux will let you list the files just anywhere (with the

    exception of places that you don''t have permission; more on permissions

    in Linux 19, “Permissions", but the easiest place to list files from is

    “here”—wherever currently happens to be.


    # 1s


    The 1s command lists files. Issued without arguments, 1s lists the files

    and subdirectories in the current directory (the same one pwd would tell

    you about).


    For example


    ```

    > pwd

    /priv/home/ray/public_html/

    > 1s

    cgi_bin          test.html

    images          vrml

    index.html

    ```


    This shows that your current directory path is /priv/home/ray/

    public_html, and that this directory contains five things. You can''t tell

    from this listing, but cgi_bin, images, and vrml are directories, where

    index.html and test.html are files.


    > Covering the Bases You didn''t really have to issue

    the pwd command to make use of the 1s command in

    that example. It''s been included for the sake of clarity.

    if you already know where you are in the file system,

    there''s no reason to ask the computer to repeat it

    for you.


    If you''d like to list the files in some directory other than the current direc-

    tory, for example the files in the root directory, you can issue the 1s com-\mand
    with a directory option.'
