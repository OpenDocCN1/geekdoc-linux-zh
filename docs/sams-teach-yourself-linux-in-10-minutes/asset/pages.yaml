  md: '# LESSON 10

    COMPRESSION AND ARCHIVING TOOLS


    In this lesson you will learn about the common Linux tools for compressing and
    archiving files. You will also learn about a few tools you can use to keep tabs
    on your disk usage.


    While conserving disk space has almost become a thing of the past, it is still
    occasionally necessary to compress your files, or bundle them up for archival
    purposes.


