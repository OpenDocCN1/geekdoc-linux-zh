  md: '# # LESSON 17

    PRINTING


    In this lesson you''ll learn how you can print requests (jobs) to a printer on
    your network.


    Setting up a printer varies from printer to printer and requires Super User (root)
    privileges, so is difficult to demonstrate this task in the book. Linux computers
    often speak to local servers that provide access to remote printers across a TCP/IP
    network. Luckily, local printers (directly-connected) and remote printers are
    accessed in the same fashion, so it is possible to show you how you can use a
    printer in a generic fashion that will apply no matter how your system administrator
    has configured your computer.


    # ## SENDING A PRINT JOB: 1pr


    In Linux, multiple people can print at a single time. Because of this, when you
    send a print request to a printer, it is assigned a job number. If you need to
    cancel your print job, this number will be used to remove the job from the print
    queue. Only the person who owns a print job can remove it from the queue, unless
    you happen to be the super user, or root.


    > PostScript versus Non-PostScript The assumption is made throughout this lesson
    that you will be printing to a PostScript printer. It is possible, however, that
    your system might be configured to interpret PostScript using a rasterizer and
    print to a non-PostScript printer.'
  merge: -1
  pgno: 165
- img_proc: true
  md: 'The line print command (lpr) is the primary method for sending data to the
    printer. lpr essentially dumps data directly to the printer you specify. To use
    lpr, follow these steps:


    +   - Determine the name of the printer you want to use. This was probably set
    by your system administrator.


    +   - Choose the file you want to print. For the moment, only choose a text file.
    I will discuss a few other formats shortly.


    +   - Send the print job using lpr -P<printer name> <filename> .... If there is
    only one printer configured on your computer, you can use lpr <filename> ...


    For example

    >lpr -PHOD samplefile.txt


    The result of this command is that the samplefile.txt is sent to the printer named
    HOD. (In you''re interested, HOD is my office printer, named the Heart of Darkness.)
    Depending on the load of the printer, the print job should be processed shortly.


    > Printing More than One Copy If you need to print multiple copies of a document,
    you don''t need to separate separate print jobs. Instead, you can specify the
    number of copies directly as an option to the lpr command. Follow lpr with -<number
    of copies> to print many copies of each file in the job.


    There are a few file formats and special print cases that might require special
    attention from the print command. This special attention comes in the form of
    filters that are applied to the file and convert the information into a format
    that your printer can handle.


    +   - PS—PostScript files. PostScript files should be handled automatically by
    the lpr command. You can print them as would print a plain text file.'
  merge: -1
  pgno: 166
- img_proc: true
  md: 'DVI—TeX files. Files from TeX contain special page layout instructions. You
    can use the -d option with lpr in order to print these files correctly.


    TR—Toff files. This is the standard file format for man pages. If you''d like
    to print out a page, you can use the -t option.


    Text files with really long lines—If you are having problems printing text files
    and having lines run off the end of the page, you can have the files reformatted
    on-the-fly so that they fit. To do this, use -p with lpr.


    # CHECKING THE STATUS OF A PRINT

    JOB: 1pq


    After you''ve sent a job to the printer, chances you''ll want to check if it is
    done printing—especially if it is a network printer located on another floor in
    your building...or in another building altogether! To check the status of a job,
    you''ll want to look at the queue for the printer that you submitted the job.
    You do this with the 1pq

    -p<printer name> command. Once again, if there is only a single printer on your
    system, you can issue 1pq by itself.


    For example


    ```

    >1pq -PHOD

    ```


    | Rank | Owner | Job | Files | Total Size |

    | 1st | agroves | 27 | test.txt | 19 bytes |

    | 2nd | jray | 28 | samplefile.txt | 10021 bytes |


    This example shows that there are currently two jobs in the printer queue for
    HOD. One is owned by agroves, and one is owned by jray. Each job is ranked, which
    shows the order in which it will print. The names of the files being printed are
    also shown, as well as the size and job ID number.'
  merge: -1
  pgno: 167
- img_proc: true
  md: '# CANCELING A PRINT JOB: lprm


    At times you might find that you sent a print request to the printer, but didn''t
    actually mean to—perhaps you sent a 3,000 page encyclopedia file instead of the
    three page report you intended. Whatever the case, the lprm command allows you
    remove items from the printer queue.


    If you need to use lprm, follow these steps:


    +   1. Use the lprm command to find the job ID number that you want to remove.

    2. Invoke lprm with the syntax lprm -P<printer name> <job ID>.


    For example, if I want to remove my job (job #28) from the queue in the preceding
    example, I would type


    ```

    >lprm -PHOD 28

    ```


    To verify the results, use lq to check the queue again:


    | Rank | Owner | Job | Files | Total Size |

    |---|---|---|---|---||

    | 1st | agroves | | 27 | test.txt | 19 bytes |


    My job is no longer in the queue, and will not be printed! Don''t worry if you
    happen to accidentally enter in someone''s print job ID; you can only cancel your
    own jobs.


    > Canceling Your Jobs If you would like to remove all the pending print jobs that
    you have sent, you can use the - character in place of the job ID. This cancels
    any-thing that you''ve sent to the printer.


    # PRETTY PRINTING: enscript


    If you''d like to do some fancy printing, you can use the encript-command to convert
    your text files into PostScript, and add some flashy'
  merge: -1
  pgno: 168
- img_proc: true
  md: 'features. For instance, if you''d like to print two pages of text on a single
    side of paper, encript can format your document correctly. It can also print banner
    information with each page to help you identify which file has been printed and
    which page number you are looking at. If your Linux distribution does not include
    encript, check with one of the hundreds of Linux software sites, and you''re sure
    to find a copy. An excellent starting point is http://www.linux.org.


    To use encript in its most basic form, do the following:


    +   - Choose your printer.

    - Choose the file that you want to print.

    - Run encript like this: `encript -d <printer name> <filename> <filename>` ...


    For example, use encript to print my samplefile.txt file, I would do this:


    ```

    >encript -d HOD samplefile.txt

    [ 1 pages * 1 copy ] sent to printer

    ```


    Unlike lpr, encript gives a bit of feedback on what is happening. Here it tells
    me that I''ve sent one page to the printer, and have requested the default number
    of copies: one. The output of this command, in its basic form, will be very similar
    to lpr. It simply dumps the file to the printer. The difference, however, is in
    command-line options that you can add to encript to change the appearance of your
    printout. Here are a few of the options you can use:


    +   - Page range—Use the option `<start page><end page>` to print a range of pages,
    rather than everything.

    - Pretty source code—If you''re a programmer, encript can print your source in
    an attractive format with highlights if you use the -E command-switch.

    - Fancy header—If you''d like to easily identify the file and page number that
    the text on a page belongs, you can ask encript to print a fancy header using
    -G.

    - Landscape mode—Rather than printing across the short dimension of your page,
    the -r option will rotate the page 90 degrees and print in Landscape mode.'
  merge: -1
  pgno: 169
- img_proc: true
  md: '+   - Multiple columns—To print two pages of text per printed page, use the
    -2 option. You''ll probably also want to use the -r Landscape mode switch so that
    everything fits appropriately.


    +   - Highlight bars—If you''re reading source code or spreadsheet-type data,
    you might find it difficult to follow a line across a page. Use the -H option
    to print light gray highlight bars across the page.


    +   - Multiple copies—Using a slightly different syntax than lpr, encrypt can
    print multiple copies of a job using the -n <number of copies> option.


    Be sure to check the man pages for more information on encrypt. There are many
    more options that you can use to further customize the appearance of your printouts.


    # SUMMARY


    In this lesson, you learned the commands you need to print from the command line.
    If you''re using an application in a KDE environment, it is actually using the
    same commands you''ve seen here to send information to the printer. The suite
    of lpr, lpq, and lprm commands make up the basis for printing from Linux and UNIX
    computers. encrypt is the icing on the cake. Let''s review the highlights for
    this lesson:


    +   - lpr—The command is used to send a file to the printer. If the file is of
    a type other than plain text, it can be processed by filter to correctly format
    the information for your printer.


    +   - lpq—When a print request is sent to the printer, either from lpr or encrypt,
    it is added to the print queue. The lpq function to display all pending print
    transactions, their corresponding IDs, and their owners.


    +   - lprm—If you''d like to remove a job from the print queue, lprm will do the
    trick. You can use lprm to remove a single print job or all the jobs that you
    have pending at the printer.


    +   - encrypt—encrypt is a useful utility for doing fancy printing on your printer.
    It allows multiple pages of text per page, pretty graphics headers, and a variety
    of other goodies.'
  merge: -1
  pgno: 170
- img_proc: true
  md: '# # LESSON 18


    # # ACCESSING

    NETWORK

    RESOURCES


    In this lesson you will learn about another strength of Linux—network connectivity.


    You''re now almost finished with your whirlwind tour of the Linux operating system,
    but nowhere near finished exploring and learning about the capabilities that Linux
    puts at your fingertips.


    Linux excels at networking; with the proper configuration, you can spread Linux
    machines around the globe, and at each computer you log in, your user environment,
    files, and programs will all appear, just as they would at home.


    With the same ease that your home environment can distribute itself to scattered
    machines to work for you, so you can distribute your workload to those same machines
    from your home machine. This lesson provides you with a survey of some of the
    programs that allow this distribution of workload.


    # telnet


    telnet is a simple terminal program. In its primary use, it allows you to open
    a login session on a remote machine. To use the telnet command, issue the command
    as telnet <remote machine>, where <remote machine> is either an IP address or
    a hostname. You should be prompted with a login and password prompt just as though
    you were sitting at the console of the remote machine.'
  merge: -1
  pgno: 171
- img_proc: true
  md: 'telnet Particulars It''s not unusual to run into situations where Backspace
    and Delete don''t work properly at telnet''s login and password prompt. Don''t
    be alarmed; this is simply an indication that the remote machine doesn''t yet
    know what sort of terminal you''re using. If the problem persists into the login
    session, see the section on stty in Lesson 16, "Modifying the User Environment."


    # # rlogin


    The rlogin command is very similar to the telnet command, except that it carries
    some user information along with the attempt to connect. If your account is good
    on several machines, they might be set up to allow you to connect between them
    without having to log in each one. Try the rlogin command as rlogin <remote machine>.
    If you''re lucky, you''ll end up in a shell on the remote machine. If you''re
    not, you''ll be presented with a login prompt; from there, rlogin functions identically
    to telnet.


    # # slog


    The slog command is a remote terminal program that offers strong encryption of
    the data stream. If your machines have the secure-shell server running, you are
    strongly encouraged to use this command. Both the rlogin and telnet commands send
    your login and password information, as well as anything else you type, over the
    network in plain text. A malicious user with a small amount of easily available
    cracker software can sniff your account. (Please don''t call them hackers. Hackers
    are quick and dirty, and often brilliant programmers—they don''t break into things;
    crackers do.)


    To find out the secure shell server is running, and to set up the login command
    (which needs quite a bit of configuration before you can use it) you are advised
    to contact your system administrator. He or she will be more than happy to tell
    you about the login command or any alternatives and to help you increase system
    security.'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# rn/trn


