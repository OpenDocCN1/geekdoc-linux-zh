  md: 'If you spend much time discussing Linux editors with long-time Linux users,
    you''ll find that there is a disagreement of warlike proportions between the users
    of the two most common editors—vi and emacs. While these editors are actually
    rather complementary in their functions and are both useful tools to have in your
    toolbox, chances are''ll end up running into many users who insist that one or
    the other is completely useless. If you listen to them, you''ll be depriving yourself
    of the better solution to at some tasks.


    Most Linux editors have immense power. emacs, for example, contains not only its
    own built-in programming language, but can also function as a complete windowing
    system for users who are stuck on text-only terminals. However, there is not enough
    room in this quick guide to cover more than the basics. After mastering the simple
    tasks presented here, the interested reader should make a trip to the library
    or bookstore and choose from among the several books available on each of the
    most popular Linux editors.


    # QUICK AND DIRTY EDITING: vi


    The vi is Linux''s most universal editor. Some users pronounce it ve-eye; others
    pronounce it vye. (There seems to be no consensus, but the people who call it
    vye are still wrong!) vi isn''t an easy editor, and it isn''t a friendly editor.
    What it is, however, is a quick-starting editor with very small memory footprint
    that you will find on every Linux machine you use. Because of its ubiquity, knowing
    the basics of vi allows you to work with your files even if no more-convenient
    editors are available.


    If you need to use vi, you should


    +   1. Determine what file you want to edit.


    +   2. Issue the vi command as vi <filename>. The vi editor can also be started
    with no filename if you prefer to start a new document but haven''t decided on
    a name.


    After you start vi, there are a number of things you need to know to make it useful.


    vi operates in one of two modes: Command mode and Insert mode. In'
