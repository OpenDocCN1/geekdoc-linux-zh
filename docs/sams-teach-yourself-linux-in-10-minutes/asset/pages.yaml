    to automatically save yourself some time!


    Another instance of using shell scripts, or shell scripting techniques, is with
    some commands that can be used to automate tasks directly in the shell, without
    having to be put in a file. You will look primarily at these, because they''re
    easier to learn and more immediately useful. As you get more comfortable with
    Linux you''ll naturally gravitate to the idea of just putting what you''re typing
    in a file, and another shell script programmer will be born.


    # SHELL SCRIPT FILES


    As mentioned earlier, shell scripts are small programs written in the same language
    that you use to talk to the shell. It only makes sense that you can do this with
    Linux—remember the Linux model of input and output? The shell really doesn''t
    care whether it is issuing commands to it, or if the commands are coming to it
    from some other source, such as a file.


    As a quick introduction to the sort of thing you can do with a shell script file,
    take the save-timesavesave-time example. If you wanted to write a shell script
    to do exactly this, you need to put together a few of the tools you''ve seen so
    far, and a few more that you haven''t yet. For your ed, here''s what to do:


    +   Determine the name of your Web server log; here, /var/log/http/access_log
    is assumed.


    +   Determine your username. (You''d better know this by now!) For the purposes
    of this example, you''re named Bob, and your email address is bob@very.important.com.


    +   Figure out how to send email to a bunch of people with one command. This sort
    of behavior is generally frowned upon unless it''s for good reason, so you''ll
    just yourself email here.


    +   Figure out how you read news. The trn command is used.'
