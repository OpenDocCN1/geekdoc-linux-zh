  md: '# LESSON 7


    # READING FILES


    This lesson introduces you to basic commands that you can use to read files located
    on your computer.


    Your Linux computer can be used for hundreds of applications, but no matter what
    the use, you''re going to need to know how to do one simple task: read files.
    Most Linux applications use text-based configuration files, come with text-based
    instruction files, and store text-based log files. Undoubtedly, you''re going
    to want to tap into this information. Other than loading up a text editor or word
    processor, how can you do this? This lesson answers question by showing you what''s
    inside all those files on your computer.


    # VIEWING FILES ALL AT ONCE:

    CATENATE


    The simplest way to look at files is use cat, the concatenate command. It is called
    concatenate because it adds to the output stream whatever is in the files it is
    given. You''ll learn more about the output stream in Lesson 12, "Input and Output."
    For now, understand that this is what will be displayed onscreen. cat allows you
    to quickly read your files. It displays the contents of all the filenames it is
    given, immediately after another. You can use cat along with a redirection operator
    (you''ll learn about those in Lesson 12) to create one file that holds the contents
    of several other files. For now, you''ll use cat to display a file.


    To display a file, supply cat with the file, or files you want to show as arguments
    to the command.


    For example, assume I have two files, one named kiwi.txt that contains the text
    "Kwis are small, brown, and fuzzy", and another file called food.txt that holds
    the text "They are good to eat." Let''s see what happens when I cat them.'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# >cat kiwi.txt food.txt


    Kiwis are small, brown, and fuzzy.

    They are good to eat.


    The contents of the two files are displayed onscreen, one after the other.

    Pretty easy, huh? The biggest problem you''ll have with cat is that files

    will scroll the screen if they are too large, but you''re about to learn a

    way around that.


    > Linux Shortcut If you want to display all the files

    ending in TXT in the directory, you can use wildcards

    with any of the commands discussed in this lesson.

    The command cat *.txt shows everything in the cur-

    rent directory that ends with TXT.


    # VIEWING A PAGE AT A TIME: more AND less


    The cat command is fine when you want to quickly show some informa-

    t—but what about large files that scroll past a bit too quickly to read?

    Luckily, there are some utilities specifically created for reading files from

    the command line: less and more. These are often referred to by the

    generic term pagers, because they display files to your window or screen

    age at a time.


    # USING more


    Like cat, use more all you need to do is type the command followed by

    the file or files you want to display.


    Example


    ```

    >more longfile.txt

    ```


    This displays the file longfile.txt. Showing the output of the

    command would be a waste of space, because the results are simply the

    contents of the file, shown one page at a time. Instead, there are some com-

    mands you can use from within more to control the process.'
  merge: -1
  pgno: 83
- img_proc: true
  md: '+   * Spacebar—Advances the output to the next page.


    +   * q—Quits the more program, exiting to the command line.


    +   * s—Skips forward one line in the file. Use this to slowly advance through
    the file.


    +   * f—Skips an entire page in the file.


    +   * /*pattern>—Searches and jumps to a pattern or word in the file.


    +   * b—Scrolls back one page in the file.


    +   * ? or h—Displays help for the more command. Because you can use this while
    viewing a file, it’s probably the most important one to remember.


    more should be available on any Linux or UNIX computer that you to use. If you’re
    lucky, your system might include (and modern Linux distributions) do less. Believe
    it or not, less is more than.


    # Using less


    less is a more modern pager than more, one of its main features is the capability
    to move around within files with less difficulty than more. Again, invoking less
    is identical to using cat and more; supply the files you want to view as arguments
    to the command.


    For example


    ```

    >less configFile.txt

    ```


    As with more, less will display dumpfile.txt a page at a time. Controlling less’s
    output is similar to more. There are several commands that allow you to move around
    within less.


    +   * Spacebar—Advances the output to the next page.


    +   * b—Backs up one page.


    +   * q—Quits out of the less program, exiting to the command line.


    +   * Up arrow—Scrolls up one line.'
