  md: 'The find command you see here has located two core files in my home directory
    that are 1024K or more in size. If there were other large files, they would have
    been listed as well, but in this case, only core files were found.


    There are many other command-line switches that can by used with find besides
    -name, -ctime, and -size. Be sure to check out the find man pages if you are interested
    in learning more.


    # QUICKLY LOCATING A FILE OR DIRECTORY BY NAME


    Find is a useful for finding files based on a wide range of criteria. It can,
    however, be a bit slow when you are searching the entire file system for a particular
    filename. In order to speed the process up, take a look at three simple utilities
    that can quickly list matching filenames on your system.


    # locate


    The locate command is very simple. Just choose the name of the file you want to
    search for, and supply it on the command line as an argument to locate.


    For example


    ```

    >locate sound

    /etc/sysconfig/soundcard

    /home/http/icons/sound1.gif

    /home/http/icons/sound2.gif

    /home/jray/mysql/mysql-3.21/33/msys/mf_soundex.c

    /home/jray/mysql/mysql-3.21/33/msys/mf_soundex.o

    /home/jray/postgresql/pgsql/contrib/soundex

    /home/jray/postgresql/pgsql/contrib/soundex/Makefile

    ...

    ```


    You''ll notice that the locate command runs almost instantly and returns several
    hundred filenames and directories containing the word sound. The difference in
    speed is because it does not directly search the file system. Instead it searches
    a database that is built by updatedb command. The only drawback to this approach
    is that the database containing the'
