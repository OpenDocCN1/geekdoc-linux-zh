    > Limitations to mv The mv command can also be used to move and rename directories
    with exactly the same syntax using it to move and rename files—just give it directory
    names instead of filenames.

    Unfortunately, for this task, it is a little more limited than you might like
    it to be. It cannot move directories between physical devices, so every now and
    then if you try to move a directory from one location to another, Linux''s abstraction
    of physical devices in the file system will sneak up to bite you, and you will
    get an error message such as this:

    Can''t move directories across partitions

