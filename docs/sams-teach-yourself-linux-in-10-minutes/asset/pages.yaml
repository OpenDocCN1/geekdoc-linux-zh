    The Bourne shell, is, probably the best shell to write scripts in if you’re concerned
    about distributing large sophisticated scripts to unknown users. It’s not the
    easiest shell to use at the command line though, so you’re better starting with
    the same shell you use in day-to-day life.


    # DOING IT AGAIN AND AGAIN: foreach


    Instead of spending time looking at collecting commands into a file to automate
    them, you can get a lot of mileage out of simple automation techniques that don’t
    involve putting commands in files at all. One of the commands used for this is
    the foreach command.


    # EXECUTING A COMMAND OVER AND OVER


    If you find yourself in a situation where you need to repeatedly execute some
    action for each set of files, the foreach command can help. It takes a list of
    files and does something for each of them. The use is much easier to demonstrate
    to explain. If you have a list of files you need to do something to, you can do
    the following to use foreach:'
  merge: -1
