    # USES FOR REGULAR EXPRESSIONS


    What you''ve just learned is only a very tiny subset of the regular expres-

    sions you can generate. Regular expressions can be used in a wide

    variety of different applications. For example, see, the stream editor,

    replace patterns of text from a stream of text on-the-fly. Being able to do a

    global regular expression search and replace on a thousand files rather

    editing each one individually is wonderful. When you are using the

    shell you can also use a subset of the complete regular expression library

    to specify filenames for operations.


    For example, if you have a group of files named test1, test2, test3, test4

    test5, and you''d like to copy files 3 through 5 to a new directory, you

    could use a regular expression like this:


    ```

    >cp test[3-5] newdirectory

    ```


    You''ll need to consult the man pages for the shell you are running in

    order to determine the regular expressions that it supports. The same goes

    to everything else that uses regular expressions. Unfortunately, even

    tough regular expressions themselves are pretty standard, the extent to

    which an individual application supports them is entirely up to appli-

    cation. Perl, for example, is an application (and, in turn, is a complete

    programming environment) that makes extensive use of regular expres-

    s.


    With the growing popularity of the World Wide Web comes the need to

    user-supplied information quickly and reliably. Unfortunately,

    there is little control over what sort of information a user might submit on

    a form or other interactive Web document. If you intend to do Web pro-

    gming, you will find that regular expressions are a lifesaver and

    be used to extract data from a form and turn it into a usable format. If this

    sounds interesting to you, I strongly suggest looking into the Perl pro-

    gming language.'
