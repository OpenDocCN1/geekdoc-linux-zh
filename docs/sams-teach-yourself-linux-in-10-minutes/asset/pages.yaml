  md: '# SUMMARY


    Regular expressions are an extremely flexible way of describing a pattern to be
    matched. Because many Linux applications, including the shell, support regular
    expressions, it is important to develop a general understanding of how they work
    and what they are good for. Let''s review:


    +   * .This matches any character. Use it whenever you aren''t sure what character
    will fall in a specific position.


    +   *Using the * will match any number of occurrences of a specific pattern. You
    can use this in conjunction with . or ranges.


    +   * \Special characters need to be escaped using the \ character. If you need
    to use the quote character (*) in a pattern, for example, you''ll have to escape
    it.


