  md: '# SUMMARY


    When you need to conserve disk space or shorten file transmission times, you might
    need to resort to compacting your files with some sort of compression utility.
    This lesson gave you a good idea of how to use the Linux compression software.
    Review what you''ve learned:


    +   - The three common compression utilities on Linux systems are the omnipresent
    compress, the newer and smarter gzip, and the cross-platform zip programs. A relatively
    new addition to the Linux/UNIX scene is bzip2, which appears to produce better
    compression than compress or gzip.


    +   - When you need to provide a collection of files to other users or archive
    a set of files for future use, you can use tar to create tar files that contain
    all your files in one convenient package.


    +   - Don’t be an impolite user and use tar to archive individual files. Instead,
    put all the files you want to archive in a directory and tar the directory.


    +   - If you need to send a file to someone via email, you can create an emailable
    encoding of the file by using the uuencode command.


    +   - Don’t be alarmed if you uudecode a file and can’t immediately find it; the
