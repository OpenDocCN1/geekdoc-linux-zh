    +   3. You will now be in your new directory and can work here for as long as
    you like. Your previous directory is waiting for you on the stack.


    +   4. When you are finished and want to return to your previous directory, issue
    the popd command as popd.


    For example


    ```

    > pwd

    /usr/local

    > pushd /var/log

    /var/log /usr/local

    > pwd

