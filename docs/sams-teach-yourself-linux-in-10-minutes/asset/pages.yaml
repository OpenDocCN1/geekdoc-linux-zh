  md: '# CONFIGURING X WINDOWS


    Most configuration of X Windows is handled by a server resource database. When
    a client makes a request of the server, the server checks this database to determine
    user preferences for that client. The server resource database is loaded on a
    per-user basis via the xrdb command, which should be executed automatically after
    starting X11. xrdb loads configuration information from a dot file, usually named
    .Xdefaults. .Xdefaults discussed in Lesson 16, “Modifying the User Environment.”)
    .Xdefaults usually contain lines similar to the following:


    ```

    xbiff*onceOnly:                 on

    xbiff*wm_option.autoRaise:    off

    xbiff*mailBox:                  /usr/spool/mail/mymail

    ```


    If you included these lines in your .Xdefaults you would be telling your X server
    that if xbiff (an X11 program that notifies you when you have new mail) starts,
    it needs to set certain options.


    +   **Line 1**—Sets an xbiff specific option regarding the frequency of ringing
    the bell to notify you.

    **Line 2**—Sets an option regarding the window manager’s treatment of xbiff. It
    specifically tells the system not to run xbiff to the front if it’s behind other
    windows when it needs to notify you. (Remember, X11 provides the display and a
    separate program provides management of things such as window controls.)

    **Line 3**—Tells xbiff where to find the mailbox that it’s supposed to look at.


    Because each client support different options and allows the window manager different
    levels of control, you’ll need to consult each client’s documentation to learn
    what you can configure and what you need to do configure it.


    In addition the server resources database, clients frequently have command-line
    options that can control the client’s interaction with X11. Start an xterm with
    the following command:


    ```

    > xterm -fg "black" -bg "white" -fn 6x10 -geometry 85x30+

    525+1

    ```'
  merge: -1
