  md: '# LESSON 16


    # MODIFYING THE USER ENVIRONMENT


    In this lesson, you''ll learn about the tools you need to modify your environment
    and the way that some commands work for you.


    There are a vast number of programs that all work together to create the Linux
    user experience; it''s because of that you''ll need to learn to use the tools
    from this lesson in conjunction with the documentation for your programs to make
    the modifications you desire.


    > Shell Assumption This lesson is going to assume that you''re using bash as your
    shell. If you are using a different shell, some of the syntax will need to be
    changed, but the ideas remain the same.


    # ALIASES


    One of the most useful features that shells provide to the user is the ability
    to create command aliases. Aliases are, quite simple, aliases. If for example,
    you''re a long-time DOS user, you might find yourself typing del instead of rm
    to delete files. Want to change this? Set an alias with the alias command. The
    syntax is alias <name> <command to run>. If you''d actually like to make that
    alias for del, you would type alias rm. After setting this alias, any time you
    type del, it will execute the rm command.


    More useful than simply renaming commands, you can use the alias command to create
    meta commands that enforce certain options. For'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# LESSON 16


    example, it''s always a good idea to force rm to be in Interactive mode (rm -i).
    To do this with an alias, you can type alias rm ''rm -i'' (note the direction
    of the single quotes). Now whenever you type rm, it will actually execute rm -i
    instead.


    If you''d like to get really sophisticated with aliases, you can even build little
    multi-command scripts inside aliases. For example, consider the situation where
    you want to access two different news servers from your account. In this case,
    perhaps it''s a public server for regular Usenet newsgroups, and a corporate server
    for internal news. The trn rn commands only understand one news server at a time,
    and worse, save the "what I have" information in a file with a fixed name. What
    to do? Use the alias command to automate things for you. The following two aliases
    will solve your problem.


    +   - alias readcorporate export NNTPSERVER=

    server.big.company.com;


    ```

    cp -/.corp-newsrc -/.newsrc;

    trn;

    cp -/.newsrc -/.corp-newsrc

    ```


    +   - alias readpublic export NNTPSERVER=

    public.newsstand.com;


    ```

    cp -/.public-newsrc -/.newsrc;\ntrn;

    cp -/.newsrc -/.public-newsrc

    ```


    What do they do?


    +   - The first line of each sets an environment variable which tells trn where
    to look to get its news. More on this in the next section.

    - The second line of each copies a setting file to the file .newsrc in your home
    directory. The trn command uses the file .newsrc to keep track of what you''ve
    read and what is new news. If you''re using two servers with two different sets
    of newsgroups, you unfortunately can''t use the same .newsrc file, so you''ll
    need to keep two of them around and let the alias copy the correct one for when
    you need it.

    - The third line should should be self-explanatory. The trn command reads Usenet
    newsgroups. A little more on this in Lesson 18, "Accessing Network Resources."'
  merge: -1
  pgno: 157
- img_proc: true
  md: '+   • The fourth line might be a bit of a mystery at first, but it''s really
    quite simple as well. Because the trn command will update the .newsrc file with
    information on what you''ve just read, you want to preserve the file for the next
    time you read news, you copy it back to its holding location.


    All you you have to do is to read your news from your corporate news server server.big.company.com.
    And to read your public Usenet newsgroups you type readpublic.


    # ENVIRONMENT VARIABLES


    As mentioned earlier in this book, most of the software you use, and the interface
    you work in when using Linux, is configured with seemingly cryptic text files.
    Other pieces of software are configured by special shell variables called environment
    variables. (You should remember shell variables from Lesson 14, "Basic Shell Scripting.")


    Environment variables are used by programs to pick specific pieces of information
    that are needed to run. For example, you might run across programs that want an
    environment variable that contains the path to their Help file information. Others
    use environment variables to contain custom settings for things such as window
    size or placement preferences. In the preceding aliases section, you might have
    noticed a program that wanted an environment variable to tell it what Internet
    host to contact.


    Environment variables aren''t set using the same syntax as regular shell variables,
    so instead of using set <variablename>=<value>, you would use the syntax export
    <variablename>=<value>.


    Consider the situation where a program that has to set the environment variable
    HELPFILE_LOC to the directory containing its help information. Unless this variable
    is set, it cant find the information it needs, and it won''t work properly. If
    you''ve found that the Help file is located in the directory /usr/local/helpstuff,
    you can set the variable need by using this command: export HELPFILE_LOC=/usr/local/helpstuff.


    The number of programs that use environment variables for configuration information
    is quite large, but the format is always the same. All you need'
  merge: -1
  pgno: 158
- img_proc: true
  md: 'do is find out what variable needs to be set, and then set it to the correct
    value.


    > Seeing Shell Variables If you''d like to see the environment variables that
    are already set in your shell, you can use the export command with no arguments.


    If you''re running X Windows and trying to display on a different machine than
    you''re running `export DISPLAY=<machename>:0.0`.


    If you''ve run a program and it exits with a complaint like `ld.so: not found,
    you might have to set the `LD_LIBRARY_PATH` with a command such as `export LD_LIBRARY_PATH=/usr/local/lib.`.


    The possibilities are really endless—thankfully, making the settings a relatively
    painless process. Just remember that the settings you make in one shell do not
    affect other shells. You can have the same environment variable set to different
    values in different shells you''re running simultaneously if you need to access
    more than one configuration at a time.


    # Paths


    Another special shell variable is the PATH variable. It tells the shell where
    to look for programs to execute for you. Remember how long the find command took
    to find things in Lesson 5, “Finding Files”? You wouldn''t want it to take that
    long every time you try to execute a program, so you don''t want the system to
    search for everything on your machine to find a program. Instead, the shell keeps
    a short list of where to look for programs, and it searches these locations.


    You might notice that if you have a copy of a program in your current directory,
    in some cases the filename will result in a command not found error. This is because
    it''s common for the PATH variable to lack the current directory. You can either
    execute programs in the current directory by typing `./<programname>`, or by adding
    the current directory to your path.'
  merge: -1
  pgno: 159
- img_proc: true
  md: '# MODIFYING THE USER ENVIRONMENT


    Working with Paths The current directory is usually left out of the path including
    it is a bit of a security risk. If the current directory is in your path, you
    can potentially be fooled into executing arbitrary programs by naming them as
    common Linux commands and sneaking them into your directories. If you want to
    put the current directory in your path, always put it at the end of the path.
    That way normal Linux will be found before any Trojan horses that may have made
    their way into your system.


    If you''d like to see what your current path is, you can do so by using echo PATH.
    If it''s missing some paths you need, say the current directory and /usr/local/bin,
    you can add these by using the command export PATH=$PATH:./usr/local/bin.


    # USERS DEFAULTS: THE DOT FILES


    Your account configures certain features for you automatically log in and when
    you start shells. Programs other than the shell also use dot files to hold configuration
    information. Dot files are, literally, files with names starting with the . character,
    and you''re likely to find an abundance already populating your home directory.
    Some files are


    +   - .login and logout—As you might guess, files which are executed when you
    log in and when you log out, respectively. If you look in these files you will
    find that they are shell scripts which use commands you are already familiar with.
    The login shell script is typically used for things such as swapping sets of configuration
    files if you want to set multiple environments for yourself, and for doing other
    things that need to be handled automatically at login. The logout script is used
    much less frequently, but it can contain useful things you need to do at logout.
    What of sort use you make of'
  merge: -1
  pgno: 160
- img_proc: true
  md: '# LESSON 16


    the .login .logout files? How about adding commands that echo the date and time
    information into a file whenever you log in and out. If you''ve ever had to fill
    out a timesheet, you''ll find this one appealing.


    +   - .bashrc_bash_profile—Shell scripts that are executed when you open bash.
    (Other shells will have their own scripts that execute at startup as well. Check
    with your shell''s documentation on this.). Again, you should be familiar with
    the syntax. In this file, you can put in commands that do things such as add custom
