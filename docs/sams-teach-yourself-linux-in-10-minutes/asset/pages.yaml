    anecdotes. Put things in your plan that you would want people to see when they
    try to look you up from remote.


    +   - Xdefaults—This file contains settings that are used by the server resource
    database. The syntax of this file is covered briefly in Lesson 3, “The Graphical
    User Interface.” In general you won''t need to modify this file, but you can configure
    many options regarding how the X server treats various programs and how X11 programs
    work here. If you choose to poke around in it, be sure to make a backup copy of
    it first, in case you have to put it back. After you have made a backup tough,
    don''t be afraid to make modifications. The syntax is straightforward, and if
    you''ve survived this far, you can probably figure out how to make most of the
