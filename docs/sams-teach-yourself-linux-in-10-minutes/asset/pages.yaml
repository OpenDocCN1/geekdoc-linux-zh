  md: '![](img/a0e6136ea1c86032b26127d28a7bd962_15_0.png)


    # # LESSON 1

    GETTING STARTED


    In this lesson, you''ll learn how to log in and out of your computer, the basics
    behind operating your Linux machine, and some background information on Linux
    functions.


    # ## A LITTLE BACKGROUND


    Over the years, the UNIX operating system has gained the reputation of intimidating
    and scary away many people. It has traditionally lived on fairly expensive machines
    in corporations and large organizations.


    Linux has to change that landscape! It is an operating system that was born out
    of a computer science student''s quest for something that looked and acted like
    the UNIX operating system but was personal computer-friendly. Linux allows personal
    computers to work alongside expensive UNIX systems because it is essentially a
    re-implementation of the UNIX operating system from scratch.


    A growing interest in Linux has spurred the development of utilities to make the
    user''s life easier, and has aided in the push of Linux and other UNIX systems
    from the server room onto the desktop.


    # ## THE LOGIN PROCESS


    The first thing you''ll notice when you sit down in front of your Linux computer
    is that you need to log in before you use it. Linux is a multi-user operating
    system, which means that multiple users can have their own accounts, programs,
    and settings stored separately on the same machine. If you''re used to Windows
    95/98/NT, this might sound similar to the concept of different users under Windows,
    and in some ways, it is. Windows 95/98 do not protect the user''s files from other
    people; they hide the files. Furthermore, Windows 95/98 do not allow multiple
    users to run programs simultaneously; Linux does.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# OWNERSHIP AND PERMISSIONS


    Linux has the concept of ownership and permissions. Files are owned by individual
    users, and permissions control who may view, edit, or run files on the system.
    Frankly, there is little need for a casual user to worry about ownership. If there
    is a need to share files with other users on the system, you''ll want to take
    a look at Lesson 19, “Permissions.” After you''ve logged in to your computer,
    all files that are created during that session will automatically be owned by
    your account.


    # MULTI-USER


    Besides controlling and tracking who owns what, Linux also allows multi-users
    to access the system simultaneously. This is a drastic change from the desktop
    environment offered by traditional desktop operating systems. While you''re working
    on a spreadsheet, a coworker might be running a series of calculations for an
    engineering project. Many different processes can be run on a single computer
    by potentially hundreds of different users. Lesson 11, “Processes,” explains the
    concept of processes and how to manage them.


    # THE LOGIN PROMPT


    In order to log in to your computer, you need to supply a username and a password.
    You should have received these from your administrator, or you can choose one
    during the Linux software installation. After entering your information, Linux
    loads the appropriate configuration for your account and you are ready to start
    using the system. You''ll find the screen that is displayed when you enter your
    username and password varies from system, depending on the configuration. There
    are two categories that you might encounter: a graphical login screen or a text-based
    screen.


    > Watching Your P''s and Q''s Linux is case-sensitive. Usernames, passwords, and
    directory names are all affected. For example, if you choose a password HAPPY1,
    it is not the same as happy1, or even HAPPY1. If you know you''re typing your
    password correctly, but you still can''t log in, check your Caps Lock button!'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# TEXT-BASED LOGIN


    The text-based screen varies based on the Linux distribution you are using. The
    Caldera OpenLinux prompt, for example, looks like this:


    ```

    Caldera OpenLinux(TM)

    Version 1.3

    Copyright 1996-1998 Caldera Systems, Inc.

    ```


    login:

    password:


    At the login prompt, type your username and press Return or Enter. The password
    prompt appears immediately afterward. When typing your password, the data won''t
    show onscreen in order to protect your account from prying eyes. If you successfully
    type both your username and password, you will reach a shell prompt and can begin
    issuing commands to the system. Don''t worry if you don''t know what to do next,
    you''ll learn how to do something productive shortly!


    > Oops! Don''t worry if you make a mistake logging in. The system will log the
    failed attempt to a security file. In the default configuration, Linux gives you
    another chance to log in. There''s no need to panic if you don''t get it right
    the first time; everyone makes mistakes.


    # GRAPHICAL LOGIN


    Instead of a text prompt, your machine might be configured with something a bit
    snazzier—a graphical screen where you can type your login information. This works
    exactly the same as the text-based system, but immediately launches you into the
    X Window environment. If you work exclusively in X Windows, you might want to
    ask your administrator to install KDM or XDM, which provide graphical login services.


    # THE LOGOUT PROCESS


    Now that you know how to log in to your system, let''s take a brief look at how
    to log out and why it''s important. You already know that your'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'computer can have multiple people using simultaneously and that it can have
    files owned by many different people. The login process identifies you to the
    system, and lets you control the computer using your username; the logout process
    reverses this. It closes any files that you might have open and shuts down any
    programs that you might have left running. If you remain logged in constantly,
    you could be exposing the system to security risks, or the processes you have
    left running slow down the computer for other users. It''s always best to log
    out of your computer when you''re finished using it.


    An important word of caution: You should never turn your computer off without
    running through the correct shutdown procedure. Pressing Control+Alt+Del makes
    your machine run through an appropriate shutdown. It''s best to do this from a
    login prompt so you don''t lose any files you''re working on. Lesson 20, “Privileged
    Commands,” demonstrates other methods of shutting down your system.


    # LOGGING OUT FROM A TEXT-BASED SESSION


    If you are not running a graphical session (there are no windows on your screen),
    the only command you need to log out is, not surprisingly, logout.


    In order to log out from a command prompt, type


    ```

    >logout

    ```


    The system will immediately return to the login prompt. That''s it. You''ve successfully
    logged out of the computer.


    # LOGGING OUT FROM A KDE SESSION


    If you logged in to the system through the KDE (K Desktop Environment) graphical
    interface, you can point and click your way out of the system as well. You''ll
    learn more about the KDE system in Lesson 3, “The Graphical User Interface.” To
    log out


    +   1. Click the K symbol to bring up the main KDE menu.

    2. Select Logout from the menu

    3. You will be prompted that KDE is ready to close your session. Click the Logout
    button to complete the process.'
  merge: -1
