  md: 'yield thousands of sites offering information on the subject. Here are a few
    Web sites and newsgroups that you might want to use as starting points for your
    search.


    # THE LINUX HOME PAGE


    The Linux home page is an excellent starting point for anything related to the
    operating system. Links are provided to vendors, applications, events, and other
    Linux goodies. Check out their home page at http://www.linux.org/


    # THE LINUX DOCUMENTATION PROJECT


    The Linux Documentation Project is a continuously updated collection of information
    related to Linux. The LDP contains FAQs (frequently asked questions), HOWTOs,
    and other documentation related to the installation and maintenance of Linux-based
    systems. You might have a copy of the LDP already installed on your system in
    the /usr/doc/LDP directory. To view the most current information, however, you
    should check the online LDP reference, which is located at http://sunsite.unc.edu/LDP/


    # NEWSGROUPS


    Newsgroups provide a less structured approach to finding information, but you''ll
    be surprised by the amount of support you can get from complete strangers. Whatever
    your need, there is a Linux newsgroup that will provide answers. To get started,
    take a look at


    +   * comp.os.linux.answers

    * comp.os.linux.setup

    * comp.os.linux.misc


    # THE KDE HELP SYSTEM


    If you are using KDE for most of your day-to-day work, you''ll be glad to know
    that KDE has its own built-in HTML help system that is extremely well-integrated
    into the KDE environment.'
