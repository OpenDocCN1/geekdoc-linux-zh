  md: '# # LESSON 12

    # INPUT AND Output


    In this lesson you will learn how to manage Linux process input and inter-process
    communication.


    Now that you have learned a bit about working with Linux, its file system, and
    managing Linux processes, it''s time to start putting things together and exploring
    some of the true power of Linux. In this lesson, you''ll also learn about one
    of the fundamental tools that makes Linux useful as it is—inter-process communication
    by input and output redirection.


    At the heart of what makes Linux and UNIX is so much more powerful than average
    desktop operating systems is the simple but effective way in which it abstracts
    process input and output. To paraphrase the model on which Linux bases input and
    output, you can imagine that the operating system thinks of user input to a program
    as a stream of information. Output from the program back to the user can be thought
    of in the same fashion. And if the input to the program from the user is a stream
    of information, why should the operating system care whether a user, a file, or
    even another program is providing this stream? Once you understand the model of
    input and output as simply being streams of data, you can immediately see that
    from the operating system''s point of view, the endpoints of these streams are
    immaterial. So long as the source of the input stream provides the information
    that the program needs, it does not matter where it comes from. Likewise, provided
    that the destination of the output stream “behaves like a user,” the operating
    system has no reason to care where the output stream is actually going.


    How does Linux make this model available to the user? By providing the concept
    of input and output redirection.'
  merge: -1
  pgno: 127
- img_proc: true
  md: '# REDIRECTION


    To accommodate the user in its streams-of-information-based view of the world,
    Linux defines certain concepts to which programs must adhere. Specifically, Linux
    defines several information connections for every program, and allows the user
    to manipulate the source and destination of these connections.


    # STDIN


    The input connection for a program is called STDIN (standard input). A program
    can expect the incoming data stream from the user (or whatever) will appear at
    STDIN.


    When you interact with a command-line-based program, the program is reading the
    data you are entering from STDIN. If you prefer not to enter the data by hand,
    you can put it in a file and redirect the file into the program''s STDIN.


    A program that you can use for an example is spell. The spell command finds misspellings.
    Given input on its STDIN, spell parses through it, checks the input against a
    dictionary, and returns any misspellings it finds. Issued from the command line,
    you can type


    +   > spell


    ```

    Now is the tyem for all good kiwis to

    come to this ayde of some very good Linux users

    <Ctrl+d>

    ```


    The Ctrl+d finishes the input, and spell gets to work, returning the following:


    +   tyem

    thie

    ayde


    As you might expect, each of the misspelled words is returned. At first glance,
    this might not appear to be a particularly useful program; however, the spell
    program doesn''t care whether it was typing the input to it, or whether the input
    came from a file.'
  merge: -1
