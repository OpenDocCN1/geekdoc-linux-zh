  md: '# 92 LESSON 9


    Now is the time for all good and bad kiwis to come to the aid of puppies and children.


    Rather than redistribute the new file updatedfile.txt to everyone, I can make
    a patch that contains all the changes between the original and the new file. To
    do this, I use the diff command with the following syntax:

    diff <template file> <updated file> > <patch file>. The patch file can have any
    filename you''d like.


    > Redirecting Output The standalone > in this example is used to redirect output
    to a specific file, which you name. You''ll learn more about this in Lesson 12,
    "Input and Output."


    For example


    ```

    >diff templatefile.txt updatedfile.txt > patchfile.txt

    ```


    The program will run and return a command line with no messages. If you''re interested
    in seeing what the patch file contains, feel free to take a look at it with cat
    or more. In this example, the resulting patch file is named patchfile.txt—you
    should distribute it to everyone who has the original templatefile.txt and who
    needs to update it.


    > File Comparisons The diff command is also useful when you want to know if two
    copies of the same file are identical or not. If you find yourself with multiple
    copies of similar files, diff is a fast way to find out they are identical, and
    if not, what changes have been made between them. If diff produces output, there
    are no differences between the files.'
