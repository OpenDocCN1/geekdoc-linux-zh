  md: '# USING date


    The date command, as you might have guessed, returns the current date and time.
    If you have Super User privileges you can also use date to set the day and time
    on the computer. Ordinary user accounts do not have this capability.


    ```

    >date

    Mon Nov 30 01:15:17 EST 1998

    ```


    There''s nothing to it. You might be wondering why I would even take the space
    to cover such a command. The answer is simple: Without the command, how do you
    find out the current day and time information on your computer? KDE displays the
    information on its desktop, but outside of KDE, the date command will become very
    useful when you have stared at your screen for several hours and end all sense
    of time.


    # USING uptime


    uptime is another simple and useful command. It returns the current time, the
    number of users logged in to the system, how long the system has been running,
    and the amount of load that the system has been under. Just type uptime at the
    command prompt.


    ```

    >uptime

    ```


    ```

    1:20am up 2 days, 9:18, 2 users, load average:

    →1.10, 0.90, 0.10

    ```


    As you can see from this result, its 1:20 a.m. (yes, it really is!); my system
    has been running for 2 days, 9 hours, and 18 minutes since it was last rebooted.
    There are currently two users logged in to the system. The load average is comprised
    of three values: the first value is the load on the system over the past minute,
    the second is the average load over 10 minutes, and the third, over 15 minutes.
    These values are rarely higher than 1 or 2. If you see a system load average of
    anything over 5, your computer is really busy.'
  merge: -1
