  md: 'Let''s take a look at some of the KDE window features:


    +   - KDE Window list—Shows a list of all windows available currently, even if
    they''re completely hidden onscreen

    - Application-specific widget—The leftmost widget on the title bar. Its functions
    are specific to the application associated with the window.

    - Pushpin widget—This button locks the window to your display, making it available
    on any virtual screen you access.

    - Iconify, expand, and destroy Window buttons—These buttons give you control of
    the window—minimize it, maximize it, or close it entirely.

    - KDE quick-start application icons—Puts you one click away from your most frequently
    used programs.

    - KDE toolbar—This panel includes pop-up menus to start programs, select windows,
    and configure your environment.

    - KDE Environment Setup utility—Allows you to control such things as your screen
    saver, display settings, and so on.

    - KDE desktop icons—These icons “live” on your desktop and represent files, directories,
    or applications.


    In addition to interface sophistication, KDE provides an integrated suite of tools
    for configuring your machine and your user interface, and offers a set of useful
    point-and-click interfaces for general Linux programs and utilities. Some of these
    utilities will be discussed in other lessons, if you''re using a desktop environment
    of some sort already, pay attention to these sections to see how KDE, and desktop
    environments in general, can make your life easier.


    If you''re looking for a way to make your Linux experience feel even more like
    your personal computer, ask your administrator to make sure that KDE is installed
    on your system. The KDE Web site and associated downloads are located at http://
    /www.kde.org.'
