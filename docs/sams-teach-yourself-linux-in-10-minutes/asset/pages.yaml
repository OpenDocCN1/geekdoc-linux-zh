  md: '# # LESSON 14

    # BASIC SHELL SCRIPTING


    In this lesson, you will learn a bit more of the magic behind automation and customization
    using shell scripts.


    In Lesson 12, "Input and Output," you learned about pipes, and you probably began
    to see a bit of what makes Linux so powerful and configurable. What you probably
    didn''t realize is that using a pipe is only the very beginning of what Linux
    can do to customize and automate tasks. As you read through this lesson, you''ll
    see that pipes are only the smallest tip of the iceberg.


    Shell scripts are essentially programs written in the language of the shell. If
    you''re a user from the pre-Windows days of the PC, you''ll recognize shell scripts
    as being similar to BATCH files. Macintosh users, while not burdened by a command
    line in day-to-day life, should still see the similarity to the AppleScript and
    Frontier scripting languages. While anything larger than a few dozen lines of
    script would probably be better done in a language other than the shell, thinking
    of shell scripts as *little programs* does injustice to the flexibility and convenience
    that they provide the user.


    # ## GETTING A LOT FOR A LITTLE: SHELL SCRIPTS


    You would usually create a shell script when you want to combine a set of actions
    that you routinely need to repeat into a single convenient action.


    For example, if you''re in the habit of coming in to work, sending all your coworkers
    an email message saying "Howdy Neighbor," firing a print job to print out the
    most recent 100 hits to your personal Web page, and then opening an xterm* and
    reading a few newsgroups, you can save yourself some time and keystrokes by writing
    a little shell script to do all this'
  merge: -1
