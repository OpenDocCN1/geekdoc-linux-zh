  md: "# # LESSON 8\n TEXT EDITING\n\nIn this lesson, you will learn the basics of\
    \ editing files in the Linux environment.\n\nMany Linux programs use text files\
    \ as input, create text files as output, or are configured commands and variables\
    \ set up in a text file. In order to change the contents of these files you need\
    \ to use a text editor.\n\nAs a matter of fact, most Linux software doesn't know\
    \ the difference between a text file and any other file. From the operating system's\
    \ point of view, files are files are files. If the user chooses to view some of\
    \ them as containing text, and others as containing programs, that the user's\
    \ business. An interesting consequence of this lack of concern over a file's contents\
    \ is that the operating system is just as happy to let you use a text editor to\
    \ edit the contents of your spreadsheet program as it is to let you attempt to\
    \ run your email. Of course, if you actually execute permission set on your email\
    \ and try to run it, it's almost certain to segmentation-fault (crash) immediately,\
    \ but Linux will try.\n\n> > Advantage If you are a programmer you might find\
    \ this lack of a distinction to be useful. On occasion, you might find a program\
    \ that needs a minor change, such as correction of a misspelling or a change of\
    \ wording. In this instance, it is sometimes most convenient to load the executable\
    \ file into a text editor and make the correction directly in the binary. This\
    \ isn't a trick for the faint of heart, but sometimes, it's the quick fix you\
    \ need...and sometimes it's the only fix for software that you don't have the\
    \ source code for.\n\n![](img/a0e6136ea1c86032b26127d28a7bd962_89_0.png)"
