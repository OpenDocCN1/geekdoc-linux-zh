  md: '# The File System


    1. Determine the name of the directory you want to list.


    2. Issue the ls command as <directory name>


    For example, if you wanted to list the contents of the root directory /, you would
    type:


    ```

    > ls / /

    CDROM lib

    bin priv

    core tmp

    dev vmlinux

    etc usr

    include var

    ```


    Everything here is a directory, except vmlinux, which is the piece of software
    at the most basic heart of Linux, and core, which is an error file that really
    should be thrown away.


    > Filename Facts Remember that Linux filenames, and consequently commands, are
    case-sensitive. Linux alphabetizes the capitals before the lowercase. This is
    why CDROM appears before bin.


    How can you tell that they are directories? Use ls to ask it for more information
    in the listing, specifically the “long” option.


    Issue the command as ls -1 <directory name>


    For example


