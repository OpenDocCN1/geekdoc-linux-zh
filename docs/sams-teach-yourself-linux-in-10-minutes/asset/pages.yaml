  md: '# # LESSON 19


    # ## PERMISSIONS


    In this lesson, you will learn what permissions are, and how to change them.


    Linux file permissions might be something that you never have to deal with. But,
    if your system has multiple users and you want to share files with them, chances
    are you''ll need to know a bit about the concept of permissions and how to modify
    them.


    # ## OWNERS, GROUPS, AND PERMISSIONS


    The owner of a file is exactly what it sounds like—the person who owns the file.
    Each file has information stored with it that identifies the account that owns
    it. Files can be given to others by changing the owner information to match their
    username. In general, the person who creates a file is the person who owns it.


    Each file on the Linux system also has a secondary piece of information stored
    that records the group ownership of file. Groups are collections of users. By
    allowing a group to share ownership of files, multiple people can work together
    on a project and have their changes immediately available to other members of
    the group. By default, many Linux users have their own group that is the same
    as their account name. In this case, when a user creates a file, the default group
    is that user''s personal group. This is not necessarily the case on more traditional
    UNIX systems. The idea behind Linux machines having personal groups is that creating
    a user to encompass all the user accounts is a security risk.


    Permissions control what actions a user can perform on a file or directory. There
    are three basic actions, which are pretty much self-explanatory: read, write,
    and execute. Read permissions control whether or not someone can view a file.
    Write allows disallows changes to be made to a file. Execute permissions control
    whether or not a file can be run or'
  merge: -1
  pgno: 180
- img_proc: true
  md: 'In the case of a directory, these change a bit. If a directory has execute
    permissions turned off, you cannot cd into the directory, view its contents, or
    write to it. It is effectively turned off. If read permissions are turned off,
    you can still create files in the directory and read them, but you cannot get
    a listing of what is in the directory. Lastly, if the write permission is turned
    off for a directory, you can view a listing of the contents and read files, but
    not create any new files.


    When permissions are applied to a file or folder, they are applied at three distinct
    levels: *owner, group, and world*. The owner permissions control what permissions
    the file owner has. Group permissions determine what actions can be performed
    by members of the same group that the file belongs to. Your system administrator
    can create new groups, or add you to be a member of a group. You can think of
    world permissions as a huge group that encompasses all *users* on your computer.
    If there is any sort of guest access to your computer, you can assume that any
    active world permissions apply to *anyone* who can access your computer.


    # CHECKING THE OWNER, GROUP, AND ASSOCIATED PERMISSIONS: ls -lg


    You''ve already used the ls command extensively, but you probably haven''t been
    paying much attention to the extended information it can return. If you run `ls
    -lg` to list your directories, you can see the owner, group, and associated permissions
    for any file.


    For example


    ```

    >ls -lg


    -rw-r-- 1 jray jray 2024 Oct 26 20:39 kiwi.tar

    -rw------ 1 jray test 1463882 Jul 2 11:33

    *magical-beans.gz

    drwxrxr-x 5 jray test 1024 Nov 5 12:25 kyitn

    ```


    The information you''re interested in here are the first, third, and fourth columns:'
  merge: -1
  pgno: 181
- img_proc: true
  md: '+   - The first column identifies the owner, group, and world permissions that
    are active for a file or directory. The first character will be a d if the file
    type is a directory. Normally this will be an -hen for a normal file. The remainder
    of the characters, as you might guess, stand for read, write, and execute (x).
    The first three characters (following the initial - or d character) are the active
    owner permissions, the second three characters are the group permissions, and
    the last are world permissions.


    +   - The third column is the file owner.


    +   - The fourth column is the group owner.


    In this example, the kiwi.tar file has read/write permissions for the owner, and
    read permissions active for the group and world. The owner of the file is jray
    and the group file belongs to test. The second file, magicalbeans.gz, has only
    read/write permissions for the owner, who is jray. The group that magical-beans.gz
    belongs to test, which has no permissions to operate on the file. The last file,
    kyit is actually a directory. The owner of kyit is jray, and the corresponding
    group is test. The owner and group both have full read, write, and execute permissions
    for this directory, whereas the world has read and execute.


    # CHANGING PERMISSIONS: chmod


    Now that you know what permissions are, you''d probably like to know how to change
    them! This is accomplished with the chmod command. There are two modes of operation
    that you can use with chmod: a quick-and-dirty mode and a more user-friendly method
    of setting permissions.


    The symbolic user-friendly mode uses easy-to-remember commands to set or unset
    permissions. To use this, do the following:


    +   - Pick a permission level. If you want to set permissions for the owner, this
    will be u. If you''d like to change permissions for the group, it is g. For world
    permissions, choose o. Lastly, if you''d like to affect all the levels of permissions
    (owner, group, and world), use a.'
  merge: -1
  pgno: 182
- img_proc: true
  md: '2. Choose an operation. Decide whether you want to set (turn on) or unset (turn
    off) a particular level of permission. If you want to set a permission, the operation
    will be +; if you want to unset a permission, it is -.


    3. Choose the permission itself. If you''d like to operate on the read permission,
    this will be r; for write it is w, and execute it is x.


    4. Issue the command in the following manner:


    ```

    chmod <permission level><operation><permission>

    <filename> <filename> ....

    ```


    For example, I want to activate write permissions for the magical-beans.gz file
    shown earlier:


    ```

    -rw------ 1 jray test 1463882 Jul 2 11:33

    ->magical-beans.gz


    chmod g+w magical-beans.gz

    ```


    To see this Worked, I''ll run ls -lg on the filename.


    ```

    >ls -lg magical-beans.gz

    ```


    ```

    -rw------ 1 jray test 1463882 Jul 2 11:33

    ->magical-beans.gz

    ```


    Sure enough, write permissions are now active for the test group members.


    Although this method for adjusting file permissions might be easy for some because
    of its symbolic nature, there is another syntax that I find faster and easier.
    This deals with setting the actual bit mask that controls bits can represent each
    level of permissions. The first of these bits (from right to left) controls the
    read, the second controls write, and the third controls execute.


    Look at this way:


    +   010 - Read permission - The decimal equivalent of binary value is 4.

    010 - Write permission - The decimal value for write is 2.

    001 - Execute permission - The decimal representation is 1.'
  merge: -1
  pgno: 183
- img_proc: true
  md: 'Using this technique, you can easily set multiple permissions at once. For
    example, it''s easy to see that 110 is the combination of the read and write permissions.
    The decimal value of this binary string is 6 (4+2). To use this method of setting
    a file''s permissions, you will set permissions for owner, group, and simultaneously—with
    three digits. Each of these digits is the sum of the permissions that you''d like
    to set. The first digit is the owner, the second is the group, and the third is
    the world.


    For example, suppose I want to set the owner to have full permissions, and the
    group and world to have read and execute permissions. Full permissions are achieved
    by adding all the permission values 4+2+1=7. Read and execute permissions are
    a combination of 4+1=5. The three numbers I''ll use to set this are 7, 5, and
    5, entered as a single three digit number-755. The syntax for this form of chmod
    <permissions> <filename> ...


    For example


    ```

    >chmod 755 magical-beans.gz

    ls -lg magical-beans.gz


    -rw-xr-x-- 1 jray test 1463882 Jul 2 11:33 -> magical-beans.gz

    ```


    As I hoped, the owner has full read, write, and execute permissions. As you become
    the group and world have read and execute permissions. As you become experienced
    with permissions, you''ll probably find that this second method is the fastest
    to set permissions. Just remember read (4), write (2), and execute (1), and you''ll
    be fine.


    > Changing Permissions at the Directory Level If you want to change the permissions
    of an entire directory structure (all the files and directories within a directory),
    you can use the command-line option -R with the chmod command to recursively change
    everything within a directory.'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# CHANGING A FILE’S OWNER: chown


    This command isn’t going to do you much good because it it can only be used by
    the super user (root). If you need to change the owner of a file, you should ask
    your system administrator to run this for. The syntax for chown is chown <new
    owner> <filename> <filename> . . .


    For example


    ```

    >chown agroves magical-beans.gz

    >ls -lg magical-beans.gz

    ```


    ```

    -rwxr-xr-x 1 agroves test 1463882 Jul 2 11:33

    → magical-beans.gz

    ```


    The file is now owned by the user agroves as opposed to jray, who has owned it
    throughout this lesson.


    > Another Way to Grant Ownership If, for some reason, another user needs to own
    a file that you own, you can always give them read permission and let them copy
    the file. The copy that is created will be owned by the other user.


    # CHANGING A FILE’S GROUP: chgrp


    Although you can’t change a file’s owner, you can change the group that a file
    belongs to with the chgrp command. To do this, however, you must be a member of
    that group. Your system administrator has the ability to create new groups and
    add users to these groups. If you have questions about your own group membership(s),
    ask your administrator how your account was configured.


    To use chgrp, follow these steps:


    +   1. Choose the file or files you want to change.

    2. Determine the group that the file will now belong to.

    3. Change the file’s group using chgrp <new group> <filename> <filename> . . .'
  merge: -1
  pgno: 185
- img_proc: true
  md: 'For example


    ```

    >chgrp admins magical-beans.gz

    >ls -lg magical-beans.gz

    -rwr-xr-x 1 agroves admins 1463882 Jul 2 11:33

    magical-beans.gz

    ```


    The magical-beans.gz file now belongs to the group admins. Members of the group
    have read and execute permissions for the file.


    The most obvious use for chgrp is if you are collaborating on a project. If you
    create a file that you want to share with other people, you''ll need to change
    the group of the file to be that all users belong to.


    > Running chgrp on a Directory The chgrp command, like chown, can also be run
    recursively on a directory using the -R option. This is a big time saver when
    you want to modify a bunch of files and directories at a time.


    # LOGGING IN TO A NEW GROUP: new


    If you''re working on a project, you might not want to constantly change the group
    of the files that you create; this would get pretty monotonous if you are working
    with hundreds of files. Luckily, there is a way to log in to a group you are aware
    of. This is done by way of the newgrp command. All files that are created after
    executing this command will be under the group membership that you''ve switched
    to. This change will persist until you log out or use the newgrp command again.
    Use newgrp by typing newgrp <group>.


    For example


    ```

    >newgrp admins

    ```


    After this command is executed, all further files that are created in this session
    will belong to the group admins.'
  merge: -1
  pgno: 186
- img_proc: true
  md: '# BECOMING ANOTHER USER

    TEMPORARILY: SU


    The substitute user command, su, lets you switch to another user account from
    within a single login session. Under Linux, this changes your effective user ID—which
    means that all files created will be as if the other user created them. Your actual
    user ID remains the same, however. A noticeable side effect of this is that even
    though you''ve used su to become another user, running mail will check email for
    the user account you initially used to log in. To use the su command, enter it
    as su <user to switch to>.


    For example


    >su approves


    Password: *****


    I can now use the whoami command to verify that the system now believes that I
    am effectively agrees.


    >whoami


    agrees


    Just as I suspected! I can perform operations under the agrees account. If you
    think that you can use su to try to guess other users'' passwords, guess again!
    The su command logs all accesses to a system log file.


    > Account Sharing Guidance It isn''t a good idea to share account passwords between
    users. For example, I''ve used the agrees account, which isn''t necessarily good.
    Because the system thinks I''m agrees, most anything I do will be logged as being
    done by that user...and she might not appreciate it very much.


    A proper use of su would be to switch to non-personal accounts. There are several
    accounts that are owned by database servers, and so on, which would be prime candidates
    for the appropriate use of su in order to perform maintenance on the database
    files.'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# SUMMARY


    In this lesson, you learned the purpose of permissions, owners, and groups. You
    should now understand what is necessary to enable other users to access your files
    and how to collaborate on projects using group permissions. You might want to
    take a few minutes to talk to your system administrator to find out how or she
    has decided to manage groups. Also, you might want to request that groups be created
    which include other users that you want to share files with. Let''s take a look
    at some of the highlights from this lesson:


    +   - **Permissions**—File permissions control who can access a file and at what
    level they have to a file. The three levels of permissions are read, write, and
    execute. These permissions are applied to the owner, group, or world.


    +   - **chmod**—The chmod command changes the permissions for a file or directory.
    There are two methods of operation—symbolic and numeric. They both accomplish
    the same thing, whichever you feel comfortable with.


    +   - **chown**—Only the super user can change who owns a file. If you can convince
    your administrator to do so, chown will change the owner.


    +   - **chgrp**—You can change the group that a file belongs to with the chgrp
    command. You can only change the file to a group that you belong to.


    +   - **newgrp**—Rather than constantly having to change the group for files you
    create, you can use newgrp to log in to a group that you are a member of. All
    files that are created for the remainder of your login session will be created
    under that group.


    +   - **su**—The substitute user command effectively switches to another user
    within a single login session. If you have the password of another account, you
    can use su to perform operations under this account; any files you create will
    be owned by this user.'
  merge: -1
  pgno: 188
- img_proc: true
  md: '![](img/a0e6136ea1c86032b26127d28a7bd962_189_0.png)


    # # LESSON 20

    # PRIVILEGED COMMANDS


    In this lesson, you''ll take a look at some of the special commands Linux users
    seldom encounter.


    The commands in this lesson are restricted to being run by the root user, but
    the information here will help you understand some of root''s concerns and help
    conversations with your system administrator to make a little more sense.


    Because of the way that Linux works (with multiple users, multiple processes,
    and files owned by potentially hundreds of people), there are certain commands
    that would cause chaos if entrusted to normal users. These commands do things
    such as format disks, reboot the system, and create or remove devices.


    # ## SINGLE-USER MODE


    Every Linux machine can be configured to boot into Single-User mode—a mode where
    the machine has no network resources, and can only support a single user logged
    in. This mode is a maintenance mode that allows the root user to repair problems
    with the system without having to worry about other users changing things they
    are working on. With some versions of Linux, if a machine experiences a particularly
    hard crash, it might reboot itself into Single-User mode automatically. Some require
    a root password before any commands can be entered, but others come directly into
    a root shell. If you happen to crash a Linux machine and it comes up into Single-User
    mode, Do Not Touch Anything!* Anything you do has the potential to make diagnosing
    the crash impossible, and worse, could have devastating effects on the system.
    For the root user, a single-keystroke typo in the `rm` command can delete the
    entire file system, from the top down.'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# fsck


    Every now and then you might hear a system administrator grumbling about fsck
    a drive. Linux tends to take reasonably good care of its drives, but problems
    do crop up. The fsck command is Linux''s disk fixer program, which is used to
    clean up problems caused by crashes or err pieces of software. Most Linux systems
    fsck their drives on startup, and the expected result is an analysis report containing
    the number of files and the fragmentation level of the drive. If you''re watching
    a Linux machine boot, do not be concerned if you see fsck report problems—Linux
    will automatically attempt to fix them. In most cases it will be successful, and
    after fscking the drives the system will restart the reboot process. If the drives
    have serious problems, the automatic fsck will exit with an error message stating
    Run, fsck manually. If it does, don''t touch anything. Find a system administrator.


    # mount/unmount


    The mount command tells the system to attach a disk drive to the file system at
    a particular directory. If you remember from Lesson 4, “The File System,” Linux
    abstracts the physical hardware by causing drives to appear as directories in
    the file system. The mount command tells the system how to access the drive or
    where to locate it on the network, and where to attach it to the file system.
    The unmount command does exactly the opposite—it removes mounted devices.


    If you log in to the system and are greeted by a message that says something like
    No Home Directory using / don''t panic. In all likely your home directory is fine,
    it''s just on a drive that is not mounted. This shouldn''t happen often, but with
    drives and resources shared over the network, it only takes one person tripping
    over a network patch to make some devices unavailable until the wire can be repaired.


    If you get the preceding error, or on some systems, you are kicked right back
    off the system after entering your password, wait 15 minutes and try again before
    calling your system administrator. Chances are, they already know about the problem
    and are trying to fix it, but dozens of users calling to complain is slowing them
    down.'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# shutdown/reboot


    While personal computers are becoming increasingly picky about being shut down
    instead of simply turned off, Linux machines are more picky still. The difference,
    of course, goes back to the fact that Linux uses dozens of cooperating programs
    to form what appears as the operating system. Each of these programs could be
    in the process of modifying, moving, creating, or deleting files at any point
    in time. If you simply shut off the power to a Linux machine, you interrupt all
    these processes, and probably destroy any files you were working on. If the files
    were things such as word-processor documents, this would only be a minor problem.
    Unfortunately, Linux also moves around and updates files critical for the operating
    system. System shutting off the power to a Linux machine has the potential to
    completely corrupt the drives, leaving the system unusable—in short, don''t do
    it.


    To prevent this, Linux has a shutdown command and a reboot command, each with
    obvious goals. These two commands gracefully exit all running software, write
    disk-cache information to the drives, and complete their respective tasks. They
    are restricted to the root user for obvious reasons, yet Linux allows the console
    user to press Ctrl+Alt+Del. This doesn''t actually turn the machine off; it executes
    the shutdown command, as root, without requiring a password. Only use this in
    extreme emergencies. Other users could be using your machine, or your machine
    could be providing disk resources to other machines. Shutting down is likely to
    create havoc on your local network and will earn you a high position on your system
    administrator’s list of least favorite users.


    # chown


    The chown command is used to change the owner of a file from one account to another.
    Obviously, a normal user can''t use this command, but if you need this, your system
    administrator can do it for you. Remember, you can always get a copy of a file
    that you can read using the cp command—changing ownership might not be necessary.'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# SUMMARY


    In this lesson, you were introduced to a few things that you shouldn''t or can''t
    do in the hopes of understanding why you shouldn''t and can''t do them will make
    interaction with your system administrator easier. System administrators have
    a hard job; they have to walk the fine line between keeping the system functioning
    for all users (which sometimes requires them to be hard-nosed and inflexible)
    and creating the environment individual users need to work. Most are truly interested
    in making the system work the best possibly for you, but many do not have sufficient
    time to have a lot of patience. Hopefully, an understanding of the types of things
    that will make your system administrator''s life more difficult, and why it is
    you shouldn''t do them, will allow you to stay on the good side of your administrator.
    Now, let''s review some of the other points from this lesson:


    +   * Never touch a machine if it looks like its running root shell.

    * Don''t bother root (your system administrator) about unmounted drives unless
    it''s obvious that nobody knows about it.

    * Never ever turn the power to your machine off without permission from your administrator.

    * Root (administrative users) can change ownership of files for you, but you should
    consider whether it''s really necessary, or whether a copy will do.'
  merge: -1
  pgno: 192
- img_proc: true
  md: '# # APPENDIX A

    SELECTING YOUR LINUX DISTRIBUTION


    Before you can even install Linux and start using it, you need to make a choice
    that can be a bit confusing: What distribution of Linux should you use? If you
    were to do a search for Linux Distribution on the Internet, you''ll find references
    to Red Hat, Caldera, Debian, and many, others. With the growing popularity of
    Linux among users and developers, this list will undoubtedly continue to grow
    in the upcoming months and years.


    Selecting the one that is right for you is bound to be difficult if you have no
    experience with Linux. Luckily, most of the distributions are available for free
    or for a minimal cost on CD-ROM, so you have the opportunity of testing a few
    without spending thousands of dollars. Most people find a distribution and stick
    with it religiously. Others patch together a hybrid system using pieces of many
    distributions. It''s your operating system; it''s up to you.


    > **What Is a Linux Distribution?** A Linux distribution is nothing more than
    a packaging of the Linux operating system. Just as car dealers add options to
    a base model car, the people who create the different Linux distributions add
    features to their version to make it appealing.'
  merge: -1
  pgno: 193
- img_proc: true
  md: '# SELECTING Your LINUX DISTRIBUTION


    # KEY POINTS TO CONSIDER


    Version—Does the distribution include the most recent stable version of the Linux
    kernel? (As of this writing, 2.0.36 is the most current distributed kernel, with
    2.2.0 on the horizon.) The kernel contains the basic instructions that Linux needs
    to operate. Low-level system problems, such as susceptibility to TCP/IP network
    attacks, are often kernel-level problems. New versions of the kernel are released
    over time, which patch any problems that are found. If you select a distribution
    that isn''t up to date, you might find yourself needing to upgrade the kernel
    manually—which can be a tricky undertaking for a new user.


    Ease of Upgrading—In the past, upgrading Linux has been a matter of checking to
    see if a new version of the software is available, downloading it, compiling and
    installing it. This leads to outdated files lingering in hidden directories on
    the system, lost configuration files, and in general, headaches. Many Linux distributions
    now include the capability to analyze your system and determine what files need
    to be upgraded, and then perform the upgrade automatically. This keeps you up
    to date with the latest patches and utilities and reduces the amount of time you
    must spend administrating the machine.


    Included Features—At the base of any Linux distribution, you''ll find all the
    standard utilities and goodies you expect. In fact, in most cases if something
    isn''t included, there''s no reason why you can''t locate it on the Internet,
    and then install it on your system. This can be a inconvenient if you''re dealing
    with hundreds of machines, however. Pick the distribution that has the most features
    that appeal to you. You can add what you need later, but it''s best to start out
    with a solid foundation.


    Support—This, for many, might be the most important thing to think about. If you
    purchase a full Linux distribution, do you get support for the software? The capability
    to get technical information and help from a single contact point can be very
    important for businesses and individuals alike. Rather than choosing a product
    that leaves you to your resources, you might want to pick one that includes support.'
  merge: -1
  pgno: 194
- img_proc: true
  md: '# A FEW POPULAR DISTRIBUTIONS


    At this point, I''m going to quickly look at a few Linux distributions and give
    a brief overview of some of their features. A distribution can change drastically
    from one version to another, so you''ll probably want to research them a bit on
    your own to find what is or isn''t included in the most current distribution—which
    might very well be different from what is available at the time I am writing this.


    # A Few Points of Caution


    ![](img/a0e6136ea1c86032b26127d28a7bd962_195_0.png)


    +   - Most Linux distributions that you can purchase for $50+ are also available
    for free over the Internet or on cheaply CD-ROMs. Although these versions are
    similar, the cheap versions do not include any sort of support, printed documentation,
    or normally included commercial software. You are entirely on your own. If you
    want a complete product, make sure you''re buying a boxed package.

    - Linux distributions have their own versioning scheme. For example, Red Hat is
    currently at version 5.2, while Caldera OpenLinux is 1.3. Both of these products,
    however, are using the Linux kernel 2.0.35. Just because one distribution''s version
    number is lower than another doesn''t mean that it is older or less capable. To
    be sure, compare kernel versions, which are usually listed on the box.


    # RED HAT LINUX


    Red Hat is the most popular version of Linux in the United States and includes
    a variety of value-added packages. The installation process is streamlined, and
    can be performed over a network very easily. Many'
  merge: -1
  pgno: 195
- img_proc: true
  md: '# SELECTING YOUR LINUX DISTRIBUTION


    custom utilities are included for managing the system graphically. Red Hat also
    pioneered, and includes, the RPM packaging system that makes upgrading between
    different distribution versions as easy as clicking an upgrade button and waiting
    a few minutes. Red Hat also provides services for the full version of their products.


    For more information on the Red Hat distribution, look at http://www.redhat.com.


    # DEBIAN LINUX


    The Debian Linux distribution is also a very popular, non-commercial distribution
    of Linux. Support is provided through the Debian development community, which
    consists of hundreds of people worldwide. The Debian distribution is a cutting-edge
    distribution that is updated on a very frequent basis. Bugs are tracked and patched
    as quickly, if not quicker, than many commercial distributions. Debian also provides
    their own package management system, which similar to RPM, handles upgrades in
    a very seamless and fashion. Debian Linux is the most flexible of the distributions,
    but this flexibility means that new users will experience a great deal of added
    complexity. Debian Linux is best used by Linux or UNIX veterans.


    For more information on Debian, try http://www.debian.org.


    # CALDERA OPENLINUX


    The Caldera commercial Linux is a commercial power-user distribution that includes
    several high-end servers, including the new Linux Sybase ASE (SQL) Server. Caldera
    has built a user-friendly installation procedure that is similar to Red Hat''s,
    also using the RPM package manager. A particularly nice feature of OpenLinux is
    that it comes with KDE, which provides a wonderful interface for users coming
    from more traditional desktop operating systems. It also provides the StarOffice
    productivity suite, which offers Office 95 connectivity and very similar functionality
    and features. For corporate customers, Caldera offers extensive training programs,
    certification, and support services for OpenLinux.


    To learn more about Caldera OpenLinux, take a look at http://www.calderasystems.com.'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# S.U.S.E. LINUX


    This is a solid, full-featured distribution that comes with 4 CD-ROMs of applications
    and source code and very extensive printed documentation. The S.u.s.E. distribution
    uses the Red Hat RPM management system for easy upgrades, and includes its own
    easy-to-use administration tools. It also comes with X Windows servers that have
    been developed by S.u.s.E. to support the latest level of responsiveness. For
    the graphically oriented, it also includes the KDE Desktop Environment.


    For more information about S.u.s.E., go to http://www.suse.com.


    # SO MANY TO CHOOSE FROM...


    Whatever distribution you choose, you''re bound to find features that you like
    in it, that aren''t included in others. If you''re making decisions for a company,
    you might want to test the level of responsiveness of the support services for
    several distributions. It''s difficult to choose a clear winner in further research
    of the different distributions, check out this page because of the rapid pace
    of Linux development. If you''re interested in further research of the different
    distributions, check this page at the Linux Headquarters Web site: http://www.linuxhq.com/dist-index.html.


    Luckily, the cost of commercial distributions of Linux is far less than competing
    the mainstream operating systems. For the cost of one copy of a commercial UNIX
    or NT, you can own many distributions of Linux. Take time to find one that you
    like, and that includes the features and software you''re likely to need. Exploring
    the options that Linux opens up to you half the fun of running the operating system!'
  merge: -1
