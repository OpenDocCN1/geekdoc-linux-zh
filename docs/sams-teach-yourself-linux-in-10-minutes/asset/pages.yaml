  md: '# LESSON 6


    # WORKING WITH FILES IN THE SHELL


    In this lesson, you will learn how to perform basic file maintenance functions
    such as creating and deleting files and directories.


    You will be unlikely to make use of any Linux commands more frequently than the
    file maintenance command set. Frankly, the commands you''ll use the most are very
    short and have only a few important options. While these commands and options
    might initially seem simplistic, between what you can do with them and what you''ll
    learn about automating them in Lesson 14, “Basic Shell Scripting,” you''ll find
    that these commands can perform almost any file maintenance task you can imagine.


    # WORKING WITH FILES AND FOLDERS: THE COMMAND LINE


    The command line is your primary interface to the Linux file system and your primary
    tool for creating, deleting, and rearranging your files. It''s not unusual for
    pieces of software to provide some file creation and deletion tools, but these
    are rarely as powerful as the command line. Even if you intend to avoid the command
    line for your day-to-day work, you''ll want to know about these tools.'
  merge: -1
  pgno: 70
- img_proc: true
  md: '# Tweedle Dee... When working with the command line, remember this: Filenames
    that you give as arguments to commands can be either relative or absolute paths.
    This means that if you have a command named tweedle, which twiddles a file, and
    if you type


    tweedle myfile, or tweedle ./myfile, you will twiddle the file myfile in the current
    directory.


    tweedle ../myfile, you will twiddle the file myfile in the directory above this
    one.


    tweedle /home/henry/myfile, you will twiddle the file myfile in the /home/henry
    directory (presuming you have permission to twiddle files in that directory, of
    course).


    Keep in mind that tweedle in the preceding examples is a hypothetical command
    with hypothetical results—UNIX has no such command. I''ve simply used it here
    to explain a "modifies in some unspecified way" command. You can substitute any
    operation you''d like for tweedle/tweedle.


    # CREATING A NEW EMPTY FILE: touch


    The touch command is used to update the last modified time of a file and set it
    to the current time. This might seem like an odd thing to do, but it''s a very
    useful utility if you have an application that performs some functions on newer
    than a particular time.


    > Taking Advantage of touch One place you might want to remember that you can
    use the touch command is with backup and archiving software. Many whole-system
    backup programs default to only backing up files that were modified since the
    last backup (this is called and incremental backup). If you want to make sure
    that a file is backed up, even though you have not modified it recently, you can
