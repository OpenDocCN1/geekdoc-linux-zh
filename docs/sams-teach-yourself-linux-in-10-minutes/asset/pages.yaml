  md: '# PIPES


    Not only can Linux redirect STDIN and STDOUT to and from files, but because these
    are data streams to Linux, it also provides the idea of piping these streams directly
    between different programs. With pipes you can use the STDOUT of one program directly
    as the STDIN of another.


    To create a pipe in Linux, you use a | character between the programs on the command
    line.


    Again, an example here is so much more illustrative than a lot of words. Take
    the example of your compulsive collecting of your Web server files. If instead
    of collecting them in files, you''d like to amuse and amaze all your friends by
    sending them the tail end of the file, you can do it without saving it in a file
    by using the following command:


    ```

    tail -30 /var/log/httpd/access_log | mail friend@somewhere.com

    ```


    >  mail command is a simple program that lets you send and receive email on your
    Linux computer. You''ll learn more about this and other network utilities in Lesson
    18, “Accessing Network Resources.”


    Thus far, your repertoire of Linux commands probably isn’t large enough to make
    this a truly useful feature, as you learn more about Linux you will find it a
    powerful tool for simplifying your tasks.


    For now, one way in which you can make this feature work for you is with piping
    things into pagers. If you''d like, for example, to be able to page through the
    output of the ls command, you can pipe it into more. Try typing this:


    ```

    ls -laF | more

    ```


    You will see a particularly long listing of files, if you don’t eventually Ctrl+c
    out of it, it will go on for days. Because that’s really a complete recursive
    listing of your file system in long format, you’re not going to want to use that
    particular command too often. But any time you’d to page through an ls listing,
    or any other output that flows off your screen, you can pipe it into more (the
    pager that you learned in Lesson 7, “Reading Files”).'
