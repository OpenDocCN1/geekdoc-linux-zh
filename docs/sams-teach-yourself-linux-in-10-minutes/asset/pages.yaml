    # ABSOLUTE AND RELATIVE PATHS


    Up to this point, all paths you have been working with have been absolute paths—that
    is, paths starting with the root directory and ending in a file or directory name.
    In real life you would quickly find this annoying, and Linux provides the concept
    of a relative path as well. Relative paths are “relative” to the current directory.
    With the addition of relative paths to your toolkit, the current directory is
    /usr/local/ and you want to be in the directory /usr/local/bin/, you have the
    option of issuing two cd commands. You can type either cd /usr/local/bin or cd
    bin; either will result in your new directory being /usr/local/bin. You can also
    use the element .. discussed earlier as a relative path component. If, for example,
    you are in /usr/local/bin, you have a choice of cd /usr/local/lib, or cd ..lib.'
