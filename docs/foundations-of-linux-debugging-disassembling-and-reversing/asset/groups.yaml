    # 前言


    本书涵盖了从 Intel x64 汇编语言指令、汇编语言程序编写，到指针、实时调试以及对编译后的 C 和 C++ 代码进行静态二进制分析等主题。


    核心内存转储诊断、Linux 应用程序、服务和系统的实时及事后调试、恶意软件分析以及漏洞分析，都需要对 x64 Intel 汇编语言以及 C 和 C++ 编译器如何生成代码（包括内存布局和指针）有理解。本书介绍了理解
    Linux 程序内部结构和行为、开始使用 GDB 调试器以及使用其进行反汇编和逆向工程所需的背景知识和实践基础。它由一系列复杂度递增的实用练习组成，配有解释和大量的图表（包括必要的背景主题）。


    读完本书，你将对 Linux C 和 C++ 编译器如何生成二进制代码有深入的理解。此外，你能够自信地分析此类代码，理解栈内存的使用，并重建原始的 C/C++
    代码。


    本书对以下人员很有用：


    - 软件技术支持与升级工程师

    - 来自 JVM 背景的软件工程师

    - 软件测试人员

    - 来自非 Linux 环境的工程师（例如 Windows 或 Mac OS X）

    - 没有汇编语言背景的 Linux C/C++ 软件工程师

    - 没有汇编语言背景的安全研究人员

    - 学习 Linux 软件逆向工程技术的初学者


    本书也可以作为相关本科课程的 x64 汇编语言和 Linux 调试补充材料。


    # 源代码


    书书中使用的所有源代码都可以从 github.com/apress/linux-debugging-disassembling-reversing 下载。


    # 第 1 章


    ## 内存、寄存器与简单算术


    ### 理想化计算机内部的内存与寄存器


    计算机内存由一系列内存单元组成，每个单元都有唯一的地址（位置）。每个单元都包含一个“数字”。我们将这些“数字”称为地址（位置）的内容。由于内存访问速度比算术指令慢，因此存在所谓的寄存器，用于加速需要内存存储临时结果的复杂操作。我们也可以把它们看作独立的内存单元。寄存器的名称就是它的地址。图
    1-1 展示了这一概念。


    地址（位置）：100

    | 0 |

    | 寄存器 1 |

    | 0 |


    地址（位置）：101

    | 0 |

    | 寄存器 2 |


    地址（位置）：102

    | 1 |

    | 10 |


    地址（位置）：103

    | 1 |


    地址（位置）：104

    | 2 |


    地址（位置）：105

    | 0 |


    **图 1-1. 以内存单元和位置表示的计算机内存**


    ### Intel 64 位 PC 内部的内存与寄存器


    1-2 显示了包含整数值的内存位置地址，它们通常相差四或八字节，我们还展示了两个名为 %RAX 和 %RDX 的寄存器。它们的半部分被称为 %EAX 和 %EDX。


    | 地址（位置） | | 寄存器 %RAX |

    | :--- | :--- | :--- |

    | 地址（位置）：100 | 0 | |

    | 地址（位置）：104 | 0 | %EAX |

    | 地址（位置）：108 | 1 | |

    | 地址（位置）：112 | 1 | 寄存器 %RDX |

    | 地址（位置）：116 | 2 | 10 |

    | 地址（位置）：120 | 0 | %EDX |


    **图 1-2. 典型的 Intel x64 内存和寄存器布局**


    由于内存单元包含“数字”，我们从简单的算术开始，让 PC 计算两个数字之和，以观察内存和寄存器如何改变其值。


    ## “算术”项目：内存布局与寄存器


    在我们的项目中，我们有两个内存地址（位置），称之为“a”和“b”。我们可以将“a”和“b”看作各自地址（位置）的名称。现在我们引入一种特殊的符号，其中 (a)
    表示内存地址（位置）“a”的内容。如果我们使用 C 或 C++ 语言编写项目，我们这样声明并定义内存位置“a”和“b”：


    ```

    static int a, b;

    ```


    默认情况下，当加载程序时，静态内存位置会被填充零，我们可以描绘加载程序后的初始内存布局，如图 1-3 所示。


    | | 寄存器 %RAX |

    | :--- | :--- |

    | 位置：a (地址 0000555555555802c) | 0 |

    | 位置：b (地址 00005555555558030) | 0 |

    | | %EAX |

    | | 寄存器 %RDX |

    | | 0 |

    | | %EDX |


    **图 1-3.** 加载程序后的初始内存布局


    ## “算术”项目：计算机程序


    我们可以将计算机程序看作一组指令，用于操作内存单元和寄存器中的的内容。例如，加法操作：将内存单元 N#12 的内容加上内存单元 N#14 的内容。在我们的伪代码中，可以写成：


    ```

    (14) + (12) -> (14)

    ```


    我们的第一个伪代码位于表格左侧：


    - 1 -> (a)

    - 1 -> (b)

    - (b) + (a) -> (b)

    - (a) + 1 -> (a)

    - (b) * (a) -> (b)


    我们编写与伪代码对应的汇编指令。


    "->" 表示将新值移动（赋值）到内存位置（地址）的内容。";" 是注释符号，行的其余部分是注释。“=" 显示内存位置（地址）处的当前值。


    提醒一下，用高级编程语言编写的代码会由编译器翻译成机器语言。然而，如果其数字代码表示在某种称为汇编语言的助记系统中，那么机器语言是可读的。例如，INC a
    表示将存储在内存位置“a”的值加 1。


    ## “算术”项目：为内存位置赋值数字


    我们提醒一下，“a”意味着内存单元的区域（地址）。“a”意味着内存单元的区域（地址），它也是 0000555555555802c。


    如果我们使用 C 或 C++ 语言，我们将赋值写为：


    ```

    mov $1, a

    ```


    在 GDB 输出中，我们看到如下：


    ```

