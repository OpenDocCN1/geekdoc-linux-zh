    # Pointers Revisited


    The pointer is a memory cell or a register that contains the address of another
    memory cell. Memory pointers have their own addresses because they are memory
    cells too. On 32-bit Linux, pointers are 32-bit, and on 64-bit Linux, pointers
    are 64-bit.


    # Addressing Types


    As we have seen in Chapter 5, memory cells can be one of byte, word, doubleword,
    or quadword size. Therefore, we can have a pointer to a byte, a pointer to a word,
    a pointer to a doubleword, and a pointer to a quadword. The GDB disassembly output
    in Chapter 4 has suffixes in instructions pointing to memory that hold 32-bit
    (doubleword) values.


    Here are some illustrated examples:


    ```

    movb $0xFF, (%rax)

    ```'
