    回 (rax) 和 (rbx) 是存储在 %RAX 和 %RBX 寄存中的内存单元的内容。前面的语句等同于 C 或 C++ 语言，其中“*”运算符表示获取
    **pa** 或 **pb** 指针指向的内容：


    *pb = *pb + *pa;


    在汇编语言中，我们使用 ADD 指令对应“+”，但我们不能在一个指令中使用两个内存地址（`addl` 用于加 32 位整数）：


