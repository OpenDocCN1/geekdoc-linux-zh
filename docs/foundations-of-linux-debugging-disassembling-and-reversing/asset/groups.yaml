  - "[PAGE 148]\n\n# CHAPTER 12 MORE INSTRUCTIONS\n\n# # The Fast Way to Fill Memory\n\
    \nIt can be done by the STOSQ instruction that stores a quadword value from %RAX\
    \ into a memory location which address is in the %RDI register (\"D\" means destination).\
    \ After the value from %RAX is transferred to memory, the instruction increments\
    \ %RDI by eight, and if the DF flag is zero, %RDI now points to the next quadword\
    \ in memory. If the DF flag is one, the %RDI value is decremented by eight, and\
    \ the %RDI now points to the previous quadword in memory. There is an equivalent\
    \ STOSL instruction that stores doublewords and increments or decrements %RDI\
    \ by four.\n\nIf we prefix any instruction with REP, it causes the instruction\
    \ to be repeated until the %RCX register's value is decremented to zero. For example,\
    \ we can write simple code that should theoretically zero \"all memory\" (practically,\
    \ it traps because of access violation):\n\n```\nxor %rax, %rax          # fill\
    \ with 0\nmov $0, %rdi                # starting address or xor\n            \
    \                %rdi, %rdi\nmov $0xffffffff / 4, %rcx # 0x1ffffff quad words\n\
    rep stosq\n```\n\nHere is REP STOSQ in pseudo-code:\n\n```\nWHILE (RCX != 0)\n\
    {\n    RAX -> (RDI)\n\n    IF DF = 0 THEN\n        RDI + 8 -> RDI\n    ELSE\n\
    \        RDI - 8 -> RDI\n\n    RCX - 1 -> RCX\n}\n```"
