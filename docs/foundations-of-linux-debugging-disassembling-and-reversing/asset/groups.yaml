    # CHAPTER 3


    # Number Representations


    # Numbers and Their Representations


    Imagine a herder in ancient times trying to count sheep. He has a certain number
    of stones (twelve):


    ![](img/4ff2512aa382b04d8584e9e1f6cd8896_38_0.png)


    However, he can only count up to three and arranges the total into groups of three:


    ![](img/4ff2512aa382b04d8584e9e1f6cd8896_38_1.png)'
  - '[PAGE 39]


    The last picture is a representation (a kind of notation) of the number of stones.
    We have one group of three groups of three stones plus a separate group of three
    stones. If he could count up to ten, we would see a different representation of
    the same number of stones. We would have one group of ten stones and another group
    of two stones.


    # # Decimal Representation (Base Ten)


    Let''s see how twelve stones are represented in arithmetic notation if we can
    count up to ten. We have one group of ten numbers plus two:


    ```

    $12_{dec} = 1 * 10 + 2$ or $1 * 10^{1} + 2 * 10^{0}$

    ```


    Here is another exercise with 123 stones. We have **1** group of ten by ten stones,
    another group of **2** groups of ten stones, and the last group of **3** stones:


    ```

    $123_{dec} = 1*100 + 2*10 + 3$ or $1 * 10^{2} + 2 * 10^{1} + 3 * 10^{0}$

    ```


    We can formalize it in the following summation notation:


    ```

    $N_{dec} = a_{n}10^{n} + a_{n-1}10^{n-1} + \dots + a_{2}10^{2} + a_{1}10^{1} +
    a_{0}10^{0}$\n$0 \leq a_{n} \leq 9$

    ```


    Using the summation symbol, we have this formula:


    ```

    $N_{dec} = \sum_{i=0}^{n} a_{i}10^{i}$

    ```'
