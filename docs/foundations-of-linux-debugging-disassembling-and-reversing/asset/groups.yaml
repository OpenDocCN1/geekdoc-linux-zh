    \n**Figure 9-4.** Application layout\n\n### Stack Overflow\n\nBy default, the\
    \ stack size is limited (system and limit dependent, and on our system, it is\
    \ 8192Kb or 8388608 bytes). If a stack grows beyond the reserved limit, a stack\
    \ overflow occurs (segmentation fault). It can be caused by an unlimited recursion,\
    \ deep recursion, or very large local variables:\n\n```\nint func()\n{\n    func();\n\
    \    return 0;\n}\n\nint func2()\n{\n    int array[1000000] = { 1 };\n    printf(\"\
