    # About the Author


    ![](img/4ff2512aa382b04d8584e9e1f6cd8896_8_0.png)


    Dmitry Vostakov is an internationally recognized expert, speaker, educator, scientist,
    and author. He is the founder of the pattern-oriented software diagnostics, forensics,
    and prognosis discipline and Software Diagnostics Institute (DA+TA:DumpAnalysis.org
    + TraceAnalysis.org). Vostakov has also authored more than 50 books on software
    diagnostics, anomaly detection and analysis, software and memory forensics, root
    cause analysis and log analysis, memory dump analysis, debugging, software trace
    and log analysis, reverse engineering, and malware analysis. He has more than
    25 years of experience in software architecture, design, development, and people
    management roles. Dmitry also founded Syndromatis, Analog.io, BriteTrace, DiaThangs,
    Logtetlect, OpenTask Iterative and Incremental Publishing (OpenTask), Software
    Diagnostics Technology and Services (former Memory Dump Analysis Services; PatternDiagnostics.com),
    and Software Prognostics. In his spare time, he presents topics on Debugging TV
    and explores Software Narratology, its further development as Narratology of Things
    and Diagnostics of Things (DoT), and Software Pathology. His current areas of
    interest are theoretical software diagnostics and its mathematical and computer
    science foundations, application of artificial intelligence, machine learning
    and


    # ABOUT THE AUTHOR


    data mining to diagnostics and anomaly detection, software diagnostics engineering
    and diagnostics-driven development, and diagnostics workflow and interaction.
    Recent areas of interest also include cloud native computing, security, automation,
    functional programming, and applications of category theory to software development
    and big data.


