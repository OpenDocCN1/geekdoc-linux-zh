- md: "\nThe jump is called absolute because we specify full memory addresses and\
    \ not a relative +/- number to the current %RIP value. The latter jump is called\
    \ relative. %RAX means an indirect jump to the address located in the %RAX register.\
    \ It is illustrated in Figure 9-6.\n\n![](img/4ff2512aa382b04d8584e9e1f6cd8896_117_0.png)\n\
    \n**Figure 9-6.** Example memory and register layout for relative JMP instruction\
    \ execution\n\n# Calls\n\nWe discuss two essential instructions that make the\
    \ implementation of C and C++ function calls. They are called CALL and RET. Figure\
    \ 9-7 shows instructions in memory and corresponding values of %RIP and %RSP registers.\n\
    \n# CHAPTER 9 MEMORY STACKS\n\n| %RIP | %RSP | Stack |\n|---|---|---|\n| 555555556010\
    \ | | 0030000ff0 |\n| MOV 0x555555558020,%RAX | 55555555601a | 0030001000 | 0030001000\
    \ |\n| 55555555601a CALL,%RAX | 55555555601c | 0030000ff8 | 0030000ff8 |\n| 55555555601c\
    \ | Some code | 55555555601d | 55555555601e | 0110000000 |\n| ... | | 0030001000\
    \ | 0 | 0030000ff7 |\n| 555555558020 | Some code | 555555558022 | 55555555601c\
    \ | 0110000000 |\n| 555555558022 | RET | 555555558023 | 55555555601e | 0110000000\
    \ |\n| 555555558023 | Some code | | 0030001000 | 0110000000 |\n\nFigure 9-7. Example\
    \ memory and register layout for CALL and RET instruction execution\n\nWe see\
    \ that the CALL instruction pushes the current value of %RIP to the stack and\
    \ changes %RIP to another memory address. The program execution continues from\
    \ the new location. The RET instruction pops the saved %RIP value from the stack\
    \ to the %RIP register. Then the program execution resumes at the memory location\
    \ after the CALL instruction.\n\nHere is a pseudo-code for CALL instructions and\
    \ some examples adopted from Intel manuals:\n\n- ; Format and arguments:\nCALL\
    \ r/mem64\n\n- ; Pseudo-code:\nPUSH RIP\nDEST -> RIP\n\n; Examples:\nCALL 0x555555558020\n\
    CALL *RAX\n\nHere is a pseudo-code for the RET instruction adopted from Intel\
    \ manuals:\n\n; Format:\nRET\n; Pseudo-code:\nPOP() -> RIP\n\n# Call Stack\n\n\
    If one function (the caller) calls another function (the callee) in C and C++,\
    \ the resulting code is implemented using the CALL instruction, and during its\
    \ execution, the return address is saved on the stack. If the callee calls another\
    \ function, the return address is also saved on the stack, and so on. Therefore,\
    \ we have the so-called call stack of return addresses. Let us see this with a\
    \ simple but trimmed-down example.\n\nSuppose we have three functions with their\
    \ code occupying the following addresses:\n\n```\nfunc 0000000014001000 - 0000000014001100\n\
    func2 0000000014001101 - 0000000014001200\nfunc3 0000000014001201 - 0000000014001300\n\
    ```\n\nWe also have the following code where func calls func2, and func2 calls\
    \ func3:\n\n```\nvoid func()\n{\nfunc2();\n}\nvoid func2()\n{\n    func3();\n\
    }\n```\n\nWhen func calls func2, the caller's return address is pushed to the\
    \ stack, and %RSP points to some value in the 0000001400001000-000000140001100\
    \ range, say 0000001400001020. \n\nWhen func2 calls func3, the caller's return\
    \ address is also pushed to the stack, and %RSP points to some value in the 0000001400001101-000000140001200\
    \ range, say 0000001400001180.\n\nIf we interrupt func3 with a debugger and inspect\
