    2: /x $rax = 0x402000

    3: /x $rbx = 0x402004

    4: /x $rcx = 0x0

    5: /x (int)a = 0x1

    6: /x (int)b = 0x1

    7: /x (long)pa = 0x402000

    8: /x (long)pb = 0x402004

