    \ `a` 和 `b` 是 `main` 函数的局部变量，当我们从函数返回时，外部无法访问它们的值。\n\n# 总结\n\n在本章中，我们研究了更复杂代码的栈布局：数组地址、局部变量以及编译器生成的函数序言和结尾代码。最后，我们反汇编并分析了使用局部变量的代码，并与优化版本进行了对比。\n\
    \n下一章将介绍函数参数及其栈布局。最后，我们将反汇编并分析另一个带有函数参数和局部变量的项目。\n\n# 第 11 章\n\n# 函数参数\n\n# “FunctionParameters”\
    \ 项目\n\n本章教授调用者如何通过寄存器传递参数，以及被调用者（被调函数）如何访问它们。我们使用以下项目，可以通过此链接下载：\ngithub.com/apress/linux-debugging-reversing/Chapter11/\n\
    \n以下是该项目的源代码：\n\n```cpp\n// FunctionParameters.cpp\nint arithmetic(int a, int\
    \ b);\n\nint main(int argc, char* argv[])\n{\n    int result = arithmetic(1, 1);\n\
    \n    return 0;\n}\n```\n\n```cpp\n// Arithmetic.cpp\nint arithmetic(int a, int\
