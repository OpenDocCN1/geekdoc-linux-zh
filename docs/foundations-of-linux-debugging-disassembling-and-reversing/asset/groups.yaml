    \ | %RBP+0xC | 0xC(%RBP) |\n\n**Figure 10-1.** Example memory layout when addressing\
    \ array elements\n\n## Stack Structure (No Function Parameters)\n\nSuppose the\
    \ following function is called:\n\n```c\nvoid func()\n{\n    int var1, var2;\n\
    \    // body code\n    // ...\n}\n```\n\nBefore the function body code is executed,\
