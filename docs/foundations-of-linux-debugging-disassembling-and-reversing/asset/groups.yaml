    ## Multiplying Numbers Using Pointers


    Our next pseudo-code statement does a multiplication:


    (rbx) * (rax) -> (rbx)


    This statement means that we multiply the contents of the memory cell whose address
    is stored in the %RBX register by the value stored in the memory cell whose address
    is the %RAX register. In the C or C++ language


    ```

    *pb = *pb * pa;

    *pb *= *pa;

    ```


    The latter is a shorthand notation. In assembly language, we use instruction IMUL
    (Integer MULtiply):


    ```

    mov (%rax), %eax

    imul (%rbx), %eax

    mov %eax, %rbx

    ```


    Since the imul instruction cannot reference two memory locations, we need to put
    the contents of one location into a register. We reuse %RAX since we do not need
    its current value after that. This instruction is equivalent to the following
    pseudo-code:


    ```

    (rax) -> rax

    (rbx) * rax -> rax

    rax -> (rbx)

    ```


    In the GDB assembly output, we see this:


    ```

    0x0000000000401022 <34>: mov (%rax),%eax

    0x0000000000401024 <36>: imul (%rbx),%eax

    0x0000000000401027 <39>: mov %eax,(rbx)

    ```

