    ## Adding Numbers Using Pointers


    Now we look at the next pseudo-code statement:


    (rbx) + (rax) -> (rbx)


    Recall that (rax) and (rbx) mean contents of memory cells whose addresses (locations)
    are stored in %RAX and %RBX CPU registers. The preceding statement is equivalent
    to the following C or C++ language expression where the “*” operator means to
    get memory contents pointed to by the **pa** or **pb** pointer (also pointer dereference):


    *pb = *pb + *pa;


    In assembly language, we use the instruction ADD for the “+" operator, but we
    cannot use both memory addresses in one step instruction (addl is used to add
    32-bit integers):


    addl (%rax), (%rbx) # invalid instruction


    We can use only one memory reference, and therefore, we need to employ another
    register as a temporary variable:


    (rax) -> register

    (rbx) + register -> (rbx)


    In assembly language, we write this sequence of instructions:


    ```

    mov (%rax), %edx

    add %edx, %rbx

    ```


    We use add instead of addl because using EDX instead of RDX implies adding 32-bit
    integer. In the GDB disassembly, we see these:


    ```

    0x000000000040101c <+28>: mov (%rax),%edx

    0x00000000040101e <+30>: add %edx,(rbx)

    ```


    We add them to our pseudo-code table:


    | Pseudo-code | Assembly |

    | :--- | :--- |

    | address a -> rax | lea a, %rax |

    | 1 -> (rax) ; (a) = 1 | movl $1, (%rbx) |

    | address b -> rbx | lea b, %rbx |

    | 1 -> (rbx) ; (b) = 1 | movl $1, (%rbx) |

    | (rbx) + (rax) -> (rbx) ; %edx = 1 | mov (%rax),%edx |

    | (b) = 2 | add %edx,(%rbx) |

    | (rax) + 1 -> (rax) | |

    | (rbx) * (rax) -> (rbx) | |


