    # Registers Revisited


    %RAX, %RBX, %RCX, and %RDX 64-bit registers can be used as pointers to memory.
    They contain x86 32-bit registers %EAX, %EBX, %ECX, and %EDX. These 32-bit parts
    contain 16-bit registers %AX, %BX, %CX, and %DX (each can hold a word). The %CX
    register was often used as a loop counter, (Counter)X, in the assembly language
    corresponding to simple loops in C and C++ code:


    ```

    for (int i = 0; i < N; ++i)

    ```


    but modern C and C++ compilers may choose to use any other register or even a
    memory location for such purpose.


    # NULL Pointers


    Addresses 0x0000000000000000–0x000000000000FFFF are specifically made inaccessible
    on Linux. The following code will force an application crash or kernel panic if
    executed inside a driver:


    ```

    mov $0xF, %rax

    movb $1, (%rax) # Access violation

    ```


    # Invalid Pointers


    There are different kinds of invalid pointers that cause an access violation when
    we try to dereference them:


    +   - NULL pointers

    - Pointers to inaccessible memory

    - Pointers to read-only memory when writing'
- md: '

    Other pointers may or may not cause an access violation, and some of them are
    discussed in subsequent chapters:


    - Pointers pointing to “random” memory

    - Uninitialized pointers having random value inherited from past code execution

    - Dangling pointers


    The latter pointers are similar to pointers pointing to “random” memory locations
    and arise when we forget to set pointer variables to zero (NULL) after disposing
    of the memory they point to. By nullifying pointers, we indicate that they no
    longer point to memory.


    ## Variables As Pointers


    Suppose we have two memory addresses (locations) “a” and “b” declared and defined
    in C and C++ as:


    ```

    int a, b;

    ```


    These are normal variables “a” and “b.” Also, we can have another memory addresses
    (locations) “pa” and “pb” declared and defined in C and C++ as:


    ```

    int *pa, *pb;

    ```


    Here, pa is a pointer to an int, or in other words, the memory cell pa contains
    the address of another memory cell that contains an integer value.


    ## Pointer Initialization


    In order to have pointers to point to memory, we need to initialize them with
    corresponding memory addresses. Here is typical C or C++ code that does what we
    need:


    ```

    int a;              // uninitialized variable

    int *pa;             // uninitialized pointer

    pa = &a;             // (pa) now contains the address a

    int b = 12;         // initialized variable

    int *pb = &b;        // initialized pointer

    ```


    We see that pointers are also variables and can change their values effectively
    pointing to different memory locations during program execution.


    ## Initialized and Uninitialized Data


    Here is a bit of additional information about initialized and uninitialized variables
    that is useful to know: an executable program in Linux is divided into different
    sections. One is called data, where all global and static variables (including
    pointers) are put.


    Consider this C or C++ data definition:


    ```

    int array[1000000]; // size 4,000,000 bytes or 3.8Mb

    ```


    We would expect the size of an executable file to be about 4Mb. However, the program
    size on a disk is only 16Kb. It is because the uninitialized array contains only
    information about its size. When we launch the program, this array is recreated
    from its size information and filled with zeroes. The size of the program in memory
    becomes about 4Mb.


    In the case of the initialized array, the program size on disk is 4.01Mb:


    ```c

    int array[1000000] = { 12 };

    ```


    This is because the array was put into a .data section and contains the following
    sequence of integers { 12, 0, 0, 0, 0, ... }.


    ## More Pseudo Notation


    We remind that (a) means contents of memory at the address a, and (rax) means
    contents of a 64-bit memory cell at the address stored in the %RAX register (here,
    %RAX is a pointer).


    We also introduce an additional notation to employ in this and subsequent chapters:
    *(pa) means contents at the address stored at the address pa is called dereferencing
    a pointer whose address is pa. The corresponding C/C++ code is similar:


    ```c

    int *pa = &a;

    int b = *pa;

    ```


    ## “MemoryPointers” Project: Memory Layout


    This project is very similar to the “Pointers” project from Chapter 4. We have
    this data declaration and definition in the C or C++ language:


    ```c

    int a, b;

    int *pa, *pb = &b;

    ```


    The project code corresponds to the following pseudo-code and assembly language:


    | Pseudo-code | Assembly |

    | :--- | :--- |

    | address a -> (pa) | lea a, %rax |

    | 1 -> *(pa) ; (a) = 1 | mov %rax, pa |

    | 1 -> *(pb) ; (b) = 1 | mov %rax, %rax |

    | *(pb) + *(pa) -> *(pb) ; (b) = 2 | movl $1, (%rax) |

    | | mov pb, %rbx |

    | | movl $1, (%rbx) |

    | | mov (%rax), %ecx |

    | | add (%rbx), %ecx |

    | | mov %ecx, (%rbx) |

    '
