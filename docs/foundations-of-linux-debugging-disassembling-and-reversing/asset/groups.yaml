    TEST $1, $EDX


    Suppose %EDX contains 0 ($0_{bin}$):


    $0_{bin}$ AND $1_{bin} = 0_{bin}$ == 0 (ZF is set)


    Here is the TEST instruction in pseudo-code (details not relevant to the ZF bit
