    \ | |\n| | 局部变量 | | |\n| ... 返回 | |\n\n# 函数序言和结尾\n\n现在，在我们尝试理解 `FunctionParameters`\
    \ 的反汇编代码之前，先看一个只有一个函数参数和一个局部变量的简单情况，以说明标准的函数序言和结尾指令序列以及相应的栈内存变化。\n\n函数序言如图 11-2\
    \ 所示，函数结尾如图 11-3 所示。\n\n图 11-2. 有函数参数和一个局部变量的序言\n\n这里，函数参数通过 `%RDI` 寄存器传递。通常情况下，通过\
    \ `%EDI`, `%ESI`, `%EDX`, `%R8`, `%R9` 寄存器或栈位置传递整数、指针或长字。\n\n| | | |\n|---|---|---|\n\
    | %RSP | 0 | 0 |\n| | 0 | 0 |\n| | 0 | 0 |\n| %RBP | 上一个 %RBP | 上一个 %RBP |\n|\
    \ | 返回地址 | |\n| | 局部变量 | |\n| | 局部变量 | |\n| ... 0 | ... | ... |\n\n图 11-3. 有函数参数和一个局部变量的结尾\n\
    \n我们还看到局部变量在通过该指令分配空间时默认并没有初始化。在分配之前，内存中的内容是所谓的垃圾值。\n\n# 带注释的项目反汇编\n\n以下是 `main`\
    \ 和 `arithmetic` 的带注释反汇编代码，删除了内存地址以便观察：\n\nmain:\n\n```assembly\npush %rbp   \
