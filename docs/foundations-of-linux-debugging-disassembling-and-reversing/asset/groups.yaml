    \ = Param2 (双字)\n  // -0x14(%RBP) = Param1 (双字)\n  // -0x8(%RBP) = var2 (双字)\n\
    \  // -0x4(%RBP) = var1 (双字)\n  // (%RBP) =之前的 %RBP (四字)\n  // 0x8(%RBP) = 返回地址\
    \ (四字)\n  // ...\n}\n```\n\n带有两个参数和局部变量的典型栈帧布局如图 11-1 所示。\n\n| | | | |\n|---|---|---|---|\n\
    | %RSP | 保存的寄存器 | | |\n| | 参数 2 | | |\n| | 参数 1 | | |\n| | 局部变量 2 | | |\n| | 局部变量\
