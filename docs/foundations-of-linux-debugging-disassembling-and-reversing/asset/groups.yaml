    \n# 第4章 指针\n\n## 定义\n\n指针的概念对于彻底掌握 Linux 调试至关重要。根据定义，指针是一个内存单元或寄存器，包含另一个内存单元的地址，如图\
    \ 4-1 所示。它本身也有地址。有时指针被称为间接地址（相对于直接地址）。迭代地，我们可以定义另一层间接，并引入指向指针的指针作为内存单元或寄存器，此类此类。\n\
