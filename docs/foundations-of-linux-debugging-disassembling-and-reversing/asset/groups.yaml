    \n### Table 3-1. Hexadecimal Equivalents for Every Binary Digit\n\n| Binary |\
    \ Decimal | Hexadecimal |\n| :--- | :--- | :--- |\n| 0000 | 0 | 0 |\n| 0001 |\
    \ 1 | 1 |\n| 0010 | 2 | 2 |\n| 0011 | 3 | 3 |\n| 0100 | 4 | 4 |\n| 0101 | 5 |\
