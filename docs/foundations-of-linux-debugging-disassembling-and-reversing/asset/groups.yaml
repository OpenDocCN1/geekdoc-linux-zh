    # “Pointers” Project: Calculations


    In order to understand pointers better from a low-level assembly language perspective,
    we perform our old arithmetic calculations from Chapter 1 using pointers to memory
    instead of direct memory addresses:


    ```

    address a -> rax

    1 -> (rax)

    address b -> rbx

    1 -> (rbx)

    (rbx) + (rax) -> (rbx)

    (rax) + 1 -> (rax)

    (rbx) * (rax) -> (rbx)

    ```


    # Using Pointers to Assign Numbers to Memory Cells


    First, the following sequence of pseudo-code instructions means that we interpret
    the contents of %RAX register as the address of a memory cell and then assign
    a value to that memory cell:


    ```

    address a -> rax

    1 -> (rax)

    ```


    > In C and C++ languages, it is called “dereferencing a pointer,” and we write


    ```

    int a;

    int *pa = &a; // declaration and definition of a pointer

    *pa = 1; // get a memory cell (dereference a pointer)

    // and assign a value to it

    ```'
