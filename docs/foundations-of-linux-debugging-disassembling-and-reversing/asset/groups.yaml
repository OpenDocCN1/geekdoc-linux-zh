  - '[PAGE 24]


    # CHAPTER 1 MEMORY, REGISTERS, AND SIMPLE ARITHMETIC


    In the C or C++ language, we can write this using three possible ways:


    a = a + 1;


    ++a;


    a++;


    b = b - 1;


    --b;


    b--;


    In assembly language, we use instructions INC and DEC and write


    ```

    incl a

    inc %eax

    decl %eax

    dec %eax

    ```


    We use **incl** when we need to specify the 32-bit memory cell. It is ambiguous
    when we use "a.". However, using %eax implies using 32-bit values, so **inc**
    is unambiguous.


    In the GDB disassembly output, we may see the same instruction:


    ```

    inc %eax

    or

    add $0X1,%eax # a compiler may decide to use ADD instead of INC

    ```'
