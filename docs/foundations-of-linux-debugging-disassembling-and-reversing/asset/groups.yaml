    其他指针可能会或可能不会导致访问冲突（access violation），其中一些内容将在后续章节中讨论：


    - 指向“随机”内存的指针

    - 继承了过去代码执行随机值的未初始化指针

    - 悬空指针（Dangling pointers）


    后者指针与指向“随机”内存位置的指针类似，当我们在释放其指向的内存后，忘记将指针变量置零（NULL）时就会产生这种指针。通过将指针置空，我们表示它们不再指向任何内存。


    ## 变量作为指针


    假设我们在 C 和 C++ 中声明并定义了两个内存地址（位置）“a”和“b”：


    ```

    int a, b;

    ```


    这些是普通变量“a”和“b”。我们还可以在 C 和 C++ 中声明并定义另外两个内存地址（位置）“pa”和“pb”：


    ```

    int *pa, *pb;

    ```


    在这里，pa 是一个指向 int 的指针，换句话说，内存单元 pa 包含了另一个内存单元的地址，而该内存单元又包含一个整数值。


    ## 指针初始化


    为了让指针指向内存，我们需要用相应的内存地址对其进行初始化。以下是实现我们所需的典型 C 或 C++ 代码：


    ```

    int a;              // 未初始化变量

    int *pa;             // 未初始化指针

    pa = &a;             // (pa) 现在包含了地址 a

    int b = 12;         // 已初始化变量

    int *pb = &b;        // 已初始化指针

    ```


    我们看到指针也是变量，可以在程序执行过程中改变它们的值，从而指向不同的内存位置。


    ## 已初始化和未初始化数据


    这里有一些关于初始化和未初始化变量的额外信息，对于很有帮助：Linux 中的可执行程序被分为不同的部分。其中一个称为 data 段，所有的全局和静态变量（包括指针）都存放在这里。


    考虑这个 C 或 C++ 数据定义：


    ```

    int array[1000000]; // 大小为 4,000,000 字节或 3.8Mb

    ```


    我们预计可执行文件的大小约为 4Mb。然而，磁盘上的程序大小只有 16Kb。这是因为未初始化的数组只包含了关于其大小的信息。当我们启动程序时，该数组会根据其大小信息重建并用零填充。程序在内存中的大小变为约
    4Mb。


    在已初始化数组的情况下，磁盘上的程序大小为 4.01Mb：


    ```c

    int array[1000000] = { 12 };

    ```


    这是因为数组被放在 .data 段中并包含了以下整数序列 { 12, 0, 0, 0, 0, ... }。


    ## 更多伪表示


    我们提醒 (a) 表示地址 a 处的内存内容，而 (rax) 表示存储在 %RAX 寄存器中的地址处的 64 位内存单元的内容（这里，%RAX 是一个指针）。


    我们还引入了在本章及后续章节中使用的额外符号：*(pa) 表示存储在地址 pa 处的地址的内容，这被称为对地址为 pa 的指针进行解引用（dereferencing）。对应的
    C/C++ 代码如下：


    ```c

    int *pa = &a;

    int b = *pa;

    ```


