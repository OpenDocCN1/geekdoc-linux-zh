  - '[PAGE 21]


    # CHAPTER 1 MEMORY, REGISTERS, AND SIMPLE ARITHMETIC


    In the C or C++ language, we write the following statement:


    ```

    b = b + a;

    b += a;

    ```


    In assembly language, we use the instruction ADD. Because of AMD64 and Intel EM64T
    architecture''s limitations, we cannot use both memory addresses in one step (instruction),
    for example, add a, b. We can only use the add register, b instruction to add
    the value stored in the register to the contents of the memory cell b. Recall
    that a register is like a temporary memory cell itself here:


    +   (a) -> register

    (b) + register -> (b)


    Alternatively, we can use two registers:


    +   (a) -> register1

    (b) -> register2

    register2 + register1 -> register2

    register2 -> (b)


    In assembly language, we write


    ```

    mov a, %eax

    add %eax, b

    ```


    or we can add two registers and move the result to the memory cell b:


    ```

    mov b, %edx

    mov a, %eax

    add %edx, %eax

    mov %eax, b

    ```'
