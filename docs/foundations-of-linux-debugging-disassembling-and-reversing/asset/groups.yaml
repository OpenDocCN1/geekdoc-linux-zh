    If we use the C or C++ language, "a" is called "the variable a," and we write
    the assignment as


    a = 1;


    In the Intel assembly language, we write


    ```

    mov $1, a

    ```


    In the GDB disassembly output, we see the following code where the variable "a"
    and address are shown in comments:


    ```

    movl $0x1,0x2ef2($rip)    # 0x5555555802c <a>

    ```


    We show the translation of our pseudo-code into assembly language in the right
    column:


    ```

    1 -> (a)          ; (a) = 1    movl $1, a

    1 -> (b)          ; (b) = 1    movl $1, b

    (b) + (a) -> (b)

    (a) + 1 -> (a)

    (b) * (a) -> (b)

    ```


    Notice movl instructions instead of mov. This is because "a" and "b" point to
    both 32-bit (like %EAX or %EDX registers) and 64-bit memory cells (like %RAX and
    %RDX registers). In the registers'' case, it is clear from their names whether
    we use 64-bit %RAX or 32-bit %EAX. In the case of memory addresses "a" and "b,"
    it is not clear whether they refer to 64-bit or 32-bit cells. We use movl to disambiguate
    and show that we use 32-bit memory cells that are enough to hold integers from
    0 to 4294967295.


    0x2ef2($rip) is how the compiler generates code to calculate the address "a" instead
    of specifying it directly. Such code requires less memory space. We explain this
    in later chapters.'
