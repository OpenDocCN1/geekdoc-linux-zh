    # # Testing for 0


    A ZF bit in the %RFLAGS register is set to one if the instruction result is zero
    and cleared otherwise. This bit is affected by


    +   * Arithmetic instructions (e.g., ADD, SUB, MUL)

    * Logical compare instruction (TEST)

    * “Arithmetical” compare instruction (CMP)


    The location of the ZF bit is shown in Figure 12-3.'
