    \ 1110 | 14 | E |\n| 1111 | 15 | F |\n\nIn GDB and other debuggers, memory addresses\
    \ are displayed in hexadecimal.\n\n## Summary\n\nThis chapter refreshed different\
    \ representations of a number, including hexadecimal notation. The next chapter\
    \ introduces pointers. We rewrite our arithmetic from Chapter 1 using pointers\
    \ to memory and use the GDB debugger to execute instructions one by one and watch\
    \ changes to memory.\n\n# 4 POINTERS\n\n## Definition\n\nThe concept of a pointer\
    \ is one of the most important to understand thoroughly to master Linux debugging.\
    \ By definition, a pointer is a memory cell or a processor register that contains\
    \ the address of another memory cell, as shown in Figure 4-1. It has its own address\
    \ as memory cell. Sometimes, a pointer is called an indirect address (vs. a direct\
    \ address, the address of a memory cell). Iteratively, we can define another level\
    \ of indirection and introduce a pointer to a pointer as a memory cell or a processor\
    \ register that contains the address of another memory cell and so on.\n\n###\
    \ “Pointers” Project: Memory Layout and Registers\n\nIn our debugging project,\
    \ we have two memory addresses (locations), “a” and “b.” We can think about “a”\
    \ and “b” as names of addresses (locations). We remind that notation (a) means\
