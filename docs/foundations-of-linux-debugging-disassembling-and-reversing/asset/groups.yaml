- md: "\n# TEST or CMP?\n\nBoth instructions are equivalent if we want to test for\
    \ zero, but the CMP instruction affects flags than TEST:\n\n```\nTEST %EAX, %EAX\n\
    CMP $0, %EAX\n```\n\nThe CMP instruction is used to compare for inequality (the\
    \ TEST instruction cannot be used here):\n\n```\nCMP $0, %EAX # > 0 or < 0 ?\n\
    ```\n\nThe TEST $2, %EAX # 2 == 0010bin or in C language: **if (var & 0x2)** Examples\
    \ where %EAX has the value of 2:\n\n```\nTEST $4, %EAX # 0010bin AND 0000bin (ZF\
    \ is set)\nTEST $6, %EAX # 0010bin AND 0110bin = 0010bin (ZF is cleared)\n```\n\
    \n# Conditional Jumps\n\nConsider these two C or C++ code fragments:\n\n# CHAPTER\
    \ 12 MORE INSTRUCTIONS\n\n```cpp\nif (a == 0)\n{\n    ++a;\n}\nelse\n{\n    --a;\n\
    }\nif (a != 0)\n{\n    ++a;\n}\nelse\n{\n    --a;\n}\n```\n\nThe CPU fetches instructions\
    \ sequentially, so we must skip some instructions if some condition is (not) met,\
    \ for example, if a != 0. JNZ (jump if not zero) and JZ (jump if zero) test the\
    \ ZF flag and change %RIP if the ZF flag is cleared for JNZ or set for JZ. The\
    \ following assembly language is equivalent to the preceding C/C++:\n\n```assembly\n\
    CMP $0, %EAX      MOV E, %EAX\nJNZ  label1     INC  %EAX\nlabel1: DEC A      JMP\
    \  label2\nlabel2: DEC %EAX\n```\n\nSome 64-bit registers have a legacy structure\
    \ that allows us to address their 32-bit, 16-bit, and 8-bit parts, as shown in\
    \ Figure 12-4.\n\n# Function Return Value\n\nMany functions return values via\
    \ %RAX register. For example:\n\n```cpp\nlong func();\nbool func();\n```\n\nThe\
    \ return value is in %RAX. Although bool values occupy one byte in memory, the\
    \ compiler may use %EAX instead of %AL.\n\n# Using Registers\n\nSuppose we have\
    \ a byte value in %AL, and we want to add this value to %ECX register. However,\
    \ we do not know what other parts of the full %EAX register contain. We cannot\
    \ use this instruction, for example:\n\n```\nMOV %AL, %EBX # operand size conflict\n\
    ```\n\nThe proposed solution in pseudo-code:\n\n```\nAL -> EBX          AL ->\
    \ EAX\nECX + EBX -> ECX    ECX + EAX -> ECX\n```\n\nWe can only use MOV instructions\
    \ that have the same operand size for both source and destination, for example:\n\
    \n```cpp\nMOV %AL, %BL\nstatic bool b = func();\n```\n\nFor this task, there is\
    \ a special MOVZX (Move with Zero) instruction that replaces the contents of the\
    \ second operand with the contents of the first operand while filling the rest\
    \ of the bits with zeros:\n\n```\nMOVZX reg, reg\n```\n\nTherefore, our solution\
    \ for the task becomes very simple:\n\n```assembly\nMOVZX %AL, %EBX\nADD %EBX,\
    \ %ECX\n```\n\nWe can also reuse the %EAX register:\n\n```assembly\nMOVZX %AL,\
    \ %EAX\nADD %EAX, %ECX\n```\n\n# Summary\n\nIn this chapter, we learned about\
    \ CPU flags, comparison instructions, conditional jumps, and function return values\
    \ – usually present in real code we may need to disassemble to understand program\
    \ logic during debugging. The next chapter is our “graduation” project – we disassemble\
    \ and analyze a project that uses function parameters which are pointers.\n\n\
    # Function Pointer Parameters\n\n# “FunctionPointerParameters” Project\n\nIt is\
    \ our final project, and it can be downloaded from github.com/linux-debugging-disassembling/Chapter13/\n\
