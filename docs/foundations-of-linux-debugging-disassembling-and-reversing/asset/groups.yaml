  mdcn: "\n\n# TEST 还是 CMP？\n\n如果我们想测试零，这两条指令是等价的，但 CMP 指令对标志位的影响不同 TEST：\n\n```\n\
    TEST %EAX, %EAX\nCMP $0, %EAX\n```\n\nCMP 指令用于比较不相等性（TEST 指令无法在此处使用）：\n\n```\n\
    CMP $0, %EAX # > 0 或 < 0 ？\n```\n\nTEST $2, %EAX # 2 == 0010bin，或者在 C 语言中：**if\
    \ (var & 0x2)** %EAX 值为 2 的示例如下：\n\n```\nTEST $4, %EAX # 0010bin AND 0000bin (ZF\
    \ 被置位)\nTEST $6, %EAX # 0010bin AND 0110bin = 0010bin (ZF 被清零)\n```\n\n# 条件跳转\n\
    \n请考虑以下两个 C 或 C++ 代码段：\n\n# 第 12 节 更多指令\n\n```cpp\nif (a == 0)\n{\n    ++a;\n\
    }\nelse\n{\n    --a;\n}\nif (a != 0)\n{\n    ++a;\n}\nelse\n{\n    --a;\n}\n```\n\
    \nCPU 按顺序取取指令，因此如果某些条件（不）满足，我们必须跳过某些指令，例如如果 a != 0。JNZ（非零跳转）和 JZ（零跳转）测试 ZF 标志位，如果\
    \ ZF 标志位被清零（对于 JNZ）或置位（对于 JZ），则更改 %RIP。以下汇编语言与上述 C/C++ 代码等效：\n\n```assembly\n\
    CMP $0, %EAX      MOV E, %EAX\nJNZ  label1     INC  %EAX\nlabel1: DEC A      JMP\
    \  label2\nlabel2: DEC %EAX\n```\n\n某些 64 位寄存器具有遗留结构，允许我们寻址它们的 32 位、16 位和 8 位部分，如图\
    \ 12-4 所示。\n\n# 函数返回值\n\n许多函数通过 %RAX 寄存器返回结果。例如：\n\n```cpp\nlong func();\nbool\
    \ func();\n```\n\n返回值位于 %RAX 中。虽然 bool 类型的值在内存中占用一个字节，但编译器可能会使用 %EAX 代替 %AL。\n\
    \n# 使用寄存器\n\n假设我们在 %AL 中有一个字节值，并想将此值加到 %ECX 寄存器。然而，我们不知道 %EAX 寄存器的其他部分包含什么。我们不能使用这条指令，例如：\n\
    \n```\nMOV %AL, %EBX # 操作数大小冲突\n```\n\n建议的伪代码解决方案：\n\n```\nAL -> EBX         \
    \ AL -> EAX\nECX + EBX -> ECX    ECX + EAX -> ECX\n```\n\n我们只能使用源操作数和目的操作数大小大小相同的\
    \ MOV 指令，例如：\n\n```cpp\nMOV %AL, %BL\nstatic bool b = func();\n```\n\n对于这项任务，有一个特殊的\
    \ MOVZX（零扩展移动）指令，它用第一个操作数的内容替换第二个操作数的内容，同时用零填充剩余位：\n\n```\nMOVZX reg, reg\n```\n\
    \n因此，我们针对该任务的解决方案变得非常简单：\n\n```assembly\nMOVZX %AL, %EBX\nADD %EBX, %ECX\n```\n\
    \n我们也可以复用 %EAX 寄存器：\n\n```assembly\nMOVZX %AL, %EAX\nADD %EAX, %ECX\n```\n\n#\
    \ 总结\n\n在本章中，我们学习了 CPU 标志位、比较指令、条件跳转和函数返回值——这些通常出现在我们在调试期间为了理解程序逻辑而需要反汇编的真实代码。下一章是我们的“毕业”项目——我们将汇编并分析一个使用指针作为函数参数的项目。\n\
    \n# 函数指针参数\n\n# “FunctionPointerParameters” 项目\n\n这是最终的项目，可以从 github.com/linux-debugging-disassembling/Chapter13/\
    \ 下载。\n\n项目源码摘要：\n\n```cpp\n// FunctionParameters.cpp\nint main(int argc, char*\
    \ argv[])\n{\n    int a, b;\n    printf(\"Enter a and b: \");\n    scanf(\"%d\
    \ %d\", &a, &b);\n    if (arithmetic(a, &b))\n    {\n        printf(\"Result =\
    \ %d\", b);\n    }\n    return 0;\n}\n```\n\n```cpp\n// Arithmetic.cpp\nbool arithmetic(int\
    \ a, int *b)\n{\n    if (!b)\n    {\n        return false;\n    }\n    *b = *b\
