    # Things to Remember


    Here is the summary of what we have learned about stacks with the last three points
    covered in the subsequent chapters of this book:


    +   - Stack operations are LIFO – Last In First Out.

    - The stack grows down in memory.

    - The %RSP register points to the top of a stack.

    - Stacks are used for storing return addresses for CALL instructions.

    - Stacks are used for passing additional parameters to functions.

    - Stacks are used for storing function parameter values and local and temporary
    variables.'
