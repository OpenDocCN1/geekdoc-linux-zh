    # # Why Are Hexadecimals Used?


    Consider this number written in binary notation: 11000100111₂. Its equivalent
    in decimal notation is 3155:


    ```

    3155dec = 1*2¹¹ + 1*2¹⁰ + 0*2⁹ + 0*2⁸ + 0*2⁷ + 1*2⁶ + 0*2⁵


    + 1*2⁴ + 0*2³ + 0*2² + 1*2¹ + 1*2⁰

    ```


    Now we divide the binary number into groups of four and write them down in decimal
    and hexadecimal notation:


    ```

    110001010011

    12dec 5dec 3dec

    Chex 5hex 3hex

    ```


    We see that decimal notation is more compact because every four binary digit group
    number corresponds to one hexadecimal number. Table 3-1 lists hexadecimal equivalents
    for every binary digit combination.'
