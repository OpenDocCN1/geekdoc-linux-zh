    # Preface


    The book covers topics ranging from Intel x64 assembly language instructions and
    writing programs in assembly language to pointers, live debugging, and static
    binary analysis of compiled C and C++ code.


    Diagnostics of core memory dumps, live and postmortem debugging of Linux applications,
    services, and systems, malware, and vulnerability analysis require an understanding
    of x64 Intel assembly language and how C and C++ compilers generate code, including
    memory layout and pointers. This book is about background knowledge and practical
    foundations that are needed to understand internal Linux program structure and
    behavior, start working with the GDB debugger, and use it for disassembly and
    reversing. It consists of practical step-by-step exercises of increasing complexity
    with explanations and many diagrams, including some necessary background topics.


    By the end of the book, you will have a solid understanding of how Linux C and
    C++ compilers generate binary code. In addition, you will be able to analyze such
    code confidently, understand stack memory usage, and reconstruct original C/C++
    code.


    The book will be useful for:


    - Software technical support and escalation engineers

    - Software engineers coming from JVM background

    - Software testers

    - Engineers coming from non-Linux environments, for example, Windows or Mac OS
    X

    - Linux C/C++ software engineers without assembly language background

    - Security researchers without assembly language background

    - Beginners learning Linux software reverse engineering techniques


    This book can also be used as an x64 assembly language and Linux debugging supplement
    for relevant undergraduate-level courses.


    # Source Code


    All source code used in this book can be downloaded from github.com/apress/linux-debugging-disassembling-reversing.


    # CHAPTER 1


    ## Memory, Registers, and Simple Arithmetic


    ### Memory and Registers Inside an Idealized Computer


    Computer memory consists of a sequence of memory cells, and each cell has a unique
    address (location). Every cell contains a "number." We refer to these "numbers"
    as contents at addresses (locations). Because memory access is slower than arithmetic
    instructions, there are so-called registers to speed up complex operations that
    require memory to store temporary results. We can also think about them as stand-alone
    memory cells. The name of a register is its address. Figure 1-1 illustrates this
    concept.


    Address (Location): 100

    | 0 |

    | Register 1 |

    | 0 |


    Address (Location): 101

    | 0 |

    | Register 2 |


    Address (Location): 102

    | 1 |

    | 10 |


    Address (Location): 103

    | 1 |


    Address (Location): 104

    | 2 |


    Address (Location): 105

    | 0 |


    **Figure 1-1. Computer memory represented as a sequence of memory cells and locations**


    ### Memory and Registers Inside Intel 64-Bit PC


    1-2 shows addresses for memory locations containing integer values usually differ
    by four or eight, and we also show two registers called %RAX and %RDX. The first
    halves of them are called %EAX and %EDX.


    | Address (Location) | | Register %RAX |

    | :--- | :--- | :--- |

    | Address (Location): 100 | 0 | |

    | Address (Location): 104 | 0 | %EAX |

    | Address (Location): 108 | 1 | |

    | Address (Location): 112 | 1 | Register %RDX |

    | Address (Location): 116 | 2 | 10 |

    | Address (Location): 120 | 0 | %EDX |


    **Figure 1-2. Typical Intel x64 memory and register layout**


    Because memory cells contain “numbers,” we start with simple arithmetic and ask
    a PC to compute the sum of two numbers to see how memory and registers change
    their values.


    ## “Arithmetic” Project: Memory Layout and Registers


    For our project, we have two memory addresses (locations) that we call “a” and
    “b.” We can think about “a” and “b” as names of their respective addresses (locations).
    Now we introduce a special notation where (a) means contents at the memory address
    (location) "a." If we use the C or C++ language to write our project, we declare
    and define memory locations "a" and "b" as:


    ```

    static int a, b;

    ```


    By default, when we load a program, static memory locations are filled with zeros,
    and we can depict our initial memory layout after loading the program, as shown
    in Figure 1-3.


    | | Register %RAX |

    | :--- | :--- |

    | Location: a (Address 0000555555555802c) | 0 |

    | Location: b (Address 00005555555558030) | 0 |

    | | %EAX |

    | | Register %RDX |

    | | 0 |

    | | %EDX |


    **Figure 1-3.** Initial memory layout after loading the program


    ## "Arithmetic" Project: A Computer Program


    We can think of a computer program as a sequence of instructions for the manipulation
    of contents of memory cells and registers. For example, addition operation: adds
    the contents of memory cell N#12 to the contents of memory cell N#14. In our pseudo-code,
    we can write:


    ```

    (14) + (12) -> (14)

    ```


    Our first program in pseudo-code is shown on the left of the table:


    - 1 -> (a)

    - 1 -> (b)

    - (b) + (a) -> (b)

    - (a) + 1 -> (a)

    - (b) * (a) -> (b)


    We, put assembly instructions corresponding to pseudo-code.


    "->" means moving (assigning) the new value to the contents of a memory location
    (address). ";" is a comment sign, and the rest of the line is a comment. "=" shows
    the current value at a memory location (address).


    To remind, a code written in a high-level programming language is translated to
    a machine language by a compiler. However, the machine language can be readable
    if its digital codes are represented in some mnemonic system called assembly language.
    For example, INC a is increment by one of what is stored at a memory location
    "a".


    ## "Arithmetic" Project: Assigning Numbers to Memory Locations


    We remind that "a" means location (address) of the memory cell. "a" means location
    (address) of the memory cell, and it is also 0000555555555802c.


    If we use the C or C++ language, we write the assignment as:


    ```

    mov $1, a

    ```


    In the GDB output, we see the following:


    ```

    0x2ef2($rip)    # 0x55555555802c <a>

    ```


    We show the translation of our pseudo-code into assembly language in the right
    column:


    ```

    1 -> (a)          ; (a)    movl $1, a

    1 -> (b)          ; (b)    movl $1, b

    (b) + (a) -> (b)

    (a) + 1 -> (a)

    (b) * (a) -> (b)

    ```


    Notice movl instead of mov. This is because "a" and "b" point to both 32-bit (like
    %EAX or %EDX) and 64-bit cells (like %RAX and %RDX). In the registers'' case,
    it is clear from their names whether we use 64-bit or 32-bit. In the case of memory
    addresses "a" and "b," it is not clear whether they refer to 64-bit or 32-bit.
    We use movl to disambiguate and show that we use 32-bit cells that are enough
    to hold integers from 0 to 4294967295.


    Literal constants have the $ prefix, for example, $0x1. The 0x prefix means the
    following number is hexadecimal. The leading zeros of the address are also committed
    in the comment. We explain such numbers in Chapter 3. Please also notice that
    the movement direction is the same in both the disassembly output and the pseudo-code.
    After executing the first two assembly language instructions, we have the memory
    layout shown in Figure 1-4.


    | Register %RAX | |

    | :--- | :--- |

    | 0 | |

    | Location: a (Address 0000555555555802c) | 1 |

    | | %EAX |

    | Location: b (Address 00005555555558030) | 1 |

    | Address (Location): 00005555555558034 | 0 |

    | | Register %RDX |

    | | 0 |

    | | %EDX |


    **Figure 1-4.** Memory layout after executing the first two assembly language
    instructions

