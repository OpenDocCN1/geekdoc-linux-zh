    ### Reconstructing C/C++ Code: Part 1


    Now we go from instruction to bold on the previous page and try to reconstruct
    pseudo-code which is shown as assembly language.


    ```

    lea 0x2ef9(rip),rax      # 0x555555555030 <a> address a -> rax

