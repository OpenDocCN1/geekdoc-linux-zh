    # CHAPTER 14


    # Summary of Code Disassembly Patterns


    This final chapter summarizes the various patterns we have encountered during
    the reading of this book.


    # Function Prolog/Epilog


    Function prolog


    ```

    push    %rbp

    mov    %rsp,%rbp

    ```


    Function epilog


    ```

    mov    %rbp,%rsp

    pop    %rbp

    ret

    ```


    It is equivalent to


    ```

    leave

    ret

    ```


    Some code may omit to restore %RSP if it does not change:


    ```

    pop    %rbp

    ret

    ```'
