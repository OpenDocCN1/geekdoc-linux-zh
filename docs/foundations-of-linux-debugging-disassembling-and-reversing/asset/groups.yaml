    ### Reconstructing C/C++ Code: Part 2


    Now we group pseudo-code together with possible mixed C/C++ and assembly language
    elements:


    ```

    address a -> rax      ; int a; int *pa;

    rax -> (pa)          ; pa = &a;

    address b -> rax      ; int b; int *pb;

    rax -> (pb)          ; pb = &b;

    (pa) -> rax          ; *pa = 1;

    1 -> (rax)

    (pb) -> rax          ; *pb = 1;

    1 -> (rax)

    ecx -> (pb)          ; *pb = ecx;

    edx -> (rax)

    (pa) -> rax          ; *pa = edx;

    edx -> (rax)

    ecx + edx -> edx

    edx -> (rax)

    pb -> (rax)

    ```


    ### Reconstructing C/C++ Code: Part 3


    Next, we combine more mixed statements into C/C++ language:


    ```

    int a; int *pa;

    pa = &a;

    int b; int *pb;

    pb = &b;

    *pa = 1;

    *pb = 1;

    ecx = *pb;

    edx = *pa;

    edx = ecx + edx;

    *pb = *pb + *pa;

    ```


    ### Reconstructing C/C++ Code: Program


    Finally, we have something that looks like a complete C/C++ code:


    ```

    int a, b;

    int *pa, *pb;


    pa = &a;

    pb = &b;


    *pa = 1;

    *pb = 1;


    *pb = *pb + *pa;

    ++pa;


    *pb = *pb * *pa;

    ```


    If we look at the project source code PointersVariables.cpp, we see the same code
    compiled into the executable file that we were disassembling.


    ### Example of Disassembly Output: Optimized Program


    The optimized program (compiled with -O2) contains fewer CPU instructions:


    ```

    (gdb) disass main

    Dump of assembler code for function main:

    => 0x0000555555555040 <+0>: lea 0xffd(rip),%rax

    0x0000555555555047 <+7>: movl $0x2,0x2ff3(rip)

    0x0000555555555051 <+17>: mov %rax,0x2fe(rip)

    0x0000555555555058 <+24>: lea 0x2fe1(rip),%rax

    0x000055555555505f <+31>: mov %rax,0x2fca(rip)

    0x0000555555555066 <+40>: xor %eax,%eax

    0x0000555555555080 movl $0x4,0x2fce(rip)

    0x0000555555555072 <+50>: retq

    ```


    We see that the compiler was able to figure out the result of computation: a=2;
    b=4. However, one question remains: Why did the compiler not optimize away first
    instructions initializing pa and pb variables? The answer lies in the nature of
    a separate compilation model in C and C++. We can compile several compilation
    unit (.c or .cpp) files separately and independently. Therefore, there is no guarantee
    that another compilation unit would not reference our globally declared and defined
    pa and pb variables.


    We can also see that the compiler reordered instructions. It can be seen in pseudo-code:


    ```

    address a -> rax

    1 -> (a)

    rax -> (pa)

    ```


    ### Summary


    In this chapter, we used our assembly language knowledge to reconstruct C and
    C++ code that uses pointers. We also compared the disassembly of the optimized
    code.


    The next chapter looks at the stack memory layout and its operations, jump instructions,
    and function calls. We also explore a call stack using the GDB debugger.

