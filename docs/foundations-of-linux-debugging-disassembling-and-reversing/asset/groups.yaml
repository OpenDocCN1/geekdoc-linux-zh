    \ Register Review\n\nSo far, we have encountered these general-purpose registers:\n\
    \n- %RAX (among its specific uses are to contain function return values and the\
    \ lower part of a multiplication result)\n- %RBX\n- %RCX (among its specific uses\
    \ is a loop counter)\n- %RDX (among its specific uses is to contain the higher\
    \ part of a multiplication result if it exceeds the maximum 64-bit value)\n- %RIP\
    \ (Instruction Pointer, points to the next instruction to be executed)\n- %RSP\
    \ (Stack Pointer, points to the top of the stack)\n\nWe come to the next important\
    \ register on Linux platforms called Base register or sometimes as Stack Frame\
    \ Pointer register %RBP.\n\n## Addressing Array Elements\n\nWe can consider stack\
    \ memory as an array of memory cells, and often the %RBP is used to address stack\
    \ memory elements in the way shown in Figure 10-1, where it slides into the frame\
    \ of stack memory called a stack frame. The first diagram depicts 64-bit (quadword)\
    \ memory cells, and the second depicts 32-bit (doubleword) memory cells.\n\n|\
    \ | Address of the element | Value of the element |\n|---|---|---|---|\n| 0 |\
    \ 0010001000 | %RBP-0x20 | -0x20(%RBP) |\n| 0 | 0010001008 | %RBP-0x18 | -0x18(%RBP)\
    \ |\n| 0 | 0010001010 | %RBP-0x10 | -0x10(%RBP) |\n| 0 | 0010001018 | %RBP-0x8\
    \ | -0x8(%RBP) |\n| %RBP → 0 | 0010001020 | %RBP | (%RBP) |\n| | 0 | 0010001028\
    \ | %RBP+0x8 | 0x8(%RBP) |\n| | 0 | 0010001030 | %RBP+0x10 | 0x10(%RBP) |\n| |\
    \ 0 | 0010001038 | %RBP+0x18 | 0x18(%RBP) |\n\n| | | | |\n|---|---|---|---|\n\
    | 0 | 0010001018 | %RBP-0x8 | -0x8(%RBP) |\n| %RBP → 0 | 001000101C | %RBP-0x4\
    \ | -0x4(%RBP) |\n| | 0 | 0010001020 | %RBP | (%RBP) |\n| | 0 | 0010001024 | %RBP+0x4\
