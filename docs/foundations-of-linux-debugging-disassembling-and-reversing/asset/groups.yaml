    ### Figure 9-5. Example memory and register layout for JMP instruction execution


    We see that the JMP instruction changes %RIP to point to another memory address,
    and the program execution continues from that location. The code shown in Figure
    9-5 loops indefinitely: this can be considered a hang and CPU spike.


    Here is a pseudo-code for absolute JMP instructions adopted from Intel manuals
