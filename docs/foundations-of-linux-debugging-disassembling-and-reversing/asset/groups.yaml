    # CPU Flags Register


    In addition to registers, the CPU also contains a 64-bit %RFLAGS register where
    individual bits are set or cleared in response to arithmetic and other machine
    instructions can manipulate bit values, and their values affect code execution.


    For example, the DF bit (Direction Flag) determines the direction of memory copy
    operations and can be set by STD and cleared by CLD instructions. It has the default
    value of zero, and its location is shown in Figure 12-1, where only the first
    32 bits of 64-bit %RFLAGS are shown.


