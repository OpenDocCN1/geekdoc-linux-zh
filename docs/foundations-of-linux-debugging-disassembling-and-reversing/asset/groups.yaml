  mdcn: "\n\n## 第 10 章 栈帧指针与局部变量\n\n```assembly\nmov %rax, result\npop %rdx ; 按反序弹出\n\
    pop %rax ; 栈是后进先出 (LIFO)\n```\n\n### 寄存器回顾\n\n到为止，我们已经遇到了这些通用寄存器：\n\n- %RAX（其特定用途包括包含函数返回值和乘法结果的低位部分）\n\
    - %RBX\n- %RCX（其特定用途包括循环计数器）\n- %RDX（其特定用途包括当乘法结果超过最大 64 位值时，包含其高位部分）\n- %RIP（指令指针，指向下一条要执行的指令）\n\
    - %RSP（栈指针，指向栈顶）\n\n我们接下来来看 Linux 平台上另一个重要的寄存器，它被称为基址寄存器（Base register），或者有时称为栈帧指针寄存器\
    \ %RBP。\n\n## 定址数组元素\n\n我们可以将栈内存视为一个内存单元数组，通常使用 %RBP 如图 10-1 所示的方式对栈内存元素进行寻址，它移动到一个被称为栈帧（stack\
    \ frame）的栈内存帧中。第一幅图描述了 64 位（quadword）内存单元，第二幅描述了 32 位（doubleword）内存单元。\n\n| |\
    \ 元素的地址 | 元素的值 |\n|---|---|---|---|\n| 0 | 0010001000 | %RBP-0x20 | -0x20(%RBP)\
    \ |\n| 0 | 0010001008 | %RBP-0x18 | -0x18(%RBP) |\n| 0 | 0010001010 | %RBP-0x10\
    \ | -0x10(%RBP) |\n| 0 | 0010001018 | %RBP-0x8 | -0x8(%RBP) |\n| %RBP → 0 | 0010001020\
    \ | %RBP | (%RBP) |\n| | 0 | 0010001028 | %RBP+0x8 | 0x8(%RBP) |\n| | 0 | 0010001030\
    \ | %RBP+0x10 | 0x10(%RBP) |\n| | 0 | 0010001038 | %RBP+0x18 | 0x18(%RBP) |\n\n\
    | | | | |\n|---|---|---|---|\n| 0 | 0010001018 | %RBP-0x8 | -0x8(%RBP) |\n| %RBP\
    \ → 0 | 001000101C | %RBP-0x4 | -0x4(%RBP) |\n| | 0 | 0010001020 | %RBP | (%RBP)\
    \ |\n| | 0 | 0010001024 | %RBP+0x4 | 0x4(%RBP) |\n| | 0 | 0010001028 | %RBP+0x8\
    \ | 0x8(%RBP) |\n| | 0 | 001000102C | %RBP+0xC | 0xC(%RBP) |\n\n**图 10-1.** 寻址数组元素的内存布局示例\n\
    \n## 栈结构（无函数参数）\n\n假设调用了以下函数：\n\n```c\nvoid func()\n{\n    int var1, var2;\n \
    \   // 函数体代码\n    // ...\n}\n```\n\n在执行函数体代码之前，会设置以下指针：\n\n- (%RBP) 包含之前的 %RBP\
    \ 值。\n- -0x4(%RBP) 包含局部变量 var1 (doubleword)。\n- -0x8(%RBP) 包含局部变量 var2 (doubleword)。\n\
    \n这在图 10-2 中所示。\n\n![](img/4ff2512aa382b04d8584e9e1f6cd8896_128_0.png)\n\n**图\
    \ 10-2.** 无函数参数的栈内存布局\n\n## 函数序言 (Function Prolog)\n\n导致 %RBP 寄存器初始化并为局部变量留出空间的指令序列被称为函数序言（function\
    \ prolog）。其中一个示例如图 10-3 所示，func 调用 func2，func2 有一个局部变量 var。有时，保存必要的寄存器也被认为是函数序言的一部分。\n\
    \n```c\nfunc() { func2(); };\nfunc2() { long var; }\ncall func2\npush %rbp\nmov\
    \ %rsp, %rbp\n```\n\n| | | | %0x8 | %rsp |\n|---|---|---|---|---|\n| 0 | | %RSP\
    \ %RBP | 之前的 %RBP | 之前的 %RBP |\n| 0 | %RSP | 返回 func0() 的返回地址 | 返回 func0() 的返回地址\
    \ | |\n| %RSP | 0x10001000 | 0x10001000 | 0x10001000 | 0x10001000 |\n\n**图 10-3.**\
    \ 函数序言的内存布局示例\n\n## 原始栈（无局部变量和函数参数）\n\n现在我们可以理解在原始栈上出现的额外数据（在第 9 章项目 \"SimpleStack\"\
    \ 中看到的返回地址之前的函数调用之前与之前的 %RSP 相等的 %RBP）：\n\n```bash\n(gdb) info registers $rsp\
    \ $rbp\nrsp 0x7fffffe500 0x7fffffe500\nrbp 0x7fffffe500 0x7fffffe500\n(gdb) x/10a\
    \ $rsp\n```\n\n0x7fffffe500: 0x7fffffe510 0x55555555164 <func2+14>\n0x7fffffe510:\
    \ 0x7fffffe520 0x55555555153 <func+14>\n0x7fffffe520: 0x7fffffe540 0x5555555513e\
    \ <main+25>\n0x7fffffe530: 0x7fffffe628 0x0100000\n0x7fffffe540: 0x55555555170\
    \ <libc_c_init>\n0x7fffffe2c09b <libc_main+235>\n\n(gdb) disass func\nfunc 的汇编代码：\n\
    \n```assembly\n0x00000000555555516 <0>:    push %rbp\n0x00000000555555517 <1>:\
    \    mov %rsp,%rbp\n0x0000000055555551a <4>:    mov $0x0,%eax\n0x0000000055555551f\
    \ <9>:    call 0x55555555167 <func2>\n0x00000000555555164 <14>:   nop\n0x00000000555555165\
    \ <15>:   pop %rbp\n0x00000000555555166 <16>:   retq\n```\n汇编导出结束。\n\n(gdb) disass\
    \ func\nfunc 的汇编代码：\n\n```assembly\n0x00000000555555145 <0>:    push %rbp\n0x00000000555555146\
    \ <1>:    mov %rsp,%rbp\n0x00000000555555149 <4>:    mov $0x0,%eax\n0x0000000055555514e\
    \ <9>:    call 0x55555555156 <func2>\n0x00000000555555153 <14>:   nop\n0x00000000555555154\
    \ <15>:   pop %rbp\n0x00000000555555156 <16>:   retq\n```\n汇编导出结束。\n\n(gdb) disass\
    \ main\nmain 的汇编代码：\n\n```assembly\n0x00000000555555125 <0>:    push %rbp\n0x00000000555555126\
    \ <1>:     mov %rsp,%rbp\n=> 0x00000000555555130 <11>:  mov $0x1,-04(%rbp)\n0x00000000555555133\
    \ <25>:  mov -04(%rbp),%eax\n0x00000000555555137 <18>:  mov $0x1,-08(%rbp)\n0x00000000555555141\
    \ <28>:  add %eax,-08(%rbp)\n0x00000000555555144 <31>:  add $0x1,-04(%rbp)\n0x00000000555555148\
    \ <35>:  mov -0x8(%rbp),%eax\n0x000000005555551b <38>:  imul -04(%rbp),%eax\n\
    0x0000000055555514f <42>:  mov %eax,-08(%rbp)\n0x00000000555555152 <45>:  mov\
    \ $0x0,%eax\n0x00000000555555157 <50>:  pop %rbp\n0x00000000555555158 <51>:  retq\n\
    ```\n\n## 函数尾声 (Function Epilogue)\n\n在函数返回调用者之前，它必须恢复之前存在栈上的 %RSP 和 %RBP 值，以便正确寻址。这系列指令被称为函数尾声（function\
    \ epilogue），如图 10-4 所示。与 `mov %rbp,%rsp` 和 `pop %rbp` 序列相比，`leave` 指令的功能相同但占用的空间更小。\n\
