    # Register Review


    So far, we have seen and used general-purpose CPU registers:


    +   * %RAX (among its specific uses is to contain function return values)

    * %RBX

    * %RCX

    * %RDX


    We also have special-purpose registers:


    +   * %RIP (Instruction Pointer)

    * %RSP (Stack Pointer)


    AMD64 and Intel EM64T architectures introduced additional general-purpose registers:
    %R8, %R9, %R10, %R11, %R12, %R13, %R14, %R15.

    These additional registers are used a lot in the x64 code. More general-purpose
    registers allow faster code execution because temporary'
