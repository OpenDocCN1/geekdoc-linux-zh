    # Function Prolog and Epilog\n\nNow, before we try to make sense of the FunctionParameters\
    \ disassembly, we look at the simple case of one function parameter and one local\
    \ variable to illustrate the standard function prolog and epilog sequence of instructions\
    \ and corresponding stack memory changes.\n\nThe function prolog is illustrated\
    \ in Figure 11-2, and the function epilog is illustrated in Figure 11-3.\n\nFigure\
    \ 11-2. Memory layout for the prolog with one function parameter and one local\
    \ variable\n\nHere, the function parameter is passed via the %RDI register. It\
    \ is saved on the stack the register may be used later in calculations or function\
    \ passing to other functions. Generally, the function’s first six parameters are\
    \ passed via %RDI, %RSI, %RCX, %R8, and %R9 registers from left right when parameters\
    \ are quadwords like pointers or long values via %EDI, %ESI, %EDX, %ECX, %R8D,\
    \ and %R9D when parameters are doublewords like integers. Additional parameters\
    \ are passed via the stack locations using the P instruction.\n\n| | | | |\n|---|---|---|---|\n\
    | %RSP → | 0 | 0 | 0 |\n| | 1 | 1 | 1 |\n| | 0 | 0 | 0 |\n| %RBP → | Previous\
