    ## CHAPTER 7 LOGICAL INSTRUCTIONS


    ### Instruction Format


    We have seen that assembly instructions have uniform format:


    ```

    Opcode source_operand, destination_operand

    ```


    Operands can be registers (reg), memory references (mem), or some numbers called
    immediate values (imm). Typical examples:


    ```

    inc mem/reg

    dec mem/reg

    add reg/imm, mem/reg

    ```


    and some concrete examples:


    ```

    inc (%rax)

    decl a

    addl $0x10,(rax)

    addq a,(rax)

    ```


    ### Logical Shift Instructions


    In addition to arithmetic instructions, there are so-called shift instructions
    that just shift a bit string to the left or the right.


    Shift to the left:


    ```

    11111111 -> 11111110 ; shift by 1

    11111110 -> 11110000 ; shift by 3

    shl imm/reg, mem/reg

    shl $1,%rax

    shl $2,(rax)

    ```


    Shift to the right:


    ```

    11111111 -> 01111111 ; shift by 1

    01111111 -> 00001111 ; shift by 3

    shr imm/reg, mem/reg

    shr $1,%rax

    shr $2,%rax)

    ```


    ### Logical Operations


    Here, we recall logical operations and corresponding truth tables. We abbreviate
    True as T and False as F.


    | AND | OR |

    | :--- | :--- |

    | 1 and 1 = 1 (T) | 1 or 1 = 1 (T) |

    | 1 and 0 = 0 (F) | 1 or 0 = 1 (T) |

    | 0 and 1 = 0 (F) | 0 or 1 = 1 (T) |

    | 0 and 0 = 0 (F) | 0 or 0 = 0 (F) |


    ### Zeroing Memory or Registers


    There are several ways to put a zero value into a register or a memory location:


    1. Move a value:


    ```

    mov $0, a

    mov $0,%rax

    mov $0,%eax

    ```


    2. Use the XOR (Exclusive OR) logical operation:


    ```

    xor %rax,%rax

    xor %eax,%eax

    ```


    ### XOR


    | XOR |

    | :--- |

    | 1 xor 1 = 0 (T xor = F) |

    | 1 xor 0 = 1 (T xor F = T) |

    | 0 xor 1 = 1 (F xor T = T) |

    | 0 xor 0 = 0 (F xor F = F) |


    This operation clears its destination operand because the source operand is the
    same, and the same bits are cleared.


