    # Stack Implementation in Memory


    The CPU %RSP register (Stack Pointer) points to the top of a stack. As shown in
    Figure 9-2, a stack grows toward lower memory addresses with every push instruction,
    and this is implemented as the %RSP register decrements by eight. We can read
    the top stack value using the following instruction:


    ```

    mov (%rsp), %rax

    ```'
