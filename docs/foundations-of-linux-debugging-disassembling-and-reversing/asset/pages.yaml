  md: '# Registers Revisited


    %RAX, %RBX, %RCX, and %RDX 64-bit registers can be used as pointers to memory.
    They contain x86 32-bit registers %EAX, %EBX, %ECX, and %EDX. These 32-bit parts
    contain 16-bit registers %AX, %BX, %CX, and %DX (each can hold a word). The %CX
    register was often used as a loop counter, (Counter)X, in the assembly language
    corresponding to simple loops in C and C++ code:


    ```

    for (int i = 0; i < N; ++i)

    ```


    but modern C and C++ compilers may choose to use any other register or even a
    memory location for such purpose.


    # NULL Pointers


    Addresses 0x0000000000000000–0x000000000000FFFF are specifically made inaccessible
    on Linux. The following code will force an application crash or kernel panic if
    executed inside a driver:


    ```

    mov $0xF, %rax

    movb $1, (%rax) # Access violation

    ```


    # Invalid Pointers


    There are different kinds of invalid pointers that cause an access violation when
    we try to dereference them:


    +   - NULL pointers

    - Pointers to inaccessible memory

    - Pointers to read-only memory when writing'
