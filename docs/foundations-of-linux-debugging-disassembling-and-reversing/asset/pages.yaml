  md: '# LEA (Load Effective Address)


    The following instruction


    ```

    lea    -0x8(%rbp),%rdx

    ```


    is equivalent to the following arithmetic sequence:


    ```

    mov    %rbp,%rdx

    add    -0x8,%rdx

    ```


    The following instruction


    ```

    lea    0ea9(%rip),%rdi

    ```


    is equivalent to the following arithmetic sequence:


    ```

    mov    %rip,%rdi

    add    0xea9,%rdi

    ```


    # Passing Parameters


    The first six function parameters from left to right


    %RDI, %RSI, %RDX, %RCX, %R8, and %R9


    > Note Although we haven''t seen examples for more than six function parameters,
    they are passed via the stack, for example, via the PUSH instruction.


    Static/global variable address (or string constant)


    ```

    mov    $0x555555555604, reg

    lea    0xe9d(%rip), reg

    ```'
