  md: '# CHAPTER 6 POINTERS TO MEMORY


    The layout of memory before movb instruction execution is shown in Figure 6-1,
    and the layout of memory after execution is shown in Figure 6-2.


    ```

    movw $0FF, (%rax)

    movl $0FF, (%rax)

    movq $0FF, (%rax)

    ```


    We need to prefix 0FF with $ to differentiate it from 0FF as a memory address.


    The layout of memory after the execution of the movl instruction is shown in Figure
    6-3. We can see that, although we specify a byte value 0FF as a source operand
    to the movl instruction, it replaces all other 3 bytes of a doubleword in memory
    because we specify the destination as a pointer to 4 bytes, and 0FF is 0x00000FF
    as a doubleword. So we need to specify the 1 suffix to disambiguate moving a doubleword
    value from moving a byte value. The compiler complains if we forget and use mov:


    Error: no instruction mnemonic suffix given and no register operands; can''t size
    instruction


    Because 64-bit (quadword) registers may point to quadword memory cells, we need
    to specify q to disambiguate moving a quadword value from moving a byte value
    if we specify a constant with all leading zeros:


    ```

    movq $0x0000000000000FF, (%rax)

    ```


    However, if we want to move a value only, we need to specify the w suffix:


    ```

    movw $0FF, (%rax)

    ```'
