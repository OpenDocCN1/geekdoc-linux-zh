  md: '# Function Prolog


    The sequence of instructions resulting in the initialization of the %RBP register
    and making room for local variables is called the function prolog. One example
    of it is Figure 10-3, where func calls func2, which has one local variable var.
    Sometimes, saving necessary registers is also considered as part of a function
    prolog.


    ```

    func() { func2(); };

    func2() { long var; }

    call func2

    npush %rbp

    mov %rsp, %rbp

    ```


    |   |   |   | %0x8 | %rsp |

    |---|---|---|---|---||

    | 0 |   | %RSP %RBP | Previous %RBP | Previous %RBP |

    | 0 | %RSP | Return address to func0() | Return address to func0() | |

    | %RSP | 0x10001000 | 0x10001000 | 0x10001000 | 0x10001000 |


    **Figure 10-3.** Example memory layout for function prolog


