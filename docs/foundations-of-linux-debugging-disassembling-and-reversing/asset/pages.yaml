  md: '# CHAPTER 1 MEMORY, REGISTERS, AND SIMPLE ARITHMETIC


    In the C or C++ language, we can write this using three possible ways:


    a = a + 1;


    ++a;


    a++;


    b = b - 1;


    --b;


    b--;


    In assembly language, we use instructions INC and DEC and write


    ```

    incl a

    inc %eax

    decl %eax

    dec %eax

