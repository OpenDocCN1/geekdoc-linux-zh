    # # Function Return Value


    Many functions return values via the %RAX register. For example:


    long func();


    The return value is in %RAX.


    bool func();


    The return value is in %EAX.

    Although bool values occupy one byte in memory, the compiler may use %EAX instead
    of %AL.


    # # Using Byte Registers


    Suppose we have a byte value in the %AL register, and we want to add this value
    to the %ECX register. However, we do not know what values other parts of the full
    %EAX register contain. We cannot use this instruction, for example:


    ```

    MOV  %AL, %EBX      # operand size conflict

    ```


    The proposed solution in pseudo-code:


    ```

    AL -> EBX          AL -> EAX

    ECX + EBX -> ECX    ECX + EAX -> ECX

    ```


    146'
