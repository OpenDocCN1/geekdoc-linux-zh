  md: '# Application Memory Simplified


    When an executable file is loaded into memory, its header and sections are mapped
    to memory pages. Some data and code are copied unmodified, but some data is initialized
    and expanded. The first stack is also created at this stage. The %RIP register
    is set to point to the first program instruction, and %RSP points to the top of
    the stack. This simplified process is shown in Figure 9-4.


    ![](img/4ff2512aa382b04d8584e9e1f6cd8896_114_0.png)


    **Figure 9-4.** Application memory layout


    # Stack Overflow


    By default, the stack size is limited (system and limit dependent, and on our
    system, it is 8192Kb or 8388608 bytes). If a stack grows beyond the reserved limit,
    a stack overflow occurs (segmentation fault). It can be caused by an unlimited
    recursion, deep recursion, or very large local variables:'
