  md: '# “Pointers” Project: Calculations


    In order to understand pointers better from a low-level assembly language perspective,
    we perform our old arithmetic calculations from Chapter 1 using pointers to memory
    instead of direct memory addresses:


    ```

    address a -> rax

    1 -> (rax)

    address b -> rbx

    1 -> (rbx)

    (rbx) + (rax) -> (rbx)

    (rax) + 1 -> (rax)

    (rbx) * (rax) -> (rbx)

