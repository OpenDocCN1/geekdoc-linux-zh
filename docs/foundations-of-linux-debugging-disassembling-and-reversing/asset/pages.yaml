  md: '# CHAPTER 10


    # Frame Pointer andnLocal Variables


    # Stack Usage


    In addition to storage for return addresses of CALL instructions, a stack is used
    to pass additional parameters to functions and store local variables. The stack
    is also used to save and restore values held in registers when we want to preserve
    them during some computation or across function calls. For example, suppose we
    want to multiplication, but at the same time, we have other valuable data in registers
    %RAX and %RDX. The multiplication result will overwrite %RAX and %RDX values,
    and we temporarily put their values on stack:


    ```

    mov    $10, %rax

    mov    $20, %rdx

    ...

    ...

    ...

    push   %rax          ; now we want to preserve %RAX and %RDX

    push   %rdx

    imul   %rdx         ; %RDX and %RAX contain the result of

    %RAX*%RDX

    ```'
  merge: -1
  pgno: 125
- img_proc: true
  md: 'CHAPTER 10 FRAME POINTER AND LOCAL VARIABLES


    mov %rax, result

    pop %rdx ; pop in reverse order

    pop %rax ; stack is LIFO


    #  Register Review


    So far, we have encountered these general-purpose registers:


    +   * %RAX (among its specific uses are to contain function return values and
    the lower part of a multiplication result)

    * %RBX

    * %RCX (among its specific uses is a loop counter)

    * %RDX (among its specific uses is to contain the higher part of a multiplication
    result if it exceeds the maximum 64-bit value)

    * %RIP (Instruction Pointer, points to the next instruction to be executed)

    * %RSP (Stack Pointer, points to the top of the stack)


    We come to the next important register on Linux platforms called Base register
    or sometimes as Stack Frame Pointer register %RBP.


    # Addressing Array Elements


    We can consider stack memory as an array of memory cells, and often the %RBP is
    used to address stack memory elements in the way shown in Figure 10-1, where it
    slides into the frame of stack memory called a stack frame. The first diagram
    depicts 64-bit (quadword) memory cells, and the second depicts 32-bit (doubleword)
    memory cells.'
