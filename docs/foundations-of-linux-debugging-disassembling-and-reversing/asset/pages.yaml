    # Function Prolog and Epilog


    Now, before we try to make sense of the FunctionParameters project disassembly,
    we look at the simple case of one function parameter and one local variable to
    illustrate the standard function prolog and epilog sequence of instructions and
    corresponding stack memory changes.


    The function prolog is illustrated in Figure 11-2, and the function epilog is
    illustrated in 11-3.


    ![](img/4ff2512aa382b04d8584e9e1f6cd8896_140_0.png)


    Figure 11-2. Memory layout for the prolog with one function parameter and one
    local variable


    Here, the function parameter is passed via the %RDI register. It is saved on the
    stack the register may be used later in calculations or function parameter passing
    to other functions. Generally, the function’s first six parameters are passed
    via %RDI, %RSI, %RCX, %R8, and %R9 registers from left to right when parameters
    are quadwords like pointers or long values via %EDI, %ESI, %EDX, %ECX, %R8D, and
    %R9D registers when parameters are doublewords like integers. Additional parameters
    are passed via the stack locations using the P instruction.


    132'
