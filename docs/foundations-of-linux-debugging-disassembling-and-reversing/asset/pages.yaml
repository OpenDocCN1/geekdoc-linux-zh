    # CMP – Compare Two Operands


    This instruction compares the first operand with the second and sets flags (including
    ZF) according to the computed result (which is discarded). The comparison is performed
    by subtracting the first operand from the second (like the SUB instruction: sub
    $4, %eax).


    CMP reg/imm, reg/mem

    CMP reg/mem/imm, reg


    Examples:


    CMP $0, %EDI


    Suppose %EDI contains 0:


    0 - 0 == 0 (ZF is set)


    CMP $0x16, %EAX


    Suppose %EAX contains 4hex:


    | 4hex - 16hex = FFFFFFhex | != 0 (ZF is cleared) |

    | 4dec - 22dec = -18dec |


    Here is the CMP instruction in pseudo-code (details not relevant to the ZF bit
    are omitted):


    ```

    OPERAND2 - OPERAND1 -> TEMP

    IF TEMP = 0 THEN

    ```'
