    # # Function Epilogue


    Before the function code returns to the caller, it must restore the previous values
    of %RSP and %RBP registers to allow the caller to resume its execution from the
    correct address, previously saved on the stack, and to continue addressing its
    stack frame properly. This sequence of instructions is called the function epilogue,
    and it is shown in Figure 10-4.


    ![](img/4ff2512aa382b04d8584e9e1f6cd8896_131_0.png)


    **Figure 10-4.** Example layout for function epilogue


    Instead of the mov %rbp,%rsp and pop %rbp sequence of instructions, we may see
    the leave instruction, which does the same but occupies less code space.'
