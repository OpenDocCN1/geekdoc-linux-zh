  md: 'Other pointers may or may not cause an access violation, and some of them are
    discussed in subsequent chapters:


    +   - Pointers pointing to “random” memory


    +   - Uninitialized pointers having random value inherited from past code execution


    +   - Dangling pointers


    The latter pointers are similar to pointers pointing to “random” memory locations
    and arise when we forget to set pointer variables to zero (NULL) after disposing
    of the memory they point to. By nullifying pointers, we indicate that they no
    longer point to memory.


    # Variables As Pointers


    Suppose we have two memory addresses (locations) “a” and “b” declared and defined
    in C and C++ as


    ```

    int a, b;

    ```


    These are normal variables “a” and “b.” Also, we can have another memory addresses
    (locations) “pa” and “pb” declared and defined in C and C++ as


    ```

    int *pa, *pb;

    ```


    Here, pa is a pointer to an int, or in other words, the memory cell pa contains
    the address of another memory cell that contains an integer value.'
