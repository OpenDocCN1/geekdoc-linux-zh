    # Logical Instructions and RIP


    # Instruction Format


    We have seen that assembly language instructions have uniform format:


    ```

    Opcode operand

    Opcode source_operand, destination_operand

    ```


    Operands can be registers (reg), memory references (mem), or some numbers, called
    immediate values (imm). Typical notational examples:


    ```

    inc mem/reg

    dec mem/reg

    add reg/imm, mem/reg

    add mem/imm, reg

    ```


    and some concrete assembly language examples:


    ```

    inc (%rax)

    decl a

    addl $0x10, (%rax)

    addq a, (%rax)

    ```'
