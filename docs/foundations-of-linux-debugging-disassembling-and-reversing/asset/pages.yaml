    # # TEST – Logical Compare


    This instruction computes bitwise logical AND between both operands and sets flags
    (including ZF) according to the computed result (which is discarded):


    TEST reg/imm, reg/mem


    Examples:


    TEST %EDX, %EDX


    Suppose the %EDX register contains 4 ($100_{bin}$):


    $100_{bin}$ AND $100_{bin} = 100_{bin}$ \!= 0 (ZF is cleared)


    TEST $1, $EDX


    Suppose %EDX contains 0 ($0_{bin}$):


    $0_{bin}$ AND $1_{bin} = 0_{bin}$ == 0 (ZF is set)


    Here is the TEST instruction in pseudo-code (details not relevant to the ZF bit
    are omitted):


    ```

    TEMP := OPERAND1 AND OPERAND2

    ```


    142'
