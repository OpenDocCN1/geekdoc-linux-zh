- img_proc: true
  md: 'We can only use MOV instructions that have the same operand size for both source
    and destination, for example:


    ```

    MOV %AL, %BL

    MOV %AL, b      # in C: static bool b = func();

    ```


    For this task, there is a special MOVZX (Move with Zero eXtend) instruction that
    replaces the contents of the second operand with the contents of the first operand
    while filling the rest of the bits with zeros:


    ```

    MOVZX reg/mem, reg

    ```


    Therefore, our solution for the task becomes very simple:


    ```

    MOVZX %AL, %EBX

    ADD %EBX, %ECX

    ```


    We can also reuse the %EAX register:


    ```

    MOVZX %AL, %EAX

    ADD %EAX, %ECX

    ```


