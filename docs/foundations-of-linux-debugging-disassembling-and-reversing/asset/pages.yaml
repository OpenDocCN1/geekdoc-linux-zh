  md: '# TEST or CMP?


    Both instructions are equivalent if we want to test for zero, but the CMP instruction
    affects flags than TEST:


    ```

    TEST %EAX, %EAX

    CMP $0, %EAX

    ```


    The CMP instruction is used to compare for inequality (the TEST instruction cannot
    be used here):


    ```

    CMP $0, %EAX # > 0 or < 0 ?

    ```


    The TEST $2, %EAX # 2 == 0010bin or in C language: **if (var & 0x2)** Examples
    where %EAX has the value of 2:


    ```

    TEST $4, %EAX # 0010bin AND 0000bin (ZF is set)

    TEST $6, %EAX # 0010bin AND 0110bin = 0010bin (ZF is cleared)

    ```


