- img_proc: true
  md: '# Pointer Initialization


    In order to have pointers to point to memory, we need to initialize them with
    corresponding memory addresses. Here is typical C or C++ code that does what we
    need:


    ```

    int a;              // uninitialized variable

    int *pa;             // uninitialized pointer

    pa = &a;             // (pa) now contains the address a

    int b = 12;         // initialized variable

    int *pb = &b;        // initialized pointer

    ```


    We see that pointers are also variables and can change their values effectively
    pointing to different memory locations during program execution.


    # Initialized and Uninitialized Data


    Here is a bit of additional information about initialized and uninitialized variables
    that is useful to know: an executable program in Linux is divided into different
    sections. One is called data, where all global and static variables (including
    pointers) are put.


    Consider this C or C++ data definition:


    ```

    int array[1000000]; // size 4,000,000 bytes or 3.8Mb

    ```


    We would expect the size of an executable file to be about 4Mb. However, the program
    size on a disk is only 16Kb. It is because the uninitialized array contains only
    information about its size. When we launch the program, this array is recreated
    from its size information and filled with zeroes. The size of the program in memory
    becomes about 4Mb.'
