    # Call Stack


    If one function (the caller) calls another function (the callee) in C and C++,
    the resulting code is implemented using the CALL instruction, and during its execution,
    the return address is saved on the stack. If the callee another function, the
    return address is also saved on the stack, and so on. Therefore, we have the so-called
    call stack of return addresses. Let us see this with a simple but trimmed-down
    example.


    Suppose we have three functions with their code occupying the following addresses:


