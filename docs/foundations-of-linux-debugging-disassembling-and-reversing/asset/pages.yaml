- img_proc: true
  md: '# Logical Shift Instructions


    In addition to arithmetic instructions, there are so-called logical shift instructions
    that just shift a bit string to the left or the right.


    Shift to the left:


    ```

    11111111 -> 11111110 ; shift by 1

    11111110 -> 11110000 ; shift by 3

    shl imm/reg, mem/reg

    shl $1, %rax

    shlb $2, (%rax)

    ```


    Shift to the right:


    ```

    11111111 -> 01111111 ; shift by 1

    01111111 -> 00001111 ; shift by 3

    shr imm/reg, mem/reg

    shr $1, %rax

    shr $2, (%rax)

    ```


    # Logical Operations


    Here, we recall logical operations and corresponding truth tables. We abbreviate
    True as T and False as F.


    AND

    1 and 1 = 1 T and T = T

    1 and 0 = 0 T and F = F

    0 and 1 = 0 F and T = 0

    0 and 0 = 0 F and F = F'
