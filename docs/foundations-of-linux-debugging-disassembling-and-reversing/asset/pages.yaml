  md: '# CHAPTER 1


    # Memory, Registers, and Simple Arithmetic


    # Memory and Registers Inside an Idealized Computer


    Computer memory consists of a sequence of memory cells, and each cell has a unique
    address (location). Every cell contains a "number." We refer to these "numbers"
    as contents at addresses (locations). Because memory access is slower than arithmetic
    instructions, there are so-called registers to speed up complex operations that
    require memory to store temporary results. We can also think about them as stand-alone
    memory cells. The name of a register is its address. Figure 1-1 illustrates this
    concept.'
  merge: -1
