- img_proc: true
  md: '# Preface


    The book covers topics ranging from Intel x64 assembly language instructions and
    writing programs in assembly language to pointers, live debugging, and static
    binary analysis of compiled C and C++ code.


    Diagnostics of core memory dumps, live and postmortem debugging of Linux applications,
    services, and systems, malware, and vulnerability analysis require an understanding
    of x64 Intel assembly language and how C and C++ compilers generate code, including
    memory layout and pointers. This book is about background knowledge and practical
    foundations that are needed to understand internal Linux program structure and
    behavior, start working with the GDB debugger, and use it for disassembly and
    reversing. It consists of practical step-by-step exercises of increasing complexity
    with explanations and many diagrams, including some necessary background topics.


    By the end of the book, you will have a solid understanding of how Linux C and
    C++ compilers generate binary code. In addition, you will be able to analyze such
    code confidently, understand stack memory usage, and reconstruct original C/C++
    code.


    The book will be useful for


    +   - Software technical support and escalation engineers


    +   - Software engineers coming from JVM background


    +   - Software testers


    +   - Engineers coming from non-Linux environments, for example, Windows or Mac
    OS X'
  merge: -1
