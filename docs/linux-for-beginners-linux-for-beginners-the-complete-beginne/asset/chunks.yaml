    # 最适合初学者的 Linux 发行版


    最后更新于 2020 年 11 月 28 日，作者：Aquil Roshan，298 条评论


    快速介绍：它更新简单直观，提供极佳的用户体验，并预装了重要的更新以帮助你快速上手。当然，Ubuntu 在几年前主导了 Linux 体验的简化，这就是为什么尽管现在有许多新的
    Linux 发行版，它依然如此受欢迎的原因。


    与其他一些非基于 Ubuntu 的 Linux 发行版相比，Ubuntu 提供了一种非常现代方便的安装方式，并确保了良好的硬件兼容性。


    原版 Ubuntu 基于 GNOME 桌面。尽管它很易用，但如果你是从 Windows 平台过来的，它可能不是一个熟悉的界面。在这种情况下，你可以尝试一些正统的
    Ubuntu 版本，如 `Kubuntu`、`Lubuntu`，以获得类似 Windows 的用户界面。


    Ubuntu 拥有优秀的文档和网络社区支持。Ubuntu 论坛和 `Ask Ubuntu` 在 Ubuntu 的几乎所有方面都提供了巨大的帮助。你可以轻松地找到常见问题的解决方案，即使你遇到了新问题，网络也会帮助你排查故障。


    面对现实吧，Linux 对新用户来说可能具有很强的复杂性。这种复杂性并非 Linux 本身带来的，而是这种“新奇感”造成的。这不是怀旧，想起我第一次接触 Linux
    时，我甚至认不出它是什么。我喜欢它，但首先对我来说，这就像是一次逆水行。


    现在不知道从何下手可能会令人沮丧。特别是对于一个没有习惯在家庭 Windows 之外运行其他程序的人来说。


    让新手感到困惑的第一点是，Linux 并不总是单一的操作系统。有数百种 Linux 发行版。我们已经解释过为什么会有这么多 Linux，所以我就不再重复了。


    以下是根据特定标准详细更新的一些 Linux 发行版列表：


    * 适用于 Windows 的卓越 Linux 发行版

    * 优秀的轻量级 Linux 发行版

    * 用于黑客的 Linux 发行版

    * 用于游戏的 Linux 发行版

    * 良好的隐私和匿名性 Linux 发行版

    * 看起来像 MacOS 的 Linux 发行版


    同样，还有一些发行版主要迎合学习者的需求。因此，我们将关注这些选项。


    ## 适合新手的优秀 Linux 发行版


    请注意，此列表没有顺序。编写此列表的主要标准是安装的简单性、开箱硬件支持、易用性以及软件应用程序的可用性。


    ### 1. Ubuntu


    * 简洁现代

    * 特有的用户体验

    * 通过软件中心提供大量的软件程序

    * 预装核心软件


    你一定听过 `Ubuntu` ——无论如何。它是世界上最流行的 Linux 发行版。不仅限于服务器，也是 Linux 最受欢迎的桌面选择。


    它简单易，提供极佳的用户体验，并预装了重要的更新以帮助你快速上手。当然，Ubuntu 在几年前主导了 Linux 体验的简化，这就是为什么尽管现在有许多令人惊讶的
    Linux 发行版，它依然如此著名。


    Ubuntu 提供了一种方便的设置方法，与其他几个非基于 Ubuntu 的 Linux 发行版相比，确保了良好的硬件兼容性。


    原版 Ubuntu 基于 `GNOME` 桌面。尽管它很简单，但如果你是从 Windows 平台过来的，它可能不是一个熟悉的界面。如果是这样，你可以尝试一些正统的
    Ubuntu 版本，如 `Kubuntu`、`Lubuntu`，以获得类似 Windows 的用户界面。


    Ubuntu 拥有著名的文档和网络帮助。Ubuntu 论坛和 `Ask Ubuntu` 在 Ubuntu 的几乎所有方面都提供了极佳的帮助。你可以轻松地找到常见问题的答案，即使你注意到某些新事物，网络也会帮助你排查故障。


    ### 2. Linux Mint


    * 与 Windows 相似的用户界面

    * 在旧硬件上表现出色

    * 相比 Ubuntu 有某些改进


    `Linux Mint` 可能是最适合初学者的顶级基于 Ubuntu 的 Linux 发行版。当然，它基于 `Ubuntu`，所以你可以预见到使用 Ubuntu
    的相同优点。但是，它没有使用 `GNOME`，而是提供了独特的环境，如 `Cinnamon`、`Xfce` 和 `MATE`。事实上，Linux Mint
    在某些方面做得比 Ubuntu 更好。


    不仅是熟悉的用户界面，这对 Windows 用户来说也是一个优势。它以极低的硬件要求提供了令人印象深刻的整体性能，特别是在使用 `Xfce` 或 `MATE`
    环境时。


    它还使用与 `Ubuntu` 相同的软件源。你无需担心软件供应。


    `Linux Mint` 是一个非常色的类 Windows 发行版。因此，如果你不再想要完全独特的界面（如 `Ubuntu`），`Linux Mint` 是一个不错的选择。


    最流行的建议是 `Linux Mint Cinnamon` 版本。不过，你可能会找到你喜欢的其他。此外，你可能想通过 USB 启动 `Linux Mint
    20`。


    ### 3. Zorin OS


    * Windows 风格的用户界面

    * 直观的用户体验

    * 简洁

    * 带有许多预设软件的完整版以及适用于旧旧电脑的 Lite 版本


    `Zorin OS` 是另一个卓越的 Linux 发行版，它提供了与 Windows 类似的用户界面。虽然不是最流行的选择，但作为一个主要基于 Ubuntu
    的发行版，它非常适合初学者，同时也赋予了许多酷炫的功能。


    `Zorin OS` 是一个基于 Ubuntu 的发行版，但感觉非常精美。在我看来，它完美地为需要相似外观和体验但又想要惊艳效果的前 Windows 用户量身定制的。


    难怪 `Zorin OS` 是可用最惊的 Linux 发行版之一。


    如果你需要所有预装的“礼物”（游戏、办公套件和一些额外功能），`Zorin OS` 的最后一个版本是值得花的。然而，免费版也同样吸引人。


    你还会发现一个“Lite”版本，适用于需要重生的老旧硬件。


    ### 4. Basic OS


    * macOS 风格的用户界面

    * 特别注重个性化体验

    * 简单


    既然我上面提到了一个漂亮的 Linux 发行版，`Basic OS` 实际上是最受欢迎的 `8504ca0e3fb5bfcdbdf1e8263f0c30ef`
    Linux 发行版，它的灵感源自 `macOS`。

