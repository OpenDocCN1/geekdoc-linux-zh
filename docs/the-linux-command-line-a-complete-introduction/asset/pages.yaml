  md: 'developers wanting portable applications wrote to the lowest common denominator.
    Unix systems have a very elaborate way of dealing with terminals and their different
    display features. Since the developers of Readline could not be sure of the presence
    of a dedicated extra control key, they invented one and called it meta. While
    the ALT key serves as the meta key on modern keyboards, you can also press and
    release the ESC key to get the same effect as holding down the ALT key if you''re
    still using a terminal (which you can still do in Linux!).


    # Completion


    Another way that the shell can help you is through a mechanism called completion.
    Completion occurs when you press the TAB key while typing a command. Let''s see
    how this works. Say your home directory looks like this:


    ```

    [me@linuxbox ~$ ls-output.txt Pictures Templates Videos

    Documents Music Public

    ```


    Try typing the following but don''t press the ENTER key:


    ```

    [me@linuxbox ~$ ls 1s

    ```


    Press the TAB key:


    ```

    [me@linuxbox ~$ ls 1s-output.txt

    ```


    See how the shell completed the line for you? Let''s try another one. Again, don''t
    press ENTER:


    ```

    [me@linuxbox ~$ ls 1 D

    ```


    Press TAB:


    ```

    [me@linuxbox ~$ ls 1 D

    ```


    No completion—just a beep. This happened because D matches more than one entry
    in the directory. For completion to be successful, the “clue” you give has to
    be unambiguous. We can go further:


    ```

    [me@linuxbox ~$ ls 1 Do

    ```


    Then press TAB:


    ```

    [me@linuxbox ~$ ls 1s Documents

    ```


    The completion is successful.'
  merge: -1
