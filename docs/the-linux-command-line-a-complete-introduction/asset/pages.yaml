- pgno: 309
  md: "Again, printf is used mostly in scripts, where it is employed to format tabular\
    \ data, rather than on the command line directly. But we can still show how it\
    \ can be used to solve various formatting problems. First, let's output some fields\
    \ separated by tab characters:\n\n```\n@linux]$ printf \"%s\\s%s\\n\" str1 str2\
    \ str3\nstr1      str2      str3\n```\n\nBy inserting \\t (the escape sequence\
    \ for a tab), we achieve the desired effect. Next, some numbers with next formatting:\n\
    \n```\n@linuxbox ~$ printf \"Line: %0d %15.3f Result: %+15d\\n\" 1071 3.1415265\n\
    32589\nLine: 01071               +32589\n```\n\nThis shows the effect of minimum\
    \ field width on the spacing of the fields. Or how formatting a web page?\n\n\
    ```\n<html>\n<head>\n\t\t<title></title>\n\t</head>\n<body>\n\t\t<p></p>\n</body>\n\
    </html>\n\" \"Page Title\" \"Page Content\"\n<html>\n<head>\n  <title>Page Title</title>\n\
    <body>\n  <p>Page Content</p>\n</body>\n</html>\n```\n\n# Document Formatting\
    \ Systems\n\nSo far, we have examined the simple text-formatting tools. These\
    \ are good for small, simple tasks, but what about larger jobs? One of the reasons\
    \ that Unix (aside from providing a powerful multitasking, multiuser environment\
    \ for all kinds of software development) is that it offered tools that could be\
    \ used to produce many types of documents, particularly scientific and academic\
    \ publications. In fact, the GNU documentation describes, document preparation\
    \ was instrumental to the development of Unix:\n\nThe first version of UNIX was\
    \ developed on a PDP-7 which was sitting around Bell Labs. In 1971 the developers\
    \ wanted to get a PDP-11 for further work on the operating system. In order to\
    \ justify the cost for this system, they proposed that they would implement a\
    \ document formatting system for the AT&T patents division. This first formatting\
    \ program was a reimplementation of McIlroy's mff. written by J.F. Ossanna."
  merge: -1
  img_proc: true
- pgno: 310
  md: '# The roff family TeX


    Two main families of document formatters dominate the field: those descended from
    the original roff program, including roff and troff, and those based on Donald
    Knuth''s TeX (pronounced “tek”) typesetting system. And yes, the dropped “E” in
    the middle is part of its name.


    The name roff is derived from the term run off as in, “I’ll run off for you.\
    The roff program is used to format documents for devices that use monospaced fonts,
    such as character terminals and typewriter-style printers. At the time of its
    inception, this included all printing devices attached to computers. The later
    troff program formats documents for output on typesetters, used to produce “camera-ready”
    type for commercial printing. Most computers today are able to simulate the output
    of typesetters. The roff family also includes other programs that are used to
    prepare portions of documents. These include eqn (for mathematical equations)
    and tbl (for tables).


    The TeX system (stable form) first appeared in 1989 and has, to some degree, displaced
    troff as the tool of choice for typesetter output. We won’t be covering TeX here,
    due to its complexity (there are many books about it) and the fact that it is
    not installed by default on modern Linux systems.


    > Note: For those interested in installing TeX, check out the texlive package,
    which can be found in most distribution repositories, and the LyX graphical content
    editor.


    # roff—A Document Formatting System


    roff is a suite of programs containing the GNU implementation of troff. It also
    includes a script that is used to emulate roff and the rest of the roff family
    as well.


    roff and its descendants are used to make formatted documents, they do it in a
    way that is rather foreign to modern users. Most documents today are produced
    using word processors that are able to perform both the composition and layout
    of a document in a single step. Prior to the advent of the graphical word processor,
    documents were often produced in a two-step process involving the use of a text
    editor to perform composition and formatting program were embedded in the composed
    text through the use of a markup language. The modern approach for such a process
    is the web page, which is composed using a text editor of some kind and then rendered
    by a web browser using HTML, as the markup language to describe the final page
    layout.


    We’re not going to cover groff in its entirety, as many elements of its markup
    language deal with arcane details of typography. Instead we will concentrate on
    one of its macro packages macro packages condense many of its low-level commands
    into a smaller set of high-level commands that make using groff much easier.'
  merge: -1
  img_proc: true
- pgno: 311
  md: "For a moment, let's consider the humble man page. It lives in the /usr/share/man\
    \ directory as a gzip-compressed text file. If we were to examine its uncompressed\
    \ contents, we would see the following (the man page for ls in section 1 is):\n\
    \n```\n@linuxbox $ zcat /usr/share/man/man/ls.gz | head\n. DO NOT MODIFY THIS\
    \ FILE! It was generated by help2 1.35.\n.TH LS \"1\" \"April 2008\" \"GNU coreutils\
    \ 6.10 \"User Commands\"\n.SH NAME\nls - list directory contents\n.SH SYNOPSIS\n\
    .8 ls\n\\\\FOPTION\\\\FR)... [\\\\FILE\\\\FR]... \n.SH DESCRIPTION\n\\\" Add any\
    \ additional description here\n.PP\n```\n\nCompared to the man page in its normal\
    \ presentation, we can begin to see a correlation between the markup language\
    \ and its results:\n\n```\n@linuxbox ~$ man ls | head\nLS(1) User Commands   \
    \                             LS(1)\n```\n\nNAME\nls - list directory contents\n\
    \nSYNOPSIS\nls [OPTION]... [FILE]...\n\nThis is of interest because man pages\
    \ are rendered by groff, using the mandoc macro package. In fact, we can simulate\
    \ the man command with this pipeline.\n\n```\n@linuxbox ~$ zcat /usr/share/man/man1/ls.1.gz\
    \ | groff -mandoc -T ascii |\nLS(1) User Commands                            \
    \    LS(1)\n```\n\nNAME\nls - list directory contents\n\nSYNOPSIS\nls [OPTION]...\
    \ [FILE]...\n\nHere we use the groff program with the options set to specify the\
    \ mandoc macro package and the output driver for ASCII. groff can produce output\
    \ in several formats. If no format is specified, PostScript is output by default:\n\
    \n```\n@linuxbox ~$ zcat /usr/share/man/man1/ls.1.gz | groff -mandoc | head\n\
    %IPS-Adobe-3.0\n%Creator: groff version 1.18.1\n%CreationDate: Feb 2 13:44:37\
    \ 2012\n%DocumentNeededResources: font Times-Roman\n```"
  merge: -1
