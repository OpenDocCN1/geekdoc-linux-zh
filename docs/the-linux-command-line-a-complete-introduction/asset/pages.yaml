  md: '# patch—A diff to an Original


    The patch program is used to apply changes to text files. It accepts output from
    diff and is generally used to convert older version of files into newer versions.
    Let''s consider a famous example. The Linux kernel is developed by a large, loosely
    team of contributors who submit a constant stream of small changes to the source
    code. The Linux kernel consists of several million lines of code, while the changes
    that are made by one contributor at a time are quite small. It makes no sense
    for a contributor to send each developer an entire source tree time a small change
    is made. Instead, a diff is submitted. The diff file contains the changes from
    the previous version of the kernel to the new version with the contributor''s
    changes. The receiver then uses the patch program to apply the change to his own
    source. Using diff/patch offers two significant advantages:


    +   - The diff file is very small, compared to the full size of the source tree.


    +   - The diff file concisely shows the change made, allowing reviewers of the
    patch to quickly evaluate it.


    Of course, diff/patch will work on any text file, not just source code. It would
    be equally applicable to configuration files or any other text.

    To prepare a diff file for use with patch, the GNU documentation suggests using
    diff as follows:


    ```

    diff -Naur old_file new_file > diff_file

    ```


    old_file and new_file are either single files or directories containing files.
    The x option supports recursion of a directory tree.


    Once the diff file has been created, we can apply it to patch the old file into
    the new file:


    ```

    patch < diff_file

    ```


    We''ll demonstrate with our test file:


    ```

    [me@linuxbox]$ diff -Naur file1.txt file2.txt > patchfile.txt

    [me@linuxbox]$ patch < patchfile.txt

    patching file1.txt

    [me@linuxbox]$ cat file1.txt

    b

    c

    de

    ```


    In this example, we created a diff file named patchfile.txt and then used the
    patch program to apply the patch. Note that we did not have to specify a target
    file to patch, as the diff (in unified format) already contains the filenames
    in the header. Once the patch is applied, we can see that file1.txt now matches
    file2.txt.'
  merge: -1
  img_proc: true
