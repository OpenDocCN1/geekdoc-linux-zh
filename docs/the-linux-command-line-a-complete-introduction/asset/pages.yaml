- pgno: 270
  md: '```

    [me@linuxbox] $ ls -1 / | sort -nr -k 5 | head

    -rwxi-xr-x 1 root root 8324216 2012-04-07 17:42 inkscape

    -rwxi-xr-x 1 root root 8222692 2012-04-07 17:42 inkview

    -rwxi-xr-x 1 root root 3748292 2012-05-03 23:45 gimp-2.4

    -rwxi-xr-x 1 root root 3654020 2012-08-26 16:14 quanta

    -rwxi-xr-x 1 root root 2928760 2012-09-10 14:31 gdbt

    -rwxi-xr-x 1 root root 2928756 2012-09-10 14:31 gdb

    -rwxi-xr-x 1 root root 2062236 2012-10-12 12:56 net

    -rwxi-xr-x 1 root root 2304684 2012-10-12 12:56 rpcclient

    -rwxi-xr-x 1 root root 2241832 2012-04-04 05:56 aptitude

    -rwxi-xr-x 1 root root 2202476 2012-10-10 12:56 smbcals

    ```


    Many users of sort involve the processing of tabular data, such as the table above,
    which shows the 1st command. If we apply database terminology to we would say
    that each row is a record and that each record consists of multiple fields, such
    as the file attributes, link count, filename, size and on. sort is able to process
    individual fields. In database terms, we are able to specify one or more key fields
    to use as sort keys. In the example above, we specify the n and r options to perform
    a reverse numerical sort and specify -k 5 to make sort the fifth field for the
    key sorting.


    The k option is very interesting and has many features, but we first need to talk
    about how sort defines fields. Let''s consider a very simple file consisting of
    a single line containing the author''s name:


    William Shorts


    By default, sort sees this line as having two fields. The first field contains
    the characters William and the second field contains the characters Shorts, whereas
    whitespace characters (spaces and tabs) are used as delimiters between fields
    and that the delimiters are included in the file when sorting is performed.


    Looking again at our line from 1 output, we can see that a line contains eight
    fields and that the fifth field is the file size:


    ```

    -Wxi-xr-x 1 root root 8324216 2012-04-07 17:42 inkscape

    ```


    For our next series of experiments, let''s consider the following history of three
    popular Linux distributions from 2006 to 2008. Each line in the file has three
    fields: the distribution name, the version number, and the date of release in
    MM/DD/YYYY.


    | SUSE 10.2 12/07/2006 |

    | Fedora 10 11/25/2008 |

