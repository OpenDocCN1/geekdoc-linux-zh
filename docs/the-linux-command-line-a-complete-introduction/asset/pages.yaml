- pgno: 81
  md: '# Standard Input, Output, and Error


    Many of the programs that we have used so far produce output of some kind. This
    output often consists of two types. First, we have the program’s results; that
    is, the data the program is designed to produce. Second, we have status and error
    messages that tell us how the program is getting along. If we look at a command
    like ls, we can see that it displays its results and its error messages on the
    screen.


    Keeping with the Unix theme of "everything is a file," programs as ls actually
    send their results to a special file called standard output (often expressed as
    stdout) and their status messages to another file called standard error (stderr).
    By default, both output and standard error are linked to the screen and not saved
    into a disk file.


    In addition, many programs take input from a facility called standard input (stdin),
    which is, by default, attached to the keyboard.

    /O redirection allows us to change where output goes and where input comes from.
    Normally, output goes to the screen and input comes from the keyboard, but with
    I/O redirection we can change that.


    # Redirecting Standard Output


    I/O redirection allows us to redefine where standard output goes. To redirect
    standard output to another file instead of the screen, we use the redirection
    operator followed by the name of the file. Why would we want to do this? It is
    often useful to store the output of a command in a file. For example, we could
    tell the shell to send the output of a command like ls to make the file ls-output.txt
    instead of the screen:


    ```

    [linuxbox]$ ls -1 /usr/bin > ls-output.txt

    ```


    Here, we create a listing of the /usr/bin directory and sent the results to the
    file ls-output.txt. Let’s examine the redirected output of the command:


    ```

    [linuxbox]$ ls -1 ls-output.txt

    -rw-rw-r-- 1 me 167838 2022-02-01 15:07 ls-output.txt

    ```


    Good—a nice, large, text file. If we look at the file with less, we will see that
    the file ls-output.txt does contain the results from our ls command:


    ```

    [linuxbox]$ less ls-output.txt

    ```


    Now, let’s repeat our redirection test but this time with a twist. We’ll change
    the name of the directory to one that does not exist:


    ```

    [linuxbox]$ ls -1 /bin/usr > ls-output.txt

    is: cannot access /bin/usr: directory

    ```'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'We received an error message. This makes sense because we specified the nonexistent
    directory /bin/usr, but why was the error message displayed on the screen rather
    than redirected to the file ls-output.txt? The answer is that the ls program does
    not send its error messages to standard output. Instead, like most well-written
    Unix programs, it sends its error messages to standard error. Since we redirected
    only standard output and not standard error, the error message was still sent
    to the screen. We''ll see how to redirect standard error in just a minute, but
    first, let''s look at what happened to our output:


    ```

    @@linuxbox~$ ls -l ls-output.txt

    -rw-iw-r-- 1 me 0 2012-02-01 15:08 ls-output.txt

    ```


    The file now zero length! This is because, with the > redirection operator, the
    destination file is overwritten from the beginning. Since our ls command generated
    no results and only an error message, the redirection operation started to rewrite
    the file and stopped because of the error, resulting in truncation. In fact, if
    we need to actually truncate a file (or create a new, empty file) we can use a
    trick like this:


    ```

    @@linuxbox~$ ls ls-output.txt

    ```


    Simply using the redirection operator with no command preceding it will truncate
    an existing file or create a new, empty file.

    So, how can we append redirected output to a file instead of overwriting the file
    from the beginning? For that, we use the >> redirection operator, like so:


    Using the >> operator will result in the output being appended to the file. If
    the file does not already exist, it is created just as the > operator had been
    used. Let''s put it to the test:


    ```

    @@linuxbox~$ ls -l /usr/bin >> ls-output.txt

    @@linuxbox~$ ls -l /usr/bin >> ls-output.txt

    @@linuxbox~$ ls -l /usr/bin >> ls-output.txt

    @@linuxbox~$ ls -l ls-output.txt

    -rw-iw-r-- 1 me 506344 2012-02-01 15:45 ls-output.txt

    ```


    We repeated the command three times, resulting in an output file three times large.


    # Redirecting Standard Error


    redirecting standard error lacks the ease of using a dedicated redirection operator.
    To redirect standard error we must refer to its file descriptors. A program can
    produce output on any of several numbered file streams. While'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'we have referred to the first three of these file streams as standard input,
    output, and error, the shell references them internally as file descriptors 0,
    1, and 2, respectively. The shell provides a notation for redirecting files using
    the file descriptor number. Since standard error is the same as file descriptor
    2, we can redirect standard error with this notation:


    ```

    me@linuxbox ~$ ls -1 /bin/usr 2> ls-error.txt

    ```


    The file descriptor 2 is placed immediately before the redirection operator to
    perform the redirection of standard error to the file ls-error.txt.


    # Redirecting Standard Output and Standard Error to One File


    There are cases in which we may wish to capture all of the output of a command
    to a single file. To do this, we must redirect both standard output and standard
    error at the same time. There are two ways to do this. Here, first is the traditional
    way, which works with old versions of the shell:


    ```

    me@linuxbox ~$ ls -1 /bin/usr > ls-output.txt 2&1

    ```


    Using this method, we perform two redirections. First we redirect standard output
    to the file ls-output.txt, and then we redirect file descriptor 2 (error) to file
    descriptor 1 (standard output) using the notation 2>&1.


    > Note: The order of the redirections is significant. The redirection of standard
    error must always occur after redirecting standard output or it doesn''t work.
    In the example above, > ls-output.txt 2>&1 redirects standard error to the file
    ls-output.txt, but if the order is changed to 2>&1 standard error is directed
    to the screen.


    Recent versions of bash provide a second, more streamlined method for performing
    this combined redirection:


    ```

    me@linuxbox ~$ ls -1 /bin/usr &&> ls-output.txt

    ```


    In this example, we use the single notation &> to redirect both standard output
    and standard error to the file ls-output.txt.


    # Disposing of Unwanted Output


    Sometimes silence is golden, and we don''t want to throw away a command—message.
    This applies particularly to error and status messages. The system provides a
    way to do this by redirecting output to a special file /dev/null. This file is
    a system device called a bit bucket, which accepts input and does nothing with
    it. To suppress error messages from a command, we do this:


    ```

    me@linuxbox ~$ ls -1 /bin/usr 2> /dev/null

    ```'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# /DEV/NULL IN UNIX CULTURE


    The bit bucket is an ancient Unix concept, and due to its universality it has
    appeared in many parts of Unix culture. When someone says he is sending your comments
    to "dev null," you know what it means. For more examples, see the Wikipedia article
    at http://en.wikipedia.org/wiki/Dev/null.


    # Redirecting Standard Input


    Up now, we haven''t encountered any commands that make use of standard input (actually
    we have, but we''ll reveal that surprise a little later), so we need to introduce
    one.


    # cat—Concatenate Files


    The command reads one or more files and copies them to standard input like so:


    ```

    cat [file...]

    ```


    In most cases, you can think of cat as being analogous to the TYPE command in
    DOS. You can use it to display files without paging.


    ```

    $melinuxbox ~ cat ls-output.txt

    ```


    will display the contents of the file ls-output.txt. cat is often used to display
    short files. Since cat can accept more than one file as argument, it can also
    be used to join files together. When we have downloaded a large file that has
    been split into multiple parts (multimedia files are often split this way on Usenet),
    and we want to join them back together. If the files were named movie.mpg.001
    movie.mpg.002 ... movie.mpg.009


    we will rejoin them with this command:


    ```

    $melinuxbox ~ cat movie.mpg.0 > movie.mpg

    ```


    Since wildcards always expand in sorted order, the arguments will be arranged
    in the correct order. This is all well and good, but what does this have to do
    with standard input? Nothing yet, but let''s try something else. What happens
    if we enter cat with no arguments?


    ```

    $melinuxbox ~ cat

    ```


    Nothing happens—it sits there like it''s hung. It may seem that, but it''s really
    doing exactly what it''s supposed to. If cat is not given any arguments, attached
    to standard input, and since standard input is, by default, attached to the keyboard,
    it''s waiting for us to type something!'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'Try this:


    ```

    [me@linuxbox ~]$ cat

    The quick brown fox jumped over the lazy dog.

    ```


    Next, type CTRL-D (i.e., hold down the CTRL key and press D) to tell cat that
    it has reached end-of-file EOF on standard input:


    ```

    [me@linuxbox ~]$ cat

    The quick brown fox jumped over the lazy dog.

    The quick brown fox jumped over the lazy dog.

    ```


    In the absence of filename arguments, cat copies standard input to standard output,
    we see our line of text repeated. We can use this behavior to create short text
    files. Let''s say we wanted to create a file named lazy_dog.txt containing the
    text in our example. We would do this:


    ```

    [me@linuxbox ~]$ cat > lazy_dog.txt

    The quick brown fox jumped over the lazy dog.

    ```


    Enter the command followed by the text we want to place in the file. Remember
    to type CTRL-D at the end. Using the command line, we have implemented your dumbest
    word processor! To see our results, we can use cat to copy the file to the standard
    output output:


    ```

    [me@linuxbox ~]$ cat lazy_dog.txt

    The quick brown fox jumped over the lazy dog.

    ```


    Now that we know how cat accepts standard input in addition to filename arguments,
    let''s try redirecting standard input:


    ```

    [me@linuxbox ~]$ cat < lazy_dog.txt

    The quick brown fox jumped over the lazy dog.

    ```


    With the < redirection, we change the source of standard input from the keyboard
    to the file lazy_dog.txt. We see that the result is the same as passing a single
    filename argument, but it serves to demonstrate using a file as a source of standard
    input. Other commands make better use of standard input, as we shall soon soon.


    Before we move on, check out the man page for cat, as it has several interesting
    options.


    # Pipelines


    The ability of commands to read data from standard input and send to standard
    output | (vertical bar), is utilized by a feature called pipelines. Using the
    pipe operator |, the standard output of one command can be piped into the standard
    input of another.


    ```

    command1 | command2

    ```'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'To fully demonstrate this, we are going to need some commands. Remember how
    we said there we one already knew that accepts standard input? It''s less. We
    can use less to display, page by page, the output of any command that sends its
    results to standard output:


    ```

    ~linux$ ls -1 /usr/bin | less

    ```


    This is extremely handy! Using this technique, we can conveniently examine the
    output of any command that produces standard output.


    # Filters


    Pipelines are often used to perform complex operations on data. It is possible
    to put several commands together into a pipeline. Frequently, the commands used
    this way are referred to as filters. Filters take input, change it somehow, and
    then output it. The first one we will try is sort. Imagine we want to make a combined
    list of all of the executable programs in /bin and /usr/bin, put them in sorted
    order, and view the list:


    ```

    ~linux$ ls /bin /usr/bin | sort | less

    ```


    Since we specified two directories (/bin and /usr/bin), the output of ls would
    consist of two sorted lists, one for each directory. By including sort in our
    pipeline, we changed the data to produce a single, sorted list.


    # Report or Omit Repeated Lines


    The uniq command is often used in conjunction with sort. uniq accepts a sorted
    list of data from either standard input or a single file argument (see the uniq
    man page for details) and, by default, removes any duplicates from the list. So,
    to make our list have no duplicates (that is, any programs of the same name that
    appears in both the /bin and /usr/bin directories) we add uniq to our pipeline:


    ```

    ~linux$ ls /bin /usr/bin | sort | uniq | less

    ```


    In this example, we use uniq to remove any duplicates from the sort command. If
    we want to see the list of duplicates instead, we add the -d option to uniq like
    so:


    ```

    ~linux$ ls /bin /usr/bin | sort | uniq -d | less

    ```


    # Print Line, Word, and Byte Counts


    The wc (word count) command is used to display the number of lines, words, and
    bytes counted in files. For example:


    ```

    ~linux$ wc ls-output.txt

    7902 64566 503634 ls-output.txt

    ```'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'In this case it prints three numbers: lines, words, and bytes contained in
    ls-output.txt. Like our previous commands, if executed without command-line arguments,
    we accepts standard input. The -1 option limits its output to only report lines.
    Adding it to a pipeline is a handy way to count things. To see the number of items
    we have in our sorted list, we can do:


    ```

    @melinux~$ ls /bin /usr/bin | sort | uniq | wc -1

