- pgno: 302
  md: '# fold—Wrap Each Line to a Specified Length


    Folding is the process of breaking lines of text at a specified width. Like our
    other commands, fold accepts either one or more text files or standard input.
    If we send a simple stream of text, we can see how it works:


    ```

    $me[linuxbox]$ echo "The quick brown fox jumped over the lazy dog." | fold

    -W 12 br

    The quick br

    own fox jump

    ed over the

    lazy dog.

    ```


    Here we see fold in action. The text sent by the echo command is broken into segments
    specified by the -w option. In this example, we specify a line width of 12 characters.
    If no width is specified, the default is 80 characters. Notice that the lines
    are broken regardless of word boundaries. The addition of the -s option will fold
    to break the line in the last available space before the line width is reached:


    ```

    $me[linuxbox]$ echo "The quick brown fox jumped over the lazy dog." | fold

    -W 12 -s

    The quick

    brown fox

    jumped over

    the lazy

    dog.

    ```


    # fmt—A Simple Text Formatter


    The fmt program also folds text, plus a lot more. It accepts files or standard
    input and performs paragraph formatting on the text stream. Basically, it folds
    and joins lines in text while preserving blank lines and indentation.

    To demonstrate, we''ll need some text. Let''s see how from the fmt page:


    > fmt reads from the specified FILE arguments (or standard input if none are given),
    and writes to output.


    > By default, blank lines, spaces between words, and indentation are preserved
    in the output; successive input lines with different indentation are not joined;
    tabs are expanded on input and introduced on output.


    > fmt prefers breaking lines at the end of a sentence, or tries to avoid breaking
    lines before the first word of a sentence or the last word of a sentence. "sentence
    break" is defined as the end of a paragraph or a word ending in any of ''.?'',
    followed by two spaces or end of line, ignoring any intervening spaces or quotes.
    Like Tex, ''fmt'' enters "paragraphs" before choosing line breaks; the algorithm
    is a variant of that given by Donald E. Knuth and Michael F. Plass in "Breaking
    Paragraphs Into Lines", Software--Practice & Experience'' ii, 11 (November 1981),
    1119-1184.'
  merge: -1
  img_proc: true
- pgno: 303
  md: "We'll copy this text into our text editor and save the file as fmt-info.txt.\
    \ Now, let's say we wanted to reformat this text to fit a 50-character-wide col-umn.\
    \ We could do this by processing the file with fmt and the -w option:\n\n```\n\
    me@linuxbox $ fmt -w fmt-info.txt | head\n  fmt reads from the specified FILE\
    \ arguments (or standard input if none are given), and writes to standard output.\n\
    ```\n\nBy default, blank lines, spaces between words, preserved in the output;\
    \ successive input lines with different indentation are not joined; tabs are expanded\
    \ on input and introduced on output.\n\nWell, that's an awkward result. Perhaps\
    \ we should actually read this text, since it explains what's going on:\n\nBy\
    \ default, blank lines, spaces between words, preserved in the output; successive\
    \ input lines with different indentation are not joined; tabs are expanded on\
    \ input and introduced on output.\n\nSo, fmt is preserving the indentation of\
    \ the first line. Fortunately, fmt provides an option to correct this:\n\n```\n\
    me@linuxbox $ fmt -cw 50 fmt-info.txt\n  fmt reads from the specified FILE arguments\
    \ (or standard input if none are given), and writes to standard output.\n```\n\
    \nBy default, blank lines, spaces between words, and indentation are preserved\
    \ in the output; successive input lines with different indentation are not joined;\
    \ tabs are expanded on input and introduced on output.\n\nfmt prefers breaking\
    \ lines at the end of a sentence, and tries to avoid line breaks after the first\
    \ word of a sentence or before the last word of a sentence. A \"sentence break\"\
    \ is defined either as the end of a paragraph or a word ending in any of .!?\n\
    \ntwo spaces or end of line, ignoring any intervening parentheses or quotes. Like\
    \ TeX, fmt reads \"paragraphs\" before choosing breaks; the algorithm is a variant\
    \ of that given by Donald E. Knuth and Michael F. Pass in \"Breaking Paragraphs\
    \ Into Lines\"; Software--Practice & Experience 11, 11 (November 1981), 1119-1184.\n\
    \nMuch better. By adding the -c option, we now have the desired result."
