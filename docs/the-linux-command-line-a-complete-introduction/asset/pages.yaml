  md: '# # 7

    SEEING THE WORLD AS THE SHELL SEES IT


    In this chapter we are going to look at some of the “magic” that occurs on the
    command line when we press the ENTER key. While we will examine several interesting
    and complex features of the shell, we will do it with just one new command:


    +   - echo—Display a line of text.


    # # Expansion


    Each time you type a command line and press the ENTER key, bash performs several
    processes upon the text before it carries out your command. We see a couple of
    cases of how a simple character sequence, for example *, can have a lot of meaning
    to the shell. The process that makes this happen is called expansion. With expansion,
    you enter something, and it is expanded into something else before the shell acts
    upon it. To demonstrate what we'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'mean by this, let''s take a look at the echo command. echo is a shell builtin
    that performs a very simple task: it prints out its text arguments on standard
    output.


    ```

    me@linuxbox ~$ echo this is a test

    this is a test

    ```


    That''s pretty straightforward. Any argument passed to echo gets-played. Let''s
    try another example:


    ```

    me@linuxbox ~$ echo *

    Desktop Documents ls-output.txt Music Pictures Public Templates Videos

    ```


    So what just happened? Why didn''t echo print *? As you may recall from our work
    with wildcards, the * character means "match any characters in the current working
    directory-name," but what we didn''t see in our original discussion was how the
    shell does that. The simple answer is that the shell expands the * into something
    else (in this instance, the names of the files in the current working directory)
    before the echo command is executed. When the ENTER key is pressed, the shell
    automatically expands any qualifying characters on the command line before the
    command is carried out, so echo never saw the *, only expanded result. Knowing
    this, we can see that echo behaved as expected.


    # Pathname Expansion


    The mechanism by which wildcards work is called pathname expansion. If we try
    some of the techniques we employed in our earlier chapters, we will see that they
    are really expansions. Given a home directory that looks like:


    ```

    me@linuxbox ~$ 1s

    ls-output.txt Pictures Templates

    Documents Music Public Videos

    ```


    we could carry out the following expansions:


    ```

    me@linuxbox ~$ echo D*

    Desktop Documents

    ```


    and


    ```

    me@linuxbox ~$ echo *s

    Documents Pictures Templates Videos

    ```


    or even


    ```

    me@linuxbox ~$ echo [[upper:]]*

    Desktop Documents Music Pictures Public Templates Videos

    ```'
