    # Exercising Your Privileges


    Now that we have learned how permissions thing works, it''s time to show it off.
    We are going to demonstrate the solution to a common problem—setting up a shared
    directory. Let''s imagine that we have two users named bill and karen. They have
    music CD collections and wish to set up a shared directory, where they will store
    their music files as Ogg Vorbis or MP3.


    The first thing that needs to happen is the creation of a group that will have
    both bill and karen as members. Using GNOME''s graphical user management tool,
    bill creates a group called music and adds users bill and karen to it, as in Figure
    9-3.


    ![](img/aa9c1f11ce2d496265d3ab82e4de6f44_122_0.png)


    Figure 9-3: Creating a new group with gnome


    Next, bill creates the directory for the music files:


    ```

    [bill@linuxbox]$ sudo mkdir /usr/local/share/Music

    Password:

    ```


    Since bill is manipulating files outside his home directory, supervisor privileges
    are required. After the directory is created, it has the following ownerships
    and permissions:


    ```

    [bill@linuxbox]$ ls -ld /usr/local/share/Music

    drwxr-xr-x 2 root 4096 2012-03-21 18:05 /usr/local/share/Music

    ```'
