- pgno: 294
  md: '# PEOPLE WHO LIKE SED ALSO LIKE...


    sed is a very capable program, able to perform fairly complex editing tasks to
    streams of text. It is most used for simple, one-line tasks rather than long scripts.
    Many users prefer other tools for larger tasks. The most popular of these are
    awk and perl. They go beyond mere the programs covered here and extend into the
    realm of complete programming languages. perl, in particular, is often used in
    place of shell scripts for many system-management and administration tasks, as
    well as being a very popular medium for web development. a little specialized.
    Its specific strength is its ability to manipulate tabular data. It resembles
    sed that awk normally processes text files by line, using a scheme similar to
    the sed concept of an address followed by an action. While both awk and perl are
    outside the scope of this book, and they are very good tools for the Linux command
    line user.


    # aspell—Interactive Spell Checker


    The last tool we will look at is aspell, an interactive spellchecker. The aspell
    program is the successor to an earlier program ispell, and it can be used, for
    the most part, as a drop-in replacement. While the aspell program is mostly used
    by other programs that require spellchecking capability, it can also used very
    effectively as a stand-alone tool from the command line. It has the ability to
    intelligently check various type of text files, including HTML documents, C/C++
    programs, email messages, and other kinds of special texts.


    To spellcheck a text file containing simple prose, aspell could be used like this:


    aspell check textfile


    where textile is the name of the file to check. As a practical example, let''s
    create a simple text file named foo.txt containing some deliberate spelling errors:


    ```

    @linuxbox~$ cat > foo.txt

    The quick brown fox jimped over the lax dog.

    ```


    Next we''ll check the file using aspell:


    ```

    @linuxbox~]$ aspell check foo.txt

    ```


    As aspell is interactive in the check mode, we will see a screen like this:


    The quick brown fox jimped over the lax dog.


    +   1) jimped

    2) gimped

    6) whimped

    7) camped'
