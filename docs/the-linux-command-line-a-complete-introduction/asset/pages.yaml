    # Viewing Processes Dynamically with top


    While the ps command can reveal about what the machine is doing, it provides only
    a snapshot of the machine''s state at the moment the ps command is executed. To
    see a more dynamic view of the machine''s activity, we use the following command:


    ```

    [me@linuxbox]$ top

    ```


    The top program displays a continuously updating (by default, every 3 seconds)
    display of the system processes listed in order of process activity.'
