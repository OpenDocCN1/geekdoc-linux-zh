    # Verifying Input


    A general rule of good programming is that if a program accepts input, it must
    be able to deal with anything it receives. This usually means that input must
    be carefully screened to ensure that only valid input is accepted for further
    processing. We saw an example of this in the previous chapter when we studied
    the read command. One script contained the following to verify a menu selection:


    ```

    [[ $REPLY ~ ^[0-3]$ ]]

    ```


    This test is very specific. It will return a 0 exit status only if the string
    returned by the user is a numeral in the range of 0 to 3. Nothing else will be
    accepted. Sometimes these sorts of tests can be very challenging to write, but
    the effort is necessary to produce a high-quality script.


    # DESIGN IS A FUNCTION OF TIME


    When I was a college student studying industrial design, a wise professor stated
    that the degree of design on a project was determined by the amount of time given
    to the designer. If you were given 5 minutes to design a device that kills flies,
    you designed a flyswater. If you were given 5 months, you might come up with a
    laser-guided "anti-fly" system instead.


    The same principle applies to programming. Sometimes a "quick-dirty" script will
    do if it''s going to be used only once and by the programmer. That kind of script
    is common and should be developed quickly to make the effort economical. Such
    scripts don''t need a lot of commands and defensive checks. On the other hand,
    if a script is intended for production use, that is, a script that will be used
    over and over for an important task or by multiple users, it needs much more careful
    development.'
  merge: -1
  img_proc: true
- pgno: 400
  md: "# Testing\n\nTesting is an important step in every kind of software development,\
    \ including scripts. There is a saying in the open source world, \"release early,\
    \ release often,\" that reflects this fact. By releasing early and often, software\
    \ gets more exposure to use and testing. Experience has shown that stubs are much\
    \ easier to find, and much less expensive to fix, if they are found early in the\
    \ development cycle.\n\n# Stubs\n\nIn a previous discussion, we saw how stubs\
    \ can be used to verify program flow. From the earliest stages of script development,\
    \ they are a valuable technique to check the progress of our work.\n\nLet's look\
    \ at the previous file-deletion problem and how this could be coded for easy testing.\
    \ Testing the original fragment of code could be dangerous, its purpose is to\
    \ delete files, but we could modify the code to make the test:\n\n```\nif [[ -d\
    \ $dir_name ]]; then\n    if cd $dir_name; then\n        echo rm * # TESTING\n\
    \    else\n        echo \"cannot cd to '$dir_name\" >&2\n        exit 1\n    fi\n\
    \    echo \"no such directory: '$dir_name\" >&2\n    exit 1\nfi\n# TESTING\n```\n\
    \nSince the error conditions already output useful messages, we don't have to\
    \ add any. The most important change is placing an echo command just before the\
    \ rm command to allow the command and its expanded argument to be displayed, rather\
    \ than executed. This change allows safe execution of the code. At the end of\
    \ the code fragment, we place an exit command to conclude the test and prevent\
    \ any other part of the script from being carried out. The need for this will\
    \ vary according to the design of the script.\n\nWe also include some comments\
    \ that act as \"markers\" for our test-related changes. These can be used to help\
    \ find and remove the changes when testing is complete.\n\n# Test Cases\n\nTo\
    \ perform useful testing, it's important to develop and apply good test cases.\
    \ This is done by carefully choosing input data or operating conditions that"
  merge: -1
  img_proc: true
- pgno: 401
  md: "reflect edge and corner cases. In our code fragment (which is very simple),\
    \ we want to know how the code performs under three specific conditions:\n\n+\
    \   - dir_name contains the name of an existing directory.\n- dir_name contains\
    \ the name of a nonexistent directory.\n- dir_name is empty.\n\nBy performing\
    \ the test with each of these conditions, good test coverage is achieved.\n\n\
    Just as with design, testing is a function of time, as well. Not every script\
    \ feature needs to be extensively tested. It's really a matter of determining\
    \ what is most important. Since it could be very destructive if malfunctioned,\
    \ our code fragment deserves careful consideration during both its design and\
    \ its testing.\n\n# Debugging\n\nIf testing reveals a problem with a script, the\
    \ next step is debugging. \"problem\" usually means that the script is, in some\
    \ way, not performing to the programmer's expectations. If this is the case, we\
    \ need to carefully determine exactly what the script is actually doing and why.\
    \ Finding bugs can sometimes involve a lot of detective work.\n\nA well-designed\
    \ script will try to help. It should be programmed defensively to detect abnormal\
    \ conditions and provide useful feedback to the user. Sometimes, problems are\
    \ strange and unexpected, and more involved techniques are required.\n\n# Finding\
    \ the Problem Area\n\nIn scripts, particularly long ones, it is sometimes to isolate\
    \ the area of the script that is related to the problem. This won't always be\
    \ the actual error, but isolation will often provide insights into the actual\
    \ cause. One technique that can be used to isolate code is \"commenting out\"\
    \ sections of a script. For example, our file-deletion fragment could be modified\
    \ to determine if the removed section was related to an error:\n\n```\nif [ -d\
    \ $dir_name ]; then\n    if cd $dir_name; then\n        rm\n    else\n       \
    \ echo \"cannot cd to '$dir_name\" >&2\n        exit 1\nfi\n# else\n#\n    echo\
    \ \"no such directory: '$dir_name\" >&2\n    exit 1\n```"
  merge: -1
  img_proc: true
- pgno: 402
  md: "By placing comment symbols at the beginning of each line in a logical section\
    \ of a script, we prevent that section from being executed. Testing can then be\
    \ performed again to see if the removal of the code has any impact on the behavior\
    \ of the bug.\n\n# Tracing\n\nBugs are often cases of unexpected logical flow\
    \ within a script. That is, portions of the script are either never executed or\
    \ are executed in the wrong order or at the wrong time. To view the actual flow\
    \ of the program, we use a technique called tracing.\nOne tracing method involves\
    \ placing informative messages in a script that displays the location of execution.\
    \ We add messages to our code fragment:\n\n```\necho \"preparing to delete files\"\
    \ >&2\nif [[ -d $dir_name ]]; then\n    if cd $dir_name; then\n        echo \"\
    deleting files\" >&2\n        rm *\n    else\n        echo \"cannot cd to '$dir_name\"\
    \ >&2\n        exit 1\n    fi\n    echo \"no such directory: '$dir_name\" >&2\n\
    \    exit 1\nfi\necho \"file deletion complete\" >&2\n```\n\nWe send the messages\
    \ to standard error to separate them from normal output. We also do not indent\
    \ the lines containing the messages, so it is easier to find when it's time to\
    \ remove them.\nNow when the script is executed, it's possible to see that the\
    \ file deletion has performed:\n\n```\n[me@linuxbox ~]$deletion-script\npreparing\
    \ to delete files\ndeleting files\nfile deletion complete\n[me@linuxbox ~]\n```\n\
    \nbash also provides a method of tracing, implemented by the -x option and the\
    \ set command with Using our earlier trouble script, we can activate tracing for\
    \ the entire script by adding the -x option to the first line:\n\n```\n#!/bin/bash\
    \ -x\n# trouble: script to demonstrate common errors\nnumber=1\n```"
  merge: -1
  img_proc: true
- pgno: 403
  md: '```

    if [ $number = 1 ]; then

    echo "Number is equal to 1."

    elelse

    echo "Number is not equal to 1."

    fi

    ```


    When executed, the results look like this:


    ```

    [me@linuxbox ~]$ trouble

    + number-1

    + [''1 = 1'']

    + echo ''Number is equal to 1.''

    Number is equal to 1.

    ```


    With tracing, we see the commands performed with expansions applied. The plus
    sign indicates the display of the trace to distinguish them from lines of regular
    output. The plus sign is the default character for trace output. The contents
    of this variable (in the PS4 (prompt string 4) shell variable. can be adjusted
    to make the prompt more useful. Here, we modify it to include the current line
    number in the script where the trace is performed. Note that single quotes are
    required to prevent expansion until the prompt is actually used:


    ```

    [me@linuxbox ~]$ export PS4=$LINENO + ''

    [me@linuxbox ~]$ trouble

    5 number=1

    7 [''1 = 1'']

    8 echo ''Number is equal to 1.''

    Number is equal to 1.

    ```


    To perform a trace on a selected portion of a script, rather than the entire script,
    we can use the set command with the -x option:


    ```

    #!/bin/bash


    trouble: script to demonstrate common errors


    number=1


    set -x Turn on tracing

    if [ $number = 1 ]; then

    echo "Number is equal to 1."

    else

    echo "Number is not equal to 1."

    fi

    set +x # Turn off tracing

    ```


    We use the set command with the -x option to activate tracing and the +x option
    to deactivate tracing. This technique can be used to examine multiple portions
    of a troublesome script.'
  merge: -1
  img_proc: true
- pgno: 404
  md: "# Examining Values During Execution\n\nIt is often useful, along with tracing,\
    \ to display the content of variables to see the internal workings of a script\
    \ while it is being executed. Applying additional echo statements will usually\
    \ do the trick:\n\n```\n#!/bin/bash\n\n# trouble: script to demonstrate common\
    \ errors\n\nnumber=1\necho \"number=$number\" DEBUG\nset -x # Turn on tracing\n\
    if [ $number = 1 ]; then\n    echo \"Number is not equal to 1.\"\nelse\n    echo\
    \ \"Number is equal to 1.\"\nfi\nset +x # Turn off tracing\n```\n\nIn this trivial\
    \ example, we simply display the value of the variable number and mark the added\
    \ line with a comment to facilitate its later identification and removal. This\
    \ technique is particularly useful when watching the behavior of loops and arithmetic\
    \ within scripts.\n\n# Final Note\n\nIn this chapter, we looked at just a few\
    \ of the problems that can crop up during script development. Of course, there\
    \ are many more. The techniques described here will enable finding most common\
    \ bugs. Debugging is an art that can be developed through experience, both in\
    \ avoiding bugs (testing constantly throughout development) and in finding bugs\
    \ (effective use of tracing)."
  merge: -1
