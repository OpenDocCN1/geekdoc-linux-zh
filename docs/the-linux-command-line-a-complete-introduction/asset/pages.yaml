- pgno: 436
  md: '# Number Bases


    Back in Chapter 9, we got a look at octal (base 8) and hexadecimal (base 16) numbers.
    In arithmetic expressions, the shell supports integer constants in any base. Table
    34-1 shows the notations used to specify the bases.


    # Table 34-1: Specifying Different Number Bases


    | Notation | Description |

    | --- | --- |

    | Number | By default, numbers without any notation are treated as decimal (base
    10) integers. |

    | Onumber | In arithmetic expressions, numbers with a leading zero are considered
    octal. |

    | Oxnumber | Hexadecimal notation |

    | base8number | number is in base. |


    Some examples:


    ```

    me@linux ~$ echo $((xff))

    255

    me@linux ~$ echo $((2#11111111))

    255

    ```


    In these examples, we print the value of the hexadecimal number ff (the largest
    two-digit number) and the largest eight-digit binary (base 2) number.


    # Unary Operators


    There are two unary operators, the + and the -, which are used to indicate a number
    is positive or negative, respectively.


    # Simple Arithmetic


    The ordinary arithmetic operators are listed in Table 34-2.


    # Table 34-2: Arithmetic Operators


    | Operator | Description |

    | --- | --- |

    | + | Addition |

    | - | Subtraction |

    | * | Multiplication |

    | / | Integer division |

    | ** | Exponentiation |

    | % | Modulo (remainder) |'
