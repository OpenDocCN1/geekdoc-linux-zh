  md: 'If we add an option, we can get a bigger picture of what the system is


    ```

    [me@linux ~]$ ps x

    PID TTY STAT COMMAND

    2799 ? Ssl 0:00 /usr/libexec/bonabo-activation-server -ac

    2820 ? Ssl 0:01 /usr/libexec/evolution-data-server-1.10

    15647 ? Ss 0:00 /bin/sh /usr/bin/startkde

