- pgno: 455
  md: 'The two forms differ in that a group command surrounds its commands with braces
    and a subshell uses parentheses. It is important to note that, due to the way
    bash implements group commands, the braces must be separated from the commands
    by a space and the last command must be terminated with either a semicolon or
    a newline prior to the closing brace.


    # Performing Redirection


    So what are group commands and subshells good for? While they have an important
    difference (which we will get to in a moment), they are both used to manage redirection.
    Let''s consider a script segment that performs redirections over multiple commands:


    ```

    ls -l output.txt

    echo "Listing of foo.txt" >> output.txt

    cat foo.txt >> output.txt

    ```


    This is pretty straightforward: two commands with our output redirected to a file
    named output.txt. Using a group command, we could do this as follows:


    ```

    { ls -1; echo "Listing of foo.txt"; cat foo.txt; } > output.txt

    ```


    Using a subshell is:


    ```

    (ls -1; echo "listing of foo.txt"; cat foo.txt) > output.txt

    ```


    Using this technique, we have saved ourselves some typing, but where a group command
    or subshell really shines is pipelines. When constructing a pipeline of commands,
    it is often useful to combine the results of several commands into a single stream.
    Group commands and subshells make this easy:


    ```

    { ls -1; echo "Listing of foo.txt"; cat foo.txt; } | lpr

    ```


    Here we have combined the output of our three commands and piped them into the
    input of lpr to produce a printed result.


    # Process Substitution


    While they look similar and can be used to combine streams for redirection, there
    is an important difference between group commands and subshells. Whereas a group
    command executes all of its commands in the current shell, a subshell (as the
    name suggests) executes its commands in a child copy of the current shell. This
    means that the environment is copied and given to a new instance of the shell.
    When the subshell exits, the copy of the environment is lost, so any changes made
    to the subshell''s environment (including variable assignment) are lost as well.'
  merge: -1
  img_proc: true
- pgno: 456
  md: 'Therefore, in most cases, unless a script requires a subshell, group commands
    are preferable to subshells. Group commands are both faster and require less memory.


    We saw an example of the subshell environment problem in Chapter 28, when we discovered
    that a read command in a pipeline does not work as we intuitively expect. To recap,
    we construct a pipeline like this:


    ```

    echo "foo" | read

    echo $REPLY

    ```


    the content of the REPLY variable is always empty, because the read command is
    executed in a subshell and its copy of REPLY is destroyed when the subshell terminates.


    Because commands in pipelines are always executed in subshells, any command that
    assigns variables will encounter this issue. Fortunately, the shell provides an
    explicit form of process substitution that can be used to work around this problem.


    Process substitution is expressed in two ways: for processes that produce standard
    output:


    ```

    <list>

    ```


    or processes that intake standard input:


    ```

    (list)

    ```


    where list is a list of commands.


    To solve our problem with read, we can employ process substitution like this:


    ```

    read <(echo "foo")

    echo $REPLY

    ```


    Process substitution allows us to treat the output of a subshell as an ordinary
    file for purposes of redirection. In fact, it is a form of expansion, we can examine
    its real value:


    ```

    me@linuxbox ~]$ echo <<<echo "foo")

    /dev/fd/63

    ```


    By using echo to view the result of the expansion, we see that the output of the
    subshell is being provided by a file named /dev/fd/63.


    Process substitution is often used with loops containing read. Here is an example
    of a read loop that processes the contents of a directory listing by a subshell:


    ```

    #!/bin/bash

    ```


    ```

    # pro-sub : demo of process substitution

    while read attr links owner group size time filename; do

    ```'
