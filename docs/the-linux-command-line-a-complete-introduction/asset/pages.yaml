  md: 'We can also specify a substitution command with user confirmation.

    This is done by adding a c to the end of the command. For example:


    ```

    %s/line/Line/gc

    ```


    This command will change our file back to its previous form; however, before each
    substitution, vi stops and asks us to confirm the substitution with this message:


    replace with Line (y/n/a/q/1/E/y)?


    Each of the characters in the parentheses is a possible response, as shown in
    Table 12-6.


    # Table 12-6: Replace Confirmation Keys


    | Key | Action |

    |---|---|

    | y | Perform the substitution. |

    | n | Skip this instance of the pattern. |

    | a | Perform the substitution on this and all subsequent instances of the pattern.
    |

    | q or ESC | Quit substituting. |

    | 1 | Perform this substitution and then quit. Short for last. |

    | CTRL-E, CTRL-Y | Scroll down and scroll up, respectively. Useful for viewing
    the context of the proposed substitution. |


    # Editing Multiple Files


    It''s often useful to edit more than one file at a time. You might need to make
    changes to multiple files, or you may need to copy content from one file into
    another. With vi we can open multiple files for editing by specifying them on
    the command:


    ```

    vi file1 file2 file3...

    ```


    Let''s exit our vi session and create a new file for editing. Type :wq to exit
    vi, saving our modified text. Next, we''ll create an additional file in our home
    directory that we can play with. We''ll create the file by capturing some output
    from the ls command:


    ```

    [@linuxbox]$ ls -1 /usr/bin > ls-output.txt

    ```


    Let''s edit our old file and our new one with vi:


    ```

    [@linuxbox]$ vi foo.txt ls-output.txt

    ```'
