    \ The inclusion of an exit command in each signal-handling functions. Without\
    \ an exit, the script would continue after completing the function.\n\nWhen the\
    \ user presses CTRL-C during the execution of this script, the results looks like\
    \ this:\n\n```\n[me@linux ~]$ trap-demo2\nIteration 1 of 5\nIteration 2 of 5\n\
    Script interrupted.\n```\n\n# TEMPORARY FILES\n\nOne reason signal handlers are\
    \ included in scripts is to remove temporary files that the script may create\
    \ to hold intermediate results during execution. There is something of an art\
    \ to naming temporary files. Traditionally, programs on Unix-like systems create\
    \ their temporary files in the /tmp directory, a shared directory intended for\
    \ such files. However since the directory is shared, this poses security concerns,\
    \ particularly for programs running with user privileges. Aside from the obvious\
    \ of setting proper permissions for files exposed to all users of the system,\
    \ it is important to give temporary files non-predictable filenames. This avoids\
    \ an exploit known as a temp race attack. One way to create a non-predictable\
    \ (but still descriptive) name is to something like this:\n\n```\ntempfile=/tmp/$(basename\
    \ $$).$$RANDOM\n```\n\nThis will create a filename following the program's name,\
    \ followed by its process ID (PID), followed by a random integer. However, that\
    \ $RANDOM returns a value only in the range of 1 to 32767, which is not a very\
    \ large range in computer terms, so a single instance of the variable is not sufficient\
    \ to overcome a determined attacker.\n\nA better way is to use the mktemp program\
    \ (not to be confused with the mktemp standard library function) to both name\
    \ and create the temporary file."
