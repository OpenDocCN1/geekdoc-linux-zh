  md: '# Table 20-5: diff Context-Format Change Indicators


    | Indicator | Meaning |

    | --- | --- |

    | (none) | A line shown for context. It does not indicate a difference between
    the two files. |

    | - | A line deleted. This line will appear in the first file but not in the second
    file. |

    | + | A line added. This line will appear in the second file but not in the first.
    |

    | ! | A line changed. The two versions of the line will be displayed, each in
    its respective section of the change group. |


    The unified format is similar to the context format but is more concise. It is
    specified with the -u option:


    The most notable difference between the context and unified formats is the elimination
    of the duplicated lines of context, making the results of the unified format shorter
    than those of the context format. In our example above, we see file timestamps
    like those of the context format, followed by the string @@ -1,4 +1,4 @@. This
    indicates the lines in the first file and the lines in the second file described
    in the change group. Following are the lines themselves, with the default three
    lines of context. As shown in Table 20-6, each line start with one of three possible
    characters.


    # Table 20-6: diff Unified-Format Change Indicators


    | Character | Meaning |

    | --- | --- |

    | (none) | This line is shared by both files. |

