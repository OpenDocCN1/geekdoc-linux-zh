- pgno: 201
  md: 'The program will display a lot of information when ext3 is the chosen filesystem
    type. To reformat the device to its original FAT32 filesystem, specify vfat as
    the filesystem type:


    ```

    [me@linux ~]$ sudo mkfs -t vfat /dev/sdb1

    ```


    This process of partitioning and formatting can be used any additional storage
    devices added to the system. While we worked with a tiny flash drive, the same
    process can be applied to internal hard disks and removable storage devices like
    USB drives.


    # Testing and Repairing Filesystems


    In our earlier discussion of the /etc/stab file, we saw some mysterious digits
    at the end of each file. Each time the system boots, it routinely checks the integrity
    of the filesystems before mounting them. This is done by the fsck program (short
    for filesystem check). The last number in each stab entry specifies the order
    in which the devices are to be checked. In our example above, we see that the
    root filesystem is checked first, followed by the home and boot filesystems. Devices
    with a zero as the last are not routinely checked.


    In addition to checking the integrity of filesystems, fsck can also repair corrupt
    filesystems with varying degrees of success, depending on the amount of damage.
    On Unix-like filesystems, recovered portions of files are placed in the last-found
    directory, located in the root of each filesystem.


    To check our flash drive (which should be unmounted first), we could do the following:


    ```

    [me@linux ~]$ sudo fsck /dev/sdb1

    fsck 1.40.8 (13-Mar-2012)

    e2fsck 1.40.8 (13-Mar-2012)

    /dev/sdb1: clean, 11/3904 files, 1661/15608 blocks

    ```


    In my experience, filesystem corruption is quite rare unless there is a hardware
    problem, such as a failing disk drive. filesystem detected at boot time will cause
    the system to stop and deny you to run fsck before continuing.


    # WHAT THE FSCK?


    In Unix culture, fsck is often used in place of a popular word with which it shares
    three letters. This is especially appropriate, given that you will probably be
    uttering the aforementioned word if you find yourself in a situation you are forced
    to run fsck.'
