    \ time, the script exits with an error. Since the -s option is included, the characters\
    \ of the passphrase are not echoed to the display as they are typed.\n\n# Separating\
    \ Input Fields with IFS\n\nNormally, the shell performs splitting on the input\
    \ provided to read. As we have seen, this means that multiple words separated\
    \ by one or more spaces separate items on the input line and are assigned to separate\
    \ variables by read. This behavior is configured by a shell variable IFS (Internal\
    \ Field Separator). The default value of IFS contains a space, a tab, and a newline\
    \ character, each of which will separate items from one another.\n\nWe can adjust\
    \ the IFS to control the separation of input fields to read. For example, the\
    \ /etc/passwd file contains lines that use the colon character as a field separator.\
    \ By changing the value of IFS to a single colon,"
