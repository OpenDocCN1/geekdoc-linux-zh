- pgno: 38
  md: '# 2


    # # NAVIGATION


    The first thing we need to learn (besides just typing) is how to navigate the
    filesystem on our Linux system. In this chapter we will introduce the following
    commands:


    +   * pwd—Print name of current working directory.

    * cd—Change directory.

    * ls—List directory contents.


    # # Understanding the Filesystem Tree


    Like Windows, a Unix-like operating system such as Linux organizes files in what
    is called a hierarchical directory structure. This means that they are organized
    in a tree-like pattern of directories (sometimes called folders in other systems),
    which may contain files and other directories. The first directory in the filesystem
    is called the root directory. The root directory contains files and subdirectories,
    which contain more files and subdirectories, and so on.'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'Note that unlike Windows, which has a separate filesystem tree for each storage
    device, Unix-like systems such as Linux always have a single filesystem tree,
    regardless of how many drives or storage devices are attached to the computer.
    Storage devices are attached (or more correctly, mounted) at various points on
    the tree according to the whims of the system administrator, the person (or persons)
    responsible for the maintenance of the system.


    # # The Current Working Directory


    Most of us are probably familiar with a graphical file manager, which represents
    the filesystem tree, as in Figure 2-1. Notice that the tree is usually shown upturned,
    with the root at the top and the various branches descending below.


    However, the command line has no pictures, so to navigate the filesystem tree,
    we need to think of it in a different way.


    Imagine that the filesystem is a maze shaped like upside-down tree and we are
    able to stand in the middle of it. At any time, we are inside a single directory
    and we can see the files contained in the directory and the pathway to the directory
    above us (the *parent directory*) and any subdirectories below. The directory
    we are standing in is called the *current working directory*. To display the current
    working directory, we use the `pwd` (print working directory) command:


    ![](img/aa9c1f11ce2d496265d3ab82e4de6f44_39_0.png)


    Figure 2-1: Filesystem tree as shown by a graphical file manager


    ```

    ```me@linuxbox]$ pwd

    home/me\```

    ```


    When we log in to our system (or start a terminal emulator session), our current
    working directory is set to our *home* directory. Each user is given its own home
    directory, which is the only place the user is allowed to write files when operating
    as a regular user.


    # # Listing the Contents of a Directory


    To list the files and directories in the current working directory, we use the
    `ls` command:


    ```

    ```me@linuxbox ~$ ls

    Desktop Documents Music Pictures Public Templates Videos\```

    ```


    Actually, we can use the `ls` command to list the contents of your current working
    directory, and it can do many other things as well. We''ll spend more time with
    `ls` in Chapter 3.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Changing the Current Working Directory


    To change your working directory (where we are standing in our treshaped may)
    we use the cd command: Type cd followed by the pathname of the desired working
    directory. A pathname is the route we take along the branches of the tree to get
    to the directory we want. Pathnames can be specified in one of ways, as absolute
    pathnames or as relative pathnames. Let''s deal with absolute pathnames first.


    # Absolute Pathnames


    An absolute pathname begins with the root directory and follows the tree by branch
    until the path to the desired directory or file is completed. For example, there
    is a directory on your system in which most of your system''s programs are installed.
    The pathname of directory is /usr/bin. This means the root directory (represented
