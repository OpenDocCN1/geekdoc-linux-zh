  md: '# Joining Lines


    vi is rather strict about its idea of a line. Normally, it is not possible to
    move the cursor to the end of a line and delete the end-of-line character to join
    one with the one below it. Because of this, vi provides a specific command, j
    (not to be confused with J, which is for cursor movement), to join lines together.


    If we place the cursor on line 3 and type the J command, here''s what happens:


    ```

    The quick brown fox jumped over the lazy dog.

    Line 2

    Line 3 Line 4

    Line 5

    ```


    # Search and Replace


    vi has the ability to move the cursor to locations based on searches. It can do
    this on a single line or over an entire file. It can also perform replacements
    with or without confirmation from the user.


    # Searching Within a Line


    The f command searches a line and moves the cursor to the next instance of a specified
    character. For example, the command fa would move the cursor to the next occurrence
    of the character a within the current line. After performing a search within a
    line, the search may be repeated by typing a semicolon.


    # Searching the Entire File


    To move the cursor to the next occurrence of a word or phrase, the / command is
    used. This works the same way as in the less program we covered in Chapter 3.
    When you type the / command, a forward slash will appear at the bottom of the
    screen. Next, type the word or phrase to search for, followed by the ENTER key.
    The cursor will move to the next location containing the search string. A search
    may be repeated using the previous search string with the n command. Here''s an
    example:


    ```

    The quick brown fox jumped over the lazy dog.

    Line 2

    Line 3

    Line 4

    Line 5

