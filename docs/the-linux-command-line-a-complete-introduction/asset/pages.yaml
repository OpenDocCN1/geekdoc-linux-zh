    ignore the ominous-sounding warning message.


    # Creating a New Filesystem with mkfs


    With our partition editing done (lightweight though it might have), it''s time
    to create a new filesystem on our flash drive. To do this, we will use mkfs (short
    for make filesystem), which can create filesystems in a variety of formats. To
    create an ext3 filesystem on the device, we use the -t option to specify the ext3
    type, by the name of the device containing the partition we made:


    ```

    me@linux]$ sudo mkfs -t ext3 /dev/sdb1

