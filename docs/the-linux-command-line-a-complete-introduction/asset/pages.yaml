    phrases for our search patterns, vi allows the use of regular expressions, a powerful
    method of expressing complex text patterns. We will cover regular expressions
    in some detail in Chapter 19.


    # Global Search and Replace


    vi uses an ex command to perform search-and-replace operations (called substitution
    in vi) over a range of lines or the entire file. To change the word Line to line
    for the entire file, we would enter the following command:


    ```

    :%s/Line/line/g

    ```


    Let''s break this command down into separate items and see what each one does
    (see Table 12-5).


    Table 12-5: An Example of a Global Search-and-Replace Syntax


    | Item | Meaning |

    |---|---|

    | % | The colon character starts an ex command. Specifies the range of lines for
    the operation. % is a shortcut meaning from the first line to the last line. Alternatively,
    the range could have been specified 1,5 (because our file is five lines long),
    or 1,$ which means "from line 1 to the last line in the file." If the range of
    lines is omitted, the operation is performed only on the current line. |

    | s | Specifies the operation—in this case, substitution (search and replace).
    |

    | /Line/ | The search pattern and the replacement text. |

    | g | This means global, in the sense that the substitution is performed on every
    instance of the string in each line. If g is omitted, only the first instance
    of the search string on each line is replaced. |


    After executing our search-and-replace command, our file looks like this:


    ```

    The quick brown fox jumped over the lazy dog. It was cool.

    line 2

    line 3

    line 4

    line 5

    ```'
