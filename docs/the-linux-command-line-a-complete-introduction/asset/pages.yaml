    # shift—Getting Access to Many Arguments


    But what happens when we give the program a large number of arguments such as
    this:


    ```

    [me@linuxbox ~$ posit-param *

    ```


    ```

    Number of arguments: 82

    $0 = /home/me/bin/posit-param

    $1 = addresses.ldif

    $2 = bin

    $3 = bookmarks.html

    ddebian-500-i386-netinst.iso

    $5 = debian-500-i386-netinst.jigdo

    $6 = debian-500-i386-netinst.template

    $7 = debian-cd_info.tar.gz

    $8 = Desktop

    $9 = dirlist.txt

    ```


    On this example, the wildcard * expands into 82 arguments. How can we process
    that many? The shell provides a method, albeit a clumsy one, to do this. The shift
    command causes each parameter to "move down one" each time it is executed. In
    fact, by using shift, it is possible to get by only one parameter (in addition
    to $0, which never changes).'
