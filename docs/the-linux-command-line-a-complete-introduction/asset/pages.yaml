- pgno: 140
  md: '# 11

    1


    # THE ENVIRONMENT


    As we discussed earlier, the shell maintains a body of information during our
    shell session called the *environment*. Data stored in the environment is used
    by programs to determine facts about our configuration. While most programs use
    configuration files to store program settings, some programs will also look for
    values stored in the environment to adjust their behavior. Knowing this, we can
    use the environment to customize our shell experience.


    In this chapter, we will work with the following commands:


    +   * printenv—Print part or all of the environment.

    * set—Set shell options.

    * export—Export environment to subsequently executed programs.

    * alias—Create an alias for a command.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# What Is Stored in the Environment?


    The shell stores two basic types of data in the environment, although with bash,
    the types are largely indistinguishable. They are environment variables and shell
    variables. Shell variables are bits of data placed there by bash, and environment
    variables are basically everything. In addition to variables, the shell also stores
    some programmatic data, namely aliases and shell functions. We covered aliases
    in Chapter 5, and shell functions (which are related to shell scripting) will
    be covered in Part 4.


    # Examining the Environment


    To see what is stored in the environment, we can use either the built in bash
    or the printenv program. The command will show both the shell and environment
    variables, while printenv will display only the latter. Since the list of environment
    contents will be long, it is best to pipe the output of either command into:


    ```

    @linuxbox]$ printenv | less

    ```


    Doing so, we should get something that looks like:


    ```

    KDE_MULTIHEAD=false

    SSM_AGENT_PID=6666

    HOSTNAME=linux

    PGP_INFO=/tmp/pgp-Dotot7/S.pgp-agent:6689:1

    SHELL=/bin/bash

    TERM=xterm

    XDG_MENU_PREFIX=-kde

    SIZE=1000

    XDG_SESSION_COOKIE=6d7b05c658463ceaf310b0046bd2b00-1208521990.996705-1177561

    GTK2_RC_FILES=/etc/gtk-2.0/gtrc:home/me/.gtk-2.0/home/me/.kde/share/config/gtrc

    gtkrc

    GTK3_RC_FILES=/etc/gtk/gtrc:home/me/.gtk:home/me/.kde/share/config/gtkrc

    GS_LIB=home/me/.fonts

    WINDOWID=2930316

    QTDIR=/usr/lib-qt-3

    QTINUS=/usr/lib-qt-3/include

    KDE_FULL_SESSION=true

    USER=me

    LS_COLORS=09:fi=00;01;00;31;00;36;pi=40;43;so=00;35;bd=40;43;01;cd=40;33;01;or=01;05;37;41;mi=01;37;41;ex=00;32*:32*:*.exe

    ```


    What we see is a list of environment variables and their values. For example,
    we see a variable called USER, which contains the value me. The printenv command
    can also list the value of a specific variable:


    ```

    @linuxbox]$ printenv USER

    ```


    me'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'The set command, when used without options or arguments, will display both
    the shell and environment variables, as well as any defined shell functions.


    ```

    @me@linuxbox ~$ set | less

    ```


    Unlike printenv, its output is courteously sorted in alphabetical order. It is
    also possible to view the contents of a single variable using the echo command,
    like this:


    ```

    @me@linuxbox ~$ echo HOME

    /home/me

    ```


    One element of the environment that neither nor printenv displays aliases. To
    see them, enter the alias command without arguments:


    ```

    @me@linuxbox ~$ alias

    alias 1=''ls -d .*'' --color=tty

    alias 1l=''ls -l --color=tty

    alias ls=''ls --color=tty

    alias vi=''vi''

    alias which=''|alias | /usr/bin/which --tty-no-read-aliases --show-dot --show-ntilde''

    ```


    # Some Interesting Variables


    The environment contains quite a few variables, though your environment may differ
    from the one presented here, you will likely see the variables in Table 11-1 in
    your environment.


    # Table 11-1: Environment Variables


    | Variable | Contents |

    | --- | --- |

    | DISPLAY | The name of your display if you are running a graphical environment.
    Usually this is :0; meaning the first display generated by the X server. |

    | EDITOR | The name of the program to be used for text editing. |

    | SHELL | The name of your shell program. |

    | HOME | The pathname of your home directory. |

    | LANG | Defines the character set and collation order of your language. |

    | OLD_PWD | The previous working directory. |

    | PAGER | The name of the program to be used for paging output. This is often
    set to /usr/bin/less. |

    | PATH | A colon-separated list of directories that are searched when you enter
    the name of an executable program. |'
