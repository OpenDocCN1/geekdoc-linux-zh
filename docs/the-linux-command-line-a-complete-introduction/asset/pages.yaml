- pgno: 137
  md: 'For the curious, a complete list of signals can be seen with the following
    command:


    ```

    me@linux:~$ kill -l

    ```


    # Sending Signals to Multiple Processes with killall


    It''s also possible to send signals to multiple processes matching a specified
    program or username by using the killall command. Here is the syntax:


    To demonstrate, we will start a couple of instances of the xlogo program and terminate
    them:


    ```

    me@linux:~$ xlogo &\n[1] 18801

    me@linux:~$ xlogo &\n[2] 18802

    me@linux:~$ killall xlogo

    [1]- Terminated xlogo

    [2]+ Terminated xlogo

    ```


    Remember, as kill, you must have superuser privileges to send signals to processes
    that do not belong to you.


    # More Process-Related Commands


    Since monitoring processes is an important system administration task, there are
    a lot of commands for it. Table 10-6 lists some to play with.


    Table 10-6: Other Process-Related Commands


    | Command | Description |

    |---|---|

    | pstree | Outputs a process list arranged in a tree-like pattern showing the
    parent/child relationships between processes. |

    | vmstat | Outputs a snapshot of system resource usage including memory, swap,
    and disk I/O. To see a continuous display, follow the command with a time delay
    (in seconds) for updates (e.g., vmstat s). Terminate the output with CTRL-C. |

    | xload | A graphical program that draws a graph showing system load time. |

    | tload | Similar to the xload program, but draws the graph in the terminal. Terminate
    the output with CTRL-C. |'
