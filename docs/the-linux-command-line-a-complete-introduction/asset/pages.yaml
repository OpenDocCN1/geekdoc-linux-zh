    During expansion, variable names may be surrounded by optional curly braces {}.
    This is useful in cases where a variable becomes ambiguous due to its surrounding
    context. Here, we try to change the name of a file from myfile to myfile1, using
    a variable:


    ```

    [me@linux] ~ filename="myfile"

    [me@linux] ~ touch $filename

    [me@linux] ~ mv $filename $filename

    m: missing destination file operand after `myfile''

    Try mv --help for more information.

    ```


    This attempt fails because the shell interprets the second argument of the mv
    command as a new (and empty) variable. The problem can be overcome by:


    ```

    [me@linux] ~ mv $filename ${filename}

    ```


    By adding the surrounding braces, we ensure that the shell no longer interprets
    the trailing 1 as a variable name.

