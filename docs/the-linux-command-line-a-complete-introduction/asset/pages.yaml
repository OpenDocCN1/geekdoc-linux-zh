  md: 'Using alternation, we perform a search for pathnames that contain bin/bz, bin/gz,
    or /bin/zip.


    # Searching for Text with less and vim


    less and vim share the same method of searching for text. Pressing the key followed
    by a regular expression will perform a search. We use less to view our phonelist.txt
    file:


    ```

    me@linuxbox~$ less phonelist.txt

    ```


    Then we search for our validation expression:


    ```

    (232) 298-2265

    (624) 381-1078

    (540) 126-1980

    (874) 163-2885

    (286) 254-2860

    (292) 108-518

    (129) 44-1379

    (458) 273-1642

    (686) 299-8268

    (198) 307-2440

    ```


    ```

    /^([0-9]{3\} [0-9]{3}-[0-9]{4}$

    ```


    less will highlight the strings that match, leaving the invalid ones to spot:


    ```

    (232) 298-2265

    (624) 381-1078

    (540) 126-1980

    (874) 163-2885

    (286) 254-2860

    (292) 108-518

    (129) 44-1379

    (458) 273-1642

    (686) 299-8268

    (198) 307-2440

    ```


    vim, on the other hand, supports basic regular expressions, so our search expression
    would look like this:


    ```

    /([0-9]{3\} [0-9]{3}-[0-9]{4}$

    ```


    We can see that the expression is the same; however, many of the characters that
    are considered metacharacters in extended expressions are considered literals
    in basic expressions. They are treated as metacharacters'
