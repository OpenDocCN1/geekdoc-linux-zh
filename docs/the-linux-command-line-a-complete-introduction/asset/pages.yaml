- pgno: 123
  md: 'As we see, the directory is owned by root and has 755 permissions. To make
    this directory shareable, bill needs to change the group ownership and the group
    permissions to allow writing:


    ```

    [bill@linuxbox] $ sudo chmod music /usr/local/share/Music

    [bill@linuxbox] $ sudo chmod 775 /usr/local/share/Music

    [bill@linuxbox] $ ls -ld /usr/local/share/Music

    drwxrxr-x 2 root music 4096 2012-03-21 18:05 /usr/local/share/Music

    ```


    So what does this mean? Now we have a directory owned by root and allows read
    and write access to group music. Group music has members bill and karen; both
    can create files in /usr/local/share/Music. Other users can use the contents of
    the directory but cannot create files there.


    But we still have a problem. With current permissions, bill and directories created
    in the Music directory will have the normal permissions of the users bill and
    karen:


    ```

    [bill@linuxbox] $ > /usr/local/share/Music/test_file

    [bill@linuxbox] $ ls -l /usr/local/share/Music

    -rw-r-- 1 bill 0 2012-03-24 20:23 test_file

    ```


    Actually there are two problems. The default umask on this system is 0022, which
    prevents members from writing files belonging to members of the group. This would
    not be a problem if the shared directory contained only files, but this directory
    will store music and music is usually organized in a hierarchy of artists and
    albums, members of the group will need the ability to create files and directories
    inside directories created by others. We need to change the umask used by bill
    and karen to 0002 instead.


    Second, each file and directory created by one member will be set to the primary
    group of the user, rather than the group music. This can be fixed by setting the
    umask for the directory:


    ```

    [bill@linuxbox] $ sudo chmod gs /usr/local/share/Music

    [bill@linuxbox] $ ls -ld /usr/local/share/Music

    drwxrxr-x 2 root music 4096 2012-03-24 20:03 /usr/local/share/Music

    ```


    Now we test to see if the new permissions fix the problem. bill sets his umask
    to 0002, removes the previous file, and creates a new test file and directory:


    ```

    [bill@linuxbox] ~ umask 0002

    [bill@linuxbox] ~ $ rm /usr/local/share/Music/test_file

    [bill@linuxbox] ~ > /usr/local/share/Music/test_file

    [bill@linuxbox] ~ $ mkdir /usr/local/share/Music/test_dir

    [bill@linuxbox] ~ $ ls -l /usr/local/share/Music

    drwxrxr-x 2 bill music 4096 2012-03-24 20:24 test_dir

    -rw-r-- 1 bill 0 2012-03-24 20:22 test_file

    [bill@linuxbox] ~$

    ```'
