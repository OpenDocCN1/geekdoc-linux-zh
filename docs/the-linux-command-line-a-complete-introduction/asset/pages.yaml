    # TUNNELING WITH SSH


    Part of what happens when you establish a connection with a remote host via SSH
    is that an encrypted tunnel is created between the local and remote systems. Normally,
    this tunnel is used to allow commands typed at the local system to be transmitted
    safely to the remote system and the results to be transmitted safely back. In
    addition to this basic function, the SSH protocol allows most types of network
    traffic to be sent through the encrypted tunnel, creating a sort of VPN (virtual
    private network) between the local and remote systems.


    The most common use of this feature is to allow X window traffic to be transmitted.
    On a system running an X server (that displaying a GUI), it is possible to launch
    and run an X client program (graph-ical application) on a remote system and have
    its display appear on the local system. It is easy to do—here''s an example. Let''s
    say we are sitting at a Linux system linuxbox is running an X server, and we want
    to run the xload program on a remote system named remote-sys and see the program''s
    graphical output on our local system. We do this by:


    ```

    [me@linuxbox ~]$ ssh -X remote-sys

    me@remote-sys''s password:

    Last login: Mon Sep 05 13:23:11 2011

    [me@remote-sys ~]$ xload

    ```


    After the xload command is executed on the remote system, its window appears on
    the local system. On some systems, you may need to use the -Y option rather than
    the -X to do this.


    # scp and sftp—Secure Transfer Files


    The OpenSSH package includes two programs that can make use of an SSH-encrypted
    tunnel to copy files across the network. The first, scp (secure copy) is used
    much like the familiar cp program to copy files. The most notable difference is
    that the source or destination pathname be preceded by the name of a remote host
    followed by a colon character. For example, if we wanted to copy a document document.txt
    from our home directory on the remote system, remote-sys, to the current working
    directory on our local system, we could do this:


    ```

    [me@linuxbox ~]$ scp remote-sys:document.txt

    me@remote-sys''s password:

    document.txt          100% 5581    5.5KB/s    00:00

    [me@linuxbox ~]$

    ```'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'As with ssh, you may apply a username to the beginning of the remote host''s
    name if the desired remote host account name does not match of the local system:


    ```

    ```\me@linuxbox~$ sftp bob@remote-sys:document.txt```

    ```


    The second SSH file-copying program is sftp, which, as its name implies, is a
    secure replacement for the ftp program. sftp works much like the original ftp
    program that we used earlier; however, instead of transmitting everything in cleartext,
    it uses an SSH-encrypted tunnel. sftp has an important advantage over conventional
    ftp in that it does not require an ftp server to be running on the remote host.
    It requires only the SSH server. This means that any remote machine that can connect
    with the SSH client can also be used as a FTP-like server. Here is a sample session:


    ```

    ```me@linuxbox~$ sftp remote-sys

    Connecting to remote-sys...

    me@remote-sys''s password:

    sftp> ls\ubuntu-8.04-desktop-i386.iso

    sftp> cd Desktop

    sftp> get ubuntu-8.04-desktop-i386.iso to ubuntu-8.04-desktop-i386.iso

    Fetching /home/me/ubuntu-8.04-desktop-i386.iso 100% 7.4MB/s 01:35

    sftp> bye```

    ```


    > Note: The SFTP protocol is supported by many of the graphical file managers
    found in Linux distributions. Using either Nautilus (GNOME) or Konqueror (KDE),
    we can enter a URI beginning with sftp:// into the location bar and operate on
    files stored on a remote system running SSH server.


    # AN SSH CLIENT FOR WINDOWS?


    Lets say you are sitting at a Windows machine but you need to log in to your Linux
    server and get some real work done. What do you do? Get an SSH client program
    for your Windows box, of course! There are number of these. The most popular one
    is probably PuTTY by Simon Tatham and his team. The PuTTY program displays a terminal
    window and allows a Windows user to open an SSH (or telnet) session on a remote
    host. The program also provides analogs for the scp and sftp programs.


    PuTTY is available at http://www.chiark.greenend.org.uk/~sgtatham/putty.'
  merge: -1
