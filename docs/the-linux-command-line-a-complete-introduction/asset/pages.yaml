    On a day-to-day basis, it might be easier to consider using two commands, one
    for the directories and one for the files, rather than this one large compound
    command, but it''s nice to know that we can do it this way. The important point
    is to understand how operators and actions can be used together to perform useful
    tasks.


    # Options


    Finally, we have the options. The options are used to control the scope of a find
    search. They may be included with other tests and actions when constructing find
    expressions. Table 17-8 lists the most used options.


    # Table 17-8: find Options


    | Option | Description |

    | --- | --- |

    | -depth | Direct find to process a directory''s files before the directory itself.
    This option is automatically applied when the -delete action is specified. |

    | -maxdepth levels | Set the maximum number of levels that find will descend into
    a directory tree when performing tests and actions. |

    | -minddepth levels | Set the minimum number of levels that find will descend
    into a directory tree before applying tests and actions. |

    | -mount | Direct find not to traverse directories that are mounted on other filesystems.
    |

    | -noleaf | Direct find not to optimize its search based on the assumption that
    it is searching a Unix-like filesystem. This is needed when scanning DOS/Windows
    filesystems and CD-ROMs. |'
