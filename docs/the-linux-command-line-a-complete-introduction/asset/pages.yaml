    # # Final Note


    As always, check out the documentation of each of the commands we have covered
    in this chapter. We have seen only few their most basic usage, and they all have
    a number of interesting options. As we Linux experience, we will see that the
    redirection feature of the command line is extremely useful for solving specialized
