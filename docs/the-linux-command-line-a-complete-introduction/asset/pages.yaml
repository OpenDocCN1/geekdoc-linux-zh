  md: '# sed-Stream Editor for Filtering and Transforming Text


    The name sed is short for stream editor. It performs text editing on text, a set
    of specified files or standard input. sed is a powerful and somewhat complex program
    (there are entire books about it), so we will not cover it completely here.


    In general, the way sed works is it given either a single editing command (on
    the command line) or the name of a script file containing multiple commands, and
    then it performs these commands upon each line in the stream of text. Here is
    a very simple example of sed in action:


    ```

    [me@linux ~] echo "front" | sed s/front/back/

    ```


    In this example, we produce a one-word stream of text using echo and pipe into
    it sed, in turn, carries out the instruction s/front/back upon upon text in the
    stream and produces the output back as a result. We can also recognize this command
    as resembling the substitution (search and replace) command in vi.


    Commands in sed begin with a single letter. In the example above, the substitution
    is represented by the letter s and is followed by the search and replace strings,
    separated by the slash character as a delimiter. The choice of the delimiter character
    is arbitrary. By convention, the slash character is often used, but sed will accept
    any character that immediately follows the command as the delimiter. We could
    perform the same command in this way:


    ```

    [me@linux ~] echo "front" | sed s_front_back_

    ```


    When the underscore character is used immediately after the command, it becomes
    the delimiter. The ability to set the delimiter can be used to make commands more
    readable, as we will see.


    Most commands in sed may be preceded by an address, which specifies which line(s)
    of the input stream will be edited. If the address is omitted, then the editing
    command is carried out on every line in the input stream. The simplest form of
    address is a line number. We can add one to our example:


    ```

    [me@linux ~] echo "front" | sed 1s/front/back/

    ```


    Adding the address 1 to our command causes our substitution to be performed on
    the first line of our one-line input stream. We can specify another number:


    ```

    [me@linux ~] echo "front" | sed 2s/front/back/

    ```'
  merge: -1
  img_proc: true
