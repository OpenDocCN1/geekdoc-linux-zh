    \ a shift to load $1 with the next argument. Here is the program at:\n\n```\n\
    [melinux]$ posit-param2 a b c d\nArgument 1 = a\nArgument 2 = b\nArgument 3 =\
    \ c\nArgument 4 = d\n```\n\n# Simple Applications\n\nEven without shift, it's\
    \ possible to write useful applications using positional parameters. By way of\
    \ example, here is a simple file-information program:\n\n```\n#!/bin/bash\n\n\
    # file-info: simple file information program\n\nPRONAME=$(basename $0)\n\nif [[\
    \ -e $1 ]];; then\n  echo -e \"\\nFile Type:\"\n  file $1\n  echo -e \"\\nFile\
    \ Status:\"\n  stat $1\nelse\n  echo \"$PRONAME: usage: $PRONAME file\" >&2\n\
    \  exit 1\nfi\n```\n\nThis program displays the file type (determined by the file\
    \ command) and the file status (from the stat command) of a specified file. One\
    \ interest-feature of this program is the PRONAME variable. It is given the value\
    \ that results from the basename $0 command. The basename command removes the"
