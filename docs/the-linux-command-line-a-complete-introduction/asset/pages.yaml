    # Comparing Text


    It is often useful to compare versions of text files. For system administrators
    and software developers, this is particularly important. A system administrator,
    for example, need to compare an existing configuration file to a previous version
    to diagnose a system problem. Likewise, a programmer needs to see what changes
    have been made to programs over time.


    # comm—Compare Two Sorted Files by Line


    The comm program compares text files, displaying the lines that are unique to
    each one and the lines they have in common. To demonstrate, we will create nearly
    identical text files using cat:


    ```

