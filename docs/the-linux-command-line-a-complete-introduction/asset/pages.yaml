  md: 'Now we see that the editing is not carried out, because our input stream does
    not have a line 2.

    Addresses may be expressed in many ways. Table 20-7 lists the most common ones.


    # Table 20-7: sed Address Notation


    | Address | Description |

    |---|---|

    | n | A line number where n is a positive integer |

    | $ | The last line |

    | /regex/ | Lines matching POSIX basic regular expression. Note that the regular
    expression is delimited by slash characters. Optionally, the regular expression
    may be delimited by an alternate character, by specifying the expression with
    \cregepc, where c is the alternate character |

    | add1,add2 | A range of lines from add1 to add2, inclusive. Addresses may be
    any of the single address forms above. |

    | first~step | Match the line represented by the number first and each subsequent
    line at step intervals. For example, 1~2 refers to each odd-numbered line, and
    5~5 refers to the fifth line and every fifth line thereafter. |

    | add1,+n | Match add1 and the following n lines. |

    | addr! | Match all lines except addr, which may be any of the forms above. |


    We’ll demonstrate different kinds of addresses using the distros.txt file from
    earlier in this chapter. First, a range of lines numbers:


    ```

    [me@linux ~]$ sed -n ''1,5'' distros.txt

