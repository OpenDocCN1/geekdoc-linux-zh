    # # Modifying the Environment


    Since we know where the startup files are and what they contain, we can modify
    them to customize our environment.


    # ## Which Files Should We Modify?


    As a general rule, add directories to your PATH or define additional environment
    variables, place those changes in .bash_profile (or equivalent, according to your
    distribution—example .profile). For everything else, place the changes in .bashrc.
    Unless you are the system administrator and need to change the defaults for all
    users of the system, restrict your modifications to the files in your home directory.
    It is certainly possible to change the files in /etc such as profile, and in many
    cases it would be sensible to do so, but for now let''s play it safe.


    # ## Text Editors


    To edit (i.e., modify) the shell''s startup files, as well as most of the other
    configuration files on the system, we use a program called a text editor. A text
    editor is a program that is, in some ways, like a word processor in that it allows
    you to edit the words on the screen with a word processor by supporting only pure
    text, and it often contains features designed for writing programs. Text editors
    are the central tool used by software developers to write code and by system administrators
    to manage the configuration files that control the system.


    A lot of editors are available for Linux; your system probably has several installed.
    Why so many different ones? Probably programmers like writing them, and so many
    programmers use editors extensively, to express their desires as how editors should
    work.


    Text editors fall into two categories: graphical and text based. GNOME and KDE
    include some popular graphical editors. GNOME ships with an editor called gedit
    is usually called Text Editor in the GNOME menu. KDE ships with three, which are
    (in order of increasing complexity) kedit, kwite, and kate.


    There are many text-based editors. The popular ones you will encounter are nano,
    vi, and emacs. The nano editor is a simple, easy-to-use editor designed as a replacement
    for the pico editor supplied with the PINE package. The vi editor (for most Linux
    systems replaced by a vim, which is short for Vi Improved) is the traditional
    editor for Unix-like systems.'
  merge: -1
  img_proc: true
