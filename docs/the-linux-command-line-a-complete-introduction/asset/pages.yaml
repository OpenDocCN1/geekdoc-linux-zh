- pgno: 99
  md: '# BACKSLASH ESCAPE SEQUENCES


    In addition to its role as the escape character, the backslash is also used as
    part of a notation to represent certain special characters called control codes.
    The first 32 characters in the ASCII coding scheme are used to transmit commands
    to teletype-like devices. Some of these codes are familiar (tab, backspace, linefeed,
    and carriage return), while others are not (null, end-of-transmission, acknowledge),
    as shown in Table 7-2.


    Table 7-2: Backslash Escape Sequences


    | Escape Sequence | Meaning |

    | --- | --- |

    | \a | Bell ("alert"—causes the computer to beep) |

    | \b | Backspace |

    | \n | Newline (on Unix-like systems, this produces a linefeed) |

    | \r | Carriage return |

    | \t | Tab |


    This table lists some of the common backslash escape sequences. The idea behind
    the backslash originated in the C programming language and has been adopted by
    many others, including the shell.

    Adding the -e option to echo will enable interpretation of escape sequences. You
    may also place them ''$ ''. Here, using the sleep command, a simple program that
    just waits for the specified number of seconds and then exits, can create a primitive
    countdown timer.


    ```

    sleep 10; echo "Time''s up\a"


    We could also do this:


    sleep 10; echo "Time''s up" $\a''

    ```


    # Final Note


    As we move forward with using the shell, we will find that expansions quoting
    will with increasing frequency, so it makes sense to get a good understanding
    of the way they work. In fact, it could be argued that they are the most important
    subjects to learn about the shell. Without a proper understanding of expansion,
    the shell will be a source of mystery and confusion, and much of its potential
    power will be wasted.'
