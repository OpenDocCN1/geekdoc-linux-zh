- pgno: 412
  md: '# # 32


    # ## POSITIONAL PARAMETERS


    One feature that has been missing from our programs is the ability to accept and
    process command-line options and arguments. In this chapter, we will examine the
    shell features that allow our programs to get access to the contents of the command
    line.


    # ## Accessing the Command Line


    The shell provides a set of variables *positional parameters* that contain the
    individual words on the command line. The variables are named 0 through9. They
    can be demonstrated this way:


    ```

    ```bash

    #!/bin/bash


    # posit-param: script to view command line parameters

    echo ""

    $0 = $0

    $1 = $1

    $2 = $2

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 413
  md: '\$3 = $3

    $4 = $4

    $5 = $5

    $6 = $6

    $7 = $7

    $8 = $8

    $9 = $9


    This very simple script displays the values of the variables $0 through $9. When
    executed with no command-line arguments:


    ```

    [me@linuxbox]$ posit-param


    $0 = /home/me/bin/posit-param

    $1 =

    $2 =

    $3 =

    $4 =

    $5 =

    $6 =

    $7 =

    $8 =

    $9 =

    ```


    Even when no arguments are provided, $0 will always contain the first item appearing
    on the command line, which is the pathname of the program being executed. When
    arguments are provided, we see the results:


    ```

    [me@linuxbox]$ posit-param a b c d


    $0 = /home/me/bin/posit-param

    $1 = a

    $2 = b

    $3 = c

    $4 = d

    $5 =

    $6 =

    $7 =

    $8 =

    $9 =

    ```


    You can actually access more than nine parameters using parameter expansion. To
    specify a number greater than nine, surround the number in braces; for example,
    $[10], $[55], $[211], and so on.


    # Determining the Number of Arguments


    The shell also provides a variable, $#, that yields the number of arguments on
    the command line:


    ```

    #!/bin/bash

    ```


    +   - posit-param: script to view command line parameters'
