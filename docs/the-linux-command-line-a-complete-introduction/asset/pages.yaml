    15794 ? S 0:00 kdeinit Running...

    15797 ? S 0:00 dcopsyserver -node

    ```


    and many more...


    Adding the x option (note that there is no leading dash) tells ps to show

    all of our processes regardless of which terminal (if any) they are controlled

    by The presence of a ? in the TTY column indicates no controlling terminal.

    Using this option, we see a list of every process we own.


    Since the system is running a lot of processes, ps produces a long list.

    is often helpful to pipe the output from ps into less for easier viewing. Some

    option also produce long lines of output, maximizing the

    terminal emulator might be a good idea, too.


    A new column STAT has been added to the output. STAT is short for

    state and reveals the current status of the process, as shown in Table 10-1.


    # Table 10-1: Process States


    | State | Meaning |

    | --- | --- |

    | R | Running. The process is running or ready to run. |

    | S | Sleeping. The process is not running; it is waiting for an event, such as
    a keystroke or network packet. |

    | D | Uninterruptible sleep. Process is waiting for I/O such as a disk drive.
    |

    | T | Stopped. Process has been instructed to stop (more on this later). |

    | Z | A defunct or "zombie" process. This is a child process that has terminated
    but has not been cleaned by its parent. |

    | < | A high-priority process. It''s possible to grant more importance to a process,
    giving it more time on the CPU. This property of a process is called niceness.
    A process with high priority is said to be nice because it''s taking more of the
    CPU''s time, which leaves for everybody else. |

    | N | A low-priority process. A process with low priority (a nice process) will
    get process only after other processes with higher priority have been served.
    |'
