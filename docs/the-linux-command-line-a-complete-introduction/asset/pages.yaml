- pgno: 441
  md: '# Table 34-5 (continued)


    | Operator | Description |

    | --- | --- |

    | != | Not equal to |

    | && | Logical AND |

    | || | Logical OR |


    expr1?expr2:expr3 Comparison (ternary) operator. If expression expr1 evaluates
    to non-zero (arithmetic true) then expr2, else expr3.


    When used for logical operations, expressions follow the rules of arithmetic logic;
    that is, expressions as 0 are considered false, while non-zero expressions are
    considered true. The (( )) compound command maps the results into the shell''s
    normal exit:


    ```

    me[linuxbox ~]$ if ((1)); then echo "true"; else echo "false"; fi

    me[linuxbox ~]$ if ((0)); then echo "true"; else echo "false"; fi

    ```


    The strongest of logical operators is the ternary operator. This operator (which
    is modeled after the one in the C programming language) performs a standalone
    logical test. It can be used as a kind of if/then/else statement. It on three
    arithmetic expressions (strings won''t work), and if the first expression is true
    (or non-zero), the second expression is performed. Otherwise, the third expression
    is performed. We can try this on the command line.


    ```

    me[linuxbox ~]$ a=0

    me[linuxbox ~]$ ((a1?+a:-a))

    me[linuxbox ~]$ echo $a

    1

    me[linuxbox ~]$ ((a1?+a:-a))

    ```


    ```

    me[linuxbox ~]$ echo $a

    0

    ```


    Here use a ternary operator in action. This example implements a toggle. Each
    time the operator is performed, the value of the variable switches from 0 to 1
    or vice versa.


    Note that performing assignment within the expressions is not straightforward.
    When this is attempted, bash will declare the error:


    ```

    me[linuxbox ~]$ a=0

    me[linuxbox ~]$ ((a1?a=1:a=-1))

    bash: (( a1?a=1:a=-1: attempted assignment to non-variable (error token is "=1"))

    ```


    410 Chapter 34'
