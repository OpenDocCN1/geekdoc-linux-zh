    the working directory is changed to the user''s home directory. This is usually
    what we want. If the user is not specified, the superuser is assumed. Notice that
    (strangely) the -l may be abbreviated as -, which is how it is most often used.
    To start a shell for the superuser, we would do this:


    ```

    [@linuxbox ~$ su

    Password:

    [root@linuxbox ~]

    ```


    After entering the command, we are prompted for the superuser''s password. If
    it is successfully entered, a new shell appears indicating that this shell has
    superuser privileges (the trailing # rather than $) and that the current working
    directory is the home directory for the superuser (normally /root). Once in the
    new shell, we can carry out commands as the superuser. When finished, exit to
    return to the previous shell:


    ```

    [@linuxbox ~]# exit

    [@linuxbox ~$]

    ```


    It is also possible to execute a single command rather than starting a new interactive
    command by using this way:


    ```

    su -c ''command''

    ```


    Using this form, a single command line is passed to the new shell for execution.
    It is important to enclose the command in quotes, as we do not want to expand
    any variable in our shell before the new shell starts:


