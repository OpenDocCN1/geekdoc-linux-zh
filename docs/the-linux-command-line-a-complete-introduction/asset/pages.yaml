    # Secure Communication with Remote Hosts


    For many years, Unix-like operating systems have had the ability to be administered
    remotely via a network. In the early days, before the general adoption of the
    Internet, there were a couple of popular programs used to log in remote hosts:
    the rlogin and telnet. These programs, however, suffered from the same fatal flaw
    that the ftp program does; they transmit all communications (including login names
    and passwords) in cleartext. These methods were wholly inappropriate for the Internet
    age.


    # SSH Secure Log in Remote Computers


    To address this problem, a new protocol called SSH (Secure Shell) was developed.
    SSH solves the two basic problems of secure communication with a remote host.
    First, it authenticates the remote host who says it is (thus preventing man-in-the-middle
    attacks), and second it encrypts all of the communications between the local and
    remote hosts.


    SSH consists of two parts. An SSH server runs on the remote host, listening for
    incoming connections on port 22, while an SSH client is used on the local system
    to communicate with the remote server.


    Most Linux distributions have an implementation of SSH called OpenSSH from the
    BSD project. Some distributions include both the client and the server packages
    while others (such as Red, Ubuntu) supply only the client. To enable a system
    to receive remote connections, it must have the OpenSSH-server package installed,
    configured, and running, and (if the system is either running or behind a firewall)
    it must allow incoming network connections over TCP port 22.


    > Note: If you don''t have a remote system to connect to but want to try these
    examples, make sure the OpenSSH-server package is installed on your system and
    use localhost as the name of the remote host. That way, your machine will create
    network connections itself.'
  merge: -1
  img_proc: true
