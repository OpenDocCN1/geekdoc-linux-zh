  md: '# Table 5-1: Man Page Organization


    | Section | Contents |

    | 1 | User commands |

    | 2 | Programming interfaces for kernel system calls |

    | 3 | Programming interfaces to the C library |

    | 4 | Special files as device nodes and drivers |

    | 5 | File formats |

    | 6 | Games and amusements such as screensavers |

    | 7 | Miscellaneous |

    | 8 | System administration commands |


    Sometimes we need to look in a specific section of the manual to find what we
    are looking for. This is particularly true if we are looking for a file format
    that is also the name of a command. If we don''t specify a section number, we
    will always get the first instance of a match, probably in section 1. To specify
    a section number, we use man like this:


    ```

    man section search_term

    ```


    For example:


    ```

    ~linuxbox ~$ man 5 passwd

    ```


    will display the man page describing the file format of the /etc/passwd file.


    # apropos—Display Appropriate Commands


    It is possible to search the list of man pages for possible matches based on a
    search term. Though crude, this approach is sometimes helpful. Here is an example
    of a search for man pages using the term floppy:


    ```

    ~linuxbox ~$ apropos floppy

    create_floppy_devices (8) - udev callout to create all possible floppy device
    based on the CMOS type

    dfformat (8) - Low-level formats a floppy disk

    floppy - floppy disks

    gfloppy (1) - a simple floppy formatter for the GNOME

    mbadblocks (1) - tests a floppy disk, and marks the bad blocks in the FAT

    fformat - add an mDOS2 filesystem to a low-level formatted floppy disk

    ```


    The first field in each line of output is the name of the man page, and the second
    field shows the section. Note that the man command with the -k option performs
    exactly the same function as apropos.'
