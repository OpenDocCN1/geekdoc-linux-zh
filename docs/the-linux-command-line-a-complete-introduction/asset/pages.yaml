    bzip2

    gunzip

    gzip

    unzip

    zip

    zipcloak

    zipgrep

    zipinfo

    zipnote

    zipsplit

    ```


    There are a couple of handy options for grep: -i, which causes grep to ignore
    case performing the search (normally searches are case sensitive) and -v, which
    tells grep to print only lines that do not match the pattern.


