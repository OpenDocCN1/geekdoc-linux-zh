  md: "# Outputting the Entire Contents of an Array\n\nThe subscripts * and @ can\
    \ be used to access every element in an array. with positional parameters, the\
    \ @ notation is the more useful of the two.\nHere is a demonstration:\n\n```\n\
    me@linuxbox ~$animals=\"a dog\" \"a cat\" \"a fish\"\n@linuxbox ~$ for i in ${animals[*]};\
    \ do echo $i; done\ndog\na\ncat\na\nish\n@linuxbox ~$ for i in ${animals[@]};\
    \ do echo $i; done\ndog\na\ncat\na\nfish\nme@linuxbox ~$ for i in \"${animals[*]}\"\
    ; do echo $i;\ndog a cat fish\nme@linuxbox ~$ for i in \"${animals[@]}\"; do echo\
    \ $i;\ndog\na\ncat\na\fish\n```\n\nWe create the array animals and assign it three\
    \ two-word strings. We then execute four loops to see the effect of word-splitting\
    \ on the array contents. The behavior of notations ${*} and ${[@]} is identical\
    \ when they are quoted. The * notation results in a single word containing the\
    \ array’s contents, while the @ notation results in three words, which matches\
    \ the array’s “real” contents.\n\n# Determining the Number of Array Elements\n\
    \nUsing parameter expansion, we can determine the number of elements in an array\
    \ in the same way as finding the length of a string. Here is an example:\n\n```\n\
    me@linuxbox ~$ a[100]=foo\n@linuxbox ~$ echo ${#[@]} # number of array elements\n\
    1\n@linuxbox ~$ echo ${#[@]} # length of element 100\n```\n\nWe create array a\
    \ and assign the string to element 100. Next, we use parameter expansion to examine\
    \ the length of the array, using the @ notation. Finally, we look at the length\
    \ of element 100, which contains the string foo. It is interesting to note that\
    \ while we assigned our string to element 100, bash reports only one element in\
    \ the array. This differs from the behavior of some other languages, in which\
    \ the unused elements of the array (0–99) would be initialized with empty values\
    \ and counted."
