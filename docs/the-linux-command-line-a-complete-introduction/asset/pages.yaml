- pgno: 439
  md: "language and has been incorporated by several other programming languages,\
    \ including bash.\n\nThe operators may appear either at the front of a parameter\
    \ or at the end. While they either increment or decrement the parameter by 1,\
    \ the two placements have a subtle difference. If placed at the front of the parameter,\
    \ the parameter is incremented (or decremented) before the parameter is returned.\
    \ If placed after, the operation is performed after the parameter is returned.\
    \ This is rather strange, but it is the intended behavior. Here is\n\n```\nme@linux\
    \ ~$ foo=1\nme@linuxbox ~$ echo $((foo))\n1\nme@linuxbox ~$ echo $foo\n```\n\n\
    If we assign the value of 1 to the variable foo and increment it with the ++ operator\
    \ placed after the parameter name, foo is returned with the value of 1. However,\
    \ if we look at the value of a variable second time, we see the increased value.\
    \ If we place the ++ operator in front of the parameter, we get this expected\
    \ behavior:\n\n```\nme@linuxbox ~$ foo=1\nme@linuxbox ~$ echo $((foo))\n2\nme@linuxbox\
    \ ~$ echo $foo\n```\n\nFor most shell applications, prefixing the operator will\
    \ be the most useful.\nThe ++ and -- operators are often used in conjunction with\
    \ loops. We will make some improvements to our modulo script to tighten it up\
    \ a bit:\n\n```\n#!/bin/bash\n\n# modulo 2 : demonstrate the modulo operator\n\
    \nfor ((i = 0; i < 20; ++i)); do\n\tif ((i % 5) == 0)); then\n\t\tprintf \"<d>\"\
    \ $i\n\telse\n\t\tprintf \"%d\" $i\n\tif\ndone\nprintf \"\\n\"\n```\n\n# Bit Operations\n\
    \nOne class of operators manipulates numbers in an unusual way. These operators\
    \ are used for certain kinds of low-level tasks, often involving setting or reading\
    \ bit flags. Table 34-4 lists the bit operators."
