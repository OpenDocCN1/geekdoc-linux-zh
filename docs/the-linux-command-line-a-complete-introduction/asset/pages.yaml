    Inc.

    This is free software with ABSOLUTELY NO WARRANTY.

    For details type ''warranty''.


    If we look closely, we can see the result at the very bottom, after the copyright
    message. This message can be suppressed with the -q (quiet) option.

    b can also be used interactively:


    ```

    @linuxbox ~$ bc -q

    2 + 2

    4

    quit

    ```


    When using bc interactively, we simply type the calculations we wish to perform,
    and the results are immediately displayed. The bc command quit ends the interactive
    session.


    It is also possible to pass a script to bc via standard input:


    ```

    @linuxbox ~$ bc foo.bc

    4

    ```'
