- pgno: 336
  md: 'It produces only this strange message. What’s going on? Why didn’t it build
    the program again? Ah, this is the magic of make. Rather than simply building
    everything again, make builds only what needs building. With all of the targets
    present, make determined that there was nothing to do. We can demonstrate this
    by deleting one of the targets and running make again to see what it does.


    ```

    @linuxbox diction-1.11]$ $ make getopt.o

    @linuxbox diction-1.11]$ $ make

    ```


    We see that make rebuild getopt.o and relinks the diction and style programs,
    since they depend on the missing module. This behavior also points out another
    important feature of make: It keeps targets up-to-date. Make insists that targets
    are nearer than their dependencies. This makes sense, as a programmer will often
    update a bit of source code and then use make to build a new version of the finished
    product. Make ensures that everything needs building based on the updated code
    is. If we use the touch program to “update” of the source code files, we can see
    this with happen:


    ```

    @linuxbox diction-1.11]$ $ ls -1 diction getopt.c

    -TWX-XR -X 1 me 37164 2009-03-05 06:14 diction

    @linuxbox diction-1.11]$ $ ls -1 touch getopt.c

    -W-XR--R - 1 me 33125 2007-03-30 17:45 getopt.c

    @linuxbox diction-1.11]$ $ ls -1 diction getopt.c

    -TWX-XR -X 1 me 37164 2009-03-05 06:14 diction

    -W-XR--R-- 1 me 33125 2009-03-05 06:23 getopt.c

    ```


    After make runs, we see that it has restored the target to being nearer than the
    dependency:


    ```

    @linuxbox diction-1.11]$ ls -1 diction getopt.c

    -TWX-XR -X 1 me 37164 2009-03-05 06:24 diction

    -W-XR--R-- 1 me 33125 2009-03-05 06:23 getopt.c

    ```


    The ability of make to intelligently build only what needs building is a great
    benefit to programmers. While the time savings may not be apparent with our small
    project, it is significant with larger projects. Remember, the Linux kernel (a
    program that undergoes continuous modification and improvement) contains several
    million lines of code.


    # Installing the Program


    Well-packaged source code often includes a special make target install. This target
    will install the final product in a system directory for use. Usually, this directory
    is /usr/local/bin, the traditional location for locally built software. This directory
    is not normally writable by ordinary users, so we must become the superuser diction-1.11
    to perform the installation:


    ```

    @linuxbox diction-1.11]$ sudo make install

    ```'
  merge: -1
  img_proc: true
