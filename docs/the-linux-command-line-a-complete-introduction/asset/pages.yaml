- pgno: 384
  md: 'The <<< operator indicates here a string. A here string is like a document,
    only shorter, consisting of a single string. In our example, the line of data
    from the /etc/passwd file is fed to the standard input of the read command. We
    might wonder why this rather oblique method was chosen rather than


    ```

    echo "$file_info" | IFS=":":" read user pw gid name home shell

    ```


    Well, there''s a reason . . .


    # YOU CAN''T PIPE READ


    While the read command normally takes input from standard input, you cannot do
    this:


    ```

    echo "foo" | read

    ```


    We would expect this to work, but it does not. The command will appear to succeed,
    and the REPLY variable will always be empty. Why is this?


    The explanation has to do with the way the shell handles pipelines. In bash (and
    other shells as sh) pipelines create subshells. These are copies of the shell
    and its environment are used to execute the command in the pipeline. In our previous
    example, read is executed in a subshell.


    Subshells in Unix-like systems create copies of the environment for the processes
    to use while they execute. When the processes finish, the copy of the environment
    is destroyed. This means that a subshell can never alter the environment of its
    parent process. In the example above, read assigns variables, which then become
    part of the environment. read assigns the value foo to the variable in its subshell''s
    environment, but when the command exits, the subshell and its environment are
    destroyed, and the effect of the assignment is lost.


    Using strings is one way to work around this behavior. Another method is discussed
    in Chapter 36.


    # Validating Input


    With our new ability to have keyboard input comes an additional programming challenge:
    validating input. Very often the difference between a well-written program and
    a poorly written one lies in the program''s ability to deal with unexpected. The
    unexpected appears in the form of bad input. We did a little of this with our
    evaluation programs in the previous chapter, where we checked the values of integers
    and screened out empty values and non-numeric characters. It is important to perform
    these kinds of programming checks every time a program receives input to guard
    against invalid data. This is especially important for programs that are shared
    by multiple users. Omitting these safeguards in the interests of economy might
    be excused if a program is to be used once and only by the author'
  merge: -1
  img_proc: true
