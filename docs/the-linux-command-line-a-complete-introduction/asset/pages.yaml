- pgno: 221
  md: "Adding the test -type d limited the search to the directories. Conversely,\
    \ we could have limited the search to regular files with this test:\n\n```\n$me@linuxbox$\
    \ find -type f | wc -1\n38737\n```\n\nTable 17-1 lists the common file-tests supported\
    \ by find.\n\n# Table 17-1: find File Types\n\n| File Type | Description |\n|\
    \ b | Block special device file |\n c | Character special device file |\n| d |\
    \ Directory |\n f | Regular file |\n| l | Symbolic link |\n\nWe can also search\
    \ by file size and filename by adding some additional tests. Let's look for all\
    \ the regular files that match the wildcard pattern *.JPG and are larger than\
    \ 1 megabyte:\n\n```\n$me@linuxbox$ find -type name \"*.JPG\" -size +1M | wc -1\n\
    840\n```\n\nIn this example, we add the -name test followed by the wildcard pattern.\
    \ Notice that we enclose it in quotes to prevent pathname extension by the shell.\
