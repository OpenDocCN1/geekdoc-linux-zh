  md: '# Arithmetic Expansion


    The shell allows arithmetic to be performed by expansion. This allows us to use
    the shell prompt as a calculator:


    ```

    me@linuxbox ~$ echo $((2 + 2))

    ```


    Arithmetic expansion uses the following form:


    ```

    $((expression))

    ```


    where expression is an arithmetic expression consisting of values and arithmetic
    operators.


    Arithmetic expansion supports only integers (whole numbers, no decimals) but can
    perform a number of different operations. Table 7-1 lists a few of the supported
    operators.


    # Table 7-1: Arithmetic Operators


    | Operator | Description |

    | --- | --- |

    | + | Addition |

    | - | Subtraction |

    | * | Multiplication |

    | / | Division (But remember, because expansion supports only integer arithmetic,
    results are integers.) |

    | % | Modulo, which simply means remainder |

    | ** | Exponentiation |


    Spaces are not significant in arithmetic expressions, and expressions may be nested.
    For example, multiply 5^2 by 3:


    ```

    me@linuxbox ~$ echo($((**2)) * 3))

    ```


    Single parentheses may be used to group multiple subexpressions. With this technique,
    we can rewrite the example above and get the same result instead of:


    ```

    me@linuxbox ~$ echo($(**2) * 3))

    ```


    Here is an example using the division and remainder operators. Notice the effect
    of integer division:


    ```

    me@linuxbox ~$ Five divided by two equals $((5/2))

    ```'
  merge: -1
  img_proc: true
