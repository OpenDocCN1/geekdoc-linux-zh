- pgno: 460
  md: 'The mktemp program accepts a template as an argument that is used to build
    the filename. The template should include a series of X characters, which are
    replaced by a corresponding number of random letters and numbers. The longer the
    series of X characters, the longer the series of random characters. Here is an
    example:


    ```

    tempfile=$(mktemp /tmp/foobar.$\$.XXXXXXXXXX)

    ```


    This creates a temporary file and assigns its name to the variable file. The X
    characters in the template are replaced with random letters and numbers so that
    the final filename (which, in this example, also includes the expanded value of
    the special parameter $ to obtain the PID) might be something like


    ```

    /tmp/foobar.6593.02uvm6654

    ```


    While the mktemp page states that mktemp makes a temporary filename, mktemp also
    creates the file as well.

    For scripts that are executed by regular users, it may be wise to avoid the use
    of the /tmp directory and create a directory for files within the user''s home
    directory, with a line of code as such:


    ```

    [[ -d $HOME/tmp ]] || mkdir $HOME/tmp

    ```


    # Asynchronous Execution


    It is sometimes desirable to perform more than one task at the same time. We have
    seen that all modern operating systems are at least multitasking for not multiuser
    users. Scripts can be constructed to behave in multitasking fashion.


    Usually this involves launching a script that, in turn, launches one or more child
    scripts that perform an additional task while the parent script continues to run.
    However, when a series of scripts runs this, there can be problems keeping the
    parent and child coordinated. That is, what if the parent or child is dependent
    on the other, and one script must wait for the other to finish its task before
    finishing its own?


    bash has a built-in command to help manage asynchronous execution as this. The
    wait command causes a parent script to pause until a specified process (i.e.,
    the child script) finishes.


    # wait


    We will demonstrate the wait command first. To do this, we will need two scripts.
    Here is the parent script:


    ```

    #!/bin/bash


    # async-parent : Asynchronous execution demo (parent)


    echo "Parent: starting..."

    ```'
  merge: -1
  img_proc: true
- pgno: 461
  md: 'echo "Parent: launching child script..."

    async-child &

    pid=$spid

    echo "Parent: child (PID=$spid) launched."


    echo "Parent: continuing..."

    sleep 2


    echo "Parent: pausing to wait for child to finish..."

    wait $spid


    echo "Parent: child is finished. Continuing..."

    echo "Parent: parent is done. Exiting."


    And here is the child script:


    ```

    #!/bin/bash

    ```


    # async-child : Asynchronous execution demo (child)


    echo "Child: child is running..."

    sleep 5

    echo "Child: child is done. Exiting."


    In this example, we see that the child script is very simple. The real action
    is being performed by the parent. In the parent script, the child script is launched
    and put into the background. The process ID of the child script is recorded by
    assigning the pid variable with the value of the $ shell parameter, which will
    always contain the process ID of the last job put into the background.


    The parent script continues and executes a wait command with the PID of the child
    process. This causes the parent script to pause until the child script exits,
    at which point the parent and child scripts produce the following


    ```

    [@linux~$] $ async-parent

    Parent: starting...

    Parent: launching child script...

    Parent: child (PID= 6741) launched.

    Parent: continuing...

    Child: is running...

    Parent: pausing to wait for child to finish...

    Child: child is done. Exiting.

    Parent: child is finished. Continuing...

    Parent: parent is done. Exiting.

    ```


    # Named Pipes


    In many Unix-like systems, it is possible to create a special type of file called
    a named pipe. Named pipes are used to create a connection between two processes
    and be used just like other types of files. They are not popular, but they''re
    good to know about.'
  merge: -1
  img_proc: true
- pgno: 462
  md: 'There is a common programming architecture called client/server, which can
    make use of a communication method such as named pipes, as well as other kinds
    of interprocess communication such as network connections.


    The widely used type of client/server system is, of course, a browser communicating
    with a web server. The web browser acts as the client, making requests to the
    server, and the server responds to the browser with web pages.


    Named pipes behave like files but actually form first-in, first-out (FIFO) buffers.
    With ordinary (unnamed) pipes, data goes in one end and emerges out of the other.
    With named pipes, it is possible to set up something like this:


    ```

    process1 > named_pipe

    ```


    and


    ```

    process2 < named_pipe

    ```


    and it will behave as if


    ```

    process1 | process2

    ```


    # Setting Up a Named Pipe


    First, we create a named pipe. This is done using the mkfifo command:


    ```

    [linuxbox] ~$ mkfifo pipe1

    [linuxbox] ~$ ls -1 pipe1

    pw-r--r-- 1 me 0 2012-07-17 06:41 pipe1

    ```


    Here we use mkfifo to create a named pipe called. Using ls, we examine the file
    and see that the first letter in the attributes field is p, indicating that it
    is a named pipe.


    # Using Named Pipes


    To demonstrate how the named pipe works, we will need two windows (or, alternatively,
    two virtual consoles). In the first terminal, we enter a simple command and redirect
    its output to the named pipe:


    ```

    [linuxbox] ~$ ls -l > pipe1

    ```


    After we ENTER, the command will appear to hang. This is because there is nothing
    receiving data from the other end of the pipe yet. When this occurs, it is said
    that the pipe is blocked. This condition will clear once we attach a process to
    the other end and it begins to read input from the pipe. Using the second terminal
    window, we enter this command:


    ```

    [linuxbox] ~$ cat < pipe1

    ```


    The directory listing produced from the first terminal appears in the second terminal
    as the output from the cat command. The command in the first terminal successfully
    completes once it is no longer blocked.'
  merge: -1
  img_proc: true
