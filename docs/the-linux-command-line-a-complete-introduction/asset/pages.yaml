- pgno: 442
  md: "This problem can be mitigated by surrounding the assignment expression with\
    \ parentheses:\n\n```\n$me@linuxbox ~$ ${(ac1?(a=1):(a=-1))\n```\n\nNext, we see\
    \ a more comprehensive example of using arithmetic operators in a script that\
    \ produces a simple table of numbers:\n\n```\n#!/bin/bash\n\n# arithmetic-loop:\
    \ script to demonstrate arithmetic operators\n\nfinished=0\na=0\nprintf \"%ta**2\\\
    t**3\\n\"\nprintf \"%t====\\t====\\n\"\n\nuntil ((finished)); do\n  b=$((a**2))\n\
