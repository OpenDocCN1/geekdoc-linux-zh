- pgno: 218
  md: "# # 17\n SEARCHING FOR FILES\n\nAs we have wandered around our Linux system,\
    \ one thing has become abundantly clear: A typical Linux system has a lot of files!\
    \ This raises the question “How do we find files?” We already know that the Linux\
    \ filesystem is well organized according to conventions that have been passed\
    \ down from one generation of Unix-like systems to the next, but the sheer number\
    \ of files can present a daunting problem.\n\nIn this chapter, we will look at\
    \ two tools that are used to find files on a system:\n\n+   - locate—Find files\
    \ by name.\n- find—Search for files in a directory hierarchy.\n\nWe will also\
    \ look at a command that is often used with file-search commands to process the\
    \ resulting list of files:\n\n+   - xargs—Build and execute command lines from\
    \ standard input."
  merge: -1
  img_proc: true
- pgno: 219
  md: 'In addition, we will introduce a couple of commands to assist us in our explorations:


    +   - touchChange file times.

    - stat—Display file or filesystem status.


    # locate—Find Files the Easy Way


    The locate program performs a rapid database search of patterns and then outputs
    every name that matches a given substring. Say, for example, we want to find all
    the programs that begin with zip. Since we are looking for programs, we can assume
    the name of the directory containing the programs would end with bin/. Therefore,
    we could try to use locate to find our files:


    ```

    [melinuxbox ~]$ locate bin/zip

    ```


    locate will search its database of patterns and output any that may contain the
    string bin/zip:


    ```

    /usr/bin/zip

    /usr/bin/zipcloak

    /usr/bin/zipgrep

    /usr/bin/zipinfo

    /usr/bin/zipnote

    /usr/bin/zipsplit

    ```


    If the search requirement is not so simple, locate can be combined with other
    tools, such as grep, to design more interesting searches:


    ```

    [melinuxbox ~]$ locate zip | grep bin

    /bin/binzip2

    /bin/bzip2

    /bin/bzip2recover

    /bin/gunzip

    /bin/gzip

    /usr/bin/funzip

    /usr/bin/gpg-zip

    /usr/bin/preunzip

    /usr/bin/prezip

    /usr/bin/prezip-bin

    /usr/bin/unzip

    /usr/bin/unzipsfx

    /usr/bin/zip

    /usr/bin/zipcloak

    /usr/bin/zipprep

    /usr/bin/zipinfo

    /usr/bin/zipnote

    /usr/bin/zipsplit

    ```


    The locate program has been around for a number of years, and several different
    variants are in common use. The two most common found in modern Linux distributions
    are locate and mlocate, though they are usually'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'accessed by a symbolic link named locate. The different versions of locate
    have overlapping options sets. Some versions include regular-expression matching
    (which we''ll cover in Chapter 19) and wildcard support. Check the man page for
    locate to determine which version of locate is installed.


    # WHERE DOES THE LOCATE DATABASE COME FROM?


    You may notice that, on some distributions, locate fails to work after the system
    is installed, if you try the next day, it works. What gives? The locate database
    is created by another program named updated. Usually, it is run periodically as
    a cron job; that is, a task performed at regular intervals by the cron daemon.
    Most systems equipped with locate run updated once a day. Since the database is
    not updated continuously, you will notice that very recent files do not show up
    using locate. To overcome this, it''s possible to run the updated program manually
    by becoming the superuser and running updated at the prompt.


    # findFind Files The Hard


    While the locate program can find a file based on its name, the find program searches
    a given directory (and subdirectories) for files on a variety of attributes. We''re
    going to spend a lot of time with find because it has a bunch of interesting features
    that we will see again and when we start to cover programming concepts in later
    chapters.


    In its simplest use, find is given one or more names of directories to search.
    For example, it can produce a list of our home directory:


    ```

    @linuxbox~$ find ~

    ```


    On most active user accounts, this will produce a large list. Since the list is
    sent to standard output, we can pipe the list into other programs. We will use
    wc to count the number of files:


    ```

    @linuxbox~$ find ~ | wc -1

    47068

    ```


    Wow, we''ve been busy! The beauty of find is that it can be used to identify files
    that meet specific criteria. It does this through the (slightly strange) application
    of tests, actions, and options. We''ll look at the tests first.


    # Tests


    Let''s say we want a list of directories from our search. To do this, we could
    add the following test:


    ```

    @linuxbox~$ find ~ -type d | wc -1

    1695

    ```'
