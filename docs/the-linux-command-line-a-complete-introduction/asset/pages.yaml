- pgno: 187
  md: 'Example: See a description of the emacs package on a Debian-style system:

    apt-cache show emacs


    # Finding Which Package Installed a File


    To determine which package is responsible for the installation of a particular
    file, the commands shown in Table 14-12 can be used.


    # Table 14-12: Package File Identification Commands


    | Style | Command |

    |---|---|

    | Debian | dpkg --search file_name |

    | Red Hat | rpm -qf file_name |


    Example: See which package installed the /usr/bin/vim on a Red Hat system:

    rpm -qf /usr/bin/vim


    # Final Note


    In the chapters that follow, we will explore many programs covering a wide range
    of application areas. While most of these programs are commonly installed by default,
    sometimes we may need to install additional packages. With our newfound knowledge
    (and appreciation) of package management, we should have no problem installing
    and managing the programs we need.


    # THE LINUX SOFTWARE INSTALLATION MYTH


    Migrating from other platforms sometimes fall victim to the myth that software
    is somewhat difficult to install under Linux and that the variety of packaging
    schemes used by different distributions is a hindrance. Well, it is a hindrance,
    but only to proprietary software vendors who wish to distribute binary-only versions
    of their secret software.


    The Linux ecosystem is based on the idea of open source code. If a program develops
    source code for a product, it is likely that a person associated with a distribution
    will package the product and include it in the repository. This method ensures
    that the product is well integrated into the distribution and the user is given
    the convenience of one-stop shopping for software, rather than having to search
    for each product''s website.


    Device drivers are handled in the same way, except instead of being separate items
    in a distribution''s repository, they become part of the Linux kernel itself.
    Generally speaking, there is no such thing as a "driver disk"'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'in Linux. Either the kernel supports a device or it doesn''t, and the Linux
    kernel supports a lot of devices. Many more, in fact, than Windows does. Of course,
    this is no consolation if the particular device you need is not supported. When
    that happens, you need to look for the cause. A lack of driver support is usually
    caused by one of three things:


    +   * The device is too new. Since many hardware vendors don''t actively support
    Linux development, it falls upon a member of the Linux community to write the
    kernel driver code. This takes time.


    +   * The device is too exotic. Not all distributions include every possible device
    driver. Each distribution builds its own kernels, and since kernels are very configurable
    (which is what makes it possible to run Linux on everything from wristwatches
    to mainframes), the distribution may have overlooked a particular device. By locating
    and downloading the source code for the driver, it is possible for you (yes, you)
    to compile and install the driver yourself. This process is not overly difficult,
    but it is rather involved. We''ll talk about compiling software in Chapter 23.


    +   * The hardware vendor is hiding something. It has neither released source
    code for a Linux driver, nor has it released the technical documentation for somebody
    else to create one. This means that the hardware vendor is trying to keep the
    programming interfaces to the device secret. Since we don''t want secret devices
    in our computers, I suggest that you remove the offending hardware and pitch it
    into the trash with your other useless items.'
