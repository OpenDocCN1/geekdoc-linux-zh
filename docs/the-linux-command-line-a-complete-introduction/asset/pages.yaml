    # grep—Print Lines Matching a Pattern


    grep is a powerful program used to find text patterns within files, like this:
    grep pattern [file..].


    Grep encounters a “pattern” in file, it prints the lines containing it. The patterns
    that grep match can be very complex, but for now we will concentrate on simple
    text matches. We''ll cover the advanced patterns, called *regular expressions*,
    in Chapter 19.


    Let''s say we want to find all the files in our list of programs that have the
    zip in the name. Such a search might give us an idea of what programs our system
    have something to do with compression. We would do this:


    ```

