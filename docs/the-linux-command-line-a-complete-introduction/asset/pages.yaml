  md: '# Parameter Expansion


    We''re only going to touch briefly on parameter expansion in this chapter, but
    we''ll be covering it extensively later. It''s a feature that is more useful in
    shell scripts than directly on the command line. Many of its capabilities do to
    do with the system''s ability to store small chunks of data and give each chunk
    name. Many such, more properly called variables, are available for your examination.
    For example, the variable USER contains your username. To invoke parameter expansion
    and reveal the contents of USER, you would do this:


    ```

    [linuxbox ~]$ echo $USER

    ```


    To see a list of available variables, try this:


    ```

    [linuxbox ~]$ printenv | less

    ```


    You may have noticed that with other types of expansion, if you type a pattern,
    the expansion will not take place and the echo command will simply display the
    mistyped pattern. With parameter expansion, if you miss the name of a variable,
    the expansion will still take place but will result in an empty string:


    ```

    [linuxbox ~]$ echo $SUER

    ```


    ```

    [linuxbox ~]$

    ```


    # Command Substitution


    Command substitution allows us to use the output of a command as an expansion:


    ```

    [linuxbox ~]$ echo $(ls)

    ```


    Desktop Documents ls-output.txt Music Pictures Public Templates


    One of my favorites goes something like this:


    ```

    [linuxbox ~]$ ls -l $(which cp)

    -rw-r--r-- 1 root 71516 2012-12-05 05:58 /bin/cp

    ```


    Here we pass the result of cp as an argument to the ls command, thereby getting
    the listing of the cp program without having to know its pathname. We are not
    limited to simple commands. Entire pipelines can be used (only partial shown):


    ```

    [linuxbox ~]$ file $(ls /usr/bin/* | grep zip)

    /usr/bin/bzip2:

    symbolic link to ''bzip2''

    ELF 32-bit LSB executable, Intel 80386, version 1 (SYSV),\ydynamically linked
    (shared libs), GNU/Linux 2.6.9, stripped

    /usr/bin/bzip2recover: ELF 32-bit LSB executable, Intel 80386, version 1 (SYSV),\ydynamically
    linked (shared libs), GNU/Linux 2.6.9, stripped

    /usr/bin/funzip: ELF 32-bit LSB executable, Intel 80386, version 1 (SYSV)

    ```'
