- pgno: 451
  md: '# Finding the Subscripts Used by an Array


    Bash allows arrays to contain "gaps" in the assignment of subscripts, it is sometimes
    useful to determine which elements actually exist. This can be done with a parameter
    expansion using the following forms:


    ```

    $${array[*]}

    ${array[i]}

    ```


    where array is the name of an array variable. Like the other expansions that we
    use * and &, the form enclosed in quotes is the most useful, as it expands into
    separate words:


    ```

    me@linuxbox ~$ foo={[2]=b [6]=c

    me@linuxbox ~$ foo for i in "${foo[@]}"; do echo $i; done

    a

    b

    me@linuxbox ~$ foo for i in "${foo[@]}"; do echo $i; done

    2

    4

    6

    ```


    # Adding Elements to the End of an Array


    Knowing the number of elements in an array is no help if we need to append values
    to the end of an array, since the values returned by the * and @ nota- do not
    tell us the maximum array index in use. Fortunately, the shell provides us with
    a solution. Using the += assignment operator, we can automatically append values
    to the end of an array. Here, we assign three values to the foo, and then append
    three more:


    ```

    me@linuxbox ~$ foo=(a b c)

    me@linuxbox ~$ echo ${foo[@]}

    ab c

    me@linuxbox ~$ foo+=(d e)

    me@linuxbox ~$ echo ${foo[@]}

    ab c d f

    ```


    # Sorting an Array


    Just as with spreadsheets, it is often necessary to sort the values in a column
    of data. The shell has no direct way of doing this, but it''s not hard to do with
    a little coding:


    ```

    #!/bin/bash


    # array-sort : Sort an array


    a=(f e d c b a)

    echo "Original array: ${a[@]}"

    a_sorted=$(for i in "${a[@]}"; do echo $i; done | sort)

    echo "Sorted array: ${a_sorted[@]}"

    ```'
  merge: -1
  img_proc: true
