- pgno: 148
  md: 'Note: If your system does not have nano installed, you may use a graphical
    editor instead.


    The screen consists of a header at the top, the text of the file being edited
    in the middle, and a menu of commands at the bottom. Since nano was designed to
    replace the text editor supplied with an email client, it is rather short on editing
    features.


    The first command you should learn in any text editor is how to exit the program.
    In the case of nano, you press CTRL-X to exit. This is indicated in the menu at
    the bottom of the screen. The notation "X means means CTRL-X. This is a common
    notation for the control characters used by many programs.


    The second command we need to know is how to save your work. With this under our
    belts, we''re ready to do some editing. Using the down-arrow key and/or the page-down
    key, move the cursor to the end of the file, and then add the following lines
    to the .bash file:


    ```

    umask 0002

    export HISTCONTROL=ignoreddups

    export HISTSIZE=1000

    alias 1.=''ls -d * --color=auto''

    alias 11=''ls -l --color=auto''

    ```


    Note: Your distribution may already include some of these, but duplicates won''t
    hurt anything.


    Table 11-4 lists the meanings of our additions.


    # Table 11-4: Additions to .bashrc File


    | Line | Meaning |

    | --- | --- |

    | Umask 0002 | Sets the umask to solve the problem with shared directories we
    discussed in Chapter 9. |

    | export HISTCONTROL=ignoreddups | Causes the shell''s history recording feature
    to ignore a command if the same command was just recorded. |

    | export HISTSIZE=1000 | Increases the size of the command history from the default
    of 500 lines to 1000 lines. |

    | alias 1.=''ls -d * --color=auto'' | Creates a new command called 1., which displays
    all directory entries that begin with a dot. |

    | alias 11=''ls -l -color=auto'' | Creates a new command called 11, which displays
    a long-format directory listing. |'
