  md: '```

    [me@linuxbox ~$] foo.txt

    [me@linuxbox ~]$ ls -l foo.txt

    -rw-r--r-- 1 me 2012-03-06 14:52 foo.txt

    [me@linuxbox ~$] chmod 600 foo.txt

    [me@linuxbox ~]$ ls -l foo.txt

    -rw------- 1 me 2012-03-06 14:52 foo.txt

    ```


    By passing the argument 600, we were able to set the permissions of the owner
    to read and write removing all permissions from the group and owner. Though remembering
    the octal-binary mapping may seem inconvenient, we will usually have to use only
    a few common: 7 (rwx), 6 (rw-), 5 (r-), 4 (r--), and 0 (-).


    # Symbolic Representation


    chmod also supports a symbolic notation for specifying file modes. Symbolic notation
    is divided into three parts: whom the change will affect, which operation will
    be performed, and which permission will be set. To specify which are affected,
    a combination of the characters u, g, o, and a is used, as shown in Table 9-5.


    # Table 9-5: chmod Symbolic Notation


    | Symbol | Meaning |

    |---|---|

    | u | Short for user means the file or directory owner |

    | g | Group owner. |

    | o | Short for others means world. |

    | a | Short for all; the combination of u, g, and o. |


    If no character is specified, all will be assumed. The operation may be a + indicating
    that a permission is to be added, a - indicating that a permission is to be taken
    away, or a = indicating that only the specified permissions are to be applied
    and all others to be removed.

    Permissions are specified with the r, w, and x characters. Table 9-6 lists some
    examples of symbolic notation.


    # Table 9-6: chmod Symbolic Notation Examples


    | Notation | Meaning |

    |---|---|

    | u+x | Add execute permission for the owner. |

    | u-x | Remove execute permission from the owner. |

    | +x | Add execute permission for the owner, group, and world. Equivalent to a+.
    |'
  merge: -1
  img_proc: true
