- pgno: 108
  md: '# 9 PERMISSIONS


    Operating systems in the Unix tradition differ from those in the MS-DOS tradition
    in that they are not only multitasking systems but also multiuser systems.


    What exactly does this mean? It means that more than one person can use the computer
    at the same time. While a typical computer will likely have only one keyboard
    and monitor, it can still be used by more than one user. For example, if a computer
    is attached to a network or the Internet, remote users can log in via ssh (secure
    shell) and operate the computer. In fact, remote users can execute graphical applications
    and have the graphical output appear on a remote display. The X Window System
    supports this as part of its basic design.


    The multiuser capability of Linux is not a recent “innovation” but rather a feature
    that is deeply embedded in the design of the operating system. Considering the
    environment in which Unix was created, this makes perfect sense. Years ago, before
    computers were “personal,” they were large, expensive, and centralized. A typical
    university computer system, for example, consisted of a large central computer
    located in one building and terminals located throughout the campus, each connected
    to the large central computer. The computer would support many users at the same
    time.'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'In order to make this practical, a method had to be devised to protect the
    users from each other. After all, the actions of one user could not be allowed
    to crash the computer, nor could one user interfere with the files belonging to
    another user.


    In this chapter we are going to look at this essential part of system security
    and introduce the following commands:


    +   - id—Display user identity.

    - chmod—Change a file''s mode.

    - umask—Set the default file permissions.

    - su—Run a shell as another user.

    - sudo—Execute a command as another user.

    - chown—Change a file''s owner.

    - chgrp—Change a file''s group ownership.

    - passwd—Change a user''s password.


    # Owners, Group Members, and Everybody Else


    When we were exploring the system back in Chapter 4, we may have encountered the
    problem when trying to examine a file as /etc/shadow.


    ```

    [me@linux ~]$ ls /etc/shadow

    /etc/shadow: regular file, no read permission

    [me@linux ~]$ less /etc/shadow

    /etc/shadow: Permission denied

    ```


    The reason for this error message is that, as regular users, we do not have permission
    to read this file.


    In the Unix security model, a user may own file or directory, the user has control
    over its access. Users can turn, belong to a group consisting of one or more users
    who are given access to files and directories by their owners. In addition to
    granting access to a group, an owner may also grant some of access rights to everybody,
    which in Unix is referred to as the world. To find out information about your
    identity, use the id command:


    ```

    [me@linux ~]$ id

    id=500(me) gid=500(me) groups=500(me)

    ```


    Let''s look at the output. When accounts are created, users are assigned a number
    called a user ID, or uid. This is then, for the sake of the humans, mapped to
    a username. The user is assigned a primary group ID, or gid, and may belong to
    additional groups. The previous example is from a Fedora system. On other systems,
    such as Ubuntu, the output may look a little different.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '```

    $ me@linuxbox ~$ me

    uid=1000(me) gid=1000(me)

    groups=4(adm),20(dialout),24(cdrom),25(floppy),29(audio),30(dip),44(video),46(plugdev),108(lpadmin),114(admin),1000(me)

    ```


    As we can see, the uid and gid numbers are different. This is simply because Fedora
    starts by regularizing user accounts at 500, while Ubuntu starts at 1000. We can
    also see that the Ubuntu user belongs to a lot more groups. This has to do with
    the way Ubuntu manages privileges for system devices and services.


    Where does this information come from? Like many things in Linux, it comes from
    a couple of text files. User accounts are defined in the /etc/passwd file, and
    groups are created in the /etc/group file. When user accounts and groups are modified
    along with /etc/shadow, which holds information about the user''s password. For
    each user, the /etc/passwd defines the user (login) name, the uid, the gid, the
    account''s real name, the home directory, and the login shell. If you examine
    the contents of /etc/passwd and /etc/group, you will notice that besides the regular
    user accounts there are accounts for the superuser (uid 0) and other system users.


    In Chapter 10, when we process covers, you will see that some of these other "users"
    are, in fact, quite busy.


    While Unix-like systems assign regular users to a common group as such users,
    modern Linux practice is to create a unique, single-member group with the same
    name as the user. This makes certain types of permission assignment easier.


    # Reading, Writing, and Executing


    Access rights to files and directories are defined in terms of read access, write
    access, and execution access. If we look at the output of the `ls` command, we
    can get some clue as to how this is implemented:


    ```

    $ me@linuxbox ~$ foo.txt

    $ me@linuxbox ~$ ls -l foo.txt

    -rw-r--r-- 1 me 0 2023-03-06 14:52

    ```


    The first 10 characters of the listing are the file attributes (see Figure 9-1).
    The first of these characters is the file type. Table 9-1 lists the file types
    you are most likely to see (there are other, less common types too).


    The remaining nine characters of the file attributes, called the file mode, represent
    the read, write, and execute permissions for the file''s owner, the file''s group
    owner, and everybody else.


    +   - File type (see Table 9-1)

    - Owner permissions (see Table 9-2)

    - Group permissions (see 9-2)

    - World permissions (see Table 9-2)


    Figure 9-1: Breakdown of file attributes'
  merge: -1
  img_proc: true
