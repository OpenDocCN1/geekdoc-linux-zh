  md: '# 15


    # STORAGE MEDIA


    In previous chapters we''ve looked at manipulating data at the file level. In
    this chapter, we will consider data at the device level. Linux has amazing capabilities
    for handling storage devices, whether physical storage such as hard disks, network
    storage, or virtual storage devices like RAID (redundant array of independent
    disks) and LVM (logical volume manager).


    However, since this is not a book about system administration, we will not try
    to cover this entire topic in depth. What will we do is introduce some of the
    concepts and key commands that are used to manage storage devices.


    To carry out the exercises in this chapter, we will use a USB flash drive, a CD-RW
    disc (for systems equipped with a CD-ROM burner), and a floppy disk (again, if
    the system is so equipped).


    We will look at the following commands:


    +   - mount—Mount a filesystem.


    +   - ummount—Unmount a filesystem.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '+   - fdisk—Partition table manipulator.

    - fsck—Check and repair a filesystem.

    - ddformat—Format a floppy disk.

    - mkfs—Create a filesystem.

    - dd—Write block-oriented data directly to a device.

    - genisimage (mkisofs)—Create an ISO 9660 image file.

    - wodim (cdrecord)—Write data to optical storage media.

    - md5sum—Calculate an MD5 checksum.


    # # Mounting and Unmounting Storage Devices


    Recent advances in the Linux desktop have made storage device management extremely
    easy for desktop users. For the most part, we attach a device to our system and
    it just works. Back in the old days (say, 2004), this stuff had to be done manually.
    On non-desktop systems (i.e., servers) this is still a largely manual procedure,
    because servers often have extreme needs and complex configuration requirements.


    The first step in managing a storage device is attaching the device to the filesystem
    tree. This process, called *mounting*, allows the device to participate with the
    operating system. As we recall from Chapter 2, Unix-like operating systems maintain
    a single filesystem tree with devices attached at various points. This contrasts
    with other operating systems such as MS-DOS and Windows that maintain separate
    trees for each device (for example C:\D\ etc.).


    A file named /etc/fstab lists the devices (typically hard disk partitions) that
    are to be mounted at boot. Here is an example /etc/fstab from a Fedora 7 system:


    ```

    LABEL=/12       / ext3 defaults 1 1

    LABEL=/home     /home ext3 defaults 1 2

    LABEL=/boot     /boot ext3 defaults 1 2

    tmpfs           /dev/shm tmpfs defaults 0 0

    devpts          /dev/pts devpts gid=5,mode=620 0 0

    sysfs           /sys defaults 0 0

    proc            /proc proc defaults 0 0

    LABEL=SWAP-sda3 swap defaults 0 0

    ```


    Most of the filesystems listed in this example are virtual and are not appropriate
    for our discussion. For our purposes, the interesting ones are the first:


    ```

    LABEL=/12       / ext3 defaults 1 1

    LABEL=/home     /home ext3 defaults 1 2

    LABEL=/boot     /boot ext3 defaults 1 2

    ```'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'These are hard disk partitions. Each line of the file consists of six fields,
    as shown in Table 15-1.


    # ### Table 15-1: /etc/fstab Fields


    | Field | Contents | Description |

    |---|---|--|

    | 1 | Device | Traditionally, this field contains the actual name of a device
    file associated with the physical device, such as /dev/hda1 (the first partition
    of the master device on the first IDE channel). But with today''s computers, which
    many devices are hot pluggable (like USB drives), many modern linux distributions
    associate a device with a text label instead. This label (which is added to the
    storage medium when it is formatted) is read by the operating system when the
    device is attached to the system. That way, no matter what device file is assigned
    to the actual physical device, it can still be correctly identified. |

    | 2 | Mount point | The directory where the device is attached to the filesystem
    tree |

    | 3 | Filesystem type | Linux allows many filesystem types to be mounted. Most
    native Linux filesystems are ext3, but many others are supported, such as FAT16
    (msdos), FAT32 (vfat), NTFS (ntfs), CD-ROM (iso9660), etc. |

    | 4 | Options | Filesystems can be mounted with various options. It is possible,
    for example, to mount filesystems as read only or to prevent any programs from
    being executed from them [a useful security feature for removable media]. |

    | 5 | Frequency | A single number that specifies if and when a filesystem is to
    be backed up with dump command |

    | 6 | Order | A single number that specifies in what order filesystems should
    be checked with the fsck command |


    # ### Viewing a List of Mounted Filesystems


    The mount command is used to mount filesystems. Entering the command without arguments
    will display a list of the filesystems mounted:


    ```

    @linux ~ $ mount

    /sda2 on / type ext3 (rw)

    proc on /proc type proc (rw)

    sysfs on /sys type sysfs (rw)

    ```'
