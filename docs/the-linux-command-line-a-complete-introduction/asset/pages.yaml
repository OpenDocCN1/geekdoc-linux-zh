  md: '# Table 17-3 (continued)


    | Test | Description |

    | - | - |

    | -perm mode | Match files or directories that have permissions set to the specified
    *mode*. *mode* may be expressed by either octal or symbolic notation. |

    | -samefile name | Similar to the -inum test. Matches files that share the same
