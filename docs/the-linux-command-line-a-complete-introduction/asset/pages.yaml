- pgno: 194
  md: 'Warning: In the examples that follow, it is vitally important that you pay
    close attention to the actual device names in use on your system and do not use
    the names used in this text!


    Also, note that audio CDs are not the same as CD-ROMs. Audio CDs do not contain
    filesystems and cannot be mounted in the usual sense.


    Now that we have the device name of the CD-ROM drive, let''s unmount the disc
    and remount it at another location in the filesystem tree. To do this, we become
    the superuser (using the command appropriate for our system) and unmount the disc
    with the command (notice the following command):


    ```

    [linuxbox ~]$ su -

    Password:

    [root@linuxbox ~]# mount /dev/hdc

    ```


    The next step is to create a new mount point for the disc. A mount point is simply
    a directory somewhere on the filesystem tree. Nothing special about it. It doesn''t
    even have to be an empty directory, though if you mount a device on a non-empty
    directory, you will not be able to see the directory''s previous contents until
    you unmount the device. For our purposes, we will create a new directory:


    ```

    [linuxbox ~]# mkdir /mnt/cdrom

    ```


    Finally, we mount the CD-ROM at the new mount point. The -t option is to specify
    the filesystem type:


    ```

    [linuxbox ~]# mount -t iso9660 /dev/hdc /mnt/cdrom

    ```


    Afterward, we can examine the contents of the CD-ROM via the new mount point:


    ```

    [linuxbox ~]# cd /mnt/cdrom

    [root@linuxbox cd]# ls

    ```


    Notice what happens when we try to unmount the CD-ROM:


    ```

    [root@linuxbox cd]# unmount /dev/hdc

    unmount: /mnt/cdrom: device is busy

    ```


    Why is this? We cannot unmount a device if the device is being used by someone
    or some process. In this case, we changed our directory to the mount point for
    the CD-ROM, which causes the device to be busy. We can easily remedy the issue
    by changing the working directory to something other than the mount point:


    ```

    [root@linuxbox cd]# cd

    [root@linuxbox ~]# unmount /dev/hdc

    ```


    Now the device unmounts successfully.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# WHY UNMOUNTING IS IMPORTANT


    If you look at the output of the free command, which displays statistics about
    memory usage, you will see a statistic called buffers. Computer systems are designed
    to go as fast as possible. One of the impediments system speed is slow devices.
    Printers are a good example. Even the fastest printer is extremely slow by computer
    standards. A computer would be very slow indeed if it had to stop and wait for
    a printer to finish printing a page. In the early days of PCs (before multitasking),
    this was a real problem. If you were working on a spreadsheet or text document,
    the computer would stop and become unavailable every time you printed. The computer
    would send the data to the printer as fast as the printer could accept it, but
    it was very slow because printers don''t print fast. This problem was solved by
    the advent of the printer buffer, a device containing some RAM, that would sit
    between the computer and the printer. With the printer buffer in place, the computer
    would send the printer output to the buffer, and it would quickly be stored in
    the fast RAM so the computer could go back to work without waiting. Meanwhile,
    the printer buffer would slowly spool the data from the printer to the memory
    at the speed that the printer could accept it.


    This idea of buffering is used extensively in computers to make them faster. Don''t
    let the occasionally read or slow devices impede the speed of the system. Operating
    systems store data that has been read, and it is to written to, storage devices
    in memory for as long as possible before having to interact with the slower device.
    On a Linux system, for example, you will notice that the system seems to fill
    up the memory for longer than it is. This does not mean Linux is “using” all the
    memory, it means that Linux is taking advantage of all the available memory to
    do as much buffering as it can.


    This buffering allows writing to storage devices to be done very quickly, because
    the writing to the physical device is being deferred to a future time. In the
    meantime, the data destined for the device is piling up in memory. From time to
    time, the operating system will write this data to the physical device.


    Unmounting a device entails writing all the remaining data to the device so that
    it can be safely removed. If the device is removed without first being unmounted,
    the possibility exists that not all the data for the device has been transferred.
    In some cases, this may include vital directory updates, which will lead to filesystem
    corruption, one of the worst things that can happen on a computer.


    # Developing Device Names


    It''s sometimes difficult to determine the ameof of device. Back in the old days,
    it wasn''t very hard. A device was always in the same place and didn''t change.
    Unix-like systems like it that way. Back when Unix was developed, “changing a
    disk drive” involved using a forklift to remove a washing'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'machine-sized device from the computer room. In recent years, the typical desktop
    hardware configuration has become quite dynamic, and Linux has evolved to become
    more flexible than its ancestors.


    In the examples above, we take advantage of the modern Linux desktop''s ability
    to "automagically" mount the device and determine the name after the fact. But
    what if we are managing a server or some other environment where this does not
    occur? How can we figure it out?


    First, let''s look at how the system names devices. If we list the contents of
    the /dev directory (where all devices live), we can see that there are lots of
    devices:


    ```

    me@linuxbox ~$ ls lsc /dev

    ```


    The contents of this listing reveal some patterns of device naming.


    # Table 15-2: Linux Storage Device Names


    | Pattern | Device |

    |---|---|

    | /dev/fd* | Floppy disk drives |

    | /dev/hd* | IDE (PATA) disks on older systems. Typical motherboards contain two
    IDE connectors, or channels, each with a cable with two attachment points for
    drives. The first drive on the cable is called the master device and the second
    is called the slave device. The device names are ordered such that /dev/sda refers
    to the master device on the first channel, /dev/hdb is the slave device on the
    first channel; /dev/hdc, the master device on the second channel, and so. A trailing
    digit identifies the partition number on the device. For example, /dev/hda1 refers
    to the first partition on the first hard drive on the system while /dev/hda refers
    to the entire drive |

    | /dev/lp* | Printers |

    | /dev/sd* | SCSI disks. On recent Linux systems, the kernel treats all disk-like
    devices (including PATA/SATA hard disks, flash drives, and USB mass storage devices
    as portable music players and digital cameras) as SCSI disks. The rest of the
    naming system is similar to the older /dev/hd* naming scheme described above.
    |

    | /dev/sr* | Optical devices (CD/DVD readers and burners) |


    In addition, we often see symbolic links as /dev/cdrom, /dev/dvd, and /dev/floppy,
    which point to the actual device files, provided as a convenience. If you are
