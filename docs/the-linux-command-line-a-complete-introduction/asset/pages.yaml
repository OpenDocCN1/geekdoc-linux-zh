    \ after that, and the syntax of the command is broken because the fi statement\
    \ is now inside a quoted (but open) string.\n\nIn long scripts, this error can\
    \ be quite hard to find. Using an editor with syntax highlighting will help. If\
    \ a complete version of vim is installed, syntax highlighting can be enabled by\
    \ entering the command:\n\n```\n:syntax on\n```"
