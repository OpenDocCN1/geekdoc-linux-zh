  md: 'To write our modified file, we follow the colon with a w, then ENTER:


    :w


    The file will be written to the hard drive, and we should get a confirmation message
    at the bottom of the screen, like this:


    "foo.txt" [New] 1l, 46C written


    **Note:** If you read the vim documentation, you will notice that (confusingly)
    command mode is called normal mode and ex commands are called command mode. Beware.


    # COMPATIBILITY MODE


    In the example startup screen shown at the beginning of this section (taken from
    Ubuntu 8.04), we see the text Running in compatible mode. This means that vim
    will run in a mode that is closer to the normal behavior of vi rather than the
    enhanced behavior of vim. For purposes of this chapter, we will want to run vim
    with its enhanced behavior. To do this, you have a couple of options:


    +   * Trying vim instead of vi (if that works, consider adding alias vi=''vim''
    to your .bashfile)

    * Use this command to add a line to your vim configuration file:


    ```

    `echo "set nocop" >> ~/.vimrc`

    ```


    Different Linux distributions package vim in different ways. Some distributions
    install a minimal version of vim by default that supports only a limited set of
    vim features. While performing the lessons that follow, you may encounter missing
    features. If this is the case, install the full version of vim.


    # Moving the Cursor Around


    While it is in command mode, vi offers a large number of movement commands, some
    of which it shares with less. Table 12-1 lists a subset.


    # Table 12-1: Cursor Movement Keys


    | Key | Moves the cursor |

    | L or right arrow | Right one character |

    | H or left arrow | Left one character |

    | J or down arrow | Down one line |

    | K or up arrow | Up one line |


    (continued)'
