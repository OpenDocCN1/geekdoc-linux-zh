    This is not a complete list. The *find* man page has all the details.


    # Operators


    Even with all the tests that *find* provides, we may still need a better way to
    describe the *logical relationships* between the tests. For example, if we needed
    to determine if all the files and subdirectories in a directory have secure permissions?
    We would look for all the files with permissions that are not 0600 and the directories
    with permissions that are not 0700. Fortunately, *find* provides a way to combine
    tests using *logical operators* to create more complex logical relationships.
    To express the aforementioned test, we could do this:


    ```

    [me@linuxbox ~]$ find ~ \(-type f -not -perm 0600 \) -or \(-type d -not -perm
    0700)

    ```


    Yikes! That seems weird. What is all this stuff? Actually, the operators are not
    that complicated once you get to know them (see Table 17-4).


    # Table 17-4: find Logical Operators


    | Operator | Description |

    | - | - |

    | -and | Match if the tests on both sides of the operator are true. May be shortened
    to -a. Note that when no operator is present, -and is implied by default. |

    | -or | Match if a test on either side of the operator is true. May be shortened
    to -o. |

    | -not | Match if the test following the operator is false. May be shortened to
    -! . |'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# Table 17-4 (continued)


    | Operator | Description |

    | --- | --- |

    | ( | Groups tests and operators together to form larger expressions. This is
    used to control the precedence of the logical evaluations. By default, find evaluations
    from left to right. It is often necessary to override the default evaluation order
    to obtain the desired result. If not needed, it is helpful sometimes to include
    the grouping characters to improve readability of the command. Note that since
    the parentheses characters have special meaning to the shell, they must be quoted
    when using them on the command line or Usually the backslash character is used
    to escape them. |


    With this list of operators in hand, let''s deconstruct our command. When viewed
    from the uppermost level, we see that our tests are arranged as two groupings
    separated by an -or - operator:


    ```

    (expression 1) -or (expression 2)

    ```


    This makes sense, since we are searching for files with a certain set of permissions
    and directories with a different set. If we are looking for both files and directories,
    why do we use -or instead of -and? Because find scans through the files and directories,
    each one is evaluated to see if it matches the specified tests. We want to know
    if it is either a file with bad permissions or a directory with bad permissions.
    It can''t be at the same time. So if we expand the grouped expressions, we can
    see it this way:


    ```

    (file with bad permissions) -or (directory with bad permissions)

    ```


    Our next challenge is how to test for "bad permissions." How do we do? Actually
    we don''t. What will we test for "not good permissions," since we know what "good
    permissions" are. In the case of files, we define good as 0600; 0700. The expression
    that will test files for "not good",


    ```

    -type f -and -not -perms 0600

    ```


    and the expression for directories is:


    ```

    -type d -and -not -perms 0700

    ```


    As noted in Table 17-4, the -and operator can be safely removed, since it is implied
    by default. So if we put this back together, we get our final command:


    ```

    find ~ (-type f -not -perms 0600) -or (-type d -perms 0700)

    ```


    However, since the parentheses have special meaning to the shell, we must escape
    them to prevent the shell from trying to interpret them. Preceding each one with
    a backslash character does the trick.'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'There is another feature of logical operators that is important to understand.
    Let''s say that we have two expressions separated by a logical operator:


    expr1 -operator expr2


    In all cases, expr1 will always be performed; however, the operator determines
    if expr2 is performed. Table 17-5 shows how it works.


    # Table 17-5: find AND/OR Logic


    | Results of expr1 | Operator | expr2 is... |

    | --- | --- | --- |

    | True | -and | Always performed |

    | False | -and | Never performed |

    | True | -or | Never performed |

    | False | -or | Always performed |


    Why does this happen? It''s done to improve performance. Take -and, for example.
    We know that the expression expr1 -and expr2 cannot be true if the result of expr1
    is false, so there is no point in performing expr2. Likewise, if we have the expression
    expr1 -or expr2 and the result of expr1 is true, there is no point in performing
    expr2, as we already know that the expression expr1 -or expr2 is true.


    Okay, so this things go far. Why is this important? Because we can rely on this
    behavior to control how actions are performed, as we shall soon see.


    # Actions


    Let''s get some work done! Having a list of results from our find command is useful,
    but what we really want to do is act on the items on the list. Fortunately, find
    allows actions to be performed based on the search results.


    # Predefined Actions


    There are a set of predefined actions and several ways to use user-defined actions.
    First let''s look at a few of the predefined actions in Table 17-6.


    # Table 17-6: Predefined find Actions


    | Action | Description |

    | --- | --- |

    | -delete | Delete the currently matching file. |

    | -ls | Perform the equivalent of ls -dils on the matching file. Output is sent
    to standard output. |

    | -print | Output the full pathname of the matching file to standard output. This
    is the default action if no other action is specified. |'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'Table 17-6 (continued)

    | Action | Description |

    |---|---|

    | -quit | Quit once a match has been made. |


    As with the tests, there are many more actions. See the find man page for full
    details.

    In our first example, we did this:


    ```

    find ~

    ```


    This command produced a list of every file and subdirectory contained within our
    home directory. It produced a list because the -print action is implied if no
    other action is specified. Thus, our command could also be expressed as


    ```

    find ~ -print

    ```


    We can use find to delete files that meet certain criteria. For example, to delete
    files that have the extension .BAK (which is often used to designate backup files),
    we could use this command:


    ```

    find ~ -type f -name ''*.BAK'' -delete

    ```


    In this example, find in the user''s home directory (and its subdirectories) is
    searched for filenames ending in .BAK. When they are found, they are deleted.


    > Warning: It should use extreme caution when using the delete action. Always
    test the command first by substituting the -print action for -delete to confirm
    the search results.


    As we go on, let''s take another look at how the logical operators affect actions.
    Consider the following command:


    ```

    find ~ -type f -name ''*.BAK'' -print

    ```


    As we have seen, this command will look for every regular file (-type f) whose
    name ends with .BAK (''*.BAK'') and will output the relative path of each file
    to standard output (-print). However, the reason the command performs this way
    is determined by the logical relationships between each of the tests and actions.
    Remember, there is, by default, an implied -and relationship between each test
    and action we could express the command this way to make the logical relationships
    easier to see:


    ```

    find ~ -type f -and -name ''*.BAK'' -and -print

    ```


    With our command fully expressed, let''s look at Table 17-7 to see how the logical
    operators affect its execution.'
  merge: -1
