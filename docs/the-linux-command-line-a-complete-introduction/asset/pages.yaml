  md: '| Table 3-4 (continued) |

    | Directory | Comments |

    | /var | With the exception of /tmp and /home, the directories we have looked
    at so far remain relatively static; that is, their contents do not change. The
    /var directory tree is where data that is likely to change is stored. Various
