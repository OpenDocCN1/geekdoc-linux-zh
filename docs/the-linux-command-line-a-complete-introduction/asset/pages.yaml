    | oo-cd-cover.odf | Name of the file |


    # Determining a File''s Type with file


    As we explore the system, it will be useful to know what files contain. To do
    this, we will use the file command to determine a file''s type. As discussed earlier,
    filenames in Linux are not required to reflect a file''s contents. For example,
    a filename like picture.jpg would normally be expected to contain a JPEG compressed
    image, it is not required to be in Linux. We can invoke the file command this
    way:


    file filename


    When invoked, the file command will print a brief description of the file''s contents.
    For example:


    ```

    $me@linuxbox ~ file picture.jpg

    picture.jpg: JPEG image data, JFIF standard 1.0

    ```'
