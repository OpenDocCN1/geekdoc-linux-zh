  img_proc: true
- pgno: 407
  md: "# case\n\nThe bash multiple-choice compound command is called case. It has\
    \ the following syntax:\n\n```\ncase word in\n  [pattern | pattern]...) commands\
    \ ;;;\nesac\n```\n\nIf we look at the read-menu program from Chapter 28, we see\
    \ the logic used to act on a user's selection:\n\n```\n#!/bin/bash\n\n# read-menu:\
    \ a menu driven system information program\n\nclear\necho \"\nnPlease Select:\n\
    1. Display System Information\n2. Display Disk Space\n3. Display Home Space Utilization\n\
    0. Quit\n\nread -p \"Enter selection [0-3] > \"\nif [[ $REPLY =~ ^[0-3]$ ]]; then\n\
    \  echo \"Program terminated.\"\n  exit\nfi\n  if [[ $REPLY == 1 ]]; then\n  \
    \  echo \"Hostname: $HOSTNAME\"\n    uptime\n    exit\n  fi\n  if [[ $REPLY ==\
    \ 2 ]]; then\n    df -h\n    exit\n  fi\n  if [[ $REPLY == 3 ]]; then\n    if\
    \ [[ $(id -u) -eq 0 ]]; then\n      echo \"Home Space Utilization (All Users)\"\
    \n      du -sh /home/*\n    else\n      echo \"Home Space Utilization ($USER)\"\
    \n      du -sh $HOME\n    fi\n    exit\n  fi\nelse\n  echo \"Invalid entry.\"\
    \ >&2\n  exit 1\nfi\n```"
  merge: -1
  img_proc: true
- pgno: 408
  md: "Using case, we can replace this logic with something simpler:\n\n```\n#!/bin/bash\n\
    \n# case-menu: a menu driven system information program\n\nclear\necho \"\"\n\
    Please Select:\n\n1. Display System Information\n2. Display Disk Space\n3. Display\
    \ Home Space Utilization\n0. Quit\n\nread -p \"Enter selection [0-3] > \"\ncase\
    \ $REPLY in\n    0) echo \"Program terminated.\"\n        exit\n        ;;\n \
    \   1) echo \"Hostname: $HOSTNAME\"\n        uptime\n        ;;\n    2) df -h\n\
    \        ;;\n    3) if [[ $(id -u) -eq 0 ]]; then\n        echo \"Home Space Utilization\
    \ (All Users)\"\n        du -sh //*\n      else\n        echo \"Home Space Utilization\
    \ ($USER)\"\n        du -sh $HOME\n      fi\n        ;;\n    *) echo \"Invalid\
    \ entry\" >&2\n        exit 1\n        ;\nesac\n```\n\nThe case command looks\
    \ at the value of word—in our example, the value of the REPLY variable—and then\
    \ attempts to match it against one of the specified patterns. When a match is\
    \ found, the commands associated with the specified patterns are executed. After\
    \ a match is found, no further matches are attempted.\n\n# Patterns\n\nThe patterns\
    \ used by case are the same as those used by expansion. Patterns are terminated\
    \ with a ) character. Table 31-1 shows some valid patterns."
  merge: -1
  img_proc: true
- pgno: 409
  md: "# Table31-1: case Pattern Examples\n\n| Pattern | Description |\n| --- | ---\
    \ |\n| a) | Matches if *word* equals a. |\n| [[:alpha:]]) | Matches if *word*\
    \ is a single alphabetic character. |\n| ??? | Matches if *word* is exactly three\
    \ characters long. |\n| *.txt | Matches if *word* ends with the characters *.txt\
    \ |\n*) | Matches any value of *word*. It is good practice to include this as\
    \ the last pattern in a case command to catch any value of *word* that did not\
    \ match a previous pattern; that is, to catch any possible invalid values. |\n\
    \nHere is an example of patterns at work:\n\n```\n#!/bin/bash\n\nread -p \"enter\
    \ word \" \n\ncase $REPLY in\n  [[:alpha:]]) echo \"is a single alphabetic character.\"\
    ; ;\n  [ABC][0-9]) echo \"is A\n```\n\n# Combining Multiple Patterns\n\nIt is\
    \ also possible to combine multiple patterns using the vertical pipe character\
    \ as a separator. This creates an \"or\" conditional pattern. This is useful for\
    \ things as handling both upper- and lowercase characters.\n\n```\n#!/bin/bash\n\
    \n# case-menu: a menu driven system information program\n\nclear\necho \"Please\
