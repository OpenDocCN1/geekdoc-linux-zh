    \ ssh client program like so:\n\n```\nme@linuxbox~$ ssh remote-sys\nThe authenticity\
    \ of host 'remote-sys (192.168.1.4)' can't be established.\nRSA key fingerprint\
    \ is 41:ed2:7a:df:23:19:bf:3c:a5:17:c6:b3:7f:d9:bb.\nAre you sure you want to\
    \ continue connecting (yes/no)?\n```\n\nThe first time the connection is attempted,\
    \ a message is displayed indicating that the authenticity of the remote host cannot\
    \ be established. This is because the client program has never seen this remote\
    \ host before. To accept the credentials of the remote host, enter yes when prompted.\
    \ Once the connection is established, the user is prompted for password:\n\nWarning:\
    \ Permanently added 'remote-sys,192.168.1.4' (RSA) to the list of hosts.\n@remote-sys's\
    \ password:\n\nAfter the password is successfully entered, we receive the shell\
    \ prompt from the remote system:\n\n```\nLast login: Tue Aug 30 13:00:48 2011\n\
    @remote-sys~$$\n```\n\nThe remote shell session continues until the user enters\
    \ the command at the remote shell prompt, thereby closing the remote connection.\
    \ At this point, the local shell session resumes, and the local shell prompt reappears.\n\
    \nIt is also possible to connect to remote systems using a different user name.\
    \ For example, if the local user had an account named bob on the remote system,\
    \ remote user could log in to the account bob on the remote system as follows:\n\
    \n```\nme@linuxbox~$ ssh bob@remote-sys\nbob@remote-sys's password:\nLast login:\
    \ Tue Aug 30 13:03:21 2011\nbob@remote-sys~$\n```\n\nAs before, ssh verifies the\
    \ authenticity of the remote host. If the remote host does not successfully authenticate,\
    \ the following message appears:\n\n```\nme@linuxbox~$ ssh remote-sys\n######################################################\n\
    WARNING: REMOTE HOST IDENTIFICATION HAS CHANGED! @\n######################################################\n\
    IT IS POSSIBLE THAT SOMEONE IS DOING SOMETHING NASTY! \nSomeone could be eavesdropping\
