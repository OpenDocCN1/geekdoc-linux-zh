  md: '| Fedora 9 | 05/13/2008 |

    | Ubuntu 6.06 | 06/01/2006 |

    | Ubuntu 8.10 | 10/30/2008 |

    | Fedora 5 | 03/20/2006 |


    Using a editor (perhaps vim), we''ll enter this data and name the resulting file
    `distros.txt`.


    Next, we''ll try sorting the file and observe the results:


    ```

    me@linuxbox ~$ sort distros.txt

    Fedora 10 | 11/25/2008

    Fedora 5 | 03/20/2006

    Fedora 6 | 10/24/2006

    Fedora 7 | 05/31/2007

    Fedora 8 | 11/08/2007

    Fedora 9 | 05/13/2008

    SUSE 10.1 | 05/11/2006

    SUSE 10.2 | 12/07/2006

    SUSE 10.3 | 10/04/2007

    SUSE 11.0 | 06/19/2008

    Ubuntu 6.06 | 06/01/2006

    Ubuntu 6.10 | 10/26/2006

    Ubuntu 7.04 | 04/12/2007

    Ubuntu 7.10 | 10/18/2007

    Ubuntu 8.04 | 04/24/2008

    Ubuntu 8.10 | 10/30/2008

    ```


    Well, it mostly worked. The problem occurs in sorting of the Fedora version numbers.
    Since a 1 comes before a 5 in the set, version 10 ends up at the top while 9 falls
    to the bottom.


    To fix this problem, we have to sort on multiple keys. We want to perform an alphabetic
    sort on the first field and then a numeric sort on the third field. sort allows
    multiple instances of the -k option so that multiple sort keys can be specified.
    In fact, a key may include a range of fields. If no range is specified (as has
    been the case with our previous examples), sort uses a key that begins with the
    specified field and extends to the end of the line.


    Here is the syntax for our multsort:


    ```

    me@linuxbox ~$ sort --key=3,1 --key=2n distros.txt

    Fedora 5 | 03/20/2006

    Fedora 6 | 10/24/2006

    Fedora 7 | 05/31/2007

    Fedora 8 | 11/08/2007

    Fedora 9 | 05/13/2008

    Fedora 10 | 11/25/2006

    SUSE 10.1 | 05/11/2006

    SUSE 10.2 | 12/07/2006

    SUSE 10.3 | 10/04/2007

    SUSE 11.0 | 06/19/2008

    Ubuntu 6.06 | 06/01/2006

    Ubuntu 6.10 | 10/26/2006

    Ubuntu 7.04 | 04/12/2007

    Ubuntu 7.10 | 10/18/2007

    Ubuntu 8.04 | 04/24/2008

    Ubuntu 8.10 | 10/30/2008

    ```'
