- pgno: 313
  md: 'Note: Linux systems often include many command line-programs for file-format
    conversion. They are often named using the convention format2format. Try using
    the command ls /usr/bin/*[:alpha:]*[:alpha:]* to identify them. Also try searching
    for programs named formatformat.


    For our last exercise with groff, we will revisit our old distros.txt. This time,
    we will use the tbl program, which is used to format tables, typeset list of Linux
    distributions. To do this, we are going to use our earlier script to add markup
    to a text stream that we will feed to groff.


    First, we need to modify our script to add the necessary requests that tbl requires.
    Using a text editor, we will change distros.sed to the following:


    # sed script to produce Linux distributions report


    ```

    1 il\n.TS\ncenter box;\ncb cb s\ncb cb cb\n1 n c.\

    Linux Distributions Report\

    =

    Name Version Released\

    s$/\[[0-9]-\[\2\\])\\\\\\[[0-9]-\[\2\\])\\\\\\[[0-9]-\[\4\\]]\$\-3-\-1-\2\na$\nTE

    ```


    Note that for the script to work properly, care must been taken to ensure the
    words Name Version Released are separated by tabs, spaces. We''ll saving the resulting
    file as distros-tbl.sed. tbl uses the .TS and .TE requests to start and end the
    table. The rows following the .TS request define global properties of the table,
    which, for our example, are centered horizontally on the page and surrounded by
    a border. The remaining lines of definition describe the layout of each table
    row. Now, if we run our report-generating pipeline with the new script, we''ll
    get the following:


    ```

    [linuxbox] $ sort -k 1 -k 2n distros.txt | sed -f distros-tbl.sed | groff -t -Tsc
    ascii 2>/dev/null

    ```


    |------------------------------------------------------|

    | Linux Distributions Report |

    |------------------------------------------------------|

    | Name | Version | Released |

    |------------------------------------------------------|

    | Fedora | 5 | 2006-03-20 |

    | Fedora | 6 | 2006-10-24 |

    | Fedora | 7 | 2007-05-31 |

    | Fedora | 8 | 2007-11-08 |

    | Fedora | 9 | 2008-05-13 |

    | Fedora | 10 | 2008-11-25 |

    | SUSE | 10.1 | 2006-05-11 |

    | SUSE | 10.2 | 2006-12-07 |

    | SUSE | 10.3 | 2007-10-04 |

    | SUSE | 11.0 | 2008-06-19 |

    | Ubuntu | 6.06 | 2006-06-01 |'
  merge: -1
