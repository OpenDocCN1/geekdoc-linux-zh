    System Backup Starting...```

    ```


    After entering the command, we are prompted for our password (not the superuser''s),
    and once the authentication is complete, the specified command is carried out.
    One important difference between su and sudo is that sudo does not start a new
    shell, nor it load another user''s environment. This means commands do not need
    to be quoted differently than they would without using sudo. Note that this behavior
    can be overriden by specifying various options. The sudo man page for details.


    To see what privileges are granted by sudo, use the -1 option to list them:


