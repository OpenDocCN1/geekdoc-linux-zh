- pgno: 77
  md: '# Creating Your Own Commands with alias


    Now for our very first experience with programming! We will create an alias command
    using our own. But before we start, we need to reveal a command-line trick. It''s
    possible to put more than one command on a line by separating each command with
    a semicolon character.


    ```

    command1; command2; command3...

    ```


    Here''s the example we will use:


    ```

    @linuxbox ~/ cd /usr; ls; cd -

    games kerberos lib64 local share tmp

    etc include lib libexec sbin src

    /home/me

    @linuxbox ~$

    ```


    As we can, we have combined three commands on one line. We first change directory
    to /usr, then we list the directory, and finally return to the original directory
    (using cd -) so we end up where we started. Now let''s turn this sequence into
    a new command using alias. The first thing we have to do is dream up a name for
    our new command. Let''s try test. Before we do that, it would be a good idea to
    find out if the name test is already being used. To find out, we can use the type
    command again:


    ```

    @linuxbox ~$ type test

    test is a shell builtin

    ```


    Oops! The name test is already taken. Let''s try foo:


    ```

    @linuxbox ~$ type foo

    bash: type: not found

    ```


    Great! foo is not taken. So let''s create our alias:


    ```

    @linuxbox ~$ alias foo=''cd /usr; ls; cd -''

    ```


    Notice the structure of this command:


    ```

    alias name=''string''

    ```


    After the command alias we give the alias name followed by an equal sign, (no
    whitespace allowed) which is followed immediately by a quoted string containing
    the meaning to be assigned to the name. After we define our alias, we can use
    it anywhere the shell would expect a command.'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'Let''s try it:


    ```

    [me@linuxbox ~]$ foo

    bin games kerberos lib64 local share tmp

    etc include lib libexec sbin src

    /home/me/

    [me@linuxbox ~]$

    ```


    We can use the type command again to see our alias:


    ```

    [me@linuxbox ~]$ type foo

    foo is aliased to cd /usr; ls; cd -

    ```


    To remove an alias, the unalias command is used, like so:


    ```

    [me@linuxbox ~]$ unalias foo

    [me@linuxbox ~]$ type foo

    bash: type: not found

    ```


    While we purposely avoided naming aliases with an existing command name, it is
    sometimes desirable to do so. This is often done to apply a commonly desired option
    to each invocation of a command. For instance, we saw earlier how the ls command
    is often aliased to add color support:


    To see all the aliases defined in the environment, use the alias without arguments.
    Here are some of the aliases defined by default on a Fedora system. To figure
    out what they do:


    ```

    [me@linuxbox ~]$ alias

    alias l=''ls -d .* --color=tty

    alias ll=''ls -l --color=tty

    alias ls=''ls --color=tty`

    ```


    There is one problem with defining aliases on the command line. They vanish when
    your shell session ends. In a later chapter we will see how to add our aliases
    to the files that establish the environment each time we log on, but for now,
    enjoy the fact that we have taken our first, albeit tiny, step into the world
    of shell programming!


    # Revisiting Old Friends


    Now that we have learned how to find the documentation for commands, and look
    up the documentation for all the commands we have encountered so far. Study what
    additional options are available and try them out!'
