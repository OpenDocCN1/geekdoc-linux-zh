- pgno: 458
  md: "during its execution. In the course of good design, we would have the script\
    \ delete the file when the script finishes its work. It would also be smart to\
    \ have the script delete the file if a signal is received indicating that the\
    \ program was going to be terminated prematurely known as a *trap*. Traps are\n\
    \nprovides a mechanism for this purpose with the appropriately named built-in\
    \ command trap. trap uses the following syntax:\n\n```\ntrap argument signal [signal...]\n\
    ```\n\nwhere argument is a string that will be read and treated as a command,\
    \ and signal is the specification of a signal that will trigger the execution\
    \ of the interpreted command.\n\nHere is a simple example:\n\n```\n#!/bin/bash\n\
    \n# trap-demo : simple signal handling demo\n\ntrap 'echo I am ignoring you.'\
    \ SIGINT SIGTERM\n\nfor i in {1..5}; do\n    echo \"Iteration $i of 5\"\n    sleep\
    \ 5\ndone\n```\n\nThis script defines a trap that will execute an echo command\
    \ each time the SIGINT or SIGTERM signal is received while the script is running.\
    \ Execution of the program looks like this when the user attempts to stop the\
    \ script by pressing CTRL-C:\n\n```\n[me@linux ~]$ trap-demo\nIteration 1 of 5\n\
    Iteration 2 of 5\nI am ignoring you.\nIteration 3 of 5\nI am ignoring you.\nIteration\
    \ 4 of 5\nIteration 5 of 5\n```\n\nAs we can see, each time the user attempts\
    \ to interrupt the program, the message is printed instead.\n\nConstructing a\
    \ string to form a useful sequence of commands can be awkward, so it is common\
    \ practice to specify a shell function as the command. In this example, a separate\
    \ shell function is specified for each signal to be handled:\n\n```\n#!/bin/bash\n\
    \n# trap-demo2 : simple signal handling demo\n\nexit_signal_SIGINT () {\n    echo\
    \ \"Script interrupted.\" 2>&1\n    exit 0\n}\n```"
