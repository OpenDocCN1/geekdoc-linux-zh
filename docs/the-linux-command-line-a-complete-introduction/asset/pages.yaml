  md: 'Okay, let''s say that we wanted to change the working directory to the parent
    of /usr/bin, which is /usr. We could do that two different ways, either with an
    absolute pathname:


    ```

    [me@linuxbox bin]$ cd /usr

    [me@linuxbox usr]$ pwd

    ```


    or with a relative pathname:


    ```

    [me@linuxbox bin]$ cd ..

    [me@linuxbox usr]$ pwd

    usr

    ```


    Two different methods produce identical results. Which should we use? The one
    that requires the least typing! Likewise, we can change the working directory
    from /usr to /usr/bin in two different ways, either by using an absolute pathname:


    ```

    [me@linuxbox usr]$ cd /usr/bin

    [me@linuxbox bin]$ pwd

    usr/bin

    ```


    or with a relative pathname:


    ```

    [me@linuxbox usr]$ cd ./bin

    [me@linuxbox bin]$ pwd

    usr/bin

    ```


    Now, there is something important that I must point out here. In all cases, you
    can omit the . / because it is implied. Typing


    ```

    [me@linuxbox usr]$ cd bin

    ```


    does the same thing. In general, if you do not specify a pathname to some-thing,
    the working directory will be assumed.


    # Some Helpful Shortcuts


    In Table 2-1 we see some useful ways the current working directory can be quickly
    changed.


    # Table 2-1: cd Shortcuts


    | Shortcut | Result |

    |---|---|

    | cd | Changes the working directory to your home directory. |

    | cd - | Changes the working directory to the previous working directory. |

    | cd ~username | Changes the working directory to the home directory of username.
    For example, ~bob changes the directory to the home directory of user bob. |'
