  md: "# Variables and Constants\n\nThere is an issue with our script, however. Notice\
    \ the string System Information Report is repeated? With our tiny script it's\
    \ not a problem, but let's imagine that our script was really long and we had\
    \ multiple instances of this string. If we wanted to change the title to something\
    \ else, we would have to change it in multiple places, which could be a lot of\
    \ work. What if we could arrange the script so that the string appeared only once\
    \ and not multiple times? That would make maintenance of the script much easier.\
    \ Here's how we could do that:\n\n```\n#!/bin/bash\n\n# Program to output a system\
    \ information page\ntitle=\"System Information Report\"\n\necho \"<html>\n<HEAD>\n\
    \  <TITLE>$title</TITLE>\n<body>\n  <h1>$title</h1>\n</body>\n</html>\"\n```\n\
    \nBy creating a named title and assigning it the value System Report, we can take\
    \ advantage of parameter expansion and place the string in multiple locations.\n\
    \n# Creating Variables and Constants\n\nSo, how do we create a variable? Simple,\
    \ we just use it. When the shell encounters a variable, it automatically creates\
    \ it. This differs from many programming languages in which variables must be\
    \ explicitly declared or defined before use. The shell is very lax about this,\
    \ which can lead to some problems. For example, this scenario played out on the\
    \ command line:\n\n```\n[melinuxbox ~]$ foo=\"yes\"\n[melinuxbox ~]$ echo $foo\n\
    yes\n[melinuxbox ~]$ echo $fool\n\n[melinuxbox ~]$\n```\n\nWe first assign the\
    \ value to the variable foo and then display its value with echo. Next we display\
    \ the value of the variable misspelled as fool and get a blank result. This is\
    \ because the shell happily created the variable when it encountered it and then\
    \ gave it the default value of nothing,"
