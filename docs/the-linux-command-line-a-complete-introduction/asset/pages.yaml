    So far, we have given sed commands only via the command line. It is also possible
    to construct more complex commands in a script file using the -f option. To demonstrate,
    we will use sed with our distros.txt file to build a report. Our report will feature
    a title at the top, our modified dates, and all the distribution names converted
    to uppercase. To do this, we will need to write a script, so we will fire up our
    text editor and enter the following:


