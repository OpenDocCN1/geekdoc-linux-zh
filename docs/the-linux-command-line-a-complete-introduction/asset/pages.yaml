- pgno: 316
  md: '# 22


    # # PRINTING


    After spending the last couple of chapters manipulating text, it''s time to put
    text on paper. In this chapter, we''ll look at the command-line tools that are
    used to print files and control printer operation. We won''t be looking at how
    to configure printing, as that varies from distribution to distribution. Note
    that we will need a working printer configuration to perform the exercises in
    this chapter. We will discuss the following commands:


    +   * pr—Convert text files for printing.

    * lpr—Print files.

    * lp—Print files (System V).

    * a2ps—Format files for printing on a PostScript printer.

    * lpstat—Show printer status information.

    * lpq—Show printer queue status.

    * lprm—Cancel print jobs.

    * cancel—Cancel print jobs (System V).'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# A Brief History of Printing


    To fully understand the printing features found in Unix-like operating systems,
    we must first learn some history. Printing on Unix-like systems goes way back
    to the beginning of the operating system itself. In those days, printers and how
    they were used were much different from how they are today.


    # Printing in the Dim Times


    Like the computers themselves, printers in the pre-PC era tended to be large,
    expensive, and centralized. The typical computer user of 1980 worked at a terminal
    connected to a computer some distance away. The printer was located near the computer
    and was under the watchful eyes of the computer''s operators.


    When printers were expensive and centralized, as they often were in the early
    days of Unix, it was common practice for many users to share a printer. To identify
    print jobs belonging to a particular user, a banner displaying the name of the
    user was often printed at the beginning of each print job. The computer support
    staff would then load up a cart containing the day''s print jobs and deliver them
    to the individual users.


    # Character-Based Printers


    The printer technology of the ''80s was very different in two respects. First,
    printers of that period were almost always impact printers. Impact printers use
    a mechanical mechanism that strikes a ribbon against the paper to form character
    impressions on the page. Two of the popular technologies of time were daisy-wheel
    printing and dot-matrix printing.


    The second, and more important, characteristic of early printers was that they
    used a set of characters that were intrinsic to the device itself. For example,
    a daisy-wheel printer could only print the characters actually molded into the
    petals of the daisy wheel. This makes the printers much like high-speed typewriters.
    With most typewriters, they printed using monospaced (fixed-width) fonts. This
    means each character has the same width. Printing was done at fixed positions
    on the page, and the printable area of a page contained a fixed number of characters.
    Most printers printed 10 characters per inch (CPI) horizontally and 6 lines per
    inch (LPI) vertically. Using this scheme, a US-letter sheet of paper is 85 characters
    wide and 66 lines high. Taking into account a small margin on each side, 80 characters
    was considered the maximum width of a print line. This explains why terminal displays
    (and our terminal emulators) are normally 80 characters wide. It provides a WYSIWYG
    (What You See Is What You Get) view of printed output, using a monospaced font.


    Data is sent to a typewriter-like printer in a stream of bytes containing the
    characters to be printed. For example, an a, the ASCII character code 97 is sent.
    In addition, the low-numbered ASCII control codes provided a means of moving the
    printer''s carriage and paper, using codes'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'carriage return, line feed, form feed, and so on. Using the control codes,
    it''s possible to achieve some limited font effects, such as boldface, by having
    the printer print a character, backspace, and the printer again to get a darker
    print impression on the page. We can actually witness this if we use nroff to
    render a page and examine the output cat A -


    ```

    $ [me@linux~] zcat /usr/share/man/man1/ls.1.gz | nroff -man cat -A | head LS(1)

    User Commands

    $

    $

    N*HA*HAM*HM*HE$

    Is - list directory contents$

    $S*HY*HNO*HYNO*HOP*HPS*HSI*HHS$

    1H1sHs [_HO_HP *_HT_HI_AO_HN]... [_HF_HI *_HE...

    ```


    The H (CTRL-H) characters are used to create the bold-effect. Likewise, we can
    also see a backspace/underscore sequence to produce underlining.


    # Graphics Printers


    The development of GUIs led to major changes in printer technology. As computers
    moved to more picture-based displays, printing moving from character-based to
    graphical techniques. This was facilitated by the advent of the low-cost laser
    printer, which, instead of printing fixed characters, could print tiny dots anywhere
    in the printable area of the page. This made printing proportional fonts (like
    those used by typesetters), and even photographs and high-quality displays, possible.


    However, moving from a character-based scheme to a graphical scheme presented
    a formidable technical challenge. Here''s why: The number of bytes needed to fill
    a page using a character-based printer can be calculated this way (assuming 60
    lines per page, each containing 80 characters): 60 × 80 = 4,800 bytes.


    In comparison, a 300-dot-per-inch (DPI) laser printer (assuming an 8-10-inch print
    area per page) requires (8 × 300) × (10 × 300) ÷ 8 = 900,000 bytes.


    Many of the slow PC networks simply could not handle the nearly 1 megabyte of
    data required to fill a full page on a printer so, so it was clear that an invention
    was needed.


    That invention turned out to be the page-description language. A pagedescription
    language (PDL) is a programming language that describes the contents of a page.
    Basically it says, "Go to this position, draw the character a in 10-point Helvetica,
    go to this position. ." until everything on the page is described. The first PDL
    was PostScript from Adobe Systems, which is still in wide use today. The PostScript
    language is a complete programming language tailored for typography and other
    kinds of graphics and imaging. It includes built-in support for 35 standard, high-quality
    fonts, plus the ability'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'to accept additional font definitions at runtime. At first, support for PostScript
    was built into the printers themselves. This solved the data transmission problem.
    The typical PostScript program was verbose in comparison to the simple byte stream
    of character-based printers, but was much smaller than the number of bytes required
    to represent the entire printed page.


    A PostScript printer accepted a PostScript program as input. The printer contained
    its own processor and memory (oftimes making the printer more powerful than the
    computer to which it was attached) and executed a special program called a PostScript
    interpreter, which read the incoming PostScript program and rendered the results
    into the printer''s memory, forming the pattern of bits (dots) that would be transferred
    to the paper. The generic name for this process of rendering something into a
    large bitmap (called a bitmap) raster image processor, or RIP faster.


    As the years went, both computers and networks became much faster. This allowed
    the RIP to move from the printer to the host computer, which, in turn, permitted
    high-quality printers to be much less expensive.


    Many printers today still accept character-based streams, but low-cost printers
    do not. They rely on the host computer''s RIP to provide a stream of bits to print
    as dots. There are some PostScript printers, too.


    # Printing with Linux


    Modern Linux systems employ two software suites to perform and manage printing.
    The first, CUPS (Common Unix Printing System), provides print drivers and print-job
    management; the second, Ghostscript, a PostScript interpreter, acts as a RIP.


    CUPS manages printers by creating and maintaining print queues. As we discussed
    in our brief history lesson, Unix printing was originally designed to manage a
    centralized printer shared by multiple users. Since printers are slow by nature,
    compared to the computers that are feeding them, printers need a way to schedule
    print jobs and keep things organized. CUPS also has the ability to recognize different
    types of data (within reason) and can convert files to a printable format.


    # Preparing Files for Printing


    As command line users, we are mostly interested in printing text, though it is
    certainly possible to print other data formats as well.


    # pr—Convert Text Files for Printing


    We looked at pr in a little in the previous chapter. Now we will examine some
    of its many options used in conjunction with printing. In our history of printing,
    we saw that character-based printers use monospaced fonts, resulting in'
  merge: -1
  img_proc: true
- pgno: 320
  md: 'fixed numbers of characters per line and lines per page. pr is used to adjust
    text to fit on a specific page size, with optional page headers and margins. Table
    22-1 summarizes the most commonly used options.


    # Table 22-1: Common pr Options


    | Option | Description |

    | --- | --- |

    | +first[:last] | Output a range of pages starting with first and, optionally,
    ending with last. |

    | -columns | Organize the content of the page into the number of columns specified
    by columns. |

    | -a | By default, multicolumn output is listed vertically. By adding the -a (across)
    option, content is listed horizontally. |

    | -d | Double-space output. |

    | -D format | Format the date displayed in page headers using format. See the
    man page for the date command for a description of the format string. |

    | -f | Use feeds rather than carriage returns to separate pages. |

    | -h header | In the center portion of the page header, use header rather the
    name of the file being processed. |

    | -l length | Set page length to length. Default is 66 lines (US letter at 6 lines
    per inch). |

    | -n | Number lines. |

    | -o offset | Create a left margin offset characters wide. |

    | -w width | Set page width to width. Default is 72 characters. |


    pr is often used in pipelines as a filter. In this example, we will produce a
    directory listing of /usr/bin and format it into paginated, three-column output
    using:


    ```

    me@linux~]$ ls /usr/bin | pr -3 -w 65 | head

    ```


    ```

    2012-02-18 14:00  apturl         bsd-write

    [               ar              bsh

    411toppm        arecord         btclflash

    a2p             recordmidi     bug-buddy

    a2ps            buildhash

    a2ps-lpr-wrapper  ark             buildhash

    ```'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# Sending a Print Job to a Printer


    The CUPS printing suite supports two methods of printing historically over Unix-like
    systems. One method, called Berkeley or LPD (used in the Berkeley Software Distribution
    version of Unix), uses the lpr program; the other method, called SysV (from the
    System V version of Unix), uses the lpt program. Both programs do roughly the
    same thing. Choosing one the other is a matter of personal taste.


    # lpr-Print Files (Berkeley Style)


    The lpr program can be used to send files to the printer. It may also be used
    in pipelines, as it accepts standard input. For example, to print the results
    of our multicolumn directory listing we could do this:


    ```

    me@linuxbox ~ ls /usr/bin | pr -3 | lpr

    ```


    The report would be sent to the system''s default printer. To send the file to
    a different printer, the -P option can be used like this:


    ```

    lpr -P printer_name

    ```


    where printer_name is the name of the desired printer. To see a list of printers
    known to the system:


    ```

    me@linuxbox ~$ lpstat -a

    ```


    **Note:** Many Linux distributions allow you to define a "printer" that outputs
    files in PDF, rather than printing on the physical printer. This is very handy
    for experimenting with printing commands. Check your printer configuration program
    to see if it supports this configuration. On some distributions, you may need
    to install additional packages (such as cups-pdf) to enable this capability.


    Table 22-2 shows some of the common options for lpr.


    # Table 22-2: Common lpr Options


    | Option | Description |

    | --- | --- |

    | -# number | Set number of copies to number. |

    | -p | Print each page with a shaded header with the date, time, job name, and
    page number. This so-called "pretty print" option can be used when printing text
    files. |

    | -P printer | Specify the name of the printer used for output. If no printer
    is specified, the system''s default printer is used. |

    | -r | Delete files after printing. This would be useful for programs that produce
    temporary printer-output files. |'
  merge: -1
  img_proc: true
- pgno: 322
  md: '# lp—Print Files (System Style)


    Like lpr, lp accepts either files or standard input for printing. It differs from

    lpr in that it supports a different (and slightly more sophisticated) option

    set. Table 22-3 lists the common options.


    Table 22-3: Common lpr Options


    | Option | Description |

    | --- | --- |

    | -d printer | Set the destination (printer) to printer. If no d option is specified,
    the system default printer is used. |

    | -n number | Set the number of copies to number. |

    | -o landscape | Set output to landscape orientation. |

    | -o fitplot | Scale the file to fit the page. This is useful when printing images,
    such as JPEG files. |

    | -o scaling=number | Scale file to number. The value of 100 fills the page. Values
    less than 100 are reduced, while values greater than 100 cause the file to be
    printed across multiple pages. |

    | -o cpi=number | Set the output characters per inch to number. Default is 10.
    |

    | -o lpi=number | Set the output lines per inch to number. Default is 6. |

    | -o page-bottom=points | Set the page margins. Values are expressed in points,
    a unit of typographic measurement. There are 72 points to an inch. |

    | -o page-left=points | |

    | -o page-top=points | |


    +   -P pages Specify the list of pages. pages may be expressed as a comma-separated
    list and/or a range—example 1,3,5,7–10.


    We'' produce our directory listing again, this time printing 12 CPI and 8 LPI
    with a left margin of one-half inch. Note that we have to adjust the pr options
    to the new page size:


    ```

    me@linux~$]$ ls /usr/bin | pr -4 -w 90 -1 88 | lp -o page-left=36 -o cpi=12 -o
    lpi=8

    ```


    This pipeline produces a four-column listing using smaller type than the default.
    The increased number of characters per inch allows us to fit more columns on the
    page.'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# Another Option: a2ps


    The a2ps program is interesting. As we can surmise from its name, it''s a format
    conversion program, but it''s also much more. Its name originally meant ASCII
    to PostScript, and it was used to prepare text files for printing on PostScript
    printers. Over the years, however, the capabilities of the program have grown,
    and now its name means Anything to PostScript. While its name suggests a format-conversion
    program, it is actually a printing program. It sends its default output, rather
    than standard output, to the system''s default printer. The program''s default
    behavior is that of a "pretty printer," meaning that it improves the appearance
    of output. We can use the program to create a PostScript file on our desktop:


    ```

    me[@ulnbox]$ ls /usr/bin | pr -t | a2ps -o ~/Desktop/ls.ps -L 66

    [stdin plain]: 11 pages on 6 sheets

    [Total: 11 pages on 6 sheets] saved into file ~/home/me/Desktop/ls.ps''

    ```


    Here we filter the stream with pr, using the -t option (omit headers and footers)
    and then, with a2ps, specifying an output file (-o option) and 66 lines per page
    (-l option) to match the output pagination of pr. If we view the resulting file
    with a suitable viewer, we will see the output in Figure 22-1.


    ![](img/aa9c1f11ce2d496265d3ab82e4de6f44_323_0.png)


    Figure 22-1: Viewing a2ps output


    292 Chapter 2'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'As we can see, the default output layout is “two up” format. This causes the
    contents of two pages to be printed on each sheet of paper. a2ps applies nice
    page headers and footers, too.

    a2ps has a lot of options. Table 22-4 summarizes them.


    # ## Table 22-4: a2ps Options


    | Option | Description |

    | --- | --- |

    | --center-title text | Set center page title to text. |

    | --columns number | Arrange pages into number columns. Default is 2. |

    | --footer text | Set page footer to text. |

    | --guess | Report the types of files given as arguments. Since a2ps tries to
    convert and format all types of data, this option can be useful for predicting
    what a2ps will do when given a particular file. |

    | --left-footer text | Set left-page footer to text. |

    | --left-title text | Set left-page title to text. |

    | --line-numbers=interval | Number lines of output every interval lines. |

    | --list=defaults | Display default settings. |

    | --list=topic | Display settings for topic, topic is one of the following: delegations
    (external programs that will be used to convert data), encodings, features, variables
    (page sizes and the alike), ppd (PostScript printer descriptions), printers, prologues
    (portions of code that are prefixed to normal output), stylesheets, or user options.
    |

    | --pages range | Print pages in range. |

    | --right-footer text | Set right-page footer to text. |

    | --right-title text | Set right-page title to text. |

    | --rows number | Arrange pages into number rows. Default is 1. |

    | -B | No page headers. |

    | -b text | Set page header to text. |

    | -f size | Use size point font. |

    | -l number | Set characters per line to number. This and the -L option (below)
    can be used to make files paginated with other programs, such as pr, fit correctly
    on the page. |'
  merge: -1
  img_proc: true
- pgno: 325
  md: '# Table 22-4 (continued)


    | Option | Description |

    | --- | --- |

    | -L number | Set lines per page to number. |

    | -M name | Use media name—for example, A4. |

    | -n number | Output number copies of each page. |

    | -o file | Send output to file. If file is specified as -, use standard output.
    |

    | -P printer | Use printer. If a printer is not specified, the system default
    orientation |

    | -R | Portrait orientation |

    | -r | Landscape orientation |

    | -T number | Set tabs to every number characters. |

    | -u text | Underlay (watermark) pages with text. |


    This is just a summary. a2ps has several options.


    **Note:** a2ps is in active development. During my testing, I noticed different
    behavior on various distributions. On CentOS 4, output always wanted to send output
    by default. On CentOS 4 and Fedora 10, output defaulted to A4 media, despite the
    program being configured to letter-size media by default. I could overcome these
    issues by explicitly specifying the desired option. On Ubuntu 8.04, a2ps performed
    as documented.


    Also note that there is another formatter that is useful for converting text into
    PostScript. Called enscript, it can perform many of the same kinds of formatting
    and printing tricks, but unlike a2ps, it accepts only text input.


    # Monitoring and Controlling Print Jobs


    As Unix systems are designed to handle multiple print jobs from multiple users,
    CUPS is designed to do the same. Each printer is given a print queue, where jobs
    are parked until they can be spooled to the printer. CUPS supplies several command-line
    programs that are used to manage printer status and print queues. Like the *lpr*
    and *lp* programs, these management programs are modeled after the corresponding
    programs from the Berkeley and System V systems.


    # Lpstat—Display Print System Status


    The *lpstat* program is useful for determining the names and availability of printers
    on the system. For example, if we had a system with both a physical'
  merge: -1
  img_proc: true
- pgno: 326
  md: 'printer (named *printer*) and a PDF virtual printer (named PDF), we could check
    their status using this:


    ```

    [me@linux ~]$ lpstat -a

    PDF accepting requests since Mon 05 Dec 2011 03:05:59 PM EST

    printer accepting requests since Tue 21 Feb 2012 08:43:22 AM EST

    ```


    Further, we could determine a more detailed description of the printer system
    configuration in way:


    ```

    [me@linux ~]$ lpstat -s

    system default destination: printer

    device for printer: ipp://printer-server:631/printers/

    ```


    In this example, we see that *printer* is the system''s default printer and it
    is a network printer using Internet Printing Protocol (*ipp://*) attached to a
    system named *printer-server*.

    The commonly used options are described in Table 22-5.


    # Table 22-5: Common lpstat Options


    | Option | Description |

    |---|---||

    | -a [*printer...]* | Display the status of the printer queue for *printer*. Note
    that this is the status of the printer queue''s ability to accept jobs, not the
    status of the printer queue. If no printers are specified, all print queues are
    shown. |

    | -d | Display the name of the system''s default printer. |

    | -p [*printer...]* | Display the status of the specified *printer*. If no printers
    are specified, all printers are shown. |

    | -r | Display the status of the print server. |

    | -s | Display a status summary. |

    | -t | Display a complete status report. |


    # Lpq—Display Printer Queue Status


    To see the status of a printer queue, the *lpq* program is used. This allows us
    to view the status of the queue and the print jobs it contains. Here is an example
    of an empty queue for a system default printer named *printer*:


    ```

    [me@linux ~]$ lpq

    printer is ready

    no entries

    ```'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'If we do not specify a printer (using the -P option), the system''s default
    printer is shown. If we send a job to the printer and then look at the queue,
    we will see it listed:


    ```

    [me@linuxbox ~]$ ls *.txt | pr -3 | lp

    request id is printer-603 (1 file(s))

    [me@linuxbox ~]$ lpq

    printer is ready Job Total Size

    Rank Owner File(s)

    active me 603 (stdin) 1024 bytes

    ```


    # lprm and cancel—Cancel Print Jobs


    CUPS supplies two programs used to terminate print jobs and remove them from the
    print queue. One is Berkeley style (lprm), and the other is System V (cancel).
    They differ slightly in the options they support but do basically the same thing.
    Using our print job above as an example, we could stop the job and remove it this
    way:


    ```

    [me@linuxbox ~]$ cancel 603

    [me@linuxbox ~]$ lpq

    printer is ready

    no entries

    ```


    Each command has options for removing all the jobs belonging to a particular user,
    particular printer, and multiple job numbers. Their respective man pages have
    all the details.'
  merge: -1
  img_proc: true
- pgno: 328
  md: '# 23


    # COMPILING PROGRAMS


    In this chapter, we will look at how to build programs by compiling source code.
    The availability of source code is the essential freedom that makes Linux possible.
    The entire ecosystem of Linux development relies on free exchange between developers.
    For many desktop users, compiling is a lost art. It used to be quite common, but
    today, distributor maintain huge repositories of precompiled binaries, ready to
    download and use. At the time of this writing, the Debian repository (one of the
    largest of all the distributions) contains almost 23,000 packages. So why compile
    software? There are two reasons:


    +   - Availability: Despite the number of precompiled programs in distributions,
    some distributions may not include all the desired applications. In this case,
    the only way to get the desired program is to compile it from source.


    +   - Timeliness: While some distributions specialize in cutting-edge versions
    of programs, many do not. This means that in order to have the very latest version
    of a program, compiling is necessary.'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'Compiling software from source code can become very complex and technical,
    well beyond the reach of many users. However, many compiling tasks are quite easy
    and involve only a few steps. It depends on the package. We will look at a very
    simple case in order to provide an overview of the process and as a starting point
    for those who wish to undertake further study.


    We will introduce one new command:


    +   - make—Utility to maintain programs.


    # What Is Compiling?


    Simply put, compiling is the process of translating source code (the human-readable
    description of a program written by a programmer) into the native language of
    the computer''s processor.


    The computer''s processor (or CPU) works at a very elemental level, executing
    programs in what is called machine language. This is a numeric code that defines
    very small operations, such as "add this byte," "point to this location in memory,"
    or "copy this byte." Each of these instructions is expressed in binary (ones and
    zeros). The earliest computer programs were written using this numeric code, which
    may explain why programmers wrote it were said to smoke a lot, drink gallons of
    coffee, and wear thick glasses.


    This problem was overcome by the advent of assembly language, which replaced numeric
    codes with (slightly) easier to character mnemonics such as CPU (for copy) and
    MOV (for move). Programs are processed into machine language by a program called
    an assembler. Assembly language is still used today for specialized programming
    tasks, such as device drivers and embedded systems.


    We next come to what are called high-level programming languages. They are called
    because they allow the programmer to be less concerned with the details of what
    the processor is doing and more with solving the problem at hand. The early ones
    (developed during the 1950s) included FORTRAN (designed for scientific and technical
    tasks) and COBOL (designed for business applications). Both are still in limited
    use today.


    While there are many programming languages, two predominate. Most programs for
    modern systems are written in either C or C++. In the examples to follow, we will
    be compiling a C program.


    Programs in high-level programming languages are converted into machine language
    by processing them with another program, called a compiler. Some compilers translate
    high-level instructions into assembly language and then use an assembler to perform
    the final stage of translation into machine language.


    A process often used in conjunction with compiling is called linking. Programs
    perform many common tasks. Take, for instance, opening a file.


    298 Chapter 23'
  merge: -1
  img_proc: true
- pgno: 330
  md: 'Many programs perform this task, but it would be wasteful to have each program
    implement its own routine to open files. It makes more sense to have a single
    piece of programming that knows how to open files and to allow all programs that
    need it to share it. Providing support for common tasks is accomplished by what
    are called routines, each performing some common task that multiple programs can
    share. If we look in the /lib and /usr/lib directories, we can see many of them.
    A program called a linker is used to form the output of the compiler and the libraries
    that the compiled program requires. The final result of this process is the executable
    program, ready for use.


    # Are All Programs Compiled?


    No. As we have seen, some programs, as shell scripts, do not require compiling
    but are executed directly. These are written in what are known as scripting or
    interpreted languages. These languages, which have grown in popularity in recent
    years, including Perl, Python, PHP, Ruby, and others.


    Scripted languages are executed by a special program called an interpreter. An
    interpreter inputs the program file and executes each instruction contained within
    it. In general, interpreted programs execute much slower than compiled programs.
    This is because each source code instruction in an interpreted program is translated
    every time it is carried out, whereas with a compiled program, a source code instruction
    is translated only once, and this translation is permanently recorded in the final
    executable file.


    Why are interpreted languages so popular? For many programming chores, the results
    are "fast enough", but the real advantage is that it is generally faster and easier
    to develop interpreted programs than compiled programs. Programs are usually developed
    in a repeating cycle of code, compile, test. As a program grows in size, the compilation
    phase of the cycle can become quite long. Interpreted languages remove the compilation
    step and speed up program development.


    # Compiling a C Program


    Let''s compile something. Before we do that, however, we''re going to need some
    tools like the compiler, the linker, and make. The C compiler used universally
    in the Linux environment is gcc (GNU C Compiler), originally written by Richard
    Stallman. Most distributions do not install gcc by default. We will check to see
    if the compiler is present like this:


    ```

    ~linuxbox ~$ which gcc

    usr/bin/gcc

    ```


