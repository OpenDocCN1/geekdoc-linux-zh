- pgno: 272
  md: 'Though we used the long form of the option for clarity, -k 1,1 -2n would be
    exactly equivalent. In the first instance of the key option, we specified a range
    of fields to include in the first key. Since we wanted to sort by the first field,
    we specified 1,1, which means "start at field 1 and end at field 2". In the second
    instance, we specified 2n, which means that field 2 is the sort key and n to indicate
    the type of sort to be performed. These option letters are the same as the global
    options for the sort program: b (ignore leading blanks), n (numeric sort), r (reverse
    sort), and so on.


    The third field in our list contains a date in an inconvenient format for sorting.
    On computers, dates are usually formatted in YYYY-MM-DD order but ours are in
    the American format of MM/DD/YYYY. How can we sort this list in chronological
    order?


    Fortunately, sort provides a way. The key option allows specification of offsets
    within fields: we define keys here:


    ```

    me@linuxbox]$ sort -k 3.7br -k 1.3nbr -k 3.4nbr distros.txt

    Fedora      10         11/25/2008

    Ubuntu      8.10       10/30/2008

    SUSE        11.0       06/19/2008

    Fedora      9          05/13/2008

    Ubuntu      8.04       04/24/2008

    Fedora      8          11/08/2007

    Ubuntu      7.10       10/18/2007

    SUSE        10.3       10/04/2007

    Fedora      7          05/31/2007

    Ubuntu      7.04       04/19/2007

    SUSE        10.2       12/07/2006

    Ubuntu      6.10       10/24/2006

    Fedora      6          06/30/2006

    Ubuntu      6.06       06/01/2006

    SUSE        10.1       05/11/2006

    Fedora      5          03/20/2007

    ```


    By specifying -k 3.7, we instruct sort to use a key that begins at the seventh
    character within the third field, which corresponds to the start of the year.
    Likewise, we specify -k 3.1 and -k 3.4 to isolate the month and day of the date.
    We also add the n and r options to achieve a reverse numeric sort. The b option
    is included to suppress the leading spaces (whose numbers vary from line to line,
    thereby affecting the outcome of the sort) in the date:


    Some files do not use tabs and spaces as delimiters; for example, the /etc/passwd
    file:


    ```

    me@linuxbox]$ head /etc/passwd

    root:x:0:0:root:/bin/bash

    demon:x:1:1:daemon:/usr/bin/bin

    bin:x:2:2:bin:/bin/bash

    sys:x:3:3:sys:/dev/bin

    sync:x:4:65534:sync:/bin/sync

    games:x:5:60:games:/usr/games/bin/games

    man:x:6:12:man:/var/cache/man:/bin/bash

    ```'
