    What''s important here is that there are no error messages. If there were, the
    configuration would have failed, and the program would not build until the errors
    are corrected.


    We see configure created new files in our source directory. The most important
    one is Makefile, Makefile is a configuration file that instructs the program exactly
    how to build the program. Without it, make will refuse to run. Makefile is an
    ordinary text file, so we can view it:


    ```

    [me@linuxbox diction-1.11]$ make Makefile

