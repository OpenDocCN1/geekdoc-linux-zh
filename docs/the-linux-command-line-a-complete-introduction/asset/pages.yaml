    # End Of Report


    Our report is the result of our pipeline of commands. First, we sort the list
    by distribution name and version (fields 1 and 2), and then we process the results
    with sed, adding the report header (including the logical page markup for nl1).
    Finally, we produce the result with nl, which, by default, numbers only the lines
    of the text stream that belong to the body section of the logical page.


    We can repeat the command and experiment with different options for nl1. Some
    interesting ones are


    ```

    nl -n rz

