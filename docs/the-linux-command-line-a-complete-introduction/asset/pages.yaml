  md: '# Table 32-1: The * and @ Special Parameters


    | Parameter | Description |

    | --- | --- |

    | $% | Expands into the list of positional parameters, starting with 1. When surrounded
    by double quotes, it expands into a double-quoted string containing all the positional
    parameters, separated by the first character of the IFS shell variable (by default
    space character). |

    | @ | Expands into the list of positional parameters, starting with 1. When surrounded
    by double quotes, it expands each positional parameter into a separate word surrounded
    by double quotes. |


    Here is a script that shows these special parameters in action:


    pass_params "word" "words with spaces"


    In this rather program, we create two arguments, word and words with spaces, and
    pass them to the pass_params function. That function, in turn, passes them on
    to the print_params function, using each of the four methods available with the
    special parameters $* and @. When executed, the script reveals differences:


    ```

    me@linuxbox ~}$ posit-param3

    $*

    $1 = word

    $2 = words

    $3 = with

    $4 = spaces


    "*" :

    $1 = words with spaces

    $2 =

    ```'
