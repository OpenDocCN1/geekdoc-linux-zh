- pgno: 396
  md: "# Missing or Unexpected Tokens\n\nAnother common mistake forgetting to complete\
    \ a compound command, such as if or while. Let's look at what happens if we remove\
    \ the semicolon after the test in the if command.\n\n```\n#!/bin/bash\n```\n\n\
    ```\n# trouble: script to demonstrate common errors\nnumber=1\nif [ $number =\
    \ 1 ] then\n    echo \"Number is equal to 1.\"\nelse\n    echo \"Number is not\
    \ equal to 1.\"\nfi\n```\n\nThe result is:\n\n```\n[me@linux~$]$ trouble\n/home/me/bin/trouble:\
    \ line 9: syntax error near unexpected token `else'\n/home/me/bin/trouble: line\
    \ 9: 'else'\n```\n\nAgain, the error message points to a error that occurs later\
    \ than the actual problem. What happens is really pretty interesting. As we recall,\
    \ if a list of commands evaluates the exit code of the last command in the list.\
    \ In our program, we intend this list to consist of a single command, [, a synonym\
    \ for test. The [ command takes what it follows as a list of arguments—in our\
    \ code, four arguments: $number, = 1, and ]. With the semicolon removed, the word\
    \ then is added to the list of arguments, which is syntactically legal. The following\
    \ echo command is legal, too. It is interpreted as another command in the list\
    \ of commands that if will evaluate an exit code. The else is encountered next,\
    \ but it's out of place, since the shell recognizes it as a *reserved* (a word\
    \ that has special meaning to the shell) and not the name of a command. Hence\
    \ the error message.\n\n# Unanticipated Expansions\n\nIt's possible to have errors\
    \ that occur intermittently in a script. Sometimes the script will run fine, and\
    \ other times it will fail because of the results of an expansion. If we return\
    \ our missing semicolon and change the value of number to an empty variable, we\
    \ can demonstrate:\n\n```\n#!/bin/bash\n# trouble: script to demonstrate common\
    \ errors\nnumber=\n```"
  merge: -1
  img_proc: true
- pgno: 397
  md: "```\nif [ $number = 1 ]; then\n    echo \"Number is equal to 1\"\nelse\n  \
    \  echo \"Number is not equal to 1\"\nfi\n```\n\nRunning the script with this\
    \ change results in the output:\n\n```\n[me@linuxbox]$ trouble\n/home/me/bin/trouble:\
    \ line 7: [: =: unary operator expected\nNumber is not equal to 1.\n```\n\nWe\
    \ get this rather cryptic error message, followed by the output of the second\
    \ echo command. The problem is the expansion of the number variable within the\
    \ test command. When the command\n\n```\n[ $number = 1 ]\n```\n\nundergoes expansion\
    \ with number being empty, the result is this:\n\n```\n= 1 ]\n```\n\nwhich is\
    \ invalid, and the error is generated. The = operator is a binary operator (it\
    \ requires a value on each side), but the first value is missing, so the test\
    \ command expects a unary operator (such as -z) instead. Further, since the test\
    \ failed (because of the error), the if command receives a non-zero exit code\
    \ and acts accordingly, the second echo command is executed.\n\nThis problem can\
    \ be corrected by adding quotes around the first argument in the test command:\n\
    \n```\n\"$number\" = 1 ]\n```\n\nThen expansion occurs, the result will be this:\n\
    \n```\n\" = 1 ]\n```\n\nwhich yields the correct number of arguments. In addition\
    \ to being used with empty strings, quotes should be used in cases where a value\
    \ could expand into multibord strings, as with filenames containing embedded spaces.\n\
    \n# Logical Errors\n\n+   Incorrect conditional expressions. It's easy to incorrectly\
    \ code an if/then/else statement and have the wrong logic carried out. Sometimes\
    \ the logic will be reversed, or it will be incomplete."
  merge: -1
  img_proc: true
- pgno: 398
  md: "+   • “Off by one” errors. When coding loops that employ counters, it is possible\
    \ to overlook that the loop may require the counting start with 0, rather than\
    \ 1, for the count to conclude at the correct point. These kinds of errors result\
    \ in either a loop “going off the end” by counting too far, or else missing the\
    \ last iteration of the loop by terminating one iteration too soon.\n\n+   • Unanticipated\
    \ situations. Logical errors result from a program encountering data or situations\
    \ that were unforeseen by the programmer. These can also include unanticipated\
    \ expansions, such as a filename that contains embedded spaces that expands into\
    \ multiple command arguments rather than a single filename.\n\n# Defensive Programming\n\
    \nIt is important to verify assumptions when programming. This means a careful\
    \ evaluation of the exit status of programs and commands that are used by a script.\
    \ Here is an example, based on a true story. An unfortunate system administrator\
    \ wrote a script to perform a maintenance task on an important server. The script\
    \ contained the following two lines of code:\n\n```\ncd $dir_name\nrm *\n```\n\
    \nThere is nothing intrinsically wrong with these two lines, as long as the variable,\
    \ dir_name, exists. But what happens if it does not? In that case, the cd command\
    \ fails, and the script continues to the next line and deletes the files in the\
    \ current working directory. Not the desired outcome at all! The hapless administrator\
    \ destroyed an important part of the server because of this design decision.\n\
    \nLet’s look at some ways this design could be improved. First, it might be wise\
    \ to make the execution of rm contingent on the success of cd:\n\n```\ncd $dir_name\
    \ && rm *\n```\n\nThis way, if the cd command fails, the rm command is not carried\
    \ out. This is better, but still leaves open the possibility that the variable,\
    \ dir_name, is unset or empty, which would result in the files in the user’s home\
    \ directory being deleted. This could also be avoided by checking to see that\
    \ dir_name actually contains the name of an existing directory:\n\n```\n[ -d $dir_name\
    \ ]] && cd $dir_name && rm *\n```\n\nOften, it is better to terminate the script\
    \ with an error when an situation such as the one occurs:\n\n```\nif [[ -d $dir_name\
    \ ]]; then\n  if cd $dir_name; then\n    rm *\n```"
  merge: -1
  img_proc: true
