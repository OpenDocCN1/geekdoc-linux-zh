- pgno: 430
  md: '# 34


    # # STRINGS AND NUMBERS


    Computer programs are all about working with data. In past chapters, we have focused
    on processing data at the file level. However, many programming problems need
    to be solved using smaller units of data such as strings and numbers.


    In this chapter, we will look at several shell features that are used to manipulate
    strings and numbers. The shell provides a variety of parameter expansions that
    perform string operations. In addition to arithmetic expansion (which we touched
    upon in Chapter 7), there is a common command line program called be, which performs
    higher-level math.


    # ## Parameter Expansion


    Though parameter expansion came up in Chapter 7, we did not cover it in detail
    because most parameter expansions are used in scripts rather than on the command
    line. We have already worked with some forms of parameter expansion; for example,
    shell variables. The shell provides many more.'
  merge: -1
  img_proc: true
- pgno: 431
  md: '# Basic Parameters


    The simplest form of parameter expansion is reflected in the ordinary use of variables.
    For example, $a, when expanded, becomes whatever the variable contains. Simple
    parameters may also be surrounded by braces, such as ${a}. This has no effect
    on the expansion, but it is required if the variable is adjacent to other text,
    which may confuse the shell. In this example, we attempt to create a filename
    by appending the string _file to the contents of a variable.


    ```

    [melinuxbox ~]$ a="foo"

    [melinuxbox ~]$ echo "$file"

    ```


    If we perform this sequence, the result will be nothing, because the shell will
    try to expand a variable named _file rather than a. This problem can be solved
    by adding braces:


    ```

    [melinuxbox ~]$ echo "${a}_file"

    foo_file

    ```


    We have also seen that positional parameters greater than 9 can be accessed by
    surrounding the number in braces. For example, to access the 11th positional parameter,
    we can do this: ${11}.


    # Expansions to Manage Empty Variables


    Several parameter expansions deal with nonexistent and empty variables. These
    expansions are handy for handling missing positional parameters and assigning
    default values to parameters. Here is one such expansion:


    > ${parameter:=word}


    If parameter is unset (i.e., does not exist) or is empty, this expansion results
    in the value of word. If parameter is not unset, the expansion results in the
    value of parameter.


    ```

    [melinuxbox ~]$ foo=

    [melinuxbox ~]$ echo ${foo:-substitute value if unset}

    stitute value if unset

    [melinuxbox ~]$ echo $foo

    ```


    ```

    [melinuxbox ~]$ foo=bar

    [melinuxbox ~]$ echo ${foo:-substitute value if unset}

    bar

    [melinuxbox ~]$ echo $foo

    ```


    Here is another expansion, in which we use the equal sign instead of a dash:


    > ${parameter:=word}'
  merge: -1
  img_proc: true
- pgno: 432
  md: 'If parameter is unset or empty, this expansion results in the value of word.
    In addition, the value of word is assigned to parameter. If parameter is not empty,
    the expansion results in the value of parameter.


    ```

    me@linuxbox ~]$ foo=

    me@linuxbox ~]$ echo ${foo:"default value if unset"

    default value if unset

    me@linuxbox ~]$ echo $foo

    default value if unset

    me@linuxbox ~]$ foo=bar

    me@linuxbox ~]$ echo ${foo:"default value if unset"

    bar

    me@linuxbox ~]$ echo $foo

    ```


    Note: Positional and other special parameters cannot be assigned this way:


    Here we use a question mark:

    $(parameter:word)


    If parameter is unset or empty, this expansion causes the script to exit with
    an error, and the contents of word are set to standard error. If parameter is
    not empty, the expansion results in the value of parameter.


    ```

    me@linuxbox ~]$ foo=

    me@linuxbox ~]$ echo ${foo:"parameter is empty"

    bash: foo: parameter is empty

    me@linuxbox ~]$ echo $?

    1

    me@linuxbox ~]$ foo=bar

    me@linuxbox ~]$ echo ${foo:"parameter is empty"

    bar

    me@linuxbox ~]$ echo $?

    0

    ```


    Here we use a plus sign:

    $(parameter:+word)


    If parameter is unset or empty, the expansion results in nothing. If parameter
    is not empty, the value of word is substituted for parameter; however, the value
    of parameter is not changed.


    ```

    me@linuxbox ~]$ foo=

    me@linuxbox ~]$ echo ${foo:"substitute value if set"}

    ```


    ```

    me@linuxbox ~]$ foo=bar

    me@linuxbox ~]$ echo ${foo:"substitute value if set"

    substitute value if set

    ```


    # Expansions That Return Variable Names


    The shell has the ability to return the names of variables. This feature is used
    in some rather exotic situations.'
  merge: -1
  img_proc: true
- pgno: 433
  md: '```

    ${!prefix}*

    ${!prefix}@

    ```


    This expansion returns the names of existing variables with names beginning with
    prefix. According to the bash documentation, both forms of the expansion perform
    identically. Here, we list all the variables in the environment with names that
    begin with BASH:


    ```

    me[linuxbox ~]$ echo ${BASH*}

    BASH BASH_ARGS BASH_ARGV BASH_COMMAND BASH_COMPLETION BASH_COMPLETION_DIR

    BASH_LINENO BASH_SOURCE BASH_SUBSHELL BASH_VERSINFO BASH_VERSION

    ```


    # String Operations


    There is a set of expansions that can be used to operate on strings. Many of these
    expansions are particularly well suited for operations on pathnames.

    The expansion


    ```

    ${#parameter}

    ```


    expands into the length of the string contained by parameter. Normally, parameter
    is a string; however, if parameter is @ or *, the expansion results in the number
    of positional parameters.


    ```

    me[linuxbox ~]$ foo="This string is long."

    me[linuxbox ~]$ echo ${#foo} characters long.

    "This string is long." is 20 characters long.

    ```


    ```

    ${parameter:offset}

    ${parameter:offset:length}

    ```


    This expansion is used to extract a portion of the string contained in parameter.
    The extraction begins at offset characters from the beginning of the string and
    continues until the end of the string, unless the length is specified.


    ```

    me[linuxbox ~]$ foo="This string is long."

    me[linuxbox ~]$ echo ${foo:-5}

    string is long.

    me[linuxbox ~]$ echo ${foo:5:6}

    lo

    ```


    If the value of offset is negative, it is taken to mean it starts from the end
    rather than the beginning. Note that negative values must be preceded by a space
    to prevent confusion with the ${parameter:-word} expansion. length, if present,
    must not be less than 0.

    If parameter is @, the result of the expansion is length positional parameter,
    starting at offset.


    ```

    me[linuxbox ~]$ foo="This string is long."

    me[linuxbox ~]$ echo ${foo:-5}

    long.

    me[linuxbox ~]$ echo ${foo:-5:2}

    ```'
  merge: -1
  img_proc: true
- pgno: 434
  md: '$${parameter}pattern}

    ${parameter##pattern}


    These expansions remove a portion of the string contained in parameter defined
    by pattern. pattern is a wildcard pattern like those used in patname expansion.
    The difference in the two forms is that the # removes the shortest match, while
    the ## form removes the longest match.


    ```

    me[@linuxbox ~]$ foo-file.txt.zip

    melinuxbox ~]$ echo ${foo*}

    txt.zip

    me[@linuxbox ~]$ echo ${foo##}

    zip

    ```


    $${parameter%pattern}

    ${parameter%%pattern}


    These expansions are the same as the # and ## expansions above, except they remove
    text from the end of the string contained in parameter rather than from the beginning.


    ```

    me[@linuxbox ~]$ foo=file.txt.zip

    melinuxbox ~]$ echo ${foo*}\}

    txt.file

    melinuxbox ~]$ echo ${foo%%*}

    file

    ```


    ```

    $${parameter/pattern/string}

    ${parameter*/pattern/string}

    ${parameter##pattern/string}

    ${parameter%%pattern/string}

    ```


    This expansion performs a search and replace upon the contents of parameter. If
    text found matching wildcard pattern, it is replaced with the contents of string.
    In the normal form, only the first occurrence of pattern is replaced. In the //
    form, all occurrences are replaced. The # form requires the match to occur at
    the beginning of the string, and the /% requires the match to occur at the end
    of the string., /string may be omitted, which causes the pattern to be deleted.


    ```

    me[@linuxbox ~]$ foo=JPG.JPG

    melinuxbox ~]$ echo ${foo/JPG/jpg}

    jpg.JPG

    melinuxbox ~]$ echo ${foo//JPG/jpg}

    jpg.JPG

    melinuxbox ~]$ echo ${foo#/JPG/jpg}

    jpg.JPG

    me[@linuxbox ~]$ echo ${foo%%JPG/jpg}

    JPG.JPG

    ```


    Parameter expansion is a good thing to know. The string-manipulation expansions
    can be used as substitutes for other common commands as sed and cut. Expansions
    improve the efficiency of scripts by eliminating the use of external programs.
    As an example, we will modify the longest-word program discussed in the previous
    chapter to use the parameter expansion'
  merge: -1
  img_proc: true
