- pgno: 231
  md: 'This command lists all 100 directories and 2,600 files in playground (as well
    as timestamp playground itself, for a total of 2,702) because none of meets our
    definition of "good permissions." With knowledge of operators and actions, we
    can add actions to this command to apply new permissions to the files and directories
