    We assign values to two variables, foo and foo1. We perform a cp but miss the
    name of the second argument. After expansion, the cp command is sent only one
    argument, though it requires two.

    There are some rules about variable names:


    +   * Variable names may consist of alphanumeric characters (letters and numbers)
    and underscore characters.

    * The first character of a variable name must be either a letter or an underscore.


    +   * Spaces and punctuation symbols are not allowed.


    The word variable implies a value that can change, and in many applications, variables
    are used this way. However, the variable in our application, title, is used as
    a constant. A constant is just like a variable in that it has a name and a value.
    The difference is that the value of a constant does not change. In an application
    that performs geometric calculations, we might define PI as a constant and assign
    it the value of 3.1415, instead of using the number literally throughout our program.
    The shell makes no distinction between variables and constants; these terms are
