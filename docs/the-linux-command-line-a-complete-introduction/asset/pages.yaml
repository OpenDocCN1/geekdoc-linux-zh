  md: '# #10


    # ## PROCESSES


    Modern operating systems are usually multitasking, meaning that they create the
    illusion of doing more than one thing at once by rapidly switching from one executing
    program to another. The Linux kernel manages this through the use of processes.
    Processes are how Linux organizes the different programs waiting for their turn
    at the CPU.


    Sometimes a computer will become sluggish, or an application will stop responding.
    In this chapter, we will look at some of the tools available at the command line
    that let us examine what programs are doing and how to terminate processes that
    are misbehaving.


    This chapter will introduce the following commands:


    +   - ps—Report a snapshot of current processes.

    - top—Display tasks.

    - jobs—List active jobs.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '+   - bg—Place a job in the background.

    - fg—Place a job in the foreground.

    - kill—Send a signal to a process.

    - killall—Kill processes by name.

    - shutdown—Shut down or reboot the system.


    # # How a Process Works


    When a process starts up, the kernel initiates a few of its own activities as
    processes and launches a program called init. init, in turn, runs a series of
    shell scripts (located in /etc) called init scripts, which start all the system
    services. Many of these services are implemented as daemon programs, programs
    that just sit in the background and do their thing without having any interface.
    So even if we are not logged in, the system is at least busy performing routine
    stuff.


    The fact that a program can launch other programs is expressed in the process
    scheme as a parent process producing a child process. The kernel maintains information
    about each process to help keep things organized. For example, each process is
    assigned a number called process ID (PID). PIDs are assigned in ascending order,
    with PID 1. The kernel also keeps tracks of the memory assigned to each process,
    as well as the processes'' readiness to resume execution. Like files, processes
    also have owners and IDs, effective user IDs, and so on.


    # ## Viewing Processes with ps


    The most used command to view processes (there are several) is ps. The ps program
    has a lot of options, but in its simplest form it is used like this:


    ```

    me@linux ~ ps

    PID TTY CMD

    5198 pts/1 00:00 bash

    10129 pts/1 00:00 ps

    ```


    In this example we lists two processes: 5198 and process 10129, which are bash
    and ps respectively. As we can see, by default ps doesn''t show you much, the
    processes associated with the current terminal session. To see more, we need to
    add some options, but before we do that, let''s look at the other fields produced
    by ps. TTY is short for teletype and refers to the controlling terminal for the
    process. Unix is showing its age here. The TIME field is the amount of CPU time
    consumed by the process. As we can see, neither process makes the computer work
    very hard.'
  merge: -1
  img_proc: true
