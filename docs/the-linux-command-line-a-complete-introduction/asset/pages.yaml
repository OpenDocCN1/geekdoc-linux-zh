    In this version of the script, we set up an endless loop (one that never terminates
    on its own) by using the true command to supply an exit status to while. Since
    true will always exit with a exit status of 0, the loop will never end. This is
    a surprisingly common scripting technique. The loop will never end on its own,
    it''s up to the program to provide some way to break out of the loop when the
    time is right. In this script, the break command is used to exit the loop when
    the 0 selection is chosen. The continue command has been included in all of the
    other script choices to allow for more efficient execution. By using continue,
    the script will skip over code that is not needed when a selection is identified.
    For example, if the 1 selection is chosen and identified, there is no reason to
    test the other selections.


    # until


    The until command is much like while, except instead of exiting a loop when a
    non-zero exit status is encountered, it does the opposite. An until continues
    until it receives a 0 exit status. In our while-count script, we continue the
    loop as long the value of the count variable is less than or equal to 5. We could
    get the same result by coding the script with until:


    ```

    #!/bin/bash

    # until-count: display a series of numbers

    count=1

    until [ $count -gt 5 ]; do

    echo $count

    count=$((count + 1))

    done

    echo "Finished."

    ```


    By changing the test expression to $count -gt 5, until will terminate the loop
    at the correct time. Deciding whether to use the while or until loop is usually
    a matter of choosing the one that allows the cleanest test to be written.'
  merge: -1
  img_proc: true
- pgno: 393
  md: "# Reading Files with Loops\n\nwhile and until can process standard input. This\
    \ allows files to be processed with while and until loops. In the following example,\
    \ we will display the contents of the distros.txt file used in earlier chapters:\n\
    \n```\n#!/bin/bash\n\n# while-read: read lines from a file\n\nwhile read distro\
    \ version; do\n    printf \"Distro: %s\\tVersion: %s\\tReleased: %s\\n\" \\\n\
    \        $distro \\\n        $version \\\n        $release\ndone < distros.txt\n\
    ```\n\nTo redirect a file to the loop, we place the redirection operator after\
    \ the done statement. The loop will use read to input the fields from the redirected\
    \ file. The read command will exit after each line is read, with a 0 exit status\
    \ is reached. At that point, it will exit with a non-zero exit status, thereby\
    \ terminating the loop. It is also possible to pipe standard input into a loop:\n\
    \n```\n#!/bin/bash\n\n# while-read2: read lines from a file\nsort -k 1,1 -k 2n\
    \ distros.txt | while read distro release; do\n    printf \"Distro: %s\\tVersion:\
    \ %s\\tReleased: %s\\n\" \\\n        $distro \\\n        $version \\\n       \
    \ $release\n```\n\nWe take the output of the sort command and display the stream\
    \ of text. However, it is important to remember that since a pipe will execute\
    \ the loop in a subshell, any variables created or assigned within the loop will\
    \ be lost when the loop terminates.\n\n# Final Note\n\nWith the introduction of\
    \ loops and our previous encounters with branching, subroutines, and sequences,\
    \ we have covered the major types of flow control used in programs. bash has some\
    \ more tricks up its sleeve, but they are refinements on these basic concepts."
  merge: -1
  img_proc: true
