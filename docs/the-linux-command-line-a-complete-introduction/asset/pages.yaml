    Adding the -t option to groff instructs it to preprocess the stream with telike;
    the -O option is used to output to ASCII rather than to the default output, PostScript.


    The format of the output is the best we can expect if we are limited to the capabilities
    of a terminal screen or typewriter-printer. If we specify PostScript output and
    graphically viewing the result, we get a more satisfying result (see Figure 21-2).


    ```

    [me@linuxbox ~]$ sort -k 1 -k 2n distros.txt | sed -f distros-tbl.sed | groff

    ~/Desktop/foo.ps

    ```


    ![](img/aa9c1f11ce2d496265d3ab82e4de6f44_314_0.png)


    Figure 21-2: Viewing the finished table


    # # Final Note


    Given that text is central to the character of Unix-like operating systems, it
    makes sense that there would be many tools that are used to manipulate and format
    text. As we have seen, there are! The simple formatting tools like fmt and pr
    will find many scripts that produce short documents, while groff (and friends)
    can be used to write books. We may never write a technical paper using command-line
    tools (though many people do!), but it''s good to know that we could.'
  merge: -1
