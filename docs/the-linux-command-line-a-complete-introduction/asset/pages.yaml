    | ALT-P | Reverse search, non-incremental. With this key, the search string and
    press ENTER before the search is performed. |

    | ALT-N | Forward search, non-incremental. |

    | CTRL-O | Execute the current item in the history list and advance to the next
    one. This is handy if you are trying to re-execute a sequence of commands in the
    history list. |


    # History Expansion


    The shell offers a specialized type of expansion for items in the history list
    by using the ! character. We have already seen how the exclamation point can be
    followed by a number to insert an entry from the history list. There are a number
    of other expansion features (see Table 8-6).


    I would caution against using the !string and !?string unless you are absolutely
    sure of the contents of the history list items.


    Many elements are available in the history expansion mechanism, but this subject
    is already too arcane and our heads might explode if we continue. The "HISTORY
    EXPANSION" section of the bash man page goes into all the gory details. Feel free
    to explore!'
  merge: -1
