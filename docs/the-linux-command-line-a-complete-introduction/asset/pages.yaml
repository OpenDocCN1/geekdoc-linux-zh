    # # Quoting


    Now that we have seen many ways the shell can perform expansions, it''s time to
    learn how we can control it. For example, this:


    ```

    me@linuxbox ~]$ echo this is a test

    this is test

    ```


    Or this:


    ```

    me@linuxbox ~]$ echo The total is $100.00

    The total is 00.00

    ```


    In the first example, splitting by the shell removed extra whitespace from the
    command''s arguments. In the second example, parameter expansion substituted an
    empty string for the value of $1 because it is an undefined variable. The shell
    provides a mechanism called quoting to selectively suppress expansions.


    # # Double Quotes


    The first type of quoting we will look at is double quotes. If you place text
    inside double quotes, all the special characters used by the shell lose their
    special meaning and are treated as ordinary characters. The exceptions are $ (dollar
    sign), \ (backslash), and ` (back tick). This means that splitting, pathname expansion,
    tile expansion, and brace expansion are suppressed, but parameter expansion, arithmetic
    expansion, and command substitution still are. Using double quotes, we can cope
    with filenames containing embedded spaces. Were were the unfortunate victim of
    a file named words.txt. If we tried to use this on the command line, splitting
    would cause this to be treated as two arguments rather than the desired argument:


    ```

    me@linuxbox ~]$ ls -l two words.txt

    ls: cannot access two: No such file or directory

    ls: cannot access words.txt: No such file or directory

    ```'
