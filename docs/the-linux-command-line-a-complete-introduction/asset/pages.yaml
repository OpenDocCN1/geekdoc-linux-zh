  md: '# 8


    # ADVANCED KEYBOARD

    TRICKS


    I often kiddingly describe Unix as “the operating system for people who like to
    type.” Of course, the fact that it even has a command line is a testament to that.
    But command line users don’t like to type that much. Why would we so many commands
    have such short names, like cp, ls, mv, and rm?


    In fact, one of the most cherished goals of the command line is laziness—doing
    the most work with the fewest keystrokes. Another goal is never having to lift
    your fingers from the keyboard—never reaching for the mouse. In this chapter,
    we will look at bash features that make keyboard use faster and more efficient.


    The following commands will make an appearance:


    +   - clear—Clear the screen.


    +   - history—Display the contents of the history list.'
