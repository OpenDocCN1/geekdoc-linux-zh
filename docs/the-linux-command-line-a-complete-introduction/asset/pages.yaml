    # # LINUX IS ABOUT IMAGINATION


    When I am asked to explain the difference between Windows and Linux, I often use
    a toy analogy.

    Windows is like a Game Boy. You go to the store and buy all shiny new in the box.
    You take it home, turn it on, and play with it. Pretty graphics, cute sounds.
    After a while, you get tired of the game that came with it, and you go back to
    the store and buy another one. Finally, you want a game that does this! "Only
    to be told that no such game exists because there is no "market demand" for. Then
    you say, "But I only need to change this thing! The person behind the counter
    says you can''t change it. The games are all sealed up in their cartridges. You
    discover that your toy is limited to the games that others have decided you need
    and no more.


    Linux, on the other hand, is like the world''s largest Erector Set. You open it
    up, and it''s just a huge collection of parts—lot of steel struts, screws, nuts,
    gears, pulleys, and motors and a few suggestions on what to build. You start to
    play with it. You discover that you have your own ideas of what to make. You never
    have to go back to the store, because you already have everything you need. The
    Erector Set takes on the shape of your imagination. It does what you want.


    Your choice of toys is, of course, a personal thing, so which toy would you find
    more satisfying?


    Chapter 6'
