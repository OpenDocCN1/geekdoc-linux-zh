    Unless otherwise via the command-line option --dont-backup, aspell creates a backup
    file containing the original text by appending the .bak to the filename.


    Showing off our editing prowess, we''ll put our spelling mistakes in so we can
    reuse our:


    ```

    @linuxbox $ sed -i ''s/lazy/lazy/;s/jumped/jimped/'' foo.txt

