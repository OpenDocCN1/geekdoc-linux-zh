- pgno: 44
  md: '# 3

    EXPLORING THE SYSTEM


    Now that we know how to move around the filesystem, it''s time for a guided tour
    of our Linux system. Before we start, however, we''re going to learn some more
    commands that will be useful along the way:


    +   - List directory contents.

    - file—Determine file type.

    - less—View file contents.


    # More Fun with ls


    ls is probably the most used command and for good reason. With it, we can see
    directory contents and determine a variety of important file and directory attributes.
    As we have seen, we can simply enter ls to see a list of files and subdirectories
    contained in the current directory:


    ```

    [melinuxbox ~]$ ls

    Desktop Documents Pictures Public Templates Videos

    ```'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'Besides the current working directory, we can specify the directory to list,
    like so:


    ```

    me@linuxbox ~$ ls /usr

    bin games kerberos libexec sbin src

    etc include lib local share tmp

    ```


    or even specify multiple directories. In this example we will list both the user''s
    home directory (symbolized by the ~ character) and the /usr directory:


    ```

    me@linuxbox ~$ ls -u ~

    /home:

    Desktop Documents Music Pictures Public Templates Videos

    bin games kerberos libexec sbin src

    etc include lib local share tmp

    ```


    We can also change the format of the output to reveal detail:


    ```

    me@linuxbox ~$ ls -l

    total drwxr-xr-x 2 me 4096 2012-10-26 17:20 Desktop

    drwxr-xr-x 2 me 4096 2012-10-26 17:20 Documents

    drwxr-xr-x 2 me 4096 2012-10-26 17:20 Music

    drwxr-xr-x 2 me 4096 2012-10-26 17:20 Pictures

    drwxr-xr-x 2 me 4096 2012-10-26 17:20 Public

    drwxr-xr-x 2 me 4096 2012-10-26 17:20 Templates

    drwxr-xr-x 2 me 4096 2012-10-26 17:20 Videos

    ```


    By adding -1 to the command, we changed the output to the long format.


    # Options and Arguments


    This brings us to a very important point about how most commands work. Commands
    are often followed by one or more options that modify their behavior and, further,
    by one or more arguments, the items upon which the command acts. So most commands
    look something like this:


    ```

    command -options arguments

    ```


    Most commands use options consisting of a single character preceded by a dash,
    such as -l. But many commands, including those from the GNU Project, also support
    long options, consisting of a word preceded by two dashes. Also, many commands
    allow multiple short options to string together. In this example, the ls command
    is given two options, the l option to produce long format output, and the t option
    to sort the result by the file’s modification time:


    ```

    me@linuxbox ~$ ls -lt

    ```'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'We''ll add the long option --reverse to reverse the order of the sort:


    ```

    [me@linux ~]$ ls -lt --reverse

    ```


    The ls command has a large number of possible options. The most common ones are
    listed in Table 3-1.


    # Table 3-1: Common Isns Options


    | Option | Long Option | Description |

    | --- | --- | --- |

    | -a | --all | List all files, even those with names that begin with a period,
    which are normally not listed (i.e., hidden). |

    | -d | --directory | Ordinarily, if a directory is specified, ls will list the
    contents of the directory, not the directory itself. Use this option in conjunction
    with the -l option to see details about the directory rather than its contents.
    |

    | -F | --classify | This will append an indicator character to the end of each
    listed name (for example, a forward slash if that is a directory). |

    | -h | --human-readable | In long format listings, display file sizes in human-readable
    format rather than in bytes. |

    | -l | | Display results in long format. |

    | -r | --reverse | Display the results in reverse order. Normally, ls displays
    its results in ascending alphabetical order. |

    | -S | | Sort results by file size. |

    | -t | | Sort results by modification time. |


    # A Longer Look at Long Format


    As we saw before, the -l option causes ls to display its results in long format.
    This format contains a great deal of useful information. Here are the Examples
    from an Ubuntu system:


    ```

    -rw-r--r-- 1 root 357296 2012-04-03 11:05 Experience ubuntu.ogg

