    # Changing Identities


    At various times, we may find it necessary to take over the identity of another
    user. Often we want to gain superuser privileges to carry out administrative task,
    but it is also possible to "become" another regular user to perform such tasks
    as testing an account. There are three ways to take on an alternate identity:


    +   * Log out and log back in the alternate user.

    * Use the sudo command.

    * Use the sudo command.


    We will skip the first technique because we know how to do it and it lacks the
    convenience of the two. From your own shell session, the sudo command allows you
    to assume the identity of another user and start a new shell session with user’s
    ID or issue a single command as that. The sudo command allows an administrator
    to set up a configuration file /etc/sudoers and define specific commands that
    particular users are permitted to execute under an assumed identity. The choice
    of which command to use is largely determined by which Linux distribution you
    use Your distribution probably includes both commands, but its configuration will
    favor one or the other. We’ll start with su:


    # su—Run a Shell with Substitute User and Group IDs


    The command is used to start a shell as another user. The command syntax looks
    like this:


    ```

    su -1] [user]

    ```'
