- pgno: 291
  md: 'medium. We can write them, but we sometimes cannot read them. Before we are
    tempted to run away in terror from this command, let''s look at how it was constructed.
    First, we know that the command will have this basic structure:


    ```

    sed /\regexp/replace\''/ distros.txt

    ```


    Our next step is to figure out a regular expression that will isolate the date.
    Since it is in MM/DD/YYYY format and appears at the end of the line, we can use
    an expression like this:


    ```

    [0-9]{2}/[0-9]{2}/[0-9]{4}$

    ```


    which matches two digits, a slash, two digits, a slash, four digits, and the end
    of the line. So that takes what replacement? To handle that, we must introduce
    a new regular expression feature that appears in some applications that we use
    BRE. This feature is called back references and works like this: if the sequence
    \n appears in replacement where n is a number from one to nine, the sequence will
    refer to the corresponding subexpression in the preceding expression. To create
    the subexpressions, we simply enclose them in parentheses:


    ```

    (([0-9]{2})([0-9]{2})([0-9]{4})$

    ```


    We now have three subexpressions. The first contains the month, the second contains
    the day of the month, and the third contains the year. Now we can construct replacement
    as follows:


    ```

    \3-1\-2

    ```


    which gives us the year, a dash, the month, and the day. Now, our command looks
    like this:


    ```

    sed ''s/([0-9]{2})/([0-9]{2})/([0-9]{4})$\3-\1\-2/'' distros.txt

    ```


    We have two remaining problems. The first is that the extra slashes in our regular
    expression will confuse when it tries to interpret the s command. The second is
    that since sed, by default, accepts only basic expressions, several of the characters
    in our regular expression will be interpreted as literals, rather than metacharacters.
    We can solve both problems with a liberal application of backslashes to escape
    the challenging characters:


    ```

    sed ''s/\([0-9]{2})\/\([0-9]{2})\/\([0-9]{4})$\\3-\\1\\-2/'' distros.txt

    ```


    And there have it! Another feature of the s command is the use of optional flags
    that may follow the replacement string. The most important of these is the g flag,
    which instructs sed to apply the search and replace globally to a line, not just
    to the first instance, which is the default.'
  merge: -1
  img_proc: true
