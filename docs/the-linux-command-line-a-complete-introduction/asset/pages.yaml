    [melinuxbox] ~ gzip foo.txt

    [melinuxbox] ~ ls -1 foo.*\*

    -W-I--R- 1 me 3230 2012-10-14 07:15 foo.txt.gz

    [melinuxbox] ~ gzip foo.txt

    [melinuxbox] ~ ls -1 foo.*\*

    -W-I--R- 1 me 15738 2012-10-14 07:15 foo.txt


    In this example, we create a text file foo.txt from a directory listing. Next,
    run gzip, replaces the original file with a compressed version foo.txt.gz. In
    the directory of foo.*, we see that the original file has been replaced by the
    compressed version and the version is about one-fifth of the original. We can
    also see that the compressed file has the same permissions and time stamp as the
    original.


    Next, run the gzip program to uncompress the file. Afterward, we can see that
    the compressed version of the file has been replaced with the original, again
    with the permissions and timestamp preserved. gzip has many options. Table 18-1
    lists a few.


    # Table 18-1: gzip Options


    | Option | Description |

    |---|--|

    | -c | Write output to standard output and keep original files. May also be specified
    with --stdout and --to-stdout. |

    | -d | Decompress. This causes gzip to act like unzip. May also be specified with
    --decompress or --uncompress. |

    | -f | Force compression even if a compressed version of the original file already
    exists. May also be specified with --force. |

    | -h | Display usage information. May also be specified with --help. |

    | -1 | List compression statistics for each compressed file. May also be specified
    with --list. |

    | -r | If one or more arguments on the command line are directories, recursively
    compresses files contained within them. May also be specified with --recursive.
    |

    | -t | Test the integrity of a compressed file. May also be specified with --test.
    |

    | -v | Display verbose messages while compressing. May also be specified with
    --verbose. |

    | -number | Set amount of compression. number is an integer in the range of 1
    (fastest, least compression) to 9 (slowest, most compression). The values 1 and
    9 may also be expressed as --fast and --best, respectively. The default value
    is 6. |'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'Let''s look again at our earlier example:


    ```

    [me@linuxbox ~]$ gzip foo.txt

    [me@linuxbox ~]$ gzip -tv foo.txt.gz

    foo.txt.gz: OK

    [me@linuxbox ~]$ gzip -d foo.txt.gz

    ```


    Here, we replaced the file foo.txt with a compressed version named foo.txt.gz.
    Next, we tested the integrity of the compressed version, using -t and -v options.
    Finally, we decompressed the file back to its original.

    gzip can also be used in interesting ways via standard input and output:


    ```

    [me@linuxbox ~]$ ls -1 /etc | gzip > foo.txt.gz

    ```


    This command creates a compressed version of a directory listing.

    The gzip program, which decompresses gzip files, assumes that filenames in the
    extension .gz, so it''s not necessary to specify it, as long as the specified
    name is not in conflict with an uncompressed file:


    ```

    [me@linuxbox ~]$ gzip foo.txt

    ```


    If our goal were only to view the contents of a compressed text file, we could
    do this:


    ```

    [me@linuxbox ~]$ gzip -c foo.txt | less

    ```


    Alternatively, a program supplied with gzip, called zcat, is equivalent to gzip
    with the -c option. It can be used like the cat command on gzip-compressed files:


    ```

    [me@linuxbox ~]$ zcat foo.txt.gz | less

    ```


    Note: There is a zless program, too. It performs the same function as the pipeline.


    # bzip2—Higher Compression at the Cost of Speed


    The bzip2 program, by Julian Seward, is similar to gzip but uses a different compression
    algorithm, which achieves higher levels of compression at the cost of speed. In
    most regards, it works in the same fashion as gzip. A file compressed with bzip2
    is denoted with the extension .bz2:


    ```

    [me@linuxbox ~]$ ls -1 /etc > foo.txt

    [me@linuxbox ~]$ ls -1 foo.txt

    -rw-r--r-- 1 me 15738 2012-10-17 13:51 foo.txt

    [me@linuxbox ~]$ bzip2 foo.txt

    [me@linuxbox ~]$ ls -1 foo.txt.bz2

    -rw-r--r-- 1 me 2792 2012-10-17 13:51 foo.txt.bz2

    [me@linuxbox ~]$ bunzip2 foo.txt.bz2

    ```'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'As we can see, bzip2 can be used the same way as gzip. All the options (except
    -r) that we discussed for gzip are also supported in bzip2. Note, however, that
    the compression option (-number) has a somewhat different meaning to bzip2. bzip2
    comes with bzip2 and bzcat for decompressing files.


    bzip2 also comes with the bzip2recover program, which will try to recover damaged
    .bz files.


    # DON''T BE COMPRESSIVE COMPULSIVE


    I occasionally see people attempting to compress a file that has already been
    compressed with an effective compression algorithm, by doing something like this:


    ![](img/aa9c1f11ce2d496265d3ab82e4de6f44_236_0.png)


    Don''t it? You''re probably wasting time and space! If you apply compression to
    a file that is already compressed, you will actually end up with a larger file.
    This is because all compression techniques involve some overhead that is added
    to the file to describe the compression. If you try to compress a file that already
    contains no redundant information, the compression will not result in any savings
    to offset the additional overhead.


    # Archiving Files


    A common file-management task used in conjunction with archiving. Archiving is
    the process of gathering many files and bundling them into a single large file.
    Archiving is often done as part of system backups. It is also used when old data
    is moved from a system to some type of long-term storage.


    # tar-Tape Archiving Utility


    In the Unix-like world of software, the tar program is the classic tool for archiving
    files. Its name, short for tape archive, reveals its roots as a tool for making
    tape backups. While it is still used for traditional task, it is equally adept
    on other storage devices. We often see filenames with the extension .tar or .tgz,
    which indicate a "plain" tar archive and a gzipped archive, respectively. A tar
    archive can consist of a group of separate files, or one more directory hierarchies,
    or a mixture of both. The command syntax looks like:


    ```

    tar mode[options] pathname...

    ```


    where mode is one of the operating modes shown in Table 18-2 (only a partial list
    is shown here; see the tar man page for a complete list).'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# Table 18-2: tar Modes


    | Mode | Description |

    | c | Create an archive from a list of files and/or directories. |

    | x | Extract an archive. |

    | r | Append specified pathnames to the end of an archive. |

    | t | List the contents of an archive. |


    tar uses a slightly odd way of expressing options, so we''ll need examples to
    show how it works. First, let''s re-create our playground from the previous chapter:


    ```

    $mkdir -p playground/dir-{00(1..9),0{10..99},100}

    $ touch playground/dir-{00(1..9),0{10..99},100}/file-{A..Z}

    ```


    Next, let''s create a tar archive of the entire playground:


    ```

    $ tar cf playground.tar

    ```


    This command creates a tar archive named playground.tar, which contains the playground
    directory hierarchy. We can see that the mode and the f option, which is used
    to specify the name of the tar archive, may be joined together and do not require
    a leading dash. Note, that the mode must be specified first, before any other
    option.


    To list the contents of the archive, we can do this:


    ```

    $ tar tf playground.tar

    ```


    For a more detailed listing, we can add the v (verbose) option:


    ```

    $ tar tvf playground.tar

    ```


    Now, let''s extract the playground in a new location. We will do this by creating
    a new directory foo, changing the directory, and extracting the tar archive:


    ```

    $ mkdir foo

    $ cd foo

    $ tar xf ../playground

    $ ls

    playground

    ```


    If we examine the contents of ~/foo/playground, we see that the archive was successfully
    installed, creating a precise reproduction of the original files. There is one
    caveat, however: Unless you are operating as the user, files and directories extracted
    from archives take on the ownership of the user performing the restoration, rather
    than the original owner.'
  merge: -1
  img_proc: true
- pgno: 238
  md: "Another interesting behavior of tar is the way it handles pathnames in\narchives.\
    \ The default for pathnames is relative, rather than absolute. tar\ndo this by\
    \ simply removing any leading slash from the pathname when\ncreating the archive.\
    \ To demonstrate, we will re-create our archive, this\ntime specifying an absolute\
    \ pathname:\n\n```\nme@linuxbox foo$ cd\nme@linuxbox~$ tar cf playground2.tar\
    \ ~/playground\n```\n\nRemember, ~/playground will expand into /home/me/playground\
    \ when we\npress the ENTER key, so we will get an absolute pathname for our demonstra-\n\
    tion. Next, we will extract the archive as before and what happens:\n\n```\nme@linuxbox\
    \ ~$ cd foo\nme@linuxbox foo$ tar xf ../playground2.tar\nme@linuxbox foo$ ls\n\
    home\nplayground\nme@linuxbox foo$ ls home\n\nme@linuxbox foo$ ls home/me/\nplayground\n\
    ```\n\nHere we can see that we extracted our second archive, it re-created\ndirectory\
    \ home/me/playground relative to our current working directory,\n~/foo, not relative\
    \ to the root directory, as would have been the case with\nabolute pathname. This\
    \ might seem like an odd way to fix it, but it is\nuseful to extract archives\
    \ to any loca-\n being forced to extract them to their original locations.\nRepeating\
    \ the exercise with the inclusion of the verbose option (v) will give\na clearer\
    \ picture of what's going on.\n\nLet's consider a hypothetical, yet practical,\
    \ example of tar in action.\nImagine we want to copy the home directory and its\
    \ contents from one-\nto another and we have a large USB drive that we can use\
    \ for the\ntransfer. In our modern Linux system, the drive is \"automatically\"\
    \ mount-\ned in the /media/directory. It's also maine that the disk has a volume\n\
    name of BigDisk when we attach it. To make the tar archive, we can do the\nfollowing:\n\
    \n```\nme@linuxbox~$ sudo tar cf /media/BigDisk/home.tar /home\n```\n\nAfter the\
    \ file is written, we unmount the drive and attach it to the\nsecond computer.\
    \ Again, it is mounted at /media/BigDisk. To extract the\narchive, we do:\n\n\
    ```\nme@linuxbox2 ~$ cd /\nme@linuxbox2~$ sudo tar xf /media/BigDisk/home.tar\n\
    ```\n\nWhat's important to see here is that we must first change directory to\
    \ /\nso that the extraction is relative to the root directory, so all pathnames\n\
    within the archive are relative."
  merge: -1
  img_proc: true
- pgno: 239
  md: 'When extracting an archive, it''s possible to limit what is extracted. For
    example, if we wanted to extract a single file from an archive, it could be done
    like this:


    ```

    tar x archive.tar pathname

    ```


    By adding the trailing pathname to the command, we ensure that tar will restore
    the specified file. Multiple pathnames may be specified. Note that the pathname
    must be the full, exact relative pathname as stored in the archive. When specifying
    pathnames, wildcards are not normally supported; however, the GNU version of tar
    (which is the version most often found in Linux distributions) supports them with
    the --wildcards option. Here is an example using our previous playground.tar:file


    ```

    [melinuxbox] $ cd foo

    [melinuxbox foo] $ tar xf ../playground2.tar --wildcards ''home/me/playground/

    dir*/file-A''

    ```


    This command will extract only files matching the specified pathname including
    wildcard dir*.

    tar is used in conjunction with find to produce archives. In this example, we
    will use find to produce a set of files to include in an archive:


    ```

    [melinuxbox] $ find playground -name ''file-A'' -exec tar playground.tar ''{''
    +''

    ```


    Here we use find to match all the files in playground named file-A and then, using
    the -exec action, we invoke tar in the append mode (r) to add the matching files
    to the archive playground.tar.

    Using find is how we can create incremental backups of a directory or an entire
    system. By using find to match files newer than a timestamp file, we could create
    an archive that contains only files newer than the last archive, assuming that
    the timestamp file is updated after each archive is created.

    tar can also use both standard input and output. Here is a comprehensive example:


    ```

    [melinuxbox] $ cd

    [melinuxbox] $ find playground -name ''file-A'' | tar cf --files-from=- | gzip

    > playground.tgz

    ```


    In this example, we used the find program to produce a list of matching files
    and piped them into tar. If the filename is specified, it is taken to mean standard
    input or output, as needed. (By the way, this convention using - to represent
    standard input/output is used by a number of other programs, too.) The --files-from
    option (which may be specified as -T) causes tar to read its list of pathnames
    from a file rather than the command line. Lastly, the archive produced by tar
    is piped into gzip to create the compressed archive playground.tgz. The .tgz extension
    is the conventional extension given to compressed tar files. The .tar.gz is also
    used sometimes.'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'While we used the gzip program externally to produce our compressed archive,
    modern versions of GNU tar support both gzip and bzip2 compression directly with
    the z and j options, respectively. Using our pre-vious example as a base, we can
    simplify it this way:


    ```

    [me@linux ~]$ find playground -name ''file-A'' | tar czf playground.tgz -T

    ```


    If we wanted to create a bzip2-compressed archive instead, we could have done
    this:


    ```

    [mc@linuxbox ~]$ find playground -name ''file-A'' | tar cjf playground.tbz -T

    ```


    By simply changing the compression option from z to j (and changing the output
    file''s extension to .tbz to indicate a bzip2-compressed file), we enabled bzip2
    compression.


    Another interest of standard input and output with the tar command transferring
    files between systems over a network. Imagine that we had two machines running
    a Unix-like system equipped with tar and ssh. In such a scenario, we could transfer
    a directory from a remote system (named remote-sys for this example) to our local
    system:


    ```

    [me@linuxbox ~]$ mkdir remote-stuff

    [me@linuxbox ~]$ cd remote-stuff

    [me@linuxbox-stuff~]$ ssh remote-sys ''tar cf - Documents'' | tar xf -

    me@remote-sys~$password:

    [me@linuxbox-remote-stuff~]$ ls

    ```


    Here we able to copy a directory Documents from the remote system remote-sys to
    a directory named remote-stuff on the local system. How did we do this? First,
    we launched the tar program on the remote system using ssh. We will recall that
    ssh allows us to execute a program remotely on a networked computer and "see"
    the results on the local system—the standard output produced on the remote system
    is sent to the local system for viewing. We can take advantage of this by having
    tar create an archive (the c mode) and send it to standard output, rather than
    a file (the f option with the dash argument), transporting the archive over the
    encrypted tunnel provided by ssh to the local system. On the local system, we
    execute tar and have an archive (the x mode) supplied from standard input (any,
    the option with the dash argument).


    # zip—Package and Compress Files


    The zip program is both a compression tool and an archiver. The file format used
    is familiar to Windows users, as it reads and writes .zip files. In Linux, however,
    gzip is the predominant compression program with bzip2 being a close second. Linux
    users mainly use zip for exchanging files with Windows systems, rather than performing
    compression and archiving.'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'In its most basic usage, zip is invoked like this:

    zip options zipfile...


    For example, to make a zip archive of our playground, we would this:


    ```

    @me@linuxbox ~$ zip -r playground.zip playground

    ```


    Unless we include the -r option for recursion, only the playground

    directory (but none of its contents) is stored. Although the addition of the

    extension .zip is automatic, we will include the file extension for clarity.

    During the creation of the zip archive, zip will normally display a series

    of messages like this:


    +   adding: playground/dir-020/file-Z (stored 0%)

    adding: playground/dir-020/file-Y (stored 0%)

    adding: playground/dir-020/file-X (stored 0%)

    adding: playground/dir-087/ (stored 0%)

    adding playground/dir-087/file-S (stored 0%)


    These messages show the status of each file added to the archive, zip will

    add files to the archive using one of two storage methods: Either it will "store"

    a file without compression, as shown here, or it will "deflate" the file, which\performs
    compression. The numeric value displayed after the storage method

    indicates the amount of compression achieved. Since our playground containsntonly
    empty files, no compression is performed on its contents.

    Extracting the contents of a zip file is straightforward when using the

    unzip program:


    ```

    @me@linuxbox ~$ cd foo

    @me@linuxbox foo$ unzip ../playground.zip

    ```


    One thing to note about zip (as opposed to tar) is that if an existing

    archive is specified, it is updated rather than replaced. This means that the

    existing archive is preserved, but new files are added and matching files are


    Files may be listed and extracted selectively from a zip archive by specifying
    them using:


    ```

    @me@linuxbox ~$ unzip -l playground.zip playground/dir-087/file-Z

    Archive: ./playground.zip

    Length Date Name

    0 10-05-12 09:25 playground/dir-087/file-Z

    -----------

    0 1 file

    ```


    ```

    @me@linuxbox ~$ cd foo

    @me@linuxbox foo$ unzip ../playground.zip playground/dir-087/file-Z

    Archive: ../playground.zip

    replace playground/dir-087/file-Z? [y]es, [n]o, [A]ll, [N]one, [r]ename: y

    extracting: playground/dir-087/file-Z

    ```'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'Using the -l option causes unzip to merely list the contents of the archive
    without extracting the file. If no file(s) are specified, unzip will list all
    files of the listing. The -v option can be added to increase the verbosity of
    the listing. Note that when the archive extraction conflicts with an existing
    file, the user is prompted before the file is replaced.


    Like tar, zip can make use of standard input and output, though implementation
    is somewhat less useful. It is possible to pipe a list of file-names to zip via
    the -option:


    ```

    $me[linuxbox ~]$ cd

    $me[linuxbox ~]$ find -name "file-A" | zip -@ file-A.zip

    ```


    Here we find to generate a list of files matching the -name "file-A" and then
    pipe it into zip, which creates the archive file.zip containing the selected files.


    zip supports writing its output to standard output, but its is limited because
    very few programs can make use of. The unzip program does not accept standard
    input. This prevents zip and unzip being used together to perform network file
    copying like tar. zip can, accept standard input, so it can be used to compress
    the output of other programs:


    ```

    $me[linuxbox ~]$ ls -1 /etc/ | zip ls-etc.zip

    adding: - (deflated 80%)

    ```


    The unzip program allows its output to be sent to standard output when the -p
    (for pipe) option is specified:


    ```

    $me[linuxbox ~]$ unzip -p ls-etc.zip | less

    ```


    We touched on some of the basic things that zip and unzip can do. They both have
    a lot of options that add to their flexibility, though some are platformspecific
    to other systems. The main pages for both zip and unzip are pretty good and contain
    useful examples.


    # Synchronizing Files and Directories


    A common strategy for maintaining a backup copy of a system involves keeping one
    or more directories synchronized with another directory (direct) located on either
    the local system (usually a removable storage device of some kind) or a remote
    system. We might, for example, have a local copy of a website under development
    and synchronize it from to time with the "live" copy on a remote web server.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# rsync—Remote File and Directory Synchronization


    In the Unix-like world, the preferred tool for this task is rsync. This program
    can synchronize both local and remote directories using the rsync update protocol,
    which allows rsync to quickly detect the differences between two directories and
    perform the minimum amount of copying required to bring them into sync. This makes
    rsync very fast and economical to use, compared to other kinds of copy programs.


    rsync is invoked like this:


    ```

    rsync options source destination

    ```


    where source and destination are each one of the following:


    +   - A local file or directory

    - A remote file or directory in the form of [user@]host:path

    - A remote rsync server specified with a URI of rsync://[user@][:port]/path


    Note that either the source or the destination must be a local file. Remote-to-remote
    copying is not supported.


    Let’s rsync out some local files. First, let''s clean out our foo directory:


    ```

    [linux]$ rm -rf foo/*

    ```


    Next, we’ll synchronize the playground directory with a corresponding copy in
    foo:


    ```

    [linux]$ rsync -av playground foo

    ```


    We’ve included both the -a option (for archiving—causes recursion and preservation
    of file attributes) and the -v option (verbose output) to make a mirror of the
    playground directory within foo. While the command runs, we will see a list of
    the files and directories being copied. At the end, we will see a summary message
    like this, indicating the amount of copying performed:


    ```

    sent 13759 bytes received 57870 bytes 387258.0 bytes/sec

    total size is 3230 speedup is 0.02

    ```


    If we run the command, we will see a different result:


    ```

    [linux]$ rsync -av playground foo

    building file list ... done

    ```


    ```

    sent 22635 bytes received 20 bytes 45310.0 bytes/sec

    total size is 3230 speedup is 0.14

    ```


    Notice that there was no listing of files. This is because there were no differences
    between ~/playground and ~/foo/playground and therefore it didn’t need to copy
    anything. If we modify a file in playground and run rsync again, we see that rsync
    detected the change and copied only the updated file.'
  merge: -1
  img_proc: true
- pgno: 244
  md: '[me@linuxbox ~]$ touch playground/dir-099/file-Z

    [me@linuxbox ~]$ rsync -av playground foo

    building file list ... done

    playground/dir-099/file-Z

    sent 2608 bytes received 42 bytes 45454.0 bytes/sec

    total size is 3230 speedup is 0.14


    As a practical example, let''s consider the imaginary external drive that we used
    earlier with tar. If we attach the drive to our system and once again, it is mounted
    at /media/BigDisk, we can perform a system backup by first creating a directory
    named /backup on the external drive and using rsync to copy the most important
    stuff from our system to the external drive:


    ```

    [me@linuxbox ~]$ mkdir /media/BigDisk/backup

    [me@linuxbox ~]$ sudo rsync -av --delete /etc /home /usr/local /media/BigDisk/

    backup

    ```


    In this example, we copied the /etc, /home, and /usr/local directories from our
    imaginary storage device. We included the --delete option to remove files that
    may have existed on the source device (this is irrelevant the first time we make
    a backup but will be useful on subsequent copies). Repeating the process of attaching
    the external drive and running rsync command would be a useful (though not ideal)
    way of keeping a system backed up. Of course, an alias would be helpful here,
    so we create an alias and add it to our .bashrc to provide this feature:


    ```

    alias backup="sudo rsync -av --delete /etc /home /usr/local /media/BigDisk/backup''

    ```


    Now we have to attach our external drive and run the backup command to do the
    job.


    # Rsync over a Network


    One of the real beauties of rsync is that it can be used to copy files over the
    network. After all, the r in rsync stands for remote. Remote copying can be done
    in two ways.


    The first way is with another system that has rsync installed, along with a remote
    shell program as ssh. Let''s say we have another system on our local network with
    a lot of available hard drive space and we wanted to perform our backup operation
    using the remote instead of an external drive. Assuming that it already had a
    directory named /backup where we could deliver our files, we follow this:


    ```

    [me@linuxbox ~]$ sudo rsync -av --delete --rsh=ssh /home /usr/local remote-sys:/backup

    ```'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'We made two changes to our command to facilitate the network copy.

    First, we added the --rsh=ssh option, which instructs rsync to use the ssh program
    as its remote shell. In this way, we were able to use SSH-encrypted tunnel to
    securely transfer the data from the local system to the remote host. Second, we
    specified the remote host by prefixing its name (in the case the remote host is
    named *remote-sync*) to the destination pathname.


    The second way that rsync can be used to synchronize files over a network is by
    using an *rsync server*; rsync can be configured to run as a daemon and listen
    to incoming requests for synchronization. This is often done to allow mirroring
    of a remote server. For example, Red Hat Software maintains a large repository
    of software packages under development for its Fedora distribution. It is useful
    for software testers to mirror this collection during the testing phase of the
    distribution release cycle. Since files in the repository change frequently (often
    more than once a day), it is desirable to maintain a local mirror by periodic
    synchronization, rather than by bulk copying of the repository. One of these repositories
    is kept at Georgia Tech; we could mirror it using our local copy of rsync and
    Georgia Tech’s rsync server like this:


    ```

    @linuxbox ~$ mkdir devel

    @linuxbox ~$ rsync -av --delete rsync:/rsync.lib.gatech.edu/fedora-linux-core/development/i386/os
    fedora-devel

    ```


    In this example, we use the URI of the remote rsync server, which consists of
    a protocol (rsync://), followed by the remote hostname (rsync.gtlib.gatech.edu),
    followed by the pathname of the repository.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# 19


    # # REGULAR EXPRESSIONS


    In the next few chapters, we are going to look at tools used to manipulate text.
    As we have seen, text data plays an important role on all Unix-like systems, such
    as Linux. But before we can fully appreciate all of the features offered by these
    tools, we have to examine a technology that is frequently associated with the
    most sophisticated uses of these tools—regular expressions.


    As we have navigated the many features and facilities offered by the command line,
    we have encountered some arcane shell features and commands, such as shell expansion
    and quoting, and command history, not to mention the vi editor. Regular expressions
    continue this “tradition” and may be (arguably) the most arcane feature of them
    all. This is not to suggest that the time it takes to learn about them is not
    worth the effort. Quite the contrary. A good understanding will enable us to perform
    amazing feats, though their full value may not be immediately apparent.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# What Are Regular Expressions?


    Simply put, regular expressions are symbolic notations used to identify patterns
    in text. In some ways, they resemble the shell''s wildcard method of matching
    file- and pathnames but on a much grander scale. Regular expressions are supported
    by many command-line tools and most programming languages to facilitate the solution
    of text manipulation problems. To further confuse things, not all regular expressions
    are the same; they vary slightly from tool to tool and from programming language
    to language. For our discussion, we will limit ourselves to regular expressions
    as described in the POSIX standard (which will cover most of the command-line
    tools), as opposed to many programming languages (most notably Perl), which use
    slightly larger and richer sets of notations.


    # grep—Search Through Text


    The main program we will use to work with regular expressions is our old grep.
    The name grep is actually derived from the phrase regular expression print, so
    we can see that grep has something to do with regular expressions. In essence,
    grep searches text files for the occurrence of a specified regular expression
    and outputs any line containing a match to standard.


    So far, we have used grep with fixed strings, like so:


    ```

    [me@linuxbox ~]$ ls /usr/bin | grep

    ```


    This lists all the files in the /usr/bin directory whose names contain the substring
    grep.


    The grep program accepts options and arguments in this way:


    ```

    grep [options] regex [file...]

    ```


    where regex is a regular expression.


    Table 19-1 lists the commonly used grep options.


