  md: '# Table 9-6 (continued)


    | Notation | Meaning |

    |--- |--- |

    | o-rw | Remove the read and write permissions from anyone besides the owner and
    group owner. |

    | go=rw | Set the group owner and anyone besides the owner to have read and write
    permission. If either the group owner or world previously had execute permissions,
    remove them. |

    | u+x,go=rx | Add execute permission for the owner and set permissions for the
    group and others to read and execute. Multiple specifications may be separated
    by commas. |


    Some people prefer to use octal notation; some folks like symbolic. Symbolic notation
    does offer the advantage of allowing you to set a single attribute without disturbing
    any of the others.


    Take a look at the chmod page for more details and a list of options. A word of
    caution regarding the --recursive option: it acts on both files and directories,
    so is not as useful as one would hope because we rarely files and directories
    to have the same permissions.


    # Setting File Mode with the GUI


    ![](img/aa9c1f11ce2d496265d3ab82e4de6f44_115_0.png)


    Now that we have the permissions on files and directories set, we can better understand
    the permission dialog in the GUI. In Nautilus (GNOME) and Conqueror (KDE), right-clicking
    a file or directory will expose a properties dialog. Figure 9-2 is an example
    from KDE 3.5.


    Here we can see the settings for the owner, group, and world. In KDE, clicking
    the Advanced Permissions button brings another dialog that allows you to set each
    of the mode attributes individually. Another victory for understanding brought
    to you by the command line!


    # umask—Set Default Permissions


    The umask command controls the default permissions to give to a file when it is
    created. It uses octal notation to express a mask of bits to be removed from a
    file’s mode attributes.


    Figure 9-2: KDE 3.5 File Properties dialog'
