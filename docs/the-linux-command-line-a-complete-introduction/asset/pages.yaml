- pgno: 80
  md: "# # 6\n REDIRECTION\n\nIn this lesson we are going to unleash what may be the\
    \ coolest feature of the command line: I/O redirection. The I/O stands for input/output,\
    \ and with this facility you can redirect the input and output of commands to\
    \ and from files, well as connect multiple commands to make powerful command pipelines.\
    \ To show off this facility, we will introduce the following commands:\n\n+  \
    \ - cat—Concatenate files.\n- sort—Sort lines of text.\n- uniq—Report or omit\
    \ repeated lines.\n- wc—Print newline, word, and byte counts for each file.\n\
    - grep—Print lines matching a pattern.\n- head—Output the first part of a file.\n\
    - tail—Output the last part of a file.\n- tee—Read from standard input and write\
    \ to standard output and files."
  merge: -1
