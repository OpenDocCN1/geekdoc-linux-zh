    Don''t worry if some of these values are missing. They vary by distribution.


    # ## Is the Environment Established?


    When we log on the system, the bash program starts and reads a series of configuration
    scripts *startup files*, which define the default environment shared by all users.
    This is followed by more startup files in our home directory that define our personal
    environment. The exact sequence depends on the type of shell session being started.


    # ### Login and Non-login Shells


    There are two kinds of shell sessions: a login shell session and a non-login shell
    session.

    A *login shell session* is one in which we are prompted for our username and password;
    for example, when we start a virtual console session. *Non-login shell session*
    typically occurs when we launch a terminal session in the GUI.

    Login shells read one or more startup files, as shown in Table 11-2.


    | Table 11-2: Startup Files for Login Shell Sessions |

    | File | Contents |

    | --- | --- |

    | /etc/profile | A global configuration script that applies to all users. |

    | ~/.bash_profile | A user''s personal startup file. Can be used to extend or
    override settings in the global configuration script. |'
  merge: -1
  img_proc: true
