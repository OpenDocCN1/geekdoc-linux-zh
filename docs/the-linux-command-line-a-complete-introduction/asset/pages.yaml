    Arithmetic expansion is covered in greater detail in Chapter 34.


    # Brace Expansion


    Perhaps the strangest expansion is called brace expansion. With it, you can create
    multiple text strings from a pattern containing braces. Here''s an example:


    ```

    [me@linuxux ~]$ echo Front-{A,B,C}-Back

    Front-A-Back Front-B-Back Front-C-Back

    ```


    Patterns to brace expanded may contain a leading portion called a preamble and
    a trailing portion called a postscript. The brace expansion itself may contain
    a comma-separated list of strings or a range of integers or single characters.
    The pattern may not contain embedded whitespace. Here is an example using a range
    of:


    ```

    [me@linuxux ~]$ echo Number_{1..5}

    Number_1 Number_2 Number_3 Number_4 Number_5

    ```


    Here we a range of letters in reverse order:


    ```

    [me@linuxux ~]$ echo {Z..A}

    Z Y X W V U T S R P O N L K J I H G F E C B A

    ```


    Brace expansions may be nested:


    ```

    [me@linuxux ~]$ echo a{1,2}b{3,4}

    a1b a2b a3b a4b

    ```


    So what is this for? The most common application is to make lists of files or
    directories to be created. For example, if we were photographers and had a large
    collection of images that we wanted to organize by years and months, the first
    thing we might do is create a series of directories named in numeric-format. This
    way, the directory names will be in chronological order. We could type out a complete
    list of directories, but that''s a lot of work and it''s prone to undo. Instead,
    we could:


    ```

    [me@linuxux ~]$ mkdir Pics

    [me@linuxux ~]$ mkdir Pics {2009..2011}-{1..9} {2009..2011}-{10..12}

    [me@linuxux ~]$ Pics 1s

    ```


    +   2009-01 2010-01 2010-07 2011-01 2011-07

    2009-02 2009-08 2010-02 2011-02 2011-08

    2009-03 2009-09 2010-03 2011-03 2011-09

    2009-04 2009-10 2010-04 2011-04 2011-10

    2009-05 2009-11 2010-05 2011-05 2011-11

    2009-06 2009-12 2010-06 2011-06 2011-12


    Pretty slick!'
