- pgno: 481
  md: '# BANISH YOUR MOUSE


    You’ve experienced the shiny, point-and-click surface of your Linux computer—now
    dive below and explore its depths with the power of the command line.


    The Command Line takes you from your very first terminal keystrokes to writing
    full programs in Bash, the most popular shell. Along the way you''ll learn the
    timeless skills handed down by generations of grey-bearded, guides: file navigation,
    environment configuration, command chaining, pattern matching with regular expressions,
    and more.


    In addition to practical knowledge, author William Shots reveals the philosophy
    behind these tools and the rich heritage that your desktop Linux machine has inherited
    from Unix supercomputers of.


    As you make your way through the book’s short, easily digestible chapters, you’ll
    learn how to:


    +   - Create and delete files, directories, and symlinks

    - Administer your system, including networking, package installation, and process
    management


    +   - Use standard input and output, redirection, and pipelines


    +   - Edit files with Vi, the world’s most popular text editor


    +   - Write shell scripts to automate command or boring tasks

    - Slice and dice text files with cut, paste, grep, patch, and sed


    Once you overcome your initial “shell shock,” you’ll find that the command line
    is a natural expressive way to communicate with your computer. Just don''t be
    surprised if your mouse starts to gather dust.


    # ABOUT THE AUTHOR


    William E. Shotts, Jr., is a software professional and avid Linux user for more
    than 15 years. He has an extensive background in software development, including
    technical support, quality assurance, and documentation. He is also the creator
    of LinuxCommand.org, a Linux education and advocacy site featuring news, reviews,
    and extensive support for using the Linux command line.


    ![](img/aa9c1f11ce2d496265d3ab82e4de6f44_481_0.png)'
