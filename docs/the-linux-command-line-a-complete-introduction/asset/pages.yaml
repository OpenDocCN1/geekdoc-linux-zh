    The top program accepts a number of keyboard commands. The two most interesting
    are h, which displays the program''s help screen, and q, which quits top.


    Major desktop environments provide graphical applications that display information
    similar to top (in the same way that Task Manager in Windows does), but I find
    that top is better than the graphical versions because it is faster and consumes
    far fewer system resources. After all, our system monitor program shouldn''t add
    to the slowdown that we are trying to track.


    # Controlling Processes


    Now that we can see and monitor processes, let''s gain some control over them.
    For our experiments, we''re going to use a little program called xlogo as our
    guinea pig. The xlogo program is a sample program supplied with the X Window System
    (the underlying engine that makes the graphics on our display) go, which simply
    displays a resizable window containing the X logo. First, we''ll get to know our
    test subject:


    ```

    me@linux ~$ xlogo

    ```


    After we enter the command, a small window containing the logo should appear somewhere
    on the screen. On some systems, xlogo may print a warning message, but it may
    be safely ignored.'
