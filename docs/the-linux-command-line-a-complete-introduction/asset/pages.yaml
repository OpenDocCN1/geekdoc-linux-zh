- pgno: 340
  md: '# 24


    # # WRITING YOUR FIRST SCRIPT


    In the preceding chapters, we have assembled an arsenal of command-line tools.
    While these tools can solve many kinds of computing problems, we are still limited
    to manually using them one by one on the command line. Wouldn''t it be great if
    we could get the shell to do more of the work? We can. By joining our tools together
    into programs of our design, the shell can carry out complex sequences of tasks
    all by itself. We enable it to do this by writing *shell scripts*.


    # ## What Are Shell Scripts?


    In the simplest terms, a shell script is a file containing a series of commands.
    The shell reads this file and carries out the commands as though they have been
    entered directly on the command line.


    The shell is distinctive, in that it is both a powerful command-line interface
    to the system and a scripting language interpreter. We will see, most of the things
    that can be done on the command line can be done in scripts, and most of the things
    that can be done in scripts can be done on the command line.'
  merge: -1
  img_proc: true
- pgno: 341
  md: 'We have covered many shell features, but we have focused on those features
    most often used directly on the command line. The shell also provides a set of
    features usually (but not always) when writing programs.


    # # How to Write a Shell Script


    To successfully create and run a shell script, we need to do three things:


    +   1. **Write a script.** Shell scripts are ordinary text files. We need a text
    editor to write them. The best editors will provide syntax highlighting, allowing
    us to see a color-coded view of the elements of the script. Syntax highlighting
    will help us spot certain kinds of common errors. vim, git, kate, and many other
    editors are good candidates for writing.

    2. **Make the script executable.** The system is fussy about not letting any old
    text be treated as a program, and for good reason! We need to set the script file''s
    permissions to allow execution.

    3. **Put the script somewhere the shell can find it.** The shell automatically
    searches certain directories for executable files when no explicit path is specified.
    For maximum convenience, we will place our scripts in these directories.


    # # Script File Format


    In keeping with programming tradition, we''ll create a "hello world" program to
    demonstrate an extremely simple script. So let''s fire up our text editors and
    enter the following script:


    ```

    #!/bin/bash

    ```


    ```

    # This is our first script.

    ```


    ```

    echo ''Hello World!''

    ```


    The last line of our script is pretty familiar, just an echo command with a string
    argument. The second line is also familiar. It looks like a comment that we have
    seen in many of the configuration files we have examined and edited. One thing
    about comments in shell scripts is that they may also appear at the ends of lines,
    like so:


    ```

    echo ''Hello World!'' # This is a comment too

    ```


    Everything from the # symbol onward the line is ignored.

    Like many things, this works on the command line, to:


    ```

    [me@linux]$ echo ''Hello World!'' # This is a comment too

    Hello World!

    ```


    Though comments are of little use on the command line, they will work.'
  merge: -1
  img_proc: true
- pgno: 342
  md: 'The first line of our script is a little mysterious. It looks as if it should
    be a comment, since it starts with #, but it looks too purposeful to be just that.
    The #! character sequence is, in fact, a special construct called shebang. The
    shebang is used to tell the system the name of the interpreter that should be
    used to execute the script. Every shell script should include this as its first
    line.


    Let''s save our script file as hello_world.


    # Executable Permissions


    The next thing we have to do is make our script executable. This is easily done
    using chmod:


    ```

    [me@linuxbox ~]$ ls -l hello_world

    -rw-r--r-- 1 me 63 2012-03-07 10:10 hello_world

    [me@linuxbox ~]$ chmod 755 hello_world

    [me@linuxbox ~]$ ls -l hello_world

    -rwxr-xr-x 1 me 63 2012-03-07 10:10 hello

    ```


    There are two common permission settings for scripts: 755 for scripts that everyone
    can execute and 700 for scripts that only the owner can execute. Note that scripts
    must be readable to be executed.


    # Script File Location


    With the permissions set, we can now execute our script:


    ```

    [me@linuxbox ~]$ ./hello_world

    Hello World!

    ```


    In order for the script to run, we must precede the script name with an explicit
    path. If we don''t, we get this:


    ```

    [me@linuxbox ~]$ $hello_world

    bash: hello_world: command not found

    ```


    Why is this? What makes our script different from other programs? As it turns
    out, nothing. Our script is fine. Its location is the problem. In Chapter 11,
    we discussed the PATH environment variable and its effect on the system searches
    for executable programs. To recap, the system searches for a list of directories
    each time it needs to find an executable program, if no explicit path is specified.
    This is how the system knows to execute /bin/ls when we type ls at the command
    line. The /bin directory is one of the directories that the system automatically
    searches. The list of directories is held within an environment variable named
    PATH. THE PATH contains a separated list of directories to be searched. We can
    view the contents of PATH:


    ```

    [me@linuxbox ~]$ echo PATH

    /home/me/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/sbin:/bin:/usr/games

    ```'
  merge: -1
  img_proc: true
- pgno: 343
  md: 'Here we see our list of directories. If our script were located in any of the
    directories in the list, our problem would be solved. Notice the first directory
    in the list, /home/me/bin. Most Linux distributions configure the PATH variable
    to contain a bin directory in the user''s home directory to allow users to execute
    their own programs. If we create the bin directory and place our script within
    it, it should start with like other programs:


    ```

    [melinuxbox ~]$ mkdir bin

    [melinuxbox ~]$ mv hello_world bin

    [melinuxbox ~]$ hello_world

    ```


    If the PATH variable does not contain the directory, we can easily add it by including
    this line in our .bashrc file:


    ```

    export PATH="/bin:$PATH"

    ```


    After this change is made, it will take effect in each new terminal session. To
    apply the change to the current terminal session, we must have the shell reread
    the .bashrc file. This can be done by "sourcing" it:


    ```

    [melinuxbox ~]$ .bashrc

    ```


    The dot (.) command is a synonym for the source command, a shell builtin that
    reads a file of shell commands and treats it input from the keyboard.


    > Note: Ubuntu automatically adds the ~/bin directory to the PATH variable if
    the ~/bin directory exists when the user''s .bashrc file is executed. So, on Ubuntu
    systems, we create the ~/bin directory and then log out and log in again, everything
    works.


    # Good Locations for Scripts


    The ~/bin is a good place to put scripts intended for personal use. If we write
    a script that everyone on a system is allowed to use, the traditional location
    is /usr/local/bin. Scripts intended for use by the system administrator are often
    located in /usr/local/bin. In most cases, locally supplied software, whether scripts
    or compiled programs, should be placed in the /usr/local hierarchy and not in
    /bin or /usr/bin. These directories are specified by the Linux Filesystem Hierarchy
    Standard to contain only files supplied and maintained by the Linux distributor.


    # More Formatting Tricks


    One of the key goals of serious script writing is ease of maintenance; that is,
    the ease with which a script may be modified by its author or others to be adapted
    to changing needs. Making a script to read and understand is one way to facilitate
    easy maintenance.'
  merge: -1
  img_proc: true
- pgno: 344
  md: "# Long Option Names\n\nMany of the commands we have studied both short and\
    \ long option names. For instance, the ls command has many options that can be\
    \ expressed in either short or long form. For example:\n\n```\nme[linuxbox ~]$\
    \ ls -ad\n```\n\nand\n\n```\nme[linuxbox ~]$ ls --directory\n```\n\nare equivalent\
    \ commands. In the interests of reduced typing, short options are preferred when\
    \ entering options on the command line, but when writing scripts, long options\
    \ can improve readability.\n\n# Indentation and Line Continuation\n\nWhen employing\
    \ long commands, readability can be enhanced by spreading the command over several\
    \ lines. In Chapter 17, we looked at a particular example of the find command:\n\
    \n```\nme[linuxbox ~]$ find playground \\( -type f -not perm 0600 -exec chmod\
    \ 0600 {}\\'; ';' \\) -or \\( -type d -not perm 0700 -exec chmod 0700 {}\\'; ';'\
    \ \\)\n```\n\nThis command is a little hard to figure out at first glance. In\
    \ a script, this command might be easier to understand if it were written:\n\n\
    ```\nfind playground \\\n    \\-type f \\\n    -not perm 0600 \\\\\n    -exec\
    \ chmod 0600 '{}\\'; ';' \\\\\n    \\\\\n    -or \\\n    \\\\\n        \\-type\
    \ d \\\n        -not perm 0700 \\\\\n        -exec chmod 0700 '{}\\'; ';' \\\\\
    \n    \\)\n```\n\nWith the use of line continuations (backslash-linefeed sequences)\
    \ and indentation, the logic of this complex command is more clearly described\
    \ to the reader. This technique works on the command line, though it is seldom\
    \ used as it is very awkward to type and edit. One difference between a script\
    \ and the command line is that a script may employ tab characters to achieve indentation,\
    \ whereas the command line cannot because tabs are used to activate completion."
  merge: -1
  img_proc: true
- pgno: 345
  md: '# CONFIGURING VIM FOR SCRIPT WRITING


    The vim text editor has many, many configuration settings. Several common options
    can facilitate script writing.


    :syntax turns on for syntax highlighting. With this setting, different elements
    of shell vim will be displayed in different colors when viewing a script. It is
    helpful for identifying certain kinds of programming errors. It looks cool, too.
    Note that for this feature to work, you must have a complete version of vim installed,
    and the file you are editing must have a shebang indicating the file is a shell
    script. If you have difficulty with :syntax on, try :set syntax=xh instead.


    :set hsearch turns on the option to highlight search results. We search for the
    word echo. With this option, each instance of the word will be highlighted.


    :set tabstop4 sets the number of columns occupied by a tab character. The default
    is eight columns. Setting the value to 4 (which is a common practice) allows long
    lines to fit more easily on the screen.


    :set autoindent turns on the auto indent feature. This causes vim to indent a
    new line the same amount as the line just typed. This speeds up typing on many
    kinds of programming constructs. To stop indentation, type CTRL-D.


    These changes can be made permanent by adding these commands with the leading
    colon characters to your ~/.vimfile.


    # Final Note


    In this first chapter about scripting, we have looked at how scripts are written
    and made to easily execute on our system. We also saw how we can use various formatting
    techniques to improve the readability (and thus, the maintainability) of our scripts.
    In future chapters, ease of maintenance will come up again and again as a central
    principle in good script writing.'
  merge: -1
  img_proc: true
- pgno: 346
  md: "# 25\n\n# STARTING A PROJECT\n\nStarting with this chapter, we will begin to\
    \ build a program. The purpose of this project is to see how various shell features\
    \ are used to create programs and, more importantly, create good programs.\n\n\
    The program we will write is a report generation. It will present various statistics\
    \ about our system and its status, and it will produce this report in HTML format\
    \ so we can view it with a web browser.\n\nPrograms are usually built up in a\
