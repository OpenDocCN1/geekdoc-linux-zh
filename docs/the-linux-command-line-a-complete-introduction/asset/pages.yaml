    # # Ending a Terminal Session


    We can end a terminal session by either closing the terminal emulator window or
    entering the **exit** command at the shell prompt:


    ```

    me@linuxbox ~$ exit

    ```


    # ## THE CONSOLE BEHIND THE CURTAIN


    Even if we have no emulator running, several terminal sessions continue to run
    behind the graphical desktop. Called virtual terminals or virtual consoles, these
    sessions can be accessed on most Linux distributions by pressing CTRL-ALT-F1 through
    CTRL-ALT-F6 on most systems. When a session is accessed, it presents a login prompt
    into which we can enter our username and password. To switch from one console
    to another, press ALT-T F1-F6. To return to the graphical desktop, press ALT-F7.'
