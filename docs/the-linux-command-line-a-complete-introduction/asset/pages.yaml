- pgno: 416
  md: "leading portion of a pathname, leaving only the base name of a file. In our\
    \ example, basename removes the leading portion of the pathname contained in the\
    \ $0 parameter, the full pathname of our example program. This value is useful\
    \ when constructing messages such as the message at the end of the program. When\
    \ it's coded this way, the script can be renamed, and the message automatically\
    \ adjusts to contain the name of the program.\n\n# Using Positional Parameters\
    \ with Shell Functions\n\nJust as positional parameters are used to pass arguments\
    \ to shell scripts, they can also be used to pass arguments to shell functions.\
    \ To demonstrate, we convert the file_info script into a shell function:\n\n```\n\
    file_info () {\n    # file_info: function to display file information\n    if\
    \ [[ -e $1 ]]; then\n        echo -e \"\\nType:\"\n        file $1\n        echo\
    \ -e \"\\nStatus:\"\n        stat $1\n    else\n        echo \"$FUNNAME: $FILENAME\
    \ file\" >&2\n        return 1\n    fi\n}\n```\n\nNow, if a script that incorporates\
    \ the file_info shell function calls the function with a filename argument, the\
    \ argument will be passed to the function.\n\nWith this capability, we can write\
    \ many useful functions that can be used not only in scripts but also within the\
    \ .bashrc.\n\nNotice that the PRONAME variable was changed to the shell variable\
    \ FUNNAME. The shell automatically updates this variable to keep track of the\
    \ currently executed shell function. Note that $0 always contains the full pathname\
    \ of the first item on the command line (i.e., the name of the program) and does\
    \ not contain the name of the shell function as we might expect.\n\n# Handling\
    \ Positional Parameters En Masse\n\nIt is sometimes useful to manage all the positional\
    \ parameters as a group. For example, we might want to write a wrapper around\
    \ another usage. This means that we create a script or shell function that simplifies\
    \ the execution of another program. The wrapper supplies a list of arcane command-line\
    \ options and then passes a list of arguments to the lower-level program.\n\n\
    The shell provides two special parameters for this purpose. They both expand into\
    \ the complete list of positional parameters but differ in rather subtle ways.\
    \ Table 32-1 describes these parameters."
