- pgno: 264
  md: '# 20


    # # TEXT PROCESSING


    All Unix-like operating systems rely heavily on text files for several types of
    data storage. So it makes sense that there are many tools for manipulating text.
    In this chapter, we will look at programs that are used to "slice and dice" text.
    In the next chapter, we will look at more text processing, focusing on programs
    that are used to format text for printing and other kinds of human consumption.


    This chapter will revisit some old friends and introduce us to some new ones:


    +   - cat—Concatenate files and print on the standard output.

    - sort—Sort lines of text files.

    - uniq—Report or omit repeated lines.

    - cut—Remove sections from each line of files.

    - paste—Merge lines of files.

    - join—Join two files on a common field.

    - comm—Compare two sorted files by line.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '+   - diff—Compare files by line.

    - patch—Apply a diff file to an original.

    - tr—Translate or delete characters.

    - sed—Stream editor for filtering and transforming text.

    - aspell—Interactive spell checker.


    # Applications of Text


    So far, we have learned a couple of text editors (nano and vim), looked at a bunch
    of configuration files, and witnessed the output of dozens of commands, all in
    text. But what else is text used for? Many things, turns out.


    # Documents


    Many people write documents using plaintext formats. While it is easy to see how
    a small text file could be useful for keeping simple notes, it is also possible
    to write large documents in text format. One popular approach is to write a large
    document in a text format and use a markup language to describe the formatting
    of the finished document. Many scientific papers are written using this method,
    as Unix-based text-processing systems were among the first systems that supported
    the advanced typographical layout needed by writers in technical disciplines.


    # Web Pages


    The world''s most popular type of electronic document is probably the web page.
    Web pages are text documents that use either HTML (Hypertext Markup Language)
    or XML (Extensible Markup Language) as a markup language to describe the document''s
    visual format.


    # Email


    Email is an intrinsically text-based medium. Non-text attachments are converted
    into a text representation for transmission. We can see this for ourselves by
    downloading an email message and then viewing it in less. We will see that the
    message begins with a header that describes the source of the message and the
    processing it received during its journey, followed by the body of the message
    with its content.


    # Printer Output


    On Unix-like systems, output destined for a printer is sent as plaintext or, if
    the page contains graphics, is converted into a text format-description language
    known as PostScript, which is then sent to a program that generates the graphic
    dots to be printed.'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# Program Source Code


    Many of the command-line programs found on Unix-like systems were created to support
    system administration and software development, and text-processing programs are
    no exception. Many of them are designed to solve software development problems.
    The reason text processing is important to software developers is that all software
    starts out as text. Source code, the part of the program programmer actually writes,
    is always in text format.


    # Revisiting Some Old Friends


    Back in Chapter 6, we learned about some commands that are able to accept standard
    input in addition to command-line arguments. We touched on them only briefly,
    but now we will take a closer look at how they can be used for text processing.


    # cat—Concatenate Files and Print on Standard Output


    The cat program has a number of interesting options. Many of them are used to
    better visualize text content. One example is the -A option, which is used to
    display non-printing characters in the text. There are times when we want to know
    if control characters are embedded in our otherwise visible text. The most common
    of these are tab characters (as opposed to spaces) and carriage retries, often
    present as end-of-line characters in MS-DOS-style text files. Another common situation
    is a file containing lines of text with trailing spaces.


    Let''s create a test file using cat as a primitive word processor. To do this,
    we''ll just enter the command cat (along with specifying a file for redirected
    output) and type our text, followed by ENTER to properly end the line, then CTRL-D
    to indicate that we have reached end-of-file. In this example, we enter a tab
    character and follow the line with some trailing spaces:


    ```

    $ quick brown fox jumped over the lazy dog.

    @linuxbox~$

    ```


    We will use cat with the -A option to display the text:


    ```

    $ cat -A foo.txt

    ^I quick brown fox jumped over the lazy dog. $

    @linuxbox~$

    ```


    As we can see in the results, the tab character in our text is represented by
    ^I. This common notation means "CTRL-I," which, as it turns out, is the same as
    a tab character. We also see that a $ appears at the true end of the line, indicating
    that our text contains trailing spaces.'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# MS-DOS TEXT VS. UNIX TEXT


    One of the reasons you may want to use cat to look for non-printing characters
    in text is to stop hidden carriage returns. Where do hidden carriage returns come
    from? DOS and Windows! Unix and DOS don''t define the end of a line the same way
    in text files. Unix ends a line with a linefeed (ASCII 10), while MS-DOS and its
    derivatives use the sequence carriage return (ASCII 13) and linefeed to terminate
    each line of text.


    There are several ways to convert files from DOS to Unix format. In many Linux
    systems, programs called dosunix and unixdos can convert text files to and from
    DOS format. however, if you don''t have dosunix on your system, don''t worry.
    The process of converting text from DOS to Unix format is very simple; it simply
    involves the removal of the offending carriage returns. That easily accomplished
    by a couple of the programs discussed later in this chapter.


    cat has options that are used to modify text. The two most prominent are -n, which
    numbers lines, and -s, which suppresses the output of multiple lines. We can demonstrate
    thusly:


    ```

    $ cat foo.txt

    The quick brown fox

    ```


    ```

    $ cat -ns foo.txt

    1 The quick brown fox

    2

    3 jumped over the lazy dog.

    ~$

    ```


    In this example, we create a new version of our foo.txt test file, which contains
    two lines of text separated by two blank lines. After processing cat with the
    -ns options, the extra blank line is removed and the remaining lines are merged.
    While this is not much of a process to perform on, it is a process.


    # sort—Sort Lines of Text Files


    The sort program sorts the contents of standard input, or one or more files specified
    on the command line, and sends the results to standard output. Using the same
    technique that we used with cat, we can demonstrate processing of standard input
    directly from the keyboard.


    ```

    $ sort > foo.txt

    b

    a

    ~$ cat foo.txt

    a

    b

    c

    ```'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'After entering the command, we type the c, b, and a, followed once again by
    CTRL-D to indicate end-of-file. We then view the resulting file and see that the
    lines now appear in sorted order.


    Since sort can accept multiple files on the command line as arguments, it is possible
    to merge multiple files into a single sorted whole. For example, if we had three
    files and wanted to combine them into a single sorted file, we could do something
    like this:


    ```

    sort file1.txt file2.txt file3.txt > final_sorted_list.txt

    ```


    sort has several interesting options. Table 20-1 shows a partial list.


    # Table 20-1: Common sort Options


    | Option | Long Option | Description |

    | --- | --- | --- |

    | -b | --ignore-leading-blanks | By default, sorting is performed on the entire
    line, starting with the first character in the line. This option causes sort to
    ignore spaces in lines and calculates sorting based on the first non-whitespace
    character on the line. |

    | -f | --ignore-case | Makes sorting case insensitive. |

    | -n | --numeric-sort | Performs sorting based on the numeric evaluation of a
    string. Using this option allows sorting to be performed on numeric values rather
    than alphabetical values. |

    | -r | --reverse | Sort in reverse order. Results are in descending rather than
    ascending order. |

    | -k | --key=field1[,field2] | Sort based on a key field located from field1 to
    field2 rather than the entire line. |

    | -m | --merge | Treat each argument as the name of a presorted file. Merge multiple
    files into a single sorted result without performing any sorting. |

    | -o | --output=file | Send sorted output to file rather than standard output.
    |

    | -t | --field-separator=char | Define the field-separator character. By default,
    fields are separated by spaces or tabs. |'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'Although most of the options above are pretty self-explanatory, some are not.
    First, let''s look at the -n option, used for numeric sorting. With this option,
    it is possible to sort values based on numeric values. We can demonstrate this
    by sorting the values of the du command to determine the largest users of disk
    space. Normally, the du command lists the results of a summary in pathname order:


    ```

    @me@linux ~$ du -s /usr/share/* | head

    252 /usr/share/aclocal

    96 /usr/share/acpi-support

    8 /usr/share/adduser

    196 /usr/share/alcarte

    344 /usr/share/alsa

    8 /usr/share/alsa-base

    12488 /usr/share/anthy

    8 /usr/share/apmd

    21440 /usr/share/app-install

    48 /usr/share/application-registry

    ```


    In this example, we pipe the results into head to limit the results to the first
    10 lines. We can produce a numerically sorted list to show the 10 largest consumers
    of space this way:


    ```

    @linuxlinux ~$ du -s /usr/share/* | sort -nr | head

    509940 /usr/share/locale-langpack

    242660 /usr/share/doc

    197560 /usr/share/fonts

    179144 /usr/share/gnome

    146764 /usr/share/myspell

    144304 /usr/share/gimp

    135880 /usr/share/dict

    76508 /usr/share/icons

    68072 /usr/share/apps

    62844 /usr/share/foomatic

    ```


    By using the -nr option, we produce a reverse numerical sort, with the largest
    values occur at the beginning of each line. But if we want to sort a list based
    on some value within the line? For example, the result of ls -1 looks like this:


    ```

    @linux ~$ ls -1 /usr/bin | head

    total 152948

    -FWXI-XR-x 1 root 34824 2012-04-04 02:42 |

    -FWXI-XR-x 1 root 101556 2012-11-27 06:08 axb

    -FWXI-XR-x 1 root 13036 2012-02-27 08:22 connect

    -FWXI-XR-x 1 root 105521 2012-08-15 10:34 acpi

    -FWXI-XR-x 1 root 3800 2012-04-14 03:51 acpi_fakeey

    -FWXI-XR-x 1 root 75396 2012-04-19 00:19 acpi_list

    -FWXI-XR-x 1 root 3576 2012-04-29 07:57 addpart

    -FWXI-XR-x 1 root 20808 2012-01-03 18:02 addr12

    -FWXI-XR-x 1 root 489704 2012-10-09 17:02 adept_batch

    ```


    Ignoring, the moment, that ls can sort its results by size, we could use sort
    to sort this list by size, as well.'
