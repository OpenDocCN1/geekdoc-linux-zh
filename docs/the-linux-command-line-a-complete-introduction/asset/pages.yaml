  md: '%% font Times-Italic

    %% font Times-Italic

    %%DocumentSuppliedResources: procset groff 1.18 1

    %%Pages: 4

    %%PageOrder: Ascend

    %%Orientation: Portrait


    PostScript is a page-description language that is used to describe the contents
    of a printed page to a typesetter-like device. We can take the output of our command
    and store it to a file (assuming that we are using a graphical desktop with a
    Desktop directory):


    ```

    me@linuxbox ~$ zcat /usr/share/man/man1/ls.1.gz | groff -mandoc ~/Desktop

    /foo.ps

    ```


    An icon for the output file should appear on the desktop. By double clicking the
    icon, a viewer would start up and reveal the file in its rendered form (Figure
    21-1).


    ![](img/aa9c1f11ce2d496265d3ab82e4de6f44_312_0.png)


    Figure 21-1: Viewing PostScript nicely with a page viewer in GNOME


    What we see is a nicely typeset page for ls! In fact, it''s possible to convert
    the PostScript file into a PDF (Portable Document Format) file with this command:


    ```

    me@linuxbox ~$ ps2pdf ~/Desktop/foo.ps ~/Desktop/ls.pdf

    ```


    The ps2pdf program is part of the ghostscript package, which is installed on most
    Linux systems that support printing.


    Formatting Output 281'
