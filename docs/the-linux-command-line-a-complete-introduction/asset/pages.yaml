  md: '# 35


    # ARRAYS


    In the last chapter, we looked at how the shell can manipulate strings and numbers.
    The data types we have looked at so far are known in computer science circles
    as scalar variables, that is, variables that contain a single value.


    In this chapter, we will look at another kind of data structure called an array,
    which holds multiple values. Arrays are a feature of virtually every programming
    language. The shell supports them, too though in a rather limited fashion. Even
    so, they can be very useful for solving programming problems.


    # What Are Arrays?


    Arrays are variables that hold more than one value at a time. Arrays are organized
    like a table. Let''s consider a spreadsheet as an example. A spreadsheet acts
    like a two-dimensional array. It has both rows and columns, and an individual
    cell in the spreadsheet can be located according to its row and column address.
    An array behaves the same way. An array has cells, which'
  merge: -1
  img_proc: true
- pgno: 447
  md: 'are elements, and each element contains data. An individual element is accessed
    using an address called an index or subscript.


    Most programming languages support multidimensional arrays. A spreadsheet is an
    example of a multidimensional array with two dimensions, width and height. Many
    languages support arrays with an arbitrary number of dimensions, though two- and
    three-dimensional arrays are probably the most used.


    Arrays in bash are limited to a single dimension. We can think of them as a spreadsheet
    with a single column. With this limitation, there are many applications for them.
    Array support first appeared in bash version 2. The Original Unix shell, sh, did
    not support arrays at all.


    # # Creating an Array


    Array variables are named just like other bash variables and are created automatically
    when they are accessed. Here is an example:


    ```

    ```bash

    me[linux]$ a[1]=foo

    me[linux]$ echo ${a[1]}

    ```

    ```


    Here we see an example of both the assignment and access of an array element.
    With the first command, element 1 of array is assigned the value foo. The second
    command displays the stored value of element 1. The use of braces in the second
    command is required to prevent the shell from attempting pathname expansion on
    the name of the array element.


    An array can also be created with the declare command:


    ```

    ```bash

    me[linux]$ declare -a a

    ```

    ```


    Using the -option, this example of declare creates the array a.


    # # Assigning Values to an Array


    Values may be assigned in one of two ways. Single values may be assigned using
    the following syntax:


    ```

    name[subscript]=value

    ```


    where name is the name of the array and subscript is an integer (or arithmetic
    expression) greater or equal to 0. Note that the first element of an array is
    subscript 0, not 1. value is a string or integer assigned to the array element.


    Multiple values may be assigned using the following syntax:


    ```

    name=(value1 value2 ...)

    ```


    where name is the name of the array and value1 value2 ... are values assigned
    sequentially to the array, starting with element 0. For example,'
