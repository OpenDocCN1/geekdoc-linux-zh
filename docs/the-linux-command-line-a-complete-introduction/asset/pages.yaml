  md: 'we need to use an external program. There are several approaches we can take.
    Embedding Perl or AWK programs is one possible solution but, unfortunately, outside
    the scope of this book.


    Another approach is to use a specialized calculator program. One such program
    found on Linux systems is called bc.

    The bc program reads a file in its own C-like language and executes it. A bc script
    may be a separate file, or it may read from standard input. The bc language supports
    quite a few features, including variables, loops, and programmer-defined functions.
    We won''t cover entirely here, just enough to get a taste. bc is well documented
    by its man page.


    Let''s start with a simple example. We''ll write a bc script to add 2 plus 2:


    ```

    /* A very simple bc script /

    2 + 2

    ```


    The first line of the script is a comment. bc uses the same syntax for comments
    as the C programming language. Comments, which may span multiple lines, begin
    with /* and end with */.


    # Using bc


    If we save the script above as foo.bc, we can run it that this way:


    ```

    @linuxbox ~$ bc foo.bc

    bc 1.06.94

    ```


