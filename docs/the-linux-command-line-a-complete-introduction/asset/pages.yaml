  md: 'As we can see, our revised expression can successfully validate numbers both
    with and without the parentheses, while rejecting those numbers that are not properly
    formatted.


    # Putting Regular Expressions to Work


    Let''s look at some of the commands we already know and see how they can be used
    with regular expressions.


    # Validating a Phone List with grep


    In our earlier example, we looked at single phone numbers and checked them for
    proper formatting. A more realistic scenario would be checking a list of numbers
    instead, so let''s make a list. We''ll do this by reciting a magical incantation
    to the command line. It will be magic because we have not covered most of the
    commands involved, but worry—we will get there in future chapters. Here is the
    incantation:


    ```

    @melinux $ for i in {1..10}; do echo "${RANDOM:0:3}-\${RANDOM:0:3}-\${RANDOM:0:4}"
    >> phonelist.txt; done

    ```


    This command will produce a file phonelist.txt containing 10 phone numbers. Each
    time the command is repeated, another 10 numbers are added to the list. We can
    also change the value 10 near the beginning of the command to produce fewer or
    more numbers. If we examine the contents of the file, however, we see a problem:


    ```

    @melinux $ cat phonelist.txt

    (232) 298-2265

    (624) 381-1078

    (540) 126-1980

    (874) 163-2385

    (286) 254-2860

    (292) 108-5610

    (129) 44-1379

    (458) 273-1642

    (686) 299-8268

    (198) 307-2440

    ```


    Some of the numbers are malformed, which is perfect for our purposes because we
    will use grep to validate them.


    One method of validation would be to scan the file for invalid numbers and display
    the result list.


    ```

    @melinux $ grep -Ev ''^([0-9]{3})-[0-9]{3}-[0-9]{4}$'' phonelist.txt

    (292) 108-518

    (129) 44-1379

    @melinux $

    ```


    We use the -v option to produce an inverse match so that we will output only the
    lines in the list that do not match the specified expression.'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'The expression itself includes the anchor metacharacters at each end to ensure
    that the number has no extra characters at either end. This expression also requires
    that the parentheses be present in a valid number, unlike our earlier phone number
    example.


    # Finding Ugly Filenames with find


    The find command supports a test based on a regular expression. There is an important
    consideration to keep in mind when using regular expressions versus grep. Whereas
    grep will print a line when the line contains a string that matches an expression,
    find requires that the path exactly match the regular expression. In the following
    example, we will use find with a regular expression to find every pattern that
    contains any character that is not a member of the following set:


    ```

    [-_./0-9a-zA-Z]

    ```


    Such a scan would reveal patterns that contain embedded spaces and other potentially
    offensive characters:


    ```

    $me[linuxbox ~]$ find -regex ''*[^_./0-9a-zA-Z].*''

    ```


    Due to the requirement for an exact match of the entire pathname, we use .* at
    both ends of the expression to match zero or more instances of any character.
    In the middle of the expression, we use a negated expression containing our set
    of acceptable characters.


    # Searching for Files with locate


    The locate program supports both basic (--regex option) and extended (--regex
    option) regular expressions. With it, we can perform many of the operations we
    performed earlier over ourlist files:


    ```

    $melinuxbox ~]$ locate --regex ''bin/(bz|zip)*''

    /bin/bzcat

    /bin/bzcmp

    /bin/bzdiff

    /bin/bzgrep

    /bin/bzexe

    /bin/bzfgrep

    /bin/bzgrep

    /bin/bzip2

    /bin/bzip2recover

    /bin/bzless

    /bin/bzmore

    /bin/gzexe

    /bin/zip

    /usr/bin/zip

    /usr/bin/zipcloak

    /usr/bin/zipgrep

    /usr/bin/zipinfo

    /usr/bin/zipnote

    /usr/bin/zipsplit

    ```'
