    | SHIFT-G (G) | To the last line of the file |


    Why are the H, J, K, and L keys used for cursor movement? Because when vi was
    originally written, not all video terminals had arrow keys, and skilled typists
    could use regular keyboard keys to move the cursor without ever lifting their
    fingers from the keyboard.


    Many commands in vi can be prefixed with a number, as the G command in Table 12-1.
    By prefixing a command with a number, we may specify the number of times a command
    is to be carried out. For example, the command 5j causes vi to move the cursor
    five lines.


    # Basic Editing


    Most editing consists of a few basic operations such as inserting text, deleting,
    and moving text around by cutting and pasting. vi, of course, ports all of these
    operations in its own unique way. vi also provides a limited form of undo. If
    we press the U key while in command mode, vi will undo the last change that you
    made. This will come handy as we try out of the basic editing commands.'
