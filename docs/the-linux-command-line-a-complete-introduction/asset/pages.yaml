- pgno: 371
  md: "# Integer Expressions\n\nThe expressions in Table 27-3 are used with integers.\n\
    \nTable 27-3: test Integer Expressions\n| Expression | Is true if ... |\n|---|---|n|\
    \ integer1 -eq integer2 | integer1 is equal to integer2. |\n| integer1 -ne integer2\
    \ | integer1 is not equal to integer2. |\n| integer1 -le integer2 | integer1 is\
    \ less than or equal to integer2. |\n| integer1 -lt integer2 | integer1 is less\
    \ than integer2. |\n| integer1 -ge integer2 | integer1 is greater than or equal\
    \ to integer2. |\n| integer1 -gt integer2 | integer1 is greater than integer2.\
    \ |\n\nHere is a script that demonstrates them:\n\n```\n#!/bin/bash\n# test-integer:\
    \ evaluate the value of an integer.\nINT=-5\nif [ -z \"$INT\" ]; then\n    echo\
    \ \"$INT is empty.\" >&2\n    exit 1\nfi\nif [ $INT -eq 0 ]; then\n    echo \"\
    $INT is zero.\"\nelse\n    if [ $INT -lt 0 ]; then\n        echo \"$INT is negative.\"\
    \n    else\n        echo \"$INT is positive.\"\n    fi\n    if [ $((INT % 2))\
    \ -eq 0 ]; then\n        echo \"$INT is even.\"\n    else\n        echo \"$INT\
    \ is odd.\"\n    fi\nfi\n```\n\nThe interesting part of the script is how it determines\
    \ whether an integer is even or odd. By performing modulo 2 operation on the number,\
    \ which divides the number by 2 and returns the remainder, it can tell if it is\
    \ odd or even."
  merge: -1
  img_proc: true
- pgno: 372
  md: "# A More Modern Version of test\n\nRecent versions of bash include a compound\
    \ command that acts as an\nhanced replacement for test. It uses the following\
    \ syntax:\n\n```\n[[ expression ]]\n```\n\nwhere expression is an expression that\
    \ evaluates to either a true or false result.\nThe [[ ]] command is very similar\
    \ to test (it supports all of its expressions)\nand adds an important string expression:\n\
    \n```\nstring1~ regex\n```\n\nwhich returns true if string1 is matched by the\
    \ extended regular expression\nregex. This opens up a lot of possibilities for\
    \ performing such tasks as data\nvalidation. In our earlier example of the integer\
    \ expressions, the script would\nfail if the INT contained anything except an\
    \ integer. The script needs\na way to verify that the constant contains an integer.\
    \ Using [[ ]] with the =\nstring operator, we could improve the script this:\n\
    \n```\n#!/bin/bash\n# test-integer2: evaluate the value of the integer.\nINT=-5\n\
    ```\n\n```\nif [[ \"$INT\" ~ ^-[0-9]+$ ]];; then\n  if [ \\$INT -eq 0 ]; then\n\
    \    echo \"\\$INT is zero.\n  else\n    if [ \\$INT -lt 0 ]; then\n      echo\
    \ \"\\$INT is negative.\"\n    else\n      echo \"\\$INT is positive.\"\n    fi\n\
    \    if [ \\$((INT % 2)) -eq 0 ]; then\n      echo \"\\$INT is even.\"\n    else\n\
    \      echo \"\\$INT is odd.\"\n    fi\nfi\n```\n\n```\necho \"INT is not an integer.\"\
    \ >&2\nexit 1\n```\n\nBy applying the regular expression, we are able to limit\
    \ the value of INT to\nonly strings that begin with an optional minus sign, followed\
    \ by one or more\numerals. This expression also eliminates the possibility of\
    \ empty values."
  merge: -1
  img_proc: true
- pgno: 373
  md: "Another added feature of [[ ]] is that the == operator supports pattern matching\
    \ the same way pathname expansion does. For example:\n\n```\n[me@linux ~]$ FILE=foo.bar\n\
    [me@linux ~]$ if [[ $FILE == foo.* ]]; then\necho \"$FILE matches pattern 'foo.*'\n\
    fi\nfoo.bar matches pattern 'foo.*'\n```\n\nThis makes [[ ]] useful for evaluating\
    \ file- and pathname.\n\n# (())-Designed for Integers\n\nIn addition to the [[\
    \ ]] compound command, bash also provides the (( )) compound command, which is\
    \ useful for operating on integers. It supports a full set of arithmetic evaluations,\
    \ a subject we will fully cover in Chapter 34. (( )) is used to perform arithmetic\
    \ truth tests. An arithmetic test results in true if the result of the arithmetic\
    \ evaluation is non-zero.\n\n```\n[me@linux ~]$ if ((1)); then echo \"It is true.\"\
    \nIt is true.\n[me@linux ~]$ if ((0)); then echo \"It is true.\"; fi\n[me@linux\
    \ ~]$\n```\n\nUsing (( )), we can slightly simplify the test-integer2 script like\
    \ this:\n\n```\n#!/bin/bash\n\n# test-integer2a: evaluate the value of an integer.\n\
    \nINT=$$\nif [[ \"$INT\" =~ ^-[0-9]+$ ]]; then\n\tif ((INT == 0)); then\n\techo\
    \ \"INT is zero.\"\n\telse\n\ttif ((INT < 0)); then\n\t\techo \"INT is negative.\"\
    \n\t\telse\n\t\t\techo \"INT is positive.\"\n\t\tif\n\t\tif ((INT % 2) == 0));\
    \ then\n\t\t\t\techo \"INT is even.\"\n\t\t\telse\n\t\t\t\techo \"INT is odd.\"\
    \n\t\t\tif\n\tfi\nelse\ntecho \"INT is not an integer.\" >&2\nexit 1\n```"
  merge: -1
  img_proc: true
- pgno: 374
  md: "Notice that we use less-than and greater-signs and that == is used to test\
    \ for equivalence. This is a more natural-looking syntax for working with integers.\
    \ Notice too, that the compound command (( )) is part of the shell script rather\
    \ than an ordinary command, and it is able to recognize variables by name and\
    \ does not require expansion to be performed.\n\n# # Combining Expressions\n\n\
    It's also possible to combine expressions to create more complex evaluations.\
    \ Expressions are combined by using logical operators. We saw these in Chapter\
    \ 17, when we learned about the find command. There are three logical operations\
    \ for test and [[ ]]. They are AND, OR, and NOT. test and [[ ]] use different\
    \ operators to represent these operations, as shown in Table 27-4.\n\nTable 27-4:\
    \ Logical Operators\n\n| Operation | test | [[ ]] and (( )) |\n| --- | --- | ---\
    \ |\n| AND | -a | && |\n| OR | -o | || |\n| NOT | ! | ! |\n\nHere's an example\
    \ of an AND operation. The following script determines if an integer is within\
    \ a range of values:\n\n```\n#!/bin/bash\n\n# test-integer3: determine if an integer\
    \ is within a\n# specified range of values.\n\nMIN_VAL=1\nMAX_VAL=100\n\nif [[\
    \ \"$INT\" =~ ^[0-9]+$ ]]; then\n  if [[ $INT -ge $MIN_VAL && $INT -le $MAX_VAL\
    \ ]]; then\n    echo \"$INT is within $MIN_VAL to $MAX_VAL.\"\n  else\n    echo\
    \ \"$INT is out of range.\"\nelse\n  echo \"$INT is not an integer.\" >&2\n  exit\
    \ 1\n\n```"
  merge: -1
  img_proc: true
- pgno: 375
  md: "In this script, we determine if the value of integer INT lies between the values\
    \ of MIN_VAL and MAX_VAL. This is performed by a single use of [[ ]], which includes\
    \ two expressions separated by the && operator. We could have also coded this\
    \ using this test:\n\n```\nif [ $INT -ge $MIN_VAL -a $INT -le $MAX_VAL ]; then\n\
    \    echo \"$INT is within $MIN_VAL to $MAX_VAL.\"\nelse\n    echo \"$INT is out\
    \ of range.\nfi\n```\n\nThe ! operator reverses the outcome of an expression.\
    \ It returns true if an expression is false, and returns false if an expression\
    \ is true. In the following script, we modify the logic of our evaluation to test\
    \ values of INT that are outside the specified range:\n\n```\n#!/bin/bash\n\n\
    # test-integer4: determine if an integer is outside a\n# specified range of values.\n\
    \nMIN_VAL=1\nMAX_VAL=100\n\nINT=50\n\nif [[ \"$INT\" =~ ^[0-9]+$ ]]; then\n  \
    \  if [ ! [ $INT -ge $MIN_VAL && $INT -le $MAX_VAL ] ]; then\n        echo \"\
    $INT is outside $MIN_VAL to $MAX_VAL.\"\n    else\n        echo \"$INT is in range.\"\
    \n    fi\nelse\n    echo \"$INT is not an integer.\" >&2\n    exit 1\nfi\n```\n\
    \nWe also include parentheses around the expression for grouping. If these were\
    \ not included, the negation would apply only to the first expression and not\
    \ the combination of the two. Coding this with this test would be this way:\n\n\
    ```\nif [ ! \\( $INT -ge $MIN_VAL -a $INT -le $MAX_VAL \\ ) ]; then\n    echo\
    \ \"$INT is outside $MIN_VAL to $MAX_VAL.\"\nelse\n    echo \"$INT is in range.\"\
    \nfi\n```\n\nSince all expressions and operators used by the test are treated\
    \ as commands by the shell (unlike [[ ]] and (( ))), characters that have special\
    \ meaning to bash, as <, >, (, and ) , must be quoted or escaped."
  merge: -1
  img_proc: true
- pgno: 376
  md: 'Seeing that test and [[ ]] do roughly the same thing, which is prefer-

    able? test is traditional (part of POSIX), whereas [[ ]] is specific to

    bash. It''s important to know how to use test, since it is very widely used, but

    [[ ]] is clearly more useful and is easier to code.


    # PORTABILITY IS THE HOBGOBLIN OF LITTLE MINDS


    If you talk to "real" Unix people, you quickly discover that many of them don’t

    like Unix very much. They regard it as impure and unclean. One ten of

    Unix followers is that everything should be *portable*. This means that any script

    you should be able to run, unchanged, on any Unix-like system.


    Unix people have good reason to believe this. Having seen what proprie-

    tensions to commands and shells did to the Unix before POSIX,

    they are naturally wary of the effect of Linux on their beloved OS.


    But portability has a serious downside. It prevents progress. It requires that

    things are always done using "lowest common denominator" techniques. In the

    case of shell programming, it means making everything compatible with sh, the

    orignal Bourne shell.


    This downside is the excuse that proprietary vendors use to justify their

    proprietary extensions, only they call them "innovations." But they are really

    lock-in devices for their customers. They encourage


    The GNU tools, such as bash, have no restrictions. They encourage

    portability by supporting standards and by being universally applicable. You can

    install bash and the other GNU tools on almost any kind of system, even Win-

    dows, without cost. So feel free to use all the features of bash. It''s *really*
    portable.


    # Control Operators: Another Way to Branch


    bash provides two control operators that can perform branching. The &&

    (AND) and || (OR) operators work like the logical operators in the [[ ]]

    compound command. This is the syntax:


    ```

    command1 && command2

    ```


    ```

    command1 || command2

    ```


    It is important to understand the behavior of these. With the && oper-

    ator, command1 is executed and command2 is executed if, and only if, command1
    is

    successful. With the || operator, command1 is executed and command2 is exe-

    cuted if, and only if, command1 is unsuccessful.'
  merge: -1
  img_proc: true
- pgno: 377
  md: "In practical terms, it means that we can do something like this:\n\n```\n[me@linuxbox\
    \ ~]$ mkdir temp && cd temp\n```\n\nThis will create a directory named temp, and\
    \ if it succeeds, the current working directory will be changed to temp. The second\
    \ command is attempted only if the mkdir command is successful. Likewise, a command\
    \ like\n\n```\n[me@linuxbox ~]$ [-d temp ] || mkdir temp\n```\n\nwill test for\
    \ the existence of the directory temp, and only if the test fails will the directory\
    \ be created. This type of construct is very handy for handling errors in scripts,\
    \ a subject we will discuss more in later chapters. For example, we could do this\
    \ in a script:\n\n```\n[-d temp ] || exit 1\n```\n\nIf the script requires the\
    \ directory temp, and it does not exist, then the script will terminate with an\
    \ exit status of 1.\n\n# Final Note\n\nWe started this chapter with a question.\
    \ How could we make our sys\\_info\\_page script detect whether or not the user\
