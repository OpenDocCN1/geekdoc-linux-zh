  md: '-rw-r--r-- 1 root 453764 2012-04-03 11:05 oo-welcome.odt

    -rw-r--r-- 1 root 358374 2012-04-03 11:05 ubuntu Sax.ogg


    Let''s look at the different fields from one of the files and examine their meanings
