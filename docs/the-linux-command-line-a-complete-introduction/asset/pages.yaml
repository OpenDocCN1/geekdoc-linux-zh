  md: '# # 36


    # # EXOTICA


    In this, the final chapter of our journey, we will look at some odds and ends.
    While we have certainly covered a lot of ground in the previous chapters, there
    are many bash features that we have not covered. Most are fairly obscure and useful
    mainly to those integrating bash into a Linux distribution. there are a few that,
    while not in common, are helpful for certain programming problems. We will cover
    them here.


    # ## Group Commands and Subshells


    bash allows commands to be grouped together. This can be done in one of ways:
    either with a group command or with a subshell. Here are examples of the syntax
    of each.


    Group command:


    ```

    { command1; command2; [command3; ...] }

    ```


    Subshell:


    ```

    (command1; command2; [command3;...])

    ```'
