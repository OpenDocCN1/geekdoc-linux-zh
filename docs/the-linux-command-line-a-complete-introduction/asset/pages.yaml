  md: "We use the du command with the -sh options to perform this task, however, is\
    \ not a complete solution to the problem. While it will work on some systems (Ubuntu,\
    \ for example), it will not work on others. The reason is that many systems set\
    \ the permissions of the home directories to prevent them from being world readable,\
    \ which is a reasonable security measure. On these systems, the report_home_space\
    \ function, as written, will work only if our script is run with super privileges.\
    \ A better solution would be to have the script adjust its behavior according\
    \ to the privileges of the user. We will take this up in Chapter 27.\n\n# SHELL\
    \ FUNCTIONS IN YOUR .BASHRC FILE\n\nShell functions make excellent replacements\
    \ for aliases, and they are actually the preferred method of creating small commands\
    \ for personal use. Aliases are very limited in the kind of commands and shell\
    \ features they support, whereas shell functions allow anything that can be scripted.\
    \ For example, if we liked the report_disk_space shell function that we developed\
    \ for our script, we could create a similar function named ds for bashrc file:\n\
    \n```\nds () {\n    echo \"Disk Space Utilization For $HOSTNAME\"\n    df -h\n\
    }\n```\n\n# Final Note\n\nIn this chapter, we have introduced a common method\
    \ of program design called top-down design, and we have seen how shell functions\
    \ are used to build the stepwise refinement that it requires. We have also seen\
    \ how local variables can be used to make shell functions independent from one\
    \ another and from the program in which they are placed. This makes it possible\
    \ for shell functions to be written in a portable manner and to be reusable allowing\
    \ them to be placed in multiple programs—a great time saver."
