- pgno: 383
  md: "we can use read to input the contents of /etc/passwd and successfully separate\
    \ fields into different variables. Here we have a script that does that:\n\n```\n\
    #!/bin/bash\n\n# read-ifs: read fields from a file\n\nFILE=/etc/passwd\n\nread\
    \ - \"Enter a username \" user_name\n\nfile_info=$(grep \"$user_name:\" $FILE)\
    \ ❶\n\nif [ -n \"$file_info\" ]; then\n    IFS=\\: read user pw uid gid name home\
    \ shell <<< \"$file_info\" ❷\n    echo \"User = \"$user\"\n    echo UID = \"$uid\"\
    \n    echo GID = \"$gid\"\n    echo \"Full Name = \"$name\"\n    echo \"Home Dir.\
    \ = \"$home\"\n    echo \"Shell = \"$shell\"\nelse\n    echo \"No such user $user_name\"\
    \ >&2\n    exit 1\n```\n\nThis script prompts the user to enter the username of\
    \ an account on the system and then displays the different fields found in the\
    \ user's record in the /etc/passwd file. The script contains two interesting lines.\
    \ The first, at ❶ assigns the results of a grep command to the variable file_info.\
    \ The regular expression used by grep ensures that the username will match only\
    \ a single line in the /etc/passwd file.\n\nThe second interesting line, at ❷,\
    \ consists of three parts: a variable assignment, a read command with a list of\
    \ variable names as arguments, and a strange new redirection operator. We'll look\
    \ at the variable assignment first.\n\nThe shell allows one or more variable assignments\
    \ to take place immediately before a command. These assignments alter the environment\
    \ for the command that follows. The effect of the assignment is temporary, only\
    \ changing the environment for the duration of the command. In our case, the value\
    \ of IFS is changed to a colon character. Alternatively, we could have coded this:\n\
    \n```\nOLD_IFS=\"$IFS\"\nIFS=\":\"\nread user pw uid gid name home shell <<< \"\
    $file_info\"\nIFS=\"$OLD_IFS\"\n```\n\nwhere we store the value of IFS, assign\
    \ a new value, perform the read command, and restore IFS to its original value.\
    \ Clearly, placing the variable assignment in front of the command is a more concise\
    \ way of doing the same thing."
