    # Creating New Filesystems


    Let''s say that we want to reformat the flash drive with a Linux filesystem, rather
    than the FAT32 system it has now. This involves two steps: first, (optionally)
    creating a new partition layout if the existing is not to our liking, and second,
    creating a new, empty filesystem on the drive.


    **Warning: In the following exercise, we are going to format a flash drive that
    contains nothing you care about because it will be erased! *Again, make absolutely
    sure you are specifying the correct device name for your system, not the one shown
    in the text.* Failure to heed this warning could result in formatting (i.e., erasing)
    the wrong drive!


    # Manipulating Partitions with fdisk


    The fdisk program allows us to interact directly with disk-like devices (such
    as hard disk drives and flash drives) at a very low level. With this tool we can
    edit, delete, and create partitions on the device. To work with our flash drive,
    we must first unmount it (if needed) and then invoke the fdisk program as:


    ```

    [melinux ~]$ sudo umount /dev/sdb1

    [melinux ~]$ sudo fdisk /dev/sdb

    ```


    > Notice that we must specify the device in terms of the entire device, by partition
    number. After the program starts up, we will see the following prompt:


    Command (m for help):


    Entering an m will display the program menu:


    +   - toggle a bootable flag

    - edit bsd disklabel

    - toggle the dos compatibility flag

    - delete a partition

    - list known partition types

    - print this menu

    - add a new partition'
