  md: 'As we can see, script produces the desired results, but how does it do it?
    Let''s take another look at our script. We''ll use cat to number the lines.


    ```

    me@linuxbox ~$ cat -n distros.sed

    1 # script to produce Linux distributions

    2 \

    3 1 iv

    4 \

    5 Linux Distributions Report\

    6 s/\([0-9]\{1}\)\\([0-9]\{2}\)\\\[([0-9]\{4}\)/\$$-1-\2\/

    7 y/abcdefghijklmnopqrstuvwxyzXYZ/

    ```


    Line 1 of our script is a comment. As in many programming languages on Linux systems,
    comments with the # character and are followed by human-readable texts. Comments
    can be placed anywhere in the script (though not within commands themselves) and
    are helpful to humans who need to identify/or maintain the script.


    Line 2 is a blank line. Like comments, blank lines may be added to improve readability.


    Many sed commands support line addresses. These are used to specify which lines
    of the input are to be acted upon. Line addresses may be specified as single line
    numbers, number-ranges, and the special line number $, which indicates the last
    line of input.


    > Note: A line-continuation character is formed by a backlash followed immediately
    by a carriage return. No intermediary spaces are permitted.


    Line 7 is our search-and-replace command. Since it is not preceded by an address,
    each line in the input stream is subject to its action.


    Line 8 performs transliteration of the lowercase letters into uppercase letters.
    Note that unlike the command in sed does not support character ranges (for example,
    [a-z]), nor does it support POSIX character classes. Again, since the y command
    is not preceded by an address, it applies to every line in the input.'
