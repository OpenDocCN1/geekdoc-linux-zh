    | /var/log | /var/log contains log files, records of various system activity.
    These are very important and should be monitored from time to time. The most useful
    one is /var/log/messages. Note that for security reasons on some systems, you
    must be the superuser to view log files. |


    # # Symbolic Links


    As we look around, we are likely to see a directory listing with an entry like
    this:


    ```

    1wx1wx1wx 1 root 11 2012-08-11 07:34 libc.so -> libc-2.6.50

    ```


    Notice how the first letter of the listing is 1 and the entry seems to have two
    filenames? This is a special kind of file called a symbolic link (also known as
    a soft link or symlink). While in Unix-like systems it is possible to have a file
    referenced by multiple names. While the value of this may not be obvious now,
    it is a really useful feature.


    Picture this scenario: A program requires the use of a shared resource of some
    kind contained in a file named foo, but foo has frequent version changes. It would
    be good to include the version in the filename so the administrator or other interested
    party could see which version of foo is installed. This presents a problem. If
    If we change the name of the shared resource, we have to track down every program
    that might change it to look for a new resource name every time a new version
    of the resource is installed. That doesn''t sound like fun at all.


    Here is where symbolic links save the day. Let''s say we install version 2.6 of
    foo, with the filename foo-2.6, and then create a symbolic link simply called
    foo that points to foo-2.6. This means that when a program opens the file, it
    is actually opening file-2.6. The programs that rely on foo can find it, and can
    see what actual version is installed. When it is time to upgrade to foo-2.7, we
    just add the file to our system, delete the symbolic link foo, and create a new
    one that points to the new version. Not only does this solve the problem of the
    version upgrade, but it also allows us to keep both versions on our machine. Imagine
    that foo-2.7 has a bug (damn those developers!) and we need to revert to the old'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'version. Again, we just delete the symbolic link pointing to the new version
    and create a new symbolic link pointing to the old version.


    The directory listing above (from the /lib directory of a Fedora system) shows
    a symbolic link called libc.so.6 that points to a shared library file called libc-2.6.so.
    This means that programs looking for libc.so.6 will actually get the file libc-2.6.so.
    We will learn how to create symbolic links in the next chapter.


    # HARD LINKS


    While we are on the subject of links, we need to mention that there is a second
    type of link called a hard link. Hard links also allow files to have multiple
    names, but they do it in a different way. We''ll talk more about the differences
    between symbolic and hard links in the next chapter.'
