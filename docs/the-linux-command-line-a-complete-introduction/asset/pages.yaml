    We first removed any existing copy of foo.txt to make sure we were fresh. Next,
    we ran the umask command without argue to see the current value. It responded
    with the umask 0002 (the value 0022 is another common default value), which is
    the octal representation of our mask. We then created a new instance of the file.txt
    and observed its permissions.


    We can see that both the owner and group read and write permissions, while everyone
    else gets only read permission. World does not have write permission because of
    the value of the mask. Let''s repeat our example, this time setting the mask ourselves:


    ```

    [me@linux ~]$ rm foo.txt

    [me@linux ~]$ umask 0000

    [me@linux ~]$ > foo.txt

    [me@linux ~]$ ls -l foo.txt

    -rw-rw-rw-- 1 me 2012-03-06 14:58 foo.txt

    ```


    When we set the mask to 0000 (effectively turning it off), we see that the file
    is now world writable. To understand how this works, we have to look octal numbers
    again. If we expand the mask into binary and compare it to the attributes, we
    can see what happens:


    | Original file mode | --- | Iw- | Iw- |

    |---|---|---|---|

    | Mask | 000 000 000 010 |

    | Result | --- | Iw- | Iw- | R-- |


    Ignore for the moment the leading 0 (we''ll get to those in a minute) and observe
    that the 1 appears in our mask, an attribute was removed—in this case, the world
    write permission. That''s what the mask does. Everywhere a 1 appears in the binary
    value of the mask, an attribute is unset. If we look at a mask value of 0022,
    we can see what it does:


    | Original file mode | --- | Iw- | Iw- |

    |---|---|---|---|

    | Mask | 000 000 000 010 |

    | Result | --- | Iw- | Iw- | R-- |'
