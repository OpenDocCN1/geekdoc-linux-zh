  md: "```\n#!/bin/bash\n```\n\n# posit-param2: script to display all arguments\n\n\
    ```\nwhile [[ $# -gt 0 ]];\n  echo \"Argument $count = $1\"\n  count=$((count\
    \ + 1))\n  shift\n```\n\nEach time shift is executed, the value of $2 is moved\
    \ to $1, the value of $3 is moved to $2, and so on. The value of $# is also reduced\
    \ by 1.\n\nIn the posit-param2 program, we create a loop that evaluates the number\
    \ of arguments remaining and continues as long as there is at least one. We display\
    \ the current argument, increment the count with each iteration of the loop to\
