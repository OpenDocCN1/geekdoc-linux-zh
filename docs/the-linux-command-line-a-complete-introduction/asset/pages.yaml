    # Switching Between Files


    To switch from one file to the next, use this command:


    ```

    :n

    ```


    To move back to the previous file, use:


    ```

    :N

    ```


    While we can move from one file to another, vim enforces a policy that prevents
    us from switching files if the current file has unsaved changes. To force vi to
    switch files and abandon your changes, add an exclamation point (!) to the command.


    In addition to the switching method described above, vim (and some versions of
    vim) provides some commands that make multiple files easier to manage. We can
    view a list of files being edited with the :buffers command. So will display a
