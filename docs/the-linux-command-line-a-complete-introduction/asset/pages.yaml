    By using a 3-character range, we can abbreviate the 26 letters. Any range of characters
    can be expressed this way, including multiple ranges such as this, which makes
    filenames starting with letters and numbers:


    ```

    me@linuxbox ~ $ grep -h ''^[A-z0-9]*$'' dirlist*.txt

    ```


    In character ranges, we see that the dash character is treated specially, so how
    do we actually include a dash character in a bracket expression? By making it
    the first character in the expression. Consider


    ```

    me@linuxbox ~ $ grep -h ''^[A-Z]*$'' dirlist*.txt

    ```


    This will match every filename containing an uppercase letter. This, on the other
    hand,

    will match every filename containing a dash, an uppercase A, or an uppcase Z.


    # POSIX Character Classes


    The traditional character ranges are an easily understood and effective way to
    handle the problem of quickly specifying sets of characters. Unfortunately, they
    don''t always work. While we have not encountered any problems with our use of
    grep so far, we might run into problems using other programs.


    Back in Chapter 4, we looked at how wildcards are used to perform pathname expansion.
    In that discussion, we said that character ranges can be used in a manner almost
    identical to the way they are used in regular expressions, but here''s the problem:


    ```

    me@linuxbox ~ $ ls /usr/sbin/[ABCDEFGHIJKLMNOPQRSTUVWXYZ]*

    /usr/sbin/MAKEFLOPPIES

    /usr/sbin/NetworkManagerDispatcher

    /usr/sbin/NetworkManager

    ```'
  merge: -1
