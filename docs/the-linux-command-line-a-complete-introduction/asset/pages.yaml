- pgno: 304
  md: 'fmt has some interesting options, as shown in Table 21-3.


    # ### Table 21-3: fmt Options


    | Option | Description |

    | -c | Operate in crown margin mode. This preserves the indentation of the first
    two lines of a paragraph. Subsequent lines are aligned with the indentation of
    the second line. |

    | -p string | Format only those lines beginning with the prefix string. After
    formatting, the contents of string are prefixed to each reformatted line. This
    option can be used to format text in source code comments. For example, any programming
    language or configuration file uses a # character to delineate a comment could
    be formatted by specifying -p # so that only the comments will be formatted. See
    the example below. |

    | -s | Split-only mode. In this mode, lines will be split to fit the specified
    column width. Short lines will not be joined to fill lines. This mode is useful
    when formatting text, such as code, where joining is not desired |

    | -u | Perform uniform spacing. This will apply traditional "typewriter-style"
    to the text. This means a single space between words and two spaces between sentences.
    This mode is useful for removing justification, that is, forced alignment to both
    the left and right margins |

    | -w width | Format text to fit within a column width characters. The default
    is 75 characters. Note: fmt actually formats lines slightly shorter than the specified
    width to allow for line balancing.|


    The -p option is particularly interesting. With it, we can select portions of
    a file, provided that the lines to be formatted all begin with the same sequence
    of characters. Many programming languages use the hash mark (#) to indicate the
    beginning of a comment and thus can be formatted using this option. Let''s create
    a file that simulates a program that uses comments:


    ```

    @me@linux~$ cat fmt-code.txt

    # This file contains code with comments.

    ```


    +   - This line is a comment.

    - Followed by another comment line.

    - And another.


    This, on the other hand, is a line of code.

    And another line of code.

    And another.'
  merge: -1
  img_proc: true
- pgno: 305
  md: "Our sample file contains comments, which begin with the string # (a # followed\
    \ by a space), and lines of “code,” which do not. Now, using fmt, we can format\
    \ the comments and leave the code untouched:\n\n```\nme@linuxbox]$ fmt -w 50 -p\
    \ '# ' fmt-code.txt\n# This file contains code with comments.\n```\n\n# This line\
    \ is a comment. Followed by another\n# comment line. And another.\n\nThis, on\
    \ the other hand, is a line of code.\nAnd another line of code.\nAnd another.\n\
    \nNotice that the adjoining comment lines are joined, while the blank\nlines and\
    \ the lines that do not begin with the specified prefix are preserved.\n\n# pr-Format\
    \ Text for Printing\n\nThe pr program is used to paginate text. When printing\
    \ text, it is often desir- to separate the pages of output with several lines\
    \ of whitespace to pro- vide a top and bottom margin for each page. Further, this\
    \ whitespace can be used to insert a header and footer on each page.\nWe demonstrate\
    \ pr by formatting our distros.txt file into a series of very short pages (only\
    \ the first two pages are shown):\n\n```\nme@linuxbox$ pr -l 1 15 -w 65 distros.txt\n\
    ```\n\n2012-12-11 18:27\t\tdistros.txt\t\tPage 1\n\n| SUSE\t10.2\t12/07/2006 |\n\
    | Fedora\t10\t11/25/2008 |\n| SUSE\t11.0\t06/19/2008 |\n| Ubuntu\t8.04\t04/24/2008\
    \ |\n| Fedora\t8\t11/08/2007 |\n\n2012-12-11 18:27\t\tdistros.txt\t\tPage 2\n\n\
    | SUSE\t10.3\t10/04/2007 |\n| Ubuntu\t6.10\t10/26/2006 |\n| Fedora\t7\t05/31/2007\
    \ |\n| Ubuntu\t7.10\t10/18/2007 |\n| Ubuntu\t7.04\t04/19/2007 |"
