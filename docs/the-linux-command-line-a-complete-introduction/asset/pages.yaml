- pgno: 202
  md: '# Formatting Floppy Disks


    For those of still using computers old enough to be equipped with floppy disk
    drives, we can manage those devices, too. Preparing a blank floppy is a two-step
    process. First, we perform a low-level format on the disk, and then we create
    a filesystem. To accomplish the formatting, we use dformat program specifying
    the name of the floppy device (usually /dev/fd0):


    ```

    me@linuxbox ~$ sudo dformat /dev/fd0

    Double-sided, 80 tracks, 18 track. Total capacity 1440 kB.

    Formatting ... done

    Verifying ... done

    ```


    Next, we apply a FAT filesystem to the disk with mkfs:


    ```

    me@linuxbox ~$ sudo mkfs -t mdsos /dev/fd0

    ```


    Notice that we use the mdsos filesystem type to get the older (and smaller) style
    file allocation tables. After a disk is prepared, it may be mounted like other
    devices.


    # Moving Data Directly to from Devices


    While we usually think of data on our computers as being organized into files,
    it is also possible to think of the data in "raw" form. If we look at a disk drive,
    for example, we see that it consists of a large number of "blocks" of data that
    the operating system sees as directories and files. If we treated a disk drive
    as a large collection of data blocks, we could perform useful tasks, such as cloning
    devices.


    The dd program performs this task. It copies blocks of data from one place to
    another. It uses a unique syntax (for historical reasons) and is usu-ally this
    way:


    ```

    dd if=input_file of=output_file [bs=block_size [count=blocks]]

    ```


    Let''s say we had two USB drives of the same size and we wanted to copy the first
    drive to the second. If we attached both drives to the computer and they were
    assigned to devices /dev/sdb and /dev/sdc respect-ively, we could copy everything
    on the first drive to the second drive with the following:


    ```

    dd if=/dev/sdb of=/dev/sdc

    ```


    Alternatively, if only the first device was attached to the computer, we could
    copy its contents to an ordinary file for later restoration or copying:


    ```

    dd if=/dev/sdb of=flash_drive.img

    ```'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'Warning: The dd command is very powerful. Though its name derives from data
    definition, it is sometimes called destroy disk because users often mistype either
    the if or of specifications. Always double-check your input and output specifications
    before pressing ENTER!


    # Creating CD-ROM Images


    Writing a recordable CD-ROM (either a CD-R or CD-RW) consists of two steps: first,
    constructing an ISO image file that is the exact filesystem image of the CD-ROM,
    and second, writing the image file onto the CD-ROM medium.


    # Creating an Image Copy of CD-ROM


    If we want to make an ISO image of an existing CD-ROM, we can read all the data
    blocks off the CD-ROM and copy them to a local file. Say we had an Ubuntu CD and
    we wanted to make an ISO file that we could later use to make copies. After inserting
    the CD and determining its device name (we''ll assume /dev/cdrom), we can make
    the ISO file like so:


    ```

    dd if=/dev/cdrom of=cdrom.iso

    ```


    This technique works for data DVDs as it will not work for audio CDs as they do
    not use a filesystem for storage. For audio CDs, look at the cddaao command.


    # A PROGRAM BY ANY OTHER NAME...


    If you look online tutorials for creating and burning optical media like CDROMs
    and DVDs, you will frequently encounter two programs called mkisos and cdrecord.
    These programs were part of a popular package called cdrtools authored by Jörg
    Schilling. In the summer of 2006, Mr. Schilling made a license change to a portion
    of the cdrtools package, that in the opinion of the Linux community, created a
    license incompatibility with the GNU GPL. As a result, a fork of the cdrtools
    package was started, which now includes programs for cdrecord and mkisos named
    wodim and genisoimage.


    # Creating an Image from a Collection of Files


    To create an ISO image file containing the contents of a directory, we use the
    genisoimage. To do this, we first create a directory containing all files we want
    to include in the image and then execute the genisoimage command to create the
    image file. For example, if we had created a directory called ~/cd-rom-files and
    filled it with files for our CD-ROM, we could create an image named cd-rom.iso
    with the following command:


    ```

    genisoimage -o cd-rom.iso -R -J ~/cd-rom-files

    ```


    172 Chapter 15'
