- pgno: 365
  md: "This is an example of a branch. Based on the condition \"Does X = 5?\" do one\
    \ thing: \"Say X equals 5.\" Otherwise do another thing: \"Say X is not equal\
    \ to 5.\"\n\n# Using if\n\nUsing the shell, we can code the logic above as follows:\n\
    \n```\nx=5\nif [$x = 5 ]; then\n  echo \"x equals 5\"\nelse\n  echo \"x does not\
    \ equal 5.\"\n```\n\nOr we can enter it directly at the command line (slightly\
    \ shortened):\n\n```\n[me@linuxbox~$] x=5\n[me@linuxbox~$] if [$x = 5 ]; then\
    \ echo \"equals 5\"; else echo \"does not equal 5\";\nequal 5\n[me@linuxbox~$]\
    \ x=0\n[me@linuxbox~$] if [$x = 5 ]; then echo \"equals 5\"; else echo \"does\
    \ not equal 5\";\ndoes not equal 5\n```\n\nIn this example, we execute the command\
    \ twice. Once, with the value of x set to 5, which results in the string 5 being\
    \ output, and the second time with the value of x set to 0, which results in the\
    \ string not equal 5 being output.\n\nThe if statement has the following syntax:\n\
    \n```\nif commands; then\n  commands\nelif commands; then\n  commands...\nelse\n\
    \  commands\n```\n\nwhere commands is a list of commands. This is a little confusing\
    \ at first glance. But before we can clear this up, we have to look at how the\
    \ shell evaluates the success or failure of a command.\n\n# Exit Status\n\nCommands\
    \ (including the scripts and shell functions we write) issue a value to the system\
    \ when they terminate, an exit status. This value, which is an integer in range\
    \ of 0 to 255, indicates the success or failure of the command's execution. By\
    \ convention, a value of 0 indicates success, and"
  merge: -1
  img_proc: true
- pgno: 366
  md: 'any value indicates failure. The shell provides a parameter that we can use
    to examine the exit status. Here we see it in action:


    ```

    [me@linux]$ ls -d /usr/bin

    /usr/bin

    [me@linux]$ echo $?

    0

    [me@linux]$ ls -d /bin/usr

    ls: cannot access /bin/usr: No such file or directory

    [me@linux]$ echo $?

    ```


    In this example, we execute the ls1 command twice. The first time, the command
    executes successfully. If we display the value of the parameter $?, we see that
    it is 0. We execute the ls a second time, producing an error, and examine the
    parameter $? again. It contains a 2, indicating that the command encountered an
    error. Some commands use exit-status values to provide diagnostics for errors,
    while many commands simply exit with a value of 1 when they fail. Man pages often
    include a section entitled "Exit Status," which describes what codes are used.
    However, a 0 indicates success.


    The shell provides two extremely simple built-in commands that do nothing except
    either a 0 or 1 exit status. The true command always executes successfully, and
    the false command always executes unsuccessfully:


    ```

    [me@linux]$ true

    [me@linux]$ echo $?

    0

    [me@linux]$ false

    [me@linux]$ echo $?

    1

    ```


    We use these commands to see how the if statement works. If the statement really
    evaluates the success or failure of commands:


    ```

    [me@linux]$ if true; then echo "It''s true"; fi

    It''s true.

    [me@linux]$ if false; then echo "It''s true"; fi

    [me@linux]$

    ```


    The command echo "It''s true" is executed when the command following executes
    successfully, and is not executed when the command following does not execute
    successfully. If a list of commands follows, the last command in the list is evaluated:


    ```

    [me@linux]$ if false; then echo "It''s true"; fi

    It''s true.

    [me@linux]$ if false; then echo "It''s true"; fi

    [me@linux]$

    ```'
  merge: -1
  img_proc: true
- pgno: 367
  md: '# Using test


    By far, the command used most frequently with if is test. The test command performs
    a variety of checks and comparisons. It has two equivalent forms:


    ```

    test expression

    ```


    and the more popular


    ```

    [ expression ]

    ```


    where expression is an expression that is evaluated as either true or false. The
    test command returns an exit status of 0 when the expression is true and a status
    of 1 when the expression is false.


    # File Expressions


    The expressions in Table 27-1 are used to evaluate the status of files.


    # Table 27-1: test File Expressions


    | Expression | Is true if . . |

    | - | - |

    | file1 -ef file2 | file1 and file2 have same inode numbers (the two filenames
    refer to the same file by hard linking). |

    | file1 -nt file2 | file1 is newer than file2. |

    | file1 -ot file2 | file1 is older than file2. |

    | -b file | file exists and is a block-special (device) file. |

    | -c file | file exists and is a character-special (device) file. |

    | -d file | file exists and is a directory. |

    | -e file | file exists. |

    | -f file | file exists and is a regular file. |

    | -g file | file exists and is set-group-ID. |

    | -G file | file exists and is owned by the effective group ID. |

    | -k file | file exists and has its "sticky bit" set. |

    | -L file | file exists and is a symbolic link. |

    | -0 file | file exists and is owned by the effective user ID. |

    | -p file | file exists and is a named pipe. |

    | -r file | file exists and is readable (has readable permission for the effective
    user). |

    | -s file | file exists and has a length greater than zero. |'
  merge: -1
  img_proc: true
- pgno: 368
  md: "# Table 27-1 (continued)\n\n| Expression | Is true if . . |\n| -S file | file\
    \ exists and is a network socket. |\n| -t fd | fd is a file descriptor directed\
    \ to/from the terminal. This can be used to determine whether standard input/output/\
    \ error is being redirected. |\n| -u file | file exists and setuid. |\n| -w file\
    \ | file exists and is writable (has write permission for the effective user).\
    \ |\n| -x file | file exists and is executable (has execute/search permission\
    \ for the effective user). |\n\nHere we have a script that demonstrates some of\
    \ the file expressions:\n\n```\n#!/bin/bash\n\n# test-file: Evaluate the status\
    \ of a file\nFILE=\".bashrc\"\nif [ -e \"$FILE\" ]; then\n  if [ -f \"$FILE\"\
    \ ]; then\n    echo \"$FILE is a regular file.\"\n  if [ -d \"$FILE\" ]; then\n\
    \    echo \"$FILE is a directory.\"\n  if [ -r \"$FILE\" ]; then\n    echo \"\
    $FILE is readable.\"\n  if [ -w \"$FILE\" ]; then\n    echo \"$FILE is writable.\"\
    \n  if [ -x \"$FILE\" ]; then\n    echo \"$FILE is executable/searchable.\"\n\
    else\n  echo \"$FILE does not exist\"\n  exit 1\nexit\n```\n\nThe script evaluates\
    \ the file assigned to the constant FILE and displays its results as the evaluation\
    \ is performed. There are two interesting things to note about this script. First,\
    \ notice how the parameter $FILE is quoted within the expressions. This is not\
    \ required, but it is a defense against the parameter being empty. If the parameter\
    \ expansion of $FILE were to result in an empty value, it would cause an error\
    \ (the operators would be interpreted as null strings rather than operators).\
    \ Using the quotes around the parameter"
  merge: -1
  img_proc: true
- pgno: 369
  md: "ensures the operator is always followed by string, even if the string is empty.\
    \ Second, notice the presence of the exit commands near the end of the script.\
    \ The exit command accepts a single, optional argument, which becomes the script's\
    \ status. When no argument is passed, the exit status defaults to 0. Using exit\
    \ in this way allows the script to indicate failure ifFILE expands to the name\
    \ of a non own file. The exit command appearing on the last line of the script\
    \ is there as a formality. A script runs off the end (reaches end-of-file), it\
    \ terminates with an exit status of 0 by default, anyway.\n\nSimilarly, shell\
    \ functions can return an exit status by including an integer to the return command.\
    \ If we were to convert the script above to a shell function to include it in\
    \ a larger program, we could replace the exit commands with return statements\
    \ and get the desired behavior:\n\n```\ntest_file() {\n  # test-file: Evaluate\
    \ the status of a file\n\n  FILE=\".bashrc\n\n  if [ -f \"$FILE\" ]; then\n  \
    \  echo \"$FILE is a regular file.\"\n    if [ -d \"$FILE\" ]; then\n      echo\
    \ \"$FILE is a directory.\"\n    if [ -r \"$FILE\" ]; then\n      echo \"$FILE\
    \ is readable.\"\n    if [ -w \"$FILE\" ]; then\n      echo \"$FILE is writable.\"\
    \n    if [ -x \"$FILE\" ]; then\n      echo \"$FILE is executable/searchable.\"\
    \n  else\n    echo \"$FILE does not exist\"\n    return 1\n  fi\n}\n```\n\n# String\
    \ Expressions\n\nThe expressions in Table 27-2 are used to evaluate strings.\n\
    \n# Table 27-2: test String Expressions\n\n| Expression | Is true if ... |\n|\
    \ --- | --- |\n| string | string is not null. |\n| -n string | The length of string\
    \ is greater than zero. |"
  merge: -1
  img_proc: true
- pgno: 370
  md: "# Table 27-2 (continued)\n\n| Expression | Is true if ... |\n| --- | --- |\n\
    | -z string | The length of string is zero. |\n| string1 = string2 | string1 and\
    \ string2 are equal. Single or double equal signs may be used, but the use of\
    \ double equal signs is greatly preferred. |\n| string1 != string2 | string1 and\
    \ string2 are not equal. |\n| string1 > string2 | string1 sorts after string2.\
    \ |\n| string1 < string2 | string1 sorts before string2. |\n\n**Warning:** The\
    \ `>` and `<` expression operators must be quoted (or escaped with a backslash)\
    \ when used with text. If they are not, they will be interpreted by the shell\
    \ as redirection operators, with potentially destructive results. Also note while\
    \ the bash documentation states that the sort order conforms to the collation\
    \ order of the current locale, it does not. ASCII (POSIX) order is used in versions\
    \ bash up to and including 4.0.\n\nHere is a script that incorporates string expressions:\n\
    \n```\n#!/bin/bash\n\n# test-string: evaluate the value of a string\n\nANSWER=maybe\n\
    \nif [ -z \"$ANSWER\" ]; then\n    echo \"There is no answer.\" >&2\n    exit\
    \ 1\n\nif [ \"$ANSWER\" = \"yes\" ]; then\n    echo \"The answer is YES.\"\nelif\
    \ [ \"$ANSWER\" = \"no\" ]; then\n    echo \"The answer is NO.\"\nelif [ \"$ANSWER\"\
    \ = \"maybe\" ]; then\n    echo \"The answer is MAYBE.\"\nelse\n    echo \"The\
    \ answer is UNKNOWN.\"\nfi\n```\n\nIn this script, we evaluate the constant ANSWER.\
    \ We first determine if the string is empty. If it is, we terminate the script\
    \ and set the exit status to 1. Notice the redirection is applied to the echo\
    \ command. This redirects the error message \"There is no answer.\" to standard\
    \ error, which is the \"proper\" to do with error messages. If the string is not\
    \ empty, we evaluate the value of the string to see if it is equal to \"yes,\"\
    \ \"no,\" or \"maybe.\" We do this by using elif, which is short for else if.\
    \ By using elif, we are able to construct a more complex logical test."
  merge: -1
