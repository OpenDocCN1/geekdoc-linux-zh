- pgno: 364
  md: "# 27\n\n# FLOW CONTROL:\nBRANCHING WITH IF\n\nIn the last chapter, we were\
    \ presented with a problem.\nHow can we make our report-generator script adapt\
    \ to the privileges of the user running the script? The solution to this problem\
    \ will require us to find a way to “change directions” within our script, based\
    \ on the results of a test. In programming terms, we need the program to *branch*.\n\
    \nLet’s consider a simple example of logic expressed in *pseudocode*, a simulation\
    \ of a computer language intended for human consumption:\n\n```\nX = 5\nIf X =\
    \ 5, then:\n    Say \"X equals 5.\"\nOtherwise:\n    Say \"X is not equal to 5.\"\
    \n```"
