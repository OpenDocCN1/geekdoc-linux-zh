- pgno: 253
  md: '(Depending on the Linux distribution, we will get a different list of files,
    possibly an empty list. This example is from Ubuntu.) This command produces—a
    list of the files whose names begin with an uppercase letter. But with this command
    we get an entirely different result (only a partial listing of the results is):


    ```

    [me@linuxbox ~]$ ls /usr/sbin/[A-Z]*

    /usr/sbin/biosdecode

    /usr/sbin/chat

    /usr/sbin/chpgpasswd

    /usr/sbin/chpasswdd

    /usr/sbin/chroot

    /usr/sbin/cleanup-info

    /usr/sbin/complain

    /usr/sbin/console-kit-daemon

    ```


    Why is that? It''s a long story, but here''s the short version.

    When Unix was first developed, it only knew about ASCII characters, and this feature
    reflects fact. In ASCII, the first 32 characters (0–31) are control codes (things
    like tabs, backspaces, and carriage returns). The next 32 (32–63) contain printable
    characters, including most punctuation characters and the numerals zero through
    nine. The next 32 (64–95) contain the uppercase letters and a few more symbols.
    The final 31 (96–127) contain the lowercase letters and yet more punctuation symbols.
    Based on this arrangement, systems using ASCII used collation that looked like


    ```

    ABCDEFGHIABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz

    ```


    This differs from proper dictionary order, which is like this:


    ```

    aBBcCcDdEeFfGgHIiJkLlMmNOppQrSsTtUvWwXxYzz

    ```


    As the popularity of Unix grew beyond the United States, there grew a need to
    support characters not in English. The ASCII table was expanded to use a full
    8 bits, adding character numbers 128–255, which accommodated many more languages.
    To support this ability, the POSIX standards introduced a concept called a *locale*,
    which could be adjusted to select the character set needed for a particular location.
    We can see the locale setting of our system using this command:


    ```

    [me@linuxbox ~]$ echo LANG

    en_US.UTF-8

    ```


    With this setting, POSIX-compliant applications will use a dictionary collation
    order other than ASCII. This explains the behavior of the commands above. A character
    range of [A-Z], when interpreted in dictionary order, includes all of the alphabetic
    characters except the lowercase $a—our results.'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'To partially work around this problem, the POSIX standard includes a number
    of character classes, which provide useful ranges of characters. They are described
    in Table 19-2.


    # Table 19-2: POSIX Character Classes


    | Character Class | Description |

    |---|---|

    | [:alnum:] | The alphanumeric characters; in ASCII, equivalent to [A-Za-z9] |

    | [:word:] | The same as [:alnum:], with the addition of the underscore character
    [] |

    | [:alpha:] | The alphabetic characters; in ASCII, equivalent to [A-Za-z] |

    | [:blank:] | Includes the space and tab characters |

    | [:ctrl:] | The ASCII control codes; includes the ASCII characters 0 through
    31 and 127 |

    | [:digit:] | The numerals 0 through 9 |

    | [:graph:] | The visible characters; in ASCII, includes characters 33 through
    126 |

    | [:lower:] | The lowercase letters |

    | [:punct:] | The punctuation characters; in ASCII, equivalent to [!"#$&''()*+,-./;<=>@[\]^_`|~]
    |

    | [:print:] | The printable characters; all in [:graph:] plus the space character
    |

    | [:space:] | The whitespace characters including space, tab, carriage return,
    vertical, tab, and form feed; in ASCII, equivalent to [ \t\n\v\f] |

    | [:upper:] | The uppercase characters |

    | [:xdigit:] | Characters used to express hexadecimal numbers; in ASCII, equivalent
    to [0-9Aa-f] |


    Even with the character classes, there is still no convenient way to express partial
    ranges, such as [A-M].


    Using character classes, we can repeat our directory listing and see an improved
    result.


    ```

    [me@linux ~]$ ls /usr/sbin/[:upper:]]*

    /usr/sbin/MAKEFLOPPIES

    /usr/sbin/NetworkManagerDispatcher

    /usr/sbin/NetworkManager

    ```'
