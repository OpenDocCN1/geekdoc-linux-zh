    # SOME SPECIAL PERMISSIONS


    Though we usually see an oct permission mask as a three-digit number, it is more
    technically correct to express it in four digits. Why? Because, in addition to
    read, write, and execute permissions, there are some other, less-used permission
    settings.


    The first of these is the *setuid* bit (octal 4000). When applied to an executable
    file, it sets the *effective user ID* from that of the real user (the user actually
    running the program) to that of the owner. This is given to a few programs owned
    by the superuser. When an ordinary user runs a program that is *setgid*, the program
    runs with the effective privileges of the superuser. This allows the program to
    access files and directories that an ordinary user would normally be prohibited
    from accessing. Clearly, because this raises security concerns, the number of
    setgid programs must be held to an absolute.


    The second-used setting is the *setgid* bit (octal 2000). This, like the setuid
    bit, changes the *effective group ID* from that of the *real group ID* of the
    user to that of the file owner. If the setgid bit is set on a directory, newly
    created files in the directory will be given the group ownership of the directory
    rather the group ownership of the file owner. This is useful in a shared directory
    where members of a common group need access to all files in the directory, regardless
    of the file owner''s primary group.


    The third is called the sticky bit (octal 1000). This is a holdovover from ancient
    Unix, where it was possible to mark an executable file as "not swappable". On
    Linux ignores the sticky bit, but if applied to a directory, it prevents users
    from deleting or renaming files unless the user is the owner of the directory,
    the owner of the file, or the superuser. This is often used to control access
    to a shared directory, such as */tmp*.


    Here are some examples of using chmod with symbolic notation to set these permissions.
    First, assign setuid to a program:


    ```

    chmod +s program

    ```


    Next, assign setgid to a directory:


    ```

    chmod g+s dir

    ```'
