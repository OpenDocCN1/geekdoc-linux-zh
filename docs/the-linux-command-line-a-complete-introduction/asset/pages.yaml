- pgno: 48
  md: 'There are many kinds of files. In fact, one of the common ideas in Unix-like
    operating systems as Linux is that "everything is a file." As we proceed with
    our lessons, we will see just how true that statement is.


    While many of the files on your system are familiar, for example MP3 and JPEG
    files, many kinds are a little obvious, and a few are quite strange.


    # # Viewing File Contents with less


    The less command is a program to view text files. Throughout your Linux system,
    there are many files that contain human-readable text. The less provides a convenient
    way to examine them.


    Why would we examine text files? Because many of the files that contain system
    settings (called *configuration files*) are stored in this format, being able
    to read them gives us insight about how the system works. In addition, many of
    the actual programs that the system uses (called *scripts*) are stored in this
    format. In later chapters, we will learn how to edit text files in order to modify
    system settings and write our own scripts, but for now we will just look at their
    contents.


    # ## WHAT IS "TEXT"?


    There are many ways to represent information on a computer. All methods involve
    defining a relationship between the information and some numbers that will be
    used to represent it. Computers, after all, understand only numbers, and all data
    is converted to numeric representation.


    Some of these representation systems are very complex (such as compressed video
    files), while others are rather simple. One of the earliest and simplest is ASCII
    text. ASCII (pronounced "As-Key") is short for American Standard Code for Information
    Interchange. This simple encoding scheme was used on Teletype machines.


    Text is a simple one-to-one mapping of characters to numbers. It is very compact.
    Fifty characters of text translate to bytes of data. It is not the same as text
    in a word processor document as one created by Microsoft Word or Office.org Writer.
    Those files, in contrast to simple ASCII text, many non-text elements are used
    to describe their structure and formatting. Plain ASCII text files contain only
    the characters themselves and a few rudimentary control codes like tabs, carriage
    returns, and linefeeds.


    Throughout a Linux system, many files are stored in text format, and many Linux
    tools work with text files. Even Windows recognizes the importance of this format.
    The well-known Notepad program is an editor for plain ASCII files.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'The less command is used like this:


    less filename


    Once started, the less program allows you to scroll forward and backward through
    a text file. For example, to examine the file that defines all the system’s user
    accounts, enter the following command:


    ```

    me@linuxbox ~~$ less /etc/passwd

    ```


    Once the less program starts, we can view the contents of the file. If the file
    is longer than one page, we can scroll up and down. To exit less, press the Q
    key.


    Table 3-3 lists the most common keyboard commands used by less.


    | Command | Action |

    |---|---|

    | PAGE UP or b | Scroll back one page. |

    | PAGE DOWN or Spacebar | Scroll forward one page. |

    | Up Arrow | Scroll up one line. |

    | Down Arrow | Scroll down one line. |

    | G | Move to the end of the text file. |

    | 1G or g | Move to the beginning of the text file. |

    | /characters | Search forward to the next occurrence of characters. |

    | n | Search for the next occurrence of the previous search. |

    | h | Display help screen. |

    | q | Quit less. |


    # LESS IS MORE


    The less program was designed as an improved replacement of an earlier Unix program
    called more. Its name is a play on the phrase “less is more”—a motto of modernist
    architects and designers.


    less falls into the class of programs pagers, programs that allow the easy viewing
    of long text documents in a page-by-page manner. Whereas the more program could
    only page forward, the less program allows both forward and backward and has many
    other features as well.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# A Guided Tour


    The filesystem layout on your Linux system is much like that found on other Unix-like
    systems. The design is actually specified in a published standard called the Linux
    Filesystem Hierarchy Standard. Not all Linux distributions conform to the standard
    exactly, but most come pretty close.


    Next, we are going to wander around the filesystem ourselves to see what makes
    our Linux tick. This will give you a chance to practice your navigation skills.
    One of the things we will discover is that many of the interesting files are in
    plain, human-readable text. As we go about our tour, try the following:


    +   - cd into a given directory.

    - List the directory contents with ls -l.

    - If you see an interesting file, determine its contents with file.

    - If it looks like it might be text, try viewing it with less.


    Note: Remember the copy-and-paste trick! If you are using a mouse, you can double-click
    a filename to copy it and middle-click to paste it into commands.


    As we wander, don''t be afraid to look at stuff. Regular users are largely prohibited
    from missing things up. That''s the system administrator job! If a command complains
    about something, move on to something else. Spend some time looking around. The
    system is ours to explore. Remember, in Linux, there are no secrets! Table 3-4
    lists just a few of the directories we can explore. Feel free to try more!


    # Table 3-4: Directories Found on Linux Systems


    | Directory | Comments |

    | --- | --- |

    | / | The root directory, where everything begins. |

    | /bin | Contains binaries (programs) that must be present for the system to boot
    and run. |

    | /boot | Contains the Linux kernel, initial RAM disk image (for drivers needed
    at boot time), and the boot loader. |


    Interesting files:

    - /boot/grub/grub.conf or menu.lst, which are used to configure the boot loader

    - /boot/mlinuz, the Linux kernel


    (continued)'
  merge: -1
  img_proc: true
