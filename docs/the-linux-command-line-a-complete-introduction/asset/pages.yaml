- pgno: 170
  md: '# CUSTOMIZING THE PROMPT


    In this chapter we will look at a seemingly trivial detail: our shell prompt.
    This examination will reveal some of the inner workings of the shell and the terminal
    emulator program itself.


    Like so many things in Linux, the shell prompt is highly configurable, and while
    we have pretty much taken it for granted, the prompt is a really useful device
    once we learn how to control it.


    # Anatomy of a Prompt


    Our default prompt looks something like this:


    ```

    me@linuxbox ~$

    ```


    Notice that it contains our username, our hostname, and our current working directory,
    but how did it get that way? Very simply, it turns out. The'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'prompt is defined by an environment variable named PS1 (short for prompt string
    Y). We can view the contents of PS1 with the echo command:


    ```

    me@linuxbox ~$ echo PS1

    [\u\h \$]

    ```


    **Note: Don''t worry if your results are not exactly the same as the example above.
    Every Linux distribution defines the prompt string a little differently, some
    chaotically.**


    From the results, we can see that PS1 contains a few of the characters we see
    in our prompt, such as the square brackets, the @ sign, and the dollar sign, but
    the rest are a mystery. The astute among us will recognize these asslash-escaped
    special characters like those we saw in Table 7-2. Table 13-1 is a partial list
    of the characters that the shell treats specially in the prompt string.


    # Table 13-1: Escape Codes Used in Shell Prompts


    | Sequence | Value Displayed |

    | \a | ASCII bell. This makes the computer beep when it is encountered. |

    | \d | Current date in day, month, date format; for example, "Mon May 26" |

    | \h | Hostname of the local machine minus the trailing domain name |

    | \H | Full hostname |

    | \j | Number of jobs running in the current shell session |

    | \l | Name of the current terminal device |

    | \n | A newline character |

    | \r | A carriage return |

    | \s | Name of the shell program |

    | \t | Current time in 24-hour, hours:minutes:seconds format |

    | \T | Current time in 12-hour format |

    | \@ | Current time in 12-hour, AM/PM format |

    | \A | Current time in 24-hour, hours:minutes format |

    | \u | Username of the current user |

    | \v | Version number of the shell |

    | \V | Version and release numbers of the shell |

    | \w | Name of the current working directory |'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# Table 13-1 (continued)


    | Sequence | Value Displayed |

    | \W | Last part of the current working directory name |

    | ! | History number of the current command |

    | # | Number of commands entered during this shell session |

    | $ | This displays a "$" character unless you have superuser privileges. In that
    case, it displays a "#" instead. |

    | \[ | This signals the start of a series of one or non-printing characters. It
    is used to embed non-printing control characters that manipulate the terminal
    emulator in some way, such as moving the cursor or changing text colors. |

    | \] | This signals the end of a non-printing character sequence.


    # Trying Some Alternative Prompt Designs


    With this list of special characters, we can change the prompt to see the effect.
    First, we''ll back up the existing string so we can restore it later. To do this,
    we will copy the existing string into another shell variable that we create:


    ```

    [linuxbox ~] $ ps1_old="PS1"

    ```


    We create a new variable called ps1_old and assign the value of PS1 to it. We
    can verify that the string has been copied by using the echo command:


    ```

    [linuxbox ~] echo ps1_old

    [\u\h w\]

    ```


    We can restore the original prompt at any time during our terminal session by
    simply reversing the process:


    ```

    [linuxbox ~] PS1="ps1_old"

    ```


    Now that we are ready to proceed, let''s see what happens if we have an empty
    prompt string:


    ```

    [linuxbox ~] PS1=

    ```


    If we assign nothing to the prompt string, we get nothing. No prompt string at
    all! The prompt is still there but displays nothing, just as we asked it to. Since
    this is kind of disconcerting to look at, we''ll replace it with a minimal prompt:


    ```

    PS1="\$

    ```'
  merge: -1
  img_proc: true
- pgno: 173
  md: "That's better. At least now we can see what we are doing. Notice the trailing\
    \ space within the double quotes. This provides the space between the dollar sign\
    \ and the cursor when the prompt is displayed.\n\nLet's add a bell to our prompt:\n\
    \n```\n$ PS1=\\a\\$\n```\n\nNow we should hear a beep each time the prompt is\
    \ displayed. This could get annoying, but it might be useful if we needed notification\
    \ when an especially long-running command has been executed.\n\nNext, let's try\
    \ to make an informative prompt with some hostname and time-of-day information:\n\
    \n```\n$ PS1=\\A h \\$ \n17:33 linux $\n```\n\nAdding time-of-day to our prompt\
    \ will be useful if we need to keep track of when we perform certain tasks. Finally,\
    \ we will make a new prompt that is similar to our original:\n\n```\n17:37 linuxbox\
    \ PS1=\"\\u@h \\w\\$\"\n<me@linuxbox ~>\n```\n\nTry out the other sequences listed\
    \ in Table 13-1 and see if you can come up with a brilliant new prompt.\n\n# Adding\
    \ Color\n\nMost terminal emulator programs respond to control certain non-printing\
    \ character sequences to control such things as character attributes (like color,\
    \ bold text, and the dreaded blinking text) and cursor position. We'll cover cursor\
    \ position in a little bit, but first we'll look at color.\n\n# TERMINAL CONFUSION\n\
    \nBack in ancient times, when terminals were hooked to remote computers, there\
    \ were many competing brands of terminals and they all worked differently. They\
    \ had different keyboards, and they all had different ways of interpreting control\
    \ information. Unix and Unix-like systems have two complex subsystems (called\
    \ termcap and terminfo) to deal with the babel of terminal control. If you look\
    \ into the deepest recesses of your terminal emulator, you may find a setting\
    \ for the type of terminal emulation.\n\nIn an effort to make terminals speak\
    \ some of common language, the American National Standards Institute (ANSI) developed\
    \ a standard set of character sequences to control video terminals. Old-time DOS\
    \ users remember the ANSI.SYS file that was used to enable interpretation of these\
    \ codes."
  merge: -1
  img_proc: true
- pgno: 174
  md: 'Character color is controlled by sending the terminal emulator an ANSI escape
    code embedded in the stream of characters to be displayed. The control code does
    not "print out" on the display; rather it is interpreted by the terminal as an
    instruction. As we saw in Table 13-1, the \\ and \ sequences are used to encapsulate
    non-printing characters. An ANSI escape code begins with an octal 033 (the code
    generated by the esc key), followed by an optional character attribute, followed
    by an instruction. For example, the code to set the text to normal (attribute
    = 0) is \\033[0;30m.


    Table 13-2 lists available text colors. Notice that the colors are divided into
    two groups, differentiated by the application of the bold character attribute
    (1), which creates the appearance of "light" colors.


    # Table 13-2: Escape Sequences Used to Set Text Colors


    | Sequence | Text Color |

    | --- | --- |

    | \033[0;30m] | Black |

    | \033[0;31m] | Red |

    | \033[0;32m] | Green |

    | \033[0;33m] | Brown |

    | \033[0;34m] | Blue |

    | \033[0;35m] | Purple |

    | \033[0;36m] | Cyan |

    | \033[0;37m] | Light Gray |

    | \033[1;30m] | Dark Gray |

    | \033[1;31m] | Light Red |

    | \033[1;32m] | Light Green |

    | \033[1;33m] | Yellow |

    | \033[1;34m] | Light Blue |

    | \033[1;35m] | Light Purple |

    | \033[1;36m] | Light Cyan |

    | \033[1;37m] | White |


    Let''s try to make a red prompt (here as gray). We''ll insert the escape code
    at the beginning:


    ```

    <me@linuxbox ~$ PS1="[\033[0;31m]\u@\h \w\$

    <me@linuxbox ~$>

    ```'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'That works, but notice that all the text we type after the prompt is also red.
    To fix this, we will add another escape to the end of the prompt that tells the
    terminal emulator to return to the previous color:


    ```

    <linuxbox>~$ PS1=\\\[033[0;31m\]u\@h W\$\[033[0m\"

    <linuxbox>~$"

    ```


    That''s better!

    It''s also possible to set the background color using the codes in Table 13-3.
    The background colors do not support the bold attribute.


    # Table 13-3: Escape Sequences Used to Set Background Color


    | Sequence | Background Color |

    |--- | --- |

    | \033[0;40m] | Black |

    | \033[0;41m] | Red |

    | \033[0;42m] | Green |

    | \033[0;43m] | Brown |

    | \033[0;44m] | Blue |

    | \033[0;45m] | Purple |

    | \033[0;46m] | Cyan |

    | \033[0;47m] | Light Gray |


    We can create a prompt with a red background by applying a simple change to the
    first escape code:


    ```

    <linuxbox>~$ PS1=\\\[033[0;41m\]u\@h W\$\[033[0m\"

    <linuxbox>~$"

    ```


    Try the other codes and see what you can create!

    Note: Besides the normal (0) and bold (1) character attributes, text may also
    be given under-score (4), blinking (5), and inverse (7) attributes. In the interests
    of good taste, many terminal emulators refuse to honor the blinking attribute.


    # Moving the Cursor


    Escape codes can be used to position the cursor. This is commonly used to provide
    a clock or some other kind of information at a different location on the screen,
    such as an upper corner, each time the prompt is drawn. Table 13-4 lists the escape
    codes that position the cursor.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# Table 13-4: Cursor Movement Escape Sequences


    | Escape Code | Action |

    | --- | --- |

    | \033[1;cH | Move the cursor to line 1 and column c. |

    | \033[nA | Move the cursor up n lines. |

    | \033[nB | Move the cursor down n lines. |

    | \033[nC | Move the cursor forward n characters. |

    | \033[nD | Move the cursor backward n characters. |

    | \033[2J | Clear the screen and move the cursor to the upper-left corner (line
    0, column 0). |

    | \033[K | Clear from the cursor position to the end of the line. |

    | \033[s | Store the stored cursor position. |

    | \033[u | Recall the stored cursor position. |


    Using these codes, we''ll construct a prompt that draws a red bar at the top of
    the screen containing a clock (rendered in yellow text) each time the prompt is
    displayed. The code for the prompt is this formidable looking string:


    ```

    PS1="\033[s\033[0;0H\033[0;41m\033[1;33mT\033[0m\033[u]\w@\h \\w\$$

    ```


    Table 13-5 takes a look at each part of the string to see what it does.


    # Table 13-5: Breakdown of Complex Prompt String


    | Sequence | Action |

    | --- | --- |

    | \[ | Begins a non-printing character sequence. The real purpose of this is to
    allow bash to correctly calculate the size of the visible prompt. Without this,
    command line editing features will improperly position the cursor. |

    | \033[s | Store the cursor position. This is needed to return to the prompt location
    after the bar and clock have been drawn at the top of the screen. Be aware that
    some terminal emulators do not honor this code. |

    | \033[0;0H | Move the cursor to the upper-left corner, which is line 0, column
    0. |

    | \033[0;41m | Set the background color to red. |'
  merge: -1
  img_proc: true
- pgno: 177
  md: '| Table 13-5 (continued) |

    | Sequence | Action |

    | \u033[K | Clear from the current cursor location (the top-left corner) to the
    end of the line. Since the background color is now red, the line is cleared to
    that color, creating our bar. Note that clearing to the end of the line does not
    change the cursor position, which remains at the upper-left corner. |

    | \u033[1;33m | Set the text color to yellow. |

    | \t | Display the current time. While this is a "printing" element, we still
    include it in the non-printing position of the prompt, because we don''t want
    bash to include the clock when calculating the true size of the displayed prompt.
    |

    | \u033[Om | Turn off color. This affects both the text and the background. |

    | \u033[u | Restore the cursor position saved earlier. |

    | \ | End the non-printing characters sequence. |

    | \u@\h \W$ | Prompt string. |


    # # Saving the Prompt


    Obviously, we don''t want to be typing that monster all the time, so we''ll want
    to store our prompt somewhere. We can make the prompt permanent by adding it to
    our .bashrc file. To do so, add these lines to the file:


    ```

    PS1="\u0333[s\u0333[0;0H\u0333[0;41m\u0333[1;33m\t\u0333[0m\u0333[\u@\h \W$"

    export PS1

    ```


    # # Final Note


    Believe it or not, much more can be done with prompts involving shell functions
    and scripts that we haven''t covered, but this is a good start. Not everyone will
    care enough to change the prompt, since the default prompt is usually satisfactory.
    But for those of us who like to tinker, the shell provides provides an opportunity
    for many hours of trivial fun.'
  merge: -1
  img_proc: true
