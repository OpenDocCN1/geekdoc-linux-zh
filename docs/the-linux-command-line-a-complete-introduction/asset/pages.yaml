    PATH is not used. If the directory is not found, the shell option ‘cd’ is set
    to then the word as a variable name. If that variable has a value, then cd to
    the value of that variable. The -P option says to use the physical directory structure
    instead of symbolic links; the -L option follows symbolic links to be followed.


    > A note on notation: When square brackets appear in the description of a command’s
