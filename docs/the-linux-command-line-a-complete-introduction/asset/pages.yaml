- pgno: 132
  md: 'Note: If your system does not include the xlogo program, try using gedit or
    kwrite instead.


    We can verify that xlogo is running by resizing its window. If the logo is redrawn
    in the new size, the program is running.


    Notice how our shell prompt has not returned? This is because the shell is waiting
    for the program to finish, just like all the other programs we have used so far.
    If we close the xlogo window, the prompt returns.


    # Interrupting a Process


    Let''s observe what happens when we run xlogo again. First, enter the xlogo command
    and verify that the program is running. Next, return to the terminal and press
    CTRL-C.


    ```

    ~linuxbox ~ $ xlogo

    ~linuxbox ~$

    ```


    In a terminal, pressing CTRL-C interrupts a program. This means that we politely
    asked the program to terminate. After we pressed CTRL-C, the xlogo window closed
    and the shell prompt returned.


    Many (but not all) command-line programs can be interrupted by using this technique.


    # Putting a Process in the Background


    Let''s say we want to get the shell prompt back without terminating the xlogo
    program. We''ll do this by placing the program in the background. Think of the
    terminal as having a foreground (with stuff visible on the surface, the shell
    prompt) and a background (with hidden stuff below the surface). To launch a program
    so that it is immediately placed in the background, we follow the command with
    an ampersand character (&):


    ```

    ~linuxbox ~ $ xlogo &

    [1] 28236

    ~linuxbox ~$

    ```


    After the command was entered, the xlogo window appeared and the shell prompt
    returned, but some numbers were printed too. This message is part of a shell feature
    called job control. With this message, the shell is telling us that we have started
    job number 1 ([1]) and that it has PID 28236. If we run ps, we can see our process:


    ```

    ~linuxbox ~ $ ps

    PID TTY TIME CMD

    10603 pts/1 00:00:00 bash

    28236 pts/1 00:00:00 xlogo

    28239 pts/1 00:00:00 ps

    ```'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'The shell''s job control facility also gives a way to list the jobs that have
    been launched from our terminal. Using the jobs command, we can see the following
    list:


    ```

    me@linuxbox ~$ jobs

    [1]+ Running xlogo &

    ```


    The results show that we have one job, numbered 1, that it is running, and that
    the command was xlogo &


    # Returning a Process to the Foreground


    A process in a background is immune to keyboard input, including any attempt to
    interrupt it with a CTRL-C. To return a process to the foreground, we use the
    fg command, as in this example:


    ```

    me@linuxbox ~$ jobs

    [1]+ Running xlogo &

    me@linuxbox ~$ fg %1

    xlogo

    ```


    The command fg followed by a percent sign and the job number (called a jobspec)
    does the trick. If we have only one background job, the jobspec is optional. To
    terminate xlogo, type CTRL-C.


    # Stopping (Pausing) a Process


    Sometimes we''ll want to stop a process without terminating it. This is often
    done to allow a foreground process to be moved to the background. To stop a foreground
    process, type CTRL-Z. Let''s try it. At the command prompt, type the ENTER key,
    and then type CTRL-Z:


    ```

    me@linuxbox ~$ xlogo

    [1]+ Stopped xlogo

    me@linuxbox ~$

    ```


    After stopping xlogo, we can verify that the program has stopped by attempting
    to resize the xlogo window. We will see that it appears dead. We can restore the
    process to the foreground, using the fg command, or move the process to the background
    with the bg command:


    ```

    me@linuxbox ~$ bg %1

    [1]+ xlogo &

    me@linuxbox ~$

    ```


    As with the fg command, the jobspec is optional if there is only one job. Moving
    a process from the foreground to the background is handy if we launch a graphical
    program from the command but forget to place it in the background by appending
    the trailing &.'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'Why would you want to launch a graphical program from the command line? There
    are two reasons. First, the program you wish to run might not be listed on the
    window manager''s menus (as xlogo)

    Second, by launching a program from the command line, you might be able to see
    error messages that would be invisible if the program were launched graphically.
    Sometimes, a program will fail to start up when launched from the graphical menu.
    By launching it from the command line instead, we may see an error message that
    will reveal the problem. Also, some programs have many interesting and useful
    command-line options.


    # # Signals


    The kill command is used to "kill" (terminate) processes. This allows us to end
    the execution of a program that is behaving badly or otherwise refuses to terminate
    on it. Here''s an example:


    ```

    ```

    me@linux~$ xlogo &

    [1] 28401

    me@linux~$ kill 28401

    [1]+ Terminated

    ```

    ```


    We launch xlogo in the background. The shell prints the jobspec and the PID of
    the background process. Next, we the kill command and specify the PID of the process
    we want to terminate. We could also have specified the process using a jobspec
    (for example, %1) instead of a PID.


    While this is all very straightforward, there is more to it. The kill command
    doesn''t exactly "kill" processes; rather it sends them signals. We have already
    seen signals in action with the use of CTRL-C and CTRL-Z. When the terminal receives
    one of these keystrokes, it sends a signal to the program in the foreground. In
    the case of CTRL-C, a signal called INT (Interrupt) is sent; a signal called TSTP
    (Terminal Stop) is sent. Programs, in turn, can "listen" for signals and act upon
    them as they are received. The fact that a program can listen and act upon signals
    allows us to do things like save work in progress when it is a termination signal.


    # # Sending Signals to Processes with kill


    The common syntax for the kill command looks like this:


    ```

    ```

    kill [-signal] PID...

    ```

    ```


    If no signal is specified on the command line, then the TERM (Terminate) signal
    is sent by default. The kill command is most often used to send the signals shown
    in Table 10-4.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# Table 10-4: Common Signals


    | Number | Name | Meaning |

    | 1 | HUP | Hang up. This is a vestige of the good old days when terminals were
    attached to remote computers with phone lines and modems. The signal is used to
    indicate programs that the controlling terminal has "hung up." The effect of this
    signal can be demonstrated by closing a terminal session. The foreground program
    running on the terminal will be sent the signal and terminate. This signal is
    also used by many daemon programs to cause a reinitialization. This means when
    a daemon is sent this signal, it will restart and reload its configuration file.
    The Apache web server is an example of a daemon that uses the HUP signal in this
    way. |

    | 2 | INT | Interrupt. Performs the same function as the CTRL-C key sent from
    the terminal. It will usually terminate a program. |

    | 9 | KILL | Kill. This signal is special. Whereas programs may choose to handle
    signals sent to them in different ways, by ignoring them altogether, the KILL
    signal is never actually sent to the target program. Rather, the kernel immediately
    terminates the process. When a process is terminated in this manner, it is given
    no opportunity to "clean up" after itself or save its work. For this reason, the
    KILL signal should be used only as a last resort when other termination signals
    fail. |

    | 15 | TERM | Terminate. This is the default signal sent by the kill command.
    If a program is still "alive" enough to receive signals, it will terminate. |

    | 18 | CONT | Continue. This will restore a process after a STOP signal. |

    | 19 | STOP | Stop. This signal causes a process to pause without terminating.
    Like the KILL signal, it is not sent to the target process, and thus it cannot
    be ignored. |'
  merge: -1
  img_proc: true
