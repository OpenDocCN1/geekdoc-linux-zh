    In order to fully explore grep, let''s create some text files to search:


    ```

    me[linuxbox ~]$ ls /bin > distlist-bin.txt

    me[linuxbox ~]$ ls /usr/bin > distlist-usr-sbin.txt

    me[linuxbox ~]$ ls /bin > distlist-sbin.txt

