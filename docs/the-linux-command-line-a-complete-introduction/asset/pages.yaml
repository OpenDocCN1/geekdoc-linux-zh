- pgno: 205
  md: '# Extra Credit


    It''s often useful to verify the integrity of an ISO image that we have downloaded.
    In most cases, a distributor of an ISO image will also supply a check-sum file.
    A checksum is the result of an exotic mathematical calculation resulting in a
    number that represents the content of the target file. The contents of the file
    change by even one bit, the resulting checksum will be much different. The most
    common method of checksum generation uses the md5sum program. When you use md5sum,
    it produces a unique hexadecimal number:


    ```

    md5sum image.iso

    3e4354760f9bb7fb8c96f63f94ece image.iso

    ```


    After you download an image, you should run md5sum against it and compare the
    results with the md5sum value supplied by the publisher.

    Addition to checking the integrity of a downloaded file, we can use md5sum to
    verify newly optical media. To do this, we first calculate the checksum of the
    image file and then calculate a checksum for the medium. The trick to verifying
    the medium is to limit the calculation to only the portion of the optical medium
    that contains the image. We do this by determining the number of 2048-byte blocks
    the image contains (optical media is always written in 2048-byte blocks) and reading
    that many blocks from the medium. On some types of media, this is not required.
    A CD-R written in disc-at-once mode can be checked this way:


    ```

    md5sum /dev/cdrom

    3e4354760f9bb7fb8c96f63f94ece /dev/cdrom

    ```


    Many types of media, such as DVDs, require a precise calculation of the number
    of blocks. In the example below, we check the integrity of the image file dvd-image.iso
    and the disc in the DVD reader /dev/dvd. Can you figure out how this works?


    ```

    md5sum dvd-image.iso; dd if=/dev/dvd bs=2048 count=$($(stat -c "%s" dvd-image.iso)
    / 2048 )) | md5sum

    ```'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# 16


    # NETWORKING


    When it comes to networking, there is probably nothing that cannot be done with
    Linux. Linux is used to build all sorts of networking systems and appliances,
    including firewalls, routers, name servers, NAS (network-attached storage) boxes,
    and on and on.


    Just as the subject of networking is vast, so is the number of commands that can
    be used to configure and control it. We will focus our attention on just a few
    of the most frequently used ones. The commands chosen for examination include
    those to monitor networks and those used to transfer files. In addition, we are
    going to explore the sdb program, which is used to perform remote logins. This
    chapter will cover the following:


    +   * ping—Send an ICMP ECHO_REQUEST to network hosts.

    * traceroute—Print the route packets trace to a network host.

    * netstat—Print network connections, routing tables, interface statistics, masquerade
    connections, and multicast memberships.

    * ftp—Internet file transfer program.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '+   - lftp—Improved Internet file transfer program.

    - wget—Non-interactive network downloader.

    - ssh—OpenSSH SSH client (remote login program).

    - scp—Secure copy (remote file copy program).

    - sftp—Secure file transfer program.


    We’re going to assume a little background in networking. In this, the Internet
    age, everyone using a computer needs a basic understanding of networking concepts.
    To make full use of this chapter, you should be familiar with the following:


    +   - IP (Internet protocol)

    - Host and domain name

    - URI (uniform resource identifier)


    > Note: Some of the commands we will cover (depending on your distribution) require
    the installation of additional packages from your distribution’s repositories,
    and some may require superuser privileges to execute.


    # Examining and Monitoring a Network


    Even if you’re not the system administrator, it’s often helpful to examine the
    performance and operation of a network.


    ping—Send a Special Packet to a Network Host


    The most basic network command is ping. The ping command sends a special network
    packet called ICMP ECHO_REQUEST to a specified host. Most network devices receiving
    this packet will reply to it, allowing the network connection to be verified.


    > Note: It is possible to configure network devices (including Linux hosts) to
    ignore these packets. This is usually done for security reasons, to partially
    obscure a host from a potential attacker. It is also common for firewalls to be
    configured to block ICMP traffic.


    For example, to see if we can reach http://www.linuxcommand.org/ (one of my favorite
    sites;), we can use ping like this:


    ```

    @linuxbox]$ ping linuxcommand.org

    ```


    Once started, ping continues to send packets at a specified interval (default
    is 1 second) until it is interrupted:


    ```

    @linuxbox]$ ping linuxcommand.org

    PING linuxcommand.org (66.35.210) 56(84) bytes of data.

    ```'
