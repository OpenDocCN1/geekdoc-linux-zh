  md: '# 26


    # TOP-DOWN DESIGN


    As programs get larger and more complex, they become more difficult to design,
    code, and maintain. As with any large project, it is often a good idea to break
    large, complex tasks into a series of small, simple tasks.


    Let''s imagine that we are trying to describe a common, everyday task—going to
    the market to buy food—to a person from Mars. We might describe the overall process
    as the following steps:


    +   1. Get in car.

    2. Drive to market.

    3. Park car.

    4. Enter market.

    5. Purchase food.

    6. Return to car.

    7. Drive home.

    8. Park car.

    9. Enter house.'
  merge: -1
  img_proc: true
- pgno: 357
  md: 'However, a person from Mars is likely to need detail. We could further break
    down the subtask “Park car” into another series of steps.


    +   1. Find parking space.

    4. Set parking brake.

    2. Drive into car space.

    5. Exit car.

    3. Turn off motor.

    6. Lock car.


    The “Turn off motor” subtask could be broken down into steps including “Turn off
    ignition,” “Remove ignition key,” and so on, until every step of the process of
    going to the market has been fully defined.

    This process of identifying the top-level steps and developing increasingly detailed
    views of those steps is called top-down design. This technique allows us to break
    large, complex tasks into many small, simple tasks. Top-down design is a common
    method of designing programs and one that is well suited to simple programming
    in particular.


    In this chapter, we will use top-down design to further develop our report-generator
    script.


    # # Shell Functions


    Our script currently performs the following steps to generate the HTML document:


    +   1. Open page.

    6. Output page heading.

    2. Open page header.

    7. Output timestamp.

    3. Set page title.

    8. Close page body.

    4. Close page header.

    9. Close page.

    5. Open page body.


    For our next stage of development, we will add some tasks between steps 7 and
    8. These will include:


    +   * System uptime and load. This is the amount of time since the last shut-down
    or reboot and the average number of tasks currently running on the processor over
    several intervals.

    * Disk space. The overall use of space on the system’s storage space.

    * Home space. The amount of storage space being used by each user.


    If we had a command for each of these tasks, we could add them to our script simply
    through command substitution:


    ```

    #!/bin/bash


    # Program to output a system information page

    TITLE="System Information Report For $HOSTNAME"

    ```'
