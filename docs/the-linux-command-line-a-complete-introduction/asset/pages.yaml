    # Editing on the Fly


    Our experience with text editors has been largely interactive, meaning that we
    manually move a cursor around and type our changes. However, there are non-interactive
    ways to edit text as well. It''s possible, for example, to apply a set of changes
    to multiple files with a single command.


    # Tr-Transliterate or Delete Characters


    The tr program is used to transliterate characters. We can think of this as a
    sort of character-based search-replace operation. Transliteration is the process
    of changing characters from one alphabet to another. For example, converting characters
    from lowercase to uppercase is transliteration. We can perform such conversion
    with tr as follows:


    ```

    me@linux]$ echo "lowercase letters" | tr a-z A-Z

    LOWERCASE LETTERS

    ```


    As we can see, tr operates on standard input and outputs its results on standard
    output. tr accepts two arguments: a set of characters to convert from and a corresponding
    set of characters to convert. Character sets may be expressed in one of three
    ways:


    +   - An enumerated list; for example, ABCDEFGHIJKLMNOPQRSTUVWXYZ.

    - A character range; for example, A-Z. Note that this method is subject to the
    same issues as other commands (due to the locale collation order) and should be
    used with caution.

    - POSIX character classes; for example, [:upper:].


    In most cases, the character sets should be of equal length; however, it''s possible
    for the first set to be larger than the second, particularly if we wish to convert
    multiple characters to a single character:


    ```

    me@linux]$ echo "lowercase letters" | tr [:lower:] A

    AAAAAAAAAAAAAAAAAAA

    ```


    In transliteration, tr allows characters to simply be deleted from the input stream.
    Earlier in this chapter, we discussed the problem of converting MS-DOS text files
    to Unix-style text. To perform this conversion, carriage return characters need
    to be removed from the end of each line. This can be performed with tr as follows:


    ```

    tr -d ''\r'' < dos_file > unix_file

    ```'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'where dos_file is the file to be converted and unix_file is the result. This
    form of the command uses the escape sequence \r to represent the carriage return.
    To see a complete list of the sequences and character classes tr supports, try


    ```

    me@linuxbox ~]$ tr -help

    ```


    # ROT13: THE NOT-SO-SECRET DECODER RING


    One use of tr is to perform ROT13 encoding of text. ROT13 is a trivial type of
    encoding based on a simple substitution cipher. Calling ROT13 encryption is generous;
    text obfuscation is more accurate. It is sometimes on text to obscure potentially
    offensive content. The method simply moves every character 13 places up the alphabet.
    Since this is halfway through the 26 characters, performing the algorithm a second
    time on the text restores it to its original form. To perform this encoding with
    tr:


    ```

    echo "secret text" | tr a-A-Z n-za-MN-ZA-M

    frperg gkg

    ```


    Performing the same procedure a second time results in the translation:


    ```

    echo "frperg gkg" | tr a-A-Z n-za-MN-ZA-M

    secret text

    ```


    A number of email programs and Usenet news readers support ROT13 encoding. Wikipedia
    contains a good article on the subject: http://en.wikipedia.org/wiki/ROT13.


    tr can perform another trick, too. Using the -s option, tr can "squeeze"

    (delete) repeated instances of a character:


    ```

    me@linuxbox ~]$ echo "aaabbbcc" | tr -s ab

    abcabc

    ```


    We have a string containing repeated characters. By specifying the set ab to tr,
    we eliminate the repeated instances of the letters in the set, while leaving the
    character that is missing from the set (c) unchanged. Note that the repeating
    characters must be adjoining. If they are not, the squeeze will have no effect:


    ```

    me@linuxbox ~]$ echo "abcabc" | tr -s ab

    ababcabc

    ```'
  merge: -1
  img_proc: true
