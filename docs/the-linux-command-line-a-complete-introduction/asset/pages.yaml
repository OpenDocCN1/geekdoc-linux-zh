- pgno: 353
  md: 'a body of text into our script and feed it into the standard input of a command.
    It works like this:


    ```

    command << token

    text

    token

    ```


    where command is the name of a command that accepts standard input and token is
    a string used to indicate the end of the embedded text. We''ll modify our script
    to use a here document:


    ```

    #!/bin/bash

    ```


    # Program to output a system information page


    ```

    TITLE="System Information Report For $HOSTNAME"

    CURRENT_TIME=$(date +"%x %Z")

    TIME_STAMP="Generated" by $USER

    ```


    ```

    cat << _EOF_

    <HTML>

    <HEAD>

    <TITLE>$TITLE</TITLE>

    </HEAD>

    <body>

    <h1>$TITLE</h1>

    <p>$TIME_STAMP</p>

    </body>

    </HTML>

    _EOF_

    ```


    Instead of using echo, our script now uses cat and a here document. The string
    _EOF_ (meaning end-of-file, a common convention) was selected as the token and
    marks the end of the embedded text. Note that there must no trailing spaces on
    the line.


    So what''s the advantage of using a here document? It''s mostly the same as echo,
    except that by default, single and double quotes within here documents lose their
    meaning to the shell. Here is a command-line example:


    ```

    me@linux ~$ foo="some text"

    me@linux ~$ cat << _EOF_

    $foo

    "foo"

    ''$foo''

    \foo

    _EOF_

    some text

    "some text"

    ''some text''

    $foo

    ```


    As we can see, the shell pays no attention to the quotation marks. It treats them
    as ordinary characters. This allows us to embed quotes freely within a here document.
    This could turn out to be handy for our report program.'
