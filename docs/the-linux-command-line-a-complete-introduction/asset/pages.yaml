    ```


    And there we have it!


    # Final Note


    In this chapter, we have seen how three simple commands—./configure, make, make
    install—can be used to build many source code packages. We have also seen the
    important role that make plays in the maintenance of programs. The make program
    can be used for any task that needs to maintain a target/dependency relationship,
    not just for compiling source code.'
