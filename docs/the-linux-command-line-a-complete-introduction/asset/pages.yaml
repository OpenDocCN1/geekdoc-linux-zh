- pgno: 360
  md: "the use () of shell functions. Inside shell functions, it is often desirable\
    \ to have local variables. Local variables are accessible only within the shell\
    \ function in which they are defined, and they cease to exist once the shell function\
    \ terminates.\n\nHaving local variables allows the programmer to use variables\
    \ with names that may already exist, either in the script globally or in other\
    \ shell functions without having to worry about potential name conflicts.\n\n\
    Here is an example script that demonstrates how local variables are defined and\
    \ used:\n\n```\n#!/bin/bash\n# local-vars: script to demonstrate local variables\n\
    \nfoo=0      # global variable foo\n\nfunct_1 () {\n    local foo      # variable\
    \ foo local to funct_1\n    foo=1\n    echo \"funct_1: foo = $foo\"\n}\n\nfunct_2\
    \ () {\n    local foo      # variable foo local to funct_2\n    foo=2\n    echo\
    \ \"funct_2: foo = $foo\"\n}\n\necho \"global: foo = $foo\"\nfunct_1\necho \"\
    global: foo = $foo\"\nfunct_2\necho \"global: foo = $foo\"\n```\n\nAs we can see,\
    \ local variables are defined by preceding the variable name with the word local.\
    \ This creates a variable that is local to the shell function in which it is defined.\
    \ Once the script exits the shell function, the variable no longer exists. When\
    \ we run this script, we see the results:\n\n```\n[me@linux~$] local-vars\nglobal:\
    \ foo = 0\nfunct_1: foo = 1\nglobal: foo = 0\nfunct_2: foo = 2\nglobal: foo =\
    \ 0\n```\n\nWe see that the assignment of values to the local variable foo within\
    \ both shell functions has no effect on the value of foo outside the functions.\n\
    \nThis feature allows shell functions to be written so that they remain independent\
    \ of each other and of the script in which they appear."
  merge: -1
  img_proc: true
