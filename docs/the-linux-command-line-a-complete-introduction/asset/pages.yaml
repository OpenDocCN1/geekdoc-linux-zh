- pgno: 306
  md: 'In this example, we employ the -l option (for page length) and the -w option
    (page width) to define a “page” that is 65 characters wide and 15 lines long.
    pr formats the contents of the distros.txt file, separates each page with several
    lines of whitespace, and creates a default header containing the file modification
    time, filename, and page number. The pr program provides many options to control
    page layout. We''ll take a look at more of them in Chapter 22.


    # printf—Format and Print Data


    Unlike the other commands in this chapter, the printf command is not used for
    pipelines (it does not accept standard input), nor does it frequent application
    directly on the command line (it''s used mostly in scripts). So why is it important?
    Because it is widely used.

    printf (from the phrase formatted) was originally developed for the C programming
    language and has been implemented in many programming languages, including the
    shell. In fact, in bash, printf is a built-in.

    printf works like this:


    ```

    printf ~format~ arguments

    ```


    The command is given a string containing a format description, which is then applied
    to a list of arguments. The formatted result is sent to standard output. Here
    is a trivial example:


    ```

    [me@linux~$]$ printf "I formatted the string: %s\n"

    Formatted the string: foo

    ```


    The format string may contain literal text (like I formatted the string); escape
    sequences (such as \n, a newline character) and begins with the % character, which
    are called conversion specifications. In the example above, the conversion specification
    % is used to format the string foo and place it in the command''s output. Here
    it is again:


    ```

    [me@linux~$]$ printf "I formatted %s" as a string.\n"

    Formatted ''foo'' as a string.

    ```


    As we can see, the % conversion specification is replaced by the string foo in
    the command''s output. The s conversion is used to format string data. There are
    other specifiers for other kinds of data. Table 21-4 lists them.


    # Table 21-4: Common printf Data-Type Specifiers


    | Specifier | Description |

    |---|---|

    | d | Format a number as a signed decimal integer |

    | f | Format and output a floating point number |


    (continued)'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# Table 21-4 (continued)


    | Specifier | Description |

    |---|---|

    | o | Format an integer as an octal number. |

    | s | Format a string. |

    | x | Format an integer as a hexadecimal number using lowercase a–f needed. |

    | X | Same as x, but use uppercase letters. |

    | % | Print a literal %%% symbol (i.e., specify "%%\ |


    We’ll demonstrate the effect of each the conversion specifiers on the string 380:


    ```

    me[linuxbox~]$ printf("%d, %f, %o, %s, %x, %%n\n" 380 380 380 380 380.000000,574,380,17C

    ```


    Since we six conversion specifiers, we must also supply six arguments for printf
    to process. The six results show the effect of each specifier.

    Several optional components may be added to the conversion specifier to adjust
    its output. A complete conversion specification may consist of the following:

    %%[flags][width][.precision]conversion_specification

    Multiple optional components, when used, must appear in the order specifier above
    to be properly interpreted. Table 21-5 describes each component.


    # Table 21-5: printf Conversion-Specification Components


    | Component | Description |

    |---|---|

    | flags | There are five different flags:

    * # Use the alternate format for output. This varies by data type. For o (octal
    number) conversion, the output is prefixed with o (zero). For x and X (hexadecimal
    number) conversions, the output is prefixed with x or X respectively.

    * **0 (zero)** Pad the output with zeros. This means the field will be filled
    with leading zeros, as in 00380.

    * - (dash) Left-align the output. By default, printf right-aligns output.

    * **(space)** Produce a leading space for positive numbers.

    * + (plus sign) Sign positive numbers. By default, printf signs only negative
    numbers |'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# Table 21-5 (continued)


    | Component | Description |

    | --- | --- |

    | width | A number specifying the minimum field width |

    | .precision | For floating-point numbers, specify the number of digits of precision
    to be output after the decimal point. For string conversion, *precision* specifies
    the number of characters to output. |


    Table 21-6 lists some examples of different formats in action.


    # Table 21-6: print Conversion Specification Examples


    | Argument | Format | Result | Notes |

    | --- | --- | --- | --- |

    | 380 | "%d" | 380 | Simple formatting of an integer |

    | 380 | "%#x" | 0x17c | Integer formatted as a hexadecimal number using the alternate
    format flag |

    | 380 | "%05d" | 00380 | Integer formatted with leading zeros (padding) and a
    minimum field width of five characters |

    | 380 | "%05.5f" | 380.00000 | Number formatted as a floating-point number with
    padding and 5 decimal places of precision. Since the specified minimum field width
    (5) is less than the actual width of the number, the padding has no effect. |

    | 380 | "%10.5f" | 0380.00000 | Increasing the minimum field width to 10 makes
    the padding visible. |

    | 380 | "%+d" | +380 | The + flag signs a positive number |

    | 380 | "-%d" | 380 | The - flag left-aligns the formatting. |

    | abcdefgh | "%5s" | abcdefgh | A string is formatted with a minimum field width.
    |

    | abcdefgh | "%.5s" | abcde | By applying precision to a string, it is truncated.
    |'
