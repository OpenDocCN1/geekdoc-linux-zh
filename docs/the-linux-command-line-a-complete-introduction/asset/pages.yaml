- pgno: 168
  md: '# Saving Our Work


    Like everything else in vi, there are several ways to save our edited files. We
    have already covered the ex command :w, but there are some others we may also
    find helpful.


    In command mode, ZZ will save the current file and exit vi. Likewise, the ex command
    :w will combine the :w and :q commands into one that will both save the file and
    the exit.


    The :w command may also specify an optional filename. For example, if we were
    editing foo.txt and wanted to save As As command, or an alternative version called
    foo1.txt, we would enter the following:


    ```

    :w foo1.txt

    ```


    Note: While this saves the file under a new name, it does not change the name
    of the file you are editing. As you continue to edit, you will still be editing
    foo.txt, not foo1.txt.'
