    smaller, easier-to-manage pieces. The source code files can be examined with less:


    ```

    me@linuxbox diction-1.11]$ less diction.c

    ```


    The .h files are known as header files. These, too, are ordinary text. Header
    files contain descriptions of the routines included in a source file or library.
    In order for the compiler to connect the modules, it must receive a description
    of all the modules needed to complete the program. Near the beginning of the diction.c
    file, we see this line:


    ```

    #include "getopt.h"

    ```


    This instructs the compiler to read the file getopt.h as it reads the code in
    diction.c in order to "know" what''s in getopt.h. The getopt.c supplies routines
    that are shared by both the style and diction programs. Above the include statement
    for getopt.h, we see some other include statements such as:


    +   #include <regex.h>

    #include <stdio.h>

    #include <stdlib.h>

    #include <string.h>

    #include <unistd.h>


    These also refer to header files, but they refer to header files that live outside
    the current source tree. They are supplied by the system to support the compilation
    of every program. If we look in /usr/include, we can see them:


    ```

    me@linuxbox diction-1.11]$ ls /usr/include

    ```


    The header files in this directory were installed when we installed the compiler.


    # Building the Program


    Most programs build with a simple, two-command sequence:


    ```

    ./configure

    ```


    ```

    make

    ```


    The configure program is a shell script that is supplied with the source tree.
    Its job is to analyze the build environment. Most code is designed to be portable.
    That is, it is designed to build on more than one kind of Unix-like system. In
    order to do that, the source code may need to undergo slight adjustments during
    the build to accommodate differences between systems. configure also checks to
    that necessary external tools and components are installed.'
