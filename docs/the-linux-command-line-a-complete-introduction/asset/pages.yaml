    # Using History


    As we discovered in Chapter 1, bash maintains a history of commands that have
    been entered. This list of commands is kept in your home directory in a file called
    .bash_history. The history facility is a useful resource for reducing the amount
    of typing you have to do, especially when combined with command-line editing.'
