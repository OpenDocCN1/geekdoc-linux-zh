- pgno: 440
  md: "# Table 34-4: Bit Operators\n\n| Operator | Description |\n| ~ | Bitwise negation.\
    \ Negate all the bits in a number. |\n| << | Left bitshift. Shift all the bits\
    \ in a number to the left. |\n| >> | Right bitwise shift. Shift all the bits in\
    \ a number to the right. |\n| & | Bitwise AND. Perform an AND operation on all\
    \ the bits in two numbers. |\n| | | Bitwise OR. Perform an OR operation on all\
    \ the bits in two numbers. |\n| ^ | Bitwise XOR. Perform an exclusive OR operation\
    \ on all the bits in two numbers. |\n\nNote that there are also corresponding\
    \ assignment operators (for example, <<) for all bitwise negation.\n\nHere we\
    \ will demonstrate producing a list of powers of 2, using the bitwise shift operator:\n\
    \n```\n[me@linux~$]$ for ((i=0;i<8;++i)); do echo $((1<<i)); done\n1\n2\n4\n8\n\
    16\n32\n64\n128\n```\n\n# Logic\n\nAs we discovered in Chapter 27, the (( )) compound\
    \ command supports a variety of comparison operators. There are a few more that\
    \ can be used to evaluate logic. Table 34-5 shows the complete list.\n\n# Table\
    \ 34-5: Comparison Operators\n\n| Operator | Description |\n| <= | Less than or\
    \ equal to |\n| >= | Greater than or equal to |\n| < | Less than |\n > | Greater\
    \ than |\n| == | Equal to |\n\n(continued)"
