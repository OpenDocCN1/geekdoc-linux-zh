- pgno: 228
  md: '# Improving Efficiency


    When -exec action is used, it launches a new instance of the specified

    command each time a matching file is found. There are times when we might

    prefer to combine all of the search results and launch a single instance of

    the command. For example, rather than executing the commands like this:


    ```

    ls -1 file1

    ls -1 file2

    ```


    we may prefer to execute them this way:


    ```

    ls -1 file12

    ```


    Here we use the command to be executed only one time rather than

    multiple times. There are two ways we can do this: the traditional way, using

    the external command xargs, and the alternative way, using a new feature in

    find itself. We''ll talk about the trailing semicolon character to a plus sign,
    we activate


    By changing the semicolon character\he ability to combine the results of the search
    into an argument

    for a single execution of the desired command. Going back to this

    example:


    ```

    find ~ -type f -name "foo*" -exec ls -l ''{}'' ;\n-IWXI-XR -I 1 me 2011-10-29
    18:44 /home/me/bin/foo

    -IW-T-I-- 1 me me 2012-09-19 12:53 /home/me/foo.txt

    ```


    will execute each time to match a matching file. By changing the com-

    mand to


    ```

    find ~ -type f -name "foo*" -exec ls -l ''{}'' +\n-IWXI-XR -X 1 me 2011-10-29
    18:44 /home/me/bin/foo

    -IW-T-I-- 1 me me 2012-09-19 12:53 /home/me/foo.txt

    ```


    we get the results, however the system has to execute the ls command

    only once.


    We can also use the xargs command to get the same result. xargs accepts

    input from standard input and convert it into an argument list for a speci-

    ied command. With our example, we would use it like this:


    ```

    find ~ -type f -name "foo*" -print | xargs ls -l\n-IWXI-XR -X 1 me 2011-10-29
    18:44 /home/me/bin/foo

    -IW-T-I-- 1 me me 2012-09-19 12:53 /home/me/foo.txt

    ```


    Here we use the output of the find command piped into xargs, which, in,

    constructs an argument list and then executes it.


    Note: While the number of arguments that can be placed into a command line is
    quite large,

    it''s not unlimited. It is possible to create commands that are too long for the
    shell to

    accept. When a command exceeds the maximum length supported by the system,

    xargs executes the specified command with the maximum number of arguments pos-

    sible and repeats this process until standard input is exhausted. To see the max-\imum
    size of the command line, execute xargs with the --show-limits option.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# DEALING WITH FUNNY FILENAMES


    Unix-like systems allow embedded spaces (and even newlines!) in filenames. This
    causes problems for programs like xargs that construct argument lists for other
    programs. An embedded space will be treated as a delimiter, the resulting command
    will interpret each space-separated word argument. To overcome this, find and
    xargs allow the optional use of a null character as argument separator. A null
    character is defined in ASCII as the character represented by the zero number
    (as opposed to, for example, the space character, which is defined in ASCII as
    the character represented by the number 32). The command provides the option -print0,
    which produces null separated output, and xargs has the --null option, which accepts
    null input. Here''s an example:


    ```

    find ~ -iname ''*.jpg'' -print0 | xargs --null ls -1

    ```


    Using this technique, we can ensure that all files, even containing embedded spaces
    in their names, are handled correctly.


    # A Return to the Playground


    It''s time to put find some (almost) practical use. First, let''s create a playground
    with lots of subdirectories and files:


    ```

    me@linux ~$ mkdir -p playground/dir-{0..19},{01..99}

    me@linux ~$ touch playground/dir-{0..19},{01..99}/file-{A-Z}0{01..26}

    ```


    Marvel at the power of the command line! With two lines, we created a playground
    directory containing 100 subdirectories, each containing 26 empty files. Try that
    with the GUI!


    The method employed to accomplish this magic involved a familiar command (mkdir);
    an exotic shell expansion (braces); and a new command, touch. By combining mkdir
    with the -p option (which allows mkdir to create the parent directories of the
    specified paths) we were able to create 100 directories.


    The touch command is usually used to set or update the modification times of files.
    However, if a filename argument is that of a non-existent file, an empty file
    is created.


    In our playground, we created 100 instances of a file named file-A. Let''s find
    them:


    ```

    me@linux ~$ find playground -type f -name ''file-A''

    ```


    Note that unlike ls, find does not produce results in sorted order. The order
    is determined by the layout of the storage device. We can confirm that we actually
    have 100 instances of the file this way:


    ```

    me@linux ~$ find playground -type f -name ''file-A'' | wc -l 100

    ```'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'Next, let''s look at finding files based on their modification times. This
    will be helpful when creating backups or organizing files in chronological order.
    To do this, we will first create a reference file against which we will compare
    modification time:


    ```

    @me[linux]$ touch playground/timestamp

    ```


    This creates an empty file named timestamp and sets its modification time to the
    current time. We can verify this by using another handy command, which is a kind
    of souped-up version of ls. The command reveals all that the system understands
    about a file and its attributes:


    ```

    @me[linux]$ stat playground/timestamp

    File: ''playground/timestamp''

    Size: 0 Blocks: 0 IO Block: 4096 regular empty file

    Device: 803h/2051i Inodes: 1426506 Links: 1

    Access: (0644/rw-r--) Uid: (1001/me) Gid: (1001/me)

    Access: 2012-10-08 15:23:33.000000000 -0400

    Modify: 2012-10-08 15:23:39.000000000 -0400

    Change: 2012-10-08 15:23:39.000000000 -0400

    ```


    If we touch the file again and examine it with, we will see that the file''s times
    have been updated:


    ```

    @me[linux]$ touch playground/timestamp

    @me[linux]$ stat playground/timestamp

    File: ''playground/timestamp''

    Size: 0 Blocks: 0 IO Block: 4096 regular empty file

    Device: 803h/2051i Inodes: 1426506 Links: 1

    Access: (0644/rw-r--) Uid: (1001/me) Gid: (1001/me)

    Access: 2012-10-08 15:23:33.000000000 -0400

    Modify: 2012-10-08 15:23:33.000000000 -0400

    Change: 2012-10-08 15:23:33.000000000 -0400

    ```


    Next, let''s find to update some of our playground files:


    ```

    @me[linux]$ find playground -type f -name ''file-B'' -exec touch ''{}'' ;

    ```


    This updates all files in the playground that are named file-B. Next we will use
    find to identify the updated files by comparing all files to the reference file
    timestamp.


    ```

    @me[linux]$ find playground -type f -newer playground/timestamp

    ```


    The results contain all 100 instances of file-B. Since we touch on all the files
    in the playground that are named file-B after we updated timestamp, they are now
    ''newer'' than timestamp and thus can be identified with the -newer test.


    Finally, let''s go back to the bad permissions we performed earlier and apply
    it to playground:


    ```

    @me[linux]$ find playground (-type f -not -perm 0600 \) -or (-type d -not -perm
    0700 \)

    ```'
