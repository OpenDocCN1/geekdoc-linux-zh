- pgno: 71
  md: "# # What Exactly Are Commands?\n\nA command can be one of four things:\n\n\
    +   - **An executable program** like all those files we saw in `/usr/bin`. Within\
    \ this\ncategory, programs can be *compiled* binaries, such as programs written\
    \ in\nC and C++, or programs written in *scripting* languages, such as the shell,\n\
    Perl, Python, Ruby, and so on.\nn- **A command built into the shell itself**,\
    \ `bash` supports a number of commands internally called *shell* builtins. The\
    \ `cd` command, for example, is a\nshell builtin.\n- **A shell function**. *Shell\
    \ functions* are miniature shell scripts incorporated\ninto the environment. We\
    \ will cover configuring the environment and\nwriting shell functions in later\
    \ chapters, but for now just be aware that\nthey.\n- **An alias**. An *alias*\
    \ is a command that we can define ourselves, built from\nother commands.\n\n#\
    \ # Identifying Commands\n\nIt is often useful to know exactly which of the four\
    \ kinds of commands are\nbeing used, and Linux provides a couple of ways to find\
    \ out.\n\n# type—Display a Command’s Type\n\nThe `type` command is a shell builtin\
    \ that displays the kind of command the\nshell will execute, given a particular\
    \ command name. It works like this:\n\n```\n`type command`\n```\n\nwhere `command`\
    \ is the name of the command you want to examine. Here are\nexamples:\n\n```\n\
    [me@linux ~]$ type type\ntype is a shell builtin\n[me@linux ~]$ type ls\nis is\
    \ aliased to 'ls --color=tty'\n[me@linux ~]$ type cp\ncp is /bin/cp\n```\n\nHere\
    \ we see the results for three different commands. Notice that the ls\ncommand\
    \ (taken from a Fedora system) is actually an alias for the ls command\nwith the\
    \ `--color=tty` option added. Now we know why the output from\n is displayed in\
    \ color!"
  merge: -1
  img_proc: true
- pgno: 72
  md: '# which—Display an Executable’s Location


    Sometimes more than one version of an executable program is installed on a system.
    While this is not very common on desktop systems, it''s not unusual on large servers.
    To determine the exact location of a given executable, this command is used:


    ```

    [me@linuxbox ~]$which ls

    /bin/ls

    ```


    which works only for executable programs, not builtins or aliases that are substitutes
    for actual executable programs. When we try to use which on a shell builtin (for
    example, cd), we get either no response or an error message:


    ```

    [me@linuxbox ~]$which cd

    /usr/bin/which: no cd in (/usr/jre.6.0_03:/usr/lib/qt-3.3:/bin:/usr/bin:kerber/bin:/usr/jre.6.0_03:/usr/lib/ccache:/usr/local/bin:/usr/bin:/bin:/home/bin)

    ```


    This is a fancy way of saying “command not found."


    # Getting a Command’s Documentation


    With knowledge of what a command is, we can now search for the documentation available
    for each kind of command.


    # helpGet Help for Shell Builtins


    bash has a built-in help facility for each of the shell builtins. To use it, help
    followed by the name of the shell builtin. For example:


    ```

    [me@linuxbox ~]$help cd

    cd: [-L|-P]

    ```


    Change the current directory to DIR. The variable $HOME is the default DIR. The
