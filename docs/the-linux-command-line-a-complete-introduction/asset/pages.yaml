  md: 'When executed, the script produces this:


    ```

    [me@linuxbox ~]$ array-sort

    Original array: f e c b a

    Sorted array: a b c d e f

    ```


    The script operates by copying the contents of the original array (a) into a second
    array (a_sorted) with a tricky piece of command substitution. This basic technique
    can be used to perform many kinds of operations on the array by changing the design
    of the pipeline.


    # Deleting an Array


    To delete an array, use the unset command:


    ```

    [me@linuxbox ~]$ foo=(a b c d e f)

    [me@linuxbox ~]$ echo ${foo[@]}

    ab c d e f

    [me@linuxbox ~]$ unset foo

    [me@linuxbox ~]$ echo ${foo[@]}

    ```


    unset may also be used to delete array elements:


    ```

    [me@linuxbox ~]$ foo=(a b c d e f)

    [me@linuxbox ~]$ echo ${foo[@]}

    ab c d f

    [me@linuxbox ~]$ unset ''foo[2]''

    [me@linuxbox ~]$ echo ${foo[@]}

    ab d e f

    ```


    In this example, we delete the third element of the array, subscript 2. Remember,
    arrays start with subscript 0, not 1! Notice how the array element must be quoted
    to prevent the shell from performing pathname expansion.


    Interestingly, the assignment of an empty value to an array does not empty its
    contents:


    ```

    [me@linuxbox ~]$ foo=(a b c d e f)

    [me@linuxbox ~]$ foo=

    [me@linuxbox ~]$ echo ${foo[@]}

    b c d f

    ```


    Any reference to an array variable without a subscript refers to element 0 of
    the array:


    ```

    [me@linuxbox ~]$ foo=(a b c d e f)

    [me@linuxbox ~]$ echo ${foo[@]}

    ab c d e f

    [me@linuxbox ~]$ foo=A

    [me@linuxbox ~]$ echo ${foo[@]}

    A c d e f

    ```'
