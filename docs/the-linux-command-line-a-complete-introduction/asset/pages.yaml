- pgno: 121
  md: '# chown—Change File Owner and Group


    The chown command is used to change the owner and group owner of a file or directory.
    Superuser privileges are required to use this command. The syntax of chown looks
    like this:


    ```

    chown [owner][[:group]] file...

    ```


    chown can change the file owner and/or the group owner depending on the first
    argument of the command. Table 9-7 lists some examples.


    # Table 9-7: argument Examples


    | Argument | Results |

    | --- | --- |

    | bob | Changes the ownership of the file from its current owner to user bob.
    |

    | bob:users | Changes the ownership of the file from its current owner to user
    bob and changes the group owner to group users. |

    | :admins | Changes the group owner to the group admins. The file owner is unchanged.
    |

    | bob | Change the file owner from the current owner to user bob and changes the
    group owner to the login group of bob. |


    Let''s say we have two users: Janet, who has access to superuser privileges, and
    tony who does not. User Janet wants to copy a file from her home directory to
    the home directory of tony. Since user Janet changes the ownership of the copied
    file from Janet to tony.


    ```

    [linuxbox] $ sudo cp myfile.txt "tony"

    Password:

    [linuxbox] $ sudo ls -l "tony/myfile.txt"

    -rw-r-- 1 root 8031 2023-03-02 14:30 /home/tony/myfile.txt

    [linuxbox] $ sudo chown tony:"tony/myfile.txt"

    [linuxbox] $ sudo ls -l "tony/myfile.txt"

    -rw-r-- 1 tony 8031 2023-03-02 14:30 /home/tony/myfile.txt

    ```


    Here we use Janet copy the file from her home directory to the home directory
    of tony. Next, Janet changes the ownership of the file from root (a result of
    using sudo) to tony. Using the first argument, Janet also changes the group ownership
    of the file to the login group of tony, which happens to be group tony.


    Notice that after the first use of sudo, Janet was not prompted for her password?
    This is because sudo, in most configurations, "trusts" for several minutes (until
    its timer runs out).'
  merge: -1
  img_proc: true
