- pgno: 42
  md: '# IMPORTANT FACTS ABOUT FILENAMES


    +   - Filenames that begin with a period character are hidden. This only means
    that ls will not list them unless you say `ls -a`. When your account was created,
    several hidden files were placed in your home directory to configure things for
    your account. Later on we will take a closer look at some of those files to see
    how you can customize your environment. In addition, some applications place their
    configuration and settings files in your home directory as hidden files.


    +   - Filenames and commands in Linux, as in Unix, are case sensitive. The filenames
    `File1` and `file1` refer to different files.


    +   - Linux has no concept of a "file extension" like some operating systems.
    You may name filenames any way you like. The contents and/or purpose of a file
    is determined by other means. Although Unix-like operating systems don''t use
    file extensions to determine the contents/purpose of files, some application programs
    do.


    +   - Though Linux supports long filenames that may contain embedded spaces and
    punctuation characters, limit the punctuation characters in the names of you you
    create to period, dash (hyphen), and underscore. *Most importantly, do not embed
    spaces in filenames.* Embedding spaces in filenames will make many command line
    tasks more difficult, as we will discover in Chapter 7. If you want to represent
    spaces between words in a filename, use underscore characters. You will thank
    yourself later.'
  merge: -1
  img_proc: true
