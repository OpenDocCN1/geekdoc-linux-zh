    # REVERTING TO TRADITIONAL COLLATION ORDER


    You can opt to have your system the traditional (ASCII) collation order by changing
    the value of the LANG environment variable. As we saw in the previous section,
    the LANG variable contains the name of the language and character set used in
    your locale. This value was originally determined when you selected an installation
    language your Linux was installed.


    To see the locale settings, use the locale command:


    ```

    [me@linuxbox]$ locale

    LANG=en_US.UTF-8

    LC_CTYPE="en_US.UTF-8"

    LC_NUMERIC="en_US.UTF-8"

    LC_TIME="en_US.UTF-8"

    LC_COLLATE="en_US.UTF-8"

    LC_MONETARY="en_US.UTF-8"

    LC_MESSAGES="en_US.UTF-8"

    LC_PAPER="en_US.UTF-8"

    LC_NAME="en_US.UTF-8"

    LC_ADDRESS="en_US.UTF-8"

    LC_TELEPHONE="en_US.UTF-8"

    LC_MEASUREMENT="en_US.UTF-8"

    LC_IDENTIFICATION="en_US.UTF-8"

    LC_ALL=

    ```


    To change the locale to use the traditional Unix behaviors, set the variable to
    POSIX:


    ```

    [me@linuxbox]$ export LANG=POSIX

    ```


    Note that this change converts the system to use US English (more specifically,
    ASCII) for its character set, so be sure this is really what you want. You can
    make this change permanent by adding this line to your .bashrc:


    ```

    export LANG=POSIX

    ```


    # POSIX basic vs. Extended Regular Expressions


    Just when we thought this couldn''t get any more confusing, we discover that POSIX
    also splits regular expression implementations into two kinds: basic regular expressions
    (BRE) and extended regular expressions (ERE). The features we have covered so
    far are supported by any application that is POSIX compliant and implements BRE.
    Our grep program is one such.


    What''s the difference between BRE and ERE? It''s a matter of metacharacters.
    With BRE, some metacharacters are recognized: $ [ ] * All other characters are
    considered literals. With ERE, the following metcharacters (and their associated
    functions) are added: { } } + |'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'However (and this is the fun part), the characters () {} are treated as metacharacters
    in BRE if they are escaped with a backslash, whereas ERE, preceding any metacharacter
    with a backslash causes it to be treated as a literal.


    Since the features we are going to discuss next are ERE, we are going to need
    a different grep. Traditionally, this has been performed by the grep program,
    the GNU version of grep also supports extended regular expressions when the -e
    option is used.


    # POSIX


    During the 1980s, Unix became a very popular commercial operating system, but
    by 1988, the Unix world was in turmoil. Many computer manufacturers had licensed
    the Unix source code from its creators AT&T, and were supplying versions of the
    operating system with their systems. However, in their efforts to create differentiation,
    each manufacturer added proprietary properties and extensions. This started to
    limit the compatibility of the software. As always with proprietary vendors, each
    trying to win a game of "lock-in" with their customers. This dark time in the
    history of Unix is known today as the Balkanization.


    Enter the IEEE (Institute of Electrical and Electronics Engineers). In the mid-1980s,
    the IEEE began developing a set of standards that would define how Unix (Unix-like)
    systems would perform. These standards, formally known as IEEE 1003, define the
    application programming interfaces (APIs), the shell and utilities that are to
    be found on a standard Unix-like system. The name POSIX, which stands for Portable
    Operating System Interface (with the X added to the end for extra snappiness),
    was suggested by Richard Stallman (yes, that Richard Stallman) and was adopted
    by the IEEE.


    # Alternation


    The first of the extended regular expression features we will discuss is called
    alternation, which is the facility that allows a match to occur among a set of
    expressions. Just as a bracket expression allows a single character to match from
    a set of specified characters, alternation allows matches from a set of strings
    or other regular expressions.


    To demonstrate, we''ll use grep in conjunction with echo. First, let''s try a
    plain string match:


    ```

    [melinuxbox~$] echo "AAA" | grep AAA

    AAA

    [melinuxbox~$] echo "BBB" | grep AAA

    [melinuxbox~$]

    ```


    A pretty straightforward example, in we pipe the output of echo into grep and
    see the results. When a match occurs, we see it printed out; when no match occurs,
    we see no results.'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'Now we''ll add alternation, signified by the vertical pipe metacharacter:


    ```

    [melinuxbox ~]$ echo "AAA" | grep -E ''AAA|BBB''

    AAA

    [melinuxbox ~]$ echo "BBB" | grep -E ''AAA|BBB''

    BBB

    [melinuxbox ~]$ echo "CCC" | grep -E ''AAA|BBB''

    [melinuxbox ~]$ $

    ```


    Here we use the regular expression ''AAA|BBB'', which means "match

    either the string AAA or the string BBB.". Notice that since this is an extended

    feature, we use the -e option to grep (though we could have used the grep

    program instead), and we enclosed the regular expression in quotes to prevent-

    the shell from interpreting the vertical pipe metacharacter as a pipe

    operator. Alternation is limited to two choices:


    ```

    [melinuxbox ~]$ echo "AAA" | grep -E ''AAA|BBB|CCC''

    AAA

    ```


    To combine alternation with other regular-expression elements, we can

    use | to separate the alternation:


    ```

    [melinuxbox ~]$ grep -Eh ''^(bz|gz|zip)*'' dirlist*.txt

    ```


    This expression will match the filenames in our lists that start with\either bz,
    or zip. If we leave the parentheses, the meaning of this

    regular expression to match any filename that begins with bz or

    contains gz or contains zip:


    ```

    [melinuxbox ~]$ grep -Eh ''^bz|gz|zip\*'' dirlist*.txt

    ```


    # Quantifiers


    Extended regular expressions support several ways to specify the number of

    times an element is matched.


    # ?-Match an Element Zero Times or One Time


    This quantifier means, in effect, "Make the preceding element optional.\nLet''s
    say we wanted to check a phone number for validity and we considered

    a phone number to be valid if it matched either of these two forms, (nnn)

    nn-nnnn or nnn nnn-nnnn, where n is a numerical. We could construct a regular

    expression like this:


    ```

    ^([0-9]?[0-9]?) [0-9]?[0-9]-[0-9]?[0-9]-[0-9]*)$

    ```


    In this expression, we follow the parentheses with character

    marks to indicate that they are to be matched zero or one time. Again, since

    the parentheses are normally metacharacters (in ERE), we precede them

    with backslashes to cause them to be treated as literals instead.'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'Let''s try it:


    ```

    me[linuxbox ~]$ echo "555 123-4567" | grep -E ''^\([0-9][0-9]\\)?[0-9][0-9][0-9][0-9]$''

    555 123-4567

    me[linuxbox ~]$ echo "555 123-4567" | grep -E ''^\([0-9][0-9]\\)?[0-9][0-9][0-9][0-9][0-9][0-9]$''

    555 123-4567

    me[linuxbox ~]$ echo "AAA 123-4567" | grep -E ''^\([0-9][0-9]\\)?[0-9][0-9][0-9][0-9][0-9][0-9]$''

    me[linuxbox ~]$

    ```


    Here we see the expression matches forms of the number but does not match one
    containing non-numeric characters.


    # *Match an Element Zero or More Times


    Like the ? metacharacter, the * is used to denote an optional item; however, unlike
    the ?, it may occur any number of times, not just once. We want to see if a string
    is a sentence; that is, it starts with an uppercase letter, contains any number
    of upper- and lowercase letters and spaces, and ends with a period. To match this
    (very crude) definition of a sentence, we could use a regular expression like
    this:


    ```

    [:upper:]][[:lower:]]**

    ```


    The expression contains three items: a bracket expression containing the [:upper:]
    character class, a bracket expression containing both [:upper:] and [:lower:]
    character classes and a space, and a period escaped with a backslash. The second
    element is trailed with an * metacharacter so that the lettered uppercase letter
    in our sentence, any number of upper- and lowercase letters and spaces may follow
    it and still match:


    ```

    me[linuxbox ~]$ echo "This works." | grep -E ''[:upper:]][[:lower:]]*''

    *

    This works.

    me[linuxbox ~]$ echo "This works." | grep -E ''[:upper:]][[:upper:]][[:lower:]]*''

    *

    This works.

    me[linuxbox ~]$ echo "this does not" | grep -E ''[:upper:]][[:upper:]][[:lower:]]*''

    *

    me[linuxbox ~]$

    ```


    The expression matches the first two tests, but not the third, since it lacks
    the required uppercase character and trailing period.


    # +Match an Element One or More Times


    The + metacharacter works like the *, except it requires at least one instance
    of the preceding element to cause a match. Here is a regular expression that will
    only lines consisting of groups of one or more alphabetic characters separated
    by spaces:


    ```

    ^([[:alpha:]]+$

    ```'
