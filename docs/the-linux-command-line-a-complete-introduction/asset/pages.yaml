- pgno: 424
  md: "# #33\nFLOW CONTROL:\nLOOPING WITH FOR\n\nIn this final chapter on flow control,\
    \ we will look at another of the shell’s looping constructs. The *for* loop differs\
    \ from the while and until loops in that it provides a means of processing sequences\
    \ during a loop. This turns out to be very useful when programming. Accordingly,\
    \ the for loop is a very popular construct in bash scripting.\n\nA loop is implemented,\
    \ naturally enough, with the for command. In modern versions of bash, for is available\
    \ in two forms.\n\n# for: Traditional Shell Form\n\nThe original for command’s\
    \ syntax is as follows:\n\n```\nfor variable [in words]; do\n  commands\ndone\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 425
  md: "where variable is the name of a variable that will increment during the execution\
    \ of the loop, words is an optional list of items that will be sequentially assigned\
    \ to variable, and commands are the commands that to be executed on each iteration\
    \ of the loop.\nThe for command is useful on the command line. We can easily demonstrate\
    \ how it works:\n\n```\n[me@linuxbox ~]$ for i in A B C D; do echo $i; done\n\
    A\\B\n\nD\n```\n\nIn this example, for is given a list of four words: A, B, C,\
    \ and D. With a list of four words, the loop is executed four times. Each time\
    \ the loop is executed, a is assigned to the variable i. Inside the loop, we have\
    \ an echo command that displays the value of i to show the assignment. As with\
    \ the while and until loops, the done keyword closes the loop.\nThe really powerful\
    \ feature of for is the number of interesting ways we can create the list of words.\
    \ For example, we can use brace expansion:\n\n```\n[me@linuxbox ~]$ for i in {A..D};\
    \ do echo $i;\nA\nBC\nD\n```\n\nor pathname expansion:\n\n```\n[me@linuxbox ~]$\
    \ for i in distros*.txt; do echo $i;\ndistros-by-date.txt\ndistros-dates.txt\n\
    distros-key-names.txt\ndistros-key-verumns.txt\ndistros-names.txt\ndistros.txt\n\
    distros-verumns.txt\ndistros-versions.txt\n```\n\nor command substitution:\n\n\
    ```\n#!/bin/bash\n\n# longest-word : find longest string in a file\n\nwhile [[\
    \ -n $1 ]];; do\n  if [[ -r $1 ]];; then\n\tmax_word=\n\t\tmax_len=0\n\t\tfor\
    \ i in $(strings $1) | wc -c; do\n\t\t\tif (( len > max_len )); then\n\t\t\t\t\
    max_len=$len\n\t\t\t\tmax_word=$i\n\t\t\\fi\n\t\td\n```"
  merge: -1
  img_proc: true
- pgno: 426
  md: "```\ndone\necho \"$1: '$max_word' ($max_len characters)\"\n\nfi\nshift\n```\n\
    \nIn this example, we look for the longest string found within a file. When one\
    \ or more filenames on the command line, this program uses the strings program\
    \ (which is included in the GNU binutils package) to generate a list of readable\
    \ text \"words\" in each file. The loop processes each word in turn and determines\
    \ if the current word is the longest so far. When the loop completes, the longest\
    \ word is displayed.\n\nIf the optional words portion of the for command is omitted,\
    \ for defaults to processing the positional parameters. We will modify our longest-word\
    \ script to use this method:\n\n```\n#!/bin/bash\n```\n\n```\n# longest-word2\
    \ : find longest string in a file\n```\n\n```\nif [[ -r $i ]]; then\n  max_word=\n\
    \  max_len=0\n  for j in $(strings $j); do\n    len=$(echo $j | wc -c)\n    if\
    \ (( len > $max_len )); then\n      max_len=$len\n      max_word=$j\n    fi\n\
    \  fi\ndone\necho \"$1: '$max_word' ($max_len characters)\"\n```\n\nAs we can\
    \ see, we have changed the outermost loop to use for place of while. Because we\
    \ omitted the list of words in the for command, the positional parameters are\
    \ used instead. Inside the loop, previous instances of the variable i have been\
    \ changed to the variable j. The use of shift has also been eliminated.\n\n# WHY\
    \ I?\n\nYou may have noticed that the variable i was chosen for each of the for\
    \ loop examples above. Why? No specific reason actually, besides tradition. The\
    \ variable used with k can be any valid variable, but it is the most common, followed\
    \ by j and k.\n\nThe basis of this tradition comes from the Fortran programming\
    \ language. In Fortran, undeclared variables starting with the letters I, J, K,\
    \ L and M are automatically typed as integers, while variables beginning with\
    \ any other are typed as real (numbers with decimal fractions). This behavior\
    \ led programmers"
  merge: -1
  img_proc: true
- pgno: 427
  md: "to use the variables I, J, and K for loop variables, since it was less work\
    \ to use when a temporary variable (as a loop variable often was) was needed.\n\
    It also led to the following Fortran-based witticism: \"GOD is real, unless declared\
    \ integer.\n\n\n# for: C Language Form\n\nRecent versions of bash have added a\
    \ second form of for-command syntax, one that resembles the form in the C programming\
    \ language. Many other languages support this form, as well.\n\n```\nfor (( expression1;\
    \ expression2; expression3 )); do\n    commands\n```\n\nexpression1, expression2,\
    \ and expression3 are arithmetic expressions and commands are the commands to\
    \ be performed during each iteration of the loop.\n\nIn terms of behavior, this\
    \ form is equivalent to the following construct:\n\n```\n(( expression1 ))\nwhile\
    \ (( expression2 )); do\n    (( expression3 ))\n```\n\nexpression1 is used to\
    \ initialize conditions for the loop, expression2 is used to determine when the\
    \ loop is finished, and expression3 is carried out at the end of each iteration\
    \ of the loop.\n\nHere is a typical application:\n\n```\n#!/bin/bash\n\n# simple_counter\
    \ : demo of C style for command\n\nfor (( i=0; i<5; i=i+1 )); do\n    echo $i\n\
    ```\n\nWhen executed, it produces the following output:\n\n```\nme@linuxbox ~$\
    \ simple_counter\n0\n1\n2\n3\n4\n```\n\nIn example, expression1 initializes the\
    \ variable i with the value of 0, expression2 allows the loop to continue as long\
    \ as the value of i remains less than 5, and expression3 increments the value\
    \ of i by 1 each time the loop repeats."
