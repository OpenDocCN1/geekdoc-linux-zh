    distlist-bin.txt distlist-bin.txt distlist-usr-sbin.txt

    distlist-usr-sbin.txt

    ```


    We can perform a simple search of all of files like this:


    ```

    me[linuxbox ~]$ grep bzip distlist*.txt

    distlist-bin.txt:bzip2

    distlist-bin.txt:bzip2

    ```


    In this example, grep searches all of the listed files for the string bzip and
    finds two matches, both in the file distlist-bin.txt. If we were interested in
    only the files that contained matches rather than the matches themselves, we could
    specify the -l option:


    ```

    me[linuxbox ~]$ grep -l bzip distlist*.txt

    distlist-bin.txt

    ```


    Conversely, if we wanted to see a list of only the files that did not contain
    a match, we could do this:


    ```

    me[linuxbox ~]$ grep -L bzip distlist*.txt

    distlist-sbin.txt

    distlist-usr-sbin.txt

    distlist-usr-sbin.txt

    ```


    # Metacharacters and Literals


    While it may not seem apparent, our grep searches all regular expressions all
    along, albeit very simple ones. The regular expression bzip is'
