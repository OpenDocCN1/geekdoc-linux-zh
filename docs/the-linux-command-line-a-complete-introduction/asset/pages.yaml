- pgno: 143
  md: '| Table 11-1 (continued) |

    | Variable | Contents |

    | --- | --- |

    | PS1 | Prompt String. 1. This defines the contents of your shell prompt. As we
    will later see, this can be extensively customized. |

    | PWD | The current working directory. |

    | TERM | The name of your terminal type. Unix-like systems support many terminal
