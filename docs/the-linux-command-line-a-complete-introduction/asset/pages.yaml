    \nHere we have an example program that validates various kinds of input:\n\n```\n\
    #!/bin/bash\n\n# read-validate: validate input\n\ninvalid_input () {\n    echo\
    \ \"Invalid input '$REPLY\" >&2\n    exit 1\n}\n\nread -p \"Enter a single item\
    \ \" \n\n# input is empty (invalid)\n[[ -z $REPLY ]] && invalid_input\n\n# input\
    \ is multiple items (invalid)\n(( $(echo $REPLY | wc -w) > 1 )) && invalid_input\n\
    \n# input is a valid filename?\nif [[ $REPLY =~ ^-?[[:alnum:]\\._]+$ ]]; then\n\
    \    echo \"$REPLY is a valid filename.\"\n    if [[ -e $REPLY ]]; then\n    \
    \    echo \"And file '$REPLY' exists.\"\n    else\n        echo \"However, file\
    \ '$REPLY' does not exist.\"\n    fi\n\n# input is a floating point number?\n\
    if [[ $REPLY =~ ^-?[[:digit:]]*\\.?[[:digit:]]+$ ]]; then\n    echo \"$REPLY is\
    \ a floating point number.\"\nelse\n    echo \"$REPLY is not a floating point\
    \ number.\"\nfi\n\n# input is an integer?\nif [[ $REPLY =~ ^-?[[:digit:]]+$ ]];\
    \ then\n    echo \"$REPLY is an integer.\"\nelse\n    echo \"$REPLY is not an\
    \ integer.\"\nfi\n```\n\necho \"The String $REPLY is not a valid filename.\"\n\
    \nThis script prompts the user to enter an item. The item is subsequently analyzed\
