    # # Traps


    In Chapter 10, we saw how programs can respond to signals. While the scripts we
    have written so far have not needed this capability (because they have very short
    execution times and do not create temporary files), larger and more complicated
    scripts may benefit from having a signal-handling routine.


    When we design a large, complicated script, it is important to consider what happens
    if the user logs off or shuts the computer while the script is running. When such
    an event occurs, a signal will be sent to all affected processes. In turn, the
    processes representing those processes perform actions to ensure a proper and
    orderly termination of the program. Let''s say, for example, that we wrote a script
    that created a temporary file'
