- pgno: 105
  md: '# Searching History


    At any time, we can view the contents of the history list:


    ```

    me@linuxbox history | less

    ```


    By default, bash stores the last 500 commands that you have entered. We will see
    how to adjust this value in Chapter 11. Let''s say we want to find the commands
    we used to set /usr/bin. Here is one way we could do this:


    ```

    me@linuxbox $ grep /usr/bin

    ```


    And let''s say that our results got a line containing an interesting command like
    this:


    ```

    88 ls -l /usr/bin > ls-output.txt

    ```


    The number 88 is the line number of the command in the history list. We could
    use this immediately with another type of expansion called history expansion.
    To use our discovered line, we could do this:


    ```

    me@linuxbox $ !88

    ```


    bash will !88 into the contents of the 88th line in the history list. We will
    cover other forms of history expansion a later. bash also provides the ability
    to search the history list as we enter characters, with each additional character
    further refining our search. To start an incremental search, press CTRL-R followed
    by the text you are looking for. When you find it, you can either press ENTER
    to execute the command or press CTRL-R to copy the line from the history list
    to the current command line. To find the next occurrence of the text (“up” the
    history list), press CTRL-R again. To quit searching, press CTRL-G or CTRL-C.
    Here we see it in action:


    ```

    me@linuxbox $

    ```


    First CTRL-R:


    ```

    (reverse-i-search)``:

    ```


    The prompt changes to indicate that we are performing a reverse incremental search.
    It is “reverse” because we are searching from “now” to some time in the past.
    Next, we start typing our search text, which in this example is /usr/bin:


    ```

    (reverse-i-search)`/usr/bin'': ls -l /usr/bin > ls-output.txt

    ```'
  merge: -1
  img_proc: true
