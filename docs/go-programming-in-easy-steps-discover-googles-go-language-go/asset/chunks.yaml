  trans: "\n本章演示了如何使用 Go 标准库中的 `time` 包来处理日期和时间。\n\n## 获取日期\n\nGo 标准库的 `time` 包提供了功能，可以从\
    \ `Time` 数据类型中提取描述特定时间点的特定字段。通过导入 `time` 包，这些功能可以在程序中使用。\n\n![image](img/pg112_1.jpg)\n\
    \n可以使用 `time.Now()` 函数创建一个新 `Time` 数据类型的日期/时间实例，其包含的字段描述了当前的当前的日期和时间。这些字段是根据设备上的系统时钟为当前区域设置初始化的。\n\
    \n可以使用 `Time` 数据类型的相应方法获取单个字段中的值。例如，可以使用 `Year()` 方法获取年份字段的值。同样，还有 `Month()`、`Day()`\
    \ 和 `Weekday()` 方法来获取 `Time` 类型的其他单独字段。\n\n| 方法 | 返回值 |\n| :--- | :--- |\n| `Now()`\
    \ | 包含当前日期、时间和时区字段的 `time.Time` 数据类型 |\n| `Year()` | 4 位数字的年份 (YYYY) |\n| `Month()`\
    \ | 年份的月份名称 |\n| `Day()` | 月份中的几数 |\n| `Weekday()` | 星期名称 |\n\n还有这三个方法，其返回的 `Time`\
    \ 数据类型值可以方便地赋值给变量：\n\n| 方法 | 返回值 |\n| :--- | :--- |\n| `Date()` | 4 位数字的年份 (YYYY)、年份的月份名称和月份中的几数\
    \ |\n| `ISOWeek()` | 一份中的周数 (1-53) 和 4 位数字的年份 (YYYY) |\n| `YearDay()` | 年中的天数\
    \ (1-365/366) |\n\n重要的是，`Time` 数据类型包含单独的字段，因此它不是字符串。然而，你可以使用它的 `String()` 方法将其转换为字符串：\n\
    \n![image](img/snake.jpg)\n\n`Time` 数据类型方法返回的值不是字符串。\n\n![image](img/1b.jpg)开始在程序中导入\
    \ Go 标准库 time 包\n\n```go\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n```\n\n![image](img/commons.jpg)\n\
    \nsrc\\date\\main.go\n\n![image](img/2b.jpg)接下来，创建一个 `Time` 类型的日期/时间实例，并用当前的日期和时间初始化\n\
    \n```go\ndt := time.Now()\n```\n\n![image](img/3b.jpg)添加语句输出日期/时间实例的所有字段，并确认其数据类型\n\
    \n```go\nfmt.Printf(\"DateTime: %v \\n\", dt)\nfmt.Printf(\"DateTime Type: %T\
    \ \\n\", dt)\n```\n\n![image](img/4b.jpg)接下来，添加一条语句输出今天的星期几\n\n```go\nfmt.Printf(\"\
    Today is: %v \\n\", dt.Weekday())\n```\n\n![image](img/5b.jpg)现在，添加语句显示今天的日期、本周以及一年中的天数\n\
    \n```go\ny, m, d := dt.Date()\nfmt.Printf(\"Date: %v %v, %v \\n\", m, d, y)\n\
    yr, wk := dt.ISOWeek()\nfmt.Printf(\"Week No.: %v in %v \\n\", wk, yr)\ndy :=\
    \ dt.YearDay()\nfmt.Printf(\"Day No.: %v \\n\", dy)\n```\n\n![image](img/6b.jpg)将程序文件保存在“date”目录中，然后运行程序查看日期字段的值\n\
    \n![image](img/pg113_1.jpg)\n\n![image](img/hot.jpg)\n\n时区值指定了相对于 UTC（通用时间）的偏移量以及时区缩写——有关时区的更多信息请参阅此处。\n\
    \n## 获取时间\n\n`Time` 数据类型单个字段中的时间值可以使用相应的方法获取。例如，可以使用 `Hour()` 方法获取小时字段的值。同样，还有\
    \ `Minute()`、`Second()` 和 `Nanosecond()` 方法来获取 `Time` 的其他单独字段。\n\n![image](img/pg114_1.jpg)\n\
    \n| 方法 | 返回值 |\n| :--- | :--- |\n| `Hour()` | 一天的小时数 (0-23) |\n| `Minute()` |\
    \ 小时内的分钟数 (0-59) |\n| `Second()` | 分钟内的秒数 (0-59) |\n| `Nanosecond()` | 秒内的纳秒数\
    \ (0-999999999) |\n\n与其他编程语言不同，Go 的 `time` 包没有提供从 `Time` 数据类型返回毫秒值的方法。然而，你可以将纳秒值除以一百万来产生等值的毫秒。\n\
    \n还有这三个方法，其返回的 `Time` 数据类型值可以方便地赋值给变量：\n\n| 方法 | 返回值 |\n| :--- | :--- |\n| `Clock()`\
    \ | 一天内的小时、分钟和秒 |\n| `Unix()` | 自纪元以来的秒数 |\n| `UnixNano()` | 自纪元以来的纳秒数 |\n\n![image](img/1b.jpg)开始在程序中导入\
    \ Go 标准库 time 包\n\n```go\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n```\n\n![image](img/commons.jpg)\n\
    \nsrc\\date\\main.go\n\n![image](img/2b.jpg)接下来，创建一个 `Time` 类型的日期/时间实例，并用当前的日期和时间初始化\n\
    \n```go\ndt := time.Now()\n```\n\n![image](img/3b.jpg)添加语句输出日期/时间实例的所有字段，并确认其数据类型\n\
    \n```go\nfmt.Printf(\"DateTime: %v \\n\", dt)\nfmt.Printf(\"DateTime Type: %T\
    \ \\n\", dt)\n```\n\n![image](img/4b.jpg)接下来，添加一条语句评估小时并显示相应的问候\n\n```go\nhr :=\
    \ dt.Hour()\nswitch {\ncase hr < 12:\n\tfmt.Println(\"Good Morning!\")\ncase hr\
    \ < 18:\n\tfmt.Println(\"Good Afternoon!\")\ndefault:\n\tfmt.Println(\"Good Evening!\"\
    )\n}\n```\n\n![image](img/5b.jpg)现在，添加语句显示当前时间\n\n```go\nh, mn, s := dt.Clock()\n\
    fmt.Printf(\"Time: %v:%v:%v \\n\", h, mn, s)\n```\n\n![image](img/6b.jpg)最后，添加语句显示当前的纳秒字段及其毫秒值\n\
    \n```go\nns := dt.UnixNano()\nms := ns / 1000000\nfmt.Println(\"Nanoseconds:\"\
    , ns)\nfmt.Println(\"Milliseconds:\", ms)\n```\n\n![image](img/7b.jpg)将程序文件保存在“times”目录中，然后运行程序查看时间字段的值\n\
    \n![image](img/pg115_1.jpg)\n\n![image](img/snake.jpg)\n\n个位数的小时、分钟和秒没有前导零。\n\n\
    ## 格式化日期和时间\n\n![image](img/pg116_1.jpg)\n\n`Time` 数据类型单个字段中的日期和时间值可以使用 `Format()`\
    \ 方法以多种方式格式化。该方法接受一个作为“布局”的参数，指定如何格式化日期/时间。格式必须精确使用此参考字符串的元素来指定：\n\n`Mon Jan 2\
    \ 15:04:05 2006 MST`\n\n由于 MST（山地标准时间）比 UTC（协调世界时）慢 7 小时，参考字符串也可以从数值上考虑为：\n\n\
    `01 02 03:04:05PM ‘06 -0700`\n\n如果你想让 `Format()` 方法返回返回、月份和 hh:mm 格式的时间，布局可以指定：\n\
    \n`Mon Jan 2 15:04`\n\n或在数值上指定为：\n\n`01/02 03:04`\n\n通过在布局中指定全称版本，你可以让星期和月份名称返回全称：\n\
    \n`Monday January 2 15:04`\n\n`time` 包包含了预定义的 `UnixDate`、`ANSIC` 和 `RFC3339` 常量，可以作为日期/时间布局格式使用。\n\
    \n自定义布局可以任意顺序指定组件以适应不同的区域——例如，用于适当的日期格式化。\n\n`time` 包还包含一个预定义的 `Kitchen` 常量，可以作为时间布局格式使用。它将以十二制格式显示时间并根据情况添加“AM”或“PM”。\n"
- fmt: "\nAdditionally, the time components can be formatted to be displayed in a\
    \ 24-hour format that will automatically prefix single-digit hours with a zero\
    \ by specifying “15:04”.\n\nBoth 12-hour format and 24-hour format will automatically\
    \ prefix single-digit minutes with a zero.\n\n![image](images/hot.jpg)\n\nANSIC\
    \ refers to the American National Standards Institute standard date/time format\
    \ for the C programming language. RFC 3339 refers to the Request For Comment date/time\
    \ document of the Internet Engineering Taskforce (IETF).\n\n![image](images/1b.jpg)Begin\
    \ by importing the Go standard library time package into a program\n\n```go\n\
    import (\n\t\"fmt\"\n\t\"time\"\n)\n```\n\n![image](images/commons.jpg)\n\nsrc\\\
    format\\main.go\n\n![image](images/2b.jpg)Next, create a date/time instance of\
    \ the Time data type, initialized with the current date and time, then display\
    \ its components in various formats\n\n```go\ndt := time.Now()\nfmt.Println(\"\
    \\nDefault Format:\", dt)\nfmt.Println(\"Unix Format:\", dt.Format(time.UnixDate))\n\
    fmt.Println(\"ANSIC Format:\", dt.Format(time.ANSIC))\nfmt.Println(\"RFC3339 Format:\"\
    , dt.Format(time.RFC3339))\nfmt.Println(\"Custom Format:\", dt.Format(\"January\
    \ 2, 2006 [Monday]\"))\n```\n\n![image](images/3b.jpg)Now, display only date components\
    \ formatted to be appropriate in two locales\n\n```go\nfmt.Println(\"\\nUS Format:\"\
    , dt.Format(\"January 2, 2006\"))\nfmt.Println(\"UK Format:\", dt.Format(\"2 January,\
    \ 2006\"))\n```\n\n![image](images/4b.jpg)Then, display only time components in\
    \ a 12-hour format and in a 24-hour format\n\n```go\nfmt.Println(\"\\nTime 12-Hour:\"\
    , dt.Format(time.Kitchen))\nfmt.Println(\"Time 24-Hour:\", dt.Format(\"15:04\"\
    ))\n```\n\n![image](images/5b.jpg)Save the program file in a “format” directory,\
    \ then run the program to see the formatted date and time field values\n\n![image](images/pg117_1.jpg)\n\
    \n![image](images/hot.jpg)\n\nThe `time.Kitchen` constant is equivalent to specifying\
    \ a layout format of “15:04PM”.\n\n## Set Date and Time\n\nYou can create your\
    \ own Time data types using the `Date()` function of the Go standard library time\
    \ package. This requires eight arguments to specify (in this order) a year, a\
    \ month, a day number, an hour, a minute, a second, a nanosecond, and a location.\n\
    \n![image](images/pg116_1.jpg)\n\nAll arguments are specified as integer values\
    \ except for the month and location.\n\nThe month can be specified using one of\
    \ the time package predefined full-name month constants for January-December,\
    \ for example, `time.January`.\n\nThe location can be specified using one of the\
    \ time package predefined location constants like `time.UTC`, for Universal Time\
    \ Coordinated or `time.Local`, for your system clock.\n\nThe date fields in any\
    \ Time data type can be modified using the `AddDate()` method of the Go standard\
    \ library time package to specify three arguments for year, month, and day. Positive\
    \ values will advance the date, and negative values will retard the date. For\
    \ example, `time.AddDate(1, 0, 0)` will advance the date one year.\n\nSimilarly,\
    \ the time package’s `Add()` method can be used to specify a single duration argument\
    \ by which to modify a date/time. This value can be an `int64` value representing\
    \ a number of nanoseconds by which to modify the date/time. More conveniently,\
    \ you can use constants `time.Hour`, `time.Minute`, `time.Second`, or `time.Millisecond`\
    \ to modify individual time fields of a Time data type. For example, `time.Add(10\
    \ * time.Hour)` will advance the time 10 hours.\n\nYou can also create your own\
    \ Time data types from a string using the `Parse()` function of the Go standard\
    \ library time package. This requires two arguments to specify a layout and a\
