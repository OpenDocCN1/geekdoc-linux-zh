    \n## 转换字符串\n\n![image](img/pg132_1.jpg)\n\nGo 标准库 `strings` 包提供了用于转换字符串字符大小的函数。\n\
    \n`strings` 包有一个 `ToUpper()` 函数，它需要一个字符串参数。该函数将简单地返回字符串的副本，将其所有字符都转换为大写字母。\n\n\
    同样，`strings` 包的 `ToLower()` 函数需要一个字符串参数，并将返回字符串的副本，将其所有字符都转换为小写字母。\n\n`strings`\
    \ 包还 true `ToTitle()` 函数，它需要一个字符串参数。该函数将返回字符串的副本，并将每个单词的首字母转换为大写字母——但仅当字符串参数全为小写时才起有效。如果你想将一个混合大小写的字母字符串转换为标题格式（title\
    \ case），必须先使用 `strings` 包的 `ToLower()` 函数将其转换为小写。\n\n当程序在请求数值后接收到用户输入时，输入可能是字符串数据类型，并可能包含用户无意输入的空格。你可以使用\
    \ `strings` 包的 `Trim()` 函数删除字符串开头和结尾的空格。这需要两个参数：指定要删除的字符串和字符。要删除所有开头和结尾的空格，第二个参数将是\
    \ `\" \"` 指定单个空格字符。\n\n一旦包含输入数字的字符串删除了不必要的空格，在程序将输入用于算术运算之前，必须将数据类型转换为数值类型。这可以通过导入\
    \ Go 标准库的 `strconv` 包来实现。该包包含一个 `Atoi()` 函数（ASCII 转整数），它需要一个字符串参数，并返回一个整数和任何错误。如果没有遇到错误，错误值将为\
    \ `nil`；如果方法无法返回整数数据类型，它将包含一个描述性的错误信息。\n\n同样，`strconv` 包包含一个 `Itoa()` 函数，可以将整数转换为字符串数据类型。该方法只需要一个整数参数，并将返回一个字符串副本。\n\
    \n![image](img/hot.jpg)\n\n`strconv.ParseInt()` 方法也可以用于将字符串类型转换为整数。`strconv.Atoi()`\
    \ 方法等同于调用 `strconv.ParseInt(str, 10, 0)`。\n\n![image](img/1r.jpg)\n首先在程序中导入 Go\
    \ 标准库 `strings` 包和 `strconv` 包\n\n```go\nimport (\n    \"fmt\"\n    \"strings\"\
    \n    \"strconv\"\n)\n```\n\n![image](img/commonr.jpg)\n\n`src\\conv\\main.go`\n\
    \n![image](img/2r.jpg)\n通过初始化字符串变量启动 main 函数，然后显示具有不同字符大小的字符串\n\n```go\nstr :=\
    \ \"I have Nothing to declare except My Genius\"\nfmt.Println(strings.ToUpper(str))\n\
    fmt.Println(strings.ToLower(str))\nfmt.Println(strings.Title(strings.ToLower(str)))\n\
    ```\n\n![image](img/3r.jpg)\n现在，给变量赋值一个数字\n\n```go\nstr = \" 42 \"\n```\n\n![image](img/4r.jpg)\n\
    然后，从字符串开头和结尾的空格\n\n```go\nstr = strings.Trim(str, \" \")\n```\n\n![image](img/5r.jpg)\n\
    最后，尝试将数据类型转换为整数\n\n```go\nnum, err := strconv.Atoi(str)\nif err != nil {\n   \
    \ fmt.Println(err)\n} else {\n    fmt.Printf(\"%v Type: %T\\n\", num, num)\n}\n\
    ```\n\nimages/6r.jpg)\n将程序文件保存到“conv”目录中，然后运行程序查看结果\n\n![image](img/pg133_1)\n\
    \n## 常数\n\n![image](img/pg134.jpg)\n\nGo 标准库 `math` 包提供了许多实用的函数和常量。常量列在下表中，并带有近似值：\n\
    \n| 常量 | 描述 |\n| :--- | :--- |\n| `math.E` | 常数 *e*，自然对数的底，近似值为 2.71828 |\n| `math.Pi`\
    \ | 常数 Pi，近似值为 3.14159 |\n| `math.Phi` | 常数 Phi（黄金分割），近似值为 1.61803 |\n| `math.Sqrt2`\
    \ | 2 的平方根，近似值为 1.41421 |\n| `math.SqrtE` | 常数 *e* 的平方根，近似值为 1.64872 |\n| `math.SqrtPi`\
    \ | Pi 的平方根，近似值为 1.77246 |\n| `math.SqrtPhi` | Phi 的平方根，近似值为 1.27202 |\n| `math.Ln2`\
    \ | 2 的自然对数，近似值为 0.69315 |\n| `math.Log2E` | 常数 *e* 的以 2 为底，近似值为 1.44269 |\n|\
    \ `math.Ln10` | 10 的自然对数，近似值为 2.30259 |\n| `math.Log10E` | 常数 *e* 的以 10 为底，近似值为\
    \ 0.43429 |\n\n数学常量主要用于具有特定数学目的的 Go 程序，但为了完整起见，所有的 math 包常量都列在上方。\n\n![image](img/hot.jpg)\n\
    \n黄金比例在几何和艺术中多次出现。它是被分成两个长度不同的部分的线段的比例，其中长段与短段的长度比例等于整个线段与长段的长度比例。\n\n![image](img/pg134_2.jpg)\n\
    \n"
