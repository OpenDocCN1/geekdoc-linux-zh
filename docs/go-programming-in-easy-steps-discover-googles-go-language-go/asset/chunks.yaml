- fmt: "\nThe randomizing pattern is based upon a default “seed” that will return\
    \ the same pseudo-random order each time the program runs. This may be what you\
    \ want, but often it is preferable to generate a different order each time the\
    \ program runs. To make this happen, you must specify a custom seed as an integer\
    \ argument to a `rand.Seed()` function that will be unique each time the program\
    \ runs. It is convenient to use the current system time for this purpose by calling\
    \ the `time.Now()` function and extracting the integer count of elapsed nanoseconds\
    \ since the Epoch using the `Time` data type’s `UnixNano()` method. This value\
    \ will be different each time the program runs, so specifying this integer as\
    \ the argument to the `rand.Seed()` function will ensure a different pseudo-random\
    \ order is generated each time the program runs.\n\n![image](images/1r.jpg)Import\
    \ the Go standard library `math/rand` package into a program, along with the `time`\
    \ package to set a random seed and the `strconv` package to convert random numbers\n\
    \n```go\nimport (\n\t\"fmt\"\n\t\"math/rand\"\n\t\"strconv\"\n\t\"time\"\n)\n\
    ```\n\n![image](images/commonr.jpg)\n\nsrc\\lotto\\main.go\n\n![image](images/2r.jpg)Next,\
    \ specify a unique seed for the random generator\n\n```go\nrand.Seed(time.Now().UnixNano())\n\
    ```\n\n![image](images/3r.jpg)Now, generate a slice of integers from zero to 58\n\
    \n```go\nnums := rand.Perm(59)\n```\n\n![image](images/4r.jpg)Then, increment\
    \ the range to become 1-59 inclusive\n\n```go\nfor i := 0; i < len(nums); i++\
    \ {\n\tnums[i]++\n}\n```\n\n![image](images/hot.jpg)\n\nIn computing, the Epoch\
    \ is the time at midnight on January 1, 1970.\n\n![image](images/5r.jpg)Assign\
    \ the first six numbers in pseudo-random order around hyphen characters in a formatted\
    \ string\n\n```go\nstr := \"\\nYour Six Lucky Numbers: \"\nfor i := 0; i < 6;\
    \ i++ {\n\tstr += strconv.Itoa(nums[i])\n\tif i != 5 {\n\t\tstr += \" - \"\n\t\
    }\n}\n```\n\n![image](images/6r.jpg)Finally, display the formatted string\n\n\
    ```go\nfmt.Println(str)\n```\n\n![image](images/7r.jpg)Save the program file in\
    \ a “lotto” directory, then run the program repeatedly to see different random\
    \ numbers\n\n![image](images/pg141_1.jpg)\n\n![image](images/pg141_2.jpg)\n\n\
    Here the random numbers are in the range 1 to 59 – to play the UK Lotto game or\
    \ the US New York Lotto game.\n\n![image](images/pg141_3.jpg)\n\n![image](images/forget.jpg)\n\
    \nThe `int` numbers must be converted to the `string` data type for concatenation.\n\
    \n### Summary\n\n- A string is a collection of characters, like elements in an\
    \ array.\n- The built-in `len()` function returns the number of characters in\
    \ a string specified as its argument.\n- The `strings` package contains functions\
    \ for string manipulation, such as the `Join()` concatenation function.\n- The\
    \ `Fields()` and `Split()` functions each return an array of substrings from a\
    \ specified string argument.\n- The `Contains()` and `Index()` functions can be\
    \ used to find a specified substring in a string argument.\n- The `Count()` function\
    \ reports how many instances of a substring occur in a specified string argument.\n\
    - The `HasPrefix()` and `HasSuffix()` functions can be used to recognize the beginning\
    \ and end of a string argument.\n- The `Replace()` function can substitute a substring.\n\
    - Character case can be changed using the `ToUpper()`, `ToLower()`, and `ToTitle()`\
    \ functions.\n- The `Trim()` function can remove leading and trailing spaces.\n\
    - The `strconv` package contains `Atoi()` and `Itoa()` functions that can convert\
    \ between string and `int` data types.\n- The `math` package contains mathematical\
    \ functions, such as `math.Pow()`, and mathematical constants, such as `math.Pi`.\n\
    - Decimal values can be rounded to near integers using `math.Floor()`, `math.Ceil()`,\
    \ `math.Round()`, and `math.Trunc()`.\n- The `math/rand` package provides functions\
    \ to generate pseudo-random numbers.\n- The `rand.Perm()` function returns a randomized\
    \ sequence of integers from zero up to the number specified as its argument.\n\
    - The `rand.Seed()` function can specify a custom seed integer for the random\
    \ number generator.\n- A unique random seed can be specified each time a program\
    \ runs by calling the `time.Now().UnixNano()` functions\n\n# 10. Handle Input\n\
    \n*This chapter demonstrates how to handle user input, and how to read and write\
    \ text files using the Go standard library `os`, `bufio`, and `io/ioutil` packages.*\n\
    \n- [Get User Input](#\n- [Buffer Input](#\n- [Command Flags](#\n- [Read Files](#\n\
    - [Write Files](#\n- [Use Temporary Files](#\n- [Summary](#\n\n## Get User Input\n\
    \nThe previous examples have illustrated how variables can be used to store text\
    \ string, integer, floating-point, and boolean values. The Guessing Game can use\
    \ `fmt.Scan()`, `fmt.Scanln()`, and `fmt.Scanf()` to read from standard input.\
    \ Each of these functions returns the number of items scanned and any error. If\
    \ no error is encountered, the error value will be `nil`.\n\n```go\nimport (\n\
    \t\"fmt\"\n\t\"math/rand\"\n\t\"time\"\n)\n\nfunc main() {\n\trand.Seed(time.Now().UnixNano())\n\
    \tvar num int = rand.Intn(20) + 1\n\tvar guess int = 0\n\tvar flag bool = true\n\
    \n\tfmt.Print(\"\\nGuess My Number 1-20: \")\n\tfor flag {\n\t\t_, err := fmt.Scan(&guess)\n\
    \t\tif err != nil {\n\t\t\tfmt.Println(err)\n\t\t} else if guess > num {\n\t\t\
    \tfmt.Print(\"Too High, Try Again: \")\n\t\t} else if guess < num {\n\t\t\tfmt.Print(\"\
    Too Low, Try Again: \")\n\t\t} else if guess == num {\n\t\t\tfmt.Println(\"Correct\
    \ - My Number Is\", num)\n\t\t\tflag = false\n\t\t}\n\t}\n}\n```\n\n## Buffer\
    \ Input\n\nWhen you want to gather larger items of data into your program it is\
    \ often preferable to store the data stream in a memory buffer. The Go standard\
    \ library `bufio` (buffered input/output) package provides a `Scanner` type, which\
    \ is a memory buffer with several useful methods to handle data streams. You can\
    \ make this available to your program by importing the `bufio` package.\n\n![image](images/pg146_1.jpg)\n"
