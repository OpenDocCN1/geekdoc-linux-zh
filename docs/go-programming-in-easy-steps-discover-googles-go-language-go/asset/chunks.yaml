    \n![image](img/pg91_1.jpg)\n\n![image](img/forget.jpg)\n\n记住结构字面量中的所有值后面都必须紧跟一个逗号——包括最后一个。\n\
    \n# 满足接口\n\n面向对象编程的第三大基石是“多态性”——这个词源自希腊语，意为“多种形式”，描述了根据上下文为实体赋予不同含义或目的的能力。\n\n\
    ![image](img/pg92_1.jpg)\n\nGo 语言通过使用 `type` 关键字创建的“interface”类型来支持多态，后面跟着你选择的名称和接口关键字，然后是\
    \ `{ }` 大括号。接口体只包含方法签名的列表：\n\n```go\ntype interfaceName interface {\n    methodName\
    \ returnType\n    methodName returnType\n}\n```\n\n任何具有与接口中列出的所有方法的名称和签名精确匹配的方法结构体都实现了该接口。在\
    \ Go 语言中，它们被称为“满足”接口。这样做的用处是，它允许程序拥有具有相同名称附加方法的各种结构体，每个结构体执行不同的任务——即它们是多态的。\n\n\
    ![image](img/1bl.jpg)通过创建一个列出两个方法签名的接口来启动程序，每个方法不需要参数且都返回字符串\n\n```go\ntype bird\
