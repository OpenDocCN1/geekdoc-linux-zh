    \ | Example | Equivalent |\n| :--- | :--- | :--- |\n| `=` | `a = b` | `a = b`\
    \ |\n| `+=` | `a += b` | `a = ( a + b )` |\n| `-=` | `a -= b` | `a = ( a - b )`\
