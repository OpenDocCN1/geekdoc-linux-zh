  raw: '![image](images/7b.jpg)Right-click on the shortcut icon and select the **Properties**
    item, to open its “Properties” dialog


    ![image](images/pg13_4.jpg)


    ![image](images/8b.jpg)Choose the **Shortcut** tab, then enter the location of
    your workspace directory


    ![image](images/9b.jpg)Click **Apply**, **OK** to close the dialog, then double-click
    the shortcut icon to open a command-line in your “src” folder


    ![image](images/pg13_5.jpg)


    ![image](images/hot.jpg)


    Go programs can be written in a plain text editor, such as Windows’ Notepad app.
    It’s useful to have a desktop shortcut that opens a text editor in your “src”
    directory folder. Repeat the steps on this page, but in Step 7 enter **notepad**
    as the location and **Go Editor** as the name, to create another useful desktop
    shortcut.


    **Write a Go Program**


    All Go programs start as plain text files that are later compiled into actual
    executable programs. This means that Go programs can be written in any plain text
    editor, such as the Windows’ Notepad app or the Nano app on Linux.


    ![image](images/pg14_1.jpg)


    Follow these steps to create a simple Go program that will output the traditional
    first program greeting:


    ![image](images/1b.jpg)Create a sub-directory named “hello” in your “src” folder


    ![image](images/pg14_2.jpg)


    ![image](images/commons.jpg)


    src/hello/main.go


    ![image](images/2b.jpg)Open a plain text editor, like Notepad, and type this code
    exactly as it is listed to begin a program


    **package main**


    ![image](images/3b.jpg)Two lines below, insert this code exactly as it is listed


    **import “fmt”**


    ![image](images/4b.jpg)Two further lines below, precisely add this code


    **func main( ) {**


    **fmt.Println( “Hello World!” )**


    **}**


    ![image](images/5b.jpg)Save the file in the “hello” folder, and name it main.go
    – the complete program should now look exactly like this:


    ![image](images/pg14_3.jpg)


    ![image](images/snake.jpg)


    Capital P and lowercase L in **fmt.Println**.


    ![image](images/forget.jpg)


    The arrangement of files within folders is important in Go. Each main file, and
    any related files, must be placed in a uniquely named folder to create a package
    – so here the package is named “hello”.


    The separate parts of the program code on the opposite page can be examined individually
    to understand each part more clearly:


    **The Package Declaration**


    **package main**


    The package type is declared following the package keyword. All Go program code
    is contained in packages. You may declare your own type for a package that will
    be a shared library, but you must declare the package “main” if you want the code
    to be compiled into an executable program.


    **The Import Declaration**


    **import “fmt”**


    The keyword import is used to import one, or more, packages into this package
    to make their features available to this program. The package “fmt” comes from
    the Go standard library that is included in your Go installation. It provides
    the fmt.Println( ) function that is used to output text in this program. Note
    that the package name must be enclosed in double quote characters. When importing
    multiple packages, the list of package names must be enclosed within parentheses
    and each name must appear on its own line, like this:


    **import (**


    **“fmt”**


    **“strings”**


    **)**


    **The Function Declaration**


    **func main( ) {**


    **fmt.Println( “Hello World!” )**


    **}**


    The function name follows the func keyword. It must be followed by parentheses
    and an { opening curly bracket on the same line. The function body contains statements
    that are the actual instructions to perform program tasks. The function body must
    end with a closing } curly bracket. Function names must be unique, but each Go
    program must have a function named “main” as this is the starting point of all
    Go programs.


    ![image](images/forget.jpg)


    The package name and package type are two separate items – here the package is
    named **hello**, but the type is **main**.


    ![image](images/hot.jpg)


    You can find the Go standard library packages in the “src” directory of your **GOROOT**
    directory location – for example, at **C:\Go\src**. Additionally, you can learn
    about each package from the official documentation at [https://golang.org/pkg](https://golang.org/pkg)
    – an invaluable resource.


    **Run a Go Program**


    Go program code is compiled and executed using the Go tools. During program development,
    an error-free Go program can be compiled and run by the go run tool. This is useful,
    but if you want to create an executable binary file version that can be executed
    repeatedly and distributed, you can use the go build tool.


    ![image](images/pg16_1.jpg)


    ![image](images/1b.jpg)Open a Command Prompt or Terminal window in your Go “src”
    folder


    ![image](images/2b.jpg)Enter the command go run hello to run the program written
    [here](#chapter01.xhtml_sec4) – it should output the greeting


    ![image](images/pg16_2.jpg)


    ![image](images/3b.jpg)Next, enter the command go build hello to make an executable
    binary version of the program [here](#chapter01.xhtml_sec4) – it should add an
    executable file in your “src” folder


    ![image](images/4b.jpg)Now, twice enter the command hello on Windows, or ./hello
    on Linux or macOS – it should output the traditional greeting two times


    ![image](images/pg16_3.jpg)


    ![image](images/forget.jpg)


    On Windows systems the binary file is given the file extension **.exe**, so the
    file built here is **hello.exe**.


    **Format and Comment Code**


    It is good practice to always ensure your Go source code is properly formatted
    by the go fmt tool before running a program.


    ![image](images/pg17_1.jpg)


    It is also good practice to include explanatory comments in your source code so
    it can be more easily understood by others, and by yourself when revisiting the
    code later. Single-line comments can be added after a // character sequence –
    everything on the line after // is ignored by the compiler. Multi-line comments
    can be added between /* and */ character sequences – this is useful to “comment-out”
    blocks of code, to hide it from the compiler during development.


    ![image](images/1b.jpg)Edit the code in hello.go [here](#chapter01.xhtml_sec4)
    to add a comment, and unnecessary tab spacing (bad formatting)


    ![image](images/pg17_2.jpg)


    ![image](images/2b.jpg)Now, at a prompt, enter the command go fmt hello then reopen
    the source code file to see correct formatting


    ![image](images/pg17_3.jpg)


    ![image](images/snake.jpg)


    Comments should not be “nested”, one inside another.


    ![image](images/hot.jpg)


    The **go fmt** tool provides some simple error checking. For example, omit a final
    **“** double quote and it will provide the line number and position where the
    error occurs and provide the nature of the error as “string literal not terminated”.


    **Explore the VS Code Editor**


    Although you can create Go programs just fine with a command prompt and plain
    text editor, many developers prefer to use a specialized code editor app. These
    offer useful additional features such as syntax highlighting, auto-indentation,
    bracket-matching and code debugging. Perhaps the best free code editor is the
    Visual Studio Code (“VS Code”) app from Microsoft. It’s available for download
    at **[https://code.visualstudio.com/download](https://code.visualstudio.com/download)**
    in versions for Windows, Linux and macOS.


    ![image](images/pg18_1.jpg)


    When you download and install VS Code, you have only got the code editor framework.
    VS Code can actually support many different programming and scripting languages,
    so you have to install an appropriate extension for the one you want to code with.


    ![image](images/1b.jpg)Download and install VS Code


    ![image](images/2b.jpg)To open the “Extensions Marketplace” sidebar, first click
    **View**, **Appearance**, **Show Activity Bar**, then click the **Extensions**
    button on the Activity Bar


    ![image](images/pg18_2.jpg)


    ![image](images/3b.jpg)Next, type “go” into the search box to find the VS Code
    extension for the Go programming language'
