    \n![image](img/8b.jpg)选择`Shortcut（快捷方式）选项卡，然后输入你的工作区目录的路径\n\n![image](img/9b.jpg)点击`Apply（应用）、`OK（确定）关闭对话框，然后双击快捷方式图标在你的“src”文件夹中打开命令行\n\
    \n![image](img/pg13_5.jpg)\n\n![image](img/hot.jpg)\n\nGo 程序可以使用纯文本编辑器编写，例如 Windows\
    \ 的“记事本”应用。拥有一个可以在你的“src”目录文件夹中打开文本编辑器的桌面快捷方式是很有用的。重复此页面上的步骤，但在第 7 步中输入`notepad`\
    \ 作为位置，输入`Go Editor` 作为名称，创建一个另一个实用的桌面快捷方式。\n\n## 编写一个 Go 程序\n\n所有的 Go 程序都从纯文本文件开始，随后被编译成实际的可执行程序。这意味着\
    \ Go 程序可以使用任何纯文本编辑器编写，例如 Windows 的“记事本”应用或 Linux 上的 Nano 应用。\n\n![image](img/pg14_1.jpg)\n\
    \n按照以下步骤创建一个简单的 Go 程序，该程序将输出传统的第一个程序问候：\n\n![image](img/1b.jpg)在你的“src”文件夹中创建一个名为“hello”的子目录\n\
    \n![image](img/pg14_2.jpg)\n\n![image](img/commons.jpg)\n\nsrc/hello/main.go\n\
    \n![image](img/2b.jpg)打开一个纯文本编辑器（如记事本），并按照列出的内容输入此代码以开始程序\n\n```go\npackage main\n\
    ```\n\n![image](img/3b.jpg)在下方两行，按照列出的内容插入此代码\n\n```go\nimport “fmt”\n```\n\n\
    ![image](img/4b.jpg)在再下方两行，精确地添加此代码\n\n```go\nfunc main( ) {\n    fmt.Println(\
    \ “Hello World!” )\n}\n```\n\n![image](img/5b.jpg)将文件保存在“hello”文件夹中，并命名为 main.go\
    \ – 现在完整的程序看起来应该完全像这样：\n\n![image](img/pg14_3.jpg)\n\n![image](img/snake.jpg)\n\
    \n`fmt.Println` 中的大写 P 和小写 L。\n\n![image](img/forget.jpg)\n\n文件夹内文件的安排在 Go 中非常重要。每个主文件以及任何相关文件都必须放置在唯一命名的文件夹中以创建一个包\
    \ – 所以这里的包名为“hello”。\n\n相反页面上程序代码的各个部分可以单独检查，以更清楚地理解每个部分：\n\n### 包的声明\n\n```go\n\
    package main\n```\n\n包的类型在 `package` 关键字之后声明。所有的 Go 程序代码都包含在包中。你可以为作为共享库的包声明你自己的类型，但如果你想将代码编译成可执行程序，则必须声明包“main”。\n\
    \n### 导入的声明\n\n```go\nimport “fmt”\n```\n\n`import` 关键字用于将一个或多个包导入到此包中，以便该程序可以使用这些包的功能。“fmt”\
    \ 包来自 Go 标准库，该库包含在你的 Go 安装中。它提供了 `fmt.Println( ` 函数，用于在该程序中输出文本。注意，包名必须用双引号括起来。导入多个包时，包名列表必须包含在括号内，且每个名称必须单独占一行，如下：\n\
    \n```go\nimport (\n    “fmt”\n    “strings”\n)\n```\n\n### 函数的声明\n\n```go\nfunc\
    \ main( ) {\n    fmt.Println( “Hello World!” )\n}\n```\n\n函数名紧随 `func` 关键字。它后面必须紧跟括号和同一行上的左大括号\
    \ `{`。函数体包含了用于执行程序任务的实际语句。函数体必须以右大括号 `} ` 结束。函数名必须是唯一的，但每个 Go 程序都必须有一个名为“main”的函数，因为这是所有\
    \ Go 程序的起点。\n\n![image](img/forget.jpg)\n\n包名和包类型是两个独立的项目 – 这里包名为 `hello`，但类型是\
    \ `main`。\n\n![image](img/hot.jpg)\n\n你可以在 `GOROOT` 目录的“src”目录中找到 Go 标准库包 – 例如，在\
    \ `C:\\Go\\src`。此外，你可以从官方文档 `[`golang.org/pkg`](https://golang.org/pkg)` 学习每个包\
    \ – 这是一个宝贵的资源。\n\n## 运行 Go 程序\n\nGo 程序代码使用 Go 工具进行编译和执行。在开发期间，没有错误的 Go 程序可以通过\
    \ `go run` 工具编译运行。这很有，但如果你想创建一个可以重复执行和分发的可执行二进制文件版本，可以使用 `go build` 工具。\n\n![image](img/pg16_1.jpg)\n\
    \n![image](img/1b.jpg)在你的 Go “src”文件夹中打开命令提示符或终端窗口\n\n![image](img/2b.jpg)输入命令\
    \ `go run hello` 来运行此处编写的程序 – 它应该会输出问候语\n\n![image](img/pg16_2.jpg)\n\n![image](img/3b.jpg)接下来，输入命令\
    \ `go build hello` 为程序此处制作可执行二进制文件\n\n![image](img/4b.jpg)\n\n![image](img/forget.jpg)\n\
    \n在 Windows 系统上二进制文件名为 `.exe`。\n\n## 格式化和注释\n\n在运行之前，通过 `go fmt` 确保你的 Go 源代码格式正确是一个良好的习惯。\n\
    \n![image](img/pg17_1.jpg)\n\n在源代码中包含解释性注释也是良好的习惯，以便他人和你回顾代码时更容易理解。可以在 `//` 序列后添加单行注释\
    \ – `//` 之后的所有内容会被编译器忽略。可以在 `/*` 和 `*/` 序列之间添加多行注释 – 这在开发期间“注释掉”代码块隐藏它很有用。\n\n\
    ![image](img/1b.jpg)编辑此处的 `hello.go` 以添加不必要的缩进（错误的格式）\n\n![image](img/pg17_2.jpg)\n\
    \n![image](img/2b.jpg)现在，在提示符输入命令 `go fmt hello` 然后重新打开源代码查看正确的格式\n\n![image](img/pg17_3.jpg)\n\
    \n![image](img/snake.jpg)注释不应该“嵌套”，即在一个注释内部。\n\n![image](img/hot.jpg)\n\n`go fmt`\
    \ 工具提供了简单的错误检查。例如，省略最后的双引号 `“`，它将提供错误发生的行号和位置，并提供错误性质为“字符串常量未终止”。\n\n## 探索 VS\
    \ 编辑器\n\n虽然可以使用命令行和纯文本编辑器完美创建 Go 程序，但许多开发者更倾向于使用专门的代码编辑器应用。这些提供了实用的额外功能，如语法高亮、自动缩进、括号匹配和代码调试。也许最好的免费编辑器是来自微软的\
    \ Visual Studio Code (“VS Code”）应用。它可以在 [`code.visual.com/download`](https://code.visual.com/download)\
    \ 下载 Windows、Linux 和 macOS 版本。\n\n![image](img/pg18_1.jpg)\n\n当你下载并安装 VS Code\
    \ 时，你只得到了代码编辑器框架。VS Code 实际上可以支持许多编程和脚本语言，因此你需要为你想要使用的语言安装相应的扩展。\n\n![image](img/1b.jpg)要打开“扩展市场”侧边栏，首先点击\
    \ **View（视图）**、**Appearance（外观）**、**Show Activity Bar（显示活动栏）**，然后点击活动栏上的 **Extensions（扩展）**\
    \ 按钮\n\n"
