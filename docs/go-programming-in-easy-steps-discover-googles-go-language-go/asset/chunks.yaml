    \nGo 编程允许通过返回多个值来处理函数中出现的错误。这使得识别哪个函数返回了错误变得容易，并让你可以使用熟悉的 Go 语言结构来处理错误。\n\n为了处理可能发生的错误，函数签名必须包含\
