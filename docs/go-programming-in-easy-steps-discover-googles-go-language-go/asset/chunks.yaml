  raw: 'Go is a free open-source programming language created at Google by Robert
    Griesemer, Rob Pike, and Ken Thompson – best known for development of the Unix
    operating system. Google released version 1.0 of the Go language (“golang”) in
    March 2012, since when it has gained widespread popularity.


    Go programs are written in plain text, then compiled into machine code by the
    Go compiler to produce an executable binary version.


    ![image](images/pg8_2.jpg)


    The aims of the Go programming language are to be expressive, fast, efficient,
    reliable, and simple to write. Some programming languages, such as C or C++, are
    fast and reliable but not simple. Conversely, other programming languages such
    as Java or Python are simple to write but not so efficient.


    Go is similar to the C programming language in many ways, and is sometimes referred
    to as a “C-like language” or “C for the 21st century”. But Go is much more than
    that, as it adopts good ideas from many other programming languages, yet avoids
    features that lead to complexity or unreliability.


    Perhaps most importantly, Go introduces the ability to take advantage of multi-core
    CPU processing for concurrency using “goroutines” and “channels”. This provides
    the potential for the computer to deal with several things at the same time.


    Although the Go language does not have the class structures found in Object Oriented
    Programming (OOP) languages, such as C++ or Java, its features do provide some
    degree of encapsulation, inheritance, and polymorphism – the three cornerstones
    of OOP.


    ![image](images/pg8_1.jpg)


    The Go gopher – the iconic mascot of the Go programming language.


    ![image](images/hot.jpg)


    You can discover many more programming language books in the In Easy Steps series
    – including C, C++, C#, Java, and Python. Visit [www.ineasysteps.com](http://www.ineasysteps.com)
    to find out more.


