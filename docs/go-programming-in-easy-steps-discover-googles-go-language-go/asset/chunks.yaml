    \ Go 中也是类型），也不能用于本书后面介绍的 slice、map 或 channel 类型。这些都已经是“引用类型”，因此在将它们传递给函数时，不需要指针来访问它们包含的原始值。\n\
    \n![image](img/hot.jpg)\n\n返回此处以复习指针的工作原理。\n\n![image](img/1o.jpg)创建一个需要单个整数指针参数的函数并显示其值\n\
    \n```go\nfunc square( num *int ) {\nfmt.Println( “\\t\\tReceived Address:”, num\
