    \ `6 + 7 * 3` 中，`*` 乘法运算符的默认优先级高于 `+` 加法运算符，因此先执行乘法操作 `7 * 3 = 21`，然后执行加法 `21\
    \ + 6 = 27`。你可能倾向于先执行加法操作，你可以通过给表达式添加括号 `( 6 + 7 ) * 3` 来强制编译器这样做。现在，表达式的评估结果为\
    \ `6 + 7 = 13`，然后是乘法 `13 * 3 = 39`。\n\n![image](img/1g.jpg)在你的“src”文件夹内创建一个名为“force”的目录\n\
