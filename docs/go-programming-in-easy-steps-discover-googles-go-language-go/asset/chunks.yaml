  trans: "\n\n![image](img/6o.jpg)然后，在表单处理程序中，插入语句将格式化后的值写入日志文件\n\n```go\nfile, err\
    \ := os.OpenFile( “htdocs/data.log”, os.O_CREATE|os.O_APPEND|os.O_WRONLY, 0644\
    \ )\nif err != nil {\n    log.Print( err )\n}\ndefer file.Close( )\nlog.SetOutput(\
    \ file )\nlog.Print( lang )\n```\n\n![image](img/7o.jpg)保存更新后的程序文件，然后启动 Web 服务器并访问\
    \ `localhost:8000/form.html` 查看表单的出现\n\n![image](img/8o.jpg)在输入框中输入编程语言名称，然后点击提交按钮提交表单数据\n\
    \n![image](img/hot.jpg)\n\n最常用的请求方法是 `GET` 和 `POST`。`GET` 方法将数据附加到 URL 字符串后面。`POST`\
    \ 方法在请求体中携带数据，因此更安全，并且是从浏览器向服务器传输数据时的首选方法。\n\n![image](img/pg183_1.jpg)\n\n![image](img/9o.jpg)现在，点击浏览器的“后退”按钮并重复提交过程以发送多个请求——每个请求对应不同的编程语言\n\
    \n![image](img/pg183_2.jpg)\n\n![image](img/pg183_3.jpg)\n\n![image](img/10o.jpg)然后，访问\
    \ `localhost:8000/data.log` 查看日志文件中每个提交的表单值\n\n![image](img/pg183_4.jpg)\n\n![image](img/pg183_5.jpg)\n\
    \ndata.log\n\n![image](img/hot.jpg)\n\n为了简单起见，此示例仅提交了一个项，它通过请求对象的 `FormValue()`\
    \ 方法和 HTML `name` 属性值进行引用。对于提交多个项的表单，可以使用 `range` 关键字遍历它们，以引用每个项的键（HTML `name`\
    \ 属性）和值（HTML `value` 属性）。\n\n## 交付动态响应\n\n在接收并记录了请求数据后，按照此处的步骤，程序现在可以评估请求并向 浏览器发送适当的响应。\n\
    \n![image](img/1o.jpg)在表单处理程序的日志语句之后，初始化两个带有默认响应字符串值的变量\n\n```go\ntitle := “<a\
    \ href=’http://www.ineasysteps.com’>**在线查看所有标题</a>”\nisbn := “logo”\n```\n\n![image](img/commono.jpg)\n\
    \nsrc\\server\\main.go\n\n![image](img/2o.jpg)接下来，检查提交的请求值，如果匹配，则分配相应的响应值\n\n\
    ```go\nswitch lang {\ncase “c” :\n    title = “C 语言”\n    isbn = “978-1-84078-840-2”\n\
    case “go” :\n    title = “Go 语言”\n    isbn = “978-1-84078-919-5”\ncase “java”\
    \ :\n    title = “Java”\n    isbn = “978-1-84078-873-0”\ncase “python” :\n   \
    \ title = “Python”\n    isbn = “978-1-84078-812-9”\ncase “sql” :\n    title =\
    \ “SQL”\n    isbn = “978-1-84078-902-7”\n}\n```\n\n![image](img/3o.jpg)现在，构建一个包含响应值的\
    \ HTML 字符串\n\n```go\nresponse := “<!DOCTYPE HTML><title>Web 响应</title>\nresponse\
    \ += “<link rel=’shortcut’ href=’favicon.ico>”\nresponse += “<link rel=’stylesheet’\
    \ href=’style.css>”\nresponse += “<p>” + title\nif isbn != “logo” {\n    response\
    \ += “<br>ISBN:” + isbn\n}\nresponse += “</p><img src=’img/” + isbn + “.png’ alt=’Cover>”\n\
    response += “<img src=’img/power.png’ alt=’Power>”\n\n注意在字符串中使用单引号来区分双引号，以避免过早终止字符串\n\
    \n![image](img/4o.jpg)最后，添加语句发送响应\n\n```go\nio.WriteString( w, response )\n```\n\
    \n![image](img/pg183_1.jpg)\n\n![image](img/5o.jpg)再次保存程序文件并启动 Web 服务器，然后访问 `localhost:8000/form.html`发送请求并接收\n\
    \n![image](img/pg183_2.jpg)\n\n![image](img/pg183_3.jpg)\n\n![image](img/pg183_4.jpg)\n\
    \n![image](img/pg183_5.jpg)\n\n![image](img/hot.jpg)\n\n你可以在 [www.ineasysteps.com](http://www.ineasysteps.com)\
    \ 发现该系列的更多编程语言书籍，包括涵盖 R 语言的\n\n## 总结\n\n- Go 标准库 `net/http` 包提供了创建 Web 服务器的工具。\n\
    - `http.ListenAndServe()` 函数指定监听的地址以及请求处理程序的名称。\n- Web 服务器必须注册路由处理器以响应特定的请求。\n\
    - `http.HandleFunc()` 函数指定要监听的路由以及处理该请求的函数名称。\n- 请求处理函数的签名始终带有 `http.ResponseWriter`\
    \ 对象和 `http.Request` 对象参数。\n- `http.ResponseWriter` 对象有一个 `Write()` 方法，可以接受 `[]byte`\
    \ 切片以发送响应。\n- `io` 包提供了 `WriteString()` 函数，可以将字符串传递给 `http.ResponseWriter` 对象作为响应。\n\
    - 文件可以添加到 Web 服务器程序中，以便响应器的请求进行交付。\n- `http.Dir()` 函数指定根文件系统。\n- `http.FileServer()`\
    \ 函数返回一个针对指定文件系统内容的处理器。\n- `http.Handle()` 函数指定路由以及处理指向所指定文件系统请求的处理器名称。\n\n"
