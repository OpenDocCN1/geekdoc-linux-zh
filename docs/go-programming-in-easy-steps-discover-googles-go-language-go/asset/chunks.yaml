  raw: 'A format specifier can ensure that the output occupies a minimum number of
    spaces by stating the required number of spaces after the % character – for example,
    to ensure that an integer always fills at least seven spaces with the specifier
    %7d. If it is preferable for the blank spaces to be filled with zeros, just add
    a zero to make the specifier into %07d.


    A precision specifier is a . full stop (period) followed by a number that can
    be used with the %f format specifier to determine how many decimal places to display
    – for example, to display two decimal places with %.2f. The precision specifier
    can be combined with the minimum space specifier to control the number of spaces
    and number of decimal places – for example, to display seven spaces including
    two decimal places and empty spaces filled by zeros with %07.2f. By default, empty
    spaces precede the number so it is right-aligned. They can also be added after
    the number to make it left-aligned by prefixing the minimum space specifier with
    a minus sign.


    ![image](images/forget.jpg)


    The **%v** format specifier can be used to display any value, and the **%T** format
    specifier is useful to confirm the data type of any variable.


    ![image](images/1r.jpg)Create a directory named “vars” inside your “src” folder


    ![image](images/commonr.jpg)


    src\vars\main.go


    ![image](images/2r.jpg)Begin a main.go program with package and import declarations


    **package main**


    **import “fmt”**


    ![image](images/3r.jpg)Add a main function that declares and initializes two variables


    **func main( ) {**


    **num := 100**


    **pi := 3.1415926536**


    **// Statements to be inserted here.**


    **}**


    ![image](images/4r.jpg)In the main function, insert statements to output the variable
    values in various formats


    **fmt.Printf( “num: %v type:%T \n”, num, num )**


    **fmt.Printf( “pi: %v type:%T \n\n”, pi, pi )**


    **fmt.Printf( “%%7d displays %7d \n”, num )**


    **fmt.Printf( “%%07d displays %07d \n\n”, num )**


    **fmt.Printf( “Pi is approximately %1.10f \n”, pi )**


    **fmt.Printf( “Right-aligned %20.3f rounded pi \n”, pi )**


    **fmt.Printf( “Left-aligned %-20.3f rounded pi \n”, pi )**


    ![image](images/5r.jpg)Save the program file in the “vars” directory, then run
    the program to see the variable values in the specified formats


    ![image](images/pg25_1.jpg)


    ![image](images/hot.jpg)


    The **fmt.Printf( )** function does not add a new line after the output. You must
    manually include a **\n** newline escape sequence to move the printer head to
    the next line. To display a **%** character with the **fmt.Printf( )** function,
    prefix it with another **%** character as seen here.


    ![image](images/snake.jpg)


    Notice that the floating-point value is rounded when the format specifier allocates
    fewer decimal places – it is not simply truncated.


    **Convert Data Types**


    You will sometimes need to convert the value stored in a variable to a different
    data type. Typically, you will want to convert a string value to a numerical value
    to perform an arithmetical operation. For example, a string might contain the
    numerical characters “42”, but you cannot perform arithmetic on that value unless
    you convert it to an int or float64 data type.


    ![image](images/pg26_1.jpg)


    The Go standard library includes a strconv package containing functions that convert
    to and from the string data type. You make these functions available to your program
    by adding the strconv package to the import declaration.


    The strconv.Atoi( ) function converts a string specified within its parentheses
    into an int data type. It returns the int equivalent of the string, but like other
    functions you will meet in Go it also returns a second value that will be the
    special nil zero value when the conversion succeeds, or an error message if it
    fails. This means you must assign the call to the strconv.Atoi( ) function to
    two variables to receive the two returned values, like this:


    **num, err := strconv.Atoi( “42” )**


    There is also a strconv.Itoa( ) function that converts an int value to a string
    value, but this only returns the single string value.


    If you prefer to convert a string value to a float64 you can use the strconv.ParseFloat(
    ) function. Like strconv.Atoi( ) this returns the float64 equivalent of a string
    and a nil value or error message. It requires the string value and the float size
    (64) as its arguments within its parentheses – for example, strconv.ParseFloat(
    “42”, 64 ).


    Casting conversion between different numeric data types is simply a matter of
    stating the required type followed by parentheses containing the value to be converted.
    For example:


    **var num int = 42**


    **var decimal float64 = float64( num )**


    Interestingly, when a variable of the byte data type (an alias for uint8 – an
    8-bit unsigned integer) is assigned a single character it will store a numerical
    value that is the ASCII character code for that character, which can be easily
    cast to a string data type:


    **var char byte = ‘A’**


    **var str = string( char )**


    ![image](images/hot.jpg)


    ASCII (pronounced as “as-kee”) is an acronym for “American Standard Code for Information
    Interchange” and is the accepted standard for plain text. You can find the full
    range of standard ASCII codes at [www.asciitable.com](http://www.asciitable.com)


    ![image](images/1r.jpg)Create a directory named “cast” inside your “src” folder


    ![image](images/commonr.jpg)


    src\cast\main.go


    ![image](images/2r.jpg)Begin a main.go program with package and import declarations


