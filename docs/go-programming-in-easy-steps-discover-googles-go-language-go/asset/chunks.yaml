    -   结构体可以作为匿名字段嵌入另一个结构体中，这样就可以直接访问它的字段。\n-   面向对象编程的三大基石是封装、继承和多态。\n-   Go 中的封装依赖于包中的数据隐藏，只有大写字母开头的项会被导出。\n\
    -   Go 中的继承依赖于组合，嵌入的结构体为嵌入的结构体提供了字段和方法。\n-   Go 中的多态依赖于它的接口类型，接口只包含方法签名的列表。\n\
    -   任何具有与接口方法签名精确匹配方法的结构体都实现了该接口。\n-   接口可以嵌入到另一个接口中，以提供进一步的抽象来增加额外的的灵活性。\n\n\
    # 7 创建数组\n\n本章演示了如何在 Go 程序中通过索引元素存储多个数据项。\n\n-   创建基础数组\n-   循环遍历元素\n-   切片数组\n\
    -   创建切片\n-   切片与数组\n-   Map 的键和值\n-   总结\n\n## 创建基础数组\n\n数组是一个可以存储多个数据项的变量——与只能存储一个数据的普通变量不同。数据项按顺序存储在编号的数组“元素”中，这些元素从零开始编号。因此，第一个值存储在元素\
    \ 0 中，第二个值存储在元素 1 中，依此类推。\n\n![image](img/pg98_1.jpg)\n\n可以使用 `var` 关键字后跟你自定义的名称，然后跟一个\
    \ `[ ]` 方括号，括号内包含一个指定所需元素数量的整数。这些之后必须紧跟元素可以包含的数据类型。声明的语法如下：\n\n```\nvar arrayName\
    \ [ nElements ] dataType\n```\n\n然后可以通过在方括号中指定元素编号来为每个可用元素单独赋值：\n\n```\narrayName\
    \ [ elementNumber ] = value\n```\n\n或者，也可以通过在“数组字面量”中为每个元素指定值来声明并初始化带有值的数组——这是一个由逗号分隔的列表，并分组在花括号内：\n\
    \n```\narrayName := [ nElements ] dataType { value, value, value }\n```\n\n可以使用数组名后跟包含元素编号的方括号来引用任何单个元素的值。例如，引用第一个元素中的值：\n\
    \n```\narrayName [ 0 ]\n```\n\n数组的所有元素合称为“索引”（index）。数组可以有多个索引——以表示多个维度，而不是普通数组的单维度。具有三个或更多索引的多维数组并不常见，但二维数组常用于存储基于网格的信息，例如坐标。\n\
    \n要创建一个二维数组，只需添加第二对 `[ ]` 方括号来指定所需的元素数量，如下：\n\n```\nvar arrayName [ nElements\
    \ ] [ nElements ] dataType\n```\n\n然后可以通过在方括号中指定元素编号来为每个可用元素单独赋值：\n\n```\narrayName\
    \ [ elementNumber ] [ elementNumber ] = value\n```\n\n![image](img/forget.jpg)\n\
    \n数组编号从零开始——因此包含六个元素的数组中的最后一个元素是五号而不是而不是号。这种编号被称为“零基索引”（zero-based index）。\n\n\
    ![image](img/snake.jpg)\n\n你只能在数组声明中指定的数据类型的数组元素中存储数据。\n\n或者，可以在声明数组时，通过在数组字面量中为每个索引指定值来初始化二维数组并为每个元素赋值：\n\
    \n```\narrayName := [ nElements ] [ nElements ] dataType\n{ { value , value ,\
    \ value } , { value , value , value } }\n```\n\n可以使用数组名后跟包含每个索引编号的方括号来引用任何单个元素的值。例如，第二个索引的第一个元素：\n\
    \n```\narrayName [ 0 ] [ 1 ]\n```\n\n![image](img/1v.jpg)创建一个三个元素的空数组，每个元素只能包含字符串值\n\
    \n```\nvar cars [ 3 ]string\n```\n\n![image](img/commonv.jpg)\n\n`src\\array\\\
    main.go`\n\n![image](img/2v.jpg)接下来，添加语句初始化每个数组元素\n\n```\ncars[ 0 ] = “BMW”\n\
    cars[ 1 ] = “Ford”\ncars[ 2 ] = “Opel”\n```\n\n![image](img/3v.jpg)现在，声明并初始化一个二维数组\n\
    \n```\ncoords := [ 2 ][ 3 ]int { { 1, 2, 3 } , { 4, 5, 6 } }\n```\n\n![image](img/4v.jpg)然后，添加语句显示数组\n\
    \n```go\nfmt.Println(\"Cars:\", cars)\nfmt.Println(\"Second:\", cars[ 1 ])\nfmt.Println(\"\
    X1,Y1:\", coords[ 0 ] [ 0 ])\n```\n（注：此处原文内容似乎存在格式混乱，已根据逻辑重新对齐翻译）\n\n```go\nfmt.Println(\"\
    Cars:\", cars)\nfmt.Println(\"Second:\", cars[ 1 ])\nfmt.Println(\"X1,Y1:\", coords[\
    \ 0 ] [ 0 ])\nfmt.Println(\"X2,Y2:\", coords[ 1 ] [ 1 ])\n```\n（注：根据原文提供的代码片段逻辑，修正为显示输出）\n\
    \n```go\nfmt.Println(\"Cars:\", cars)\nfmt.Println(\"Second:\", cars[ 1 ])\nfmt.Println(\"\
    X1,Y1:\", coords[ 0 ] [ 0 ])\n```\n\n![image](img/snake.jpg)Go 中的数组是固定大小的——一旦创建，就无法添加或删除元素。\n\
    \n## 循环遍历元素\n\n循环和数组是完美的搭档。可以使用循环填充空数组的每个元素，并通过数组来引用值。Go 有一个内置函数 `len()`，它接受数组变量作为参数，并返回元素的数量。这可以在到达数组最后一个元素时使用。\n\
    \n![image](img/1v.jpg)创建一个五个元素的空整数数组\n\n```\nvar arr [ 5 ]int\n```\n\n![image](img/commonv.jpg)\n\
    \n`src\\elems\\main.go`\n\n![image](img/2v.jpg)接下来，添加语句确认数组大小\n\n```\nfmt.Println(\"\
    No. of Elements:\", len( arr ))\n```\n\n![image](img/3v.jpg)现在，添加循环填充每个元素\n\n\
    ```\nfor i := 0 ; i < len( arr ) ; i++ {\n    arr[ i ] = i * i\n}\n```\n\n![image](img/4v.jpg)然后，添加循环引用每个数组元素\n\
    \n```\nfor i := 0 ; i < len( arr ) ; i++ {\n    fmt.Printf(\"Index: %v Value:\
    \ %v\\n\", i, arr[ i ])\n}\n```\n\n![image](img/5v.jpg)将程序保存在“elems”目录，运行程序查看存储在数组元素中的值\n\
    \n![image](img/pg100_2.jpg)数组索引是零基的，所以这里的最后一个元素是索引 4。\n\nGo 提供了一些适用于数组的特殊特性。首先，在使用数组字面量声明数组变量时，可以使用\
    \ `…` 运算符将元素数量设置为数组字面量中值的数量：\n\n```\narr := [ … ]int { 10, 20, 30 } // len( arr\
    \ ) == 3.\n```\n\n你甚至可以通过为每个值指定索引编号来指定每个值存储在哪个元素中，如下：\n\n```\narr := [ … ]int\
    \ { 2: 10, 0: 20, 1: 30 } // arr == [ 20, 30, 10 ].\n```\n\n其次，你可以在循环中使用 `range`\
    \ 关键字来遍历数组，并返回每个元素的索引编号和值。\n\n"
- fmt: "\n![image](images/1v.jpg)Create an integer array of five elements\n\n```\n\
    arr := [ … ]int { 100, 200, 300, 400, 500 }\n```\n\n![image](images/commonv.jpg)\n\
    \nsrc\\range\\main.go\n\n![image](images/2v.jpg)Next, add a statement to confirm\
    \ the array size\n\n```go\nfmt.Println( “No. of Elements:”, len( arr ) )\n```\n\
    \n![image](images/3v.jpg)Now, add a loop to modify each element’s value\n\n```go\n\
    for i , v := range arr {\n    arr[ i ] =v / 10\n}\n```\n\n![image](images/4v.jpg)Then,\
    \ add a loop to reference each array element value\n\n```go\nfor i , v := range\
    \ arr {\n    fmt.Printf( “Index: %v Value: %v \\n”, i, v )\n}\n```\n\n![image](images/5v.jpg)Save\
    \ the program file in a “range” directory, then run the program to see the values\
    \ stored within array elements\n\n![image](images/pg101_1.jpg)\n\n![image](images/hot.jpg)\n\
    \nYou can replace the variable name `i` with the `_` blank identifier to avoid\
    \ an error if you don’t need the index number in the loop statements – see [here](#chapter05.xhtml_sec32).\n\
    \n## Slice Arrays\n\nArrays are sequences whose elements each contain data of\
    \ the same type, but are of a fixed length so are not very versatile. Fortunately,\
    \ Go provides a slice type that represents an underlying array and whose length\
    \ can be changed.\n\n![image](images/pg102_1.jpg)\n\nTo understand the slice type\
    \ it is important to recognize that a slice does not contain any elements itself,\
    \ but is merely a reference to an actual array. The slice type contains only three\
    \ components:\n\n- **Ptr** – (pointer) a pointer to the first element in the array\
    \ accessible by the slice (not necessarily the first array element).\n- **Len**\
    \ – (length) the total number of elements in the slice.\n- **Cap** – (capacity)\
    \ the number of elements between the element referenced by the pointer and the\
    \ last array element.\n\nFor example, a slice of weekdays from an array of day\
    \ names:\n\n![image](images/pg102_2.jpg)\n\nA slice can be created in Go programming\
    \ by assigning an array to a variable that specifies element index numbers of\
    \ a desired lower and upper boundary. These are specified around a : colon character\
    \ between `[ ]` brackets. The number to the left of the colon specifies the index\
    \ number of the starting element to slice – which the slice pointer will reference.\
    \ The number to the right of the colon specifies the index number of the upper\
    \ boundary – to slice all elements up to, but not including, the upper boundary\
    \ element. An assignment for the example depicted above would look like this:\n\
    \n```go\nweekdays := days[ 0 : 5 ]\n```\n\nOptionally, you can omit either of\
    \ the numbers that specify the upper and lower boundaries to use the default values.\
    \ The default value for the lower boundary is 0 (zero) and the default value for\
    \ the upper boundary is the total number of elements in the array.\n\n![image](images/hot.jpg)\n\
    \nSlices are important in Go programming and are seen much more frequently than\
    \ the array type, but it’s important to understand that they are references to\
    \ underlying arrays.\n\nYou can reveal the length of a slice using the built-in\
    \ `len()` function, as with arrays, but you can also check the capacity of a slice\
    \ using a built-in `cap()` function. Comparing the pointer value of a slice with\
    \ the memory address of the array element to which it points, confirms that the\
    \ slice is indeed a pointer reference.\n\n![image](images/1v.jpg)First, create\
    \ an array of seven elements\n\n```go\ndays := [ 7 ]string {“Mon”,”Tue”,”Wed”,”Thu”,”Fri”,”Sat”,”Sun”}\n\
    ```\n\n![image](images/commonv.jpg)\n\nsrc\\slice\\main.go\n\n![image](images/2v.jpg)Create\
    \ a slice that represents the final two array elements\n\n```go\nweekend := days[\
    \ 5 : ]\n```\n\n![image](images/3v.jpg)Now, add statements to display the slice\
    \ contents and type\n\n```go\nfmt.Printf( “Slice weekend: %v \\n”, weekend )\n\
    fmt.Printf( “Type weekend : %T \\n”, weekend )\n```\n\n![image](images/4v.jpg)Add\
    \ statements to display the slice length and capacity\n\n```go\nfmt.Printf( “Length\
    \ weekend: %v \\n”, len( weekend ) )\nfmt.Printf( “Capacity weekend: %v \\n”,\
