    **Assess Logic**


    ![image](images/pg40_1.jpg)


    The logical operators most commonly used in Go programming are listed in the table
    below:


    | **Operator** | Operation |


    | **&&** | Logical-AND |


    | **&#124;&#124;** | Logical-OR |


    | **!** | Logical-NOT |


    The logical operators are used with operands that have boolean values of **true**
    or **false**, or are values that convert to true or false.


    The && logical-AND operator will evaluate two operands and return true only if
    both operands themselves are true. Otherwise, the && logical-AND operator will
    return false. This is used in conditional branching where the direction of a program
    is determined by testing two conditions – if both conditions are satisfied, the
    program will go in a certain direction, otherwise it will take a different direction.


    Unlike the && logical-AND operator, which needs both operands to be true, the
    || logical-OR operator will evaluate its two operands and return true if either
    one of the operands itself returns true. If, however, neither operand returns
    true, then the || logical-OR operator will return false. This is useful in Go
    programming to perform a certain action if either one of two test conditions has
    been met.


    The ! logical-NOT operator is a unary operator that is used before a single operand.
    It returns the inverse value of the given operand, so if the variable a had a
    value of true then !a would have a value of false. The ! logical-NOT operator
    is useful in Go programs to toggle the value of a variable in successive loop
    iterations with a statement like a = !a. This ensures that on each pass the value
    is changed, like flicking a light switch on and off.


    ![image](images/pg40_2.jpg)


    The term “boolean” refers to a system of logical thought developed by the English
    mathematician George Boole (1815-1864).


    ![image](images/1g.jpg)Create a directory named “logic” inside your “src” folder


    ![image](images/commong.jpg)


    src\logic\main.go


    ![image](images/2g.jpg)Begin a main.go program with package and import declarations


    **package main**


    **import “fmt”**


    ![image](images/3g.jpg)Add a main function that declares and initializes two variables


    **func main( ) {**


    **var yes, no bool = true, false**


    **// Statements to be inserted here.**


    **}**


    ![image](images/4g.jpg)In the main function, insert statements to determine whether
    both variables contain true values


    **result := ( yes && no )**


    **fmt.Println( “AND Logic:\tyes && no\t”, result )**


    ![image](images/5g.jpg)Next, insert statements to determine whether either of
    the variables contains a true value


    **result = ( yes || no )**


    **fmt.Println( “OR Logic:\tyes || no\t”, result )**


    ![image](images/6g.jpg)Now, insert statements to display the current value of
    a variable and its inverse value


    **result = !yes**


    **fmt.Println( “NOT Logic:\tyes =”, yes, “\t!yes =”, result )**


    ![image](images/7g.jpg)Save the program file in the “logic” directory, then run
    the program to see the results of logical assessments


    ![image](images/pg41_1.jpg)


    ![image](images/forget.jpg)


    The value returned by the **!** logical-NOT operator is the inverse of the stored
    value – the stored value itself remains unchanged.


    ![image](images/hot.jpg)


    Comparing **false && false** returns **false**, not **true** – demonstrating the
    maxim “two wrongs don’t make a right”.


    **Juggle Bits**


    ![image](images/pg42_1.jpg)


    In computer terms, each byte comprises eight bits that can each contain a 1 or
    a 0 to store a binary number, representing decimal values from 0 to 255\. Each
    bit contributes a decimal component only when that bit contains a 1. Components
    are designated right-to-left from the “Least Significant Bit” (LSB) to the “Most
    Significant Bit” (MSB). The binary number in the bit pattern below is 00110010
    and represents the decimal number 50 (2+16+32):


    ![image](images/pg42_2.jpg)


    It is possible to manipulate individual bit parts of a byte using the Go “bitwise”
    operators listed below:


    | **Operator** | **Name** | **Example Operation** |


    | **&** | AND | **0011 & 0101 = 0001** |


    | **&#124;** | OR | **0011 &#124; 0101 = 0111** |


    | **^** | XOR | **0011 ^ 0101 = 0110** |


    | **^** | NOT | **^0101 = 1010** |


    | **&^** | AND NOT | **0011 &^ 0101 = 0010** |


    | **<<** | Shift left | **0010 << 2 = 1000** |


    | **>>** | Shift right | **1000 >> 2 = 0010** |


    By far the most common use of bitwise operators is to manipulate a compact “bit
    field” representing a set of boolean “flags”. This is a much more efficient use
    of memory than storing boolean flag values in separate variables – a byte data
    type of just one byte can hold a bit field of eight flags, one per bit, whereas
    eight separate byte variables would require eight whole bytes of memory.


    ![image](images/forget.jpg)


    Many Go programmers never use bitwise operators but it is useful to understand
    what they are and how they may be used.


    ![image](images/hot.jpg)


    Each half of a byte is known as a “nibble” (4 bits). The binary numbers in the
    examples in the table describe values stored in a nibble.


    ![image](images/1g.jpg)Create a directory named “bits” inside your “src” folder


    ![image](images/commong.jpg)


    src\bits\main.go


    ![image](images/2g.jpg)Begin a main.go program with package and import declarations


    **package main**


    **import “fmt”**


    ![image](images/3g.jpg)Add a main function that declares and initializes one variable
    comprising eight bits


    **func main( ) {**


    **var flags byte = 10 // Binary 1010 (1x8 0x4 1x2 0x1).**


    **// Statements to be inserted here.**


    **}**


    ![image](images/4g.jpg)In the main function, insert statements to output all the
    bit flag settings


