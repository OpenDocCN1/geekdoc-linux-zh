    **Satisfy Interfaces**


    The third cornerstone of object-oriented programming is that of “polymorphism”
    – a term derived from Greek, meaning “many forms”, that describes the ability
    to assign a different meaning or purpose to an entity according to its context.


    ![image](images/pg92_1.jpg)


    Go programming supports polymorphism with an “interface” type that is created
    using the type keyword, followed by a name of your choice and the interface keyword
    followed by { } curly brackets. The interface body contains only a list of method
    signatures:


    type ***interfaceName*** interface {


    ***methodName returnType***


    ***methodName returnType***


    **}**


    Any struct that has methods that precisely match the name and signature of all
    methods listed in the interface will implement that interface. In Go programming
    terms, they are said to “satisfy” the interface. The advantage of this is that
    it allows the program to have various structs with like-named attached methods
    that each perform a different task – i.e. they are polymorphic.


    ![image](images/1bl.jpg)Start a program by creating an interface that lists two
    method signatures, that each require no arguments and that each return a string


    **type bird interface {**


    **speak( ) string**


    **move( ) string**


    **}**


    ![image](images/commonb.jpg)


    src\poly\main.go


    ![image](images/2bl.jpg)Next, create an empty struct and attach methods that will
    satisfy the interface


    **type parrot struct { }**


    **func ( parrot ) speak( ) string {**


    **return “Squawk, squawk!”**


    **}**


    **func ( parrot ) move( ) string {**


    **return “A parrot flies away.”**


    **}**


    ![image](images/hot.jpg)


    Notice that you can omit a parameter name from the receiver and simply state the
    struct name, unless you need to use a parameter name in a method statement.


    ![image](images/3bl.jpg)Now, create another empty struct and attach methods that
    will also satisfy the interface


    **type chicken struct { }**


    **func ( chicken ) speak( ) string {**


    **return “Cluck, cluck!”**


    **}**


    **func ( chicken ) move( ) string {**


    **return “Chickens cannot fly.”**


    **}**


    ![image](images/4bl.jpg)Add a function that receives the interface as an argument
    and calls the implemented methods


    **func nudge( b bird ) {**


    **fmt.Printf( “\n%v \n”, b.speak( ) )**


    **fmt.Printf( “%v \n\n”. b.move( ) )**


    **}**


    ![image](images/5bl.jpg)Add a main function with statements that create instances
    of each struct, then call their like-named methods


    **func main( ) {**


    **var bird1 parrot**


    **var bird2 chicken**


    **nudge( bird1 )**


    **nudge( bird2 )**


    **}**


    ![image](images/6bl.jpg)Save the program file in a “poly” directory, then run
    the program to see the different outputs


    ![image](images/pg93_1.jpg)


    ![image](images/pg93_2.jpg)


    ![image](images/hot.jpg)


    Go automatically recognizes when an interface is implemented.


    ![image](images/forget.jpg)


    When a struct implements an interface, the methods attached to the struct become
    “honorary members” of the interface – so that when the interface is passed as
    an argument, the function can call those methods via its interface parameter.


    **Embed Interfaces**


    Just as structs can be embedded in other structs, so can interfaces be embedded
    in other interfaces. This allows you to create a further level of abstraction
    in your programs for even greater flexibility. Go will automatically identify
    which struct implements each interface.


    ![image](images/pg86_1.jpg)


    It is helpful to understand interface embedding, as many of the Go standard library
    packages use this technique. For example, the io (input/output) package contains
    a ReadWriter interface that embeds Reader and Writer interfaces, which contain
    Read and Write method signatures for reading and writing files.


    ![image](images/1bl.jpg)Create two interfaces that each contain two identical
    method signatures, which all return a string


    **type bird interface {**


    **speak( ) string**


    **move( ) string**


    **}**


    **type human interface {**


    **speak( ) string**


    **move( ) string**


    **}**


    ![image](images/commonb.jpg)


    src\abstr\main.go


    ![image](images/2bl.jpg)Next, create another interface that embeds the first two
    interfaces


    **type creature interface {**


    **bird**


    **human**


    **}**


    ![image](images/3bl.jpg)Now, add an empty struct and attach methods that satisfy
    the first (and second) interface


    **type parrot struct{ }**


    **func ( parrot ) speak( ) string {**


    **return “Squawk, squawk!”**


    **}**


    **func ( parrot ) move( ) string {**


    **return “A parrot flies away.”**


    **}**


    ![image](images/hot.jpg)


    Instances of the parrot type will call the methods in Step 3.


    ![image](images/4bl.jpg)Now, add another empty struct and attach methods that
    satisfy the (first and) second interface – and therefore also now satisfies the
    third interface


    **type person struct{ }**


    **func ( person ) speak( ) string {**


    **return “Hi, there!”**


    **}**


    **func ( person ) move( ) string {**


    **return “A person walks away.”**


    **}**


    ![image](images/5bl.jpg)Add a function that receives the third interface as an
    argument and calls the implemented methods


    **func nudge( c creature) {**


    **fmt.Printf( “\n%v \n”, c.speak( ) )**


    **fmt.Printf( “%v \n\n”. c.move( ) )**


    **}**


    ![image](images/6bl.jpg)Add a main function with statements that create instances
    of each struct, then call their like-named methods


    **func main( ) {**


    **var bird1 parrot**


    **var human1 person**


    **nudge( bird1 )**


    **nudge( human1 )**


    **}**


    ![image](images/7bl.jpg)Save the program file in a “abstr” directory, then run
    the program to see the different outputs


    ![image](images/pg95_1.jpg)


    ![image](images/pg95_2.jpg)


    ![image](images/hot.jpg)


    Instances of the **person** type will call the methods in Step 4.


    ![image](images/forget.jpg)


    Method signatures may also specify a parameter list and multiple return types.


    **Summary**


    •Multiple related items of data can be grouped together in a Go struct type.


    •The { } curly brackets of a struct contain a list of name and type pairs that
    are fields defining what the struct will contain.


    •An instance of a struct can be created as a variable declared with the name of
    the struct as its type.


    •An individual field of a struct can be initialized by assigning a value to the
    instance name and dot-suffixed field name.


    •An instance of a struct can be created and initialized by assigning a struct
    literal to a variable name.'
