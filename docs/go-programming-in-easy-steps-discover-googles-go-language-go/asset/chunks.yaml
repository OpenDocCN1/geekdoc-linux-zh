  trans: "\n\n当多个 goroutine 在不同的时间向通道发送消息时，程序可能会在等待从较慢的通道接收消息时阻塞进度。Go 提供了一种解决方案来处理这种阻塞操作，即在\
    \ `select` 语句块中同时监听来自多个通道的消息。它的语法与这里 描述的 `switch` 语句相似，但 `select` 语句会阻塞，直到它的某个\
    \ `case` 语句找到匹配项。当找到匹配项时，与该 `case` 语句相关的语句将被执行。这种组合 goroutine 和通道的能力是 Go 编程语言的一项强大特性。\n\
    \n![image](img/pg166_1.jpg)\n\n为了持续监听通道消息，可以将 `select` 语句封装在无限 `for` 循环内部。可以通过包含一个带有关联语句的\
    \ `case` 语句来退出循环，该语句将 `break` 到带有外部标签（label）的循环。\n\nGo 标准库 `time` 包提供了一个实用的 `After()`\
    \ 函数，可以用于创建一个“超时”来限制监听循环的执行时间。它需要一个持续时间作为参数，并返回一个 `time.Time` 类型的通道——该通道代表当前时间加上持续时间后的未来时间。使用\
    \ `case` 语句测试当前时间何时匹配超时通道可以用于退出监听循环。\n\n![image](img/1p.jpg)开始导入 Go 标准库 `time`\
    \ 包，以等待 goroutine 并创建超时\n\n```go\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n```\n\n\
    ![image](img/commonp.jpg)\n\nsrc\\select\\main.go\n\n![image](img/2p.jpg)接下来，在\
    \ main 函数中创建一个超时通道和两个空通道\n\n```go\nc0 := time.After( 7 * time.Second )\nc1 :=\
    \ make( chan string )\nc2 := make( chan string )\n```\n\n![image](img/3p.jpg)现在，添加两个各传递通道的\
    \ goroutine 调用\n\n```go\ngo fastCount( c1 )\ngo slowCount( c2 )\n```\n\n![image](img/4p.jpg)在\
    \ main 函数之后，添加两个被调用的函数，这些函数将以不同的间隔发送通道消息\n\n```go\nfunc fastCount( c1 chan string\
    \ ) {\n\tfor {\n\t\ttime.Sleep( 1 * time.Second )\n\t\tc1 <- time.Now().Format(\
    \ “04:05” )\n\t}\n}\n\nfunc slowCount( c2 chan string ) {\n\tfor {\n\t\ttime.Sleep(\
    \ 2 * time.Second )\n\t\tc2 <- time.Now().Format( “04:05” )\n\t}\n}\n```\n\n![image](img/5p.jpg)现在，回到\
    \ main 函数，添加一个无限循环来接收来自三个通道中任何一个的消息\n\n![image](img/pg167_2.jpg)\n\n![image](img/6p.jpg)将程序文件保存在“select”目录中，然后运行程序以查看通道消息\n\
    \n![image](img/pg167_1.jpg)\n\n![image](img/snake.jpg)\n\n一个无标签的 `break` 语句只会跳出\
    \ `select` 语句——允许 `for` 循环继续！带标签的 `break` 语句会同时跳出 `select` 语句和无限 `for` 循环。\n\n\
    ### 同步 Goroutine\n\n无缓冲通道的阻塞操作（即发送操作阻塞发送端 goroutine，直到另一个 goroutine 在同一通道上接收交付）会导致发送和接收端\
    \ goroutine 发生同步。事实上，无缓冲通道有时被称为“同步通道”。\n\n![image](img/pg168_1.jpg)\n\n因此，通道可以用于将\
    \ goroutine 连接在“流水线（pipeline）”中，其中从一个 goroutine 发送的项是另一个 goroutine 接收到的项。流水线中的每个\
    \ goroutine 都将等待通道被“清空”后才沿流水线发送下一个项目。\n\n默认情况下，通道既可以发送也可以接收，但当你将通道传递给 goroutine\
    \ 时，你可以在函数参数中指定该通道是仅允许发送还是仅允许接收项目。在参数中通过在 `chan` 关键字前加上 `<-` 运算符来指定只发送通道，如下所示：\n\
    \n```go\nfunc funcName ( paramName <-chan dataType )\n```\n\n相反，在参数中通过在 `chan`\
    \ 关键字后加上 `<-` 运算符来指定只接收通道，如下所示：\n\n```go\nfunc funcName ( paramName chan<- dataType\
    \ )\n```\n\n建议指定单一的允许方向，以减少程序中出现漏洞的可能性。\n\n![image](img/1p.jpg)通过创建两个用于整数项目的无缓冲通道来开始\
    \ main 函数\n\n```go\nnums := make( chan int )\nsqrs := make( chan int )\n```\n\n\
    ![image](img/commonp.jpg)\n\nsrc\\synchronize\\main.go\n\n![image](img/2p.jpg)接下来，添加一个传递通道的\
    \ goroutine 调用，这将开始一个流水线\n\n```go\ngo count( nums )\n```\n\n![image](img/3p.jpg)现在，添加一个传递两个通道的\
    \ goroutine 调用，这将继续该流水线\n\n```go\ngo square( nums, sqrs )\n```\n\n![image](img/4p.jpg)在\
    \ main 函数之后，添加第一个被调用的函数，它有一个只接收通道，当流水线清空时，它将逐个发送 10 个独立的整数\n\n```go\nfunc count(\
    \ nums chan<- int ) {\n\tfor i := 1 ; i <= 10 ; i++ {\n\t\tnums <- i\n\t}\n}\n\
    ```\n\n![image](img/5p.jpg)现在，回到 main 函数，![image](img/5....)./5p.jpg，添加第二个被调用的函数，它有一个只发送通道和一个它接收发送的通道\n\
    \n```go\nfunc square( nums <-chan int, sqrs chan<- int ) {\n\tfor i := 1 ; i <=\
    \ 10 ; i++ {\n\t\tnum := <- nums\n\t\tsqrs <- num\n\t}\n}\n```\n\n![image](img/6p.jpg)现在，回到\
    \ main 函数，添加一个循环来接收流水线结束的结果\n\n```go\nfor i := 1 ; i <= 10 ; i++ {\n\tnum := <-\
    \ sqrs\n\tfmt.Printf( “%v = %v \\n”, i, num )\n}\n```\n\n![image](img/7p.jpg)将程序文件保存在“synchronize”目录中，然后运行程序以查看结果\n\
    \n/。\n\n### 线程池 (Worker Pools)\n\n如果你的程序有一个任务队列，且结果产生的顺序并不重要，你可以采用“线程池（worker\
    \ pool）”——使用 goroutine 和通道。\n\n![image 线程池允许你从多个并发调用中发送任务，由 Go 调度器决定执行顺序。你可以使用\
    \ WaitGroup 等待多个 goroutine 完成，或者简单地清空通道以确保它们已完成。![image](img/pg170_1.jpg)示例所示：\n\
    \n![image](img/1p.jpg)开始导入 Go 标准库 `time` 包，以延迟 worker goroutine 函数\n\n```go\n\
    import (\n\t\"fmt\"\n\t\"time\"\n)\n```\n\n![image](img/commonp.jpg)\n\nsrc\\\
    workers\\main.go\n\n![image](img/2p.jpg)接下来，在 main 函数中，初始化 `jobs` 总数变量，并创建两个大小为总数的缓冲通道\n\
    \n```go\nnumJobs := 10\njobs := make( chan int, numJobs )\nresults := make( chan\
    \ int, numJobs )\n```\n\n![image](img/3p.jpg)现在，添加三个各传递 ID 任意两个通道的 goroutine 调用\n\
    \n```go\ngo worker( 1, jobs, results )\ngo worker( 2, jobs, results )\ngo worker(\
    \ 3, jobs, results )\n```\n\n![image](img/4p.jpg)为 10 个作业中的每一个发送一个整数，然后关闭该通道以表示队列中所有的作业\n\
    \n```go\nfor i := 1 ; i <= numJobs ; i++ {\n\tjobs <- i\n}\nclose( jobs )\n```\n\
    \n![image](img/5p.jpg)在 main 函数之后，添加调用的 worker 函数，它接受 worker ID 数字，有一个从其接收作业的只发送通道，以及一个它向其发送结果的只接收通道。\n\
    \n```go\nfunc worker( id int, jobs <-chan int, results chan<- int ) {\n\tfor job\
    \ := range jobs {\n\t\tfmt.Print( “Worker “, id, “ ran Job “, job )\n\t\tfmt.Printf(\
    \ “ …%v x %v = %v \\n”, job, job, job*job )\n\t\ttime.Sleep( 1 *time.Second )\n\
    \t\tresults <- job\n\t}\n}\n```\n\n![image](img/6p.jpg)现在，回到 main 函数，添加一个循环来接收流水线结束的结果\n\
    \n```go\nfor i := 1 ; i <= numJobs ; i++ {\n\tnum := <- results\n}\n```\n\n"
