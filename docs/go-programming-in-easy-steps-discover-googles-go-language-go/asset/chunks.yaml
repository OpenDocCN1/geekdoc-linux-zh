    6


    Build Structures


    ***This chapter demonstrates how data and functions can be contained in a “struct”
    that can represent object-oriented programming in the Go language.***


    [**Group Data**](#chapter06.xhtml_sec39)


    [**Attach Methods**](#chapter06.xhtml_sec40)


