  trans: "\n随机化模式基于默认的“种子”（seed），该种子在每次程序运行时都会返回相同的伪随机顺序。这可能正是你想要的，但通常情况下，在每次程序运行时生成不同的顺序会更理想。为了实现这一点，你必须指定一个自定义种子作为整数参数传递给\
    \ `rand.Seed()` 函数，该种子在每次程序运行时都应该是唯一的。为了这个目的，可以通过调用 `time.Now()` 函数并使用 `Time`\
    \ 数据类型的 `UnixNano()` 方法提取自 Unix 纪元（Epoch）以来流过的纳秒整数计数，来使用当前系统时间。此值在每次程序运行时都是不同的，因此将此整数作为\
    \ `rand.Seed()` 函数的参数，可以确保每次程序运行时都会生成不同的伪随机顺序。\n\n![image](img/1r.jpg)在程序中导入 Go\
    \ 标准库 `math/rand` 包，以及用于设置随机种子的 `time` 包和用于转换随机数的 `strconv` 包\n\n```go\nimport\
    \ (\n\t\"fmt\"\n\t\"math/rand\"\n\t\"strconv\"\n\t\"time\"\n)\n```\n\n![image](img/commonr.jpg)\n\
    \nsrc\\lotto\\main.go\n\n![image](img/2r.jpg)接下来，为随机生成器指定一个唯一的种子\n\n```go\nrand.Seed(time.Now().UnixNano())\n\
    ```\n\n![image](img/3r.jpg)现在，生成一个从 0 到 58 的整数切片\n\n```go\nnums := rand.Perm(59)\n\
    ```\n\n![image](img/4r.jpg)然后，增加范围使其变为 1-59（包含边界）\n\n```go\nfor i := 0; i < len(nums);\
    \ i++ {\n\tnums[i]++\n}\n```\n\n![image](img/hot.jpg)\n\n在计算中，Epoch（Unix 纪元）是指\
    \ 1970 年 1 月 1 日午夜的时间。\n\n![image](img/5r.jpg)在格式化字符串中，在连字符字符周围按照伪随机顺序分配前六个数字\n\
    \n```go\nstr := \"\\nYour Six Lucky Numbers: \"\nfor i := 0; i < 6; i++ {\n\t\
    str += strconv.Itoa(nums[i])\n\tif i != 5 {\n\t\tstr += \" - \"\n\t}\n}\n```\n\
    \n![image](img/6r.jpg)最后，显示格式化后的字符串\n\n```go\nfmt.Println(str)\n```\n\n![image](img/7r.jpg)将程序文件保存在“lotto”目录中，然后反复运行程序查看不同的随机数\n\
    \n![image](img/pg141_1.jpg)\n\n![image](img/pg141_2.jpg)\n\n这里的随机数范围是 1 到 59 ——\
    \ 用于玩英国乐票（UK Lotto）或美国纽约乐票（US New York Lotto）。\n\n![image](img/pg141_3.jpg)\n\n\
    ![image](img/forget.jpg)\n\n`int` 数字数字必须转换为 `string` 数据类型才能拼接。\n\n### 总结\n\n-\
    \ 字符串是字符的集合，类似于数组中的元素。\n- 内置函数 `len()` 返回作为参数的指定字符串中的字符数量。\n- `strings` 包包含用于字符串操作的函数，例如\
    \ `Join()` 拼接函数。\n- `Fields()` 和 `Split()` 函数分别从指定的字符串参数中返回子字符串数组。\n- `Contains()`\
    \ 和 `Index()` 函数可用于在字符串参数中查找指定的子字符串。\n- `Count()` 函数报告子字符串在指定的字符串参数中出现的次数。\n-\
    \ `HasPrefix()` 和 `HasSuffix()` 函数可用于识别字符串参数的开头和结尾。\n- `Replace()` 函数可以替换子字符串。\n\
    - 使用 `ToUpper()`、`ToLower()` 和 `ToTitle()` 函数可以更改字符的大小写。\n- `Trim()` 函数可以移除前后的空格。\n\
    - `strconv` 包包含 `Atoi()` 和 `Itoa()` 函数，它们可以在字符串和 `int` 数据类型之间转换。\n- `math` 包包含数学函数（如\
    \ `math.Pow()`）以及数学常量（如 `math.Pi`）。\n- 小数值可以使用 `math.Floor()`、`math.Ceil()`、`math.Round()`\
    \ 和 `math.Trunc()` 舍入到最近整数。\n- `math/rand` 包提供了生成伪随机数的函数。\n- `rand.Perm()` 函数返回一个从\
    \ 0 到指定参数数字的随机整数序列。\n- `rand.Seed()` 函数可以为随机数生成器指定自定义种子整数。\n- 通过调用 `time.Now().UnixNano()`\
    \ 函数，可以在每次程序运行时指定一个唯一的随机种子。\n\n# 10. 处理输入\n\n*本章演示了如何处理用户输入，以及如何使用 Go 标准库 `os`、`bufio`\
    \ 和 `io/ioutil` 包来读写文本文件。*\n\n- 获取用户输入`、`fmt.Scanln()` 和 `fmt.Scanf()` 从标准输入读取内容。这些函数中的每一个都会返回扫描到的项目数量以及任何错误。如果没有遇到错误，错误值将为\
    \ `nil`。\n\n```go\nimport (\n\t\"fmt\"\n\t\"math/rand\"\n\t\"time\"\n)\n\nfunc\
    \ main() {\n\trand.Seed(time.Now().UnixNano())\n\tvar num int = rand.Intn(20)\
    \ + 1\n\tvar guess int = 0\n\tvar flag bool = true\n\n\tfmt.Print(\"\\nGuess My\
    \ Number 1-20: \")\n\tfor flag {\n\t\t_, err := fmt.Scan(&guess)\n\t\tif err !=\
    \ nil {\n\t\t\tfmt.Println(err)\n\t\t} else if guess > num {\n\t\t\tfmt.Print(\"\
    Too High, Try Again: \")\n\t\t} else if guess < num {\n\t\t\tfmt.Print(\"Too Low,\
    \ Try Again: \")\n\t\t} else if guess == num {\n\t\t\tfmt.Println(\"Correct -\
    \ My Number Is\", num)\n\t\t\tflag = false\n\t\t}\n\t}\n}\n```\n\n## 缓冲区输入\n\n\
    当你想要将较大项目的数据收集到程序中时，通常情况下将数据流存储在内存缓冲区中更好。Go 标准库 `bufio`（缓冲输入/输出）包提供了一个 `Scanner`\
    \ 类型，它是一个具有多个用于处理数据流有用方法的内存缓冲区。你可以通过导入 `bufio` 包在程序中使用它。\n\n![image](img/pg146_1.jpg)\n"
- fmt: "\nA `Scanner` instance is first created by specifying a source from which\
    \ to read data as an argument to the `bufio` package’s `NewScanner()` function.\
    \ When the source is to be user input, you can import the Go standard library\
    \ `os` package and specify `os.Stdin` (standard input) as the argument to `NewScanner()`.\n\
    \nThe `Scanner` instance has a `Scan()` method that reads all the user input and\
    \ a `Text()` method that returns the input that has been read as a single string\
    \ value.\n\nThe `Scanner` instance also has an `Err()` method that will return\
    \ any read error. If no error is encountered, the error value will be `nil` as\
    \ usual. It is useful to check for errors after calling the `Scan()` method and\
    \ `Text()` method.\n\nIf you want to separate the input into individual string\
    \ items, you can import the Go standard library `strings` package and specify\
    \ the input to its `Fields()` function, to split the string into words.\n\n![image](images/1g.jpg)Begin\
    \ by importing the Go standard library `bufio`, `os`, and `strings` packages into\
    \ a program, to handle input\n\n```go\nimport (\n\t\"fmt\"\n\t\"bufio\"\n\t\"\
    os\"\n\t\"strings\"\n)\n```\n\n![image](images/commong.jpg)\n\nsrc\\buffer\\main.go\n\
    \n![image](images/2g.jpg)Next, request user input\n\n```go\nfmt.Print( \"\\nEnter\
    \ Text:\" )\n```\n\n![image](images/3g.jpg)Now, create a `Scanner` instance to\
    \ store the user input in a memory buffer, then read the user input\n\n```go\n\
    scanner := bufio.NewScanner( os.Stdin )\nscanner.Scan( )\n```\n\n![image](images/4g.jpg)Then,\
    \ output an error if one occurred or the stored data\n\n```go\nif scanner.Err(\
    \ ) != nil {\n\tfmt.Println( scanner.Err( ) )\n} else {\n\tfmt.Println( scanner.Text(\
    \ ) )\n}\n```\n\n![image](images/5g.jpg)Next, create a new `Scanner` instance\
    \ to store other user input in a memory buffer\n\n```go\nfmt.Print( \"\\nEnter\
    \ Text:\" )\nscanner = bufio.NewScanner( os.Stdin )\nscanner.Scan( )\n```\n\n\
    ![image](images/6g.jpg)Then, store individual items of the user input in individual\
    \ elements of a slice\n\n```go\nwords := strings.Fields( scanner.Text( ) )\n```\n\
    \n![image](images/7g.jpg)Finally, output an error if one occurred, or list the\
    \ individual items of user input\n\n```go\nif scanner.Err( ) != nil {\n\tfmt.Println(\
    \ scanner.Err( ) )\n} else {\n\tfor i, v := range words {\n\t\tfmt.Printf( “%v:\
    \ %v \\n”, i, v )\n\t}\n}\n```\n\n![image](images/8g.jpg)Save the program file\
    \ in a “buffer” directory, then run the program to see the user input\n\n![image](images/pg147_1.jpg)\n\
    \n![image](images/hot.jpg)\n\nThe `if` conditional test is made as the `Scan()`\
    \ method returns a boolean `true` value while reading input, but returns `false`\
    \ when it reaches the end on input.\n\n## Command Flags\n\nThe command to run\
    \ your program can recognize any number of parameters, so you can pass a space-separated\
    \ list of argument values to the program when you run it. The Go standard library\
    \ `os` (operating system) package provides an `Args` slice, which stores these\
    \ argument values in individual elements. You can make this available to your\
    \ program by importing the `os` package.\n\n![image](images/pg148_1.jpg)\n\nIt\
    \ is important to note that the very first element in `os.Args` will always contain\
    \ the path to your program – argument values are then stored sequentially in subsequent\
    \ elements. You can reference the argument values using `[]` square brackets as\
    \ you would with any other slice – for example, the first argument value as `os.Args[1]`.\n\
    \n![image](images/1g.jpg)Begin by importing the Go standard library `os` package\
    \ into a program, to store command-line arguments\n\n```go\nimport (\n\t\"fmt\"\
    \n\t\"os\"\n)\n```\n\n![image](images/commong.jpg)\n\nsrc\\params\\main.go\n\n\
    ![image](images/2g.jpg)Next, add a loop to display the program’s default location\
    \ on your system, together with any passed-in arguments\n\n```go\nfor i, v :=\
    \ range os.Args {\n\tfmt.Printf( “Argument %v: %v \\n”, i, v )\n}\n```\n\n![image](images/3g.jpg)Now,\
    \ display the final passed-in argument\n\n```go\nfmt.Println( “\\nLast Argument:\"\
    , os.Args[ len( os.Args )-1 ] )\n```\n\n![image](images/4g.jpg)Save the program\
    \ file in a “params” directory, then run the program with command-line arguments\
    \ to see the output\n\n![image](images/pg148_2.jpg)\n\n![image](images/hot.jpg)\n\
    \nRun `go build params` to compile the program, then run it with the command `params\
    \ a b c` to see the local program path instead of its default system location.\n\
    \nThe Go standard library `flag` package provides functions for more advanced\
    \ command-line processing. You can make these available to your program by importing\
    \ the `flag` package.\n\n![image](images/pg149_1.jpg)\n\nYou define flags using\
    \ the `flag` package’s `String()`, `Int()`, or `Bool()` functions. These each\
    \ require three arguments to specify a flag name, default value, and a help message\
    \ for that flag. They return the address of an appropriate variable data type\
    \ to store the value. The user can optionally specify an alternative value for\
    \ each flag at the command-line, prefixing the flag name with a hyphen. The `flag`\
    \ package’s `Parse()` function applies the user’s values to the flag.\n\n![image](images/1g.jpg)Begin\
    \ by importing the Go standard library `flag` package into a program, to parse\
    \ command-line flags\n\n```go\nimport (\n\t\"fmt\"\n\t\"flag\"\n)\n```\n\n![image](images/commong.jpg)\n\
    \nsrc\\flags\\main.go\n\n![image](images/2g.jpg)Next, define three command-line\
    \ flags\n\n```go\ntxt := flag.String( “txt”, “C#”, “A string” )\nnum := flag.Int(\
    \ “num”, 8, “An integer” )\nsta := flag.Bool( “sta”, false, “A boolean” )\n```\n\
    \n![image](images/3g.jpg)Now, process the flags and display their values\n\n```go\n\
    flag.Parse( )\nfmt.Println( “\\nText:\", *txt )\nfmt.Println( “Number:”, *num,\
    \ “ Status:”, *sta )\n```\n\n![image](images/4g.jpg)Save the program file in a\
    \ “flags” directory, then run the program without and with input to see the flag\
    \ values\n\n![image](images/pg149_2.jpg)\n\n![image](images/forget.jpg)\n\nYou\
    \ need to use the `*` dereference operator to reference the value stored at the\
    \ address of each flag.\n\n## Read Files\n\nThe Go standard library `io` package\
    \ contains an `ioutil` (input/ output) package that provides functions to read\
    \ text files. You make this available to your program by importing `io/ioutil`.\n\
    \n![image](images/pg150_1.jpg)\n\nThe `ioutil` package’s `ReadFile()` function\
    \ takes the path to a text file as its argument, and returns the entire text file\
    \ content and any read error. If no error is encountered, the error value will\
    \ be `nil`. It is good practice to check for errors after each file operation.\n\
    \nFor finer control when reading text files, you can specify the path to a text\
    \ file as an argument to the `os` package’s `Open()` function. This simply opens\
    \ the text file, for reading only, and returns an `os.File` type and any read\
    \ error. The `file` type has `Read()`, `Seek()`, and `Close()` methods that allow\
    \ you to process the text file.\n\nThe `Seek()` method determines the position\
    \ at which to begin reading from the opened file. It requires two arguments to\
    \ specify an offset position number and a zero (0) if this is relative to the\
    \ start of the file, or one (1) if it is relative to the current position.\n\n\
    The `Read()` method requires a byte slice argument whose length will determine\
    \ the number of bytes (characters) to read from the specified position. This method\
    \ returns the number of bytes read and any read error.\n\nThe `Close()` method\
    \ needs no arguments but must be called after completing other operations on an\
    \ opened file. So that this requirement is not forgotten, you can call the `Close()`\
    \ method with the `defer` keyword immediately after opening a file. This will\
    \ then automatically close the file at the end of the enclosing function.\n"
