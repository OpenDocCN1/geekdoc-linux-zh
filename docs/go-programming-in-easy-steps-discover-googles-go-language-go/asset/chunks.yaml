    ![image](images/pg150_1.jpg)


    The ioutil package’s ReadFile( ) function takes the path to a text file as its
    argument, and returns the entire text file content and any read error. If no error
    is encountered, the error value will be nil. It is good practice to check for
    errors after each file operation.


    For finer control when reading text files, you can specify the path to a text
    file as an argument to the os package’s Open( ) function. This simply opens the
    text file, for reading only, and returns an os.File type and any read error. The
    file type has Read( ), Seek( ), and Close( ) methods that allow you to process
    the text file’s content.


    The Seek( ) method determines the position at which to begin reading from the
    opened file. It requires two arguments to specify an offset position number and
    a zero (0) if this is relative to the start of the file, or one (1) if it is relative
    to the current position.


    The Read( ) method requires a byte slice argument whose length will determine
    the number of bytes (characters) to read from the specified position. This method
    returns the number of bytes read and any read error.


    The Close( ) method needs no arguments but must be called after completing other
    operations on an opened file. So that this requirement is not forgotten, you can
    call the Close( ) method with the defer keyword immediately after opening a file.
    This will then automatically close the file at the end of the enclosing function.


