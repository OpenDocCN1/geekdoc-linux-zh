    second slice, then describe the amended first slice


    **nums = append( nums, more[ 0 ] )**


    **describe( nums )**


    ![image](images/5v.jpg)Remove the first element of the first slice, then describe
    the amended slice once more


    **copy( nums[ 0 : ], nums[ 1 : ] )**


    **nums = nums[ : len( nums ) - 1 ]**


    **describe( nums )**


    ![image](images/6v.jpg)After the main function, add the function that describes
    the first slice’s element values, length, and capacity


    **func describe( nums [ ]int ) {**


    **fmt.Printf( “\n%v Length: %v ”, nums, len( nums ) )**


    **fmt.Printf( “Capacity: %v \n”, cap( nums ) )**


    **}**


