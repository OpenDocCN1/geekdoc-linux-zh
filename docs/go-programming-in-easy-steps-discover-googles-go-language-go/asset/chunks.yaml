    \ if the first is greater in value than the second, or it will return false if\
    \ it is equal or less in value. The `<` “less than” operator makes the same comparison\
    \ but returns `true` if the first operand is less in value than the second, otherwise\
    \ it returns false. Typically, a `>` “greater than” or `<` “less than” operator\
    \ is used to test the value of an iteration counter in a loop structure.\n\nAdding\
    \ the `=` assignment operator after a `>` “greater than” operator or a `<` “less\
    \ than” operator makes them also return true if the two operands are exactly equal\
    \ in value.\n\n![image](images/hot.jpg)\n\nThe comparison operators are also known\
