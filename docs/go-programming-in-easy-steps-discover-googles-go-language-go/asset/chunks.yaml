    \n### 传递引用\n\n示例此处证明了在 Go 编程中，参数默认是“值传递”的——函数接收的是参数的副本，而不是原始参数。但很多时候，你可能希望函数修改原始参数。这可以通过向函数传递一个指向原始值的引用（而不是其值的副本）来实现。\n\
