    \ `false`。\n\n## 命令标志\n\n运行你程序的命令可以识别任意数量的参数，因此在运行程序时，你可以向程序传递一个空格分隔的参数值列表。Go\
    \ 标准库 `os`（操作系统）提供了一个 `Args` 切片，它将这些参数值存储在各个元素中。你可以通过导入 `os` 包让你的程序可以使用这些功能。\n\
    \n![image](img/pg148_1.jpg)\n\n需要注意的是，`os.Args` 中的第一个元素始终包含你的程序路径——参数值随后按顺序存储在随后的元素中。你可以像使用任何其他切片一样使用\
    \ `[]` 方括号来引用参数值——例如，使用 `os.Args[1]` 引用第一个参数值。\n\n![image](img/1g.jpg)首先在程序中导入\
    \ Go 标准库的 `os` 包，以存储命令行参数\n\n```go\nimport (\n\t\"fmt\"\n\t\"os\"\n)\n```\n\n\
    ![image](img/commong.jpg)\n\nsrc\\params\\main.go\n\n![image](img/2g.jpg)接下来，添加循环来显示程序在系统上的默认位置，以及任何传递的参数\n\
    \n```go\nfor i, v := range os.Args {\n\tfmt.Printf( “Argument %v: %v \\n”, i,\
    \ v )\n}\n```\n\n![image](img/3g.jpg)现在，显示最后一个传递的参数\n\n```go\nfmt.Println( “\\\
    nLast Argument:\", os.Args[ len( os.Args )-1 ] )\n```\n\n![image](img/4g.jpg)将程序文件保存在“params”目录中，然后带命令行参数运行程序查看输出\n\
    \n![image](img/pg148_2.jpg)\n\n![image](img/hot.jpg)\n\n运行 `go build params` 来编译程序，然后使用命令\
    \ `params a b c` 运行它，以查看本地程序路径而不是默认系统位置。\n\nGo 标准库 `flag` 包提供了用于高级命令行处理的函数。你可以通过导入\
    \ `flag` 包让你的程序可以使用这些功能。\n\n![image](img/pg149_1.jpg)\n\n你使用 `flag` 包的 `String()`、`Int()`\
    \ 或 `Bool()` 函数来定义标志。这些每个都需要三个参数，分别指定标志名称、默认值以及该标志的帮助信息。它们返回一个适当变量数据类型的地址，用于存储值。用户可以可选地在命令行中为每个标志指定备用值，在标志名前加加上连字符。`flag`\
    \ 包的 `Parse()` 函数将用户的值应用到标志。\n\n![image](img/1g.jpg)首先在程序中导入 Go 标准库的 `flag` 包，以解析命令行标志\n\
    \n```go\nimport (\n\t\"fmt\"\n\t\"flag\"\n)\n```\n\n![image](img/commong.jpg)\n\
    \nsrc\\flags\\main.go\n\n![image](img/2g.jpg)接下来，定义三个命令行标志\n\n```go\ntxt := flag.String(\
    \ “txt”, “C#”, “A string” )\nnum := flag.Int( “num”, 8, “An integer” )\nsta :=\
    \ flag.Bool( “sta”, false, “A boolean” )\n```\n\n![image](img/3g.jpg)现在，处理标志并显示它们的值\n\
    \n```go\nflag.Parse( )\nfmt.Println( “\\nText:\", *txt )\nfmt.Println( “Number:”,\
    \ *num, “ Status:”, *sta )\n```\n\n![image](img/4g.jpg)将程序文件保存在“flags”目录中，然后不带带输入运行程序以查看标志值\n\
    \n![image](img/pg149_2.jpg)\n\n![image](img/forget.jpg)\n\n你需要使用 `*` 解引用运算符来引用存储地址处的值。\n\
    \n## 读取文件\n\nGo 标准库 `io` 包包含一个 `ioutil`（输入/输出）包，它提供了读取文件的函数。通过导入 `io/ioutil` 让你的程序可以使用这些功能。\n\
    \n![image](img/pg150_1.jpg)\n\n`ioutil` 包的 `ReadFile()` 函数接收文件路径作为参数，并返回整个文件内容和任何读取错误。如果没有遇到错误，错误值将为\
    \ `nil`。在每次文件操作后检查错误是良好的做法。\n\n为了在读取文件时进行更精细的控制，你可以将文件路径作为 `os` 包的 `Open()` 函数的参数。这仅仅是打开文件（仅可读），并返回一个\
    \ `os.File` 类型和任何读取错误。`file` 类型拥有 `Read()`、`Seek()` 和 `Close()` 方法，允许你处理文本文件。\n\
    \n`Seek()` 方法确定从打开的文件开始读取的位置。它需要两个参数来指定偏移量位置，并且如果相对于文件开头，则指定零 (0)，如果相对于当前位置，则指定一\
    \ (1)。\n\n`Read()` 方法需要一个字节切片参数，其长度将决定从指定位置读取的字节数（字符）。该方法返回读取的字节数和任何读取错误。\n\n\
    `Close()` 方法不需要参数，但在完成对打开文件的其他操作后必须调用它。为了不忘记这一要求，你可以在打开文件后立即使用 `defer` 关键字调用 `Close()`\
    \ 方法。这将在封装函数结束时自动关闭文件。\n"
