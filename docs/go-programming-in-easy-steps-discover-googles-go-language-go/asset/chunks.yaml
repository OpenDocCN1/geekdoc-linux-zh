  trans: "\n\n# 理解优先级\n\n## 总结\n\n### 算术运算\n\n![image](img/pg34_1.jpg)\n\nGo 程序中常用的算术运算符如下表所示，以及它们所执行的操作：\n\
    \n| 运算符 | 操作 |\n| :--- | :--- |\n| `+` | 加法 |\n| `-` | 减法 |\n| `*` | 乘法 |\n| `/`\
    \ | 除法 |\n| `%` | 取余 |\n| `++` | 递增 |\n| `--` | 递减 |\n\n赋值、加、减、乘除运算符的行为与你预期的一样，但在使用多个运算符的表达式中，必须对表达式进行分组——最内层\
    \ `()` 括号内的操作优先执行：\n\n```go\na = b * c - d % e / f ;              // 这不清晰。\na\
    \ = ( b * c ) - ( ( d % e ) / f ) ;  // 这个清晰得多。\n```\n\n`%` 取余运算符将第一个数除以第二个数并返回操作的余数。这对于判断一个数是奇数还是偶数很有用。\n\
    \n`++` 递增运算符和 `--` 递减运算符将给数字加减一并返回结果。它们最常用于循环中的迭代计数——在每次迭代中通过 `++` 递增运算符计数，或在每次迭代中通过\
    \ `--` 递减运算符减计数。\n\n`++` 递增或 `--` 递减运算符必须紧跟变量名之后以修改其值。例如：\n\n```go\nn := 4\nn++\
    \              // 现在 n = 5.\n```\n\n![image](img/forget.jpg)\n\n`+` 运算符具有双重用途——它也用于拼接字符串。\n\
    \n![image](img/hot.jpg)\n\n用于运算符构成表达式的值被称为“操作数”——在表达式 `2 + 3` 中，数值 `2` 和 `3` 就是操作数。\n\
    \n![image](img/1g.jpg)在你的“src”文件夹内创建一个名为“arith”的目录\n\n![image](img/commong.jpg)\n\
    \n`src\\arith\\main.go`\n\n![image](img/2g.jpg)开始编写一个包含包声明和导入声明的 main.go 程序\n\n\
    ```go\npackage main\nimport \"fmt\"\n```\n\n![image](img/3g.jpg)添加一个声明并初始化两个变量的\
    \ main 函数\n\n```go\nfunc main( ) {\n    a := 8\n    b := 4\n    // 在此处插入语句。\n\
    }\n```\n\n![image](img/4g.jpg)在 main 函数中，插入语句输出每次算术运算后的计算和值\n\n```go\nfmt.Println(\
    \ \"Addition:\\t\", ( a + b ) )\nfmt.Println( \"Subtraction:\\t\", ( a - b ) )\n\
    fmt.Println( \"Multiplication:\\t\", ( a * b ) )\nfmt.Println( \"Division:\\t\"\
    , ( a / b ) )\nfmt.Println( \"Remainder:\\t\", ( a % b ) )\n```\n\n![image](img/5g.jpg)现在，插入语句更改存储的值并显示它们的新值\n\
    \n```go\na++\nfmt.Println( \"Increment:\\t\", a )\nb--\nfmt.Println( \"Decrement\\\
    t\", b )\n```\n\n![image](img/6g.jpg)将程序文件保存到“arith”目录中，然后运行程序以查看每次操作的结果\n\n![image](img/pg35_2.jpg)\n\
    \n![image](img/forget.jpg)\n\n在这里，使用 `\\t` 转义序列来输出制表符以对齐结果。\n\n### 赋值\n\n![image](img/pg36_1.jpg)\n\
    \nGo 编程中用于赋值的运算符如下表所示。除了简单的 `=` 赋值运算符外，所有的都是长表达式的简写形式，因此为了清晰，给出了每个等效形式：\n\n| 运算符\
    \ | 示例 | 等效于 |\n| :--- | :--- | :--- |\n| `=` | `a = b` | `a = b` |\n| `+=` |\
    \ `a += b` | `a = ( a + b )` |\n| `-=` | `a -= b` | `a = ( a - b )` |\n| `*=`\
    \ | `a *= b` | `a = ( a * b )` |\n| `/=` | `a /= b` | `a = ( a / b )` |\n| `%=`\
    \ | `a %= b` | `a = ( a % b )` |\n\n在上面的赋值示例中，`a = b` 表示名为“a”的变量被赋值名为“b”的变量所包含的值——这样该值就存储在变量\
    \ `a` 中。从技术上来说，赋值运算符将右侧操作数存储在左侧操作数指定的内存位置中，并将该值作为结果。\n\n`+=` 复合运算符用于将值添加到存储在变量中的现有值。在上面的示例中，`a\
    \ += b` 将变量 `b` 中的值加到变量 `a` 的值上——总量就是存储在变量 `a` 中的值。\n\n其他复合运算符原理类似；例如 `%=` 复合运算符计算左侧操作数除以右侧操作数的余数，并存储在第一个变量中。\n\
    \n### 比较\n\n![image](img/pg38_1.jpg)\n\nGo 编程中常用的比较两个数值的运算符如下表所示：\n\n| 运算符 | 比较测试\
    \ |\n| :--- | :--- |\n| `==` | 等于 |\n| `!=` | 不等于 |\n| `>` | 大于 |\n| `<` | 小于\
    \ |\n| `>=` | 大于或等于 |\n| `<=` | 小于或等于 |\n\n`==` 等于运算符比较两个操作数，如果两个值相等，则返回 true，否则\
    \ `==` 运算符将返回 false。如果两者都是相同的数字，则它们相等的；如果两者都是字符，则对它们的 ASCII 码进行数值比较。\n\n相反，`!=`\
    \ 不等于运算符在两个操作数不相等时返回 true，使用的规则与 `==` 等于运算符相同，否则返回 false。\n\n"
