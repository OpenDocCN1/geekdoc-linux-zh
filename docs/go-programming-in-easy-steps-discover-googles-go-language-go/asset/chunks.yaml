    of the values within two bits.


    •The shift left << and shift right >> operators move the bit values a specified
    number of bits in their direction.


    •The most common use of bitwise operators is to manipulate a compact bit field
    containing a set of boolean flags.


    •Expressions containing multiple operators will perform their operations in accordance
    with the default precedence level unless explicitly forced by the addition of
    parentheses.


