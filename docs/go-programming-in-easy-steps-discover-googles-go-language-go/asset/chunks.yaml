    \ simply contains a group of statements that get executed whenever that function\
    \ is called. Once the function statements have been executed, program flow resumes\
    \ at the point directly following the function call. This modularity is very useful\
    \ in Go programming to isolate set sequences of code that can be called upon repeatedly\
    \ as required.\n\nTo add a custom function into a Go program it must be declared\
    \ using the `func` keyword, followed by a name of your choice – adhering to the\
    \ same naming conventions used for variable names.\n\n| Naming Rule | Example\
    \ |\n| :--- | :--- |\n| CANNOT be a Go keyword | `default` |\n| CANNOT contain\
    \ arithmetic operators | `a+b*c` |\n| CANNOT contain punctuation characters |\
    \ `%$#@!` |\n| CANNOT contain any spaces | `no spaces` |\n| MUST start with a\
    \ letter | `msg` |\n| CAN contain numbers elsewhere | `good1` |\n| CAN contain\
    \ mixed case | `camelCase` |\n\nWhen choosing a function name it should describe\
    \ the purpose of the function but be concise. The function name is followed by\
    \ `()` parentheses and an `{` opening curly bracket, all on the same line. This\
    \ line is often referred to as the function “signature”. The statements to be\
    \ executed are contained in the function body, and the body ends with a `}` closing\
    \ curly bracket – just as with the `main` function. The function can be called\
    \ within a program by stating its name followed by `()` parentheses.\n\n![image](images/snake.jpg)\n\
    \nFunction names should begin with a lowercase letter unless the function is to\
    \ be exported – see [here](#chapter05.xhtml_sec37).\n\n![image](images/1o.jpg)Create\
    \ a function that will simply print a message each time it gets called\n\n```go\n\
    func first() {\n    msg := “Hello from the 1st function!\"\n    fmt.Println(msg)\n\
    }\n```\n\n![image](images/commono.jpg)\n\n`src\\funcs\\main.go`\n\n![image](images/2o.jpg)Create\
    \ another function that will simply print the result of a multiplication each\
    \ time it gets called\n\n```go\nfunc sqFive() {\n    fmt.Printf(\"%v \\n\", 5\
    \ * 5)\n}\n```\n\n![image](images/3o.jpg)Next, add a main function that begins\
    \ with a statement that calls the first function to print its message\n\n```go\n\
