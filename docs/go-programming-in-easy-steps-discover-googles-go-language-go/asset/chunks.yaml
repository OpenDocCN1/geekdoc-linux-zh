    \ `nil`。\n\n为了在写入文本时进行更精细的控制，可以使用 `os` 包的 `OpenFile()` 函数。这需要三个参数：指定写入的文件路径、一个指定操作类型的标志以及该文件的数值文件权限。指定操作类型的标志是\
