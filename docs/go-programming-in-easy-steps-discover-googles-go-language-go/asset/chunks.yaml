    Create Program Variables


    ![image](images/pg22_1.jpg)


    A variable is a container in a Go program in which a data value can be stored
    inside the computer’s memory. The stored value can be referenced using the variable’s
    name and changed by assigning a new value. The programmer can choose any name
    for a variable providing it adheres to the naming convention rules listed below:


    | **Naming Rule** | **Example** |


    | CANNOT be a Go keyword | **default** |


    | CANNOT contain arithmetic operators | **a+b*c** |


    | CANNOT contain punctuation characters | **%$#@!** |


    | CANNOT contain any spaces | **no spaces** |


    | MUST start with a letter | **msg** |


    | CAN contain numbers elsewhere | **good1** |


    | CAN contain mixed case | **camelCase** |


    Variable names should be concise and should always begin with a lowercase letter
    – unless the variable is to be made accessible to other packages (more on this
    later). It is good practice to choose meaningful names for variables to make the
    program code more easily understood. To create a variable in the program simply
    requires it to be “declared” using the var keyword. A variable declaration has
    this syntax:


    **var *variableName dataType***


    The var keyword is followed by a space then the chosen variable name, then the
    type of data this variable will be allowed to store. Typically, this will be one
    of the five data types described on the opposite page. Multiple variables of the
    same data type can be created in a single declaration as a comma-separated list,
    like this:


    **var *variableName1*, *variableName2*, *variableName3 dataType***


    ![image](images/forget.jpg)


    Go keywords are listed in the table on the inner front cover of this book.


    ![image](images/snake.jpg)


    Variable names are case-sensitive in Go – so variables named “NUM”, “Num”, and
    “num” would be treated as three separate variables.


    The basic data types in the Go language are defined using Go keywords. These types
    are listed in the table below, together with a description of each data type:


    | **Data Type** | **Description** | **Example** |


    | **string** | A string of characters | **“Hi there!”** |


    | **int** | An integer whole number | **100** |


    | **float64** | A floating-point number correct to about 15 places | **0.0123456789**
    |


    | **byte** | A single byte capable of storing just one character | **‘A’** |


    | **bool** | A boolean value of true or false | **true** |


    It is important to recognize that Go is a “statically typed” language, which means
    that a variable can only ever contain data of the type specified in its declaration.


    When a value is assigned to a variable, that variable is said to have been “initialized”.
    A variable can be declared then initialized later, or a variable may be initialized
    when it is declared. For example, to initialize a variable to contain a value
    of the string data type:


    **var msg string**


    **msg = “Hi there!”**


    **var msg string = “Hi there!”**


    Additionally, a variable can be declared and initialized using a special := operator.
    In this case, neither the var keyword nor data type is required, like this:


    msg := “Hi there!”


    The Go compiler simply infers the data type from the type of data being assigned
    to the variable. This is the preferred way to create and initialize a variable
    – but it can only be used inside the body of a function.


    ![image](images/snake.jpg)


    Character values of the **byte** data type must be enclosed by single quotes ‘
    ‘ – double quotes are incorrect.


    ![image](images/hot.jpg)


    Short variable names are recommended in Go programming, so the examples here use
    **msg** rather than **message** for the variable name.


    Display Variable Values


    ![image](images/pg24_1.jpg)


    The value of variables can be displayed using the fmt.Println( ) function that
    was used in Chapter 1 to display the “Hello World!” message. Alternatively, the
    desired format in which to display the variable value can be specified to a fmt.Printf(
    ) function using a suitable “format specifier” and the variable name:


    | **Specifier** | **Description** | **Example** |


    | **%s** | A string of characters | **“Go Fun!”** |


    | **%d** | An integer -32768 to +32767 | **100** |


    | **%f** | A floating-point number | **0.123456** |


    | **%c** | A single character | **‘A’** |


    | **%t** | A boolean value | **true** |


    | **%p** | A machine memory address | **0x0022FF34** |


    | **%v** | The value in a default format | *(**any of the above**)* |


    | **%T** | The data type of the variable | **int** |'
