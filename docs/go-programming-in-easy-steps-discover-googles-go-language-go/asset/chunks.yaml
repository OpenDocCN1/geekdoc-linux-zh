    \n`fmt.Printf()` 和 `fmt.Println()` 函数可以将内容写入标准输出，它们可以在输出中添加空格和换行符，但不会更改实际的字符串。不过，这两个函数都返回两个值，即写入的字节数和任何写入错误。如果没有遇到错误，错误错误值将像往常一样为\
    \ `nil`。对于英语，写入的字节数通常代表输出的字符数——包括字符串中包含的非打印字符。\n\n![image](img/hot.jpg)\n\n非打印字符\
