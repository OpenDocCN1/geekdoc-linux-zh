    The last three digits in the permission represent Owner, Group, and Other users
    respectively. Each may have file permission to execute (1 point), write (2 points),
    and read (4 points). Totaling these points with **0644** allows the Owner to read
    and write to the file, but Group and Other users may only read the file. This
    protects the file from unauthorized changes.


    ![image](images/hot.jpg)


    A file type also has a **WriteString( )** method that works just like the **Write(
    )** method but accepts a **string** argument, rather than a **byte** slice argument.


    **Use Temporary Files**


    It is sometimes useful to create a temporary file on the user’s system in which
    to store data during the execution of a Go program. The Go standard library io
    package has the ioutil package containing a TempFile( ) function for this purpose.


    ![image](images/pg154_1.jpg)


    The TempFile( ) function returns an os.File type, and an error message or nil
    if the file gets created. This function requires two arguments to specify the
    directory in which to create the file and a filename pattern. You can specify
    the directory as a path, or as an **““** empty string if you are happy to create
    the temporary file in the system’s default directory for temporary files. You
    specify the file name pattern simply as a name string to which a generated random
    string will be appended. If the pattern includes a ***** wildcard character, the
    generated string will replace that character.


    When the TempFile( ) function successfully creates a temporary file, it automatically
    opens that file ready to write and read. The returned file type has a Name( )
    method with which to reference its path, including the pattern and random string
    file name. You can employ its Write( ) and WriteString( ) methods to add text
