    \n| 优先级级别 | 运算符 |\n| :--- | :--- |\n| 5 | `* % << >> &` |\n| 4 | `+ - & | ^` |\n\
    | 3 | `== != < <= >=` |\n| 2 | `&&` |\n| 1 | `||` |\n\n`++` 增增运算符和 `--` 减运算符在\
