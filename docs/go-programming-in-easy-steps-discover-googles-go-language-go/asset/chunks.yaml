    ![image](images/2b.jpg)Next, create a date/time instance of the Time data type,
    initialized with the current date and time, then display its components in various
    formats


    **dt := time.Now( )**


    **fmt.Println( “\nDefault Format:”, dt )**


    **fmt.Println( “Unix Format:”, dt.Format( time.UnixDate ) )


    fmt.Println( “ANSIC Format:”, dt.Format( time.ANSIC ) )


    fmt.Println( “RFC3339 Format:”, dt.Format( time.RFC3339 ) )


    fmt.Println( “Custom Format:”,**


    **dt.Format( “January 2, 2006 [Monday]” ) )**


    ![image](images/3b.jpg)Now, display only date components formatted to be appropriate
    in two locales


    **fmt.Println( “\nUS Format:”, dt.Format( “January 2, 2006” ) )**


    **fmt.Println( “UK Format:”, dt.Format( “2 January, 2006” ) )**


    ![image](images/4b.jpg)Then, display only time components in a 12-hour format
    and in a 24-hour format


    **fmt.Println( “\nTime 12-Hour:”, dt.Format( time.Kitchen ) )**


    **fmt.Println( “Time 24-Hour:”, dt.Format( “15:04” ) )**


    ![image](images/5b.jpg)Save the program file in a “format” directory, then run
    the program to see the formatted date and time field values


    ![image](images/pg117_1.jpg)


    ![image](images/hot.jpg)


    The **time.Kitchen** constant is equivalent to specifying a layout format of “15:04PM”.


    **Set Date and Time**


    You can create your own Time data types using the Date( ) function of the Go standard
    library time package. This requires eight arguments to specify (in this order)
    a year, a month, a day number, an hour, a minute, a second, a nanosecond, and
    a location.


    ![image](images/pg116_1.jpg)


    All arguments are specified as integer values except for the month and location.


    The month can be specified using one of the time package predefined full-name
    month constants for January-December, for example, time.January.


    The location can be specified using one of the time package predefined location
    constants atime.UTC, for Universal Time Coordinated or time.Local, for your system
    clock.


    The date fields in any Time data type can be modified using the AddDate( ) method
    of the Go standard library time package to specify three arguments for year, month,
    and day. Positive values will advance the date, and negative values will retard
    the date. For example, time.AddDate( 1, 0, 0 ) will advance the date one year.


    Similarly, the time package’s Add( ) method can be used to specify a single duration
    argument by which to modify a date/time. This value can be an int64 value representing
    a number of nanoseconds by which to modify the date/time. More conveniently, you
    can use constants time.Hour, time.Minute, time.Second, or time.Millisecond to
    modify individual time fields of a Time data type. For example, time.Add( 10 *
    time.Hour ) will advance the time 10 hours.


    You can also create your own Time data types from a string using the Parse( )
    function of the Go standard library time package. This requires two arguments
    to specify a layout and a date/time string. Usefully, this function returns two
    values, which are a Time data type and an error. If the function returns a Time
    data type, the error value will be nil, otherwise it will be an error message.


    The layout should only use values from the Go reference string:


    **Mon Jan 2 15:04:05 2006 MST**


    Unless a time zone offset value is specified in the date/time string (e.g. -0500),
    the resulting Time data type will assume UTC time.


    ![image](images/forget.jpg)


    The **Time** data types can be formatted using the **Format( )** method described
    [here](#chapter08.xhtml_sec56).


    ![image](images/1b.jpg)Begin by importing the Go standard library time package
    into a program


    **import (**


    **“fmt”


    “time”**


    **)**


    ![image](images/commons.jpg)


    src\setdate\main.go


    ![image](images/2b.jpg)Next, create and display a date/time instance of the Time
    data type, initialized for noon on New Year’s day


    **dt := time.Date( 2025, time.January, 1, 12, 0, 0, time.Local )**


    **fmt.Printf( “\nDateTime: %v \n\n”, dt )**


    ![image](images/3b.jpg)Advance the date two years to U.S. Independence Day, then
    display the modified date


    **dt = dt.AddDate( 2, 6, 3 )**


    **fmt.Printf( “DateTime: %v \n\n”, dt )**


    ![image](images/4b.jpg)Now, initialize a layout string and a date/time string


    **layout := “2006-Jan-02 03:04PM”**


    **str := “2030-Dec-25 12:30AM”**


    ![image](images/5b.jpg)Finally, attempt to create and display the fields of a
    Time data type, or display an error message if the attempt fails


    **t, err := time.Parse( layout, str )**


    **if err != nil {**


    **fmt.Println( err )**


    **} else {**


    **fmt.Printf( “Parsed DateTime:” %v \n”, t )**


    **}**


    ![image](images/6b.jpg)Save the program file in a “setdate” directory, then run
    the program to see the date and time field values


    ![image](images/pg119_1.jpg)


    ![image](images/snake.jpg)


    The layout string and date/time string must be in the same format when parsing
    a string to a **Time** data type.


    ![image](images/hot.jpg)


    The modified **Time** fields automatically recognize the change from Eastern Standard
    Time to Eastern Daylight Time.


    **Recognize Zones**


    All Time data types in Go programming are associated with a time zone. Typically,
    this will be UTC time, or the local time based upon the location of the system
    running the program. You can, however, specify an alternative location as an argument
    to a time.LoadLocation( ) function. The location name must correspond to a file
    in the Internet Assigned Numbers Authority (IANA) time zone database, such as
    “America/New_York”, “Asia/Seoul”, or “Europe/London”. The time.LoadLocation( )
    function returns two values, which are a Location type and an error. If the function
    successfully returns a Location type, the error value will be nil, otherwise it
    will be an error message.


    ![image](images/pg120_1.jpg)


    You can create a Time data type of the current time in another time zone by appending
    a call to an In( ) function after its Now( ) function, in which the location is
    specified as an argument to the In( ) function.


    ![image](images/pg120_2.jpg)


    You can ascertain the time zone associated with a Time data type by calling its
    Zone( ) method. This method returns two values, which are a three-letter TZ time
    zone abbreviation, such as “EST” (Eastern Standard Time) or “EDT” (Eastern Daylight
    Time), and a numerical value representing the seconds offset of that time zone
    from UTC. It is important to note that time zone abbreviations are not unique,
    so you should not rely solely upon these to recognize particular time zones. Some
    time zones change their time for Daylight Saving, so you might evaluate both the
    TZ abbreviation and offset to correctly recognize the time zone.


    ![image](images/hot.jpg)


    A list of IANA location names and TZ abbreviations is included with this book’s
    download files – see [here](#fm.xhtml_sec101).


    ![image](images/hot.jpg)


    Daylight Saving in the USA reduces the offset from UTC by one hour. For example,
    Eastern Daylight Time (EDT) is UTC - 4 hours, Central Daylight Time (CDT) is UTC
    - 5 hours, etc.


    ![image](images/1b.jpg)Begin by importing the Go standard library time package
    into a program


    **import (**


    **“fmt”


    “time”**


    **)**


    ![image](images/commons.jpg)


