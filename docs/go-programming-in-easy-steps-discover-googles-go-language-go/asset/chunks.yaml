  trans: "\n\n同样，`strings` 包的 `HasSuffix()` 函数需要两个参数，分别指定一个字符串和一个要查找的模式，并返回 true 或\
    \ false 以表示被搜索字符串是否以指定的模式结尾。\n\n你可以使用 `strings` 包的 `Replace()` 函数通过将指定的模式替换为替换子字符串来修改被搜索字符串。该函数需要四个参数：指定要搜索的字符串、要查找的模式、替换子字符串以及一个表示替换次数的整数。如果你想替换搜索字符串中所有的模式实例，只需将替换次数指定为\
    \ `-1` 即可。\n\n![image](img/forget.jpg)\n\n`strings.Index()` 函数在在搜索字符串中找到模式的第一个实例时停止搜索。\n\
    \n![image](img/1r.jpg)\n首先在程序中导入 Go 标准库的 `strings` 包\n\n```go\nimport (\n    \"\
    fmt\"\n    \"strings\"\n)\n```\n\n![image](img/commonr.jpg)\n\n`src\\find\\main.go`\n\
