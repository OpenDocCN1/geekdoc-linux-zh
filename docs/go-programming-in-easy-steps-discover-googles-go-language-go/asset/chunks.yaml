    ## Add Files to Serve


    Having established that the server program can respond to requests with the example
    [here](#chapter12.xhtml_register), files can be added to the program that the
    server can deliver in response to requests.


    ![image](images/pg178_1.jpg)


    Web server files are typically contained within a root directory named `htdocs`
    (hypertext documents) or a similar name. This will generally contain HTML files
    and perhaps a `favicon.ico` image to identify the website in the browser’s title
    bar. The root directory will also often contain sub-directories to group associated
    files – such as images in an `img` folder, style sheets in a `css` folder, etc.


    In our server example, two HTML documents have been added to a root `htdocs` directory
    alongside a `favicon.ico` image. A single style sheet resides within an `htdocs/css`
    directory, and several images are contained in an `htdocs/img` directory. The
    entire server program tree now looks like this:


    ![image](images/pg178_2.jpg)


    ![image](images/pg178_3.jpg)


    favicon.ico


    32px x 32px


    ![image](images/pg178_4.jpg)


    power.png 100px x 25px


    Several of the image files are cover shots of various books whose ISBN (International
    Standard Book Number) is used as the respective cover image file name. The `img`
    directory also contains a company logo image, and a label to identify the web
    server.


    The style sheet contains rules to specify the appearance of a web page response
    that will be written dynamically by the program:


    | img, p | { float: left } |

    | p | { width: 320px ; text-align: center ; font-size: 1.5em } |


    ![image](images/pg179_1.jpg)


    style.css


    The HTML document named `index.html` is a simple static web page displaying the
    website icon, a page heading and a label:


    ```html

    <!DOCTYPE HTML>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <title>Index</title>

    <link rel="shortcut icon" href="favicon.ico">

    </head>

    <body>

    <h1>Static Web Page</h1>

    <img src="img/power.png" alt="Power">

    </body>

    </html>

    ```


    ![image](images/pg179_2.jpg)


    index.html


    The HTML document named `form.html` allows the user to submit a single text value
    to the web server:


    ```html

    <!DOCT Y HTML>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <title>Submission Form</title>

    <link rel="shortcut icon" href="favicon.ico">

    </head>

    <body>

    <fieldset>

    <legend>Book Lookup</legend>

    <form method="POST" action="lookup">

    <label>Programming Language</label>

    <input name="Language" type="text" value="">

    <input type="submit" value="Submit" >

