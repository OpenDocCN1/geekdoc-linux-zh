    - 通道可以在流水线中连接 goroutine，通过发送和接收消息来同步 goroutine。\n- `<-` 箭头运算符可以在函数参数中使用，用于指定通道是否仅允许发送或仅允许接收。\n\
    - 工作池可以将来自多个并发调用的任务发送到 goroutine 中按随机顺序集进行完成。\n\n12\n\n# 请求响应\n\n*本章演示了如何创建一个\
    \ Web 服务器，以及如何使用 Go 标准库 `net/http` 和 `io` 包处理提交的表单数据。*\n\n- 监听请求\n- 处理请求\n- 添加用于提供服务的文件\n\
    - 交付静态页面\n- 记录接收的数据\n- 交付动态响应\n- 总结\n\n## 监听请求\n\nGo 标准库 `net` 包包含一个 `http` 包，该包提供了可以方便创建\
    \ Web 服务器的实用程序。可以通过导入 `net/http` 包让这些实用程序对程序可用。\n\n![image](img/pg174_1.jpg)\n\
    \n`http.ListenAndServe()` 函数允许程序启动并运行一个 Web 服务器。它需要两个参数：指定 TCP 网络地址字符串和一个请求处理器。地址字符串指定了\
    \ Web 服务器应该监听传入请求的端口号。端口号在字符串内必须以冒号 `:`  作为前缀——例如，“:8000”用于监听本地端口 8000 上的传入请求。通常通过将第二个参数指定为\
    \ `nil` 来使用默认处理器。\n\n`http.ListenAndServe()` 函数始终返回一个非空错误并永久阻塞。这意味着此函数调用下面的代码行将永远不会执行。Web\
    \ 服务器将继续监听传入请求，直到程序终止。\n\n![image](img/1o.jpg)\n首先在程序中导入 Go 标准库 `net/http` 包\n\
    \n```go\nimport (\n    \"fmt\"\n    \"net/http\"\n)\n```\n\n![image](img/commono.jpg)\n\
    \nsrc\\server\\main.go\n\n![image](img/2o.jpg)\n接下来，添加一个 `main` 函数，它将输出启动消息并启动一个监听系统本地端口\
    \ 8000 的 Web 服务器\n\n```go\nfunc main() {\n    // 稍后在此处插入语句。\n    fmt.Println(\"\
    Starting web server on port 8000\")\n    http.ListenAndServe(\":8000\", nil)\n\
    }\n```\n\n![image](img/3o.jpg)\n将程序文件保存到“server”目录中，然后运行程序启动 Web 服务器\n\n![image](img/hot.jpg)\n\
    \n本地系统地址通过回环网络 http 接口使用主机 `localhost` 进行引用。这通常解析为 IP 地址 `127.0.0.1`。\n\n![image](img/pg175_1.jpg)\n\
    \n![image](img/4o.jpg)\n如果出现防火墙安全警告，请确认你希望允许 Web 服务器访问\n\n![image](img/pg175_2.jpg)\n\
    \n![image](img/5o.jpg)\n现在，启动浏览器并访问 localhost:8000 查看 Web 服务器\n\n![image](img/hot.jpg)\n\
    \n按下 `Ctrl` + `C` 终止运行的程序\n\n![image](img/hot.jpg)\n\nWeb 服务器还不知道如何响应，但本章将开发程序以实现响应。##\
    \ 处理请求\n\n为了让 Go 服务器处理传入的请求，程序需要注册指定响应方式的“处理器”。\n\n`net/http` 包提供了 `http.HandleFunc()`\
    \ 函数来注册处理器。该函数需要两个参数：描述监听路径的字符串模式，以及将被调用的函数名称。字符串模式以 `/` 斜线字符开头——例如，“/hello”。这指定了\
    \ Web 服务器监听来自 localhost:8000/hello 的请求。\n\n`HandleFunc()` 函数使用指定的字符串模式。通常，`http.ResponseWriter`\
    \ 对象被命名为 `w`，而 `http.Request` 对象被命名为 `r`。\n\n`http.ResponseWriter` 对象有一个 `Write()`\
    \ 方法，接受要发送到响应的字节切片。字符可以转换为字符串，如下：\n\n```go\nw.Write([]byte(\"response string\"\
    ))\n```\n\n然而，更方便的方法是用 Go 标准库 `io`（输入/输出）包中的 `WriteString()` 函数将字符串传递给 `http.ResponseWriter`\
    \ 对象。这可以通过导入 `io` 包来实现。\n\n`io.WriteString()` 函数需要两个参数：指定 `http.ResponseWriter`\
    \ 对象和要响应请求的字符串。\n\n![image](img/1o.jpg)\n首先在之前的程序导入中添加导入 Go 标准库 `io` 包的指令\n\n\
    ```go\nimport (\n    \"fmt\"\n    \"io\"\n    \"net/http\"\n)\n```\n\n![image](img/2o.jpg)\n\
    接下来，在 `main` 函数开头插入语句来注册处理器\n\n```go\nhttp.HandleFunc(\"/hello\", helloHandler)\n\
    ```\n\n![image](img/3o.jpg)\n现在，在 `main` 函数之后，添加写入两个字符串作为请求响应的处理器函数\n\n```go\n\
    func helloHandler(w http.ResponseWriter, r *http.Request) {\n    io.WriteString(w,\
    \ \"Response from the helloHandler!\\n\")\n    io.WriteString(w, \"URL.Path =\
    \ \"+r.URL.Path)\n}\n```\n\n"
