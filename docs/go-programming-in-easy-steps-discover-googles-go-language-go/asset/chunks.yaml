  trans: "\n\n前一个示例此处中描述的 `for` 循环的替代方案在 `for` 关键字之后仅包含一个测试表达式——它在循环语句开头不包含初始化器或递增器。相反，它使用一个已经初始化的计数变量，并在循环体内增加该计数器。这是\
    \ Go 语言中与其他语言中“while”循环等价物，因为只要测试表达式为真，循环就会继续迭代。递增器必须在某处使测试表达式为假以结束循环，否则将创建一个永远不会结束的死循环。这种类型\
    \ `for` 循环的语法如下：\n\n```\ninitializer\nfor test-expression {\n    statements-to-be-executed\n\
    \    incrementer\n}\n```\n\nGo 编程中循环结构的另一种变体允许你甚至从起始语句中省略测试表达式，并使用一个在循环体内包含测试表达式的无限循环。它同样使用一个已经初始化的计数变量，并在循环体内增加该计数器。这是\
    \ Go 语言中与其他语言中“do-while”循环等价物，因为循环将执行其语句并在测试表达式为真时继续迭代。当测试表达式变为假时，可以使用 `break`\
    \ 关键字终止循环，因此这种类型 `for` 循环的语法如下：\n\n```\ninitializer\nfor {\n    statements-to-be-executed\n\
    \    incrementer\n    if test-expression {\n        statements-to-be-executed\n\
    \        break\n    }\n}\n```\n\n注意，如果测试表达式在第一次评估时为假，则“while”循环将不会进行迭代，而“do-while”循环将至少执行一次迭代，因为它的语句在评估之前就已经执行了。\n\
    \n![image](img/hot.jpg)\n\n如果程序运行了无限循环，在 Windows 或 Linux 系统上按下键盘上的 `Ctrl` + `C`\
    \ 键停止循环执行。\n\n![image](img/1p.jpg)开始一个执行五次迭代的 main 函数\n\n```\nfunc main( ) {\n\
    \    counter := 1\n    for counter <= 5 {\n        fmt.Println( “Loop Iteration”,\
    \ counter )\n        counter++\n    }\n    // Statements to be inserted here.\n\
    }\n```\n\n![image](img/commonp.jpg)\n\nsrc\\while\\main.go\n\n![image](img/2p.jpg)接下来，插入一个无限循环语句\n\
    \n```go\ni := 10\nfor {\n    fmt.Println( “\\t\\t\\tCountdown”, i )\n    i--\n\
    \    // Test expression to be inserted here.\n}\n```\n\n![image](img/3p.jpg)现在，插入一个测试表达式来结束循环\n\
    \n```go\nif i < 1 {\n    fmt.Println( “\\t\\t\\t\\t\\tLift Off!” )\n    break\n\
    }\n```\n\n![image](img/4p.jpg)将程序文件保存在“while”目录中，然后运行程序查看每次循环迭代的输出\n\n![image](img/pg55_1.jpg)\n\
    \n![image](img/pg55_2.jpg)\n\n![image](img/forget.jpg)\n\n将变量 `i` 的初始值更改为 `0`（零）并再次运行程序，查看循环的第一次迭代执行执行。\n\
    \n### 跳出循环\n\n当满足指定条件时，可以使用 `break` 关键字提前终止任何循环。`break` 语句位于循环语句块内部，并且前面有一个测试表达式。当测试返回真时，循环立即结束，程序继续执行下一个任务。例如，在嵌套内部循环中，它将进入外层循环的下一次迭代。\n\
    \n![image](img/pg56_1.jpg)\n\n当满足指定条件时，可以使用 `continue` 关键字跳过循环的单次迭代。`continue`\
    \ 语句位于语句块内部，并且前面有一个测试表达式。当测试返回真时，本次迭代结束。\n\n![image](img/1p.jpg)开始一个执行三次迭代的 main\
    \ 函数\n\n```\nfunc main( ) {\n    for i := 1 ; i <= 3 ; i++ {\n        // Inner\
    \ Loop to be inserted here.\n    }\n}\n```\n\n![image](img/commonp.jpg)\n\nsrc\\\
    break\\main.go\n\n![image](img/2p.jpg)插入一个执行三次迭代的内部循环\n\n```go\n// Statements\
    \ to be inserted here.\nfor j := 1 ; j <= 3 ; j++ {\n    fmt.Println( “Running\
    \ i=”, i, “j=”, j )\n}\n```\n\n![image](img/3p.jpg)将程序文件保存在“break”目录中，然后运行程序查看每次循环迭代的输出\n\
    \n![image](img/pg56_2.jpg)\n\n![image](img/hot.jpg)\n\n你也可以 `break` 到嵌套代码块外部特定点的标签——请参见此处的示例。\n\
    \n![image](img/4p.jpg)接下来，在内部循环块的最开始插入此 break 语句，跳出内部循环\n\n```go\nif i == 2 &&\
    \ j == 2 {\n    fmt.Println( “Breaks When i=”, i, “and j=”, j )\n    break\n}\n\
    ```\n\n![image](img/5p.jpg)保存更新的文件，然后运行程序查看每次循环迭代的输出\n\n```go\nif i == 2 && j\
    \ == 2 {\n    fmt.Println( “Continues When i=”, i, “and j=”, j )\n    continue\n\
    }\n```\n\n![image](img/6p.jpg)保存更新的文件，然后运行程序查看每次循环迭代的输出\n\n### 跳转到标签\n\n`goto`\
    \ 关键字乍看起来是一个很棒的功能，因为它允许程序流跳转到位置位置标签，就像网页上的超链接一样。然而，在现实中这会导致错误，这种用法并不受欢迎。\n\n![image](img/pg58_1.jpg)\n\
    \n`goto` 关键字是计算机程序中存在数十年的强大功能，但被许多早期程序员滥用，创建了跳转混乱的程序。这导致了程序代码不可读，因此 goto 的使用不再流行。\n\
    \n通常，程序可能会执行一组语句，然后 `goto` 语句跳转回语句开头的标签以重复执行。此外，在语句序列的某处可能会测试条件，如果条件未满足，另一个 `goto`\
    \ 语句可能会跳转到序列之后以继续程序流。这样，程序代码迅速获得了大量的 goto 语句和标签\n\n`goto` 关键字的一种可行用法是通过跳转到外层循环块结束后的标签，从而干净地退出内部循环。这会立即退出两个循环，不再执行任何一个循环的后续迭代。\n\
