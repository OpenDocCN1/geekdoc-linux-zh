    \ item, to open its “Properties” dialog\n\n![image](images/pg13_4.jpg)\n\n![image](images/8b.jpg)Choose\
    \ the `Shortcut` tab, then enter the location of your workspace directory\n\n\
    ![image](images/9b.jpg)Click `Apply`, `OK` to close the dialog, then double-click\
    \ the shortcut icon to open a command-line in your “src” folder\n\n![image](images/pg13_5.jpg)\n\
    \n![image](images/hot.jpg)\n\nGo programs can be written in a plain text editor,\
    \ such as Windows’ Notepad app. It’s useful to have a desktop shortcut that opens\
    \ a text editor in your “src” directory folder. Repeat the steps on this page,\
    \ but in Step 7 enter `notepad` as the location and `Go Editor` as the name, to\
    \ create another useful desktop shortcut.\n\n## Write a Go Program\n\nAll Go programs\
    \ start as plain text files that are later compiled into actual executable programs.\
    \ This means that Go programs can be written in any plain text editor, such as\
    \ the Windows’ Notepad app or the Nano app on Linux.\n\n![image](images/pg14_1.jpg)\n\
    \nFollow these steps to create a simple Go program that will output the traditional\
    \ first program greeting:\n\n![image](images/1b.jpg)Create a sub-directory named\
    \ “hello” in your “src” folder\n\n![image](images/pg14_2.jpg)\n\n![image](images/commons.jpg)\n\
    \nsrc/hello/main.go\n\n![image](images/2b.jpg)Open a plain text editor, like Notepad,\
    \ and type this code exactly as it is listed to begin a program\n\n```go\npackage\
    \ main\n```\n\n![image](images/3b.jpg)Two lines below, insert this code exactly\
    \ as it is listed\n\n```go\nimport “fmt”\n```\n\n![image](images/4b.jpg)Two further\
    \ lines below, precisely add this code\n\n```go\nfunc main( ) {\n    fmt.Println(\
    \ “Hello World!” )\n}\n```\n\n![image](images/5b.jpg)Save the file in the “hello”\
    \ folder, and name it main.go – the complete program should now look exactly like\
    \ this:\n\n![image](images/pg14_3.jpg)\n\n![image](images/snake.jpg)\n\nCapital\
    \ P and lowercase L in `fmt.Println`.\n\n![image](images/forget.jpg)\n\nThe arrangement\
    \ of files within folders is important in Go. Each main file, and any related\
    \ files, must be placed in a uniquely named folder to create a package – so here\
    \ the package is named “hello”.\n\nThe separate parts of the program code on the\
    \ opposite page can be examined individually to understand each part more clearly:\n\
    \n### The Package Declaration\n\n```go\npackage main\n```\n\nThe package type\
    \ is declared following the package keyword. All Go program code is contained\
    \ in packages. You may declare your own type for a package that will be a shared\
    \ library, but you must declare the package “main” if you want the code to be\
    \ compiled into an executable program.\n\n### The Import Declaration\n\n```go\n\
    import “fmt”\n```\n\nThe keyword `import` is used to import one, or more, packages\
    \ into this package to make their features available to this program. The package\
    \ “fmt” comes from the Go standard library that is included in your Go installation.\
    \ It provides the `fmt.Println( ` function that is used to output text in this\
    \ program. Note that the package name must be enclosed in double quote characters.\
    \ When importing multiple packages, the list of package names must be enclosed\
    \ within parentheses and each name must appear on its own line, like this:\n\n\
    ```go\nimport (\n    “fmt”\n    “strings”\n)\n```\n\n### The Function Declaration\n\
    \n```go\nfunc main( ) {\n    fmt.Println( “Hello World!” )\n}\n```\n\nThe function\
    \ name follows the `func` keyword. It must be followed by parentheses and an {\
    \ opening curly bracket on the same line. The function body contains statements\
    \ that are the actual instructions to perform program tasks. The function body\
    \ must end with a closing } curly bracket. Function names must be unique, but\
    \ each Go program must have a function named “main” as this is the starting point\
    \ of all Go programs.\n\n![image](images/forget.jpg)\n\nThe package name and package\
    \ type are two separate items – here the package is named `hello`, but the type\
    \ is `main`.\n\n![image](images/hot.jpg)\n\nYou can find the Go standard library\
    \ packages in the “src” directory of your `GOROOT` directory location – for example,\
    \ at `C:\\Go\\src`. Additionally, you can learn about each package from the official\
    \ documentation at `[https://golang.org/pkg](https://golang.org/pkg)` – an invaluable\
    \ resource.\n\n## Run a Go Program\n\nGo program code is compiled and executed\
    \ using the Go tools. During program development, an error-free Go program can\
    \ be compiled and run by the `go run` tool. This is useful, but if you want to\
    \ create an executable binary file version that can be executed repeatedly and\
    \ distributed, you can use the `go build` tool.\n\n![image](images/pg16_1.jpg)\n\
    \n![image](images/1b.jpg)Open a Command Prompt or Terminal window in your Go “src”\
    \ folder\n\n![image](images/2b.jpg)Enter the command `go run hello` to run the\
    \ program written [here](#chapter01.xhtml_sec4) – it should output the greeting\n\
    \n![image](images/pg16_2.jpg)\n\n![image](images/3b.jpg)Next, enter the command\
    \ `go build hello` to make an executable binary version of the program [here](#chapter01.xhtml_sec4)\n\
    \n![image](images/4b.jpg)\n\n![image](images/forget.jpg)\n\nOn Windows systems\
    \ the binary is given the `.exe`.\n\n## Format and Comment Code\n\nIt is good\
    \ practice to always ensure your Go source code is properly formatted by `go fmt`\
    \ before running.\n\n![image](images/pg17_1.jpg)\n\nIt is also good practice to\
    \ include explanatory comments in your source code so it can be more understood\
    \ by others, and yourself when revisiting the code. Single-line comments can be\
    \ added after a `//` sequence – everything on the line after `//` is ignored by\
    \ the compiler. Multi-line comments can be added between `/*` and `*/` sequences\
    \ – this is useful to “comment-out” blocks of code, to hide it from the compiler\
    \ during development.\n\n![image](images/1b.jpg)Edit the code in `hello.go` [here](#chapter01.xhtml_sec4)\
    \ to add a comment, and unnecessary tab spacing (bad formatting)\n\n![image](images/pg17_2.jpg)\n\
    \n![image](images/2b.jpg)Now, at a prompt, enter the command `go fmt hello` then\
    \ reopen the source code to see correct formatting\n\n![image](images/pg17_3.jpg)\n\
    \n![image](images/snake.jpg)\n\nComments should not be “nested”, one inside another.\n\
    \n![image](images/hot.jpg)\n\nThe `go fmt` tool provides some simple error checking.\
    \ For example, omit a final `“` double quote and it will provide the line number\
    \ and position where the error occurs and provide the nature of the error as “string\
