  trans: "\n\n此外，时间组件可以格式化为 24 小时制，通过指定“15:04”，它会自动在个位数小时前补零。\n\n12 小时制和 24 小时制都会在个位数分钟前补零。\n\
    \n![image](img/hot.jpg)\n\nANSIC 指的是 C 语言的美国国家标准协会日期/时间格式。RFC 3339 指的是互联网工程任务组（IETF）的请求意见日期/时间文档。\n\
    \n![image](img/1b.jpg)首先在程序中导入 Go 标准库 time 包\n\n```go\nimport (\n\t\"fmt\"\n\t\
    \"time\"\n)\n```\n\n![image](img/commons.jpg)\n\nsrc\\format\\main.go\n\n![image](img/2b.jpg)接下来，创建一个\
    \ Time 数据类型的日期/时间实例，并用当前日期和时间初始化，然后以各种格式显示其组件\n\n```go\ndt := time.Now()\nfmt.Println(\"\
    \\nDefault Format:\", dt)\nfmt.Println(\"Unix Format:\", dt.Format(time.UnixDate))\n\
    fmt.Println(\"ANSIC Format:\", dt.Format(time.ANSIC))\nfmt.Println(\"RFC3339 Format:\"\
    , dt.Format(time.RFC3339))\nfmt.Println(\"Custom Format:\", dt.Format(\"January\
    \ 2, 2006 [Monday]\"))\n```\n\n![image](img/3b.jpg)现在，仅显示符合两个地区格式的格式化日期组件\n\n\
    ```go\nfmt.Println(\"\\nUS Format:\", dt.Format(\"January 2, 2006\"))\nfmt.Println(\"\
    UK Format:\", dt.Format(\"2 January, 2006\"))\n```\n\n![image](img/4b.jpg)然后，仅显示\
    \ 12 小时制和 24 小时制的的时间组件\n\n```go\nfmt.Println(\"\\nTime 12-Hour:\", dt.Format(time.Kitchen))\n\
    fmt.Println(\"Time 24-Hour:\", dt.Format(\"15:04\"))\n```\n\n![image](img/5b.jpg)将程序文件保存在“format”目录中，然后运行程序查看格式化后的日期和时间字段值\n\
    \n![image](img/pg117_1.jpg)\n\n![image](img/hot.jpg)\n\n`time.Kitchen` 常量等于指定布局格式为“15:04PM”。\n\
    \n## 设置日期和时间\n\n你可以使用 Go 标准库 time 包的 `Date()` 函数创建自己的 Time 数据类型。这需要八个参数来指定（按顺序）年、月、日、时、分、秒、纳秒和位置。\n\
    \n![image](img/pg116_1.jpg)\n\n除了月份和位置外，所有参数都以整数值形式指定。\n\n月份可以使用 time 包预定义的 1\
    \ 月至 12 月全名月份常量之一指定，例如 `time.January`。\n\n位置可以使用 time 包预定义的位置常量之一指定，例如 `time.UTC`（协调世界时）或\
    \ `time.Local`（你的系统时钟）。\n\n任何 Time 数据类型中的日期字段都可以通过使用 Go 标准库 time 包的 `AddDate()`\
    \ 方法进行修改，以指定年、月、日的三个参数。正值将推后日期，负值将推迟日期。例如，`time.AddDate(1, 0, 0)` 将日期推后一年。\n\n\
    同样，time 包的 `Add()` 方法可以用于指定单个持续时间参数来修改日期/时间。该值可以是一个表示修改时间的纳秒数的 `int64` 值。更方便，你可以使用常量\
    \ `time.Hour`、`time.Minute`、`time.Second` 或 `time.Millisecond` 来修改 Time 数据类型的各个时间字段。例如，`time.Add(10\
    \ * time.Hour)` 将时间推后 10 小时。\n\n你还可以使用 Go 标准库 time 包的 `Parse()` 函数从字符串创建自己的 Time\
    \ 数据类型。这需要两个参数来指定布局和日期/时间字符串。有用的是该函数返回两个值：一个 Time 数据类型和一个错误。如果函数返回 Time 数据类型，则错误值为\
    \ `nil`，否则它将是一个错误信息。\n\n布局应仅使用 Go 参考字符串中的值：\n\n**Mon Jan 2 15:04:05 2006 MST**\n\
    \n除非在日期/时间字符串指定了时区偏移值（例如 -0500），否则生成的 Time 数据类型将假设为 UTC 时间。\n\n![image](img/forget.jpg)\n\
    \n`Time` 数据类型可以使用此处描述的 `Format()` 方法进行格式化。\n\n![image](img/1b.jpg)首先在程序中导入 Go\
    \ 标准库 time 包\n\n```go\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n```\n\n![image](img/commons.jpg)\n\
    \nsrc\\setdate\\main.go\n\n![image](img/2b.jpg)接下来，创建并显示 Time 数据类型的日期/时间实例，初始化为元旦正午\n\
    \n```go\ndt := time.Date(2025, time.January, 1, 12, 0, 0, 0, time.Local)\nfmt.Printf(\"\
    \\nDateTime:\", dt)\n\ndt = dt.AddDate(0, 0, 2)\nfmt.Printf(\"\\nDateTime:\",\
    \ dt)\n\nlayout := \"2006-Jan-02 03:04PM\"\nstr := \"2030-Dec-25 12:30AM\"\nt,\
    \ err := time.Parse(layout, str)\nif err != nil {\n\tfmt.Println(err)\n} else\
    \ {\n\tfmt.Printf(\"Parsed DateTime: %v\\n\", t)\n}\n```\n\n![image](img/3b.jpg)将程序文件保存在“format”目录中，然后运行程序查看格式化后的日期和时间字段值\n\
    \n![image](img/4b.jpg)\n\n![image](img/5b.jpg)\n\n![image](img/pg117_1.jpg)\n\n\
    ![image](img/hot.jpg)\n\n`time.` 字段会自动识别从标准时间到夏令时间的变化\n\n## 识别时区\n\nGo 中的所有 Time\
    \ 类型都与时区关联。通常，这是 UTC 时间或基于系统位置的本地时间。然而，你可以指定另一个位置作为 `time.LoadLocation()` 的参数。位置名称必须对应于互联网分配数字（IANA）时区数据库中的文件。`time.LoadLocation()`\
    \ 函数返回两个值：一个 Location 类型和一个错误。\n\n![image](img/hot.jpg)某些时区会在夏令时改变时间，因此你可能需要评估时区缩写和偏移量以正确识别时区。\n\
    \n"
- fmt: "\n![image](images/2b.jpg)Next, create and initialize variables with a default\
    \ string value and a Time data type in a specified location\n\n```go\nzone :=\
    \ “All”\nloc, _ := time.LoadLocation( “America/New_York” )\ndt := time.Now( ).In(\
    \ loc )\n```\n\n![image](images/3b.jpg)Ascertain the time zone abbreviation and\
    \ offset seconds, then convert the offset to a positive minute number\n\n```go\n\
    abbr, offset := dt.Zone( )\nif offset < 1 {\n    offset = offset * -1\n}\noffset\
    \ /= 60\n```\n\n![image](images/4b.jpg)Now, evaluate the abbreviation and offset\
    \ values\n\n```go\nswitch {\ncase abbr == “EST” && offset == 300 :\n    zone =\
    \ “East Coast”\ncase abbr == “EDT” && offset == 240 :\n    zone = “East Coast”\n\
    }\n```\n\n![image](images/5b.jpg)Display the time zone details and an appropriate\
    \ message\n\n```go\nfmt.Printf( “\\nTZ: %v Offset Minutes: %v \\n”, abbr, offset\
    \ )\nfmt.Println( “Welcome to”, zone, “Visitors!” )\n```\n\n![image](images/6b.jpg)Save\
    \ the program file in a “zone” directory, then run the program to see the time\
    \ zone values\n\n![image](images/pg121_1.jpg)\n\n![image](images/forget.jpg)\n\
    \nA `_` blank identifier is used here to ignore the returned error value due to\
    \ space constraints, but you should ideally include an error-handler.\n\n### Delay\
    \ Time\n\nThe Go standard library `time` package provides a `Sleep( )` function\
    \ that allows you to delay progress of a program by a specified duration period.\
    \ The duration is supplied as an argument to the `Sleep( )` function, and can\
    \ be expressed as a multiplication of a time package constant. For example, `5\
    \ * time.Second` expresses a duration of five seconds.\n\n![image](images/pg122_1.jpg)\n\
    \nThe Go standard library `time` package also provides three methods that compare\
    \ an instance of the `Time` data type with another time specified as their argument.\
    \ These methods will each return a boolean true or false value according to the\
    \ result of the time comparison:\n\n| **Method** | **Returns** |\n| :--- | :---\
    \ |\n| **Before(**time**)** | A boolean **true** value if the instance time is\
    \ earlier than its argument time |\n| **After(**time**)** | A boolean **true**\
    \ value if the instance time is later than its argument time |\n| **Equal(**time**)**\
    \ | A boolean **true** value if the instance time and argument time represent\
    \ the same instant – even in different time zones |\n\nIf you would like to see\
    \ the difference between two instances of the `Time` data type, you can use a\
    \ `Sub( )` method of a time instance to specify another time instance as its argument.\
    \ This method will return the elapsed duration between the two instants as an\
    \ `int64` data type value of nanosecond precision.\n\nIt is often preferable to\
    \ present duration periods with less than nanosecond precision, so the Go standard\
    \ library `time` package includes a `Round( )` method to specify more concise\
    \ precision. This method requires one argument to determine your preferred rounding\
    \ behavior. Typically, the argument is supplied as one of the time package constants.\
    \ For example, calling the method with `Round( time.Millisecond )` will round\
    \ a nanosecond precision duration to the nearest millisecond, `Round( time.Second\
    \ )` will round a nanosecond precision duration to the nearest second, and so\
    \ on.\n\n![image](images/1b.jpg)Begin by importing the Go standard library time\
    \ package into a program\n\n```go\nimport (\n    “fmt”\n    “time”\n)\n```\n\n\
    ![image](images/commons.jpg)\n\nsrc\\delay\\main.go\n\n![image](images/2b.jpg)Next,\
    \ create and display components of a Time data type\n\n```go\nstart := time.Now(\
    \ )\nfmt.Println( “\\nStarted At:”, start.Format( “03:04:05” ) )\n```\n\n![image](images/3b.jpg)Now,\
    \ delay the program’s progress for five seconds\n\n```go\ntime.Sleep( 5 * time.Second\
    \ )\n```\n\n![image](images/4b.jpg)Then, create and display a second Time data\
    \ type\n\n```go\nfinish := time.Now( )\nfmt.Println( “\\Finished At:”, finish.Format(\
    \ “03:04:05” ) )\n```\n\n![image](images/5b.jpg)Compare the start and finish times\n\
    \n```go\nfmt.Println( “\\nStart First?:”, start.Before( finish ) )\nfmt.Println(\
    \ “Finish First?:”, finish.Before( start ) )\n```\n\n![image](images/6b.jpg)Finally,\
    \ display the length of the delay\n\n```go\ndiff := finish.Sub( start )\nfmt.Println(\
    \ “\\nTime Elapsed:”, diff.Round( time.Second ) )\n```\n\n![image](images/7b.jpg)Save\
    \ the program file in a “delay” directory, then run the program to see the time\
    \ delay\n\n![image](images/pg123_1.jpg)\n\n![image](images/hot.jpg)\n\nThe ability\
    \ to delay execution is particularly useful in pausing individual “goroutines”\
    \ – see the example [here](#chapter11.xhtml_package) for more details.\n\n###\
    \ Summary\n\n- The Go standard library `time` package contains functions to create\
    \ `Time` data types comprising date, time, and zone fields.\n- A `Time` data type\
    \ is not a string, but can be converted to a string using its `String( )` method.\n\
    - The `time.Now( )` function returns the current date, time, and zone from the\
    \ system time at the current locale.\n- Date components can be extracted from\
    \ a `Time` data type using `Year()`, `Month()`, `Day()`, `Hour()`, `Minute()`,\
    \ `Second()`, and `Nanosecond()` methods.\n- `Time` components can be extracted\
    \ from a `Time` type using `Hour()`, `Minute()`, `Second()`, and `Nanosecond()`\
    \ methods.\n- The `Date( )` function is used to create date, month, day, hour,\
    \ minute, second, and nanosecond.\n- The `time` package contains constants for\
    \ month names, hour, minute, second, millisecond, and location.\n- The `LoadLocation(\
    \ )` function requires an IANA location name, and `In( )` function applies a location.\n\
    - `time.Sleep( )` function delays execution of a program by the duration specified\
    \ as its argument.\n- The `Sub( )` method returns elapsed duration between two\
    \ times, and `Round( )` method can specify its precision.\n\n# 9 Manage Data\n\
    \n***This chapter demonstrates how to manipulate text and numbers using the math,\
    \ `string`, and `strconv` packages.***\n\n- [Unite Strings](#chapter09.xhtml_sec61)\n\
    - [Split Strings](#chapter09.xhtml_sec62)\n- [Find Characters](#chapter09.xhtml_sec63)\n\
    - [Convert Strings](#chapter09.xhtml_sec64)\n- [Calculate Areas](#chapter09.xhtml_sec65)\n\
    - [Evaluate Numbers](#chapter09.xhtml_sec66)\n- [Round Decimals](#chapter09.xhtml_sec67)\n\
    - [Generate Randoms](#chapter09.xhtml_sec68)\n- [Summary](#chapter09.xhtml_sec69)\n\
    \n## Unite Strings\n\n![image](images/pg126_1.jpg)\n\nIn Go programming, a string\
    \ is zero or more characters enclosed within double quote marks. So, these are\
    \ all valid string values:\n\n```go\ns1 := “My First String”\ns2 := “”\ns3 :=\
    \ “2”\ns4 = “nil”\n```\n\nThe empty quotes of `s2` initialize the variable as\
    \ an empty string value. The numeric value assigned to `s3` is a string representation\
    \ of the number. The Go `nil` zero value, which normally represents the absence\
    \ of any value, is simply a string literal when it is enclosed within quotes.\n\
    \nEssentially, a string is a collection of characters; each character containing\
