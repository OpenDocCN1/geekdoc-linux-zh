    \ everything except temptation\"\n```\n\n![image](img/3r.jpg)\n接下来，测试子字符串是否存在于字符串中，然后找到第一个实例的索引位置\n\
    \n```go\nfmt.Printf(\"\\nFound ‘an’: %v \\n\", strings.Contains(str, \"an\"))\n\
    fmt.Printf(\"Found ‘an’ at: %v \\n\", strings.Index(str, \"an\"))\n```\n\n![image](img/4r.jpg)\n\
