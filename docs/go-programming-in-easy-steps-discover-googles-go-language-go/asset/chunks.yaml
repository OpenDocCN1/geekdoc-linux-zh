    \n```go\nsum = 7 % ( 3 * 2 )\nfmt.Printf( “Forced Order: %v \\n\\n”, sum )\n```\n\
    \n![image](img/7g.jpg)将程序文件保存到“force”目录中，然后运行程序查看不同的结果\n\n![image](img/pg45_1.jpg)\n\
    \n![image](img/hot.jpg)\n\n在你的表达式中使用括号以避免意外的结果。\n\n## 总结\n\n- 算术运算符可以形成两个操作数的表达式，如加法\
    \ `+`、减法 `-`、乘法 `*`、除法 `/` 和取模 `%`。\n- 增增 `++` 和减减 `--` 运算符按 1 修改单个操作数。\n- 赋值\
    \ `=` 运算符可以与算术运算符结合以执行算术计算然后赋值其结果。\n- 比较运算符可以形成比较两个数的相等 `==`、不相等 `!=`、大于 `>`、小于\
    \ `<`、大于等于 `>=` 和小于等于 `<=`。\n- 逻辑 `&&` 和逻辑 `||` 运算符形成表达式。\n- 逻辑 `!` 运算符返回值的反反。\n\
