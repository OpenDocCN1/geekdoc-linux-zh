    \ 实例。当数据源为用户输入时，你可以导入 Go 标准库中的 `os` 包，并将 `os.Stdin`（标准输入）作为 `NewScanner()` 的参数。\n\
    \n`Scanner` 实例有一个 `Scan()` 方法，用于读取所有用户输入，以及一个 `Text()` 方法，它将已读取的输入作为单个字符串值返回。\n\
    \n`Scanner` 实例还有一个 `Err()` 方法，它将返回任何读取错误。如果没有遇到错误，错误值将如常地为 `nil`。在调用 `Scan()`\
    \ 方法和 `Text()` 方法后检查错误是有用的。\n\n如果你想将输入拆分为单个字符串项，可以导入 Go 标准库中的 `strings` 包，并将输入传递给它的\
    \ `Fields()` 函数，以将字符串拆分为单词。\n\n![image](img/1g.jpg)首先在程序中导入 Go 标准库的 `bufio`、`os`\
    \ 和 `strings` 包，以处理输入\n\n```go\nimport (\n\t\"fmt\"\n\t\"bufio\"\n\t\"os\"\n\t\
    \"strings\"\n)\n```\n\n![image](img/commong.jpg)\n\nsrc\\buffer\\main.go\n\n![image](img/2g.jpg)接下来，请求用户输入\n\
    \n```go\nfmt.Print( \"\\nEnter Text:\" )\n```\n\n![image](img/3g.jpg)现在，创建一个 `Scanner`\
    \ 实例将用户输入存储在内存缓冲区中，然后读取用户输入\n\n```go\nscanner := bufio.NewScanner( os.Stdin )\n\
    scanner.Scan( )\n```\n\n![image](img/4g.jpg)然后，如果发生错误，则输出错误，否则输出存储的数据\n\n```go\n\
    if scanner.Err( ) != nil {\n\tfmt.Println( scanner.Err( ) )\n} else {\n\tfmt.Println(\
    \ scanner.Text( ) )\n}\n```\n\n![image](img/5g.jpg)接下来，创建一个新的 `Scanner` 实例，将其他用户输入存储在内存缓冲区中\n\
    \n```go\nfmt.Print( \"\\nEnter Text:\" )\nscanner = bufio.NewScanner( os.Stdin\
    \ )\nscanner.Scan( )\n```\n\n![image](img/6g.jpg)然后，将用户输入的各个项存储在切片的各个元素中\n\n```go\n\
    words := strings.Fields( scanner.Text( ) )\n```\n\n![image](img/7g.jpg)最后，如果发生错误，则输出错误，或者列出用户输入的各个项\n\
    \n```go\nif scanner.Err( ) != nil {\n\tfmt.Println( scanner.Err( ) )\n} else {\n\
