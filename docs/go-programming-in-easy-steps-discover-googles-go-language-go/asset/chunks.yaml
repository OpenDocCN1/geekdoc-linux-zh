    \n![image](img/2o.jpg)接下来，插入语句修改接收到的参数并显示其新值\n\n```go\nnum = *num * *num\n```\n\
    \n```go\nfmt.Println( “\\t\\tModified Original:”, *num )\n```\n\n![image](img/3o.jpg)开始一个\
    \ main 函数，声明并初始化一个变量，然后显示它的值\n\n```go\nfunc main( ) {\nnum := 5\nfmt.Println(\
    \ “Original:”, num )\n// 在此处插入语句。\n}\n```\n\n![image](img/4o.jpg)现在，在 main 函数中插入语句调用另一个函数，并再次显示其变量值\n\
    \n```go\nsquare( &num )\nfmt.Println( “Original:”, num )\n```\n\n![image](img/5o.jpg)将程序文件保存在“refs”目录中，然后运行程序查看原始值已改变\n\
    \n![image](img/pg67_1.jpg)\n\n![image](img/forget.jpg)\n\n在函数调用中传递指针参数时，如果你需要传递存储该值的内存地址，请加上\
    \ `&` 符号前缀。\n\n### 返回值\n\n本章目前为止描述的函数只是在函数调用后的下一个语句恢复程序流，但让函数在继续执行后续语句之前向调用者返回一个值，通常是有帮助的。\n\
    \n![image](img/pg68_1.jpg)\n\n在声明一个返回值的函数时，函数签名必须在参数列表之后定义返回值的数据类型。要返回的值通常在函数体末尾通过\
    \ Go 的 `return` 关键字指定。返回单个值的函数语法如下：\n\n```go\nfunc *funcName* ( *paramName* *type*\
    \ ) returnType {\n    *statements-to-be-executed*\n    return returnValue\n}\n\
    ```\n\n与大多数只能返回一个值的语言不同，Go 编程中的函数可以返回多个值。返回多个值的函数语法如下：\n\n```go\nfunc *funcName*\
    \ ( *paramName* *type* ) ( returnType, returnType ) {\n    *statements-to-be-executed*\n\
    \    return returnValue\n}\n```\n\n如果你调用一个返回多个值的函数但没有在程序代码中使用所有返回值，编译器将产生“声明但未使用”的消息，程序将无法运行。为了避免这种情况，你可以将任何返回值赋值给\
    \ `_`。这在 Go 编程中被称为“空白标识符”。\n\n标准库中的许多函数返回多个值，特别是为了返回结果和错误值。\n\n![image](img/1o.jpg)创建一个需要单个整数参数并向调用者返回三个值的函数\n\
    \n```go\nfunc cube( num int ) ( string, int, int ) {\n    return “Result”, num,\
    \ ( num * num * num )\n}\n```\n\n![image](img/commono.jpg)\n\n`src\\returns\\\
    main.go`\n\n![image](img/2o.jpg)添加一个 main 函数将三个返回值赋值给三个变量，然后尝试显示两个值\n\n```go\n\
    func main( ) {\na, b, c := cube( 5 )\nfmt.Println( b, “Cubed =”, c )\n}\n```\n\
    \n![image](img/3o.jpg)将程序文件保存在“returns”目录中，然后运行程序查看编译器错误\n\n![image](img/pg69_1.jpg)\n\
    \n![image](img/4o.jpg)修改 main 函数中的赋值，将第一个返回值赋值给空白标识符\n\n```go\nfunc main( ) {\n\
    _, b, c := cube( 5 )\nfmt.Println( b, “Cubed =”, c )\n}\n```\n\n![image](img/5o.jpg)再次保存程序文件，然后运行程序，看到输出中打印了两个返回值\n\
    \n![image](img/pg69_2.jpg)\n\n![image](img/forget.jpg)\n\n返回的“Result”**字符串**值在此处没有被使用。\n\
    \n### 递归调用\n\n自定义函数中的语句可以自由地调用其他自定义函数，就像调用标准 Go 库函数如 `fmt.Printf()` 一样。此外，函数可以递归“递归”。与循环一样，重要的是递归函数调用必须修改被测试的表达式以避免连续执行——这样函数会在某个时刻退出。\n"
- fmt: "\nRecursive function calls can be used to emulate loop structures, such as\
    \ the countdown example [here](#chapter04.xhtml_Begin):\n\n![image](images/1o.jpg)Create\
    \ a function that requires an integer argument and makes recursive calls until\
    \ that value is decremented to zero\n\n```go\nfunc countDn( num int ) {\n    if\
    \ num < 1 {\n        fmt.Println( “\\t\\t\\t\\tLift Off!” )\n    } else {\n  \
    \      fmt.Println( “\\t\\t\\tCountdown”, num )\n        num--\n        countDn(\
    \ num )\n    }\n}\n```\n\n![image](images/commono.jpg)\n\n`src\\recur\\main.go`\n\
    \n![image](images/2o.jpg)Add a main function that contains a statement to call\
    \ the function above\n\n```go\nfunc main( ) {\n    countDn( 10 )\n}\n```\n\n![image](images/3o.jpg)Save\
    \ the program file in a “recur” directory, then run the program to see recursive\
    \ function calls emulate a loop\n\n![image](images/pg70_2.jpg)\n\n![image](images/pg70_3.jpg)\n\
    \nRecursive function calls are useful to resolve mathematical problems, such as\
    \ the calculation of the factorial of a given number. The factorial is the multiplication\
    \ of all integers from the given number down to one – e.g. the factorial of 3\
    \ is 6 (3 * 2 * 1).\n\n![image](images/1o.jpg)Create a function that requires\
    \ an integer argument and will return one integer value upon each call\n\n```go\n\
    func facto( num int ) int {\n    // Statements to be inserted here.\n}\n```\n\n\
    ![image](images/commono.jpg)\n\n`src\\facto\\main.go`\n\n![image](images/2o.jpg)Next,\
    \ insert a statement to return a one (1) when the argument value is decremented\
    \ to zero (0)\n\n```go\nif num == 0 {\n    return 1\n}\n```\n\n![image](images/3o.jpg)Then,\
    \ insert a final statement to recursively call the function, to multiply all numbers\
    \ in the sequence\n\n```go\nreturn num * facto( num - 1 )\n```\n\n![image](images/4o.jpg)Add\
    \ a main function that contains a statement to print out seven factorials\n\n\
    ```go\nfunc main( ) {\n    for i := 1 ; i <= 7 ; i++ {\n        fmt.Println( “Factorial“,\
    \ i, “=”, facto( i ) )\n    }\n}\n```\n\n![image](images/5o.jpg)Save the program\
    \ file in a “facto” directory, then run the program to see a factorial sequence\n\
    \n![image](images/pg71_1.jpg)\n\n![image](images/snake.jpg)\n\nRecursive functions\
    \ are useful, but not very efficient. This example calls the `facto()` function\
    \ 35 times to generate this sequence of just 7 factorials!\n\n## Enclose Anonymously\n\
    \nThe Go programming language has support for “first class functions”. This allows\
    \ functions to be assigned to variables, passed as arguments to other functions,\
    \ and returned from functions.\n\n![image](images/pg72_1.jpg)\n\n## Anonymous\
    \ Functions\n\nAn anonymous function is simply a function definition that does\
    \ not contain a name. This is useful to create a function inline without having\
    \ to name it. Anonymous functions are also known as “function literals”. Like\
    \ other functions, these can contain a parameter list, return type list, and can\
    \ return multiple values. You can create a self-invoking anonymous function expression\
    \ by appending the `()` call operator at the end of the function definition, like\
    \ this:\n\n```go\nfunc( ) { fmt.Println( “Function Literal” ) } ( )\n```\n\nAdditionally,\
    \ an anonymous function can be assigned to a variable, then called by appending\
    \ the `()` call operator after the variable name, like this:\n\n```go\nfn := func(\
    \ ) { fmt.Println( “Function Literal” ) }\nfn( )\n```\n\n![image](images/hot.jpg)\n\
    \nSelf-invoking function expressions execute their statements one time only.\n\
    \n## Closures\n\nPerhaps the most useful purpose of anonymous functions is for\
    \ the creationion of “closures”. A closure is a function nested inside an outer\
    \ function that retains access to variables declared in the outer function. The\
    \ outer function can return an anonymous function that retains access to the variables\
    \ but, crucially, the variables are not accessible from anywhere else in the program\
    \ code. This is a form of encapsulation that protects the data stored in those\
    \ variables as the returned anonymous function “closes over” them.\n\nThe closure\
    \ can be made self-invoking for assignment to a variable by appending the `()`\
    \ call operator after the end of the outer function definition. The anonymous\
    \ inner function can then be called by appending the `()` call operator after\
    \ the variable name – and can access the persistent value in the outer function.\n\
    \nIt can be difficult to grasp the concept of closures, as it would seem that\
    \ the variable in the outer function should be destroyed when the self-invoking\
    \ function has completed execution.\n\n![image](images/hot.jpg)\n\nDon’t worry\
    \ if you can’t immediately understand how closures work. They can seem mystical\
    \ at first, but will become clearer with experience. You can continue on and come\
    \ back to this technique later.\n\n![image](images/1o.jpg)Begin a main function\
    \ by assigning an anonymous function to a variable\n\n```go\nfunc main( ) {\n\
    \    area := func( length, width int ) int {\n        return length * width\n\
    \    }\n}\n```\n\n![image](images/commono.jpg)\n\n`src\\anon\\main.go`\n\n![image](images/2o.jpg)Next,\
    \ insert statements to display the anonymous function’s type\n\n```go\nfmt.Printf(\
    \ “area type: %T\\n\", area )\n```\n\n![image](images/3o.jpg)Now, insert statements\
    \ to assign a self-invoking function to a variable\n\n```go\ncounter := func(\
    \ ) func( ) int {\n    num := 0\n    return func( ) int {\n        num++\n   \
    \     return num\n    }\n}()\n```\n\n![image](images/4o.jpg)Finally, insert statements\
    \ to display the closure function’s type and returned values\n\n```go\nfmt.Printf(\
    \ “counter type: %T\\n\", counter )\nfmt.Println( “Count: 1:”, counter() )\nfmt.Println(\
    \ “Count: 2:”, counter() )\nfmt.Println( “Count: 3:”, counter() )\n```\n\n![image](images/5o.jpg)Save\
    \ the program file in an “anon” directory, then run the program to see function\
    \ types and returned values\n\n![image](images/pg73_1.jpg)\n\n![image](images/forget.jpg)\n\
    \nNotice that the outer function must state its return type as `func() int` because\
    \ it will return a function that will return an integer value.\n\n## Pass Functions\n\
    \n![image](images/pg74_1.jpg)\n\n## Programmer-defined Function Types\n\nThe output\
    \ from the previous example [chapter05.xhtml_assigning](# describes the function\
    \ by its signature, for example, counter type : func() int. You can declare a\
    \ custom function type using the `type` keyword, followed by a type name, and\
    \ a function signature. For example, a custom function named `adder` that must\
    \ receive two integer arguments and return one integer argument, like this:\n\n\
    ```go\ntype adder func( int, int ) int\n```\n\nVariables can then be created as\
    \ “instances” of the custom function type, and be assigned a function definition\
    \ – whose signature must match that in the custom function type. The function\
    \ (instance) can be called in the usual way.\n\n## Higher-order Functions\n\n\
    Regular functions that receive value or reference arguments, and return these\
    \ types to the caller, are called “first-order” functions. But functions can also\
    \ be passed as arguments to other functions, and functions can return functions\
    \ to the caller. Any function that accepts functions as arguments, or any function\
    \ that returns one or more functions, is regarded as a “higher-order” function.\n\
    \nPassing functions to other functions allows actions to be modified without repeating\
    \ existing lines of code.\n\n![image](images/1o.jpg)Begin a main function by declaring\
    \ a custom function type that has a signature requiring two integer arguments\
    \ and an integer return type\n\n```go\nfunc main( ) {\n    type adder func( int,\
    \ int ) int\n}\n```\n\n![image](images/commono.jpg)\n\n`src\\ftype\\main.go`\n\
    \n![image](images/2o.jpg)Next, insert a statement to define a function (instance)\
    \ of the custom function type – with a matching signature\n\n```go\nvar add adder\
    \ = func( a int, b int ) int {\n    return a + b\n}\n```\n\n![image](images/3o.jpg)Now,\
    \ insert a statement that calls the function (instance)\n\n```go\nfmt.Println(\
    \ “Added:”, add( 6, 2 ) )\n```\n"
