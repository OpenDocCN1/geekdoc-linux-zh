    \ first click **View**, **Appearance**, **Show Activity Bar**, then click the\
    \ **Extensions** button on the Activity Bar\n\n![image](images/pg18_2.jpg)\n\n\
    ![image](images/3b.jpg)Next, type “go” into the search box to find the VS Code\
