    **str := “I can, and, I will.”**


    ![image](images/3r.jpg)Next, add statements to pass a description and substrings
    of the variable string to a listing function


    **list( “Fields”, strings.Fields( str ) )**


    **list( “Split”, strings.Split( str, “,” ) )**


    **list( “SplitN”, strings.SplitN( str, “,“, 2 ) )**


    **list( “SplitAfter”, strings.SplitAfter( str, “,” ) )**


    **list( “SplitAfterN”, strings.SplitAfterN( str, “,”, 2 ) )**


    ![image](images/4r.jpg)After the main function, add the function to list the description
    and all substrings upon each call


    **func list( desc string, subs [ ]string ) {**


    **fmt.Print( “\n”, desc, “: “ )**


    **for _, v := range subs {**


    **fmt.Print( “[“, v, “] “ )**


    **}**


    **fmt.Print( “\n” )**


    **}**


