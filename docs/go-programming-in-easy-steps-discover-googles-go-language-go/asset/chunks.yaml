    \nThe Go `math` package provides these useful functions that can be used to evaluate\
    \ `float64` arguments:\n\n| Function | Returns |\n| :--- | :--- |\n| `math.Abs()\
    \ ` | An absolute value |\n| `math.Acos()` | An arc cosine value |\n| `math.Asin()`\
