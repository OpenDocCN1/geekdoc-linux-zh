    \n![image](img/pg29_1.jpg)\n\n![image](img/hot.jpg)\n\nGo 中的 `math` 包提供了一个名为 `math.Pi`\
    \ 的常量，它是对 ![image](img/py.jpg) 数值的远精确近似。\n\n![image](img/hot.jpg)\n\n这里的序列代表了台球比赛中每个球的分值。\n\
    \n## 指向存储的值\n\n每当你的程序创建一个用于存储数据的容器时，你的计算机会在内存中分配一个空间来存储这些数据。就像房子一样，内存位置的大小可能不同，但每个位置都有唯一的地址。\n\
    \n![image](img/pg30_1.jpg)\n\n因此，一个初始化的变量实际上由三部分组成：名称、值以及存储数据的内存地址。\n\n![image](img/pg30_2.jpg)\n\
    \nGo 语言支持“指针”（pointers）的概念。指针变量可以存储另一个变量的地址，并访问该地址上存储的值。\n\n指针变量的声明需要在数据类型前加上一个星号\
    \ `*`，表示这是一个指针：\n\n```go\nvar ptr *int      // 声明此变量将指向一个 int。\n```\n\n通过在另一个变量名前加上\
    \ `&` 符号，可以将另一个变量的地址赋值给指针：\n\n```go\nptr = &num        // 给指针变量赋值一个地址。\n```\n\n\
    然后，通过在指针名称前加上星号来访问所赋值地址的值：\n\n```go\n*ptr              // 指向赋值地址处的值。\n```\n\n\
    ![image](img/pg30_3.jpg)\n\n指针的概念可能很难理解，因为 `*` 运算符承担了两个用途：在声明中作为类型描述符，在放在指针名称之前时作为解引用符（dereferencer）。你现在可能在想“指针又怎样？”但指针在\
    \ Go 编程中被广泛使用，因此在继续之前，你应该彻底理解它们的工作原理。\n\n![image](img/hot.jpg)\n\n内存地址是由你的计算机分配的十六进制数。它们在你的系统上的地址肯定与示例中显示的地址不同。\n\
    \n![image](img/1r.jpg)在你的“src”文件夹内创建一个名为“point”的目录\n\n![image](img/commonr.jpg)\n\
    \n`src\\point\\main.go`\n\n![image](img/2r.jpg)开始带有 package 和 import 声明的 main.go\
    \ 程序\n\n```go\npackage main\n\nimport \"fmt\"\n```\n\n![image](img/3r.jpg)添加一个\
    \ main 函数，用于声明并初始化一个普通整数变量指针变量\n\n```go\nfunc main() {\n    var num int = 20\n\
    \    var ptr *int = &num\n    // 在此处插入语句。\n}\n```\n\n![image](img/4r.jpg)接下来，插入语句以显示值和内存地址\n\
