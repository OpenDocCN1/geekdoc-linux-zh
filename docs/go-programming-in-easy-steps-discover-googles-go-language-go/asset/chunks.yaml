    **Return Values**


    The functions described so far in this chapter simply resume the program flow
    at the next statement after the function call, but it is often useful to have
    a function return a value to the caller before continuing to execute subsequent
    statements.


    ![image](images/pg68_1.jpg)


    When declaring a function that will return a value, the function signature must
    define the data type of the return value after its parameter list. The value to
    be returned is specified, typically at the end of a function body, to the Go return
    keyword. The syntax of a function that will return a single value looks like this:


    func ***funcName* ( *paramName type* ) *returnType* {**


    ***statements-to-be-executed***


    **return *returnValue***


    **}**


    Unlike most other programming languages that can only return one value, functions
    in Go programming can return multiple values. When you want to return multiple
    values, the data type of each value must be specified as a comma-separated list
    in parentheses after the parameter list. The values to be returned are specified,
    typically at the end of a function body, to the Go return keyword. The syntax
    of a function that will return two values looks like this:


    func ***funcName* ( *paramName type* ) ( *returnType*, *returnType* ) {**


    ***statements-to-be-executed***


    return ***returnValue*, *returnValue***


    **}**


    The values specified to the return keyword must each be of the same type specified
    in the function signature, and they must be listed in the same order.


    If you call a function that returns multiple values but doesn’t use all the returned
    values in your subsequent program code, the compiler will produce a “declared
    but not used” message, and the program will not run. To avoid this, you can assign
    any unwanted returned values to an _ underscore character. This is called a “blank
    identifier” in Go programming.


