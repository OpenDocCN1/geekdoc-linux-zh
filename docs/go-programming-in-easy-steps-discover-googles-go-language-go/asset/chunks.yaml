    \ {\n\tfmt.Printf(\"\\nGoroutine %v Started\", i)\n\ttime.Sleep(1 * time.Second)\n\
    \tfmt.Printf(\"\\n\\t\\t\\tGoroutine %v Ended\", i)\n\twg.Done()\n}\n```\n\n![image](img/6p.jpg)将程序文件保存到“waitgroup”目录，然后运行程序以查看程序等待\
    \ goroutine 的情况。\n\n![image](img/pg161_1.jpg)\n\n![image](img/hot.jpg)\n\n你也可以在函数开始处使用\
    \ `defer wg.Done()` 来确保 Waitgroup 收到完成。\n\n## 创建通道\n\ngoroutine 允许代码以独立的方式并发执行，但你可以通过使用“通道（channels）”让\
    \ goroutine 之间进行通信。\n\n![image](img/pg162_1.jpg)\n\nGo 通道就像一根管道，你可以通过它发送或接收消息。重要的一点是，发送和接收操作是“阻塞”操作——当发送消息时，通道将等待直到接收者准备好接受消息；当接收消息时，通道将等待直到发送者实际交付消息。\n\
    \n通过在内置函数 `make()` 中指定 `chan` 关键字并将数据类型作为参数来创建通道，如下所示：\n\n```go\nchannelName :=\
    \ make(chan *dataType)\n```\n\n你可以使用 `<-` 箭头运算符将值发送到通道，将值定向入通道，语法如下：\n\n```go\n\
    channelName <- message\n```\n\n相反，你可以使用 `<-` 箭头运算符从通道接收值，将值重定向到变量，语法如下：\n\n```go\n\
    variableName <- channelName\n```\n\n确保接收者不会等待一个永远不会到达的消息是非常重要的。这会导致称为“死锁（deadlock）”的致命错误——即程序永远无法继续。为了避免这种情况，发送者可以将通道名称作为内置函数\
    \ `close()` 的参数，在将不再发送更多消息时显式地关闭通道。\n\n接收者可以可选地接收第二个值，它是一个布尔值，当通道打开时为真，当通道关闭时为假。\n\
    \n```go\nvariableName, channelOpenState <- channelName\n```\n\n这可以用来检查通道状态，并用于在通道确定关闭后退出包含接收者的循环。\n\
    \n![image](img/snake.jpg)\n\n只有发送者应该关闭通道——永远不要使用接收者来关闭通道，以防发送者尚未完成。\n\n![image](img/1p.jpg)首先导入\
    \ Go 标准库中的 `time` 包，以便允许延迟并获取当前时间。\n\n```go\nimport (\n\t\"fmt\"\n\t\"time\"\n\
    )\n```\n\n![image](img/commonp.jpg)\n\nsrc\\channel\\main.go\n\n![image](img/2p.jpg)接下来，在\
    \ `main` 函数中，创建一个字符串类型的通道。\n\n```go\nc := make(chan string)\n```\n\n![image](img/3p.jpg)添加一个传递字符串值和通道的\
    \ goroutine。\n\n```go\ngo count(\"Message\", c)\n```\n\n![image](img/4p.jpg)现在，添加一个包含通道接收者的循环，它将打印接收的消息直到通道关闭。\n\
    \n```go\nfor {\n\tmsg, open := <-c\n\tif !open {\n\t\tbreak\n\t}\n\tfmt.Println(msg)\n\
    }\n```\n\n![image](img/5p.jpg)现在，添加一个包含通道发送者的循环函数，它将每隔 1 秒发送一次消息，然后在循环结束时关闭通道。\n\
    \n```go\nfunc count(msg string, c chan string) {\n\tfor i := 0; i < 3; i++ {\n\
    \t\tc <- msg + time.Now().Format(\"15:04:05\")\n\t\ttime.Sleep(1 * time.Second)\n\
    \t}\n\tclose(c)\n}\n```\n\n```\n\n![image](img/6p.jpg)\n\n"
- fmt: "\nWhen multiple goroutines send messages to channels at different times, the\
    \ program may block progress while waiting to receive messages from the slower\
    \ channels. Go provides a solution to this blocking action by simultaneously listening\
    \ for messages from multiple channels in a `select` statement block. This has\
    \ similar syntax to the `switch` statement described [here](#chapter04.xhtml_sec23),\
    \ but a `select` statement blocks until one of its `case` statements finds a match.\
    \ When a match is found, the statements associated with that case statement get\
    \ executed. This ability to combine goroutines and channels is a powerful feature\
    \ of the Go programming language.\n\n![image](images/pg166_1.jpg)\n\nTo continuously\
    \ listen for channel messages, a `select` statement can be enclosed inside an\
    \ infinite `for` loop. The loop can be exited by including a `case` statement\
    \ with an associated statement that will break out of the loop to an outer label.\n\
    \nThe Go standard library `time` package provides a useful `After()` function\
    \ that can be used to create a “timeout” to limit execution time of the listening\
    \ loop. This requires a duration period as its argument, and returns a channel\
    \ of the `time.Time` type – that will be the future time after the duration beyond\
    \ the current time. Testing for when the current time matches the timeout channel\
    \ with a `case` statement can be used to exit a listening loop.\n\n![image](images/1p.jpg)Begin\
    \ by importing the Go standard library `time` package, to wait for goroutines\
    \ and to create a timeout\n\n```go\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n```\n\n\
    ![image](images/commonp.jpg)\n\nsrc\\select\\main.go\n\n![image](images/2p.jpg)Next,\
    \ in the main function, create a timeout channel and two empty channels\n\n```go\n\
    c0 := time.After( 7 * time.Second )\nc1 := make( chan string )\nc2 := make( chan\
    \ string )\n```\n\n![image](images/3p.jpg)Now, add two goroutine calls that each\
    \ pass a channel\n\n```go\ngo fastCount( c1 )\ngo slowCount( c2 )\n```\n\n![image](images/4p.jpg)After\
    \ the main function, add the two called functions that will send channel messages\
    \ at different intervals\n\n```go\nfunc fastCount( c1 chan string ) {\n\tfor {\n\
    \t\ttime.Sleep( 1 * time.Second )\n\t\tc1 <- time.Now().Format( “04:05” )\n\t\
    }\n}\n\nfunc slowCount( c2 chan string ) {\n\tfor {\n\t\ttime.Sleep( 2 * time.Second\
    \ )\n\t\tc2 <- time.Now().Format( “04:05” )\n\t}\n}\n```\n\n![image](images/5p.jpg)Now,\
    \ back in the main function, add an infinite loop to receive messages from any\
    \ of the three channels\n\n![image](images/pg167_2.jpg)\n\n![image](images/6p.jpg)Save\
    \ the program file in a “select” directory, then run the program to see the channel\
    \ messages\n\n![image](images/pg167_1.jpg)\n\n![image](images/snake.jpg)\n\nAn\
    \ unlabeled `break` statement would only break out of the `select` statement –\
    \ allowing the `for` loop to continue! A labeled `break` statement breaks out\
    \ of both the `select` statement and the infinite `for` loop.\n\n### Synchronize\
    \ Goroutines\n\nThe blocking action of unbuffered channels, where the sending\
    \ action blocks a sending goroutine until another goroutine receives the delivery\
    \ on the same channel, causes the sending and receiving goroutines to synchronize.\
    \ In fact, unbuffered channels are sometimes referred to as “synchronous channels”.\n\
    \n![image](images/pg168_1.jpg)\n\nChannels can, therefore, be used to connect\
    \ goroutines together in a “pipeline”, in which an item sent from one goroutine\
    \ is the item received by another goroutine. Each goroutine in the pipeline will\
    \ wait until the channel has been “drained” before sending the next item along\
    \ the pipeline.\n\nBy default, channels can both send and receive, but when you\
    \ pass a channel to a goroutine you can specify in the function parameter whether\
    \ the channel may only send items, or only receive items. A send-only channel\
    \ is specified in the parameter by prefixing the `chan` keyword with the `<-`\
    \ operator, like this:\n\n```go\nfunc funcName ( paramName <-chan dataType )\n\
    ```\n\nConversely, a receive-only channel is specified in the parameter by suffixing\
    \ the `chan` keyword with the `<-` operator, like this:\n\n```go\nfunc funcName\
    \ ( paramName chan<- dataType )\n```\n\nSpecifying a single permissible direction\
    \ is recommended to reduce the possibility of bugs in your programs.\n\n![image](images/1p.jpg)Begin\
    \ a main function by creating two unbuffered channels for integer items\n\n```go\n\
    nums := make( chan int )\nsqrs := make( chan int )\n```\n\n![image](images/commonp.jpg)\n\
    \nsrc\\synchronize\\main.go\n\n![image](images/2p.jpg)Next, add a goroutine call\
    \ that passes one channel, which will begin a pipeline\n\n```go\ngo count( nums\
    \ )\n```\n\n![image](images/3p.jpg)Now, add a goroutine call that passes two channels,\
    \ which will continue the pipeline\n\n```go\ngo square( nums, sqrs )\n```\n\n\
    ![image](images/4p.jpg)After the main function, add the first called function,\
    \ with a receive-only channel to which it will send 10 individual integers one-by-one\
    \ when the pipeline is clear\n\n```go\nfunc count( nums chan<- int ) {\n\tfor\
    \ i := 1 ; i <= 10 ; i++ {\n\t\tnums <- i\n\t}\n\tclose( nums )\n}\n```\n\n![image](images/5p.jpg)Add\
    \ the second called function, with a send-only channel, and a receive-only channel\
    \ to which it will send 10 results one-by-one when the pipeline is clear\n\n```go\n\
    func square( nums <-chan int, sqrs chan<- int ) {\n\tfor i := 1 ; i <= 10 ; i++\
    \ {\n\t\tnum := <- nums\n\t\tsqrs <- num\n\t}\n\tclose( sqrs )\n}\n```\n\n![image](images/6p.jpg)Now,\
    \ back in the main function, add a loop to receive results at the end of the pipeline\n\
    \n```go\nfor i := 1 ; i <= 10 ; i++ {\n\tnum := <- sqrs\n\tfmt.Printf( “%v x %v\
    \ = %v \\n”, i, i, num )\n}\n```\n\n![image](images/7p.jpg)Save the program file\
    \ in a “synchronize” directory, then run the program to see the results\n\n![image](images/pg169_1.jpg)\n\
    \n### Use Worker Pools\n\nIf your program has a queue of tasks to perform where\
    \ the order in which the results are produced is not important, you can employ\
    \ a “worker pool” – using goroutines and channels.\n\n![image](images/hot.jpg)A\
    \ worker pool lets you send tasks from multiple concurrent calls to a goroutine\
    \ that completes each task in a random order determined by the Go scheduler. You\
    \ can use a WaitGroup to wait for the multiple goroutines to complete, or simply\
    \ drain the channel and ensure that all goroutines have finished.\n\n![image](images/pg170_1.jpg)\n\
    \nWait, the example follows:\n\n![image](images/1p.jpg)Begin by importing the\
    \ Go standard library `time` package, to delay a worker goroutine function\n\n\
    ```go\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n```\n\n![image](images/commonp.jpg)\n\
    \nsrc\\workers\\main.go\n\n![image](images/2p.jpg)Next, in the main function,\
    \ initialize a `jobs` total number variable, and create two buffered channels\
    \ of the total size\n\n```go\nnumJobs := 10\njobs := make( chan int, numJobs )\n\
    results := make( chan int, numJobs )\n```\n\n![image](images/3p.jpg)Now, add three\
    \ worker goroutine calls that each pass an ID number and the two channels\n\n\
    ```go\ngo worker( 1, jobs, results )\ngo worker( 2, jobs, results )\ngo worker(\
    \ 3, jobs, results )\n```\n\n![image](images/4p.jpg)Send an integer for each of\
    \ 10 jobs, then close that channel to indicate that is all the jobs in the queue\n\
    \n```go\nfor i := 1 ; i <= numJobs ; i++ {\n\tjobs <- i\n}\nclose( jobs )\n```\n\
    \n![image](images/5p.jpg)After the main function, add the called worker function\
    \ that accepts the worker ID number, has a send-only channel from which to receive\
    \ the job numbers, and a receive-only channel to which it will send 10 results\n\
    \n```go\nfunc worker( id int, jobs <-chan int, results chan<- int ) {\n\tfor job\
    \ := range jobs {\n\t\tfmt.Print( “Worker “, id, “ ran Job “, job )\n\t\tfmt.Printf(\
    \ “ …%v x %v = %v \\n”, job, job, job*job )\n\t\ttime.Sleep( 1 * time.Second )\n\
    \t\tresults <- job\n\t}\n}\n```\n\n![image](images/6p.jpg)Now, back in the main\
    \ function, add a loop to receive results at the end of the pipeline\n\n```go\n\
    for i := 1 ; i <= numJobs ; i++ {\n\tnum := <- results\n}\n```\n\n![image](images/pg170_2.jpg)\n"
  raw: 'When multiple goroutines send messages to channels at different times, the
    program may block progress while waiting to receive messages from the slower channels.
    Go provides a solution to this blocking action by simultaneously listening for
    messages from multiple channels in a select statement block. This has similar
    syntax to the switch statement described [here](#chapter04.xhtml_sec23), but a
    select statement blocks until one of its case statements finds a match. When a
    match is found, the statements associated with that case statement get executed.
    This ability to combine goroutines and channels is a powerful feature of the Go
    programming language.


    ![image](images/pg166_1.jpg)


    To continuously listen for channel messages, a select statement can be enclosed
    inside an infinite for loop. The loop can be exited by including a case statement
    with an associated statement that will break out of the loop to an outer label.


    The Go standard library time package provides a useful After( ) function that
    can be used to create a “timeout” to limit execution time of the listening loop.
    This requires a duration period as its argument, and returns a channel of the
    time.Time type – that will be the future time after the duration beyond the current
    time. Testing for when the current time matches the timeout channel with a **case**
    statement can be used to exit a listening loop.


    ![image](images/1p.jpg)Begin by importing the Go standard library time package,
    to wait for goroutines and to create a timeout


    **import (**


    **“fmt”**


    **“time”**


    **)**


    ![image](images/commonp.jpg)


    src\select\main.go


    ![image](images/2p.jpg)Next, in the main function, create a timeout channel and
    two empty channels


    **c0 := time.After( 7 * time.Second )**


    **c1 := make( chan string )**


    **c2 := make( chan string )**


    ![image](images/3p.jpg)Now, add two goroutine calls that each pass a channel


    **go fastCount( c1 )**


    **go slowCount( c2 )**


    ![image](images/4p.jpg)After the main function, add the two called functions that
    will send channel messages at different intervals


    **func fastCount( c1 chan string ) {**


    **for {**


    **time.Sleep( 1 * time.Second )**


    **c1 <- time.Now( ).Format( “04:05” )**


    **}**


    **}**


    **func slowCount( c2 chan string ) {**


    **for {**


    **time.Sleep( 2 * time.Second )**


    **c2 <- time.Now( ).Format( “04:05” )**


    **}**


    **}**


    ![image](images/5p.jpg)Now, back in the main function, add an infinite loop to
    receive messages from any of the three channels


    ![image](images/pg167_2.jpg)


    ![image](images/6p.jpg)Save the program file in a “select” directory, then run
    the program to see the channel messages


    ![image](images/pg167_1.jpg)


    ![image](images/snake.jpg)


    An unlabeled **break** statement would only break out of the **select** statement
    – allowing the **for** loop to continue! A labeled **break** statement breaks
    out of both the **select** statement and the infinite **for** loop.


    **Synchronize Goroutines**


    The blocking action of unbuffered channels, where the sending action blocks a
    sending goroutine until another goroutine receives the delivery on the same channel,
    causes the sending and receiving goroutines to synchronize. In fact, unbuffered
    channels are sometimes referred to as “synchronous channels”.


    ![image](images/pg168_1.jpg)


    Channels can, therefore, be used to connect goroutines together in a “pipeline”,
    in which an item sent from one goroutine is the item received by another goroutine.
    Each goroutine in the pipeline will wait until the channel has been “drained”
    before sending the next item along the pipeline.


    By default, channels can both send and receive, but when you pass a channel to
    a goroutine you can specify in the function parameter whether the channel may
    only send items, or only receive items. A send-only channel is specified in the
    parameter by prefixing the chan keyword with the <- arrow operator, like this:


    **func *funcName* ( *paramName* <-chan *dataType* )**


    Conversely, a receive-only channel is specified in the parameter by suffixing
    the chan keyword with the <- arrow operator, like this:


    **func *funcName* ( *paramName* chan<- *dataType* )**


    Specifying a single permissible direction is recommended to reduce the possibility
    of bugs in your programs.


    ![image](images/1p.jpg)Begin a main function by creating two unbuffered channels
    for integer items


    **nums := make( chan int )**


    **sqrs := make( chan int )**


    ![image](images/commonp.jpg)


    src\synchronize\main.go


    ![image](images/2p.jpg)Next, add a goroutine call that passes one channel, which
    will begin a pipeline


    **go count( nums )**


    ![image](images/3p.jpg)Now, add a goroutine call that passes two channels, which
    will continue the pipeline


    **go square( nums, sqrs )**


    ![image](images/4p.jpg)After the main function, add the first called function,
    with a receive-only channel to which it will send 10 individual integers one-by-one
    when the pipeline is clear


    **func count( nums chan<- int ) {**


    **for i := 1 ; i <= 10 ; i++ {**


    **nums <- i**


    **}**


    **close( nums )**


    **}**


    ![image](images/5p.jpg)Add the second called function with a send-only channel,
    and a receive-only channel to which it will send 10 individual results one-by-one
    when the pipeline is clear


    **func square( nums <-chan int, sqrs chan<- int ) {**


    **for i := 1 ; i <= 10 ; i++ {**


    **num := <- nums**


    **sqrs <- num * num**


    **}**


    **close( sqrs )**


    **}**


    ![image](images/6p.jpg)Now, back in the main function, add a loop to receive the
    results at the end of the pipeline


    **for i := 1 ; i <= 10 ; i++ {**


    **num := <- sqrs**


    **fmt.Printf( “%v x %v = %v \n”, i, i, num )**


    **}**


    ![image](images/7p.jpg)Save the program file in a “synchronize” directory, then
    run the program to see the pipeline results


    ![image](images/pg169_1.jpg)


    ![image](images/hot.jpg)


    If the sender knows that no further values will be sent to the receiving channel,
    it can usefully close that channel.


    **Use Worker Pools**


    If your program has a queue of tasks to perform where the order in which the results
    are produced is not important, you can employ a “worker pool” – using goroutines
    and channels.


    ![image](images/pg170_1.jpg)


    A worker pool lets you send tasks from multiple concurrent calls to a goroutine
    that completes each task in a random order determined by the Go scheduler. You
    can use a WaitGroup to wait for the multiple goroutines to complete, or simply
    send the task results to nothing – to drain the channel and ensure that all worker
    goroutines have finished.


    ![image](images/pg170_2.jpg)


    ![image](images/1p.jpg)Begin by importing the Go standard library **time** package,
    to delay a worker goroutine function


    **import (**


    **“fmt”**


    **“time”**


    **)**


    ![image](images/commonp.jpg)


    src\workers\main.go


    ![image](images/2p.jpg)Next, in the main function, initialize a jobs total number
    variable, and create two buffered channels of the total size


    **numJobs := 10**


    **jobs := make( chan int, numJobs )**


    **results := make( chan int, numJobs )**


    ![image](images/3p.jpg)Now, add three worker goroutine calls that each pass an
    ID number and the two channels


    **go worker( 1, jobs, results )**


    **go worker( 2, jobs, results )**


    **go worker( 3, jobs, results )**


    ![image](images/4p.jpg)Send an integer for each of 10 jobs, then close that channel
    to indicate that is all the jobs in the queue


    **for i := 1 ; i <= numJobs ; i++ {**


    **jobs <- i**


    **}**


    **close( jobs )**


    ![image](images/5p.jpg)After the main function, add the called worker function
    that accepts the worker ID number, has a send-only channel from which to receive
    the job numbers, and a receive-only channel to which it will send 10 results


    **func worker( id int, jobs <-chan int, results chan<- int ) {**


    **for job := range jobs {**


    **fmt.Print( “Worker “, id, “ ran Job “, job )**


    **fmt.Printf( “ …%v x %v = %v \n”, job, job, job*job )**


    **time.Sleep( 1 * time.Second )**


    **results <- job**


    **}**


    **}**'
