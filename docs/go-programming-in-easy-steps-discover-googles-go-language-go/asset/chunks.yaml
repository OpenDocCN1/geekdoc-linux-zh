- fmt: '

    Go is a free open-source programming language created at Google by Robert Griesemer,
    Rob Pike, and Ken Thompson – best known for development of the Unix operating
    system. Google released version 1.0 of the Go language (`golang`) in March 2012,
    since when it has gained widespread popularity.


    Go programs are written in plain text, then compiled into machine code by the
    Go compiler to produce an executable binary version.


    ![image](images/pg8_2.jpg)


    The aims of the Go programming language are to be expressive, fast, efficient,
    reliable, and simple to write. Some programming languages, such as C or C++, are
    fast and reliable but not simple. Conversely, other programming languages such
    as Java or Python are simple to write but not so efficient.


    Go is similar to the C programming language in many ways, and is sometimes referred
    to as a “C-like language” or “C for the 21st century”. But Go is much more than
    that, as it adopts good ideas from many other programming languages, yet avoids
    features that lead to complexity or unreliability.


    Perhaps most importantly, Go introduces the ability to take advantage of multi-core
    CPU processing for concurrency using “goroutines” and “channels”. This provides
    the potential for the computer to deal with several things at the same time.


    Although the Go language does not have the class structures found in Object Oriented
    Programming (OOP) languages, such as C++ or Java, its features do provide some
    degree of encapsulation, inheritance, and polymorphism – the three cornerstones
    of OOP.


    ![image](images/pg8_1.jpg)


    The Go gopher – the iconic mascot of the Go programming language.


    ![image](images/hot.jpg)


    You can discover many more programming language books in the In Easy Steps series
    – including C, C++, C#, Java, and Python. Visit [www.ineasysteps.com](http://www.ineasysteps.com)
    to find out more.


    With so many programming languages to choose from, you may be wondering why you
    should choose to learn Go programming – so here are some of the advantages that
    Go offers:


    ### Simple Syntax

    The Go language is concise, like Python. It’s as simple to write as Python but
    is more efficient, like C++. This enables you to write code that is easy to read
    and maintain.


    ### Compiled Language

    The Go source code is compiled to binary machine code that can be read directly
    by the computer, instead of being interpreted every time a program runs. This
    enables the Go programs you write to run faster than programs written for interpreted
    languages, like Python or PHP.


    ### The Go Compiler

    The Go compiler is fast and provides additional benefits, such as code optimization
    and error checking – it can detect unused variables in your code, missing imports
    that your code requires, and mistyped or invalid code. The Go compiler can also
    generate executable binaries for other operating systems. This enables you to
    compile your source code to run on multiple machines.


    ### Concurrency

    The Go language provides inherent support for concurrency with goroutines and
    channels. This enables you to write multi-threaded programs that could perform
    multiple tasks at the same time.


    ### Garbage Collection

    Automatic memory management is a key feature of the Go language. Its garbage collector
    runs concurrently with the program. This enables you to write program code without
    any concern for memory leakage.


    ### Static Typing

    Go is a statically typed language in which variables are explicitly declared to
    be of a particular fixed type. This enables errors to be caught early in the development
    process.


    You may well recognize other advantages as you gain experience with the Go language,
    but right now it’s time to get started…


    ### Install the Go Tools

    To get started with the Go programming language, you must first install the Go
    tools on your PC. These allow you to build, run, and test programs written in
    the Go language. The Go tools are supplied together with lots of standard packages
    of useful trusted code that you can import into your own programs. The Go language
    installers are available for Windows, macOS and Linux.


    ![image](images/pg10_1.jpg)


    ![image](images/1b.jpg)Open a web browser and visit [https://golang.org](https://golang.org)
    then download the appropriate installer for your system


    ![image](images/pg10_2.jpg)


    ![image](images/2b.jpg)When the download has completed, run the installer to launch
    the “Go Programming Language Setup Wizard”


    ![image](images/pg10_3.jpg)


    ![image](images/3b.jpg)Click `Next` to continue, then accept the license terms


    ![image](images/4b.jpg)Accept the suggested `Destination Folder` (at `C:\Go` on
    Windows), then click `Install` to complete the installation


    ![image](images/hot.jpg)


    The Go installer for Windows should automatically add Go to your system path to
    make the Go tools available at a command prompt.


    ![image](images/5b.jpg)To test that the installation was successful, first open
    a Terminal window – on a Windows system press `WinKey` + `R` together, to open
    a “Run” dialog, then enter `cmd` to open a “Command Prompt” window


    ![image](images/pg11_1.jpg)


    ![image](images/6b.jpg)At the command prompt, type the command `go` then hit `Enter`
    to see a list of Go tool commands


    ![image](images/pg11_3.jpg)


    ![image](images/hot.jpg)


    Although there are quite a few Go tools, you will mostly use only the `run` tool
    to compile and run your programs.


    ![image](images/forget.jpg)


    The “WinKey” is the keyboard key labeled with the Windows logo.


    ![image](images/pg11_2.jpg)


    ### Create the Workspace

    When you install Go, the installer sets a number of Go environment variables.
    For example, the directory (folder) of the Go tools is stored in a `GOROOT` environment
    variable – by default, at `C:\Go` on Windows, and `/usr/local/go` on Linux and
    macOS.


    ![image](images/pg12_1.jpg)


    The installer also sets `GOPATH` environment variable for the location of your
    workspace. By default, this is a directory named `go` within your home directory
    – but the installer doesn’t actually create any directories.


    To create the workspace, you can simply add a directory named `go` in your home
    directory. You must then add sub-directories named `bin`, `pkg` and `src` within
    the workspace – all your programs can then be created inside the `src` directory.


    It’s useful to have a shortcut on your desktop that will open a command-line in
    this sub-directory to easily run your programs.


    ![image](images/1b.jpg)On a Windows PC, open a Command Prompt, as described [here](#chapter01_test),
    or open a Terminal window


    ![image](images/2b.jpg)Enter the command `go env GOPATH` to see the current expected
    location


    ![image](images/pg12_2.jpg)


    Next, issue a `mkdir` command to create the `go` workspace directory at the location
    specified by the `GOPATH` environment variable


    ![image](images/pg12_3.jpg)


    ![image](images/forget.jpg)


    The `go\src` folder is where you will save the programs you write. The `go\bin`
    and `go\pkg` will be used later to store executable files and package archives.


    ![image](images/forget.jpg)


    The `mkdir` command name is simply short for “make directory”.


    ![image](images/3b.jpg)Now, issue further `mkdir` commands to create the `bin`,
    `pkg` and `src` sub-directories in the workspace directory


    ![image](images/pg13_1.jpg)


    ![image](images/pg13_2.jpg)


    ![image](images/5b.jpg)Right-click on a Windows desktop and select **New**, **Shortcut**
    to open a “Create Shortcut” dialog


    ![image](images/6b.jpg)Enter `cmd` as the location and click `Next`, then enter
    `Go Terminal` as the name and click `Finish` to create a shortcut icon on your
    desktop

