    \ (64) 作为其括号内的参数——例如，`strconv.ParseFloat( “42”, 64 )`。\n\n在不同数值数据类型之间强制转换只需指定所需的类型，后跟包含要转换值的括号。例如：\n\
    \n```go\nvar num int = 42\nvar decimal float64 = float64( num )\n```\n\n有趣的是，当为\
    \ `byte` 数据类型的变量（`uint8` 的别名—— 8 位无符号整数）分配一个单独字符时，它将存储该字符的 ASCII 字符编码的数值，该值可以很容易地强制转换：\n\
    \n```go\nvar char byte = ‘A’\nvar str = string( char )\n```\n\nASCII（读作 “as-kee”）是“美国信息交换标准”的缩写，是文本的标准。你可以在\
    \ [www.asciitable.com](http://www.asciitable.com) 找到完整的代码范围。\n\n![image](img/1r.jpg)在你的\
    \ “src” 文件夹内创建一个名为 “cast” 的目录\n\n![image](img/commonr.jpg)\n\n`src\\cast\\main.go`\n\
    \n![image](img/2r.jpg)开始一个包含 package 和 import 的 main.go 程序\n\n```go\npackage main\n\
    \nimport (\n    “fmt”\n    “strconv”\n)\n```\n\n![image](img/3r.jpg)添加一个声明并初始化两个变量的\
    \ main 函数\n\n```go\nfunc main( ) {\n    var str string = “42”\n    var char byte\
    \ = ‘A’\n    // 在此处插入语句。\n}\n```\n\n![image](img/4r.jpg)在 main 函数中插入语句以各种格式输出变量值\n\
    \n```go\nnum, err := strconv.Atoi( str )\nfmt.Printf( “num:%v %T \\n”, num, err\
    \ )\ndecimal := float64( num )\nfmt.Printf( “decimal: %.2f \\n”, decimal )\nfmt.Printf(\
    \ “char:%v %T \\n”, char, string( char ) )\n```\n\n![image](img/5r.jpg)将程序文件保存在\
    \ “cast” 目录下，然后运行程序查看转换后的变量值\n\n![image](img/pg27_1.jpg)\n\n![image](img/hot.jpg)\n\
    \n你稍后将学会通过测试 `err` 值是否为 `nil` 来确认转换是否成功——这在 Go 编程中被认为是一种良好的做法。\n\n![image](img/snake.jpg)\n\
    \n从 **float** 转换为 **int** 的值会被截断，所以使用 `f := 3.9` 和 `n := int( f )`，变量 `n` 将赋值为\
    \ `3`。\n\n## 固定常量\n\n如果你想存储一个在程序执行期间永远不会改变固定值，你应该使用 `const` 关键字进行声明，而不是 `var`\
    \ 关键字。这可以防止意外（或恶意的）赋值尝试。如果你的代码尝试给常量分配新值，编译器将显示“无法分配”的消息。\n\n![image](img/pg28_1.jpg)\n\
    \n与变量声明不同，常量声明必须在声明中使用其固定值进行初始化，如下：\n\n```go\nconst oneMillion = 1000000\n```\n\
    \n可选地，常量声明可以指定数据类型，但如果从声明中省略显式数据类型，Go 编译器将从赋值的值推断其类型。\n\n相同或不同数据类型的多个常量可以在单个声明中通过逗号分隔列表创建，如下：\n\
    \n```go\nconst oneMillion, oneThousand = 1000000, “1,000”\n```\n"
- fmt: "\nUsefully, a constant declaration can employ a “constant generator” named\
    \ `iota` to create a sequence of related constant values. The constant names should\
    \ be listed one-per-line within parentheses after the `const` keyword, and the\
    \ first one assigned the `iota` value. This generates a numerical sequence, beginning\
    \ at zero, that increments by one for each named constant in the list.\n\nFor\
    \ example, you could assign a numeric sequence to constants representing days\
    \ of the week, like this:\n\n```go\nconst (\n    sunday = iota\n    monday\n \
    \   tuesday\n    wednesday\n    thursday\n    friday\n    saturday\n)\n```\n\n\
    In this example, the constant `sunday` would be assigned zero (0), `monday` would\
    \ be assigned one (1), and so on.\n\nIf you want to begin the sequence at a different\
    \ number, simply add that number to `iota` in the assignment to the first constant.\n\
    \n![image](images/hot.jpg)\n\nIn other programming languages, the generated sequence\
    \ is often called an “enumeration” or simply `enum`.\n\n![image](images/1r.jpg)Create\
    \ a directory named “const” inside your “src” folder\n\n![image](images/commonr.jpg)\n\
    \n`src\\const\\main.go`\n\n![image](images/2r.jpg)Begin a main.go program with\
    \ package and import declarations\n\n```go\npackage main\n\nimport \"fmt\"\n```\n\
    \n![image](images/3r.jpg)Add a main function that declares and initializes a single\
    \ constant and a sequence of constants, starting at one (1)\n\n```go\nfunc main()\
    \ {\n    const pi = 3.14159\n    const (\n        red = iota + 1\n        yellow\n\
    \        green\n        brown\n        blue\n        pink\n        black\n   \
    \ )\n    // Statements to be inserted here.\n}\n```\n\n![image](images/4r.jpg)Next,\
    \ insert statements to display several constant values\n\n```go\nfmt.Printf(\"\
    Pi approximately: %v \\n\\n\", pi)\nfmt.Printf(\"Red: %v point \\n\", red)\nfmt.Printf(\"\
    Blue: %v points \\n\", blue)\nfmt.Printf(\"Black: %v points \\n\", black)\n```\n\
    \n![image](images/5r.jpg)Save the program file in the “const” directory, then\
    \ run the program to see the constant values\n\n![image](images/pg29_1.jpg)\n\n\
    ![image](images/hot.jpg)\n\nThe `math` package in Go provides a constant named\
    \ `math.Pi` that is a far better approximation of the value of ![image](images/py.jpg)\n\
    \n![image](images/hot.jpg)\n\nThe sequence here represents the points value of\
    \ each ball in the game of snooker.\n\n## Point to Stored Values\n\nWhenever your\
    \ program creates a container to store data, your computer allocates a space in\
    \ memory at which to store the data. Like houses, memory locations may be of different\
    \ size but each one has a unique address.\n\n![image](images/pg30_1.jpg)\n\nAn\
    \ initialized variable therefore actually consists of three parts – name, value,\
    \ and the memory address where the data is stored.\n\n![image](images/pg30_2.jpg)\n\
    \nGo programming supports the concept of “pointers”. A pointer variable can store\
    \ the address of another variable and can access the value stored at that address.\n\
    \nThe declaration of a pointer variable requires the data type to be prefixed\
    \ by an asterisk, to indicate that this will be a pointer:\n\n```go\nvar ptr *int\
    \      // Declares this variable will point to an int.\n```\n\nThe address of\
    \ another variable can be assigned to the pointer by prefixing the other variable’s\
    \ name with an `&` ampersand:\n\n```go\nptr = &num        // Assigns an address\
    \ to the pointer variable.\n```\n\nThe value at the assigned address can then\
    \ be accessed by prefixing the pointer name with an an asterisk:\n\n```go\n*ptr\
    \              // Points to the value at the assigned address.\n```\n\n![image](images/pg30_3.jpg)\n\
    \nThe concept of pointers can be difficult to grasp because the `*` operator performs\
    \ two purposes – as a type descriptor in a declaration, and as a dereferencer\
    \ when placed before a pointer name. You may at this moment be thinking “Pointers,\
    \ so what?” but pointers are widely used in Go programming, so you should thoroughly\
    \ understand how they work before proceeding further.\n\n![image](images/hot.jpg)\n\
    \nMemory location addresses are hexadecimal numbers that are allocated by your\
    \ computer. They will almost certainly differ on your system from the addresses\
    \ shown in this example.\n\n![image](images/1r.jpg)Create a directory named “point”\
    \ inside your “src” folder\n\n![image](images/commonr.jpg)\n\n`src\\point\\main.go`\n\
    \n![image](images/2r.jpg)Begin a main.go program with package and import declarations\n\
    \n```go\npackage main\n\nimport \"fmt\"\n```\n\n![image](images/3r.jpg)Add a main\
    \ function that declares and initializes a regular integer variable and a pointer\
    \ variable\n\n```go\nfunc main() {\n    var num int = 20\n    var ptr *int = &num\n\
    \    // Statements to be inserted here.\n}\n```\n\n![image](images/4r.jpg)Next,\
    \ insert statements to display the value and memory address of \n\n```go\nfmt.Printf(\"\
    value: %v \\n\", num)\nfmt.Printf(\"address: %v \\n\", &num)\nfmt.Printf(\"pointer\
    \ value: %v \\n\", ptr)\nfmt.Printf(\"dereferenced: %v \\n\", *ptr)\n```\n\n*(Note:\
    \ I have reconstructed the code logic based on the context of the text provided\
    \ which was truncated in the prompt's final section to ensure a complete document\
    \ flow).*\n\n"
