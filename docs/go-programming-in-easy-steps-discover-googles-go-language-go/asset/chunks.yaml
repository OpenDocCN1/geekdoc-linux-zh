    time.Now( ).UnixNano( ) functions


    10


    **Handle Input**


    ***This chapter demonstrates how to handle user input, and how to read and write
    text files using the Go standard library os, bufio, and io/ioutil packages.***


    [**Get User Input**](#chapter10.xhtml_sec70)


    [**Buffer Input**](#chapter10.xhtml_sec71)


    [**Command Flags**](#chapter10.xhtml_sec72)


    [**Read Files**](#chapter10.xhtml_sec73)


    [**Write Files**](#chapter10.xhtml_sec74)


    [**Use Temporary Files**](#chapter10.xhtml_sec75)


    [**Summary**](#chapter10.xhtml_sec76)


    **Get User Input**


    The previous examples have illustrated how variables can be used to store text
    string values, numeric integer and floating-point decimal values, and boolean
    truth values in your programs. Now, they can be used to create a Guessing Game
    program by storing a generated random integer whose value the user will have to
    guess, a boolean truth value that will end the game when the user guesses correctly,
    and a variable containing the user’s guess.


    ![image](images/pg144_1.jpg)


    The familiar Go standard library fmt package provides Scan( ), Scanln( ), and
    Scanf( ) functions to read from standard input:


    •fmt.Scan( ) stores successive space-separated values into successive interface
    variables, and regards newlines as spaces.


    •fmt.Scanln( ) stores successive space-separated values into successive interface
    variables until it meets a newline.


    •fmt.Scanf( ) stores successive space-separated values into successive interface
    variables using a specified format.


    Each of these functions returns two values, which are the number of items scanned
    and any read error. If no error is encountered, the error value will be nil as
    usual. Each function also requires one or more arguments to specify the address
    of interface variables.


    The Guessing Game program can use the fmt.Scan( ) function to assign an input
    integer guess to an interface variable and compare its value against a generated
    random integer.


    ![image](images/1g.jpg)Begin by importing the Go standard library math/rand and
    time packages into a program, to provide a custom seeded random number generator


    **import (**


    **“fmt”**


    **“math/rand”**


    **“time”**


    **)**


    ![image](images/commong.jpg)


    src\scan\main.go


    ![image](images/2g.jpg)Now, begin the main function by seeding the random number
    generator with the current time


    **rand.Seed( time.Now( ).UnixNano( ) )**


    ![image](images/3g.jpg)Next, declare and initialize three variables


    **var num int = rand.Intn( 20 ) + 1**


    **var guess int = 0**


    **var flag bool = true**


    ![image](images/4g.jpg)Then, request the user enter an integer


    **fmt.Print( “\nGuess My Number 1-20: “ )**


    ![image](images/5g.jpg)Finally, add a loop to repeatedly compare the input against
    the random number until they match


    **for flag {**


    **_, err := fmt.Scan( &guess )**


    **if err != nil {**


    **fmt.Println( err )**


    **} else if guess > num {**


    **fmt.Print( “Too High, Try Again: “ )**


    **} else if guess < num {**


    **fmt.Print( “Too Low, Try Again: “ )**


    **} else if guess == num {**


    **fmt.Println( “Correct - My Number Is”, num )**


    **flag = false**


    **}**


    **}**


    ![image](images/forget.jpg)


    Notice that the **_** blank identifier is used to ignore the returned number of
    items scanned, and remember to use the **&** address of operator when assigning
    the input values to the interface variables.


    ![image](images/6g.jpg)Save the program file in a “scan” directory, then run the
    program to guess the randomly generated number


    ![image](images/pg145_1.jpg)


    **Buffer Input**


    When you want to gather larger items of data into your program it is often preferable
    to store the data stream in a memory buffer. The Go standard library bufio (buffered
    input/output) package provides a Scanner type, which is a memory buffer with several
    useful methods to handle data streams. You can make this available to your program
    by importing the bufio package.


