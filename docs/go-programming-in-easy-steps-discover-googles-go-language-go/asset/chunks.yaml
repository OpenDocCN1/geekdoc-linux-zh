    \ | The larger of two numbers |\n| `math.Min()` | The smaller of two numbers |\n\
    | `math.Pow()` | A power value |\n| `math.Round()` | The nearest integer value\
    \ |\n| `math.Sin()` | A sine value |\n| `math.Sqrt()` | A square root value |\n\
    | `math.Tan()` | A tangent value |\n\n![image](images/hot.jpg)\n\nThe `math.IsNan()`\
    \ function (Is-Not-a-number) is useful to discover whether a value cast to the\
    \ `float64` data type is indeed a number.\n\n![image](images/hot.jpg)\n\nThe `math`\
    \ package contains lots more functions but those listed here are useful for many\
    \ mathematical operations. Discover more in the Go documentation at [golang.org/pkg/math](http://www.golang.org/pkg/math)\n\
    \n![image](images/1r.jpg)Begin by importing the Go standard library math package\
    \ into a program\n\n```go\nimport (\n\t\"fmt\"\n\t\"math\"\n)\n```\n\n![image](images/commonr.jpg)\n\
    \n`src\\maxmin\\main.go`\n\n![image](images/2r.jpg)Next, initialize two variables\n\
    \n```go\nsquare := math.Pow( 5, 2 )// 5 to power 2 ( 5 x 5 ).\ncube := math.Pow(\
    \ 4, 3 )// 4 to power 3 ( 4 x 4 x 4 ).\n```\n\n![image](images/3r.jpg)Now, compare\
    \ the positive value of the variables and display the largest and smallest numbers\n\
    \n```go\nfmt.Println( \"\\nLargest Positive:\", math.Max( square, cube ) )\nfmt.Println(\
    \ \"\\nSmallest Positive:\", math.Min( square, cube ) )\n```\n\n![image](images/4r.jpg)Then,\
    \ add statements to reverse the numerical polarity of each variable – making positive\
