    \n## 分割字符串\n\n![image](img/pg128_1.jpg)\n\nGo 标准库 strings 包提供了几个函数，允许将指定的字符串拆分为子字符串。这些函数将字符串视为数组，其中每个元素包含一个字符或一个空格。\n\
    \n通常，你可能希望将一个由空格分隔的句子拆分为一个子字符串数组，每个子字符串都是独立的单词。strings 包方便地提供了一个 `Fields()` 函数，可以执行此任务。该函数需要字符串句子作为唯一参数，并返回一个包含该字符串中每个独立单词的子字符串数组。\n\
    \nstrings 包有一个 `Split()` 函数，它需要两个参数来指定字符串和一个分隔符。此函数将返回存在指定分隔符出现位置之间的子字符串数组。例如，当字符串是一个由空格分隔的句子且分隔符是空格字符时，`Split()`\
    \ 函数将返回该句子中的单词数组。\n\nstrings 包还有一个 `SplitN()` 函数，它的工作方式与 `Split()` 函数相同，但接受第三个参数来指定要返回的子字符串数量。如果指定的子字符串数量超过分隔符的数量，则后续出现的指定分隔符将简单地位于最后一个子字符串中。例如，当字符串是一个由空格分隔的句子，分隔符是空格字符，且仅指定两个子字符串时，`SplitN()`\
    \ 函数将返回一个包含句子第一个单词的子字符串，以及一个包含句子剩余所有部分（包括空格）的子字符串。\n\n重要的是，`Fields()`、`Split()`\
    \ 和 `SplitN()` 函数会丢弃指定的分隔符，并在返回的子字符串中包含分隔符周围的字符。然而，还有两个函数允许你在返回的子字符串中也包含分隔符。\n\
    \nstrings 包的 `SplitAfter()` 函数工作方式与 `Split()` 函数类似，但在返回的子字符串中包含了分隔符。同样，strings\
    \ 包的 `SplitAfterN()` 函数工作方式与 `SplitN()` 函数类似，但在返回的子字符串中包含了分隔符。\n\n![image](img/hot.jpg)\n\
    \n数据通常以逗号分隔值（CSV）的形式存储在 CSV 文件中，可以很有用地拆分成单个值。\n\n![image](img/1r.jpg)在程序中导入 Go\
    \ 标准库 strings 包\n\n```go\nimport (\n    \"fmt\"\n    \"strings\"\n)\n```\n\n![image](img/commonr.jpg)\n\
    \n`src\\split\\main.go`\n\n![image](img/2r.jpg)通过初始化字符串来启动主函数\n\n```go\nstr :=\
    \ \"I can, and I will.\"\n```\n\n![image](img/3r.jpg)接下来，添加语句将描述和字符串子字符串传递给列表函数\n\
    \n```go\nlist(strings.Fields(str))\nlist(strings.Split(str, \",\"))\nlist(strings.SplitN(str,\
    \ \",\", 2))\nlist(strings.SplitAfter(str, \",\"))\nlist(strings.SplitAfterN(str,\
    \ \",\", 2))\n```\n\n![image](img/4r.jpg)在主函数之后，添加函数来列出描述和子字符串\n\n```go\nfunc\
    \ list(desc string, subs []string) {\n    fmt.Print(\"\\n\", desc, \": \")\n \
    \   for _, v := range subs {\n        fmt.Print(\"[\", v, \"] \")\n    }\n   \
    \ fmt.Print(\"\\n\")\n}\n```\n\n![image](img/5r.jpg)将程序文件保存到“split”目录，然后运行程序查看子字符串\n\
    \n![image](img/pg129_1.jpg)\n\n![image](img/forget.jpg)\n\n只有名称中包含“After”的分割方法才会保留分隔符。\n\
    \n## 查找字符\n\n![image](img/pg130_1.jpg)\n\nGo 标准库 strings 包提供了几个函数，允许对指定的字符串查找指定的字符或子字符串（模式）。这些函数将字符串视为数组，其中每个元素包含一个字符或一个空格。\n\
    \nstrings 包有一个 `Contains()` 函数，它需要两个参数来指定字符串和要查找的模式。此函数将简单地返回 true 或 false 以表示搜索结果（区分大小写）。例如，查找“Pro”模式：\n\
    \n```go\nstrings.Contains(\"Go Programming in easy steps\", \"Pro\")\n```\n\n\
    strings 包还有一个 `Index()` 函数，它需要两个参数来指定字符串和要查找的模式。如果搜索成功，此函数将返回一个整数，即模式在搜索字符串中首次出现的索引位置；如果搜索失败，它将返回\
    \ -1。\n\nstrings 包的 `Count()` 函数需要两个参数来指定字符串和要查找的模式。你可以使用此函数发现模式在搜索字符串中出现了多少次非重叠的实例。如果模式为空字符串，此函数通常会返回\
