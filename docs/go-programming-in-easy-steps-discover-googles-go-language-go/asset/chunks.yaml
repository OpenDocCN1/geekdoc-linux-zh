    ## 小数四五入\n\n![image](img/pg138_1.jpg)\n\nGo 标准库 math 包提供了许多将小数四五入到整数的有用函数。\n\n\
    | 函数 | 返回 |\n| :--- | :--- |\n| `math.Floor(x )` | 小于 *x* 的最大整数 |\n| `math.Ceil(x\
    \ )` | 大于 *x* 的最小整数 |\n| `math.Round(x )` | 最接近 *x* 的整数 |\n| `math.Trunc(x )`\
    \ | *x* 的整数部分 |\n\n如果你想将浮点值保留两位小数，首先将值乘以 100，使用 `math.Round()` 去掉小数位，然后除以 100。Go\
