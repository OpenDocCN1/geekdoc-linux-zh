    \n`src\\poly\\main.go`\n\n![image](img/2bl.jpg)接下来，创建一个空结构体并附加将满足接口的方法\n\n```go\n\
    type parrot struct { }\nfunc ( parrot ) speak( ) string {\n    return “Squawk,\
    \ squawk!”\n}\nfunc ( parrot ) move( ) string {\n    return “A parrot flies away.”\n\
    }\n```\n\n![image](img/hot.jpg)\n\n注意，你可以省略接收者中的参数名称，只需写出结构体名称，除非你需要在方法语句中使用参数名称。\n\
    \n![image](img/3bl.jpg)现在，创建另一个空结构体并附加满足接口的方法\n\n```go\ntype chicken struct {\
    \ }\nfunc ( chicken ) speak( ) string {\n    return “Cluck, cluck!”\n}\nfunc (\
    \ chicken ) move( ) string {\n    return “Chick cannot fly.”\n\n\n```\n\n![image](img/blbl.))一个接收接口作为参数并调用实现方法的函数\n\
    \n```go\nfunc nudge( b ) {\n    fmt.Printf( “\\n%v \\n”, b.speak( ) )\n    fmt.Printf(\
    \ “%v \\n\\n”. b. )( )\n\n\n\n```](\n\n/5bl.jpg)添加一个 main 函数，通过语句创建每个结构体的实例，然后调用它们同名的方法\n\
    \n```go\nfunc main( ) {\n    var bird1 parrot\n    var bird2 chicken\n    nudge(\
    \ bird1 )\n    nudge( bird2 )\n}\n```\n\n![image](img/6bl.jpg)将程序文件保存在“poly”目录中，然后运行程序查看不同的输出\n\
    \n![image](img/pg93_1.jpg)\n\n![image](img/pg93_2.jpg)\n\n![image](img/hot.jpg)Go\
    \ 会识别接口的实现。\n\n![image](img/forget.jpg)\n\n当结构体实现接口时，附加到结构体的方法就成为了接口的“成员”——这样就可以作为参数传递。\n\
    \n# 嵌入接口\n\n正如结构体可以嵌入一样，接口也可以。理解接口嵌入很有帮助，许多标准库包使用了这种技术。例如，`io.ReadWriter` 接口嵌入了\
    \ `Reader` 和 `Writer` 接口。\n\n![image](img/pg86.jpg)接下来，创建一个空结构体并附加满足第一个接口的方法\n\
    \n```go\ntype parrot struct { }\nfunc ( parrot ) speak( ) string {\n    return\
    \ “Squawk, squawk!”\n}\nfunc ( parrot ) move( ) string {\n    return “A parrot\
    \ flies away.”\n}\n```\n\n![image](img/3bl.jpg)**parrot** 类型将调用步骤 3 中的方法。\n\n\
    ![image](img/hot.jpg)现在，添加另一个空结构体并附加满足第一个和第二个接口的方法——因此满足了第三个接口\n\n```go\ntype\
    \ person struct { }\nfunc ( person ) speak( ) string {\n    return “Hi, there!”\n\
    }\nfunc ( person ) move( ) string {\n    return “A person walks away.”\n}\n```\n\
    \n![image](img/4bl.jpg)添加一个接收第三个接口作为参数并调用实现方法的函数\n\n```go\nfunc nudge( c creature\
    \ ) {\n    fmt.Printf( “\\n%v \\n”, c.speak( ) )\n    fmt.Printf( “%v \\n\\n”.\
    \ c.move( ) )\n}\n```\n\n![image](img/5bl.jpg)添加一个 main 函数，通过语句创建每个结构体的实例，然后调用它们同名的方法\n\
    \n```go\nfunc main( ) {\n    var bird1 parrot\n    var human1 person\n    nudge(\
    \ bird1 )\n    nudge( human1 )\n}\n```\n\n![image](img/6bl.jpg)将程序文件保存在“abstr”目录中，然后运行程序以查看不同的输出\n\
    \n![image](img/pg95_1.jpg)\n\n![image](img/pg95_2.jpg)\n\n![image](img/hot.jpg)**person**\
    \ 类型将调用步骤 4 中的方法。\n\n![image](img/forget.jpg)\n\n方法签名可能还可以指定参数列表和多个返回类型。\n\n**总结**\n\
    \n•多个相关的数据项可以组合在 Go 结构体类型。\n\n•结构体的 `{ }` 大括号包含名称和类型对的列表，这些字段定义了结构体将包含的内容。\n\n\
    •结构体实例可以通过声明以结构体名称为类型的变量来创建。\n\n•通过将值赋值给实例名称和点后缀的字段，可以初始化结构体的单个字段。\n\n•通过将结构字面量赋值给变量名可以创建并初始化结构体实例。\n\
    \n"
- fmt: "\n- A function can be attached to a struct by adding a receiver, which specifies\
    \ the struct name to the function signature.\n- A function attached to a struct\
    \ is referred to as a method.\n- A method can be a value receiver, operating on\
    \ a copy of the struct, or a pointer receiver operating on the original fields.\n\
    - A struct can represent the attributes and behaviors of real-world objects by\
    \ its field properties and attached methods.\n- A struct can be embedded inside\
    \ another struct as an anonymous field, so its fields can be directly addressed.\n\
    - The three cornerstones of object-oriented programming are encapsulation, inheritance,\
    \ and polymorphism.\n- Encapsulation in Go relies upon data-hiding in packages\
    \ where only capitalized items will be exported.\n- Inheritance in Go relies upon\
    \ composition where embedded structs provide fields and methods to the embedding\
    \ struct.\n- Polymorphism in Go relies upon its interface type, which only contains\
    \ a list of method signatures.\n- Any struct that has methods that precisely match\
    \ the interface method signatures will implement the interface.\n- An interface\
    \ can be embedded inside another interface to provide further abstraction for\
    \ additional flexibility.\n\n# 7 Create Arrays\n\nThis chapter demonstrates how\
    \ to store multiple items of data in indexed elements within a Go program.\n\n\
    - [Create a Basic Array](#chapter07.xhtml_sec47)\n- [Loop Through Elements](#chapter07.xhtml_sec48)\n\
    - [Slice Arrays](#chapter07.xhtml_sec49)\n- [Make Slices](#chapter07.xhtml_sec50)\n\
    - [Slices Versus Arrays](#chapter07.xhtml_sec51)\n- [Map Keys and Values](#chapter07.xhtml_sec52)\n\
    - [Summary](#chapter07.xhtml_sec53)\n\n## Create a Basic Array\n\nAn array is\
    \ a variable that can store multiple items of data – unlike a regular variable,\
    \ which can only store one piece of data. The pieces of data are stored sequentially\
    \ in array “elements” that are numbered, starting at zero. So, the first value\
    \ is stored in element zero, the second value is stored in element one, and so\
    \ on.\n\n![image](images/pg98_1.jpg)\n\nAn empty array can be declared using the\
    \ `var` keyword followed by a name of your choice, followed by `[ ]` square brackets\
    \ surrounding an integer specifying the number of required elements. These must\
    \ then be followed by the data type the elements can contain. The syntax of the\
    \ declaration looks like this:\n\n```\nvar arrayName [ nElements ] dataType\n\
    ```\n\nValues can then be individually assigned to each available element by stating\
    \ the element number in square brackets:\n\n```\narrayName [ elementNumber ] =\
    \ value\n```\n\nAlternatively, an array can be declared and initialized with values\
    \ by stating values for each element in an “array literal” – a comma-separated\
    \ list, grouped within braces:\n\n```\narrayName := [ nElements ] dataType { value,\
    \ value, value }\n```\n\nAny individual element’s value can be referenced using\
    \ the array name followed by square brackets containing the element number. For\
    \ example, to reference the value within the first element:\n\n```\narrayName\
    \ [ 0 ]\n```\n\nCollectively, the elements of an array are known as an “index”.\
    \ Arrays can have more than one index – to represent multiple dimensions, rather\
    \ than the single dimension of a regular array. Multi-dimensional arrays of three\
    \ indices and more are uncommon, but two-dimensional arrays are useful to store\
    \ grid-based information, such as coordinates.\n\nTo create a two-dimensional\
    \ array, simply add a second pair of `[ ]` square brackets specifying the number\
    \ of required elements, like this:\n\n```\nvar arrayName [ nElements ] [ nElements\
    \ ] dataType\n```\n\nValues can then be individually assigned to each available\
    \ element by stating the element numbers in square brackets:\n\n```\narrayName\
    \ [ elementNumber ] [ elementNumber ] = value\n```\n\n![image](images/forget.jpg)\n\
    \nArray numbering starts at zero – so the final element in an array of six elements\
    \ is number five, not number six. This numbering is known as a “zero-based index”.\n\
    \n![image](images/snake.jpg)\n\nYou can only store data within array elements\
    \ of the data type specified in the array declaration.\n\nAlternatively, a two-dimensional\
    \ array can be initialized and values assigned to each element when it is declared\
    \ by stating values for each index in array literals:\n\n```\narrayName := [ nElements\
    \ ] [ nElements ] dataType\n{ { value , value , value } , { value , value , value\
    \ } }\n```\n\nAny individual element’s value can be referenced using the array\
    \ name followed by square brackets containing the element numbers for each index.\
    \ For example, the first element of the second index:\n\n```\narrayName [ 0 ]\
    \ [ 1 ]\n```\n\n![image](images/1v.jpg)Create an empty array of three elements\
    \ that can each only contain string values\n\n```\nvar cars [ 3 ]string\n```\n\
    \n![image](images/commonv.jpg)\n\n`src\\array\\main.go`\n\n![image](images/2v.jpg)Next,\
