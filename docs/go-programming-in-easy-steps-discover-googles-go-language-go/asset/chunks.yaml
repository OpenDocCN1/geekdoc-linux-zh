    \n注意，函数签名在声明中只需要说明所需的类型，但其定义也需要列出参数名称。\n\n![image](img/hot.jpg)\n\n注意，函数实例 `add`\
    \ 被简单描述为自定义函数类型 `main.adder` 类型。\n\n# 处理错误\n\n在你的 Go 程序中预判错误并使你的代码能够高效地处理它们是非常重要的。其他编程语言（如\
