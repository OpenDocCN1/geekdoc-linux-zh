    \n### 延迟时间\n\nGo 标准库 `time` 包提供了一个 `Sleep( )` 函数，它允许你通过指定的持续时间延迟程序的进度。持续时间作为 `Sleep(\
    \ )` 函数的参数提供，并可以表示为 `time` 包常量的乘法形式。例如，`5 * time.Second` 表示五秒的持续时间。\n\n![image](img/pg122_1.jpg)\n\
    \nGo 标准库 `time` 包还提供了三个方法，用于将 `Time` 数据类型的实例与作为参数指定的另一个时间进行比较。这些方法将根据根据时间比较的结果返回一个布尔值（true\
    \ 或 false）：\n\n| **方法** | **返回** |\n| :--- | :--- |\n| **Before(**time**)** |\
    \ 如果实例时间早于参数时间，则返回布尔值 **true** |\n| **After(**time**)** | 如果实例时间晚于参数时间，则返回布尔值\
    \ **true** |\n| **Equal(**time**)** | 如果实例时间与参数时间代表同一时刻（即使在不同的时区）——则返回布尔值 **true**\
    \ |\n\n如果你想查看两个 `Time` 数据类型实例之间的差异，可以使用时间实例的 `Sub( )` 方法，并指定另一个时间实例作为其参数。该方法将两个瞬间之间经过的持续时间以纳秒精度的\
    \ `int64` 数据类型值返回。\n\n通常情况下，使用小于纳秒精度的持续时间表示更为合适，因此 Go 标准库 `time` 包包含了一个 `Round(\
    \ )` 方法来指定更简洁的精度。该方法需要一个参数来确定你偏好的舍入行为。通常，该参数由 `time` 包的常量之一提供。例如，调用 `Round( time.Millisecond\
    \ )` 方法将把纳秒精度的持续时间四舍入到最近的毫秒，`Round( time.Second )` 将把纳秒精度的持续时间四舍入到最近的秒，依此类推。\n\
    \n![image](img/1b.jpg)首先在程序中导入 Go 标准库 `time` 包\n\n```go\nimport (\n    “fmt”\n\
    \    “time”\n)\n```\n\n![image](img/commons.jpg)\n\nsrc\\delay\\main.go\n\n![image](img/2b.jpg)接下来，创建并显示\
    \ `Time` 数据类型的组件\n\n```go\nstart := time.Now( )\nfmt.Println( “\\nStarted At:”,\
    \ start.Format( “03:04:05” ) )\n```\n\n![image](img/3b.jpg)现在，延迟程序进度五秒\n\n```go\n\
    time.Sleep( 5 * time.Second )\n```\n\n![image](img/4b.jpg)然后，创建并显示第二个 `Time` 数据类型\n\
    \n```go\nfinish := time.Now( )\nfmt.Println( “\\Finished At:”, finish.Format(\
    \ “03:04:05” ) )\n```\n\n![image](img/5b.jpg)比较开始和结束时间\n\n```go\nfmt.Println(\
    \ “\\nStart First?:”, start.Before( finish ) )\nfmt.Println( “Finish First?:”,\
    \ finish.Before( start ) )\n```\n\n![image](img/6b.jpg)最后，显示延迟的长度\n\n```go\ndiff\
    \ := finish.Sub( start )\nfmt.Println( “\\nTime Elapsed:”, diff.Round( time.Second\
    \ ) )\n```\n\n![image](img/7b.jpg)将程序文件保存到“delay”目录中，然后运行程序以查看时间延迟\n\n![image](img/pg123_1.jpg)\n\
    \n![image](img/hot.jpg)\n\n延迟执行的能力在暂停单个“goroutine”时特别有用——更多详情请参阅此处示例。\n\n### 总结\n\
    \n- Go 标准库 `time` 包包含创建由日期、时间和区域字段组成的 `Time` 数据类型的函数。\n- `time` 包包含了用于创建 `Time`\
    \ 类型的常量，且 `time.Now( )` 函数返回当前日期、时间和区域。\n- `Time` 类型不是字符串，但可以通过 `String( )` 方法转换为字符串。\n\
    - `Time` 字段可以通过 `Year()`、`Month()`、`Day()`、`Hour()`、`Minute()` 和 `Nanosecond()`\
    \ 提取。\n- `time` 包包含了月份名称、小时、秒、毫秒和纳秒的常量。\n- `LoadLocation( )` 函数需要 IANA 区域名称，且\
    \ `In( )` 函数应用区域。\n- `time.Sleep( )` 函数通过指定的持续时间延迟程序的执行。\n- `Sub( )` 方法返回两个时间之间的持续时间，而\
    \ `Round( )` 方法可以指定精度。\n\n# 9 管理数据\n\n***本章将演示如何使用 `math`、`string` 和 `strconv`\
    \ 包处理文本和数字。***\n\n- 合并字符串\n- 分割字符串\n- 查找字符\n- 转换字符串\n- 计算区域\n- 评估数字\n- 舍入小数\n\
    - 生成随机数\n- 总结\n\n## 合并字符串\n\n![image](img/pg126_1.jpg)\n\n在 Go 编程中，字符串是双引号内的零或多个字符。因此，这些都是有效的字符串值：\n\
    \n```go\ns1 := “My First String”\ns2 := “”\ns3 := “2”\ns4 = “nil”\n```\n\n`s2`\
    \ 的空引号将变量初始化为空字符串值。赋值给 `s3` 的数值是数字的字符串表示。Go 的 `nil` 零值通常表示值的缺失，但当它包含在引号内时，它就是一个字符串字面量。\n\
    \n"
- fmt: "\nThe Go standard library strings package contains useful functions for string\
    \ manipulation. Its `Join()` function joins (concatenates) all elements of a string\
    \ array to create a single united string. This function requires two arguments\
    \ to specify the name of a string array and a separator value to be placed between\
    \ each string element in the united string. Typically, you will specify a single\
    \ space as the separator to create a space-separated united string.\n\nThe `fmt.Printf()`\
    \ and `fmt.Println()` functions that write to standard output can add spaces and\
    \ newline characters to output, but do not change the actual strings. They do,\
    \ however, both return two values, which are the number of bytes written and any\
    \ write error. If no error is encountered, the error value will be `nil` as usual.\
    \ With the English language, the number of bytes written will normally represent\
    \ the number of characters output – including non-printing characters contained\
    \ within the string.\n\n![image](images/hot.jpg)\n\nThe ASCII code number for\
    \ a non-printing `\\t` tab character is 9, and for a non-printing `\\n` newline\
    \ character is 10.\n\n![image](images/1r.jpg)\n\nBegin by importing the Go standard\
    \ library strings package into a program\n\n```go\nimport (\n    \"fmt\"\n   \
    \ \"strings\"\n)\n```\n\n![image](images/commonr.jpg)\n\n`src\\join\\main.go`\n\
    \n![image](images/2r.jpg)Initialize two string variables and a concatenated string\n\
    \n```go\ns1, s2 := \"The Truth is rarely Pure \", \"and never Simple.\"\nstr :=\
    \ s1 + s2\n```\n\n![image](images/3r.jpg)Next, output the concatenated string\
    \ and its length\n\n```go\nchars, err := fmt.Printf(\"\\n%v \\n\", str)\nif err\
    \ != nil {\n    fmt.Println(err)\n} else {\n    fmt.Println(\"Bytes Written: \"\
    , chars)\n    fmt.Println(\"String Length:\", len(str))\n}\n```\n\n![image](images/4r.jpg)Initialize\
    \ a string array and a joined string\n\n```go\narr := []string{\"\\n\\tStrive\"\
    , \"For\", \"Greatness!\"}\nast := strings.Join(arr, \" \")\n```\n\n![image](images/5r.jpg)Now,\
    \ output the joined string and first two characters\n\n```go\nfmt.Println(ast)\n\
    if ast[0] == 10 && ast[1] == 9 {\n    fmt.Printf(\"1st Char: ASCII %v Newline\\\
    n\", ast[0])\n    fmt.Printf(\"2nd Char: ASCII %v Tab\\n\", ast[1])\n}\n```\n\n\
    ![image](images/6r.jpg)Save the program file in a “join” directory, then run the\
    \ program to see the united strings\n\n![image](images/pg127_1.jpg)\n\n![image](images/forget.jpg)\n\
    \nThe number of bytes written here exceeds the string length because the `fmt.Printf()`\
    \ method adds two newline characters and one space character.\n\n## Split Strings\n\
    \n![image](images/pg128_1.jpg)\n\nThe Go standard library strings package provides\
    \ several functions that allow a specified string to be separated into substrings.\
    \ These functions treat the string like an array in which each element contains\
    \ a character or a space.\n\nFrequently, you may want to separate a space-separated\
    \ sentence into an array of substrings that are each individual words. The strings\
    \ package conveniently provides a `Fields()` function that will perform that very\
    \ task. This function requires the string sentence as its sole argument, and will\
    \ return an array of substrings containing each individual word from that string.\n\
    \nThe strings package has a `Split()` function that requires two arguments to\
    \ specify a string and a separator. This function will return an array of substrings\
    \ that exist between occurrences of the specified separator. For example, when\
    \ the string is a space-separated sentence and the separator is a space character,\
    \ the `Split()` function will return an array of words within that sentence.\n\
    \nThe strings package also has a `SplitN()` function that works just like the\
    \ `Split()` function, but accepts a third argument to specify how many substrings\
    \ to return. Subsequent occurrences of the specified separator will simply be\
    \ returned in the final substring if the specified number of substrings exceeds\
    \ the number of separators. For example, when the string is a space-separated\
    \ sentence, the separator is a space character, and only two substrings are specified,\
    \ the `SplitN()` function will return a substring containing the first word in\
    \ the sentence and a substring containing the entire remainder of that sentence\
    \ including spaces.\n\nIt is important to recognize that the `Fields()`, the `Split()`,\
    \ and the `SplitN()` functions discard the specified separator and only include\
    \ the characters around the separator in the returned substrings. There are, however,\
    \ two further functions that allow you to also include the separators in the returned\
    \ substrings.\n\nThe strings package’s `SplitAfter()` function works like the\
    \ `Split()` function, but includes the separator in the returned substrings. Similarly,\
    \ the strings package’s `SplitAfterN()` function works like the `SplitN()` function,\
    \ but includes the separator in the returned substrings.\n\n![image](images/hot.jpg)\n\
    \nData is often stored as Comma-Separated Values in CSV files, which can be usefully\
    \ split into individual values.\n\n![image](images/1r.jpg)Begin by importing the\
    \ Go standard library strings package into a program\n\n```go\nimport (\n    \"\
    fmt\"\n    \"strings\"\n)\n```\n\n![image](images/commonr.jpg)\n\n`src\\split\\\
    main.go`\n\n![image](images/2r.jpg)Start the main function by initializing a string\n\
    \n```go\nstr := \"I can, and I will.\"\n```\n\n![image](images/3r.jpg)Next, add\
    \ statements to pass a description and substrings of the string to a listing function\n\
    \n```go\nlist(strings.Fields(str))\nlist(strings.Split(str, \",\"))\nlist(strings.SplitN(str,\
    \ \",\", 2))\nlist(strings.SplitAfter(str, \",\"))\nlist(strings.SplitAfterN(str,\
    \ \",\", 2))\n```\n\n![image](images/4r.jpg)After the main function, add the function\
    \ to list the description and all substrings upon call\n\n```go\nfunc list(desc\
    \ string, subs []string) {\n    fmt.Print(\"\\n\", desc, \": \")\n    for _, v\
    \ := range subs {\n        fmt.Print(\"[\", v, \"] \")\n    }\n    fmt.Print(\"\
    \\n\")\n}\n```\n\n![image](images/5r.jpg)Save the program file in a “split” directory,\
    \ then run the program to see the substrings\n\n![image](images/pg129_1.jpg)\n\
    \n![image](images/forget.jpg)\n\nOnly split methods that contain the word “After”\
    \ in their name will retain the separators.\n\n## Find Characters\n\n![image](images/pg130_1.jpg)\n\
    \nThe Go standard library strings package provides several functions that allow\
    \ a specified string to be searched to find a specified character or substring\
    \ (pattern). These functions treat the string as an array in which each element\
    \ contains a character or a space.\n\nThe strings package has a `Contains()` function\
    \ that requires two arguments to specify a string and a pattern to find. This\
    \ function will simply return true or false to indicate the result of a (case-sensitive)\
    \ search. For example, to search for a “Pro” pattern:\n\n```go\nstrings.Contains(\"\
    Go Programming in easy steps\", \"Pro\")\n```\n\nThe strings package also has\
    \ an `Index()` function that requires two arguments to specify a string and a\
    \ pattern to find. This function will return an integer that is the index position\
    \ of the first instance of the pattern in the searched string if the search succeeds,\
    \ otherwise it will return -1 when the search fails.\n\nThe strings package’s\
    \ `Count()` function requires two arguments to specify a string and a pattern\
    \ to find. You can use this function to discover how many non-overlapping instances\
    \ of a pattern occur in a searched string. If the pattern is an empty string,\
    \ this function will normally return 1 plus the number of characters in the searched\
    \ string. This allows you to determine the number of characters in a searched\
    \ string by deducting 1 from the returned integer.\n"
