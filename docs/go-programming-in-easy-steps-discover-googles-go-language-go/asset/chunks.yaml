    \ program file in an “inher” directory, then run the program to see the values\
    \ from inherited fields\n\n![image](images/pg91_1.jpg)\n\n![image](images/forget.jpg)\n\
    \nRemember that all values in a struct literal must be followed by a comma – including\
    \ the final one.\n\n# Satisfy Interfaces\n\nThe third cornerstone of object-oriented\
    \ programming is that of “polymorphism” – a term derived from Greek, meaning “many\
    \ forms”, that describes the ability to assign a different meaning or purpose\
    \ to an entity according to its context.\n\n![image](images/pg92_1.jpg)\n\nGo\
    \ programming supports polymorphism with an “interface” type that is created using\
    \ the `type` keyword, followed by a name of your choice and the interface keyword\
    \ followed by `{ }` curly brackets. The interface body contains only a list of\
    \ method signatures:\n\n```go\ntype interfaceName interface {\n    methodName\
    \ returnType\n    methodName returnType\n}\n```\n\nAny struct that has methods\
    \ that precisely match the name and signature of all methods listed in the interface\
    \ will implement that interface. In Go programming terms, they are said to “satisfy”\
    \ the interface. The advantage of this is that it allows the program to have various\
    \ structs with like-named attached methods that each perform a different task\
    \ – i.e. they are polymorphic.\n\n![image](images/1bl.jpg)Start a program by creating\
    \ an interface that lists two method signatures, that each require no arguments\
    \ and that each return a string\n\n```go\ntype bird interface {\n    speak( )\
    \ string\n    move( ) string\n}\n```\n\n![image](images/commonb.jpg)\n\n`src\\\
    poly\\main.go`\n\n![image](images/2bl.jpg)Next, create an empty struct and attach\
    \ methods that will satisfy the interface\n\n```go\ntype parrot struct { }\nfunc\
    \ ( parrot ) speak( ) string {\n    return “Squawk, squawk!”\n}\nfunc ( parrot\
    \ ) move( ) string {\n    return “A parrot flies away.”\n}\n```\n\n![image](images/hot.jpg)\n\
    \nNotice that you can omit a parameter name from the receiver and simply state\
    \ the struct name, unless you need to use a parameter name in a method statement.\n\
    \n![image](images/3bl.jpg)Now, create another empty struct and attach methods\
    \ that will also satisfy the interface\n\n```go\ntype chicken struct { }\nfunc\
    \ ( chicken ) speak( ) string {\n    return “Cluck, cluck!”\n}\nfunc ( chicken\
    \ ) move( ) string {\n    return “Chickens cannot fly.”\n}\n```\n\n![image](images/4bl.jpg)Add\
    \ a function that receives the interface as an argument and calls the implemented\
    \ methods\n\n```go\nfunc nudge( b bird ) {\n    fmt.Printf( “\\n%v \\n”, b.speak(\
    \ ) )\n    fmt.Printf( “%v \\n\\n”. b.move( ) )\n}\n```\n\n![image](images/5bl.jpg)Add\
    \ a main function with statements that create instances of each struct, then call\
    \ their like-named methods\n\n```go\nfunc main( ) {\n    var bird1 parrot\n  \
