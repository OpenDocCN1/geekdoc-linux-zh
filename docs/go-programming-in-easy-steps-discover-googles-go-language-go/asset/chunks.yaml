    to execute sequentially


    **fmt.Println( “\nLine-by-Line Execution…” )**


    **count( “moose” )**


    **count( “sheep” )**


    ![image](images/4p.jpg)Then, in the main function, add a goroutine and an ordinary
    function call to execute concurrently


    **fmt.Println( “\nConcurrent Execution…” )**


    **go count( “moose” )**


    **count( “sheep” )**


    ![image](images/5p.jpg)Save the program file in a “goroutine” directory, then
    run the program to see the differing output


    ![image](images/pg159_1.jpg)


    ![image](images/hot.jpg)


    You can also start goroutines from self-invoking functions.


    ![image](images/snake.jpg)


    By default, a program will exit when the main goroutine completes – regardless
    of whether there are any other goroutines that have yet to complete.


    **Keep Waiting**


    Go programs might often include multiple goroutines, so the Go standard library
    sync package provides a WaitGroup type that can be used to wait for a collection
    of goroutines to finish execution.


    ![image](images/pg160_1.jpg)


    An instance of a WaitGroup is created in the usual way, as a variable with this
    syntax:


    **var *waitgroupName* sync.WaitGroup**


    The WaitGroup is simply a counter that can keep a total of the number of running
    goroutines. It has these methods that you use to block the program until all the
    goroutines have completed:


    •**Add( )** – Increments the WaitGroup counter by the number specified as its
    argument. For each new goroutine added to the program, the counter should be increased
    by one.


    •**Done( )** – Decrements the WaitGroup counter by one automatically, so no argument
    is required. The counter should by decreased by one when each goroutine completes.


    •**Wait( )** – Blocks the program until the WaitGroup counter reaches zero, so
    no argument is required. When the final running goroutine decrements the counter
    to zero, blocking is automatically removed.


    When passing a WaitGroup as an argument to a function, it must be passed as a
    pointer. This means that the argument will specify its memory address, using the
    & address-of operator, and the function parameter will denote it as a pointer
    using the * prefix operator. The receiving function can then call the Done( )
    method of the WaitGroup using the pointer argument.


