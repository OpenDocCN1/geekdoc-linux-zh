    \ the formatted value into a log file\n\n```go\nfile, err := os.OpenFile( “htdocs/data.log”,\
    \ os.O_CREATE|os.O_APPEND|os.O_WRONLY, 0644 )\nif err != nil {\n    log.Print(\
    \ err )\n}\ndefer file.Close( )\nlog.SetOutput( file )\nlog.Print( lang )\n```\n\
    \n![image](images/7o.jpg)Save the updated program file, then start the web server\
    \ and visit `localhost:8000/form.html` to see the form appear\n\n![image](images/8o.jpg)Enter\
    \ the name of a programming language in the input field, then hit the Submit button\
    \ to submit the form data\n\n![image](images/hot.jpg)\n\nThe most used request\
    \ methods are `GET` and `POST`. The `GET` method appends data to the URL string.\
    \ The `POST` method carries data in the request body, so is more secure and is\
    \ the preferred method when transferring data from a browser to the server.\n\n\
    ![image](images/pg183_1.jpg)\n\n![image](images/9o.jpg)Now, hit the browser’s\
    \ `Back` button and repeat the submission process to send multiple requests –\
    \ each for a different programming language\n\n![image](images/pg183_2.jpg)\n\n\
    ![image](images/pg183_3.jpg)\n\n![image](images/10o.jpg)Then, visit `localhost:8000/data.log`\
    \ to see each one of the submitted form values in the log file\n\n![image](images/pg183_4.jpg)\n\
    \n![image](images/pg183_5.jpg)\n\ndata.log\n\n![image](images/hot.jpg)\n\nFor\
    \ simplicity, this example submits only one item, which is referenced using the\
    \ request object’s `FormValue()`` method and HTML `name` attribute value. For\
    \ forms that submit multiple items, you can loop through them using the `range`\
    \ keyword to reference the key (HTML `name` attribute) and value (HTML `value`\
    \ attribute) of each item.\n\n## Deliver a Dynamic Response\n\nHaving received\
    \ and logged the request data, following the steps [here](#chapter12.xhtml_handler),\
    \ the program can now evaluate the request and send an appropriate response to\
    \ the web browser.\n\n![image](images/1o.jpg)After the log statements in the form\
    \ handler, initialize two variables with default response string values\n\n```go\n\
    title := “<a href=’http://www.ineasysteps.com’>**See all titles online</a>”\n\
    isbn := “logo”\n```\n\n![image](images/commono.jpg)\n\nsrc\\server\\main.go\n\n\
    ![image](images/2o.jpg)Next, examine the submitted request value and, if matched,\
    \ assign appropriate response values\n\n```go\nswitch lang {\ncase “c” :\n   \
    \ title = “C Programming”\n    isbn = “978-1-84078-840-2”\ncase “go” :\n    title\
    \ = “Go Programming”\n    isbn = “978-1-84078-919-5”\ncase “java” :\n    title\
    \ = “Java”\n    isbn = “978-1-84078-873-0”\ncase “python” :\n    title = “Python”\n\
    \    isbn = “978-1-84078-812-9”\ncase “sql” :\n    title = “SQL”\n    isbn = “978-1-84078-902-7”\n\
    }\n```\n\n![image](images/3o.jpg)Now, build an HTML string that incorporates the\
    \ response values\n\n```go\nresponse := “<!DOCTYPE HTML><title>Web Server Response</title>”\n\
    response += “<link rel=’shortcut icon’ href=’favicon.ico’>”\nresponse += “<link\
    \ rel=’stylesheet’ href=’css/style.css’>”\nresponse += “<p>” + title + “<br>in\
    \ easy steps”\nif isbn != “logo” {\n    response += “<br>ISBN:” + isbn\n}\nresponse\
    \ += “</p><img src=’img/” + isbn + “.png’ alt=’Cover’>”\nresponse += “<img src=’img/power.png’\
    \ alt=’Power’>”\n```\n\n![image](images/hot.jpg)\n\nNotice that single quotes\
    \ are used inside the string to distinguish between the outer double quotes, and\
    \ so avoid prematurely terminating the string.\n\n![image](images/4o.jpg)Finally,\
    \ add a statement to send the response\n\n```go\nio.WriteString( w, response )\n\
    ```\n\n![image](images/pg185_1.jpg)\n\n![image](images/5o.jpg)Save the updated\
    \ program file once more and start the web server, then visit `localhost:8000/form.html`\
    \ to send requests and receive responses\n\n![image](images/pg185_2.jpg)\n\n![image](images/pg185_3.jpg)\n\
    \n![image](images/pg185_4.jpg)\n\n![image](images/pg185_5.jpg)\n\n![image](images/hot.jpg)\n\
    \nYou can discover many more programming language books in this series – including\
    \ R for Data Analysis in easy steps that covers the R language – at [www.ineasysteps.com](http://www.ineasysteps.com)\n\
    \n## Summary\n\n- The Go standard library `net/http` package provides utilities\
    \ to create a web server.\n- The `http.ListenAndServe()` function specifies an\
    \ address at which to listen, and the name of a request handler.\n- A web server\
    \ program must register route handlers that specify how to respond to particular\
    \ requests.\n- The `http.HandleFunc()` function specifies a route to listen for,\
    \ and the name of a function that will handle that request.\n- A request handler\
    \ function signature always has parameters for an `http.ResponseWriter` object\
    \ and an `http.Request` object.\n- An `http.ResponseWriter` object has a `Write()`\
    \ method that can accept a `[]byte` slice to send in a response.\n- The `io` package\
    \ provides a `WriteString()` function that can pass a string to an `http.ResponseWriter`\
    \ object for a response.\n- Files can be added to a web server program to be delivered\
    \ to the browser in response to its requests.\n- The `http.Dir()` function nominates\
    \ a root file system.\n- The `http.FileServer()` function returns a handler for\
    \ the contents of the file system specified as its argument.\n- The `http.Handle()`\
    \ function specifies a route and the name of a handler for requests made to the\
    \ nominated file system.\n- The `http.Request.ParseForm()` method populates an\
    \ `http.Request.Form` object with submitted form data.\n- The `http.Request.Method`\
    \ object contains the value assigned to the HTML form’s method attribute.\n- The\
    \ `http.Error()` function can use an `http.ResponseWriter` object to send an error\
    \ message and status to the browser.\n- The Go standard library `log` package\
    \ has `SetOutput()` and `Print()` functions to write time-stamped items to a log\
    \ file.\n- A web server program can build an HTML string to send a dynamic response\
    \ to the web browser.\n"
