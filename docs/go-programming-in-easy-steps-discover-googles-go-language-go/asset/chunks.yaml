  raw: 'The size of the capacity increment is 10 here, but may vary on other platforms.
    Notice that the capacity does not resume its original size when the element has
    been removed.


    **Slices Versus Arrays**


    An array contains a sequence of values, whereas a slice contains a reference to
    a sequence of values. This is an important distinction in Go programming that
    applies to many of its types. Most significantly, when passing a type to a function,
    those types that are value-based will receive a copy of the original, whereas
    those types that are references will point to the actual original. In order for
    the function to operate on an original value, you therefore need to use pointers
    when passing value-based types to a function, but no pointers are needed when
    passing references.


    ![image](images/pg106_1.jpg)


    ![image](images/pg106_2.jpg)


    Another distinction between arrays and slices concerns “variadic” functions that
    can be called with any number of arguments. You cannot pass array element values
    to a variadic function unless you first “convert” the array to a slice by copying
    the array element values into slice elements.


    You can create a variadic function simply by prefixing the final parameter’s data
    type with the … wildcard operator in the function signature, using this syntax:


    **func *funcName* ( *paramName* …*dataType* )**


    Variadic functions can be called in the usual way, enclosing a comma-separated
    list of arguments within **( )** parentheses.


    Variadic functions are especially useful when passing the values in slice elements
    to a function, as the length of a slice may change during the execution of a program.
    Regardless of the length of the slice, its element values can be passed to a variadic
    function by specifying the slice name followed by the … wildcard operator, within
    the parentheses of a function call:


    ***funcName* ( *sliceName*… )**


    ![image](images/hot.jpg)


    The **fmt.Printf( )** function is a variadic function – it requires one fixed
    argument at the beginning, then accepts any number of subsequent arguments.


    ![image](images/1v.jpg)Create an array of three strings


    **array := [ 3 ]string{ “BMW”, “Ford”, “Opel” }**


    ![image](images/commonv.jpg)


    src\versus\main.go


    ![image](images/2v.jpg)Copy the array elements into a slice to “convert” it


    **slice := array[ : ]**


    ![image](images/3v.jpg)Next, call a variadic function to pass the values in each
    slice element for display


    **list( slice… )**


    ![image](images/4v.jpg)Now, append two more values to the slice


    **slice = append( slice, “Porsche”, “Ferrari” )**


    ![image](images/5v.jpg)Again, call a variadic function to pass the values in each
    slice element for display


    **list( slice… )**


    ![image](images/6v.jpg)After the main function, add the variadic function to list
    the passed-in values of the slice elements


    **func list( autos …string ) {**


    **for i, v := range autos {**


    **fmt.Printf( “\n%v. %v”, i, v )**


    **}**


    **fmt.Println( )**


    **}**


    ![image](images/7v.jpg)Save the program file in a “versus” directory, then run
    the program to see the parameter values


    ![image](images/pg107_1.jpg)


    ![image](images/forget.jpg)


    When calling a variadic function, you are not passing the slice itself – you are
    merely passing the slice element values.


    **Map Keys and Values**


    Multiple items of data can be stored with associated keys in a hash table, so
    that you can reference a stored value via its associated key. In Go programming,
    this data structure is called a “map”, but other programming languages call this
    an associative array or dictionary.


    ![image](images/pg108_1.jpg)


    All keys in a map must be unique and be of the same data type. All values in a
    map must be of the same data type, but not necessarily be of the same data type
    as the keys.


    A map can be created using the var and map keywords, and by specifying the key
    and value data types using this syntax:


    **var *mapName* = map [ *keyDataType* ] *valueDataType***


    Individual key/value pairs can then be assigned to the map, like this:


    ***mapName* [ “*keyName*” ] = *value***


    Alternatively, you can use the built-in make( ) function to create a map:


    ***mapName* := make( map [ *keyDataType* ] *valueDataType* )**


    Furthermore, you can create and initialize a map by assigning a “map literal”
    with this syntax:


    ***mapName* := map [ *keyDataType* ] *valueDataType* {**


    ***key* : *value* , *key* : *value* , *key* : *value ,***


    **}**


    Unlike arrays and slices, the key/value pairs are stored in an unordered manner,
    so you cannot use element index numbers to reference a stored value – you must
    use its associated key.


    You can add key/value pairs to a map at any time, and you can use the built-in
    delete( ) function to remove a key/value pair. This requires two arguments to
    specify the map name and the name of the key that you want to remove.


    As with arrays and slices, you can iterate through all the elements of a map using
    the range keyword. In this case, the loop will return the key and value, rather
    than an index number and value.


    ![image](images/snake.jpg)


    A map element is not a variable, so you cannot take its memory address.


    ![image](images/1v.jpg)Create a map for string keys and values


    **colors := make( map [ string ] string )**


    ![image](images/commonv.jpg)


    src\map\main.go


    ![image](images/2v.jpg)Initialize the map with three key/value pairs


    **colors[ “Red” ] = “#FF0000”**


    **colors[ “Green” ] = “#00FF00”**


    **colors[ “Blue” ] = “#0000FF”**


    ![image](images/3v.jpg)Next, display all key/value pairs within the map


    **fmt.Printf( “\nColors: %v \n”, colors )**


    ![image](images/4v.jpg)Now, add a key/value pair and display its value


    **colors[ “Yellow” ] = “#FFFF00”**


    **fmt.Printf( “\nYellow Hex Code: %v \n”, colors[ “Yellow” ] )**


    ![image](images/5v.jpg)Then, remove the added key/value pair


    **delete( colors, “Yellow” )**


    ![image](images/6v.jpg)Finally, add a loop to list all key/value pairs in the
    map


    **for k, v := range colors {**


    **fmt.Printf( “\nHex Code for %v is %v \n”, k, v )**


    **}**


    ![image](images/7v.jpg)Save the program file in a “map” directory, then run the
    program to see the keys and values


    ![image](images/pg109_1.jpg)


    ![image](images/forget.jpg)


    The order of map elements is random and may vary on different platforms.


    **Summary**


    •An array is a fixed-length structure that stores data sequentially in individual
    elements.


    •An array declaration must specify the number of required elements between [ ]
    square brackets.


    •The data stored in an array or slice element can be referenced by stating the
    element’s index number in [ ] square brackets.


    •An empty array can be created using the var keyword, or can be created and initialized
    by assigning an array literal.


    •The len( ) function returns the length of an array or slice.


    •The range keyword can be used to iterate through elements.


    •A slice is a variable-length structure that stores data sequentially in individual
    elements of an underlying array.


    •A slice comprises a pointer, length, and capacity.


    •The cap( ) function returns the capacity of a slice.


    •A slice declaration must not specify the number of elements between [ ] square
    brackets.


    •Upper and lower boundaries of a sequence of elements can be specified around
    a : colon character within [ ] square brackets.


    •An empty slice can be created using the make( ) function, or can be created and
    initialized by assigning a slice literal.


    •Elements can be added to a slice by the append( ) function.


    •A slice can be copied into another slice by the copy( ) function.


    •Pointers are not required when passing references to a function.


    •Variadic functions can be called with any number of arguments.


    •A map is a variable-length structure containing associated key/value pairs.


    •An empty map can be created using the make( ) function, or can be created and
    initialized by assigning a map literal.


    •The value stored in a map element can be referenced by stating the associated
    key in [ ] square brackets.


    8


