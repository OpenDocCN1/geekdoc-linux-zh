    \ Stops a process by name rather than number. |\n nice | Assigns a CPU priority\
    \ to a process. |\n pidof | Gets a program's ID number. |\n ps | Gets a lot of\
    \ programs' ID numbers, usually used as ps aux. |\n ptree | Shows the relationships\
    \ between programs. |\n renice | Changes a program's CPU use priority. |\n top\
    \ | Shows resource use over time. |"
