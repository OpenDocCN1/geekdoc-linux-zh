    # Formatting toolbar


    The Formatting toolbar is directly below the standard toolbar in a default OpenOffice.org
    setup — though not on all distributions. As usual, you remove the Formatting bar
    at any time by using the View menu. This series of icons allows you to click buttons
    and expand drop-down list boxes that represent word-processing functions, such
    as styles, fonts, sizes, and formatting instructions. Most features on this bar
    are identical to what you see in most modern word processors. The button for paragraph
    background formatting is the only one that''s particularly unusual.


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_329_0.png)


