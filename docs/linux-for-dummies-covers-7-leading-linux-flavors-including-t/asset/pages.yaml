    > I will make you shorter by the head.

    — Queen Elizabeth I


    When you start using a new operating system, one of the most frustrating things
    is trying to figure out all the goofy file extensions. The Windows world has .exe
    and .zip. The Macintosh world has .bin and .hq What about the Linux world? It
    certainly has its fair share of bizarre extensions, really, they make a great
    deal of sense after you know the programs that make them. In this chapter, you
    will find out about .tar, .gz, .tar.gz, .tgz, .bz2, and .rpm. Anyone up for a
    game of Scrabble with alphabet soup?


    After you have the letter jumble figured out, you''ll be happy to find Linux offers
    a number of cool tools for working with these crazy files, updating your system,
    adding new software, and more.


    # # Opening Downloaded Files


    The Linux and Unix worlds are full of strange terms and acronyms. For example,
    if someone comes up to out of the blue and starts talking about tarballs, you
    probably get a mental image of sticky, smelly balls of tar, maybe rolled in feathers.
    Yet a tarball is something you run into regularly in the Linux'
