    # The dad-gum browser plug-ins


    Do you ever get irritated at Web sites that insist you download a plug-in, or
    additional piece of software, just to view the site? The difference between a
    plug-in and an external program is: A Plug-in displays the results in the browser,
    and an external program runs outside the browser. Although these plug-ins are
    annoying if you''re just looking for some basic information, they can provide
    some pretty cool stuff, such as streaming video and music through your Web browser.


    Chapter 12 explains how to add the popular plug-ins (like Macromedia''s Flash
    plug-in) to your system for each of the distributions covered in this book. When
    you download a particular type of file, Firefox gives you the chance to tell it
    to automatically handle those types of files later. Beware telling the browser
    to run things automatically, you could be opening yourself for security problems.


    Firefox also supports a concept extensions, which refers to features that aren''t
    included in the main browser because many people may not want to bother with them.
    Select Tools > Extensions to open the Extension dialog box (see Figure 9-4).


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_181_0.png)'
