    +   - Download a PC hardware-detect tool. If you don''t have any diagnostic tools
    and you have a relatively current version of DOS, you can download various PC
    hardware detect tools, such as PC-CONFIG, from the Internet. The PC-CONFIG tool
    contains several screens of information and menus to choose hardware devices and
    options. This tool is shareware, and the usage and fee information are available
    from the Holin Datentechnik website (www.holin.com).


    +   - Gather information by reading the screen when the computer starts. If your
    system doesn''t contain any operating systems and you don''t have any of your
    system''s documentation, you can resort to reading the screen as your computer
    boots. On some systems, the video information is displayed as the computer boots.
    You may have to reboot several times if it goes too fast. Also, some systems display
    the PCI components and their settings as the system is starting up. Again, you
    may have to reboot several times to gather all the information.


    You can try pressing the Pause-Break key on your computer (it should be near the
    Scroll Lock key) to get it to freeze during boot. You can then unfreeze it by
    pressing any key when you have finished reading.


    +   - Access the Basic/Input/Output system (BIOS) information. Stored in a small
    area of memory and retained by a battery, this is sometimes referred to as CMOS
    (Complementary Metal-Oxide Semiconductor), which indicates the type of computer
    chip that can store and retain information. The amount of information stored in
    the BIOS can range from very little to quite a lot. Some newer systems may display
    several screens of information about the computer''s hardware.'
