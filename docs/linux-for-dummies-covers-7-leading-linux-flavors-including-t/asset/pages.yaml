    > A gentleman is a man who can play the accordion, but doesn''t. — Unknown


    There is little more maddening than to find a file online or have that you can''t
    use it. While this issue is less of a problem for Linux users as each day passes,
    things do sometimes crop up that have to be worked around, particularly if you
    switch to Linux and then realize you have certain programs you can''t live without
    and can''t seem to replace.


    Fortunately, you have a number of options available whether you need to use or
    run Windows programs. If you''re looking for software to try with existing files
    or a Linux equivalent to a beloved program, then a good place to start (aside
    from Chapter 12) is www.linuxrsp.ru/win-lin-soft/table-eng.html. Here, you can
    see why it''s surprising if you can''t find a program under Linux to do what you
    need. Some of this software is “commercial” in that it''s for sale, and other
    programs are free.'
