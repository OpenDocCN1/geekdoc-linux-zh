    # Finding CDs and More in Your GUI


    Chapter 10 covers how to use the file managers that come with the distributions
    covered (and other Linux desktop-based distributions, for that matter) — Nautilus
    and Conqueror. In this section, I take a look at how to use these tools to find
    your way around the filesystem. Some distributions make this process more intuitive
    than others, mostly due to tons of handy shortcuts that you can know less of what''s
    happening under the hood — a pretty handy thing for desktop users.


