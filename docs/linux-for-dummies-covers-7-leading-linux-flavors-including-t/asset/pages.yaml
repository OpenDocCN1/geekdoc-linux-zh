  md: '# 216 Part III: Getting Up to Speed with Linux


    Because it''s a bit of an at times trying to figure out which partition may be
    damaged, I walk you through a process where you check the most likely ones and
    then work through the rest in.


    +   1. Type df -h to see a list of all your partitions.


    The df command lists the mounted partitions and media in addition to some statistics
    about them. You may, for example, see like the following:


    | Filesystem | Size | Used | Avail | Use% | Mounted on |

    | --- | --- | --- | --- | --- | --- |

    | /dev/hde2 | 54G | 27G | 24G | 54% | /boot |

    | /dev/hd1 | 99M | 6.0M | 88M | | |

    | none | 506M | | 506M | 0% | /dev/shm |

    | /dev/hdf3 | 54G | | 13G | 76% | /mnt/Fc |


    +   2. Look for an item with /boot in the right column.


    If you find one, great. Proceed to Step 3. Otherwise, skip to Step 10.


    +   3. On that same line, look on the left column to see what partition /boot
    is on.


    In this example, /boot is on /dev/hde1.


    +   4. Type mount.


    This command gives you even more cryptic looking. In my example, it may be


    ```

    /dev/hde2 on / type ext3 (rw)

    none on /proc type proc (rw)

    none on /sys type sysfs (rw)

    none on /dev/pts type devpts (rw,gid=5,mode=620)

    usdevfs on /proc/usb usdevfs (rw)

    /dev/hde1 on /boot type ext3 (rw)

    one on /dev/shm type tmpfs (rw)

    /dev/hdf3 on /mnt/Fc1 type ext3 (rw)

    sunprpc /var/lib/nfs/rpc_pipefs rpc_pipefs (rw)

    ```


    +   5. Locate the line with /boot on it once and look at what "type" is being
    used.


    In this case, /boot on /dev/hde1 is formatted as type ext3. Keep this in mind.
    You will need to use this information in Step 8.


    +   6. Type umount /boot.


    This command should release the partition, if this is possible. If this command
    fails, type mount -o remount -o rw /device/boot (for example, mount -o remount
    -o rw /dev/boot).


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_237_0.png)'
  merge: -1
