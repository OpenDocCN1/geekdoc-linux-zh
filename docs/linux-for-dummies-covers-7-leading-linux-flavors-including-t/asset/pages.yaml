- img_proc: true
  md: '# Chapter 5: Booting and Stopping Linux 93


    Some symptoms of a failed POST include these:


    +   - An unusual series of long and short beeps


    +   - Nothing displayed on the monitor


    +   - No apparent activity other the whirring fan on the power supply


    +   - A puff of smoke or the pungent smell of burning electrical components from
    your computer case


    +   - An error message, displayed on the monitor, indicating a hardware failure


    If you encounter any of these problems, you have hardware troubles that need to
    be resolved before you can proceed. If your computer was running properly before
    you began your Linux installation, your computer should be getting through the
    POST just fine — POST problems don''t tend to be caused by installing a new operating
    system; they''re far more fundamental to the computer itself.


    For all the bust of these errors, it''s time to question your nephew Mortimer,
    who was last seen lurking around your computer with a screw-driver. (Or take your
    computer into a computer repair shop!) If you see an error message indicating
    a hardware failure, you might have a shot at fixing the problem in the BIOS. As
    the POST does its thing and finishes up, it briefly displays (usually at the bottom
    of the screen) instructions on how to enter "setup". Typically, these instructions
    mention pressing the DEL key or a function key such as F1. When you do so (provided
    all goes well), you will see a blue screen with black-and-white text. From here,
    if you''re familiar with your hardware, you can try to figure out and fix the
    problem. However, many people would rather have a root canal with no anesthesia
    than mess with stuff, so you may want to grab the nearest teenager or computer-shop
    wizard and entreat him or her to take a look.


    The good news is that if you get to the BIOS at all, the problem may be easier
    than one where the computer fails before you reach the BIOS.


    # Step 2: The BIOS passes the baton to the boot loader


    After the BIOS gives the okey-dokey with a successful POST, the BIOS locates the
    first hard drive in your system and reads the first sector of that disk, which
    is often referred to as the MBR (Master Boot Record). On first chunk of disk is
    a small program called a boot loader. The boot loader doesn''t'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# 94 Part I: Getting Your Feet Wet


    know much about anything, except how to start loading your operating system.


    Two boot-loader programs understand how to load a Linux operating system: LILO
    (LLinux Loader) and GRUB (GRand Unified Boot loader). LILO has been a tried-and-true
    boot loader as long as Linux has been a gleam in a geek''s eye; GRUB is newer
    and much more sophisticated. Many distributions allow you to choose your boot
    loader. Typically, most people stick with the defaults, which are as follows for
    six of the distributions I discuss in this book (Knopp is not included because
    it boots directly from the CD-ROM or DVD-ROM drive):


    | Distribution | Default Boot Loader |

    | Fedora Core | GRUB |

    | Linspire | GRUB, with its special routines on top of it |

    | Mandriva | LILO |

    | SU | GRUB |

    | Xandros | LILO, with its own routines on top |

    | Ubuntu | GRUB |


    Sometimes "bad things" can happen to your boot loader. One common symptom of boot
    loader problems is a message saying that the operating system could not be found.
    Another hint is that the problem is your boot loader is if you never see your
    *boot menu*, which is a screen that comes up during the boot process that you
    choose what operating system and version to boot.


    The boot menu will look different from distribution to distribution.


    If you suspect a boot-loader problem, see the section "Entering Rescue Mode,"
    later in this chapter.


    # Step 3: The boot loader (LILO or GRUB) loads the system kernel into memory


    Every computer (and electronic device) requires an operating system to run. The
    technical term for this operating system, or at least the core of it, is the *kernel*.
    If the kernel is your maestro, orchestrating all the components of your computer
    and delegating resources in a logical and cooperative manner, the boot loader
    is the red carpet on which the maestro arrives.


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_115_0.png)'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# Chapter 5: Booting and Stopping Linux


    Many Linux distributions today actually put up a graphical progress screen during
    the kernel loading and system initialization phase (after the kernel finishes
    loading, when it finishes up the boot process). If you want to see what happens,
    typically you can click an icon or press a key. Just look for instructions on
    how to "see details." (Not all distributions offer this feature, so if you don''t
    find a way to do this, don''t panic.)


    If available, watch the scrolling text for one of the symptoms below:


    +   - The system freezes.

    - A few dots appear across the top of the monitor, and then the system freezes.

    - A few messages appear on the screen, and the final message reads kernel panic.

    - The system reboots automatically.


    The boot loader passes control over the kernel. You know when the kernel is loading
    because you start to see crazy text like this:


    ```

    Uncompressing Linux... OK, booting the kernel.

    audit(1092566112, 337:0): initialized

    ```


    Recovering from a kernel-loading failure (aside from the dread operating system
    not found situation described in the previous section) is one of the more challenging
    issues in Linux. This task is, unfortunately, not for the faint of heart. On the
    other hand, the failed kernel may be updated one; if you have more than one Linux
    option in your boot menu, look at the numbers for each and choose the second newest.
    Doing so boots into the last working kernel and have (at least) a working system.
    Then you can open www.google.com and search on the specific error messages, or
    wait until the next update comes out and ignore the bad one for now.


    If it''s your original installation that doesn''t start properly, you unfortunately
    don''t have a fallback kernel option. If this is your problem, I recommend contacting
    your distribution''s support address (if you purchased a commercial product) or
    joining the beginner''s help list if you downloaded a free product. See Chapter
    2 to find where to locate help for each distribution discussed in this book. Or
    you could just reinstall, that''s easier to do when it''s a fresh installation.
    Sometimes things go a bit strange during the initial installation and reinstalling
    fixes the problem.'
  merge: -1
