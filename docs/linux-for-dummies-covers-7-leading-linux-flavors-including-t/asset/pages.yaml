    # Spreadsheets with OpenOffice.Org


    Some people like to balance their checkbooks by hand. When I first graduated from
    a university, I decided that it was time to get hold of my finances, and a spreadsheet
    was the way to do it. These days, I use spreadsheets to keep track of my "time
    card" when I''m doing consulting or contract work, help me manage project teams,
    and complete other tasks. I''m sure you have your favorite uses for spreadsheets.
    The following sections take a look at OpenOffice.org Calc so that you can get
    to work.


    # Starting it up


    Start OpenOffice.org Calc in the distributions I cover in this book, do the following:


    +   - Fedora Core: Choose Applications-Spreadsheet. Or you can click the Spreadsheet
    button in the upper panel.

    - Knoppix: From the Main Menu, choose Office-OpenOffice.org-OpenOffice.org Calc.

