  md: '# Chapter 14: Working without the GUI 269


    appear next to the numbers so that you can see how big these numbers actually
    are. But, wait — there''s more. If you just want to know the total amount of disk
    space this directory and its subdirectories are taking up? That calls for the
    -s flag:


    ```

    -s

    ```


    What if you want the total for a different directory? Or just one of your subdirectories?
    In my case, I keep a Music subdirectory for the items I have copied from my CDs
    in Oggs (Chapter 18). I can type the following command to see how much hard drive
