  md: '# Chapter 8: Connecting to the Internet


    +   - User login password


    +   - E-mail address


    +   - E-mail outbound host or Simple Mail Transport Protocol (SMTP) server


    +   - E-mail inbound host or Post Office Protocol (POP) server


    +   - News host will be


    +   - **Static**: You always have the same IP address. Static addresses are more
    common for servers than for desktops. If you''re using static, your ISP needs
    to give you your nameserver IP addresses, your gateway address, the network address,
    and the netmask. This information should be all on the customer information sheet.

    - **Dynamic**: Your IP address changes each time you connect, or at regular intervals.
    On most desktops, you just don''t always to have the same address, and it makes
    life easier for computers like laptops, which get moved around often from network
    to network. If you''re using dynamic addressing, you''re told that you need to
    connect using DHCP.


    With this information, you can establish an Internet connection by using the Linux
    system.


    # Hooking Up


    Fortunately, the Linux vendors provide tools that reduce the complexity of hooking
    up with Linux. It''s not that networking has changed, but rather that many of
    its details have been hidden so that you just have to click here and press a key.
    Not long ago, configuring dialup networking (in particular) on a Linux machine
    was nothing short of debugging a Defective Route Goldberg contraction.


    The Internet connection configuration tools available in the distributions within
    this book are


    +   - Knoppix: Click the Penguin icon on the panel and select Network/Internet.
    This menu contains a variety of tools you can use to get online with Knoppix,
    depending on the type of hardware you''re using.

    - Linspire: Select Launcher/Run Programs/Internet/Internet Connection Tools, and
    then choose the most appropriate tool for your ISP.

    - Fedora: Choose System/Administration/Network to open the Network Configuration
    dialog box. Click New to start the Add New Device Type wizard.'
