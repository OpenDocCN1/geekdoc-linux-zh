    the Fedora software, so continue with this section only if you downloaded your
    own DVD or purchased it from a third party, or if you downloaded or otherwise
    acquired the Fedora CDs.


    If your installation keeps dying while Anaconda (the Red Hat installer program)
    is placing packages on your hard drive, follow these steps to try to fix it:


    +   - Place the DVD-ROM or the first Fedora Core CD-ROM into your drive.

    - Reboot the machine.'
