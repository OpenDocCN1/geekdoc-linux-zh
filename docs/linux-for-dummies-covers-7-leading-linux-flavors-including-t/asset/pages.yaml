    # The Database pane


    To the left of the main window is the Database pane. In this pane you see four
    icons: Tables, Queries, Forms, and Reports. Select these icons to determine what
    appears in the two rightmost panes — for example, to work with your tables, select
    the Tables icon.


    A query allows you to ask complex questions regarding your database.


    # The Tasks pane


    The upper-right pane is the Tasks pane. In here, you see what types of things
    you can do for a particular selection in the Database pane. Use the Description
    to decrypt any of the terms that make your eyes cross.


    # The Tables/Queries/Forms/Reports pane


    The lower-right pane shows the tables, queries, forms, or reports that already
