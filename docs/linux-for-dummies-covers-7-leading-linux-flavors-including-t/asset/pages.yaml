    From here, you need to add music to the right-hand side in order to play it. You
    can individually drag and drop but there are lots of other ways to do this. Let
    me take you on a tour of the interface to point out some of them.


    Along the length of the Amarok window is a collection of tabs. What you see and
    what I see might be different, depending on your version. Each tab has a segment
    of functionality, and may change the interface to the left of the playlist. The
    tabs displayed in Fedora from top to bottom are:


