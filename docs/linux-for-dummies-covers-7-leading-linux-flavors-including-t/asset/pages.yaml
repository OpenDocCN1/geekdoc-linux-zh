  md: '# Chapter 11: Checking Out the Linux Filesystem 203


    | Directory | Contains |

    |---|---|

    | /mnt | A spot where you add extra filesystem components such as networked drives,
    items you aren''t permanently adding to your file system but aren''t temporary
    as CD-ROMs and floppies |

    | /opt | The location that some people decide to use (and some programs want to
    use) for installing new software packages, such as word processors and office
    suites |

    | /proc | Current settings for your kernel (operating system)* |

    | /root | The superuser''s (root user''s) home directory |

    | /sbin | The commands the system administrator needs access to |

    | /srv | Data for your system''s services (the programs that run in the background)*
    |

    | /sys | Kernel information about your hardware |

    | /tmp | The place where everyone everything stores temporary files |

    | /usr | A complex hierarchy of additional programs and files |

    | /var | The data that changes frequently, such as log files and your mail |


    Some of these directories have some equally important subdirectories, which I
    cover in the upcoming sections.


    # Meet the /etc subdirectories


    Although the exact subdirectories that exist in /etc can change from distribution
    to distribution, the following two are fairly standard:


    +   * The /etc/X11 directory contains configuration details for the X Window System
    (X), which runs your Graphical User Interface (GUI). See Chapter 14 for more on
    the GUI.


    +   * The /etc/opt directory contains configuration files for the programs in
    the /opt directory, if you decide to use it.'
