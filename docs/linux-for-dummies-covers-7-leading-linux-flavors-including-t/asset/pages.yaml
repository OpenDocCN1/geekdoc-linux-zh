  md: '# 274 Part III: Getting Up to Speed with Linux


    However, you may want to alter the value of some environment variables. For example,
    in Table 14-1, the first entry, HISTSIZE, determines the number of lines of command-line
    history that are kept on file. You may have read the discussion, earlier in this
    chapter, reexecuting a command from yesterday. (If not, refer to the section "Accessing
    your command history.") By setting a higher number for HISTSIZE, you can save
    an even longer list of previously executed commands.


    # Storing and retrieving variables'' values


    To assign a value to a variable, you just use the variable name followed by an
    equals sign (=) followed by the value to store:


    ```

    MyVariable=My

    ```


    To retrieve the value represented by that variable, you need to precede the variable
    name with a dollar sign ($). Look at a variable, created by the shell, that determines
    your prompt looks like. This variable is named PS1. First, you view the value
    being held by PS1:


    ```

    echo $PS1

    ```


    You likely see something like the following line:


    ```

    [\u@\h \W]$

    ```


    Each of the characters preceded by a backslash represents a special instruction
    to the shell to return specific information when the shell prompt is referenced.
    See Table 14-2 for examples of special slash characters you can use in customizing
    your prompt.


    | Table 14-2 | Pieces of the PS1 Puzzle |

    | Component | Result |

    | \! | Prints the position of the command in your history list. |

    | \# | Prints the number of commands you have used during the current shell session.
    |

    | \$ | Prints a $ for user accounts or a # for superuser. |

    | \d | Prints the date in the following format: day month date. |

    | \h | Prints the name of the machine you''re logged in to. |

    | \n | Moves down to the next line. |

    | \s | Prints bash for the bash shell. |'
