    # Putting Wildcard Expansion to Good Use


    Computing life would be tedious if you had to repeat the same command on multiple
    files. After all, Wildcard expansion refers to the ability one command to be executed
    against many files. The asterisk (*) and the question mark (?) are two wildcard
    characters that are used to match any filename, or a portion of a filename. For
    example, you can use the following command to see a long directory listing that
    includes only files that end with a .doc filename extension:


    ```

    ls -l *.doc

    ```


    The files listed may include resume.doc, cover_letter.doc, and to_editor.doc,
    for example.


    # Working with Long Commands


    As you become used to the command line, you should find some shortcuts to ease
    your typing chores. In this section, I show some features of the bash shell designed
    to make your life on the command line as pleasant as possible. These features
    include command-line completion, editing, and using the history of previously
    entered commands.


    # Asking Linux to complete a command or filename for you


    Considering that you do much more typing on the command line than you normally
    do in a GUI environment, a feature that provides typing shortcuts wherever possible
    is great. Command completion is a function of the shell that completes filename
    and system commands.'
