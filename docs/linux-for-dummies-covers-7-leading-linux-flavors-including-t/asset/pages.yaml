  md: '# Chapter 2: Prepping Your Computer for Linux


    If you choose to access the BIOS, make sure you do so before operating systems
    load. Most manufacturers indicate the keyboard key (or key sequence) that you
    gets into the BIOS (or Setup) on-screen when the system is starting up — for example,
    Press Del to enter Setup. If you can''t find the keyboard sequence, check the
    manufacturer''s Web site. After you''ve entered the BIOS, you typically navigate
    around with the arrow keys, Tab key, or Enter. Some BIOS environments also use
    the function keys; look for a list of function-options at the top or bottom of
    the screen.


    Be specially wary of labels on hardware boxes and Web sites that include the term
    Win (as in Windows). These components, as WinModems on Microsoft Windows are to
    function — even worse, the packaging may show nothing that suggests this limitation.
    Only a very slight chance exists that you can find a Linux driver for Win hardware.
    If you do find one, copy it to a floppy before you install Linux. If you can''t
    find a driver and you need to use a modem, put down a little chaos and get a modem
    that is properly supported. (For more information about WinModems in particular,
    see Chapter 8.)


