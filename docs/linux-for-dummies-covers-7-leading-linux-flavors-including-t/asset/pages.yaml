    by opening the ~/.bash_profile file and adding the same text. The next time you
    log in, the changes go into effect. You can make changes for all your users''
    profiles in /etc/profile as well.


    If you experiment heavily with these files, create a separate user account so
    that you can do whatever you want without messing up your own login. This advice
    especially goes for /etc/profile. You can damage everyone''s logins with this
    one! To create a separate /etc/profile, you can make a backup by typing cp /etc/profile
    /etc/profile.original. Then edit /etc/profile knowing that you can always delete
    it with the rm command and use the mv command to rename /etc/profile.original
    to /etc/profile.


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_297_1.png)


    To create an environment variable from scratch, you will typically name it with
    all capital letters and then you will have to "export" it. For example:


    ```

    CUSTOMVAR="new variable"

    export CUSTOMVAR

    ```


    Don''t be discouraged if you don''t understand all this variable stuff right now.
    As you become more proficient with Linux, you should explore scripting. Shell
    scripting is the art of creating computer programs with just the shell. Most Linux
    and Unix administrators speak shell language like their own native tongues.


    # Using Redirection and Pipes


    Redirection and pipes facilitate the flow of information. A pipe is exactly what
    it sounds like: It directs the output of one program to the input of another'
