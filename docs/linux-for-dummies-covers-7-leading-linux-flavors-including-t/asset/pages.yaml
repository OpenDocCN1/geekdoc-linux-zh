  md: '# # Introduction


    Welcome to the fascinating world of open source software that is Linux. In this
    book, I introduce you to the wonders of the Linux operating system, originally
    created as a labor of love by Linus Torvalds in the early 1990s. My goal is to
    initiate you into the rapidly growing rules of Linux users and enthusiasts by
    rewriting the rules for the operating system marketplace.


    If you''ve contemplated switching to Linux but find the prospect too forbidding,
    you can relax. If you can boil water or set your alarm clock, you, too, can become
    a Linux user. (No kidding!)


    When this book appeared in its first edition, Linux was an emerging phenomenon
    was neither well known nor understood. In this edition—for a new generation of
    Linux users—so much material is available that I have steered this particular
    title toward Linux and is how you can make the best of it on your desktop. To
    that end, these pages contain various online resources, tips, and tricks, as well
    as more general instruction. If you''re looking for material on servers, Linux
    All-in-One Desk Reference For Dummies (Wiley Publishing, Inc.) can serve your
    needs.


    I keep the amount of technobabble to a minimum and stick with plain English as
    much as possible. Besides plain talk about Linux installation, boot-up, configuration,
    and software, I include many examples, plus lots of detailed instructions to help
    you set up and use your own Linux machine with a minimum of stress or confusion.


    I also include with this book a handy DVD-ROM that contains Fedora 5 and Knopix,
    along with the CD-ROM images (the files you can use to burn your own CDs) for
    Linspin, Mandriva, SuSE, and Xandros.(To find out what exactly is included on
    the DVD-ROM, see Appendix B). Ubuntu is also covered, but there wasn''t enough
    room on the DVD for it so instructions are included in Chapter 4 on how to download
    this distribution yourself. If you have no idea of what I''m talking about, don''t
    worry. You''ll know soon enough!


    # # About This Book


    Think of this book as a friendly, approachable guide to tackling terminology and
    the Linux collection of tools, utilities, and widgets. Although Linux isn''t terribly
    hard to figure out, it does pack a boatload of details, parameters, and administratrivia
    (administrative trivia, in Unixspeak). You need to wrestle these into shape while
    you install, configure, manage, and troubleshoot a'
