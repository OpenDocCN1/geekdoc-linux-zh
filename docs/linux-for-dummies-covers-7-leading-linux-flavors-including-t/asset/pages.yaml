    Note that you have multiple options here. You can choose Free Space Before to
    resize the partition and leave the specified amount of empty space in front of
    it, New Space to specify an exact new size for the partition, or Free Space After
    to resize the partition such that there is the specified amount of empty space
    after it. If you have smaller pieces of blank space scattered throughout your
    drive you can start by absorbing them into the other partitions. By so changing
    the Free Space Before or After entry for each partition to zero, squeezing things
    more efficiently (by moving all your free space to the end of the drive). This
    concept is perhaps better illustrated with an image, see Figure 2-10.


    8. Click OK to save the changes for that partition.

    Your drive isn''t permanently changed just yet.


    9. Return to Step 5 if you have more partitions you want to change.

    Otherwise, proceed to Step 10.


    10. Choose File...Commit to put the changes into effect.

    Now is when your hard drive is actually changed!'
