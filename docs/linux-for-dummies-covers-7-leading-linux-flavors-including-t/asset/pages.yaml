    # Removing Linux from Your System


    Although I''d hate to see you exit the Linux universe, I''d also hate to see you
    get trapped in Linux if you don''t want to use it! How to most easily get rid
    of Linux depends on what you want to do:


    +   - If you want to replace Linux with Windows, just install Windows on the machine.
    It will overwrite all of Linux, including the boot menu.


    +   - If you want to remove Linux from a dual-boot setup, boot into Windows, access
    a command prompt, and type fdisk /mbr. This action removes the Linux boot loader.
    It doesn''t erase Linux, but you can then format the Linux drive(s) or partition(s)
    for Windows.


    Windows XP and Xandros users have a special command they can use to remove this
    distribution. Boot your machine by placing your Windows XP CD-ROM into the Recovery
    Console. Change to the Windows directory, type fixmbr at the command prompt, and
    (oh yeah) press Enter.


