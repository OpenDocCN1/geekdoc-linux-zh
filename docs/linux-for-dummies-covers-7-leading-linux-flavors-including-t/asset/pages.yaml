  md: '# Chapter 11: Checking Out the Linux Filesystem 213


    | Table 11-4 Common Drive Designations |

    | Designation | Description |

    | /dev/cdrom | CD-ROM drive; if you have more than one, then you may have /dev/cdrom1
    and so on, and you also may see /dev/cdwriter, /dev/dvd, or even a hard drive
    designation such as /dev/hda |

    | /dev/fd0 | Floppy drive 1 |

    | /dev/fd1 | Floppy drive 2 |

    | /dev/hda | First IDE hard drive |

    | /dev/hda1 | First IDE hard drive, first primary or extended partition |

    | /dev/hda2 | First IDE hard drive, second primary or extended partition |

    | /dev/hdb | Second IDE hard drive |

    | /dev/hdb1 | Second IDE hard drive, first primary or extended partition |

    | /dev/hdb2 | Second IDE hard drive, second primary or extended partition |

    | /dev/sda | First SCSI hard drive |

    | /dev/sda1 | First SCSI hard drive, first primary or extended partition, and
    often also a small USB drive like a thumbnail/keyring storage device |


    You probably see a pattern by now. A hard drive has a three-letter designation:


    +   - An IDE drive''s designation starts with /dev/hd*, the first drive of this
    type is a, the second is b, and so on. The third IDE drive looks like this: /dev/hdc.
    If you''re using something like a Promise controller that bypasses the IDE controllers
    (I know, this is technical stuff), then your first IDE hard drive will, in fact,
    show up as /dev/hde. I know this from personal experience!

    - A SCSI drive''s designation starts with /dev/sd*, the first drive of this type
    is also a, the second is b, and so on. The fourth SCSI drive looks like this:
    /dev/sld. USB drives are also seen as SCSI devices. A little item like a USB keychain
    is often seen as /dev/sda1 by your system if you don''t have any SCSI drives attached.'
