  md: '# How This Book Is Organized


    This book contains six major parts, arranged in an order to take you from Linux
    installation and configuration through keeping a Linux desktop up and running,
    if not putting a cat in the sun! Most parts contain three or more chapters or
    appendices, and each chapter contains modular sections. Whenever you need help
    or information, pick up this book and start anywhere you like, or use the Table
    of Contents and locate specific topics or keywords.


    Following is a breakdown of the book''s six parts and what you find in each one.


    # Part 1: Getting Your Feet Wet


    This part sets the stage and includes an overview and introduction to the terms,
    techniques, and software components that make Linux the raging software tiger
    that''s ready, willing, and able to do this thing. To be a little more specific,
    I start out with a Linux overview that explains Linux is, where it came from,
    and how it works. Next, I tackle the various tasks and activities involved in
    preparing for installing Linux on a PC. If you''re not a diehard Fedora fan, I
    also cover what''s involved in installing Linux, Mandriva, SUSE, Ubuntu, and Xandros,
    but in a little detail (or this book would be the size of a set of encyclopedias).
    After that, I tell you how to give Linux the boot — not to rid of it any means,
    but rather, to fire your brand-new system to reach the heights of computing ecstasy
    (at least, it''s good for you as it is for me). Finally, I help you explore standard
    Linux tools and interfaces, work with accounts, and get the skinny on various
    aspects of distribution-related Linux tools.


    If you don''t want to install but do to try Linux, I also give you the option
    of using what''s called a LiveCD, or bootable distribution. Knoppix is most popular
    of these, so it''s covered here as well.


    # Part 11: Internet Now!


    In this part, you explore the issues involved in connecting a Linux system to
    the Internet, including configuring a modem, managing a dial connection to an
    Internet Service Provider (or ISP), and configuring the various Internet protocols
    involved to make your internet connection work. You also go through the details
    involved in configuring and using a Web browser and setting up using an e-mail
    client.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Part III: Getting Up to Speed with Linux


    Linux includes a great many facilities and capabilities, so after you get past
    the installation and configuration, you probably want to use your system to do
    something. Here''s where the doing begins! In this part of the book, you can read
    about the Linux file system and how to work with files, directories, and related
    access rights — called permissions in Linux. You discover how to move in, out,
    and around GNOME and KDE, the two major graphical interfaces (GUIs) in Linux.
    In addition, I include an in-depth exploration of the Linux command-prompt environments,
    also known as shells. Part III also contains important security information, along
    with how to add software to your system and keep it updated.


    # Part IV: Getting Things Done


    In this part of the book, you discover how to use a variety of software available
    in Linux. Everything from plain text editors to full office suites is addressed,
    as well as whiz-bang multimedia media tools and Microsoft Windows-based file formats
    and media. Even better, did you know that you can run many Windows programs under
    Linux? I show you how you in this part.


    # Part V: The Part of Tens


    In this book''s grand climax, I sum up and distill the essence of what you now
    know about Linux and its inner workings. Here, you have a chance to revisit some
    key troubleshooting tips and tricks for Linux systems, along with learning two
    cool uses for Knoppix.


    # Part VI: Appendices


    This book ends with a set of appendices designed to sum up and further expand
    on this book''s contents. Appendix A delivers groups of Linux commands, complete
    with syntax and explanations, arranged according to their function. Appendix B
    lists details about what''s on the Linux For Dummies, 7th Edition, DVD. As I note
    in this appendix, the materials on the DVD include the Fedora Core 5 distribution.'
  merge: -1
