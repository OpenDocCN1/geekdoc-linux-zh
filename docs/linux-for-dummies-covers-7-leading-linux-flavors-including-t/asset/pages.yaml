  md: '# Chapter 5: Booting and Stopping Linux 99


    If you''re used to Windows 98, you need to recondition yourself: Don''t just shut
    off the power when you''re finished. For one thing, many Linux users leave their
    computers when they''re not using them — they just log out of their accounts so
    no one can mess with their stuff — and (oh yeah) shut off the monitor because
    monitors draw a lot of power.


    When you decide to turn off your Linux machine, whatever reason, you must shut
    down the computer in an orderly manner. You can use one of these methods to shut
    down Linux properly:


    +   - If you''re in the GUI, log out of your account using the main menu''s Log
    Out option — Fedora cores will find it System:Shut Down — and then click the dialog
    box option that says (strangely enough) Shut Down.


    +   - If you have a command prompt open, type the halt command at the shell prompt
    (#) followed by the root password; when you press Enter, Linux shuts itself down
    and tells you it''s all right to turn off the machine.


    +   - If you have a command prompt open, type the reboot command; when you press
    Enter, Linux goes through the motions of shutting off down, and immediately reboots
    the machine.


    +   - If you have a command prompt open, typing shutdown -f now (and then pressing
    Enter) is the most traditionally accepted method. the shutdown command allows
    you to send messages to users and determine how long the shutdown takes place.
    Another method is to use the poweroff command, which is just an alias to the previously
    mentioned halt command.


    If you accidentally cut the power to your Linux box, take heart; all is not lost.
    More often then, you can reboot your computer and pick up where you left off.
    However, you may have to pay for your error by waiting during a filesystem check
    while the machine makes sure nothing was damaged. This process is similar to the
    one Windows uses when somebody powers off incorrectly: The operating system may
    need to scan its hard drives to make sure everything is okay.


    > If you plagued with brief power outages or spikes that cause your computer to
    reboot, looking into a UPS (Uninterruptible Power Supply) for your computer. These
    heavy, rechargeable batteries are designed not only to protect your computer from
    damage (read the box to see what features a particular UPS offers) but also to
    provide an extra five minutes or more of power so you have a chance to close your
    files properly and shut down your machine when the power goes out. Better yet,
    for those really spikes, the only


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_120_0.png)'
