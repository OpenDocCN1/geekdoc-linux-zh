  md: '# Chapter 17: Word Processing and More with OpenOffice.org 335


    5. Continue adding components to the formula until you''re finished.


    Suppose that you want to multiply the matrix by 3. To find out, press Enter to
    go down to the next line in the Commands window (to use as "scratch paper\ right-click
    to display the pop-up menu, and choose Unary/Binary Operators<?a Times b. This
    choice adds the phrase <??> times <??> beneath the matrix code. Now you know how
    to format a multiplication, so erase this phrase and use it as a guideline to
    change your formula to:


    ```

    3 times matrix(A # B ## C # D)

    ```


    The result line gives shown in Figure 17-12. I could go on, but I hope by now
    that you are eager to start with your explorations!


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_356_0.png)


    Figure 17-12: A complete formula in OpenOffice.org Math.


    OpenOffice.org Math supports (among others) its own OpenDocument format (.ODF),
    the equivalent StarOffice format (.SXM) and MathML 1.01 (.MML), which is not a
    program. MathML is a standard, similar to HTML for working on the Web, and 1.01
    is a specific version of this standard. For this particular version of MathML,
    see www.w3.org/TR/REC-MathML. The main standard page is available at www.w3.org/Math/.
    If you need to add formulas to Web pages, this site can be quite an interesting
    read!'
