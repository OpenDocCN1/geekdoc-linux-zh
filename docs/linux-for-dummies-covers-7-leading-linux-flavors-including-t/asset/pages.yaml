  md: '# Chapter 11: Checking Out the Linux Filesystem 207


    3. Type fdisk -l to see all your hard drives and partitions.


    If you''re looking for a Windows partition, you can find it right here. Ignore
    the items that have text similar to Windows 95 Ext; they''re not really a data
    partition. Anything that has NTFS or FAT32 or VFAT is a Windows partition and
    is what you''re interested in. If you''re looking for a Linux partition (maybe
    you have more than one distribution installed on your system), then you want the
    ones that have the word Linux in their description and not the word swap.


    4. If you need to access an NTFS partition, check Chapter 12 for how to add NTFS
    support for your distribution (and how to check to see if it''s installed).


    5. When you know what partition you want to try, type mount -t type /dev/partition
    /mnt to add to your filesystem, where type is the filesystem type, as shown in
    Table 11-3, and partition is the letter and number combination you use in fdisk
    (such as hde2).


    So, for example, after adding NTFS support, you might type mount -t ntfs /dev/hde2
    /mnt. When you do so, you can find all of that partition''s contents under the
    /mnt directory.


    | Table 11-3 | Common Filesystem Types |

    | Type | Description |

    | ext2 | "Older" Linux filesystem type |

    | ext3 | "Newer" Linux filesystem type, used by default in Fedora and Red Hat,
    among others |

    | ntfs | "Newer" Windows filesystem type, started with Windows NT and commonly
    used in Windows XP |

    | reiserfs | Another "newer" Linux filesystem type, used by default in Mandrake
    and SuSE, among others |

    | vfat | "Older" Windows filesystem type, such as FAT32 and MS-DOS |


    6. Browse as you need to.


    You may find that you have read-only access to your NTFS partition and can''t
    change anything on it.


    7. When you''re finished, type umount /mnt to remove the partition''s contents
    from your filesystem.


    The preceding steps work for all distributions.


