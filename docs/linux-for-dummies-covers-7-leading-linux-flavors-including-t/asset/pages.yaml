  md: '# 256 Part III: Getting Up Speed with Linux


    Some people tell you to use the telnet program to do this, but I beg you not to.
    Do not open the Telnet port in the security tool and not use the telnet program.
    It sends information across the Internet in nice, raw text that anyone can snoop
    through.


    First, you need to make sure that you have SSH installed, that you have an SSH
    server running, and that you enable SSH in your firewall. (See the section "Controlling
    and adjusting your firewall," earlier in this chapter, to handle the third concern).
    Some of the distributions already have the software in place for the first two
    users. Others do not by default. Only those distributions that do not provide
    one or the other function automatically are discussed here:


    +   - Knoppix: From the Main Menu, choose KnoppixServices-Start SSH Server to
    allow people to SSH into this machine.


    +   - Linspire: You can SSH out of this machine but there is no server to SSH
    into it.


    +   - Mandriva: Use the software installer (see Chapter 12) to add the openssh-server
    program. Then, use the services control interface (see the section "Controlling
    your services," earlier in this chapter) to activate ssh.


    +   - Xandros: Do the following to allow people to SSH into this machine:

    1. Choose Control Center-System Administration-Services.

    2. Click the Administrator button and enter your root (administrator) password.

    3. Select ssh in the list.

    4. Click Properties.

    5. In Start Mode, select System Startup.

    6. Click OK.

    7. If in the Status column, the ssh row doesn''t say Running, click Start to start
    the server.

    8. Choose File-Quit.


    +   - Ubuntu: Allows you to SSH out there but there is no software to SSH in.


