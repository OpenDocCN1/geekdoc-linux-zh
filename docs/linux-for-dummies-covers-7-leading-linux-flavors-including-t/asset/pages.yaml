  md: '# Keeping an Eye on Your Log Files with the System Log Viewer


    One other security issue you may want to consider log files. Your network programs,
    kernel, and other programs all contain records of what has been happening on your
    system. You may be amazed at just how much information gets into them! They''re
    mostly in /var/log; take a look sometime.


    Fortunately, tools are available that can help you sift through the wheat for
    the chaff of gags and intruders.


    To find your distribution''s System Logs viewer:


    +   * Fedora: Choose System>Administration>System Log (see Figure 13-6). You may
    have to manually open logs to view, which you can do by selecting File>Open, selecting
    the file contents you want to view, and then clicking Open.

    * Knopix: None.

    * Linux: From the CNR Warehouse (see Chapter 12), choose System Utilities>XWatch.


