  md: '# Choosing a partitioning tool


    Perhaps the easiest way to adjust your existing partitions is through the use

    of a commercial program such as Partition Magic. Partition Magic enables

    y to view the partition information for your hard drive(s). You can also use this

    utility to resize, move, and add partitions. If all you want is to resize,

    however, you don''t have to go out and buy software just to get done.

    Instead, you can download a free tool to do the job for you (see the next sec-

    tion how to do so).


    No tool is perfect. Before going any further, make a backup of anything

    You don''t want to lose off your Windows installation! Things can go wrong during

    the various steps of partitioning, even when using Windows tools on Windows.


    If you create an open partition by using Partition Magic (after resizing

    Windows partition), make a note of which drive and partition it is (first,

    second, and so on). You''ll need this information when you''re telling the

    installer where to put Linux.


    # Getting and resizing partitions

    with qtparted


    A free resizing program you can use is called qtparted. This utility can

    work with VFAT and NTFS partitions, so it can handle both of the file

    systems you may have used when you set up your machine in Windows. The

    program comes with Knoppix, which is a Live CD — another is bootable

    distribution — meaning that you can put this into your CD-ROM drive, boot

    y computer with, and it brings you into a full version of Linux that

    you don''t have to install. Knoppix is handy for showing Linux, but more

    important (for my purposes), it''s useful for rescuing machines that can''t boot

    resize partitions.


    Knoppix comes on the DVD included with this book, which is pretty handy.

    If you can''t use the DVD for whatever reason, see Chapter 4 for how to get

    Knoppix on CD. Before proceeding, double-check that you have backed up all

    y important data before you proceed. Then, pull out any notes you may

    have made in the sectionPreparing to Use Linux and Microsoft Windows

    Together" in this chapter — specifically, which partition(s) you want

    to change — and then do the following:


    +   Put your Knoppix CD or DVD, or the DVD that came with this book,

    into the CD- or DVD-ROM drive and reboot your computer.


    If you''re using the book''s DVD, a menu appears, asking whether you\want to use
    Fedora or Knoppix. Select Knoppix, and you''re taken to the

    Linux welcome screen. If you''re using a plain Knoppix CD or DVD,

    your computer boots directly to the Knoppix welcome


