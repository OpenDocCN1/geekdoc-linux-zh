  md: "# 398 Part VI: Appendixes\n\nAs long as your PC is configured to boot from\
    \ the DVD-ROM, this step starts the Linux installation process for you automatically.\n\
    n3. To install Fedora type linux and press Enter, or boot into Knoppix without\
    \ having to install anything, just press Enter.\n\nCongratulations! The Linux\
    \ installation process is now underway. For the rest of the gory details on this\
    \ fascinating task, please consult Chapter 3. If you had to order the CD-ROMs,\
    \ then boot with the first CD for the same effect as booting with the DVD.\n\n\
    And some people say installing Linux is hard! What could be easier than this?\
    \ If all you want to do is investigate the contents of the Linux installation\
    \ DVD-ROM, simply insert it into your machine's DVD drive. After that, you can\
    \ browse through the DVD-ROM's contents right in Windows. The contents are described\
    \ in the following section.\n\n# What You Find in Fedora Core 5\n\nHere's a summary\
    \ of the software on the DVD-ROM, arranged by directory organization. If you use\
    \ Windows, the DVD-ROM interface helps you navigate the DVD-ROM easily; you can\
    \ use most of its contents only if you already installed Linux.\n\nThe contents\
    \ of the DVD consist of all four installation CD-ROMs' worth of material for Fedora\
    \ Core 5, plus the ISO files discussed earlier in this chapter. Not all the software\
    \ is installed automatically. You find out in Chapters 3 and 12 how to customize\
    \ what's added. Aside from that, the DVD has useful install utilities and a handy-dandy\
    \ README file that explains precisely what you find. The directory structure may\
    \ look similar to the following (except for lacking my handy annotations, of course):\n\
    \n```\n/media/cdrom\n  -- Fedora               binary packages, incl:\n      --->\
    \ RPMS                    OS, GUIs, Apache, etc.\n      ---> base            \
    \        info on release 5\n                                 used by install process\n\
    \  ---> images                  boot & driver disk\n  ---> isolinux          \
    \      boot files\n      ---> repodata               software repository\n   \
    \   information                 used for the install\n  ---> README          \
    \         general read me file\n      RELEASE-NOTES               current info\
    \ about this\n                               release\n                       \
    \          release\n  ---> RPM-GPG-KEY             GPG sigs for Red Hat pkgs\n\
    ```"
