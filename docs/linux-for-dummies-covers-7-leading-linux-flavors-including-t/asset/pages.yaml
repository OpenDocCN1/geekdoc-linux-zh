  md: '# 356 Part IV: Getting Things Done


    The section "Listening to Internet Radio" earlier in this chapter mentioned some
    additional tools you may want. Typically, it’s a good idea to have as many of
    these installed as you can manage, in case one works better with a particular
    file than another. Also, there is mplayer, which I recommend along along with
    its associated plugin for watching content from your hard drive. I will spend
    a moment getting you acquainted with mplayer (see Chapter 12 for how to install
    it).


    When you launch Mplayer, the tool shown in Figure 18-12 appears.


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_377_0.png)


    Figure 18-12: The Mplayer media player.


    The player may load automatically when you double-click the file or insert the
    media you want to watch, or it may not. If it doesn’t load automatically, right-click
    the main window and select Open. Within, select Play File to play a file on your
    hard drive, navigate to the file you want to play in the file browser, and then
    click OK. The controls on the “media player panel” work as you might expect as
    far as stop, pause, play, and so on go.


    Enjoy!'
