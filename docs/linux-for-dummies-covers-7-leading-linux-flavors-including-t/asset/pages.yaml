  md: '# Step 4: Control is handed over to init


    After the kernel''s finished loading, it passes off the system initialization
    process to a program named init. The init program is responsible for starting
    all services and programs. You can see these processes starting as you scroll
    up the screen with [OK] or [FAILED] on the right side of the monitor. If you see
    these lines, you know that your kernel has finished loading.


    The main problems you may encounter with init are services (programs that run
    in the background) that fail to start properly, as indicated by the [FAILED] status
    during the boot process. Services usually fail because of misconfigurations or
    unsupported hardware drivers. Sometimes a problematic service takes a long time
    to start up, so you may need some patience while you wait it out.


    With many of these services, failure to start can keep you from logging in and
    using your system. After the machine boots, you can use the techniques described
    in Chapter 13 to shut off a problematic service if it''s being a pain. If the
    machine can''t boot because of this service, you''ll need to access your distribution''s
    rescue mode to shut off the service — and rescue mode is covered in the next section.


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_117_0.png)


    # Entering Rescue Mode


    Heavy-duty system repair tends to happen in rescue mode — a special boot selection
    that simulates your hard disk by setting up what is called a RAM disk, holding
    the files entirely in memory. The benefit of this option is that you can perform
    necessary system surgery even if your installed system is hopelessly broken. The
    drawback is that this is a purely command-line interface — you really have to
    know your stuff to find your way around.


    Appendix A contains a list of Linux commands to try and fix you out. Chapter 20
    addresses, other things, how to fix your boot loaders from here (if your problem
    is with the boot loader), and how to track down the error messages your kernel
    might have left behind. You may also be able to find helpful tips by reviewing
    your distribution''s documentation and online help forums.


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_117_1.png)


    Knoppix is quite popular for system rescues because it''s a whole distribution
    on a CD or DVD. (For more on Knoppix and live CDs and DVDs, see Chapter 4.) See
    Chapter 21 for two ways you can use Knoppix for system repairs.'
