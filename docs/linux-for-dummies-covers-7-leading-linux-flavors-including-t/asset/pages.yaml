    the main menu, your screen saver appears or fades to black. If anyone moves the
    mouse or uses your keyboard, a dialog box appears with your login name in it and
    a password field. You can get back to work by entering your password. Until then,
    you''re safe in knowing that no one can mouse over your computer and send a joke
    e-mail to your boss pretending to be you. Note that if you''re logged in as the
    root user, the Lock Screen option doesn''t work.'
