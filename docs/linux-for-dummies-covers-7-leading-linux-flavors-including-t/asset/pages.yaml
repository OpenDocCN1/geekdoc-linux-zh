    # Installing and Using Wine


    And there''s Wine (www.winehq.org), a complete rebuild of Microsoft Windows functionality
    that runs under Linux. Wine is in many ways the mother of everything in the previous
    section. However, because it''s a free and very complicated project, it''s not
    quite as friendly as the commercial versions. It''s kind of like the others but
    with all the makeup and hairspray removed.'
