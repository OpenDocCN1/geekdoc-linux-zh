    Fedora''s filesystem navigation is all handled through Nautilus (see Chapter 10)
    if you''re using your GNOME default. Some things are made easy for you by default:


    +   * When you insert a data CD-ROM or DVD-ROM, an icon appears along the left
    side of your desktop. Double-click this icon to open the item''s contents. You
    can later remove it from the system by right-clicking the icon and choosing Remove
