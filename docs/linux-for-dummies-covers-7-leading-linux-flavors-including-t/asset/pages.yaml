    # Partitions Versus Directories


    One very important (and geeky) thing to understand about the Linux filesystem
    is that it may not all be on one single hard drive or hard partition, and yet
    you don''t have to keep track of what drive or partition it''s like you do in
    other operating systems. In the Microsoft world, if you separate hard drives or
    partitions, you have a specific letter designation for each one. The primary hard
    drive is C, the next D, and so on. Under Linux, each of these drives and partitions
    quietly blends together.


    If you partitioned your hard drives on your own, you know that you needed to specify
    a mount point for each partition — which is like an empty spot in a puzzle, where
    the outside partition or media can be plugged into the root of the filesystem.
    In the case of a hard partition that''s part of your filesystem and added at boot,
    the mount point isn''t in /mnt /media part of the filesystem. It''s an item in
    the root directory — maybe /boot or /usr — or anywhere else in your directory
    hierarchy (like /usr/share). Later, when you''re working on the computer, you
    don''t need to know or care whether the directories or files are all on one drive
    or on multiple devices. You just do your thing.


    The times you need to know how Linux sees the hardware are when you''re trying
    to add new hard drives, install the machine while not automatic partitioning,
    or access temporary media. Table 11-4 lists common popular designations. Note
    that these designations are in /mnt or /media; they''re in /dev. They''re the
    actual driver shortcuts — which point to the real drivers. These names are typically
    used for convenience so that you don''t have to remember exactly which driver
    to deal with.'
