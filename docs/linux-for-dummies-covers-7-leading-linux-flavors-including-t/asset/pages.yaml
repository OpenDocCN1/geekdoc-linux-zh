    nools to help you recover when you forget your root password is.

    This problem is another reason that many system administrators keep\Knoppix on
    hand. To recover your root password, do the following:


    +   1. Place the Knoppix CD in your CD-ROM drive and reboot the com-\puter. The
    computer successfully boots into Knoppix, determine

    which partition refers to your main Linux installation. If you currently

    don''t have a file browser window open anywhere within that parti-

    see Chapter 11 for discussions of partitions), click the partition

    icon to open the browser.


    You''re looking for your root (/) partition. Chapter 11 details what you

    find if that helps. Basically, open each of the partition icons on

    your desktop and figure out which one looks like the right section of

    y filesystem. For example, if the root partition is /dev/hda3, click

    t Hard Disk Partition [sda3] icon.


    +   2. Click the Terminal Program icon on your panel and then type su - to

    access the root user''s account. Make sure to close the file browser

    window that is accessing your root partition, and then type mount-

    ount rw /dev/partition rw to remove the partition and read

    it as full read-write filesystem


    You''re not prompted for a password when switching to root. For an

    example of what to type, if your root partition was /dev/hda3, you

