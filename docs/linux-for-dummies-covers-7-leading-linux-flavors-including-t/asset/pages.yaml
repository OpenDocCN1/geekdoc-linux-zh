  md: '# 146 Part II: Internet Now!


    After you click Forward, the tool probes for your modem. If your modem can''t
    be found (again, I follow through the most difficult option), the Select Modem
    dialog box appears, as shown in Figure 8-3. I assume that you''re staring at this
