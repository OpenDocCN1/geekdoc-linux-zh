    # Controlling and adjusting your firewall


    Even better (but just essential) than turning unnecessary services is to make
    sure that you have a firewall in place. A firewall is like putting a bunker under
    your house. It would have openings that only fit people wanting certain kinds
    of things. Friends could fit in one door, family another, and package deliveries
    to another.


    In computer networks, each of the services discussed earlier always comes through
    the same door (port, in computer-world lingo). You use firewalls to prevent anyone
    from being able to so much as a touch, or port, unless you''ve explicitly set
    it up that they can do so. This technique is especially important if you''re on
    a cable network (see Chapter 8), where there''s always'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# 254 Part III: Getting Up to Speed with Linux


    some reactive jerk out there using his computer to knock on every other computer
    on the network''s doors to see where it can get in.


    You probably already did some basic setup during installation. If you ever want
    to make changes, do the following (you may be asked to enter your root password
    along the way):


    +   - Fedora: Choose System-Administration-Security Level and Firewall (see Figure
    13-2).


    +   - Knoppix: From the Main Menu, choose Knoppix-Services-Knoppix Firewall.


    +   - Linux:: Click CNR on the desktop or panel as discussed in Chapter 12. When
