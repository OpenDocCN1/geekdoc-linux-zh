    there aren''t tons of nasty people and programs trying to break into your computer,
    but I can''t; unfortunately, there''s a horde of them. A firewall is your first
    (but not only) protective barrier against cyber-hoodlums, viruses, worms, and
    a host of other items that might try to skulk through doors that should have been
    kept closed; see the sidebar "Firewalls and you" for more information.


    +   3. Unless you are 100 percent sure that this computer is safe from both the
    Internet and other machines you may have on your home or office network, leave
    Enabled as your firewall setting.


    It''s worth keeping in mind that before viruses and worms, most business computer
