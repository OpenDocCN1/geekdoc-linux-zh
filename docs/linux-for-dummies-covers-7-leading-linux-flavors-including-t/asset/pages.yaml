    set up your firewall and is installed on Launch Programs-Utilities.


    +   - Mandriva: From the Main Menu, choose System-Configuration-Configure Your
    Computer-Security-Set Up A Personal Firewall In To Protect The Computer And The
    Network.


    +   - SUSE: Choose Launch-Applications-System-Security and Users-Firewall.


    +   - Xandros: Choose Launch-Applications-Internet-Firewall Wizard. The same menu
    is the Firewall control.


    +   - Ubuntu: There is no firewall control tool installed by default. Instead,
