  md: '# 266 Part: Getting Up to Speed with Linux


    Shells come equipped to perform certain functions. Most of these features have
    evolved over time to assist the command-line jockey with myriad tasks. Although
    I only scratch the surface here, you''re encouraged to read the man page for bash
    because it''s likely one of the more complete and readable pages in existence.
    You can read all about how to use man pages (the online Help system in Linux)
    in the "Help!" section, later in this chapter.


    # Playing the Shell Game


    You need a way to tell the computer what you want it to do. In Linux, one of the
    ways to communicate with the computer is through something called the shell. A
    shell isn''t a graphical thing; it''s the sum total of the commands and syntax
    you have available to you to do work.


    The shell environment is rather dull and boring by graphical desktop standards.
    When you start it, all you see is a short prompt, as a $, followed by a blinking
    cursor awaiting your keyboard entry. (Later in this section, I show you a couple
    of methods for accessing the shell.)


    The default shell used in Linux is the bash shell. This work environment is based
    on the original Unix shell, which is called the Bourne shell and is also referred
    to sh. The term bash stands for the Bourne again shell. The bash shell comes with
    most Linux distributions.


    If you installed your Linux distribution to log in a graphical desktop, such as
    GNOME or the KDE environment, you''re likely not looking at a shell prompt. Rather,
    you interact with your computer via a mouse. You can start a bash session:


