  md: '# Recognizing some special features of Linspire


    One of the most-talked-about special features of Linspire is its CNR (Click and
    Run) Warehouse. This online store allows you to surf through more than a thousand
    software programs and purchase, download, and install them with just a few clicks.
    Even better, if you subscribe to the CNR service, a lot of the items in the Warehouse
    are free. (No need to keep your membership up to date if you want to keep using
    the software downloaded; after you''ve got it it''s yours.) I cover how to add
    software by using this service in Chapter 11.


    Another cool aspect of some versions of Linspire is your audio/video tutorials.
    After your installation is complete, the tutorials launch immediately and start
    walking you through how to use the system. You can stop them and come back to
    them at any time.


    # About the various Linspire versions


    The folks at Linspire are pretty creative about putting together packaging options.
    In the section "Living Large with Linspire" (earlier in this chapter), I address
    various ways you can purchase this distribution. In this section, I look at the
    various ways Linspire is packaged for boxed sets and downloads. I''m not going
    to go into all the add-ons. (If I did that for every distribution, this book would
    end up an encyclopedia!) Instead, I look at the main versions available at the
    time of this writing:


    +   - Linspire Five-O: The main Linspire product. This version has lots of softeware
    included, along with support.

    - Linspire Five-O CNR: This version is the same as the previous one, except it
    comes with a year''s subscription to CNR (see Chapter 12) already bundled in —
    and offers additional support.


    Both versions of Linspire can be booted into a live version of actually installing
    the system. See the section "Using LiveCDs and LiveDVDs," later in this chapter,
    to find out about live distributions


    # Maxin'' Out of the Fun with Mandriva


    Mandriva (www.mandrivinux.com) — formerly Mandrake — has a huge, enthusiastic
    fan base. This distribution, designed in 1998 with the goal of creating an easy
    and intuitive installation for everyone, specializes in ease of use — for both
    server and home/office installations. To accomplish this objective, the creators
    of Mandriva focused on making an easy transition so you can move your Microsoft
    Windows or Mac skills to Linux.'
