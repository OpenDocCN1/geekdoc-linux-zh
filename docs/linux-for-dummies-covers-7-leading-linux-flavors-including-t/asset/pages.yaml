  md: '# # Chapter 15


    # # Gettin'' Gooey with the GUIs


    **In This Chapter**


    +   - Adding applets to the panel

    - Adding programs to the desktop

    - Downloading and setting up themes

    - Configuring the X Window System


    The X Window System (or X) opens a world of possibilities. X is, in general, a
    set of applications that work together to provide a graphical interface. Think
    of these applications as the wireframe beneath your GUI, with GNOME and KDE (see
    Chapter 6) offering the pretty paper mâché coating. Some of these applications
    windows, some manage the look and feel, and others handle aspects of the graphical
    world for you. All of them are configurable and even irreplaceable, which is enough
    to make the average user''s eyes cross with too many options!


    GNOME and KDE are entirely creatures of convenience, offering integrated sets
    of window dressing so that you don''t have to pick and choose your components.
    In this chapter, you get a chance to alter both KDE and GNOME''s behavior to suit
    your own needs. For example, if you have a hard time reading text in these small
    command-prompt windows in the GUI, you can make both the windows and their fonts
    larger. You can change a wealth of other things, so so on and take a look.


    If something goes terribly wrong in the GUI and you need to exit in a hurry, press
    Ctrl+Alt+Backspace. This key combination does one of two things. if you boot the
    GUI, it collapses your GUI session and takes you to the GUI login prompt. However,
    if you boot to the command line, this combination collapses the GUI immediately,
    taking you to the command line.


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_302_0.png)


    Press Ctrl+Alt+Backspace only in an emergency. This key combination does cleanly
    stop the programs involved. You end up with all kinds of bits and pieces of programs,
    files, and other junk on your system.'
