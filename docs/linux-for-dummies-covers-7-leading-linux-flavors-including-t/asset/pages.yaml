    # Don''t Just Turn Off the Machine!


    Even when you''re not tapping the keyboard or clicking buttons, Linux is still
    running along in the background, doing lots of housekeeping chores. Some of these
    chores may involve swapping cached data to and from the fixed disk — a geeky way
    of saying that it''s actually jotting down things onto your hard drive that before
    had just been making sure to remember in RAM. When you shut off the power out
    of the blue, anything the computer was remembering but hadn''t been written is
    lost (kind of like when you or I fall asleep before making a to-do list for the
    next day).


