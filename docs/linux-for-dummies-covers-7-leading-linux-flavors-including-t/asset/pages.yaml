    # Making the Best of the Command Line


    The Linux command-line interface provides a quick, efficient way of entering commands
    and executing actions. Even if you''re mostly a "GUI person", after you get the
    hang of the command line, you discover that it''s faster to perform some tasks
    at the command line than with a mouse in the GUI environment. However, if you
    prefer to use a GUI interface as your working environment, you can easily open
    a terminal window, which is a command-prompt window, to perform your command-driven
    tasks without having to leave the point-and-click environment (see Chapter 14).


    There are some interesting things that you might find useful using the command-line
    interface. One difference between the Linux command line and other interface command
    lines, such as the Windows MS-DOS prompt, Linux commands are case sensitive. Typing
    LS is, and in, gives you an error because there is an ls but there is no LS command.
    The Linux command line also has an autocompletion feature. If you know the first
    few characters of a command or filename, type part of it and press Tab to complete
    the rest automatically. For example, if you''re trying to use the less to view
    the contents of the file /home/bob/grocery_list, you can type less /home/bob/gro
    and press Tab to try and complete the filename. However, if you also have the
    subdirectory (folder) /home/bob/grocery_projects, you will hear a beep. You can
    press the Tab key again, double-clicking a mouse, to see your output:


    ```

    grocery_list      group_projects

    ```


    The cdol thing here is that the command prompt beneath these items still has the
    text gro so you don''t have to retype it! You can see that typing a c makes it
    clear that you''re referring to grocery and not to group, so you just add a c
    to make less groc and press Tab to finish the'
