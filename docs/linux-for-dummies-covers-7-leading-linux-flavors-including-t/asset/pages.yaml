  md: '# 40 Part I: Getting Your Feet Wet


    To begin the installation from the DVD-ROM or CD-ROM, you must first change your
    system to start, or boot, from a DVD-ROM or CD-ROM. In Chapter 2, I cover how
    to configure a computer to boot from these devices.


    I concentrate on Fedora Core 5 and its installation for two main reasons:


    +   - Fedora Core 5 is included in the DVD with this book, and on the CDs you
    can order with your coupon.


    +   - Covering the installation of every Linux distribution in existence make
    this book into a set of encyclopedias.


    I am assuming that you want to install a desktop. There are plenty of books out
    there that focus on servers, my goal is that Linux for Dummies focus entirely
    on those who want to use Linux as their actual desktop machine. Also, it is not
    possible to cover both desktop and server functions in a book of this to be a
    satisfying depth.


    Please note that you''re installing Red Hat Enterprise Linux, or a different distribution
    of Linux, your screens will look different from what is shown in this book (for
    Linspire, Mandriva, SuSE, Ubuntu, and Xandros, see Chapter 4). Each Linux''s installation
    routine covers the basic tasks, but the specific actions may be presented in a
    different order, or be customized to look different on-screen. For example, one
    distribution may present account creation before network configuration, and another
    may have those topics reversed.


