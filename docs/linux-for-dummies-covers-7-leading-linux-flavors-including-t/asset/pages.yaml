  md: '142 Part II: Internet Now!


    # Selecting an Internet Service Provider (ISP)


    Because of the meteoric rise in the popularity of Linux, many ISPs are training
    their support staff in the ways of Linux. If you already have a dialup service,
    give one of them a call to let them know of your Linux pursuits. Chances are,
    that person already has information pertinent to Linux subscribers and can provide
    you with that information. If you''re shopping for a new ISP, this section offers
    some practical selection advice.


    Some ISPs provide their own proprietary software that you must install on your
    PC to connect to the Internet. The software they provide is likely to run on Windows.
    Several free dialup services do not work with Linux because of this fact. The
    proprietary software medgles with the operating system to ensure that banner advertising
    isn''t hidden or that you stay dialed in for only a specified duration.


    If you''re shopping around for an ISP, consider these questions:


    +   - Can you get local dialup numbers across the country and around the world?
    If you travel often and need Internet access from different cities, this service
    is a handy money (and headache) saver

    - Does it provide technical support for Linux? If you''re planning on running
    Linux, this consideration is an important one. However, it doesn''t have to be
    a deal breaker.

    - Can you get a recommendation? Ask a friend. An ISP''s best friend is an endorsement
    from a satisfied customer.

    - Will you have dialing in? Although a subscriber-to-line ratio of 7-to-1 (an
    average of seven or fewer subscribers per line) or better isn''t an entirely accurate
    measure of how often you''ll get busy signals, it is probably the easiest measure
    for consumers. This is primarily a concern for dialup users.


    # Getting Information You Need from Your ISP


    Most reputable ISPs provide you with a customer information sheet after you sign
    up for its services. This sheet should include the following information at the
    minimum:


    +   - Local telephone dial-in numbers for modem users

    - User login name'
