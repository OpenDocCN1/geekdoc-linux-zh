    menu for one of the applications on the panel. Try right-clicking elsewhere on
    the panel or closing some programs so that you can free up space amongst the minimized
    programs in the middle of your panel.


    +   2. Browse the available applets.


    +   3. After you select the applet you want to add to your panel, click Add. The
    applet is now on your panel.'
