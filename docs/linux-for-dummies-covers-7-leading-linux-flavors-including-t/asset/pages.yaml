  md: '# Chapter 4: Installing Other Linux Distributions


    # # Starting Off with SuSE


    The SuSE ("SOO-za," www.suse.com) company and Linux distribution were founded
    in 1992 and were purchased by Novell (www.novell.com) in 2004. The distribution
    is named after a German acronym for Software undentwicklung (Software and System
    Development). One SuSE claim to fame is its international support. Most major
    distributions provide some level of support for users around the globe, but some
    are better at language integration for particular than others; SuSE — understandably
    — excels in the German and western European space.


