    arrows, shapes, and more for your presentation creation needs. Most of these buttons
    have downward-pointing arrows, which allow you to see the full range of features
    they offer.


    # Fine Art with OpenOffice.Org Draw


    Whether you''re an aspiring graphic artist or just need a tool that lets you generate
    simple graphics for use on their own, in a presentation, or elsewhere, OpenOffice.org
    Draw provides a host of drawing functions. If nothing else, it''s a whole lot
    of life to play with! Not everything in life has to be practical.


    # Starting it up


    To start OpenOffice.org Draw in the distributions I cover in this book, do the
    following:


    +   - Fedora Core: There is no direct menu access to the Draw program in Fedora
    Core 5. Instead, open one of the other OpenOffice.org tools and then select File:New:Drawing-
    if you want to create a new drawing. You can open an existing Ooo Draw document
    by double-clicking it in your file manager or choosing File:Open in another Ooo
    tool and selecting that drawing.


    +   - Knoppix: From the Main Menu, choose Office:OpenOffice.org:OpenOffice.org
    Draw.


    +   - Linspice: Choose Launch:Run Programs:Business & Finance:OpenOffice:OpenOffice
    Drawings.'
