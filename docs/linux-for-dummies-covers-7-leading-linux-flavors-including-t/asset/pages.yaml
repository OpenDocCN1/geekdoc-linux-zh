  md: '# 276 Part III: Getting Up to Speed with Linux


    Notice what the output is this. Rather than display the exact text you provided,
    the shell replaces the variable name, designated with a dollar sign, with the
    actual value stored in that variable.


    Why did I use single quotes in the PS1 example? The items with back-slashes (\)
    are interpreted one way or another. However, if you use double quotes with PS1,
    they''re interpreted only once, so that the item lists directory you''re in changes
    only the first time. With a single quote, the variables are interpreted every
    time you do something. The double-quote example shows something like Hello, my
    name is bob. However, the single quote comes up with Hello, my name is $USER.


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_297_0.png)


    If you''re going to play around with environment variables, I recommend that you
    start by using the methods I discuss in this section. After you have decided you''re
