- img_proc: true
  md: '# Chapter 20: Ten Troubleshooting Tips 373


    What do you do from here? Anything you want to run. Surf through this book for
    commands you want to run. Type startx to start up the GUI. If you didn''t install
    any GUI (which means you selected a minimal install option with graphical interface,
    or you actually unselected graphics), you may want to reinstall, or you'' have
    to add all the tools by hand (which is not a quick job!)


    # # I Don''t Want to Boot into This!


    Are you booting into the command-line environment when you want to use only the
    GUI? Or are you finding that you''re already booting into the GUI and you would
    rather boot to that nice, clean, black-and-white command-line screen? You''re
    not stuck with either of these options. You can change them at any time.


    You can press Ctrl-Alt-F# to change out of the GUI to a command line terminal
    at any time and then Alt-F7 or Alt-F8 to switch back.


    # ## Changing your boot environment "permanently"


    The word *permanently* is in quotes in the heading because you can, of course,
    go back and change this setting later, if you want. *Permanently* just refers
    to the fact that after you have made this change, every time you boot the system,
    it automatically goes into the preferred environment until you change it.


    You can''t make this change in Linspin, Ubuntu, or Xandros unless you want to
    boot into *single-user mode*, which is basically "safe mode" and not much use.
    Well, okay, you can, but you would need a techie to set up a bunch of stuff for
    you. Linsphere and Xandros assume that you don''t want to do this. You can''t
    do this in Knoppix either, then it''s a LiveCD so you won''t be doing anything
    permanent to it.


    To make this change in Fedora, Mandriva, or SuSE, you need to edit what is called
    a *runlevel*. Fortunately, all three of these distributions use the same runlevel
    settings, so the instructions are for all of them:


    +   1. In the GUI, open a command line terminal.


    If you''re not sure how to do so, see Chapter 14. If you''re not in the GUI and
    you''re already logged in, type *su* – to become the root user.'
  merge: -1
  pgno: 394
- img_proc: true
  md: '# 374 Part V: The Part of Tens


    2. Type cp /etc/initstab /etc/initstab.old to make a backup.


    Now, if something happens while you''re editing the initab file, you can always
    restart fresh with the old version.


    3. Open the initab file in your preferred text editor.


    Some Linux text editors are covered in Chapter 16.


    4. Scroll down until you find a line similar to the following:


    ```

    id:5:initdefault:

    ```


    This line appears near the top of the file. What you''re interested in is the
    number. In most mainstream Linux distributions, the number 5 tells Linux to boot
    into the GUI, and the number 3 tells Linux to boot into the command line. In the
    preceding example, however I boot into the GUI.


    5. Change the number in this line.


    If it''s a 5, change it to 3, and vice versa. Make sure that all colons and other
    items are left properly in place, or else your machine will have problems booting
    loader.


    6. Save and exit the file.


    The changes go into effect the next time you reboot the system.


    > If you end up having problems booting the system, in many current Linux distributions
    (including the one that comes with this book) your installation disk can be used
    as an emergency boot disk. Check your documentation for the distribution you''re
    using if it''s not Red Hat 10.


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_395_0.png)


    # Changing your boot environment just for now


    At any time, you can have your Linux box switch between full command-line mode
    and full GUI mode. The instructions I give here assume that you''re using Fedora,
