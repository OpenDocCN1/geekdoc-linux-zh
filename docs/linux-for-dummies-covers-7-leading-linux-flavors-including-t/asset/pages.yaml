  md: '# 336 Part IV: Getting Things Done


    # Configuring Printing for OpenOffice.org


    Before you can print from OpenOffice.org, you may need to set up printing for
    this suite. If you already already set up your printing in Chapter 7, try printing
    a page from any of the OpenOffice.org applications and see whether it works. For
    those that are unable to print from OpenOffice.org but can print from other applications,
    open the OpenOffice.org print tool from:


    +   - Fedora, Mandrivra, SuSE, and Ubuntu: Integrated with the main printer manager,
    you don''t need to do anything


    +   - Knoppix: From the Main Menu, choose Office:OpenOffice.org:OpenOffice Printer
    Administration.


    +   - Linsphere: Choose Launch:Run Programs:Business & Finance:OpenOffice:Additional
    Programs:OpenOffice Printer Administration.


    +   - Xandros: Choose Launch:Applications:OpenOffice.org:Printer Administration.
    The option may be under an additional submenu called Tools.


    Then do the following:


    +   1. Click New Printer.

    The Choose A Device Type dialog box appears.


    +   2. Make sure that Add A Printer is selected and then click Next.

    The Choose A Driver dialog box appears.


    +   3. Scroll through this screen and locate the make and model of your printer
    or choose Generic Printer.


    +   4. After you make your selection, click Next.

    The Choose A Command Line dialog box appears.


    +   5. Click Next to skip this item.

    The Choose A Name dialog box appears.


    +   6. Change the name for this printer if you want.


    +   7. If you want to use this printer as your default, click the Use As Default
    Printer box.


    +   8. Click Finish to add this printer to your list and then Close to close the
    printing tool.


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_357_0.png)


    Before you close the tool, you may want to click Test Page to see whether you
    can print a test page.'
