    # Taking A Tour of OpenOffice.org Base


    Before you proceed, refer to the layout shown in Figure 17-8. This is your main
    OpenOffice.org Base window after you have a database open to work with. Let''s
    take a look at what you''ll find there.


    # Menu bar


    Along the top of the window is the menu bar. OpenOffice.org Base gives you access
    to many of the features you may expect in a database interface:


    +   - File: The usual Open, Save, and Save commands, along with a set of wizards
    and the ability to send documents through e-mail

    - Edit: The usual Copy and Paste commands, along with access to data-base properties,
    advanced settings, and the Form and Report wizards

    - View: Access to toolbars and database objects, along with preview and sort features

    - Insert: The ability to create forms, queries, and more

    - Tools: The ability to assign relationships between tables, filter tables, run
    SQL queries, create macros, and more


    Standard toolbar

    Beneath the menu bar is the standard toolbar, which you can remove at any time
    by choosing View<Toolbars>. Each icon in this series represents a different functionality,
    as described in Table 17-7. As you can see, the main toolbar is more similar to
    that in OpenOffice.org Impress than the one in OpenOffice.org Writer.


    | Table 17-7 | The OpenOffice.org Base Standard Toolbar, from Left to Right |

    | Button or Item | What You Can Do |

    | New | Open new documents of various types. Click the downward arrow to select
    a particular type of document to create, from among any of the OOO types. |

    | Open | Open an existing file for reading or editing. |'
