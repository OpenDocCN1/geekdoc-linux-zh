    # Listening to Download Music


    Downloading music from the Internet is a fun activity. A lot of people like to
    pretend that it''s all legal and ethical, in fact, it''s often theft, depending
    on where you grabbed the music. Leave that ethical issue between you and your
    belief system, but because my ethics says that it''s theft, I''m going to focus
    on showing you that you are welcome to download — legally and ethically! Take
    a look at strategies for finding such music, along with how to listen to it.


    One place to find such material is on a band''s own Web site. Many groups today
    realize that offering free downloads of their work is a great PR move — if people
    love the sample songs, they''re more likely to go out and buy the album. For an
    example, I use one of my favorite bands, Evanescence (www.evanescence.com).


    Evanescence, like many other bands, has its page done mostly with Macromedia''s
    Flash tool. (See Chapter 12 for how to add this functionality to your distribution).
    To listen to music files in general, I personally recommend Amarok, (again) you
    can get by using the tools discussed in Chapter 12 as well — see the section "Using
    Amarok" later in this chapter — but here are the defaults for each distribution:


    +   - Fedora: Choose Applications◄Sound & Video►Rhythmbox Music Player.


    +   - Knappix: From the Main Menu, choose Multimedia►Sound►XMMS.


    +   - Linspire: Choose Launch►Run Programs►Audio & MP3►Lsongs.'
