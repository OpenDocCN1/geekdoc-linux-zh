  md: '# 92 Part I: Getting Your Feet Wet


    To unravel the mystery of a Linux system that won''t boot requires a bit of understanding
    how your computer starts up. At the very least, being able to tell a repair person
    where the problem seems to can make you feel a little less intimidated — and even
    save you some money, because it speeds up their troubleshooting.


    # Giving Linux the Boot


    Let''s face it: As enjoyable as the experience is of staring at a dormant computer,
    the real fun starts when you turn on the computer. As with any electronic device,
    opening the electron floodgate is the first step to fun. A computer, has much
    more stuff to do than your toaster oven. Rather than warm up a simple heating
    element, your computer has to check all those gizmos you (or the manufacturer)
    plugged into your computer''s motherboard. After the initial power-up, the computer
    performs some hardware tests (called the POST, or Power-Up Self-Test) to determine
    whether those components are working properly.


    Checking all your hardware is just the beginning. Between the time you turn the
    computer on the moment the glowing phosphor on your monitor prompts you for a
    login name, the computer is building an empire. If you listen and watch carefully,
    your computer and monitor show signs of the boot process through beeps, buzzes,
    whirring motors, clicks, messages on the monitor, and blinking lights.


    Although you have heard the cliché "Rome wasn''t built in a day," the boot process
    goes fairly quickly. This is pretty amazing, considering that the architecture
    of an operating system makes Rome''s like a stack of cardboard boxes; each time
    you power up your computer, it must build its whole operating system in memory.
    (Remember that an operating system is the core software that makes your computer
    work.) This process can be broken into four main steps, which I discuss in the
    following sections.


    # Step 1: Power-On Self-Test (POST) leads to BIOS


    The POST process really has nothing to do with the operating system. Your computer
    performs this step whether you''re running Linux or another operating system,
    such as Windows XP.'
  merge: -1
