    # Content preferences


    Selecting Content brings you to the Content portion of the Firefox Preferences
    dialog box (Figure 9-3). This section lets you control how Firefox reacts to various
    types of content. The top portion refers to items to allow or not — notice that
    each of these has a button to its right that offers additional control:


    +   - Block Popup Windows: Tells Firefox to block new windows that you didn''t
    ask for — this is a favorite feature and one that many people move to Firefox
    under Microsoft Windows. Some sites have functionality that require the ability
    to open, say, log-in windows, so you can click the Allowed Sites button to make
    exceptions for them. If you don''t configure this feature, it still works. A yellow
    bar appears in the browser whenever a pop-up is blocked, allowing you to access
    the settings at that point.


    +   - Warn me when sites try to install extensions or themes: Highly recommended
    that you leave this on. This setting prevents sites from automatically messing
    with your Firefox configuration. Again, there is an Exceptions button for sites
    you want to allow to do this.


    +   - Load Images: Lets you block all images. Useful for those who are impaired
    or who are trying to speed up browsing by ignoring pictures. For The Origin Web
    Site Only is a way to block ads, many ads are loaded from other sites and just
    on the one you''re viewing, but it can also block legitimate graphics. The Exceptions
    button helps you manage what to see and what not to.


    +   - Enable Java: If you have Java installed and this option enabled, Firefox
    will run Java code it finds


    +   - Enable JavaScript: Some people shut this off for security reasons. Many
    don''t. Clicking the Advanced button opens the JavaScript Settings dialog box,
    which you can choose what to use this scripting language to do. If you find a
    site that does annoying things like resize your windows, go to this dialog box
    to disable it.'
