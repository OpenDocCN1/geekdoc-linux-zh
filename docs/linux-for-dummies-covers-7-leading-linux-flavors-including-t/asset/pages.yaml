  md: '# Ubuntu tools


    Ubuntu is probably the least fancy of the distributions included in this book.
    One reason is that Ubuntu is the newest; its developers haven''t had the time
    to create as many tools. Another reason, however, is that Ubuntu is more of a
    "raw GNOME" distribution than the others that include GNOME (Fedora, Mandriva,
    and SuSE).


    You will find most of Ubuntu''s settings under the System menu, in both System->Preferences
    and System->Administration.


    As you can see, the cool thing about learning one Linux distribution is that you''re
    mastering useful things to help you survive *another* version of Linux. Remember
    that all these distributions are relatives, like cousins. Now get out there and
