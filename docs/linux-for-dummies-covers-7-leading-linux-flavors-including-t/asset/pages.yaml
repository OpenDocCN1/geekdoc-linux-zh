  md: '# Appendix B: About the DVD-ROM 399


    Both CDs include GPG signatures, allowing the installer to check the contents
    of the files against the stored security data to make sure that the files haven''t
    changed. (The assumption is that all changes would be for the worse, such as Trojan
    horses or viruses.) Thus, signatures provide a way to make sure that everything
    is safe and wholesome for your computer!


    # If You''ve Got Problems (Of the DVD-ROM Kind)


    I tried best to locate programs that work on most computers with the minimum system
    requirements, as the Fedora team did for its operating system. Alas, your computer
    may differ, and some programs may not work properly for some reason.


    The twoeliest problems are that you don''t have enough memory (RAM) for the programs
    you want to use or that you have other programs running are affecting the installation
    or running of a program. If you see error messages like Not enough memory or Setup
    cannot continue, try one or more of the following methods and then try using the
    software:


    +   - Close all running programs. The less memory is available to other programs.
    Installers also typically update files and programs; if you keep other programs
    running, the installation may not work properly.


    +   - In Linux, close your GUI environment and run demos or installations directly
    from a command line. The interface itself can tie up system memory or even conflict
    with certain kinds of interactive demos. Use the command prompt to browse files
    on the DVD-ROM and launch installers or demos.


    +   - Have your local computer store add more RAM to your computer. This step
    is admits, a drastic and potentially expensive, depending on the price of RAM
    at the time. If you have a modern PC with less 64MB of RAM, however adding more
    memory can really help the speed of your computer and enable more programs to
    run at the same time.


    If you still have trouble with the DVD-ROM, please call the Wiley Technical Support
    phone number 1-800-762-2974. Outside the United States, call 1-317-572-3994. You
    can also contact Wiley Technical Support through the Internet at www.wiley.com/techsupport.
    Wiley Publishing provides technical support only for installation and other general
    quality control items; for technical support on the applications themselves, consult
    the program''s vendor or author.


    To place additional orders or to request information about other Wiley products,
    please call 1-800-225-5945.'
