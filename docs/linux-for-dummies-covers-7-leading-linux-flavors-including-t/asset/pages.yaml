    # Working with Disk Partitions


    In the section "Preparing to Use Linux and Microsoft Windows Together" (at the
    beginning of this chapter), I discuss why you might need to set aside disk space
    for Linux on a computer that''s already running Windows. The techniques I cover
    here assume you''ve found free space that you can give to Linux after you resize
    your partitions. If you''re installing on a fresh, additional hard drive, are
    wiping out a whole hard drive to give it over to Linux, or already have a chunk
    of unallocated/free space bigger than 10GB, skip ahead to the section "Double-Checking
    Hardware Compatibility," later in this chapter.


    If the thought of changing anything on your Windows drive makes you queasy, a
    cheap, additional hard drive can be worth its weight in gold.'
