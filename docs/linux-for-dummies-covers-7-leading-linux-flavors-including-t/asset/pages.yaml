  md: In this part, you make the necessary mental and physical connections to hook
    up your Linux machine to the Internet, including configuring telephone dial-up
    to an Internet Service Provider (ISP). You also discover how to do some basic
    network troubleshooting, just in case things don't go perfectly. Next, you set
    up your Web browser, e-mail client, and instant messaging software so that you
    can surf the web, send and receive e-mail, and access newssgroups. Armed with
    the utilities you install in this part, you enable yourself to extend and customize
    your Linux system to your heart's content. You also find out how to travel on
    the electronic highways and byways of the Internet to get things done!
