    \ In Chapter 17, I take a look at office suites for those who would rather do\
    \ word-processing.\n\n# # Viewing the Contents of a Text File\n\nAlmost all configuration\
    \ files in Linux are text files. In addition, many pseudoprograms (called *shell\
    \ scripts*), all HTML documentation, and many other items in your system are text\
    \ files. Fortunately, if you just want to see what's in a text file and don't\
    \ want to do anything to its contents, you don't have to use an editor or word\
    \ processor. You can use three command-line commands to view text files: *cat*,\
    \ *less*, and *more*. I bet that you will grow to love them.\n\nYes, that first\
    \ command is *cat*, and it's taken from the word *concatenate*, which means to\
    \ bring together to end — you can use the *cat* command on multiple-text files\
    \ to have their text joined, one file's contents directly after another's. Typically\
    \ you use this command in the Linux world in the format `cat filename`, where\
    \ the contents of the file `filename` are displayed on the screen. For example,\
    \ if you create the short text file greetings and then type `cat greetings`, you\
    \ see the following:\n\n```\n$ cat greetings\nare the contents of the greetings\
    \ file.\nMeow!\n$ \n```"
