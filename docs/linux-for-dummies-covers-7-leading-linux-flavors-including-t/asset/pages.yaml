  md: '# Jump-Starting Linux with Knoppix


    In Chapter 2, I explain that Knoppix is included on the DVD-ROM that comes with
    this book. You can boot with the book''s DVD-ROM and just press Enter at the boot
    prompt, skipping any need to install anything on your computer (Linux runs directly
    from the DVD). If you''re concerned about messing up something on your computer
    with an installation, give Knoppix a.


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_79_0.png)


    If you can''t use the DVD-ROM included with this book, you can download the CD-ROM
    image to burn onto your own CD by going to www.knoppix.net/get_php. If you want
    to burn a larger version, you can get an image that fits onto a DVD by choosing
    the DVD version, but keep in mind it will take much longer to download the CD
    image because it is a much larger file. Your download client will tell you how
    long the download will take for your connection.


    # Living Large with Linspire


    Linspire (www.linspire.com) — formerly known as Windows — is especially designed
    for people coming over from the Windows to Linux. This commercial distribution
    offers additional subscription services available that I describe in the "Recognizing
    some Linspire features" and "About the various Linspire versions" sections in
    this chapter. Linspire is designed for ease of installation and ease of adding
    new software, and contains many tutorials to help people get to use the system.
    Yet, Linspire isn''t designed in particular for the aspiring Linspire geek.


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_79_1.png)


    If you''re curious about Linspire, you''re in luck — an ISO file to create your
    own CD-ROM of the full version of Linspire is included on the DVD-ROM that comes
    with this book! In Chapter 12 find out how to sign up for your free trial of the
    Click And Run Warehouse for getting and installing software, so you can decide
    for yourself whether it''s worth paying for membership after.


    If you decide to purchase Linspire, you have a number of options:


    +   * Purchase it online and download it immediately from the Linspire Web site.

    * Purchase it online and have a physical box shipped.

    * Purchase a boxed set in a store (www.linspire.com/windows_feature_reseller.php).

    * Purchase a computer with Linspire preinstalled (www.linspire.com/lows_feature_preinstall.php).'
