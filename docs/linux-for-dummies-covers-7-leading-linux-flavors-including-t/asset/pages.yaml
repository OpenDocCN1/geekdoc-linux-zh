  md: '# 204 Part III: Getting Up to Speed with Linux


    An additional important location in Fedora is /etc/sysconfig, which contains configuration
    information for the services that start at boot time, including things like your
    networking. Each distribution tends to have its own way of handling networking
    information.


    # Meet the /mnt and /media subdirectories


    You may or may not have any subdirectories in /media or /mnt by default (and you
    may not have both of these directories at the same time). Typically, however,
    you can look for the following:


    +   - /mnt/floppy or /media/floppy is used for adding a floppy disk to your filesystem
    — instead of word floppy, you might see fd0 or floppy0.

    - /mnt/cdrom or /media/cdrom or /media/dvd, /media/cdrecorder, and so on, depending
    on what type of hardware you have directory is used for adding a CD-ROM, DVD-ROM,
    CD-Writer, and so on to your system.


    In the "Finding CDs and More in Your GUI" section, later in this chapter, I will
    show you how to add these items for each of the distributions. Fortunately you
    don''t need to know this information in the GUI because this is all taken care
    of for you. Still, it doesn''t hurt!


    # Meet the /usr subdirectories


    /usr directory is often referred to as its own miniature filesystem hierarchy.
    This directory has lots of important or interesting subdirectories, as shown in
    Table 11-2. An asterisk (*) at the end of a description indicates that you need
    to leave that alone unless you have good reason to mess with it — after you gain
    lots of experience with Linux and know exactly what changes you need to make —
    so that you don''t accidentally alter your system needs needs in order to function
    correctly. An important thing to remember this segment of the filesystem is that
    many advanced Linux users often use /usr to store programs that can be shared
    with other Linux machines.


    | Table 11-2 | Standard /usr Subdirectories |

    | Subdirectory | Contents |

    | /usr/X11R6 | The files that manage the X Window System (the wireframe underneath
    your GUI)* |

    | /usr/bin | The commands that aren''t essential for users but are useful* |'
