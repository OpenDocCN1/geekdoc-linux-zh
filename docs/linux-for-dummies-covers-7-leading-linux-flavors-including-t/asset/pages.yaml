  md: '# 174 Part II: Internet Now


    +   - If you attempt to access the IM service from your computer at work, your
    company or organization may block the IM service for security or productivity
    reasons. If using IM at your work is permitted, check with your network administrator
    to see whether he can help you out.


    +   - Often, companies use firewalls between the company''s network and the Internet
    to keep out unwanted traffic on the company''s network. If the firewall is configured
    to block IM traffic, you cannot use IM across the Internet.


    # Downloading with BitTorrent


    Say what you want about file sharing, but it''s popular. Networks such as BitTorrent(www.bittor.com)
    have actually found legitimate use among software companies and other content
    distributors, as a way of offering for larger files without having to take the
    brunt of the bandwidth use them, so it''s worth looking at how to use this software
    under Linux.


    Typically a BitTorrent client is not installed by default, though this isn''t
    always the case. You can use the information in Chapter 12 to install a client,
    using this guideline of what clients are available with distribution:


    +   - Knoppix: None, because this is a bootable distribution.


    +   - Fedora: The tools discussed in Chapter 12 to install bit torrent-gui. When
    installed, you can run it by choosing Applications+Internet+BitTorrent File Transfer.


    +   - Linsp: LTTorrent is installed by default; go to Launch+Run Programs+Internet+LTTorrent.


    +   - Mandriva: Use the package installation tool discussed in Chapter 12 and
    search on the term bittorrent. Install bittorrent and bittorrent-gui.


    +   - SuSE: KTorrent is installed by default; go to Applications+Internet+Data
    Exchange+KTorrent.


    +   - Ubuntu: A client is already selected; select Applications+Internet+BitTorrent.
    After the package is installed, you will find it at Launch+Applications+Internet+Bittorrent
    Client.


    +   - Xanders: Use Xand Networks to install BitTorrent, which you will find under
    Internet. After the package is installed, you will find it at Launch+Applications+Internet+Bittorrent
    Client.


    I chose the Fedora client, but the others work on the same principle. When you
    find out that a file is available over BitTorrent, you first download the .torrent
    file for the item. After you have this file downloaded:'
