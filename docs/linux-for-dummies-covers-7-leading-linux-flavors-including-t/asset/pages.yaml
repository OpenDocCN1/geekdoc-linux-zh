  md: '# Chapter 20: Troubleshooting Tips 371


    # # I Told the Installer to Test My Graphics, and They Failed


    The installer may have misguessed what hardware you have. Double-check the settings
    as best you can. If they look right, try choosing lower resolution for now and
    testing again, and if that fails try a lower number of colors and test again.
    You can then try setting back the way you want them after the machine is fully
    installed and updated, when it hopefully will have a fix for whatever the problem
    might.


    # # The Installer Tested My Graphics Fine, but My GUI Won''t Start


    If your Linux installation program showed you a GUI test screen saying that you
    were ready to proceed with the rest of the installation, you probably expected
    that the GUI would start with no problem. Unfortunately, that doesn''t always
    happen.


    Each distribution has its own set of graphics configuration tools. If you boot
    your machine for the first time and see error messages when you''re trying to
    enter the GUI automatically or when you type startx to start the GUI manually,
    use the following tools to fix the problem:


    +   - In Fedora Core, use system-config-display.

    - In Knoppix, you don''t install. Use the options available when you boot it in
    order to tell it specifics about your display.

    - In Linspire, use xorgconfig.

    - In Mandriva, use drakconf and select Configure Monitor.

    - In SuSE, use sax2.

    - In Ubuntu, none of these tools is included.

    - In Xandros, use xorgconfig.

    - Your last resort is xorgconfig. This fully text-based tool should be available
    with most distributions.'
  merge: -1
