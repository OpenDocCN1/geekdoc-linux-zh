    #  Working with Other Internet Tools


    You may want to explore a variety of other types of tools, depending on your needs.
    This section covers some pointers to get you started, so if you go to Chapter
    12 and want to add the appropriate software (or find yourself digging through
    menus and wondering what the program may be called), you aren''t completely lost.


    +   * FTP programs: If you want to FTP, a commonly used program in the Linux world
    is GFTP. This program is available for all five distributions discussed in this
    book, although it''s only installed by default in Mandriva. The KDE equivalent
    is KBear.

    * IRC programs: While the IM clients support IRC these days, you may prefer a
    program that''s only used for IRC. Common programs for this purpose are X-Chat
    and KiIRC.

    * File sharing: LimeWire is a popular one if you want to use the Gnutella network.

    * RSS readers: Firefox has a number of RSS extensions designed for it. In addition,
    Straw is a popular RSS program.


    In general, if you''re not sure what programs to use, do a Web search for the
    type of thing you want to do (like RSS) and the word Linux.'
