  md: '# # Chapter 7


    # # Configuring Linux


    In This Chapter


    +   - Creating user accounts

    - Setting up your system for printing

    - Finding cool configuration tools


    > The doctor can bury his mistakes but an architect can only advise the client
    to plant vines.

    — Frank Lloyd Wright (1869–1959)


    Unlike the architect and the doctor, the computer user isn''t stuck with configuration
    mistakes. You can tweak and change things until you''re happy with them! Because
    the first thing that a lot of people like to do with a new system is get it up
    just right, I thought''d spend this chapter some of the core bits of knowledge
    that can help you do just that. You start by finding out more about user accounts
    and why I am so insistent (in Chapters 3 and 4) that you create a special one
    for your own personal use. Then you find out how to set up your machine to talk
    to your printer. I also show you where the cool configuration tools are for your
    distribution so that you can get down to some serious customization.


    # # Accounts Great and Small


    Linux is a multiser operating system. It allows every user to have a unique account
    and allows more than one user to log in at the same time. Typically, even if you''re
    the only user on a system, you need an account of your own that isn''t the root
    user''s (I explain why in the next section.) In addition, having multiple accounts
    is especially fun for experimenting with different user setups. That way you can
    create a main account to be more careful with and goofing around account to completely
    mess around with.'
  merge: -1
  pgno: 140
- img_proc: true
  md: '# Avoiding root


    The root user, also known as the superuser or just root, has access to anything
    and everything on your machine. There is no blocking root from a directory, file,
    command, or device — so many Linux beginners figure they may as well use the root
    account all the time because it''s convenient.


    In a word, don''t. For lots of reasons, you shouldn''t use the root account for
    everyday use:


    +   - Overkill. You don''t always need root-level access for mundane tasks.


    +   - Root-level access is as much of a curse as it is a blessing. If you mess
    up as a regular user, you mess only the stuff in your account. If you mess as
    the root user, you can wipe out everything — all the files on your Linux system!


    Don''t think that you would really wipe out everything? Many experienced Linux
    administrators tell horror stories about the day they made a fatal typo or weren''t
    paying attention to what they were doing and completely destroyed an installation.


    +   - Root can make you look like a clueless bragg. If you send e-mail or news
    posts as root for anything other than serious administrative business, people
    think you don''t know what you''re doing or that you''re showing off.


    +   - Root comes with too much temptation. The superuser can read other people''s
    e-mail messages and files, which introduces a few "tiny" ethical issues.


    Linspired has a slightly different philosophy. By default, you have only one account
    when you''re using Linspire — you can create more later, which I highly recommend
    doing. In the next section, I show you how to create new accounts in each of the
    distributions covered in this book so you don''t have to use root for everyday
    work. Or, worse, let someone who''s borrowing your computer for a moment browse
    the Web under root (bad idea, trust me)!


    # Creating user accounts


    Most Linux distributions include a graphical interface application for creating
    and managing user accounts. Here''s how you can find this application for your
    distribution:


