- img_proc: true
  md: '# 376 Part V: The Part of Tens


    drive on the primary IDE channel. Consider this list of potential solutions if
    the /etc/grub.conf file makes trouble:


    +   - If you have altered or added hard drives, you may need to change the boot
    line in the /etc/grub.conf file.


    +   - If you haven''t made hardware changes, check to make sure that your /etc/grub.conf
    file is referring to the correct location of the Linux image. (The program code
    that loads and executes at runtime is located in the /boot directory.)


    +   - If the location under the /boot directory or the device for the root entry
    is incorrect, your system can''t boot to Linux. In this situation, a rescue or
    emergency disk is helpful. Refer to Chapter 5 for instructions on using a rescue
    disk


    +   - If you''re working with a multiboot operating system environment, be sure
    that your /etc/grub.conf file contains entries for each of your operating systems.
    Each operating system or Linux installation needs to be in separate entries


    +   - If your file contains entries to switch to a higher-resolution display and
    you have boot problems, try reducing the video setting to simple VGA.


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_397_0.png)


    Linux allows you to use spaces and other characters in filenames that you may
    not be able to use in filenames on other operating systems. However, some Linux
    applications may stumble when they encounter file or directory names containing
    spaces. Usually, a safe bet is to stick with alphanumeric characters and avoid
    spaces and odd characters, such as question marks and exclamation points.


    # # "Aargh! I Forgot My Root Password! What Do I Do?"


    Fear not. You have a way around this problem! You need to boot into single user
    mode, which you can accomplish by rebooting your machine and then doing the following:


    +   - Fedora: When you see the blue screen with the words “Press any key to enter
    the menu,” press a key. At the GRUB boot screen, press E, which takes you to a
    configuration file. Use the arrow keys to go to the line starting with kernel,
    and press E again to edit that line. At the end of the line, add the word single,
    press Enter to put the change into place, and then press B to boot the machine.'
