  md: '# 330 Part IV: Getting Done


    # # Layout with OpenOffice.org Math


    There''s nothing like trying to type a math or science report and having to either
    use multiple lines to show your equations (which never looks right!) or write
    them by hand. OpenOffice.org Math is a great solution to this problem. You can
    lay out your equations and more in this program and insert them into any of your
    OpenOffice.org documents. Whether you''re a middle school student or a professional
    engineer, OpenOffice.org Math just may thrill you.


    Many OpenOffice.org Math functions are different from what you''re used to if
    you have looked at all the other OpenOffice.org programs. However, in many ways
    this program is less complex than some, thanks to its special-purpose nature.
    Keep in mind that it''s not a calculation program. It''s for laying out complex
    formulas on paper or the screen.


    # # Starting it up


    To start OpenOffice.org Math in the distributions I cover in this book, do the
    following:


    +   - Fedora Core: There is no menu option for OpenOffice.org Math in Fedora Core
    5. Instead, open another OpenOffice.org application and choose File:✜New✜Formula.


    +   - Knoppix: From the Main Menu, choose Office✜OpenOffice.org✜OpenOffice.org
    Math.


    +   - Linspur: Choose Launch✜Run Programs✜Business & Finance OpenOffice.org✜Additional
    Programs✜OpenOffice Math.


    +   - Mandriva: From the Main Menu, choose Office✜Wordprocessors✜OpenOffice.org
    Math.


    +   - SuSE: There is no menu option for this program, so follow the same instructions
    given in the Fedora section.


    +   - Xandros: Choose Launch✜Applications✜OpenOffice.org✜Formula Editor. This
    editor may be under an additional Tools submenu.


    +   - Ubuntu: Choose Applications✜Office✜OpenOffice.org2 Math.


    # # Taking a tour of OpenOffice.org Math


    Before you proceed, take a look at the GUI layout shown in Figure 17-9.'
  merge: -1
  pgno: 351
- img_proc: true
  md: '# Chapter 17: Word Processing and More with OpenOffice.org 331


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_352_0.png)


    Figure 17-9: The OpenOffice Math layout.


    Close the Selection dialog box by clicking the small X in the upper-right corner
    of your window for, to keep things as uncluttered as possible. You can get it
    back at any time by choosing View>Selection.


    # Menu bar


    Along the top of the window is the menu bar, a standard in a GUI world no matter
    which operating system you''re using. OpenOffice.org Math may be unlike any program
    you have used already, so I don''t say anything about what you might expect to
    find there. I just give you a (nonexhaustive) summary of what you find on each
    menu:


    +   - **File:** The usual Open, Save, Save As, and Print commands that you find
    in most GUI programs, along with a set of Wizards and the ability to send documents
    through e-mail


    +   - **Edit:** The usual Select All, Copy, and Paste commands, along with specialized
    commands for moving within the formula


    +   - **View:** The usual Zoom functions and toolbars, along with screen update
    features and more


    +   - **Format:** The usual font type, font size, spacing, and alignment features
    and more


    +   - **Tools:** The usual Customize and Options entries for customizing the program''s
    setup and behaviors, in addition to formula importing and access to the symbol
    catalog'
