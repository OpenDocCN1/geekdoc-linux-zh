    For any formats that won''t play, first turn to Chapter 12 and find how to add
    RealPlayer and the tools mentioned below. If these tools cannot play what you''re
    trying to listen to, see Chapter 19 for products that let you run Windows under
    Linux.


    Software you''re likely to encounter as you experiment with Internet radio includes:


    +   Amarok: A full-featured audio player that''s got some really cool features,
    like the ability to load images of your album covers. This is my preferred audio
    tool, and it can be added to most of the distributions discussed in this book.
    See the section "Using Amarok" later in this chapter for more.


    +   Rhythmbox Player: Adding MP3 support to this program is a legally- tricky
    matter since MP3 is a patented format requiring proper licenses to use legitimately.
    The FedoraFAQ site at www. fedorafaq.org has more. Aside from the MP3 issue, this
    tool play CDs, Internet (streaming) radio and downloaded music.


    +   RealPlayer: The all-too-familiar program from other operating systems. It
    can play Internet without the pieces that have to be handed with with pay licenses
    (like MP3s). It can play Internet (streaming) radio and downloaded music.


    +   MPlayer-Plugin: A browser plug-in you can use at times to listen to formats
    that other players may not support, including Windows formats. Least likely to
    be legal if you''re in the United States.'
