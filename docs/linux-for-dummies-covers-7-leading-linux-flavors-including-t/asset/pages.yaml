- img_proc: true
  md: '# Chapter 20: Troubleshooting Tips


    Otherwise, diagnosing the problem can be tricky and may seem more like voodoo
    than science. Here are some tips:


    +   - If this problem happens repeatedly at exactly the same spot, you may have
    a bad installation disk. If you''re a Fedora Core or Red Hat Linux user, see the
    next section, "For Fedora Core Users," and then return here if that technique
    doesn''t solve your problem. Otherwise, try the disk in another machine if possible
    and see whether the installation fails in the same place. If you purchased this
    disk with a Linux distribution, contact the distribution''s technical support
    team. If you got the disk with a book, contact the publisher''s technical support
    team. If you burned the disk yourself, burning a new copy at a slower speed.

    - If this problem happens repeatedly at exactly the same spot and you don''t have
    a bad installation disk, the trouble may be with one of your machine''s hardware
    components. If you can, try trading hardware between machines. If not, you may
    need to choose a different machine on which install Linux or try another distribution.

    - If the problem seems to happen randomly, your particular Linux distribution
    may not be compatible with that particular machine. Again, you can try trading
    around hardware, installing Linux on another machine, or using another distribution.


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_390_0.png)


    If you''re not sure your installer has frozen, try pressing combinations of Alt+F#,
    where # corresponds to one of the function keys. Depending on the distribution,
    the installer has not completely frozen if you can see differ-screens when you
    try this technique.


    # For Fedora Core Users


    When installing Red Hat Linux 7.3 or later (Fedora Core 5 is considered "later»),
