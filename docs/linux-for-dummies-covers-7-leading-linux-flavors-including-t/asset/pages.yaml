    # Finally, Finally, Before You Get Started


    The bootable CD or DVD is the last thing you will need before proceeding to install
    Linux. Fedora comes on the bootable DVD that comes with this book. If your computer
    doesn''t have a DVD-ROM drive, use the coupon included in the back of this book
    to get the CDs — if you do, the first CD is bootable.


    # Laptop considerations


    The current distributions of Linux do very well on relatively new notebooks and
    laptops. (See www.linux-laptop.com for an excellent research site on how Linux
    gets along with various makes and models.) If your laptop is a common brand, you
    shouldn''t encounter any problems installing Linux. However, laptops often contain
    WinModems (Hardware labeled with the Win prefix is only for Windows, and you can''t
    figure out what to do with Linux.)


    network cards) to make sure they''re not Windows-branded. The built-in or default
    hardware for the laptop is Win-labeled (or you discover while researching the
    machine that contains a Win product, even if it isn''t properly labeled), you
    may be able to switch the offending hardware for a PC (or PCMCIA). Most laptops
    contain at least one PC Card Slot to give you a place to slip in a PC card modem,
    network card, or combo modem-network card. As long as you should stick with a
    common brand of PC card, it should work well with Linux.


    If you plan to purchase a laptop for Linux, check out its modem and other hardware
    (such as'
