    # After You''re Connected


    After you''re connected, you''ll probably want to leap straight to Chapter 9 for
    how to use the various Internet programs available to you. In the meantime, let
    me offer a number of sites you might find useful when you need help, questions,
    or otherwise want to explore the Linux world further — some of these are pretty
    geek, but you''ll grow into them! You also want to update your machine (see Chapter
    12), add new software (also Chapter 12), and give extra thought to system security
    (see Chapter 13) to protect yourself from nasty people and problems.


    Useful sites


    +   * **linuxsecurity.com**: A somewhat geek (but useful) place where you can
    track what''s going on in the world of Linux security.

    * **kerneltrack.org**: Everything you wanted to know about what''s happening with
    the Linux kernel but were afraid to ask. This place is great for tracking what
    new features are being added, if you''re interested in things like bleeding-edge
    hardware or just to be in "the know."

    * **linuxquestions.org**: I mention this elsewhere in the book, but it''s worth
    mentioning again. A popular hangout for people who have questions to ask, and
    for those who like to help them find answers.

    * **http://linux-newbie.sunsite.dk/**: The Linux Newbie Administrator Guide is
    a massive collection of information that you may find useful.'
