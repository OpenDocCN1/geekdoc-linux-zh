  md: '# Watchin'' Movies


    These days, you can watch many kinds of movies on your computer. Whether it''s
    a Flash animation, a DVD, or a movie trailer, you''ve got the tools that need
    right at your fingertips (or just a click away). You may have even installed some
    already, while trying to access other multimedia features. Here are some of the
    tools of the trade.


    Watching a DVD in Linux is a bit of a legal quagmire if you live in the United
    States. The Digital Millennium Copyright Act (DMCA) and other issues make it tricky
    for any open source program to navigate the licensing maze when it comes to movies
    that are encoded or protected in various fashions. However, not all DVDs have
    such countermeasures enabled: There are DVDs that Americans can watch under Linux
    with no trouble. (Note that I say watch, not copy or pirate.)


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_376_0.png)


    For more on the DMCA and the problems it causes, see anti-dmca.org.


    To watch a DVD in Linux, first check Chapter 11 to see what your distribution
    will do if you just put a DVD into your drive — you may not need to do- anything
    but put the DVD into the drive and let the system do its thing. You can also start
    a player by hand, although you may have to download it first:


    +   - Fedora: Choose Applications Sound & Video Movie Player. Use Chapter 12 to
    add more.


    +   - Knopix: From the Main Menu, choose Multimedia Videoine media player.


    +   - Linscape: Choose LaunchRun Programs Multimedia & DesignMedia Player (Kplayer).
    If this program can''t play all of your DVDs, purchase a legal, full-featured
    DVD player from the Click And Run Warehouse by using the tools discussed in Chapter
    12.


    +   - Mandriva: From the Main Menu, choose Multimedia VideoKaffeine.


    +   - SuSE: Choose ApplicationsMultimedia Video Player Totem or one of the others


    +   - Xanders: Choose ApplicationsMultimedia Video Player.


    +   - Ubuntu: Choose ApplicationsSound & Video Totem Movie Player.


    The version of Totem that comes with Fedora and other distributions is stripped-down
    in terms of formats it can support — again, this is a legal issue more than anything
    else. Often it is possible to replace this version with the one by uninstalling
    Totem, adding software repositories that contain multimedia tools, and then installing
    the full version of Totem from the repositories (all of these skills are discussed
    in Chapter 12). This is the solution I recommend for watching DVDs.'
  merge: -1
  pgno: 376
