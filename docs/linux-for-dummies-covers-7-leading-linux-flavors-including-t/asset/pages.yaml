    # Managing Data with OpenOffice.org Base


    Those who are used using Microsoft Access, or who have to interact with a variety
    of database products, have in the past been left scratching their heads and wondering
    how best to handle these needs under Linux. Well, no more! OpenOffice.org Base
    provides an interface to both Microsoft Access files and other databases. This
    software is only available with those distributions that include OpenOffice.org
    2 either as updates or by default at installation time.'
