  md: '# 154 Part II: Internet Now!


    # Browse the Web with Firefox


    Many people attribute the explosive growth of the Internet to the graphical Web
    browser. The Internet has been around for much longer than the invention of the
    browser. It''s just that most of the work done on the Internet was in plain old
    text, which held little attraction for those people who liked pretty pictures.
    In the world of Linux, the most popular browser is arguably Firefox (www.mozilla.org/products/firefox),
    which is based off Mozilla—essentially Firefox is just the Web browser portion
    of Mozilla, while Mozilla can also handle e-mail and news browsing. Another popular
    option is Konqueror (www.konqueror.org), whose file-browsing features you need
    out in Chapter 10, but this tool can also be used as a Web browser.


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_175_0.png)


    Not all Linux distributions come with Firefox preinstalled. In some versions of
    Xandros, for example, you will need to add the program using the techniques covered
    in Chapter 12. You will find Firefox in Xandros Networks'' New Applications folder.
    Linspire users also need to add Firefox, and can find it in the CNR section Internet:Browsers.
    Note that you will need to install one of the e-mail applications discussed in
    the section “Evolving to E-Mail” later in this chapter, if you choose Firefox
    over Mozilla.


    # Configuring Firefox


    You can start surfing right now, if you want. You don''t need to customize your
    browser. However, you may want to take a moment to tell Firefox your preferences,
    such as the default Web site to show when it starts up, font sizes to use by default,
    what colors to use, and many other options.


    The following steps introduce you to the Preferences window, where all the Firefox
    configuration parameters are stored:


    +   1. Start Firefox.


    How you start Firefox depends on which distribution you''re using. Typically it''s
    either a shortcut on your panel (Fedora, Knoppix, Mandriva, SUSE, and Ubuntu and
    Xandros Business), a shortcut on your desktop (Xandros and Linspire after you
    have the software installed); it already there in Business), or it is available
    in the Internet portion of your Main Menu (all if you have the software installed).
    If you are asked to import preferences, say no if this is a new installation and
    you haven''t used other browsers, or say yes if this is not a new installation
    and you''ve been using another browser such as Mozilla.


    +   2. Edit Preferences.


    The Preferences window appears, as shown in Figure 9-1. This dialog box may look
    different from distribution to distribution and have slightly different options
    as not everyone gets the exact version of Firefox, but for most part the match
    should be.


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_175_1.png)'
