  md: '# Linux® For Dummies,

    7th Edition


    # Common Commands


    | Command | Description |

    | --- | --- |

    | cat [filename] | Display file''s contents to the standard output device (usually
    your monitor). |

    | cd /directorypath | Change to directory. |

    | chmod [options] filename | Change a file''s permissions. |

    | chown [options] filename | Change who owns a file. |

    | cp [options] source destination | Copy files and directories. |

    | date [options] | Display or set the system date and time. |

    | df [options] | Display used and available disk space. |

    | du [options] | Show how much space each file takes up. |

    | file [options] filename | Determine what type of data is within a file. |

    | find [pathname] [expression] | Search for files matching a pattern. |

    | grep [options] pattern [filename] | Search files or output for a particular
    pattern. |

    | kill [options] pid | Stop a process. If the process refuses to stop, use -9
    pid. |

    | less [options] filename | View the contents of a file one page at a time. |

    | ln [options] source [destination] | Create a shortcut. |

    | lpr [options] | Send a print job. |

    | ls [options] | List directory contents. |

    | mkdir [options] directory | Create a new directory. |

    | mv [options] source destination | Rename or move file(s) or directories. |

    | passwd [name] [password] | Change the password or allow (for the system administrator)
    to change any password. |

    | ps [options] | Display a snapshot of the currently running processes. |

    | pwd | Display the pathname for the current directory. |

    |rm [options] directory | Remove (delete) file(s) and/or directories. |

    | rmdir [options] | Delete empty directories. |

    | su [options] [user arguments] | Switch to another user account. |

    | tail [options] [filename] | Display the last lines of a file (the default is
    10). |

    | tar [options] filename | Store and extract files from a tarfile (.tar) or tarball
    (.tar.gz or .tgz). |

    | who [options] | Display who is logged on.'
  merge: -1
