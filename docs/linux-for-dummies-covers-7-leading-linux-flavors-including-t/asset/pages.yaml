  md: '# Chapter 2: Prepping Your Computer for Linux 33


    # Double-Checking Hardware Compatibility


    Most hardware these days works just fine with Linux. Okay, sometimes the latest
    whiz-bang video card or other fancy new electronic widget may run into some trouble;
    if you''re an early-adapter sort of person, check your distribution''s hardware-compatibility
    list and make sure you''re covered. If you like to be organized and check out
    hardware ahead of time anyway (or if you run into problems and want to do some
    research to see what''s wrong), check out the following:


    +   Your Linux distribution''s Web site:


    +   Fedora: There''s no official Fedora hardware list as yet. In the meantime,
    you can use the Red Hat listings at http://hardware-redhat.com/hcl/. Keep in mind
    that this list focuses on business equipment instead of home stuff and doesn''t
    entirely apply to Fedora users.


    +   Linspin: Check out www.linspin.com/windows_hwsw-compatibility.php.


    +   Mandriva: Go to www.mandriva.com/en/hardware.


    +   SuSE: The place to start is www.suse.com/us/private/support/online_help/.
    From here, click the Hardware Database link to search.


    +   Ubuntu: Go to https://wiki.ubuntu.com/HardwareSupport.


    +   Xandros: Check out http://support.xandros.com/hcl.php.


    Don''t worry about items being Certified (heavily tested to make sure they work
    properly) or not. Supported (drivers are included and the hardware is known to
    work) will do just fine most of the time. These definitions are there for enterprise
    users who need such information.


    If you''re new to computers or aren''t familiar with hardware definitions and
    details, and are drowning in technical jargon, you can find a lot of information
    about hardware on the Internet. (One good web site is www.tomshardware.com.) If
    your hardware isn''t listed, don''t panic.


    +   Other Linux-oriented Web sites: You can also check the generic Linux hardware
    list at tldp.org/HOWTO/Hardware-HOWTO/


    +   Web sites discussing your specific hardware: If you still can''t find the
    hardware listed, point your Web browser to www.google.com/linux and do a search
    on the make and model of the hardware, plus the


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_54_0.png)'
