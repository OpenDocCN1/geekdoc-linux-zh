    Figure 8-3: The Select Modem box in the Network Configuration tool.


    +   5. Select the proper device from the Modem Device drop-down list.


    If you know your modem is on COM1 or COM2 in Windows, translating this techno-talk
    to Linux isn''t hard: You just need to subtract 1. So, it''s tty50 for COM1 and
    ttyS1 for COM2. If you''re using a USB mouse (it has a flat, rectangular connector),
    your modem is probably on COM1. If you''re not using a USB mouse, your modem is
    probably on COM2.


    +   6. Select your modem''s speed from the Baud Rate drop-down list.


    If you were told to use a specific speed, choose that speed here. Otherwise, choose
    the highest number available. The key is to try the highest setting and, if that
    doesn''t work, start choosing slower and slower ones until you''re able to make
    the connection.


    Leave the Flow Control setting alone. Only change this setting if you''re having
    a hard time getting your modem connection to work, or if you''re told by your
    ISP that specifically need to select either Flow Control or No (None) Flow Control.


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_167_1.png)


    +   7. Turn on your modem volume so that you can hear what it''s doing while testing
    it.


