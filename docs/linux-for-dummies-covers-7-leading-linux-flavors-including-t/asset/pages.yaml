    Are you wondering where to find all the available options and arguments of a particular
    command? Most commands man pages, which are discussed in the "Help" section, later
    in this chapter. Another good place to turn is the --help option, available with
    many commands. Note that --help displays a list of options, but it''s nice and
    quick if you already know about an option but just''t remember exactly which one
    it is. Try it by entering the following command:


    ```

    du --help

    ```


    Cool, huh?


    # Starting Programs from the Shell


    The most obvious, but perhaps not so apparent, use of the shell is to start other
    programs. Most utilities you use in Linux are separate and distinct executable
    programs. Users need a method to start these programs. In the GUI, you can associate
    an icon with a particular program, and the graphical environment contains the
    intelligence to start the program. Note that programs often require information
    drawn from environment variables, which are a part of the shell. (I discuss environment
    variables in more detail in the section "Working with Variables," later in this
    chapter.) For this reason, the GUI often calls the intended program via the bash
    shell. So you see, even the GUI finds the shell a necessity — although the GUI
    does its best to hide this detail from users.'
