- img_proc: true
  md: '# 200 Part III: Getting Up to Speed with Linux


    # Comprehending file types


    The first letter in any long format file listing tells you which type of file
    you''re dealing with. In Table 10-1, I list the types you''re likely to run into.


    | Label | Type | Description |

    | --- | --- | --- |

    | - | Regular file | The item is an everyday file, such as a text file or program.
    |

    | b | Block device | The item is a driver (control program) for a storage medium,
    such as a hard drive or CD-ROM drive. |

    | c | Character device | The item is a driver (control program) for a piece of
    hardware that transmits data, such as a modem. |

    | d | Directory | The item is a container for files, also referred to as a folder
    in some operating systems'' lingo.


    In addition to this, you find more different file types out there in the Linux
    world. By types, I''m not referring to extensions, such as .exe or .doc. Linux
    sees everything within its filesystem — even directories and hardware like your
    monitor as "files." As a result, assigning a type to a file is merely a Linux
    machine''s way of keeping track of what''s what.


    The main thing Windows users in particular want to know when they move to Linux
    is how to recognize programs. Instead of looking for files with particular extensions
    (like .exe) programs have (or need to have) an executable permission set so the
    system knows they are allowed to run. You can view or set this permission for
    a file by going to the Nautilus or Konqueror section and looking up how to do
    so.


    On the command line, try out the file command, such as file Desktop, to find more
    about what a particular file contains.'
