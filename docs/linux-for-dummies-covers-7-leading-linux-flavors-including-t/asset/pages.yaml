  md: '# Chapter 14: Working without the GUI


    program. A pipeline may consist of several utilities plumbed together by pipes.
    At each end of this pipeline is, optionally, a redirection.


    Almost all Linux utilities that require input and output have been plumbed with
    the following common interfaces: stdin (standard input), stdout (standard output),
    and stderr (standard error). By having a common method to feed input to a program
    or read data from the output of a program, you can glue utilities together into
    sophisticated solutions.


    # Redirecting command output


    I discuss redirecting command output here because it''s far the most common form
    of information detouring. One example of output redirection involves telling a
    command to send its results to a file rather than to the screen, as you probably
    have been used to see. Start in some familiar territory by typing ls -la and then
    pressing Enter, to produce something like the:


    ```

    total 20

    dw------ 2 sue users 4096 Oct 30 07:48 .

    drwxr-xr-x 5 sue root 4096 Oct 30 11:57 .

    -rw-r-- 1 sue users 24 Oct 30 06:50 .bash_logout

    -rw-r-- 1 sue users 230 Oct 30 06:50 .bash_profile

    -rw-r-- 1 sue users 124 Oct 30 06:50 .bashrc

    -rw-rw-- 1 sue users 0 Jan 02 07:48 wishlist

    ```


    Want to send this information to a file instead? You can use the > redirection
    operator to tell bash to send the data into a file rather than onto your screen.
    Enter the following command to send the information to a file named listing:


    ls -la ~ listing


    Notice that nothing displays on the screen, as you would normally expect. That''s
    because the shell has rerouted the output to a file named listing. To verify that
    the directory listing is there, enter the following command:


    cat listing


    The cat (and more) is explained Chapter 16.


    Note that if you type ls -la ~ listing again, the data is overwritten, meaning
    that your file''s contents are wiped out and replaced with the new output. You
    can avoid this situation by using >> as your redirection operator, which tells
    bash to add the command''s output to the specified file.'
  merge: -1
