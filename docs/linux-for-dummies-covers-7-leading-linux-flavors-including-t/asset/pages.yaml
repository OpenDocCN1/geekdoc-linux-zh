  md: '# Chapter 12: Adding Software to Linux 223


    # # Updating Your Software


    In the last couple of years, updating your operating system and software in Linux
    has become easier and easier. Each Linux distribution has its own way of handling
    updates, so I cover how to update each one in its own section. The cool thing
    is that you''re actually updating your operating system and its software all at
    once. Be sure you are connected to the Internet before you try to update!


    I don''t cover how to update Knoppix, however, because if you''re using Knoppix,
    you didn''t install anything to update!


    # # Updating Fedora


    To update your Fedora Core system:


    +   1. **Select Applications:System Tools:Software Updater.**


    This action opens the Package Updater (pup) dialog box, as shown in Figure 12-1
    — you may first be asked to enter your root (administrative password). You will
    likely have to wait until the tool reaches out to the Internet and loads update
    information. When this process is complete, the progress dialog box closes.


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_244_0.png)


    **Figure 12-1:** The Fedora Package Updater.'
