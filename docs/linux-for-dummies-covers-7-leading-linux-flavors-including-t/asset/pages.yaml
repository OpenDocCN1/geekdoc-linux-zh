  md: 'Click the Get More Extensions link (if you are connected to the Internet) to
    open a Web page that lets you surf what extensions are available. If you find
    one you want to try, click the Install link underneath its description and then
    click Install Now if your version of Firefox fails in the listed range of versions
    supported (choose Help?About Mozilla Firefox to find out). Some extensions may
    give you an error and may be uninstable because of it, unfortunately.


    # Surfing the Web


    Firefox is your viewing window into the wonderful World Wide Web. Firefox''s primary
    purpose is to fetch Web pages on your command, download all your graphics and
    related files into your computer''s memory, and, finally, render the page for
    your interactive viewing pleasure.


    If you''re used to using Internet Explorer or Netscape, using Firefox should be
    a snap. All the familiar navigation tools, such as an address bar; Back, Forward,
    Reload, and Stop buttons; and a feature that stores links to your favorite Web
    sites (bookmarks).


    Firefox, like Netscape, also has a History sidebar feature — press Ctrl-H to show
    or hide it (see Figure 9-5) — which you can use to access a Web page you recently
    visited.


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_182_0.png)


    Figure 9-5: Firefox with the History Sidebar open, in Fedora Core 5.'
