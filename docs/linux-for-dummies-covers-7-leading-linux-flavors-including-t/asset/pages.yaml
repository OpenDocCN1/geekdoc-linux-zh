  md: '# # I Want to Change Screen Resolutions


    Do you want or need to swap between resolutions in the GUI on the fly? Suppose
    that you want to use 1,024 x 768, but you work on Web pages and want to be able
    to see how they look in a browser at 800 x 600 or even 640 x 480. Your machine
    is very likely already set up to do this, but you just need to know how!


    If your machine is set up for it, you can change resolutions by pressing the key
    combination Ctrl+Alt+Plus, where Plus is the big plus (+) sign on your number
    pad — you can''t use the plus sign on the main keyboard for this.


    If you''re using a keyboard without a number pad — as you will if you''re using
    a laptop — your machine isn''t set up to change on the fly, you need to change
    your resolution through your display configuration program. You can find this
    in option:


    +   - Fedora: Choose System¤Administration¤Display.

    - Knoppix Linspire: From the Main Menu, choose Control Center Peripherals¤Display.

    - Mandriva: From the Main Menu, choose System¤Configuration¤Configure your Desktop¤Peripherals¤Display.

    - SuSE: Choose Desktop¤YaST¤Hardware¤Graphics Card And Monitor Monitor.

    - Ubuntu: Choose System¤Preferences¤Screen Resolution.

    - Xandros: Choose Launch¤Control Center¤Display¤Settings.


    # # My GUI Is Hung, and I''m Stuck!


    One quick solution to this problem is the key combination Ctrl+Alt+Backspace.
    If this doesn''t do the trick, your system is in really bad shape! Try to switch
    to a virtual terminal by using Ctrl+Alt+F5. If this key combination also does
    not work, you need to reboot the machine.


    # # Help, My Machine Hangs During Boot!


    When configuring a Linux machine, you may encounter problems with the /etc/grub.conf
    file. This file indicates the operating system or systems to which your system
    can boot, and the file also contains Linux start-up settings. Linux can boot from
    any of your hard drives — not just the master IDE'
  merge: -1
