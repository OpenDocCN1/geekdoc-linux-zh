    # Listening to Internet Radio


    Listening to Internet radio stations in Linux is not always the simplest thing
    in the world, depending on your distribution. Because of various laws, patents,
    and licensing problems, some formats like MP3 are not always supported out of
    the box. The best way to set you up to support right now is to simply try and
    listen. After you''re sure that your sound is set up properly, you can try many
    Web sites with your default browser.


    +    * SHOUTcast for finding links to thousands of online stations, at www.shoutcast.com


    +    * Radio-Locator for finding "regular" radio stations offering online versions,
    at www.radio-locator.com


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_363_1.png)


    In Linspire''s Lsongs, SHOUTcast stations are already available by default.


