  md: '# # Linux For Dummies, 7th Edition

    ### Cheat Sheet


    # ## Getting Help


    | Command | Description |

    |---|--|

    | apropos [keyword] | Search a database for commands that involve the keyword.
    |

    | info [command] | Display a file''s help information in an alternate format.
    |

    | man [command] | Display a file''s help information. |

    | whatis [command] | Display a short blurb about the command |


    # ## Accessing and Removing CDs/DVDs by Hand in Fedora, Mandriva, and SuSE


    | Distribution | Action | Process |

    |---|---|--|

    | Mandriva | Accessing | If you''re in the GUI, Mandriva should select the CD
    automatically as it''s inserted. |

    | | Removing | If you''re at a command prompt, issue mount /mnt/cdrom |

    | | If you''re in the GUI, right-click on the CD icon on your desktop and choose
    Eject.

    | | | If you''re at the command line, utilize umount /mnt/cdrom to remove the
    CD from your filesystem and manually eject it. |

    | SuSE and Fedora | Accessing | In Fedora, if you''re in the GUI, the media should
    be automatically detected.

    | | | If you''re at the command line, try starting mount /media/cdrom. If this
    doesn''t work, then in the /media directory. You may need to use /media/cdrecorder,/media/dvrecorder,
    or some other variant.

    | | Removing | In SuSE''s GUI, right-click the CD icon and select Eject from the
    context menu.

    | | | On the command line, type umount /media/cdrom, where you would change cdrom
    to whatever you had to mount the item. |


    # ## Distribution Help Pages


    To find help distribution of choice, go to:


    +   - Fedora: The Fedora Documentation Project (http://fedora.redhat.com/docs/)
    is still quite new, but its collection should grow over time. In addition, there''s
    the Fedora Forum (www.fedora.org), Fedora News (www.fedanews.org and the Official
    Fedora FAQ (www.fedorafaq.org)

    - Klopp: The main functions and documentation are at www.knoppix.net

    - Linsphere: The official Linsphere support page is http://support.linspire.com.
    Be sure to examine all the links; you can find lots of help pointers here.


    +   - Mandriva: The official Mandriva documentation page is http://frontal2.mandriva.com/en/support,
    and there''s an additional help site at MandrivaExpert.com.

    - SuSE: The official SuSE support page is www.novell.com/support/products/selinux.

    - Xandros: The official Xandros support page is http://support.xandros.com/.

    - Ubuntu: The official Ubuntu support page is www.ubuntu.com/support.


    # For Dummies: Bestselling Book Series for Beginners'
