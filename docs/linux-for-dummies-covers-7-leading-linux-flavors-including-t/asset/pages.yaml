    > Ford, you''re turning into a penguin. Stop it!


    Arthur Dent


    Welcome to the world of Linux, the operating system developed by a thousand people
    around the world! In this chapter, you find out about Linux itself — what it is,
    where it comes from, and why it gets so much attention in the news these days.
    Prepare to have your assumptions about how software must be developed and sold
    challenged, and have your mind opened to new possibilities.


    # Is Free Really Free?


    Understanding Linux requires a radical shift of thought regarding the way that
    you acquire and use computer software.(Note: By radical, I mean getting to the
    root of the matter, rather than putting on beds and camping out in the administration
    building.) Your first step toward shifting your mind set is to alter your general
    connotation of the word free to represent freedom, rather than free lunch. That''s
    right; you can sell "free" software for a fee ... and you''re encouraged to do
    so, as long as you relay the freedom to each recipient of the software.


    Don''t scratch your head too; these concepts are tough to grasp initially, especially
    when you consider the conditioning you''ve received from the market departments
    of the commercial software industry. You don''t'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# 10 Part I: Getting Your Feet Wet


    know that when you purchase most proprietary, shrink-wrapped software, you don''t
    actually own the software; rather, you''re granted permission to use the software
    within the bounds dictated by the licensor.


    Linux also has a license, but the motives and purpose of the license are much
    different from those of most commercial software. Rather than use the license
    to protect ownership of the software, the GNU General Public License (GPL) that
    is licensed under ensures that the software will always be open to anyone. No
    company can ever own or dictate the way in which you use or modify Linux — though
    they can their own individual copyrights and trademarks on their various brands
    of it, like Red Hat, you already own Linux, and you can use it for anything you
    like, as long as you propagate the GPL freedoms to any further recipients of the
    software.


    # Linux: Revolution or Just Another Operating System?


    Contrary to popular belief, penguins are not the salvation of modern technology.
    Neither do they throw parties for the urban proletariat.


    > Author note: Cute quote . . obviously Anonymous has never been to a Linux convention!


    Before going any further into Linux, I need to get some terminology out-of the
    way.


    Tux is the formal name of the mascot penguin that represents Linux. Rumor has
    it that Linux''s creator, Linus Torvalds, is rather fond of these well-dressed
    inhabitants of the Antarctic.


    An operating system is the software that runs your computer, handling all interactions
    between you and the hardware. Whether you''re writing a letter, calculating a
    budget, or managing your recipes on your computer, the operating system provides
    the essential air that your computer breathes. Furthermore, an operating system
    isn''t just one program; it consists of hundreds of smaller programs and utilities
    that allow us humans to use a computer to do something useful. You then run other
    programs (such as your word processor) on top of the operating system to get everything
    done.


    In recent technological history, Linux has evolved from water-cooler techie chatter
    to a rock-solid solution for the business enterprise. The same software that was
    once dismissed as rogue is now being adopted and promoted by industry leaders
    such as IBM, Hewlett-Packard, Motorola, and Intel. Each of them with'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Chapter 1: Getting Acquainted with Linux


    these computer manufacturers has, in some way, determined Linux provides value
    for their customers (as well as for their operations). Of these companies, the
    only one that has publicly denounced Linux is Microsoft. Note that one doesn''t
    have to look very far to conclude that Microsoft is merely running scared from
    the threat that Linux poses to its waning monopoly on personal-computer operating
    systems.


    Linux has been accused of "just another operating system." On the surface, it
    may appear so, but if you look deeper, you can see that this isn''t so. The Linux
    Project is a flagship leading the current trend toward open source and free (as
    in freedom, not beer) software within the computing industry. A rock-solid operating
    system because of the model under which it was (and continues to be) developed,
    Linux represents much that is good and pure in software development.


    Two fundamental distinctions separate Linux from the rest of the operating system
    pack:


    +   * Linux is licensed under the unique and ingenious GNU Public License, which
    you can read about in the next section.


    +   * Linux is developed and maintained by a worldwide team of volunteer programmers,
    working together over the Internet.


    Linux is great for many reasons, including the fact that the folks who built it
    from the ground up wanted it to be


    +   * Multiuser: More than one user can be logged in to a single computer at one
    time.


    +   * Multiprocess: True preemptive multitasking enables the operating system
    core to efficiently juggle several programs running at once. This is important
    for providing multiple services on one computer.


    +   * Multplatform: Linux currently runs on 24 platforms (hardware types), including
    Intel-based PCs, Digital/Compaq Alpha, PowerPC-based Apple Macintosh, Sun SPARC,
    Amiga, and StrongARM-based computers.


    +   * Interoperable: Linux plays nice with most protocols (languages) and operating
    systems, allowing you to interact with users and computers running Windows, Unix,
    Novell, both Mac OS 9 and the generation beginning with OS X, and other, more
    niche groups.


    +   * Scalable: As your needs grow, you can rely on Linux to grow with you. The
    same Linux operating system can run on a desktop computer or a very large, industrial
    strength server.


    +   * Portable: Linux is mostly written in the C programming language. C is a
    language created specifically for writing operating system-level software and
    can be readily ported (translated) to run on new computer hardware.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# 12 Part I: Getting Your Feet Wet


    +   - Flexible: You can configure the Linux operating system as a network host,
    router, graphical workstation, office productivity PC, home entertainment computer,
    file server, Web server, cluster, or just about any other computing appliance
    that you can think of.


    +   - Stable: The Linux kernel (the operating system) has achieved a level of
    maturity that most software developers envy. It''s not uncommon to hear reports
    of Linux servers running for years without crashing.


    +   - Efficient: The modular design of Linux enables you to include only the components
    needed to run your desired services. Even older Pentium computers can utilize
    Linux and become useful again.


    +   - Free: To most people, the most intriguing aspect of Linux is the fact that
    it''s often available free of charge. How (the capitalists murmur) can anyone
    would build a better mousetrap no incentive of direct monetary return?


    In this chapter, I intend to answer that last question for you. I also hope to
    paint a picture of the open source software development model that created Linux.


