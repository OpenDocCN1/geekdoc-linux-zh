  md: 'When you plug in a USB storage device such as a keychain, Fedora auto-mathematically
    adds an icon onto your desktop for that item, which you can double-click to open.
    After you''ve finished working with the USB device, close all the windows that
    you were using, right-click it on the desktop, and choose Unmount. Now it''s safe
    to remove the keychain. It is vital that you unmount a device before just removing
    it; you might lose data otherwise.


    When you insert a CD, Fedora opens a music player and begins playing it.


    When you insert a video DVD, Fedora will attempt to load and play the DVD, but
    you may need to add more software to make this feature work for legal reasons.
    See Chapter 18 for more information.


    To change how Fedora handles all these items, choose System:Preferences=Removable
    Drives and Media. If you shut off auto-loading for something, you can access a
    device''s contents from Nautilus window by choosing Places=Computer and double-clicking
    the appropriate icon here. This action adds an icon onto your desktop.


    When you insert a blank CD or DVD writeable or rewritable, Fedora opens Nautilus
    to the CD/DVD Creator window. (You can find out about burning in Chapter 18.)


    When it comes to floppy, the computer can''t reliably detect whether a floppy
    was put into the drive. So, put the floppy into the drive, choose Places=Computer,
    and then double-click Drive to access the disk''s contents and add a floppy icon
    on your desktop. To remove the floppy, right-click the floppy icon on your desktop
    and choose Unmount Volume. Wait until the floppy drive light is off before removing
    the floppy.


    If you to access a network drive from Windows or if someone has set up on another
    Linux computer, and the ability to share has already been up, choose Places=Network
    Servers. This action lets you browse through your network to the computers that
    are offering files.


    If you want to access part of your Linux filesystem, choose Places=Computer and
    then double-click the Filesystem icon.


    Access something on one of your hard drives that isn''t part of your Linux installation
    (maybe a Windows drive).


    For the last option listed, follow these steps:


    +   1. Open a command terminal.


    See Chapter 14 if you''re not sure how to do so.


    +   2. Type su – and press Enter to become the root (administrative) user.


    You will be asked to enter the root password. Do so when prompted and press Enter.


