    # Where to Go from Here


    This is when you pick a direction and hit the road! Linux For Dummies, 7th Edition,
    is much like 1001 Nights because it almost doesn''t matter where you start out.
    You look at lots of different scenes and stories as you prepare to build your
    own Linux system. Although each story has its own distinctive characters and plot,
    the whole is surely something to marvel at. Don''t worry — you can handle it.
    Who cares whether anybody else thinks that you''re just fooling around? I know
    that you''re getting ready to have the time of your life.


    Enjoy!'
