    dialog box, click Sign On to log into all the accounts that you selected as Auto-Login.
    You can also open the Accounts dialog box by clicking Accounts from the main dialog
    box and then clicking the individual check boxes next to the accounts to log them
    one by one. After you connect, you can alter your preferences in the Buddy List
    dialog box by choosing Tools-Preferences. Again, GAIM has more to it than this,
    so it''s definitely worth playing around with this.


    # Troubleshooting your IM connections


    If you''ve been using most of these IM clients with other operating systems, after
    your Linux system has successfully connected to the IM service, your existing
    buddy lists are automatically imported. If you haven''t ever used AIM or MSN,
    you can now set up buddy lists. Buddy lists contain the usernames of people you
    want to communicate with through the instant messaging service. Your buddy list
    lets you know when your "buddies" are online and available to receive an instant
    message.


    Sometimes, your Linux system is unable to connect properly to the IM service.
    When this problem happens, an error message pops up on your screen and indicates
    a failure to connect. You may be unable to connect to the IM service for several
    reasons:


    +   You may have entered the wrong password for your IM account or chosen the
    incorrect IM account name.


    +   Your computer may not be connected to the Internet. Try opening your Web browser
    to see whether you can get to a Web site, which tells you whether you''re connected
    to the Internet.


    +   If you can open a Web site but can''t get IM to work, the IM system may be
    unavailable. This problem occurs at times because of maintenance of the IM service
    or an excessive amount of traffic on the Internet or on the IM service.'
