- img_proc: true
  md: '# 358 Part IV: Getting Things Done


    If you do find that you actually need to run a Windows program under Linux, you
    have both commercial and free options available, although you have far more commercial
    options. This chapter looks at both possibilities so you can choose what meets
    your needs.


    # Commercial Software


    A growing number of commercially available tools let you work with anything from
    Microsoft Office to your Windows games under Linux. Mind you, ultimately the Linux
    user''s goal is to not have to use any of these extra layers — but in the meantime,
    it''s nice not to be inconvenienced. I reviewed, or at least used, every one of
    these products (often more than once over the years), I''m not just going by their
    Web sites.


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_379_0.png)


    Many of these vendors offer server, as well as desktop products. I''m focusing
    on the desktop. For more about their server products, check out their Web sites.


    # CodeWeavers


    CodeWeavers (www.codewavers.com) provides an excellent product that I use from
    time to time: CrossOver Office. This program allows you to use Microsoft Office
    (along with a growing number of office applications) directly under Linux. It
    also comes with a hefty number of plug-ins (see Figure 19-1) that you might miss
    when it comes to Web Surfing. It''s a bit jarring to run Microsoft Word and Windows
    Media Player under Linux at first — because there''s no *native* (with special
    software) way to do this otherwise — but it''s certainly handy. You can even use
    the iPodss iTunes through CrossOver Office!


    What I most appreciate about CodeWeavers (and all these companies, really) is
    that they are very upfront about what works well, what works except for a few
    features, and what doesn''t work. All you have to do is check their Web site.
    For those who always seem to want "piracy" when it comes to Linux, you actually
    do have to run the programs you want to run (say, Microsoft Office) and install
    them through CrossOver Office off their original CDs or DVDs. However, you don''t
    have to own the version of Microsoft Windows the software would run under. CodeWeavers
    has built a implementation of the necessary Windows functionality under the hood.'
