  md: '# Chapter 8


    # Connecting to the Internet


    In This Chapter


    +   - Understanding common Internet connection methods

    - Setting up your Internet connection

    - Connecting to your Internet Service Provider (ISP)

    - Understanding enough TCP/IP to be dangerous


    > Every improvement in communication makes the bore more terrible.


    Frank Moore Colby


    you may already be connected to the Internet if you''re on a machine that''s connected
    to a LAN and you''ve configured the networking during installation. To test whether
    you have a connection, open up a Web browser and try to go to an outside Site
    (like www.gnu.org). If it works, you''re up! No need for this chapter. Otherwise,
    read on.


    # Internet Connectivity 101


    A few words regarding the broadband options (DSL, and cable) are in order I begin.
    The word broadband has a technical definition, but I just use it to mean high-speed
    Internet access. Although a duplex modem can typically transmit information up
    to 56 kilob (thousands bits) per second, broadband connections can reach 50 times
    that. Nowadays, the Web contains lots of images and multimedia elements, and enjoying
    these features through a 56 Kbps dial modem is similar to drinking a cold glass
    of water when you''re dying of thirst.


    Don''t let high-speed providers discourage you from using Linux with their services.
    Just because they don''t support Linux directly doesn''t mean that the technology
    doesn''t work with Linux. TCP/IP (the set of traffic rules for the Internet) was
    developed for the Unix operating system, from which Linux descends.'
  merge: -1
  pgno: 158
- img_proc: true
  md: '# 138 Part II: Internet Now!


    If you are dual-booting to Windows, your ISP can help you install your broadband
    connection, and then you can tinker with getting Linux connected as you have the
    time and inclination. In the list, I point you to some sites that can help you
    configure your broadband connection as you look at the types available:


    +   - Cable modems: Many cable television companies have expanded their product
    lines to include Internet access over their cable infrastructure. When you subscribe
    to a cable service, the installation technician often provide you with a special
    device, a cable modem, along with a standard network adapter (like an Ethernet
    card). The technician then installs the network adapter into your computer and
    connects the cable modem to it. As far as speed goes, you need to talk to your
    cable provider. The following Web page provides a document that contains helpful
    information about various cable providers and Linux:

    www.tldp.org/HOWTO/Cable-Modem


    +   - Digital Subscriber Line (DSL): DSL carries data to your telephone jack in
    a digital format. DSL is popular because it provides a faster connection with
    lower installation and service costs than ISDN, and it utilizes the existing copper
    telephone wiring provided by your telephone company. You can even use the same
    line as a regular phone line! A DSL connection requires additional communication
    hardware, which your Internet Service Provider (ISP) should provide.


    Note that several variants of DSL exist:


    +   - ISDN (Integrated Services Digital Network) Digital Subscriber Line (ISDL)
    - see later in this section for a definition of ISDN

    - Symmetric Digital Subscriber Line (SDSL)

    - Asymmetric Digital Subscriber Line (ADSL)

    - Generic DSL (XDSL)


    You can find out from your ISP how fast your DSL connection would be, because
    it varies. For an overview of DSL and Linux, visit the following Web page:


    ```

    www.tldp.org/HOWTO/DSL-HOWTO/

    ```


    +   - Satellite modems: Those who live in partially remote or low-infrastructure
    areas might go for the route of satellite modems (www.tldp.org/HOWTO/Sat-HOWTO.html).
    You can consider this service equivalent in many ways to cable, in that it typically
    goes through the same providers that get you satellite signals.'
  merge: -1
  pgno: 159
- img_proc: true
  md: '# Chapter 8: Connecting to the Internet 13


    However, satellite has some drawbacks. If your satellite television is unreliable,
    your Internet service suffers the same fate. The upload and download speeds can
    also vary dramatically.


    +   - Dialup modem: The dialup modem is still widely used in areas where broadband
    is neither available nor affordable. It translates the digital signal from the
    computer into an analog signal required for transmission from the wall jack to
    the telephone company. Because the modem utilizes voice phone service, you don''t
    need any special setup subscribing to an ISP. You can''t use the same phone line
    for both dialup and a phone conversation at the same time. See the sidebar "Beyond
    desktop: posing as modems" for additional connections if you''re using the dialup
    route


    +   - Wireless: The realm of wireless networking is where Linux today may give
    you the most, depending on what kind of wireless you''re using. Four major types
    of wireless exist, and they''re often referred to as a group as WiFi (802.11a,
    802.11b, and 802.11g or just A, B, G, and Bluetooth), A and B are also the best
    supported in Linux so far, they have been around the long. G''s security is what
    you should aim for, but it also adds levels of complexity that require more cooperation
    from the manufacturers of the cards. Many wireless cards today are, in fact, capable
    of doing more than one of these types, so if you don''t get one, get one that
    supports both B and G.


    The best advice I can give here is to do a Web search on the make and model of
    your wireless card (or the one you''re thinking of buying), plus the word Linux,
    and see what you find — and, of course, because the hardware compatibility pays
    for the distributions as well. This area is one where technology is quickly advancing;
    always check the dates on the resources you find and make sure they''re recent
    Even six months old can mean you''re getting out-of-date information. Some useful
    links (some are more advanced than others) for this topic include the following:


    +   - Posting on my blog for Fedora users, apologies for the long URL: http://dee-ann.blog-city.com/wireless_setup_on_an_emachines_m5310_notebook.htm


    +   - The Linux Networking Quick HOWTO: www.linuxhome-networking.com/linux-hn/wmp11-linux.htm


    +   - Wireless LAN resources for Linux: www.hpl.hp.com/personal/Jean-Tourrilhes/Linux/


    +   - A method for using wireless drivers in Linux: www.linuxant.com/driverloader


    +   - Network Topology Guide: www.homenethelp.com/network'
