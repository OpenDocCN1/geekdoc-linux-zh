  md: '# Part III: Getting Up to Speed with Linux


    # Changing GNOME''s Look and Feel


    Change is inevitable, except from a vending machine.


    — Anonymous


    The GNOME desktop environment has an amazing set of features for you to explore.
    Some of these customization features are nice and practical, and others are just
    plain fun. I tried to group the types of changes into related topics so that you
    can peruse them easily. In GNOME-based distributions (Fedora, SuSE, and Ubuntu),
    you can typically find all the GNOME configuration options by going to the System
    or Desktop menu and then the Preferences submenu.


    # How do ya like them applets?


    Applets are a collection of miniprograms that do anything from displaying the
    time to show status — some can even show the depressing trickle of your battery
    power running out if you''re using a laptop. Sure, some of these miniprograms
    are more useful than others. Then again, everybody needs a bit of entertainment
    too, right?


    # Adding an applet icon to the panel


