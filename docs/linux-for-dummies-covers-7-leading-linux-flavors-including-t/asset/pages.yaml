  md: 'Chapter 7: Configuring Linux 127


    # Zen and the Art of Linux Configuration


    One of the items that makes each distribution stand apart from the others is its
    collection of configuration tools. The friendlier the tools, the more likely that
    folks new to Linux will flock to that distribution. Mind you, old-timers don''t
    mind having easy tools around either, especially when they''re moving from one
    distribution to another. It saves them from having to re-learn where each distribution
    keeps its configuration files.


    In this section, I look at the configuration tools available in each version of
    Linux covered in this book. An important thing to note is that the Control Panels
    in each of the KDE-default distributions (Knoppix, Mandriva, Linspire, Xandros)
    all look (and work) in very similar manners because they''re based on the main
    KDE Control Panel.


    # Fedora Core and Red Hat tools


    Red Hat''s Fedora community project comes with a number of tools developed by
    Red Hat for its commercial products, as well as a variety of tools built by the
    community, such as the GNOME Project''s tools. When it comes to customizing your
    desktop, you can find most of what you''re looking for by choosing SystemPreferences.
    Instead of having a large control center, GNOME has kept the configuration tools
    broken into smaller, individual programs. You find this layout in other GNOME
    installations as well.


    Keeping with the theme of smaller, more specialized tools, your various system-wide
    configuration options are available by choosing SystemAdministration.


    # Knoppix tools


    Knoppix comes with so many tools that it''s easy to get lost as you stagger around
    the menus, overwhelmed. The main place to find configuration tools in this distribution
    is by Knoppix from the Main Menu (the letter K in the bottom left corner). Inside
    this menu is a set of submenus, some of which offer options:


    +   - Configure: Options for setting up your computer''s sound card, printers,
    a real home directory that sticks around between the times you boot with this
    distribution (persistent Knoppix disk image), and more.


    +   - Network/Internet: Internet connection (see Chapter 8) programs for everything
    from modems to ISDN.'
  merge: -1
