  md: '# # Appendix B


    # # About the DVD-ROM


    The DVD-ROM included with this book contains everything you need to install and
    run Fedora Core 5. This is the equivalent of the four CD-ROMs you would have to
    download from the Fedora Project''s Web site and includes the following:


    +   - Fedora Core 5: A complete copy of the software for the latest and greatest
    version of the Red Hat-sponsored free version of Linux, for your computing pleasure.
    If you are interested in the source code, you can download it directly from Red
    Hat''s Fedora Project site at http://fedora.redhat.com. We thought that you might
    not mind using the space that would have gone to multiple CD''s worth of source
    code to include lots and lots of other software!

    - RPM (Red Hat Package Manager): The Red Hat software distribution and installation
    management environment, wherein Linux updates and new facilities are packaged
    for easy installation on your Linux machine.

    - KDE (the K Desktop Environment) and GNOME (GNU Object Model Environment): The
    two leading graphical interfaces for Linux. You can pick the one you like best!

    - Mozilla Firefox: The best-of-breed Web browser for your Linux and Samba: The
    best way to integrate Linux servers with Windows users. Samba lets your Linux
    machine masquerade as a Windows server so that Windows users can grab files and
    print documents hassle free.

    - Apache Web Server: The world''s most popular (or at least, most frequently used)
    Web server software.

    - Games!: Tons of games; enough to help you procrastinate for weeks!

    - OpenOffice.org: A full-featured and popular office suite.


    If you don''t have a DVD-ROM drive, send in the coupon in the back of this book
    to Wiley Publishing, Inc. to receive the complete CD set. (See coupon for details.)


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_416_0.png)'
  merge: -1
  pgno: 416
- img_proc: true
  md: '# 396 Part VI: Appendixices


    +   - The popular Knoppix 4.02 LiveCD


    +   - The full version of Linspire Five-0, which you would normally have to buy


    +   - A LiveDVD (see Chapter 4 for an explanation of a LiveDVD) version of the
    popular SuSE Linux 10 distribution


    +   - The "open circulation" (free) version of Xandros 3


    +   - The full, free version of Mandriva 2006; another popular distribution


    (Chapters 1 and 4 for more information on these distributions.)


    Both the Xandros and Mandriva ISO images are zipped, meaning that they are files
    that end in .zip. Zip files are compressed, and you can open them in Windows by
    double-clicking and using the built-in compression tool, or by downloading WinZip
    (www.winzip.com) to do the work for you. Once you have these files unzipped, you
    can handle them just as you would any other.


    For Fedora and Knoppix, you can use these directly off the DVD-ROM. The others
    can use your own CD burning software and (legally) use it to write the ISO to
    CDs. While Ubuntu is covered in this book, there was no room for it on the DVD-ROM.
    Chapter 4 explains where to download this distribution.


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_417_0.png)


    Make sure that you tell your CD burner you''re working with ISO images (also the
    option "image\ If you burn the CD and find that it contains one big file (the
    ISO file), it will not work. The ISO image actually contains all the files that
    would be on the CD, so if you put the CD in and find that it contains many files,
    the CD was created properly.


    # System Requirements


    Make sure that your computer meets the following minimum system requirements.
    If your computer doesn''t match up to most of these requirements, you may have
    problems when using the contents of the DVD-ROMs:


    +   - A PC with an Intel-compatible Pentium-class processor: I recommend a 400
    MHz Pentium IV or better for using Graphical mode, although for a heavy-use desktop
    system, "more is better."


    +   - At least 256MB of RAM: You need at least 192MB of RAM for Graphical mode.
    (Linux can handle as much RAM as you fit into a typical PC, and more is almost
    always better than less.)'
  merge: -1
  pgno: 417
- img_proc: true
  md: '# Appendix B: About the DVD-ROM 397


    +   At least 1GB of hard drive space: I recommend 10GB if you want to install
    all the software from the DVD-ROM. You need less space if you don''t install every
    program, but you should go ahead and make 10GB of space available, to give yourself
    more options and room for file storage. Again, more is better.


    +   A DVD-ROM drive-speed (2x) or faster: The faster the DVD-ROM drive, the faster
    your installation experience. A coupon is offered in this book if you need to
    order CDs to replace the DVD.


    +   Just about any VGA monitor: Just about any monitor does the trick, but you
    want one that''s capable of displaying at least 256 colors or grayscale.


    +   A keyboard and a mouse: You need both items so you have a way to communicate
    with your Linux system and tell it what to do!


    +   Some kind of network connection: As, the faster your Internet connection,
    the less time it takes to update your installation to the most recent versions.
    I use a cable modem for my Internet connection, and I liked the increased speed
    when it comes to dealing with the many and varied sources of Linux software and
    updates online. See Chapter 8 on the various ways to connect to the Internet.


    If you need more information on PC basics, check out PCs For Dummies by Dan Gookin
    (published Wiley Publishing, Inc.).


    # Using the DVD-ROM


    You can take either of two basic approaches to using the Fedora Core installation-DVD-ROM.
    I cover each one in separate step-by-step lists. I tell you in this section how
    to pick which set of instructions to follow. The two ways to use this DVD-ROM
    are shown in this list:


    +   If you can boot from your DVD-ROM drive (which probably means that you have
    a newer PC), follow the instructions in the following section.


    +   If you cannot boot from your DVD-ROM drive, for whatever reason, you may want
    to use the coupons included in this book to obtain CD-ROMs, or to download and
    burn CD-ROMs yourself as discussed in Chapters 3 and 4.


    # Booting from the DVD-ROM


    To install items from the DVD-ROM to your hard drive, follow these steps:


    +   1. Insert the DVD-ROM into your computer''s DVD-ROM drive.


    +   2. Reboot your PC.'
