    To surveying a few of the shell capabilities, I need to tell you about another
    method for starting a shell session. First of all, notice that your shell prompt
    is merely a window that is part of your GUI desktop. Suppose that you want to
    start a shell session in a character-only or text environment.


    To switch to a text environment, press Ctrl-Alt+F2. Don''t be alarmed when your
    familiar graphical desktop disappears. It''s still running in the background,
    and you can get back to where you left off in a moment. But first, a few words
    about the boring text screen you''re looking at now (I hope).


    You''re looking at a virtual terminal, one of several available with your default
    installation. You probably see something like this:


    catherine login:


    Go ahead and type your username and password, which you''re prompted for. You
    see a message indicating your last login date followed by the bash prompt:


    ```

    [dee@catherine dee]$

    ```


    Notice the similarity between this prompt and the open window you left behind
    the GUI desktop. Both prompts are an indication that you have a bash session open.
    Note, although it''s accurate to say they''re both the results of using the bash
    shell, they''re distinct and separate instances of the same program. In other
    words, the environment you''re working with here is exclusive of the bash environment
    you have open in the GUI terminal window.


    Are you wondering where your GUI desktop went? Just to settle your nerves a bit,
    do some jumping around. The GUI desktop is located at virtual terminal (VT) number
    7 by default. You now have VT-2 open. Position your piano-playing fingers and
    strike the Ctrl-Alt-F7 (if this doesn''t work, try Ctrl+F7). Within a second or
    two, your screen will flash and return to your graphical desktop. Neat, huh? And
    guess what? The bash session you left on VT-2 is still there; you never logged
    out. Go back again by pressing Ctrl+Alt+F2. Voila!— right where you left it. Feel
    free to jump back and a few times and try some other VT (F1 through F6). Whoopee!
    This virtual terminal scrolls.


    Okay, when you have grown weary and bored with this little trick, exit (literally,
