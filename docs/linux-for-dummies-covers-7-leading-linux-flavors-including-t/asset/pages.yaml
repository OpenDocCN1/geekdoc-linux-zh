  md: '# “I Think I’m in Linux, but I Don’t Know What to Do!”


    Two different scenes tend to cause panic to folks new to Linux. The first of these
    scenes, shown in Figure 20-1, is in fact a sign that you installed the software
    and booted the machine successfully. Jump for joy! It''s just that you''re booting
    into the command-line environment rather than the GUI environment. If you reach
    a screen similar to the one shown in Figure 20-1, the computer is asking you to
    log in with the username for an account and a password that you created during
    the installation process.


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_393_0.png)


    Figure 20-1: A Linux command-line prompt.


    If you created only the root account, you can log in there as root.


    After you enter the username and password, you find yourself at the screen shown
    in Figure 20-2, which just happens to be the second spot where people get worried.
    If you see this screen, you have not only booted properly into Linux, but you''re
    also logged in screen and using the machine! Give yourself a good pat on the back.


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_393_1.png)


    Figure 20-2: Logged in at the Linux command line.'
  merge: -1
