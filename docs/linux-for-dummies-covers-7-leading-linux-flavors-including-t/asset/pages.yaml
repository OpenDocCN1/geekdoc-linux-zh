  md: '# Chapter 8: Connecting to the Internet


    # Connecting to (And Disconnecting

    from) the Internet


    To connect to the Internet from the Fedora Core Network Configuration dialog box,
    highlight the modem entry you just created (see preceding sec-tion) and click
    the Activate button. With any luck, your modem springs to life with some beeps
    and buzzes along with a dialog box indicating that a connection is being made.
    After a successful connection, the Network Configuration dialog box appears again;
    this time, the Status column of the modem device reads Active. Congratulations
    — you''re now connected to the Internet!


    To disconnect, click the Activate button in the Network Configuration dialog box.
    the next time you want to connect, just open this dialog box and click Activate.
    If all is not well, skip to the next section, “It''s All Fun and Games Until Something
    Doesn''t,” to find out how to get help.


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_170_0.png)


    Readers using other distributions should use that distribution''s connection tool.
    You may find that double-clicking your Web browser''s icon and trying to go to
    a site activates your connection.


    # It''s All Fun and Games Until

    Something Doesn''t Work


    In a perfect world, the dialup configuration steps in the preceding section would
    work 100 percent of the time. The Linux vendors have truly hidden all the mystery
    that has traditionally surrounded networking. Unfortunately, in many situations
    (mostly related to modems and hardware), a simplified configuration doesn''t work.
    If you can''t connect to the Internet after following these steps, an excellent
    site to find is LinuxQuestions.org (www.linuxquestions.org). And well, I know
    — you''ll have to use a computer that already has internet access to get that
    help (Catch-22, anyone?). It''s simply impossible to anticipate the wide range
    of problems people can run into, and the Linux community is your best bet; this
    site is well known for its helpful community members.


    Also, go to your favorite Web-search site and search on the error message you''re
    getting from the system — or it doesn''t hurt to add the network hardware''s make
    and model and the name of your distribution as well if just the error message
    isn''t working. When you''re trying to figure out what''s wrong with your network
    connection — or trying to gather information that can


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_170_1.png)'
