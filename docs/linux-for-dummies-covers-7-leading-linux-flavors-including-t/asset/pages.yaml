    A plus to Cedega is, again, that you don''t need to keep those Windows (OS) CDs
    lying around. However, its support for individual games can be spotty, so be sure
    to check the Web site before you invest in this product. Also, be sure to make
    use of the help forums!


    # VMware


    If you absolutely have to do something under Windows itself but only have one
    computer and it''s running Linux (or vice versa, for that matter), there''s also
    VMware (www.vmware.com). This is a popular tool in technical support offices where
    people need access to many different kinds of machines to test things. It''s also
    popular with authors, like myself, because it allows us to grab those tricky screenshots
    of the boot process and installer screens.


    In VMware, you run a full session of another operating system (or even an extra
    session of the one you''re running on the main machine) within your desktop —
    see Figure 19-4. If your machine is powerful enough, you could have five different
    operating systems all running in their own windows on a single computer.'
