  md: '# 296 Part IV: Getting Things Done


    Of course, the file contains more than a screen''s worth of information, cat spews
    it out at one time like a big hairball, and all but the last screen of text scrolls
    off the screen. It''s a good thing that you have some other choices. The one you''re
    likely to choose is less, displays the contents of a full screen at a time. Then
    you press the spacebar to continue to the next screen. You can also use the arrow
    keys to move up and down one line at a time, if you want.


    An alternative to less is more. The main difference between the two is that with
    more, you can move only forward through the file and see only a screen''s worth
    of information at a time. You can''t back up.


    To use either less or more, the format is similar to the format used with the
    cat command: less filename or more filename. When you finish reading the document,
    press Q to exit.


    # Editing Text Files with nano


    If you aren''t using (or can''t) the GUI, then you have numerous text editors
    available to you. The most powerful of these are vi and emacs, which you''ll hear
    many people go about. However, both programs require a learning curve. For beginners
    who want to just edit the dang file and move over, I recommend nano and pico.
    These two editors are very similar, and the other is typically included with most
    Linux distribution (but, unfortunately, not all). The "friendly" text editors
    included with the distributions discussed in this book


    +   - Fedora: nano

    - Knopp: nano in the DVD version only - joe is included on the CD

    - Linspire: None; see Chapter 12 to add nano through CNR

    - Mandriva: None; see Chapter 12 to add one (jed and joe are both available)

    - SuSE: pico

    - Ubuntu: nano and pico

    - Xandros: editor, which has a menu of function keys at the bottom of its screen


    To open a file in nano, type nano filename, such as nano file1. This action opens
    the file in the nano editor, as shown in Figure 16-1.


    You can then edit or type in that file as much as you need to.'
