  md: '# In this part ...


    In this part of the book, I expand my coverage of Linux beyond what''s part and
    parcel of the operating system to include its many other facilities and capabilities.
    These components are critical to making Linux the raging monster of productivity
    that a well-constructed, properly configured system can represent.


    Here you read about the Linux file system and how to manage its constituent files
    and directories, as well as how to control which users or groups are permitted
    to access these vital system resources. You can also read about using the Linux
    command-prompt environment, known as the shell, along with some key capabilities
    that should be part of any savvy Linux user''s standard repertoire.


    In addition, you find out how to keep your system current and install new software.
    You also get the inside scoop on all security stuff that computer experts are
    always going on about. Those who like working without a net can dabble with working
    on the command line, while those who want nothing to do with (gasp) typing can
    leap straight to the fun of customizing the look and feel of your GUI.'
  merge: -1
  pgno: 201
- img_proc: true
  md: '# Chapter 10

    Manipulating Files and Directories


    +   **In This Chapter**

    - Toiling with filesystem contents

    - Comprehending filesystem mechanics


    > There is no need to do any housework at all. After the first four years, the
    dirt doesn''t get any worse.

    — Quentin Crisp


    There''s no avoiding it. At some point, you have to work with the files and directories
    in your system. Fortunately, after you get familiar with the rules and commands,
    you feel more comfortable (even if you find yourself being reminded from time
    to time of working in good old MS-DOS). Because many people find that working
    at the command line is easier when dealing with files, in this chapter I cover
    both the typed commands and the graphical tools you have at your disposal.


    # Working with Files in the GUI


    People who prefer to stay graphical like to work with the GUI file managers offered
    in Linux instead of having to access a command prompt to work with files. A file
    manager is a program, such as Windows Explorer, that enables you to dig through
    and manipulate your files and directories with your mouse and sometimes just a
    bit of typing. In this section, I take you on a tour of the file managers that,
    by default, come with popular Linux distributions.'
  merge: -1
  pgno: 202
- img_proc: true
  md: '# Part III: Getting Up to Speed with Linux


    # Sailin'' with Nautilus


    In the GNOME desktop environment (so in Fedora Core, SuSE, Ubuntu if you''re using
    your distribution''s defaults), the file manager is Nautilus. Moving through the
    filesystem in Nautilus involves a couple of different skills. The first place,
    you need to know where you want to begin. This decision isn''t as difficult as
    it sounds. Use the Places menu as detailed in Chapter 6 if you don''t want to
    start from your home folder, or do one of the following:


    +   - Fedora: Double-click the Computer or Home icon on your desktop, choosing
    anything from the Places menu, or choose Applications:System Tools:File Browser
