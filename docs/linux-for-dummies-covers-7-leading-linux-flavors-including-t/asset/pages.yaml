- img_proc: true
  md: '# Chapter 11: Checking Out the Linux Filesystem 217


    7. Type df -h again to make sure that this partition is no longer listed.


    In the example, you should now see:


    | Filesystem | Size Used Avail Use% Mounted on |

    | /dev/hde2 | 54G 27G 24G 54% | / |

    | none | 506M 0 506M 0% | /dev/shm |

    | /dev/hdf3 | 54G 39G 13G 76% | /mnt/FC1


    See, no reboot! If you use remount, restart type mount again to make sure it is
    listed as (ro) rather than (rw).


    8. What you type depends on what type setting /boot had:


    +   * ext2 or ext3: Type e2ffsck -fy partition, such as e2ffsck -fy /dev/hde.


    +   * reiserfs: Type reiserfs --fix-fixable partition, such as reiserfs --fix-fixable
    /dev/hde, and if this gives you more errors, follow with reiserfs --rebuild-tree
    partition, such as reiserfs --rebuild-tree /dev/hde.


    9. Type exit and let the try to reboot.


    If the machine boots, you''re done, yay! If not, return to Step 6 and run through
    the process again. Sometimes, you actually need to try the fix more than once.
    If you reboot again at the end and it still fails, proceed.


    10. Repeat Steps 1 and 4, but this time look for the lines that correspond to
    the / directory.


    In my example, / is mounted from /dev/hde2 and is formatted using ext3. Unfortunately,
    you can''t remove the /filesystem since it''s all of our commands! But, there
    is still a safe way to do this.


    11. Type mount -o remount, ro /.


    This command reloads the root (/) partition and then adds it again, but this time
    as read-only so things will be changing as you''re working on it. It makes what
    you want to do safe.


    12. Repeat Step 8 for the / partition.


    So, for my example, the partition is /dev/hde2, so you''d be starting with ext2ffsck
