  md: '# Linux For Dummies, 7th Edition


    Linux-based computer. Some sample topics you find in this book include the following:


    +   - Understanding where Linux comes from and what it can do for you

    - Installing the Linux operating system

    - Working with a Linux system to manage files and add software

    - Setting up Internet access and surfing the Web

    - Customizing your Linux system

    - Managing Linux system security and resources


    Although it may seem, at first glance, working with Linux requires years of hands-on-experience,
    tons of trial and error, advanced computer science training, and intense dedication,
    take heart! It''s not true. If you can tell somebody how to find your office,
    you can certainly build a Linux system that does what you want. The purpose of
    this book is not to turn you into a fully-blown Linux geek (that''s the ultimate
    state of Linux enlightenment, of course); it''s to show you the ins and outs that
    you need to master in order to build a smoothly functioning Linux system and give
    you the know-how and confidence to use it.


    # How to Use This Book


    This book tells you how to install, configure, and customize a Linux desktop system.
    Although you can do most things in Linux these days by pointing and clicking,
    you may still want to try using Linux at the command prompt — where you type detailed
    instructions to load or configure software, access files, and do other tasks.
    In this book, input appears in monospaced type like this:


    ```

    rmdir /etc/bin/devone

    ```


    When you type Linux commands or other related information, be sure to copy the
    information exactly as you see it in the book, including uppercase and lowercase
    letters, because that''s part of the magic that makes Linux behave properly.


    A failure to follow instructions exactly can have all kinds of unfortunate,seemly,
    or unexpected side effects.


    The margins of a book don''t give you the same amount of room as your computer
    screen; therefore, in this book some URLs and lengths at the command prompt may
    appear to the next line. Remember that your computer sees these wrapped lines
    as a single set of instructions, or as a single URL — so if you''re typing a hunk
    of text, keep it on a single line. Don''t insert a hard break if you see one of
    these wrapped lines. I clue in you that it''s'
