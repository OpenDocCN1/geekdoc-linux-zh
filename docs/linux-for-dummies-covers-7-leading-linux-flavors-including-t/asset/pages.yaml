  md: '# Chapter 4


    # # Installing Other Linux Distributions


    In This Chapter


    +   - Kick-starting Linux with Knoppix

    - Loving Linspire

    - Demystifying Mandriva

    - Getting to know SuSE

    - Utilizing Ubuntu

    - Zapping your brain with Xandros

    - Utilizing LiveCDS and LiveDVDs

    - Discovering even more Linux!


    A quick read in any of the chapters in this book should give you the picture that
    Linux is more than just some newfangled computer program. Linux is a fully equipped
    workshop of software tools and building materials that you can use to construct
    any of a wide spectrum of computing solutions. Developing the killer Linux distribution
    has been the Holy Grail of the Linux community. This ultimate Linux distribution
    would provide all the support and capability that the preschooler, the rocket
    scientist, the housewife, and the crotchet old computer science professor would
    need to harness the power with Linux.


    However, it''s just about impossible to make something that makes absolutely everyone
    happy. In this chapter, I survey five of the most popular (and easiest-to-install)
    distributions. Some of these are commercial products, so if you''re considering
    getting one of them, my hope is that chapter helps you decide which one (if not
    Fedora) meets your needs. I don''t cover every aspect of the commercial items
    (such as how much support you get); for more information, see the distributions''
    respective Web sites.


    Occasionally in this chapter, I mention mentioning "ISO image" onto a CD-ROM or
    DVD-ROM — an image is a file whose name ends in .iso and which holds the contents
    of a CD or a DVD. When this subject comes up, refer to the sidebar *Burning the
    ISOs* for tips.'
