    # Deciding Which Interface to Use


    Linux has two interface types: the command-line interface (CLI) and the graphical
    user interface (GUI). If you use other computer systems, such as Windows or the
    Macintosh, you''re already familiar with a GUI, with its pictures to look and
    click. Most Linux distributions include different versions of one of the two main
    GUIs available in the Linux world (GNOME and KDE).'
