    # Tweaking the GUI''s Innards


    Behind GNOME and KDE lurks the X Window System, or "X." X provides the skeletal
    GUI structure and functionality. GNOME and KDE de make use of this skeleton to
    provide you with a pleasant GUI environment. Whenever you configure hardware or
    other basic GUI features like resolution, you actually work with X, and not GNOME
    or KDE.


    One of the /etc/X11/xorg.conf files contains your X configuration. (All three
    files look the same inside but you should only have one.) Although this file is
    just a normal text file, the format is complicated and confusing. Rather than
    make you work with this file by hand, the various Linux distributions provide
    a number of tools. (See Chapter 20 (or which tool comes with which distribution).


    If you enjoy experimenting with GUIs and fiddling with them, you can do a number
    of things. Go to www.linuxdoc.org and read the various X Window System and XFree86-related
    HOWTO files. Some are quite technical, but some are a bit more friendly, and you
    may be surprised by just how much you can tweak the Linux GUI. You can also find
    www. gnome.org and www.kde.org, as well as dozens of useful sites out there.


