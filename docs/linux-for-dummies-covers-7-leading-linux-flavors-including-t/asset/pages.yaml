  md: '# Chapter 1: Getting Acquainted with Linux


    # Anatomy of an Open Source Software Project


    Linux isn''t a product. Linux is an organic part of a software ecosystem.


    > — Michael Robinson, Netrinsics


    The casual observer and some corporate IT decision-makers, Linux appears to be
    a freak mutation — a rogue creature randomly generated by anarchy. After all,
    can something so complex and discipline-dependent as a computer operating system
    be developed by a loosely knit band of volunteer geeks from around the world?


    Just as science is constantly attempting to classify and explain everything in
    existence, technology commentators are still trying to understand how the open
    source approach can create superior software, especially in cases where this is
    no charge. Often the reasons have much to do with the usual human desire to fill
    a need with a solution. When a programmer in the Linux world wants a tool, the
    programmer simply writes one — or bands with other people who want a similar package,
    and they write it together.


    # GNU who?


    Imagine — software created out of need rather than conjectured profit. Though
    Unix ultimately became expensive proprietary software, the ideas and motives for
    its creation were originally based on practical needs. What people usually refer
    to (in the singular) as the Linux operating system is actually a collection of
    software tools that were created with the purpose of solving specific computing
    problems.


    Linux also wouldn''t be possible without the vision of a man whom Steven Levy
    (author of the book Hackers) refers to as “The Last of the Great MIT Hacker”—
    in the original sense of the word hacker, (someone who plays with code), not the
    current popular meaning that implies criminal intent. This pioneer and advocate
    of freedom is Richard Stallman.


    The Massachusetts Institute of Technology (MIT) has long held a reputation for
    nurturing the greatest minds in the technological disciplines. In 1984, Stallman,
    a gifted student and programmer at MIT, was faced with a dilemma — sell his talent
    to a company for a tidy sum of money or donate his gifts to the world. What did
    he do that we all do ... right?'
