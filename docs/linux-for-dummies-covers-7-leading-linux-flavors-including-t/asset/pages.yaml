  md: '# Chapter 4: Installing Other Linux Distributions


    # Burning your ISOs


    If you end up having to use the ISO files on the DVD-ROM or that you download
    in order to create distribution CD-ROMs or DVD-ROMs, I have some handy tips that
    can make this process easier for you.


    Get some good CD-burning software, such as the popular Nero program (www.nero.com/en).
    Another program that is free FreeCDCC from www.terabyteunlimited.com/utilities.html.
    When you have a CD burning tool ready, look at the size of the ISO you want to
    be burned onto a 650MB/74-minute CD-R or CD-RW, some are large enough that you
    need 700MB (80-minute) discs insert. Knopix is one Linux distribution that needs
    the larger-Rs. Another is Mandriva.


    other distributions (or newer versions) onto them later. Note


    As you prepare to burn your CD or DVD, make sure your software understands that
    you want to burn an ISO (look in the menu) and not just a file. If you burn your
    CD or DVD, put it into the drive, open it up, and then see only one file, you
    have burned it incorrectly. An ISO should be unpacked onto the CD or DVD as a
    bunch of files and directories.


    Finally, it''s a good idea to burn these types of CDs and DVDs at a speed of four
    or slower. You reduce your chance of introducing errors.


    When possible, use CD-RWs, because they''re rewritable and you can download and
    burn


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_80_0.png)


    Linspace offers a nice FAQ on burning the CD at http://info.linspace.com/installhelp/.
    The info is helpful whether you''re burning it from the DVD-ROM that comes with
    this, or one you acquired from Linspace directly.


    # Installing Linspace


    Linspace is primarily a commercial distribution, and you have access to it through
    the ISO image included on the DVD-ROM that comes with this book. I cover this
    Linspace Five-0 release. Differences between this and other versions are addressed
    in the “About the various Linspace versions” section later in this chapter.


    To install Linspace Five-0:


    +   1. Place the CD into your CD-ROM


    +   2. Boot the machine.


    If the machine ignores your CD-ROM and tries to boot normally, see Chapter 2 on
    how to make the necessary changes to your BIOS.'
