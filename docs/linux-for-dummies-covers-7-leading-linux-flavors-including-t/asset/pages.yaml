  md: '# 102 Part I: Getting Your Feet Wet


    If you''ve been using computers for a long time, you may also be familiar with
    the command-line interface, which usually consists of a black screen showing nothing
    but parallel lines of white text. The initial release and early development of
    Linux was all command-line oriented; GUIs then grew like the icing on the cake,
    making it a lot more colorful and easier to use for people who would rather point
    and click than type.


    In choosing between the command line and the GUI, you need to consider a number
    of factors. For a lot of people, this decision is pretty no-brainer. That, they
    have no intention of leaving GUI behind. But at the very least, you may want to
    become familiar with what''s under the hood. Some day, your GUI might break and
    leave you at the ever-dreaded login prompt!


    Speed is one important factor to consider when choosing between the command-line
    interface and a GUI. Keep in mind that if you''re a programmer who needs to compile
    programs (or a scientist who needs to run software that does heavy crunching),
    the GUI slows down your system. Also, typically, you have to shut off the GUI
    when using Linux as a server, because all those processes are mostly a waste of
    RAM and processing speed—after all, more often than not, a server just does its
    thing with no one watching over it.


    Readability can also be a big issue when you''re choosing between the GUI and
    the command prompt. If you have a hard time reading text in those small-prompt
    windows from the GUI (Chapters 14 and 20 cover various ways to switch around),
    you can either make the windows and the font bigger, or work directly with the
    command prompt outside of the GUI. However, on a desktop you want to use for word
    processing or editing images, you''ll need a point-and-click environment. (This
    setup is the type I focus on, but I clue you in the command line anyway, just
    in case)


    You can also choose from two major GUI versions: GNOME and KDE. Some people prefer
    one, and the other; I''m not here to tell you which to use. If you stick with
