  md: '# 140 Part II: Internet Now!


    Integrated Services Digital Network (ISDN): Not too long ago, ISDN was not one
    of the only residential high-speed options. It appeared when 28 Kbps (half the
    speed of today''s regular dialup modems) was about all that you could milk from
    the copper strands that connected your telephone to the telephone company. ISDN
    is still available in some areas and promises a 128 Kbps — as long as you''re
    within 3.4 miles of the telephone company''s central office. You need two special
    devices to use ISDN: a modem (typically provided by the IS ISP) and a network
    adapter (sometimes an Ethernet card). Because ISDN is used so these days, not
    many specific sites are devoted to it. The overall modem HOWTO (www.tldp.org/HOWTO/Modem-HOWTO.html)
    does contain pointers to the latest ISDN information, as well as just being plain
    interesting to read.


    Beware of devises posing as modals

    i try to save some frustration — and your computer from your ball-peen hammer.
    Many Linux newbies have been irritated by not being able to communicate with their
    internal modems. "After all," the newbie reasons, "the same hardware works when
    I was running Microsoft Windows." labels are misleading because some manufacturers
    just don''t bother to list other operating systems even though their hardware
    will work with those operating systems.


    Well, here''s the story: Years ago, hardware manufacturers developed a device,
    called a software modem, in an effort to reduce hardware costs. The idea was to
    trim some responsibility from the modem and delegate these tasks to the operating
    system. The result was an inexpensive modem that routed signals to proprietary
    software that operated only over Microsoft Windows. In short, these-called modems,
    also known as Winmodems, are not really modems at all, but, are telephone cable
    interfaces to Windows.


    The following list shows methods you can use to determine whether you have a software
    modem:


    +   - The model has a HCF-, HSP-, or HSF- in front of it.


    +   - The packaging refers to the device as a WinModem or designates that it works
    with only Windows (sometimes these'
