    other is YaST, which you will hear about throughout this book. You can access
    this tool through Desktop-YaST (see Figure 7-8).


    You can use many of the tools discussed in this chapter at the command prompt,
    though not all of them. YaST actually has a full command-line interface in case
    you''re not using a GUI!'
