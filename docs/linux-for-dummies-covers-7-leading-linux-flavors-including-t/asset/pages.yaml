    # Document section


    Things tricky here if you''ve never used formula-editing software. You can''t
    type anything in the main (upper) document window in OpenOffice.org Math. Instead,
    you type in the Commands (lower) window. Right-clicking in the Commands window
    opens a shortcut menu. To help you get used to working with the formulas, I suggest
    that you play around this tool. For example, if you have never used software like
    this, you might follow these steps:


    +   1. Right-click in the Commands window.

    2. Select a submenu to open.

    3. Select a formula component within this submenu.


    I''m a geek, and I fondly remember taking a class on matrices, so I chose matrix
    [...] as an example. Immediately, the code''s needed to add a matrix to my formula
    appears in the Commands dialog box. A moment later, because I''m letting the command
    refresh the rest of the screen as I work, I see what the matrix looks like in
    the document window. The combination is shown in Figure 17-10.


    +   4. Replace each of the <?> entries with the proper letters and numbers for
    your formula.


