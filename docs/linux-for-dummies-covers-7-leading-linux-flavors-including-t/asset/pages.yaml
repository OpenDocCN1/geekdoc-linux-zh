    # Three Presumptuous Assumptions


    They say that making assumptions makes a fool of the person who makes them and
    of the person whose assumptions are made. (And just anyway are they, I assume
    that I know, but — never mind.) Even so, practicality demands that I make a few
    assumptions about you, gentle reader:


    +   * You can turn your computer on and off.

    * You know how to use a mouse and a keyboard.

    * You want to install, configure, and/or use a desktop Linux system because you''re
    curious or interested in it''s your job to do.


    You don''t need to be a master logician or a wizard in the arcane of programming
    to use this book, nor do you need a PhD in computer science. You don''t even need
    a complete or perfect understanding of what''s going on in your computer''s minds.


    If you have an active imagination and the ability to solve rudimentary problems,
    that''s even better — you have already mastered the key ingredients necessary
    to making Linux work for you. The rest is more details and a bit of patience.
    I can help you with the details, but the patience is up to you!'
