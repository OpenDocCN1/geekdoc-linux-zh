  md: '# # Chapter 11


    # # Checking Out the Linux Filesystem


    **In This Chapter**


    +   - Discovering the root directory and subdirectories

    - Discerning partitions from directories

    - Adding removable media to the filesystem

    - Caring for your filesystem

    - Accessing shared files on Windows computers


    > I have an existential map. It has “You are here” written all over of it.


    > — Steven Wright


    One of the most frustrating things about mastering a new operating system can
    be figuring out where it keeps files. Instead of keeping all important system
    files in a single directory, such as the C:\Windows directory in Microsoft Windows,
    Linux follows the lead of its Uix cousins and spreads things out a bit more. Although
    the Linux and Windows setups involve different methods, which are both logical,
    although it may not feel that until you understand where to look.


    Another issue you come across is adding new media — hard drives, floppy disks,
    CD-ROMs, DVD-ROMs, zip disks, and more — to the existing filesystem. In this chapter,
    I focus on how the filesystem is organized and other handy topics, such as how
    to access data on a floppy disk. (In Chapter 10, you can find hints on how to
    do this when looking through the file managers.)


    # # Introducing the Linux Filesystem


    Linux may be all by itself on your hard drive, or maybe it''s sharing your hard
    drive with another operating system, such as Microsoft Windows. All the hard drive
    space you allocated for Linux during the installation process is the'
  merge: -1
  pgno: 222
- img_proc: true
  md: '# 202 Part III: Getting Up Speed with Linux


    majority of your Linux filesystem. Because you''re running your own Linux machine,
    you need to be familiar with how it''s put together — especially the sections
    that are dangerous to mess with!


    # Meet the root directory


    Everything in the Linux filesystem is relative to the root directory, which is
    referred to as / and is the file-system base, a doorway into all your files —
    don''t confuse this with the root user, which is the system administrator. The
    root directory contains a mostly predictable set of subdirectories. Each distribution
    varies slightly, but certain standards exist to which they all conform. The standards
    keep us all sane.


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_223_0.png)


    If you''re interested in these standards, go to www.pathname.com/fhs and look
    at the latest version of the rules.


    Rather than flooding you with everything at once, I start by talking about the
    base directories, meaning the items you find in /. Table 11-1 lists what you might
    find in this base location. (This list can vary from distribution to distribution.)
    An asterisk (*) at the end of a description indicates that you shouldn''t mess
    with this directory unless you have a really good reason because it contains files
    that are very important to the functioning of your system.


    | Table 11-1 | Standard / Contents in Linux |

    |---|---n| Directory /bin | Essential commands that everyone needs to use at any
    time* |

    | /boot | The information that boots the machine, including your kernel* |

    | /dev | The device drivers for all the hardware that your system needs to interface
    with* |

    | /etc | The configuration files for your system* |

    | /home | The home directories for each of your users |

    | /lib | The libraries, or code that many programs (and the kernel) use* |

    | /media | A spot where you add temporary media, such as floppy disks and CD-ROMs;
    not all distributions have this directory |'
  merge: -1
