  md: '# 34 Part I: Getting Your Feet Wet


    For Linux. For example, you can search on Invisision DX700T Linux to find out
    how other people are faring with this particular brand and model of hardware.
    (No endorsement of any hardware mentioned is implied here, of course.)


    +   - Vendor sites: Many hardware vendors offer information about their level
    of support for Linux on their sites. However, many don''t mention Linux at all
    even though hardware works fine on Linux. You may also find drivers you can download
    on vendor sites. Only do this if there is no other way to get the driver for your
    distribution. This will be the most awkward way to get the driver.


    If worst comes to worst, you might not find support listed for a piece of hardware.
    Try it anyway; it might work fine with a few minor caveats. For example, you might
    not be able to use the latest features of your latest-generation video card, but
    you will be able to use it as a generic SVGA at the very least. Also, sometimes
    older hardware is left off the lists but still supported.


    +   - The dreaded manuals: When possible, keep your computer manuals (especially
    for your video card and monitor) handy, just in case you need them in order to
    answer a question asked by the installer — most people won''t have to deal with
