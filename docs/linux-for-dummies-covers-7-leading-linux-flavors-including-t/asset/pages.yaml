  md: '# Chapter 14: Working without the GUI


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_294_0.png)


    You can usually tell at a glance the difference between a variable and an environment
    variable in bash. The normal convention is to name local variables in all lowercase
    or in mixed-case characters. An environment variable, however, is usually always
    in all uppercase letters.


    # Checking out environment variables


    The bash shell has many environment variables. You may be amazed at the range
    of items these variables store. The handy thing is, if something is stored in
    a variable, you can change it to suit your needs! In Table 14-1, I list the environment
    variables you''re most likely to want to work.


    | Environment Variable | Purpose | Value |

    | :--- | :--- | :--- |

    | HISTSIZE | Determines the number of previously typed commands that are stored.
    | Number of commands |

    | HOME | Sets the location of your home directory. | The path to your home directory
    |

    | MAILCHECK | Sets how the bash shell checks for new mail in your mailbox. If
    mail has arrived, you see a message similar to You have new mail the next time
    you do something at the command prompt. | Number of seconds to wait between checks
    |

    | PATH | Sets the directories that bash looks in, and the order to find them a
    program name you type at the command prompt. | Colon-separated directories |

    | PS1 | Sets your command prompt. | Command and formatting characters used to
    form the prompt |


    Most environment variables are established by the system administrator or perhaps
    by the shell itself. These variables are mostly read by programs to gather information,
    and you don''t need to change their values.'
