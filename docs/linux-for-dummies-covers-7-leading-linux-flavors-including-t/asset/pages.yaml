    is different from the default one that you will find if you are installing Fedora
    Core 5 directly from your DVD or CDs. If for some reason you are using a DVD or
    CDs that only contain Fedora Core 5, then follow the instructions but just press
    Enter when you reach the boot prompt. Those who using the DVD that came with this
    book should do the following:'
