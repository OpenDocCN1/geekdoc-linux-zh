  md: '# Adding repositories


    Fedora — along with other modern Linux distributions — uses repositories (sites
    that offer software to its automated tools) in order to track what''s available
    and grab what it needs. By default, only the main Fedora and "updates" repositories
    are available for many reasons (some legal), so the first thing most people do
    is add a bunch of repositories to their list.


    To add some cool repositories with the help of the official maintainer of the
    Fedora FAQ (www.fedorafaq.org), do the following:


    +   1. Open a terminal window as discussed in Chapter 14.


    +   2. Type su - and press Enter to become the root user.


    Your prompt changes to reflect your new identity.


    +   3. Type cd /etc and press Enter.


    You are now in the /etc part of the filesystem.


    +   4. Type mv -f yum.conf yum.conf.bak and press Enter.


    This command renames the file yum.conf to yum.conf.bck so you can easily back
    up to the original file.


    +   5. Type wget http://www.fedorafaq.org/samples/yum.conf and press Enter.


    This command downloads the file yum.conf from http://www.fedorafaq.org/samples/
    and saves it in /etc, creating a new /etc/yum.conf file for you.


    +   6. Type rpm -Uvh http://www.fedorafaq.org/yum and press Enter.


    The command-line package manager downloads the program at this URL and installs
    it. This program changes the files in the directory /etc/yum.repos.d so that they
    contain a listing of some of the best repositories.


    +   7. Close the terminal window by clicking the X in the corner.


    You now have access to a ton of software! You will be able to find these packages
    in the Package Manager''s Search and List sections.


    # Adding the software in this book


    I discuss a number of programs in this book, and you may want to give them a try.
    Some are already installed if you did a default Desktop installation of Fedora
    Core 5. Others you need to add. You can add many through the package manager:'
