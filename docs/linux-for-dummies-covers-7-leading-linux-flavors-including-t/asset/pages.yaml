  md: '# 338 Part IV: Getting Things Done


    # Checking Your Sound Card


    Before you can listen to tunes, you have to make sure that your sound card is
    working properly. After the configuration issues are dealt with, you can move

    on to the fun stuff like listening to CDs and Internet radio and downloading tunes.


    Many distributions ask you to test your sound as part of the installation or immediate
    post-installation routine. Just in case you skipped this step, the first thing
    to do here is locate the sound-testing program (if one exists) to see yours is
    working:


    +   - Fedora: Choose System⇔Administration⇔Soundcard Detection to see whether
    the card is correctly detected and plays test sounds.


    +   - Knoppix: From the Main Menu, choose KNOPPIX⇔Configure⇔Soundcard configuration
    to start the sound configuration utility.


    +   - Linspire: Choose Launch⇔Settings⇔Control Center⇔System Administration⇔InformationTo
    see whether the card is correctly detected. If you are a daring and savvy person
    then you can make alterations by starting in the main Control Center panel and
    selecting Sound and Multimedia⇔JACK Sound Server⇔Advanced Settings.


    +   - SuSE: Choose Desktop⇔YaST⇔Hardware⇔Information⇔Sound, and then click the
    next to the specific sound card to make sure it is properly listed.


    +   - Xandros: Choose System⇔Control Center⇔Hardware InformationTo see what sound
    card the operating system would find (you may find under an additional System
    menu). To make changes, follow the same instructions given for Linspire.


    +   - Ubuntu: Choose System⇔Preferences⇔Sound to make sure your card was found
    correctly.


    # Looking into Your Mixer


    If the sound card seems to be detected properly, then a look at your mixer is
    the next important step. Sometimes cards are picked up right, and yet the mixer


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_359_0.png)'
  merge: -1
  pgno: 359
- img_proc: true
  md: '# Chapter 18: Multimedia Wow!


    for some reason by default things are muted, or other strange things are set.
    To find the mixer:


    +   - Fedora: Choose System-Preferences-Volume Control.

    - Knoppix: From the Main Menu, choose Multimedia-KMix.

    - Linspire: Choose Launch-Run Programs-Audio & MP3-Volume Control.

    - Mandriva: From the Main Menu, choose Multimedia-SoundKMix.

    - SUSE: Choose Applications-Multimedia-Volume Control (there may be another menu
    layer with another Volume Control component in your version). You may find other
    programs useful in this menu as well.

    - Xandros: Choose Launch-Applications-Multimedia-Sound Mixer.

    - Ubuntu: Choose Applications-Sound & Video-Volume Control.


    Mixer meters of interest include the following:


    +   - Lock: When two slider bars appear for a setting, this option just makes
    sure they''re always level with one another.

    - Mute: No sound comes from this section.

    - PCM: Control the volume for audio files as opposed to, say, CDs.

    - Volume: Control the overall volume.


    Finally, many of the distributions have a little volume control icon on the panel.
    If everything else looks right in the mixer but you get no sound, click it and
    make sure it hasn''t been pulled down to the bottom.


    # Investigating Troublesome Sound Issues


    If your sound isn''t working, your card may not be supported. The following strategies
    can help you to track down a potential solution:


    +   - Proceed to the manufacturer''s Web site and locate the page for the specific
    card that you have. This page has a link to technical support, drivers, and downloads.
    If it does, follow these links and see whether a driver (the piece of software
    that tells your operating system how to talk to each piece of hardware) is available
    for your card in Linux. If drivers are listed by kernel version - the version
    of the Linux core that you''re using - type uname -r to see your version number
    and then choose the closest driver that you can. You might also have to try the
    central tech support page on that site if there isn''t one dedicated to the hardware
    in question.'
  merge: -1
