  md: '# 196 Part III: Getting Up to Speed with Linux


    # Understanding Filesystem Mechanics


    Chapter 11 focuses on how the filesystem is laid out, but this chapter covers
    what''s happening under the hood as far as out to understand what you''re seeing
    in file-system listings. These features are identical across Linux distributions,
    the underpinning of working with Linux remains at least the same no matter what
    version of Linux you''re using.


    # Understanding long format file listings


    Remember those detailed list views in the file managers? They typically contain
    information similar to this ls -la output here for a list of commonly used commands
    in Linux:


    ```

    drwx------ 2 dee 4096 Jul 29 07:48

    drwx-xr-x 5 root 4096 Jul 27 11:57 .

    -rw-r--r-- 1 dee dee 24 Jul 27 06:50 .bash_logout

    -rw-r--r-- 1 dee dee 230 Jul 27 06:50 .bash_profile

    -rw-r--r-- 1 dee dee 124 Jul 27 06:50 .bashrc

    ```


    You may find some parts of this format easy to understand, at a glance, others.
    The first item in each listing (the part with the letters and dashes — for example,
    the drwx------ in the first line) is the permission assigned to the item. Briefly,
    permissions define who can read the file, can change it, or run it if it''s a
    program. You can read more about permissions in “A permissions primer,” in this
    chapter. The second item in the first line (in this case, 2) is the number of
    hard links to the item.


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_217_0.png)


    A link is a fake file listing that points to another file, making a kind of short-cut.
    You use two kinds of links in Linux and Unix:


    +   - Soft link: This link is like a Windows shortcut in the link points to the
    original file, and anything you do to the link happens to the original file. Erase
    the original file, and the link remains, but it becomes unusable. The link is
    broken without the original file.


    +   - Hard link: This link doesn''t have a counterpart in the Windows world. A
    hard link isn''t just a shortcut; it''s another instance of the file itself. The
    data in this file is saved in only one place, but you can edit either the original
    or the link, and the edit is saved for both instances of the file. Erase the original,
    and the file still exists as long as the link is. It''s like two doors to the
    same room!'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# Chapter 10: Manipulating Files and Directories


    The third item (dee) is the file''s owner, and the fourth (dee) is the group —
    depending on which version of Linux you''re using, both these items may or not
    be identical. You can find out more about both of these in "A permissions primer,"
    later in this chapter. The fifth item is the file''s size in bytes. All directories
    show up as 4096 bytes. Everything else has its own size. You can tell an empty
    file from the size of 0 bytes.


    The sixth, seventh, and eighth entries are all related to the last time the file
    was changed: the month (Jul), the date (29), and the time in 24-hour format (07:48).
    Finally, the ninth item is the filename (for example, bash logout in the third
    row).


    # A permissions primer


    If you find yourself scratching your head when looking at parts of that long format
    file listing, don''t worry. The "Comprehending file types" section, later in this
    chapter, gives you a feeling for the first letter on each line, but more characters
    are attached to that item before you get to the next column. This group of nine
    is the set of permissions (also called a permission set) for the file or directory.
    Linux, Unix, and Mac OS X use permissions as a way of providing file and directory
    security by giving you the measure to specify exactly who can look at your files,
    who can change them, and who can run your programs. You need this capability when
    you have a bunch of different users on the same machine, networked to the world.


    # Checking out triads


    ```

    total 20

    drw------ dee dee 4096 Jul 29 07:48 .

    drwxr-xr-x 5 root 4096 Jul 27 11:57 ..

    -rw-r--r-- 1 dee dee 24 Jul 27 06:50 .bash_logout

    -rw-r--r-- 1 dee dee 230 Jul 27 06:50 .bash_profile

    -rw-r--r-- 1 dee dee 124 Jul 27 06:50 .bashrc

    -rw-r--r-- 1 dee dee 0 Jul 29 07:48 lsfile

    ```


    The first character in the permission set refers to the type of file. For a directory,
    the character is a d, as you see here for the first two items in the preceding
    list; files are designated with a dash (-) instead. Each file or directory''s
    permission set is a group of nine characters — that is, nine characters that follow
    the first character (for a total of ten). But this group of nine is really three
    groups of three, as shown in Figure 10-10.'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# 198 Part III: Getting Up to Speed with Linux


    | R | W | X | R | W | X | R | W | X |

    |---|---|---|---|---|---|---|---|\||

    | Users | | | Groups | | | Others | | |


    Figure 10-10: Breakdown of the nine permission characters.


    Legend:

    R=Read

    W=Write

    X=Execute


    The three triads are read as follows:


    +   - The first triad consists of the second, third, and fourth characters in
    the long format file listing. This triad sets the permissions for the *user*,
    or *owner*, of the file. (Owners are discussed in the "Beware of owners" section,
    later in this chapter.)

    - The second triad consists of the fifth, sixth, and seventh characters in the
    long format file listing. This triad sets the permissions for the *group* that
    is assigned to the file. (Groups are discussed in the "Hanging out" section, later
    in this chapter.)

    - The third triad consists of the eighth, ninth, and tenth characters in the long
    format file listing. This triad sets the permissions for *other*, or everyone
    who isn''t the file''s owner or a member of the owning group.


    Although each triad is different from the others, the internal structure of each
    one is made up in the same way. Focus specifically on how to read one triad before
    looking at the set of them together. Each triad includes three characters:


    +   - The first character is either an *r* or a dash. The *r* stands for read
    permission. If *r* is set, the triad allows the entity it stands for (user, group,
    or other) to view the directory or file''s contents.

    - The second character is either a *w* or a dash. The *w* stands for write permission.
    If *w* is set, the triad allows the entity it stands for to add, delete, or edit
    items in this directory or file.

    - The third character is either an *x* or a dash. The *x* stands for execute permission.
    If *x* is set, the triad allows the entity it stands for to access the files contained
    in this directory or to run the particular program in this file.'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# Chapter 10: Manipulating Files and Directories 199


    In all cases, the dash sits in place of r, w, or x, the triad doesn''t allow the
    entity to read, write, or execute permission.


    The following sections describe owners and groups in more detail.


    # Beware of owners


    You may have noticed by now that I talk a great deal about owners (users) and
    groups in Linux. Every file and directory has both of these components: a user
    from the /etc/passwd file that''s assigned as its owner and a group from /etc/group
    assigned as the group.


    Although an everyday user probably doesn''t need to change file ownership, the
    root user does so regularly. If you add the file comments, for example, to /home/tom
    while you''re logged on as the SUPERUSER (another term for the administrator,
    who is the person who owns the root account), root owns that file. The user can''t
    change anything unless you have set the triad''s permissions to allow the other
    folks (whose aren''t the file''s owner or in the specified group) to read and
    write to the file. But this method is a pretty sloppy way of doing things because
    the whole idea of permissions is to reduce access, not give everyone access. Instead,
    remember to change the file''s owner to the user tom. You do this with the chown
    (change owner) command. For example, by typing chown comments, root changes the
    ownership over tom. Then tom can work with this file and even change its permissions
    to something he prefers.


    # Hanging out in groups


    Groups are more interesting to work with than owners. You use groups to allow
    the root user to assign to multiple users the ability to share certain file-system
    areas. In many versions of Linux, all users are added to a group named users (SuSE
    does this, for example). Then rather than a long file listing like the one we
    showed earlier in this chapter, you may see the following:


    ```

    total 20

    drwx------ 2 dee users 4096 Jul 29 07:48 .

    drwxr-xr-x 5 root 4096 Jul 27 11:57 .

    -rw-r--r-- 1 dee users 24 Jul 27 06:50 .bash_logout

    -rw-r--r-- 1 dee users 230 Jul 27 06:50 .bash_profile

    -rw-r--r-- 1 dee users 124 Jul 27 06:50 .bashrc

    -rw-r--r-- 1 dee users 0 Jul 27 07:48 1file

    ```


    In other distributions (such as Fedora) a unique group is created for every user,
    which is why the earlier listings showed the owner and group items as identical
    (dee dee).


    ![](img/d01c7c9abe7acbcb8b5f8f79e6511f25_220_0.png)'
  merge: -1
