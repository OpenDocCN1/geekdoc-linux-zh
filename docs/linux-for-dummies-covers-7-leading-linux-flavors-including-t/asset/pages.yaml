  md: '# 348 Part IV: Getting Things Done


    check out the Radio Streams section''s Cool-Streams folder. Here you''ll find
    lots of radio stations to choose from.


    +   - Media Device Browser: Click this tab and then Connect to open the Configure
    Media Device dialog box. Here, you can choose from various portable storage device
    types if you have one (VFAT refers to Windows-based devices), so Amarok can load
    music from them.


    +   - Files: Browse through your filesystem to find individual songs you want
    to click and drag them into the playlist.


    No matter how you get music over the playlist on the right, once it''s there you
    can click the Play button at the bottom of the pane to play the selected track.
    You can also double-click a track to play it. Below the volume slider you will
    find a set of controls (hover your mouse over the icon to see what it''s currently
    set), the most important of which are:


    +   - Random Mode: Lets you turn playlist randomization on or off.


    +   - Repeat: Lets you set whether to stop playing music when the playlist has
    been played (no repeats), repeat a specific track, or repeat the whole playlist.


    There is much more to Amarok. Take the time to explore this tool and really customize
    it to your satisfaction. When you close this program, the Docking In System dialog
    box appears. It warns you that Amarok will continue to run and appear as a system
    icon on your panel. You can avoid this by choosing Actions:Quit instead of clicking
    the X in the corner of the application to close the program. If you leave the
    program on your panel, you can open it at any time by clicking the little wolf
    icon in your panel.


    # Ripping Music Tracks from CDs


    This is another topic that''s impossible to cover without at least acknowledging
    that both ethics and legal issues are involved. I''m not going to fight to rip
    (copy) music my own CDs for my use. If I want to pull my favorite songs off CDs
    that I purchased and set them up so I can listen to them collectively in a random
    playlist of my computer''s hard drive, I don''t see a problem with this. However,
    doing this and then taking the CD back for a refund is theft, in my opinion.


    With, with that said, a number of music ripping programs are available in Linux:


    +   - Fedora: Choose ApplicationsSound&VideoSound Juicer CD Extractor (see Figure
    18-7).


    +   - Knopix: None, although you''d need a second CD drive anyway!'
