  md: 'Stallman set out on a journey to create a completely free operating system
    that he would donate to the world. He understands — and continues to live — the
    original hacker ethic, which declares that information wants to be free. This
    concept wasn''t new in his time. In the early days of computing industry, many
    advancements were made by freely sharing ideas and programming code. Manufacturer-sponsored
    user groups brought the best minds together to solve complicated problems. Stallman
    felt, lost when companies began to hoard software as their own intellectual property
    with the single purpose of profit.


    As you may or may not have gathered by this point, widespread and accessible source
    code is paramount to successful software development. Source code is for the human-readable
    text (as opposed to the unreadable cyber-hieroglyphics in an "executable" file)
    that a programmer types to communicate instructions to the computer.


    Writing computer programs in binary is an extremely arduous task. Modern computer
    software is usually written in a human-friendly language and then compiled, or
    translated, into the computer''s native instruction set. To make changes to this
    software, a programmer needs access to a program''s source code. Most proprietary
    software comes only as a precompiled code; the software developer keeps the source
    code for programs under lock and key.


    After determining that his operating system would be built around the conceptual
    framework of Unix, Stallman wanted the project name to distinguish his system
    from Unix. So, he chose the recursive acronym GNU (pronounced new-new), which
    means GNU''s Unix.


    To finance the GNU project, Stallman organized the Free Software Foundation (FSF),
    which was free (open source) software to help the programmers who worked on its
    continuing development. Remember, we are talking free in free speech, not free
    beer.. Although this organization and goal of creating a complete operating system
    was necessary and important, a much more important piece of the puzzle to be put
    into place to protect this new software from big-business pirates — a concern
    still all too relevant today as a former Linux company tries to hijack ownership
    of decades of volunteer work from thousands of people around the world.


    The GNU General Public License (GPL) is a unique and creative software license
    that uses copyright to protect the freedom of the software user, which is usually
    the opposite of how a copyright works. Generally, a copyleft is an enforceable
    designation of ownership and restriction from duplication by anyone but the copyright
    holder. When software is licensed under the GPL, recipients are bound by copyright
    law to respect the freedom of anyone else to use the software in any way they
    choose. The GPL is also known as copyleft software (the reverse of right, get
    it?). Another way to remember the GPL is through its ultimate result: Guaranteed
    Free for Life.'
