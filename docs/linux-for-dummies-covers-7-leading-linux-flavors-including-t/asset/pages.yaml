  md: '# 150 Part II: Internet Now!


    help someone else figure out what''s wrong — you can use a cool tool: the handy
    command-line program, ping.


    Some firewalls block the kind of traffic sent with pings, so these commands don''t
    always work as expected, even with a good connection.


    The ping command is akin to a submarine using sonar to detect other objects in
    the ocean. Radar sends out a ping signal, which reflects off a hard surface. By
    measuring the amount of time between sending the ping and the ping''s return,
    the submarine''s engineer can determine whether an object is out there and how
    far from the submarine the object.


    The ping command in Linux provides information similar to what sonar provides
    — and it is so useful that you use it here as both a Linux command and a time-honored
    word. If you consider the Internet to be your ocean, you can determine by pinging,
    what other network computers exist — and how long it takes for your ping command
    to return. You use this in the format hostname or ping ipaddress, such as ping
    bob. example.com ping 192.168.1.5. If you can''t ping another computer in your
    house or office (assuming that you have all connected with Ethernet and not on
    separate dialup connections), then something is wrong with the machine you''re
    pinging from. On the other hand, if you can ping another machine in your house
    or office but can''t ping a machine else where on the Internet, then something
    may be wrong with your connection to your ISP.


    Latency, or the amount of time it takes for a signal to travel on the Internet,
    has to do with physical distance. Rather factors such as network traffic, bandwidth,
    and network hardware all contribute to a low latency. These factors determine
    whether a ping command to your neighbor''s computer takes longer than pinging
    a host at the South Pole.


    For example, trying Yahoo! by opening a command prompt (see Chapter 14) and typing
    the following command:


    ```

    ping www.yahoo.com

    ```


    Press Ctrl-C to stop the ping; otherwise your computer continues to ping the target.


    The output, shown in Figure 8-6, provides information about what ping is doing.
    If the ping can reach the host, you receive a message that the host is unreachable.
    If the ping can reach the host, you receive feedback that provides how long it
    takes — in milliseconds (ms) — for the signal from your computer to go to the
    destination computer and back.again — the lower the numbers, the better. For computers
    connected through Ethernet, a ping time of 1 ms to 3 ms is an acceptable response
    time. For dialup connections, expect somewhere around 150 ms. When you start seeing
    ping times climbing to 900 ms or higher, the network is likely under heavy use
    (or you have something wrong with your cables).'
