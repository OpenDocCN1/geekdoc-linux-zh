  md: '# Logical techniques


    As discussed at the start of this chapter, logical forensic techniques extract
    data that is allocated. This is typically achieved by accessing the file system.
    Logical techniques are often the first type of examination a forensic analyst
    will run because they are not only easier to execute but often provide sufficient
    data for the case. Android forensics physical techniques can provide far more
    data. However, they are more difficult to successfully execute and take considerably
    more effort to analyze.


    Logical techniques also have the advantage of working in far more scenarios as
    the only requirement is that USB debugging is enabled. In other words, Android
    forensics logical techniques do not require root access.


    In this section, we first cover techniques that are freely available (although
    AFLLogical is only free for active law enforcement and government agencies) followed
    by a review of available commercial software.


    # ADB Pull


    In Chapter 4, the recursive adb pull command was demonstrated several times as
    various parts of the file system were copied to the Ubuntu workstation for further
    analysis. Unless an Android device has root access or is running a custom ROM,
    the adb daemon running on the device that proxies the recursive copy only runs
    with shell permissions. As such, some of the more forensically relevant files
    are not accessible. However, there are still files which can be accessed.'
  merge: -1
  pgno: 355
- img_proc: true
  md: 'If you attempt to access files that the shell user does not have permissions
    to it, it simply does not copy the files:


    ```

    ahoog@ubuntu:~$ adb pull /data adpull

    pull: building file list...

    0 files pulled. 0 files skipped.

    ```


    However, if you have sufficient privileges (root in the next example), this method
    is very simple and effective:


    ```

    ahoog@ubuntu:~$ adb pull /data adpull/

    pull: building file list...

    <snip>

    pull:/data/miscrild_nitz_long_name_31026 -> data/misc/rild_nitz_long_name_31026

    pull:/data/misc/akmd_set.txt -> data/misc/akmd_set.txt


    712 files pulled. 0 files skipped.

    963 KB/s (208943249 bytes in 211.67s)

    ```


    As you can see from the output above, the entire “data” partition was copied to
    a local directory in just over three and a half minutes. The directory structure
    is maintained during the copy so you can simply browse or otherwise analyze the
    files of interest for the workstation.


    As most phones will not have root access (at least by default), this technique
    may appear to be of little value. However, it is a powerful utility to understand
    and there are several scenarios ideal for this approach. These scenarios include:


    +   * On nonrooted devices, an adb pull can still access useful files as unencrypted
    apps, most of the tmpfs file systems that can'
  merge: -1
  pgno: 356
- img_proc: true
  md: 'include user data such as browser history, and system information found in
    "/proc," "/sys," and other readable directories.


    +   - On rooted devices, a pull of nearly all directories is quite simple and
    contain files and directories from "/data" would be of interest.


    +   - When utilizing the physical technique, it is not always possible to mount
    some acquired file systems such as YAFFS2. If adbd is running with root permissions,
    you can quickly extract a logical copy of the file system with adb pull.


    As adbd is not only a free utility in the Android SDK but also versatile, it should
    be one of the primary logical tools used on a device.


    | Warning |

    | adb Pull issues |

    | Some recursive pulls using adb can fail in the middle of the data transfer due
    to permission or other issues. You should closely monitor the results of the command
    to determine if any issues were encountered. Breaking the recursive pull of large
    directories may yield better results. |


    # Backup Analysis


    When Adbd was first released, it did not provide a mechanism for users to backup
    their personal data. As a result, a number of backup applications were developed
    and distributed on the Android Market. For users running custom ROMs, there was
    an even more powerful backup utility developed called nandroid.'
  merge: -1
  pgno: 357
- img_proc: true
  md: 'Many of the backup utilities have a “Save to SD Card” option (which users found
    extremely convenient) well as several options to save to “the cloud.” Either way,
    users could take a backup of their devices, and if needed they could restore required
    data. This is not only a great way for users to protect themselves from data loss,
    but it can be a great source of information for forensic analysts.


    One of the more popular backup apps is RerWare’s My Backup Pro which can take
    a backup of device data using Content Provider and even the entire “/data/data”
    files if the device has root access. The user can choose between saving to the
    SD card and saving toerWare’s server. The app supports (RerWare, LLC, n.d.) the
    following:


    +   • Application install files (if phone has root access, this includes APK +
    Data and Market Links)

    • Contacts

    • Call log

    • Browser bookmarks

    • SMS (text messages)

    • MMS (attachments in messages)

    • System settings

    • Home screens (including HTC Sense UI)

    • Alarms

    • Dictionary

    • Calendars

    • Music playlists

    • Integrated third-party applications'
  merge: -1
  pgno: 358
- img_proc: true
  md: 'The last bullet, “integrated third-party applications,” refers to companies
    who provide RerWare hooks for data backup. At least initially, RerWare would pay
    developers to include RerWare backup support in their apps.


    Interestingly, the app runs not only on Android but also on Windows Mobile, Blackberry,
    and soon Symbian OS. The user can take a backup on one platform and restore on
    a completely different OS. RerWare saves a single SQLite file to the SD card when
    the device backup is stored locally.


    In the more recent releases of Android, a new backup API is now available. Developers
    can simply integrate these APIs into their apps and the rest of the backup is
    handled by Android and Google. This provides the users with secure, cloud-based
    backups with consistency across apps, and will likely become the de facto standard.
    Unfortunately, current research has not yet discovered useful artifacts from the
    new backup APIs left on an Android device.


    Regardless of the backup app, forensic analysts should determine if one was installed
    and, if so, where the backup data is stored. The SD card should be examined as
    well as other devices such as a computer or laptop. The data saved in a backup
    is obviously of significant value in an examination.


    # AFLLogical


    AFLLogical is an Android forensics logical technique which is distributed free
    to law enforcement and government agencies. The app, developed by viaForensics,
    extracts data using Content Providers, which are a key feature of the Android
    platform. This is'
  merge: -1
  pgno: 359
- img_proc: true
  md: 'the same technique that commercial forensics tools use for logical forensics.


    Recall Android’s security model is effective in limiting access to app data except
    in a few circumstances. Here is a quick recap of the key components of Android’s
    security model:


    +   - Each application is assigned a unique Linux user and group id.

    - Apps execute using their specific user ID in a dedicated process and Dalvik
    VM.

    - Each app has dedicated storage, generally in "/data/data," that only the app
    can access.


    However, the Android framework does provide a mechanism by which apps can share
    data. An app developer can include support for Content Providers within their
    application, which allows them to share data with other apps. The developer controls
    what data is exposed to other apps. During the install of an app, the user controls
    whether or not an app should gain access to the requested Content Providers.


    Some examples of Content Providers are:


    +   - SMS/MMS

    - Contacts

    - Calendar

    - Facebook

    - Gmail


    And there are many more.'
  merge: -1
  pgno: 360
- img_proc: true
  md: 'The AFLogical app takes advantage of the Content Provider architecture to gain
    access to data stored on the device. Similar to commercial Android logical tools,
    USB debugging must be enabled on the device for AFLogical to extract the data.
    The current version, 1.5.1, extracts data from 41 Content Providers and provides
    the output information to the SD card in CSV format and as an info.xml file, which
    provides details about the device and installed apps. AFLogical supports devices
    running Android 1.5 and later, and has been specifically updated to support extraction
    of large data sets such as an SMS database with over 35,000 messages. The currently
    supported Content Providers are:


    +   1. Browser Bookmarks

    2. Browser Searches

    3. Calendars

    4. Calendar Attendees

    5. Calendar Events

    6. Calendar Extended Properties

    7. Calendar Reminders

    8. Call Log Calls

    9. Contacts Contact Methods

    10. Contacts Extensions

    11. Contacts Groups

    12. Contacts Organizations

    13. Contacts Phones

    14. Contacts Settings

    15. External Media

    16. External Image Media

    17. External Image Thumb Media'
  merge: -1
  pgno: 361
- img_proc: true
  md: '+   18. External Videos

    19. IM Account

    20. IM Accounts

    21. IM Chats

    22. IM Contacts Provider (IM Contacts)

    23. IM Invitations

    24. IM Messages

    25. IM Providers

    26. IM Provider Settings

    27. Internal Image Media

    28. Internal Image Thumb Media

    29. Internal Videos

    30. Maps-Friends

    31. Maps-Friends extra

    32. Maps-Friends contacts

    33. MMS

    34. Mms Parts Provider (MMSParts)

    35. Notes

    36. People

    37. People Deleted

    38. Phone Storage (HTC Incredible)

    39. Search History

    40. SMS

    41. Social Contracts Activities


    Let''s walk through the steps for running AFLogical on a device. First, ensure
    you have downloaded AFLogical, which requires registration and approval from viaForensics.
    (You can access the AFLogical at'
  merge: -1
  pgno: 362
- img_proc: true
  md: 'http://viaforensics.com/products/tools/aflogical/.) Next, you need to replace
    the user''s SD card with an SD card control and ensure that USB debugging is enabled
    on the device. Then connect the Android device to your Ubuntu workstation and
    make sure you pass the USB connection through the VM.


    | Warning |

    | Replace user''s SD card |

    | This version of AFLogical writes content directly to the SD card and it is important
    that the user''s SD card is removed and replaced with the examiner''s SD card.
    Failure to do this will either write data to the user''s SD card or AFLogical
    will fail as it cannot write to the SD card. The commercial version of this app
    will eventually replace the writing to the SD card in favor of port forwarding
    over adb |


    From a terminal session, verify you can see the device:


    ```

    $adb devices

    List of devices attached

    040355551112222F device

    ```


    Assuming you use the AFLogical app in your home directory, you can install it
    with the following command:


    ```

    ahoog@ubuntu:~ adb install ~/AndroidForensics.apk

    523 KB/s (31558 bytes in 0.058s)

    pkg: /data/local/tmp/AndroidForensics.apk

    Success

    ```'
  merge: -1
  pgno: 363
- img_proc: true
  md: 'Note: If AFLLogical is already installed on the device, an error will display
    and you must uninstall the existing app before you can install the new version.
    To uninstall, run the following command:


    After the application is successfully installed, you can run the program from
    either the Android device directly or via command line. If you run the app from
    command line, you can simply start the app and then complete using the device
