    # # History of Android


    For over three decades, companies have invested significant resources into research
    and development of handheld computing'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'devices in the hopes that they would open new markets. As with traditional
    computers, the hardware components central to building devices have advanced significantly
    and now provide a small, though powerful, mobile platform for handheld computers.


    A central figure in the development of Android is Andy Rubin whose past employers
    include robotics firms, Apple, WebTV, and Danger Inc. His previous company, Danger
    Inc., developed a smartphone and support OS most recognized by the T-Mobile Sidekick.
    This mobile operating system, DangerOS, was built using Java. It provided a software
    development kit and had some of the features found in current smartphones. In
    2004, Rubin left Danger and tinkered with several new ideas. He again returned
    to smartphone development and teamed with several engineers from past companies.
    The company Rubin formed in 2003 was called Android, Inc.


    While the team began development, Rubin was actively marketing Android to both
    potential investors and wireless carriers. One of the companies he spoke with
    was Google, who subsequently acquired Android in July 2005. The acquisition, combined
    with new patents and services involving mobile and a large bid for wireless spectrum,
    fueled significant speculation that Google was developing their own smartphone
    and perhaps was aiming to be a full wireless carrier.


    However, on November 5, 2007, Andy Rubin announced a more ambitious plan on the
    official Google blog (Official Google blog, n.d.):


    Android is the first open and comprehensive platform for mobile devices. It includes
    an operating system, user-interface and applications—all of the software to run
    a mobile phone, but without the proprietary obstacles that had hindered mobile
    innovation. We have developed Android in cooperation with the Open'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'Handset Alliance, which consists of more than 30 technology and mobile leaders
    including Motorola, Qualcomm, HTC and T-Mobile. Through deep partnerships with
    carriers, device manufacturers, developers, and others, we hope to enable an open
    ecosystem for the mobile world by creating a standard, open mobile software platform.
    We think the result will ultimately be a better and faster pace for innovation
    that will give mobile customers unforeseen applications and capabilities.


    One week later, Google released an early look at the Android development kit (SDK)
    to developers. This allowed Google to create the first Android Developer Challenge,
    which ran from January 2008 through April 2008. Google set aside $1,000,000 to
    reward the most innovative Android apps. The top 50 apps are available for review
    at http://code.google.com/android/adc/adc_gallery/.


    In August 2008, Google announced the availability of the Android Market for mobile
    device owners to browse and install. The initial release did not support paid
    apps. However, that feature was added in early 2009. Finally, October 2008 marked
    both the official release of the Android Open Source Project (AOSP) (Bort, n.d.)
    and the first publicly available Android smartphone, the T-Mobile G1.


    Since inception, the Android ecosystem has grown significantly and is comprised
    of diverse groups of contributors. Table 1.3 summarizes significant milestones
    for the Android platform.


