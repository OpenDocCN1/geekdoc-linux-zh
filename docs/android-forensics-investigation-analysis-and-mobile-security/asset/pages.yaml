    # Credit Card Data


    Most people in the security industry are familiar with the Payment Card Industry
    (PCI) Data Security Standard (DSS), which provides standards for protecting credit
    card data. Prior to the formation of the PCI Security Standards Council (SSC),
    the major credit card vendors had their own standards for protecting credit card
    data. In 2006, the PCI SSC was launched by the following payment brands:


    +   * American Express

    * Discover Financial Services

    * JCB International

    * MasterCard Worldwide

    * Visa Inc


    These brands have a vested interested in reducing fraud in the payment card industry.
    In the version 2.0 document “Requirements and Security Assessment Procedures”
    published in October 2010, the specific requirements of the PCI DSS are listed.
    The following is a small sample of requirements that would cover situations where
    credit card data are used in a mobile app [Documents Library, n.d.).


    +   * 3.2 Do not store sensitive authentication data after authorization (even
    if encrypted). Sensitive authentication data include the data as cited in Requirements
    3.2.1 through 3.2.3


    +   * 3.2.1 Do not store the full contents of any track (from the magnetic stripe
    located on the back of a card, equivalent data'
