  md: '# Google’s Strategy


    Android is clearly a powerful mobile device platform which costs an enormous amount
    in development. So why did Google give Android away for free?


    The answer starts with Google’s clearly defined mission (Corporate information:
    about, n.d.):


    Google''s mission is to organize the world''s information and make it universally
    accessible and useful.


    Cell phones are the most popular consumer device, numbering over 4 billion, so
    by by providing an advanced mobile stack at no cost, Google believes they are
    fulfilling the universally accessible portion of their mission. But, obviously
    there must be some benefit for Google. When more people are online, more people
    use search, which ultimately drives ad revenue—Google’s primary source of income.
    In a March 2009 interview, Andy Rubin explained:


    > Google has a great business model around advertising, and there’s a natural
    connection between open source and the advertising business model. Open source
    is basically a distribution strategy, it''s completely eliminating the barrier
    to entry for adoption.


    (Krazit, n.d.)


    One of the criticisms of Android is that the market is now highly fragmented with
    different versions and variations of Android—a direct result of how Google releases
    Android to the manufacturers. This is in contrast to other devices, such as the
    iPhone where Apple has total control over the hardware and OS and significant
    influence over third-party application. Rubin defends this model, however. In'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'the same interview, Rubin further commented on this aspect (Krazit, n.d.);


    Controlling the whole device is great, (but) we''re talking about 4 billion handsets.
    When you control the whole device the ability to innovate rapidly is pretty limited
    when it''s coming from a single vendor. You can have spurts of innovation. You
    can nail the enterprise, nail certain interface techniques, or you can nail the
    Web-in-the-hand business, but you can''t do everything. You''re always going to
    be in some niche. What we''re talking about is getting out of a niche and giving
    people access to the Internet in the way they expect the Internet to be accessed.
    I don''t want to create some derivative of the Internet, I don''t want to just
    take a slice of the Internet, I don''t want to be in the corner somewhere with
    some dumbed-down version of the Internet, I want to be on the Internet.


    So by creating a mobile OS that meets the demands of the consumer as well as the
    needs of the manufacturers and wireless carriers, Google has an excellent distribution
    platform for their revenue-generating search and advertising business.


    # Apps


    One important way by which Android supports innovation beyond the core mobile
    stack is by enabling the development and distribution of third-party apps on Android.
    As of January 2011, over 200,000 apps have been developed. This, of course, is
    similar to the strategy Apple developed. However, there are key differences in
    their approach. Apple maintains tight control over their App Store, requiring
    developers to submit to a sometimes lengthy review process and providing Apple
    with the final approval for an app. Apps can be denied based on a number of criteria,
    most notably if they contain any content Apple feels objectionable. Google, on
    the other hand, requires very little review to publish an'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'app in the Android Market. While Google has the ability to ban a developer,
    remove an app from the Android Market, and even remotely uninstall apps from Android
    devices, in general their approach to app management is hands off.


    # Nexus Phones


    In January 2010, Google released its own smartphone, the Nexus One (N1) shown
    in Fig. 1.1. The N1 was developed by HTC and, by all accounts, it was an ideal
    model for how manufacturers should develop their phones. The processor was extremely
    fast (1 GHz), it was running the latest version of Android, and it had innovations
    such as three microphones which survey background noise and blend your voice to
    create the most clear conversation possible.


    ![](img/cc70feeb090256bc8913d756d59d1429_36_0.png)


    **Figure 1.1** Google Nexus One by HTC.'
