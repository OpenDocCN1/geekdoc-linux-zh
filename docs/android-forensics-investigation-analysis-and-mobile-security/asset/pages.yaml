  md: 'Many of the commercial mobile forensic software vendors now support Android.
    To date, the forensic software only supports a logical examination of an Android
    device using the same Content Provider technique used by AFLogical. It can be
    helpful for a forensic examiner to understand how each of the forensic software
    vendors implement Android support.


    Each software company provided an evaluation copy of their software as well as
    an overview of their platform, which is included at the beginning of each section.
    A Motorola Droid running Android 2.2 was used for the examination. This section
    is not intended to evaluate each platform, but rather provide a helpful overview.
    The following forensic software packages were provided (reviewed in alphabetical
    order):


    +   * Cellebrite UFED

    * Compulsion MOBILedit!

    * EnCase Neutrino

    * Micro Systemation XRY

    * Paraben Device Seizure

    * viaForensics'' viaExtract


    Two additional forensic software packages were tested. However, issues were encountered
    which prevented their inclusion in this time. These vendors do provide a forensic
    solution for Android and, if interested, you should review their offerings independently.
    The software packages omitted were Oxygen Forensic Suite 2010 and Logicube''s
    CellDEK.


    The challenge with any such overview is that the forensic software is updated
    frequently enough that a newer version likely'
  merge: -1
  pgno: 373
- img_proc: true
  md: 'already exists. Forensic examiners and security engineers interested in a particular
    software package should check the vendor''s web site or contact them directly.


    # Cellebrite UFED


    The following overview of Cellebrite UFED system is a stand-alone device


    The Cellebrite UFED Forensic system is capable of acquiring data from approximately
    1600 mobile devices and storing the information on a USB drive, SD card or PC.
    UFED also has a built-in SIM card reader and cloner. The ability to clone a SIM
    card is a powerful feature as you can create and insert a SIM of the original
    SIM and the phone will function normally. However, it will not register on the
    mobile carrier''s network, eliminating the need for Faraday bags and the possibility
    that the data on the phone will be updated (or erased). The UFED package ships
    with about 70 cables for connecting to most mobile devices available today. Connection
    protocols supported include serial, USB, infrared, and Bluetooth.


    Cellebrite also distributes the UFED Report Manager, which provides an intuitive
    reporting interface and allows the user to export data/reports into Excel, MS
    Outlook, Outlook Express, and CSV or simply print the report.


    The UFED device fully supports Unicode and thus, can process phones with any language
    enabled. Also, the following data types are extracted:


    +   - Phone Book


    +   - Text Messages'
  merge: -1
  pgno: 374
- img_proc: true
  md: '+   - Call History (Received, Dialed, Missed)

    - SIM ID Cloning

    - Deleted Text Messages off SIM/USIM

    - Audio Recordings

    - Videos

    - Pictures

    - Phone Details (IMEI/ESN phone number)


    # Installation


    The UFED system is a stand-alone unit and is packaged in a soft case containing
    the UFED device, user manual, software CD-ROM, USB Bluetooth radio (Cambridge
    Silicon Radio Ltd), 250 MB USB drive, and roughly 72 cables for connecting to
    supported devices.


    The UFED system provides several mechanisms by which the firmware and software
    can be updated. After setting the date and time, an examiner can simply connect
    the UFED system to the network via an Ethernet cable, provided DHCP and Internet
    access are available. Next, select Services, Upgrade, Upgrade Application Now,
    and select HTTP Server as the source. For this test, the latest Application software,
    version 1.1.0.5, was located and installed. The UFED system is a stand-alone solution,
    no additional installs are necessary.


    # Acquisition


    The acquisition of the Motorola Droid was quite fast and simple on the UFED system.
    After powering the device on, select Extract Phone Data, Motorola CDMA, Moto.
    A855 Droid (Android), USB disk drive (destination), and the desired Content types.
    The'
