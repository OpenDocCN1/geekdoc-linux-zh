    workstation, the permissions change:


    ```

    ahog@ubuntu:~$ ls -l /mnt

    d-------- system system 2011-01-23 10:08 emmc

    drwxr-xr-x root system 2011-01-23 10:08 asec

    drwx------ root root 2011-01-23 10:08 secure

    d-------- system system 2011-01-23 10:08 sdcard

