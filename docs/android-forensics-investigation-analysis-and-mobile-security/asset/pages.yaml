    # YAFFS Example


    In this final section about YAFFS2, a fictitious scenario is presented to illustrate
    how ObjectHeaders and Objects are written to the NAND flash. The example was presented
    by Charles Manning in his “How Yaffs Works” (How YAFFS works, n.d.). Anyone interested
    in the internals of YAFFS is encouraged to print, read, or re-read this document.
    In the example, we use a NAND flash which, for simplicity, has four chunks per
    block and is erased (0xFF). After each change is described, a table will show
    the contents of the NAND flash.


    First, we create an empty file on the NAND flash as shown in Table 4.6.


    Table 4.6 Blank File Created


    | Block | Chunk | ObjectId | ChunkId | Status (Live or Shrink/Delete) | Comment
    |

    |---|---|---|---|---|-|

    | 0 | 0 | 500 | 0 | Live | ObjectHeader for blank file, length of 0 |'
