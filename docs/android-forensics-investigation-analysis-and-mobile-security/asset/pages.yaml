    # YAFFS2 Strings Analysis


    We have already demonstrated one example of using strings to find data on an Android
    device. However, let''s work through another exercise to demonstrate not only
    the technique but with the power of this type of analysis.


    For this example, the examiner needs to find location information on the Android
    device. One term to search for, especially on an Android device, is maps.google.com
    as the Google Maps service is tightly integrated into the operating system. An
    extremely powerful utility for search is called grep and is used extensively it
    is now a verb in technical vernacular (“Did you grep the device for map references?”).
    It is not only built into the Ubuntu virtual machine but it also supports very
    powerful regular expressions (often shortened to regex or regexp), which allow
    such sophisticated pattern matching. There are many online resources which introduce
    both grep and regex with good examples.


    For our example, we are going to use grep for its most basic functionality where
    we simply search for a string:'
  merge: -1
  pgno: 543
- img_proc: true
  md: '```

    ahog@ubuntu:~$ strings --all --radix=x htcinc-mtd6-datadata.nandump | grep

    maps.google.com | less

    69e6 http://maps.google.com/7q-Naperville+Crime+Prevention&

    cid=1468313092489466583d2e7cc

    http://maps.google.com/7q-Kennedy+Space+Center+Visitor+Complex&

    cid=3693916283250854638d3f0fc

    http://maps.google.com/query=2047oi-miwd&sa=Xict-miw_details&cd-14lei=3ovVUTC

    aZn21Wfg2dy2OBQ4q-Kennedy-Space-Center,Fl&cad-ip:174.253.2.53,client:

    maps-mobile.com;3693916283250854638d3f0fc;srcclink

    ```


    The query returned 775 examples—only a few are displayed here for brevity and
    privacy reasons. However, it is quite easy to determine some of the activity that
    took place on the device. Specifically:


    +   - A search (the q= in the URL stands for query) for Naperville Crime Prevention
    was conducted and the URL is valid complete with address, phone number, pictures,
    directions, and more.

    - A search for Kennedy Space Center Visitor Complex was also performed.

    - The Kennedy Space Center query was then viewed by the mobile maps application
    and we can even see the IP address.


    If we take a look at the IP address, which is part of the last query (174.253.2.53),
    we can use either command line tools or an online IP lookup service (What Is My
    IP Address, n.d.) to find additional information. The results are shown in Fig.
    7.12.'
