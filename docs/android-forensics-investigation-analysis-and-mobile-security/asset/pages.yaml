  md: 'Line 45: The “/mnt/asec” directory contains the unencrypted apps that are stored
    on the SD card. When Android introduced the ability to store apps on the SD card,
    they encrypted the contents for security reasons. However, when the system is
    up and running and unencrypted access to the files is necessary, they are decrypted
    and mounted in “/mnt/asec.”


    Line 46: The “/mnt/emmc” contains the FAT32 file system that resides on the NAND
    flash for some devices. Lines 47 through 55 are several examples of eMMC subdirectories.


    Line 51: The “/mnt/emmc/DCIM directory,” album thumbnails are stored here.


    Line 52: The “/mnt/emmc/DCIM/100MEDIA” directory contains any pictures or videos
    taken by the HTC Incredible.


    Line 53: The “/mnt/emmc/LOST.DIR” directory are found on FAT32 partitions and
    may contain files or fragments that the file system lost track of (similar to
    YAFFS2 lost+found directory). This directory should be examined.


    Line 56: If a physical SD card is present, it is mounted at “/mnt/sdcard.”


    Line 66: As with the eMMC, “/mnt/sdcard/dcim” directory would store pictures and
