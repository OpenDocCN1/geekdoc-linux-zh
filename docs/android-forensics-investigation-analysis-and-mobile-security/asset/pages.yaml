    Let’s make sure the removeOOB.py results are what we expect.

    According to "/proc/mtd," the "/dev/mtd/mtd6" partition has a

    size of 0x9500000 bytes and an erase size (block size) of 0x20000.

    The overall size in bytes is 156,237,824 (simply convert the size

    from hex to decimal) or roughly 154 MB. Similarly, the erase size is

    2048 bytes, so if we divide 156,237,824 by 2048, we will get 72,688

    blocks in the data. This corresponds to the results from

    removeOOB.py. But there is one more thing we can check. As we

    know the nanddump has 64 bytes of OOB data after each 2k chunk,

    total nanddump size on disk should be (72,288 × 64)

    + 156,237,824. The total should then be 161,120,256, which

