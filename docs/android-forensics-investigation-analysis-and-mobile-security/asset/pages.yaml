  md: 'One final, and very important, USB interface exposes the Android Debug (ADB)
    that allows a developer, forensic analyst, or security engineer to communicate
    and control an Android device over USB. By default, an AVD (running in the emulator)
    will have USB debugging enabled. However, non-emulator devices must explicitly
    enable usb debugging. To enable, select Applications -> Development from the devices
    Setting’s, as shown in Fig. 3.30. Finally, check USB debugging.


    ![](img/cc70feeb090256bc8913d756d59d1429_167_0.png)


    FIGURE 3.30 Enable USB debugging.


    Once set, the device will run the ad daemon (adbd) in the background and wait
    for a USB connection. The daemon will run under the non-privileged shell user
    account to limit the access it has to data. AVDs and physical devices that have
    root access enabled will run adbd as root providing complete access to the system.
    Additional details on this topic will be covered in Chapter 6.


    In newer versions of Android, anytime a device with USB debugging enabled is connected
    over USB, it will display a security warning as seen in Fig. 3.31.'
