  md: 'As we are now prepared to acquire the device, it may be helpful to refer back
    to the NAND flash and file system topics in Chapter 4 if some of the terminology
    or data structures are confusing. There are four Android physical acquisition
    strategies you can use once you have a device with root access:


    +   1. Full nanddump of all partitions, including data and OOB (preferred)

    2. A dd image of partitions, which only acquires the data, not the OOB

    3. A logical acquisition of files using tar

    4. A logical acquisition of files using adb


    In addition, there are two primary ways to save the acquired data from the device:


    +   1. Use adb port forward to create a network between the Ubuntu workstation
    and Android device over USB

    2. Place an SD card into the device, mount, and save locally


    There are advantages to both approaches. With adb port forwarding, you do not
    need to insert your own device and can immediately create the files on your workstation.
    When you save to the SD card, the acquisition is much faster. Both approaches
    are valid and will be demonstrated here.


    We will start with the full nanddump of the user data partition as this provides
    the most complete forensic copy of the data. To achieve the nanddump, you must
    have a version of nanddump compiled for the ARM platform. Cross-compiling nanddump
    is beyond the scope of this book. However, you can either search for'
  merge: -1
  pgno: 451
