    # Android Open Source Project


    The open strategy behind Android naturally led to the release of the Android source
    code through the AOSP on October 21, 2008. The site sites (Get Android source
    code, n.d.):


    > We created Android in response to our own experiences launching mobile apps.
    We wanted to make sure that there would always be an open platform available for
    carriers, OEMs [original equipment manufacturers], and developers to make their
    innovative ideas a reality. We wanted to make sure that there was no central point
    of failure, where one industry player could restrict or control the innovations
    of any other. The solution we chose was an open and open-source platform.'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'The development strategy focuses on flagship devices (for instance, the Nexus
    series), which allows Google to absorb much of the risk with a new platform. The
    manufacturers can then use the latest release of Android on their devices while
    the AOSP develops the next major release.


    # AOSP Licenses


    The AOSP is given by two primary software licenses, the Apache Software License
    2.0 (Apache 2.0 or ASL2.0) and the GNU Public License v2 (GPLv2). The GPLv2 is
    a far more restrictive license that forces contributors to distribute all of their
    code under the same license. Google felt this would limit the commercial backing
    of Android, so the GPLv2 primarily covers the use of the Linux kernel core to
    Android only.


    The Apache 2.0 license, however, is more accepted by commercial entities because
    it is less restrictive and does not force companies to open source all of their
    related software. The AOSP addresses the question of why they chose the Apache
    2.0 license (Licenses, n.d.):


    > We are sometimes asked why Apache Software License 2.0 is the preferred license
    for Android. For userspace (that is, non-kernel) software, we do in fact prefer
    ASL2.0 (and similar licenses like BSD, MIT, etc.) over other licenses such as
    LGPL.


    > Android is about freedom and choice. The purpose of Android is to promote openness
    in the mobile world, but we don''t believe it''s possible to predict or dictate
    all the uses which people want to put our software. So, while we encourage everyone
    to make devices that are open and modifiable, we don''t believe it is our place
    to force them to do so. Using LGPL libraries would often force them to do so.


    Here are some of our specific concerns:'
  merge: -1
  pgno: 63
- img_proc: true
  md: '+   1. LGPL (in simplified terms) requires either: shipping of source to the
    application; a written offer for source; or linking the LGPL-ed library dynamically
    and allowing users to manually upgrade or replace the library. Since Android software
    is typically shipped in the form of a static image, complying with these requirements
    ends up restricting OEMs designs. (For instance, it’s difficult for a user to
    replace a library on read-only flash storage).


    +   2. LGPL requires allowance of customer modification and reverse engineering
    for debugging those modifications. Most device makers do not want to be bound
    by these terms, so to minimize the burden on these companies we minimize usage
    of LGPL software in userspace.


    +   3. Historically, LGPL libraries have been the source of a large number of
    compliance problems for downstream device makers and application developers. Educating
    engineers on these issues is difficult and slow-going, unfortunately. It’s critical
    to Android’s success that it be as easy as possible for device makers to comply
    with the licenses. Given the difficulties of complying with LGPL in the past,
    it is most prudent to simply not use LGPL libraries if we can avoid it.


    The issues discussed above are our reasons for preferring ASL2.0 for our own code.
    They aren''t criticisms of LGPL or other licenses. We do feel strongly on this
    topic, even to the point where we''ve gone out of our way to make as much code
    as possible is ASL2.0. However, we love all free and open source licenses, and
    respect others'' opinions and preferences. We''ve simply decided that ASL2.0 is
    the right license for our goals.


