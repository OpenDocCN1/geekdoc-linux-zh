  md: 'medium. YAFFS2 is


    +   - log-structured file system (which protects data even through unexpected
    power outages)

    - provides built in wear-leveling and error correction

    - capable of handling bad blocks

    - fast and has a small footprint in RAM


    However, since its usage was limited prior to Android, there are currently no
    forensic tools (commercial or open source) that support the file system. This
    leaves the forensic analysts with few options except to download the YAFFS2 source
    code, grab a forensic image of a partition, open it up in your favorite hex editor,
    and start digging. Although some utilities should develop over time, Android''s
    move to EXT4 may reduce the motivation for commercial forensic companies to develop
    such support.


    As covered in the NAND flash section, YAFFS2 addressed the memory in blocks through
    the MTD subsystem and each block contains a set number of pages (called chunks
    in YAFFS2 documentation and code). When YAFFS2 is ready to write data to the NAND
    flash, it passes both the data and metadata structures to the MTD. The MTD is
    then responsible for writing (as well as reading) both the data and the metadata
    to the NAND flash.


    For most Android devices, the MTD subsystem addressed NAND flash in blocks that
    are divided into 64 chunks with each chunk containing 2048 bytes (so blocks are
    128K) plus a 64-byte out-of-band/spare area (OOB) where various tags and metadata
    are stored. When a block is allocated for writing, it is assigned a sequence number
    that starts at 1 and increments with each new block.


    All data structures stored in YAFFS2 are referred to as Objects and can be files,
    directories, symbolic links, and hard links. Each chunk either stores a yaff_ObjectHeader
    (object metadata) or data for the object. The yaff_ObjectClass tracks various
    information including the Object type, the parent object, a checksum of the memory
    to speed up searching, the object'
  merge: -1
  pgno: 229
- img_proc: true
  md: 'name, permissions and ownership, MAC information, and the size of the object
    if it is a file.


    In the 64-byte OOB/spare area, YAFFS2 not only stores critical information about
    the chunk but also shares the area with the MTD subsystem. The critical YAFFS2
    tags are as follows:


    +   - 1 byte: block state (0xFF if good, any other value for a bad block)

    - 4 bytes: 32-bit chunk ID (0 indicates that chunk is storing a yiffs_ObjectHeader,
    else data)

    - 4 bytes: 32-bit Object ID (similar to traditional Unix inode)

    - 2 bytes: number of data blocks in this chunk (all but final chunk will be fully
    allocated)

    - 4 bytes: sequence number for this block

    - 3 bytes: ECC for tags (in Android, handled by MTD)

    - 12 bytes: ECC for data (in Android, handled by MTD)


    If an object is changed, a new yiffs_ObjectHeader is written to flash because
    NAND memory can only be once before erasing. The old data and headers still exist
    but are ignored in the file structure by examining the values. This process complies
    with the guideline that NAND can never be re-written (only written once and then
    erased when no longer needed). This, of course, can be of enormous benefit to
    the data-recovery process as modified or deleted data will still exist on the
    NAND unless the block went through the garbage collection process used to erase
    a block and prepare it to accept new data.


    Similarly, when a file is deleted in YAFFS2, the parent directory for the ObjectHeader
    is moved to a special, hidden directory called unlinked. The file remains in this
    directory until all of the chunks in the file are erased. To achieve this, the
    file system tracks the number of chunks in the system for the file. When it reaches
    0, the remnants of the file no longer exist. At that point, it will no longer
    track the object in the unlinked directory.'
  merge: -1
  pgno: 230
- img_proc: true
  md: 'While the file system structure can be regenerated completely from the OOB
    area and ObjectHeader information, this is not efficient—especially as the size
    of NAND flash memory grows. The structure is thus loaded and maintained in RAM
    (with writes to the NAND flash as needed) using tree-node structure (T-node) to
    track all allocated chunks. T-nodes are a fixed 32 bytes, and at their lowest
    level (level 0), an index is used to locate the first chunk ID. As the file size
    grows, additional levels are added, which consist of eight pointers to other T-nodes.


    To regenerate, YAFFS2 reads each chunk in its block allocation order, starting
    from the end and working back, and populates the file system structures as T-nodes
    in RAM. This requires scanning the entire NAND—a time-consuming operation. To
    work around this issue, checkpointing was developed for YAFFS2, which prefers
    the RAM structure to NAND flash (using 10 blocks) when it is properly unmounted.


    A few other key concepts are needed to round out your understanding on YAFFS2.
    First, garbage collection is queued up and, if needed, is done each time a write-to-the-system
    occurs. If all the chunks in a block are no longer in use, the block is a candidate
    for garbage collection. The system is also capable of taking the “dirtiest” block,
    copying allocated chunks to new blocks, thus making the block available for garbage
    collection. To make the block available again, it is erased by writing all 1’s
    (0xFF).


    On an Android device, we can find detailed information about the YAFFS2 file systems
    by examining the /proc/yaffs files:'
