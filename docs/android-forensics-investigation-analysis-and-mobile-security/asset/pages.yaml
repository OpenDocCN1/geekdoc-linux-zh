    # Sensitive App Data


    Many mobile apps contain sensitive data that the consumer would not want out of
    their control. There are various levels to the data. Here is a simplistic list
    designed to illustrate the levels:


    +   1. No sensitive user data—for example, a calculator app would not contain
    any sensitive user data.

    2. No sensitive user data but some potential metadata—for example, a weather application
    would not contain any sensitive user data; however, it might contain the GPS coordinates
    and date/time stamp when it was run.

    3. Contains user data but not sensitive—some applications are intended for public
    consumption such as messages people share on Twitter. If a user was informed that
    all of his or her Twitter messages were readable by the world, most (except those
    which protect their messages) would not be concerned.

    4. Contains sensitive user data—many applications fall into this category and
    contain sensitive user data such as your e-mail messages, SMS and MMS messages,
    voice mail, call logs, and more.

    5. Highly sensitive user data—this is a special level that covers apps that contain
