  md: '# Chapter 7


    # Android application and forensic analysis


    Information in this chapter


    +   - Analysis techniques

    - FAT forensic analysis

    - YAFFS2 forensic analysis

    - Android app analysis and reference


    # Introduction


    A lot of material has been discussed up to this point in the book covering not
    only the history and architecture of Android devices but also complete details
    on the file systems, ways to secure devices, and methodology to acquire data from
    them. But data without context and analysis is just noise. Many of the techniques
    used in traditional forensic investigations are applicable in Android forensics
    analysis.


    # Analysis techniques


    This section will provide an overview of the analysis techniques followed by sections
    that demonstrate the procedures for specific'
  merge: -1
  pgno: 461
- img_proc: true
  md: 'file systems.


    # Timeline Analysis


    Timeline analysis should be a key component to any investigation as the timing
    of events is nearly always relevant. There are many ways to build a forensic timeline.
    However, unless created with specialized software, the process can be quite tedious.
    Several software techniques will be covered in detail in the chapter including
    free, open source forensic utilities from both The Sleuth Kit and log2timeline.
    Other forensic tools can create timelines as well.


    For supported file systems (for example, the FAT16/FAT32 file systems found on
    the SD cards and embedded MultiMediaCard [eMMC]), a number of tools are available
    which can create the timeline. However, YAFFS2 is not currently supported by any
    analysis tool and so creating a timeline requires significant manual analysis.


    The primary source of timeline information is the file system metadata including
    the modified (file metadata), accessed, changed (file contents), and created.
    This metadata is often referred to as MAC times or sometimes MACB where the “B”
    represents when a file was created (born). File systems track different time stamps
    and have nuances that must be taken into account when performing forensic analysis.


    For example, Microsoft’s FAT file system has been the subject of many forensic
    investigations and analyses. The Microsoft Developers Network (MSDN) provides
    details on file times in FAT and NTFS systems, stating:'
  merge: -1
  pgno: 462
- img_proc: true
  md: 'Not all file systems create record creation and last access times, and not
    all file systems record them in the same manner. For example, the resolution of
    create time on FAT is 10 ms, while write time has a resolution of 2 s, and access
    time has a resolution of 1 day, and hence, it is really the access date. The NTFS
    file system delays updates to the last access time for a file up to 1 h after
    the last access.


    (File Times, n.d.)


    Andre Ross created a useful graphical representation of this on his digfor (DIGITAL
    FOREnsics) blog (http://digfor.blogspot.com/2008/10/time-and-timestamps.html)
    shown in Fig. 7.1 (Ross, A., n.d.).


    ![](img/cc70feeb090256bc8913d756d59d1429_463_0.png)


    FIGURE 7.1 FAT and NTFS time stamps.


    To further illustrate how FAT time stamps work, digital forensics and incident
    response firm cmdLab posted a blog entitled'
  merge: -1
  pgno: 463
- img_proc: true
  md: '“Misinterpretation of File System Timestamps” (Casey, E., n.d.), which provides
    full details on FAT time stamps.


    The confusion arises from the fact that FAT file systems create and last-write
    time stamps slightly differently. Last-write time stamps are 32-bit little-endian
    values, interpreted as follows:


    | 24 | | 16 | | 8 | | 0 |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---||

    | Y| Y| Y| Y| Y| Y| M| | M| M| M| D| D| D| D| D| h|h|h|h| m|m|m|m| s|m|s|s|s|s|

    | year | month | day | hour | minute | second |


    Take as an example the following FAT folder entry with the last-write date highlighted
    in bold:


    ```

    $ icat /dev/sdb1 353884 | xxd

    000000: 2e20 2020 2020 2020 0034 0fb79 . 0..o.y

    000010: 763a 0020 0b59 763a 05a2 0000 0000 v:v:yw::

    000020: 2e2e 2020 2020 2020 2010 00f4 b079 ..O.y

    000030: 763a 0000 0b79 763a 6605 0000 v:v:yw:f..

    000040: 4173 0061 006c 0065 0005 009e 66e0 As.a.l.v.e..n.

    000050: 6500 077f 3400 2e00 6700 0900 6660 e.w.4.g..i.f.

    000060: 5341 4c56 045e 73e1 4749 4620 0075 789 SALVEN-1GIF ux.

    000070: 763a 0000 7b9f 753a 9212 c1d4 0000 u:v:x..u.....

    000080: 4269 0066 0000 0fff fff0 0014 ffff Bi.......

    000090: ffff ffff ffff ffff ffff 0000 ffff ffff ffff

    ```


    Converting to big endian bytes 3a 75 b9 77, which has the following binary representation:


    ```

    00110110 01110101 10110101 01110100

    ```


    This translates to a time stamp of 2009.03.21 23:11:48 as follows:


    +   - 7 bits = 00110101 = 29 years since 1980'
  merge: -1
  pgno: 464
- img_proc: true
  md: '• 4 bits = 0011 = 3 months


    • 5 bits = 10101 = 21 days


    • 5 bits = 10111 = 23 h


    • 6 bits = 001011 = 11 months


    Note that 5 bits cannot store all 60 s, so last-write time stamps must be incremented
    in 2 s intervals, and are always an even number of seconds.


    Although the create time follows a similar general calculation, it uses an additional
    8 bits to represent one hundredths of a second. In the same directory listing
    above, the create time is identical to the last modified time stamp except for
    an additional byte (75 78 b9 75 3a). The additional byte equates to 117 hundredths
    of a second, which brings the create time to 2009.03.21 23:11:49.17. Thus, the
    create time can have an odd number of seconds, and has a resolution of 10 ms.


    One tool used in this book for timeline analysis is The Sleuth Kit (TSK), which
    supports several file systems. The TSK wiki provides the information presented
    in Table 7.1 to define the meaning of MACB time stamps for the supported file
    systems (Carrier, B., n.d.).


    Table 7.1 MAC Meaning by File System


    | File System | m | a | c | b |

    |---|---|---|---|--|

    | Ext 2/3 | Modified | Accessed | Changed | N/A |

    | FAT | Written | Accessed | N/A | Created |

    | NTFS | File modified | Accessed | MFT modified | Created |

    | UFS | Modified | Accessed | Changed | N/A |'
  merge: -1
  pgno: 465
- img_proc: true
  md: 'Unfortunately, TSK does not, as of version 3.2.1, fully support YAFFS2. However,
    there are some efforts to provide this information. For Android, TSK is effective
    in analyzing the FAT file systems as well as EXT3 which is found on some devices.
    TSK does not yet fully support EXT4 but the software is updated frequently and
    examiners should check the web site http://www.sleuthkit.org/ for the most recent
    changes.


    # File System Analysis


    As discussed throughout this book, the directories and files in the Android file
    systems are obviously the primary focus of a forensic investigation. The final
    section of this chapter and book, “Android App Analysis and Reference,” will provide
    a detailed analysis of Android apps. Combining this information with techniques
    demonstrated in Chapter 4 will provide the most significant results for an investigation.


    There are a number of directories that need to be examined for an investigation.
    Over time, examiners will need to expand the list to include new directories and
    files, as Android devices are changing rapidly. The best way to approach this
    problem is to first run the following command to determine which file systems
    are mounted on the system, where they are mounted, and what type they are. To
    demonstrate, let''s look at four different Android phones including a T-Mobile/HTC
    G1, a Google One, a Motorola Droid, and an HTC Incredibleible.


    To start, let''s examine the output of the mount command on the G1 running Android
