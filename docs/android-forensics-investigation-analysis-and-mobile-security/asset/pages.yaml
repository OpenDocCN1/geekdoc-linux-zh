  md: 'Once you have the Android SDK installed on your workstation and have at least
    one release platform downloaded, you are ready to create an AVD, a virtual mobile
    device, or emulator, which runs on your computer. The emulator is especially helpful
    for developers for creating custom applications. However, there is great value
    for forensic analyst and security engineer because you can profile how applications
    execute on a device. This could be important to validate your findings in an investigation,
    or to test how a forensic tool affects an Android device.


    The emulator takes considerable resources, so an ideal workstation would have
    a newer sufficient CPU and RAM. A bit of patience from the examiner may also be
    required. To create an AVD, first run the Android SDK and AVD manager as seen
    in Fig. 3.16. If you updated your OS''s path to include the tools directory in
    the SDK, you should be able to run Android from a shell, terminal, or command
    prompt.


    ![](img/cc70feeb090256bc8913d756d59d1429_144_0.png)


    **FIGURE 3.16** Start Android SDK and AVD manager.


    In the left pane, select Virtual devices and then select New, as in Fig. 3.17.


    # Make sure you populate the following fields'
  merge: -1
  pgno: 144
- img_proc: true
  md: '• Name: Provide a name for the virtual device, for example, af23 (Android Forensics
    2.3).


    • Target: Select the target platform, in this case Android 2.3—API level 9.


    • [optional] SD card: Optionally create an SD card for the virtual device.


    ![](img/cc70feeb090256bc8913d756d59d1429_145_0.png)


