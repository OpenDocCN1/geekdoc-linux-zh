- img_proc: true
  md: 'The procedure is quite simple really. Android sends out a number of broadcast
    messages which an application can receive, such as SMS received or Wi-Fi.com disconnected.
    An application has to register its receiver to receive broadcast messages and
    this can be done at run time, or for some messages, at install time. When a relevant
    message comes in, it is sent to the application and if the application is not
    running it will be started automatically.


    After testing various broadcast messages the one I found for the purpose of this
    utility was android.intent.action.PACKAGE_ADDED. This exists in all APIs version
    1 and is triggered when an application is installed. Hence, to get the application
    to execute remotely, we first deploy it from the Android Market, then deploy any
    other application that will cause the first one to launch.


    Once launched it is just a matter of calling the disableKeyguard() method in Keyguard.
    This is a legitimate API to enable applications to disable the screen lock when,
    say, an incoming phone call is detected. After finishing the call the app ought
    to enable the screen lock again, but we just keep it disabled.


    This technique is certainly worth consideration if you have proper access to the
    Android Market.


