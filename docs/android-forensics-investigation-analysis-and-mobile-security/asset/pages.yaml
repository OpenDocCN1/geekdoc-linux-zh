    Forensic analysts and security engineers can learn a great deal about Android
    and how it operates by leveraging the emulator and examining the network, file
    system, and data artifacts.


    # Android OS Architecture


    It is important to understand the high-level architecture of Android, especially
    for security procedures and moving beyond logical forensic analysis.


    Android is based on the Linux 2.6 kernel that provides the fundamental software
    needed to boot and manage both the hardware and Android applications. While the
    functionality that the kernel provides is quite extensive, we will focus on core
    areas highlighted in Fig. 3.23.'
  merge: -1
  pgno: 149
- img_proc: true
  md: '![](img/cc70feeb090256bc8913d756d59d1429_150_0.png)


    **FIGURE 3.23** Android architecture.


    As illustrated in Fig. 3.23, low-level functions include power management, Wi-Fi.com,
    display drivers, and more. Perhaps most important from a forensics perspective
    is the flash memory driver, which will be explored in detail in Chapter 4.


    After the kernel, a set of libraries are available, which provide core functionality
    needed by developers and device owners alike. These include the WebKit library
    for rendering HTML in the bundled browser and third-party apps. Other libraries
    handle fonts, displays, various media, and secure communications using Secure
    Socket Layers (SSLs). Finally, the SQLite library provides a method for structured
    data storage on Android and is an area forensic analysts and security engineers
    will focus.


    The core libraries are then bundled with a custom Java virtual machine (VM) to
    provide the Android runtime environment, which is where applications run.


    Finally, the SDK provides access to these resources via APIs and an application
    framework. The framework is what third-party developers interact with and it provides
    them abstract access to key resources'
  merge: -1
  pgno: 150
- img_proc: true
  md: 'needed for their application. As we explore logical forensic techniques, an
    important aspect of the application framework—content providers—will be explained
    in more detail they provide the primary mechanism by which we can extract data
    from an Android device.


    # Dalvik VM


    The Dalvik Virtual Machine (Dalvik VM) was developed by Google to create an efficient
    and secure mobile application environment.


    To achieve the desired security, each application is run on its own Dalvik VM.
    As such, the Dalvik VM was written so that many VMs could run at once on an Android
    device. The Dalvik VM relies heavily on the Linux OS to provide low-level functions
    such as access to core libraries and hardware, threat and security management,
    memory management, and more.


    To achieve efficiency, applications that run in a Dalvik VM have a special format
    called a Dalvik Executable (.dex). Developers write and compile their programs
    with Sun''s Java Development Kit and the resulting byte code is then transformed
    into a .dex file which provides efficient storage and is optimized for execution
    in the Dalvik VM. An interesting project developed by JesusFreke, an accomplished
    and well-known Android hacker, is called smalibakali. This project allows a user
    to decompile a .dex file to determine what an application does (smali, n.d.).


    Dalvik is a unique aspect of Android and a critical component in the forensic
    and security analysis of a device.


    # Native Code Development


    While most Android applications are written in Java using the SDK, Google provides
    a lower level development platform with their native development kit (NDK). The
    NDK was first released in June 2009 and has gone through five revisions, with
    the latest release in November 2010.


    The NDK allows developers to write code in C/C++ and compile directly for the
    CPU. While this adds complexity to the development process, some developers can
    benefit from this approach by reusing an existing code'
  merge: -1
  pgno: 151
- img_proc: true
  md: 'base in C/C++ + or by implementing certain functions that can be optimized
    outside the Dalvik VM. The NDK does not allow developers to create full applications
    that run outside of the Dalvik VM; instead the C/C++ + components are packaged
    inside the application''s .apk file and are called by the application within the
    VM.


    At this time, the NDK supports the ARMv5TE and ARMv7-A CPUs, and in the developer
    writes code in one platform (e.g., Mac OS X) but compiles it for another CPU,
    the technique is referred to as cross-compiling an application. The NDK greatly
    simplifies this process and provides a set of libraries the developer can use.


    From forensics and security viewpoint, cross-compiling is an important component
    for research and development of new techniques and exploits. While most forensic
    analysts and security engineers do not need to compile code, understanding how
    the process works, and what role it plays in the process, is important. For example,
    the initial Android 1.5 root exploit targeted a Linux kernel bug (CVE-2009-2692)
    to gain privileges. The initial code was distributed as source code and required
    cross-compiling. One significant advantage to this approach is that an examiner
    can describe in exact detail how the device was exploited and, if necessary, provide
    the source code.


    As Android matures, expect to see additional developments in the NDK and natively
    compiled code.


    # Android security model


    The Android platform implements security through a number of controls designed
    to protect the user.


    When an application is first installed, Android checks the .apk file to ensure
    it has a valid digital signature to identify the developer. Unlike SSL, the digital
    certification does not need to be signed by a Certificate Authority. However,
    the developer must keep the key safe; otherwise someone could sign a malicious
    application and distribute it as that developer. For example,'
  merge: -1
  pgno: 152
- img_proc: true
  md: 'if a financial institution’s digital signature was compromised, a malicious
    developer could publish an update to the banking application, which steals critical
    data.


    After the .apk file is validated, Android checks the special file created by the
    developer that specifies, among other items, what access an application needs
    to the system. For example, an application may request access to the user’s contacts,
    SMS messages, and the network/Internet. If this application adds functionality
    to the SMS system, these permissions seem reable. If, however, the application
    simply changes your background images, then a user should question the permission
    and can choose not to install the application. In practice, users quickly allow
    all permissions and application requests, and thus may allow a malicious application
    to install.


    After an application has been verified and the user granted the requested permissions,
    the application can now install on the system. A key part of the Android security
    model is that each application is assigned a unique Linux user and group ID and
    runs in its own process and Dalvik VM. During the installation, the system creates
    a specific directory on the device to store the application’s data and only allows
    that application to access the data leveraging the Linux user ID and group ID
    permissions. In addition, the application’s Dalvik VM is run in its own process
    as the specific user ID. These key mechanisms ensure data security on the OS level
    as applications do not share memory, permissions, or disk storage. Applications
    can only access the memory and data within their Dalvik VM.


    Of course, there are a few exceptions to this process. First, a developer can
    sign more than one application with the same digital certification and specify
    that it can share the same user ID, process, memory, and data storage as one of
    their other applications. This situation is exceptional and is most commonly used
    when a developer has both a free and a paid version. If a user upgrades to the
    paid version, they can leverage the data accumulated while using the free version
    and thus no data are lost.


    Also, most Android users have the option to allow apps to be installed from non-Market
    locations and to skip the digital signature check. This option can'
  merge: -1
  pgno: 153
- img_proc: true
  md: 'be accessed from the Applications menu in the device''s Settings and, when
    selected, displays a warning to the user as shown in Fig. 3.24.


    ![](img/cc70feeb090256bc8913d756d59d1429_154_0.png)


    # FIGURE 3.24 Android setting to allow apps installs from unknown sources.


    The most common situation is that users could now install apps from websites by
    directly downloading an .apk file. The install process also skips the digital
    signature check. A AT&T phone (Motorola Backflip) removed this option from Android
    upsetting many users (Android On Lockdown, n.d.). However, a work-around using
    the Android SDK do exist and will be discussed in Chapter 6.


    As a result of the security architecture built into Android, forensic examiners
    do not have a simple way to extract core user data from a device. Barring exploits,
    the security architecture is effective in isolating and protecting data between
    applications.


    # Forensics and the SDK


    So how is the SDK important in forensics? The SDK not only provides a set of tools
    and drivers enabling the analysis of Android devices but is also useful for application
    profiling and other forensic research.'
  merge: -1
  pgno: 154
- img_proc: true
  md: '# Connecting an Android Device to a Workstation


    It is important to note how an Android device actually connects to a VM. Android
    devices, to date, have a physical USB interface that allows them to connect, share
    data and resources, and typically to recharge from a computer or workstation.
    If you are only running a single OS, the USB device should be detected and accessible.
    However, additional configuration or drivers may be required. If you are running
    a VM though, you simply want the host OS to pass the connection through to the
    VM. For example, if your host OS is OS X and you are running VMware fusion, you
    select the menus Virtual Machine -> USB and then Connect the device (High Android
    Phone in this case), as shown in Fig. 3.25.


    ![](img/cc70feeb090256bc8913d756d59d1429_155_0.png)


    **FIGURE 3.25** Connect device to Ubuntu VM in VMware Fusion.


    Similarly, when your host OS is Linux, and you are running the VM using Oracle''s
    VirtualBox, you must first ensure that you are a member of the usbusers group.
    So, from a terminal session, execute the following:'
  merge: -1
  pgno: 155
- img_proc: true
  md: '```

    # create ususers group

    sudo addgroup ususers

    ```


    ```

    # Add your username to the ususers group:

    sudo usermod -a -G ususers ahoog

    ```


    Next, you go into the VM''s Settings and add a USB Filter for the device, as shown
    in Fig. 3.26.


    ![](img/cc70feeb090256bc8913d756d59d1429_156_0.png)


    FIGURE 3.26 Adding USB filter on Linux host running Oracle''s VirtualBox.


    Finally, you can connect the USB device as shown in Fig. 3.27.'
  merge: -1
  pgno: 156
- img_proc: true
  md: '![](img/cc70feeb090256bc8913d756d59d1429_157_0.png)


    # ### FIGURE 3.27 Connecting USB device on Linux host running Oracle’s VirtualBox.


    Finally, here are the steps if you are running the VM headless (VirtualBox 3.2.10
    as outlined in Chapter 1). First, you need to install VBox Additions, which will
    enable a-shared folder, better video, VBox support (if you downloaded/bought the
