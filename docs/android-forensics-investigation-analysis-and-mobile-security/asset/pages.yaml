    # SSL/TLS


    One final area to discuss is the implementation of Secureockets Layer (SSL) and
    Transport Layer Security (TLS) that protects data in transit. It is critical that
    app developers properly implement SSL/TLS, including a full validation of the
    digital certificates to prevent MITM attacks. Although SSL/TLS is effective in
    protecting data in transit, without proper implementation it leaves the users
    highly vulnerable to attack. While testing apps for the appWatchdog service, a
    test-attacking machine would regularly display the user name and password for
    apps not in scope as it would automatically execute (i.e., some apps log in on
    a schedule to check to new messages) and fall victim to the compromise.


    Beyond ensuring SSL/TLS is properly implemented and validated in the mobile app,
    SSL/TLS must also be securely configured on the server. SSL has been available
    since the 1990s to secure data transmission on untrusted networks. Earlier implementation
    of SSL contained security flaws that had to be addressed to ensure secure transmission.
    And over time, the algorithms were improved to reduce the risk of a brute force
    attack. The latest versions of the'
