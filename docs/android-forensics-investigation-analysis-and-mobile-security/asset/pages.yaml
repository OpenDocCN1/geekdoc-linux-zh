    Line 1: At the top is the root directory, which creates the structure and mount
    points for the other file systems explored previously.


    Line 2: As previously discussed, the HTC Incredible created an “app-cache” directory
    of type tmpfs. You can see the browser cache structure. Presumably, over time,
    other apps may leverage this directory.


    Lines 6–8: Android devices from the start had a dedicated “/cache” directory that
    originally appeared to be unused. However, this is certainly not the case and
    the “/cache” partition should be imaged for full analysis. Files including Gmail
    attachment previews, Browser DRM, some downloads (Market and other), as well as
    Over The Air (OTA) updates from the wireless carriers can be found here.


    Line 9: The root level “/data” directory has a number of important subdirectories
    covered next. Note that some phones (such as the HTC Incredible) have a dedicated
    partition for the “/data/data” subdirectory.


    Line 10: The “/data/anr” directory contains stack traces (debugging) from the
    system and is generally not accessible to the shell user. However, some of the
    adb debug commands appear to read this data.


    Line 11: The “/data/app” directory contains the .apk files from the Android Market.'
