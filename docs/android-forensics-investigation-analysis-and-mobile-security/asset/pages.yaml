    #Huawei

    SUBSYSTEM="usb", SYSFS(idVendor)="12d1", MODE="0666"

    #Kyocora

    SUBSYSTEM="usb", SYSFS(idVendor)="4822", MODE="0666"

    #LG

    SUBSYSTEM="usb", SYSFS(idVendor)="10044", MODE="0666"

