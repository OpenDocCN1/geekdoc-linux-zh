  md: '+   The app stores a significant amount of information about maps, tiles, searches,
    and more in the files directory and should be closely examined.


    +   While each database may not contain information, both search_history.db and
    da_destination_history should be examined closely.


    +   While the shared_prefs direction contains some information, most is not useful
    to the time forensic examination. However, the authentication token can be recovered,
    which may be of interest in a security review.


    +   The Navigation function caches map data on the SD card, as well as .wav files
    of the actual directions. If you look at the time stamps on the file, which are
    prefaced with a “._speech_nav”, you can determine when the directions were provided
    and also hear the actual spoken directions.


