    # Android Features'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'While we explore the various Android device types more in the next chapter,
    there are several features common to most Android devices that we can discuss
    here.


    First, Android was engineered from the beginning to be online, whether using cellular
    networks such as Global System for Mobile Communications and Code Division Multiple
    Access (GSM/CDMA) or wireless networks (Wi-Fi). Regardless of the venue, the ability
    to be online is a core feature of any Android device. Many of the devices are
    indeed smartphones and thus support sending and receiving phone calls, text messages,
    and other services found on cellular networks. Interacting with the device is
    typically via a touch screen, but many devices also allow for keyboards or other
    buttons, which will support user interaction.


    A second core feature of Android devices is the ability to download and install
    applications (apps) from the Android Market. This is a primary feature to many
    users because it allows them to extend the functionality of the device. These
    apps also typically happen to be a rich source of information for forensic analysts.


    The final core feature is the ability for users to store their data on the devices.
    This, of course, is the basis for the forensics work covered in detail in this
    book. Most Android devices come with some-device storage using flash (NAND) memory
    as well as an external SD card that is portable and intended to store larger amounts
    of data. Some recent HTC devices are now shipping with an emulated SD card which
    is a separate USB device ID mapped to the NAND and presented as an SD card. The
    emulated SD cards are typically formatted with Microsoft’s FAT32 file system.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# Supported Cellular Networks


    As smartphones are the largest category of Android devices, it is important to
    understand the various cellular cellular technologies Android currently supports.


    The first Android device, the HTC DREA100 or T-Mobile G1, was a Global System
    for Mobile Communications (GSM) phone. GSM is the most widely used and supported
    cellular system throughout the world. Major wireless providers in the United States
    that support GSM include AT&T and T-Mobile. The GSM system leverages a subscriber
    identity module (SIM) or universal subscriber identity module (USIM) to identify
    the user to the cellular network.


    The next cellular system supported by Android is the Code Division Multiple Access,
    often referred to as CDMA. CDMA is the technique used to encode and send the voice,
    data, and control signals used by a CDMA phone. It is popular in the United States,
    but less so around the world. In the United States, the primary technology standard
    used is called CDMA2000. Major carriers include Verizon Wireless, Sprint, U.S.
    Cellular, and Cricket Communications.


    The final cellular system supported by Android is the Integrated Digital Enhanced
    Network, or iDEN, whose primary attraction is its support of the popular push-to-talk
    (PTT) feature. In the United States, the only large carrier supporting iDEN is
    Sprint Nextel (who also owns Boost Mobile). Motorola, the developer of iDEN, also
    developed the Motorola i1, the first Android phone supporting iDEN.'
