    Log files and debugging are two common and effective ways in which developers
    and administrators both maintain their system and their apps. It provides an insight
    into the apps as well as the system running them. While not true in every case,
    it is possible to gain important information from an Android device by simply
    examining various log and debug files.


    # Linux kernel logging


    The Linux kernel is the low, abstract interface of the Linux operating system
    that provides access to the hardware of a device. Since the role of the kernel
    is central to all functions on the device, the ability to log key events and activities
    is highly leveraged. The kernel log is accessible on a Linux (and Android) device
    through the command dmesg. This will print to console all available kernel messages,
    a portion of which is displayed here:


    ```

