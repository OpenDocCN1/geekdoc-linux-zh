    Line 25: The “/data/local” directory is important as it allows shell

    (the user account nonrooted phones run adbd as) read/write

    access. When an app is installed, it is first copied to “/data/local.”

    Also, some forensic techniques rely on this directory to upload

    important files, typically binaries.


    Line 26: The “/data/lost+found” directory shows up in several

    places in YAFFS2 file systems. Again, a quick search (try “grep -R

    lost+found *.c” from the YAFFS2 source directory we

    downloaded) will explain that any files or directories found that

    do not have a path to the root directory will be placed in this

    folder.'
