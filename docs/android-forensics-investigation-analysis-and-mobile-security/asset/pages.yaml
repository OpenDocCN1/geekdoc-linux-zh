    # Encrypted NAND Flash


    The techniques and strategies for secure data in transmission are, generally speaking,
    more mature, vetted, and secure than the technologies used to securely store data
    at rest. The reason data in transmission are easier to secure is because the duration
    of time in which the information must be protected is short and well defined.
    After the transmission of data in transit is complete, the keys'
  merge: -1
  pgno: 279
- img_proc: true
  md: 'protecting the data can be discarded. In contrast, data at rest nonvolatile
    and must, at any time, be accessible to the user. That means that the keys for
    decryption must be available on the device (or the user must type them every time,
    which is impractical) and thus they are accessible to an attacker.


    Bruce Schneier, a respected security technologist, cryptographer, and author,
    summarizes the difficulties of using encryption to protect data at rest:


    Cryptography was invented to protect communications: data in motion. This is how
    cryptography was used throughout most of history, and this is how the militaries
    of the world developed the science. Alice was the sender, Bob the eavesdropper.
    Even when cryptography was used to protect stored data—data at rest—was viewed
    as a form of communication. “Applied Cryptography,” I described encrypting stored
    data in this way: “a stored message is a way for someone to communicate with himself
    through time.” Data storage was a subset of data communication.


    In modern networks, the difference is much profound. Communications are immediate
    and instantaneous. Encryption keys can be ephemeral, and systems like the STU-III
    telephone can be designed such that encryption keys are created at the beginning
    of a call and destroyed as soon as the call is complete. Data storage, on the
    other hand, occurs over time. Any encryption keys must exist as long as the encrypted
    data exists. And storing those keys becomes as important as storing the unencrypted
    data. In a way, encryption doesn''t reduce the number of secrets that must be
    stored securely; it just makes them much smaller.


    Historically, the reason key management worked for stored data was that the human
    brain could be stored in a secure location: People would remember the keys, barring
    physical and emotional attacks on the people themselves, would not divulge them.
    In a sense, the keys were stored in a “computer” that was not attached to any
    network. And there they were safe.


    This whole model falls apart on the Internet. Much of the data stored on the Internet
    is only peripherally intended for use by people; it''s primarily intended for
    use by other computers. And therein lies the problem. Keys can no longer be'
  merge: -1
  pgno: 280
- img_proc: true
  md: 'stored in people''s brains. They need to be stored on the same computer, or
    at least the network, that the data resides on. And that is much riskier.


