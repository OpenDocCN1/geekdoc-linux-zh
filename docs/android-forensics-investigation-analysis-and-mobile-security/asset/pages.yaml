    # Power and Data Cables


    While most forensic labs will have the cables necessary to charge and connect
    the device, it is always prudent to seize the cables directly from the scene.
    It''s possible that a newer device is in use and the forensic toolkits do not
    yet have an appropriate cable. For example, a new specification for connecting
    media devices was developed called portable digital media interface (PDMI) and
    is integrated into two Android tablet devices, the Dell Streak and the Samsung
    Galaxy Tab. The PDMI interface provides not only power and high-resolution video
    output, but also offers USB 3.0 support. Whereas the actual examination of one
    of these devices could be delayed while an appropriate cable is acquired, if it
    needed charging and you do not have the appropriate cable, the loss of power will
    result in the loss of temporal data.


    # Powered-off Devices


    If a device is already powered off when you encounter it, the best option is to
    boot it into recovery mode to test for connectivity and root access. The owner
    may have already enabled USB debugging or have rooted the device, so you may have
    access to the data without booting into normal operational mode.


