  md: '# Auto-mounting USB devices


    In the Ubuntu VM configuration section of Chapter 1, the auto-mount feature is
    disabled to prevent the OS from automatically detecting and mounting USB mass
    storage devices. Forensic analysts should take extreme precautions to prevent
    this from happening on a device being investigated. Beyond disabling auto-mount,
    devices should generally be connected through a USB writer blocker.


    In Ubuntu, if you do not have auto-mounting of devices disabled (which you should
    nearly in all situations), the SD cards are automatically mounted for you. If
    the device is attached to a hardware writer blocker, mounted read-only, or in
    a situation where write blocking is not needed (e.g., research and development),
