    to the file, as shown in Table 4.7.


    Table 4.7 Write Three Chunks of Data


    | Block | Chunk | ObjectId | ChunkId | Status (Live or Shrink/Delete) | Comment
    |

    |---|---|---|---|---|---||

    | 0 | 0 | 500 | 0 | Live | ObjectHeader for blank file, length of 0 |

    | 0 | 1 | 500 | 1 | Live | First chunk of data |

    | 0 | 2 | 500 | 2 | Live | Second chunk of data |

    | 0 | 3 | 500 | 3 | Live | Third chunk of data |


    So far, this may seem straightforward. The object is now taking up the entire
    first block.


    > Note

    > Remember, our fictitious NAND flash has four chucks per block, not the typical
    64 chunks we see in commercial NAND flash.


    Next, we are going to save the file that will cause a new ObjectHeader to be written
    to the NAND flash as shown in Table 4.8.


    Table 4.8 Save the File''s New ObjectHeader'
