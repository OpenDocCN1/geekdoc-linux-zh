    | Bytes 3-6 in OOB | 10 01 00 00 | 4097 | N/A | Sequence number for the block
    |

    | Bytes 7-10 in OOB | 10 10 00 03 | 80536625 | N/A | Object ID for directory test,
    consistent with debugging |

    | 0x00006918-691B | 63 99 d5 d4 | 1297997702 | Thu Feb 17 15:55:02 CST 2011 |
    File ctime, not updated as file was created despite being accessed |

    | 0x0000691C-691F | d7 99 d5 d4 | 1297997773 | Thu Feb 17 15:56:13 CST 2011 |
    File mtime, consistent with update of contents |

    | 0x00006920-6923 | 42 a9 d5 d4 | 1297997940 | Thu Feb 17 15:59:00 CST 2011 |
    File crtime, consistent with permission change detail in debug logs |

    | Bytes 3-6 in OOB | 10 01 00 01 | 4097 | N/A | Sequence number for the block,
    as all data fit in 128 KB block and thus, a new sequence number was not allocated
    |

    | Bytes 7-10 in OOB | 20 10 00 01 | 268437514 | N/A | Object ID for file.txt,
    consistent with debugging data |


    Quite satisfying, from the debug logs, stat command, and the nanddump of the simulated
    NAND device all correspond. With additional analysis, it would be possible to'
  merge: -1
  pgno: 535
- img_proc: true
  md: 'create the MAC times for each file and directory on the NAND flash, which would
    provide obvious benefit to an examiner. It is also possible to gather full metadata
    information from ObjectHeaders still found on the NAND flash—provided garbage
    collection did not occur on the block—the full content of the time at each point
    in time.


    It is worth pointing out that in the very limited testing and analysis it appears
    the atime (accessed time) for the file is not updated every time the file is accessed.
    This is not really surprising as it would mean that any time a program accesses
    the file, a new ObjectHeader would have to be written to NAND flash. This would
    result in a far greater number of writes to the NAND flash and not only use precious
    battery power, but would wear out the NAND flash with metadata updates most users
    do not really care about. This practice is also not terribly unusual as Microsoft,
    by default, disabled atime update in Microsoft Windows Vista and Windows 7.


    To be sure, this analysis is not trivial. It can provide valuable information
    and is a basis for forensic research on the YAFFS2 file system.


    # YAFFS2 File System Analysis


    Hex analysis of the YAFFS2 file system is quite time consuming, so let''s move
    on to techniques for analyzing the allocated files. Unfortunately, there are again
    challenges, as it can be quite difficult to mount a YAFFS2 nanddump after it is
    extracted from an Android device.'
  merge: -1
  pgno: 536
- img_proc: true
  md: 'For this reason, as highlighted in Chapter 6, if you have root access on an
    Android device, it is best to not only acquire the appropriate YAFFS2 nanddump
    files, but to also logically copy important directories from the systems using
    adb pull, tar, or other method. That way, if you are unable to mount the YAFFS2
    nanddump, you still have a logical copy of the files. The nanddump can then be
    used for timeline creation, other hex analysis, and file carving.


    However, it is possible to mount some YAFFS2 nandumps in Linux and, over time,
    expect more nanddump files to successfully mount. For this section though, we
    will focus on a nanddump from a Motorola Droid that can be successfully mounted
    in Linux with nandsim and the YAFFS2 kernel module.


    First, we need to load the appropriate kernel modules and create a 1 GB nandsim
    device.


    ```

    sudo modprobe mtd

    sudo modprobe mTblock

    sudo insmod ~/yaffs2/yaffs2.ko first_id_byte=0x0ec second_id_byte=0xd3 third_id_byte=0x51

    fourth_id_byte=0x95

    ```


    We have a 1 GB nandsim device that is capable of housing the Droid’s “/data” partition.
    The next step is to nandwrite both the data and OOB to the simulated NAND flash.


    ```

    ahogubuntu~$ sudo nandwrite --autoplase --ook /dev/mtd0 droid_userdata.

    nanddump

    Writing data to block 0 at offset 0x0

    Writing data to block 1 at offset 0x20000

    Writing data to block 2 at offset 0x40000

    Writing data to block 3 at offset 0x60000

    Writing data to block 4 at offset 0x80000

    Writing data to block 5 at offset 0xa0000

    <snip>

    ```'
  merge: -1
  pgno: 537
- img_proc: true
  md: 'The parameters-$ instruct nandwrite to do the following:


    +   - sudo nandwrite—Nandwrite requires root permission

    - --autoplace—Use auto oob layout

    - --oob—Image contains oob data

    - /dev/mtd0—The mtd device to write the nanddump to

    - droid.userdata.nanddump—The name of the nanddump file


    If everything went as expected, we should now be able to mount

    the file system with the following commands:


    ```

    ahoog@ubuntu~$$ mkdir -p /mnt/yaffs2

    ahoog@ubuntu~$ sudo mount -t yaffs2 /dev/mtdblock0 ~/mnt/yaffs2

    ```


    There are two primary problems you can encounter during this

    process. First, YAAFS2 and MTD may not successfully mount the file

    system and will display this message:


    ```

    ahoog@ubuntu~$ sudo mount -t yaffs2 /dev/mtdblock0 ~/mnt/yaffs2

    mount: wrong fs type, bad option, bad superblock on /dev/mtdblock0,

    missing codepage or helper program, or other error

    In some cases useful info is found in syslog - try

    dmesg | tail or so

    ```


    There can be many causes for this such as:


    +   - Differences between device’s YAAFS2 and MTD implementation

    and your workstation

    - Corrupt or invalid nanddump

    - File system issues'
  merge: -1
  pgno: 538
- img_proc: true
  md: 'The second most common issue is that the file system mounts, but there are
    no files:


    ```

    ahoog@ubuntu:~/mnt/yaffs2$ ls

    lost+found

    ```


    This is most likely due to differences between the device''s YAFFS2 and MTD implementation
    and your workstation, and again can be difficult to debug. There are a few things
    you can try to resolve the issues. First, if you have a version of mtu-utils greater
    than 20090606-1, try installing the older version. Here''s how to check your current
    version and optionally install:


    ```

    ahoog@ubuntu:~$ dpkg -l | grep mtu-utils

    ii mtu-utils 20100706-1

    Memory Technology Device Utilities

    ahoog@ubuntu:~$ sudo apt-get remove mtu-utils

    ahoog@ubuntu:~$ wget http://mirror.pl.gov/ubuntu//pool/universe/m/mtd-

    tutils/mtu-utils_20090606-ubuntu0.10.04.1_amd64.deb

    ahoog@ubuntu:~$ sudo dpkg -i - mtu-utils_20090606-ubuntu0.10.04.1_amd64.deb

    ```


    ```

    ahoog@ubuntu:~$ dpkg -l | grep mtu-utils

    ii mtu-utils 20090606-ubuntu0.10.04.1

    Memory Technology Device Utilities

    ```


    Now that we downgraded the version of the MTD, you could try the steps to mount
    a YAFFS2 nandump again.


    The other potential option is that your version of YAFFS2 is not consistent enough
    with the version used on the Android device. In order to get different versions
    of YAFFS2, you will need to use the source control system of either the YAFFS2
    or the Android Open Source Project. You would then compile source code, remove
    the existing YAFFS2 kernel module, insert the new one, and try again.'
