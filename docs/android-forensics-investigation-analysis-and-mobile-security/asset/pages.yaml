  md: However, corporations and enthusiasts alike have ported Android to other platforms.
    On the corporate front, Intel has ported Android to their Atom processors. Similarly,
    Google has ported Android in their Google TV product, which is built on top of
    Android. There are also projects, such as Android-x86 (Android-x86, n.d.), that
    have
  merge: -1
