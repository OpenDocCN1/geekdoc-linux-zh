    # Compulsion MOBILED!


    The following overview of MOBILED, MOBILED was provided by the vendor:

    With a single click, MOBILED! Forensic collects all possible data from mobile
    phones and generates extensive reports onto a PC that can be stored or printed.
    It is the most universal mobile phone solution with software supporting GSM phones
    and open architecture allowing the support of any phone. The system allows you
    to customize the output making it completely adaptable to the needs of your judicial
    system.'
  merge: -1
  pgno: 383
- img_proc: true
  md: 'MOBILit! Forensic does a complete analysis of the phone including its phone
    book, last dialed numbers, missed calls, received calls, MMS messages, SMS messages,
    photos, videos, files, phone details, calendar, notes, tasks, and much more.


    MOBILit! Forensic caters to the entire world with reports that can be generated
    in any language. You are able to prepare creative templates according to your
    specific needs. You construct all the text that you like to see in every final
    report. It also allows for XML export, so that you can connect the application
    with other systems. The XSL module exports and nicely formats all data in the
    package to an Internet browser. You can burn, send, and share the report as needed.


    MOBILit! Forensic reports can be created without the touch of a human hand. While
    there is no need to import or export stubs of data from SIMs or phones, it is
    possible in manual investigation mode in MOBILit! Forensic. It is read-only and
    hence, it prevents changes in the device, which could mean the disappearance of
    evidence. All items are also protected against later modifications by MD5 hash
    codes used in digital signatures. It helps you to quickly locate the possible
    place of modification.


    MOBILit! Forensic also has frequent updates and upgrades that you can be sure
    you are using the absolute latest in technology. Its detailed reports and user-friendly
    design make it a pleasure to work with.


