    # Application Statistics


    The Android Market is growing quickly. Six months after its release, T-Mobile’s
    Chief Technology Officer, Cole Brodman, commented that users needed more filters
    to successfully locate apps from the needed nearly 2300 apps on the Market (Lawson,
    n.d.). By January 2011, over 200,000 apps were created on the Market with 27,227
    added in November 2010 alone place the number of downloaded apps at over 2.5 billion.


    Obviously, apps are a key area of focus for both security and forensics. In Chapter
    4, we will explore in detail how apps persist data to an Android device, what
    types of information are stored, and how data can be recovered and analyzed.


    # Android forensics'
  merge: -1
  pgno: 81
- img_proc: true
  md: 'Clearly there is a need for Android forensics. Smartphones in general are perhaps
    the one electronic device that knows the most about an individual. For most people,
    their smartphone is rarely more than a few feet from them at any point of time—including
    while sleeping. The device blends both personal and corporate information and
    has the ability to store vast amounts of data including text messages, e-mails,
    GPS locations, picture, videos, and more. And people tend to be more honest with
    their smartphone than any other person or device. Why? Because people feel the
    device is secure and can provide them with answers to questions they may choose
    not to share with anyone else. More than one forensic examiner has quipped, “You
    are what Google,” clearly a byproduct of seeing firsthand the honesty with which
    people use their smartphones.


    # Challenges


    Of course, nothing worth doing is easy and both mobile forensics and Android forensics
    in particular have a host of challenges that must be overcome.


    A fundamental goal in digital forensics is to prevent any modification of the
    target device by the examiner. However, mobile phones lack traditional hard drives
    that can be shutdown, connected to a write blocker, and imaged in a forensically
    sound way. Any interaction with the smartphone will change the device in some
    way. As such, the examiners must use their judgment when examining a mobile device
    and if the device is modified, they must explain how it was modified—and as importantly—why
    that choice was made.'
  merge: -1
  pgno: 82
- img_proc: true
  md: 'Some forensic examiners take exception to this approach and debates have ensued.
    However, techniques that may alter a computer targeted for forensic examination
    have been used for some time. For example, often a live memory analysis is necessary
    in an investigation of a malware attack. Similarly, if a hard drive is encrypted,
    an examiner must image the device while it is still running or run the risk of
    never having the ability to access the data on the drive. Other good examples
    are systems that must remain online due to complex environments, typically found
    in cases involving larger corporate servers. While every examiner should strive
    to not change the device they are investigating, it is rarely possible in the
    mobile world. So, if the device cannot be modified, then the only other choice
    would be to examine the device. Clearly this option is not acceptable as evidence
    from mobile forensics is a critical component in many investigations and has even
    solved many crimes.


    Further complicating Android forensics is the sheer variety of devices, Android
    versions, and applications. The permutations of devices, Android versions, and
    Android versions alone are in the thousands and each device plus platform has
    unique characteristics. While a logical analysis of every Android phone is achievable,
    the vast combinations make the full physical acquisition of every Android device
    likely unachievable. Even a minor difference in the Android version may require
    extensive testing and validation in high-stakes cases.


