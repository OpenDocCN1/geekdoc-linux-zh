    # YAFFS2 forensic analysis


    As discussed in Chapter 4, YAFFS2 is an open source, log-structured file system
    developed specifically for NAND flash, including support for wear-leveling and
    error-correcting code algorithms. This is great news not only for the phone owners,
    as YAFFS2 works well on Android, but for forensic analysts since a significant
    amount of old (deleted or updated) data is recoverable. But the good news stops
    there. As YAFFS2 is a relatively new file system, at this time no commercial forensic
    software supports it.


    However, all is not lost. Using the power of Linux, the openness of YAFFS2, an
    effective acquisition strategy, and the techniques already discussed including
    file system analysis, file carving, strings, and hex analysis, a forensic examiner
    can extract significant amounts of relevant data from the file system.


    As we dive into the analysis of YAFFS2, it''s quite helpful to remember how it
    is structured. One important concept to recall is how the data are structured
    physically on the NAND flash via MTD. Generally, YAFFS2 and MTD organize the NAND
    flash into 128 KB blocks, which consist of 2048 chunks of data followed by 64
    bytes of Out-Of-Band (OOB) data (making the total size on the NAND flash 132 KB),
    which is used to store disk and some file system metadata, as shown in Fig. 7.10.'
  merge: -1
  pgno: 523
- img_proc: true
  md: '![](img/cc70feeb090256bc8913d756d59d1429_524_0.png)


    # FIGURE 7.10 Block (128 KB = 64 × 2k chunks + OOB).


    ```

    ahoog@ubuntu:-~$$ shell cat /proc/mtd

    dev:    size erasize name

    mtd0: 000a0000 0020000 "misc"

    mtd1: 00480000 0020000 "recovery"

    mtd2: 00300000 0020000 "Boot"

    mtd3: 08f00000 0020000 "system"

    mtd4: 000a0000 0020000 "local"

    mtd5: 02800000 0020000 "cache"

    mtd6: 09500000 0020000 "datatada"

    ```


    While we need the OOB data if we want to attempt to mount the YAFFS2 nandump on
    the Ubuntu workstation, the 64-byte OOB data will definitely cause problems for
    most forensic techniques, notably file carving. To alleviate this problem, you
    can simply remove the OOB with a simple program. The program is written in Python
    and can be easily adapted to different block and OOB configurations.'
