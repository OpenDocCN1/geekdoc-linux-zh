    # Summary


    The Android SDK not only provides deep insight into the Android platform but also
    provides powerful tools to investigate a device, from both a forensic and security
    viewpoint. Once the SDK is installed on a forensic workstation, the examiner has
    the ability to interact with an Android device connected via USB, provided the
    USB debugging feature is enabled. Not only is it possible to query information
    from the device but apps can also be installed, run, and ultimately data extracted
    from the device. The Android SDK is an important tool used for forensic and security
    analysis.


