    This example is simply intended to illustrate the importance of data that might
    only be accessible if the forensic analyst moves beyond the forensic software
    they use and also examines the data directly. With well-known file systems and
    perhaps “standard” cases, this is often not necessary. However, mobile forensics,
    and Android forensics in particular, is a challenging area as many of the file
    formats, file systems, hardware, and software are not only very new (and not well
    supported) but also change at an alarming rate. Forensic analysts who dive into
    hex will they uncover far more data than simply relying on existing forensic software.


    # Android Directory Structures


    A broad understanding of the Android directory structure is very helpful in the
    forensic analysis of a device. To perform this analysis, five important root level
    directories were copied from the HTC Incredible and then displayed with the tree
    command on the local workstation. Following the hierarchical layout, an explanation
    of many directories is provided.'
