    # Extended File System (EXT)


    The extended file system (EXT) is the facto file system for Linux developed specifically
    for the operating system. As you already know, Linux supports a large number of
    file systems. However, the default is EXT. Since the original version of EXT was
    developed in 1992, there have been three additional releases: EXT2, EXT3, and
    EXT4.


    Although EXT has been integral to most laptop, desktop, and server Linux distributions,
    it was not found in early Android devices. In 2010, however, EXT began to show
    up in devices, and on December 9, 2010, Google announced in their Android Developer
    blog that an increasing number of Android devices were going to move from YAFFS
    to the EXT (Android'
  merge: -1
  pgno: 225
- img_proc: true
  md: 'developers blog, n.d.). The move from YAFFS to EXT seems to be driven by several
    factors that were discussed online (Way, n.d.), including


    +   * More Android devices are moving from raw NAND flash to regular block device
    (eMMC)

    * EXT4 is a standard Linux file system that supports full Unix permissions and
    semantics

    * EXT4 is stable and offers high performance

    * YAFFS is single threaded, which would experience bottlenecks on forthcoming
    dual-core systems


    The first Android device to use EXT4 is the Google Nexus S, and it is expected
    that many tablet devices running Android’s Honeycomb release will also use this
    new file system. As only one Android device currently uses EXT4, many changes
    are expected over time. Currently, the Nexus uses EXT4 in the following mount
    points:


    +   * System image (read-only, /system)

    * Local user data (read–write, /data/data)

    * Cache partitions (read–write, /cache and possible others)


    From a forensics standpoint, EXT4 is simply another file system that examiners
    need to understand and forensic tools to support. Of course, most forensic tools
    do not fully (or even nominally) support EXT4 so this presents a bit of a problem.
    File carving techniques do work and it is expected that more forensic software
    will begin to support the file system over time.


    # FAT32/VFAT


    Android devices often have one or more Microsoft FAT32 partitions, generally on
    the SD card and eMMC. The reason for leveraging this venerable file system is
    not due to superior design but due to sheer compatibility with other operating
    systems. Microsoft’s FAT32 file system was widely'
  merge: -1
  pgno: 226
- img_proc: true
  md: 'supported in most operating systems including Mac OS X, all Windows versions
    (obviously), Linux, and more. This means Android data stored on the FAT32 partitions
    can be easily read, modified, or even deleted on other file systems.


    In Linux, the file system driver for a FAT32 partition is called VFAT, not to
    be confused with Microsoft''s earlier Virtual FAT file system that bridged the
    FAT16 and FAT32 implementation by adding, among other features, long file name
    support. On the HTC Incredible, there are three mount points that use FAT32:


    +   * /mnt/sdcard

    * /mnt/secure/asec

    * /mnt/emmc


    As you may recall from Chapter 3''s section on USB interfaces, when Android device
    is connected to another computer, there is an option to expose the devices'' USB
    mass storage (UMS) interfaces to enable file sharing. On the HTC Incredible, both
    the /mnt/sdcard and /mnt/emmc partitions can be presented to other operating systems
    over the USB connection as a UMS device.


    The /mnt/secure/asec partition is an encrypted partition on the SD card where
    Android devices can store apps. When the ability to run apps from the SD card
    was introduced, the security engineers were understandably concerned that app
    data could easily be damaged or compromised because file permissions are not maintained
    in the VFAT/FAT32 partitions. As such, the app (.apk file) is encrypted on the
    physical device and when in use, it is decrypted and temporarily stored at /mnt/asec
    or another location specified by design.


    As discussed previously, the removable SD card is mounted at /mnt/sdcard and generally
    contains photos, videos, thumbnails, files, to speech temporary files, and Google
    Maps Navigation data as well as data from many Android Market applications. The
    newer /mnt/emmc is a FAT32'
