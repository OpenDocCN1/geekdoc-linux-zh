- img_proc: true
  md: 'As discussed in Chapter 4, both YAFF2 and MTD are involved in writing data
    to the NAND flash. The YAFF2 module is responsible for all aspects of the file
    system. However, the writing of the data to the NAND flash is managed by MTD.
    Unfortunately, this adds considerable complexity to the analysis as MTD can accept
    the data from YAFF2, which needs to be written to the NAND flash and then has
    the autonomy to write not only the YAFF2 data but additional MTD data in the manner
    it sees fit. Research into the data as it has persisted must take into account
    not only the YAFF2 code but the MTD code. Additionally, there can be subtle differences
    in the YAFF2 and MTD modules used on different Android devices, which adds yet
    another layer of complexity.


    This not mean understanding the YAFF2 data found in a nanddump is impossible.
    To get started, we are going to setup a 64 MB simulated NAND device on our Ubuntu
    workstation.


    ```

    sudo modprobe mtd

    sudo modprobe mtdblock

    sudo insmod ~/yaff2/yaff2.ko

    sudo modprobe nandsim first_id_byte=0x20 second_id_byte=0xa2 third_id_byte=0x00
    fourth_id_byte=0x15

    ```


    You can verify the nandsim is properly setup:


    ```

    ahoog@ubuntu:~$ cat /proc/mtd

    dev size erasesize name\mtd0: 04000000 00200000 "NAND simulator partition 0"

    ```


    Before we mount the YAFF2 file system, we are going to enable various debugging
    features built into YAFF2. There are many debugging options that YAFF2 supports
    (YAFFS Debugging, n.d.),'
  merge: -1
  pgno: 529
- img_proc: true
  md: 'but we are only going to enable three of them. To do this, we first need to
    have full root permissions and then we will echo the debugging flags into “/proc/yaaffs":


    ```

    ahoog@ubuntu:~ sudo -s

    root@ubuntu:~ echo +none+os+write+mtd > /proc/yaaffs

    ```


    The value after echo command first removes any exiting debugging (none) and then
    enables the os, write, mtd debugging options. You can view the results of the
    debugging in the system log located at “/var/log/syslog.” Ideally, open a second
    terminal window or ssh session and use the tail command to continuously output
    the end of the syslog:


    ```

    ahoog@ubuntu:~ tail -f /var/log/syslog

    Feb 17 18:29:34 ubuntu kernel: [ 4474.970406] new trace = 0xF0004082

    ```


    Next, we create the mount point and mount a YAFFS2 file system:


    ```

    mkdir -p ~/mnt/yaffs2

    sudo mount -t yaffs2 /dev/mtdblock0 ~/mnt/yaffs2

    ```


