  md: '![](img/cc70feeb090256bc8913d756d59d1429_520_0.png)


    **FIGURE 7.9** App move to SD card complete.


    This is great from the user’s perspective. But what does this mean for the forensic
    examiner or security analyst? A number of steps are taken that are described next
    and then highlighted in the code listing.


    +   1. .apk file is moved from “/data/app” (or “/data/app-private”) to the SD
    card in an encrypted partition at /mnt/secure/asec (see highlighted parts of next
    listing) which can only be accessed via the root directory.

    2. A new device mapper file system is mounted read-only and the app from “/mnt/secure/asec”
    is decrypted and accessible to the system at “/mnt/asec/com.rovio.angrybirds-1.”
    The system must be able to access the unencrypted .apk file to run the app.'
  merge: -1
  pgno: 520
- img_proc: true
  md: '+   3. The user data remains in “/data/data” (in this case “/data/data/com.rovio.angrybirds”).


    +   4. If the SD card becomes inaccessible (whether it is removed, damaged, or
    simply mounted on a host computer for file sharing), the unencrypted volume is
    unmounted and no longer accessible to the system. This is why the core apps are
    currently unable to run from the SD card.


    The .apk file is encrypted on the SD card to ensure that other apps (or processes)
    cannot corrupt or maliciously modify the app. However, app developers should not
    rely on the encryption to prevent people from accessing the .apk file as it is
    simply a matter of copying it from the unencrypted “/mnt/asec/ <app-name>.” The
    mount and ls commands in the following code illustrate the structure.'
