    the already mounted "/cache" directory and remount it read only. You can now perform
    the adb pull:


    ```

    ahoog@ubuntu:~$ adb pull /data/data/com.android.providers.telephony sms

    pull: building file list...

    pull: /data/data/com.android.providers.telephony/databases/msms.db ->

    sms/databases/msms.db

    pull: /data/data/com.android.providers.telephony/databases/telephony.db ->

