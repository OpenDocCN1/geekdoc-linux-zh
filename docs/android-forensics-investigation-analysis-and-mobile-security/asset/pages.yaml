    # Linux, Open source software, and forensics


    Open source software has had a tremendous impact on the digital forensics discipline.
    Forensic tools that are released as free open source software have tremendous
    advantages over closed source solutions including the following:


    +   - The ability to review source code and understand exact steps taken'
