    # Note


    Unix Epoch


    Unix Epoch is a common format for time stamps in systems based on Unix/Linux.
    The time stamp is an integer that represents the number of seconds (or milliseconds)
    since January 1, 1970. A typical time stamp using seconds will have 10 digits
    while a time stamp using milliseconds will have 13 digits. Time stamps are covered
    in more details in Chapter 7.


