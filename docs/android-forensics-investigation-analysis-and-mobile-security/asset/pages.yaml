  md: 'Kristinn Gudjonsson’s log2timeline.


    # FAT Additional Analysis


    There are many different approaches for further analysis of the FAT partitions.
    First, the large majority of forensic software in the market supports the FAT
    file system, and many examiners will have tool sets that they are comfortable
    with. Beyond the forensic software, we covered several additional techniques in
    the first section including:


    +   - File system analysis

    - File carving

    - Strings

    - Hex analysis


    These techniques are similar even when the file system type is different, so we
    will provide detailed coverage of them in the YAFFS2 section next. However, some
    brief concepts are highlighted below.


    First, the SD card clearly has a significant amount of deleted files. It is advisable
    to use a forensic tool to recover the data. TSK can recover the data as well as
    many other forensic software packages. In addition, file-carving techniques should
    be used to recover files that are not referenced in the File Allocation Table
    of the partition. Strings and hex analysis are again great ways to quickly locate
    data of interest.


    There is one more quick technique to mention if the Ubuntu workstation is used
    for file system analysis. Using the find and file commands, you can list all allocated
    files by name, path, and file'
