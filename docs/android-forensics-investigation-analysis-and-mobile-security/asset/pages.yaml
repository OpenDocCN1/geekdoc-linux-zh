    This command does not require any special permission on the device except that
    USB debugging be enabled. If you ran this command on a device or emulator, you
    would have noticed that far too much data were displayed on your screen. You can
    determine the total number of lines available in the log by piping (or sending)
    the contents of dmesg to a program wc (which stands for word count) and instructing
    it to count the number of lines:


    ```

    ahoc@ubuntu:~$ adb shell dmesg | wc -l

    1859

    ```


    So, on the reference HTC Incredible, we have 1859 lines in the kernel log. If
    you need to inspect the information more closely, or include it in a report, you
    can redirect the output of dmesg to a file with the following:


    ```

    ahoc@ubuntu:~$ adb shell dmesg > dmesg.log

    ```


    You can now examine the contents of the available kernel log by opening dmesg.log
    in a text editor or display program.


