    # Introduction


    While the underlying hardware and software powering Android devices are fascinating,
    the primary focus of forensic analysts and security engineers is to acquire, analyze,
    and understand data stored on a device. Like other topics discussed, there are
    many nuances to this that are important to understand for effective analysis including
    what types of data are stored, where they are stored, and characteristics of the
    physical mediums on which they are stored. All of these factors play a major role
    in what data can be recovered and how they can be analyzed.


    # Data in the Shell


    Forensic analysts are primarily concerned with data artifacts that can be recovered
    from the devices they investigate. Android is a combination of both well-known
    artifacts, such as those found in Linux, and entirely new ones, such as the Dalvik
    VM and the YAFF2 file system. Adding to the'
  merge: -1
  pgno: 173
- img_proc: true
  md: 'complexity are the varying architectures that different manufacturers embrace.


    While no single book or examiner could possibly cover this topic exhaustively,
    there are certain fundamental concepts common to Android devices. File systems,
    file, and other artifacts are at the core of what forensic analysts must understand
    about Android to maximize the effectiveness of their investigations.


    # What Data are Stored


    Android devices store an enormous amount of data, typically combining both personal
    and work data. Apps are the primary source of these data, and there are a number
    of sources for apps including:


    +   * Apps that ship with Android

    * Apps installed by the manufacturer

    * Apps installed by the wireless carrier

    * Additional Google/Android apps

    * Apps installed by the user, typically from the Android Market


    Chapter 7, Android Application and Forensic Analysis, will examine a number of
    these apps in detail, although it is certainly beyond the scope of this book to
    cover all possibilities. A sample of data found on Android devices includes the
    following:


    +   * Text messages (SMS/MMS)

    * Contacts

    * Call logs

    * E-mail messages (Gmail, Yahoo, Exchange)

    * Instant Messenger/Chat

    * GPS coordinates

    * Photos/Videos

    * Web history

    * Search history'
  merge: -1
  pgno: 174
- img_proc: true
  md: '+   • Driving directions

    • Facebook, Twitter, and other social media clients

    • Files stored on the device

    • Music collections

    • Calendar appointments

    • Financial information

    • Shopping history

    • File sharing


    # App Data Storage Directory Structure


    Android applications primarily store data in two locations, internal and external
    storage, both of which will be covered in more detail later in this chapter. However,
    it is helpful to have a high-level understanding of the data storage directory
    structure.


    In the external data storage areas (the SD card and emulated SD cards), applications
    can store data in any location they wish. However, internal data storage is controlled
    by the Android APIs. When an application is installed (through either the market
    place or in the build shipped to the consumer), an internal data storage is saved
    in a subdirectory of /data/ named after the package name. For example, the default
    Android browser has a package name of com.android.browser and, such, the data
    files are stored in /data/data/com.android.browser. While applications are not
    required to store data files, do not.


    Inside the applications /data/data subdirectory, there are a number of standard
    subdirectories found in many applications as well as directories developers control.
    The most common standard subdirectories are listed in Table 4.1.


    Table 4.1 Common /data/data/ <packageName> > Subdirectories


    | shared_prefs | Directory Storing Shared Preferences in XML Format |

    | lib | Custom library files an application requires |'
