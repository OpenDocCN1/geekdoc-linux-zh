    # Android Market


    The Android Market is an avenue for third-party developers to release their applications
    to anyone who owns an Android device. The Android Market was first announced on
    August 28, 2008 on the Google Developer blog as “an open content distribution
    system that will help end users find, purchase, download and install various types
    of content on their Android-powered devices” (Android developers blog, n.d.).
    When the market was first released in October 2008, it did not support paid apps.
    However, by early 2009 the Android Market supported paid apps in both the United
    States and United Kingdom. By January 2011, the Android Market supported paid
    apps in 29 countries (Supported locations, n.d.). Several other countries, most
    notably India, can use the Android Market but currently cannot install paid apps.


    Google’s light-handed approach to managing the Android Market is in stark contrast
    to Apple’s tight management of the App Store. While the Android Market does have
    Terms of Service for users (Android Market terms, n.d.) and an Android Market
    Developer Distribution Agreement (Android Market developer, n.d.) for developers,
    apps are released to the market without an approval process. Instead, Google believes
    that the app ratings will weed out apps that are buggy or show little merit.


    To release an app into the Android Market, developers must be registered, pay
    a $25 fee, and sign their app with a private key which will uniquely identify
    them to the market. When a user'
  merge: -1
  pgno: 76
- img_proc: true
  md: 'purchases an app, the developer receives 70% of the purchase price with the
    remaining 30% going to Google (and, at times, the carrier involved). Initially,
    users had a 48 h window of time where they could return the apps. However, in
    December 2010, Google shortened that window to 15 min.


    Google has the ability to remotely remove an app not only from the Android Market,
    but also directly from an Android device. The Remote Application Removal Feature
    is a security control possesses where a dangerous application could be removed
    from active circulation in a rapid and scalable manner to prevent further exposure
    to users (Android developers blog: exercising, n.d.). The security control was
    first exercised in June 2010 when a security researcher distributed a proof of
