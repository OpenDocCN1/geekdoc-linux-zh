    # Secure Digital Card


    Most Android devices ship with a removable memory card referred to as their Secure
    Digital (SD) card. Like the on-device flash, SD cards are nonvolatile and also
    use NAND flash technology. However, because the SD cards were designed to be portable,
    they must adhere to various physical and communication specifications that allow
    them to interoperate with most devices.


    The SD card is one obvious design difference between most Android devices and
    the popular Apple iPhone. The iPhone is designed with 4GB to 32GB of NAND flash
    on-board and does not provide for SD cards. Although more expensive, this provides
    the device manufacturer (Apple, in this case) with far more control over the device.
    In the case of Android, larger user files are intended to be stored on the SD
    card. This not only provides a less expensive and easily upgradeable memory option
    for consumers but is also portable, so if a consumer purchases a new phone, they
    can easily transfer data using their existing SD card.


    Recent HTC phones (notably the HTC Incredible) have provided the standard SD card
    interface but did not ship with an SD card'
