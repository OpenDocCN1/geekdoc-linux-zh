  md: 'contained on a chip, or elsewhere). These data are alternatively called full
    track, track, track 1, track 2, and magnetic-stripe data.


    +   * 3.2.2 Do not store the card verification code or value (three-digit or four-digit
    number printed on the front or back of a payment card) used to verify card-not
    present transactions.


    +   * 3.2.3 Do not store the personal identification number (PIN) or the encrypted
    PIN block.


    +   * 3.3 Mask PAN when displayed (the first six and last four digits are the
    maximum number of digits to be displayed).


    +   * 3.4.1 If disk encryption is used (rather file- or column-level database
    encryption), logical access must be managed independently of native operating
    system access control mechanisms (e.g., by not using local user account databases).
    Decryption keys must not be tied to user accounts.


    The PCI DSS, while without criticism, is a fairly mature standard with a goal
    of protecting a staggering volume of financial transactions. It is interesting
    to compare some of the standards the PCI DSS has developed over time such as requiring
    encryption, limiting the storage of sensitive information, and masking sensitive
    information when displayed to screen.


    It should really go without saying that storing the credit card in plain text
    on a mobile device would not only violate the PCI DSS standard but would also
    place the card owner at great risk if the device was compromised. Perhaps not
