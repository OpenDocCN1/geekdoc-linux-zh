    a number of techniques to circumvent the pass code exist, it is not possible to
    achieve this in every circumstance. Once the device is accessible, the forensic
    analyst can choose from a logical acquisition which focuses primarily on undeleted
    data accessible through Content Providers or the more technically challenging
    physical acquisition. While the physical acquisition will produce more data, it
    generally requires more sophisticated analysis techniques which will be covered
    in Chapter 7.


