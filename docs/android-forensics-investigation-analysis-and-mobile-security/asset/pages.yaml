    # Introduction


    Android was designed to be compatible with a wide array of hardware. This is achieved,
    in large part, through the Linux kernel, which over the years has evolved to support
    a large variety of hardware. This is an important characteristic of the platform
    as it allows manufacturers freedom to design, procure, or otherwise integrate
    the ideal components of the Android device. This strategy has led to the development
    of powerful dual core Android devices capable of significant processing as well
    as entry-level devices targeted to entry-level wireless phones. Although the hardware
    compatibility is great for manufacturers, wireless providers, and ultimately consumers,
    the diversity poses challenges for forensic analysts and security engineers. Understanding
    the hardware'
