    # # Physical techniques


    Forensic techniques that acquire physical images of the targeted data storage
    typically result in exponentially more data being recovered and often circumvent
    pass code protection. These techniques provide access to only deleted data but
    also data that was simply discarded as the system no longer required it. For example,
    some systems track the last time a site was visited and the date is updated each
    time the site is accessed. The previous date and time data was not specifically
    deleted but was not tracked by the system. On Android devices using YAFFS2, the'
  merge: -1
  pgno: 430
- img_proc: true
  md: 'previous values are recoverable provided garbage collection did not occur.
    As such, the physical techniques provide access to not only deleted data but also
    access to obsolete data on the system.


    The Android forensics physical techniques fall into two broad categories:


    +   - Hardware: Methods which connect hardware to the device or physically extract
    device components

    - Software: Techniques which run as software on devices with root access and provide
    a full physical image of the data partitions


    The hardware-based methods required specialized and often expensive equipment
    and training can be very effective on devices where root access is unattainable.
    The software-based physical techniques are a more direct path to acquisition and
    are often the best place to start. Of course, before software-based techniques
    are possible, you must have root access on the device.


    # Hardware-Based Physical Techniques


    The two hardware-based physical techniques are JTAG and chip-off and a brief overview
    is provided in this section.


    # JTAG


    The JTAG was created in the 1980s to develop a standard for testing the wiring
    and interconnects on printed circuit boards (PCB). By 1990, the standard was complete
    and became an Institute of Electrical and Electronics Engineers standard, specifically
    IEEE 1149.1-1990 (IEEE SA, n.d.), and then a later update in 2001 named IEEE 1149.1-2001.
    The standard was widely accepted and today'
  merge: -1
  pgno: 431
- img_proc: true
  md: 'most PCBs have JTAG test access ports (TAPs) that facilitate access to the
    central processing unit (CPU).


    A JTAG TAP exposes various signals and most mobile devices include the following:


    +   1. TDI—Test Data In

    2. TDO—Test Data Out

    3. TCK—Test Clock

    4. TMS—Test Mode Select

    5. TRST—Test Reset

    6. RTCK—Return Test Clock


    A major obstacle to JTAG is locating the TAPs on the PCB and tracing them to the
    CPU to determine which pad is responsible for each test function. This is very
    difficult to achieve even the chip manufacturer has published a CPU map. In addition,
    it can be extremely difficult to trace the JTAG functions from the chip and may
    require first removing the CPU from the PCB. Device manufacturers have JTAG schematics,
    but they are generally considered company confidential and are only released to
    authorized service centers. Another approach is to determine the functions of
    each pad by reading the voltage at each pad, and based on the reference voltage,
    identifying the function. In some instances the JTAG pin-outs are published by
    flasher box manufacturers or various online groups. Fig. 6.66 is an example of
    the JTAG pin-outs for a T-Mobile HTC G1. The six pin-outs are indicated by the
    small white circles and the legend on the right provides the detailed information.'
  merge: -1
  pgno: 432
- img_proc: true
  md: '![](img/cc70feeb090256bc8913d756d59d1429_433_0.png)


    FIGURE 6.66 T-Mobile HTC G-1 PCB.


    In most cases, your soldered wire leads to the pads on the PCB, and the other
    side is connected to a special device (flasher box) which, through software, will
    manage the CPU. Some companies make custom connectors which support a specific
    device and simplify the connection to the pads by placing the PCB between two
    jig boards with pogo pins. The pogo pins make contact with the JTAG on the PCB
    and can then easily connect to the flasher box. However, experienced engineers
    may find that soldering the leads directly to the PCB provides a more stable connection.


    Once the leads are connected to the appropriate pads, power must be applied to
    the board to boot the CPU. Each CPU manufacturer publishes the reference voltage
    for their hardware and this voltage must not be exceeded. Some flasher boxes provide
    an option for managing the voltage but in general the power should be managed'
  merge: -1
  pgno: 433
- img_proc: true
  md: 'through an external power supply with a built-in digital voltmeter to ensure
    accuracy. Once the board is powered on, the flasher box software has the ability
    to perform a full binary memory dump of the NAND flash. However, the connection
    is serial and takes a considerable amount of time. Despite all the complexities,
    if the JTAG technique is executed properly, the phone can be reassembled and will
    function normally with no data loss.


    Though JTAG is an option for extracting data from an Android device''s NAND flash,
    it is very difficult and should only be attempted by qualified personnel with
    sufficient training and specific experience in soldering small PCB connections.
    Errors in soldering to the JTAG pads or applying the wrong voltage to the board
    could not only disable JTAG but can also seriously damage the device. For these
    reasons, JTAG is not typically the first choice for a physical forensic image
    of an Android device.


    # Chip-off


    Chip-off is a technique where the NAND flash chips are physically removed from
    the device and examined externally. The chip-off technique allows for the recovery
    of damaged devices and circumvents pass code-protected devices. This removal process
    is generally destructive—it is quite difficult to reattach the NAND flash to the
    PCB and have the device operate.


    There are three primary steps in the chip-off technique:


    +   1. The NAND flash chip is physically removed from the device by de-soldering
    it, or using special equipment that uses a blast of hot air and a vacuum to remove
    the chip. There are also'
  merge: -1
  pgno: 434
- img_proc: true
  md: 'techniques that heat the chip to a specified temperature. It is quite easy
    to damage the NAND flash in this process and specialized hardware, and even controlling
    software, exists for the extraction.


    +   2. The removal process often damages the connectors on the bottom of the chip,
    so it must first be cleaned and then repaired. The process of repairing the conductive
    balls on the bottom of the chip is referred to as rebalancing.


    +   3. The chip is then inserted into a specialized hardware device, so that it
    can be read. The devices generally must be programmed for a specific NAND flash
    chip and support a number of the more popular chips already.


    At this point, you now have a physical image of the data stored on the NAND flash
    chip.


    Although the chip-off process is quite effective, it also has a large barrier
    to entry. The cost of the equipment and tools is prohibitive and an examiner must
    again have very specialized training and skills. There is always the risk that
    the NAND flash chip will be damaged with chip-off, generally in its removal from
    the PCB. Finally, a clean room with protections from static electricity is also
    desirable. While local or even State law enforcement agencies and forensic firms
    find the cost of chip-off too prohibitive, it is certainly a valid techniques
    that larger agencies would find useful in their suite of forensic techniques.


    # Software-Based Physical Techniques and Privileges'
  merge: -1
  pgno: 435
- img_proc: true
  md: 'Software-based physical techniques have a number of advantages over the hardware-based
    techniques. Software-based techniques:


    +   - Easier to execute;

    - Often provide direct access to file systems to allow a complete copy of all
    logical files (simplifies some analysis);

    - Provide very little risk of damaging the device or data loss.


    To execute the software-based physical techniques, you first must gain root privileges
    and then run the acquisition programs.


    Unfortunately, root privileges on Android devices are not enabled by default.
    However, it is possible to gain root privileges in certain scenarios, several
    of which we will cover next. There are some major challenges to obtaining root
    privileges to keep in mind though:


    +   1. Gaining root privileges changes the device in many situations.

    2. The techniques for root privileges differ not only for each manufacturer and
    device but for each version of Android and even the Linux kernel in use. Just
    based on the Android devices and versions developed to date, there are literally
    thousands of possible permutations.

    3. Many of the exploits used to gain root privileges are discussed online and
    often contain inaccurate information.


    Given this, gaining root privileges can be quite difficult and is always very
    frustrating.


    There are three primary types of root privileges:'
  merge: -1
  pgno: 436
- img_proc: true
  md: '+   1. Temporary root privileges attained by a root exploit, which does not
    survive a reboot. Typically the adb daemon is not running as root in this instance.


    +   2. Full root access attained through a custom ROM or persistent root exploit.
    Custom ROMs often run the adb daemon as root while most of the persistent root
    exploits do not.


    +   3. Recovery mode root attained by flashing a custom recovery partition or
    part of a custom ROM. Custom ROMs often run the adb daemon as root as do most
    of the modified recovery partitions.


    Android enthusiasts who want root access are typically interested in full, sustained
    root privileges. However, from a forensics standpoint, temporary root privileges
    or root access via a custom recovery mode are preferred.


    If you need to gain access on a new device or Android version, you must have a
    separate device used for testing to ensure that the process works and no data
    are lost. Testing, although time consuming, is an important step in this situation.


    The following sections cover each step in detail.


    su


    The first thing a forensic examiner should check is whether the device already
    has root privileges. This is the easiest of any technique discussed and is certainly
    worth the short time it takes to test. The device must have USB debugging enabled
    even if the device is locked, you should still check. If the device is not pass
    code locked, make sure USB debugging is enabled, which was covered in Chapter
    3.'
  merge: -1
  pgno: 437
- img_proc: true
  md: 'Next, connect the device to your workstation and attempt to gain root privileges
    by requesting super user access with the “su” command as follows:


    ```

    ahoog@ubuntu:~~$ adb shell su

    : permission denied

    ```


    In this instance, root privileges were not granted. This is the typical result
    of the command. However, the following was on a device that had root access:


    ```

    ahoog@ubuntu:~~$ adb shell su

    #

    ```


    Instead of receiving a permission denied error, root privileges were granted.
    This is indicated by the new # prompt. Sometimes a device will allow root access
    but require the user to grant the privileges by clicking OK on a prompt displayed
    on the device. If the device is not pass code protected, you should check to see
    if the prompt is displayed.


    # Researching Root Privilege Exploits


    If the device does not already have root privileges, you can research possible
    techniques online. This process can be very frustrating as there are many inexperienced
    people who request help on the various discussion boards. However, while there
    are substantial amounts of inaccurate information, there are also very knowledgeable
    resources and techniques which do work.'
  merge: -1
  pgno: 438
- img_proc: true
  md: 'Although there are many sites available that discuss Android root exploits,
    one truly stands above all others. The site, xda-developers, is an extremely popular
    and active site and is self-described as “the largest Internet community of smartphone
    enthusiasts and developers for the Android and Windows Mobile platforms”(Android
    & Windows Phone, n.d.). Many of the other web sites post various root exploits
    but generally link back to a discussion thread on xda-developers.


    Often the best approach to researching root exploits is to simply search the Internet
    with your preferred search engine, have a test device, and a lot of patience.


    # Recovery Mode


    Recovery mode is an operating mode for Android that was designed to apply updates,
    format the device, and perform other maintenance on the devices. The stock recovery
    mode on most devices is very basic, only provides a number of limited functions,
    and certainly does not provide root privileges in a shell.


    Custom recovery partitions, on the other hand, nearly always allow root privileges
    through the shell. These new recovery partitions are typically installed by the
    user when the device is rooted and provide various functions that simplify the
    backup and update processes needed from the custom ROMS.


    As with researching root exploits, examiners should use extreme caution when installing
    a custom recovery partition as the process often contains kernel and radio updates
    that could render the device unusable (often referred to as “bricked”) if there
    are incompatibilities between the device, kernel, and radio firmware.'
  merge: -1
  pgno: 439
