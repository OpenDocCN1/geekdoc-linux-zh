    # Smudge Attack


    Initially, Android devices used the pattern lock for pass code protection instead
    of a numeric or alphanumeric code. A recent paper entitled “Smudge Attacks on
    Smartphone Touch Screens” by the University of Pennsylvania Department of Computer
    and Information demonstrated a technique for accessing pattern locked Android
    devices by enhancing photographs of the screen (Aviv, Gibson, Mossop, Blaze, Smith,
    n.d.). The paper’s summary states:


    > Our photographic experiments suggest that a clean touch surface is primarily,
    but not entirely, reflective, while a smudge is primarily, but not entirely, diffuse.
    We found that any directional lighting source that is not positioned exactly at
    a complementary angle to the camera will render a recoverable image of the smudge.
    Very little photo adjustment is required to view the pattern, but images generally
    rendered best when the photo capture was overexposed by two to three f-stops (4
    to 8 times “exposure”).


    If care was taken by the first responders to minimize contact with the device’s
    screen, this recovery technique may be viable. As an example of what is possible,
