  md: '# Status (Live or Shrink/Delete)


    | Block | Chunk | ObjectID | ChunkId | Comment |

    |---|---|---|---||

    | 0 | 0 | | | Erased |

    | 0 | 1 | | | Erased |

    | 0 | 2 | | | Erased |

    | 1 | 0 | 500 | 0 | Shrink/delete ObjectHeader, file length 3 |

    | 1 | 1 | 500 | 1 | Shrink/delete New first chunk of data |

    | 1 | 2 | 500 | 2 | Shrink/delete New ObjectHeader, file length 0 |

    | 1 | 0 | 500 | 0 | New ObjectHeader, file length 0 |

    | 2 | 0 | 500 | 0 | Live New ObjectHeader, file length 0 |


    During this cycle, Block 0 was garbage collected and is now available for writing
    data. As the file was renamed, a new ObjectHeader was written to the NAND flash.
    With all chunks in Block 1 now obsolete, they are available for garbage collection.
    However, bear in mind that due to the limited endurance of NAND flash, write/erase
    cycles are avoided.


    The implications for forensics are that the entire history of ObjectHeader and
    Object chunks, unless garbage collected, would remain on the NAND flash. With
    proper software, the NAND flash could be scanned and the entire history of the
    file system could essentially be rebuilt. Not only would the timeline contain
    the date/time of every edit, but it is possible to recover the actual state of
    the file. In practice, the state of the YAFFS2 partitions is not this simple.
    However, the general principle remains relevant.


