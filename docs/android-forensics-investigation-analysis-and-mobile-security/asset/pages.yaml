    # File Carving


    File carving is a process in which specified file types are searched for and extracted
    across binary data, often resulting in a forensic image of an entire disk or partition.
    File carving works by examining the binary data and identifying files based on
    their known file headers. If the file format has a known footer, it will then
    scan from the header until it finds the footer (or hits a maximum file length
    set by the configuration file) and then save the carved file to disk for further
    examination.


    Traditional file carving techniques require that the data are sequential in the
    image and this cannot produce the full file if it is fragmented. There are many
    reasons that files are fragmented as the process for saving the file to nonvolatile
    storage varies by file system type and is heavily influenced by the memory type
    such as NAND flash. This also means that files that are very large (such as videos)
    will be more difficult to recover.


    Newer file carving techniques are being researched and developed to address the
    limitations experienced with file fragmentation. One such technique is developed
    by Digital Assembly, a digital forensics solutions company based in New York.
    Their technique, called SmartCarving, profiles the fragmentation characteristics
    of several popular file systems (except YAFFS2, unfortunately) and uses this information
    to carve even fragmented photos. Their product, Adroit'
