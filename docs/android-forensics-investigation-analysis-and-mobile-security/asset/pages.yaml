    | files | Files the developer saves to internal storage |

    | cache | Files cached by the application, often cache files from the web browser
    or other apps that use the WebKit engine |

    | databases | SQLite databases and journal files |


    Table 4.1 only presents the most common subdirectories found in an application''s
    /data/data file. As we examine data more closely throughout this book, we will
    catalog many additional folders and data files.


    # How Data are Stored


    Android provides developers with five methods for storing data to a device. Forensic
    examiners can uncover data in at least four of the five formats. Therefore, it
    is important to understand each in detail.


    Persistent data are stored to either the NAND flash, the SD card, or the network.
    Specifically, the five methods are:


    +   1. Shared preferences

    2. Internal storage

    3. External storage

    4. SQLite

    5. Network


    Beyond the data that app developers store, the Linux kernel and Android stack
    provide information through logs, debugging, and other standard information services.


