- img_proc: true
  md: 'Line 12: The “/data/app-private” directory stores protected apps from the Android
    Market.


    Line 13: More recent versions of Android have a secure cloud backup API that developers
    can integrate into their apps. The “/data/backup” directory is used to queue and
    manage these backups. However, thus far meaningful data has not been recovered
    from directory.


    Line 14: The “/data/btips” (Texas Instrument’s Bluetooth Protocol Stack) directory
    stores the log files if the associated app (com.ti.btips) crashes.


    Line 15: The “/data/davlik-cache” directory contains the Davlik VM’s cached dex
    files used to run apps.


    Line 16: The “/data/data directory” contains the application specific data, easily
    the most important area to focus on in an investigation.


    Lines 17–23: One app was kept in the directory hierarchy for demonstration purposes.
    The directory is named according to the package name and often clearly identifies
    the developer (Facebook in this case).


    Line 24: For HHGTT fans (famous advice to intergalactic travelers from the classic
