- img_proc: true
  md: 'The manual analysis required for much of the YAFFS2 forensics is certainly
    time consuming and a bit daunting, which makes the barrier of entry much higher
    than the analysis of well-understood and supported file systems. However, there
    are many resources that are easily accessible to assist an analyst new to this
    approach.


    First, hopefully this book provided a good introduction to using Linux for forensic
    analysis (please recommend that all of your friends and colleagues have a copy
    for their bookshelves).


    Perhaps a bit more helpful is that a simple Google search will often result in
    many helpful posts on blogs, discussion boards, mailing lists, and other such
    resources. While there is certainly inaccurate information on the Internet, many
    of the technical people working in these areas post quite accurate and precise
    information. And, as a bonus, many of the authors are very responsive to inquiries
    and clarifications.


    Next, there is an excellent introduction to Linux for law enforcement and forensic
    analysts, which is available online and at no cost. The web site, Linux LEO: The
    Law Enforcement and Forensic Examiner’s Introduction to Linux, provides the guide
    in PDF format and introduces the reader to Linux concepts needed to use the operating
    system as a forensic tool (Grundy, B, n.d.).


    As you use Linux further, you will find that it is quite easy to automate many
    of the manual tasks. This not only allows you to have great control over how the
    system works, but the automation can save considerable time. This is a great combination
    as the busy examiner can process more forensic data with cutting edge tools and
    at the same time explain exactly what the system did instead of just'
  merge: -1
  pgno: 546
- img_proc: true
  md: "being able to say that a button was clicked and a report was produced.\n\n\
    The easiest way to start automating common Linux tasks is to simply write a shell\
    \ script, which is very easy to write and essentially mimic the commands you would\
    \ type in a terminal session.\n\nFor example, let's say you have a series of .csv\
    \ files, which contains the results of running the AFLLogical forensic technique\
    \ on an Android device. You need to send the top row of each file to someone,\
    \ but it should not contain any data from the device. You could open each file\
    \ manually, delete the data rows, save the updated file to a new directory, and\
    \ finally find the information. However, this could take some time. Instead, you\
    \ could write a simple shell script.\n\nFirst, let's open a new file for editing:\n\
    \n```\nahoogubuntu:~$ nano -w ~/sanitize-csv.sh\n```\n\nThen place the following\
    \ into the file:\n\n```\n#!/bin/bash\n\n# create a new directory to store the\
    \ sanitized files\nmkdir sanitized\n\n# for each file ending with .csv\nfor f\
    \ in *.csv\ndo\n    # read the top row of the file and save it to the sanitized\
    \ directory\n    # with the same filename followed by -lrowonly\n    head -1 \"\
    $f\" > sanitized/\\$f-lrowonly\ndone\n\n# create a \"tar grip\" archive of the\
    \ file so it is easier share\ntar czvf AFLogical-sanitized.tgz sanitized/*\n```"
