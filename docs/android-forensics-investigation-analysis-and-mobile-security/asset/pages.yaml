    # Flash a New Recovery Partition


    There are a number of protocols, utilities, and devices that allow a skilled examiner
    to flash the recovery partition of a device with a modified image.


    The first available protocol supporting this approach was fastboot. Fastboot is
    NAND flash update protocol executed over USB while in bootloader mode. Most devices
    ship with bootloader protection enabled, which prohibits the use of this protocol.
    However, it is possible that the protection has been disabled. To determine bootloader
    protection is enabled, you must access the bootloader and look at the signature
    information, which will indicate S-ON or S-OFF. The S represents security, and
    so S-ON, the default production build, has security enabled; S-OFF indicates security
    is not enabled. Some devices ship with S-OFF, as the Google Nexus One, as it is
    preloaded with Google’s Engineering SPL/Bootloader. Other rooting techniques also
    disable this protection, so checking this on a pass coded device may yield results.
    You can access the main bootloader using the first part of the key combinations
    in Table 6.2 in the previous section.


    Fastboot does not require USB debugging to access the device. Hence, like recovery
    mode, it can be used to gain access to the device’s data. Once the new recovery
    partition is available, the device should be rebooted into recovery mode and forensic
    imaging can take place.'
