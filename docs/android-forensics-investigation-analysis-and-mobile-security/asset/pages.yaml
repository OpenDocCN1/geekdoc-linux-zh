  md: '# Accelerometer/Gyroscope


    Android can detect and change the user interface based on how the device is held
    or rotated. This is typically achieved through an accelerometer that detects the
    size and direction a device has been accelerated (or positioned). Typically, this
    is used to change the display between landscape and portrait.


    The latest version of Android (2.3 as of this writing) now supports a gyroscope,
