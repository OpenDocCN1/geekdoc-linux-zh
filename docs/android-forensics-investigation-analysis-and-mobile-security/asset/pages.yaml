    # YAFFS2 Timeline Analysis


    Ideally, this section would detail the use of already-built forensic software
    that would build YAFF2 timelines. Unfortunately, YAFF2 is not yet supported by
    any forensic timeline tools, so examiners in need of this information must take
    a more difficult path.


    Over the next few years, the forensics industry needs to perform far more research
    into YAFFS2. However, with Android moving towards EXT4, it is possible that most
    of the YAFFS2 research will not occur. Hopefully, this will not be the case.


    Here, we will present some research that is intended to provide a basic framework
    to begin YAFFS2 research. This research was done on the simulated NAND flash initially
    covered in Chapter 4. While this approach provides the researcher with the control
    and privileges needed for effective research, it does not necessarily mimic production
    environments.'
