    the number of milliseconds since January 1, 1970, unless otherwise noted.


    The apps tested were installed and used on the device then analyzed with a custom
    Python program to automate some of the techniques described previously in this
    chapter. While significant information is provided, be advised that this is only
    a reference and likely incomplete. Analysts should use the forensic and security
    tools as well as the techniques described above for a full analysis of the device
    they are examining.


