    -s <serial number>

    -p <product>

    -c <cmdline>

    -i <vendor id>

    ```


    ```

    erase userdata and cache

    sspecify device serial number

    sspecify product name

    override kernel commandline

    sspecify a custom USB vendor id

    ```


    As you can see, once in fastboot mode, it is quite simple to flash the modified
    recovery partition:


    ```

    ahoog@ubuntu:~$ fastboot flash recovery modified-recovery-image.img

    ```


    After this process completes, you can reboot the phone into recovery mode and
