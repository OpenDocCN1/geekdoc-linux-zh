    # Tip


    # Cross-compiling for ARM


    Cross-compiling source code to run on the ARM platform can be quite difficult
    and there is sparse support for it online. One possible solution is to use Android''s
    Native Development Kit (NDK) to build compatible binaries. Another option is to
    use Linux and install a cross-compiler such as Code Sourcery''s G++ Lite 2009q3-67
    for ARM GNU/Linux from http://www.codesources.com/sgpp/lite/arm/portal/release1039.
    Once a cross-compiler is installed, you may modify the source''s Makefile to indicate
    the cross-compiling option. Also check this book''s web site at http://viaforensics.com/education/android-forensics-mobile-security-book/
    for future updates.


    To avoid writing any data to the NAND flash, we can again examine the output of
    the mount command and take note that the “dev/ directory is tmpfs and, is stored
    in RAM. We can use forensic utilities to “/dev":


    ```

    ahog@ubuntu:~$ adb push AFPhysical/ /dev/AFhysical

    push: AFPhysical/tar -> /dev/AFhysical/tar

    push: AFPhysical/md5sum -> /dev/AFhysical/md5sum

    push: AFPhysical/nanddump -> /dev/AFhysical/nanddump

    push: AFPhysical/nc -> /dev/AFhysical/nc

    4 files pushed. 0 skipped.

    1003 KB/s (2803303 bytes in 2.727s)

    ```


    Next we need to make the programs executable on the device. To achieve this, we
    use the chmod command, which changes the'
  merge: -1
  pgno: 452
- img_proc: true
  md: 'permissions of a file including the execute flag. We will set all files to
    allow any user to read or execute the program:


    ```

    ahoog@ubuntu:~$ adb shell

    # cd /dev/AFPhysical

    /dev/AFPhysical # ls -l

    -rw-rw-rw- 1 0 0   711168 Jan 24 2011 md5sum

    -rw-rw-rw- 1 0 0   669799 Jan 24 2011 nanddump

    --rw-rw-rw- 1 0 0   711168 Jan 24 2011 nc

    --rw-rw-rw- 1 0 0   711168 Jan 24 2011 tar

    /dev/AFPhysical # chmod 755 *

    /dev/AFPhysical # ls -l

    -rwxr-xr-xr 1 0 0   711168 Jan 24 2011 md5sum

    -rwxr-xr-xr 1 0 0   669799 Jan 24 2011 nanddump

    -rwxr-xr-xr 1 0 0   711168 Jan 24 2011 nc

    -rwxr-xr-xr 1 0 0   711168 Jan 24 2011 tar

    ```


    As you can tell, after we execute the "chmod 755" command on the programs, each
    they have the execute bit now set, which is represented by the "x" in the file
    permissions.


    If you decided to save the nanddump to the SD card, ensure you place a properly
    formatted SD card in the device and that it is mounted on the system. Then we
    execute nanddump as follows:


    ```

    # /dev/AFPhysical/nanddump /dev/mtd8ro > /sdcard/af-book-mtd8.nanddump

    ECC failed: 0

    ECC corrected: 0

    Number of bad blocks: 1

    Number of bbt blocks: 0

    Block size 131072, page size 2048, OOB size 64

    Dumping data starting at 0x00000000 and ending at 0x015c0000...


    # ls -l /sdcard/af-book-mtd8.nanddump

    -rw-r--r-- 1 0 0   2830417992 Jan 1 00:12 /sdcard/

    af-book-mtd8.nanddump

    ```


    And ultimately either transfer to your Ubuntu VM using adb pull or remove the
    SD card and copy via a direct USB connection, which is'
