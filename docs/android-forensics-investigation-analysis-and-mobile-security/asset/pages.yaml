    At this point, you could proceed with imaging. However, typing the entire dc3dd
    command each time is not only tedious but can result in typos that could cause
    irreparable damage. So create a shell script, which not only acquires the device
    but also records various system characteristics, date/time stamps, and creates
    log files, which can be helpful as you write your report at a later time.


    We will place the acquire script in /usr/local/bin so you can easily run the script
    from any directory as /usr/local/bin is in your execution path by default:


    ```

    ahoog@ubuntu:~$ sudo nano -w /usr/local/bin/acquire-disk.sh

    ```


    Next, copy the following into the script, save by pressing Ctrl-O, and exit with
    Ctrl-X:'
  merge: -1
