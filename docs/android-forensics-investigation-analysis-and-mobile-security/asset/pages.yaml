- img_proc: true
  md: 'data is found—is possible from approximately two-thirds of the supported models.
    Furthermore, DS has been documented and verified as being 100% forensically sound,
    meaning the digital evidence is never altered in any way. These functions are
    all possible through a standard USB data connection with any PC.


    Over the past two years Google''s Android operating system for mobile devices
    has had a significant impact on the industry. Paraben focuses on staying in step
    with the latest innovations and has added support for the Android OS to DS. With
    the release of DS version 4.0, an investigator has the capabilities of acquiring
    the most commonly sought-after data such as call logs, address book, and SMS messages.
    Beyond these data types, DS will also acquire multimedia files—MMS messages, images,
    video, and audio files. The full list of data types that can be acquired from
    Android models are as follows:


    +   - Address Book including contacts groups, organizations, and address book
    settings, along with the standard name, phone number, and address


    +   - SMS messages


    +   - MMS messages


    +   - Call history


    +   - Contact methods


    +   - Browser history


    +   - External image media (metadata)


    +   - External image thumbnail media (metadata)


    +   - External media, audio, and miscellaneous data (metadata)


