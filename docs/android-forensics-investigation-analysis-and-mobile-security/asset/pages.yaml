    There are several known techniques that attackers use to compromise data in transit,
    with new security researchers either discover them or practitioners “in the wild.
    Well-known techniques include:'
  merge: -1
  pgno: 264
- img_proc: true
  md: '+   - Man-in-the-middle (MITM) attacks


    +   - MITM Secure Sockets Layer (SSL) attacks


    +   - DNS spoofing attacks (including /etc/hosts)


    +   - TMSI overflow baseband attacks


    The baseband attacks are a very new technique focusing on the cellular modem (baseband)
    firmware. According to Ralf-Philipp Weinmann who presented his exploit at the
    DeepSec 2010 conference, the baseband firmware is code written in the 1990s. Until
    recently, the technologies behind the GSM networks were poorly understood. However,
    over time researchers have unveiled the protocols and hardware and today it is
    possible to create a rogue GSM station with readily available hardware powered
    by open source software. With control over the GSM network, an attacker can execute
    a TMSI overflow attack that causes a heap overflow in the GSM baseband stack of
    Apple iOS devices prior to 4.2. This attack can lead to remote execution on the
    baseband processor (Ralf-Philipp Weinmann, n.d.).


    While the baseband attack is cutting edge security work, the MITM attacks have
    been around much longer and are well understood and easily executed. Generally,
    these techniques require the attacker to fully control a computer that is between
    the mobile device and the ultimate destination the device is trying to communicate
    with. In addition, the attacker may control key network services or devices such
    as a network switch, Wi-Fi access point, or DNS server, facilitating the attack.


    Once the attacker is able to position their computer between the Android device
    and the ultimate destination, they can launch the attack. For this scenario, let
    us assume an Android device connects'
  merge: -1
  pgno: 265
- img_proc: true
  md: 'to a Wi-Fi network unaware that a malicious attacker controls the network.
    The user begins to surf the Internet and ultimately decides to check their Twitter
    account. To keep the example simple, let us assume the Twitter app they use does
    not implement SSL—most do not, although recently the official app began to move
    in this direction.


    When they launch the app, it will connect to Twitter’s web site, authenticate,
    and take the user to their account. Of, in the interim, the attacker was capturing
    the web traffic and now has the Twitter user name and password. If the app did
    use SSL, but did not properly verify the SSL certificate, they would be susceptible
    to an MITM SSL attack, illustrated in Fig. 5.1.


    ![](img/cc70feeb090256bc8913d756d59d1429_266_0.png)


    FIGURE 5.1 Man-in-the-middle SSL.


    Although such an attack may only capture one password, most users reuse user names
    and passwords for many different sites. Once'
  merge: -1
  pgno: 266
- img_proc: true
  md: 'the attacker has one user name and password, they can begin to research more
    about the consumer and generally will be able to find additional systems they
    can access.


    Another very well-known attack leverages interception of HTTP session cookies
    to hijack another user''s authenticated session on a web site and begin acting
    as that user. Eric Butler''s Firesleep extension for the Firefox browser (http://codebutler/firesleep)
    demonstrates how easy this type of attack can be. Although using strong encryption
    such as WPA on Wi-Fi and other local measures can make things more difficult,
    as long as web sites do not require HTTPS end-to-end this type of attack remains
    possible.


    # Android Devices as an Attack Vector


    While the press and many security researchers largely focus on attacks directed
    at mobile devices, a growing concern is use of the Android device as an attack
    vector, particularly in environments where sensitive data are stored. The most
    common scenarios are found in corporations with trade secrets, intellectual property,
    or other data requiring protection. Corporations often implement sophisticated
    systems designed to prevent, or at least detect, the theft of data. These systems
    are not only expensive to purchase, but they generally require skilled staff to
    maintain, monitor, and then act on the information they provide.


    Until recently, most data protection systems focused on securing the perimeter
    of the enterprise to keep attackers outside the protected areas. Over time, systems
    designed to protect against internal threats were also developed. The most recent
    systems delve ever deeper into the network and infrastructure in an attempt to'
  merge: -1
  pgno: 267
- img_proc: true
  md: 'thwart attacks. These systems focus on areas such as data loss prevention (DLP),
    network access control (NAC), and network forensics. However, currently available
    solutions do not yet fully address the threat presented by mobile devices.


    Smartphones are obviously popular, and most people use them as intended. Often,
    they are personally owned and heavily used devices, so asking someone to forfeit
    their device is an intrusive request. For these reasons, Android devices and other
    smartphones end up in locations which house sensitive information, and yet no
    one shows concern. If instead someone brought a digital camera, voice recording
    device, camcorder, external hard drive, or their own networking equipment, it
    might raise some eyebrows. Of course, an Android device essentially contains all
    of these features and more in a compact and innocent looking device.


    # Data Storage


    Perhaps the simplest example of how an Android device can be used to steal information
    is to use it as a USB mass storage device. Until recently, smartphones had very
    little data storage. However, as NAND flash matured, manufacturers realized they
    could cost-effectively create devices that stored many gigabytes of data. Android
    devices today can easily store up to 16 GB of data on the NAND flash, and many
    devices include an external SD card, which can store an additional 16 GB or more.


    # Recording Devices


    Android devices are also well equipped to record nearly anything around them.
    They can easily take photographs of sensitive'
  merge: -1
  pgno: 268
- img_proc: true
  md: 'equipment or documents. They can also record video that captures a path through
    a building, including the sounds, security stations, windows, stairwells, and
    other items of interest along the way.

    Finally, Android devices can also passively record audio. All of this can be done
    without drawing any attention.


    # Circumventing Network Controls


    Perhaps an even more dangerous feature is the ability of an Android device to
    provide a separate network connection for a computer or devices with wireless
    capabilities. There are several ways to achieve this. In one scenario, an attacker
    (perhaps a disgruntled employee) could connect their Android device to their workstation.
    Casual observation may not raise any alarm since many people do this to charge
    their phones while at work. However, by installing a small program on both the
    Android device and the computer, a new network connection is provided to the computer.
    In this case, the traffic routed from the computer and out the Android device
    is completely outside the control of the environment. This connection completely
    circumvents the firewall, network access control, data loss prevention, and other
    security controls in place at the company.


    The newest Android devices do away with the USB cables and software packages needed
    in the above scenario. Instead, the Android device becomes a fully functional
    wireless access point through which the computer can connect. This scenario just
    as effectively circumvents the network security controls in place and can be performed
    with the device in a briefcase or pocket.


    # Really sneaky techniques'
  merge: -1
  pgno: 269
- img_proc: true
  md: 'If anyone believes cyber criminals or other attackers are not intelligent and
    creative, they are showing a serious lapse in judgment. So, let''s think outside
    the box using some of the techniques described above.


    For this scenario, the attacker is an employee who works at a company, which has
    significant trade secrets and intellectual property. (The attacker would not necessarily
    need to work there; however, it keeps the example sample.) Many of the executives
    have access to this information also have laptops and smartphones. Many of these
    same executives drink coffee at a popular cafe, which offers free Wi-Fi. The wireless
    access point at the coffee shop is called "indigo" and since they do not want
    to require a password, the access point is open and unencrypted. While the executives
    are drinking, eating, or meeting at the cafe, they connect their smartphones and
    laptops to the Wi-Fi.


    When they return to the office, they leave the wireless active on their smartphones
    and laptops. The disgruntled employee, of course, knows about the cafe''s wireless
    access point and decides to enable the access point feature on his Android device.
    Naturally, he has root access on his device, so he also installs and runs software
    that allows him to capture the network traffic. When one of the executives gets
    close to his Android device, the smartphone or laptop associates with his access
    point. He is then able to intercept traffic and either capture sensitive files
    and communications or perhaps capture credentials he could then use to access
    key network resources.


    While there are obstacles the attacker would have to overcome to implement this
    scenario, it is highly plausible and illustrates the unique risks Android devices
    present when used as an attack vector.


    # Security considerations


    Security, like development, is an art. There might be some who do not agree with
    that statement but very few of those individuals are going to read a forensics
    and security book. Security is an artistic'
  merge: -1
  pgno: 270
- img_proc: true
  md: 'process in the sense that art is “the products of human creativity” and “a
    superior skill that you can learn by study and practice and observation” (WordNet
    Search, n.d.). So why is all of this relevant? Successful security strategies
    require the right mix and balance of experience, judgment, risk assessment, creativity,
    observation, skill, and maybe even a little bit of luck. This section aims to
    cover a few broad concepts related to Android and security.


    # Security Philosophy


    Security is nearly always a compromise, weighing the risk of an attack against
    the costs (financial or other costs) of mitigating risk. While in theory an entirely
    secure system is possible, in practice it is nearly impossible to achieve, especially
    when social engineering attacks are available. The task of securing a system is
    very difficult even when the security professional controls access to the device
    including physical and remote access.


    Mobile devices are even more difficult to secure than traditional systems. Most
    of the control that a corporate security engineer would have over a computer system
    is not possible on an Android device. First, the device is comprised of hardware
    and software assembled and maintained by a large, complex, and diverse group of
    participants including the core Android team, software and hardware from the manufacturer,
    and software and hardware from the wireless carrier. Furthermore, the device owner
    has the ability to install custom apps and even modify the device significantly
    if they have sufficient privileges. Finally, the device travels through many networks,
    none of which can be fully trusted. Yes, securing mobile devices is a major challenge.'
  merge: -1
  pgno: 271
- img_proc: true
  md: 'In spite of these challenges, certain security controls could be engineered
    into the device. To summarize an overall strategy and philosophy, the following
    meme is useful:


    If you secure it, they won''t come.


    The concept—adapted from Universal Studio’s 1989 film “Field of Dreams,” where
    a voice hears encouraging the lead character to build a baseball field on his
    Iowa farm—is simple. In the movie, the voice repeatedly says, “If you build it,
    he will come” (Ten, n.d.). Eventually, the lead character does build the field
    and, in fact, mysterious guests do show up. But you’ll have to watch the movie
    for the complete story.


    So, how does this apply to mobile security? There is a wide margin between the
    ideal cryptographically secure system and a system that stores all information
    in plain text in a well-organized and known structure as described in the previous
    com.android.email example. Since the mobile device is a risk from many different
    vectors, even encrypted data can be compromised. However, providing some level
    of obfuscation or encryption will complicate the process required for an attacker
    to compromise the data. While this approach is not 100% secure, attackers are
    pragmatic and tend to target the easily accessible data.


    One argument against this approach is that obfuscation or encryption that can
    be compromised provides a false sense of security causing the user to act more
    carelessly with the device in the belief that the security of their data is impenetrable.
    Whereas if the data are stored as plain text and the users are aware of the risk,
    they will use significant caution with the device.'
  merge: -1
  pgno: 272
- img_proc: true
  md: 'Ultimately, the individual and corporate consumers of mobile devices will steer
    the mobile security ecosystem in the direction they value through their purchasing
    decisions. This necessarily depends on education. Consumers must be sufficiently
    aware of the data security risks and possible solutions available.


    There are a number of potential solutions which, while not providing a cryptographically
    secure system, do improve the security of the data by increasing the complexity
    of a successful attack. The list below illustrates several concepts:


    +   1. Require the user to enter the password the first time an app is run after
    the reboot, and only store the password in memory. In this case, the password
    is not stored on the device in plain text. However, it is in memory and an attacker
    with sufficient privileges on the device could recover the password.

    2. Further, secure the concept above by encrypting the password stored in memory
    with a key based on time, pseudo-random data, etc. In this fashion, the attacker
    now must have root on the device and instead of just dumping the processes'' memory,
    they must locate the encryption key, the encrypted password, and the algorithm
    used to comprise the password.

    3. Building further, the memory password could expire in time or the encryption
    key used in memory could be changed.

    4. If the password is stored on the NAND flash, encrypt it with a pass phrase,
    which is entered after the device reboots.


    Although none of the ideas provide a completely secure system, the level of effort
    and privilege needed to compromise the data are'
  merge: -1
  pgno: 273
- img_proc: true
  md: 'orders of magnitude higher than compromising sensitive data stored in plain
    text, and thus deters most attackers.


    # US Federal Computer Crime Laws and Regulations


    There are a number of federal laws in the US that relate to the security of data
    at rest and in transit. The goal of this section is to simply enumerate several
    of the more relevant laws and provide a brief background on them. In total, more
    than 40 federal statutes exist which can be used in the prosecution of computer-related
    crimes (Country, n.d.). In addition, each State typically has laws and regulations
    addressing computer crimes.


    At the Federal level, the US Department of Justice (DoJ) divides computer crime
    into three distinct areas, two of which have broad application to the types of
    crimes involved when compromising a mobile device. The two areas are (Country,
    n.d.):


    +   1. Crimes that target a computer network or device directly including hacking,
    viruses, worms, malware, sniffers, and others.

    2. Crimes committed using computer networks or devices such as fraud, identity
    theft, corporate espionage, and so on.


    The Computer Fraud and Abuse Act (CFAA) focuses on attacks against government
    and financial institution computers or computers involved in interstate or foreign
    commerce. The Act covers narrow areas, such as accessing computers without proper
    authorization to gain data related to national security issues, as well as more
    broad sections, such as accessing a computer without proper authorization in order
    to commit fraud or to gain something of value. The CFAA was amended by the National
    Information'
  merge: -1
  pgno: 274
- img_proc: true
  md: 'Infrastructure Protection Act to cover new abuses and to include those intending
    to commit the crime.


    The Electronic Communications Privacy Act (ECPA) is another law covering computer
    crimes, which makes it illegal to intercept stored or transmitted electronic communication
    without authorization. The ECPA contains several key areas:


    +   - Communication in transit including oral, wire, or electronic communications
    (Wiretap).

    - Data at rest (Stored Communication Act) that protects data stored on nonvolatile
    memory.

    - Collecting communication metadata such as phone numbers, IP addresses, and other
    data used to route communication (but not the message itself). This is called
    the “pen registers and trap trace devices,” which refers to the actual devices
    and techniques used to capture the information.


    One final law worth pointing out is the Economic Espionage Act, which passed in
    1996 and focused on the theft of trade secrets. Prior to the law’s enactment,
    it was difficult to prosecute economic or corporate espionage. However, by defining
    trade secrets and requiring the owner of the information to have taken reasonable
    measures to protect the secret, it was now possible to criminalize the theft of
    intellectual property.


    This section barely addresses the significant body of legal work which can be
    used to prosecute computer crimes. However, it should be clear that there are
    laws designed to protect data both in transit and at rest.'
  merge: -1
  pgno: 275
- img_proc: true
  md: 'In addition to Federal and State laws that criminalize computer crimes, a host
    of regulatory bodies govern corporations who operate in industries which involve
    sensitive data. Many of the regulations provide not only specific guidelines and
    requirements the firms must follow, but also civil and criminal statues with both
    financial penalties and, in the most serious cases, may even involve incarceration.
    A list of the better known regulations include the following:


    +   * Payment card industry data security standard (PCI)

    * Health Insurance Portability and Accountability Act (HIPAA)

    * HITECH Act Enforcement Interim Final Rule (additions to HIPAA)

    * Federal Information Security Management Act (FISMA)

    * Family Education Rights and Privacy Act of 1974 (FERPA)

    * Gramm-Leach-Bliley Financial Services Modernization Act of 1999 (GLBA)

    * Sarbanes Oxley (SOX)


    Clearly the US Congress recognizes the importance of data and computer security
    and provides a wide array of laws, regulations, and other resources to compel
    and enforce the security measures necessary to successfully operate the systems
    critical to commerce.


    # Open Source Versus Closed Source


    There is active debate discussed often on the Internet about whether open source
    software is more secure than closed source software. As with many long-standing
    debates, the main proponents of each side are committed to their conclusions and
    the debate continues on.'
  merge: -1
  pgno: 276
- img_proc: true
  md: 'The basic reason behind the belief that open source software is more secure
    is that the code can be examined for flaws and quickly fixed. Implicit in this
    belief are two assumptions:


    +   1. Developers will perform security code reviews on open source projects.

    2. The software’s maintainer will quickly patch the security flaws.


    Of course, if both the steps are not taken, then clearly the open source software
    will contain security flaws and without the patch, attackers will have precisely
    the information they need to exploit the bug. However, if both of these steps
    are taken, then the security of the code will evolve with the benefit of many
    people examining the code and the resulting patches.


    In contrast, the closed source model relies on a company developing secure code,
    scouring their code for security flaws, patching the flaws, and then distributing
    the updates in a timely manner to subscribers. For anyone tasked with securing
    desktops running Microsoft’s Windows platforms, they are well aware of the continuous
    stream of patches released on the second Tuesday of each month, which has been
    dubbed “Patch Tuesday.” Microsoft also releases patches for serious exploits outside
    of the scheduled Patch Tuesdays.


    In a fairly high profile finding, Microsoft acknowledged (Microsoft Security Advisory,
    n.d.) that security researcher Travis Ordman discovered a 17-year-old security
    flaw in every 32-bit version of Microsoft Windows since 1993 (Windows NT through
    Windows 7) (Johnston, n.d.). Ormandy posted the full details of the exploit to
    the Full Disclosure mailing list nearly seven months after notifying'
  merge: -1
  pgno: 277
- img_proc: true
  md: 'Microsoft of the vulnerability on June 12, 2009 ([Full-disclosure Microsoft,
    n.d.). It is noteworthy that the official advisory to Microsoft''s clients only
    happened after Ormandy posted the disclosure and after that point, Microsoft acknowledged
    the security flaw within one day.


    In another recent example, security firm Matta Consulting discovered numerous
    critical security flaws in Cisco System''s Unified Videoconferencing platform.
    The flaws enable a malicious third party to gain full control of the device, harvest
    user passwords, and possibly launch an attack against other parts of the target
    infrastructure (Cisco Unified Video, n.d.). Cisco acknowledged the flaws in their
    advisory with the hard-coded passwords representing the most alarming flaw:


    The Linux shadow file contains three hard-coded user names and passwords. The
    passwords cannot be changed, and the accounts cannot be deleted. Attackers can
