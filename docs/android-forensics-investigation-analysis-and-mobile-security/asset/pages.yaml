- img_proc: true
  md: "The strings command on the Ubuntu workstation will extract, by default, ASCII\
    \ printable strings—at least four characters long—from any file, text or binary.\
    \ While this technique is not terribly elegant or sophisticated, it is quite effective\
    \ at quickly examining binary data to determine if information of interest might\
    \ be contained in the file.\n\nThere are several options that have a great impact\
    \ on what strings output. First, let's take a look at the synopsis section of\
    \ the command's man page (manual):\n\n```\nstrings (1)                       \
    \        GNU Development Tools                               STRINGS (1)\n\nNAME\n\
    \    strings — print the printable characters in files.\n\nSYNOPSIS\n    strings\
    \ [-afovV] [-min-len]\n        [-n min-len] [--bytes=min-len]\n        [-t radix]\
    \ [--radix=radix]\n        [-e encoding] [--encoding=encoding]\n        [-all]\
    \ [--print-file-name]\n        [-T bfdname] [--target=bfdname]\n        [--help]\
    \ [--version] file\n```\n\nThere are a few options you should always consider\
    \ when executing strings. First, the “--all” tells strings to examine the entire\
    \ file (on certain files, it only examines certain portions of the file). Second,\
    \ the “--radix=” option instructs strings to print the offset within the file\
    \ where the string was found. This is extremely helpful when you combine strings\
    \ and a hex editor to examine possible evidence found in the file. The radix option\
    \ can print the offset in octal (--radix=o), hex (--radix=x), or decimal (--radix=d).\
    \ For most hex editors, you should consider hex or perhaps decimal offsets."
  merge: -1
  pgno: 476
- img_proc: true
  md: "The other extremely important option controls the character encoding of the\
    \ strings, which provides support for Unicode characters in both big-endian and\
    \ little-endian formats:\n\n```\n--encoding=encoding\nSelect the character encoding\
    \ of the strings that are to be found.\nPossible values for encoding are: s =\
    \ single-7-bit-byte characters\n(ASCII, ISO 8859, etc., default), S = single-8-bit-byte\
    \ characters,\nb = 16-bit bigendian, l = 16-bit littleendian, B = 32\nbigendian,\
