    |

    |---|---|---|---|---||

    | 0 | 0 | 500 | 0 | Shrink/delete | Obsoleted ObjectHeader. Originally for blank
    file, length of 0 |

    | 0 | 1 | 500 | 1 | Live | First chunk of data |

    | 0 | 2 | 500 | 2 | Live | Second chunk of data |

    | 0 | 3 | 500 | 3 | Live | Third chunk of data |

    | 1 | 0 | 500 | 0 | Live | New ObjectHeader, file length 3. |


    The key point to understand here is that YAFFS2 is unable to go back and update
    the original ObjectHeader with the new size, chunks of data, and others. Instead,
    it must write a new ObjectHeader that will contain the metadata needed for the
    updated file. In YAFFS2, the new ObjectHeader is given a larger sequence number
    and thus it becomes the current ObjectHeader and YAFFS2 simply ignores the previous
    one (however, it remains on disk).


    Next, the file will be opened with read/write access and the first chunk of data
    will be given a new value. Finally, the file is saved and closed, which results
    in additional data written to the NAND flash, as shown in Table 4.9.


