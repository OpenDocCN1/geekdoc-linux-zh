    In this example, we passed two directories to which we wanted archived: the directory
    containing SMS/MMS messages in "/data/data" and the "cache" directory. We sent
    the archive over the network and received it on the Ubuntu VM. However, you could
    have also simply saved the archive to the SD card.


    Once you have root privileges on an Android device and sufficient understanding
    of the device''s architecture, you can use nandump, dd, tar, netcat, and adb to
    create forensic images or simply copies of the data for analysis.


    # Summary


    There are several techniques that can be used to perform a forensic acquisition
    of an Android device. If the device is pass code'
  merge: -1
