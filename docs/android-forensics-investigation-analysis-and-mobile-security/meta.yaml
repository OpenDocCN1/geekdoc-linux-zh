  md: 'In total, this command found and categorized 4352 allocated files on the SD
    card. Here''s what each part of the command accomplished:


    +   - `find ~/mnt/sdcard`—Finds files in the directory where we mounted the SD
    card image ~/mnt/sdcard

    - `-type f`—Only examines regular files (i.e., doesn''t list directories)

    - `-print0`—Terminates each file name with a NULL character instead of the default
    new line which causes issues when file names have spaces

    - `"|"`—Pipes the output of find to the next program

    - `xargs`—This program builds and executes command lines using data from standard
    input (i.e., other programs'' output)

    - `-0`—Tells xargs that the data being piped is terminated by NULL character (matches
    the -print0 from find)

    - `file`—This is the command xargs runs against each line returned by the find
    command


    The find and xargs commands are very powerful ways to examine, interact, or otherwise
    manipulate a large set of files. By combining timeline and file system analysis,
    file carving, strings, and hex analysis, an investigator is armed with powerful
    tools to uncover information critical to the case.


