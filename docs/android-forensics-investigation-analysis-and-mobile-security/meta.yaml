    SEPERATOR=\"---------------------------------------------------\\r\"\n\nif [ \"\
    $#\" != 6 ]; then\n    echo \"Usage: acquire_disk.sh CLIENT CASE TAG SERIALNO\
    \ SOURCEDEV DESTPATH\"\n    exit 2\nfi\n\n# check directories, created if needed\n\
    if [ ! -d \"$DESTPATH\" ]; then\n    echo \"Destination path [$DESTPATH] does\
    \ not exist, exiting\"\n    exit 1\nfi\n\nif [ -d \"$DESTPATH/$CLIENT/$CASE/$TAG-$SERIALNO\"\
    \ ]; then\n    echo \"$DESTPATH/$CLIENT/$CASE/$TAG-$SERIALNO already exists, can't\
