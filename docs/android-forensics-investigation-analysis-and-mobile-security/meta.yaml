- img_proc: false
  md: '+   - Number as written to NAND flash: 63 99 d5 d4 (0x6399d5d4)

    - Converted from little endian to big endian: 4d 5d 99 36 (0x4d5d9936, which is
    the hex read from right to left)

    - Converting 0x4d5d9936 (hex) to base 10 is 1297979702

    - Unix time stamp 1297979702 in human date/time format is Thu Feb 17 15:55:02
    CST 2011 (date -d @1297979702)


    Using this information, we can isolate a number of important artifacts in the
    nanddump as shown in [Table 7.3](#).


    **Table 7.3** Artifacts from YAFFS2 Nanddump


    | Offset | Hex | Decimal | Converted | Description |

    |---|---|---|---|---|

    | 0x00000118 - 11B | dd 89 d5 d4 | 1297979613 | Thu Feb 17 15:53:33 CST 2011 |
    This is the *atime* (accessed time) for the directory created, which is the same
    as the modified and changed time as it was just created. This corresponds with
    the date/time from debugging statements |

    | 0x0000011C - 11F | dd 89 d5 d4 | 1297979613 | Thu Feb 17 15:53:33 CST 2011 |
    This is the *mtime* (modified time) of the directory, which is the same as the
    *atime* as it was just created |

    | 0x00000120 - 123 | dd 89 d5 d4 | 1297979613 | Thu Feb 17 15:53:33 CST 2011 |
    This is the *ctime* (metadata changed time) of the directory, which is the same
    as the *atime* as it was just created |

    | Bytes 3–6 in OOB | 10 01 00 00 | 4097 | N/A | Sequence number for the block
    |

    | Bytes 7–10 in OOB | 10 10 00 03 | 805306625 | N/A | Object ID for directory
    test, consistent with debugging data |

    | 0x00006918 - 691B | 63 99 d5 d4 | 1297979702 | Thu Feb 17 15:55:02 CST 2011
    | File *atime*, not updated as file was created despite file being accessed |

    | 0x0000691C - 691F | d7 99 d5 d4 | 1297979773 | Thu Feb 17 15:56:13 CST 2011
    | File *mtime*, consistent with update of file contents |

    | 0x00006920 - 6923 | 42 a9 d5 d4 | 1297979940 | Thu Feb 17 15:59:00 CST 2011
    | File *ctime*, consistent with the permission change detailed in debug logs |

    | Bytes 3–6 in OOB | 10 01 00 00 | 4097 | N/A | Sequence number for the block,
    same as previous as all data fit in 128 KB block and thus, a new sequence number
    was not allocated |

    | Bytes 7–10 in OOB | 20 10 00 01 | 268435714 | N/A | Object ID for file1.txt,
    consistent with debugging data |


    Quite satisfyingly, the data from the debug logs, stat command, and the nanddump
    of the simulated NAND flash device all correspond. With additional analysis, it
    would be quite possible to'
  merge: -1
  pgno: 535
- img_proc: false
  md: 'create the MAC times for each file and directory on the NAND flash, which would
    provide obvious benefit to an examiner. It is also possible to gather full metadata
    information from ObjectHeaders still found on the NAND flash and—provided garbage
    collection did not occur on the block—the full content of the time at each point
    in time.


    It is worth pointing out that in the very limited testing and analysis demonstrated
    here, it appears the *atime* (accessed time) for the file is not updated every
    time the file is accessed. This is not really surprising as it would mean that
    any time a program accesses the file, a new ObjectHeader would have to be written
    to NAND flash. This would result in a far greater number of writes to the NAND
    flash and would not only use precious battery power, but would also wear out the
    NAND flash with metadata updates most users do not really care about. This practice
    is also not terribly unusual as Microsoft, by default, disabled *atime* update
    in Microsoft Windows Vista and Windows 7.


    To be sure, this analysis is not trivial. It can provide valuable information
    and is a basis for forensic research on the YAFFS2 file system.


    # YAFFS2 File System Analysis


    Hex analysis of the YAFFS2 file system is quite time consuming, so let''s move
    on to techniques for analyzing the allocated files. Unfortunately, there are again
    challenges, as it can be quite difficult to mount a YAFFS2 nanddump after it is
    extracted from an Android device.'
  merge: -1
  pgno: 536
- img_proc: false
  md: 'For this reason, as highlighted in [Chapter 6](Chapter 6), if you have root
    access on an Android device, it is best to not only acquire the appropriate YAFFS2
    nanddump files, but to also logically copy important directories from the systems
    using adb pull, tar, or other method. That way, if you are unable to mount the
    YAFFS2 nanddump, you still have a logical copy of the files. The nanddump can
    then be used for timeline creation, other hex analysis, and file carving.


    However, it is possible to mount some YAFFS2 nanddumps in Linux and, over time,
    expect more nanddump files to successfully mount. For this section though, we
    will focus on a nanddump from a Motorola Droid as they can be successfully mounted
    in Linux with nandsim and the YAFFS2 kernel module.


    First, we need to load the appropriate kernel modules and create a 1 GB nandsim
    device.


    ```

    sudo modprobe mtd

    sudo modprobe mtdblock

    sudo insmod ~/yaffs2/yaffs2.ko

    sudo modprobe nandsim first_id_byte=0xec second_id_byte=0xd3 third_id_byte=0x51
    fourth_id_byte=0x95

    ```


    We now have a 1 GB nandsim device that is capable of housing the Droid''s "/data"
    partition. The next step is to use nandwrite to copy both the data and OOB to
    the simulated NAND flash.


    ```

    ahoog@ubuntu:~$ sudo nandwrite --autoplac --oob /dev/mtd0 droid_userdata.nanddump

    Writing data to block 0 at offset 0x0

    Writing data to block 1 at offset 0x20000

    Writing data to block 2 at offset 0x40000

    Writing data to block 3 at offset 0x60000

    Writing data to block 4 at offset 0x80000

    Writing data to block 5 at offset 0xa0000

    <snip>

    ```'
  merge: -1
  pgno: 537
- img_proc: false
  md: "The parameters instruct nandwrite to do the following:\n\n+   - sudo nandwrite—Nandwrite\
    \ requires root permission\n- --autoplaces—Use auto oob layout\n- --oob—Image\
    \ contains oob data\n- /dev/mtd0—The mtd device to write the nanddump to\n- droid_userdata.nanddump—The\
    \ name of the nanddump file\n\nIf everything went as expected, we should now be\
    \ able to mount the file system with the following commands:\n\n```\nahoog@ubuntu:~$\
    \ mkdir -p ~/mnt/yaffs2\nahoog@ubuntu:~$ sudo mount -t yaffs2 /dev/mtdblock0 ~/mnt/yaffs2\n\
    ```\n\nThere are two primary problems you can encounter during this process. First,\
    \ YAFFS2 and MTD may not successfully mount the file system and will display this\
    \ message:\n\n```\nahoog@ubuntu:~$ sudo mount -t yaffs2 /dev/mtdblock0 ~/mnt/yaffs2\n\
    mount: wrong fs type, bad option, bad superblock on /dev/mtdblock0,\n       missing\
    \ codepage or helper program, or other error\n       In some cases useful info\
    \ is found in syslog - try\n       dmesg | tail  or so\n```\n\nThere can be many\
    \ causes for this such as:\n\n+   - Differences between device's YAFFS2 and MTD\
