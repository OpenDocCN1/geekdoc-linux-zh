  md: '# Logical techniques


    As discussed at the start of this chapter, logical forensic techniques extract
    data that is allocated. This is typically achieved by accessing the file system.
    Logical techniques are often the first type of examination a forensic analyst
    will run because they are not only easier to execute but often provide sufficient
    data for the case. Android forensics physical techniques can provide far more
    data. However, they are more difficult to successfully execute and take considerably
    more effort to analyze.


    Logical techniques also have the advantage of working in far more scenarios as
    the only requirement is that USB debugging is enabled. In other words, Android
    forensics logical techniques do not require root access.


    In this section, we first cover techniques that are freely available (although
    AFLogical is only free for active law enforcement and government agencies) followed
    by a review of available commercial software.


    # ADB Pull


    In Chapter 4, the recursive adb pull command was demonstrated several times as
    various parts of the file system were copied to the Ubuntu workstation for further
    analysis. Unless an Android device has root access or is running a custom ROM,
    the adb daemon running on the device that proxies the recursive copy only runs
    with shell permissions. As such, some of the more forensically relevant files
    are not accessible. However, there are still files which can be accessed.'
  merge: -1
  pgno: 355
- img_proc: false
  md: 'If you attempt to access files that the shell user does not have permissions
    to, it simply does not copy the files:


    ```

    ahoog@ubuntu:~$ adb pull /data adbpull

    pull: building file list...

    0 files pulled. 0 files skipped.

    ```


    However, if you have sufficient privileges (root in the next example), then this
    method is very simple and effective:


    ```

    ahoog@ubuntu:~$ adb pull /data adbpull/

    pull: building file list...

    <snip>

    pull: /data/miscrild_nitz_long_name_31026 -> data/misc/rild_nitz_long_name_31026

    pull: /data/misc/akmd_set.txt -> data/misc/akmd_set.txt


    712 files pulled. 0 files skipped.

    963 KB/s (208943249 bytes in 211.671s)

    ```


    As you can see from the output above, the entire "/data" partition was copied
    to a local directory in just over three and a half minutes. The directory structure
    is maintained during the copy so you can then simply browse or otherwise analyze
    the files of interest from the workstation.


    As most phones will not have root access (at least by default), this technique
    may appear to be of little value. However, it is a powerful utility to understand
    and there are several scenarios ideal for this approach. These scenarios include:


    +   - On nonrooted devices, an adb pull can still access useful files such as
    unencrypted apps, most of the tmpfs file systems that can'
  merge: -1
  pgno: 356
- img_proc: false
  md: 'include user data such as browser history, and system information found in
    "/proc," "/sys," and other readable directories.


    +   - On rooted devices, a pull of nearly all directories is quite simple and
    certain files and directories from "/data" would be of interest.

    - When utilizing the physical technique, it is not always possible to mount some
    acquired file systems such as YAFFS2. If adbd is running with root permissions,
    you can quickly extract a logical copy of the file system with adb pull.


    As adb is not only a free utility in the Android SDK but also very versatile,
    it should be one of the primary logical tools used on a device.


    > **Warning**


    **adb Pull issues**


    Some recursive pulls using adb can fail in the middle of the data transfer due
    to permission or other issues. You should closely monitor the results of the command
    to determine if any issues were encountered. Breaking the recursive pull of large
    directories into smaller data pulls may yield better results.


    # Backup Analysis


    When Android was first released, it did not provide a mechanism for users to backup
    their personal data. As a result, a number of backup applications were developed
    and distributed on the Android Market. For users running custom ROMs, there was
    an even more powerful backup utility developed called nandroid.'
  merge: -1
  pgno: 357
- img_proc: false
  md: 'Many of the backup utilities have a "Save to SD Card" option (which users found
    extremely convenient) as well as several options to save to "the cloud." Either
    way, users could take a backup of their devices, and if needed they could restore
    required data. This is not only a great way for users to protect themselves from
    data loss, but it can be a great source of information for forensic analysts.


    One of the more popular backup apps is RerWare''s My Backup Pro which can take
    a backup of device data using Content Provider and even the entire "/data/data"
    files if the device has root access. The user can choose between saving to the
    SD card and saving to RerWare''s server. The app supports (RerWare, LLC, n.d.)
    the following:


    +   - Application install files (if phone has root access, this includes APK +
    Data and Market Links)

    - Contacts

    - Call log

    - Browser bookmarks

    - SMS (text messages)

    - MMS (attachments in messages)

    - System settings

    - Home screens (including HTC Sense UI)

    - Alarms

    - Dictionary

    - Calendars

    - Music playlists

    - Integrated third-party applications'
  merge: -1
  pgno: 358
- img_proc: false
  md: 'The last bullet, "integrated third-party applications," refers to companies
    who provide RerWare hooks for data backup. At least initially, RerWare would pay
    developers to include RerWare backup support in their apps.


    Interestingly, the app runs not only on Android but also on Windows Mobile, Blackberry,
    and soon Symbian OS. The user can take a backup on one platform and restore on
    a completely different supported OS. RerWare saves a single SQLite file to the
    SD card when the device backup is stored locally.


    In the more recent releases of Android, a new backup API is now available. Developers
    can simply integrate these APIs into their apps and the rest of the backup is
    handled by Android and Google. This provides the users with secure, cloud-based
    backups with consistency across apps, and will likely become the de facto standard.
    Unfortunately, current research has not yet discovered useful artifacts from the
    new backup APIs left on an Android device.


    Regardless of the backup app, forensic analysts should determine if one was installed
    and, if so, where the backup data is stored. The SD card should be examined as
    well as other devices such as a computer or laptop. The data saved in a backup
    is obviously of significant value in an examination.


    # AFLogical


    AFLogical is an Android forensics logical technique which is distributed free
    to law enforcement and government agencies. The app, developed by viaForensics,
    extracts data using Content Providers, which are a key feature of the Android
    platform. This is'
  merge: -1
  pgno: 359
- img_proc: false
  md: 'the same technique that commercial forensics tools use for logical forensics.


    Recall that Android''s security model is effective in limiting access to app data
    except in a few circumstances. Here is a quick recap of the key components of
    Android''s security model:


    +   - Each application is assigned a unique Linux user and group id.

    - Apps execute using their specific user ID in a dedicated process and Dalvik
    VM.

    - Each app has dedicated storage, generally in "/data/data," that only the app
    can access.


    However, the Android framework does provide a mechanism by which apps can share
    data. An app developer can include support for Content Providers within their
    application, which allows them to share data with other apps. The developer controls
    what data is exposed to other apps. During the install of an app, the user controls
    whether or not an app should gain access to the requested Content Providers.


    Some examples of Content Providers are:


    +   - SMS/MMS

    - Contacts

    - Calendar

    - Facebook

    - Gmail


    And there are many more.'
  merge: -1
  pgno: 360
- img_proc: false
