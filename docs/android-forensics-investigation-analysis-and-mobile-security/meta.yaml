    # ## Application Statistics


    The Android Market is growing quickly. Six months after its release, T-Mobile’s
    Chief Technology Officer, Cole Brodman, commented that users needed more filters
    to successfully locate apps from the nearly 2300 apps on the Market (Lawson, n.d.).
    By January 2011, over 200,000 apps were on the Market with 27,227 added in November
    2010 alone (Android Market statistics, n.d.). Estimates place the number of downloaded
    apps at over 2.5 billion.


    Obviously, apps are a key area of focus for both security and forensics. In Chapter
    4, we will explore in great detail how apps persist data to an Android device,
    what types of information are stored, and how data can be recovered and analyzed.


    # ## Android forensics'
