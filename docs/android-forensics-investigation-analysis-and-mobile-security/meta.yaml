    # Zygote and Dalvik


    In Chapter 3, we will cover the specifics of the individual virtual machine each
    user application is provided as a runtime sandbox. The Dalvik virtual machine
    is the technology Google selected to create this application sandbox. At startup,
    the Zygote sequence essentially sets up the Java runtime environment and registers
    a socket with the system; hence, new applications that need to initialize can
    request a new Dalvik virtual machine. Without the Zygote service, the Android
    kernel could run. However, no applications would operate including built-in applications
    such as the phone, browser, and other core features as illustrated in Fig. 2.6.'
  merge: -1
  pgno: 110
- img_proc: false
