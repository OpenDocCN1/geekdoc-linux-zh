    # Introduction


    There is a delicate balance in being both a forensic analyst and a privacy advocate.
    If a device were 100% secured, then forensic investigation of the device would
    fail to return any information. On the other hand, if a device''s security measures
    were completely absent, forensic expertise would hardly be necessary to extract
    meaningful data from the device.


    The primary consumers of mobile forensics are law enforcement and government agencies.
    They use and secure many types of sensitive data on mobile devices, and they have
    the mandate and authority to investigate crimes. They rely not only on digital'
  merge: -1
  pgno: 252
- img_proc: false
  md: 'forensic analysis, but can also exercise their authority through search warrants
    and subpoenas and compel most organizations to produce needed information such
    as financial records, e-mail, Internet service provider logs, and more.


    Similarly, corporations need to protect their sensitive data, and at times launch
    internal investigations to ensure security. While their authority does not reach
    beyond their company, in the United States, corporations can exercise wide authority
    pertaining to searches on devices they own.


    Finally, individuals have the right to access their own data. Whether they exercise
    this in the pursuit of civil litigation or for other matters, they have the authority
    to do so on devices they own.


    In the cases of individuals and corporations, the parties generally have no need
    to recover sensitive information such as credit cards, banking information, or
    passwords on the device they have authority to investigate. Corporations would
    not seek an individual''s credit card data in an internal investigation, and they
    have the means to access corporate e-mail systems and change passwords. In the
    case of individuals, they already have access to their own financial records,
    e-mail, and other such sensitive data. In the case of law enforcement and government
    agencies, they can use their subpoena and search warrant powers to acquire the
    data they seek.


    So, in the end, the only people likely to benefit from highly sensitive data being
    stored insecurely on mobile devices are cyber criminals. In the course of many
    individual, corporate, and criminal investigations of mobile devices, we have
    encountered highly sensitive personal information that was not central to the
    case. However, if cyber criminals had access to that device—whether in'
  merge: -1
  pgno: 253
- img_proc: false
  md: 'their physical possession or through remote exploits—the data they could gather
    would represent a significant risk to the consumer.

    Likewise, corporations are targets for commercial espionage, financial theft,
    intellectual property theft, and a wide variety of other attacks. As many corporations
    move to employee-owned devices, even more control and oversight of the device
    is lost, placing corporate data at great risk.

    And finally, law enforcement and government agencies are negatively affected by
    mobile security issues. The agencies are comprised of individuals who share the
    same risk of data exposure as consumers. Like corporations, the agencies themselves
    may be the target of attacks, which seek not only sensitive data that could jeopardize
    investigations or embarrass the agency but also attacks with motives as serious
    as international espionage. And a challenge unique to law enforcement and government
    agencies is that many, many crimes involving mobile devices must be investigated,
    straining already overloaded criminal investigation units and digital forensic
    laboratories.

    For these reasons, mobile device security is a rising concern for individuals,
    corporations, and law enforcement and government agencies.


