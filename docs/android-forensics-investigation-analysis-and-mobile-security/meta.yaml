  md: '# Chapter 6

    Android forensic techniques


    # Information in this chapter


    +   - Procedures for handling an Android device

    - Imaging Android USB mass storage devices

    - Logical techniques

    - Physical techniques


    # Introduction


    Before we dive into the actual Android forensic techniques, there are a number
    of considerations that influence which technique forensic analysts should use.
    In this section, we will discuss the different types of investigations, the differences
    between logical and physical techniques, and how to limit or avoid modifications
    to the device.


    # Types of Investigations


    There are a variety of situations that might benefit from the results of an Android
    forensic investigation. While the application of forensics is a commonality in
    all the situations, each one may require different procedures, documentation,
    and overall focus.'
  merge: -1
  pgno: 314
- img_proc: false
  md: 'The first situation that people think of in general is investigations that
    will likely be adjudicated in a criminal or civil court of law. In these situations,
    there are a number of important considerations:


    +   - Chain of custody

    - Detailed contemporaneous notes and final reporting

    - Possible validation of results using different tools or investigators

    - Fact or opinion based testimony


    Another common scenario is internal investigations in corporations. These investigations
    may end up litigated in court, but often they are used to determine the root cause
    of an issue (whether that is a system, external attack, or internal employee)
    and may result in disciplinary action against an employee. Internal corporate
    investigations can cover many areas but the most common include:


    +   - Intellectual property or data theft

    - Inappropriate use of company resources

    - Attempted or successful attack against computer systems

    - Employment-related investigations including discrimination, sexual harassment,
    etc.

    - Security audit (random or targeted)


    There is also a need for forensics in cases involving family matters. The most
    common cases involve:


    +   - Divorce

    - Child custody

    - Estate disputes'
  merge: -1
  pgno: 315
- img_proc: false
  md: 'One final area where forensic investigation can yield significant value is
    for the security and operation of a government. Governments are usually the largest
    employer in a country and the United States is a good example. According to the
    US Census Bureau, data from the 2009 Annual Survey of Public Employment and Payroll
    revealed that the Federal government across all functions had over 3 million employees,
    while state and local governments has 16.6 million full-time equivalent employees
    ([Government Employment & Payroll, n.d.](Government Employment & Payroll, n.d.)).


    Beyond employment-related matters, countries are also the potential target of
    attacks and foreign government intelligence gathering. Forensics can play a key
    role in thwarting attacks against a country, investigating successful attacks,
    counter intelligence scenarios, and in providing valuable intelligence needed
    for the governing of the country.


    # Difference Between Logical and Physical Techniques


    Android forensic techniques are either logical or physical in nature. A logical
    technique extracts allocated data and is typically achieved by accessing the file
    system. Allocated data simply means that the data are not deleted and are accessible
    on the file system. One exception to this definition is that some files, such
    as an SQLite database, can be allocated and still contain deleted records in the
    database. While recovery of the deleted data requires special tools and techniques,
    it is possible to recover deleted data from a logical acquisition.


    Physical techniques, on the other hand, target the physical storage medium directly
    and do not rely on the file system itself to access'
  merge: -1
  pgno: 316
- img_proc: false
  md: 'the data. There are advantages to this approach; the most significant is that
    physical techniques likely provide access to significant amounts of deleted data.
    As discussed in [Chapter 4](Chapter 4), file systems often only mark data as deleted
    or obsolete, and do not actually erase the storage medium unless needed. As physical
    forensic techniques provide direct access to the storage medium, it is possible
    to recover both the allocated and the unallocated (deleted or obsolete) data.


    Of course, the analysis of an Android physical acquisition is generally far more
    difficult and time consuming. Also, the physical techniques are more difficult
    to execute and missteps could leave the device inaccessible.


    In Android forensics, the most common logical technique does not provide direct
    access to the file system and operates at a more abstract and less-effective level
    than the traditional logical techniques, which can acquire all nondeleted data
    directly from the file system. This technique, which relies on the Content Providers
    built into the Android platform and software development kit (SDK), is effective
    in producing some important forensic data, but only a fraction of the data that
    are available on the system.


    # Modification of the Target Device


    One of the guiding principles of any forensic investigation is to avoid modification
    of the target device in any manner. In many cases, this is achievable. For example,
    let''s assume you are handed a desktop computer that is not powered on. You are
    informed it was seized from a suspect and that you need to launch a forensic investigation.
    The device is fairly easy to investigate without'
  merge: -1
  pgno: 317
- img_proc: false
  md: 'material changes to the data after you take custody. A typical investigation
    would fully document the computer, remove the hard drive, and connect it to a
    physical write blocker and acquire a bit-by-bit forensically sound image of the
    hard drive. The investigation would then take place on copies of the forensic
    image and the original device would remain unchanged.


    As the power and functionality of computers has increased, this ideal situation
    has become more and more difficult to achieve. First, let''s assume you are called
    to the scene of an investigation and there is a desktop computer, but this time
    the computer is in operation. Any interaction with the computer, whether you simply
    move it or even physically unplug the device, will modify the device in some way.
    While many examiners advocate simply unplugging the computer, unplugging the computer
    still changes the computer as the contents of RAM, open network connections, and
    more (all of which can be quite valuable in an investigation) are permanently
    lost.


    If you instead decide to examine the device while it is running, all interactions
    change the device. To further complicate an investigation, it is possible that
    the computer is leveraging encryption and, while the device is running, that data
    may be accessible. However, if the device is powered off and you don''t have the
    encryption keys, then you may permanently lose the ability to recover that data.


    Another complicating factor can be the existence of servers that have special
    hardware, complex setups, or that simply cannot be powered down without significant
    impact to other systems or people. Some examples of complex service setups include'
  merge: -1
  pgno: 318
- img_proc: false
  md: 'complicated RAID setup, setups that rely on network-based storage area networks
    (SAN), and unsupported hardware. In such cases, the examiner must interact directly
    with the device while it is running even though those actions change the device.


    Of course, mobile devices, and Android devices in particular, are nearly impossible
    to forensically analyze without any impact to the device. Unlike desktops, notebooks,
    and servers, there are portions of storage on an Android device that cannot be
    easily removed. And if the device is powered on, a shutdown of the device or pulling
    the battery again changes the device.


    When mobile phones were first showing up in investigations, there was very little
    data stored in them that could be extracted from the device. Many investigations
    used traditional approaches, such as a search warrant on the wireless carrier
    to obtain call detail records. It was also possible to remove the subscriber identity
    module (SIM) card on GSM devices and extract some data. As phones began to store
    more data, there developed a deep divide between examiners who advocated the older
    methods (which had little impact on the device and subsequently retrieved only
    nominal data) and those who advocated exploiting the device more fully. The techniques
    used to exploit the devices did modify the device, leading to the ensuing debate.


    As of 2011, much of the debate has subsided because the amount of data mobile
    devices now hold necessitates the more intrusive techniques. The Association of
    Chief Police Officers in the United Kingdom produces guidelines that address this
    issue quite clearly. The guide, *Good Practice Guide for Computer-Based Electronic
    Evidence*'
  merge: -1
  pgno: 319
- img_proc: false
  md: '(ACPO Good Practice Guide, n.d.), establishes four principles of computer-based
    electronic evidence:


    +   1. No action taken by law enforcement agencies or their agents should change
    data held on a computer or storage media, which may subsequently be relied upon
    in court.

    2. In circumstances where a person finds it necessary to access original data
    held on a computer or on storage media, that person must be competent to do so
    and be able to give evidence explaining the relevance and the implications of
    their actions.

    3. An audit trail or other record of all processes applied to computer-based electronic
    evidence should be created and preserved. An independent third party should be
    able to examine those processes and achieve the same result.

    4. The person in charge of the investigation (the case officer) has overall responsibility
    for ensuring that the law and these principles are adhered to.


    As mobile devices clearly present a circumstance where it is necessary to access
    the original device directly, then it is permissible provided the examiner is
    sufficiently trained, provides valid reasons for their approach and keeps a clear
    audit trail so that their actions are repeatable by a third party. This is certainly
    good advice and helps provide a solid framework for the forensic investigation
    of mobile devices.


    # Procedures for handling an Android device'
  merge: -1
  pgno: 320
- img_proc: false
  md: 'One major challenge for forensic analysts is to devise a protocol for handling
    the device prior to the analyst taking direct custody. And this is certainly not
    a new issue for analysts as others involved in the investigation may also handle
    other digital devices such as computers or laptops. However, mobile devices are
    still relatively new and are often not handled properly by first responders. There
    is a tendency to immediately examine the device, which almost inevitably results
    in data modification and potential loss of access to the device.


    # Securing the Device


    Many agencies and first responders have established a protocol for securing evidence.
    The following sections are meant to complement the existing procedures, not replace
    them. Of course, these represent special procedures, and educating first responders
    who have many other responsibilities can be quite challenging.


    # Pass Code Procedures


    Pass code locked devices are becoming more common as a result of heightened security
    awareness in consumers and corporations. In the next section, we cover some specific
    techniques to circumvent pass codes. However, it is not always possible. The first
    consideration when obtaining information from a device is whether an opportunity
    exists to immediately disable or otherwise circumvent the pass code.


    If you encounter an Android device and the screen is active, strong consideration
    should be given to checking and potentially changing its settings. For devices
    that have pass codes, there is a'
  merge: -1
  pgno: 321
- img_proc: false
  md: 'short period of time (from less than a minute up to about 15 min) where full
    access to the device is possible without re-entering the pass code. If a device
    is in this state, there are several steps to consider:


    +   1. Increase the screen timeout to prevent or postpone the screen locking.
    The location for this setting is not consistent between Android versions and devices.
    For example, on a G1 running Android 1.5, the timeout can be set by pressing Menu
    (from the home screen), then Settings, Sound & display, Screen timeout, and then
    select "Never timeout." On an HTC Incredible running Android 2.2, press Menu (from
    the home screen), then Settings, Security, Lock phone after, and then finally
    "15 minutes." As long as the device has some nominal activity in the allotted
    timeout setting, it will remain accessible.


    2. Enable USB debugging and "Stay awake" settings. The location for this setting
    has remained consistent in devices and can be accessed by pressing Menu (from
    the home screen), then Settings, Applications and Development. From there, you
    can check USB debugging and Stay awake. If you select the "Stay awake" setting
    and then connect it to a charge, the device will never go to sleep, which is effective
    in preventing the screen lock. By enabling USB debugging, the device can be accessed
    over USB enabling data extraction.


    Of course, these steps are making changes to the device and should be thoroughly
    logged in the case notes describing the state of the device, the rationale for
    the attempted changes, and the outcome of each change. This will not only assist
    in future report'
  merge: -1
  pgno: 322
- img_proc: false
  md: 'writing but will likely be an important factor if your decision to change the
    device is challenged in court.


    To make matters more difficult, it is also important to minimize touching the
    screen in case the screen lock becomes active. As we will discuss shortly, it
    is sometimes possible to determine the pattern lock of a device by enhancing photographs
    of the device''s screen. The lesser the interaction a first responder has with
    the screen, the higher the success rate of this technique.


    # Network Isolation


    As many examiners likely know, it is important to isolate the device from the
    network as soon as possible. In the worst-case scenario, a remote wipe could be
    initiated on the device which, if successful, would prevent the recovery of any
    data. While most remote wipes are done over the data network, some can be triggered
    over SMS, and hence ensure the device is fully isolated to prevent remote wipes.
    In other circumstances, additional messages on the device could be received or
    even removed by triggers outside your control. As the goal of a forensic image
    is to preserve the state of the device for additional analysis, any changes should
    be avoided.


    There are a number of ways to isolate a device from the network and each of these
    methods have advantages and disadvantages. Table 6.1 summarizes the advantages
    and disadvantages of each technique.


    Table 6.1 Techniques for Device Isolation

    | Technique | Advantages | Disadvantages |'
  merge: -1
  pgno: 323
- img_proc: false
  md: '| Technique | Advantages | Disadvantages |

    |---|---|---|

    | Put the device in Airplane mode. This requires that you have full access to
    the Settings menu. | The device continues running and temporal data remains intact.
    Disables cellular data network as well as Wi-Fi.com. | You are modifying the device
    setting further. Only works if you have full access to the device. |

    | If the phone is a GSM phone, remove the SIM card. | Easy to remove, effective
    in disabling all cellular voice, SMS, and data transmissions. | Does not disable
    Wi-Fi.com or other networks. Does not work on non-GSM phones including CDMA and
    iDEN phones. |'
  merge: -1
  pgno: 324
- img_proc: false
  md: '| Technique | Advantages | Disadvantages |

    | :--- | :--- | :--- |

    | Suspend account with wireless carrier. | Effective in disabling all cellular
    voice, SMS, and data transmissions for any phone. | Process may take some time
    and require a court order. Does not disable Wi-Fi.com or other networks. |

    | Place device in a shielded bag, box, tent, or room. | Faraday shields prevent
    various types of network transmissions and can be an effective approach if you
    cannot utilize any of the previous options. | There is some debate about the effectiveness
    of portable Faraday shields, notably Faraday bags. Also, while the transmissions
    are blocked, the device attempts to contact the cellular network repeatedly thus
    draining the battery quickly. Cords cannot be inserted into the enclosure as they
    will transmit signals. A shielded room dedicated for mobile examinations is ideal.
    However, they are quite expensive to build and maintain. |'
  merge: -1
  pgno: 325
- img_proc: false
  md: '| Technique | Advantages | Disadvantages |

    |---|---|---|

    | Turn the device off. | Completely effective in preventing all network transmissions.
    | The device state is modified and temporal data is lost. Pass code on reboot
    could be enabled, thus restricting access to the device. |


    As you can tell, isolating an Android device from the network is not an easy task
    and each option has advantages and disadvantages. While each examiner or their
    organization should determine the appropriate steps to undertake, the best option
    is probably placing the device in Airplane mode. This varies slightly between
    Android devices and versions but the general approach is the same:


    +   1. Press and hold the Power off button and select Airplane mode.

    2. Press Menu (from the home screen), then Settings, then the Wireless option
    which is generally near the top. Some examples are "Wireless controls" or "Wireless
    and networks." The next menu should present the Airplane mode option.


    *Fig. 6.1* is a screenshot from the Power off button approach. *Fig. 6.2* shows
    the option via the Wireless settings.'
  merge: -1
  pgno: 326
- img_proc: false
  md: '![](bbox=[0.389, 0.094, 0.61, 0.384])


    FIGURE 6.1 Airplane mode via the Power off button.


    ![](bbox=[0.389, 0.479, 0.61, 0.769])


    FIGURE 6.2 Airplane mode via the Wireless and networks settings.'
  merge: -1
  pgno: 327
- img_proc: false
  md: 'Regardless of which technique you ultimately choose, the main goal should be
    to isolate the device from the network as soon as possible.


    # Power and Data Cables


    While most forensic labs will have the cables necessary to charge and connect
    the device, it is always prudent to seize the cables directly from the scene.
    It’s possible that a newer device is in use and the forensic toolkits do not yet
    have an appropriate cable. For example, a new specification for connecting media
    devices was developed called portable digital media interface (PDMI) and is integrated
    into two Android tablet devices, the Dell Streak and the Samsung Galaxy Tab. The
    PDMI interface provides not only power and high-resolution video output, but also
    offers USB 3.0 support. Whereas the actual examination of one of these devices
    could be delayed while an appropriate cable is acquired, if it needed charging
    and you do not have the appropriate cable, the loss of power will result in the
    loss of temporal data.


    # Powered-off Devices


    If a device is already powered off when you encounter it, the best option is to
    boot it into recovery mode to test for connectivity and root access. The owner
    may have already enabled USB debugging or have rooted the device, so you may have
    access to the data without booting into normal operational mode.


    This approach is similar to performing forensics on a standard computer hard drive.
    The last thing any trained forensic analyst would do is boot the computer to determine
    what operating system'
  merge: -1
  pgno: 328
- img_proc: false
  md: 'is installed. Instead, the hard drive is removed and connected to a write blocker
    for imaging to prevent any changes to the evidence. Similarly, if a mobile device
    does not have to boot into normal mode, there is no need to do so as this may
    make changes to the device. Specific information on how to test a device in recovery
    mode for sufficient privileges is discussed later in this chapter.


    # How to Circumvent the Pass Code


    The ability to circumvent the pass code on an Android device is becoming more
    important as they are utilized frequently and, in most cases, do not allow data
    extraction. While there is no guaranteed method, there are a number of techniques
    which have worked in certain situations.


    As previously discussed, there are three types of pass codes Android devices currently
    support. The first is a pattern lock. This was the default on the initial Android
    devices. To access the device, the user draws a pattern on the locked phone and,
    if drawn properly, the device is unlocked. An example of a pattern lock on an
    HTC Incredible is shown in [Fig. 6.3](Fig. 6.3).'
  merge: -1
  pgno: 329
- img_proc: false
  md: '![](bbox=[0.39, 0.08, 0.61, 0.37])


    **FIGURE 6.3** Android pattern lock.


    The second type of pass code is the simple personal identification number (PIN)
    which is commonly found on other mobile devices. [Fig. 6.4](fig.6.4) is an example
    of a PIN-enabled HTC Incredible.'
  merge: -1
  pgno: 330
- img_proc: false
  md: '![](bbox=[0.388, 0.087, 0.611, 0.375])


    **FIGURE 6.4** Android PIN lock.


    The final type of pass code currently found on Android devices is a full, alphanumeric
    code, as shown in Fig. 6.5.


    ![](bbox=[0.388, 0.538, 0.611, 0.825])


    **FIGURE 6.5** Android alphanumeric lock.'
  merge: -1
  pgno: 331
- img_proc: false
  md: 'As discussed in Chapter 4, not all pass codes were created equal. The most
    effective pass code is one that allows or requires an alphanumeric password, as
    these are far more difficult to circumvent.


    # Utilize ADB if USB Debugging is Enabled


    The first technique you should attempt, provided the phone is powered on, is to
    connect with the Android Debug Bridge (ADB) over USB, which was covered extensively
    in Chapter 3. Whereas only a fraction of Android devices will allow an ADB connection
    through the USB debugging setting, it is certainly worth trying as it easily provides
    sufficient access for data extraction. The most common reasons for which users
    enable USB debugging include:


    +   - App development and testing

    - Certain apps require this setting, such as PDAnet, which allows the device to
    provide Internet access to a tethered device over USB

    - Custom ROMs

    - Developer phones such as Google’s Android developer phone (ADP1)

    - Device hacking


    It is quite simple to determine if USB debugging is enabled, provided you are
    using the Ubuntu virtual machine (VM) or have a forensic workstation with a properly
    installed and configured Software Development Kit. With the phone running in normal
    mode, plug it into the Ubuntu VM. From the command prompt type “adb devices.”
    If USB debugging is enabled, the ADB daemon will return'
  merge: -1
  pgno: 332
- img_proc: false
  md: 'the device serial number along with the mode that the phone is presently in.


    ```

    ahoog@ubuntu:~$ adb devices

    List of devices attached

    HT08XHJ00657    device

    ```


    If it is disabled, it will not return anything when the "adb devices" command
    is entered.


    ```

    ahoog@ubuntu:~$ adb devices

    List of devices attached


    ahoog@ubuntu:~$

    ```


    Remember to pass the device through to your VM if you are running the command
    inside a virtual workstation. If the VM can''t see the device, you will get the
    same result as if the USB debugging were not enabled. Once you verify that the
    USB connection is passed through to the Ubuntu VM, you can execute the lsusb command
    to verify that the operating system is aware of the connection:'
