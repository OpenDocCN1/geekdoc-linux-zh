    that a correct implementation and thorough security testing of the system be undertaken.


    # Summary


    Android devices can be both a target of malicious attacks and a tool used to carry
    out such attacks. Personal users as well as corporations must be aware of the
    risks and should take certain measures to protect against malicious misuse. Application
    developers must also increase their attention on security concerns and take responsibility
    for protecting user data. Implementing basic security measures discussed in this
    chapter, though not providing full protection, can at least serve as a deterrent
    against most attacks.


