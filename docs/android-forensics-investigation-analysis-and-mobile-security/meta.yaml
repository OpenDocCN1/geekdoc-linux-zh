    # Android Market


    The Android Market is an avenue for third-party developers to release their applications
    to anyone who owns an Android device. The Android Market was first announced on
    August 28, 2008 on the Google Developer blog as “an open content distribution
    system that will help end users find, purchase, download and install various types
    of content on their Android-powered devices” (Android developers blog, n.d.).
    When the market was first released in October 2008, it did not support paid apps.
    However, by early 2009 the Android Market supported paid applications in both
    the United States and United Kingdom. By January 2011, the Android Market supported
    paid apps in 29 countries (Supported locations, n.d.). Several other countries,
    most notably India, can use the Android Market but currently cannot install paid
    apps.


    Google’s light-handed approach to managing the Android Market is in stark contrast
    to Apple’s tight management of their App Store. While the Android Market does
    have Terms of Service for users (Android Market terms, n.d.) and an Android Market
    Developer Distribution Agreement (Android Market developer, n.d.) for developers,
    apps are released to the market without an approval process. Instead, Google believes
    that the app ratings will weed out apps that are buggy or show little merit.


    To release an app into the Android Market, developers must be registered, pay
    a $25 fee, and sign their app with a private key which will uniquely identify
    them to the market. When a user'
  merge: -1
  pgno: 76
- img_proc: false
  md: 'purchases an app, the developer receives 70% of the purchase price with the
