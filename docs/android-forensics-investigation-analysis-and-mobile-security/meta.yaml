    # Smudge Attack


    Initially, Android devices used the pattern lock for pass code protection instead
    of a numeric or alphanumeric code. A recent paper entitled “Smudge Attacks on
    Smartphone Touch Screens” by the University of Pennsylvania Department of Computer
    and Information Science demonstrated a technique for accessing pattern locked
    Android devices by enhancing photographs of the screen ([Aviv, Gibson, Mossop,
    Blaze, Smith, n.d.](Aviv,%20Gibson,%20Mossop,%20Blaze,%20Smith,%20n.d.)). The
    paper’s summary states:


    Our photographic experiments suggest that a clean touch screen surface is primarily,
    but not entirely, reflective, while a smudge is primarily, but not entirely, diffuse.
    We found that virtually any directional lighting source that is not positioned
    exactly at a complementary angle to the camera will render a recoverable image
    of the smudge. Very little photo adjustment is required to view the pattern, but
    images generally rendered best when the photo capture was overexposed by two to
    three f-stops (4 to 8 times “correct” exposure).


    If care was taken by the first responders to minimize contact with the device’s
    screen, this recovery technique may be viable. As an example of what is possible,
    Fig. 6.6 shows photos of the same Android device displayed side by side. The same
    original photo was'
  merge: -1
  pgno: 335
- img_proc: false
  md: 'used for both images but the image on the right was enhanced as part of the
    smudge attack process to highlight the contact points.


    ![](bbox=[0.29, 0.1, 0.71, 0.43])


    **FIGURE 6.6** Enhanced photo showing smudge attack.


    # Recovery Mode


    Some users install a custom ROM which usually enables root access to the device
    through a modified recovery mode. Most custom ROMs install a modified recovery
    partition which simplifies the process used to install the custom ROM. There are
    several popular recovery partitions that are primarily used with custom ROMs and
    both offer shell access with root privileges from within the recovery console
    itself. As the phone is not booted into normal mode, the pass code is circumvented
    and the user data partitions can be mounted read-only, thus preventing changes
    to that area.


    Forensic analysts should attempt to boot into recovery mode if the device is powered
    off, when they take custody. If, instead, the device is running and a pass code
    is present, you should first'
  merge: -1
  pgno: 336
- img_proc: false
  md: 'attempt to connect via ADB and consider smudge attack. If neither of these
    is successful, you should then try to reboot into recovery mode. Like many other
    techniques, recovery mode is accessed in different ways depending on the device
    manufacturer and model. Table 6.2 covers the key combinations to access recovery
    mode on the phones referenced throughout this book. Each assumes the device is
    powered off already.


    Table 6.2 Key Combinations to Boot into Recovery Mode


    | Device | Key Combination |

    | :--- | :--- |

    | HTC G1 | Hold home button and press power button. Use volume down to select
    RECOVERY and press power key. |

    | Nexus One | Hold volume down and press power button. |

    | Motorola Droid | Hold X key and press power button. |

    | HTC Incredible | Hold volume down and press power button. Use volume down to
    select RECOVERY and press power key. |


    Once in recovery mode, you can connect the device to your Ubuntu workstation and
    attempt to connect using ADB. If the device is running a nonmodified recovery
    mode, the connection will fail. The screen generally shows a triangle with an
    exclamation point inside it and often a small Android device next to it. On other
    devices, you will be presented with the somewhat famous three'
  merge: -1
  pgno: 337
- img_proc: false
  md: 'Androids on a skateboard. Finally, other recovery modules clearly show they
    are in modified recovery code and provide a wide range of device options.


    # Flash a New Recovery Partition


    There are a number of protocols, utilities, and devices that allow a skilled examiner
    to flash the recovery partition of a device with a modified image.


    The first available protocol supporting this approach was fastboot. Fastboot is
    a NAND flash update protocol executed over USB while in bootloader mode. Most
    devices ship with bootloader protection enabled, which prohibits the use of this
    protocol. However, it is possible that the protection has been disabled. To determine
    if bootloader protection is enabled, you must access the bootloader and look at
    the signature information, which will indicate S-ON or S-OFF. The S represents
    security, and so S-ON, the default production build, has security enabled; S-OFF
    indicates security is not enabled. Some devices ship with S-OFF, such as the Google
    Nexus One, as it is preloaded with Google’s Engineering SPL/Bootloader. Other
    rooting techniques also disable this protection, so checking this on a pass code
    protected device may yield results. You can access the main bootloader using the
    first part of the key combinations in Table 6.2 in the previous section.


    Fastboot does not require USB debugging to access the device. Hence, like recovery
    mode, it can be used to gain access to the device’s data. Once the new recovery
    partition is available, the device should be rebooted into recovery mode and forensic
    imaging can take place.'
  merge: -1
  pgno: 338
- img_proc: false
  md: 'Other techniques exist which allow the recovery partition to be flashed with
    a new image. Some examples include:


    +   - Motorola’s RSD Lite

    - sbf_flash

    - Samsung’s Odin Multiloader


    While these utilities and protocols may ultimately provide the privileges that
    a forensic analyst requires, there is considerable effort required to not only
    locate and test the techniques but to understand them sufficiently to use them
    in a forensic investigation.


    # Screen Lock Bypass App


    Security researcher Thomas Cannon recently developed a technique that allows a
    screen lock bypass by installing an app through the new web-based Android Market
    (Cannon, T., n.d.). Cannon’s technique utilizes a new feature in the web-based
    Android Market that allows apps to be installed directly from the web site. As
    such, you must have access to the Android Market using the primary Gmail user
    name and password for the device, which may be accessible from the primary computer
    of the user. Alternatively, you could access the Android Market if you knew the
    user name and password and had sufficient authority. Changing the user’s Gmail
    password would not work in this instance.


    Cannon explains the technique on this web site as in the following section (Cannon,
    T., n.d.).


    # How it Works'
  merge: -1
  pgno: 339
- img_proc: false
  md: 'The procedure is quite simple really. Android sends out a number of broadcast
    messages which an application can receive, such as SMS received or [Wi-Fi.com](https://Wi-Fi.com)
    disconnected. An application has to register its receiver to receive broadcast
    messages and this can be done at run time, or for some messages, at install time.
    When a relevant message comes in, it is sent to the application and if the application
    is not running it will be started automatically.


    After testing out various broadcast messages the best one I found for the purpose
    of this utility was android.intent.action.PACKAGE_ADDED. This exists in all APIs
    as version 1 and is triggered when an application is installed. Hence, to get
    the application to execute remotely, we first deploy it from the Android Market,
    then deploy any other application that will cause the first one to launch.


    Once launched it is just a matter of calling the disableKeyguard() method in KeyguardManager.
    This is a legitimate API to enable applications to disable the screen lock when,
    say, an incoming phone call is detected. After finishing the call the app ought
    to enable the screen lock again, but we just keep it disabled.


    This technique is certainly worth consideration if you have proper access to the
    Android Market.


    # **Use Gmail User/Pass**


    On most Android phones, you can circumvent the pass code if you know the primary
    Gmail user name and password registered with the device. After a number of failed
    attempts (ten attempts on the G1), you will be presented with a screen that asks
    if you forgot your pass code. From there, you can enter the Gmail user name and'
  merge: -1
  pgno: 340
- img_proc: false
  md: 'password and you will then be prompted to reset the pass code. This technique
    does not require the phone to be online as it uses credential information cached
    on the phone.


    If you do not have the current Gmail user name and password, but have sufficient
    authority (i.e., court order) to reset the password, you could attempt to compel
    Google to reset the account password. You would then have to connect the Android
    device to the network and gain access. This issue presents many challenges, including
    the need to place the device online, putting it at risk for remote wipe in addition
    to making changes to the device. Reports on various law enforcement mailing lists
    indicate this technique does not always work.


    If this approach is attempted, additional research is warranted. In particular,
    it would be prudent to control the Internet connection the device uses, most likely
    a Wi-Fi.com access point. You could then limit the network access to only those
    which the Google server needed for authentication. In addition, a detailed network
    capture of test devices should be analyzed as well as the actual changes made
    to the device.


    # JTAG and Chip-off


    At this time, most Android devices do not encrypt the contents of the NAND flash,
    which makes directly accessing and decoding the memory chips a potential workaround
    if a pass code is enabled. There are two primary techniques, which provide direct
    access to the chips. Both are technically challenging. The two techniques are:


    +   - Joint test action group (JTAG)

    - Physical extraction (chip-off)'
  merge: -1
  pgno: 341
- img_proc: false
  md: 'Both techniques are not only technically challenging and require partial to
    full disassembly of the device, but they require substantial post-extraction analysis
    to reassemble the file system. For these reasons, JTAG and chip-off would likely
    be the very last choices to circumvent a locked device.


    With JTAG, you connect directly to the device’s CPU by soldering leads to certain
    JTAG pads on the printed circuit board (PCB). Then JTAG software can be used to
    perform a complete binary memory dump of the NAND flash, modify certain partitions
    to allow root access, or eliminate the pass code altogether.


    In the chip-off procedure, the NAND flash chips are physically extracted from
    the PCB using heat and air. The chip, usually a small ball grid array (BGA) package,
    then needs to have the BGA connections regenerated and inserted into special hardware
    that connects to the chip and reads the NAND flash.


    The advantages to these techniques are that they will work in any situation where
    the NAND flash is not encrypted. However, extensive research, development, testing,
    and practice are required to execute these techniques.


    # Imaging Android USB mass storage devices


    Every Android device to date has either an external Secure Digital (SD) card or
    an Embedded MultiMediaCard (eMMC) that provides the large storage space required
    by many users. These storage devices exist because the user’s app data, typically
    stored in /data/data, is isolated for security and privacy reasons. However, users
    want to copy songs, pictures, videos, or other files between'
  merge: -1
  pgno: 342
- img_proc: false
  md: 'their Android device and a computer, and these large capacity FAT file system
    partitions solve that issue. The sensitive user data remains protected, yet the
    larger and more portable files are accessible to the user.


    Initially, the approach to imaging the external storage was to simply remove it
    from the Android device and image using a USB write blocker. However, a number
    of challenges arose over time, including:


    +   - Moving to eMMC storage meant that the mass storage was no longer removable.

    - Apps can now run from the SD card and in this scenario, the .apk files are encrypted.
    If capturing an unencrypted copy of the app is critical to an investigation (for
    example, a case involving malware analysis or a Trojan horse defense), the SD
    card must remain in the Android device.

    - Newer devices are using RAM disks (tmpfs) more frequently to store user data
    that might be helpful in an investigation. Often, removing the SD card requires
    the device to be shut down and the battery removed, thus losing the ability to
    recover the temporal data.


    For these reasons, the recommended approach for imaging the USB Mass Storage (UMS)
    devices on Android no longer involves removing the SD card but instead imaging
    it via the UMS interface.


    # SD Card Versus eMMC


    An SD card and eMMC are not all that different. The primary difference, of course,
    is that the SD cards are portable, easily'
  merge: -1
  pgno: 343
- img_proc: false
  md: 'moving from one device to the next. They use NAND flash, are based on the MultiMediaCard
    (MMC) specification, and have embedded storage controllers, so that systems MTD
    is not needed for guest operating systems to read them.


    To date, Android devices accept microSD cards generally ranging from 2 GB up to
    16 GB. However, larger cards are possible. Depending on the Android device, the
    SD card may be easily accessed and removed from a running device. However, many
    require that the device is shut down so that the battery can be removed.


    For storage embedded on the device, several manufacturers have begun using eMMC,
    which consists of embedded storage with an MMC interface integrating directly
    onto the device’s PCB. This standard simplifies accessing NAND flash with the
    standardized eMMC protocol and is capable of supporting file systems that are
    not NAND flash aware. This does not necessarily mean the file systems preserve
    the life of the NAND flash at the same level and sophistication that a NAND flash-aware
    file system like YAFFS2 does. However, the general lifespan of Android devices
    is certainly decreasing and is likely not an issue for most users.


    # How to Forensically Image the SD Card/eMMC


    There are two primary methods to forensically acquire the SD card and eMMC without
    removing it from the device. The first method, covered here, exposes the UMS device
    interface to your forensic workstation and allows you to acquire the image with
    your forensic tool of choice. The second method does not expose the UMS to your
    forensic workstation and instead uses dd on the Android device.'
  merge: -1
  pgno: 344
- img_proc: false
  md: 'This requires adb port forwarding, which will be covered in the section on
    physical techniques later in this chapter.


    Even though our Ubuntu VM has dd built in, we are going to download, compile,
    and install an updated version of dd maintained by the Department of Defense''s
    Cyber Crime Center. The program, dc3dd, is a patched version of GNU dd and includes
    a number of features useful for computer forensics ([dc3dd, n.d.](dc3dd, n.d.)),
    such as:


    +   - Piecewise and overall hashing with multiple algorithms—Supports MD5, SHA-1,
    SHA-256, and SHA-512.

    - Progress meter with automatic input/output file-size probing.

    - Combined log for hashes and errors.

    - Error grouping—Produces one error message for identical sequential errors.

    - Verify mode—Able to hash output files and compare hashes to the acquisition
    hash.

    - Ability to split the output into chunks with numerical or alphabetic extensions.

    - Ability to write multiple output files simultaneously.


    The program is open source software licensed under the GNU Public license version
    3 (GPLv3) and is distributed online through SourceForge and was updated to version
    7.0 in August 2010 ([dc3dd, n.d.](dc3dd, n.d.)). At this point in the book, you
    should be fairly comfortable compiling programs and have all the tools needed,
    so here are the abbreviated steps.'
  merge: -1
  pgno: 345
- img_proc: false
  md: '```

    mkdir -p ~/src

    cd ~/src

    curl http://cdnetworks-us-2.dl.sourceforge.net/project/dc3dd/dc3dd/7.0.0/dc3dd-7.0.0.tar.gz

    > dc3dd-7.0.0.tar.gz

    tar xzf dc3dd-7.0.0.tar.gz

    cd dc3dd-7.0.0/

    ./configure

    make

    sudo make install

    ```


    At this point, you could proceed with imaging. However, typing out the entire
    dc3dd command each time is not only tedious but can result in typos that could
    cause irreparable damage. So create a shell script, which not only acquires the
    device but also records various system characteristics, date/time stamps, and
    creates log files, which can be helpful as you write your report at a later time.


    We will place the acquire script in /usr/local/bin so you can easily run the script
    from any directory as /usr/local/bin is in your execution path by default:


    ```

    ahoog@ubuntu:~$ sudo nano -w /usr/local/bin/acquire-disk.sh

