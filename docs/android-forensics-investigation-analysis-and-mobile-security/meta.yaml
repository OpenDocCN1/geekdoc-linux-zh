  md: 'As discussed in [Chapter 2](Chapter%202), Android devices have two primary
    types of memory, volatile (RAM) and nonvolatile (NAND flash) memory. Each provides
    a different insight into the device’s data.


    # RAM


    RAM is used by the system to load, execute, and manipulate key parts of the operating
    system, applications, or data, and is not saved on reboot. Like traditional computers,
    RAM can contain very important information which applications use to process data.
    Some examples include the following:


    +   - Passwords

    - Encryption keys

    - Usernames

    - App data

    - Data from system processes and services


    Recently, solutions for examining Android memory have emerged. One technique was
    documented by security researcher Thomas Cannon on his blog, which we will step
    through in detail ([Android reverse engineering, n.d.](Android%20reverse%20engineering,%20n.d.)).


    Android provides a mechanism for dumping an application’s memory to a file by
    sending the app a special signal (SIGUSR1). To send the signal, you need an app’s
    PID, which you can find with the ps command:'
