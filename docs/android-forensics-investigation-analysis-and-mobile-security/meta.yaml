    image format

    - ~/sd-emmc/viaforensics/af-book/sdcard2-113serialno/sdcard2-113serialno.dc3dd—Image
    file

    - > ~/sdcard.body—Redirects the command''s output to a file instead of displaying
    on the screen


    Often it is helpful to know how long a command takes (if nothing else, over time
    you learn when it''s best to go grab that coffee warmer). So, we preface fls with
    the time command, which will tell us how long the program took to run (real) and
    the various system time it took (user, sys). You can view the contents of the
    body file, but in a later step we will convert it to a more readable format. If
    you want to verify fls-returned results, you can always determine the total lines
    in the file:


    ```

    ahoog@ubuntu:~$ wc -l sdcard.body

    24399 sdcard.body

    ```


    So, we have just over 24,000 entries. Next, we need to mount the file system read-only
    and then we can run log2timeline against it. To mount the file system using the
    dd image, you use the mount command and a special device called the loopback device.
    The full command is as follows:


    ```

    ahoog@ubuntu:~$ mkdir -p ~/mnt/sdcard

    ahoog@ubuntu:~$ sudo mount -t vfat -o loop,ro,offset=66048 ~/sd-emmc/

    viaforensics/af-book/sdcard2-113serialno/sdcard2-113serialno.dc3dd ~/mnt/sdcard

    ```'
