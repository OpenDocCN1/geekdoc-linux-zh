    oob = yaffs2File.read(64)\n\nprint \"Processing...\"\nwhile data != \"\":\n  \
    \  ddFile.write(data)\n    chunks += 1\n    data = yaffs2File.read(2048)\n   \
    \ oob = yaffs2File.read(64)\n\nprint \"Complete.  Read %d chunks\" % chunks\n\
