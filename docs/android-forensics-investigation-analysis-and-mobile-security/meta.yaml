    # YAFFS2 forensic analysis


    As discussed in Chapter 4, YAFFS2 is an open source, log-structured file system
    developed specifically for NAND flash, including support for wear-leveling and
    error-correcting code algorithms. This is great news not only for the phone owners,
    as YAFFS2 works very well on Android, but also for forensic analysts since a significant
    amount of old (deleted or updated) data is recoverable. But the good news stops
    there. As YAFFS2 is a relatively new file system, at this time no commercial forensic
    software solution supports it.


    However, all is not lost. Using the power of Linux, the openness of YAFFS2, an
    effective acquisition strategy, and the techniques already discussed including
    file system analysis, file carving, strings, and hex analysis, a forensic examiner
    can extract significant amounts of relevant data from the file system.


    As we dive into the analysis of YAFFS2, it''s quite helpful to remember how it
    is structured. One important concept to recall is how the data are structured
    physically on the NAND flash via MTD. Generally, YAFFS2 and MTD organize the NAND
    flash into 128 KB blocks, which consist of 2048 KB chunks of data followed by
    64 bytes of Out-Of-Band (OOB) data (making the total size on the NAND flash 132
    KB), which is used to store disk and some file system metadata, as shown in Fig.
    7.10.'
  merge: -1
  pgno: 523
- img_proc: false
  md: '![](bbox=[0.27, 0.09, 0.72, 0.28])


    **FIGURE 7.10** Block (128 KB = 64 × 2k chunks + OOB).


    Of course, it is not required that the Android device structure the NAND flash
    and MTD this way and the best way to verify is to examine the contents of the
    “/proc/mtd” file, which contains configuration information. Here is the file again
    from the reference HTC Incredible.


