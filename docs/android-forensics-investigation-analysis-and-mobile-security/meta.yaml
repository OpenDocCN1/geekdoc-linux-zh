  md: '# Chapter 3

    Android software development kit and android debug bridge


    # Information in this chapter


    +   - Android platforms

    - Software development kit (SDK)

    - Android security model

    - Forensics and the SDK


    # Introduction


    The Android software development kit (SDK) provides not only the tools to create
    applications that run on the Android platform but it also provides documentation
    and utilities that can assist significantly in the forensic or security analysis
    of a device. While the Android hardware covered in Chapter 2 plays a major role
    in the capabilities of a device, the software harnesses these features to ultimately
    create the experience and functionality consumers seek. A thorough understanding
    of the Android SDK will provide many insights into the data and the device, as
    well as important utilities that we will leverage in investigations.


    # Android platforms


    Android was officially announced in November 2007 but has been under significant
    development since 2005. This, combined with the large and diverse hardware, which
    leverages Android, has created a diverse ecosystem adding significant complexity
    for the forensic analyst or security engineer.'
  merge: -1
  pgno: 124
- img_proc: false
