    You should be prepared to immediately boot the device into recovery mode as later
    versions of the Motorola Droid''s firmware implemented a routine that checks the
    hash signatures of the existing recovery partition against the stock recovery
    partition for that Android version. If there is a disparity, the system will rebuild
    the stock recovery partition during the boot process and thus overwrite the modified
    recovery image.


    Once the new SBF file has been flashed, and the device is running in the modified
    recovery mode, you will have root access and can proceed with the software-based
    physical technique.


    # fastboot


    Fastboot is another utility that flashes images to the NAND flash over USB. The
    source code for fastboot is contained in the AOSP and thus, the utility is built
    when you compile the AOSP code. Like sbf_flash, the boot loader must support fastboot,
    which not only'
  merge: -1
  pgno: 446
- img_proc: false
  md: 'requires a compatible boot loader but also one that has security turned off
    (S-OFF).


    Fastboot was first used on the Google Android developer phone (ADP), which was
    manufactured by HTC. As such, much of the documentation and references for fastboot
    refer to the ADP, and HTC has a helpful reference page for the utility ([HTC—Developer
    Center, n.d.](https://developer.htc.com)). This page contains not only various
    stock NAND flash image files for the ADP device but also directions on using fastboot
    and accessing the appropriate mode on the device ([HTC—Developer Center, n.d.](https://developer.htc.com)):


    To enter fastboot mode, power up the device (or reboot it) while holding down
    the BACK key. Hold the BACK key down until the boot loader screen is visible and
    displays “FASTBOOT.” The device is now in fastboot mode and is ready to receive
    fastboot commands. If you want to exit fastboot mode at this point, you can hold
    down the keys MENU＋SEND＋END (on the ADP, SEND is the “Call” key and END is the
    “End call” key).


    Note that the boot loader screen may vary across devices. For ADP devices, the
    boot loader screen shows an image of skateboarding robots. Other devices may show
    a different image or color pattern. In all cases, the boot loader screen shows
    the text “FASTBOOT” when in fastboot mode. The boot loader also shows the radio
    version.


    Once in fastboot mode, verify fastboot detects the device with the following command:


    ```

    ahoog@ubuntu:~$ ./fastboot devices

    HT08XHJ00657       fastboot

    ```'
  merge: -1
  pgno: 447
- img_proc: false
