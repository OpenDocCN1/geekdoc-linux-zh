- img_proc: false
  md: "The strings command on the Ubuntu workstation will extract, by default, ASCII\
    \ printable strings—at least four characters long—from any file, text or binary.\
    \ While this technique is not terribly elegant or sophisticated, it is quite effective\
    \ at quickly examining binary data to determine if information of interest might\
    \ be contained in the file.\n\nThere are several options that have a great impact\
    \ on what strings output. First, let's take a look at the synopsis section of\
    \ the command's man page (manual):\n\n```\nSTRINGS(1)                  GNU Development\
    \ Tools                  STRINGS(1)\n\nNAME\n       strings - print the strings\
    \ of printable characters in files.\n\nSYNOPSIS\n       strings [-afovV] [-min-len]\n\
    \               [-n min-len] [--bytes=min-len]\n               [-t radix] [--radix=radix]\n\
    \               [-e encoding] [--encoding=encoding]\n               [-] [--all]\
    \ [--print-file-name]\n               [-T bfdname] [--target=bfdname]\n      \
    \         [--help] [--version] file\n```\n\nThere are a few options you should\
    \ always consider using when executing strings. First, the \"—all\" option tells\
    \ strings to examine the entire file (on certain files, it only examines certain\
    \ portions of the file). Second, the \"--radix=\" option instructs strings to\
    \ print the offset within the file where the string was found. This is extremely\
    \ helpful when you combine strings and a hex editor to examine possible evidence\
    \ found in the file. The radix option can print the offset in octal (--radix=o),\
    \ hex (--radix=x), or decimal (--radix=d). For most hex editors, you should consider\
    \ hex or perhaps decimal offsets."
  merge: -1
  pgno: 476
- img_proc: false
  md: "The other extremely important option controls the character encoding of the\
    \ strings, which provides support for Unicode characters in both big-endian and\
    \ little-endian formats:\n\n```\n--encoding=encoding\n    Select the character\
    \ encoding of the strings that are to be found.\n    Possible values for encoding\
    \ are: s = single-7-bit-byte characters\n    (ASCII, ISO 8859, etc., default),\
    \ S = single-8-bit-byte characters,\n    b = 16-bit bigendian, l = 16-bit littleendian,\
    \ B = 32-bit\n    bigendian, L = 32-bit littleendian.  Useful for finding wide\n\
    \    character strings. (l and b apply to, for example, Unicode\n    UTF-16/CS-2\
    \ encodings).\n```\n\nThis is important because not only does Android natively\
    \ support Unicode but it also allows investigating a phone where the default language\
    \ requires Unicode. Following are a few examples from the previous dd image:\n\
    \n```\nahoog@ubuntu:~$ strings --all --radix=x htc-datadata.dd | less\n    880a\
    \ htcchirp.db\n    891d ^XMp4XM\n    900a unlinked\n    980a deleted\n    a00a\
