  md: 'table schema). If the person field is set, it links to the contact table to
    provide details on the person involved. In this case, no person was set, so SQLite
    does not record anything. Finally, we look at the next six bytes and we get 0x012AFC97C52C.
    When translated to decimal, the resulting number is 1284138059052. Finally, we
    can use a number of techniques to convert this time (Unix Epoch in milliseconds)
    to a more easily read date/time. One quick technique for this is to use the built-in
    date command. However, it only handles Unix Epoch in seconds, not milliseconds,
    so you can simply divide by 1000 (that is, omit the last three digits):


    ```

    ahog@ubuntu:~$ date -d @1284138059

    Fri Sep 10 12:00:59 CDT 2010

    ```


    The date command automatically displays the date in the current system time zone.
    Another quick way to convert the time is to use the web site designed to convert
    Unix Epoch time at http://www.epochconverter.com/ that handles both Unix Epoch
    in seconds and milliseconds ([Epoch Converter, n.d.](http://www.epochconverter.com/)).
    To convert, copy the entire time stamp (not necessary to divide by 1000) into
    the web site text box and click "Timestamp to Human date" as in Fig. 7.2.'
