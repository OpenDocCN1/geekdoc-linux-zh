    | :---: | :---: | :---: | :---: | :---: | :--- |

    | 0 | 0 | 500 | 0 | Shrink/delete | Obsoleted ObjectHeader. Originally for blank
    file, length of 0 |

    | 0 | 1 | 500 | 1 | Shrink/delete | Obsoleted first chunk of data |

    | 0 | 2 | 500 | 2 | Live | Second chunk of data |

    | 0 | 3 | 500 | 3 | Live | Third chunk of data |

    | 1 | 0 | 500 | 0 | Shrink/delete | Obsoleted ObjectHeader, file length 3 |

    | 1 | 1 | 500 | 1 | Live | New first chunk of data |

    | 1 | 2 | 500 | 2 | Live | New ObjectHeader, file length 3 |


    Again, since we cannot simply change the original first chunk of data in the file,
    a new data chunk is written to the NAND flash and the previous data chunk is obsolete.
    This is achieved as yet another new ObjectHeader is written to the NAND flash,
    which points to the new first chunk of data for the file. Next, we are going to
    truncate the file to a zero length file and the resulting NAND flash changes are
    shown in Table 4.10.


    Table 4.10 Truncate File and Write New ObjectHeader'
