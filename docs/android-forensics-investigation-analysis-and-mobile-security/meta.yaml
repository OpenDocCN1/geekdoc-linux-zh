    reader) reveals the following:


    ```

    ahoog@ubuntu:~$ strings --all --radix=x --encoding=l htc-datadata.dd | less

    18451a8 rgc:0:lat41.8786

    18451d2 rgc:0:lon-87.6359

    18451fc rgc:1:last1288470018632

