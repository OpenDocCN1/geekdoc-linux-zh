    # # ROM and boot loaders


    Android devices, like any other computer, have a fairly standard boot process
    which allows the device to load the needed firmware, OS, and user data into memory
    to support full operation. Although the boot process itself is well defined, the
    firmware and ROM varies by manufacturer and by device. The goal of this section
    is to provide a high-level overview of the Android boot process, as techniques
    addressed later in this book will interact with the device at various levels.
    This overview is intended to be a high level because an in-depth description of
    the Android or Linux boot process could easily require an entire book on its own.'
  merge: -1
  pgno: 102
- img_proc: false
  md: 'Much of the information in this section is based on a post titled "The Android
    boot process from power on" by Mattias Björnheden of the Android Competence Center
    at Enea ([Björnheden, n.d.](http://www.björnheden, n.d.)). In the post, Mattias
    identifies seven key steps to the Android boot process:


    +   1. Power on and on-chip boot ROM code execution

    2. The boot loader

    3. The Linux kernel

    4. The init process

    5. Zygote and Dalvik

    6. The system server

    7. Boot complete


    We will examine each of these steps in detail.


    # **Power On and On-chip Boot ROM Code Execution**


    When an Android device is first powered on, a special boot ROM code paired with
    the CPU is executed to (1) initialize the device hardware and (2) locate the boot
    media. The ROM code is specific to the CPU the device is using. This step in the
    boot process is similar to the basic input-output system used to boot computers.


    For example, a CPU popular with the hardware hacking community is the Texas Instrument
    OMAP3530 ARM-compatible CPU that has a 3444-page *Technical Reference Manual*
    available publicly ([Public Version of OMAP35xx, 2010](http://Public%20Version%20of%20OMAP35xx,%202010)).
    Although reading the technical manual is not for everyone, it provides enormous
    detail and insight into how the CPU initializes and loads an OS. On page 3373,
    the manual provides a flowchart detailing the overall booting sequence. The ROM
    code, which starts the entire process, is hard'
  merge: -1
  pgno: 103
- img_proc: false
  md: 'coded at address 0x00014000, so that when power is applied to the device, the
    CPU knows exactly where to locate the boot ROM to start the boot sequence.


    Once the device hardware is initialized, the ROM code scans until it finds the
    boot media (which Android devices store on the NAND flash) and copies the initial
    boot loader to internal RAM. Then execution jumps from the boot ROM to the freshly
    loaded code in RAM as shown in Fig. 2.2.


    ![](bbox=[0.118, 0.32, 0.88, 0.645])


    **FIGURE 2.2** Power on and on-chip boot ROM code.


    # ## Boot Loader (Initial Program Load/Second Program Loader)


    The boot loader, now copied from the boot media, is executed in internal RAM.
    This step is similar to the boot loader found when booting computers such as Windows,
    Mac, and Linux. A typical computer boot loader, such as GRUB for Linux, allows
    the user to select which OS they want to boot and loads it accordingly.'
  merge: -1
  pgno: 104
- img_proc: false
  md: 'For an Android device, the boot loader has two distinct stages: the initial
    program load (IPL) and the second program loader (SPL). The IPL is responsible
    for detecting and setting up external RAM, an essential component needed to boot
    and operate the device. Once external RAM is prepared, the IPL copies the SPL
    into RAM and then transfers execution to the SPL.


    The SPL is responsible for not only loading the Android OS but also providing
    access to alternative boot modes such as fastboot, recovery, or other modes designed
    to update and debug or service the device. The SPL is generally provided by the
    manufacturer. However, the Android community actively creates their own SPLs (and
    other custom images) that enable additional features and functionality. In a typical
    boot scenario, the SPL will initialize hardware components such as the clock,
    console, display, keyboard, and baseband modem as well as file systems, virtual
    memory, and other features required to operate the device.


    The SPL then locates the Linux kernel on the boot media, copies it to RAM, loads
    boot parameters, and finally transfers execution to the kernel. Figure 2.3 illustrates
    this process.'
  merge: -1
  pgno: 105
- img_proc: false
  md: '![](bbox=[0.26, 0.11, 0.73, 0.43])


