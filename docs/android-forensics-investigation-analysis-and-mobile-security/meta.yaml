  md: 'The Android software development kit (SDK) is the development resource needed
    to develop Android applications. It includes software libraries and APIs, reference
    materials, an emulator, and other tools. The SDK is supported in many environments
    including Linux, Windows, and OS X and can be downloaded free from [http://developer.android.com](http://developer.android.com).


    The SDK is also a powerful forensic tool used by analysts in many situations to
    aid in the investigation of an Android device.


    # SDK Release History


    While the Android platforms mark the officially supported releases of Android,
    the SDK is updated more frequently. Table 3.9 provides the complete SDK release
    history that can aid in these situations (SDK Archives, n.d.).


    Table 3.9 Archived Android Platforms Releases


    | Platform | API Level | Release Date |

    |---|---|---|

    | Android 1.6 r1 | 4 | September 2009 |

    | Android 1.5 r3 | 3 | July 2009 |

    | Android 1.1 r1 | 2 | February 2009 |

    | Android 1.0 r2 | 1 | November 2008 |


    # SDK Install


    Since the SDK is critical in the investigation of an Android device, examiners
    should have a working installation. The following sections provide step-by-step
    directions for installing the SDK on the supported platforms.


    # Linux SDK Install


    These steps are based on the Ubuntu VM used to download and compile the Android
    Open Source Project (AOSP) from Chapter 1 which already includes'
