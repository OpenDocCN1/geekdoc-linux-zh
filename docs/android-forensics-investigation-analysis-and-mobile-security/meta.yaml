    # Universal Serial Bus


    Most Android devices support several Universal Serial Bus (USB) interfaces that
    can be accessed from computers. The cables may vary between devices, but in general,
    the USB interface allows most modern OSs connectivity to the device. The following
    are some common interfaces exposed by Android devices:


    +   1. Charge only: the device can be recharged over the USB cable

    2. Disk interface: portions of the device, including the SD card, emulated SD
    card, and other disk interfaces, are presented and accessible to the OS as a Mass
    Storage Device

    3. Vendor-specific interfaces: these include custom synchronization protocols,
    emulated CD-read-only memory (ROM) drives for software installs, and specialized
    connections for sharing the phone''s Internet connection

    4. Android Debug Bridge (ADB): an interface that provides the user access to a
    shell prompt on the device as well as other advanced features


    In [Chapter 3](Chapter 3), we will explore the disk interface and the ADB interface,
    both of which are critical components in the forensic investigation of an Android
