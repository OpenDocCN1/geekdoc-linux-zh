    As you may notice, the data are quite verbose and low level. However, it can provide
    important time stamps and activities, as well as a wealth of information about
    the device on boot-up. However, if the device has not been rebooted recently,
    the initial logs from startup are no longer available.


    This command does not require any special permission on the device except that
    USB debugging must be enabled. If you ran this command on a device or emulator,
    you would have noticed that far too much data were displayed on your screen. You
    can determine the total number of lines available in the log by piping (or sending)
    the contents of dmesg to a program called wc (which stands for word count) and
    instructing it to count the number of lines:


    ```

    ahoog@ubuntu:~$ adb shell dmesg | wc -l

    1859

    ```


    So, on the reference HTC Incredible, we have 1859 lines in the kernel log. If
    you need to inspect the information more closely, or include it in a report, you
    can redirect the output of dmesg to a file with the following:


    ```

    ahoog@ubuntu:~$ adb shell dmesg > dmesg.log

    ```


    You can now examine the contents of the available kernel log by opening dmesg.log
    in a text editor or display program.


