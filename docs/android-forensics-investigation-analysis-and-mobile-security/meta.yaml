    ```\n\nNext, copy the following contents into the editor:\n\n```\n#!/usr/bin/env\
    \ python\n\n# Author: Andrew Hoog [ahoog at viaforensics dot com]\n# Name: removeOOB.py\n\
    #\n\nimport subprocess, os, csv, getopt, sys\n\ndef usage():\n    print \"\"\"\
