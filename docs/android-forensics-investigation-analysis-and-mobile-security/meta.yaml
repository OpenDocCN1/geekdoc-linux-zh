    but a time stamp (in milliseconds, not seconds, since 1970) that translates to
    GMT: Sat, 30 Oct 2010 20:20:18 GMT.


    Strings is a very powerful command which, when combined with searching and filters,
    can quickly determine if phone numbers, names, locations, GPS coordinates, dates,
    and many more pieces of information are easily extractable in a data file.


    # Hex: A Forensic Analyst''s Good Friend


    In many forensic investigations, a logical acquisition or a logical file system
    analysis from a physical acquisition will provide more than enough data for the
    case. However, certain cases require a deeper'
  merge: -1
  pgno: 479
- img_proc: false
  md: 'analysis to find deleted data or unknown file structures. This is also necessary
    when the file system has little or no support in standard forensic tools, such
    as YAFFS2.


    Understandably, many forensic analysts would prefer to not perform a deeper analysis
    because it requires significant time, is extremely tedious, and requires a fairly
    deep understanding and curiosity of data structures. However, the results from
    this type of analysis are often quite amazing. Important information about that
    individual case is learned, and this knowledge is generally applicable to many
    cases in the future.


    For these reasons, every forensic analyst should be comfortable using a hex editor
    should the need arise. This allows the analysts to see exactly what data are being
    stored, look for patterns, and perhaps identify deleted or previously understood
    data structures.


    Of course, let''s explain this better with an example. First, make sure you install
    the following package on your Ubuntu workstation:


    ```

    ahoog@ubuntu:~$ sudo apt-get install ncurses-hexedit

    ```


    This is a very fast curses (terminal)-based hex editor. Of course, you can use
    any hex editor that is comfortable. Next, let''s use the strings command to look
    at the mmssms.db file which is located in the /data/data/com.android.providers.telephony/databases
    directory to see if we can find some deleted text messages. In this sample case,
    it is known that text messages to 3128781100 were deleted from the device. First,
    let''s use strings to see if we find that phone number in the SQLite file:'
  merge: -1
  pgno: 480
- img_proc: false
  md: '```

    ahoog@ubuntu:~$ strings --all --radix=x mmssms.db | grep 3128781100 | wc -l

    417

    ```


    In this command, we use the pipe ("|") operator, which takes the output from one
    command and sends it to the next command. In this way we can link many commands
    together and get very powerful analysis techniques on the fly. Thus, the above
    command does the following:


    +   1. Runs the strings command on the SQLite database.

    2. Takes the output of the strings command and runs it through the grep program,
    which filters the output-based patterns provided. In this case, we provide the
    phone number in question. However, you can create very powerful search strings
    for grep including regular expressions.

    3. Take the output from the grep command and see how many lines are returned by
    piping the output to the word count program ("wc") and instructing it to count
    by line instead of by word.


    The result is that 417 entries for that phone number were found; obviously indicating
    that there was indeed communication with the phone number on that device. We next
    want to take a close look at the messages, so instead of piping the output to
    the wc program, let''s look at the results directly and include one line of text
    after the phone number by adding the option "-A 1" to grep (also, we pipe the
    output to the "less" command to display it one page at a time):'
