  md: 'Again, let''s look at each of the options set. First, this command requires
    administrator rights so we run with sudo. The options are then:


    +   - -t vfat

    - -o loop,ro,offset=66068—This tells mount to use the loopback device as we are
    using a physical file instead of an actual device. The ro mounts the e-mail as
    read-only. Finally, we have to tell mount where to find the partition. From the
    mmls command, you recall that the offset was a sector 129. Mount does not know
    the sector size, so we calculate 129 × 512, which is equal to 66,048

    - ~/sd-emmc/viaforensics/af-book/sdcard2-113serialno/sdcard2-113serialno.dc3dd—The
    dd images

    - ~/mnt/sdcard—Where to mount the image


    We can validate that the file system is mounted by executing the mount command
    with no options, which returns the list of all mounted file systems. We pipe this
    through grep to isolate the file system we are looking for:


    ```

    ahoog@ubuntu:~$ mount | grep vfat

    /dev/loop0 on /home/ahoog/mnt/sdcard type vfat (ro,offset=66048)

