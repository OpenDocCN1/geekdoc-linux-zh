    **bugreport**


    The final debugging command further builds on the previous commands and combines
    the logcat, dumpsys, and dumpstate debug output in a single command, and displays
    on screen for the purpose of submitting a bug report. The command is run as follows:


    ```

    ahoog@ubuntu:~$ adb bugreport

    ```


    It starts by running dumpstate. When run against the reference HTC Incredible,
    the output was saved into a file and then a line count was performed:


    ```

    ahoog@ubuntu:~$ adb bugreport > bugreport.log

    ahoog@ubuntu:~$ wc -l bugreport.log

    42575 bugreport.log

    ```


    As you can see, the report generated over 42,000 lines of debug rich in time stamps,
    app data, and system information. Parsing this data will yield useful information.
    However, if the data are processed manually, the task is daunting.


    # Type of memory'
