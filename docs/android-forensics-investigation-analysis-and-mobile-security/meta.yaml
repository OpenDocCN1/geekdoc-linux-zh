  md: '+   - app_icons: 1 database of web page icons

    - app_cache: 1 database containing web application data cache

    - app_geolocation: 2 databases relating to GPS position and permissions

    - app_databases: 21 databases providing local database storage for supporting
    web sites

    - databases: 3 databases for the browser and browser cache


    There is very high potential of recovering forensically valuable data from these
    files.


    # Network


    The final data storage mechanism available to developers is the network, a key
    benefit of a device designed to be network aware. Initially, very few applications
    took advantage of the network as a storage option. However, as the SDK, apps,
    and devices mature, the network storage option is being leveraged more.


    The Android Developer web site provides very few details for those interested
    in network storage. Their entire documentation is a mere two sentences long (Data
    storage, n.d.).


    You can use the network (when it is available) to store and retrieve data on your
    own web-based services. To do network operations, use classes in the following
    packages:


    +   - java.net.*

    - android.net.*


    The packages referenced in the documentation essentially provide developers with
    the low-level APIs needed to interact with the network, web servers, and more.
    Apps that leverage the network require more custom coding and, while all of the
    forensically interesting data may not be stored on the device, often important
    configuration and database files are recoverable.'
