    # YAFFS2 Timeline Analysis


    Ideally, this section would detail the use of already-built forensic software
    that would build YAFFS2 timelines. Unfortunately, YAFFS2 is not yet supported
    by any forensic timeline tools, so examiners in need of this information must
    take a more difficult path.


    Over the next few years, the forensics industry needs to perform far more research
    into YAFFS2. However, with Android moving towards EXT4, it is possible that most
    of the YAFFS2 research will not occur. Hopefully, this will not be the case.


    Here, we will present some research that is intended to provide a basic framework
    to begin YAFFS2 research. This research was done on the simulated NAND flash initially
    covered in [Chapter 4](Chapter%204). While this approach provides the researcher
    with the control and privileges needed for effective research, it does not necessarily
    mimic production environments.'
  merge: -1
  pgno: 528
- img_proc: false
  md: 'As discussed in Chapter 4, both YAFFS2 and MTD are involved in writing data
    to the NAND flash. The YAFFS2 module is responsible for all aspects of the file
    system. However, the writing of the data to the NAND flash is managed by MTD.
    Unfortunately, this adds considerable complexity to the analysis as MTD can accept
    the data from YAFFS2, which needs to be written to the NAND flash and then has
    the autonomy to write not only the YAFFS2 data but additional MTD data in the
    manner it sees fit. Some research into the data as it has persisted must take
    into account not only the YAFFS2 code but the MTD code. Additionally, there can
    be subtle differences in the YAFFS2 and MTD modules used on different Android
    devices, which adds yet another layer of complexity.


    This does not mean understanding the YAFFS2 data found in a nanddump is impossible.
    To get started, we are going to setup a 64 MB simulated NAND flash device on our
    Ubuntu workstation.


    ```

    sudo modprobe mtd

    sudo modprobe mtdblock

    sudo insmod ~/yaffs2/yaffs2.ko

    sudo modprobe nandsim first_id_byte=0x20 second_id_byte=0xa2 third_id_byte=0x00
    fourth_id_byte=0x15

    ```


    You can verify the nandsim is properly setup:


    ```

    ahoog@ubuntu:~$ cat /proc/mtd

    dev:    size    erasesize  name

    mtd0: 04000000 00020000 "NAND simulator partition 0"

    ```


    Before we mount the YAFFS2 file system, we are going to enable various debugging
    features built into YAFFS2. There are many debugging options that YAFFS2 supports
    (YAFFS Debugging, n.d.),'
  merge: -1
  pgno: 529
- img_proc: false
  md: 'but we are only going to enable three of them. To do this, we first need to
    have full root permissions and then we will echo the debugging flags into “/proc/yaffs”:


    ```

    ahoog@ubuntu:~$ sudo -s

    root@ubuntu:~# echo =none+os+write+mtd > /proc/yaffs

    ```


    The value after echo command first removes any exiting debugging (none) and then
    enables the os, write, and mtd debugging options. You can view the results of
    the debugging in the system log located at “/var/log/syslog.” Ideally, open a
    second terminal window or ssh session and use the tail command to continuously
    output the tail end of the syslog:


    ```

    ahoog@ubuntu:~$ tail -f /var/log/syslog

    Feb 17 18:29:34 ubuntu kernel: [ 4474.970406] new trace = 0xF0004082

    ```


    Next, we create the mount point and mount a YAFFS2 file system:


    ```

    mkdir -p ~/mnt/yaffs2

    sudo mount -t yaffs2 /dev/mtdblock0 ~/mnt/yaffs2

    ```


    At this point, the examiner should create a series of test cases, so that the
    expected controlled data can be examined on the simulated NAND flash to ultimately
    determine the structure. For this test, the following steps were taken:


    +   1. Create a directory called test in “~/mnt/yaffs2” (mkdir ~/mnt/yaffs2/test)'
