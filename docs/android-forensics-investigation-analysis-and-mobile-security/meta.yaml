    ```\n\nThe portion of the NAND flash included covers the following:\n\n+   1.\
    \ Create \"~/mnt/yaffs2/test\" directory\n2. Permissions change on file1.txt (chmod\
    \ -R 777 ~/mnt/yaffs2/test)\n\nThe data displayed are part of YAFFS2 ObjectHeaders\
    \ and contain the metadata for the file system. The names of the files are clearly\
    \ visible as are the 64-byte OOB areas. One key characteristic about this data\
    \ is that the integers which represent Unix Epoch time stamps are in little-endian\
    \ order, which means that you must read the data from right to left."
