    **FIGURE 3.31** USB debugging warning.


    For every current logical Android forensic tool, USB debugging must be enabled.
    While this is trivial to achieve if the device is unlocked, it is far more difficult
    if the device has a pass code. There are some techniques that can circumvent the
    pass code, discussed in Chapter 6. However, they do not work on every platform.


    # ## Introduction to Android Debug Bridge


    Throughout the rest of this book, we will leverage adb extensively, so covering
    the basics now is important. There are three primary components involved when
    utilizing adb:


    +   1. The adbd running on the Android device

    2. The adbd running on your workstation

    3. The adb client program running on your workstation


    As previously covered, when you enable USB debugging on an Android device, the
    daemon will run and listen for a connection. Communication between the device’s
    adbd and your workstation’s adbd takes place over the virtual network running
    on top of the USB connection. The daemons communicate over their local host on
    ports 5555 through 5585. When the'
  merge: -1
  pgno: 168
- img_proc: false
  md: 'workstation’s adbd detects a new emulator or device, it creates two sequential
    port connections. The even port communicates with the device’s console while the
    odd port is for adb connections. The local adb client program uses port 5037 to
    communicate with the local adbd.

    The most basic adb command you can issue is the adb devices command, which provides
    a list of connected devices.


    ```

    ahoog@ubuntu:~$ adb devices

    List of devices attached

    HT08XHJ00657    device

    ```


    Another important command provides the ability to kill your local adb service.
    To achieve this, type the following:


    ```

    ahoog@ubuntu:~$ adb kill-server

    ahoog@ubuntu:~$ adb devices

    * daemon not running. starting it now on port 5037 *

    * daemon started successfully *

    List of devices attached

    HT08XHJ00657    device

    ```


    As you can see, if the adbd on the workstation is not running, it will be automatically
    started. On Ubuntu, if you ever receive the following response:


    ```

    ahoog@ubuntu:~$ adb devices

    List of devices attached

    ????????????    no permissions

    ```


    it is likely that the connected Android device has a new vendor ID which must
    be identified (sudo lsusb -v) and added to the udev rule as discussed in the “SDK
    install” section. In Microsoft Windows, if the Android device is not recognized
    you will be alerted and you must install the proper USB drivers from Google or
    the manufacturer.

    One powerful adb command all analysts and engineers should know is “adb shell,”
    which allows you to open a shell on the Android device and interact with the system.
    This is an important feature for anyone exploring Android.'
