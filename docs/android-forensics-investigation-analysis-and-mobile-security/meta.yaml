    2. float: single-precision 32-bit IEEE 754 floating point

    3. int: 32-bit signed two''s complement integer

    4. long: 64-bit signed two''s complement integer

    5. strings: string value, typically as a UTF-8


    With these basic types, developers can create and save simple values that power
    their application.


    Shared preferences files are typically stored in an application''s data directory
    in the shared_pref folder and end with .xml. On our reference HTC Incredible,
