    \ button. The boot loader is easily recognized on the Motorola Droid by a solid\
    \ black screen with the kernel version, USB status, and battery status in white\
    \ text. Ensure the battery is fully charged before attempting this process as\
    \ you could easily brick the device if the flashing process is interrupted with\
    \ a power failure. Also, you must have the SBF file saved to your forensic workstation\
    \ so you can flash it to the device. This is where extensive testing must occur\
    \ prior to working on the target device to ensure compatibility and a detailed\
    \ understanding of the process.\n\nWith the Droid in bootloader mode, we can query\
    \ the device with sbf_flash as follows:"
