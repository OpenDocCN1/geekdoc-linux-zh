    # Introduction


    Digital forensics is an exciting, fast-paced field that can have a powerful impact
    on a variety of situations including internal corporate investigations, civil
    litigation, criminal investigations, intelligence gathering, and matters involving
    national security. Mobile forensics, arguably the fastest growing and evolving
    digital forensic discipline, offers significant opportunities as well as many
    challenges. While the interesting part of Android forensics involves the acquisition
    and analysis of data from devices, it is important to have a broad understanding
    of both the platform and the tools that will be used throughout the investigation.
    A thorough understanding will assist a forensic examiner or security engineer'
  merge: -1
  pgno: 22
- img_proc: false
  md: 'through the successful investigation and analysis of an Android device.


    # Tip


    # Book corrections, updates, and software


    All corrections, updates, and even software samples for this book will be maintained
    online at the following web page:


    http://viaforensics.com/education/android-forensics-mobile-security-book/


    Please check the web site as over time it will evolve and provide significant
    and increasing value to the reader. Beyond corrections and updates, some of the
    software referenced in the book will be available for download.


    # Android platform


    Android is an open source mobile device platform based on the Linux 2.6 kernel
    and managed by the Open Handset Alliance, a group of carriers, mobile device and
    component manufacturers, and software vendors.


    Android has made a significant impact on the smartphone market and, consequently,
    in the area of forensics. Two years and one month after the first Android device
    was introduced (October 2008), Android became the second largest smartphone platform
    capturing 26.0% of the 61.5 million US smartphone subscribers (comScore reports,
    n.d.). Table 1.1 shows the top smartphone platforms as of November 2010, according
    to comScore, Inc.


    **Table 1.1** Total US Smartphone Subscribers, Ages 13+, November 2010'
