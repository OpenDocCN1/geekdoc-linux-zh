    parameters, files on the various external storage devices have far fewer constraints.


    First, one important motivation (beyond cost) for using a removable SD card is
    that the data could be used on other devices, presumably upgraded Android devices.
    If a consumer purchased a new Android device, inserted their previous SD card
    containing all of his or her family pictures and videos and found they were unable
    to access them, they would be quite upset.'
