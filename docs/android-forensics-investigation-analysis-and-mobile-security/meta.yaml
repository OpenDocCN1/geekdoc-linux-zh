  md: '+   1. Client —This parameter creates the folder structure, examples might
    be "sheriffs-office" or a client name such as "viaforensics."

    2. Case—This parameter provides a case name, such as af-book.

    3. Tag—This parameter is tag number for the evidence you are forensically imaging,
    item001 in our example.

    4. Serialno—This is the serial number of the device, disk, SD card, etc. If you
    do not have access to a serial number, you can type any text you choose such as
    unknown-serialno.

    5. Sourcedev—This is the device you want to acquire such as /dev/sdb, /dev/sdc,
    etc. You can determine this using dmesg which is explained next.

    6. Destpath—The top-level directory where the folders should be created. It could
    be your home directory (~) or perhaps a folder called clients (~/clients).


    For this example, create a folder in your home directory called sd-emmc and then
    run the acquire script with sudo permissions.'
