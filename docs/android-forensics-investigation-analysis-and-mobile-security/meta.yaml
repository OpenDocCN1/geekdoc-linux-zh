    \                   reflash device from update.zip\n  flashall               \
    \                   flash boot + recovery + system\n  flash <partition> [ <filename>\
    \ ]          write a file to a flash partition\n  erase <partition>          \
    \               erase a flash partition\n  getvar <variable>                 \
    \        display a bootloader variable\n  boot <kernel> [ <ramdisk> ]        \
    \       download and boot kernel\n  flash:raw boot <kernel> [ <ramdisk> ]    \
    \ create bootimage and flash it\n  devices                                   \
    \ list all connected devices\n  reboot                                     reboot\
    \ device normally\n  reboot-bootloader                         reboot device into\
    \ bootloader\n\noptions:\n  -w                                        erase userdata\
    \ and cache\n  -s <serial number>                        specify device serial\
    \ number\n  -p <product>                              specify product name\n \
    \ -c <cmdline>                              override kernel commandline\n  -i\
    \ <vendor id>                            specify a custom USB vendor id\n```\n\
    \nAs you can see, once in flashboot mode, it is quite simple to flash the modified\
    \ recovery partition:\n\n```\nahog@ubuntu:~$ fastboot flash recovery modified-recovery-image.img\n\
    ```\n\nAfter this process completes, you can reboot the phone into recovery mode\
    \ and proceed with the software-based physical imaging technique.\n\n# AFPhysical\
    \ Technique\n\nThe AFPhysical technique was developed by viaForensics to provide\
    \ a physical disk image of Android NAND flash partitions. The"
  merge: -1
  pgno: 448
- img_proc: false
  md: 'technique requires root privileges on the device and should support any Android
    device. The technique, however, is not a simple process and the forensic analyst
    will have to adapt the technique for the specific device investigated. This is
    a direct result of the large variations in Android devices not only between manufacturers
    but between devices running different versions of Android.


    The overall process for AFPhysical is quite simple:


    +   1. Acquire root privileges on the target Android device.

    2. Identify NAND flash partitions which need to be imaged.

    3. Upload forensic binaries to the target Android device.

    4. Acquire physical image of NAND flash partitions.

    5. Remove forensic binaries if any were stored on nonvolatile storage.


    Regardless of the technique, it is assumed you have root privileges on the device.
    For this example, we will use a Motorola Droid. As we are able to flash a modified
    recovery partition to a Motorola Droid, this technique will work on a device even
    if it is pass code locked.


    After we have flashed the modified recovery partition and rebooted into recovery
    mode, connect the device to our Ubuntu VM and verify adb can locate the device
    by running adb devices.


    ```

    ahoog@ubuntu:~$ adb devices

    List of devices attached

    040363260C006018        recovery

    ```


    From there, access the shell to ensure you have root privileges:'
  merge: -1
  pgno: 449
- img_proc: false
  md: '```

    ahoog@ubuntu:~$ adb shell

    / #

    ```


    At this point, we need to understand more about the phone so we can decide what
    needs to be physically imaged. The first place to start is to examine the mounted
    file systems, if any:


    ```

    / # mount

    rootfs on / type rootfs (rw)

    tmpfs on /dev type tmpfs (rw,mode=755)

    devpts on /dev/pts type devpts (rw,mode=600)

    proc on /proc type proc (rw)

    sysfs on /sys type sysfs (rw)

    /dev/block/mtdblock7 on /cache type yaffs2 (rw,nodev,noatime,nodiratime)

    ```


    Now, we know that the device uses MTD for NAND flash access as well as YAFFS2.
    To determine partitions exposed by MTD, we execute the following:


    ```

    / # cat /proc/mtd

    dev:    size   erasesize  name

    mtd0: 000a0000 00020000 "mbm"

    mtd1: 00060000 00020000 "cdt"

    mtd2: 00060000 00020000 "lbl"

    mtd3: 00060000 00020000 "misc"

    mtd4: 00380000 00020000 "boot"

    mtd5: 00480000 00020000 "recovery"

    mtd6: 08c60000 00020000 "system"

    mtd7: 05ca0000 00020000 "cache"

    mtd8: 105c0000 00020000 "userdata"

    mtd9: 00200000 00020000 "kpanic"

    ```


    An examiner should choose to image all of the MTD partitions. However, for this
    example we will focus on mtd8, the user data partition.'
  merge: -1
  pgno: 450
- img_proc: false
  md: 'As we are now prepared to acquire the device, it may be helpful to refer back
    to the NAND flash and file system topics in [Chapter 4] if some of the terminology
    or data structures are confusing. There are four Android physical acquisition
    strategies you can use once you have a device with root access:


    +   1. Full nanddump of all partitions, including data and OOB (preferred)

    2. A dd image of partitions, which only acquires the data, not the OOB

    3. A logical acquisition of files using tar

    4. A logical acquisition of files using adb


    In addition, there are two primary ways to save the acquired data from the device:


    +   1. Use adb port forward to create a network between the Ubuntu workstation
    and Android device over USB

    2. Place an SD card into the device, mount, and save locally


    There are advantages to both approaches. With adb port forwarding, you do not
    need to insert your own device and can immediately create the files on your workstation.
    When you save to the SD card, the acquisition is much faster. Both approaches
    are valid and will be demonstrated here.


    We will start with the full nanddump of the user data partition as this provides
    the most complete forensic copy of the data. To achieve the nanddump, you must
    have a version of nanddump compiled for the ARM platform. Cross-compiling nanddump
    is beyond the scope of this book. However, you can either search for'
  merge: -1
  pgno: 451
- img_proc: false
  md: 'the program on the Internet or follow directions that are also posted online.


    > **Tip**


    **Cross-compiling for ARM**


    Cross-compiling source code to run on the ARM platform can be quite difficult
    and there is sparse support for it online. One possible solution is to use Android''s
    Native Development Kit (NDK) to build compatible binaries. Another option is to
    use Linux and install a cross-compiler such as Code Sourcery''s G+ + Lite 2009q3-67
    for ARM GNU/Linux from http://www.codesourcery.com/sgpp/lite/arm/portal/release1039.
    Once a cross-compiler is installed, you must modify the source code''s Makefile
    to indicate the cross-compiling option. Also check this book''s web site at http://viaforensics.com/education/android-forensics-mobile-security-book/
    for future updates.


    To avoid writing any data to the NAND flash, we can again examine the output of
    the mount command and take note that the “/dev” directory is tmpfs and thus, is
    stored in RAM. We can therefore push the forensic utilities to “/dev”:


    ```

    ahoog@ubuntu:~$ adb push AFPhysical/ /dev/AFPhyiscal

    push: AFPhysical/tar -> /dev/AFPhyiscal/tar

    push: AFPhysical/md5sum -> /dev/AFPhyiscal/md5sum

    push: AFPhysical/nanddump -> /dev/AFPhyiscal/nanddump

    push: AFPhysical/nc -> /dev/AFPhyiscal/nc

    4 files pushed. 0 files skipped.

    1003 KB/s (2803303 bytes in 2.727s)

    ```


    Next we need to make the programs executable on the device. To achieve this, we
    use the chmod command, which changes the'
  merge: -1
  pgno: 452
- img_proc: false
  md: 'permissions of a file including the execute flag. We will set all files to
    allow any user to read or execute the program:


    ```

    ahoog@ubuntu:~$ adb shell

    / # cd /dev/AFPhyiscal

    /dev/AFPhyiscal # ls -l

    -rw-rw-rw-    1 0        0       711168 Jan 24  2011 md5sum

    -rw-rw-rw-    1 0        0       669799 Jan 24  2011 nanddump

    -rw-rw-rw-    1 0        0       711168 Jan 24  2011 nc

    -rw-rw-rw-    1 0        0       711168 Jan 24  2011 tar

    /dev/AFPhyiscal # chmod 755 *

    /dev/AFPhyiscal # ls -l

    -rwxr-xr-x    1 0        0       711168 Jan 24  2011 md5sum

    -rwxr-xr-x    1 0        0       669799 Jan 24  2011 nanddump

    -rwxr-xr-x    1 0        0       711168 Jan 24  2011 nc

    -rwxr-xr-x    1 0        0       711168 Jan 24  2011 tar

    ```


    As you can tell, after we execute the "chmod 755" command on the programs, they
    each have the execute bit now set, which is represented by the "x" in the file
    permissions.


    If you decided to save the nanddump to the SD card, ensure you place a properly
    formatted SD card in the device and that it is mounted on the system. Then we
    can execute nanddump as follows:


    ```

    / # /dev/AFPhyiscal/nanddump /dev/mtd/mtd8ro > /sdcard/af-book-mtd8.nanddump

    ECC failed: 0

    ECC corrected: 0

    Number of bad blocks: 1

    Number of bbt blocks: 0

    Block size 131072, page size 2048, OOB size 64

    Dumping data starting at 0x00000000 and ending at 0x105c0000...


    / # ls -l /sdcard/af-book-mtd8.nanddump

    -rwxrwxrwx    1 0        0    283041792 Jan  1 00:12 /sdcard/af-book-mtd8.nanddump

    ```


    And ultimately either transfer to your Ubuntu VM using adb pull or remove the
    SD card and copy via a direct USB connection, which is'
  merge: -1
  pgno: 453
- img_proc: false
  md: 'much faster.


    > **Note**


    **MD5 hash**


    Although the user data partition was not mounted on the device during acquisition,
    the md5sum hash signature of “/dev/mtd/mtd8ro” will change even without any writes.
    This is due to the nature of NAND flash where the operating system and memory
    are in a nearly constant state of change from wear leveling, bad block management,
    and other mechanisms which occur despite the lack of changes to the user data.
    The best approach is to perform an md5sum of the resulting NAND flash file to
    ensure integrity from that point forward.


    The second method for saving the NAND flash file or any other imaged data is to
    use netcat, which is a utility that allows you to redirect the output of a command
    to the network. For this approach, you will need two active terminal or ssh sessions.
    We will refer to them as Session0 and Session1. All of the Session0 commands will
    run on the Ubuntu VM and thus we will not go into the Android device shell from
    Session0. The commands which need to execute within the Android device’s shell
    will all take place on Session1.


    To begin, we first enable the network connection between the two endpoints using
    the adb port-forwarding capability:


    ```

    SESSION0

    -----------------

    ahog@ubuntu:~$ adb forward tcp:31337 tcp:31337

    ```'
  merge: -1
  pgno: 454
- img_proc: false
  md: 'This command essentially connects port 31337 on the Android device and the
    Ubuntu VM. Next, we execute nanddump on the Android device and pipe the output
    to netcat:


    ```

    SESSION1

    --------------

    ahog@ubuntu:~$ adb shell

    / # /dev/AFPhyiscal/nanddump /dev/mtd/mtd8ro | /dev/AFPhyiscal/nc -l -p 31337

    ECC failed: 0

    ECC corrected: 0

    Number of bad blocks: 0

    Number of bbt blocks: 0

    Block size 131072, page size 2048, OOB size 64

    Dumping data starting at 0x00000000 and ending at 0x105c0000...

    ```


    Now that the Android device is sending the nanddump data over netcat, we need
    to receive it on the Ubuntu VM side:


    ```

    SESSION0

    --------------

    ahog@ubuntu:~$ nc 127.0.0.1 31337 > af-book-mtd8.nanddump

    ```


    When nanddump completes, it simply exits without any additional output as does
    the netcat on the Ubuntu VM. We can verify that the nanddump was received on the
    workstation with ls:


    ```

    SESSION0

    --------------

    ahog@ubuntu:~$ ls -lh af-book-mtd8.nanddump

    -rw-r--r-- 1 ahog ahog 270M 2011-02-26 20:58 af-book-mtd8.nanddump

    ```


    At this point, you could continue to physically image the MTD partitions needed
    for the investigation, which should include at least the user data and the cache
    partitions.'
  merge: -1
  pgno: 455
- img_proc: false
  md: 'In Chapter 7, we provide a program that will allow you to extract the OOB data
    from a nanddump to assist with forensic processing such as file carving. As you
    can generate the dd image in this manner, there is no need to acquire a dd image
    using the Android device. However, dd is built into Android and so we provide
    this example which is similar to the use of the nanddump example, except it uses
    the dd utility, and so does not capture OOB data. This example uses the reference
    HTC Incredible.


    ```

    SESSION0

    ---------------

    ahog@ubuntu:~$ adb forward tcp:31337 tcp:31337


    SESSION1

    ---------------

    ahog@ubuntu:~$ adb shell

    $ su

    # cat /proc/mtd

    dev:    size    erasesize  name

    mtd0: 000a0000 00020000 "misc"

    mtd1: 00480000 00020000 "recovery"

    mtd2: 00300000 00020000 "boot"

    mtd3: 0f800000 00020000 "system"

    mtd4: 000a0000 00020000 "local"

    mtd5: 02800000 00020000 "cache"

    mtd6: 09500000 00020000 "datadata"

    # dd if=/dev/mtd/mtd6 bs=4096 | /dev/AFPhyiscal/nc -l -p 31337

    38144+0 records in

    38144+0 records out

    156237824 bytes transferred in 182.898 secs (854234 bytes/sec)


    SESSION0

    ---------------

    ahog@ubuntu:~$ nc 127.0.0.1 31337 > dd of=htc-datadata.dd bs=4096

    ```


    Due to variations in Android devices, MTD, YAFFS2, and other nuisances, it is
    not always possible to mount the acquired nanddump image and extract the logical
    files. As you already have sufficient privileges, it is best to extract the desired
    logical data.'
  merge: -1
  pgno: 456
- img_proc: false
  md: 'This can be accomplished using a recursive adb pull because the adb daemon
    running on the device has root privileges. You can also use a utility such as
    tar to copy the data into a single archive file. In either instance, you must
    ensure the desired file system is mounted. Some of the modified recovery partitions
    provide a user interface for mounting the file systems. However, you can also
    do this on the command line and mount the file system read only. On the Motorola
    Droid referenced above, do the following:


    ```

    SESSION1

    ----------------

    / # mount -o ro -t yaffs2 /dev/block/mtdblock8 /data

    / # mount -o ro,remount -t yaffs2 /dev/block/mtdblock7 /cache

    / # mount

    rootfs on / type rootfs (rw)

    tmpfs on /dev type tmpfs (rw,mode=755)

    devpts on /dev/pts type devpts (rw,mode=600)

    proc on /proc type proc (rw)

    sysfs on /sys type sysfs (rw)

    /dev/block/mtdblock7 on /cache type yaffs2 (ro)

    /dev/block/mmcblk0p1 on /sdcard type vfat (rw,nodev,nodiratime,fmask=0000,dmask=0000,allow_utime=0022,codepage=cp437,iocharset=iso8859-1,errors=remount-ro)

    /dev/block/mtdblock8 on /data type yaffs2 (ro)

    ```


    The first command mounts the "/data" partition read only. The second command takes
    the already mounted "/cache" directory and remounts it read only. You can now
    perform the adb pull:


    ```

    ahoog@ubuntu:~$ adb pull /data/data/com.android.providers.telephony sms

    pull: building file list...

    pull: /data/data/com.android.providers.telephony/databases/mmssms.db -> sms/databases/mmssms.db

    pull: /data/data/com.android.providers.telephony/databases/telephony.db -> sms/databases/telephony.db

    2 files pulled. 0 files skipped.

    137 KB/s (44032 bytes in 0.311s)

    ```'
  merge: -1
  pgno: 457
- img_proc: false
  md: 'The final option is to use the tar utility that places files and directories
    in a single archive often called a tarball.


    ```

    SESSION1

    ------------

    ahgoog@ubuntu:~$ adb shell

    / # /dev/AFPhyiscal/tar cpv -f - /data/data/com.android.providers.telephony/cache
    | /dev/AFPhyiscal/nc -l -p 31337

    tar: removing leading ''/'' from member names

    data/data/com.android.providers.telephony/

    data/data/com.android.providers.telephony/lib/

    data/data/com.android.providers.telephony/databases/

    data/data/com.android.providers.telephony/databases/telephony.db

    data/data/com.android.providers.telephony/databases/mmssms.db

    cache/

    cache/recovery/

    cache/recovery/log

    cache/lost+found/


    SESSION0

    ------------

    ahgoog@ubuntu:~$ nc 127.0.0.1 31337 > af-book-droid-files.tar

    ```


    In this example, we passed two directories to tar which we wanted archived: the
    directory containing SMS/MMS messages in "/data/data" and the "/cache" directory.
    We sent the archive over the network and received it on the Ubuntu VM. However,
    you could have also simply saved the archive to the SD card.


    Once you have root privileges on an Android device and sufficient understanding
    of the device''s architecture, you can use nanddump, dd, tar, netcat, and adb
    to create forensic images or simply copies of the data for analysis.


    # Summary


    There are several techniques that can be used to perform a forensic acquisition
    of an Android device. If the device is pass code'
  merge: -1
  pgno: 458
- img_proc: false
  md: 'protected, you must circumvent or bypass the protection to extract data. While
    a number of techniques to circumvent the pass code exist, it is not possible to
    achieve this in every circumstance. Once the device is accessible, the forensic
    analyst can choose from a logical acquisition which focuses primarily on undeleted
    data accessible through Content Providers or the more thorough but technically
    challenging physical acquisition. While the physical acquisition will produce
    more data, it generally requires more sophisticated analysis techniques which
    will be covered in [Chapter 7](Chapter 7).


