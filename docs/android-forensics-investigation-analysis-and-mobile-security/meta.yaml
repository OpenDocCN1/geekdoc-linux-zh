  md: 'large number of smartphones available for purchase through venues such as eBay
    and Craigslist, and many of the devices are not properly wiped leaving personal
    data intact. Furthermore, malicious code, malware, and remote exploits increasingly
    target mobile devices, and history indicates they will result in significant data
    theft. The extent of their effectiveness will only be determined over time; but
    given the urgent pace of development of the operating systems (Android in this
    case), and the rapid proliferation of mobile apps, it is certainly reasonable
    to expect that many of these attacks will succeed.


    # Data at Rest


    Data at rest is a term used to describe data that are stored in nonvolatile memory
    and thus are neither located in RAM nor in transit through networks (cellular,
    data, or other networks). The term data at rest is often used in laws and regulations
    and defines one key state where data must be secured.


