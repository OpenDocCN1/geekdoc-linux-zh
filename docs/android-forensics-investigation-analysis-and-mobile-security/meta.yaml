    # Boot Loaders


    As discussed in Chapter 2, the boot loader is a small program that is executed
    early in the Android boot process and is responsible for, among other details,
    selecting and loading the main kernel. On certain devices, special software exists,
    typically developed by the'
  merge: -1
  pgno: 441
- img_proc: false
  md: 'manufacturer, which can interact with the boot loader. This software is capable
