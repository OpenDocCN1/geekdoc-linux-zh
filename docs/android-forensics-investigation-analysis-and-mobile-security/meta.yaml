    the security flaw within one day.


    In another recent example, security firm Matta Consulting discovered numerous
    critical security flaws in Cisco System''s Unified Videoconferencing platform.
    The flaws enable a malicious third party to gain full control of the device, harvest
    user passwords, and possibly launch an attack against other parts of the target
    infrastructure (Cisco Unified Video, n.d.). Cisco acknowledged the flaws in their
    advisory with the hard-coded passwords representing the most alarming flaw:


    > The Linux shadow password file contains three hard-coded user names and passwords.
    The passwords cannot be changed, and the accounts cannot be deleted. Attackers
