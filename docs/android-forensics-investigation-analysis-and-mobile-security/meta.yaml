    # Data in Transit


    Data in transit (sometimes called data in motion) is a term used to describe data
    that is in transit through networks (cellular, Wi-Fi, or other networks) or is
    located in RAM. The term data in transit is often used in laws and regulations
    and defines another key state where data must be secured.


    In general, most of the information stored on a device (and described above) will,
    at some point, have traveled through the network. Beyond the data itself, quite
    a bit of information never persisted to the device is transmitted and must be
    protected. Some examples include the following:


    +   - Passwords: Many applications do not store passwords on the device and require
    the user to authenticate each time the app is opened. The password is therefore
    only transmitted, not stored.

    - Two-factor authentication'
