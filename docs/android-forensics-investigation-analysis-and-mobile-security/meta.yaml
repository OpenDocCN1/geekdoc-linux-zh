    The /mnt/sdcard has many options. The options are:'
  merge: -1
  pgno: 247
- img_proc: false
  md: '+   1. rw: mounted to allow read/write

    2. dirsync: all updates to directories are done synchronously

    3. nosuid: does not allow setuid (which would allow other users to execute programs
    using the permission of file owner)

    4. nodev: does not interpret any file as a special block device

    5. noexec: does not let all files execute from the file system

    6. relatime: updates the file access time if older than the modified time

    7. uid=1000: sets the owner of all files to 1000

    8. gid=1015: sets the group of all files to 1015

    9. fmask=0702: sets the umask applied to regular files only (set permissions ---rwxr-x,
    or user=none, group=read/write/execute,other=read/execute)

    10. dmask=0702: sets the umask applied to directories only (set permissions ---rwxr-x,
    or user=none, group=read/write/execute,other=read/execute)

    11. allow_utime=0020: controls the permission check of mtime/atime.

    12. codepage=cp437: sets the codepage for converting to shortname characters on
    FAT and VFAT file systems.

    13. iocharset=iso8859-1: character set to use for converting between 8-bit characters
    and 16-bit Unicode characters. The default is iso8859-1. Long file names are stored
    on disk in Unicode format.

    14. shortname=mixed: defines the behavior for creation and display of file names
    that fit into 8.3 characters. If a long name for a file exists, it will always
    be the preferred display. Mixed displays the short name as is and stores a long
    name when the short name is not all upper case.

    15. utf8: converts 16-bit Unicode characters on CD to UTF-8.

    16. errors=remount-ro: defines the behavior when an error is encountered; in this
    case, remounts the file system read-only.


    All of the mount command options are explained in the manual page (man 8 mount).
    However, for most cases, a quick scan will reveal the information an examiner
    needs including the mount points, types, and permissions on the file systems.'
