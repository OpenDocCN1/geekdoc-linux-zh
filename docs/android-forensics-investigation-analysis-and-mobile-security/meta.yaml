    # Introduction


    Android was designed to be compatible with a wide array of hardware. This is achieved,
    in large part, through the Linux kernel, which over the years has evolved to support
    a large variety of hardware. This is an important characteristic of the platform
    as it allows manufacturers freedom to design, procure, or otherwise integrate
    the ideal components of the Android device. This strategy has led to the development
    of powerful dual core Android devices capable of significant processing as well
    as entry-level devices targeted to entry-level wireless plans. Although the hardware
    compatibility is great for manufacturers, wireless providers, and ultimately consumers,
    the diversity poses challenges for forensic analysts and security engineers. Understanding
    the hardware'
  merge: -1
  pgno: 87
- img_proc: false
  md: 'components, device types, and boot process for Android will aid in your overall
    understanding of Android.


    # # Overview of core components


    Android was developed to support a wide range of devices and manufacturers. As
    such, any list of major components will likely be outdated as soon as it is printed.
    However, there are some consistent components found in Android devices, which
    are beneficial to discuss. The following components comprise the core of an Android
    device.


    # ## Central Processing Unit


    The central processing unit (CPU) is a term quite familiar to most forensic analysts,
    and there are no surprises in its role on Android devices. The CPU is responsible
    for executing operating system (OS) and application code and coordinating or controlling
    other core components including the network, storage, displays, and input devices.


    From the beginning, most (if not all) Android devices utilize ARM processors as
    their CPU, which are powerful enough for the mobile platform but designed for
    low power consumption—a key aspect in maximizing battery life.


    However, corporations and enthusiasts alike have ported Android to other platforms.
    On the corporate front, Intel has ported Android to their Atom processors. Similarly,
    Google has ported Android in their Google TV product, which is built on top of
    Android. There are also projects, such as Android-x86 ([Android-x86, n.d.](Android-x86,
    n.d.)), that have'
  merge: -1
  pgno: 88
- img_proc: false
  md: 'released ported versions of Android running on Intel''s x86 architecture. Some
    of the platforms supported include many of the Eee PC models and the Lenovo ThinkPad
    x61 Tablet.


    # Baseband Modem/Radio


    The baseband modem and radio are hardware and software systems that provide Android
    devices a connection to the cellular network. This allows both voice and data
    communication from the device.


    Instead of occupying the main CPU with these activities, device designers typically
    leverage a dedicated component to manage the complexities of cellular communication.
    Thus, although the CPU may direct the overall activities of the device, the baseband
    modem manages cellular communication.


    Throughout this book, we will use the terms *baseband*, *baseband modem*, and
    *radio* interchangeably. Although these systems are complex and certain nuances
    may be overlooked in this definition, the distinctions are not significant for
    forensic analysts.


    # Memory (Random-Access Memory and NAND Flash)


    Android devices, because they are at some level simply computers, need various
    types of memory to operate. The two primary types of memory required are volatile
    (random-access memory [RAM]) and nonvolatile (NAND flash) memory.


    The RAM is used by the system to load, execute, and manipulate key parts of the
    OS, applications, or data. RAM is volatile, meaning that it does not preserve
    its state without power.


    However, NAND flash memory (we will refer to this memory simply as NAND flash)
    is nonvolatile, and thus, the data are'
  merge: -1
  pgno: 89
- img_proc: false
  md: 'preserved after the device has been powered off. The NAND flash is used to
    store the boot loader, OS, and user data. It is therefore a critical component
    of any forensic investigation and is similar to a hard drive in a forensic investigation
    of a laptop, desktop, or server. NAND flash also has unique properties that make
    it ideal for mobile devices while at the same time presenting a number of challenges
    for programmers (which often yield unique opportunities for forensic analysts).
    These characteristics will be explored in detail in [Chapter 4](Chapter 4).


    From a hardware perspective, mobile devices obviously have significant space limitations.
    Often, the RAM and NAND flash memory are manufactured into a simple component
    referred to as the multichip package (MCP). When examining Android device components,
    generally the NAND flash and RAM will be packaged as an MCP.


    Although [Fig. 2.1](Fig. 2.1) is specific to the memory manufacturer Hynix (used
    in the Dell Streak and other Android devices), this overall architecture is a
    good depiction of MCP components that include not only the NAND flash and RAM
    but also the packaging options to suit various devices.'
  merge: -1
  pgno: 90
- img_proc: false
