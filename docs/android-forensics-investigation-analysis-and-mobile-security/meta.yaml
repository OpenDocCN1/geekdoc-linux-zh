  md: "# Auto-mounting USB devices\n\nIn the Ubuntu VM configuration section of Chapter\
    \ 1, the auto-mount feature is disabled to prevent the OS from automatically detecting\
    \ and mounting USB mass storage devices. Forensic analysts should take extreme\
    \ precautions to prevent this from happening on a device being investigated. Beyond\
    \ disabling auto-mount, devices should generally be connected through a USB write\
