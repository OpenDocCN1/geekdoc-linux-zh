    mtd4: 000a0000 00020000 "local"

    mtd5: 02800000 00020000 "cache"

    mtd6: 09500000 00020000 "datadata"

    ```


    While we need the OOB data if we want to attempt to mount the YAFFS2 nanddump
    on the Ubuntu workstation, the 64-byte OOB data will definitely cause problems
    for most forensic techniques, notably file carving. To alleviate this problem,
