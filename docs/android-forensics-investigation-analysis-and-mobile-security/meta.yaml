  md: '# Installation


    Paraben DS version 4.1.3971.37683 was installed on the Windows forensic workstation.
    The setup process required the installation of many required drivers that took
    a considerable amount of time. The software must be registered prior to use, which
    is achieved either using a hardware dongle or through a registration key file
    provided by Paraben. To install the registration key file, you simply copy the
    file into the DS install directory, which is likely C:\Program Files\Paraben Corporation\Device
    Seizure.


    # Acquisition


    To start the acquisition of a new Android device, you first open a new case and
    complete the required case information section. You then choose “Data Acquisition”
    and select Android at which point the following directions are provided:


    ```

    Android based cell phones must be placed into "debugging" mode*. Follow the instructions
    below:

    1. On the cell phone, navigate to Settings>Application Settings and select the
    Unknown Sources option.

    2. On the cell phone, navigate to Settings>Application Settings>Development and
    select the USB debugging option.

