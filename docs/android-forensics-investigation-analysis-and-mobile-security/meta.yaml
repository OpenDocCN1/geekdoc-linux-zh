    # YAFFS2


    When the first Android device was released, many people were surprised to see
    a relatively unknown file system play a key role in the system. YAFFS, which is
    an acronym for Yet Another Flash File System, is an open-source file system developed
    specifically for NAND flash and is licensed under both the GNU Public License
    (GPL) and a commercial license agreement for those who do not wish to follow the
    strict GPL guidelines ([YAFFS licence FAQs, n.d.](http://yaffs.net)). Android
    devices use the latest release of YAFFS (YAFFS2) that follows more strict NAND
    flash guidelines meant to improve the endurance of the NAND flash while optimized
    to run on low-memory mobile or embedded devices.


    YAFFS2 was developed by Aleph One Ltd, a company based in New Zealand. Driven
    by customer requests, Aleph One began YAFFS design in December 2001 and released
    the first publicly available source code in May 2002. The primary developer (or
    certainly the most visible) is Charles Manning who is described as "The Embedded
    Janitor" and has been developing and "mopping up" embedded systems for 20 years
    ([YAFFS: the NAND-specific flash, n.d.](http://yaffs.net)). Charles is quite active
    on the YAFFS mailing list and is the de facto expert on YAFFS and YAFFS2.


    > ## Tip


    **Additional YAFFS2 resources**


    Analysts and engineers interested in the internals of YAFFS2 are encouraged to
    read the full documentation (and source code, if that''s your thing) from [http://www.yaffs.net/](http://www.yaffs.net/)
    and sign up for the mailing list.


    YAFFS2 was built specifically for the growing NAND flash devices and has a number
    of important features that address the stringent needs of this'
