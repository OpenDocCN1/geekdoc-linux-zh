  md: 'Gudjonsson, is a framework for automatic creation of a timeline that encompasses
    various log files and artifacts found on the system. log2timeline can be utilized
    on many systems and does an excellent job at extracting time stamp information
    for many file formats for analysis.


    As we already have TSK setup, we need to take a few steps to install log2timeline.
    First, it has probably been a while since you first built the Ubuntu workstation
    so it is a good idea to update any packages which have newer versions and often
    contain security patches or bug fixes.


    ```

    sudo apt-get update

    sudo apt-get upgrade -u

    ```


    The first step updates your software list and the second will actually perform
    the upgrade. Next, we''ll install log2timeline, which Kristinn has greatly simplified
    by creating a Ubuntu package for his software.


    ```

    sudo add-apt-repository "deb http://log2timeline.net/pub/ maverick main"

    wget -q http://log2timeline.net/gpg.asc -O- | sudo apt-key add -

    sudo apt-get update

    sudo apt-get install log2timeline-perl

    ```


    The four commands do the following:


    +   1. Add the log2timeline custom software repository to the Ubuntu workstations
    overall list.

    2. Download the public key used to validate the software and add to the list of
    accepted keys.'
