  md: '| Block | Chunk | ObjectId | ChunkId | Status (Live or Shrink/Delete) | Comment
    |

    |---|---|---|---|---|---|

    | 0 | 0 | 500 | 0 | Shrink/delete | Obsoleted ObjectHeader. Originally for blank
    file, length of 0 |

    | 0 | 1 | 500 | 1 | Shrink/delete | Obsoleted first chunk of data |

    | 0 | 2 | 500 | 2 | Shrink/delete | Second chunk of data |

    | 0 | 3 | 500 | 3 | Shrink/delete | Third chunk of data |

    | 1 | 0 | 500 | 0 | Shrink/delete | Obsoleted ObjectHeader, file length 3 |

    | 1 | 1 | 500 | 1 | Shrink/delete | New first chunk of data |

    | 1 | 2 | 500 | 2 | Shrink/delete | New ObjectHeader, file length 3 |

    | 1 | 3 | 500 | 3 | Live | New ObjectHeader, file length 0 |


    As the file was truncated, none of the chunks in Block 0 are in use any longer.
    This makes the block available for garbage collection, which will occur on the
    next write cycle. This is referred to as lazy garbage collection because it uses
    an existing write cycle to perform any necessary garbage collection. As before,
    a new Object-Header is written to the NAND flash to account for the truncated
    file.


    Finally, we rename the file and the NAND flash results are shown in Table 4.11.


    **Table 4.11** Rename File and Write New ObjectHeader'
  merge: -1
