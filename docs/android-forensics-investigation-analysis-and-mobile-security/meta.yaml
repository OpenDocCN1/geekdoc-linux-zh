  md: '+   - Man-in-the-middle (MITM) attacks

    - MITM Secure Sockets Layer (SSL) attacks

    - DNS spoofing attacks (including */etc/hosts*)

    - TMSI overflow baseband attacks


    The baseband attacks are a very new technique focusing on the cellular modem (baseband)
    firmware. According to Ralf-Philipp Weinmann who presented his exploit at the
    DeepSec 2010 conference, the baseband firmware is code written in the 1990s. Until
    recently, the technologies behind the GSM networks were poorly understood. However,
    over time researchers have unraveled the protocols and hardware and today it is
    possible to create a rogue GSM station with readily available hardware powered
    by open source software. With control over the GSM network, an attacker can execute
    a TMSI overflow attack that causes a heap overflow in the GSM baseband stack of
    Apple iOS devices prior to 4.2. This attack can lead to remote code execution
    on the baseband processor ([Ralf-Philipp Weinmann, n.d.](http://)).


    While the baseband attack is cutting edge security work, the MITM attacks have
    been around much longer and are well understood and fairly easily executed. Generally,
    these techniques require the attacker to fully control a computer that is between
    the mobile device and the ultimate destination the device is trying to communicate
    with. In addition, the attacker may control key network services or devices such
    as a network switch, Wi-Fi access point, or DNS server, facilitating the attack.


    Once the attacker is able to position their computer between the Android device
    and the ultimate destination, they can launch the attack. For this scenario, let
    us assume an Android device connects'
