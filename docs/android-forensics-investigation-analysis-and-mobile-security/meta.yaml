    # Timeline Analysis


    Timeline analysis should be a key component to any investigation as the timing
    of events is nearly always relevant. There are many ways to build a forensic timeline.
    However, unless created with specialized software, the process can be quite tedious.
    Several software techniques will be covered in detail later in the chapter including
    free, open source forensic utilities from both The Sleuth Kit and log2timline.
    Other forensic tools can create timelines as well.


    For supported file systems (for example, the FAT16/FAT32 file systems found on
    the SD cards and embedded MultiMediaCard [eMMC]), a number of tools are available
    which can create the timeline. However, YAFFS2 is not currently supported by any
    analysis tool and so creating a timeline requires significant manual analysis.


    The primary source of timeline information is the file system metadata including
    the modified (file metadata), accessed, changed (file contents), and created.
    This metadata is often referred to as MAC times or sometimes MACB where the "B"
    represents when a file was created (born). File systems track different time stamps
    and have nuances that must be taken into account when performing forensic analysis.


    For example, Microsoft''s FAT file system has been the subject of many forensic
    investigations and analyses. The Microsoft Developers Network (MSDN) provides
    details on file times in FAT and NTFS file systems, stating:'
  merge: -1
  pgno: 462
- img_proc: false
  md: 'Not all file systems can record creation and last access times, and not all
    file systems record them in the same manner. For example, the resolution of create
    time on FAT is 10 ms, while write time has a resolution of 2 s, and access time
    has a resolution of 1 day, and hence, it is really the access date. The NTFS file
    system delays updates to the last access time for a file by up to 1 h after the
    last access.


    (File Times, n.d.)


    Andre Ross created a useful graphical representation of this on his digfor (DIGital
    FOrenscics) blog (http://digfor.blogspot.com/2008/10/time-and-timestamps.html)
    shown in Fig. 7.1 (Ross, A., n.d.).


    ![](bbox=[0.05, 0.4, 0.9, 0.78])


    **FIGURE 7.1** FAT and NTFS time and time stamps.


    To further illustrate how FAT time stamps work, digital forensics and incident
    response firm cmdLab posted a blog entitled'
  merge: -1
  pgno: 463
- img_proc: false
  md: '"Misinterpretation of File System Timestamps" (Casey, E., n.d.), which provides
    full details on FAT time stamps.


    The confusion arises from the fact that FAT file systems represent create and
    last-write time stamps slightly differently. Last-write time stamps are 32-bit
    little-endian values, interpreted as follows:


    ```

    24                    16               8               0

    +-+-+-+-+-+-+-+-+-+-+-+-+ +-+-+-+-+-+-+-+-+ +-+-+-+-+-+-+-+-+ +-+-+-+-+-+-+-+-+

    |Y|Y|Y|Y|Y|Y|Y|M| |M|M|M|D|D|D|D|D| |h|h|h|h|h|m|m|m| |m|m|m|s|s|s|s|s|

    +-+-+-+-+-+-+-+-+-+-+-+-+ +-+-+-+-+-+-+-+-+ +-+-+-+-+-+-+-+-+ +-+-+-+-+-+-+-+-+

    \_____/\____/\____/ \_____/\_________/\_____/

    year   month   day     hour    minute   second

    ```


    Take as an example the following FAT folder entry with the last-write date highlighted
    in bold:


    ```

    $ icat /dev/sdb1 353884 | xxd

    0000000: 2e20 2020 2020 2030 004f b079 . O.O.y

    0000010: 763a 763a 0000 b579 763a a502 0000 0000 v:v:...yv:.....

    0000020: 2e2e 2020 2020 2020 004f b079 .. ..O.y

    0000030: 763a 763a 0000 b079 763a 6605 0000 0000 v:v:...yv:f....

    0000040: 4173 0061 006c 0076 0065 000f 009e 6e00 As.a.l.v.e....n.

    0000050: 6500 7700 3400 2e00 6700 0000 6900 6600 e.w.4...g...i.f.

    0000060: 5341 4c56 454e 7e31 4749 4620 0075 78b9 SALVEN~1GIF .ux.

    0000070: 753a 763a 0000 78b9 753a 9212 c1d4 0000 u:v:...x.u:.....

    0000080: 4269 0066 0000 00ff ffff ff0f 0014 ffff Bi.f............

    0000090: ffff ffff ffff ffff ffff 0000 ffff ffff ................

    ```


    Converting to big endian gives 3a 75 b9 78, which has the following binary representation:


    ```

    00111010 01110101 10111001 01111000

    ```


    This translates to a time stamp of 2009.03.21 23:11:48 as follows:


    +   - 7 bits = 0011101 = 29 years since 1980'
  merge: -1
  pgno: 464
- img_proc: false
  md: '+   - 4 bits = 0011 = 3 months

    - 5 bits = 10101 = 21 days

    - 5 bits = 10111 = 23 h

    - 6 bits = 001011 = 11 min

    - 5 bits = 11000 = 24 = 48 s


    Note that 5 bits cannot store all 60 s, so last-write time stamps must be incremented
    in 2 s intervals, and are always an even number of seconds.


    Although the create time follows a similar general calculation, it uses an additional
    8 bits to represent one hundredths of a second. In the same directory listing
    above, the create time stamp is identical to the last modified time stamp except
    for an additional byte (75 78 b9 75 3a). The additional byte equates to 117 hundredths
    of a second, which brings the create time to 2009.03.21 23:11:49.17. Thus, the
    create time can have an odd number of seconds, and has a resolution of 10 ms.


    One tool used in this book for timeline analysis is The Sleuth Kit (TSK), which
    supports several file systems. The TSK wiki provides the information presented
    in Table 7.1 to define the meaning of MACB time stamps for the supported file
    systems (Carrier, B., n.d.).


    **Table 7.1** MAC Meaning by File System


    | File System | m | a | c | b |

    |---|---|---|---|---|

    | Ext 2/3 | Modified | Accessed | Changed | N/A |

    | FAT | Written | Accessed | N/A | Created |

    | NTFS | File modified | Accessed | MFT modified | Created |

    | UFS | Modified | Accessed | Changed | N/A |'
  merge: -1
  pgno: 465
- img_proc: false
  md: 'Unfortunately, TSK does not, as of version 3.2.1, fully support YAFFS2. However,
    there are some efforts to provide this information. For Android, TSK is effective
    in analyzing the FAT file systems as well as EXT3 which is found on some devices.
    TSK does not yet fully support EXT4 but the software is updated frequently and
    examiners should check the web site http://www.sleuthkit.org/ for the most recent
    changes.


