    └── albumthumbs\n    ├── 1283015214003\n    ├── 1283015215018\n    ├── 1283015215425\n\
    \    ├── 1283015215861\n    ├── 1283015216304\n    └── 1283015216711\n```\n\n\
    As you can tell, developers have great control over the name, format, and location\
    \ of files on the external and emulated SD cards.\n\n# SQLite\n\nAnother NAND/SD\
    \ card-based storage that developers leverage is a specific type of file—an SQLite\
    \ database. Databases are used for structured data storage and SQLite is a popular\
    \ database format appearing in many mobile systems as well as traditional operating\
    \ systems.\n\nSQLite is popular for many reasons. Notably the entire code base\
    \ is of high quality, open source, and released to the public domain. The file\
    \ format and the program itself are very compact and pack significant functionality\
    \ in less than a few hundred kilobytes. Unlike more traditional relational database\
    \ management systems (RDBMS), such as Oracle, MySQL, and Microsoft’s SQL Server,\
    \ with SQLite the entire database is contained in a single cross-platform file.\n\
    \nThe Android SDK provides dedicated APIs that allow developers to use SQLite\
    \ databases in their applications. The SQLite files are generally stored on the\
    \ internal storage under /data/data/<packageName>/databases. However, there are\
    \ no restrictions on creating databases elsewhere.\n\nSQLite databases are a rich\
    \ source of forensic data. The built-in Android browser, based on the WebKit Open\
    \ Source Project (http://webkit.org/), provides a great example. In our referenced\
    \ HTC Incredible, there were 28 SQLite databases located in subdirectories of\
    \ /data/data/com.android.webkit. In this instance, the five subdirectories were\
    \ as follows:"
