    # Files on Internal Storage


    Files allow developers to store more complicated data structures and are saved
    in several places on the file internal storage. The files are stored in the application''s
    /data/data subdirectory and the developer has control over the file type, name,
    and location. By default, the files can only be read by the application and even
    the device owner is prevented from viewing the files unless they have root access.
    The developer can override the security settings to allow other processes to read
    and even update the file.


    > **Tip**


    ### Identifying custom files


    The best way to determine which files in an application''s subdirectory fall into
    this category is by a process of elimination. Basically, any file in the application''s
    /data/data/ subdirectory which is *not* in the shared_prefs, lib, cache, or databases
    subdirectories is a file the developer created and controls.


