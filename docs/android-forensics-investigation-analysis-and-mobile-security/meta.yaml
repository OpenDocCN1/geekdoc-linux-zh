  md: 'Memory analysis of an Android device can provide deep insight into the device''s
    internal structure as well as key information about the device owner. Over time,
    expect more solutions in the market to address analysis of Android memory.


    # NAND Flash


    Unlike RAM, NAND flash is nonvolatile and thus the data are preserved even when
    the device is without power or rebooted. The NAND flash is used to store not only
    system files but also significant portions of the user''s data.


    NAND flash memory has characteristics very different from the magnetic media found
    in modern hard drives. These properties make NAND flash ideal storage for mobile
    devices, while at the same time presenting a number of challenges for programmers
    and opportunities for forensic analysts.


    First, NAND flash has no mechanically moving parts like the spinning platters
    and arms found in traditional magnetic hard drives. This improves the durability
    and reduces both the size and power consumption of the device. The memory is distributed
    as one or multiple chips, which often integrate both NAND flash and RAM (MCP,
    see Chapter 2) and are directly integrated into the circuit board of the device.


    NAND flash also has very high density and is cost effective to manufacture. This,
    of course, makes it very popular with manufacturers. One side effect of the manufacturing
    process and technology in general is that NAND flash literally ships with bad
    blocks directly from the manufacturer. The manufacturer will generally test the
    memory as part of the manufacturing process and mark bad blocks in a specific
    structure on the NAND flash, which is described in their documentation. Software,
    which then directly interacts with the NAND flash, can read the manufacturer''s
    bad block markers and will often implement a bad block table that can logically
    track the bad blocks on the system and remove them from operation. This greatly
    speeds up bad block detection and management. So while NAND flash is more physically
    durable than spinning platters, its error rate is much higher and must be accounted
    for in development and use.'
  merge: -1
  pgno: 208
- img_proc: false
  md: 'Another significant limitation of NAND flash is that it has a very limited
    write/erase life span before the block is no longer capable of storing data. The
    life span varies by device and is largely impacted by the amount of data stored
    per NAND flash cell, the central building block for storing the 1 or 0 bit(s).
    If the cell only stores a single bit (single-level cell or SLC) then the NAND
    flash is rated around 100k write/erase cycles for one-year data retention. However,
    NAND flash rarely uses SLC as manufacturers (and consumer) demand more data storage
    in similarly sized or smaller devices. The technology has moved to multilevel
    cells (MLC) where a cell can store two, three, or even more bits per cell. However,
    this not only complicates the manufacturing process and slows down the write/erase
    cycle, but it also significantly reduces the endurance of the device. A typical
    MLC NAND flash storing two bits per cell experiences a 10-fold reduction in endurance
    (measured as one-year data retention) with a value of approximately 10k write/erase
    cycles. As the bit density per cell increases, the endurance continues to drop,
    which obviously must be addressed by the controlling device.


    Unlike RAM and NOR flash which is also flash memory and typically used in systems
    such as a computer''s Basic Input Output System or BIOS, NAND flash cannot be
    accessed randomly. Instead, access to data is achieved via an allocation unit,
    called a page or chunk, which is typically between 512 and 2048 bytes, but generally
    increases as the overall size of NAND flash increases. Even though NAND flash
    does not provide the fast random access like RAM, access time is still quite fast
    because it does not require the mechanical platter and arm movements used in traditional
    spinning hard drives.


    # Note


    # Page versus chunk


    Throughout this book, we will use the word page and chunk synonymously to refer
    to the low-level data allocation unit referenced in NAND flash. While the allocation
    unit is usually referred to as a'
  merge: -1
  pgno: 209
- img_proc: false
  md: '> page, the YAFFS2 file system, which is a key component of Android, generally
    refers to the allocation unit as a chunk.


    The chunks are then organized into a larger logical unit called a block, which
    is typically much larger than a traditional 512B hard drive sector. In most Android
    devices, the NAND flash blocks contain 64 chunks of data and each chunk is 2048
    bytes. Taking 64 × 2 KB yields a block size of 128 KB. Of course, this can and
    will change over time and is controlled by the NAND flash manufacturers. When
    a block is allocated for writing, the chunks inside the block are written sequentially.


    Another very important characteristic of NAND flash is the operations available
    for reading and writing:


    +   - Read (page)

    - Write (page)

    - Erase (block)


    While individual chunks can be read or written, the erase operation only functions
    at the block level. When a block is erased, the entire block is written over with
    1''s or 0xFF (hex).


    > **Note**


    **NAND flash erase operation**


    *The erase operation is the only mechanism by which a 0 can be changed to a 1
    in NAND flash.* This point is worth belaboring. In a traditional hard drive, if
    a value is changed from a 0 to a 1 (or vice versa), the program would simply seek
    to the value on the hard drive and apply the appropriate voltage to change and
    store the new value. However, the fundamental architecture of NAND flash provides
    only one mechanism to change a 0 to a 1 and that is via the erase function that
    is applied at the block level, not an individual page level. For this reason,
    a page can only be written once, and if the value of the page needs to change,
    the entire block must be erased and then the page can be written.'
  merge: -1
  pgno: 210
- img_proc: false
  md: 'Here is a specific example using a single byte for simplicity: Let''s say this
    particular byte holds the decimal value 179 and we want to add 39 for a total
    value of 218. For those unfamiliar with converting numbers between base10, hex
    (base16), and binary (base2), the built-in calculator programs in Windows, Mac
    OS X, and Ubuntu Linux provide a programmer mode that will perform the conversions.
    For the numbers above, we have the conversions between numbering systems shown
    in [Table 4.4](#).


    | Decimal (base10) | Hex (base16) | Binary (base2) |

    | 179 | 0xB3 | 1011 0011 |

    | 218 | 0xDA | 1101 1010 |


    So the value 179 contains three 0''s and two of them need to change to a 1 to
    present our new value of 218. However, NAND flash cannot make that change without
    erasing the entire block. So, if this single byte was attempted without the erase,
    the result would be 146, not 218. Here is how this happened:


    ```

    1011 0011 (original byte, 0xB3 or 179 decimal)

    1101 1010 (new byte to write, 0xDA or 218 decimal)

    ---------

    1001 0010 (resulting byte, 0x92 or 146 decimal)

    ```


    As the byte did not contain all 1''s (0xFF), the only portions of the write cycle
    that succeeded were 1''s either remaining a 1 or changing to a 0. Anytime the
    write function encountered a 0 and was requested to change to a 1, it would fail
    and simply retain the 0 value. The resulting byte was 0x92 or 146 base10—clearly
    not the value intended. Another way to describe the write function is that it
    only changes the charged 1 values to a 0 where requested, the equivalent of the
    "logical and" of the two values.'
  merge: -1
  pgno: 211
- img_proc: false
  md: 'In summary, a chunk can only be written once, and if it needs to be re-written,
    the entire block must first be erased.


    As you can tell, NAND flash imposes various restrictions and limitations and thus
    developers and file systems must be flash aware to effectively work within the
    constraints. Unlike traditional hard drives that ship with firmware to manage
    the device (including bad block), the NAND flash used in Android devices does
    not ship with a controller. All management of the memory must be implemented in
    software interfacing with the NAND flash. Two important techniques deployed are
    error-correcting code (ECC) and wear-leveling. Both have significant implications
    for forensics and data recovery.


    First, ECC is a technique where an algorithm is used to detect data errors on
    read or write operations and correct some errors on the fly. Since NAND flash
    degrades over time through usage, the system must be able to detect when a page
    or block is going bad and recover the data stored there. After a number of errors
    or failed operations is exceeded (typically three failed operations), the page
    or block will be marked bad and added to the bad block table.


    The second important algorithm used to effectively manage NAND flash on Android
    is the wear-leveling code that spreads the writing of data across the entire NAND
    flash to avoid overutilization of a single area, thus wearing those blocks out
    more quickly.


    Many hardware devices that use NAND flash, such as removable USB thumb drivers
    and solid state drives (SSD), have controller logic bundled with the device, which
    provides the functions described above including bad block management, wear-leveling,
    and error-correcting code. However, Android devices were designed to integrate
    the NAND flash components directly, and thus a software management layer was needed
    to provide these important functions. The layer selected to manage the NAND flash
    was the Memory Technology Device (MTD) system.


    MTD was developed to address the need of NAND flash and similar devices due to
    their unique characteristics. Prior to MTD, Linux supported primarily character
    devices and block devices. Neither device type addresses the'
  merge: -1
  pgno: 212
- img_proc: false
  md: 'unique properties of the newly developed memory devices. Additionally, while
    NAND flash was not strictly a block device (like traditional hard drives), exposure
    of block device characteristics to developers aided in development and support.
    By leveraging MTD, Android now had the necessary Flash Transition Layer (FTL)
    needed to effectively interact with the NAND flash. By taking this approach, Android
    did not lock manufacturers into using a small subset of NAND flash providers and
    associated controllers. Instead, they are free to use any NAND flash available
    and then "simply" integrate with MTD, which supports a wide range of NAND flash.


    In Android, the MTD provides not only the block interface to the NAND flash but
    also the ECC, wear-leveling, and other critical functions. The ECC and other chunk
    metadata are stored in a reserved area called the out of band (OOB) or spare area.
    The OOB is located directly after each chunk on the NAND flash. While the chunk,
    block, and OOB layout is configurable, most Android devices to date have a 128
    KB block consisting of 64 2,048 byte (2k) chunks each with a 64 byte OOB as shown
    in Fig. 4.1.


    ![](bbox=[0.29, 0.5, 0.71, 0.64])


    **FIGURE 4.1** Block (128 KB = 64 × 2k chunks + OOB).


    The OOB not only stores information managed by MTD, but can also store metadata
    critical to the file system, provided the file system is NAND flash aware. While
    the system presents the block as 128 KB, when you add in the 64 OOB, each 64 bytes
    in size, there is an additional 4096 bytes (4 KB) bringing the total bytes used
    on the NAND flash to 132 KB.


    On Android devices, you can determine the MTD partitions by viewing the /proc/mtd
    file. On our reference HTC Incredible, we have the following:'
