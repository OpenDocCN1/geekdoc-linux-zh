  md: 'Valuable information about the device can be found in the proc file system.
    Examiners can audit these files and should start with files in the /proc directory
    instead of the subdirectories.


    # tmpfs


    tmpfs is a file system that stores all files in virtual memory backed by RAM and,
    if present, the swap or cache file for the device. Most Android devices at this
    time do not have swap space. However, some aftermarket firmware enables this feature.
    The advantage of tmpfs is that by using RAM, the storage is very fast and also
    nonpermanent and hence not saved on reboot.


    Of course, for forensic examiners, this poses a challenge. If important data are
    located on a tmpfs mount point, it must be collected before the device is rebooted
    or loses power. It also presents a unique opportunity because the tmpfs is often
    readable by the shell user and forensic programs can be copied and executed in
    tmpfs without modifying the NAND flash or SD card. This may allow an examiner
    to acquire forensic data from an Android device without modifying the NAND flash
    or SD card in any way.


    > **Warning**


    ### Investigating tmpfs


    If your primary interest is in memory analysis of the device, making changes to
    tmpfs is not advised unless you first have a forensic copy of the parts of memory
    you are interested in.


    On the HTC Incredible, the standard installation has four tmpfs mount points:


    +   - /dev

    - /mnt/asec

    - /app-cache

    - /mnt/sdcard/.android_secure'
  merge: -1
  pgno: 222
- img_proc: false
  md: 'The /dev directory contains device files that allow the kernel to read and
    write to attached devices such as NAND flash, SD card, character devices, and
    more. The /mnt/asec and /mnt/sdcard/.android\_secure directories are a relatively
    new addition to Android and allow apps to be stored on the SD card instead of
    /data/data, which provides more storage.


    Interestingly, the /app-cache is also a new addition and appears to provide tmpfs
    space, which apps can use. On the HTC Incredible, the Web Browser (com.andrew.browser)
    created a directory in /app-cache and stores cache files from web browsing.


    ```

    ahoog@ubuntu:~$ adb shell ls -l / | grep app-cache

    drwxrwxrwt root    root            2011-01-31 15:42 app-cache


    ahoog@ubuntu:~$ adb shell

    $ ls -l /app-cache

    drwxr-xr-x app_12  app_12          2011-01-31 15:42 com.android.browser

    ```


    From the first listing, we can see that the app-cache directory has read, write,
    and browse permissions set for all users. In addition, the final "t" in the permissions
    "rwxrwxrwt" indicates that only root or the owner of the directory can delete
    or rename the directory.


    The second listing shows the directory''s inside app-cache, which only has com.android.browser.
    However, as we dig deeper into the directory, we discover the directory and files
    we are most interested in only allow the app itself (com.android.browser, user
