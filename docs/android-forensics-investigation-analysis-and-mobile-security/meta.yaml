    # Analyst Notes


    Analyst notes for /data/data/com.android.browser:


    +   - Check the WebpageIcons.db in app_icons if looking for a particular site
    and the site has a favicon.

    - The specific app databases can contain very useful information. For example,
    Google app database has previous search terms, many versions of cached “lon/lat/acc”
    with time stamps and more.

    - The com.adobe.flashplayer directory contains not only “Flash cookies,” which
    end in the .sol extension and can be parsed by log2timeline, but also some of
    the Flash .swf files.

    - The browser database (databases/browser.db) contains a table called bookmarks,
    which is generally pre-populated with bookmarks from the wireless carriers. This
    same table also'
  merge: -1
  pgno: 562
- img_proc: false
  md: 'contains the web browser history. There is also a table called Searches, which
    contains Google searches made from the browser.


    +   - The web view database (databases/webview.db) contains considerable information
    not only useful for a forensic examiner but also a security engineer. Cookies
    are visible and most are not secure, meaning they may be vulnerable to a cookie
    hijacking attack using a tool such as Firesheep. Form URL and data often contain
    sensitive information as do httpauth and password.


    +   - The web view cache database (databases/webviewCache.db) provides the metadata
    about the cache files stored in cache directory.


    +   - Most devices save the web view cache data as a subdirectory in /data/data/com.android.browser.
    However, the HTC Incredible moved this directory to a tmpfs (RAM disk) directory.


