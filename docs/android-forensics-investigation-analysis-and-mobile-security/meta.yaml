    # Global Positioning System


    Undoubtedly one of the most important innovations in mobile devices since the
    inclusion of cellular communication has been integration of the Global Positioning
    System (GPS) into the core offering. This functionality not only identifies the
    location of the device using the GPS satellite network but also allows for applications
    such as point-to-point directions, position-aware applications, and, undoubtedly,
    many more interesting uses in the future.


    # Wireless (Wi-Fi.com and Bluetooth)


    Beyond the cellular networks, most devices allow for additional wireless technologies,
    such as Wi-Fi.com for high-speed data'
  merge: -1
  pgno: 91
- img_proc: false
  md: 'connection and Bluetooth for connections to external devices such as headsets,
    keyboards, printers, and more. In fact, some devices may omit the cellular network
    connection, which not only reduces the cost and complexity of the device but also
    eliminates a monthly recurring charge for the consumer. These devices may be designed
    for home use only (e.g., a home phone or multimedia device) or for offline mode
    for those times when a Wi-Fi.com connection is not available (i.e., tablet or
    e-reader).


    # Secure Digital Card


    Most Android devices ship with a removable memory card referred to as their Secure
    Digital (SD) card. Like the on-device NAND flash, SD cards are nonvolatile and
    also use NAND flash technology. However, because the SD cards were designed to
    be portable, they must adhere to various physical and communication specifications
    that allow them to interoperate with most devices.


    The SD card is one obvious design difference between most Android devices and
    the popular Apple iPhone. The iPhone is designed with 4GB to 32GB of NAND flash
    on-board and does not provide for SD cards. Although more expensive, this provides
    the device manufacturer (Apple, in this case) with far more control over the device.
    In the case of Android, larger user files are intended to be stored on the SD
    card. This not only provides a less expensive and easily upgradeable memory option
    for consumers but is also portable, so if a consumer purchases a new phone, they
    can easily transfer data using their existing SD card.


    Recent HTC phones (notably the HTC Incredible) have provided the standard SD card
    interface but did not ship with an SD card'
  merge: -1
  pgno: 92
- img_proc: false
  md: 'installed. Instead, they created an emulated SD card by carving a portion of
    the on-board NAND memory and presenting it as an SD card. This adds additional
    complexity for the forensic analysts. Analysts must first determine whether there
    is an SD card, an emulated SD card, or some other means of user data storage (in
    addition to the on-board NAND flash).


    # Screen


    The screen on an Android device is obviously a critical component. It is the primary
    interface for user interaction, not only through the visual display but also by
    responding to the user''s touch. The technologies behind the display are the focus
    of intense development. Early iterations included a liquid crystal display and
    a second layer that detects user input on the screen. Recent improvements include
    higher display resolution, brighter screens, more sensitive and complicated user
    touch interactions, and reduced power consumption. In fact, some recent Android
    smartphones, such as those using Samsung''s Super AMOLED technology, have been
    well received by consumers due largely to the screen capabilities.


    # Camera


    Initially cameras on smartphones were used to take pictures. Although an exciting
    development at the time, there has been significant innovation in this area too.
    Most devices now also support video recording (some in high definition). Of course,
    cameras have increased in their quality and now often include an integrated flash.'
  merge: -1
  pgno: 93
- img_proc: false
  md: 'Recently, some devices include two cameras. The first, on the back of the device,
    is used for external pictures and videos. A second front-facing camera allows
    for new applications such as videoconferencing.


    Most Android devices also combine the camera functionality with the GPS; hence,
    you can record not only the date and time of a picture but also the GPS coordinates.
    You can then easily upload or share the picture using the network or perhaps send
    them through the Multimedia Messaging Service (MMS) of the cellular provider.


    One interesting development in this area is the use of cameras to read bar codes.
    Specialized applications leverage the camera to take a picture of a bar code and
    then analyze the data. It might look up product reviews, determine the best price,
    or automatically check you into a restaurant’s application so that you can rate
    experiences. Perhaps in the future, these apps may even allow you to pay for items
    you wish to purchase.


    An early implementation of this is a Google app called Goggles. The user can take
    a picture of anything, and the app attempts to identify the object. An interesting
    example, provided by Google, was tourists using the app to identify landmarks
