  md: 'Of the 18 file systems supported by the HTC Incredible, only five are backed
    by a physical device such as NAND flash or the SD card. The remaining file systems
    have the “nodev” property, which means that they are essentially virtual file
    systems that are not written to any physical device. Furthermore, only six of
    the nodev file systems are actually used on the device:


    +   1. rootfs

    2. tmpfs

    3. cgroup

    4. proc

    5. sysfs

    6. devpts


    And three of the device-backed file systems are used:


    +   1. ext3

    2. yaffs2

    3. vfat


    The following sections provide a brief overview of most file systems, and an in-depth
    analysis of YAFFS2, where significant user data are stored.


    # rootfs, devpts, sysfs, and cgroup File Systems


    Many file systems in Linux are used to boot, operate, or manage the system and
    often will not contain information useful in a forensic investigation. However,
    security engineers and researchers may closely examine these file systems, and
    the kernel’s inner-workings, in an attempt to identify security holes and other
    weaknesses. We will quickly highlight four of the more infrastructure-related
    file systems found in Android. First, rootfs is where the kernel mounts the root
    file system (the top of the directory tree, noted with a forward slash) at startup.
    In order for the kernel to complete the boot process, it needs access to core
    files and libraries, thus'
  merge: -1
  pgno: 216
- img_proc: false
  md: 'the need to mount the root file system. As the kernel finalizes the boot process,
    subsequent file systems are mounted as directories off the root file system. For
    example (and more on this later in the chapter), the root file system would be
    mounted at / and contain key files. Then a more complete system directory would
    be mounted at /system. You can see the root file system and directories by running
    the "ls -l" command from a shell or typing "mount" to see which file systems are
    mounted and in what directory of the root file system.


    The devpts file system is used to provide simulated terminal sessions on an Android
    device, similar to connecting to a traditional Unix server using telnet or ssh.
    Each time a virtual terminal connects, a new node under /dev/pts is created. For
    example, if you have a single adb shell connection to an Android device, /dev/pts
    would show the following:


    ```

    ahoog@ubuntu:/dev/pts$ adb shell

    $ ls -l /dev/pts

    crw------- shell    shell    136,  0 2011-02-01 10:00 0

    ```


    However, in the next example, there are two adb shell connections and one terminal
    app connection from an app installed on the device:


    ```

    ahoog@ubuntu:~$ adb shell ls -l /dev/pts

    crw------- shell    shell    136,  2 2011-02-01 10:02 2

    crw------- app_105  app_105  136,  1 2011-02-01 10:02 1

    crw------- shell    shell    136,  0 2011-02-01 10:00 0

    ```


    As you can see, the original /dev/pts/0 connection exists. However, two additional
    connections are now present and the one from the terminal app is run under the
    app''s unique user id (app_105).


