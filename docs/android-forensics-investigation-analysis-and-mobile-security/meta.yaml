  md: "The debugging provides valuable information including object id, sequence number,\
    \ chunk id, and the detailed process YAFFS2 follows to create the file. If you\
    \ enable additional debugging you will have even more data to correlate and use\
    \ in your understanding of YAFFS2.\n\nBefore we examine the actual nanddump, there\
    \ is one other helpful command worth pointing out. The stat command will provide\
    \ detailed information about a file, directory, or other file system objects.\
    \ For example, we can run stat against \"~/mnt/yaffs2/test\" and \"~/mnt/yaffs2/test/file1.txt\"\
    \ and use the information in our research:\n\n```\nroot@ubuntu:~/mnt/yaffs2# stat\
    \ test\n  File: 'test'\n  Size: 2048        Blocks: 4          IO Block: 4096\
    \   directory\nDevice: 1f00h/7936d Inode: 257         Links: 1\nAccess: (0777/drwxrwxrwx)\
    \  Uid: ( 109/   pulse)  Gid: ( 117/   rtkit)\nAccess: 2011-02-17 15:53:33.000000000\
    \ -0600\nModify: 2011-02-17 15:55:02.000000000 -0600\nChange: 2011-02-17 15:59:00.000000000\
    \ -0600\n\nroot@ubuntu:~/mnt/yaffs2# stat test/file1.txt\n  File: 'test/file1.txt'\n\
    \  Size: 21          Blocks: 1          IO Block: 4096   regular file\nDevice:\
    \ 1f00h/7936d Inode: 258         Links: 1\nAccess: (0777/-rwxrwxrwx)  Uid: ( 109/\
    \   pulse)  Gid: ( 117/   rtkit)\nAccess: 2011-02-17 15:55:02.000000000 -0600\n\
    Modify: 2011-02-17 15:56:13.000000000 -0600\nChange: 2011-02-17 15:59:00.000000000\
    \ -0600\n```\n\nWe now have the Modified, Access, and Change properties of the\
    \ file and directory and, combined with the actions we took to create the data,\
    \ we have enough information to start our research.\n\nIt's time to look at the\
    \ NAND flash, which requires root access. The following command will skip the\
    \ rows of the NAND flash, which are all 0xFF and 0x00 making it easier to see\
    \ trends. Also,"
