    In Chapter 6, we demonstrated how to acquire the two current FAT32 partitions
    on Android devices that contain data. There are many books and articles which
    cover the analysis of FAT32 file systems and this section will not attempt to
    cover those again in detail. However, this section will demonstrate some techniques
    for examining the FAT32 partitions found on Android devices using the Ubuntu workstation.


    # FAT Timeline Analysis


    To build a file system timeline of a FAT32 image, we utilize both The Sleuth Kit
    (TSK) and another great open source forensic tool called log2timeline. The log2timeline
    utility, written by Kristinn'
