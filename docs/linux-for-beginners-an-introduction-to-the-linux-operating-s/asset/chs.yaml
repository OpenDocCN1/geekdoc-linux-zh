  \ Ubuntu 示例中，点击屏幕左角的按钮弹出仪表板。你现在可以开始输入以查找系统中安装的应用程序。\n\n![Ubuntu](img/00018.jpeg\
  \ \"Ubuntu\")\n\nUbuntu\n\n![Ubuntu](img/00019.jpeg \"Ubuntu\")\n\nUbuntu\n\n##\
