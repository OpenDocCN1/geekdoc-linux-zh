  \n## 附录 B：常见问题 (FAQ)\n\n在哪里可以访问书中的链接？\n\n书中涵盖的所有链接以及补充材料可以在 [`www.linuxtrainingacademy.com/lfb`](http://www.linuxtrainingacademy.com/lfb)\
  \ 获取。\n\n什么是 Linux？\n\nLinux 是一种基于 UNIX 的开源系统。\n\n什么是 Linux 内核？\n\nLinux 内核处理运行在系统的软件与硬件之间的交互。要了解更多信息，请访问内核网站\
  \ [`www.kernel.org`](http://kernel.org)。\n\n我应该使用哪个 Linux 发行版？\n\n如果你的目标是最终成为 Linux\
  \ 系统管理员，请关注 CentOS 或 Ubuntu。CentOS 是红帽 Linux (RHEL) 的衍生版本。通常情况下，CentOS 和 RHEL 出现在企业环境中。Ubuntu\
  \ 在云端运营的初创公司和小企业中非常受欢迎。如果你是为了自己的原因使用 Linux，请选择吸引你的发行版。可以参考 [DistroWatch.com](http://distrowatch.com/)\
  \ 的前十大发行版页面。\n\n这里有一些常见的 Linux 发行版：\n\n* [Arch Linux](https://www.archlinux.org/)\n\
  * [Debian](http://www.debian.org/)\n* [Fedora](http://fedoraproject.org/)\n* [LinuxMint](http://www.linuxmint.com/)\n\
  * [Mageia](http://www.mageia.org/)\n* [openSUSE](http://www.opensuse.org/)\n\n还有一些针对特定领域的\
  \ Linux 发行版。关注领域包括教育、极简主义、多媒体、网络/防火墙以及安全。这里只是一些可用的特种发行版的示例。\n\n* [ArtistX](http://artistx.org/)\
  \ - 一个可以将计算机变成全功能多媒体制作工作室的 DVD。\n* [Edubuntu](http://www.edubuntu.com/) - 一个面向教育的操作系统。\n\
  * [live.linuX-gamers.net](http://live.linux-gamers.net/) - 一个专注于游戏的 Live Linux 发行版。\n\
  \n\n\n\n\n- [Mythbuntu](http://www.mythbuntu.org/) - Mythbuntu 是一个专注于构建基于 MythTV\
  \ 的独立 PVR（个人视频录制）系统的 Ubuntu 官方发行版。\n- [Parted Magic](https://partedmagic.com/) -\
