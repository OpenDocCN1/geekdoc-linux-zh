  \n*   [使用 SSH 公钥认证](http://macnugget.org/projects/publickeys)\n\n# 欢迎使用 Shell\n\n\
  当你通过网络登录到服务器时，shell 程序会启动并作为你系统的默认接口。shell 无非一个接受你的命令并执行这些命令的程序。换句话说，shell 是一个命令行解释器。\n\
  \n让我们来看 shell 提示符。\n\n```\nmac:~ bob$ telnet linuxsvr\nTrying 10.0.0.7...\nConnected\
  \ to 10.0.0.7.\nEscape character is '^]'.\nUbuntu 12.04.3 LTS\nlinuxsvr login: bob\n\
  Password: \nLast login: Thu Nov  7 01:26:37 UTC 2013\nWelcome to Ubuntu 12.04.3\
  \ LTS\n\n * Documentation:  https://help.ubuntu.com/\n\n  System info as of Nov\
  \ 7 01:26:52 UTC 2013\n\n  System load:  0.42          \n  Usage of /:   3.1% of\
  \ 40GB \n  Memory usage: 32%           \n  Swap usage:   0%\n  Processes:      \
  \     89\n  Users logged in:     0\n  IP address for eth0: 10.0.0.7\n\nbob@linuxsvr:~$\
  \ \n```\n\n\n\n\n| `/tmp` | 临时空间，通常在重启时清除。 |\n| `/usr` | 用户相关的程序。 |\n| `/var` |\
  \ 可变数据，最重要的是日志文件。 |\n\n## 目录目录列表\n\n以下是您在各种 Linux 系统上可能看到的顶级目录完整列表。其中包含了一些子目录，以清晰地定义顶级目录的作用。您可能永远不会与其中的许多目录进行交互。某些目录会在您遇到的每个系统上存在，例如\
  \ `/usr`。而其他目录则是某些特定 Linux 发行版特有的。你可以安全地浏览此列表，并在实际需要时随时查阅。\n\n| 目录 | 描述 |\n| ---\
  \ | --- |\n| `/` | 称为 \"root\" 的目录。它是文件系统层次结构的起点。注意，这与 root 账户（即超级用户）无关。 |\n| `/bin`\
  \ | 二进制文件和其他可执行程序。 |\n| `/boot` | 启动操作系统所需的文件。 |\n| `/cdrom` | CD-ROM 的挂载点。 |\n\
  | `/cgroup` | 控制组（Control Groups）层级结构。 |\n| `/dev` | 设备文件，通常由操作系统和系统管理员控制。 |\n|\
  \ `/etc` | 系统配置文件。 |\n| `/export` | 共享文件系统。最常见于 Solaris 系统。 |\n| `/home` | 用户家目录。\
  \ |\n| `/lib` | 系统库。 |\n| `/lib64` | 64 位系统库。 |\n| `/lost+found` | 文件系统在执行文件系统检查后存储恢复的文件。\
  \ |\n| `/media` | 用于挂载 CD-ROM 等可移动式介质。 |\n| `/mnt` | 用于挂载外部文件系统。 |\n| `/opt` | 可选或第三方软件。\
  \ |\n| `/proc` | 提供有关运行进程的信息。 |\n| `/root` | root 账户的家目录。 |\n| `/sbin` | 系统管理二进制文件。\
  \ |\n| `/selinux` | 用于显示有关 SELinux 的信息。 |\n| `/srv` | 包含系统提供的数据。 |\n| `/srv/www`\
  \ | Web 服务器文件。 |\n| `/srv/ftp` | FTP 文件。 |\n| `/sys` | 显示并有时配置 Linux 内核已知的设备和总线。\
  \ |\n| `/tmp` | 临时空间，通常在重启时清除。此目录可以被操作系统和用户使用。 |\n| `/usr` | 用户相关的程序、库和文档。`/usr`\
  \ 中的子目录与上述和下述内容相关。 |\n| `/usr/bin` | 二进制文件和其他可执行程序。 |\n| `/usr/lib` | 库。 |\n| `/usr/local`\
  \ | 不属于基础操作系统的本地安装软件。 |\n| `/usr/sbin` | 系统管理二进制文件。 |\n| `/var` | 可变数据，最重要的是日志文件。\
  \ |\n\n## Unix 特有目录\n\nLinux 经常出现在带有其他 Unix 变体的环境中。如果您有需要登录 Unix 服务器的需求，您可能会看到以下某些\
  \ Unix 特有的目录。\n\n| 目录 | 描述 |\n| --- | --- |\n| `/devices` | 设备文件，通常由操作系统和系统管理员控制。\
  \ |\n| `/kernel` | 内核和内核模块。(Solaris) |\n| `/platform` | 平台特定文件。(Solaris) |\n| `/rpool`\
  \ | ZFS 根池目录。(Solaris) |\n| `/net` | 用于挂载外部文件系统。(HP-UX) |\n| `/nfs4` | 用于挂载联邦文件系统域根。(Solaris)\
  \ |\n| `/stand` | 启动 HP-UX 需要的文件。 |\n\n注意，您可能会遇到上述未列出的其他顶级目录。不过，那些很可能是由系统管理员的。\n\
  \n## 应用程序目录结构\n\n应用程序可以遵循操作系统采用的约定。这是一个安装在 `/usr/local` 中名为 `apache` 的应用程序示例目录结构。\n\
  \n| 目录 | 描述 |\n| --- | --- |\n| `/usr/local/apache/bin` | 应用程序的二进制文件和其他可执行程序。 |\n\
  | `/usr/local/apache/etc` | 应用程序的配置文件。 |\n| `/usr/local/apache/lib` | 应用程序库。 |\n\
  | `/usr/local/apache/logs` | 应用程序日志文件。 |\n\n如果安装在 `/opt`，它可能是这样的：\n\n| 目录 | 描述 |\n\
  | --- | --- |\n| `/opt/apache/bin` | 应用程序的二进制文件和其他可执行程序。 |\n| `/opt/apache/etc`\
  \ | 应用程序的配置文件。 |\n| `/opt/apache/lib` | 应用程序库。 |\n| `/opt/apache/logs` | 应用程序日志文件。\
  \ |\n\n将所有应用程序子目录置于 `/opt/app-name` 的另一种常见方案是同时使用 `/etc/opt/app-name` 和 `/var/opt/app-name`。对于我们的\
  \ `apache` 应用程序示例，可能是这样的：\n\n| 目录 | 描述 |\n| --- | --- |\n| `/etc/opt/apache` | 应用程序的配置文件。\
  \ |\n| `/opt/apache/bin` | 应用程序的二进制文件和其他可执行程序。 |\n| `/opt/apache/lib` | 应用程序库。 |\n\
  | `/var/opt/apache` | 应用程序日志文件。 |\n\n有时会安装不属于标准操作系统的应用程序。\n\n\n\n\n这里是一份基础但重要的命令短列表。在\
  \ Linux 中，命令是区分大小大小的，而且通常全都是小写。被括号 (`[]`) 围起来的项目是可选的。你每次登录 Linux 系统时，很可能会用到这些命令中的至少几个。请熟悉这些命令，因为它们可以让你在短时间内取得很大进展。\n\
  \n- `ls` - 列出目录内容。你将使用 `ls` 来显示文件和目录的信息。\n- `cd [dir]` - 将当前目录更改到 `dir`。如果你在不指定目录的情况下执行\
  \ `cd`，它将把当前目录切回到你的家目录。这就是你在系统中进行导航的方式。\n- `pwd` - 显示当前工作目录名称。如果你不知道自己处于哪个目录，`pwd`\
  \ 会告诉你。\n- `cat [file]` - 合并并显示文件。这是你查看文件内容时使用的命令。\n- `echo [argument]` - 在屏幕上显示参数。\n\
  - `man command` - 显示 `command` 的在线手册。输入 `q` 退出查看手册页。`man` 命令提供的文档通常被称为“man 页（man\
  \ pages）”。\n- `exit`, `logout` 或 `Ctrl-d` - 退出 shell 或当前会话。\n- `clear` - 清除屏幕。\n\
  \n下面是 Bob 使用上述命令的会话截图。\n\n```\n$ ls\nPerformanceReviews sales-lecture.mp3 sales.data\
  \ tpsreports\n$ cd tpsreports\n$pwd\n/home/bob/tpsreports\n$ ls -l\ntotal 2\n-rw-r--r--\
  \ 1 bob users 31 Sep 28 14:49 coversheet.doc\n-rw-r--r-- 1 bob users 35 Sep 27 08:47\
  \ sales-report.txt\n$ cat sales-report.txt\nWe sold lots of widgets this week!\n\
  $ echo $PATH\n/bin:/usr/bin:/usr/sbin:/usr/local/bin\n$ man ls\nNAME\n       ls\
  \ - list directory contents\n...\n```\n\n关于如何充分利用这些简单命令的更多细节将在稍后介绍。但现在，拿起你的鱼竿——你即将开始学习如何钓鱼了。\n\
  \n# 自学钓鱼\n\n了解可执行命令所在的位置以及 `man` 命令可以让你受益匪浅。你可以通过这种方法自学如何使用 Linux，但这是一个漫长而缓慢的过程。通常情况下，`man`\
  \ 命令被用快速参考。要记住每个命令的每一个选项几乎是不可能的，而且当你触手可得 `man` 命令时，也没有必要这样做。\n\n要获取 `man` 命令的帮助，可以在查看手册页时输入字母\
  \ `h`。这将为你提供一个你可以用于导航或搜索的命令列表。以下是简洁版：\n\n- `Enter` - 向下移动一行。\n- `Space` - 向下移动一页。\n\
  - `g` - 移动到页面顶部。\n- `G` - 移动到页面底部。\n- `q` - 退出。\n\n环境变量是一个具有名称和值的存储位置。我们目前感兴趣的是\
  \ `PATH`。`PATH` 环境变量包含包含可执行命令的目录列表。你可以通过在 `PATH` 前面加上美元符号 (`$PATH`) 并使用 `echo` 命令将其值显示在屏幕上来确定其值。\n\
  \n```\n$ echo $PATH\n/bin:/usr/bin:/usr/sbin:/usr/local/bin\n```\n\n当你在提示符处输入命令并按下\
  \ `Enter` 时，系统将在你的 `$PATH` 目录中搜索该命令。在这个示例中，将首先搜索 `/bin`。如果找到了命令，将执行它。如果没有找到，将搜索\
  \ `/usr/bin`，依此类推。如果没有找到匹配你请求的可执行命令，系统会礼貌地告诉你找不到。\n\n```\n$ whatsupdoc\n-bash: whatsupdoc:\
  \ command not found\n```\n\n如果你想确切知道命令位于哪里，可以使用 `which` 命令。如果程序 `cat` 位于 `/usr/bin`\
  \ 和 `/usr/local/bin`，那么执行哪一个取决于你的 `$PATH`。\n\n```\n$ which cat\n/bin/cat\n$ which\
  \ tac\n/usr/bin/tac\n```\n\n将以上所有结合起来，你可以开始查看 `$PATH` 中每个目录的 la，并使用 `man` 命令发现它们每一个的作用以及如何使用。记住，要退出\
  \ man 命令请输入字母 `q`。\n\n```\n$ echo $PATH\n/bin:/usr/bin:/usr/sbin:/usr/local/bin\n\
  $ cd /bin\n$ ls\nawk diff cal cat cp date du echo grep groups less more\n$ man diff\n\
  NAME\n      diff - compare two files\n...\n$ cd /usr/bin\n$ ls\nclear crontab cut\
  \ dos2unix find kill mv pstree pwd sed strings touch ...\n$ man touch\n```\n\n注意，上述\
  \ `ls` 命令的输出被截断了。实际上，`/bin` 和 `/usr/bin` 中可能有成百个命令。\n\n许多命令会提供如何在命令行中使用它们的提示。某些命令接受\
  \ `-h` 标志，另一些接受 `--help`，而某些则拒绝提供任何帮助。\n\n```\n$ cal -h\n\nUsage:\n cal [options]\
  \ [[[\n]]]\n```\n\n## 深度解析\n\n* 环境变量将会有更深入介绍\n\n## 操作目录\n\n目录仅仅是文件和目录的容器。它们为组织系统提供了树形结构。可以通过名称访问目录，也可以使用快捷方式访问。Linux\
  \ 使用符号 `.` 和 `..` 来表示目录。将 `.` 视为“当前目录”，将 `..` 视为“父目录”。\n\n（等待，这里文本重复了）\n\n使用快捷方式可以让导航变得更容易。例如，输入\
  \ `cd..` 进入当前目录的上一级目录。\n\n```\n$pwd\n/home/bob\n$ cd tpsreports\n$pwd\n/home/bob/tpsreports\n\
  $ cd ..\n$pwd\n/home/bob\n$ cd ..\n$pwd\n/home\n$ cd .\n$pwd\n/home\n```\n\n`cd\
  \ .` 命令没有带你去任何地方。记住 `.` 是“当前目录”，而 `..` 是“父目录”。\n\n| 符号 | 描述 |\n| --- | --- |\n|\
  \ `.` | 当前目录。 |\n| `..` | 父目录。 |\n| `/` | 目录分隔符。目录以斜杠结尾，这通常是默认假设。 |\n\n目录分隔符对于路径或命令中的最后一个子目录是可选的。例如，以下命令的作用完全相同。\n\
  \n```\n$ cd /var/tmp\n$ cd /var/tmp/\n```\n\n导航的另一个快捷方式是 `cd -`。该命令带你回到上一个目录。代表上一个工作目录的环境变量是\
  \ `OLDPWD`。因此，`cd -` 和 `cd $OLDPWD` 是等效的。\n\n```\n$pwd\n/home/bob\n$ cd /var/tmp\n\
  $pwd\n/var/tmp\n$ echo $OLDPWD\n/home/bob\n$ cd -\n/home/bob\n$\n```\n\n\n\n\n\n\
  你如何执行当前目录下的命令？假设你的当前目录是你的家目录。默认情况下，你的家目录不在你的 `$PATH` 中。以下是操作方法。\n\n```\n$ ./program\n\
  ```\n\n为什么这样做可以行通？嗯，`.` 代表“当前目录”，`/` 是目录分隔符，而 `program` 是要执行的程序。你始终可以使用完整路径来显式地指定。这里有两种执行\
  \ `program` 的方法。\n\n```\n$ pwd\n/home/bob\n$ ./program\n$ /home/bob/program\n```\n\
  \n## 创建和删除目录\n\n`mkdir` 命令用于创建目录，而 `rmdir` 命令用于删除目录。\n\n`mkdir [-p] directory` -\
  \ 创建一个目录。使用 `-p`（parents）选项创建中间目录。\n\n`rmdir [-p] directory` - 删除一个目录。使用 `-p`（parents）选项删除所有指定的目录。`rmdir`\
  \ 仅删除空目录。要删除目录及其内容，请使用 `rm`。\n\n`rm -rf directory` - 递归删除目录以及该目录结构中的所有文件和目录。*请谨慎使用。*在命令行中使用该命令时，没有“垃圾桶”容器可以快速恢复你的文件。当你删除某个东西时，它就消失了。\n\
  \n```\n$ mkdir newdir\n$ mkdir newdir/product/reviews\nmkdir: Failed to make directory\
  \ \"newdir/product/reviews\"; No such file or directory\n$ mkdir -p newdir/product/reviews\n\
  $ rmdir newdir\nrmdir: directory \"newdir\": Directory not empty\n$ rm -rf newdir\n\
  $ ls newdir\nls: newdir: No such file or directory\n$ pwd\n/home/bob\n$ cd ..\n\
  $pwd\n/home\n```\n\n# 你的免费礼物\n\n感谢你阅读 *Linux for Beginners*，我想送你一份 *[Linux 替代 Windows\
