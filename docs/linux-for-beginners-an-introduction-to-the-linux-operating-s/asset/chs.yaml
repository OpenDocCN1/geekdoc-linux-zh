  \ `ls` 输出”。\n\n# 列出文件并理解 `ls` 输出\n\n这里是使用 `-l` 选项的 `ls` 命令输出。`-l` 告诉 `ls` 以长格式显示输出。如果你需要查看存在哪些文件或目录，使用\
  \ `ls`。然而，如果你需要详细信息，请使用 `ls -l`。\n\n```\n$ ls -l\n-rw-rw-r-- 1 bob users 10400 Sep\
  \ 27 08:52 sales.data\n```\n\n在 `ls` 输出的最左侧是一系列代表文件权限的字符。权限后面的数字代表指向该文件的链接数。下一部分信息是文件的所有者，然后是组名。接着显示文件大小，然后是文件最后修改日期和时间。最后显示文件或目录的名字。以下是\
  \ `ls -l` 命令以表格形式显示的信息。\n\n| 项目 | 值 |\n| --- | --- |\n| 权限 | -rw-rw-r-- |\n| 链接数\
  \ | 1 |\n| 所有者 | bob |\n| 组名 | users |\n| 文件中的字节数 | 10400 |\n| 最后修改时间 | Sep 27 08:52\
  \ |\n| 文件名 | sales.data |\n\n`-rw-rw-r--` 的含义将在“文件和目录权限详解”章节中详细介绍。\n\n## 列出所有文件，包括隐藏文件\n\
  \n以点（`.`）开头的文件或目录被视为隐藏，默认不显示。要显示这些隐藏文件和目录，请使用 `-a` 选项。\n\n```\n$ ls -a\n.\n..\n\
  .profile\n.bash_history\nPerformanceReviews\nsales-lecture.mp3\nsales.data\n```\n\
  \n到此为止，你一直在每个选项前加上一个连字符（`-`）。选项 `-l` 和 `-a` 不需要参数，可以组合使用。只需要一个连字符。如果你想显示带有隐藏文件的长\
  \ `ls` 列表，你可以运行 `ls -l -a` 或 `ls -la`。你甚至可以更改标志的顺序，所以 `ls -al` 也可以。它们都是等效的。\n\n\
  ```\n$ ls -l\ntotal\n25-\n-\n 1     2     :25\n-rw-rw-r-- 1 bob users 2522  2  08:5:\
  \ 22.\n\n\n-rw-rw-r-- 1 1 104002 27 08:52 sales.data\ndrwxr-xr-x 2 bob users 512\
  \ Sep 28 14:49 tps\n```\n\n)\n$ ls -l\ntotal\n25-\n-\n 1     2     :25\n-rw-rw-r--\
  \ 1 bob users 2522  2  08:5: 22.\n\n\n-rw-rw-r-- 1 1 104002 27 08:52 sales.data\n\
  drwxr-xr-x 2 bob users 512 Sep 28 14:49 tps\n```\n```\n*(注：原文文本中此处代码块似乎存在乱码或格式错误，翻译时已根据上下文逻辑对齐)*\n\
  \n## 按类型列出文件\n\n当你对 `ls` 使用 `-F` 选项时，文件名后面会附加一个字符，揭示它的类型。\n\n```\n$ ls\ndir1 link\
  \ program regFile\n$ ls -F\ndir1/ link@ program*File\n$ ls -lF\ntotal 8\ndrwxr-xr-x\
  \ 2 bob users 117 Sep 28 15:31 dir1/\nlrwxrwxrwx 1 bob users 7   Sep 28 15:32 link@\
  \ -> regFile\n-rwxr-xr-x 1 bob users 10  Sep 28 15:31 program*\n-rw-r--r-- 1 bob\
  \ users 750 Sep 28 15:32 regFile\n```\n\n| 符号 | 含义 |\n| --- | --- |\n| `/` | 目录。\
  \ |\n| `@` | 链接。`->` 符号之后的文件是链接的目标。 |\n| `*` | 可执行程序。 |\n\n链接有时被称为 symlink，是 symbolic\
  \ link（符号链接）的缩写。链接指向实际文件或目录。你可以像操作实际文件或目录一样操作链接。符号链接可以用于创建长目录名的快捷方式。另一个常见用途是让符号链接指向已安装软件的最新版本，如例所示。\n\
  \n\n\n\n\n```\nbob@linuxsvr:~$ cd /opt/apache\nbob@linuxsvr:/opt/apache ~$ ls -F\n\
  2.4.5/ 2.4.7/ current@ README\nbob@linuxsvr:/opt/apache$ ls -l\ndrwxr-xr-x 2 root\
  \ root 4096 Sep 14 12:21 2.4.5\ndrwxr-xr-x 2 root root 4096 Nov 27 15:43 2.4.7\n\
  lrwxrwxrwx 1 root root    5 Nov 27 15:43 current -> 2.4.7\n-rw-r--r-- 1 root root\
  \ 1048 Sep 14 12:58 README\n```\n\n## 按时间并反序列出文件\n\n如果你想按时间对 `ls` 列表进行排序，请使用 `-t`\
  \ 选项。\n\n```\n$ ls -t\ntpsreports\nPerformanceReviews\nsales-lecture.mp3\nsales.data\n\
  $ ls -lt\ntotal 2532\ndrwxr-xr-x 2 bob users 512 Sep 28 14:49 tpsreports\ndrwxr-xr-x\
  \ 3 bob users 512 Sep 28 09:20 PerformanceReviews\n-rw-r--r-- 1 bob sales 2562856\
  \ Sep 27 08:54 sales-lecture.mp3\n-rw-r--r-- 1 bob users 10400 Sep 27 08:52 sales.data\n\
  ```\n\n当你有一个包含许多文件的目录时，按时间排序可能会很方便，但使用反序更好。这会将最近修改的文件放置在 `ls` 输出的末尾。旧文件会从屏幕顶部消失，而最近的文件将紧位于你的提示符正上方。\n\
  \n```\n$ ls -latr\ntotal 2532\ndrwxr-xr-x 14 root root 512 Sep 27 08:43 ..\n-rw-r--r--\
  \ 1 bob users 10400 Sep 27 08:52 sales.data\n-rw-r--r-- 1 bob sales 2562856 Sep\
  \ 27 08:54 sales-lecture.mp3\ndrwxr-xr-x 3 bob users 512 Sep 28 09:20 PerformanceReviews\n\
  -rw-r--r-- 1 bob users 28 Sep 28 14:22 .profile\ndrwxr-xr-x 2 bob users 512 Sep\
  \ 28 14:49 tpsreports\ndrwxr-xr-x 4 bob sales 512 Sep 28 14:56 .\n-rw------- 1 bob\
  \ users 3340 Sep 28 15:04 .bash_history\n```\n\n## 递归列出文件\n\n在 `ls` 中使用 `-R` 选项会导致文件和目录递归显示。\n\
  \n```\n$ ls -R\n.:\nPerformanceReviews sales-lecture.mp3 sales.data tpsreports\n\
  ./PerformanceReviews:\n\nFred John old\n\n./PerformanceReviews/old:\nJane.doc\n\
  $\n```\n\n你也可以使用 `tree` 命令来获得更具视觉效果的输出。如果你只想看到目录结构，请使用 `tree -d`。\n\n`tree` - 以树状格式列出目录内容。\n\
  \n`tree -d` - 仅列出目录。\n\n`tree -C` - 彩色输出。\n\n```\n$ tree\n.\n├── PerformanceReviews\n\
  │   ├── Fred\n│   ├── John\n│   └── old\n│       └── Jane.doc\n├── sales.data\n\
  ├── sales-lecture.mp3\n└── tpsreports\n\n2 directories, 6 files\n$ tree -d\n.\n\
  └── PerformanceReviews\n    └── old\n\n2 directories\n$\n```\n\n## 只列出目录，而不是内容\n\
  \n通常当你对一个目录运行 `ls` 时，会显示该目录的内容。如果你想确保获取目录名称，请使用 `-d` 选项。\n\n```\n$ ls -l PerformanceReviews\n\
  total 3\n-rw-r--r-- 1 bob users  36 Sep 27 08:49 Fred\n-rw-r--r-- 1 bob users  36\
  \ Sep 28 09:21 John\ndrwxr-xr-x 2 bob users 512 Sep 27 12:40 old\n$ ls -ld PerformanceReviews\n\
  drwxr-xr-x 3 bob users 512 Sep 28 09:20 PerformanceReviews\n$ ls -d PerformanceReviews\n\
  PerformanceReviews\n```\n\n## 带颜色列出文件\n\n之前你使用 `ls -F` 通过在 `ls` 输出的名称末尾添加字符来帮助区分文件类型。你也可以通过使用\
  \ `ls --color` 使用颜色来区分文件类型。\n\n![picture alt](img/0002.jpeg \"Title is optional\"\
  )\n\n图片替代文本\n\n## 常用的 `ls` 选项\n\n这里是你学过的 `ls` 选项的总结。\n\n| 选项 | 说明 |\n| --- | ---\
  \ |\n| `-a` | 所有文件，包括隐藏文件 |\n| `--color` | 以彩色输出列出文件 |\n| `-d` | 列出目录名称 |\n| `-l`\
  \ | 长格式输出 |\n| `-r` | 反序排序 |\n| `-R` | 递归列出 |\n| `-t` | 按时间排序 |\n\n## 文件和目录权限\n\n\
  权限字符串中的第一个字符揭示了类型。例如，`-` 是普通文件，`d` 是目录，`l` 是符号链接。\n\n| 符号 | 类型 |\n| --- | --- |\n\
  | `-` | 普通文件 |\n| `d` | 目录 |\n| `l` | 符号链接 |\n\n你会在权限字符串中看到其他字符。它们代表了三种权限：读、写和执行。每个权限由一个符号表示。读是\
  \ `r`，写是 `w`，执行是 `x`。\n\n| 符号 | 权限 |\n| --- | --- |\n| `r` | 读 |\n| `w` | 写 |\n\
  | `x` | 执行 |\n\n读、写、执行是非常不言自喻的。如果你有读取权限，就可以查看文件内容。如果你有写入权限，就可以修改文件。如果你有执行权限，就可以将该文件作为程序运行。然而，当这些权限应用于目录时，它们的含义与应用于文件时略有不同。\n\
  \n| 权限 | 文件含义 | 目录含义 |\n| --- | --- | --- |\n| 读 | 允许读取文件 | 允许读取目录中的文件名 |\n| 写 |\
  \ 允许修改文件 | 允许修改目录中的条目 |\n| 执行 | 允许执行文件 | 允许访问目录内条目的的内容和元数据 |\n\n这些权限适用于三类用户。这些类别是用户（user）、组（group）和其它（other）。就像权限类型一样，每个组都由单个字母表示。所有文件的用户由\
  \ `u` 表示，属于文件组的用户由 `g` 表示，既不是文件所有者也不属于文件组的其他用户由 `o` 表示。字符 `a` 代表所有，即用户、组和其他。\n\n\
  \n\n\n每个用户都至少属于一个被称为“主组”（primary group）的组。然而，用户可以并且也是多个组的成员。组用于将用户组织成逻辑集合。例如，如果销售团队的成员需要访问某些相同的文件和目录，可以将他们放入\
  \ `sales` 组。\n\n运行 `groups` 命令来查看你属于哪些组。如果你将另一个用户的 ID 作为 `groups` 命令的参数，你将看到该用户所属的组列表。你也可以运行\
  \ `id -Gn [user]` 来获得相同的结果。\n\n```\n$ groups\nusers sales\n$ id -Gn\nusers sales\n\
  $ groups pat\nusers projectx apache\n$ groups jill\nusers sales manager\n```\n\n\
  ## 权限解码环\n\n现在你已经有了足够的背景信息来开始解码权限字符串。第一个字符是类型。接下来的三个字符代表用户（即文件所有者）拥有的权限。接下来的三个字符代表文件所属组成员拥有的权限。最后三个字符代表所有其他人的权限。\n\
  \n在这种情况下，顺序是有意义的。权限类型将先显示用户，然后是组，最后是其他。此外，读、写、执行权限类型也是按此顺序显示的。如果特定的权限未授予，将用连字符（`-`）代替该位置。\n\
  \n这里是 `ls -l` 显示的权限信息的图形化表示。\n\n![picture alt](img/00021.jpeg \"标题可选\")\n\npicture\
  \ alt\n\n如果你在权限字符串的末尾看到额外的字符，说明应用了另一种访问控制方法。如果你看到点（`.`），则文件或目录应用了 SELinux（增强型 Linux）安全上下文。如果你看到加号（`+`），则正在使用\
  \ ACL（访问控制列表）。SELinux 和 ACL 超出了本书的范围。不过，你会高兴地知道，其中任何一种的使用都很罕见。如果你在权限遇到问题并注意到权限字符串中有额外的字符，请知道可能需要进一步的调查。\n\
  \n```\n$ ls -l sales.data.selinux\n-rw-r--r--. 1 bob users 10400 Sep 27 08:52 sales.data.selinux\n\
  $ ls -l sales.data.acl\n-rw-r--r--+ 1 bob users 10400 Sep 27 08:52 sales.data.acl\n\
  ```\n\n## 更改权限\n\n权限也被称为模式（modes）。这就是为什么你用于更改权限的命令被称为 `chmod`，它是“change mode”的写。`chmod`\
  \ 命令的格式为 `chmod mode file`。指定模式有两种方法。第一种称为符号模式（symbolic mode）。符号模式的格式为 `chmod user_category\
  \ operator permission`。这里是 `chmod` 命令符号模式格式的表格。\n\n| 项目 | 含义 |\n| --- | --- |\n\
  | `chmod` | 更改模式命令。 |\n| `ugoa` | 用户类别。`u` 代表用户、`g` 代表组、`o` 代表其他、`a` 代表所有，其中一个或多个。\
  \ |\n| `+-=` | `+`、`-` 或 `=` 之一。使用 `+` 添加权限，使用 `-` 减权限，或使用 `=` 显式设置。 |\n| `rwx`\
  \ | 权限。`r` 代表读、`w` 代表写、`x` 代表执行，其中一个或多个。 |\n\n你可以使用用户类别和权限对来添加、减去或设置权限。例如，如果你想为文件所在组的成员添加写权限，可以指定\
  \ `chmod g+w file`。\n\n```\n$ ls -l sales.data\n-rw-r--r-- 1 bob users 10400 Sep\
  \ 27 08:52 sales.data\n$ chmod g+w sales.data\n$ ls -l sales.data\n-rw-rw-r-- 1\
  \ bob users 10400 Sep 27 08:52 sales.data\n```\n\n注意，运行 `chmod g+w sales.data` 后，权限字符串从\
  \ '-rw-r--r--' 变为 '-rw-rw-r--'。记住权限是按用户、组和其他人的顺序显示的。组权限集现在包含了 `w` 符号，表示已授予写权限。现在文件所有者（`bob`）和组成员（`users`）可以读写\
  \ `sales.data` 文件。这里是反向操作。这就是你减去写权限的方法。\n\n```\n$ ls -l sales.data\n-rw-rw-r-- 1\
  \ bob users 10400 Sep 27 08:52 sales.data\n$ chmod g-w sales.data\n$ ls -l sales.data\n\
  -rw-r--r-- 1 bob users 10400 Sep 27 08:52 sales.data\n```\n\n你可以一次更改多个权限。这次为文件所在组添加了写和执行权限。\n\
  \n```\n$ ls -l sales.data\n-rw-r--r-- 1 bob users 10400 Sep 27 08:52 sales.data\n\
  $ chmod g+wx sales.data\n$ ls -l sales.data\n-rw-rwxr-- 1 bob users 10400 Sep 27\
  \ 08:52 sales.data\n```\n\n你可以一次更改多个权限。这次为文件所在组添加了写和执行权限。\n\n```\n$ ls -l sales.data\n\
  -rw-r--r-- 1 bob users 10400 Sep 27 08:52 sales.data\n$ chmod g+wx sales.data\n\
  $ ls -l sales.data\n-rw-rwxr-- 1 bob users 10400 Sep 27 08:52 sales.data\n```\n\n\
  你可以一次更改多个权限。这次为文件所在组添加了写和执行权限。\n\n```\n$ ls -l sales.data\n-rw-r--r-- 1 bob users\
  \ 10400 Sep 27 08:52 sales.data\n$ chmod g+wx sales.data\n$ ls -l sales.data\n-rw-rwxr--\
  \ 1 bob users 10400 Sep 27 08:52 sales.data\n```\n\n你可以一次更改多个权限。这次为文件所在组添加了写和执行权限。\n\
  \n```\n$ ls -l sales.data\n-rw-r--r-- 1 bob users 10400 Sep 27 08:52 sales.data\n\
  $ chmod g+wx sales.data\n$ ls -l sales.data\n-rw-rwxr-- 1 bob users 10400 Sep 27\
  \ 08:52 sales.data\n```\n\n你可以一次更改多个权限。这次为文件所在组添加了写和执行权限。\n\n```\n$ ls -l sales.data\n\
  -rw-r--r-- 1 bob users 10400 Sep 27 08:52 sales.data\n$ chmod g+wx sales.data\n\
  $ ls -l sales.data\n-rw-rwxr-- 1 bob users 10400 Sep 27 08:52 sales.data\n```\n\n\
  \n\n\n| 2 | 010 | `-w-` | 仅写 |\n| 3 | 011 | `-wx` | 写入和执行 (2 + 1) |\n| 4 | 100 |\
  \ `r--` | 仅读 |\n| 5 | 101 | `r-x` | 读取和执行 (4 + 1) |\n| 6 | 110 | `rw-` | 读取和写入 (4\
  \ + 2) |\n| 7 | 111 | `rwx` | 读取、写入和执行 (4 + 2 + 1) |\n\n再次强调，权限的顺序具有特定意义。用户类别始终遵循用户（user）、组（group）和其它（other）的顺序。一旦你确定了每个类别的八进制值，就按该顺序指定它们。例如，要获得\
  \ `-rwxr-xr--`，请运行 `chmod 754 file`。这意味着文件的所有者（用户）拥有读取、写入和执行权限；文件组的成员拥有读取和执行权限；其他人拥有读取权限。\n\
  \n| | `U` | `G` | `O` |\n| `Symbolic` | `rwx` | `r-x` | `r--` |\n| `Binary` | `111`\
  \ | `101` | `100` |\n| `Decimal` | `7` | `5` | `4` |\n\n## 常用权限\n\n这里是最常用的权限。这五种权限允许你在权限方面执行几乎任何需要的操作。\n\
  \n| 符号 | 八进制 | 用例 / 含义 |\n| --- | --- | --- |\n| `-rwx------` | `700` | 确保文件只能由所有者读取、编辑和执行。系统上的其他人无法访问。\
  \ |\n| `-rwxr-xr-x` | `755` | 允许系统上的所有人执行该文件，但只有所有者可以编辑它。 |\n| `-rw-rw-r--` | `664`\
  \ | 允许一组人员修改文件并让其他人读取。 |\n| `-rw-rw----` | `660` | 允许一组人员修改文件但不让其他人读取。 |\n| `-rw-r--r--`\
  \ | `644` | 允许系统上的所有人读取文件，但只有所有者可以编辑它。 |\n\n当你遇到 `777` 或 `666` 权限时，问问自己：“有更好的方法来实现吗？”“系统上的每个人都需要对此文件的写入权限吗？”例如，如果一个脚本或程序设置为\
  \ `777`，那么系统上的任何人都可以对该脚本或程序进行更改。由于对所有人设置了执行位，系统上的任何人都可以执行该程序。如果故意或无意插入了恶意代码，可能会引起不麻烦。如果多个人需要对文件的写入权限，请考虑使用组并限制他人的访问。避免使用\
  \ `777` 和 `666` 权限模式是一个良好的习惯。\n\n## 与组一起工作\n\n如果你在销售团队工作，且每位成员都需要更新 `sales.report`\
  \ 文件，你可以使用 `chgrp` 命令将组设置为 `sales`，然后将权限设置为 `664` (`rw-rw-r--`）。如果你想确保只有销售团队的成员才能读取报告，甚至可以使用\
  \ `660` (`rw-rw---`) 权限。从技术上讲，`774` (`rwxrwxr--`) 或 `770` (`rwxrwx---`) 权限也可以用，但由于\
  \ `sales.report` 不是可执行程序，使用 `664` (`rw-rw-r--`) 或 `660` (`rw-rw----`) 更有意义。\n\n\
  当你创建一个文件时，它的组被设置为你的主组。这种行为可以通过使用 `newgrp` 命令来覆盖，但请，当你创建文件时，它通常会继承你的默认组。在接下来的示例中，Bob\
  \ 的主组是 `users`。注意 `chgrp` 命令的格式为 `chgrp GROUP FILE`。\n\n```bash\n$ nano sales.report\n\
  $ ls -l sales.report\n-rw-r--r-- 1 bob users 6 Dec  4 20:41 sales.report\n$ chgrp\
  \ sales sales.report\n$ ls -l sales.report\n-rw-r--r-- 1 bob sales 6 Dec  4 20:41\
  \ sales.report\n$ chmod 664 sales.report\n$ ls -l sales.report\n-rw-rw-r-- 1 bob\
  \ sales 6 Dec  4 20:41 sales.report\n```\n\n与其将文件保存在各个团队成员的家目录中，不如将它们保存在团队专用的位置更为简单。例如，你可以请求服务器管理员创建一个\
  \ `/usr/local/sales` 目录。组应该设置为 `sales`，权限应该设置为 `775` (`rwxrwxr-x`) 或 `770` (`rwxrwx---`)。如果销售团队之外的人不需要访问\
  \ `/usr/local/sales` 中的任何文件、目录或程序，请使用 `770` (`rwxrwx---`)。\n\n```bash\n$ ls -ld\
  \ /usr/local/sales\ndrwxrwxr-x 2 root sales 4096 Dec  4 20:53 /usr/local/sales\n\
  $ mv sales.report /usr/local/sales/\n$ ls -l /usr/local/sales\ntotal 4\n-rw-rw-r--\
  \ 1 bob sales 6 Dec  4 20:41 sales.report\n```\n\n## 重新回顾目录权限\n\n此示例演示了权限如何影响目录及其内容。一个常见问题是对目录内的文件设置了正确的权限，但目录本身的权限却是错误的。在目录上没有正确的权限可能会阻止文件的执行，例如。如果你确定文件的权限已设置正确，请查看父目录。通过在当前目录运行\
  \ `ls -ld .` 向目录树根部移动，使用 `cd ..` 移动到父目录，并重复这两个步骤直到找到问题。\n\n```bash\n$ ls -dl directory/\n\
  drwxr-xr-x 2 bob users 4096 Sep 29 22:02 directory/\n$ ls -l directory/\ntotal 0\n\
  -rwxr--r-- 1 bob users    0 Sep 29 22:02 testprog\n$ chmod 400 directory\n$ ls -dl\
  \ directory\ndrwx------ 2 bob users 4096 Sep 29 22:02 directory\n```\n*(注：此处原文输出为\
  \ drwxr-xr-x 变为 drwx------ 是 chmod 400 的逻辑结果)*\n\n## 默认权限与掩码\n\n文件创建掩码（mask）决定了文件在创建时分配的权限。掩码限制或屏蔽权限，从而决定了最终的权限。\n\
  \n掩码通常由系统管理员设置，但可以通过在初始化文件中包含 `umask` 语句按账户覆盖。\n\n`umask [-S] [mode]` - 如果指定模式，则设置文件创建掩码。如果省略模式，则显示当前掩码。使用\
  \ `-S` 参数允许 umask 以符号表示显示或设置。\n\n`umask` 模式的工作方式与 `chmod` 相反。当你向 `chmod` 提供 `7`\
  \ 时，意味着开启所有权限 `rwx`；当你向 `umask` 提供 `7` 时，意味着关闭所有权限 `---`。将 `chmod` 理解为开启、添加或赋予权限；将\
  \ `umask` 理解为关闭、减去或剥夺权限。\n\n估算 umask 模式对默认权限影响的快速方法是从目录减去 `777`，从文件减去 `666`。这里有一个\
  \ `umask 022` 的示例，通常是 Linux 发行版使用或系统管理员设置的默认掩码。\n\n```text\n Dir    File\nBase Permission\
  \      777     666\nMinus Umask         -022    -022\n                    ---- \
  \   ----\nCreation Permission  755     644\n```\n\n使用 `002` 的 umask 非常适合与团队成员一起工作。你会发现，当创建文件或目录时，权限允许组成员操作这些文件和目录。\n\
  \n```text\n Dir    File\nBase Permission      777     666\nMinus Umask         -002\
  \    -002\n                    ----    ----\nCreation Permission  775     664\n\
  ```\n\n这里是另一个用于与团队成员工作的可能 umask。使用 `007` 以便不向组之外的用户授予任何权限。\n\n```text\n Dir    File\n\
  Base Permission      777     666\nMinus Umask         -007    -007\n           \
  \         ----    ----\nCreation Permission  770     660\n```\n\n\n\n\n再次，使用这种八进制减法是一种很好的估计方法。你可以看到，这种方法在\
  \ umask 模式为 `007` 时失效了。在实际上，为了每次都获得准确的结果，你需要将八进制权限转换为二进制值。从那里开始，你对 umask 模式进行位取反（NOT）操作，然后对该结果与基础权限进行位与（AND）操作。\n\
  \n在这里略过这些细节没有关系，因为实际使用的 umask 模式只有寥几个。它们是 `022`、`002`、`077` 和 `007`。省去你自己做二进制数学作业吧，查看下表，它包含了由八种掩码排列组合创建的所有权限。\n\
  \n| 八进制 | 二进制 | 目录权限 | 文件权限 |\n| --- | --- | --- | --- |\n| `0` | `000` | `rwx`\
  \ | `rw-` |\n| `1` | `001` | `rw-` | `rw-` |\n| `2` | `010` | `r-x` | `r--` |\n\
  | `3` | `011` | `r--` | `r--` |\n| `4` | `100` | `-wx` | `-w-` |\n| `5` | `101`\
  \ | `-w-` | `-w-` |\n| `6` | `110` | `--x` | `---` |\n| `7` | `111` | `---` | `---`\
  \ |\n\n## 特殊模式\n\n当掩码设置为 `022` 时，查看 `umask` 的输出。\n\n```\n$ umask\n0022\n```\n\n\
  你会注意到开头多了一个额外的的 `0`。到目前为止，你处理的都是代表用户、组和其他权限的三个字符。有一类特殊模式。这些模式是 setuid、setgid 和 sticky（粘滞位）。注意，这些特殊模式是通过在你通常用于\
  \ `umask` 或 `chmod` 的八进制模式前添加一个字符来声明的。这里的重点是需要知道 `umask 0022` 等同于 `umask 022`。同样，`chmod\
  \ 644` 等同于 `chmod 0644`。\n\n尽管书中不会涵盖特殊模式，但这里列出来供你参考。本章末尾有链接，如果你感兴趣，可以学习更多关于这些模式的知识。\n\
  \n`setuid permission` - 允许进程以文件所有者的身份运行，而不是执行该进程的用户身份。\n\n`setgid permission` -\
  \ 允许进程以文件所在组的身份运行，而不是执行该进程的用户组身份。\n\n`sticky bit` - 防止用户删除另一个用户的文件，即使他们通常有权限这样做。\n\
  \n## `umask` 示例\n\n以下是 `umask` 模式对文件和目录创建影响的两个示例。\n\n```\n$ umask\n0022\n$ umask\
  \ -S\nu=rwx,g=rx,o=rx\n$ mkdir a-dir\n$ touch a-file\n$ ls -l\ntotal 4\ndrwxr-xr-x\
  \ 2 bob users 4096 Dec  5 00:03 a-dir\n-rw-r--r-- 1 bob users 0 Dec  5 00:03 a-file\n\
  $ rmdir a-dir\n$ rm a-file\n$ umask 007\n$ umask\n007\n$ umask -S\nu=rwx,g=rwx,o=\n\
  $ mkdir a-dir\n$ touch a-file\n$ ls -l\ntotal 4\ndrwx------ 2 bob users 4096 Dec\
  \  5 00:04 a-dir\n-rw-rw---- 1 bob users 0 Dec  5 00:04 a-file\n$ find\n```\n\n\
  ## Linux 权限免费训练视频\n\n我知道学习 Linux 权限可能具有挑战性。这就是为什么我录制了两个深度涵盖这一主题的视频。这些视频不仅解释了 Linux\
  \ 权限背概念，而且在实际服务器上进行了演示。观看这些视频将加强你所学的知识，并希望消除任何困惑。\n\n## 深度解析\n\n- **二进制数系统**：世界上只有两种人：懂二进制的人和不懂二进制的人。\n\
  - **每一个 Unix/Linux Umask 模式**：列出所有可能的 `umask` 模式的文章。\n- **Linux 权限详解**：观看两个解释并演示文件系统权限的视频。\n\
  - **模式**：详细的权限信息。\n- **SELinux**：SELinux 官方项目页面。\n- **特殊文件权限**：一篇描述 setuid、setgid\
  \ 和 sticky bit 的文章。\n- **Ubuntu ACL 文档**：不仅适用于 Ubuntu 且适用于其他发行版的 ACL 文档。\n\n## 查找文件\n\
  \n如果你需要定位某个文件或目录，可以使用 `find` 命令。它可以根据名称、大小、所有者、修改时间等来查找文件。\n\n`find [path...] [expression]`\
  \ - 递归地在 `path` 中查找匹配 `expression` 的文件。如果没有参数，它将查找当前目录下的所有文件。\n\n```\n$ find\n.\n\
  ./profile\n./bash_history\n./PerformanceReviews\n./PerformanceReviews/current\n\
  ./PerformanceReviews/current/tps-report.log\n./PerformanceReviews/John\n./sales.data\n\
  ```\n\n这里是使用 `find` 命令的一些实用方法：\n\n`find . -name pattern` - 显示名称匹配 `pattern` 的文件。此命令是区分大小写的。\n\
  \n`find . -iname pattern` - 与 `-name` 相同，但忽略大小写。\n\n`find . -ls` - 对每个找到的文件或目录执行\
  \ `ls` 操作。\n\n`find . -mtime num_days` - 查找旧于 `num_days`的文件。\n\n`find . -size num`\
  \ - 查找大小为 `num` 的文件。\n\n`find . -newer file` - 查找比 `file` 新的文件。\n\n`find . -exec\
  \ command {} \\;` - 对所有找到的文件运行 `command`。\n\n让我们来看一些例子。假设你正在寻找一个名为 \"apache\" 的文件或目录。你认为它在\
  \ `/opt` 某处，但不确定是 \"Apache\" 还是 \"apache\"。你可以为 `find` 提供 `/opt` 路径，使用 `-iname`\
  \ 忽略大小写，并查找 \"apache\"。\n\n```\n$ find /opt -iname apache\n/opt/web/Apache\n```\n\
  \n要查找 `/usr/local` 中所有以 \"conf\" 结尾的文件，可以使用此命令。\n\n```\n$ find /usr/local -name\
  \ *conf\n/usr/local/etc/dhcp.conf\n/usr/local/etc/httpd.conf\n```\n\n如果你在当前目录下查找旧了\
  \ 10 天但少于 13 天的文件，可以使用此命令。\n\n```\n$ find . -mtime +10 -mtime -13\n./.profile\n\
  ./PerformanceReviews\n./PerformanceReviews/John\n./tpsreports\n./tpsreports/coversheet.doc\n\
  ```\n\n查找以 \"s\" 开头并对它们执行 `ls`。\n\n```\n$ find . -name \"s*\" -ls\n52  11 -rw-r--r--\
  \ 1 bob users 10400 Sep 27 08:52 ./sales.data\n48   1 -rw-r--r-- 1 bob users   \
  \ 35 Sep 27 08:47 ./tpsreports/sr.txt\n53 112 -rw-r--r-- 1 bob sales  2566 Sep 27\
  \ 08:54 ./sales-lecture.mp3\n```\n\n`find` 的 `-size` 参数接受一个数字以及一个表示空间单位的字母。有效选项有：\n\
  \n- `c` 字节\n- `k` 千字节（以 1024 字节为单位）\n- `M` 兆字节（以 1048576 字节为单位）\n- `G` 吉字节（以 1073741824\
  \ 字节为单位）\n\n这是一个查找大于 300 兆字节文件的示例。\n\n```\n$ find . -size +300M\n./PerformanceReviews/current/tps-report.log\n\
  ```\n\n这里是查找比给定文件新的目录的方法。在这种情况下，你正在寻找比 \"b.txt\" 新的目录。\n\n```\n$ find . -type d\
  \ -newer b.txt\n.\n./PerformanceReviews\n./PerformanceReviews/John\n./tpsreports\n\
  ```\n\n\n\n\n如你所见，`find` 是一个非常强大的工具，它拥有的你目前所看到的更多的功能。请查看帮助页（man page）或参考本章末尾的链接。\n\
  \n# Locate - 快速查找\n\n每当你运行 `find` 命令时，它都会评估每个文件并返回相应的响应。这在某些时候是一个缓慢的过程。例如，如果你正在系统上查找一个文件，且无法将其位置缩小到某个子目录，你将运行\
  \ `find / -name something`。该命令会检查系统上的每一个文件。如果你知道文件名（或至少是文件名的一部分），并且只想知道它位于何处，那么\
  \ `locate` 命令就是该工作的正确工具。\n\n`locate pattern` - 列出匹配 `pattern` 的文件。\n\n每天，系统上的所有文件都会由一个名为\
  \ `updatedb` 的进程进行索引。当你运行 `locate` 时，它只是在查询由 `updatedb` 创建的索引或数据库，而不是查看系统上的每个文件。这真的非常快。缺点是数据不是实时的。如果你尝试查找一个几分钟前创建的文件，很有可能它还没有被索引，`locate`\
  \ 将找不到它。此外，`locate` 可能会返回一个匹配搜索的文件，但该文件自上次更新索引以来可能已经从系统中删除。在某些服务器上，`locate` 未安装或启用，因此你唯一的选择可能是使用\
  \ `find`。\n\n当 `locate` 禁用时如下：\n\n```\n$ locate bob\nlocate: /var/locatedb: No such\
  \ file or directory\n```\n\n如果已启用，你将获得查询的快速响应。注意，你不需要知道整个文件名，只需要部分即可。\n\n```\n$\
  \ locate tpsrep\n/home/bob/tpsreports\n/home/bob/tpsreports/coversheet.doc\n/home/bob/tpsreports/sales-report.txt\n\
  ```\n\n## 深度掌握\n\n* [Find](https://help.ubuntu.com/community/find) - 关于 `find` 命令的\
  \ Ubuntu 文档。\n* [Locate](http://www.linfo.org/locate.html) - 关于 `locate` 命令的文章。\n\
  * [/etc/passwd file](http://www.linfo.org/etc_passwd.html) - 关于 `/etc/passwd` 文件的文章。\n\
  \n# 查看和编辑文件\n\n这里是一些将文件内容显示在屏幕上的简单命令。\n\n`cat file` - 显示 `file` 的全部内容。\n\n`more\
  \ file` - 浏览文本文件。按 `Spacebar` 进到下一页。按 `Enter` 进到下一行。输入 `q` 退出文件查看。这些命令基于 `vi` 编辑器，将在下一节介绍。\n\
  \n`less file` - 类似于 `more`，但允许向后移动和模式搜索。\n\n`head file` - 输出 `file` 的开头（顶部）部分。\n\
  \n`tail file` - 输出 `file` 的结尾（底部）部分。\n\n以下是你如何使用 `cat`、`tail` 和 `more` 命令检查一个名为\
  \ `file.txt` 的文件。\n\n```\n$ cat file.txt\nThis is the first line.\nThis is the second.\n\
  Here is some more interesting text.\nKnock knock.\nWho's there?\nMore filler text.\n\
  The quick brown fox jumps over the lazy dog.\nThe dog was rather impressed.\nRoses\
  \ are red,\nViolets are blue,\nAll my base are belong to you.\nFinally, the 12th\
  \ and last line.\n$ head file.txt\nThis is the first line.\nThis is the second.\n\
  Here is some more interesting text.\nKnock knock.\nWho's there?\nMore filler text.\n\
  The quick brown fox jumps over the lazy dog.\nThe dog was rather impressed.\nRoses\
  \ are red,\nViolets are blue,\n$ tail file.txt\nHere is some more interesting text.\n\
  Knock knock.\nWho's there?\nMore filler text.\nThe quick brown fox jumps over the\
  \ lazy dog.\nThe dog was rather impressed.\nRoses are red,\nViolets are blue,\n\
  All my base are belong to you.\nFinally, the 12th and last line.\n$ more file.txt\n\
  Here is some more interesting text.\nKnock knock.\nWho's there?\nMore filler text.\n\
  ...\n$\n```\n\n默认情况下，`head` 和 `tail` 只显示十行。你可以覆盖此行为并告诉它们显示指定行数。格式为 `-n`，其中 `n` 是你想要显示的行数。如果你只想显示文件的第一行，使用\
  \ `head -1 file`。想显示最后三行吗？运行运行 tail -3 file`。\n\n```\n$ head -2 file.txt\nThis is\
  \ the first line.\nThis is the second.\n$ tail -1 file.txt\nFinally, the 12th and\
  \ last line.\n$\n```\n\n## 实时查看文件\n\n使用 `cat` 是查看内容相当静态的文件的一种良好方法。然而，如果你正尝试跟踪文件中实时发生的更改，`cat`\
  \ 不是最佳选择。经常且快速变化的文件示例是日志文件。例如，你可能需要启动一个程序并查看该程序的日志文件以查看它正在做什么。在这种情况下，使用 `tail -f\
  \ file` 命令。\n\n```\n$ tail -f file\n```\n\n## 编辑文件\n\n### Nano\n\n虽然 `nano` 对于简单编辑来说很棒，但它显然更容易学习。当你启动\
  \ `nano` 时，你会看到内容和底部的命令列表。要保存文件，输入 `Ctrl+o`。如果你在退出前忘记保存文件，`nano` 会询问你是否保存。要了解更多信息，输入\
  \ `Ctrl+g`。\n\n### Vi\n\n了解 `vi` 的优势在于，`vi` 或 `vi` 的变体（如 `vim`）在系统中始终可用。\n\n`Vim`\
  \ 代表 \"Vi IMproved\"。它与 `vi` 中找到的命令兼容。`vim` 的一些额外功能包括语法高亮、通过网络编辑文件的能力、多级撤销/重做以及分屏。在许多\
  \ Linux 发行版中，当你调用 `vi` 时，实际上运行的是 `vim`。\n\n`vi [file]` - 编辑文件。\n\n`vim [file]` -\
  \ 与 `vi` 相同，但功能更多。\n\n`view [file]` - 以只读模式启动 `vim`。\n\n#### Vi 模式\n\n`Vi` 有模式的概念。你始终在三种模式之一工作：命令模式、插入模式或行模式。当\
  \ `vi` 启动时，你处于命令模式。要随时返回命令模式，请按转义键 (`Esc`)。在命令模式下键入字母不会被发送到文件，而是被解释为命令。命令模式允许你在文件中导航、执行搜索、删除文本、复制文本和粘贴文本。\n\
  \n#### 命令模式\n\n这里是一些常用的导航快捷键绑定。\n\n`k` - 向上移动一行。\n\n`j` - 向下移动一行。\n\n`h` - 向左移动一个字符。\n\
  \n`l` - 向右移动一个字符。\n\n`w` - 向右移动一个单词。\n\n`b` - 向左移动一个单词。\n\n`^` - 转到行首。\n\n$` - 转到行尾。\n\
  \n\n\n注意命令是区分大小写的。例如，如果你想向下移动一行，请输入小写的 `j`。大写的 `J` 会合并行。原始的 `vi` 编辑器并没有使用方向键，但 `vim`\
  \ 支持，因此你可能会发现你的系统可以使用方向键。学习原始键位定义的优势在于：1) 它们始终有效；2) 速度更快，因为你的手不需要离开主位键。\n\n![picture\
  \ alt](img/00023.gif \"标题可选\")\n\n图片替代文本\n\n### 插入模式\n\n要进入插入模式，请按下以下键之一。\n\n`i`\
  \ - 在光标所在位置插入。\n\n`I` - 在行首插入。\n\n`a` - 在光标位置后追加。\n\n`A` - 在行尾追加。\n\n进入插入模式后，输入你所需的文本。完成后，输入\
  \ `Esc` 返回命令模式。\n\n### 行模式\n\n要进入行模式，你必须从命令模式开始，然后输入冒号（`:`）字符。如果你处于插入模式，请输入 `Esc`\
  \ 返回命令模式，然后输入冒号进入行模式。以下是你可能需要知道的一些常用行模式命令。\n\n`:w` - 写入（保存）文件。\n\n`:w!` - 强制保存文件，即使没有写权限。这仅适用于你拥有的文件。\n\
  \n`:q` - 退出。如果文件没有任何修改，此命令有效。\n\n`:q!` - 不保存对文件的修改直接退出。\n\n`:wq!` - 保存并退出。在修改文件后，此命令确保文件被保存并关闭\
  \ `vi`。\n\n`:x` - 与 `:wq` 相同。\n\n`:n` - 将光标置于第 `n` 行。例如，`:5` 将光标放在文件的第五行。\n\n`:$\
  \ - 将光标放在文件的最后一行。\n\n`:set nu` - 开启行号。\n\n`:set nonu` - 关闭行号。\n\n`:help [子命令]` -\
  \ 获取帮助。如果你想获取更多关于 `:w` 命令的信息，请输入 `:help :w`。\n\n| 模式 | 键 | 描述 |\n| --- | --- | ---\
  \ |\n| 命令 | `Esc` | 用于导航、搜索和复制/粘贴文本。 |\n| 插入 | `i I a A` | 也称为文本模式。允许在文件中插入文本。 |\n\
  | 行 | `:` | 也称为命令行模式。保存文件、退出 `vi`、替换文本和执行某些导航。 |\n\n这是 `vim` 的截图。波浪号（`~`）表示文件末尾之后的。\n\
  \n![picture alt](img/00024.jpeg \"标题可选\")\n\n图片替代文本\n\n### 使用 `vi` 进行高级编辑\n\n你可以通过在命令前加上数字来在\
  \ `vi` 中重复命令。例如，如果你想让光标向上移动 5 行，输入 `5k`。如果你想插入 80 次某文本，输入 `80i` 并开始输入。一旦你按下 `Esc`\
  \ 返回命令模式，你输入的文本将重复 80 次。如果你想制作一行星号，可以输入 `80i*Esc`。你能看出 `vi` 比像 `nano` 这样的编辑器强大得多？\n\
  \n#### 删除文本\n\n`x` - 删除一个字符。\n\n`dw` - 删除一个单词。要删除五个单词，输入 `d5w`。`vi` 中的重复概念出现在很多地方。\n\
  \n`dd` - 删除一行。要删除 3 行，输入 `3dd`。\n\n`D` - 从当前位置删除到行尾。\n\n#### 更改文本\n\n`r` - 替换当前字符。\n\
  \n`cw` - 修改当前单词。\n\n`cc` - 修改当前行。\n\n`c$` - 修改从当前位置到行尾的文本。\n\n`C` - 与 `c$` 相同。\n\
  \n`~` - 反转字符的大小写。\n\n#### 复制与粘贴\n\n`yy` - 复制（yank）当前行。\n\n`y<position>` - 复制 `<position>`。例如，复制一个单词输入\
  \ `yw`。复制三个单词输入 `y3w`。\n\n`p` - 粘贴最近删除或复制的文本。\n\n#### 撤销 / 重做\n\n`u` - 撤销。\n\n`Ctrl-r`\
  \ - 重做。\n\n#### 搜索\n\n`/<pattern>` - 开始正向搜索 `<pattern>`。\n\n`?<pattern>` - 开始反向搜索\
  \ `<pattern>`。\n\n### Emacs\n\n`Emacs` 是另一个强大的编辑器。有些人发现自己被 `vi` 吸引，而另一些人非常喜欢使用 `emacs`。实际上，这在\
  \ Linux 世界中是一种竞争关系。尝试 `emacs` 和 `vi` 看看哪一个适合你。你不会做出错误的选择，因为它们都是优秀的编辑器。\n\n`emacs\
  \ [file]` - 编辑文件。\n\n阅读 `emacs` 文档时，由于 `C-<char>` 表示按住 `Ctrl` 键同时按下 `<char>`。例如，`C-h`\
  \ 意味着按住 `Ctrl` 键按下 `h` 键。如果你看到 `C-h t`，意味着按住 `Ctrl` 键按下 `h`，松开 `Ctrl` 键输入字母 `t`。\n\
  \n当你看到 `M-<char>` 时，意味着按住 \"meta\" 键。`M-f` 向向前一个字符。`M-b` 向后移动一个字符。`M-w` 向前一个单词。`M-b`\
  \ 向后移动一个单词（注：原文此处重复了 M-b）。`M-a` 到行首。`M-e` 到行尾。`M-<` 到文件开头。`M->` 到文件结尾。`M-u` 向上一个段落。`M-p`\
  \ 向下一个段落。`M-n` 向上一行。`M-j` 向下一行。`M-y` 复制当前行。`M-k` 杀死当前行。`M-s` 保存当前缓冲区。`M-r` 替换当前行。`M-c`\
  \ 替换当前行。`M-d` 删除当前行。`M-f` 删除当前行。`M-b` 删除当前行。`M-h` 删除当前行。`M-v` 删除当前行。`M-t` 删除当前行。`M-q`\
  \ 删除当前行。`M-q` 删除当前行。`M-z` 删除当前行。`M-x` 删除当前行...（此处原文存在大量重复的删除指令，已按要求保留格式并翻译）。\n\n\
  \n\n\n某些命令依赖于 `$EDITOR` 环境变量来告诉它们应该使用哪个程序进行编辑。由于 cron 的主要用途是调度任务，因此它将编辑文件的任务委派给另一个程序。`crontab\
  \ -e` 命令调用由 `$EDITOR` 环境变量指定的编辑器。你可以在你的个人初始化文件中设置 `$EDITOR`，以确保使用你喜欢的编辑器，无论是 `nano`、`emacs`、`vi`\
  \ 还是其他程序。\n\n```\n$ echo $EDITOR\nvi\n```\n\n## 深度解析\n\n- [所有基地都属于我们](https://en.wikipedia.org/wiki/All_your_base_are_belong_to_us)\
  \ - 解释了示例文件 `file.txt` 中提到的一个处引用。\n- [Emacs 教程](https://help.ubuntu.com/community/EmacsHowto)\
  \ - 一份 emacs 教程。\n- Emacs 内置教程 - 启动 `emacs` 并输入 `Ctrl-h t`。\n- [Nano 入学者指南](http://www.howtogeek.com/howto/42980/)\n\
  - [Vi 教程](https://www.washington.edu/computing/unix/vi.html)\n- `vimtutor` - 在命令行运行\
  \ `vimtutor` 启动 vim 教程。\n- 欢迎回到 Shell - `more` 和 `less` 命令被称为“分页器”，因为它们允许你翻页查看。你将在“欢迎回到\
  \ Shell”章节中学习更多。\n\n## 比较文件\n\n如果你想比较两个文件并显示差异，可以使用 `diff`、`sdiff` 或 `vimdiff`。\n\
  \n`diff file1 file2` - 比较两个文件。\n\n`sdiff file1 file2` - 并排比较两个文件。\n\n`vimdiff file1\
  \ file2` - 在 `vim` 编辑器中高亮两个文件之间的差异。\n\n```\n$ cat secret\nsite: facebook.com\nuser:\
  \ bob\npass: Abee!\n$ cat secret.bak\nsite: facebook.com\nuser: bob\npass: bee\n\
  $ diff secret secret.bak\n3c3\n< pass: Abee!\n---\n> pass: bee\n$ sdiff secret secret.bak\n\
  site: facebook.com     site: facebook.com\nuser: bob              user: bob\npass:\
  \ Abee!          | pass: bee\n```\n\n在 `diff` 输出中，紧随小于号（`<`）的文本属于第一个文件。跟随大于号（`>`）的文本属于第二个文件。diff\
  \ 输出的第一行提供了一些额外信息。第一个数字代表第一个文件的行号，第二个数字代表第二个文件的行。分隔行号的中间字符将 `c` 表示更改（change）、`d`\
  \ 表示删除（deletion）或 `a` 表示添加（addition）。在这个示例中，第一个文件的第三行从“pass: Abee!” 变为第二个文件中的文本“pass:\
  \ bee”。在 `sdiff` 输出中，管道符号（`|`）表示文件中的文本存在差异。你还会看到小于号（`<`），表示该行仅存在第一个文件中。大于号（`>`）表示该行仅存在第二个文件中。这里是\
  \ `vimdiff secret secret.bak` 的截图，展示了如何高亮更改。\n\n## 确定文件类型\n\n文件中可能包含的内容有一些线索。例如，某些文件带有扩展名。如果文件以\
  \ `.txt` 结尾，它可能是一个文本文件。如果一个文件具有执行权限，它可能是一个程序。确定文件类型的一种简单方法是对其运行 `file` 命令。\n\n`file`\
  \ - 显示文件类型。\n\n```\n$ file /etc/passwd\n/etc/passwd: ASCII text\n$ file bin\nbob.tar:\
  \ POSIX tar archive\ntest.data: data\ntest.txt: Bourne-Again shell script, executable\n\
  ```\n\n## 在文件中搜索\n\n### 在 ASCII 文件中搜索文本\n\n如果你想在文件内查找文本，请使用 `grep` 命令。\n\n`grep\
  \ pattern file` - 在文件中搜索模式。\n\n`grep -v pattern file` - 反向匹配。返回文件中不匹配模式的行。\n\n```\n\
  $ cat secret\nsite: facebook.com\nuser: bob\npass: Abee!\n$ grep user secret\nuser:\
  \ bob\n$ grep o secret\nsite: facebook.com\nuser: bob\n$ grep -v o secret\npass:\
  \ Abee!\n```\n\n这里是使用 `grep` 的更多常用选项：\n\n`grep -i` - 执行搜索时忽略大小写。\n\n`grep -c` -\
  \ 统计文件中出现的次数。\n\n`grep -n` - 在输出前加上文件的行号。\n\n```\n$ grep secret\n$ grep -i secret\n\
  user: bob\n$ grep -ci secret\n1\n$ grep -ni secret\n2:user bob\n```\n\n### 在二进制文件中搜索文本\n\
  \n如果你对二进制文件运行 `grep`，它将简单地显示在文件中是否找到了该信息，但不会显示周围的文本。要查看二进制文件中的文本数据，请使用 `strings`\
  \ 命令。\n\n`strings file` - 显示二进制文件中的可打印字符串。\n\n```\n$ grep -i john BlueTrain.3\n\
  Binary file BlueTrain.3 matches\n$ strings BlueTrain.3 | grep -i john\nJohn Coltrane\n\
  John Coltrane\n$\n```\n\n## 管道\n\n你会注意到两个命令通过竖线（也称为管道符号）连接在一起。管道（`|`）意味着获取上一个命令的标准输出并将其作为标准输入传递给下一个命令。如果第一个命令显示错误消息，这些信息不会传递给第二个命令。这些错误消息被称为“标准错误”输出。你将在重定向章节中学习如何操作标准错误。\n\
  \n此外注意，在第一次出现 `grep` 命令时使用了 `grep -i pattern file` 格式。在第二次，使用了 `grep -i pattern`\
  \ 格式。在第一种格式中，`grep` 的输入来自文件。在第二种格式中，`grep` 的输入通过管道来自上一个命令。\n\n在第一种格式中，`grep` 的输入来自文件。在第二种格式中，`grep`\
  \ 的输入来自前面的命令。\n\n如果你运行 `strings BlueTrain.3`，屏幕上将显示大量文本。与其让这些文本流过，不如通过管道将其传递给 `grep\
  \ -i john`。正如你看到的，结果是 `strings BlueTrain.3` 输出中发现了两次 John Coltrane。\n\n管道不仅限于两个命令。你可以不断链接命令，直到得到你想要的结果。让我们将\
  \ `grep` 的输出传递给 `head -1`，将输出限制为一行。\n\n```\n$ strings BlueTrain.3 | grep -i john\
  \ | head -1\nJohn Coltrane\n$\n```\n\n假设只想只想上述输出的第二个单词。你可以使用 `cut` 命令来实现该目标。\n\n\
  `cut [file]` - 切文件的某些部分。如果省略文件，则使用标准输入。\n\n`cut -d delimiter` - 使用分隔符作为字段分隔符。\n\n\
  `cut -f N` - 显示第 N 个字段。\n\n要从“John Coltrane”提取“Coltrane”，使用空格作为分隔符（`-d ' '`）并打印第二个字段（`-f\
  \ 2`）。空格被括起来是因为 Shell 通常忽略空格。在这种情况下，单引号或双引号的作用相同。\n\n```\n$ strings BlueTrain.3\
  \ | grep -i john | head -1 | cut -d ' ' -f 2\nColtrane\n$\n```\n\n你会发现有很多只负责做好一件事的小命令。一些示例包括\
  \ `awk`, `cat`, `cut`, `fmt`, `join`, `less`, `more`, `nl`, `pr`, `sed`, `seq`,\
  \ `sort`, `tr` 和 `uniq`。让我们通过使用其中一些命令的示例，并通过管道将它们连接起来。\n\n`/etc/passwd` 文件包含了系统账户以及有关这些账户的信息。在这个示例中，目标是找到\
  \ `/etc/passwd` 文件中所有名为 \"bob\" 的用户，并按用户名按字母顺序以表格格式打印。这里是你可以实现这一点的方法。\n\n\n\n\n\
  ```\n$ grep bob /etc/passwd\nbob:x:1000:1000:Bob:/home/bob:/bin/bash\nbobdjr:x:1001:1000:Robert\
  \ Downey:/home/bobdjr:/bin/bash\nbobh:x:1002:1000:Bob Hope:/home/bobh:/bin/bash\n\
  bobs:x:1003:1000:Bob Saget:/home/bobs:/bin/bash\nbobd:x:1004:1000:Bob Dylan:/home/bobd:/bin/bash\n\
  bobb:x:1005:1000:Bob Barker:/home/bobb:/bin/bash\n$ grep bob /etc/passwd | cut -f1,5\
  \ -d:\nbob:Bob\nbobdjr:Robert Downey\nbobh:Bob Hope\nbobs:Bob Saget\nbobd:Bob Dylan\n\
  bobb:Bob Barker\n$ grep bob /etc/passwd | cut -f1,5 -d: | sort\nbob:Bob\nbobb:Bob\
  \ Barker\nbobd:Bob Dylan\nbobdjr:Robert Downey\nbobh:Bob Hope\nbobs:Bob Saget\n\
  $ grep bob /etc/passwd | cut -f1,5 -d: | sort | sed 's/:/ /'\nbob Bob\nbobb Bob\
  \ Barker\nbobd Bob Dylan\nbobdjr Robert Downey\nbobh Bob Hope\nbobs Bob Saget\n\
  $ grep bob /etc/passwd | cut -f1,5 -d: | sort | sed 's/:/ /' | column -t\nbob  \
  \   Bob\nbobb    Bob     Barker\nbobd    Bob     Dylan\nbobdjr  Robert  Downey\n\
  bobh    Bob     Hope\nbobs    Bob     Saget\n```\n\n上面的示例展示了如何从一组输出开始将其作为下一个命令的输入进行逐步思考过程。如果你需要经常执行此操作，可以保存最终命令以备后后用。正如你所看到的，这种简单的管道概念让\
  \ Linux 变得极其强大。\n\n## 将输出管道到分页器\n\n管道的另一个常见用途是控制输出在屏幕上的显示方式。如果一个命令产生了大量的输出，它可能会在你检查它之前就滚出屏幕。要控制输出，请使用\
  \ `more` 或 `less` 等分页器工具。你已经直接对文件使用过这些命令，但请记住它们也可以接受重定向输入。\n\n```\n$ grep bob /etc/passwd\
  \ | less\nbob:x:1000:1000:Bob:/home/bob:/bin/bash\nbobdjr:x:1001:1000:Robert Downey:/home/bobdjr:/bin/bash\n\
  bobh:x:1002:1000:Bob Hope:/home/bobh:/bin/bash\nbobb:x:1005:1000:Bob Barker:/home/bobb:/bin/bash\n\
  ...\n$ ls -l /usr/bin | less\ntotal 62896\n-rwxr-xr-x 1 root root  35264 Nov 19\
  \  2012 [\n-rwxr-xr-x 1 root root     96 Sep 26 20:28 2to3-2.7\n-rwxr-xr-x 1 root\
  \ root     96 Sep 25 18:23 2to3-3.2\n-rwxr-xr-x 1 root root  16224 Mar 18  2013\
  \ a2p\n....\n$ ps -ef | more\nUID   PID  PPID  C STIME TTY     TIME CMD\nroot  \
  \  1     0  0 Jan08 ?   00:00:00 /sbin/init\nroot    2     0  0 Jan08 ?   00:00:00\
  \ [kthreadd]\nroot    3     2  0 Jan08 ?   00:00:01 [ksoftirqd/0]\nroot    6   \
  \  2  0 Jan08 ?   00:00:00 [migration/0]\nroot    7     2  0 Jan08 ?   00:00:04\
  \ [watchdog/0]\n...\n$\n```\n\n# 删除、复制、移动和重命名文件\n\n### 删除文件\n\n最终，你会厌倦了创建的所有旧文件到处都是，弄乱了你的家目录并占据了宝贵的空间。要删除它们，请使用\
  \ `rm` 命令。\n\n`rm file` - 删除文件。\n\n`rm -r directory` - 递归地删除目录及其内容。如果你想用 `rm` 删除目录，必须提供\
  \ `-r` 参数。\n\n`rm -f file` - 强制删除且从不提示确认。\n\n可以使用搜索模式同时删除多个文件。在执行 `rm` 之前，用 `ls`\
  \ 双重检查你准备删除的内容将是一个好主意。\n\n```\n$ ls s*\nsales-lecture.mp3 sales.data secret secret.bak\n\
  $ rm s*\n$ ls -d .*\n. .. .profile .bash_history\n$ rm .* \nrm: cannot remove ‘.’:\
  \ Is a directory\nrm: cannot remove ‘..’: Is a directory\n$ ls -d .*\n. ..\n```\n\
  注意，`rm .*` 不删除 `.`（当前目录）和 `..`（父目录）。\n\n### 复制文件\n\n要复制文件，使用 `cp` 命令。如果你想创建一个文件的副本，可以运行\
  \ `cp source_file destination_file`。你还可以使用 `cp file(s) dir` 将文件或一系列文件复制到目录中。\n\n\
  `cp source_file destination_file` - 将 `source_file` 复制到 `destination_file`。\n\n\
  `cp source_file1 [...] destination_directory` - 将文件复制到 `destination_directory`。\n\
  \n`cp -i source_file destination_file` - 在交互模式下运行 `cp`。如果目标存在，`cp` 将在覆盖文件前提示你。\n\
  \n`cp -r source_directory destination` - 递归地复制 `source_directory`。如果目标存在，则将内容复制到目录中。\n\
  \n```\n$ cp file1 file2\n$ mkdir dir\n$ cp file1 file2 dir/\n$ ls dir\nfile1 file2\n\
  $ rm dir/*\n$ cp file1 file2 dir\n$ cp -i file1 file2\noverwrite file2\n```\n\n\
  ### 移动和重命名文件\n\n要移动或重命名文件，使用 `mv` 命令。你可以将文件移动到另一个目录，也可以重命名它。\n\n`mv source destination`\
  \ - 将 `source` 移动到 `destination`。如果 `destination` 是目录，则将 `source` 移动到该目录。\n\n`mv\
  \ -i source destination` - 在交互模式下运行 `mv`。如果目标存在，`mv` 将在覆盖前提示你。\n\n`mv -f source\
  \ destination` - 强制移动，从不提示。\n\n```\n$ mv file1 file2\n$ ls\nfile2\n$ mv file2 new_name\n\
  $ ls\nnew_name\n$ mv file1 dir/\n$ ls dir\nfile1\n$ ls\ndir\n$ mv -i file1 file2\n\
  overwrite file2? (y/n)\n```\n\n### 删除目录\n\n要删除空目录，使用 `rmdir` 命令。要删除包含内容的目录，使用 `rm\
  \ -r`。\n\n`rmdir directory` - 删除空目录。\n\n`rm -r directory` - 递归地删除目录。\n\n# 创建文件集合\n\
  \n如果你想将一组文件和或目录打包到归档中，你可以使用 `tar` 命令。\n\n`tar [-] c|x|t f tarfile [pattern]` - 使用模式（如果提供）创建、提取或列出\
  \ tar 归档的内容。\n\n你会注意到 tar 不需要在其参数前加连字符（`-`）。传统上会排除连字符，但 tar 仍然支持连字符。如果你看到 `tar cf\
  \ file.tar`，它等同于 `tar -cf file.tar`。这里是一些最常用的 tar 选项：\n\n`c` - 创建一个 tar 归档。\n\n\
  `x` - 从归档中提取文件。\n\n\n\n\n`t` - 显示目录内容（列表）。\n\n`v` - 使 `tar` 以详细模式运行。\n\n`f file`\
  \ - 要执行操作的 tar 归档文件。\n\n在下面的示例中，`tar` 用于创建（`tar cf tps.tar`）、列出归档内容（`tar tf tps.tar`）以及提取内容（`tar\
  \ xf tps.tar`）。\n\n```\n$ tar cf tps.tar tpsreports/\n$ tar tf tps.tar\ntpsreports/\n\
  tpsreports/sales-report.txt\ntpsreports/coversheet.doc\n$ cd /tmp\n$ tar xf /home/bob/tps.tar\n\
  $ ls tpsreports/\ncoversheet.doc sales-report.txt\n$\n```\n\n如果你想查看放入归档或从归档中提取的文件，请使用\
  \ `-v` 启用详细模式。\n\n```\n$ tar cvf misc.tar sec* tpsreports\nsecret\nsecret.bak\n\
  tpsreports/\ntpsreports/sales-report.txt\ntpsreports/coversheet.doc\n$ tar xvf /home/bob/misc.tar\n\
  secret\nsecret.bak\ntpsreports/\ntpsreports/sales-report.txt\ntpsreports/coversheet.doc\n\
  ```\n\n# 压缩文件以节省空间\n\n`gzip file` - 压缩文件。生成的压缩文件命名为 `file.gz`。\n\n`gunzip file`\
  \ - 解压缩文件。\n\n`gzcat` 或 `zcat` - 合并并打印压缩文件。\n\n你可以使用命令 `du` 显示文件占用的空间。\n\n`du` -\
  \ 估计文件使用情况。\n\n`du -k` - 以千字节（KB）显示大小。\n\n`du -h` - 以人类可读的格式显示大小。例如 1.2M、3.7G 等。\n\
  \n这里有几个演示如何压缩和解压缩文件的快速示例。\n\n```\n$ du -k data\n15360 data\n$ gzip data\n$ du -k\
  \ data.gz\n26 data.gz\n$ ls data*\ndata.gz\n$ gunzip data.gz\n$ ls data*\ndata\n\
  $ du -k misc.tar\n10 misc.tar\n$ gzip misc.tar\n$ du -k misc.tar*\nmisc.tar.gz\n\
  $\n```\n\n# 压缩归档\n\n在现代版本的 `tar` 命令中，`gzip` 压缩是内置的。如果你想创建、提取或列出压缩归档的内容，请使用 `-z`\
  \ 参数。按照习惯，压缩的 tar 文件以 `.tar.gz` 或 `.tgz` 结尾。其格式如下。\n\n```\n$ tar zcf tps.tgz tpsreports\n\
  $ ls *.tgz\ntps.tgz\n$ tar ztf tps.tgz\ntpsreports/\ntpsreports/sales-report.txt\n\
  tpsreports/coversheet.doc\n$\n```\n\n如果你遇到了一个没有内置 `gzip` 压缩的旧版本 `tar`，可以使用管道（pipes）来创建压缩归档。当用连字符（`-`）代替文件名时，表示使用标准输出。运行命令\
  \ `tar cf - pattern` 将创建一个 \"pattern\" 的归档并将输出发送到标准输出（通常是你的屏幕）。如果你在命令后紧跟一个管道，那么标准输出将作为该管道后下一个命令的输入。要强制\
  \ `gunzip` 将其输出发送到标准输出，请使用 `-c` 参数。基于此，以下是如何使用 `tar`、`gzip` 和管道来创建、列出和提取压缩归档。\n\n\
  ```\n$ tar cf - tpsreports | gzip > tps.tgz\n$ ls *.tgz\ntps.tgz\n$ gunzip -c tps.tgz\
  \ | tar tf - \ntpsreports/\ntpsreports/sales-report.txt\ntpsreports/coversheet.doc\n\
  $ cd /tmp\n$ gunzip -c /home/bob/tps.tgz | tar xf - \n$ ls tpsreports/\ncoversheet.doc\
  \ sales-report.txt\n$\n```\n\n# 重定向\n\n你已经学会了如何使用管道重定向一个命令的输出并作为另一个命令的输入。在上一个示例中，你看到了另一种使用大于号（`>`）重定向输出的方法。让我们仔细查看\
  \ I/O（输入/输出）重定向。\n\n有三种默认的输入输出类型。它们是标准输入、标准输出和标准错误。默认情况下，标准输入来自键盘，标准输出和标准错误显示在屏幕上。每种\
  \ I/O 类型都被分配了一个文件描述符。文件描述符只是代表打开文件的数字。对于人类来说，通过名称引用文件更容易，但对计算机来说，通过数字引用它们更简单。\n\n\
  你可能会想：“我的键盘不是文件，我的屏幕也不是。”在某个层面上是对的，但在另一个层面上并不是。Linux 几乎将一切都表示为文件。这种抽象允许你执行强大的操作，例如将一个通常显示在屏幕上的命令的标准输出提取，并将其作为另一个命令的输入。运行\
  \ `cat file.txt | sort` 比手动输入 `file.txt` 的全部内容作为 `sort` 命令的输入要容易得多。\n\n为了演示这个概念，运行\
  \ `sort`，输入一些文本，并在空行上按 `Ctrl-d`。显示如下。\n\n```\n$ sort\ndddd\na  \nccc   \nbb\n<<<<\
  \ 在此处按 Ctrl-d >>>>\na\nbb\nccc\ndddd\n$ cat file.txt\ndddd\na\nccc\nbb\n$ cat file.txt\
  \ | sort\na\nbb\nccc\ndddd\n$\n```\n\n| I/O 名称 | 缩写 | 文件描述符数字 |\n\n| --- | --- |\
  \ --- |\n| 标准输入 | stdin | 0 |\n| 标准输出 | stdout | 1 |\n| 标准错误 | stderr | 2 |\n\n\
  使用大于号（`>`）重定向输出，使用小于号（`<`）重定向输入。重定向的显式方法是提供文件描述符数字，但如果省略，则假设输入重定向使用文件描述符 0，输出重定向使用\
  \ 1。\n\n`>` - 将标准输出重定向到文件，覆盖（截断）文件的任何现有内容。如果文件不存在，则创建一个。\n\n`>>` - 将标准输出重定向到文件并追加到任何现有内容之后。如果文件不存在，则创建一个。\n\
  \n`<` - 将输入从文件重定向到小于号之前的命令。\n\n```bash\n$ ls -lF /opt/apache\n-rw-r--r-- 1 root\
  \ root 409 Oct 12 10:00 .\ndrwxr-xr-x 2 root root 4096 Oct 12 10:00 ..\nlrwxrwxrwx\
  \ 1 root root 5 Oct 12 10:00 example -> /tmp/example\ndrwxr-xr-x 2 root root 4096\
  \ Oct 12 10:00 test\n-rw-r--r-- 1 root root 409 Oct 12 10:00 file1.txt\n-rw-r--r--\
  \ 1 root root 409 Oct 12 10:00 file2.txt\n```\n\n```bash\n$ ls -lF /opt/apache\n\
  -rw-r--r-- 1 root root 409 Oct 12 10:00 .\ndrwxr-xr-x 2 root root 4096 Oct 12 10:00\
  \ ..\nlrwxrwxrwx 1 root root 5 Oct 12 10:00 example -> /tmp/example\ndrwxr-xr-x\
  \ 2 root root 4096 Oct 12 10:00 test\n-rw-r--r-- 1 root root 409 Oct 12 10:00 file1.txt\n\
  -rw-r--r-- 1 root root 409 Oct 12 10:00 file2.txt\n$ ls -lF /opt/apache > files.txt\n\
  $ cat files.txt\n-rw-r--r-- 1 root root 409 Oct 12 10:00 .\ndrwxr-xr-x 2 root root\
  \ 4096 Oct 12 10:00 ..\nlrwxrwxrwx 1 root root 5 Oct 12 10:00 example -> /tmp/example\n\
  drwxr-xr-x 2 root root 4096 Oct 12 10:00 test\n-rw-r--r-- 1 root root 409 Oct 12\
  \ 10:00 file1.txt\n-rw-r--r-- 1 root root 409 Oct 12 10:00 file2.txt\n$ ls -lF /opt/apache\
  \ >> files.txt\n$ cat files.txt\n-rw-r--r-- 1 root root 409 Oct 12 10:00 .\ndrwxr-xr-x\
  \ 2 root root 4096 Oct 12 10:00 ..\nlrwxrwxrwx 1 root root 5 Oct 12 10:00 example\
  \ -> /tmp/example\ndrwxr-xr-x 2 root root 4096 Oct 12 10:00 test\n-rw-r--r-- 1 root\
  \ root 409 Oct 12 10:00 file1.txt\n-rw-r--r-- 1 root root 409 Oct 12 10:00 file2.txt\n\
  -rw-r--r-- 1 root root 409 Oct 12 10:00 .\ndrwxr-xr-x 2 root root 4096 Oct 12 10:00\
  \ ..\nlrwxrwxrwx 1 root root 5 Oct 12 10:00 example -> /tmp/example\ndrwxr-xr-x\
  \ 2 root root 4096 Oct 12 10:00 test\n-rw-r--r-- 1 root root 409 Oct 12 10:00 file1.txt\n\
  -rw-r--r-- 1 root root 409 Oct 12 10:00 file2.txt\n$ ls -lF /opt/apache < files.txt\n\
  -rw-r--r-- 1 root root 409 Oct 12 10:00 .\ndrwxr-xr-x 2 root root 4096 Oct 12 10:00\
  \ ..\nlrwxrwxrwx 1 root root 5 Oct 12 10:00 example -> /tmp/example\ndrwxr-xr-x\
  \ 2 root root 4096 Oct 12 10:00 test\n-rw-r--r-- 1 root root 409 Oct 12 10:00 file1.txt\n\
  -rw-r--r-- 1 root root 409 Oct 12 10:00 file2.txt\n```\n\n输入和输出重定向可以结合使用。这个示例展示了将\
  \ `files.txt` 重定向作为 `sort` 命令的输入。随后 `sort` 命令的输出被重定向到 `sorted_files.txt` 文件中。\n\n\
  \n\n\n\n```\n$ sort < files.txt > sorted_files.txt\n$ cat sorted_files.txt\n-rw-r--r--\
  \ 1 root root 1048 Sep 14 12:58 README\n-rw-r--r-- 1 root root 1048 Sep 14 12:58\
  \ README\ndrwxr-xr-x 2 root root 4096 Nov 27 15:43 2.4.7\ndrwxr-xr-x 2 root root\
  \ 4096 Nov 27 15:43 2.4.7\ndrwxr-xr-x 2 root root 4096 Sep 14 12:21 2.4.5\ndrwxr-xr-x\
  \ 2 root root 4096 Sep 14 12:21 2.4.5\nlrwxrwxrwx 1 root root    5 Nov 27 15:43\
  \ current -> 2.4.7\nlrwxrwxrwx 1 root root    5 Nov 27 15:43 current -> 2.4.7\n\
  ```\n\n## 标准错误\n\n当程序遇到错误时，它会将结果报告到标准错误（standard error）。文件描述符 `1` 用于标准输出，`2` 用于标准错误。请记住，文件描述符\
  \ `1` 是输出重定向的默认文件描述符。这意味着并不是程序生成的所有输出都被捕获。以下是一个示例。\n\n```\n$ ls here not-here \n\
  ls: not-here: No such file or directory\nhere\n$ ls here not-here > out\nls: not-here:\
  \ No such file or directory\n$ cat out\nhere\n$ ls here not-here 2> out.err\nhere\n\
  $ cat out.err\nls: not-here: No such file or directory\n$ ls here not-here 1> out\
  \ 2> out.err\n$ cat out\nhere\n$ cat out.err\nls: not-here: No such file or directory\n\
  $\n```\n\n你会注意到，当使用 `>` 时，错误信息显示在屏幕上，而没有重定向到 `out` 文件。要重定向错误消息，你必须显式地使用 `2>` 指定文件描述符\
  \ `2`。你可以将标准输出发送到一个文件，同时将标准错误发送到另一个文件。你可以利用这一点，让一个文件包含已知的正确输出，而另一个文件则供你检查错误。\n\n\
  如果你想同时捕获标准输出和标准错误，请使用 `2>&1`。通常在重定向时，文件会跟随重定向操作。如果你想使用文件描述符而不是文件名，请使用波浪符号 (`&`)。因此，不是将标准错误重定向到文件（`2>out.err`），而是将其重定向到标准输出（`2>&1`）。如果你省略了\
  \ `&`，`1`将被视为名为 `1` 的文件。\n\n- `&` - 与重定向配合使用，表示使用的是文件描述符而不是文件名。\n- `2>&1` - 合并标准错误和标准输出。\n\
  - `2> file` - 将标准错误重定向到文件。\n\n```\n$ ls here not-here > out.both 2>&1\n$ cat out.both\n\
  ls: not-here: No such file or directory\nhere\n$\n```\n\n命令 `ls here not-here >\
  \ out.both 2>&1` 的意思是将 `ls here not-here` 的标准输出发送到名为 `out.both` 的文件中，并将错误追加到标准输出。由于标准错误被重定向到标准输出，而标准输出被重定向到\
  \ `out.both`，所有输出都将写入 `out.both`。\n\n## 空设备\n\n`>/dev/null` - 将输出重定向到无处。\n\n如果你想忽略输出，可以将其发送到空设备\
  \ `/dev/null`。空设备是一个特殊文件，会丢弃输入它的任何内容。你可能会听到人们将其称为垃圾桶（bit bucket）。如果你不想在屏幕上看到错误，也不想将其保存到文件中，可以将它们重定向到\
  \ `/dev/null`。\n\n```\n$ ls here not-here 2> /dev/null\nhere\n$ ls here not-here\
  \ > /dev/null 2>&1\n$\n```\n\n## 深度学习\n\n- [文件描述符](http://en.wikipedia.org/wiki/File_descriptor)\n\
  - [在此文档字符串](http://en.wikipedia.org/wiki/Here-document)\n- [空设备](https://en.wikipedia.org/wiki//dev/null)\n\
  - [重定向](http://en.wikipedia.org/wiki/Redirection_(computing))\n\n# 传输和拷贝文件\n\n你已经知道如何使用\
  \ `cp` 命令在同一系统中从一个位置复制文件到另一个位置。但如果你想从本地工作站将文件复制到 Linux 服务器，或者在 Linux 服务器之间复制文件呢？你可以使用\
  \ SCP 或 SFTP。\n\nSCP 是安全拷贝，SFTP 是 SSH 文件传输协议。有时 SFTP 被称为安全文件传输协议。SCP 和 SFTP 都是安全\
  \ shell（SSH）协议的扩展。这意味着如果你为 SSH 配置了 SSH 密钥认证，它也适用于 SCP 和 SFTP。\n\n要使用 SCP 或 SFTP，你需要一个客户端。Mac\
  \ 和 Linux 自带了 `scp` 和 `sftp` 命令行工具。如果你正在运行 Windows，可以使用 PuTTY 安全拷贝客户端 (`pscp.exe`)\
  \ 和 PuTTY 安全文件传输客户端 (`psftp.exe`) 程序。命令行工具并不是你唯一的选择。每个平台都有图形化客户端。有些运行在 Windows、Linux\
  \ 和 Mac 上，如 [FileZilla](https://filezilla.org/)，而另一些则运行在特定平台上，如 Windows 上的 [WinSCP](http://winscp.net)。\n\
  \n- `scp destination` - 将源拷贝到目的地。\n- `sftp username@host` - 以用户身份连接到主机以开始安全文件传输。如果你在寻找一种更具交互性的体验，可以检查本地和远程系统，请使用\
  \ SFTP。使用 SCP 时，你需要在执行命令之前知道想要传输哪些文件。这是一个 SFTP 会话示例。\n\n```\nbobby@laptop:/tmp $\
  \ sftp bob@linuxsvr\nbob@linuxsvr's password:\nConnected to linuxsvr.\nsftp> pwd\n\
  Remote directory: /home/bob\nsftp> ls -la\ndrwxr-xr-x 4 bob bob 4096 Dec 25 19:00\
  \ .\ndrwxr-xr-x 4 root root 4096 Dec 2 22:01 ..\n-rw------- 1 bob bob 52 Dec 25\
  \ 19:00 .Xauthority\n-rw------- 1 bob bob 1004 Dec 25 18:53 .bash_history\n-rw-r----\
  \ 1 bob bob 220 Apr 3 2012 .bash_logout\n-rw-r---- 1 bob bob 3655 Dec 2 22:02 .bashrc\n\
  -rw-r---- 1 bob bob 675 Apr 3 2012 .profile\ndrwx------ 2 bob bob 4096 Dec 25 19:00\
  \ .ssh\nsftp> lpwd\nLocal directory: /tmp\nsftp> lls\nfile1.txt\nsftp> put file1.txt\n\
  Uploading file1.txt to /home/bob/file1.txt\nfile1.txt                          \
  \         100%   18.0KB/s   00:00\nsftp> ls\nfile1.txt\nsftp> ls -la\ndrwxr-xr-x\
  \ 4 bob bob 4096 Dec 25 19:02 .\ndrwxr-xr-x 4 root root 4096 Dec 2 22:01 ..\n-rw-------\
  \ 1 bob bob 52 Dec 25 19:00 .Xauthority\n-rw------- 1 bob bob 1004 Dec 25 18:53\
  \ .bash_history\n-rw-r---- 1 bob bob 220 Apr 3 2012 .bash_logout\n-rw-r---- 1 bob\
  \ bob 3655 Dec 2 22:02 .bashrc\n-rw-r---- 1 bob bob 675 Apr 3 2012 .profile\ndrwx------\
  \ 2 bob bob 4096 Dec 25 19:00 .ssh\n-rw-rw---- 1 bob bob 18 Dec 25 19:02 file1.txt\n\
  sftp> quit\nbobby@laptop:/tmp $ \n```\n\n使用 `scp`，你可以从本地系统拷贝到远程系统，从远程系统拷贝到本地系统，或者从一个远程系统拷贝到另一个系统。显示如下：\n\
  \n```\nbob@linuxsvr $ scp test.txt linuxsvr1:~/\ntest.txt     100%   35.3KB/s  \
  \ 00:00\nbob@linuxsvr $ scp linuxsvr1:~/test.txt .\ntest.txt     100%   35.3KB/s\
  \   00:00\nbob@linuxsvr $ scp linuxsvr1:~/test.txt linuxsvr2:/tmp/test-copy.txt\n\
  bob@linuxsvr $\n\nSCP 和 SFTP 不是向远程系统传输文件的唯一方法。有时启用了 FTP（文件传输协议）。在这种情况下，你可以使用 Linux\
  \ 和 Mac 内置的 `ftp` 命令，以及 Windows 上的 WinSCP 等图形化客户端。请注意，FTP 不使用像 SCP 和 SFTP 那样的安全传输协议。这意味着你的登录凭据是以明文在网络上传输的。此外，你上传和下载的文件也没有加密。如果在\
  \ SCP/SFTP 和 FTP 之间进行选择，请使用 SCP/SFTP。\n\n```\nbobby@laptop:~$ ftp linuxsvr\nConnected\
  \ to linuxsvr.\n220 ubuntu FTP server (Version 6.4) ready.\nName (linuxsvr:bobby):\
  \ bob\n331 Password required for bob.\nPassword:\n230 User bob logged in.\nRemote\
  \ system type is UNIX.\nUsing binary mode to transfer files.\nftp> pwd\n257 \"/home/bob\"\
  \ is current directory.\nftp> quit\n221 Goodbye.\n```\n\n如果 FTP 未启用，你会看到“连接拒绝”（Connection\
  \ refused）错误消息。\n\n```\nbobby@laptop:~$ ftp linuxsvr\nftp: connect: Connection refused\n\
  bobby@laptop:~$\n```\n\n\n\n\n\n*   通过密钥使用 SSH 连接 - 本书之前介绍过的 SSH 密钥信息。\n*   [Cyberduck](http://cyberduck.io/)\
  \ - 适用于 Mac 和 Windows 的 FTP 和 SFTP 客户端。\n*   [FileZilla](https://filezilla-project.org/)\
  \ - 适用于 Mac、Linux 和 Windows 的 FTP 和 SFTP 客户端。\n*   [FireFTP](https://addons.mozilla.org/en-US/firefox/addon/fireftp/)\
  \ -适用于 Mac、Linux 和 Windows 的 Firefox FTP 和 SFTP 客户端。\n*   [PuTTY](http://www.LinuxTrainingAcademy.com/putty/?utm_source=linux-for-beginners-ebook&utm_medium=ebook&utm_campaign=linux-for-beginners-ebook)\n\
  \    *   [PSCP.EXE](http://the.earth.li/~sgtatham/putty/latest/x86/pscp.exe) - 适用于\
  \ Windows 的 SCP 客户端\n    *   [PSFTP.EXE](http://the.earth.li/~sgtatham/putty/latest/x86/psftp.exe)\
  \ - 适用于 Windows 的 SFTP 客户端\n*   [Transmit](http://www.panic.com/transmit/) - 适用于\
  \ Mac 的 FTP 和 SFTP 客户端。\n*   [WinSCP](http://winscp.net) - 适用于 Windows 的 FTP 和 SFTP\
  \ 客户端。\n\n# 欢迎回到 Shell\n\n## 自定义提示符\n\n正如你在“欢迎 Shell”章节中所看到的，默认提示符因系统而异。无论你使用哪种\
  \ shell，都可以通过设置环境变量来自定义提示符。对于 `bash`、`ksh` 和 `sh` 等 shell，使用环境变量 `PS1` 来设置主提示符字符串。`csh`、`tcsh`\
  \ 和 `zsh` 使用环境变量 `prompt`。你放在环境变量中的格式字符串决定了提示符的外观和感受。每个 shell 使用不同的格式字符串，因此请参考你正在使用的\
  \ shell 的文档。\n\n让我们来看看自定义 bash 提示符，因为 bash 是 Linux 系统用户账户最常用的默认 shell。以下是 bash 中一些常用的格式字符串选项。完整列表请参阅\
  \ man 页（帮助手册）。\n\n*   `\\d` - “星期 月份 日期”格式的日期（例如“Tue May 26”）\n*   `\\h` - 到第一个\
  \ '.' 为止的主名\n*   `\\H` - 主机名\n*   `\\n` - 换行\n*   `\\t` - 24 小制 HH:MM:SS 格式的当前时间\n\
  *   `\\T` - 12 小制 HH:MM:SS 格式的当前时间\n*   `\\@` - 12 小制 am/pm 格式的当前时间\n*   `\\A` -\
  \ 24 小制 HH:MM 格式的当前时间\n*   `\\u` - 当前用户的用户名\n*   `\\w` - 当前工作目录，其中 `$HOME` 缩写为波浪号\
  \ `~`\n*   `\\W` - 当前工作目录的基名，其中 `$HOME` 缩写为波浪号 `~`\n*   `\\$` - 如果有效 UID 为 0，显示\
  \ `#`，否则显示 `$`\n\n以下是通过操作 `PS1` 环境变量来更改 bash shell 提示符的一些示例。\n\n```\n[bob@linuxsvr\
  \ ~]$ echo $PS1\n[\\u@\\h \\w]\\$\n[bob@linuxsvr ~]$ PS1=\"\\u@\\h \\$ \"\nbob@linuxsvr\
  \ $ PS1=\"<\\t \\u@\\h \\w>\\$ \"\n<16:42:58 bob@linuxsvr ~>$ cd /tmp\n<16:43:02\
  \ bob@linuxsvr /tmp>$ PS1=\"\\d \\t \\h \\W>\\$ \"\nMon Nov 18 16:45:51 linuxsvr\
  \ tmp>$ PS1=\"\\t\\n[\\h \\w]\\$ \"\n16:46:47\n[linuxsvr /tmp]$\n```\n\n为了让你自定义的\
  \ shell 提示符在登录之间保持有效，请将 `PS1` 值添加到个人初始化文件中。个人初始化文件通常被称为“点文件”（dot files），因为它们以点或句号开头。\n\
  \n```bash\n$ echo 'export PS1=\"[\\u@\\h \\w]\\$ \"' >> ~/.bash_profile\n```\n\n\
  ## 创建别名\n\n如果你发现自己反复输入同一个命令，可以为它创建一个快捷方式，称为别名（alias）。别名可以被视为文本扩展器。为非常长的命令创建别名也是常见的做法。例如，如果你经常输入\
  \ `ls -l`，可能想将其缩写为 `ll`。事实上，这个别名在许多 Linux 发行版中是预定义的。\n\n`alias [name[=value]]` -\
  \ 列出或创建别名。如果不提供参数，则显示当前别名列表。使用 `name=value` 创建新别名。\n\n```bash\n$ ls -l\ntotal 4\n\
  -rw-r--r-- 1 bob bob 221 Nov 13 11:30 file.txt\n$ alias ll='ls -l'\n$ ll\ntotal\
  \ 4\n-rw-r--r-- 1 bob bob 221 Nov 13 11:30 file.txt\n```\n\n\n\n\n\n现在你定义的别名在交互式和非交互式会话中均可用。以下是此更改后会话的行为。\n\
  \n### 交互式\n\n```\nmac:~ bob$ ssh linuxsvr\nLast login: Thu Nov  7 01:26:37 UTC 2013\n\
  Welcome to Ubuntu 12.04.3 LTS\n\n * Documentation:  https://help.ubuntu.com/\n\n\
  \  System info as of Nov 14 01:26:52 UTC 2013\n\n  System load:  0.42\n  Usage of\
  \ /:   3.1% of 40GB\n  Memory usage: 32%\n  Swap usage:   0%\n  Processes:     \
  \      89\n  Users logged in:     0\n  IP address for eth0: 10.0.0.7\n\nbob@linuxsvr:~$\
  \ ll\n-rw-r--r-- 1 bob bob 221 Nov 13 11:30 file.txt\nbob@linuxsvr:~$ exit\nlogout\n\
  Connection to 10.0.0.7 closed.\nmac:~ bob$\n```\n\n### 非交互式\n\n```\nmac:~ bob$ ssh\
  \ linuxsvr ll\n-rw-r--r-- 1 bob bob 221 Nov 13 11:30 file.txt\nmac:~ bob$\n```\n\
  \n## 注释\n\n在上面的示例中，你可能注意到在 `~/.bash_profile` 和 `~/.bashrc` 文件中井号（`#`）后面跟着一些类似于人类语言的文本。跟在井号后的任何文本都会被\
  \ shell 忽略。这是一个非常常见的模式，不仅适用于 shell，也适用于多种计算机编程语言。这种结构允许使用注释和标记，而不影响程序或脚本的执行。\n\n\
  `#` - 井号（Octothorpe）。也称为 hash、square、pound sign 或 number sign。该符号置于注释之前。\n\n```\n\
  $ # This does nothing.\n$ This does something.\nThis: command not found\n$ alias\
  \ # Show my aliases.\nalias egrep='egrep --color=auto'\nalias fgrep='fgrep --color=auto'\n\
  alias grep='grep --color=auto'\nalias l='ls -CF'\nalias la='ls -A'\nalias ll='ls\
  \ -l'\nalias ls='ls --color=auto'\n$\n```\n\n## Shell 历史记录\n\nshell 会记录你之前执行过的命令。Bash\
  \ 将当前会话的历史保存在内存中，并存储在 `~/.bash_history` 文件中以便在未来的会话中调用。其他 shell 可能使用 `~/.history`、`~/.zsh_history`\
  \ 或其他类似命的文件。访问 shell 历史记录极其有用，因为它允许你快速重复命令。这可以为你节省时间、减少击键次数、通过运行之前的良好命令来防止错误，并通常会加快工作流。\n\
  \n`history` - 显示 shell 历史中的命令列表。\n\n`!N` - 重复行数为 `N` 的命令。\n\n`!!` - 重复上一条命令行。\n\n\
  `!string` - 重复以 \"string\" 开头的最近一次命令。\n\n```\n$ history\n1 ls\n2 diff secret secret.bak\n\
  3 history\n$ !1\nls\nPerformanceReviews tpsreports \n$ echo $SHELL\n/bin/bash\n\
  $ !!\necho $SHELL\n/bin/bash\n$ !d\ndiff secret secret.bak\n3c3\n< pass: Abee!\n\
  ---\n> pass: bee\n$\n```\n\n使用感叹号历史扩展语法，你可以通过编号重新运行命令。在上面的示例中，历史记录中的第一条命令是通过 `!1`\
  \ 执行的。如果你想执行第二条命令，可以执行 `!2`。另一个方便的快捷键是 `!-N`，意味着执行倒数第 N 命令。如果你想执行倒数第二条命令，输入 `!-2`。由于\
  \ `!!` 重复最近一次命令，因此它等同于 `!-1`。\n\n```\n$ history\n1 ls\n2 diff secret secret.bak\n\
  3 history\n$ !-2\ndiff secret secret.bak\n3c3\n< pass: Abee!\n---\n> pass: bee\n\
  $\n```\n\n默认情况下，bash 在你的 shell 历史记录中保留 500 条命令。这由环境变量 `HISTSIZE` 控制。如果你想增加这个数字，请在你的个人初始化文件中添加\
  \ `export HISTSIZE=1000` 或类似内容。\n\n`Ctrl-r` - 反向搜索。在你的 shell 历史中搜索命令。\n\n你可以在历史记录中搜索命令。例如，如果你的\
  \ shell 历史记录中有命令 `find /var/tmp -type f`，你可以通过输入 `Ctrl-r fi Enter` 找到它。`Ctrl-r`\
  \ 启动反向搜索并显示提示，`fi` 是搜索字符串，`Enter` 执行找到的命令。你不需要搜索字符串的开头。你完全可以搜索 \"var\"tmp\" 或 \"\
  type\"。\n\n```\n$ find /var/tmp -type f\n/var/tmp/file.txt\n(reverse-i-search)`fi':\
  \ find /var/tmp -type f\n/var/tmp/file.txt\n```\n\n## Tab 补全\n\n提高 shell 效率的另一种方法是使用\
  \ Tab 补全。在开始输入命令后，你可以按下 `Tab` 键调用 Tab 补全。Tab 会尝试自动完成部分输入的命令。如果有多个以 `Tab` 之前的字符串开头命令，将显示这些命令。你可以继续操作。\n\
  \n`Tab` - Tab 补全。\n\n```\n$ find /var/tmp -type f\n/var/tmp/file.txt\n(reverse-i-search)`fi':\
  \ find /var/tmp -type f\n/var/tmp/file.txt\n```\n\n\n\n\n\n`a` - 进入插入模式，在当前位置追加文本。\n\
  \n`A` - 进入插入模式，在行尾追加文本。\n\n`I` - 进入插入编辑模式，在行首插入文本。\n\n`v` - 在由 `$EDITOR` 环境变量定义的编辑器中编辑当前命令行。\n\
  \n有关更多按键绑定，请参考本书书中关于 vi 编辑器 的章节。\n\n## 处理长 Shell 命令\n\n反斜杠 (`\\`) 是行换行延续符。你已经学习了如何使用反斜杠来转义空格等特殊字符。然而，当反斜杠放在行尾时，它被用作行换行延续符。这允许你创建在显示上为多行、但在\
  \ Shell 中执行为单行命令的命令行。你可以使用换行延续符让命令更具可读性且易于理解。\n\n```\n$ echo \"one two three\"\n\
  one two three\n$ echo \"one \\\n> two \\\n> three\"\none two three\n$ echo \"onetwothree\"\
  \nonetwothree\n$ echo \"one\\\n> two\\\n> three\"\nonetwothree\n$\n```\n\n注意上面示例中的大于符号\
  \ (`>`)。它是次级提示符字符串，可以通过更改 `PS2` 环境变量来自定义。你之前已经学习过如何在本书的自定义提示符章节中通过 `PS1` 更改主提示符字符串。\n\
  \n```\n$ PS2=\"line continued: \"\n$ echo \"one \\\nline continued: two \\\nline\
  \ continued: three\"\none two three\n$\n```\n\n## 环境变量\n\n你已经接触了环境变量并对其进行了良好利用。回顾一下，环境变量是一个具有名称和值的存储位置。它们通常会影响程序的行为。例如，你学习了如何通过定义\
  \ `$EDITOR` 环境变量来告知各种程序你偏好的编辑器。\n\n### 常见环境变量\n\n| 变量名 | 描述 |\n| --- | --- |\n|\
  \ EDITOR | 执行编辑操作的程序。 |\n| HOME | 用户的家目录。 |\n| LOGNAME | 用户的登录名。 |\n| MAIL | 用户本地收件箱的位置。\
  \ |\n| OLDPWD | 上一个工作目录。 |\n| PATH | 用冒号分隔的用于搜索命令的目录列表。 |\n| PAGER | 此程序可能被调用查看文件。\
  \ |\n| PS1 | 主提示符字符串。 |\n| PWD | 当前工作目录。 |\n| USER | 用户的用户名。 |\n\n### 查看环境变量\n\n\
  如果你知道想要检查的环境变量名称，可以运行 `echo $VARIABLE_NAME` 或 `printenv VARIABLE_NAME`。如果你想检查所有设置的环境变量，请使用\
  \ `env` 或 `printenv` 命令。\n\n`printenv` - 打印全部或环境变量。\n\n```\n$ printenv HOME\n/home/bob\n\
  $ echo $HOME\n/home/bob\n$ printenv\nTERM=xterm-256color\nSHELL=/bin/bash\nUSER=bob\n\
  PATH=/usr/local/bin:/usr/bin:/bin\nMAIL=/var/mail/bob\nPWD=/home/bob\nLANG=en_US.UTF-8\n\
  HOME=/home/bob\nLOGNAME=bob\n$ env\nTERM=xterm-256color\nSHELL=/bin/bash\nUSER=bob\n\
  PATH=/usr/local/bin:/usr/bin:/bin\nMAIL=/var/mail/bob\nPWD=/home/bob\nLANG=en_US.UTF-8\n\
  HOME=/home/bob\nLOGNAME=bob\n$\n```\n\n### 导出环境变量\n\n当进程启动时，它会继承创建它的进程所导出的环境变量。一个设置或更改的变量只会影响当前运行的进程，除非它被导出（export）。未导出的变量被称为本地变量。`export`\
  \ 命令允许变量被后续执行的命令使用。这是一个示例。\n\n```\n$ echo $PAGER\n\n$ PAGER=less\n$ echo $PAGER\n\
  less\n$ bash\n$ echo $PAGER\n\n$ exit\nexit\n$ export PAGER=less\n$ bash\n$ echo\
  \ $PAGER\nless\n$ exit\nexit\n$\n```\n\n在上面的示例中，`PAGER` 定义在当前环境中。当你启动一个子进程时，它会继承你当前环境中导出的所有环境变量。由于\
  \ `PAGER` 没有被导出，因此在派生的 bash shell 中没有设置。当你导出 `PAGER` 时，你发现它确实在子进程中可用。\n\n## 从环境中移除变量\n\
  \n你可以使用 `unset` 来移除或删除环境变量。\n\n```\n$ echo $PAGER\nless\n$ unset PAGER\n$ echo $PAGER\n\
  \n$\n```\n\n## 深度学习\n\n- [Bash it](https://github.com/revans/bash-it) - 用于管理你 bash\
  \ 配置的框架。\n- [命令行补全](http://en.wikipedia.org/wiki/Command-line_completion) - Tab\
  \ 补全解释。\n- [Shell 配置文件](https://en.wikipedia.org/wiki/Unix_shell#Configuration_files_for_shells)\
  \ - 用于配置 shell 环境的文件列表。\n- [Dotfiles.org](http://dotfiles.org/) - 上传、下载和分享你的 dotfiles\
  \ 的地方。\n- [Dotfiles.github.io](http://dotfiles.github.io/) - github 上上 dotfiles\
  \ 的指南。\n- [Oh my ZSH](https://github.com/robbyrussell/oh-my-zsh) - 用于管理 zsh 配置的社区驱动框架。\n\
  - Shells\n    - [Bourne Shell](https://en.wikipedia.org/wiki/Bourne_shell)\n   \
  \ - [Bash](https://www.gnu.org/software/bash/)\n    - [C Shell](https://en.wikipedia.org/wiki/C_shell)\n\
  \    - [Korn Shell](http://www.kornshell.com/)\n    - [tcsh](http://www.tcsh.org/)\n\
  \    - [Z Shell](http://www.zsh.org/)\n- [交互式使用 Bash History](http://www.gnu.org/software/bash/manual/bashref.html#Using-History-Interactively)\
  \ - 官方 Bash 历史文档。\n- [Unix Shell](https://en.wikipedia.org/wiki/Unix_shell) - 关于\
  \ shell 用户界面的文章。\n\n# 进程与作业控制\n\n## 列出进程并显示信息\n\n显示当前运行的进程使用 `ps` 命令。如果没有指定选项，`ps`\
  \ 会显示与当前会话相关的进程。要查看所有进程（包括不属于你的进程），使用 `ps -e`。要查看特定用户运行的进程，使用 `ps -u username`。\n\
  \n`ps` - 显示进程状态。\n\n常用的 `ps` 选项：\n\n- `-e` - 全部，所有进程。\n- `-f` - 完整格式列表。\n- `-u username`\
  \ - 显示作为 username 运行的进程。\n- `-p pid` - 显示 pid 的进程信息。PID 是进程 ID。\n\n常用的 `ps` 命令：\n\
  \n- `ps -e` - 显示所有进程。\n- `ps -ef` - 显示所有进程。\n- `ps -eH` - 显示进程树。\n- `ps -e --forest`\
  \ - 显示进程树。\n- `ps -u username` - 显示作为 username 运行的进程。\n\n```\n$ ps\n  PID TTY  \
  \        TIME CMD\n19511 pts/2    00:00:00 bash\n19554 pts/2    00:00:00 bash\n\
  $ ps -e\n19511 pts/2    00:00:00 bash\n19554 pts/2    00:00:00 bash\n$ ps -ef\n\
  19511 pts/2    00:00:00 bash\n19554 pts/2    00:00:00 bash\n$ ps -eH\n19511 pts/2\
  \    00:00:00 bash\n19554 pts/2    00:00:00 bash\n$ ps -e --forest\n19511 pts/2\
  \    00:00:00 bash\n19554 pts/2    00:00:00 bash\n$ ps -u username\n19511 pts/2\
  \    00:00:00 bash\n19554 pts/2    00:00:00 bash\n$ ps\n  PID TTY          TIME\
  \ CMD\n19511 pts/2    00:00:00 bash\n19554 pts/2    00:00:00 bash\n$ ps -e\n  PID\
  \ TTY          TIME CMD\n19511 pts/2    00:00:00 bash\n19554 pts/2    00:00:00 bash\n\
  $ ps -ef\n  PID TTY          TIME CMD\n19511 pts/2    00:00:00 bash\n19554 pts/2\
  \    00:00:00 bash\n$ ps -eH\n  PID TTY          TIME CMD\n19511 pts/2    00:00:00\
  \ bash\n19554 pts/2    00:00:00 bash\n$ ps -e --forest\n  PID TTY          TIME\
  \ CMD\n19511 pts/2    00:00:00 bash\n19554 pts/2    00:00:00 bash\n$ ps -u username\n\
  \  PID TTY          TIME CMD\n19511 pts/2    00:00:00 bash\n19554 pts/2    00:00:00\
  \ bash\n```\n\n这里是其他允许你查看运行进程的命令。\n\n\n\n\n\n`pstree` - 以树状格式显示运行中的进程。\n\n`htop`\
  \ - 交互式进程查看器。此命令比 `top` 不常用，系统上可能未安装。\n\n`top` - 交互式进程查看器。\n\n## 在前台和后台运行进程\n\n\
  到目前为止，你执行的所有命令都在前台运行。当一个命令、进程或程序在前台运行时，在进程进程退出之前，shell 提示符不会显示。对于运行时间较长的程序，将它们发送到后台可能非常方便。后台运行的进程仍然会执行并完成其任务，但它们不会阻止你在\
  \ shell 提示符处输入后续命令。要将进程放入后台，请在命令末尾加上安符（`&`）。\n\n`command &` - 在后台启动命令。\n\n`Ctrl-c`\
  \ - 杀死前台进程。\n\n`Ctrl-z` - 挂起前台进程。\n\n`bg [%num]` - 将挂起的进程放入后台。\n\n`fg [%num]` -\
  \ 将后台进程置于前台。\n\n`kill [%num]` - 通过作业号或 PID 杀死进程。\n\n`jobs [%num]` - 列出作业。\n\n```\n\
  $ ./long-running-program &\n[1] 22686\n$ ps -p 22686\n  PID TTY          TIME CMD\n\
  22686 pts/1    00:00 long-running-program\n$ jobs\n[1]+  Running  ./long-running-program\
  \ &\n$ fg\n```\n\n当一个命令被放入后台时，会显示两个数字。括号中的数字是作业号，可以通过 % 符号引用。第二个数字是 PID。以下是在后台启动多个进程的示例：\n\
  \n```\n$ ./long-running-program &\n[1] 22703\n$ ./long-running-program &\n[2] 22705\n\
  $ ./long-running-program &\n[3] 22707\n$ ./long-running-program &\n[4] 22709\n$\
  \ jobs\n[1]   Done         ./long-running-program\n[2]   Done         ./long-running-program\n\
  [3]-  Running      ./long-running-program &\n[4]+  Running      ./long-running-program\
  \ &\n```\n\n`jobs` 输出中的加号（`+`）代表当前作业，减号（`-`）代表上一个作业。当前作业是被在前台运行时停止的最后一个作业，或者是后台启动的最后一个作业。当前作业可以通过\
  \ `%%` 或 `%+` 引用。如果在执行 `fg` 或 `bg` 命令时未提供作业信息，则会对当前作业操作。你会注意到作业 1 和 2 被报告为已完成。shell\
  \ 不中断你当前的命令行，但在显示新提示符之前报告作业状态。例如，如果你在后台启动程序，会返回提示符。shell 在显示新提示符之前报告作业状态。你可以通过按回车键请求新提示符。\n\
  \n要将作业带回前台，输入作业名称或使用 `fg` 命令。要将当前作业置于前台，执行 `%%`、`%+`、`fg`、`fg %+` 或 `%num`。要将作业\
  \ 3 置于前台，执行 `%3` 或 `fg %3`。\n\n```\n$ jobs\n[3]-  Running      ./long-running-program\
  \ &\n[4]+  Running      ./long-running-program &\n$ fg %3\n./long-running-program\n\
  $\n```\n\n要暂停或挂起在前台运行的任务，输入 `Ctrl-z`。一旦作业挂起，就可以在前台或后台恢复。要将挂起的作业放入后台，输入作业名称后加上安符，或使用作业名加上\
  \ `bg`。\n\n```\n$ jobs\n[1]   Running   ./long-running-program &\n[2]-  Running\
  \   ./long-running-program &\n[3]+  Running   ./another-program &\n$ fg\n./another-program\n\
  ^Z\n[3]+  Stopped   ./another-program\n$ jobs\n[1]   Running   ./long-running-program\
  \ &\n[2]-  Running   ./long-running-program &\n[3]+  Stopped   ./another-program\n\
  $ bg %3\n[3]+ ./another-program &\n$ jobs\n[1]   Running   ./long-running-program\
  \ &\n[2]-  Running   ./long-running-program &\n[3]+  Running   ./another-program\
  \ &\n$\n```\n\n你可以使用 `kill` 命令停止或杀死后台作业。例如，杀死作业 1 时执行 `kill %1`。杀死在前台运行的任务，输入 `Ctrl-c`。\n\
  \n```\n$ jobs\n[1]   Running     ./long-running-program &\n[2]-  Running     ./long-running-program\
  \ &\n[3]+  Running     ./another-program &\n$ kill %1\n[1]   Terminated  ./long-running-program\n\
  $ jobs\n[2]-  Running     ./long-running-program &\n[3]+  Running     ./another-program\
  \ &\n$ fg %2\n./long-running-program\n^C\n$ jobs\n[3]+  Running     ./another-program\
  \ &\n$\n```\n\n## 杀死进程\n\n`Ctrl-c` - 杀死前台进程。\n\n`kill [signal] pid` - 向进程发送信号。\n\
  \n`kill -l` - 显示信号列表。\n\n`kill` 使用的默认信号是终止（termination）。你会看到此信号被称为 `SIGTERM` 或 `TERM`。信号有与其名称对应的数字。默认的\
  \ `TERM` 信号数字是 15。因此，运行 `kill pid`、`kill -15 pid` 和 `kill -TERM pid` 是等价。如果发送 `TERM`\
  \ 信号后进程没有终止，请使用数字为 9 的 `KILL` 信号。\n\n```\n$ ps | grep hard-to-stop\n27398 pts/1\
  \    00:00:00 hard-to-stop\n$ kill 27398\n$ ps | grep hard-to-stop\n27398 pts/1\
  \    00:00:00 hard-to-stop\n$ kill -9 27398\n$ ps | grep hard-to-stop\n$\n```\n\n\
  ## 深度解析\n\n- [Bash 作业控制文档](http://www.gnu.org/software/bash/manual/html_node/Job-Control.html)\n\
  \n# 使用 Cron 调度重复作业\n\n如果你需要按计划重复任务，可以使用 `cron` 服务。cron 服务每分钟检查一次是否有计划运行的任务，如果有则执行。Cron\
  \ 作通常用于自动化过程或执行常规维护。你可以通过 `crontab` 命令调度 cron 作业。\n\n`cron` - 一个基于时间的作业调度服务。该服务通常在系统启动时启动。\n\
  \n`crontab` - 一个用于创建、读取、更新和删除作业调度的程序。\n\n`crontab`（cron 表）是一个配置文件，指定了 cron 何时执行命令。`crontab`\
  \ 中的每行代表一个作业，包含两部分信息：1) 什么时候运行以及 2) 运行什么。时间规范由五个字段组成。它们是分钟、小时、日期、月份和星期。在时间规范之后，你提供了要执行的命令。\n\
  \n## Crontab 格式\n\n```\n* * * * * command\n| | | | | \n| | | | +-- 星期几   (0-6)\n\
  | | | +---- 年份的月份 (1-12)\n| | +------ 月份的日期 (1-31)\n| +-------- 小时             (0-23)\n\
  +---------- 分钟             (0-59)\n```\n\n在所有时间规范字段匹配当前日期和时间时才会执行。你可以指定命令只运行一次，但这不是\
  \ cron 的典型用例。通常，时间规范中的一个或多个字段会包含星号（`*`），用于匹配该字段的任何时间或日期。这里有一个示例 crontab：\n\n```\n\
  # 每周一 07:00 运行。\n0 7 * * 1 /opt/sales/bin/weekly-report\n```\n\n上述 crontab 条目的图示化表示：\n\
  \n```\n0 7 * * 1 /opt/sales/bin/weekly-report\n| | | | | \n| | | | +-- 星期几   (0-6)\n\
  | | | +---- 年份的月份 (1-12)\n| | +------ 月份的日期 (1-31)\n| +-------- 小时             (0-23)\n\
  +---------- 分钟             (0-59)\n```\n\n此作业仅在分钟为 0、小时为 7 且星期为 1 时运行。在星期字段中，0 代表星期日，1\
  \ 代表星期一，此类推。由于在这两个字段使用了星号，该作业将在任何日期和月份运行。\n\n如果命令产生了任何输出，它将通过发送给你。你可以使用 `mail` 命令检查本地邮件。如果你不希望接收电子邮件，可以像示例那样重定向命令的输出。\n\
  \n```\n# 每天 02:00 运行并将输出到日志文件。\n0 2 * * * /opt/acme/bin/backup-db > /var/opt/acme/backup-db.log\
  \ 2>&1\n```\n\n你可以为每个字段提供多个值。如果你想每半小时运行一次命令，可以这样做。\n\n\n\n\n\n```\n# 每 30 分钟运行一次。\n\
  0,30 * * * * /opt/acme/bin/half-hour-check\n\n# 实现相同功能的另一种方法。\n*/2 * * * * /opt/acme/bin/half-hour-check\n\
  ```\n\n在分钟字段中，你可以使用 `*/2` 代替 `0,30`。你甚至可以使用带连字符的范围。如果你想在每小时的前四分钟内每分钟运行一次任务，可以使用此时间规范：`0-4\
  \ * * * * command`。\n\ncron 调度器有多种实现方式，某些实现允许你在 crontab 中使用快捷方式和关键字。下面提供了了一些常用的关键字，但请参考你系统上的\
  \ cron 文档以确保这些内容可以生效。\n\n| 关键字 | 描述 | 等效命令 |\n| --- | --- | --- |\n| @yearly | 每年在\
  \ 1 月 1 日凌晨运行一次 | `0 0 1 1 *` |\n| @annually | 与 @yearly 相同 | `0 0 1 1 *` |\n| @monthly\
  \ | 每月在每月第一天的凌晨运行一次 | `0 0 1 * *` |\n| @weekly | 每周在周日的凌晨运行一次 | `0 0 * * 0` |\n\
  | @daily | 每天凌晨运行一次 | `0 0 * * *` |\n| @midnight | 与 @daily 相同 | `0 0 * * *` |\n\
  | @hourly | 每小时在小时开始时运行一次 | `0 * * * *` |\n| @reboot | 启动时运行 | 不适用 |\n\n## 使用 Crontab\
  \ 命令\n\n使用 `crontab` 命令来管理 cron 任务。\n\n`crontab file` - 从文件安装新的 crontab。\n\n`crontab\
  \ -l` - 列出你的 cron 任务。\n\n`crontab -e` - 编辑你的 cron 任务。\n\n`crontab -r` - 删除所有的 cron\
  \ 任务。\n\n```\n$ crontab -l\nno crontab for bob\n$ cat my-cron\n# 每周一的 07:00 运行。\n\
  0 7 * * 1 /opt/sales/bin/weekly-report\n$ crontab my-cron\n$ crontab -l\n# 每周一的\
  \ 07:00 运行。\n0 7 * * 1 /opt/sales/bin/weekly-report\n$ crontab -e\n# 启动 $EDITOR。\n\
  $ crontab -r\n$ crontab -l\nno crontab for bob\n$\n```\n\n## 深入研究\n\n* [WTF](http://wtf.github.io/)\
  \ - 解码 crontab 行。打印人类可读的输出。\n* [Maker](http://www.cronmaker.com/) - 一个帮助你构建 cron\
  \ 表达式的工具。\n* [重定向](https://en.wikipedia.org/wiki/Redirection_(computing))\n\n##\
  \ 切换用户并以其他身份运行\n\n## su\n\n以另一个用户启动会话的一种方法是使用 `su` 命令。如果没有给 `su` 提供任何参数，它将假设你正尝试变为超级用户（root）。执行\
  \ `su` 等同于执行 `root`。除非你指定了 `-`，否则你的当前环境将传递给新的 shell。在这种情况下，`su` 创建的环境将像你登录该用户时预期的那样。\n\
  \n`su [username]` - 更改用户 ID 或变为超级用户。\n\n常用的 `su` 选项：\n\n`-` - 用于提供一个类似于用户直接登录时预期的环境。\n\
  `-c command` - 指定要执行的命令。如果命令包含多个单词，则需要加引号。\n\n```\nbob@linuxsvr:~$ export TEST=1\n\
  bob@linuxsvr:~$ su oracle\nPassword:\noracle@linuxsvr:/home/bob$ echo $TEST\noracle@linuxsvr:/home/bob$\
  \ pwd\n/home/bob\noracle@linuxsvr: exit\nexit\nbob@linuxsvr:~$ su - oracle\nPassword:\n\
  oracle@linuxsvr:~$ echo $TEST\noracle@linuxsvr:~$ pwd\n/home/oracle\noracle@linuxsvr:~$\
  \ exit\nbob@linuxsvr:~$ su -c 'echo $ORACLE_HOME' oracle\nPassword:\nbob@linuxsvr:~$\
  \ su -c 'echo $ORACLE_HOME'\nbob@linuxsvr:~$\n```\n\n如果你想知道自己正在以哪个用户身份工作，请运行 `whoami`\
  \ 命令。\n\n`whoami` - 显示有效的用户名。\n\n```\n$ whoami\nbob\n$ su oracle\nPassword:\n$ whoami\n\
  oracle\n$\n```\n\n### Sudo - 超级用户\n\n切换用户或以其他身份执行命令的另一种方法是使用 `sudo` 命令。`sudo` 允许你以另一个用户的权限运行程序。与\
  \ `su` 类似，如果没有指定用户名，它假设你正尝试以超级用户的身份运行命令。这就是为什么 `sudo` 被称为 super user do（超级用户执行）。它通常用于安装、启动和停止需要超级用户权限的应用。\n\
  \n`sudo` - 以另一个用户（通常是超级用户）身份执行命令。\n\n使用 `sudo` 而非 `su` 命令的一个优势是不需要另一个用户的密码。这可以消除因使用共享密码和通用账户产生的问题。当你执行\
  \ `sudo` 命令时，系统会提示你输入自己的密码。如果 `sudo` 配置允许访问，则执行命令。`sudo` 配置通常由系统管理员控制，需要 root 权限。\n\
  \n## 使用 Sudo\n\n使用 `sudo` 的常见方法如下：\n\n`sudo -l` - 显示可以使用 `sudo` 执行的命令。\n\n`sudo\
  \ command` - 以超级用户身份执行命令。\n\n`sudo` - 以 root 身份执行命令。\n\n`sudo -u [user] command`\
  \ - 以用户身份执行命令。\n\n`sudo -u user` - 以用户身份执行命令。\n\n`sudo -u user` - 以用户身份执行命令。\n\n\
  \n\n\n\n```\n$ yum search inkscape\nLoaded plugins: refresh-packagekit, security\n\
  ============= N/S Matched: inkscape =============\ninkscape-docs.i686 : Documentation\
  \ for Inkscape\ninkscape.i686 : Vector-based drawing program using SVG\ninkscape-view.i686\
  \ : Viewing program for SVG files\n\n  Name and summary matches only, use \"search\
  \ all\" for everything.\n$ \n```\n\n要安装软件，请使用 `yum install package`。安装软件需要超级用户权限。这意味着你需要使用\
  \ `sudo` 或通过 `su` 命令切换到 root 账户。\n\n```\n$ sudo yum install inkscape\n[sudo] password\
  \ for bob: \nLoaded plugins: refresh-packagekit, security\nSetting up Install Process\n\
  Resolving Dependencies\n--> Running transaction check\n---> Package inkscape.i686\
  \ 0:0.47-6.el6 will be installed\n--> Processing Dependency: python for package:\
  \ inkscape-0.47-6.el6.i686\n...\nDependencies Resolved\n\n============================================================\n\
  \ Package      Arch    Version           Repository   Size\n============================================================\n\
  Installing:\n inkscape     i686    0.47-6.el6        base        8.6 M\nInstalling\
  \ for dependencies:\n ImageMagick  i686    6.5.4.7-7.el6_5   updates     1.7 M\n\
  ...\nTransaction Summary\n============================================================\n\
  Install      21 Package(s)\n\nTotal download size: 21 M\nInstalled size: 97 M\n\
  Is this ok [y/N]: y\nDownloading Packages:\n(1/21): ImageMagick-6.5.4.7-7.el6_5.i686.rpm\
  \     \n...\nInstalled:\n  inkscape.i686 0:0.47-6.el6\n\nDependency Installed:\n\
  \  ImageMagick.i686 0:6.5.4.7-7.el6_5 \n...\nComplete!\n$\n```\n\n要卸载软件包，请使用 `yum\
  \ remove`。移除软件需要超级用户权限。\n\n```\n$ sudo yum remove inkscape\nLoaded plugins: refresh-packagekit,\
  \ security\nSetting up Remove Process\nResolving Dependencies\n--> Running transaction\
  \ check\n---> Package inkscape.i686 0:0.47-6.el6 will be erased\n--> Finished Dependency\
  \ Resolution\n\nDependencies Resolved\n\n============================================================\n\
  \ Package      Arch     Version        Repository       Size\n============================================================\n\
  Removing:\n inkscape     i686     0.47-6.el6     @base            37 M\n\nTransaction\
  \ Summary\n============================================================\nRemove\
  \        1 Package(s)\n\nInstalled size: 37 M\nIs this ok [y/N]: y\nDownloading\
  \ Packages:\nRunning rpm_check_debug\nRunning Transaction Test\nTransaction Test\
  \ Succeeded\nRunning Transaction\n  Erasing    : inkscape-0.47-6.el6.i686    1/1\
  \ \n  Verifying  : inkscape-0.47-6.el6.i686    1/1 \n\nRemoved:\n  inkscape.i686\
  \ 0:0.47-6.el6\n\nComplete!\n$ \n```\n\n### `rpm` 命令\n\n除了 `yum` 命令外，你还可以使用 `rpm`\
  \ 命令与包管理器交互。\n\n`rpm -qa` - 列出所有已安装的软件包。\n\n`rpm -qf /path/to/file` - 列出包含文件的软件包。\n\
  \n`rpm -ivh package.rpm` - 从名为 package.rpm 的文件安装软件包。\n\n`rpm -ql package` - 列出属于软件包的所有文件。\n\
  \n```\n$ rpm -qa | sort | head\nacl-2.2.49-6.el6.i686\nacpid-1.0.10-2.1.el6.i686\n\
  aic94xx-firmware-30-2.el6.noarch\nalsa-lib-1.0.22-3.el6.i686\nalsa-plugins-pulseaudio-1.0.21-3.el6.i686\n\
  alsa-utils-1.0.22-5.el6.i686\nanaconda-13.21.215-1.el6.centos.i686\nanaconda-yum-plugins-1.0-5.1.el6.noarch\n\
  apache-tomcat-apis-0.1-1.el6.noarch\napr-1.3.9-5.el6_2.i686\n$ rpm -qf /usr/bin/which\n\
  which-2.19-6.el6.i686\n$ sudo rpm -ivh SpiderOak-5.0.3-1.i386.rpm \n[sudo] password\
  \ for bob: \nPreparing...       ####################### [100%]\n   1:SpiderOak \
  \    ####################### [100%]\n$ \n```\n\n## 在 Debian 和 Ubuntu 上安装软件\n\nDebian\
  \ 和 Ubuntu 发行版使用一种名为 APT（高级软件包工具）的包管理器。APT 由几个小实用程序组成，其中最常用的两个是 `apt-cache` 和 `apt-get`。\n\
  \n`apt-cache search search-string` - 搜索 search-string。\n\n`apt-get install [-y]\
  \ package` - 安装软件包。使用 `-y` 自动回答是。\n\n`apt-get remove` - 移除软件包。\n\n`apt-get purge`\
  \ - 移除软件包并删除配置文件。\n\n`apt-cache show package` - 显示软件包信息。\n\n`apt-cache search search-string`\
  \ - 搜索要安装的软件。\n\n```\n$ apt-cache search inkscape\ncreate-resources - shared resources\
  \ for use\ninkscape - vector-based drawing program\npython-scour - inkscape\nink-generator\
  \ - automatically generate files from a\nlyx - document processor\nrobocut - Control\
  \ program\nsozi - inkscape extension for animated presentations\nttf-rufscript -\
  \ handwriting font for Latin characters (transitional dummy package)\n$\n```\n\n\
  $ sudo apt-get install inkscape\nReading package lists... Done\nBuilding dependency\
  \ tree\nReading state information... Done\nThe following extra packages will be\
  \ installed:\n  aspell aspell-en cmap-adobe-japan1 dbus-x11\n...3 upgraded, 74 newly\
  \ installed, 0 to remove and 96 not upgraded.\nNeed to get 62.7 MB of archives.\n\
  After this operation, 171 MB of additional disk space will be used.\nDo you want\
  \ to continue [Y/n]? y\n...\nSetting up perlmagick (8:6.6.9-5ubuntu3.2) ...\nProcessing\
  \ triggers for libc-bin ...\nldconfig deferred processing now taking place\n$\n\
  ```\n\n$ sudo apt-get remove inkscape\nReading package lists... Done\nBuilding dependency\
  \ tree\nReading state information... Done\nThe following packages will be REMOVED:\n\
  \  inkscape\n0 upgraded, 0 newly installed, 1 to remove and 96 not upgraded.\nAfter\
  \ this operation, 64.9 MB disk space will be freed.\nDo you want to continue [Y/n]?\
  \ y\n(Reading database ... 69841 files and directories currently installed.)\nRemoving\
  \ inkscape ...\nProcessing triggers for man-db ...\nProcessing triggers for hicolor-icon-theme\
  \ ...\n$\n\n### `dpkg` 命令\n\n除了 `apt` 工具外，你还可以使用 `dpkg` 命令与包管理器交互。\n\n`dpkg -l`\
  \ - 列出所有已安装的软件包。\n\n`dpkg -S /path/to/file` - 列出包含文件的软件包。\n\n`dpkg -i package.deb`\
  \ - 从名为 package.deb 的文件安装软件包。\n\n`dpkg -L package` - 列出属于软件包的所有文件。\n\n\n\n\n\n```bash\n\
  $ dpkg -l | head\nDesired=Unknown/Install/Remove/Purge/Hold\n| Status=Not/Inst/Conf-files/Unpacked/halF-conf/Half-inst/trig-aWait/Trig-pend\n\
  |/ Err?=(none)/Reinst-required (Status,Err: uppercase=bad)\n||/ Name           \
  \   Version                Description\n+++-=================-======================-=================================\n\
  ii  accountsservice   0.6.15-2ubuntu9.6      query and manipulate user account information\n\
  ii  acpid             1:2.0.10-1ubuntu3      Advanced Configuration and Power Interface\
  \ event daemon\nii  adduser           3.113ubuntu2           add and remove users\
  \ and groups\nii  apparmor          2.7.102-0ubuntu3.9     User-space parser utility\
  \ for AppArmor\nii  apport            2.0.1-0ubuntu17.5      automatically generate\
  \ crash reports for debugging\n$ dpkg -S /usr/bin/which\ndebianutils: /usr/bin/which\n\
  $ sudo dpkg -i spideroak_5.1.3_i386.deb \n[sudo] password for bob: \nSelecting previously\
  \ unselected package spideroak.\n(Reading database ... 153942 files and directories\
  \ currently installed.)\nUnpacking spideroak (from spideroak_5.1.3_i386.deb) ...\n\
  Setting up spideroak (1:5.1.3) ...\nProcessing triggers for man-db ...\nProcessing\
  \ triggers for desktop-file-utils ...\nProcessing triggers for bamfdaemon ...\n\
  Rebuilding /usr/share/applications/bamf.index...\nProcessing triggers for gnome-menus\
  \ ...\n$ \n```\n\n## 安装 Linux 软件的免费视频\n\n如果你想确切看看在 Linux 系统上安装软件究竟是什么样子的，请查看我为你制作的这段视频：[`www.linuxtrainingacademy.com/installing/`](http://www.linuxtrainingacademy.com/installing/)\n\
