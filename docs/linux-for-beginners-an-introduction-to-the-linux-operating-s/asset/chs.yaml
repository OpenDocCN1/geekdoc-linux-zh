  \ `ssh-keygen` 命令和 `ssh` 使用的功能说明性指令。）\n\n# 通过 Telnet 连接\n\nTelnet 曾是连接 Unix 或 Linux\
  \ 服务器的默认方式。多年来，telnet 已被 Secure Shell（简称 SSH）所取代。SSH 正如其所示，比 telnet 更安全。Telnet 以明文形式通过网络发送你的登录凭据。SSH\
  \ 加密了客户端与服务器之间的通信，从而大大提高了安全性。如果有人对你的连接进行数据包嗅探或监听，他们将看到乱码和随机字符。如果你确实需要 telnet 到某个系统，可以使用上面的\
  \ SSH 指令，但需要进行几处微调。\n\n### 从 Windows 通过 Telnet 连接\n\n运行 PuTTY 并选择 `Telnet` 单选按钮。如果没有给你提供端口，请保留默认值\
  \ 23。当你连接到服务器时，系统会提示你输入用户名和密码。\n\n### 从 Mac 通过 Telnet 连接\n（提供的文本在这一部分不完整。）\n\n\n\
  \n\n\nMac 内置的 `telnet` 客户端是一个命令行程序。你可以通过 Mac 操作系统自带的 `Terminal` 应用程序运行命令行程序。它位于\
  \ `/Applications/Utilities` 文件夹。`telnet` 命令的格式为 `telnet servername port_number`。只有当端口号与默认值\
  \ `23` 不同时，你才需要包含它。连接到服务器时，系统会提示你输入用户名和密码。\n\n```\nmac:~ bob$ telnet linuxsvr\n\
  Trying 10.0.0.7...\nConnected to 10.0.0.7.\nEscape character is '^]'.\nUbuntu 12.04.3\
  \ LTS\nlinuxsvr login: bob\nPassword: \nLast login: Thu Nov  7 01:26:37 UTC 2013\n\
  Welcome to Ubuntu 12.04.3 LTS\n\n * Documentation:  https://help.ubuntu.com/\n\n\
  \  System info as of Nov 7 01:26:52 UTC 2013\n\n  System load:  0.42          \n\
  \  Usage of /:   3.1% of 40GB \n  Memory usage: 32%           \n  Swap usage:  \
  \ 0%\n  Processes:           89\n  Users logged in:     0\n  IP address for eth0:\
  \ 10.0.0.7\n\nbob@linuxsvr:~$ \n```\n\n## 直接连接\n\n如果你正像上一章节 中在 VirtualBox 中运行 Linux，或者你拥有安装了\
  \ Linux 的专用硬件，你可以直接登录服务器。系统会提示你输入用户名和密码。如果是图形界面，你需要在登录后找到一个终端应用程序。在大多数情况下，它就是 \"\
  terminal\"，但你可能会看到一些细微的，例如 \"gnome terminal\"konsole\" 或 \"xterm\"。\n\n以下是 CentOS\
  \ 中打开终端应用程序的界面。你可以在其中一个菜单中找到它。\n\n![CentOS](img/00016.jpeg \"CentOS\")\n\nCentOS\n\
