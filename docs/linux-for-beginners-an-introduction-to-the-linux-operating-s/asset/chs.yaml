  \ 入门》，我想送给你一份[Linux Windows 替代方案](http://www.linuxtraining.com/linux-apps/)。在书中，你将了解到今天\
  \ Linux 最流行的 50 多种应用程序。这些应用程序允许你浏览网页、观看电影、听音乐、连接你喜爱的网络、创建演示文稿等。这本书的完美补充将为你的旅程提供帮助。请访问\
  \ http://www.linuxtraining.com/linux-apps/ 或点击此处免费下载（http://www.linuxtraining.com/linux-apps/）。\n\
  \n# 引言\n在学习新技能时，知道从何处是一个挑战，尤其是当主题看起来非常庞大时。可用信息多到你甚至无法决定从哪里开始。或者糟糕的是，你开始了学习之路，却很快发现了太多未被解释的概念和细节。这种经历令人倍感沮丧，并让你疑问多于答案。*Linux\
  \ 入门*对你的背景不作任何假设。你不需要先验知识即可从书中受益。我们将使用逻辑化且系统的方法引导你逐步进行。当遇到新的概念、命令或术语时，我们将用通俗的语言进行解释，让任何人都能理解。\n\
  \n# 首先：获取访问权限\n为了开始学习 Linux 并测试你的新知识，你需要一个 Linux 系统的访问权限。如果你已经在 Linux 系统上拥有账户，可以直接跳到下一章。\n\
  \n## 基于 Web 的命令行访问\n获取可用 Linux 账户最快的方法是在浏览器中访问 `SimpleShell.com` 并点击“Start my session（启动我的会话）”。将显示一个连接到\
  \ Linux 服务器的终端模拟器。你将使用通用账户自动登录，并看到 shell 提示符。由于你没有个人账户，你的 shell 历史和创建任何文件将在会话结束时被删除。`SimpleShell`\
  \ 非常适合尝试几个命令或进行短期工作，因为每个会话限制为 15 分钟。你可以在 15 分钟结束后轻松启动另一个会话，但请注意你会丢失上一个会话中的工作。如果由于某些原因\
  \ `SimpleShell` 不可用，还有其他替代方案如 http://www.webminal.org 和 http://linuxzoo.net。\n\n\
  ## Web Hosting Shell 账户\n如果你使用主机托管服务来托管网站，你可能已经有一个可以使用的 Linux 账户。咨询你托管公司的文档并搜索“SSH”或“shell\
  \ access（shell 访问）”。`SSH` 代表 Secure Shell（安全壳），提供了通过网络（如互联网）连接服务器的方法。如果你还没有主机托管商，可以注册一个并用于\
  \ shell 访问。共享主机托管商通常每月仅收取几美元。\n\n以下是可以为你提供 shell 账户和 `SSH` 访问的共享主机托管公司：\n* 1and1.com\
  \ (http://www.1and1.com/?affiliate_id=4176043)\n* BlueHost.com (http://www.bluehost.com/track/jasonc)\n\
  * DreamHost.com (http://www.dreamhost.com/r.cgi?1526378)\n* HostGator.com (http://secure.hostgator.com/~affiliat/cgi-bin/affiliates/clickthru.cgi?id=jcannon)\n\
  * Site5.com (http://www.site5.com/in.php?id=185613)\n\n## 使用 VirtualBox 使用预装 Linux\
  \ 镜像\n`VirtualBox` (http://www.virtualbox.org/) 是一种可以安装在 Windows、Mac、Solaris 或 Linux\
  \ 上的虚拟化软件。它允许你在当前的操作系统（主机）内部运行操作系统（客体）。比其他选项更耗时，但拥有自己的个人 Linux 系统可能是值得额外付出的。在这种情况下，你将花费几分钟安装虚拟化软件、下载预装的\
  \ Linux 镜像并导入该镜像。\n\n\n\n\n\n要开始之前，请访问 [VirtualBox 下载页面](https://www.virtualbox.org/wiki/Downloads)\
  \ 获取适用于你当前操作系统的安装程序。一路点击安装界面并接受默认设置。\n\n接下来，从 [`virtualboxes.org/`](http://virtualboxes.org/)\
  \ 下载一个虚拟磁盘镜像 (VDI) 使用。我建议你下载 [CentOS](http://www.centos.org/) 或 [Ubuntu](http://www.ubuntu.com/)\
  \ ，除非你已经知道未来将使用哪种 Linux 发行版。说实话，你不会做出错决定。你在本书书中学到的概念适用于任何 Linux 发行版。\n\n* [CentOS\
  \ 虚拟磁盘镜像](http://virtualboxes.org/images/centos/)\n* [Ubuntu 虚拟磁盘镜像](http://virtualboxes.org/images/ubuntu-server/)\n\
  \n启动 VirtualBox，创建一个新的虚拟机，并使用你刚刚下载的虚拟磁盘镜像。当要求选择硬盘镜像时，选择“使用现有硬盘”（Use existing hard\
  \ disk）单选按钮并点击目录图标。接下来，点击“添加”（Add）并选择虚拟磁盘镜像。虚拟机启动后，你可以使用下载镜像时提供的用户名和密码登录服务器。\n\n\
  ## 深入探索\n\n* [4 种快速获取 Shell 账户并今天开始学习 Linux 的方法](http://www.linuxtrainingacademy.com/4-quick-and-easy-ways-to-get-access-to-a-shell-account-and-start-learning-linux-today/)\
  \ - 文章涵盖了更多选项并更加详细。\n* [创建、构建、测试驱动或部署你自己的拥有完全 Root 权限的 Linux 服务器](http://www.linuxtrainingacademy.com/create-build-test-drive-deploy-linux-server-full-root-access/)\
  \ - 一篇文章提供了更多获取 Linux 服务器访问的策略。\n* [如何在 Mac 上安装 VirtualBox](http://youtu.be/xBQdflx1L1o)\
  \ - 一段指导你如何在 Mac 上安装 VirtualBox 的视频。\n* [如何在 Windows 上安装 VirtualBox](http://youtu.be/CBhppdewtEQ)\
  \ - 一段指导你如何在 Windows 上安装 VirtualBox 的视频。\n* [VirtualBox 文档](https://www.virtualbox.org/wiki/Documentation)\
  \ - VirtualBox 官方文档。\n* [VirtualBox 下载页面](https://www.virtualbox.org/wiki/Downloads)\
  \ - 获取 VirtualBox 软件副本的地方。\n* [VirtualBoxes.org](http://virtualboxes.org) - 虚拟磁盘镜像的良好来源。\n\
  \n# 连接\n\n当你的账户创建后，你将获得如何连接到 Linux 服务器的详情。你可能会获得以下部分或全部：\n\n* 用户名。也称为账户、登录名或 ID。\n\
  * 密码\n* SSH 密钥\n* 服务器名称或 IP 地址\n* 端口号\n* 连接协议\n\n连接协议将 SSH（安全 Shell）或 telnet。SSH\
  \ 和 telnet 提供了通过互联网或局域网连接服务器的方法。在大多数情况下，连接协议将是 SSH。然而，Telnet 现在已过时，但如果你需要访问旧系统，可能会遇到它。\n\
  \n## 选择 SSH 客户端\n\n如果你被分配了一个特定的 SSH 客户端，请使用该程序并遵循该产品的文档。如果你可以自由选择自己的客户端或没有被提供，我建议在\
  \ Windows 上使用 PuTTY 或在 Mac 上使用 Terminal。\n\n可以从此网站下载 PuTTY：[`www.LinuxTrainingAcademy.com/putty/`](http://www.LinuxTrainingAcademy.com/putty/?utm_source=linux-for-beginners-ebook&utm_medium=ebook&utm_campaign=linux-for-beginners-ebook)。你只需要\
  \ `putty.exe` 即可开始。这里是 [`putty.exe`](http://the.earth.li/~sgtatham/putty/latest/x86/putty.exe)\
  \ 的直接链接：[`the.earth.li/~sgtatham/putty/latest/x86/putty.exe`](http://the.earth.li/~sgtatham/putty/latest/x86/putty.exe)。\n\
  \nTerminal 预装在 Mac 上，位于 `/Applications/Utilities` 文件夹中。\n\n在本章末尾的深入探索章节 中提供了其他 SSH\
  \ 客户端列表。\n\n## 从 Windows 使用密码通过 SSH 连接\n\n要使用 SSH 连接协议连接到 Linux 服务器，请启动 PuTTY。\n\
  \n![PuTTY](img/00001.jpeg \"PuTTY\")\n\nPuTTY\n\n在 `Host Name (or IP address)` 框中输入提供给你的主机名或\
  \ IP 地址。如果没有给你提供端口，请保持默认值 22。\n\n![PuTTY](img/00002.jpeg \"PuTTY\")\n\nPuTTY\n\n\
  通过点击左侧面板中的 `Data` 输入你的用户名。它位于 `Connection` 正下方。在 `Auto-login username` 字段中输入你的用户名。如果你跳过此步骤，在连接到服务器时将提示你输入用户名。\n\
  \n![PuTTY](img/00003.jpeg \"PuTTY\")\n\nPuTTY\n\n在 `Saved Sessions` 框中输入名称以保存你的会话。这允许你通过只需点击保存的会话来加快此过程。\n\
  \n![PuTTY](img/00004.jpeg \"PuTTY\")\n\nPuTTY\n\n当你点击 `Open` 时，将尝试连接。当你第一次连接到特定服务器时，PuTTY\
  \ 会询问是否缓存该服务器密钥。随后的连接将不再提示。要添加服务器主机密钥，只需点击 `Yes`。\n\n![PuTTY](img/00005.jpeg \"\
  PuTTY\")\n\nPuTTY\n\n一旦成功登录，你将看到类似的内容：\n\n![PuTTY](img/00006.jpeg \"PuTTY\")\n\n\
  PuTTY\n\n## 从 Mac 使用密码通过 SSH 连接\n\nMac 内置的 SSH 客户端是一个命令行程序。它位于 `/Applications/Utilities`\
  \ 文件夹中。`ssh` 命令的格式为 `ssh -p port_number username@servername`。如果没有给你提供端口号，则假设默认端口为\
  \ 22，你可以从命令中省略 `-p 22`。同样，只有当服务器上的用户名与 Mac 上的不同时，才需要指定用户名。例如，如果你的 Mac 用户名是 `bob`，而你在\
  \ `linuxsvr` 上的用户名也是 `bob`，你可以省略 `bob@` 并直接输入 `ssh linuxsvr`。一旦 Terminal 运行，输入 ssh\
  \ 命令。命令对大小写敏感，`ssh` 命令是小写的。它看起来应该像这三个选项之一：\n\n```\nssh linuxsvr\nssh bob@linuxsvr\n\
  ssh -p 2222 bob@linuxsvr\n```\n\n当你第一次连接到特定服务器时，你将被要求验证服务器的主机密钥。当被询问 `Are you sure\
  \ you want to continue connecting (yes/no)?` 时，输入 `yes` 并按 `Enter`。一旦建立连接，将提示你输入密码。\n\
  \n![Terminal](img/00007.jpeg \"Terminal\")\n\nTerminal\n\n像 Mac 一样，Linux 也带有一个终端程序和一个\
  \ SSH 客户端。一旦连接到一个 Linux 服务器，你可以使用 `ssh` 命令连接到另一个 Linux 服务器。你可以嵌套多个连接，并以这种方式在你的 Linux\
  \ 服务器网络中导航。\n\n## 关于通过密钥通过 SSH 连接的通用信息\n\n你可能没有收到密码，而是收到了一个 SSH 密钥，甚至被要求生成一个。在物理世界中，钥匙可以打开门。同样，SSH\
  \ 密钥用于解锁你在服务器上账户的访问权限。如果你没有密钥，就无法打开门。\n\n\n\n\n使用账户密码或账户密码与 SSH 密钥组合是一种常见做法。随着近年来云计算的增长，仅使用\
  \ SSH 密钥变得越来越流行。由于云服务器通常连接到公共网络，它们很容易受到暴力破解攻击。心怀不轨的人可能会编写一个程序，反复连接到你的服务器，每次尝试一个新的用户名和密码组合。他们可以通过使用常用用户名和密码列表来增加进入的概率。将你的云服务器配置为不接受密码并仅接受\
  \ SSH 密钥即可消除这种威胁。\n\n你可以通过为 SSH 密钥设置密码短语进一步提高其安全性。在这种情况下，你需要“你拥有的东西”（密钥）和“你知道的 set”（密码短语）才能访问你的账户。如果你确信密钥仅由你控制，可以放弃为密钥提供密码短语。这将允许你无需输入任何密码即可登录服务器。拥有没有密码短语的\
  \ SSH 密钥允许你自动化和调度需要登录远程系统的任务。\n\n# 在 Windows 上导入 SSH 密钥\n\n如果你获得了一个不是 PuTTY 格式的\
  \ SSH 密钥，你需要对其进行转换。在 Windows 系统上转换 SSH 密钥需要 PuTTYgen。这里是 [puttygen.exe](http://the.earth.li/~sgtatham/putty/latest/x86/puttygen.exe)\
  \ 的直接下载链接：[`the.earth.li/~sgtatham/putty/latest/x86/puttygen.exe`](http://the.earth.li/~sgtatham/putty/latest/x86/puttygen.exe)。\n\
  \n运行 PuTTYgen，点击 `Load` 并导航到你收到的私 SSH 密钥。私钥文件名通常为 `id_rsa` 或 `id_dsa`，公钥为 `id_rsa.pub`\
  \ 或 `id_dsa.pub`。\n\n![PuTTY](img/00008.jpeg \"PuTTY\")\n\nPuTTY\n\n现在你可以保存公钥和私钥，以便以后供\
  \ PuTTY 使用。\n\n# 在 Windows 上生成 SSH 密钥\n\n要在 Windows 系统上创建 SSH 密钥，你需要 PuTTYgen。这里是\
  \ [puttygen.exe](http://the.earth.li/~sgtatham/putty/latest/x86/puttygen.exe) 的直接下载链接：[`the.earth.li/~sgtatham/putty/latest/x86/puttygen.exe`](http://the.earth.li/~sgtatham/putty/latest/x86/puttygen.exe)。\n\
  \n![PuTTYgen](img/00009.jpeg \"PuTTYgen\")\n\nPuTTYgen\n\n运行 PuTTYgen 时，系统会要求你移动鼠标以创建一些随机数据，这些数据将用于密钥的生成。\n\
  \n![PuTTYgen](img/00010.jpeg \"PuTTYgen\")\n\nPuTTYgen\n\n你可以选择密钥使用密码短语。你也可以将注释更改为更有意义的内容，例如\
  \ `Bob's key`。\n\n![PuTTYgen](img/00011.jpeg \"PuTTYgen\")\n\nPuTTYgen\n\n现在，通过点击\
  \ `Save public key` 然后点击 `Save private key` 来保存公力和私钥。将公钥交给系统管理员，以便他们将其与你的账户关联。私钥仅供你个人使用。不要分享你的私钥！\n\
  \n接下来，点击 `Conversions` 然后点击 `Export OpenSSH Key` 将密钥导出为 OpenSSH 密钥。此 OpenSSH 密钥以后可以在\
  \ Unix 或 Linux 系统上使用。\n\n![PuTTYgen](img/00012.jpeg \"PuTTYgen\")\n\nPuTTYgen\n\n\
  ### 从 Windows 通过 SSH 连接\n\n遵循“从 Windows 使用密码通过 SSH 连”的说明，但这次需要增加一个步骤来指定你的 SSH 私钥文件。你可以通过点击左侧面板中\
  \ `SSH` 旁边的加号符号 (`+`) 来显示更多选项。接下来点击 `Auth`。在右侧面板中选择 `Private key file for authentication`\
  \ 字段下的 `Browse`，并找到你的私 SSH 密钥。\n\n![PuTTY](img/00013.jpeg \"PuTTY\")\n\nPuTTY\n\n\
