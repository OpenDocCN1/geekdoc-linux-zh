  \ Web Development, Fifth Edition` 网页版的访问权限，您只需要注册本书：\n1. 前往 `www.informit.com/register`\n\
  2. 登录或创建一个新账户\n3. 输入 ISBN：`9780321833891`\n4. 回答问题作为购买证明\n网页版将出现在您账户页面上的“数字购买”（Digital\
  \ Purchases）选项卡下。点击 `Launch` 链接访问产品。\n## 引言\n欢迎阅读 `PHP and MySQL Web Development`。在书页中，您将发现我们使用\
  \ `PHP` 和 `MySQL` 经验的精华知识，这是两种最重要且应用广泛的 Web 开发工具。\n本介绍涵盖的核心主题包括：\n![Image 为什么你应该读这本书\
  \ (#ch00.html_ch00lev1sec1)![Image](img/squ.jpg) 使用本书你将能够实现什么\n\n![Image](img/squ.jpg)\
  \ `PHP` 和 `MySQL` 是什么以及为什么它们很棒\n\n![Image](img/squ.jpg) `PHP` 和 `MySQL` 最新版本发生了哪些变化\n\
  \n![Image](img/squ.jpg) 本书的组织结构\n\n让我们开始吧。\n\n***\n\n注意\n\n访问我们的网站并在 `informit.com/register`\
  \ 注册本书，以便方便访问本书可能提供的任何更新、下载内容或错误说明。\n\n***\n\n### 为什么你应该读这本书\n\n这本书将教你如何创建交互式 Web\
  \ 应用，从简单的订单表到复杂的安全的 Web 应用程序。此外，你还将学习如何使用开源技术来实现。\n\n本书的目标读者是已经掌握 `HTML` 基础知识，并且之前在现代编程语言中进行过编程，但不一定为\
  \ Web 编写过程序或使用过关系数据库的读者。如果你是一个初级程序员，仍然会发现这本书很有用，但吸收内容可能需要更长的时间。我们努力不遗漏任何基本概念，但讲解这些概念的速度较快。本书的典型读者希望通过掌握\
  \ `PHP` 和 `MySQL` 来构建大型或商业性网站。你可能已经在使用另一种 Web 开发语言工作了；如果是这样，这本书应该能让你快速进入状态。\n\n\
  我们编写这本书的第一版，是因为我们厌倦了寻找那些基本上只是函数索引的 `PHP` 书。这些书虽然有用，但当你的老板或客户说“去为我写一个购物购物车”时，它们就派不上用了。在书中，我们尽力让每个示例都有用。你可以直接在你的网站中使用许多代码样本，也可以在进行微小修改后使用许多其他样本。\n\
  \n### 你将从书中学到什么\n\n阅读这本书将使你能够构建现实世界的应用程序。如果你曾用纯 `HTML` 构建过网站，你就会意识到这种方法的局限性。使用像\
  \ `PHP` 这样的语言和像 `MySQL` 这样的数据库可以让你的网站变为动态：除非你手动更新，否则它将保持不变。\n\n我们刻意将本书重点放在现实世界的应用上。我们从简单的系统开始，逐步深入\
  \ `PHP` 和 `MySQL` 的各个部分。然后我们讨论了与构建现实应用相关的安全和身份验证方面。我们还通过讨论 `JavaScript` 及其在开发中可以扮演的角色，向你介绍了前端和后端技术。\n\
  \n在书的最后一部分，我们描述了如何处理现实项目，并带你完成以下内容的规划和构建：\n\n![Image 用户认证与个性化![Image](img/squ.jpg)\
  \ 邮箱\n\n![Image](img/squ.jpg) 社交媒体集成\n\n你可以直接使用这些任何项目，也可以根据需求进行修改。如果你的需求不同，本书也将帮助你进步。\n\
  \n### 什么是 PHP？\n\n`PHP` 是一种专门为 Web 设计的服务器端脚本语言。在 `HTML` 页面中，你可以嵌入 `PHP` 代码，这些代码会在每次访问页面时执行。你的\
  \ `PHP` 代码在服务器端被解释，并生成访问者看到的 `HTML`或其他输出。\n\n`PHP` 诞生于 1994 年，最初是 Rasmus Lerdorf\
  \ 一个人的工作。被其他才华的人采用并经历了多次重大重写，才我们今天看到的广泛且成熟的产品。根据 Google 的 Greg Michillie 在 2013\
  \ 年 5 月的数据，`PHP` 运行了全球四分之三的网站，到 2016 年 7 月，这一数字已增长到 82% 以上。\n\n`PHP` 是一个开源项目，这意味着你可以访问源代码并自由地使用、修改和重新分发。\n\
  \n`PHP` 最初代表 *Personal Home Page*（个人主页），后来根据 GNU 的递归命名规范（GNU = Gnu’s Not Unix）进行了更改，现在代表\
  \ *PHP Hypertext Preprocessor*（PHP 超文本预处理器）。\n\n`PHP` 的当前版本是 7。该版本对底层的 Zend 引擎进行了完全重写，并对语言进行了重大改进。书中的所有代码都在编写时针对最新的\
  \ `PHP 7` 版本进行了测试和验证，同时也针对仍官方支持的 `PHP 5.6` 系列最新版本。\n\n\n\n\n\nPHP 的主页位于 [`www.php.net`](http://www.php.net)。\n\
  \nZend Technologies 的主页位于 [`www.zend.com`](http://www.zend.com)。\n\n## 什么是 MySQL？\n\
  \nMySQL（读音为 `My-Ess-Que-Ell`）是一个非常快速、健壮的关系型数据库管理系统（`RDBMS`）。数据库允许你高效地存储、搜索、排序和检索数据。MySQL\
  \ 服务器控制对数据的访问，以确保多个用户可以并发工作，提供快速访问，并确保只有授权用户才能获得访问权限。因此，MySQL 是一个多用户、多线程的服务器。它使用结构化查询语言（`SQL`），这是标准的数据库查询语言。MySQL\
  \ 自 1996 年起可用，但其开发历史可以追溯到 1979 年。它是世界上最流行的开源数据库，多次获得 Linux Journal 读者选择奖。\n\nMySQL\
  \ 采用双重许可方案提供服务。只要你愿意遵守该许可的条款，就可以可以在开源许可协议（`GPL`）免费使用它。如果你想分发包含 MySQL 的非 GPL 应用，可以购买商业许可。\n\
  \n## 为什么使用 PHP 和 MySQL？\n\n在着构建网站时，你可以使用许多不同的产品。\n\n你需要选择以下内容：\n\n![Image](img/squ.jpg)\
  \ 在哪里运行你的 Web 服务器：云、虚拟私有服务器或实际硬件\n\n![Image](img/squ.jpg) 操作系统\n\n![Image](img/squ.jpg)\
  \ Web 服务器软件\n\n![Image](img/squ.jpg) 数据库管理系统或其他数据存储器\n\n![Image](img/squ.jpg) 一种编程或脚本语言\n\
  \n你最终可能会得到一个具有多个数据存储器的混合架构。这些选择中的某些依赖于其他选择。例如，并不是所有的操作系统都能运行在所有硬件上，并不是所有的 Web 服务器都支持所有的编程语言，以此此类推。\n\
  \n在本书中，我们并不太关注硬件、操作系统或 Web 服务器软件。我们不需要这样做。PHP 和 MySQL 的优秀特性之一是它们可以与任何主要的操作系统以及许多次要操作系统配合。\n\
  \n大多数的 PHP 代码可以写成在操作系统和 Web 服务器之间具有可移植性。有一些 PHP 函数专门与文件系统相关且依赖于操作系统的，但这些在手册和本书中明确标记了。\n\
  \n无论你选择什么硬件、操作系统和 Web 服务器，我们认为你应该认真考虑使用 PHP 和 MySQL。\n\n## PHP 的一些优势\n\nPHP 的一些主要对手包括\
  \ Python、Ruby（基于 Rails 或其他）、Node.js、Perl、Microsoft .NET 和 Java。\n\n与这些产品相比，PHP 有许多优势，包括以下：\n\
  \n![Image](img/squ.jpg) 性能\n\n![Image](img/squ.jpg) 可扩展性\n\n![Image](img/squ.jpg)\
  \ 与许多不同数据库系统的接口\n\n![Image](img/squ.jpg) 针对许多常见 Web 任务的内置库\n\n![Image](img/squ.jpg)\
  \ 低成本\n\n![Image](img/squ.jpg) 易于学习和使用\n\n![Image](img/squ.jpg) 强大的面向对象支持\n\n![Image](img/squ.jpg)\
  \ 可移植性\n\n![Image](img/squ.jpg) 开发方法的灵活性\n\n![Image](img/squ.jpg) 源代码可用\n\n![Image](img/squ.jpg)\
  \ 支持和文档可用\n\n接下文将对这些优势进行更详细的讨论。\n\n### 性能\n\nPHP 非常快。使用单个廉价的服务器，你每天可以提供数百万次的访问。它可以从最小的电子邮件表单扩展，一直扩展到像\
  \ Facebook 和 Etsy 这样的网站。\n\n### 可扩展性\n\nPHP 拥有 Rasmus Lerdorf 经常提到的“无共享”架构。这意味着你可以使用大量的廉价服务器高效且廉价地实现水平扩展。\n\
  \n### 数据库集成\n\nPHP 提供了到许多数据库系统的原生连接。除了 MySQL 之外，你还可以直接连接到 PostgreSQL、Oracle、MongoDB\
  \ 和 MSSQL 等。`PHP 5` 和 `PHP 7` 还具有一个针对平文件的内置 SQL 接口，称为 `SQLite`。\n\n使用开放数据库连接（`ODBC`）标准，你可以连接到任何提供\
  \ ODBC 驱动程序的数据库。这包括微软产品以及许多其他。\n\n除了原生库外，PHP 还带有一个名为 `PHP Database Objects`（`PDOs`）的数据库访问抽象层，它允许一致的访问并促进安全编码实践。\n\
  \n### 内置库\n\n由于 PHP 设计用于在 Web 上使用，它具有许多内置函数来执行许多实用的 Web 相关任务。你只需要几行代码即可动态生成图像、连接到\
  \ Web 服务和其他网络服务、解析 XML、发送电子邮件、处理 Cookie 以及生成 PDF 文档。\n\n### 成本\n\nPHP 是免费的。你可以随时从\
  \ [`www.php.net`](http://www.php.net) 免费下载最新版本。\n\n### PHP 易于学习\n\nPHP 的语法基于其他编程语言，主要是\
  \ C 和 Perl。如果你已经认识 C 或 Perl，或者像 `C++` 或 `Java` 等类 C 语言，你几乎立即可以使用 PHP。\n\n### 面向对象支持\n\
  \n`PHP` 版本 5 具有良好的面向对象特性，这些特性在 `PHP` 版本 7 中继续得到完善和改进。如果你学习过 `Java` 或 `C++` ，你将发现预期的特性（以及通用语法），例如继承、私有和保护属性及方法、抽象类和方法、接口、构造函数和析构函数。你还会发现迭代器和\
  \ trait 等特性。\n\n### 可移植性\n\nPHP 适用于不同的操作系统。你可以在 Linux 和 FreeBSD 等类 Unix 系统、商业 Unix\
  \ 版本、OS X 或不同版本的 Windows 上运行 PHP。\n\n良好的代码通常不需要修改即可在不同系统中运行。\n\n### 开发方法的灵活性\n\n\
  PHP 允许你简单地实现简单任务，并同样容易地适应使用基于模型-视图-控制器（MVC）等模式框架的大应用程序。\n\n### 源代码\n\n你可以访问 PHP\
  \ 的源代码。对于 PHP，不像商业闭源产品，如果你想修改或向语言添加内容，你可以自由这样做。你不需要等待厂商发布补丁。\n\n### 支持和文档可用\n\n\
  Zend Technologies ([`www.zend.com`](http://www.zend.com)) 是 PHP 引擎的公司，通过提供商业支持和相关软件来资助\
  \ PHP 开发。\n\nPHP 文档和社区是成熟且丰富的资源，拥有大量信息。\n\n## PHP 7 的特性\n\n在 2015 年 12 月，期待已久的 PHP\
  \ 7 发布了。正如引言中所，本书涵盖了 `PHP 5.6` 和 `PHP 7`，这可能会让你问起“PHP 6 怎么了？”简短的回答是：没有 PHP 6，且对公众从未存在过。曾有一个针对被称为“PHP\
  \ 6”的代码库的开发工作，但它从未实现；存在许多雄心勃勃的计划和随后的复杂情况使得团队难以继续追求。\n\n\n\n\n\n在底层架构，`PHP 7` 包含了对驱动它的\
  \ `Zend Engine` 的重构，这使得许多 Web 应用的性能得到了显著提升——有时高达 100%！虽然性能的提升和内存使用的减少是 `PHP 7` 发布的关键，但向后兼容性也是如此。事实上，引入的不向后兼容语言变化相对较少。书中在各处结合语境讨论这些变化，以确保这些章节在\
  \ `PHP 5.6` 或 `PHP 7` 中均可可用，因为商业网络托管提供商尚未广泛采用 `PHP 7`。\n\n## MySQL 的一些优势\n\nMySQL\
  \ 在关系型数据库领域的主要竞争对手是 `PostgreSQL`、`Microsoft SQL Server` 和 `Oracle`。在 Web 应用领域，也存在使用\
  \ `NoSQL`/非关系型数据库（如 `MongoDB`）日益增长的趋势。让我们来看看为什么 `MySQL` 在很多情况下仍然是一个很好的选择。\n\n`MySQL`\
  \ 有许多优势，包括以下方面：\n\n![Image](img/squ.jpg) 高性能\n![Image](img/squ.jpg) 低成本\n![Image](img/squ.jpg)\
  \ 易于配置和学习\n![Image](img/squ.jpg) 可移植性\n![Image](img/squ.jpg) 源码可用\n![Image](img/squ.jpg)\
  \ 支持可用\n\n后续是对这些优势进行更详细的讨论。\n\n### 性能\n\n`MySQL` 无疑非常快。你可以在 [`www.mysql.com/why-mysql/benchmarks/`](http://www.mysql.com/why-mysql/benchmarks/)\
  \ 查看开发者的基准测试页面。\n\n### 低成本\n\n`MySQL` 可以通过开源许可免费获取，也可以通过商业许可低成本获取。如果你想将 `MySQL`\
  \ 作为应用程序的一部分进行分发，并且不想以开源许可授权你的应用程序，那么你需要一个许可证。如果你不打算分发你的应用程序（大多数 Web 应用都是如此），或者正在开发免费或开源软件，则不需要购买许可证。\n\
  \n### 易用性\n\n大多数现代数据库都使用 `SQL`。如果你用过其他 `RDBMS`，那么适应这个数据库应该不费吹。`MySQL` 也比许多同类产品更容易设置和调优。\n\
  \n### 可移植性\n\n`MySQL` 可以在许多不同的 `UNIX` 系统上运行，也可以在 `Microsoft Windows` 下运行。\n\n###\
  \ 源码\n\n与 `PHP` 一样，你可以获取并修改 `MySQL` 的源码。这一点对于大多数用户在大多数时候来说并不重要，但它为你提供了极佳的安全感，确保了未来的连续性，并在紧急情况下提供了选择。\n\
  \n事实上，现在有几个 `MySQL` 的分支版本和即插替换方案你可以考虑使用，包括 `MariaDB`，它由 `MySQL` 的原始作者编写，包括 Michael\
  \ ‘Monty’ Widenius ([`mariadb.org`](https://mariadb.org))。\n\n### 支持可用性\n\n并非所有开源产品都有提供支持、培训、咨询和认证的母公司，但你可以从\
  \ `Oracle` 获得所有这些利益（Oracle 通过收购 `Sun Microsystems` 获取了 `MySQL`，而后者此前收购了创始公司 `MySQL\
  \ AB`）。\n\n## MySQL (5.x) 有什么新？\n\n在写作时，`MySQL` 的当前版本是 `5.7`。\n\n在最近几个版本中添加到 `MySQL`\
  \ 的特性包括：\n\n![Image](img/squ.jpg) 广泛的安全改进\n![Image](img/squ.jpg) 对 `InnoDB` 表的 `FULLTEXT`\
  \ 支持\n![Image](img/squ.jpg) 为 `InnoDB` 的 `NoSQL`-风格 `API`\n![Image](img/squ.jpg)\
  \ 分区支持\n![Image](img/squ.jpg) 复制改进，包括基于行的复制和 `GTIDs`\n![Image](img/squ.jpg) 线程池\n\
  ![Image](img/squ.jpg) 可插身份验证\n![Image](img/squ.jpg) 多核可扩展性\n![Image](img/squ.jpg)\
  \ 更好的诊断工具\n![Image](img/squ.jpg) `InnoDB` 成为默认引擎\n![Image](img/squ.jpg) `IPv6` 支持\n\
  ![Image](img/squ.jpg) `Plugin API`\n![Image](img/squ.jpg) 事件调度\n![Image](img/squ.jpg)\
  \ 自动升级\n\n其他更改包括更多对 `ANSI` 标准的兼容性和性能改进。\n\n如果你仍在使用早期的 `4.x` 版本或 `3.x` 版本的 `MySQL`\
  \ 服务器，你应该知道以下特性从 `4.0` 版本开始被添加到各个版本中：\n\n![Image](img/squ.jpg) 视图\n![Image](img/squ.jpg)\
  \ 存储过程\n![Image](img/squ.jpg) 触发器和游标\n![Image](img/squ.jpg) 子查询支持\n![Image](img/squ.jpg)\
  \ 用于存储地理数据的 `GIS` 类型\n![Image](img/squ.jpg) 改进的国际化支持\n![Image](img/squ.jpg) 作为标准包含的事务安全存储引擎\
  \ `InnoDB`\n![Image](img/squ.jpg) `MySQL` 查询缓存，它极大提高了 Web 应用经常运行的重复查询速度\n\n## 本书是如何组织的？\n\
  \n本书分为五个主要部分：\n\n-   第一部分]，“使用 PHP”，通过示例概述了 `PHP` 语言的主要部分。每个示例都是构建电子商务网站时使用的真实案例，而不是“玩具”代码。我们从第\
  \ 1 章开始介绍本部分，“PHP 快速入门。”如果你已经用过 `PHP`，可以快速跳过这一章。如果你是 `PHP` 新手，可能需要多花点时间。\n-   第二部分]，“使用\
  \ MySQL”，讨论了使用关系数据库系统的概念和设计、使用 `SQL`、通过 `PHP` 连接数据库以及高级 `MySQL` 话题。\n-   第三部分]，“Web\
  \ 应用安全”，涵盖了使用任何语言开发 Web 应用的一些通用问题。我们将讨论使用 `PHP` 和 `MySQL` 验证用户并安全地收集、传输和存储数据。\n\
  -   第四部分]，“高级 PHP 技术”，详细介绍了 `PHP` 的内置函数。我们选择了构建 Web 应用时可能需要的函数组。你将学习与服务器交互、与网络交互、图像生成、日期时间处理以及会话处理。\n\
  -   第五部分]，“构建实用的 PHP 和 MySQL 项目”，这是我们最喜欢的部分。它处理诸如大型项目管理和调试等实际世界的问题，并提供了展示 `PHP`\
  \ 和 `MySQL` 功能和多性的示例项目。\n\n### 获取免费版\n\n你购买任何格式的本书都可以访问相应的 Web 版本，该版本提供了若干帮助你学习的特殊功能：\n\
