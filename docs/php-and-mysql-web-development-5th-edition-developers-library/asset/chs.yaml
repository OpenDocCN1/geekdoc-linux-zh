  \ Julie Meloni\n\n## 赞誉与证言\n\n“我从未买过比这更好的编程书……这本书证明了，在我买过的任何其他计算机相关书籍中，它是信息量最大的、最易于遵循的且例子最好的。文本非常易于理解！”\n\
  —Nick Landman\n\n“Welling & Thomson 编写的这本书是我发现的唯一不可或缺的书。它的写作清晰直白，从不浪费我的时间。书的布局非常精美。章节长度恰到好处，章节标题能迅速带你到达你想去的地方。”\n\
  —Wright Sullivan，A&E Engineering, Inc. 总裁，南罗来来纳州格林尔\n\n“我只想告诉你们，我认为《PHP and MySQL\
  \ Web Development》这本书太棒了！它的逻辑结构合理，对我来说难度恰恰好（中级），有趣且易于阅读，而且当然，充满了宝贵的信息！”\n—CodE-E，奥地利\n\
  \n“有几本很好的 PHP 入门书，但对于想要构建复杂可靠系统的人来说，Welling & Thomson 的这是一本优秀的手册。显而易见，作者在专业应用程序开发方面背景深厚，他们不仅教了语言本身，还教了如何通过良好的软件工程实践来使用它。”\n\
  —Javier Garcia，高级电信工程师，Telefonica R&D 实验室，马里德\n\n“我两天前买了这本书，现在已经看了一半了。我简直停不下来。布局和流程非常完美。一切的呈现方式都让信息非常易于吸收。能够立即掌握所有的概念。例子也非常棒。我只是必须抽时间表达一下我对这本书有多么满意。”\n\
  —Jason B.\n\n\n\n\n\n—来自芬兰拉赫廷的 jackofsometrades\n\n“这是一本写得很好的书，教人如何使用两种最流行的开源 Web\
  \ 开发技术来构建互联网应用程序……项目是本书的精髓所在。这些项目不仅以逻辑化的、基于组件的方式进行描述和构建，而且这些项目的选择代表了许多网站中内置常用组件的优秀横面。”\n\
  \n—Craig Cecil\n\n“这本书采用了一种简单、循序渐进的方法，即使是门外汉水平的程序员也能理解 `PHP` 语言。此外，在进行 Web 设计时，我经常发现自己会翻阅这本书。我仍在学习关于\
  \ `PHP` 的新知识，但这本书为我提供了一个坚实的基础，并至今一直帮助着我。”\n\n—Stephen Ward\n\n“这本书是少数几本真正触动了我并让我‘爱’上它的书之一。我不能把它放在书架上；我必须把它放在工作台上触手可及的地方，因为我总是想参考它。它的结构很好，语言简单直白，示例清晰且循序渐进。在阅读它之前，我对\
  \ `PHP` 和 `MySQL` 一无所知。在阅读之后，我有信心和技能开发任何复杂的 Web 应用。”\n\n“这本书简直是神书……我强烈向任何想要深度投入数据库驱动的\
  \ Web 应用程序编程的人推荐这本书。我希望更多的计算机书籍能按照这种方式组织。”\n\n—Sean C Schertell\n\n## 开发者库 (Developer’s\
  \ Library)\n\n### 编程专业人士必备参考\n\n*Developer’s Library* 系列书籍旨在为执业程序员提供在其日常工作中使用的编程语言和技术的独特、高质量参考资料和教程。\n\
  \n*Developer’s Library* 中的所有书籍由专家技术从业者编写，他们特别擅长以对其他程序员有用的方式来组织和展示信息。\n\n核心书目包括相关领域中最优秀、最受赞誉的书籍：\n\
  \n* `PHP & MySQL` — Luke Welling & Laura Thomson\n* `Web Development`\n* `MySQL`\
  \ — Paul DuBois\n* `Programming in C` — Stephen Kochan\n* `Python Essential Reference`\
