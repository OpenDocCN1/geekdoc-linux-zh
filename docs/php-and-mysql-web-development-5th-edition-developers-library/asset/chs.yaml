  \ 利用 `while`、`do` 和 `for` 循环进行迭代\n\n### 开始之前：访问 PHP\n\n为了完成本章及书中其他示例，你需要一个安装了 PHP\
  \ 的 Web 服务器。为了从示例和案例研究中获得最大收益，你应该运行并尝试修改它们。为了做到这一点，你需要一个可以实验的测试平台。\n\n如果你的机器上没有安装\
  \ PHP，你需要开始安装它或让你的系统管理员为你安装。你可以在 附录 A 中的“安装 Apache、PHP 和 MySQL](#app01.html_app01)”中找到相关说明。\n\
  \n### 创建示例应用程序：Bob 的汽车零件\n\n任何服务器端脚本语言最应用程序之一就是处理 HTML 表单。你将通过为“Bob 的汽车零件”（Bob’s\
  \ Auto Parts，一家虚拟配件公司）实现一个订单表来开始学习 PHP。你可以在光盘上名为 `chapter01` 的目录中找到本章用示例的所有代码。\n\
  \n#### 创建订单表\n\nBob 的 HTML 程序员已经为 Bob 销售的零件设置了一个订单表。如图 1.1 所示，这个相对简单的订单表与你在浏览时可能看到的许多表单类似。Bob\
  \ 希望知道客户订购了什么，计算订单的总价，并确定订单需要缴纳多少销售税。\n\n![Image](img/01fig01.jpg)\n\n图 1.1 Bob\
  \ 的初始订单表仅记录产品和数量\n\n此表的部分 HTML 代码显示在列表 1.1 中。\n\n代码列表 1.1 `orderform.html`——Bob\
  \ 基础订单表的 HTML\n\n点击此处查看代码\n\n```html\n<form action=\"processorder.php\" method=\"\
  post\">\n  <table style=\"border: 0px;\">\n    <tr style=\"background: #cccccc;\"\
  >\n      <td style=\"width: 150px; text-align: center;\">项目</td>\n      <td style=\"\
  width: 150px; text-align: center;\">数量</td>\n    </tr>\n    <tr>\n      <td>轮胎</td>\n\
  \      <td></td>\n    </tr>\n    <tr>\n      <td>机油</td>\n      <td></td>\n    </tr>\n\
  \    <tr>\n      <td>火花插</td>\n      <td></td>\n    </tr>\n    <tr>\n      <td colspan=\"\
  2\" style=\"text-align: center;\"><input type=\"submit\" value=\"提交\"></td>\n  \
  \  </tr>\n  </table>\n</form>\n```\n\n#### 处理表单\n\n为了处理表单，你需要创建 `form` 标签中 `action`\
  \ 属性提到的脚本 `processorder.php`。打开你的文本编辑器创建此文件。然后输入以下代码：\n\n点击此处查看代码\n\n```html\n<!DOCTYPE\
