  \ Web 开发者的行列，使用这些稳健、强大的工具轻松构建动态、实 Web 应用程序。\n\n# 第一部分：使用 PHP\n\n## 1 PHP 快速上手\n\n\
  本章将为你快速概述 PHP 语法和语言结构。如果你已经是一名 PHP 程序员，它可能会填补你知识中的空白。如果你有使用 C、Perl、Python 或编程语言的背景，它将帮助你快速进入状态。\n\
  \n在书中，你将通过完成大量来自我们构建真实网站经验的实战示例来学习如何使用 PHP。通常，编程教科书用非常简单的示例教授基础语法。我们选择不这样做。我们意识到，你的目标是让程序运行起来并理解这种语言是如何使用的，而不是苦苦研读另一本比在线手册好到何处的语法和函数参考书。\n\
  \n尝试这些示例。手动输入它们或从网站下载它们，修改它们，弄坏它们，然后学习如何再次修复它们。\n\n本章从一个在线产品订单表的示例开始，展示 PHP 中如何使用变量、运算符和表达式。它还涵盖了变量类型和运算符优先级。你将通过计算客户订单的总额和税费，学习如何访问并操作表单变量。\n\
