  \ 的汽车零件</h1>\n  <h2>订单结果</h2>\n</body>\n</html>\n```\n\n注意你到为止编写的所有内容都是纯 HTML。现在是时候在脚本中添加一些\
  \ PHP 代码了。\n\n### 将 PHP 嵌入 HTML\n\n在你文件的 `<h2>` 标题下方添加以下几行：\n\n```php\n<?php\n \
  \ echo '<p>订单已处理。</p>';\n?>\n```\n\n保存文件并通过填写 Bob 的表单并点击提交按钮在浏览器中加载它。你应该看到类似于图 1.2\
  \ 所示的输出。\n\n![Image](img/01fig02.jpg)\n\n图 1.2 传递给 PHP `echo` 构造的文本被输出到浏览器\n\n注意你编写的\
  \ PHP 代码是如何嵌入到一个看起来正常的 HTML 文件中的。尝试从浏览器查看源代码。你应该看到这段代码 `<!DOCTYPE html>`\n\n\n\n\
  \n\n<body>\n  <h1>Bob 的汽车零件店</h1>\n  <h2>订单结果</h2>\n  <p>订单已处理。</p>\n</body>\n\n\
  原始的 PHP 代码是不可见的，因为 PHP 解释器已经运行了该脚本并将其替换为脚本的输出。这意味着通过 PHP，你可以生成可以在任何浏览器中查看的整洁 HTML\
  \ 视图；换句话说，用户的浏览器不需要理解 PHP。\n\n这个示例简明扼要地说明了服务器端脚本的概念。PHP 是在 Web 服务器上进行解释和执行的，这与在用户机器的\
  \ Web 浏览器内解释和执行的 JavaScript 以及其他客户端技术是有区别的。\n\n你现在文件中拥有的代码由四种文本组成：\n\n![Image](img/squ.jpg)\
  \ HTML\n\n![Image](img/squ.jpg) PHP 标签\n\n![Image](img/squ.jpg) PHP 语句\n\n![Image](img/squ.jpg)\
  \ 空格\n\n你还可以添加注释。\n\n示例中的大部分行都只是普通的 HTML。\n\n## PHP 标签\n\n上一个示例中的 PHP 代码以 `<?php`\
  \ 开始，以 `?>` 结束。这与所有 HTML 标签都相似，因为它们都以小于符号（`<`）开头并以大于符号（`>`）结束。这些符号（`<?php` 和 `?>`）被称为\
  \ `PHP 标签`。它们告诉 Web 服务器 PHP 代码从哪里开始以及结束。标签之间的任何文本都被解释为 PHP。标签之外的任何文本都被视为普通的 HTML。PHP\
  \ 标签允许你从 HTML 中“逃逸”（`escape`）。\n\n实际上有两种 PHP 标签样式；以下代码段是等价的：\n\n![Image](img/squ.jpg)\
  \ **XML 样式**\n\n```php\n<?php echo '<p>Order processed.</p>'; ?>\n```\n\n这是我们在本书中使用的标签样式；它是首选的\
  \ PHP 标签样式。服务器管理员无法将其关闭，因此你可以保证它在所有服务器上都是可用的，这在你编写可能在不同安装版本上使用的应用程序时尤为重要。这种标签样式可以用于扩展标记语言\
  \ (XML) 文档。通常，我们建议你使用这种标签样式。\n\n![Image](img/squ.jpg) **短样式**\n\n```php\n<?php echo\
  \ '<p>Order processed.</p>'; ?>\n```\n\n这种标签样式是最简单的，并遵循标准通用标记语言 (SGML) 处理指令的样式。要使用这种类型的标签——它是输入最短的——你需要在你的配置文件中启用\
  \ `short_open_tag` 设置，或者在编译 PHP 时启用短标签。你可以在附录 A 中找到更多关于如何使用这种标签样式的信息。不建议在你计划分发的代码中使用这种样式。它在许多环境中将无法工作，因为它不再默认启用。\n\
  \n## PHP 语句\n\n你通过在开始标签和结束标签之间包含 PHP 语句来告诉 PHP 解释器要做什么。上一个示例只使用了一种语句：\n\n```php\n\
  echo '<p>Order processed.</p>';\n```\n\n正如你可能猜到的那样，使用 `echo` 结构具有非常简单的结果：它将传递给它的字符串打印（或回）到浏览器。在图\
  \ 1.2 中，你可以看到结果是浏览器窗口出现了 `Order processed.` 文本。\n\n注意 `echo` 语句末尾有一个分号。在 PHP 中，分号分隔语句，就像英语中的句号分隔句子一样。如果你以前用过\
  \ C 或 Java，你将熟悉这种使用分号的方式。\n\n漏掉分号是一个很容易犯的语法错误。然而，发现和纠正它同样容易。\n\n## 空格\n\n换行符（回车）、空格和制表符等字符被称为\
  \ `whitespace`（空白字符）。正如你可能已经知道的，浏览器忽略 HTML 中的空白字符，PHP 引擎也是如此。考虑这两个 HTML 片段：\n\n\
  点击此处查看代码图像\n\n```html\n<h1>Welcome to Bob's Auto Parts!</h1><p>What would you like\
  \ to order today?</p>\n```\n\n以及\n\n点击此处查看代码图像\n\n```html\n<h1>Welcome         \
  \ to Bob's\n\nAuto Parts!</h1>\n<p>What would you like\nto order today?</p>\n```\n\
  \n这两段 HTML 代码片段产生相同的输出，因为它们在浏览器看来是相同的。但是，你**可以**且**被鼓励**在 HTML 中明智地使用空格来作为人类的辅助——增强你的\
  \ HTML 代码的可读性。PHP 也是如此。你不需要在 PHP 语句之间留任何空白字符，但如果你将每个语句放在单独的一行，代码会变得更容易读。例如，\n\n\
  ```php\necho 'hello ';\n\necho 'world';\n```\n\n以及\n\n```php\necho 'hello ';echo\
  \ 'world';\n```\n\n这两者是等价的，但第一个版本更容易读。\n\n## 注释\n\n注释正如其名：代码中的注释充当阅读代码的人的笔记。注释可以用来解释脚本的、谁编写了它、为什么要这样写、最后一次修改是什么时候等。通常在除了最简单的\
  \ PHP 脚本之外的所有脚本中你都能找到注释。\n\nPHP 解释器忽略注释中的任何文本。本质上，PHP 解析器会跳过注释，使其等同于空白字符。\n\nPHP\
  \ 支持 C、C++ 和 shell 注释。\n\n以下是 C 风格的多行注释，它可能出现在脚本开头：\n\n点击此处查看代码图像\n\n```php\n/*\
  \ Author: Bob Smith\n   Last modified: April 10\n   此脚本处理订单。\n*/\n```\n\n多行注释以 `/*`\
  \ 开始，以 `*/` 结束。与 C 一样，多行注释不能嵌套。\n\n你也可以使用单行注释，分为 C++ 样式：\n\n点击此处查看代码图像\n\n```php\n\
  echo '<p>Order processed.</p>'; //\n```\n\n或者脚本样式：\n\n点击此处查看代码图像\n\n```php\necho\
  \ '<p>Order processed.</p>'; #\n```\n\n在这两种样式中，注释符号（`#` 或 `//`）之后的内容都是注释，直到到达行尾或\
  \ PHP 标签。\n\n在下面的代码行中，标签之前的文本 `here is a comment` 是注释的一部分。标签之后的文本 `here is not`\
  \ 被视为 HTML：\n\n点击此处查看代码图像\n\n```php\n// here is a comment ?> here is not\n```\n\n\
  ### 动态内容\n\n到目前为止，你还没有 PHP 做任何纯 HTML 无法做的事情。\n\n使用服务器端脚本语言的主要原因是为了给网站用户提供动态内容。根据用户的需求或随时间变化的内容将吸引访问者回到网站。PHP\
  \ 允许你轻松实现。\n\n让我们从一个简单的示例开始。将 `processorder.php` 中的 PHP 替换为以下代码：\n\n```php\n<?php\n\
  \  echo \"<p>Order processed at \";\n  echo date('H:i, jS F');\n  echo \"</p>\"\
  ;\n?>\n```\n\n你也可以使用连接运算符（`.`）将其写在一行，如\n\n点击此处查看代码图像\n\n```php\n<?php\n  echo \"\
  <p>Order processed at \".date('H:i, jS F').\"</p>\";\n?>\n```\n\n在这段代码中，PHP 内置的\
  \ `date()` 函数告诉客户订单被处理的日期和时间。每次运行脚本时这些信息都会不同。\n\n#### 调用函数\n\n看 `date()` 的调用。这是函数调用的通用形式。PHP\
  \ 拥有丰富的函数库可供你在开发 Web 应用程序时使用。许多函数需要接收某些数据并返回某些数据。\n\n再次看这个函数调用：\n\n```php\ndate('H:i,\
  \ jS F')\n```\n\n\n\n\n\n注意，它向括号内的函数传递了一个字符串（文本数据）。括号内的元素被称为函数的 `argument`（参数）或\
  \ `parameter`（参数）。这些参数是函数用于输出某些特定结果的输入内容。\n\n### 使用 `date()` 函数\n\n`date()` 函数期望你传递给它的参数是一个格式字符串，代表你希望的输出样式。字符串中的每个字母代表日期和时间的一个部分。`H`\
  \ 是 24 小时制的小时，需要时带有前导零；`i` 是分钟，需要时带有前导零；`j` 是不带前导零的每月日期；`S` 代表序数后缀（在本例中为 th），而 `F`\
  \ 是月份的全称。\n\n#### 注意事项\n\n如果 `date()` 向你发出了关于未设置时区的警告，你应该在你的 `php.ini` 文件中添加 `date.timezone`\
  \ 设置。关于此点的更多信息，可以在附录 A 中的示例 `php.ini` 文件中找到。\n\n有关 `date()` 支持的所有格式完整列表，请参阅第 19\
  \ 章“管理日期和时间”。\n\n### 访问表单变量\n\n使用订单表的主要目的是收集客户订单。在 PHP 中获取客户输入内容的细节很容易，但具体方法取决于你使用的\
  \ PHP 版本以及你 `php.ini` 文件中的设置。\n\n#### 表单变量\n\n在你的 PHP 脚本中，你可以将每个表单字段访问为一个 PHP 变量，其名称与表单字段名称相关。你可以识别\
  \ PHP 中的变量名，因为它们都以美元符号（`$`）开头。（忘记美元符号是一个常见的编程错误。）\n\n取决于你的 PHP 版本和设置，你可以通过不同的方式通过变量访问表单数据。在较新的\
  \ PHP 版本中，除一种方法外，其他方法都已弃用，因此如果你过去用过 PHP，请注意这一点已经发生了变化。\n\n你可以通过以下方式访问字段 `tireqty`\
  \ 的内容：\n\n```\n$_POST['tireqty']\n```\n\n`$_POST` 是一个包含通过 HTTP POST 请求提交数据的数组——也就是说，表单方法被设置为\
  \ POST。有三个这样的数组可能包含表单数据：`$_POST`、`$_GET` 和 `$_REQUEST`。其中一个 `$_GET` 或 `$_POST` 数组持有所有表单变量的细节。使用哪个数组取决于提交表单的方法是\
  \ `GET` 还是 `POST`。此外，通过 `$_REQUEST` 还可以获取通过 `GET` 或 `POST` 提交的所有数据的组合。\n\n如果通过 `POST`\
  \ 方法提交表单，输入 `tireqty` 框的数据将存储在 `$_POST['tireqty']` 中。如果通过 `GET` 提交表单，数据将在 `$_GET['tireqty']`\
  \ 中。无论哪种情况，数据在 `$_REQUEST['tireqty']` 中可用。这些数组是一些 `superglobal`（超全局）数组。我们将在在本章后面讨论变量范围时再次回到超全局变量。\n\
  \n让我们来看创建一个更易使用的变量副本的示例。\n\n要将一个变量的值复制到另一个变量，你需要使用赋值运算符，在 PHP 中是等号（`=`）。以下语句创建一个名为\
  \ `$tireqty` 的新变量，并将 `$_POST['tireqty']` 的内容复制到新变量中：\n\n```\n$tireqty = $_POST['tireqty'];\n\
  ```\n\n将以下代码块放在处理脚本的开头。本书中所有处理表单数据的其他脚本在开头都包含一个类似的块。因为这段代码不会产生任何输出，将其放置在 `<html>`\
  \ 和其他启动页面的 HTML 标签的上方或下方没有区别。我们通常将此类块放在脚本的开头，以便查找。\n\n点击此处查看代码图像\n\n```php\n<?php\n\
  \  // 创建短变量名\n  $tireqty = $_POST['tireqty'];\n  $oilqty = $_POST['oilqty'];\n \
  \ $sparkqty = $_POST['sparkqty'];\n?>\n```\n\n这段代码创建了三个新变量——`$tireqty`、`$oilqty`\
  \ 和 `$sparkqty`——并将它们设置为包含从表单通过 `POST` 方法发送的数据。\n\n你可以通过执行以下操作将这些变量的值输出到浏览器：\n\n\
  ```php\necho $tireqty.' tires<br />';\n```\n\n然而，不建议这种方法。\n\n在此阶段，你还没有检查变量内容以确保每个表单字段中都输入了合理的数据。尝试故意输入错误的数据并观察会发生什么。在你读完本章其余部分后，你可能想尝试向此脚本添加一些数据验证。\n\
  \n直接从用户处获取数据并这样输出到浏览器从安全角度来看是一种极具风险的做法。我们不建议这种方法。你应该过滤输入数据。我们将在第 4 章“字符串处理和正则表达式”中开始介绍输入过滤，并在第\
  \ 14 章“Web 安全风险”中深入讨论安全。\n\n目前，只需要知道在通过 `htmlspecialchars()` 之后将用户数据 `echo` 到浏览器即可。例如，在这种情况下，我们这样做：\n\
  \n点击此处查看代码图像\n\n```php\necho htmlspecialchars($tireqty).' tires />';\n```\n\n为了让脚本开始工作，在你的脚本底部添加以下行：\n\
  \n点击此处查看代码图像\n\n```php\necho '<p>您的订单如下：</p>';\necho htmlspecialchars($tireqty).'\
  \ tires />';\necho htmlspecialchars($oilqty).' bottles of oil />';\necho htmlspecialchars($sparkqty).'\
  \ spark plugs />';\n```\n\n如果你现在在浏览器中加载此文件，脚本输出应该类似于图 1.4 所示。实际值取决于你在表单中输入的内容。\n\
  \n![图像](img/01fig04.jpg)\n\n图 1.4 表单变量在 processorder.php 中可以访问\n\n#### 字符串拼接\n\n\
  在示例脚本中，`echo` 打印用户输入的值，随后是一些说明文本。如果你仔细观察 `echo` 语句，可以看到变量名和后续文本之间有一个点（.），如下：\n\n\
  点击此处查看代码图像\n\n```php\necho htmlspecialchars($tireqty).' tires />';\n```\n\n这个点是字符串拼接运算符，它将字符串（文本段）相加。当你\
  \ `echo` 输出到浏览器时经常可以使用它。通过这种方式，你可以避免编写多个 `echo` 命令。\n\n你也可以将简单的变量放在双引号字符串中进行 `echo`。（数组较为复杂，所以我们将在第\
  \ 4 章中组合数组和字符串。）考虑这个示例：\n\n点击此处查看代码图像\n\n```php\n$tireqty = htmlspecialchars($tireqty);\n\
  echo \"$tireqty tires<br />\";\n```\n\n这与本节显示的第一个语句等效。两种格式都是有效的，你使用哪种取决于个人喜好。这种在字符串内替换变量为内容的过程被称为插值（`interpolation`）。\n\
  \n注意，插值是双引号字符串的特性。你不能以这种方式在单引号字符串中放置变量名。运行以下代码行\n\n```php\necho '$tireqty tires<br\
  \ />';\n```\n\n只是向浏览器发送 `$tireqty tires<br />`。在双引号内，变量名会被替换为它的值。在单引号内，变量名或任何其他文本将原封不动地发送。\n\
  \n\n\n\n\n示例脚本中每个 `echo` 语句中拼接的变量和字符串是不同类型的内容。变量是数据的符号，而字符串本身就是数据。当我们在程序中使用一段原始数据时，我们称其为*字面量*（literal），以将其与*变量*（variable）区分来。`$tireqty`\
  \ 是一个变量，是一个代表客户输入数据的符号。相反，`' tires<br />'` 是一个字面量。你可以按照它的字面意思理解它。嗯，几乎如此。还记得前一节中的第二个例子吗？PHP\
  \ 将字符串中的变量名 `$tireqty` 替换为存储在变量中的值。\n\n记住已经提到的两种字符串：使用双引号的字符串和使用单引号的字符串。PHP 会尝试对双引号内的字符串进行求值，从而导致前文所示的行为。单引号字符串被视为真正的字面量。\n\
  \n还有第三种指定字符串的方法，即使用 heredoc 语法（`<<<`），这对于 Perl 用户来说很熟悉。Heredoc 语法允许你通过指定一个结束标记来终止字符串，从而整洁地指定长字符串。下面的示例创建了一个三行的字符串并将其输出：\n\
  \n```\necho <<<theEnd\n\n  line 1\n\n  line 2\n\n  line 3\n\ntheEnd\n```\n\n标记 `theEnd`\
  \ 是完全任意的。它只需要保证不会出现在正文中。要关闭一个 heredoc 字符串，请在行首放置一个结束标记。\n\nHeredoc 字符串会像双引号字符串一样进行变量替换。\n\
  \n### 理解标识符\n\n标识符是变量名。（函数名和类名也是标识符；我们将在第 5 章“重用代码和编写函数”以及第 6 章“面向对象的 PHP”中中讨论函数和类。）你需要了解定义有效标识符的简单规则：\n\
  \n![Image](img/squ.jpg) 标识符的长度可以是任意的，并由字母、数字和下划线组成。\n\n![Image](img/squ.jpg) 标识符不能与数字开头。\n\
  \n![Image](img/squ.jpg) 在 PHP 中，标识符是区分大小写的。`$tireqty` 与 `$TireQty` 不相同。尝试交叉使用它们是一种常见的编程错误。函数名是这一规则的例外：它们的名称可以使用任何大小写形式。\n\
  \n![Image](img/squ.jpg) 变量可以与函数具有相同的名称。然而，这种用法会引起混淆，应该避免。此外，你不能创建一个与另一个函数同名的函数。\n\
  \n除了从 HTML 表单传递的变量外，你还可以声明并使用自己的变量。\n\nPHP 的特性之一是它不需要在使用变量之前对其声明它们。当你第一次给变量赋值时，该变量就会被创建。详情请见下一节。\n\
  \n你使用赋值运算符（`=`）为变量赋值，就像你将一个变量的值复制到另一个变量时一样。在 Bob 的网站上，你想计算订单的物品总数和应付总金额。你可以创建两个变量来存储这些数字。首先，你需要通过在\
  \ PHP 脚本底部添加这些行来将每个变量初始化为零。\n\n```\n$totalqty = 0;\n\n$totalamount = 0.00;\n```\n\
  \n这两行代码中的每一行都创建了一个变量并为其分配了一个字面量值。你也可以将变量的值赋值给另一个变量，如示例所示：\n\n```\n$totalqty = 0;\n\
  \n$totalamount = $totalqty;\n```\n\n### 检查变量类型\n\n变量的类型指的是存储在其中的数据种类。PHP 提供了一组数据类型。不同的数据可以存储在不同的类型中。\n\
  \n#### PHP 数据类型\n\nPHP 支持以下基本数据类型：\n\n![Image](img/squ.jpg) **整数 (Integer)**——用于整数\n\
  \n![Image](img/squ.jpg) **浮点数 (Float)**（也称为 **double**）——用于小数\n\n![Image](img/squ.jpg)\
  \ **字符串 (String)**——用于字符字符串\n\n![Image](img/squ.jpg) **布尔 (Boolean)**——用于 `true`\
  \ 或 `false` 值\n\n![Image](img/squ.jpg) **数组 (Array)**——用于存储多个数据项（参见第 3 章“使用数组””）\n\
  \n![Image](img/squ.jpg) **对象 (Object)**——用于存储类的实例（参见第 6 章）\n\n还有三种特殊类型：NULL、resource\
  \ 和 callable。\n\n未赋值、已取消（unset）或被赋予特定值 `NULL` 的变量类型为 NULL。\n\n某些内置函数（如数据库函数）会返回类型为\
  \ `resource` 的变量。它们代表外部资源（例如数据库连接）。你几乎不会直接操作资源变量，但它们经常由函数返回，并且必须作为参数传递给其他函数。\n\n\
  Callable（可调用函数）本质上是传递给其他函数的。\n\n#### 类型强度\n\nPHP 被称为弱类型语言或动态类型语言。在大多数编程语言中，变量只能持有一种类型的数据，并且在变量变量之前必须声明该类型，如\
  \ C 语言。在 PHP 中，变量的类型由赋值给它的值决定的。\n\n例如，当你创建 `$totalqty` 和 `$totalamount` 时，它们的初始类型由以下内容确定：\n\
  \n```\n$totalqty = 0;\n\n$totalamount = 0.00;\n```\n\n因为你将 `0`（整数）赋值给 `$totalqty`，所以它是整数。同样，`$totalamount`\
  \ 是浮点数。\n\n#### 类型转换\n\n你可以使用类型转换来让一个变量或值看起来是不同的类型。此功能与 C 语言的方法完全相同。你只需要在你想要转换的变量前面加上临时类型。\n\
  \n例如，你可以使用转换声明前一节中的两个变量：\n\n点击此处查看代码图像\n\n```\n$totalqty = 0;\n\n$totalamount =\
  \ (float)$totalqty;\n```\n\n第二行的意思是“将 `$totalqty` 解释为浮点，并存储在 `$totalamount` 中”。变量\
  \ `$totalamount` 将是浮点类型。类型转换不会改变 `$totalqty`，它仍然整数。\n\n你还可以使用内置函数来测试和设置类型，你将在以后学习。\n\
  \n#### 变量变量\n\nPHP 另一种类型的变量：变量变量。变量变量允许你动态地更改变量的名字。\n\n正如你看到的，PHP 在这个领域提供了很大的自由。所有语言都允许更改变量的值，但没有多少语言允许更改变量的类型，更少有语言允许更改变量的名字。\n\
  \n变量变量通过使用一个变量的值作为另一个变量的名称来实现。例如，你可以设置\n\n```php\n$varname = 'tireqty';\n```\n\n\
  然后你就可以用 `$$varname` 代替 `$tireqty`。例如，你可以这样设置 `$tireqty` 的值：\n\n```php\n$$varname\
  \ = 5;\n```\n\n这等同于\n\n```php\n$tireqty = 5;\n```\n\n这种方法可能有些晦涩，但我们稍后会回到它。你不需要单独列出和使用每个表单变量，可以使用循环和变量变量来自动处理它们。你可以在本章稍后的\
  \ `for` 循环部分中找到说明用点的示例。\n\n\n\n\n\n正如你之前看到的，你可以轻松地更改存储在变量值。你也可以声明常量。常量像变量一样存储值，但它的值只被设置一次，之后在脚本的其他地方都无法更改。\n\
  \n在示例应用程序中，你可以将每种销售商品的价格存储为常量。你可以使用 `define` 函数来定义这些常量：\n\n```php\ndefine('TIREPRICE',\
  \ 100);\ndefine('OILPRICE', 10);\ndefine('SPARKPRICE', 4);\n```\n\n现在将这些行代码添加到你的脚本中。你现在有了三个常量，可以用于计算客户订单的总额。\n\
  \n注意，常量的名称是大大写的。这种借自 C 语言的习惯让你一眼就能分清变量和常量。虽然不是强制遵循这一习惯，但它会让你的代码更易读、更易于维护。\n\n常量和变量之间的一个重要区别是，当你引用常量时，它的前面没有美元符号\
  \ `$`。如果你想使用常量的值，只需使用它的名称。例如，要使用刚刚创建的常量之一，你可以输入：\n\n```php\necho TIREPRICE;\n```\n\
  \n除了你定义的常量外，PHP 还设置了大量的内置常量。获取它们概述的简单方法是运行 `phpinfo()` 函数：\n\n```php\nphpinfo();\n\
  ```\n\n该函数提供了 PHP 预定义变量和常量的列表以及其他有用信息。我们将在学习过程中讨论其中一些。\n\n变量和常量之间的另一个区别是，常量只能存储布尔（boolean）、整数（integer）、浮点数（float）或字符串（string）数据。这些类型统称为标量值（scalar\
  \ values）。\n\n### 理解作用域\n\n*scope*（范围）一词是指脚本中特定变量可见的地方。PHP 六条基本作用域规则如下：\n\n![Image](img/squ.jpg)\
  \ 内置超全局变量在脚本的任何地方可见。\n\n![Image](img/squ.jpg) 常量一旦声明，始终是全局可见的；也就是说，它们可以在函数内部和外部使用。\n\
  \n![Image](img/squ.jpg) 在脚本中声明的全局变量在整个脚本中可见，但在*函数内部不可见*\n\n![Image](img/squ.jpg)\
  \ 函数内部声明为 `global` 的变量引用的是同名的全局变量。\n\n![Image](img/squ.jpg) 在函数内部创建并声明为 `static`\
  \ 的变量从函数外部不可见，但在函数一次执行和下一次执行之间保留其值。（我们在第五章中详细解释这一概念。）\n\n![Image](img/squ.jpg) 函数内部创建的变量是局部变量，函数结束时消失。\n\
  \n数组 `$_GET` 和 `$_POST` 以及其他特殊变量有它们的作用域规则。它们被称为*超全局变量*（superglobals），随处可见，包括函数内部和外部。\n\
  \n超全局变量的完整列表如下：\n\n![Image](img/squ.jpg) `$GLOBALS`——所有全局变量的数组（类似于 `global` 关键字，这允许你在函数内部访问全局变量——例如使用\
  \ `$GLOBALS['myvariable']`。）\n\n![Image](img/squ.jpg) `$_SERVER`——服务器环境变量数组\n\n\
  ![Image](img/squ.jpg) `$_GET`——通过 `GET` 方法传递给脚本的变量数组\n\n![Image](img/squ.jpg) `$_POST`——通过\
  \ `POST` 方法传递给脚本的变量数组\n\n![Image](img/squ.jpg) `$_COOKIE`——cookie 变量数组\n\n![Image](img/squ.jpg)\
  \ `$_FILES`——与文件上传相关的变量数组\n\n![Image](img/squ.jpg) `$_ENV`——环境变量数组\n\n![Image](img/squ.jpg)\
  \ `$_REQUEST`——包含所有用户输入的数组，包括 `$_GET`、`$_POST` 和 `$_COOKIE` 的内容（但不包括 `$_FILES`）\n\
  \n![Image](img/squ.jpg) `$_SESSION`——会话变量数组\n\n在本书中，我们会在涉及时反复回来讨论这些超全局变量。\n\n在本章稍后讨论函数和类时，我们会更详细地介绍作用域。目前，我们使用的所有变量默认都是全局的。\n\
  \n### 使用运算符\n\n运算符是你可以用来通过对值和变量进行操作来处理它们操作的符号。你需要使用其中一些运算符来计算客户订单的总额和税费。\n\n我们已经提到了两个运算符：赋值运算符（=`）和字符串连接运算符（`.`）。在接下来的章节中，我们将描述完整的列表。\n\
  \n通常情况下，运算符可以接受一个、两个或三个参数，大多数接收两个。例如，赋值运算符接收两个参数：`=` 符号左侧的存储位置和右侧的表达式。这些参数被称为*操作数*（operands）——即被操作的对象。\n\
  \n#### 算术运算符\n\n算术运算符非常直观；它们就是普通的数学运算符。PHP 的算术运算符如表 1.1\n\n表 1.1 **PHP 算术运算符**\n\
  \n通过这些运算符，你可以存储操作的结果，如下例所示：\n\n```php\n$result = $a + $b;\n```\n\n加法和减法正如你预期的那样工作。这些运算符的结果分别是加上或减去变量\
  \ `$a` 和 `$b` 中的值。\n\n你也可以使用减法符号（`-`）作为一元运算符——即接受一个参数的运算符——来表示负数，例如所示：\n\n```php\n\
  $a = -1;\n```\n\n乘法和除法也如你预期的那样工作。注意使用星号 `*` 作为乘法运算符而不是乘号，使用斜杠 `/` 作为除法运算符而不是除号。\n\
  \n模运算符返回 `$a` 变量除以 `$b` 变量计算出的余数。考虑这段代码片段：\n\n```php\n$a = 27;\n$b = 10;\n$result\
  \ = $a%$b;\n```\n\n存储在 `$result` 变量中的值是 27 除以 10 的余数——即 7。\n\n你应该注意算术运算符通常应用于整数或双精度浮点数。如果你将其应用于字符串，PHP\
  \ 将尝试将字符串转换为数字。如果字符串包含 `e` 或 `E`，它将被读取为科学计数法并转换为浮点数；否则，它将转换为整数。PHP 将查找字符串开头的数字并将其用作值；如果没有，字符串的值将为零。\n\
  \n#### 字符串运算符\n\n你已经见过并使用了唯一的字符串运算符。你可以使用字符串连接运算符 `.` 连接两个字符串并生成结果，就像使用加法运算符相两个数字一样：\n\
  \n```php\n$a = \"Bob's \";\n$b = \"Auto Parts\";\n$result = $a.$b;\n```\n\n变量 `$result`\
  \ 现在包含了字符串 `\"Bob's Auto Parts\"`。\n\n#### 赋值运算符\n\n你已经见过基本的赋值运算符 `=`。请始终将其称为赋值运算符，并读作“赋值为”。例如，\n\
  \n```php\n$totalqty = 0;\n```\n\n这行代码应该读作“`totalqty` 设置为零”。我们将在本章后面讨论比较运算符时解释原因，但如果你称它为等于，你会感到困惑。\n\
  \n##### 赋值返回的值\n\n赋值运算符像其他运算符一样返回一个整体值。如果你写\n\n```php\n$a + $b\n```\n\n该表达式的值是 `$a`\
  \ 和 `$b` 变量相加的结果。同样，你可以写\n\n```php\n$a = 0;\n```\n\n这整个表达式的值为零。\n\n这种技术允许你形成如下表达式：\n\
  \n```php\n$b = 6 + ($a = 5);\n```\n\n该行将 `$b` 变量的值设置为 11。这种行为通常适用于赋值：整个赋值语句的值是赋值给左操作数的值。\n\
  \n\n\n\n[content]\n在计算表达式的值时，你可以使用括号来提高子表达式的优先级，所示。这种技术的工作原理与数学中完全相同。\n\n### 复合赋值运算符\n\
  \n除了简单的赋值外，还有一组复合赋值运算符。它们每一个都是对变量执行另一种操作并将结果重新赋值回该变量的简写方式。例如，\n\n```php\n$a += 5;\n\
  ```\n\n这等同于写入\n\n```php\n$a = $a + 5;\n```\n\n每个算术运算符和字符串拼接运算符都存在复合赋值运算符。所有复合赋值运算符及其效果的摘要见表\
  \ 1.2](#ch01.html_ch01tab02)。\n\n![Image](img/01tab02.jpg)\n\n表 1.2 **PHP 的复合赋值运算符**\n\
  \n### 前置和后置增/减\n\n前置和后置增（`++`）和减（`--`）运算符与 `+=` 和 `-=` 运算符类似，但有几处不同。\n\n所有的增运算符都有两个效果：增加值并赋值。考虑以下情况：\n\
  \n```php\n$a=4;\necho ++$a;\n```\n\n第二行使用了前置增运算符，这是因为 `++` 出现在 `$a` 之前。它的效果是先将 `$a`\
  \ 增加 1，然后返回增加后的值。在这种情况下，`$a` 增加到 5，然后返回并打印值 5。整个表达式的值为 5。（注意存储在 `$a` 中的实际值被改变了：它不仅仅是返回\
  \ `$a + 1`。）\n\n然而，如果 `++` 在 `$a` 之后，则你正在使用后置增运算符。它的效果是不同的。考虑以下情况：\n\n```php\n$a=4;\n\
  echo $a++;\n```\n\n在这种情况下，效果是反反的。也就是说，首先返回并打印 `$a` 的值，然后对其进行增。整个表达式的值为 4。这是将要打印的值。然而，在执行此语句后，`$a`\
  \ 的值是 5。\n\n正如你可能猜到的那样，`--`（减）运算符的行为也相似。但是`$a` 的值是减少而不是增加。\n\n### 引用运算符\n\n引用运算符（`&`，取地址符）可以与赋值结合使用。通常，当一个变量赋值给另一个变量时，会创建第一个变量的副本并存储在内存的其他地方。例如，\n\
  \n```php\n$a = 5;\n$b = $a;\n```\n\n这些代码行创建了 `$a` 中值的第二个副本并存储在 `$b` 中。如果你随后更改 `$a`\
  \ 的值，`$b` 将不会改变：\n\n```php\n$a = 7; // $b 仍为 5\n```\n\n你可以通过使用引用运算符来避免创建副本。例如，\n\
  \n点击此处查看代码\n\n```php\n$a = 5;\n$b = &$a;\n$a = 7; // $a 和 $b 现在都是 7\n```\n\n引用有点复杂。记住，引用类似于别名而不是指针。`$a`\
  \ 和 `$b` 都指向同一块内存。你可以通过如下方式取消其中一个来改变这种状态：\n\n```php\nunset($a);\n```\n\n`unset`\
  \ 不改变 `$b` 的值（7），但它打破了 `$a` 与内存中存储的值 7 之间的链接。\n\n### 比较运算符\n\n比较运算符比较两个值。使用这些运算符的表达式根据比较结果返回逻辑值\
  \ `true` 或 `false`。\n\n### 等于运算符\n\n等值比较运算符（`==`，两个等号）允许你测试两个值是否相等。例如，你可能会使用表达式\n\
  \n```php\n$a == $b\n```\n\n来测试存储在 `$a` 和 `$b` 中的值是否相同。如果它们相等，则该表达式返回的结果为 `true`；如果不相等，则返回为\
  \ `false`。\n\n你很容易将 `==` 与赋值运算符 `=` 混淆。使用错误的运算符虽然程序可以正常运行而不会报错，但通常不会给你你想要的结果。通常情况下，非零值求值为\
  \ `true`，零值求值为 `false`。假设你按如下所示方式初始化了两个变量：\n\n```php\n$a = 5;\n$b = 7;\n```\n\n\
  如果你测试 `$a` = `$b`，结果将是 `true`。为什么？`$a = $b` 的值是赋值给左侧的值，在这种情况下是 7。因为 7 是非零值，所以表达式求值为\
  \ `true`。如果你本打算测试 `$a` == `$b`（其求值为 `false`），那么你就在代码中引入了一个逻辑错误，这个错误极难发现。始终检查你对这两个运算符的使用，并确保你使用了你想要使用的那一个。\n\
  \n使用赋值运算符而不是等值比较运算符是一个很容易犯的错误，你可能在编程生涯中会犯很多次。\n\n### 其他比较运算符\n\nPHP 还支持许多其他比较运算符。所有比较运算符的摘要见表\
  \ 1.3](#ch01.html_ch01tab03)。需要注意的是全等运算符（`===`），它只有在两个操作数相等且类型相同时才返回 `true`。例如，`0==='0'`\
  \ 为假，因为一个是整数另一个是字符串。\n\n![Image](img/01tab03.jpg)\n\n表 1.3 **PHP 的比较运算符**\n\n###\
  \ 逻辑运算符\n\n逻辑运算符组合条件的结果。例如，你可能会在 `$a` 在 0 到 100 之间使用逻辑运算符，如下：\n\n```php\n$a >= 0\
  \ && $a <= 100\n```\n\nPHP 支持逻辑与、`OR`、`XOR`（异或）和 `NOT`。逻辑运算符的用法见表 1.4](#ch01.html_ch01tab04)。\n\
  \n![Image](img/01tab04.jpg)\n\n表 1.4 **逻辑运算符**\n\n### 位运算符\n\n位运算符允许你将整数视为表示它的位。你可能在\
  \ PHP 中找不到很多用位运算符，但摘要见表 1.5](#ch01.html_ch01tab05)。\n\n![Image](img/01tab05.jpg)\n\
  \n表 1.5 **PHP 的位运算符**\n\n### 其他运算符\n\n除了我们涵盖过的运算符外，你还可以使用几个其他的。\n\n逗号运算符（`,`）分隔函数参数和其他列表。它通常是偶然使用的。\n\
  \n两个特殊运算符 `new` 和 `->` 分用于实例化类和访问类成员。它们将在第 6 章中详细介绍](#ch06)。\n\n我们在这里讨论一些其他的。\n\n\
  ### 三元运算符\n\n三元运算符（`?:`）采用如下形式：\n\n点击此处查看代码\n\n```php\n条件 ? 为真时的值 : 为假时的值\n```\n\
  \n该运算符类似于 `if-else` 语句的表达式版本，后者将在本章后面介绍。\n\n一个简单的例子是\n\n点击此处查看代码\n\n```php\n($grade\
  \ >= 50 ? '通过' : '失败')\n```\n\n此表达式将成绩评估为 `'通过'` 或 `'失败'`。\n\n### 错误抑制运算符\n\n错误抑制运算符（`@`）可以放在任何表达式之前——任何产生错误或具有值的表达式。例如，\n\
  \n```php\n$a = @(57/0);\n```\n\n如果没有 `@` 运算符，这一行会产生除以零警告。包含了该运算符，错误将被抑制。\n\n如果你以这种方式抑制警告，你需要编写一些错误处理代码来检查何时发生了警告。如果你让\
  \ PHP 在 `php.ini` 中启用了 `track_errors` 功能，则错误信息将存储在全局变量 `$php_errormsg` 中。\n[/content]\n\
  \n\n\n执行运算符实际上是一对操作符——实际上是一对反引号（`` ` ``）。反引号不是单引号；它通常位于你键盘上与波浪号（`~`）符号相同的键位上。\n\n\
  PHP 尝试将反引号内包含的任何内容作为服务器命令行行的命令进行执行。该表达式的值是该命令的输出结果。\n\n例如，在 Unix 类操作系统下，你可以使用：\n\
  ```php\n$out = `ls -la`;\necho '<pre>'.$out.'</pre>';\n```\n\n或者，在 Windows 服务器上等效于：\n\
  ```php\n$out = `dir c:`;\necho '<pre>'.$out.'</pre>';\n```\n\n这两种版本都可以获取目录列表并将其存储在\
  \ `$out` 中。然后可以使用任何其他方法将其输出或进行处理。\n\n手动运行命令有几种选项。我们介绍了它们 > 第 17 章“数组” 章节\n\n###\
  \ 数组运算符 \n   有很多数组运算符；元素 `[]` 允许访问元素，同时也使用 `=>` 上下文，这里的细节这里主要涵盖了这些，但此外还可以访问许多其他运算符，尽管为了完整起见，表\
  \ # $ (graphics /01tab06 。jpg) 中的所有等效变量，只需记住 `+` 加法标量并集行为应该是合理的（无法比较有意义的标量）\n\n\
  ##### 类型运算符<T5>\n\n<p class =\"normal\" style=\"\"& gt;一种类型 <code class=\"\">instanceof\
  \ &lt;/code>。面向对象编程此处提及，完整主题稍后讨论（第 7 章）=></p >\n\n允许检查特定实例的示例所示：\n\n[点击查看区域图片](http://www..._ma_html__0035.pdf?...])\n\
  \n```php\nClass Sample {} ;\n\nmyObject new () ;\nif(myObject instanceof sample)\n\
  \    echo \" myOBJECT IS INSTANCE OF SAMPLE\";\n```\n"
