  md: '# # 13

    Common Problems and Possible Solutions


    This chapter attempts to gather several of the most common problems that have
    been posted to the ubuntu-mobile mailing lists as well as solutions that have
    been offered around the Internet.


    # ## The Boot Process Stops


    Q: I downloaded Ubuntu MID, I extracted the files in the image, and I prepared
    a USB stick for booting with this image.


    After the USB boots, I Press Enter to start the installation, and after several
    OS messages, the boot process stops. The last message I receive


    ```

    will mount root from /dev/sdb

    ```


    That''s all.


    A: This can be caused by improperly writing to the USB stick.


    To copy the image to the USB stick (assuming /dev/sdb for the stick), use the
    following


    ```

    $ sudo bs=1024 if=<image file> of=/dev/sdb

    ```


    dd is a program used for low-level copying and conversion of raw data.'
  merge: -1
  pgno: 292
- img_proc: true
  md: '# Chapter 13: Common Problems and Possible Solutions


    Writing an image to a USB stick is like filling out a checkerboard. If you don''t
    give it the 1,024 block size parameter, it writes one way (row-by-row), but with
    bs=1024, it writes column-by-column. When testing this, there was an approximate
    40 percent success rate with just dd if=<image of=<drive>, but with bs=1024, this
    was boosted to nearly 99 percent.


    # Application Icon Does Not Appear


    Q: My application icon does not show up on the desktop.


    A: To have an icon appear on the desktop, follow these steps:


    +   1. Install a desktop file into /usr/share/applications/

    2. Install an icon into /usr/share/icons/hicolor/<size>/<type


    (for example, /usr/share/icons/hicolor/64x64/apps/myapp).


    If Step 1 is done correctly, the application should show up in the UI.


    Steps 1 and 2 are done, it will also have the right icon.


    ```

    OnlyShowIn=GNOME;Mobile;

    ```


    to the desktop file and the icon will appear on the desktop.


    For example, cheese does not have OnlyShowIn, but it appears in Hilden desktop.


    Hilden desktop is the primary UI component of the Hilden Application Framework
    for mobile devices.


    Others do not have OnlyShowIn but do not appear. There is a special implementation
    for Ubuntu Mobile, which is seen in the GConf keys:


    ```

    /desktop/hilden/htmlconfplugin/onlyshowin-filter

    ```


    Check the OnlyShowIn value .desktop. If it is False_, every desktop is shown.
    This command:


    ```

    /onlyshowin_ignore

    ```


    shows those apps, even if they don''t have OnlyShowIn.


    For example, cheese is in this list and is always shown.


    Apparently this key should go away when every application is a good citizen and
    complies with the freedesktop.org standards.'
