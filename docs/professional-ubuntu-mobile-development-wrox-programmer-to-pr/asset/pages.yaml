    # So What Is a Derived Distribution?


    Confusion exists over the exact definition of the term "derivative" or derived
    distribution. Deriving some new software from some original implies that some
    of change has taken place in the original — if this was not the case, then it
    would be a simple gcc compilation of the original source code (something called
    a compilation in copyright law). Obviously, if the original source code is changed,
    then the upstream author has the right to insist that the work be licensed under
    the same provisions as the original code. This is clear — however the confusion
    comes with the definition of a new work.


    Copyright law allows for a situation where the original source code is "annotated,"
    "elaborated," or "modified" when it is considered, the whole work. This new work
    is subject to the same license terms as the original source code mentioned earlier.


    The problem is with the phrase "the phrase — "the whole," in English, is used
    most frequently to mean "generally" which seems awfully vague for a legal clause
    in a copyright contract. As a consequence of this, a new work might be seen as
    a derived work if creative expression is added to the original, even if there
    are no actual changes to the original source code.


    Some people think that this led to more interest in using licenses (such as the
    LGPL), which explicitly allow for derivative works rather than relying on the
    GPL.


    # When to Use the LGPL


    The original name for this library was "The Library General Public Licence , because
    this license covers the linking of libraries between applications. Today it is
    most referred to as "The Lesser General Public License."


    Imagine there are two applications. When both are licensed under the GPL, the
    source code must be made available. However, the situation is complicated when
    one is GPL and the other a proprietary application, and even so when the proprietary
    application makes use of some library from the GPL one. The LGPL specifically
    allows for linking of a proprietary application to GPL '' d libraries without
    requiring that the proprietary application makes its source code available. If
    the proprietary application changes some of the source code in the GPL '' d library
    (perhaps to make the application better bind), then only those changes need to
    be published. In practice and as a matter of courtesy, companies should do their
    utmost to make sure that this is accepted quickly as possible. It is easier to
    maintain this way, ensures future application compatibility, and makes community
    relationships stronger.'
