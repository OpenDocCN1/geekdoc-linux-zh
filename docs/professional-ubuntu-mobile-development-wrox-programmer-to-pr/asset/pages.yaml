- img_proc: true
  md: '# Chapter 11: Putting It Together


    INHERITED is a space-separated list of seeds from which SEED inherits. For example,
    netbook-remix: desktop-common in the preceding STRUCTURE file indicates that packages
    in the netbook-remix seed may depend on packages in the desktop-common seed without
    requiring that those packages appear in the netbook-remix output. Any one line
    like the following:


    ```

    include BRANCH

    ```


    which is in the section below, causes another seed branch to be included.

    The supported seed lists all the packages that are necessary to build the distribution
    (which do not necessarily need to be on the final image for space reasons), germinate,
    therefore, does not add all the packages that result from following-dependencies
    of seed packages and of their dependencies to every output, unless they are in
    the seed list. Packages are added to supported. Like any other seed, the supported
    seed may contain its own list of packages.


    The blacklist file does not define a list of packages but includes lists packages
    that will never be included in the output of germinate.

    The other seeds use the STRUCTURE file in the Ubuntu Netbook Remix example, such
    as netbook-remix, desktop-common, live, ship-live, and so on, can be called anything
    but they need to exist, and they need to be in such the STRUCTURE file.


    # An Example: Germinating Ubuntu Netbook Remix


    Begin by branching the Ubuntu Netbook Remix seed. Make a seeds directory:


    ```

    $ mkdir seeds; cd seeds

    $ bzr branch lp:ubuntu-core-dev/ubuntu-seeds/unr.karmic

    ```


    move into the usr.remix folder, and in the STRUCTURE file there is a line like
    the following:


    ```

    include platform.karmic

    ```


    which means the platform karmic seed is required. Move back to the seeds folder
    and branch platform.karmic:


    ```

    $ cd

    $ bzr branch lp:ubuntu-core-dev/ubuntu-seeds/platform.karmic

    ```


    Make an output folder and move into it the following:


    ```

    $ mkdir output; cd output

    ```


    Make sure the germinate is installed (sudo apt-get install germinate) and then
    invoke it:


    ```

    $ germinate -S file:///home/<user>/Dev/test/seeds/ -sA karmic -m

    http://172.16.50.131:9999/ubuntu -d karmic -a 1386 -c main,restricted

    universe,multiverse

    ```


    172.16.50.131:9999 is our local mirror — use archive.ubuntu.com if you do not
    have a local mirror set.'
