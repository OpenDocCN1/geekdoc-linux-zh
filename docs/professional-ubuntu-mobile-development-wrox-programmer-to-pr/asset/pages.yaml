    # # Multimedia Users


    Vendors offering devices for the Multimedia Users group have a preexisting and
    ready-made market growing out of the current market for smartphones. Although
    multimedia is often associated with images, text, and it can also mean application
    programs that integrate data from a spectrum of independent sources. Probably
    the best known and most popular application that this does for mobile devices
    is Canola. It is built using Python and the Enlightenment Foundation Libraries
    (EFL), and it uses a plug-system to enable-Youtube, Flickr, and more. There are
    Google Summer of Code 2009 projects approved to create plug-ins for Twitter, Remember
    the Milk, and an IM client.


    EFL is covered in more detail in Chapter 4.


    Another available solution is a media center called Entertainer. This aims to
    be a simple and easy-to-use application for the Gnome and XFCE desktop environments.
    Entertainer is written completely in Python and it uses GStreamer''s multimedia
    framework for playback. The user interface is implemented with the Clutter library.


    Clutter is covered in more detail in Chapter 4.'
