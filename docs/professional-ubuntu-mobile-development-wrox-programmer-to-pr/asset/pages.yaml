    The dh_commands mentioned earlier are part of the debhelper suite in each version.
    They help with repetitive tasks when writing a rules file. For example, the command
    dh_testdir tries to make sure you are in the correct directory when building a
    debian package. For more information on all of the tools in the suite look at
    the debhelper manpages.


    There are other ways to make rules, such as using debhelper 7 and cdbs. For more
    information on these tools, look at http://manpages.ubuntu.com/Karmic/man7/debhelper.html
    and http://build-common.alloth.debian.org/cdbs-doc.html.


    # changelog


    The changelog is a listing of the changes made in each version. It has a format
    that gives the package name, version, distribution, and who made the changes at
    a time. If you have a GPG key, make sure to use the same name and e-mail address
    in changelog as you have the key.

    Create a changelog of


    ```

    xfce4-theme-ubuntu-golden (0.1jaun); urgency=low

    * Initial Release.

    - Ian Lawrence <debs@ianlawrence.info> Sat, 28 Feb 2009 19:45:07 +0000

    ```


    A changelog can be edited using a tool dch. In the root source directory, type
    $ dch -e to edit the changelog in your preferred editor. To increment the changelog
    for example when making a new release run $ dch -i. To append a new comment to
    the current version entry, run $ dch -a.


    To set a default editor:


    $ update-alternatives --config-editor


    # control


    Control data is stored in a control file and it is used for both source and binary
    packages.


    The control file shown below is the control file from our source package. We can
    tell that this is for a source package because it is separated into two paragraphs,
    the first of which always refers to the source package itself and the second and
    subsequent paragraphs to the binary package(s) created from our source.'
