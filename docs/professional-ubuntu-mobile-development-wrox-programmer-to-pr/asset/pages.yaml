  md: '# Chapter 11: Putting It Together


    STRUCTURE is a special file that lists the seeds and how they depend on each other.
    The STRUCTURE file for karmic netbook looks like this:


    ```

    include platform.karmic

    netbook-remix: desktop-common

    live: netbook-remix

    ship-live: live

    supported: netbook-remix ship-live supported-common

    ```


    The name of the seed file is followed by a colon. After the colon is a space and
    a space-separated list of seeds on which the first seed depends on. It is possible
    to see graphically how the seeds relate to each other by looking at the structure.dot
    file in the germinate output. Figure 11-2 shows the graphical germinate output
    for Ubuntu Netbook Remix, which is available from http://people.ubuntu.com/~ubuntu-archive/germinate-output/unr.karmic/structure.dot.


    Figure 11-2


    A STRUCTURE file then lists the inheritance relationships between seeds. It is
    an ordered sequence of lines like the following:


    ```

    SEED: [INHERITED]

    ```'
