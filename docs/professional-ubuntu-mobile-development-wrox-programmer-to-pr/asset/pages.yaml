  md: "# Appendix E: D-Bus: An Overview\n\n# Proxy Objects\n\nTo interact with a remote\
    \ object, you use a proxy object. This is a Python object that acts as a proxy\
    \ or \"stand-in\" for the remote object. When you call a method on a proxy object,\
    \ this causes dbus-Python to make a method call on the remote object, passing\
    \ back any return values from the remote object's method as the return values\
    \ of the proxy method.\n\nTo obtain a proxy object, call the get_object method\
    \ on the Bus. For example, NetworkManager has the well-known name org.freedesktop.NetworkManager\
    \ and exports an object manager whose path is /org/freedesktop/NetworkManager,\
    \ plus an object network interface at paths such as /org/freedesktop/NetworkManager/Devices/eth0.\
    \ You can get a proxy for the object representing eth0 like:\n\n```\nimport dbus\n\
    bus = dbus.SystemBus()\nproxy = bus.get_object('org.freedesktop.NetworkManager',\n\
    \    '/org/freedesktop/NetworkManager/Devices/eth0')\n# proxy is a dbus.proxies.ProxyObject\n\
    ```\n\n# Interfaces and Methods\n\nD-Bus uses interfaces to provide a namespace\
    \ mechanism for methods. An interface is a group of related methods and signals\
    \ (on signals later), identified by a name that is a series of dot-separated components\
    \ starting with a reversed domain name. For instance, each NetworkManager object\
    \ representing a network interface implements the org.freedesktop.NetworkManager.Devices\
    \ interface methods such as getProperties.\n\nTo call a method, call the method\
    \ of the same name on the proxy object, passing the interface name via the dbus_interface\
    \ keyword:\n\n```\nimport dbus\nbus = dbus.SystemBus()\neth0 = bus.get_object('org.freedesktop.NetworkManager',\n\
    \    '/org/freedesktop/NetworkManager/Devices/eth0')\nprops = eth0.GetProperties(dbus_interface='org.freedesktop.NetworkManager.Devices')\n\
    # props is a tuple of tuples, first of which is the object path\n```\n\nAs a short\
    \ cut, you're going to calling many methods with the same interface, you can construct\
    \ a dbus.Interface object and call methods on, without needing to specify the\
    \ interface:\n\n```\nimport dbus\nbus = dbus.SystemBus()\neth0 = bus.get_object('org.freedesktop.NetworkManager',\n\
    \    '/org/freedesktop/NetworkManager/Devices/eth0')\neth0_dev_iface = dbus.Interface(eth0,\
    \ 'org.freedesktop.NetworkManager.Devices')\nprops = eth0_dev_iface.GetProperties()\n\
    # props is the same as before\n```"
