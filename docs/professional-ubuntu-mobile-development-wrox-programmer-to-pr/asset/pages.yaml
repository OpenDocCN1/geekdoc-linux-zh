  md: '# 3 Power Management


    Mobile devices are now equipped with cameras, various radio transmitters, advanced
    multimedia, and other features — all of which consume a lot of power. At the same
    time, power-hungry applications that utilize these features are being provided.
    Furthermore, demands for battery life seem exponential. Because a battery life
    of six hours is now seen as the absolute minimum necessary when away from an energy
    source, it is important for you as a developer to work out how to conserve energy
    as much as possible.


    It is becoming increasingly important for users to control their mobile devices''
    power usage. Not only should users be able to specify power usage, but they should
    also be able to override the system if they choose.


    This chapter explains the tools and packages that are available for power management
    on Ubuntu Mobile. It includes the existing ones that are based on HAL and the
    newer ones that are based on DeviceKit-power. The chapter also shows the results
    of several power tests, and suggests techniques for increasing battery life on
    mobile devices.


    # Introduction


    PC-based chips already have a well-established code base in Linux, with existing
    hardware interfaces such as ACPI and HAL; as they have evolved from desktops to
    smaller devices many packages have been created to optimize power. Each of these
    packages can be thought of as a power micro-policy controller for a specific subsystem
    on a Linux-based platform. For instance, cpufreq manages power for the CPU subsystem
    and the iwconfig interface device-specific power for the Network (WLAN) subsystem.'
  merge: -1
  pgno: 70
- img_proc: true
  md: '# Chapter 3: Power Management


    It would be nice if there was a central way to manage power information. From
    Ubuntu Jaunty there is a new daemon, which can be installed from the universe
    repostories, provides such a service. It moves power management and profiling
    to an interface that is more focused on the entire power management system than
    anything that existed before. It is called DeviceKit-power and it is accessible
    through the D-Bus interface, freedktop.DeviceKit.power.


    For more information about D-Bus, see Chapter 4.


    # Power Saving States


    The common power (saving) states are awake, suspend, standby, and hibernate:


    +   - During the awake state all components of the device are running.

    - During standby, the CPU keeps running your programs, but some components such
    as the hard disk, may be turned off. When the mouse or keyboard is touched, the
    hard disk is accessed by software and the device quickly wakes up.


    In the awake and standby states, the speed of the CPU may be throttled if it''s
    not in use.


    +   - During suspend, the CPU is always stopped. In modern devices all other components
    (except the RAM memory) can be turned off. The RAM will hold the "state" of the
    device.

    - During hibernation the state is written to hard disk and the whole device is
    turned off.


    # Power Management Packages


    If the kernel is compiled with power management packages (the default in Ubuntu),
    both apt and acpi will be available.


    To see the default kernel configuration, run


    ```

    $ vi /boot/config-uname -r

    ```


    For more information about kernel compilation, see Chapter 8.


    apm provides access to status information and may conserve battery power, depending
    on your laptop and the implementation. It has mainly been supersed by newer power
    management schemes, such as ACPI.


    For example, to use apm to put a device to sleep, run the following:


    ```

    $ apm -s

    ```


    acpi is an "interface" specification and is provided on Ubuntu by the packages
    acpi and acpi-support. acpi attempts to replace the old apm functionality, and
    acpi-support contains scripts for events such as the lid closure and loss of AC
    power.'
  merge: -1
  pgno: 71
- img_proc: true
  md: '# Chapter 3: Power Management


    Both acpi and apm enable hardware events such as the end of battery power or the
    pressing of a button to be controlled by software, and both provide the control
    daemons apmd and acpid, respectively.


    The control daemons run the scripts they find in their configuration tree under
    /etc/acpi, or /etc/apm, respectively.


    # pm-utils


    Another package that comes as default with Ubuntu and which can be used to control
    power states is pm-utils. This provides the pm-action, pm-hibernate, pm-suspend,
    and pm-suspend-hybrid commands. They allow the triggering of hard power management
    events by software.


    These commands will usually be called by the hardware abstraction daemon (hald)
    when triggered to do so by a program on the desktop. Calling them from the command
    line is also possible, but it is not guaranteed that all programs will keep working
    as expected.


    # pm-suspend


    Suspend is in a state where most of the device is shut down, except for RAM. In
    this state, the device draws still power.


    It is possible to use pm-suspend to enter sleep mode on a device with something
    like this:


    ```

    $ pm-suspend --quirk-vbestate-restore

    ```


    Testing on an actual device has this can be quite slow. The actual scripts pm-utils
    runs for sleep can be found in /usr/lib/pm-utils/sleep.d/. Many of the scripts
    are solutions to problems that are currently being fixed in the kernel.


    > Make sure the kernel is updated or regularly a custom kernel. Chapter 8 for
    more details.


    # pm-hibernate


    During hibernate, the state of the system is saved to disk, and the system is
    fully powered off, except perhaps for a very low power state on — for example
    — an Ethernet card to enable wake-on-lan.


    # pm-suspend-hybrid


    Hybrid-suspend is the process where first the state of the system is saved to
    disk — as hibernate — instead of power off, the device goes into a suspended state,
    which means it can wake up quicker from normal hibernation. Its advantage over
    suspend is that it can resume even if the device runs out of power.


    You can also set the device to go into high-power and low-power mode; the command
    pm-powersave is used with an additional parameter of true or false. It basically
    works the same as the suspend framework.'
  merge: -1
  pgno: 72
- img_proc: true
  md: '# Chapter 3: Power Management


    To do this, use the following:


    ```

    $ sudo pm-powersave true

    ```


    An alternate method to suspend or hibernate an ubuntu-mobile device without requiring
    root access is explained in the “pmi action” section that follows.


    # pmi action


    Available in the universe repositories is a package called powermanagement-interface.
    This provides an abstracted layer above acli. The main advantage of using this
    is that it is possible to suspend or hibernate a mobile device without requiring
    root access.


    ```

    $ sudo apt-get install powermanagement-interface

    ```


    Call the power management interface directly via the following commands:


    hibernate:


    ```

    $ /usr/sbin/pmi action hibernate

    ```


    suspend:


    ```

    $ /usr/sbin/pmi action suspend

    ```


    To lock the Gnome session first (i.e., require a password on resumption), issue
    the following command before issuing the pmi command:


    ```

    $ gnome-screensaver-command -lock

    ```


    For example, it is possible to use these commands to create an application entry
    on Ubuntu Notebook Remix that locks the screen and puts the device into sleep
    mode.


    First make a file containing the following:


    ```

    gnome-screensaver-command -lock; pmi action suspend

    ```


    Then make the file executable with this command:


    ```

    $ chmod +x <file>

    ```


    Go to Preferences ⇋ Menu ⇋ New Item. Type Application in Terminal in the form
    and name the file Lock and Suspend. Choose the file that''s been created. Clicking
    the icon locks and suspends the device.


    # How pm-utils Works


    The main script (pmi-action, called via symbolic links as either pmi-suspend,
    pmi-hibernate, or pm-suspend-hybrid) executes hook executable scripts in an alphabetical
    order, passing the parameter suspend(suspend to RAM) or hibernate(suspend to disk)
    as instructed. All the scripts are finished, the device goes to sleep.'
