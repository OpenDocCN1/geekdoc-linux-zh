  md: '# Appendix E: D-Bus: An Overview


    # Addresses


    Applications using D-Bus are either servers or clients. A server listens for incoming
    connections; a client connects to a server. Once the connection is established,
    it is a symmetric flow of messages; the client-server distinction only matters
    when setting up the connection.


    If you''re using the bus daemon, as you probably are, your application will be
    a client of the bus daemon. That is, the bus daemon listens for connections and
    your application initiates connection to the bus daemon.


    A D-Bus address specifies where a server will listen, and where a client will
    connect. For example, the address unix:path=/tmp/abcdef specifies that the server
    will listen on a UNIX domain socket at the path/tmp and the client will connect
    to that. An address can also specify TCP/IP sockets, or any other transport defined
    in future iterations of the D-Bus specification.


    When using D-Bus with a message daemon, libdbus automatically discovers the address
    of the per-session bus by reading an environment variable. It discovers the system-wide
    bus daemon by checking a well-known UNIX domain socket path (although you can
    override this address with an environment variable).


    If you''re using D-Bus without a bus daemon, it''s up to you to define which application
    will be the server and which will be the client, and specify a mechanism for them
    to agree on the server''s address. This is an unusual case.


    # Big Conceptual Picture


    To specify a particular method call on a particular object instance, a number
    of nested components have to be named:


    ```

    Address -> [Name] -> Path -> Interface -> Method

    ```


    The name is in brackets to indicate that it''s optional — you only provide a route
    to the method call to the right application when using the bus daemon. If you
    have a direct connection to another application, bus names aren''t used; there''s
    no bus daemon.


    The interface is also optional, for historical reasons; DCOP does not require
    you to specify the interface; instead, it simply forbids duplicate method names
    on the same object instance. D-Bus will let you omit the interface, but if your
    method name is ambiguous, it is undefined which method was invoked.


    # Messages: Behind the Scenes


    D-Bus works by sending messages between processes. If you''re using a sufficiently
    high-level binding, you may never work with messages directly.'
