    # Creating a /tmp That Is Half the Size of Physical RAM


    You can add the following to /etc/fstab:


    ```

    tmpfs /tmp tmpfs nodvev,nosuisid 0 0

    ```


    This creates a /tmp that is half the size of physical RAM, and anything stored
    in /tmp goes to RAM. In practice, it ends up being committed to swap, but it means
    that it gets written to disk only when the space in /tmp exceeds the cache buffers
    (instead of immediately). This can speed up operations on temporary files for
    machines with slower secondary storage (not, however, on SSD).


    In reality, this can improve the performance of hard drives with speeds of 7200,
    5400, or even slower.


    Of course, the downside is that you want to clean up /tmp when hibernating the
    device, especially if the device is short on RAM away. Be careful!


