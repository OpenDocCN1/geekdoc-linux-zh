  md: '# Chapter 5: Application Packaging


    These commands are covered in a little more detail.


    # Creating a Distribution Environment


    The command pbuilder create will create a base chroot tar-ball (base.tgz). All
    other commands will operate on the resulting base.tgz. The distribution code-name
    needs to be specified with the distribution command-line option.


    debootstrap is used to create the bare Debian installation, and the build-essential
    packages are installed on top of the minimum installation using apt-get inside
    the chroot.


    Use pbuilder to create a package like this:


    ```

    $ sudo DIST=karmic pbuilder create

    ```


    # Building a Package to a Specific Release


    To build a package inside the chroot, use the following:


    ```

    $ sudo DIST=karmic pbuilder build whatever.dsc

    ```


    pbuilder will extract base.tgz to a temporary working directory, the directory
    with chroot, satisfy the build-dependencies inside chroot, and build the package.
    The built packages will be moved to a directory specified with the buildresult
    command-line option.


    # Updating the PBbuilder Environment


    Add the following code:


    ```

    $ pbuilder update

    ```


    It will update the base.tgz file. It will extract the chroot, invoke apt-get update
    and apt-get dist-upgrade inside the chroot, and recreate base.tgz (the tar-ball).


    # Using pbuilder


    Common packaging workflow is the one shown in the "Backporting Kernel". A developer
    may try to do debuild and build a package inside a Debian source:


    +   - pbuilder allows a similar workflow with packages built inside the chroot
    with checks that the current tree will be happily.

    - pbuilder calls dpkg-source to build the source packages, and then invokes pbuilder
    on the resulting source package. However, unlike debuild, the resulting deb file
    will be found in the buildresult directory.


    A slightly different mode of operation is available in pbuilder since version
    0.97. pbuilder usually runs Debian/rules clean outside of the chroot; however,
    it is possible to change the behavior to run inside the chroot with — use-pbuilder-internal.
    It will try to bind the working directory inside chroot, and run dpkg-buildpackage
    inside this.


    You use pbuilder like this:'
