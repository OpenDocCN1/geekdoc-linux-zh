    If there is a "Changed but not updated" list, then the working branch is not clean.
    It''s possible to reset the working branch and lose all modification with the
    following command:


    ```

    $ git reset -hard HEAD

    ```


    Now the working branch does not have any pending modifications. The next step
    is to update the “master” branch:


    ```

    $ git pull

    ```


    A lot of messages will be printed out now. It is only necessary to be worried
    if an error message is shown. If it is, the best action is to try and reset, pull
    again. This branch is a copy of the official Ubuntu branch, so the patch is only
    applied against the “custom” one. To achieve the target of this section and get
    the “custom” branch up-to-date, let’s check out the “custom” branch again:


    ```

    $ git checkout custom

    ```


    The next commit will update the “custom” branch and then replay your branch on
    top of that:


    ```

    $ git rebase master

    ```


    The result is unpredictable and there are many ways to solve any possible conflicts
    or problems. If everything is fine, just proceed to the next step; if a conflict
    occurs, a solid knowledge of git is fundamental. Please refer to Appendix B. If
    a conflict occurs that you can''t solve, the best solution is to reset the file
    to the “master” branch and then redo the afterwards.


    To figure out if there''s a conflict, see a message like this one (containing
    the error entries) is printed out after the rebase operation:


    ```

    First, rewinding to replay your work on top of...

    Applying: 1

    error: patch failed: debian/control:285

    error: debian/control: patch does not apply

    error: patch failed: debian/control.stub:285

    error: debian/control.stub: patch does not apply

    error: patch failed: debian/scripts/misc/getabis:77

    error: debian/scripts/misc/getabis: patch does not apply

    ```


    Then, for each file with an error, use the following:


    ```

    $ git checkout master <error file>

    $ git add <error file>

    ```


    In case of the conflicts, the command will continue the rebase operation:


