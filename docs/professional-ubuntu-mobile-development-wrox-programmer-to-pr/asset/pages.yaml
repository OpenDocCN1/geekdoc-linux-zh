  md: "# Chapter 4: Application Development\n\n# D-Bus Security\n\nThe bus daemon\
    \ has multiple instances on a typical computer. The system daemon has heavy security\
    \ restrictions on what messages it will accept, and is used for system-wide communication.\
    \ The other instances are created one per user login session. These instances\
    \ allow applications in the user's session to communicate with one another.\n\n\
    Security is configured for these instances in a configuration file. This file\
    \ lives in /etc/dbus-1/system.d.\n\nTo configure policies, create a file in this\
    \ directory called application.conf with the policies (this file could be anything\
    \ — the name does not matter). This file will look like:\n\n```\n<DOCTYPE busconfig\
    \ PUBLIC\n//freesktop//DTD D-Bus Bus Configuration 1.0//EN\"\n\"http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd>\n\
    <busconfig>\n  <policy user=\"root\">\n    <allow owner=\"net.sourceforge.PyDistcc\"\
    >\n      <send_destination=\"net.sourceforge.PyDistcc\">\n      <send_interface=\"\
    net.sourceforge.PyDistcc/>\"\n    </allow>\n  </policy>\n  <policy user=\"rodrigo\"\
    >\n    <allow owner=\"net.sourceforge.PyDistcc\">\n      <send_destination=\"\
    net.sourceforge.PyDistcc\">\n      <send_interface=\"net.sourceforge.PyDistcc/>\"\
    \n    </allow>\n  </policy>\n  <policy at_context=\"true\">\n    <allow send_destination=\"\
    net.sourceforge.PyDistcc\">\n      <send_interface=\"net.sourceforge.PyDistcc/>\"\
    \n    </allow>\n  </policy>\n  <policy context=\"default\">\n    <deny owner=\"\
    net.sourceforge.PyDistcc\">\n      <send_destination=\"net.sourceforge.PyDistcc\"\
    >\n      <send_interface=\"net.sourceforge.PyDistcc/>\"\n    </deny>\n  </policy>\n\
    </busconfig>\n```\n\nThe code example shows the use of policies. The default policy\
    \ of the D-Bus system bus is as follows:\n\n+   Name is DENIED by default.\nMethod\
    \ calls are DENIED by default.\nReplies to method calls, including errors, are\
    \ PERMITTED by default.\nSignals are PERMITTED by default.\n\nTherefore each user\
    \ must, in its policy configuration, permit an appropriate user to own the name\
    \ it wishes to claim — for example:\n\n```\n<policy user=\"rodrigo\">\n  <allow\
    \ owner=\"net.sourceforge.PyDistcc/>\"\n</policy>\n```"
  merge: -1
