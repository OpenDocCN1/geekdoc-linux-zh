    - Ecore

    - Edje

    - Embryo

    - EET


    The EFL libraries fit well into the embedded device context and are particularly
    useful for animations, transparent components, and themeable applications. A user
    interacts with the window manager, which itself shows a compiled Edje theme. Events
    are captured by Ecore while Evas communicates directly with the kernel to efficiently
    control hardware resources as 3D acceleration.


