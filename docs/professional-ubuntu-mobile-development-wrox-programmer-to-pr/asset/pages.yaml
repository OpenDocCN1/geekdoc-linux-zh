  md: '+   $ git pull-request generates a pull request for the main developer of your
    project if you are maintaining only part of a git repository.


    +   $ git merge merges upstream code into your branch so you can keep your development
    going.


    +   $ git mergetool calls your preferred merge tool to help you solve the issues
    in case of merge conflicts.


    # Repository Configuration


    In to make the repository work more comfortable, it is possible to add some configuration
    variables, which can help you avoid some repetitive work. The following are the
    most common and necessary ones:


    ```

    $ git config -global user.name "My Name"

    $ git config -global user.email "my_mail@mydomain.com"

    $ git config -global color.ui auto

    $ git config -global merge.tool kdiff3

    $ git config -global sendmail.smterver smtp.domain.com

    ```


    # Repository Administration


    If you are the repository administrator, you will need to be sure git daemon is
    running and your users have access only to the necessary resources on your server:


    +   $ git daemon is the daemon that is used to allow anonymous download from your
    repository.


    +   $ git shell is used as a restricted login shell for shared repository users.
    It will not allow access to the console, but it will allow developers to push
    and pull from the central repository.'
