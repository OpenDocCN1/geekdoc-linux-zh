  md: '# Introduction


    # UDS Intrepid


    At the UDS (Ubuntu Developer Summit) for Intrepid, there were demonstrations of
    preliminary versions of both the Network Remix and Ubuntu MID. There were also
    demonstrations of additional work based on the Ubuntu MID done by the Canonical
    OEM team. Along with these further demonstrations done of the Ubuntu DMPC image.
    It was decided that some consolidation was necessary.


    As a result of all this, the Ubuntu developers decided that there would be Ubuntu
    Mobile releases for Intrepid.


    # Intrepid


    So, for Intrepid, there was work done to create Ubuntu Mobile. The Ubuntu Mobile
    release was designed for larger 7-9-inch screens, which work best on the Samsung
    Q1 (that happened to be the 7-9-inch hardware owned by the developers working
    on this release flavor).


    The Ubuntu Mobile releases do not have any of the hardware settings or hard-coded
    configurations that were present in the Hardy-based Ubuntu MID, and so not be
    nearly tied to the specific device. Indeed, one of the specific goals for Intrepid
    for Ubuntu particularly was to move away from the hard coding, and should enable
    a wider variety of devices (perhaps including appropriately sized hardware such
    as the Algo MID or Sharp D4).


    Intrepid has an ubuntu-mid.img as well as an ubuntu-mobile.img. Images are officially
    built in the Ubuntu infrastructure on cdimage.ubuntu.com, which results in daily
    ubuntu-mobile release was a beta one, which was well reviewed on UMPCPortal(https://www.umpcportal.com/)
    and generated some community interest.


    # Jaunty


    The Ubuntu Mobile release was based on Hildon 2.2, which was based on Clutter
    and GTK. This brought significant improvements for Ubuntu Mobile. This could enable
    GTK+ to make finger-friendly interfaces, while staying compatible with APIs in
    code and an optional/complementary user interface library called Clutter. Clutter,
    discussed in Chapter 4, is an OpenGL ES library for creating visually rich and
    interactive user interfaces.


    # Karmic


    The Karmic release for Ubuntu Mobile is focused on the Ubuntu Network Remix and
    ARM releases of Ubuntu (see below). In an addition, one-off Ubuntu Mobile Remix
    was rolled out for demonstration and comparison purposes, but also to showcase
    the best of both projects.


    During this cycle, Ubuntu MID became community-maintained in the Ubuntu Liquid
    Remix project. If you would like to join this project, go to https://edge.launchpad.net/-url.
    This release will be based on Ubuntu Lucid, which is an LTS version for Ubuntu.


    # Ubuntu ARM


    On November 13, 2008, Canonical, the commercial sponsor of Ubuntu, announced that
    in response to demands from device manufacturers the Ubuntu operating system would
    be available for the ARM7 processor architecture. This includes both the ARM Cortex-A8
    and Cortex-A9 processor-based systems, which are the highest performing, most
    power-efficient processors released to date from ARM.'
