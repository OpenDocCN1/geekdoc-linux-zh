  md: '# Chapter 11: Putting It Together


    Creating an image from scratch involves four projects:


    +   - cdmage

    - debian-cd

    - germinate

    - britney


    Each of these is explained in this section.


    cdimage is the set of scripts that drives the whole process and handles synchronization
    with a local repository. It generates the debian-cd task lists from seeds and
    calls debian-cd to burn the finished ISO.


    The first step for creating an ISO is to lay out a directory structure:


    ```

    $ mkdir -p /home/<username>/devel/ubuntu

    ```


    Change into the recently created directory. Make a branch of our ubuntu-cdimage
    scripts:


    ```

    $ bzr branch bzr+ssh://bazaar.launchpad.net/-rclbelem/ubuntu-cdimage/mainline/ubuntu-cdimage

    ```


    Also make a branch of the debian-cd with changes for Ubuntu:


    ```

    $ bzr branch bzr+ssh://bazaar.launchpad.net/%7Eubuntu-cdimage/debian-cd/ubuntu/debian-cd

    ```


    Create a symbolic link between the two:


    ```

    $ ln -s debian-cd ubuntu-cdimage/

    ```


    Britney is an updater that intelligently moves packages (originally in Debian
    from the unstable repositories to the testing repositories), and the intelligent
    part comes from the fact that the destination for the packages should always be
    fully installable and close to being a release candidate. Branch this:


    ```

    $ bzr branch http://people.ubuntu.com/%7EEcjwatson/bzr/britney/cdimage/  britney

    ```


    Make a symbolic link from britney to ubuntu-cdimage:


    ```

    $ ln -s britney ubuntu-cdimage/

    ```


    Branch germinate:


    ```

    $ bzr branch bzr+ssh://bazaar.launchpad.net/%7EEcjwatson/germinate/mainline/

    germinate

    ```


    Link it to ubuntu-cdimage:


    ```

    $ ln -s germinate ubuntu-cdimage/

    ```


    227


    www-it-ebook.info'
