  md: "# Appendix E: D-Bus: An Overview\n\nIn pseudocode, programming with proxies\
    \ might look like this:\n\n```\nMessage message = new Message(/remote/object/path\"\
    , \"MethodName\", arg1, arg2);\nConnection connection = getBusConnection();\n\
    connection.send(message);\nMessage reply = connection.waitFor(message);\nif (reply.isError())\
    \ {\n} else {\n    Object returnValue = reply.getReturnValue();\n}\n```\n\nHowever,\
    \ programming with proxies might look like this:\n\n```\nProxy proxy = new Proxy(getBusConnection(),\
    \ /remote/object/path*/\nObject returnValue = proxy.MethodName(arg1, arg2);\n\
    ```\n\n# Bus Names\n\nWhen each application connects to the bus daemon, the daemon\
    \ immediately assigns it a name, called the unique connection name. A unique name\
    \ begins with a colon (:). These names are never reused during the lifetime of\
    \ the bus daemon — that is, you know a given name will always refer to the same\
    \ application. An example of a unique name might be :34-907. The numbers after\
    \ the colon have\n\nWhen a name is mapped to a particular application connection,\
    \ that is assigned to owner that name.\n\nApplications may use additional well-known\
    \ names. For example, you could write a specification to define a name using com.ubuntu.TextEditor.\
    \ Your definition could specify to that name, an application should have an object\
    \ at the path /com/ubuntu/TextFileManager supporting the interface org.freedesktop.FileHandler.\n\
    \nApplications could send messages to this bus name, object, and interface to\
    \ execute method calls.\n\nYou could think of the unique names as IP addresses,\
    \ and the well-known names as domain names. So com.ubuntu.TextEditor might map\
    \ to something like :34-907 as ubuntu.com maps to something like 91.189.94.250.\n\
    \nNames have a second importance, other than routing messages. They are used to\
    \ track lifecycle. When an application exits (or crashes), its connection to the\
    \ message bus will be closed by the operating system kernel. The bus sends out\
    \ notifications telling the remaining applications that the application's names\
    \ have lost their owner. By tracking these notifications, your application can\
    \ monitor the lifetime of other applications.\n\nBus names can also be used to\
    \ coordinate single-instance applications. If you want to be sure only one com.mycompany.TextEditor\
    \ application is running, for example, have the text editor application exit if\
    \ the bus name already has an owner.\n\n# 301"
