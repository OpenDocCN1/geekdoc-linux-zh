  md: '# Chapter 11: Putting It All Together


    In the preceding example, pptp-linux is a dependency. If it were in brackets,
    it would indicate that the package is recommended and not depends. For instance,
    the Online Services example that follows is a recommends:


    +   * Online Services:

    * (ubuntu-client-gnome)


    A exclamation mark in a seed file identifies a per-seed blacklist. An exclamation
    mark means to never include in the seed or in any of its entries. An example of
    this follows:


    ```

    == Blacklist ==

    libcodec cannot be shipped on CDS (c.f. Ubuntu technical board resolution

    2007-01-02).

    !libcodec\*

    ```


    The asterisk at the end of libcodec is used for regular matching in the germinate
    code to place everything that starts with libcodec into the per seed blacklist.


    Other things to notice in seed files are process substitution variables. A package
    containing substitution variables will be expanded into one package for each possible
    combination of the values of those variables. An example is:


    +   * Kernel-Stem: linux linux-image

    == i386 ==

    * $(Kernel-Stem)-generic-pe [i386]

    * linux-headers-generic-pe [i386]

    * $(Kernel-Stem)-virtual [i386]

    * linux-headers-virtual [i386]


    Seed entries can also be followed by square brackets. [powerpc]


    +   * language-support-$ [Languages] [powerpc]


    which indicates that the language-support package should not be used on the powerpc
    architecture. The converse is also true, of course, that in seed entries followed
    by [lpia i386 architectures] (without the exclamation mark) indicate that they
    should only be used on LPIA and i386 architectures.


    Finally, if the package name in the seed starts with % then expands to all binaries
    from the given source package.


    # Germinating the Seeds


    As mentioned previously, the raw seed files are germinated into a full list of
    packages using the germinate program. The germinate program requires some default
    seeds to be present in order to work. The most important of these seed files (which
    are mandatory) are 5STRUCTURE, supported, and blacklist.


    These mandatory files do not necessarily need to contain anything but they must
    be present for germinate to work.'
