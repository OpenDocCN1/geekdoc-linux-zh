    # Contributor


    A contributor — a developer who contributes to somebody else''s project — will
    need a different set of\commands in order to get her work integrated into the
    upstream project. It''s important here to know how

    to work with a shared repository, when to rebase, when to merge, and so on:


    +   - $ git pulls new code from upstream.


    +   - $ git pushes code to the central repository if you have permission.


    +   - $ git format-patch generates anhbox patch file that can be mailed using
    git send-email.


    +   - $ git send-email sends the patches generated with git format-patch.


    # Integrator


    The main developer of a shared project will generally play the role of integrator.
    When playing that role,

    you might have to integrate (from now called push) another developer''s work.
    It''s important to

    remember that on a shared repository you should not rewrite the history of the
    repository. Otherwise,

    everbody working downstream will not be able to pull from your shared tree, forcing
    them to

    clone the tree.


    +   - $ git am is used to apply patches in mbox format mailed by your contributors.


    +   - $ git pull will fetch and merge code from your trusted contributors.


    +   - $ git revert is used to undo broken or unneeded commits.


    +   - $ git push is used to publish code to a central and shared repository.


    # Maintainer


    Being a maintainer is generally the same as being an integrator. On a few projects,
    however, that might

