  md: '# Chapter 9: Testing and Usability


    # Other Useful Linux Performance Testing Tools


    Various tools already on Ubuntu which can help to optimize performance.


    # ps


    This is a tool that allows you to view the processes that are running on the mobile
    device. If you want to search for a specific process, the following is a useful
    command:


    ```

    ps aux | grep <something>

    ```


    # top


    Top is a tool that enables you to keep track of processes; it lists processes
    that are ordered by CPU and memory usage. When put together with the at command,
    it is possible to schedule top to run at a particular time. You can achieve this
    by writing a bash script that runs top one minute later this:


    ```

    $ cat ./app-test.at

    TERM-linux top -b -n 1 >/tmp/top-report.txt

    $ at -f ./app-test.at now-1minutes

    ```


    The application test can then be started and its resource usage observed.


    # time


    This tool measures execution times. It takes a command as an argument. It executes
    and shows a brief statistic about the amount of time that the process spends.
    This can help you to find out if a command takes more time than expected. Of course,
    this is especially useful if you are dealing with a program that you have developed
    you can modify the sources and compile them again to compare results.


    Time is used with:


    ```

    $ time /pumd.py

    real 1m41.365s

    user 0m0.000s

    sys 0m0.004s

    ```


    # procinfo


    The load is a measurement of the active processes running at any time. It is the
    sum of the run queue length and the number of jobs that are currently running
    on the CPU. The results are obtained using a program called procinfo. Here is
    an example:


    ```

    $ sudo apt-get install procinfo

    $ procinfo

    Memory:    Total      Used      Free     Buffers

    RAM:       1017380   966680   50700   11980

    Swap:      3071992   118784  2953208

    Bootup: Mon Jun 1 20:15:21 2009  Load average: 0.53 0.54 0.41 2/274 1186

    ```'
