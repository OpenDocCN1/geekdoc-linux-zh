  md: '# Chapter 7: Theming


    # Applying the Style


    In GTK, there are three ways to apply styles — the class, widget_class, and widget
    statements, of which the class and widget are the most important.


    In the preceding code, the style was applied by this call:


    ```

    class GtkWidget style "default-style"

    ```


    When finding styles that are relevant to the current widget, a widget hierarchy
    applies like that the style will be applied to whichever class name matches the
    one in the code. The hierarchy looks something like this (in order of importance):


    +   - GtkWidget

    - GtkContainer

    - GtkBin

    - GtkButton

    - GtkToggleButton


    In the preceding example, styles are applied to the top-level widget (GtkWidget)
    and then cascaded down.


    > The use of widget_class to apply styles is not covered here. widget matches
    work on the names of the widgets. This is very useful if there is a specific widget
    in an application that needs be modified.


    GTK applies the different "styles" in the preceding order. Styles that merged
    later on override the settings of the earlier ones. This makes sense, as the class
    matches are very broad while the widget matches are very specific and pick out
    just a single widget.


    # Theming Ubuntu MID


    You can theme two ways: manually and automatically.


    # Manually Theme MID


    To create a theme from scratch that based on the existing mobilebasic theme on
    Ubuntu MID, copy the default mobilebasic theme to a new directory called pumdtheme
    and then move it into the Matchbox directory.


    It is also possible to use hidon-theme-tools and the command hidon-theme-bootstrap
    to create and then package a new theme. This is explained in the section "Automatically
    Theming MID."


    ```

    $ cd /usr/share/themes/

    $ sudo mkdir pumdtheme

    $ sudo cp -r mobilebasic/* pumdtheme

    $ cd pumdtheme/matchbox

    ```'
