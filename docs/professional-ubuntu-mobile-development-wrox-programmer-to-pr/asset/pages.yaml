  md: "# # Chapter 6: Application Selection\n\n# # Location-Aware Users\n\nUsers with\
    \ aging parents and young children find the concept of location important to them.\
    \ This user group also has a relatively high disposable income as they have spent\
    \ some years working and present an attractive market to an OEM. Features that\
    \ generally expect from a location-aware mobile device include the following:\n\
    \n+   - The capability to automatically reconfigure itself, that it always uses\
    \ the right network settings (for firewalls and VPN), and prints on the right\
    \ printer (i.e., use the home printer when at home, the work printer when at work)\n\
    \ Security, always once from designated physical locations\n- Help to find it\
    \ if it is misplaced, or stolen\n- The ability to easily share a power or presentation\
    \ with everyone in a room, without having to e-mail it or set up a folder on a\
    \ common server\n\nSome of this functionality could be presented to the user using\
    \ a simple web interface running locally on the device.\n\n# # A Practical Example\n\
    \nIn this section, you learn how to create a GPS-enabled standalone web application\
    \ for a MID device. It embeds a web server and database using a Python application,\
    \ which receives information from the D-Bus interface using XML-RPC. It uses the\
    \ Django web framework.\n\n> > D-Bus is covered in more Chapter 4.\n\n# # Background\n\
    \nTraditionally, GPS was provided on Debian-like systems using a daemon called\
    \ gpsd (apt-get install gpsd). There are however, some problems with gpsd in resource-constrained\
    \ environments, most notably that gpsd is better to run at start, and stopped\
    \ when the system is down (or USB/Bluetooth hotplug device when device is plugged-in\
    \ or removed). Therefore, if a client is started before gpsd is running (for example,\
    \ a GPS app is started before the Bluetooth device is connected), the only way\
    \ for it to know about gpsd is for attempt to connect to the gps socket and keep\
    \ trying often until it succeeds.\n\nThis makes clients very busy, always having\
    \ to wake up to see if they can connect. On a system that runs on batteries, having\
    \ processes that can't sleep very often is a bad thing. There is also a problem\
    \ with the granularity of it gpsd provides, as running clients get notified about\
    \ everything, even if they don't care about it. GPS emits a new fix on every NMEA\
    \ sentence received, which for most GPS devices is about five a second, and each\
    \ time the clients are woken up even if they don't care about the data that has\
    \ changed."
  merge: -1
  pgno: 173
