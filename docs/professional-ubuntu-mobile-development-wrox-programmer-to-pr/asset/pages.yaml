  md: '# # Chapter 7: Theming


    ```

    /usr/bin/matchbox-window-manager \

    -theme /usr/share/themes/mobilebasic/matchbox/theme.xml \

    ```


    Compiz is a compositing window manager for the X Window System, which uses 3D
    Graphics hardware to create desktop effects for window management.


    # ## What Happens When a MID Device Boots?


    On boot up, we will execute /etc/event.d/session, which will launch the X Window
    System using the


    ```

    exec openvt -e -s -lu1 ubuntu -c -env XDG_SESSION_COOKIE startx -br*

    ```


    Once X starts, it parses the session scripts in /etc/X11/Xsession.d/, including
    the /etc/X11/Xsession

    d25midstart file, which has a


    ```

    MID_GUI=/usr/share/ubuntu-mid-default-settings/mid-gui-start

    ```


    On older versions of Ubuntu Mobile there was one of GTK2_RC_FILES environment
    variables for GTK+2 widget themes in this file, as the following:


    ```

    export GTK2_RC_FILES=/usr/share/themes/mobilebasic/gtk-2.0/gtckrc:/usr/share/themes/mobilebasic/gtk-2.0/gtckrc.maemo_af_desktop

    ```


    These files define GT+ styles and bindings that will create the look and feel
    of all the widgets in the applications and the Hildon desktop.


    On Ubuntu Unity, the GTK changes are now made by setting the following Gconf to
    the name of a directory: /desktop/gnome/interface/gtk_theme. For example, this
    could be to mobiletheme or any other theme in the directory by setting the following:


    ```

    gconftool-2 --set string /desktop/gnome/interface/gtk_theme mobiletheme

    ```


    When that keys change, the change is propagated to settings and, through this,
    all GT apps are notified of the new theme, and they immediately redraw themselves.
    GT applications launched later the key will automatically start using the new
    theme.


    Gconf, which was discussed in Chapter 4, is a system for storing application preferences.
    It exists so that application preferences can be more easily managed. It is also
    transparent which means that a setting changed in one application will instantly
    update in all other applications that are interested in that setting. This technology
    is vital for the coherent user interfaces on mobile devices.


    The easiest way to manage Gconf settings is to use gconf-editor:


    ```

    $ sudo apt-get install gconf-editor

    $ gconf-editor

    ```


    149'
