  md: '# Chapter 11: Putting It Together


    # GDM


    GDM is the Display Manager from the GNOME project. It is highly customizable and
    has an easy configuration and pre-configuration system.


    # Pre-Configuring GDM


    The default gdm behavior can be changed. The config file follows the ini file
    format. The configuration includes several sections: daemon, security, xdmcp,
    gui, greeter, chooser, debug, and servers. The configuration file is found in
    /etc/gdm/gdm.conf.


    The following code shows how to enable the keyboard:


    ```

    # gdm.conf-custom

    # gdm

    [daemon]

    AddGtkModules=true

    GtkModulesList=gui:atk-bridge:/usr/lib/gtk-2.0/modules/libwdwmousellistener:/usr/lib/gtk-2.0/modules/libkeymouselistener

    [security]

    [xdmcp]

    [gui]

    [greeter]

    SoundOnLogin=false

    [chooser]

    [debug]

    [servers]

    ```


    GDM can also be themed. This is explained in Chapter 7, "Theming."


    # Setting the Default Ubuntu, XFACE, and Hildon Behaviors


    Gtk-based desktops use GConf as the database for configurations. The following
    file is an example of how to set a default configuration for gconf. This file
    is usually included in a src/debian directory of a configuration package:


    ```

    # [package-name].gconf-defaults

