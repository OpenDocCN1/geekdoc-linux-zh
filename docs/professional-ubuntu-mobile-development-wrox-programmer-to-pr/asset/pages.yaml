  md: '# Chapter 8: Kernel Fine-Tuning


    ```

    # dkms add -m openafs -v 1.4.10 -k 2.6.29-custom

    ```


    Like status, add is the command that tells what you''re doing.


    Three options can be used in the command:


    ```

    # dkms <command> OPTIONS:

    ```


    +   -m: Refers to the module name

    -v: Refers to the module''s version

    -k: Refers to the kernel version


    Now it is possible to repeat the previous step to see what is:


    ```

    # dkms status

    openafs, 1.4.10: added

    openafs, 1.4.9, 2.6.28-11-generic, i686: installed

    ```


    As the driver is now added to the tree, it is possible to build the driver with
    the command:


    ```

    # dkms build -m openafs -v 1.4.10 -k 2.6.29-custom

    ```


    And the dkms status is now:


    ```

    # dkms status

    openafs, 1.4.10, 2.6.29-custom, i686: built

    openafs, 1.4.9, 2.6.28-11-generic, i686: installed

    ```


    With the driver already built, the last step to install is:


    ```

    # dkms install -m openafs -v 1.4.10 -k 2.6.29-custom

    ```


    Then, the dkms status prints it in the Installed state:


    ```

    # dkms status

    openafs, 1.4.10, 2.6.29-custom, i686: installed

    openafs, 1.4.9, 2.6.28-11-generic, i686: installed

    ```


    This means two driver versions are both installed, each one is installed in a
    different kernel following the initial plan.


    Because it''s possible to build/install modules using simple DKMS commands, it''s
    also possible to remove/uninstall them. The uninstall command changes an installed
    driver to the Built state. The driver is not present in the system anymore but
    it can be installed again without having to rebuild it:'
