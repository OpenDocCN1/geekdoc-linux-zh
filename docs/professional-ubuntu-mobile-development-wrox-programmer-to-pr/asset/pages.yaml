  md: '# Testing and Usability


    Ubuntu Mobile has been developed in a highly decentralized manner. However, in
    order for it to be attractive to both the ISV and OEM communities, it must provide
    better or equivalent levels of reliability than that provided by proprietary platforms.


    Independent software vendor (ISV) is a business term for companies specializing
    in making selling software how to create and test an example application for mass
    markets or niche markets.


    This first chapter focuses on the Mago that the Ubuntu QA team is using to automate
    the desktop and which to test devices using the accessibility framework. Next,
    it shows how to create and verify its compatibility with the Linux Standard Base
    (LSB) Testing Toolkit.


    The chapter discusses other testing tools — specifically those tools for package
    testing — and it shows some tools that are useful for general performance and
    usability. Finally, the chapter concludes with a discussion about possible strategies
    for testing. It also shows how to submit a bug report correctly to the Ubuntu
    developers if errors are discovered.


    # Why Test?


    Testing can never completely establish the correctness of software. Instead, it
    provides a comparison that measures the state and behavior of the software or
    hardware against some known or expected benchmarks. These may include specifications,
    comparable products, past versions of the same product, user or customer expectations,
    or relevant standards. The need for high quality testing is obvious — it has been
    estimated that software cost the US economy more than $59.5 billion in 2002 (http://www.nist.gov/public_affairs/releases/n02-10.htm).
    It has also been estimated that more than a third of this cost could have been
    avoided if better software testing was performed.'
  merge: -1
