    sudo pdebuild --use-pdebuild-internal


    # Configuring Actions


    Hook scripts are used when you want to perform some action at a determined moment
    during pubuilder execution. Actions can be scripted, too.


    A hook directory can be defined by the variable HOOKDIR. This can be set in the
    command line as follows:


    ```

    $ sudo HOOKDIR=/path/to/hookdir pbuilder -build file.dsc

    ```


    You can also set it as follows:


    ```

    $ sudo pbuilder -hookdir /path/to/hookdir -build file.dsc

    ```


    The hook script names must be in the form x<digit><digit><whatever-else-you-want>
    hook script, which will invoke a shell if the build fails. Here is the example
    c0shell hook script, which will invoke a shell if the build fails.


    ```

    #!/bin/bash

    # invoke shell if build fails.

    apt-get install -y force-yes less

    cd /tmp/buildd/+debian/

    bin/bash < /dev/tty > /dev/tty 2 /dev/tty

    ```


    # Additional Hook Manipulation with PBuilder


    Some of the most useful hook manipulation commands we have found are as follows.
    They start with letters, the first of which is A.


    ```

    A<digit><digit><whatever-else-you-want

    ```


    This is executed before a build starts — after unpacking the build system, and
    unpacking the source, and satisfying the build-dependency.


    B is used like this:


    ```

    B<digit><digit><whatever-else-you-want

    ```


    This is executed after the build system finishes building successfully and before
    copying back the build result.


    C is used like this:


    ```

    C<digit><digit><whatever-else-you-want

    ```


    This is executed after build failure and before cleanup.


    D is used like this:


    ```

    D<digit><digit><whatever-else-you-want

    ```'
