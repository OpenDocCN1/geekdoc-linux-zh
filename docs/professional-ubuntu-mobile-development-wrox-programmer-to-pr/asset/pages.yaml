  md: '# Chapter 8: Kernel Fine-Tuning


    +   - It''s much easier and quicker to compile and install the driver only.


    +   - The OEM may need to stick with the current kernel for compatibility reasons.


    +   - In some situations, it might be forbidden to use a non-tested kernel for
    reliability reasons. This means that a new kernel version would result in more
    enforced validation and increased costs before being pushed to an end user.


    +   - The required driver (or driver version) is not currently present in the
    kernel tree.


    There are plenty of different ways to develop a driver that resides outside the
    kernel or a new version that is currently either applied or not in the current
    kernel. If it''s not standardized, it can make a lot of work for driver developers
    to make each driver version compatible with many kernel versions and/or Linux
    distributions that exist and also a lot of work for the final users to get, build,
    and install the driver.


    In order to help developers and users, a framework that''s called Dynamic Kernel
    Modules Support was created. It provides a very easy mechanism to install and
    new (or up-to-date) drivers by using simple commands and configurations. The following
    section demonstrates how to use this framework and how users can get the most
