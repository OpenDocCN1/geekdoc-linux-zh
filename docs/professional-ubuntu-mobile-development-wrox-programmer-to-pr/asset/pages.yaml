  md: 'The major eras in computer technology can be classified as follows:


    +   - 1960s — Mainframes (“Big Iron”) and minicomputers (multiuser, interactive)

    - 1970s — Personal/desktop computer: microprocessor-driven,一体 applications

    - 1980s — Luggables: movable computers, weighing 15–30 pounds


    +   - 1990s — Laptops powered by slimmed down notbooks: 14-inch screen or larger

    - 2000s — Notebooks: 12–13-inch screen, Portable Media Players (for example, iPod)

    - 2007–2010 — Netbooks: 7–10.2-inch screen, Mobile Internet Devices (MIDs): 4–7-inch
    screen


    The year 2000 marked the beginning of the cell phone and smartphone era. The Nokia
    9210 Communicator and RIM Blackberry hit the market with compact offerings that
    were phones but also more. They weren general purpose computers, but you might
    have gotten the sense that what they wanted to be when they grew up.


    # Changing Focus


    Two of the defining characteristics in the evolution of computers have both physical
    and design size. These defining attributes influence user interactions as well
    as developer strategies and solutions.


    Apple opened the door on the smallest consumer-oriented segment with its insanely
    successful introduction of iPhones in October 2001. The first iPhone was a computer
    stick the size of a pack of gum. Consumer electronics have a tendency to get smarter
    through the magic of software and the iPod redefined complete media devices.


    In January 2007, Apple completely blew the roof off this segment by introducing
    the iPhone. Later in the year, the iPod Touch was. These portable electronics
    devices had powered operating systems under the hood — variants of OS X specially
    made for the hardware. Elegantly packaged, with WiFi, and high-resolution touches,
    they now run applications on notebook computers. Apple was shifting what would
    come to be a Mobile Internet Device (MID).


    Loyal Apple customers stood in lines to sign up the first products. International
    customers paid high premiums for early shipments. Enthusiastic developers created
    thousands of new applications ... even though it seemed as Apple didn''t want
    them. An ecosystem of telephone carriers, music providers, and accessories helped
    grow the market.


    Apple sold an astounding number of iPhones — more than 173 million of these very
    mobile gadgets by September 2008. You’ve seen them everywhere — on trains, planes,
    and in gyms, schools, office buildings, and sports venues. (Goodness, I have one
    who owns this of these!)


    When introduced the Macintosh in 1984, the iPhone and iPod Touch, Apple rewrote
    the book on user interface design for small mobile computers. The iPhone redefined
    what was possible for small computer packaging. Consider the specs: 3.5-inch diagonal
    multi-touch display (480×320 pixel resolution at 163 ppi), less than 5 ounces,
    in slim packaging.'
