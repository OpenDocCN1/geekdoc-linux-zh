    \ ubuntu-golden-0.1\n$ dh-make -createorig -indep\n$ ls - debian\nchangelog docs\
    \ init.d.lsb menu.ex README.Debian\ncompa docs init.d.lsb postext.ex rules\ncontrol\
    \ emacsen-install.ex managepage.ex postrm.ex teste.default.ex\ncopyright emacsen-remove.ex\
    \ manage.ex sgml.ex preinst.ex teste.doc-base.EX\ncron.d.ex emacsen-startup.ex\
    \ manage.xml perrm.ex watch\n```\n\n# # rules\n\nThe file is an executable Makefile\
    \ that has rules for building the binary package from the packages. A full explanation\
    \ of rules file can be found at https://wiki.ubuntu.com/PackagingGuide/rules\n\
    \nA default file created by dh_make looks like:\n\n```\n#!/usr/bin/make -f\n#\
    \ *- makefile -*\n# Sample debian rules that uses debhelper.\n# This file was\
    \ originally written by Joey Hess and Craig Smalls.\n# As a special exception,\
    \ when this file is copied by dh-make into a\n# dh-make output file, you may use\
    \ that output file without restriction.\n# This special exception was added by\
    \ Craig Small in version 0.37 of dh-make.\n# Uncomment this to turn on verbose\
    \ mode.\n#export DH_VERSION=\nconfigure: configure-stamp\nconfigure-stamp:\n \
    \   # Add here commands to configure the package.\n\ntouch configure-stamp\n\n\
    build: build-stamp\n\nbuild-stamp: configure-stamp\ndh_testdir:\n    # Add here\
    \ commands to compile the package.\n$(MAKE)\n#docbook-to-man debian/teste.sgml\
    \ > teste.1\n\ntouch $0\n```"
