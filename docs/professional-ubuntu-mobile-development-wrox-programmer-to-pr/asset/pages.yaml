  md: '# Chapter 11: Putting It All Together


    # Fine-Tuning the Kernel


    It may be necessary on a low-disk device to remove all unnecessary drivers and
    modules from the kernel. It is also a good idea to optimize processors (such as
    enabling hyperthreading), manage memory in a coherent memory, and ensure that
    network parameters are correct.


    The Atom processor on the target device is a new architecture, but based on older
    technologies. It''s the first in-order x86 from Intel the Pentium.


    A processor receives instructions by one and puts them in a pipeline and executes
    them. In an in-order architecture, the instructions are executed in the order
    in which they arise, whereas an out-of-order architecture is capable of changing
    the order in the pipeline.


    On the Atom, there is a long pipeline coupled to an in-order architecture — consequently
    hyperthreading can be effective and significantly increases performance. This
    needs to be enabled in both the kernel and the BIOS of device itself.


    CPU performance can be measured with htop and systat, which are available in repositories.


    To find out how such changes made, read Chapter 8, “Kernel Fine-Tuning.”


    # Defining Power Policies


    DeviceKit-Power (see Chapter 3, “Power Management”) is now integrated into the
    new Gnome-Power-Manager for karmic.


    It is important to note that since Ubuntu Jaunty, powernow-k8 and acpipuref are
    no longer available as modules but are compiled into the kernel. This is important
    as these modules are used by projects such as Linux-PHC to undervolt a CPU to
    expand battery time and to reduce the CPU''s temperature without affecting performance.


    As a result, undervolting is necessary to either compile the kernel with the stand-alone
    modules (this is at the expense of boot) or to use the kernel from the Linux PHC
    PPA at https://launchpad.net/~linux-phc/+archive.


    Linux-PHC utilizes the production density of a CPU. CPUs have different production
    qualities so the vendor defines voltages for every CPU – even those of low quality
    can be undervolt. Actual performance results for undervolting on the Atom processor
    are mixed at present, so it is recommended to also optimize the system as fully
    as possible for power savings, suspending devices when possible (WLAN, USB, LAN).


    # Is It an Embedded System?


    On its hardware type, the filesystem may need to be compacted. When creating embedded
    systems, every byte of the storage on the device is important, compression is
    used everywhere possible.


    221


    www-it-ebooks.info'
