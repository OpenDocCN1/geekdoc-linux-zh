    # pbuilder for Automating the Testing of Packages


    You can use pbuilder (Chapter 5) to automate the testing of packages. It has a
    feature that allows hooks to be used; these hooks can install packages inside
    the chroot, and even to uninstall them. Some known tests include:


    +   - An automatic install-remove-upgrade-install-upgrade-purge-test-suite (distributed
    as an example B91dpkg-i and found in the /usr/share/doc/pbuilder/examples directory).
    There is also a check that everything calls execute_installtest.sh found in the
    same directory.


    +   - Automatically running lintian (distributed as an example in /usr/share/doc/pbuilder/examples/B90llintian)


    To use this test suite, hooks need to be created. Create a directory, as follows:


    ```

    /var/cache/pbuilder/hooks

    ```


    Add, for example, the B91dpkg-i script to this directory.


    > It is also possible to specify on the command line --hookdir /usr/share/doc/pbuilder/examples
    to include all the example hooks.


    Once these hooks are established, test scripts can be run. These test scripts
    are placed in the source code for the package being tested, in the folder debian/pbuilder-test/NN_name
    (where NN is a number), following the run-parts standard for filenames.


    Run-parts (from the debianutils package) is used to execute a number of scripts
    or programs that are "run-parts" requires these script filenames consist entirely
    of letters, digits, underscores, or hyphens.


    Example scripts that are used with pbuilder-test can be found in /usr/share/doc/pbuilder/examples/pbuilder-test.


    An example of a test script is 004-ld:


    ```

    #!/bin/bash

    # simple test to see that the program is installed in the correct

    # place and looks sane through ldd

    ldd /usr/bin/program


    The command ldd lists the dynamic dependencies of executable files or shared objects.

