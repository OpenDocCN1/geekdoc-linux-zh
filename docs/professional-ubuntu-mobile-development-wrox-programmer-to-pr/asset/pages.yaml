  md: '# Chapter 4: Application Development


    Clutter also has support for colors, signals, and labels, allowing for the creation
    of compelling visual interfaces without a developer, designer, or OEM needing
    to resort to proprietary and costly software such as Flash.


    The following Python application shows the creation of three actors on a stage.
    This is embedded inside a GTK application. In the application, one image actor
    circles the other in a permanent loop while the third (a text actor) fades in
    and out over.


    At the time of this writing, the latest stable version of Python Clutter is 0.8
