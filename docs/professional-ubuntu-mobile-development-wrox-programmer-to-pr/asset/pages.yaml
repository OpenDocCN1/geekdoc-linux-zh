  md: '# Chapter 12: Mobile Directions


    Linux-distributions are careful, selective, and personalized works of many people
    individually "breeding" their distributions. Creating a distribution is essentially
    a work of Mendelian selection. The individual programs, packages, and customizations
    in a distro are tailored to the preferences and needs of the people who are creating
    the distribution.


    Mendel could quickly trace back the inherited traits of Ubuntu from Debian. Mark
    Shuttleworth involved with the Internet as a student. He a Debian developer by
    1994, he created the first package for Apache. From point forward, Debian became
    an anchor and foundation for his work. Shuttleworth was the "Master of the Universe"
    for Ubuntu — the group of individuals who, maintain, include, exclude, and identify
    interdependencies in the components of a new Ubuntu.


    # Mayr


    The Mayr Model of software development is named after Ernst Mayr Mayr came to
    be known as the leading evolutionary biologist. His great work revealed the intricacies
    of adaptation and multiplication of species. Mayr''s work harmonized and connected
    the work of Darwin and Mendel, bringing together previously warring camps of scientists.
    Mayr''s theories built bridges rather than walls. Mayr was known for the reason
    in which he mentored and mentored other scientists during bird watching societies.


    The Mayr Model explains the co-existence of diverse distributions. In many ways,
    Mayr''s methodology mirrored that of open source development. Through collaboration
    and knowledge sharing, Mayr brought together individuals from different areas
    with common interests. There is another similarity to Mayr worth noting. Eric
    Raymond wrote "Every good work of software starts scratching a developer''s personal
    itch." Echoing that refrain, Mayr was known to encourage his students to take
    up their own research projects: "Everyone should have a problem."


    # Frankenstein


    Finally, there''s Frankenstein Model of software development. As you might guess,
    this is based on the work of Mary Shelley''s Frankenstein or The Modern Prometheus,
    which is her 1818 novel that was introduced in parts by discussions about the
    author by the Erasmus Darwin, grandfather of Charles Darwin. The plot of the story
    is simple — a scientist named Frankenstein discovers he has the ability to animate
    during his days. Frankenstein then brings to life, from a patchwork of body parts,
    a new being. Does this quote from the book sound familiar to any open source developers?


    > I worked hard for nearly two years, for the purpose of infuse life into an inanimate
    body. For I had deprived myself of rest and health. I had desired it with fervor
    for exceeded moderation; now that I had finished, the beauty of the dream vanished,
    breathless horror and disgust filled my heart.


    The Frankenstein Model is descriptive of how outcomes — despite the best of intentions
    — come up of short expectations. The projects that do not end well for: Yet, the
    code lives on. If there is a lesson to be learned, the Frankenstein puts it this
    way: "Peace! Learn my miseries, and do not seek to increase your own"


    There is no fooling the future; it is will become. However, these different models
    might help you understand the path, and make some well-informed guesses about
    the future.'
