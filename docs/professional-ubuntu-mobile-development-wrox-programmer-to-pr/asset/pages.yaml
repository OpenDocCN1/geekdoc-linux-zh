  md: '# Chapter 6: Application Selection


    A factor therefore driving the adoption of mobile devices in corporate settings
    is security. Password protection, remote wipe capability, and physical device
    tracking are the top three factors cited by many companies that are contemplating
    employing employees with mobile devices.


    Ubuntu comes with a feature to create an encrypted private directory for the default
    user. You can set this up on a device as follows:


    ```

    $ sudo apt-get install ecryptfs-utils

    ```


    Then run the following:


    ```

    $ ecryptfs-setup-private

    ```


    sudo, which allows temporary superuser privileges, should not be used for this
    operation.


    Enter a login passphrase, which is the password used to log in to the device.


    Choose a mount passphrase.


    Enter the mount passphrase (again).


    The ecryptfs-setup-private script creates the /home/user/Private directory and
    tests that the encrypted mount works as expected.


    After rebooting the device, there will be an encrypted directory in /home/user/Private
    where all confidential company information can be stored.


    > Automatic, password-less logins such as the one on Ubuntu MID mean that the
    ~/Private directory is not mounted by default. This is by design and means that
    a password needs to be entered when clicking on the file "Access Your Private
    Data" in the ~/Private directory. After this is done, the encrypted data is available
    to the user.


    A different passphrase should be used to encrypt the mount; this is only needed
    if it is necessary to manually recover data.


    # Documents


    Business needs word processing software to create letters and documents, spreadsheet
    software for business analysis, and calculation and presentation software for
    important meetings.


    OpenOffice, is a free cross-platform application suite and is compatible with
    Microsoft Office, so it is easy to exchange documents with friends and colleagues
    who use Windows and Microsoft Office.'
