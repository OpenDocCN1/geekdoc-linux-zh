    # Disabling atime


    A significant downside of atime (a timestamp of file access required under the
    POSIX standard) is that every time a file is accessed, the kernel will write a
    new timestamp to the disk. This disk writes will keep the disk as busy as the
    link to busy, affects both performance and durability. atime can be disabled with
    the following:


    ```

    $ mount -o remount,noatime

    ```


    Another approach that was added in the 2.6.20 kernel is to use the relime mount
    option. If this flag is set, access times are updated only if they are earlier
    than the modification time. This change allows utilities to see the current version
    of a file has been read, but still cuts down significantly on atime updates. relime
    can be enabled with the following:


    ```

    $ mount -o remount,relime /

    ```


    # Turning Off Background Services


    Background services are listed by default in xdg defines a method for automatically
    starting applications during the startup of a desktop environment and after mounting
    a removable medium. For example:


    ```

    # cd /etc/xdg/autostart/

    # ls -la

    total 76

