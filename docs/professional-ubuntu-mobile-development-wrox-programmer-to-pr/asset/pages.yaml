  md: '# Chapter 13: Common Problems and Possible Solutions


    # Running Ubuntu on Arima


    Q: As a related question, what would be the difficulties of getting Ubuntu MID
    running on, for example, the Arima UM650? Is Ubuntu Mobile-specific?


    A: Ubuntu Mobile with the jaunty release has ARIMA support. Getting Ubuntu Mobile
    to work on other hardware is just a matter of getting the right kernel working.
    The linux-iapcompat kernel ought to work on i586+ machines. The C7-M, for example,
    is one of the processors for which testing has been limited, but of some interest
    as it has been deployed in a new number of devices.


    # Ubuntu Intrepid UMPC Project


    Q: I tried the Ubuntu Intrepid UMPC image on a 10-inch tablet PC and I really
    liked it. However, I cant seem to find enough official documentation about this
    project, so I was wondering if the project is still ongoing?


    A: After the initial excitement about the release, few people have actually been
    committing their changes to the repositories; at least, the UMPC is not listed
    as a target release for 9.04. That being said, there''s no good reason why couldn''t
    adjust the Intrepid ubuntu-mobile-defaults package to work with 9.04, or continue
    development. The changes are mostly adjusting settings, such as GConf or something
    theme-related.


    # Installing Ubuntu Netbook Remix on a UMPC


    Q: I just bought a device called a UMPC, can Ubuntu Netbook Remix be installed
    on UMPCs?


    A: Yes, it can be installed and works well. It helps if you increase the panel
    size for touch and there''s a GConf key that increases the button/widget sizing
    in the launcher. It''s easy to use with touchscreens (needs a restart of the launcher):


    ```

    $ gtool-2 --set /apps/netbook-launcher/tablet_mode --type boolean true

    ```


    Another useful tip is to change $your_fav_theme''s gtkrc to increase the xpadding
    and ypadding attributes for scrollbars, checkboxes, and radio buttons to make
    GNOME a bit more touchfriendly.


    # Using apt


    Q: I tried to install a package using apt but I got a message that it was not
    possible to install as a result of broken dependencies.'
