    deb and http://ianlawrence.info/downloads/debian/gypsy-lpia/gypsy0.5-1_lpia.deb.


    The bluetooth GPS device that we used was the Nokia Gypsy Module LD-3W. To communicate
    with it, you need to find out its address. Make sure bluetooth is enabled:


    ```

    $ sudo apt-get install bluetooth-utils bluetooth-gnome gnome-bluetooth

    libbluetooth2 libbtct14 libgnome2 nautilus-sendto

