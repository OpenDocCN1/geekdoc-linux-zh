    # Laptop Mode


    When laptop mode is enabled, the kernel will try to be smart about when to writes
    in order to give the disk as much time as possible in a low power state.


    Laptop-mode-tools are installed by running the following:


    ```

    $ sudo apt-get install laptop-mode-tools

