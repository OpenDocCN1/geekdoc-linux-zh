    \n# Clutter\n\nClutter is a GObject-based library for creating hardware-accelerated\
    \ graphical user interfaces. It relies upon OpenGL (1.4+) or OpenGL ES (1.1 or\
    \ 2.0) for rendering, can be compiled on different platforms (Linux, Mac OS, and\
    \ Win32) and has multiple bindings to other languages (including Python, Ruby,\
    \ and Val). It supports media playback via Gstreamer and 2D graphics rendering\
    \ using Cairo.\n\nClutter works by having a stage (a window) and adding actors\
    \ (widgets) to the stage and manipulating via the actor API. Actors can contain\
    \ child actors (ClutterGroup, for example) and be manipulated as a whole.\n\n\
    Animations and visual effects can be created using the use of timelines and behaviors.\
    \ Timelines provide accurate frame-based animations. Behavior further extend this\
    \ by taking a timeline and applying a control function (clutter.Alpha) to actors\
    \ to modify some property of the actor in respect to time."
