    # Building Your Own Image


    Actual images are the ones downloaded from cdimage.ubuntu.com are made up of a
    filesystem, which in embedded development is usually squashfs. squashfs is a compressed
    read-only filesystem that is useful when working with constrained hard drives
    and memory systems commonly found in embedded environments.


    For Ubuntu Mobile this squashfs filesystem will contain an install (for example,
    an install of Ubuntu MID as well as a kernel, an initramfs (a special instance
    of a temporary filesystem), and a syslinux install (syslinux is a boot loader).


    To create an image, it is necessary to first create a squashfs filesystem. To
    do this install livecd-roots:


    ```

    $ sudo apt-get install livecd-roots

    ```


    and then run as one of the livecd-roots scripts called livecd.sh:


    ```

    $ sudo livecd.sh -d karmic -a lpia ubuntu-mid

    ```


    The script livecd.sh is installed into the /usr/sbin/, which is in the $PATH.
    This means the script can be called from any directory without the user supplying
    the full path to it. The command above was run on Ubuntu karmic.


    This will download and then the squashfs filesystem for LPIA. It can take some
    time to download, Using a local mirror can help here:


    ```

    $ sudo livecd.sh -d karmic -a lpia -m http://localhost:9999 ubuntu-mid

    ```


    Creating a local mirror is explained in Chapter 11.


    When the download is complete, the following files and folders will be created:


    +   - chroot-livecd

    - livecd.ubuntu-mid.manifest

    - livecd.ubuntu-mid.manifest-desktop'
