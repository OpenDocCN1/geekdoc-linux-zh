    - The optimization should be based on an existing Ubuntu kernel package favor.\n\
    - The generated package should be integrated with Ubuntu as much as possible.\n\
    \nThe second method results in a Debian package. This is a better choice in a\
    \ situation that has at least one of the following requirements:\n\n+   - A Debian\
    \ package is wanted or at least enough to start with.\n- It is not a requirement\
    \ to use an Ubuntu kernel.\n- The developer thinks it's a simpler method.\n\n\
    If both methods are applicable, then the first one would be a better solution.\
    \ Although it seems obvious, it's important to mention that an OEM or user should\
    \ know the hardware specifications in order to create the customized kernel package\
    \ of running correctly on a target device.\n\n# Create an Ubuntu Package\n\nAs\
    \ mentioned earlier, this method creates an Ubuntu kernel package. The kernel\
    \ source from Ubuntu has plenty of scripts capable of generating various packages\
    \ in an automated way. Consequently, as a prerequisite to this method, the user\
    \ should get the source from Ubuntu.\n\nThere are two choices when downloading\
