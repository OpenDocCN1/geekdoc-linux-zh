  md: '# Chapter 2: The Development Environment


    To install the UMID image, a similar process to the one for the VirtualBox installation
    will be followed. Set up the .img as the second hard disk so you can install on
    the first disk. You might think of doing something like:


    ```

    $ kvm -localtime -m 512 -hda installed-mid.img -hdb ubuntu-9.04-beta-mid-lpia.img

