    # Graphical Corruption


    Q: When I install on a device I see the status bar and the installation seems
    fine, but when the desktop should appear, it looks like the device has crashed
    — all I is graphical corruption.


    A: Start Ubuntu in Safe Graphics mode. This will start Ubuntu using Vesa graphics
    drivers, which are compatible with every graphics card made within the last ten
    years.'
