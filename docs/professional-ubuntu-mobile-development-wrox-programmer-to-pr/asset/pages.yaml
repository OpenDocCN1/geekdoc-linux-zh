  md: '# # Introduction


    # # The Ubuntu Hardy Release


    During the Hardy cycle, then, there was work getting Ubuntu working on various
    devices, based on both the Menlow and McCaslin platforms from Intel:


    +   - McCaslin preceded Menlow. It contains an Intel A100/A110 processor. An example
    of a device using this processor is the Samsung Q1 Ultra.

    - Menlow is the name of the platform that contains an Intel Atom processor (codenamed
    Silverthorne and Diamondville). It uses Pulsbo Chipset (aka System Controller
    Hub). An example of a device using this is the Aigo MID. This work did not complete
    within the Hardy cycle, and continued in a PPA.

    - PPA (Personal Package Archive) is a way for developers to build and publish
    packages of their code, documentation, artwork, themes, or any other contribution
    to free software.


    This resulted in the first release of Ubuntu MID (which was some time after the
    official Ubuntu Hardy release).


    While this was targeted for 6-to-inch screen devices, most of the testing and
    the work was done on a Samsung Q1 (known as the reference device) or on somewhat
    awkward development kits.


    # # The Ubuntu Mobile Team


    Some time after the Hardy developer alpha release there were some nomenclature
    cleanups within the Ubuntu project. As a result of this, the Ubuntu Mobile and
    Embedded Ubuntu Team became the Ubuntu Mobile Team, as the goals were increasingly
    divergent from those of the Ubuntu Embedded Team and of “pure” embedded development
    itself.


    # # Netbook Remix


    Completely independently, a group of Canonical developers from the Original Equipment
    Manufacturer (OEM) team was looking at technologies to support the new “netbook”
    devices. OEM refers to companies that make products for others to repack and sell.


    Using a mix of GNOME, OpenHand code, and some of the work that went into Ubuntu
    MID, and additional development, they produced the “Netbook Remix,” loosely based
    on Ubuntu Hardy.


    The resulting Netbook Remix was released before the first release of Ubuntu MID.
    More about the reasoning and ideas behind the Netbook Remix can be found at http://www.markshuttlesworth.com/archives/151.


    > The Netbook Remix is based on Ubuntu Long Term Support (LTS) releases such as
    Hardy.'
