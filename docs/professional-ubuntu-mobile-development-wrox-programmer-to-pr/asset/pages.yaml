  md: '# Chapter 8: Kernel Fine-Tuning


    ```

    # dkms uninstall -m opensafs -v 1.4.10 -k 2.6.29-custom

    # dkms status

    opensafs, 1.4.10, 2.6.29-custom, i686: build

    opensafs, 1.4.9, 2.6.28-11-generic, i686: installed

    ```


    The dkms remove command results in changing the driver state to Out of the DKMS
    tree. After that, it''s necessary to add/build/install the driver once more:


    ```

    # remove -m opensafs -v 1.4.10 -k 2.6.29-custom

    # dkms status

    opensafs, 1.4.9, 2.6.28-11-generic, i686: installed

    ```


    It is very simple to use the DKMS framework as it is shown here. However, this
    is not all that the framework can do. In order to demonstrate this, let''s extend
    the example scenario. If the OEM has his custom kernel installed in many devices
    and it''s necessary to install the up-to-date driver in all of them? This would
    be a considerable job doing each device separately. DKMS can create a tar file
    from the build driver and load it from another device that has the same kernel.
    The package goes directly to the Build state and can be installed without the
    compilation step. It means the extra drivers do not need to handle the linux-header
    package (this is necessary only for the compilation step).


    The driver should be least in the Build state. So, for the following tests, the
    opensafs-1.4.10 driver must be compiled with the dkms build. The OEM can redo
    the step if it''s necessary. Then the tar file can be created by the following:


    ```

    # dkms mktarget -m opensafs -v 1.4.10 -k 2.6.29-custom

    Marking modules for 2.6.29-custom (i686) for archiving...

    Marking /var/lib/dkms/opensafs/1.4.10/source for archiving

    Tarball location:

    /var/lib/dkms/opensafs/1.4.10/tarball/opensafs-1.4.10-kernel2-custom-2.6.29-i686.dkms.tar.gz

    # cp /var/lib/dkms/opensafs/1.4.10/tarball/opensafs-1.4.10-kernel2-custom-2.6.29-i686.dkms.tar.gz

    ```


    The file created can be copied and be used on any other device that has the custom
    kernel installed. If the device does not have the custom kernel installed but
    the OEM wants to test the function, it can be simulated by removing the driver
    with the dkms remove command, which deletes the /usr/src/opensafs-1.4.10 directory.
    Consequently, there will be not any trace of the module in the current machine.
    The tarball loading action can be done by typing the following:


    ```

    # dkms ldtarball --archive opensafs-1.4.10-kernel2.2.6.29-custom-i686.dkms.tar.gz

    # dkms status

    opensafs, 1.4.10, 2.6.29-custom, i686: built

    opensafs, 1.4.9, 2.6.28-11-generic, i686: installed

    ```


    As you can see by the dkms status, the driver is already loaded in the Build state.
    It is necessary just to install it all to get it in the current custom kernel.'
