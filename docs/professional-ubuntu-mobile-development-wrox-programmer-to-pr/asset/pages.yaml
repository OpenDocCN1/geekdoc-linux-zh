    # Modifying Themes


    It is often necessary to customize themes, particularly when working with an OEM.
    Before doing this, you might want to read "Visual Design of the GNOME Home Interface
    Guidelines," at http://library.gnome.org/devel/hig-book/stable/, which starts
    as follows:


    Visual design is not just making your application look pretty. A well-designed
    application will make it easy for the user to understand the information that
    is presented, and show clearly how they can interact with information.


    Substitute the word "theming" for the preceding code and you should have a good
    idea about the objective of theming.


    # A Useful Tool When Working with Themes


    This bash script displays information on the current theme. It is useful to use
    when working with themes and GConf.


    First, install zenith, which is a handy suite of GTK widgets:


    ```

    $ apt-get install zenith

    ```


    Call the script that follows get_theme_info.sh and execute it . ./get_theme_info.sh
    (after making it executable):


    ```

    #!/bin/bash

    icons=$(gconftool-2 -g /desktop/gnome/interface/icon-theme)

    theme_gtk=$(gconftool-2 -g /desktop/gnome/interface/gtk-theme)

    theme_metacity=$(gconftool-2 -g /apps/metacity/general/theme)

    font_gtk=$(gconftool-2 -g /desktop/gnome/interface/font_name)

    font_meta=$(gconftool-2 -g /apps/metacity/general/titlebar_font)

    zenith=$(zenith --info-text)

    icons: $icons

    GTK theme: $theme_gtk

    metacity theme: $theme_metacity

    gfont: $font_gtk

    metacity font: $font_meta

    Professional Ubuntu Mobile Development*

    ```'
