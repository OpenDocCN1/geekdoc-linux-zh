    XSETTINGS is a mechanism on Linux that allows the configuration of settings and
    then enables these settings to be propagated across all applications at runtime.


    A simple gtkrc-2.0 file in a user''s home directory can just an include, as shown
    below:


    ```

    $ cat ~/.gtkrc-2.0

    include "/usr/share/themes/pumtheme/gtk-2.0/gtkrc"

    ```


    # Automatically Theming MID


    In the previous section, we manually themed Ubuntu MID. It is possible to automate
    this process through the use of the hilden-theme-tools package. This is installed
    using apt:


    ```

    $ sudo apt-get install hilden-theme-tools

    ```


    The package contains various tools that can be used for themming on Ubuntu MID.
    Begin by installing the subversion package


    ```

    $ sudo apt-get install subversion

    ```


    and then run the following:


    ```

    $ hilden-theme-bootstrap

    ```


    This will download a skeleton theme into the specified directory. Move it into
    the template directory and edit the template.svg as you require using an image
    editor such as GIMP.


    Make sure you select the second option, 2) hilden-theme-layout-4, as layout-3
    is not supported by MID.


    Next, to build a deb package of the theme, it is necessary to change a number
    of choices in the debian folder. In the control file, remove the dependency on
    the hilden-theme-cache. In the postinst file, remove the line above DEHELPER,
    which calls the theme utility:


    hilden-theme-cache caches the gtkrc files — it is not used by Ubuntu MID.'
