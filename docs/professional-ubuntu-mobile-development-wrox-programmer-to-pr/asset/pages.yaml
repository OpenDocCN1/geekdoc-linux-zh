  md: '# Related Wrox Books


    ISBN: 978-0-470-14762-7

    This book introduces fundamental concepts beginning with the basics of Unix programs
    in C, and includes material on basic system, file I/O, process communication (getting
    programs to work together), and shell programming. Parallel to this, the book
    introduces the toolkits and libraries for writing user interfaces, from simpler
    terminal applications to X and GTK+ for graphical user interfaces. Advanced topics
    are covered in detail, such as processes, pipes, socket programming, using MySQL,
    writing applications for the GNOME or the KDE desktop, writing device drivers,
    POSIX Threads, and kernel programming for the latest Linux Kernel.


    # Professional Linux Kernel Architecture


    ISBN: 978-0-470-34343-2

    Linux expert Wolfgang Mauer focuses on version 2.6.24 (as well as summarizing
    changes to versions 2.6.25 and 2.6.26) of the kernel as he walks through the kernel,
    underlying structures, and implementation of the Linux kernel. Keeping a close
    connection with the source code—as the components and subsystems of the kernel—this
    book reviews the VFS layer and discusses virtual filesystems and the Extended
    filesystem family and examines how the page and buffer cache speed up kernel operations.


    # Professional Linux Programming


    ISBN: 978-0-471-77613-0

    Professional Linux Programming looks at the different development environments
    within Linux—the kernel, the desktop, and the web—and and then demonstrates best
    practices, tools, and techniques for integrating applications with the OS as a
    whole. This book is essential for understanding the nuances that differentiate
    Linux programming for Linux programming from any other platform. After beginning
    with simple shell scripts, the reader quickly moves on to more advanced topics
    like software drivers and the graphical interface.'
  merge: -1
