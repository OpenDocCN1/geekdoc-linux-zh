  md: "# Chapter 9: Testing and Usability\n\n# Linux Standards Base and Certification\n\
    \nThe LSB Application Testkit (ATK) contains tools for analyzing dependencies\
    \ (libraries and interfaces that are required externally) of application packages.\
    \ In particular, ATK helps developers test their applications for LSB compliance,\
    \ and enables easy steps for LSB certification.\n\n# Installing the LSB Application\
    \ Testkit\n\nFirst, download the toolkit from http://www.linuxfoundation.org/en/Downloads.\
    \ Next, run the install.sh script in the unpacked directory. The script asks a\
    \ couple of questions, and installs the packages using dpkg:\n\n> This system\
    \ appears to be a variant of Debian GNU/Linux, such as Debian itself, Ubuntu,\
    \ MEPIS, Xandros, Linspire, etc.\n this correct?\nIn order to install these packages,\
    \ you need administrator privileges. You are currently running this script as\
    \ an unprivileged user.\nYou have sudo available. Should I use yes?\nUsing the\
    \ command `/bin/sh -c` to gain root access. Please type the appropriate password\
    \ if prompted.\nInstalling packages...\n\n# Running the LSB Application Testkit\n\
    \nThe toolkit installs /opt/lsb/app-testkit/manager; to start the web interface,\
    \ run /opt/lsb/app-testkit/manager/bin/lsb-atk-test .8080 and then browse to http://127.0.0.1:8080.\n\
    \nThis will display the test suite that's running in Figure 9-5.\n\n![](img/20e1447b223c3f9afa3d43610c6361ee_231_0.png)\n\
    \nFigure 9-5"
