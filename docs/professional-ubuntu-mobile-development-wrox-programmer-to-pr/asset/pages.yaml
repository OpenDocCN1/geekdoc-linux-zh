  md: '# Chapter 4: Application Development


    This "event loop" is started by calling the function gtk_main(); which starts
    up the event loop, details of which are hidden from the user. GTK is an event-driven
    toolkit, which means it will sleep in gtk_main(); until an event occurs and is
    passed to the appropriate function. This passing of control is done using the
    idea of "signals".


    # Signals


    Signals are processed by attaching a "callback" to a given signal for any particular
    object (widget). For example, creating a new button


    ```

    button = gtk.Button()

    ```


    a callback function to detect when a button is pressed can be set up by calling:


    ```

    button.connect("clicked", self.callback, "a button")

    ```


    which connects the "clicked" signal of the button to a callback.


    The use of signals can also be seen in the "Putting All Concepts Together" section
    later in this chapter. The first two lines of code below detect when a device
    is mounted, and then signals are created that drive mounting. The final three
    lines connect to the signals already created.


    ```

    self.connect("activate", self._on_activate_event)

    self.connect("popup-mem", self._on_popup_menu_event)


    # add a signal to detect when a cd is inserted into the drive

    object.signal_new(\''device-is-optical-disc'', gtk.StatusIcon,

    gobject.SIGNAL_RUN_LAST, object.TYPE_NONE, (object.TYPE_BOOLEAN))

    # add a signal to detect when a device is mounted, so that an action can be

    # performed after that

    object.signal_new(\''device-mounted'', gtk.StatusIcon,

    object.SIGNAL_RUN_LAST, object.TYPE_NONE, (object.TYPE_STRING,))

    object.signal_new(\''device-unmounted'', gtk.StatusIcon,

    object.SIGNAL_RUN_LAST, object.TYPE_NONE, (object.TYPE_STRING,))

    ```


    Here are the method signatures


    ```

    def _on_optical_disc_insert_event(self, status_icon, device, status):


    def _on_device_mounted_event(self, status_icon, device):


    def _on_device_unmounted_event(self, status_icon, device):


    def _on_activate_event(self, status_icon):


    def _on_popup_menu_event(self, status_icon, button, activate_time):

    ```'
