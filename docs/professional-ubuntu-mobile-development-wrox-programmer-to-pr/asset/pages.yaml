  md: '# Appendix B: Git Usage


    This is a rather slow operation as it has to check whether you unreachable objects,
    dangling objects amongst other common errors. Upon running this command, you might
    see something like the following:


    ```

    dangling tree b47648f75aa0ae20c9508bdd6efe0bb2da1c6

    dangling tree 2eedf3560f4d043b0047f5ceb5bc5f163841e5

    ```


    This means that if you have two tree objects (or dangling objects that aren''t
    used) you could remove from your repository. Remember that dangling objects are
    not a problem; they often appear in a repository, especially if you reuse your
    commits frequently.


    # Housekeeping a Repository


    It''s important to keep your repository clean; this will help git do its job faster.
    Here you look at how to remove loose objects, re-create git''s packs, and remove
    the unnecessary ones. Start by running the following:


    ```

    $ git gc

    ```


    gc does its best to keep your repository, and remove loose objects and unused
    packs. However, for sanity housekeeping only, git doesn''t have to be too aggressive
    if so. That''s when you want to use the following commands:


    ```

    $ git repack

    ```


    With proper options, you can tell git repack to get all your objects and, instead
    of creating an incremental pack with the delta, create only one pack with all
    your objects. This will save a considerable amount of disk space and help git
    work a bit faster. To achieve this, you can use git repack -a -f -d.


    The command git-prune will prune (remove) all unused loose objects from your repository.
    In other words, all loose objects already contained in a pack will be purged.


    ```

    $ git prune

    ```


    Similar to git prune, the command prune-packed will remove unused packs from your
    repository.


    ```

    $ git prune-packed

    ```


    There''s not much to say about this command. You can use -n to check the packs
    that will be removed and -q to suppress the progress indicator.


