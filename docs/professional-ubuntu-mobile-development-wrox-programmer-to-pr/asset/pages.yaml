  md: '# Chapter 6: Application Selection


    # Social Network Users


    This market segment is sometimes referred to by marketers as Generation Y (Gen
    Y) (this is a succession from the term Generation X, which was made popular by
    the novel of the same name) and it is generally understood to refer to people
    born in the early 1980s and 1990s.


    This is evidently a large market and is consequently of considerable interest
    to device manufacturers and ISVs.


    People in this segment are comfortable with the Internet, particularly within
    social networks such as Facebook, Twitter, and MySpace. A survey of 707 college
    students in the United States, undertaken by Reyn Junco and Jeanna Mastrostica
    for their book Connecting to the Net.Generation: What higher education professionals
    need to know today''s students), shows that a key motivator is peer recognition.
    Other interesting points from this survey are:


    +   - 97% own a computer.

    - 97% have downloaded music and other media using peer-to-peer sharing.

    - 94% own a mobile phone.

    - 76% use IM and social networking sites.

    - 75% of college students have a Facebook account.

    - 60% use some type of portable mobile and/video device such as an iPod.

    - 49% regularly download music and other media using peer-to-peer sharing.

    - 34% use author a blog and 44% read blogs.

    - 15% of IM users are logged on 24 hours a day, 7 days a week.


    Consequently, areas considered important for this market segment are branding,
    content, and device design.


