  md: '# Chapter 5: Application Packaging


    # PBuilder


    While it is possible to build packages the way we have shown earlier, you must
    already have all the build dependencies of the package that you are building installed
    on your running system.


    A tool called pbuilder can help you with this. pbuilder checks the build dependencies
    automatically and it does because the package is built within a minimal Ubuntu
    install with the build dependencies downloaded according to the Debian/control
    file.


    The primary aim of pbuilder is different from other auto-building systems in Debian
    in that it does not try to build as many packages as possible. It does not guess
    what a package needs, and in most cases it tries the worst choice of all if there
    is a choice to be made.


    # Configuring PBuilder


    It can be a good idea to configure pbuilder. There are many ways to do this. In
    /etc directory is the main configuration file for pbuilder called pbuilderrc.


    Edit this list to follow as:


    ```

    BASEGTZ=/var/cache/pbuilder/base.tgz

    #EXTRAPACKAGES=gcc3.0-athlon-builder

    #export DEBIAN_BUILDARCH=athlon

    BUILDPLACE=/var/cache/pbuilder/build/

    MIRRORSITE=http://archive.ubuntu.com/ubuntu

    USEPROC=yes

    USEDEVOPTS=yes

    USEDEVS=no

    BUILDDIR=/var/cache/pbuilder/result/

    # specifying the distribution forces the distribution on "pbuilder update"

    DISTRIBUTION=jaunty

    # specifying the components of the distribution (is "main")

    #COMPONENTS=restricted universe multiverse

    # specifying the cache for apt

    APTCACHE=/var/cache/pbuilder/aptcache/

    APTCACHEHARDLINE=yes

    REMOVEPACKAGES=

    #HOOKDIR=/usr/lib/pbuilder/hooks

    HOOKDIR==

    # make debuild not interact with user

    export DEBIAN_FRONTEND="noninteractive"

    DEBEMAIL=yes

    # for pbuilder debuild (sudo - keeps the environment as-is)

    BUILDSOURCEOPCMD=-fakeroot

    PBUILDEROPTOCMD=sudo-

    # to satisfy build-dependencies; the default is an internal shell

    # implementation which is relatively slow; there are two alternate

    # implementations, the "experimental" implementation,

    # pbuilder-satisfydepends-experimental, which might be useful to pull

    # packages from experimental or from repositories with a low Apt Priority,

    # and the "aptitude" implementation, which will resolve build-dependencies and

    # build-conflicts apt which helps dealing with complex cases but does

    ```'
