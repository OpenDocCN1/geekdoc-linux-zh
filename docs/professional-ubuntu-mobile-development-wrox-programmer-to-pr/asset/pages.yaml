  md: '# Appendix E: D-Bus: An Overview


    method name, and convert the method call into an invocation of a method on a native
    object (Object, java.lang.Object, QObject, and so on), and then convert the return
    value from the native method into a bus message reply.


    +   7. The bus daemon receives the method reply and sends it to the process that
    made the method call.


    +   8. The process that made the method call looks at the method reply and makes
    use of any return values included in the reply. The reply may also indicate that
    an error occurred. When using a binding, the method reply may be converted into
    the return value of a proxy method, or into an exception.


    +   9. The bus daemon reorders messages. That is, if you send two method calls
    to the same recipient, they will be received in the order they were sent. The
    recipient is not required to reply to the calls in order, however; for example,
    it may process each call in a separate thread, and return messages in an undefined
    order ordering when the threads complete. Method calls have a unique serial number
    by the method caller to match reply messages to calls.


    # Emitting a Signal: Behind the Scenes


    A signal in D-Bus consists of a single message, sent by one process to any number
    of other processes. That is, it is a unidirectional broadcast. The signal may
    carry arguments (a data payload), but because it is a broadcast, it never has
    a "return value." Contrast this with a method call where the method call has a
    matching method message reply.


    The emitter (aka sender) of a signal has no knowledge of the signal recipients.
    Recipients register with the bus daemon to receive signals based on "match rules"
    — these rules would be updated by the sender and the signal name. The bus daemon
    sends each signal to recipients who have expressed interest in that signal.


    The process of emitting a signal in D-Bus occurs in the following manner:


    +   1. A signal is created and sent to the bus daemon. When the low-level API
    this can be done manually; with certain bindings it may be done for you by binding
    a native object emits a native signal or event.


    +   2. The signal message contains the name of the interface that specifies the
    signal, the name of the signal, the bus name of the process sending signal, and
    any arguments.


    +   3. Any process on the bus can register "match rules" indicating which signals
    it is interested in. The bus has a list of registered match rules.


    +   4. The bus daemon examines the signal and determines which processes are interested
    in it. It sends the signal to these processes.


    Each process receiving the signal decides what to do with it; if using a binding,
    the binding may choose to emit a native signal on a proxy object. If using the
    low-level API, the process may just look at the signal sender and name, and decide
    what to do based on what it sees.'
