    00:02:76:C5:58:B2 Nokia LD-3W

    ```


    This returns the address of the GPS device: 00:02:76:C5:58:B2.


    # Interaction with the Gypsy Daemon


    The code to interact with the gypsy daemon (gypsy.py) and show its status (status.py)
    was written by Rust Burton and licensed LGPL and GPL. It can be checked out by
    running the following:


