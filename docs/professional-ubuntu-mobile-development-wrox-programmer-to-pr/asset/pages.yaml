    # Desktop Application Autostart Specification


    Applications will be auto-started if a desktop file is placed in an autostart
    directory. The system wide setting for this (the variable XDG_CONFIG_DIR) is,
    by default, /etc/xdg/autostart/. The user setting for this (the variable $XDG_CONFIG_HOME)
    is, by default, ~/.config/autostart/.


    Applications will be started after a user logs in.


    # XDG Base Directory Specification


    This specifies where files should be located in relation to a base directory.
    For a user''s data is specified in the environment variable XDG_DATA_HOME, and
    for a user''s configuration files in the environment variable $XDG_CONFIG_HOME.


    The default value for $XDG_DATA_HOME is $HOME/.local/share, and for $XDG_CONFIG_HOME
    is $HOME/.config.


    Similarly, a preference-ordered base directory relative to which configuration
    files should be searched by the environment variable $XDG_CONFIG_DIRS.


    > This specification also defines directories relative to what data should be
    cached, $XDG_DATA_DIRS, and relative to which non essential data should be cached,
    $XDG_CACHE_HOME.


    # Desktop Menu Specification


    This can be thought of as an XML configuration file with the extension .menu,
    which defines the layout of menu items (.desktop files) and whether these items
    should be displayed in the menu. The menu file is located by default


    ```

    $XDG_CONFIG_DIRS/menu/$XDG_MENU_PREFIX)applications.menu

    ```


    with the $XDG_MENU_PREFIX variable meaning that a user''s menu can override (or
    be merged) with a system menu. The desktop files are located in $XDG_DATA_DIRS/applications/
    by default.


    This specification adds the fields Categories, OnlyShowInNotShow to the Entry
    Specification described above. Categories is a way to group menu items, OnlyShowIn
    is a way to make items only appear in specific environments, and NotShowIn the
    reverse.


