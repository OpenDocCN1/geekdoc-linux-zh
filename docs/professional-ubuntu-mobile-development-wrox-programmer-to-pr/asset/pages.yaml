  md: '# KVM/QEMU


    KVM (for Kernel Virtual Machine) is a full virtualization solution for Linux.
    It consists of a loadable kernel module, kvm.ko, which provides the core virtualization
    infrastructure and a processor-specific kernel, kvm-intel.ko or kvm-amd.ko. It
    relies on Intel VT or AMD-V hardware and it is a full virtualization for Linux.


    KVM is intended for systems where the processor has hardware support for virtualization.
    To check this on a system, run the following command:


    ```

    $ egrep --color=auto ''(vmx|svm)'' /proc/cpuinfo

    ```


    If vmx or svm is displayed in the output, the hardware (CPU) will support KVM.
    Nothing is printed in the terminal, it means the CPU does not support virtualization.


    Often hardware support needs to be specifically enabled in the BIOS — as was the
    case for the Lenovo Thinkpad X60s.


    If not printed, KVM falls back to the slower QEMU-based software virtualization.
    QEMU is also used for virtualization of other architectures such as ARM. This
    is explained later in this chapter.


    # Using QEMU


    To use QEMU, install the necessary packages:


    ```

    $ sudo apt-get install qemu kgemu-common kgemu-source

    ```


    Add your user name to the kgemu group. Adding your name to the kgemu group means
    that you do not need to run QEMU as the root user.


    kgemu is the name of the module that is used to accelerate QEMU.


    To add your user name, run:


    ```

    $ sudo adduser <username> kgemu

    ```


    To make these changes effective, it is necessary to log out and then log back
    in. To test QEMU, go to the folder that contains the image you downloaded from
    http://cdimage.ubuntu.com and run the following:


    ```

    $ qemu -localtime -m 384 -boot ubuntu-9.04-beta-mid-lpia.img

    ```


    Substitute the .img name for the one that you downloaded, if different from the
    one above.


    To enable the kgemu acceleration mode, it is necessary to pass the parameter -kernel-kgemu
    -kgemu like this:


    ```

    $ qemu-kernel-kgemu -localtime -m 384 -boot ubuntu-9.04-beta-mid-lpia.img

    ```'
