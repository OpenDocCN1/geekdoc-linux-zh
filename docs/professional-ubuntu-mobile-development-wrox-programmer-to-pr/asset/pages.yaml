    - livecd.ubuntu-mid.nitrd

    - livecd.ubuntu-mid.nitrd-lpia

    - livecd.ubuntu-mid.kernel

    - livecd.ubuntu-mid.kernel-lpia


    Now it is possible to use one of the scripts (create-image.sh) from mobile-scripts
    to actually create the image.


    Make sure script is in the same folder as the files and folders mentioned and
    that it has the executable permission bit set:


    ```

    $ chmod +x create-image.sh

    $ /create-image.sh ubuntu-mid 40

    ```


    where ubuntu-mid (LPIA) is the distribution to be built and 40 is the extra space
    in MB to be allocated in the image for installing extra packages and other customizations
    that may be required.


    The edit_squashfs.sh script (shown next) can also be used to alter the size of
    an image.


    The built image is tested now in KVM/QEMU:


    ```

    $ kvm -localtime -m 512 -hda ubuntu-mid.img

    ```


    # # Installing Applications inside the Image


    The script edit_squashfs.sh from mobile spawns a root shell inside the image that
    was just built in the previous section. It is then to run apt-get update and install
    packages. On exiting the shell with Ctrl+D the exit command, the script will offer
    to re-roll the squashfs for you.


    The script is used like this:


    ```

    $ sudo ./edit_squashfs.sh ubuntu-mid.img

    ```


    It is a good idea to run apt-get clean inside the chroot and before exiting it
    to clean up space in the /var/cache/apt/archives directory. The preceding script
    shows this. This is because space is a premium. Another idea is also to install
    deorphan or gtorkian in order to remove unused programs and libraries that are
    taking up space (apt-get install deorphan).


    The space available to install new applications/packages is what was specified
    in the create-image.sh command (40MB). If this needs to be increased, use the
    grow_image.sh script discussed next.'
