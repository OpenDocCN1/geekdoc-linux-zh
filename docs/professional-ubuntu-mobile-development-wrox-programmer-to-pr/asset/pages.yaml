  md: '# Chapter 13: Common Problems and Possible Solutions


    # Poor Performance


    Q: I installed Ubuntu Remix on an Ee PC and the performance is very poor. I installed
    the default Ubuntu Jaunty to test and performance was much improved.


    A: This is due to a video driver bug, which means that tiling is not enabled by
    default (this is essential for Ubuntu Network Remix as the launcher is based on
    GL). A fix has been made and can be found at http://people.ubuntu.com/~apw/lp349314-jaunty/


    The files to install are linux-headers-2.6.28-11-generic_2.6.28-11.43~lp349314apw5_i386.deb
    and linux-image-2.6.28-11-generic_2.6.28-11.43~lp349314apw5_i386.deb. Download
    both of them into a folder and install them by running the following:


    ```

    $ dpkg -i *.deb

    ```


    This information may be wrong by the time this book is published. Please check
    on the mailing list for the latest details.


