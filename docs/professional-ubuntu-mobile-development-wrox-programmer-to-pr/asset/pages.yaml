    \ In order to have the latest Ubuntu kernel source, you need to get it from the\
    \ Ubuntu repository. In general, the source from a deb repository will not be\
    \ as up-to-date as a git repository. So, we first demonstrate the method of getting\
    \ the source from git and then we cover the use of a deb repository. However,\
    \ before starting the process, it is necessary to install some dependencies:\n\
    \n```\n$ sudo apt-get update\n$ sudo apt-get install git-core fakeroot makedumpfile\
    \ kernel-wedge\n$ sudo apt-get install libcurses5-dev build-essential\n$ sudo\
    \ apt-get build-dep linux\n```\n\nNow, clone the Ubuntu kernel tree:\n\n```\n\
    $ git clone http://kernel.ubuntu.com/ubuntu/ubuntu-jaunta.git \\\n  ubuntu-jaunta.git\n\
    $ cd ubuntu-jaunta.git/\n```\n\nThe first step is to add the new flavor to the\
