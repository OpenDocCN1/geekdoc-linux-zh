  md: '# Chapter 4: Application Development


    # D-Bus Send


    D-Bus Send is used to send a message to a D-Bus message bus. Nearly all users
    must provide the --argument, which is the name of a connection to the bus to send
    the message. It can be used, for example, on the command-line to send Rhythmbox
    to the next track, as follows:


    ```

    dbus-send --dest=''org.gnome.Rhythmbox'' /org/gnome/Rhythmbox/Player org.gnome.

    Rhythmbox.Player.next

    ```


    # D-Bus Monitor


    The dbusmonitor command is used to monitor messages going through a D-Bus message
    bus. It has two different output modes, the "classic-style" monitoring mode and
    profiling mode. The profiling format is a compact format with a single line per
    message and microsecond-resolution information:


    ```

    $ dbus-monitor --profile

    ```


