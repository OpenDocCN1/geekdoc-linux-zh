    # Building a Customized Ubuntu Image


    It is possible to build a customized Ubuntu image (with whatever selection of
    packages and configuration is appropriate to your target users). The only limits
    to what can be achieved are your imagination and the time required to try out
    the different combinations of applications and configurations. For this, it is
    necessary to understand how seeds and generate the program work.


    There are many packages in the Ubuntu archive, and Canonical needs support the
    ones it selects to enter into a release for at least 18 months. Keeping track
    of all these packages would become unmanageable but this is important as Canonical
    is offering commercial support for some not all of these packages. Because of
    this, the Ubuntu developers created a system of seeds that are'
