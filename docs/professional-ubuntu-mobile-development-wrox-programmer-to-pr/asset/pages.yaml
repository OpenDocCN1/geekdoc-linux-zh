  md: '# Git Usage


    Git is a distributed SCM (Source Code Management) System that was written by Linus
    Torvalds in 2005 to follow the development of the Linux kernel. Since then, it
    has been developed by a rather large group of hackers around the world.


    Intended to be used in a distributed environment, git is really good for sharing
    work in a group of developers no matter what the group''s size or geographical
    location. It''s optimized for merging code from other developers into your repository.


    So that you can understand git as quickly as possible, we have organized this
    appendix according to the kind of project for which it might be used. beside git
    commands are used, which are necessary for a developer to play a role in the project.


    First, the basic repository commands from git — clone, init, fsck, and gc — are
    used, and then commands that are necessary to work with git as an individual developer
    in a standalone project are shown. Finally, commands that are useful for a multi-person
    project are demonstrated with different roles: contributor, maintainer, and integrator.


    # How Git Works


    Git has three different objects that it uses to describe the whole project: blob,
    tree, and changeset. Each of these objects is used for a different purpose, but
    all are involved in tracking the content modifications in your project.


    # Blob Object


    A blob is just a binary blob of data and doesn''t refer to anything. The only
    data verification done in the blob that it is indexed by SHA1 hash and besides,
    that has no attributes — no name associations, no permissions. It''s a pure blob
    of data that can be translated into file contents.'
  merge: -1
  pgno: 312
- img_proc: true
  md: '# Appendix B: Git Usage


    # Tree Object


    The tree object is defined by a list of permission, name, and blob data sorted
    by name. This means that two identical separate tree objects will share (or point
    to) the same blobs. This gives you a really interesting feature in git for tracking
    file renames. We don''t really mess with the data anyhow, just point to via a
    different path — or a different tree object.


    # Changeset Object


    The changeset object introduces the notion of history into a git repository. It
    doesn''t merely give you the physical state of the tree, but also describes how
    and why you got to that particular state. A changeset is defined by the tree that
    it results in, its parent changesets (zero or more) that took the source code
    up to that point, and a human readable comment on what happened.


    # How Git Objects Relate to Each Other


    It''s simple to understand git if you understand how these three types of objects
    relate to one another. Figure B-1 shows how git works and how it tracks the contents
    of your source code.


    ![](img/20e1447b223c3f9afa3d43610c6361ee_313_0.png)


    # Basic Repository Commands


    Before you can actually start using git, you need to have a repository to work
    with. If you''re starting a standalone project, you will initialize an empty repository
    and add source code to it as you develop; on the other hand, if you''re working
    on a pre-existing repository, you need to clone that in order to have a local
    copy to work with.'
  merge: -1
  pgno: 313
- img_proc: true
  md: 'Also, it''s important to keep your repository clean and free of errors so you
    don''t lose data while working on it. The last two commands in this sentence are
    useful for housekeeping your git repository.


    # # Creating a New Repository


    If you want to start a new project from scratch, use the git command init. This
    command creates a .git directory in the directory you are in. That will be the
    start of a project.


    ```

    $ mkdir -p projects/my_first_project

    $ cd projects/my_first_project

    $ git init

    Initialized empty Git repository in /home/projects/my_first_project/

    ```


    If you take a look at .git directory, you will see a bunch of directories and
    files that git uses to track the content of your project. Yes, that''s right,
    git tracks content only, not files. This means that when you move or rename a
    file, for git it doesn''t matter— points to the same content via a path that it
    is, or, in other words, the tree object has a different way to reach the blob
    object.


    # # Cloning an Existing Repository


    You might want to collaborate with an existing project. In that case, you would
    have to clone the main tree of that project and start working on it. In that situation
    you could use the following:


    ```

    $ mkdir -p projects/

    $ cd projects

    $ git clone://<url>/path/to/project.git

    ```


    For a real-life example, you could clone the Linux kernel tree from Linus Torvalds
    with the following command:


    ```

    $ git clone git.kernel:pub/scm/linux/kernel/git/torvalds/linux-2.6.git

    ```


    Cloning will literally make a local copy of the remote repository, meaning you
    will have the complete history of that project available for you. You can work
    offline, commit to your local copy, generate diffs, check out older code, create
    branches, anything.


    Because git is to be a distributed SCM, it''s natural that you can do all that
    work on a local copy of the mainline remote repository. Without this freedom,
    it would be impossible to have a real distributed SCM.


    # # Checking Repository for Errors


    It seems inevitable that filesystems get corrupted. You can try to avoid such
    corruption by checking your repository''s health with the following:


    ```

    $ git fsck

    ```'
