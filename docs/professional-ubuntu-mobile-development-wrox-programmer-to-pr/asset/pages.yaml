  md: '# D-Bus: An Overview


    This is a condensed version of the canonical D-Bus tutorial at http://dbus.freedesktop.org/doc/dbus-tutorial.html,
    which was written by Havoc Pennington, David Wheeler, John Palmieri and Colin
    Walters.


    D-Bus is a system for interprocess communication (IPC). Architecturally, it has
    several layers:


    +   - A library, libus, allows two applications to connect to each other and exchange
    messages.


    +   - A message bus daemon executable, built on libus that multiple applications
    can connect. The daemon can route messages from one application to zero or more
    other applications.


    +   - Wrapper libraries or bindings based on particular application frameworks
    — for example, dbus-glib and dbus-qt. There are bindings to languages such as
    Python. These wrapper libraries are the API most people should use, as they simplify
    the details of D-Bus programming. libdb is intended to be a low-level backend
    for the higher level bindings. The dbus API is useful only for bus implementation.


    libus supports one-to-one connections, just like a raw network socket. However
    rather than sending bytes over the connection, you send messages. Messages have
    a header identifying the kind of message, and a body containing a data payload.
    libus abstracts the exact transport used (sockets versus whatever else), and details
    such as authentication.


    The bus daemon forms the hub of a wheel. Each spoke of the wheel is a one-to-one
    connection to an application using libdbus. An application sends a message to
    the bus daemon over its spike, and the bus daemon forwards the message to other
    connected applications as appropriate. Think of the daemon as a router.


    The bus daemon has multiple instances on a typical computer. The first instance
    is a machineglobal singleton, that is, a system daemon similar to sendmail or
    Apache. This instance has heavy security restrictions on what messages it will
    accept, and is used for system-wide communication.'
  merge: -1
  pgno: 332
- img_proc: true
  md: "# Appendix E: D-Bus: An Overview\n\nThe other instances are created per one\
    \ user login session. These instances allow applications in the\nuser’s session\
    \ to communicate with one another.\n\nThe system-wide and per-user daemons are\
    \ separate. Normal within-session IPC does not involve the\nsystem-wide message\
    \ bus process and vice versa.\n\n# D-Bus Applications\n\nD-Bus is designed for\
    \ two specific cases:\n\n+   Communication between desktop applications in the\
    \ same desktop session; to allow integration\nof the desktop session as a whole,\
    \ and address issues of process lifecycle (When desktop\ncomponents start and\
    \ stop?)\n\n+   Communication between the desktop session and the operating system,\
    \ where the operating\nsystem would typically include the kernel and any system\
    \ daemons or processes\n\nFor the within-desktop-use case, the GNOME and KDE desktops\
    \ have significant previous\nexperience with different IPC solutions such as CORBA\
    \ and DBCO. D-Bus is built on that experience and\ntailored to meet the needs\
    \ of these desktop projects.\n\nThe problem solved by the system-wide or communication-with-the-OS\
    \ case is best explained by the\nfollowing from the Linux Hotplug project:\n\n\
    > A gap in current Linux support that policies with any sort of dynamic “interact\
    \ with user” component\nare currently sourced. For example, that’s often needed\
    \ the first time a network adapter or printer is\nconnected, and to connect appropriate\
    \ places to mount disk drives. It would seem that such actions could\be supported\
    \ for any case where a responsible human can be identified: single user workstations,\
    \ or any\nsystem which is remotely administered.\n\n> This is a classic “remote\
    \ sysadmin” problem, where in case hotplugging needs to deliver an event\nfrom\
    \ security domain (operating system kernel) has one to another (for a logged-in\
    \ user,\nor remote sysadmin). Any effective response must go the other way: the\
    \ remote domain taking\naction lets the kernel expose the desired capabilities.\
    \ (The action can be taken\nasynchronously—for example, letting new hardware be\
    \ idle until a meeting finishes.) At this writing,\nLinux have never widely adopted\
    \ solutions to such problems. However, the new D-Bus may\nbegin to solve that\
    \ problem.\n\nD-Bus might be useful for purposes other than the one which it was\
    \ designed (Figure E-1).\nGeneral properties that distinguish it from other forms\
    \ of IPC are:\n\n+   Binary protocol to be used asynchronously (similar in spirit\
    \ to the X Window System\nprotocol).\n\n+   Stateful, reliable connections open\
    \ over time.\n\n+   The message bus is a daemon, not a “swarm” or distributed\
    \ architecture.\n\n+   Many implementation and deployment issues are specified\
    \ rather than left ambiguous-\nconfigurable/pluggable."
