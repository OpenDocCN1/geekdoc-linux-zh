  md: '# Chapter 2: The Development Environment


    # Networking in KVM/QEMU


    The default virtual network connection with KVM/QEMU is usermode networking. Usermode
    networking makes the virtual machine behave as it were behind a firewall that
    blocks all connections (the only "pingable" is the address DHCP server/firewall
    on 10.0.2.2). What this means in practice is that, by default, the guest computer
    has access to the outside network, but you cannot access the host machine.


    To override usermode networking in order to enable access to the host, start KVM
    like this:


    ```

    $ kvm -hda installed-mid.img -n 1024M -redir tcp:2222::22

    ```


    On the host, enter the following:


    ```

    $ ssh -l <username> -p 2222 localhost

    ```


    # Advanced Networking on VirtualBox and KVM/QEMU


    If it is a requirement to have the virtual machine with full network support or
    if many virtual machines will be running on the host, it is necessary to set up
    bridging and a switch to connect the host and the guest.


    > The following configuration can be used for advanced networking with both VirtualBox
    and KVM/QEMU.


    First, install vde2 dnsmasq on the host:


    ```

    $ sudo apt-get install vde2 dnsmasq

    ```


    VDE is a virtual switch that can connect multiple virtual machines/interfaces
    on the host. The name qap0 on the host can be chosen anything you like, as it
    is a virtual connection and does not really exist on the hardware. Likewise, 172.122.120.1
    address has been chosen because it is uncommon and less likely to conflict with
    any other network to which you are connecting.


    ```

    auto qap0

    iface qap0 inet static

    address 172.122.120.1

    netmask 255.255.255.0

    vde2-switch-\npost-up /etc/init.d/dnsmasq start

    # Allowing access to the network

    post-up /sbin/sysctl -w net.ipv4.ip_forward=1

    # assuming that the interface on the host is connected to eth0

    post-up /sbin/iptables -t nat -A PREROUTING -o wlan0 -j MASQUERADE

    ```


    26


    www-it-ebook.info'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# # Chapter 2: The Development Environment


    # Closing access to the network

    post-down /etc/init.d/dnsmasq stop

    post-down /sbin/sysctl -w net.ipv4.ip_forward=0

    post-down /sbin/iptables -t nat -F


    The following actions are as pre-up, which will be undertaken by the network configuration
    and before the interface is enabled. To see more options that can be added into
    this file looking at:


    +   $ man interfaces


    Next, you set the DNS and caching server. To do this, edit the dnsmasq config
    file that''s found in /etc/dnsmasq.conf and find the interface (line 85):


    ```

    #interface=

    ```


    Change this to


    ```

    interface=qtap0

