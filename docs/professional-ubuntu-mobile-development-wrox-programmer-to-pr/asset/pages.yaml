    # Other Toolkits


    If the new application is being written for a device without a touchscreen or
    one that will run a distribution as Ubuntu Netbook Remix, then it is possible
    to use GTK as a framework.


    GTK+ is a toolkit designed to facilitate the development of applications using
    a standard graphics interface. It was created as a tool used in the development
    of The GIMP, a graphics design package — GTK stands for “GIMP Toolkit.”


    It is useful for producing far more than just The GIMP, however, and has been
    applied to almost every kind of GUI application imaginable.


    A GTK event handles requests by introducing an “event loop”, which is a stack
    of the various inputs the user provides, as keystrokes and mouse clicks, and provides
    a set of handling functions define what action to take when interaction is received.
    When the program is run, the handling functions are set up and the loop is started,
    and keeps running until a “quit” event is processed (for example, when the “Exit”
    entry in a menu is pulled down and selected).'
