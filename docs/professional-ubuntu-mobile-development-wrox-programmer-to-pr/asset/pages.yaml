  md: '# Application Development


    The intention of this chapter is not to show how to program in any specific language
    or how to use any particular graphical toolkit. Rather, the aim is to show, through
    the use of examples, how to develop small, useful applications that demonstrate
    key concepts and techniques. Such an approach is, we believe, useful for a developer
    when more complex applications need to be developed.


    Like the author of the Debian New Maintainers Guide, we believe in the Latin saying
    Longum iter est per pracepta, breve et effica per exempl! (It''s a long way by
    the rules, but short and efficient with examples!) This chapter and the book in
    general follow this advice.


    Mobile Internet Devices, tablets and notebooks need a desktop framework that can
    provide a way to create applications with a very consistent look and feel, and
    run and interface nicely using the restricted resources for mobile devices. In
    addition, applications should be designed for touchscreen with finger-friendly
    navigation. All of factors provide challenges to a developer.


    This chapter begins by discussing issues related to the design and layout of applications
    on small form factors. It then looks at GTK, which is a toolkit for building graphical
    applications, and briefly other toolkits that can be used in the mobile and embedded
    space such as EFL. In the context of GNOME Mobile, two application frameworks
    are prominent; Hildon and Clutter and example applications are provided for each
    of these. It now shows the use of D-Bus, a technology which is important for inter-process
    communication and is crucial to the new notifications system on Ubuntu.


    Finally, all the concepts presented so far in the chapter are brought together
    in an example application demonstrates the use of many of the key technologies
    a developer should know in order to become productive with Ubuntu Mobile.'
