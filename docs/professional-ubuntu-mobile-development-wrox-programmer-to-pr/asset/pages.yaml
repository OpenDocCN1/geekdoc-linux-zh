    # Inside the DKMS Framework


    The DKMS has some commands to export its usability to the userland. But before
    we demonstrate them, it''s important to show how this framework works internally.


    > “Userland” refers to any code that''s outside the kernel.


    DKMS has its own modules tree. Every module needs to be added to that tree before
    being built and properly installed. The four valid states a module can be in are
    follows:


    +   - Out of DKMS tree


    +   - Added to DKMS tree


    +   - Built


    +   - Installed


    The desired module needs to reside in the /usr/src path inside the <module>-<version>/
    directory. That is the place where the framework will look for the modules. The
    module must have a dkms.conf file properly configured. This configuration file
    should be provided by whoever is delivering the driver with DKMS framework support.


