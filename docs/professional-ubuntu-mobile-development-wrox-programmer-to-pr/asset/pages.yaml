    # Creating a New Application


    OEMs will want to significantly customize the interface of a device as well as
    the range of default applications presented to their users "out-of-the-box." This
    may require applications to be developed if the required functionality does not
    currently exist in the Ubuntu repositories. In addition to following a user-driven
    development process and choosing the development methodology (Scrum is highly
    recommended) there are some other key considerations when developing for mobile
    devices.


    # Application Design


    The most important thing to consider when developing for mobile devices is the
    reduction in screen area when compared with a regular desktop. With this in mind
    the Ubuntu Developer Sprint in Boston, the mobile team brainstormed some key points
    to consider when working in this environment:


    +   - Screens and dialogs fit onscreen. This is normally 800 × 480.


    +   - Applications with multiple screens (such as GIMP) should present an easy,
    obvious way to navigate between screens


    +   - The filesystem is not visible as for a user on a normal desktop environment.
    Consequently, users should never need to know a filename; they should only interact
    with metadata (thumbnails for the image viewer, song/art for music, from/subject
    headers in e-mail, and so).


    +   - Wherever, traditional open/save dialogs should be avoided — (given the most
    popular iPhone user requests)the ability to copy and paste applications is important.


    +   - "Attach File" dialogs need to present a friendly list of objects to attach
    (thumbnails or metadata).

    - If Hidden files and folders should be excluded.


    +   - The number of configuration options should be minimized. Applications should
    be preconfigured with intelligent defaults. Options should be included only if
    they''re easily usable by the computer-phone or if they''re likely to be useful
    to a large number of users.


    +   - Users love instant feedback. For any interaction with the UI results in
    a visual/audio feedback within 200ms, which is the limit of what''s necessary
    for the appearance of "instant." For a tactile device like a MID, it''s important
    that widgets act like physical objects. Delayed reactions remind the user that
    they''re on a computer.


    +   - Battery life is a major goal for the Ubuntu Mobile platform. Applications
    should use the application request latency from Device Kit, see Chapter 3.


