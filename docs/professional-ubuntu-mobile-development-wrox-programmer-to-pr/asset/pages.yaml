  md: '# CPUFREQ and Governors


    The power that is consumed by a processor is related to the speed at which it
    is running — it''s a performance battery life trade-off. A way to manage this
    is CPUFREQ in the running kernel, along with the different controlling algorithms
    — it, the governors that control its use.


    Most cpu frequency scaling algorithms or drivers only allow the CPU to be set
    to one frequency. In order to offer dynamic scaling, the cpufreq core must be
    able to tell these drivers of a "target frequency." This is done by using cpufreq
    governors.


    Available governors can be listed by this command:


    ```

    $ /sys/devices/system/cpu/cpu0/cpufreq/scaling_available_governors

    Output looks:

    userspace demand powersave conservative performance

    ```


    The current governor in is shown by:


    ```

    $ /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor

    ```


    which outputs:


    ```

    ondemand

    ```


    The chosen governor is loaded automatically from the init script /etc/init.d/powernowd;
    for example, you can add options by modifying the file /etc/default/powernowd;
    for example, you can add the option -m 3, which puts powernowd into LEAPS mode,
    causing it to jump immediately to the highest frequency if usage is above 80 percent
    or to the lowest frequency if usage is below 20 percent.


    # Use Power Management Settings on Disks


    To see if your disk supports the setting of power management, you can run the
    (substituting your device point):


    ```

    $ sudo hdparm -i /dev/mapper/lawrence-root

    ```


    If your drive supports AdvancedPM, you can use hdparm to tell the disk to go into
    power savings mode after an elapsed period of idle time. The relevant options
    for hdparm are:


    +   -B Sets the Advanced Power Management setting (1–255)

    -S Sets standby (spindown) timeout

    -y Puts the IDE in standby mode

    -Y Puts the IDE drive to sleep'
