  md: '# Chapter 6: Application Selection


    # # A Practical Example


    OpenOffice, however, can be resource-intensive, which can be a problem on a mobile
    device. Because of this, the Ubuntu MID team wrote an application called Trebuchet
    (treb) which is a file handler for displaying office files.


    treb is an interface that reads documents created by Microsoft Office applications.
    It does this by using OpenOffice as a filter to convert the file to PDF and launching
    Evince to see the result. After Evince is closed, the temporary PDF file is deleted
    and treb itself is closed.


    treb comes as part of the MID install, it can also be installed using apt-get;
    it can be run from the command line to present the GUI shown in Figure 6-1.


