    # Free Desktop Standards


    Files need to be placed in specific locations within the file system so that new
    applications can be discovered, presented, and launched by the operating system.
    On Ubuntu, this placement of files conforms to freedktop.org standards. These
    are a set of specifications for the interoperability of projects on X Windows
    systems.


    The most important standards to consider for a developer:


    # The Desktop Entry Specification


    This is a UTF-8 encoded file with the .desktop extension, which has a group header
    called Desktop Entry and a number of Entries in Key=Value format. The REQUIRED
    keys in this file are:


    +   - Type – Either an Application, Link or Directory

    - Name – The name of the application

    - Exec – The application to execute

    - (URL) – Is required if the Type (above) is set to Link


    The Exec must contain a command to execute, which will be the full path to the
    executable itself or with the name, if it can be found in the $PATH environment
    variable.


    > $PATH variable on Ubuntu by default


    ```

    /usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/usr:/games:

    ```


    It is also possible to add special symbols on the command line, which will be
    expanded by the program launcher at the time of execution. For example, to pass
    a URL to a binary called pum which is in the /usr/bin directory, the Exec key
    will look like:


    ```

    Exec=pumd %u

    ```'
