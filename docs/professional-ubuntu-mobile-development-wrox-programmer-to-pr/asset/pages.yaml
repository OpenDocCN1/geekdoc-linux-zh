    Qt libraries, and the Linux platform, is a major driver of innovation in the free
    software desktop and

    mobile device.


    # Qt


    Nokia recently recruited Trollch and acquired the license of Qt from GPL v2 to
    the LGPL v2.1 license.


    OEMs can now link directly to Qt libraries and not have their linked code become
    automatically

    available under the GPL. They have the option to pick and choose code they want
    to share.


    The following example was written in Qt4 on Ubuntu Jaasty and is based on the
