  md: '# Chapter 4: Application Development


    The programmer can create a common menu, which will be shared (memory and functionality-wise)
    by all the windows. A window can override this common menu by having its own menu.
    The following code demonstrates this:


    ```

    GtkMenu *common_menu = create_common_menu();

    GtkMenu *window_specific_menu = create_window_specific_menu();


    hildon_program_set_common_menu(program, common_menu);

    hildon_window_set_menu(second, window, window_specific_menu);

    ```


    Also, a common toolbar can be shared among all HildonWindows. Windows can add
    window-specific toolbars. The common toolbar will be displayed on the bottom of
    the stack of toolbars. The following code demonstrates this:


    ```

    GtkToolbar *common_toolbar = create_common_toolbar();

    GtkToolbar *window_specific_toolbar = create_window_specific_toolbar();

    hildon_program_set_common_toolbar(program, common_toolbar);

    hildon_window_add_toolbar(second, window, window_specific_toolbar);

    ```


