    \    self.window.destroy()\n    gtk.main_quit()\n```\n\n```\nif __name__ == '__main__':\n\
    \    gconfapp = GconfApp()\n    gtk.main()\n```\n\nThe preceding code functions\
    \ in a client-server value. After first setting some signals, it gets the GConf\
    \ client. The actual values for the recent files that are shown in the UI are\
    \ obtained from a Glide file with the call to\n\n```\n<widget class=\"GtkRecentChooserWidget\"\
    \ id=\"recentchooser1\">\n    <property name=\"visible\">True</property>\n   \
    \ <property name=\"limit\">50</property>\n</widget>\n```\n\nThe main advantage\
    \ of using GConf is that the configuration data is stored in a tree structure\
    \ used previously, which makes it easier to manage the preferences of a large\
    \ application, with many preferences and configuration options. It also enables\
    \ notifications across applications. This makes it possible for multiple applications,\
    \ or multiple running instances of the same application, to immediately react\
    \ to changes in preferences, and perform the necessary work to adapt to the new\
    \ preferences."
