    Running laptop_mode increases dirty_expire_centis and dirty_writeback_centis in
    /proc/sys/vm, which means pages will not be written to as often. It also changes
    the ratio of dirty background writebacks, when taken together, result in rapid
    bursts of disk activity and longer dormant states.


    The configuration file for laptop-mode is


    ```

    /etc/laptop-mode/laptop-mode.conf

