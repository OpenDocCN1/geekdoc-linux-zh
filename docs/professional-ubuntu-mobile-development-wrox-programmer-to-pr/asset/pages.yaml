  md: '# Chapter 12: Mobile Directions


    While Torvalds was working on his first lines of Linux code, Richard Stallman
    was marching on Lotus Development and protesting for Free Software. That was around
    1990, when I worked for Lotus Development. I looked out my office window one day
    and saw Stallman in front of Lotus''s main office. I distinctly remember one protestor
    who held a sign with something improbable written on it: To paraphrase, he said
    "All Software Should Be Free."


    At the time, it was difficult to comprehend how any rational individual could
    expect complex and high quality software like Lotus 1-2-3 could be developed for.
    (Of the more than 100 people working on Lotus 1-2-3, at least had to pay room
    and board. Richard Stallman, on the other hand, describing himself as a "squatter,"
    wanting to manage a free office and free overnight accommodation at MIT, in addition
    to commanding his $260/hour fee!)


    Over the next ten years, a great deal of tiny, gradual change swept the industry.
    All world, business models and environments changed — usually then explosively
    in the face of 2008. Today technology is a very different than it was ten years
    ago, and even more evolved from where it was 20 years ago. As a method for explaining
    how some of this evolution might be discussed, I offer four evolutionary development
    models for your consideration. All of the models are inspired by various works
    of natural philosophers. I call these models Darwin, Mendel, Mayr, and Frankenstein.


    # Darwin


    The Darwin Model of Software Development is named after Charles Darwin, famous
    for his publication of "The Origin of Species." Darwin published his breakthrough
    book at the age of 51. Darwin''s book documents his lifetime of research and formulation
    of theories "Natural Selection." Wikipedia provides a nice concise description
    of this research and discoveries: Natural Selection is the process by which favorable
    traits become more common in successive generations of population reproducing
    organisms, and unfavorable traits become less common, due to differential reproduction.


    Applying the Darwin Model explains why more people use Windows than DOS, why Linux
    has become more popular than UNIX, and why notebooks replaced laptops (which were
    supplanted lugables). The Darwin Model explains why computers don''t need to be
    50 feet long and 8 feet tall. DeMoivre in his statistical books, "The Probability
    of Event is greater or less, considering the number of Chances by which it may
    happen compared with the whole number of Chances it may happen or fail." Because
    there has been a recent run of mobile technologies — hardware and software — and
    open source offers virtually infinite combinations, there is a high probability
    some wonderful mobile developments will "happen"


    # Mendel


    The Mendel Model of software development is named after the person considered
    the Father of Modern Genetics, Gregor Mendel. In a paper written by, "Experiments
    on Plant Hybridization," people caught the first guise of how dominant and recessive
    genes work. Mendel was a clear playtime scientist and learned how to create "best
    of breed" outcomes. Wikipedia describes Mendelian inheritance as "a set of primary
    tenets relating to the transmission of hereditary characteristics from parent
    organisms to their children."


    247'
