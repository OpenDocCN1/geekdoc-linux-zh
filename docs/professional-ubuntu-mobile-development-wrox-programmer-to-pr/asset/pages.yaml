  md: "# Chapter 4: Application Development\n\nto <allow_active>yes</allow_active>\n\
    \nreturns the method without asking for authorization.\n\nThe allow_tag specifies\
    \ the default answer that PolicyKit will return for an active session.\n\nThe\
    \ next key technology that is necessary to understand when developing applications\
    \ for a mobile device is GConf.\n\n# GConf\n\nGConf is a way to store configuration\
    \ settings that ships with GNOME. Conceptually it resembles the Windows Registry,\
    \ but GConf abstracts the registry concept into a library. This provides a simple\
    \ interface to applications, and an architecture that makes things easy for OEMs,\
    \ system administrators, and developers.\n\nEssentially, GConf provides a preferences\
    \ database, which is like a simple filesystem. The filesystem keys organized into\
    \ a hierarchy. Each key is either a directory containing more keys, or a value.\
    \ For example, /apps /metacity/general/colorbar_font contains an integer value\
    \ that gives the size of the title bar for the Metacity window manager\n\nThe\
    \ following Python application uses GConf. It is an application that shows the\
    \ most recent files used by a user, which pulls from the GConf settings. The gconf-example.glade\
    \ file is not shown here, but it is included in the code download on the Wrix\
    \ site.\n\n```\n#!/usr/bin/env python\n# - coding: utf-8 -\\*\nimport gtk\nimport\
    \ gtk_glade\nimport gconf\n\nclass GConfApp(object):\n    def __init__(self, garde\
    \ file):\n        #setting the glade file\n        self.gladefile = 'gconf-example.glade'\n\
    \        self.gconfinfo = '/apps/gconf-example/winfo'\n        self.gconfprefs\
    \ = '/apps/gconf-example/prefs'\n        self.tree = gtk.glade.XML(self.gladefile,\
    \ 'window')\n\n    signals = (\n        'on_window_delete_event': self.on_window_delete_event,\n\
    \        # 'on_window_delete_event': self.on_window_destroy,\n        'on_window_destroy':\
    \ self.on_window_destroy,\n    )\n\n    self.tree.signal_autoconnect(signals)\n\
    \    self.window = self.tree.get_widget('window')\n```\n\n91\n\nwww-it-ebooks.info"
