    # Dynamic Kernel Module Support


    Refer to the Dynamic Kernel Module Support (DKMS) official page for more information,
    you’ll find at http://linux.dell.com/dkms/.


    As previously, it is possible to tune a Linux kernel to make the configuration
    closer to the actual hardware being used, rather than sticking with a more generic
    solution provided by the distribution. According to the methods shown, the entire
    kernel needs to be compiled and installed. That means the tuned kernel could be
    different from the generic one and could behave quite differently. To, of course,
    it might not be a problem if the source comes from a stable release.


    But what if the OEM needs to update a driver version or use a drive that is not
    present in the current kernel? Is it necessary to change the kernel to a new (or
    old) version that contains the required driver? The answer is no, thanks to the
    kernel’s ability to add new functionalities at runtime by loading kernel module.
    It is possible to compile and load a new driver without having to touch the already
    configured and compiled kernel image.


    There are many reasons for the OEM not to change the current kernel when trying
