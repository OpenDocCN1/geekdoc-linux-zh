  md: '# Hosting Your Project on Launchpad


    Launchpad is a hosting and collaboration platform for software development projects.
    It offers bug tracking, code hosting, translation services, and a Q&A service.
    It will host your project''s source code using the Bazaar version control system.


    To do this, register the branch at https://code.launchpad.net/people/+me/+addbranch
    (you need to be registered with Launchpad for this). Fill out the web form which
    registers the new branch to Launchpad.


    It can also import CVS and SVN so exporting projects have resource available to
    them. Launchpad provides this free service and keeps your trunk branch up-to-date.
    This allows you to make your own Bazaar branches from the project trunk, and keep
    them up-to-date by merging from time over time as you develop your features.


    To request an import, make sure the project is registered on Launchpad, or register
    yourself. Then visit the request page at https://code.edge.launchpad.net/+code-imports/+new
    and fill out the details.


    This will do the following:


    +   - Create an empty branch to contain the imported code.


    +   - Subscribe to it so that you will be notified when the initial import completes
    and subsequent updates import new revisions.


    +   - Notify the import operators who will check the import location and approve
    the import.


    The initial import can take a long time — up to several days, depending on the
    number of revisions that need to be converted. Once the project is established
    it will be updated from the CVS or Subversion branch every 6–12 hours, although
    an import can be requested at any time by clicking the Import Now button on the
    import page.'
