  md: '# # Fine-Tuning the Build Process


    The following two sections are included here because both help considerably with
    the time it takes to build a final CD. It is better to play around with configurations
    and seeds than it is to be waiting for packages.


    # ## Setting Up a Repository


    Setting up a Debian repository was covered in Chapter 5. To summarize, adding
    a debian package to a local repository is done as follows


    ```

    `$ repropro includedeb <some-debian-package>`

    ```


    There may be instances when a developer needs to add debian packages to a remote
    server (PPA can also be used for this, but mentioned previously, PPA can take
    a long time to make packages available). To add a debian package to a remote server,
    install du:


    ```

    `$ sudo apt-get install dupload`

    ```


    Add a configuration in /etc/apt.conf:


    ```

    `$cfg[''pumd''] = {

    fqdn => "professional-ubuntu-mobile-development.com",

    incoming => "/pub/UploadQueue/";

    }`

    ```


    This fills the qualified domain name to professional-ubuntu-mobile-development.com
    and the home folder on the server as /pub/UploadQueue/. Now it is possible to
    upload to this server using


    ```

    `$ duplicate --tpo <some-debian-package>.changes`

    ```


    Now with repropro installed on the server, the package can be added to the repository.
    This can be scripted and the script added to a cron job. For this approach, go
    to www .debian-administration.org/articles/286.


    # ## Caching Packages with approx


    If the Internet connection is limited, a caching system is very helpful. A number
    of tools can be used to cache packages as approx, apt-cache, apt-cacher-ng, and
    apt-proxy. Choosing one is a matter of preference but we have good results from
    approx.


    This is installed by running the following:


    ```

    `$ sudo apt-get install approx`

    ```


    A configuration file is located in /etc/approx/approx.conf. You can add the repository
    to it. Here is an example:


    +   - packages http://professional-ubuntu-mobile-development.com/'
