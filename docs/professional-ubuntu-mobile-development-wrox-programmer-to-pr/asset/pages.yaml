    # Watching Hard Disk Activity


    An application called iotop watches I/O usage information output by the Linux
    kernel (it requires 2.6.20 or later) displays a current total I/O usage by processes
    or through the system.


    > The CONFIG_TASKSTATS and CONFIG_TASK_IO_ACCOUNTING options need to be enabled
    in your Linux kernel configuration.


    iotop displays the I/O bandwidth that is read and written by each process/thread
    during the sampling period. It also displays the percentage of time the thread/process
    spent while swapping in and waiting on I/O. In addition, the total I/O bandwidth
    that is read and written during the sampling period is displayed at the top of
    the interface.


    217


