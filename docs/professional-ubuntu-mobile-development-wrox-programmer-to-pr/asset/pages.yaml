  md: '# Chapter 9: Testing and Usability


    # Filing a Bug Report Automatically


    The easiest way to report a bug is to use the Apport''s application. When an application
    crashes, Apport starts automatically and opens an appropriate bug report for you
    to complete in Launchpad.


    If you want to report a bug for an application that is running and responding,
    you can access the Apport functionality from the Menu via Help -> Report a problem.
    This method is preferable to filing a bug report directly at the Launchpad website
    because of the debugging information it attaches (including user interface bugs).


    # Reporting a Bug from the Command Line


    To report a bug from the command line, use the following:


    ```

    $ubuntu-bug <PACKAGE_NAME>

    ```


    To file a bug report against a known package, and automatically include all the
    useful debug information, use the following:


    ```

    ubuntu-bug PID

    ```


    To file a bug report against a running program with a known Process ID (PID) (see
    System Administration -> Monitor), use the following:


    ```

    ubuntu-bug linux

    ```


    This will file a bug report on the Linux kernel.


    # Summary


    One advantage that Linux has over proprietary systems is the number of people
    who are prepared to help test and submit bug reports. Everyone can make Ubuntu
    better by submitting bug reports. Setting up a good testing strategy increases
    the chances of finding bugs and contributing to the improvement of Ubuntu, and
    in turn, contributing to the wider open source ecosystem that surrounds it.'
