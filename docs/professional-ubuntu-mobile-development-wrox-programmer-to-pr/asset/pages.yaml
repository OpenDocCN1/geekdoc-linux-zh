  md: '# Chapter 9: Testing and Usability


    Move into the newly created folder and run one of the tests:


    ```

    $ cd mago

    $ PYTHONPATH=./bin/mago -a notify-osd

    ```


    This runs the notify-osd test, which verifies the functionality of the new messaging
    daemon (for more on this new messaging system in Ubuntu, see Chapter 4). The results
    of the test are stored in the .mago folder in the home directory, and the HTML
    file can be displayed in a browser.


    # Building an Application for Testing


    Set up a hypothetical test scenario, an example application will be built and
    then tested. This application will be an embedded web browser, built using the
    Mozilla libraries. This application will be tested for both functionality and
    for its compliance with established Linux standards.


    Such an embedded browser could be useful for kiosk applications where perhaps
    the full functionality of a browser is not required.


    For the purposes of, the focus is on keeping the browser simple; some of the GTK
    widgets in the actual application, as Refresh and Stop, are not hooked up to anything
    in code. However, the location bar is functional so that URLs can be entered and
    URI resources can be accessed.


    > A URI (Uniform Resource Identifier) consists of a string of characters used
    to identify or name a resource on the Internet.


    # Getting Started


    In a terminal window, make sure that the required libraries can be imported:


    ```

    $ python

    Python 2.5.2(r252:60911, May 7 2008, 15:19:09)

    [GCC 4.2.3 (Ubuntu 4.2.3-2ubuntu7)] on linux2

    Type "help", "copyright", "credits" or "license" for more information.

    >>> import gtk

    >>> import gnome.ui

    >>> import gtk.glade

    >>> import gtkmozbed

    location: /usr/lib/xulrunner-1.9.0.1/libxpcom.so

    before 3

    >>>

    ```


    gtkmozbed is available in the python-genome-2extras package.'
