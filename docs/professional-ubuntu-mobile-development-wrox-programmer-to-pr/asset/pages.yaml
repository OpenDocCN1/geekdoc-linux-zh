  md: "# Chapter 4: Application Development\n\nThe capability to react to changes\
    \ and to show system changes in a coherent manner to a user was substantially\
    \ improved during the Jaunty and karmic cycles through the use of a new notifications\
    \ framework. This is the next key technology to understand.\n\n# Notifications\n\
    \nA new way to present information to a user was debuted in the Jaunty release\
    \ of Ubuntu. This is a way to generate passive pop-ups (also called “poptarts”),\
    \ which the user can notify of event.\n\nWhile some information requires a response\
    \ from the user (a low battery for instance), a large amount of the information\
    \ generated by a system is purely informative and requires no user interaction.\
    \ Notifications (provided through the notify-send daemon or through the org.freedesktop.Notifications\
    \ DBus interface) provide for such a case that they do not provide “actions” for\
    \ the user (they cannot click and hover over and hide them). Semantically, the\
    \ bubbles are either confirmations (brightness increased, for example) or notifications\
    \ (new track playing).\n\nCommands to the notification system can be manually\
    \ using\n\n```\n$ notify-send\n```\n\nand also program using the D-Bus interface.\
    \ There are four ways to manually use the notify-send tool (which is provided\
    \ by the package libnotify-bin):\n\n# Icon - Summary Body\n\n```\n$ notify-send\
    \ 'Hello Rodrigo' -i notification-message-info\n```\n\n# Icon - Summary\n\n```\n\
    $ notify-send 'WiFi connection lost' -i notification-network-wireless-disconnected\n\
    ```\n\n# Summary - Body\n\n```\n$ notify-send 'PUMD' 'This is some notification'\n\
    ```\n\n# Summary - only\n\n```\n$ notify-send 'Summary-only'\n```\n\nTo send a\
    \ notification programmatically (this is from the “Putting All the Concepts Together”\
    \ section later in this chapter), use:\n\n```\ndef __init__(self):\n    (...)\n\
    \    # saving notification system availability status\n    self._notification_available\
    \ = pynotify.init('disk-applet)\n(...)\n```\n\n```\ndef on_device_added(self,\
    \ device):\n```"
