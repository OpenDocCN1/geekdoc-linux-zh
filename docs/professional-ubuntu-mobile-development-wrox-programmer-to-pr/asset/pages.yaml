  md: '# Chapter 11: Putting It All Together


    “germinated” into a full list of packages required for a specific task. Everything
    but the Ubuntu archive has a corresponding set of listings the package contains
    — so, for example, the base seed will contain a minimum set of packages needed
    to get a minimal command on the device.


    The seeds expand into a list of packages that are then built using some automated
    scripts to create CD and DVD images. These images are then published daily on
    cimage.ubuntu.com and eventually as releases.ubuntu.com. The types of images that
    are created


    +   - iso images — Ubiquity and the automate installer

    - arm6 images — Used for ARM and for LPIA images.


    # Inside Seed Generation


    Germinate is a program that constructs lists of packages by reading seed files.
    Seeds are files that contain list of packages. These raw are processed by the
    germinate program to generate another list, which contains all of the dependencies
    of the packages in the raw list (Germinate also creates lists of suggests and
    recommends in its output). An example output illustrated in Figure 11-1 shows
    which is the “minimal” seed


    | package | size | dependencies | Raw Size (KB) | List Size (KB) |

    | :--- | :--- | :--- | :--- | :--- |

    | ubuntu-base | 50931 | ubuntu-minimal,ubuntu-data-partner,ubuntu-standard | 50931
    | 1276 |

    | ubuntu-minimal | 47838 | ubuntu-base,ubuntu-standard,ubuntu-recommended,ubuntu-archive
    | 47838 | 1052 |

    | ubuntu-data-partner | 43672 | ubuntu-minimal,ubuntu-standard | 43672 | 964 |

    | ubuntu-standard | 84673 | ubuntu-base,ubuntu-minimal,ubuntu-recommended | 84673
    | 2052 |

    | ubuntu-recommended | 90522 | ubuntu-base,ubuntu-minimal,ubuntu-standard | 90522
    | 2110 |

    | ubuntu-archive | 95238 | ubuntu-base,ubuntu-minimal,ubuntu-standard,ubuntu-recommended
    | 95238 | 2216 |

    | linux-image-generic | 85502 | ubuntu-base,ubuntu-minimal,ubuntu-standard | 85502
    | 1988 |

    | linux-image-extra | 95524 | ubuntu-base,ubuntu-minimal,ubuntu-standard | 95524
    | 2414 |


    Figure 11-1


    In the preceding table, aptitude is considered depends on it, and usoboot-builds
    is included because sometimes has headers at the top of the file, "key: value"
    format. These are not parsed by germinate but are used by the germinate package-updatemetapaking
    when generating its output. The packages in the raw seeds list should be listed
    in bullet format with each package included by an asterisk. The raw seed file
    itself can be written in wiki format (as below) because everything that does not
    start with an asterisk will be ignored:


    ```

    == Development =


    These packages are needed in order to build Ubuntu packages.

    ```


    +   * build-essential

    * fakeroot


    ```

    == Hardware & Network Access ==


    * pptp-linux # client for Microsoft-compatible VPN, needed for some ISPs

    * sl-modem-daemon # needed for some Winmodems (see AutoftheboxWinmodem)

    * bpalogin

    * ndiswrapper-utils-1.9 [amd64 1386]

    * ndisgtk

    ```


