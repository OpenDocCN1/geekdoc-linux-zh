  md: '# # Chapter 3: Power Management


    ![](img/20e1447b223c3f9afa3d43610c6361ee_76_0.png)


    # ## Device Kit Power


    The DeviceKit set of daemons replaces replaces the core functionality of HAL —
    the Hardware Abstraction layer. The daemons were written because applications
    currently need a lot of complicated code to simple things such as working out
    the remaining battery life. All of the DeviceKit daemons are system activated
    and have low memory requirements.


    DeviceKitpower also implements a QoS (Quality of Service) interface for latency
    control (discussed shortly). This is needed to produce a device that uses little
    power when idle, but at the same time it might feel sluggish.


    DeviceKitPower provides a D-Bus interface (for more information on D-Bus see Chapter
    4) for power sources on the device and to control device-wide power management.
    Any application can access the org.edesktop.DeviceKit.Power service on the system
    message bus.


    DeviceKit.Power can be installed using the following:


    ```

    $ sudo apt-install devicekit-power

    ```


    Devkit-daemon provides the org.edesktop.DeviceKit.Power service on the system
    message bus and devkit-power provides a handy command line tool to access the
    daemon. The tool can be used like this (the output has been edited for clarity):


    ```

    $ devkit --monitor-detail

    Monitoring activity from the power daemon. Press Ctrl+C to cancel.

    device changed:

