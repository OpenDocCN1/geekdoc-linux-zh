    However, the preceding command will not work! Besides the fact that installed-mid.img
    does not exist, the Bochs OS that used in QEMU and KVM doesn''t allow booting
    on the second hard disk. As a workaround, the Ubuntu Mobile Team provides a small
    (less than 400KB) ISO image from which the second hard disk can be chosen. This
    is available at http://people.ubuntu.com/~loop/isolinus.iso.


    The script to generate predicting ISO is available using bz (see Appendix A),
    which you can find at lp://ubuntu-mobile-dev/ubuntu-mobile/mobile-scripts.


    Some of the scripts are described in greater detail later in the chapter.


    Boot KVM with the following:


    ```

    $ kvm -m 512 -cdrom isolinus.iso -hda installed-mid.img -hdb ubuntu-9.04-mid-lpia.img

    ```


    installed-mid.img in the command above created using the following:


    ```

    $ qemu-img create installed-mid.img 4G

