  md: '# Chapter 7: Theming


    Setting Option "RenderAccel ''true" in the xorg configuration gives a performance
    boost, particularly with GtkTextView. To do this, back up the config /etc/X11/xorg.conf.
    A good way to do this is to run the following:


    ```

    $ sudo dpkg-reconfigure xserver-xorg

    ```


    Accept the defaults. Make the device of the new xorg.conf look like this:


    | Section | "Configured Video Device" |

    | --- | --- |

    | Identifier | "UseFBDev" "true" |

    | Option | "RenderAccel" "true" |

    | EndSection | |


    Setting RenderAccel can cause some unexpected results as screen lockups (it''s
    for reason that it is not enabled by default by the Ubuntu developers). Test this
    on a device thoroughly.


    Setting this on XFCE base using Ubuntu Network remix and restarting gave GtkTextView
    time of 150.95, a 10 second improvement on the original.


    It is also possible to get some performance improvements by using the latest version
    of the Murrine engine from the GNOME repositories. Murrine Engine is a "shiny"
    and popular GTK2 engine.


    To get this benefit, compile the engine itself into a MID image by adding the
    multiverse and universe repositories to sources.list, and install the dependencies:


    Download the latest svn:


    ```

    $ svn co http://svn.gnome.org/svn/murrine/trunk/

    ```


    Move inside source code directory and run the following:


    ```

    $ ./autogen.sh

    $ ./configure --prefix=/usr --enable-animation

    $ make

    $ sudo checkinstall

    ```


    This will pop up some questions. Answer yes to create the default docs and choose
    a new package description. Then enter a package version for debian, and press
    Enter. This will create a debian file which can be installed using dpkg -i.


    # X Window Testing


    If there is an expensive runtime in your theme that cannot be explained through
    some modification, it is possible to test the relative performance of the X Window
    graphics adapter to see if the problem lies. This is done through the use of x11perf,
    which attempts to run through most of the X drawing operations and characterizes
    how many of these operations the XServer can perform in a given period of time.'
