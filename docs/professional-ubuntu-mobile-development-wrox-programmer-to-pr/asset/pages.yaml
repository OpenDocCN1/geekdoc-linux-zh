    # The Generational Divide


    If you have any doubt about the promise of Ubuntu as an operating system, and
    the likelihood that it will gain a significant market presence in the future,
    you may find this story of interest.


    Sometimes people evaluate a computer''s use of asking: “Is it easy enough for
    your grandmother to use?” A better question is: “Is it easy enough for a 15-year-old
    to use?” I love my grandmother dearly, even if she did have an interest in computers,
    I doubt big business would be building a five-year business plan around her particular
    usage scenarios. On the other hand, a 15-year-old typically has the interest and
    the need, and presents an attractive lifetime value proposition.


    My 15-year-old son to to one evening carrying his Windows-powered notebook. “Hey,
    Dad, can you take a look at this and help me get WiFi working?” I anticipated
    what would have happened with his sister''s notebook — it was time for another
    reinstallation.


    He turned the laptop to show me the screen and what it was shocking: the Ubuntu
    desktop.


    “I installed Ubuntu.” “Wow, the browser is super fast when I plug in the Ethernet.
    I remember what the Internet was.” He’d been fighting the gradually degrading
    performance of his Windows Vista installation for weeks now and finally decided
    to quit it.


    His notebook was just a year old — with plenty of horsepower and a price tag that
    pushed it over $1,000. It had all the technologies — WiFi card, hard disk, a nice
    screen. But it slowed noticeably and inexplicably. My gut reaction was to reinstall
    Windows for him. I made the opposite despite the dread I felt anticipating a multi-day
    effort to get Windows working again. Chasing down drivers for Windows is no fun.


    “What happened?” I asked. “I can reinstall Windows for you.”'
