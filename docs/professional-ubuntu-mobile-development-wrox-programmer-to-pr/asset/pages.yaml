  md: '# Application Selection


    According to some observers, the Mobile Internet Device category is rapidly emerging.
    A recent study by ABI Research shows that this category will appeal both as tools
    and toys to a “wide variety of people.” The report also forecasts that these products
    will see a dramatic growth in popularity over the next five years, with worldwide
    shipments rising from under 3.5 million in 2008 to nearly 90 million in 2012.


    According to Strategy Analytics, another research firm, sales of Mobile Internet
    Devices are expected to exceed $17 billion worldwide annually by 2014.


    More about the business potential of mobile devices can be found in Chapter 12.


    It may benefit OEMs to identify “categories of users” within this “wide variety
    of people” category in order to tailor the applications that they offer on devices
    for each targeted segment. This will mean selecting applications and device settings
    that make the best use of a mobile device for particular groups of users.


    # Business Users


    This is a large and profitable market segment that many OEMs target. Although
    it may be true that the line between business users and consumers is becoming
    less differentiated, application providers seem to be focusing on how to integrate
    their software with MIDs and notebooks to deliver a consistent experience to enterprise
    users.


    Many firms are facing budgetary pressures and need to become more efficient and
    cut spending. Solutions as hosting office applications and documents in the cloud
    with the device running a highly customized version of Ubuntu Mobile are increasingly
    attractive to companies. Even so, having a mobile device in this way raises more
    security concerns than if the employee were, for example, tethered to a workstation
    at the office.'
