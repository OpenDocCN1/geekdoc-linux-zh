  md: '# 1 Mobile Linux


    This chapter introduces mobile computing in the context of the evolution of different
    computer types. More important, it presents reasons why developing Mobile applications
    with Linux and Ubuntu makes economic and technical good sense.


    > More than three-quarters of the expert respondents (77%) agreed . . . that the
    mobile device — with more significant computing power in 2020 — will be the primary
    Internet communications platform for a majority of people across the world.


    > Pew Internet & American Life Project, The Future of the Internet III, December
    14, 2008


    # Going Mobile


    Since the first computers were created, there has been a constant push for smaller,
    faster, cheaper systems that provide more personal power. In December 2008, quarterly
    laptop desktop sales outnumbered for the first time. Netbook computers — smaller
    than laptops, with a price performance profit that the market storm — were the
    unexpected hit of 2008. Considering the following statistics: International Data
    Corp (IDC) estimates 20.6 million netbooks will ship in 2009 (compared to 137
    million full-sized laptops). ABI Research says that number could reach 35 million
    in 2009 and 139 million in 2013. Ultra Mobile PCs (UMPCs) seem to be trickling
    along with one or two million. Mobile Internet Devices (MIDs) are projected to
    be a healthy jump in sales, with some estimates placing them near 6 million in
    2009 and triple that in 2010 — not the runaway success of smartphones. As demand
    for mobile solutions has grown, Linux and Ubuntu have improved. Today''s mobile
    markets — for both users, and vendors who bundle an operating system with their
    hardware — align well with Linux and Ubuntu.


    Let’s take a quick look at how these technologies evolved, and why Linux and Ubuntu
    are primed to deliver mobile solutions.'
