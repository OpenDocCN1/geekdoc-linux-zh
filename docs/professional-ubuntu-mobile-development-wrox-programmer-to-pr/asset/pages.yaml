  md: '# Acknowledgments


    Book acknowledgments are not just list of debts the authors have racked up — many
    readers tend to see such a call of names as a code shortcut to a book''s authority.
    As such, this book is dedicated simultaneously both to upstream and the Debian
    and Ubuntu communities — the developers, documentation writers, artists, business
    developers, Loco teams, and who made this book possible.


    This section would not be complete without mentioning my co-author Rodrigo Belem.
    He is a gifted programmer and “muito algo elemento,” too — thanks for the insights,
    for the many hours spent hacking, and for the friendship. Finally, this book is
    dedicated to the people of Brazil who love, laugh, suffer, and cry with equal
    passion, and to the people of Amazon, where mobility is a way of life. Finally,
    we are slowing down and listening to what they have to say.


    > Ian Lawrence


    My participation in this book would not have been possible without the love and
    support of my mother and my sisters. My father gave me love, encouragement, guidance,
    and the first push to learn to fix problems. If not for him, I probably not have
    followed a technology career.


    Thanks to my Mom and Dad’s families for all their love.


    I surpassed many problems during the process of writing this book, and fundamental
    in this respect were (and are) Adriana Almeida and Heider Cesar. Thanks also to
    my fiancée for her love, attention, and encouragement in the final stages of writing
    this book.


    In walking my path, many people appeared and were essential in influencing my
    hesitant steps to arrive at where I am today. These people are Guelber Menezes,
    Hau Wang, Bruno Monteiro, Thiago Iabiina, and Frank Choit.'
