  md: '# Appendix E: D-Bus: An Overview


    There are four message types:


    +   - Method calls ask to invoke a method on an object.

    - Method return messages return the results of invoking a method.

    - Error messages return an exception caused by invoking a method.

    - Signal messages are notifications that a given signal has been emitted (that
    an event occurred). You could also think of these as "event" messages.


    A method call can vary simply to messages: You send a method call message, and
    receive either a method return message or an error in reply.


    Each message has a header, including fields, and a body, including arguments.
    You can think of the header as the routing information for the message, and the
    body as the proxy. Header fields might include the sender bus name, destination
    bus name, method or signal name, and so forth. One of the header fields is a type
    signature describing the values found in the body. For example, the letter "i"
    means "32-bit integer" "ii" means the payload for 32-bit integers.


    # Calling a Method: Behind the Scenes


    A method call in D-Bus consists of two messages: a method call message sent from
    process A to process B, and a matching method reply sent from B process A. Both
    the call and replies are routed through the bus daemon. The caller includes a
    serial number in each call message, and the reply includes this number to allow
    the caller to match replies to calls.


    The call message will contain any arguments to the method. The reply may indicate
    an error, or may contain data returned by the method.


    The steps of a method invocation in D-Bus are as follows:


    +   - The locale binding may provide a proxy, such that invoking an in-process
    object invokes a method on remote in another process. If so, the application calls
    a method on the proxy, and the proxy constructs a method call to send to the remote
    process.

    - For more low-level APIs, the application may construct a method call itself,
    without using a proxy.

    - In either case, the method call contains: a bus name belonging to the remote
    process; the name of the method; the arguments to the method; an object path inside
    the remote process; and, optionally, the name of the interface that specifies
    the method.

    - The method call is sent to the bus daemon.

    - The bus daemon looks at the destination bus name. If a process owns that name,
    the daemon forwards the method call to that process. Otherwise, the bus daemon
    creates an error message and sends it back as the reply to the method call.

    - The receiving process unpacks the method call. In a simple low-level API situation,
    it may immediately run the method and send a method reply to the bus daemon. Using
    a high-level binding API, the binding might examine the object path, interface,
    and


    www.it-ebooks.info'
