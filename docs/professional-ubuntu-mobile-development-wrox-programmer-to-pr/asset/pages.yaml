  md: '# Appendix E: D-Bus: An Overview


    # # Native Objects and Object Paths


    Your programming framework defines what an “object” is like, usually with a base
    class — for example: `java.lang.Object`, `GObject`, `QObject`, Python’s base Object,
    or whatever. Let’s call this a *native object*.


    The low-level D-Bus protocol, and corresponding `libdbus` API, does not care about
    native objects. However, it provides a called *object path*. The idea of an object
    path is that higher-level bindings can make native object instances, and allow
    remote references to them.


    The object path looks like a filesystem path — for example, an object could be
    `/org/kde/kspread/sheets/3/cells/4/5`. Human-readable paths are, you are free
    to create an object name if it makes sense for your application.


    Namespacing object paths by starting them with a domain name you own (e.g., `/org/kde`)
    is nice because it keeps code modules in the same process from stepping on another’s
    toes.


    # # Methods and Signals


    Each object has *members*; the two kinds of members are *methods* and *signals*.
    Methods are operations that can be invoked on an object, with optional input (as
    arguments or “in parameters”) and output (as return values or “out parameters”).
    Signals are broadcast from the object to any interested observers of the object;
    signals may contain a data payload.


    Both methods and signals are referred to by name, such as `PUM` or `OnClick`.


    # # Interfaces


    Each object supports one or more *interfaces*. Think of an interface as a named
    group of methods and signals, just as it is in GLib or Qt or Java. Interfaces
    define the *type* of an object instance.


    D-Bus identifies interfaces with a namespaced string, something like `org.freedesktop.Introspect`.
    Most bindings will map these interface names directly to the appropriate programming
    language construct — for example, to Java interfaces or C++ pure virtual classes.


    # # Proxies


    A proxy is a convenient native object created to represent a remote object in
    another process. The low-level D-Bus API manually creating a method call message,
    sending it, and then manually receiving and processing the method reply message.
    Higher-level bindings provide proxies as an alternative. Proxies look like a normal
    object, but when you invoke a method on the proxy object, the binding converts
    it into a D-Bus method message, waits for the reply message, unpacks the return
    value, and returns it from the native method.'
  merge: -1
