  md: '# Chapter 5: Application Packaging


    fakeroot


    Gives a fake root environment and enables the running of a command line like this
    (notice the user $

    and not the root #):

    ```

    $ dpkg-buildpackage -rfakeroot

    ```

    $ dpkg-buildpackage -rfakeroot


    It is useful for building packages as a normal user.


    lintian


    lintian contains automated checks for many aspects of Debian policy as well as
    some checks for

    common packaging errors.

    \lintian uses an archive directory (called a laboratory), which defaults to /tmp
    and in this

    directory stores information about the packages it examines. It can keep this
    information

    between multiple invocations in order to avoid repeating expensive data-collection
    operations.


    pbuilder


    Using pbuilder as a package builder enables you to build the package from within
    a chroot

    environment. You can build binary packages without using builder, but you must
    have all the

    dependencies installed on your system first. Pbuilder configuration is covered
    in more

    detail in this chapter..


    # # Packaging and Using a PPA


    With Launchpad''s Personal Package Archives (PPA) it is possible to build and
    then publish

    packages for multiple architectures by uploading source code to the web service.
    The limit on

    size of a personal archive is 1GB per PPA. If you have multiple PPAs, it is 1GB
    for PPA. To use the

    service, your PGP key needs to be uploaded and you must have signed the Ubuntu
    Code of

    Conduct.


    To show packaging in a real-world situation, we will package the ubuntu-golden
    theme, which will be

    created in Chapter 7. This will be uploaded to a Launchpad PPA.


    For information on Launchpad see Appendix C.


    Create a folder called ubuntu-golden and inside this folder two other folders
    called debian and

    gtk-2.0. Inside the gtk-2.0 folder, place the gtr file we created in the theme
    chapter.


    The deb directory is where all the packaging information is stored and it allows
    us to separate the

    packing from the application source code. Inside this folder, we now need to create
    the essential

    files for any Ubuntu package: changelog, control, and rules. These are the files
    needed

    to create the binary packages (.deb) from the source code. We will look each file
    in turn.


    This is just a quick demonstration of the files that make an Ubuntu package. As
    such, there is

    lot of information about packaging that is missing. For additional information,
    please read the Packaging

    Guide at http://wiki.ubuntu.com/. Packaging is an art form and if you find after
    going through this

    chapter that you have a natural ability or interest in this, this is the best
    place to start.'
