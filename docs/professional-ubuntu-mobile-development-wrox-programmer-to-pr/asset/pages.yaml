    # Adobe Flash


    Using Flash on a battery powered, mobile device can be somewhat challenging. This
    is unfortunate as Flash is a popular software application and, indeed, was once
    used as a “proof-of-concept” Home area for the Ubuntu Hardy MID, as shown in Figure
    10-1.


    ![](img/20e1447b223c3f9afa3d43610c6361ee_248_0.png)


    Figure 10-1


    According to Adobe, Flash will always maximize the CPU if there are the cycles
    to spare. It does this because, for users to perceive animation as playing smoothly,
    it is important that each frame be displayed at the proper time. Even small inconsistencies
    in frame-to-frame timing can make animation appear jerky.


    The problem with this is that a new model of scheduling called “dynamic tick”
    was introduced in version 2.62.21 of the Linux kernel, which allows the processor
    to be almost entirely shut down until the next time the user interacts with the
    computer. Such constant polling by Flash does not allow this to happen, which
    has a devastating effect upon power consumption.'
