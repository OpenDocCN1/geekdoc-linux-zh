    # Creating a Default Ubuntu Image


    Now is the time to think about creating the image. This image should be installable
    on a device and to accomplish this, an installer is necessary.


    The techniques that are demonstrated in the rest of the chapter are useful only
    when working with mobile devices, but can also be easily adapted to create images
    for desktops and servers.


    # Choosing Which Type of Installer to Use


    There are two different types of installers; determining which one to use will
    depend to some degree on the target audience for the device and what type of image
    you want to create.


    # When to Use Debian-Ubuntu (Ubuntu Alternate Image)


    The alternate installer is used for more advanced installations as it provides
    options that are not available with the regular desktop image. This might include
    passing options to kernel modules or forcing a static network configuration. Consider
    another example: In Chapter 6 a user''s home directory was encrypted. This needs
    to be extended to encrypting a whole drive on a device, then this option is only
    available in the alternate image.


    The alternate should also be used if the installation needs to be automated across
    a number of devices or if the device has a low memory footprint (less than 256MB
    RAM).


    # When to Use Ubiquity (Ubuntu Desktop Image)


    Ubiquity is a graphical tool for Ubuntu, written in Python, which uses the deb-installer
    (d-i) as a backend for many of its functions. Ubiquity was built because the original
    interface to d-i was seen by some as crude. This is because d-i uses a system-based
    tool for its interface, and because it depends on responses to questions it can
    lack a certain flexibility. Ubiquity''s primary focus is on ease of use for new
    users, and so it uses a filter debconflector, which sits between d-i and the debconf
    front end, intercepting the debconf protocol, and transforming into events that
    can be handled in the same way as UI elements with widget libraries like GTK+
    or Qt.


    > More info about the deb-installer can be found at http://d-i.alith.debian.org/doc/talks/debconf6/.


    # Getting Started on the Image: Preparing the Environment


    There are many ways to build Ubuntu images. A variety of existing tools help to
    automate this task — such as remastersys, Ubuntu Customization Kit, and methods
    that manually edit the default Ubuntu images. This section will describe the official
    Ubuntu way to create images.'
