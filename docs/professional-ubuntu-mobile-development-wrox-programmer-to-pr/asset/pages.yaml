  md: '# Introduction


    Professional Ubuntu Mobile Development is designed for all developers interested
    in a practical, hands-on way of learning development on mobile devices. The book
    is designed to show you how to complete real-world tasks in efficient and often,
    we hope, innovative ways. Our goal is to get the examples in this book will help
    you understand the techniques we need when working with Ubuntu Mobile. Our hope
    is that you can creatively apply them to your own real-world problems.


    As such, the book is not a "static" object but we authors have tried to model
    this dynamism through an emphasis on discrete, reusable units of logic — the chapters
    — the names which became obvious as we worked at customizing Ubuntu Mobile. This
    means the book can be approached in numerous ways.


    # Whom This Book Is For


    The book is for developers with some experience working with Debian-like systems
    such as Ubuntu, but it is also for developers with experience other operating
    systems, who perhaps want to explore or rapidly come up-to-date with the key features
    of Ubuntu Mobile. It is well suited for developers who are "perfectionists with
    deadlines" and, as such, is not an introduction to embedded development of Ubuntu.
    To get the most from the book, you will understand programming principles and
    have a healthy dose of curiosity about how things work and how to adapt the examples
    provided by your particular situation and demands.


    It is not a book about how to install Ubuntu onto any particular mobile device
    (there are other guides available on the Internet for this), but it is a book
    which will be useful if you would like to use Ubuntu Mobile in its various flavors
    for your customization projects.


    # What This Book Covers


    On August 28, 2009, The North-China Herald published an article "The Moving Target
    Problem," which concerned the growing popularity of moving targets at the expense
    of the bull''s-eye when training riflemen. This was to the chagrin of the military,
    who maintained that the best rifleman in actual warfare would be the one who had
    careful training on the bull''s-eye and had from his earliest career to observe
    and rectify his errors in marksmanship.


    Anyone who has written a book will surely sit side with the military on this one:
    The scope of Ubuntu is large and the mobile project so now that things in this
    book might well have changed when you read them. This book gives a snapshot of
    best practices and the techniques you need at hand to implement them.


    The most important thing when developing for an embedded device is to have a development
    environment set up. Once this is done, it is possible to develop, package, and
    test your application in an environment that provides a reasonable approximation
    of a real device. This is followed by'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Introduction


    several chapters, each of which emerged from a real-world situation during the
    course of our work with mobile device development and “customization.” The chapters
    are the kinds of things we wanted to see when deadlines were looming and we hope
    that they make up the kind of book we wish we had when we were starting out.


    We immensely enjoyed writing this book and hope that you will enjoy reading it
    just as much.


    # How This Book Is Structured


    The book covers the following topics:


    +   - Chapter 1, Mobile Linux — discusses the possibilities and probabilities
    of running Linux on a billion devices.


    +   - Chapter 2, The Development Environment — steps you through setting up a
    work environment.


    +   - Chapter 3, Power Management — examines the greater divergence in the future
    between performance-optimized and power-optimized mobile devices.


    +   - Chapter 4, Application Development — discusses developing for mobile devices.


    +   - Chapter 5, Application Packaging — illustrates preparing applications for
    distribution.


    +   - Chapter 6, Application Selection — is about how to choose the look and feel
    of a mobile device.


    +   - Chapter 7, Theming — shows you how to customize the look and feel of a mobile
    device.


    +   - Chapter 8, Kernel Fine-Tuning — explains how to represent the band of software
    near the hardware.


    +   - Chapter 9, Testing and Usability — discusses measuring benchmarks and standards
    for stability and performance.


    +   - Chapter 10, Tips and Tricks — suggests ways to save time with some how advice.


    +   - Chapter 11, Putting It All Together — discusses the benefits and potential
    pitfalls of having your own mobile distribution, and how to actually seed and
    germinate the image.


    +   - Chapter 12, Mobile Directions — discusses the future of Linux on mobile
    devices.


    +   - Chapter 13, Common Problems and Possible Solutions — identifies problems
    and provides solutions.


    # What You Need to Use This Book


    The book was written and the code was developed on computers running Ubuntu Jaun
    and Ubuntu Karmic.


    The code in the chapters was tested and used generally on an Acer Aspire One,
    Geode, Eee PC, and a Beagleboard. An actual device or board like this is obviously
    nice but not essential to fully enjoy this book.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Introduction


    # History and Background to the Ubuntu Mobile Project


    This background comprises various conversations on IRC at #ubuntu-mobile, and
    it now forms the basis of the wiki page at https://wiki.ubuntu.com/MobileTeam/Mobile/History.


    The project started with an announcement at the start of the Ubuntu Hardy release
    cycle by Ubuntu CTO Matt Zimmermann to the ubuntu-dev-mobile mailing list, which
    said:


    +   It is clear that new types of device—small, handheld, graphical tablets that
    are Internet-enabled—are going to change the way we communicate and collaborate.
    These devices place new demands on open source software and require innovative
    graphical interfaces, improved power management and better responsiveness.


    To fulfill the aims of our mission and in response to the technical challenges
    that these devices pose, we are announcing the Ubuntu Mobile and Embedded project.


    # The Ubuntu Mobile and Embedded Project


    This was an extension of the GNOME Mobile and Embedded Initiative (GMAE). The
    naming of the Ubuntu Mobile and Embedded Project caused confusion at the time
    because there existed a previous Ubuntu Embedded Team. This team was working toward
    the creation of tools, documentation, and a binary/source release for the purpose
    of running Ubuntu on small PC style hardware and embedded devices. The Ubuntu
    Embedded team was mainly looking at getting Ubuntu working on ARM processor-based
    devices.


    The Ubuntu Mobile and Embedded Team started work during the Ubuntu Hardy release
    cycle and as time, most of the focus during this cycle was getting Hildon and
    Merlin into Ubuntu, and porting to the LPIA architecture from Intel:


    +   Hildon is an application framework for mobile devices developed by Nokia and
    now a part of GMAE, which focuses on providing a finger-friendly interface. It
    is primarily a set of extensions that provide mobile-device-oriented functionality


    +   Moblin is an Intel-sponsored, open-source community and application framework
    to create consumer-friendly applications and user interfaces across a range of
    Mobile Internet Devices (MIDss), netbooks, and embedded devices.


    +   LPIA (Low Power Intel Architecture) is a new processor architecture, which,
    while resembling i386, uses different optimization options in the compiler and
    different configuration and build options for some packages. Specifically, LPIA
    uses GCC-4.2 as the system compiler (instead of GCC-4.1 which is used for the
    other Ubuntu architectures.


    xxvii


    it-ebooks.info'
