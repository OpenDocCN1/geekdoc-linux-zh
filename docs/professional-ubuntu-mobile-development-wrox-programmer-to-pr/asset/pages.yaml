  md: '# Chapter 9: Testing and Usability


    Open the Application Check page, and specify the name of the application and the
    file to test dump.py.


    Next, select the LSB version and profile (the Architecture field cannot be changed
    currently), and press the Run Test button.


    The test will be executed, displaying the LSB Report page. It contains a lot of
    information about the test run.


    From this page, you can start the LSB certification process for the application
    you have tested.


    In the test, the toolkit recommended changing the embedded browser


    ```

    #!/usr/bin/env python

    ```


    to


    ```

    #!/usr/bin/python

    ```


    This recommendation was made in order to increase the portability of the application
    across different platforms. It can be seen that the LSB aims to maintain compliance
    across architectures and, as such, it is an emerging standard in the open source
    ecosystem. Having an application certified by the LSB is highly recommended and
    indeed becoming mandatory for most LSB’s.


    # Other Testing Tools


    In addition to Mago and LSB, the open source community has developed a range of
    other testing applications. These include Poronix Test Suite, which is a testing
    and benchmarking platform: pbuilder, which is used for package testing; and a
    range of other tools (such as ps and top), which come standard with the Ubuntu
    operating system.


    Using pbuilder is explained in Chapter 5.


    # Poronix Test Suite


    The Poronik Test Suite is designed to carry out both qualitative and quantitative
    benchmark testing of a Linux system. It consists of a processing core (pts-core)
    and benchmarks that are XML-based profiles with related resource scripts. You
    can find the application in the universe repositories. You can install it using
    apt.


    ```

    $ apt-get install poronik-test-suite

    ```'
