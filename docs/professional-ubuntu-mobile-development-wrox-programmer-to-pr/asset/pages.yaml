    # Performing a Dual Boot


    Q: Would it be possible to dual boot Ubuntu Netbook Remix on a Windows mobile
    device?


    A: This very much depends on the device hardware. A fair number of existing models
    support some form of alternate booting, either directly from some physical device,
    or through an application that replaces the currently running operating system
    with a physical device or selected file.


    The majority of current devices supported by Ubuntu fall into the first category,
    and many devices are targeted for the low cost market, and to meet that, they
    incorporate a small SSD for data storage (4–16GB). Systems as the Eee PC from
    Asus are capable of running both Windows and Linux, but not from the same drive
    because of space. It is possible to install Linux on a USB device and run it “Live”
    from USB, and use the SSD for XP.


    It is entirely possible, if the hardware is sufficient, for dual booting. Many
    devices are targeted for the low cost market, and to meet that, they incorporate
    a small SSD for data storage (4–16GB). Systems as the Eee PC from Asus are capable
    of running both Windows and Linux, but not from the same drive because of space.
    It is possible to install Linux on a USB device and run it “Live” from USB, and
