    # Conventions


    Instead of including a lot of numerous steps, instructions are provided with the
    code displayed in the text, as described in the example that follows.


    To use QEMU, install the necessary packages:


    ```

    $ sudo apt-get install qemu kqemu-common kqemu-source

    ```


    Next, add your user name to the kqemu group. Adding your user name to the kqemu
    group ensures that you do not need to run QEMU as the root user.


    > kqemu is the name of the module that is used to accelerate QEMU.


    To add your user name, run


    ```

    $ sudo adduser <username> kqemu

    ```


    To make these changes effective, it is necessary to log out and log back in again.


    To test QEMU, go to the folder that contains the image that you downloaded from
    http://ubuntu.com and run


    ```

    $ qemu-localtime -m 384 -boot d ubuntu-9.04-mid-lpia.img

    ```


