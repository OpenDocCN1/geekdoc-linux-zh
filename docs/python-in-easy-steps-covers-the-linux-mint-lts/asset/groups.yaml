  mdcn: "\n\n“布尔”（Boolean）一词指的是一种由英国数学家乔治·布尔（George Boole，1815–1864）开发的逻辑思维体系。\n\n\
    ![](img/d06b1f1cf83677f6647237f0c7827141_46_0.png)\n\n1. 通过初始化两个具有布尔值的变量，开始编写一个新的\
    \ Python 脚本，以便进行逻辑评估\n   - `a = True`\n   - `b = False`\n2. 接下来，添加语句以显示逻辑与（AND）评估的结果\n\
    \   - `print('\\nAND Logic:')`\n   - `print('a and a =', a and a)`\n   - `print('a\
    \ and b =', a and b)`\n   - `print('b and b =', b and b)`\n3. 现在，添加语句以显示逻辑或（OR）评估的结果\n\
    \   - `print('\\nOR Logic:')`\n   - `print('a or a =', a or a)`\n   - `print('a\
    \ or b =', a or b)`\n   - `print('b or b =', b or b)`\n4. 最后，添加语句以显示逻辑非（NOT）评估的结果\n\
    \   - `print('\\nNOT Logic:')`\n   - `print('a =', a, 'not a =', not a)`\n   -\
    \ `print('b =', b, 'not b =', not b)`\n\n5. 将文件保存在你的脚本目录中，然后在那里打开一个**命令提示符**窗口并运行此程序——以查看逻辑运算的结果。\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_47_0.png)\n\n![](img/d06b1f1cf83677f6647237f0c7827141_47_1.png)\n\
    \n在 Python 编程中，布尔值也可以表示为数值，其中 **True** 是 **1**，**False** 是 **0**（零）。\n\n![](img/d06b1f1cf83677f6647237f0c7827141_47_2.png)\n\
    \n请注意，表达式 **False and False** 返回 **False**，而不是 **True** – 这也许体现了“两个错误不会变成正确”这一格言。\n\
    \n## 检查条件\n\n许多编程语言，如 C++ 或 Java，都有一个 `?:` “三元”运算符，它根据 True 或 False 条件对表达式求值，然后根据求值结果返回两个指定值中的一个。`?:`\
    \ 三元运算符具有这种语法：\n\n```\n(test-expression) ? if-true-return-this : if-false-return-this\n\
    ```\n\n与其他编程语言不同，Python 没有 `?:` 三元运算符，而是有一个以类似方式工作的“条件表达式”，它使用 if 和 else 关键字，其语法如下：\n\
    \n```\nif-true-return-this if (test-expression) else if-false-return-this\n```\n\
    \n虽然条件表达式的语法起初可能看起来令人困惑，但熟悉这个表达式是绝对值得的，因为它可以用最少的代码执行强大的程序分支。例如，要在变量不是值 1 时进行分支：\n\
    \n```\nif-true-do-this if ( var != 1 ) else if-false-do-this\n```\n\n条件表达式可用于\
    \ Python 编程中，将两个变量的最大值或最小值分配给第三个变量。例如，要像这样分配最小值：\n\n```\nc = a if ( a < b ) else\
    \ b\n```\n\n括号中的表达式在变量 a 的值小于变量 b 的值时返回 True – 因此在这种情况下，变量 a 的较小值被分配给变量 c。\n\n\
    类似地，将测试表达式中的 < 小于运算符替换为 > 大于运算符，会将变量 b 的较大值分配给变量 c。\n\n条件表达式的另一个常见用法是在测试表达式中结合\
    \ % 取模运算符，以确定变量的值是奇数还是偶数：\n\n```\nif-true(odd)-do-this if ( var % 2 != 0 ) else\
    \ if-false(even)-do-this\n```\n\n当变量值除以二后有剩余结果时，该数为奇数 – 当没有剩余结果时，该数为偶数。测试表达式 (`var\
    \ % 2 == 1`) 会产生相同的效果，但最好测试不等式 – 发现不同比发现相同更容易。\n\n![](img/d06b1f1cf83677f6647237f0c7827141_49_0.png)\n\
    \n在一般编程术语中，“表达式”始终返回一个值，而“语句”则不一定 – 但语句可以包含一个或多个表达式。\n\n![](img/d06b1f1cf83677f6647237f0c7827141_49_1.png)\n\
    \n条件表达式实际上有三个操作数 – 测试表达式和两个可能的返回值。\n\n1. 通过初始化两个具有整数值用于条件评估的变量，开始编写一个新的 Python\
    \ 脚本\n   - `a = 1`\n   - `b = 2`\n\n![](img/d06b1f1cf83677f6647237f0c7827141_49_2.png)\n\
    \n2. 接下来，添加语句以显示条件评估的结果 – 描述第一个变量的值\n   - `print('\\nVariable a Is :', 'One' if\
    \ (a == 1) else 'Not One')`\n   - `print('Variable a Is :', 'Even' if (a % 2 ==\
    \ 0 ) else 'Odd')`\n\n3. 现在，添加语句以显示条件评估的结果 – 描述第二个变量的值\n   - `print('\\nVariable\
    \ b Is :', 'One' if (b == 1) else 'Not One')`\n   - `print('Variable b Is :',\
    \ 'Even' if (b % 2 == 0 ) else 'Odd')`\n\n4. 然后，添加一个语句将条件评估的结果分配给一个新变量\n   - `max\
    \ = a if ( a > b ) else b`\n\n5. 最后，添加一个语句以显示分配的结果 – 标识两个变量值中较大的那个\n   - `print(\
    \ \"\\nGreater Value Is:\", max )`\n\n将文件保存在你的脚本目录中，然后在那里打开一个命令提示符窗口并运行此程序 – 以查看条件表达式运算的结果。\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_50_0.png)\n\n你可能会发现，一些 Python 程序员不喜欢条件表达式，因为他们认为其语法与易于阅读的原则相矛盾。\n\
    \n## 设置优先级\n\n运算符优先级决定了 Python 解释器评估表达式的顺序。例如，在表达式 `3 * 8 + 4` 中，默认的优先级顺序确定乘法先完成，因此结果是\
    \ 28（24 + 4）。\n\n![](img/d06b1f1cf83677f6647237f0c7827141_51_0.png)\n\n`*` 乘法运算符位于\
    \ `+` 加法运算符之上的一行 – 因此在表达式 `3 * 8 + 4` 中，乘法在加法之前完成。\n\n下表按降序列出了运算符优先级 – 中间一行的具有最高优先级，较低行的依次具有较低优先级。同一行上运算符的优先级按从左到右的顺序链接：\n\
    \n| 运算符 | 描述 |\n| :--- | :--- |\n| `**` | 幂 |\n| `+` | 正号 |\n| `-` | 负号 |\n| `~`\
    \ | 按位取反 |\n| `*` | 乘法 |\n| `/` | 除法 |\n| `//` | 地板除法 |\n| `%` | 取模 |\n| `+` |\
    \ 加法 |\n| `-` | 减法 |\n| `|` | 按位或 |\n| `^` | 按位异或 |\n| `&` | 按位与 |\n| `>>` | 按位右移\
    \ |\n| `<<` | 按位左移 |\n| `>`, `>=`, `<`, `<=`, `==`, `!=` | 比较 |\n| `=`, `%=`,\
    \ `/=`, `//=`, `-=` , `+=`, `*=`, `**=` | 赋值 |\n| `is`, `is not` | 同一性 |\n| `in`,\
    \ `not in` | 成员资格 |\n| `not` | 布尔非 |\n| `and` | 布尔与 |\n| `or` | 布尔或 |\n\n![](img/d06b1f1cf83677f6647237f0c7827141_52_0.png)\n\
    \n按位、同一性和成员资格运算符将在本书后面引入 – 但为了完整性包含在此处。\n\n1. 通过初始化三个具有整数值用于优先级比较的变量，开始编写一个新的\
    \ Python 脚本\n   - `a = 2`\n   - `b = 4`\n   - `c = 8`\n\n![](img/d06b1f1cf83677f6647237f0c7827141_52_1.png)\n\
    \n2. 接下来，添加语句以显示默认优先级的结果以及强制在乘法之前执行加法的结果\n   ```python\n   print('\\nDefault Order:\\\
    t', a, ' * ', c, '+', b, ' =', a * c + b)\n   print('Forced Order:\\t', a, ' *\
    \ ( ', c, '+', b, ') =', a * (c + b))\n   ```\n\n3. 现在，添加语句以显示默认优先级的结果以及强制在除法之前执行减法的结果\n\
    \   ```python\n   print('\\nDefault Order:\\t', c, '//', b, '-', a, '=', c //\
    \ b - a)\n   print('Forced Order:\\t', c, '// (', b, '-', a, ') =', c // (b -\
    \ a))\n   ```\n\n4. 最后，添加语句以显示默认优先级的结果以及强制在取模运算之前和在幂运算之前执行加法的结果\n   ```python\n\
    \   print('\\nDefault Order:\\t', c, '%', a, '-', b, '=', c % a + b)\n   print('Forced\
    \ Order:\\t', c, '% (', a, '-', b, ') =', c % (a + b))\n   \n   print('\\nDefault\
    \ Order:\\t', c, '**', a, '+', b, '=', c ** a + b)\n   print('Forced Order:\\\
    t', c, '** (', a, '+', b, ') =', c ** (a + b))\n   ```\n\n5. 将文件保存在你的脚本目录中，然后在那里打开一个命令提示符窗口并运行此程序\
    \ – 以查看默认和显式优先级的结果。\n\n![](img/d06b1f1cf83677f6647237f0c7827141_53_0.png)\n\n\
    ![](img/d06b1f1cf83677f6647237f0c7827141_53_1.png)\n\n`//` 地板除法运算符在小数点后截断浮点值 –\
    \ 但 `/` 除法运算符保留它们。\n\n![](img/d06b1f1cf83677f6647237f0c7827141_53_2.png)\n\n不要依赖默认优先级\
    \ – 始终使用括号来澄清你的表达式。\n\n"
