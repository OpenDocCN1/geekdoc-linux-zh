    | :---: | :--- |\n| **name** | 已打开文件的名称 |\n| **mode** | 文件打开时的模式 |\n| **closed**\
    \ | 表示 **True** 或 **False** 的状态布尔值 |\n| **readable()** | 表示 **True** 或 **False**\
    \ 的读取权限布尔值 |\n| **writable()** | 表示 **True** 或 **False** 的写入权限布尔值 |\n\n![](img/d06b1f1cf83677f6647237f0c7827141_162_0.png)\n\
