  mdcn: "\n\n### 检查内置属性\n\n每个 Python 类在创建时都会自动拥有许多内置的私有属性，其值可以通过点符号语法引用。例如，使用 *类名*.__doc__\
    \ 可以查看指定类名所对应的文档字符串属性值。\n\n内置的 dir() 函数可用于显示类的所有内置属性列表，它是通过测试每个属性名是否以下划线开头来实现的，指定的类名需放在括号内。\n\
    \n内置的 __dict__ 属性包含一个“命名空间”字典，其中存储了类组成部分的键及其关联的值。基类的字典包括其默认的 _init_() 方法，以及所有的类方法和属性。类实例的字典则包含其实例属性。\n\
    \n- 1. 通过使 *此处* 创建的 Bird 类可用，开始一个新的 Python 脚本\n\n```python\nfrom Bird import *\n\
    ```\n\n![](img/d06b1f1cf83677f6647237f0c7827141_186_0.png)\n\n- 2. 接下来，添加一条语句以创建该类的一个实例\n\
    \n```python\nzola = Bird('Beep, beep!')\n```\n\n- 3. 现在，添加一个循环以显示所有内置实例属性\n\n\
    ```python\nprint('\\nBuilt-in Instance Attributes...')\nfor attrib in dir( zola\
    \ ) :\n    if attrib[0] != '_' :\n        print(attrib )\n```\n\n- 4. 然后，添加一个循环以显示类字典中的所有项目\n\
    \n```python\nprint('\\nClass Dictionary...')\nfor item in Bird.__dict__ :\n  \
    \  print(item,':',Bird.__dict__[item])\n```\n\n- 最后，添加一个循环以显示实例字典中的所有项目\n\n```python\n\
    print(\"\\nInstance Dictionary...\")\nfor item in zola.__dict__ :\n    print(item\
    \ ,':',zola.__dict__[ item ])\n```\n\n- 将该文件保存到你的脚本目录中，然后在那里打开一个命令提示窗口并运行此程序——以检查内置属性\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_187_0.png)\n\n字典中存储的函数值是该函数所存储的机器地址。\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_187_1.png)\n\n![](img/d06b1f1cf83677f6647237f0c7827141_188_0.png)\n\
    \nBird - zola.\n\n类字典的输出显示了所有的类属性，而实例字典的输出仅显示实例属性——类属性由实例共享。\n\n![](img/d06b1f1cf83677f6647237f0c7827141_188_1.png)\n\
    \n在这个程序中，首先创建了一个类实例，因此在列出字典之前，`__init__()` 方法已被调用以递增 `count` 值。\n\n![](img/d06b1f1cf83677f6647237f0c7827141_188_2.png)\n\
    \n`__weakref__` 属性仅内部用于自动垃圾回收程序中的“弱引用”，以提高效率。\n\n### 垃圾回收\n\n当创建一个类实例对象时，它会分配一个唯一的内存地址，可以使用内置的\
    \ `id()` 函数查看。Python 自动执行“垃圾回收”，通过定期删除不再需要的对象（如类实例）来释放内存空间——从而使它们的内存地址变为空闲。\n\n\
    每当对象被赋予新名称或放入容器（如列表）中时，其“引用计数”会增加。相反，当这些引用被移除或超出作用域时，其计数会减少。当该计数为零时，对象就变得可以被回收了。\n\
    \n销毁类的实例可能会（可选地）调用一个“析构函数”以执行 `__del__()` 方法——显式地回收占用的内存空间并执行任何指定的语句。\n\n- 1.\
    \ 通过声明一个类来开始一个新的 Python 脚本，该类包含一个初始化方法，用于创建两个实例变量，以及一个用于显示其中一个变量值的方法\n\n```python\n\
    class Songbird :\n    def __init__ ( self , name , song ) :\n        self.name\
    \ = name\n        self.song = song\n        print(self.name , 'Is Born...')\n\
    ```\n\n![](img/d06b1f1cf83677f6647237f0c7827141_189_0.png)\n\n- 2. 接下来，添加一个方法，用于简单地显示两个变量值\n\
    \n```python\ndef sing ( self ) :\n    print(self.name , 'Sings:' , self.song )\n\
    ```\n\n- 3. 现在，添加一个析构方法，以便在类的实例被销毁时进行确认——然后保存此文件\n\n```python\ndef __del__ ( self\
    \ ) :\n    print(self.name , 'Flew Away!\\n')\n```\n\n- 4. 通过使类文件的功能可用，开始另一个 Python\
    \ 脚本\n\n```python\nfrom Songbird import *\n```\n\n![](img/d06b1f1cf83677f6647237f0c7827141_190_0.png)\n\
    \n- 5. 接下来，创建该类的一个实例，然后显示其实例属性值及其身份地址\n\n```python\nbird_1 = Songbird('Koko',\
    \ 'Tweet, tweet!\\n')\nprint(bird_1.name, 'ID:', id(bird_1))\nbird_1.sing()\n\
    ```\n\n- 6. 现在，删除此实例——调用其析构方法\n\n```python\ndel bird_1\n```\n\n![](img/d06b1f1cf83677f6647237f0c7827141_190_1.png)\n\
    \n- 7. 创建另外两个类的实例，然后显示它们的实例属性值和身份地址\n\n```python\nbird_2 = Songbird('Louie', 'Chirp,\
    \ chirp!\\n')\nprint(bird_2.name, 'ID:', id(bird_2))\nbird_2.sing()\n\nbird_3\
    \ = Songbird('Misty', 'Squawk, squawk!\\n')\nprint(bird_3.name, 'ID:', id(bird_3))\n\
    bird_3.sing()\n```\n\n![](img/d06b1f1cf83677f6647237f0c7827141_190_2.png)\n\n\
    - 8. 最后，删除这些实例——调用它们的析构函数\n\n```python\ndel bird_2\ndel bird_3\n```\n\n![](img/d06b1f1cf83677f6647237f0c7827141_191_0.png)\n\
    \n将文件保存到你的脚本目录中，然后在那里打开一个命令提示窗口并运行此程序——以查看由垃圾回收处理的内存空间\n\n```text\nCommand Prompt\n\
    C:\\MyScripts>python garbage.py\nKoko Is Born...\nKoko ID: 24243888\nKoko Sings:\
    \ Tweet, tweet!\n\nKoko Flew Away!\n\nLouie Is Born...\nLouie ID: 24243888\nLouie\
    \ Sings: Chirp, chirp!\n\nMisty Is Born...\nMisty ID: 24244016\nMisty Sings: Squawk,\
    \ squawk!\n\nLouie Flew Away!\n\nMisty Flew Away!\n\nC:\\MyScripts>\n```\n\n![](img/d06b1f1cf83677f6647237f0c7827141_191_1.png)\n\
    \n这里创建的第二个实例被分配了当第一个实例被删除时腾出的内存地址。\n\n### 继承特性\n\nPython 类可以像之前的例子那样作为一个全新的类创建，也可以从一个现有类中“派生”。重要的是，派生类继承自其父类（基类）的成员——除了它自己的成员外。\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_192_0.png)\n\n从基类继承成员的能力允许创建共享某些在基类中定义的公共属性的派生类。例如，“多边形”基类可以定义宽度和高度属性，这些是所有多边形共有的。“矩形”和“三角形”类可以从多边形类派生——除了定义其独特特性的自身成员外，还继承了宽度和高度属性。\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_192_1.png)\n\n继承的优点极其强大，它是面向对象编程（OOP）的第二原则。\n\
    \n派生类的声明在其类名后添加 () 括号，指定其父基类的名称。\n\n- 1. 创建一个新的 Python 脚本，声明一个包含两个类变量和一个用于设置其值的方法的基类\n\
