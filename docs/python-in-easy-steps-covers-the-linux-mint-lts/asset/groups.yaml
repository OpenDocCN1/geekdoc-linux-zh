    guy_1.speak('It's a beautiful evening.\\n')\nguy_2.speak('Es una tarde hermosa.\\\
    n')\n```\n\n![](img/d06b1f1cf83677f6647237f0c7827141_198_0.png)\n\n7. 最后，显式调用基类方法，传递对每个派生类的引用\
    \ – 但不为 “msg” 变量传递，因此其默认值将被使用\n\n```python\nPerson.speak(guy_1)\nPerson.speak(guy_2)\n\
    ```\n\n8. 将文件保存到脚本目录中，然后在那里打开一个命令提示符窗口并运行此程序 – 以查看来自重写和基类方法的输出\n\n![](img/d06b1f1cf83677f6647237f0c7827141_198_1.png)\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_198_2.png)\n\n派生类中的方法声明必须与基类中的方法声明完全匹配才能重写它。\n\
    \n### 利用多态性\n\n面向对象编程（OOP）的三大基石是封装、继承和多态性。本章前面的示例已经展示了如何在 Python 类中封装数据，以及派生类如何继承其基类的属性。本示例介绍了多态性这一最终基石原则。\n\
    \n术语 “polymorphism”（源自希腊语，意为“多种形式”）描述了根据上下文为实体分配不同含义或目的的能力。\n\n在 Python 中，+ 字符实体可以被称为多态的，因为它在数值操作数的上下文中表示算术加法运算符，或在字符操作数的上下文中表示字符串连接运算符。\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_199_0.png)\n\n也许更重要的是，Python 类方法也可以是多态的，因为\
    \ Python 语言使用 “鸭子类型” – 意思是……如果它走起来像鸭子，游起来像鸭子，叫起来像鸭子，那么这只鸟就被认为是鸭子。\n\n在鸭子类型语言中，你可以创建一个函数来接受任何类型的对象并调用该对象的方法。如果对象确实具有被调用的方法（被认定为鸭子），则它们被执行，否则函数会报告运行时错误。\n\
    \n可以创建多个类的同名方法，并且这些类的实例将执行相应的版本。\n\n1. 创建一个新的 Python 脚本，声明一个类，其中包含方法来显示该类特有的字符串\n\
    \n```python\nclass Duck:\n    def talk(self):\n        print('Duck Says: Quack!')\n\
    \n    def coat(self):\n        print('Duck Wears: Feathers')\n```\n\n![](img/d06b1f1cf83677f6647237f0c7827141_200_0.png)\n\
    \n2. 接下来，创建一个 Python 脚本，声明一个类，其中包含同名方法，但用于显示该类特有的字符串\n\n```python\nclass Mouse:\n\
    \    def talk(self):\n        print('Mouse Says: Squeak!')\n\n    def coat(self):\n\
    \        print('Mouse Wears: Fur')\n```\n\n![](img/d06b1f1cf83677f6647237f0c7827141_200_1.png)\n\
    \n3. 保存这两个类文件，然后开始一个新的 Python 脚本，使两个类的特性可用\n\n```python\nfrom Duck import *\n\
    from Mouse import *\n```\n\n![](img/d06b1f1cf83677f6647237f0c7827141_200_2.png)\n\
    \n4. 接下来，定义一个函数，该函数接受任何单个对象作为其参数并尝试调用该对象的方法\n\n```python\ndef describe(object):\n\
    \    object.talk()\n    object.coat()\n```\n\n5. 现在，创建每个类的实例对象\n\n```python\n\
    donald = Duck()\nmickey = Mouse()\n```\n\n![](img/d06b1f1cf83677f6647237f0c7827141_201_0.png)\n\
    \n6. 最后，添加语句来调用函数并将每个实例对象作为参数传递给它\n\n```python\ndescribe(donald)\ndescribe(mickey)\n\
    ```\n\n![](img/d06b1f1cf83677f6647237f0c7827141_201_1.png)\n\n7. 将文件保存到脚本目录中，在那里打开一个命令提示符窗口，然后运行此程序\
    \ – 以查看调用相应版本的方法\n\n![](img/d06b1f1cf83677f6647237f0c7827141_201_2.png)\n\n使用\
    \ Python 进行面向对象编程允许数据封装、继承和多态性。基类方法可以被派生类中同名方法重写。然而，Python 不支持在其他语言中发现的 “重载” 技术\
    \ – 即在单个类中创建具有不同参数列表的同名方法。\n\n![](img/d06b1f1cf83677f6647237f0c7827141_202_0.png)\n\
    \n一个类只能有一个具有给定名称的方法 – Python 不支持方法重载。\n\n## 总结\n\n- 类是一个数据结构原型，用其方法和属性成员描述对象属性。\n\
    - 每个类声明以 class 关键字开始，随后是一个缩进的代码块，其中可能包含类文档字符串、类变量和类方法。\n- 类变量具有全局作用域，但实例变量（在方法定义内声明）仅具有局部作用域。\n\
    - 实例变量在类结构中安全地封装数据，并在创建类实例时初始化。\n- 类的属性通过点符号引用，并在内部使用 self 前缀寻址。\n- 类实例是原型的副本，当实例首次创建时自动调用其\
    \ `__init__()` 方法。\n- 类的属性可以使用点符号或内置函数 `getattr()`、`hasattr()`、`setattr()` 和 `delattr()`\
    \ 添加、修改或删除。\n- Python 自动提供的属性名称以下划线字符开头，以示表示私有性。\n- 内置的 `__dict__` 属性包含类组件键和值的命名空间字典。\n\
    \n"
