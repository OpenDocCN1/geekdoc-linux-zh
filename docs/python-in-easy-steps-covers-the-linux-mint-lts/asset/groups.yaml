    \n无论使用哪种方法进入交互模式，Python 解释器对在其 >>> 主提示符处输入的commands 反应方式都是相同的。在最简单的形式中，解释器可以用作计算器。\n\
    \n1.  进入 Python 交互模式，使用上文概述的任何方法，然后输入一个简单的加法并按 Return 键以查看解释器打印出总和\n\n![](img/d06b1f1cf83677f6647237f0c7827141_19_1.png)\n\
    \nPython 解释器也理解表达式，因此可以使用括号来赋予更高的优先级 – 括号内封闭的表达式部分将首先被计算。\n\n2.  接下来，在 Python\
