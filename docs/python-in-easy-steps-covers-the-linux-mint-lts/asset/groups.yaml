    \ Interpreter Location:' , sys.executable )\n   ```\n\n4. 然后，添加语句以显示 Python 解释器查找模块文件的所有目录列表\n\
    \   ```python\n   print( 'Python Module Search Path: ' )\n   for dir in sys.path\
    \ :\n       print( dir )\n   ```\n\n"
