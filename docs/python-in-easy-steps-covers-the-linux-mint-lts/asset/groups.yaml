    \n关于如何在脚本代码中处理运行时异常错误的详细信息请见此处。\n\n## 总结\n\n- Python 是一种高级编程语言，由 Python 解释器处理以产生结果。\n\
    - Python 使用缩进来将语句分组为代码块，而其他语言使用关键字或标点符号。\n- Python 2.7 是 2.x 开发分支的最终版本，但 3.x 分支包含最新的改进。\n\
    - Windows 用户可以通过安装程序安装 Python，Linux 用户可以通过其包管理器安装 Python。\n- Python 解释器有一种交互模式，你可以在其中测试代码片段，这对于调试代码非常有用。\n\
    - Python 程序只是一个使用纯文本编辑器创建并保存为“.py”文件扩展名的文本文件。\n- Python 的 print() 函数输出其括号内指定的字符串。\n\
    - 字符串值必须用引号括起来。\n- 如果在同一系统上安装了多个版本的 Python，则明确调用所需的解释器非常重要。\n- Python 变量是一个命名容器，其存储的值可以通过该变量的名称引用。\n\
