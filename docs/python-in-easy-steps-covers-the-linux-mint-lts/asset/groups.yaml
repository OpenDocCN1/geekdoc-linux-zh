    6. 现在，再次调用每个函数并传递参数值给每个函数，然后保存文件\n   ```python\n   bark( 'Pooch' )\n   lick( 'Pooch'\
    \ )\n   nap( 'Pooch' )\n   ```\n\n7. 通过提供“dog”模块的所有函数，开始另一个 Python 脚本\n   ```python\n\
    \   from dog import *\n   ```\n\n   ![](img/d06b1f1cf83677f6647237f0c7827141_123_0.png)\n\
    \n8. 然后，请求用户输入一个名称以覆盖默认参数值\n   ```python\n   pet = input( 'Enter A Pet Name: ')\n\
    \   ```\n\n9. 最后，调用每个函数，将用户定义的值作为参数传递\n   ```python\n   bark( pet )\n   lick(\
    \ pet )\n   nap( pet )\n   ```\n\n10. 将文件保存在您的脚本目录中，然后在那里打开一个命令提示符窗口并运行这些程序 –\
    \ 以查看来自导入函数的输出\n\n   ```text\n   C:\\>MyScripts>python pooch.py\n   A Dog Says\
    \ WOOF!\n   A Dog Drinks Water\n   A Dog Sleeps In The Sun\n   Pooch Says WOOF!\n\
    \   Pooch Drinks Water\n   Pooch Sleeps In The Sun\n\n   C:\\>MyScripts>python\
    \ fido.py\n   Enter A Pet Name: Fido\n   Fido Says WOOF!\n   Fido Drinks Water\n\
    \   Fido Sleeps In The Sun\n   C:\\>MyScripts>\n   ```\n\n   ![](img/d06b1f1cf83677f6647237f0c7827141_124_0.png)\n\
    \n对于较大的程序，您可以将模块导入到其他模块中以构建模块层次结构。\n\n## 询问系统\n\nPython 包含“sys”和“keyword”模块，它们对于询问\
    \ Python 系统本身非常有用。关键字模块在其 kwlist 属性中包含所有 Python 关键字的列表，并提供了 iskeyword() 方法，如果您想测试一个单词的话。\n\
    \n您可以使用交互模式（Interactive Mode）的帮助系统来探索“sys”模块的许多功能，实际上也可以是 Python 的任何功能。只需在 >>>\
    \ 提示符下输入 help() 来启动帮助系统，然后在该出现的 help> 提示符下输入 sys。\n\n也许最有用的是，“sys”模块具有包含 Python\
    \ 版本号、系统中解释器位置以及解释器寻找模块文件的所有目录列表的属性 – 因此，如果您将模块文件保存在这些目录中的任何一个里，您可以确信解释器会找到它们。\n\
    \n1. 通过导入“sys”和“keyword”模块以提供其功能，开始一个新的 Python 脚本\n   ```python\n   import sys\
