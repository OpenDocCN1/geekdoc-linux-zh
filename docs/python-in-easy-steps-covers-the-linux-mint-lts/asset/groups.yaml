    # Uploading files


    An HTML form can provide a file selection facility, which calls upon the operating
    system’s “Choose File” dialog, to allow the user to browse their local file system
    and select a file. To enable this facility the HTML <form> tag must include an
    enctype attribute specifying the encoding type as “multipart/form-data”.


    The full path address of the file selected for upload is a value stored in the
    FieldStorage object list that can be accessed using its associated key name. Usefully,
    the file name can be stripped from the path address by the “os” module’s path.basename()
    method.


    A copy of an uploaded file can be written on the web server by reading from the
    FieldStorage object’s file property.


    ![](img/d06b1f1cf83677f6647237f0c7827141_227_0.png)


