    \ variable’s decimal value by binary bit manipulation\n\n   ```python\n   # 1010\
    \ ^ 0101 = 1111 (decimal 15)\n   a = a ^ b\n   ```\n\n3. Now, add a statement\
    \ to change the second variable’s decimal value by binary bit manipulation\n\n\
    \   ```python\n   # 1111 ^ 0101 = 1010 (decimal 10)\n   b = a ^ b\n   ```\n\n\
