    \n为了提高清晰度，你可以在分隔符字符周围包含空格字符——就像本例中星号字符周围显示的那样。\n\n## 纠正错误\n\n在 Python 编程中，可能会出现三种类型的错误。识别不同的错误类型有助于更轻松地纠正它们：\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_30_0.png)\n\n编程错误通常被称为“bug”，而寻找这些错误的过程通常被称为“debugging”（调试）。\n\
    \n- **语法错误** – 发生在程序执行期间，即程序运行时。例如，字符串周围缺少引号。解释器会停止并报告错误，而不执行程序。\n- **运行时错误**\
    \ – 发生在程序执行期间，即程序运行时。例如，后来变量名拼写错误，导致变量无法被识别。解释器会运行程序，但在遇到错误时停止，并将错误的性质报告为“Exception”（异常）。\n\
