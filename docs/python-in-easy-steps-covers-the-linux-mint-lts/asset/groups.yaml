    \n# 2\n## 执行操作\n\n本章介绍 Python 运算符，并演示它们可以执行的操作。\n\n- 执行算术运算\n- 赋值\n- 比较值\n- 评估逻辑\n\
    - 检查条件\n- 设置优先级\n- 转换数据类型\n- 操作位\n- 总结\n\n## 执行算术运算\n\n在 Python 编程中常用的算术运算符在下表中列出，并附带它们执行的操作：\n\
    \n| 运算符 | 操作 |\n| :------- | :------- |\n| + | 加法 |\n| - | 减法 |\n| * | 乘法 |\n\
    | / | 除法 |\n| % | 取模 |\n| // | 地板除法 |\n| ** | 指数 |\n\n加法、减法、乘法和除法运算符的行为符合预期。然而，必须注意对表达式进行分组，当使用多个运算符时，以澄清表达式\
    \ – 最内层括号内的操作最先执行。例如，对于这个表达式：\n\n```\na = b * c - d % e / f\n```\n\n![](img/d06b1f1cf83677f6647237f0c7827141_36_0.png)\n\
    \n与运算符一起用于形成表达式的值称为“操作数” – 在表达式 2 + 3 中，数值 2 和 3 是操作数。\n\n希望执行操作的顺序不明确，但可以通过添加括号来澄清，如下所示：\n\
    \n```\na = ( b * c ) - ( ( d % e ) / f )\n```\n\n`%` 取模运算符将第一个给定的数除以第二个给定的数，并返回操作的余数。这对于确定一个数是奇数还是偶数很有用。\n\
    \n`//` 地板除法运算符执行与 `/` 除法运算符完全相同的操作，但在小数点处截断结果 – 删除任何浮点值。\n\n`**` 指数运算符返回第一个操作数提升到第二个操作数幂的结果。\n\
