  md: "\n### Examining built-in attributes\n\nEach Python class is automatically created\
    \ with a number of built-in private attributes whose values can be referenced\
    \ using dot notation. For example, with *class-name*.__doc__ to see the document\
    \ string attribute value of a specified class name.\n\nThe built-in dir() function\
    \ can be used to display a list of all the built-in attributes in a class specified\
    \ within its parentheses by testing whether each attribute name begins with an\
    \ underscore.\n\nThe built-in __dict__ attribute contains a “namespace” dictionary\
    \ of class component keys and their associated values. The dictionary of a base\
    \ class includes its default _init_() method, and all class methods and attributes.\
    \ The dictionary of a class instance includes its instance attributes.\n\n- 1.\
    \ Start a new Python script by making features of the Bird class available that\
    \ was created *here*\n\n```python\nfrom Bird import *\n```\n\n![](img/d06b1f1cf83677f6647237f0c7827141_186_0.png)\n\
    \n- 2. Next, add a statement to create an instance of the class\n\n```python\n\
    zola = Bird('Beep, beep!')\n```\n\n- 3. Now, add a loop to display all built-in\
    \ instance attributes\n\n```python\nprint('\\nBuilt-in Instance Attributes...')\n\
    for attrib in dir( zola ) :\n    if attrib[0] != '_' :\n        print(attrib )\n\
    ```\n\n- 4. Then, add a loop to display all items in the class dictionary\n\n\
    ```python\nprint('\\nClass Dictionary...')\nfor item in Bird.__dict__ :\n    print(item,':',Bird.__dict__[item])\n\
    ```\n\n- Finally, add a loop to display all items in the instance dictionary\n\
    \n```python\nprint(\"\\nInstance Dictionary...\")\nfor item in zola.__dict__ :\n\
    \    print(item ,':',zola.__dict__[ item ])\n```\n\n- Save the file in your scripts\
    \ directory, then open a Command Prompt window there and run this program — to\
    \ examine the built-in attributes\n\n![](img/d06b1f1cf83677f6647237f0c7827141_187_0.png)\n\
    \nThe function values stored in the dictionary are the machine addresses where\
    \ the functions are stored.\n\n![](img/d06b1f1cf83677f6647237f0c7827141_187_1.png)\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_188_0.png)\n\nBird - zola.\n\nThe class\
    \ dictionary output displays all class attributes, whereas the instance dictionary\
    \ output displays only instance attributes – the class attributes are shared by\
    \ the instance.\n\n![](img/d06b1f1cf83677f6647237f0c7827141_188_1.png)\n\nA class\
    \ instance is first created in this program so the `__init__()` method has been\
    \ called to increment the `count` value before the dictionary gets listed.\n\n\
    ![](img/d06b1f1cf83677f6647237f0c7827141_188_2.png)\n\nThe `__weakref__` attribute\
    \ is simply used internally for automatic garbage collection of “weak references”\
    \ in the program for efficiency.\n\n### Collecting garbage\n\nWhen a class instance\
    \ object is created it is allocated a unique memory address that can be seen using\
    \ the built-in `id()` function. Python automatically performs “garbage collection”\
    \ to free up memory space by periodically deleting un-needed objects such as class\
    \ instances – so their memory address becomes vacant.\n\nWhenever an object gets\
    \ assigned a new name or gets placed in a container, such as a list, its “reference\
    \ count” increases. Conversely, whenever these are removed or go out of scope\
    \ its count decreases. The object becomes eligible for collection when this count\
    \ is zero.\n\nDestroying an instance of a class may, optionally, call upon a “destructor”\
    \ to execute a `__del__()` method – explicitly reclaiming occupied memory space\
    \ and executing any specified statements.\n\n- 1. Start a new Python script by\
    \ declaring a class with an initializer method creating two instance variables\
    \ and a method to display one of those variable values\n\n```python\nclass Songbird\
    \ :\n    def __init__ ( self , name , song ) :\n        self.name = name\n   \
    \     self.song = song\n        print(self.name , 'Is Born...')\n```\n\n![](img/d06b1f1cf83677f6647237f0c7827141_189_0.png)\n\
    \n- 2. Next, add a method to simply display both variable values\n\n```python\n\
    def sing ( self ) :\n    print(self.name , 'Sings:' , self.song )\n```\n\n- 3.\
    \ Now, add a destructor method for confirmation when instances of the class are\
    \ destroyed – then save this file\n\n```python\ndef __del__ ( self ) :\n    print(self.name\
    \ , 'Flew Away!\\n')\n```\n\n- 4. Start another Python script by making features\
    \ of the class file available\n\n```python\nfrom Songbird import *\n```\n\n![](img/d06b1f1cf83677f6647237f0c7827141_190_0.png)\n\
    \n- 5. Next, create an instance of the class, then display its instance attribute\
    \ values and its identity address\n\n```python\nbird_1 = Songbird('Koko', 'Tweet,\
    \ tweet!\\n')\nprint(bird_1.name, 'ID:', id(bird_1))\nbird_1.sing()\n```\n\n-\
    \ 6. Now, delete this instance – calling its destructor method\n\n```python\n\
    del bird_1\n```\n\n![](img/d06b1f1cf83677f6647237f0c7827141_190_1.png)\n\n- 7.\
    \ Create two more instances of the class, then display their instance attribute\
    \ values and their identity addresses\n\n```python\nbird_2 = Songbird('Louie',\
    \ 'Chirp, chirp!\\n')\nprint(bird_2.name, 'ID:', id(bird_2))\nbird_2.sing()\n\n\
    bird_3 = Songbird('Misty', 'Squawk, squawk!\\n')\nprint(bird_3.name, 'ID:', id(bird_3))\n\
    bird_3.sing()\n```\n\n![](img/d06b1f1cf83677f6647237f0c7827141_190_2.png)\n\n\
    - 8. Finally, delete these instances – calling their destructors\n\n```python\n\
