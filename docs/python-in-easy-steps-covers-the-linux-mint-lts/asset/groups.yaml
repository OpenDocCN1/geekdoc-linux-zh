    \nThe class documentation string can be accessed via the special `__doc__` docstring\
    \ attribute with `ClassName.__doc__`.\n\n![](img/d06b1f1cf83677f6647237f0c7827141_178_1.png)\n\
    \nWhile a program class cannot perfectly emulate a real-world object, the aim\
    \ is to encapsulate all relevant attributes and actions.\n\n## Creating instance\
    \ objects\n\nAn \"instance\" of a class object is simply a copy of the prototype\
