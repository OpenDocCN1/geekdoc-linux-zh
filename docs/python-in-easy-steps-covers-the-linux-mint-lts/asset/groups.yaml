    \n要确认您的计算机上现在可用最新的 Python 版本，请启动一个终端窗口并准确输入此明确命令 python3 -V\n\n```\nmike@ubuntu:~\
    \ $ python3 -V\nPython 3.5.2\nmike@ubuntu:~ $\n```\n\n您也可以选择安装 Python 3.5 的 IDLE，但这并不是绝对要求，因为本书中的所有\
