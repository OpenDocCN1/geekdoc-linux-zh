  mdcn: "\n## 限制性列表\n\n### 元组\n\n常规列表中的值可以在程序运行过程中被更改（它们是“可变的”），但可以创建具有固定“不可变”值的列表，这些值不能被程序更改。\n\
    \n一种具有限制性的不可变 Python 列表被称为“元组”（tuple），它是通过在一个称为“元组打包”（tuple packing）的过程中，将值作为逗号分隔的列表分配在括号内来创建的：\n\
    \n```python\ncolors-tuple = ( 'Red','Green','Red','Blue','Red' )\n```\n\n可以使用元组名称后跟包含该元素索引号的方括号来引用元组中的单个元素。有用的是，存储在元组内的所有值可以在一个称为“序列解包”（sequence\
    \ unpacking）的过程中分配给单独的变量：\n\n```python\na, b, c, d, e = colors-tuple\n```\n\n\
    ### 集合\n\n常规列表中的值可以在其元素中重复，如上文的元组所示，但可以创建一个不允许重复值的唯一值列表。一种具有限制性的 Python 唯一值列表被称为“集合”（set），它是通过将值作为逗号分隔的列表分配在花括号（braces）内来创建的：\n\
    \n```python\nphonetic-set = { 'Alpha','Bravo','Charlie'}\n```\n\n集合中的单个元素不能通过集合名称后跟包含索引号的方括号来引用，但集合具有方法，可以通过点后缀添加到集合名称进行操作和比较：\n\
    \n| 集合方法： | 描述： |\n| :--- | :--- |\n| `set.add(x)` | 将项 x 添加到集合 |\n| `set.update(x,y,z)`\
    \ | 将多个项添加到集合 |\n| `set.copy()` | 返回集合的副本 |\n| `set.pop()` | 从集合中移除一个随机项 |\n|\
    \ `set.discard( x )` | 如果在集合中找到项 x，则移除该项 |\n| `set1.intersection(set2)` | 返回在两个集合中都出现的项\
    \ |\n| `set1.difference(set2)` | 返回在 set1 中但不在 set2 中的项 |\n\n![](img/d06b1f1cf83677f6647237f0c7827141_69_0.png)\n\
    \n与列表的索引编号类似，元组序列中的项从零开始编号。\n\n![](img/d06b1f1cf83677f6647237f0c7827141_69_1.png)\n\
    \n解包元组时，变量的数量必须与项的数量相同。\n\n![](img/d06b1f1cf83677f6647237f0c7827141_69_2.png)\n\
    \n更多集合方法可在 Python 文档中找到。\n\n可以使用 Python 的 `type()` 函数来确定这些列表的数据结构类，并且可以使用 Python\
    \ 内置的成员运算符 `in` 在集合中查找值。\n\n1. 通过初始化一个元组开始新的 Python 脚本，然后显示其内容、长度和类型\n\n```python\n\
    zoo = ('Kangaroo', 'Leopard', 'Moose')\nprint('Tuple:', zoo, '\\tLength:', len(zoo))\n\
    print(type(zoo))\n```\n\n![](img/d06b1f1cf83677f6647237f0c7827141_69_3.png)\n\n\
    2. 接下来，初始化一个集合并添加另一个元素，然后显示其内容、长度和类型\n\n```python\nbag = {'Red', 'Green', 'Blue'}\n\
    bag.add('Yellow')\nprint(f'\\nSet:', bag, '\\tLength', len(bag))\nprint(type(bag))\n\
    ```\n\n3. 现在，添加语句以在集合中查找两个值\n\n```python\nprint(f'\\nIs Green In bag Set?: ',\
    \ 'Green' in bag)\nprint(f'\\nIs Orange In bag Set?: ', 'Orange' in bag)\n```\n\
    \n4. 最后，初始化第二个集合并显示其内容、长度以及两个集合中找到的所有公共值\n\n```python\nbox = {'Red', 'Purple',\
    \ 'Yellow'}\nprint(f'\\nSet:', box, '\\t\\tLength', len(box))\nprint(f'\\tCommon\
    \ To Both Sets:', bag.intersection(box))\n```\n\n5. 将文件保存到脚本目录中，然后在那里打开命令提示符窗口并运行此程序\
    \ – 以查看元组和集合的值\n\n```text\nC:\\MyScripts>python set.py\nTuple: ('Kangaroo', 'Leopard',\
    \ 'Moose')    Length: 3\n<class 'tuple'>\nSet: {'Blue', 'Green', 'Yellow', 'Red'}\
    \     Length: 4\n<class 'set'>\n\nIs Green In bag Set?: True\nIs Orange In bag\
    \ Set?: False\nSet: {'Purple', 'Yellow', 'Red'}            Length: 3\nCommon To\
    \ Both Sets: {'Red', 'Yellow'}\n\nC:\\MyScripts>\n```\n\n![](img/d06b1f1cf83677f6647237f0c7827141_70_0.png)\n\
    \n也可以通过在 `set()` 构造函数的括号内指定花括号包围的列表来创建集合，并使用 `frozenset()` 构造函数创建不可变集合。\n\n##\
    \ 关联列表元素\n\n在 Python 编程中，“字典”（dictionary）是一种可以存储多个数据项作为键值对（key:value）列表的数据容器。与常规列表容器的值不同（它们通过其索引号引用），存储在字典中的值通过其关联的键引用。键在该字典中必须是唯一的，并且通常是一个字符串名称，尽管也可以使用数字。\n\
    \n创建字典只需将键值对作为逗号分隔的列表分配在花括号（braces）之间，并赋予您选择的名称即可。字符串通常必须用引号括起来，并且键及其关联值之间必须有一个冒号\
    \ `:` 字符。\n\n可以通过指定字典名称和该键值对的键给 `del` 关键字来从字典中删除一个键值对。相反，可以通过将值分配给字典名称和一个新键来向字典中添加一个键值对。\n\
    \nPython 字典有一个 `keys()` 方法，可以通过点后缀添加到字典名称以返回该字典中所有键的随机顺序列表。如果您希望将键排序为字母数字顺序，只需将该语句包含在\
    \ Python `sorted()` 函数的括号内即可。\n\n可以使用 Python 的 `in` 运算符搜索字典以检查是否包含特定键，语法为 `key\
    \ in dictionary`。当在指定字典中找到键时，搜索将返回布尔值 `True`，否则将返回 `False`。\n\n字典是 Python 编程中可用的最后一类数据容器。总结来说，各种类型如下：\n\
    \n- **变量** – 存储单个值。\n- **列表** – 按有序索引存储多个值。\n- **元组** – 按序列存储多个固定值。\n- **集合**\
    \ – 在无序集合中存储多个唯一值。\n- **字典** – 存储多个无序键值对。\n\n![](img/d06b1f1cf83677f6647237f0c7827141_72_0.png)\n\
    \n在其他编程语言中，列表通常被称为“数组”，而字典通常被称为“关联数组”。\n\n![](img/d06b1f1cf83677f6647237f0c7827141_72_1.png)\n\
    \n数据经常作为键值对进行关联 – 例如，当您提交网页表单时，在输入字段中输入的文本值通常与该文本字段的名称作为其键进行关联。\n\n1. 通过初始化一个字典开始新的\
    \ Python 脚本，然后显示其键值内容\n\n```python\ndict = { 'name' : 'Bob', 'ref' : 'Python',\
    \ 'sys' : 'Win' }\nprint( 'Dictionary:', dict )\n```\n\n![](img/d06b1f1cf83677f6647237f0c7827141_72_2.png)\n\
    \n2. 接下来，通过其键引用显示单个值\n\n```python\nprint( '\\nReference:', dict[ 'ref' ] )\n```\n\
    \n3. 现在，显示字典中的所有键\n\n```python\nprint( '\\nKeys:', dict.keys() )\n```\n\n4. 从字典中删除一个键值对并添加一个替代键值对，然后显示新的键值内容\n\
    \n```python\ndel dict[ 'name' ]\ndict[ 'user' ] = 'Tom'\nprint( '\\nDictionary:',\
    \ dict )\n```\n\n5. 最后，搜索字典中的特定键并显示搜索结果\n\n```python\nprint('\\nIs There A name\
    \ Key?', 'name' in dict)\n```\n\n6. 将文件保存到脚本目录中，然后在那里打开命令提示符窗口并运行此程序 — 以查看字典的键和值\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_73_0.png)\n\n![](img/d06b1f1cf83677f6647237f0c7827141_73_1.png)\n\
    \n请注意，在字符串中引号前必须有一个反斜杠转义字符 —— 以防止字符串过早终止。\n\n## 使用 if 分支\n\nPython 的 `if` 关键字执行基本的条件测试，将给定表达式评估为布尔值\
    \ `True` 或 `False`。这允许程序根据测试结果以不同方向运行，这被称为“条件分支”。\n\n![](img/d06b1f1cf83677f6647237f0c7827141_74_0.png)\n\
    \n被测试的表达式必须后跟一个冒号 `:`，然后是在测试成功时执行的语句，应位于下方单独的各行中，并且每行都必须从 `if` 测试行缩进。缩进的大小并不重要，但每一行必须相同。因此，语法看起来像这样：\n\
    \n```\nif test-expression :\n    statements-to-execute-when-test-expression-is-True\n\
