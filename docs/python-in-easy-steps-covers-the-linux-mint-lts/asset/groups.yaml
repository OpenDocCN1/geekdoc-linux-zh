    \ `ValueError`，当内置操作或函数接收到值不适当的参数时发生。\n\n每个异常都会返回一个描述性消息，该消息可以有用地通过 `as` 关键字赋值给一个变量。这样就可以在异常发生时，用来显示该异常的性质。\n\
