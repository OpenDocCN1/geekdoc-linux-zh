    \n![热点提示](image_placeholder_3.png)\n\n表达式中的空格会被忽略，因此 8+4 也可以加上空格以提高清晰度 – 如这里所示。\n\
    \n![不要忘记](image_placeholder_4.png)\n\n交互模式主要用于测试代码片段和调试代码。\n\n![注意](image_placeholder_5.png)\n\
    \n“IDLE” 是 Python 集成开发环境（Integrated DeveLopment Environment）的缩写，但功能有限，因此不用于演示本书中的示例。\n\
