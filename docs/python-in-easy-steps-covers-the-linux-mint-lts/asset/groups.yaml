    # ## Launching a window


    The standard Python module that you can use to create graphical applications is
    called “tkinter” – a *toolkit to interface* with the system GUI (Graphical User
    Interface).


    The **tkinter** module can be imported into a program like any other module to
    provide attributes and methods for windowed apps. Every **tkinter** program must
    begin by calling the `Tk()` constructor to create a window object. The window’s
    size can, optionally, be specified as a ‘*widthxheight*’ string argument to the
    window object’s *geometry()* method. Similarly, the window’s title can be specified
    as a ‘*title*’ string argument to the window object’s *title()* method. If not
    specified, default size and title values will be used.


    ![](img/d06b1f1cf83677f6647237f0c7827141_233_0.png)


    > There can be only one call to the `Tk()` constructor and it must be at the start
    of the program code.


    Every **tkinter** program must also call the window object’s **mainloop()** method
    to capture events, such as when the user closes the window to quit the program.
    This loop should appear at the end of the program as it also handles window updates
    that may be implemented during execution.


    With **tkinter**, all the graphical controls that can be included in the application
    window, such as buttons or checkboxes, are referred to as “widgets”. Perhaps the
    simplest widget is a non-interactive label object that merely displays text or
    an image in the app interface. A label object can be created by specifying the
    window object’s name and *text=''string''* as arguments to a *Label()* constructor.
    Once created, each widget, such as a label, must then be added to the window using
    one of these “geometry manager” methods:


    +   - **pack()** – places the widget against a specified side of the window using
    **TOP**, **BOTTOM**, **LEFT**, or **RIGHT** constant values specified to its **side=**
    argument.'
  - '[PAGE 234]


    +   place() – places the widget at XY coordinates in the window using numerical
    values specified to its x= and y= arguments.


    +   grid() – places the widget in a cell within the window using numerical values
    specified to its row= and column= arguments.


    ![](img/d06b1f1cf83677f6647237f0c7827141_234_0.png)


    The grid() geometry manager method is demonstrated in the example here.


    Optionally, the pack() method may include a fill argument to expand the widget
    in available space. For example, with fill = ‘x’. Alternatively, the pack() method
    may include padx and pady arguments to expand the widget along an axis by a specified
    amount.


    +   Start a new Python script with a statement to make the “tkinter” module GUI
    methods and attributes available

    +   from tkinter import *


    ![](img/d06b1f1cf83677f6647237f0c7827141_234_1.png)


    +   Next, add a statement to call upon a constructor to create a window object

    +   window = Tk()


    +   Now, add a statement to specify a title for this window

    +   window.title(‘Label Example’)


    +   Then, add a statement to call upon a constructor to create a label object

    +   label = Label( window , text = ‘Hello World!’)


    +   Use the packer to add the label to the window with both horizontal and vertical
    padding for positioning

    +   label.pack( padx = 200 , pady = 50 )'
