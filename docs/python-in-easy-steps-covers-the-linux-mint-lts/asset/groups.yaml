    ```\n\n3. 现在，创建一个框架以容纳用于输入的 entry 字段 \n```\nframe = Frame( window )\nentry = Entry(\
    \ frame )\n```\n\n4. 然后，添加一个函数以显示当前输入的数据 \n```\ndef dialog() :\n    box.showinfo(‘Greetings’,\
    \ ‘Welcome’ + entry.get() )\n```\n\n5. 现在，创建一个按钮，以便在点击时调用该函数 \n```\nbtn = Button(\
    \ frame, text = ‘Enter Name’, command=dialog )\n```\n\n6. 将按钮和 entry 添加到框架的指定侧边\
    \ \n```\nbtn.pack( side = RIGHT, padx = 5 )\nentry.pack( side = LEFT )\nframe.pack(\
    \ padx = 20, pady = 20 )\n```\n\n7. 最后，添加循环以捕获此窗口的事件\n```\nwindow.mainloop()\n\
    ```\n\n8. 将该文件保存在你的脚本目录中，然后在那里打开一个命令提示符窗口，并使用命令 `python tk_entry.py` 运行此程序 – 输入你的名字并点击按钮以查看问候消息出现\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_246_0.png)\n\n![](img/d06b1f1cf83677f6647237f0c7827141_246_1.png)\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_246_2.png)\n\n如果你希望显示用户无法编辑的文本，请使用\
    \ Label 小部件代替 Entry 小部件。\n\n## 列出选项\n\nListbox 小部件在应用程序中提供一个项目列表，用户可以从中进行选择。Listbox\
    \ 对象通过指定其父容器的名称（如窗口或框架名称）以及作为 **Listbox()** 构造函数的参数的选项来创建。常用选项及其简要描述如下：\n\n| 选项\
    \ | 描述 |\n| :--- | :--- |\n| **bd** | 边框宽度（像素）（默认为 2） |\n| **bg** | 背景颜色 |\n|\
    \ **fg** | 用于渲染文本的前景色 |\n| **font** | 文本的字体 |\n| **height** | 列表中的行数（默认为 10） |\n\
    | **selectbackground** | 所选文本的背景颜色 |\n| **selectmode** | SINGLE（默认）或 MULTIPLE\
    \ 选择 |\n| **width** | 以字符为单位的 Listbox 宽度（默认为 20） |\n| **yscrollcommand** | 附加到垂直滚动条\
    \ |\n\n![](img/d06b1f1cf83677f6647237f0c7827141_247_0.png)\n\n在 Tkinter 中，滚动条是一个独立的小部件，可以附加到\
    \ Listbox、Text、Canvas 和 Entry 小部件。\n\n通过指定列表索引号和项目字符串作为其 **insert()** 方法的参数，将项目添加到\
    \ listbox 中。\n\n你可以通过在其 **get()** 方法的括号内指定其索引号来从 listbox 中获取任何项目。有用的是，listbox\
    \ 还有一个 **curselection()** 方法，该方法返回当前选中项目的索引号，因此可以将此作为参数提供给其 get() 方法以检索当前选择。\n\
    \n1. 通过使 GUI 功能可用，并将 messagebox 功能作为简短别名可用，开始一个新的 Python 程序\n```\nfrom tkinter\
    \ import *\nimport tkinter.messagebox as box\n```\n\n![](img/d06b1f1cf83677f6647237f0c7827141_248_0.png)\n\
    \n2. 接下来，创建一个窗口对象并指定标题\n```\nwindow = Tk()\nwindow.title( 'Listbox Example' )\n\
    ```\n\n3. 现在，创建一个框架以容纳小部件\n```\nframe = Frame( window )\n```\n\n4. 创建一个提供三个列表项的\
    \ listbox 小部件\n```\nlistbox = Listbox( frame )\nlistbox.insert( 1 , 'HTML5 in\
    \ easy steps' )\nlistbox.insert( 2 , 'CSS3 in easy steps' )\nlistbox.insert( 3\
    \ , 'JavaScript in easy steps' )\n```\n\n5. 接下来，添加一个函数以显示 listbox 的选择\n```\ndef\
    \ dialog() :\n    box.showinfo( 'Selection' , 'Your Choice: ' + \\\n    listbox.get(\
    \ listbox.curselection() ) )\n```\n\n6. 现在，创建一个按钮，以便在点击时调用该函数\n```\nbtn = Button(\
    \ frame , text = 'Choose' , command = dialog )\n```\n\n7. 然后，将按钮和 listbox 添加到框架的指定侧边\n\
    ```\nbtn.pack( side = RIGHT , padx = 5 )\nlistbox.pack( side = LEFT )\nframe.pack(\
    \ padx = 30 , pady = 30 )\n```\n\n8. 最后，添加循环以捕获此窗口的事件\n```\nwindow.mainloop()\n\
    ```\n\n9. 将该文件保存在你的脚本目录中，然后在那里打开一个命令提示符窗口，并使用命令 `python tk_listbox.py` 运行此程序\n\
    \n"
