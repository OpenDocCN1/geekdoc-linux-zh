    Python is a duck-typed language that supports polymorphism for like-named methods
    of multiple classes.


    ## 8 Processing requests


    *This chapter demonstrates how to create server-side Python scripts to process
    HTML web requests.*


    - Sending responses

    - Handling values

    - Submitting forms

    - Providing text areas

    - Checking boxes

    - Choosing radio buttons

    - Selecting options

    - Uploading files

    - Summary


    ## Sending responses


    Whenever a user asks to view an online web page in their browser it requests the
    page from the web server, and receives the page in response, via the HTTP protocol.


    Where a requested web page address is an HTML document (typically with an .html
    file extension), the web server response will return that file to the browser
    so its contents can be displayed.


    Where Python is installed on the computer hosting the web server, the web server
    can be configured to recognize Python scripts (typically with a .py file extension)
    and call upon the Python interpreter to process script code before sending an
    HTML response to the web server, for return to the browser client.


    ![](img/d06b1f1cf83677f6647237f0c7827141_206_0.png)


    A Python script requested by a web browser can generate a complete HTML document
    response by describing the content type on the first line as `Content-type:text/html\r\n\r\n`
    so the web browser will parse the markup content for display on the screen.


    ![](img/d06b1f1cf83677f6647237f0c7827141_207_0.png)


    The examples in this chapter use the free Abyss Personal Edition web server available
    at www.aprelium.com Installed locally on your computer this can be addressed by
    the domain name localhost or by the IP address 127.0.0.1.


    1. Ensure the web server is running and configured to execute Python scripts


    ![](img/d06b1f1cf83677f6647237f0c7827141_207_1.png)


    2. Next, start a new Python script by describing its generated output content
    type to be an HTML document


    ```python

    print( ''Content-type:text/html\r\n\n'' )

    ```


    ![](img/d06b1f1cf83677f6647237f0c7827141_207_2.png)


    *response.py*


    3. Now, add statements to output an entire web page including all its HTML markup
    tags


    ```python

    print(''<!DOCTYPE HTML>'')

    print(''<html lang="en">'')

    print(''<head>'')

    print(''<meta charset="UTF-8">'')

    print(''<title>Python Response</title>'')

    print(''</head>'')

    print(''<body>'')

    print(''<h1>Hello From Python Online!</h1>'')

    print(''</body>'')

    print(''</html>'')

    ```


    4. Finally, save the file in the web server’s HTML documents directory – typically
    this will be */htdocs*


    - Open a web browser and request the script from the web server via the HTTP protocol
    – to see the HTML document response provided by the Python script


    ![](img/d06b1f1cf83677f6647237f0c7827141_208_0.png)


    ![](img/d06b1f1cf83677f6647237f0c7827141_208_1.png)


    The **Content-type** output description gets sent as an HTTP Header to the browser,
    and must appear on the first line.


    ![](img/d06b1f1cf83677f6647237f0c7827141_208_2.png)


    Enclose HTML attribute values within double quote marks so they do not get confused
    with the single quote marks enclosing the strings.


    ## Handling values


    Values can be passed to a Python script on the web server when the browser makes
    an HTTP request. Those values can be used in the script and echoed in a response
    returned to the browser.


    Python’s “cgi” module can be used to easily handle data passed from the web browser
    by an HTTP request. This provides a FieldStorage() constructor that creates an
    object storing the passed data as a dictionary of key:value pairs. Any individual
    value can then be retrieved by specifying its associated key name within the parentheses
    of that FieldStorage object’s getvalue() method.


    The browser can submit data to the script using a “GET” method that simply appends
    key=value pairs to the script’s URL address. These follow a ? question mark character
    after the file name and multiple pairs must be separated by an & ampersand character.
    For example, script.py?key1=value1&key2=value2.


    ![](img/d06b1f1cf83677f6647237f0c7827141_209_0.png)


    1. Create a new HTML document containing hyperlinks with appended values to pass
    to a Python script


    ```html

    <!DOCTYPE HTML>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <title>Python Appended Values</title>

    </head>

    <body>

    <h1>

    <a href="get.py?make=Ferrari&model=Dino">Ferrari</a>

    <a href="get.py?make=Fiat&model=Topolino">Fiat</a>

    <a href="get.py?make=Ford&model=Mustang">Ford</a>

    </h1>

    </body>

    </html>

    ```


    ![](img/d06b1f1cf83677f6647237f0c7827141_210_0.png)


    *get.py*


    - Next, start a new Python script by making CGI handling features available and
    create a FieldStorage data object


    ```python

    import cgi


    data = cgi.FieldStorage()

    ```


    - Now, assign two passed values to variables by specifying their associated key
    names


    ```python

    make = data.getvalue(''make'')

    model = data.getvalue(''model'')

    ```


    - Then, add statements to output an entire HTML web page including passed values
    in the output


    ```python

    print(''Content-type: text/html\r\n\r\n'')

    print(''<!DOCTYPE HTML>'')

    print(''<html lang="en">'')

    print(''<head>'')

    print(''<meta charset="UTF-8">'')

    print(''<title>Python Response</title>'')

    print(''</head>'')

    print(''<body>'')

    print(''<h1>'', make, model, ''</h1>'')

    print(''<a href="get.html">Back</a>'')

    print(''</body>'')

    print(''</html>'')

    ```


    - Finally, save both files in the web server''s */htdocs* directory

    - Open a web browser and load the HTML document, then click any hyperlink – to
    see passed values in the response


    ![](img/d06b1f1cf83677f6647237f0c7827141_211_0.png)


    ![](img/d06b1f1cf83677f6647237f0c7827141_211_1.png)


    ![](img/d06b1f1cf83677f6647237f0c7827141_211_2.png)


    ![](img/d06b1f1cf83677f6647237f0c7827141_211_3.png)


    The request string in the GET method is limited to 1024 characters so is unsuitable
    for passing lots of key=value pairs.


    ![](img/d06b1f1cf83677f6647237f0c7827141_211_4.png)


    The values appended to the URL, are visible in the browser address field of the
    response, so the GET method should not be used to send passwords or other sensitive
    data values to the web server.


    ## Submitting forms


    Passing data from a web page to a web server using the GET method to append key:value
    pairs to a URL is simple, but has some limitations – the request string length
    cannot exceed 1024 characters, and the values appear in the browser address field.


    As a more reliable alternative, the browser can submit data to the script using
    a “POST” method that sends the information to the web server as a separate message
    not appended to the URL.


    Python’s `cgi` module can be used to handle form data sent from the browser with
    the POST method in exactly the same way as data passed from the browser with the
    GET method. This module’s `FieldStorage()` constructor can create an object to
    store the posted data as a dictionary of key:value pairs for each form field.
    Any individual value can be retrieved by specifying its associated key name to
    the object’s `getvalue()` method.


    ![](img/d06b1f1cf83677f6647237f0c7827141_212_0.png)


    1. Create a new HTML document containing a form with two text fields containing
    default values and a submit button to post all form values to a Python script


    ```html

    <!DOCTYPE HTML>

    <html lang="en">

