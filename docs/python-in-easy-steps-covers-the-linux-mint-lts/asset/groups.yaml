    # ## Harnessing polymorphism


    The three cornerstones of Object Oriented Programming (OOP) are encapsulation,
    inheritance, and polymorphism. Examples earlier in this chapter have demonstrated
    how data can be encapsulated within a Python class, and how derived classes inherit
    the properties of their base class. This example introduces the final cornerstone
    principle of polymorphism.


    The term “polymorphism” (from Greek, meaning “many forms” ) describes the ability
    to assign a different meaning, or purpose, to an entity according to its context.


    In Python, the + character entity can be described as polymorphic because it represents
    either the arithmetical addition operator, in the context of numerical operands,
    or the string concatenation operator, in the context of character operands.


    ![](img/d06b1f1cf83677f6647237f0c7827141_199_0.png)


    Perhaps more importantly, Python class methods can also be polymorphic because
    the Python language uses “duck typing” – meaning... if it walks like a duck, swims
    like a duck, and quacks like a duck, then that bird is reckoned to be a duck.


    In a duck-typed language you can create a function to take an object of any type
    and call that object’s methods. If the object does indeed have the called methods
    (is reckoned to be a duck) they are executed, otherwise the function signals a
    run-time error.


