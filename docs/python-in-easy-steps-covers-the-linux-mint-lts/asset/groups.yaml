    +       # 1111 ^ 0101 = 1010 (decimal 10)

    +       b = a ^ b


    +   *   Then, add a statement to change the first variable’s decimal value once
    more by further bit manipulation

    +       # 1111 ^ 1010 = 0101 (decimal 5)

    +       a = a ^ b'
