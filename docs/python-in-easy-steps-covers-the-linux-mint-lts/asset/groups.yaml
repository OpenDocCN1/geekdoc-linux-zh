    \   10\n   C:\\MyScripts>\n   ```\n\n   ![](img/d06b1f1cf83677f6647237f0c7827141_59_0.png)\n\
    \n> Do not confuse bitwise operators with logical operators. Bitwise operators\
    \ compare binary numbers, whereas logical operators evaluate Boolean values.\n\
    \n## Summary\n\n- Arithmetical operators can form expressions with two operands\
    \ for addition `+`, subtraction `-`, multiplication `*`, division `/`, floor division\
    \ `//`, modulo `%`, or exponent `**`.\n\n- The assignment `=` operator can be\
    \ combined with an arithmetical operator to perform an arithmetical calculation\
