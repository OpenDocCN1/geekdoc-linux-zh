    \n那些不是全局变量但出现在某个外部作用域中的变量，可以使用 `nonlocal` 关键字来引用。\n\n## 提供参数\n\n在 Python 编程中定义自定义函数时，你可以选择在函数的括号内指定一个“参数”名称。通过在调用该函数时在其括号内指定值，可以将值传递给该参数。现在，函数可以在执行过程中通过引用参数名称来使用传入的值。例如，定义一个函数来接受一个用于打印的参数，如下所示：\n\
