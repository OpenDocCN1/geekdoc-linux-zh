    \ Windows 的记事本）创建的纯文本文件脚本，并以 “.py” 文件扩展名保存。Python 程序可以在终端提示符下通过 **python** 命令后跟脚本文件名来执行。\n\
    \n学习任何编程语言时创建的传统第一个程序只是打印出指定的问候消息。在 Python 中，使用 **print()** 函数在其括号内指定消息。这必须是由引号包围的字符字符串。这些可以是\
    \ “” 双引号或 ‘ ’ 单引号 – 但不能混合使用两者。\n\n1.  在 Windows 上，启动任何纯文本编辑器，例如记事本应用程序\n\n![](img/d06b1f1cf83677f6647237f0c7827141_21_0.png)\n\
    \n2.  接下来，在空的文本编辑器窗口中准确输入以下语句\n   `print('Hello World!')`\n\n3.  现在，在 C:\\MyScripts\
