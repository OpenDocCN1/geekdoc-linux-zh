    \ **ljust()** 方法时，左对齐的字符串会在其右侧添加填充。\n\n## 转换字符串\n\n在 Python 3.0 之前，字符串字符以其 ASCII\
    \ 数值代码值存储在 0-127 的范围内，仅代表无重音的拉丁字符。例如，小写字母 'a' 被分配 97 作为其代码值。实际上，计算机内存的每个字节可以存储\
    \ 0-255 范围内的值，但这仍然太有限，无法表示所有带重音字符和非拉丁字符。例如，西欧使用的带重音字符和用于俄语的西里尔字母无法在 128-255 范围内表示，因为有超过\
    \ 127 个这样的字符。Python 的最近版本通过存储字符串字符为其 Unicode 码点值来克服这一限制，以在 0-1,114,111 的数字范围内表示所有字符和字母表。高于\
    \ ASCII 范围的字符可能需要两个字节来表示其码点值，例如 'Ö' 的十六进制 `0xC3 0xB6`。\n\n`str` 对象的 `encode()`\
    \ 方法可用于从默认 Unicode 编码进行转换，其 `decode()` 方法可用于转换回 Unicode 默认编码。\n\nPython 的 “`unicodedata`”\
    \ 模块有用地提供了一个 `name()` 方法，可揭示每个字符的 Unicode 名称。带重音和非拉丁字符可以通过其 Unicode 名称或解码其 Unicode\
    \ 十六进制码点值来引用。\n\n![](img/d06b1f1cf83677f6647237f0c7827141_158_0.png)\n\n术语 “ASCII”\
    \ 是 American Standard Code for Information Interchange（美国信息交换标准代码）的首字母缩写。\n\n\
    1. 通过用一个包含非 ASCII 字符的字符串初始化一个变量来开始一个新的 Python 脚本，然后显示其值、数据类型和字符串长度\n   ```python\n\
    \   s = 'Röd'\n   print('\\nRed String:', s)\n   print('Type:', type(s), 'Length:',\
    \ len(s))\n   ```\n   ![](img/d06b1f1cf83677f6647237f0c7827141_159_0.png)\n2.\
    \ 接下来，编码该字符串，并再次显示其值、数据类型和字符串长度\n   ```python\n   s = s.encode('utf-8')\n   print('\\\
    nEncoded String:', s)\n   print('Type:', type(s), 'Length:', len(s))\n   ```\n\
    3. 现在，解码该字符串，并再次显示其值、数据类型和字符串长度 — 以揭示非 ASCII 字符的十六进制码点\n   ```python\n   s = s.decode('utf-8')\n\
    \   print('\\nDecoded String:', s)\n   print('Type:', type(s), 'Length:', len(s))\n\
    \   ```\n4. 然后，添加语句以使 “unicodedata” 功能可用，并添加一个循环来揭示字符串中每个字符的 Unicode 名称\n   ```python\n\
    \   import unicodedata\n   for i in range(len(s)):\n       print(s[i], unicodedata.name(s[i]),\
    \ sep=':')\n   ```\n5. 接下来，添加语句将变量分配一个包含非 ASCII 字符十六进制码点的新值，然后显示解码的字符串值\n   ```python\n\
    \   s = b'Gr\\xc3\\xb6n'\n   print('\\nGreen String:', s.decode('utf-8'))\n  \
    \ ```\n6. 最后，添加语句将变量分配另一个包含非 ASCII 字符 Unicode 名称的新值，然后显示字符串值\n   ```python\n \
    \  s = 'Gr\\N{LATIN SMALL LETTER O WITH DIAERESIS}n'\n   print('Green String:',\
    \ s)\n   ```\n7. 将文件保存在你的 scripts 目录中，然后在那里打开一个命令提示符窗口并运行此程序 — 以查看转换的字符串和 unicode\
    \ 字符名称\n\n"
