    \ user, lang, sys ):\n    print( 'User:', user, 'Language:', lang, 'Platform:',\
    \ sys )\n```\n\nWhen calling a function whose definition specifies arguments,\
    \ the call must include the same number of data values as arguments. For example,\
    \ to call this example with multiple arguments:\n\n```python\necho( 'Mike', 'Python',\
    \ 'Windows' )\n```\n\nThe passed values must appear in the same order as the arguments\
    \ list unless the caller also specifies the argument names, like this:\n\n```python\n\
    echo( lang='Python', user='Mike', sys='Windows' )\n```\n\nOptionally, a default\
    \ value may be specified in the argument list when defining a function. This will\
