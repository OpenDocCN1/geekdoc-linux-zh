    \ left | Move each bit that is a 1 a specified number of bits to the left<br>Example:\
    \ **0010 << 2 = 1000** |\n| `>>` | Shift right | Move each bit that is a 1 a specified\
    \ number of bits to the right<br>Example: **1000 >> 2 = 0010** |\n\n![](img/d06b1f1cf83677f6647237f0c7827141_58_0.png)\n\
    \nEach half of a byte is known as a “nibble” (4 bits). The binary numbers in the\
    \ examples in the table describe values stored in a nibble.\n\nUnless programming\
    \ for a device with limited resources there is seldom a need to utilize bitwise\
    \ operators, but they can be useful. For instance, the XOR (eXclusive OR) operator\
    \ lets you exchange values between two variables without the need for a third\
    \ variable.\n\n![](img/d06b1f1cf83677f6647237f0c7827141_58_1.png)\n\n### bitwise.py\n\
    \n1. Start a new Python script by initializing two variables with numeric values\
