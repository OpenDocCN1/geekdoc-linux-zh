    \ or | 逻辑或 |\n| not | 逻辑非 |\n\n逻辑运算符用于具有布尔值 **True** 或 **False** 的操作数，或者可以转换为\
    \ **True** 或 **False** 的值。\n\n（逻辑与） **and** 运算符将评估两个操作数，并且仅当两个操作数本身都为 **True**\
    \ 时返回 **True**。否则， **and** 运算符将返回 **False**。这用于条件分支，其中程序的方向由测试两个条件决定 – 如果两个条件都满足，程序将朝某个方向执行，否则它将朝另一个方向执行。\n\
    \n与需要两个操作数都为 **True** 的 **and** 运算符不同，（逻辑或） **or** 运算符将评估其两个操作数，如果任一操作数本身返回 **True**，则返回\
    \ **True**。如果两个操作数都不返回 **True**，则 **or** 运算符将返回 **False**。这在 Python 编程中非常有用，用于在两个测试条件中任一满足时执行特定操作。\n\
    \n（逻辑非） **not** 运算符是一元运算符，用于单个操作数之前。它返回给定操作数的反向值，因此，如果变量 a 的值为 **True**，则 **not\
    \ a** 的值将为 **False**。 **not** 运算符在 Python 程序中非常有用，可以使用像 a = not a 这样的语句在连续的循环迭代中切换变量的值。这确保在循环的每次迭代中，布尔值都会反转，就像打开和关闭灯开关一样。\n\
