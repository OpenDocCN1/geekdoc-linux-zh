    # Obtaining user input


    Just as a data value can be assigned to a variable in a Python script, a user-specified
    value can be assigned to a variable with the Python `input()` function. This accepts
    a string within its parentheses that will prompt the user for input by displaying
    that string then wait to read a line of input.


    User input is read as a text string, even when it’s numeric, and can be assigned
    to a variable using the = assignment operator as usual. The value assigned to
    any variable can be displayed by specifying the variable name to the `print()`
    function – to reference that variable’s stored value.


    Multiple values to be displayed can be specified to the `print()` function as
    a comma-separated list within its parentheses.


    +   1. Launch a plain text editor, then declare and initialize a variable by requesting
    user input

    +      # Initialize a variable with a user-specified value.

    +      user = input( ''I am Python. What is your name? '' )


    ![](img/d06b1f1cf83677f6647237f0c7827141_27_0.png)


    +   2. Next, display a response message confirming the input by referencing the
    stored user name

    +      # Output a string and a variable value.

    +      print(''Welcome'', user)


    +   3. Now, save the file in your scripts directory then open a Command Prompt
    window there and run this program – enter your name, then hit Return to see the
    response message include your name'
