    ```


    - 4. Then, add a statement to specify text to appear on the face of the second
    Button widget


    ```python

    resBtn.configure(text=''Reset'')

    ```


    - 5. Save the file, then execute the program – to see the window now has a title,
    its resize button is disabled, and the buttons have now been resized to suit their
    text


    ![](img/d06b1f1cf83677f6647237f0c7827141_274_0.png)


    ![](img/d06b1f1cf83677f6647237f0c7827141_274_1.png)


    The widget’s **configure()** method allows properties to be subsequently added
    or modified after they have been created.


    ## Initializing dynamic properties


    Having specified values for static properties on the facing page, initial values
    can now be specified for those properties whose values will change dynamically
