  - "[PAGE 241]\n\nOnly the askquestion() method returns two values – the askyesno()\
    \ No button and both Cancel buttons return nothing.\n\nThose methods that produce\
    \ a message box containing a single OK button return no value when the button\
    \ gets clicked by the user. Those that do return a value can be used to perform\
    \ conditional branching by testing that value.\n\n+   1. Start a new Python program\
    \ by making GUI features available and messagebox features available as a short\
    \ alias\n\n```\nfrom tkinter import *\nimport tkinter.messagebox as box\n```\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_241_0.png)\n\n+   2. Next, create a\
    \ window object and specify a title\n\n```\nwindow = Tk()\nwindow.title( ‘Message\
    \ Box Example’ )\n```\n\n+   3. Add a function to display various message boxes\n\
