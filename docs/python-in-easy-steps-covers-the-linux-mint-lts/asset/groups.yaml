  md: "\n## Launching a window\n\nThe standard Python module that you can use to create\
    \ graphical applications is called “tkinter” – a *toolkit to interface* with the\
    \ system GUI (Graphical User Interface).\n\nThe **tkinter** module can be imported\
    \ into a program like any other module to provide attributes and methods for windowed\
    \ apps. Every **tkinter** program must begin by calling the `Tk()` constructor\
    \ to create a window object. The window’s size can, optionally, be specified as\
    \ a ‘*widthxheight*’ string argument to the window object’s *geometry()* method.\
    \ Similarly, the window’s title can be specified as a ‘*title*’ string argument\
    \ to the window object’s *title()* method. If not specified, default size and\
    \ title values will be used.\n\n![](img/d06b1f1cf83677f6647237f0c7827141_233_0.png)\n\
    \n> There can be only one call to the `Tk()` constructor and it must be at the\
    \ start of the program code.\n\nEvery **tkinter** program must also call the window\
    \ object’s **mainloop()** method to capture events, such as when the user closes\
    \ the window to quit the program. This loop should appear at the end of the program\
    \ as it also handles window updates that may be implemented during execution.\n\
    \nWith **tkinter**, all the graphical controls that can be included in the application\
    \ window, such as buttons or checkboxes, are referred to as “widgets”. Perhaps\
    \ the simplest widget is a non-interactive label object that merely displays text\
    \ or an image in the app interface. A label object can be created by specifying\
    \ the window object’s name and *text='string'* as arguments to a *Label()* constructor.\
    \ Once created, each widget, such as a label, must then be added to the window\
    \ using one of these “geometry manager” methods:\n\n- **pack()** – places the\
    \ widget against a specified side of the window using **TOP**, **BOTTOM**, **LEFT**,\
    \ or **RIGHT** constant values specified to its **side=** argument.\n- **place()**\
    \ – places the widget at XY coordinates in the window using numerical values specified\
    \ to its x= and y= arguments.\n- **grid()** – places the widget in a cell within\
    \ the window using numerical values specified to its row= and column= arguments.\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_234_0.png)\n\nThe grid() geometry manager\
    \ method is demonstrated in the example here.\n\nOptionally, the pack() method\
    \ may include a fill argument to expand the widget in available space. For example,\
    \ with fill = ‘x’. Alternatively, the pack() method may include padx and pady\
    \ arguments to expand the widget along an axis by a specified amount.\n\n1. Start\
    \ a new Python script with a statement to make the “tkinter” module GUI methods\
    \ and attributes available\n   ```python\n   from tkinter import *\n   ```\n\n\
    \   ![](img/d06b1f1cf83677f6647237f0c7827141_234_1.png)\n\n2. Next, add a statement\
    \ to call upon a constructor to create a window object\n   ```python\n   window\
    \ = Tk()\n   ```\n\n3. Now, add a statement to specify a title for this window\n\
    \   ```python\n   window.title('Label Example')\n   ```\n\n4. Then, add a statement\
    \ to call upon a constructor to create a label object\n   ```python\n   label\
    \ = Label( window , text = 'Hello World!')\n   ```\n\n5. Use the packer to add\
    \ the label to the window with both horizontal and vertical padding for positioning\n\
    \   ```python\n   label.pack( padx = 200 , pady = 50 )\n   ```\n\n6. Finally,\
    \ add the mandatory statement to maintain the window by capturing events\n   ```python\n\
    \   window.mainloop()\n   ```\n\n7. Save the program in your scripts directory,\
    \ then open a Command Prompt window there and run this program with the command\
    \ `python tk_window.py` – to see a window appear containing a label widget\n\n\
    ![](img/d06b1f1cf83677f6647237f0c7827141_235_0.png)\n\n![](img/d06b1f1cf83677f6647237f0c7827141_235_1.png)\n\
    \nWidgets will not appear in the window when running the program unless they have\
    \ been added with a geometry manager.\n\n## Responding to buttons\n\nA Button\
    \ widget provides a graphical button in an application window that may contain\
    \ either text or an image to convey the button’s purpose. A button object is created\
    \ by specifying the window name and options as arguments to a Button() constructor.\
    \ Each option is specified as an option=value pair. The `command` option must\
    \ always specify the name of a function or method to call when the user clicks\
    \ that button. The most popular options are listed below, together with a brief\
    \ description:\n\n| Option | Description |\n| :--- | :--- |\n| activebackground\
    \ | Background color when the cursor is over |\n| activeforeground | Foreground\
    \ color when the cursor is over |\n| bd | Border width in pixels (default is 2)\
    \ |\n| bg | Background color |\n| command | Function to call when clicked |\n\
    | fg | Foreground color |\n| font | Font for button label |\n| height | Button\
    \ height in text lines, or pixels for images |\n| highlightcolor | Border color\
    \ when in focus |\n| image | Image to be displayed instead of text |\n| justify\
    \ | Multiple text lines as LEFT, CENTER, or RIGHT |\n| padx | Horizontal padding\
    \ |\n| pady | Vertical padding |\n| relief | Border style of SUNKEN, RIDGE, RAISED\
    \ or GROOVE |\n| state | Enabled status of NORMAL or DISABLED |\n| underline |\
    \ Index number in text of character to underline |\n| width | Button width in\
    \ letters, or pixels for images |\n| wraplength | Length at which to wrap text\
    \ |\n\nThe values assigned to other options determine the widget’s appearance.\
    \ These can be altered by specifying a new option=value pair as an argument to\
    \ the widget’s `configure()` method. Additionally, a current option value can\
    \ be retrieved by specifying its name as a string argument to the widget’s `cget()`\
    \ method.\n\n![](img/d06b1f1cf83677f6647237f0c7827141_237_0.png)\n\nYou can also\
    \ call a button’s `invoke()` method to, in turn, call the function nominated to\
    \ its `command` option.\n\n1. Start a new Python script by making GUI features\
    \ available then create a window and specify a title\n   ```python\n   from tkinter\
    \ import *\n   window = Tk()\n   window.title('Button Example')\n   ```\n\n2.\
    \ Next, create a button to exit the program when clicked\n   ```python\n   btn_end\
    \ = Button(window, text='Close', command=exit)\n   ```\n\n3. Now, add a function\
    \ to toggle the window’s background color when another button gets clicked\n \
    \  ```python\n   def tog():\n       if window.cget('bg') == 'yellow':\n      \
    \     window.configure(bg='gray')\n       else:\n           window.configure(bg='yellow')\n\
    \   ```\n\n4. Then, create a button to call the function when clicked\n   ```python\n\
    \   btn_tog = Button(window, text='Switch', command=tog)\n   ```\n\n5. Add the\
    \ buttons to the window with positional padding\n   ```python\n   btn_end.pack(padx=150,\
    \ pady=20)\n   ```\n\n   ![](img/d06b1f1cf83677f6647237f0c7827141_237_1.png)\n\
    \n   ```python\n   tk_button.py\n   ```\n\n   ```python\n   btn_tog.pack(padx\
    \ = 150, pady = 20)\n   ```\n\n6. Finally, add the loop to capture this window's\
    \ events\n   ```python\n   window.mainloop()\n   ```\n\n7. Save the file in your\
    \ scripts directory, then open a Command Prompt window there and run this program\
    \ with the command `python tk_button.py` – click the button to see the window's\
    \ background color change\n\n![](img/d06b1f1cf83677f6647237f0c7827141_238_0.png)\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_238_1.png)\n\n![](img/d06b1f1cf83677f6647237f0c7827141_238_2.png)\n\
    \nOnly the function name is specified to the `command` option. Do not add trailing\
    \ parentheses in the assignment.\n\n![](img/d06b1f1cf83677f6647237f0c7827141_238_3.png)\n\
    \nThe ‘gray’ color is the original default color of the window.\n\n## Displaying\
    \ messages\n\nA program can display messages to the user by calling methods provided\
    \ in the “tkinter.messagebox” module. This must be imported separately and its\
    \ lengthy name can, usefully, be assigned a short alias by an *import as* statement.\n\
    \nA message box is created by supplying a box title and the message to be displayed\
    \ as the two arguments to one of these methods:\n\n| Method | Icon | Buttons |\n\
    | :--- | :---: | :--- |\n| showinfo() | ⓘ | OK |\n| showwarning() | ⚠ | OK |\n\
    | showerror() | ⊗ | OK |\n| askquestion() | ❓ | Yes (returns the string ‘yes’)\
    \ and No (returns the string ‘no’) |\n| askokcancel() | ❓ | OK (returns 1) and\
    \ Cancel |\n| askyesno() | ❓ | Yes (returns 1) and No |\n| askretrycancel() |\
    \ ❓ | Retry (returns 1) and Cancel |\n\n![](img/d06b1f1cf83677f6647237f0c7827141_240_0.png)\n"
  mdcn: "\n\n## 创建窗口\n\n你可以用来创建图形应用程序的标准 Python 模块称为“tkinter”——一个*用于与系统 GUI（图形用户界面）交互的工具包*。\n\
    \n**tkinter** 模块可以像其他模块一样导入到程序中，为窗口应用提供属性和方法。每个 **tkinter** 程序都必须通过调用 `Tk()` 构造函数来创建窗口对象。窗口的大小可选地指定为窗口对象的\
    \ *geometry()* 方法的 ‘*widthxheight*’ 字符串参数。同样，窗口标题可以指定为窗口对象的 *title()* 方法的 ‘*title*’\
    \ 字符串参数。如果未指定，将使用默认的大小和标题值。\n\n![](img/d06b1f1cf83677f6647237f0c7827141_233_0.png)\n\
    \n> 程序代码中只能调用一次 `Tk()` 构造函数，并且必须位于程序代码的开始处。\n\n每个 **tkinter** 程序还必须调用窗口对象的 **mainloop()**\
    \ 方法来捕获事件，例如用户关闭窗口以退出程序。这个循环应出现在程序的末尾，因为它还处理执行期间可能实施的窗口更新。\n\n在 **tkinter** 中，可以包含在应用窗口中的所有图形控件（如按钮或复选框）被称为“控件（widgets）”。最简单的控件可能是一个非交互式标签对象，它只是在应用界面中显示文本或图像。标签对象可以通过将窗口对象的名称和\
    \ *text='string'* 作为参数传入 *Label()* 构造函数来创建。一旦创建，每个控件（如标签）都必须使用这些“几何管理器”方法之一添加到窗口中：\n\
    \n- **pack()** – 使用为其 **side=** 参数指定的 **TOP**、**BOTTOM**、**LEFT** 或 **RIGHT**\
    \ 常量值，将控件放置在窗口的指定一侧。\n- **place()** – 使用为其 x= 和 y= 参数指定的数值，将控件放置在窗口中的 XY 坐标处。\n\
    - **grid()** – 使用为其 row= 和 column= 参数指定的数值，将控件放置在窗口单元格中。\n\n![](img/d06b1f1cf83677f6647237f0c7827141_234_0.png)\n\
    \n本示例演示了 grid() 几何管理器方法。\n\n可选地，pack() 方法可以包含 fill 参数以在可用空间中扩展控件。例如，fill = ‘x’。或者，pack()\
    \ 方法可以包含 padx 和 pady 参数，沿指定轴扩展指定数量的控件。\n\n1. 使用使“tkinter”模块 GUI 方法和属性可用的语句启动新的\
    \ Python 脚本\n   ```python\n   from tkinter import *\n   ```\n\n   ![](img/d06b1f1cf83677f6647237f0c7827141_234_1.png)\n\
    \n2. 接下来，添加一条语句，调用构造函数创建窗口对象\n   ```python\n   window = Tk()\n   ```\n\n3. 现在，添加一条语句为此窗口指定标题\n\
    \   ```python\n   window.title('Label Example')\n   ```\n\n4. 然后，添加一条语句，调用构造函数创建标签对象\n\
    \   ```python\n   label = Label( window , text = 'Hello World!')\n   ```\n\n5.\
    \ 使用 packer 将标签添加到窗口，并通过水平和垂直填充进行定位\n   ```python\n   label.pack( padx = 200 ,\
    \ pady = 50 )\n   ```\n\n6. 最后，添加必需的语句，通过捕获事件来维持窗口\n   ```python\n   window.mainloop()\n\
    \   ```\n\n7. 将程序保存在脚本目录中，然后在该处打开命令提示符窗口，使用命令 `python tk_window.py` 运行此程序 – 你会看到一个包含标签控件的窗口出现\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_235_0.png)\n\n![](img/d06b1f1cf83677f6647237f0c7827141_235_1.png)\n\
    \n除非通过几何管理器添加，否则运行程序时控件不会出现在窗口中。\n\n## 响应按钮\n\nButton 控件在应用窗口中提供图形按钮，其中可以包含文本或图像以传达按钮的功能。通过指定窗口名称和选项作为参数，可以创建按钮对象。每个选项都指定为\
    \ option=value 对。`command` 选项必须始终指定在用户单击该按钮时调用的函数或方法名称。最受欢迎的选项及其简要描述如下：\n\n| 选项\
    \ | 描述 |\n| :--- | :--- |\n| activebackground | 光标悬停时的背景颜色 |\n| activeforeground\
    \ | 光标悬停时的前景颜色 |\n| bd | 边框宽度（像素）（默认为 2） |\n| bg | 背景颜色 |\n| command | 单击时调用的函数\
    \ |\n| fg | 前景颜色 |\n| font | 按钮标签的字体 |\n| height | 按钮高度（文本行数）或图像像素 |\n| highlightcolor\
    \ | 焦点状态下的边框颜色 |\n| image | 代替文本显示的图像 |\n| justify | 多行文本对齐方式：LEFT、CENTER 或 RIGHT\
    \ |\n| padx | 水平填充 |\n| pady | 垂直填充 |\n| relief | 边框样式：SUNKEN、RIDGE、RAISED 或 GROOVE\
    \ |\n| state | 启用状态：NORMAL 或 DISABLED |\n| underline | 文本中需要下划线的字符索引号 |\n| width\
    \ | 按钮宽度（字母数）或图像像素 |\n| wraplength | 文本换行的长度 |\n\n分配给其他选项的值决定了控件的外观。可以通过为控件的 `configure()`\
    \ 方法指定新的 option=value 对作为参数来更改这些值。此外，可以通过将其名称作为字符串参数传递给控件的 `cget()` 方法来获取当前的选项值。\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_237_0.png)\n\n你还可以通过调用按钮的 `invoke()`\
    \ 方法，进而调用为其 `command` 选项指定的函数。\n\n1. 通过使 GUI 功能可用来启动新的 Python 脚本，然后创建窗口并指定标题\n\
    \   ```python\n   from tkinter import *\n   window = Tk()\n   window.title('Button\
    \ Example')\n   ```\n\n2. 接下来，创建一个按钮，使其在被点击时退出程序\n   ```python\n   btn_end = Button(window,\
    \ text='Close', command=exit)\n   ```\n\n3. 现在，添加一个函数，当另一个按钮被点击时切换窗口的背景颜色\n  \
    \ ```python\n   def tog():\n       if window.cget('bg') == 'yellow':\n       \
    \    window.configure(bg='gray')\n       else:\n           window.configure(bg='yellow')\n\
    \   ```\n\n4. 然后，创建一个按钮，使其在被点击时调用该函数\n   ```python\n   btn_tog = Button(window,\
    \ text='Switch', command=tog)\n   ```\n\n5. 使用位置填充将按钮添加到窗口\n   ```python\n   btn_end.pack(padx=150,\
    \ pady=20)\n   ```\n\n   ![](img/d06b1f1cf83677f6647237f0c7827141_237_1.png)\n\
    \n   ```python\n   tk_button.py\n   ```\n\n   ```python\n   btn_tog.pack(padx\
    \ = 150, pady = 20)\n   ```\n\n6. 最后，添加循环以捕获此窗口的事件\n   ```python\n   window.mainloop()\n\
    \   ```\n\n7. 将文件保存在脚本目录中，然后在该处打开命令提示符窗口，使用命令 `python tk_button.py` 运行此程序 – 点击按钮可以看到窗口背景颜色变化\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_238_0.png)\n\n![](img/d06b1f1cf83677f6647237f0c7827141_238_1.png)\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_238_2.png)\n\n`command` 选项只指定函数名称。不要在赋值中添加尾部括号。\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_238_3.png)\n\n‘gray’ 颜色是窗口的原始默认颜色。\n\
    \n## 显示消息\n\n程序可以通过调用“tkinter.messagebox”模块提供的方法来向用户显示消息。必须单独导入该模块，并且其较长的名称可以方便地通过\
    \ *import as* 语句分配一个短别名。\n\n消息框通过向这些方法之一提供框标题和要显示的消息作为两个参数来创建：\n\n| 方法 | 图标 |\
    \ 按钮 |\n| :--- | :---: | :--- |\n| showinfo() | ⓘ | 确定 |\n| showwarning() | ⚠\
    \ | 确定 |\n| showerror() | ⊗ | 确定 |\n| askquestion() | ❓ | 是（返回字符串 ‘yes’）和 否（返回字符串\
    \ ‘no’） |\n| askokcancel() | ❓ | 确定（返回 1）和 取消 |\n| askyesno() | ❓ | 是（返回 1）和 否\
    \ |\n| askretrycancel() | ❓ | 重试（返回 1）和 取消 |\n\n![](img/d06b1f1cf83677f6647237f0c7827141_240_0.png)\n\
    \n"
