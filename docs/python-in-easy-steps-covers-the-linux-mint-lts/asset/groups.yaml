    \n![](img/d06b1f1cf83677f6647237f0c7827141_223_3.png)\n\n![](img/d06b1f1cf83677f6647237f0c7827141_223_4.png)\n\
    \nRadio button elements resemble the buttons on old radios where each button selected\
    \ a particular radio station – but, of course, no two stations could be selected\
    \ simultaneously.\n\n## Selecting options\n\nAn HTML form can provide a drop-down\
    \ list of possible options from which the user can select a single option to include\
    \ its associated data for submission to the web server. The submitted value can\
    \ then be retrieved by specifying its associated list key name within the parentheses\
    \ of that FieldStorage object’s getvalue() method.\n\n![](img/d06b1f1cf83677f6647237f0c7827141_224_0.png)\n\
    \n- 1. Create a new HTML document containing a form with a drop-down options list\
    \ and a submit button\n\n```html\n<!DOCTYPE HTML>\n<html lang=\"en\">\n<head>\
    \ <meta charset=\"UTF-8\">\n<title>Selection List Example</title> </head>\n<body>\n\
    <form method=\"POST\" action=\"selection.py\">\n<select name=\"CityList\">\n<option\
    \ value=\"New York\">New York</option>\n<option value=\"London\">London</option>\n\
    <option value=\"Paris\">Paris</option>\n<option value=\"Beijing\">Beijing</option>\n\
    </select>\n<input type=\"submit\" value=\"Submit\" >\n</form>\n</body>\n</html>\n\
    ```\n\n![](img/d06b1f1cf83677f6647237f0c7827141_224_1.png)\n\n- 2. Next, start\
    \ a new Python script by making CGI handling features available and create a FieldStorage\
    \ data object\n\n```python\nimport cgi\ndata = cgi.FieldStorage()\n```\n\n- 3.\
    \ Now, assign the selected option value to a variable\n      `city = data.getvalue(\
    \ 'CityList' )`\n\n- 4. Then, add statements to output an entire HTML web page\
    \ including the posted option value in the output\n\n```python\nprint( `Content-type:text/html\\\
    r\\n\\r\\n` )\nprint( `<!DOCTYPE HTML>` )\nprint( `<html lang=\"en\">` )\nprint(\
    \ `<head> <meta charset=\"UTF-8\">` )\nprint( `<title>Python Response</title>\
    \ </head>` )\nprint( `<body>` )\nprint( `<h1>City:`, city, `</h1>` )\nprint( `<a\
    \ href=\"selection.html\">Back</a>` )\nprint( `</body>` )\nprint( `</html>` )\n\
    ```\n\n- 5. Finally, save both files in the web server’s `/htdocs` directory and\
    \ load the HTML document in a browser, then push the submit button – to see the\
    \ selected value in the response\n\n![](img/d06b1f1cf83677f6647237f0c7827141_225_0.png)\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_226_0.png)\n\n![](img/d06b1f1cf83677f6647237f0c7827141_226_1.png)\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_226_2.png)\n\nTypically, the first\
    \ list option will be selected for submission by default, unless you click open\
    \ the drop-down list and select an alternative.\n\n![](img/d06b1f1cf83677f6647237f0c7827141_226_3.png)\n\
    \nYou can include the **selected** attribute in an `<option>` tag to automatically\
    \ select one option in each list – to include a default choice.\n\n## Uploading\
    \ files\n\nAn HTML form can provide a file selection facility, which calls upon\
    \ the operating system’s “Choose File” dialog, to allow the user to browse their\
    \ local file system and select a file. To enable this facility the HTML <form>\
    \ tag must include an enctype attribute specifying the encoding type as “multipart/form-data”.\n\
    \nThe full path address of the file selected for upload is a value stored in the\
    \ FieldStorage object list that can be accessed using its associated key name.\
    \ Usefully, the file name can be stripped from the path address by the “os” module’s\
    \ path.basename() method.\n\nA copy of an uploaded file can be written on the\
    \ web server by reading from the FieldStorage object’s file property.\n\n![](img/d06b1f1cf83677f6647237f0c7827141_227_0.png)\n\
    \n- 1. Create a new HTML document containing a form with a file selection facility\
    \ and a submit button\n\n```html\n<!DOCTYPE HTML>\n<html lang=\"en\">\n<head>\
    \ <meta charset=\"UTF-8\">\n<title>File Upload Example</title> </head>\n<body>\n\
    <form method=\"POST\" action=\"upload.py\" enctype=\"multipart/form-data\" >\n\
    <input type=\"file\" name=\"filename\" style=\"width:400px\">\n<input type=\"\
    submit\" value=\"Submit\">\n</form>\n</body>\n</html>\n```\n\n![](img/d06b1f1cf83677f6647237f0c7827141_227_1.png)\n\
    \n```\nupload.py\n```\n\n- 2. Next, start a new Python script by making CGI handling\
    \ and operating system features available, then create a FieldStorage data object\n\
    \n```python\nimport cgi, os\ndata = cgi.FieldStorage()\n```\n\n- 3. Now, assign\
    \ the full path of the uploaded file to a variable and its stripped out file name\
    \ to another variable\n\n```python\nupload = data[ 'filename' ]\nfilename = os.path.basename(\
    \ upload.filename )\n```\n\n- 4. Then, write a copy of the uploaded file on the\
    \ web server\n\n```python\nwith open( filename, 'wb') as copy:\n    copy.write(\
    \ upload.file.read() )\n```\n\n- 5. Then, add statements to output an entire HTML\
    \ web page including the uploaded file name in the output\n\n```python\nprint(‘Content-type:text/html\\\
    r\\n\\n’)`\nprint(‘<!DOCTYPE HTML>’)`\nprint(‘<html lang=\\\"en\\\">’)\nprint(‘<head>’)`\n\
    print(‘<meta charset=\\\"UTF-8\\\">’)`\nprint(‘<title>Python Response</title>’)`\n\
    print(‘</head>’)`\nprint(‘<body>’)`\nprint(‘<h1>File Uploaded:’, filename, ‘</h1>’)`\n\
    print(‘<a href=\\\"upload.html\\\">Back</a>’)`\nprint(‘</body>’)`\nprint(‘</html>’)`\n\
    ```\n\n- 6. Finally, save both files in the web server’s /htdocs directory and\
    \ load the HTML document in a browser, then select a file for upload – to see\
    \ the file upload response\n\n![](img/d06b1f1cf83677f6647237f0c7827141_228_0.png)\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_229_0.png)\n\n(C:) » MyProjects »\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_229_1.png)\n\nAbyss Web Server » htdocs\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_229_2.png)\n\n![](img/d06b1f1cf83677f6647237f0c7827141_229_3.png)\n\
    \nNotice that binary file mode is used here to copy the uploaded file.\n\n## Summary\n\
    \n- Python can be installed on a web server host to process script code before\
    \ sending a response to a web browser client.\n- A server-side Python script can\
    \ generate an HTML document by describing the content type as **Content-type:text/html\\\
    r\\n\\n**.\n- The **cgitmodule** provides a **FieldStorage()** constructor to\
    \ create an object for storing submitted data as key:value pairs.\n- Any value\
    \ stored in a FieldStorage object can be retrieved by specifying its key name\
    \ to the object’s **getvalue()** method.\n- The browser can send data to a script\
    \ using the GET method that appends key=value pairs to its URL address after a\
    \ **?** mark.\n- Multiple key=value pairs of data can be submitted using the GET\
    \ method if each pair is separated by an **&** character.\n- The GET method request\
    \ string length cannot exceed 1024 characters and will be visible in the browser\
    \ address field.\n- The browser can send data to a script using the POST method\
    \ that submits key=value pairs as a separate message.\n- Data submitted from an\
    \ HTML form can be stored in a Field Storage object as key:value pairs for each\
    \ form field.\n- A server-side Python script can provide default values for submitted\
    \ HTML form fields that the user has left blank.\n- Checkbox fields of an HTML\
    \ form that are unchecked do not get submitted to the web server.\n- A selected\
    \ radio button in a group provides the value to be associated with the group name\
    \ when the form gets submitted.\n- A selected item in a drop-down list provides\
    \ the value to be associated with the list name when the form gets submitted.\n\
    - An HTML form can allow file uploads only if its **enctype** attribute specifies\
    \ its encoding type as “multipart/form-data”.\n\n# 9\n\n# Building interfaces\n\
    \nThis chapter demonstrates how to create graphical windowed applications with\
    \ Python.\n\n- Launching a window\n- Responding to buttons\n- Displaying messages\n\
    - Gathering entries\n- Listing options\n- Polling radio buttons\n- Checking boxes\n\
    - Adding images\n- Summary\n"
