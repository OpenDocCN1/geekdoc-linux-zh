    \n6. 最后，重新启动应用程序，再次点击“Get My Lucky Numbers”按钮控件 – 并确认这次的第一组数字与上次应用程序运行时记录的第一组数字不同\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_283_0.png)\n\n![](img/d06b1f1cf83677f6647237f0c7827141_283_1.png)\n\
    \n每次启动应用程序时，生成的数字序列都不会重复，因为随机数生成器由当前系统时间播种 – 每次调用生成器时该时间都不同。\n\n## 安装冻结工具\n\n\
    在成功测试了此处 [的应用程序](#) 后，你可能希望将其分发到其他计算机上使用，这些计算机上未必安装了 Python 解释器。为确保应用程序在没有 Python\
    \ 解释器的情况下也能成功执行，你的程序文件可以被“冻结”为一个捆绑包，包含在一个独立的单文件可执行文件中。\n\n![](img/d06b1f1cf83677f6647237f0c7827141_284_0.png)\n\
    \n“PyInstaller” 工具是一个免费程序，用于将 Python 脚本冻结为 Windows、Linux 或 Mac 的可执行文件。Windows、Linux\
    \ 和 macOS/Mac OS X 均可用 32 位和 64 位版本的 PyInstaller，但这些不是跨平台工具。这意味着它们只会为相同的操作系统生成可执行文件。例如，Windows\
    \ 版的 PyInstaller 只会为 Windows 操作系统生成可执行（.exe）文件。\n\nPyInstaller 工具是一个包，可以从 Python\
    \ 包索引（“PyPI”）安装 – PyPI 是 Python 社区的默认包索引，所有 Python 开发者均可访问。使用应自动包含在你的 Python 目录\
    \ Scripts 文件夹中的“pip”命令行程序轻松实现从 PyPI 安装包：\n\n- 要确认 pip 可用，请打开一个命令提示符窗口并输入命令 **pip\
    \ -h** – 程序应响应其命令列表\n\n"
