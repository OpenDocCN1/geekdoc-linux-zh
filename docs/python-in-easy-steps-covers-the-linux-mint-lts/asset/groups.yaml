  mdcn: "\n\n## 冻结程序\n\n使用此处介绍的 PyInstaller 工具，可以将用 Python 语言开发的应用程序冻结为适用于 Windows、Linux\
    \ 和 Mac 系统的独立可执行文件。如果需要包含额外文件（例如图像文件），则需要修改脚本文件，以便 PyInstaller 工具能够通过其绝对地址轻松定位这些文件：\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_285_0.png)\n\n1.  确保已连接互联网，然后输入命令 `pip\
    \ install pyinstaller` 来安装冻结工具\n\n![](img/d06b1f1cf83677f6647237f0c7827141_285_1.png)\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_285_2.png)\n\n你可以在 pyinstaller.org\
    \ 上发现更多关于 PyInstaller 的信息并寻求帮助\n\n![](img/d06b1f1cf83677f6647237f0c7827141_285_3.png)\n\
    \n只有当 Python 目录（例如 `C:\\Python37`）被添加到系统的 PATH 中时，pip 程序才会在命令提示符中可用 – 详情参见此处。你可以在\
    \ pip.pypa.io 上在线发现更多关于 pip 程序的信息\n\n2.  成功安装 PyInstaller 后，输入命令 `pyinstaller\
    \ -h` 以列出 PyInstaller 参数 – 注意脚本名称始终需要作为最终参数\n\n![](img/d06b1f1cf83677f6647237f0c7827141_286_0.png)\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_286_1.png)\n\n3.  向下滚动列表，找到“要生成什么”部分\
    \ – 查看生成单个文件的 `--onefile` 选项\n\n![](img/d06b1f1cf83677f6647237f0c7827141_286_2.png)\n\
    \n4.  继续向下滚动列表到“要打包什么”部分 – 查看包含图像文件的 `--add-binary` 选项\n\n![](img/d06b1f1cf83677f6647237f0c7827141_286_3.png)\n\
    \n5.  继续向下滚动列表到“Windows 选项”部分 – 查看抑制控制台的 `--noconsole` 选项\n\n![](img/d06b1f1cf83677f6647237f0c7827141_287_0.png)\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_287_1.png)\n\n你需要使用此处展示的高亮显示的四个选项来创建\
    \ Lotto 程序的可执行版本。\n\n![](img/d06b1f1cf83677f6647237f0c7827141_287_2.png)\n\n也请注意\
    \ `--icon` 选项，它可以用于指定为生成的可执行程序包含的图标 (.ico) 文件的路径。\n\n![](img/d06b1f1cf83677f6647237f0c7827141_288_0.png)\n\
    \n6.  打开 `lotto.py` 程序文件，在脚本的最开头添加此实用函数定义\n\n```python\ndef resource_path(relative_path):\n\
    \    absolute_path = os.path.abspath(__file__)\n    root_path = os.path.dirname(absolute_path)\n\
    \    base_path = getattr(sys, 'MEIPASS', root_path)\n    return os.path.join(base_path,\
    \ relative_path)\n```\n\n7.  修改 `img` 变量的赋值 – 使用添加的实用函数来识别图像文件的位置\n\n```python\n\
    img = PhotoImage(file = resource_path('logo.gif'))\n```\n\n![](img/d06b1f1cf83677f6647237f0c7827141_288_1.png)\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_288_2.png)\n\n8.  将修改后的文件保存为“MyScripts”文件夹中的“lucky.py”，然后在该文件夹中打开一个命令提示符\n\
    \n9.  以 `pyinstaller --onefile --noconsole` 开始命令，以指示 PyInstaller 创建一个文件，并防止程序同时打开控制台窗口\n\
    \n10. 继续使用 `--add-binary logo.gif;` 来扩展命令，以便在单个可执行文件中包含图像文件\n\n11. 使用 `lucky.py`\
    \ 脚本名完成命令 – 使命令现在看起来像对面页上的那样\n\n![](img/d06b1f1cf83677f6647237f0c7827141_289_0.png)\n\
    \n*file* 属性前面有两个 _ 下划线字符，后面也有两个 _ 下划线字符。\n\n```console\nC:\\MyScripts>pyinstaller\
    \ --onefile --noconsole --add-binary logo.gif; lucky.py\n```\n\n12. 当您确信命令正确后，按\
    \ Enter 键创建独立的可执行文件 (.exe)\n\n13. PyInstaller 会在您的 MyScripts 文件夹内创建两个名为“build”和“dist”的文件夹。独立的可执行文件可以在“dist”文件夹中找到\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_289_1.png)\n\n# **9**\n\n可执行文件可以分发给未安装\
    \ Python 的其他用户，并且可以通过命令行或双击其文件图标来运行该程序\n\n![](img/d06b1f1cf83677f6647237f0c7827141_290_0.png)\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_290_1.png)\n\n跟随在 `--add-binary` 参数后面的项指定了文件名（`logo.gif`）和期望的目的地（.\
    \ 表示当前目录），它们由 ; 分号字符分隔。Unix 系统必须使用 : 冒号字符作为此分隔符。\n\n![](img/d06b1f1cf83677f6647237f0c7827141_291_0.png)\n\
    \nPyInstaller 将脚本所需的所有文件（包括 Python 解释器）的副本打包到一个可执行文件中。这意味着其需求可能会不同。为了获取帮助和更多详细信息，请参见位于\
    \ pyinstaller.readthedocs.io 的 PyInstaller 手册\n\n## 总结\n\n- 标准 Python 库有一个 `random`\
    \ 模块，提供生成伪随机数的函数。\n- `random` 模块的 `random()` 函数可以生成 0.0 到 1.0 之间的伪随机浮点数。\n- `random`\
    \ 模块的 `sample()` 函数可以生成给定范围内的多个唯一随机整数。\n- 程序计划应定义程序的目的、所需功能以及所需的界面小部件。\n- 在设计程序界面时，`grid()`\
    \ 布局管理器将小部件定位在行和列中。\n- 静态属性在程序执行期间不会改变。\n- 动态属性在程序执行期间使用运行时功能响应用户操作而发生改变。\n- 完成后，应测试程序以确保其在各个方面都按预期运行。\n\
    - 可以将程序文件“冻结”成捆绑包，分发到其他没有 Python 解释器的计算机上。\n- PyInstaller 工具可用于将程序冻结为 Windows、Mac\
    \ 或 Linux 的可执行文件。\n- `pyinstaller` 命令的 `--onefile` 参数指定应创建单个可执行文件。\n- `pyinstaller`\
    \ 命令的 `--noconsole` 参数指定可执行文件不应同时生成控制台窗口。\n- `pyinstaller` 命令的 `--add-binary`\
    \ 参数可以指定要打包在可执行文件中的图像文件。\n- 打包图像文件时，必须在程序脚本中指定其在系统上的绝对路径地址。\n\n# Python 基础\n\n\
    **关键字：**\n\n| False | None | True | and | as | assert | async |\n| :--- | :---\
    \ | :--- | :--- | :--- | :--- | :--- |\n| await | break | class | continue | def\
    \ | del | elif |\n| else | except | finally | for | from | global | if |\n| import\
    \ | in | is | lambda | nonlocal | not | or |\n| pass | raise | return | try |\
    \ while | with | yield |\n\n**列表方法：**\n\n- `list.append( item )`\n- `list.extend(\
    \ list )`\n- `list.insert( position , item )`\n- `list.remove( item )`\n- `list.pop(\
    \ item )`\n- `list.index( item )`\n- `list.count( item )`\n- `list.sort( )`\n\
    - `list.reverse( )`\n\n**文件方法：**\n\n- `file = open( filename , filemode )`\n-\
    \ `file.readable( )`\n- `file.writable( )`\n- `file.read( size )`\n- `file.readlines(\
    \ size )`\n- `file.seek( offset )`\n- `file.tell( )`\n- `file.write( string )`\n\
    - `file.close( )`\n\n**字符串方法：**\n\n| | | |\n| :--- | :--- | :--- |\n| `string.capitalize(\
    \ )` | `string.isdecimal( )` | `string.lstrip( )` |\n| `string.center( width )`\
    \ | `string.isdigit( )` | `string.replace( old , new )` |\n| `string.count( sub\
