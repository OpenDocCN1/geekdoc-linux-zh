    \n## 总结\n\n- 函数使用 **def** 关键字定义，并包含缩进的语句，以便在函数被调用时执行。\n- 具有全局作用域的变量可以从任何地方引用，但具有局部作用域的变量只能从声明它的函数内部引用。\n\
    - 参数声明为函数定义括号内的逗号分隔列表。\n- 除非在声明中指定了默认值，否则函数调用必须为每个函数参数提供数据。\n- 可选地，函数可以包含一个 **return**\
    \ 语句，以将值返回给调用者。\n- 包含单个表达式的匿名函数使用 **lambda** 关键字创建，并返回一个函数对象。\n- 回调通常被编码为直接嵌入在调用者参数列表中的内联\
    \ **lambda** 表达式。\n- 可以通过在语法上需要语句的位置插入 **pass** 关键字来创建占位符。\n- 当函数块中出现使用 **yield**\
    \ 关键字的语句时，就创建了一个生成器函数。\n- 生成器函数保留函数最后一次调用时的状态，并向调用者返回一个生成器对象。\n- 内置的 **next()**\
    \ 函数可用于从生成器函数冻结的地方继续执行该生成器函数。\n- 预期的运行时异常错误可以通过将语句包裹在 **try except** 块中来进行处理。\n\
    \n"
