    # # Updating file strings


    A file object’s read() method will, by default, read the entire contents of the
    file from the very beginning, at index position zero, to the very end – at the
    index position of the final character. Optionally, the read() method can accept
    an integer argument to specify how many characters it should read.


    The position within the file, from which to read or at which to write, can be
    finely controlled using the file object’s seek() method. This accepts an integer
    argument specifying how many characters to move position as an offset from the
    start of the file.


    The current position within a file can be discovered at any time by calling the
    file object’s tell() method to return an integer location.


    When working with file objects it is good practice to use the Python with keyword
    to group the file operational statements within a block. This technique ensures
    that the file is properly closed after operations end, even if an exception is
    raised on the way, and is much shorter than writing equivalent try except blocks.


    +   1. Start a new Python script by assigning a string value to a variable containing
    text to be written in a file

    +      ```python

    +      text = “The political slogan “Workers Of The World Unite!”

    +         is from The Communist Manifesto.”

    +      ```

    +      <code>update.py</code>


    +   2. Next, add statements to write the text string into a file and display the
    file’s current status in the “with” block

    +      ```python

    +      with open(‘update.txt’, ‘w’ ) as file :

    +      file.write( text )

    +      print( “\nFile Now Closed?:”, file.closed )

    +      ```'
