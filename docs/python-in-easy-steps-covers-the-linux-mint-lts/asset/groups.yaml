    \ as` 关键字创建别名。例如，`import cat as tom` 允许您在调用中使用 **tom** 作为函数前缀。\n\n## 拥有函数名\n\n\
    在内部，每个 Python 模块和程序都有自己的“符号表”（symbol table），仅供在该上下文中定义的所有函数使用。这避免了如果一个程序导入了两个模块，且这两个模块中有同名函数时可能发生的冲突。\n\
    \n当您使用 **import** 语句导入一个模块时，该模块的符号表不会添加到程序的符号表中 – 只有模块名会被添加。这就是为什么您需要使用模块名前缀来调用模块的函数。从名为“ineasy”的模块导入“steps”函数，并从名为“dance”的模块导入另一个“steps”函数，意味着可以无冲突地调用它们为\
    \ `ineasy.steps()` 和 `dance.steps()`。\n\n通常，最好通过导入模块名并使用模块名前缀调用其函数来避免冲突，但您也可以用\
    \ **from import** 语句导入单独的函数名。模块名指定在 **from** 关键字之后，要导入的函数指定在 **import** 关键字之后，作为逗号分隔的列表。或者，可以在\
    \ **import** 后指定 * * 通配符来将所有函数名导入到程序自己的符号表中。这意味着可以没有模块名前缀地调用这些函数。\n\n1. 通过定义一个为其参数提供默认字符串值的函数，开始一个新的\
    \ Python 模块\n   ```python\n   def bark(pet = 'A Dog'):\n       print(pet, 'Says\
    \ WOOF!')\n   ```\n\n   ![](img/d06b1f1cf83677f6647237f0c7827141_121_0.png)\n\n\
    2. 接下来，添加另外两个函数定义，它们也为其参数提供默认字符串值\n   ```python\n   def lick(pet = 'A Dog'):\n\
    \       print( pet , 'Drinks Water' )\n   def nap( pet = 'A Dog' ) :\n       print(\
    \ pet , 'Sleeps In The Sun' )\n   ```\n\n3. 将文件保存为“dog.py”，以便模块名为“dog”\n\n4. 开始一个新的\
    \ Python 脚本，包含一个语句以提供“dog”模块的单独函数\n   ```python\n   from dog import bark , lick\
    \ , nap\n   ```\n\n   ![](img/d06b1f1cf83677f6647237f0c7827141_122_0.png)\n  \
    \ ![](img/d06b1f1cf83677f6647237f0c7827141_122_1.png)\n\n   > 当您导入单独的函数名时，模块名未被导入\
