  md: '# # Writing your first program


    Python’s interactive mode is useful as a simple calculator, but you can create
    programs for more extensive functionality. A Python program is simply a plain
    text file script created with an editor, such as Windows’ Notepad, that has been
    saved with a “.py” file extension. Python programs can be executed by stating
    the script file name after the **python** command at a terminal prompt.


    The traditional first program to create when learning any programming language
    simply prints out a specified greeting message. In Python, the **print()** function
    is used to specify the message within its parentheses. This must be a string of
    characters enclosed between quote marks. These may be “” double quote marks or
    ‘ ’ single quote marks – but not a mixture of both.


    +   1. On Windows, launch any plain text editor such as the Notepad application


    ![](img/d06b1f1cf83677f6647237f0c7827141_21_0.png)


    +   2. Next, precisely type the following statement into the empty text editor
    window

    +      print(‘Hello World!’)


    +   3. Now, create a new directory at C:\MyScripts and save the file in it as
    **hello.py**


    ![](img/d06b1f1cf83677f6647237f0c7827141_21_1.png)


    +   4. Finally, launch a Command Prompt window, navigate to the new directory
    and precisely enter the command **python hello.py** – to see the Python interpreter
    run your program and print out the specified greeting'
  merge: -1
  img_proc: true
