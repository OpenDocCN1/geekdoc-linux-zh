  md: "# Choosing radio buttons\n\nAn HTML form can provide a “radio button” group\
    \ from which the user can select just one button to submit its associated data\
    \ to the web server. Unlike checkboxes, radio buttons that share a common name\
    \ are mutually exclusive, so when one button in the group is selected, all other\
    \ buttons in that group are switched off. The Python script nominated to handle\
    \ the form data can test the value submitted for the radio button group name and\
    \ supply an appropriate response.\n\n![](img/d06b1f1cf83677f6647237f0c7827141_221_0.png)\n\
    \nradio.html\n\n+   1. Create a new HTML document containing a form with one group\
    \ of three radio buttons and a submit button to post the value of the chosen button\
