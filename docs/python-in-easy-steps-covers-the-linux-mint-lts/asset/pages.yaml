- pgno: 288
  md: "# # Freezing the program\n\nApplications developed in the Python language can\
    \ be frozen for Windows, Linux, and Mac systems using the PyInstaller tool, introduced\
    \ here, to create a single standalone executable file. Apps that require the inclusion\
    \ of additional files, such as image files, require the script file to be modified\
    \ so the PyInstaller tool can readily locate them at their absolute address:\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_288_0.png)\n\n+   1.  Open the `lotto.py`\
    \ program file and add this utility function definition at the very start of the\
    \ script\n\n```\n```\ndef resource_path(relative_path):\n    absolute_path = os.path.abspath(__file__)\n\
    \    root_path = os.path.dirname(absolute_path)\n    base_path = getattr(sys,\
    \ 'MEIPASS', root_path)\n    return os.path.join(base_path, relative_path)\n```\n\
    ```\n\n+   2.  Modify the assignment to the `img` variable – to identify the image\
    \ file’s location using the added utility function\n\n```\n```img = PhotoImage(file\
    \ = resource_path( 'logo.gif' ))```\n```\n\n![](img/d06b1f1cf83677f6647237f0c7827141_288_1.png)\n\
    \n![](img/d06b1f1cf83677f6647237f0c7827141_288_2.png)"
  merge: -1
  img_proc: true
