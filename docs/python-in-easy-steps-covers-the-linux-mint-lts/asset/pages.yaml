- pgno: 284
  md: '# ## Installing a freezing tool


    Having satisfactorily tested the application [here](#), you may wish to distribute
    it for use on other computers where the Python interpreter has not necessarily
    been installed. To ensure the application will execute successfully without the
    Python interpreter, your program files can be “frozen” into a bundle within a
    single stand-alone executable file.


    ![](img/d06b1f1cf83677f6647237f0c7827141_284_0.png)


    The “PyInstaller” tool is a free program for freezing Python scripts into executables
    for Windows, Linux, or Mac. There are 32-bit and 64-bit versions of PyInstaller
    available for Windows, Linux, and macOS/Mac OS X, but these are not cross-platform
    tools. This means they will only produce an executable file for that same operating
    system. For example, PyInstaller for Windows will only produce an executable (.exe)
    file for the Windows operating system.


    The PyInstaller tool is a package that can be installed from the Python Package
    Index (“PyPI”) – the default package index of the Python community, which is available
    to all Python developers. Installation of packages from PyPI is easily implemented
    using the “pip” command line program that should be automatically included in
    the Scripts folder of your Python directory:


    +   To confirm pip is available, launch a Command Prompt window and enter the
    command **pip -h** – the program should respond with its list of commands'
  merge: -1
  img_proc: true
- pgno: 285
  md: '![](img/d06b1f1cf83677f6647237f0c7827141_285_0.png)


