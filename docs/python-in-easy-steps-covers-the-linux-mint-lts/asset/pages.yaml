  md: '# Gathering entries


    An Entry widget provides a single-line input field in an application where the
    program can gather entries from the user. An entry object is created by specifying
    the name of its parent container, such as a window or frame name, and options
    as arguments to an Entry() constructor. Each option is specified as an option=value
    pair. Popular options are listed below, together with a brief description:


    | Option: | Description: |

    | :--- | :--- |

    | **bd** | Border width in pixels (default is 2) |

    | **bg** | Background color |

    | **fg** | Foreground color used to render the text |

    | **font** | Font for the text |

    | **highlightcolor** | Border color when in focus |

    | **selectbackground** | Background color of selected text |

    | **selectforeground** | Foreground color of selected text |

    | **show** | Hide password characters with show=``*`` |

    | **state** | Enabled status of NORMAL or DISABLED |

    | **width** | Entry width in letters |



    Multiple widgets can be grouped in frames for better positioning. A frame object
    is created by specifying the name of the window to a Frame() constructor. The
    frame''s name can then be specified as the first argument to the widget constructors
    to identify it as that widget''s container.


    ![](img/d06b1f1cf83677f6647237f0c7827141_244_0.png)


    Use the Text widget instead of an Entry widget if you want to allow the user to'
  merge: -1
  img_proc: true
- pgno: 245
  md: "enter multiple lines of text.\n\nWhen actually adding widgets to the frame\
    \ you can specify which side to pack them to in the frame with **TOP, BOTTOM,\
    \ LEFT, or RIGHT** constants. For example, **entry.pack(side=LEFT)**. \n\nTypically,\
    \ an entry widget will appear alongside a label describing the type of input expected\
    \ there from the user, or alongside a button widget that the user can click to\
    \ perform some action on the data they have entered, so positioning in a frame\
    \ is ideal. \n\nData currently entered into an entry widget can be retrieved by\
    \ the program using that widget’s **get( )** method. \n\n+   1. Start a new Python\
    \ program by making GUI features available and messagebox features available as\
    \ a short alias \n+   ```python\n+   from tkinter import *\n+   import tkinter.messagebox\
    \ as box\n+   ```\n\n![](img/d06b1f1cf83677f6647237f0c7827141_245_0.png)\n\n+\
    \   2. Next, create a window object and specify a title \n+   ```python\n+   window\
    \ = Tk()\n+   window.title( ‘Entry Example’ )\n+   ```\n\n+   3. Now, create a\
    \ frame to contain an entry field for input \n+   ```python\n+   frame = Frame(\
    \ window )\n+   entry = Entry( frame )\n+   ```\n\n+   4. Then, add a function\
    \ to display data currently entered \n+   ```python\n+   def dialog( ) :\n+  \
    \ box.showinfo( ‘Greetings’, ‘Welcome’ + entry.get( ) )\n+   ```\n\n+   5. Now,\
    \ create a button to call the function when clicked \n+   ```python\n+   btn =\
    \ Button( frame, text = ‘Enter Name’, command=dialog )\n+   ```\n\n+   6. Add\
    \ the button and entry to the frame at set sides \n+   ```python\n+   btn.pack(\
    \ side = RIGHT, padx = 5 )\n+   entry.pack( side = LEFT )\n+   frame.pack( padx\
    \ = 20, pady = 20 )\n+   ```"
