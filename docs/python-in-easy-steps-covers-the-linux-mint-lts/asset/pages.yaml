  md: "# Collecting garbage\n\nWhen a class instance object is created it is allocated\
    \ a unique memory address that can be seen using the built-in `id()` function.\
    \ Python automatically performs “garbage collection” to free up memory space by\
    \ periodically deleting un-needed objects such as class instances – so their memory\
    \ address becomes vacant.\n\nWhenever an object gets assigned a new name or gets\
    \ placed in a container, such as a list, its “reference count” increases. Conversely,\
    \ whenever these are removed or go out of scope its count decreases. The object\
    \ becomes eligible for collection when this count is zero.\n\nDestroying an instance\
    \ of a class may, optionally, call upon a “destructor” to execute a `__del__()`\
    \ method – explicitly reclaiming occupied memory space and executing any specified\
    \ statements.\n\n+   1. Start a new Python script by declaring a class with an\
    \ initializer method creating two instance variables and a method to display one\
    \ of those variable values\n+   \n+      ```python\n+      class Songbird :\n\
    +          def __init__ ( self , name , song ) :\n+              self.name = name\n\
    +              self.song = song\n+              print(self.name , ‘Is Born...’\
    \ )\n+      ```\n\n![](img/d06b1f1cf83677f6647237f0c7827141_189_0.png)\n\n+  \
    \ 2. Next, add a method to simply display both variable values\n+   \n+      ```python\n\
    +      def sing ( self ) :\n+          print(self.name , ‘Sings:’ , self.song\
    \ )\n+      ```\n\n+   3. Now, add a destructor method for confirmation when instances\
    \ of the class are destroyed – then save this file\n+   \n+      ```python\n+\
    \      def __del__ ( self ) :\n+          print(self.name , ‘Flew Away!\\n’ )\n\
    +      ```"
  merge: -1
