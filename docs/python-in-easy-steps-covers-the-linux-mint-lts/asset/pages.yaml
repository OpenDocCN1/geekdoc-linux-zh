  md: '# ## Handling exceptions


    Sections of a Python script in which it is possible to anticipate errors, such
    as those handling user input, can be enclosed in a try except block to handle
    “exception errors”. The statements to be executed are grouped in a try : block,
    and exceptions are passed to the ensuing except : block for handling. Optionally,
    this may be followed by a finally : block containing statements to be executed
    after exceptions have been handled.


    Python recognizes many built-in exceptions such as the NameError, which occurs
    when a variable name is not found, the IndexError, which occurs when trying to
    address a non-existent list index, and the ValueError, which occurs when a built-in
    operation or function receives an argument that has an inappropriate value.


    Each exception returns a descriptive message that can, usefully, be assigned to
    a variable with the as keyword. This can then be used to display the nature of
    the exception when it occurs.


    +   1. Start a new Python script by initializing a variable with a string value
    `title = ''Python In Easy Steps''`


    ![](img/d06b1f1cf83677f6647237f0c7827141_109_0.png)


    try.py


    +   2. Next, add a try statement block that attempts to display the variable value
    – but specifies the name incorrectly

    +      try :

    +       print( titel )


    +   3. Now, add an except statement block to display an error message when a NameError
    occurs

    +      except NameError as msg :

    +       print( msg )


    +   4. Save the file in your scripts directory, then open a Command Prompt window
    there and run this program – to see how the error gets handled'
