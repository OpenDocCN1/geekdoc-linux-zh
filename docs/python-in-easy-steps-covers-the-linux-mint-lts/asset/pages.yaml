  md: '# Installing Python on Windows


    Before you can begin programming in the Python language you need to install the
    Python interpreter on your computer, and the standard library of tested code modules
    that comes along with it. This is available online as a free download from the
    Python website at https://python.org/downloads. For Windows users there are installers
    available in both 32-bit and 64-bit versions:


    ![](img/d06b1f1cf83677f6647237f0c7827141_12_0.png)


    Installers for macOS/Mac OS X in 32-bit and 64-bit versions are available at python.org/downloads


    +   1. Launch a web browser, then navigate to python.org/downloads and download
    the appropriate installer for your system – in this example it’s a file named
    “python-3.7.0.exe”


    +   2. When the download completes, run the installer and check the “Add Python
    3.7 to PATH” option


    ![](img/d06b1f1cf83677f6647237f0c7827141_12_1.png)


    +   3. Next, click the “Customize installation” option'
