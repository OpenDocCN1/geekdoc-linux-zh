  md: '# Interrogating the system


    Python includes “sys” and “keyword” modules that are useful for interrogating
    the Python system itself. The keyword module contains a list of all Python keywords
    in its kwlist attribute, and provides an iskeyword() method if you want to test
    a word.


    You can explore the many features of the “sys” module, and indeed any feature
    of Python, using the Interactive Mode help system. Just type help() at the >>>
    prompt to start the help system, then type sys at the help> prompt that appears.


    Perhaps most usefully, the “sys” module has attributes that contain the Python
    version number, interpreter location on your system, and a list of all directories
    where the interpreter seeks module files – so if you save module files in any
    of these directories you can be sure the interpreter will find them.


