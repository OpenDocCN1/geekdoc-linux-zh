    The *file* attribute is preceded by TWO _ underscore characters and followed by
    TWO _ underscore characters.


    ```

    ```console

    C:\MyScripts>pyinstaller --onefile --noconsole --add-binary logo.gif; lucky.py

    ```

    ```


    +   7  When you are satisfied that the command is correct, hit Enter to create
    the standalone executable (.exe) file


    +   8  PyInstaller creates two folders named “build” and “dist” within your MyScripts
    folder. The standalone executable file can be found in the “dist” folder


