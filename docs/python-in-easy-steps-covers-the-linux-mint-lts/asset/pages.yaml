  md: '# Doing arithmetic


    The arithmetical operators commonly used in Python programming are listed in the
    table below, together with the operation they perform:


    | Operator: | Operation: |

    | :------- | :------- |

    | + | Addition |

    | - | Subtraction |

    | \* | Multiplication |

    | / | Division |

    | % | Division |

    | / | Modulo |

    | // | Floor division |

    | \*\* | Exponent |


    The operators for addition, subtraction, multiplication, and division act as you
    would expect. Care must be taken, however, to group expressions where more than
    one operator is used to clarify the expression – operations within innermost parentheses
    are performed first. For example, with this expression:


    ```

    a = b \* c - d \% e / f

    ```


    ![](img/d06b1f1cf83677f6647237f0c7827141_36_0.png)


    Values used with operators to form expressions are called “operands” – in the
    expression 2 + 3 the numerical values 2 and 3 are the operands.


    The desired order in which the operations should be performed is unclear but can
    be clarified by adding parentheses, like this:


    ```

    a = ( b \* c ) - ( ( d \% e ) / f )

    ```'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'The % modulo operator will divide the first given number by the second given
    number and return the remainder of the operation. This is useful to determine
    if a number has an odd or even value.


    The // floor division operator performs just like the / division operator, but
    truncates the result at the decimal point – removing any floating-point value.


    The ** exponent operator returns the result of the first operand raised to the
    power of the second operand.


    +   Start a new Python script by initializing two variables with integer values


    ```

    a = 8

    b = 2

    ```


    ![](img/d06b1f1cf83677f6647237f0c7827141_37_0.png)


    +   Next, display the result of adding the variable values


    ```

    print(‘Addition:\t’, a, ‘+’, b, ‘=’, a + b)

    ```


    +   Now, display the result of subtracting the variable values


    ```

    print(‘Subtraction:\t’, a, ‘-’, b, ‘=’, a - b)

    ```


    +   Then, display the result of multiplying the variable values


    ```

    print(‘Multiplication:\t’, a, ‘x’, b, ‘=’, a * b)

    ```


    +   Display the result of dividing the variable values both with and without the
    floating-point value


    ```

    print(‘Division:\t’, a, ‘/’, b, ‘=’, a / b)

    print(‘Floor Division:\t’, a, ‘//’, b, ‘=’, a // b)

    ```


    +   Next, display the remainder after dividing the values


    ```

    print(‘Modulo:\t’, a, ‘%’, b, ‘=’, a % b)

    ```


    +   Finally, display the result of raising the first operand to the power of the
    second operand


    ```

    print(‘Exponent:\t’, a, ‘^’, ‘=’, a ** b, sep = ‘‘)

    ```


