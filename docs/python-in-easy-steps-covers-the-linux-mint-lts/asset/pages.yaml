  md: '# # Preface


    The creation of this book has been for me, Mike McGrath, an exciting personal
    journey in discovering how Python can be used today for procedural and object-oriented
    programming, to develop applications and to provide online functionality. Example
    code listed in this book describes how to produce Python programs in easy steps
    – and the screenshots illustrate the actual results. I sincerely hope you enjoy
    discovering the exciting possibilities of Python, and have as much fun with it
    as I did in writing this book.


    In order to clarify the code listed in the steps given in each example I have
    adopted certain colorization conventions. Components of the Python programming
    language are colored blue, programmer-specified names are red, numeric and string
    data values are black, and comments are green, like this:


