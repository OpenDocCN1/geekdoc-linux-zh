  md: "# Returning values\n\nLike Python’s built-in `str()` function, which returns\
    \ a string representation of the value specified as its argument by the caller,\
    \ custom functions can also return a value to their caller by using the Python\
    \ `return` keyword to specify a value to be returned. For example, to return to\
    \ the caller the total of adding two specified argument values, like this:\n\n\
    ```\n```\ndef sum(a, b) :\n    return a + b\n```\n```\n\n![](img/d06b1f1cf83677f6647237f0c7827141_97_0.png)\n\
    \nThe returned result may be assigned to a variable by the caller for subsequent\
    \ use by the program, like this:\n\n```\n```python\ntotal = sum(8, 4)\nprint('Eight\
    \ Plus Four Is:', total)\n```\n```\n\nOr the returned result may be used directly\
    \ “in-line”, like this:\n\n```\n```python\nprint('Eight Plus Four Is:', sum(8,\
    \ 4))\n```\n```\n\nTypically, a `return` statement will appear at the very end\
    \ of a function block to return the final result of executing all statements contained\
    \ in that function.\n\nA `return` statement may, however, appear earlier in the\
    \ function block to halt execution of all subsequent statements in that block.\
    \ This immediately resumes execution of the program at the caller. Optionally,\
    \ the `return` statement may specify a value to be returned to the caller or the\
    \ value may be omitted. Where no value is specified, a default value of `None`\
    \ is assumed. Typically, this is used to halt execution of the function statements\
    \ after a conditional test is found to be `False`. For example, where a passed\
    \ argument value is below a specified number:\n\n```\n```\ndef sum(a, b) :\n \
    \   if a < 5 :\n```\n```"
