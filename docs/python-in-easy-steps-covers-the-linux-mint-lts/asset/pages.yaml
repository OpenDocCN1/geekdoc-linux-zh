  md: '# Providing text areas


    Large amounts of user-input text data can be passed from a web page to a web server
    using HTML <textarea> tags and the form POST method. This tag has no value attribute
    so a default value may not be provided. It is, therefore, useful to have the Python
    script test whether the text area has been left blank and provide a default value
    when the user has entered no text.


