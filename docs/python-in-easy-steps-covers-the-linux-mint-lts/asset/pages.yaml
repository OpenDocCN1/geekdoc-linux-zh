  md: '# # Running a timer


    Getting the current time both before and after an event means that the duration
    of the event can be calculated by their difference. The Python “time” module can
    be imported into a program to provide various time-related functions.


    Current system time is usually counted as the number of seconds elapsed since
    the Epoch at 00:00:00 GMT on January 1, 1970. The time module''s time() method
    returns the current time in seconds since the Epoch as a floating point number
    when called.


    The figure returned by the time() method can be converted into a “struct_time”
    object using gmtime() or localtime() methods. This object has attributes of tm_year,
    tm_mon, tm_mday, tm_hour, tm_min, tm_sec, tm_wday, tm_yday, tm_yday and tm_isdst
    that can be referenced using dot notation. For example, struct.tm_wday.


    All values in a struct_time object are stored as numeric values but can be transformed
    into text equivalents using the strftime() method. This requires an argument that
    is a format “directive” followed by the name of the struct_time object. The possible
    directives include those listed in the table *here* for the *datetime* object.
    For example, *strftime* (*''%A''*, *struct*) for weekday.


    Usefully, the time module also provides a sleep() method that can be used to pause
    execution of a program. Its argument specifies the amount of time in seconds by
    which to delay execution.


    +   1. Start a new Python script by importing the “time” module to make its features
    available

