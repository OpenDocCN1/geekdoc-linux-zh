  md: '# Pickling data


    In Python, string data can easily be stored in text files using the techniques
    demonstrated in the previous examples. Other data types, such as numbers, lists,
    or dictionaries, could also be stored in text files but would require conversion
    to strings first. Restoring that stored data to their original data type on retrieval
    would require another conversion. An easier way to achieve data persistence of
    any data object is provided by the “pickle” module.


    The process of “pickling” objects stores a string representation of an object
    that can later be “unpickled” to its former state, and is a very common Python
    programming procedure.


    An object can be converted for storage in a file by specifying the object and
    file as arguments to the pickle object’s dump()method. It can later be restored
    from that file by specifying the file name as the sole argument to the **pickle**
    object’s load()method.


    Unless the storage file needs to be human-readable for some reason, it is more
    efficient to use a machine-readable binary file.


    Where the program needs to check for the existence of a storage file, the “os”
    module provides a **path** object with an **isfile()** method that returns **True**
    if a file specified within its parentheses is found.


