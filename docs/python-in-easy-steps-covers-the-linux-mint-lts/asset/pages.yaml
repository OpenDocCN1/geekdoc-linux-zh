  md: '# ## Branching with if


    The Python `if` keyword performs the basic conditional test that evaluates a given
    expression for a Boolean value of `True` or `False`. This allows a program to
    proceed in different directions according to the result of the test, and is known
    as “conditional branching”.


    ![](img/d06b1f1cf83677f6647237f0c7827141_74_0.png)


    The tested expression must be followed by a `:` colon, then statements to be executed
    when the test succeeds should follow below on separate lines, and each line must
    be indented from the `if` test line. The size of the indentation is not important,
    but it must be the same for each line. So the syntax looks like this:


    ```

    `if` *test-expression* :

    `statements-to-execute-when-test-expression-is-True`

    `statements-to-execute-when-test-expression-is-True`

    ```


    Optionally, an `if` test can offer alternative statements to execute when the
    test fails by appending an `else` keyword after the statements to be executed
    when the test succeeds. The `else` keyword must be followed by a `:` colon and
    aligned with the `if` keyword, but its statements must be indented in a likewise
    manner, so its syntax looks like this:


    ```

    `if` *test-expression* :

    `statements-to-execute-when-test-expression-is-True`

    `else` :

    `statements-to-execute-when-test-expression-is-False`

    `statements-to-execute-when-test-expression-is-False`

    ```


    An `if` test block can be followed by an alternative test using the `elif` keyword
    (“else if”) that offers statements to be executed when the alternative test succeeds.
    This too must be aligned with the `if` keyword, followed by a `:` colon, and its
    statements indented. A final `else` keyword can then be added to offer'
  merge: -1
  img_proc: true
