    mode where you can test snippets of code and is useful for debugging code. Python’s
    interactive mode can be entered in a number of ways:


    +   * From a regular Command Prompt – simply enter the command `python` to produce
    the Python primary prompt `>>>` where you can interact with the interpreter.


