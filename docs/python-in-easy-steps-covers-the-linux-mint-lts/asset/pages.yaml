  md: '# ## Manipulating strings


    String values can be manipulated in a Python program using the various operators
    listed in the table below:


    | Operator: | Description: | Example: |

    | :--- | :--- | :--- |

    | \+ | **Concenate** \- join strings together | ''Hello'' + ''Mike'' |

    | \* | **Repeat** \- multiply the string | ''Hello'' * 2 |

    | [ ] | **Slice** \- select a character at a specified index position | ''Hello''
    [0] |

    | [ : ] | **Range Slice** \- select characters in a specified index range | ''Hello''
    [ 0 : 4 ] |

    | in | **Membership Inclusive** \- return True if character exists in the string
    | ''H'' in ''Hello'' |

    | not in | **Membership Exclusive** \- return True if character doesn''t exist
    in string | ''h'' not in ''Hello'' |

    | r/R | **Raw String** \- suppress meaning of escape characters | print(r''\n'')
    |

    | """ """ | **Docstring** \- describe a module, function, class, or method | def
    sum( a,b ) :""" Add Args """ |


    The [ ] slice operator and [ : ] range slice operator recognize that a string
    is simply a list containing an individual character within each list element,
    which can be referenced by their index number.


    ![](img/d06b1f1cf83677f6647237f0c7827141_148_0.png)


    The membership operators perform a case-sensitive match, so ''A'' in ''abc'' will
    fail. Similarly, the in and not in membership operators iterate through each element
    seeking to match the specified character.


    The raw string operator r (or uppercase R) must be placed immediately before the'
