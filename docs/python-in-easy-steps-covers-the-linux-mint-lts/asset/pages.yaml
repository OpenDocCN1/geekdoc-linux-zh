- pgno: 30
  md: '# Correcting errors


    In Python programming there are three types of error that can occur. It is useful
    to recognize the different error types so they can be corrected more easily:


    ![](img/d06b1f1cf83677f6647237f0c7827141_30_0.png)


    Programming errors are often called “bugs” and the process of tracking them down
    is often called “debugging”.


    +   - **Syntax Error** – occurs during execution of the program, at the time when
    the program runs. For example, a missing quote mark around a string. The interpreter
    halts and reports the error without executing the program.

    +   - **Runtime Error** – occurs during execution of the program, at the time
    when the program runs. For example, when a variable name is later mis-typed so
    the variable cannot be recognized. The interpreter runs the program but halts
    at the error and reports the nature of the error as an “Exception”.

    +   - **Semantic Error** – occurs when the program performs unexpectedly. For
    example, when order precedence has not been specified in an expression. The interpreter
    runs the program and does not report an error.


    Correcting syntax and runtime errors is fairly straightforward, as the interpreter
    reports where the error occurred or the nature of the error type, but semantic
    errors require code examination.


    ![](img/d06b1f1cf83677f6647237f0c7827141_30_1.png)'
  merge: -1
  img_proc: true
