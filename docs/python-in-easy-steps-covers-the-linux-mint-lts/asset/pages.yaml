  md: '+   3  Save the modified file as “lucky.py” in your MyScripts folder, then
    open a Command Prompt in that folder


    +   4  Begin a command with **`pyinstaller --onefile --noconsole`** to instruct
    PyInstaller to create a single file, and to prevent the program also opening a
    console window


    +   5  Continue the command with **`--add-binary logo.gif;`**, to include the
    image file in the single executable


    +   6  Complete the command with the **`lucky.py`** script name – so the command
    now looks like that on the opposite page


