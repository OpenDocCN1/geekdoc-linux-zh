  md: '# # Matching patterns


    The Python “re” module can be imported into a program to make use of Regular Expression
    patterns that describe a particular string of characters. Regular Expressions
    are useful for text validation and for search-and-replace operations within text
    by matching their specified pattern to a section of the text.


    A Regular Expression pattern may consist entirely of “literal characters” describing
    a character string to match within some text. For example, the Regular Expression
    “wind” finds a match in “*windows*” – the pattern literally matches the string
    in the text. More typically, a Regular Expression pattern consists of a combination
    of literal characters and these “metacharacters”:


    | Metacharacter: | Matches: | Example: |

    |---|---|---|

    | . | Any Characters | py..on |

    | ^ | First Characters | ^py |

    | $ | Final Characters | ...on$ |

    | * | Zero Or More Repetitions | py* |

    | + | One Or More Repetitions | py+ |

    | ? | Zero Or One Repetitions | py? |

    | { } | Multiple Repetitions | a{ 3 } |

    | [ ] | Character Class | [ a-z ] |

    | \ | Special Sequence | \s |

    | \| | Either Optional Character | a\|b |

    | ( ) | Expression Group | ( ... ) |


    A combination of literals and metacharacters defining a pattern to be matched
    can be specified to the *re.compile()* method to return a pattern object. This
    object has a *match()* method to specify a string within its parentheses to compare
    against the pattern.


    When a *match()* comparison succeeds, a match object is returned containing'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'information about the match, otherwise a `None` value is returned when the
    comparison fails.


    A match object has `start()` and `end()` methods, which return the position of
    the match, and a `group()` method that returns the string matched by the comparison.


    ![](img/d06b1f1cf83677f6647237f0c7827141_143_0.png)


    The topic of Regular Expressions is extensive and beyond the remit of this book
    – but a brief introduction is provided here for completeness.


    ![](img/d06b1f1cf83677f6647237f0c7827141_143_1.png)


    The character class `[a-z]` matches only lowercase characters, but `[a-z0-9]`
    also matches digits.


    +   1. Start a new Python script by importing the “re” module to make the regular
    expression methods available

    +       from re import *


    ![](img/d06b1f1cf83677f6647237f0c7827141_143_2.png)


    +   2. Next, initialize a variable with a regular expression object

    +       pattern = \n    compile( ''(^\[s]([-a-z0-9_]+@([-a-z0-9]+)\[\.]+)\[a-z]\[\{2,6\}\]\$'')


    +   3. Now, begin a function definition by requesting user input and attempt to
    match that with the pattern

    +       def get_address( ) :

    +           address = input( ''Enter Your Email Address: '' )

    +           is_valid = pattern.match( address )'
