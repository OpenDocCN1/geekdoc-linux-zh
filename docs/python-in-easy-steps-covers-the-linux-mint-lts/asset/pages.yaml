  md: "# # Understanding scope\n\nPrevious examples in this book have used built-in\
    \ functions of the Python programming language, such as the `print`() function.\
    \ However, most Python programs contain a number of custom functions that can\
    \ be called as required when the program runs.\n\nA custom function is created\
    \ using the `def` (definition) keyword followed by a name of your choice and (\
    \ ) parentheses. The programmer can choose any name for a function except the\
    \ Python keywords listed on the inside front cover of this book, and the name\
    \ of an existing built-in function. This line must end with a `:` colon character,\
    \ then the statements to be executed whenever the function gets called must appear\
    \ on lines below and be indented. Syntax of a function definition, therefore,\
    \ looks like this:\n\n```\n```\ndef function-name() :\n    statements-to-be-executed\n\
    \    statements-to-be-executed\n```\n```\n\nOnce the function statements have\
    \ been executed, program flow resumes at the point directly following the function\
    \ call. This modularity is very useful in Python programming to isolate set routines\
    \ so they can be called upon repeatedly.\n\nTo create custom functions it is necessary\
    \ to understand the accessibility (“scope”) of variables in a program:\n\n+  \
    \ • Variables created outside functions can be referenced by statements inside\
    \ functions – they have “global” scope.\n+   \n+   • Variables created inside\
    \ functions cannot be referenced from outside the function in which they have\
    \ been created – these have “local” scope.\n\nThe limited accessibility of local\
    \ variables means that variables of the same name can appear in different functions\
    \ without conflict.\n\nIf you want to coerce a local variable to make it accessible\
    \ elsewhere, it must first be declared with the Python `global` keyword followed\
    \ by its name only. It may subsequently be assigned a value that can be referenced\
    \ from anywhere in"
