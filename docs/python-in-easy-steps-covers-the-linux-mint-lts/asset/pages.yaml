  md: '# ## Performing mathematics


    Python includes a “math” module that provides lots of methods you can use to perform
    mathematical procedures once imported.


    The **math.ceil()** and **math.floor()** methods enable a program to perform rounding
    of a floating point value specified between their parentheses to the closest integer
    – **math.ceil()** rounds up and **math.floor()** rounds down but the value returned,
    although an integer, is a *float* data type rather than an *int* data type.


    The **math.pow()** method requires two arguments to raise a specified value by
    a specified power. The **math.sqrt()** method, on the other hand, simply requires
    a single argument and returns the square root of that specified value. Both method
    results are returned as a numeric value of the *float* data type.


    Typical trigonometry can be performed using methods from the math module too,
    such as **math.sin()**, **math.cosin()** and **math.tan()**.


    Python also includes a “random” module that can be used to produce pseudo random
    numbers once imported into a program.


    The **random.random()** method produces a single floating-point number between
    zero and 1.0. Perhaps more interestingly, the **random.sample()** method produces
    a list of elements selected at random from a sequence. This method requires two
    arguments to specify the sequence to select from, and the length of the list to
    be produced. As the **range()** function returns a sequence of numbers, this can
    be used to specify a sequence as the first argument to the **random.sample()**
    method – so it will randomly select numbers from that sequence to produce a list
    in which no numbers repeat.


    +   1. Start a new Python script by importing the “math” and “random” modules
    to make their features available


    ```

    ```

    import math, random

    ```

    ```


    ![](img/d06b1f1cf83677f6647237f0c7827141_128_0.png)'
