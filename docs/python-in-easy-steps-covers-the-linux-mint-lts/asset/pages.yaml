  md: "# ## Modifying strings\n\nThe Python `str` object has many useful methods that\
    \ can be dot-suffixed to its name for modification of the string and to examine\
    \ its contents. The most commonly used string modification methods are listed\
    \ in the table below, together with a brief description:\n\n| Method: | Description:\
    \ |\n| :-- | :-- |\n| `capitalize()` | Change string’s first letter to uppercase\
    \ |\n| `title()` | Change all first letters to uppercase |\n| `upper()` \n`lower()`\
    \ \n`swapcase()` | Change the case of all letters to uppercase, to lowercase,\
    \ or to the inverse of the current case respectively |\n| `join( seq )` | Merge\
    \ string into separator sequence `seq` |\n| `lstrip()` \n`rstrip()` \n`strip()`\
    \ | Remove leading whitespace, trailing whitespace, or both leading and trailing\
    \ whitespace respectively |\n| `replace( old , new )` | Replace all occurrences\
    \ of `old` with `new` |\n| `ljust( w , c )` \n`rjust( w , c )` | Pad string to\
    \ right or left respectively to total column width `w` with character `c` |\n\
    | `center( w , c )` | Pad string each side to total column width `w` with character\
    \ `c` (default is space) |\n| `count( sub )` | Return the number of occurrences\
    \ of `sub` |\n| `find( sub )` | Return the index number of the first occurrence\
    \ of `sub` or return -1 if not found |\n| `startswith( sub )` \n`endswith( sub\
