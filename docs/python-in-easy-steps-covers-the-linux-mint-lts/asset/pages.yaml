  md: "# Supplying arguments\n\nWhen defining a custom function in Python programming\
    \ you may, optionally, specify an “argument” name between the function’s parentheses.\
    \ A value can then be passed to that argument by specifying the value in the parentheses\
    \ of the call to the function. The function can now use that passed in value during\
    \ its execution by referencing it via the argument name. For example, defining\
    \ a function to accept an argument to print out, like this:\n\n```\n```\ndef echo(\
    \ user ) :\n    print( ‘User:’ , user )\n```\n```\n\nA call to this function must\
    \ specify a value to be passed to the argument within its parentheses so it can\
    \ be printed out:\n\n```\n```\necho( ‘Mike’ )\n```\n```\n\nMultiple arguments\
    \ (a.k.a. “parameters”) can be specified in the function definition by including\
    \ a comma-separated list of argument names within the function parentheses:\n\n\
    ```\n```\ndef echo( user , lang , sys ) :\n    print( ‘User:’ , user , ‘Language:’\
    \ , lang , ‘Platform:’ , sys )\n```\n```\n\nWhen calling a function whose definition\
    \ specifies arguments, the call must include the same number of data values as\
    \ arguments. For example, to call this example with multiple arguments:\n\n```\n\
    ```\necho( ‘Mike’ , ‘Python’ , ‘Windows’ )\n```\n```\n\nThe passed values must\
    \ appear in the same order as the arguments list unless the caller also specifies\
    \ the argument names, like this:\n\n```\n```\necho( lang = ‘Python’ , user = ‘Mike’\
    \ , sys = ‘Windows’ )\n```\n```\n\nOptionally, a default value may be specified\
    \ in the argument list when defining a function. This will be overriden when the\
    \ caller specifies a value for that argument, but will be used by the function\
    \ when no value gets passed by the caller:\n\n```\n```\ndef echo( user , lang\
    \ , sys = ‘Linux’ ) :\n    print( ‘User:’ , user , ‘Language:’ , lang , ‘Platform:’\
    \ , sys )\n```\n```"
