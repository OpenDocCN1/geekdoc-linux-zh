  md: "# ## Using callbacks\n\nIn Python, a named function is created using the `def`\
    \ keyword to specify a function name, which can be used to call that function\
    \ at any time in the program to execute the statements it contains. Optionally,\
    \ the named function can return a value to the caller.\n\nPython also allows an\
    \ anonymous un-named function to be created using the `lambda` keyword. An anonymous\
    \ function may only contain a single expression that must always return a value.\n\
    \nUnlike the usual creation of a function with the `def` keyword, the creation\
    \ of a function with the `lambda` keyword returns a “function object”. This can\
    \ be assigned to a variable, which can then be used to reference (“call back”)\
    \ the function at any time in the program to execute the expression it contains.\n\
    \nThe `lambda` keyword, therefore, offers the programmer an alternative syntax\
    \ for the creation of a function. For example:\n\n```\n```\ndef square( x ) :\n\
    \    return x ** 2\n```\n```\n\ncan alternatively be written more succinctly as...\n\
    \n```\n```\nsquare = lambda x : x ** 2\n```\n```\n\nIn either case, the call `square(5)`\
    \ returns the result 25 by passing in an integer argument to the function. Note\
    \ that the `lambda` keyword is followed by an argument without parentheses, and\
    \ the specified expression does not require the `return` keyword as all functions\
    \ created with `lambda` must implicitly return a value.\n\nWhile the `lambda`\
    \ keyword offers an alternative way to create a function it is mostly used to\
    \ embed a function within the code. For instance, callbacks are frequently coded\
    \ as inline `lambda` expressions embedded directly in a caller’s arguments list\
    \ – instead of being created with the `def` keyword elsewhere in the program and\
    \ referenced by name. For example:\n\n```\n```\ndef function_1 : statements-to-be-executed\n\
    def function_2 : statements-to-be-executed\ncallbacks = [ function_1 , function_2\
    \ ]\n```\n```"
  merge: -1
