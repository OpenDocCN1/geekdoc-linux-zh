    \ of the loop must be indented below, like this:\n\n```\nfor *each-item* in *list-name*\
    \ :\n\t*statements-to-execute-on-each-iteration*\n\t*statements-to-execute-on-each-iteration*\n\
    ```\n\nAs a string is simply a list of characters, the **for in** statement can\
    \ loop over each character. Similarly, a **for in** statement can loop over each\
    \ element in a list, each item in a tuple, each member of a set, or each key in\
    \ a dictionary.\n\nA **for in** loop iterates over the items of any list or string\
    \ in the order that they appear in the sequence, but you cannot directly specify\
    \ the number of iterations to make, a halting condition, or the size of iteration\
    \ step. You can, however, use the Python **range()** function to iterate over\
    \ a sequence of numbers by specifying a numeric end value within its parameters.\
    \ This will generate a sequence that starts at zero and continues up to, but not\
    \ including, the specified end value. For example, **range(5)** generates 0,1,2,3,4.\n\
    \nOptionally, you can specify both a start and end value within the parentheses\
