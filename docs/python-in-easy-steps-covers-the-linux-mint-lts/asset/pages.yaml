- pgno: 212
  md: "# ## Submitting forms\n\nPassing data from a web page to a web server using\
    \ the GET method to append key:value pairs to a URL is simple, but has some limitations\
    \ – the request string length cannot exceed 1024 characters, and the values appear\
    \ in the browser address field.\n\nAs a more reliable alternative, the browser\
    \ can submit data to the script using a “POST” method that sends the information\
    \ to the web server as a separate message not appended to the URL.\n\nPython’s\
    \ `cgi` module can be used to handle form data sent from the browser with the\
    \ POST method in exactly the same way as data passed from the browser with the\
    \ GET method. This module’s `FieldStorage()` constructor can create an object\
    \ to store the posted data as a dictionary of key:value pairs for each form field.\
    \ Any individual value can be retrieved by specifying its associated key name\
    \ to the object’s `getvalue()` method.\n\n![](img/d06b1f1cf83677f6647237f0c7827141_212_0.png)\n\
    \n+   1. Create a new HTML document containing a form with two text fields containing\
    \ default values and a submit button to post all form values to a Python script\n\
    +   \t```html\n+   \t<!DOCTYPE HTML>\n+   \t<html lang=\"en\">\n+   \t<head>\n\
    +   \t<meta charset=\"UTF-8\">\n+   \t<title>Python Form Values</title>\n+   \t\
    </head>\n+   \t<body>\n+   \t<form method=\"POST\" action=\"post.py\">\n+   \t\
    Make: <input type=\"text\" name=\"make\" value=\"Ford\"> Model:\n+   \t<input\
    \ type=\"text\" name=\"model\" value=\"Mustang\">\n+   \t<p><input type=\"submit\"\
    \ value=\"Submit\"></p>\n+   \t</form>\n+   \t</body>\n+   \t```"
  merge: -1
