    The following example demonstrates the simplest form of syntax in an awk script:


    ```

    #awk <search pattern> {<program actions>} filename

    ```


    The awk binary searches through the input file for each line that contains the
    search pattern. For each line found that meets the search criteria, awk then performs
    the specified actions. In this example, the action is specified as {print $5,
    $6, $7, $8}, so awk prints the fifth through the eighth column of data which in
    the coins file is the description. The purpose of the print statement is to display
    column five through eight only. The preceding $ with the numerical column identifier
    identifies it as a field variable, which stores the words in each line of text
    by their numeric sequence. $1, for example, stores the first word in the line,
    $2 has the second, and so on. By default, a word is defined as any string of printing
    characters separated by spaces.


    Since coins has the structure of mineral, weight in oz, date, country, and description,
    then the field variables are matched to each line of text in the file as follows:


    +   mineral: $1

    weight: $2

    date: $3

    country: $4

    description: $5 through $8


    The program action in this example prints the fields that contain the description.
    The description field in the file may actually include from one to four words,
    but that''s not a problem, since "print" simply ignores any undefined fields.
    Awk’s default program’s logical action is to print the entire line, which is what
    print does when invoked without parameters. This means that the first example:


    ```

    #awk ''/gold/'' coins, is the same as #awk ''/gold/ {print}'' coins

    ```'
  - '[PAGE 77]


    Note awk recognizes the field variable $0 as representing the entire line, so
    this could also be written as:


    ```

    #awk /gold/ { print $0 } coins

    ```


    The following example evaluates the variable in column 3 and displays the Date
    and Description for coins minted after 1986. The example adds some new concepts.
    No search pattern is specified in order to include all lines of data, which is
    awk''s default behavior. Therefore, the formatting actions specified will be applied
    to all lines of data.


    ```

    #awk ''if ($3 > 1986) print $3, " \ $5,$6,$7,$8}'' coins

    ```


    The resulting output is as follows:


    1987 Constitution Five Dollar Piece

    1988 Maple Leaf


    To add text or spaces to output lines, simply add them to the print statement
    (in this case, I added four spaces) by enclosing them in quotes. The default separation
    between columns separated by the comma is one space. I made the four spaces one
    literal word and added it to the parameter list. I like to separate columns of
    data for readability, but the important lesson to take away from this is that
    you have options on how the output from your commands and scripts will be displayed.
    You will find that once you have mastered the basics of awk, it is much easier
    to manipulate data at the command line than it is to copy and paste it into a
    spreadsheet program to rearrange the columns. Believe me, I have seen this done
    more than once and all I can do is walk away and shake my head.


    An if statement is used to check the value of the date field for a number greater
    than 1986. If a value greater than 1986 is found, the print statement is executed.
    If the value of the date field is equal to or less than 1986, nothing happens.
    The awk statement will simply move on and evaluate the next line in the file.


    Unlike most computer languages, awk makes no distinction between strings of alphabetic
    data and numbers. All the fields are regarded as strings, but if a string also
    happens to represent a number, numeric operations can be'
- md: '

    performed on the string. So we can perform an arithmetic comparison on the

    date field.


    The next example prints out the number of coins in the collection. More

    precisely, the logic determines how many lines or records are in the file.


    ```

    #awk ''END {print NR,"coins"}'' coins

    ```


    The result of this one line awk script is: 9 coins.


    The first new item in this example is the END statement. To explain this, I

    have to extend the general form of an awk program to:


    ```

    #awk ''BEGIN {<initializations>}''

    ```


    ```

    <search pattern> {program actions}>

    ```


    ```

    <search pattern> {program actions}>

    ```


    ```

    END {<final actions>}

    ```


    The BEGIN clause performs any initializations required before awk

    starts scanning the input file. The subsequent body of the awk program consists
    of a series of search patterns, each with its own program action. The

    awk program scans each line of the input file for each search pattern, and

    performs the appropriate actions for each string found. Once the file has

    scanned, an END clause can be used to perform any final actions

    required.


    So, since all this example counts the number of records in the file,

    the example doesn''t perform any processing on the input lines. All the

    example is scan through the file and perform a final action: print the

    number of lines in the file, which is provided by the NR variable. The variable

    NR stands for “number of records”. NR is one of awk’s pre-defined

    variables. There are others; for example, the variable NF gives the number of

    fields in a line.


    If the current price of gold is $475 per ounce, and I want to figure out

    the approximate total value of the gold pieces in the coin collection, I can

    execute the awk script as follows:


    ```

    #awk ''/gold/ {ounces += $2} END {print "value = " $475*ounces"} coins

    ```


    The result of this one line awk script is: value = $2185


    In this example, ounces is a user-defined variable. You can use almost any string
    of characters as a variable name in awk, as long as the name doesn''t conflict
    with some string that has a specific meaning to awk, such as print or NF. A variable
    handled as a string is initialized to the null string, so there is no need to
    manually set the value to null. Similarly, a numeric variable will be initialized
    to zero. So the program action to column two of the coins file to ounces += $2
    is as follows:


    ```

    {ounces += $2}

    ```


    The preceding line sums the weight of the coin on each matched line of the coins
    file into the variable ounces. The += operator is a shorthand way of expressing:


    ```

    {ounces = ounces + $2}

    ```


    The next and final action in this awk script is to compute and print the value
    of the gold coins in the coins file with the following syntax:


    ```

    END { print "value = " $475*ounces"}

    ```


    The only thing of interest is that the two print parameters, the literal "value
    = \$" and the expression "475*ounces", are separated by a space, not a comma.
    This concatenates the two parameters together on output, without any spaces between
    the dollar sign and the numerical value of the coins.


