    # Using sed


    The *sed* command is a program for editing data. It stands for stream editor.
    The general syntax of the sed command is (sed command options input file). The
    sed command options will be applied to each line of the input file. If no input
    file is specified, standard input is assumed. As sed applies the indicated command
    options to each line of input, it writes the results to standard output unless
    otherwise directed. I almost always direct sed to send its output to an output
    file. If you do not do this, you will have to rerun the same sed command syntax
    every time you want to reference the edited data. If you''re going to use the
    cpu cycles to edit a stream of data, you may well put them somewhere where you
    can use them in the future. The exception here is if you know you just need to
    see that you got the syntax correct before saving it. The following table has
    the typical command options used for making simple stream editing.'
  - '[PAGE 83]


    | Command | Option | Description |

    | --- | --- | --- |

    | sed | | |

    | | d | Delete. |

    | | g | Replace the contents of the pattern space with the contents of the hold
    space. |

    | | -n | Don''t print this line unless directed to with the p option. |

    | | p | Print (Override the n option). |

    | | s | Substitution. |


    # d - Delete


    This option is pretty straightforward. So be careful with it. The danger comes
    from its simplicity. The d option will delete whatever you tell it to, not whatever
    you meant to tell it. A good practice is to send the output for a file so you
    can review it before you commit to saving the output to a file. The following
    sed command syntax demonstrates how delete lines that contain the word “junk”
    from a file.


    ```

    # sed ''/junk/d'' < filename

    ```


    The preceding syntax demonstrates how to get rid of an entire line since the function
    of the d option is to delete the target of the matched expression. If you want
    to remove the matched expression and replace it with something else, you will
    want to use the s option. The s option substitutes a specified value when the
    search expression is matched.


    # g - Global


    Like UNIX utilities, the default behavior of sed is to work on files, reading
    one line at a time. If you tell sed to change a word, it will only change'
- md: '

    # UNIX From Soup To Nuts


    the first occurrence of the word on a line. If you want to make the same change
    to all occurrences of an expression on every line in the file, you will need to
    use the "g" global option. To create a functional example with the global option
    included, execute the sed command with any input file as follows to globally replace
    the lowercase letter "a" with the uppercase letter "A". Since we are just sending
    the output to the screen, no output file will be created and the original file
    will not be modified, so you can use any file you have read access to.


    ```bash

    #sed ''s/a/A/g'' < filename

    ```


    ## -n - No Printing


    By default, sed prints every line to standard output. Any substitutions that are
    made are printed to standard output instead of the original text of a file. If
    you use the optional "-n" argument in a sed statement, sed will not print the
    new lines. The following line will not print any output to standard output, but
    the changes will be sent to the output file.


    ```bash

    #sed -n ''s/pattern/&/c/'' < filename > filename

    ```


    ## p - Print


    By default, sed prints every line to standard output. Any substitutions that are
    made are printed to standard output instead of the original text of a file. If
    you use the optional "-n" argument in a sed statement, sed will not print the
    new lines. When the "-n" option is used, the "p" will cause the modified line
    to be printed


    ```bash

    #sed -n ''s/pattern/&/p'' < filename

    ```


    ## s - Substitution


    sed is used for multiple editing functions, but perhaps the most common is the
    function of substitution. That is, sed can substitute a specific occurrence of
    a target or all occurrences of a target to something else. The substitute command
    option is the lower case "s". A simple example would be to change every occurrence
    of the word "Sunday" in a calendar file to the word "Funday". To perform this
    action, you would execute the following sed statement:


    # ROBERT B. FAY


    ```bash

    # sed s/Sun/Fun/ < calendar > calendar.new

    ```


    didn''t put quotes around the argument because this example didn''t need them.
    If your target includes special characters that sed or UNIX might misinterpret,
    like $, %, or #, the safe thing is to use quotes. The quotes tell whatever application
    you are using, sed in this case, to treat the special character as a literal with
    no special properties. Using quotes when they are not required does not hurt anything,
    so it is a good habit to get into if you are just starting. To use quotes with
    the previous statement, put the opening quote before the substitution s and the
    closing quote following the final slash / like this:


    ```bash

    # sed ''s/Sun/Fun/'' < calendar > calendar.new

    ```


    There are four pieces to the above sed substitute command. The first part is the
    single before the first slash. The single s indicates that you are performing
    a substitution function. The second part is the slash / delimiters. The slashes
    are used to separate the parts of the sed command. The third piece is the word
    “Sun”. In this command, Sun is the regular pattern string. In other words, it
    is the thing that you want to get rid of and replacing with something else. The
    fourth piece of this command is the word “Fun”. In this command, Fun is the replacement
    string. In other words, you want to replace the value of the regular expression
    pattern string with the value of this word. So with the explanation of substitution,
    quoting, delimiters, and expressions, you have what you need to perform most of
    the tasks sed is regularly used.


    ## Substitute Flags


    You can add additional functionality to a substitute command string by tacking
    on an additional option flag following the final delimiter. Such a flag can be
    used to specify what happens when there is more than one occurrence of an expression
    on a single line, and what to do if a substitution is found.


    ## The Delimiter


    The character after the s is the delimiter. By convention, it is normally a forward
    slash “/”. This is primarily because other UNIX utilities like the ed editor and
    the vi editor use the slash also. However, you can use anything you want for the
    delimiter. The only time I have trouble with the slash character is when dealing
    with paths in an expression. In this case, if you choose to use the slash as your
    delimiter, you will need to precede any slash with a back slash. Doing so tells
    sed to ignore the following slash. The following example shows an example of this
    type of hard-to-read syntax:


    ```bash

    #sed ''s/\home\/joe/\home\/jon/'' < filename > filename.new

    ```


    Perhaps the simplest way to avoid this type of confusion is to use another character
    for the delimiter when there is a slash contained in the expression. To do this,
    just replace the delimiter with another character, like a comma, and leave the
    slashes in the expression. The following example is the same logical sed statement
    with commas for the delimiters:


    ```bash

    #sed ''s,/home/joe,/home/jon,'' < filename > filename

    ```


    ## Using & as the Matched Expression String


    Sometimes you will want to search for a pattern and add some characters, like
    parentheses or braces, around a pattern you found. This is easily accomplished
    if you know exactly what you are looking for. However, if you are not sure exactly
    what every occurrence in a file will be, you will need to use the special character
    ampersand "&". The way to use the ampersand solution is to add the "&" character
    in the place of the regular expression replacement string. This tells sed to replace
    whatever it finds with the same thing plus characters you wanted to add, like
    parentheses or braces. The following example is not very practical, but it will
    be very obvious what happened to the output. Again, you may use any file for this.
    We are not modifying a file.


    ```bash

    #sed ''s/[a-z]/(&)/g'' < filename

    ```


    The following table includes syntax examples for using the options listed in the
    previous table. Although these types of edits may seem basic, learning how to
    perform these edits with a stream editor like sed will save you a tremendous amount
    of time that would have spent performing the same edits manually with an editor
    like vi.


    ## Useful sed Examples


    | Command | Description |

    | :--- | :--- |

    | sed ''5d'' < file | Delete line 5 of a file. |

    | sed ''/fish/d'' file | Delete lines that contain the string. |

    | sed ''/[Tt]est/d'' < file | Delete lines containing Test or test. |

