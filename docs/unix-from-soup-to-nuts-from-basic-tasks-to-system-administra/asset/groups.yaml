    `ls -al` 输出，你可以看到软链接明显指向原始文件，如输出右侧的箭头和输出开头的“l”（代表 link）所示。


    # 移动或重命名


    在 UNIX 世界中，move（移动）和 rename（重命名）是同义词。事实是，并没有 `rename` 命令。这两个功能都通过 `move [mv]`
    命令完成。这是因为对于 UNIX 来说，将文件从一个位置移动到另一个位置等于将文件从一个名称移动到另一个名称。记住，UNIX 使用文件的 inode 来重命名其位置。名称只是为了我们人类。你不需要位于移动命令语法的源目录或目标目录即可在它们之间移动文件。在同一目录内移动文件的语法是
