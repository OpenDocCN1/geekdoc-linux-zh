    # 10 次备份


    作为一名 UNIX 系统管理员，我执行最重要的职责之一就是管理和执行系统及用户文件的备份与恢复。没有良好备份的系统就是一场等待发生的灾难。我之所以说“良好的备份”，是因为我既听过也经历过：当你认为自己已经备份了某项内容，结果在需要时却发现你的备份介质或备份逻辑并不充分。


    在我担任 UNIX 系统管理员的职业生涯中，我有机会使用各种设备（从软磁盘到机器人控制的磁带库）进行备份。虽然我使用过由不同供应商提供的多个备份软件包，但我更倾向于使用
    tar 命令。我喜欢 tar 的原因之一是因为它是免费的，它内置于或可移植到所有变体 UNIX，而且功能非常强大且易于使用。此外，我发现一些更花哨的备份软件包实际上在后台运行的
    tar 进程。


    当你下次使用其他备份软件运行备份或恢复任务时，查看一下你的进程。你可能会看到一个 tar 进程正在工作而感到惊讶。这是因为供应商开发了 GUI 或 Web
    界面，让用户直观地操作以执行使用 tar 作为后端的备份。归根底，既然他们只需要给它一个新外观并将其卖掉，为什么要费力开发一个已经存在的东西呢？


    tar 命令的设计是为了创建磁带归档文件。但从那以后，它被广泛用作以单文件形式保存文件和目录集合的方法，并用于压缩文件和目录。tar 命令会创建一个文件，为要归档的文件创建一个索引，并在其文件中创建要归档数据的副本。在创建
    tar 文件后，可以对其进行压缩处理以节省空间。这使得移动和恢复大组文件变得更加容易。


    以下语法：`tar -cvf tarfile`。在在上的示例中，`tarfile` 代表你要创建的文件或归档名称。我通常将它们命名为某些有助于我记住其中内容的名称。我也会在文件名中使用
    `.tar` 扩展名。这不是强制要求的，但是一个惯例。它告诉人们这种文件的类型，并让他们知道使用什么命令来展开或恢复它。上一个示例中的 `file` 一词代表你备份的任何内容的名称。它可以文件名、目录名甚至是文件系统。


    要恢复 tar 文件，使用以下语法：`tar -xvf tarfile location`。恢复 tar 文件将按层级顺序重新创建 tar 文件中包含的文件和目录。除非你给出一个开始恢复文件的绝对路径，否则它将它们恢复到当前工作目录。使用
    tar 归档进行恢复的过程不会删除 tar 归档文件。因此，你最终将得到新恢复的文件与你放在相同处的 tar 归档位于同一个目录中。如果你没有空间同时存放两者，可能需要在执行恢复时将
    tar 文件存放在另一个位置。


    要显示 tar 文件的索引或目录，使用以下语法：`tar -tvf tarfile`。要将 tar 文件的索引输出重定向到文件中，以便以后用其他 UNIX
    命令打印或查看，使用以下语法：`tar -tvf tarfile > /tmp/index`。要将备份磁带上 tar 归档的索引输出重定向到文件中，以便以后用其他
    UNIX 命令打印或查看，使用以下语法：`tar -tvf /dev/rmt > /tmp/index`。这是验证你是否备份了你认为的内容的好方法。如果你将索引输出重定向到文件中并用日期命名该文件，你将拥有那天备份内容的记录。你应该将这些索引文件放在名为
    `Backup_Logs` 或类似的目录中，这样它们就不会被删除，而且你知道去哪里找到它们。


