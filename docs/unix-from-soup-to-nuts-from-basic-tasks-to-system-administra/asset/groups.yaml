    ## sar Command Options


    | Option | Description |

    | --- | --- |

    | -a | File access information. |

    | -A | All data. (This is the equivalent of using all options together.) |

    | -b | Buffer activity information. |

    | -c | System call information. |

    | -d | Block device activity information. |

    | -f | Identifies a specific filename following the -f to be used as input. |

    | -g | Paging information. |

    | -k | Kernel memory allocation information. |

    | -m | Message and semaphore activity. |

    | -o | Directs sar to send output to a specific filename following the -o. |

    | -r | Unused memory page information. |

    | -u | CPU utilization information. |

    | -v | Status of processes. |


    ## ROBERT B. FAY


    ## The split Utility


    The *split* utility is used to split a file into pieces. Eventually, you will
    come across or create a file that is just too large to process, transmit, or store
    on portable media. For these occasions, the split utility is the perfect solution.
    The split utility can be used to split a large file by size or line / record count.
    The syntax of the split utility is very simple and can be easily inserted into
    a script loop to split one large file into several smaller files. The split utility
    will automatically name the output files with the name of the original file with
    an appended sequential suffix. The limitation of the split utility is 676 output
    files from one input file. The following table describes the options for the split
    utility.


    | Option | Description |

    | --- | --- |

    | -b n | Split a file into pieces n bytes in size. |

    | -b nk | Split a file into pieces n * 1024 bytes in size. |

    | -b nm | Split a file into pieces n * 1048576 bytes in size. |

    | -l | Split a file up by linecount. |


    The following is an example that splits a file called file1 into 100 line chunks.


    ```

    #split -l 100 file1

    ```


    ## The swap Utility


    The *swap* utility is useful for managing and monitoring the system swap areas
    used by the operating system memory manager. Swap space is essentially the logical
    area the system associates to the physical memory in your system. You may also
    create swap space from disk space. You just need to create a disk partition and
    tell the operating system it will be used as swap. You then need to use the swap
    utility to add the disk partition as a new swap partition. Although swap space
    is essential for optimal performance of your system, be cautious not to create
    more swap space than you need with disk partitions.


    Disk space is usually a premium commodity, and you do not want to waste it on
    swap space you don''t really need. However, if you have the disk to spare, using
    a disk partition as swap space can get you until you can purchase some memory
    for the system or migrate one of your memory-hogging applications to another server.
    Sometimes applications have what are referred to as *memory leaks*. Memory leaks
    that have been reported by enough customers are usually fixed by the next application
    patch set released, but you will have to deal with them while they are on your
    system.


    Memory leaks are when an application basically is not managing the memory it is
    using. The result is that the system memory eventually gets all used up. Rebooting
    the system will temporarily clean up the memory problem, but if you are running
    mission-critical applications, you may not be able to reboot your system. In this
    scenario, adding swap space may postpone the inevitable system reboot for a while.


    | Option | Description |

    | --- | --- |

    | -a | Add swap space. |

    | -d | Delete the specified swap space. |

    | -l | List the status of all defined system swap areas. |

    | -s | Display a summary of system swap areas. |


    To display a summary of swap statistics, use the swap command with the -s option
    as demonstrated in the following example:


    ```

    #swap -s

    ```


    ```

    total: 476904k bytes allocated + 38800k reserved = 515704k, 1367896k available

    ```


    To display a long or detailed listing of swap statistics, use the swap command
    with the -l option, as demonstrated in the following example:


    ```

    #swap -l


    swapfile dev swaplo blocks free

    /dev/dsk/c0r0d0s1 136,9 16 1049312 1049312

    ```


    ## The uname Command


    The [uname] command displays the machine’s unique hardware ID number. This is
    not the same as the frame serial number or part number for the operating system.
    The unique ID number is a combination of the hardware model, sub-model, and the
    ID of the server back plane. The unique ID for the entire system should be a 12-digit
    number.


    It has been my experience that the first two digits are always 00. These digits
    are perhaps place-holders for systems with longer model numbers or for information
    that is not yet or has ceased to be included in the uname output. The following
    table explains which options to use to display specific system information with
    the uname command.


    | uname Command Options | Description |

    | --- | --- |

    | -a | All information. |

    | -n | Node name. |

    | -m | Machine architecture. |

    | -p | Hardware name. |

    | -v | Operating system. |

    | -X | Number of CPUs. |


    ## The uptime Command


    The [uptime] command will tell you how long the system has been running. The uptime
    output includes the time since boot, the number of users logged in, and the load
    average for the last 1, 5, and 15 minutes.


    ```

    #uptime

    01:26:02 up 1:00, 1 user, load average: 0.10, 0.05, 0.15

    ```


    ## The vmstat (Virtual Memory Statistics) Command


    The vmstat command is used to display information about the current status of
    the active processes, memory, swap space, I/O (Input and Output), system, and
    CPUs. The simplest way to use vmstat is to type vmstat followed by a space, a
    number, another space, and another number. The first number is the delay and the
    second number is the number of samples. If you want to see 3 current lines, you
    should request 4 for the number of samples and disregard the first line as it
    follows.


    ```

    vmstat 2 3

    procs ----------memory----------swap-----io----cpu-----

    r b swpd free buff cache si bo in cs us id wa st

    0 0 446552 68624 296708 0 0 180 32 79 71 75 0 0 1 95 3 0

    0 0 446552 68624 296736 0 0 0 0 71 75 0 0 1 100 0 0

    1 0 446120 68628 296836 0 0 48 60 0 99 131 0 2 91 6 0

    ```


    The first line of the vmstat output is an average since the last system boot.
    Each line of the report after the first line is an average during the specified
    interval.


    | Header | Description |

    | --- | --- |

    | r | Number of processes waiting for run time. |

    | b | Number of processes in uninterruptible sleep. |

    | swpd | Amount of virtual memory used. |

    | free | Amount of idle memory. |

    | buff | Amount of memory used in buffers. |

    | cache | Amount of memory used in cache. |

    | si | Amount of memory swapped in from disk. |

    | so | Amount of memory swapped to disk. |

    | bi | Number of blocks received from a block device. |

    | bo | Number of blocks sent to a block device. |

    | in | Number of interrupts per second. |

    | cs | Number of context switches per second. |

    | us | Time spent in user mode. |

    | sy | Time spent in kernel mode. |

    | id | Time spent idle. |

    | wa | Time spent waiting for I/O. |

    | st | Time stolen by the hyper. |

