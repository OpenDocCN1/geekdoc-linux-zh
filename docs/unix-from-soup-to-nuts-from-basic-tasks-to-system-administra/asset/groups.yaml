    ## 标准输入和输出


    标准输入和输出，或所谓的 I/O，指的是接口。如果你使用图形界面，标准输入来自键盘或鼠标，而标准输出发送到屏幕。其他类型的输入和输出可以来自或发送到命令以及其他设备。


    一个命令的输出可以作为另一个命令的输入。`|` 字符被称为管道（pipe）。就像你家里水路中的管道一样，它将东西从一个地方传输到另一个地方。只有在这种情况下，我们使用管道来传输数据。数据通过管道从左向右流动。因此，管道左侧命令的输出就变成了管道右侧命令的输入。请尝试以下命令。它是无害的。在预告之前，它告诉此命令将一次一页地显示活动进程信息。使用回车键翻页。如果你使用的系统没有该命令，请用
    `more` 命令代替它。


    ```bash

    ps -ef | more

    ps -ef | more

    ```


    ## 入门


    ### 连接到 UNIX


    你有几种方法可以访问 UNIX 系统。访问 UNIX 机器的主要模式是通过终端。终端包括键盘和视频显示器。内核（Kernel）运行一个名为 `getty`
    的进程，它连接到 UNIX 系统，接受来自终端的输入并将输出发送到终端。`getty` 进程是实用程序，必须告知终端的能力以便正确地读取和写入终端。如果 `getty`
    进程接收到关于终端类型的错误信息，可能会发生意外。要显示当前的终端类型，请在命令提示符处输入以下语法：


    ```bash

    echo $TERM

    ```


    要将当前的终端类型更改为 vt100，请在命令提示符处输入以下语法：


    ```bash

    export TERM=vt100

    ```


    我发现 vt100 或 vt220 是运行在个人电脑上的终端程序的正确仿真。如果你使用的只是哑终端（dumb terminal），你应该能够准确地告诉操作系统你正在使用哪种显示器。显示器正面应该显示它是什么类型的显示。如果没有，旧的
    "wyse60" 似乎在许多哑终端上都有效。wyse60 仿真模拟了 Wyse 60 型终端的外观，因为它具有高分辨率字符单元可以显示清晰的字符而很受欢迎。当你通宵工作，因为有人承诺你会在不合理的时间内交付任务，而你最后只能收拾局面时，你会感激这些高分辨率字符的。


    ## 系统控制台


    ## UNIX 全方位指南


    控制台是一种在系统启动时被识别的特殊终端。某些 UNIX 系统操作必须在控制台上执行。通常，只有系统管理员可以访问控制台。拥有大量架式服务器的设施没有空间为每个服务器单独连接物理控制台。出于这个原因，某些供应商在其硬件设计中集成了一个端口，可以通过管理网络连接或临时笔记本电脑连接进行访问。我之所以说“临时”，是因为
    UNIX 执行其功能不需要连接控制台。它只是在维护或某种类型的故障阻止了远程连接时才需要它。


    SUN Microsystems 在其系统中开发了所谓的 LOM（带外外管理，Lights Out Management）端口。只要服务器连接了电源，即使操作系统宕机，LOM
    端口也将保持功能正常。LOM 连接允许系统管理员在系统无法完全运行或无法使用连接时进行维护。其他版本包括 ALOM、iLO 或 IDMI。


    ## 哑终端


    ### ROBERT B. FAY


    某些终端被称为“哑”终端，因为它们仅具有向 UNIX 系统发送字符作为输入以及从系统接收字符作为输出的能力。它们本身不能执行程序或在本地进行任何计算。个人电脑通常被用来仿真哑终端，因此它们可以远程连接。你有很多选择。许多是免费的，有些则不是。我在工作和家里都使用同一个免费程序。它被称为
    "putty"，我强烈推荐它。价格很合适，你可以自定义并保存会话参数，并且它提供了不同的连接方法，包括大多数安全意识型组织都要求的 ssh。要获取 putty
    副本，只需用你喜欢的搜索引擎搜索它即可。它很小且便携。我会在 U 盘上携带一个 putty 副本，这样就可以通过极少的设置访问我习惯的工作环境。我也把一个副本放在
    CD 中，放在公司的灾难恢复箱里。这是一个好主意，你永远不知道在灾难发生后是否还能从互联网下载东西。


