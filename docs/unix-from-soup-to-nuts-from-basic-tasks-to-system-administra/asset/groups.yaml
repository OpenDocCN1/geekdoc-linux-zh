    \ field, * and 0-6 and 0,1,2,3,4,5,6 all have the same meaning and are all legal\
    \ values. The hyphen in the 0-6 represents an inclusive range. In the previous\
    \ example, the numbers have been separated by commas. You do not need to list\
    \ a complete range of numbers to use the comma separator. You could have used\
    \ 0,3,5 if you just wanted to execute a command on Sunday, Wednesday, and Friday.\n\
    \n## UNIX From Soup To Nuts\n\nA pound sign (#) identifies a comment in the crontab\
    \ file. If the pound sign is in the first position on a line, then the whole line\
    \ is ignored. If the pound sign is to the right of the command string to be executed,\
    \ then everything to the right of the pound sign is ignored.\n\nYou may have noticed\
    \ that both the third and fifth fields of the crontab entry represents days. If\
    \ both of these fields include numerical values, the command string will be executed\
    \ on specified days. So if the third field has a 3 and the fifth field has a 2,\
    \ then the command string will be executed on the third day of the month no matter\
    \ what day of the week is as well as every Tuesday of the month. If the third\
    \ day of the month is a Tuesday, nothing special happens; the command string is\
    \ executed only once that day. The following are a few examples of legal crontab\
    \ entries:\n\n- 10 3 * * * /usr/sbin/test_script1 # This script will be executed\
    \ at 3:10 am every day of May.\n- 30 20 * * 1 /usr/local/bin/test_script2 # This\
    \ script will be executed at 8:30 pm on every Monday.\n- #10 22 * * * /usr/local/test_script3\
    \ # This script will not be executed because the pound sign in the first position\
    \ identifies the line as a comment.\n\nSimilar to cron is the [at] command. Unlike\
    \ cron, which is used to run jobs on a regularly scheduled basis, the at command\
    \ runs a job once and then forgets about it. I recommend that new UNIX users use\
    \ cron rather than because the scheduled jobs are much easier to keep track of.\
    \ If you still think you want to, take a crack at using the at command.\n\nThe\
    \ syntax is pretty straightforward. You just tell the system at the command line\
    \ that you want to execute something “at” a certain time. Like this: (at 0815am\
    \ Jan 24 uptime >>long.txt). In the previous example, the uptime command will\
    \ be executed and the output will be appended to a file called long.txt at the\
    \ designated time and date. The at command also accepts common definitions of\
    \ times in text format like now, noon, and midnight.\n\nThe privileges of the\
    \ at command are usually more secure than the crontab because of the possibility\
    \ of its malicious use. Don’t be surprised if you get a message from the system\
    \ like “at: you are not authorized to use at.\n\nSorry,” when you try to use the\
    \ at command. The privileges for the at command are controlled by the system administrator.\
    \ To modify the privileges for a user associated with the at command, you must\
    \ modify one of the following files depending on how the security has been setup\
    \ for the at command.\n\n```\n/usr/lib/cron/at.allow and /usr/lib/cron/at.deny\n\
    ```\n\nor\n\n```\n/etc/at.allow and /etc/at.deny\n```\n\nIf the at.allow file\
    \ exists, then only users listed in the file are allowed to use the at command\
    \ to submit commands for execution at a later time. The format of the at.allow\
    \ file is one user per line. No white space is allowed inside the file. The root\
    \ user is allowed to use the at command at all times, even if it is not listed\
    \ in the at.allow file.\n\nIf the at.allow file does not exist, the system will\
    \ check the at.deny file for a list of users that are not allowed to submit commands\
    \ for execution at a later time. The format of the at.deny file is the same as\
    \ the at.allow file. If the at.allow file does not exist and the at.deny file\
    \ is empty, then all users are allowed to use the at utility.\n\nThe reason the\
    \ privileges for the at command are so tightly managed is because once an command\
    \ has been submitted for later execution, it is not easy to detect as a scheduled\
    \ cron job that is plainly visible in the crontab file. Although the creators\
    \ of the at command had good intentions when they created it, the opportunity\
    \ for malicious users of the at command is too great. For the sake of security\
    \ and system stability, I recommend that the at command be used sparingly.\n\n\
