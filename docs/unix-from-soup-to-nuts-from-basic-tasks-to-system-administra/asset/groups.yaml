    ## 9 比较、排序和压缩


    本节专门介绍比较两个文件、排序文件和压缩文件的各种命令及其最常用的选项。比较文件的原因应该是非常直观的。还有其他方法可以判断文件是否完全相同。你可以通过文件的
    `chksum` 值确定两个文件是否相同。你也可以查看文件的大小、创建日期、行数和单词数。可以说，有许多方法可以确定两个文件是否相同。我们在这里介绍的是如何判断两个文件之间的差异。


    排序部分也相当直观。*sort 命令*用于对文件或命令输出进行排序，但它的功能不仅于此。我将讨论不同的文件和输出排序方法，包括一个用于按月排序日历文件的内置函数。


    压缩的方法有很多。我想简要讨论每种方法，并帮助你识别哪种方法可以创建并用于解压缩具有特定文件扩展的文件。文件压缩在很多方面都有用。压缩文件使其更容易备份、更容易传输、更易发送，并节省磁盘空间。希望压缩部分能提供足够的关于文件压缩方法的介绍，使你能够尝试不同的方法，并选择出符合你需求或至少让你日常使用起来最舒适的方法。如果你在这一章中只学到一件事，那应该是在
    UNIX 中做事情有多种方法。


    ## 使用 diff 比较文件


    `diff` 命令向你显示两个文件之间的差异。一旦学会了如何解释输出，它就会非常有用。使用 `diff` 的方法是在命令行中输入 `diff` 命令，后面跟着一个空格、文件名、另一个空格和另一个文件名。


    `diff` 命令将显示一个指向右的箭头 `>`，后面是位于第二个文件参数中但在第一个文件参数不存在的数据。第二个文件中每个不在第一个文件中的差异都会有一个这样的右箭头条目。如果文件相同，则不显示任何输出。下表包含你可能想要尝试的
    `diff` 选项。


