    The bash shell allows the primary prompt and secondary prompt to be customized.
    The variable that controls the primary prompt is PS1. The variable that controls
    secondary prompt is PS2. The bash shell will display the primary prompt when the
    system is at rest waiting for a command. The bash shell will display the secondary
    prompt when the system is waiting for further input. I like to define the primary
    prompt to display the userid I am using and the current directory I am sitting
    in. These two pieces of information can be displayed with the PS1 shell variable
