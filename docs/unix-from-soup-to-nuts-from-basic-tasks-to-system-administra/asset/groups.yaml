  - '[PAGE 178]


    # UNIX From Soup To Nuts


    A pound sign (#) identifies a comment in the crontab file. If the pound sign is
    in the first position on a line, then the whole line is ignored. If the pound
    sign is to the right of the command string to be executed, then everything to
    the right of the pound sign is ignored.


    You may have noticed that both the third and fifth fields of the crontab entry
    represents days. If both of these fields include numerical values, the command
    string will be executed on specified days. So if the third field has a 3 and the
    fifth field has a 2, then the command string will be executed on the third day
    of the month no matter what day of the week is as well as every Tuesday of the
    month. If the third day of the month is a Tuesday, nothing special happens; the
    command string is executed only once that day. The following are a few examples
    of legal crontab entries:


    +   - 10 3 * * * /usr/sbin/test_script1 # This script will be executed at 3:10
    am every day of May.


    +   - 30 20 * * 1 /usr/local/bin/test_script2 # This script will be executed at
    8:30 pm on every Monday.


    +   - #10 22 * * * /usr/local/test_script3 # This script will not be executed
    because the pound sign in the first position identifies the line as a comment.


    Similar to cron is the [at] command. Unlike cron, which is used to run jobs on
    a regularly scheduled basis, the at command runs a job once and then forgets about
    it. I recommend that new UNIX users use cron rather than because the scheduled
    jobs are much easier to keep track of. If you still think you want to, take a
    crack at using the at command.


    The syntax is pretty straightforward. You just tell the system at the command
    line that you want to execute something “at” a certain time. Like this: (at 0815am
    Jan 24 uptime >>long.txt). In the previous example, the uptime command will be
    executed and the output will be appended to a file called long.txt at the designated
    time and date. The at command also accepts common definitions of times in text
    format like now, noon, and midnight.


    The privileges of the at command are usually more secure than the crontab because
    of the possibility of its malicious use. Don’t be surprised if you get a message
    from the system like “at: you are not authorized to use at."'
