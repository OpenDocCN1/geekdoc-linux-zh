    ## Comparing Files with comm


    The `comm` command is used to display data that is unique for each file in a comparison
    of two files. The default output of the comm command displays three columns of
    data. The first column of data will display data that is unique to the first file
    argument. The second column of data will display data that is unique to the second
    file argument. The third column of data will display data that is common to both
    files. The following table includes options for comm that you may want to try.


    ## comm Options |

    | Option | Description |

    | :--- | :--- |

    | -1 | Suppress lines unique to the first file. |

    | -2 | Suppress lines unique to the second file. |

    | -3 | Suppress lines common to both files. |


    The contents of file1 are:


    One


    Three


    The contents of file2 are:


    Two


    Three


    When the comm command is used to compare file1 and file2, the following is the
    result:


    ```

    #comm file1 file2

    One

    Two

    Three

    ```

