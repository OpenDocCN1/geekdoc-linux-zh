    | | p | Override the n option. |

    | | s | Substitute the first occurrence on a line. |'
- md: "\n## ROBERT B. FAY\n\nAwk is not really well suited for large or complicated\
    \ tasks. Since awk is an interpreted language, awk scripts require the binary\
    \ to run them. This means basically that you cannot compile the awk script and\
    \ then run it by itself on a system that does not include the awk binary program.\
    \ Compared to compiled code, awk scripts run relatively slowly because every time\
    \ an awk script is run, the script is interpreted by the awk binary that is called\
    \ by the operating system. However, as I said, the difference between compiled\
    \ codes and interpreted script is vast in computer processing time, but to a human,\
    \ the difference is negligible. You probably will not even notice the script is\
    \ being read. Most of the time, the response to an executed awk script should\
    \ seem instant at the command prompt. If the processing time difference is a problem\
    \ for you, then you can purchase a second party application to compile and speed\
    \ up the processing time, but you will have to pay for such a program where awk\
    \ comes with the UNIX operating system at no additional charge.\n\nAlthough the\
    \ tasks I use for the most are quick and dirty juggling of data, awk can actually\
    \ be used for more sophisticated tasks, like creating small databases and performing\
    \ mathematical operations on files that contain numerical data. The mechanisms\
    \ that awk uses to perform functions are simple enough that people familiar with\
    \ programming languages like BASIC or C should pick it up with no problem. If\
    \ you have never worked with a programming language before, simply observe the\
    \ following one liner examples to figure out what individual functions awk can\
    \ perform, then move on to more complicated functions addressed by the database\
    \ section. You will have it figured out in no time.\n\n## Command Line Examples\
    \ (One Liners)\n\nIt is easy to use awk from the command line to perform simple\
    \ operations on text files. Suppose I have a file named “coins” that describes\
    \ a coin collection. Each line in the file contains the following information:\
    \ the mineral the coin is made of; the weight of the coin measured in ounces,\
    \ the date the coin was minted, the country of origin, and a description of the\
    \ coin.\n\n### Sample File for the Following awk Examples\n\n| Mineral | Weight\
    \ in Oz | Date | Country | Description |\n| :--- | :--- | :--- | :--- | :--- |\n\
    | gold | 1 | 1986 | USA | American Eagle |\n| silver | 10 | 1981 | USA | Ingot\
    \ |\n| gold | 1 | 1984 | Switzerland | Ingot |\n| gold | 1 | 1979 | RSA | Krugerrand\
    \ |\n| gold | 0.1 | 1986 | PRC | Panda |\n| silver | 1 | 1986 | USA | Liberty\
    \ One Dollar Piece |\n| gold | 0.25 | 1986 | USA | Liberty Five Dollar Piece |\n\
    | gold | 0.25 | 1987 | USA | Constitution Five Dollar Piece |\n| gold | 1 | 1988\
    \ | Canada | Maple Leaf |\n\nTo invoke awk to list all the gold pieces as follows:\n\
    \n```bash\n#awk '/gold/' coins\n```\n\nThe preceding syntax tells awk to search\
    \ through the file for lines of text that contain the string \"gold\", and print\
    \ them out. The result is:\n\ngold 1 1986 USA American Eagle\ngold 1 1984 Switzerland\
    \ Ingot\ngold 1 1979 RSA Krugerrand\ngold 0.1 1986 PRC Panda\n\ngold 0.25 1986\
    \ USA Liberty Five Dollar Piece\n\ngold 0.25 1987 USA Constitution Five Dollar\
    \ Piece\n\ngold 1 1988 Canada Maple Leaf\n\nThis sort of searching through a file\
    \ for content is easily enough accomplished with other UNIX commands like grep\
    \ or find, so you may ask yourself why you should learn how to use awk. While\
    \ it is true that grep and find are capable of finding the gold coins in the file,\
    \ awk is capable of doing so much more than just finding a target and displaying\
    \ what it finds. For example, suppose I am not interested in all of the information\
    \ in the coins file and just want to know the descriptions of the coins. With\
    \ awk I can easily omit the information I do not want. To accomplish this, all\
    \ I have to do is rerun the previous awk syntax and add the numerical variable\
    \ for the columns I want to print. In this case, I know that the description field\
    \ contains from one to four pieces of data (words) and begins in the fifth column\
    \ of the file. Remember for those lines in the file that have just a one- or two-word\
    \ description, awk will just ignore the missing columns or print them as blank.\
    \ Either way, it will look the same to you. So I would modify the previous syntax\
    \ to include columns 5 thru 8 as follows:\n\n```bash\n#awk '/gold/ {print $5,\
    \ $6, $7, $8}' coins\n```\n\nThe new output would then be as follows:\n\nAmerican\
    \ Eagle\nIngot\nKrugerrand\nPanda\nLiberty Five Dollar Piece\nConstitution Five\
    \ Dollar Piece\nMaple Leaf\n\nThe following example demonstrates the simplest\
    \ form of syntax in an awk script:\n\n```bash\n#awk <search pattern> {<program\
    \ actions>} filename\n```\n\nThe awk binary searches through the input file for\
    \ each line that contains the search pattern. For each line found that meets the\
    \ search criteria, awk then performs the specified actions. In this example, the\
    \ action is specified as {print $5, $6, $7, $8}, so awk prints the fifth through\
    \ the eighth column of data which in the coins file is the description. The purpose\
    \ of the print statement is to display column five through eight only. The preceding\
    \ $ with the numerical column identifier identifies it as a field variable, which\
    \ stores the words in each line of text by their [index].\n\nThe preceding $ with\
