    ### date 命令


    `date` 命令可以显示当前的日期和时间。它还可以用于各种方式格式日期和时间。例如，要以特定格式显示日期，可以使用以下命令：


    ```bash

    date +"%Y-%m-%d"

    ```


    `date` 命令还可以用于设置系统日期和时间。例如，要将日期设置为特定值，可以使用以下命令：


    ```bash

    date -s "2023-10-27 10:00:00"

    ```


    `date` 命令还可以用于计算未来的日期。例如，要找到 10 天后的日期，可以使用以下命令：


    ```bash

    date -d "10 days"

    ```


    | 选项 | 描述 |

    | :--- | :--- |

    | +format | 以指定的格式显示日期。 |

    | -d string | 显示指定的日期字符串。 |

    | -s string | 设置系统日期和时间。 |

    | -u | 显示 UTC 时间。 |


    ## UNIX 从入门到精


    ### wc 命令


    `wc` 命令可以用于统计文件的行数。它也可以用于统计单词数和字符。例如，要统计文件的行数，可以使用以下命令：


    ```bash

    wc -l filename

    ```


    `wc` 命令还可以用于统计单词数。例如，要统计文件的单词数，可以使用以下命令：


    ```bash

    wc -w filename

    ```


    `wc` 命令还可以用于统计字节数。例如，要统计文件的字节数，可以使用以下命令：


    ```bash

    wc -c filename

    ```


