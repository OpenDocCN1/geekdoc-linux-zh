    # UNIX 从入门到精通


    你的文件系统。如果你耗尽了 inode（索引节点），在达到 inode 限制时正在使用的命令或应用程序将生成来自操作系统的错误消息，提示无法创建文件。这是因为所有文件都是指向唯一
    inode 号的链接。每当程序引用文件名时，操作系统都会引用一个表来查找其对应的 inode 号。如果文件系统中的多个文件具有相同的 inode 号，那么它们就是彼此的硬链接。


    接下来的短练习将使你熟悉如何导航和操作目录。因此，如果你有一个可用的 UNIX 系统，请花时间在你的主目录中练习书中的练习。我建议你在主目录中执行这些练习。这可以防止任何权限问题或对系统文件的意外损坏。执行不带任何参数的
    `(cd)` 命令将带你回到主目录。要验证你的主目录路径是否符合预期，请执行 `(echo $HOME)` 命令。这将显示你的 `HOME` 变量的值。


    取决于主目录文件系统的设置方式，你的主目录可能是 `/home` 或 `/export/home` 的子目录。某些系统管理员会在专门的服务器上为用户创建主目录。然后，这些主目录会通过
    nfs 挂载到你登录的任何服务器，你所有的脚本和个人文件以及你创建的任何自定义环境变量都在那里。因此，每台服务器为用户提供相同的工作环境。这还节省了磁盘空间，避免了在每个拥有用户账户的服务器上为用户重复复制文件。


    # 文件系统、目录和路径的练习


    - 1. 哪个字符代表根目录？

    - 2. 绝对路径是指什么？

    - 3. 相对路径是指什么？

    - 4. `$PATH` 环境变量是做什么用的？

    - 5. NFS 缩写代表什么？

    - 6. JFS 缩写代表什么？

    - 7. `df` 命令是做什么用的？

    - 8. inode 的作用是什么？

    - 9. 使用什么命令可以显示你的主目录是哪里？

    - 10. 使用什么命令可以查看文件系统的 inode 信息？


    # 5 用户、用户组和权限


    ### 用户


    如果用户是在本地定义的，那么密码文件中将有一个该用户的条目。密码文件位于 `/etc/passwd` 或 `/etc/shadow`，取决于你正在使用的 UNIX
    操作系统的版本。如果你的系统有影子文件（shadow file），你应该对影子文件进行任何手动用户账户编辑，而不是 `passwd` 文件。系统将自动为你将你的更改插入到
    `passwd` 文件中。影子文件的目的是在系统运行时为你提供一个处理账户的地方。由于你实际上并没有在操作主 `passwd` 文件，因此你不会干扰尝试登录系统的用户。


    当你完成工作并将更改保存到影子文件后，系统将把影子文件与 `passwd` 同步，使它们一致。如果你的系统没有影子文件，你只能编辑主 `passwd` 文件。如果是是的话，我建议在开始之前为
    `passwd` 文件创建一个副本，并在副本上进行更改。完成后，你可以手动将副本移动到相应位置，并保存一个旧的 `passwd` 文件版本。如果你的更改引起了问题，旧的
    `passwd` 文件副本真的能救你的急。


    `passwd` 文件的问题可能会导致系统在重启时挂起。如果发生这种情况，最简单的解决方案通常是从可移动介质（如 DVD 或磁带）启动系统。一旦系统从可移动介质启动运行，你可以在另一个位置挂载根文件系统，并使用你在编辑文件之前保存的副本修改密码文件。大多数系统都有内置的备用启动项。查看你的根目录。如果你看到类似
    `/a` 这样没有明显用途的目录，那就是它的用处。如果你没有这样的目录，创建一个目录也就容易。对吧？修复了有问题的 `passwd` 文件后，只需移除可移动介质并重启系统。有了良好的
    `passwd` 文件，系统应该能够无问题地启动。


    `passwd` 和 `shadow` 文件以冒号分隔的格式存储关于每个本地定义系统用户的以下信息。


    | 字段 | 描述 |

    |------|---|

    | 用户名 | 你登录时使用的账户名称。 |

    | 密码 | 密码以加密格式存储。它们无法被查看或复制。 |

    | UID | 用户 ID - 系统使用数字识别用户。每个 UID 都是唯一的，并与唯一的用户名关联。 |

    | GID | 组 ID – 系统使用数字识别组。组的文本描述严格用于系统用户。 |

    | 注释 | 注释字段通常用于存储用户的全名以及公司或团队。（例如：John Smith – IFMC）。 |

    | 主目录 | 用户主目录的绝对路径。 |

    | 登录 shell | 用户默认 shell 的绝对路径。 |


    如果用户是在 ldap（轻量级目录访问协议）中定义的，那么相同的信息存储在中央 ldap 主服务器上。这允许信息与环境中的所有服务器共享。然而，这并不意味着用户将访问环境中的所有服务器。如果你有超过几台
    UNIX 服务器，你真的应该使用 ldap 来管理系统。


    ### 主目录


    主目录是用户存储个人文件和配置的地方。它是用户登录时的默认目录。主目录的路径在密码文件中指定。如果主目录不存在，用户可能无法正确登录。


    ### 密码


    密码用于验证用户身份。它以加密格式存储在影子文件中。`password` 命令用于更改密码。如果用户忘记了密码，系统管理员可以将其重置它。


    '
