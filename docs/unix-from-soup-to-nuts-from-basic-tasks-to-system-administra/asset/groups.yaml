    To modify the priority of a print job or cancel it, run the lpstat command and
    note the print job-id. After you have the print job-id, you may use the lp -q
    job-id option to change the priority. The default print job priority is 50. The
    lowest print job priority setting is 1, and the highest print job priority is
    100. You may cancel a print job with either the cancel or the lprm commands. The
    syntax of the cancel command is cancel job-id. Similarly, the syntax of the lprm
    command is lprm job-id.


    To cancel a print job, use one of the following commands:


    ```

    #cancel 101 (Where 101 is the job-id of the print job in the print queue.)

    ```


    ```

    #lprm 101

    ```


    To change the default print job priority, use one of the following commands:


    ```

    #lp -q 1 101 (This sets the priority of print job-id 101 to the lowest possible
    priority.)

    ```


    ```

    #lp -q 100 101 (This sets the priority of print job-id 101 to the highest possible
    priority.)

    ```


    You may also use the cancel command to cancel all active print jobs submitted
    by a user or all print jobs in a print queue. The lpmove command can be used to
