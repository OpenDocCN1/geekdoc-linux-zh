    # 10 BACKUPS


    One of the most important duties I perform as a UNIX system administrator is to
    manage and perform backups and restores of system and user files. A system without
    good backups is a disaster waiting to happen. I say good backups because I have
    both heard and experienced what can happen when you think you have a backup of
    something only to find out your backup media or your backup logic is insufficient
    when you need it.


    During my career as a UNIX systems administrator, I have had the opportunity to
    make backups with all kinds of devices from floppy disks to robot-controlled tape
    silos. Although I have used several different backup software packages made by
    various vendors, I prefer the tar command. Some of the reasons I like tar are
    because it is, free, it comes with or is portable to all flavors of UNIX, and
    it is very functional and easy to use. Additionally, I have discovered that some
    fancier backup software packages run tar processes in the background anyway.


    Take a look at your processes the next time a backup or restore job is running
    with some other backup software. You may be surprised to see a tar process out
    doing the work. This is because vendors have developed GUI or web interfaces that
    are intuitive for users to operate to perform backups that use tar as a back end.
    After all, why should they bother developing something that already exists when
    they can just give it a new look and sell it?'
  - '[PAGE 168]


    The tar command was designed to make tape archive files. But it has since been
    widely used as a method to save collections of files and directories in the form
    of a single file as well as to compress files and directories. The tar command
    creates a file, it makes an index of the files to be archived, and it makes a
    copy of the data to be archived in its file. After the tar file is created, it
    can be zipped up to save space. This makes it easier to move and restore large
    groups of files.


    The following syntax: (tar -cvf tarfile). In the previous example, the word tarfile
    represents the file or the name of the archive you are creating. I usually name
    them something that will help me remember what is in them. I also use the tar
    extension on the filename. This is not required, but it is a matter of convention.
    It tells people what type of file it is and lets them know what command to use
    to expand or restore it. The word file in the previous example represents the
    name of whatever you are backing up. It can be the name of a file, directory,
    or even a filesystem.


    To restore a tar file, use the following syntax: (tar-xvf tarfile location). Restoring
    a tar file will recreate the files and directories contained in the tar file in
    hierarchical order. It will restore them to the current working directory unless
    you give it an absolute path of where to starting restoring the files. The restore
    process with a tar archive does not remove the tar archive file. So what you will
    end up with is the newly restored files sitting in the directory with the tar
    archive you put in the same place. If you do not have room for both, you may need
    to put the tar file in an alternate location while performing the restore.


    To display the index or table of contents for a tar file, use the following syntax:
    (tar -tvf tarfile). Redirect the index output from a tarfile into a file that
    can be later printed or viewed with other UNIX commands, use the following syntax:
    (tar -tvf tarfile > /tmp/index). Redirect the index output from a tar archive
    that is on a backup tape into a file that can be later printed or viewed with
    other UNIX commands, use the following syntax: (tar -tvf /dev/rmt > /tmp/index).
    This is a good way to verify that you have backed up what you thought. If you
    redirect your index output into a file and then name the file with a date, you
    will have a record of what was backed up that day. You should stick these index
    files in a directory called Backup_Logs or something like that so they won''t
    get deleted and you know where to find them.'
  - '[PAGE 169]


    # ROBERT B. FAY


    # cpio


    The cpio utility is also used to perform backups. The name cpio describes the
    commands function. It is used to copy file archives in and out of devices, another
    file, or a pipe leading to another command. The input and output can be read from
    and written to tape devices or other mountable media.


    The cpio utility has many options that allow it to be quite a versatile tool,
    but personally I have never acquired a taste for it. But that does not mean the
    utility is completely without merit. I have in the past worked with another system
    administrator who seemed to be quite comfortable with regular use of cpio to perform
    backup and data transfer tasks. I think he just liked to use it because it was
    the first backup method he was taught and was comfortable with it. Like the tar
    utility, the cpio utility is free and comes with or is portable to all flavors
    of UNIX, the choice is yours.


    The cpio utility has three operating modes. the copy-in and copy-out modes copy
    files into an archive. It reads a list of filenames from standard input and writes
    the archive to standard output. An easy way to generate a list of filenames for
    input to cpio is with the find command. Just search for what you want to back
    up with the find command, and it will generate a list of absolute path filenames
    to feed to the cpio utility.


    Another cpio mode is the copy-pass mode. It copies files from one directory tree
    to another, combining the copy-out and copy-in steps. The destination directory
    is given as an argument. I recommend using the find command output as input to
    cpio as the copy-pass mode is more difficult to use than it needs to be, especially
    if you have already mastered how to pass output between commands with a pipe


    The cpio utility creates binary format archives by default. For the sake of compatibility,
    the creators of cpio had the foresight to have it evaluate and automatically recognize
    which kind of archive it is reading.


    The cpio utility creates archives in a slightly different manner than tar. While
    tar will archive everything from its starting point on down, including all subdirectories
    and their contents, cpio will only archive what it is exclusively instructed by
    the input list. To create an archive with the cpio command, use the -o (copy out)
    option. This will cause it to read a list of files from stdin, create the archive,
    and write the archive to stdout. An easy way to generate'
