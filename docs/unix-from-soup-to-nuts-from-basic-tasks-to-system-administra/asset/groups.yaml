    `pwd` 命令来查找你在系统目录结构中的确切位置。


    *parent directory*（父目录）一词指的是你工作目录上一一级的目录。因此，如果你的工作目录是 `/usr/local/bin`，那么父目录就是
    `/usr/local`。*child directory*（子目录）是指位于父目录内的任何目录。


