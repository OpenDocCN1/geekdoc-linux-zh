    # 2 WORKING WITH FILES


    Copy


    The copy [cp] command does just what the name implies. It makes an exact duplicate
    of the original file with whatever name you specify in your command syntax. The
    syntax of the copy command is cp [options] original_file new_file. While the contents
    of the new file will match that of the original file, the new file will be assigned
    its own inode. The inode is what the operating system uses to keep track of things
    like files. We''ll discuss inodes in more detail later. For now you just need
    to know that the operating system uses inodes as unique identifiers for all files
    on the system.


    The new file will inherit the default file permissions rather than that of the
    original file. If you need to be sure the new file possesses the same permissions
    and ownership as the original file, you will want to use the -p option. When used
    with the copy command, the -p option preserves the ownership and permissions of
    the original file for the new file.


    You do not need to be working in the source or destination directory being referred
    to in your copy command syntax. However, if you are copying to or from a directory
    other than your current working directory, you will need to provide the absolute
    path for the files you are working with. If you need to copy an entire directory,
    including its contents and any possible sub-directories, you will need to use
    the -r option. The -r option makes a recursive copy from the starting point until
    the last file of the innermost nested sub-directory has been copied.'
  - '[PAGE 44]


    # UNIX From Soup To Nuts


    | Command | Option | Description |

    | --- | --- | --- |

    | cp | | Make a copy of a file. |

    | | -p | Preserving the ownership and permissions. |

    | | -r | Recursive copy of a directory. |


    Occasionally, you may need to copy a file from one server to another. This task
    can be achieved with the *remote copy command* [rcp]. The use of this command
    will require some network configuration before it will work. Essentially, the
    two machines involved in the rcp syntax need to be aware of each other. This is
    accomplished by creating entries in the .hosts and /etc/hosts.equiv files. These
    two files are used to provide trusted remote authentication. For specific directions,
    you should consult the man page for .hosts, hosts.equiv on your particular flavor
    of UNIX. The configuration of these files will also enable the use of [rlogin]
    (remote login) and [rsh] (remote shell) commands. The syntax for the rcp command
    is (rcp original_file_remote_hostname:new_file). After the hosts.equiv and .hosts
    files have been configured correctly, the system should not ask you for a user
    name or password when executing an rcp command.


    | Command | Option | Description |

    | --- | --- | --- |

    | rcp | | Make a copy of a file from a remote host. |

    | | -p | Preserving the ownership and permissions. |

    | | -r | Recursive copy of a directory. |


    For those environments that demand an extra level of security, UNIX offers the
    *secure copy* [scp] command. The scp command is very similar to the


    35'
