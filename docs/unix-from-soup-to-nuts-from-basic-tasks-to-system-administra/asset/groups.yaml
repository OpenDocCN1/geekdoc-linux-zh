    # UNIX From Soup To Nuts


    # The iostat (Input/Output Statistics) Command


    As the name suggests, the [iostat] command is used to report input /output statistics
    as well as cpu, devices, and partition information. The simplest way to use the
    iostat command is to type iostat followed by a space, a number, another space,
    and another number and hit the enter key. The first number is the delay key and
    the second number is the number of lines of information to display.


    So if you were to enter iostat 2 3 and hit the return key, the system would respond
    with three lines of statistics displayed two seconds apart as follows. It should
    be noted that the first line of the report is an average since the last system
    boot. Each line of the report after the first line is an average since the last
    report line interval.


    ```

    #iostat 2 3

    ```


    | tty dad0 dad1 ramdisk1 sd1 cpu |

    | tin tout kps tps serv kps tps serv kps tps us sy wt id |

    | 0 10 158 14 25 608 53 35 0 0 0 0 7 46 37 0 18 |

    | 0 119 24 1 4 68 1 21 0 0 0 0 0 65 35 0 0 |

    | 0 40 145 25 4 40 3 7 0 0 0 0 0 66 34 0 0 |


    The following is an example of the iostat command option to use to display cpu
    utilization followed by the system output.


    ```

    #iostat -c

    ```


    ```

    cpu us sy wt id

    35 38 0 28

    ```


    The headers in the default iostat command without any options are explained in
    the following table. The headers will change depending on what options you execute
    with the iostat command. For further explanation of headers and report column
    information, please reference the iostat page on your operating system.


    # iostat Output Header Descriptions


    | Device | Header | Description |

    | --- | --- | --- |

    | tty | tin | Time receiving input from tty |

    | tty | tout | Time sending output to tty |

    | dad0 | kps | Kilobytes read per second |

    | dad0 | tps | Transfers per second issued to the device |

    | dad0 | serv | Time waiting for service |

    | dad1 | kps | Kilobytes read per second |

    | dad1 | tps | Transfers per second issued to the device |

    | dad1 | serv | Time waiting for service |

    | ramdisk1 | kps | Kilobytes read per second |

    | ramdisk1 | tps | Transfers per second issued to the device |

    | ramdisk1 | serv | Time waiting for service |

    | sd1 | kps | Kilobytes read per second |

    | sd1 | tps | Transfers per second issued to the device |

    | sd1 | serv | Time waiting for service |

    | cpu | us | Time spent running non-Kernel code |

    | cpu | sy | Time spent running Kernel code |

    | cpu | wt | Time spent waiting for IO |

    | cpu | id | Time spent idle. |


    The following is a table that includes common options executed with the iostat
    command to collect various devices. These types of options are handy. For example,
    you could make a script called check_disks that collects all information and then
    use sed and awk (I know I did it) to manipulate and format the output into a nice
    report. You will find that you and the people you support will be much happier
    if you can write scripts they can run on demand. It will also put an end to users
    coming to you and saying, "Can you run that report for me" and expecting you to
    know. This is better than experiencing system unavailability.


    | Option | Description |

    | --- | --- |

    | -c | Display CPU information. |

    | -d | Display disk information. |

    | -e | Display device error information. |

    | -m | Display filesystem mount point information. |

    | -n | Display device names in human readable format. |

    | -p | Display disk partition information. |

    | -x | Display extended disk information. |

    | -z | Do not display lines of information where all statistics report zero. |


    # The sar (System Activity Reporter) Command


    Use the [sar] system activity reporter to collect and display information from
    operating system cumulative counters. You do not have to set these counters up.
    They are constantly collecting information and refreshing themselves. However,
    you may save sar output. The following example demonstrates how to use sar with
    the -t option to retrieve and display unused memory statistics with 3 samples
    4 seconds apart.


    ```

    #sar -t 4 3


    00:20:28 freemem swap


    00:20:32 139528 2734464


    00:20:36 139527 2734464


    00:20:40 139527 2734464

    ```


    Average 139527 2734464


    The following table includes useful options for the sar utility. I have found
    that database administrators like to see sar reports. You will find that you and
    the people you support will be much happier if you can write scripts they can
    run on demand for database tuning or just for their own curiosity.


    If you find that you are writing a large number of report-generating scripts for
    users, you should consider writing a menu that users can launch and select scripts
    from. You will still have to set up users with permissions to access the menu
    and individual selections on the menu, but you will only have to do it once for
    each user. This is much better than manually running the save script for a user
    all the time.

