    Some other popular information to display in the prompt is the system hostname,
    OS level, and system kernel. The PS1 variable can be set dynamically in your shell
    or can be set in your profile to make it effect as you login. You are not required
    to make the secondary prompt different from the primary prompt, but it is a good
    practice it lets you know the system is waiting for further input. Be sure to
    make the difference between the primary and secondary prompts obvious enough for
    you to instantly recognize which prompt you are at. The secondary prompt should
    be something basic like ">".


