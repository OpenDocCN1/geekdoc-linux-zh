- md: '

    | lib | This is a library directory. Think of it as a physical library but for
    programs. You remember libraries, the place we used to go for information before
    the Internet. |

    | lost+found | This is where files are recovered by fsck (the file system check
    utility) after file system corruption is detected. This directory is normally
    empty. |

    | proc | This directory has a collection of files that each holds different types
    of system information. For example, the cpuinfo file contains information about
    systems processors. |

    | sbin | This directory is very similar to the bin directory. It holds executables
    and utilities. The difference is that sbin holds things that only the root or
    administrative users should have access to. For this reason, sbin is not put in
    a user’s $PATH variable by default. |

    | temp | This is a temporary directory. Do not put things in here that you need
    to keep. Things in this directory may disappear after the system is rebooted.
    |

    | tmp | This is a temporary directory. Do not put things in here that you need
    to keep. Things in this directory may disappear after the system is rebooted.
    |

    | usr | This is a directory that holds system binaries and applications. Most
    people pronounce the directories like “user,” but there is not user information
    stored here. The name usr is actually an acronym that stands for UNIX Shared Resources.
    |

    | var | This is the variable area of the operating environment. I am not sure
    if that is what the creators of UNIX had in mind when they called it var, but
    it seems to fit, so that is what I tell myself. What I mean by variable is that
    things in var are always changing. This area holds mail queues, print queues,
    logs... You get the idea. Don''t let var get full by a log or mailbox going unchecked.
    If it fills up, your operating system will not be able to write logs and you will
    soon notice a performance problem or perhaps experience an unexpected reboot.
    Normally this is not a problem, but it happens. A good system administrator will
