    servers, you will spend a great deal of time physically logging in to each server
    every time someone forgets their password or needs their access modified. If you
    are using ldap, you can make all changes from one central location and the changes
    will be propagated out to all ldap clients automatically.


    # The Home Directory


    A home directory can be on a local device or it can be mounted from another server.
    Keeping home directories on a central server and nfs mounting them to all other
    servers in an environment can be handy. NFS-mounted home directories allows users
    to have access to all of their files wherever they are logged in. Additionally,
    it stops users from asking the system administrator why files were deleted when
    the real problem is the user cannot remember which server they were logged into
    when they created a file.


    The home directory is where a user will be placed when they log in to the system.
    The home directory is where you should keep all of your files that you do not
    share with other users. Your home directory shares disk space with all of the
    other system users, so if you are not responsible about the housekeeping of your
    home directory, you may hear about it from other users or the system administrator
    when the /home or /export/home filesystem fills up.


    # Passwords


    Use the passwd command to change your password. Any user should be able to change
    their password. However, non-administrative users do not have the ability to change
    other users'' passwords. Password requirements can be configured by the root user.


    If your system account is being managed locally, and you need to change your password,
    just type passwd at the command prompt. The system will ask you to type your old
    password for user authentication. If you type the old'
  - '[PAGE 103]


    # ROBERT B. FAY


    password correctly, the system will prompt you for your new password. After you
    type the new password, the system will ask you to type it again. If you type the
    same, your password will be updated. If you get it wrong, the system will give
    you an error and you will have to start over. The reason the system asks you for
    your old password is to stop other users from changing your password if you leave
    your login session unattended. If you cannot remember your password, you will
    have to ask the system administrator to change it for you. The root user is the
    only user who can change your password without knowing what the old password was.


    If your system account is being managed with ldap, you will need to tell the system
    where the password repository is located before you can change your password (passwd
    -r ldap). When you use the -r flag, the system will check the ldap configuration
    to see where the password repository is and will change it there. An ldap account
    only needs to have its password changed on one server. The ldap repository will
    cause the new password to be used on all servers in the ldap environment. Passwords
    do not need to be changed on the ldap master server, but they can be.


    # Groups


    The UNIX operating system uses Groups to identify users that have the same level
    of access to directories and files. System Administrators may use groups to identify
    users that are working on the same project or who have the same job title. Groups
    are an effective level of security that adds granularity to the overall system
    security.


    Group permissions are the 5th, 6th, and 7th characters displayed by the ls -l
    command output. The group permissions may be changed with the chmod command. The
    group ownership of a file may be changed with the chgrp command by The groups
    may be used to display all groups a user is a member of. The Groups command will
    display both locally defined groups as well as those defined in ldap.


