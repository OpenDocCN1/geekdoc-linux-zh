    ### UNIX 图形用户界面 (GUI)、X 和窗口管理器


    重要的是，在 UNIX 操作系统中，GUI 是独立的。这与 Windows 操作系统不同，后者没有 GUI 就无法运行（或者功能大受限）。UNIX 的 GUI
    是一个位于核心操作系统之上的独立层。你可以从 UNIX 中完全卸载 GUI，你仍然拥有功能完整的操作系统。


    在我的雇主甚至拥有运行 GUI 所需的软件和硬件之前，我已经工作了多年，从未需要过 GUI。现在每当我面对启动 GUI 的系统控制台时，我第一件事就是找到工具并打开命令行界面。然后我可以使用真实的
    UNIX 命令直接与内核通信，完成实际工作或寻找乐趣，无论情况如何。


    X Window 系统的 11 版本是大多数现代 UNIX 系统的底层图形层。“X Windows”或“X11”，或者常说的“X”，提供了底层操作系统、图形应用程序和图形硬件之间的胶合剂。有很多为
    X 窗口系统编写的应用程序。


    X 本身并不是 GUI。相反，X 提供了 GUI 所需的设施，即接受来自鼠标和键盘等设备的输入以及在显示器上绘制图形对象的能力。因此，尽管名字如此，X 窗口系统并绘制“窗口”，至少按照现代对窗口的定义。这是另一个被称为窗口管理器的软件的工作。X
    有许多不同的窗口管理器。窗口管理器大部分定义了 GUI 的外观和感觉，


