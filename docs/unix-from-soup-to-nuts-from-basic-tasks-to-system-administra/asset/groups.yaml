    Another built-in in that is related to the directory stack is the popd. The popd
    built-in is responsible for removing directories from the directory stack.


    It is easy to toggle between two directories in the stack. To move backward one
    directory in the stack, use the cd command with two dots like “..” as your target.
    To go back two directories in the stack, just separate the dots with a slash like](../../”.
    To go forward in the stack, use the cd command with /.next_directory as you target
    where “next_directory” is actually the name of a directory. The single dot before
    the slash in /.next_directory refers to the current directory.


    The directory stack feature is handy when a person needs to frequently navigate
    back and forth between directories and having multiple try sessions open is more
