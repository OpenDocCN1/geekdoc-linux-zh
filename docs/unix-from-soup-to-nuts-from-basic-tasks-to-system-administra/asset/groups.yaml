    ## Command Not Found Errors


    The command not found error is very common. It usually means that you either spelled
    the desired command incorrectly or it is not in your $PATH. If you do not normally
    need the command in your path, you can execute it by entering the absolute path
    of the command. If you are sitting in the directory where the executable file
    resides, you can execute it by preceding it with a dot and a forward slash “./”.
